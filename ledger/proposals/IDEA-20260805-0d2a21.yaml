idea:
  id: IDEA-20260805-0d2a21
  question_id: RQ-SIG-001
  added: '2026-08-05'
  title: >-
    The goal says prime-field decomposition cost and every measurement is a
    boolean Weil-descent system: state the F_p analogue of the cascade exactly,
    derive which trivial families survive the change of field, and run the
    smallest cell where the answer can differ

  class: control

  claim: >-
    GOAL-SIG-001's objective is written in terms of "prime-field decomposition
    cost" and RQ-SIG-001's scope lists field_types: [prime field F_p, toy
    q = 2^16..2^24]. Every measurement the goal owns -- EV-SIG-001 through
    EV-SIG-010, EXP-SIG-001 through EXP-SIG-008 -- is on the BOOLEAN chained
    Semaev system, i.e. a system in F_2[x_1..x_{2n}]/(x_i^2 + x_i) obtained by
    Weil descent from a binary field. A grep across all ten SIG evidence records
    for prime-field or F_p language returns NOTHING (SESSION-CHECKED 2026-08-05).
    No record in the goal argues that a syzygy structure measured in char 2 with
    idempotent field equations transfers to a prime-field decomposition system,
    and there is a specific, derivable reason to doubt it: the goal's own
    "rewritable" family K_D includes the principal Frobenius / idempotency
    relations (1 + f_i) mu f_i, which exist BECAUSE f^2 = f in a boolean ring and
    have NO analogue over F_p. Their count under the instrument's own bound,
    sum_i sum_{k <= D - 2 d_i} C(2n, k), is 171 of the n = 9 D5 trivial family
    and 300 / 3624 of the n = 12 D5 / D6 families (SESSION-COMPUTED). So the
    boolean residual and any F_p residual are subtractions against DIFFERENT
    trivial modules, and a number carried from one to the other is not the same
    quantity. This proposal does not claim the cascade fails over F_p. It claims
    the transfer is unargued, that arguing it is cheap, and that the goal cannot
    meet its own completion criterion -- which names prime-field cost -- without
    it. Both outcomes are useful: either the cascade has an F_p analogue and this
    goal acquires its first measurement on the field its objective names, or it
    does not and eight experiments' worth of scope must be restated honestly.

  object_first_candidate:
    tracked_object: >-
      The trivial (rewritable) syzygy module itself, followed across a change of
      base field rather than across n or D: which generators of K_D are
      consequences of the ring structure (Koszul: f_j (mu f_i) + f_i (mu f_j),
      present in every commutative ring) and which are consequences of the FIELD
      (Frobenius/idempotency: (1 + f_i) mu f_i, present only where f^2 = f). The
      tracked object is the generator's provenance, and the question asked of it
      is survival under base change.
    established_families_off_limits: >-
      Off-limits as the primary lens: Weil descent and binary-field summation
      polynomials (they are the incumbent object and the source of the mismatch);
      semi-regularity modelling in char 2; the null-baseline lane; F5 signature
      theory; and -- explicitly -- any attempt to RE-DERIVE prime-field index
      calculus, which is GOAL-ECDLP-001 / GOAL-DREG-001 territory and is not what
      this proposal touches. The lens here is base change on a syzygy module,
      nothing more.
    newness_score: >-
      The observation is not deep and that is what makes its absence notable: it
      is a scope audit, available to anyone who reads the goal record next to the
      evidence records. It has not been made in this lane -- ten evidence records
      and eight specifications, read this session, and none mentions the field
      question. The nearest thing in the corpus is the ANGLE-BRIEF's F7 note that
      "the Macaulay tooling is x_i^2 = x_i, F_2 by construction", raised there
      about UOV over F_16/F_256; the same sentence applies to this goal's own
      objective and nobody has applied it here.
    testability_score: >-
      High at the derivation stage (pure counting, zero compute) and moderate at
      the measurement stage, which needs a prime-field Macaulay build the corpus
      does not have. The derivation alone decides whether the measurement is
      worth building.
    survival_score: >-
      The Koszul half of the trivial module survives base change trivially. The
      Frobenius half does not survive at all. That asymmetry is the whole
      content, and it is not a matter of degree -- it is a presence/absence
      statement that can be checked by reading the definitions.

  mechanism: >-
    WHAT CHANGES AND WHAT DOES NOT, derived rather than asserted.
    (1) TRIVIAL MODULE. Over any commutative ring the pairwise Koszul relations
    f_j (mu f_i) + f_i (mu f_j) = 0 hold. Over F_2[x]/(x_i^2 + x_i), which is
    isomorphic to F_2^{2^N} as a ring, EVERY element satisfies f^2 = f, giving
    the additional family (1 + f_i) mu f_i = 0 that koszul_principal_vectors
    builds as "principal Frobenius/annihilator". Over F_p[y_1..y_M] with p large
    and degrees far below p, the field equations y^p - y are unusable and NO such
    family exists. Counting the boolean instrument's Frobenius family under its
    own loop bound |mu| <= D - 2 d_i gives 9 / 171 / 1557 at n = 9 for
    D = 4 / 5 / 6 and 12 / 300 / 3624 at n = 12 (SESSION-COMPUTED, pure Python).
    An F_p residual computed against a Koszul-only K would therefore be compared
    against a trivial module smaller by those amounts. The two residuals are not
    commensurable and no record has said so.
    (2) CORROBORATION THAT THIS IS THE LOAD-BEARING DIFFERENCE. EV-SIG-006
    records that the pinned baseline gives sr_pred = 1674 / 9504 / 28068 at
    n = 9 D4/D5/D6 while "the textbook Bardet series (1,683/9,675/28,239) does
    NOT match the measured nulls". The differences are 9 and 171 (and 171 again
    at D6 only because both sums have frozen at the freeze degree) -- exactly the
    Frobenius counts computed above. Whatever the second formula is, the two
    candidate baselines in this goal's own record differ by precisely the
    field-dependent family. That is two numbers matching two numbers and it is
    offered as motivation, not proof; identifying the second formula is a step of
    the experiment.
    (3) SEMI-REGULAR BASELINE. The boolean baseline
    H(z) = (1+z)^{nb} / prod_i (1+z^{d_i}) is a char-2/idempotent-ring
    construction. The prime-field analogue for a generic (Froberg) system is
    prod_i (1 - z^{d_i}) / (1 - z)^{M}, truncated-positive. These are different
    series with different freeze behaviour, so the freeze law
    freeze = n/3 + 3 -- which EV-SIG-006 derives on this lattice and which drives
    the entire D >= 6 admissibility argument -- has no reason to carry over. Any
    F_p statement about where the baseline is valid must be re-derived, and the
    derivation is a truncated power series.
    (4) THE SYSTEM ITSELF. The boolean chained system has 2n variables with n
    quadratics and n cubics; nrows(12,6) = 183312 reproduces exactly from that
    description (SESSION-COMPUTED against EV-SIG-008). A prime-field
    decomposition system has a different shape entirely -- m summation variables
    over F_p with a factor-base condition -- and this proposal does NOT assume the
    shapes correspond. Establishing what the F_p analogue of the CHAINED
    construction is, precisely enough to build one instance, is stage 1 and is a
    genuine unknown to this proposal; it is stated as an unknown, not filled in.
    (5) WHAT WOULD MAKE THE TRANSFER LEGITIMATE. Either a stated correspondence
    that carries the boolean residual to an F_p quantity with a bound on the
    distortion, or a direct F_p measurement. Neither exists. Note the correct
    direction of caution: the corpus's own KN-OPEN-002 carries a
    prime-field-versus-binary non-transferability caveat that travels with the
    instrument (RELAYED via the session ANGLE-BRIEF; the entry itself was NOT
    READ this session and no claim is made about its contents beyond the
    existence of that caveat).
    (6) COST BOOKKEEPING FOR THE MEASUREMENT STAGE. Per-attempt cost is one
    Macaulay build over F_p at m variables and degree D, times a small sweep;
    inverse success probability is 1 (the measurement is deterministic). The
    binding cost is implementation, not compute: this container has numpy 2.4.6
    and NO Sage, NO Singular, NO msolve, NO sympy (SESSION-VERIFIED: `import
    sage` raises ModuleNotFoundError, `which sage singular msolve` returns
    nothing), while every SIG instrument is a .sage file importing sage.all. An
    F_p rank over a dense matrix is a numpy-with-modular-reduction task; a GF(2)
    rank is a bitmask task. Both are bounded ports and both are named as
    infrastructure work rather than assumed away.

  novelty_status: unverified

  literature_context:
    - >-
      INTERNAL, READ IN FULL: ledger/goals/GOAL-SIG-001.yaml (objective quoted
      above), ledger/RQ-SIG-001.yaml (scope quoted above), all ten EV-SIG records,
      and experiments/EXP-SIG-006/src/h013_f5_signatures.sage. The claim of
      absence is about those files and is stated as such.
    - >-
      NOT READ -- relayed claim. Prime-field index calculus for elliptic curves
      (the Diem / Gaudry line) and Semaev's summation polynomials are named in
      this corpus and are the presumed setting of "prime-field decomposition".
      NO PRIMARY SOURCE WAS READ IN THIS SESSION. No theorem, no complexity
      statement and no construction from that literature is asserted here, and
      stage 1 of the paired work is precisely to obtain and quote the definition
      of the prime-field decomposition system rather than to reconstruct it from
      memory.
    - >-
      RECALLED, UNVERIFIED: that Weil-descent-based decomposition applies to
      binary and extension fields while prime fields require a different
      factor-base construction, because F_p has no proper subfield. This is a
      candidate to check, not an authority, and the experiment records the check
      as a step.

  lossy_projection_identifiability_audit:
    projection: >-
      A syzygy module over F_2[x]/(x^2+x) --> the integer residual_D --> a
      sentence about "prime-field decomposition cost".
    what_is_discarded: >-
      The base field, the field equations, the shape of the system, and the
      construction that produced it. The second arrow discards the most.
    why_genuinely_lossy: >-
      The first arrow is the goal's ordinary measurement and its losses are
      handled elsewhere. THE SECOND ARROW IS THE SUBJECT OF THIS PROPOSAL and
      its loss is total: an integer carries no information about the field it was
      computed over, so nothing in the number itself can flag an illegitimate
      transfer. That is exactly why the check has to be made outside the number.
    why_compatible_with_the_operations: >-
      It is NOT established to be compatible, and the proposal exists to test
      compatibility rather than to assume it. Stating this plainly: the usual
      audit question ("does the retained part still propagate deterministically
      under the target's operations?") has the answer "unknown" here, because the
      target's operations are prime-field elimination and the retained part was
      computed under char-2 elimination with idempotent field equations.
    is_it_only_a_change_of_coordinates: >-
      Checked, and the more interesting finding is that the CONVERSE risk is
      live. A base change F_2 -> F_p is emphatically not a change of coordinates:
      the ring F_2[x]/(x^2+x) = F_2^{2^N} is not isomorphic to any localisation
      of F_p[y], the idempotency family exists in one and not the other, and the
      generic Hilbert series differ. The mirror failure (a projection constant
      across instances) does not apply because residual_D demonstrably varies.
      What the audit found instead is a THIRD failure mode not on the standard
      list: a projection that is fine on its own domain and is then read as a
      statement about a different domain. Naming it: DOMAIN DRIFT. It is not
      caught by either standard check and it is caught by reading the goal record
      next to the evidence records.

  assumptions:
    - >-
      That the goal's objective sentence means what it says. If "prime-field" in
      GOAL-SIG-001.objective is a drafting artifact and the intended target was
      always the binary/Weil-descent setting, then the correct outcome of this
      proposal is a Coordinator scope clarification and NOT an experiment. That
      outcome is cheap, is stage 0, and is listed first.
    - >-
      That K_D as built includes the Frobenius family. Verified by reading
      koszul_principal_vectors, which builds it explicitly under the comment
      "principal Frobenius/annihilator (1+f_i) mu e_i".

  predictions:
    - metric: >-
        Count of K_D generators with no F_p analogue, as a fraction of the
        trivial family, at (n = 9, D = 5) and (n = 12, D = 5) and (n = 12, D = 6)
      direction: higher
      minimum_effect: >-
        Strictly positive at every cell, with pre-derived counts 171, 300 and
        3624 respectively (SESSION-COMPUTED; to be re-derived in-harness). Zero
        at any cell would mean the Frobenius family is degree-inadmissible there
        and the transfer objection weakens at that cell.
    - metric: >-
        Whether the freeze degree of the F_p (Froberg) semi-regular series at the
        F_p system's own (M, degree histogram) equals n/3 + 3
      direction: different
      minimum_effect: >-
        The prediction is INEQUALITY, and it is a forced value once the F_p
        system's shape is fixed: the two series are different rational functions
        so their truncation points coincide only by accident. Equality at every
        tested size would be a genuine surprise and would strengthen the transfer.
    - metric: >-
        Existence of a degree-born non-rewritable component in the smallest F_p
        decomposition cell that can be built
      direction: different
      minimum_effect: >-
        Reported as present/absent with its dimension against a Koszul-only
        trivial module and a Froberg baseline. NO threshold is pre-registered
        because no prior measurement exists to threshold against, and inventing
        one would be a fabricated expectation. What IS pre-registered is the
        comparison structure: the same three-way (system, matched null, planted
        positive) design the boolean lane uses.
    - metric: >-
        Number of SIG evidence records whose stated scope would need restating if
        the transfer is not argued
      direction: higher
      minimum_effect: >-
        This is a documentation count, derivable at zero compute: ten. Recorded
        because the honest consequence of a negative outcome is a scope
        correction across the lane, and stating its size in advance prevents the
        finding being reported as smaller than it is.

  minimal_test:
    design: >-
      Cheapest-first, and the first two stages cost nothing.
      STAGE 0 (reading, TERMINATES THE LINE ON ONE ANSWER): ask the Coordinator
      whether GOAL-SIG-001.objective's "prime-field" is intended. If the goal is
      binary-field by intent, the deliverable is a scope-clarification note and
      NOTHING FURTHER RUNS. This is the most likely outcome and it is the cheapest
      and it is still worth having.
      STAGE 1 (derivation, zero compute): re-derive the Frobenius counts
      in-harness; write out the Koszul-only trivial module over F_p; write out
      the Froberg baseline and its truncation; state precisely which committed
      SIG quantities have an F_p analogue and which do not. This stage alone
      produces the deliverable if stage 0 says the objective stands.
      STAGE 2 (literature, bounded): obtain and QUOTE a primary definition of
      prime-field elliptic decomposition and its polynomial system. If it cannot
      be obtained, record that and stop -- do not reconstruct it from memory.
      STAGE 3 (infrastructure, bounded and reported as such): a pure-Python /
      numpy F_p Macaulay rank, since the container has no Sage. A failure here is
      infrastructure signal and NEVER negative mathematical evidence (AGENTS.md
      rule 5).
      STAGE 4 (the smallest F_p cell): m = 3, the smallest p and factor-base
      bound for which an instance exists, with matched null and planted positive.
    controls:
      - >-
        NULL OBJECT WITH A FORCED VALUE THAT CAN FAIL: a generic (random) F_p
        system with the same M and the same degree histogram as the constructed
        decomposition system. Forced value under the Froberg model: extra_D = 0
        below the truncation degree. This is the exact analogue of the boolean
        null and it can fail in the same ways; if it fails at D <= 4, the F_p
        instrument is uncalibrated and no F_p conclusion may be drawn.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: the
        BOOLEAN system itself, run through the ported pure-Python pipeline. It
        must reproduce the committed boolean anchors (sr_pred(12,6) = 156520,
        nrows(12,6) = 183312, residual_5(n=12) = 878). IF THE PORT DOES NOT
        REPRODUCE THE BOOLEAN NUMBERS, NO F_p RESULT MAY BE REPORTED AT ALL --
        the port is the instrument and the boolean lane is its only ground truth.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS: run the SAME pipeline over
        F_2, F_3, F_5, F_7 on structurally identical small systems (same M, same
        histogram, same support pattern) and report the trivial-module size and
        the residual as a function of characteristic. Monotone or flat behaviour
        across p >= 3 with a discontinuity at p = 2 is what the Frobenius argument
        predicts; a smooth curve through p = 2 would refute it. This localises the
        field effect instead of leaving "F_p is different".
      - >-
        ORDERING CONTROL: the boolean-reproduction arm is run, recorded and
        hash-committed before any F_p number is read.
      - >-
        ARCHIVE CHECK: every committed SIG quantity is tabulated with its field,
        its system shape and its registration status, so the scope statement rests
        on a table rather than on prose.
    required_metrics:
      - trivial-module decomposition into Koszul and field-dependent parts, per cell, with counts
      - the Froberg truncation degree for the F_p system, with the series printed
      - a verbatim quotation of the prime-field decomposition system's definition, or a recorded failure to obtain one
      - boolean-reproduction results from the ported pipeline, reported first
      - the characteristic sweep table with p = 2, 3, 5, 7

  falsification_conditions:
    - >-
      The Coordinator confirming the objective is binary-field by intent. The
      transfer objection is void and the deliverable shrinks to a scope note.
    - >-
      A stated correspondence being found in the literature that carries the
      boolean residual to an F_p quantity with a bounded distortion. The objection
      is answered and the correspondence becomes the goal's most valuable
      structural ingredient.
    - >-
      The ported pipeline failing to reproduce the committed boolean anchors. No
      F_p conclusion may be drawn; the finding is a port failure.
    - >-
      The characteristic sweep showing no discontinuity at p = 2. The
      Frobenius-family argument is wrong and the field difference is not where
      this proposal put it.

  confounders:
    - >-
      SHAPE MISMATCH SWAMPS FIELD MISMATCH. The F_p decomposition system is
      almost certainly a different SHAPE (variable count, degrees, chaining) and
      not merely the same shape over a different field. That means a raw
      comparison of residuals across fields would be confounded by shape, which
      is why the characteristic sweep holds shape fixed and varies only p. The
      shape question is separate and is named, not folded in.
    - >-
      THE ENVIRONMENT IS THE BINDING CONSTRAINT AND IT IS DISPUTED IN THE
      SOURCES. This session verified directly: numpy 2.4.6 present; sympy, Sage,
      Singular, msolve absent; src/ic_first_fall_fast.py fails to import on
      `from sage.all import GF, Matrix`. The session ANGLE-BRIEF records two
      scouts disagreeing about this environment. The measurement stages are
      therefore gated on a port, and any budget that assumes an existing solver
      is wrong.
    - >-
      SCOPE AUDITS ARE CHEAP TO PRODUCE AND READ AS RIGOUR. A scope objection
      costs almost nothing to raise and can look like diligence while producing
      nothing. Stages 2-4 exist so that raising it obliges the proposer to either
      supply the missing measurement or record precisely why it cannot be
      supplied.
    - >-
      THIS PROPOSAL COULD BE USED TO DEVALUE WORK. Nothing here says the boolean
      measurements are wrong, poorly made, or worthless -- they are careful,
      replicated, and the lane's determinism record is unusually good. The claim
      is about the SENTENCE the numbers are attached to, and the interpretation
      limits below bind that.

  interpretation_limits:
    - >-
      Toy scale throughout (AGENTS.md rule 7), and the F_p cells would be the
      smallest in the program.
    - >-
      A confirmed non-transfer does NOT weaken H-SIG-001, does NOT invalidate any
      committed measurement, and does NOT close any direction. It would mean the
      boolean cascade is a boolean result and must be stated as one -- which is
      AGENTS.md rule 6 applied to a field rather than to a size.
    - >-
      FORWARD GUIDANCE, per inventor protocol section 4, supplied now: if the
      transfer fails, the open successors in priority order are (a) build the
      smallest genuine F_p decomposition cell and start the measurement series
      the goal's objective actually asks for, (b) look for a correspondence
      carrying char-2 syzygy structure to char-p, which would be a structural
      ingredient of the kind docs/target-result-profile.md prizes, and (c) restate
      the ten SIG evidence records' scope by SUPERSEDING records, never by
      editing them.
    - >-
      No status change and no goal transition is proposed. Whether the objective
      stands as written is a Coordinator question and stage 0 asks it rather than
      answering it.

  heuristic_assumptions:
    - id: HEUR-FIELD-1
      statement: >-
        None load-bearing for the headline. "The identity f^2 = f holds for every
        element of F_2[x_1..x_N]/(x_i^2 + x_i) and has no analogue in
        F_p[y_1..y_M] at degrees below p" is an algebraic fact, not a
        distributional assumption, and the counts derived from it are exact.
      rigorous_support: >-
        F_2[x]/(x_i^2+x_i) is isomorphic to F_2^{2^N} as a ring, in which every
        element is idempotent. Over F_p the only idempotents in the polynomial
        ring are 0 and 1.
      validation_plan: >-
        The characteristic sweep at p = 2, 3, 5, 7 on structurally identical
        systems; the discontinuity at p = 2 is the observable.
      falsification_condition: >-
        A field-dependent trivial family appearing at p >= 3 in the sweep.
    - id: HEUR-FIELD-2
      statement: >-
        The generic/semi-regular baseline for a prime-field system of M variables
        with degree histogram (d_i) is the truncated-positive Froberg series
        prod_i (1 - z^{d_i}) / (1 - z)^M.
      random_model_justification: >-
        This is the standard genericity model for polynomial systems over a large
        field; it is named as a heuristic because Froberg's conjecture is a
        conjecture, and because the boolean lane's own experience (EV-SIG-006's
        finding that no histogram-only recalibration exists at or above the
        freeze degree) is a direct warning that generic baselines fail exactly
        where they are needed.
      validation_plan: >-
        The F_p matched null arm at D below the truncation degree; extra_D = 0 is
        the forced value.
      falsification_condition: >-
        Nonzero extra_D for the generic F_p null below the truncation degree.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES HERE and the proposal says so. What it governs is which
      exponent the goal is entitled to talk about: GOAL-SIG-001's objective names
      prime-field decomposition cost, and no measurement in the goal is over a
      prime field, so at present the goal cannot state an exponent for the
      quantity its objective names. Fixing that is a precondition for exponent
      talk, not a substitute for it.
    memory_exponent: >-
      n/a for the derivation stages. The measurement stages are bounded by the
      smallest buildable F_p cell and are deliberately far below the lane's
      memory frontier.
    best_known: >-
      n/a -- no algorithm proposed and no competitor. The incumbent SCOPE
      statement is the ten SIG evidence records' boundaries fields, which
      correctly say "boolean chained Semaev" and are not the thing being
      corrected; the goal-level sentence is.
    hidden_overhead: >-
      The whole measurement path hides an unbudgeted port: no Sage in this
      container. Estimated at a bounded implementation task (a GF(p) rank over a
      dense matrix plus the existing pure-Python monomial bookkeeping, which
      src/ic_first_fall_fast.py's own docstring says is already pure Python), but
      it is unbudgeted until scoped and it is stated here rather than discovered
      mid-run.
    tradeoff_note: n/a.

  dominated_by: >-
    null, after this check. TIME / MEMORY / DATA: this proposal claims no
    algorithm and competes with nothing, so no frontier row can dominate it; the
    comparison that matters is against the goal's OTHER routes to its completion
    criterion, and it is cheaper than all of them at stages 0-1 (reading and a
    power series) while being the only one that addresses the objective's stated
    field. Rows checked for prior treatment of the field question in this lane:
    all ten EV-SIG records (grep for prime.field / F_p: zero hits), all eight
    EXP-SIG specifications, ledger/RQ-SIG-001.yaml, ledger/H-SIG-001.yaml,
    ledger/goals/GOAL-SIG-001.yaml, and the SIG coordination checkpoints
    (SESSION-CHECKED 2026-08-05). None found. Absence of a search result is not
    evidence that nothing exists, and the ANGLE-BRIEF's T-H warning that this
    corpus's novelty screens are weak applies.
  sota_delta: >-
    Quantitative where it can be. (1) It identifies 171 / 300 / 3624 trivial-family
    generators at three committed cells that have no analogue over F_p, so any
    cross-field carry of residual_5 or residual_6 is mis-normalised by those
    amounts -- a specific number, not "different". (2) It supplies the first
    stated F_p baseline for this lane (the Froberg truncation) against the
    boolean one that has been used exclusively. (3) Its cheapest decisive stage
    is a question to the Coordinator costing zero, and its second is a power
    series costing minutes, against a lane whose current next_action is a
    deferred calibration executor requiring a ~200k-column echelon. Delta against
    the status quo: the goal presently has no route at all to a statement about
    the field its objective names.

  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.55 that the objective's "prime-field" wording is intentional and the
    transfer gap is real and unargued; conditional on that, 0.80 that the boolean
    residual has no clean F_p analogue at the trivial-module level, because the
    Frobenius family's absence is an algebraic fact rather than a conjecture. The
    combined figure is not higher because the single most likely outcome overall
    is stage 0 returning "the objective wording is loose, the goal has always
    been the binary Weil-descent object", which voids the proposal at zero cost
    -- and a proposal whose most likely outcome is its own voiding should say so
    in its prior rather than in a footnote. It is not lower because the wording
    is not incidental: it appears in the goal's objective AND in RQ-SIG-001's
    scope block AND in the completion criterion's framing, three independent
    places, while the word F_p appears in zero of the ten evidence records. It is
    also not lower because the recommended priority is medium precisely to
    reflect that the expensive stages are contingent on a cheap answer that may
    close the line.
