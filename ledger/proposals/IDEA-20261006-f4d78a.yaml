      verified_by: null
  assumptions:
    - tau is the 3-power map x |-> x^3, and tau^2 is x |-> x^9.
    - At A-characteristic (T) the constant term of Phi_T is 0, so Phi_T(x) = g x^3 + Delta x^9.
    - Delta runs through F_3 nonzero and g through F_3, six modules.
    - On F_3 every element satisfies x^3 = x and x^9 = x.
    - The annihilator is taken in F_3[T] acting on the additive group of F_3, not on a geometric torsion module.
    - Anderson motives are not computed.
  predictions:
    - metric: number of distinct annihilator scalars lambda among the six modules
      direction: different
      minimum_effect: 3
    - metric: number of modules realizing each lambda in {0, 1, 2}
      direction: different
      minimum_effect: 2
    - metric: Carlitz scalar lambda
      direction: different
      minimum_effect: 1
    - metric: rank-3 neighbor scalar lambda
      direction: different
      minimum_effect: 2
  minimal_test:
    design: >-
      For each of the six pairs and for both controls, evaluate the
      unreduced polynomial at {0, 1, 2}. Record the unique c in F_3
      such that Phi_T(x) = c x for all three points, or record that
      no such c exists. Compare the six values with the level sets
      (1, 2), (2, 1) for 0; (0, 1), (2, 2) for 1; (0, 2), (1, 1) for
      2. Do not form a characteristic polynomial and do not count
      geometric roots.
    controls:
      - Carlitz Psi_T = tau on F_3. The prediction is lambda = 1. lambda = 0 on this control supports the reading that every Drinfeld action kills F_3.
      - Rank-3 neighbor rho_T = tau^2 + tau^3 on F_3. The prediction is lambda = 2. Equality with the Carlitz scalar supports the reading that rank does not change the prime-field multiplier.
      - Direct evaluation of g x^3 + Delta x^9, without first replacing x^9 by x. Disagreement with (g + Delta) x withdraws the exponent reduction and is not a negative about the annihilator.
    required_metrics:
      - lambda_of_each_of_the_six
      - carlitz_lambda
      - neighbor_rank3_lambda
  falsification_conditions:
    - Some scalar in {0, 1, 2} occurs 0 times or more than 2 times among the six.
    - A module has no single c with Phi_T(x) = c x on all of F_3.
    - The Carlitz scalar is not 1.
    - The rank-3 neighbor scalar is not 2.
    - Unreduced evaluation disagrees with multiplication by g + Delta. The reduction step is withdrawn and the annihilator claim is not scored.
  confounders:
    - Replacing the base field by F_9 makes x^9 = x still true and x^3 not the identity, so the same polynomial is no longer multiplication by g + Delta.
    - The norm of the principal ideal (T - lambda) is 3 for every lambda. A norm-only printout erases the scalar this idea measures.
    - Height, the least tau-valuation of Phi_T, is a different partition of the same six pairs. This idea records lambda, not that valuation.
  interpretation_limits:
    - One prime field, three rational points. No statement about the annihilator of a geometric torsion module.
    - KN-LIT-174 does not define chi_Phi in the opened note. This generator is not a computation of that characteristic.
    - q = 3 only. No transfer to a larger constant field.
    - No ECDLP exponent is in scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Every a in F_3 satisfies a^3 = a and a^9 = a, so
        g a^3 + Delta a^9 = (g + Delta) a. This imitates Fermat's
        little theorem for the prime field, not a distribution of
        random polynomials. The sample is all three field elements and
        all six modules. No extrapolation.
      rigorous_support: >-
        The polynomial X^3 - X splits completely on F_3 and has at
        most 3 roots, so it is zero on F_3. The same holds for
        X^9 - X = (X^3 - X) * (a cofactor). KN-LIT-174 states no such
        identity. The identification of (T - lambda) with an
        Euler-Poincaré ideal is not claimed.
      validation_plan: >-
        Evaluate g x^3 + Delta x^9 and (g + Delta) x at x in {0, 1, 2}
        for every pair (g, Delta). Any nonzero difference withdraws
        H1 for that pair. The Carlitz polynomial x^3 and the neighbor
        polynomial x^9 + x^27 are the same check at rank 1 and rank 3.
        Tail check: the sample is the whole field, so there is no
        untested element of F_3.
  target_complexity:
    time_exponent: >-
      No ECDLP exponent is in scope. The census evaluates 8 additive
      polynomials on 3 points.
    memory_exponent: >-
      O(1) field elements. The stored table is 8 scalars in F_3.
    best_known: >-
      Exhaustive evaluation on F_3. Opened baselines KN-LIT-174,
      KN-LIT-1515, KR-IC-b0fcda, and KR-RHO-2480c6 give no annihilator
      scalar for these modules.
    hidden_overhead: >-
      None. There is no o(1) term. The field is listed in full.
    tradeoff_note: >-
      No time-memory tradeoff and no parallel split. The census is
      smaller than the multiplication table of F_3.
