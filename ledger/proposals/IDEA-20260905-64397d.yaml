idea:
  id: IDEA-20260905-64397d
  title: Orbit stabilizers and the second factorial moment of relation supply
  class: mechanism
  claim: 'For a factor base consisting of complete automorphism orbits, the mean raw tuple count is insufficient
    to predict independent relation supply. Conjecture: a stabilizer-weighted second factorial moment identifies
    whether orbit clustering increases the waiting time for genuinely new relation-orbits beyond a size-matched
    random base.'
  mechanism: The diagonal automorphism action partitions admissible tuples. Burnside-type orbit accounting handles
    fixed tuples, while the second factorial moment counts pairs of distinct tuple-orbits with the same public sum.
    Orbit copies add no informative rows, but two different orbits may still overlap substantially. The tracked
    object is therefore a weighted pair-incidence measure on tuple-orbits. If mean yield stays constant while pair
    incidence rises, rare high-multiplicity targets can create misleading averages. This is a mathematical relation-supply
    question untouched by the weakened matrix-structure hypothesis.
  question_id: RQ-EQIC-8cb959
