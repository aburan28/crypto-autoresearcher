idea:
  id: IDEA-20260813-02479f
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  title: >-
    Sample-access-model realizability audit: can a single, bounded ML-KEM
    public key ever supply the Q = k*n^(c+1) independent-faulty-sample access
    model Simon 2026's DCP algorithm assumes, or does self-reduction spend the
    entire noise budget getting there
  class: control
  claim: >-
    Every algorithm in the Regev/Kuperberg/Simon DCP family (KN-TECH-d1bc4f)
    is stated in an oracle/idealized-sampler model: it assumes access to
    arbitrarily many INDEPENDENT draws of the coset-sampling superposition
    for a FIXED secret d. A real attack against a single, standardized
    ML-KEM public key does not have that access model for free: the public
    key supplies exactly k rows (k in {2,3,4}) of one Module-LWE matrix
    instance, and any additional "sample" an attacker constructs must come
    from PUBLIC linear self-reduction (random small-coefficient combinations
    of the k given rows plus fresh public randomness), a standard classical
    LWE technique that provably INFLATES noise variance roughly linearly in
    the number and size of the combining coefficients. This proposal claims
    that a direct, closed-form evaluation of how much the self-reduction-
    induced noise variance grows when generating Simon's own required
    Q = k*n^(c+1) (c >= 12) samples from ML-KEM's actual k in {2,3,4} real
    rows, at ML-KEM's actual dimension n (roughly k*256), discriminates
    between two outcomes: (a) the self-reduction cost stays within a regime
    where the resulting noise rate remains inside Simon's own 1/O(log n)
    tolerance budget, meaning the abstract oracle-model result, IF Q1 and Q2's
    other sub-questions also resolve favorably, could in principle transfer
    to a concrete single-public-key attack; or (b) generating anywhere near
    Q = k*n^(c+1) virtual samples from k in {2,3,4} real rows via self-
    reduction blows the noise variance so far past any usable regime that the
    abstract result is UNREALIZABLE against a single ML-KEM public key
    regardless of whether Simon's Lemma 3 is eventually verified -- a closure
    that would apply even in a world where the rest of the DCP paper is
    completely correct.
  mechanism: >-
    Tracked object: the noise variance of a self-reduction-derived "virtual"
    MLWE sample, as an explicit function of (number of real rows k available,
    number of combining terms m used to build one virtual sample, coefficient
    magnitude bound of the combination, and the base CBD(eta) variance of
    ML-KEM's own error distribution), compared against the target faulty-
    sample-rate budget 1/O(log n) that Simon's own stated theorem requires,
    evaluated at the actual Q = k*n^(c+1), c >= 12 sample count and ML-KEM's
    actual n. This is a pure ACCESS-MODEL / INTERFACE audit in the sense of
    KN-TECH-080's proof-obligation vocabulary: it checks whether the
    abstract algorithm's assumed input interface (an idealized independent-
    sample oracle) is actually instantiable from the concrete object under
    attack (one bounded public key), independent of whether the algorithm
    itself, once given that interface, would work. The lossy-projection
    test: tracking only the noise-variance-versus-sample-count curve
    discards the entire quantum algorithmic mechanism and even the entire
    reduction-quality question of IDEA-20260813-0cf345, retaining only the
    classical, purely arithmetic question of how many usable virtual samples
    a bounded key can supply -- this is compatible with the target
    computation because it is exactly the resource (sample count vs. noise)
    every algorithm in this family explicitly trades against, per
    KN-TECH-d1bc4f's own noise/approximation-factor table.
  novelty_status: unverified
  novelty_screen:
    local_kb_status: >-
      crypto-kb MCP tools unavailable this session; screened via direct grep
      of committed knowledge/ and ledger/ at snapshot commit
      083ca0026281c05e85570e5bddf90adbd4954d69 (see retrieval-screen.yaml).
    screened_proposals: >-
      No prior RQ-QALG-457b41 filings exist. Distinct from sibling
      IDEA-20260813-0cf345 (which measures the REDUCTION's induced noise
      rate assuming an idealized sample oracle) by instead measuring whether
      that many samples can be MATERIALIZED at all from a bounded key;
      distinct from IDEA-20260813-8aa6ea (which explores a specific relief
      mechanism, Galois orbits) by instead directly computing the raw
      arithmetic blow-up from the most standard relief mechanism (linear
      self-reduction) to establish a baseline severity before any relief
      mechanism is even considered.
    adjacent_corpus:
      - KN-LIT-e204ab
      - KN-OPEN-8a5965
      - KN-TECH-d1bc4f
      - KN-LIT-21383c
    external_screen: >-
      No live web search available this session. LWE's public linear self-
      reducibility (random combinations of given samples with fresh public
      randomness) is standard background in the LWE hardness-reduction
      literature, not independently re-verified here beyond the elementary
      variance-additivity argument stated in "mechanism" above; its
      APPLICATION to bound Simon 2026's specific Q = k*n^(c+1) requirement
      against a single ML-KEM key is not found anywhere in this program's
      corpus and is recorded as unverified pending an actual literature
      check this session could not perform.
    nearest_neighbors: []
  assumptions:
    - >-
      "One public key" is the realistic passive-attacker model this RQ's own
      constraints require (matched cost accounting against the best known
      QUANTUM attack, which itself operates against a single target key);
      this proposal does not consider a model where the attacker has
      compromised or aggregated multiple independent public keys, which would
      be a different, out-of-scope threat model.
    - >-
      The exact relationship between Simon's paper's "n" and ML-KEM's actual
      lattice dimension is stated in KN-LIT-e204ab's own review as needing to
      be checked against the original before use ("the n^2 dimension figure
      in particular is taken from Simon's summary and should be checked
      against the original before use"); this proposal's first step is
      pinning that correspondence down before any numeric evaluation, exactly
      as IDEA-20260813-0cf345 does for its own formula extraction.
    - >-
      This proposal assumes standard (not adversarially weakened) linear
      self-reduction as the sample-generation mechanism; it does not rule out
      that some cleverer, not-yet-published sample-generation technique could
      do better, and this limitation is stated explicitly in
      interpretation_limits.
  proof_search_map:
    bottleneck: >-
      Whether the noise variance accumulated by generating Simon's required
      Q = k*n^(c+1), c >= 12 virtual samples via standard linear self-
      reduction from ML-KEM's actual k in {2,3,4} real rows stays within, or
      catastrophically exceeds, the 1/O(log n) faulty-sample tolerance the
      algorithm needs -- independent of whether Lemma 3 (IDEA-20260813-
      4aecda) or the base reduction's noise rate (IDEA-20260813-0cf345) are
      separately favorable.
    baseline_embedding:
      parameter_slice: >-
        The degenerate case m=1 (each virtual sample IS one of the k real
        rows, no combination) is the parameter slice reproducing the
        original, unmodified oracle-model assumption exactly (each of the k
        samples independently faulty at the base rate, zero self-reduction
        noise inflation); this baseline trivially supplies only k in
        {2,3,4} samples, nowhere near Q, and is the fixed reference point
        every self-reduction variant (m > 1 combining terms) is compared
        against.
      reproduction_check: >-
        Symbolic check that the noise-variance formula at m=1 reduces
        exactly to ML-KEM's own base CBD(eta) variance with no inflation
        term, confirming the general formula (for m >= 1) correctly
        specializes to the trivial case before trusting it at larger m.
    observation_collision:
      observable: >-
        The pair (number of virtual samples generated, resulting noise
        variance per virtual sample).
      distinct_preimage_search: >-
        Search for a combining strategy (choice of m and coefficient bounds)
        that achieves a LARGE sample count while keeping variance growth
        SUB-linear in m, by exploiting any structure in ML-KEM's CBD(eta)
        error distribution or the module's ring structure (overlapping in
        spirit with, but computed independently of, IDEA-20260813-8aa6ea's
        Galois-orbit mechanism) -- if no such favorable combining strategy
        exists under the standard variance-additivity model, the observable
        (sample-count, variance) pair is dominated by a simple linear trade-
        off with no exploitable slack, and the closure below follows
        directly from arithmetic alone.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A target-specific measure: the noise variance of a virtual sample
          built by combining m of the k real rows with small (e.g. {-1,0,1}
          or CBD-bounded) public coefficients, as a function of m, evaluated
          up to the m needed to reach Q = k*n^(c+1) virtual samples (accounting
          for how many DISTINCT combinations of m out of k rows, or of m
          independent public-randomness draws per combination, are even
          available before combinations repeat or exhaust their entropy).
        predicted_gain: >-
          Not a speed gain; a closure-scale measurement. The predicted
          (not yet confirmed) severity, given k is only 2-4 and Q needs to
          reach roughly n^13 with n in the hundreds (i.e. Q on the order of
          10^36 or larger), is that no combinatorially available self-
          reduction strategy from k in {2,3,4} rows can supply anywhere near
          Q DISTINCT, low-variance virtual samples -- but this must be shown
          by the actual arithmetic, not asserted, since the exact scaling
          could in principle be more forgiving than this rough estimate
          suggests.
    quantifier_order: >-
      Simon's theorem states: for all n, there EXISTS a sample-generation
      procedure supplying Q = k*n^(c+1) independent-enough faulty samples,
      such that the algorithm succeeds. This proposal checks whether that
      existential clause is satisfiable AT ALL from a single bounded ML-KEM
      key's k real rows via the standard (linear self-reduction) sample-
      generation procedure -- if no such procedure exists at ML-KEM's actual,
      non-asymptotic n, the existential clause fails for THIS specific
      concrete instantiation, regardless of the asymptotic theorem's truth
      for an idealized oracle.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, this audit can certify whether STANDARD linear self-
        reduction from k in {2,3,4} real rows can or cannot realistically
        approach Q = k*n^(c+1) virtual samples within Simon's own noise
        budget at ML-KEM's actual n -- it cannot certify that NO conceivable
        sample-generation technique could ever do so (a cleverer, not-yet-
        published technique, possibly combined with IDEA-20260813-8aa6ea's
        Galois-orbit mechanism, is explicitly out of scope for this specific
        proposal and named as an open direction below).
      nearby_object_control: >-
        The nearby object where the hoped-for "realizable" conclusion is
        known to hold trivially is the DEGENERATE case Q <= k (no self-
        reduction needed at all, using only the k real rows directly); this
        proposal's finding is only informative to the extent it establishes
        how far past that trivial floor the actual required Q sits, and by
        what multiplicative noise-cost factor.
    proof_obligations:
      - claim: >-
          The noise-variance formula reduces to ML-KEM's base CBD(eta)
          variance at m=1 with no inflation.
        responsibility: baseline
      - claim: >-
          The exact correspondence between Simon's "n" and ML-KEM's lattice
          dimension is pinned down (reading the original Regev/BKSW/Simon
          derivations, not guessed) before any numeric Q is computed.
        responsibility: correctness
      - claim: >-
          The combinatorial ceiling on distinct low-variance combinations
          available from k in {2,3,4} rows is computed explicitly, not
          asserted.
        responsibility: size
      - claim: >-
          The final verdict (realizable / unrealizable at ML-KEM's actual
          parameters) is reported with its exact numeric gap, not only a
          qualitative verdict, so a reviewer can check the arithmetic.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: n_to_lattice_dimension_correspondence
      direction: different
      minimum_effect: >-
        A pinned-down, cited correspondence between Simon's/Regev's "n" and
        ML-KEM's actual module dimension (roughly k*256), replacing the
        currently-flagged-as-unverified figure in KN-LIT-e204ab's own review.
    - metric: required_virtual_sample_count_q
      direction: different
      minimum_effect: >-
        The exact numeric value of Q = k*n^(c+1) at ML-KEM-512/768/1024's
        pinned-down n, using Simon's own stated c >= 12, k > c bounds (taking
        the paper's own minimal c=12 for a lower-bound-on-severity estimate).
    - metric: self_reduction_noise_inflation_at_required_q
      direction: higher
      minimum_effect: >-
        The noise variance per virtual sample when generating anywhere close
        to the required Q from k in {2,3,4} real rows via standard linear
        self-reduction; "higher" because variance-additivity guarantees
        growth with the number of combined terms, and the open question is
        only the exact numeric severity, not the direction.
    - metric: realizability_verdict
      direction: different
      minimum_effect: >-
        A binary verdict (realizable within budget / unrealizable) at each of
        ML-KEM-512/768/1024, with the exact numeric margin by which the
        self-reduction noise rate does or does not exceed the 1/O(log n)
        tolerance.
  minimal_test:
    design: >-
      (1) Read the original Regev 2004 (KN-LIT-21383c) and, if accessible,
      Simon 2026's own stated derivation to pin down the exact functional
      correspondence between the DCP group-order exponent "n" and ML-KEM's
      module dimension, resolving the flagged uncertainty in KN-LIT-e204ab.
      (2) Compute Q = k*n^(c+1) at c=12 (the paper's own stated minimal
      value) for ML-KEM-512, -768, -1024's pinned-down n. (3) Derive the
      closed-form noise-variance growth of a linear self-reduction virtual
      sample as a function of the number of combined terms m and coefficient
      bound, using ML-KEM's actual CBD(eta) base variance (eta=2 or 3 per
      standardized level). (4) Compute the combinatorial ceiling on distinct,
      bounded-coefficient combinations available from k in {2,3,4} real rows
      before combinations must repeat or the coefficient-size budget is
      exhausted. (5) Evaluate whether reaching Q via any feasible combining
      strategy keeps the resulting noise rate within Simon's 1/O(log n)
      budget, reporting the exact numeric margin either way. This record
      authorizes no execution beyond literature reading and closed-form/
      numeric evaluation; no ML-KEM implementation or quantum simulation is
      authorized.
    controls:
      - >-
        Baseline-embedding check: m=1 reduces exactly to ML-KEM's base
        CBD(eta) variance with zero inflation, verified before trusting the
        general m-dependent formula.
      - >-
        Trivial-floor check: confirm the degenerate Q <= k case is trivially
        realizable (sanity check on the formula's correctness at the low
        end before evaluating it at the astronomically larger required Q).
      - >-
        Sensitivity check: report how the realizability verdict changes
        under the paper's own stated range c in [12, higher], since larger c
        makes Q larger (worse) but per KN-OPEN-8a5965 also changes the
        failure-probability bound, so the tradeoff must be reported rather
        than fixed at one arbitrary c value.
    required_metrics:
      - pinned n-to-dimension correspondence with citation
      - required Q at each standardized ML-KEM level, at c=12
      - noise-variance-vs-m closed form, with baseline (m=1) check
      - combinatorial ceiling on distinct low-variance virtual samples from
        k in {2,3,4} rows
      - realizability verdict and exact numeric margin per level, with a
        sensitivity range over c
  falsification_conditions:
    - >-
      The noise-variance formula does not reduce to the base CBD(eta)
      variance at m=1: this falsifies the proposal's own baseline embedding
      and blocks any further conclusion until corrected.
    - >-
      The realizability verdict is "realizable within budget" (noise stays
      inside 1/O(log n) even at the required Q) at any standardized level,
      robustly across the sensitivity range over c: this REFUTES this
      proposal's own predicted severity and means the sample-access-model
      obstruction is NOT what closes this route at that level, redirecting
      remaining scrutiny fully onto Q1 (IDEA-20260813-4aecda) and the base
      reduction-noise question (IDEA-20260813-0cf345).
    - >-
      The realizability verdict is "unrealizable" (noise rate exceeds budget
      by an overwhelming margin) at all three standardized levels, robustly:
      this is a positive finding for this proposal's hypothesis (b), and
      should be recorded as a named, scoped closure of the concrete-attack
      reach question (Q2) for standard self-reduction specifically,
      independent of Q1's resolution.
  confounders:
    - >-
      Using an unpinned or guessed n-to-dimension correspondence instead of
      the value actually derived from reading the original papers; this is
      exactly the gap KN-LIT-e204ab's own review flags and step 1 of the
      minimal test exists to close it before any numeric claim is made.
    - >-
      Reporting only a qualitative "unrealizable" verdict without the exact
      numeric margin, which would prevent a reviewer from checking whether
      the conclusion is robust or borderline.
    - >-
      Treating a favorable (realizable) verdict as evidence the ATTACK
      itself works; realizability of the sample-access model is a NECESSARY,
      not sufficient, condition, and is silent on Lemma 3's correctness or
      the base reduction's own noise rate.
  interpretation_limits:
    - >-
      This proposal audits only STANDARD linear self-reduction as the
      sample-generation mechanism; a not-yet-published cleverer technique
      (possibly exploiting Galois-orbit structure per IDEA-20260813-8aa6ea,
      or some other public symmetry) is explicitly out of scope and named as
      an open direction, not ruled out.
    - >-
      A closure finding here applies specifically to the standard-self-
      reduction access model at ML-KEM's three standardized levels; it does
      not close the possibility that some future, differently-shaped noise-
      tolerant DCP algorithm with a much smaller required Q (not
      Simon's specific c>=12 construction) could still be realizable.
    - >-
      Results here do not transfer to RQ-QALG-122b59 or RQ-QALG-74bf20 per
      GOAL-QALG-001's non_duplication note; HQC and CSIDH have different
      public-key structures and different sample-access models entirely.
  heuristic_assumptions:
    - id: H1-variance-additivity-transfer
      statement: >-
        The noise variance of a linear self-reduction virtual sample, built
        as a bounded-coefficient combination of m real MLWE samples plus
        fresh public randomness, grows as the sum of the individual
        combined-term variances (Var(sum c_i e_i) = sum c_i^2 Var(e_i) for
        independent e_i), matching the standard treatment of LWE self-
        reduction in the classical hardness-reduction literature.
      rigorous_support: >-
        This is a direct, elementary consequence of variance additivity for
        independent random variables (a finite, exact instance of the
        Central Limit Theorem's variance-additivity property, not an
        asymptotic approximation), applied to ML-KEM's own CBD(eta)-
        distributed error coefficients, which have finite, explicitly known
        variance (eta/2 for CBD(eta)).
      validation_plan: >-
        This is closed-form arithmetic, not requiring empirical sampling;
        the "validation" is a symbolic derivation checked against the m=1
        baseline (must reduce to the known CBD(eta) variance exactly) and
        against a second sanity check (m=2 combining two independent CBD(eta)
        samples with unit coefficients must give exactly 2*eta/2 = eta
        variance, matching the well-known convolution property of the CBD
        distribution), both verifiable by hand before trusting the general-m
        formula used in the main evaluation.
  target_complexity:
    time_exponent: >-
      Not claimed. This proposal measures an access-model realizability gap,
      not an algorithm's runtime.
    memory_exponent: not applicable to this measurement.
    best_known: >-
      2^(0.2653 d + o(d)) time in the QRAM model (Laarhoven, KN-LIT-703), the
      RQ's own stated Grover-only baseline; this proposal audits a
      precondition for a hypothetical competitor to that baseline, not the
      baseline itself.
    hidden_overhead: >-
      If the realizability verdict is unfavorable (the predicted, though not
      yet confirmed, outcome given k in {2,3,4} versus Q on the order of
      n^13), the entire abstract "polynomial time" framing of Simon 2026's
      consequence hides an access-model gap that no adjustment of the
      algorithm's own internal parameters (c, k in Simon's own notation) can
      close, since increasing c only makes Q larger, worsening rather than
      relieving this specific obstruction.
    tradeoff_note: not applicable; no time-memory tradeoff is proposed here.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Literature reading (to pin the n-to-dimension correspondence) plus
      closed-form arithmetic evaluation; no lattice software, no ML-KEM
      implementation, no quantum simulation required. Likely the cheapest of
      the five proposals in this batch to execute.
  dominated_by: >-
    n/a (no attack or algorithm result claimed). Checked against the same
    frontier as every sibling proposal in this batch: Grover/quantum-walk
    sieve 2^(0.2653 d + o(d)) and quantum k-Sieve 2^(0.2989 d + o(d)) time /
    2^(0.1395 d + o(d)) memory (both KN-LIT-703), and the unverified Simon-
    2026-composed-with-BKSW claim (KN-LIT-e204ab); this proposal's
    deliverable is a realizability verdict for the latter's concrete
    instantiation against ML-KEM, not a displacement of either established
    baseline.
  sota_delta: >-
    Zero, quantitatively. This proposal claims no speedup; its deliverable
    is a binary realizability verdict with an exact numeric margin at three
    standardized parameter levels. If unfavorable (unrealizable) at all
    three, robustly, it is recorded as a named, scoped closure of the
    concrete-reach question for standard self-reduction specifically (per
    docs/inventor-protocol.md section 4), independent of and prior to Q1's
    resolution -- the cheapest possible way to learn whether the entire DCP-
    route family is already dead-on-arrival against ML-KEM's actual,
    non-asymptotic parameters, before spending further effort on Lemma 3's
    correctness.
  recommended_priority: high
  source_refs:
    - https://eprint.iacr.org/2026/1591
    - knowledge/literature/KN-LIT-e204ab.md
    - knowledge/open-problems/KN-OPEN-8a5965.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - knowledge/literature/KN-LIT-21383c.md
  enumerated_closures: []
  open_directions:
    - >-
      If the standard-self-reduction verdict is unfavorable, checking whether
      IDEA-20260813-8aa6ea's Galois-orbit mechanism (or some other
      not-yet-published technique) could close enough of the gap to change
      the verdict is a natural, explicitly-flagged follow-on, not attempted
      here.
    - >-
      Pinning down the exact n-to-dimension correspondence (step 1 of the
      minimal test) is independently useful to IDEA-20260813-4aecda and
      IDEA-20260813-0cf345 as well, and should be done once and shared
      across all three rather than repeated.
