idea:
  id: IDEA-20261006-df8024
  question_id: RQ-CSIDH-64343f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    At least one of the five CSIDH orders of discriminant -103, -107,
    -127, -131, -139 has a non-cyclic class group
  class: measurement
  claim: >-
    Let S be the set of primes 103, 107, 127, 131, and 139, each
    congruent to 3 mod 4. For each p in S let O_p be the quadratic
    order Z[(1+sqrt(-p))/2] of discriminant -p. Let c(p) be the
    number of invariant factors of the form class group of O_p that
    are strictly greater than 1, certified only when two independent
    enumerations return the same list. The claim is that the set
    {p in S : c(p) ≥ 2} is non-empty. The claim is not a comparison
    of two class numbers, and it states no security level for any
    CSIDH parameter.
  mechanism: >-
    The tracked object is the invariant-factor list of the class
    group, not the class number and not a Montgomery coefficient.
    The representation is the set of reduced positive-definite
    binary quadratic forms of discriminant -p. The operation set
    Sigma is Gauss composition of those forms. Sigma is not elliptic
    translation. Class: coordinate-dependent, because the
    invariant-factor list is a property of the whole group and is
    constant on forms. Lossy-projection test against Sigma:
    composition is discarded and one list of integers is kept. Many
    sets of forms share a list, so the projection is lossy, and
    composition does not change the list. Two outcomes are separated
    before any run. A non-empty set means that, inside this finite
    window, the odd part of a CSIDH-shaped class group is not always
    cyclic, which is the structure input the question asks to
    certify. An empty set means every one of these five groups is
    cyclic, so a cyclicity assumption happens to hold on this window
    and cannot be treated as a failure of the enumeration.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-508
      provenance: kb
      claim: >-
        The note, as filed, estimates how often a prime l fails to
        divide the class number of an imaginary quadratic field, and
        says that estimate matches Cohen-Lenstra in that indivisibility
        direction. It does not compute invariant factors for these
        five discriminants. The cyclic-mass formula used below is
        therefore not taken from this note.
      verified_by: knowledge/literature/KN-LIT-508.md
    - ref: Cohen-Lenstra heuristics for the odd part of imaginary quadratic class groups
      provenance: recalled
      claim: >-
        A random finite abelian odd-order group is weighted
        proportionally to 1 over the order of its automorphism group.
        Not opened in this session.
      verified_by: null
    - ref: genus theory for the 2-rank of a prime discriminant -p with p congruent to 3 mod 4
      provenance: recalled
      claim: >-
        That 2-rank is 0, so the class group has odd order. Not
        opened as a primary text in this session. Used only as a
        certificate check, not as the claim.
      verified_by: null
  assumptions:
    - >-
      Each discriminant -p for p in S is fundamental, and the form
      class group is the class group of O_p.
    - >-
      Two enumerations that return different lists do not certify
      c(p). That p is then unscored, not counted as cyclic.
    - >-
      No quantum oracle, gate set, or bit level enters the claim.
  predictions:
    - metric: number of p in S with c(p) at least 2
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      For each of the five discriminants, enumerate the reduced
      positive-definite binary quadratic forms and compute the
      invariant factors of the group under Gauss composition.
      Repeat with a second implementation that builds ideal classes
      in O_p and reduces them to the same form list. Score c(p)
      only on agreement. Report the set of p with c(p) at least 2.
    controls:
      - >-
        Each certified group has odd order. An even order fails the
        genus-theory check and voids that p.
      - >-
        The same two enumerations on the non-fundamental discriminant
        -108 must either disagree or be refused. Silent agreement
        with a fundamental-discriminant code path voids the run.
      - >-
        The class number, which is the product of the invariant
        factors, is recorded and then ignored. A write-up that
        ranks the five class numbers against each other is not this
        test.
    required_metrics:
      - the five invariant-factor lists
      - the agreement bit of the two enumerations
      - the parity of each certified group order
      - the cardinality of {p : c(p) ≥ 2}
  falsification_conditions:
    - >-
      All five certified groups have c(p) = 1. That empty set is the
      negative observation.
    - A certified group has even order.
    - The two enumerations disagree on any p that is then used in the count.
  confounders:
    - >-
      A form reduction that misses the reduced set changes the group
      order and can split or merge invariant factors.
    - >-
      Identifying opposite forms (a, b, c) and (a, -b, c) twice, or
      not at all, changes the set the composition law sees.
    - >-
      Small class numbers make Z/3 × Z/3 rare. An empty set on five
      primes is a small-sample outcome, not a theorem that every
      CSIDH class group is cyclic.
  interpretation_limits:
    - >-
      The count is not a Cohen-Lenstra probability and is not a
      CSIDH-512 structure.
    - >-
      Cyclicity does not decide a Kuperberg cost. The question's
      quantum models are not run.
    - >-
      An empty set closes only these five discriminants.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Imitating Cohen-Lenstra, the odd part of the class group of
        a fundamental discriminant -p is distributed as a random
        finite abelian odd-order group with mass proportional to
        1/|Aut(G)|. Under that measure the probability of a
        non-cyclic group is strictly positive, so a window of five
        primes can contain one.
      rigorous_support: >-
        Genus theory, recalled and unchecked here, forces the
        2-part to be trivial for these discriminants. No theorem
        opened in this session forces the odd part to be cyclic or
        forces it not to be. KN-LIT-508, as read, addresses
        indivisibility of the class number by a prime l, which is a
        different statistic.
      validation_plan: >-
        The quantity sampled is c(p) on these five primes, a
        complete window, not a random draw. The comparison is the
        observed non-cyclic count against 1, the minimum the claim
        requires, and against the mean 5·(1-π) once π, the cyclic
        mass, is computed from the Aut-weights of all odd-order
        groups of order at most the largest certified class number
        in the window. The tail check is whether any certified
        group order exceeds four times the median order in the
        window. The parameter is the five named primes. Transfer
        assumption: none. The count is not used at a 512-bit prime.
  target_complexity:
    time_exponent: >-
      unchanged. No hidden-shift exponent is stated. Generic
      discrete log in a prime-order group remains exponent 1/2
      (KR-RHO-13bf67) and is not this group.
    memory_exponent: unchanged. The output is five short lists of integers.
    best_known: >-
      The question's own target is a certified class-group structure
      at small CSIDH-like discriminants. This record does not improve
      a published quantum cost.
    hidden_overhead: >-
      None in an exponent. The gap between five primes and a
      cryptographic discriminant is not an o(1) term and is not
      claimed as one.
    tradeoff_note: >-
      No time-memory tradeoff. IDEA-20261005-1896e8's memory-cap
      ratio is a different instrument and is not evaluated here.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
