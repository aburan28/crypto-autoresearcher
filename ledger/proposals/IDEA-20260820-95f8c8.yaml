    - id: Fault attacks on Fiat-Shamir and post-quantum signatures, exact primary source not retrieved in this task
      provenance: recalled
      verified_by: null
  novelty_screen:
    method: >-
      Screened all 24 current RQ-SQISIGN-001 records and the supplied stale
      knowledge-index hits for a matching localized arithmetic-fault oracle.
    results: >-
      Prior records cover abort conditioning, generic transcript tests, verifier
      acceptance fibres, public strata, retries, length, path localization, and
      conversion choices. None of the screened mechanisms applies a declared additive
      coordinate fault immediately before normalization/rejection and tests the
      accepted public law while retaining rejection as an outcome.
    verdict: >-
      Unverified. Fault-analysis primary sources were not retrieved; local distinctness
      and low-specificity stale retrieval do not establish novelty.
  object_first_candidate:
    tracked_object: >-
      The public outcome law consisting of explicit rejection plus the verifier-stratum
      and labelled response-coordinate distribution of accepted transcripts.
    lossiness: >-
      Published response features may not preserve the affected intermediate, and
      acceptance conditioning can hide rather than reveal a fault.
    propagation: >-
      A coordinate perturbation can alter normalization, rejection, or the final public
      response representative, thereby tilting accepted strata.
    survival_score: >-
      Require consistent registered residuals for two deltas on held-out messages,
      calibrated true-simulator nulls, and successful recovery of a planted stratum tilt.
  predictions:
    - metric: chi-square residual norm of accepted verifier-stratum frequencies
      direction: increase relative to no-fault and true-simulator arms
      minimum_effect: Cramer V at least 0.10 with corrected p-value below 0.01
    - metric: held-out classifier AUC using public response fields with length removed
      direction: increase above chance
      minimum_effect: AUC at least 0.60 with 95% lower confidence bound above 0.55
    - metric: true-simulator null residual norm
      direction: remain calibrated
      minimum_effect: within the central 95 percent of permutation null replicates
  minimal_test:
    design: >-
      At a toy parameter set, freeze one step s, coordinate i, and two nonzero deltas.
      Generate balanced no-fault, O_coord-fault, true-simulator, and planted-positive
      arms. The planted positive accepts transcripts from one public verifier stratum
      with 1.25 times the baseline probability and reweights to preserve sample count.
      Record rejection explicitly and blind the analyst to arm labels until feature and
      threshold registration is complete.
    controls:
      - Matched no-fault true simulator with identical public-input conditioning.
      - Real signer with fault instruction present but delta equal to zero.
      - Planted 1.25-fold public-stratum tilt positive.
      - Fault at a dead diagnostic coordinate not consumed by normalization or output.
      - Two opposite nonzero deltas to test direction consistency rather than one lucky perturbation.
      - No timing, retries, raw signature length, power, cache, or internal branch observations.
    required_metrics:
      - Explicit rejection and verification rates with simultaneous confidence intervals.
      - Accepted-stratum histogram and Cramer V.
      - Coordinate-rank energy statistic and classifier AUC.
      - Plant-detection power and delta-by-message interaction.
  controls:
    - True-simulator no-fault null.
    - Zero-delta real-signer null.
    - Dead-coordinate nonzero-fault null.
    - Planted accepted-stratum tilt positive.
    - Opposite-delta replication.
  falsification_conditions:
    - >-
      Reject the mechanism for the tested step and coordinate if both nonzero deltas
      stay inside all registered null bands while the planted tilt is detected with at
      least 0.90 power.
    - >-
      Reject the coordinate-specific interpretation if the dead-coordinate or
      zero-delta control yields an equal or larger effect.
    - >-
      Mark the test invalid if rejected attempts are silently discarded, the true
      simulator fails calibration, or any timing or byte-length observation is used.
  confounders:
    - Acceptance conditioning alone can produce apparent structure unless modeled in every arm.
    - Delta addition may create invalid objects that exercise parser behavior rather than arithmetic normalization.
    - Coordinate labels can change under an ordinary representative convention.
    - Fault instrumentation may consume randomness or alter object lifetime.
  interpretation_limits:
    - A detectable accepted-law tilt is not a certified secret-recovery channel.
    - The oracle assumes localized modification of one intermediate coordinate.
    - The proposal is not passive abort-conditioning, retry latency, or length analysis.
    - Kani/published SQIsign-002 attack surfaces are excluded.
    - No result bears on GOAL-SSI-001 hardness or the KN-TECH-058 asymptotic baseline.
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        The named intermediate coordinate causally reaches either the declared
        normalization/rejection predicate or a labelled public response field.
      rigorous_support: >-
        Dataflow reachability is exactly inspectable for a fixed implementation, but
        statistical survival through later randomization is not guaranteed.
      distribution_imitated: A localized perturbation followed by acceptance conditioning.
      validation_plan: >-
        Verify fixed-input dataflow at toy scale, then remove internal labels and test
        only public outcomes on fresh inputs.
      falsification_condition: >-
        The coordinate is overwritten or algebraically cancelled before every
        acceptance decision and published field.
    - id: H2
      formal_statement: >-
        The registered public statistics have power for an acceptance-conditioned tilt
        of the minimum declared magnitude.
      rigorous_support: >-
        Exact multinomial and permutation calibration support the planted stratum
        model, not the real-fault alternative.
      distribution_imitated: A 1.25-fold reweighting of one public verifier stratum.
      validation_plan: >-
        Estimate power over tilt factors 1.05 through 1.25 and freeze N before opening
        the fault-arm labels.
      falsification_condition: >-
        The planted 1.25-fold tilt is not detected with at least 0.90 power.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: >-
      This is not a solver. KN-TECH-058's relevant baseline is unconditional Fp2
      p^(1/2)(log p)^O(1) time with polynomial memory and conditional p^(1/3+o(1))
      time and memory under Heuristic 1.
    hidden_overhead: >-
      The registered audit is O(Nd) after transcript production. KN-TECH-058's
      conditional row retains superpolynomial hidden overhead and no concrete claim.
    tradeoff_note: >-
      More strata increase sample complexity and memory but do not improve a
      cryptanalytic exponent. Reductions and the GRH boundary remain unverified.
  cost_model:
    time: O(Nd) public-feature audit plus O(N) standard verification
    memory: O(Nd) batch features or O(d plus number_of_strata) streaming summaries
    data_or_queries: 5N invocations across no-fault, two deltas, simulator, and planted arms
    preprocessing: Freeze step, coordinate, deltas, public strata, feature map, message split, and thresholds
    oracle: >-
      O_coord-fault adds one declared nonzero field element to one declared coordinate
      immediately before a named boundary; it returns no time, retries, length, secret,
      power trace, cache state, or branch label.
    verification: O(N) standard verification and independent replay of public parsing, stratum assignment, and statistics
  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce no-fault signer, zero-delta, and true-simulator public outcome laws
      within registered bands before inspecting nonzero-fault arms.
    observation_collision_search: >-
      Test whether parser rejection, coordinate relabelling, instrumentation-induced
      randomness consumption, or ordinary acceptance conditioning yields the same tilt.
    quantifier_order: >-
      For each fixed toy parameter set, implementation, step, coordinate, pair of
      deltas, public-input sampler, feature map, and sample budget, probability is over
      precommitted messages and seeds; no claim quantifies over other faults.
    method_ceiling: >-
      The method can show a public distributional response to the chosen perturbation,
      but cannot establish secret dependence, recovery, forgery, or asymptotic impact.
    nearby_object_control: >-
      Apply the same additive perturbation to a diagnostic coordinate proven unused by
      normalization and output; an effect there falsifies the localized causal reading.
  nearest_neighbors:
