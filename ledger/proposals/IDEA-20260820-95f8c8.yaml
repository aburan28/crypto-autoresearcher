idea:
  id: IDEA-20260820-95f8c8
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Accepted-transcript bias from a single-coordinate arithmetic fault oracle
  class: distributional implementation-fault audit
  claim: >-
    A localized arithmetic fault applied before response normalization or rejection
    can change the distribution of verifier-accepted public transcript strata even
    when only ordinarily valid signatures are released. This proposal claims a
    falsifiable distributional audit for one explicit oracle, not a timing or side
    channel, secret-key recovery, forgery, Kani attack, or improvement to SSI algorithms.
  mechanism: >-
    Define O_coord-fault(s, i, delta) to add a declared nonzero field element delta to
    coordinate i of one named intermediate public-response object at signing step s,
    immediately before a declared normalization/rejection boundary. The signer then
    completes its ordinary checks; emitted signatures are processed without timing,
    retry, power, or branch information, and rejection remains an explicit outcome.
    If the rejection boundary is anisotropic across coordinates or public verifier
    strata, conditioning on eventual acceptance can tilt the published response law.
    Measure stratum-frequency residuals, response-coordinate rank statistics, and a
    held-out fault-arm classifier, all conditional on public inputs.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-bdae64
    - id: KN-TECH-057
      provenance: internal
      verified_by: TASK-20260820-bdae64
    - id: KN-TECH-058
