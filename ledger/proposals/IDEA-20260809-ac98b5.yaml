idea:
  id: IDEA-20260809-ac98b5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Draw the frontier in (t, m, p) — the same coordinates the recommendation table
    uses — showing where the tradeoff stops paying
  class: measurement
  claim: >-
    The practically useful output of this goal is not an attack factor but a
    BOUNDARY: the surface in the parameter space beyond which the implemented
    tradeoff no longer reduces AT cost. The claim is that this boundary can be
    mapped by sweeping the parameters, that its shape is simple enough to state in
    a sentence, and that expressing it in the recommendation's own coordinates
    makes it directly usable without any recommendation being made.
  mechanism: >-
    Run the tradeoff attack across a grid in (t, m, p), locate for each point
    whether any storage fraction yields an AT reduction, and fit the boundary
    separating the reducing region from the non-reducing one.
  why_not_a_renamed_known_approach: >-
    Parameter guidance exists as tables of recommendations. A measured boundary in
    the same coordinates is a different artifact: it says where the attack works
    rather than what to choose, which is the division of labour this program's
    rules require.
  predictions:
  - observable: boundary location in (t, m, p)
    metric: fitted surface with uncertainty
    predicted: >-
      Strongly dependent on t, since additional passes are the standard defence
      against tradeoffs. Weak dependence on t would be surprising and would
      redirect the guidance entirely.
  - observable: whether recommended parameter sets fall inside or outside the reducing region
    metric: categorical per set
    predicted: >-
      Reported as measured, in either direction, with the record stating the
      result and making no recommendation about what anyone should choose.
  minimal_test: >-
    A grid of at least three values each of t and m and two of p, tradeoff
    attempted at each with a declared storage sweep, boundary fitted with its
    uncertainty.
  controls:
  - 'GRID-RESOLUTION CONTROL: the boundary must be stable when the grid is refined at one location; an unstable boundary is a sampling artifact.'
  - 'MACHINE-MODEL CONTROL: the boundary is computed under at least two memory-cost assumptions, since the reducing region depends on how memory is priced.'
  falsification_conditions:
  - The boundary moves materially under grid refinement.
  - No boundary exists within the grid, meaning the tradeoff either always or never pays there, which is reported as the grid's finding.
  interpretation_limits: >-
    A boundary under declared cost assumptions is not a safety line. The record
    neither recommends nor deprecates any parameter set.
  sota_delta: 'No attack. Delta: a boundary in practitioner coordinates, which is the form in which this goal''s work becomes usable.'
  dominated_by: Downstream of IDEA-20260809-ac5947; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the attack; compute high.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no memory-hard-function records. WEB NOT CHECKED.'
  source_refs:
  - RFC 9106 recommended parameter sets -- REQUIRED READ.
