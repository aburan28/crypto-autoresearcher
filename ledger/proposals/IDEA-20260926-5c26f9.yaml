  citation_note: >-
    Couveignes-Lercier itself remains unread in this program (KN-OPEN-095df5's
    second cheapest test); every statement about their construction is GGMP's
    reproduction as relayed by that entry. The LMFDB counts are retrieved; the
    Honda-Tate realisation over prime fields is recalled and is checked
    operationally by the unfiltered-count control. No other web search was run.

  assumptions:
    - >-
      The Weil-polynomial-to-isogeny-class bijection over F_2 (Honda-Tate,
      recalled). If it failed for some class the unfiltered count would not
      match the LMFDB, so the assumption is tested by the control, not trusted.
    - >-
      A Jacobian screen by place counts a_r >= 0 is NECESSARY, not sufficient;
      a class passing it is "undecided", never "is a Jacobian". Sufficiency
      would need a curve or a database flag.
    - >-
      Runtime figures in this record are order-of-magnitude estimates from the
      class counts and the coefficient boxes, labelled as such; no run was
      made.

  proof_search_map:
    bottleneck: >-
      The exact real-rootedness test count. The per-target head enumeration
      costs 1.5e9 (g = 5) to 3.4e13 (g = 6) heads per target; the Rolle-pruned
      tree costs about (survivors at level g - 1) x (range of a_g) exact tests
      unfiltered, which the class counts bound at roughly 10^7 (g = 5) to 10^8
      (g = 6); the congruence filter reduces the last level by 131 but not the
      pruning levels.
    baseline_embedding:
      parameter_slice: >-
        g <= 4 with modulus 131 is the exact baseline (0 hits; 104 and 234220
        candidates scanned by exact_targets.py) and the unfiltered counts 5,
        35, 215, 1645 are the class-count baseline.
      reproduction_check: >-
        exact_targets_g56.py --max-dim 4 must report 0 hits at every g <= 4
        and, unfiltered, the four counts above; any deviation is an
        instrument defect localised before g = 5 is run.
    observation_collision:
      observable: >-
        The set of integer real Weil polynomials h of degree g with h(3) = 0
        mod 131 and all roots in [-2 sqrt 2, 2 sqrt 2]; and the unfiltered
        class count per g.
      distinct_preimage_search: >-
        A false zero has two preimages, an incomplete enumeration (caught by
        the unfiltered count) or a wrong box test (caught by the g <= 4
        reproduction and by the sympy re-verification of every hit); a false
        hit has one, a wrong box test (caught by the second implementation).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Exact Rolle-pruned enumeration plus congruence pinning of a_g, i.e.
          weil_census.py's search order with exact_targets.py's test, in
          integer arithmetic.
        predicted_gain: >-
          From infeasible (per-target box) to hours (estimate) at g = 6, with
          the completeness control free as a by-product.
    quantifier_order: >-
      FOR ALL integer h of degree g in {5, 6} real-rooted in the box, 131 does
      not divide h(3) (outcome A), OR THERE EXISTS such an h (outcome B); the
      enumeration decides which, and the unfiltered count certifies the FOR
      ALL.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No abelian variety over F_2 of dimension <= 6 has a rational point of
        order 131" (outcome A) or "the isogeny classes with real Weil
        polynomials h_1, ..., h_k are the only ones of dimension <= 6 over F_2
        with 131 | #A(F_2)" (outcome B). Nothing about dimension 7 and nothing
        about factor bases.
      nearby_object_control: >-
        The same enumerator with modulus n in {17, 19, 23, 29, 31, 37, 41} at
        g <= 3 (IDEA-20260926-80209d) where hand-derivable answers exist
        (e.g. exactly one abelian surface with 19 points, none with 17), and
        with modulus 5 at g = 1 (must find the 5-point elliptic class).
    proof_obligations:
      - claim: The integer ceilings 6725 and 39201 and the multiple counts 51 and 299 (re-derived above from 2 a_g - 1).
        responsibility: correctness
      - claim: Rolle pruning never rejects a real-rooted-in-box h (interlacing).
        responsibility: correctness
      - claim: The pure-integer Sturm test agrees with sympy count_roots on every final candidate and on a random sample of 10^4 pruned nodes.
        responsibility: correctness
      - claim: Unfiltered class counts reproduce 5, 35, 215, 1645, 14325, 164937.
        responsibility: baseline
      - claim: Runtime within 10x of the estimate (minutes at g = 5, hours at g = 6, single core).
        responsibility: runtime
      - claim: Place counts a_r computed from P by the Moebius formula and checked on a known Jacobian class at g = 2.
        responsibility: correctness
    not_applicable_reason: null

  predictions:
    - metric: >-
        multiples of 131 below the integer Weil ceiling at g = 5 and g = 6
      direction: same
      minimum_effect: >-
        Exactly 51 and 299 (ceilings 6725 and 39201); any other value is an
        arithmetic error in this record.
    - metric: >-
        unfiltered isogeny-class count produced by the exact enumerator at
        g = 4, 5, 6
      direction: same
      minimum_effect: >-
        Exactly 1645, 14325, 164937 (LMFDB, retrieved); a shortfall of even
        one class voids the certificate reading of outcome A.
    - metric: >-
        number of real Weil polynomials with 131 | h(3) at g = 5 and at g = 6
      direction: different
      minimum_effect: >-
        No direction predicted; zero (outcome A) and a small positive number
        (outcome B) are both live and each is the deliverable; a count above
        about 100 at g = 6 would be surprising given the g = 4 calibration and
        would trigger a re-check of the box test before being believed.
    - metric: >-
        ambiguous-near-boundary count
      direction: same
      minimum_effect: >-
        Zero, as at g <= 4; nonzero is outcome C and widens the brackets.

  minimal_test:
    design: >-
      ZERO-RUN PART (delivered here): the ceilings, multiple counts, box sizes
      and the growth of the numerical gap (4 at g = 3, 21 at g = 4). NEAR-
      ZERO-RUN PART: write analysis/couveignes-lercier-131/exact_targets_g56.py
      (pure Python integers plus sympy for re-verification only), run
      --max-dim 4 unfiltered and filtered as the reproduction check, then
      --dims 5 6 --modulus 131 --json exact_targets_g56.json; run the seven
      toy moduli of IDEA-20260926-80209d at g <= 3 as the nearby-object
      control. Cell: none on any curve; the instance is the pair (g, 131).
      Attempts, seeds, arity: not applicable; the computation is
      deterministic. Metrics with units: hits (count), unfiltered classes
      (count), exact tests performed (count), wall-clock (s, reported, not
      claimed in advance), ambiguous cases (count). Falsification thresholds
      stated before the run: any unfiltered count off by >= 1; any hit
      rejected by the sympy re-test; any g <= 4 result differing from the
      committed JSON. Estimated cost: minutes at g = 5, hours at g = 6 on one
      core (estimate).
    controls:
      - >-
        Baseline reproduction at g <= 4 (0 hits, counts 5, 35, 215, 1645).
      - >-
        Null modulus: modulus 5 at g = 1 must return the 5-point class; modulus
        1 must return every class (hits = unfiltered count).
      - >-
        Two independent box-test implementations (integer Sturm; sympy) must
        agree on every hit and on a random 10^4 sample of pruned nodes.
      - >-
        Toy-ladder control (IDEA-20260926-80209d) with hand-derived answers at
        g = 2.
    required_metrics:
      - 'hits per g with h, P, N_r, a_r'
      - 'unfiltered class count per g versus LMFDB'
      - 'exact tests performed and wall-clock, reported'
      - 'ambiguous-near-boundary count'

  falsification_conditions:
    - 'The multiple counts at g = 5, 6 are not 51 and 299: arithmetic error in this record.'
    - 'The unfiltered enumeration does not reproduce 1645, 14325, 164937: the enumerator is incomplete and outcome A cannot be claimed.'
    - 'A hit is rejected by the second box-test implementation, or a pruned node is accepted by it: the integer Sturm code is wrong.'
    - 'Runtime exceeds ten times the estimate: the pruning estimate is wrong and the design must add the cheap necessary filters (Newton log-concavity, sign conditions) before Sturm.'

  confounders:
    - >-
      The bracket pair 2.8284271 < 2 sqrt 2 < 2.8284272 can in principle hide
      a root; the ambiguity flag exists for this and any nonzero count is
      outcome C.
    - >-
      A Jacobian screen by a_r >= 0 can pass a non-Jacobian; the record never
      upgrades "passes the screen" to "is a Jacobian".
    - >-
      LMFDB counts are quoted from a rendered search header; a transcription
      error there would show as a persistent mismatch at exactly one g and
      should be re-fetched before the enumerator is blamed.

  interpretation_limits:
    - >-
      Outcome A extends an exclusion to dimension 6 and says nothing about
      dimension 7 or about tori, unipotent or non-commutative groups
      (IDEA-20260926-6f2601 prices the torus row separately).
    - >-
      Outcome B produces an isogeny class, not a group law, not a translation
      formula, not a factor base and not a degree bound; the invariant set it
      would give is constrained by the lemma in IDEA-20260926-6f2601 to the
      non-linear shape, and the degree half of KN-OPEN-095df5 remains open.
    - >-
      Nothing here touches ECC2K-130's curve, points or rho baseline (2^60.8,
      KN-FIND-aa2efc / KN-LIT-096).

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Runtime only.) The number of Rolle-surviving partial vectors at level
        g - 1 is within a factor 10 of the isogeny-class count at dimension
        g - 1 (1645 at g = 5, 14325 at g = 6), so the total exact-test count
        is about 10^7 at g = 5 and 10^8 at g = 6.
      rigorous_support: >-
        None; the survivors at level k are integer points of a scaled
        real-rooted region whose volume is comparable to the dimension-k class
        region. The numbers 5, 35, 215, 1645 growing by 7 to 9 per dimension
        are the only calibration.
      validation_plan: >-
        SAMPLE - record survivors per level during the g <= 4 reproduction and
        at g = 5; COMPARE - against the class counts at the same level; TAIL -
        if the level-(g-1) survivor count at g = 6 exceeds 10 x 14325 the
        cheap necessary filters are inserted before Sturm. TRANSFER - none;
        this is a cost heuristic for one deterministic computation.

  heuristic_note: >-
    The census itself is unconditional; H1 governs only its runtime estimate.

  target_complexity:
    time_exponent: >-
      NO EXPONENT ON ANY HARD PROBLEM IS CLAIMED OR MOVED. The deliverable is
      a certificate column; arity m and per-attempt oracle budget are not
      applicable and no row of the product-law table changes.
    memory_exponent: negligible (a depth-6 recursion and a hit list)
    best_known: >-
