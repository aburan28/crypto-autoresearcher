idea:
  id: IDEA-20260926-5c26f9
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE DIMENSION-5 AND DIMENSION-6 WEIL-POLYNOMIAL CENSUS OVER F_2 FOR 131
    DIVIDING THE POINT COUNT, done exactly (Rolle-pruned depth-first
    enumeration with integer Sturm tests, last coefficient pinned by the
    congruence h(3) = 0 mod 131), validated by reproducing the complete LMFDB
    class counts 1645, 14325, 164937 at g = 4, 5, 6, extending KN-OPEN-095df5's
    exclusion past --max-dim 4 or producing the first candidate isogeny class

  class: measurement

  claim: >-
    CEILING FIRST. This is a structural-emptiness certificate for one column of
    RQ-BINSTD-b6f698's table (owner by the R2 rule of BRIEF.md section 2). It
    designs no attack, targets no arity m, meets no per-attempt oracle budget
    and cannot move any row of the product-law table. Its output is one of two
    exact facts about abelian varieties over F_2.
    THE QUESTION. KN-OPEN-095df5 asks whether a commutative algebraic group over
    F_2 has a rational point of order 131, because the Couveignes-Lercier
    construction (as reproduced by GGMP section 4.2) needs a rational subgroup
    of order exactly n = 131. For an abelian variety A/F_2 of dimension g the
    point count is #A(F_2) = P(1) = h(3), where P is the degree-2g
    characteristic polynomial of Frobenius and h is the degree-g real Weil
    polynomial with P(T) = T^g h(T + 2/T), all roots of h real in
    [-2 sqrt 2, 2 sqrt 2]. The committed exact search
    (analysis/couveignes-lercier-131/exact_targets.py) decides g <= 4 with zero
    hits (104 candidates at g = 3, 234220 at g = 4). It cannot reach g = 5.
    THE ARITHMETIC RE-DERIVED. The Weil ceiling is (1 + sqrt 2)^(2g) =
    (3 + 2 sqrt 2)^g = a_g + b_g sqrt 2 with (a_g, b_g) = (3, 2), (17, 12),
    (99, 70), (577, 408), (3363, 2378), (19601, 13860) for g = 1..6, and since
    (3 + 2 sqrt 2)^g + (3 - 2 sqrt 2)^g = 2 a_g with 0 < (3 - 2 sqrt 2)^g < 1
    the integer ceiling is exactly 2 a_g - 1, i.e. 5, 33, 197, 1153, 6725,
    39201. The multiples of 131 below it are 0, 0, 1, 8, 51, 299 (131 x 51 =
    6681 <= 6725 < 6812; 131 x 299 = 39169 <= 39201 < 39300). The counts 51
    and 299 quoted by the first attempt's report are confirmed.
    WHY THE COMMITTED SCRIPT DOES NOT SCALE. exact_targets.py enumerates the
    head (a_1, ..., a_(g-1)) over the full coefficient box |a_k| <= C(g, k)
    (2 sqrt 2)^k and pins a_g from the target. The box has 31 x 163 x 455 x 643
    = 1.48e9 heads at g = 5 and 37 x 243 x 907 x 1923 x 2175 = 3.4e13 at g = 6,
    per target; infeasible in Python by three to seven orders of magnitude.
    THE DESIGN. Enumerate top-down as weil_census.py does, but with the Rolle
    pruning made EXACT: at level k the partial coefficient vector determines the
    (g - k)-th derivative of h up to scaling, and if h is real-rooted in the box
    so is every derivative (Rolle), so a partial vector whose derivative fails
    the exact box test is abandoned soundly. The box test is a Sturm-sequence
    root count over the rationals with the boundary factor x^2 - 8 split off
    and the boundary approached from a rational inside and a rational outside,
    exactly as exact_targets.exact_real_rooted_in_box does, but implemented in
    pure Python integer arithmetic (degree <= 6) rather than sympy so that
    10^7 to 10^8 tests are affordable. At the last level only the a_g values
    with h(3) = 0 mod 131 are tested (about 3 per head at g = 5, 8 at g = 6).
    THE COMPLETENESS CONTROL THAT KN-OPEN-095df5 SAYS IT LACKS. The same
    enumerator run WITHOUT the congruence filter must reproduce the isogeny-
    class counts 5, 35, 215, 1645, 14325, 164937 at g = 1..6 over F_2, which
    the LMFDB lists as COMPLETE at dimension <= 6 over GF(2) (retrieved this
    session; see citations). A match makes the filtered zero a proof by
    complete enumeration rather than "none found by an enumerator with a gap";
    a mismatch localises the gap and the zero is not a certificate. The
    numerical weil_census.py is 4 short at g = 3 and 21 short at g = 4 (1624
    against 1645), so its gap GROWS with g and it must not be reused.
    THE THREE OUTCOMES, DEFINED BEFORE ANY RUN. (A) No Weil polynomial with
    131 | h(3) at g = 5 or 6, unfiltered counts match LMFDB: KN-OPEN-095df5's
    exclusion extends from dimension 4 to dimension 6, at certificate grade for
    the enumeration. (B) One or more hits: each is an isogeny class over F_2
    with a rational point of order 131; the record reports P, h, the virtual
    curve counts N_r = 2^r + 1 - sum alpha_i^r for r <= g and the place counts
    a_r = (1/r) sum_(d | r) mu(r/d) N_d; a class with every a_r >= 0 is a
    candidate whose Jacobian-or-not question is the next step; a class with
    some a_r < 0 is NOT a Jacobian and is recorded as a non-Jacobian abelian-
    variety candidate. (C) Artifact: unfiltered counts differ from LMFDB, or
    the ambiguous-near-boundary list is nonempty; then the enumeration is
    incomplete or the rational brackets too coarse and NEITHER exclusion nor
    candidate is claimed until fixed.
    THE RECORD PREDICTS NO DIRECTION FOR THE HIT COUNT, and says why: at g = 4
    only three of the eight multiples (131, 262, 393) lie below the true
    maximum 475, and none of the 1645 classes lands on them; at g = 5 and 6 the
    true maxima are unknown to this record (estimated 2000 to 2500 and about
    10^4 from the ratios 5, 25, 100, 475) so roughly 15 to 19 and 75 to 95 of
    the targets are reachable (estimates), against 14325 and 164937 classes
    whose counts concentrate far below the ceiling. Both zero and a small
    positive number are live, and each is informative.

  mechanism: >-
    OBJECT FRAME. Representation: none of R1/R2/R3 of RQ-ECDLP-623a32; the
    object is an isogeny class of abelian varieties over F_2, represented by
    its real Weil polynomial h in Z[x] of degree g. Operation set Sigma: none
    on the curve; the enumeration is over integer vectors. TRICHOTOMY: not
    applicable, no tracked object on E(F_(2^131)); this is a certificate
    column, and it says so instead of forcing a class.
    LOSSY-PROJECTION TEST. Not applicable to the census itself. It IS relevant
    to what a hit would be used for, and IDEA-20260926-6f2601's lemma states
    the constraint: any Couveignes-Lercier base at n = 131 obtained as the
    evaluation image of a translation-stable linear space of functions on the
    group is one of the four Frobenius-stable subspaces of F_(2^131)
    (IDEA-20260918-9abf42), so a hit here is a candidate only for the NON-
    linear (section-ratio / fraction) shape, priced by GGMP table 3 at about
    280x the vector-space solve at n = 131, m = 3, for the non-invariant
    fraction shape.
    KN-OPEN-020 CLASS: none claimed; no factor base is proposed.
    WHY EXACT AND WHY TOP-DOWN. Rolle pruning is sound (never rejects a good
    h) because the roots of h' interlace those of h and therefore lie in the
    same closed interval; exactness at every level removes the repeated-root-
    at-the-boundary fragility that produced the numerical gaps. The last
    coefficient a_g enters h(3) linearly with coefficient 1, so the congruence
    h(3) = 0 mod 131 selects a_g in an arithmetic progression of step 131
    inside |a_g| <= (2 sqrt 2)^g (181 at g = 5, 512 at g = 6): about 3 and 8
    values per surviving head.
    INSTRUMENT SHAPE. New script analysis/couveignes-lercier-131/
    exact_targets_g56.py, importing nothing from the numerical census; it
    re-runs g <= 4 first and must reproduce 0 hits with 104 and 234220
    candidate-equivalents or the counts 5, 35, 215, 1645; JSON output in the
    exact_targets.json shape plus an unfiltered class count per g and the list
    of hits with N_r and a_r. Every hit is re-verified independently by
    sympy count_roots as exact_targets.py does (two implementations of the
    box test must agree on every hit). Optional third check: the LMFDB
    download of the q = 2, g = 5, 6 tables, which carry the point count as a
    column; agreement of the hit list with a database filter is a third
    independent confirmation, not the primary instrument.

