idea:
  id: IDEA-20260801-021
  question_id: RQ-ECDLP-002
  title: >-
    Algebraic intersection-degree factor-base obstruction - no subexponential
    descent below the m-fold coverage threshold
  class: barrier
  claim: >-
    Let E/F_p be a nonsingular geometrically irreducible plane elliptic curve,
    let G <= E(F_p) have prime order N asymp p, and let Z_p be any
    target-independent proper projective algebraic locus with finite
    intersection degree Delta_p against the projective closure of E. Let F_p
    be any rational factor base contained in that intersection, and let an
    m_p-ary point-decomposition descent accept only targets in the exact
    m_p-fold sumset m_p F_p. Then |F_p| <= Delta_p and |m_p F_p| <=
    |F_p|^m_p. For target distributions T_p with H_inf(T_p) >= log_2(N)-C
    for one uniform constant C, coverage is at most
    2^C Delta_p^m_p/N. If Delta_p^m_p <= N^(1-epsilon), then a fixed-target
    protocol has constant-success probability at most O(N^-epsilon),
    regardless of tuple retries. Under the additional fresh-rerandomization
    interface stated below, every delta-success protocol costs
    Omega_delta(N/Delta_p^m_p) charged trials, hence Omega_delta(N^epsilon),
    even if relation collection, membership verification, and linear algebra
    are free. Thus no algebraic factor base inside this explicit
    intersection-degree/sumset interface is subexponential in log N. The claim
    deliberately does not assign a small Delta_p to unrestricted descriptions
    or close every ECDLP algorithm family.
  mechanism: >-
    The homogenized factor-base equation cuts the irreducible plane cubic E by
    a proper degree-d_p curve, so Bezout bounds the rational factor-base points
    by 3 d_p. More generally, any proper algebraic locus with explicit finite
    intersection degree Delta_p gives |F_p| <= Delta_p; the single-polynomial
    form is the concrete Delta_p=3d_p instance. The addition map from F_p^m_p to G has image m_p F_p, with
    cardinality at most |F_p|^m_p. The fixed-target entropy argument is a
    one-time coverage cap: repeating tuple trials from the same F_p does not
    create fresh target coverage. A reciprocal-success cost bound is asserted
    only for a fresh-rerandomization interface in which each trial draws a
    fresh target-equivalent image, has conditional success probability at most
    q_p <= 2^C Delta_p^m_p/N, preserves source recovery, and charges at least one
    group operation. A union bound gives P[success by tau] <= q_p E[tau], so
    delta-success costs at least delta/q_p charged trials. A necessary
    coverage condition for subexponential descent is therefore
    |F_p|^m_p >= N^(1-o(1)); any implicit image or membership solver is a
    separate charged interface, not free tuple enumeration.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/techniques/KN-TECH-003.md
      - knowledge/techniques/KN-TECH-005.md
      - knowledge/literature/KN-LIT-006.md
      - knowledge/open-problems/KN-OPEN-019.md
      - ledger/proposals/IDEA-20260727-003.yaml
      - ledger/proposals/IDEA-20260727-007.yaml
    grep_results:
      - >-
        KN-TECH-003 records point-decomposition factor bases and the
        prime-field relation/Grobner bottleneck, but does not state a
        Bezout-plus-target-coverage lower bound.
      - >-
        IDEA-20260727-003 gives a free-decomposition linear-algebra floor and
        its m <= 4 scope; this proposal instead bounds the algebraic factor
        base itself and applies to any m satisfying the displayed coverage
        inequality.
      - >-
        KN-OPEN-019 explicitly warns that a universal taxonomy of ECDLP attack
        families is open; that warning is retained as this proposal's scope
        boundary rather than converted into a closure claim.
    literature_verified:
      - >-
        https://www.cambridge.org/core/product/identifier/S0010437X10005075/type/journal_article
        (Diem, extension-field index calculus; positive results are not a
        prime-field universal no-go theorem)
      - >-
        https://arxiv.org/abs/1504.01175 (Semaev, binary-field index calculus;
        positive results are outside this prime-field scope)
    conclusion: >-
      The counting argument is a scoped derivation from standard intersection
      theory and sumset cardinality, not a claim of a new universal lower-bound
      theorem. Novelty is unverified until an independent reviewer checks the
      quantifiers, the min-entropy step, and the exact factor-base model.
  assumptions:
    - >-
      E/F_p is a nonsingular geometrically irreducible plane cubic, Z_p is a
      target-independent proper projective algebraic locus with finite
      geometric intersection degree Delta_p against the projective closure of
      E, and Delta_p is explicitly charged. The concrete polynomial case has
      Delta_p <= 3d_p for d_p >= 1; if Z_p contains E or Delta_p is unbounded
      or unrecorded, the theorem does not apply.
    - >-
      G has prime order N with N asymp p, and F_p is any rational subset of
      G intersect Z_p(F_p), chosen independently of the challenge and trial
      randomness. Single polynomials, unions, multiple predicates, and
      constructible sets are admitted only when their proper intersection
      degree Delta_p is supplied; no syntactic description receives a free
      degree bound.
    - >-
      The descent relation has integer arity m_p >= 1 for each parameter and
      uses exactly m_p ordered factors, with repetitions allowed, in the
      additive sumset. Signed, weighted, union-of-bases, and special-identity
      relations are outside scope unless their enlarged factor domain is
      explicitly charged.
    - >-
      The target family T_p has H_inf(T_p) >= log_2(N) - C for one constant C
      independent of p; a uniform random target has C=0. Target-dependent
      factor bases and adversarially concentrated target distributions are not
      covered.
    - >-
      For the fixed-target statement, no reciprocal retry bound is claimed. For
      the optional rerandomized statement, each trial's conditional target
      image has success probability at most q_p, source recovery is preserved,
      the target-equivalent randomization is independent of prior history, and
      each trial costs at least one group-operation equivalent. All other
      preprocessing, relation verification, and linear algebra are granted for
      free, so the bound is optimistic.
    - >-
      Epsilon is fixed with 0 < epsilon < 1 (or a stated sequence bounded away
      from zero) and the coverage inequality holds eventually along the
      p-indexed family.
  proof_search_map:
    bottleneck: >-
      Coverage of a random ECDLP target by the m_p-fold sumset of a small
      algebraically defined factor base; relation rank and linear algebra are
      intentionally not the bottleneck in this lower bound.
    baseline_embedding:
      parameter_slice: >-
        The generic rho baseline is Theta(N^(1/2)) group operations. The
        theorem's lower bound is applied to the descent stage before comparing
        against rho, and does not invoke the generic-group lower bound as a
        proof of the concrete claim.
      reproduction_check: >-
        Symbolically verify the projective non-containment condition, |F_p| <=
        Delta_p (or Delta_p <= 3d_p in the concrete case), |m_p F_p| <=
        |F_p|^m_p, and the fixed-target coverage cap
        Pr[target in m_p F_p] <= 2^C |F_p|^m_p/N before any experiment.
    observation_collision:
      observable: >-
        The finite subset F_p, its cardinality, and the image cardinality of
        the addition map F_p^m_p -> G; these are the invariants carrying the
        claimed obstruction.
      distinct_preimage_search: >-
        Search for high-degree interpolation predicates, multiple-component
        constructible descriptions, implicit algebraic membership solvers, and
        non-sumset relation identities. These are escape controls, not hidden
        premises of the theorem.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace an explicit m_p-fold sumset descent by an implicit algebraic
          solver whose target coverage is not bounded by |F_p|^m_p.
        predicted_gain: >-
          Outside the theorem's model; a successful construction would identify
          the missing interface rather than falsify the stated counting lemma.
    quantifier_order: >-
      For every fixed 0 < epsilon < 1, every eventual sequence (E_p, G_p,
      Z_p, Delta_p, m_p, T_p) satisfying the assumptions and Delta_p^m_p <=
      N^(1-epsilon), and every fixed-target protocol whose accepted descent
      outputs require T_p in m_p F_p, success probability is at most
      2^C N^-epsilon. For the separately declared fresh-rerandomization
      interface, every delta-success protocol has expected charged trials at
      least delta*2^-C N^epsilon. Consequently no member of this class has
      L_N[alpha,c] or N^(o(1)) descent cost for alpha < 1. The theorem makes no
      assertion when the coverage inequality or interface conditions fail.
    method_ceiling:
      strongest_certifiable_claim: >-
        A universal-over-the-interface algebraic intersection-degree,
        bounded-arity target-coverage obstruction. It gives a fixed-target
        success cap and, only under the explicit fresh-rerandomization
        interface, an N/B^m expected-trial lower bound. The necessary condition
        B^m >= N^(1-o(1)) remains the coverage requirement for subexponential
        descent.
      nearby_object_control: >-
        High-degree or interpolating predicates, growing arity with implicit
        membership, extension-field curves, special curves, target-dependent
        bases, and non-sumset relation families must be tested as separate
        objects; no result on them is inferred here.
    proof_obligations:
      - claim: >-
          Proper algebraic intersection degree gives |F_p| <= Delta_p; for a
          single degree-d_p polynomial, Bezout supplies Delta_p <= 3 d_p.
        responsibility: size
      - claim: >-
          The image of the addition map F_p^m_p -> G has cardinality at most
          |F_p|^m_p.
        responsibility: correctness
      - claim: >-
          Min-entropy log N - O(1) converts image size into the stated target
          success-probability upper bound.
        responsibility: success_probability
      - claim: >-
          For a fixed target, coverage is static and no tuple retry amplifies
          it; constant success is impossible when the coverage cap is below
          delta.
        responsibility: success_probability
      - claim: >-
          Under fresh target-equivalent rerandomization with conditional success
          at most q_p, P[success by tau] <= q_p E[tau], giving an expected
          charged-trial lower bound delta/q_p.
        responsibility: runtime
      - claim: >-
          N^epsilon is exponential in the security parameter log N and is not
          subexponential; the conclusion is not a generic-group lower bound.
        responsibility: scope
      - claim: >-
          Full ECDLP requires random-target descent or an equivalent coverage
          interface; relation collection alone cannot be promoted to a solver.
        responsibility: interface
  rerandomization:
    device: >-
      Optional fresh-target-equivalent trials. Conditional on the complete
      prior transcript, each trial has target-image success probability at most
      q_p = 2^C Delta_p^m_p/N, and the reduction preserves the original
      source-recovery/descent task.
    mixing_time: >-
      Not applicable: independence of each declared fresh trial is an explicit
      interface assumption, not a mixing heuristic.
    pullback: >-
      The reduction must map an accepted fresh-trial source back to the fixed
      challenge with no uncharged oracle, preprocessing, or source table.
  target_complexity:
    time_exponent: >-
      Fixed-target success cap O(N^-epsilon) when Delta_p^m_p <=
      N^(1-epsilon); under fresh rerandomization, delta-success expected
      charged trials Omega_delta(N^epsilon), with the Delta_p=N^(o(1)) and
      m_p=O(1) corollary N^(1-o(1)). This is a scoped lower bound, not an attack
      exponent claim.
    memory_exponent: >-
      Not charged by the optimistic implicit interface; any preprocessing,
      source table, or explicit tuple/image enumeration must be charged by its
      own record.
    best_known: >-
      Pollard rho remains the generic N^(1/2) baseline; this theorem does not
      compare a concrete end-to-end implementation against rho.
    hidden_overhead: >-
      The fixed entropy deficit C, constants in the intersection-degree bound,
      fresh-trial setup and pullback, algebraic membership evaluation, source
      recovery, and all lower-order degree/arity terms are not hidden as free
      in a deployed claim.
    tradeoff_note: >-
      The reciprocal-success bound applies only to the declared fresh-
      rerandomization interface. Repeating tuple trials from one fixed factor
      base has a static coverage event and no such amplification guarantee.
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Bezout's theorem for the intersection of a plane cubic with a proper
        degree-d_p plane curve bounds the factor-base cardinality.
      citation: >-
        Standard Bezout intersection theorem for plane curves; the exact
        application and non-containment condition are part of the proof
        obligation above.
      role: degree bound
    - description: >-
        The Diem/Gaudry and Semaev literature supplies positive index-calculus
        constructions in extension or binary-field settings, which are useful
        scope controls but do not establish a prime-field universal theorem.
      citation: >-
        https://www.cambridge.org/core/product/identifier/S0010437X10005075/type/journal_article;
        https://arxiv.org/abs/1504.01175
      role: scope control
  reduction_chain:
    core_problem: >-
      Random-target descent for prime-order ECDLP in the explicitly stated
      algebraic-intersection-degree point-decomposition model.
    corollaries:
      - problem: >-
          Full single-target ECDLP using this descent interface
        reduction_ref: >-
          The solver must cover a random challenge target or provide an
          explicitly equivalent reduction; no generic-group reduction is used.
        asymptotics_preserved: yes
  predictions:
    - metric: factor_base_cardinality_upper_bound
      direction: lower
      minimum_effect: >-
        Every valid in-scope algebraic locus satisfies |F_p| <= Delta_p;
        the single-polynomial specialization satisfies Delta_p <= 3 d_p,
        including rational-point and multiplicity edge cases.
    - metric: m_fold_sumset_cardinality_upper_bound
      direction: lower
      minimum_effect: >-
        |m_p F_p| <= Delta_p^m_p exactly by image cardinality, with the
        single-polynomial specialization Delta_p <= 3 d_p.
    - metric: random_target_coverage_probability
      direction: lower
      minimum_effect: >-
        For a fixed target-independent algebraic locus, coverage is at most
        2^C Delta_p^m_p/N, with C uniform across the parameter family.
    - metric: charged_descent_cost
      direction: higher
      minimum_effect: >-
        Under fresh target-equivalent rerandomization only, delta-success
        descent costs Omega_delta(N/Delta_p^m_p), hence Omega_delta(N^epsilon)
        under the theorem inequality. No retry lower bound is asserted for one
        fixed target and one fixed factor base.
    - metric: bounded_degree_bounded_arity_corollary
      direction: higher
      minimum_effect: >-
        If d_p = N^(o(1)) and m_p = O(1), the lower bound is N^(1-o(1)),
        excluding subexponential descent in this model.
  minimal_test:
    design: >-
      First complete the symbolic proof and an independent proof audit. Then
      enumerate small prime-field elliptic curves and low-degree zero loci to
      check |F_p| <= Delta_p (and |F_p| <= 3 d_p in the polynomial
      specialization) and exact m-fold sumsets to check the image bound.
      Sample uniform targets to verify the static coverage cap. Separately test
      the fresh-rerandomization inequality with independent images, recording
      the conditional success bound and charged stopping time. Use high-degree
      interpolation predicates and target-dependent bases as explicit
      out-of-scope controls. No toy run may be used as cryptographic evidence
      or as a universal impossibility proof.
    controls:
      - >-
        Predicate containing E as a component, which must be rejected by the
        non-containment precondition rather than counted as a counterexample.
      - >-
        High-degree interpolating polynomial for the same finite subset, which
        should demonstrate why unrestricted algebraic descriptions are outside
        the theorem.
      - >-
        Growing-arity and implicit-membership cases, recorded as abstentions
        whenever the explicit sumset interface is not present.
      - >-
        Uniform-target and concentrated-target distributions, verifying that
        only the former (or the stated min-entropy class) supports the bound.
      - >-
        A fixed singleton factor base with repeated tuple trials, verifying
        that static coverage does not become geometric retry success.
      - >-
        Independent fresh images with the same coverage cap, verifying the
        optional P[success by tau] <= q E[tau] interface.
    required_metrics:
      - curve, predicate degree, non-containment check, and exact rational factor-base size
      - exact m-fold sumset size and the ratio to |F_p|^m
      - sampled target coverage and confidence interval
      - conditional fresh-trial success and charged stopping-time comparison
        with delta/q_p
      - explicit out-of-scope classification for every escape-control case
  falsification_conditions:
    - >-
      An in-scope algebraic locus has more than Delta_p rational factor-base
      points despite its recorded proper intersection degree; this would
      invalidate the intersection-degree step or reveal an implementation
      error. In the polynomial specialization, the check is |F_p| <= 3d_p.
    - >-
      A fixed-target in-scope protocol exceeds the stated coverage cap without
      changing the target distribution, factor base, or accepted sumset; this
      would invalidate the entropy or cardinality argument.
    - >-
      Under the explicitly declared fresh-rerandomization interface, a
      delta-success protocol has expected charged trials o(delta/q_p) while
      every conditional trial success is at most q_p; this would invalidate the
      stopping-time argument or its cost accounting.
    - >-
      An in-scope sequence satisfies Delta_p^m_p <= N^(1-epsilon) and has a
      subexponential descent; this is a direct theorem refutation and requires
      an independent audit of the model and receipts.
    - >-
      A purported counterexample uses an identity, implicit solver, target
      dependent base, extension field, special curve, or high-degree predicate;
      that is not a falsification and must instead be recorded as an escape
      from scope.
  confounders:
    - >-
      A polynomial may vanish identically on E; checking non-containment is
      mandatory before applying Bezout.
    - >-
      Additive collisions only shrink the sumset and therefore strengthen the
      lower bound; confusing tuples with distinct targets must not weaken the
      argument.
    - >-
      Collisions mean that explicit tuple enumeration costs B^m, but they do
      not imply that computing the distinct image costs |mF|; an implicit image
      algorithm must be charged separately.
    - >-
      Nonuniform targets can have much larger coverage than uniform targets;
      the min-entropy assumption must be stated at the solver interface.
    - >-
      A relation bank can be useful without covering a random challenge; that
      observation is not full ECDLP evidence under this theorem.
    - >-
      Generic-group lower bounds and toy-curve experiments are baselines or
      validation aids, not substitutes for the concrete scoped proof.
    - >-
      Signed or weighted factors can enlarge the effective domain to, for
      example, F union -F; they are outside scope unless their enlarged degree
      and source costs are included.
  interpretation_limits:
    - >-
      This is a theorem for every algebraic factor base whose proper
      intersection degree Delta_p and exact sumset interface are explicit; it
      is not a theorem that unrestricted descriptions with uncharged or
      superpolynomial Delta_p cannot support subexponential ECDLP. Implicit
      solvers may evade explicit sumset counting and must be charged separately.
    - >-
      The result does not cover extension fields, special curves, or multiple
      components whose proper intersection degree is not explicitly supplied,
      growing arity with implicit membership, target-dependent bases, or
      non-sumset relation families. It also does not cover uncharged
      preprocessing, source tables, signed/weighted factors, or adaptive
      target-dependent rerandomization.
    - >-
      It does not close RQ-ECDLP-002 or promote any toy relation result into a
      cryptanalytic break. It closes only the displayed parameter region if the
      proof and independent audit pass.
    - >-
      A failed symbolic check, timeout, or implementation defect is
      inconclusive rather than evidence against the mathematical statement.
  estimated_cost:
    implementation: low
    compute: low
  dominated_by:
    - IDEA-20260727-003
  sota_delta: >-
    Extends the existing free-oracle m <= 4 accounting gate with a formal
    degree-to-cardinality bound and a target-coverage lower bound; it is a
    narrower theorem than a universal prime-field ECDLP closure and does not
    claim an asymptotic improvement over rho.
  recommended_priority: high
  status: proposed
  proposed_by: coordinator
  source_refs:
    - knowledge/techniques/KN-TECH-003.md
    - knowledge/techniques/KN-TECH-005.md
    - knowledge/literature/KN-LIT-006.md
    - knowledge/open-problems/KN-OPEN-019.md
    - ledger/proposals/IDEA-20260727-003.yaml
    - ledger/proposals/IDEA-20260727-007.yaml
    - ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md
    - knowledge/open-problems/KN-OPEN-020.md
    - coordination/tasks/TASK-20260802-001/red_team_report.md
    - coordination/tasks/TASK-20260802-002/validation_report.yaml
