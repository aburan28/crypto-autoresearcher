idea:
  id: IDEA-20260801-021
  question_id: RQ-ECDLP-002
  title: >-
    Bounded-degree algebraic factor-base obstruction - no subexponential
    descent when the m-fold sumset misses a polynomial fraction of the group
  class: barrier
  claim: >-
    Let E/F_p be a nonsingular geometrically irreducible plane elliptic curve,
    let G <= E(F_p) have prime order N asymp p, and let F_p <= G be defined by
    a nonzero plane polynomial predicate of total degree at most d_p, with the
    predicate not vanishing identically on E. Consider an m_p-ary
    point-decomposition index-calculus scheme whose random-target descent
    succeeds only when the target lies in the m_p-fold sumset m_p F_p, and
    charge at least one group-operation equivalent per candidate trial. Bezout
    gives |F_p| <= 3 d_p, while |m_p F_p| <= |F_p|^m_p. Therefore, for every
    fixed epsilon > 0, whenever (3 d_p)^m_p <= N^(1-epsilon), a target with
    min-entropy log N - O(1) is covered with probability at most O(N^-epsilon)
    and constant-probability descent costs Omega(N^epsilon) charged group
    operations, even if relation collection, membership verification, and
    linear algebra are free. Hence no bounded-degree/bounded-arity scheme in
    this explicitly stated sumset model is subexponential in log N. The claim
    is deliberately not a universal no-go for every algebraically described
    factor base or every ECDLP algorithm.
  mechanism: >-
    The factor-base predicate cuts the irreducible plane cubic E by a curve of
    degree d_p. Unless it contains E as a component, Bezout bounds the number
    of geometric intersection points, and hence rational factor-base points,
    by 3 d_p. The addition map from F_p^m_p to G has image m_p F_p, so its
    image has cardinality at most |F_p|^m_p. A target distribution with
    min-entropy log N - O(1) consequently lands in that image with probability
    at most O(|F_p|^m_p/N). Repeating independent candidate trials until a
    constant success probability is reached costs the reciprocal of this
    probability. Charging no other work makes the resulting lower bound
    optimistic. A necessary condition for a subexponential descent in this
    model is therefore |F_p|^m_p >= N^(1-o(1)); if the sumset is explicitly
    enumerated, that enumeration itself is already N^(1-o(1)) work.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/techniques/KN-TECH-003.md
      - knowledge/techniques/KN-TECH-005.md
      - knowledge/literature/KN-LIT-006.md
      - knowledge/open-problems/KN-OPEN-019.md
      - ledger/proposals/IDEA-20260727-003.yaml
      - ledger/proposals/IDEA-20260727-007.yaml
    grep_results:
      - >-
        KN-TECH-003 records point-decomposition factor bases and the
        prime-field relation/Grobner bottleneck, but does not state a
        Bezout-plus-target-coverage lower bound.
      - >-
        IDEA-20260727-003 gives a free-decomposition linear-algebra floor and
        its m <= 4 scope; this proposal instead bounds the algebraic factor
        base itself and applies to any m satisfying the displayed coverage
        inequality.
      - >-
        KN-OPEN-019 explicitly warns that a universal taxonomy of ECDLP attack
        families is open; that warning is retained as this proposal's scope
        boundary rather than converted into a closure claim.
    literature_verified:
      - >-
        https://www.cambridge.org/core/product/identifier/S0010437X10005075/type/journal_article
        (Diem, extension-field index calculus; positive results are not a
        prime-field universal no-go theorem)
      - >-
        https://arxiv.org/abs/1504.01175 (Semaev, binary-field index calculus;
        positive results are outside this prime-field scope)
    conclusion: >-
      The counting argument is a scoped derivation from standard intersection
      theory and sumset cardinality, not a claim of a new universal lower-bound
      theorem. Novelty is unverified until an independent reviewer checks the
      quantifiers, the min-entropy step, and the exact factor-base model.
  assumptions:
    - >-
      E/F_p is a nonsingular geometrically irreducible plane cubic and the
      factor-base predicate f_p is nonzero on E; otherwise Bezout does not give
      the stated finite intersection bound.
    - >-
      G has prime order N with N asymp p, and the factor base is a subset of G
      cut out by one plane polynomial of total degree at most d_p. Bounded
      intersections of finitely many bounded-degree predicates require a new
      statement and are outside this record.
    - >-
      The descent relation has fixed arity m_p for each parameter and a
      candidate target is accepted only if it lies in the m_p-fold additive
      sumset of the factor base. Special identities not expressible through
      this target-coverage condition are outside scope.
    - >-
      The target distribution has min-entropy at least log N - O(1); a uniform
      random target is the canonical case. Target-dependent factor bases and
      adversarially concentrated target distributions are not covered.
    - >-
      Each independent candidate trial costs at least one group-operation
      equivalent. All preprocessing, relation verification, and linear
      algebra are granted for free, so the lower bound is optimistic.
    - >-
      Epsilon is a fixed positive constant (or a stated sequence bounded away
      from zero) in the inequality (3 d_p)^m_p <= N^(1-epsilon).
  proof_search_map:
    bottleneck: >-
      Coverage of a random ECDLP target by the m_p-fold sumset of a small
      algebraically defined factor base; relation rank and linear algebra are
      intentionally not the bottleneck in this lower bound.
    baseline_embedding:
      parameter_slice: >-
        The generic rho baseline is Theta(N^(1/2)) group operations. The
        theorem's lower bound is applied to the descent stage before comparing
        against rho, and does not invoke the generic-group lower bound as a
        proof of the concrete claim.
      reproduction_check: >-
        Symbolically verify |F_p| <= 3 d_p, |m_p F_p| <= |F_p|^m_p, and
        Pr[target in m_p F_p] <= O(|F_p|^m_p/N) before any experiment.
    observation_collision:
      observable: >-
        The finite subset F_p, its cardinality, and the image cardinality of
        the addition map F_p^m_p -> G; these are the invariants carrying the
        claimed obstruction.
      distinct_preimage_search: >-
        Search for high-degree interpolation predicates, multiple-component
        constructible descriptions, implicit algebraic membership solvers, and
        non-sumset relation identities. These are escape controls, not hidden
        premises of the theorem.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace an explicit m_p-fold sumset descent by an implicit algebraic
          solver whose target coverage is not bounded by |F_p|^m_p.
        predicted_gain: >-
          Outside the theorem's model; a successful construction would identify
          the missing interface rather than falsify the stated counting lemma.
    quantifier_order: >-
      For every epsilon > 0 and every sequence (E_p, G_p, f_p, d_p, m_p)
      satisfying the assumptions and (3 d_p)^m_p <= N^(1-epsilon), every
      algorithm whose random-target descent requires membership in m_p F_p has
      expected charged descent cost Omega(N^epsilon). Consequently, no member
      of this class has L_N[alpha,c] or N^(o(1)) descent cost for alpha < 1.
      The theorem makes no assertion when the coverage inequality fails.
    method_ceiling:
      strongest_certifiable_claim: >-
        A deterministic bounded-degree, bounded-arity target-coverage
        obstruction, with an explicit N/B^m expected-trials lower bound and a
        necessary condition B^m >= N^(1-o(1)) for any subexponential descent.
      nearby_object_control: >-
        High-degree or interpolating predicates, growing arity with implicit
        membership, extension-field curves, special curves, target-dependent
        bases, and non-sumset relation families must be tested as separate
        objects; no result on them is inferred here.
    proof_obligations:
      - claim: >-
          Bezout intersection bound gives |F_p| <= 3 d_p when f_p does not
          vanish identically on E.
        responsibility: size
      - claim: >-
          The image of the addition map F_p^m_p -> G has cardinality at most
          |F_p|^m_p.
        responsibility: correctness
      - claim: >-
          Min-entropy log N - O(1) converts image size into the stated target
          success-probability upper bound.
        responsibility: success_probability
      - claim: >-
          Repeated candidate trials require the reciprocal success probability
          for constant success, under the charged-trial model.
        responsibility: runtime
      - claim: >-
          N^epsilon is exponential in the security parameter log N and is not
          subexponential; the conclusion is not a generic-group lower bound.
        responsibility: scope
      - claim: >-
          Full ECDLP requires random-target descent or an equivalent coverage
          interface; relation collection alone cannot be promoted to a solver.
        responsibility: interface
  rerandomization: null
  asymptotic_claim:
    problem: prime-field ECDLP in the stated point-decomposition model
    prior_best: N^(1/2) generic rho baseline, up to lower-order factors
    time_exponent: >-
      Lower bound epsilon whenever (3 d_p)^m_p <= N^(1-epsilon); corollary
      N^(1-o(1)) when d_p = N^(o(1)) and m_p = O(1)
    memory_exponent: >-
      Not charged in the implicit model; explicit sumset enumeration requires
      Omega((3 d_p)^m_p) storage or equivalent work.
    hidden_cofactor: >-
      Constants from Bezout, the O(1) min-entropy loss, candidate batching,
      group-operation implementation, and any lower-order terms in d_p and
      m_p are not claimed to be optimized.
    claim_kind: constant_factor
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Bezout's theorem for the intersection of a plane cubic with a proper
        degree-d_p plane curve bounds the factor-base cardinality.
      citation: >-
        Standard Bezout intersection theorem for plane curves; the exact
        application and non-containment condition are part of the proof
        obligation above.
      role: degree bound
    - description: >-
        The Diem/Gaudry and Semaev literature supplies positive index-calculus
        constructions in extension or binary-field settings, which are useful
        scope controls but do not establish a prime-field universal theorem.
      citation: >-
        https://www.cambridge.org/core/product/identifier/S0010437X10005075/type/journal_article;
        https://arxiv.org/abs/1504.01175
      role: scope control
  reduction_chain:
    core_problem: >-
      Random-target descent for prime-order ECDLP in the explicitly stated
      bounded-degree point-decomposition model.
    corollaries:
      - problem: >-
          Full single-target ECDLP using this descent interface
        reduction_ref: >-
          The solver must cover a random challenge target or provide an
          explicitly equivalent reduction; no generic-group reduction is used.
        asymptotics_preserved: yes
  predictions:
    - metric: factor_base_cardinality_upper_bound
      direction: lower
      minimum_effect: >-
        Every valid in-scope predicate satisfies |F_p| <= 3 d_p, including
        rational-point and multiplicity edge cases.
    - metric: m_fold_sumset_cardinality_upper_bound
      direction: lower
      minimum_effect: >-
        |m_p F_p| <= (3 d_p)^m_p exactly by image cardinality.
    - metric: random_target_coverage_probability
      direction: lower
      minimum_effect: >-
        Coverage is at most O((3 d_p)^m_p/N), with the O(1) factor determined
        only by the min-entropy deficit.
    - metric: charged_descent_cost
      direction: higher
      minimum_effect: >-
        Constant-probability descent costs Omega(N/(3 d_p)^m_p), hence
        Omega(N^epsilon) under the theorem inequality.
    - metric: bounded_degree_bounded_arity_corollary
      direction: higher
      minimum_effect: >-
        If d_p = N^(o(1)) and m_p = O(1), the lower bound is N^(1-o(1)),
        excluding subexponential descent in this model.
  minimal_test:
    design: >-
      First complete the symbolic proof and an independent proof audit. Then
      enumerate small prime-field elliptic curves and low-degree predicates to
      check |F_p| <= 3 d_p and enumerate m-fold sumsets to check the cardinality
      bound. Monte Carlo uniform-target coverage should agree with |mF_p|/N.
      Use high-degree interpolation predicates and target-dependent bases as
      explicit out-of-scope controls. No toy run may be used as cryptographic
      evidence or as a universal impossibility proof.
    controls:
      - >-
        Predicate containing E as a component, which must be rejected by the
        non-containment precondition rather than counted as a counterexample.
      - >-
        High-degree interpolating polynomial for the same finite subset, which
        should demonstrate why unrestricted algebraic descriptions are outside
        the theorem.
      - >-
        Growing-arity and implicit-membership cases, recorded as abstentions
        whenever the explicit sumset interface is not present.
      - >-
        Uniform-target and concentrated-target distributions, verifying that
        only the former (or the stated min-entropy class) supports the bound.
    required_metrics:
      - curve, predicate degree, non-containment check, and exact rational factor-base size
      - exact m-fold sumset size and the ratio to |F_p|^m
      - sampled target coverage and confidence interval
      - charged-trial count and comparison with N/|mF_p|
      - explicit out-of-scope classification for every escape-control case
  falsification_conditions:
    - >-
      An in-scope predicate has more than 3 d_p rational factor-base points
      without vanishing identically on E; this would invalidate the Bezout step
      or reveal an implementation error.
    - >-
      An in-scope descent succeeds for a min-entropy target with expected
      charged cost o(N/(3 d_p)^m_p) while still requiring target membership in
      the explicit m_p-fold sumset; this would invalidate the counting or
      trial-cost argument.
    - >-
      An in-scope sequence satisfies (3 d_p)^m_p <= N^(1-epsilon) and has a
      subexponential descent; this is a direct theorem refutation and requires
      an independent audit of the model and receipts.
    - >-
      A purported counterexample uses an identity, implicit solver, target
      dependent base, extension field, special curve, or high-degree predicate;
      that is not a falsification and must instead be recorded as an escape
      from scope.
  confounders:
    - >-
      A polynomial may vanish identically on E; checking non-containment is
      mandatory before applying Bezout.
    - >-
      Additive collisions only shrink the sumset and therefore strengthen the
      lower bound; confusing tuples with distinct targets must not weaken the
      argument.
    - >-
      Nonuniform targets can have much larger coverage than uniform targets;
      the min-entropy assumption must be stated at the solver interface.
    - >-
      A relation bank can be useful without covering a random challenge; that
      observation is not full ECDLP evidence under this theorem.
    - >-
      Generic-group lower bounds and toy-curve experiments are baselines or
      validation aids, not substitutes for the concrete scoped proof.
  interpretation_limits:
    - >-
      This is not a theorem that no algebraically defined factor base over any
      prime field can support subexponential ECDLP. Unrestricted algebraic
      descriptions can encode arbitrary finite subsets, and implicit solvers
      may evade explicit sumset counting.
    - >-
      The result does not cover extension fields, special curves, multiple
      bounded-degree components without a separately proved complexity bound,
      growing arity with implicit membership, target-dependent bases, or
      non-sumset relation families.
    - >-
      It does not close RQ-ECDLP-002 or promote any toy relation result into a
      cryptanalytic break. It closes only the displayed parameter region if the
      proof and independent audit pass.
    - >-
      A failed symbolic check, timeout, or implementation defect is
      inconclusive rather than evidence against the mathematical statement.
  estimated_cost:
    implementation: low
    compute: low
  dominated_by:
    - IDEA-20260727-003
  sota_delta: >-
    Extends the existing free-oracle m <= 4 accounting gate with a formal
    degree-to-cardinality bound and a target-coverage lower bound; it is a
    narrower theorem than a universal prime-field ECDLP closure and does not
    claim an asymptotic improvement over rho.
  recommended_priority: high
  status: proposed
  proposed_by: coordinator
  source_refs:
    - knowledge/techniques/KN-TECH-003.md
    - knowledge/techniques/KN-TECH-005.md
    - knowledge/literature/KN-LIT-006.md
    - knowledge/open-problems/KN-OPEN-019.md
    - ledger/proposals/IDEA-20260727-003.yaml
    - ledger/proposals/IDEA-20260727-007.yaml
