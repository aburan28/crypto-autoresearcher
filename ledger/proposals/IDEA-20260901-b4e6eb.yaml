idea:
  id: IDEA-20260901-b4e6eb
  question_id: RQ-ECDLP-002
  added: '2026-09-01'
  title: >-
    THE TRANSPORT LEMMA THAT CARRIES THE LAST OPEN DISJUNCT OF ECDLP-IDEA-436
    INTO AN ALREADY-BOUNDED CLASS: the precision-r p-adic digits of the canonical
    prime-to-p lift are an EXPLICITLY COMPUTABLE function of the F_p point, by a
    Hensel-plus-projection procedure costing poly(r, log p), so every D2 digit
    statistic is an F_p-coordinate statistic -- which disposes of D2's
    information claim outright and puts its computational claim inside the
    Weil-scale ceiling that IDEA-20260815-f558e4 already measures, with the
    degree gap between the two the one thing left to measure
  class: control

  claim: >-
    Frozen setting, inherited verbatim from the repaired hypotheses of the
    2026-08-31 ECDLP-IDEA-436 erratum: E/F_p with good reduction, a Weierstrass
    model over Z_p realising it (v_p of the discriminant equal to 0), S in
    E(F_p) of order n with gcd(n, p) = 1, S-hat the canonical order-n
    prime-to-p lift. Disjunct D2 of that record's hypothesis H is, verbatim, 'a
    fixed statistic of the precision-r coordinate digits of [k]S-hat', and the
    erratum returns it OPEN and explicitly NOT gated.

    (A) THE TRANSPORT LEMMA, WITH ITS PROCEDURE, WHICH IS THE WHOLE RECORD.
    Reduction restricted to the prime-to-p torsion is an isomorphism
    E(Q_p)[n] -> E(F_p)[n] (KN-TECH-73630e), so [k]S-hat is the unique order-n
    lift of [k]S and depends on nothing else. It is COMPUTED as follows, and
    this is stated as a procedure rather than as an existence claim because the
    procedure is the experiment's blocking control: given [k]S in E(F_p) and a
    precision r, Hensel-lift the point to ANY T in E(Z/p^r Z) reducing to it;
    E(Z/p^r Z) splits as the prime-to-p part times the kernel of reduction,
    which is a p-group of exponent dividing p^{r-1}; therefore [p^{r-1}]T kills
    the kernel component, and multiplying by the inverse of p^{r-1} modulo n
    returns [k]S-hat modulo p^r. Cost: O(r log p) group operations on
    E(Z/p^r Z), hence poly(r, log p) bit operations. CONSEQUENCE: for every r
    and every statistic T, the value T(digits_r([k]S-hat)) equals
    Phi_{r,T}([k]S) for an explicit poly-time Phi_{r,T} depending only on
    (E, p, r, T).

    (B) WHAT (A) DISPOSES OF, RIGOROUSLY AND MODEL-FREELY. Any party holding the
    F_p point [k]S can compute every D2 value itself, so the conditional entropy
    of a D2 oracle's output given that party's view is exactly 0. D2 supplies
    ZERO INFORMATION. This is the coordinate-level instance of the boundary
    KN-TECH-73630e already records, and this record claims NO novelty for it --
    that record states in its own text that a non-group-theoretic p-adic
    invariant 'would offer at most a computational handle, never an information
    gain'. What is new here is the explicit procedure and cost in (A), which
    converts that sentence from a statement about information into a statement
    about a COMPUTATION that an experiment can run and check.

    (C) WHAT (A) TRANSPORTS, AND WHERE THE REAL QUESTION NOW LIVES. The
    computational handle KN-TECH-73630e leaves open is exactly the erratum's D2
    sub-question: is there a statistic T and a precision schedule r(n) making
    T(digits_r(.)) a nonconstant homomorphism-like map from <S> to a small
    target? By (A) that map is a function of the F_p coordinates, i.e. it lies
    in the CLASS that IDEA-20260815-f558e4 sub-result (E) bounds -- 'v derived
    from curve coordinates ... any function cut out by bounded-degree algebraic
    conditions' -- whose majority advantage q_maj minus 1/s is pinned at
    O(n^{-1/2}) by square-root cancellation in character sums over the points of
    an elliptic curve. Two further consequences follow at zero compute. First,
    the EXACT homomorphism version is settled outright for prime n: a group
    homomorphism from a cyclic group of prime order n to any group of order
    below n is trivial, so 'homomorphism-like' can only mean approximate, and an
    approximate homomorphism is precisely a large Fourier coefficient along the
    discrete-log coordinate, which is the quantity f558e4's bound caps. Second,
    the COST version is settled: a D2 statistic costs poly(r, log p) per
    evaluation by (A) while the x-coordinate it is a function of costs O(1), so
    for use as an iteration-function hash inside rho, D2 is strictly dominated
    for every r > 1 and degenerates to the plain F_p coordinate at r = 1.

    (D) THE GAP THAT MAKES THIS AN EXPERIMENT AND NOT A MEMO, STATED AGAINST
    THIS RECORD'S OWN INTEREST. f558e4's bound is quoted there 'up to the degree
    of the defining conditions'. Phi_{r,T} is poly-TIME but is NOT a
    bounded-degree algebraic function of the F_p coordinates: it is the output
    of a Hensel iteration and a projection, and its degree as an algebraic map
    is not controlled by anything this record can cite. SO THE TRANSPORT PUTS D2
    IN THE COMPUTABLE CLASS BUT NOT AUTOMATICALLY IN THE BOUNDED-DEGREE CLASS
    THE WEIL BOUND COVERS. Whether the pinning survives the degree gap is a
    measurement, it is cheap, and both of its outcomes are informative: a
    measured advantage tracking the plain x-bucket comparator and decaying like
    n^{-1/2} disposes of D2 on a measured ground; a measured advantage that does
    NOT decay means either (A) is wrong -- checkable directly, and the
    instrument checks it -- or f558e4 (E) does not reach this family, and either
    is a lead.

  mechanism: >-
    THE TRACKED OBJECT. The precision-r digit vector of the canonical
    prime-to-p lift, digits_r(x([k]S-hat)) and digits_r(y([k]S-hat)), truncated
    through a declared ladder of statistics. The claim of this record is that
    this object is NOT a new projection of the ECDLP state at all but a
    re-encoding of an old one, and the transport lemma is the proof; the
    lossy-projection test is applied to it explicitly in
    object_first_candidate and it FAILS at the compatibility clause in the
    informative direction, which is the finding.

    STAGE 1 (ZERO COMPUTE). Write (A) with the projection step in full,
    including the case r = 1 where it is vacuous, and state where it needs
    gcd(n, p) = 1 (everywhere: the kernel of reduction is a p-group and the
    argument is exactly that n is prime to p). Write the prime-n homomorphism
    argument of (C). Write (D) as an explicit disclosure of what the transport
    does not buy.

    STAGE 2 (BLOCKING INSTRUMENT CONTROL, AND THE HEART OF THE DESIGN). For toy
    curves and known k, compute [k]S-hat TWICE: once by lifting S to S-hat and
    multiplying by k in E(Z/p^r Z), and once by the procedure of (A) applied to
    the F_p point [k]S alone, WITH k WITHHELD FROM THAT CODE PATH by
    construction. The two must agree digit for digit at every tested r. If they
    do not, (A) is false as a procedure and the record stops -- and that
    outcome would itself be significant, because it would mean the lift carries
    something the F_p point does not, contradicting KN-TECH-73630e.

    STAGE 3 (THE MEASUREMENT). For a declared ladder of D2 statistics, measure
    the majority advantage q_maj minus 1/s in exactly the estimator
    IDEA-20260815-f558e4 uses, so the numbers are comparable to that record's
    committed values rather than merely similar. Ladder: (T1) the j-th p-adic
    digit of x([k]S-hat) for j = 0, 1, 2 bucketed into s classes; (T2) the
    quadratic character of the j-th digit; (T3) the leading-digit interval
    bucket at precision r; (T4) the pair (digit_0, digit_1) bucketed; (T5) the
    valuation of x([k]S-hat) minus x([j]S-hat) for a FIXED reference j -- which
    is D1, already disposed by the erratum, included here ONLY as a known-answer
    calibration that must return the erratum's predicted two-valued behaviour.
    Sweep at least six prime subgroup orders spanning a 6x range.

    STAGE 4 (COMPARATORS AND NULLS), on the identical estimator. See
    null_object_control.

    STAGE 5 (DECAY). The advantage must shrink like n^{-1/2}. An advantage flat
    in n is the canonical artifact tell of docs/inventor-protocol.md section 3
    and is reported as a controlled null, not as structure.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE: CRYPTO_KB_QDRANT_URL is ':memory:' and the
      derived index is empty, so every query would return nothing for reasons
      unrelated to novelty. The crypto-kb MCP tools were NOT called and their
      silence is not read as novelty. Screening by direct reading: full reads of
      KN-TECH-73630e, the 2026-08-31 ECDLP-IDEA-436 gate erratum (sections A
      through D as far as D.8), KN-FIND-002, KN-FIND-b7e091, the claim section
      of IDEA-20260815-f558e4, IDEA-20260807-df906f and H-PROP-c95932; greps
      over the repository for 'Kohel|Shparlinski|character sum|exponential sum|
      Fourier', for 'Coppersmith|small root', and for 'O/(pi-1)'.
    results: >-
      KN-TECH-73630e states the information-emptiness of the lift and names the
      coordinate/valuation escape, but gives no computation, no cost, and no
      statistical bound. The erratum disposes D1 on a model-free ground and
      returns D2 open with the homomorphism-like sub-question attached; it does
      not mention character sums, Fourier analysis, IDEA-20260815-f558e4, or the
      prime-order homomorphism argument. IDEA-20260815-f558e4 supplies the
      Weil-scale pinning for F_p-coordinate statistics and contains no p-adic
      content whatever. NO record connects the two, and no record states the
      transport lemma or its procedure. A 'FROBENIUS-FOURIER' pre-admission
      artifact and a rejected 'heavy fourier preflight' contract exist under
      coordination/ and ideas/rejected/ and were NOT opened in this session;
      they are flagged as a blocking first-stage read for any successor, because
      an unread adjacent artifact is exactly how a duplicate gets filed.
    verdict: >-
      UNVERIFIED, and the label is CAPPED rather than chosen. On its content
      this record has the shape of an ADAPTATION -- a known technique, the
      Weil-scale pinning of coordinate statistics already established in this
      corpus, applied in a new setting, the p-adic digit family, via a transport
      lemma that is new to this corpus and elementary in itself -- and the
      INTERNAL sources carrying that reading were opened in full this session
      (KN-TECH-73630e, the 2026-08-31 gate erratum, KN-FIND-002, KN-FIND-b7e091,
      and the claim section of IDEA-20260815-f558e4). But the record also leans
      on citations[3], the Kohel-Shparlinski and Lange-Winterhof character-sum
      lineage, which is marked `recalled` because NO agent in this program has
      opened it; the one fetch attempt made this session failed with a transport
      error. Under AGENTS.md rule 9 a `recalled` reference may not support a
      novelty_status above `unverified`, and that rule is not negotiable on a
      source nobody has read, so the field is `unverified` and the citation
      stays exactly as written -- the citation is honest and useful as a
      pointer; it was the label that was too strong. THE SPECIFIC ACT THAT WOULD
      LICENSE REVISITING THE LABEL: an agent reads the character-sum sources and
      records the verification in a new record. The EXTERNAL novelty of the
      transport lemma and of the measurement is likewise unestablished and is
      recorded as such rather than claimed.

  citations:
    - ref: KN-TECH-73630e
      provenance: internal
      claim: >-
        Reduction restricted to prime-to-p torsion is a group isomorphism
        E(Q_p)[n] -> E(F_p)[n]; the lift is information-theoretically empty and
        S-hat is a deterministic function of S computable to any precision by
        Hensel lifting plus the order condition; the only escape is a
        non-group-theoretic coordinate or valuation invariant, which would offer
        at most a computational handle.
      verified_by: this task (record read in full 2026-09-01)
    - ref: ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
      provenance: internal
      claim: >-
        H is the disjunction D1 or D2; D1 is disposed in scope on a model-free
        ground; D2 is NOT gated, is returned to the record open, and carries the
        homomorphism-like sub-question and the repaired minimal-model
        hypothesis.
      verified_by: this task (sections A through D.8 read 2026-09-01)
    - ref: IDEA-20260815-f558e4
