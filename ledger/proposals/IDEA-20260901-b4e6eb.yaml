  assumptions:
    - >-
      The erratum's repaired frozen setting, adopted unchanged: good reduction,
      a Weierstrass model over Z_p with v_p(discriminant) = 0, gcd(n, p) = 1.
      MODEL NON-MINIMALITY IS EXCLUDED, exactly as repair R-F1 requires.
    - >-
      Points whose order is divisible by p are OUT OF SCOPE, which includes
      every generator of an anomalous curve #E(F_p) = p. This record therefore
      says NOTHING about the Smart / Satoh-Araki / Semaev additive transfer and
      must not be read as saying anything about it.
    - >-
      n prime. Load-bearing for the homomorphism argument of (C) and for the
      f558e4 machinery; the composite case is excluded and is used as a control.
    - >-
      Toy scale throughout, p up to about 30 bits, because the estimator needs
      dense bucket occupancy and because the whole subgroup must be enumerable
      for q_maj to be computed exactly rather than sampled.

  proof_search_map:
    bottleneck: >-
      Not the transport lemma, which is a page, but the DEGREE GAP of claim (D):
      whether a poly-time but unbounded-degree function of the F_p coordinates
      is still pinned at the Weil scale. Every downstream statement depends on
      that and nothing this record can cite settles it, which is why the
      deliverable is a measurement and not a closure.
    baseline_embedding:
      parameter_slice: >-
        r = 1. At precision 1 the digit vector IS the F_p coordinate pair, the
        transport lemma is vacuous, and the D2 ladder collapses to exactly the
        x-coordinate bucket statistic whose q_maj IDEA-20260815-f558e4 has
        already committed at p = 101, 103, 107.
      reproduction_check: >-
        The r = 1 edge of the sweep must reproduce that record's committed
        q_maj values for the x-bucket at matched (p, s), in exact rational
        arithmetic, read from that record's own committed text rather than
        assumed here. Identical numbers or the two pipelines disagree and
        neither may report an advantage. Note the caveat that record records
        against itself: those three curves were used at full COMPOSITE group
        order, so the fixture is a pipeline check and not evidence about the
        prime-order theory.
    observation_collision:
      observable: >-
        The measured majority advantage q_maj minus 1/s of a statistic at given
        (n, s).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: two structurally different statistics
        with the same advantage -- a D2 digit statistic at r = 3 and the plain
        x-coordinate bucket at the same s. A collision there does NOT falsify
        the measurement; it is the predicted outcome and it CALIBRATES the
        claim, bounding it to 'D2 is not distinguishable from its own r = 1
        shadow'. Reporting a D2 advantage without running that comparator is
        prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the D2 family from the p-adic model, where no bound is
          available, to the F_p-coordinate model, where a measured bound
          already exists, by the explicit map Phi_{r,T}. Encoding: exact.
          Completeness: exact, every D2 statistic is in the image. Soundness:
          exact for the INFORMATION claim; NOT established for the
          STATISTICAL claim, because the transfer does not preserve algebraic
          degree -- that is the disclosed cost loss and it is claim (D).
        predicted_gain: >-
          Disposes of D2's information half at zero compute and reduces its
          computational half to one already-instrumented measurement, rather
          than to new p-adic theory.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the advantage) fixed and vary the forgotten
          structure (the precision r). If the advantage is independent of r,
          the p-adic content is inert and the object is its r = 1 shadow; if it
          grows with r, an intrinsic invariant distinguishes them and that is
          the lead.
        predicted_gain: >-
          Turns 'is there p-adic structure' into a one-dimensional curve in r
          with a predicted flat shape.
    quantifier_order: >-
      TRANSPORT LEMMA: FOR ALL E, p, n, r satisfying the frozen setting, THERE
      EXISTS a poly(r, log p) procedure Phi_r, depending on (E, p, r) and NOT on
      k or on any secret, such that FOR ALL k, digits_r([k]S-hat) =
      Phi_r([k]S). The witness Phi_r is allowed to depend on the instance data
      that is PUBLIC and is forbidden to depend on k; the code must enforce that
      separation and the static provenance gate must be run over it.
      MEASUREMENT CLAIM: FOR ALL statistics in the DECLARED ladder, FOR ALL
      tested (n, s), the advantage does not exceed the x-bucket comparator by
      more than the pre-registered band. The quantifier is over the declared
      ladder, not over all statistics, and nothing here claims a result about
      statistics outside it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'the transport lemma holds as a checked procedure on the tested
        curves and precisions, and on this toy family the declared p-adic digit
        statistics show no advantage exceeding their own r = 1 shadow beyond the
        pre-registered band, with the excess decaying like n^{-1/2}'. It can
        NEVER certify that no statistic of the digits helps, because that
        quantifies over all statistics; it certifies nothing about
        cryptographic n; and it certifies nothing about the ECDLP.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is a p-adic
        statistic on a curve and point where a genuine p-adic separation
        exists. The obvious candidate -- an anomalous curve -- is NOT usable,
        and the reason is recorded rather than rediscovered: validator finding
        F-4 of the 2026-08-31 round establishes that on #E(F_p) = p a generator
        has order p, violating gcd(n, p) = 1, so the canonical order-n lift does
        not exist and the statistic is undefined, not merely uninformative. The
        substitute this record adopts, following that finding's own forward
        guidance, is a NON-GENERATOR of prime-to-p order on an anomalous curve,
        where the object is defined while the additive transfer still applies to
        the full group. Whether that is a useful calibration is itself reported.
    proof_obligations:
      - claim: >-
          digits_r([k]S-hat) is computable from [k]S alone in poly(r, log p) by
          the stated Hensel-plus-projection procedure.
        responsibility: correctness
      - claim: >-
          The projection step [p^{r-1}] kills the kernel of reduction and the
          multiplication by the inverse of p^{r-1} mod n restores the order-n
          component.
        responsibility: correctness
      - claim: >-
          For prime n, every group homomorphism from <S> to a group of smaller
          order is trivial.
        responsibility: strictness
      - claim: >-
          The r = 1 edge reproduces IDEA-20260815-f558e4's committed fixture
          exactly.
        responsibility: baseline
      - claim: >-
          The transport procedure's code path never reads k.
        responsibility: interface
      - claim: >-
          Every reported advantage names r, s, n, the statistic and the sample
          size, and the estimator is the one f558e4 defines.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The precision-r p-adic digit vector of the canonical prime-to-p lift of
      [k]S, through a declared truncation ladder.
    lossiness: >-
      Lossy as a map to a small target, yes -- but the lossy-projection test of
      docs/inventor-protocol.md section 2 asks a second question, and that is
      where this object fails in the direction that matters. The test requires
      that what is discarded be discarded COMPATIBLY with the target's
      operations so that the retained part propagates. Here the object is not a
      further projection of the state at all: by the transport lemma the digit
      vector is a FUNCTION of the F_p point, computed at extra cost. Relative to
      the F_p coordinates it is not lossy but REDUNDANT, and a redundant
      re-encoding is a change of coordinates rather than a new object -- the
      exact failure mode the protocol's worked example illustrates. Relative to
      the group element it is lossy only in the same way the x-coordinate
      already is.
    propagation: >-
      Inherits exactly the propagation of its r = 1 shadow, and no more, by the
      transport lemma. Under the group law it cannot propagate exactly, by the
      rigidity theorem of IDEA-20260807-df906f; probabilistically it is
      predicted to sit at the Weil scale, and that prediction is the
      measurement.
    survival_score: >-
      Predicted to die at the first group operation exactly where its r = 1
      shadow dies, at every precision. The measurement's job is to check that
      the precision dial moves nothing, which is a falsifiable statement about a
      curve in r rather than a single number.

  null_object_control: >-
    NULL-1, THE MATCHED IMAGE-SIZE RANDOM FUNCTION (blocking). A keyed hash of
    the point truncated to the same image size as the statistic under test, run
    through the identical q_maj estimator. DECAY PARAMETER: sample size; a
    finite-sample advantage shrinks like M^{-1/2} and a real one does not.
    NULL-2, THE PRECISION NULL, and this is the null specific to this record.
    Replace the true canonical lift by a WRONG lift: Hensel-lift S to E(Z/p^r Z)
    WITHOUT the order-n projection, so the point carries a formal-group
    component and is not the canonical lift. If the measured advantage is the
    same, the measurement is about Hensel digits in general and NOT about the
    canonical lift, and no D2-specific conclusion may be drawn. This is the null
    that separates the object from its ambient arithmetic.
    COMPARATOR (blocking, and the primary axis of comparison). The plain
    x-coordinate bucket at matched s -- the object's own r = 1 shadow -- on the
    identical estimator and the identical curves. The claim of this record is
    that the two coincide; a report that omits the comparator is uninterpretable.
    POSITIVE CONTROL A (blocking). The D1 valuation statistic (T5), whose
    behaviour the erratum predicts exactly: two-valued, equal to r on the
    plus-or-minus fibre and 0 off it. The instrument must reproduce that. An
    instrument that cannot see the one p-adic statistic whose answer is known
    cannot be trusted on the ones whose answer is not.
    POSITIVE CONTROL B (blocking). A PLANTED statistic with a known large
    advantage: the discrete-log interval bucket, which f558e4 measures flat near
    0.5 independent of s. The estimator must recover it.
    CONTROL C. Composite-order subgroup at matched size, where the prime-n
    homomorphism argument of (C) must FAIL and a genuine nontrivial
    homomorphism exists. If the pipeline reports the same pinning there, it is
    measuring its own default path.

  discriminated_from:
    - >-
      ECDLP-IDEA-436 and its 2026-08-31 erratum. Those records GATE D1 and leave
      D2 open; this record addresses D2 only, adopts their repaired hypotheses
      verbatim, and reaches D2 by a route neither uses. It does NOT reopen D1,
      does not contest the erratum's disposition, and claims nothing about the
      record as a whole -- disposition is the Coordinator's authority.
    - >-
      KN-TECH-73630e. That technique states the information-emptiness and names
      the coordinate escape as remaining open. This record supplies the explicit
      procedure and cost, and then attacks the escape it names. It does not
      contradict it anywhere; it is the successor that record's own 'what
      remains open' section asks for.
    - >-
      IDEA-20260815-f558e4. That record's sub-result (E) supplies the bound. This
      record supplies the TRANSPORT that makes the bound apply to a family
      f558e4 never mentions, and discloses in claim (D) the degree gap that
      makes the application a measurement rather than a corollary. Filing this
      as a restatement of f558e4 would be wrong in exactly one place, and that
      place is (D).
    - >-
      IDEA-20260807-df906f. That record measures a propagation DEFECT for
      division-polynomial residue vectors. This record measures a majority
      ADVANTAGE for p-adic digit statistics. Different object, different
      estimator, different escape; the shared content is the rigidity theorem,
      which is cited and not re-derived.
    - >-
      KN-FIND-002 and KN-FIND-b7e091, AUTHORITATIVE BUT CONTESTED as of the
      2026-08-31 review round, which recorded three defects including the false
      premise End_{F_p}(E) = Z and a contradiction between the two records on
      the incidence oracle. THIS RECORD DOES NOT DEPEND ON EITHER, AND THE
      DEPENDENCE QUESTION IS ANSWERED RATHER THAN AVOIDED: the transport lemma
      is a statement about Hensel lifting, the information consequence is
      conditional entropy, and the statistical consequence rests on character
      sums. None of the three uses a generic-group model, a simulability
      argument, or the Shoup bound. If the pending review-breakthrough round
      re-tiers either finding in either direction, nothing in this record moves.
      Where the erratum's corrected endomorphism derivation is used elsewhere in
      this session it is cited from the erratum, never from b7e091's premise.

  predictions:
    - metric: >-
        P1 -- the advantage q_maj minus 1/s for each D2 statistic in the
        declared ladder at r = 1, 2, 3, minus the same quantity for the plain
        x-coordinate bucket at matched s and matched n
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. An absolute difference at or below 0.01
        at every tested (n, s, r) records the CLOSURE branch: the precision dial
        moves nothing and D2 is its own r = 1 shadow. A difference at or above
        0.05, reproduced at three or more prime orders AND not decaying with n,
        records the LEAD branch and triggers mandatory independent review before
        any interpretation. Anything strictly between is INCONCLUSIVE in
        advance. BASIS: these are PRE-REGISTERED TOLERANCES chosen from the
        n^{-1/2} scale at the tested sizes, not measurements, and they are
        deliberately the same shape as the bands IDEA-20260807-df906f uses so
        the two lanes remain comparable.
    - metric: >-
        P2 -- the advantage as a function of n at fixed (s, r), fitted to
        n^{-beta}
      direction: lower
      minimum_effect: >-
        A fitted beta consistent with 1/2 across at least six prime orders
        spanning a 6x range. A beta consistent with 0 -- an advantage flat in n
        -- is the canonical artifact tell and is reported as a controlled null
        unless it survives NULL-1, NULL-2 and the comparator, in which case it
        is the lead.
    - metric: >-
        P3 -- digit-for-digit agreement between the k-free transport procedure
        and the direct lift-then-multiply computation, over all sampled k and
        all tested r
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT on 100 percent of samples. This is a decision, not an
        estimate. Any disagreement means the transport lemma is false as a
        procedure and the record stops; it would also contradict KN-TECH-73630e
        and would be the single most informative outcome available here.
    - metric: >-
        P4 -- the D1 calibration statistic T5, expected two-valued with value r
        exactly on the plus-or-minus fibre
      direction: different
      minimum_effect: >-
        Exactly two distinct values, with the large value on exactly the pairs
        satisfying k congruent to plus or minus j mod n. KNOWN-ANSWER
        CALIBRATION from the erratum's Proposition E; any other outcome means
        the p-adic arithmetic is wrong and every number downstream is void.
    - metric: >-
        P5 -- the advantage measured against NULL-2 (Hensel lift without the
        order-n projection) at matched (n, s, r)
      direction: different
      minimum_effect: >-
        Reported whatever its value. If NULL-2 matches the true-lift advantage,
        no conclusion specific to the CANONICAL lift may be drawn and the
        result is about Hensel digits generally; that is a different and weaker
        statement and the record must say so rather than rounding it up.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write the transport lemma with its
      projection step, and the prime-n homomorphism argument.
      STAGE 1 (hours): implement E(Z/p^r Z) arithmetic and the two computation
      paths for [k]S-hat, with k structurally withheld from the transport path.
      Run P3 at p in the 16 to 30 bit range, r in {1, 2, 3, 4}, 10^4 sampled k
      per cell. HARD GATE: exact agreement or stop.
      STAGE 2 (HARD GATE, minutes): P4, the D1 calibration; POSITIVE CONTROL B,
      the discrete-log interval statistic; and the r = 1 fixture against
      IDEA-20260815-f558e4's committed values.
      STAGE 3 (hours): P1 and P2 over at least six prime subgroup orders
      spanning a 6x range, s in {2,...,8}, r in {1, 2, 3}, with q_maj computed
      EXACTLY by complete enumeration of the subgroup rather than sampled, which
      is why the ladder stops near 30 bits.
      STAGE 4 (hours): NULL-1, NULL-2 and the comparator on the identical
      estimator.
      STAGE 5 (only if the LEAD branch fires): the anomalous non-generator
      nearby-object control, then stop and route to independent review.
      NO ATTACK IS RUN, no scalar is recovered outside the toy calibration, and
      no key material of any kind is involved.
    controls:
      - NULL-1 matched image-size random function (blocking)
      - NULL-2 Hensel lift without the order-n projection (blocking, record-specific)
      - COMPARATOR the plain x-coordinate bucket at matched s (blocking)
      - POSITIVE CONTROL A the D1 valuation statistic with its known two-valued answer (blocking)
      - POSITIVE CONTROL B the discrete-log interval statistic (blocking)
      - CONTROL C composite-order subgroup where the homomorphism argument must fail
      - r = 1 fixture agreement with IDEA-20260815-f558e4's committed values (blocking)
      - static check that the transport code path never reads k (blocking)
    required_metrics:
      - q_maj and the advantage per (statistic, r, s, n), computed exactly, with the estimator named
      - fitted decay exponent beta per statistic with fit residuals
      - digit-for-digit agreement rate of the two computation paths, per r
      - the D1 calibration's value set and fibre
      - NULL-1, NULL-2 and comparator advantages on the identical estimator
      - wall-clock and peak memory per stage, and the p-adic precision actually reached
      - pass or fail of every gate control

  falsification_conditions:
    - >-
      F1. P3 disagreement: the transport procedure and the direct lift differ at
      some digit. The transport lemma is false as a procedure, the record stops,
      and the disagreement is archived verbatim as the refutation artifact --
      it would also contradict KN-TECH-73630e and requires independent
      replication before anything is concluded from it.
    - >-
      F2. The D1 calibration returns other than two values on the predicted
      fibre. The p-adic arithmetic is wrong; nothing is reported.
    - >-
      F3. The r = 1 edge disagrees with IDEA-20260815-f558e4's committed
      fixture. Pipeline bug; both lanes blocked until the discrepancy is located.
    - >-
      F4. A D2 statistic exceeds its r = 1 shadow by 0.05 or more, reproducibly,
      with the excess NOT decaying in n and NOT reproduced by NULL-1 or NULL-2.
      The transport does not carry the statistical claim, claim (D)'s degree gap
      is real and consequential, and D2 is a live object. This is the LEAD
      branch. It would still be no attack: converting an advantage into key
      recovery needs a separate proposal with its own exponents and cost table.
    - >-
      F5. Every D2 statistic matches its r = 1 shadow within the band and decays
      like n^{-1/2}. The predicted outcome. D2's computational half is disposed
      IN THE TESTED SCOPE on a measured ground, and the honest headline is a
      transport lemma plus a controlled null. It closes the declared ladder and
      NOT the sub-question, which quantifies over all statistics.
    - >-
      F6. NULL-2 matches the true-lift advantage. No canonical-lift-specific
      conclusion; the result is about Hensel digits in general.
    - >-
      F7. Precision-r arithmetic exceeds the wall-clock budget before the ladder
      resolves. INFRASTRUCTURE outcome under AGENTS.md rule 5, recorded as such
      and never as evidence about D2.

  confounders:
    - >-
      Bucket occupancy. q_maj is computed exactly by complete enumeration here,
      so the estimator degeneracy that afflicts sampled defect measurements does
      not arise -- but only because the subgroup is enumerable, which caps the
      ladder near 30 bits. That cap is a design constraint, not an oversight.
    - >-
      Toy-scale image ratio. At 20 to 30 bits an image of 8 buckets is a far
      larger fraction of the group than any cryptographic analogue, biasing
      TOWARD apparent structure, i.e. toward a false positive. Disclosed; the
      field-size ladder is the only defence.
    - >-
      Precision versus field size. Increasing r increases the arithmetic cost
      and the digit alphabet simultaneously; an apparent advantage growing with
      r could be an alphabet-size effect. The comparator must be matched on
      IMAGE SIZE s, never on r.
    - >-
      The sampler uses a known k. The transport code path must not read it and
      the static provenance gate must be run over that path; a statistic that
      reads k is measuring its own input.
    - >-
      Accidental smoothness of the group order and the anomalous case at toy
      scale, excluded per KN-TECH-034 before a curve enters the run set. The
      anomalous case is doubly excluded here because the lift is undefined there.

  interpretation_limits:
    - >-
      Claim (B) is an INFORMATION statement and is not novel to this program;
      KN-TECH-73630e states it. Only the explicit procedure, its cost, the
      transport into f558e4's class, the prime-n homomorphism argument, and the
      measurement are offered as this record's content.
    - >-
      Claim (C) is CONDITIONAL on f558e4's sub-result (E), which is itself a
      prediction in that record and not a validated finding, and on the degree
      gap of claim (D), which is open. Nothing here may be cited as an
      unconditional bound on p-adic statistics.
    - >-
      A closure branch closes the DECLARED LADDER on the TESTED toy family. It
      does not close ECDLP-IDEA-436's D2 sub-question, which quantifies over all
      statistics and all precision schedules, and it does not close
      KN-OPEN-3417fc, which quantifies over any computable non-group-theoretic
      coordinate or valuation invariant.
    - >-
      No disposition, status change, or claim about ECDLP-IDEA-436 as a record
      is made or implied; those are the Coordinator's authority.
    - >-
      Toy tier throughout. Nothing about cryptographic n follows from any
      outcome and no extrapolation is licensed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a prime-order subgroup <S> of E(F_p) and any statistic v of the F_p
        coordinates whose defining conditions have degree d, the majority
        advantage satisfies q_maj minus 1/s = O(d * n^{-1/2} * log n), uniformly
        in s at most n^{1/4}.
      rigorous_support: >-
        The rigorous ingredient is square-root cancellation for character sums
        over the points of an elliptic curve (the Kohel-Shparlinski and
        Lange-Winterhof lineage, RECALLED and not opened in this session),
        composed with the elementary Fourier expansion of the majority advantage
        along the discrete-log coordinate that IDEA-20260815-f558e4 sub-result
        (E) writes out. The classical distribution statement it imitates is that
        the coordinates of multiples of a point behave, with respect to
        low-degree algebraic tests, like a uniformly random sequence in F_p.
        THE COMPOSITION IS UNWRITTEN IN THIS PROGRAM and inherits that record's
        own status as a prediction rather than a theorem.
      validation_plan: >-
        SAMPLE: complete enumeration of the prime-order subgroup at six or more
        prime orders spanning a 6x range in the 16 to 30 bit band, so q_maj is
        computed EXACTLY and no sampling error enters. SHORTCUT MAKING SAMPLING
        FEASIBLE: none needed and none used; the honest cost is that the
        assumption is validated only where the group is enumerable, and the
        transfer to cryptographic n is an EXPLICIT EXTRAPOLATION recorded as
        unjustified. COMPARISON DISTRIBUTION: the fitted decay n^{-beta} against
        beta = 1/2, and the per-cell advantage against the NULL-1 empirical
        distribution. TAIL CHECK: the single largest advantage observed across
        all cells against the largest observed across an equal number of NULL-1
        replicates -- a real effect must be a shift of the distribution, not one
        outlier cell. SAMPLED PARAMETERS RECORDED: p, n, s, r, statistic id,
        seed.
    - id: H2
      statement: >-
        The algebraic degree of the transport map Phi_r, as a function of the
        F_p coordinates, does not grow fast enough in r to overwhelm the
        n^{-1/2} factor of H1 at the tested sizes; equivalently, the effective
        degree d(r) entering H1 satisfies d(r) * n^{-1/2} well below the
        pre-registered band at every tested (n, r).
      rigorous_support: >-
        NONE AVAILABLE, and this is stated as the record's principal weakness
        rather than smoothed over. Phi_r is a Hensel iteration composed with a
        projection; it is poly-TIME but this record can cite no bound on its
        degree as an algebraic map, and Weil-type bounds degrade linearly in
        degree. H2 is therefore a genuine heuristic and is exactly the gap of
        claim (D). It is refutable on its own terms: prediction P2's failure at
        larger r with success at r = 1 is its refutation, and that pattern --
        advantage growing with r -- is the specific signature to hunt.
      validation_plan: >-
        SAMPLE: the same complete enumerations, but read along the r axis rather
        than the n axis: advantage as a function of r at fixed (n, s), for r in
        {1, 2, 3, 4}. PREDICTED SHAPE: flat in r. COMPARISON: the r = 1 shadow
        at matched s, and NULL-2 at matched r, which isolates whether any r
        dependence comes from the canonical lift or from Hensel arithmetic
        generally. TAIL CHECK: the largest r-slope observed over all (n, s)
        cells against the largest slope over NULL-2 replicates. TRANSFER
        ASSUMPTION, STATED: r at most 4 and n at most 2^30; no statement is made
        about the precision schedules r(n) growing with n that ECDLP-IDEA-436's
        D2 actually contemplates, and that is a REAL GAP between what is
        measured and what D2 asks, recorded here rather than in a footnote.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and none can be: the predicted outcome is
      that the object supplies nothing. The measurement itself costs
      O(n * r * log^2 p) bit operations per cell by complete enumeration. IF the
      LEAD branch fired -- an advantage not decaying in n -- the exponent
      question would become whether an approximate arithmetic-progression
      statistic in the discrete-log coordinate localises k to a sub-interval at
      poly cost, which a kangaroo method consumes directly; that question is NOT
      answered here and no exponent is claimed for it.
    memory_exponent: >-
      O(n) for the exact enumeration at toy scale, which is a property of the
      MEASUREMENT and not of any proposed algorithm. The object itself offers no
      memory axis at all: it supplies no table, no distinguished-point
      structure, and no precomputation, so there is no time-memory tradeoff to
      state for it.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map, about
      0.886*sqrt(n) group operations and small per-processor memory
      (KN-TECH-006); BSGS at 2*sqrt(n) time and sqrt(n) memory; Pohlig-Hellman
      fixing n as the largest prime factor (KN-TECH-030). For the OBJECT
      question specifically the incumbent is the pair
      (KN-TECH-73630e's information boundary, IDEA-20260815-f558e4's Weil-scale
      ceiling), and this record's contribution is a bridge between them rather
      than an entry beyond either.
    hidden_overhead: >-
      The transport lemma's poly(r, log p) hides r group operations on
      E(Z/p^r Z), each with O(r^2 log^2 p) bit cost, so a D2 statistic is
      roughly r^3 times more expensive per evaluation than the F_p coordinate it
      is a function of. That factor is the entire content of the cost half of
      claim (C) and it is stated rather than absorbed into an o(1).
    tradeoff_note: >-
      Not applicable to an attack. For the measurement, exactness is bought with
      enumeration, which caps the field-size ladder near 30 bits; sampling would
      extend the ladder at the price of an estimator variance that would swamp
      the n^{-1/2} effect being measured, which is why it is not used.

  dominated_by: >-
    AS AN ATTACK: mounts none, and is dominated on every axis by every row of the
    prime-field frontier, checked row by row. (1) Parallel rho with
    distinguished points and negation (KN-TECH-006): dominates on time, ties on
    memory, and already exploits the plus-or-minus quotient that D1 was found to
    re-derive. (2) BSGS: dominates on time, dominated on memory. (3)
    Pohlig-Hellman (KN-TECH-030): not comparable, it fixes which n is at issue.
    (4) Automorphism-discounted rho (KN-TECH-018): dominates. (5) Generic
    preprocessing at S*T^2 = n: dominates on online time, dominated on advice.
    Data and query axis: this record issues no oracle queries and produces no
    solve. AS AN OBJECT-LEVEL CONTRIBUTION the nearest incumbents are
    KN-TECH-73630e, which dominates on generality of its boundary statement and
    is dominated here on effectivity, and IDEA-20260815-f558e4, which dominates
    on the strength of its bound and is dominated here on the range of families
    the bound is shown to reach.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries, +0 on the constant factor.
    Quantified deltas actually claimed: (i) an explicit poly(r, log p) procedure
    computing the canonical lift's digits from the F_p point, converting a
    recorded information boundary into a checkable computation with a stated
    r^3 cost factor; (ii) a transport placing the last open disjunct of a live
    record inside an already-instrumented bound, with the degree gap that
    limits the transport disclosed as claim (D); (iii) a two-line settlement of
    the exact-homomorphism half of that record's open sub-question for prime n;
    (iv) an exactly computed advantage curve over six or more prime orders,
    three precisions and seven image sizes, against two nulls, one comparator
    and two blocking positive controls, at an estimated small number of
    CPU-hours. No exponent moves and none is claimed.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.93 that the transport lemma is correct as a procedure; the residual is
    the projection step's treatment of the 2-part and of points where the naive
    Hensel lift degenerates, which the P3 gate is designed to catch cheaply.
    0.99 that the prime-n exact-homomorphism argument is correct. 0.5 that
    claim (C)'s statistical transport survives the degree gap of claim (D) as a
    matter of theory -- this is genuinely uncertain and is why the measurement
    exists. OUTCOME split: 0.85 closure branch (advantage flat in r, decaying in
    n), 0.06 lead branch, 0.09 inconclusive on instrument or budget. The most
    likely honest headline is 'the p-adic digit family is its own F_p shadow,
    computed at an r^3 premium, and shows no advantage its shadow does not'.

