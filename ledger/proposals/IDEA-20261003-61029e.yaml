# IDEA-20261003-61029e
# Parameter-count comparison. Proposal only. Not approved.
idea:
  id: IDEA-20261003-61029e
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    An Edwards equation has 1 parameter and a short-Weierstrass equation has 2
  class: representation
  claim: >-
    An Edwards equation has 1 written parameter. A short-Weierstrass
    equation has 2 written parameters. Two exceeds one by 1. The
    product of the two counts is 2. Their sum is 3. The gap is a
    parameter count, not an ECDLP exponent and not an equation degree.
  mechanism: >-
    OBJECT FRAME. The object is the curve equation. The operation
    set is reading the written parameters, which is coordinate-dependent
    and is not a translation of a group element. The Edwards equation
    uses one parameter. The short-Weierstrass equation uses two.
    Two Edwards equations both have 1 parameter, so that gap is 0.
    No point is counted.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries that speed decomposition are a different object
        from these two parameter counts.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two equations are frozen before the parameters are counted.
    - No point is counted.
  proof_search_map:
    bottleneck: The parameter-count gap 1.
    baseline_embedding:
      parameter_slice: The counts 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The parameter-count gap and the product.
      distinct_preimage_search: >-
        Reporting both equations as having 1 parameter drops the gap.
        Two Edwards equations make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The Edwards equation.
        predicted_gain: One fewer written parameter. No exponent.
    quantifier_order: >-
      The equations are fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The parameter counts 2 and 1. Not an equation degree.
      nearby_object_control: >-
        Two Edwards equations. Both have 1 parameter, and the gap is 0.
    proof_obligations:
      - claim: The Edwards equation has 1 written parameter.
        responsibility: size
      - claim: The short-Weierstrass equation has 2 written parameters.
        responsibility: size
      - claim: The gap is not an equation degree.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: parameter_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Count the written parameters and subtract 1 from 2. Do not
      count a point.
    controls:
      - Two Edwards equations, whose parameter gap is 0.
      - An independent count.
    required_metrics:
      - both parameter counts
      - the gap
      - the product
  falsification_conditions:
    - The short-Weierstrass parameter count is not 2.
    - The product of the two counts is not 2.
  confounders:
    - A twisted Edwards equation writes two parameters and is a different equation.
  interpretation_limits:
    - A parameter count is not a walk length.
    - No transfer to a cryptographic curve.
    - This is not a comparison of equation degrees.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen Edwards equation has 1 written parameter, and the
        frozen short-Weierstrass equation has 2.
      rigorous_support: >-
        No model theorem is re-proved here. The count is a reading
        of two written equations.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
