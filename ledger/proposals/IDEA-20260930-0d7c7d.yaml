idea:
  id: IDEA-20260930-0d7c7d
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    DEGREE-LEVEL THINNING BY REPRESENTATION MULTIPLICITY: a shortest isogeny of
    degree d has k(d) = #{a | d : d/X <= a <= X} balanced splits, so the list
    may omit a random 1 - rho of the DEGREES and still contain one split with
    probability 1 - (1 - rho^2)^{k/2}; unlike vertex-level subsampling this cuts
    generation TIME as well as memory, giving a Pareto family with
    time x memory about 1.75 M^2 / k, and the ceiling k <= tau(d) = p^{o(1)}
    closes it at the exponent -- reaching (p^{1/4}, p^{1/4}) would need
    k >= p^{1/6}. A building block, not an exponent mover, with an
    integer-only pre-compute test at SQIsign size
  class: algorithm

  claim: >-
    EXPONENT BUDGET, STATED FIRST. This record moves NO exponent. It acts on
    F3 (list cardinality, the number of stored and generated entries
    M = Psi(X,B) X^{1+o(1)} = p^{1/3+o(1)}, inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    Lemma 3.3) by a factor G = p^{o(1)}: time exponent 1/3 to 1/3, memory
    exponent 1/3 to 1/3, hidden overhead divided by G (the source discloses that
    the o(1) is superpolynomial, line 39). THE NUMERIC CONDITION ON F3 FOR THE
    TOTAL TO REACH 1/4 is stated and shown unattainable by this mechanism: the
    list must shrink from p^{1/3} to p^{1/4} at success probability about 1,
    i.e. rho = p^{-1/12}, which needs k >= 2 p^{1/6} representations; the divisor
    bound tau(d) = d^{o(1)} gives k = p^{o(1)}. The corollaries EndRing and
    Isogeny (Corollary 1.2, reductions as cited by the source and not checked by
    this program) inherit a constant-factor, not an exponent, change. It is
    filed under agents/idea-generator.md search heuristic 1 as a REQUIRED
    BUILDING BLOCK for any concrete costing of the incumbent (it changes the
    figure the program's NIST-I rows rest on) and as a CLOSURE of the
    representation technique at the exponent.

    (A) THE SPLIT LEMMA HAS MANY SOLUTIONS. Lemma 3.4 (paper_fulltext.md lines
    160-185) proves: if the minimal phi: E' -> E'^{(p)} of degree d is B-smooth
    then phi = eta o psi with deg psi, deg eta <= X = B^{1/2}(p/2)^{1/6}. The proof
    exhibits ONE split (a prefix of the prime factorisation). But the kernel of
    phi is cyclic, so every divisor a of d gives a unique subgroup of order a and
    a split phi = eta_a o psi_a with deg psi_a = a, deg eta_a = d/a; the split is
    admissible iff d/X <= a <= X. Let A(d) be the set of admissible divisors and
    k(d) = |A(d)|. The incumbent's list L(E', X, B) contains psi_a for every
    a in A(d), and the table keyed by codomain finds the claw (psi_a, chi) with
    chi = (eta_a-hat)^{(p)} for each of them: the algorithm needs only ONE.
    IDEA-20260805-b4bc59 (question RQ-WESO-8aff57) names k as the divisor-window
    claw count and prices it as the golden-collision multiplicity of the
    middle-memory branch; it does not use it to thin the full-memory list.

    (B) DEGREE THINNING. Fix a pseudo-random function h from the integers to
    [0, 1) (fresh per attempt) and let S_rho = {a <= X smooth : h(a) < rho} plus
    the degree 1. List only isogenies whose degree lies in S_rho. The split a
    survives iff a and d/a are both in S_rho, probability rho^2, and the splits
    {a, d/a} and {d/a, a} coincide, so there are k/2 independent unordered
    events. Hence
        P(cover | d, rho) = 1 - (1 - rho^2)^{k(d)/2}.
    The stored list has about rho M entries (the bulk of M is the outer shell of
    degrees near X, and degree-thinning keeps a rho-fraction of every shell).
    Because the lists are generated by extending a parent with one prime
    (Algorithm 1, lines 137-152) and all l+1 children of a given parent at a given
    prime have the SAME degree, discarding a degree discards whole batches, so
    generation time falls with the list (the parents, about M / l_max entries,
    are generated regardless; for B large this is a small fraction). Normalised
    cost per success C(rho) = rho / P(cover | d, rho) is minimised at
    t = k rho^2 / 2 about 1.25 (hand computation, f(t) = sqrt(t) / (1 - e^{-t}),
    f(1.25) about 1.567), giving a gain G = 1 / C_min about 0.45 sqrt(k) in BOTH
    time and memory for k >> 5. Illustration only, arithmetic on an unchecked
    input: b4bc59 estimates k of order 10^3 at the asymptotic B, which gives
    G of about 14 (3.8 bits); at the optimised B the number of prime factors, and
    so k, is smaller and the gain is smaller.

    (C) THE PARETO FAMILY. Add a sigma-invariant vertex filter: keep an entry only
    if h_v(j(cod)) < rho_v with h_v(j) = h_v(j^p) (for example a hash of the pair
    (j + j^p, j j^p)), so that both halves of a claw are kept or dropped together.
    The two ordered splits a and d/a have different midpoints and are
    independent at the vertex level. With s = k rho_d^2 rho_v the success
    probability is about 1 - e^{-s}; time is about rho_d M / (1 - e^{-s}) and
    memory rho_d rho_v M, so
        time x memory about s M^2 / (k (1 - e^{-s})) >= M^2 / k   (about 1.75 M^2 / k at s = 1.25),
    along rho_d in [sqrt(s/k), 1]. At rho_d = 1 this is the known vertex-level
    subsampling (time about 1.4 M, memory about 1.25 M / k), comparable to a van
    Oorschot-Wiener search with k golden collisions at that memory; the new content
    is the rho_d < 1 branch, where TIME also falls. At memory w the Pareto family
    has time about 1.75 M^2 / (k w) and lies below vOW with multiplicity k
    (T = sqrt(M^3 / (w k))) for w between about 3 M / k and M sqrt(1.25 / k)
    (arithmetic by hand, stated as an estimate, vOW constants omitted).

    (D) THE CEILING AND THE NEARBY OBJECT. k(d) <= tau(d), the number of divisors,
    and tau(d) = d^{O(1/log log d)} = p^{o(1)}; the number of isogenies
    E' -> E'^{(p)} of degree at most X^2 is about B^{3/2} times a constant on
    average (rank-3 count of IDEA-20260805-e7ee4a: (X^2)^{3/2} / sqrt(p)), also
    p^{o(1)}, so the total multiplicity is p^{o(1)}. To move the list from
    p^{1/3} to p^{1/4} one would need rho = p^{-1/12} and s about 1, i.e.
    k >= 2 p^{1/6}; equivalently at (T, M) = (p^{1/4}, p^{1/4}) the Pareto product
    needs M_0^2 / k = p^{1/2} with M_0 = p^{1/3}. THE NEARBY OBJECT ON WHICH THE
    MECHANISM FAILS: a degree d = l_1 l_2 with two primes near sqrt(d) has k = 2
    (one unordered split): thinning gives P = rho^2 for a list rho M, a LOSS of
    a factor rho (the instrument must read R_exc = 1 and a gain below 1 on it);
    and a multiplicative-character thinning S = {a : chi(a) = +1} (chi a quadratic
    character modulo a small prime) has perfectly correlated pair events (a and
    d/a are both in S iff d is a residue, given a in S), so it covers half the
    degrees d (almost) completely and the other half not at all, with cost per
    success exactly the incumbent's (gain 1). A derivation that said structured
    thinning could beat random thinning without a stated correlation would prove
    too much.

    TWO EXPLANATIONS DISCRIMINATED. E-REPRESENTATION: the measured k(d) of
    smooth shortest-isogeny degrees at SQIsign-I and SQIsign-V sizes has median
    at least 80 (G at least 4, two bits) and the simulated cover probability
    matches the formula; the thinned-list variant is a worthwhile concrete
    improvement of the program's cost rows and goes to an end-to-end toy test.
    E-NEGLIGIBLE: the median k is below 8 (G below 1.3, under half a bit) at the
    cells where the incumbent actually operates; the lever is exact but void at
    NIST-I, and the record's remaining content is the closure statement.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md). TRACKED OBJECT: the degree of
    an isogeny, a multiplicative function on the isogeny groupoid
    (deg(psi_b o psi_a) = deg psi_b deg psi_a). REPRESENTATION: the list is
    indexed by degree (Algorithm 1 builds it prime by prime). OPERATION SET Sigma:
    composition of isogenies, with the split lemma. TRICHOTOMY
    (IDEA-20260806-c5d183): degree is a partial-action object in the sense that
    it propagates deterministically under composition; it is not a projection of
    the vertex set (a curve has no degree), and by the sibling record
    IDEA-20260930-024033 (H2 there) it is the ONLY canonical abelian key on the
    level-marked groupoid, which is why a degree filter is available and a vertex
    filter that propagates is not. LOSSY-PROJECTION TEST against Sigma (algebraic,
    zero cost): thinning by degree discards every isogeny whose degree is outside
    S_rho; it discards compatibly with Sigma because the split lemma is a
    statement about divisors, which are preserved by the degree map, so the
    retained part still contains a split with the stated probability; it is
    genuinely lossy because it removes a (1 - rho) fraction of the entries. It is
    not a change of coordinates. THE ONE OPEN NUMBER is the distribution of k(d)
    over the shortest-isogeny degrees of random curves at cryptographic size; the
    formula for the gain is exact bookkeeping once k is known.
    WHY THIS IS NOT THE KNOWN STATEMENT. The multiplicity k is priced in
    IDEA-20260805-b4bc59 for the middle-memory (vOW) branch. IDEA-20260807-7424a9
    proposes measuring the exchange rate of list restrictions as the empirical
    probability that "the required psi" survives, against a random-sublist null
    that is 1:1 by definition; that is the right null for ONE required entry. A
    claw needs TWO entries (psi and chi), and a target with k splits has k/2
    independent chances: for independent degree thinning the per-solution survival
    is 1 - (1 - rho^2)^{k/2}, about k rho^2 / 2 for small rho, and for a
    sigma-invariant vertex filter it is 1 - (1 - rho)^k. The correct null for the
    exchange measurement of a restriction is the per-SOLUTION one, which this
    record supplies. IDEA-20260901-1f5a62 replaces smoothness by divisors and
    notes the multiplicity only through Ford's density; it lists all degrees.
    OFF-LIMITS COMPONENTS DECLARED: meet-in-the-middle and van Oorschot-Wiener are
    the comparators; the F_p-subfield descent lever and the quaternion-side
    relation collection are not used.

