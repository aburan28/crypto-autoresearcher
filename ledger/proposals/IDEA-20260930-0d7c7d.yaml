  assumptions:
    - >-
      The incumbent algorithm is Algorithm 2 with a list L(E', X, B) of all
      B-smooth cyclic isogenies of degree at most X and a codomain-keyed table;
      the thinned variant changes only which degrees are listed.
    - >-
      The shortest isogeny E' -> E'^{(p)} is the target; further solutions (Remark
      1, source line 191) only add independent chances and are ignored here
      (conservative).
    - >-
      Hash independence: the values h(a) of distinct integers are independent and
      uniform (a random function); a keyed cryptographic hash truncated to 64 bits
      stands in for it in the instrument (H1).
    - >-
      The generation time of the thinned list is proportional to the number of
      generated entries (batches of l+1 children per parent and prime); the cost
      of parents is the closure term, measured in the end-to-end arm (H4).
    - >-
      Heuristic 1 of the source is assumed wherever P0 is quoted; this record adds
      no heuristic about smoothness.

  proof_search_map:
    bottleneck: >-
      The distribution of k(d), the number of admissible divisors of the degree of
      the shortest isogeny of a random smooth-degree curve, at cryptographic size.
      The gain 0.45 sqrt(k) is the single step whose value changes the concrete
      cost; the exponent is unaffected because k <= tau(d) = p^{o(1)}.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is rho = 1: S_rho = all degrees, P(cover | d)
        = 1 for every B-smooth d (Lemma 3.4), list M, time M / P0. Reproduced
        symbolically by setting rho = 1 in (B); and numerically by checking, on
        every sampled smooth d, that k(d) >= 1 (Lemma 3.4 as an integer
        identity).
      reproduction_check: >-
        Frozen fixture 1: k(d) >= 1 for 100000 sampled B-smooth d (any cell), 0
        violations. Frozen fixture 2: on d = l_1 l_2 (two primes within a factor 2
        of sqrt(d)) the instrument returns k = 2 and the simulated cover
        probability equals rho^2 within 0.01 at every rho of the grid. Any other
        reading is an instrument defect and nothing else is read.
    observation_collision:
      observable: >-
        The pair (k(d), simulated cover probability at each rho) per sampled
        degree, and the induced gain G = 1 / min_rho C(rho).
      distinct_preimage_search: >-
        A high k can come from many prime factors (a genuinely rich divisor
        lattice) or from a repeated small prime (many divisors, but they lie close
        together in log scale and may fall in the window in clusters, correlating
        the pair events); the instrument records omega(d), Omega(d) and the log-
        spacing of A(d) beside k and reports G separately for squarefree and non-
        squarefree d. The dangerous collision is between "k large but the events
        are not independent" and "k large and independent"; the simulation with
        the explicit hash separates them by comparing P_emp with the formula.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise to the degree set S_rho (a pseudo-random subset of the
          integers), measure the per-solution survival 1 - (1 - rho^2)^{k/2}
          against the cardinality fraction rho, and pack the two thinnings
          (degree and sigma-invariant vertex) into the Pareto family
          time x memory about 1.75 M^2 / k.
        predicted_gain: >-
          A factor 0.45 sqrt(k) in both time and memory; none at the exponent.
      - transform: observable_fiber
        proposed_object: >-
          Fibre over a fixed k: degrees d with the same k and different
          factorisation shapes; the gain should depend on k only, and structured
          (character) thinning should give gain 1.
        predicted_gain: >-
          Separates a genuine representation effect from a shape artefact.
    quantifier_order: >-
      FOR ALL B-smooth integers d coprime to p with d <= (p/2)^{1/3} and every
      hash realisation h: the cover event is exactly the existence of an
      unordered admissible pair both of whose degrees lie in S_rho; FOR a random
      function h its probability is 1 - (1 - rho^2)^{k/2} (exact). The empirical
      claim: FOR the cells (p, B) in the panel, the distribution of k over smooth
      shortest-isogeny degrees is as measured, with the null law (Arm I) and the
      genuine law (Arm II) compared. EXISTS-or-not a cell with median k at least 80
      is the measurement. THE WEAKER READING NOT CLAIMED: "the thinned algorithm
      terminates faster in wall-clock", which depends on the closure term (H4).
    method_ceiling:
      strongest_certifiable_claim: >-
        The gain formula and the Pareto family are exact bookkeeping for a random
        hash; the ceiling k <= tau(d) = p^{o(1)} is a classical bound; therefore
        no exponent moves, and the numeric condition for 1/4 is k >= 2 p^{1/6}. It
        certifies nothing about the value of k at any cryptographic size until
        Arms I and II are run, nothing about other target solutions, and nothing
        about wall-clock time.
      nearby_object_control: >-
        d = l_1 l_2 with two primes near sqrt(d) (k = 2, R_exc = 1, gain below 1);
        multiplicative-character thinning (perfectly correlated pair events, gain
        1); and the random regular graph, where the divisor structure of a degree
        has no bearing. A method that reported a gain on the first two has
        mis-specified the independence.
    proof_obligations:
      - claim: For every admissible a the sub-isogeny psi_a and the complementary eta_a exist and have cyclic kernels, and chi_a = (eta_a-hat)^{(p)} lies in the list of degree d/a.
        responsibility: correctness
      - claim: The events for distinct unordered admissible pairs involve disjoint integers, so they are independent for a random function h; the pairs {a, d/a} and {d/a, a} coincide.
        responsibility: correctness
      - claim: P(cover | d, rho) = 1 - (1 - rho^2)^{k/2}, and C(rho) = rho / P is minimised at t = k rho^2 / 2 about 1.25 with gain about 0.45 sqrt(k).
        responsibility: strictness
      - claim: The stored list has expected size rho M, and the generated entries are rho M plus the parent closure.
        responsibility: size
      - claim: k(d) <= tau(d) = d^{O(1/log log d)}, so the exponent is unchanged and the 1/4 condition is k >= 2 p^{1/6}.
        responsibility: scope
      - claim: Time and memory of the Pareto family satisfy time x memory >= M^2 / k.
        responsibility: runtime
    not_applicable_reason: null

