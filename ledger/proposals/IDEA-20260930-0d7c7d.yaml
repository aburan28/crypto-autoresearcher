  minimal_test:
    design: >-
      CELLS. p in {5 * 2^248 - 1 (SQIsign level I), 27 * 2^500 - 1 (level V)};
      B in {2^20, 2^24, 2^28} (larger than the incumbent's optimum so that smooth
      samples are not rare; the incumbent's own smoothest observed sample was
      12589-smooth at 1/69232, source line 250, so B near 2^14 is reported only in
      Arm I); X = B^{1/2}(p/2)^{1/6}. ARM I (null law, integer-only, no curve and
      no quaternion machinery, runnable now): draw at least 100000 B-smooth
      integers d with density proportional to d^{1/2} on (0, (p/2)^{1/3}] (the
      rank-3 shortest-vector law; H3), by any sampler whose output is validated
      against exact smooth-integer counts in a regression cell at p near 2^40
      where direct rejection is feasible (the k-distributions of the two samplers
      must agree on the median and on the 10th and 90th percentiles within
      sampling error); for each d enumerate the divisors, form A(d) and k(d).
      ARM II (genuine law, needs a Deuring-capable environment): the source's
      section 4.2 pipeline (random maximal order, ideal P of norm p, shortest
      vector, factor its norm) until at least 500 B-smooth degrees per cell or
      1000000 draws, whichever first; cells with fewer than 100 smooth degrees are
      UNDERPOWERED (reported, not read as negative). The earlier SSIQ run's
      deferral at its first gate is an environment impediment, not evidence; Arm
      II is gated on the environment and Arm I stands alone. SIMULATION (both
      arms): for each sampled d, rho in {0.02, 0.05, 0.1, 0.2, 0.4, 0.8} and 50
      independent hash seeds per (d, rho) (a keyed 64-bit hash of the integer),
      record whether some admissible pair is covered; aggregate P_emp per cell.
      CONTROLS AS BELOW. ARM III (end-to-end, gated on an isogeny-walk-capable
      environment): p in the smallest prime at or above each of 2^24, 2^28, 2^32;
      the incumbent's Algorithm 2 with B chosen by the instrument's own optimum;
      200 random E' per cell; thinning at rho in {1, rho*, rho*/2} with
      rho* = sqrt(2.5 / median k) from Arm I; record success, entries generated,
      entries stored, wall-clock. SEEDS. One PCG64 stream per arm and cell,
      recorded; hash keys drawn from the same stream. METRICS (units).
      k (count); P_emp (fraction with CP95); G* (dimensionless); R_exc
      (dimensionless); entries (count); wall-clock and peak memory (secondary).
      OUTCOME TABLE. E-REPRESENTATION (median k at least 80 and G* at least 4 in
      at least one cell, simulation within 0.02 of the formula, Arm II within a
      factor 2 of Arm I): the thinned variant is a worthwhile concrete improvement
      and goes to Arm III and then to the cost rows of the NIST-I table.
      E-NEGLIGIBLE (median k below 8 in every cell with at least 100 smooth
      degrees): lever void at the cells that matter; the closure statement
      stands. MIXED: reported per cell. ARTIFACT (k below 1 on any sampled smooth
      d, the k = 2 control not reading rho^2, or the regression cell's samplers
      disagreeing): run void.
      FALSIFICATION THRESHOLD, FIXED NOW. E-REPRESENTATION is falsified iff the
      median k is below 80 in every cell. E-NEGLIGIBLE is falsified iff the median
      k is at least 8 in any cell with at least 100 smooth degrees. The formula
      (H1) is falsified iff the maximum deviation exceeds 0.1 anywhere.
      COST (estimate, order of magnitude): implementation low (a divisor
      enumerator, a smooth sampler and a hash simulation, about 200 lines);
      compute low for Arm I and the simulation (minutes to hours of CPU); Arm II
      and Arm III depend on the environment and are not estimated.
    controls:
      - k = 2 object d = l_1 l_2 (two primes within a factor 2 of sqrt(d)); P must equal rho^2 and G below 1.
      - Multiplicative-character thinning (a quadratic character modulo a small prime) as the perfectly correlated null; gain 1.
      - Synthetic d equal to a product of 14 distinct primes, where k is computed exactly and the formula must hold.
      - Lemma 3.4 fixture, k(d) >= 1 for every sampled smooth d.
      - Regression cell at p near 2^40 comparing the smooth sampler with direct rejection.
      - Two different hash keys per cell, to expose key-dependent bias.
    required_metrics:
      - per cell and arm, the quantiles of k, omega, Omega and the squarefree fraction
      - P_emp against the formula per rho, with the maximum deviation
      - G* and R_exc per cell
      - Arm II against Arm I median ratio
      - Pareto product against 1.75 / k per cell
      - Arm III success, entries generated and stored, wall-clock, if run
      - underpowered-cell flags and artifact flags

  falsification_conditions:
    - 'E-REPRESENTATION falsified iff the median k is below 80 in every cell of Arms I and II (threshold fixed above).'
    - 'E-NEGLIGIBLE falsified iff the median k is at least 8 in any cell with at least 100 smooth degrees.'
    - 'H1 falsified iff the maximum deviation between simulated cover probability and the formula exceeds 0.1 anywhere on the grid.'
    - 'The instrument reads a gain above 1 on the k = 2 control or on character thinning: it proves too much and is wrong at an unidentified step; nothing downstream may cite it.'
    - 'Arm II differs from Arm I by more than a factor 2 in median k at a cell with at least 100 smooth degrees: H2 falsified for that cell and the null law is not used for it.'
    - 'The end-to-end arm shows time x memory above M^2 at every rho_d: the closure term dominates and the generation-time claim is falsified at that prime.'

  confounders:
    - >-
      The cells use B larger than the incumbent's optimum so that smooth samples
      exist; k depends on B (more prime factors at smaller B for fixed d). The
      transfer from the tested B to the optimum is Arm I's job and is labelled a
      transfer; Arm II at the optimum is underpowered by construction (about
      1/69232 per draw at B = 12589).
    - >-
      k counts divisors in the window [d/X, X]; X itself depends on B, so a larger
      B widens the window (X^2 / d at least B). The panel varies B to expose this.
    - >-
      Non-squarefree degrees have clustered divisors; the instrument reports
      squarefree and non-squarefree d separately.
    - >-
      The end-to-end generation-time gain depends on the parent-closure term and
      on the implementation of batched modular-polynomial root finding; the
      source's footnote (line 156) notes the O(1) in B^{O(1)} is unexamined.
    - >-
      The shortest isogeny is not always the only usable one (Remark 1); ignoring
      the others is conservative for the gain.
    - >-
      A pseudo-random keyed hash is not a random function; two keys per cell guard
      against key-dependent structure, and the formula is checked, not assumed.

  interpretation_limits:
    - >-
      No exponent moves. Time exponent 1/3 and memory exponent 1/3 are unchanged
      under every outcome; the quantity at stake is a factor p^{o(1)} of the
      source's superpolynomial overhead, estimated at a few bits only if k is of
      order 10^3, an unchecked input.
    - >-
      Toy-scale and integer-level evidence is stated at its tier; Arm II is a
      transfer by the Deuring correspondence at the SQIsign sizes, Arm III is toy
      scale, and neither establishes a cryptographic-size attack cost.
    - >-
      The record is conditional on Heuristic 1 wherever P0 is used; it adds no
      smoothness heuristic of its own.
    - >-
      The run deferral of the earlier SSIQ delta_E instrument at its first gate
      is an environment impediment named by the handoff card; it is not evidence
      about this or any lever (AGENTS.md rule 3).
    - >-
      Degree thinning is not a vertex-level subsampling and is not claimed to
      combine with every other memory scheme; only the sigma-invariant vertex
      filter of (C) is analysed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Hash independence.) The indicator events {h(a) < rho} over distinct
        integers a are independent with probability rho, so that the cover event
        of d has probability 1 - (1 - rho^2)^{k(d)/2}.
      rigorous_support: >-
        Exact for a random function; the instrument uses a keyed 64-bit hash. It
        imitates the random-function model of subsampling and the independence of
        indicator variables of distinct points.
      validation_plan: >-
        SAMPLE at least 10000 degrees per cell, 6 values of rho and 50 seeds each;
        COMPARE the empirical cover probability with the formula; TAIL: the
        maximum deviation and the worst cell are reported, and two keys per cell
        are compared. TRANSFER: none (the statement is about integers).
    - id: H2
      statement: >-
        (Divisor law of the shortest-isogeny degree.) The number k(delta_E') of
        admissible divisors of the degree of the shortest isogeny, conditioned on
        B-smoothness, has the distribution of k over B-smooth integers of the same
        size drawn with the shortest-vector density (Arm I).
      rigorous_support: >-
        Heuristic 1 of the source (the degree behaves like a uniformly random
        integer of its size, supported at two primes by the source's section 4.2
        figures) together with classical divisor statistics (recalled). It
        extends Heuristic 1 from the largest prime factor to the whole
        factorisation, a strictly finer functional of the same object.
      validation_plan: >-
        SAMPLE Arm II at the two SQIsign primes by the Deuring correspondence
        (random maximal orders, shortest vector of the ideal of norm p, the
        source's section 4.2) until 500 smooth degrees per cell; COMPARE the
        distribution of k, omega and Omega with Arm I by two-sample
        Kolmogorov-Smirnov and by the median ratio; TAIL: the 10th and 90th
        percentiles and the largest k observed. Cells with fewer than 100 smooth
        degrees are underpowered. TRANSFER: from the tested B in
        {2^20, 2^24, 2^28} to the operating B is an extrapolation by Arm I and is
        labelled so.
    - id: H3
      statement: >-
        (Shortest-vector law.) P(delta_E' <= D) = (D / D_max)^{3/2} up to a constant
        for D_max = (p/2)^{1/3}, i.e. the density of delta is proportional to
        D^{1/2}.
      rigorous_support: >-
        The rank-3 trace-zero lattice of determinant about p (IDEA-20260805-e7ee4a,
        reproducing Theorem 1.5's constant) and the Minkowski count D^{3/2} /
        sqrt(det) of lattice vectors of norm at most D; it imitates the classical
        count of lattice points in a ball for a random lattice of that covolume.
      validation_plan: >-
        SAMPLE the Deuring-sampled shortest norms of Arm II (all draws, not only
        the smooth ones, 100000 at p = 5 * 2^248 - 1); COMPARE the empirical CDF
        of log delta with (D / D_max)^{3/2}; TAIL: the lower tail below
        D_max / 100. A mismatch changes only the weighting of Arm I (the null law
        is re-weighted to the measured law), not the formula for G*.
    - id: H4
      statement: >-
        (Closure term.) The number of entries generated by the thinned variant is
        rho M plus a parent closure of at most a fraction c / l_max of M, with c
        a constant of order 1 and l_max the largest prime of the degree, so that
        generation time falls in proportion to the stored list when B is large.
      rigorous_support: >-
        By Algorithm 1 the children of a parent at prime l all have degree
        (parent degree) * l, so dropping a degree drops whole batches; the parent
        fraction is about E[1 / l_max] over degrees weighted by their entry count.
        It imitates the standard sieving accounting of a last-layer thinning.
      validation_plan: >-
        SAMPLE Arm III at three toy primes (200 curves each) counting entries
        generated and stored; COMPARE with rho M plus the measured parent
        fraction; TAIL: the worst cell. TRANSFER: the parent fraction at the
        cryptographic B is computed from Arm I's degree distribution and is an
        extrapolation.

  heuristic_note: >-
    The formula for the cover probability and the Pareto family are exact for a
    random hash (H1 validates the hash); H2 and H3 carry the transfer to the
    genuine degree law and are validated by Arm II; H4 is the only
    implementation-dependent step and is isolated in Arm III.

  target_complexity:
    time_exponent: >-
      p^{1/3+o(1)}, unchanged; the hidden overhead is divided by G = 0.45 sqrt(k)
      on the thinned variant, G = p^{o(1)}. To reach p^{1/4} the list must shrink
      to p^{1/4}, which needs k >= 2 p^{1/6} against the ceiling
      k <= tau(d) = p^{o(1)}.
    memory_exponent: >-
      p^{1/3+o(1)}, unchanged; memory divided by up to G on the degree branch and
      by up to about k / 1.25 on the combined sigma-invariant vertex branch
      (time x memory about 1.75 M^2 / k on the Pareto family). Position on the
      van Oorschot-Wiener curve T = sqrt(N^3 / w) with N = p^{1/3}: the family lies
      below the vOW-with-k-collisions curve T = sqrt(N^3 / (w k)) for memory
      between about 3 M / k and M sqrt(1.25 / k) (an estimate by hand).
    best_known: >-
      The incumbent p^{1/3+o(1)} time and memory conditional on Heuristic 1; the
      vOW interpolation sqrt(N^3 / w), with multiplicity k priced by b4bc59.
    hidden_overhead: >-
      The o(1) of the source, superpolynomial by its own disclosure, is the
      object: the record divides it by G. It does not remove it. The sampling and
      closure terms are polylogarithmic or of relative order 1 / l_max.
    tradeoff_note: >-
      Attempts remain embarrassingly parallel; each attempt draws a fresh h. The
      degree knob and the vertex knob trade time against memory along time x
      memory about 1.75 M^2 / k; the end points are time about 1.4 M with memory
      about 1.25 M / k, and time about 1.4 M sqrt(1.25 / k) with memory
      M sqrt(1.25 / k).

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. Arm I and the simulation: about 200 lines (divisor enumeration,
      smooth sampler validated against direct rejection at p near 2^40, keyed hash
      simulation), minutes to hours of CPU on one core. Arm II needs the
      Deuring sampler of the source's section 4.2 (a quaternion-order sampler and
      a shortest-vector routine) and Arm III needs an isogeny-walk-capable
      environment; neither is estimated here. Not a measurement.

  asymptotic_claim:
    problem: full-memory list algorithm for OneEnd over F_{p^2} (RQ-SSIQ-9702af), F3 list cardinality
    prior_best: time and memory p^{1/3+o(1)} conditional on Heuristic 1 (superpolynomial o(1) disclosed)
    time_exponent: 'unchanged (1/3); gain factor G = 0.45 sqrt(k) inside p^{o(1)}'
    memory_exponent: 'unchanged (1/3); reduction factor up to G (degree) or about k / 1.25 (vertex), inside p^{o(1)}'
    hidden_cofactor: the source's superpolynomial o(1), divided by G
    claim_kind: building_block_constant_factor_with_exponent_ceiling

  dominated_by: >-
    n/a (no exponent result claimed). Checked row by row on the isogeny frontier
    as this program carries it (the ECDLP map has no isogeny rows): the
    incumbent list algorithm (p^{1/3+o(1)}, p^{1/3+o(1)}) is the baseline this
    record modifies and is dominated by the thinned variant only if k is large
    enough (E-REPRESENTATION); Delfs-Galbraith (p^{1/2} (log p)^{O(1)},
    polynomial memory) is not dominated; vOW with k golden collisions
    (T = sqrt(N^3 / (w k))) is dominated by the Pareto family for memory between
    about 3 M / k and M sqrt(1.25 / k), conditionally on H4 and not asserted. No
    row dominates this record.
  sota_delta:
    time: >-
      Zero at the exponent. A factor G = 0.45 sqrt(k) on the incumbent's
      superpolynomial overhead if k is large (illustration: 14 at k of order
      10^3, an unchecked input from b4bc59), to be measured.
    memory: >-
      Zero at the exponent. A factor up to G (degree branch) or about k / 1.25
      (vertex branch) on stored entries, to be measured.
    data_queries: Not applicable.

  frontier_check:
    status: pending
    note: >-
      tools/build_frontier_map.py --match has not been run by this agent (no
      shell). The ECDLP map has no isogeny rows. Whether degree-level thinning with
