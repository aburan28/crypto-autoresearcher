      read in the corpus entry, the others are not read.

  recommended_priority: medium
  priority_rationale: >-
    It changes no exponent and is ranked below any exponent-moving record. It is
    ranked medium because (i) it is a required building block for any honest
    concrete costing of the incumbent, whose NIST-I rows this program has already
    treated as a margin; (ii) Arm I is integer-only, needs no curve machinery and
    is not blocked by the environment impediment that deferred the earlier SSIQ
    run, so it can be executed now; (iii) it states the numeric condition (k at
    least 2 p^{1/6}) that closes the representation technique at the exponent,
    which converts "memory and list size are one object" from a comparison into a
    bound. Its negative outcome (median k below 8) is informative: it prices the
    lever at under half a bit.

  first_deliverable: >-
    Arm I on the two SQIsign primes at B = 2^20 and the k = 2, character and
    Lemma 3.4 fixtures, plus the simulation of the cover probability against the
    formula; this alone decides E-REPRESENTATION against E-NEGLIGIBLE at the null
