  discriminated_from: >-
    IDEA-20260805-b4bc59 prices k (k_div) as the golden-collision multiplicity of
    the middle-memory vOW branch and says k does not change P0; this record uses
    k to thin the FULL-memory list by degree, which also reduces generation time,
    and states the Pareto family and the numeric condition for 1/4.
    IDEA-20260807-7424a9 proposes measuring the exchange rate of restrictions
    against a single-entry random-sublist null; for degree-level restriction of a
    target with k splits and a two-entry claw the per-solution null is
    1 - (1 - rho^2)^{k/2}, which this record derives. IDEA-20260901-1f5a62
    replaces smoothness by a divisor condition, lists all degrees and treats the
    multiplicity only through the density of integers with a divisor in a window.
    IDEA-20260807-edb3f3 certifies necessary conditions for a covering
    architecture and carries no representation condition. IDEA-20260930-024033
