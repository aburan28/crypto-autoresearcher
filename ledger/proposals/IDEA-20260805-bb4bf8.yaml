  literature_context:
    - >-
      NOT READ - NO SQIsign SPECIFICATION OF ANY VERSION HAS BEEN READ BY THIS
      PROGRAM. RQ-SQISIGN-001.provenance says so explicitly and
      RQ-SQISIGN-001.constraints forbids designing an experiment on unverified
      per-scheme claims. This proposal complies by making the SQIsign-facing
      interpretation a GATED STAGE (Stage 0) and by making the measurement
      stages statements about the supersingular 2-isogeny graph alone, which
      require no specification.
    - >-
      RECALLED, UNVERIFIED: Pizer, that the supersingular l-isogeny graph is
      Ramanujan (second eigenvalue bounded by 2*sqrt(l) in the (l+1)-regular
      normalisation). No paper read; no theorem number asserted. The run
      MEASURES mu_emp and compares it to 2*sqrt(2)/3, so the recall is tested
      rather than trusted.
    - >-
      RECALLED, UNVERIFIED: cutoff for the simple random walk on Ramanujan
      graphs at (d/(d-2))*log_{d-1}(n), and for the non-backtracking walk at
      log_{d-1}(n) (associated in memory with work of Lubetzky and Peres, and
      with the non-backtracking literature). NO AUTHOR ATTRIBUTION IS ASSERTED
      AS FACT, no venue, no year, no theorem number. Both are used only as
      PRE-REGISTERED CANDIDATE SLOPES to be confirmed or refuted by measurement.
    - >-
      RECALLED, UNVERIFIED: Friedman's theorem that random d-regular graphs are
      near-Ramanujan a.a.s. Used only to derive the matched null's expected
      behaviour; the null's slope is measured, not assumed.
    - >-
      RECALLED, UNVERIFIED: the Eichler mass formula sum 1/|Aut(E)| = (p-1)/24
      and the count |SS(p)| = floor(p/12) + e. Numerically consistent at
      p = 1031 and p = 4099 as computed above; the run re-checks both at every
      ladder prime by direct enumeration.
    - >-
      RECALLED, UNVERIFIED: the coefficients of the modular polynomial
      Phi_2(X,Y). Used only as a cross-check against an independent Velu
      construction; a mismatch is an infrastructure finding.
    - >-
      READ IN-REPO: knowledge/techniques/KN-TECH-057.md, which fixes the matched
      full-cost path-finding baselines - MITM p^{2/3} over F_{p^2},
      Delfs-Galbraith p^{1/3} over F_p, van Oorschot-Wiener p^{1/2} over
      F_{p^2} and p^{1/4} over F_p conditional on unproven F_p-subgraph mixing -
      under the Wiener 3D wiring model. NOTE THE POINTED COINCIDENCE, RECORDED
      AND NOT ACTED ON HERE: that entry's own p^{1/4} row is CONDITIONAL ON A
      MIXING ASSUMPTION about a supersingular subgraph. The instrument this
      proposal builds measures exactly that class of quantity, on the full
      graph. Pointing it at the F_p-rational subgraph would serve GOAL-SSI-001,
      whose lane this proposal does not enter; it is recorded as forward
      guidance for that goal's coordinator, not claimed here.
    - >-
      RELAYED VIA scratchpad/scout/ANGLE-BRIEF.md, NOT READ: ePrint 2026/1305
      (SQIsign is not SUF-CMA; concrete malleability in the v2.0 spec) and
      ePrint 2025/830 (SPA on Cornacchia's algorithm). Neither bears on this
      proposal - the first is a malleability question and the second a side
      channel, both off-limits above - and both are listed only so that a later
      reader does not mistake their absence for ignorance of them.

  lossy_projection_identifiability_audit:
    projection: >-
      Full signing transcript (E_1, chall, sigma), together with the signer's
      internal state (psi, I_tau, all randomness) --> the single real number
      TV_k = (1/2) * ||P^k delta_{E_0} - pi||_1, and across a prime ladder the
      pair (k_mix, slope).
    what_is_discarded: >-
      The response isogeny sigma in its entirety, the challenge, the secret
      ideal I_tau, the identity of the individual commitment psi, and even the
      identity of the endpoint E_1 - only the LAW of the endpoint survives.
    why_genuinely_lossy: >-
      Extremely lossy: the fibre over an observed TV_k is the whole space of
      signing runs with that commitment-degree parameter. Nothing about any
      individual signature is recoverable from the projection. This is a
      deliberate choice, not an oversight: the question being asked is a
      question about a distribution, so the projection to the distribution is
      the correct object.
    why_compatible_with_the_operations: >-
      Exactly compatible, and this is the technical reason the object is worth
      tracking: the commitment walk is a Markov chain on the vertex set, so the
      projection to the law of the endpoint propagates DETERMINISTICALLY under
      the target's own operation - one isogeny step is one application of P.
      No approximation is introduced by the projection itself.
    is_it_only_a_change_of_coordinates: >-
      NO, and the check is explicit. The KN-LIT-7595 failure ((Delta, Pi) =
      (x xor y, x*y) in characteristic 2, where the pair is recoverable as the
      roots of t^2 + Delta t + Pi, so nothing was discarded and nothing gained)
      does not apply: the map from a signing run to TV_k is many-to-one on an
      astronomically large fibre and no inverse exists even in principle.
    which_failure_was_checked_for: >-
      THE MIRROR FAILURE - a projection so lossy that it is CONSTANT across
      instances, with zero comparator spread, which is the failure mode
      IDEA-20260805-e805b6 diagnoses in its own object. CHECKED, AND THE CHECK
      RETURNED NEGATIVE FOR THIS OBJECT: TV_k is provably non-constant in k
      (TV_0 = 1 - pi(E_0) which is within O(1/n) of 1, and TV_k -> 0), it is
      non-constant in n across the ladder (it is the very quantity whose
      n-dependence is the measurement), and the three candidate models assign it
      three DIFFERENT and separated values. A constant statistic could not do
      that. The residual risk is different and is stated as a confounder: TV_k
      may be constant ACROSS ARMS, i.e. the supersingular graph may be
      indistinguishable from the matched random-3-regular null - which would not
      be an artifact but a genuine controlled-null result, and is pre-declared
      as such.

  assumptions:
    - >-
      That the protocol shape recalled above (commitment curve published,
      simulator running backwards) matches the Round-3 specification. IF IT DOES
      NOT - for instance if the commitment is generated by sampling a random
      ideal of large norm and converting it, giving a uniform E_1 BY
      CONSTRUCTION rather than by mixing - then the mixing premise is not
      load-bearing for SQIsign and the SQIsign-facing half of this proposal is
      void. The graph measurement remains valid and remains a deliverable, and
      the redirection is recorded. This is the single most likely failure of the
      proposal as written and Stage 0 exists to detect it before any compute.
    - >-
      That l = 2 is a legitimate proxy graph. SQIsign's commitment degree is
      (RECALLED, UNVERIFIED) a smooth number with several prime factors, so the
      relevant walk lives in a union of l-graphs, not in G_2. The l = 2 result
      is therefore a measurement of one factor's graph and is labelled as such;
      the union-graph question is named in forward guidance and is NOT claimed.
    - >-
      That the toy primes reach the asymptotic regime the scaling law describes.
      log2(n) from 6.41 to 13.42 is a 7-bit span; a slope fitted over 7 bits and
      extrapolated to 252 bits is an extrapolation of 36x. HEUR-CWM-2 states
      this formally and the deliverable reports the fit residual and the
      extrapolation factor beside every extrapolated number.

  predictions:
    - metric: >-
        mu_emp(p): second-largest absolute eigenvalue of the reversible
        transition operator of G_2(p), measured at every ladder prime
      direction: lower
      minimum_effect: >-
        FORCED VALUE, DERIVED BEFORE ANY RUN: mu_emp <= 2*sqrt(2)/3 =
        0.94280904 at EVERY ladder prime, by Pizer's bound. This prediction is
        an INSTRUMENT CHECK, not a finding: a measured mu_emp > 0.9428090 at any
        prime means the graph construction is wrong (most likely the
        j = 0 / j = 1728 weighting), the run is invalid, and NO measurement may
        be reported from it.
    - metric: >-
        slope_NBRW = fitted dk_mix/dlog2(n) for the NON-BACKTRACKING walk on
        G_2(p) started at j = 1728, target TV <= 1/4, over the eight-prime
        ladder
      direction: different
      minimum_effect: >-
        THREE PRE-REGISTERED CANDIDATE VALUES, FIXED BEFORE ANY RUN: 1.0
        (non-backtracking cutoff), 3.0 (simple-walk cutoff), 5.885 (spectral
        bound, = 0.5/0.0849625). The decision rule, also fixed now: the measured
        slope is assigned to whichever candidate it is nearest, and only if it
        is within 0.35 of it in absolute value; otherwise NO candidate is
        selected and "the measured scaling matches none of the three models" is
        the reported result. The gaps between candidates are 2.0 and 2.885, so a
        0.35 window cannot select two.
    - metric: >-
        slope_SRW = the same fitted slope for the SIMPLE random walk, same
        graph, same starting vertex
      direction: different
      minimum_effect: >-
        Pre-registered at 3.0 under the same +/-0.35 rule. The SRW/NBRW PAIR is
        the strongest single check in the design: the two walks live on the same
        graph and differ only in the backtracking step, so a measured
        slope_SRW/slope_NBRW ratio near 3 corroborates both recalled cutoff
        results at once, while a ratio near 1 falsifies at least one of them.
    - metric: >-
        k_mix ratio between the positive-control dumbbell graph and G_2(p) at
        matched n and matched degree, target TV <= 1/4
      direction: higher
      minimum_effect: >-
        >= 10. FORCED REASONING DERIVED BEFORE THE RUN: a 3-regular graph split
        into two halves joined by t = 1 edge has conductance Phi ~ 1/(3n/2) =
        2/(3n), and the relaxation time of a reversible chain is at least
        1/(2*Phi) = 3n/4, so k_mix grows LINEARLY in n while G_2(p)'s grows
        logarithmically. At the top of the ladder (n ~ 10925) the predicted
        ratio is in the hundreds; the threshold is set at 10 to leave a large
        margin. IF THE MEASURED RATIO IS BELOW 10 THE INSTRUMENT IS BROKEN AND
        NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
    - metric: >-
        slope_NULL = fitted dk_mix/dlog2(n) on the matched null (random
        3-regular graph, same n, configuration model, three seeds)
      direction: different
      minimum_effect: >-
        Pre-registered EQUAL to slope_NBRW within 0.35. This null CAN FAIL and
        the design wants to know if it does: if the supersingular graph mixes
        MEASURABLY DIFFERENTLY from a matched random 3-regular graph, that is a
        structural fact about the supersingular graph and a genuine finding. If
        it does not, the honest conclusion is that the commitment's uniformity
        premise is exactly as good as generic expansion and no better - a
        CONTROLLED NULL, which is the deliverable named in
        docs/inventor-protocol.md section 3.
    - metric: >-
        Delta_start = k_mix(started at j = 1728) - k_mix(started at the
        deterministic generic vertex), same graph, same prime, same walk
      direction: different
      minimum_effect: >-
        Pre-registered at 0 +/- 1 step. G_2(p) is NOT vertex-transitive, so a
        nonzero Delta_start is possible and would be the single most directly
        transcript-relevant number in the run: the honest walk starts at
        j = 1728 and the simulator's does not. A Delta_start that GROWS with
        log2(n) would say the special starting vertex costs the honest signer
        extra walk length at every scale, which is the one outcome here that
        bears directly on a parameter choice.
    - metric: >-
        graded_monotonicity: k_mix as a function of the number t of cross edges
        in the dumbbell family, t in {1, 2, 4, 8, 16, 32}
      direction: lower
      minimum_effect: >-
        Strictly monotone non-increasing in t across all six points, with
        k_mix(t = 32)/k_mix(t = 1) <= 1/8. Six points, four of them interior.
        A non-monotone graded curve localises an instrument fault to a specific
        conductance regime instead of leaving "it did not work".
    - metric: >-
        Instrument forced values: |SS(p)| against floor(p/12) + e, the Eichler
        mass sum against (p-1)/24, the detailed-balance residual, and the
        Velu-vs-Phi_2 edge-multiset agreement, at every ladder prime
      direction: different
      minimum_effect: >-
        EXACT. |SS(p)| exactly equal; mass sum exactly (p-1)/24 as an exact
        rational; detailed-balance residual exactly 0 in exact arithmetic; edge
        multisets identical. Any deviation invalidates the package. These are
        not tolerances.

  minimal_test:
    design: >-
      Five stages, ordered cheapest-first, each able to terminate the line.
      STAGE 0 (reading, zero compute, GATE): obtain the SQIsign Round-3
      specification and the primary design papers; quote verbatim how the
      commitment curve is generated and what the ZK argument assumes about its
      distribution; file them as KN-LIT entries with provenance levels. IF THE
      COMMITMENT IS UNIFORM BY CONSTRUCTION RATHER THAN BY MIXING, STOP the
      SQIsign-facing claim, record the redirection, and run Stages 1-4 as a
      standalone graph measurement only. RQ-SQISIGN-001.constraints requires
      this gate.
      STAGE 1 (seconds, DECISIVE FOR THE INSTRUMENT): build G_2(p) at
      p = 1031 by Velu; check |SS| = 87, mass = 42.916666... = (p-1)/24,
      detailed balance exactly 0, Velu edges identical to Phi_2 roots. Any
      failure ends the run as an infrastructure outcome, never a mathematical
      one.
      STAGE 2 (minutes, zero sampling): exact TV curves and mu_emp for G_2(p)
      over the eight-prime ladder, both walks, both starting vertices.
      STAGE 3 (minutes): matched null (random 3-regular, three seeds) and the
      positive-control dumbbell at every ladder n, identical code path.
      STAGE 4 (minutes): the graded dumbbell family, monotonicity reported.
      FIT AND REPORT LAST, AND ON THE NULL FIRST: the slope fit is executed on
      the NULL arm and printed before the treatment arm's TV curves are looked
      at. If the frozen decision rule assigns the same candidate slope to the
      null and the treatment, the rule discriminates nothing and must be
      rewritten before the treatment arm is read.
    controls:
      - >-
        MATCHED NULL, SAME SHAPE, CAN FAIL: a random 3-regular graph on exactly
        the same n vertices (configuration model, seeds 1/2/3), run through the
        identical TV and k_mix code path. FORCED VALUE DERIVED PRE-RUN: slope
        equal to the treatment's within 0.35, and mu_emp near
        2*sqrt(2)/3 + o(1) by Friedman (RECALLED, UNVERIFIED). It can fail in
        either direction and either failure is informative. Matched on size,
        degree, and regularity - not merely "random".
      - >-
        POSITIVE CONTROL, MUST FIRE: the dumbbell - two random 3-regular halves
        on n/2 vertices joined by t = 1 edge - where slow mixing is forced by
        conductance. The instrument MUST report k_mix at least 10x that of
        G_2(p) at the same n. If it does not, the instrument cannot detect slow
        mixing at all, and NO NEGATIVE RESULT FROM ANY ARM MAY BE REPORTED. This
        is the sensitivity demonstration; its comparator and threshold are both
        fixed above before any run.
      - >-
        GRADED CONTROL, SIX POINTS, FOUR INTERIOR, MONOTONICITY REPORTED: the
        dumbbell with t in {1, 2, 4, 8, 16, 32}. Interpolates continuously
        between "obstructed" and "expander" at fixed n and fixed degree, so a
        failure localises to a conductance range rather than leaving a bare
        negative.
      - >-
        STARTING-VERTEX CONTROL (the transcript-relevant pair): j = 1728 versus
        a deterministic generic vertex, same graph, same walk. This is the arm
        that maps onto honest-versus-simulated and it is the only arm whose
        difference could bear on a parameter choice.
      - >-
        WALK-TYPE CONTROL: simple versus non-backtracking on the identical
        graph. Their predicted slope ratio of 3 is an internal consistency check
        on both recalled cutoff results simultaneously.
      - >-
        ARCHIVE CHECK, zero compute: list every prior archived measurement of
        this observable in this corpus. NONE EXISTS - no record computes a
        spectral gap or mixing time for any isogeny graph. That absence is
        recorded here as an absence and is not claimed as a passed check.
    required_metrics:
      - mu_emp and the Ramanujan bound, per prime, per arm
      - exact TV_k curves, k = 0..K, per prime, per arm, per walk type
      - k_mix at TV targets 1/4 and 1/100, per prime, per arm, per walk type
      - fitted slope and residual of k_mix against log2(n), per arm, per walk
      - the four instrument forced values, per prime, as exact integers/rationals
      - Delta_start per prime, and its own fitted trend in log2(n)
      - verbatim quotation of the Round-3 commitment-generation step, or a
        recorded statement that the specification could not be obtained

  falsification_conditions:
    - >-
      mu_emp > 2*sqrt(2)/3 at any ladder prime. The construction is wrong; the
      package is invalid; nothing is reported.
    - >-
      The dumbbell positive control does not fire (ratio < 10). The instrument
      is insensitive to slow mixing and no negative from any arm is admissible.
    - >-
      The measured slope lies within 0.35 of none of {1.0, 3.0, 5.885}. Both
      recalled cutoff results and the spectral bound are then wrong or
      inapplicable for this graph at these sizes, and the reported result is
      that fact plus the measured value - which would be the most interesting
      outcome available and is NOT treated as a failure.
    - >-
      Stage 0 finds the commitment is uniform by construction. The
      SQIsign-facing objection is void and must be withdrawn as a superseding
      record; the graph measurement stands on its own.
    - >-
      Velu and Phi_2 disagree on any edge multiset. Infrastructure finding; Velu
      is authoritative; the recalled Phi_2 is quarantined and no mathematical
      conclusion is drawn from the disagreement.

  confounders:
    - >-
      THE l = 2 PROXY. The commitment walk in a real scheme is not a pure
      2-isogeny walk. A union graph mixes at least as fast as its slowest
      factor, so the l = 2 measurement is informative but not sufficient, and
      every extrapolated statement carries that gap.
    - >-
      THE WEIGHTING AT j = 0 AND j = 1728. If the adjacency matrix is
      symmetrized by mistake, the stationary measure is wrong by O(1) at two
      vertices, which puts an O(1/n) floor under every TV curve and would be
      misread as incomplete mixing. The detailed-balance forced value exists
      solely to catch this and it is an exact check.
    - >-
      FIT RANGE. Cutoff means TV stays near 1 and then plunges; a slope fitted
      through the plunge region is meaningful, one fitted through the plateau is
      not. The TV target for k_mix is fixed at 1/4 (and 1/100 as a secondary)
      BEFORE the run, so the fit window cannot be chosen after seeing the
      curves.
    - >-
      EXTRAPOLATION FACTOR. 7 bits of log2(n) measured, 252 bits claimed about.
      36x. Reported beside every extrapolated number, every time.
    - >-
      DISTINGUISHER-IS-NOT-RECOVERY. Even a decisive finding here concerns the
      commitment marginal, which is secret-independent. It cannot by itself be
      a key-recovery route, and writing it up as one would be the overclaiming
      failure this program's rules exist to prevent.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, and it may not be raised by any citation. Every number is
      measured at p <= 131111 while the scheme's p is ~2^256. AGENTS.md rule 7.
    - >-
      NO SQIsign CONCLUSION IS LICENSED UNTIL STAGE 0 COMPLETES. Stages 1-4
      measure the supersingular 2-isogeny graph and say nothing about any
      signature scheme. RQ-SQISIGN-001.constraints forbids more and this record
      does not ask for more.
    - >-
      A slope measurement is not a proof of a mixing time. The deliverable is an
      empirical scaling law with a stated fit range, not a theorem.
    - >-
      This proposal costs NO hard problem. It does not evaluate, improve, or
      comment on the endomorphism-ring or path-finding baselines of
      KN-TECH-057, which belong to GOAL-SSI-001; it does not touch the
      published-data surface or the Kani template, which belong to
      GOAL-SQISIGN-002; and it does not enter the broken SIDH torsion-image
      setting, which GOAL-SQISIGN-001 places out of scope.
    - >-
      A finding that the commitment marginal is distinguishable would be a
      statement about the ZERO-KNOWLEDGE ARGUMENT, not about unforgeability, and
      the two must not be conflated in any downstream citation.

  heuristic_assumptions:
    - id: HEUR-CWM-1
      statement: >-
        FORALL toy primes p in the declared ladder, the graph produced by the
        implemented Velu construction is the supersingular 2-isogeny graph of p
        with its correct edge multiplicities and its correct automorphism
        weights at j = 0 and j = 1728.
      rigorous_support: >-
        Not a heuristic in the probabilistic sense - it is a correctness claim,
        and it is DISCHARGED BY FOUR EXACT FORCED VALUES rather than assumed:
        the vertex count, the Eichler mass sum, exact detailed balance, and
        independent agreement with the Phi_2 root construction. Two of the four
        were checked by hand while writing this record (p = 1031 and p = 4099,
        both exact).
      validation_plan: >-
        Stage 1, seconds, at p = 1031, before any other computation. A failure
        ends the run as an infrastructure outcome under AGENTS.md rule 5.
    - id: HEUR-CWM-2
      statement: >-
        FORALL sufficiently large n, k_mix(n) = a*log2(n) + b for constants a, b
        not depending on n, AND the constants fitted over log2(n) in
        [6.41, 13.42] are the constants that govern at log2(n) = 252.4.
      rigorous_support: >-
        NONE THAT SURVIVES SCRUTINY, AND THIS IS THE WEAKEST LINK IN THE RECORD.
        The spectral bound is a genuine upper bound at every n, so the 5.885
        candidate is safe as a bound; the two cutoff candidates are asymptotic
        statements whose approach rate at n ~ 10^4 is unknown to this program.
        The measured slope may therefore be a finite-size artifact and the fitted
        b may absorb a term that is not constant.
      validation_plan: >-
        Report the fit residual, report k_mix at BOTH TV targets (1/4 and 1/100)
        so the b-term's stability is visible, and report the slope fitted on the
        top four primes alone beside the slope fitted on all eight. If the two
        differ by more than 0.35, the asymptotic regime has not been reached and
        the extrapolation is withdrawn rather than reported with a caveat.
    - id: HEUR-CWM-3
      statement: >-
        The l = 2 graph's mixing behaviour is representative of the union graph
        over the actual commitment degree's prime factors.
      rigorous_support: >-
        Weak and partial. A union of expanders is at least as good an expander
        as the best factor, so l = 2 gives a CONSERVATIVE reading in one
        direction only. No claim of representativeness in the other direction.
      validation_plan: >-
        Out of scope for this experiment and named as forward guidance: run the
        identical instrument on G_3 and on the union G_2 union G_3 at the same
        ladder. That is a follow-on contract, not a stage of this one.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED. This proposal contains no
      algorithm and no attack. It audits a walk-length constant inside a
      security argument. Stating that plainly is required by
      docs/target-result-profile.md, which biases the program toward exponent
      results and forbids dressing cofactor work as one; this is not even
      cofactor work, it is instrument and argument work, and it is proposed
      anyway because the audited constant gates a claim about a Round-3
      candidate and the audit is cheap.
    memory_exponent: >-
      n/a. Peak memory of the measurement itself is O(n) floats, under 1 GB at
      the top of the ladder.
    best_known: >-
      For the underlying hard problem, KN-TECH-057's matched full-cost
      baselines: MITM p^{2/3}, Delfs-Galbraith p^{1/3}, van Oorschot-Wiener
      p^{1/2} (F_{p^2}) and p^{1/4} (F_p, conditional). This proposal does not
      compete with any of them and does not claim to.
    hidden_overhead: >-
      n/a for the audit. For the extrapolation, the hidden quantity is the
      finite-size correction to the cutoff constant, which HEUR-CWM-2 exposes
      rather than hides.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no attack and no cost claim is made). ROWS CHECKED BEFORE WRITING
    null, as required by docs/inventor-protocol.md section 5: (1) all four
    full-cost rows of KN-TECH-057 - MITM p^{2/3} F_{p^2}, Delfs-Galbraith
    p^{1/3} F_p, van Oorschot-Wiener p^{1/2} F_{p^2}, van Oorschot-Wiener
    p^{1/4} F_p conditional - read in the file, with time and memory both
    considered under the Wiener 3D wiring model; (2) Wesolowski's
    p^{1/3+o(1)} in BOTH time AND memory, as recorded in
    docs/target-result-profile.md and in the ANGLE-BRIEF's P13 section, noting
    it is Pareto-INCOMPARABLE to the p^{1/2}-time/negligible-memory row rather
    than dominating it; (3) the data/query axis, which is empty here because
    this proposal collects no signatures and queries no oracle. WHAT WAS NOT
    CHECKED, STATED SO THE null IS NOT A FABRICATION UNDER RULE 5: the external
    literature on isogeny-graph mixing was not searched, because a mixing-time
    measurement is not a point on the ECDLP/isogeny attack frontier and there is
    no frontier row for it to sit on.
  sota_delta: >-
    No attack; measurement and argument contribution only. Quantitatively, the
    deliverable is a number that does not currently exist anywhere in this
    corpus: the fitted slope a in k_mix = a*log2(n) + b for the supersingular
    2-isogeny graph, with a discriminating between 1.0, 3.0 and 5.885, plus the
    derived consequence that the Ramanujan spectral bound alone requires 3004
    two-isogeny steps for a 2^-128 guarantee at p = 2^256 and is VACUOUS (bound
    2^+104.5 > 1) at 256 steps. Against the state of this program: zero prior
    records of any kind in area SQISIGN, and zero spectral quantities for any
    isogeny graph anywhere in the corpus.

  estimated_cost:
    implementation: >-
      medium-high. The only real cost is writing supersingular graph
      construction from scratch in pure Python: F_{p^2} arithmetic for
      p = 3 mod 4, cubic root-finding over F_{p^2} by
      gcd(Y^{p^2} - Y, f) plus Cantor-Zassenhaus splitting, Velu 2-isogenies,
      and BFS. VERIFIED ON THIS MACHINE 2026-08-05: numpy 2.4.6 present; sympy,
      scipy, Sage and PARI ALL ABSENT. If a solver were required this would be
      an infrastructure request rather than an experiment (AGENTS.md rule 3);
      it is not, because everything needed is integer arithmetic and dense/sparse
      linear algebra numpy already provides.
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the experiment returns a decisive slope assignment against the
    frozen +/-0.35 rule. It is not higher because HEUR-CWM-2 is genuinely weak -
    n ~ 10^4 may sit below the regime where a cutoff constant has settled, and
    the pre-declared response to that is withdrawal of the extrapolation, not a
    caveated number. It is not lower because the measurement is EXACT (no
    sampling error anywhere), because the three candidate slopes are separated
    by 2.0 and 2.885 while the decision window is 0.35, and because four exact
    forced values verify the instrument before any curve is believed.
    SEPARATELY, 0.10 that Stage 0 plus the measurement together produce a
    statement that a SQIsign parameter is not justified by any argument this
    program can reconstruct. That number is low because the designers are expert
    and the likeliest Stage-0 outcome is that the commitment is uniform by
    construction; it is not lower because the spectral bound really is vacuous
    at natural walk lengths, because a load-bearing constant that has never been
    evaluated in this corpus is exactly the class the ANGLE-BRIEF's T-E finds
    most often wrong, and because DEC-20260805-2be965 records a red team finding
    four of five of one goal's named obstructions defective on audit.
