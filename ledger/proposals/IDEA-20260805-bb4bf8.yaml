idea:
  id: IDEA-20260805-bb4bf8
  question_id: RQ-SQISIGN-001
  added: '2026-08-05'
  title: >-
    The commitment-walk mixing audit: SQIsign's transcript-versus-simulation
    claim rests on a walk-length constant nobody in this corpus has ever
    evaluated, and the constant is decided by an EXACT linear-algebra
    computation on toy supersingular graphs that needs no transcript sampling
    at all
  class: control

  claim: >-
    In a Fiat-Shamir isogeny signature of SQIsign's shape the commitment curve
    E_1 is published in the transcript, and the honest signer produces it as the
    endpoint of an isogeny walk that STARTS AT THE SPECIAL CURVE E_0, while the
    zero-knowledge simulator produces the same symbol by walking BACKWARDS from
    the response's codomain, i.e. from a generic vertex. The two distributions
    on E_1 therefore agree only to the extent that the commitment walk MIXES.
    Whether it mixes at the claimed security level is a statement about one
    number - the walk length (equivalently the commitment degree) required to
    bring the total-variation distance from stationary below 2^-lambda - and
    this program has never evaluated that number for any isogeny scheme. It can
    be bounded three ways that DISAGREE BY A FACTOR OF ABOUT SIX, and the
    disagreement is the whole content: (a) the Ramanujan spectral bound gives
    TV_k <= (sqrt(n)/2) * mu^k with mu = 2*sqrt(l)/(l+1), hence for l = 2,
    n ~ p/12, lambda = 128, p = 2^256 a required walk length of
    k* = (0.5*log2(n) + lambda + 1)/0.0849625 = 3004 STEPS - and it makes the
    bound VACUOUS (TV bound 2^+104.5, i.e. greater than 1) at the ~256 steps a
    natural parameter choice would give; (b) the recalled cutoff result for the
    SIMPLE random walk on Ramanujan graphs puts mixing at
    (d/(d-2))*log_{d-1}(n) = 3*log2(n) steps for d = 3; (c) the recalled cutoff
    result for the NON-BACKTRACKING walk - which is the right model, because an
    honest commitment isogeny is CYCLIC by construction - puts it at
    log2(n) steps. Slopes dk_mix/dlog2(n) of 5.885 vs 3.0 vs 1.0. THE CLAIM OF
    THIS PROPOSAL IS NOT THAT SQIsign IS UNDER-PARAMETERIZED. It is that which
    of the three governs is an empirical question with an exact, cheap answer,
    that the answer changes what the ZK argument is entitled to assert, and that
    the measurement requires NO transcript sampling, NO isogeny scheme
    implementation and NO endomorphism-ring computation - only the exact
    iterated transition operator of the supersingular 2-isogeny graph at toy
    primes, which is a sparse matrix of side p/12.

  object_first_candidate:
    tracked_object: >-
      The PROBABILITY VECTOR of the commitment endpoint over the vertex set of
      the supersingular l-isogeny graph, followed step by step through the
      commitment walk: delta_{E_0} -> P delta_{E_0} -> ... -> P^k delta_{E_0},
      projected at each step onto the single scalar
      TV_k = (1/2) * sum_j |P^k delta_{E_0}(j) - pi(j)|, where pi is the
      Eichler-mass stationary measure pi(j) proportional to 2/|Aut(E_j)|. The
      object is the DECAY CURVE k -> TV_k and, across a ladder of primes, the
      scaling law k_mix(n) and its slope in log2(n). The transcript symbol E_1
      is the observable; the tracked object is the measure that produces it.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens for this proposal: (i) endomorphism-ring
      and isogeny-path-finding attacks of every kind - MITM, Delfs-Galbraith,
      van Oorschot-Wiener collision search, Wesolowski's p^{1/3+o(1)} claw
      construction - because that flank belongs to GOAL-SSI-001 and this
      proposal costs no hard problem and claims nothing about one; (ii) the
      SIDH/Kani torsion-image template and any audit of the PUBLISHED-DATA
      SURFACE, because that flank belongs to GOAL-SQISIGN-002 and is explicitly
      out of scope for GOAL-SQISIGN-001; (iii) side channels of every kind -
      timing, SPA on Cornacchia's algorithm, fault injection - because
      RQ-SQISIGN-001 scopes this question to DISTRIBUTIONAL leakage in its own
      words ("not timing: distributional"); (iv) signature malleability and
      strong-unforgeability questions; (v) KLPT norm-equation analysis, which is
      the subject of the sibling proposal IDEA-20260805-2a669e and is
      deliberately NOT the lens here. What is left as the lens is the ordinary
      spectral theory of a graph, which is why the proposal is cheap.
    newness_score: >-
      The mathematics is not new. Pizer's Ramanujan theorem, the Eichler mass
      formula, and cutoff for walks on Ramanujan graphs are established results
      (all RECALLED, UNVERIFIED here - see literature_context). What is new, and
      what the corpus demonstrably lacks, is (1) the numerical evaluation of the
      three competing walk-length constants at a scheme-relevant prime size,
      (2) the observation that the constants differ by ~6x and that the loosest
      one is VACUOUS at natural parameters, and (3) the design move that makes
      the question answerable at all in this environment: computing TV EXACTLY
      by sparse matrix iteration instead of estimating it by sampling
      transcripts. The single prior proposal on this question,
      IDEA-20260801-020, proposes sampling N transcripts and running a
      permutation test - a design whose resolution floor is ~1/sqrt(N) and which
      therefore cannot bound a 2^-128 statistical distance by any margin,
      at any budget. That is not a criticism of it; it is the reason to take a
      different route to the same question.
    testability_score: >-
      Very high and unusually cheap. The decisive quantity is an eigenvalue and
      a TV curve of a sparse (l+1)-regular matrix on n ~ p/12 vertices. At the
      top of the proposed ladder (p ~ 131111) that is n ~ 10925 vertices and
      ~33000 nonzeros; a few hundred matrix-vector products per prime. Pure
      Python plus numpy 2.4.6, which this container has (VERIFIED by running
      `python3 -c "import numpy"` on this machine, 2026-08-05). No sympy, no
      Sage, no PARI, no scipy - all VERIFIED ABSENT the same way - so the graph
      construction must be written from scratch, and that is the only real cost.
    survival_score: >-
      The object survives the entire commitment stage by construction, because
      it IS the commitment stage's distribution. It does NOT survive into the
      response stage: the response isogeny's distribution is a different object
      governed by the ideal-to-isogeny conversion, and this proposal makes no
      statement about it. That boundary is stated so it cannot be quietly
      crossed later.

  mechanism: >-
    DERIVED HERE. Every recalled external theorem is labelled and is a candidate
    to check, never an authority; several of them are checked BY THE RUN, which
    is the design's main defence against the recall.

    THE PROTOCOL SHAPE (RECALLED, UNVERIFIED - THE ROUND-3 SPECIFICATION HAS NOT
    BEEN READ BY THIS PROGRAM, AND RQ-SQISIGN-001.constraints FORBIDS TREATING
    ANY OF IT AS ESTABLISHED). A SQIsign-shaped signature is a Fiat-Shamir
    transform of a sigma protocol over the Deuring correspondence. Secret key: an
    isogeny tau : E_0 -> E_A, equivalently a connecting left O_0-ideal I_tau.
    Public key: E_A. Signing: (1) sample a commitment isogeny psi : E_0 -> E_1 of
    degree D_psi and publish E_1; (2) derive a challenge isogeny phi : E_1 -> E_2
    of degree D_phi by hashing (E_1, message); (3) produce a response isogeny
    sigma : E_A -> E_2 of fixed degree D_sigma with phi-hat . sigma cyclic.
    Transcript: (E_1, chall, sigma). VERIFYING THIS PARAGRAPH AGAINST THE ACTUAL
    ROUND-3 SPECIFICATION IS STAGE 0 OF THE EXPERIMENT AND IS A GATE, NOT A
    FORMALITY.

    WHERE THE SIMULATOR SITS, AND WHY THE COMMITMENT IS THE LOAD-BEARING PIECE.
    The standard simulator for this shape runs the transcript BACKWARDS: sample
    the response sigma : E_A -> E_2 first (a walk of degree D_sigma from the
    PUBLIC key E_A, needing no secret), then sample the challenge isogeny
    backwards from E_2 to obtain E_1, then program the random oracle so that
    H(E_1, message) selects that challenge. This simulator is efficient and
    needs nothing secret, so the null control demanded by
    GOAL-SQISIGN-001.next_action is INSTANTIABLE - a fact worth recording,
    because it is not automatic and it is what makes the whole goal runnable.
    Now compare the two laws of the published symbol E_1:
      HONEST:    E_1 = psi(E_0),  a walk of degree D_psi from the SPECIAL vertex
                 E_0 (j = 1728 for p = 3 mod 4; extra automorphisms; lying on
                 the F_p-rational subgraph of size ~ sqrt(p)).
      SIMULATED: E_1 = walk of degree D_phi backwards from E_2, and E_2 is the
                 endpoint of a degree-D_sigma walk from E_A. With D_sigma large
                 this is a generic vertex.
    The two agree to statistical distance eps if and only if the degree-D_psi
    walk from E_0 has mixed to within eps. THE ENTIRE MARGINAL-LEVEL ZK CLAIM
    FOR THE COMMITMENT REDUCES TO A MIXING TIME. Nothing about the secret enters
    this reduction, which is exactly why the audit is cheap - and also exactly
    why a distinguisher found here would NOT by itself be a key-recovery route.
    That asymmetry is stated in interpretation_limits and is not hidden.

    THE THREE COMPETING CONSTANTS, DERIVED.
    Let G_l(p) be the supersingular l-isogeny graph: vertices the supersingular
    j-invariants in F_{p^2}, n = |SS(p)| ~ p/12, degree l+1, and the walk
    reversible with respect to pi(j) proportional to w(j) = 2/|Aut(E_j)|
    (w = 1 generically, 1/2 at j = 1728, 1/3 at j = 0). Write P for the
    transition operator and mu for the second-largest |eigenvalue| of P.
    (a) SPECTRAL BOUND, fully derived, no citation needed for the inequality
        itself: for f_k = P^k delta_v, ||f_k - pi||_2 <= mu^k ||delta_v - pi||_2
        <= mu^k, and TV_k = (1/2)||f_k - pi||_1 <= (1/2) sqrt(n) ||f_k - pi||_2,
        hence
            TV_k <= (sqrt(n)/2) * mu^k.
        Pizer's theorem (RECALLED, UNVERIFIED) gives mu <= 2*sqrt(l)/(l+1); for
        l = 2, mu <= 2*sqrt(2)/3 = 0.9428090..., so
            log2(1/mu) = log2(3) - 1.5 = 0.08496250...
        and TV_k <= 2^-lambda requires
            k* = (0.5*log2(n) + lambda + 1) / 0.08496250.
        FORCED NUMBERS, COMPUTED HERE AND RE-DERIVABLE IN ONE LINE:
        at p = 2^256, n = p/12, log2(n) = 252.415, lambda = 128:
            k* = (126.208 + 129)/0.0849625 = 3003.77, i.e. 3004 steps.
        At k = 256 the same bound gives TV <= 2^(126.208 - 21.750) = 2^104.46,
        which is greater than 1 and therefore SAYS NOTHING. The slope is
        dk*/dlog2(n) = 0.5/0.0849625 = 5.8849.
    (b) SIMPLE-RANDOM-WALK CUTOFF (RECALLED, UNVERIFIED): cutoff for the simple
        random walk on Ramanujan graphs at (d/(d-2))*log_{d-1}(n); for d = 3
        that is 3*log2(n). Slope 3.0.
    (c) NON-BACKTRACKING CUTOFF (RECALLED, UNVERIFIED): cutoff for the
        non-backtracking walk at log_{d-1}(n) = log2(n) for d = 3. Slope 1.0.
        THIS IS THE RIGHT MODEL FOR THE HONEST COMMITMENT, because a cyclic
        isogeny of degree l^k is exactly a non-backtracking length-k walk.
    The three slopes 5.885 / 3.0 / 1.0 are separated by factors of ~2 and ~6.
    Over a ladder of eight toy primes spanning log2(n) from 6.41 to 13.42 they
    predict k_mix ranges differing by 41 vs 21 vs 7 steps. THAT SEPARATION IS
    THE MEASUREMENT.

    WHY THIS IS MEASURABLE EXACTLY, WHICH IS THE DESIGN'S ONE REAL IDEA. TV_k is
    a deterministic functional of the transition matrix. It is computed by k
    sparse matrix-vector products and one L1 norm. THERE IS NO SAMPLING, SO
    THERE IS NO SAMPLING ERROR AND NO POWER PROBLEM. This is the reason to
    prefer this route over transcript sampling: a permutation test on N sampled
    transcripts resolves statistical distances of order 1/sqrt(N) and can never
    reach 2^-128, whereas an exact spectral computation extrapolates through a
    SCALING LAW whose parameters are measured, not estimated. The extrapolation
    is still a heuristic and is numbered as HEUR-CWM-2; it is not presented as a
    proof.

    FORCED VALUES THAT VERIFY THE INSTRUMENT BEFORE IT IS BELIEVED. Three
    quantities are fixed by counting alone and must come out exactly right, or
    the graph construction is wrong and no measurement may be reported:
      (i)  |SS(p)| = floor(p/12) + e, e = 0,1,1,2 for p = 1,5,7,11 mod 12.
      (ii) EICHLER MASS FORMULA: sum over supersingular E of 1/|Aut(E)| equals
           (p-1)/24. CHECKED NUMERICALLY IN THIS RECORD at two ladder primes:
           p = 1031 (= 11 mod 12): |SS| = 85 + 2 = 87, one j = 0 (|Aut| = 6),
           one j = 1728 (|Aut| = 4), 85 generic (|Aut| = 2), mass
           = 85/2 + 1/6 + 1/4 = 42.916666..., and (1031-1)/24 = 42.916666...
           EXACT AGREEMENT. p = 4099 (= 7 mod 12): |SS| = 341 + 1 = 342, no
           j = 0, one j = 1728, mass = 341/2 + 1/4 = 170.75, and
           (4099-1)/24 = 170.75. EXACT AGREEMENT. These two checks were computed
           on this machine while writing this record and are stated as
           consistency checks of the recalled formulas, not as a proof of them.
      (iii) DETAILED BALANCE: w(j) A(j,j') = w(j') A(j',j) with w = 2/|Aut|.
           The isogeny graph's adjacency matrix is NOT symmetric at j = 0 and
           j = 1728; a construction that silently symmetrizes it has the wrong
           stationary measure and will report a spurious O(1/n) TV floor.
    A fourth check removes the reliance on recalled data entirely: build the
    edge set TWICE, once by Velu 2-isogenies from curve models and once as the
    roots of the classical modular polynomial Phi_2(j, Y), and require the two
    edge multisets to be IDENTICAL. Phi_2's coefficients are RECALLED,
    UNVERIFIED; the Velu construction is derived from scratch; if they disagree,
    Velu is authoritative and the disagreement is an infrastructure finding, not
    a mathematical one.

    WHAT A RESULT WOULD AND WOULD NOT MEAN. If the measured slope is ~1.0 for
    the non-backtracking walk, the natural parameter choice is supported by the
    empirical scaling law and the deliverable is the second horn of
    GOAL-SQISIGN-001's completion criterion - a measured bound with its
    extrapolation honestly labelled heuristic. If the measured slope is ~5.9,
    the spectral bound is TIGHT for this graph, the cutoff results do not apply
    to it, and a commitment walk sized by log2(n) is not justified by any
    argument this program can find - a statement about the ARGUMENT, at toy
    scale, and not a break. If it is ~3.0 the simple walk governs and the
    cyclic/non-backtracking structure is doing no work, which is itself
    informative about the design. All three outcomes are deliverables.

