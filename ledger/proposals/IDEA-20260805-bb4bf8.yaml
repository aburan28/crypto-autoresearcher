      - knowledge/techniques/KN-TECH-057.md
    grep_results:
      - >-
        Exactly one prior proposal exists on RQ-SQISIGN-001
        (IDEA-20260801-020, transcript-vs-baseline permutation test). No prior
        proposal, hypothesis, experiment or evidence record in area SQISIGN
        exists at all - the goal is draft with zero prior art, per its context
        brief.
      - >-
        No record in this corpus computes a mixing time, a spectral gap, or a
        total-variation decay curve for any supersingular isogeny graph. The
        one isogeny-graph cost record read here, KN-TECH-057, is a FULL-COST
        (Wiener AT^2) accounting of path-finding step counts and contains no
