idea:
  id: IDEA-20260813-ea5ed4
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Multi-key ensemble and preprocessing audit: test whether MQOM public maps
    share a reusable invariant or restricted generator support that changes
    amortized random-MQ cost
  class: composition
  claim: >-
    If the filed TCitH/MQOM key generator draws public quadratic maps from a
    structured or seed-expanded ensemble rather than the full matched random-MQ
    space, security accounting must distinguish per-key work from reusable
    ensemble preprocessing.  A preregistered family of public, coordinate-
    invariant fingerprints can test whether independent keys share radical,
    commutant, coefficient-tensor or restriction signatures more often than a
    generator- and seed-length-matched null.  A planted shared invariant
    calibrates detection and an end-to-end cost model charges preprocessing P,
    memory M, target count K and residual per-key cost C as P/K+C.  No shared
    structure, amortization or attack is observed or claimed here.
  mechanism: >-
    Construct fingerprints that survive public invertible changes of variables
    and equations: polar-pencil rank moments, generated-algebra/commutant
    dimensions, canonical radical-intersection signatures and hashes of proved
    restriction types.  Across K public maps, compare collision and clustering
    rates with a null produced through the identical public seed-expansion and
    rejection pipeline but with the hypothesized shared structure removed where
    the primary specification permits such a control.  If a fingerprint
    identifies an ensemble class, attempt only a symbolic preprocessing
    interface: a reusable basis, table or decomposition plus a per-key adapter.
    Any claimed gain must include construction, storage, lookup, false matches,
    target acquisition and verification; fingerprint collision alone is not useful.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-be7738 is nearest because it insists on memory-charged binding-
    row recosting.  This proposal asks a different amortization question across
    many independently generated public maps and requires a reusable artifact
    with a per-key adapter.  IDEA-20260813-c9bec2 is single-key structural
    diagnosis; this proposal treats cross-key ensemble support and preprocessing.
    The eight prior records otherwise cover proof tightness, matched per-key MQ,
    GGM dependencies, Weil descent, optimal forgery and challenge combinatorics.
  predictions:
    - observable: exact-null cross-key fingerprint collisions
      metric: collision_rate_by_key_count
      predicted: calibrated from the generator- and seed-matched null with simultaneous intervals
    - observable: planted shared-invariant ensemble
      metric: cluster_recovery_and_false_assignment
      predicted: monotone cluster recovery over a frozen shared-block dimension ladder
    - observable: public-coordinate conjugacy
      metric: fingerprint_stability
      predicted: exact invariance for every declared fingerprint
    - observable: reusable artifact
      metric: amortized_cost_P_over_K_plus_C
      predicted: >-
        No speedup is recorded unless P, M, C, K and verification are measured
        or rigorously bounded against per-key matched random-MQ cost.
  minimal_test:
    design: >-
      File the primary public-map generator, seed length, expansion, rejection
      and key distribution.  At toy dimensions enumerate or sample independent
      keys and a generator-matched null.  Freeze fingerprints and clustering
      rules using null/planted data only.  Run an exact independent-map null,
      then a planted ensemble sharing a public-conjugated invariant, then the
      filed generator.  If clustering appears, require a concrete reusable
      preprocessing artifact and per-key adapter on held-out keys.  No solving-
      degree run is allowed without a fresh DREG backend check.
    test_boundary:
      instances: independently generated public maps from filed generator and matched null
      parameters: frozen toy dimensions, key count ladder, exact seed/expansion semantics
      oracle_model: public key generation only; no signing or deployed target
      preprocessing: fingerprint design, canonicalization, training and reusable artifact fully charged
      backend_gate: any solver-based adapter requires a fresh calibrated backend; EV-DREG-004 transfers no number
      stopping_rule: stop if conjugacy invariance, null calibration or planted cluster recovery fails
    required_metrics:
      - seed/generator support and rejection accounting
      - fingerprint values, collision rates and simultaneous intervals
      - planted cluster recall, precision and held-out assignment
      - preprocessing time P, memory M, per-key cost C and target count K
      - false-match verification and total end-to-end amortized cost
  controls:
    - name: independent generator-matched map ensemble
      kind: exact_null
      construction: >-
        Independent maps using identical field, dimensions, seed length,
        expansion, coefficient encoding and rejection, with no planted shared invariant.
      forced_value: exact toy or calibrated collision distribution for every frozen fingerprint
      gate: a null mismatch invalidates cross-key clustering
    - name: public-conjugated shared block ensemble
      kind: biased_positive
      construction: >-
        Plant a k-dimensional common invariant in every map, independently
        conjugate each key by public invertible domain/codomain maps and vary k on a frozen ladder.
      forced_value: invariant fingerprints cluster despite coordinate changes and expose exact k
      gate: smallest planted k must be recovered on held-out keys before a real null is interpretable
    - name: nonreusable look-alike control
      kind: nearby_object_control
      construction: >-
        Force the same scalar rank histogram across keys but independently
        rotate incompatible invariant spaces so no common adapter exists.
      forced_value: histogram collision without a reusable basis or per-key cost reduction
      gate: method must not call fingerprint collision an amortized attack
  confounders:
    - Seed expansion alone does not imply exploitable low entropy if modelled as a random oracle.
    - Public keys may be few or one per target, making P/K larger than any per-key gain.
    - Coordinate-dependent fingerprints create artificial diversity or clustering.
    - Training and failed cluster assignments are preprocessing costs, not free reconnaissance.
    - A reusable invariant may not yield a reusable solver artifact.
    - Primary generator details are unverified.
  falsification_conditions:
    - Fingerprints change under declared public coordinate conjugacy.
    - Planted shared blocks are not recovered on held-out keys.
    - A detected actual cluster falls within generator-matched null collision intervals.
    - No reusable artifact reduces held-out per-key operations after P, M and verification are charged.
    - Required K exceeds the accessible public-target model; amortized interpretation is then void.
  interpretation_limits:
    - No generator restriction or multi-key weakness is observed.
    - A fingerprint collision is not an MQ solve, forgery or secret-key relation.
    - Toy clustering does not establish exact-parameter ensemble entropy.
    - Single-target security is not reduced by a multi-target amortized result unless the target model supplies K.
  assumptions:
    - Independent public maps can be generated exactly from filed public rules.
    - Fingerprints are public, certificate-backed and invariant under allowed coordinate representations.
    - A realistic target-count distribution can be stated before amortized security is interpreted.
  heuristic_assumptions:
    - id: HEUR-EA5ED4-1
      formal_statement: >-
        Any reusable algebraic preprocessing advantage of at least four bits
        induces a detectable collision or clustering signal in the frozen
        fingerprint family on at most 2^10 toy keys.
      rigorous_support: no general theorem connects preprocessing to these fingerprints
      validation_plan: construct held-out planted reusable artifacts of several types and measure fingerprint detection versus actual amortized gain
      falsification_condition: a planted reusable four-bit gain is invisible at the declared key budget
    - id: HEUR-EA5ED4-2
      formal_statement: >-
        Fingerprint collision probability under the generator-matched null is
        stable across the last two toy dimensions after normalization.
      rigorous_support: random-matrix limits may support stability, but finite-field atoms and seed expansion can dominate
      validation_plan: compute collision laws at three increasing dimensions and compare total variation of normalized histograms
      falsification_condition: last-two-dimension collision laws differ by more than 0.05 total variation
  proof_search_map:
    bottleneck: whether random-MQ per-key hardness accounting omits reusable structure shared by the actual public-map ensemble
    baseline_embedding:
      parameter_slice: independent generator- and seed-matched public maps with no planted shared invariant
      reproduction_check: exact toy fingerprint collision law and conjugacy invariance fixtures
    observation_collision:
      observable: scalar fingerprint/rank histogram
      distinct_preimage_search: >-
        Construct reusable shared-block and nonreusable independently rotated
        ensembles with the same scalar histogram; require a reusable adapter certificate.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: certificate-backed cross-key invariant-space alignment
        predicted_gain: distinguishes reusable from look-alike fingerprint collisions
      - transform: representation_reduction
        proposed_object: preprocessing artifact plus held-out per-key adapter
        predicted_gain: converts ensemble structure into an end-to-end amortized cost test
    quantifier_order: >-
      There exists one preprocessing artifact built before held-out keys; for
      every held-out key assigned to the class, the adapter and verification
      costs are charged.  A separate artifact chosen after each key is not reusable.
    method_ceiling:
      strongest_certifiable_claim: scoped cross-key structural clustering and measured amortized cost on held-out toy keys
      nearby_object_control: equal histogram with incompatible independently rotated spaces and no common adapter
    proof_obligations:
      - claim: null matches public generator and seed semantics
        responsibility: baseline
      - claim: fingerprints are coordinate invariant and certificate backed
        responsibility: correctness
      - claim: one artifact applies to held-out keys without retraining
        responsibility: interface
      - claim: P, M, K, C, failures and verification are charged
        responsibility: runtime
      - claim: target-count and parameter boundary are explicit
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent.  Required accounting is total work P+K*C versus K
      independent matched-baseline solves; report amortized P/K+C only for a
      declared K and held-out success rate.
    memory_exponent: reusable artifact M plus per-key adapter state, both charged
    best_known_baseline: IDEA-20260805-be7738 memory-charged per-instance recosting and IDEA-20260805-7d97be matched random MQ
    hidden_overhead_disclosure: key generation, canonicalization, clustering, training, false assignments, artifact storage and verification
    time_memory_tradeoff: larger tables may reduce per-key C while increasing P and M; full frontier required
    data_queries: K public maps/keys; target acquisition is explicit
    preprocessing: P is the central nonfree quantity
    oracle_model: public keys only
    retry_success_accounting: expected total includes failed class assignments and inverse held-out success probability
  sota_delta: >-
    Quantitative target is amortized log2 cost difference between P/K+C and the
    per-key matched baseline at the same K and memory.  Until a reusable held-
    out artifact exists, delta is zero.
  dominated_by: >-
    n/a (no attack result claimed).  All eight MQOM prior rows checked across
    time, memory, data, preprocessing and oracle access.  be7738 is nearest and
    may dominate single-key recosting; c9bec2 may dominate single-key structure.
    Neither dominates cross-key reusable-artifact testing.  External status unverified.
  estimated_cost:
    implementation: high
    compute: medium
    data: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that planted and null ensemble controls calibrate; 0.25 that filed
    public maps expose a stable cross-key invariant beyond the matched generator;
    below 0.15 that any signal yields a competitive amortized solver after P and M.
  novelty_status: unverified
  novelty_screen: >-
    Internal screening found memory recosting and matched per-key random-MQ
    controls but no held-out multi-key reusable-artifact audit.  The index is
    stale and no primary literature was checked; absence is not novelty evidence.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260805-be7738 charges memory in a binding-row
    recost.  This proposal requires one preprocessing artifact to transfer to
    held-out independent public maps and reports P/K+C across an explicit
    target-count frontier.
