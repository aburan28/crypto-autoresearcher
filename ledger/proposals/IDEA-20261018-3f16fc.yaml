idea:
  id: IDEA-20261018-3f16fc
  question_id: RQ-DREG-d7b6d6
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Ceiling attainment and the charged favourable-member search: if a random classmate already sits at the pencil
    ceiling, the walk buys only yield overdispersion unless a family of density about 2^{-N/2} exists
  class: composition
  claim: >-
    Hand-derived, nothing executed. Since r_d(b) <= rho_hat_d for every b (IDEA-20261018-70caad ceiling), IF a
    constant fraction phi_d of curves attains it, a favourable classmate can at most tie a typical one on rank and rare
    rank-side families are rank-deficient. Charged accounting: T(b*) = W + T_IC(b*), W = (t_mix + 1/delta) c_step. A
    gap moves the ECDLP exponent only if delta >= c_step 2^{-N/2} AND the gap is a constant fraction of the degree or
    the yield gain is 2^{Omega(N)}. Claim to test at N = 9, 11, 13: phi_d is at least 0.15; classes with m orbits lack
    an attaining member with probability near (1-phi)^m; the ell = 3 walk mixes at the Ramanujan rate.
  mechanism: >-
    PAIR. R3 (as IDEA-20261018-70caad); Sigma = ell-isogeny steps b -> b' with the rank profile recomputed at each
    vertex. Trichotomy: coordinate-dependent (the deficit is recomputed, not propagated), so no (L,b) meter; the one
    priced number is the walk, W = c_step/delta. Lossy-projection test: the object (deficit, s) per vertex drops the
    kernel; Sigma does not preserve it, which is what is measured. Factor base: polynomial window, KN-OPEN-020 not
    entered. Stage: relation decomposition. Exponent bookkeeping and the proof sketch are in the notes file.
  novelty_status: unverified
  citations:
    - {ref: IDEA-20260904-cb1199, provenance: internal, claim: "Galbraith volcano climbing as walk cost source, abstract level", verified_by: idea-generator}
    - {ref: IDEA-20260901-48b364, provenance: internal, claim: "walk density bookkeeping for volcano depth", verified_by: idea-generator}
    - {ref: DEC-20260716-003, provenance: internal, claim: "m=3 prime-field neighbour screen closed", verified_by: idea-generator}
    - {ref: "Jao-Miller-Venkatesan", provenance: recalled, claim: "isogeny walks mix in O(log h) steps under GRH", verified_by: null}
  assumptions:
    - No shell this session. Costs are formulas; c_step over c_op is to be measured.
  proof_search_map:
    bottleneck: density delta of a favourable family and the size of the gap on it
    method_ceiling: toy sizes make the walk-cost condition vacuous; the test settles existence, not payoff
  predictions:
    - metric: "phi_d, fraction of curves with r_d at the F_2-point maximum, d <= 4"
      direction: higher
      minimum_effect: "at least 0.15 at N = 9 and 11; below 0.05 reopens a rare favourable family"
    - metric: "classes with no attaining member against binomial (1-phi)^m"
      direction: different
      minimum_effect: "within 2 s.d. of the binomial count"
    - metric: "second singular value of the ell = 3 class graph over the Ramanujan value"
      direction: lower
      minimum_effect: "at most 1.2 at N = 11 and 13, so t_mix is O(log h)"
  minimal_test:
    design: >-
      Stage 0 zero compute: break-even table delta*(N, c_step / c_op). Stage 1: phi_d and class attainment counts
      from the IDEA-20261018-70caad ranks. Stage 2: ell = 3, 5 graphs on each class from Phi_ell roots at N = 9, 11,
      13; spectra and simulated hitting times of the top-decile-deficit set. Stage 3: field multiplications of one
      step against one point addition.
    controls: [random b-sets of equal size, shuffled deficit labels, ell = 5 graph, random pencil null]
    required_metrics: [phi_d, attainment counts, singular values, hitting times, c_step over c_op, delta*]
  falsification_conditions:
    - phi_d below 0.05 at N=9 or 11. Attainers are rare and the favourable-family question is live.
    - Second singular value above 1.5 times Ramanujan, or hitting time above 3/delta. The 1/delta model fails.
  confounders:
    - Fixed (V,r) mixes position and curve (IDEA-20261018-43e260); average over 8 targets.
    - In characteristic 2 the 2-isogeny graph is sigma-cycles, so only ell >= 3 mixes.
  interpretation_limits:
    - No ECDLP exponent; the economic condition is vacuous at these N and is stated so.
    - Tate invariants (order, trace) are checked, never varied. Galbraith ePrint 2024/924 recalled, not read.
  heuristic_assumptions:
    - id: H1
      statement: >-
        phi_d is at least the random-matrix full-rank constant alpha = prod(1-2^{-i}), about 0.2888, per independent
        rank condition.
      rigorous_support: Limiting full-rank probability of uniform random F_2 matrices (Kolchin; Brent-McKay, recalled).
      validation_plan: phi_d from the IDEA-20261018-70caad table at N = 9, 11 (all curves) and 13 (256 sampled).
    - id: H2
      statement: >-
        A walk on the ell-isogeny graph of a class has second singular value at most 1.2 times the Ramanujan bound, so
        a density-delta family is hit in about 1/delta steps after O(log h) mixing.
      rigorous_support: Jao-Miller-Venkatesan rapid mixing under GRH (recalled); Ramanujan bound 2 sqrt(ell)/(ell+1).
      validation_plan: Spectra of ell = 3, 5 graphs on all classes at N = 9, 11, 13 and simulated hitting times.
  target_complexity:
    time_exponent: measurement only; the modelled attack is W + T_IC with W = c_step/delta, no exponent claimed
    memory_exponent: class graph of about 2^{N/2} vertices
    best_known: Pollard rho about 2^{N/2}; binary index calculus slower (KR-IC-1fcdbc)
    hidden_overhead: c_step/c_op = O(10-30), to be measured, and 1/delta
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: low
