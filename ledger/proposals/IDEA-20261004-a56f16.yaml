# IDEA-20261004-a56f16
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-a56f16
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-14 window table stores 8192 entries and a width-13 table stores 4096
  class: representation
  claim: >-
    A window of width 14 stores 8192 precomputed entries. A window of
    width 13 stores 4096. Eight thousand one hundred ninety-two exceeds
    four thousand ninety-six by 4096. The product of the two table sizes
    is 33554432. Their sum is 12288. The gap is a table size, not an
    ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    13 is 8192. Two to the power 12 is 4096. Two width-13 tables both
    store 4096, so that gap is 0 and their product is 16777216. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 4096.
    baseline_embedding:
      parameter_slice: The widths 14 and 13 and the sizes 8192 and 4096.
      reproduction_check: >-
        Two readers must agree that 2 to the power 13 is 8192 and that
        2 to the power 12 is 4096.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 4096 drops the gap. Two width-13
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-13 table.
        predicted_gain: Four thousand ninety-six fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 8192 and 4096. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-13 tables. Both store 4096, and the gap is 0.
    proof_obligations:
      - claim: The width-14 table stores 8192 entries.
        responsibility: size
      - claim: The width-13 table stores 4096 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Eight thousand one hundred ninety-two exceeds four thousand ninety-six by 4096.
  minimal_test:
    design: >-
      Compute 2 to the power 13 and 2 to the power 12. Do not add a
      curve point.
    controls:
      - Two width-13 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-14 table size is not 8192.
    - The product of the two sizes is not 33554432.
  confounders:
    - A width-13 table of size 4096 is a different window from a width-12 table of size 2048.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 4096 and 2048.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-14 table has size 2 to the power 13, and the
        frozen width-13 table has size 2 to the power 12.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Eight thousand one hundred ninety-two stored entries versus four thousand ninety-six, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
      - KR-RHO-cb1c58
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 8192 and 4096 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 8192 versus 4096
    data_queries: Two frozen widths.
