idea:
  id: IDEA-20261006-535566
  question_id: RQ-EWALK-8fa147
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Rational automorphism counts of (0, 1) and (1, 1) over F_19
  class: measurement
  claim: >-
    Over F_19, a scalar u in F_19^* defines a curve automorphism
    (x, y) -> (u^2 x, u^3 y) of y^2 = x^3 + B exactly when u^6 = 1,
    and of y^2 = x^3 + A x + B with A and B both nonzero exactly when
    u^2 = 1. The curve y^2 = x^3 + 1 has 6 such scalars, namely
    1, 7, 8, 11, 12, 18. The curve y^2 = x^3 + x + 1 has 2 such
    scalars, namely 1 and 18. The absolute gap of the two counts is
    4. A recount that returns any other pair of counts is a negative.
    Counting either curve twice has gap 0. This is not the F_13
    orbit-size comparison of the points (2, 3) and (0, 1), and it is
    not a Pollard rho step count.
  mechanism: >-
    OBJECT FRAME. Representation R2: the curve equation, together with
    the scalar u. Operation set Sigma: the maps (x, y) -> (u^2 x, u^3 y)
    that preserve the equation and fix the point at infinity. Sigma is
    not translation. Trichotomy: partial-action on the set of scalars,
    branching on whether u preserves both coefficients. The projection
    keeps the count of such u and discards which scalars. Lossy: the
    count 6 does not name the list, so the claim also freezes the list
    as a required metric. The open number is the absolute gap 4. No
    walk is run.
  novelty_status: unverified
  citations:
    - ref: RQ-EWALK-8fa147
      provenance: internal
      claim: >-
        The question asks whether an endomorphism or automorphism
        speedup for random walks exceeds sqrt(|Aut|). This record
        counts two rational automorphism sets and claims no speedup.
      verified_by: design session 2026-10-06, question file opened
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces expected rho
        iterations by sqrt(m). The row names sqrt(6) for j = 0 and
        sqrt(4) for j = 1728. This record counts scalars at p=19 and
        does not count iterations.
      verified_by: design session 2026-10-06, row file opened
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The rho baseline discount is about sqrt(|Aut|), with sqrt(2)
        for negation. This count does not beat that baseline.
      verified_by: design session 2026-10-06, KN-TECH-018.md opened
    - ref: KN-FIND-b7e091
      provenance: internal
      claim: >-
        Incidence and endomorphism-image oracles are closed at generic
        exponent 1/2. A scalar count is not one of those oracles.
      verified_by: design session 2026-10-06, finding file opened
  assumptions:
    - The only automorphisms sought are those of the shape (x, y) -> (u^2 x, u^3 y) with u in F_19^*. Translations are not counted.
    - For A = 0 and B nonzero the preserving condition is u^6 = 1. For A and B both nonzero it is u^2 = 1. This session solved both equations by testing u from 1 through 18.
    - j of y^2 = x^3 + 1 is 0. j of y^2 = x^3 + x + 1 is 13, which is not 0 and not 1728 mod 19. Those j values are covariates, not the claim.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms:
      - transform: not_applicable
        proposed_object: not_applicable
        predicted_gain: not_applicable
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations:
      - claim: not_applicable
        responsibility: not_applicable
    not_applicable_reason: >-
      Two scalar counts. Not a proof that a walk exceeds sqrt(|Aut|),
      and not a proof of the sqrt(m) theorem.
  predictions:
    - metric: absolute_gap_of_automorphism_counts
      direction: different
      minimum_effect: >-
        Absolute difference 4 between the counts 6 and 2. Any other
        pair of counts is a negative.
  minimal_test:
    design: >-
      For each u from 1 through 18, test u^6 = 1 and u^2 = 1 in F_19.
      Record both counts, both lists, and the absolute gap. Repeat
      the u^6 count. Do not iterate a random walk.
    controls:
      - >-
        The second u^6 count. Disagreement voids the cell.
      - >-
        The identity scalar u = 1 must sit in both lists. Its absence
        voids the cell, because negation-free identity is an
        automorphism of every short-Weierstrass model.
    required_metrics:
      - count and list for y^2 = x^3 + 1
      - count and list for y^2 = x^3 + x + 1
      - absolute gap
      - repeated u^6 count
      - whether u = 1 is in both lists
      - rho steps performed, required to be 0
  falsification_conditions:
    - Both counts finish and the pair is not (6, 2), or either list differs from the named list.
    - The two u^6 counts disagree. That voids the cell and is not an automorphism result.
  confounders:
    - Orbit sizes of the points (2, 3) and (0, 1) on y^2 = x^3 + 1 over F_13 are a different cell.
    - A rho step count, including any measured sqrt(6) timing, is a different observable.
    - IDEA-20261005-8276a8 is a height ratio over Q. This record stays in F_19.
  interpretation_limits:
    - The counts 6 and 2 are the inputs to a sqrt(|Aut|) discount. They are not evidence that a walk beats that discount.
    - KR-RHO-0528e7 already states the sqrt(6) case for j = 0. This cell does not replace that theorem with a step measurement.
    - One prime does not transfer to BN254 or to a Koblitz Frobenius class.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The preserving condition stated in the claim is exact for maps
        of the shape (x, y) -> (u^2 x, u^3 y). The count is the number
        of roots of u^6 - 1 or u^2 - 1 in F_19^*, not a random model.
        No mixing-time statement is used.
      rigorous_support: >-
        Substituting the map into y^2 = x^3 + A x + B and equating
        coefficients gives the power conditions in the claim. The
        count is then exhaustive search of 18 scalars. KR-RHO-0528e7,
        opened, states the sqrt(m) consequence of a group of order m
        and is not used as the count.
      validation_plan:
        sampling: >-
          All 18 nonzero scalars at p=19, twice for the sixth-power
          test.
        comparison: >-
          The two counts against 6 and 2, the two lists against the
          named lists, and the repeated sixth-power count against
          itself.
        tail_check: >-
          u = 1 must appear in both lists. A missing identity voids
          the cell. No larger prime is sampled.
        parameters: >-
          p=19, equations y^2 = x^3 + 1 and y^2 = x^3 + x + 1. No
          walk, and no transfer to j = 1728.
  target_complexity:
    time_exponent: >-
      No improvement. Generic rho remains exponent 1/2. KR-RHO-0528e7
      multiplies the leading constant by 1/sqrt(m) when a group of
      order m is used. This record does not run that walk.
    memory_exponent: >-
      Not claimed. The output is two lists of length at most 6.
    best_known: >-
      Pollard rho at N^{1/2}, automorphism-adjusted by sqrt(m) as
      stated in the opened row KR-RHO-0528e7 and in KN-TECH-018.
    hidden_overhead: >-
      Eighteen power tests, repeated once. No o(1) attack term is
      hidden because no attack is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff and not a van Oorschot-Wiener
      schedule. Rho steps performed: 0.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-898783
      - KR-RHO-755e35
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The row states the sqrt(m) discount, including sqrt(6) for
          j = 0. This record outputs the counts 6 and 2 and the gap 4
          at p=19, together with the scalar lists. Quantitative
          distance: the integer gap 4 against a constant factor on
          iterations. Iterations performed: 0. The row does not list
          the scalars 1, 7, 8, 11, 12, 18.
      - ref: KN-TECH-018
        provenance: internal
        relation: adjacent
        delta: >-
          The note states the same sqrt(|Aut|) discount, with sqrt(2)
          for negation. This record adds the gap 4 and the two lists,
          which that note does not state.
      - ref: KR-RHO-898783
        provenance: internal
        relation: orthogonal
        delta: >-
          Shared kangaroo steps: 0. The row is an interval discrete
          logarithm bound. This record is a scalar count.
  dominated_by: >-
    Checked KR-RHO-0528e7, KR-RHO-898783, KR-RHO-755e35, KR-RHO-53c89f,
    KN-TECH-018, and KN-FIND-b7e091, all opened. Rho at exponent 1/2
    with the sqrt(m) constant dominates any attack reading of these
    counts. KR-RHO-0528e7 dominates any reading of the count 6 as a
    new speedup: the row already states the sqrt(6) discount, and
    this cell performs 0 steps. KR-RHO-898783 does not dominate the
    scalar count, because kangaroo steps performed are 0.
  sota_delta: >-
    Absolute automorphism-count gap 4 at p=19, lists of length 6 and
    2. Distance to KR-RHO-0528e7 is that integer against a sqrt(m)
    iteration discount. Rho steps: 0. Time exponent versus rho: 0.
    No ECDLP cost is claimed.
