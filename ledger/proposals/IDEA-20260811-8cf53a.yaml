idea:
  id: IDEA-20260811-8cf53a
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  title: >-
    PARTIAL INFORMATION ABOUT k THAT LIVES ON THE POINT COSTS MORE THAN IT SAVES,
    BY EXACTLY sqrt(M): a publicly computable torsion or coordinate statistic
    with image size M pins k to a set of size N/M whose members are described in
    x-COORDINATES and not in EXPONENTS, so the only way to walk inside it is to
    reject M-1 of every M steps, giving sqrt(N*M) against rho's sqrt(N) -- the
    lane's whole "does ell-torsion leak k" question is therefore answered by a
    cost identity rather than by a leak measurement, and the identity has a
    planted-signal test with a tunable M
  class: mechanism

  claim: >-
    (A) THE DICHOTOMY. Information about k comes in exactly two shapes.
    EXPONENT-SIDE information is a congruence k = r mod m; it shrinks the search
    interval and rho on the shrunken interval costs sqrt(N/m). That is
    Pohlig-Hellman and it is a change of instance, not of algorithm
    (IDEA-20260807-146aa8, regime (i)). POINT-SIDE information is the value
    pi(Q) of a publicly computable function pi on E(F_p) with image size M; it
    pins k to K = {k : pi([k]P) = pi(Q)}, of expected size N/M, but K has no
    description in exponent space.
    (B) THE COST IDENTITY, DERIVED. To use K one must produce points of K with
    KNOWN exponents. A random exponent lands in K with probability 1/M, so each
    usable sample costs M draws. A birthday collision inside K needs
    Theta(sqrt(N/M)) usable samples. Total cost
    M * sqrt(N/M) = sqrt(N*M) group operations, against 0.886 sqrt(N) for plain
    rho. The break-even is M = 1: EVERY nontrivial point-side statistic makes the
    attack strictly worse, by the factor sqrt(M) it appears to save.
    (C) WHY NO SMARTER USE EXISTS AT THIS LEVEL OF GENERALITY, AND WHERE THE
    ARGUMENT STOPS. A quotient walk exists only if pi's fibres are compatible
    with the group operation; on a group of PRIME order every exactly propagating
    projection is injective or constant (IDEA-20260807-df906f), so no nontrivial
    pi is homomorphic and no quotient walk exists. What (B) does NOT exclude is a
    pi whose fibre K admits an independent, non-generic enumeration -- for
    example a fibre that is a union of few cosets of a subgroup, impossible here
    since N is prime, or a fibre with a low-degree algebraic description in x
    that an index-calculus stage could consume directly (R1). That exception is
    named, not hidden, and it is the only doorway this record leaves open.
    (D) WHAT THE LANE GETS. Every future L7 proposal that says "this torsion
    statistic is point-dependent and publicly computable" must now also say how
    large M is and how the fibre is enumerated, or accept sqrt(N*M). The record
    turns an open-ended search for leaks into a two-column table: M, and the
    fibre's exponent-side description. Absent the second column the leak is
    anti-helpful with a number attached.

  mechanism: >-
    Rho's efficiency comes from a walk whose steps have known exponents. Any
    restriction of the walk to a set defined on the curve side breaks that
    property: the restriction is enforced by rejection sampling, and rejection
    sampling multiplies per-sample cost by exactly the inverse density, while
    the birthday bound improves only by the square root of the same factor. The
    square root is why the trade is always losing. This is the same arithmetic
    that makes distinguished points free (their fibres are used for storage, not
    for search) and that makes the negation quotient a genuine sqrt(2) (its
    fibres ARE group-compatible).

  tracked_object: >-
    The fibre K = pi^{-1}(pi(Q)) as a subset of the exponent space Z/N, carried
    with its two descriptions -- the curve-side one that defines it and the
    exponent-side one that does not exist. The object being tracked is precisely
    the mismatch between the two descriptions.

  resource: >-
    R5 (torsion data at ell != N) and R1 (x-coordinates as field elements). The
    admissibility filter is satisfied because pi is not an endomorphism applied
    to a point of G; it is a field-level function of the point, which is exactly
    the resource class H-ENDO-001 does not cover.

  lossy_projection_test: >-
    PASSES as a projection and FAILS as a propagating one, and that failure is
    the content. pi is genuinely lossy (fibres of size N/M) but what it discards
    is NOT discarded compatibly with the group operation: pi(R + S) is not a
    function of pi(R) and pi(S) for any nontrivial pi on a prime-order group.
    The protocol's second clause therefore fails by theorem, and the record's
    contribution is to price what the failure costs instead of treating it as a
    disqualification. This is the reverse of the usual reading: a projection can
    be genuinely new, genuinely lossy, and still be worth exactly nothing, and
    the sqrt(M) is how much less than nothing.

  t5_reachability: >-
    Not applicable in the curve-selection sense and stated rather than omitted:
    no curve is selected and no walk on the isogeny graph occurs. The record does
    however supply the missing price for T5 option (ii) in general: a local
    goodness test that fires with density 1/M and must be enforced by rejection
    costs the same factor M per accepted sample, which is why "locally testable"
    is only useful when the density is Omega(1/polylog).

  null_object: >-
    M = 1, the constant statistic, which must reproduce plain rho's cost exactly
    -- the instrument's zero. And the mirror null: a statistic with image size M
    that is a CONGRUENCE on the exponent (for example the top bits of k, granted
    artificially), which must produce sqrt(N/M) rather than sqrt(N*M). The two
    nulls bracket the identity from both sides and distinguish "the sieve is
    expensive" from "the implementation is slow".

  why_not_a_renamed_known_approach: >-
    Rejection sampling and its inverse-density cost are elementary, and the
    conclusion "partial information on the wrong side is useless" is folklore.
    Two things are not folklore in this corpus: the exact identity sqrt(N*M) with
    its crossing point at M = 1, and its use as a MANDATORY COLUMN for every
    future proposal in this lane. The lane currently screens candidate leaks one
    at a time (IDEA-20260807-146aa8, -bd5d91, -6eab6a); this record screens the
    whole class of them by cost.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the RQ-TORS lane (IDEA-20260807-df906f,
    -c98c3d, -6eab6a, -053a55, -146aa8, -1d9c5f, -631e80, -bd5d91, -aabd67) and
    against RQ-GGMB (IDEA-20260807-7270d1, -413fcc, -d73e83, -fd2d89, -569c82).
    None states a cost identity for exploiting point-side partial information;
    the closest is 146aa8's three-regime screen, which classifies rather than
    prices. WEB SEARCH UNAVAILABLE this session; external novelty not established
    and the underlying arithmetic is certainly classical.

  discriminated_from: >-
    NOT IDEA-20260807-6eab6a (ell-primary coprimality: homomorphic ell-torsion
    invariants vanish identically), which shows a class of statistics carries
    ZERO bits; this record handles the statistics that carry NONZERO bits and
    shows they are still a loss. NOT IDEA-20260807-bd5d91 (input-provenance gate
    plus k-resample null), an instrument for deciding whether a statistic reads
    (P, Q) at all; this record assumes it does and asks what the bits are worth.
    NOT IDEA-20260807-df906f, whose rigidity theorem is CONSUMED here as the
    reason no quotient walk exists.

  assumptions:
  - >-
    G has prime order N; P generates G; Q = [k]P with k uniform. pi is computable
    in (log p)^{O(1)} operations from the point's coordinates and is evaluated at
    unit cost relative to a group operation, an assumption generous to the
    attacker.
  - >-
    The fibre K has no exponent-side description available to the attacker. This
    is the load-bearing assumption and it is exactly what (C) names as the
    doorway; a proposal that supplies such a description escapes the identity and
    must say so.
  - >-
    Cost is counted in elliptic-curve point additions or doublings, the same unit
    as H-ENDO-001 and the campaign's rho baselines.

  proof_search_map:
    bottleneck: >-
      Producing points inside the fibre with known exponents. That is the exact
      step whose removal would change the cost from sqrt(N*M) to sqrt(N/M).
    baseline_embedding:
      parameter_slice: >-
        M = 1 reproduces plain parallel rho with distinguished points at
        0.886 sqrt(N); the identity is an exact family extension through that
        boundary point.
      reproduction_check: >-
        A frozen regression fixture: the M = 1 arm must reproduce the campaign's
        own measured rho constant on identical instances and seeds, within the
        band already used for rho calibration.
    observation_collision:
      observable: pi(Q), the statistic's value at the target.
      distinct_preimage_search: >-
        Immediate and total: N/M distinct k values share the observable. The
        collision is not a defect to be repaired but the definition of the
        object, and the search that matters is for a pi whose fibre is
        efficiently enumerable in exponent space -- run adversarially over the
        candidate statistics the lane has proposed (psi_ell residue vectors,
        Elkies/Atkin patterns, isogeny-image membership).
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the fibre to a model where it is an exact congruence rather than a
        membership condition. If such a model exists for any candidate pi, the
        identity is escaped and Pohlig-Hellman applies instead.
      predicted_gain: >-
        sqrt(M) in the escaping case and -sqrt(M) otherwise; the record predicts
        no escape exists for any pi currently on the lane's list.
    quantifier_order: >-
      For every publicly computable pi with image size M >= 2 whose fibres admit
      no exponent-side description, and for every algorithm restricted to group
      operations plus evaluations of pi, the expected cost to recover k is
      Omega(sqrt(N*M)) under the rejection model and O(sqrt(N*M)) by the stated
      construction. The witness (the algorithm) is universal in pi; the
      exceptional pi are exhibited existentially and are exactly the escapes.
    method_ceiling:
      strongest_certifiable_claim: >-
        A cost identity for one exploitation strategy (fibre-restricted
        birthday search), measured at toy scale. It is NOT a lower bound over all
        algorithms and must never be cited as one; Shoup's bound already supplies
        the only lower bound this program has, and KN-FIND-b7e091 governs which
        oracles it covers.
      nearby_object_control: >-
        The exponent-side statistic with the same M, on which the desired
        conclusion FAILS by design (it gives sqrt(N/M)). A measurement that
        cannot separate the two statistics has not identified the load-bearing
        structure and is void.
    proof_obligations:
    - claim: Rejection cost per usable sample is Theta(M).
      responsibility: runtime
    - claim: Collisions inside the fibre require Theta(sqrt(N/M)) samples.
      responsibility: success_probability
    - claim: No nontrivial homomorphic pi exists on a prime-order group.
      responsibility: correctness
    not_applicable_reason: null

  predictions:
  - metric: measured_group_operations_to_solve_vs_M
    direction: higher
    minimum_effect: >-
      Ratio to plain rho equal to sqrt(M) within 20 percent, for M in
      {1, 2, 4, 16, 64, 256} at N of 24 to 32 bits, with at least 50 seeds per
      cell. A measured ratio below 1 at any M > 1 falsifies the identity and the
      lane is live.
  - metric: usable_samples_per_1000_draws
    direction: lower
    minimum_effect: >-
      1000/M within Poisson error, confirming the rejection density is the driver
      rather than an implementation cost.
  - metric: exponent_side_control_ratio
    direction: lower
    minimum_effect: >-
      1/sqrt(M) within 20 percent for the congruence statistic, demonstrating the
      instrument can see a genuine gain when one exists.
  - metric: fibre_enumerability_audit_over_the_lane_s_candidate_statistics
    direction: different
    minimum_effect: >-
      Zero of the lane's currently proposed statistics admit an exponent-side
      fibre description. One that does is an escape and is the interesting
      outcome.

  minimal_test:
    design: >-
      A single driver at N of 24, 28 and 32 bits on ordinary prime-field curves.
      Arms: (i) plain rho, the M = 1 null; (ii) fibre-restricted rho with a
      PLANTED point-side statistic of tunable image size M, taken as the top
      log2 M bits of the x-coordinate, which is publicly computable and has
      exactly the right shape; (iii) the exponent-side control with matched M.
      Measure group operations to solve, usable-sample rate, and wall-clock, with
      50 seeds per cell and the full distribution reported rather than a mean.
      Then run the audit half: for each candidate statistic already proposed in
      this lane, record M and state whether an exponent-side fibre description
      exists.
    controls:
    - >-
      The M = 1 null, which must reproduce the campaign's rho constant.
    - >-
      The exponent-side arm, which must show the opposite sign.
    - >-
      A k-resample null with the curve fixed, which must leave every measured
      cost unchanged, since the identity is about k-uniform behaviour.
    - >-
      CERTIFICATE DISCIPLINE. Every claimed solve carries a re-verified
      certificate per docs/claims-and-verification.md, since solves are claimed
      here (at toy scale) rather than merely simulated.
    required_metrics:
    - group_operations_to_solve_per_seed
    - usable_sample_rate_per_M
    - cost_ratio_to_plain_rho_with_confidence_band
    - exponent_side_control_ratio
    - per_statistic_M_and_fibre_description_table

  falsification_conditions:
  - >-
    Measured cost ratio below 1 for any M > 1. The identity is wrong, some
    exploitation beats plain rho, and the result must go to independent review
    before any interpretation.
  - >-
    Usable-sample rate not 1/M. The planted statistic is not uniform on G, the
    instrument is mis-specified, and every ratio it produced is void.
  - >-
    The exponent-side control does not show sqrt(N/M). The instrument cannot see
    a real gain and its negatives are uninterpretable
    (docs/inventor-protocol.md section 3).
  - >-
    A lane statistic is found with an efficiently enumerable fibre. The identity
    stands but the lane gains a live candidate, which is the outcome worth the
    most.

  confounders:
  - >-
    The top-bits statistic is not exactly uniform on G, so M is nominal and the
    achieved density must be measured, not assumed.
  - >-
    Restricted walks have worse mixing than unrestricted ones, so the measured
    ratio may exceed sqrt(M) for reasons unrelated to the identity; report the
    collision-constant separately from the rejection factor so the two do not
    merge.
  - >-
    At 24 bits the constants dominate; the scaling in N must be checked across
    three sizes before any ratio is believed.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy, N at 24 to 32 bits. NO ATTACK, NO EXPONENT, NO
    SPEEDUP; sota_delta zero. The record's direction is NEGATIVE for the lane.
  - >-
    An upper-bound construction, not a lower bound. It says what one strategy
    costs, not what all strategies cost.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding, with the oracle form
    of pi routed to RQ-GGMB-6eaabc through IDEA-20260811-b2806a; P2 respected, as
    no factor base is constructed.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For a publicly computable statistic pi with image size M and for uniformly
      random k, the events {pi([k]P) = s} behave like independent events of
      probability 1/M along a pseudorandom walk, so the number of draws to obtain
      one usable sample is geometric with mean M.
    rigorous_support: >-
      Rigorous ingredient: pi partitions G into fibres whose sizes sum to N, so
      the AVERAGE acceptance probability over a uniform point is exactly 1/M by
      counting. The classical distribution imitated is the geometric waiting time
      of Bernoulli trials, the same model used for distinguished-point yields in
      the rho literature.
    validation_plan: >-
      Directly measured in the same run: the empirical acceptance-rate
      distribution over 10^6 draws at each M, compared against the geometric
      prediction by a Kolmogorov-Smirnov statistic, with the fibre-size histogram
      reported so a badly non-uniform pi is visible rather than absorbed into the
      cost. Tail check: the maximum observed waiting time against the geometric
      tail exp(-x/M); a heavy tail would mean the walk correlates with pi and the
      cost model needs the correlation term.
  - id: HA-2
    statement: >-
      Collisions inside a fibre of size N/M occur after Theta(sqrt(N/M)) usable
      samples with the same birthday constant as on the full group.
    rigorous_support: >-
      The birthday bound is rigorous for uniform sampling; what is assumed is
      that the restricted walk remains sufficiently uniform on the fibre, which
      is the standard Teske-style assumption already used throughout this
      program's rho work [recall-confident].
    validation_plan: >-
      Measure the collision constant separately per M and require it to be
      constant in M within 15 percent. A constant that drifts with M localises
      the confound in mixing rather than in rejection, which is exactly the
      separation the record needs.

  target_complexity:
    time_exponent: >-
      sqrt(N*M) = N^{1/2} * M^{1/2} group operations for the fibre-restricted
      strategy, against 0.886 N^{1/2} for parallel rho. The exponent in N is
      unchanged at 1/2 and the M-dependence is a strict penalty. No exponent
      moves and none is claimed to move.
    memory_exponent: >-
      O(1) with distinguished points in both arms; the restriction does not
      change the memory position, so the comparison is on time alone and the
      van Oorschot-Wiener tradeoff is inherited unchanged.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations, O(1) memory (KN-TECH-001, KN-TECH-006).
    hidden_overhead: >-
      The identity charges pi at unit cost. A statistic costing c group
      operations to evaluate multiplies the penalty to c*sqrt(N*M), which makes
      the conclusion stronger, not weaker; the generous accounting is deliberate.
    tradeoff_note: >-
      Parallelises exactly as rho does with linear speedup and the same
      distinguished-point collision handling; the rejection factor is per
      processor and does not interact with the parallel merge.

  dominated_by: >-
    Dominated by parallel Pollard rho with distinguished points at 0.886 sqrt(N)
    group operations and O(1) memory (KN-TECH-001, KN-TECH-006) -- strictly, by
    the factor sqrt(M)/0.886, which is the record's own headline number. Also
    dominated by the automorphism-discounted variant (KN-TECH-018) and by BSGS at
    sqrt(N) time and memory (KN-TECH-031) on the time axis for M > 1. Checked
    against every frontier row this repository maintains; none is beaten.
  sota_delta: >-
    Negative and quantified: sqrt(M) worse than the baseline, for every M > 1.
    This is a proposal whose predicted contribution is a measured loss, and it is
    filed because the loss is the deliverable.

  estimated_cost:
    implementation: low
    compute: medium

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the sqrt(M) law measures out within band. 0.1 that any lane
    statistic turns out to have an enumerable fibre. 0.00 that anything here
    produces a speedup -- the record predicts the opposite, on purpose. Filed
    medium because it retires an entire question class cheaply, not because it
    could win.

  source_refs:
  - ledger/proposals/IDEA-20260807-df906f.yaml (prime-order propagation rigidity,
    consumed here)
  - ledger/proposals/IDEA-20260807-146aa8.yaml (three-regime screen)
  - ledger/proposals/IDEA-20260807-6eab6a.yaml (ell-primary coprimality)
  - knowledge/findings/KN-FIND-b7e091.md (binding GGM closure)
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md (L7, T5)
