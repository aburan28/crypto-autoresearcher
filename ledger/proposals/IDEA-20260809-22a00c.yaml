idea:
  id: IDEA-20260809-22a00c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    Score the cost model against a published record computation before using it
    for anything — the model that cannot retrodict a completed record predicts
    nothing
  class: control
  claim: >-
    Published discrete-logarithm record computations in extension fields report
    their parameters and their resource consumption. The claim is that this
    program's cost model, once calibrated, must RETRODICT such a record within a
    declared tolerance, and that this retrodiction is a harder and more
    informative test than reproducing another paper's estimate, because a record
    is an executed computation rather than a projection.
  mechanism: >-
    Instantiate the calibrated model at the record's parameters and compare
    predicted operations and memory against the reported consumption, with the
    machine-model translation stated explicitly and the comparison made per
    phase rather than in aggregate.
  why_not_a_renamed_known_approach: >-
    Estimation papers commonly cite records for context. Using a record as a
    scoring TARGET with a pre-declared tolerance, and treating a miss as
    disqualifying for the model rather than as a footnote, is the methodological
    content and follows the goal's baseline-reproduction requirement.
  predictions:
  - observable: predicted versus reported cost per phase for at least one record
    metric: ratio per phase
    predicted: Within one order of magnitude per phase after machine-model translation. A larger miss disqualifies the model for extrapolation until explained.
  - observable: whether the record's report contains enough detail to score at all
    metric: categorical per record
    predicted: At least one record will be unscoreable from its published text; that is a finding about reproducibility and is recorded as such rather than filled by assumption.
  minimal_test: >-
    Two records at different sizes, scored per phase with the translation stated,
    and a pre-registered tolerance recorded BEFORE the comparison is run.
  controls:
  - 'PRE-REGISTRATION: the tolerance is committed before the comparison, because a tolerance chosen afterwards can always be met and no later analysis undoes that.'
  - 'TRANSLATION CONTROL: the machine-model translation is applied identically to both records; a per-record translation is fitting in disguise.'
  falsification_conditions:
  - The model misses both records beyond the pre-registered tolerance, in which case no extrapolation in this goal is admissible until the model is repaired.
  - No record can be scored from published text, in which case the goal's calibration rests on its own runs alone and every later record must say so.
  interpretation_limits: >-
    Retrodiction of a record validates the model at that record's size, not at
    deployment size. Passing this control claims nothing about the deployed
    curve.
  sota_delta: 'No attack. Delta: a disqualifying control that most cost-model work omits.'
  dominated_by: Not dominated by any corpus record; complements IDEA-20260809-15e1cd, which anchors on this program's own runs rather than on external records.
  estimated_cost: Implementation small; compute negligible; acquisition-dominated.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for retrodiction/record computation: no records for extension-field DL. WEB NOT CHECKED.'
  source_refs:
  - Published extension-field DL record announcements -- RECALLED, REQUIRED READS, NOT LOCATED.
