    "claim": "Keeping an explicit isogeny chain as existential arithmetic-circuit wires may preserve inexpensive membership/decomposition on a transported implicit factor base despite dense expanded vanishing polynomials. R3 correspondence representation targets decomposition; any gain is conditional on elimination width, not polynomial degree alone.",
    "mechanism": "The object is a point accompanied by a path-witness circuit for membership, paired with Sigma={compose a declared prime-to-N isogeny, certify a wire, translate by a witnessed base element}. Partial-action; the source point and individual wire assignments are forgotten in the existential target membership predicate. On the prime subgroup the isogeny is injective, so the genuine lossy object is the existential membership bit and relation witness, not the transport map.\n\nLet F on E be implicit with a short arithmetic membership circuit C. For a chain phi_t...phi_1, define F' by exists X0...Xt with C(X0)=1, X_i=phi_i(X_{i-1}), X_t=X. Preserve every denominator-nonzero branch and exceptional point. A decomposition target is handled by this circuit joined to group-sum constraints, rather than expanding prod(X-x(phi(P))). Factor the constraint graph at isogeny-stage separators and measure the algebraic elimination width there. If width remains small while polynomial expansion becomes dense, a real representation resource survives transport; if resultant degrees reappear in separator messages, the compact syntax buys no solve saving.",
