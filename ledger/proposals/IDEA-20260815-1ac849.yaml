idea:
  id: IDEA-20260815-1ac849
  question_id: RQ-ECDSA-87625f
  added: '2026-08-15'
  title: >-
    LATTICE AND FOURIER NONCE ATTACKS ARE NEVER COSTED ON ONE AXIS: put them
    on a single memory-charged frontier and find the bias level where the
    winner changes
  class: cost-model

  claim: >-
    Lattice (HNP/BKZ) attacks need few signatures and large memory;
    Bleichenbacher Fourier attacks need many signatures and modest memory.
    Published comparisons report each in its own units, so no one knows
    which wins at a given bias and signature budget. The crossover, not
    either curve, is what a defender needs.

  mechanism: >-
    Cost both families under one model charging memory and signature
    acquisition. Sweep bias width and signature count. Report the frontier
    and the crossover contour, with the memory-cost exponent swept since the
    answer depends on it.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep 'lattice vs Fourier' (0), 'Bleichenbacher' (17), 'memory-
      charged frontier'; read of GOAL-ECDSA-001 objective.
    results: >-
      The goal itself asks for one memory-charged frontier, so the need is
      established program state; no record computes the crossover contour.
    verdict: >-
      ADAPTATION. Charged comparison is program policy; the contribution
      is the two-family crossover the goal names but does not yet have.

  object_first_candidate:
    tracked_object: >-
      THE CROSSOVER CONTOUR in the (bias width, signature budget) plane
      between the two attack families.
    lossiness: >-
      A single frontier projects away per-family detail, which is the
      point: comparability requires one axis.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while both families have reproducible cost models;
      sensitive to the memory-cost exponent, which is swept rather than
      fixed.

  null_object_control: >-
    NULL 1 -- free memory, where lattice attacks must dominate everywhere.
    NULL 2 -- zero-cost signatures, where Fourier must dominate. Both
    brackets must fire correctly or the harness is wrong.

  discriminated_from:
    - >-
        Published per-family cost analyses, which are deeper within a
        family and incomparable across families.
    - >-
        The plain-ECDLP lattice lane (KN-OPEN-011/018), which concerns
        lattices WITHOUT leakage; this record is entirely inside the
        leakage model.

  assumptions:
    - >-
        Both families' cost models are reproducible from published
        parameters.
    - >-
        A common memory-cost model is defensible; since it is not unique
        it is swept and the spread reported.

  predictions:
    - metric: >-
        free-memory and free-signature brackets
      direction: different
      minimum_effect: >-
        FORCED: each family wins its own bracket, else the harness is
        wrong.
    - metric: >-
        crossover contour location
      direction: different
      minimum_effect: >-
        The measurement, reported as a band across memory models.
    - metric: >-
        sensitivity of the contour to the memory exponent
      direction: different
      minimum_effect: >-
        If the contour moves by orders of magnitude the comparison is
        model-determined and must be reported as such.

  minimal_test:
    design: >-
      Symbolic cost instantiation plus a numeric sweep over bias and
      signature count; both brackets first.
    controls:
      - >-
          Both bracket nulls.
      - >-
          Published-parameter reproduction per family.
      - >-
          Memory exponent swept, not fixed.
    required_metrics:
      - >-
          Cost per family across the sweep.
      - >-
          Crossover contour per memory model.
      - >-
          The single cost model, applied to both.

  falsification_conditions:
    - >-
        A bracket fails. Harness wrong; halt.
    - >-
        The contour is model-determined across orders of magnitude. No
        single crossover may be quoted.
    - >-
        One family dominates everywhere under every model. The other is
        retired for this parameter regime.

  confounders:
    - >-
        ASYMMETRIC MODEL MATURITY: lattice costs are far better studied
        than Fourier costs here, so the less-modelled family may lose for
        modelling reasons.
    - >-
        SIGNATURE ACQUISITION COST is scenario-dependent and can be made
        to determine the answer.

  interpretation_limits:
    - >-
        Leakage model only; no bearing on plain ECDLP.
    - >-
        A comparison of published cost models, not new cryptanalysis.

  heuristic_assumptions:
    - id: HEUR-ECDSA-XOVER-1
      statement: >-
        Both families' published costs are captured by one model
        counting core operations plus charged memory and charged
        signature acquisition.
      rigorous_support: >-
        Rigorous ingredient: each family's published operation counts.
        THE GAP: BKZ cost itself is heuristic and contested in this
        corpus, so the lattice side inherits that uncertainty and the
        contour is no firmer than the BKZ model used.
      falsification_condition: >-
        A published attack whose cost falls outside the instantiated
        model by more than the model's stated spread.
      validation_plan: >-
        SAMPLE: >= 3 BKZ cost models x >= 3 memory exponents across the
        bias-budget grid. TAIL CHECK: grid corners where one family is
        near-infeasible. TRANSFER: none beyond the modelled regimes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. The record compares published costs.
    memory_exponent: >-
      Negligible; symbolic sweeps.
    best_known: >-
      Incumbents are the published lattice and Bleichenbacher attacks,
      costed here and not improved.
    hidden_overhead: >-
      BKZ cost-model uncertainty propagates directly into the contour and
      is the dominant hidden term.
    tradeoff_note: >-
      Few signatures and much memory versus many signatures and little
      memory; the contour is where that reverses.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As per-family analysis: dominated by the
    published literature. As a cross-family frontier: none exists here. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the single memory-charged
    frontier GOAL-ECDSA-001 asks for, plus a crossover contour reported as a
    band across BKZ and memory models rather than a single misleading
    number.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that both cost models reproduce. 0.5 that the contour is stable
    enough across BKZ models to be quotable. 0.3 that one family dominates
    everywhere in deployed-relevant regimes.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDSA-87625f
    - GOAL-ECDSA-001
    - KN-OPEN-011
    - KN-OPEN-018
    - KN-OPEN-017
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
