idea:
  id: IDEA-20260808-28361d
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  title: 'T5 is the wrong gate: because h(O) = |D|^{1/2+o(1)} and |D| is of order p, the ENTIRE
    F_p-isogeny class is enumerable in sqrt(N) * polylog steps, i.e. inside the rho budget
    - so reachability never binds, and the true criterion is a DENSITY inequality g >~ tau
    (number of good curves must exceed the per-step cost), under which a single exceptional
    curve in the class is worth exactly nothing'
  class: mechanism
  claim: "(A) THE TWO SIZES, PUT SIDE BY SIDE. For ordinary E/F_p with trace t, D = t^2 -\
    \ 4p, and O = End_{F_p}(E):\n    |D| = 4p - t^2, and for |t| <= 2 sqrt(p) sampled away\
    \ from the Hasse\n    endpoints, |D| is of order p;\n    h(O) = sqrt(|D|) * L(1, chi_D)\
    \ / pi * (unit and conductor factors),\n    so h(O) = |D|^{1/2 + o(1)} = p^{1/2 + o(1)};\n\
    \    N <= #E(F_p) = p + 1 - t, so sqrt(N) = p^{1/2 + o(1)}.\nHence h(O) and sqrt(N) agree\
    \ to within a factor that is bounded above and below by powers of log p (Siegel's ineffective\
    \ bound gives the o(1); GRH gives the effective two-sided polylog bound). THE ISOGENY\
    \ CLASS HAS ABOUT AS MANY CURVES AS POLLARD RHO HAS STEPS. (B) WHAT THAT DOES TO T5. DECOMPOSITION.md\
    \ T5 states the campaign's central dichotomy as: a cost-minimising curve is useful only\
    \ if goodness is common enough to hit by random walking, or locally detectable, because\
    \ reaching a SPECIFIED curve is vectorization and costs about sqrt(h) = p^{1/4}. That\
    \ framing is inverted. The attacker does not need to reach a specified curve; the attacker\
    \ needs to reach SOME good curve, and by (A) the attacker can visit the WHOLE class in\
    \ h = sqrt(N) * polylog steps, each step an ell-isogeny of small ell costing tau field\
    \ operations. So reachability is never the binding constraint; the binding constraint\
    \ is that the walk itself already costs as much as rho. (C) THE CORRECTED GATE, STATED\
    \ AS AN INEQUALITY (call it T5-prime). Let g be the number of curves in the class admitting\
    \ an attack of cost c, let tau be the cost of one isogeny step plus one goodness test,\
    \ in group- operation units. A walk-and-test attacker pays (h/g) * tau + c in expectation.\
    \ This beats the automorphism-discounted rho baseline 0.886 sqrt(N/r) if and only if\n\
    \    (h/g) * tau + c  <  0.886 sqrt(N/r).\nSubstituting h = sqrt(N) * polylog gives, when\
    \ c is negligible,\n    g  >  tau * polylog * sqrt(r) / 0.886,\ni.e. THE NUMBER OF GOOD\
    \ CURVES MUST EXCEED THE PER-STEP COST. Three corollaries follow immediately and are the\
    \ record's content:\n  (C1) g = 1 (a single exceptional curve) NEVER helps, at any c,\
    \ not even\n       c = 0, because the search alone costs sqrt(N) * polylog.\n  (C2) The\
    \ useful regime is g/h bounded below by a constant or by an\n       inverse polylog, i.e.\
    \ goodness must have positive density in the\n       class - which is exactly the regime\
    \ a within-class VARIANCE\n       measurement (lane L1) can detect, and exactly the regime\
    \ in which\n       the goodness is also detectable by the DEFENDER, so it cannot be a\n\
    \       trapdoor (see E3-07).\n  (C3) The whole-class enumeration is a legitimate Pareto\
    \ point in its own\n       right: >-\n         time p^{1/2+o(1)}, memory p^{1/2+o(1)}\
    \ - and it is DOMINATED\n       by rho, which achieves the same time at O(1) memory. So\
    \ class\n       enumeration is never the right primitive."
  mechanism: Two facts do all the work and neither is new by itself; the record is the composition.
    First, the class-number size h(O) = |D|^{1/2+o(1)} pins the class size to the rho budget.
    Second, the crater of the ell-volcano is a Cayley graph of Cl(O) which under GRH is a
    rapid mixer, so a non-backtracking walk of length O(log p) lands on a near-uniform curve,
    and a breadth-first traversal visits all h curves in O(h) steps. Together these say that
    "search the class" and "run rho" have the same exponent, so any class-search attack must
    win on the constant and the density, never on the exponent. The inequality in (C) is the
    exact bookkeeping of per-attempt cost times inverse success probability that the target-result
    profile requires, applied to the class search rather than to a smoothness event.
  why_not_a_renamed_known_approach: "Nearest prior record: IDEA-20260807-bbdcf3 uses the SAME\
    \ inequality h(O) < N in the opposite direction - to price the PRIZE of a hypothetical\
    \ ECDLP-to-class-group bridge at exponent 1/4, and then to kill homomorphic bridges by\
    \ the counting argument Hom(Z/N, Cl(O)) = 0 when N > h. That record is about a MAP from\
    \ points to classes. This record is about a SEARCH over curves and asserts nothing about\
    \ maps; its conclusion (a density criterion replacing a reachability dichotomy) is not\
    \ derivable from bbdcf3 and does not use the homomorphism argument at all. Nearest second:\
    \ >-\n  IDEA-20260807-7c00e6 closes COMBINING transported instances by the\none-modulus\
    \ obstruction; combining is not searching, and 7c00e6's conclusion holds even when g =\
    \ h. Nearest third: DECOMPOSITION.md T5 itself, which this record contradicts on its central\
    \ dichotomy and replaces with a sharper, testable inequality."
  predictions:
  - observable: class size relative to the rho budget
    metric: the ratio R = h(O) / sqrt(N), computed exactly for each of >= 200 sampled ordinary
      toy classes (24-32 bit p) by computing h(O) from the form class group and N from point
      counting
    predicted: "R lies in [1/(C log p), C log p] for a modest absolute constant C, with the\
      \ empirical distribution of log R concentrated and roughly symmetric about a small negative\
      \ value (the 1/pi and L(1,chi) factors). Direction: >-\n  R is NOT unbounded and NOT\
      \ vanishing polynomially."
  - observable: whether a single-good-curve class can ever beat rho
    metric: simulated total cost (h/g)*tau + c for measured h, measured tau, and c set adversarially
      to 0, at g = 1
    predicted: total cost strictly exceeds 0.886 sqrt(N/r) at every sampled class, for every
      tau >= 1. This is an arithmetic consequence of R being bounded below, so a violation
      would falsify the R prediction.
  - observable: per-step transport cost tau
    metric: field multiplications for one 2- or 3-isogeny step (Velu) plus the cheapest available
      goodness test, in units of one group operation
    predicted: 'tau >= 3 for any test that touches the curve equation at all, hence the density
      requirement g >~ 3 * polylog is not vacuous: goodness confined to fewer than a handful
      of curves is provably useless'
  minimal_test: No new machinery. (i) Sample 200-500 ordinary classes at 24-32 bits by choosing
    p and a random admissible t; compute h(O) with a standard binary- quadratic-form class
    group computation and N by point counting; report the empirical distribution of R = h/sqrt(N)
    with its 1st and 99th percentiles. (ii) Measure tau by timing one small-ell Velu step
    against one group operation in the same harness. (iii) Evaluate the T5-prime inequality
    on the measured (R, tau) for g = 1, 2, ..., 32 and report the smallest g at which the
    inequality can hold. The whole test is arithmetic on two measured distributions; it has
    no solver and no certificate.
  controls:
  - "NULL: >-\n  recompute R with h replaced by h(D_0) (the class number of the\nMAXIMAL order\
    \ only). If the conclusion changes, the conductor factor is doing the work and must be\
    \ reported separately."
  - 'SAMPLING CONTROL: sample t by two different procedures (uniform in the Hasse interval;
    and uniform over curves, which weights t by h(D)) and report R under both. The two weightings
    give genuinely different distributions and pooling them would be an error.'
  - 'DEGENERATE-CLASS CONTROL: deliberately include classes with |t| within p^{1/4} of 2 sqrt(p),
    where |D| is small and h is small. These are the only candidates for R << 1 and must be
    reported, not discarded.'
  confounders:
  - The Hasse-endpoint classes (|D| much smaller than p) genuinely have small h. They are
    rare (density about p^{-1/4} for |D| < p^{1/2}) but if they are over-represented by a
    sampling bug the measured R distribution will have a spurious left tail. The degenerate-class
    control exists to make this visible rather than to hide it.
  - 'h(O) versus h(D_0): for a class with large conductor f, h(O) is roughly f * h(D_0) times
    an Euler factor. Using the wrong one changes R by a large factor.'
  - tau is implementation-dependent; a slow Velu implementation inflates the density requirement
    and makes the criterion look stronger than it is. Report tau as a ratio to a group operation
    in the SAME code, never in seconds.
  falsification_conditions:
  - 'Measured R below 1/(log p)^2 on a non-negligible fraction of classes sampled uniformly
    over curves: then class enumeration is genuinely cheaper than rho for those classes and
    the record''s central conclusion (C1) fails for them. This would be a positive finding
    and the campaign should pivot to characterising that family.'
  - 'Measured R growing faster than polylog: then classes are much larger than the rho budget,
    reachability really does bind, and DECOMPOSITION.md T5 as written is right and this record
    is wrong.'
  - A demonstrated goodness predicate that is testable at tau < 1 group operation (i.e. cheaper
    than a single group operation), which would make the density requirement vacuous. The
    author does not believe this is possible but states it as the escape route.
  interpretation_limits: This record proves nothing and attacks nothing; it re-derives a gate.
    The class-size identity is asymptotic with an ineffective o(1) (Siegel), so the toy measurement
    validates the CONSTANT regime only, and toy-scale agreement is not crypto-scale validation.
    Nothing here says a good curve does not exist; it says a RARE one is worthless, which
    is a statement about attack economics and not about curve arithmetic. The rapid-mixing
    input is GRH-conditional and is cited, not proved.
  assumptions:
  - 'E ordinary, N prime and N || #E(F_p), p > 3.'
  - 'Class-number size h(O) = |D|^{1/2+o(1)}: Siegel''s theorem (ineffective) [recall-confident],
    with the effective two-sided polylog form under GRH.'
  - Rapid mixing of the ell-isogeny Cayley graph on the crater under GRH, as already cited
    by DECOMPOSITION.md T5.
  - The rho baseline 0.886 sqrt(N) and the automorphism discount sqrt(r) (KN-TECH-001, KN-TECH-006,
    KN-TECH-018) [corpus].
  heuristic_assumptions:
  - id: HA-1
    statement: For ordinary isogeny classes over F_p sampled uniformly over curves, the ratio
      R = h(End(E)) / sqrt(#E(F_p)) satisfies P( R < (log p)^{-2} ) = o(1) and P( R > (log
      p)^{2} ) = o(1), uniformly for p in a range of bit sizes.
    rigorous_ingredient: The analytic class number formula h(O) = sqrt(|D|) L(1, chi_D) w
      / (2 pi) times the explicit conductor Euler factor - an identity, not a heuristic -
      combined with the unconditional Siegel bound |D|^{1/2 - eps} << h << |D|^{1/2 + eps}.
    distribution_imitated: The distribution of L(1, chi_D) over fundamental discriminants,
      whose moments are known and which is conjectured (and under GRH provably) confined to
      [c/log log |D|, C log log |D|].
    validation_route: 'Sample as in the minimal test and compare the empirical distribution
      of log L(1, chi_D) - recovered from measured h and known |D| - against the predicted
      distribution of log L(1, chi) for random real characters. TOY SCALE: 24-32 bits, where
      h is directly computable. At crypto scale h is not computable without subexponential
      work, so this heuristic CANNOT be validated at crypto scale by this route, and the record
      says so rather than pretending otherwise.'
    tail_checks: The smallest observed R and the largest observed R in the sample, against
      the GRH-predicted extremes for that many samples; and the count of sampled classes with
      |D| < p^{1/2}, against the predicted density p^{-1/4}.
  target_complexity:
    time_exponent: No improvement is claimed. The record's content is that whole-class enumeration
      sits at p^{1/2+o(1)} time, the SAME exponent as rho, so the family of "minimise the
      cost functional over the isogeny class" attacks cannot move the exponent unless the
      goodness density g/h is bounded below by an inverse polylog.
    memory_exponent: Whole-class enumeration needs p^{1/2+o(1)} memory (one entry per curve)
      or, with a memoryless random walk, O(1) memory but a coupon-collector factor h log h
      = p^{1/2+o(1)} in time. Either way it is Pareto-dominated by rho.
    best_known_baseline: 'Parallel Pollard rho with distinguished points: 0.886 sqrt(N) group
      operations, O(1) memory per processor, linear parallel speedup (KN-TECH-001, KN-TECH-006);
      automorphism-discounted to 0.886 sqrt(N/r) on CM curves (KN-TECH-018).'
    hidden_overhead_disclosure: The polylog in h = sqrt(N) * polylog hides L(1, chi_D), which
      is ineffective by Siegel; the two-sided bound requires GRH. The o(1) is therefore not
      effectively bounded without GRH, and no concrete-cost table is offered.
    time_memory_tradeoff: 'van Oorschot-Wiener applies to the rho baseline (time sqrt(N^3/w)
      with memory w). Class enumeration offers no comparable interpolation: its time is h
      regardless of memory, so it is strictly inside the rho frontier. This is the honest
      Pareto statement.'
  sota_delta: 'Zero as an attack. As a gate: it replaces a qualitative dichotomy with a quantitative
    inequality and, if the R measurement lands where predicted, it closes the entire "single
    exceptional curve in the class" family - which includes the natural reading of GOAL-ECTD-001''s
    endpoint trapdoor - at exponent 1/2 with a named obstruction (class size equals the rho
    budget).'
  dominated_by: 'As an attack primitive, whole-class enumeration is dominated by parallel
    Pollard rho on every axis checked: time equal (p^{1/2+o(1)} both), memory strictly worse
    (p^{1/2+o(1)} vs O(1)), data/queries equal (one instance). BSGS (sqrt(N) time, sqrt(N)
    memory) matches it in both and is simpler. No frontier row is beaten. As a GATE (the record''s
    actual deliverable) it is dominated by nothing, because DECOMPOSITION.md T5 - the only
    prior statement of the same gate - is qualitative and, this record argues, wrong in its
    central dichotomy.'
  estimated_cost: "Implementation: >-\n  low (class-group computation for toy discriminants\
    \ plus\npoint counting; both are library calls or short code). Compute: low."
  recommended_priority: high
  honest_prior_of_survival: 0.9 that R lands in the predicted polylog window (this is essentially
    the analytic class number formula plus Siegel, so the risk is in the sampling, not the
    mathematics). 0.75 that the campaign accepts T5-prime as replacing T5. 0.15 that a family
    with R << 1 at non-negligible density is found, which is the outcome that would make this
    record interesting rather than merely corrective.
  novelty_status: unverified
  novelty_screen: Same corpus screen as E3-01, plus a targeted read of IDEA-20260807-bbdcf3
    (the h(O) ~ sqrt(p) size-gap record) and IDEA-20260807-7c00e6 (the transport-ensemble
    closure) in full-text, and of DECOMPOSITION.md sections 3 and 5. Grep of ledger/proposals
    for "class number|h(O)|subexponential" returned 55 files; the two above are the only ones
    using the size identity, and neither draws the density criterion. WEB SEARCH UNAVAILABLE;
    external novelty not established.
  discriminated_from: 'IDEA-20260807-bbdcf3: same inequality, opposite use (map-existence
    vs search-cost); its kill (Hom(Z/N, Cl(O)) = 0) is not used here and its prize (exponent
    1/4 from a bridge) is not claimed here. IDEA-20260807-7c00e6: closes COMBINING h transported
    instances; this record concerns FINDING one good curve and its conclusion is a density
    threshold, not a simulability argument. DECOMPOSITION.md T5: contradicted on its central
    dichotomy and replaced.'
  source_refs:
  - '"[corpus] analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md, T1-T5 and section
    5."'
  - '"[corpus] IDEA-20260807-bbdcf3, IDEA-20260807-7c00e6."'
  - '"[corpus] KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-027."'
