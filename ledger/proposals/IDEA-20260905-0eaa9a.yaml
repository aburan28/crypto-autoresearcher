idea:
  id: IDEA-20260905-0eaa9a
  title: Minimal-polynomial structure after projection to informative relations
  class: representation
  claim: 'After all automorphism-generated row redundancy is removed, a relation operator may retain a low-degree
    annihilating polynomial for reasons independent of the orbit permutation. Conjecture: any surviving reduction
    in algebraic iteration depth is predicted by the annihilator on the informative quotient and vanishes when base-orbit
    incidence is randomized.'
  mechanism: An r-fold circulant display can be artificial because the unknown vector already lies in one eigenspace.
    Work instead with the induced operator on independent orbit coordinates. Its invariant factors determine which
    parts of the quotient can be reached by repeated multiplication; a low-degree minimal polynomial could reduce
    iterative algebra work, but only with a sound completeness certificate and no exceptional bad starting subspace.
    The proposal isolates that algebraic object from the raw matrix's visual symmetry. It asks whether relation
    provenance imposes additional identities after folding, rather than assuming it does.
