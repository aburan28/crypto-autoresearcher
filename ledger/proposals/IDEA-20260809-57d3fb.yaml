idea:
  id: IDEA-20260809-57d3fb
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    The three-round nonce-commitment protocol as null object: every attack in
    this goal must fail against it, and the harness must prove it could have
    succeeded
  class: control
  claim: >-
    A protocol that commits to nonces in a first round before challenges exist
    removes the adaptivity the ROS solver requires. The claim is that running
    every attack in this goal against such a reference protocol must yield
    nothing, and that pairing this with a positive control — the same protocol
    with the commitment round stripped — demonstrates the attack harness retains
    its power in this setting. Without both halves, an empty result against any
    protocol in this goal means nothing.
  mechanism: >-
    Implement the committed-nonce protocol; run each attack; expect failure.
    Strip the commitment round and rerun; expect the attacks to succeed at the
    parameters where they succeeded in their own records.
  why_not_a_renamed_known_approach: >-
    Nonce commitment as a defence is well understood. Its use here as a
    MEASUREMENT CONTROL, with the stripped variant as the positive half, follows
    the inventor-protocol requirement that null-object controls precede belief,
    and it is what makes this goal's negative cells reportable.
  predictions:
  - observable: attack outcomes against the committed-nonce protocol
    metric: success rate per attack
    predicted: Zero across the board. Any success is either an implementation defect or a genuinely new result, and must be independently re-verified before anything is written.
  - observable: attack outcomes against the stripped variant
    metric: success rate per attack
    predicted: Matching the rates recorded in the attacks' own records; a lower rate means the harness lost power in this protocol and its negatives elsewhere are suspect.
  minimal_test: >-
    Run the full attack suite against both variants at matched parameters and
    budgets, and report the paired outcomes.
  controls:
  - 'PAIRED-PARAMETER CONTROL: identical parameters and budgets across both variants, or the pair proves nothing.'
  - 'HONEST-PATH CONTROL in both variants.'
  falsification_conditions:
  - An attack succeeds against the committed-nonce protocol.
  - Attacks fail against the stripped variant, indicating the harness lacks power here.
  interpretation_limits: >-
    Failure of this program's attacks against a reference protocol at declared
    budgets is not a security proof and may never be written as one (AGENTS.md
    rule 3).
  sota_delta: 'No attack. Delta: the control pair that makes every negative result in this goal interpretable.'
  dominated_by: Not dominated by any corpus record; a precondition for interpreting IDEA-20260809-4f9042, 52726c and 5371f0.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for nonce commitment control: no records. WEB NOT CHECKED.'
  source_refs:
  - Three-round threshold Schnorr specifications -- RECALLED, REQUIRED READS.
