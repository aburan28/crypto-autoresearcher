  discriminated_from: >-
    NOT IDEA-20260807-1d9c5f (rational-kernel count of psi_ell as the level, for
    general ell, proposed as a stratifier): that record measures the level; this
    one claims a specific frozen invariant family EQUALS it at ell = 2 and gives
    the count. NOT IDEA-20260807-cbe8c1 (full rational ell-torsion as a non-floor
    condition, routed into a factor-base cost): the direction there is
    torsion -> factor base; here it is Semaev elimination ideal -> torsion, and
    the payload is a pre-registration hazard rather than a cost route. NOT
    IDEA-20260808-4d77a6, whose identity this record CONSUMES as HA-1 and whose
    non-vacuity question it answers in one concrete case (v_2(A-1) = 1, so the
    detector sees one bit). NOT IDEA-20260807-8027a2, which derives the
    discriminant identity for the Kummer-line reading; this record uses that
    identity as the mechanism for a different conclusion. NOT the S_4 outlier
    adjudication in EV-ICINV-6b6264, which is a j-invariant degeneration with no
    isogeny content: the object here DOES have isogeny content (it is exactly a
    2-volcano coordinate), which is what makes it dangerous rather than inert.

  assumptions:
  - >-
    E/F_p ordinary, p > 3, N prime and coprime to 2, so T1 transport applies to
    every 2-isogeny used in the argument (degree 2 is coprime to the large prime
    N).
  - >-
    The committed census of EV-ICINV-6b6264 -- 138 members, D = -15104 =
    -59 * 16^2, level populations 3, 9, 18, 36, 72, all with #E = 3972 -- is
    taken as given and is not re-derived here.
  - >-
    The f_V-free Jacobian formulation of EXP-ICINV-e0cd8f is the object of
    claim (A). Nothing here transfers to the deployed f_V-bearing formulation,
    by that contract's own boundary statement.

  proof_search_map:
    bottleneck: >-
      The elimination step: whether I_3 intersect F_p[x_3] is generated by the
      curve cubic. Removing that step is what changes whether the contract's
      elimination family is a Semaev functional or a 2-torsion functional.
    baseline_embedding:
      parameter_slice: >-
        m = 3, f_V-free Jacobian ideal, degrevlex, standard grading after
        homogenisation with respect to x0 -- the exact slice of
        EXP-ICINV-e0cd8f, so the check reproduces the contract's own object with
        no reparameterisation.
      reproduction_check: >-
        Symbolic: recompute over QQ[a,b] and specialise to the five probe curves
        named in EV-ICINV-6b6264 forward_lead_non_evidence, requiring exact
        agreement with the recorded generators and factorisation types.
    observation_collision:
      observable: >-
        The pair (elimination-polynomial degree, F_p factorisation type).
      distinct_preimage_search: >-
        The collision is the claim: 66 curves with 66 distinct j-invariants all
        carry observable [1,1,1]. The search is therefore not for a collision but
        for a SEPARATION -- two curves at the same 2-volcano level with different
        observables. Finding one falsifies the level-constancy argument in (C)
        and reopens the family as a genuine curve functional.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the splitting-type map over [1,1,1] on the class, i.e. the
        66-curve union of levels 0-3, and the intrinsic invariant that separates
        its members (their j-invariants, which the observable forgets).
      predicted_gain: >-
        None as an attack. The gain is diagnostic: it converts a would-be
        CLASS-VARYING verdict into a known non-Semaev mechanism at zero compute.
    quantifier_order: >-
      For all (a, b) in the smooth locus over QQ, the elimination ideal is
      generated by x^3 + a x + b (a universal statement in the parameters, no
      instance-dependent witness). For all odd d and all F_p-isogenies phi of
      degree d, splitting type is preserved (universal). There EXISTS a level
      partition -- namely the 2-adic valuation of the conductor -- on whose
      blocks the observable is constant; the witness is the same for every class
      member and does not depend on the seed, the target, or the model.
    method_ceiling:
      strongest_certifiable_claim: >-
        That one of four primary invariant families of a frozen contract is a
        function of E(F_p)[2]. It certifies nothing about the other three
        families, nothing about solving time, and nothing about any exponent.
      nearby_object_control: >-
        The 138 curves of a DIFFERENT trace at the same p (no common volcano):
        there the same observable must fail to be constant on any induced
        blocking. If it is constant there too, the observable is being driven by
        p rather than by the class and the whole argument is instrument noise.
    proof_obligations:
    - claim: >-
        I_3 intersect QQ(a,b)[x_3] = < x_3^3 + a x_3 + b >.
      responsibility: correctness
    - claim: >-
        Odd-degree F_p-isogenies preserve the F_p-splitting type of the
        2-division polynomial.
      responsibility: correctness
    - claim: >-
        The [1,1,1] count on the committed class is exactly 66.
      responsibility: success_probability
    not_applicable_reason: null

  predictions:
  - metric: elimination_ideal_generator_over_QQ_ab
    direction: different
    minimum_effect: >-
      Exactly equal to x_3^3 + a x_3 + b, as an ideal identity in QQ(a,b)[x_3].
      Any other generator falsifies (A) and the rest of the record is void.
  - metric: count_of_class_members_with_splitting_type_1_1_1
    direction: different
    minimum_effect: >-
      EXACTLY 66 out of 138 under HA-1; and, unconditionally, a subset sum of
      {3, 9, 18, 36, 72}. A count outside the 32 admissible subset sums falsifies
      the level-constancy argument (C). A count that is an admissible subset sum
      but not 66 falsifies HA-1 while leaving (C) standing.
  - metric: within_level_variance_of_splitting_type
    direction: different
    minimum_effect: >-
      EXACTLY ZERO on each of the five levels. One separating pair inside a level
      falsifies (C).
  - metric: splitting_type_on_the_138_curve_matched_null
    direction: different
    minimum_effect: >-
      The null's [1,1,1] fraction must be consistent with the unconditional
      Chebotarev-style expectation for random cubics over F_p (1/6 of cubics
      split completely, 1/2 have exactly one root, 1/3 are irreducible; on curves
      with 2 | #E the irreducible case is excluded), and must NOT be constant on
      any blocking induced by the class's level populations.

  minimal_test:
    design: >-
      Two stages, both cheap, the second run only if the first passes. STAGE 1
      (symbolic, no data): compute the elimination ideal of the m = 3 f_V-free
      Jacobian ideal over QQ[a,b] with a and b as parameters, in two engines, and
      compare the generator against x^3 + a x + b. STAGE 2 (exact, 138 rows):
      for each committed class member, factor x^3 + a x + b over F_4001, record
      the type, and cross-tabulate against the level assignment. THE LEVEL
      ASSIGNMENT MUST NOT COME FROM A 2-TORSION COUNT -- that is the committed
      circularity, since the 2-torsion count is the very quantity under test.
      Obtain levels independently, either by Velu 2-isogeny walking with a
      recorded path certificate or by the Hilbert-class-polynomial factorisation
      route of IDEA-20260811-5e4cd5. Report the full 5 x 2 contingency table, not
      a summary statistic.
    controls:
    - >-
      C-GAUGE: recompute on (u^4 a, u^6 b) for a seeded per-curve square unit u;
      splitting type must be invariant on all 138. Additionally recompute on a
      NON-square u (the quadratic twist): splitting type must still be invariant,
      which is the sharper check because the twist leaves the isogeny class.
    - >-
      NULL OBJECT: 138 curves at p = 4001 drawn from other traces, same
      measurement, same table.
    - >-
      PLANTED SIGNAL: a curve constructed with full rational 2-torsion at a known
      level, which the instrument must classify correctly; and one with cyclic
      2-Sylow. Two-directional as GOAL-ENDO-001 C4 requires.
    - >-
      INDEPENDENT LEVEL LABELLER: two labellers must agree on all 138 before any
      contingency table is interpreted (the committed 2-of-5 defect is the reason
      this control is blocking rather than advisory).
    required_metrics:
    - elimination_ideal_generator_over_QQ_ab
    - per_curve_splitting_type
    - per_curve_level_from_two_independent_labellers
    - five_by_two_contingency_table
    - gauge_and_twist_invariance_flags
    - null_object_splitting_type_multiset

  falsification_conditions:
  - >-
    The elimination ideal over QQ[a,b] is not generated by the curve cubic. Claim
    (A) is false; the elimination family may retain Semaev content and the
    successor contract should keep it as a primary family.
  - >-
    Any two class members at the same 2-volcano level have different splitting
    types. Claim (C) is false, which would contradict the elementary fact that
    odd-degree isogenies are isomorphisms on E[2]; replicate before reporting,
    because the likeliest cause is a wrong level assignment.
  - >-
    The [1,1,1] count is an admissible subset sum other than 66. HA-1 (the
    Lenstra/Smith-form identity as transcribed) is false or misapplied; the
    qualitative conclusion survives and the quantitative one does not.
  - >-
    The matched null shows the same block structure. The measurement is reading
    p, not the class, and every number in stage 2 is void.

  confounders:
  - >-
    CIRCULAR LEVEL LABELS. The committed volcano labelling was itself computed
    from a 2-torsion count, which is the quantity under test; using it would make
    the contingency table a tautology. This is the single most likely way to get
    a meaningless pass and is why an independent labeller is a blocking control.
  - >-
    The class has ONE trace and ONE p. Level populations 3, 9, 18, 36, 72 are
    strongly unbalanced, so a level-blind mechanism that happens to favour large
    blocks can imitate the predicted 66/72 split. The subset-sum prediction is
    stated precisely because it is much harder to imitate than a proportion.
  - >-
    f = 16 is a pure 2-power here, so "level" and "2-adic level" coincide. On a
    class with odd conductor factors the argument still holds but the blocking is
    by v_2(f_E) only, and the other level coordinates must be collapsed before
    the table is read.

  interpretation_limits:
  - >-
    TOY SCALE. p = 4001, one trace, one class, m = 3, the f_V-free formulation.
    claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP. sota_delta zero.
  - >-
    A CLASS-VARYING result here is explicitly NOT evidence that Semaev geometry
    varies across an isogeny class. That is the whole point of the record: it
    pre-registers the mechanism so the verdict cannot be misread.
  - >-
    H-ENDO-001 is USED as the admissibility filter and not retested.
    KN-FIND-b7e091 remains binding and unrevisited. Pause condition P2 is
    respected: no equivariant factor base is constructed and no phi-stable
    structure is tested, so nothing here bears on H-STR-002 in either direction.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For an ordinary E/F_p with trace t, D = t^2 - 4p = f^2 D_0 and
      End_{F_p}(E) of conductor f_E, the first invariant factor of
      E(F_p) = Z/n_1 x Z/n_2 satisfies n_1 = gcd(A - 1, f/f_E) with
      A = (t - f D_0)/2. This is asserted as an IDENTITY, not a distribution, and
      it is imported from IDEA-20260808-4d77a6, where it is derived from
      Lenstra's CM structure theorem E(F_p) = O/(pi - 1)O.
    rigorous_support: >-
      Lenstra's theorem is a proved statement [recall-confident: H. W. Lenstra
      Jr., Complex multiplication structure of elliptic curves, J. Number Theory
      56 (1996) 227-241; NOT re-verified this session]. The Smith-normal-form
      step is elementary linear algebra over Z. What is assumed here is the
      correctness of the transcription in IDEA-20260808-4d77a6, which this
      program has not yet checked.
    validation_plan: >-
      Directly, and at zero extra cost, by the same run: for each of the 138
      members compute n_1 from the group structure by two independent methods
      (order testing on random points; and ell-divisibility of a computed basis)
      and compare against gcd(486, 16/f_E). Predicted exact agreement on 138 of
      138. Tail check: the maximum of v_2(n_1) over the class is predicted to be
      exactly 1, because v_2(A - 1) = v_2(486) = 1 caps it; observing any curve
      with v_2(n_1) >= 2 falsifies HA-1 immediately and cheaply.
  - id: HA-2
    statement: >-
      The odd primes ell not dividing f generate Cl(O_{f_E}) for each level, so
      each 2-volcano level is a single orbit of the odd-degree horizontal
      isogeny action and level-constancy of any odd-isogeny-invariant follows.
    rigorous_support: >-
      Generation of the class group by prime ideals of small norm is a standard
      consequence of Chebotarev under GRH [recall-confident, not verified this
      session]; unconditionally, generation by ALL odd primes is immediate from
      the surjectivity of the map from ideals to ideal classes together with the
      fact that every class contains an integral ideal of odd norm coprime to f.
      The unconditional form is what this record uses; no mixing rate is claimed.
    validation_plan: >-
      Structural, and checkable on the committed class: verify that each level
      block is connected in the graph of odd-degree horizontal isogenies built by
      Velu for ell in {3, 5, 7}. Predicted: 5 connected components matching the
      5 levels. A level that splits into two components under all tested odd ell
      is a warning that the tested ell do not generate and does not by itself
      refute HA-2.

  target_complexity:
    time_exponent: >-
      No attack exponent is claimed and none moves. This is a pre-registration
      and instrument record. Measurement cost per curve is O(log^2 p) bit
      operations for the cubic factorisation, plus the level labeller.
    memory_exponent: >-
      O(log p) bits per curve; O(h log p) if the class is stored, which is the
      caller's choice.
    best_known: >-
      For the underlying attack question, parallel Pollard rho with distinguished
      points at 0.886 sqrt(N) group operations and O(1) memory
      (KN-TECH-001, KN-TECH-006).
    hidden_overhead: >-
      None hidden. The one cost that is easy to understate is the independent
      level labeller, which is Otilde(ell^2) per curve per ell by the modular
      polynomial route; the Hilbert-class-polynomial route of
      IDEA-20260811-5e4cd5 amortises it over the whole class.
    tradeoff_note: >-
      Not applicable; no search is proposed.

  dominated_by: >-
    As an attack, dominated by every row of the frontier this program maintains,
    because it is not an attack: parallel Pollard rho with distinguished points at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant at 0.886 sqrt(N/|Aut|) (KN-TECH-018); BSGS at
    sqrt(N) time and sqrt(N) memory (KN-TECH-031). As a PRE-REGISTRATION, it is
    dominated by nothing in this repository, because no committed record states
    the elimination family's identity or the 66/72 split.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own successor-contract
    design: it removes one of four primary invariant families from contention
    before any compute is spent, at a cost of seconds.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.75 that the elimination identity (A) holds exactly over QQ[a,b] (the
    discriminant identity makes the mechanism clear, but the Jacobian ideal's
    elimination could carry extra components). 0.97 that splitting type is
    constant on levels (C) -- this is close to a theorem. 0.65 that the count is
    exactly 66, conditional on HA-1's transcription being right. 0.00 that
    anything here moves an exponent, stated so the priority is not misread: it is
    high because it is decisive and nearly free, not because it is an attack.

