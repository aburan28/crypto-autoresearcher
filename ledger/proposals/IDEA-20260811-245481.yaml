    RQ-PAIR, RQ-EQLA, RQ-EQIC, RQ-CANL and RQ-INSTR lanes. WEB SEARCH WAS
    UNAVAILABLE in this session (the configured search backend returned an
    access error), so EXTERNAL novelty is NOT established and the classical
