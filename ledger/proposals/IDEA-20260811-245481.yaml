idea:
  id: IDEA-20260811-245481
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  title: >-
    THE FIVE-CURVE ELIMINATION LEAD, CONVERTED FROM AN OBSERVATION INTO A
    PRE-REGISTERED NUMBER BEFORE ANY SUCCESSOR CONTRACT IS WRITTEN: if
    I_3 intersect F_p[x_3] is the curve cubic then the elimination family IS the
    splitting type of the 2-division polynomial, which is rigorously constant on
    each 2-volcano level and therefore takes at most 5 values on the committed
    138-curve class -- and Lenstra's CM structure theorem pins the split at
    EXACTLY 66 curves of type [1,1,1] and 72 of type [1,2], with the [1,2] block
    being precisely the 2-volcano FLOOR
  class: measurement

  claim: >-
    (A) THE SYMBOLIC HALF, WHICH IS NOT A MEASUREMENT AT ALL. For the f_V-free
    Jacobian formulation of EXP-ICINV-e0cd8f, the claim is the polynomial
    identity, over QQ[a,b] and not merely over one F_p, that the elimination
    ideal of the m = 3 ideal onto the last variable is generated by the curve's
    own cubic: I_3 intersect QQ(a,b)[x_3] = < x_3^3 + a x_3 + b >. The mechanism
    is the committed discriminant identity disc_T S_3(x_1, x_2, T) =
    16 f(x_1) f(x_2) with f(x) = x^3 + a x + b (IDEA-20260807-8027a2): the
    singular locus of S_3 = 0 is exactly where the differential-addition
    quadratic in one variable has a double root, i.e. where another variable is
    a root of f, and the symmetry of S_3 in its three arguments moves that
    condition onto x_3 under elimination. Either the identity holds in QQ[a,b]
    or it does not; the check is one Groebner computation in a polynomial ring
    with two parameters and costs seconds.
    (B) THE CONSEQUENCE, WHICH IS THE POINT. If (A) holds, then the contract's
    PRIMARY invariant family "elimination-polynomial degree and F_p
    factorisation type" carries NO Semaev content whatsoever. It is the
    splitting type of the 2-division polynomial, hence a function of
    E(F_p)[2] alone. DEC-20260810-d70ece NA7 requires a successor contract to
    "anticipate that the elimination family may reduce to the splitting type of
    x^3 + a x + b and say so before execution". This record discharges that
    requirement with a derivation and a number rather than with a caveat.
    (C) THE RIGOROUS PREDICTION. An F_p-isogeny of ODD degree restricts to a
    Galois-equivariant isomorphism E[2] -> E'[2], because its kernel has odd
    order and both 2-torsion groups have order 4. Horizontal odd-degree
    isogenies act transitively on each level of the 2-volcano (the odd primes
    generate Cl(O_{f_E})). Therefore the splitting type is CONSTANT ON EACH
    2-VOLCANO LEVEL, and on the committed p = 4001, t = 30 class -- whose level
    populations are the certified class numbers 3, 9, 18, 36, 72 summing to
    H(15104) = 138 (EV-ICINV-6b6264) -- the number of curves with splitting type
    [1,1,1] must be a subset sum of {3, 9, 18, 36, 72}. This is falsifiable by
    ANY observed count outside that 32-element set.
    (D) THE SHARP PREDICTION, CONDITIONAL ON HA-1. Applying the Lenstra CM
    structure identity as stated in IDEA-20260808-4d77a6 -- n_1 = gcd(A - 1, f /
    f_E) with A = (t - f D_0)/2 -- gives A = (30 + 944)/2 = 487, A - 1 = 486 =
    2 * 3^5, so v_2(A - 1) = 1 and n_1 = gcd(486, 16/f_E) equals 2 for
    f_E in {1, 2, 4, 8} and 1 for f_E = 16. Since #E = 3972 = 2^2 * 3 * 331 has
    2-Sylow of order EXACTLY 4, this makes the 2-Sylow (Z/2)^2 above the floor
    and Z/4 on the floor. Hence: EXACTLY 66 curves (levels 0-3) have full
    rational 2-torsion and splitting type [1,1,1], and EXACTLY 72 curves (the
    floor, f_E = 16) have splitting type [1,2]. The five-curve capability probe
    recorded as NON-EVIDENCE in EV-ICINV-6b6264 (four [1,1,1], one [1,2]) is
    consistent with this and is NOT used to derive it.
    (E) WHAT THIS DOES TO THE LANE. It predicts, before execution, that a
    CLASS-VARYING verdict from the elimination family would be true and
    worthless -- the exact failure DEC-20260810-d70ece named as the reason not
    to amend the frozen contract. It also explains the committed instrument
    defect that "volcano level computed as a 2-torsion count resolves 2 of 5
    levels": 2-torsion counting separates the floor from everything else and
    nothing more, and (D) says exactly why -- v_2(A - 1) = 1 caps the detector
    at one bit.

  mechanism: >-
    Two independent structures meet. Algebraically, the Semaev polynomial S_3 is
    the differential-addition quadratic whose discriminant in the eliminated
    variable is 16 f(x_1) f(x_2); its singular locus is therefore the 2-torsion
    locus of the curve, and elimination transports that locus onto the remaining
    coordinate. Arithmetically, 2-torsion is a 2-primary object and every
    odd-degree isogeny is an isomorphism on it, so the resulting invariant is
    blind to every horizontal step and sees only vertical motion in the
    2-volcano. The two facts compose into a complete description of one of the
    contract's four primary families as a function of a single bit of
    endomorphism-ring data.

  tracked_object: >-
    The F_p-splitting type of the 2-division polynomial x^3 + a x + b, equivalent
    to the Galois module E[2] and to the isomorphism type of the 2-Sylow subgroup
    of E(F_p) at this trace. Not "a measurement of the elimination ideal" -- the
    elimination ideal is claimed to BE this object.

  resource: >-
    R5 (ell-torsion at ell = 2 as a Galois module) reached through R1/R2 (the
    curve equation and its polynomial system). It is NOT an R3 use of End(E) on
    points, so the H-ENDO-001 admissibility filter is satisfied: nothing here
    applies an endomorphism to a point of G, and the object is k-independent by
    construction, which this record states BEFORE the measurement rather than
    after.

  lossy_projection_test: >-
    PASSES, and the loss is exactly quantified. The projection (a, b) -> splitting
    type of x^3 + a x + b discards j entirely except for one bit of 2-primary
    information: the fibre over [1,1,1] on this class has 66 members carrying 66
    distinct j-invariants, so the projection is massively lossy. What it retains
    propagates DETERMINISTICALLY under the target's operations: an odd-degree
    F_p-isogeny fixes it exactly (kernel of odd order meets E[2] trivially), and
    a 2-isogeny moves it in a way determined by whether the step crosses the
    floor. This is the two-clause test of docs/inventor-protocol.md section 2,
    satisfied in both clauses, and it is the reason the object is worth naming
    even though its cost content is nil.

  t5_reachability: >-
    The label is LOCAL in the strict T5 sense -- computable at a vertex from the
    curve equation alone in O(log^2 p) bit operations by counting roots of a
    cubic -- so it is a legitimate T5 option-(ii) test. It is nonetheless useless
    for targeting, and this record says so quantitatively: it partitions 138
    curves into blocks of 66 and 72, i.e. it supplies log2(138/72) = 0.94 bits
    towards an address that needs log2(138) = 7.11 bits. The information budget
    of local labels in general is the subject of IDEA-20260811-9bb909, which this
    record instantiates with the first concrete label.

  null_object: >-
    The matched null is 138 curves drawn from OTHER traces at p = 4001 with the
    same #E-free sampling the contract's never-drawn C-CONTROL-SET specified. On
    that null the splitting-type multiset must NOT be a subset sum of the level
    populations and must not be constant on any induced blocking, because those
    curves have no common 2-volcano. A second, cheaper null is the isomorphism
    orbit (u^4 a, u^6 b): splitting type must be EXACTLY invariant there (C-GAUGE
    discipline), since a twist by a square unit does not change the number of
    rational roots -- while the quadratic twist (non-square u) must ALSO preserve
    it, which is a real check because the twist has trace -t and is not in the
    class.

  why_not_a_renamed_known_approach: >-
    The 2-torsion / 2-volcano relationship is classical [recall-uncertain:
    Miret-Moreno-Rio-Valls and successors on locating a curve in the 2-volcano
    via its 2-Sylow structure; NOT verified this session, web search unavailable].
    What is new here is not that relationship but its collision with the
    campaign's own frozen invariant family: the claim that a PRIMARY Semaev
    invariant of EXP-ICINV-e0cd8f is that classical quantity in disguise, stated
    with the exact split 66/72 derived before execution. The record's value is
    that it prices a verdict the campaign was about to buy.

  novelty_status: unverified

  novelty_screen: >-
    Corpus screen performed this session: full text of
    analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md and
    MATCHED-ORDER-DESIGN.md; ledger/evidence/EV-ICINV-6b6264.yaml;
    ledger/decisions/DEC-20260810-d70ece.yaml; ledger/hypotheses/H-ENDO-001.yaml;
