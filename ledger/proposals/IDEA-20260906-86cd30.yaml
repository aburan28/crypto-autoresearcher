idea:
  id: IDEA-20260906-86cd30
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-09-06'
  title: >-
    THE m = 2 DECOMPOSITION GRAPH OF A PRIME-ORDER CURVE IS A PATH, SO THE
    RANDOM-BASE p_exist HAS AN EXACT CLOSED FORM WITH NO HEURISTIC IN IT:
    for every target R != O, the on-curve x-classes ordered by j in
    x([j] R/2) form one Hamiltonian path with a loop at x(R/2), a
    2-decomposition of R over V is exactly an induced edge (or the loop
    vertex) of V in that path, and for a uniformly random base of size B
    P[R decomposes] = 1 - C(n - B, B) / C(n, B) with n = (N - 1)/2, for every
    curve of prime order N and every R -- which replaces the reported
    HEUR-SEMAEV-2015-4.3 reference curve of the frozen protocol by a theorem,
    predicts every cell of the ladder to four digits before any run, and
    brackets the m = 3 law rigorously with Janson's inequality
  class: mechanism

  claim: >-
    SETTING. E/F_p short Weierstrass with N = #E(F_p) an odd prime. There is
    no 2-torsion, so every on-curve x-coordinate has exactly two lifts P, -P
    and the number of on-curve x-classes is n = (N - 1)/2. A factor base is a
    set V of B x-classes; the searched point set is W = lifts of V and their
    negatives, |W| = 2B (H-RELN-96e3ba). A 2-decomposition of a target R != O
    is a size-2 multiset {P_1, P_2} from W with P_1 + P_2 = R.

    LEMMA 1 (ADJACENCY). Let R' = [2^{-1} mod N] R, so [2] R' = R, and label
    the x-class of [j] R' by j in {1, ..., n} (j and N - j are the same
    class). For classes j_1, j_2 there exist signs with
    e_1 j_1 + e_2 j_2 = 2 (mod N) if and only if j_2 is [j_1 + 2] or
    [j_1 - 2], where [k] is the representative of +-k in {1, ..., n} and
    [0] is excluded (it is the point O). Boundary cases: [1 - 2] = 1 gives a
    LOOP at j = 1 (the multiset {R', R'}); [2 - 2] = 0 is excluded (R + O is
    not a 2-decomposition); [n + 2] = n - 1 and [(n - 1) + 2] = n join the
    odd chain to the even chain at the top. Each adjacency is realised by
    exactly ONE signed multiset.

    THEOREM 1 (THE GRAPH IS A PATH). The graph G_R on the n x-classes with
    edges {j, j + 2} for 1 <= j <= n - 2, the edge {n - 1, n}, and the loop
    at 1, is a single path 1 - 3 - 5 - ... - (top) - ... - 4 - 2 with the
    loop at one end (x(R/2)) and the other end at x(R). It has n - 1 edges
    and one loop, hence 2(n - 1) + 1 = N - 2 ordered solutions, which is
    exactly the affine point count of the relation locus C_R in
    IDEA-20260807-0ff796 (B): the same object, read as an incidence
    structure instead of as a curve.

    THEOREM 2 (EXACT RANDOM-BASE LAW, m = 2). For V a uniformly random
    B-subset of the n x-classes and any fixed R != O,
      P_V[R has a 2-decomposition over V] = 1 - C(n - B, B) / C(n, B),
    because V fails iff it avoids the loop vertex and contains no two
    adjacent vertices of the remaining path on n - 1 vertices, and the
    number of independent B-sets of a path on n - 1 vertices is
    C((n - 1) - B + 1, B). If the certificate scheme forbids the repeated
    point {R', R'}, drop the loop and the law is 1 - C(n - B + 1, B)/C(n, B).
    Both forms are stated; the protocol's certificate (exactly m points,
    signs free) must declare which it counts.
    COROLLARY 2a. The law depends on (N, B) only: not on the curve, not on
    the target, not on the equation. Hence E_V[coverage(V)] over uniformly
    random bases is EXACTLY 1 - C(n - B, B)/C(n, B) for every curve of prime
    order N, and the protocol's random-base arm at m = 2 measures a number
    that is already known to every digit.
    COROLLARY 2b. Asymptotics. C(n - B, B)/C(n, B) = exp(-B^2/n (1 + O(B/n)))
    = exp(-2B^2/(N - 1)) (1 + O(B/N)), which reproduces the Poisson
    coverage 1 - e^{-mu} of KN-FIND-007 and the 2^m mean correction of
    H-RELN-96e3ba as its leading term; the finite-N shape is now exact.
    COROLLARY 2c. Forced ladder values (loop counted). N = 4099, B = 8:
    n = 2049, p_exist = 1 - prod_{i=0}^{7} (2041 - i)/(2049 - i) = 0.0308,
    against the protocol's reported |V|^2/(2q) = 0.0078 -- the factor-4 miss
    H-RELN-96e3ba predicts, now with the exact value on the other side.
    Every cell of the default ladder is a one-line product computable before
    any trial.
    COROLLARY 2d (DISTRIBUTION, NOT ONLY COVERAGE). The number of
    2-decompositions c(R) of a fixed R over random V is the number of
    induced edges of a random B-subset of a path plus the loop indicator,
    whose law is the classical runs distribution
    P[k induced edges on a loop-free path of n' vertices]
    = C(n' - B + 1, B - k) C(B - 1, k) / C(n', B); with the loop it is a
    two-term mixture over whether vertex 1 is in V. Mean B^2/n = 2B^2/(N - 1)
    per nonzero target, which agrees with KN-FIND-007's conservation total
    C(2B + 1, 2) after removing the B multisets {P, -P} that sum to O.

    THE m = 3 STATEMENT, HEURISTIC AND BRACKETED. With R itself as generator
    (P = [j] R) a 3-decomposition is a 3-set of classes with
    e_1 j_1 + e_2 j_2 + e_3 j_3 = 1 (mod N): a 3-uniform hypergraph H_R on
    the n classes with Theta(n^2) hyperedges. No closed form for
    P[V contains no hyperedge] is claimed. Janson's inequality gives the
    rigorous two-sided bracket exp(-mu_3/(1 - p_max)) <= P[none]
    <= exp(-mu_3 + Delta_3/2), where mu_3 = E[# hyperedges inside V] is
    exact from conservation and Delta_3 is the sum over pairs of hyperedges
    sharing a vertex; the heuristic content (HEUR-1) is that the Poisson
    value e^{-mu_3} is the truth to within the bracket's width, which is
    O(B^2/n) relative at the ladder cells.

    WHAT THE CLAIM CHANGES. The frozen protocol pins a REPORTED curve
    (HEUR-SEMAEV-2015-4.3) and measures residuals against it. Theorem 2
    says the random-base reference at m = 2 is a theorem, so the residual
    metric has an exact null with zero free parameters, and the only
    quantity a measured cell can carry is the deviation of the SPECIFIC
    sealed base from the random-base law -- the collision deficit of
    IDEA-20260805-a25f11 -- with its own exact null variance available from
    the runs law. A random-base arm whose average over bases departs from
    the closed form refutes Theorem 2 or the sampler, and either is decisive.

  mechanism: >-
    DERIVED IN-RECORD; every step is elementary and checkable by hand.
    (1) Prime order forces the x-fibres to be exactly {P, -P} and R/2 to
    exist. (2) Writing every point as [j] R' turns the sign-free condition
    P_1 + P_2 = R into e_1 j_1 + e_2 j_2 = 2 mod N, a linear condition on
    labels, so the incidence structure is a Cayley-type graph on Z/N
    modulo negation: the quotient of the N-cycle Cay(Z/N, {+-2}) by the
    reflection j -> -j, with the vertex 0 (the point O) deleted. The quotient
    of a cycle by a reflection through a vertex is a path; deleting the
    reflected vertex 0 leaves a path whose ends are the fixed class 1 (loop:
    2 = 1 + 1) and the class 2 (its other neighbour was 0). (3) Counting
    independent sets of a path is the Fibonacci-type identity
    C(n' - B + 1, B). (4) Uniformity of V over B-subsets of x-classes is the
    protocol's own sampler model; nothing about the curve enters after (1).
    The theorem is therefore a statement about the additive group Z/N seen
    through the 2-to-1 map to x-classes, and IDEA-20260807-0ff796's
    isomorphism E -> C_R is its geometric form; here it is used for the
    minimum (does any decomposition exist), which the mean of 0ff796 and
    KN-FIND-007 does not determine.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb INDEX WAS EMPTY THIS SESSION (':memory:', verified by
      the orchestrator); search_knowledge was NOT called. Screening by
      direct reads of the task context, the 17 RQ-RELN-001 proposal
      summaries, the claim sections of H-RELN-66c079, H-RELN-96e3ba,
      H-RELN-a44c18, H-RELN-f697be, IDEA-20260805-a25f11,
      IDEA-20260805-96cb3d, IDEA-20260807-0ff796, IDEA-20260830-21e7c4,
      IDEA-20260815-c13ef4, KN-FIND-007, KN-TECH-002, the frozen protocol
      (lines 1-420), and ripgrep over ledger/proposals and knowledge/ for
      'independent set', 'path graph', 'x(R/2)', 'halving', 'Hamiltonian
      path' (53 proposal files, all inspected by title where the count
      exceeded 5; none concerns decomposition incidence). No external
      source was opened for this record; no web search was run for it.
    results: >-
      0ff796 proves C_R is isomorphic to E and uses the point count for the
      MEAN yield; a25f11 and H-RELN-66c079 derive the ceiling and threshold
      from conservation; 96e3ba/5ac0a2 correct the reported mean by 2^m;
      21e7c4 computes coverage exactly per fixed base; 4ddd8c gives the
      random-base collision ratio under a random-mapping model. No record
      identifies the incidence structure as a path, states the exact
      independent-set law for P[decomposes], or observes that the random-
      base coverage is a closed-form function of (N, B) alone.
    verdict: >-
      UNVERIFIED. The combinatorics (quotient of a cycle by a reflection,
      independent sets of a path, runs distribution, Janson's inequality)
      are classical and recalled; their application to prime-field Semaev
      2-decomposition is claimed new to this program only. A referee with
      retrieval should check the additive-combinatorics literature on sums
      of two elements of a random subset of Z/N modulo sign.

