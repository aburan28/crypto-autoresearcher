  assumptions:
    - N = #E(F_p) prime and odd; curves of even order are outside the theorem (2-torsion collapses x-fibres) and the record does not apply to them.
    - The protocol's factor base is a uniformly random B-subset of on-curve x-classes for the RANDOM arm; designed arms are measured against the theorem, not assumed to obey it.
    - Toy scale 8-16 bit p per the frozen protocol; the theorem is scale-free but every measurement is toy-tier.
    - The certificate convention on repeated points ({R', R'}) is declared per cell; both forms of Theorem 2 are provided.

  proof_search_map:
    bottleneck: >-
      Lemma 1's boundary bookkeeping (loop at 1, exclusion of 0, the join at
      the top) and the claim that each adjacency carries exactly one signed
      multiset. If either fails the graph is not a simple path and the
      independent-set count changes.
    baseline_embedding:
      parameter_slice: >-
        B = 1: the law gives P = 1 - C(n - 1, 1)/C(n, 1) = 1/n, i.e. R
        decomposes over a single class iff that class is x(R/2). B = n: P = 1.
        Both must reproduce exactly. The asymptotic slice recovers
        1 - e^{-2B^2/N}, the H-RELN-96e3ba corrected mean.
      reproduction_check: >-
        Frozen fixture: N = 4099-class prime-order toy curve from
        harness/toycurve.py; enumerate all 2-decompositions of 50 random R
        over 200 random V at B in {4, 6, 8, 12}; compare the empirical
        fraction to the closed form; exact integer arithmetic for the
        binomials.
    observation_collision:
      observable: The path structure of G_R and the count 1 - C(n - B, B)/C(n, B).
      distinct_preimage_search: >-
        Two different curves of the same prime order N, and two different
        targets on one curve, MUST give the same law -- that collision is
        the theorem. The separating search is a NON-random base: the
        AP-in-logs base W = {+-[k]P : k <= B}, whose 2-sumset has at most
        4B + 1 elements and whose coverage therefore falls far below the
        law; if the instrument cannot separate that, it is void.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the algebraic relation locus by the incidence graph on
          labels j; decomposition existence becomes an independent-set
          question on a path.
        predicted_gain: Exact closed form for the minimum, where the locus only gave the mean.
      - transform: boundary_lift
        proposed_object: >-
          m = 3 hypergraph H_R with Janson bracket; the exact m = 2 law is the
          boundary case whose bracket collapses to equality.
        predicted_gain: Rigorous two-sided bounds for the protocol's m = 3 cells instead of a reported heuristic.
    quantifier_order: >-
      FOR ALL primes p, FOR ALL E/F_p with #E(F_p) = N an odd prime, FOR ALL
      R != O, FOR ALL B <= n: the probability over a uniformly random
      B-subset V of x-classes that R is a signed sum of two points with
      x-classes in V equals 1 - C(n - B, B)/C(n, B). Unconditional. The
      empirical claim is FOR ALL tested cells the random-arm average lies
      within Monte Carlo error of that value.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At m = 2 the random-base decomposition probability on prime-order
        prime-field curves is a closed-form function of (N, B) with no
        curve, target or heuristic dependence, and every designed base is
        to be reported as a deviation from it.' It certifies nothing about
        m >= 3 beyond the Janson bracket, nothing about solve cost, and
        nothing about crypto scale.
      nearby_object_control: >-
        Where the conclusion FAILS by construction: (i) curves of even
        order (x-fibres of size 1 at 2-torsion, the graph acquires degree-1
        vertices in the interior); (ii) a base that is not uniform over
        classes (the AP-in-logs base); (iii) m = 3 (hypergraph, no path
        structure). All three are run as controls.
    proof_obligations:
      - claim: Lemma 1 adjacency and the one-multiset-per-edge count.
        responsibility: correctness
      - claim: G_R is a single path with one loop and n - 1 edges.
        responsibility: correctness
      - claim: Independent B-sets of a path on n' vertices number C(n' - B + 1, B).
        responsibility: baseline
      - claim: Total ordered solutions 2(n - 1) + 1 = N - 2 matches 0ff796.
        responsibility: interface
      - claim: Janson bracket width at m = 3 is O(B^2/n) relative at ladder cells.
        responsibility: size
      - claim: Every number is scoped to prime-order toy curves and the declared certificate convention.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The incidence graph G_R on x-classes (vertices = classes, edges =
      sign-free 2-decompositions of R), and the induced subgraph G_R[V].
    established_families_off_limits: >-
      Off-limits as the primary lens: factor-base geometry for mean yield
      (KN-FIND-007); Groebner/solving-degree instrumentation; the relation
      locus as an algebraic curve (0ff796 owns it); collision-deficit
      ceilings (a25f11); reference-curve audits by mean (96e3ba/5ac0a2).
    lossiness: >-
      GENUINELY LOSSY: the projection (E, R, V) -> G_R[V] forgets the curve
      equation, the coordinates, the target and the logs, retaining only
      which classes are adjacent under the ONE operation 'complete to R'.
      Under that operation set (translation by R composed with negation,
      i.e. the involution P -> R - P) the object propagates exactly: the
      involution acts on the path as the identity on edges. It does NOT
      propagate under translation by an arbitrary element (which changes R
      and hence the labelling), consistent with IDEA-20260806-c5d183: the
      object is a partial-action object for the operation set {P -> R - P,
      P -> -P}. The fibre over a given G_R[V] is every (curve, R) of order
      N with the same label set, so it is not a change of coordinates.
    propagation: >-
      Exact under the involution P -> R - P and under negation; changes
      under replacing R (relabelling j -> j c^{-1}), which is why the law is
      R-independent but the graph is not R-invariant.
    survival_score: >-
      Survives every prime-order curve at m = 2; dies at m = 3 (hypergraph)
      and on even-order curves; the honest score is 'exact where it
      applies, bracketed one step beyond'.

  null_object_control: >-
    NULL-A, BLOCKING, MATCHED: the abstract group Z/N with a uniformly
    random B-subset of {1, ..., n} as 'classes' and the same path rule --
    no curve at all. Its empirical law must coincide with the closed form
    to Monte Carlo precision and with the curve arm exactly in distribution.
    NULL-B: a second curve of the SAME prime order N (found by scanning
    (a, b) at 8-12 bits) -- the theorem predicts bit-identical laws.
    PLANTED POSITIVE CONTROL, BLOCKING: the AP-in-logs base
    W = {+-[k]P : 1 <= k <= B} (x-classes of [k]P), whose 2-sumset has at
    most 4B + 1 elements; its coverage is at most (4B + 1)/N, below the
    random law by a factor of about B/2 at ladder cells (e.g. 0.008 vs
    0.031 at N = 4099, B = 8). The instrument must report this deviation.
    DECAY PARAMETER q: fraction of the AP base replaced by uniformly random
    classes, q in {0, 0.25, 0.5, 0.75, 1}; the coverage must rise
    monotonically toward the closed form and equal it (within error) at
    q = 1. A coverage flat in q is the artifact tell of
    docs/inventor-protocol.md section 3 and voids the arm.
    ORDERING CONTROL: the closed-form table for every ladder cell is written
    and hashed before any enumeration is read.

  discriminated_from:
    - >-
      IDEA-20260807-0ff796 -- NEAREST RECORD. It proves the relation locus
      C_R is isomorphic to E and derives the class-invariant MEAN yield.
      EXACT DELTA: this record reads the same object as an incidence graph
      on x-classes, proves it is a path, and obtains the exact law of the
      MINIMUM (existence) for random bases, which the mean does not
      determine; 0ff796's point count N - 2 is reproduced as 2(n - 1) + 1.
    - >-
      H-RELN-96e3ba / IDEA-20260805-5ac0a2. They correct the reported
      reference by the factor 2^m in the MEAN. Delta: an exact finite-N law
      for the probability itself, of which their correction is the leading
      asymptotic term (Corollary 2b), and a forced value per cell
      (Corollary 2c) rather than a forced residual sign.
    - >-
      IDEA-20260805-a25f11 / H-RELN-66c079. Ceiling and threshold on the
      collision deficit for ANY base. Delta: the exact expectation and
      distribution of the deficit for the RANDOM base, i.e. the null the
      deficit is measured against; the ceiling is untouched.
    - >-
      IDEA-20260830-21e7c4. Exact enumeration of coverage for a FIXED base.
      Delta: the exact expectation over bases, computable with no
      enumeration at all; 21e7c4's instrument is this record's validation
      route, not its content.
    - >-
      IDEA-20260805-4ddd8c. Random-mapping collision ratio Xi = 1 - 1/M for
      a random base. Delta: no random-mapping model is assumed here; the
      law is exact combinatorics on a path and its Poisson limit is a
      corollary, not a premise.
    - >-
      IDEA-20260830-d2ebb5. Certifies each negative. Delta: this record
      predicts the negative RATE exactly for the random arm, giving d2ebb5's
      certificates an expected count to be checked against.

  predictions:
    - metric: M1 -- baseline slices B = 1 and B = n on every curve
      direction: different
      minimum_effect: FORCED, exact rational 1/n and 1; any deviation voids the implementation.
    - metric: >-
        M2 -- random-arm average coverage over 200 random bases per cell,
        all default m = 2 ladder cells at 8, 10, 12, 16 bits, versus
        1 - C(n - B, B)/C(n, B)
      direction: different
      minimum_effect: >-
        PREDICTED EQUALITY within 3 Monte Carlo standard errors on every
        cell (the SE of the mean over 200 bases at coverage 0.03 is about
        0.002). Any cell outside 4 SE, replicated on a second seed, refutes
        Theorem 2 or the sampler and is the headline either way.
    - metric: M3 -- residual of the protocol's reported curve HEUR-SEMAEV-2015-4.3 against the exact law, per cell
      direction: different
      minimum_effect: >-
        Forced ratio exact/reported tending to 2^m = 4 at small B (0.0308
        vs 0.0078 at N = 4099, B = 8), consistent with H-RELN-96e3ba;
        stated here as a computed table, not a measurement.
    - metric: M4 -- histogram of c(R) over random bases versus the runs law of Corollary 2d
      direction: different
      minimum_effect: >-
        Chi-square against the closed form not rejected at 1 percent on
        cells with expected counts >= 5 in three bins; rejection at a
        replicated cell refutes Corollary 2d.
    - metric: M5 -- planted AP-in-logs base coverage and its q-decay
      direction: lower
      minimum_effect: >-
        At q = 0 coverage <= (4B + 1)/N, at least a factor 3 below the law
        at every cell with B >= 8; monotone rise in q with equality at q = 1
        within 3 SE. Otherwise the instrument is blind to structure.
    - metric: M6 -- m = 3 cells against the Janson bracket
      direction: different
      minimum_effect: >-
        Empirical P[no decomposition] inside [exp(-mu_3/(1 - p_max)),
        exp(-mu_3 + Delta_3/2)] on every cell; a value outside the bracket
        replicated across seeds refutes HEUR-1 as stated.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify Lemma 1 and Theorem 1
      symbolically and by exhaustive check on three prime-order curves at
      8 bits (list all 2-decompositions of every R; confirm the incidence
      graph is a path with the stated ends). STAGE 1 (seconds): compute the
      closed-form table for every ladder cell in both certificate
      conventions; hash it. STAGE 2 (minutes): M1 slices and NULL-A on Z/N.
      STAGE 3 (minutes to an hour, pure Python on harness/toycurve.py with
      exact sumset enumeration as in IDEA-20260830-21e7c4): 200 random bases
      per cell, 8-16 bits, m = 2; NULL-B same-order curves at 8-12 bits;
      planted AP arm with its q ladder; m = 3 cells at 8-12 bits against the
      Janson bracket. STAGE 4 (zero compute): apply the pre-registered
      tolerances. CHEAPEST VALID DISCRIMINATOR: Stage 0's exhaustive path
      check at 8 bits plus Stage 3 at one cell (N about 4099, B = 8) -- it
      costs minutes and decides Theorem 2 outright; if the path check fails
      nothing else is worth running.
    controls:
      - NULL-A abstract Z/N path model with no curve (blocking; must match the closed form and the curve arm in distribution).
      - NULL-B second prime-order curve with identical N (blocking; laws must coincide).
      - Matched random factor base of the same size at the same p is the arm under test; designed bases are compared to it.
      - Planted AP-in-logs base with q-decay ladder (blocking; must fall below the law and recover at q = 1).
      - Even-order curve arm as the nearby object where the theorem does not apply (reported, never fitted).
      - Mandatory Pareto rows on one instance per p, Pollard rho with negation (0.886 sqrt(N)) and BSGS (sqrt(N) time and memory), in group operations, as controls only.
    required_metrics:
      - closed-form value per cell in both certificate conventions, hashed before any run
      - random-arm mean coverage, SE, and z-score versus the closed form per cell and seed
      - c(R) histogram per cell versus the runs law with chi-square statistic
      - planted-arm coverage along the q ladder with monotonicity verdict
      - m = 3 empirical P[none] with mu_3, Delta_3 and the bracket per cell
      - sha256 of every factor base and target list; seeds and derivation rule
      - matched rho and BSGS operation counts and BSGS memory

  falsification_conditions:
    - F1. Stage 0 finds G_R not a single path with a loop at x(R/2) and end at x(R) on any prime-order curve. Theorem 1 is false; the record is superseded.
    - F2. M1 slices fail. Implementation fault; nothing is read.
