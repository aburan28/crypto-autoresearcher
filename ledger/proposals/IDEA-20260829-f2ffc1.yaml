  assumptions:
    - >-
      The SHA-1 expansion recurrence is as recalled and the word width is 32.
      If the width were not a power of two the chain-ring claim C1 fails
      outright, which is why the SHA-0/width control below is not decorative.
    - >-
      "Disturbance vector" is taken to mean a codeword of the expansion code,
      per RQ-DIFFP-a5c483's own scope text. If the published families use a
      different ambient code -- for instance the sum of the expansion code and
      a code describing the step function, which one retrieved title suggests
      -- then the object counted here is a SUPERSET or a DIFFERENT SET, and
      every number below is scoped to the expansion code alone.
    - >-
      Bit-rotation and step-shift are the two equivalence generators relevant
      on the SHA-1 side, per the RQ's declared relation. Whether the committed
      adjudicator's generators E1..E5 implement exactly these is NOT assumed
      and is a read-off task, not a claim.

  proof_search_map:
    bottleneck: >-
      Computing the number of equivalence classes of the SHA-1 disturbance-
      vector space. By enumeration this is 2^512 wide and no covering fraction
      can be stated at all; that missing denominator is why goal completion
      criterion 2 has stood untouched for four batches.
    baseline_embedding:
      parameter_slice: >-
        Set the word width w = 32 and the module rank r = 16 in the general
        formula orbits(r, w) = (1/w) * sum over j = 0..w-1 of
        2^(r * 2^(v_2(j))) with the j = 0 term read as 2^(r*w). The baseline
        this must reproduce is BRUTE-FORCE ORBIT COUNTING BY UNION-FIND over
        the fully enumerated module, which is only executable at small (r, w).
      reproduction_check: >-
        Frozen fixture: for every (r, w) with w in {2, 4, 8}, r in {1, 2, 3}
        and r*w <= 20, enumerate all 2^(r*w) module elements, orbit-count by
        union-find under multiplication by x, and require EXACT agreement with
        the formula. Any single disagreement falsifies C2 as stated. Also
        require that every one of the w summands divides w exactly after the
        Burnside division, since a wrong dimension formula generically breaks
        integrality.
    observation_collision:
      observable: >-
        The canonical form of a codeword under the rotation group, taken as
        the lexicographic minimum of its 32 rotation images, together with the
        (x+1)-adic valuation profile of its sixteen coordinates.
      distinct_preimage_search: >-
        TWO-SIDED AND BOTH CHEAP. (i) TOO COARSE: search for two codewords with
        equal canonical form that are NOT related by any group element --
        impossible by construction for the rotation group alone, so the real
        target is the extended group including step-shift, where the search is
        over pairs sharing a canonical form and differing in a
        group-INVARIANT quantity. Any such pair falsifies the canonical form.
        (ii) TOO FINE: apply a random group word to a random codeword and
        require identical canonical forms; any mismatch falsifies the
        canonicalisation implementation. Run both at 10^5 draws with declared
        seeds.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The free rank-16 module over the chain ring GF(2)[x]/((x+1)^32),
          replacing the [2560, 512] binary code.
        predicted_gain: >-
          Orbit counting moves from 2^512 enumeration to a closed-form sum of
          six terms; canonical form moves from search to 32 ring
          multiplications; the equivalence group moves from "declared" to
          "finite of computed order".
      - transform: stronger_invariant
        proposed_object: >-
          The (x+1)-adic valuation profile of the sixteen module coordinates,
          which is invariant under multiplication by any unit and therefore
          under every rotation.
        predicted_gain: >-
          A group-invariant that certifies DISTINCTNESS of two codewords
          without any census and without running the adjudicator, feeding
          IDEA-20260829-9e6650's distinctness certificate.
    quantifier_order: >-
      "FOR ALL j in 1..31, the fixed submodule of rotation-power j has
      GF(2)-dimension exactly 16 * 2^(v_2(j))" -- a universally quantified
      statement over a set of size 31, verifiable EXHAUSTIVELY by rank
      computation, with no instance-dependent witness anywhere. The orbit
      count then follows by Burnside with no further quantifier. This is
      deliberately the easy quantifier shape; the hard existential ("THERE
      EXISTS a codeword outside every published orbit") is NOT claimed here
      and belongs to IDEA-20260829-ea385e.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact cardinality of the orbit space of the FULL expansion code
        under the declared group, and an exact canonical form for it. IT
        CANNOT CERTIFY ANYTHING ABOUT COST, because the orbit count of the
        full code is the denominator of a fraction nobody wants: the useful
        denominator is the orbit count of the COST-BOUNDED subset, and
        cost-bounded low-weight codeword enumeration remains an
        information-set-decoding problem that this representation does NOT
        make easier. THAT LIMIT IS STATED HERE RATHER THAN DISCOVERED LATER:
        an earlier version of this proposal claimed that low-cost vectors
        concentrate in high-valuation strata, and that claim is FALSE in the
        useful direction -- higher valuation means larger minimum weight, so
        sparse vectors live in the LOW-valuation stratum, which is the whole
        module. No search exponent is claimed.
      nearby_object_control: >-
        SHA-0, whose expansion omits the one-bit rotation. Then the recurrence
        is R-linear with x replaced by 1, the code decomposes as 32 INDEPENDENT
        copies of a length-80 binary code, its automorphism group contains all
        32! column permutations, and the closed form of C2 must NOT apply.
        An implementation that returns the same orbit structure for SHA-0 and
        SHA-1 has not captured the load-bearing structure and its numbers mean
        less than they appear to. A SECOND nearby object: word width 24, not a
        power of two, where x^24 + 1 factors nontrivially, R is NOT a chain
        ring, and the closed form must fail. Both are cheap and both are
        required.
    proof_obligations:
      - claim: >-
          PO-0. The SHA-1 expansion recurrence and word width are read from
          FIPS 180-4 primary text and pinned in the repository before any
          number is computed.
        responsibility: baseline
      - claim: >-
          PO-1. x^32 + 1 = (x + 1)^32 over GF(2), verified symbolically.
        responsibility: correctness
      - claim: >-
          PO-2. The coordinate map C -> R^16 is an R-module isomorphism, i.e.
          the recurrence is invertible in the backward direction, which needs
          x to be a unit of R.
        responsibility: correctness
      - claim: >-
          PO-3. dim_GF(2) of ann_R((x+1)^k) equals k, and
          gcd(x^j + 1, x^32 + 1) = (x + 1)^(2^(v_2(j))).
        responsibility: size
      - claim: >-
          PO-4. Burnside applies (the group is finite and acts on a finite
          set) and the resulting sum is an integer.
        responsibility: correctness
      - claim: >-
          PO-5. ord(T) is computed, not bounded, and the exponent e is
          determined by explicit squaring rather than asserted to be at most 5.
        responsibility: runtime
      - claim: >-
          PO-6. Every number is scoped to the expansion code, to width 32, and
          to the group actually implemented; no transfer to Manuel's ambient
          code or cost function is claimed until that paper is read.
        responsibility: scope

  predictions:
    - metric: >-
        toy_formula_agreement_fraction (fraction of (rank, width) toy
        instances where brute-force union-find orbit count equals the closed
        form)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0 over all toy instances with r*w <= 20, w in {2,4,8}. Any
        value below 1.0 falsifies C2. This is a two-sided known answer: the
        brute-force count is ground truth computed by different code.
    - metric: >-
        burnside_integrality (number of the 32 Burnside summands that fail to
        leave an integer after division by 32)
      direction: lower
      minimum_effect: exactly 0
    - metric: >-
        sha0_orbit_count_ratio (SHA-0 orbit count divided by the SHA-1 closed
        form at matched toy parameters)
      direction: different
      minimum_effect: >-
        differs from 1 by at least a factor of 2 at every toy width tested. If
        SHA-0 and SHA-1 give the SAME orbit structure at matched parameters,
        the instrument is not reading the rotation and the result is void.
    - metric: nonpower_of_two_width_formula_failure (boolean, at width 24)
      direction: different
      minimum_effect: >-
        the closed form must MISPREDICT at width 24. A formula that happens to
        be right where its hypothesis fails is measuring something other than
        the chain-ring structure.
    - metric: step_shift_order_ord_T
      direction: different
      minimum_effect: >-
        a single finite integer, reported with its factorisation as
        ord(T mod m) * 2^e and with e measured. Reporting a bound instead of a
        value does not discharge this.
    - metric: canonical_form_wall_clock_per_codeword_microseconds
      direction: lower
      minimum_effect: >-
        below 100 microseconds, versus "not computable" for any
        enumeration-based canonicalisation of a 2^512 space.

  minimal_test:
    design: >-
      A SINGLE ZERO-CHARGED-COMPUTE-CLASS TASK, entirely symbolic and
      small-scale, in four stages. STAGE 0 pins the recurrence and width from
      FIPS 180-4 primary text (PO-0) and records the pin. STAGE 1 implements R
      as GF(2)[x]/(x^32+1) with polynomial arithmetic, verifies PO-1..PO-4
      symbolically, and emits the closed-form orbit count together with the
      per-j fixed-dimension table. STAGE 2 runs the toy positive control: for
      every (rank, width) with rank*width <= 20 and width in {2,4,8},
      enumerate the module exhaustively, orbit-count by union-find under
      multiplication by x, and compare against the formula instantiated at
      that (rank, width). STAGE 3 runs the two nearby-object controls, SHA-0
      (rotation removed) and width 24 (chain-ring hypothesis removed), and
      requires the formula to MISPREDICT on both at matched toy parameters.
      STAGE 4 computes ord(T mod m) as the order of y modulo the reduced
      characteristic polynomial and then determines e by at most five
      squarings over R, reporting ord(T) with its factorisation. Every stage
      emits its table as JSON with unmeasured cells written as null, never as
      integer 0 (KN-TECH-6785f2 section 3).
    controls:
      - >-
        POSITIVE CONTROL, AND IT IS THE ONE THAT MAKES THE NEGATIVES
        MEANINGFUL: brute-force union-find orbit counts at toy (rank, width)
        are GROUND TRUTH computed by a different algorithm, and the formula
        must reproduce them exactly. AN INSTRUMENT NEVER SHOWN TO FIRE CANNOT
        CERTIFY A NEGATIVE, and this is where it fires.
      - >-
        NEARBY-OBJECT CONTROL 1 (SHA-0): the rotation is removed, the code
        decomposes, and the closed form must FAIL. Agreement is a falsifier of
        the instrument, not a confirmation of the theory.
      - >-
        NEARBY-OBJECT CONTROL 2 (width 24): the chain-ring hypothesis is
        removed and the closed form must FAIL.
      - >-
        NULL OBJECT: a RANDOM rank-16 R-submodule that is not the expansion
        code, and a random 512-dimensional binary subspace of the same ambient
        dimension with NO rotation invariance. The first must satisfy C2 (the
        formula depends only on freeness and rank, not on the recurrence); the
        second must NOT. Reporting the same orbit count for both means the
        pipeline is not reading its input.
      - >-
        IMPLEMENTATION INDEPENDENCE: the fixed-point dimensions are obtained
        BOTH by the closed form and by an independent GF(2) rank computation on
        the 512-by-512 matrix of (x^j + 1), and both must agree for all 31 j.
      - >-
        INTEGRALITY CHECK on all 32 Burnside summands, reported per summand and
        never as an aggregate pass.
    required_metrics:
      - toy_formula_agreement_fraction, reported per (rank, width) cell
      - per_j_fixed_dimension_table (31 rows, closed form and rank computation)
      - burnside_integrality (per summand)
      - closed_form_orbit_count (exact integer, with its six-term decomposition)
      - sha0_orbit_count_ratio at matched toy parameters
      - width24_formula_failure (boolean plus the two disagreeing integers)
      - step_shift_order_ord_T with factorisation ord(T mod m) and e
      - canonical_form_wall_clock_per_codeword_microseconds
      - null_object_orbit_counts (both null objects, reported separately)

  falsification_conditions:
    - >-
      ANY toy (rank, width) instance where brute-force union-find disagrees
      with the closed form. C2 is then false as stated and the record is
      superseded rather than patched.
    - >-
      x^32 + 1 does not equal (x + 1)^32 over GF(2) under symbolic check, or
      the coordinate map is not invertible: C1 fails and everything downstream
      with it.
    - >-
      Any of the 31 per-j fixed dimensions computed by GF(2) rank disagrees
      with 16 * 2^(v_2(j)).
    - >-
      Any Burnside summand fails to divide by 32.
    - >-
      The closed form SUCCEEDS at width 24 or on SHA-0 at matched toy
      parameters: the formula is then not detecting the structure it claims to
      detect, and the whole representation claim is void even if the SHA-1
      number happens to be right.
    - >-
      The step-shift companion matrix has no finite order in GL_16(R) under
      direct computation, or its measured order exceeds
      ord(T mod m) * 2^5: C3 is false.
    - >-
      FIPS 180-4 primary text, once read, gives a different recurrence or word
      width. Every number in this record is then scoped to a primitive that
      is not SHA-1 and must be withdrawn, not reinterpreted.

  confounders:
    - >-
      ENDIANNESS AND BIT-ORDER CONVENTION. Identifying bit k of a word with
      x^k versus x^(31-k) changes multiplication by x from a left rotation to a
      right rotation. The group is the same, so the ORBIT COUNT is unaffected,
      but the CANONICAL FORM and every reported representative are convention-
      dependent. The convention must be declared once and carried into every
      emitted artifact, or two later readers will disagree about which
      codeword a canonical form names.
    - >-
      TRUNCATION AT 80 STEPS. The rotation action is exact on the truncated
      code, but STEP-SHIFT is naturally an action on the bi-infinite solution
      space and only induces a map on an 80-step window through the
      coordinate isomorphism. If the committed adjudicator implements
      step-shift as a literal array shift with zero fill instead, it is
      implementing a DIFFERENT map that need not preserve the code -- which is
      a candidate mechanical explanation for this campaign's measured finding
      that two verified generators emit no orbit image at all. That is a
      HYPOTHESIS ABOUT AN ARTIFACT THIS SESSION DID NOT READ, and it is
      recorded as a read-off task, not as a finding.
    - >-
      CONFLATING THE CODE WITH THE DISTURBANCE-VECTOR SPACE. One retrieved
      title suggests the relevant object may be the sum of the expansion code
      and a code describing the step function. If so, the counted object is
      not the object the literature counts, and the covering fraction built on
      it would have the wrong denominator for a reason that no control here
      can detect. THIS IS THE LARGEST INTERPRETATION RISK IN THE RECORD and it
      is discharged only by acquisition.
    - >-
      A toy control that is too small. At rank 1 the module is R itself and
      several distinctions collapse; the toy grid must include at least one
      instance with rank at least 2 and width at least 4, and the per-cell
      table must show it.

  interpretation_limits:
    - >-
      THIS IS A DENOMINATOR, NOT A COVERING FRACTION. The orbit count of the
      full code says nothing about how much of it is cost-feasible, and the
      cost-bounded orbit count -- the number anyone actually wants -- is NOT
      delivered here and is not made easier by this representation.
    - >-
      NO PATH IS CLAIMED NEW, no attack is claimed, no cost is claimed, and no
      statement is made about any deployed system. The claim tier ceiling is
      `analyzed`, per GOAL-DIFFP-84d641's standing ceiling.
    - >-
      Scoped to SHA-1's expansion code as recalled, width 32, the rotation and
      step-shift generators only, and the toy parameters actually run. SHA-0
      and width 24 appear ONLY as controls and no result about either is
      claimed.
    - >-
      The retrieved bibliography establishes that a coding-theoretic framing is
      published. Whether the chain-ring refinement, the closed-form orbit count
      or the order of T is already in that literature is UNKNOWN, because no
      paper was opened. `novelty_status: unverified` is the honest label and
      not a weakness of the design.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The 80-step truncation does not destroy the module structure: the map
        sending a codeword to its first sixteen words is a bijection onto
        R^16, because the recurrence can be run backwards using the inverse of
        the unit x. Formally, C is a free R-module of rank 16 and the
        truncation to 80 steps is a choice of window on a bi-infinite free
        module of the same rank.
      rigorous_support: >-
        Not a distributional heuristic but a STRUCTURAL claim that is provable
        outright, and it is listed here because the campaign's discipline is
        that a load-bearing assumption is named even when it is provable. The
        rigorous support is that x is a unit in R (since x * x^31 = x^32 = 1)
        and that a linear recurrence over a commutative ring with invertible
        leading and trailing coefficients is bijective on windows of length at
        least the order.
      validation_plan: >-
        Verify by explicit computation, not by argument: draw 10^4 random
        elements of R^16 under declared seeds, expand forward to 80 words,
        truncate back to the first 16, and require the identity map; then
        expand BACKWARD 16 steps from words 64..79 and require the same
        codeword. Tail check: repeat at widths 2, 4, 8, 16, 24, 32 and confirm
        the round-trip succeeds at every width (this is about invertibility,
        not about the chain-ring property, so it must succeed at width 24 too
        -- a control that fails there would indicate a coding bug rather than
        a mathematical fact).
    - id: H2
      statement: >-
        The equivalence group relevant to SHA-1 disturbance vectors is
        generated by bit-rotation (multiplication by x, order 32) and
        step-shift (the companion matrix T in GL_16(R)), and it is FINITE of
        order dividing 32 * ord(T). The classical distribution statement it
        imitates is the standard assumption that a code's relevant symmetry
        group is its declared automorphism group and that orbit counts under
        that group are the right coarse-graining -- an assumption which, for
        cost claims, IDEA-20260829-ea385e is specifically designed to attack.
      rigorous_support: >-
        Rotation has order exactly 32 in R^x. T lies in GL_16(R), a finite
        group, so T has finite order; the reduction GL_16(R) -> GL_16(GF(2))
        has kernel a 2-group of exponent dividing 32, bounding e by 5.
      validation_plan: >-
        Compute ord(T) directly by iterated multiplication with early exit,
        and independently by computing ord(T mod m) from the factorisation of
        y^16 + y^13 + y^8 + y^2 + 1 over GF(2) and then testing
        T^(ord(T mod m) * 2^e) = I for e = 0..5. The two routes must agree.
        Tail check: the same computation on SHA-0's companion matrix, where the
        reduction is the identity and e must come out 0; if e is nonzero on
        SHA-0 the implementation is wrong. Record the sampled parameters
        (width 32, rank 16) and state explicitly that no transfer to any other
        width is claimed.
    - id: H3
      statement: >-
        Whatever the published disturbance-vector families are, they are
        CLOSED under the group of H2, so the published census occupies a whole
        number of orbits and the covering fraction is well defined. This
        imitates the classical practice of quoting a differential
        characteristic up to rotation and step offset.
      rigorous_support: >-
        NONE AVAILABLE IN THIS PROGRAM. A search-engine summary asserts a
        two-type classification indexed in a way consistent with this, but no
        primary source has been opened. THIS IS THE WEAKEST ASSUMPTION IN THE
        RECORD and it is the only one whose failure would make the covering
        fraction meaningless rather than merely mis-scoped.
      validation_plan: >-
        Cannot be validated without acquisition, and that is stated rather than
        finessed. The concrete route: obtain Manuel 2008/469 or the DCC version
        under whatever acquisition tier the coordinator authorises, read the
        family parameterisation from primary text, implement it as a generator,
        and check closure by applying every group generator to 10^3 generated
        family members and testing membership in the family image. UNTIL THEN,
        every covering statement is reported CONDITIONAL ON H3 with H3 marked
        unvalidated, and the denominator computed here stands on its own
        because it does not use H3 at all.

  target_complexity:
    time_exponent: >-
      Orbit count: O(1) arithmetic on six big integers after 31 GF(2) rank
      computations on 512-by-512 matrices, about 2^27 bit operations, call it
      seconds. Canonical form per codeword: 32 ring multiplications, about
      2^13 bit operations. Toy controls: sum over the grid of 2^(r*w) with
      r*w <= 20, so at most about 2^21 module elements enumerated in total.
      Order of T: at most ord(T mod m) matrix multiplications of 16-by-16
      matrices over a 2^32-element ring, bounded by a few million ring
      operations.
    memory_exponent: >-
      Dominated by the largest toy enumeration, 2^20 module elements times a
      few words, under 100 MB. The 512-by-512 GF(2) matrices are 32 KB each.
      No large-memory regime and therefore no time-memory tradeoff to state.
    best_known: >-
      For the ORBIT COUNT of this space there is no known method in this
      program other than enumeration of 2^512 codewords, i.e. infeasible; the
      quantity has never been computed here. In the literature the position is
      UNKNOWN because no primary source was opened, and a retrieved title
      indicates that coding-theoretic analysis of this code is published, so a
      published orbit count or an equivalent statement may well exist. For
      LOW-COST codeword enumeration -- a different quantity this record
      explicitly does NOT address -- a retrieved search summary indicates an
      exhaustive search was already published in 2008/2011, which would
      dominate any enumeration claim made here.
    hidden_overhead: >-
      There is no asymptotic parameter and therefore no o(1) to hide anything
      in. What the six-term closed form DOES hide is stated plainly: it is a
      count of the FULL code's orbits, which is 2^507-scale and therefore
      dominated by orbits of cost-infeasible vectors that no attack could ever
      use. The number is exact and nearly useless on its own; it becomes
      useful only as the denominator of a cost-bounded fraction that a
      successor must supply.
    tradeoff_note: >-
      Not applicable at this scale; the whole computation is small and
      single-threaded. Parallelization would matter only for a cost-bounded
      enumeration, which is out of scope here and is where the real cost lies.

  dominated_by: >-
    PARETO CHECK, ROW BY ROW, ACROSS TIME, MEMORY AND DATA. (1) Against
    enumeration of the SHA-1 expansion code to count orbits: NOT dominated --
    2^512 time versus about 2^27, same memory, no data. (2) Against this
    program's committed adjudicator (KN-TECH-6785f2): NOT dominated and not
    comparable -- the adjudicator decides membership against a census and
    computes no orbit count; this proposal computes a cardinality and decides
    no membership. (3) Against the retrieved-but-unopened Manuel classification
    and exhaustive DV search: POSSIBLY DOMINATED ON THE COST-BOUNDED QUESTION
    AND UNKNOWN ON THIS ONE. If that work already enumerated the cost-feasible
    DV space, then any successor that tries to enumerate it here is dominated
    outright; this record does not attempt that enumeration, and whether it
    also contains an orbit count of the full code cannot be known without
    opening it. (4) Against the retrieved-but-unopened coding-theory line
    (Pramstaller-Rechberger-Rijmen; Rijmen-Oswald; Jutla-Patthak): UNKNOWN,
    same reason. THIS FIELD IS NOT null AND THE UNKNOWNS ARE NAMED RATHER THAN
    ASSUMED AWAY; resolving rows (3) and (4) requires acquisition, which is a
    coordinator decision under AMD-20260824-DIFFP-ACQ-1 and not this record's
    to take.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THE ONLY BASELINE THIS PROGRAM ACTUALLY HOLDS: the
    orbit count of the SHA-1 disturbance-vector space is currently
    UNCOMPUTED and uncomputable here at 2^512 enumeration cost; this proposal
    computes it exactly in about 2^27 bit operations, a reduction of roughly
    485 binary orders of magnitude in the exponent, and delivers a canonical
    form at 2^13 bit operations per codeword. AGAINST THE LITERATURE: no delta
    is claimed, because no primary source was opened. NO CRYPTANALYTIC DELTA
    OF ANY KIND IS CLAIMED -- no attack, no cost, no path, and specifically NO
    improvement to low-cost disturbance-vector search, which this
    representation does not help and which a retrieved summary suggests was
    already done exhaustively in 2008.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high
