idea:
  id: IDEA-20260829-f2ffc1
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The SHA-1 disturbance-vector space is a FREE RANK-16 MODULE OVER THE CHAIN
    RING GF(2)[x]/((x+1)^32), and that structure gives the tiling question's
    denominator in CLOSED FORM instead of by enumeration: an exact orbit count
    under bit-rotation, an exact canonical form, and a decidable finite order
    for the step-shift generator
  class: representation

  claim: >-
    Let C be the SHA-1 linearized message-expansion code, i.e. the set of
    80-tuples of 32-bit words satisfying the SHA-1 expansion recurrence, from
    which disturbance vectors are drawn. Write R for the quotient ring
    GF(2)[x]/(x^32 + 1), identifying a 32-bit word with a polynomial and the
    left bit-rotation by one place with multiplication by x. THREE CLAIMS,
    EACH SEPARATELY FALSIFIABLE.
    (C1) STRUCTURE. Because 32 is a power of two and the characteristic is
    two, x^32 + 1 factors as (x + 1)^32, so R is a FINITE CHAIN RING with
    maximal ideal m = (x + 1) and nilpotency index 32. The map sending a
    codeword to its first sixteen words is an isomorphism of R-modules from C
    to R^16, so C is FREE OF RANK 16 over R, and the bit-rotation generator
    acts on C as multiplication by the unit x.
    (C2) EXACT ORBIT COUNT, CLOSED FORM, ZERO ENUMERATION. The number of
    orbits of C under the cyclic group of order 32 generated by bit-rotation
    is EXACTLY
    2^507 + 2^251 + 2^124 + 2^61 + 2^30 + 2^15.
    This follows from Burnside plus the identity that the fixed submodule of
    the j-th rotation power has GF(2)-dimension 16 * 2^(v(j)), where v(j) is
    the 2-adic valuation of j, which in turn follows from
    gcd(x^j + 1, x^32 + 1) = (x + 1)^(2^v(j)) and from the annihilator of
    (x + 1)^k in R being (x + 1)^(32 - k).
    (C3) THE STEP-SHIFT GENERATOR HAS FINITE, COMPUTABLE ORDER. The expansion
    recurrence is invertible in both step directions because x is a unit, so
    step-shift acts as an element T of GL_16(R). Its order is
    ord(T) = ord(T mod m) * 2^e with e at most 5, where ord(T mod m) is the
    multiplicative order of y modulo the GF(2) polynomial
    y^16 + y^13 + y^8 + y^2 + 1, and e is determined by at most five squarings.
    The full declared equivalence group on SHA-1 disturbance vectors is
    therefore a FINITE group of computable order, not an unbounded one.
    NOTHING HERE IS A CLAIM ABOUT MD5, ABOUT ANY ATTACK COST, OR ABOUT ANY
    PATH BEING NEW.

  mechanism: >-
    The program currently has no denominator for any covering or tiling
    statement about SHA-1 disturbance vectors, and the obvious route to one --
    enumerate the code and quotient by the declared equivalence -- is
    2^512 wide and therefore not a route at all. The mechanism replaces
    enumeration with representation.
    STEP 1. The expansion recurrence couples the 32 bit-columns only through a
    single one-bit rotation. Reading a 32-bit word as an element of
    R = GF(2)[x]/(x^32 + 1) turns that rotation into multiplication by x and
    turns the recurrence into an R-LINEAR recurrence of order 16. The code
    becomes a free R-module of rank 16, and the sixteen input words are its
    coordinates.
    STEP 2. In characteristic two with a length that is a power of two, the
    freshman's-dream identity x^(2^s) + 1 = (x + 1)^(2^s) makes R a chain ring:
    its only ideals are the powers of m = (x + 1), totally ordered. Every
    submodule question about C therefore reduces to a single integer, the
    (x + 1)-adic valuation, and every fixed-point computation Burnside needs
    becomes an annihilator computation with a closed-form dimension.
    STEP 3. Bit-rotation is multiplication by the unit x, which is UNIPOTENT
    (x = 1 + (x + 1)), so its fixed submodules are exactly the annihilator
    submodules, giving dimension 16 * 2^(v(j)) and hence the closed form in
    C2. The sum divides by 32 exactly -- each of the six terms is an integer
    after division -- which is a nontrivial internal consistency check that a
    wrong dimension formula would fail.
    STEP 4. Step-shift is the companion matrix of the recurrence over R.
    Reduction modulo m sends GL_16(R) onto GL_16(GF(2)) with a 2-group kernel
    of exponent dividing 32, which bounds the order of T as stated and makes
    it computable in seconds rather than assumed.
    THE PAYOFF IS SPECIFIC AND NARROW. It supplies (a) the exact size of the
    orbit space that any covering fraction is a fraction OF, (b) a canonical
    form computable in 32 ring operations rather than by search, and (c) a
    finite bound on the equivalence group, which the program has so far
    declared rather than measured.

