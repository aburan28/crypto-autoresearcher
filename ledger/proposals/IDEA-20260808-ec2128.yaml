idea:
  id: IDEA-20260808-ec2128
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: The k-tuple intersection system is MULTI-HOMOGENEOUS with multidegrees {2e_i} and
    {e_i + e_j} while the reconciliation system and MAYO's whipped forgery system are NOT
    -- so exactly one family of published estimates is applying a singly-graded semi-regular
    Hilbert series to a bigraded object, and the correction runs in the ATTACKER's favour
  class: measurement
  claim: 'PRECISELY WHICH SYSTEMS ARE BIGRADED, derived this session. (A) The k-tuple intersection
    system -- find (x_1..x_k) with P_a(x_i)=0 for all a,i and P''_a(x_i,x_j)=0 for all a and
    i<j -- IS multi-homogeneous with respect to the k-block variable split: each equation
    is homogeneous in every block separately, of multidegree 2e_i (the P_a(x_i) equations)
    or e_i+e_j (the polar equations). At k=2 it is bihomogeneous of bidegrees (2,0), (0,2),
    (1,1). (B) The reconciliation system {P_a(x)=0} is singly graded -- one block -- and gets
    NO correction. (C) MAYO''s whipped forgery system is NOT multi-homogeneous: each whipped
    equation is a SUM of terms of multidegrees 2e_i and e_i+e_j, so it is not homogeneous
    in any block separately, and it gets no correction either. Stating (B) and (C) is as important
    as stating (A), because it bounds what the correction can touch. THE CORRECTION, in two
    separable parts. (1) EXACT BLOCK-DIAGONALISATION, a CONSTANT factor. The degree-D Macaulay
    matrix of a multi-homogeneous system decomposes as a direct sum over multidegrees (d_1..d_k)
    with sum d_i = D, so the linear algebra costs max_block^omega rather than (sum of blocks)^omega.
    At RECALLED uov-Ip (n=112, k=2, D=6) the total column count binom(229,6) ~ 1.1e11 splits
    with a largest block ~5.9e10, a factor ~1.9 in size and ~3.6 in omega=2 cost. THIS IS
    A CONSTANT FACTOR and under this program''s own search heuristics it is LOW priority except
    as a building block, and it is labelled that way rather than dressed up. (2) SOLVING DEGREE,
    an EXPONENTIAL effect and the real claim. Because the ideal''s graded pieces are direct
    sums over multidegrees, the solving criterion can be met in a SINGLE multidegree component,
    and min over a set is at most any element of it -- so the multi-graded solving degree
    is <= the singly-graded semi-regular prediction. DIRECTION, STATED PLAINLY: this runs
    in the ATTACKER''s favour. If the published estimators use the singly-graded series, they
    OVERSTATE the attack cost and therefore OVERSTATE the security level, by the factor binom(N+D,D)^omega
    / binom(N+D'',D'')^omega where D'' <= D is the multi-graded degree. The competing effect
    -- fewer monomials are available inside a fixed multidegree, which can push a given component''s
    degree up -- is named, and it is why this is an experiment discriminating two models rather
    than an assertion.'
  mechanism: Multi-homogeneity is a grading, and a graded ideal's Hilbert function is a function
    of the full multidegree. A Macaulay matrix built at total degree D mixes multidegree blocks
    that never interact, so it is block-diagonal in a basis that respects the grading; and
    the solution is reachable as soon as one block carries enough information, which need
    not wait for the total-degree criterion. The published estimators sum over multidegrees
    before applying the criterion, which is a strictly coarser test.
  why_not_a_renamed_known_approach: 'Nearest known method: the semi-regular / Froberg model,
    universally used in this family, and the bilinear-system degree-of-regularity results
    of Faugere-Safey el Din-Spaenlehauer, which are already standard for MinRank''s support-minors
    modelling. The difference is the target: the bilinear results are applied to systems built
    to be bilinear, whereas nobody in this program has asked whether the INTERSECTION system
    -- which arises from the oil space and not from a modelling choice -- is multi-homogeneous,
    and it is. Nearest internal record: IDEA-20260805-ca92fd derives the k=2 intersection
    system from the oil space and measures its solving degree against a planted-solution null;
    it measures ONE model against a null and does not compute a second model to measure against.'
  predictions:
  - observable: multidegree pattern of the k-tuple system, checked symbolically at k=2 and
      k=3
    metric: set of multidegrees appearing, per equation
    predicted: Exactly {(2,0),(0,2),(1,1)} at k=2 and {2e_i} union {e_i+e_j} at k=3, with
      EVERY equation homogeneous in every block. A single equation mixing multidegrees falsifies
      claim (A).
  - observable: MAYO whipped forgery equations checked for block homogeneity
    metric: yes/no per equation
    predicted: NOT block-homogeneous, confirming (C). Block homogeneity there would extend
      the correction to MAYO's binding attack.
  - observable: measured solving degree at toy cells, against (i) the singly-graded semi-regular
      prediction and (ii) the multi-graded prediction computed from the multi-graded series
    metric: three integers per cell
    predicted: measured = multi-graded < singly-graded, at every cell with k >= 2 and n/o
      in [2, 4]. measured = singly-graded at every cell falsifies the whole record and is
      a clean positive result for the published estimators.
  - observable: largest multidegree block size versus the total degree-D Macaulay column count
    metric: ratio
    predicted: Ratio between 0.4 and 0.7 at the tested (n, D), i.e. a constant-factor saving
      of roughly 2 in size and 4 at omega=2 -- explicitly a constant, not an exponent.
  - observable: gap (singly-graded degree minus measured degree) as a function of k and n/o
    metric: integer gap, as a curve
    predicted: Non-decreasing in k. A gap that does not respond to k is the canonical artifact
      tell and voids the measurement.
  minimal_test: 'Toy, exact, three-way. Cells (q,n,m=o) = (16,10,4), (16,11,4), (16,12,4),
    (16,12,5), k in {2,3}, 20 keys each. For each: (1) verify block homogeneity symbolically;
    (2) compute the singly-graded semi-regular prediction from (1-z^2)^{M}/(1-z)^{N} and the
    multi-graded prediction from the multi-graded series in k variables, both exactly, before
    running any solver -- these are PRE-REGISTERED predictions; (3) solve the system with
    a multidegree-aware order and record the actual solving degree, the per-multidegree block
    sizes, and the total field operations; (4) repeat the identical pipeline on the two nulls.
    Also run the symbolic block-homogeneity check on a MAYO whipped system to confirm (C).'
  controls:
  - 'MATCHED MULTI-HOMOGENEOUS NULL: a random system with the SAME multidegree pattern and
    the same (n_i, m) but no oil structure. If it shows the same gap, the gap belongs to multi-homogeneity
    and not to UOV -- the correct and more useful reading, and it is the result this record
    most expects.'
  - 'MATCHED SINGLY-GRADED NULL: a random system of the same total equation and variable counts
    with no block structure. Its measured degree must match the singly-graded prediction;
    if it does not, the singly-graded model is wrong for reasons unrelated to grading and
    the whole comparison is void.'
  - 'PRE-REGISTRATION CONTROL: both predictions are computed and recorded BEFORE the solver
    runs, so neither model can be fitted after the fact.'
  - 'SOLVER-ORDER CONTROL: run once with a plain degrevlex order and once with a block order.
    A gap that appears only under the block order is a statement about the solver, not the
    ideal, and must be reported as such.'
  confounders:
  - The k-tuple system carries a GL_k(F_q) symmetry (any invertible combination of the blocks
    is again a solution), so it is never zero-dimensional; a chart must be fixed before solving,
    and fixing it can break block homogeneity if done carelessly. The chart must be block-wise.
  - Standard F4/F5 with degrevlex does not respect the grading, so the exponential half of
    the correction may be unavailable in practice even when it exists in the Hilbert function.
    This is the most likely way a true claim yields no attack, and the solver-order control
    measures it directly.
  - Toy o=4,5 is far from o=44; both the gap and its k-dependence may not persist.
  - The multi-graded semi-regularity notion is itself a model, not a theorem, and a system
    can fail it in either direction. That is precisely why the measurement compares against
    BOTH models rather than validating one.
  falsification_conditions:
  - Any k-tuple equation fails block homogeneity, killing claim (A).
  - Measured solving degree equals the singly-graded prediction at every cell.
  - The multi-graded prediction is not below the singly-graded one at any cell, making the
    correction empty.
  - The gap fails to respond to k.
  - MAYO's whipped equations turn out to be block-homogeneous, in which case (C) is wrong
    and the record's scope widens rather than dies.
  interpretation_limits: Toy scale, declared (AGENTS.md rule 7). The deliverable is a measured
    three-way comparison -- two pre-registered model predictions and one measurement -- plus
    a precise statement of which systems in the family are bigraded. It is NOT an attack,
    and a lower solving degree at o=4 does not license restating any published security level.
    The direction of the correction is stated as attacker-favourable, which means a confirmed
    result would LOWER stated security levels across the family; that direction makes independent
    replication mandatory before any such restatement, and the record says so rather than
    leading with the headline.
  assumptions:
  - The intersection system's shape is as derived in IDEA-20260805-ca92fd, to be re-derived
    rather than quoted.
  - A multidegree-aware term order and an exact multi-graded Hilbert series routine are available.
  heuristic_assumptions:
  - id: HA-1
    statement: For a random multi-homogeneous system with the k-tuple system's multidegree
      pattern, the multi-graded Hilbert series equals the generic (multi-graded semi-regular)
      series, uniformly for k in {2,3} and n/o in [2,4].
    rigorous_ingredient: The Hilbert function is bounded ABOVE, coefficientwise, by the generic
      multi-graded series exactly, because the ideal's graded pieces are spans of explicitly
      listed products; only the lower bound (genericity) is heuristic. The block-diagonal
      decomposition itself is a theorem about graded modules, not a heuristic.
    distribution_imitated: Froberg's conjecture in its multi-homogeneous form -- the same
      imitation the singly-graded model makes, applied at the finer grading.
    validation_route: Compute exact multi-graded Hilbert functions for 200 random multi-homogeneous
      systems of the k-tuple pattern at each toy cell and compare against the generic series
      coefficient by coefficient. TOY SCALE. The comparison is exact-integer, so this is a
      direct measurement.
    tail_checks: Record the largest coefficient deviation and the multidegree where it occurs.
      Deviations concentrated in the extreme multidegrees (D,0) and (0,D) would indicate the
      block-wise chart fixing is leaking, not that genericity fails.
  - id: HA-2
    statement: The solving degree achieved by a multidegree-aware solver equals the degree
      predicted by the multi-graded series, up to +1, uniformly at the tested cells.
    rigorous_ingredient: The predicted degree is a lower bound on what any Macaulay-style
      method can achieve, since the required information is not present in lower graded pieces;
      only achievability is heuristic.
    distribution_imitated: The standard "solving degree equals degree of regularity for generic
      systems" convention of the Bardet-Faugere-Salvy model, transported to the finer grading.
    validation_route: Measure the achieved degree at every toy cell under both term orders
      and compare against the prediction; 20 seeds per cell, reporting the full distribution
      since solving degrees over small fields are not always rigid.
    tail_checks: Any seed achieving a degree BELOW the predicted lower bound indicates a bug
      in the prediction or in the solver instrumentation and blocks the cell until resolved.
  target_complexity:
    time_exponent: 'Two separated effects. Constant: block-diagonalisation gives ~1.9x in
      matrix size and ~3.6x at omega=2, explicitly a CONSTANT and low priority per this program''s
      search heuristics except as a building block for the second effect. Exponential: if
      the multi-graded solving degree is D'' < D, the cost moves from binom(N+D,D)^omega to
      binom(N+D'',D'')^omega, a factor exponential in (D - D''). At RECALLED uov-Ip scale
      a single unit of D is worth roughly binom(229,7)/binom(229,6) ~ 32 in size and ~10^3
      at omega=2 -- so even D-D'' = 1 is material.'
    memory_exponent: 'Improves identically: the peak matrix is the largest multidegree block,
      binom(n+d_1-1,d_1) * binom(n+d_2-1,d_2), rather than binom(N+D-1,D). Memory is charged
      at the block size and reported alongside time; this is one of the few corrections in
      the slice that helps both axes at once, and that is stated because it is unusual.'
    best_known_baseline: The published intersection-attack cost for UOV and its inherited
      use in MAYO's, QR-UOV's and SNOVA's analyses, all computed (RECALLED, to be confirmed
      by spec read) from the singly-graded semi-regular series.
    hidden_overhead_disclosure: The exponential half is only realisable by a solver that respects
      the grading; with plain degrevlex F4 the gain may be entirely unavailable, in which
      case the correct headline is "the published estimate is right for the solver people
      actually run and wrong for the ideal". That distinction is the record's main interpretive
      risk and is measured, not assumed.
    time_memory_tradeoff: The hybrid (guess j variables) applies to both models and must be
      re-optimised separately for each; comparing at a fixed j is not a comparison.
  sota_delta: 'No attack executed. If confirmed: a correction to the intersection-attack cost
    across UOV, MAYO, QR-UOV and SNOVA of a constant ~3.6x plus a factor exponential in (D
    - D''), in the ATTACKER''s favour, meaning published levels are overstated by that amount.
    If falsified: a pre-registered confirmation that the singly-graded model is the right
    one for a provably bigraded system, which is itself a durable calibration finding and
    directly serves GOAL-UOV-001''s mandate to put the model on measured footing.'
  dominated_by: 'As an attack: n/a (no result claimed) -- no cost below any published row
    is asserted. As a cost-model correction: not dominated by any corpus record. Frontier
    rows checked -- IDEA-20260805-ca92fd (single-model solving degree vs planted null), IDEA-20260805-69af7c
