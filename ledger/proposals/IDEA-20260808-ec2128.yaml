  proof_search_map:
    bottleneck: The solving degree of the k-tuple intersection system, which is the single
      quantity carrying the published key-recovery exponent for UOV and, by inheritance, for
      three sibling schemes.
    baseline_embedding:
      parameter_slice: k = 1. The system degenerates to the reconciliation system, the grading
        has one block, and the multi-graded series must coincide EXACTLY with the singly-graded
        one.
      reproduction_check: Symbolic identity of the two series at k=1, plus a frozen toy fixture
        whose measured solving degree must match both predictions.
    observation_collision:
      observable: The measured solving degree, an integer.
      distinct_preimage_search: 'COLLISION FOUND: a genuine UOV-derived intersection system
        and a random multi-homogeneous system of the same pattern can share a solving degree.
        That is exactly why the matched multi-homogeneous null is mandatory, and why a confirmed
        gap would be attributed to the grading rather than to UOV unless the null separates.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Move the hypothesis from the total-degree grading to the multidegree
        grading, where the solving criterion becomes an exact per-block dimension condition.
      predicted_gain: A solving degree that is a minimum over blocks rather than a single
        total-degree threshold, hence <= the published prediction, plus an exact block-diagonalisation
        of the linear algebra.
    quantifier_order: FORALL toy cells in the declared set and FORALL seeds, the measured
      solving degree is at most the singly-graded prediction, and THERE EXISTS at least one
      cell where it is strictly below. The strict cell is allowed to depend on k and n/o;
      no uniform strictness is claimed.
    method_ceiling:
      strongest_certifiable_claim: '"At the tested toy parameters the k-tuple system''s solving
        degree is D_measured, the singly-graded model predicts D_s and the multi-graded model
        predicts D_m." It can never certify a published security level, only that one of two
        models fits the tested cells.'
      nearby_object_control: MAYO's whipped forgery system, which is provably NOT block-homogeneous.
        The multi-graded machinery must return "not applicable" there. A pipeline that reports
        a multi-graded gain on a non-multi-homogeneous system is measuring an artifact and
        its other readings are void.
    proof_obligations:
    - claim: The k-tuple system is multi-homogeneous with the stated multidegrees.
      responsibility: correctness
    - claim: The reconciliation and whipped systems are not.
      responsibility: scope
    - claim: The Macaulay matrix block-diagonalises by multidegree.
      responsibility: size
    - claim: The multi-graded predicted degree is <= the singly-graded one.
      responsibility: strictness
    - claim: A multidegree-aware solver achieves the predicted degree.
      responsibility: feasibility
    - claim: Memory is charged at the largest block, not the total.
      responsibility: memory
    - claim: The correction runs in the attacker's favour and therefore requires replication
        before restatement.
      responsibility: interface
    not_applicable_reason: null
