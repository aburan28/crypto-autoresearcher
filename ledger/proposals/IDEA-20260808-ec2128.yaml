  estimated_cost: 'Implementation medium: an exact multi-graded Hilbert series routine, a
    block-order solver configuration, and the two null generators. Compute medium: 4 cells
    x 2 values of k x 3 arms x 20 seeds, each a small exact solve.'
  recommended_priority: high
  honest_prior_of_survival: 'That claim (A) holds -- the k-tuple system is genuinely multi-homogeneous:
    ~0.9, it follows from the equations'' shape. That (C) holds -- MAYO''s whipped system
    is not: ~0.85. That the multi-graded prediction is strictly below the singly-graded one:
