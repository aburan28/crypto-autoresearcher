idea:
  id: IDEA-20260816-6df779
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Replace SHA-256's two sigma rotation-and-shift triples by many sampled triples and measure
    the joint spectrum of the solver-free deficit and the solver-measured reachable step count across
    that family, because a design constant that moves one and not the other separates cipher from
    search
  class: mechanism
  claim: '(A) SHA-256''s message expansion depends on exactly two design choices that can be varied
    without changing anything else: the rotation and shift amounts inside sigma0 and sigma1. Sweeping
    those amounts over a sampled family of triples generates a population of primitives identical
    in every structural respect - same recurrence taps, same word width, same block size, same step
    count, same compression function - and differing only in two constants. On that population, two
    quantities are measurable: the solver-free deficit integer computed by rank elimination, and the
    reachable step count measured by a frozen instrument at a frozen budget. (B) The joint spectrum
    of those two quantities across the family is the discriminating object, because the two candidate
    explanations of a frontier predict different joint behaviour. If the frontier is a property of
    the design, the two quantities co-vary across the family: triples with a later predicted crossing
    also reach further. If the frontier is a property of the search, the measured reachable step count
    varies across triples while the deficit barely moves, or moves independently. The measurement
    is a rank correlation over the sampled family, with the family''s own spread supplying the scale
    against which any correlation is read. (C) NOT CLAIMED: that any sampled triple is better or worse
    than SHA-256''s as a design, which would be a security statement this record does not make and
    forbids; that a correlation would identify a mechanism rather than an association; that SHA-256''s
    own triples occupy any particular position in the family, which is measured and reported rather
    than predicted; that anything follows about full 64-step SHA-256 or any deployed system. A near-zero
    correlation is the more informative outcome and is a measured obstruction closing the predictive
    reading of the deficit.'
  mechanism: 'STAGE A. Define the family: sigma0 and sigma1 each parameterized by an ordered triple
    of two rotation amounts and one shift amount on a w-bit word, sampled uniformly from valid amounts
    with degenerate cases - repeated amounts, zero shift - excluded by a declared rule and the exclusions
    reported. STAGE B. For each sampled member, compute the solver-free deficit by the identical rank
    pipeline used elsewhere in this bucket, which costs seconds. STAGE C. For each member, measure
    the reachable step count with the frozen encoder, solver and budget at a toy word width so that
    a family of size 60 is affordable, five seeds each, every returned assignment certificate-verified.
    STAGE D. Locate SHA-256''s own triples in the family and report their percentile position on both
    axes without interpreting it. STAGE E. Compute the rank correlation between the two quantities
    over the family with a permutation null. STAGE F. Refutation route: if the deficit''s spread across
    the family is smaller than its spread across carry classes within a single member, the deficit
    does not resolve the family at all and the correlation is undefined; the run reports that as its
    measured resolution limit rather than reporting a correlation.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full and ledger/goals/GOAL-SHA2-001.yaml. Read docs/inventor-protocol.md
      section 8 audits 2 and 4 and section 3. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/
      coordination/; grep -ril 'rotation constant' over ledger/proposals/ ledger/hypotheses/ knowledge/techniques/
      knowledge/findings/; grep -ril 'ARX' over the same; grep -ril 'message schedule|message-schedule'
      over ledger/proposals/ ledger/hypotheses/ knowledge/.
    results: '''rotation constant'' returned ZERO hits across ledger/proposals/, ledger/hypotheses/,
      knowledge/techniques/ and knowledge/findings/, so no record in this repository varies a rotation
      amount of any primitive. ''ARX'' matched six or more proposals including IDEA-20260811-626f00,
      IDEA-20260807-abacec, IDEA-20260801-021, IDEA-20260805-ca92fd, IDEA-20260813-fe3c5e and IDEA-20260805-07ff43,
      all grep-level hits whose bodies I did not read and none of which references RQ-SHATWO, since
      the RQ-SHATWO grep returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2. ''message
      schedule'' matched only the two signature-lane proposals IDEA-20260813-878855 and IDEA-20260813-93a735
      whose titles I read. The task brief records that the AES r=5..7 measured effects with their
      null controls are established internal results not to be re-derived; this contract touches no
      AES object and shares no code with that lane.'
    verdict: 'UNVERIFIED. No external literature is readable here and this record asserts nothing
      about it, including anything about how SHA-256''s rotation amounts were chosen or analysed.
      Claimed new: nothing about constant sweeps as a technique, which is an obvious and widely used
      device in symmetric design analysis, and nothing about rank correlation. The contribution claimed
      is the JOINT reading: measuring the solver-free deficit and the solver-measured reachable step
      count on the SAME sampled family and correlating them, so that a design-versus-search question
      becomes a two-axis spectrum with a permutation null rather than a single-axis sweep. Assembled
      from known parts. Within this repository the verifiable fact is that zero records vary a rotation
      constant anywhere, and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: The joint pair (deficit integer, reachable step count) attached to each member
      of a sampled family of SHA-256-shaped primitives that differ only in the two sigma rotation-and-shift
      triples, followed as the family is enumerated, and summarized as the rank correlation between
      the two coordinates against a permutation null.
    lossiness: 'Lossy on both coordinates. The deficit discards word values, carry identity and the
      compression function, keeping one integer; the reachable step count discards the search history,
      the assignments and all telemetry, keeping another. The joint object further discards the identity
      of the triple that produced each pair, keeping only the point cloud and its rank correlation.
      Many distinct families produce the same correlation, so this is a projection and not a change
      of coordinates. Why the remainder still propagates: each coordinate is computed by a pipeline
      that is exactly defined on any member of the family, so moving to the next member requires nothing
      that was discarded, and the family is enumerable independently of any point already computed.'
    propagation: The iterated operation is substitution of one design constant. One step replaces
      a sigma triple with another sampled triple and recomputes both coordinates by the identical
      pipelines. Under the design-limited hypothesis the two coordinates move together, so the point
      cloud lies near a monotone curve and the rank correlation is large in magnitude. Under the search-limited
      hypothesis the second coordinate moves with encoding difficulty while the first is nearly constant,
      so the cloud is a horizontal band and the correlation is near zero with the first coordinate's
      spread small. A third, diagnostic, outcome is a cloud with large spread on both axes and no
      correlation, which says both quantities are sensitive to the constants but not to each other.
    survival_score: 'The object survives across the whole sampled family and dissolves at the family''s
      own resolution: if the deficit''s between-member spread is smaller than its within-member spread
      across carry classes, the first coordinate does not distinguish family members and the correlation
      is undefined. That comparison is computed first and reported as a gate, so the object''s survival
      is measured rather than assumed. It also dissolves at the toy word width, since the family is
      swept at reduced width for affordability and the correlation is a statement about that width
      only.'
  null_object_control: 'Two nulls in the same invocation. NULL-P permutation null: recompute the rank
    correlation on 10000 random pairings of the two coordinate vectors across family members, giving
    the null distribution against which the observed correlation is scored - this is the only defence
    against reading structure into a 60-point cloud. NULL-T random-tap family: repeat the entire sweep
    on a family whose recurrence taps are themselves randomized rather than SHA-256''s, so that any
    correlation found in the signal family can be compared against one found where there is no design
    to speak of. For the signal arm to mean anything, the observed correlation must fall outside the
    NULL-P distribution; if the NULL-T family shows the same correlation, the association is a property
    of the two pipelines'' shared dependence on constants rather than of SHA-256''s structure, and
    the result is recorded as a controlled null.'
  discriminated_from:
  - The SHA-512 chimera entry in this bucket, which substitutes exactly one triple - SHA-256's amounts
    onto SHA-512's width - to decompose one specific difference; this samples 60 triples at one width
    to get a spectrum and a correlation, so one is a decomposition and the other a population measurement.
  - The rank-ledger entry, which computes the deficit for a single object and explicitly declines
    any predictive claim; this measures the deficit across a family jointly with a search outcome
    and is the entry that tests association.
  - The word-width scaling entry, which varies width at fixed constants; this varies constants at
    fixed width, so the two are orthogonal axes of the same three-axis design and neither subsumes
    the other.
  - 'The AES r=5..7 measured effects and their null controls, recorded in the task brief as established
    internal results: that lane concerns a block cipher''s round structure and shares no object, no
    code and no primitive with a hash message schedule''s rotation amounts.'
  - The six or more grep hits for 'ARX' in ledger/proposals, including IDEA-20260811-626f00 and IDEA-20260813-fe3c5e,
    matched at grep level only in lanes that do not reference RQ-SHATWO; I did not read their bodies
    and none concerns SHA-256's sigma amounts.
  assumptions:
  - Varying only the sigma triples leaves a family whose members are comparable objects; the recurrence
    taps, width, block size, step count and compression function are held identical by construction.
  - The declared degeneracy exclusion rule removes triples that are trivially broken without removing
    triples that are merely unusual; the excluded set is reported so the rule is auditable.
  - A family of 60 members with 5 seeds each is enough to resolve a rank correlation against a permutation
    null at the effect sizes of interest; if it is not, the permutation null itself will say so.
  - The frozen instrument has passed the planted-signal gate proposed separately in this bucket; without
    that licence the second coordinate is uninterpretable and this contract must not run.
  predictions:
  - metric: between-member spread of the deficit integer versus within-member spread across sampled
      carry classes
    direction: higher
    minimum_effect: between-member spread must exceed within-member spread by at least a factor of
      2, otherwise the first coordinate does not resolve the family and the correlation is undefined
      and not reported
  - metric: rank correlation between deficit and reachable step count over the family, scored against
      the 10000-draw permutation null
    direction: different
    minimum_effect: explicit refusal to pre-commit a sign or magnitude, because both a strong correlation
      and a near-zero one are informative and opposite readings of the design-versus-search question,
      and pre-committing either would bias a measurement built to let the family decide
  - metric: rank correlation in the NULL-T random-tap family versus the signal family
    direction: different
    minimum_effect: the null family's correlation must fall inside its own permutation null; if it
      does not, the association is a pipeline artifact and the signal arm carries no information
  - metric: percentile position of SHA-256's own triples within the family on each axis
    direction: different
    minimum_effect: reported without a predicted value and explicitly without interpretation, because
      ranking SHA-256's constants against sampled alternatives would be a design-quality statement
      this record does not make
  minimal_test:
    design: 'Cheapest discriminating version: 20 sampled triples instead of 60, at w = 12 rather than
      16, three seeds instead of five, and the resolution gate computed first. The gate alone - comparing
      the deficit''s between-member spread against its within-member carry-class spread - costs seconds,
      requires no solver at all, and can kill the whole design before any search runs, which is the
      single most valuable thing this contract can do cheaply. If the gate passes, 20 members at three
      seeds gives 60 solver runs at the frozen budget plus a 10000-draw permutation null that costs
      nothing, and that already scores a rank correlation against its null. Add 10 random-tap family
      members for NULL-T at the same settings. If the correlation is inside the permutation null at
      20 members, extending to 60 is justified only if the observed magnitude is near the boundary;
      if it is far inside, the near-zero correlation is itself the measured obstruction and the larger
      sweep buys nothing.'
    controls:
    - NULL-P permutation null with 10000 random pairings of the two coordinate vectors, in the same
      invocation.
    - NULL-T random-tap family swept identically, with its own permutation null.
    - Resolution gate comparing between-member deficit spread against within-member carry-class spread,
      computed and reported before any correlation.
    - Certificate verification of every returned assignment against an independently written reduced-width
      implementation.
    - The planted-signal instrument gate from the companion contract in this bucket, cited by run
      id as a precondition rather than re-run here.
    required_metrics:
    - deficit integer per family member, per carry class
    - reachable step count per family member per seed, with spread
    - rank correlation between the two coordinates over the family
    - permutation-null distribution of that correlation, 10000 draws
    - between-member versus within-member deficit spread ratio
    - percentile position of SHA-256's own triples on each axis
    - list of excluded degenerate triples with the exclusion reason
  falsification_conditions:
  - The between-member deficit spread does not exceed the within-member carry-class spread by a factor
    of 2, so the first coordinate does not resolve the family and no correlation is reportable.
  - The NULL-T random-tap family shows a correlation outside its own permutation null of comparable
    magnitude, showing the association is a pipeline artifact.
  - The observed correlation falls inside the permutation null, which closes the predictive reading
    of the deficit at the tested width with a measured number.
  - Any returned assignment fails independent certificate verification.
  - The instrument's planted-signal gate has not passed, in which case the second coordinate is uninterpretable
    and the contract must not run at all.
  - Reachable step count spread across seeds within a member exceeds the between-member spread, making
    the second coordinate unable to resolve the family.
  confounders:
  - Different sigma triples change CNF structure and size, so the second coordinate may track encoding
    difficulty rather than the primitive; variable and clause counts per member are reported and the
    NULL-T family is the partial defence.
  - Degeneracy exclusion is a free rule that can shape the family; the excluded set is reported in
    full so a reader can see what was removed.
  - Sampling triples uniformly is a convention, not a claim about any design space, and a different
    sampling distribution could change the correlation.
  - Carry-class choice affects the first coordinate and is held to one rule across the family; the
    within-member spread is reported precisely because it bounds this.
  - At toy width some triples may be degenerate for reasons specific to that width - rotation amounts
    that coincide modulo w - and the per-member triples are reported explicitly so this is visible.
  interpretation_limits:
  - No sampled triple is claimed better or worse than SHA-256's, and the percentile position of SHA-256's
    own triples is reported without interpretation.
  - A correlation is an association across a sampled family, never an identified mechanism.
  - Everything is measured at a toy word width and no value transfers to 32-bit SHA-256.
  - The second coordinate is a solver-and-budget statement; a low reachable step count for a member
    is never evidence that no characteristic exists for it.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The first coordinate is seconds per member; the
      second is 60 members x 5 seeds x the step ladder at the frozen budget, bounded in advance by
      the declared campaign wall clock.
    memory_exponent: No attack memory exponent is claimed. The rank pipeline holds sub-megabyte matrices;
      the solver runs under a declared and recorded per-run memory cap.
    best_known: 'No incumbent attack. The incumbent this improves on is the absence of any measured
      dependence of either quantity on design constants anywhere in this program: ''rotation constant''
      returns zero hits across all proposals, hypotheses, techniques and findings, and RQ-SHATWO carries
      no proposals, so no prior row exists.'
    hidden_overhead: 'The hidden cost is that the second coordinate is expensive per member while
      the first is nearly free, which pushes every design decision toward small families and few seeds
      and directly threatens the resolution the correlation needs. Stating the resolution gate first,
      and running it before any solver, is the only honest way to spend that budget. A second hidden
      cost: reporting SHA-256''s own percentile position invites a design-quality reading that this
      record forbids, and the discipline of reporting it without interpretation is a human cost that
      has to be paid every time the result is quoted.'
  dominated_by: 'n/a (no attack result claimed). Pareto check across time, memory and data/queries:
    I checked every frontier row present in this repository and found none - no experiment directory,
    evidence record, proposal or hypothesis measures any quantity as a function of a primitive''s
    rotation constants, and RQ-SHATWO carries no proposals - so there is no prior row to dominate
    this one. This repository cannot adjudicate against external work in either direction and does
    not attempt to.'
  sota_delta: no attack; conceptual/measurement contribution only. The delta is from zero measured
    constant-dependence to a 60-point joint spectrum with a 10000-draw permutation null, a random-tap
    comparison family, and a reported resolution gate - none of which exists here in any form today.
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (1) That the family can be constructed and both coordinates
    computed on every member: ~0.8, with the risk concentrated in degenerate triples at toy width
    and in solver runs that exceed budget on unlucky members. (2) That the resolution gate passes
    - between-member deficit spread at least twice the within-member carry-class spread: ~0.35, and
    this is the part most likely to kill the contract, because rank profiles may simply be insensitive
    to rotation amounts, which would itself be a clean and reusable measured obstruction. (3) That
    the observed correlation falls outside its permutation null: ~0.3, conditional on the gate passing.
    (4) That such a correlation, if found, indicates a mechanism rather than a shared dependence of
    both pipelines on encoding size: ~0.35 conditional on (3), which is why NULL-T exists and why
    the language throughout is association rather than mechanism. The most likely single outcome of
    this contract is that the gate fails at step (2), and that outcome is worth having.'
