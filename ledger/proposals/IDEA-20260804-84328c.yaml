idea:
  id: IDEA-20260804-84328c
  question_id: RQ-SSI-001
  title: Frobenius-orbit quotient for two-stage supersingular path collisions
  class: representation
  claim: >-
    For F_p-rational supersingular path-finding instances, the genuinely lossy
    quotient of a partial-path endpoint by Frobenius orbit may expose a
    non-uniform, exactly liftable bucket distribution.  If a pre-registered
    fiber bound and an exact-lift check both hold, that distribution would
    justify studying a two-stage collision procedure with a prospective
    p^(1/6+o(1)) time and memory target; this is a proposal, not an attack or
    a claimed improvement.
  object_first_candidate:
    tracked_object: >-
      The Frobenius orbit [E] = {E, E^(p)} of the endpoint curve of a partial
      path, keyed canonically by the unordered pair of j-invariants.
    established_families_off_limits: >-
      Full-graph MITM, Delfs-Galbraith descent as an attack lens,
      endomorphism-orientation vectorization, SIDH torsion-image attacks,
      CSIDH/Kuperberg collimation and every FC0/CollimationSieve route are
      off-limits as the primary lens.
    newness_score: unverified; it is a quotient measurement, not a claimed new attack.
    testability_score: high; enumerate the l-neighbor orbit multiset and exact path endpoints.
    survival_score: one path step deterministically; usefulness beyond toy graphs is unknown.
  mechanism: >-
    From an endpoint E, the multiset of Frobenius orbits of its l-isogenous
    neighbors is determined by E and l.  Store quotient buckets first and
    retain enough parent data to re-expand each collision to exact endpoint
    equality.  A useful mechanism requires the observed quotient-fiber
    profile to be more concentrated than a shape-matched random regular graph
    while the exact lift rate remains high.  If either condition fails, the
    quotient is only an information-losing representation and supplies no
    collision advantage.
  novelty_status: unverified
  literature_context:
    - >-
      KN-LIT-078 reports a heuristic/expected Otilde(p^(1/4)) classical
      algorithm only for the F_p-rational setting; its full paper was not read
      by this corpus.
    - >-
      KN-LIT-079 reports Otilde(p^(1/4)) quantum path finding in a different
      quantum setting; it is context, not a classical comparison or novelty
      verification.
    - >-
      KN-LIT-074 reports GRH-conditional polynomial-expected-time reductions
      between EndRing and path finding; this proposal proves neither reduction.
  lossy_projection_identifiability_audit:
    projection: partial path endpoint E -> unordered pair {j(E), j(E)^p}.
    what_is_discarded: >-
      The chosen path, kernel sequence, orientation, and which member of a
      non-rational Frobenius pair was reached.
    why_genuinely_lossy: >-
      Distinct partial paths and, when E is not F_p-rational, E and E^(p)
      share the quotient key; it cannot reconstruct a path or a labeled
      endpoint.
    deterministic_propagation: >-
      Given a representative E and prime l, enumerate its l-neighbors and
      canonically map each to an unordered Frobenius orbit.  The resulting
      multiset is independent of which representative in [E] is named.
    identifiability_risk: >-
      Equal quotient keys do not identify equal endpoints or compatible path
      halves.  Every candidate must be lifted and verified as an exact
      isogeny-path join; quotient collisions alone carry no cryptanalytic
      conclusion.
    algebraic_precompute_verdict: passes_as_lossy_but_not_as_a_solution.
  assumptions:
    - Exact neighbor enumeration and exact endpoint equality are available at
      toy scale; no claim is made for cryptographic-scale enumeration.
  proof_search_map:
    bottleneck: >-
      Whether quotient bucketing reduces the number of expensive exact joins
      enough to offset quotient construction and fiber lifting.
    baseline_embedding:
      parameter_slice: >-
        The same F_p-rational toy graphs and path lengths used by a plain
        two-list p^(1/4)-shaped MITM implementation; no full-graph or quantum
        baseline is substituted.
      reproduction_check: >-
        On each frozen toy graph, plain endpoint-key MITM must reproduce every
        enumerated connecting path before quotient buckets are enabled.
    observation_collision:
      observable: unordered Frobenius-orbit key of a partial-path endpoint.
      distinct_preimage_search: >-
        Enumerate distinct paths and distinct labeled endpoints with the same
        key, then separately test whether each pair lifts to an exact join.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frobenius-orbit endpoint bucket.
        predicted_gain: >-
          Conditional p^(1/6+o(1)) time and memory research target only if
          measured bucket concentration and exact-lift rate meet frozen bounds.
    quantifier_order: >-
      For every graph in the declared toy family, first fix the quotient and
      path length; then measure all fibers.  Only if there exists a uniform
      bound across that family may a larger-family conditional lemma be
      formulated.  No instance-selected quotient or post-hoc threshold is allowed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most a scoped statement about quotient fibers and lift rates on the
        enumerated toy graphs; it cannot certify a general path algorithm,
        EndRing result, or security change.
      nearby_object_control: >-
        Replace Frobenius by a uniformly sampled fixed-point-free involution
        on the same graph vertices.  A comparable signal there is an
        instrument/graph-shape artifact, not Frobenius structure.
    proof_obligations:
      - claim: exact fiber-size accounting
        responsibility: size
      - claim: quotient construction and lift charge
        responsibility: runtime
      - claim: lifted collision is a valid path join
        responsibility: correctness
      - claim: concentration persists in the stated family
        responsibility: success_probability
  predictions:
    - metric: quotient_bucket_second_moment_over_null
      direction: higher
      minimum_effect: >-
        At least 1.5 times the matched-null median at every pre-registered toy
        size, with an exact-lift rate no lower than the null median.
    - metric: exact_lifted_join_fraction
      direction: higher
      minimum_effect: >-
        Not lower than the plain endpoint-key control after charging every
        quotient collision and verification.
  minimal_test:
    design: >-
      On fully enumerable F_p-rational toy supersingular graphs, enumerate
      equal-length partial paths, bucket endpoints by the orbit key, lift all
      cross-bucket candidates, and compare charged joins to plain endpoint-key
      MITM at fixed path length.
    controls:
      - >-
        Shape-matched random regular graph with the same vertex count, degree,
        path-length distribution, and a random fixed-point-free involution.
      - Plain exact-endpoint MITM known-answer control.
      - >-
        Label-permuted quotient control preserving every bucket size but
        destroying Frobenius/endpoints correspondence.
    required_metrics:
      - bucket-size CDF and second moment
      - exact-lifted joins per quotient collision
      - total construction, lookup, and verification operations
      - null-versus-real tail maxima
  falsification_conditions:
    - >-
      The real quotient's second moment or exact-lift rate is within the
      pre-registered null envelope at every tested size.
    - >-
      The same signal survives label permutation or a random involution, which
      identifies a shape artifact.
    - >-
      Lifting costs erase the proposed two-stage saving under matched charging.
  confounders:
    - F_p-rational vertices are already special, so a signal may be descent
      geometry rather than an orbit-quotient mechanism.
    - Toy graph automorphisms and exceptional j-invariants can inflate fibers.
    - A finite-scale null miss cannot establish asymptotic concentration.
  heuristic_assumptions:
    - id: HEUR-FOQ-1
      statement: >-
        For a declared asymptotic family and fixed normalized path length, the
        orbit-key fiber occupancies have a second moment at least c times the
        matched random-involution occupancy second moment for a uniform c > 1,
        while the conditional exact-lift probability is at least d > 0.
      rigorous_support: >-
        Exact enumeration gives sum_b |F_b| = N and exact lift counts on each
        tested graph; the comparison model is the classical balls-into-bins
        occupancy law for N labeled paths partitioned into fixed bucket sizes.
        No theorem transfers that model to supersingular graphs here.
      validation_plan: >-
        At toy scale, sample complete path sets on increasing enumerable
        F_p-rational graphs; compare the empirical bucket CDF and second
        moment to random regular graphs with matched involutions, and compare
        maximum buckets to occupancy extreme-value tails.  This is toy-scale
        only; no crypto-scale shortcut or validation is claimed.
      falsification_condition: >-
        The confidence bands for c exclude values above 1 at all declared
        toy sizes, or d decays below the pre-registered floor.
  target_complexity:
    problem: pure F_p-rational supersingular isogeny path finding without auxiliary torsion data.
    time_exponent: >-
      Prospective conditional target p^(1/6+o(1)); no algorithm or improvement
      is claimed unless the missing uniform fiber and charged-lift lemmas exist.
    memory_exponent: prospective conditional target p^(1/6+o(1)).
    matched_best_known: >-
      KN-LIT-078 reports Otilde(p^(1/4)) classical time in this F_p-rational
      setting.  This is the matched baseline and is reported context only.
    unmatched_context: >-
      KN-LIT-079's reported p^(1/4) quantum bound is not a matched classical
      baseline and is not used for a comparison.
    hidden_overhead: >-
      Any o(1) would need to charge neighbor enumeration, bucket keys, exact
      lifts, verification, and any rerandomization; none is bounded here.
    tradeoff_note: >-
      Proposed high-memory endpoint is p^(1/6+o(1)) only conditionally.
      Reducing memory would require a separately proved collision tradeoff;
      parallel lookup does not remove total-work or verification charges.
  dominated_by: >-
    Delfs-Galbraith as reported in KN-LIT-078 dominates every currently
    specified procedure: this record has no implemented or proved Pareto point
    and its p^(1/6) entry is only a conditional target.
  sota_delta: >-
    No result claimed.  The prospective target is a 1/12 reduction in both
    p-exponents relative to the reported matched p^(1/4) baseline, contingent
    on unproved uniform fiber and charged-lift bounds.
  estimated_cost:
    implementation: medium
    compute: low
    validation_cost: exhaustive toy enumeration; crypto-scale validation not planned.
  recommended_priority: medium
  interpretation_limits:
    - This is not an EndRing, CGL, SQIsign, CSIDH, SIDH, or ECDLP result.
    - KN-OPEN-013 remains open; KN-LIT-074's GRH-conditional equivalence is not used to transfer a result.
    - No experiment, run, evidence, or conclusion is created by this proposal.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-04'
