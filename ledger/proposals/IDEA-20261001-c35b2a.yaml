    best_known: >-
      KR-IC-f3da82 mechanism class; practical negative KR-IC-1fcdbc.
    hidden_overhead: Trace learn cost amortized over batch; accept/reject branches.
    tradeoff_note: n/a — meter, not an attack tradeoff.

