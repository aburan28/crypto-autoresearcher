# =============================================================================
# IDEA-20261001-c35b2a -- F4 elimination-trace replay speedup on toy PDP batches.
# Calibrates KR-IC-f3da82; no break / no exponent claim.
# =============================================================================
idea:
  id: IDEA-20261001-c35b2a
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES F4 TRACE REPLAY CUT TOY PDP BATCH COST BY ≥2×?
    On binary toys n∈{17,19} with frozen V (dim ℓ=3), learn one F4 reduction
    trace on a seed descended S_3 system and replay it across ≥50 similar
    PDP instances; test whether median per-instance cost drops by ≥2× vs
    fresh F4.

  class: heuristic_validation

  claim: >-
    KR-IC-f3da82 reports F4 trace reuse across many similar systems as a
    decomposition speedup. CLAIM: at each toy cell (n,ℓ)∈{17,19}×{3}, for a
    frozen batch of ≥50 descended S_3 PDP instances sharing the same
    (n,ℓ,V,modulus) shape, median wall time with a learned elimination
    trace is ≤ 0.5× median fresh-F4 wall time on the same batch — OR the
    ratio is >0.5 and is recorded as replay-not-2× at this scale.
    CLAIM TIER: heuristic_validation. NO break. NO exponent. NO claim that
    replay makes binary IC competitive with rho (KR-IC-1fcdbc). NO n≥131
    transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 descended Boolean/polynomial
    systems on FB {P : x(P)∈V} (KR-IC-5a43e5 / KR-IC-73db3f). Operation set:
    F4 with optional trace record/replay (KR-IC-f3da82) — instrument only.
    Trichotomy: Class I partial-action used as instrument. Lossy-projection:
    replay success is a structural similarity signal, not a new relation
    source; null is a batch of random systems of matched size that should
    reject a Semaev-learned trace (replay fail or no ≥2× gain). OFF-LIMITS:
    claiming Crossbred (IDEA-20261001-3f2d06) or SAT as the primary meter;
    asserting KR-IC-889857. WHAT IS NEW: a pre-registered ≥2× replay ratio
    band on RQ-BINSTD toys.

  novelty_status: unverified
