  assumptions:
    - Seed system and replay batch share frozen (n,ℓ,V,modulus); only RHS/target varies.
    - F4 engine already admitted or cell is failed_infrastructure (never evidence).
    - Ratio threshold 0.5 (=≥2×) pre-registered; no post-hoc edits.

  heuristic_assumptions:
    - id: HEUR-BINSTD-c35b2a-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19}×{3}: after learning one elimination trace on a
        frozen seed descended S_3 system, median wall time over ≥50 similar
        PDP instances with replay is ≤ 0.5× median fresh-F4 wall time on the
        same instances.
      random_model_justification: >-
        Rigorous: KR-IC-f3da82 supplies the trace-reuse mechanism class.
        Classical: similar Macaulay shapes should share pivot structure;
        whether Semaev-descended toys realize ≥2× amortization is the
        transfer hypothesis. Random matched systems should reject or fail
        to amortize the Semaev-learned trace.
      supporting_results:
        - KR-IC-f3da82
        - KR-IC-0d2021
      validation_experiment_ids: []
      falsification_condition: >-
        Replay/fresh median ratio > 0.5 on a completed batch, OR a random
        matched batch accepts the Semaev-learned trace with ratio ≤0.5
        (signal is artifactual), OR F4 absent (infrastructure stop).

  predictions:
    - metric: replay_over_fresh_f4_median_wall_ratio
      direction: upper_bounded
      minimum_effect: '≤ 0.5 on each toy cell'
    - metric: replay_accept_fraction_semaev
      direction: lower_bounded
      minimum_effect: '≥ 0.8 of Semaev batch instances accept the learned trace'
    - metric: replay_accept_fraction_random_null
      direction: upper_bounded
      minimum_effect: '≤ 0.2 accept the Semaev-learned trace on random null'

  minimal_test: >-
    Stage 0: freeze (n,ℓ,V), seed/target generators, F4 versions, budgets.
    Stage 1: n=17, ℓ=3 — learn trace, replay ≥50, report ratios and accept
    fractions. Stage 2: n=19 + random matched null batch. Budget: ≤8 CPU-
    hours. Stop if F4/trace API absent (IMP, never evidence).

  controls:
    - ctl_identical_shape_batch
    - ctl_fresh_f4_baseline_same_instances
    - null_random_system_matched_size
    - ctl_no_posthoc_ratio_edit

  falsification_conditions:
    - Claiming practical binary IC from toy replay (KR-IC-1fcdbc).
    - Transferring toy ≥2× to n≥131 without a new contract.
    - Editing the 0.5 threshold after seeing times.
    - Treating missing F4 as mathematical falsification.

  target_complexity:
