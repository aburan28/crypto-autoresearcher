        GROWS with p on the declared p-ladder is the artifact-free signal and
        would be reported as additive structure in the height box.
    - metric: charged_total_versus_rho
      direction: higher
      minimum_effect: >-
        The end-to-end charge max(B * search_cost, B^2) against 0.886*sqrt(n),
        reported as a ratio at every (H, m) on the ladder. Predicted ratio
        >= sqrt(n) under the closure branch, since search_cost falls back to the
        B^{m-1} enumeration. A measured ratio below 1 at any cell is the LEAD
        branch and requires independent review before interpretation.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE 0 (zero compute beyond exact integer arithmetic, HARD GATE). (a)
      Recompute the summation identity: on y^2 = x^3 + 3x + 5 over F_101
      (#E = 115), enumerate all ordered triples of on-curve x-coordinates and
      confirm that f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) vanishes on exactly the
      6441 realisable x-triples with ZERO false negatives and ZERO false
      positives. (b) Recompute the box counts for the asymmetric height
      normalisation: |F_H| = 23, 39, 47, 111, 127 at H = 4, 5, 6, 9, 10, i.e.
      c_H = 1.438, 1.560, 1.306, 1.370, 1.270; and on
      y^2 = x^3 + x + 28 over F_10007 (n = 9851, prime) confirm 69 on-curve
      x-values in F_10 carrying B = 138 base points. (c) Recompute the
      9-monomial support and its coefficient list. (d) Recompute the pinning
      anchor H^4/p = 0.99930. (e) Recompute the dispersion cell: mean 1.9332,
      variance 5.5822, dispersion 2.8875, 3704 unreachable targets, c(O) = 138,
      and the seeded matched null. Any disagreement stops the record.
      STAGE 1 (zero curve compute, symbolic, THE DELIVERABLE). Compute gamma_2
      for the exact 9-monomial degree-4 support by the declared strategy, with
      the shift-polynomial set, lattice dimension, determinant and the resulting
      bound all recorded, and repeat for the arity-3 support obtained from f_4.
      Report gamma_2 and gamma_3 against gamma_req = 1 and against the rigorous
      univariate anchor 1/4. THIS STEP NEEDS NO ELLIPTIC CURVE AND NO SAMPLING;
      it is the cheapest possible discriminator for an exponent-level lane.
      STAGE 2 (minutes, only if Stage 1 is not decisive or the LEAD branch
      fires). Build the lattice and run it on PLANTED instances from the frozen
      cell -- targets known to have a box relation, of which the frozen cell
      supplies many since the mean is 1.93 -- plus the univariate positive
      control and the matched null.
      STAGE 3 (hours, only if the LEAD branch survives Stage 2). A p-ladder at
      three field sizes and two arities, then stop and route to independent
      review. NO ECDLP INSTANCE IS SOLVED under this record.
    matched_null: >-
      A negation-closed random base of the same size, drawn as a random subset of
      the on-curve x-values with both points per x. NEGATION CLOSURE IS
      LOAD-BEARING: the height box is automatically negation-closed, which forces
      c(-R) = c(R) exactly and c(O) >= B, and a null drawn as a plain random
      point set would differ from the box for that reason alone and would
      manufacture a spurious signal. DECAY PARAMETER: p. A genuine structural
      advantage of the height box must GROW with p at fixed c_H; a separation
      flat in p is an artifact under docs/inventor-protocol.md section 3.
    known_false: >-
      (i) The claim that the product of unknown bounds falls with arity m, which
      the identity H^{2m} = n/c_H^m refutes. (ii) A monomial support with a
      missing bidegree. (iii) A claim of gamma_2 >= 1 asserted without the
      lattice dimension and determinant recorded.
    controls:
      - kind: matched_null
        design: >-
          Negation-closed random bases of the same size at the same (p, H), all
          density statistics unchanged.
      - kind: known_false
        design: >-
          The three refuted claims above, each of which the pipeline must reject.
      - kind: invalid_input
        design: >-
          x = 0 and the point at infinity must be handled explicitly; an H
          exceeding (4p/3)^{1/2} must be refused because the box is then all of
          F_p and the density condition is vacuous; a singular (a, b) must be
          refused.
      - kind: baseline
        design: >-
          Pollard rho with distinguished points and BSGS on the same curve in the
          same group-operation unit, as the mandatory matched attack-cost
          controls.
      - kind: positive_control
        design: >-
          TWO, and both are required. (1) SMALL-ROOT POWER: a planted univariate
          modular instance strictly inside the rigorous Coppersmith range
          (degree 4, root below p^{1/4}), which the lattice code must solve. If
          it does not, every gamma reported in Stage 1 or 2 is inadmissible and
          the cell is reported UNTESTED rather than closed. (2) RELATION
          EXISTENCE: targets from the frozen cell with a known box decomposition,
          which the search must find when given the decomposition's own bounds.
      - kind: generic_group
        design: >-
          Relabelled Z/nZ with a base of the same size and no height structure.
          The density statistics must agree with the elliptic run (they are
          generic); the search must NOT, because the height structure is exactly
          what the lattice reads. A generic run that reproduces a search
          advantage means the advantage is an artifact of the search harness.
    required_metrics:
      - threshold_pinning_identity
      - box_support_monomial_count
      - achievable_small_root_exponent_gamma2
      - decomposition_dispersion_versus_matched_null
      - charged_total_versus_rho
    decision_threshold: >-
      Stage 0 must reproduce every frozen number exactly and must reject all
      three known-false claims. Stage 1's gamma_2 decides the closure or lead
      branch on the pre-registered tolerances. The charged total is reported as a
      ratio to rho and no exponent claim is made from a toy measurement.
    stopping_rules:
      - >-
        Stop at the first failed exact identity, failed known-false control, or
        failed small-root positive control, and classify it as a procedure defect
        rather than as evidence about the object.
      - >-
        Stop after Stage 1 if gamma_2 <= 0.9 and gamma_3 <= gamma_2: the closure
        branch is then recorded with gamma as its obstruction quantity and no
        sampling is authorised.
      - >-
        No run is authorised by this record; authorized_runs is 0.
    required_artifacts:
      - >-
        frozen manifest for both cells (p, a, b, n, H, |F_H|, on-curve x-list,
        base point list, seed) and the f_3 verification transcript
      - the 9-monomial support with coefficients and the homogenisation transcript
      - >-
        per-arity shift-polynomial set, lattice dimension, determinant and the
        derived gamma, with the univariate positive-control solve
      - >-
        per-target decomposition-count vector, dispersion index, unreachable-target
        count, for the box and for every null draw
      - charged-total table against rho and BSGS in one unit
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        requires a new approved frozen handoff; the shift-polynomial strategy and
        the lattice-reduction implementation must be declared and hash-bound
        before any gamma is reported
  falsification_conditions:
    - >-
      Independent recomputation disagrees with #E = 115 at p = 101, with the
      6441 realisable triples, with any |F_H| count, with B = 138, with the
      9-monomial support, or with the dispersion cell. The designed values are
      then a procedure defect and this record is superseded, not amended.
    - >-
      gamma_2 computed at or above 1 with the lattice dimension and determinant
      recorded and the univariate positive control passing. Claim C is then FALSE
      and the conditional exponent move of Claim B is live at arity 5; this is the
      LEAD branch and it requires independent review before any interpretation.
    - >-
      gamma_2 below 1 and decreasing in arity. Claim C is CONFIRMED, the honest
      headline is a named computable obstruction for the size-function lane, and
      the lane closes at the section-4 standard with gamma as its quantity --
      NOT as a count of screened mechanisms.
    - >-
      The height box's dispersion index separates from the matched
      negation-closed null with the separation growing along the p-ladder. Claim
      D is then false, the height box has additive structure on the curve, and
      the coverage half becomes interesting independently of gamma.
    - >-
      The univariate small-root positive control fails. The instrument has no
      power, no gamma may be read from it, and the cell is UNTESTED.
    - >-
      A measured search advantage that is flat in p, or that survives on the
      relabelled Z/nZ control. Artifact, recorded as a controlled null.
    - >-
      Budget exhaustion before Stage 1 completes. Infrastructure outcome under
      AGENTS.md rule 5, never evidence about gamma.
  confounders:
    - >-
      NEGATION CLOSURE. The height box is closed under y -> -y, which forces
      c(-R) = c(R) and c(O) >= B. A null that is not negation-closed differs for
      that reason alone. This is why the matched null is drawn as a random
      x-SET, and it is the single most likely source of a spurious positive in
      the density half.
    - >-
      HEIGHT NORMALISATION. Symmetric versus asymmetric reduction of alpha, and
      whether beta is allowed to be negative, change c_H by a factor of order 1
      and change |F_H| by tens of per cent at small H. Every count here uses the
      normalisation frozen in the assumptions; a comparison across
      normalisations is not a comparison across bases.
    - >-
      TOY-SCALE BOX-TO-FIELD RATIO. At p = 10007, H = 10 the box holds 1.27 per
      cent of F_p, which is FAR larger than any cryptographic analogue and biases
      every density measurement toward apparent structure. Disclosed; the
      p-ladder is the only available defence and it is a weak one.
    - >-
      GAMMA IS A PROPERTY OF A DECLARED STRATEGY, NOT OF THE PROBLEM. A computed
      gamma bounds what the declared shift-polynomial set achieves. Reporting it
      as "the" small-root exponent would overclaim; the method_ceiling below
      states this as the hard limit of the design.
    - >-
      MEAN CONSERVATION. By KN-FIND-007 the mean decomposition count cannot
      distinguish any base from any other of the same size. A pipeline that
      reports agreement of MEANS as evidence that the box behaves randomly has
      measured nothing; the dispersion index and the unreachable-target count are
      the only informative statistics here.
    - >-
      Accidental smoothness of n and the anomalous case #E = p at toy scale,
      excluded per KN-TECH-034 before a curve enters the run set. The p = 10007
      cell has n = 9851 prime and n != p.
    - >-
      LATTICE HEURISTICS. Multivariate small-root methods are heuristic in the
      number of unknowns: a successful reduction can return algebraically
      dependent polynomials from which no root is recoverable. A reported LEAD
      must exhibit the recovered integers and verify the relation by direct point
      arithmetic.
  interpretation_limits:
    - >-
      KN-OPEN-020 CLASS, DECLARED: implicit-membership description. The record
      additionally notes that its defining condition is not algebraic over F_p
      at all -- membership is a statement about a lift to Z, decided by continued
      fractions -- so it is not merely outside the bounded-degree scoped class
      but outside the algebraic frame in which that class was posed. It does not
      claim the universal theorem KN-OPEN-020 asks for.
    - >-
      REPRESENTATION CLASS: R1 of RQ-ECDLP-623a32, the redundant-integer branch
      ("integer, digit, quadratic-order residue, redundant"). It is NOT the
      affine-coordinate-function family that this campaign's eight Stage 0
      calibrators of 2026-09-13 tested and rejected: the lens is a lift of one
      coordinate to Z^2, the operation set is a partial translation action rather
      than {[2]}, and the claim is about search cost rather than about a
      surrogate value.
    - >-
      Not F1 as lens (rho appears only as the mandatory baseline). F2 is a named
      component. Not F5: nothing is lifted p-adically; the lift here is of a
      residue class to Z, which is a different operation from lifting a point to
      Q_p. Not the Kummer line and not a degree-d function on E.
    - >-
      The conditional exponent of Claim B is a CONDITIONAL. Nothing in this
      record establishes an exponent improvement, established_exponent_gain is 0,
      and the record's own prediction is that the hypothesis of the conditional
      is false.
    - >-
      Claim A's density half is IDEA-20260905-ab4a6e's result in a different
      coordinate system and is credited, not claimed. The independent content of
      this record is the search side.
    - >-
      The frozen dispersion numbers were computed during ideation by exact
      enumeration over the whole group. They are a fixture to be independently
      recomputed, NOT an evidence record: no hypothesis status follows from them
      and authorized_runs is 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-c5f90d
      statement: >-
        For the height box F_H = {x in F_p : ht(x) <= H} with H = o(p^{1/2}), the
        induced curve base F = {P in E(F_p) : x(P) in F_H} behaves with respect
        to ADDITIVE statistics on E(F_p) like a uniformly random negation-closed
        base of the same size. Formally: the arity-m decomposition count c_m(R)
        over targets R has the same first two moments as for a uniformly random
        negation-closed base of size |F|, up to O(|F|^m * n^{-3/2}).
      rigorous_support: >-
        The first moment needs no heuristic at all: KN-FIND-007's conservation
        identity fixes the mean at C(B+m-1, m)/n exactly, whatever the base. The
        heuristic half is the SECOND moment -- that the height box has no
        additive structure on the curve beyond the random model. It imitates the
        classical statement that a Farey-type set of rationals of bounded height
        is equidistributed modulo p with square-root-cancellation error, the
        additive analogue of the Weyl/Kloosterman bounds for such sets.
      random_model_justification: >-
        Comparison law: the balls-in-bins distribution of the decomposition count
        for a uniformly random negation-closed base of the same size, whose
        dispersion index at the frozen cell is 2.9163 (range 2.7628 to 3.1316,
        seed 20260913, 60 draws). No smoothness law and no Dickman-de Bruijn
        statement is involved; the size function here is Archimedean height, not
        multiplicative smoothness, which is exactly the difference between this
        base and the F_p^* rational sieve.
      validation_plan: >-
        SAMPLE: the COMPLETE decomposition-count vector, over all n targets, for
        the height box at every H on a declared ladder, at three field sizes
        (p = 10007 exactly enumerable; p near 2^20 and 2^26 by the same exact
        enumeration with the group indexed once). SHORTCUT MAKING SAMPLING
        FEASIBLE: the whole group is indexed once by repeated addition of a
        generator, after which every decomposition count is an exact convolution
        -- no sampling error at all in the box measurement. COMPARISON
        DISTRIBUTION: the empirical dispersion index and unreachable-target count
        for 60 seeded negation-closed random bases per cell, compared by a
        two-sample test, with the frozen anchors 2.8875 against 2.9163 and 3704
        against 3712.3. TAIL CHECK: the maximum decomposition count and the
        count of targets with c_m = 0, which respond to clustering far more
        sharply than the variance. SAMPLED PARAMETERS RECORDED: p, a, b, n, H,
        normalisation, seed, draw count. TRANSFER ASSUMPTION, STATED: H1 is
        validated only at p <= 2^26 and H <= 32, and its use at cryptographic p
        with H = p^{1/(2m)} is an EXTRAPOLATION over more than 200 bits, labelled
        as one wherever it appears.
      falsification_condition: >-
        A dispersion index or unreachable-target count outside the matched null's
        range at the 1 per cent level, with the separation GROWING along the
        p-ladder. That is additive structure in the height box, it matters for
        coverage, and it would be reported as a finding independent of gamma.
    - id: H2-IDEA-20260913-c5f90d
      statement: >-
        There is no declared small-root method achieving gamma_m >= 1 for the
        homogenised arity-m box relation equation; formally, for the 9-monomial
        degree-4 support of the arity-2 form F(alpha_1, beta_1, alpha_2, beta_2)
        the achievable exponent satisfies gamma_2 < 1 strictly, and gamma_m is
        non-increasing in m because the per-variable degree of the homogenised
        f_{m+1} grows like 2^{m-2}.
      rigorous_support: >-
        The rigorous ingredient is the requirement side, which is exact algebra
        and computed above: the density condition forces the product of the 2m
        unknown bounds to equal n/c_H^m = p^{1+o(1)} for every m, and p is the
        uniqueness threshold for a single modular equation (below it a random
        equation has no box root, so a method that worked above it would be
        returning roots that need not exist). The heuristic half is that the
        achievable exponent for a given support is what the declared
        shift-polynomial strategy delivers -- the univariate anchor 1/d = 1/4 is
        rigorous (recalled), the multivariate extension is heuristic, and the
        record asks for the number rather than assuming it. It imitates the
        classical pattern that lattice small-root bounds degrade with the number
        of unknowns, the analogue of the Minkowski/LLL gap growing with
        dimension.
      random_model_justification: >-
        Comparison law: a RANDOM 9-monomial degree-4 form modulo p with the same
        support and random coefficients. The Semaev form must not do better than
        its random-support twin; if it does, the advantage is a property of the
        elliptic structure and is a finding in its own right, and if it does not,
        gamma_2 is a support-level quantity and transfers to every curve.
      validation_plan: >-
        SAMPLE: the support itself -- the computation is symbolic and exact, so
        the primary validation is a recomputation of the shift-polynomial set,
        the lattice dimension and its determinant, and the derived bound, for
        both the Semaev support and 100 seeded random-coefficient twins.
        SHORTCUT MAKING SAMPLING FEASIBLE: none needed for gamma_2; for the
        empirical half, PLANTED instances from the frozen cell (targets with a
        known box decomposition, available because the mean count is 1.93) let
        the lattice be tested at exactly the threshold without searching for
        instances. COMPARISON DISTRIBUTION: the achieved root bound against the
        predicted gamma, and against the rigorous univariate anchor p^{1/4} on
        the positive control. TAIL CHECK: the fraction of successful reductions
        that return algebraically DEPENDENT polynomials, which is the standard
        failure mode of multivariate small-root methods and must be reported
        rather than discarded. TRANSFER ASSUMPTION: gamma computed for arity 2
        and 3 says nothing about arity 5 except through the stated monotonicity,
        which is itself part of the heuristic and is separately falsifiable.
      falsification_condition: >-
        A declared, reproducible construction with gamma_2 >= 1 whose univariate
        positive control passes and whose recovered integers verify as a genuine
        curve relation. H2 is then false, and the conditional exponent of Claim B
        becomes the program's most important open lead.
    - id: H3-IDEA-20260913-c5f90d
      statement: >-
        The box constant c_H = |F_H|/H^2 converges to a limit of order 1 as
        H grows with H = o(p^{1/2}), so that B = c_H*H^2 with c_H bounded away
        from 0 and infinity, and the exponent bookkeeping of Claim A is unaffected
        by the constant.
      rigorous_support: >-
        Rigorous half: |F_H| <= (2H+1)*H trivially, and |F_H| >= (a positive
        constant)*H^2 for H = o(p^{1/2}) because distinct coprime pairs with
        |alpha| <= H, 1 <= beta <= H give distinct residues once H^2 < p/2. The
        heuristic half is only the existence of a limit and its value. It
        imitates the classical Farey-fraction count 6/pi^2 * (2H)*H for coprime
        pairs in a box, the standard density theorem for the same object over Z.
      random_model_justification: >-
        Comparison law: the Farey count with the coprimality density 6/pi^2,
        giving c_H -> 12/pi^2 = 1.216 in the asymmetric normalisation used here.
        The frozen exact counts are c_H = 1.438, 1.560, 1.306, 1.370, 1.270 at
        H = 4, 5, 6, 9, 10, which bracket that value and are consistent with slow
        convergence from above.
      validation_plan: >-
        SAMPLE: exact counts of |F_H| for all H up to 200 at three field sizes,
        which is a linear-time computation per H. COMPARISON DISTRIBUTION: the
        Farey prediction 12/pi^2 * H^2. TAIL CHECK: the largest H at which
        |F_H| still grows quadratically before saturating toward p, which locates
        the boundary of the H = o(p^{1/2}) regime empirically. TRANSFER
        ASSUMPTION: c_H enters the exponent bookkeeping only through c_H^m, which
        is p^{o(1)} for fixed m and is NOT p^{o(1)} if m grows with p -- a point
        the arity-5 crossover discussion must respect and which is recorded as a
        disclosed overhead below.
      falsification_condition: >-
        |F_H|/H^2 drifting outside [0.5, 3] for H up to 200 at any field size, or
        failing to stabilise, which would make the density bookkeeping of Claim A
        H-dependent in a way the exponent statement does not capture.
  target_complexity:
    time_exponent: >-
      CONDITIONAL: p^{2/m + o(1)} group-operation equivalents at arity m, IF
      gamma_m >= 1 (Claim B). That is p^{2/3} at m = 3 (worse than rho), p^{1/2}
      at m = 4 (a tie), and p^{2/5} = p^{0.4} at m = 5 (STRICTLY BETTER than rho
      by p^{0.1}), tending to p^{o(1)} as m grows. PREDICTED, i.e. the branch this
      record expects: NO IMPROVEMENT, because gamma_m < 1 makes the search fall
      back to the B^{m-1} = p^{(m-1)/m} enumeration and the total returns to
      p^{1+o(1)}. Both branches are stated because the record's value is in
      deciding which holds, and the deciding quantity is one symbolic
      computation.
    memory_exponent: >-
      B = p^{1/m} group elements for the base plus a sparse relation matrix with
      B rows of m nonzeros, i.e. p^{1/m} -- LESS memory than BSGS at every
      m >= 3, which is the one axis on which the conditional design is not
      dominated. Lattice memory per relation is polylog in p and polynomial in
      the lattice dimension, which grows with the shift-polynomial set and is
      charged as part of gamma's cost, not hidden.
    best_known: >-
      Pollard rho with distinguished points at about 0.886*sqrt(n) group
      operations and O(1) memory per processor; BSGS at 2*sqrt(n) time and
      sqrt(n) memory; van Oorschot-Wiener parallel rho at sqrt(n)/m wall clock on
      m processors; generic preprocessing frontier S*T^2 = n giving n^{1/3}
      online with n^{1/3} advice. Prime-field index calculus has no known
      advantage (KN-OPEN-001).
    best_known_comparator: >-
      Pollard rho; BSGS; van Oorschot-Wiener; the generic preprocessing frontier;
      IDEA-20260905-ab4a6e's norm-height reparametrisation prediction for the
      density half; KN-OPEN-020's bounded-degree scoped negative.
    hidden_overhead: >-
      Disclosed, and the first item is the honest killer of the conditional even
      if gamma_m >= 1 held. (i) THE c_H^m FACTOR: the density condition is
      H^{2m} = n/c_H^m, so the arity that makes the linear algebra cheap makes
      the constant exponential in m; at m = 5 with c_H = 1.3 the factor is 3.7,
      harmless, but an m growing with p turns c_H^m into a genuine
      sub-exponential term and the o(1) in p^{2/m + o(1)} is then NOT negligible.
      (ii) SEMAEV DEGREE GROWTH: the homogenised f_{m+1} has per-variable degree
      2^{m-2}, so the lattice dimension for a fixed strategy grows at least like
      the monomial count of a degree-2^{m-2} form in 2m variables -- polynomial
      in p^{o(1)} for fixed m, but with a constant that is astronomically large
      by m = 5 and is charged to gamma rather than swept into o(1).
      (iii) DESCENT IS NOT CHARGED because it is not in the design. (iv) The
      linear algebra is assumed sparse-solvable at B^2; the constant at m
      nonzeros per row is small but real. (v) Recovery of the base's own discrete
      logarithms from the kernel is charged at the usual index-calculus rate and
      assumes the matrix has full rank minus one, which at B = p^{1/m} and B
      relations is a near-square system and may need a constant factor more
      relations.
    tradeoff_note: >-
      The conditional design trades memory DOWN and time UP relative to BSGS:
      p^{1/m} memory against p^{1/2}, with time p^{2/m} against p^{1/2}. The
      crossover in time is m = 4 and in memory m = 2. Parallelisation: relation
      searches are embarrassingly parallel (each is an independent lattice
      reduction) and the sparse linear algebra is not, the usual index-calculus
      position, recorded rather than claimed as an advantage. Against
      van Oorschot-Wiener's linear speedup on m processors the conditional design
      offers the same linear speedup on the relation phase only.
    cost_model: >-
      One unit = one group operation on the frozen curve; lattice work is
      converted at the declared field-multiplication rate and reported separately
      so the two are never silently mixed. Stage 0 is exact integer arithmetic
      over two toy cells plus one full group enumeration at n = 9851. Stage 1 is
      symbolic and needs no curve. established_exponent_gain = 0.
    data_query_cost: >-
      Every membership test, relation trial and lattice reduction is charged. No
      oracle queries and no preprocessing advice.
    established_exponent_gain: 0
  estimated_cost:
    implementation: medium
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Stage 0 is seconds of exact arithmetic. Stage 1 is a symbolic
      shift-polynomial and lattice-determinant computation needing no curve and
      no sampling -- the cheapest exponent-level discriminator in this campaign.
      Stages 2 and 3 are hours of a single core with an LLL implementation.
    dominant_cost: >-
      The lattice reductions in Stage 2, whose dimension is set by the declared
      shift-polynomial strategy.
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      gamma_m, the small-root exponent achievable for the homogenised arity-m box
      relation equation, against the requirement gamma_req = 1 forced by the
      density condition. Every cost statement in this record is a function of
      that one quantity, and the requirement side is exact algebra while the
      achievable side is one symbolic computation nobody in this program has
      performed.
    baseline_embedding:
      parameter_slice: >-
        H = (4p/3)^{1/2}: the box is ALL of F_p, membership is vacuous, the
        density condition is trivially satisfied at m = 1, and the algorithm
        degenerates to exhaustive enumeration at cost p. H = 1: the box is
        {0, 1, -1}, B = O(1), no target decomposes, and the algorithm never
        terminates -- the cost formula must return infinity rather than a small
        number. m = 1: the base must contain the target itself, so the relation
        search IS the ECDLP and the charge is p.
      reproduction_check: >-
        Symbolic plus a frozen fixture: the cost formula max(B*search, B^2) must
        return p at the H-maximal end and at m = 1, and must diverge at H = 1,
        without special-casing any end. A formula that does not reproduce all
        three is not a cost model. Additionally the Stage 0 f_3 check IS the
        baseline reproduction for the relation condition: 6441 realisable triples
        at p = 101 with zero errors in both directions.
    observation_collision:
      observable: >-
        The arity-2 decomposition-count vector and its summary statistics (mean,
        dispersion index, unreachable-target count).
      distinct_preimage_search: >-
        REQUIRED AND ALREADY SUCCESSFUL, which is the single most important audit
        in this record. At the frozen cell the height box gives dispersion 2.8875
        and 3704 unreachable targets; a matched negation-closed RANDOM base of
        the same size gives 2.9163 (range 2.7628 to 3.1316) and 3712.3. Two
        structurally unrelated bases produce the same observation, so THE DENSITY
        OBSERVABLE DOES NOT IDENTIFY THE HEIGHT BOX and no claim may be founded
        on it -- the mean cannot separate them by KN-FIND-007, and the frozen
        numbers show the second moment does not either. The separating quantity
        must be the search cost, which is why gamma and not coverage is the
        bottleneck. Any successor that reports a coverage advantage has collided
        with the null and must say so.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "F_p has no size function" by "F_p has the
          rational-reconstruction height; what does that size function cost".
          Encoding: exact, since ht is single-valued and polylog-computable, and
          the height-minimal lift is unique off a measure-zero tie set (ties
          broken by a declared rule). Completeness: exact -- every x has
          ht(x) <= (4p/3)^{1/2}. Soundness: spent on nothing; the reduction is an
          identity. Cost loss: the whole question moves onto gamma_m, which is
          computable.
        predicted_gain: >-
          Turns a qualitative diagnosis into one symbolic computation, and yields
          the requirement-side exponent 1 for free.
      - transform: constraint_transfer
        proposed_object: >-
          Transfer the relation condition from F_p to Z: a box relation is an
          integer solution of one modular equation in 2m unknowns, so the
          relation search becomes a small-root problem rather than a Groebner
          problem. Encoding: exact after homogenisation (the 9-monomial form).
          Soundness: a recovered root must be verified by direct point arithmetic,
          which is cheap, so no false relation can enter the matrix.
        predicted_gain: >-
          Replaces the step that prime-field index calculus is universally agreed
          to fail at with a step that has a published cost theory, and thereby
          makes the failure measurable instead of asserted.
      - transform: observable_fiber
        proposed_object: >-
          Hold the density observable fixed and vary the forgotten structure
          (height box versus matched negation-closed random base). The intrinsic
          invariant distinguishing them is the existence of a low-dimensional
          integer lattice containing the base's lifts; the random base has none.
        predicted_gain: >-
          Identifies search, not coverage, as load-bearing, and supplies the
          known-false control for any coverage-based claim.
    quantifier_order: >-
      FOR ALL odd primes p, FOR ALL H with 1 <= H <= (4p/3)^{1/2}, THERE EXISTS a
      base F of size c_H*H^2 whose membership is decided in polylog(p) time; and
      FOR ALL arities m, the density condition B^m ~ n IMPLIES that the product of
      the 2m unknown bounds is n/c_H^m. Both are universal statements with an
      exact existential in the middle, and both are proved by computation, not
      assumed. The cost claim is strictly weaker and is stated separately: FOR
      the declared shift-polynomial strategies, THERE EXISTS a computable
      gamma_m, and gamma_m < 1 is a PREDICTION about those strategies. THE
      READING NOT CLAIMED: "FOR ALL small-root methods, gamma_m < 1", which no
      computation in this design can establish and which the LEAD branch is
      allowed to refute.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the declared supports, shift-polynomial strategies and
        lattice implementations, the achievable small-root exponent is [these
        numbers] against a requirement of 1, the univariate positive control
        passed, and no declared strategy reached the threshold". It can NEVER
        certify that no small-root method reaches gamma = 1, because that is a
        statement about all methods; and it certifies nothing about the ECDLP
        beyond the tested cells.
      nearby_object_control: >-
        TWO controls in opposite directions. (1) THE OBJECT WHERE THE HOPED-FOR
        CONCLUSION HOLDS: the univariate degree-4 modular equation with a root
        below p^{1/4}, where small-root solving provably works. A pipeline that
        fails there has no power, and every negative read from it is
        inadmissible. (2) THE OBJECT WHERE IT FAILS: a RANDOM 9-monomial
        degree-4 form modulo p with the same support and the same bounds, which
        has a box root with probability of order 1 by counting but carries no
        elliptic structure. If the pipeline solves the random form at the
        threshold, gamma is a property of the support and not of the curve, and
        any curve-specific claim is refuted before it is made.
    proof_obligations:
      - claim: >-
          f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) vanishes exactly on realisable
          x-triples: 6441 triples at (p, a, b) = (101, 3, 5), zero false
          negatives, zero false positives.
        responsibility: baseline
      - claim: >-
          |F_H| counts and c_H values at H = 4, 5, 6, 9, 10; B = 138 and
          n = 9851 at (p, a, b) = (10007, 1, 28); H^4/p = 0.99930.
        responsibility: baseline
      - claim: >-
          The homogenised arity-2 form has exactly 9 monomials of total degree 4
          with the stated coefficients.
        responsibility: size_bounds
      - claim: >-
          The density condition forces the product of the 2m unknown bounds to
          equal n/c_H^m for every m.
        responsibility: size_bounds
      - claim: >-
          pi = (ht, box indicator) is lossy, propagates only under Sigma on the
          decomposable sub-domain, and is therefore Class I and not a block
          system of the full translation action.
        responsibility: correctness
      - claim: >-
          The conditional total is max(B*search, B^2) = p^{2/m} at gamma_m >= 1,
          with the crossover against 0.886*sqrt(n) at m = 4.
        responsibility: runtime
      - claim: >-
          Membership, relation search, linear algebra, time and memory are all
          charged; descent is excluded by design rather than by omission; no
          false relation can enter the matrix because every recovered root is
          verified by point arithmetic.
        responsibility: interface
      - claim: >-
          No transfer off the frozen cells and the declared ladder; the
          cryptographic-scale statement is an extrapolation over more than 200
          bits and is labelled as one.
        responsibility: scope
    not_applicable_reason: null
  dominated_by:
    status: dominated
    checked_rows:
      - name: Pollard rho with distinguished points
        time: about 0.886*sqrt(n) group operations
        memory: O(1) per processor
        data: one target plus walk queries
      - name: BSGS
        time: about 2*sqrt(n)
        memory: about sqrt(n)
        data: about sqrt(n) stored points
      - name: van Oorschot-Wiener parallel rho
        time: sqrt(n)/m wall clock at m processors, sqrt(n) serial-equivalent
        memory: charged distinguished-point store
        data: walk queries
      - name: Automorphism-discounted rho (KN-TECH-018)
        time: sqrt(n/|Aut|), at most sqrt(6) better
        memory: O(1) per processor
        data: walk queries
      - name: Generic preprocessing frontier S*T^2 = n
        time: n^{1/3} online
        memory: n^{1/3} advice
        data: n^{1/3} advice
      - name: Multi-target rho
        time: sqrt(T*n) for T targets
        memory: distinguished-point store
        data: T targets
      - name: Prime-field index calculus (KN-OPEN-001)
        time: no known advantage over sqrt(n)
        memory: factor-base and matrix storage
        data: relation trials
      - name: This record, PREDICTED branch (gamma_m < 1)
        time: p^{1+o(1)}
        memory: p^{1/m}
        data: every membership test, relation trial and reduction charged
      - name: This record, CONDITIONAL branch (gamma_m >= 1, m = 5)
