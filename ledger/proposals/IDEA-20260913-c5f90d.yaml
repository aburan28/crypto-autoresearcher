        memory: p^{0.2}
        data: every membership test, relation trial and reduction charged
    missing_comparisons:
      - >-
        No numerical Pareto sweep was run; the comparison is by formula at
        matched n.
      - >-
        The Pollard kangaroo interval baseline is not tabulated because this
        record mounts no interval attack.
      - >-
        Quantum baselines are out of scope for this record and are not
        tabulated; a reviewer comparing against Shor should read the scope
        statement rather than this table.
    note: >-
      The PREDICTED branch is dominated on time by every row above; it is NOT
      dominated on memory by BSGS or by the preprocessing frontier at m >= 3,
      which is disclosed as the one axis where the design is not worse. The
      CONDITIONAL branch at m = 5 would dominate every classical row on both
