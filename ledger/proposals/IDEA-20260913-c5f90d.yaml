idea:
  id: IDEA-20260913-c5f90d
  title: >-
    F_p DOES HAVE A SIZE FUNCTION AND IT PUTS PRIME-FIELD INDEX CALCULUS EXACTLY
    ON THE SMALL-ROOT BOUNDARY: taking the factor base to be the points whose
    x-coordinate has rational-reconstruction height at most H makes membership
    polylog and non-algebraic, but the density condition |F|^m ~ p forces the
    arity-m relation search to be ONE modular equation in 2m integer unknowns
    whose PRODUCT OF BOUNDS IS p^{1+o(1)} FOR EVERY m -- so the exponent 2/m,
    which beats sqrt(p) from arity 5 onward, is available if and only if
    small-root solving works AT the uniqueness threshold, and the achievable
    exponent gamma_m for the exact 9-monomial support of the homogenised
    Semaev cubic is one number this program has never computed
  class: mechanism
  claim: >-
    OBJECT FRAME. Representation: the height-minimal rational representative of
    the x-coordinate -- for x in F_p, the pair (alpha, beta) of integers with
    alpha = x*beta mod p minimising max(|alpha|, beta). This is class R1 of
    RQ-ECDLP-623a32 (a redundant integer representation of a coordinate), and it
    is explicitly NOT a cheap function of the affine pair (x, y): it is a lift of
    ONE coordinate to Z^2, computed by continued fractions. Operation set:
    Sigma = {tau_{P_i} : P_i in F}, translation by factor-base points ONLY, where
    F = {P in E(F_p) : ht(x(P)) <= H}. Sigma is a PROPER SUB-ACTION of
    translation, which is what makes the object Class I and not Class III.
    ATTACK STAGE CLAIMED: relation decomposition (the SEARCH for a relation), with
    factor-base membership as a secondary, priced at polylog.
    CLAIM (A), EXACT AND CHEAP. Write B = |F| and n = #<P>. The number of arity-m
    ordered decompositions of a uniformly random target has mean exactly B^m/n by
    the conservation identity of KN-FIND-007, so a relation exists for a typical
    target only when B^m >~ n. With B = c_H * H^2 (c_H measured between 1.27 and
    1.56 for H = 4..10, exact counts frozen below), this forces
    H^{2m} ~ p / c_H^m: the box side is H = p^{1/(2m)+o(1)}. The 2m integer
    unknowns (alpha_i, beta_i) of an arity-m relation are each bounded by H, so
    the PRODUCT OF THE UNKNOWN BOUNDS IS H^{2m} = p^{1+o(1)}, INDEPENDENTLY OF m.
    That is the exact uniqueness threshold of a single modular equation: below it
    a random equation has no box solution, at it there are O(1), and above it the
    density condition fails in the other direction. The relation search is
    therefore pinned at the small-root boundary for EVERY arity, and no choice of
    m moves it off.
    CLAIM (B), THE CONDITIONAL EXPONENT, STATED AS A CONDITIONAL. Define
    gamma_m = sup{gamma : a declared small-root method returns a box solution of
    the homogenised arity-m relation equation whenever the product of the
    unknown bounds is at most p^gamma}. IF gamma_m >= 1 for some m, THEN one
    relation costs polylog(p), B = p^{1/m} relations are needed, sparse linear
    algebra costs B^2 = p^{2/m}, and the end-to-end cost is
    p^{2/m + o(1)} group-operation equivalents -- WORSE than rho at m <= 3, a TIE
    at m = 4, and STRICTLY BETTER from m = 5 (p^{0.4} against p^{0.5}). This
    would be an asymptotic exponent move on the prime-field ECDLP and it is
    stated here as exactly what it is: a conditional whose hypothesis this
    record predicts is FALSE.
    CLAIM (C), THE PREDICTED BRANCH AND THE OBSTRUCTION IT NAMES. The record
    predicts gamma_m < 1 strictly for every m >= 2, and predicts that gamma_m
    DECREASES in m because the homogenised Semaev polynomial has degree 2^{m-2}
    per variable and the achievable small-root exponent falls as degree and
    variable count grow. The two-sided squeeze -- a requirement constant at 1 and
    an achievable exponent decreasing in m -- is a NAMED, COMPUTABLE obstruction
    for the whole size-function lane, not a fatigue count: it says that a size
    function on F_p exists and is the wrong shape, because the arity that makes
    the linear algebra cheap is exactly the arity that makes the search hard.
    gamma_2 for the exact support recorded below is computable at ZERO compute
    and is the single deliverable this record asks for.
    CLAIM (D), THE CONTROLLED NULL, ALREADY ANCHORED. On the frozen cell
    (p = 10007, a = 1, b = 28, n = 9851, H = 10) the height box gives B = 138
    base points, mean 1.9332 ordered decompositions per target, dispersion index
    2.8875 and 3704 unreachable targets; a matched negation-closed random base of
    the same size gives dispersion 2.9163 (range 2.7628 to 3.1316 over 60 seeded
    draws) and 3712.3 unreachable targets on average. The height box is
    INDISTINGUISHABLE from its matched null on the density observable. Coverage
    is therefore NOT where the size function could pay; the search is.
  mechanism: >-
    WHY A SIZE FUNCTION IS THE RIGHT THING TO WANT. Index calculus over F_p^*
    works because Z has a size function compatible with multiplication: a
    residue class has small representatives, small integers factor into small
    primes, and the rational sieve reads relations off that hierarchy. The
    standard diagnosis of prime-field ECDLP (KN-OPEN-001) is that no such size
    function exists on the curve. That diagnosis is HALF TRUE and this record
    makes the other half precise. F_p carries a perfectly good size function:
    the rational-reconstruction height ht(x) = min{max(|alpha|, beta) :
    alpha = x*beta mod p, beta >= 1}. By Minkowski applied to the rank-2 lattice
    {(alpha, beta) : alpha = x*beta mod p} of determinant p, every x has
    ht(x) <= (4p/3)^{1/2}, the height is computed in polylog time by the
    continued-fraction expansion of x/p, and the box F_H = {x : ht(x) <= H} has
    |F_H| = c_H * H^2 with c_H of order 1. So the base has a description of
    O(log p) bits, membership costs polylog, and the base is NOT cut out by any
    bounded-degree algebraic condition over F_p -- the defining condition is a
    statement about a LIFT to Z. That is the escape route KN-OPEN-020 leaves
    open, taken concretely.
    THE OBJECT AND ITS OPERATION SET, NAMED. The tracked object is
    pi(P) = ht(x(P)) together with the box indicator 1[ht(x(P)) <= H]. Under the
    FULL translation action pi does not propagate at all -- adding an arbitrary
    point randomises the height completely, which is exactly the rigidity of
    IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C. pi propagates only along
    Sigma = translation by base points, and only on the sub-domain of
    box-decomposable targets, where the propagation rule is the relation-vector
    increment. THE OBJECT IS THEREFORE CLASS I, PARTIAL ACTION, in the
    trichotomy of IDEA-20260806-c5d183 -- one line reason: the retained datum
    propagates deterministically only under translation by the factor base, a
    proper sub-action of translation, and is undefined off the decomposable
    sub-domain.
    LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET. (i) WHAT IS
    DISCARDED: pi retains about (1/2)log_2 p of the log_2 p bits of a point --
    the image of ht has size at most (4p/3)^{1/2}, and y(P) is discarded
    entirely. The projection is genuinely lossy in the representation actually
    used: at the frozen cell p = 10007, H = 10, the box holds 127 of 10007 field
    elements, and 69 of those are on-curve x-values carrying 138 points, so pi
    collapses 9851 group elements onto a 138-element base plus one bottom
    symbol. (ii) COMPATIBILITY WITH Sigma: the discard is NOT a block system of
    the full translation action -- it cannot be, by Theorem C -- and this record
    does not claim it is. It is compatible with Sigma in the partial-action
    sense: on the decomposable sub-domain, translation by a base point maps a
    relation vector to a relation vector with one coordinate incremented, which
    is a deterministic rule on the retained datum. The branching bound is stated
    rather than asserted away: a target has on average B^m/n decompositions
    (1.9332 at the frozen cell), so the forward map is one-to-many with measured
    mean branching 1.93 and dispersion index 2.8875, and the record charges the
    search over those branches rather than pretending it is single-valued.
    (iii) NOT A CHANGE OF COORDINATES: the height-minimal lift (alpha, beta) by
    itself IS a bijection and would be a change of coordinates, which is why the
    tracked object is the HEIGHT and the box indicator, not the lift.
    THE ONE OPEN NUMBER. For a partial action the priced quantity is the cost of
    the partial step, here the cost of FINDING a relation given that one exists.
    Homogenise: put x_1 = alpha_1/beta_1 and x_2 = alpha_2/beta_2 into Semaev's
    f_3 and clear denominators. Using the verified expansion
    f_3(x_1, x_2, x_3) = (e_2 - a)^2 - 4*e_1*(e_3 + b) with e_i the elementary
    symmetric functions of (x_1, x_2, x_3), the coefficient of x_1^i x_2^j is
    nonzero for all nine (i, j) in {0,1,2}^2, so
    F(alpha_1, beta_1, alpha_2, beta_2) = beta_1^2 beta_2^2 *
    f_3(alpha_1/beta_1, alpha_2/beta_2, x_3) is an integer form of total degree 4
    in 4 unknowns with EXACTLY 9 MONOMIALS and bidegree (2,2), and the relation
    condition is F = 0 mod p with all four unknowns bounded by H. The open number
    is gamma_2, the small-root exponent achievable for THAT support, against the
    requirement H^4 = p. At the frozen cell H^4 = 10000 and p = 10007, i.e.
    H^4/p = 0.99930: the instance sits on the threshold to four digits, which is
    not a coincidence but the density condition.
    EXTERNAL STRUCTURAL INGREDIENT, NAMED AND MARKED. The ingredient that would
    make the search cheap is the small-root machinery over Z -- Coppersmith's
    lattice method and the Jochemsz-May strategy for choosing a shift-polynomial
    set from a monomial support. This is cited as `recalled` and is NOT presented
    as checked support: the record's Stage 1 is precisely to COMPUTE the bound
    that machinery gives for the 9-monomial support above, and the honest
    position until then is that gamma_2 is unknown to this program.
    WHAT IS ADDED OVER THE COMPONENTS IT USES. F2 (factor-base decomposition and
    Semaev) is used as a COMPONENT and named: f_3 supplies the relation
    condition. What is added is (i) a factor base whose membership is
    non-algebraic and polylog rather than an algebraic condition adjoined to the
    summation system, (ii) the replacement of Groebner-basis relation search --
    which over prime fields is the step everyone agrees is hopeless -- by an
    integer small-root search, and (iii) the exact bookkeeping showing the
    product of bounds is pinned at p for every arity, which converts "prime-field
    index calculus has no known advantage" from a summary of failures into one
    computable exponent. The nearest internal record, IDEA-20260905-ab4a6e,
    prices the DENSITY of a quadratic-order box base (its |pi| = p^{1/2} against
    B^4 = p bookkeeping is the same dimensionless ratio recovered here, and the
    density half of this record's Claim A is credited to it, not claimed). It
    does not price the SEARCH, and the search is the load-bearing half.
