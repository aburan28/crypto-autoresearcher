  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-23'

  title: >-
    THE WALK'S IN-DEGREE VARIANCE IS A TABLE CONSTANT: an r-adding walk has
    in-degree Binomial(r, 1/r) with variance sigma^2 = 1 - 1/r, not the
    Poisson(1) assumed by IDEA-20260906-aed829 and IDEA-20260906-cf3b76; every
    basin and coverage law of the program's instrument then holds with a
    replaced by sigma^2 a, so the oracle constant is T L^2 = 1.64 N / sigma^2,
    the r-adding walk pays r/(r-1) in stored entries at fixed online cost,
    and the uninterpreted r_walk = 16 rejection of EV-ECDLP-31e91c has a
    predicted size -- plus a closure: in the generic group model no one-
    operation label-indexed walk reaches sigma^2 = 1, and buying sigma^2 > 1
    by successor look-ahead costs a net factor (2k - 1)
  class: control

  claim: >-
    (A) THE LAW (derivation of this record). For a walk f(x) = g_{h(x)}(x) with
    bijections g_1..g_r (r-adding: g_j(x) = x + M_j) and an index h read from
    the point's label, the in-degree of y is K(y) = sum_j 1[h(g_j^{-1}(y)) = j].
    With h a keyed hash of the label, the r preimages are distinct points whose
    labels are independent, so K ~ Binomial(r, 1/r): mean 1, variance
    sigma^2 = 1 - 1/r. Thinned by distinguished points of density theta, a
    surviving node's offspring is Binomial(r, (1 - theta)/r): mean 1 - theta,
    variance (1 - theta)(1 - (1 - theta)/r). The near-critical total-progeny
    law (the same step IDEA-20260906-cf3b76 uses) then has body
    (2 pi sigma^2)^{-1/2} n^{-3/2} and cutoff exp(-n/(2 sigma^2 W^2)); its mean
    is still exactly W (mass conservation), and under x = n/(sigma^2 W^2) the
    size-biased law is IDENTICAL to the Poisson one while the number of DPs
    per unit x picks up 1/sigma^2. Consequence: every closed form of aed829
    holds with a -> sigma^2 a -- oracle ceiling C_max(sigma^2 a), unselected
    coverage 1 - (1 + 2 sigma^2 a_m)^{-1/2}, and the oracle online constant
    min T L^2 = 1.64 N / sigma^2 (attained at a near 0.25/sigma^2).
    (B) PREDICTED SIZES (model values, this record's arithmetic, +-0.003). At
    a = 1/4, top-T share deficit of the r-adding walk against a random
    function, C_max(1/4) - C_max((1 - 1/r)/4): r = 2: 0.119; r = 4: 0.052;
    r = 8: 0.025; r = 16: 0.012; r = 32: 0.006; r = 256: 0.001. Stored entries
    needed at the optimal a for fixed L: factor r/(r - 1), i.e. 2.00, 1.33,
    1.14, 1.067, 1.032, 1.004.
    (C) CONSISTENCY WITH COMMITTED DATA (not evidence for this record).
    EV-ECDLP-31e91c's curve arm at r_walk = 16 reports a generic-minus-curve
    top-T share at a = 1/4 of 0.0198 [0.0005, 0.0390] and a survival-slope
    difference of 0.0019 [-0.0063, 0.0101], with KS on exact basin multisets
    rejecting at alpha = 0.01 in 3/3 seeds, recorded as "a walk-quality
    observation ... not interpreted here". The law predicts a deficit of 0.012
    (inside that interval), an unchanged body slope (the n^{-3/2} body is
    sigma-free), and a 6% shift of the cutoff 2 sigma^2 W^2 (a multiset-level
    difference a KS test can see). At r_walk = 32 it predicts 0.006, consistent
    with "most constants' differences include 0". The small-r cells (r = 2, 4),
    where the predicted effect is 5-20x the seed spread, have never been run.
    (D) THE CLOSURE. Raising sigma^2 would lower the table constant. In the
    generic group model it cannot be done by any walk of this form: the
    indicators 1[h(g_j^{-1}(y)) = j] depend on the labels of distinct elements
    (or are mutually exclusive when preimages coincide), so
    Var K <= sum_j p_j (1 - p_j) = 1 - sum_j p_j^2 <= 1 - 1/r, with equality
    iff h is uniform; r-adding with uniform h is already optimal and 1 is
    reached only as r -> infinity. Paying extra operations does not help: the
    best-of-k look-ahead walk (evaluate k candidate successors, move to the
    one of smallest hash) has in-degree given H(y) = u approximately
    Poisson(k (1 - u)^{k-1}), hence sigma^2 = k^2/(2k - 1), but costs k group
    operations per step, so T L_ops^2 >= 1.64 N k^2/sigma^2 = 1.64 N (2k - 1):
    strictly worse for every k >= 2. A cheap look-ahead would need a lossy
    projection pi with pi(z + M_j) computable from pi(z), i.e. a non-trivial
    block system of the translation action, which a prime-order group does not
    have (IDEA-20260901-863e36; KN-FIND-ffe1df Theorem C, exact case).
    FORWARD GUIDANCE: stateful walks, approximate (non-exact) correlations of
    the kind KN-FIND-ffe1df leaves open, and non-generic label relations --
    e.g. x(P + Q) + x(P - Q) is a cheap rational function of x(P), x(Q) -- are
    the classes this closure does not cover.
    (E) WHY IT MATTERS HERE. It is a free ~3% (r = 32) to ~7% (r = 16) of
    stored entries for every table design on this RQ (use r >= 256), it
    corrects an assumption two open proposals carry, and it gives the
    instrument a graded positive control (the r-ladder) that a measurement of
    small constant-factor effects currently lacks. It also bears on
    completion criterion C2: if the Bernstein-Lange experiments used a
    finite-r walk (NOT verified -- the primary text was unreachable in this
    session), part of the 1.705-1.727 versus 1.79 fixture residual that the
    goal attributes to O(theta) is a sigma^2 term (predicted +1.6% in L at
    r = 32, +3.3% at r = 16), and an O(theta)-only correction would then
    under-shoot.

  mechanism: >-
    STEP 0 (zero compute; validator). Re-derive the Binomial in-degree law, the
    a -> sigma^2 a rescaling (including E[n] = W independent of sigma), the
    generic-model variance bound 1 - sum p_j^2, the look-ahead identity
    sigma^2 = k^2/(2k - 1), and the deficit table of claim (B) from the aed829
    C_max formula.
    STEP 1 (minutes of CPU; existing instrument). On the EXP-ECDLP-869870
    exact-basin code at N in {2^20, 2^22, 2^24}: arms (i) the keyed random
    function (sigma^2 = 1 - 1/N, the null), (ii) an r-adding walk on Z/N with a
    keyed-hash partition of the integer label and random M_j, r in
    {2, 3, 4, 8, 16, 32, 256, 4096}. Per arm and seed: the exact in-degree
    histogram and its variance; the basin-size survival function with body
    slope and cutoff fitted by the instrument's own estimator; the exact top-T
    share at a in {1/8, 1/4, 1/2}; the unselected coverage at a_m in
    {1/4, 1, 4}; the Bernstein-Lange static (pool ratio 2) exact coverage.
    Five seeds; generic-minus-walk differences with seed-bootstrap intervals.
    STEP 2 (hours; curve transfer). TOY-P24-a6ee37f9 (EV-ECDLP-31e91c) with
    r in {4, 8, 16, 32, 256}, exact basins, three seeds, certificates on every
    solved online walk.
    STEP 3 (optional closure check). Look-ahead k in {2, 4} on Z/N: measured
    sigma^2 against k^2/(2k - 1) and coverage per group operation against the
    predicted (2k - 1) loss.
    OBJECT FRAME. Representation: the point's label; operation set: the walk
    step g_{h(x)}. The tracked object is the pair (mean, variance) of the
    DP-thinned offspring law -- cf3b76's object -- with the correction that the
    r-adding step changes its variance. Trichotomy: coordinate-dependent (the
    index h reads the label), priced exactly by sigma^2.

  novelty_status: unverified

  novelty_screen:
    kb_index: >-
      crypto-kb MCP tools not exposed in this session; corpus grepped.
    corpus_grepped: >-
      IDEA-20260906-cf3b76 for Binomial / 1 - 1/r / r-adding / in-degree law /
      sigma^2; IDEA-20260906-aed829 (lines 1-260 read); EV-ECDLP-31e91c and
      EV-ECDLP-60e266 for r_walk and curve-versus-generic cells.
    results: >-
      cf3b76 states "the Poisson(1) in-degree law of r-adding walks" as an
      assumption (its line 170) and names in-degree-law changes only for
      non-injective steps, so the finite-r variance is not in the corpus.
      aed829's H1 is the random-function heuristic. EV-ECDLP-31e91c records the
      r_walk = 16 rejection and deliberately does not interpret it;
      EV-ECDLP-60e266 records the r = 32 curve arm (top-T share / C_max 1.013,
      1.031, 0.986 over 3 seeds; STATIC(T) curve-minus-generic -0.017 with a
      CI containing 0), which cannot resolve the predicted 0.984 ratio.
    external: >-
      The corresponding statement for rho -- r-adding walks need about
      1/sqrt(1 - 1/r) times the random-mapping collision time -- is recalled
      (Brent-Pollard-type heuristic; Teske; Blackburn-Murphy; Bernstein-Lange,
      "Two grumpy giants and a baby") and NOT retrieved here. This record's
      content is the transfer of that variance to the PRECOMPUTATION constant
      (exponent 1 in sigma^2 rather than 1/2), the generic-model variance
      bound, the look-ahead cost identity, and the predicted cells on the
      program's own instrument.
    verdict: >-
      UNVERIFIED. The rho-side fact is probably standard; its precomputation
      form may appear in Bernstein-Lange's own discussion of walks, which could
      not be opened (cr.yp.to returned HTTP 502; the eprint PDF was not
      parseable here).

  discriminated_from:
    - >-
      IDEA-20260906-cf3b76: predicts ZERO effect for point-local distinguishing
      rules at fixed W and assumes Poisson(1) in-degree for r-adding walks.
      This record changes the WALK (r), not the rule, and predicts a NONZERO,
      graded effect; the two are complementary and cf3b76's arms should be run
      at r >= 256 so its zero is not contaminated by a 1/r term.
    - >-
      IDEA-20260920-5b1f84: an r-ladder control for rho mixing on E(F_{p^5})
      (1 + 1/(2r) in steps-to-solve). Same variance, different quantity
      (collision time versus stored-table constant) and different field.
    - >-
      IDEA-20260906-aed829 / IDEA-20260906-ac100b: supply the closed forms that
      this record rescales; their numbers are the r -> infinity limit.

  object_first_candidate:
    tracked_object: >-
      THE OFFSPRING VARIANCE sigma^2 of the DP-thinned functional graph,
      followed across walk families at fixed W.
    lossiness: >-
      GENUINELY LOSSY: one number summarises the walk; the multipliers M_j, the
      hash and the labels are forgotten.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED: every coverage law of the instrument is a
      function of (a, sigma^2) through sigma^2 a alone, so a change of walk
      propagates to every reported constant deterministically through one
      number. Not a change of coordinates.
    survival_score: >-
      NEW relative to the corpus (corrects a stated assumption). TESTABLE in
      minutes on an existing instrument. SURVIVES every one-operation
      label-indexed walk; dies for stateful walks and for walks whose labels
      carry exploitable algebraic relations (the forward classes).

  null_object_control: >-
    MANDATORY. NULL: the keyed random function and the r = 4096 walk must agree
    within seed spread on every constant (sigma^2 differs by 2.4e-4). GRADED
    CONTROL: the generic-minus-walk deficit must be monotone in 1/r across the
    ladder; a flat ladder at r <= 4 falsifies the record. PROVES-TOO-MUCH:
    a "fresh successor" walk whose step M is a keyed hash of (label, j) (a
    random function in disguise) must return sigma^2 = 1 and zero deficit at
    every r. DECAY: replace the r-adding step by a fresh random successor with
    probability lambda in {0, 0.25, 0.5, 0.75, 1}; the deficit must interpolate
    linearly in the implied sigma^2 = 1 - (1 - lambda)^2/r to leading order.
    THETA SEPARATION: at fixed r, vary theta (W in {64, 128, 256} at 2^24) so
    the O(theta) term the goal already carries is separated from the 1/r term.

  assumptions:
    - The partition h is a keyed hash of the label, independent across distinct points (true for the instrument by construction; heuristic on a curve).
    - The M_j are random known multiples; no M_j equals another or its negative (so no fruitless short cycles).
    - The near-critical branching approximation of IDEA-20260906-ac100b (Lemmas 1-3) holds with Binomial offspring in place of Poisson.
    - Uniform independent targets; cap 8W as in the instrument.

  proof_search_map:
    bottleneck: >-
      Whether the offspring variance of the r-adding walk, and nothing else at
      leading order, sets the table constants' r-dependence.
    baseline_embedding:
      parameter_slice: >-
        r -> infinity (sigma^2 -> 1) is exactly aed829's instrument; the
        keyed random function is that slice realised.
      reproduction_check: >-
        The r = 4096 arm must reproduce the random-function constants within
        seed spread (frozen regression cell).
    observation_collision:
      observable: >-
        The generic-minus-walk top-T share deficit and the fitted cutoff.
      distinct_preimage_search: >-
        An O(theta) effect and a 1/r effect can give the same deficit at one
        (W, r) cell; the theta sweep at fixed r separates them. Higher-order
        anti-collision structure of additive walks (short relations among the
        M_j) could mimic a larger sigma^2 effect at r = 2, 3; the fresh-
        successor proves-too-much arm and the residual after rescaling
        separate them.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: The pair (mean, variance) of the offspring law in place of the mean alone.
        predicted_gain: One scaling law covering every walk family, replacing per-walk measurements.
      - transform: observable_fiber
        proposed_object: >-
          Walks with equal sigma^2 but different structure (r-adding at r = 16
          versus a lambda-mixed walk tuned to sigma^2 = 15/16).
        predicted_gain: >-
          Equal constants within seed spread if sigma^2 is the load-bearing
          invariant; a difference names a second invariant.
    quantifier_order: >-
      FOR EACH r in the ladder and EACH (N, a) cell, the measured deficit lies
      within the stated tolerance of C_max(a) - C_max((1 - 1/r) a); the
      tolerance is fixed before the runs and does not depend on r.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy N on the tested walks, the table constants' r-dependence is
        (or is not) explained by sigma^2 to within the tolerance; a derivation
        (not a proof) of the generic-model variance bound.
      nearby_object_control: >-
        The fresh-successor walk (same cost, sigma^2 = 1): the hoped-for
        r-dependence must vanish there.
    proof_obligations:
      - claim: Binomial(r, 1/r) in-degree for a keyed-hash partition with distinct preimages.
        responsibility: correctness
      - claim: Var K <= 1 - sum p_j^2 for every one-operation label-indexed walk in the generic group model.
        responsibility: strictness
      - claim: The rescaling a -> sigma^2 a of the size-biased law, with E[n] = W preserved.
        responsibility: size
      - claim: The look-ahead identity sigma^2 = k^2/(2k - 1) at k group operations per step.
        responsibility: runtime
      - claim: Statements scoped to the instrument, the tested r ladder and toy N.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: exact in-degree variance of the r-adding walk on Z/N
      direction: lower
      minimum_effect: 1 - 1/r within +-0.005 at N = 2^24 for every r in the ladder.
    - metric: generic-minus-walk exact top-T share at a = 1/4, N = 2^24
      direction: higher
      minimum_effect: >-
        0.119 (r = 2), 0.052 (r = 4), 0.025 (r = 8), 0.012 (r = 16), 0.006
        (r = 32), each within 25% relative or 0.005 absolute, whichever is
        larger; zero within seed spread at r = 4096.
    - metric: fitted basin cutoff divided by 2 W^2
      direction: lower
      minimum_effect: Tracks 1 - 1/r within the instrument's cutoff-fit interval; 0.5 at r = 2.
    - metric: fitted body slope of the basin survival function
      direction: different
      minimum_effect: Independent of r within the instrument's slope interval (the body is sigma-free).
    - metric: unselected coverage at a_m against 1 - (1 + 2 sigma^2 a_m)^{-1/2}
      direction: lower
      minimum_effect: Within 0.01 absolute at every r and a_m.
    - metric: look-ahead coverage per group operation relative to k = 1 (optional Step 3)
      direction: lower
      minimum_effect: Oracle T L_ops^2 ratio about 2k - 1 (3 at k = 2), at least 2 at k = 2.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR: Step 1 at N = 2^20 and 2^24 with
      r in {2, 4, 16, 4096} and the keyed random function, a = 1/4, five
      seeds -- exact enumeration on an instrument that already exists, minutes
      of CPU. The r = 2 and r = 4 cells carry predicted effects of 0.12 and
      0.05 against seed spreads near 0.01-0.02, so the record is decided by
      the first run; the full ladder, theta sweep and curve arm follow.
    controls:
      - keyed random function (null, sigma^2 = 1)
      - r = 4096 arm (null realised as an r-adding walk)
      - fresh-successor walk (proves-too-much)
      - lambda-mixed decay walk
      - theta sweep at fixed r (separates the O(theta) term)
    required_metrics:
      - in-degree histogram and variance per arm
      - survival slope and cutoff per arm with the instrument's estimator
      - exact top-T share at a in {1/8, 1/4, 1/2} per arm with seed-bootstrap intervals
      - unselected coverage and static (pool ratio 2) coverage per arm
      - generic-minus-walk differences beside the model deficits, never in one column

  falsification_conditions:
    - >-
      The deficit ladder is flat within seed spread at r in {2, 4}: the
      Poisson assumption of aed829/cf3b76 is adequate and this record is wrong.
    - >-
      Measured deficits at r = 2 or 4 fall outside [0.75, 1.25] times the
      predicted values after the theta sweep removes the O(theta) term:
      sigma^2 is not the governing invariant (higher-order walk structure is),
      and the rescaling law is withdrawn.
    - >-
      The fresh-successor arm shows an r-dependence: the instrument, not the
      walk, produces the ladder; void.
    - >-
      (Closure part) a measured look-ahead arm with coverage per group
      operation at or above k = 1: the (2k - 1) cost identity is wrong.

  confounders:
    - >-
      O(theta) corrections of the same order as 1/r at r = 16-32 and
      W = 128 (the goal's own C2 blocker); separated by the theta sweep.
    - >-
      Short relations among the M_j (e.g. M_i + M_j = M_k) create extra
      short cycles and merges at very small r, a higher-order effect beyond
      sigma^2; the fresh-successor and decay arms bound it.
    - >-
      On the curve arm the partition reads an EC label whose low bits may not
      be a perfect hash; EV-ECDLP-31e91c's r_walk = 16 cells mix this with the
      sigma^2 effect. The Z/N arm with a keyed hash is the clean instrument.

  interpretation_limits:
    - Proposal only; no run exists. All deficits are model values.
    - >-
      Constant-factor, generic, under KN-LIT-013; it moves no exponent. Its
      value is a correction to the instrument and a free few-percent gain for
      every design on this RQ.
    - >-
      The closure (D) is a derivation in the generic group model for
      one-operation label-indexed walks; it says nothing about stateful walks
      or non-generic label relations.
    - The fixture reading in (E) is conditional on Bernstein-Lange's walk, which was not verified.

  heuristic_assumptions:
    - id: H-C1
      statement: >-
        LOCAL TREE LIMIT WITH BINOMIAL OFFSPRING. For the r-adding walk with a
        keyed-hash partition on a group of prime order N, the backward
        exploration of a uniformly random distinguished point up to depth
        O(W) with W <= N^{1/3} is, in total variation, within o(1) of a
        Galton-Watson tree with Binomial(r, (1 - theta)/r) offspring,
        uniformly for r >= 2 and theta = 1/W.
      rigorous_support: >-
        Rigorous: the exact in-degree law Binomial(r, 1/r) for distinct
        preimages with independent labels (generic group model). Imitated
        classical statement: the local weak limit of a uniform random mapping
        is a Poisson(1) Galton-Watson tree (Aldous-type result, recalled),
        here with Binomial offspring.
      validation_plan: >-
        Exact enumeration at N in {2^20, 2^22, 2^24}: in-degree histogram
        against Binomial(r, 1/r) (chi-square); basin-size empirical CDF against
        the total-progeny law of the Binomial-offspring branching process
        computed numerically (not only its asymptotic form); tail check: the
        largest basin per seed against the order-statistic prediction with
        cutoff 2 sigma^2 W^2. Transfer to cryptographic N is assumed, not
        tested.
    - id: H-C2
      statement: >-
        Higher-order effects of additive walks beyond the offspring variance
        (short relations among multipliers, cycle structure) change the top-T
        share by at most O(1/r^2) at a in [1/8, 1/2].
      rigorous_support: >-
        None proved here; the recalled rho-side analyses of additive walks
        (Teske; Bernstein-Lange) report corrections beyond 1/sqrt(1 - 1/r) as
        small. Imitated statement: second-order corrections to a Poisson
        approximation are of the order of the squared first-order parameter.
      validation_plan: >-
        Residual after rescaling at r in {2, 3, 4} compared with the fresh-
        successor walk tuned to the same sigma^2 via lambda; a residual above
        0.01 at r = 4 falsifies H-C2 on the instrument.

  target_complexity:
    time_exponent: Unchanged, N^{1/3} online at T = N^{1/3}; constant L at fixed T grows by about (r/(r-1))^{1/2} for an r-adding walk.
    memory_exponent: >-
      Unchanged, N^{1/3}. Constant: T at fixed L grows by r/(r-1) (1.032 at
      r = 32, 1.067 at r = 16, 2 at r = 2).
    best_known: >-
      Bernstein-Lange 1.77 N^{1/3} online at T = N^{1/3} (KN-LIT-3060); the
      program's model oracle 1.28 N^{1/3} (aed829), which this record rescales
      to 1.28 (r/(r-1))^{1/2} N^{1/3} for r-adding walks.
    hidden_overhead: None; an r = 256 multiplier table costs 256 stored points, negligible against T.
    tradeoff_note: Not a tradeoff; a free correction. Parallel walks unaffected.

  dominated_by: >-
    n/a (no result claimed; control and closure). Rows checked: Bernstein-Lange
    static, aed829 oracle, H-ECDLP-37dc01 re-selection, IDEA-20260906-a3d6ae
    growth, CGK generic line -- none is changed in exponent; each gains the
    same r/(r-1) factor from a larger r, so none is dominated by this record.
  sota_delta: >-
    Predicted 3.2% (r = 32) to 6.7% (r = 16) fewer stored entries at fixed L
    for any table built on an r-adding walk, by moving to r >= 256; zero
    exponent change; the look-ahead closure predicts a net (2k - 1) loss.

  object_studied: The offspring variance of the distinguished-point-thinned walk graph.
  depth_of_verified_structure: >-
    Derivation only (Binomial law, rescaling, generic-model variance bound,
    look-ahead identity); consistency with EV-ECDLP-31e91c at r = 16 is noted,
    not claimed as support.
  enumerated_closures:
    - >-
      SUCCESSOR LOOK-AHEAD (best-of-k by hash): sigma^2 = k^2/(2k - 1) bought
      with k group operations per step; oracle T L_ops^2 = 1.64 N (2k - 1);
      strictly worse for k >= 2. Obstruction: no cheap lossy projection
      propagates under translation on a prime-order group (IDEA-20260901-863e36,
      KN-FIND-ffe1df Theorem C, exact case). Forward: stateful walks,
      approximate correlations, non-generic x(P+Q) + x(P-Q) relations.
    - >-
      ONE-OPERATION LABEL-INDEXED WALKS: sigma^2 <= 1 - sum p_j^2 in the
      generic group model; uniform r-adding is optimal in the class and
      sigma^2 = 1 is a limit, not attainable.
  open_directions:
    - Walks with carried state whose basins live on (point, state) pairs.
    - Non-generic label relations usable as a cheap partial look-ahead.
    - sigma^2-aware fixture correction for EXP-ECDLP-869870 (conditional on Bernstein-Lange's walk).

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      One new walk class in the existing exact-basin instrument; Step 1 is
      minutes; the curve arm reuses a certified toy curve.
  recommended_priority: high
  priority_rationale: >-
    Constant-factor and not target-class (docs/target-result-profile.md A1),
    said plainly; ranked high because it is the cheapest decisive test in this
    batch on the goal's own instrument, it corrects an assumption two open
    proposals rely on, it supplies the graded positive control the constant
    measurements lack, and it may bear on completion criterion C2.
