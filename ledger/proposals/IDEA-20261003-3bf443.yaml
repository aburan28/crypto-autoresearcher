# IDEA-20261003-3bf443
# Equation-count comparison. Proposal only. Not approved.
idea:
  id: IDEA-20261003-3bf443
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A Jacobi intersection writes 2 equations and a short-Weierstrass model writes 1
  class: representation
  claim: >-
    A Jacobi intersection writes 2 equations. A short-Weierstrass
    model writes 1 equation. Two exceeds one by 1. The product of
    the two counts is 2. Their sum is 3. The gap is an equation
    count, not an ECDLP exponent and not a parameter count.
  mechanism: >-
    OBJECT FRAME. The object is the written model. The operation
    set is counting equations, which is coordinate-dependent and
    is not a translation of a group element. Two short-Weierstrass
    models both write 1 equation, so that gap is 0. No point is
    counted.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries that speed decomposition are a different object
        from these two equation counts.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two models are frozen before the equations are counted.
    - No point is counted.
  proof_search_map:
    bottleneck: The equation-count gap 1.
    baseline_embedding:
      parameter_slice: The counts 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The equation-count gap and the product.
      distinct_preimage_search: >-
        Reporting both models as writing 1 equation drops the gap.
        Two short-Weierstrass models make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The short-Weierstrass model.
        predicted_gain: One fewer written equation. No exponent.
    quantifier_order: >-
      The models are fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The equation counts 2 and 1. Not a parameter count.
      nearby_object_control: >-
        Two short-Weierstrass models. Both write 1 equation, and the gap is 0.
    proof_obligations:
      - claim: The Jacobi intersection writes 2 equations.
        responsibility: size
      - claim: The short-Weierstrass model writes 1 equation.
        responsibility: size
      - claim: The gap is not a parameter count.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: equation_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Count the written equations and subtract 1 from 2. Do not
      count a point.
    controls:
      - Two short-Weierstrass models, whose equation gap is 0.
      - An independent count.
    required_metrics:
      - both equation counts
      - the gap
      - the product
  falsification_conditions:
    - The Jacobi equation count is not 2.
    - The product of the two counts is not 2.
  confounders:
    - A parameter count of 2 is a different reading from an equation count of 2.
  interpretation_limits:
    - An equation count is not a walk length.
    - No transfer to a cryptographic model.
    - This is not a comparison of written parameters.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen Jacobi intersection writes 2 equations, and the
        frozen short-Weierstrass model writes 1.
      rigorous_support: >-
        No model theorem is re-proved here. The count is a reading
        of two written models.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Changing variables that clear an equation is not counted.
    tradeoff_note: Fewer written equations do not by themselves shorten a walk.
