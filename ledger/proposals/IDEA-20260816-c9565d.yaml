idea:
  id: IDEA-20260816-c9565d
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Calibrate the detection floor of factor-base geometry measurement by planting a tunable amount
    of structure into an otherwise random base and finding the smallest coverage excess the exact
    counter, its bootstrap intervals and its permutation null can actually resolve at each group size
  class: control
  claim: '(A) THE PROBLEM. This program has recorded coverage excesses for structured factor bases
    of 1.0012, 1.0269 and 1.1071 against a matched random base, and has recorded a family verdict
    that three geometries sit exactly at the null. Those two kinds of statement are not comparable
    until one number is known: the smallest excess the measurement apparatus can resolve at each group
    size. A null verdict from an apparatus whose floor is 3 percent says nothing about a real 1 percent
    effect, and the frozen battery''s own report of two sub-1-percent coverage excesses - one with
    a family-wise interval excluding 1 but a permutation p-value of exactly 1.0 - is precisely the
    situation where the floor is decisive and unmeasured. (B) THE CLAIM. A PLANTED-STRUCTURE LADDER
    makes the floor measurable. Take a matched random base and interpolate it toward a ceiling-attaining
    structured base by replacing a fraction f of its elements, f swept from 0 to 1. The resulting
    family has a known monotone parameter and, at f equal to 0, is exactly the null. The claim is
    that the measured coverage excess is a monotone increasing function of f, that the apparatus resolves
    the excess only above some threshold f_min, and that the corresponding excess at f_min - the DETECTION
    FLOOR - is a number that can be reported per group size with its own interval. (C) THE USE. The
    floor is a reusable calibration constant. Every later geometry measurement in this bucket can
    be reported as excess-relative-to-floor rather than excess alone, which converts the family of
    null verdicts already recorded from unqualified statements into scoped ones. A floor above the
    largest constructible excess would be the most valuable negative outcome available here: it would
    mean the whole yield-measurement channel at these sizes cannot distinguish the geometries the
    program cares about, which is a measured obstruction and not a fatigue report. (D) WHAT IS NOT
    CLAIMED. No attack, no break, no speedup, no security consequence. It is NOT claimed that any
    previously recorded null verdict is wrong - the floor is a property of the apparatus and its scope,
    and a null verdict above the floor stands unaffected. It is NOT claimed that the planted-structure
    family is a realisable factor base for any purpose; it is an instrument, its high-f end has known
    discrete logarithms by construction, and the contract records that. It is NOT a re-audit of this
    program''s cost model, machine variance or timing, none of which are measured here.'
  mechanism: STAGE 1. Fix a toy prime-order curve, base size B and arity m equal to 3. Construct a
    ceiling-attaining structured base S in the exponent coordinate and a matched random base R of
    the same size, both in the same invocation. STAGE 2. For each f in a swept ladder, build the interpolant
    B_f by taking a uniformly chosen fraction 1 minus f of R's elements and a fraction f of S's, deduplicating
    and topping up from the appropriate source so the realised size is exactly B. Record the realised
    composition. STAGE 3. For each B_f measure exact coverage over the complete target space, the
    excess ratio against a freshly drawn matched random base, a bootstrap interval over seeds and
    curves, and a permutation-null band over base labellings - the identical pipeline the frozen battery
    used, applied unchanged. STAGE 4. Fit excess as a function of f and locate f_min, the smallest
    f at which the family-wise interval excludes 1 and the permutation p-value clears the correction.
    Report the excess at f_min as the detection floor with its interval. STAGE 5. Repeat across group
    sizes to obtain the floor as a function of N. STAGE 6. Refutation route. If excess is not monotone
    in f, the interpolant is not a valid ladder and the calibration is void. If the floor at every
    size exceeds the largest excess recorded anywhere in this program, the channel is under-resolved
    at these sizes and that is the finding. If the floor is far below the recorded sub-1-percent excesses,
    those excesses are resolvable and the frozen battery's mixed signals need re-reading, which the
    contract states without re-running that battery.
  novelty_status: unverified
  novelty_screen:
    method: Read EV-FBG-001 in full, including the observation blocks recording exact yield ratios
      of 1.000000, coverage ratios within about 1 percent, the greedy_optimized interval [1.00105,
      1.00456] at 2^18 with permutation Holm p equal to 1.0, the coset_union value 1.0012, and the
      red-team objection reporting Bose-Chowla at 1.1071 and whole-group greedy at 1.0269 with a headroom
      ceiling of plus 54 percent. Read H-FBG-001, RQ-FBG-001, DEC-20260724-007 references. Greps over
      ledger/proposals and ledger/hypotheses for 'yield ratio', 'matched random base', 'permutation',
      'greedy', 'Sidon'. Reviewed the anti-duplication blacklist entries covering RQ-INSTR-f8faa0
      cost-model and machine-variance audits to confirm this is a different instrument question.
    results: RQ-INSTR-f8faa0 carries 15-plus proposals auditing this program's cost model, machine
      variance and single-machine timing; those are about execution cost, not about the statistical
      resolving power of a coverage measurement, and the blacklist names them explicitly. EV-FBG-001
      reports intervals and permutation bands but never reports the smallest effect the pipeline could
      have detected, and its two sub-1-percent excesses with contradictory interval and permutation
      verdicts are exactly the symptom of an uncalibrated floor. No proposal I found plants a tunable
      amount of structure into a random base to calibrate a factor-base measurement. IDEA-20260815-c13ef4
      compares designed against sampled bases without a planted ladder.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; planted-signal power calibration
      is an ordinary statistical practice and this record claims nothing about its publication history.
      What is claimed new here is its application as a first-class deliverable for factor-base geometry,
      producing a floor constant per group size that later geometry measurements in this bucket are
      reported against. Assembled from known parts: the exact counting pipeline, bootstrap intervals
      and permutation null from the frozen battery; the ceiling-attaining structured base already
      recorded in this program; the interpolation idea, which is generic.'
  object_first_candidate:
    tracked_object: THE MIXTURE FRACTION f together with the resulting coverage excess - an ordered
      pair carried along a ladder from pure random to pure structured, so that the apparatus is measured
      against a known monotone input rather than against an unknown geometry.
    lossiness: 'Lossy, and deliberately so. The pair (f, excess) discards which elements were swapped,
      the identity of the structured source, the curve, the field and the entire count vector. What
      is retained is only how much structure went in and how much came out. That is compatible with
      the target operation - measurement by the exact counter followed by interval construction -
      because the counter is a function of the base as a set and the ladder controls the set''s composition
      by a single scalar. Very many distinct bases share an f, which is what makes this a projection.
      The honest cost of the projection is that f is a composition fraction, not a structure amount:
      two bases at the same f can carry different amounts of usable structure depending on which elements
      were swapped, and the contract measures that dispersion rather than assuming it away.'
    propagation: 'One step of the target operation is swapping one more element from the random source
      to the structured source, raising f by 1 over B. The retained pair propagates as: excess changes
      by the marginal contribution of that element to the number of distinct targets reachable by
      size-m multisets. That marginal is computable exactly and is nonincreasing in f for a ceiling-attaining
      source, giving a concave staircase. The concavity is the propagation law the ladder relies on,
      and checking it empirically is the ladder''s own validity test.'
    survival_score: 'The ladder is informative while the excess staircase is above the interval width.
      Concretely: the structure survives the mixing while f exceeds f_min, and dissolves below it
      - not because the structure is gone but because the apparatus can no longer see it, which is
      exactly the quantity being measured. Expected survival: informative over roughly the upper two-thirds
      of the f range at N near 2^18 and over a narrower band at N near 2^12, with the crossover located
      rather than assumed.'
  null_object_control: 'The null object is the f equal to 0 arm - a matched random base of identical
    size measured by the identical counter with the identical interval and permutation machinery,
    drawn fresh in the same invocation. For the ladder to mean anything the null must return an excess
    ratio whose family-wise interval contains 1.00 and whose permutation p-value is uniform across
    replicate seeds; if the f equal to 0 arm shows excess, the apparatus has a bias and every floor
    derived from it is wrong. A second null is required: a SHAM LADDER in which the fraction f of
    elements is replaced not by structured elements but by other random elements, so composition changes
    exactly as in the signal ladder while structure does not. The sham ladder must stay flat at excess
    1.00 across all f. If it rises, the ladder measures churn rather than structure and the calibration
    is void.'
  discriminated_from:
  - 'The RQ-INSTR-f8faa0 family of cost-model, machine-variance and timing audits: those measure execution
    cost and reproducibility of run infrastructure. This measures the statistical resolving power
    of a mathematical measurement and touches no timing.'
  - 'EV-FBG-001 and H-FBG-001: a six-cell battery that reported intervals and permutation bands. This
    contract does not re-run any of those cells and does not revisit their verdicts; it measures what
    the pipeline that produced them could have detected.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases at matched size. No planted ladder, no floor
    constant, and its deliverable is a rate comparison rather than an apparatus property.'
  - 'EXP-RELN-0a979f: a graded additive-energy census whose grading is by a mathematical property
    of each arm. Here the grading is by composition fraction against a fixed structured source and
    the deliverable is a detection threshold, not a deficit.'
  - 'Any proposal auditing the program''s false-positive rate or falsification follow-through: those
    are ledger-level meta-audits over records; this is a per-size numerical constant derived from
    fresh measurement.'
  assumptions:
  - A ceiling-attaining structured base can be constructed at each tested size; if it cannot, the
    ladder has no top end and the calibration is reported as infeasible rather than run against a
    weaker source.
  - The exact counting identity holds, so mean yield is size-forced and coverage is the free coordinate
    being calibrated.
  - Deduplication and top-up during interpolation do not themselves create structure; the sham ladder
    is the control for exactly this and its flatness is a precondition for reading anything else.
  - The interval and permutation machinery reproduced here matches the frozen battery's convention
    closely enough that the derived floor applies to that battery's verdicts; any convention difference
    found is reported and the applicability claim is withdrawn.
  predictions:
  - metric: monotonicity of measured coverage excess in the mixture fraction f
    direction: higher
    minimum_effect: 'forced value: the excess must be nondecreasing in f up to sampling noise, with
      at most 1 of 20 ladder rungs violating monotonicity outside its interval; more violations void
      the ladder'
  - metric: excess at the f equal to 0 null arm
    direction: different
    minimum_effect: 'forced value: family-wise interval must contain 1.00; any excess here is apparatus
      bias and voids the calibration'
  - metric: sham-ladder excess across all f
    direction: different
    minimum_effect: 'forced value: flat at 1.00 within intervals at every rung'
  - metric: detection floor, expressed as coverage excess at f_min, at the largest tested size
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a number: the floor is the quantity being measured
      and pre-committing a value would invite fitting the analysis to it; the contract instead pre-commits
      the rule by which f_min is located'
  minimal_test:
    design: 'One curve, one size, twenty rungs, three arms, one invocation. Take a toy prime-order
      curve with N near 2^16, set B equal to ceiling of (6N) to the one-third power, build one ceiling-attaining
      structured base and one matched random base, and construct the signal ladder at f in twenty
      equally spaced steps from 0 to 1. In the same invocation construct the sham ladder at the same
      twenty steps. For every rung compute exact coverage over the complete target space, the excess
      against a freshly drawn matched random base, a bootstrap interval over four seeds and a permutation
      band over 200 label permutations. The discriminating outputs are three curves on one axis: signal
      excess against f, sham excess against f, and interval half-width against f. The floor is read
      off where the signal curve first clears the interval half-width and the permutation threshold.
      If the sham curve is not flat, stop and report; nothing else in the run can be read. Cost is
      dominated by twenty times the per-cell exact count, which at this size is minutes.'
    controls:
    - 'f equal to 0 arm: matched random base measured by the identical pipeline in the same invocation.'
    - 'Sham ladder: identical composition churn with random-to-random replacement, at all twenty rungs,
      in the same invocation.'
    - Fresh matched random base drawn per rung, so the denominator of the excess ratio is not shared
      across rungs.
    - Closed-form total check per cell - summed multiset count equals binomial(B+m-1, m) exactly -
      as a counter integrity test.
    - Replicate seeds and replicate curves, with the ladder rebuilt independently under each.
    required_metrics:
    - exact coverage per rung per arm
    - excess ratio against the matched random base per rung, with bootstrap interval
    - permutation-null p-value per rung under the stated correction
    - interval half-width per rung, which is the floor's proximate determinant
    - f_min under the pre-committed location rule, and the excess at f_min
    - realised composition per rung after deduplication and top-up
    - closed-form total residual, which must be exactly zero
  falsification_conditions:
  - The sham ladder rises with f, showing the measurement responds to composition churn rather than
    structure.
  - The f equal to 0 arm shows excess outside its interval, showing apparatus bias.
  - Signal excess is not monotone in f beyond the stated tolerance, showing the interpolant is not
    a valid ladder.
  - No ceiling-attaining structured base can be built at a tested size, making the ladder's top end
    absent and the calibration infeasible there.
  - Any closed-form total residual is nonzero, voiding the counter.
  - f_min is not identifiable because the signal curve never clears the interval width even at f equal
    to 1, which is itself the strong negative outcome and is reported as the floor exceeding the maximum
    attainable excess.
  confounders:
  - 'Composition churn: replacing elements changes the base even without adding structure, and the
    sham ladder is the only guard.'
  - Deduplication and top-up can bias realised composition away from nominal f, so realised composition
    must be measured rather than assumed.
  - Choosing the structured source after seeing which one gives the cleanest ladder would be fitting;
    the source is declared before any run.
  - Coverage saturation at small N compresses the top of the ladder and can make the floor look better
    than it is.
  - The floor is specific to the interval and permutation conventions used; a different correction
    gives a different floor, and the conventions must be frozen with the contract.
  interpretation_limits:
  - The floor is a property of the apparatus at a stated size under stated conventions, not a property
    of any geometry.
  - A floor derived here applies to other measurements only insofar as they share the pipeline and
    conventions; that sharing must be checked, not assumed.
  - Nothing here revises any recorded verdict; it scopes them.
  - The planted-structure family is not a usable factor base and no operational reading of its excess
    is permitted.
  target_complexity:
    time_exponent: No attack exponent is claimed. The calibration costs twenty rungs times the per-cell
      exact count, order N times B squared each at arity 3, times the permutation draws - a measurement
      cost only.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N plus the discrete-logarithm table, linear in N at toy sizes.
    best_known: 'The incumbent is the current practice recorded in this program: report an excess
      ratio with a bootstrap interval and a permutation band and no floor. There is no floor constant
      recorded anywhere in this repository for the coverage channel, so there is no incumbent number
      to beat - the contribution is the existence of the constant, not an improvement on one.'
    hidden_overhead: 'The hidden cost is convention lock-in: a floor is only transferable if the interval
      and permutation conventions are identical between the calibration and the measurement it is
      applied to, and the frozen battery''s own validation notes recorded an undocumented aggregation
      rule living only in a code comment. Reproducing conventions faithfully is most of the human
      cost and is the part most likely to be done approximately and reported as exact. A second overhead
      is that twenty rungs times replicate seeds and curves multiplies cell count quickly, so the
      compute is modest per cell and substantial in aggregate.'
  dominated_by: 'n/a (no result claimed) on attack axes - nothing here produces a time, memory or
    query point on any attack frontier, so no frontier row is displaced. On the measurement''s own
    axes the check is real and I performed it against the rows this repository records for coverage
    measurement: the frozen battery''s pipeline dominates on cost, since it produced verdicts without
    paying for a ladder; a single-rung comparison of a structured base against a matched random base
    dominates on simplicity; and no repository row reports a detection floor at all, so on the floor
    axis there is nothing to be dominated by. The contract is dominated by doing nothing on every
    axis except interpretability, which is the only axis it claims.'
  sota_delta: 'No attack; measurement-validity contribution only. Quantitatively: this program currently
    records coverage excesses of 1.0012, 1.0269 and 1.1071 with intervals but zero detection floors,
    so every one of those numbers is currently uninterpretable in the null direction. A completed
    run would supply one floor per group size with its own interval, letting each recorded excess
    be restated as a multiple of the floor. No attack cost, no relation rate and no exponent changes.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Sham ladder staying flat: about 0.75 - composition churn at fixed size
    should not create coverage excess given the counting identity forces the mean, but deduplication
    and top-up are exactly where an artifact would enter, and I would not be surprised by a small
    rise. Signal ladder being monotone in f: about 0.8, with the residual risk that a ceiling-attaining
    source mixed with random elements loses its structure faster than linearly and produces a flat
    then sharply rising curve, which is still usable but complicates the location rule. Ceiling-attaining
    source constructible at every tested size: about 0.7, lower at the smallest sizes where the construction
    has little room. f_min identifiable at the largest tested size: about 0.65. The floor turning
    out to be BELOW the recorded sub-1-percent excesses, which would make those excesses meaningful:
    about 0.4 - I lean the other way, and the more likely outcome is a floor around 1 to 2 percent
    that leaves the 1.0012 and the 1.00105-to-1.00456 interval results unresolvable, which would be
    the strong and useful negative. Overall probability the run yields a defensible floor constant
    with an interval rather than a confound report: about 0.55.'
