idea:
  id: IDEA-20261001-b458c1
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-01'
  title: >-
    Reproduce or refute the published Tins witness-recovery claim
    (sign-29-1) on the official round-1 submission
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, reports that one Tins signature yields the
    signing witness by linear algebra over F2 on at most 1,044 unknowns, and
    that the recovered witness signs arbitrary messages (finding sign-29-1).
    This idea asks whether that published claim reproduces on the official
    ICCS round-1 Tins package, compiled from its C sources by this program,
    for every parameter set the package declares. It proposes no new attack.
  mechanism: >-
    The published argument, once read from finding sign-29-1 and the Tins
    specification, is run on signatures produced by the official signer.
    A recovered object counts only when a verifier built separately from
    the recovery code accepts a signature on a message that was not part
    of the recovery transcript. The linear-algebra bound of 1,044 unknowns
    is part of the claim under test, not a parameter this idea chooses.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Tins is an NGCC round-1 signature candidate, not an elliptic-curve
      discrete-log instance. knowledge/frontiers/ecdlp does not contain
      this scheme. The corpus entry that does name it is a round-1
      listing and states that it includes no third-party analysis.
    nearest:
      - ref: KN-LIT-160d90
        provenance: kb
        relation: adjacent
        delta: >-
          KN-LIT-160d90 records that Tins is signature candidate 29 and
          states that the specification, reference code, and any
          third-party analysis were not read. This idea adds an
          independent reproduction test of published finding sign-29-1.
          It adds no new attack and no cost improvement over that finding.
    searched:
      corpus_grep:
        - "knowledge/literature/KN-LIT-160d90.md read 2026-10-01"
        - "ledger grep for Tins returned only the NGCC goal, question, and decision opened 2026-09-30"
      web:
        - "https://eprint.iacr.org/2026/2266 landing page fetched 2026-09-30"
      blocked: []
  test_boundary: >-
    Official Tins zip from the round-1 roster (sign-29), every parameter
    set that package declares, two independent keys per set. No other
    scheme. No claim about a repaired or later submission.
  falsification: >-
    On any declared parameter set, both independent keys fail to produce
    a fresh-message signature that a separate verifier accepts, and the
    failure is not a build or infrastructure error.
  status: proposed
  proposed_by: coordinator
