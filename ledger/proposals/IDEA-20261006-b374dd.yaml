idea:
  id: IDEA-20261006-b374dd
  question_id: RQ-FROB-7d8dd4
  title: >-
    Fifth-power orbit histogram of the affine points on y^2 = x^3 + x + 1
    over F_25
  class: measurement
  claim: >-
    Let F_25 = F_5[w] / (w^2 + 2). On E: y^2 = x^3 + x + 1, with both
    coefficients in F_5, there are 26 affine points over F_25. The map
    (x, y) -> (x^5, y^5) sends E to itself. Its orbits on those 26
    points are eight orbits of size 1 and nine orbits of size 2. A
    recount with any other histogram is a negative. The same map on
    y^2 = x^3 + w x + 1, whose linear coefficient is not in F_5, sends
    25 of its 27 affine points off the curve. The procedure must refuse
    to emit an endomorphism-orbit histogram for that second curve.
    Emitting eight-and-nine for it is a negative. Eight size-1 orbits
    match the 8 affine points over F_5, and #E(F_5) = 9 after adding
    the point at infinity. This histogram is the trivial n=2 symmetry.
    It is not a Koblitz sqrt(2m) rho factor and it does not reduce an
    index-calculus cost.
  mechanism: >-
    Object frame. Representation: affine points of one short-Weierstrass
    model over F_25, together with the fifth-power map on coordinates.
    Operation set: apply that map and partition the point set into
    orbits. The projection discards the group law and retains the
    histogram of orbit sizes. It is lossy: many curves can share a
    histogram. On a model not defined over F_5 the image leaves the
    point set, so the partition is not an endomorphism orbit and must
    be refused. RQ-FROB-7d8dd4 asks whether Frobenius reduces
    index-calculus cost by more than the trivial n-fold symmetry. This
    record measures that symmetry at n=2 on one toy curve and does not
    charge a linear-algebra stage.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a Koblitz curve over F_{2^m}, walking on Frobenius classes
        reduces parallel rho by sqrt(2m). The F_25 histogram is an
        odd-characteristic orbit count and is not that factor.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base can cut the number of
        decomposition systems by up to 1/n. This idea does not build a
        factor base and does not claim that saving.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
  assumptions:
    - >-
      w^2 + 2 is irreducible over F_5, checked by evaluating it at
      0, 1, 2, 3, 4. Arithmetic in the session used that modulus.
    - >-
      The fifth-power map was applied to every affine point found by
      testing squares in F_25. A missed point would change the histogram
      and is a recount failure, not a new symmetry.
  proof_search_map:
    not_applicable_reason: >-
      This is one orbit histogram at q=5 and n=2, not a proof that
      Frobenius reduces index-calculus cost.
    bottleneck: >-
      The step that decides the claim is the partition of the 26 affine
      points under the fifth-power map. A linear-algebra dimension is
      not this partition.
    baseline_embedding:
      parameter_slice: >-
        F_25 as F_5[w]/(w^2+2), the subfield curve y^2 = x^3 + x + 1,
        and the non-subfield curve y^2 = x^3 + w x + 1.
      reproduction_check: >-
        A second enumeration of affine points returns 26 and the same
        histogram, and the non-subfield curve still has 25 images off
        the curve.
    observation_collision:
      observable: the pair (eight orbits of size 1, nine of size 2)
      distinct_preimage_search: >-
        The non-subfield curve has 27 affine points and is not given
        this histogram. Assigning it the same histogram collides two
        different objects.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the orbit histogram on the subfield curve
        predicted_gain: the histogram eight-and-nine, or a recount that misses it
    quantifier_order: >-
      The claim is one curve at q=5 and n=2. It does not say that every
      subfield curve has nine orbits of size 2.
    method_ceiling:
      strongest_certifiable_claim: >-
        The histogram on this point set, and the refusal on the
        non-subfield curve. No index-calculus cost is certifiable.
      nearby_object_control: >-
        y^2 = x^3 + w x + 1 is not defined over F_5. Scoring it as an
        endomorphism orbit is the known-false case.
    proof_obligations:
      - claim: Orbit sizes are computed from the fifth-power map on the enumerated points.
        responsibility: correctness
  predictions:
    - metric: histogram of fifth-power orbit sizes on the 26 affine points
      direction: different
      minimum_effect: eight orbits of size 1 and nine of size 2
  minimal_test:
    design: >-
      Enumerate the affine points of both curves over F_25 by testing
      which right-hand sides are squares. Partition the subfield curve
      by the fifth-power map. On the non-subfield curve, count how many
      images leave the point set and refuse a histogram if that count
      is positive. Do not run index calculus.
    controls:
      - >-
        Subfield check: #E(F_5) = 9, so there are 8 affine points fixed
        by Frobenius. The number of size-1 orbits must equal 8. A
        different size-1 count means a point was missed or the map is
        not the fifth power.
      - >-
        Non-subfield refusal: 25 of 27 images leave the curve. Emitting
        a histogram is a failure.
      - >-
        Self-map: applying the fifth power twice returns the point,
        because the multiplicative order divides 24 and the Frobenius
        has order 2 on F_25. An orbit longer than 2 means the map was
        not the Frobenius.
    required_metrics:
      - affine point count on each curve
      - orbit-size histogram on the subfield curve
      - number of fifth-power images that leave the non-subfield curve
      - #E(F_5)
  falsification_conditions:
    - A recount of the subfield curve returns a histogram other than eight 1s and nine 2s.
    - The number of size-1 orbits is not 8.
    - An orbit of size greater than 2 appears.
    - The procedure emits an endomorphism-orbit histogram for y^2 = x^3 + w x + 1.
  confounders:
    - >-
      Including the point at infinity adds an orbit of size 1 and does
      not change the nine orbits of size 2. The claim counts affine
      points. Mixing conventions is a void.
    - >-
      A different irreducible polynomial for F_25 changes coordinates
      and must be reduced back before the histogram is compared. The
      test locks w^2 + 2.
  interpretation_limits:
    - >-
      KR-RHO-037e22 is a binary Koblitz rho factor. This histogram does
      not multiply or divide that factor.
    - >-
      KR-IC-b0fcda describes a possible 1/n saving from a
      Frobenius-invariant factor base. This record does not measure
      that saving. The exponent delta is 0.
    - >-
      Toy extension only. q=5 and n=2 do not transfer to a prime-degree
      extension used in a subfield attack.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. The histogram is the orbit partition
        of a finite enumerated set under a deterministic field map.
      rigorous_support: >-
        The q-power Frobenius is a field automorphism of order n. On a
        curve defined over F_q it maps rational points to rational
        points. The order on F_{q^2} is 2, so orbit sizes are 1 or 2.
      validation_plan: >-
        Enumerate the affine points twice, independently, and partition
        each list. Comparison distribution: equality of the two
        histograms, not a probabilistic law. Tail check: every listed
        point satisfies the curve equation, and every size-1 point has
        coordinates in F_5.
  target_complexity:
    time_exponent: 1/2
    memory_exponent: 1/2
    best_known: >-
      Pollard rho at exponent 1/2, with the Koblitz class factor
      sqrt(2m) from KR-RHO-037e22 on binary Koblitz curves only. This
      histogram does not move that factor. The top frontier-map hit for
      the claim text is that Koblitz row.
    hidden_overhead: >-
      None is claimed. The work is an enumeration of F_25.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The trivial symmetry is an
      orbit of size at most 2, which is the n-fold factor the question
      already separates from a further saving.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-RHO-037e22 dominates any reading of this histogram as a Koblitz
    rho speedup. KR-IC-b0fcda dominates any reading of it as a measured
    1/n factor-base saving. Neither reading is the claim. The
    discrete-log exponent delta is 0. The histogram itself is not
    recorded in those rows.
  sota_delta: >-
    ECDLP time-exponent delta is 0 relative to rho at exponent 1/2,
    including the Koblitz sqrt(2m) constant, which this curve is not.
    Memory-exponent delta is 0. The quantity that is claimed is the
    orbit histogram eight-and-nine on one curve over F_25.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-037e22
      - KR-IC-b0fcda
    nearest:
      - ref: KR-RHO-037e22
        provenance: internal
        relation: orthogonal
        delta: >-
          Top frontier-map hit. The row is the binary Koblitz class
          walk, a constant sqrt(2m). This idea is an odd-characteristic
          orbit histogram at n=2. Exponent delta 0. It adds the counts
          8 and 9, which that row does not record.
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          The row states a possible 1/n reduction in the number of
          decomposition systems. This idea measures the orbit sizes
          that such a factor base would quotient by, at one toy, and
          does not time a linear-algebra stage. Exponent delta 0.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for an F_25 fifth-power histogram
        - pull requests 1928 and 1929, which do not record this histogram
      web: []
      blocked:
        - Galbraith-Granger-Merz-Petit was not opened. Novelty stays unverified.
  status: proposed
  added: '2026-10-06'
  approved_by: null
