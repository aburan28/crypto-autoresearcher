      verified_by: "idea-generator subagent, 2026-08-29: HEADER-ONLY. The two specifications were grepped for title, question_id and scheme fields (lines 3-37 of each shown); KN-FIND-001e68 was grepped for its title line only. Neither file was read in full."
  assumptions:
    - >-
      The published category claims are minima over a documented family set.
      If a published number's derivation is undocumented, the corresponding
      cell is reported as UNDERIVABLE and that is itself a deliverable, not a
      gap to be filled by guessing.
    - >-
      A heuristic's CONTESTED tag is a claim about the literature, not about
      the world; every tag carries a citation to a specific contestation and
      no tag is applied from memory.
    - >-
      One pinned estimator and cost model across all nine cells and the
      control schemes, with memory charged identically.
  proof_search_map:
    bottleneck: >-
      The single classification step in which the family attaining the
      published minimum is identified and its heuristic set is read off. Every
      downstream number is determined by it, and it is decided by reading text
      rather than by computing.
    baseline_embedding:
      parameter_slice: >-
        ML-KEM-768, where the dual family is a documented live competitor and
        where this program already holds experimental material, is the slice
        on which the map's classification behaviour is known in advance.
      reproduction_check: >-
        The map applied to ML-KEM-768 must tag at least one cell contested,
        and applied to the synthetic dual-argmin instance must tag it
        contested. Both are frozen fixtures. If either fails, no ML-DSA cell
        is reportable.
    observation_collision:
      observable: "the pair (FAM(k, P), HEUR(k, P)) and the derived CONTEST value."
      distinct_preimage_search: >-
        The collision to hunt is two DIFFERENT derivation chains producing the
        same published bit count -- for instance a primal and a dual family
        agreeing to within the estimator's precision at some category. That
        collision makes FAM(k, P) non-identifiable from the number alone, and
        it is not hypothetical: primal and dual estimates for Dilithium-shaped
        MLWE are recalled as being close. THE SEPARATING CONDITION IS THE
        PRIMARY TEXT, not the number, which is why stage 2 must read the
        specification's own statement of which family it used rather than
        inferring it by matching values. A cell whose family cannot be
        separated this way is reported as AMBIGUOUS with both candidate
        heuristic sets listed, never resolved by picking the closer number.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Each published bit count re-presented as a pair (value, heuristic
          dependency set), so that comparisons between assumptions become
          comparisons between objects of the same epistemic kind rather than
          between bare integers.
        predicted_gain: >-
          Diagnostic. The measurable gain is CONTEST in bits per cell and the
          binary answer of whether ARGMIN_clean differs from ARGMIN_pub. No
          speedup and no exponent is claimed in any direction.
      - transform: observable_fiber
        proposed_object: >-
          Hold the published bit count fixed and vary the derivation chain;
          the fibre is the set of families that would produce it, and the
          intrinsic invariant separating them is the heuristic set. This is
          the algebraic content of the ambiguity handling above.
        predicted_gain: >-
          Establishes that a bit count alone is a non-identifying observable
          for the epistemic question, which stands regardless of how the
          CONTEST values come out and is the record's minimum guaranteed
          deliverable.
    quantifier_order: >-
      FOR EACH category k and problem P, THERE EXISTS a family FAM(k, P) named
      in the primary text and a heuristic set HEUR(k, P), and the claim
      concerns CONTEST(k, P) and the two argmins under ONE pinned estimator.
      The claim is NOT that the contested heuristic is false, NOT that any
      corrected estimate is right, and NOT a universal statement about
      lattice cost models.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The published estimate for problem P at ML-DSA-k is attained by
        family F, whose cost model invokes heuristics H1..Hm, of which Hi is
        contested by [citation]; excluding contested families gives
        B_clean = X against B_pub = Y, a difference of CONTEST bits; the
        binding assumption per category is ARGMIN_pub before and ARGMIN_clean
        after." The method can never certify that a contested heuristic is
        false, nor that an uncontested one is true, nor produce a better
        estimate of anything.
      nearby_object_control: >-
        ML-KEM-768 -- same ring, same modulus family, same estimator, same
        heuristic vocabulary, but an LWE-shaped decryption problem rather than
        a signature forgery problem, and a scheme where the dual family is a
        documented competitor. A map that produces identical tags for ML-DSA
        and ML-KEM has not identified the problem SHAPE as the load-bearing
        structure and is tagging by scheme name rather than by derivation.
    proof_obligations:
      - claim: "Each FAM(k, P) is read from primary text, never inferred by matching bit counts."
        responsibility: interface
      - claim: "Every CONTESTED tag carries a specific citation to a specific contestation."
        responsibility: baseline
      - claim: "The map tags at least one ML-KEM-768 cell contested."
        responsibility: feasibility
      - claim: "The MSIS and SelfTargetMSIS rows come out uncontested for the LWE-distinguishing heuristic, by construction."
        responsibility: strictness
      - claim: "The direction of the dual-attack correction is read from primary text before CONTEST's sign is reported."
        responsibility: correctness
      - claim: "Cells whose family cannot be separated from the primary text are reported AMBIGUOUS, not resolved."
        responsibility: scope
      - claim: "All nine cells and both controls use one pinned estimator with memory charged identically."
        responsibility: memory
  predictions:
    - metric: "CONTEST(k, P) in bits, nine cells"
      direction: higher
      minimum_effect: >-
        predicted zero for the six MSIS and SelfTargetMSIS cells by
        construction, and predicted small but possibly non-zero for the three
        MLWE cells. A CONTEST above 5 bits at any MLWE cell is a reportable
        calibration finding; above 0 at any MSIS or SelfTargetMSIS cell is a
        classification error until proven otherwise.
    - metric: "ARGMIN_clean(k) versus ARGMIN_pub(k), three categories"
      direction: different
      minimum_effect: >-
        predicted identical at all three. A single category where they differ
        is the high-information outcome and is the direct answer to the
        research question; it is routed to independent review rather than
        reported.
    - metric: "number of cells reported UNDERIVABLE (published derivation not documented)"
      direction: different
      minimum_effect: >-
        predicted zero. Any non-zero count is itself a finding about a fielded
        standard's documentation and must be reported with the exact number
        and the sections searched.
    - metric: "CROSS-SCHEME CONTROL: contested cells in the ML-KEM-768 map"
      direction: higher
      minimum_effect: "must be at least one, or the classifier is tautologically clean and every ML-DSA row is void"
    - metric: "POSITIVE CONTROL: synthetic dual-argmin instance tagged contested"
      direction: different
      minimum_effect: "must be tagged contested; failure means the classifier is broken"
    - metric: "AMBIGUOUS cells (two families within the estimator's precision and the text does not separate them)"
      direction: different
      minimum_effect: >-
        any AMBIGUOUS cell must be reported as such; silently resolving one by
        picking the nearer number is the single most likely way this record
        could produce a false finding
  minimal_test:
    design: >-
      A literature and estimator exercise with no lattice reduction and no
      signing. Stage 1 builds the family/heuristic table (hours). Stage 2 is
      the primary-text gate: read ePrint 2023/302 and 2023/1850 for the
      contestation and its DIRECTION, and read the FIPS 204 and Dilithium
      security sections for the family set. Stage 3 is nine estimator
      invocations plus their contested-free counterparts. Stage 4 runs the two
      controls. Total: under a day once retrieval works. THIS DISCRIMINATES
      because three of its rows have values forced in advance -- the MSIS and
      SelfTargetMSIS cells must be uncontested by construction, the ML-KEM
      cross-scheme control must produce at least one contested cell, and the
      synthetic positive control must be tagged contested -- and because
      stage 2 alone can close the record with a citation if the specification
      turns out to minimise only over primal families. The AMBIGUOUS category
      is what keeps the classifier honest: a map with no ambiguity handling
      would manufacture certainty it does not have.
    controls:
      - "POSITIVE CONTROL: synthetic instance where the dual family is provably the argmin; must be tagged contested."
      - "CROSS-SCHEME CONTROL: identical map on ML-KEM-768; at least one contested cell required."
      - "NEGATIVE CONTROL: MSIS and SelfTargetMSIS rows must be uncontested for the LWE-distinguishing heuristic."
      - "AMBIGUITY HANDLING: cells with two families within estimator precision reported AMBIGUOUS, never resolved by proximity."
      - "DIRECTION CHECK: the sign of every CONTEST value justified against the primary text's stated correction direction."
      - "ONE PINNED ESTIMATOR, memory charged identically across all cells and both control schemes."
    required_metrics:
      - "the family/heuristic table with a citation and a tag per heuristic"
      - "FAM(k, P) and HEUR(k, P) for all nine cells, each with its primary-text location"
      - "B_pub, B_clean and CONTEST for all nine cells"
      - "ARGMIN_pub(k) and ARGMIN_clean(k) for the three categories"
      - "count and identity of UNDERIVABLE and AMBIGUOUS cells"
      - "both control outcomes"
      - "the routing table of contested heuristics to the program records that own them"
      - "a probe record (URL, date, HTTP result) for every source declared unobtainable"
  falsification_conditions:
    - "Stage 2 finds the published numbers minimise only over primal families: CONTEST is zero everywhere by inspection, the record closes with a citation, and the surviving deliverable is the reusable family/heuristic table and the routing map."
    - "The cross-scheme control produces no contested cell on ML-KEM-768: the classifier is tautologically clean and no ML-DSA row is reportable."
    - "The positive control is not tagged contested: the classifier is broken."
    - "An MSIS or SelfTargetMSIS cell is tagged contested for the LWE-distinguishing heuristic: a classification error, to be fixed before any result is reported, unless a specific argument is given for why the heuristic applies to a SIS-shaped instance."
    - "ARGMIN_clean differs from ARGMIN_pub at any category and both controls pass: escalate to independent review. This would be a statement that a fielded standard's binding assumption is an artefact of a contested heuristic, and it does not leave the program on a subagent's say-so."
    - "ePrint 2026/1048 turns out to reconcile the dual analyses so that the family is CORRECTED rather than CONTESTED: the tagging scheme has three states rather than two, every CONTEST value must be recomputed, and the record says so rather than retaining a stale binary tag."
    - "More than one cell is UNDERIVABLE: the map cannot be completed as designed, and the deliverable becomes the list of undocumented derivations, which is a smaller but honest result."
  confounders:
    - "The direction of the dual-attack correction. Ducas-Pulles found dual attacks over-optimistic, so a correction RAISES security estimates; getting this backwards would invert every reading in clause (D). Stage 2 reads the direction from primary text before any sign is reported."
    - "Primal and dual estimates for Dilithium-shaped MLWE are recalled as close, so FAM is not identifiable from the bit count. This is why the AMBIGUOUS category exists and why family identification is a text-reading step, not a numeric one."
    - "KN-FIND-001e68's finding that a closed-form estimator's primal readout is non-smooth in the sample-starved regime with no validity-range guard. Any cell evaluated near that regime inherits an instability the map would otherwise report as a clean number; the record must check each cell's m/n position against that finding and flag cells inside it."
    - "Heuristic vocabularies differ between sources, so the same assumption can appear under different names and be double-counted or missed. The table must key heuristics by their STATEMENT, not by their name, and record the alias set."
    - "The estimator this program pins may itself have been updated in response to Ducas-Pulles, in which case B_pub computed with it is already partly clean and CONTEST is understated. The estimator's version and its dual-model provenance must be recorded per row."
    - "591f9d's documented 355-in-beta instrument discrepancy applies to every absolute value here; the deliverable is differences and argmins under one instrument for that reason."
  interpretation_limits:
    - "No attack, no forgery, no new estimate, no exponent. The record produces a provenance map and two argmins."
    - "A CONTESTED tag is a statement about the literature at a date, not a statement that a heuristic is false. Tags are versioned and carry their citation."
    - "CONTEST is defined relative to a declared family set. Excluding a family is a modelling choice, and a different exclusion policy gives different numbers; the policy is stated and its sensitivity reported."
    - "A change of argmin is a change in what the ESTIMATE says binds under one exclusion policy and one estimator. It is not evidence that any assumption is broken and must never be phrased as such."
    - "The ML-KEM control is used only to validate the classifier and yields no claim about ML-KEM's security."
  heuristic_assumptions:
    - id: H1
      statement: >-
        For each of the nine cells, the family attaining the published minimum
        is uniquely determined by the primary text, i.e. the specification
        states which families it evaluated and which attained the minimum, so
        that FAM(k, P) is a fact to be read rather than a quantity to be
        inferred. Formally: the map from (k, P) to FAM is single-valued on the
        primary text's own account, for at least eight of the nine cells.
      rigorous_support: >-
        Rigorous ingredient: none is available, and the record says so rather
        than manufacturing one -- this is an assumption about a document, not
        about mathematics. The classical practice it imitates is the ordinary
        convention that a security-estimate section names its attack families,
        which most lattice specifications follow. The assumption is stated
        precisely so that its failure is a REPORTABLE OUTCOME (the UNDERIVABLE
        count) rather than a silent inference.
      validation_plan: >-
        Read the security-estimate sections of FIPS 204 and the Dilithium
        specification and, for each of the nine cells, record the exact
        sentence and section identifying the family, or record UNDERIVABLE
        with the sections searched. Cross-check against at least one
        independent re-estimation in the literature -- the QROM-Dilithium
        evaluation already surfaced by IDEA-20260828-9643b1 is one candidate,
        the public lattice-estimator's own Dilithium example is another --
        and report agreement or disagreement per cell. TAIL CHECK: for any
        cell where two sources name different families, report both and mark
        the cell AMBIGUOUS. Sampled parameters: all three categories, all
        three problems, no subsampling. TRANSFER ASSUMPTION: none; this is a
        read of the actual documents at their actual parameters.
    - id: H2
      statement: >-
        Excluding an attack family from a min changes the reported bit count by
        exactly the gap between that family's estimate and the next-best
        family's, with no interaction terms -- i.e. the families' cost models
        are independent of one another and the min is over a fixed, complete
        set, uniformly across the three categories.
      rigorous_support: >-
        Rigorous ingredient: min over a finite set is exactly the second
        smallest element when the smallest is removed, an identity with no
        content beyond bookkeeping. The classical statement imitated is the
        standard practice of treating attack families as independent
        alternatives, which is how every published lattice security estimate
        is assembled. The heuristic content is COMPLETENESS of the family set:
        a family nobody listed is a family the min does not see, and no
        experiment inside this program can rule one out.
      validation_plan: >-
        Compute the full sorted list of family estimates per cell, not merely
        the min, and report the gap structure: if the top two families are
        within the estimator's precision, CONTEST is not robust and must be
        reported with that sensitivity. TAIL CHECK: report the third-best
        family's value too, since a CONTEST computed against a second-best
        that is itself contested is meaningless. Sensitivity sweep: recompute
        every CONTEST under two alternative exclusion policies (exclude the
        contested family entirely; retain it with the corrected predictor of
        ePrint 2023/1850) and report both, so the exclusion policy's influence
        is measured rather than assumed away. Sampled parameters: all nine
        cells plus the two control schemes. TRANSFER ASSUMPTION: none.
  target_complexity:
    time_exponent: >-
      NOT APPLICABLE as a new attack complexity; no algorithm is proposed. The
      quantity with an exponent here is CONTEST(k, P), a difference between
      two classical core-SVP bit counts, i.e. a difference of exponents in
      2^(0.292 beta). The record reports that difference and its sign, and
      predicts it is zero on six cells by construction and small on the other
      three. Stating this as "not applicable" alone would understate what the
      record does: it moves no exponent but it audits which exponent the
      program is entitled to quote.
    memory_exponent: >-
      Not applicable as a new memory cost. Memory IS charged identically in
      every estimator row, at 2^(0.2075 beta) under the sieve model, because
      a CONTEST computed between a memory-free row and a memory-charged row
      would be an artefact of the accounting rather than of the heuristic.
    best_known: >-
      The incumbent practice, in this program and in the standard's lineage,
      is to quote min(MLWE, MSIS, SelfTargetMSIS) with no record of which
      attack family or which heuristic produced each term. This record's
      contribution is to attach that provenance.
    hidden_overhead: >-
      No o(1) to disclose, since no asymptotic is claimed. The analogous
      honesty obligation, and it is the real one: do not let "a dual attack
      exists in the literature" stand in for "the published number was
      produced by a dual attack", and do not let "a heuristic is contested"
      stand in for "the number is wrong". The AMBIGUOUS and UNDERIVABLE
      categories exist to keep both conflations visible.
    tradeoff_note: >-
      Not applicable to the map itself. It becomes relevant inside one cell:
      dual-family estimates are typically memory-hungry and their
      time-memory position differs from the primal family's, so a CONTEST
      value computed at one memory cap can vanish at another. Every CONTEST
      is therefore reported at a declared memory cap and swept across at
      least two caps, and a CONTEST that survives only at unbounded memory is
      reported as such and not counted as a finding.
  dominated_by: >-
    n/a (no attack, no algorithm, no cost improvement is claimed). Frontier
    rows checked before setting this: the record proposes no point on the
    time/memory/data frontier for any ML-DSA problem, so there is nothing for
    a frontier row to dominate. On the DELIVERABLE axis, the nearest
    competitors were checked individually: IDEA-20260828-9643b1 audits the
    provable-versus-heuristic axis, a different epistemic dimension;
    IDEA-20260808-63427b owns one enumerated heuristic and is routed to, not
    duplicated; IDEA-20260828-fe3cee owns the quantum-depth heuristics and is
    likewise routed to; EXP-LATDUAL-89afec and EXP-LATDUAL-194b83 measure
    dual-distinguisher behaviour under a different question and a different
    scheme, and supply this record's control rather than dominating it. No
    record in the corpus produces a per-cell heuristic-provenance map for
    ML-DSA, so none dominates this one.
  sota_delta: >-
    No attack; disclosure and calibration contribution only. Quantitatively:
    nine CONTEST values in bits and a before/after argmin per category,
    against an incumbent whose value for all of these is UNSTATED -- this
    program has never recorded which attack family produced any ML-DSA number.
    Predicted delta: zero on six cells by construction, small on three, and no
    argmin change; the record is written so that this predicted outcome is a
    reportable positive assurance rather than a null session. The smallest
    CONTEST worth reporting as a finding rather than instrument noise is
    5 bits, given the estimator-precision and instrument-discrepancy caveats
    carried in confounders.
