idea:
  id: IDEA-20260829-a9d9b7
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Which of ML-DSA's three headline numbers is produced by an attack family
    whose cost model rests on the INDEPENDENCE HEURISTIC that Ducas and Pulles
    showed to be self-contradictory in the cryptographically relevant regime?
    Build the heuristic-provenance map: per category, per assumption, the
    argmin attack family and the named heuristics its cost model uses, then
    report CONTEST = (best contested-heuristic-free estimate) minus (published
    estimate) and whether removing the contested families CHANGES WHICH
    ASSUMPTION BINDS.
  class: measurement
  claim: >-
    (A) THE QUESTION NOBODY IN THIS LANE HAS ASKED. Fifteen RQ-MLDSA-001
    proposals dispute what the numbers ARE -- the norm budget (591f9d), the
    l-infinity conversion (63427b), the arm interpolation (c1abd1), the depth
    cap (fe3cee), the reduction's provable backing (9643b1). None asks the
    prior question of WHICH ATTACK FAMILY produced each published number and
    WHAT HEURISTICS that family's cost model assumes. A bit count is not a
    measurement; it is the output of a cost model, and cost models have named,
    separately falsifiable assumptions. Some of ML-DSA's are contested in
    print and the program has never checked whether the contested ones are
    load-bearing here.
    (B) THE EXTERNAL INGREDIENT, WHICH IS RECENT AND SPECIFIC. Ducas and
    Pulles, "Does the Dual-Sieve Attack on Learning with Errors Even Work?"
    (CRYPTO 2023, ePrint 2023/302), address the Guo-Johansson and MATZOV
    dual-attack improvements against NIST lattice candidates and, per the
    search synthesis cited below, identify a CONTRADICTION in the Independence
    Heuristic those attacks rely on: it yields wrong score distributions for
    both the true solution and for incorrect candidates in a regime that is
    exactly the cryptographically relevant one, and contradicts known
    statistical impossibility results there. A follow-up, "Accurate Score
    Prediction for Dual-Sieve Attacks" (ePrint 2023/1850), supplies a
    corrected predictor, and a 2026 work, "Unified Dual Attack Analyses:
    Covariance-Based" (ePrint 2026/1048), was surfaced by the same search and
    appears to be a further reconciliation. NONE OF THESE APPEARS ANYWHERE IN
    THIS PROGRAM'S ML-DSA RECORDS. The program does hold dual-attack material,
    but it is scoped to ML-KEM (EXP-LATDUAL-89afec and EXP-LATDUAL-194b83,
    both under RQ-MLKEM-003) and to a closed-form-estimator stability finding
    (KN-FIND-001e68). Nothing connects it to ML-DSA.
    (C) THE OBJECT, MADE EXACT. For each FIPS 204 category k in {44, 65, 87}
    and each problem P in {MLWE, MSIS, SelfTargetMSIS}, define
    FAM(k, P) = the attack family attaining the published minimum;
    HEUR(k, P) = the ordered list of named heuristics that family's cost model
    invokes, each tagged CONTESTED or UNCONTESTED against a declared, cited
    contestation source;
    B_pub(k, P) = the published/incumbent bit count;
    B_clean(k, P) = the best estimate over families whose cost model invokes
    NO contested heuristic;
    CONTEST(k, P) = B_clean(k, P) - B_pub(k, P), in bits.
    Then define the two argmins: ARGMIN_pub(k) = argmin over P of B_pub, and
    ARGMIN_clean(k) = argmin over P of B_clean. THE DELIVERABLE IS THE PAIR OF
    ARGMINS AND THE NINE CONTEST VALUES.
    (D) THE DISCRIMINATION, THREE-WAY AND SHARP. (i) CONTEST(k, P) = 0 for all
    nine cells: every ML-DSA headline number is produced by a
    contested-heuristic-free family, the Ducas-Pulles contradiction is not
    load-bearing for this scheme, and that is a POSITIVE ASSURANCE this
    program has never recorded and which is worth recording precisely because
    it is currently assumed rather than checked. (ii) CONTEST(k, P) > 0 for
    some cell with ARGMIN unchanged: the published number for that cell is
    conservative by CONTEST bits -- note the DIRECTION, since Ducas-Pulles
    found dual attacks were over-optimistic, so removing them RAISES the
    estimate -- and the scheme's headline is unaffected. (iii) CONTEST > 0 and
    ARGMIN_clean differs from ARGMIN_pub at any category: THE ASSUMPTION THAT
    BINDS IS AN ARTEFACT OF A CONTESTED HEURISTIC. That is a direct,
    quantitative answer to RQ-MLDSA-001's decision_target and it is reachable
    with no lattice reduction and no compute beyond estimator invocations.
    (E) THE FORCED ROWS THAT MAKE THIS AN INSTRUMENT AND NOT AN OPINION. Two
    cells have values determined in advance and are the record's calibration.
    First, the MSIS and SelfTargetMSIS rows: the dual attack in the
    Ducas-Pulles sense is a DISTINGUISHING attack against LWE-shaped
    instances, and the SIS-shaped instances are estimated by primal
    short-vector search; if the map is built correctly those rows must come
    out UNCONTESTED by construction, and a map that tags them contested has a
    classification error. Second, the fetched lattice-estimator documentation
    states that its infinity-norm SIS analysis "treat[s] each coordinate of
    the vector as an i.i.d Gaussian random variable" below the q-ary
    threshold -- an independence assumption of the same SHAPE as the contested
    one, in a different setting. THIS RECORD LISTS IT IN HEUR AND DOES NOT
    INTERROGATE IT, because IDEA-20260808-63427b already owns that
    interrogation; the map's job is to enumerate dependencies and route them,
    not to absorb every sibling record's question.
    (F) WHAT IS NOT CLAIMED. No attack, no forgery, no new cost model, no
    re-derivation of any estimate. The record produces a provenance map and
    two argmins. It cannot and does not claim that any contested heuristic is
    false at ML-DSA parameters, only which published numbers would move if the
    contestation is upheld.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST. The tracked object is the DERIVATION
    CHAIN of a published bit count, projected to the pair (attack family, set
    of invoked heuristics). This is genuinely lossy: it discards the numeric
    value, the block size, the memory model, the parameter set's actual
    geometry, and everything about how tight the estimate is. It discards them
    compatibly with the operation that acts on the object -- replacing one
    attack family by another in the min -- because the heuristic set of a
    family is a property of the family, not of the parameters it is evaluated
    at, so the projection propagates deterministically under family
    substitution. It is not a change of coordinates: many different bit counts
    map to the same (family, heuristic set), and that many-to-one collapse is
    exactly what makes the map reusable across parameter sets and across the
    program's other lattice goals.
    STAGE 1, ENUMERATE THE FAMILIES AND THEIR HEURISTICS. Build the table
    without reference to ML-DSA: for each of primal-uSVP, primal-BDD/Bai-
    Galbraith, dual, dual-sieve-with-FFT, hybrid guess-and-lattice, and
    SIS primal short-vector search, list the named heuristics each cost model
    invokes (geometric series assumption, the 2016 uSVP success condition, the
    Independence Heuristic, the i.i.d.-coordinate model for infinity norms,
    sieve-dimensions-for-free, and any others found), with a citation per
    heuristic and a CONTESTED/UNCONTESTED tag carrying its contestation
    source. This table is the reusable artefact and it is worth filing as a
    KN-TECH entry independently of the ML-DSA result.
    STAGE 2, PRIMARY-TEXT GATE. Read the full text of ePrint 2023/302 and
    2023/1850, and of 2026/1048 if it supersedes them, to establish precisely
    WHICH heuristic is contested, in WHICH regime, and in WHICH DIRECTION the
    correction moves the cost. The direction is essential: a correction that
    makes attacks weaker raises security estimates, and confusing the sign
    would invert clause (D)'s reading. Also read the FIPS 204 and Dilithium
    specification text to establish which families their published numbers
    actually minimise over -- this record's entire premise is that the
    incumbent is a min over a declared family set, and if the specification
    minimises over only primal families the answer to (D) is (i) by
    inspection and the record closes cheaply and honestly.
    STAGE 3, EVALUATE. Under one pinned estimator, compute B_pub and B_clean
    for all nine cells with memory charged identically, and report the nine
    CONTEST values and the two argmins.
    STAGE 4, THE NULL AND THE CROSS-SCHEME CONTROL. Apply the identical map to
    ML-KEM-768, where this program already holds dual-attack experimental
    material (EXP-LATDUAL-89afec, EXP-LATDUAL-194b83, KN-FIND-001e68) and
    where the dual attack is known to be a live competitor. The map MUST tag
    at least one ML-KEM cell contested; a map that finds nothing contested
    anywhere is not measuring, it is tautologically clean, and every ML-DSA
    row is then uninformative. Separately, apply the map to a SYNTHETIC
    instance constructed so that the dual family is provably the argmin --
    a null-object positive control whose answer is known before it is run.
    STAGE 5, ROUTE, DO NOT ABSORB. For every heuristic the map tags contested
    that another record in this program already owns, emit a pointer rather
    than an analysis: the i.i.d.-coordinate model to IDEA-20260808-63427b, the
    worst-case-to-average-case reduction's status to IDEA-20260828-9643b1, the
    quantum-depth assumptions to IDEA-20260828-fe3cee, the estimator's
    sample-starved instability to KN-FIND-001e68. The map's value is that it
    makes the program's existing disputes addressable by cell.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Grepped the repository for "dual attack|dual-sieve|Ducas-Pulles|
      Ducas and Pulles|MATZOV|Guo-Johansson|independence heuristic",
      case-insensitive, over yaml and md. Forty files matched, and the
      ML-relevant ones are scoped to ML-KEM or to generic lattice tooling:
      experiments/EXP-LATDUAL-89afec and EXP-LATDUAL-194b83, both carrying
      question_id RQ-MLKEM-003 and titled around dual-distinguisher success
      curves and FFT score rank at small parameters; knowledge/findings/
      KN-FIND-001e68, on a closed-form estimator's non-smooth block-size
      readout in the sample-starved regime; GOAL-MLKEM-005 and GOAL-ECTD-001.
      NO ML-DSA record matched. Separately read this session: all 15
      RQ-MLDSA-001 titles, ten of the records in full or substantial part, and
      both RQ records in full. None enumerates attack families or their
      heuristic dependencies for any ML-DSA number.
    web: >-
      One WebSearch this session (2026-08-29) confirmed Ducas and Pulles,
      "Does the Dual-Sieve Attack on Learning with Errors Even Work?", CRYPTO
      2023, ePrint 2023/302, and surfaced "Accurate Score Prediction for
      Dual-Sieve Attacks" (ePrint 2023/1850) and "Unified Dual Attack
      Analyses: Covariance-Based" (ePrint 2026/1048). All three seen as search
      result listings plus a synthesis paragraph; NONE FETCHED. A separate
      WebFetch this session of the lattice-estimator SIS documentation is the
      only source in this record actually read.
    verdict: >-
      UNVERIFIED. The Ducas-Pulles contestation is published and well known,
      so nothing about the ingredient is novel. What was not found, in this
      corpus or in anything read this session, is a per-category per-assumption
      heuristic-provenance map for ML-DSA with CONTEST values and a
      before/after argmin. The load-bearing premise -- that the published
      numbers minimise over a family set that includes a contested family --
      is itself unread, which is why stage 2 is a gate that can close the
      record in a morning.
  object_first_candidate:
    tracked_object: >-
      The derivation chain of a published bit count, projected to the pair
      (attack family attaining the minimum, set of named heuristics that
      family's cost model invokes).
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) recomputing any bit count from
      geometry -- that is 591f9d, 008, 63427b, 5a748c territory and this
      record inherits their numbers rather than competing; (2) the two-arm min
      and its interpolations (5194f9, c1abd1); (3) the quantum depth cap
      (fe3cee); (4) the worst-case reduction (9643b1); (5) CRT projections
      (5535fe); (6) fault-derived constraints (818196, 6e79b4). This record's
      lens is one level up: not what the number is, but what it is downstream
      of.
    genuinely_new_or_repackaging: >-
      The map is new to this program and, as far as this session could check,
      not published for ML-DSA. It is not a new attack, a new bound, or a new
      cost model, and it does not pretend to be. Its ambition is deliberately
      lower than the other three records filed with it and it is ranked
      accordingly.
    concretely_testable: >-
      Yes, and its one-step propagation is unusually clean: replacing one
      family by the next-best family in the min is a single, well-defined
      step, and the observable after the step is a bit count and a tag.
    survival_score: >-
      The object survives as long as the incumbent's family set is knowable
      from primary text. It dissolves at the first published number whose
      derivation is not documented -- and locating any such number IS a
      deliverable, since an undocumented derivation in a fielded standard's
      security claim is exactly the kind of unstated assertion RQ-MLDSA-001
      and its sibling exist to find.
  null_object_control: >-
    Two, in order. POSITIVE CONTROL: a synthetic LWE-shaped instance built so
    that the dual family is provably the argmin. The map must tag its
    published-equivalent number contested; if it does not, the classifier is
    broken. CROSS-SCHEME CONTROL: the identical map applied to ML-KEM-768,
    where this program already holds dual-attack material; at least one cell
    must come out contested, or the map is tautologically clean and every
    ML-DSA row is uninformative. NEGATIVE CONTROL: the MSIS and SelfTargetMSIS
    rows, which must come out uncontested by construction because the
    contested heuristic belongs to LWE-shaped distinguishing attacks; a
    contested tag there is a classification error, not a finding.
  discriminated_from:
    - >-
      IDEA-20260828-9643b1 asks what PROVABLE floor backs the heuristic
      estimate, i.e. it audits a reduction theorem. This record stays entirely
      inside the heuristic tier and audits which HEURISTIC the estimate rests
      on. 9643b1's finding would be identical regardless of which attack
      family produced the number; this record's finding would be identical
      regardless of what the reduction certifies. They are orthogonal and
      compose into a two-axis epistemic label per cell, which is worth saying
      once both exist.
    - >-
      IDEA-20260808-63427b interrogates the i.i.d.-coordinate model for
      infinity-norm SIS. This record LISTS that model as a dependency and
      routes it to 63427b rather than analysing it. If a session merges the
      two, 63427b's question is the one that should be answered and this
      record's contribution reduces to the routing table.
    - >-
      IDEA-20260828-fe3cee audits depth assumptions on the quantum rows. This
      record's map includes quantum families as rows with their own heuristic
      lists and routes them to fe3cee. The map is a directory of this
      program's ML-DSA cost-model disputes, indexed by cell; that indexing is
      its main practical value and it explicitly does not re-litigate any of
      them.
    - >-
      EXP-LATDUAL-89afec and EXP-LATDUAL-194b83 measure dual-distinguisher
      behaviour at small ML-KEM parameters under RQ-MLKEM-003. This record
      runs no distinguisher and measures no score; it uses ML-KEM only as the
      cross-scheme control in stage 4, and it must cite those experiments'
      evidence records rather than re-running them.
  citations:
    - ref: "Lattice Estimator documentation, SIS Lattice Attacks page (lattice-estimator.readthedocs.io/en/latest/algorithms/sis-lattice.html)"
      provenance: retrieved
      claim: >-
        For infinity-norm bounds below the q-ary threshold the estimator
        "simulate[s] the cost of generating many short vectors and treat[s]
        each coordinate of the vector as an i.i.d Gaussian random variable";
        above the threshold it "explicitly account[s] for the q-ary structure
        of the lattice". Estimation is available only for euclidean and
        infinity norms. Used here as one enumerated entry in HEUR, tagged and
        routed to IDEA-20260808-63427b, not analysed.
      verified_by: "idea-generator subagent, WebFetch, 2026-08-29: page fetched and read in full this session; the quoted phrases are from the fetched text."
    - ref: "IACR ePrint 2023/302, Ducas and Pulles, \"Does the Dual-Sieve Attack on Learning with Errors Even Work?\", CRYPTO 2023"
      provenance: recalled
      claim: >-
        Per WebSearch synthesis this session: addresses the Guo-Johansson and
        MATZOV dual-attack improvements against NIST lattice candidates,
        identifies a contradiction in the Independence Heuristic those attacks
        rely on, and shows it gives wrong score distributions for both the
        true solution and incorrect candidates in a contradictory regime
        relevant to cryptographic security, conflicting with known statistical
        impossibility results. NOT FETCHED; no theorem statement, regime
        boundary, or correction direction has been read, and the DIRECTION is
