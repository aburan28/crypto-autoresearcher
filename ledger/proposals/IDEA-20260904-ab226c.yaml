  assumptions:
    - >-
      p > 3, E ordinary, t not in {0, 1} for primary cells (supersingular and
      anomalous excluded per the RQ), N = p + 1 - t prime for primary cells,
      embedding degree and twist rows declared for every censused curve.
    - >-
      delta(E) is a DEGREE, not a cost. The cost of APPLYING the minimal
      endomorphism is a separate quantity and is the subject of the companion
      record on smooth-norm evaluation; this record never converts delta into a
      cost.
    - >-
      Class enumeration completeness is CERTIFIED against
      hurwitz_class_number at 16 and 20 bits; at 24 bits and above the trace
      enumeration uses the Hurwitz value directly and no enumeration is claimed.
    - >-
      The O(B) membership test of (D) is EXACT, not heuristic: it either
      exhibits a fundamental d with (4p - t^2)/|d| a perfect square or proves
      none with |d| <= 4B exists. Its only limitation is the declared B.
    - >-
      The 160-256 bit rung makes NO claim from sampling. Its constructive half
      exhibits cell members; its sampling half reports zero hits as consistent
      with a predicted rate, which is a tail check and not a measurement.

  object_first_candidate:
    tracked_object: >-
      delta(E) = |disc End_{F_p}(E)|/4, one positive integer per curve, with the
      class-level minimum delta_min(C) = |Delta_K|/4 and the ratio f_O^2.
    lossiness: >-
      GENUINELY LOSSY. delta discards the curve equation, j, the point set, the
      order N, the class, and every coordinate; it retains one integer, and its
      fibres are enormous (every curve in every class of the same End-order
      discriminant shares it). Nothing is recoverable, so it is NOT a change of
      coordinates. COMPATIBILITY WITH THE OPERATIONS USED. Under the census's
      aggregation (counting over disjoint curve sets) it propagates trivially.
      Under the census's other declared operation, bounded-degree F_p-rational
      isogeny, it propagates DETERMINISTICALLY AND EXACTLY by the ell^2 law of
      (B) -- delta -> delta*ell^{+-2} or delta, decided by the volcano
      direction. THAT is what makes it admissible where a generic curve
      invariant is not: the isogeny is the operation the RQ names, and delta is
      one of the few projections that survives it with a closed-form update
      rule. It is NOT compatible with the group law and this record never
      applies the group law to it.
    propagation: >-
      One-step propagation is defined and measurable: apply an ell-isogeny,
      recompute the level with rational_isogeny_count, and assert delta changed
      by exactly ell^{+-2} or not at all. That assertion is a blocking control.
    survival_score: >-
      Survives the entire isogeny lane by construction and dies exactly at the
      boundary of the class (a curve of a different order has an unrelated
      delta) and at composite order, where the prime-order screens fail. Both
      boundaries are named and both are used as controls.

  null_object_control: >-
    NULL-1, RANDOM-INTEGER NULL (blocking, primary). Replace 4p - t^2 by a
    uniformly random integer of the same size and congruence class mod 4 and
    recompute the whole cell census. The class-level cell density measured on
    the elliptic data must be consistent with this null under READING 1; a
    material excess is the first sign that the arithmetic of 4p - t^2 is not
    generic and routes to STAGE 4.
    NULL-2, UNCONDITIONED TRACES. The same census over all admissible traces
    without the prime-order screen. The comparison against the prime-order
    restricted census IS the READING 2 discriminator and is blocking.
    POSITIVE CONTROL A (blocking): the UNIT cell. The measured |Aut| > 2 counts
    must be exactly 6 / 4 / 10 / 0 by congruence class mod 12 and the fitted
    density exponent must be -1.00 within CI, reproducing IDEA-20260829-2dc43c.
    A method that misses the cell it can check against a filed record cannot be
    trusted on the cell it cannot.
    POSITIVE CONTROL B (blocking): the ell^2 law. On at least 50 vertex pairs
    joined by a single certified ell-isogeny, delta must change by exactly
    ell^2, ell^{-2} or 1, matched to the direction reported by
    rational_isogeny_count. A single mismatch voids (B).
    POSITIVE CONTROL C: constructed CM curves at 256 bits with declared d,
    which must be reported in the cell by the O(B) test. An instrument that
    cannot see a curve built to be in the cell is blind.
    NEARBY-OBJECT CONTROL: composite order. There delta is unchanged in
    definition but the prime-order screens fail and the class may contain
    curves of different group structure; the census must show the joint
    distribution changing, demonstrating the primality hypothesis is
    load-bearing.
    MATCHED PARETO ROWS: on a subsample, charged rho and charged BSGS with
    memory (KN-TECH-006, KN-TECH-031), so the arithmetic census carries the
    RQ's mandatory cost comparators even though it measures no timing.
    DECAY PARAMETER: p. The unit-cell density must fall as p^{-1}; the
    class-level cell density as p^{-1/2}. A cell density that does NOT fall is
    the section-3 artifact tell and voids the count.

  relation_to_prior:
    - >-
      IDEA-20260829-2dc43c (NEAREST). It closes the UNIT cell exactly:
      |Aut| = w(D), at most 10 curves per prime, density 5/p, population
      discount 1 + 3.02/p, exhaustively censusable. EXACT DELTA: the unit cell
