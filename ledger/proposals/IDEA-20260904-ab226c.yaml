      the filtration delta(E) <= B, gives the closed form delta = |Delta_O|/4,
      gives the ell^2 update rule that 2dc43c has no analogue of (|Aut| is
      NOT changed by a generic ell-isogeny; delta always is), and shows the
      class-level cell is sqrt(p) times larger than the unit cell. 2dc43c's
      counts are used here as POSITIVE CONTROL A, not repeated.
    - >-
      IDEA-20260829-20b05f. Closes the reachable curve-level invariant set to
      {j, f, |Aut|} and proposes a within-class regression on log f against
      rho work. EXACT DELTA: that record treats f as a regressor against a
      TIMING outcome inside one class at one bit size; this record treats
      Delta_O = f_O^2 Delta_K as the object itself, gives its exact
      arithmetic meaning (delta), its exact update law, and its POPULATION
      occupancy across nine bit sizes with no timing at all. 20b05f's column
      closure is used, not contradicted: f is exactly the reachable invariant
      that delta is a function of.
    - >-
      IDEA-20260829-34f3ed. Measures the census's finite-size timing bias and
