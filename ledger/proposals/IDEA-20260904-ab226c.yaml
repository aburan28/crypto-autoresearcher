      ledger/ for 'Hurwitz', 'Kronecker class number', 'Eichler-Selberg',
      'conductor', 'volcano', 'maximal order', 'square part', 'H(4p'.
    results: >-
      The Hurwitz-Kronecker mass formula is already used in this program as a
      CLASS-ENUMERATION COMPLETENESS CERTIFICATE (harness/isogeny_class.py;
      EV-ICINV-6b6264 records H(15104) = 138 at p = 4001, t = 30;
      EV-ICINV-343679 records D_0 = -59, f = 16 for that class). It is NOT used
      anywhere as a CENSUS OCCUPANCY DENSITY, and no record states delta(E) =
      |Delta_O|/4, the ell^2 law, the class-level minimum, the
      Theta(p^{-1/2}) versus Theta(p^{-1}) contrast, the O(B) factoring-free
      membership test, or the prime-order conditioning question.
      IDEA-20260829-2dc43c counts the UNIT cell only and says so.
      IDEA-20260829-20b05f names f as a reachable invariant and proposes a
      regression on log f WITHIN one class, but does not define delta, does not
      state the ell^2 law, and takes no population or scale statement.
    verdict: >-
      UNVERIFIED. (A) and (B) are textbook consequences of the principal form
      and Kohel's volcano, derived here rather than cited, and no external
      source was opened for them. (C) composes textbook counting theorems.
      (D) is a standard CM-recognition trick. What is claimed is the census
      framing, the cell size contrast and the scale reach, not new mathematics.

