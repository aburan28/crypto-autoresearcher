idea:
  id: IDEA-20260904-ab226c
  id_allocation_provenance: >-
    Token minted by the coordinator with
    `python3 tools/allocate_id.py --next idea --date 20260904` and confirmed
    free with `--check` (0 occurrences across 11563 identifier-bearing paths),
    relayed to this session 2026-09-04. Not derived by scanning state.
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record visible to this session. Left null
    deliberately, not omitted.
  added: '2026-09-04'
  title: >-
    THE CENSUS HAS BEEN COUNTING THE WRONG CELL BY A FACTOR OF sqrt(p): the
    endomorphism-relevant quantity is delta(E) = |disc End_{F_p}(E)|/4, the
    EXACT degree of the cheapest non-scalar endomorphism, and an ell-isogeny
    multiplies it by ell^{+-2}, so the operationally relevant invariant is the
    CLASS minimum delta = |Delta_K|/4 -- whose cell has density
    Theta(p^{-1/2}) against the Theta(p^{-1}) of the |Aut| > 2 cell
    IDEA-20260829-2dc43c counts; and cell membership is decidable in O(B)
    integer operations with NO factoring and NO point counting, so this is the
    one census column that can be filled EXACTLY at all six declared bit sizes
    AND at 256 bits
  class: measurement

  claim: >-
    (A) THE EXACT INVARIANT, DERIVED HERE, ZERO COMPUTE. Let E/F_p be ordinary,
    p > 3, with End_{F_p}(E) = O an imaginary quadratic order of discriminant
    Delta_O < 0. For an ordinary curve degree equals norm on End(E), and the
    norm form of O in the basis {1, omega} is the PRINCIPAL form of
    discriminant Delta_O, Q(x, y) = x^2 + b x y + ((b^2 - Delta_O)/4) y^2 with
    b in {0, 1}, b = Delta_O mod 2. Minimising Q over y = +-1 (that is, over
    endomorphisms NOT in Z) gives
        delta(E) := min { deg psi : psi in End(E), psi not in Z }
                  = |Delta_O|/4        if Delta_O = 0 mod 4,
                  = (|Delta_O| + 1)/4  if Delta_O = 1 mod 4.
    This is an identity, not an estimate. It is the ordinary prime-field
    analogue of the quantity Wesolowski's exemplar bounds in the supersingular
    case (the degree of the smallest isogeny E -> E^{(p)}), and unlike that
    quantity it is computable in closed form from the discriminant.

    (B) THE ell^2 LAW. Delta_O = f_O^2 Delta_K with Delta_K the fundamental
    discriminant of the class and f_O the conductor of O. An F_p-rational
    ell-isogeny is ascending (f_O -> f_O/ell), descending (f_O -> f_O*ell) or
    horizontal (f_O unchanged). THEREFORE A BOUNDED-DEGREE ell-ISOGENY
    MULTIPLIES delta BY EXACTLY ell^{-2}, ell^{+2} OR 1 -- a quadratic change
    of the endomorphism-side quantity at linear Velu cost. This is, inside the
    RQ's declared scope, the ONLY mechanism by which the census's "charged
    isogeny transfer" method changes anything on the endomorphism side, and it
    saturates: the class minimum is
        delta_min(C) = |Delta_K|/4,   delta(E)/delta_min(C) = f_O^2 <= f_pi^2,
    where f_pi is the conductor of Z[pi], t^2 - 4p = f_pi^2 Delta_K.

    (C) THE CELL THE CENSUS DOES NOT HAVE, AND ITS SIZE. IDEA-20260829-2dc43c
    closes the |Aut| > 2 column exactly: at most 10 curves per prime, density
    5/p, population discount 1 + 3.02/p. That cell is delta = 1 -- the UNIT
    cell. The endomorphism-relevant cell is the FILTRATION delta(E) <= B, and
    at the CLASS level it is {|Delta_K| <= 4B}. Its occupancy follows from
    Deuring's counting theorem and the Hurwitz-Kronecker mass identity
    sum_t H(4p - t^2) = 2p: for a fundamental discriminant d the prime p
    admits a class with Delta_K = d exactly when 4p = t^2 + |d| f^2 is
    solvable, and the resulting single class has H(4p - t^2) = Theta(sqrt p)
    vertices. Hence
        expected number of TRACES per prime with |Delta_K| <= 4B
            = C(B) := sum over fundamental d, |d| <= 4B, of 1/(2 h(d)),
        which is INDEPENDENT OF p,
        expected fraction of CURVES per prime in the cell
            = C(B) * E[H] / (2p) = Theta(C(B) * p^{-1/2}).
    SO THE CLASS-LEVEL CHEAP-ENDOMORPHISM CELL IS sqrt(p) TIMES LARGER THAN THE
    UNIT CELL THE CENSUS CURRENTLY COUNTS -- a factor 2^128 at p ~ 2^256 --
    while remaining negligible in absolute density. Both statements are
    quantitative and both are checkable.

    (D) THE TECHNIQUE THAT REACHES CRYPTOGRAPHIC SCALE, AND IT NEEDS NO
    FACTORING. Membership in {|Delta_K| <= 4B} is decidable EXACTLY at any p by
    O(B) integer operations: for each fundamental d with |d| <= 4B, test
    whether (4p - t^2)/|d| is a nonnegative perfect square. No factorisation of
    4p - t^2 is required, no point counting is required, and the test is exact.
    This is why this column, alone among the census's columns, can be filled at
    16, 20, 24, 28, 32 and 36 bits AND at 160, 192 and 256 bits -- addressing
    directly the coverage gap IDEA-20260829-34f3ed measures (five of six
    declared rows empty, the sixth populated from below).

    (E) THE DISCRIMINATION. Two mutually exclusive readings, decided by the
    same exhaustive count.
      READING 1 -- SCALE-INVARIANT ARITHMETIC. The fitted exponent of the
      class-level cell density is -0.50 +/- 0.10 and the fitted exponent of the
      unit cell is -1.00 +/- 0.10 (recovering 2dc43c's 5/p as a positive
      control), and C(B) is measured independent of p across 16-36 bits and
      confirmed at 160-256 bits by the O(B) test. Then the census acquires an
      ARITHMETIC axis that TRANSFERS with scale, in explicit contrast to its
      timing axis which 34f3ed shows does not; the endomorphism-orbit lane's
      population value is pinned at Theta(p^{-1/2}) rather than Theta(p^{-1});
      and the decision target reads "the orbit lane is worth sqrt(3) on a cell
      of density Theta(p^{-1/2}), reachable from Theta(sqrt p) curves each".
      READING 2 -- PRIME-ORDER CONDITIONING BIASES THE CONDUCTOR. The measured
      C(B) restricted to prime-order traces differs from the unrestricted C(B)
      beyond CI at two independent bit sizes. Then conditioning on N = p+1-t
      prime is NOT independent of the square part of t^2 - 4p, the census's
      entire population is biased in a way no record has recorded, and the cell
      size in (C) is wrong for exactly the curves this RQ studies. That is the
      outcome worth escalating and it is a genuine number-theoretic finding,
      not an instrument artifact.

    (F) WHAT IS NOT CLAIMED. No exponent moves. delta small buys NOTHING beyond
    sqrt(|Aut|) by IDEA-20260901-6b63a4's norm-order tradeoff, and this record
    asserts no attack. The claim is that the census has been measuring a cell
    that is sqrt(p) times too small, that the correct cell is exactly
    computable, and that this is the only census column that can be honestly
    filled at cryptographic scale.

  mechanism: >-
    THE TRACKED OBJECT is delta(E) = |disc End_{F_p}(E)|/4, a single positive
    integer per curve, with its class-level minimum |Delta_K|/4 and the ratio
    f_O^2 between them. Its lossy-projection test is in
    `object_first_candidate`.

    STAGE 0 (zero compute). Derive (A) from the principal form; derive (B) from
    Kohel's volcano level; derive (C) from Deuring plus Hurwitz-Kronecker;
    state (D) as an algorithm with its O(B) bound. Emit C(B) as a table for
    B in {1, 10, 100, 10^3, 10^4, 10^6} computed from tabulated class numbers.
    All four are reviewable with no runs.

    STAGE 1 (low compute, EXHAUSTIVE, 16 and 20 bits). For 20 primes per bit
    size, enumerate every F_p-isomorphism class with harness/isogeny_class.py,
    compute t, N, the prime-order and ordinary flags, j, |Aut|, the anomalous
    and embedding-degree screens (KN-TECH-032, KN-TECH-033, KN-TECH-034),
    frobenius_discriminant(p, t), fundamental_discriminant -> (Delta_K, f_pi),
    the volcano level per ell via rational_isogeny_count, hence f_O, hence
    Delta_O, hence delta(E). Certify each class against hurwitz_class_number.
    Tabulate the exact joint distribution of (delta(E), delta_min(C), |Aut|,
    prime-order, anomalous, embedding degree).

    STAGE 2 (low compute, 24 and 28 bits, NO FULL ENUMERATION). Enumerate
    traces rather than curves: for every admissible t compute Delta_K, f_pi and
    H(4p - t^2), which gives the exact curve counts per cell without touching a
    single curve. Verify against STAGE 1 at 20 bits, where both methods apply
    and must agree exactly.

    STAGE 3 (low compute, 32, 36, 160, 192 and 256 bits, THE SCALE RUNG). At
    32 and 36 bits enumerate all traces as in STAGE 2. At 160, 192 and 256
    bits, where the Hasse interval has ~2^{81}..2^{129} traces, sample 10^6
    traces uniformly, apply the O(B) membership test of (D) with B = 10^6, and
    importance-weight by H(4p - t^2) computed from the same decomposition.
    Predicted hits: zero, at a predicted rate below 2^{-100}; the informative
    content is the CONSTRUCTIVE half - build, by the reverse CM construction
    (choose d and f, solve 4p = t^2 + |d| f^2 for p prime with p + 1 - t
    prime), at least three 256-bit curves in the cell, verify they pass every
    RQ screen, and record delta = |d|/4 and the class size H.

    STAGE 4 (zero compute, THE CONDITIONING TEST). Compare the empirical C(B)
    over ALL admissible traces against C(B) restricted to traces with
    p + 1 - t prime, by a two-proportion exact test pooled across the 40
    exhaustively censused primes, and report the ratio with CI. This is
    READING 2's discriminator and it costs nothing beyond STAGE 1's data.

    STAGE 5 (zero compute, THE ARTIFACT). Emit the arithmetic census table:
    per bit size, per cell, an EXACT count with a completeness certificate,
    the fitted density exponents, C(B), the conditioning ratio, and an
    obstruction record for the fitted class-level exponent with units, error
    bars, runs and scope.

