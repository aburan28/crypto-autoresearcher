    - >-
      IDEA-20260901-6b63a4 (different RQ). Its T1 is what makes this record's
      conclusion a CLOSURE rather than a lead: a small delta does not buy a
      short orbit. Cited as the reason the cell, once counted, is worth
      sqrt(3) and no more.

  proof_search_map:
    bottleneck: >-
      The step "decide whether this curve has exploitable endomorphism
      structure". The census currently answers it with |Aut| in {2,4,6}, a
      three-valued invariant that a bounded-degree isogeny cannot change. The
      bottleneck dissolves because the right invariant, delta, is exactly
      computable AND is exactly the thing an isogeny does change.
    baseline_embedding:
      parameter_slice: >-
        B = 1. The cell delta <= 1 is exactly the unit cell, so this record's
        counting machinery must reproduce IDEA-20260829-2dc43c's 6 / 4 / 10 / 0
        counts by congruence class mod 12 and its density exponent -1.
      reproduction_check: >-
        Frozen fixture plus symbolic check. Symbolic: substituting Delta_O = -3
        and -4 into delta = |Delta_O|/4 or (|Delta_O|+1)/4 must return 1 in both
        cases, and only those two fundamental discriminants may return 1, which
        is exactly the unit condition. Fixture: on the declared 20 primes at 16
        bits, the exact |Aut| > 2 counts must match 2dc43c's prediction to the
        last curve, and the p = 4001, t = 30 class must reproduce 138 members
        with Delta_K = -59, f = 16 as EV-ICINV-343679 records.
    observation_collision:
      observable: delta(E), and the class-level minimum delta_min(C)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, IN BOTH DIRECTIONS. (i) Collision
        that MUST occur and bounds what delta can conclude: two curves with the
        same delta but completely different hardness profiles - a surface curve
        of a small-Delta_K class and a floor curve of a class whose Delta_K is
        f_O^2 times larger have equal delta whenever f_O^2 |Delta_K| matches.
        delta is a scalar and cannot identify WHICH of Delta_K and f_O produced
        it, which is exactly why the record reports the PAIR (Delta_K, f_O) and
        the class minimum, never delta alone. (ii) Collision that must NOT
        occur: a curve whose measured volcano level disagrees with the f_O
        derived from fundamental_discriminant. STAGE 1 computes both
        independently and disagreement is blocking.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the three-valued |Aut| by the pair (Delta_K, f_O), i.e. by
          delta together with its class minimum, as the census's
          endomorphism column.
        predicted_gain: >-
          Preserves strictly more state than the census's goal requires, and it
          is exactly the extra state that survives the isogeny operation (the
          ell^2 law), which |Aut| does not. The cell it defines is sqrt(p) times
          larger than the one currently counted.
      - transform: specialization_pack
        proposed_object: >-
          C(B) = sum over fundamental d with |d| <= 4B of 1/(2 h(d)), a
          p-independent resource measure for the cell's occupancy.
        predicted_gain: >-
          A scale-invariant occupancy constant, so the census's bit-size axis
          collapses for this column and all six declared rows plus three
          cryptographic rows are filled with exact numbers at zero timing cost.
    quantifier_order: >-
      CLAIMED (A): FOR ALL ordinary E/F_p with p > 3, delta(E) = |Delta_O|/4 or
      (|Delta_O|+1)/4 according to Delta_O mod 4. CLAIMED (B): FOR ALL
      F_p-rational ell-isogenies phi from E to E', delta(E')/delta(E) is in
      {ell^2, 1, ell^{-2}}. CLAIMED (C): FOR ALL B, THERE EXISTS a
      p-independent constant C(B) such that the expected number of admissible
      traces per prime with |Delta_K| <= 4B equals C(B) up to the stated error.
      EXPLICITLY NOT CLAIMED: that C(B) is unchanged under the prime-order
      restriction - that is the tested question, and allowing the answer to
      depend on the restriction is the whole point of STAGE 4. ALSO NOT
      CLAIMED: anything about the VALUE of a small delta, which
      IDEA-20260901-6b63a4 bounds and this record does not revisit.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the censused primes, the exact joint occupancy of (delta,
        delta_min, |Aut|, prime-order, anomalous, embedding degree) is [table],
        the class-level cell density fits p^{e} with e = e_hat +/- CI, and the
        prime-order conditioning ratio is r_hat +/- CI." It can NEVER certify
        that a curve in the cell is weaker, that any exponent moves, or that
        the timing census would detect anything -- and the last of these is the
        binding limit, stated up front.
      nearby_object_control: >-
        THE SUPERSINGULAR CASE over F_{p^2}, where End is a quaternion order,
        delta = |Delta_O|/4 is meaningless and the cell definition collapses.
        The method must REFUSE to report a cell there rather than returning a
        number. A pipeline that returns a delta for a supersingular curve has
        not identified the load-bearing hypothesis (ordinariness, which makes
        End commutative of rank 2) and its whole census is void.
    proof_obligations:
      - claim: "delta(E) = min of the principal form over y not zero = |Delta_O|/4 (or (|Delta_O|+1)/4)."
        responsibility: correctness
      - claim: "An ell-isogeny multiplies delta by ell^{+-2} or 1."
        responsibility: correctness
      - claim: "Number of curves with trace t is H(4p - t^2); sum over t is 2p."
        responsibility: size
      - claim: "C(B) is independent of p."
        responsibility: size
      - claim: "Cell membership is decidable in O(B) integer operations without factoring."
        responsibility: feasibility
      - claim: "The B = 1 slice reproduces IDEA-20260829-2dc43c exactly."
        responsibility: baseline
      - claim: "The supersingular control is refused, not answered."
        responsibility: strictness
      - claim: "No statement is made about the VALUE of a small delta."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        M1 -- fitted exponent of the CLASS-LEVEL cell density (fraction of
        F_p-curves lying in a class with |Delta_K| <= 4B) against p, at
        B = 10^3, over 16, 20, 24, 28, 32 and 36 bits
      direction: lower
      minimum_effect: >-
        Predicted -0.50 with CI half-width below 0.10. An exponent near -1.0
        means the class-level and unit cells coincide and the record's central
        contrast is refuted.
    - metric: >-
        M2 -- fitted exponent of the UNIT cell density (|Aut| > 2) over the
        same primes
      direction: lower
      minimum_effect: >-
        Predicted -1.00 within CI, with the exact counts 6 / 4 / 10 / 0 by
        congruence class mod 12, reproducing IDEA-20260829-2dc43c. A miss here
        is an instrument failure and voids M1.
    - metric: >-
        M3 -- ell^2 law violations over at least 50 certified single-ell vertex
        pairs per bit size
      direction: different
      minimum_effect: >-
        Predicted EXACTLY ZERO violations. A single violation refutes (B) and
        is the record's designated falsifier for the isogeny half.
    - metric: >-
        M4 -- prime-order conditioning ratio, C(B) restricted to prime-order
        traces divided by C(B) over all admissible traces, pooled over 40
        exhaustively censused primes at B = 10^3
      direction: different
      minimum_effect: >-
        READING 1 predicts 1.00 with CI containing 1 at both 16 and 20 bits.
        A ratio outside [0.85, 1.18] at both bit sizes is READING 2 and
        escalates: the census's own population is arithmetically biased.
    - metric: >-
        M5 -- measured C(B) versus the value computed from tabulated class
        numbers, at B in {1, 10, 100, 10^3}
      direction: different
      minimum_effect: >-
        Agreement within binomial error at every B and every bit size. A
        systematic deviation means the counting derivation in (C) is wrong and
        every occupancy number is withdrawn.
    - metric: >-
        M6 -- number of 256-bit curves constructed in the cell that pass every
        RQ screen (ordinary, prime-order, non-anomalous, declared embedding
        degree and twist)
      direction: higher
      minimum_effect: >-
        At least 3. Zero means the cell is empty under the RQ's own screens at
        cryptographic size, which would be a strong and reportable closure of
        the endomorphism column at scale.
    - metric: >-
        M7 -- hits from 10^6 uniformly sampled traces at 256 bits with B = 10^6
      direction: different
      minimum_effect: >-
        Predicted 0, consistent with a predicted rate below 2^{-100}. A single
        hit is a 10^30-sigma event and means the sampler or the test is wrong.

  minimal_test:
    design: >-
      STAGE A (zero compute, hours): the derivations (A)-(D) and the C(B)
      table. Reviewable with no runs; settles M5's prediction and the ell^2
      law's statement.
      STAGE B (low compute, THE CHEAPEST VALID DISCRIMINATOR): exhaustive
      census at 16 and 20 bits over 20 primes each, with POSITIVE CONTROL A
      (the unit cell) and POSITIVE CONTROL B (the ell^2 law) and STAGE 4's
      conditioning test. TWO BIT SIZES ALREADY FIX BOTH DENSITY EXPONENTS'
      SIGNS AND THE CONDITIONING RATIO, and the unit-cell control is checkable
      against a filed record before anything else is believed.
      STAGE C (low compute): trace-only census at 24, 28, 32 and 36 bits,
      cross-validated against STAGE B at 20 bits where both methods apply.
      STAGE D (low compute): the 160/192/256-bit rung, constructive half plus
      sampling tail check.
      COST AT THE DECLARED TOY SCALES. 16 bits: 20 primes times ~1.3e5 curves,
      order by the harness's vectorised routines; minutes, tens of MB. 20 bits:
      20 primes times ~2.1e6 curves; under two hours, low hundreds of MB peak.
      24-36 bits: trace enumeration only, 4*sqrt(p) traces per prime, i.e.
      ~1.6e4 at 28 bits and ~5.2e5 at 36 bits, each an O(B) test; minutes per
      prime, MB. 160-256 bits: 10^6 traces times O(B) tests with B = 10^6 is
      the only nontrivial rung and is bounded by restricting the d-list to
      fundamental discriminants with tabulated class numbers; hours, MB.
      Whole census single-digit CPU-hours.
    controls:
      - unit-cell positive control, exact counts 6/4/10/0 and exponent -1 (blocking)
      - ell^2 law positive control on at least 50 certified single-ell pairs (blocking)
      - Hurwitz completeness certificate on every enumerated class (blocking)
      - independent volcano level (rational_isogeny_count) versus derived f_O, must agree (blocking)
      - random-integer null on the values of 4p minus t squared (blocking)
      - unconditioned-trace census as the comparison arm for STAGE 4 (blocking)
      - supersingular refusal control, the pipeline must refuse rather than answer (blocking)
      - composite-order nearby-object control
      - constructed 256-bit CM curves that must be detected (blocking for STAGE D)
      - matched charged rho and BSGS rows on a subsample (KN-TECH-006, KN-TECH-031)
      - KN-TECH-032/033/034 screens recorded per curve in the same pass
    required_metrics:
      - per prime - exact counts by (delta band, delta_min band, |Aut|, prime-order, anomalous, embedding degree)
      - per class - enumerated vertex count versus hurwitz_class_number
      - per curve at 16-20 bits - t, N, j, |Aut|, Delta_K, f_pi, f_O, Delta_O, delta, volcano level per ell
      - fitted density exponents for the unit cell and the class-level cell, with CIs and residual curvature
      - C(B) measured versus computed, per B and per bit size
      - prime-order conditioning ratio with exact-test p-value and CI
      - ell^2 law violation count, which must be zero
      - 256-bit constructed cell members with full screen records, and the 10^6-sample hit count
      - pass or fail of every blocking control; wall clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. The unit-cell positive control misses 2dc43c's exact counts or its
      exponent -1. Instrument failure; every occupancy number void.
    - >-
      F2. Any ell^2 law violation on a certified single-ell pair. Claim (B) is
      false as stated; the record is superseded and the violating pair is the
      lane's forward direction.
    - >-
      F3. The class-level density exponent is not distinguishable from -1. The
      sqrt(p) contrast that is this record's headline is refuted and the census
      loses nothing except this record.
    - >-
      F4. The prime-order conditioning ratio falls outside [0.85, 1.18] at two
      bit sizes. READING 2; the census population is arithmetically biased,
      this is escalated to independent validation and red-team review, and (C)
      is restated under the conditioning.
    - >-
      F5. The supersingular control returns a delta instead of refusing. The
      method proves too much; the census is void.
    - >-
      F6. Zero 256-bit curves can be constructed in the cell under the RQ's
      screens. A scoped closure of the endomorphism column at cryptographic
      size, reported as such rather than buried.
    - >-
      F7. Budget exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 3.

  confounders:
    - >-
      DELTA IS A DEGREE, NOT A COST, AND THE TWO ARE ROUTINELY CONFLATED. A
      small delta does not mean a cheap map to apply and certainly does not
      mean a rho discount; IDEA-20260901-6b63a4's T1 forbids the latter. Every
      summary of this record must carry that sentence.
    - >-
      F_p-ISOMORPHISM VERSUS ALGEBRAIC-CLOSURE ISOMORPHISM. All counts are over
      F_p-isomorphism classes; mixing the two would change every density by the
      twist multiplicity, exactly as IDEA-20260829-2dc43c warns.
    - >-
      CONDUCTOR AND AUTOMORPHISM COUNT ARE NOT INDEPENDENT: |Aut| > 2 forces
      Delta_K in {-3, -4}, which constrains f_O. The joint table must be
      reported, never marginals multiplied.
    - >-
      THE B CUTOFF IS AN INSTRUMENT PARAMETER. The O(B) test proves absence
      only for |d| <= 4B. Every "not in cell" verdict carries its B, and B is
      reported per rung.
    - >-
      SAMPLING AT 160-256 BITS IS NOT A MEASUREMENT. A predicted-zero outcome
      confirms nothing by itself; the constructive half carries the scale claim
      and the sampling half is a tail check only.
    - >-
      TRACE-UNIFORM IS NOT CURVE-UNIFORM. Curves are distributed over traces
      with weight H(4p - t^2), which varies by a factor of order log p across
      traces. Every density must be H-weighted and the unweighted version
      reported alongside so the difference is visible.

  interpretation_limits:
    - >-
      "claim_tier: exhaustive at 16-20 bits, exact-by-trace-enumeration at
      24-36 bits, CONSTRUCTIVE plus tail-check at 160-256 bits. The DERIVATIONS
      (A)-(D) are p-independent algebra and are labelled derivation, never
      proved; the counts are labelled by their method."
    - >-
      This record measures OCCUPANCY, not hardness. It contains no timing
      measurement and cannot support any statement about how hard any curve is.
    - >-
      Scoped to ordinary curves over prime fields with p > 3 and the RQ's
      screens. The supersingular refusal control shows how fast it fails
      outside.
    - >-
      Filling this column does not fill the census. Per KN-OPEN-019 there is no
      ECDLP object enumeration, and per KN-OPEN-001 no prime-field advantage
      over sqrt(p) is known; a fully populated arithmetic column changes
      neither.
    - >-
      A scale-invariant arithmetic column is NOT a licence to extrapolate the
      census's TIMING column, which IDEA-20260829-34f3ed shows does not
      transfer. The two axes are reported separately and never combined.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SQUARE-PART LAW. For a uniformly random prime p in a declared bit
        window and a uniformly random admissible trace t, the integer
        4p - t^2 behaves, with respect to divisibility by squares, like a
        uniformly random positive integer of the same size in the same
        congruence class mod 4. Formally, for every prime ell,
        Pr[ell divides f_pi] = 1/(ell(ell+1)) * (1 + o(1)) uniformly for
        ell <= (4p)^{1/4}, so Pr[f_pi = 1] converges to a constant
        c_0 = product over ell of (1 - 1/(ell(ell+1))) and
        Pr[f_pi >= F] = Theta(1/F).
      rigorous_support: >-
        Pairs (i) the rigorous counting theorem - Deuring's theorem that the
        curves of trace t number H(4p - t^2) = sum over f_O dividing f_pi of
        h(f_O^2 Delta_K), together with the mass identity
        sum_t H(4p - t^2) = 2p, which fixes the total exactly and is
        independently implemented in this program - with (ii) the classical
        distribution statement it imitates, the density 6/pi^2 of squarefree
        integers and the local densities of the Chebotarev/Cohen-Lenstra
        heuristics for the splitting of ell in the CM order. The heuristic step
        is only that the values of the specific quadratic polynomial
        4p - t^2, taken over admissible t at fixed p, imitate random integers
        for square divisibility - which is exactly the kind of statement that
        can fail and which STAGE 4 tests under the additional prime-order
        conditioning.
      validation_plan: >-
        SAMPLING - exhaustive, not random: EVERY admissible trace of 20 primes
        at 16 bits and 20 primes at 20 bits (about 2^9 and 2^11 traces per
        prime), with f_pi computed exactly by
        harness/isogeny_class.fundamental_discriminant, and the same census
        repeated at 24, 28, 32 and 36 bits by trace enumeration.
        COMPARISON DISTRIBUTION - the empirical CDF of log f_pi against the
        predicted Theta(1/F) tail and the empirical Pr[f_pi = 1] against the
        computed constant c_0; per-prime chi-square on the divisibility
        pattern for ell in {2, 3, 5, 7, 11, 13}. TAIL CHECKS - the maximum
        observed f_pi per bit size against the predicted maximum of that many
        draws, and the smallest observed |Delta_K| against the predicted
        minimum, which is the tail this record's cell lives in and is therefore
        the tail that matters. NEGATIVE CONTROL - the same statistics on
        uniformly random integers of the same size and congruence class
        (NULL-1). SAMPLED PARAMETERS RECORDED - prime list, full trace lists,
        prime-order flags, congruence strata, B, harness commit.
        TRANSFER ASSUMPTION, STATED - the law is checked exhaustively to 36
        bits; its use at 160-256 bits is an EXTRAPOLATION OF A FORMULA, not of
        a measurement, and the 256-bit rung's only measurements are the
        constructive members and the zero-hit tail check.
    - id: H2
      statement: >-
        PRIME-ORDER INDEPENDENCE. Conditioning on N = p + 1 - t being prime is
        asymptotically independent of the square part of 4p - t^2, so that
        C(B) restricted to prime-order traces equals the unrestricted C(B) up
        to a factor 1 + o(1), uniformly over the tested bit sizes.
      rigorous_support: >-
        NO RIGOROUS SUPPORT IS CLAIMED, and this is deliberate. The rigorous
        ingredient available is only that primality of p + 1 - t and square
        divisibility of (2 sqrt p - t)(2 sqrt p + t) are governed by different
        local conditions at almost every prime; the classical statement being
        imitated is the Hardy-Littlewood-style independence of a linear form's
        primality from a quadratic form's square part. This is precisely the
        kind of correlation that Hardy-Littlewood constants routinely make
        NONTRIVIAL, so the assumption is stated as the tested hypothesis rather
        than assumed, and its failure is READING 2 -- the outcome this record
        most wants to find.
      validation_plan: >-
        SAMPLING - the same exhaustive trace lists as H1, partitioned by the
        prime-order flag. COMPARISON - two-proportion exact test on cell
        membership rates between the prime-order and non-prime-order strata,
        pooled across primes with a Cochran-Mantel-Haenszel statistic, and
        separately per congruence class mod 12 so that the |Aut| confound
        cannot masquerade as the effect. TAIL CHECKS - the comparison repeated
        at B = 1, 10, 100 and 10^3, since a conditioning effect concentrated at
        small |d| would be invisible in the pooled statistic. SAMPLED
        PARAMETERS RECORDED - as H1, plus the exact primality certificates for
        N. TRANSFER - none; the conditioning question is answered only where
        the census is exhaustive.

  target_complexity:
    time_exponent: >-
      1/2 for the ECDLP, UNCHANGED, AND NO EXPONENT IS CLAIMED TO MOVE. The
      record's quantitative content is an OCCUPANCY exponent: the class-level
      cheap-endomorphism cell has density Theta(p^{-1/2}) against the unit
      cell's Theta(p^{-1}). Per the search heuristics this is explicitly a
      building block, and its priority rests on the fact that it fills five
      empty census rows and three cryptographic rows with exact numbers, which
      no timing instrument in this lane can do.
    memory_exponent: >-
      O(1) for rho, unchanged. The census stores O(p) rows per exhaustively
      enumerated prime at 16-20 bits, O(sqrt p) trace rows at 24-36 bits, and
      O(10^6) rows at the cryptographic rung. These are census costs at
      declared scales, never attack costs.
    best_known: >-
      Parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-006);
      automorphism-discounted rho at most sqrt(6) better on the cells this
      record counts (KN-TECH-018), the ceiling measured as attained by
      EV-ENDO-10109d; BSGS at 2*sqrt(n) time, sqrt(n) memory, n^{2/3+o(1)} full
      cost (KN-TECH-031); generic lower bound Omega(sqrt p) (KN-TECH-005). For
      the census's own occupancy question the best known is
      IDEA-20260829-2dc43c's unit-cell count, which this record reproduces as a
      positive control and extends.
    hidden_overhead: >-
      Disclosed. (i) C(B) is a sum over class numbers and grows like sqrt(B);
      quoting a density without its B is meaningless and every number here
      carries one. (ii) The Theta(p^{-1/2}) statement hides complete
      non-uniformity: when the cell is occupied it is occupied by an ENTIRE
      class of Theta(sqrt p) curves at once, so the right adversarial reading
      is "rare classes, large when they occur", not "rare curves". (iii) The
      160-256 bit rung's sampling half has essentially zero power by design and
      is reported as a tail check.
    tradeoff_note: >-
      No time-memory tradeoff is introduced; the census is arithmetic. Relevant
      to what is being counted: delta is memory-free and does not move the van
      Oorschot-Wiener surface at all. The census is embarrassingly parallel
      over (prime, trace).

  dominated_by: >-
    AS AN ATTACK: none is proposed; every Pareto row checked individually.
    TIME - parallel rho at 0.886*sqrt(N) (KN-TECH-006) dominates; nothing here
    solves an instance. MEMORY - rho at O(1) dominates. DATA/QUERIES - none
    consumed. CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018) dominates
    on every cell this record counts and is the reference constant, not a
    competitor. MEMORY-RICH - BSGS (KN-TECH-031). SPECIAL-FAMILY - anomalous
    transfer (KN-TECH-033) and MOV/Frey-Ruck (KN-TECH-032) dominate on their
    own families, which this census records in the same pass. LOWER BOUND -
    KN-TECH-005's Omega(sqrt p) is untouched. All rows checked; none beaten.
    AS A CENSUS RESULT: the nearest incumbent is IDEA-20260829-2dc43c, which
    dominates on the UNIT cell (it closes it exactly with a completeness
    certificate and this record reproduces rather than improves that) and is
    dominated here on the delta filtration, the ell^2 law, the class-level
    cell and the scale reach, none of which it covers. IDEA-20260829-20b05f
    dominates on the within-class regression design and is dominated here on
    population and scale. Externally, Deuring's counting theorem, the
    Hurwitz-Kronecker identity and Kohel's volcanoes are textbook and were NOT
    opened this session; no priority is claimed and novelty_status is
    unverified accordingly.

  sota_delta: >-
    ECDLP time exponent delta 0; memory exponent delta 0; data/query delta 0;
    security bits reduced 0. NON-ZERO CENSUS DELTAS, QUANTIFIED.
    (i) CELL SIZE: the endomorphism cell the census counts goes from
    Theta(p^{-1}) (10 curves per prime, IDEA-20260829-2dc43c) to
    Theta(C(B) p^{-1/2}) at the class level, a factor sqrt(p) - that is 2^128 at
    p ~ 2^256, and the two numbers are both exact rather than estimated.
    (ii) COVERAGE: five of six declared bit rows are empty
    (IDEA-20260829-34f3ed). This column fills all six plus 160, 192 and 256
    bits with exact counts, at single-digit CPU-hours and with no finite-size
    bias, because it measures arithmetic rather than time.
    (iii) OPERATION SEMANTICS: the census's "charged isogeny transfer" method
    acquires an exact update rule on an invariant (delta -> delta*ell^{+-2})
    where previously it had only Tate-invariance statements about what CANNOT
    change.
    (iv) DECISION TARGET: composed with IDEA-20260901-6b63a4's T1, the
    endomorphism-orbit lane's POPULATION value is pinned - worth sqrt(3) on a
    cell of density Theta(p^{-1/2}), worth sqrt(2) on another, and worth 1
    everywhere else - which is a determinate answer rather than a ranking.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that (A) is correct as stated (residual: an off-by-one in the
    Delta_O = 1 mod 4 branch, which the ell^2 control would expose). 0.95 that
    (B) holds with zero violations. 0.85 that the class-level density exponent
    lands in [-0.60, -0.40]. 0.75 that the prime-order conditioning ratio is
    consistent with 1 (so 0.25 on the escalation branch, which is the branch
    worth the run). The most likely honest headline: "the census's
    endomorphism column, counted correctly at the class level, has density
    Theta(p^{-1/2}) rather than Theta(p^{-1}), is exactly computable at 256
    bits without factoring, and is worth at most sqrt(3)."

