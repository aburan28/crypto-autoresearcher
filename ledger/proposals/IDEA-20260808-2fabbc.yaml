        cpu_hours: 16
        memory_gb_per_shard: 0.25
        operations: >-
          Generate and certify exactly 32 independent prime-order curves at each
          size; freeze P,Q and three nonzero isomorphism parameters.
        stop_rule: >-
          Missing order certificate, exceptional/anomalous curve, duplicate
          curve, or incomplete cell is infrastructure/incomplete and prevents S4.
      - id: S4-isomorphism-control-and-signed-y-treatment
        order: 4
        curve_treatment: true
        wall_clock_seconds: 172800
        cpu_hours: 384
        memory_gb_per_shard: 0.25
        operations: >-
          Execute all 40960 unique roots and 163840 root-model rows under the
          exact hard operation caps. No effect-based early stop or model selection.
        stop_rule: >-
          A hard cap or incomplete scheduled cell yields resource exhaustion or
          invalid scope. It cannot be converted into mathematical evidence.
      - id: S5-frozen-analysis-and-package
        order: 5
        curve_treatment: false
        wall_clock_seconds: 14400
        cpu_hours: 4
        memory_gb_per_shard: 0.25
        operations: >-
          Run the frozen cluster analyses, cost tables, verification audit, and
          immutable artifact packaging once.
        stop_rule: >-
          Nonconvergence, missing row, failed verification, or hash mismatch is
          invalid/inconclusive; no alternate estimator is substituted.
    feasibility_gate: >-
      S2 measures primitive rates before any curve treatment. To enter S4, the
      observed aggregate rates must upper-bound all fixed operations within
      172800 seconds and eight shards with 20% reserve. A failed gate ends the
      future run as pre-treatment resource infeasibility. No throughput is
      claimed in this proposal.

  stopping_rules:
    - All synthetic null and positive controls finish and pass before curve treatment.
    - No treatment-effect, p-value, gamma estimate, or apparent collision permits early stopping.
    - >-
      Completed valid schedule with LCB_99.5(gamma_s)>5/18 under every frozen
      sensitivity, valid HA-3, and valid costs requests independent review only;
      it does not promote a claim.
    - >-
      Completed valid schedule with UCB_99.5(gamma_s)<=5/18 supports only a
      scoped failure of the fully charged crossover on this ladder and family.
    - A straddling interval, failed bridge, high heterogeneity, or power-condition failure is inconclusive.
    - Timeout, implementation failure, resource exhaustion, or incomplete cells are never evidence about ECDLP.

  required_artifacts_for_any_future_run:
    - frozen versioned experiment specification and exact control code
    - exact seed, curve, target, root, and isomorphism manifest
    - curve-order/subgroup certificates and exceptional-curve exclusions
    - exact command, environment, commit, dirty-tree, and inference manifest
    - raw per-root D/Y/X/V/S records and retained invalid/capped roots
    - primitive operation, memory-traffic, byte, hardware, communication, and wall-time tables
    - control coverage, power-condition, cluster-fit, zero-count, and sensitivity outputs
    - every reconstructed scalar and independent full-point verification result
    - stdout, stderr, validity report, hashes, and immutable run receipt

  falsification_conditions:
    - >-
      Valid full-schedule UCB_99.5(gamma_s)<=5/18 falsifies the decision-changing
      claim for the exact declared family, models, ladder, and finite-size model.
    - >-
      Polynomial kappa_N or Y/X growth, or p_N losing exponent relative to E[X],
      falsifies the Boolean-success bridge and runtime even if Y is enriched.
    - >-
      Selected-pair work, bytes, communication, or table accesses with a worse
      exponent than declared falsify the cost model.
    - Any V!=X or accepted k_hat failing [k_hat]P=Q falsifies correctness/apparatus.
    - >-
      A null or positive-control failure invalidates the experiment and has no
      bearing on signed-y or ECDLP.
    - >-
      A signal requiring post-data model choice falsifies the no-discovery-cost
      claim; it may motivate a separately costed model-selection proposal only.

  confounders:
    - Constant enrichment can masquerade as gamma without a free intercept.
    - Cross-pairs share list elements and point sums; treating them as independent is pseudoreplication.
    - Match representations can cluster without increasing root success.
    - Bucket imbalance or duplicate sums can increase work and multiplicity simultaneously.
    - Affine normalization, infinity handling, centered-y ties, and serialization can leak labels.
    - Isomorphic models preserve the ECDLP but not h_y; heterogeneity is expected to be possible.
    - Curve/model screening, fixed-base tables, label tables, or reused roots can hide preprocessing/advice.
    - Toy finite-size corrections and family selection can manufacture an apparent slope.
    - Parallel wall time can hide replicated hardware, memory, and communication.
    - Group-operation proxies can hide field inversions, cache misses, hashing, and verification.

  interpretation_limits:
    - No breakthrough, attack, positive gamma, recovered live key, or security impact is claimed.
    - The proposal is distributional and does not quantify over every prime-order curve.
    - Toy data cannot validate a crypto-scale exponent or affect deployed parameters.
    - Exact quotient and planted controls are synthetic nearby objects, not evidence of a quotient on a prime-order curve.
    - Representation-specific persistence is not generic ECDLP structure and requires public discovery accounting.
    - Negative evidence can close only the exact h_y rule, family generator, models, ladder, schedule, and estimator.
    - Multi-target, reusable preprocessing, advice, special curves, extension fields, quantum algorithms, and live keys are outside scope.

  target_complexity:
    problem: single-target prime-order prime-field ECDLP on a declared input distribution
    raw_time_exponent: N^(2/3-gamma_s+o(1))
    memory_exponent: N^(1/3+o(1)) live entries
    full_cost_exponent: N^(7/9-gamma_s+o(1))
    best_known_baseline: >-
      Pollard rho/vOW N^(1/2+o(1)) total group work and fully charged cost with
      small per-processor state; standard BSGS N^(1/2) raw and N^(2/3) full;
      N^(1/3)-memory BSGS N^(2/3) raw and N^(7/9) full.
    hidden_overhead: >-
      O(log N) coordinate arithmetic, fixed-base setup, field inversion, sorting
      or hashing, table traffic, exact verification, cluster/model bookkeeping,
      and unextracted Wiener constants. The o(1) terms have not been bounded.
    tradeoff_note: >-
      Parallel roots lower wall time only by buying separate tables and engines.
      No time-memory interpolation beyond this one S=N^(1/3) point is claimed.

