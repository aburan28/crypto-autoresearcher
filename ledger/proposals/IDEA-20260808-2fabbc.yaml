  staged_budget:
    status: prospective_not_approved
    schedule_basis: >-
      Fixed by the stated power calculation and five-size design, not by an
      effect-dependent 'up to' rule. Controls consume reserved budget before any
      curve treatment. Hard caps apply even if more compute would be convenient.
    total_wall_clock_seconds: 226800
    total_cpu_hours: 455
    maximum_memory_gb_per_shard: 0.25
    maximum_parallel_shards: 8
    aggregate_memory_gb: 2
    maximum_artifact_bytes: 1073741824
    maximum_run_packages: 1
    operation_bounds:
      treatment_unique_roots: 40960
      treatment_root_model_rows: 163840
      scalar_to_point_evaluations: 65011712
      width5_fixed_base_group_additions: 373293056
