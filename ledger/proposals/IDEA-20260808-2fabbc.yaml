  claim: >-
    CONDITIONAL ALGORITHM TARGET, NOT A RESULT OR AN ATTACK CLAIM. Let G=<P> be
    a prime-order subgroup of order N, Q=[k]P, and L=M=floor(N^(1/3)). A root of
    the signed-y four-list selector is defined below. Let X be the number of
    DISTINCT exact matching point sums in a root, V the number of those matches
    that yield a scalar passing [k_hat]P=Q, and S=1[V>=1]. Define the Boolean
    root-success exponent gamma_s on a fixed, preregistered input distribution
    by
      p_N = Pr[S=1] = N^(-1/3+gamma_s+o(1)).
    If selector regularity, the distinct-match second-moment bridge, independent
    restarts, and the declared wiring model all hold, then one root costs
    N^(1/3+o(1)) raw group work and N^(1/3+o(1)) live entries, so expected raw
    work is N^(2/3-gamma_s+o(1)) and Wiener-convention full cost is
    N^(7/9-gamma_s+o(1)). The raw-time Pollard-rho crossover is gamma_s>1/6;
    the mandatory fully charged crossover is gamma_s>5/18. Strict inequality is
    required; equality only ties exponents with unknown constants. No positive
    gamma_s, no asymptotic solver, and no security effect is asserted. The
    leading expectation remains gamma_s=0.

  mechanism: >-
    For an affine point R=(x,y), let y_tilde be the centered representative of y
    in [-(p-1)/2,(p-1)/2], and set
      h_y(R)=sgn(y_tilde)*floor(M*abs(y_tilde)/p) mod M, h_y(O)=0.
    Thus h_y(-R)=-h_y(R), but h_y is not assumed homomorphic. For each root,
    sample fresh a in (Z/NZ)^*, b in Z/NZ, z in Z/MZ, and four independent
    length-L scalar lists without replacement within each list. Put
    Q'=[a]Q+[b]P and R_{j,i}=[r_{j,i}]P. Select left pairs with
      h_y(R_1)+h_y(R_2)=z mod M
    and right pairs with
      h_y(R_3)+h_y(R_4)=h_y(Q')-z mod M.
    Bucket joins enumerate the selected pairs. A left sum A and right sum B
    count only when exact group equality A+B=Q' holds. Any witness gives
      k_hat=a^(-1)*(r_1+r_2+r_3+r_4-b) mod N,
    and succeeds only after [k_hat]P=Q. The coordinate labels select work; they
    never replace full-point equality or scalar verification. The only possible
    exponent gain is a verified increase in Boolean root success after every
    cost and control is charged.

  test_object:
    tracked_object: >-
      The root-level tuple (D, Y, X, V, S): selected cross-pair denominator D,
      multiplicity-weighted matching quadruples Y, distinct matching point sums
      X, independently verified distinct matches V, and Boolean success S.
    lossiness: >-
      h_y is a public M-valued lossy coordinate partition. The proposal does not
      assert deterministic propagation; prime-order congruence rigidity rules
      that out for a nonconstant lossy map. The tested escape is probabilistic
      propagation only.
    depth_of_verified_structure: >-
      Algebraic scalar recovery and antisymmetry are derivable. Selector
      regularity, positive enrichment, no polynomial match clustering, and
      scaling are unverified heuristics. No depth beyond proposal mathematics is
      represented as observed.

  root_random_variables:
    probability_space: >-
      After the curve-family rule, public model rule, h_y, bit-size ladder, and
      all seeds are frozen, probability is over the generated curve and uniform
      target in the declared family distribution and, conditional on an
      instance, fresh (a,b,z) and four fresh scalar lists. Isomorphic models
      share scalar tuples and are repeated measures, never independent curves.
    definitions:
      - symbol: I_L
        definition: >-
          Set of selected left index pairs (i1,i2) satisfying the left label
          equation.
      - symbol: I_R
        definition: >-
          Set of selected right index pairs (i3,i4) satisfying the right label
          equation.
      - symbol: C_L(A)
        definition: >-
          Number of pairs in I_L whose exact point sum is A.
      - symbol: C_R(B)
        definition: >-
          Number of pairs in I_R whose exact point sum is B.
      - symbol: D
        definition: '|I_L|*|I_R|; retained exactly, never replaced by L^4/M^2.'
      - symbol: Y
        definition: >-
          Sum over A in G of C_L(A)*C_R(Q'-A); the number of matching index
          quadruples. Y is diagnostic and is never substituted for success.
      - symbol: X
        definition: >-
          Number of distinct A with C_L(A)>0 and C_R(Q'-A)>0. It removes
          representation multiplicity while retaining every exact point match.
      - symbol: V
        definition: >-
          Number of those distinct A for which at least one reconstructed scalar
          passes [k_hat]P=Q. Correct code must have V=X.
      - symbol: S
        definition: '1[V>=1], the sole runtime success variable.'
      - symbol: mu_N
        definition: 'E[X] over the frozen probability space.'
      - symbol: p_N
        definition: 'Pr[S=1]; all restart and crossover claims use p_N.'
      - symbol: kappa_N
        definition: >-
          E[X^2]/E[X] when E[X]>0. This is the Paley-Zygmund clustering factor;
          it is reported separately from duplicate-representation factor Y/X.

  boolean_success_derivation:
    upper_bound: 'Pr[X>=1] <= E[X] for nonnegative integer X.'
    lower_bound: >-
      Paley-Zygmund at threshold zero gives
        Pr[X>=1] >= E[X]^2/E[X^2] = E[X]/kappa_N.
    bridge_condition: >-
      If mu_N=N^(-1/3+gamma_x+o(1)), kappa_N=N^o(1), and V=X except with
      negligible implementation-failure probability, then
        p_N=N^(-1/3+gamma_x+o(1));
      hence gamma_s=gamma_x. The bridge is an explicit heuristic obligation,
      not a consequence of expected multiplicity Y.
    saturation_case: >-
      At gamma_s=1/3, p_N=Theta(1) and inverse-success cost is constant. The
      rare-event approximation is no longer used; exact-quotient controls
      calibrate the finite Boolean probability directly.
    runtime_assembly: >-
      With W_root=N^(1/3+o(1)) and p_N=N^(-1/3+gamma_s+o(1)), independent
      restarts give E[roots]=1/p_N and raw work
      W_root/p_N=N^(2/3-gamma_s+o(1)). No formula involving E[Y] appears in
      this assembly.

  assumptions:
    - >-
      Prime-order, odd-order, short-Weierstrass subgroup with N approximately p;
      curve-order and subgroup checks precede every admissible cell.
    - >-
      Single-target, no external oracle, no nonuniform advice, and no free label
      table. The public affine coordinate model is part of the input encoding.
    - >-
      Scalar lists are sampled without replacement within a list and with fresh,
      deterministic, published seeds across roots. Fixed-base multiplication
      tables may be reused and are charged as curve-specific preprocessing.
    - >-
      Coordinate normalization, field inversion, group operations, hashing,
      storage, communication, failed roots, and final verification are counted.

  heuristic_assumptions:
    - id: HA-1-selector-regularity
      formal_statement: >-
        Uniformly over the preregistered family and roots, |I_L| and |I_R| are
        N^(1/3+o(1)); the maximum selected point-sum representation multiplicity
        and bucket load are N^o(1).
      rigorous_support: >-
        Exact bucket histograms determine the realized counts. Under a globally
        random balanced antisymmetric label map, standard occupancy bounds give
        the corresponding null scale; no such theorem is claimed for signed-y.
      distribution_imitated: >-
        Four independent uniform scalar lists under a balanced M-way label map.
      validation_plan: >-
        Retain every bucket count, |I_L|, |I_R|, C_L and C_R maximum, duplicate
        count, and selected-pair total. Compare treatment with the control-first
        null distribution at every size, curve, model, and root.
      falsification_condition: >-
        A polynomially growing bucket or point-sum multiplicity, or a selected
        pair total above the frozen 0.999 null quantile, either side's hard 4L
        cap, or the combined 8L work cap invalidates the stated per-root cost. A
        capped cell is cost-model-invalid, not negative ECDLP evidence.
    - id: HA-2-distinct-match-enrichment
      formal_statement: >-
        There exist fixed public family and model rules and a gamma_x>0 such
        that E[X]=N^(-1/3+gamma_x+o(1)) on their declared input distribution.
        The decision-changing form requires gamma_x>5/18.
      rigorous_support: >-
        None on prime-order curves. Exact quotients on a composite synthetic
        group give the nearby gamma=1/3 calibration; balanced random labels give
        the gamma=0 leading null. Prime-order congruence rigidity and expected
        square-root cancellation weigh against positive enrichment.
      distribution_imitated: >-
        A non-homomorphic coordinate partition whose complete four-list event
        retains polynomial information about exact equality.
      validation_plan: >-
        Estimate distinct X and Boolean S on the full ladder with the clustered
        model below. Multiplicity Y is secondary. Require the same estimator to
        recover all control exponents before treatment interpretation.
      falsification_condition: >-
        The complete valid schedule has a one-sided 99.5% upper confidence bound
        gamma_s<=5/18 under every preregistered finite-size sensitivity, or the
        signal is attributable only to uncharged model search. This falsifies
        the fully charged crossover on the exact tested family and schedule,
        not ECDLP or all coordinate statistics.
    - id: HA-3-subpolynomial-root-clustering
      formal_statement: >-
        For gamma_x<1/3, kappa_N=E[X^2]/E[X]=N^o(1), and the maximum Y/max(1,X)
        is N^o(1), uniformly over the declared family distribution.
      rigorous_support: >-
        Paley-Zygmund rigorously converts this condition and HA-2 into an
        exponent-equivalent Boolean probability. What is unproved is the
        subpolynomial bound for signed-y roots.
      distribution_imitated: >-
        A Poisson or compound-Poisson rare-event process with no polynomial
        number of distinct matches concentrated in a vanishing set of roots.
      validation_plan: >-
        Report X, X*(X-1), X^2, Y, Y/max(1,X), maximum root multiplicity, and
        p_hat/E[X]_hat by cluster. Fit the log slope of kappa_N and require its
        one-sided upper bound to be zero up to the frozen tolerance 0.02.
      falsification_condition: >-
        A positive polynomial slope above 0.02 for kappa_N, a polynomial Y/X
        slope, or p_hat/E[X]_hat decaying polynomially breaks the runtime bridge
        even if multiplicity enrichment is positive.
    - id: HA-4-independent-restarts
      formal_statement: >-
        Conditional on a fixed input and model, roots generated by disjoint seed
        domains are independent draws from the frozen (a,b,z,list) distribution,
        so time to first S=1 is geometric with parameter p_N.
      rigorous_support: >-
        Fresh uniform b makes Q' uniform in G for every fixed target, and all
        other root inputs are independently seeded. Independence still depends
        on the implementation not reusing root lists or mutable state.
      distribution_imitated: Geometric trials conditional on a fixed input.
      validation_plan: >-
        Static seed-domain audit, duplicate-tuple check, lag-correlation and runs
        tests, and root-order permutation. Shared fixed-base tables are allowed;
        scalar lists and selected-pair tables are not reused.
      falsification_condition: >-
        Seed collision, list reuse, persistent mutable table content, or a lag
        dependence outside the 0.999 null envelope invalidates restart inference.
    - id: HA-5-family-and-model-scaling
      formal_statement: >-
        The fixed curve generator and the four public isomorphic-model rules
        define a stable distribution whose gamma_s is represented by the
        five-size ladder; no post-data curve or model selection is used.
      rigorous_support: >-
        Curve isomorphisms preserve the discrete logarithm exactly. They do not
        preserve centered y labels, so stability is empirical rather than proved.
      distribution_imitated: >-
        Independently generated prime-order curves with public, seeded model
        changes and uniform targets.
      validation_plan: >-
        Use 32 curves per size and canonical plus three seeded isomorphic models.
        Curves are family clusters; models are nested repeated measures. Report
        heterogeneity and the fraction of public models crossing each gate.
      falsification_condition: >-
        If the family-average or canonical-model gate fails, no model-robust
        statement follows. Heterogeneity alone does not invalidate apparatus;
        it narrows the proposal to representation-specific behavior and makes
        any selection/discovery cost mandatory.
    - id: HA-6-wiring-access-charge
      formal_statement: >-
        The selected-pair tables are touched at a nonvanishing rate through the
        root work, so the repository convention FC=W*S^(1/3) applies rather than
        an amortized distinguished-point exception.
      rigorous_support: >-
        KN-TECH-035 records the Wiener three-dimensional convention and BSGS
        calibration. Applying it to this table access pattern is an architectural
        assumption, not a new theorem.
      distribution_imitated: none_architectural
      validation_plan: >-
        Count large-table accesses per primitive operation and by table level.
        A decaying access fraction requires a revised charge before comparison.
      falsification_condition: >-
        A measured power-law decay of table accesses changes the wiring exponent;
        the cost table must be superseded, never silently retained.
    - id: HA-7-preregistered-finite-size-model
      formal_statement: >-
        After exact L, M, D and floor offsets are included, the remaining
        log-success curve over 18--30 bits is linear in log N up to the fixed
        sensitivity envelope eta*N^(-1/3), eta in {-4,0,4}; the intercept is free.
      rigorous_support: >-
        None for signed-y. Exact offsets remove known floors; the three fixed
        eta values prevent an unidentifiable post-data finite-size coefficient.
      distribution_imitated: A power law with a bounded first correction term.
      validation_plan: >-
        Fit all three frozen sensitivity models to every control and treatment
        arm, report residual-by-size plots and leave-one-size-out slopes.
      falsification_condition: >-
        Control bias, systematic residual curvature, or gate disagreement across
        eta values makes the asymptotic slope inconclusive.

  proof_search_map:
    bottleneck: >-
      Prove or falsify a Boolean success exponent gamma_s>5/18 while keeping
      per-root work and storage at N^(1/3+o(1)). Marginal coordinate bias,
      expected quadruple multiplicity, or a raw-time gamma>1/6 is insufficient.
    baseline_embedding:
      parameter_slice: >-
        Set gamma_s=0 and use the balanced antisymmetric null. Then p_N is
        N^(-1/3+o(1)), raw time is N^(2/3+o(1)), storage is N^(1/3+o(1)), and
        full cost is N^(7/9+o(1)). This is the N^(1/3)-memory BSGS boundary in
        common raw-work, entry-width, and Wiener-charge units.
      reproduction_check: >-
        A frozen segmented-BSGS fixture uses the same point encoding, entry width,
        exact operation counters, hash policy, verification, and S=L table size.
        The symbolic calculator must emit (T,S,FC) exponents (2/3,1/3,7/9) for
        both the gamma=0 candidate slice and memory-matched BSGS. Constants and
        bytes are reported separately; equality of wall time is not asserted.
    observation_collision:
      observable: >-
        The full tuple (Y,X,S,kappa_N), not multiplicity alone.
      distinct_preimage_search: >-
        Construct two synthetic arms with the same E[Y] slope: one diffuses
        distinct matches across roots and one concentrates multiplicity in rare
        roots. If their p_N differs, Y has an observation collision and cannot
        identify runtime. The planted root-mixture control is the clustered side;
        exact quotient and balanced null calibrate the endpoints. Separately,
        compare isomorphic models with the same ECDLP and different y labels.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Root tuple (D,Y,X,V,S) plus kappa_N.
        predicted_gain: >-
          Makes the success-probability bridge and multiplicity failure visible
          instead of hiding them in one match count.
      - transform: representation_reduction
        proposed_object: >-
          Public signed-y partition followed by exact point-sum intersection and
          final scalar verification.
        predicted_gain: >-
          If gamma_s>5/18, converts probabilistic coordinate compatibility into
          lower fully charged cost without trusting the coordinate as an oracle.
      - transform: observable_fiber
        proposed_object: >-
          Hold the ECDLP and scalar tuples fixed while changing only the
          isomorphic coordinate model or balanced label assignment.
        predicted_gain: >-
          Separates apparatus, representation-specific signal, and invariant
          group structure.
    quantifier_order: >-
      EXISTS one public h_y rule, one public curve-generation distribution, and
      epsilon>0, all fixed before data, SUCH THAT FOR ALL sufficiently large N
      in that distribution, probability over the input draw and fresh roots has
      p_N >= N^(-1/3+5/18+epsilon+o(1)), while HA-1, HA-3, HA-4, and HA-6 hold.
      A model, curve, root schedule, finite-size term, or gamma may not be chosen
      after observing treatment. The proposal does NOT claim FOR ALL curves, and
      the toy ladder cannot establish the displayed asymptotic quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        Since p_N<=1, the Boolean definition forces gamma_s<=1/3. Since every
        root constructs or streams four length-L lists, raw time and live memory
        cannot beat N^(1/3+o(1)) in this construction even at p_N=1; the Wiener
        floor is N^(4/9+o(1)). No general M-fold upper bound on multiplicity
        enrichment is claimed. The prior information-theoretic prose is narrowed
        to this algorithmic success floor.
      nearby_object_control: >-
        In G_q=Z/(M^3)Z with h_q(x)=x mod M, the exact quotient makes p_N=Theta(1)
        and realizes gamma_s=1/3 under the same four-list pipeline. On prime
        Z/NZ with the balanced antisymmetric null, gamma_s=0 is expected. These
        nearby objects bracket the instrument but are not evidence about curves.
    proof_obligations:
      - claim: Signed-y antisymmetry, root construction, and scalar recovery.
        responsibility: correctness
      - claim: Exact selected-pair size and hard work cap.
        responsibility: size
      - claim: Per-root group, field, hash, and label work.
        responsibility: runtime
      - claim: Live entry count, byte width, and peak-memory cap.
        responsibility: memory
      - claim: Distinct-match expectation exponent gamma_x.
        responsibility: success_probability
      - claim: Paley-Zygmund bridge from X to Boolean S.
        responsibility: success_probability
      - claim: Independent restarts and inverse-p_N accounting.
        responsibility: runtime
      - claim: W*S^(1/3) wiring charge and access-pattern applicability.
        responsibility: interface
      - claim: Fully charged rho and both BSGS crossover inequalities.
        responsibility: strictness
      - claim: Fixed-model versus model-discovery cost.
        responsibility: scope
      - claim: Preprocessing, advice, label/data/query, verification, and multi-target accounting.
        responsibility: interface
      - claim: Distributional rather than all-curve scope.
        responsibility: scope
    remaining_unproved_obligations:
      - HA-2 has no structural support on prime-order curves.
      - HA-3 is required for runtime and has not been measured.
      - HA-5 cannot be promoted from the toy ladder to cryptographic scale.
      - HA-6 is a declared cost convention whose constants are not extracted.
      - External novelty and generalized-birthday prior art are unverified.
    not_applicable_reason: null

  predictions:
    - id: P1-null
      observable: Balanced antisymmetric Z/NZ null.
      metric: gamma_s with one-sided 99.5% interval.
      expected_output: >-
        gamma_s=0 within the preregistered cluster procedure; S and X agree,
        kappa_N has no positive polynomial slope, and no control fit crosses
        either raw or full gate.
    - id: P2-exact-quotient
      observable: Exact quotient on Z/(M^3)Z.
      metric: multiplicity, p_N, gamma_s, and scalar verification.
      expected_output: >-
        Conditional exact-match probability M/M^3=1/M^2, E[X]=Theta(1),
        p_N=Theta(1), gamma_s=1/3, and 100% of accepted scalars verify.
    - id: P3-planted-gamma
      observable: Root-mixture calibrations at gamma in {1/6,5/18,3/10}.
      metric: fitted Boolean gamma_s under the complete estimator.
      expected_output: >-
        Each planted value lies in its 99% interval, ordering is monotone, and
        the 5/18 arm ties rather than beats rho under full cost. The 3/10 arm is
        the design alternative used in the power calculation.
    - id: P4-treatment
      observable: Signed-y cascade on the five-size curve ladder.
      metric: family-average and canonical-model gamma_s.
      expected_output: >-
        Leading expectation gamma_s=0. A decision-changing observation would
        require a one-sided 99.5% lower bound above 5/18 under all three
        finite-size sensitivities, a valid HA-3 bridge, and no uncharged model
        selection. This would request review, not establish an attack.
    - id: P5-isomorphic-models
      observable: Canonical plus three public isomorphic models per curve.
      metric: heterogeneity and fraction of models crossing 1/6 and 5/18.
      expected_output: >-
        Scalar recovery is invariant. Gamma may vary because h_y is
        representation-dependent; variation narrows scope and prices model
        discovery but is not by itself an apparatus failure.

  controls:
    - id: CTRL-NULL-BALANCED-ANTISYMMETRIC
      run_order: 1
      construction: >-
        On odd prime Z/NZ let H=(N-1)/2 and U={1,...,H}. From the frozen control
        seed instantiate a ten-round Feistel format-preserving permutation pi of
        {0,...,H-1}. Let w=ceil(log2(H)); split each fixed-width big-endian w-bit
        word into floor(w/2) and ceil(w/2) bits. In round i apply
        (left,right)->(right,left XOR F_i(right)), where F_i is the low number of
        bits required by the receiving half of SHAKE256(seed || uint32be(i) ||
        fixed_width_big_endian(right)); unequal half widths alternate and ten
        rounds restore the original widths. Cycle-walk this permutation on
        {0,...,2^w-1} until the output is below H. For nonzero r write
        r=epsilon*u with u=min(r,N-r) and epsilon in {+1,-1}. Define
          h_null(r)=epsilon*(pi(u-1) mod M) mod M, h_null(0)=0.
        The map is global and consistent at every occurrence, has
        h_null(-r)=-h_null(r), and the positive-representative label counts differ
        by at most one; the full histogram deviation from N/M is at most three.
        No O(N) label table is stored. Frozen scalar tuples, target, z, selectors,
        estimators, and cost counters are identical to later arms.
      expected_output: >-
        Gamma_s=0, calibrated cluster coverage, V=X, no positive kappa_N slope,
        and the gamma=0 raw/full BSGS boundary. All 32 independent label-map
        clusters are retained.
      apparatus_invalidation: >-
        A 99.5% interval excluding zero, false positive above 5/18, V!=X,
        anti-conservative planted-control coverage, seed collision, or work above
        the frozen cap stops before every curve treatment. This is apparatus
        invalidity, never ECDLP evidence.
    - id: CTRL-EXACT-QUOTIENT
      run_order: 2
      construction: >-
        For b in {18,21,24,27,30}, set M=2^(b/3)-1, K=M^3, use the odd additive
        group G_q=Z/KZ, L=M, and h_q(x)=x mod M. M divides K, so h_q is an exact
        quotient and K has b+o(1) bits. Sample a from (Z/KZ)^*. Use the identical
        four-list, root, intersection, and Boolean verification pipeline with
        integer equality modulo K.
      expected_output: >-
        Every selected exact match obeys the quotient condition; an independent
        selected cross-pair has exact-match probability M/K=1/M^2. Thus expected
        distinct matches and Boolean success are order one, and the fitted
        gamma_s is 1/3. Finite p_N is compared with the frozen generator's exact
        Monte Carlo reference rather than forced to 1-exp(-1).
      apparatus_invalidation: >-
        Failure to cover 1/3, any integer witness failing exact verification, or
        a Boolean-success mismatch outside the 0.999 reference envelope stops
        before treatment.
    - id: CTRL-PLANTED-GAMMA
      run_order: 3
      construction: >-
        On the same odd G_q=Z/KZ used by the quotient arm, instantiate both h_q
        and an independent globally balanced antisymmetric h_null,q by the
        Feistel rule of CTRL-NULL-BALANCED-ANTISYMMETRIC. Reuse each frozen scalar
        tuple under both maps. For target gamma_star in {1/6,5/18,3/10}, choose
        the quotient root with public probability
          w_b=K^(-1/3+gamma_star)=M^(-1+3*gamma_star)
        using a disjoint seeded uniform variate; otherwise choose the balanced
        null root. The mode bit is retained. Consequently
          p_mix=(1-w_b)*p_null+w_b*p_quot,
        an exact finite-size reference, and p_mix has exponent
        -1/3+gamma_star. This deliberately supplies clustered roots and therefore
        exercises the cluster procedure rather than pretending cross-pair
        independence.
      expected_output: >-
        The same estimator covers all three planted gamma values at 99%, orders
        them monotonically, and reports the known root clustering without
        replacing p_mix by match multiplicity.
      apparatus_invalidation: >-
        Noncoverage of any planted value, reversal of the planted order, or an
        estimator that calls gamma=5/18 a strict full-cost improvement invalidates
        inference before treatment.
    - id: CTRL-ISOMORPHIC-MODEL
      run_order: 4
      construction: >-
        For each accepted E:y^2=x^3+A*x+B and three frozen nonzero u values, use
        E_u:y^2=x^3+(A*u^4)*x+B*u^6 and the exact isomorphism
          phi_u(x,y)=(u^2*x,u^3*y).
        Transform P,Q and every generated point; share scalar tuples and roots.
        Include the canonical u=1 model. No model is selected by treatment data.
      expected_output: >-
        All group equalities and reconstructed scalars agree under phi_u.
        Gamma heterogeneity is reported as mechanism scope. A representation-
        invariant signal would persist; a model-specific signal remains usable
        only under a public model rule whose discovery cost is separately charged.
      apparatus_invalidation: >-
        Failure of on-curve, homomorphism, exact-equality, inverse-map, or scalar-
        recovery fixtures invalidates apparatus. Gamma heterogeneity alone does
        not; it triggers the representation-specific interpretation branch.

  apparatus_vs_mechanism_rules:
    apparatus_invalid:
      - Any of the first three synthetic controls fails its exact expected-output gate.
      - Any exact equality or recovered scalar fails independent verification.
      - Root/list seed domains collide or the prescribed estimator changes by arm.
      - The hard selected-pair, operation, byte, or wall-time cap is crossed before a cell completes.
    mechanism_falsified_or_narrowed:
      - >-
        Valid treatment upper bound gamma_s<=5/18 falsifies only the fully
        charged crossover for the tested family and schedule.
      - >-
        Positive multiplicity with failed HA-3 falsifies the runtime bridge, not
        the point-equality implementation.
      - >-
        Isomorphism heterogeneity narrows the mechanism to a public
        representation and requires discovery accounting; it is not apparatus invalidity.
    inconclusive:
      - Any interval straddling 5/18 or disagreement among frozen finite-size sensitivities.
      - Any underpowered cluster design, zero-count boundary, or model nonconvergence.
      - Any resource exhaustion, timeout, implementation failure, or incomplete stage.

  statistical_plan:
    preregistered_ladder:
      subgroup_order_bits: [18, 21, 24, 27, 30]
      independent_curves_per_size: 32
      models_per_curve: 4
      models: [canonical, isomorphism_1, isomorphism_2, isomorphism_3]
      roots_per_curve_model: 256
      root_pairing: >-
        The 256 scalar/root tuples are shared across a curve's four models for a
        paired isomorphism comparison. Power conservatively counts one model.
      total_unique_curve_roots: 40960
      total_treatment_root_model_rows: 163840
      root_schedule_rule: >-
        Every component seed is SHA256('IDEA-20260808-2fabbc' || arm || bits ||
        curve_index || model_index || root_index || component), interpreted by
        rejection sampling in the required finite domain. Exact seed strings and
        generated values must be frozen in a later experiment contract before
        execution; this proposal authorizes none.
    primary_estimand: >-
      Gamma_s from verified Boolean S. X and kappa_N test the bridge; Y and
      selected-cross-pair ratios are secondary diagnostics only.
    boolean_model: >-
      Complementary-log-log cluster model
        cloglog Pr[S=1] = alpha_s + (-1/3+gamma_s)*log(N)
                         + offset_exact(N,L,M,D) + eta*N^(-1/3)
                         + curve_effect + model_within_curve_effect,
      where alpha_s is free and, for D>0,
        offset_exact=log(D)-(2/3)*log(N)
      plus the exact L/M floor correction. A D=0 root has exposure zero and is a
      retained structural zero, not a logged rate. Eta is not fitted: the entire
      analysis is repeated for eta in {-4,0,4}. The gate must hold under all
      three.
    distinct_count_model: >-
      Clustered count model with log D-log N as an exact offset for X. A
      negative-binomial dispersion is estimated at the root level, but confidence
      is obtained by resampling whole curves. X is never expanded into D
      independent Bernoulli trials.
    dependence_units:
      root: minimum_observation_unit
      model: repeated_measure_nested_within_curve
      curve: family_level_cluster_and_resampling_unit
      size: fixed_preregistered_design_level
    inference: >-
      One-sided 99.5% curve-cluster wild-bootstrap interval with 99999 frozen
      Rademacher draws; all root/model records of a curve move together. The
      synthetic arms use their 32 independent global label/group seeds as the
      analogous cluster. Report profile likelihood and cluster bootstrap; if
      either fails to converge, the cell is inconclusive. No cross-pair binomial
      interval is permitted.
    pooling_rules:
      - Roots pool only through the model within their exact curve/model/arm cell.
      - Isomorphic models never count as independent curves.
      - Curves may pool across size only through the single preregistered slope model.
      - Treatment, null, quotient, and planted arms are never pooled.
      - Pooled descriptive sums retain per-curve values and carry no inferential interval.
    zero_count_rules:
      - No 0.5, add-one, or other pseudocount is permitted.
      - >-
        D=0 roots remain S=0 with zero exposure and are retained in selector-
        regularity diagnostics; a D=0 frequency outside the null envelope
        invalidates HA-1 rather than being silently dropped.
      - Zero cells enter the Bernoulli/count likelihood at the boundary.
      - >-
        All-zero largest cells cannot yield a lower bound on gamma_s; report the
        cluster-compatible upper bound and an inconclusive or scoped-negative
        branch only after the complete schedule.
      - Separation or nonconvergence is inconclusive; no post-hoc estimator substitution.
    finite_size_rules:
      - Exact N, L, M, D, and floor corrections are retained as offsets.
      - Free intercept alpha absorbs constant enrichment and prevents a constant from becoming gamma.
      - Eta is the fixed three-value sensitivity above; it is never tuned or estimated.
      - Leave-one-size-out slopes and residual curvature are diagnostics, not alternate gates.
    multiple_testing: >-
      The only promotion-style statistic is the preregistered family-average
      Boolean full-cost gate at alpha=0.005. Canonical and model-fraction results
      are required scope checks, not routes around a failed primary gate. No
      smallest-p-value model or curve is selected.
    power_calculation:
      alternative_gamma: 0.30
      null_boundary_gamma: 0.2777777777777778
      effect_gap: 0.0222222222222222
      alpha_one_sided: 0.005
      assumed_success_probability_range: [0.30, 0.70]
      assumed_max_curve_design_effect: 2.0
      size_spread_sum_squared_logN: 43.240771252638126
      conservative_information: 74387.96360133842
      conservative_standard_error_gamma: 0.005185177918497309
      noncentral_z: 4.285720291862678
      approximate_power: 0.9563569834104666
      derivation: >-
        Using only one model per curve, I=32*256*0.21*
        sum_b[(b-24)*ln(2)]^2=74387.96. Multiplying variance by design effect 2
        gives SE=sqrt(2/I)=0.005185. At gamma=0.30 the distance above 5/18 is
        1/45, yielding noncentral z=4.286 and approximate one-sided power 0.956
        after the z_0.995=2.576 critical value.
      limitations: >-
        This is a design calculation, not measured power. It is conditional on
        the success-probability range, design effect <=2, valid fixed finite-size
        envelope, and model convergence. If control data violate any condition,
        treatment is not interpreted. The schedule is not powered for an
        arbitrarily small epsilon above 5/18; 5/18<gamma_s<0.30 may be
        inconclusive.

  minimal_test:
    design: >-
      Prospective proposal only. Freeze code, curve certificates, exact seeds,
      cost units, and the five-size schedule. Run every integer/hash synthetic
      null and positive control first. Only after all apparatus gates pass,
      generate 32 independent prime-order curves per size, validate canonical
      and three public isomorphic models, and run the fixed 256 roots per model.
      Analyze verified Boolean success with curve-cluster inference. Do not peek,
      resize, select a model, or stop on treatment effect.
    required_metrics:
      - D, Y, X, V, S for every root
      - C_L and C_R maxima, duplicate scalars, bucket and selected-pair counts
      - E[X], E[X^2], kappa_N, Y/max(1,X), and p_hat/E[X]_hat by cluster
      - family, canonical, and isomorphic-model gamma_s with frozen sensitivity intervals
      - group additions/doublings, field mul/sqr/inv, label evaluations, hashes/lookups, and verifications
      - live entries, algorithmic bytes, externally observed peak bytes, memory traffic, and wall time
      - control coverage, curve/model heterogeneity, lag diagnostics, and complete invalidation log

  cost_accounting:
    cost_model: >-
      Raw work W counts group/field/hash primitives and reports them separately;
      group-equivalent conversion weights must be frozen by a matched benchmark.
      Live storage S counts entries and bytes. Wiring-aware full cost follows the
      repository convention FC=W*S^(1/3) when HA-6 holds. This convention is an
      asymptotic comparison with unextracted constants, not a real-machine price.
    component_table:
      - component: raw_group_work
        candidate_charge: >-
          Four length-L fixed-base scalar lists, selected pair additions,
          self-reduction, failed roots, and exact final verification. Per root
          N^(1/3+o(1)); expected total N^(2/3-gamma_s+o(1)).
        free_items: []
      - component: raw_field_hash_work
        candidate_charge: >-
          Affine normalization, signed-y labels, bucket keys, point hashing,
          equality, and lookup traffic, all O(1) per constructed or selected
          entry and therefore the same raw exponent as group work.
        free_items: []
      - component: live_storage
        candidate_charge: >-
          Four base lists plus both selected-pair tables. Under the hard fibre
          cap at most 12L records; exponent 1/3. Entry-width formula is
          w(n)=2*ceil(n/8)+32 bytes before allocator overhead.
        free_items: []
      - component: wiring_aware_full_cost
        candidate_charge: >-
          N^(2/3-gamma_s)*N^(1/9)=N^(7/9-gamma_s). Rho remains N^(1/2)
          because per-processor state is small. Full-cost crossover is
          gamma_s>5/18.
        free_items: []
      - component: preprocessing
        candidate_charge: >-
          Width-5 fixed-base tables cost sum_window(2^5-1) points per curve,
          are stored in bytes, and are charged once even for one target. No
          full-group label or collision table is allowed.
        free_items: []
      - component: construction_and_discovery
        candidate_charge: >-
          The canonical model and h_y formula are public and need no search. If
          J=N^delta models are screened with R=N^rho roots each, discovery raw
          work is N^(delta+rho+1/3) and full cost is
          N^(delta+rho+4/9); the chosen attack cost is added, not substituted.
        free_items: []
      - component: advice
        candidate_charge: >-
          None in the declared claim. Stored model rankings, learned label maps,
          or reusable root tables are advice and create a different preprocessing
          point. Control PRPs are experimental fixtures, not solver advice.
        free_items: []
      - component: labels_data_queries
        candidate_charge: >-
          h_y is computed locally from public coordinates. Label evaluations,
          point encodings, and exact-equality/hash queries are Theta(raw work).
          External oracle queries and private data are zero.
        free_items: []
      - component: communication
        candidate_charge: >-
          Every selected-table access is counted as local memory traffic. H
          parallel root engines use H separate tables; no table is magically
          shared. Cross-engine traffic is seeds, counters, and verified witnesses,
          but total hardware and aggregate bytes are reported.
        free_items: []
      - component: parallel_hardware
        candidate_charge: >-
          For H=N^pi independent engines, wall exponent is
          2/3-gamma_s-pi until H reaches the number of roots; total raw work is
          unchanged, aggregate live entries are H*N^(1/3), and ideal sharding
          does not improve the full-cost exponent. Each engine is charged.
        free_items: []
      - component: verification
        candidate_charge: >-
          Every distinct match reconstructs k_hat and checks [k_hat]P=Q. Under
          HA-3, expected successful-root verification is N^o(1); all rejected
          candidates remain charged. Verification can never rescue a failed gate.
        free_items: []
      - component: multi_target
        candidate_charge: >-
          For K=N^tau targets with no sharing, sequential raw cost is
          N^(tau+2/3-gamma_s), full cost N^(tau+7/9-gamma_s), and one live table
          remains N^(1/3). Concurrent targets multiply hardware and storage.
          Reusing lists, labels, preprocessing, or model training is a new
          algorithm and requires a separate record.
        free_items: []
    derivation:
      per_root_raw: N^(1/3+o(1))
      boolean_success: N^(-1/3+gamma_s+o(1))
      expected_roots: N^(1/3-gamma_s+o(1))
      total_raw: N^(2/3-gamma_s+o(1))
      live_entries: N^(1/3+o(1))
      wiring_multiplier: N^(1/9+o(1))
      total_full_cost: N^(7/9-gamma_s+o(1))
      raw_rho_crossover: gamma_s>1/6
      full_rho_crossover: gamma_s>5/18
      standard_bsgs_full_crossover: gamma_s>1/9
      memory_matched_bsgs_delta: gamma_s
    parallel_form:
      processors: H=N^pi
      candidate_wall_time: N^(2/3-gamma_s-pi+o(1))
      candidate_total_work: N^(2/3-gamma_s+o(1))
      candidate_aggregate_entries: N^(pi+1/3+o(1))
      candidate_cross_engine_communication: >-
        O(H) control/result messages plus retained counters; local table traffic
        is Theta(total work) and is captured by HA-6.
      rho_comparator: >-
        Parallel vOW has wall N^(1/2-pi), total work N^(1/2), small
        per-processor state, and sparse distinguished-point communication. Its
        processor count, distinguished-point table, setup, failures, and final
        verification must be reported beside the candidate.
    model_discovery_gate: >-
      If model search uses J=N^delta models and R=N^rho training roots, beating
      rho in full cost additionally requires delta+rho+4/9<1/2, i.e.
      delta+rho<1/18, as well as gamma_s>5/18 on an untouched holdout. The
      minimal test performs no selection and claims no such point.
    multi_target_comparison: >-
      The corpus-stated, externally unverified solve-all-K generic comparator is
      N^((1+tau)/2). Against that provisional row, the no-sharing candidate
      requires gamma_s>1/6+tau/2 in raw work and gamma_s>5/18+tau/2 in full
      cost. This record does not assert that comparator as newly verified and
      makes no multi-target improvement claim.

  pareto_table:
    scope: Single-target, no-advice prime-order ECDLP unless a row says otherwise.
    axes: [raw_work, wall_time, live_storage, full_cost, preprocessing, advice, data_queries, communication, verification, targets]
    rows:
      - algorithm: Pollard_rho_vOW
        raw_work_exponent: 1/2
        live_storage_exponent_per_processor: 0
        full_cost_exponent: 1/2
        preprocessing_exponent: 0
        data_queries: public_group_law_only
        parallelism: wall exponent 1/2-pi on N^pi processors
        maturity: established_corpus_baseline
      - algorithm: standard_BSGS
        raw_work_exponent: 1/2
        live_storage_exponent: 1/2
        full_cost_exponent: 2/3
        preprocessing_exponent: 0
        data_queries: public_group_law_and_equality
        parallelism: memory_and_wiring_charged
        maturity: established_corpus_baseline
      - algorithm: memory_matched_BSGS
        setting: S=N^(1/3)
        raw_work_exponent: 2/3
        live_storage_exponent: 1/3
        full_cost_exponent: 7/9
        preprocessing_exponent: 0
        maturity: exact_symbolic_boundary
      - algorithm: candidate_gamma_s
        raw_work_exponent: 2/3-gamma_s
        live_storage_exponent: 1/3
        full_cost_exponent: 7/9-gamma_s
        preprocessing_exponent: 0
        external_queries: 0
        maturity: unverified_conditional_proposal
      - algorithm: reusable_generic_preprocessing_frontier
        setting: fixed_curve_advice_S=N^sigma
        online_lower_bound_exponent: (1-sigma)/2
        preprocessing: must_be_charged_or_amortized_over_declared_targets
        advice_exponent: sigma
        maturity: corpus_lower_bound_and_unverified_achievability_neighbour
      - algorithm: candidate_K_targets_no_sharing
        setting: K=N^tau solve_all
        raw_work_exponent: tau+2/3-gamma_s
        live_storage_exponent_sequential: 1/3
        full_cost_exponent_sequential: tau+7/9-gamma_s
        maturity: derived_upper_bound_not_a_claim
    comparisons:
      - condition: gamma_s<=1/6
        verdict: >-
          Rho dominates in raw time and storage; the candidate is not competitive.
      - condition: 1/6<gamma_s<=5/18
        verdict: >-
          Candidate raw time is lower than rho but full cost is higher; no fully
          charged improvement exists.
      - condition: 5/18<gamma_s<=1/3
        verdict: >-
          Candidate would have lower raw and full exponents than rho but uses
          N^(1/3) memory; the point is Pareto-incomparable in wall time/hardware
          until parallel resources and constants are fixed.
      - condition: gamma_s>1/9
        verdict: >-
          Candidate beats standard BSGS in Wiener full cost and uses less memory.
      - condition: gamma_s>0
        verdict: >-
          Candidate improves on N^(1/3)-memory BSGS by gamma_s in both raw and
          Wiener full-cost exponents, subject to all heuristics.
    dominated_by: >-
      No realized result is claimed. At the leading gamma_s=0 expectation,
      Pollard rho/vOW dominates on raw work, storage, wiring, hardware, and
      simplicity. For 0<gamma_s<=5/18 rho still prevents a fully charged
      improvement. Only the unobserved conditional region gamma_s>5/18 avoids
      full-cost domination, while carrying far more storage. Preprocessing,
      multi-target, special-curve, quantum, and live-key settings do not inherit
      this row.
    sota_delta: >-
      Against rho, raw exponent delta is 1/6-gamma_s and full-cost delta is
      5/18-gamma_s, with +1/3 storage exponent. Against standard BSGS, full-cost
      delta is 1/9-gamma_s and memory delta is -1/6. Against N^(1/3)-memory BSGS,
      raw and full-cost deltas are both -gamma_s. No measured delta exists.

