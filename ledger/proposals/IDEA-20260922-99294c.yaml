  citation_note: >-
    No web search was run this session. Whether field-basis invariance of
    solving degree has been studied for Weil-descent-based ECDLP index
    calculus specifically (as opposed to the well-known basis-dependence of
    RAW ARITHMETIC EFFICIENCY, which is standard and not what this record
    asks about) was not checked externally.

  assumptions:
    - >-
      The toy analogue uses curves over F_2^n, n prime <= 41, each with (i) a
      low-weight defining polynomial (trinomial or pentanomial, whichever
      exists at that n) as the "polynomial basis" arm and (ii) a normal basis
      (guaranteed to exist by the normal basis theorem) as the second arm; a
      third arm uses a SECOND, algebraically inequivalent low-weight defining
      polynomial of the same degree n where one exists, to separate
      "polynomial vs normal" from "one specific polynomial vs another".
    - >-
      OFF-LIMITS COMPONENTS DECLARED. F2 is the decomposition family whose
      engine cost is measured; no new factor base or relation mechanism is
      proposed. The Frobenius-orbit reduction (RQ-FROB-7d8dd4) is used only
      as a standard component of the toy pipeline, not re-litigated.
    - >-
      "Measured solving degree" is read from RQ-ICPERF-94c86e's own
      instrument conventions (its engine-naming and SAT/UNSAT-separation
      rules), so results are directly comparable to that question's existing
      cells rather than to a bespoke metric.

  proof_search_map:
    bottleneck: >-
      Whether an engine's MEASURED cost (solving degree, SAT conflict count,
      wall time) on a Weil-descended Boolean system, at fixed curve and fixed
      arity m, differs by more than measurement noise between an
      F_2-basis and an alternative basis. Decidable by running the SAME,
      already-filed builder and engine twice per toy cell, once per basis.
    baseline_embedding:
      parameter_slice: >-
        Total degree, per-equation variable count, and chaining topology are
        the parameter slice this record's baseline_embedding must reproduce
        EXACTLY across bases (they are basis-invariant by the elementary
        argument above); any measured DIFFERENCE in those three quantities
        between bases would falsify the elementary argument itself, not the
        record's live claim, and is checked first as a sanity gate.
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE for the degree-invariance sanity gate: pick
        any toy n and any two explicit 2x2 (or small) invertible F_2 matrices
        as a stand-in basis change on a tiny system, verify by hand that
        total degree of a substituted polynomial cannot exceed the original.
        NUMERIC, AT TOY SCALE for the baseline itself: build the SAME curve's
        descended system in BOTH bases and confirm total degree and variable
        count match exactly before comparing any engine-measured quantity.
    observation_collision:
      observable: >-
        Measured solving degree (or SAT conflict count / wall time), per
        basis, per toy cell, at fixed arity m.
      distinct_preimage_search: >-
        Two different basis pairs could show the SAME measured-cost ratio for
        DIFFERENT reasons -- a genuine sparsity effect from the specific
        defining polynomial's weight, or an engine-specific artifact (term
        order interacting with variable ORDERING, which basis choice also
        happens to change). The control that separates these: hold the
        engine's term order FIXED under a canonical variable relabeling
        across bases (so variable 1 through 131 always means "the i-th
        coordinate in whichever basis"), and separately vary term order
        (reusing IDEA-20260815-ad4b55's own instrument) within EACH basis, to
        check whether a basis effect survives re-ordering.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The SAME Weil-descended system, expressed in two different bases
          related by an explicit, computed invertible F_2 matrix; the
          transform IS the basis change itself (an F_2-linear substitution),
          stated so its completeness (every solution maps to a solution) and
          soundness (the map is a bijection on solutions, being invertible)
          are immediate from linearity, with zero cost loss by construction
          (an invertible linear map has an inverse of the same cost).
        predicted_gain: >-
          If H_dep holds, identifies a genuinely free (representation-only,
          no new algorithm) engine-cost lever on this program's existing F2
          instruments; if H_inv holds, closes the lever with a certificate
          and adds a third confirmed invariance axis (basis) alongside model
          and term order.
    quantifier_order: >-
      EXISTS a toy field size, arity, and basis pair at which measured
      solving degree is compared; the record predicts (H_inv, the a-priori
      expected outcome, consistent with this program's prior finding-in-
      spirit on curve-model invariance) that FOR the tested toy cells, the
      measured cost agrees across bases within noise. No forall claim over
      all n or all bases is made; no claim about n=131 is made or
      extrapolated.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested toy cells, measured solving degree under basis A is
        [equal to / different from] basis B by [factor], with [instrument]."
        It cannot certify anything about n=131 (arithmetic-only, no
        extrapolation claimed), about bases other than the two-to-three
        tested per cell, or about WHY any measured difference occurs beyond
        what the sparsity/structure-constant comparison in the report can
        show empirically.
      nearby_object_control: >-
        The degree-invariance sanity gate itself (total degree and variable
        count must match EXACTLY across bases) is the proves-too-much
        control: an instrument that shows those two quantities DIFFERING
        across bases is wrong, full stop, by the elementary linear-algebra
        argument, and must be fixed before any solving-degree comparison is
        trusted.
    proof_obligations:
      - claim: Total degree of the descended system's equations is invariant under an invertible F_2-linear basis change.
        responsibility: correctness
      - claim: Variable count and chaining topology are unchanged by a basis change (only the meaning of each of the 131 coordinates changes).
        responsibility: correctness
      - claim: The toy curve's system in both bases is verified, by direct evaluation on sample points, to describe the SAME curve.
        responsibility: baseline
      - claim: Measured solving degree is read using RQ-ICPERF-94c86e's own instrument conventions, not a bespoke metric.
        responsibility: interface
      - claim: Any measured cost difference is checked against a term-order control before being attributed to the basis alone.
        responsibility: scope

  predictions:
    - metric: total degree and variable count of the descended Boolean system, polynomial basis vs normal basis, toy n<=41
      direction: same
      minimum_effect: 'EXACT equality; any deviation voids the instrument before any live comparison is trusted.'
    - metric: >-
        measured solving degree (or SAT conflict count), fixed arity m,
        polynomial basis vs normal basis, at the smallest executable toy
        cell
      direction: different
      minimum_effect: >-
        Predicted WITHIN a factor of 2 of each other (H_inv, the a-priori
        expected outcome); a difference exceeding 2x, replicated at a second
        independent toy cell, is the H_dep outcome and triggers the wider
        sweep (more n, more bases, the sparsity-driver investigation).
    - metric: >-
        the SAME comparison with term order held canonical across bases
        (variable-relabeling control)
      direction: same
      minimum_effect: >-
        Any effect found in the primary comparison must SURVIVE this control
        to be attributed to basis rather than to an incidental interaction
        with the engine's own term-ordering heuristic.

  minimal_test:
    design: >-
      STAGE 0 (zero compute). The degree-invariance hand check on a small
      explicit basis-change matrix. STAGE 1 (toy, cheap). At n prime <= 41,
      construct ECC2K-130-shaped Koblitz curve analogues (or their nearest
      constructible toy equivalents, given trinomial/pentanomial
      availability at that n) in (i) the polynomial basis from the field's
      own low-weight defining polynomial and (ii) a normal basis, verify
      both describe the same curve by sample-point evaluation, and build the
      Weil-descended Boolean system in both, confirming total degree and
      variable count match. STAGE 2. Run RQ-ICPERF-94c86e's own instrument
      (SAT/CNF-XOR or Groebner, as that question's cells are already
      instrumented) on both bases at fixed small arity m, >= 20 random
      targets, recording solving degree, conflict count, wall time. STAGE 3.
      Term-order control: repeat with a canonical variable relabeling across
      bases and, within each basis, vary term order per
      IDEA-20260815-ad4b55's own instrument, to check whether any basis
      effect survives. STAGE 4. If a third low-weight defining polynomial
      exists at the chosen n, repeat the polynomial-basis arm with it, to
      separate "polynomial vs normal" from "one polynomial vs another".
      STAGE 5. Report degree/variable-count equality (the sanity gate),
      measured-cost ratios across all basis pairs, and the term-order-
      controlled reading.
    controls:
      - 'Degree/variable-count exact-equality sanity gate, checked before any cost comparison.'
      - 'Term-order canonicalisation control, reusing IDEA-20260815-ad4b55''s instrument.'
      - 'A second, algebraically inequivalent low-weight defining polynomial, where available, as a within-polynomial-basis control.'
      - 'Independent replication at a second toy field size before any H_dep claim is reported.'
    required_metrics:
      - 'total degree and variable count, per basis (sanity gate)'
      - 'measured solving degree / conflict count / wall time, per basis, per cell'
      - 'term-order-controlled cost ratio'
      - 'engine name and version'

  falsification_conditions:
    - 'Total degree or variable count differs across bases: instrument defect, fixed before any further claim.'
    - >-
      A measured cost difference (>2x) at one toy cell is not replicated at
      an independently seeded second toy cell of the same size: reported as
      noise, not as H_dep.
    - 'A measured cost difference disappears entirely under the term-order-canonicalisation control: attributed to term order, not basis, and reported as such.'

  confounders:
    - >-
      Engine-specific variable-ordering heuristics (which a naive
      implementation might derive from the input's variable-declaration
      order, itself basis-dependent) could masquerade as a basis effect;
      Stage 3's canonical-relabeling control exists specifically to catch
      this.
    - >-
      "Normal basis" is not unique (there may be multiple normal bases,
      optimal or not, at a given n); this record uses one explicit,
      constructed normal basis per toy cell and reports which, rather than
      claiming a result for "the" normal basis in general.
    - >-
      A toy curve's own defining-polynomial weight (number of nonzero terms)
      is not independently controllable from its degree at small n; results
      at one toy n may not isolate weight from degree cleanly, and this is
      disclosed rather than assumed away.

  interpretation_limits:
    - >-
      A representation/measurement contribution about ENGINE COST, not a new
      attack object or exponent; total degree is basis-invariant by
      elementary algebra and this record does not dispute that.
    - >-
      At best a CONSTANT-FACTOR engine-cost change even under H_dep, since a
      basis substitution cannot move total degree, hence cannot move the
      leading exponent of any degree-based complexity bound this program
      uses; explicitly disclosed as not exponent-moving.
    - >-
      No claim about n=131 itself; toy-only, arithmetic-only per the lane's
      own constraint, feeding RQ-ICPERF-94c86e's boundary table one more
      coordinate (basis) it has not yet varied, if H_dep is found.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Null / H_inv prediction.) Measured solving degree at fixed arity is
        basis-invariant to within a small constant factor across the tested
        toy cells, imitating this program's own prior finding-in-spirit that
        curve-MODEL choice does not move measured solving degree
        (IDEA-20260815-b751cf's question, not yet independently confirmed by
        this record).
      rigorous_support: >-
        Rigorous ingredient: total degree IS basis-invariant (proved above).
        Classical statement imitated: none beyond that; the EXTENSION to
        "measured engine cost tracks total degree closely enough that basis
        does not matter in practice" is exactly the heuristic being tested,
        stated as a heuristic because it does not follow from the degree
        argument alone.
      validation_plan: >-
        SAMPLE - the toy cells of Stage 1-4 above, n prime <= 41, >= 20
        targets per cell per basis. COMPARISON - measured-cost ratio
        distribution across bases, compared against a null of "ratio near
        1". TAIL - the largest observed ratio, and whether it survives the
        term-order control. SAMPLED PARAMETERS RECORDED - n, basis
        (explicit matrix or defining polynomial), arity, engine, seed.
        TRANSFER - explicitly none to n=131; toy-only.

  heuristic_note: >-
    The elementary degree-invariance fact is unconditional and is not listed
    as a heuristic; H1 covers only the EXTENSION to measured engine cost,
    which is the record's actual open question.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. Basis substitution cannot change total
      degree, hence cannot change the exponent of any degree-based cost
      model this program uses; at best a constant-factor engine-cost change,
      explicitly disclosed as such.
    memory_exponent: Unchanged, for the same reason.
    best_known: >-
      Rho at 2^60.9 (KN-LIT-096); this record does not compare against it
      directly, since even a positive H_dep finding would be a constant-
      factor engine-cost result, orders of magnitude short of moving the
      QSP/SEMBIN lines' already-large gaps to rho (per e.g. IDEA-20260916-
      3f7a1c's >=110-bit attempts-column recomputation).
    hidden_overhead: >-
      None beyond the disclosed constant-factor scope; the record does not
      claim to move any line's total cost meaningfully.
    tradeoff_note: Not applicable.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Reuses RQ-ICPERF-94c86e's existing engine instrumentation and, for the
      term-order control, IDEA-20260815-ad4b55's instrument; the new
      component is the dual-basis system builder (an F_2-linear change-of-
      variables layer applied before the existing Weil-descent builder).
      Toy-scale (n<=41) throughout.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 (index-calculus reachability, RQ-BINSTD-b6f698)
    prior_best: Pollard rho with Frobenius and negation speedups, 2^60.9 iterations (KN-LIT-096)
    time_exponent: not_applicable (representation/measurement audit; best case constant factor, disclosed)
    memory_exponent: not_applicable
    hidden_cofactor: none; total degree is provably basis-invariant
    claim_kind: representation_invariance_audit

  dominated_by: >-
    n/a (no attack claimed). As an invariance audit: no prior record in this
    program's corpus varies field basis specifically (checked: grep for
    "normal basis" / "polynomial basis" / "F_2-basis" against
    ledger/proposals/ returned no relevant hits); not dominated on that
    specific axis. On the broader question of engine-cost invariance under
    representation choice, IDEA-20260815-b751cf (curve model) and
    IDEA-20260815-ad4b55 (term order) are the nearest, non-dominating
    siblings on different axes.

  sota_delta:
    time: n/a; no attack, no exponent, best case constant factor if H_dep holds
    memory: n/a
    data_queries: >-
      Against this program's prior state: the first record to name field
      basis as an unvaried representation axis for Weil-descended ECDLP
      index calculus, tied specifically to ECC2K-130's own documented dual
      basis usage (KN-LIT-661e97).

  frontier_check:
    status: pending
    note: >-
