idea:
  id: IDEA-20260922-99294c
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    IS THE "FULLY DETERMINED" WEIL-DESCENT SHAPE BASIS-INVARIANT? n=131 prime
    forecloses any subfield-based descent choice, but the F_2-BASIS used to
    coordinatise F_2^131 (the program's own defining pentanomial
    z^131+z^13+z^2+z+1 vs a normal basis, the SAME basis KN-LIT-661e97's own
    Bailey et al. protocol used for its Hamming-weight test) is an unexplored
    lever; total degree is basis-invariant by elementary algebra, but
    sparsity and measured solving degree are not -- a toy-scale invariance
    audit at prime n<=41, using RQ-ICPERF-94c86e's own instrument

  class: representation

  claim: >-
    RQ-BINSTD-b6f698's own audit (analysis/binstd-curve-audit/) establishes
    that 131 (and every other m this program's binary population uses) is
    PRIME, so GHS-style Weil descent to a proper intermediate subfield has NO
    intermediate subfield to descend to on ECC2K-130; the only descent
    available to any Semaev/Weil-descent-to-F_2 line is the FULL descent to
    F_2, and the algorithm (chosen arity m, chosen summation polynomial,
    chosen chaining topology) fixes the descended Boolean system's per-
    equation TOTAL DEGREE and VARIABLE COUNT once m is chosen -- this is what
    the lane's seam calls "fully determined". What the algorithm does NOT fix
    is HOW each of the 131 F_2-coordinates of a field element is chosen: the
    program's own field polynomial (KN-LIT-661e97's z^131+z^13+z^2+z+1, a
    pentanomial) fixes a POLYNOMIAL basis, but F_2^131/F_2 admits a NORMAL
    basis (guaranteed to exist for every finite field extension by the normal
    basis theorem, already invoked elsewhere in this program's Frobenius
    line, IDEA-20260918-9abf42) and, per KN-LIT-661e97's own quoted Section 3,
    the ORIGINAL Bailey et al. computation itself used a TYPE-2 NORMAL BASIS
    for its distinguished-point Hamming-weight test -- meaning this program's
    own primary source for ECC2K-130 already uses TWO different bases for two
    different purposes (polynomial basis for the field's defining
    polynomial as usually quoted, normal basis for the campaign's own
    Hamming-weight statistic), without either this program or, so far as
    checked, the source paper asking whether the CHOICE affects a
    Weil-descended decomposition system's difficulty.
    THE ALGEBRAIC FACT THIS RECORD STATES AS ITS BASELINE-EMBEDDING CHECK,
    NOT AS NEW CONTENT: any two F_2-bases of F_2^131 are related by an
    invertible 131x131 matrix over F_2, i.e. by an F_2-LINEAR change of the
    131 Boolean coordinates representing one field element; substituting
    linear forms for the variables of a polynomial cannot raise its total
    degree (each monomial's degree is preserved or can only fall, and falls
    only on a measure-zero, non-generic substitution, which an invertible
    change of basis is not), so the descended Boolean system's per-equation
    TOTAL DEGREE is basis-invariant. This is essentially certain and is
    included only as the zero-compute reproduction check a basis-dependence
    claim must survive.
    THE GENUINELY OPEN, TESTABLE CONTENT: total degree invariance does NOT
    imply SPARSITY invariance (how many of the possible monomials up to that
    degree actually appear per equation) or MEASURED SOLVING-DEGREE
    invariance (what a Groebner or SAT engine actually reaches before
    solving, which this program's own RQ-ICPERF-94c86e and RQ-SDEG-001/
    RQ-DREG-001 lines already treat as an ENGINE-MEASURED quantity distinct
    from total degree, not a purely combinatorial one) -- because which
    monomials appear depends on how the defining polynomial's structure
    (which coefficients are 1) interacts with the CHOSEN basis's own
    structure constants, and those interactions are basis-specific even when
    total degree is not. TWO EXPLANATIONS THIS DISCRIMINATES. (H_inv) measured
    solving degree (or SAT conflict count, RQ-ICPERF-94c86e's instrument) at
    fixed arity m is basis-invariant IN PRACTICE, closing this lever with a
    certificate consistent with this program's own prior finding that
    solving degree appears invariant across CURVE MODELS (the nearby, related
    result IDEA-20260815-b751cf tests for Weierstrass/Edwards/Montgomery/
    Hessian forms, a different but philosophically adjacent invariance
    question); or (H_dep) some basis choice measurably lowers solving degree
    or engine cost at fixed m, in which case the "fully determined" reading
    of this seam is WRONG in one specific, previously unexploited respect --
    the descended system's DIFFICULTY, not its shape, has an unexplored
    degree of freedom -- and identifying which basis property (sparsity of
    the defining polynomial, or some other structure constant) drives the
    difference becomes the deliverable.

  mechanism: >-
    OBJECT FRAME. Representation: R1 (RQ-ECDLP-623a32's field-representation-
    of-coordinates class), specifically the CHOICE OF F_2-BASIS used to
    express a field element as 131 Boolean variables before Weil descent --
    this is a genuinely different R1 axis from the ones this program's
    SEMBIN/DREG/QSP lines have varied (arity m, chaining topology, monomial
    order per IDEA-20260815-ad4b55, curve model per IDEA-20260815-b751cf),
    none of which vary the BASIS. Operation set Sigma: NONE is proposed; this
    is not a lossy-projection candidate at all -- a change of F_2-basis is an
    INVERTIBLE linear map, so by definition it discards nothing and is
    explicitly a CHANGE OF COORDINATES in docs/inventor-protocol.md section
    2's own sense, not a new tracked object. This record does not claim
    otherwise; its content is that a change of coordinates can still change
    an ENGINE'S MEASURED COST, which is a legitimate, separate question from
    whether it is a new lossy object.
    TRICHOTOMY. Not applicable in the partial-action/branching/coordinate-
    dependent sense, precisely because no lossy object is proposed; the
    record instead sits alongside this program's other MODEL/BASIS/ORDER
    invariance audits (IDEA-20260815-b751cf curve model, IDEA-20260815-ad4b55
    monomial order), which are measurement/representation records about
    ENGINE COST, not about a new attack object, and are declared as such.
    LOSSY-PROJECTION TEST: EXPLICITLY NOT APPLICABLE, stated per the
    schema's not_applicable_reason field in proof_search_map, because an
    invertible basis change is definitionally not lossy.
    F2 DECLARATION. The decomposition family this record's engine cost is
    measured on is F2 (Weil-descended Semaev/SEMBIN systems), exactly as
    filed elsewhere; no new factor base or relation mechanism is proposed.
    KN-OPEN-020 class: not applicable (no new factor base).
    WHY THIS IS SCOPED TO ECC2K-130 SPECIFICALLY. The record uses ECC2K-130's
    OWN, already-cited defining pentanomial (KN-LIT-661e97) and its OWN,
    already-cited normal-basis usage (the same source, Section 3, for the
    campaign's Hamming-weight statistic) as the two SPECIFIC bases compared
    at toy analogues, rather than proposing an abstract basis-invariance
    study; this ties the record concretely to the curve the lane names, per
    the lane's own requirement.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-22'
    scope: >-
      Generated against the BINSTD-IDEATION-BRIEF's lane-A candidate seam
      "n=131 is prime, so Weil descent to F_2 is the only descent available
      and the descended system's shape is fully determined. Is anything about
      that determinacy exploitable, or does it close a cell?" The generator
      identified that "shape" (degree, variable count) is indeed fixed by the
      algorithm, but that BASIS CHOICE -- a dimension the program's existing
      model-invariance and monomial-order-invariance audits do not vary -- is
      not fixed by the algorithm, and is concretely tied to ECC2K-130 via
      KN-LIT-661e97's own dual use of a polynomial basis (the defining
      pentanomial) and a normal basis (the campaign's own DP statistic).
    overlap_review: >-
      Grepped ledger/proposals/ for "normal basis", "polynomial basis",
      "F_2-basis" and "field basis" (0 matches on the FIRST three terms; "field
      basis" returned no relevant hits either). Read IDEA-20260815-b751cf's
      title in dedup-surface.md ("IS THE SOLVING DEGREE A CURVE-MODEL
      INVARIANT? Run the identical Semaev decomposition through short-
      Weierstrass, Edwards, Montgomery and Hessian models") and
      IDEA-20260815-ad4b55's title ("SOLVING DEGREE IS ORDER-DEPENDENT:
      measure the spread across [monomial] orders") -- both are genuine,
      philosophically adjacent invariance audits of the SAME instrument
      (RQ-ICPERF-94c86e / RQ-SDEG-001's measured solving degree), but neither
      varies the FIELD BASIS: one varies the curve's algebraic MODEL (a
      different embedding of the same group), the other varies the
      Groebner/SAT engine's term ORDER (a solver-internal choice); this
      record varies which 131 BOOLEAN COORDINATES represent a single field
      element BEFORE any curve equation is written down, a third, distinct
      axis none of the filed corpus's 164 lane titles name. IDEA-20260918-
      9abf42 (read in full this session) already invokes the normal basis
      theorem for F_2^131 in a DIFFERENT context (counting Frobenius-stable
      subspaces); this record borrows the same theorem's EXISTENCE guarantee
      but asks a cost question that record does not ask. What this record
      adds beyond all three: the field-basis axis itself, tied specifically
      to ECC2K-130's own dual-basis usage in its primary source.

  citations:
