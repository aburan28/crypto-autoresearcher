# IDEA-20261003-84eee0
# Class-number count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-84eee0
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -7 is 1 and of discriminant -15 is 2
  class: measurement
  claim: >-
    Discriminant -7 has 1 reduced binary quadratic form. Discriminant
    -15 has 2. Two exceeds one by 1. The product of the two class
    numbers is 2. Their sum is 3. The gap is a class number, not an
    ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -7 has the form with coefficients 1, 1, and 2.
    Discriminant -15 has the forms with coefficients 1, 1, 4 and
    2, 1, 2. Two copies of class number 1 have gap 0. No curve
    is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Equal hardness of isogenous curves is a different statement
        from these two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 1.
    baseline_embedding:
      parameter_slice: The discriminants -7 and -15 and the counts 1 and 2.
      reproduction_check: >-
        Two readers must agree that the counts are 1 and 2.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 1 drops the gap. Two copies
        of class number 1 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 1 and 2. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 1. The gap is 0.
    proof_obligations:
      - claim: Discriminant -7 has 1 reduced form.
        responsibility: size
      - claim: Discriminant -15 has 2 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -7 and -15. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 1, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -15 is not 2.
    - The product of the two class numbers is not 2.
  confounders:
    - The absolute values 7 and 15 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not a comparison of the class numbers of -3 and -4.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -7 has class number 1, and the
        frozen discriminant -15 has class number 2.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Forms of other discriminants are not counted.
    tradeoff_note: A larger class number is not a shorter walk.
  estimated_cost:
