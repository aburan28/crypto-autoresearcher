idea:
  id: IDEA-20260816-ef56f2
  question_id: RQ-MCE-e65b3c
  added: '2026-08-16'
  title: 'Every structural claim in this bucket needs a null, so build the LADDER rather than a single
    null: random binary code, random alternant, Goppa with reducible g, Goppa with non-squarefree
    g, honest Goppa -- and report for each candidate statistic the exact rung at which it stops separating,
    as a statistic-by-rung separation matrix with a same-rung self-null in every cell.'
  class: composition
  claim: '(A) The decisive axis in this bucket is code FAMILY, not rate -- that is what this program''s
    own corrected boundary record establishes about the one external result it has read closely. A
    statistic that separates honest Goppa from a random binary code but not from a random alternant
    code is measuring alternant-ness; a statistic that separates honest Goppa from Goppa-with-reducible-g
    is measuring irreducibility, not the Goppa construction. Those distinctions are invisible against
    a single null and unavoidable against a ladder. (B) The deliverable is a matrix, not a p-value:
    rows are candidate statistics (square-code defect, dual square-code defect, hull dimension, minimum-distance
    proxy, rank profile under random column subsets), columns are ordered family rungs, and each cell
    holds the AUC and equal-error rate for separating that rung from the top rung, plus the same-rung
    self-null AUC computed by splitting one rung''s samples in half. The matrix says, per statistic,
    exactly how far down the ladder it can see, which is a reusable measurement that outlives whatever
    hypothesis prompted it. (C) NOT CLAIMED: no distinguisher against any deployed system, no attack,
    no key recovery, no security consequence, and no assertion about what any published distinguisher
    does or does not separate -- the ladder characterises THIS program''s own implementations of five
    statistics on locally generated toy codes. The high-rate confound is present in every cell and
    is not repaired by adding rungs. (D) The self-null in every cell is not decoration: a statistic
    that separates two independent halves of the SAME rung is broken, and without that check a separation
    matrix would be an elaborate way to publish an artefact. Every cell that fails its self-null is
    reported as void rather than as a result.'
  mechanism: 'STAGE 1: define the ladder precisely, as five samplers producing codes at matched (n,
    k). RUNG 1, random binary: uniform (n-k)-by-n parity check with rank rejection. RUNG 2, random
    alternant: uniform nonzero multiplier y over GF(2^m)^n with support L, parity entries y_j a_j^i,
    trace-expanded. RUNG 3, Goppa with REDUCIBLE g: g a product of lower-degree factors, squarefree,
    no root in L. RUNG 4, Goppa with NON-SQUAREFREE g: g with a repeated factor, no root in L. RUNG
    5, honest Goppa: g irreducible of degree t. Each rung is generated in the same invocation from
    a domain-separated seed and resampled until its realised k matches rung 5''s, with the resample
    rate recorded. STAGE 2: implement five statistics over the shared GF(2) primitives -- square-code
    defect of the code, square-code defect of the dual, hull dimension, a minimum-distance proxy by
    sampling low-weight codewords, and the rank-deficiency count of the parity check restricted to
    random column subsets. STAGE 3: sample 200 codes per rung per cell, compute all five statistics
    on every code, and store the raw 200-by-5 table per rung. STAGE 4: for each statistic and each
    rung r < 5, compute AUC(rung 5 versus rung r) and its equal-error rate. STAGE 5: for each statistic
    and each rung, split that rung''s 200 samples into two halves and compute the same-rung self-null
    AUC; a cell whose self-null falls outside [0.42, 0.58] is marked void. STAGE 6: emit the full
    matrix with self-null status per cell, per (n, k) cell, refusing to pool. STAGE 7: report, per
    statistic, the LOWEST rung it still separates, which is the one-line summary the matrix exists
    to produce.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-MCE-3f7c02's corrected_boundary and RQ-MCE-f8fca0's the_sources_own_qualification,
      which together establish that this program's committed reading of the decisive axis is code
      family. Read RQ-MCE-b38a8b's methods block, in particular the 'structural feature panel' list
      and the requirement for 'honest-versus-honest null cohorts and planted-representation / planted-witness
      positive controls'. Read the objective and claim_ceiling of EXP-MCE-3ffdf9, which carries one
      matched random-multiplier alternant null. Ran grep -ril 'schur|square code' and grep -ril 'hull'
      over ledger/proposals/. Read docs/inventor-protocol.md section 3.
    results: 'RQ-MCE-b38a8b''s methods require ''honest-versus-honest null cohorts'' and a structural
      feature panel, which is the closest existing construct: it is a panel of features measured against
      one honest-versus-honest null, not a matrix of features against an ordered family ladder, and
      it names no rungs for reducible or non-squarefree g. EXP-MCE-3ffdf9 uses exactly one alternant
      null with a random multiplier, for exactly one observable. IDEA-20260808-3d3be9 uses two nulls
      (random and alternant) for one statistic. No record anywhere uses more than two family levels,
      and no record contains a same-rung self-null for any statistic. The reducible-g and non-squarefree-g
      rungs appear nowhere in the repository, although EXP-MCE-3ffdf9''s ''graded squarefreeness ladder''
      is adjacent in name -- reading its objective, that ladder concerns the doubling identity Gamma(L,g)
      = Gamma(L,g^2) and not a family ladder for null construction, and the two must not be confused.'
    verdict: 'UNVERIFIED. Nested-family controls are ordinary experimental design and this record
      asserts nothing about how published work in this area constructs its nulls. What is claimed
      new is local: this repository''s maximum is two family levels for one statistic, no record carries
      a same-rung self-null, and the reducible-g and non-squarefree-g rungs do not appear at all.
      One near-collision must be named explicitly to avoid re-proposing in new notation: EXP-MCE-3ffdf9
      contains a ''graded squarefreeness ladder'', which is a ladder of a different kind (about a
      degree identity, not about null construction), and this proposal is not that ladder and must
      not be read as it.'
  object_first_candidate:
    tracked_object: The position of a code on an ordered family ladder, treated as an ordinal latent
      variable, and the induced statistic-by-rung separation matrix. The object followed is the pair
      (rung index, five-vector of statistic values) per code, and the deliverable functional is the
      map from statistic to the lowest rung it still separates from the top.
    lossiness: 'Lossy in two stages, both deliberate. Each code is projected to five small numbers,
      discarding everything else about it -- this is the same projection each individual statistic
      already makes, and it is lossy for the same reasons. Then the 200-by-5 tables per rung are projected
      to a matrix of AUCs, discarding the joint distribution of the five statistics and keeping only
      marginal separability. That second projection is where the ladder loses the most, and the loss
      is worth naming: a statistic pair that separates jointly while neither separates marginally
      would be invisible in this matrix. The retained part still propagates because the operation
      of interest -- moving one rung down the ladder by weakening one algebraic condition -- acts
      on each marginal statistic independently in the sense that matters, namely whether the condition
      it detects is still present.'
    propagation: 'One step of the target operation is descending the ladder by one rung, i.e. removing
      one algebraic condition: irreducible g to reducible g, squarefree to non-squarefree, Goppa to
      general alternant, alternant to unstructured. Each step should extinguish exactly those statistics
      that detect the removed condition and leave the rest unchanged. That gives a sharp, falsifiable
      prediction about the SHAPE of the matrix: it should be roughly staircase-like, with each statistic''s
      AUC collapsing at the rung where its condition disappears and staying collapsed below. A matrix
      that is not staircase-like -- a statistic that separates rung 2 but not rung 3 while rung 3
      is algebraically closer to rung 5 -- is either an artefact or a genuinely surprising non-monotonicity,
      and either reading requires replication before it is reported.'
    survival_score: 'The ladder itself survives as long as the rungs are distinguishable in principle
      at the tested (n, k), which requires enough coordinates for the algebraic conditions to have
      room: at m=4, n=16, t=2 a reducible g of degree 2 is a product of two linear factors and the
      rungs are very close together, so the ladder may be degenerate; at m=6, n=64, t=4 there is room
      for genuinely different factorisation patterns. The experiment reports, per cell, how many of
      the five rungs were actually constructible with matched k, and a cell where fewer than four
      rungs are constructible is reported as a partial ladder rather than analysed as a full one.'
  null_object_control: 'The null is built into every cell of the matrix and is what makes the matrix
    readable. SAME-RUNG SELF-NULL: for each statistic and each rung, split that rung''s 200 samples
    into two halves of 100 and compute the AUC of one half against the other. The identical statistic,
    the identical scoring code and the identical AUC routine run in the same invocation; the only
    difference is that both samples come from one population. The self-null must land in [0.42, 0.58];
    any cell whose self-null falls outside is marked VOID and its cross-rung AUC in the same row is
    not reported as a result. This is the strongest available check that a separation is not manufactured
    by the pipeline, and it costs nothing beyond a split. A second control is the BOTTOM-RUNG anchor:
    rung 1 versus rung 1 across two independent sampler implementations, which additionally checks
    that the random sampler itself is stable -- the concern proposal 10 of this set is devoted to.'
  discriminated_from:
  - 'RQ-MCE-b38a8b''s structural feature panel with honest-versus-honest null cohorts: a panel of
    features against one null level. This is a matrix of features against five ordered family levels
    with a self-null in every cell, and it names two rungs (reducible g, non-squarefree g) that appear
    nowhere in the repository.'
  - 'EXP-MCE-3ffdf9''s ''graded squarefreeness ladder'': named similarly and entirely different --
    that ladder concerns the degree identity Gamma(L,g) = Gamma(L,g^2), not null construction. Naming
    this collision explicitly is required so that this proposal is not read as a renotation of that
    one.'
  - 'IDEA-20260808-3d3be9: two nulls (random and alternant) for one statistic on real keys. This is
    five rungs, five statistics, and a self-null per cell, on toy fixtures.'
  - 'Proposal 3 of this set: one statistic, two arms, full ROC. This proposal subsumes that arm''s
    design into one row of a larger matrix and adds the rungs that decide WHAT the statistic is seeing.'
  - 'Proposal 7 of this set: a trajectory statistic under an operation, not a family ladder; the two
    are orthogonal and could be combined later but are not the same object.'
  assumptions:
  - The certified fixture from proposal 1 exists, and the samplers for rungs 2 through 5 can all be
    built on its primitives.
  - All five rungs can be generated at matched (n, k) by resampling; if a rung cannot match, the cell
    is reported as a partial ladder rather than compared at unmatched dimension.
  - 200 samples per rung give enough resolution to distinguish AUC 0.9 from 0.6 at the reported confidence;
    a power calculation is part of the contract.
  - Reducible and non-squarefree g still yield codes with the expected dimension often enough to sample
    efficiently; if not, the resample rate is reported and the rung may be declared unconstructible
    at that cell.
  - Marginal separability is the right first question; joint separability across statistic pairs is
    explicitly out of scope here and is named as the main thing this projection loses.
  predictions:
  - metric: same-rung self-null AUC in every reported cell of the matrix
    direction: different
    minimum_effect: 'forced value: within [0.42, 0.58]. Any cell outside is marked void and its cross-rung
      entry is not reported.'
  - metric: number of statistics whose AUC against rung 2 (random alternant) is below 0.6 while their
      AUC against rung 1 (random binary) exceeds 0.9
    direction: higher
    minimum_effect: 1
  - metric: monotonicity violations in the matrix (a statistic separating a more distant rung better
      than a closer one)
    direction: lower
    minimum_effect: 1
  - metric: AUC of the square-code defect separating honest Goppa (rung 5) from Goppa with non-squarefree
      g (rung 4)
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: this is exactly the number the ladder exists
      to produce, and it bears on the doubling identity that EXP-MCE-3ffdf9 would test independently.
      Pre-committing it would be asserting the outcome of a separate open contract.'
  minimal_test:
    design: 'One cell and three rungs establish whether the ladder is constructible and whether the
      matrix is readable. Take m=6, t=4, n=64, where there is the most room for distinct factorisation
      patterns. Generate 200 codes each at rung 1 (random binary), rung 2 (random alternant) and rung
      5 (honest Goppa), all resampled to matched k. Compute two statistics on all 600 codes: the square-code
      defect and the hull dimension. Compute AUC(5 vs 1) and AUC(5 vs 2) for both, and the same-rung
      self-null for all three rungs and both statistics -- six self-nulls. If any self-null falls
      outside [0.42, 0.58], stop: the pipeline manufactures separation and no larger matrix would
      mean anything. If the self-nulls pass and AUC(5 vs 2) is near 0.5 while AUC(5 vs 1) is high,
      the ladder has already delivered its central lesson at a cost of minutes, namely that the statistic
      sees alternant structure and not the Goppa specialisation. Only then are rungs 3 and 4 and the
      remaining three statistics worth building.'
    controls:
    - Same-rung self-null in every cell, by splitting one rung's samples in half.
    - 'Bottom-rung anchor: rung 1 against rung 1 across two independent random-code sampler implementations.'
    - Matched-(n,k) enforcement across all rungs by resampling, with the resample rate reported per
      rung.
    - 'Invariance control: each statistic recomputed after a random invertible row operation and column
      permutation, required unchanged.'
    - 'Rung-constructibility audit: the count of rungs actually constructible at matched k, per cell,
      reported before any AUC is read.'
    required_metrics:
    - raw 200-by-5 statistic table per rung per cell
    - AUC and equal-error rate per (statistic, rung) cell
    - same-rung self-null AUC per (statistic, rung)
    - lowest rung separated per statistic
    - monotonicity violation count
    - resample rate and realised k per rung
    - count of void cells
  falsification_conditions:
  - Any same-rung self-null outside [0.42, 0.58] voids that cell and, if widespread, voids the matrix.
  - Any statistic changing under a random row operation or column permutation falsifies its implementation.
  - Fewer than four constructible rungs at matched k in a cell makes that cell a partial ladder and
    forbids reading it as a full one.
  - A monotonicity violation that replicates across seeds is either a real non-monotonicity or a sampler
    defect, and it must be resolved before any row of the matrix is reported.
  - All five statistics separating every rung equally well indicates the rungs are not actually different
    at that (n,k) and the ladder is degenerate there.
  confounders:
  - At small (n, t) the rungs are algebraically very close -- a reducible degree-2 g is a product
    of two linear factors -- so a null result may reflect rung proximity rather than statistic blindness.
  - The high-rate confound present in every toy cell in this bucket is present in every cell of this
    matrix and is not repaired by adding rungs.
  - Matching on (n,k) by resampling changes each rung's effective ensemble, more so for the rungs
    that match least readily.
  - Marginal AUCs hide joint separability, so a matrix of zeros does not establish that the five statistics
    jointly see nothing.
  - 'Multiplicity: with five statistics and four cross-rung comparisons per cell there are twenty
    tests per cell, and any headline finding must survive an explicit multiplicity correction that
    is declared in advance.'
  interpretation_limits:
  - The matrix characterises THIS program's implementations of five statistics on locally generated
    toy codes; it says nothing about any published distinguisher.
  - Every entry is conditional on the (n, k) cell and the rungs' constructibility there; no pooling
    across cells is permitted.
  - A statistic that stops separating at rung 2 is measuring alternant structure, which is a fact
    about the statistic and not about binary Goppa codes.
  - Nothing in the matrix bears on any deployed parameter set, and no entry may be quoted as a distinguisher
    against one.
  target_complexity:
    time_exponent: No attack exponent is claimed. All five statistics are polynomial and cheap at
      these sizes; no adversary is constructed and no problem is solved.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one code's pairwise-product
      matrix, at most 820 rows of 64 bits, plus the raw statistic tables.
    best_known: 'There is no incumbent within this repository: the maximum family depth used anywhere
      is two levels, for one statistic, and no self-null exists for any statistic. Outside it, this
      record asserts nothing about how published work constructs nulls.'
    hidden_overhead: 'Hidden in the matching: resampling to enforce matched (n, k) across five rungs
      distorts the rungs unevenly, and the resample rate is the honest measure of that distortion.
      Hidden in the multiplicity: twenty comparisons per cell make a spurious headline nearly certain
      without a declared correction, which is why the correction is frozen in advance rather than
      chosen after seeing the matrix.'
  dominated_by: 'n/a (no result claimed). Pareto check applies vacuously: no adversary is constructed
    and no cost figure for any attack is produced, so no frontier row is occupied. As an experimental
    design the ladder is dominated by the same design run at larger n, which this environment cannot
    reach.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: maximum family
    depth in this repository goes from two levels for one statistic to five ordered rungs for five
    statistics, with a same-rung self-null in every one of up to twenty-five cells per (n,k) cell
    and an explicit void marking for any cell that fails it.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: P(all five rungs are constructible at matched k at the largest cell) =
    0.6; the non-squarefree and reducible rungs are the ones most likely to resist matching. P(every
    reported same-rung self-null lands in [0.42, 0.58]) = 0.8; this is largely a test of the AUC implementation
    and the sampler. P(at least one statistic separates rung 5 from rung 1 with AUC >= 0.9 but fails
    against rung 2 with AUC <= 0.6, i.e. the central predicted lesson) = 0.65. P(the matrix is staircase-monotone
    with no replicating violations) = 0.5, and a replicating violation would be the most interesting
    single outcome available. P(the rungs are degenerate at the smallest cells and the ladder is only
    usable at m=6) = 0.6, which is a cost this design accepts in exchange for the rungs existing at
    all.
