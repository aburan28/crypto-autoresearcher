      verified_by: null

  assumptions:
    - >-
      The estimator's per-module conventions are readable from source at the
      pinned commit. If they are not - if a module's success semantics are
      implicit - the audit records "undeclared" as the finding rather than
      guessing.
    - >-
      EV-MLKEM-020's figures are taken as given and are not recomputed. This
      record changes only how they are READ, so any movement it reports is
      attributable to a convention and to nothing else.
    - >-
      Advantage losses compose multiplicatively along a chain of reductions and
      sample requirements compose through the consuming link. Both are standard
      and both are checked by NULL-TIGHT and NULL-INF respectively.
    - >-
      The FO link is out of scope and its absence is declared. A composed
      "total" that omits it is a partial ledger and must be labelled partial
      everywhere it appears.
    - >-
      Where a reduction exists only for LWE, the ledger records "no MLWE link"
      rather than substituting the LWE statement. Silent substitution is exactly
      the failure this record exists to detect.

  predictions:
    - metric: >-
        number of attack modules quoted in this lane whose success-probability
        convention differs from primal_bdd's, out of the modules in
        EV-MLKEM-020's eighteen cells plus dual_hybrid
      direction: higher
      minimum_effect: >-
        1 is decisive for leg one - a single mixed-convention comparison makes
        the lane's cross-attack rankings unsafe. 0 closes leg one positively and
        is a clean, citable negative.
    - metric: >-
        movement in the committed margin at ML-KEM-1024 when the figure is
        re-quoted under convention C2 at epsilon = 2^-32
      direction: higher
      minimum_effect: >-
        The direction is FORCED (C2 can only raise an attack cost), so only the
        magnitude is informative. It is decision-relevant if it exceeds
        1.276377 bits, which for any epsilon below 1/2 it does by construction -
        stating this in advance so it cannot later be reported as a discovery.
    - metric: >-
        sample deficit ratio, defined as samples required by the cheapest
        instantiable search-to-decision reduction divided by m = 256k, per
        parameter set
      direction: higher
      minimum_effect: >-
        1.0 is the threshold. A ratio at or below 1 makes the link instantiable
        and closes leg two positively; a ratio above 1 makes it non-instantiable
        and the size of the ratio is the finding.
    - metric: >-
        number of links in the composed chain marked non-instantiable at
        m = 256k
      direction: higher
      minimum_effect: >-
        1. Even one non-instantiable link means the chain from IND-CCA to the
        priced attack does not close at FIPS 203's sample count, which every
        record in this lane would then have to state.

  minimal_test:
    design: >-
      TWO READING TASKS AND ONE SPREADSHEET, NO COMPUTE. Task 1 (hours): read
      the pinned estimator's attack modules and fill the one-row-per-module
      convention table; this alone decides leg one and needs no external
      literature. Task 2 (days, and it is the one that can be blocked): retrieve
      the search-to-decision reduction statements, instantiate each at ML-KEM's
      exact parameters, and fill the sample column. Task 3 (minutes): compose
      the ledger and re-quote EV-MLKEM-020's triple under C1, C2 and C3 at a
      declared epsilon grid. THE CHEAPEST VALID DISCRIMINATOR IS TASK 1: it is
      entirely internal, cannot be blocked by the network policy that makes
      primary NIST text unreadable, and it either finds a mixed convention -
      which invalidates cross-attack comparisons in eighteen committed cells -
      or closes leg one with a number.
    controls:
      - NULL-ID, the identity-chain null - must reproduce the committed triple and margins exactly.
      - NULL-EPS, the epsilon-equals-one null - C2 must coincide with C1.
      - NULL-TIGHT, the all-tight-links null - composed loss must be zero bits.
      - NULL-INF, the infeasible-link null - a synthetic 2^40-sample link must be marked non-instantiable, not absorbed.
      - NULL-DUAL, the known-case classifier control on the enumeration-costed figures.
    required_metrics:
      - per-module convention table with source line references at the pinned commit
      - re-quoted margins under C1, C2, C3 across a declared epsilon grid, per parameter set
      - induced movement in c* per convention, using EV-MLKEM-020's own sensitivity
      - sample requirement and advantage loss per enumerated reduction, instantiated at ML-KEM parameters
      - sample deficit ratio against m = 256k per parameter set
      - count and identity of non-instantiable links in the composed chain

  falsification_conditions:
    - >-
      If every attack module in the lane reports under the same convention, leg
      one is REFUTED and the lane's cross-attack comparisons are vindicated with
      a number. That is a clean negative and is worth the reading on its own.
    - >-
      If a sample-preserving search-to-decision reduction applies at ML-KEM's
      exact parameters with a stated and modest advantage loss, leg two is
      REFUTED, the chain closes at m = 256k, and this program can for the first
      time say what its search-attack figures imply about the assumed decision
      problem.
    - >-
      If the estimator's conventions cannot be determined from source at all,
      the record returns "undeclared" as its finding and makes no comparison -
      an instrument-opacity result, not a mathematical one, and it must not be
      dressed as the latter.
    - >-
      If the ledger arithmetic fails NULL-ID or NULL-TIGHT, nothing is reported
      and the batch returns a harness failure.

  confounders:
    - >-
      SCOPE CREEP INTO THE FO FLANK. The correctness-error term is
      IDEA-20260828-5b7795's object; importing it here would double-count it in
      any composed total. The ledger must leave that cell empty and labelled.
    - >-
      ASYMPTOTIC CONSTANTS. Reduction theorems suppress constants that the
      ledger needs. A suppressed constant read as 1 is an optimistic assumption
      on the DEFENDER's side here, and every such reading must be flagged in the
      same list as the optimistic assumptions of a cost table.
    - >-
      CLASSICAL VERSUS QUANTUM REDUCTIONS. Some links in the standard chain are
      quantum (the worst-case-to-average-case step); mixing a quantum link into
      a classical ledger changes what the total means. The ledger carries a
      classical/quantum tag per link or it is uninterpretable.
    - >-
      The convention question and the dual-attack probability dispute
      (KN-OPEN-016) can be confused, because both concern epsilon. They are
      independent: one is about how a correct epsilon is charged, the other
      about whether the epsilon is correct. Conflating them would let a repaired
      dual analysis appear to settle leg one, which it would not.
    - >-
      A ratio above 1 in leg two does not mean decision-MLWE is easy. It means
      the bridge this program implicitly uses is not available, which is a
      statement about the argument, not about the problem.

  interpretation_limits:
    - >-
      This is an audit of a CONVERSION, not of ML-KEM. Neither leg can make
      ML-KEM more or less secure; both change what the lane's numbers MEAN.
    - >-
      Claim tier: derivation and literature. No empirical claim is made, no run
      is required, and the record must not be cited as evidence about attack
      costs.
    - >-
      Primary FIPS 203 and NIST text remain unread by this program, so the
      category-level implications of any convention change are conditional on
      EV-MLKEM-020's H11 exactly as every other margin statement in the lane is.
    - >-
      A partial ledger with the FO cell empty is not a security bound and must
      never be quoted as one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed algorithm A against a fixed instance distribution, the
        expected cost of amplifying advantage epsilon to advantage close to 1 by
        independent repetition is Theta(T/epsilon) when A's output is verifiable
        in time o(T/epsilon), and Theta(T/epsilon^2) when it is not, uniformly
        over epsilon in (2^-lambda, 1/2) for the lambda of interest.
      rigorous_support: >-
        The verifiable case is rigorous by the standard geometric argument -
        repeat until success, verify each output - and is the case that applies
        to SEARCH attacks on ML-KEM, where a candidate secret is checked in one
        keygen. The unverifiable case is the Chernoff/majority-vote bound and
        applies to DISTINGUISHING attacks, where no cheap verification exists.
        The imitated classical statement is the standard bit-security definition
        of Micciancio-Walter, which this record does not claim to have read. The
        heuristic content is that ML-KEM's attack families fall cleanly into
        these two cases; the dual attack is exactly the family where that is
        contested (KN-OPEN-016), and the record flags it rather than assuming
        it.
      validation_plan: >-
        Sample at toy scale where the whole distribution is enumerable: at
        d in {40, 50, 60} on ML-KEM-shaped q-ary instances, run a deliberately
        under-powered attack at blocksizes yielding measured success
        probabilities in {2^-1, 2^-3, 2^-6}, with 10^3 independent instances per
        cell, and fit expected cost against 1/epsilon and against 1/epsilon^2.
        Compare against the two predicted laws by likelihood ratio. Tail check:
        at epsilon close to 1 both laws must collapse to T and the fit must pass
        through the measured single-shot cost. All cells use a CONTENT-PINNED
        BKZ strategies file with its hash recorded, since this program measured
        a path-pinned file silently changing a d=64 reduction from 9 tours to
        26; no cell reports or depends on a tour count, since this program
        measured that tour count to completion is not derivable from what the
        instrument records. Transfer assumption, explicit: a law fitted at
        d <= 60 is transferred to FIPS 203 dimensions by assumption only.
    - id: H2
      statement: >-
        The sample requirement of a search-to-decision reduction, instantiated
        at fixed (n, q, error law), is a deterministic function of the
        reduction's stated parameters alone and does not depend on the instance;
        so the deficit ratio is a single number per (reduction, parameter set)
        rather than a distribution.
      rigorous_support: >-
        Rigorous whenever the reduction's sample count is stated as a formula in
        (n, q, epsilon, delta), which is the normal form for these theorems. NOT
        rigorous for reductions whose sample count is stated only asymptotically
        with suppressed constants, where the instantiation requires a choice and
        the ledger must record the choice as an assumption rather than as a
        derivation.
      validation_plan: >-
        No sampling is possible or needed - this is a reading task. The
        validation is REDERIVATION: two independent readers instantiate the same
        reduction at the same parameters from the same source text without
        seeing each other's arithmetic, and the two sample counts must agree.
        Disagreement localises to a suppressed constant and is itself the
        finding. Tail check: instantiating at q = 2 and n = 1 must return the
        degenerate sample count the theorem's own statement gives.

  target_complexity:
    time_exponent: >-
      No attack is proposed and no attack exponent is claimed. The quantity this
      record moves is the EXPONENT OF THE REPORTED SECURITY, not of any
      algorithm: under convention C2 at declared epsilon, the committed
      140.1994731076207 / 200.9587149140538 / 270.7236234535225 become those
      values plus log2(1/epsilon), and under a non-instantiable search-to-
      decision link they cease to bound the assumed problem's hardness at all,
      in which case the honest report is an interval and not an exponent.
    memory_exponent: >-
      Unchanged from EV-MLKEM-020's model on the attack side (2^{0.2075 n + o(n)}
      with the o(n) recorded there as unbounded). This record adds no memory
      claim. Sample count is treated as a THIRD axis, m = 256k = 512 / 768 /
      1024, and the lane has never carried it.
    best_known: >-
      MODEL-RELATIVE AND THE LABEL IS THE POINT. The best-known statement in
      this program is EV-MLKEM-020's primal_bdd under RC.MATZOV, quoted in an
      undeclared convention for a SEARCH problem, compared against cutoffs the
      same record marks UNVERIFIABLE, and never connected by any reduction to
      the DECISION problem the scheme's argument concerns. Every clause of that
      sentence is a defect this record measures rather than repairs.
    hidden_overhead: >-
      On this record's own side: suppressed constants in reduction theorems, any
      link that exists only for LWE, and the deliberately empty FO cell. On the
      inherited side: RC.MATZOV's rop unit purpose never stated (H6), cutoffs
      unverifiable (H11), and the sieve's unbounded o(n). None of these is
      repaired here and all are carried forward explicitly.
    tradeoff_note: >-
      There is a genuine three-way tradeoff the lane has never drawn: TIME
      against ADVANTAGE against SAMPLES. An attacker with fewer than m samples
      can trade samples for time; an attacker accepting smaller advantage trades
      advantage for time; and the security claim is a statement about the whole
      surface, not about one corner of it. The deliverable of Stage 4 is the
      first sketch of that surface for ML-KEM in this program.

  dominated_by: >-
    n/a (no attack, algorithm, or complexity result is claimed). Pareto check
    performed against every row this program holds on the relevant frontier:
