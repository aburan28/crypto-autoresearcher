  sota_delta: >-
    Zero attack improvement, stated in advance and unconditionally. The
    quantitative delta this record can produce is a movement in how the
    committed margins 2.800527 / 6.041285 / 1.276377 bits are read: under C2 at
    epsilon = 2^-32 they move by +32 bits in ML-KEM's favour, and under a
    non-instantiable search-to-decision link they stop being statements about
    the assumed problem at all. Decision-relevance is fixed by EV-MLKEM-020's
    own sensitivity coefficients 0.0113 / 0.0076 / 0.0055 per bit on c*.
    If both legs close negatively the honest delta is zero and the lane gains a
    validated reading convention, which is worth exactly what it is worth.

