idea:
  id: IDEA-20260906-ada5d9
  question_id: RQ-MLKEM-003
  added: '2026-09-06'
  title: >-
    Every ML-KEM security number this program holds is a TIME-TO-SOLVE for a
    SEARCH problem, while the property ML-KEM's security argument actually
    concerns is an ADVANTAGE against a DECISION problem at a fixed sample count
    of m = 256k. Two undeclared conventions sit between them - the
    advantage-to-cost convention, and the sample cost of the only known
    search-to-decision reduction at ML-KEM's exact parameters - and either can
    move the reported margin by more than the entire committed margin of
    2.800527 / 6.041285 / 1.276377 bits. Track the CONVERSION LEDGER as the
    object and compute both, at zero compute
  class: control

  claim: >-
    (A) THE GAP, IN ONE SENTENCE. EV-MLKEM-020 commits 140.1994731076207 /
    200.9587149140538 / 270.7236234535225 log2 rop as ML-KEM's security under
    RC.MATZOV primal_bdd. That quantity is "expected operations for an algorithm
    to RECOVER the secret with success probability treated as one". The quantity
    a security claim about a KEM is made of is "the maximum ADVANTAGE any
    adversary running in time T achieves at DISTINGUISHING". Nothing in this
    program's 33 RQ-MLKEM-003 proposals or 42 RQ-MLKEM-001 proposals converts
    one into the other, and the conversion is not free.
    (B) LEG ONE, THE ADVANTAGE CONVENTION, AND WHY IT IS NOT PEDANTRY. Three
    conventions are in live use in the lattice literature and they disagree by
    tens of bits at a fixed algorithm. (C1) COST = T, at success probability
    treated as one: the core-SVP convention and the convention EV-MLKEM-020's
    figures live in. (C2) COST = T/epsilon, the classical bit-security
    convention that charges an adversary with advantage epsilon the cost of
    repeating until advantage one. (C3) COST = T at a declared epsilon, with the
    epsilon reported alongside and no normalisation. The committed margins in
    this lane are 2.800527 / 6.041285 / 1.276377 bits; the difference between
    C1 and C2 for an attack quoted at epsilon = 2^-32 is 32 bits, an order of
    magnitude larger than every margin in the lane. THE CLAIM: this program has
    never declared which convention its committed figures live in, the
    lattice-estimator's own attack modules do not all use the same one, and at
    least one attack family this lane compares against primal_bdd is naturally
    quoted in a different convention from primal_bdd itself. If true, the lane's
    cross-attack comparisons are convention-mixed, and the fix is a declaration
    plus a re-quoting, not a new measurement.
    (C) LEG TWO, THE SAMPLE DEFICIT, WHICH IS A FORCED VALUE. ML-KEM's IND-CPA
    argument concerns DECISION MLWE; the primal attack this lane prices solves
    SEARCH MLWE. The textbook bridge is a search-to-decision reduction, and
    every such reduction has a SAMPLE COST: the classical coordinate-by-
    coordinate reduction consumes fresh samples per candidate value per
    coordinate, and the sample-preserving variants that exist for small
    parameters have their own explicit sample and advantage losses. ML-KEM
    supplies EXACTLY m = 256k samples - 512, 768 or 1024 - and no more, because
    A is fixed by rho and fresh samples cannot be manufactured without inflating
    the noise. So there is a single number per parameter set: SAMPLES REQUIRED
    BY THE CHEAPEST INSTANTIABLE REDUCTION, DIVIDED BY 256k. The claim is that
    this ratio is either (i) at most 1, in which case the reduction is
    instantiable, costing search bounds the hardness of decision with a stated
    advantage loss, and this lane's practice is justified with a number for the
    first time; or (ii) far above 1, in which case the practice of quoting
    search-attack costs as the security level of a scheme whose argument needs
    decision is a CONVENTION, not a theorem, and every number in this lane must
    carry that label.
    (D) WHY THIS IS RQ-MLKEM-003 AND NOT PHILOSOPHY. RQ-MLKEM-003 asks how much
    of ML-KEM's claimed margin is MODEL rather than MEASUREMENT. A convention
    that is never declared is the purest possible case of model: it changes the
    reported number by tens of bits, it costs nothing to evaluate, and it has
    never been evaluated here. Both legs are decided by reading and arithmetic,
    with no lattice reduction, no estimator run, and no dimension-512
    measurement - which matters, because this program has measured that a
    d=512 / beta=55 / mpfr=100 cell ran at least 14448 s without completing.
    (E) WHAT IS NOT CLAIMED. No attack. No claim that ML-KEM's security argument
    is wrong. No claim that any reduction is impossible. No claim about the FO
    transform's correctness-error term, which is IDEA-20260828-5b7795's object
    and is deliberately excluded here. No status change to any committed record.

  mechanism: >-
    STAGE 1, THE CONVENTION AUDIT, ZERO COMPUTE. For each attack module this
    lane has ever quoted - primal_bdd, primal_usvp, dual_hybrid, and the
    enumeration-costed variants in EV-MLKEM-020's eighteen cells - read the
    estimator source at the pinned commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12 and extract, per module, (i) the
    success probability the returned cost is conditioned on, (ii) whether a
    1/epsilon repetition factor is included, and (iii) whether the returned
    quantity is a search cost or a distinguishing cost. Emit a table with one
    row per module and one column per question. THE FALSIFIER IS INTERNAL: if
    every row reports the same convention, leg one closes negatively with a
    number and the lane's comparisons are vindicated.
    STAGE 2, THE RE-QUOTING. Re-express EV-MLKEM-020's committed triple under
    each of C1, C2 and C3 at a grid of declared epsilon, and report the induced
    movement in the committed margins and in the committed critical exponent
    c* = 0.03164649 / 0.04588645 / 0.00705473. The deliverable is a signed
    table, and its rows are directly comparable with IDEA-20260829-bc9cc5's
    denominator table because both move the same three margins.
    STAGE 3, THE SAMPLE LEDGER. Enumerate the known search-to-decision
    reductions for LWE and MLWE with their exact hypotheses - modulus form,
    secret and error distribution, sample count consumed, advantage loss, and
    whether they are stated for the module setting at all. For each, instantiate
    at ML-KEM's exact (n = 256, k in {2,3,4}, q = 3329, eta1, eta2, m = 256k)
    and compute the samples required. Report the ratio to 256k per reduction per
    parameter set. Where a reduction is stated only for LWE, record explicitly
    whether the module-to-LWE step is available at these parameters and DEFER
    the noise-budget half of that question to IDEA-20260821-003cb0, which owns
    it.
    STAGE 4, THE COMPOSED STATEMENT. Write the security argument as an explicit
    chain with one line per link, each carrying its advantage loss and its
    sample cost, from "IND-CCA advantage of a t-time adversary" down to "cost of
    the cheapest priced attack". Mark every link that is NOT instantiable at
    m = 256k. The output is a ledger, not a verdict: the number of
    non-instantiable links and the total advantage loss are the two figures the
    lane has never had.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX WAS UNAVAILABLE (CRYPTO_KB_QDRANT_URL is
      ':memory:'; search_knowledge errors rather than returning results), so THE
      SEMANTIC NOVELTY SCREEN COULD NOT BE RUN and no citation carries `kb`
      provenance. Substitute screen, all this session: read the full 90-row
      inventory of proposals bound to RQ-MLKEM-001/002/003; read RQ-MLKEM-001
      and RQ-MLKEM-003 in full; read KN-OPEN-016 and KN-OPEN-026 in full; read
      IDEA-20260829-bc9cc5 in full; read IDEA-20260828-5b7795 lines 1-45,
      IDEA-20260829-cca84c lines 1-45, IDEA-20260814-10e5e1 lines 1-70,
      IDEA-20260805-690de8 lines 1-60; read EV-MLKEM-020 lines 440-519 plus a
      targeted grep; enumerated all 32 H-MLKEM hypotheses and all 34 staged
      EXP-MLKEM specifications by id, question_id and title.
      Greps: `QROM|tightness|search-to-decision|search to decision|
      decision-MLWE|decisional` over ledger/proposals, case-insensitive - 40+
      files, of which the ML-KEM ones are IDEA-20260828-5b7795 (FO transform,
      QROM, correctness error) and IDEA-20260828-faca4f (Arora-Ge); the rest are
      ECDLP-lane records. `2026/366|2026/279` over knowledge/.
      Web: three WebSearch queries this session; NO WebFetch for this record and
      no primary proof text read.
    results: >-
      Leg two is absent from the repository entirely: no ML-KEM proposal
      mentions a search-to-decision reduction, a sample count as a reduction
      cost, or the fact that m is capped at 256k. Leg one is absent as a
      declared object; the nearest thing is EV-MLKEM-020's H12 scope line ("no
      best-attack claim") and KN-OPEN-016's record that the dual-attack family's
      success-probability model is contested - which is a statement that one
      family's epsilon is WRONG, not that the lane mixes conventions across
      families.
      The three nearest records. IDEA-20260828-5b7795 opens the FO flank and
      sizes the CORRECTNESS-ERROR term delta_1 against the smallest committed
      margin; it stops at the FO transform and never reaches the MLWE links,
      which are this record's whole subject. IDEA-20260821-003cb0 prices the
      MLWE-to-RLWE reduction as a NOISE budget of log2(q/sigma) = 11.70 / 11.41
      bits; that is a different link, a different resource (noise, not samples
      or advantage), and this record explicitly defers to it rather than
      re-deriving it. IDEA-20260829-cca84c varies the INSTRUMENT (version and
      cost-model name) at a fixed attack and measures dispersion; this record
      holds the instrument fixed and varies the CONVENTION the output is read
      in, which cca84c's design cannot see because every estimator version
      reports in whatever convention it uses.
    verdict: >-
      UNVERIFIED. The reduction literature was not retrieved, no proof text was
      read, and the estimator source has not been inspected. Claimed new
      RELATIVE TO THIS REPOSITORY: (i) the advantage convention as a declared,
      auditable property of each quoted figure, (ii) the sample deficit of the
      search-to-decision link as a forced value at ML-KEM's exact m = 256k, and
      (iii) the composed ledger with non-instantiable links marked. Assembled
      from known parts: bit-security conventions are standard, and the sample
      cost of search-to-decision reductions is standard textbook material - what
      is absent is anyone in this program having evaluated either at FIPS 203
      parameters.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: the sieve cost constants and their
      calibration (IDEA-20260807-8fbc86, -20260805-f7c912, -fc6361); sieve
      memory and access pricing (IDEA-20260816-70e41d, -7bc28c,
      IDEA-20260821-46c09f); dual-attack score geometry and its probability
      model (IDEA-20260805-5a4409, -a102ec, -bb7668, IDEA-20260808-0eb075,
      IDEA-20260816-ba5bd8, -725f05, IDEA-20260901-2f778b, KN-OPEN-016); the
      module-structure discount (IDEA-20260816-b824af, -f4ce0b, -fdc8e8,
      -bd7f26); dimensions for free (IDEA-20260821-374af4); the oracle-call
      schedule (IDEA-20260821-41cd67); the reference computation
      (IDEA-20260829-bc9cc5); the FO correctness-error term
      (IDEA-20260828-5b7795); the quantum resource triple
      (IDEA-20260821-472aa2).
    tracked_object: >-
      THE CONVERSION LEDGER - the ordered list of links between "the number this
      program computes" and "the property ML-KEM's security argument concerns",
      with each link carrying exactly two coordinates: an ADVANTAGE LOSS (a
      multiplicative factor or an exponent) and a SAMPLE COST (an integer, to be
      compared with 256k). The object is the LEDGER, not any one link, because
      the failure mode is that each link looks harmless in isolation and the
      composition is never written down.
    lossiness: >-
      LOSSY, and the discard is the point. The underlying state is the whole
      security argument - definitions, games, oracles, hybrid arguments,
      distributions, the FO transform's simulation, the lattice geometry. The
      projection retains two numbers per link. It discards WHY each reduction
      works, discards the algebra, discards the games, and discards every
      lattice quantity. Two links with the same (advantage loss, sample cost)
      are the same object here even if one is a hybrid argument and the other is
      a rerandomisation. NOT A CHANGE OF COORDINATES: the pair does not
      determine the reduction, cannot reconstruct the games, and cannot even
      determine whether the reduction is classical or quantum - the map is
      grossly many-to-one.
      THE COMPATIBILITY CONDITION. The operation the object must survive is
      COMPOSITION OF REDUCTIONS, and that operation acts on exactly the retained
      coordinates and nothing else: advantage losses multiply, sample costs
      compose through the consuming link's requirement, and neither depends on
      the discarded internals. So the discarded structure is discarded
      compatibly and the retained pair propagates deterministically along the
      chain. This is the same reason a cost ledger works in
      IDEA-20260829-bc9cc5, applied to advantage rather than to gates.
    propagation: >-
      One step is one link of the chain. Deterministic and countable: given the
      pair at link i and link i+1's stated loss and requirement, the composed
      pair is determined by multiplication and by a max/sum on samples. THE
      CHEAP INTERNAL FALSIFIER: composing the empty chain must return the
      identity - advantage loss 1, sample cost 0 - and composing a chain
      consisting only of C1 must return EV-MLKEM-020's committed triple
      unchanged. If the ledger arithmetic does not reproduce the committed
      numbers on the trivial chain, no composed figure is reportable.
    survival_score: >-
      Survives the entire chain from IND-CCA down to the priced attack, at full
      FIPS 203 parameters, with no extrapolation - which is unusual in this lane
      and is the object's main advantage. It dissolves at exactly two places,
      both named: (i) where a link exists in the literature only for LWE and not
      for MLWE, so that the pair is undefined rather than large - the ledger
      must record "no link" and not silently substitute an LWE link; and (ii) at
      the boundary between a reduction's asymptotic statement and its concrete
      instantiation, where constants that are suppressed in the theorem are
      exactly what the ledger needs.

  null_object_control: >-
    NULL-ID, THE IDENTITY-CHAIN NULL. Run the ledger arithmetic on the trivial
    chain (convention C1, no reductions). It must return EV-MLKEM-020's
    committed triple and margins to all printed digits. OBJECT REMOVED: every
    link. OBJECT PRESERVED: the arithmetic. Failure here voids everything
    downstream.
    NULL-EPS, THE ZERO-EPSILON NULL. At epsilon = 1 the C2 convention must
    coincide with C1 exactly. If it does not, the re-quoting harness is wrong.
    NULL-TIGHT, THE TIGHT-CHAIN NULL, AND IT CAN FAIL. Construct an artificial
    chain of links each with advantage loss exactly 1 and sample cost exactly 0.
    The composed ledger must report a total loss of 0 bits. If it reports
    anything else, the composition rule is not multiplicative and the ledger is
    measuring an artifact of its own bookkeeping.
    NULL-INF, THE INFEASIBLE-LINK NULL. Insert a synthetic link requiring
    2^{40} samples. The ledger must mark the chain non-instantiable at
    m = 256k rather than absorbing the requirement into an advantage loss. If it
    silently converts samples into advantage, it is hiding the exact failure
    mode the record exists to expose.
    NULL-DUAL, THE CROSS-FAMILY CONTROL. Apply the Stage 1 convention audit to
    an attack module whose convention is known independently - the enumeration-
    costed primal figures, whose success probability is by construction one -
    and confirm the auditor classifies it as C1. An auditor that cannot
    correctly classify a known case cannot classify an unknown one.
    FORCED VALUES DECLARED BEFORE MEASUREMENT: (1) C2 is never cheaper than C1,
    so the advantage convention can only RAISE a quoted attack cost and only
    move margins in ML-KEM's favour - direction forced, magnitude informative;
    (2) a sample requirement below 256k is instantiable by definition and needs
    no argument; (3) the FO link's correctness-error term is excluded here by
    scope and its absence from the ledger is a declared boundary, not an
    omission.

  discriminated_from:
    - >-
      IDEA-20260828-5b7795 owns the FO flank and sizes ONE term - the worst-case
      correctness error delta_1 that generic FO theorems require against the
      average-case delta FIPS 203 reports - against the smallest committed
      margin. It stops at the FO transform by design and never touches MLWE.
      This record starts BELOW the FO transform, at the MLWE links, and its two
      legs (advantage convention, sample deficit) are absent from 5b7795
      entirely. The two compose into one chain and neither contains the other.
    - >-
      IDEA-20260821-003cb0 prices the Albrecht-Deo MLWE-to-RLWE reduction as a
      NOISE budget of log2(q/sigma) = 11.70 / 11.41 bits. Same word "reduction",
      different resource: that record spends noise, this one spends samples and
      advantage, and this record explicitly defers the noise half of the
      module-to-ring link to it rather than re-deriving it.
    - >-
      IDEA-20260829-cca84c holds the attack fixed and varies the instrument
      version and cost-model name, measuring dispersion. Its design cannot see a
      convention question, because every estimator version reports in whatever
      convention it internally uses and the dispersion measurement never asks
      what that is. This record holds the instrument fixed and varies the
      reading.
    - >-
      KN-OPEN-016 records that the dual-attack family's SUCCESS PROBABILITY
      MODEL is contested (Ducas-Pulles against Guo-Johansson and MATZOV). That
      is a claim that one family's epsilon is wrong. This record's leg one is a
      claim that the lane compares figures quoted under DIFFERENT conventions
      for epsilon, which would remain true even if every family's epsilon were
      correct.

  citations:
    - ref: EV-MLKEM-020 (committed evidence record, this repository)
      provenance: internal
      claim: >-
        Committed figures 140.1994731076207 / 200.9587149140538 /
        270.7236234535225 log2 rop, margins +2.800527 / +6.041285 / +1.276377
        bits, c* = 0.03164649 / 0.04588645 / 0.00705473, pinned estimator commit
        3e48ef421ec256afddb3e7d2249a77eab6e9ba12, and H12's scope declaration
        "primal_bdd under RC.MATZOV; no best-attack claim" together with the
        validator finding that the `dual` module raises AttributeError at
        estimator/prob.py:213 and `primal_hybrid` raises ZeroDivisionError.
      verified_by: >-
        idea-generator, 2026-09-06: partial read of lines 440-519 plus a
        targeted grep of the whole file. Not a full-file read.
    - ref: RQ-MLKEM-003 (this repository)
      provenance: internal
      claim: >-
        Asks how much of ML-KEM's claimed margin is model rather than
