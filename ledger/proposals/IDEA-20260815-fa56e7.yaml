idea:
  id: IDEA-20260815-fa56e7
  question_id: RQ-RELN-001
  added: '2026-08-15'
  title: >-
    RELATION COLLECTION PRODUCES DUPLICATES AND THE LANE COUNTS RELATIONS
    RATHER THAN INDEPENDENT ONES: measure the rank deficit, because a
    relation that adds no rank costs the same and buys nothing
  class: control

  claim: >-
    An index calculus needs enough INDEPENDENT relations to solve the linear
    system. Collection produces relations, some of which are linearly
    dependent on ones already held. If the lane counts relations rather than
    rank, its relation-supply figure overstates progress and its stopping
    rule fires early. The deficit is measurable directly from the matrices
    already produced.

  mechanism: >-
    Track matrix rank as relations accumulate. Report relations collected
    against rank achieved, and the marginal rank contribution per relation
    as collection proceeds. Compare against a random-matrix baseline where
    the deficit is predictable.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-RELN-001; grep 'rank', 'independent relations',
      'duplicate relation'.
    results: >-
      Relation counts appear throughout the lane; no record measures rank
      against relation count or the marginal contribution curve.
    verdict: >-
      ADAPTATION. Rank versus count is elementary linear algebra; the
      contribution is measuring the lane's actual deficit rather than
      assuming relations are independent.

  object_first_candidate:
    tracked_object: >-
      MATRIX RANK as a function of relations collected, replacing the
      relation count as the progress measure.
    lossiness: >-
      Counting relations projects away their dependence, which is exactly
      the quantity that determines whether the system is solvable.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives wherever relation matrices are retained or regenerable,
      which is the same precondition as the sparse-solver measurement in
      this series.

  null_object_control: >-
    NULL 1 -- random sparse vectors of matched density, whose rank deficit
    follows a predictable law and calibrates the measurement. NULL 2 --
    deliberately duplicated relations, where rank must not increase; a
    measurement that shows rank growth there is wrong.

  discriminated_from:
    - >-
        The charged-cost-per-relation record in this series, which charges
        failed attempts; this charges accepted-but-dependent relations,
        which is a different waste and should be combined with it for a
        true cost per unit rank.
    - >-
        The sparse-solver measurement in this series, which costs solving
        the matrix; this concerns whether the matrix has the rank to be
        worth solving.

  assumptions:
    - >-
        Relation matrices are retained or regenerable from the lane's
        runs.
    - >-
        Rank computation is feasible at the matrix sizes involved, which
        at toy scale it is.

  predictions:
    - metric: >-
        duplicated-relation null
      direction: different
      minimum_effect: >-
        FORCED no rank increase; growth there means the rank computation
        is wrong.
    - metric: >-
        random-sparse baseline deficit
      direction: different
      minimum_effect: >-
        Calibrates the measurement against a predictable law.
    - metric: >-
        rank against relations collected on real runs
      direction: lower
      minimum_effect: >-
        The measurement; a large deficit means the lane's supply figure
        overstates progress.
    - metric: >-
        marginal rank per relation as collection proceeds
      direction: lower
      minimum_effect: >-
        Predicted to fall; where it approaches zero is the real stopping
        point, which a relation count cannot see.

  minimal_test:
    design: >-
      Re-analysis of retained relation matrices from the lane's existing
      runs, both nulls.
    controls:
      - >-
          Duplicated-relation null.
      - >-
          Random-sparse matched-density baseline.
      - >-
          Rank computed exactly over the relevant field, not estimated.
      - >-
          Marginal contribution curve reported, not just the final rank.
    required_metrics:
      - >-
          Rank against relation count per run.
      - >-
          Marginal rank per relation curve.
      - >-
          Deficit against the random-sparse baseline.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The duplicated-relation null shows rank growth. Rank computation
        wrong.
    - >-
        Rank tracks relation count closely. Relations are effectively
        independent and the lane's supply figure is sound, which is worth
        establishing.
    - >-
        A large deficit appears. The lane's supply figure overstates
        progress and its stopping rule needs restating in rank rather than
        count, which is directly actionable.
    - >-
        Marginal contribution approaches zero well before the target rank.
        Collection saturates and no amount of further collection completes
        the system, which would be an exponent-relevant structural
        finding.

  confounders:
    - >-
        FIELD CHOICE: rank depends on the field the system is solved over,
        and computing it over the wrong one gives a meaningless deficit.
    - >-
        SMALL-MATRIX EFFECTS: at toy sizes the deficit is dominated by the
        first few relations and the marginal curve is noisy, so the trend
        needs enough relations to be visible.

  interpretation_limits:
    - >-
        Measures a progress metric; produces no cost model and no
        exponent.
    - >-
        Scoped to the lane's existing runs and their matrix sizes.
    - >-
        A saturation finding at toy scale does not transfer without the
        trend supporting it.

  heuristic_assumptions:
    - id: HEUR-RELN-RANK-1
      statement: >-
        Relations produced by the lane's collection procedure are
        linearly independent with the probability a random sparse vector
        would be.
      rigorous_support: >-
        Rigorous ingredient: for random sparse vectors over a finite
        field the rank deficit follows a computable law, giving a
        precise baseline. THE GAP: relations come from decompositions
        over a fixed factor base, so they live in a structured subspace
        and repeated decompositions of related targets can produce
        genuinely dependent relations at a much higher rate than random
        -- which is exactly the failure the measurement is looking for.
      falsification_condition: >-
        A rank deficit materially exceeding the random-sparse baseline
        at matched density.
      validation_plan: >-
        SAMPLE: every retained relation matrix, with rank tracked
        incrementally. COMPARISON: deficit against the random-sparse law
        at matched size and density. TAIL CHECK: the runs with the
        largest deficit, checked for factor-base or target clustering.
        TRANSFER: none beyond the tested sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is incremental rank computation over retained
      matrices.
    memory_exponent: >-
      Matrix storage; modest at toy sizes.
    best_known: >-
      The incumbent is the lane's relation-count supply figure, which this
      replaces with a rank-based one.
    hidden_overhead: >-
      Incremental rank computation is more expensive than a single final
      rank and is what the marginal curve requires.
    tradeoff_note: >-
      Counting relations is free and overstates progress; tracking rank
      costs a little and measures what the system actually needs.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As linear algebra: entirely standard and
    dominated by the textbook treatment. As a measurement of this lane's
    supply figure: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: matrix rank tracked against
    relations collected on the lane's real runs, the marginal rank
    contribution curve that identifies the true stopping point, and a
    random-sparse baseline separating structural dependence from ordinary
    deficit.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that relation matrices are retained or regenerable, the same
    precondition as the solver record. 0.9 that the nulls behave. 0.5 that a
    material deficit appears, which would mean the lane's supply figure and
    stopping rule both need restating in rank.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
