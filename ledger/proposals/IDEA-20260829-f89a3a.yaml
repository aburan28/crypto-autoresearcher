idea:
  id: IDEA-20260829-f89a3a
  question_id: RQ-SCURVE-d9b7d2
  goal_id: GOAL-SCURVE-51437e
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    FIRE THE INSTRUMENT - implement the Smart, Satoh-Araki and Semaev additive
    transfer and SOLVE a discrete logarithm on the family's deliberately
    anomalous curve, emitting a discrete_log certificate that harness/toycurve.py
    re-verifies independently, raising the family's transfer lane from "we
    checked that a transcribed integer equals one" to "we broke the curve the
    family designates as broken"
  class: algorithm

  claim: >-
    THE CAMPAIGN'S TRANSFER LANE IS CURRENTLY A SYNTACTIC CHECK THAT HAS NEVER
    BEEN SHOWN TO FIRE. The archived audit plan's lane L6-TRANSFER flags the
    anomalous condition by testing whether a computed integer t equals one, and
    its positive control P1 asks only that the Anomalous row return t equal to
    one. IDEA-20260807-98a970 states the governing principle plainly - a
    measurement instrument never shown to fire cannot certify a negative - and a
    trace-equality test does not meet it, because an instrument hard-wired to
    return "t is not one" would pass every negative row and be undetectable from
    those rows alone.

    THIS RECORD RAISES THE BAR FROM FLAG TO SOLVE. Four parts.

    (A) FEASIBILITY, WITH AN EXPONENT. For a curve E over F_p with #E(F_p) equal
    to p, the ECDLP in E(F_p) is solvable in O(log p) field operations -
    polynomial, not p to the one half - by lifting P and Q to a curve over the
    integers modulo p squared, multiplying each by p to land in the kernel of
    reduction, and taking the ratio of their formal-group logarithms in the
    additive group of F_p, where a discrete logarithm is one modular division. On
    the family's Anomalous row, a roughly 204-bit prime per RQ-SCURVE-84a540's
    scope block, this replaces a rho cost of about 0.886 times 2^102, which is
    2^101.8 group operations and unreachable by any means, with a few hundred
    field operations, which is milliseconds.

    (B) THE ARTIFACT, WHICH IS THE POINT. The run emits a certificate of the
    discrete_log kind defined in docs/claims-and-verification.md - curve, P, Q
    and k - re-verified by independently recomputing k times P with
    harness/toycurve.py, which that module's own docstring designates as the
    independent verifier the certificate discipline relies on. A wrong k fails
    the check. This is the strongest artifact the family admits, and per the tier
    table a curve above 96 bits puts it at the crypto tier.

    (C) THE NEGATIVE CONTROL, EQUALLY THE POINT. The IDENTICAL solver, same code
    path, is run on Curve25519 and on BN(2,254). It must FAIL, and the record
    pre-registers HOW - the lift is well-defined for any curve, but when t is not
    one the point p times the lift of P is not in the kernel of reduction, the
    formal-logarithm step is inapplicable, and any k the code emits must FAIL
    certificate verification. PREDICTED zero successes in 100 attempts on each. A
    solver that succeeds on Curve25519 has a bug, not a break, and the
    certificate check makes that distinction automatic rather than a matter of
    judgement.

    (D) WHAT IT DOES NOT CLAIM. This is a reimplementation of a 1997 to 1999
    textbook result and it moves no frontier - on trace-one curves the additive
    transfer already IS the best known algorithm, so this TIES the frontier
    rather than advancing it, and it is dominated on SCOPE by rho, which applies
    to every curve whereas this applies to a measure-zero family. Its value is
    entirely as a fired instrument and a reusable certificate-producing artifact.

  mechanism: >-
    THE TRACKED OBJECT is the formal-group logarithm coordinate of a point - the
    image of a point of the kernel of reduction under the formal logarithm, read
    to first order as an element of p times the integers modulo p squared times
    the integers, identified with F_p.

    LOSSY-PROJECTION TEST, applied before any experiment; it is the crux of why
    this attack exists at all.
    WHAT IS DISCARDED - the entire group structure of E(F_p), the addition law's
    nonlinearity, both coordinates, everything except one field element. The map
    is not injective on E(F_p), because it is defined only after multiplying by
    p, which annihilates everything outside the kernel of reduction.
    IS IT A CHANGE OF COORDINATES? NO, and that is exactly what makes this an
    attack rather than a re-parameterisation. The formal logarithm is a GROUP
    HOMOMORPHISM from an elliptic addition law onto the additive group of F_p; it
    discards precisely the structure that makes the ECDLP hard. Contrast the
    archived plan's object O1, the trace, which is also lossy and also
    propagating but supports no attack, because it discards the group rather than
    mapping it somewhere easier.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Yes, and only barely, and only
    for t equal to one - the composite that sends P to p times its lift and then
    to its logarithm lands in the kernel of reduction and is additive, so scalar
    multiplication propagates deterministically to multiplication in F_p. THE
    COMPATIBILITY IS EXACTLY WHAT FAILS FOR t not equal to one, because when #E
    is not p, multiplication by p does not land in the kernel and the projection
    stops propagating. KN-TECH-033 states this as the observation that the
    attacks do not degrade gracefully as t moves away from one but simply do not
    apply. PASSES, with the sharpest survival boundary available anywhere in this
    campaign - the object survives exactly one value of the trace, and that
    boundary IS the negative control.

    WHY THIS IS NOT ALREADY DONE HERE. A grep of harness/ on 2026-08-29 for the
    terms anomalous, smart_attack, formal group, p-adic lift and hensel returns
    exactly one file, harness/run_md4_seed_sweep.py, which is unrelated. The
    program holds KN-TECH-033 as a described technique at confidence
    `established` with an explicit "Verified vs reported" note that none of its
    three source papers was read in full; it holds no implementation, no run and
    no certificate. The technique is therefore asserted, not exercised, and every
    negative transfer verdict in the twenty-goal family currently rests on an
    instrument that has never produced a positive.

    EXECUTION, FOUR RUNGS OF THE VALIDATION LADDER OF
    docs/inventor-protocol.md SECTION 6, smallest first.
    RUNG 1, CONSTRUCT TOY ANOMALOUS CURVES. Anomalous curves are not found by
    search at useful sizes; they are built by complex multiplication. For a small
    discriminant D in the class-number-one list of minus 3, minus 4, minus 7,
    minus 8, minus 11, minus 19, minus 43, minus 67 and minus 163, the Hilbert
    class polynomial is linear, so j is a known rational constant and no
    class-polynomial machinery is needed. Choose s, set 4p equal to t squared
    plus the absolute value of D times s squared with t equal to one, that is p
    equal to one plus the absolute value of D times s squared, all divided by
    four, and keep the s that make p a prime of 30, 40, 60 and 80 bits. Build the
    curve with that j over F_p and test its twists by checking that p times G is
    the identity for a random G; at most six candidates. The construction is
    self-certifying, because a curve passing that check for several independent G
    with p prime and p in the Hasse interval has #E equal to p by the same
    uniqueness argument the archived plan's lane L4 uses.
    RUNG 2, SOLVE AT TOY SIZE AND CHECK AGAINST BRUTE FORCE. At 30 bits, solve by
    the additive transfer and independently by baby-step giant-step, and require
    the two values of k to be equal. This is the only rung where an independent
    SOLVER, not merely an independent verifier, is available, and it is what
    distinguishes "the certificate checks" from "the algorithm is right".
    RUNG 3, THE REAL OBJECT. Run on the Anomalous row's roughly 204-bit
    parameters, on a self-generated instance where Q equals k times P for a k
    drawn by the harness and then discarded before the solver runs, so the solve
    is genuine, and emit the certificate.
    RUNG 4, THE NEGATIVE CONTROLS at full size on Curve25519 and BN(2,254).

  novelty_status: unverified
  novelty_rationale: >-
    The mathematics is `known` and famous - three independent constructions from
    1997 to 1999, recorded internally as KN-TECH-033 with confidence
    `established`. The label here is `unverified` because none of KN-LIT-087,
    KN-LIT-088 or KN-LIT-089 was retrieved or read in this session, and
    KN-TECH-033 itself discloses that none was read in full previously; per
    agents/idea-generator.md a proposal whose external literature is entirely
    recalled is `unverified`. NO NOVELTY IS CLAIMED FOR THE ALGORITHM. What is
    new is confined to this program - the corpus contains no implementation, no
    run and no discrete-logarithm certificate on any named curve.
  novelty_screen:
    method: >-
      Run 2026-08-29. Grep of knowledge/techniques/ for
      "Smart|Satoh-Araki|Semaev|anomalous", returning 13 files, all descriptive;
      full read of KN-TECH-033; grep of harness/ for
      "anomalous|smart_attack|formal group|p-adic lift|hensel"; grep of
      experiments/ for "anomalous|Smart attack|trace one|trace 1"; read of
      harness/toycurve.py lines 1 to 70.
    results: >-
      harness/ contains NO implementation. The twenty hits under experiments/ are
      specification and seed-register files that EXCLUDE anomalous curves as an
      instance-hygiene precondition, that is, the condition is used as a filter
      and never as a target, which is the opposite of exercising it.
      harness/toycurve.py exists and is explicitly designated as the independent
      certificate verifier, so the verification half of this proposal is already
      built. Conclusion - the attack has never been run in this program and the
      artifact it would produce does not exist.

