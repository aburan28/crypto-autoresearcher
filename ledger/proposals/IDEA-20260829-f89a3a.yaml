  assumptions:
    - >-
      Executor has a shell and Python 3 with arbitrary-precision integers. No
      Sage and no PARI. Every step above is elementary integer arithmetic, and
      the complex-multiplication constructions use only linear Hilbert class
      polynomials precisely so that no class-polynomial machinery is required.
    - >-
      The Anomalous row's parameters are re-sourced before the roughly 204-bit
      run is treated as a control for anything. Per the goal's claim boundaries
      it is a positive-control CANDIDATE, not a verified one. IMPORTANT AND
      SPECIFIC TO THIS ROW - it is a constructed illustration, not a standardised
      curve, so it may have NO primary specification at all. If none exists, the
      run is still valid as a SELF-CONTAINED solve, because the certificate
      proves that k times P equals Q on the stated curve regardless of where the
      curve came from, but the row cannot then be cited as reproducing
      SafeCurves' published example, and that distinction must be written into
      the record.
    - >-
      No live keys anywhere. Every instance is generated in-session by drawing k
      uniformly, computing Q equal to k times P, and discarding k before the
      solver starts. The scope block's prohibition on live keys and its
      restriction of targets to public named-curve parameters, generated controls
      and public certificates are respected exactly.
    - >-
      Curve25519 must be converted to short Weierstrass form, or the solver
      extended to Montgomery form, before the negative control runs. A negative
      control that fails because of a model mismatch rather than because of the
      trace would be worthless, and this is the most likely way to get a vacuous
      negative.

  proof_search_map:
    bottleneck: >-
      That the family's transfer lane, replicated identically across twenty
      goals, rests on an instrument that has never produced a positive output.
      Removing this bottleneck does not change any cost or theorem; it changes
      whether the lane's negative verdicts mean anything.
    baseline_embedding:
      parameter_slice: >-
        At 30 bits the additive-transfer solver's output must equal the
        baby-step giant-step output on the same instance, exactly. Baby-step
        giant-step at 30 bits is the best-known baseline that is actually
        runnable, and agreement on the returned integer, not merely both
        certificates verifying, is the embedding.
      reproduction_check: >-
        A frozen fixture of three 30-bit anomalous instances with their k values
        recorded, run before any larger size is attempted, checked by exact
        integer equality against baby-step giant-step and against the discarded
        generating k.
    observation_collision:
      observable: >-
        The discrete_log certificate consisting of curve, P, Q and k, together
        with its verification outcome.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS UNUSUALLY CLEAN, WHICH IS WHY THIS RECORD IS
        WORTH RUNNING. Search for two distinct integers k and k prime with k
        times P equal to k prime times P equal to Q on the same curve - they
        exist exactly when k and k prime agree modulo the order of P, so the
        certificate identifies k only modulo the point order, and the record must
        state the order of P alongside k or the certificate is ambiguous. That is
        the benign collision. THE MALIGN COLLISION IS THE ONE THAT MATTERS - two
        distinct CURVES, one anomalous and one not, on which the solver produces
        a verifying certificate. Predicted NOT to exist, because verification
        recomputes k times P on the stated curve and a solver that guesses on a
        non-anomalous curve produces a k that fails. If such a collision were
        found, a verifying certificate on a non-anomalous curve, it would mean
        either that the verifier is not independent of the solver or that the
        instance was not genuinely hard, and both are instrument failures that
        void everything.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the problem from E(F_p) to the additive group of F_p via the
          formal logarithm, where the hypothesis that #E equals p becomes the
          exact condition that multiplication by p lands in the kernel of
          reduction.
        predicted_gain: >-
          From p to the one half down to log p to the O(1), the whole exponent,
          on this family. Encoding, completeness, soundness, transfer and
          cost-loss obligations are listed separately below; the soundness
          obligation is discharged by the certificate rather than by the
          derivation, which is the honest division of labour here.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "trace equals one" fixed and vary the forgotten
          structure - the CM discriminant, the field size, the curve model -
          across the toy construction ladder, to confirm that the attack depends
          on the trace and on nothing else.
        predicted_gain: >-
          Distinguishes "the solver works because the curve is anomalous" from
          "the solver works because our toy curves happen to be small or to have
          discriminant minus three", which a single toy curve cannot separate and
          which is the most likely silent defect in an additive-transfer
          implementation validated on one instance.
    quantifier_order: >-
      Claimed PER INSTANCE, EXISTENTIALLY, AND THAT IS THE WHOLE CLAIM. FOR THIS
      curve and THIS pair of points, THERE EXISTS an integer k with k times P
      equal to Q, exhibited and independently re-verified. NOT CLAIMED - FOR ALL
      anomalous curves the solver succeeds, which is untested outside the
      constructed ladder. NOT CLAIMED - FOR ALL instances on this curve, since
      the run solves the instances it is given. NOT CLAIMED - any statement about
      non-anomalous curves beyond the recorded failure of this specific solver on
      two of them.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the stated curve, k solves Q equal to k times P, verified by
        independent recomputation." It certifies NOTHING about any other curve,
        NOTHING about the ECDLP's hardness in general, and, critically, a SUCCESS
        here is not evidence that any other lane's instrument works, only that
        this one does.
      nearby_object_control: >-
        A curve with trace t equal to two instead of one at the SAME bit size,
        constructed by the same complex-multiplication route with 4p equal to
        four plus the absolute value of D times s squared. It is one integer away
        from anomalous, has the same discriminant, the same field size and the
        same construction pedigree, and the solver MUST fail on it. This is a far
        sharper control than Curve25519, which differs from the Anomalous curve
        in field, size, model and provenance simultaneously, and it is the control
        that isolates the trace as the load-bearing structure. A solver that
        cannot distinguish t equal to one from t equal to two at matched
        everything-else has not identified what makes the attack work.
    proof_obligations:
      - claim: >-
          The lift of E and of P to the integers modulo p squared is well-defined
          and reduces to the original data modulo p.
        responsibility: correctness
      - claim: >-
          When #E equals p, p times the lift of P lies in the kernel of reduction
          for every P in E(F_p), and the formal logarithm is additive on it.
        responsibility: correctness
      - claim: >-
          The recovered k satisfies k times P equal to Q, checked by an
          independent module.
        responsibility: correctness
      - claim: 'The solver runs in O(log p) field operations.'
        responsibility: runtime
      - claim: >-
          The constructed toy curves genuinely satisfy #E equal to p, certified
          by p times G being the identity for several independent G plus Hasse
          uniqueness.
        responsibility: baseline
      - claim: >-
          The solver FAILS, with a verification failure rather than a crash-free
          wrong answer silently accepted, on the trace-two nearby control and on
          Curve25519 and BN(2,254).
        responsibility: strictness
      - claim: >-
          The instance is genuinely unknown to the solver, since k is drawn, used
          to form Q, and discarded before the solver is invoked.
        responsibility: interface
      - claim: >-
          The certificate schema matches docs/claims-and-verification.md and the
          verifier is independent of the solver's code path.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of successful, independently verified solves on constructed
        anomalous curves at 30, 40, 60 and 80 bits, 25 instances each
      direction: higher
      minimum_effect: >-
        PREDICTED 100 out of 100. Anything less than 100 percent means the
        implementation is wrong, since the algorithm is deterministic and has no
        failure probability, and no larger run may proceed.
    - metric: >-
        agreement between the additive-transfer solver and baby-step giant-step
        on the returned k at 30 bits
      direction: different
      minimum_effect: >-
        PREDICTED exact equality on all 25 instances. This is the one rung with
        an independent SOLVER rather than only an independent verifier, and it is
        the only place a systematically wrong but self-consistent implementation
        could be caught.
    - metric: >-
        number of successful, independently verified solves on the roughly
        204-bit Anomalous row, 10 instances
      direction: higher
      minimum_effect: >-
        PREDICTED 10 out of 10, each with a certificate. THE SINGLE HEADLINE
        ARTIFACT. A failure at 204 bits after 100 out of 100 at 80 bits would
        indicate a size-dependent implementation defect and is the outcome that
        would make heuristic H2 of IDEA-20260829-d052e6 look optimistic across
        this whole campaign, which is itself worth knowing.
    - metric: >-
        number of successful solves on Curve25519 and on BN(2,254), 100 attempts
        each
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY ZERO, with every attempt either failing certificate
        verification or declining to produce a k. A SINGLE verified success on
        Curve25519 would be either a catastrophic implementation error or a
        result requiring immediate independent review-breakthrough scrutiny; the
        record PRE-COMMITS to treating an implementation error as overwhelmingly
        the likelier explanation, to halting, and to making no statement outside
        the repository until it is excluded.
    - metric: 'number of successful solves on the trace-two nearby control'
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY ZERO over 100 attempts, at matched field size and
        matched discriminant. This is the control that isolates the trace, and
        its failure would mean the solver is exploiting something other than
        anomalousness.
    - metric: >-
        measured solver cost in field operations at 204 bits, versus the
        arithmetic evaluation of 0.886 times the square root of p
      direction: lower
      minimum_effect: >-
        PREDICTED below 10^4 field operations against a rho figure of about
        2^101.8, a ratio exceeding 2^88. The comparison is between a MEASURED
        cost and an EVALUATED FORMULA, not between two measurements, and must be
        reported as such; rho is not run at 204 bits and no claim about its
        measured cost is made.
    - metric: >-
        whether the Anomalous row's parameters can be re-sourced to any primary
        or authoritative document
      direction: different
      minimum_effect: >-
        REPORTED AS A YES OR NO WITH THE SEARCH RECORDED. A no does not block the
        solve but does bound what the solve can be cited for, and it is a finding
        about the family's designated positive control that all twenty goals
        inherit.

  minimal_test:
    design: >-
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, under an hour of implementation
      plus seconds of compute. Construct ONE 30-bit anomalous curve by complex
      multiplication with discriminant minus three, generate 25 instances, solve
      each by the additive transfer and by baby-step giant-step, and require (a)
      exact agreement of the two values of k, (b) certificate verification by
      harness/toycurve.py, and (c) zero successes out of 25 when the same solver
      is pointed at a 30-bit trace-two curve built the same way. This settles
      whether the instrument exists at all, at toy scale, before any larger
      parameter is touched, and its failure costs almost nothing.
      STAGE 2, minutes. The ladder at 40, 60 and 80 bits, 25 instances each,
      still with the trace-two control at each size and with baby-step giant-step
      agreement wherever it is still affordable - at 40 bits yes, at 60 to 80
      bits no - and the record states at which size independent-solver checking
      stopped rather than implying it continued.
      STAGE 3, minutes. The roughly 204-bit Anomalous row, 10 instances,
      certificates emitted, preceded by the re-sourcing attempt.
      STAGE 4, minutes. The full-size negative controls on Curve25519 and
      BN(2,254), including the model conversion, 100 attempts each.
    controls:
      - >-
        POSITIVE, BLOCKING, AND ESCALATING - constructed anomalous curves at 30,
        40, 60 and 80 bits. The instrument must FIRE at every size. This is the
        control the archived plan's P1 could not supply, because P1 asks only for
        a trace value and depends on parameters the campaign has not re-sourced.
      - >-
        NEARBY-OBJECT NEGATIVE, THE SHARP ONE - trace-two curves at each size,
        same CM discriminant, same construction, one integer of trace away. Zero
        successes required.
      - >-
        NEGATIVE, FULL SIZE, CROSS-CURVE - Curve25519 and BN(2,254). These match
        on nothing except being elliptic curves, so they are weaker controls than
        the trace-two curves and are labelled as such; their value is that they
        are the curves the campaign actually cares about.
      - >-
        INDEPENDENT-SOLVER CONTROL - baby-step giant-step at 30 and 40 bits. This
        distinguishes a correct solver from a self-consistent wrong one, which
        certificate verification alone cannot do when the same wrong lift is used
        to construct and to check.
      - >-
        NULL, SAME SHAPE - run the solver on 100 instances over an anomalous
        curve where Q is drawn as a RANDOM CURVE POINT rather than as k times P
        for a known k. It must still succeed, because every point is a multiple
        of P in a group of prime order p with P not the identity. PREDICTED 100
        out of 100. If it succeeds only on instances constructed as k times P,
        the harness is leaking k and every solve is void. THIS IS THE CONTROL
        THAT CATCHES THE WORST FAILURE MODE AVAILABLE HERE, which is a solver
        that reads its answer from its input.
      - >-
        DEGENERATE-INPUT CONTROL - P the identity, Q the identity, and Q equal to
        P, each of which must be handled explicitly rather than by accident.
    required_metrics:
      - 'per instance, the certificate of curve, P, Q and k, the verification outcome, and the order of P'
      - 'per instance, the solver field-operation count and wall clock'
      - 'per size, the success rate and the baby-step giant-step agreement rate where it was run'
      - 'per negative control, the success rate and the failure MODE per attempt'
      - 'the trace-two nearby control success rate at every size'
      - 'the random-Q null success rate'
      - 'the CM construction transcript per toy curve, with its p-times-G witnesses'
      - 'the Anomalous re-sourcing outcome, with URLs attempted and results'
      - 'verifier_commit and the exact harness/toycurve.py revision used'

  falsification_conditions:
    - >-
      Any solve at any size whose certificate fails independent verification. Per
      docs/claims-and-verification.md this is invalid_measurement, NOT a negative
      observation; the run is void and the implementation is wrong.
    - >-
      The additive-transfer solver and baby-step giant-step disagree on k at 30
      or 40 bits. The implementation is wrong in a way certificate verification
      alone might not have caught; halt.
    - >-
      Any verified success on the trace-two nearby control, on Curve25519, or on
      BN(2,254). Either the solver is not doing what it claims or something far
      more consequential is true; the pre-committed route is to HALT, exclude
      implementation error first, escalate to independent review-breakthrough
      scrutiny, and make no statement outside the repository.
    - >-
      The random-Q null succeeds at a materially lower rate than the instances
      constructed as k times P. The harness is leaking the answer and every solve
      is void.
    - >-
      Failure at 204 bits after 100 percent success at 80 bits. A size-dependent
      defect; the certificate for the headline artifact is withdrawn and the size
      threshold at which it appears is reported, which is a useful negative for
      every other instrument in this campaign.
    - >-
      A constructed toy curve fails its own p-times-G check. The CM construction
      is wrong and no solve on it means anything.

  confounders:
    - >-
      SELF-CONSISTENT WRONGNESS. If the lift used by the solver and the lift used
      by any check share code, a wrong lift verifies against itself. This is why
      the verifier must be harness/toycurve.py, which knows nothing about lifts
      and only about F_p arithmetic, and why baby-step giant-step agreement is
      required at the sizes where it is affordable.
    - >-
      TOY-SCALE CONSTRUCTION BIAS. The whole toy ladder uses small CM
      discriminants because the class polynomial must be linear. So the toy
      curves are all special in a second way beyond being anomalous, and a solver
      that secretly depends on discriminant minus three would pass the entire
      ladder. The fix is to run the ladder across SEVERAL discriminants from the
      nine-element list, not one, and the record must say how many were used.
    - >-
      MODEL MISMATCH ON THE NEGATIVE CONTROL. A Curve25519 negative that fails
      because the solver cannot parse a Montgomery curve is vacuous. Conversion
      to short Weierstrass form must be done and verified BEFORE the control is
      claimed to have run.
    - >-
      THE ANOMALOUS ROW'S PROVENANCE. Its parameters are user-supplied and
      unverified, and it is a constructed illustration rather than a standardised
      curve. A solve on it certifies a fact about the stated integers; whether
      those integers are SafeCurves' Anomalous curve is a separate, unresolved
      question, and the two must not be merged in any write-up.
    - >-
      OPERATION COUNTING. Field operations must be counted the same way for the
      solver and for the rho formula it is compared against, or the 2^88 ratio is
      not meaningful. State the counting convention.

  interpretation_limits:
    - >-
      A SOLVE ON A DELIBERATELY BROKEN CURVE IS NOT A BREAK OF ANYTHING. The
      Anomalous row exists in the family precisely to be broken; reproducing that
      is instrument validation, not discovery, and the goal's own claim
      boundaries say so when they call the Anomalous and BN rows positive-control
      candidates and not newly discovered attacks.
    - >-
      A successful solve validates THIS instrument only. It says nothing about
      whether the rho lane, the discriminant lane, the ladder lane or the
      indistinguishability lane can fire, and no record may cite it as general
      evidence of the campaign's instrumentation.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) AS AN ATTACK, ZERO
      transfer. The attack applies exactly to trace one and to nothing else, and
      KN-TECH-033 records that it does not degrade gracefully. Nineteen of the
      twenty rows are predicted to be untouched and the run is designed to
      demonstrate that on two of them. (b) AS A CONTROL, FULL transfer, and this
      is the record's family-wide value - once this solver exists and has fired,
      every one of the twenty goals' L6-TRANSFER additive sub-lanes can cite a
      fired instrument rather than an asserted one, and the identically-worded
      positive control P1 in all twenty archived plans becomes satisfiable. The
      artifact should be filed so all twenty can reference it. (c) AS A TEMPLATE,
      the same flag-to-solve upgrade is available for the MULTIPLICATIVE transfer
      on BN(2,254), namely implementing the MOV and Frey-Ruck pairing reduction
      and actually solving a discrete logarithm there, which is the obvious
      successor and is NOT attempted here. Naming it is forward guidance, not a
      claim that it will work.
    - >-
      The exponent statement, from p to the one half down to log p to the O(1),
      is a statement about the trace-one family only and is textbook. This record
      claims no exponent movement anywhere else and is not a bid against
      docs/target-result-profile.md.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A complex-multiplication construction with 4p equal to one plus the
        absolute value of D times s squared, for small absolute D in the
        nine-element class-number-one list, followed by selecting among the
        curve's twists the one satisfying that p times G is the identity for
        several independent random G, yields a curve with #E(F_p) equal to p
        EXACTLY, not merely with high probability.
      rigorous_support: >-
        RIGOROUS, not heuristic, once the check passes. p is prime and lies in
        the Hasse interval of itself, and the Hasse interval of width four times
        the square root of p contains at most one multiple of p for p greater
        than 16, so p times G being the identity, with the order of G not
        dividing any smaller multiple, forces #E equal to p by Lagrange plus
        uniqueness - exactly the archived plan's lane L4 argument reused. The
        residual heuristic is only that several independent G suffice to exclude
        the order of G being a proper divisor, and for p prime the only proper
        divisor is one, so a single G other than the identity already suffices.
        THE ASSUMPTION IS THEREFORE VACUOUS ONCE STATED CAREFULLY, which is why
        it is recorded and then discharged rather than carried.
      validation_plan: >-
        SAMPLING - every constructed toy curve, at every size, records its
        p-times-G witnesses for at least three independent G, plus the primality
        certificate for p at a stated tier. COMPARISON - at 30 bits, an
        independent brute-force point count over all x in F_p, giving the exact
        group order for direct comparison, an O(p) pass and trivial at 30 bits.
        TAIL CHECK - confirm no constructed curve is supersingular by checking
        that the trace is one and not zero, and confirm that j matches the
        intended discriminant. TRANSFER - the brute-force cross-check runs only
        at 30 bits; above that the argument carries it, and the argument is
        rigorous, so nothing is extrapolated.
    - id: H2
      statement: >-
        An additive-transfer implementation validated against an independent
        solver at 30 to 40 bits and against certificate verification at 60 to 80
        bits is correct at 204 bits; formally, the implementation has no
        size-dependent failure mode first appearing above 80 bits.
      rigorous_support: >-
        NONE. Same shape as heuristic H2 of IDEA-20260829-d052e6 and the archived
        plan's H4, and equally the weakest item here. Partial mitigation, stated
        as mitigation and not as support - the certificate check is performed at
        EVERY size including 204 bits, so a wrong answer at 204 bits is CAUGHT
        even though a wrong answer cannot be prevented, which is a materially
        better position than the instruments whose output is unverifiable, and is
        the concrete reason to prefer a solve over a flag.
      validation_plan: >-
        SAMPLING - 25 instances at each of 30, 40, 60 and 80 bits and 10 at 204
        bits, with per-size success rates reported separately and never pooled.
        COMPARISON - baby-step giant-step agreement at 30 and 40 bits, an
        independent solver, and certificate verification at all sizes, an
        independent verifier. The record states plainly at which size
        independent-SOLVER checking stopped and that only independent-VERIFIER
        checking continued above it. TAIL CHECK - instances chosen to include k
        near zero, k near p minus one, and k with low Hamming weight, since those
        are where an off-by-one or a truncation defect would surface first.
        TRANSFER - correctness is assumed to transfer, cost is measured at every
        size and not transferred at all.
    - id: H3
      statement: >-
        The instances solved are genuinely unknown to the solver; that is, the
        harness's generate-then-discard protocol leaves no channel by which k
        reaches the solver.
      rigorous_support: >-
        Not a mathematical assumption but a software one, and it is the failure
        mode that would most flatter this record. Its rigorous counterpart is the
        observation that in a group of prime order p every non-identity point is
        a multiple of P, so a uniformly random curve point is a valid instance
        with NO k ever having existed, which removes the channel entirely rather
        than trusting it to be closed.
      validation_plan: >-
        The random-Q null control above - 100 instances where Q is drawn as a
        random curve point and no k is ever computed. PREDICTED 100 out of 100
        successes, identical to the instances built as k times P. Any gap between
        the two rates is direct evidence of leakage and voids every solve. This
        is a genuine discriminator with two distinct outcomes and it costs the
        same as the main run.

  target_complexity:
    time_exponent: >-
      Log p to the O(1) field operations - concretely a small constant number of
      scalar multiplications and inversions, that is O(log p) field operations
      and O(log^3 p) bit operations with schoolbook arithmetic. At the Anomalous
      row's roughly 204-bit prime this is predicted below 10^4 field operations.
      THIS IS AN EXPONENT STATEMENT AND IT IS TEXTBOOK, NOT NEW, and it applies
      to trace-one curves only.
    memory_exponent: >-
      O(log p) - a handful of field elements and one lift. Constant memory in the
      practical sense, and stated beside the time complexity as
      docs/claims-and-verification.md requires. The certificate is O(log p) bytes
      and verification is one scalar multiplication, about 204 doublings, which
      is genuinely succinct.
    best_known: >-
      For trace-one curves, the additive transfer itself at O(log p) field
      operations, per KN-TECH-033, so this record TIES the best known and does
      not advance it. For general curves, rho at 0.886 times the square root of N
      with O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
      (KN-TECH-018), BSGS at square-root time and memory (KN-TECH-031) with its
      n^{2/3+o(1)} full cost (KN-TECH-035), and MOV and Frey-Ruck at small
      embedding degree (KN-TECH-032). On the Anomalous row specifically, the
      delta against rho is from 2^101.8 down to under 10^4 operations, a factor
      above 2^88.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial - the cost is a fixed small number of
      arithmetic operations, honestly countable. The genuine hidden costs are
      elsewhere. (i) SCOPE - the algorithm applies to a set of curves of density
      about four times the square root of p divided by p among Hasse-admissible
      orders, vanishing at cryptographic size as KN-TECH-033 states, so the
      exponent is spectacular and the applicability is negligible, and reporting
      the first without the second would be the central dishonesty available
      here. (ii) CORRECTNESS - carried at 204 bits by heuristic H2 with no
      rigorous support, mitigated but not removed by certificate verification.
    tradeoff_note: >-
      No time-memory tradeoff exists or is needed - the algorithm is
      simultaneously optimal in both and is not on a van Oorschot-Wiener curve at
      all. Parallelisation is pointless, since the computation is milliseconds
      and the fourteen available cores are useful only for running the toy
      ladder's instances concurrently. The real tradeoff in this record is
      between IMPLEMENTATION EFFORT and EVIDENTIAL WEIGHT - a trace-equality flag
      costs one comparison and proves nothing about the instrument, while a
      certified solve costs a few hundred lines and licenses every negative
      verdict the lane will ever emit, across twenty goals.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. ON THE TRACE-ONE
    FAMILY nothing dominates it - the additive transfer at O(log p) IS the
    frontier row, and this record REPRODUCES that row rather than advancing it,
    which is stated as a tie and not as an improvement. Rho (KN-TECH-001,
    KN-TECH-006) at 0.886 times the square root of p, which is 2^101.8,
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035) at
    square-root time and memory, and MOV and Frey-Ruck (KN-TECH-032) are all
    dominated BY it on this family, on time and memory simultaneously. ON EVERY
    OTHER CURVE, INCLUDING ALL NINETEEN SIBLINGS, this record is dominated by
    every one of those rows, absolutely and not marginally, because it does not
    apply at all - a cost of infinity on any curve whose trace is not one. AS AN
    AUDIT INSTRUMENT it is dominated by any computer-algebra system able to
    compute a trace, on convenience and on development cost; it dominates them on
    the one axis that matters to AGENTS.md rule 5 and to IDEA-20260807-98a970's
    blocking-control rule, namely that its output is a certificate the program
    can re-verify rather than a verdict the program must trust.
  sota_delta: >-
    ZERO against the trace-one frontier - this TIES the additive transfer and
    claims no improvement on it. QUANTITATIVELY AGAINST THE GENERIC BASELINE ON
    THE TARGET CURVE - 2^101.8 group operations, which is rho's evaluated formula
    at the roughly 204-bit Anomalous prime, versus a predicted under 10^4 field
    operations, a ratio exceeding 2^88, reported as measured versus evaluated
    formula since rho is not run. AS ARTIFACT, WHICH IS THE REAL DELTA - the
    repository currently contains ZERO discrete-logarithm certificates on any
    named curve and ZERO implementations of any transfer attack, per the harness
    grep of 2026-08-29, and twenty archived audit plans whose additive-transfer
    positive control asks only for a trace value. This would produce ten verified
    crypto-tier discrete_log certificates plus about one hundred toy-tier ones,
    plus recorded failure rates on four distinct negative controls including a
    nearby object matched on everything except one unit of trace. AS EPISTEMIC
    STATUS - KN-TECH-033 moves from a technique described at confidence
    `established` on three papers none of which was read in full, to a technique
    this program has executed, certified and controlled, which is the difference
    between citing a fact and holding one.
