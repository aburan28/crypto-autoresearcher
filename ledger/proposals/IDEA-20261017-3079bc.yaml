idea:
  id: IDEA-20261017-3079bc
  question_id: RQ-SEMBIN-ade131
  added: '2026-10-17'
  status: proposed
  approved_by:
  proposed_by: idea-generator
  title: >-
    A zero-background detector for intrinsic solution clustering at t=4..12: measure
    the conditional extra-solution rate nu_t=E[c(c-1)]/E[c] by sample-and-recount, where
    the Poisson background is <=1e-5 so a single extra solution is structure
  class: measurement
  claim: >-
    SCOPE toy: E y^2+xy=x^3+aX^2+B over F_{2^n}, n<=64, |V|=2^5..2^8, t in
    {4,6,8,10,12}, n=tk+g with g in {12,7,4,4,4} so the chance background is
    mu_class~d*2^-g/t! <=1e-5. Sampled only in the choice of target; the recount is
    exact. No attack, no security claim. The cost-relevant regime of eqs. (15)-(17) is
    mu~1e-6..1e-8 at t=m=10..12, where no exhaustive count over V^t exists and where
    P~mean/kappa if solutions cluster with mean kappa. Pick a random t-multiset M of W and
    a sign pattern, set R=sum; count the OTHER x-multisets summing to +-R by
    meet-in-the-middle (tables of floor(t/2)- and ceil(t/2)-multiset sums). Size-biased
    sampling makes the expected number of others exactly nu_t. Null: nu_t=d*C(|W|+t-1,t)/N.
    Prediction under the mixture/no-structure reading (IDEA-20261017-e9f824): zero extra solutions in
    >=2e4 targets per cell. Planted positive control: factor base W u (W+T) (x-set V u b/V)
    must give nu=2^{t-1}-1. A cell with extra solutions beyond the null bound is a
    structural coincidence to explain; its growth in t is the exponent-relevant number:
    kappa(t)=e^{O(t)} leaves c unchanged, kappa(t)~t!^delta moves c to c*sqrt(1+delta)
    (IDEA-20261017-3db2a8 C4).
  mechanism: >-
    Object: the fibre of the multiset-sum map (x-multisets sharing one sum). Representation
    R1. Sigma = permutation of entries, global negation, and the candidate structural
    symmetries (flip of an even set of entries by the 2-torsion translation x->b/x,
    Frobenius when B in F_2). The fibre is lossy (forgets all but the sum) and compatible
    with Sigma because the sum is invariant under each. Class I partial action. Price:
    recount |W|^{ceil(t/2)}/ceil(t/2)! per target, table of the same size (<=1e7
    entries in the listed cells). Factor-base escape: standard subspace.
  novelty_status: unverified
  citations:
  - {ref: EV-SEMBIN-d40877, provenance: internal, claim: "Poisson fit rejected at 7 of 9 cells; t>=4 cells have |V|<=16; nearest prior work: its t>=4 cells have |V|<=16; this reaches t=12 at |V|<=2^8 with a zero-background statistic", verified_by: DEC-20260913-3b51c8}
  - {ref: EV-SEMBIN-0c8bf4, provenance: internal, claim: "parity explains t=2; t>=3 left open", verified_by: DEC-20260913-92aa48}
  - {ref: SRC-SEMAEV-2015-310, provenance: kb, claim: "S_3 chain, eq. (11)", verified_by: paper_fulltext.md}
  - ref: IDEA-20260915-3f1964
    provenance: internal
    claim: 'nearest prior work: exhaustive V^3 table as PDP ground truth; this is a sampled recount for clustering up to t=12'
    verified_by: idea-generator 2026-10-17, record opened
  predictions:
  - {metric: "extra solutions per sampled target minus null", direction: different, minimum_effect: "0 within the Poisson bound at all cells; any excess flagged"}
  - {metric: "planted flip control nu", direction: higher, minimum_effect: "exactly 2^{t-1}-1"}
  - {metric: "non-rational share of single-polynomial solutions at t=4 vs |V|", direction: lower, minimum_effect: "<1% at |V|>=2^6 (18% at |V|=16 in RUN-SEMBIN-1b9afe)"}
  minimal_test:
    design: >-
      C or numba with 64-bit carry-less arithmetic. Cells (t,k): (4,8),(6,7),(8,6),(10,6),
      (12,5). Families: Semaev window, random subspace, random subspace inside ker Tr,
      window with constant removed; B=1 and random; Tr(a) in {0,1}. 2e4 targets per cell,
      seeded stream, canonical sorted multisets for dedup. Report each extra-solution
      event with the colliding multisets so structure can be read off.
    controls:
    - "planted 2-torsion flip: base from V and b/V; nu must equal 2^{t-1}-1"
    - "curve-free group (relabelled Z/N) through the same pipeline: zero events"
    - "wrong target (R+1 on Z/N): zero by construction"
    required_metrics: [targets sampled, extra-solution events, null bound, event keys, table size, wall time, peak RSS]
  falsification_conditions:
  - "Planted control not recovered: detector blind, no cell may be called clean."
  - "Events in the curve-free control: pipeline bug, run void."
  - "Events above the null bound at >=2 cells with a common pattern: structural clustering exists; a kappa(t) fit replaces the clean reading."
  confounders:
  - "Repeated entries and P,-P pairs give legal coincidences: dedupe by canonical multiset, report distinct-entry and repeated-entry strata separately."
  - "Size-biased sampling: nu is E[c(c-1)]/E[c], not the per-target mean."
  interpretation_limits:
  - "A clean result bounds structure only for |V|<=2^8 and t<=12; it does not reach |V|=2^38. No security or degree claim."
  heuristic_assumptions:
  - id: H1
    statement: "nu_t - mu_class = O(1) uniformly in t for the window family, up to t=12 at |V|<=2^8."
    rigorous_support: "nu_t is the energy ratio of W; Chen-Stein gives Poisson only under a dependency bound not proved here."
    validation_plan: "This detector at zero background; tail: largest cluster size per cell against t."
  - id: H2
    statement: "Structural coincidences scale at most as |V|^0, so toy |V|=2^5..2^8 bounds |V|=2^k, k~n/m."
    rigorous_support: "none; an extrapolation assumption."
    validation_plan: "Repeat at |V|=2^5..2^8 for fixed t; trend in |V| with intervals."
  target_complexity:
    time_exponent: "unchanged (no algorithm); measures the cluster factor kappa(t) in stage 1"
    memory_exponent: "unchanged"
    best_known: "eqs. (15)-(17) assume kappa=1"
    hidden_overhead: "kappa(t)=e^{O(t)} is lower order (relative O(1/ln m)); t!^delta changes c"
    tradeoff_note: "recount memory |W|^{t/2}/(t/2)! is the detector's own cost"
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-IC-889857, KR-IC-73db3f, KR-IC-1fcdbc, KR-IC-5a43e5, KR-RHO-13bf67, KR-RHO-1c2928, KR-RHO-482ed3, KR-RHO-cd0049]
    nearest:
    - {ref: KR-IC-889857, provenance: kb, relation: adjacent, delta: "Assumption 1 dispute; this touches only the yield law"}
    - {ref: KR-RHO-482ed3, provenance: kb, relation: adjacent, delta: "signed-Frobenius rho exploits the same Frobenius and negation symmetries that appear here as candidate cluster generators (Frobenius orbits of size n when B in F_2); there the symmetry is quotiented for a sqrt(m) rho gain, here it is a detector control for factor-base-side clustering, and no rho cost is claimed"}
    row_notes:
      KR-IC-73db3f: "considered; product-space dimension not varied"
      KR-IC-1fcdbc: "considered; the 2-torsion flip used as planted control is a Galbraith-Gebregiyorgis-type symmetry, here a control not a speed-up"
      KR-IC-5a43e5: "considered, not applicable: S_{t+1} enters only through point sums"
      KR-RHO-13bf67: "considered, not applicable: the recount is meet-in-the-middle on a fixed table, not a rho"
      KR-RHO-1c2928: "considered; measured lean signed-Frobenius rho on toy Koblitz curves is the comparator-side twin of the B=1 Frobenius control: it shows the symmetry is real on those curves, but it measures walk cost and says nothing about relation clustering"
      KR-RHO-cd0049: "considered, not applicable beyond the negation control: negation (P,-P) is quotiented by the x-multiset canonicalisation here; the 1.160x BSGS floor is a generic-side cost and is not charged"
