  lossy_projection_identifiability_audit:
    projection: >-
      A complete audited target (its specification, its failure structure, its memory
      behaviour, its cryptographic content) --> one categorical disposition token.
    what_is_discarded: Essentially everything. The token has a small finite range.
    why_genuinely_lossy: >-
      Maximally so, and deliberately: a disposition is meant to be a summary. Losing
      information is not the defect being hunted.
    why_compatible_with_the_operations: >-
      A disposition is supposed to propagate compositionally -- a partial component should
      force a partial composite -- and that compositional rule is exactly what the graded
      control tests, one feature at a time.
    is_it_only_a_change_of_coordinates: >-
      NO, and it could not be: the token is categorical with a handful of values while the
      input space is unbounded, so no injectivity is possible.
    mirror_failure_check: >-
      THIS IS THE FAILURE MODE UNDER TEST, NAMED EXPLICITLY. The hypothesis is precisely
      that the token is CONSTANT across instances -- the mirror failure, zero comparator
      spread -- and the audit is designed to measure that spread rather than assume it in
      either direction. The instrument for measuring it is the pair (NULL-STRAIGHTLINE,
      NEAR-NULL-RETRY): a protocol with nonzero spread must separate them.

  assumptions:
    - >-
      That the ~20-record run is uniform in the way EV-SSI-042 exemplifies. STAGE 0 TESTS
      THIS AND THE AUDIT DOES NOT PROCEED ON THE ASSUMPTION.
    - >-
      That the protocol is reproducible enough to be re-applied to a new target by a
      different agent from the committed artifacts alone. If it is not, THAT is the finding
      and it is reported as such rather than as a negative about the lane's content.
    - >-
      No claim whatsoever is made about the correctness, value, or good faith of the
      existing records. An instrument audit is not an accusation, and AGENTS.md rule 4
      forbids treating it as one: those records remain immutable and unamended by this one.

  proof_search_map_note: >-
    No paired hypothesis is filed with this record. The audit is empirical-procedural rather
    than proof-oriented; the four section-8 audits would be answered "not applicable: no
    theorem, bound, certificate family, reduction, or closure argument is proposed". It is
    filed as an idea ready for a contract, and the Coordinator may pair it with a hypothesis
    if it is prioritised.

  predictions:
    - metric: >-
        null_token: the disposition token the protocol returns on NULL-STRAIGHTLINE
      direction: different
      minimum_effect: >-
        Predicted COMPLETE. Derived: empty failure set makes both inclusions trivial, peak
        memory is exactly the constant slot width w, and every composition obligation has an
        empty index set. ANY `*_partial` / `*_schema_partial` / "without clearing
        QUERY_MEMORY" token on this input is the falsifier and is the finding.
    - metric: >-
        positive_control_token: the token returned on NEAR-NULL-RETRY
      direction: different
      minimum_effect: >-
        Predicted PARTIAL (a residual-tail obligation genuinely open). If it returns
        COMPLETE, the protocol is not conservative, and no conclusion may be drawn from the
        null arm either -- the instrument is broken in the other direction.
    - metric: >-
        token_turn_step: the index in the 5-step graded ladder at which the token first
        turns partial
      direction: different
      minimum_effect: >-
        Any value in {1,...,5} is a result and the value is the deliverable. Pre-registered
        interpretation, fixed here before any run: 1 = the protocol never terminates;
        2 or 3 = it responds to the mere existence of a failure exit rather than to any
        memory structure; 4 = it responds to unbounded tails, which is the correct and
        informative behaviour; 5 = it responds only to composition, and the twenty records
        are as strong as they read.
    - metric: >-
        run_uniformity: the fraction of EV-SSI-023..042 whose disposition matches the
        EV-SSI-042 shape, established by reading them in stage 0
      direction: higher
      minimum_effect: >-
        >= 0.8 for the audit's premise to stand. Below 0.8 the premise is wrong, the audit
        stops, and the correct record is that the run is not uniform.
    - metric: >-
        reproducibility: whether a different agent can re-apply the protocol to a new target
        from the committed artifacts alone, without inventing a rule
      direction: different
      minimum_effect: >-
        Binary, reported either way. A NO is an infrastructure/reproducibility finding under
        AGENTS.md rule 5 and is NEVER reported as negative evidence about the lane's
        mathematics.

  minimal_test:
    design: >-
      STAGE 0 (reading, zero compute, CAN END THE AUDIT): read EV-SSI-023..041 and confirm
      or refute run uniformity. STAGE 1 (zero compute): write NULL-STRAIGHTLINE and
      NEAR-NULL-RETRY completely, and derive their forced verdicts BEFORE applying the
      protocol; hash-commit both derivations. STAGE 2 (zero compute): apply the protocol to
      the null first, record its token, hash-commit it, and only then apply it to the
      positive control. STAGE 3 (zero compute): run the 5-step graded ladder and report the
      turn step.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced verdict derived pre-run, CAN FAIL:
        NULL-STRAIGHTLINE, specified completely above. Its forced verdict is COMPLETE.
      - >-
        POSITIVE CONTROL, the effect MUST appear: NEAR-NULL-RETRY. The protocol must return
        PARTIAL. If it does not, the instrument cannot detect a genuinely open obligation
        and NO negative may be reported from the null arm.
      - >-
        GRADED CONTROL with 5 points, 3 interior, monotonicity reported: the ladder above.
        Pre-registered expectation that the token sequence is MONOTONE (once partial, always
        partial as features are added). A non-monotone sequence is itself a defect of the
        protocol and must be reported.
      - >-
        ORDERING CONTROL: null before positive control, both hash-committed before the
        ladder, and every derived forced verdict committed before the protocol is applied.
      - >-
        BLIND APPLICATION: the agent applying the protocol in stage 2 is given the two
        targets in a randomised, unlabelled order under a declared seed, so that the label
        cannot drive the token.
    required_metrics:
      - the two null/positive specifications verbatim, with their pre-run derived verdicts and hashes
      - the token returned on each, with the exact procedure trace that produced it
      - the 5-step ladder table and the turn step
      - the stage-0 uniformity fraction with the record ids that did and did not match
      - a reproducibility statement, YES or NO, with what was missing if NO

  falsification_conditions:
    - >-
      Stage 0 finds the run is not uniform (< 0.8 match). The premise is wrong and the audit
      is withdrawn.
    - >-
      NEAR-NULL-RETRY returns COMPLETE. The instrument is broken; nothing else is reported.
    - >-
      NULL-STRAIGHTLINE returns COMPLETE and the ladder turns at step 4 or 5. The protocol
      is discriminating, this record's suspicion is refuted, and the twenty records'
      standing is CONFIRMED rather than doubted. THIS IS THE MOST LIKELY OUTCOME AND IT IS A
      GOOD ONE.
    - >-
      The protocol cannot be re-applied at all. Infrastructure finding, never mathematical
      evidence.

  confounders:
    - >-
      RE-IMPLEMENTATION DRIFT. The protocol is applied by an agent, not by a program, so the
      applying agent may not be applying the same protocol. The blind randomised order and
      the requirement to record the full procedure trace are the mitigations; they are
      partial and the record says so.
    - >-
      AUTHORSHIP ASYMMETRY. Auditing another lane's instrument is cheap to produce and reads
      as rigour. The positive control exists precisely so that a "the instrument is broken"
      verdict costs something to reach.
    - >-
      A "partial" token may be CORRECT. Refusing to conclude on genuinely incomplete
      structure is the right behaviour and the whole design exists to distinguish that from
      insensitivity. A record that reports the null result without the ladder has not made
      that distinction and has not finished.
    - >-
      SCOPE OF THE TARGET. NULL-STRAIGHTLINE is a formal object, not a cryptographic one, so
      a protocol legitimately tuned to cryptographic targets might reject it as out of
      domain. That rejection is a THIRD admissible outcome and must be recorded as such
      rather than forced into COMPLETE or PARTIAL.

  interpretation_limits:
    - >-
      THIS RECORD CHANGES NO STATUS AND AMENDS NO EXISTING RECORD. EV-SSI-023..042 and their
      decisions are immutable. A finding here would warrant a NEW superseding record written
      by the Coordinator, and nothing else.
    - >-
      No mathematical conclusion of any kind follows from either outcome. The audit cannot
      support, weaken, or reject any hypothesis about supersingular hardness.
    - >-
      Claim tier: control / derivation only. No exponent, no cost, no scale.
    - >-
      Forward guidance either way: if the protocol is discriminating, the open item remains
      the one those records themselves name (a real FC0 lifetime/Verify implementation). If
      it is not, the open item is to define a disposition rule with a demonstrated nonzero
      comparator spread before the lane emits another token.

  heuristic_assumptions:
    - id: HEUR-DISP-1
      statement: >-
        NONE IS LOAD-BEARING. The forced verdicts for NULL-STRAIGHTLINE are consequences of
        the emptiness of its failure set and the constancy of its slot width; they are
        definitional, not distributional.
      rigorous_support: >-
        Empty-set inclusions hold in both directions; max over a constant sequence is that
        constant; a product over an empty index set is 1.
      validation_plan: >-
        The derivations are written and hash-committed in stage 1 before the protocol is
        applied, so they are checkable independently of the protocol's output.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND NONE IS CLAIMED. Stated plainly as the
      generation contract requires: this proposal moves no exponent. It is worth running
