    memory_exponent: n/a
    best_known: n/a -- no algorithm is compared.
    hidden_overhead: n/a
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no cost). Rows checked before writing
    n/a, across time, memory and data/queries: the five supersingular path-finding rows
    (Wesolowski 2026; Delfs-Galbraith; the vOW interpolation; MITM; Kohel) are all
