idea:
  id: IDEA-20260805-93ee20
  question_id: RQ-SSI-001
  added: '2026-08-05'
  goal_id: GOAL-SSI-001
  title: >-
    The disposition-null: run this goal's own obligation-ledger protocol on a
    structure-free target whose correct verdict is derivable in advance, and find out
    whether twenty consecutive "advances X without clearing QUERY_MEMORY" tokens were
    measuring the object or the protocol
  class: control

  claim: >-
    Between EV-SSI-023 and EV-SSI-042 this goal emitted a run of consecutive evidence
    records whose disposition is the same shape every time: an obligation ledger advances by
    one named step and the record then states, verbatim in EV-SSI-042 (READ), that the step
    "advances QM-ERROR beyond ... without clearing QUERY_MEMORY". COUNTED IN THIS SESSION:
    47 EV-SSI-* records exist, 45 carry BOTH `experiment_ids: []` and `run_ids: []`, and 41
    are tiered `theory`. No matched null has ever been run against that protocol.
    THE PROPOSAL IS A NULL OBJECT FOR THE PROTOCOL, NOT FOR ANY MECHANISM. Construct a
    target with NO structure for the protocol to find -- a straight-line procedure with a
    single typed exit, no retry, no failure constituents, no branching, no recursion -- and
    run the identical obligation decomposition on it. For that target the correct verdict is
    DERIVABLE BEFORE THE RUN and is not "partial": with one typed exit and an empty failure
    set, the forward and reverse inclusions between the emitted failure union U and the
    specified failure set F are both trivial, every composition obligation is vacuous, and
    the protocol must return COMPLETE. IF IT INSTEAD RETURNS AN "advances ... without
    clearing" TOKEN ON THE NULL, THEN THAT TOKEN IS A PROPERTY OF THE PROTOCOL AND NOT OF
    THE OBJECT, and ~20 records of this goal are measuring the apparatus. If it correctly
    returns COMPLETE, the protocol is demonstrated to be able to terminate, which is the
    sensitivity demonstration those 20 records currently lack, and their content is upgraded
    rather than doubted. BOTH OUTCOMES ARE DELIVERABLES AND NEITHER IS AN ATTACK.

  object_first_candidate:
    tracked_object: >-
      The DISPOSITION TOKEN itself -- the string the protocol emits (`*_partial`,
      `*_schema_partial`, `f_union_tightened`, `advances ... without clearing QUERY_MEMORY`)
      -- treated as a function of the input target, and followed across inputs rather than
      across a computation. The instance axis is the target being audited; the observable is
      one categorical label.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: every cryptanalytic family. This record proposes no
      attack, no algorithm, no bound, and touches no isogeny mathematics. Specifically
      off-limits: MITM/claw/vOW, KLPT/quaternion, orientation/CM (closed by
      DEC-20260804-3677f1), torsion-image/Kani (out of RQ-SSI-001 scope), quantum hidden
      shift, SQIsign transcript statistics. Also off-limits: any re-litigation of the FC0 /
      CSIDH-COLLIMATION content itself. The object is the instrument.
    newness_score: >-
      As mathematics, nil. As an instrument audit, it is the move the 2026-08-05 method
      sweep identifies as the single most-skipped control in this repository, and this goal
      is the largest single block of records to which it has never been applied. The
      programme's own KN-TECH-1a5b7e catalogues exactly this failure mode -- a control that
      passes without being able to fail -- in another goal.
    testability_score: >-
      Very high and entirely zero-compute: the null target is written in a page, its correct
      verdict is derived in a paragraph, and the protocol is applied by the same procedure
      the existing records document.
    survival_score: >-
      The token survives every input by construction, which is precisely the suspicion. The
      audit's whole content is to find out whether it also survives an input that should
      kill it.

  mechanism: >-
    PROVENANCE FIRST. EV-SSI-042 WAS READ IN THIS SESSION and its observation block is the
    source of the structural description below; the other EV-SSI-023..041 records WERE NOT
    READ in this session and their shape is characterised from EV-SSI-042 plus the goal
    record's own notes field. STAGE 0 OF THE AUDIT IS TO READ THEM, and if the run they are
    claimed to form is not in fact uniform, this record's premise is wrong and the audit
    reports that instead.
    From EV-SSI-042 (READ, quoted): the protocol decomposes a gap "into eight
    single-responsibility obligations", advances "exactly one (OBL-2a, the reverse inclusion
    F_spec subset-of U at recovery_spec-internal scope) ... from committed structure",
    derives OBL-2a as "a definitional consequence of the recovery_spec exit-typing sentence
    ('All exits are typed either success ... or a named failure constituent of F')",
    combines it with a committed forward inclusion "U subset-of F" to obtain "a
    SPEC-INTERNAL set equality U = F_spec over the recovery_spec typed exit set", and
    classifies the residual obligations as `not_supported` / `not_instantiated` /
    `checklist_only`.

    WHY THAT SHAPE ADMITS A NULL. The advance is derived from ONE sentence of the target's
    own specification (every exit is typed) plus ONE committed inclusion. Neither ingredient
    refers to the target's memory behaviour, its cost, its cryptography, or anything that
    distinguishes a collimation sieve from a `for` loop. THEREFORE THE SAME ADVANCE IS
    AVAILABLE FOR ANY SPECIFICATION WHOSE EXITS ARE TYPED. That is the identifiability
    hypothesis this record proposes to test, and it is testable by exhibiting one such
    specification with no other structure at all.

    THE NULL TARGET, DECLARED COMPLETELY AND IN ADVANCE. NULL-STRAIGHTLINE: a procedure with
    (i) one entry, (ii) a fixed finite sequence of k stages each of which is total (cannot
    fail), (iii) exactly one exit, typed `success`, (iv) an empty declared failure set
    F = {} , (v) no retry, no cleanup, no recursion, no branching, no probabilistic step,
    (vi) a single memory slot of constant declared width w reused by every stage.
    FORCED VERDICTS, DERIVED BEFORE ANY RUN, EACH INDEPENDENTLY CHECKABLE:
      (a) The emitted failure union U is empty and F is empty, so U subset-of F and
          F subset-of U hold TRIVIALLY and OBL-2a and its forward partner are both
          DISCHARGED, not "advanced".
      (b) Peak memory is max over stages of a constant, i.e. EXACTLY w. There is no
          composition to perform, no retry tail to route, no residual to bound.
      (c) Every probability-composition and numeric-error obligation is VACUOUS (empty index
          set), so `not_instantiated` is the wrong classification for it; the correct one is
          `vacuously satisfied`.
      (d) The correct overall token is COMPLETE. `*_partial`, `*_schema_partial`, and
          `advances ... without clearing QUERY_MEMORY` are all WRONG on this input.
    THE NULL CAN THEREFORE FAIL IN BOTH DIRECTIONS, which is what distinguishes it from
    decoration: if the protocol returns COMPLETE it has demonstrated it can terminate; if it
    returns a partial token it has demonstrated it cannot.

    THE POSITIVE CONTROL. NULL-STRAIGHTLINE alone cannot separate "the protocol is
    insensitive" from "the protocol is correctly refusing to conclude". So a second target
    is required on which the protocol MUST return a partial token: NEAR-NULL-RETRY, which is
    NULL-STRAIGHTLINE plus exactly one addition -- an unbounded retry loop with an
    undeclared per-attempt failure probability. Its peak memory is NOT max-over-stages
    (the retry tail is unbounded and undeclared), its failure set is NOT empty, and the
    residual-tail obligation is genuinely open. THE PROTOCOL MUST RETURN A PARTIAL TOKEN
    HERE. If it returns COMPLETE, the protocol is not conservative and the twenty records'
    caution is unfounded in the opposite direction -- also a finding.

    THE GRADED CONTROL, WHICH IS WHAT MAKES THIS LOCALISE RATHER THAN JUDGE. Interpolate
    between NULL-STRAIGHTLINE and the real FC0 target in >= 3 declared steps, adding exactly
    one structural feature at each step: (1) straightline; (2) + one typed failure exit;
    (3) + bounded retry with declared bound; (4) + unbounded retry with declared tail;
    (5) + composition across two subprocedures. Report the token at each step. THE
    DELIVERABLE IS THE STEP AT WHICH THE TOKEN TURNS PARTIAL. If it is step 1, the protocol
    never terminates on anything. If it is step 5, the protocol is discriminating and the
    twenty records are informative. Anything in between names the exact feature the protocol
    is responding to -- which is a mechanism, not a tally, and is what inventor-protocol
    section 4 requires of any statement about this lane.

