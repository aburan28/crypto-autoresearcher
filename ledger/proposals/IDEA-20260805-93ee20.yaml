    frontier. The check is recorded so the n/a is not an unchecked null.
  sota_delta: >-
    Zero on every attack axis; no cost is reduced. The measurement delta is from ~20
    consecutive dispositions with NO sensitivity demonstration to the same dispositions with
    a two-arm demonstration and a five-point localisation of what the protocol responds to.

  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.30 that the protocol returns a partial token on NULL-STRAIGHTLINE (the outcome that
    would matter). IT IS NOT LOWER because the one advance this session actually read
    (EV-SSI-042's OBL-2a) is derived from a single exit-typing sentence and nothing target-
    specific, which is exactly the profile of a protocol-level rather than object-level
    result. IT IS NOT HIGHER because those records repeatedly and explicitly classify
    residual obligations as `not_supported` and `not_instantiated` and refuse to invent
    values, which is the behaviour of a protocol that IS tracking its target and is being
    honest about what it cannot reach; the most likely single outcome is that the ladder
    turns at step 4 and the lane is vindicated. Separately, 0.85 that stage 0 confirms run
    uniformity, and 0.6 that the protocol is reproducible enough to re-apply at all.

