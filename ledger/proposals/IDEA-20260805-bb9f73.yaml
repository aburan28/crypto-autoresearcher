idea:
  id: IDEA-20260805-bb9f73
  question_id: RQ-QRUOV-001
  added: '2026-08-05'
  goal_id: GOAL-QRUOV-001
  title: >-
    Which way does the arrow point? An identifiability and quantifier-order audit
    of the folklore "QR-UOV reduces to UOV over F_{q^ell}", with one measurable
    integer r whose two possible values decide whether the matched baseline is the
    right baseline at all
  class: audit

  claim: >-
    GOAL-QRUOV-001 and RQ-QRUOV-001 both take as given that there is a "known
    reduction" of QR-UOV to plain UOV over the extension field, and both make the
    matched extension-field-UOV cost the yardstick everything is measured against.
    That inheritance has never been written out with its quantifiers. Written out,
    the folklore supplies the direction that bounds QR-UOV's hardness ABOVE (for
    every QR-UOV instance there is an ext-UOV instance whose solution solves it),
    while a security argument needs the direction that bounds it BELOW (the
    ext-UOV instances the descent produces are not a special, easier subfamily of
    the ones the baseline's cost model prices). This proposal derives the exact
    transfer lemma that makes the first direction true, isolates the ONE integer
    on which the second direction turns, and pre-registers its two possible values
    with a decisive consequence attached to each. That integer is r, the A-module
    rank of the A-linear span of the descended public forms, and it is forced to
    be either M or M*ell. If r = M the descent is dimension-exact -- the QR-UOV
    public-key space and the ext-UOV public-key space have EQUAL F_q-dimension,
    the induced distribution is not a subvariety, and the matched baseline is
    legitimate. If r = M*ell the descended object is a UOV instance with M*ell
    equations carrying an oil space of A-dimension only M, whose generic existence
    requires V >= M*ell*(M+1)/2 -- a factor ell above the ordinary UOV design
    point -- so either the parameter table is ell times larger than it is, or the
    oil space is a non-generic coincidence and the instance is strictly easier
    than the baseline prices. Both outcomes are useful and one of them invalidates
    the yardstick the whole goal is built on. The measurement is an exact rank
    computation over a finite ring at toy size and costs seconds.

  object_first_candidate:
    tracked_object: >-
      The A-LINEAR SPAN of the descended public quadratic forms, tracked as a
      module rather than as a set: the public key is m = M*ell forms over F_q,
      each of which descends to one symmetric N x N matrix over A, and the object
      followed is the A-submodule of Sym_N(A) they generate, summarised by its
      A-rank r and by the F_q-dimension of the space it lives in. It is the right
      object because the descent is claimed to be a change of presentation, and
      the A-span is the smallest invariant that can tell a change of presentation
      apart from a change of problem.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: every attack family -- direct/Groebner,
      Kipnis-Shamir, reconciliation, intersection, rectangular MinRank and
      support-minors, quantum variants, implementation attacks -- and also the
      CRT/factorization lens of IDEA-20260805-bd8339, which is a different
      mechanism and must not be smuggled in here. This record proposes no attack.
      It audits a REDUCTION that the goal record inherits, which is inventor
      protocol section 8 audits 2 and 3 applied to a statement this program has
      never checked.
    newness_score: >-
      The transfer lemma is elementary once the associativity of the pairing is
      noticed, and the QR-UOV designers surely have it. What is asserted new to
      THIS corpus is (a) that the reduction is stated nowhere in this repository
      with a direction, (b) the isolation of r as the single integer the baseline's
      legitimacy turns on, and (c) the generic-existence threshold
      V >= r(M+1)/2 that converts r into a checkable statement about the parameter
      table. The corpus contribution is not the lemma; it is that the yardstick
      has never been audited before being used.
    testability_score: >-
      Very high. r is an exact rank over a finite commutative ring, computable in
      seconds at toy parameters with no algebra system. The dimension count is
      integer arithmetic. The quantifier audit is pen and paper.
    survival_score: >-
      The transfer lemma is unconditional algebra and survives to any parameters.
      The r measurement survives only as far as the assumed key shape is the
      submitted key shape, which is why stage 0 reads the specification. The
      generic-existence threshold is a dimension count and survives, but it is a
      GENERIC statement and says nothing about a specific designed instance -- a
      limitation stated here rather than discovered later.

  mechanism: >-
    SETUP. A = F_q[t]/(f), deg f = ell, phi the regular representation,
    B(x, y) = coeff_{ell-1}(x*y mod f) the residue pairing, W its Gram matrix.
    From IDEA-20260805-bd8339 (derived there and exhaustively checked at toy
    sizes): B is symmetric, associative (B(a*x, y) = B(x, a*y)) and NONDEGENERATE
    for every monic f, and W*phi(a) is symmetric for every a. N = V + M,
    n = N*ell, m = M*ell. Public matrices are n x n symmetric over F_q with all
    N x N blocks in W*phi(A); the secret oil space O is an A-submodule of A^N of
    A-rank M. THE SHAPE IS RECALLED, UNVERIFIED, exactly as in the companion
    record, and stage 0 pins it down.

    LEMMA T (isotropy transfer; DERIVED HERE). For a symmetric N x N matrix Q over
    A define the F_q-bilinear form beta_Q(u, v) = B(u^T Q v) on A^N =~ F_q^n. Its
    Gram matrix in the F_q basis is exactly the block matrix whose (i, j) block is
    W*phi(Q_ij) -- i.e. beta_Q IS the QR-UOV shape, and the correspondence
    Q <-> P is a bijection between symmetric matrices over A and n x n symmetric
    F_q-matrices with blocks in W*phi(A). Now let O be an A-SUBMODULE of A^N. Then
    beta_Q(u, v) = 0 for all u, v in O IF AND ONLY IF u^T Q v = 0 in A for all
    u, v in O. Proof: the "if" direction is immediate. For "only if", fix
    u, v in O and let c range over A; since O is an A-module, c*u lies in O, so
    0 = beta_Q(c*u, v) = B(c * (u^T Q v)) for every c in A, and nondegeneracy of
    B forces u^T Q v = 0. THIS IS THE ENTIRE HONEST CONTENT OF THE FOLKLORE
    REDUCTION, and note what it needs: it needs O to be a MODULE. Without that
    hypothesis the equivalence fails in the "only if" direction, and the reduction
    is not a reduction. So the descent works because of a design choice, not
    because of a general fact -- which is worth having stated once, in the corpus,
    with the hypothesis visible.

    THE QUANTIFIER AUDIT. Write the folklore out.
    DIRECTION 1 (what the lemma gives): FORALL QR-UOV instances I, EXISTS an
    ext-UOV instance J computable in polynomial time from I, such that any oil
    space of J yields an oil space of I. This bounds QR-UOV's hardness ABOVE by
    ext-UOV's. It is the direction an ATTACKER wants and it is what the lemma
    proves.
    DIRECTION 2 (what a security claim needs): the ext-UOV instances J that arise
    as descents of QR-UOV keys must be, for cost purposes, indistinguishable from
    the ext-UOV instances the baseline cost model prices -- i.e. the descent's
    image must not be a proper, structured, easier subfamily. Formally: FORALL
    cost models C used for the baseline, the image distribution D_descent and the
    generic distribution D_ext must satisfy C(D_descent) >= C(D_ext) - eps.
    NOBODY IN THIS CORPUS HAS STATED DIRECTION 2, LET ALONE CHECKED IT, and
    GOAL-QRUOV-001's objective nevertheless makes "the matched extension-field-UOV
    baseline cost" the quantity everything is compared against. Using a baseline
    without direction 2 is precisely the quantifier trap inventor protocol section
    8 audit 3 is for.

    THE ONE INTEGER. Every public F_q-form descends to a symmetric matrix over A
    by Lemma T, giving M*ell matrices Q_1, ..., Q_{M ell}. Let
    r = dim_A span_A{Q_1, ..., Q_{M ell}} -- the A-module rank of their A-linear
    span. By Lemma T plus module closure, O is isotropic for every element of the
    span, so the descended object is: an oil space of A-dimension M, totally
    isotropic for r quadratic forms in N variables over A. Two values are
    structurally possible and they are the only two, because the M*ell F_q-forms
    are organised into M groups of ell.
      r = M. The ell forms in each group are A-multiples of one another, the
      descended object is UOV over A with N variables and M equations and oil
      dimension M, and this IS the matched baseline. Dimension check, which must
      then also hold: the QR-UOV public key is M * N(N+1)/2 elements of A, i.e.
      M * N(N+1)/2 * ell elements of F_q; a generic ext-UOV public key at
      (F_{q^ell}, N, M) is M * N(N+1)/2 elements of F_{q^ell}, i.e. the SAME
      F_q-dimension. Forced ratio EXACTLY 1. The descent is then dimension-exact,
      the image is not a subvariety, and direction 2 is plausible for the first
      time.
      r = M*ell. The M*ell forms are A-independent, and the descended object is a
      UOV instance with M*ell equations whose oil space has A-dimension only M.
      Then the public key has F_q-dimension M*ell * N(N+1)/2 * ell, which is ell
      TIMES the ext-UOV space, so the descent cannot be dimension-exact and the
      matched baseline is comparing objects of different sizes.
    THE GENERIC-EXISTENCE THRESHOLD, DERIVED, which turns r into a statement about
    the parameter table. A d-dimensional totally isotropic subspace for one
    quadratic form in N variables imposes d(d+1)/2 conditions; the Grassmannian
    Gr(d, N) has dimension d(N - d). For r forms the condition count is
    r*d(d+1)/2, so a totally isotropic subspace of dimension d exists generically
    only when d(N - d) >= r*d(d+1)/2, i.e. N - d >= r(d+1)/2. At d = M and
    N = V + M this reads V >= r(M + 1)/2. With r = M this is V >= M(M+1)/2, the
    ordinary UOV design inequality. With r = M*ell it is V >= M*ell*(M+1)/2 -- a
    factor ell larger. SO: if a declared QR-UOV parameter set has
    M(M+1)/2 <= V < M*ell*(M+1)/2 and the measured r is M*ell, then the secret oil
    module exists where a generic one would not, the instance is a non-generic
    point of the ext-UOV space, and the matched baseline PRICES THE WRONG OBJECT.
    That is a falsifier of the goal's own yardstick, obtained from one rank
    computation and one integer comparison.

    THE OBSERVATION-COLLISION SEARCH (audit 2). The observable the baseline uses
    is the tuple (field, variable count, equation count, oil dimension). The
    collision to hunt is: a descended QR-UOV key and a generically drawn ext-UOV
    key that agree on that observable while differing in attack cost. If r = M the
    observables agree by construction and the collision search reduces to asking
    whether the descended forms are distributed like generic symmetric matrices
    over A -- checkable at toy size by comparing rank profiles, which is a null
    test with a forced answer (generic symmetric matrices over a finite field have
    a known corank distribution) rather than an eyeball comparison.

    THE STABILISER COUNT (a second, independent forced value). The structure-
    preserving changes of variables form GL_N(A), of size q^{ell N^2}(1 + o(1)),
    against GL_n(F_q) of size q^{ell^2 N^2}(1 + o(1)) for the unstructured
    problem. The equivalence class of a QR-UOV key under structure-preserving maps
    is therefore smaller by a factor ell IN THE EXPONENT -- the same factor-of-ell
    that IDEA-20260805-8d9ac0 finds in the oil-space haystack, and the overlap is
    stated here rather than double-counted: THESE ARE THE SAME PHENOMENON SEEN
    TWICE, and neither record may present it as two independent findings.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_checked:
      - ledger/questions/RQ-QRUOV-001.yaml (asserts "the known reduction" with no
        direction, no citation and no quantifier)
      - ledger/goals/GOAL-QRUOV-001.yaml (makes the matched baseline the yardstick)
      - ledger/proposals/IDEA-20260801-015.yaml (assumes neutrality is testable by
        a cost ratio; does not ask whether the baseline is the right object)
      - ledger/ area QRUOV -- empty of hypotheses, experiments, evidence and runs
    what_the_screen_could_not_see: >-
      The QR-UOV papers and the Round-3 specification, none read. If the designers
      state and prove direction 2, this record's contribution collapses to
      recording their statement in the corpus with a locator, which is still worth
      having but must not be presented as a finding.
    conclusion: >-
      Unverified. The auditable object is this program's own inherited premise,
      which is checkable regardless of what the designers wrote.

  literature_context:
    - >-
      QR-UOV construction and its reduction to UOV over an extension field. NOT
      READ -- relayed. RQ-QRUOV-001 itself records that the specification has not
      been read and that every per-scheme technical claim is a target to verify.
      This record inherits that status and does not improve it by assertion.
    - >-
      KN-OPEN-027 (superseded by KN-OPEN-028) records the complexity ceiling that
      SLIP lies in AM intersect coAM, hence is not as hard as SVP unless the
      polynomial hierarchy collapses, and the 2026-08-05 scouting brief lists
      GOAL-QRUOV-001 among the goals for which an isomorphism/equivalence-flavoured
      hardness assumption would make that ceiling relevant. THIS RECORD DOES NOT
      CLAIM THE CEILING APPLIES TO QR-UOV. Oil-space recovery is a hidden-subspace
      problem, not obviously an equivalence problem, and asserting the transfer
      without an argument would be exactly the kind of relayed inference the
      corpus is full of. It is recorded as a question stage 3 may look at, with the
      burden on whoever wants to use it.

  lossy_projection_identifiability_audit:
    projection: >-
      QR-UOV public key -> (r, the A-rank of the A-span of the descended forms;
      the F_q-dimension of the descended public-key space; the corank profile of
      the descended forms).
    what_is_discarded: >-
      Every coefficient. What survives is one small integer, one dimension count,
      and a distribution summary.
    why_genuinely_lossy: >-
      Completely: the fibre over a value of r is essentially the whole key space
      at those parameters.
    why_compatible_with_the_operations: >-
      r is invariant under every structure-preserving change of variables
      (elements of GL_N(A) act by congruence and do not change the A-span's rank)
      and under any A-linear recombination of the public forms -- which is the
      full symmetry group of the presentation. So it propagates deterministically
      through exactly the operations the descent and any A-linear attack perform.
    is_it_only_a_change_of_coordinates: >-
      NO to the (Delta, Pi) failure -- nothing is recoverable from r. The MIRROR
      failure is the one that must be checked and IS checked, with an honest
      answer: r takes only TWO possible values, so the comparator spread is one
      bit, and for a FIXED scheme it will be constant across all keys. That is
      near-maximal lossiness and it would ordinarily be the disqualifying "zero
      spread" tell. It is nonetheless the right object here, and the reason is
      stated so a reviewer can reject it: the audit is not trying to distinguish
      KEYS, it is trying to distinguish two possible READINGS OF A REDUCTION, and
      for that purpose one bit is exactly the right amount of information provided
      the bit is decisive. Its decisiveness is what the generic-existence
      threshold V >= r(M+1)/2 supplies -- without that threshold, r would be a
      constant with no consequence attached and this audit would be the mirror
      failure in full.

  assumptions:
    - >-
      The QR-UOV key shape and the module property of O. RECALLED, UNVERIFIED. If
      O is not an A-module then Lemma T's "only if" direction fails, the folklore
      reduction is not proved by this argument, and the audit's finding is that
      the corpus's inherited premise has no derivation at all -- which would be a
      sharper outcome than either value of r.
    - >-
      The organisation of the m = M*ell public F_q-forms into M groups of ell.
      This is what makes r in {M, M*ell} rather than an arbitrary integer between
      them. If the grouping is different, r is measured anyway and the two-value
      pre-registration is reported as falsified, which is itself informative.
    - >-
      The generic-existence threshold is a DIMENSION count and therefore a
      statement about generic instances. A designed instance may sit off the
      generic locus by construction; the threshold detects that it does, it does
      not by itself prove an attack.

  predictions:
    - metric: >-
        r -- the A-module rank of the A-linear span of the descended public forms,
        measured exactly at toy parameters over at least 20 independent keys per
        parameter cell
      direction: different
      minimum_effect: >-
        EXACTLY M, or EXACTLY M*ell. Both values are pre-registered before any
        measurement and both have a decisive consequence attached above. Any third
        value falsifies the grouping assumption and redirects the audit. The
        prior stated here, before measuring: r = M, because r = M*ell would force
        V >= M*ell*(M+1)/2 and would make QR-UOV's parameter sets ell times larger
        than a UOV designer would choose.
    - metric: >-
        pk_dimension_ratio -- F_q-dimension of the QR-UOV public-key space divided
        by F_q-dimension of the ext-UOV public-key space at (F_{q^ell}, N, M)
      direction: different
      minimum_effect: >-
        EXACTLY 1.000 if r = M; EXACTLY ell if r = M*ell. Computed in integer
        arithmetic before any run. A ratio equal to neither means the descent is
        not the bijection Lemma T claims and Lemma T is wrong.
    - metric: >-
        generic_existence_margin -- V - r(M + 1)/2 at each declared QR-UOV
        parameter set, for the MEASURED r
      direction: higher
      minimum_effect: >-
        Predicted >= 0 (the parameter set sits on or above the generic locus). A
        NEGATIVE margin at a declared set is the falsifier of the goal's yardstick:
        the secret oil module then exists where a generic one would not, and the
        matched baseline prices the wrong object.
    - metric: >-
        descended_corank_KS_distance -- Kolmogorov-Smirnov distance between the
        corank distribution of the descended forms over A and that of uniformly
        random symmetric matrices over A of the same size, over >= 200 samples
      direction: lower
      minimum_effect: >-
        Below 0.10 at the declared sample size if the descent's image is generic.
        A larger distance means the descended forms are a structured subfamily and
        direction 2 of the quantifier audit is in doubt regardless of r.
    - metric: >-
        stabiliser_exponent_ratio -- log_q|GL_n(F_q)| divided by log_q|GL_N(A)|
      direction: higher
      minimum_effect: >-
        EXACTLY ell, up to the o(1) in both counts. Reported as the SAME
        phenomenon as IDEA-20260805-8d9ac0's haystack factor and never counted as
        an independent second finding.

  minimal_test:
    design: >-
      Four stages, cheapest first; stage 1 can end the line. STAGE 0 (reading,
      zero compute): obtain the QR-UOV specification; record verbatim, with a
      locator, (a) whether O is an A-module, (b) how the M*ell public forms are
      organised, (c) whether the designers state the reduction and in which
      direction, (d) the parameter table. If the designers prove direction 2, SAY
      SO, record the locator, and reduce this record to a corpus entry rather than
      running the rest. STAGE 1 (pen and paper, zero compute): write Lemma T out
      in full, check the "only if" step against the module hypothesis, and compute
      the two dimension counts and the generic-existence threshold in integer
      arithmetic. If the dimension counts do not agree with Lemma T's bijection,
      stop. STAGE 2 (seconds, pure Python, no algebra system): build toy QR-UOV
      keys at q in {7, 11}, ell in {2, 3, 4}, M in {2, 3}, V in {4, 6, 8}, descend
      them, and measure r by exact rank over A; measure the corank distribution of
      the descended forms against a matched random-symmetric-over-A null. STAGE 3
      (zero compute): evaluate the generic-existence margin at every declared
      parameter set for the measured r, and write the quantifier statement out in
      both directions with what is proved and what is not.
    controls:
      - >-
        NULL OBJECT (must be able to fail). A MATCHED RANDOM KEY: n x n symmetric
        F_q matrices whose blocks are drawn uniformly from W*phi(A) with NO secret
        oil module planted, same q, ell, N, M, same descent code. Forced value
        derived before the run: r takes the same value as the treatment arm (r is a
        property of the presentation, not of the secret), and the corank
        distribution matches the generic one. This null CAN fail: if r differs
        between planted and unplanted keys, then r leaks the presence of a secret,
        which would be a far more interesting result than either pre-registered
        value and must be reported as the headline.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the effect MUST appear). A HAND-BUILT
        instance with r deliberately set to M*ell -- construct M*ell A-independent
        symmetric matrices over A directly and use them as the public forms. The
        rank instrument MUST report r = M*ell here. If it does not, the rank code
        cannot see A-independence and no measurement from any other arm may be
        reported. A second positive control with r deliberately set to M, built by
        taking M forms and their A-multiples, MUST report r = M.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Build
        instances with r planted at 1, 2, ..., M*ell by taking that many
        A-independent generators, and report measured r against planted r across
        the whole ladder. A single measured value that fails to track the planted
        one localises the instrument's blind spot instead of leaving "the rank
        looked wrong".
      - >-
        ARCHIVE CHECK, zero compute. Prior measurements of r, of the descended
        corank distribution, or of the stabiliser count anywhere in this program:
        NONE. Area QRUOV is empty of runs. Recorded as an absence, not as a passed
        check.
      - >-
        ORDERING CONTROL. The null arm and both positive controls are run and
        hash-committed before any treatment key is descended.
    required_metrics:
      - measured r per key, per cell, with the exact rank routine named and its ring arithmetic pinned
      - the two F_q-dimension counts and their ratio, in exact integers
      - generic-existence margin V - r(M+1)/2 per declared parameter set
      - corank distribution of descended forms and of the matched null, with the KS statistic
      - planted-versus-measured r ladder across the graded control
      - verbatim quotation, with locator, of the specification's statement of the reduction, or a recorded failure to obtain it

  falsification_conditions:
    - >-
      Measured r is neither M nor M*ell. The grouping assumption is wrong; the
      two-value pre-registration is falsified and the audit is redirected rather
      than reinterpreted.
    - >-
      The public-key dimension ratio is neither 1 nor ell. Lemma T's bijection is
      wrong and the derived half of this record must be withdrawn as a superseding
      record.
    - >-
      r differs between the planted and the matched-random null arms. r leaks the
      secret's presence; this record's framing is wrong and the correct object is a
      distinguisher, which is a different and larger claim requiring its own
      contract.
    - >-
      Either positive control fails to report its planted r. NOTHING MAY BE
      REPORTED FROM ANY OTHER ARM.
    - >-
      Stage 0 finds the designers state and prove direction 2 with a cited
      argument. The audit's premise is void; record the locator and stop.

  confounders:
    - >-
      RING ARITHMETIC. Rank over A is not rank over a field when f is reducible or
      non-squarefree. This audit is scoped to f IRREDUCIBLE (so A is a field and
      "rank" is unambiguous); the reducible case belongs to
      IDEA-20260805-bd8339 and mixing them would confound both.
    - >-
      SMALL-SAMPLE CORANK STATISTICS. Corank distributions over small fields are
      lumpy; the KS threshold is declared at a stated sample size and a cell below
      that size is reported as uninformative rather than as agreement.
    - >-
      GENERIC VERSUS DESIGNED. The existence threshold describes generic
      instances. A designed instance sitting off the generic locus is the SIGNAL
      here, not a confounder -- but it must never be described as an attack, only
      as a mismatch between the object and the baseline that prices it.
    - >-
      AUDITING ONE'S OWN PROGRAM IS CHEAP AND FLATTERING. Finding that an
      inherited premise is unstated is easy to produce and reads as rigour. The
      graded control and the two positive controls exist so that the measurement
      half has to work before the rhetorical half is believed.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED AND NO EXPONENT IS MOVED. The deliverable is a proved
      transfer lemma, a quantifier statement with its gap named, one measured
      integer, and a threshold comparison. If the outcome is r = M with a
      non-negative margin, THE HONEST RESULT IS THAT THE MATCHED BASELINE IS
      LEGITIMATE -- a result that makes the scheme look better, which is half of
      GOAL-QRUOV-001's own second completion horn and must be reported with the
      same weight as the other half.
    - >-
      TOY TIER. Every measurement is at q <= 11 and ell <= 4. r is a structural
      integer whose value at toy size is evidence about the CONSTRUCTION and not
      about a deployed parameter set; the dimension counts and the threshold are
      exact at any size, but the corank statistics are toy and are labelled toy.
    - >-
      Scoped to f irreducible throughout.
    - >-
      The AM-intersect-coAM ceiling of KN-OPEN-027/028 is NOT applied here and no
      claim is made that it transfers to QR-UOV. Anyone wishing to use it owes the
      argument that oil-space recovery is an equivalence problem.

  heuristic_assumptions:
    - id: HEUR-QRUOV-ID-1
      statement: >-
        FORALL (N, M, r) with r*M(M+1)/2 <= M(N - M), a totally isotropic
        M-dimensional subspace for r generic quadratic forms in N variables over a
        finite field exists with probability bounded away from 0 as the field
        grows, and FORALL (N, M, r) violating the inequality it exists with
        probability tending to 0.
      rigorous_support: >-
        The dimension count is exact: Gr(M, N) has dimension M(N - M) and total
        isotropy for r forms imposes r*M(M+1)/2 conditions. The passage from a
        dimension count to a probability statement over a FINITE field is the
        heuristic step and is NOT rigorous as stated -- Lang-Weil-type control is
        needed and is not supplied here.
      validation_plan: >-
        Measure directly at toy sizes: for each (N, M, r) on both sides of the
        threshold, sample r random symmetric matrices over A and search
        exhaustively for an M-dimensional totally isotropic subspace at the
        smallest feasible cell, reporting the empirical existence rate against the
        threshold's prediction. A threshold that does not separate the two regimes
        at toy size is reported as unvalidated and the generic-existence argument
        is downgraded to a heuristic in every downstream statement.
    - id: HEUR-QRUOV-ID-2
      statement: >-
        The corank distribution of a uniformly random symmetric matrix over a
        finite field F of size Q is the standard one, so that a KS comparison
        against it is a valid genericity test for the descended forms.
      rigorous_support: >-
        Classical for symmetric matrices over finite fields; NOT retrieved and NOT
        cited here, and therefore treated as a candidate to check rather than an
        authority. Note the characteristic-2 caveat: symmetric and alternating
        matrices differ in char 2, and q = 16 or 256 would put QR-UOV in char 2,
        where the wrong reference distribution would silently invalidate the test.
      validation_plan: >-
        Build the reference distribution EMPIRICALLY from sampled random symmetric
        matrices over the same A in the same code path, rather than from a recalled
        formula. This makes the test self-calibrating and removes the citation
        dependence entirely.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- no algorithm and no exponent. The exponent under audit
      is the baseline's ell*(V - M); this record asks whether that baseline prices
      the right object, not whether the exponent can be beaten.
    memory_exponent: n/a
    best_known: >-
      The matched extension-field-UOV baseline, whose legitimacy is exactly what is
      being audited -- which is why the field cannot be filled with a number here
      without begging the question.
    hidden_overhead: n/a
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed). No attack is proposed, so no attack frontier can
    dominate this. ROWS CHECKED before setting the field, since an unchecked null
    is a fabrication under rule 5 -- TIME, MEMORY and DATA/QUERIES were each
    examined for a prior record that audits the QR-UOV-to-ext-UOV reduction's
    direction or measures the A-rank of the descended span: the ledger (area
    QRUOV is empty of hypotheses, experiments, evidence and runs), the proposal
    ledger (only IDEA-20260801-015, which presupposes the baseline rather than
    auditing it), and the 2026-08-05 merged scouting brief (family F7 lists no such
    audit anywhere in the corpus). The QR-UOV papers were NOT checked because they
    were not read, and that gap is the dominant uncertainty in this field's value.
  sota_delta: >-
    No attack; the delta is evidentiary and is quantified by what the audit
    changes. If r = M and the margin is non-negative, the program gains a DERIVED
    rather than inherited licence to use the matched baseline, and the transfer
    lemma with its module hypothesis becomes citable -- delta on every attack axis
    exactly 0. If r = M*ell and some declared set has V < M*ell*(M+1)/2, then the
    goal's yardstick is wrong by a factor of ell in the equation count, every cost
    comparison built on it is void, and the delta is that the entire measured
    programme of GOAL-QRUOV-001 would have to be rebuilt on a corrected baseline.
    The asymmetry between a near-zero-cost audit and that second outcome is the
    reason to run it.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that the audit reaches a decisive reading of r and produces its stated
    deliverable, because stages 1 and 3 are pen and paper and stage 2 is seconds
    of exact linear algebra over a small ring. Much lower, 0.10, that the audit
    OVERTURNS the baseline (r = M*ell with a negative margin): the pre-registered
    prior above says r = M, and a designer choosing V smaller than the generic
    threshold by a factor ell would be an unusual oversight in a Round-3
    submission. It is not lower than 0.10 because this program has never checked
    the premise at all, because RQ-QRUOV-001 itself flags every per-scheme claim
    as unverified, and because the 2026-08-05 red-team record DEC-20260805-2be965
    found four of five of another goal's named obstructions defective on audit --
    inherited premises in this repository have a measured failure rate that is not
    small. It is not higher because the arithmetic already points the other way.
