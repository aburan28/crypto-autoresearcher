idea:
  id: IDEA-20261002-adb7bb
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    AT MATCHED dim(V·V), DOES A GEOMETRIC-PROGRESSION V BEAT A RANDOM
    SUBSPACE ON ENCODE N_var? On binary toys n∈{17,19,23} with frozen ℓ∈{3,4},
    pair each geometric-progression V with a random dim-ℓ subspace whose
    dim(V·V) matches within ±1, and test whether GP encode N_var is ≤ (1−δ)
    of the matched random N_var (δ frozen).

  class: heuristic_validation

  claim: >-
    KR-IC-73db3f recommends choosing V so product spaces are small and names
    geometric-progression subspaces as a construction; it does not freeze a
    head-to-head δ band of encode N_var for GP vs random at matched dim(V·V).
    CLAIM: for each (n,ℓ)∈{17,19,23}×{3,4}, across ≥8 matched pairs, the
    median ratio N_var(GP)/N_var(random_matched) ≤ 1−δ with δ frozen at
    Stage 0 — OR the band fails and is recorded as GP-not-cheaper-at-matched-
    product-dim at this scale. CLAIM TIER: heuristic_validation. NO break.
    NO exponent. NO n≥131 transfer. Distinct from IDEA-20261001-febbe1
    (correlation of dim(V·V) with N_var inside one family), fbee3f / 11aa69
    (usable_dimensions emptiness), and 880180 (poly vs normal basis).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V either a geometric-
    progression F_2-subspace or a random dim-ℓ subspace; Operation: encode
    descended S_3 PDP under a shared XOR-SAT/encoder pin (KR-IC-5765d2 /
    KR-IC-5a43e5) and read N_var; Observable: median ratio of N_var across
    matched pairs with |dim(V·V)_GP − dim(V·V)_rand| ≤ 1. Trichotomy: Class I
    instrument (construction-family meter). Lossy-projection: N_var discards
    which variables are hard; null is a pair of independently drawn random
    subspaces matched only on dim(V), for which the GP advantage must vanish.
    OFF-LIMITS: correlating dim(V·V) alone (febbe1); emptiness gates; solver
    races; basis-name swaps (880180). WHAT IS NEW: a frozen δ band for GP vs
    random at matched product dimension.

  novelty_status: unverified
