  assumptions:
    - Frozen ℓ, δ, seeds, encoder pin, and matching rule |Δ dim(V·V)| ≤ 1.
    - Encoder already admitted or cell is failed_infrastructure (do not provision).
    - GP advantage ≠ usable_dimensions emptiness ≠ basis-name swap.
    - Ratio ≤ 1−δ ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-adb7bb-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: across ≥8 matched GP/random pairs with
        |dim(V·V)_GP − dim(V·V)_rand| ≤ 1, median N_var(GP)/N_var(rand) ≤ 1−δ
        with δ frozen at Stage 0.
      random_model_justification: >-
        Rigorous: KR-IC-73db3f argues that structured V with small products
        reduce descended variable count. Classical: if product dimension is
        the dominant driver of N_var, matching dim(V·V) should erase most of
        the GP advantage and the residual δ-band tests leftover construction
        structure; if encoder artifacts dominate instead, the band fails.
        The δ band is the pre-registered transfer hypothesis at toys — not a
        claim that GP V beats rho.
      supporting_results:
        - KR-IC-73db3f
        - KR-IC-5765d2
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        Median ratio > 1−δ at a completed cell (GP-not-cheaper-at-matched-
        product-dim), OR encoder absent (infrastructure stop), OR fewer than
        8 matchable pairs after the budgeted catalog (inconclusive; expand
        or stop).

  predictions:
    - metric: median_Nvar_ratio_GP_over_random
      direction: upper_bounded
      minimum_effect: '≤ 1−δ at each (n,ℓ) cell'
    - metric: matched_pair_count
      direction: lower_bounded
      minimum_effect: '≥ 8 matched pairs per cell'
    - metric: null_random_vs_random_ratio
      direction: near_one
      minimum_effect: 'null median ratio ∈ [1−ε, 1+ε] with ε frozen'

  minimal_test: >-
    Stage 0: freeze ℓ∈{3,4}, δ, ε, seeds, encoder pin, matching rule.
    Stage 1: n=17 — build ≥8 GP/random matched pairs; report median ratio.
    Stage 2: n∈{19,23} + random-vs-random null. Budget: ≤6 CPU-hours.
    Stop if encoder / toy cell absent (IMP, never evidence; do not provision).

  controls:
