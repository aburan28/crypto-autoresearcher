idea:
  id: IDEA-20260815-b75668
  question_id: RQ-FIND-001
  added: '2026-08-15'
  title: >-
    THIS PROGRAM'S FINDINGS CORPUS IS PROMOTED FROM EVIDENCE BY A GATE THAT
    NOBODY HAS AUDITED: check every KN-FIND entry against the evidence it
    claims to rest on
  class: control

  claim: >-
    Knowledge promotion turns evidence into a durable finding that later
    work cites without re-reading the evidence. If a finding overstates its
    evidence, every downstream citation inherits the overstatement and the
    error compounds silently. Checking each KN-FIND entry against its cited
    evidence records is a bounded audit of the corpus's most load-bearing
    layer.

  mechanism: >-
    For each KN-FIND entry, retrieve its cited evidence records and check
    that the finding's claim tier, scope and parameters do not exceed what
    the evidence supports. Report per-entry agreement, overstatement, or
    unsupported citation.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep the findings directory and the knowledge-promotion gate in the
      review-evidence lifecycle; check for any existing audit of
      promotions.
    results: >-
      The knowledge corpus has 72 findings entries and a declared
      promotion gate; no record audits promoted findings against their
      evidence.
    verdict: >-
      ADAPTATION. Auditing derived claims against sources is elementary;
      that the program's most-cited layer has never had it is what makes
      this worth doing.

  object_first_candidate:
    tracked_object: >-
      EACH PROMOTED FINDING'S CLAIM, checked against the evidence records
      it cites.
    lossiness: >-
      A finding compresses evidence into a citable statement, and the
      audit measures how lossy that compression was.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while findings cite specific evidence records; findings
      citing nothing specific are the audit's most important category.

  null_object_control: >-
    NULL 1 -- a finding whose evidence is known to support it exactly, which
    must audit clean; if it does not, the audit criterion is too strict.
    NULL 2 -- a deliberately overstated test claim, which must be flagged.

  discriminated_from:
    - >-
        The citation-verification audit in this series, which checks
        literature citations against external sources; this checks
        internal findings against internal evidence, which is a different
        and more tractable question.
    - >-
        The review-evidence lifecycle's promotion gate, which this audits
        rather than replaces.

  assumptions:
    - >-
        Findings cite evidence records specifically enough to check; those
        that do not are the audit's key finding.
    - >-
        Claim tier and scope are comparable between a finding and its
        evidence, which the record schemas should make possible.

  predictions:
    - metric: >-
        clean-finding null
      direction: different
      minimum_effect: >-
        FORCED clean; a flag here means the criterion is too strict.
    - metric: >-
        deliberately overstated claim
      direction: different
      minimum_effect: >-
        FORCED flagged.
    - metric: >-
        count of findings exceeding their evidence
      direction: different
      minimum_effect: >-
        The deliverable; any overstatement propagates to everything
        citing it.
    - metric: >-
        count of findings citing no specific evidence
      direction: different
      minimum_effect: >-
        Reported separately; these cannot be audited and their standing
        is unclear by construction.

  minimal_test:
    design: >-
      All 72 findings entries, both nulls first.
    controls:
      - >-
          Clean-finding and overstated-claim nulls.
      - >-
          Claim tier and scope compared field by field, not
          impressionistically.
      - >-
          Findings citing no specific evidence reported as a distinct
          category.
    required_metrics:
      - >-
          Per-finding verdict with the specific evidence records
          checked.
      - >-
          Counts of overstated and unauditable findings.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        A null misbehaves. The audit criterion is miscalibrated; fix
        before running.
    - >-
        Several findings exceed their evidence. Corrections must supersede
        them per AGENTS.md rule 2, and everything citing them needs
        review.
    - >-
        Many findings cite no specific evidence. The promotion gate is not
        producing traceable findings, which is a process finding
        independent of any individual claim.
    - >-
        All findings audit clean. The promotion gate works and the
        corpus's most-cited layer is sound, which is worth establishing
        rather than assuming.

  confounders:
    - >-
        CRITERION STRICTNESS: an over-strict criterion flags reasonable
        compressions as overstatements and would generate pointless
        corrections; the clean-finding null calibrates against that.
    - >-
        SCOPE LANGUAGE: findings and evidence use different scope
        vocabularies, so comparison requires judgement that must be
        recorded per entry rather than applied silently.

  interpretation_limits:
    - >-
        Audits internal consistency; establishes nothing mathematical.
    - >-
        Scoped to findings citing specific evidence.
    - >-
        An overstatement is corrected by superseding record, never by
        editing the original.

  heuristic_assumptions:
    - id: HEUR-FIND-1
      statement: >-
        A promoted finding's claim can be compared field by field
        against its cited evidence records to detect overstatement.
      rigorous_support: >-
        Rigorous ingredient: both record types carry declared claim
        tiers, tested parameters and scope statements per the templates,
        so the comparison is structured rather than impressionistic. THE
        GAP: schema adherence has varied across the campaign's history,
        and older records may lack the fields the comparison needs --
        which is exactly where overstatement is most likely to have
        occurred.
      falsification_condition: >-
        A finding whose fields cannot be compared against its evidence
        because either record lacks them.
      validation_plan: >-
        SAMPLE: all 72 findings. COMPARISON: field-by-field, with
        judgement calls recorded per entry. TAIL CHECK: the oldest
        findings, where schema adherence is weakest. TRANSFER: none;
        each finding is audited individually.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is manual comparison per finding, which is
      the dominant and irreducible effort.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent audit exists; the promotion gate is specified in the
      lifecycle but its output has not been checked.
    hidden_overhead: >-
      Older findings may predate the schema fields the comparison relies
      on, which is where the audit is both hardest and most needed.
    tradeoff_note: >-
      Auditing the findings layer is bounded work and protects everything
      that cites it; leaving it unaudited lets any overstatement compound
      silently.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As mathematics: nothing. As an audit of the
    promotion gate's output: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a per-finding check of the
    corpus's 72 promoted findings against the evidence they cite, with
    counts of overstatements and of findings too unspecific to audit,
    covering the layer most downstream work cites without re-reading.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that most findings cite evidence specifically enough to check. 0.85
    that the nulls calibrate the criterion. 0.35 that at least one finding
    materially exceeds its evidence, which would require a superseding
    correction and a review of everything citing it.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
