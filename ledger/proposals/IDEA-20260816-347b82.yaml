idea:
  id: IDEA-20260816-347b82
  question_id: RQ-UOV-001
  added: '2026-08-16'
  title: 'One core, four transforms, sixteen composites: a zero-compute audit table stating for each
    ordered pair of the whipping, quotient-ring, noncommutative-ring and seed-compression transforms
    whether the composite is defined, what parameter triple and coefficient algebra it produces, and
    which composites are degenerate.'
  class: composition
  claim: '(A) MAYO, QR-UOV, SNOVA and seed-compressed UOV are one core plus four different structure-adding
    transforms. The program''s four goals treat them as four schemes, and every in-repo proposal so
    far studies one transform at a time. The transforms are, however, operations on the same kind
    of object, so they compose, and the composition table is a finite object with sixteen ordered
    cells that can be filled in with no compute at all. (B) The claim under test is that the table
    is not uniform: exactly the cells whose two transforms act on the same slot are undefined or degenerate,
    and the cells whose transforms act on different slots compose freely. Concretely, whipping acts
    on the variable count and oil dimension, leaving the coefficient ring alone; the quotient-ring
    and noncommutative-ring transforms both act on the coefficient ring, so their composite is either
    undefined or collapses to a single ring; seed compression acts on the representation of the key
    rather than on the map, so it composes with everything and changes no parameter triple. The prediction
    is therefore: whipping composes freely with all three in both orders, the QR and SNOVA transforms
    do not compose with each other nontrivially, and seed compression is a free right and left factor.
    (C) The deliverable is a table with a stated status per cell, plus for each defined cell the composite''s
    parameter triple and coefficient algebra written out. Its use is as a map of unexplored objects:
    any defined-but-unpopulated cell names a scheme-shaped object nobody in this repository has looked
    at. (D) NOT CLAIMED: no cell is claimed secure or insecure, no attack is proposed against any
    composite, and the existence of a composite is not a suggestion that anyone should build it. In
    particular a degenerate cell is not evidence against either of its factors, and this table asserts
    nothing about what any published scheme does.'
  mechanism: 'STAGE 1, slot decomposition, no compute. Write a UOV-family object as a tuple (coefficient
    algebra A, variable count n over A, equation count m, oil module rank o, key representation R).
    Each transform is then a map on this tuple: Whip_k multiplies n and o by k; QR replaces A = F_q
    by F_q[t]/(f) with a compatibility pairing; SNOVA replaces A by a matrix algebra or by F_q[S];
    Seed replaces R by a seed plus expansion rule with the tuple otherwise fixed. STAGE 2, fill the
    table. For each ordered pair compute the composite tuple by function composition and record: defined,
    defined-but-degenerate (the composite equals one factor), or undefined (the two transforms demand
    incompatible values in the same slot). STAGE 3, adjudicate the contested cells. QR after SNOVA
    and SNOVA after QR are the interesting cells: both write to the algebra slot, so the composite
    is a tensor product of algebras, which either is again a valid coefficient algebra for the core
    or is not, depending on whether the pairing survives. Decide this symbolically. STAGE 4, verification
    by construction at tiny parameters. For every cell marked defined, actually build one instance
    at the smallest possible parameters and check that a planted oil module is annihilated by the
    composite public map, which is a certificate the run wrapper re-verifies. A cell that cannot be
    constructed is downgraded from defined to open, and the failure is recorded with its reason.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-UOV-001, RQ-MAYO-001, RQ-QRUOV-001, RQ-SNOVA-001 in full. Read H-QRUOV-e8ae3e
      and H-SNOVA-ec84c2 statements for the algebra-slot formulations. Extracted titles of all ~35
      multivariate-slice proposals via grep -rilE 'mayo|snova|oil.and.vinegar|QR-UOV|whipping' over
      ledger/proposals/. Ran a specific grep for 'composition table' over ledger/proposals/ (single
      hit, IDEA-20260807-63056d, outside this bucket).
    results: 'IDEA-20260808-2b4581 is the closest record: a structure-discount ledger that, for each
      UOV-descended scheme, computes the cost of a matched plain UOV at its flattened parameters and
      subtracts the best-known attack. It is cross-scheme but it is a COST table over the four schemes
      as they exist, not a composition table over the transforms, and it has no cell for a composite
      object. IDEA-20260807-b63f08 observes that four Round-3 goals declare a shared plain-UOV accounting
      basis a prerequisite that does not exist and that three hypotheses each derived their own; that
      is about a missing shared baseline, not about composing transforms. IDEA-20260805-70aa6e and
      H-SNOVA-ec84c2 formalize SNOVA''s oil space as a module over an algebra, which supplies the
      algebra slot used here. No record composes any two of the four transforms.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; composites of these transforms
      may or may not be described somewhere and this program cannot check. Assembled from known parts:
      the slot decomposition uses H-SNOVA-ec84c2''s algebra framing and H-QRUOV-e8ae3e''s quotient-ring
      framing, and the whipping edge is IDEA-20260805-258212''s dilation. Claimed new relative to
      the in-repo corpus only: treating the four transforms as composable arrows and producing the
      sixteen-cell table with a defined/degenerate/undefined status and a construction certificate
      per defined cell.'
  object_first_candidate:
    tracked_object: The transform itself, as a map on the tuple (coefficient algebra, variable count,
      equation count, oil module rank, key representation); and derivatively the composite tuple produced
      by each ordered pair.
    lossiness: 'Lossy, and the discarded part is most of the mathematics. From a full scheme we retain
      five slots and nothing else: not the specific quotient polynomial, not the emulsifier, not the
      seed expander, not any coefficient. This is compatible with the operation being tracked because
      composition of transforms acts on the slots by composition of slot-maps, so the retained tuple
      propagates deterministically under composition even though the discarded detail does not. The
      honest caveat, stated: for the QR-after-SNOVA cell the slot abstraction is NOT obviously sufficient,
      because whether the composite algebra admits the required pairing depends on discarded detail;
      that cell is therefore where the projection may fail, and the mechanism''s Stage 3 exists precisely
      to find out.'
    propagation: 'One step of the target operation is applying one transform. Propagation rule on
      the tuple: Whip_k : (A, n, m, o, R) -> (A, k n, m, k o, R); QR_f : (F_q, n, m, o, R) -> (F_q[t]/(f),
      n, m, o, R) with F_q-dimensions multiplied by deg f on flattening; SNOVA_ell : (F_q, n, m, o,
      R) -> (A_ell, n, m, o, R) with A_ell an ell-dimensional algebra; Seed : (A, n, m, o, R) -> (A,
      n, m, o, seed-expanded R). Composites are computed by applying these in order, and the flattened
      F_q parameter triple of any composite is a product of the individual multipliers, which is a
      forced arithmetic prediction per cell.'
    survival_score: 'Survives to composition depth two by construction and, for the freely-composing
      cells, to arbitrary depth as a monoid word. It dissolves at exactly the algebra-slot collision:
      two transforms writing the same slot cannot both be described by the tuple, and that is the
      concrete boundary. Stated as a number: 16 cells audited, of which at most 2 are predicted to
      fail the abstraction.'
  null_object_control: The null object for each defined cell is a UOV-shaped object with the composite's
    FLATTENED parameter triple over F_q but with no algebra structure at all - a plain random UOV
    with a planted oil space of the same F_q-dimension - constructed in the same invocation by the
    same code path. The null must show that the annihilation certificate verifies there too, which
    proves the certificate checker is not itself detecting structure; and it must show that the composite's
    public map is NOT reproducible by the null construction, which is what makes the composite a distinct
    object rather than a relabelled plain UOV. If the null and the composite are indistinguishable
    as objects, the cell is reported as degenerate, which is a legitimate and informative outcome.
  discriminated_from:
  - 'IDEA-20260808-2b4581 (structure-discount ledger): a cost table over four existing schemes; this
    is a definitional table over sixteen composite objects, most of which are not schemes anyone has
    built, and it produces no cost numbers at all.'
  - 'IDEA-20260807-b63f08 (missing shared plain-UOV accounting basis): identifies a missing KN-TECH
    baseline entry; this proposal does not supply that baseline and does not need it, since it computes
    no attack cost.'
  - 'H-SNOVA-ec84c2 (counting free rank-k A-submodules): supplies the algebra-slot vocabulary and
    counts oil objects for a fixed algebra; this composes algebras and asks which composites exist,
    a prior question to counting.'
  - 'IDEA-20260805-258212 (whipping as dilation): one row of the table; the other fifteen cells are
    not in it.'
  - 'H-QRUOV-e8ae3e (CRT split of the quotient-ring block algebra): describes the internal structure
    of one algebra-slot value; the table asks what happens when a second transform writes the same
    slot afterwards.'
  assumptions:
  - The five-slot decomposition captures each transform up to the detail needed for composition; the
    mechanism's Stage 3 explicitly tests this for the contested cells rather than assuming it.
  - The recalled definitions of all four transforms are correct in shape; every cell inherits that
    risk and the table is void where a definition is wrong.
  - A planted oil module annihilated by the composite public map is an adequate existence certificate
    for a cell being defined.
  - Tiny parameters suffice to exhibit existence, since existence is a construction question and not
    a cost question.
  predictions:
  - metric: number of the sixteen ordered cells marked defined
    direction: different
    minimum_effect: 'forced value: 14 defined, with the two cells QR-after-SNOVA and SNOVA-after-QR
      predicted degenerate or undefined; any other count falsifies the slot-collision rule'
  - metric: flattened F_q parameter triple of each defined composite versus the product of the individual
      multipliers
    direction: different
    minimum_effect: 'forced value: exact agreement in every defined cell, with any discrepancy reported
      as a construction error'
  - metric: annihilation certificate verification rate over constructed instances in defined cells
    direction: different
    minimum_effect: forced value 1.0; a single failure downgrades that cell from defined to open
  - metric: number of defined cells that are unpopulated in this repository, i.e. correspond to no
      existing proposal or hypothesis
    direction: higher
    minimum_effect: 8
  minimal_test:
    design: 'Two hours of paper plus one short script. On paper, write the five-slot map for each
      of the four transforms and compose all sixteen ordered pairs, recording a status per cell; this
      alone produces the table and costs no compute. Then, for each cell marked defined, construct
      one instance at the smallest parameters that make it nontrivial - q = 4, base n = 4, m = 2,
      o = 1, whipping k = 2, quotient degree deg f = 2, SNOVA ell = 2 - plant an oil module, build
      the composite public map, and verify by exhaustive evaluation over all q^{flattened n} inputs
      in the oil module that the map vanishes there. At these sizes exhaustive verification is a few
      thousand evaluations per cell. The discrimination is complete: a cell whose instance builds
      and whose planted module is annihilated is defined; a cell that cannot be built is open with
      a recorded reason; a cell whose composite public map is indistinguishable from the plain-UOV
      null construction is degenerate.'
    controls:
    - Plain-UOV null at each composite's flattened parameter triple, constructed by the same code
      in the same invocation, with the certificate checker run against it to prove the checker is
      not structure-sensitive.
    - 'Identity-transform control: compose each transform with the identity in both orders and confirm
      the tuple is unchanged, catching slot-map bugs before any real cell is read.'
    - 'Degenerate-parameter control: whipping with k = 1, quotient with deg f = 1, SNOVA with ell
      = 1, seed with the identity expander; all four must collapse their cells to the other factor
      exactly.'
    - 'Order-swap control: for each unordered pair, compare the two ordered cells and report whether
      the composites are equal, isomorphic, or distinct, with the comparison rule stated in advance.'
    - 'Certificate-negative control: plant a module that is deliberately NOT isotropic and confirm
      the certificate fails, so that verification success is informative.'
    required_metrics:
    - status per cell in {defined, degenerate, undefined, open-with-reason}
    - flattened F_q parameter triple per defined cell
    - coefficient algebra per defined cell, named
    - annihilation certificate result per constructed instance
    - count of defined cells unpopulated by any in-repo record
    - order-swap comparison result per unordered pair
  falsification_conditions:
  - A cell predicted undefined is constructed successfully with a verified annihilation certificate,
    falsifying the slot-collision rule.
  - A cell predicted defined cannot be constructed at any tested parameters, which is recorded as
    open-with-reason and falsifies the free-composition prediction for that pair.
  - A composite's flattened parameter triple disagrees with the product of the individual multipliers.
  - The plain-UOV null passes a check that was supposed to distinguish it from a composite, which
    means the distinguishing rule is empty.
  - A degenerate-parameter control fails to collapse, which means a slot map is written wrong and
    the whole table is void.
  confounders:
  - Recalled transform definitions being wrong in a way that makes a cell spuriously undefined; mitigated
    by recording the definition used per cell so a later correction is local rather than total.
  - 'Conflating ''undefined'' with ''we could not build it in an afternoon'', which is why open-with-reason
    is a separate status and why the protocol''s section 4 standard is invoked: a fatigue report is
    not a closure.'
  - Isomorphic composites in the two orders being reported as distinct because of a coordinate choice;
    mitigated by fixing the comparison rule before running.
  - Reading an unpopulated defined cell as a research opportunity worth pursuing, which it may not
    be; the table names objects, it does not rank them.
  interpretation_limits:
  - The table says which composites exist, not which are secure, useful, or efficient; no cell carries
    any security or performance implication.
  - An undefined cell is undefined under the recalled definitions and the five-slot abstraction, not
    in general, and a richer abstraction may define it.
  - Existence certificates at tiny parameters do not establish that a composite is well behaved at
    any larger parameters.
  target_complexity:
    time_exponent: No attack exponent is claimed. Construction and exhaustive verification cost O(q^{flattened
      n}) per tiny instance with flattened n at most 16, which is bounded by a few million field operations
      in total.
    memory_exponent: No attack memory exponent is claimed; each instance is a handful of small matrices.
    best_known: The incumbent is the current in-repo state of the art, namely four separate single-transform
      lanes (RQ-MAYO-001, RQ-UOV-001, RQ-QRUOV-001, RQ-SNOVA-001) with no composite objects and, per
      IDEA-20260807-b63f08, not even a shared accounting basis. There is no attack incumbent because
      no attack is proposed.
    hidden_overhead: The whole cost is human judgement about what counts as the same slot, and that
      judgement is exactly where the table can be quietly wrong. A second hidden cost is that a table
      of sixteen cells invites the reader to treat empty cells as opportunities, which is a framing
      cost the record must resist explicitly.
  dominated_by: n/a (no result claimed). Checked against every attack frontier row named across the
    four anchor questions - intersection, reconciliation, Kipnis-Shamir, rectangular MinRank, wedge-product,
    group-action stability - and none is comparable, because this proposal produces no time, memory,
    or query figure at all.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a sixteen-cell status table, a parameter triple and named algebra per defined cell, and a count
    of defined cells that no in-repo record has ever touched.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A (the four schemes decompose as one core plus four slot-acting
    transforms): 0.85, since three of the four decompositions are already written in in-repo hypotheses
    and only the seed-compression slot is loosely specified. Part B (the specific prediction that
    exactly the two algebra-slot cells fail): 0.5, deliberately near a coin flip, because the tensor
    product of a quotient ring and a matrix algebra is a perfectly good algebra and the pairing may
    well survive, in which case the interesting result is that all sixteen cells are defined. Part
    C (every defined cell admits a constructible instance with a verified certificate at tiny parameters):
    0.65, with the residual risk concentrated in the cells that stack two structure-adding transforms
    and may have no nonzero oil module at tiny parameters at all.'
  status: proposed
