# IDEA-20261003-681212
# Twist-pair count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-681212
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A twist pair has 2 curves and 1 shared j-invariant
  class: measurement
  claim: >-
    A quadratic twist pair has 2 curves and 1 shared j-invariant.
    Two exceeds one by 1. The product of the two counts is 2.
    Their sum is 3. The gap is a label count, not an ECDLP
    exponent and not a point count.
  mechanism: >-
    The objects are the curve label and the j label. The twist
    changes the curve label and keeps the j label. Two labels of
    one curve both count 1, so that gap is 0. No point is counted.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from a twist-pair count.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two counts are frozen before the subtraction.
    - No point is counted.
  proof_search_map:
    bottleneck: The label gap 1.
    baseline_embedding:
      parameter_slice: The counts 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The label gap and the product.
      distinct_preimage_search: >-
        Reporting both counts as 1 drops the gap. Two labels of
        one curve make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 2 and 1.
        predicted_gain: Integer gap. No point count.
    quantifier_order: >-
      The counts are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The label gap 1. Not a point count.
      nearby_object_control: >-
        Two labels of one curve. Both count 1, and the gap is 0.
    proof_obligations:
      - claim: The twist pair has 2 curve labels.
        responsibility: size
      - claim: The twist pair has 1 j label.
        responsibility: size
      - claim: The gap is not a point count.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: label_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Subtract the two frozen counts. Do not count rational points.
    controls:
      - Two labels of one curve, whose gap is 0.
      - An independent count.
    required_metrics:
      - both counts
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two counts is not 2.
  confounders:
    - A twist can change the point count while keeping j fixed. That point count is not this label count.
  interpretation_limits:
    - A label count is not a point count.
    - No transfer to a cryptographic curve.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen twist pair has 2 curve labels and 1 shared j label.
      rigorous_support: >-
        No twist theorem is claimed. The count is a reading of two labels.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The point counts of the two curves are not compared.
    tradeoff_note: Two curves with one j are not a shorter walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
