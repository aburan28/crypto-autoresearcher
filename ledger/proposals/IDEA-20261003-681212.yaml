      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          Automorphisms give a square-root constant. This record
          counts 2 curves and 1 j label and does not claim that constant.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a twist label.
