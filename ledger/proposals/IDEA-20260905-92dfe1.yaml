    direction: different
    minimum_effect: At least one proposed negative is shown unsupported by an exact fiber collision, while a stronger
      invariant separates the planted pair.
  minimal_test:
    design: At the level of small matrices and polynomial ideals, pair equal-rank matrices with distinct invariant
      factors and equal-output-degree ideals with distinct degree-fall certificates. Freeze a three-instrument hierarchy
      and demand both collision and separation witnesses.
    proposal_only: true
    controls:
