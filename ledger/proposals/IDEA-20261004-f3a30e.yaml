      direction: different
      minimum_effect: Eighteen exceeds seventeen by 1.
  minimal_test:
    design: >-
      Read the bits of 262143 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 17.
    - The product of 18, 17, and 17 is not 5202.
  confounders:
    - The integer 131071 has bit length 17 and sixteen additions.
  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the count triple 17, 16, and 16 of the integer 131071.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 262143 has bit length 18, 17 doublings, and
