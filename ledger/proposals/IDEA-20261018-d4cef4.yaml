idea:
  id: IDEA-20261018-d4cef4
  question_id: RQ-KIC-7502b9
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Universal Frobenius relations: the relation module of a Koblitz orbit is the
    principal ideal (delta) of Z[tau], and its minimum tau-adic weight marks
    where toy tau-stable cells become dimension-forced
  class: mechanism
  claim: >-
    (A) delta = sum_{j<n} tau^j has norm equal to the point-count ratio of E over
    F_q and over F_2, which is r when the cofactor h equals the F_2 point count
    (K1, K0); Z[tau] is the ring of integers of Q(sqrt(-7)) (class number 1,
    units +-1); G is cyclic of prime order with tau acting as lambda, so
    Ann(G) = (delta). For every column seed P, sum_j c_j tau^j P = O iff c(tau)
    lies in (delta), whatever log P is. (B) w_min(n,r) is the least weight of a
    nonzero {-1,0,1} vector c, not a multiple of all-ones, with c(tau) in
    (delta). Two distinct-point m-sums from one column can coincide iff
    w_min <= 2m. Random-lattice count: N_w about C(n,w) 2^w/(2 n r) patterns up
    to rotation and sign; the tau-NAF of delta gives w_min <= n/3 + O(1).
    (C) A toy cell (n,r,m) is dimension-forced unless 2m < w_min; forced
    duplicate class-sums come from same-column patterns of weight <= 2m, each
    completed by arbitrary base points, and enter the IDEA-20261018-5f37a1 null
    mean. (D) Hand arithmetic on the reported N23/K16 table counts (260,361
    distinct pair sums, 5,661 canonical entries) moves the duplicate z from about
    -18 (element-level null) to about -2.6 (class null).
  mechanism: >-
    OBJECT FRAME. Pair (R1 points of one orbit, written in the group ring
    Z[T]/(T^n-1); Sigma = rotation (tau), negation, translation by base
    elements). Class I partial-action. Lossy test against Sigma: c(T) -> c(lambda)
    mod r keeps one residue of n coefficients; rotation multiplies it by
    lambda^k and negation by -1, so its class mod <lambda,-1> is Sigma-invariant.
    Priced number: w_min by meet in the middle, C(n,w/2) 2^(w/2) steps (2^23 at
    n=53, w=12); no canonicalisation. KN-OPEN-020: no new base. Stage: relation
    accounting and toy validity. Multiset sums add the universal weight-4
    relation tau^2 P - t tau P + 2P = O; conventions are separated.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260922-261004
      provenance: internal
      claim: lambda has order n, k divides r-1, conjugate rows have raw rank k and quotient rank 1.
      verified_by: idea-generator, claim read in full
    - ref: research/pair_reuse_20260922/REPORT.md (RUN-KIC-ba86d9)
      provenance: internal
      claim: N23/K16 table has 260,361 distinct pair sums and 5,661 canonical entries.
      verified_by: idea-generator, report read
    - ref: Solinas, Efficient arithmetic on Koblitz curves (2000)
      provenance: recalled
      claim: tau-NAF digit density 1/3, length about log2 of the norm.
      verified_by: null
  predictions:
    - metric: exact N_w (w <= 8) over the random-lattice count, per cell
      direction: different
      minimum_effect: "within a factor 3 at every cell and weight"
    - metric: share of found relations lying in (delta), exact check in Z[tau]
      direction: higher
      minimum_effect: "1.0; any miss is an instrument error"
    - metric: duplicate class-sums beyond class null in the N23/K16 and N19/K4 tables
      direction: lower
      minimum_effect: "at most floor plus 2 sd"
  minimal_test:
    design: >-
      Stage 0 (arithmetic only): K1 n=7 (r=71), 11 (991), 17 (65587), 19
      (262543), 23 (recompute) and K0 n=7 (29), 13 (2003). Take lambda from
      lambda^2 - t lambda + 2 = 0 mod r, confirm order n and N(delta) = r,
      enumerate weight <= 8 patterns by meet in the middle, record N_w, w_min and
      exact membership in (delta). Null: random lambda' of order n mod r.
      Positive: the tau-NAF of delta must appear at its predicted weight. Stage 1:
      count duplicate class-sums in the RUN-KIC-ba86d9 tables and N19 pool bases,
      split into same-column and cross-column patterns.
    controls: [random lambda' null, tau-NAF(delta) planted positive, distinct-point and multiset conventions]
  falsification_conditions:
    - "A relation found outside (delta): instrument error or Ann(G) = (delta) false."
    - "N_w off by more than a factor 3 (Poisson 3 sd) at two cells: H1 false."
    - "Duplicates exceed floor plus class null by 4 sd: unexplained structure, the IDEA-20261018-5f37a1 null is invalid there."
  confounders: [table counts may include P+P or exclude infinity (5661 x 46 differs from 260361 by 45), r at n=23 assumed prime, multiset versus distinct-point convention]
  interpretation_limits: [toy cells n at most 23, no claim at deployed n (w_min about 33 to 44 by hand estimate), no attack]
  heuristic_assumptions:
    - id: H1
      statement: >-
        For sparse {-1,0,1} patterns of weight w << n, c(tau) is equidistributed
        in Z[tau]/(delta) = F_r.
      rigorous_support: >-
        Lattice-point count in a region of area at least the covolume r, error
        O(perimeter); imitates uniform residues of random sparse integers.
      validation_plan: >-
        Exact N_w for w <= 8 on 7 cells against the formula; Poisson dispersion
        across cells; smallest w with N_w > 0 against prediction; n <= 23 only.
  target_complexity:
    time_exponent: >-
      None; no attack. Defines a validity window: at n >= 131 the hand estimate
      w_min about 33 to 44 exceeds 2m for m <= 8.
    memory_exponent: not applicable
    best_known: matched signed-Frobenius rho (KR-RHO-482ed3)
    hidden_overhead: w_min search C(n,w/2) 2^(w/2) steps, 2^23 at n=53
    tradeoff_note: none
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
