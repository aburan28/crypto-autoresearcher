idea:
  id: IDEA-20260807-1e673d
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    THE MATCHED NULL THE STR LANE NEVER HAD: a synthetic matrix generator that
    holds shape, density, row-weight law, column-orbit partition and base-row
    budget FIXED while varying exactly one nuisance variable at a time - orbit
    closure fraction, B mod g, and dedup policy - so that every structure
    statistic in the lane (phi_alpha, raw rank, informative rank, block cost
    ratio) is reported as a surface over those variables instead of as a number,
    with the decay requirement stated in advance and blocking

  class: control

  claim: >-
    (A) THE LANE'S MEASUREMENT HISTORY IS THE ARGUMENT FOR THIS RECORD.
    EV-STR-003 O-8 measured that a construction with ZERO endomorphism content
    reproduces the small-versus-B displacement-rank signature at 4 of 4
    instances, including both headline instances, and attains alpha = 0 at
    B = 204. EV-STR-003 O-4 traced the whole arm-E divergence to a difference of
    CLOSURE CONVENTION, and recorded that arm E "was a valid EXISTENCE control
    and a MIS-SPECIFIED COMPARATIVE one: S1/F1 tested a proposition strictly
    stronger than OBS-1's content, on an uncontrolled nuisance variable".
    EV-STR-003 UC-2 states the obligation this record discharges: "Any future
    criterion of the S1 form must control the nuisance variable - by matching
    base-row budgets and reporting alpha conditional on suppression count - or
    it is untestable." EV-STR-004 then ran A-prime and E-prime, returned
    instrument_verdict `mixed`, and left UC-2 (truncation reading IL0) unresolved
    at exactly the residue-1 cells. Four experiments have measured the lane's
    statistics; none has measured them as FUNCTIONS OF THE NUISANCE VARIABLES.

    (B) WHAT IS BUILT. A generator that emits a relation-matrix-shaped object
    from a declared parameter vector, with NO curve in the loop, and a matched
    curve-derived arm that shares every parameter:
      B           factor-base size (columns)
      g           orbit length of the column permutation sigma (g in {1, 2, 3, 4})
      rho_B       B mod g, swept over {0, 1, ..., g-1} at otherwise fixed B
      R_base      number of base rows, MATCHED across arms by construction
      w           row weight law (matched to the measured Semaev arity m)
      c           ORBIT CLOSURE FRACTION: the fraction of base rows for which
                  the g-1 sigma-shifts are also emitted, swept over [0, 1]
      d           dedup policy in {off, exact-row, zero-filter} - the three
                  behaviours the committed harness mixes at
                  harness/endomorphism_la.py lines 303-304 and 350-351
      lambda_used the folding weight in {true lambda, wrong root lambda^2,
                  random mu with mu^g != 1}
      s           seed
    Arms: (A) curve-derived rows from a genuine j = 0 instance; (E) synthetic
    rows with identical (B, g, rho_B, R_base, w, c, d, s) and ZERO endomorphism
    content; (P) planted-signal rows carrying a deliberately inserted structure
    the instrument is required to detect.

    (C) WHAT IS MEASURED, AS A SURFACE. For every cell of the parameter grid,
    on every arm, the whole battery:
      phi_alpha              the as-committed displacement rank under sigma
      rand_alpha             the same under a seeded random permutation
      rank(M)                raw rank over F_N
      rank(tilde-M)          informative rank after lambda-folding
                             (IDEA-20260807-0e4d83)
      free_rel_count         rows folding to zero (IDEA-20260807-61049d)
      nnz, nnz_j             sparsity before and after the isotypic split
      block_cost_ratio       blockwise over plain sparse solve cost
      misaligned_row_count   the phase-break statistic of EV-STR-003 S3
      dedup_suppressed_count rows silently dropped
    Nothing is reported as a scalar. Every statistic is reported as a function
    of c and of rho_B at fixed everything else, because that is the only form in
    which the decay requirement of docs/inventor-protocol.md section 3 can be
    checked.

    (D) THE DECAY REQUIREMENT, DECLARED IN ADVANCE AND BLOCKING. c is the
    parameter whose increase CREATES the phi-structure and whose decrease must
    DESTROY it. Therefore:
      for a statistic to be admissible as evidence of phi-structure, it must
      vary monotonically in c, and its arm-A and arm-E values at the SAME c must
      be compared - never arm A at one c against arm E at another.
    A statistic that is flat in c is measuring something else and may not be
    cited as evidence about the endomorphism in either direction. A statistic
    whose arm-A and arm-E curves coincide at every c is measuring the closure
    convention, exactly as EV-STR-003 O-8 found for the alpha signature, and
    that coincidence is the CONTROLLED NULL, which is a result and is reported
    as one.

    (E) THE TWO OUTCOMES, BOTH DELIVERABLES.
      OUTCOME 1 - every statistic in the battery has coincident A and E curves
        over the whole (c, rho_B) grid. Then the lane's four experiments were
        measuring closure convention and truncation phase, the instrument
        question EV-STR-003 UC-1 left UNADJUDICATED is adjudicated in the only
        way a control can adjudicate it, and every future STR measurement is
        obliged to report against this surface. That is a genuine instrument
        result and it is the predicted one.
      OUTCOME 2 - some statistic separates A from E at matched (c, rho_B, R_base,
        d) with an effect exceeding its measured seed-to-seed spread. Then that
        statistic carries endomorphism content, the lane has a working
        instrument for the first time, and the statistic - not phi_alpha by
        default - becomes the lane's meter. The strongest candidate for this,
        and it is predicted to FAIL to separate, is informative rank; the
        strongest candidate to succeed is the free-relation count, which is
        curve-derived by construction.

  resource_label: >-
    audit: consumes no resource. The synthetic arms use no curve at all; the
    curve-derived arm consumes R1 + R3 only to supply rows for comparison, and
    no claim in this record depends on that arm alone.

  admissibility: admissible

  admissibility_argument: >-
    An instrument consumes no resource and mounts nothing, so the section-2
    filter is satisfied vacuously. Its purpose is precisely to enforce that
    filter on the rest of the lane: a statistic that cannot be separated from a
    curve-free null is not evidence that any resource was consumed, whatever its
    value. This record is L14's obligation (RQ-INSTR-f8faa0) applied inside L5.

  discriminated_from:
    - >-
      EXP-STR-003 arm E, which EV-STR-003 O-4 records as a valid EXISTENCE
      control and a MIS-SPECIFIED COMPARATIVE one: it consumed 2.5x-3.0x as many
      base rows as arm A (37/65/214/407 against 15/22/72/136) and its skips had a
      different cause. This record matches R_base BY CONSTRUCTION rather than by
      hope, sweeps the nuisance variable rather than fixing it at one uncontrolled
      value, and reports conditional on suppression count - the three things
      UC-2 demanded.
    - >-
      EXP-STR-004 arms A-prime and E-prime, which matched R_base (via driver
      DEV-BASE-1, itself recorded as UC-1 because the matching was in the driver
      and not in the harness loop) but measured at fourteen fixed cells and
      returned `mixed`, with all four disagreements at residue-1 cells and
      consistent with the IL0 truncation reading. This record makes rho_B = B
      mod g an EXPLICIT SWEPT VARIABLE rather than an incidental property of the
      chosen B, which is the only way the truncation reading can be confirmed or
      excluded.
    - >-
      IDEA-20260731-011, the mandatory null-control template bound into
      SG-ECDLP-005. That is a methodology template applied to sub-birthday
      claims. This is a concrete generator plus a declared parameter grid for one
      lane's specific statistics, and it emits a surface rather than a pass/fail.
    - >-
      IDEA-20260805-530869 (the ML-KEM ring-deleted matched null). Same
      philosophy, different object and different forced values; cited because its
      structure - matched null plus pre-derived calibration values on both arms -
      is the pattern this record follows, and following a pattern is an
      adaptation, not a novelty.
    - >-
      IDEA-20260807-0e4d83 and IDEA-20260807-61049d, which each carry their own
      nulls. This record is the shared infrastructure those nulls would otherwise
      each re-implement, plus the sweep over nuisance variables that neither of
      them performs.

  object_first_candidate:
    tracked_object: >-
      THE STATISTIC-VALUE SURFACE: for each statistic S in the battery, the map
      (arm, c, rho_B, d, seed) -> S. The tracked object is not any matrix and not
      any curve; it is the response of a measurement to its nuisance variables.
    lossiness: >-
      LOSSY: the surface forgets the matrices entirely and retains only the
      response. Two completely different matrices with the same response are
      identified, which is exactly what makes the object useful - it is the
      equivalence relation "indistinguishable by this instrument", and the whole
      question of the lane is how coarse that relation is. It passes the
      section-2 test: the matrix is not recoverable from its response, and the
      response propagates deterministically under the generator's parameters
      because the generator is deterministic given its seed.
    propagation: >-
      One step is exactly defined: incrementing c by one row's worth of closure
      changes each statistic by a computable amount, and the generator emits both
      the before and after so the increment is observed rather than inferred.
      This is the property EV-STR-003 O-4 found missing - alpha is a
      PHASE-TRACKING statistic where "a single skipped emission shifts the phase
      of the whole downstream stream", which is a one-step propagation rule that
      was discovered after the fact instead of being designed in.
    survival_score: >-
      Survives: change of curve family, change of arity, change of solver,
      change of statistic (new statistics plug into the same grid). Dies at: a
      statistic that is not computable from the matrix alone (anything requiring
      a discrete logarithm cannot be evaluated on the synthetic arms, which is a
      real limit - the free-relation count of IDEA-20260807-61049d is
      curve-derived and its null must be the fake-orbit null, not arm E).

  mechanism: >-
    STEP 1. Write the generator as a pure function of the parameter vector plus
    a seed, with a declared and hashed output. It emits: the column-orbit
    partition sigma, the base rows, the closure rows, the dedup decisions and
    the final row list, together with sha256 of the factor base and of the row
    list - which closes EV-STR-003 UC-6 ("run records do not archive the objects
    the metric is computed from") at zero cost and makes every cell CHECKABLE
    from artifacts rather than merely reproducible by re-execution.

    STEP 2. Implement arm E (zero endomorphism content) as: a random column
    partition into B/g blocks of size g, a random base-row set with the matched
    weight law, and closure under the POSITIONAL block permutation. This is
    EV-STR-003's arm E, but with R_base matched by construction and with the
    dedup policy as an explicit parameter rather than inherited from the harness.

    STEP 3. Implement arm A by taking the base rows from a genuine j = 0
    instance via the existing harness, then applying the IDENTICAL closure,
    dedup and truncation code path as arm E. The only difference between arms
    must be the provenance of the base rows. Any other difference is a bug and
    the generator asserts against it by comparing the emitted parameter vectors
    field by field.

    STEP 4. Implement arm P (planted signal). Two plants, because an instrument
    must be shown to detect what it claims to detect:
      P1 - a genuinely block-circulant, FULL-informative-rank matrix built by
        drawing B/g independent rows in the quotient space and lifting them.
        Every structure statistic must fire, and the block cost ratio must be
        1/g exactly.
      P2 - a matrix with an implanted rank deficiency of a declared size k.
        rank(M) must be short by exactly k. If it is not, the rank code is wrong
        and every rank in the lane's history is suspect.

    STEP 5. Sweep. c in {0, 0.25, 0.5, 0.75, 1}, rho_B in {0, ..., g-1} at fixed
    B (achieved by varying the number of complete orbits and padding with
    singleton columns, which is exactly what the `xs[:B]` truncation of
    `_build_phi_invariant_factor_base` does accidentally and which this
    generator does deliberately and records), d in {off, exact-row,
    zero-filter}, g in {1, 2, 3, 4}, at least 5 seeds per cell, B spanning at
    least an order of magnitude.

    STEP 6. Report each statistic as a surface, with per-cell seed-to-seed
    spread. THE ACCEPTANCE RULE, frozen before execution: a statistic separates
    the arms only if the A-E difference at matched (c, rho_B, d, B) exceeds
    3 times the pooled seed-to-seed standard deviation at that cell, at a
    majority of cells, with a consistent sign. EV-STR-003 O-5 recorded that
    EXP-STR-003's contract made its own `mixed` branch UNREACHABLE by
    construction; this rule has three reachable outcomes (separates, does not
    separate, inconsistent-sign) and the third is reported as inconclusive
    rather than folded into either of the others.

    STEP 7. Publish the surface as the lane's reference instrument, with the
    obligation that any future STR measurement cites the cell of this surface it
    corresponds to.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07:
      "matched null|null object|null_object_control"; "decay parameter";
      "nuisance variable"; "closure fraction"; "planted"; "arm E|arm-E";
      "B mod 3|residue-1|truncation". Full reads of EV-STR-003 (all 13
      observations and 7 unresolved confounds), EV-STR-004, IDEA-20260805-530869,
      docs/inventor-protocol.md section 3, and the L14 lane description in
      DECOMPOSITION.md.
    results: >-
      "nuisance variable" appears exactly twice, both inside EV-STR-003 O-4 and
      UC-2, in the sentence demanding the control this record builds; nothing in
      the repository implements it. "closure fraction" returns ZERO hits.
      Matched-null machinery exists in other campaigns (IDEA-20260805-530869 for
      ML-KEM, IDEA-20260731-011 as a template) but no generator exists for
      relation-matrix-shaped objects, and no statistic in the STR lane has ever
      been reported as a function of a swept nuisance variable - EXP-STR-003
      fixed four cells, EXP-STR-004 fixed fourteen.
    verdict: >-
      ADAPTATION. Matched nulls, planted-signal controls and parameter sweeps
      are standard experimental methodology and nothing about them is claimed as
      new. What is new to this corpus is the specific parameterisation (c, rho_B,
      d as first-class swept variables), the construction-time matching of
      R_base, the three-outcome acceptance rule with a reachable inconclusive
      branch, and the artifact-hashing that makes cells checkable rather than
      merely reproducible.

  null_object_control: >-
    THIS RECORD IS THE NULL OBJECT CONTROL, so the field states the null of the
    null - what would show that the CONTROL itself is broken.
    THE MATCHED NULL, as the L5 brief requires: a random matrix of identical
    shape, density and column-permutation orbit structure (arm E).
    THE DECAY PARAMETER: c, the orbit closure fraction - the parameter whose
    decrease destroys the phi-structure. Secondary decay parameter: rho_B =
    B mod g, whose nonzero values are exactly the truncation regime EV-STR-004
    flagged as IL0.
    SELF-CHECK 1 (planted positive P1): a genuinely structured, full-rank
    block-circulant matrix. Every structure statistic must fire and the block
    cost ratio must be exactly 1/g. If the instrument cannot see P1, it cannot
    see anything and the whole grid is void.
    SELF-CHECK 2 (planted deficiency P2): implanted rank deficiency k must be
    recovered exactly. This is a known-answer test of the rank code itself,
    which EV-STR-003 UC-3 flagged as resting on the driver's vectorised
    implementation alone at the two largest instances.
    SELF-CHECK 3 (degenerate limit): at g = 1 the closure is the identity, arm A
    and arm E must coincide EXACTLY at every c, and every block cost ratio must
    be 1. Any separation at g = 1 is a bug in the arm-matching and voids the
    grid.
    SELF-CHECK 4 (seed stability): at fixed parameters, the seed-to-seed spread
    must be reported before any A-E difference is interpreted; the acceptance
    rule of STEP 6 is defined in units of that spread precisely so that it
    cannot be evaluated without it.

  assumptions:
    - >-
      A synthetic row set can be matched to a curve-derived one on shape,
      density, row-weight law, column-orbit partition and base-row count. It
      cannot be matched on the JOINT support distribution of a Semaev
      decomposition, which is not known in closed form. That residual mismatch is
      the honest limit of the null and is stated in every cell rather than
      hidden: arm E matches the declared moments, not the full law.
    - >-
      Every statistic in the battery is computable from the matrix and its column
      partition alone. TWO ARE NOT: the free-relation count and any statistic
      requiring lambda depend on the curve. Those are reported on arm A only,
      with the fake-orbit null of IDEA-20260807-61049d as their control, and are
      explicitly excluded from the A-versus-E comparison.
    - >-
      Deterministic generation given a seed, so that any cell is reconstructible
      byte-for-byte from its parameter vector - which is what makes the hashes
      meaningful.
    - Toy scale; claim tier `toy`; the surface is an instrument, not evidence
      about elliptic curves.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical and instrumental. It asserts no theorem, no asymptotic
      bound, no certificate family, no reduction and no closure argument; it
      builds a measurement apparatus and reports its response surface. The
      proof-oriented records in this lane are IDEA-20260807-0e4d83,
      IDEA-20260807-61049d, IDEA-20260807-9ecc6f, IDEA-20260807-45a69f and
      IDEA-20260807-add964, each of which carries its own map.

  heuristic_assumptions:
    - >-
      id: HEUR-L5-7
      statement: >-
      Seed-to-seed variation of each battery statistic at fixed parameters is
      approximately normal with a spread that grows no faster than sqrt(B), so
      that a 3-sigma acceptance rule has approximately the intended size.
      rigorous_support: >-
      Imitates the standard concentration of rank and weight statistics of
      random sparse matrices over F_q around their means; it is NOT a theorem
      for these generators, and alpha in particular is a phase-tracking
      statistic (EV-STR-003 O-4) whose distribution is unknown and may be
      heavy-tailed or lattice-valued.
      validation_plan: >-
      Measure the full empirical distribution of each statistic over at least
      20 seeds at three anchor cells before the 3-sigma rule is applied
      anywhere. If a statistic's distribution is visibly non-normal or
      lattice-valued, replace the rule for that statistic with a rank-based
      two-sample test declared in advance. Report the distributions, not only
      the spreads. TOY SCALE ONLY.
    - >-
      id: HEUR-L5-8
      statement: >-
      The declared moments (shape, density, row-weight law, column-orbit
      partition, base-row count) capture enough of a Semaev relation row set
      that a difference surviving them is attributable to endomorphism content
      rather than to an unmatched moment.
      rigorous_support: >-
      This is the weakest link in the whole record and it is stated as such.
      It imitates the standard matched-null assumption. There is no theorem;
      the joint support law of decompositions over a phi-stable factor base is
      not known.
      validation_plan: >-
      Add moments until the surface stops moving: measure the A-E difference
      with successively richer matching (weights only; weights plus column
      degree; plus within-orbit support-collision rate; plus pairwise column
      co-occurrence), and report the difference as a function of matching
      richness. If the difference shrinks monotonically toward zero as
      matching improves, it was an unmatched moment and not endomorphism
      content - which is itself the finding. TOY SCALE ONLY.

  predictions:
    - >-
      metric: phi_alpha, arm A minus arm E at matched (c, rho_B, d, B, seed)
      direction: different
      minimum_effect: >-
      PREDICTED NO SEPARATION: |A - E| below 3 pooled sigma at a majority of
      cells. EV-STR-003 O-8 already measured that a zero-endomorphism
      construction reproduces the signature at 4 of 4, and EV-STR-004 returned
      `mixed`. A confirmed non-separation over the whole grid is the
      CONTROLLED NULL and is the expected deliverable.
    - >-
      metric: phi_alpha as a function of c at fixed everything else
      direction: different
      minimum_effect: >-
      Strictly monotone decreasing in c on BOTH arms, from about min(R, B) at
      c = 0 to O(g) at c = 1, with at least three distinguishable intermediate
      values. A FLAT curve is the canonical artifact tell of
      docs/inventor-protocol.md section 3 and voids the statistic for all
      purposes.
    - >-
      metric: phi_alpha as a function of rho_B = B mod g at fixed c = 1
      direction: different
      minimum_effect: >-
      A measurable dependence, predicted: alpha near 0 at rho_B = 0 and rising
      at rho_B != 0, on BOTH arms. This is the IL0 truncation reading
      EV-STR-004 left unresolved, and confirming it on a curve-free arm
      settles that it is truncation and not endomorphism content. If alpha is
      independent of rho_B, the truncation reading is excluded and EV-STR-004's
      four residue-1 disagreements need another explanation.
    - >-
      metric: rank(tilde-M) (informative rank), arm A minus arm E
      direction: different
      minimum_effect: >-
      PREDICTED NO SEPARATION at matched R_base, because
      IDEA-20260807-0e4d83's identity holds for any rows whatsoever. Reported
      here to make that prediction falsifiable on a grid rather than at a
      point.
    - >-
      metric: block_cost_ratio (blockwise over plain sparse solve)
      direction: lower
      minimum_effect: >-
      1/g within 20% at c = 1 on BOTH arms and on plant P1, degrading smoothly
      toward 1 as c falls. A ratio at 1/g on an unclosed matrix (c = 0) means
      the blocks are being formed from a matrix they do not describe and every
      cost number in the lane is void.
    - >-
      metric: planted-deficiency recovery |k_measured - k_planted|
      direction: lower
      minimum_effect: >-
      Exactly 0 at every plant P2 cell. Any nonzero value invalidates every
      rank in the lane's history, including EV-STR-003 O-9's 4, 6, 30, 67.

  minimal_test:
    design: >-
      STAGE 0 (hours, implementation): write the generator, the arm-matching
      assertion, the battery and the hashing. No measurement is reported until
      the arm-matching assertion passes field by field.
      STAGE 1 (minutes, HARD GATES, in this order): SELF-CHECK 3 (g = 1 arms
      coincide exactly); SELF-CHECK 2 (planted deficiency recovered exactly);
      SELF-CHECK 1 (plant P1 fires and gives block ratio exactly 1/g). Any
      failure halts the line - none of these is a finding.
      STAGE 2 (minutes): the c-sweep at fixed B and rho_B = 0, both arms, five
      seeds. This alone answers the lane's oldest open question (is alpha flat in
      the parameter that is supposed to destroy it) and is the cheapest valid
      discriminator in the record.
      STAGE 3 (minutes): the rho_B sweep at c = 1, both arms - the IL0 test.
      STAGE 4 (an hour): the dedup-policy sweep, both arms.
      STAGE 5 (hours): the full grid over g, B and 5 seeds; report the surfaces.
      STAGE 6 (hours): HEUR-L5-8's matching-richness ladder.
      Everything is pure Python on numpy-sized objects with no curve arithmetic
      except in arm A, and the whole grid is minutes-to-hours at toy B.
    controls:
      - arm E - matched random matrix, identical shape, density and column-orbit
        partition, zero endomorphism content, R_base matched by construction
      - plant P1 - genuinely block-circulant full-informative-rank matrix
      - plant P2 - implanted rank deficiency of declared size
      - g = 1 degenerate limit, arms must coincide exactly
      - seeded random shift operator, for rand_alpha, as in the committed harness
      - >-
        20-seed distribution measurement at three anchor cells before any
        3-sigma rule is applied
      - >-
        the frozen EXP-STR-003 arm-A cells (B = 27, 55, 204, 397 with
        phi_alpha = 9, 2, 4, 1) reproduced as fixture points on the surface
    required_metrics:
      - every statistic in the battery, per cell, per arm, per seed
      - seed-to-seed spread and full empirical distribution at the anchor cells
      - the parameter vector and sha256 of factor base and row list, per cell
      - arm-matching assertion result, field by field, per cell
      - all four self-check outcomes
      - >-
        the three-branch acceptance verdict per statistic: separates | does not
        separate | inconsistent sign

  falsification_conditions:
    - >-
      SELF-CHECK 3 fails: arms differ at g = 1. Arm matching is broken; the grid
      is void and nothing is reported.
    - >-
      SELF-CHECK 2 fails: planted deficiency not recovered. The rank code is
      wrong; this invalidates the instrument and casts doubt on prior committed
      ranks, which must then be recomputed before being cited again.
    - >-
      SELF-CHECK 1 fails: plant P1 does not fire. The instrument cannot detect
      genuine structure and every null it reports is void - the exact
      failure mode L14 (RQ-INSTR-f8faa0) exists to prevent.
    - >-
      phi_alpha is flat in c on both arms. The statistic does not respond to the
      parameter that creates and destroys the structure it claims to measure;
      it is voided for all purposes and no record may cite it in either
      direction.
    - >-
      Arm A separates from arm E on some statistic at matched parameters,
      3 sigma, majority of cells, consistent sign. The lane has a working
      instrument; this record's own prediction is wrong; independent review
      before any interpretation, and the statistic - not phi_alpha - becomes the
      meter.
    - >-
      The EXP-STR-003 fixture cells do not land on the surface. The generator
      does not reproduce the committed behaviour and is not a control for it;
      halt and reconcile. This is an infrastructure outcome under AGENTS.md rule
      5, not mathematical evidence.

  confounders:
    - >-
      UNMATCHED MOMENTS (HEUR-L5-8). Arm E matches declared moments, not the
      joint support law of Semaev decompositions. A separation could be an
      unmatched moment rather than endomorphism content; the matching-richness
      ladder of STAGE 6 exists to bound this and its result must accompany any
      separation claim.
    - >-
      DEDUP AS A HIDDEN VARIABLE. The committed harness both deduplicates rows
      and drops all-zero rows, and EV-STR-003 O-4 showed dedup behaviour drove
      the arm-E divergence. Making d explicit removes it as a confounder for THIS
      record but means results are only comparable to prior records at the
      matching d value, which must be named in every comparison.
    - >-
      PHASE SENSITIVITY. alpha is a phase-tracking statistic: one skipped
      emission shifts the whole downstream stream (EV-STR-003 O-4). It may
      therefore be extremely sensitive to emission ORDER, which is not in the
      declared parameter vector. Emission order must be added as a swept
      variable if the c-sweep shows non-monotonicity.
    - >-
      SMALL-B RESOLUTION. At B = 27 with g = 3 there are 9 orbits and c takes
      only 10 distinct values; the sweep has almost no resolution. B must span at
      least an order of magnitude and small-B cells must be labelled
      low-resolution rather than averaged in.
    - >-
      MULTIPLE COMPARISONS. Nine statistics times five c values times g values
      times seeds is a large grid, and a 3-sigma rule applied cell-by-cell will
      produce false separations by chance. The acceptance rule requires a
      MAJORITY of cells with consistent sign precisely to blunt this, and the
      expected false-separation count under the null must be computed and
      reported alongside the observed count.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS (EV-STR-001: 0.4% to 3% of charged total
      at every tested size). This record does not claim a linear-algebra gain,
