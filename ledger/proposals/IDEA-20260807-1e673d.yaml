  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED AND NO ATTACK IS MOUNTED. This record claims not
      even a constant factor: it claims a measurement apparatus. The instrument's
      own cost is O(number of cells) rank computations of size at most B, which
      at toy B is minutes.
    memory_exponent: >-
      O(B^2) per cell for dense rank computations at toy B, and O(nnz) for the
