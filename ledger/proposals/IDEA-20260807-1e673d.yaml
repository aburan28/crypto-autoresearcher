    hidden_overhead: >-
      Disclosed: arm E cannot match the joint support law of Semaev
      decompositions (HEUR-L5-8), so a null result here is a null against the
      DECLARED moments and not against everything. That qualifier belongs in
      every citation of this record's surfaces.
    tradeoff_note: >-
      Not applicable - no algorithm is produced. The one operational tradeoff is
      grid size against seed count; the record fixes 5 seeds per cell for the
      grid and 20 at three anchor cells for distributions, because a spread
      estimated from 5 seeds is what the acceptance rule divides by.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null. As an
