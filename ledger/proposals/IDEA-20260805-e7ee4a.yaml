idea:
  id: IDEA-20260805-e7ee4a
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-05'
  title: >-
    N5 executed at zero compute: the trace-vanishing mechanism as a selection
    rule, and an auxiliary-target census against the criterion
    log_p(det)/rank <= 1/4 -- the one neighbour the L1 closure explicitly does
    not cover, open and unscheduled since BATCH-001
  class: theory

  claim: >-
    THE EXPONENT 1/3 IS 1/rank OF A LATTICE WHOSE RANK IS 3 FOR A REASON THAT
    CAN BE STATED IN TWO LINES, AND THAT REASON IS A SELECTION RULE FOR THE ONE
    ROUTE THIS GOAL HAS LEFT UNSCHEDULED. Hom(E, E^{(p)}) with the degree form
    is isometric to the two-sided ideal P of reduced norm p in a maximal order
    O of B_{p,infinity}, with the form Nrd/p (frozen source, Section 4.2, lines
    244-246). Locally at p, B is ramified and P is the maximal ideal of the
    valuation ring, so Trd(P) is contained in pZ. Globally Trd takes integer
    values, and for a definite quaternion algebra |Trd(x)| <= 2 sqrt(Nrd(x)).
    Hence any x in P with Nrd(x) = p*deg(alpha) and deg(alpha) < p/4 satisfies
    |Trd(x)| <= 2 sqrt(p * deg) < p AND Trd(x) in pZ, forcing Trd(x) = 0. EVERY
    ISOGENY E -> E^{(p)} OF DEGREE BELOW p/4 IS THEREFORE CARRIED BY A RANK-3
    TRACE-ZERO SUBLATTICE, and since that sublattice has determinant asymptotic
    to p, Hermite gives min <= gamma_3 (p/4)^{1/3} = (p/2)^{1/3}, which is
    Theorem 1.5's constant exactly. The exponent is log_p(det)/rank = 1/3.
    THE PROPOSAL: run the census this identity makes possible. For an auxiliary
    target to yield exponent 1/4 it must supply a lattice with
    log_p(det)/rank <= 1/4 -- the admissibility criterion this goal's own
    exponent_budget_corrections block already records, and which no record has
    yet applied to anything. Each candidate in a closed, pre-registered list is
    to be CLOSED with its computed (rank, det) pair, or left OPEN with the
    exact quantity that must be computed named. Two cells are decidable at
    zero compute and are decided in this proposal as forced values offered for
    attack: Hom(E, E') for a generic supersingular E' has rank 4 and
    determinant independent of the pair (giving 1/2), and E^{(p^k)} is
    degenerate because E^{(p^2)} = E over F_{p^2}. The remaining cells --
    oriented curves, prescribed-torsion targets, superspecial abelian surfaces,
    targets over larger fields -- are exactly N5, which EV-SSIQ-e43afd O-7
    records as NOT COVERED and which goal deferral (iv) leaves open and
    unscheduled.
    NO NEW EXPONENT IS CLAIMED. The census's most likely output is a table of
    closed cells with numbers attached and one or two cells that need a real
    computation, and that table is completion criterion 2 for the one lever it
    has never been written for.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (rank, log_p det) OF THE HOM-LATTICE ATTACHED TO A CHOICE OF
      AUXILIARY TARGET, followed as the target varies. Not the curve, not the
      isogeny, not the degree: the two integers that determine the achievable
      exponent through Hermite. The reduced trace Trd is the auxiliary tracked
      object -- it is the quantity whose forced vanishing collapses rank 4 to
      rank 3 and buys the whole difference between exponent 1/2 and 1/3.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) improving the bound for the target
      E^{(p)} itself -- lever L1, CLOSED-IN-SCOPE by EV-SSIQ-e43afd, and this
      proposal does not reopen it, it goes to the one place the closure says it
      does not reach; (b) meet-in-the-middle and claw finding -- the census is
      about which lattice the search runs in, not how the search runs;
      (c) smoothness and success probability -- F4 carries no exponent;
      (d) memory tradeoffs -- lever L5.
    newness_score: >-
      THE MECHANISM IS NOT NEW TO THIS CAMPAIGN AND IS EXPLICITLY CREDITED. The
      trace-vanishing derivation, the determinant p^2/16 for the rank-4 object,
      and the reproduction of Theorem 1.5's constant are all in
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/
      TASK-20260805-87e568/L1_ceiling_audit.md sections 2.2 and 2.3, and the
      admissibility criterion log_p(det)/rank <= 1/4 is in the goal record's
      own exponent_budget_corrections. WHAT IS NEW IS THAT NOBODY HAS APPLIED
      THE CRITERION TO A CANDIDATE. N5 is recorded as NOT COVERED in the
      evidence record, minted as a separate lever so a CLOSED verdict cannot
      absorb it, and then left unscheduled through five batches. A criterion
      with no census is a criterion nobody used.
    testability_score: >-
      Mixed, honestly. Two cells are decidable by algebra alone. Two more need
      a determinant computation that is standard but that this environment
      cannot verify (no Sage, no sympy -- measured this session: numpy 2.4.6
      imports, sympy does not). The abelian-surface cell needs a normalisation
      argument about how the DEGREE form on a higher-dimensional Hom behaves
      under lattice-point counting, and that argument is the deliverable rather
      than a step.
    survival_score: >-
      The selection rule survives whatever the census returns. The census's
      cells survive only as far as their determinants can actually be
      computed, and the honest expectation is that at least one cell ends as
      OPEN-WITH-A-NAMED-COMPUTATION rather than closed.

  mechanism: >-
    DERIVED HERE, WITH CREDIT WHERE THE CAMPAIGN ALREADY HAS IT.

    (1) THE SELECTION RULE. For a positive definite lattice L of rank r and
    determinant D under a quadratic form q, Hermite gives
    min(L) <= gamma_r D^{1/r}, so log_p min <= log_p(D)/r + O(1/log p). If the
    search cost is driven by the minimum (as it is here: the list threshold T
    must exceed the minimal degree, and one attempt costs T^{1+o(1)} by
    IDEA-20260805-250e50's STEP 2), then the achievable exponent for that
    target family is at best log_p(D)/r. THE CRITERION IS THEREFORE
      admissible for 1/4 <=> log_p(det) / rank <= 1/4.
    This is the goal record's own corrected admissibility_criterion, and the
    record notes it "admits rank 4 with det <~ p" and that "rank > 3 is exactly
    where N5's higher-dimensional case lives".

    (2) WHY rank = 3 FOR THE INCUMBENT, IN FULL. Frozen source Section 4.2
    (lines 244-246) states the isometry (Hom(E, E^{(p)}), deg) =~ (P, Nrd/p)
    where P is the unique two-sided ideal of reduced norm p in O. Then:
      (a) Nrd(P) = p implies [O : P] = p^2, so det(P, Nrd) = p^4 det(O, Nrd);
          scaling the rank-4 form by 1/p divides the determinant by p^4, giving
          det(P, Nrd/p) = det(O, Nrd). The determinant is therefore INDEPENDENT
          of which two-sided ideal, and equals the maximal order's own.
      (b) Locally at p the algebra is ramified: O_p = O_K + O_K*Pi with K/Q_p
          unramified quadratic, Pi^2 = p, and Pi*a = conj(a)*Pi. For x = a*Pi,
          Trd(x) = a*Pi + conj(a*Pi) = a*Pi - Pi*conj(a) = a*Pi - a*Pi = 0; for
          x = p*b, Trd(x) = p*Trd(b) in pZ. Since P_p = O_K*Pi + p*O_K, we get
          Trd(P) contained in pZ.
      (c) Definiteness gives Trd(x)^2 <= 4 Nrd(x). With Nrd(x) = p*deg and
          deg < p/4, |Trd(x)| < p, so Trd(x) = 0.
    Hence for every degree below p/4 -- and the whole search lives at degree
    p^{1/3} << p/4 -- the relevant vectors lie in the rank-3 trace-zero
    sublattice. The campaign's L1 audit reaches the same place by an equivalent
    computation and records det = p/4 with N_1 = delta_E and
    p/4 <= N_1 N_2 N_3 <= p/2; that record is the authority and this derivation
    is offered as an independent path to it, to be checked rather than trusted.
    log_p(p/4)/3 -> 1/3. THE 1/3 IS 1/rank AND THE rank IS 3 BECAUSE THE ALGEBRA
    RAMIFIES AT p.

    (3) THE FIRST CENSUS CELL, DECIDED. For E' an arbitrary supersingular curve,
    Hom(E, E') with the degree form is isometric to (I, Nrd/N) for a connecting
    ideal I of reduced norm N. By the same index computation as (2a),
    det(I, Nrd/N) = det(O, Nrd) for EVERY connecting ideal, i.e.
      THE DETERMINANT OF (Hom(E,E'), deg) IS THE SAME FOR EVERY ORDERED PAIR OF
      SUPERSINGULAR CURVES, AND EQUALS det(End(E_0), deg).
    That is a forced value. Its p-dependence is p^2 up to an absolute
    normalisation constant, giving rank 4 and log_p(det)/rank = 1/2, which is
    the classical statement that the minimal isogeny degree between two random
    supersingular curves is p^{1/2+o(1)}. Trd is UNCONSTRAINED on a general
    connecting ideal -- the argument in (2b) uses two-sidedness at the ramified
    prime and nothing weaker -- so the rank does not collapse and there is no
    1/3 for a generic target. THE CENSUS'S FIRST ROW IS THEREFORE A CLOSURE
    WITH A MECHANISM: substituting a generic target loses exactly the
    trace-vanishing, and loses it for a reason (no two-sided structure), not
    for want of effort. This row also functions as the census's own NULL
    OBJECT, and it is the same null EV-SSIQ-e43afd O-7 records as N4.

    (4) THE CELLS THAT REMAIN, EACH WITH THE EXACT QUANTITY TO COMPUTE.
      C1  E^{(p^k)}, k >= 2. DEGENERATE: E^{(p^2)} = E for E over F_{p^2}
          (frozen source line 220 uses exactly this). Closed at zero compute,
          no quantity to compute. Already recorded as N1.
      C2  Twists. Same j-invariant, same maximal order, isometric lattice.
          Closed, already recorded as N2.
      C3  E^{(p)}/G for #G = m. The invariant is the PRODUCT mT; already
          recorded as N3 and already closed with that invariant.
      C4  K-ORIENTED CURVES. If End(E) contains an order in an imaginary
          quadratic field K of discriminant d, the orientation-respecting
          isogenies are governed by Cl(O_K), of size |d|^{1/2+o(1)}. QUANTITY
          TO COMPUTE: the rank and determinant of the sublattice of
          Hom(E, E^{(p)}) commuting with the orientation, and, separately, the
          cost of ORIENTING an arbitrary supersingular curve. THE CENSUS MUST
          NOT SKIP THE SECOND: an oriented-curve exponent is only useful if the
          orientation is obtainable, and the standing expectation (RECALLED,
          UNVERIFIED) is that finding an orientation is itself as hard as the
          endomorphism ring problem. Recording that expectation as a CANDIDATE
          TO CHECK, with the check named, is this cell's deliverable.
      C5  PRESCRIBED-TORSION TARGETS: E' with a prescribed image of E[n] for
          small smooth n. QUANTITY TO COMPUTE: whether the congruence condition
          cuts a sublattice of Hom whose determinant grows slower than n^{2}
          times its index -- if the determinant grows exactly as fast as the
          index, the exponent is unchanged and the cell closes. THIS IS THE ONE
          CELL WHERE A CHEAP EXPLICIT COMPUTATION IS AVAILABLE at toy p, using
          the modular-polynomial machinery already committed under
          experiments/EXP-SSIQ-a85692/implementation/.
      C6  SUPERSPECIAL ABELIAN SURFACES. For A superspecial of dimension 2,
          End(A) has Z-rank 16 and Hom(A, A^{(p)}) likewise. QUANTITY TO
          COMPUTE: (i) whether a trace-type constraint collapses the rank, as
          it does in dimension 1, and to what; (ii) THE NORMALISATION -- for
          abelian varieties of dimension g the degree is a form of degree 2g,
          not a quadratic form, so lattice-point counting in the degree metric
          does NOT reduce to Hermite in rank 16 without an argument, and
          asserting log_p(det)/rank for this cell without that argument would
          be exactly the category error the L1 audit found in this goal's
          original obstruction field. NAMING THAT AS THE OBLIGATION IS THE
          CELL'S OUTPUT; producing a number without it would be worse than
          leaving the cell open.
      C7  TARGETS OVER LARGER FIELDS F_{p^{2k}}. QUANTITY TO COMPUTE: whether
          the Galois orbit {E, E^{(p)}, ...} regains members that are distinct
          over the larger field, and whether the two-sided structure at p
          survives base change. Cheap and probably closes by the same
          degeneracy as C1, but it has not been checked and is not assumed.

    (5) WHAT A PASSING CELL WOULD AND WOULD NOT MEAN. A cell with
    log_p(det)/rank = 1/4 supplies a target whose minimal isogeny has degree
    p^{1/4+o(1)}. That is a NECESSARY condition for a p^{1/4} route and not a
    sufficient one: the route also needs (i) the target to be CHEAPLY
    RECOGNISABLE from the input curve, which is what "auxiliary" means and what
    C4 most obviously fails, (ii) an analogue of Lemma 3.4's split, and
    (iii) a smoothness heuristic. The census's verdict column must therefore
    read "admissible on the lattice criterion", never "reaches 1/4".

