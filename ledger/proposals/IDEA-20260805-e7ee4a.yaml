  lossy_projection_identifiability_audit:
    projection: >-
      (auxiliary target family, the whole Hom-lattice attached to it) --> the
      ordered pair (rank, log_p det).
    what_is_discarded: >-
      The isometry class of the lattice, all successive minima beyond the
      first, the arithmetic of the target family, and every question of
      computability. Two integers are retained.
    why_genuinely_lossy: >-
      Enormously lossy: infinitely many inequivalent lattices share a (rank,
      det) pair. The fibre is the whole genus and more.
    why_compatible_with_the_operations: >-
      Because Hermite's bound depends on exactly and only those two numbers.
      The retained pair propagates deterministically to the quantity that
      matters -- an upper bound on the minimum -- without needing anything that
      was discarded. That is what makes it a legitimate projection for a
      SCREENING census rather than for a proof.
    is_it_only_a_change_of_coordinates: >-
      NO. The (Delta, Pi) failure -- a projection from which the original is
      recoverable -- does not apply: a lattice is not recoverable from (rank,
      det). THE MIRROR FAILURE IS THE ONE THAT HAD TO BE CHECKED AND IT DOES
      NOT FIRE EITHER: the projection is NOT constant across the census's
      candidates. It returns 1/2 for the generic target, 1/3 for the conjugate,
      and is undetermined for the higher-dimensional cells -- a comparator
      spread of at least 1/6 between two cells that are both decided. A census
      whose criterion returned the same value on every cell would be measuring
      the apparatus, and this one demonstrably does not.
      ONE REAL LIMITATION, STATED RATHER THAN HIDDEN: the projection is
      one-sided. Hermite is an UPPER bound on the minimum, so a small
      log_p(det)/rank ADMITS a small minimum but does not force one, and a
      large value does not forbid one either -- a lattice can have a minimum far
      below its Hermite bound. The census therefore SCREENS OUT nothing on its
      own; it produces necessary conditions and identifies where a real
      computation is required. This is the same category distinction the L1
      audit found this goal's original obstruction field violating, and the
      census must not repeat it.

  assumptions:
    - >-
      That the isometry of frozen-source Section 4.2 is stated for the DEGREE
      form and that Nrd/p is the correct scaling. Re-read and re-checked in
      writing this record; a misreading here would change every determinant in
      the census by a power of p and is the single most consequential
      transcription risk.
    - >-
      That "determinant" is used consistently across cells. The census must fix
      ONE convention (Gram determinant of the bilinear form b(x,y) =
      Trd(x conj(y)), say) and state it, because the difference between p^2 and
      p^2/16 is irrelevant to an exponent and fatal to a constant, and this
      campaign has already been burned by a constant that turned out to be a
      convention.
    - >-
      That Hermite's constant gamma_r is used only for r where its exact value
      is known (r <= 8) or a standard bound is quoted with its source. For the
      dimension-2 cell C6 no rank-16 Hermite constant is asserted.

  heuristic_assumptions:
    - id: HEUR-SS-4
      statement: >-
        None of the census's CLOSED cells rests on a heuristic. The closures in
        (3) and C1-C3 are algebraic identities: the determinant of a connecting
        ideal's Hom-lattice is pair-independent; E^{(p^2)} = E over F_{p^2};
        twists share the maximal order; the modified-target invariant is the
        product mT. Each is either derived in this record or already committed
        by TASK-20260805-87e568 and independently confirmed.
      rigorous_support: >-
        Index computation for the determinant; the definition of F_{p^2} for
        the Galois orbit; the L1 audit's own table for C2 and C3.
      validation_plan: >-
        Symbolic re-derivation plus, where the environment allows, an explicit
        check at toy p using the committed modular-polynomial machinery. No
        distributional claim is made, so no distributional validation is
        planned, and this entry exists to say so explicitly rather than to
        leave the field empty.
      falsification_condition: >-
        An explicit ordered pair (E, E') of supersingular curves whose
        Hom-lattice determinant differs from another pair's. That single
        counterexample refutes (3) and reopens the generic-target cell.
    - id: HEUR-SS-5
      statement: >-
        SCREENING VALIDITY. For a target family whose Hom-lattice is a positive
        definite quadratic lattice, the achievable search exponent is bounded
        below by log_p(det)/rank up to o(1) -- i.e. one cannot do better than
        the Hermite scale generically.
      rigorous_support: >-
        NONE, AND THE PROPOSAL DOES NOT USE IT AS A CLOSURE. Hermite bounds the
        minimum from above; a family in which the minimum is systematically
        far below its Hermite bound would defeat the screen. Such families
        exist (a lattice with one very short direction). The census therefore
        uses log_p(det)/rank as an ADMISSIBILITY test -- a cell that fails it
        is not closed, it is flagged as needing the successive-minima profile
        rather than the determinant alone.
      validation_plan: >-
        For the two decided cells, compare the criterion's prediction against
        the known answers: the conjugate target must return 1/3 and the generic
        target 1/2, both of which are independently established. That is a
        two-point calibration of the screen itself, and it is the only
        validation available without new mathematics.
      falsification_condition: >-
        The criterion fails to return 1/3 for the conjugate target or 1/2 for
        the generic one. The screen is then not calibrated and no cell's
        verdict may be recorded.

  predictions:
    - metric: >-
        log_p(det)/rank for the incumbent target E^{(p)}, computed from the
        trace-zero rank-3 sublattice
      direction: different
      minimum_effect: >-
        EXACTLY 1/3 in the limit, with the constant reproducing
        gamma_3 (p/4)^{1/3} = (p/2)^{1/3}. Forced value, derived before any
        computation. A mismatch invalidates the census's calibration.
    - metric: >-
        log_p(det)/rank for a generic supersingular target E'
      direction: different
      minimum_effect: >-
        EXACTLY 1/2, from rank 4 and determinant asymptotic to p^2. Forced
        value. This is simultaneously the census's null object: the criterion
        MUST separate it from 1/3, and a criterion returning the same value for
        both is measuring nothing.
    - metric: >-
        pair_independence: the number of distinct values of det(Hom(E,E'), deg)
        over all ordered pairs of supersingular curves at a toy prime
      direction: lower
      minimum_effect: >-
        EXACTLY 1. Derived from the index computation before any run. If the
        measured value exceeds 1, the derivation in (3) is wrong and the
        generic-target cell reopens -- which would be the most interesting
        outcome available in this census.
    - metric: >-
        number of census cells CLOSED with a computed (rank, det) pair, out of
        the seven pre-registered cells
      direction: higher
      minimum_effect: >-
        At least 4 of 7 (the incumbent, generic, C1, C2, C3 are expected to
        close; C1-C3 close by reproducing committed results and count only as
        reproductions, not as new closures). At least 1 cell must be left OPEN
        with a named computation -- a census that closes everything has almost
        certainly asserted something it did not compute, and C6's normalisation
        obligation is the specific place that would happen.
    - metric: >-
        For cell C5 (prescribed torsion at small smooth n), the ratio
        det(sublattice)/([Hom : sublattice]^2 * det(Hom)) at toy p
      direction: different
      minimum_effect: >-
        FORCED VALUE 1 for any finite-index sublattice, by the standard index
        formula. The measurable content is the INDEX itself: if imposing a
        prescribed image of E[n] cuts an index-n^{k} sublattice, the criterion
        moves from log_p(det)/rank to (log_p det + 2k log_p n)/rank, which
        RISES. The pre-registered prediction is therefore that C5 makes the
        criterion WORSE, and measuring k is what decides by how much.

  minimal_test:
    design: >-
      Entirely pen-and-paper with two optional cheap computations, ordered so
      the cheapest gate is decisive. STAGE 0 (zero compute, ~3 hours): fix the
      determinant convention; re-derive (2) and (3); compute the criterion for
      the incumbent and the generic target and check they return 1/3 and 1/2.
      IF THE CALIBRATION FAILS, STOP -- no cell may be recorded. STAGE 1 (zero
      compute): close C1, C2, C3 by reproducing the committed L1 audit rows,
      citing them rather than restating them, and record that they are
      reproductions. STAGE 2 (zero compute, the substantive part): for C4, C5,
      C6, C7 write the exact quantity that must be computed, what is already
      known about it and at what provenance, and whether it is computable in
      this environment. STAGE 3 (optional, minutes, pure Python at toy p): the
      pair-independence check and the C5 index measurement, using the committed
      modular-polynomial data under
      experiments/EXP-SSIQ-a85692/implementation/modpoly_data.
    controls:
      - >-
        NULL OBJECT (structure-free target, and it can fail): the generic
        supersingular target E'. FORCED VALUE 1/2, derived before any
        computation. If the criterion returns 1/3 here, it is not responding to
        the trace-vanishing structure and the census is void. This is the same
        null the L1 audit used as N4, reused deliberately so the two agree or
        disagree visibly.
      - >-
        POSITIVE CONTROL (the effect MUST appear): the incumbent target
        E^{(p)}, where the answer 1/3 is independently established by a
        committed and independently confirmed derivation. If the criterion does
        not return 1/3 here, no negative verdict may be recorded for any cell.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: cell C3's
        family E^{(p)}/G with #G = m for m in {1, 4, 16, 64}. The committed
        invariant is the product mT, so the criterion must move as
        (log_p(det) + f(m))/rank with f monotone increasing in m and f(1) = 0.
        Reporting the monotonicity localises whether a failure is in the
        determinant bookkeeping or in the rank.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION IS KNOWN FALSE: apply the
        criterion to the ORDINARY case -- an ordinary elliptic curve over a
        finite field, where End(E) has rank 2, not 4, and where the isogeny
        problem is NOT solved at p^{1/rank}. The criterion returns
        log_p(det)/2, and if that number were predictive the ordinary isogeny
        problem would have a cost it demonstrably does not have. THE CRITERION
        MUST BE SEEN TO FAIL HERE, and recording that failure is what
        establishes it as a screen rather than a theorem. A census that does
        not exhibit this failure has overclaimed its own instrument.
      - >-
        ARCHIVE CHECK (zero compute): every prior application of the criterion
        in this corpus. NONE EXISTS -- the criterion was recorded in the goal
        record on 2026-08-05 and has not been applied since. Recorded as an
        absence, not as a passed check.
    required_metrics:
      - the fixed determinant convention, stated once, with every cell's number in it
      - a seven-row table: cell, rank, log_p det, criterion value, verdict, and for OPEN cells the exact quantity to compute
      - the two calibration values (1/3 and 1/2) and whether they were recovered
      - the ordinary-curve control's output and the explicit statement that the criterion fails there
      - for each NOT-READ ingredient, the provenance label and the check that would settle it

  falsification_conditions:
    - >-
      The calibration fails: the criterion does not return 1/3 for E^{(p)} or
      1/2 for a generic target. The census is void and nothing is recorded
      beyond the failure.
    - >-
      The pair-independence forced value is violated at toy p. Derivation (3)
      is wrong; the generic-target row reopens and the census's null object
      must be replaced.
    - >-
      A reader exhibits a supersingular target family whose minimal isogeny
      degree is far below its Hermite scale. HEUR-SS-5 fails, the criterion
      stops being a usable screen, and the census must be restated in terms of
      successive minima.
    - >-
      Every open cell turns out to need a computation this environment cannot
      perform. The deliverable is then a scoped statement of what is needed
      (specifically: quaternion order arithmetic, which requires Sage or Pari
      and neither is present -- numpy 2.4.6 imports in this container, sympy
      does not), recorded as an INFRASTRUCTURE REQUEST under AGENTS.md rule 5
      and never as a mathematical closure.

  confounders:
    - >-
      NORMALISATION. Determinant, discriminant, reduced discriminant and the
      Gram determinant of Trd(x conj(y)) differ by fixed powers of 2 and by
      squarings. Every one of them is called "the determinant" somewhere. The
      census fixes one and states it; a census that mixes conventions produces
      a table of numbers that cannot be compared, which is the failure mode
      most likely to make this proposal worthless.
    - >-
      HERMITE IS ONE-SIDED. Stated in the identifiability audit and repeated
      here because it is the confounder a reader will reach for first: a small
      criterion value does not produce a short vector, and a large one does not
      forbid it.
    - >-
      RECOGNISABILITY IS NOT IN THE CRITERION. A target family can be
      admissible on the lattice criterion and useless because the target cannot
      be computed from the input. C4 is the obvious case. Every verdict column
      must carry that caveat or the table will be misread.
    - >-
      REPRODUCTION MASQUERADING AS RESULT. Three of the seven cells reproduce
      rows the L1 audit already closed. They are labelled reproductions, and
      counting them as census output would inflate the deliverable.

  interpretation_limits:
    - >-
      NO EXPONENT IS CLAIMED AND NO ALGORITHM IS PROPOSED. The census produces
      necessary conditions on a target family, and an admissible cell is a
      place to look, not a result.
    - >-
      LEVER L1 IS NOT REOPENED. EV-SSIQ-e43afd's CLOSED-IN-SCOPE verdict for
      the target E^{(p)} and small-degree-modified targets stands unchanged.
      This proposal operates exclusively in the region that verdict declares it
      does not cover, and the reversion condition recorded with that closure is
      not triggered by anything here.
    - >-
      A CLOSED CELL IS CLOSED ON THE LATTICE CRITERION ONLY, at derivation
      tier, and closes no route that does not go through a Hom-lattice minimum.
      Forward guidance is mandatory on every closed cell and the residual for
      the census as a whole is: target families whose search cost is not driven
      by a lattice minimum at all -- which is what IDEA-20260805-c60813's
      relation-collection architecture would be if it worked.
    - >-
      Conditional tiers are inherited unchanged: Heuristic 1 for OneEnd and
      EndRing, and additionally GRH for the isogeny problem (SC-1). Any
      candidate arising here must also satisfy SC-2.

  proof_search_map_note: >-
    Proof-oriented. The paired hypothesis for this proposal is H-SSIQ-90e07b,
    whose proof_search_map carries the method-ceiling and nearby-object audits
    that govern both this census and the cost identity it screens for; the
    ordinary-curve control above is the nearby-object where the criterion is
    known to fail, and it is named there as well.

  target_complexity:
    time_exponent: >-
      n/a for the census itself. The criterion it computes is the achievable
      exponent for each target family: 1/3 for E^{(p)}, 1/2 for a generic
      target, and undetermined for the four open cells. NO VALUE BELOW 1/3 IS
      CLAIMED FOR ANY CELL.
    memory_exponent: >-
      n/a for the census. For any admissible cell the memory exponent would
      equal the list threshold, as in IDEA-20260805-250e50, and must be stated
      before the cell is called an improvement.
    best_known: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (and GRH for
      Isogeny); p^{1/2}(log p)^{O(1)} unconditional.
    hidden_overhead: >-
      Not assessed. A census does not reach cost analysis, and the o(1) of any
      future candidate is not assumed smaller than the incumbent's.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). Rows checked across time, memory and data/queries
    before writing: (i) the frozen source's Section 4.1 table, both columns, at
    five sizes; (ii) the goal record's incumbent_baselines block and its
    tradeoff_curve row; (iii) all five EV-SSIQ-* evidence records, for a prior
    census of auxiliary targets -- the L1 audit's N1-N5 table is the only one
    and it leaves N5 uncovered; (iv) knowledge/techniques/KN-TECH-058's
    F_p-restricted row, excluded by this question's own constraint as a
    different problem; (v) data/query axis -- no oracle, no samples, recorded
    as not applicable.
  sota_delta: >-
    ZERO on every attack axis. The quantitative deliverable is a seven-row
    table with a computed criterion value per row, of which at least two carry
    forced values (1/3 and 1/2) and at least one must be left OPEN with the
    exact missing computation named. Against the current state -- a criterion
    recorded in the goal record on 2026-08-05 with zero applications, and a
    lever N5 minted specifically so it could not be absorbed, then left
    unscheduled through five batches -- the delta is the difference between an
    unapplied criterion and a decided lever map, which is completion criterion
    2 for the only lever it has never been written for.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that the selection rule calibrates, i.e. returns 1/3 and 1/2 on the
    two known cells. Not higher because the determinant convention is a real
    trap and because the derivation in (3) is this record's own. Not lower
    because both target values are independently committed by
    TASK-20260805-87e568 and TASK-20260805-89a2e7.
    0.15 that any of C4-C7 turns out admissible at 1/4 on the criterion. Not
    lower, because the criterion demonstrably admits rank 4 with determinant
    around p and nobody has checked whether such an object exists among the
    named families, and because premature closure is this program's documented
    symmetric failure mode. Not higher, because the two cells with the most
    room (C6's rank 16, C4's orientation) each carry a specific obstacle --
    the degree form on abelian surfaces is not quadratic, and an orientation is
    not cheaply obtainable -- and neither obstacle looks like an oversight.
    0.75 that at least one cell ends OPEN rather than closed, which is the
    outcome the design prefers to a table of confident numbers.
