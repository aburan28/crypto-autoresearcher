idea:
  id: IDEA-20261016-fb1656
  title: Per-entry modular-polynomial cost against the NIST-I Delfs–Galbraith gap
  status: proposed
  question_id: RQ-WESO-8aff57
  proposed_by: idea-generator
  approved_by: null
  added: '2026-10-16'
  class: measurement
  claim: >-
    At p = 5·2^{248}−1, let B* minimise the Section 4.1 cost M/P0, and let Δ be
    log2 of (Delfs–Galbraith’s printed ≈2^{128} F_{p^2}-operations) minus
    log2(M/P0) at that same p. Let c be the minimum, over the direct algorithm
    (reduce Φ_ℓ and find its roots at one supersingular j) and one batched
    multipoint evaluation of Φ_ℓ written down before any timing, of the
    entry-weighted F_{p^2}-multiplication count of the non-backtracking
    batches Algorithm 1 issues at (X(B*), B*). The asserted label is c ≥ 2^Δ.
    Under the section’s identification of one attempt with M field operations,
    that label lifts the NIST-I time lower bound to at least the Delfs–Galbraith
    line. The printed rounded row has 2^{106.5} and 2^{128}, so its Δ is 21.5;
    the test uses the recomputed Δ at the exact prime.
  mechanism: >-
    Lemma 3.3 charges (B+log p)^{O(1)} per batch of at most ℓ+1 neighbours and
    the footnote leaves the exponent uninvestigated because it is absorbed in
    p^{o(1)}. Section 4.1 then replaces that charge by one F_{p^2}-operation
    per entry. The tracked object is the coefficient vector of Φ_ℓ(j, Y) mod p
    together with its ℓ+1 roots. Relative to Φ_ℓ over Z this discards
    archimedean coefficient size; evaluation and root-finding propagate the
    reduced polynomial. Relative to kernels in E[ℓ] ≅ (Z/ℓ)^2 the neighbour-j
    map is bijective when #Aut = 2, so the j-graph step is a coordinate change
    of the kernel set, not a new lossy attack invariant. The unpriced quantity
    is the cost of that coordinate change. Operation set: one non-backtracking
    ℓ-step of Algorithm 1 (partial action on the ℓ-isogeny graph). IDEA-20260805-f9e801
    checks that the printed exponents match M = Ψ(X,B)·X; this record leaves
    those exponents fixed and multiplies by c. IDEA-20260815-45aa63 inventories
    the paper’s optimism flags and does not count multiplications.
  novelty_status: unverified
  citations:
    - {ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, provenance: internal, claim: "Lemma 3.3 footnote; Section 4.1 NIST-I row.", verified_by: idea-generator}
