  minimal_test:
    design: "At p = 5·2^{248}−1, take B* from the Section 4.1 formulas. For primes ℓ ≤ B* in the top half of Algorithm 1 batches, count F_{p^2} multiplications for direct root-finding at 20 supersingular j outside {0, 1728}, and from the batched algorithm written down first."
    controls: ["Same j-list for every ℓ.", "Charge Φ_ℓ over Z once and per batch.", "Schoolbook multiplication is the unit."]
    required_metrics: ["c_direct", "c_batched", "c", "Δ", "log2(c)/Δ"]
  falsification_conditions:
