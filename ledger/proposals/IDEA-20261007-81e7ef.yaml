idea:
  id: "IDEA-20261007-81e7ef"
  question_id: RQ-SSI-1946c9
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: "Toy correctness and failure-profile harness with null-witness control"
  class: measurement
  claim: "A frozen toy harness reporting decryption-agreement rate, a fixed failure taxonomy, and a runtime profile on a declared prime and solver slice, together with a same-shape null-witness control that must score at chance, separates well-typed-correct instances from named interface obstructions (encoding, canonicalization, inverter-failure, bit-flip) with no security inference in either direction."
  mechanism: "Harness pins the parameter slice (p, E0, walk lengths, bound B, encoding rule, tie-breaks, trial count N, seeds), runs the candidate KeyGen plus Encrypt plus Decrypt loop, classifies every trial into exactly one bin (correct, encoding-reject, canonicalization-mismatch, inverter-failure, preimage-bit-flip, decoder-error), profiles per-operation toy time, and reruns the identical schedule with a null witness (uniform random bytes of sk length driving the same decoder API) that must sit at chance. Divergence of the real witness above the null band with a concentrated taxonomy bin is well-typed correctness on that slice; dispersion across bins or null overlap returns the dominant bin as the named interface obstruction with a pointed repair. Unexpected observations are retained as bins, never discarded."
  novelty_status: unverified
  citations:
    - {ref: "IDEA-20261004-a09dd4", provenance: "recalled", claim: "Bridge audit needs a correctness substrate; this harness supplies it without duplicating the distance check", verified_by: null}
    - {ref: "IDEA-20261004-edbd24", provenance: "recalled", claim: "Witness-ladder idea; this harness supplies its measurement layer with a null-object control", verified_by: null}
    - {ref: "KN-OPEN-013", provenance: "recalled", claim: "Scope discipline that toy evidence never extrapolates", verified_by: null}
    - {ref: "KN-TECH-028", provenance: "recalled", claim: "Deuring and KLPT context for stating the solver under test", verified_by: null}
  assumptions:
    - "Slice, encoding, tie-breaks, seeds, and solver version are frozen before the run; any change is a new run record."
    - "Null witness matches the real witness byte-shape and API but carries no order information."
    - "Unconditional measurement: no heuristic assumptions are invoked, stated explicitly here rather than invented."
    - "Failed attacks, distinguisher absence, and high agreement are recorded as correctness observations, never as security results."
  proof_search_map:
    bottleneck: null
    baseline_embedding: {parameter_slice: null, reproduction_check: null}
    observation_collision: {observable: null, distinct_preimage_search: null}
    constructive_transforms: []
