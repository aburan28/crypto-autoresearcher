  predictions:
    - {metric: "null-witness agreement rate", direction: "different", minimum_effect: "null sits inside 0.50 plus-minus 0.08 for 1-bit messages over N at least 300, else the harness not the candidate is broken"}
    - {metric: "real-minus-null agreement gap", direction: "higher", minimum_effect: "well-typed verdict requires real agreement at least 0.85 with gap at least 0.27 and a single dominant failure bin holding at least 0.60 of failures; otherwise the dominant bin is returned as obstruction"}
  minimal_test:
    design: "Apply the frozen harness to one template instance (for example IDEA-20261007-20f660) on one toy prime with N at least 300 real plus N at least 300 null trials under identical schedules."
    controls: ["same-shape null witness through the same decoder API", "fixed-seed replay", "input-validation control with malformed ciphertexts that must reject deterministically"]
    required_metrics: ["agreement rates with Wilson intervals for real and null", "failure-taxonomy histogram", "per-operation toy timings", "seed and version manifest"]
  falsification_conditions:
    - "Null outside the chance band falsifies harness validity and blocks any candidate verdict until the harness is repaired."
    - "Real inside the null band falsifies well-typed correctness on that slice and returns the dominant failure bin as obstruction."
    - "Failures spread evenly across bins with no dominant bin returns diffuse-interface obstruction with forward guidance to pin encoding and canonicalization first."
  confounders:
    - "Seed reuse correlating real and null schedules."
    - "Wall-clock noise mistaken for algorithmic profile on shared hardware."
    - "Overly strict encoding checks converting correct decryptions into rejects."
    - "Small-N intervals overlapping and masquerading as equivalence."
  interpretation_limits:
