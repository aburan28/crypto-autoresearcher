idea:
  id: IDEA-20260813-319645
  title: >-
    Electric-network / span-program re-derivation of the MNRS quantum walk
    on the BJMM/MMT representation graph
  class: algorithm
  claim: >-
    Re-deriving Kachigar-Tillich's quantum-walk hitting time for the
    BJMM/MMT representation-technique search graph via Belovs' electric-
    network (effective-resistance / span-program) framework, in place of
    the standard MNRS spectral-gap framework, does NOT change the
    algorithm's leading exponential-in-n cost term for the near-regular
    search graphs this family uses, because the electric-network framework
    is known to coincide with the MNRS bound (up to constant/polylog
    factors) on graphs with near-uniform conductance structure, and any
    apparent gain from re-deriving it would be a bookkeeping artifact rather
    than a genuine tighter bound. This discriminates between "the composite
    BJMM/MMT search graph has enough conductance non-uniformity for the
    electric-network framework to beat MNRS" and "it is close enough to
    regular that the two frameworks coincide".
  mechanism: >-
    MNRS (Magniez-Nayak-Roland-Santha) quantum walk search gives hitting
    time proportional to 1/sqrt(delta*epsilon) via the walk's spectral gap
    delta and marked-fraction epsilon; this underlies Kachigar-Tillich's
    algorithm on the Johnson-graph-like representation-technique search
    space. Belovs' electric-network framework instead bounds hitting time
    via effective resistance / commute time between the "no marked vertex
    found" state and marked vertices, and is known (in its motivating
    application, k-distinctness) to give a TIGHTER bound than MNRS on
    graphs with highly non-uniform conductance. This proposal tests whether
    the BJMM/MMT representation-technique search graph -- built from
    near-regular Johnson-graph products with roughly uniform degree per
    level, but potentially non-uniform ACROSS levels due to differing
    list-sizes -- actually has the conductance non-uniformity the
    electric-network framework needs to beat MNRS, or is close enough to
    vertex-transitive that the two frameworks coincide.
  novelty_status: unverified
  assumptions:
    - >-
      The BJMM/MMT search graph is the standard multi-level representation-
      technique construction (2 or 3 levels) as used by Kachigar-Tillich's
      quantum-walk algorithm; this proposal treats that construction as
      given and does not re-derive it from HQC's specific parameters.
  proof_search_map:
    bottleneck: >-
      The exact structural property of the BJMM/MMT search graph (level-by-
      level regularity/conductance uniformity) that determines whether
      Belovs' framework can certify a STRICTLY tighter hitting time than
      MNRS's spectral-gap bound on this specific graph family.
    baseline_embedding:
      parameter_slice: >-
        The degenerate case of PLAIN Prange (no representation technique,
        pure Johnson-graph search over size-p subsets, which IS vertex-
        transitive and exactly regular) must reproduce the known result
        that MNRS and the electric-network framework give the SAME bound on
        vertex-transitive graphs (a known general fact about the electric-
        network framework, cited generically, not independently re-derived
        here).
      reproduction_check: >-
        Symbolic: verify that on a vertex-transitive graph, effective
        resistance reduces to a formula that is a fixed multiple of the
        inverse spectral gap, recovering MNRS exactly. Not yet performed to
        completion in this task; recorded as an open step.
    observation_collision:
      observable: >-
        The hitting-time bound produced by each framework, as a function of
        the search graph's structure.
      distinct_preimage_search: >-
        The BJMM/MMT representation-technique search graph is a
        product/composition of several near-regular Johnson-type graphs
        (one per representation-technique level), and while each LEVEL is
        close to vertex-transitive, the COMPOSITE graph across levels
        (where the branching factor differs by list-size at each level) may
        not be. AUDIT OUTCOME: INCONCLUSIVE without a level-by-level
        conductance calculation this proposal does not perform; recorded
        honestly as an open computation, not resolved by pure inspection
        the way IDEA-20260813-c34e09's audit was.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The per-level conductance profile of the BJMM/MMT composite
          search graph, in place of the single global spectral gap MNRS
          uses.
        predicted_gain: >-
          At most a constant or polylog factor, per method_ceiling below --
          explicitly NOT expected to move the exponential-in-n leading
          term.
    quantifier_order: >-
      FOR the specific composite BJMM/MMT search graph at HQC's parameters,
      DOES THERE EXIST a level where conductance is sufficiently non-
      uniform that Belovs' framework gives a hitting-time bound with a
      smaller CONSTANT (not exponent) than MNRS's -- a narrow, bookkeeping-
      level existential question, explicitly not a claim that could move
      the leading exponential term regardless of its answer.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, a constant-factor or low-degree-polynomial tightening of
        the existing Kachigar-Tillich hitting-time bound; the electric-
        network framework's known strict wins over MNRS (e.g.
        k-distinctness) occur on graphs with STRUCTURALLY non-uniform
        marked-vertex placement (a single hard-to-find marked clique in a
        huge graph), which is qualitatively different from ISD's roughly
        uniform marked-fraction epsilon setting.
      nearby_object_control: >-
        Applied the identical framework-comparison question to Ambainis's
        element-distinctness algorithm (the other canonical MNRS-framework
        application, cited generically) as the nearby object where the
        electric-network framework is KNOWN (from the literature, not
        independently verified by this program) to match rather than beat
        MNRS -- element-distinctness's search graph is a symmetric Johnson
        graph, structurally the closest well-studied analogue to
        Prange-style ISD's own Johnson graph. If BJMM/MMT's composite graph
        behaves more like element-distinctness (match) than like
        k-distinctness (genuine win), the method ceiling is confirmed at
        "no exponent gain, likely no gain at all beyond bookkeeping."
    proof_obligations:
      - claim: >-
          Vertex-transitive graphs give identical MNRS and electric-network
          bounds up to a fixed constant.
        responsibility: baseline
      - claim: >-
          The BJMM/MMT composite graph's level-by-level conductance profile
          is characterized (not yet done).
        responsibility: size
      - claim: >-
          Any gain found is bounded above by a constant/polylog factor and
          does not touch the leading exponential term.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Ratio of electric-network hitting-time bound to MNRS hitting-time
        bound for the BJMM/MMT composite search graph
      direction: lower
      minimum_effect: >-
        A ratio detectably below 1 (beyond a small constant attributable to
        bookkeeping slack) would be needed to call this a genuine
        tightening rather than a restatement; based on the nearby-object
        control (element-distinctness), the predicted outcome is a ratio
        indistinguishable from 1.
  minimal_test:
    design: >-
      Symbolic derivation of the per-level branching/conductance structure
      of the BJMM/MMT representation-technique search graph (2 or 3 levels,
      standard construction) from its own published recursive definition
      (Kachigar-Tillich / May-Meurer-Thomae, cited generically, not
      independently re-derived here), followed by a direct comparison of
      the resulting electric-network effective-resistance bound against the
      published MNRS-framework bound, at the level of symbolic exponent
      formulas -- no numerical simulation needed for the leading-order
      comparison.
    controls:
      - >-
        Reproduce the SAME symbolic comparison for plain Prange (single-
        level, exactly vertex-transitive) as a sanity check that the method
        correctly reports "no difference" there.
      - >-
        Reproduce the same comparison for Ambainis element-distinctness as
        the nearby-object control described in method_ceiling.
    required_metrics:
      - symbolic exponent ratio, BJMM/MMT composite graph
      - symbolic exponent ratio, plain Prange (expected exactly 1)
      - >-
        symbolic exponent ratio, element-distinctness (expected exactly 1,
        per literature this proposal does not independently verify)
  falsification_conditions:
    - >-
      The symbolic derivation finds a ratio detectably different from 1
      even for plain Prange (the vertex-transitive sanity check) --
      indicating an error in applying the electric-network framework, not a
      real finding, and the whole derivation must be redone before any
      claim about BJMM/MMT is credible.
    - >-
      The BJMM/MMT composite-graph ratio comes out non-trivially below 1
      AND survives the Prange/element-distinctness sanity checks -- this
      would be a genuine (if small, cofactor-class) positive finding worth
      escalating, though still explicitly bounded by method_ceiling to a
      non-exponential gain.
  confounders:
    - >-
      The "gain" this proposal could find, if any, is easily confused with
      a genuine gate-count/circuit-implementation improvement of the kind
      already published (Perriello et al., KN-LIT-aa3372/37562e/224f2c) --
      care is needed to distinguish a hitting-time-formula tightening from
      an implementation-level circuit optimization, which are different
      claims at different levels of the stack.
  interpretation_limits:
    - >-
      Even in the best case, this proposal is explicitly bounded to a
      constant/polylog-factor cofactor improvement per its own
      method_ceiling audit, never an exponent change, and must be presented
      as such if pursued further.
    - >-
      The proof_search_map's observation_collision audit is INCONCLUSIVE
      (not resolved), unlike IDEA-20260813-c34e09's audit which was
      resolved outright -- this is recorded honestly rather than forced to
      a clean pass or fail.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: >-
      Unchanged from Kachigar-Tillich's own exponent (not reproduced in
      this corpus or this proposal); at most a constant/polylog prefactor
      change is in scope.
    memory_exponent: unchanged, per the same reasoning.
    best_known: Kachigar-Tillich (2017, KN-LIT-80202e).
    hidden_overhead: >-
      None beyond what Kachigar-Tillich's own o(1)/polylog terms already
      carry -- this proposal does not introduce new hidden overhead, only
      possibly removes some.
    tradeoff_note: >-
      Inherited unchanged from Kachigar-Tillich; the electric-network
      framework does not have its own established time-memory tradeoff
      structure distinct from MNRS's for this graph family as far as this
      screening determined.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low

object_first_screen:
  established_families_forbidden_as_primary_lens:
    - >-
      Grover-only exhaustive search over information sets (Bernstein 2010,
      KN-LIT-4144).
    - >-
      Quantum-walk-accelerated MMT/BJMM representation-technique ISD
      (Kachigar-Tillich 2017, KN-LIT-80202e) -- treated as the object being
      re-analyzed, not as the analytical lens itself.
    - >-
      Circuit/qubit/memory-resource-axis refinements of the above (see
      IDEA-20260813-a46301's list).
  tracked_object: >-
    The effective-resistance / electrical-flow state of the quantum walk on
    the BJMM/MMT search graph (a real-valued potential/current object), in
    place of the raw graph-vertex state MNRS/Kachigar-Tillich track.
  novelty_axis: >-
    The electric-network framework itself (Belovs) is well-known and
    explicitly NOT claimed as new; what would be new, if it survived, is
    its specific application to THIS composite search-graph family --
    narrow novelty, honestly scoped.
  testability_axis: >-
    Testable symbolically as specified, though the specific composite-graph
    conductance derivation was not completed in this session (recorded as
    inconclusive, not skipped).
  survival_axis: >-
    Survives past the observation-collision audit (inconclusive rather than
    resolved) but is capped hard by the method_ceiling audit at a
    non-exponential gain -- likely to survive only as a small building-block
    finding, if that.
  lossy_projection_test: >-
    PASSES as a representation choice: the effective-resistance state is a
    genuinely different (not merely relabeled) mathematical object from the
    raw vertex-occupation-probability state MNRS tracks, and electrical-
    network theory guarantees this reformulation still determines hitting
    time correctly (it is a proven equivalent characterization, not a lossy
    discard at all, in fact -- it is a change of ANALYSIS METHOD on the
    same walk, not a change to what the walk tracks). This is flagged
    honestly: this proposal is better classified as method_ceiling-bounded
    ALGORITHM-ANALYSIS work than as a new tracked OBJECT in the KN-TECH-056
    sense, since it does not change what the quantum state itself encodes,
    only how its hitting time is bounded. Recorded plainly rather than
    forced to fit the object-first framing where it does not cleanly apply.

dominated_by: >-
  Kachigar-Tillich (2017, KN-LIT-80202e) dominates outright on the exponent
  axis (unchallenged by this proposal). On the constant-factor axis, this
  proposal has not been checked against the entire resource-optimization
  literature cluster (Perriello et al., Chevignard-Fouque-Schrottenloher,
  Kimura-Takayasu-Takagi) enumerated in retrieval-screen.yaml, any of which
  may already subsume whatever small constant-factor gain this framework
  re-derivation could offer -- that check was NOT performed (out of this
  session's budget) and is named as a required next step before this idea
  could be prioritized higher.
sota_delta: >-
  No verified numeric delta; conjectured bound is "constant/polylog factor
  at most, likely indistinguishable from 1 per the nearby-object control" --
  explicitly not an exponent_delta.

novelty_check:
  corpus_status: >-
    No corpus entry applying Belovs' electric-network / span-program
    framework to any code-based ISD search graph was found.
  web_status: >-
    WebSearch tool failed on all three queries attempted in this task
    (infrastructure error, not a null result); not independently checked.
