# IDEA-20261003-18f8c3
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-18f8c3
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-6 window table stores 32 entries and a width-5 table stores 16
  class: representation
  claim: >-
    A window of width 6 stores 32 precomputed entries. A window of
    width 5 stores 16. Thirty-two exceeds sixteen by 16. The
    product of the two table sizes is 512. Their sum is 48. The
    gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    5 is 32. Two to the power 4 is 16. Two width-5 tables both
    store 16, so that gap is 0 and their product is 256. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 16.
    baseline_embedding:
      parameter_slice: The widths 6 and 5 and the sizes 32 and 16.
      reproduction_check: >-
        Two readers must agree that 2 to the power 5 is 32 and that
        2 to the power 4 is 16.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 16 drops the gap. Two width-5
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-5 table.
        predicted_gain: Sixteen fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 32 and 16. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-5 tables. Both store 16, and the gap is 0.
    proof_obligations:
      - claim: The width-6 table stores 32 entries.
        responsibility: size
      - claim: The width-5 table stores 16 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Thirty-two exceeds sixteen by 16.
  minimal_test:
    design: >-
      Compute 2 to the power 5 and 2 to the power 4. Do not add a
      curve point.
    controls:
      - Two width-5 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-6 table size is not 32.
    - The product of the two sizes is not 512.
  confounders:
    - A width-5 table of size 16 is a different window from a width-4 table of size 8.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 16 and 8.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-6 table has size 2 to the power 5, and the
        frozen width-5 table has size 2 to the power 4.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Thirty-two stored entries versus sixteen, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 32 and 16 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 32 versus 16
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
