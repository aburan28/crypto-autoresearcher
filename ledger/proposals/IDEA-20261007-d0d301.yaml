idea:
  id: IDEA-20261007-d0d301
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Monomial count of an orbit-substituted S_3 against three free variables
  class: measurement
  claim: >-
    Let E be the lexicographically first nonsingular ordinary curve
    y^2 + x y = x^3 + a x^2 + b over F_2, with (a, b) in {0, 1}. Let m_orbit
    be the number of nonzero monomials, in the monomial basis of F_{2^5}, of
    the polynomial in one target coordinate obtained by substituting the
    orbit (t, t^2, t^4) into the classical summation polynomial S_3 and
    reducing by the field equation. Let m_free be the same count when three
    independent variables are substituted and each is reduced by its own
    copy of the field equation, then eliminated to the same target
    coordinate in the same monomial order. The claim is m_orbit <= m_free / 2.
    The concrete negative is m_orbit > m_free / 2. This is a monomial count
    on an elliptic curve at n = 5. It is not a total degree of a dimension-2
    quotient at the excluded prime, and it is not a degree-4 Macaulay rank
    ratio. The rho exponent stays 1/2. The delta versus that exponent is 0.
  mechanism: >-
    Substituting a Frobenius orbit identifies three summand coordinates.
    Three free variables do not. The tracked object is the support of the
    reduced polynomial, not its first-fall degree and not a factor base.
    Representation class R1. No relation is collected. The curve
    y^2 = x^3 + x + 1 is not used.
  novelty_status: unverified
  citations:
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        Weil descent of S_3 to F_2 has first fall degree 2 because the
        trace of x is a group morphism. A monomial count is a different
        integer.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Choosing a subspace V lowers degree after Weil descent. This test
        does not choose V. It counts monomials of one substitution.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
  assumptions:
    - A singular curve is instrument_failure, not a monomial count.
    - The same monomial order is used on both arms. A change of order voids the run.
  predictions:
    - metric: m_orbit compared with m_free / 2
      direction: lower
      minimum_effect: "<= 1/2 of m_free"
  minimal_test:
    design: >-
      Build S_3 for the frozen curve over F_2. Count monomials after the
      orbit substitution and after the three-variable substitution. Do not
      run a Gröbner basis to completion beyond the elimination that defines
      the two counts. Do not collect relations.
    controls:
      - A zero discriminant voids the run.
      - m_free is positive. A zero free count is instrument_failure.
      - Repeating the count in the same monomial order returns the same integers.
    required_metrics:
      - m_orbit
      - m_free
      - the curve coefficients a and b
      - the monomial order name
  falsification_conditions:
    - m_free is positive and m_orbit is strictly greater than m_free / 2.
  confounders:
    - First-fall degree 2 is not this count. Recording it does not choose the row.
    - A total degree of a dimension-2 quotient system is not this count.
  interpretation_limits:
    - Toy scope: one binary curve at n = 5.
    - The exponent 1/2 is unchanged whether or not the monomial count drops.
    - A drop here does not certify a solving-degree drop.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Identifying three coordinates by the Frobenius orbit removes at
        least half of the monomials that three free variables contribute,
        at this toy size. This is not a theorem about solving degree.
      rigorous_support: >-
        The orbit substitution is a ring homomorphism. Nothing opened in
        this session forces the image to have at most half the monomials.
      validation_plan: >-
        Repeat the count at n = 7 on the same curve shape. If the ratio
        m_orbit / m_free exceeds 1/2 there, H1 fails. The n = 5 reading
        is still recorded.
  target_complexity:
    time_exponent: unchanged at 1/2
    memory_exponent: >-
      Unchanged. One polynomial over F_{2^5} is the memory.
    best_known: >-
      KR-IC-f5c584 for first fall degree 2, and KR-RHO-037e22 for the
      rho exponent 1/2. Neither is a monomial count.
    hidden_overhead: No o(1) term is claimed. The output is two integers.
    tradeoff_note: No time-memory tradeoff. The exponent stays 1/2.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-f5c584 and KR-RHO-037e22, both opened 2026-10-07.
    KR-RHO-037e22 dominates the generic side at exponent 1/2. A monomial
    count does not move it. KR-IC-f5c584 already prices first fall degree
    2, which this count does not replace.
  sota_delta: >-
    Zero change to the exponent 1/2. The integers measured are m_orbit
    and m_free. Relative to KR-RHO-037e22 the leading term is unchanged,
    so the delta is 0.
