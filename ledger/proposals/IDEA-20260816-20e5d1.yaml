idea:
  id: IDEA-20260816-20e5d1
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: 'A zero-compute proof-architecture audit of the forgery bound: rewrite it with explicit quantifier
    order over key, message, adversary and query schedule, then search for observation collisions
    - two toy parameter settings with the same bound value and provably different achievable optima
    - in both fields'
  class: theory
  claim: '(A) A forgery bound is used in practice as an OBSERVABLE: a number computed from (message
    length, query count, field size) and read as a summary of how exposed a parameter choice is. Inventor-protocol
    section 8 audit 2 says that any observable supporting a conclusion must be checked for collisions
    - distinct ground-truth objects mapping to the same observable value, preferably one on each side
    of the claimed conclusion. The claim is that this audit is applicable to the forgery bound, is
    cheap, and has never been run in this program. (B) The specific claim has two halves. HALF ONE,
    quantifier order (audit 3): the bound is rewritten with explicit forall and exists over the key,
    the two messages, the adversary''s query schedule, and the adversary''s adaptivity, and the resulting
    statement is compared against the way the bound is instantiated when a data limit is derived.
    If the derivation instantiates a for-all-adversaries statement where the proof supplies for-each-fixed-schedule,
    or vice versa, the mismatch is a locatable defect in the USE of the bound, recorded as a symbolic
    finding with no compute at all. HALF TWO, observation collision: exhibit, at toy parameters where
    the achievable optimum is exactly computable, two settings (L1, q1, field1) and (L2, q2, field2)
    with the same instantiated bound value but different measured optima. Such a pair is a direct
    demonstration that the bound value alone does not identify exposure, which is what an observable
    is supposed to do. (C) The pairing claim: the strongest collisions are cross-field, because the
    two fields can be made to share a bound value while differing in achievable root structure, and
    a cross-field collision is exactly the nearby-object control audit 4 asks for. (D) WHAT IS NOT
    CLAIMED: that any bound is incorrect - a valid upper bound admits collisions freely and remains
    valid; that any deployed derivation is defective, since no deployed derivation is examined here;
    no attack; and no statement about what any external document says. The audit examines statements
    this program writes down and instantiates itself.'
  mechanism: 'STAGE 1 is pure symbol manipulation and costs nothing but care. Write the bound as a
    formal statement with every quantifier explicit, in the notation of templates/research-records.md''s
    proof_search_map, and produce a second statement expressing the way a concrete data limit is derived
    from it. Compare the quantifier prefixes term by term and record every place where a witness is
    permitted to depend on a variable that the other statement''s uniformity forbids. STAGE 2 does
    the baseline reproduction audit (audit 1): name the exact bottleneck the bound governs and verify
    symbolically that at the degenerate parameters (single query, single block) the bound reduces
    to a quantity computable in closed form and matching a hand computation. STAGE 3 performs the
    collision search: over the toy grid where the exact optimum is already computed by the other contracts
    in this batch, group parameter settings by their instantiated bound value into buckets, and within
    each bucket compare measured optima. Any bucket containing two settings whose optima differ by
    more than the resolution floor is a collision. STAGE 4 runs the method-ceiling audit (audit 4):
    state the strongest conclusion that the bound-as-observable could support even under ideal instantiation,
    and apply the same observable to a nearby object - the random-function null - where the intended
    conclusion is known to fail. STAGE 5 records each of the four audits as passed, failed, or non-applicable
    with its reason. Refutation: if no collision exists anywhere on the grid, the observable is injective
    there and the audit records that as a positive result about the bound''s identifiability at those
    parameters.'
  novelty_status: unverified
  novelty_screen:
    method: Read docs/inventor-protocol.md sections 1 to 5 and section 8 in full, including the four
      default audits and the constructive transform list. Read the CLAUDE.md paragraph binding proof_search_map
      to proof-oriented proposals. Greps for proof_search_map, observation collision, quantifier order,
      method ceiling and nearby-object across ledger/proposals and knowledge/techniques. Greps for
      POLYMAC, GHASH, Poly1305 as recorded for this batch.
    results: The four audits are program policy (inventor-protocol section 8, technique note KN-TECH-080
      named in CLAUDE.md) and are required of proof-oriented proposals, but no record in this bucket
      exists to have run them, since RQ-POLYMAC-7c89e4 carries zero proposals of its own. Across the
      ledger, proof_search_map appears as a schema field requirement rather than as a filled audit
      for any MAC bound. No record anywhere treats a forgery bound as an observable subject to collision
      search. The nine RQ-AEADC-8db132 proposals contain no symbolic audit. IDEA-20260809-439aa8 tests
      a claimed padding bound by attacking one bit below it, which is an empirical probe of a bound
      rather than a quantifier audit of one.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature, and in particular nothing
      is asserted about how any published proof states its quantifiers - the audit examines the statement
      THIS PROGRAM writes down when it pins the bound, which is why the pinning is a hard prerequisite.
      What is claimed new WITHIN THIS REPOSITORY: applying section 8''s four audits to a polynomial-MAC
      forgery bound, and specifically the cross-field observation collision as the concrete falsifier
      of identifiability. What is assembled from known parts: the audits themselves are program policy
      and are used as given; the toy optima consumed by the collision search are produced by the ratio-surface
      contract in this batch.'
  object_first_candidate:
    tracked_object: 'The QUANTIFIER PREFIX of the bound statement, together with the fibre of the
      bound-value map: the set of parameter settings sharing a given instantiated bound value. The
      object followed is a pair - a formal prefix and a fibre - and the audit asks whether the fibre
      is a singleton in the quantities that matter.'
    lossiness: Lossy on the fibre side and lossless on the prefix side, and the record says so plainly.
      The bound-value map discards L, q and the field entirely, retaining a single number - a very
      lossy projection, which is exactly the property that makes collision search meaningful. The
      quantifier prefix, by contrast, discards nothing about the statement's logical form; rewriting
      a statement with explicit quantifiers is a change of notation, not a new object, and this record
      does not pretend otherwise. The genuinely new object here is the fibre; the prefix rewrite is
      a cheap audit step whose value is procedural, and calling it a new object would fail the lossy-projection
      test.
    propagation: 'One step of the target operation - moving along the parameter grid - moves a setting
      from one fibre to another whenever the bound value changes, and keeps it in the same fibre when
      the bound value happens to coincide. The audit''s whole content is what happens to the exactly
      measured optimum under a step that keeps the fibre fixed: if the optimum moves while the bound
      value does not, the observable has failed to track the thing it is used to summarise. On the
      prefix side, one step of instantiation substitutes a concrete value for a quantified variable,
      and the audit tracks whether that substitution respects the prefix order.'
    survival_score: The fibre object survives wherever the grid is dense enough for two settings to
      share a bound value, which at toy parameters with an integer-lattice bound is common. It DISSOLVES
      where the bound takes distinct values at every grid point, at which point no collision can be
      exhibited and the audit reports injectivity on that grid rather than a failure. The prefix object
      survives as long as the pinned statement is a single formal sentence; it dissolves if the pinned
      bound is a family of statements or carries implicit side conditions, which the audit must then
      enumerate - and that enumeration is itself a useful product.
  null_object_control: 'The random-function null is the nearby object for audit 4 and is executable
    in the same invocation as the signal arm, because the collision search runs over an already-computed
    table of optima that includes a null column. The audit applies the identical bound-value grouping
    to the null arm''s optima: since the null''s optimum has a known analytic form independent of
    L, its fibres must exhibit collisions trivially and by a known mechanism, which calibrates what
    a collision looks like when it is uninformative. For the signal arm''s collisions to mean anything,
    they must be of a different kind - two settings differing in achievable root structure, not merely
    two settings where the optimum was always going to be the same. A second control is a deliberately
    WRONG quantifier prefix, injected as a fixture, which the prefix comparison stage must flag; if
    it does not, the comparison procedure cannot detect the defect it exists to detect.'
  discriminated_from:
  - 'IDEA-20260809-439aa8 (RQ-AEADC-8db132): tests a claimed padding bound empirically by attacking
    one bit below it. That is an empirical probe of a specific committing construction; this is a
    symbolic audit of a statement''s logical form plus a collision search over an existing table of
    optima.'
  - 'The ratio-surface entry in this batch: that produces the optima. This consumes them and asks
    an identifiability question the ratio table alone cannot answer.'
  - 'The tight-region entry in this batch: that thresholds the ratio to get a region. This groups
    by the bound VALUE, not by the ratio, which is a different fibration of the same grid.'
  - 'Any restatement of the bound: this record does not state the bound at all, deliberately, and
    cannot until the Coordinator pins it from primary text - which is what makes the audit a real
    prerequisite rather than a formality.'
  - 'A claim about what any published proof says: explicitly out of scope and forbidden. The audit
    examines the pinned statement as this program writes it, and a mismatch found is a mismatch in
    this program''s use, not in anyone''s paper.'
  assumptions:
  - The bound can be written as a single formal statement with a determinate quantifier prefix. If
    it is a family or carries side conditions, the audit enumerates them and reports increased complexity
    rather than a prefix.
  - The toy optima consumed by the collision search are exact, which they are by construction in the
    ratio-surface contract, and carry a known resolution floor from the ladder contract.
  - Two settings sharing a bound value to within the floor constitute a fibre. The floor is what makes
    this well defined and must be available before the search runs.
  - Applying section 8's audits to a bound is meaningful. The audits were abstracted for proof-oriented
    proposals generally, and this is a proof-oriented object; if the Coordinator judges otherwise,
    the record's value collapses to the collision search alone.
  predictions:
  - metric: detection of the injected wrong-quantifier fixture by the prefix comparison stage
    direction: higher
    minimum_effect: detected in 100 percent of injected fixtures; any miss means the comparison cannot
      detect the defect it exists for
  - metric: existence of at least one cross-field observation collision on the toy grid
    direction: different
    minimum_effect: at least one bucket containing a binary-arm setting and a prime-arm setting whose
      optima differ by more than the resolution floor, or an explicit report of injectivity on the
      tested grid - both are complete outcomes
  - metric: null-arm fibre collisions
    direction: higher
    minimum_effect: the null must exhibit collisions by its known mechanism (L-independence), calibrating
      the uninformative case; absence of null collisions means the grouping code is not grouping
  - metric: number of the four section 8 audits recorded as passed, failed, or non-applicable with
      a stated reason
    direction: different
    minimum_effect: exactly 4; a silently omitted audit is a contract violation under inventor-protocol
      section 8
  minimal_test:
    design: 'The minimal version costs no compute beyond reading an existing table. Take the ratio-surface
      contract''s completed optima table and the ladder contract''s floor table. Group all settings,
      both fields, by instantiated bound value to within the floor. Inspect each multi-member bucket
      for optima differing by more than the floor. Separately, on paper, write the pinned bound with
      explicit quantifiers and write the derivation of one concrete data limit with explicit quantifiers,
      and diff the prefixes. That is the whole test: one grouping pass and one symbolic comparison.
      It discriminates three ways. A cross-field collision exists: the bound value does not identify
      exposure across the pairing, which is the sharpest possible statement about the observable and
      directly informs how every other record in this bucket may summarise its results. No collision
      exists: the observable is injective on this grid and the audit records a positive identifiability
      result. The prefix diff shows a mismatch: a locatable defect in this program''s own instantiation,
      fixable before any expensive run, which is precisely the cheap-falsification purpose section
      8 exists for.'
    controls:
    - Injected wrong-quantifier fixtures, at least 8, which the prefix comparison must flag.
    - Null-arm fibre grouping, calibrating what an uninformative collision looks like.
    - Resolution floor from the ladder contract, without which fibre membership is undefined.
    - A degenerate-parameter hand computation for audit 1's baseline reproduction, checked symbolically.
    - Independent second reading of the prefix comparison by the red-team role, since a symbolic audit
      has no automatic check.
    required_metrics:
    - explicit quantifier prefix of the pinned bound
    - explicit quantifier prefix of the derived data limit
    - list of prefix mismatches with the variable and the dependency at issue
    - list of fibres with more than one member
    - for each such fibre, the spread of measured optima against the resolution floor
    - audit status (passed, failed, non-applicable with reason) for all four section 8 audits
  falsification_conditions:
  - An injected wrong-quantifier fixture is not flagged.
  - The null arm exhibits no fibre collisions, indicating the grouping code is not grouping.
  - The resolution floor is unavailable, so fibre membership cannot be defined and the collision search
    cannot run.
  - The pinned bound cannot be written as a determinate formal statement, in which case the prefix
    audit is reported as non-applicable with that reason.
  - Every fibre is a singleton on the tested grid, which refutes the collision claim there and is
    recorded as an identifiability result.
  - Any of the four audits is omitted rather than recorded as non-applicable with a reason.
  confounders:
  - Fibre membership depends entirely on the floor; a generous floor manufactures collisions and a
    tight one destroys them. The floor must come from the ladder contract and not be chosen here.
  - Cross-field grouping requires the bound to be instantiable in both fields with commensurable units,
    which is a modelling choice that could create spurious buckets.
  - The prefix comparison is a human judgement with no automatic check, and two readers can diff the
    same prefixes differently.
  - A collision between two settings that differ in many parameters at once is weak evidence of non-identifiability
    compared to a collision between near-neighbours; the audit must prefer minimal-difference pairs
    and report the difference vector.
  - The null's trivial collisions could be mistaken for signal collisions if the report does not separate
    them by mechanism.
  interpretation_limits:
  - A collision demonstrates that the bound VALUE does not determine the achievable optimum on the
    tested grid. It does not show the bound is wrong; a valid upper bound admits collisions freely.
  - A prefix mismatch, if found, is a defect in this program's own instantiation of the pinned statement,
    not a statement about any external proof, and must never be written as one.
  - Everything is on the toy grid, and injectivity or non-injectivity there says nothing about deployed
    parameters.
  - A single-field collision is much weaker than a cross-field one, and the record must label which
    kind it found.
  target_complexity:
    time_exponent: No attack exponent is claimed, and no attack of any kind is involved. The audit's
      own cost is one grouping pass over a table of at most a few hundred rows plus human reading
      time.
    memory_exponent: No attack memory exponent is claimed. The audit holds a table of a few hundred
      rows.
    best_known: The incumbent is that no section 8 audit has been run against any bound in this program,
      so the current state is the absence of the check rather than a competing result.
    hidden_overhead: 'The entire cost is human and hides in the prefix work: writing a bound with
      explicit quantifiers correctly is delicate, and an incorrect prefix produces a confident and
      wrong mismatch report. The independent second reading exists for exactly that, and it is the
      step most likely to be skipped.'
  dominated_by: 'n/a (no result claimed). Pareto check performed against every polymac-relevant row
    this repository holds - KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445
    and the nine RQ-AEADC-8db132 proposals - and against the technique notes named in CLAUDE.md (KN-TECH-056,
    KN-TECH-080): none is an algorithm and none occupies a time, memory or query frontier this record
    could sit on, since this record produces a symbolic audit and a grouping of an existing table.
    No attack is claimed.'
  sota_delta: No attack; conceptual and audit contribution only. Delta is from zero section 8 audits
    run against any MAC bound in this program to four audits recorded with status and reason, plus
    a fibre table with cross-field collision labels.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the four audits can be recorded with an honest status once
    the bound is pinned: about 0.9, since non-applicable with a reason is always available and is
    a legitimate outcome. That the prefix rewrite is done correctly and the injected fixtures are
    caught: about 0.65, limited by it being human work with a human check. That at least one cross-field
    collision exists on the toy grid: about 0.6, because integer-valued optima on a coarse grid collide
    readily and the two fields have different achievable root structures. That a prefix mismatch is
    found in this program''s own instantiation: about 0.3, and finding none is a clean pass that costs
    almost nothing to establish. Recommended high because the cost is near zero, it must precede the
    expensive runs by policy, and a failed audit is the cheapest possible way to stop a bad campaign.'
