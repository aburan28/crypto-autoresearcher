      verified_by: null
  assumptions:
    - >-
      Identifier assigned by handoff TASK-20260922-d7b6d6. Proposal only.
    - >-
      I_graph after elimination cuts out the image of the domain relation set
      only when phi is an F_4-rational isogeny and the elimination finishes.
      An unfinished elimination is unmeasured. It is not a claim that the
      degree rose.
    - >-
      I_random matches the number and the degree bound of the Vélu generators,
      not their coefficients. A match of degrees between I_graph and I_random
      is the generic-enrichment explanation.
    - >-
      No new factor base. Interpretation stops before membership, relation
      yield, or descent costs of phi(V).
    - >-
      The identity-isogeny check is mandatory and comes before the real edge.
  proof_search_map:
    bottleneck: >-
      Elimination of the domain variables along the Vélu equations may change
      the grevlex solving degree relative to the native codomain ideal. The
      bottleneck is whether that change exceeds a random enrichment of degree
      at most ell.
    baseline_embedding:
      parameter_slice: >-
        phi equal to the identity on the base curve. The graph is the
        diagonal. I_graph and I_native must share both named degrees. This is
        the old presentation's boundary, degree ell = 1 with no new rational
        function.
      reproduction_check: >-
        Run the identity encoding first. Any named-degree gap voids the real
        edge. The implementation does not get to interpret a Vélu drop.
    observation_collision:
      observable: >-
        The pair (last-fall degree, grevlex solving degree) of an ideal. It
        discards the generators and the points.
      distinct_preimage_search: >-
        I_native, I_graph, and I_random are three preimages. Log the
        coefficient hash of the extra generators. If I_random shares the pair
        with I_graph, the pair does not identify the isogeny equations.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The eliminated graph ideal, a presentation of the transferred
          relation set, reduced to a comparison of two integers against the
          native ideal and against I_random.
        predicted_gain: >-
          A drop of size at least 1 that beats I_random is a presentation
          effect at toy scale. It is not an ECDLP-exponent gain. ell is paid
          as generator degree.
    quantifier_order: >-
      FOR THE one certified edge, LET ell be the measured maximum degree of
      the cleared Vélu generators. IF the identity check passed, THEN compare
      the finished named degrees of I_graph and I_native with those of one
      frozen I_random of extra-generator degree at most ell. The existence
      claim is only that the three-way comparison has one of the named
      outcomes. It is not "there exists a cryptographic curve whose graph
      ideal is easier".
    method_ceiling:
      strongest_certifiable_claim: >-
        On one toy edge, the graph presentation either agrees with the native
        ideal, beats the random enrichment by at least 1 in a named degree,
        matches the enrichment, or is more expensive. Not an algorithm, and
        not a new factor base.
      nearby_object_control: >-
        I_random, on which an "isogeny presentation" conclusion is false by
        construction, and the identity isogeny, on which any gap is an
        encoding bug.
    proof_obligations:
      - claim: The identity isogeny reproduces equal named degrees.
        responsibility: baseline
      - claim: >-
          Named degrees come from a finished grevlex basis. Elimination that
          does not finish is unmeasured.
        responsibility: correctness
      - claim: >-
          A presentation effect requires the graph drop to exceed the random
          drop by at least 1.
        responsibility: strictness
      - claim: >-
          Scope is one edge at n=1. phi(V) is not claimed as a factor base.
        responsibility: scope
      - claim: >-
          ell is included in the generator-degree bound of I_random so the
          enrichment pays the same degree the isogeny pays.
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: >-
        (native grevlex solving degree minus graph grevlex solving degree)
        minus (native grevlex solving degree minus random grevlex solving degree)
      direction: different
      minimum_effect: >-
        At least 1 means the graph beats random enrichment. At most 0 means
        it does not. The metric is computed only when all three bases finish.
        Otherwise the metric is unmeasured.
    - metric: same difference for certified last-fall degree
      direction: different
      minimum_effect: >-
        At least 1 is a last-fall presentation effect. At most 0 is not.
        The two named degrees may disagree. Both are reported. Neither is
        inferred from the other.
  minimal_test:
    design: >-
      Identity check on the LADDER-W base curve at n=1, t=4, k=1. Then one
      certified F_4-rational Vélu edge, degree 2 if it exists, else 3. If no
      rational edge exists, stop with "no rational edge" and do not use a
      geometric kernel. Build I_native on the codomain. Build I_graph by
      adjoining the cleared Vélu equations to the domain chained ideal and
      eliminating domain variables in grevlex with those variables first.
      Record ell as the maximum total degree of the cleared Vélu generators.
      Build I_random by adjoining that many random polynomials of degree at
      most ell on the same monomial support, frozen seed, rejected if the
      coefficient vector equals the Vélu vector. Full-column Macaulay ranks
      through degree 4 are stored for each ideal even when the basis does
      not finish. Subset-column coranks are ignored. A basis that does not
      finish leaves that named degree unmeasured.
    controls:
      - Identity isogeny, run first.
      - I_random, same count and degree bound as the Vélu generators.
      - >-
        Trace equality on the edge. A mismatch voids the edge.
      - >-
        One support-matched shuffle of I_graph's extra generators that
        preserves the exact Vélu support but permutes coefficients under the
        frozen seed, as a second enrichment if the first draw is degenerate.
    required_metrics:
      - ell, the measured generator degree
      - >-
        certified last-fall degree and grevlex solving degree of I_native,
        I_graph, and I_random, or unmeasured
      - the two difference-of-drops metrics
      - >-
        the outcome label in {agree, isogeny-presentation, generic-enrichment,
        more-expensive, unmeasured, identity-failed, no-rational-edge}
      - full-column r(d) for d <= 4 on each finished matrix
  falsification_conditions:
    - >-
      The identity check fails. The graph encoding is wrong. The real edge
      is not interpreted.
    - >-
      All finished named degrees agree between I_graph and I_native. The
      presentation does not move them on this edge. The isogeny-presentation
      explanation is false here.
    - >-
      I_random's drop is at least the graph's drop on every finished named
      degree. The saving is generic enrichment. The isogeny equations are
      not the cause.
    - >-
      The graph degree is larger. Charging ell made the system worse. Native
      presentation dominates on this edge.
    - >-
      An unfinished elimination or an unfinished basis is unmeasured. It is
      not evidence that the degree exploded and not evidence of a drop.
  confounders:
    - >-
      Elimination order can change which basis is computed. The variable
      order is frozen (domain variables first, grevlex). A second order is
      not silently tried. A gap that exists in only one order is labeled
      order-dependent and is not the isogeny-presentation outcome.
    - >-
      Clearing denominators adds factors. ell includes that degree. I_random
      must use the same ell or the enrichment is not matched.
    - >-
      I_random might be the unit ideal while I_graph is not, or the reverse.
      A unit ideal is degeneracy. Redraw once under the frozen seed. If the
      redraw is also a unit ideal, the enrichment arm is degenerate and the
      label is unmeasured, not generic-enrichment.
    - >-
      The eliminated ideal can acquire extra components from the denominator.
      Record the degree of the denominator polynomial beside ell.
    - >-
      k=1 may make every ideal easy. The identity check still has to agree.
      A universally tiny degree is agreement, not a presentation win.
  interpretation_limits:
    - >-
      One toy edge at n=1. No slope along n. No cryptographic curve. No ECDLP
      exponent. Rho remains about p^{1/2} group operations.
    - >-
      deg(phi) is charged as generator degree inside the ideal comparison.
      The navigation cost of finding the edge (Galbraith ePrint 2024/924,
      recalled, not read) is not an attack term because no attack is claimed.
      A presentation drop of size g does not become an exponent improvement
      by being larger than 0. It would still have to be converted into a
      relation yield and a linear-algebra cost, which this proposal does not
      do.
    - >-
      No new factor base. phi(V) is not asserted to be a subspace, not given
      a membership algorithm, and not placed in a KN-OPEN-020 open class.
      The proposal declares itself inside the comparison of two ideals and
      stops.
    - >-
      Not a new group homomorphism. phi is the same F_4-rational isogeny the
      other three proposals use. The new object is the presentation of the
      relation ideal.
    - >-
      Does not rerun the m=3 prime-field neighbor census and does not build a
      true degree-of-regularity meter.
    - >-
      A win for I_graph does not say a native curve in the class has a slower
      degree. That is the slope census. This proposal can show that a
      seemingly easier degree was an artifact of carrying the graph.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The claim is a finite comparison of three ideals on one edge. It
        imitates no distribution. One random enrichment is not a model of
        all degree-ell systems. The classical distribution imitated is none.
      rigorous_support: >-
        The three outcome labels are comparisons of integers produced by
        finished Gröbner bases. No smoothness or Dickman law is used.
      validation_plan: >-
        The identity check plus the single frozen I_random draw. If that draw
        is degenerate, one redraw is allowed and then the arm is unmeasured.
        No larger ensemble is claimed, so no tail check is claimed.
  target_complexity:
    time_exponent: >-
      Measurement cost. Three grevlex computations, or three degree-4
      Macaulay ranks if the bases do not finish, on the n=1 boolean system
      with domain and codomain variables both present before elimination.
      Column count is larger than the native system by the domain variables
      and is still a toy binomial coefficient, not a p-power attack exponent.
    memory_exponent: >-
      One Macaulay matrix for the graph ring before elimination. No p^{1/2}
      collision table.
    best_known: >-
      Pollard rho at about p^{1/2} group operations. The native algebraic
      baseline is whatever grevlex degree I_native actually has on this toy
      edge. The graph presentation is not claimed to beat rho.
    hidden_overhead: >-
      Elimination can be more expensive than the native solve even when the
      final degree is smaller. That cost is not hidden in an o(1). If the
      elimination does not finish, the cell is unmeasured rather than counted
      as a win.
    tradeoff_note: >-
      No ECDLP exponent is claimed. No van Oorschot-Wiener tradeoff. Memory
      is the graph matrix, which is larger than the native matrix before
      elimination. A degree drop that requires storing both charts is not a
      saving until the eliminated basis actually finishes, and even then it
      is not an ECDLP exponent.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: "n/a (no result claimed)"
  sota_delta: >-
    No change to the p^{1/2} rho exponent. Relative to the native chained
    ideal, the only quantitative delta on offer is an integer difference of
    named degrees on one toy edge, required to exceed the difference produced
    by random generators of degree at most ell. A drop of size 1 that fails
    to beat I_random is zero effect. A drop that beats I_random by 1 changes
    one toy Macaulay binomial coefficient and does not move the ECDLP
    exponent. Frontier checked against rho, against DEC-20260716-003 (which
    dominates any m=3 neighbor-weakness claim this idea does not make), and
    against KN-OPEN-020 (the pushed set is not claimed as a factor base).
