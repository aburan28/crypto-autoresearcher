idea:
  id: IDEA-20260922-469f79
  question_id: RQ-DREG-d7b6d6
  added: '2026-09-22'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Graph of a Vélu isogeny versus the native chained ideal, with deg(phi)
    charged against a random enrichment of the same degree
  class: representation
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (graph of an F_4-rational
    isogeny inside the product of the domain and codomain affine charts, an
    E times E' gluing, not a Kummer line), attack stage relation-decomposition
    Gröbner degree. On one certified Vélu edge of LADDER-W at rung n=1, the
    grevlex solving degree and the certified last-fall degree of the graph
    ideal differ from those of the native codomain ideal by strictly more
    than a random system of the same number of extra generators of degree at
    most ell, or they do not. A larger drop for the graph is a presentation
    effect. An equal drop is generic enrichment. Agreement is a presentation
    that does not move the named degrees. No ECDLP exponent is claimed.
  mechanism: >-
    PAIR AND OPERATION SET. The representation is the graph of phi, with
    domain boolean coordinates, codomain boolean coordinates, and the cleared
    Vélu equations relating them (R3). Sigma is translation by elements of
    the domain subspace factor base only, pushed to the codomain by phi.
    That is the Class I partial action of index calculus. It is not the full
    translation action of the rational points, which IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C close for lossy deterministic objects.
    TRICHOTOMY: partial-action. The relation generators propagate
    deterministically only when the translated point lies in the factor base.
    phi transports that partial action. phi itself is not a translation.
    LOSSY PROJECTION. The tracked object is the pair of named degrees of
    I_graph after eliminating the domain variables, compared with the same
    pair for I_native on the codomain. The degrees discard the relation
    vector and the domain coordinates. Keeping a Gröbner-basis isomorphism
    between the two ideals would lose nothing about the transferred points
    and would be a change of presentation, not a new arithmetic. This
    proposal does not claim that isomorphism. It compares degrees. WHAT IS
    ADDED BEYOND F2. F2 uses one summation ideal. This proposal compares
    three ideals and charges ell = deg(phi). I_native is the chained t=4
    ideal of the codomain alone. I_graph is the domain chained ideal plus
    the cleared Vélu equations, followed by elimination of the domain
    variables, in grevlex with domain variables first. I_random adds, to
    I_native, the same number of extra generators, each of total degree at
    most ell, with the same monomial support as the cleared Vélu equations
    and with coefficients drawn from a frozen uniform seed, checked not to
    be the Vélu coefficients. OUTCOMES. (Agree) both named degrees of
    I_graph equal those of I_native. The graph presentation does not move
    them. (Isogeny presentation) a named degree of I_graph is smaller by at
    least 1, and the corresponding drop for I_random is strictly smaller.
    The Vélu equations, not the mere addition of degree-ell generators, move
    the degree. (Generic enrichment) I_random drops by at least as much as
    I_graph. The saving is not the isogeny. (More expensive) a named degree
    of I_graph is larger by at least 1. Charging ell made the presentation
    worse. The native ideal dominates. (Identity check) when phi is replaced
    by the identity, I_graph and I_native must agree. If they do not, the
    encoding is wrong. FACTOR BASE. The domain factor base is the reused
    k=1 subspace. The image phi of that set is not asserted to be a linear
    subspace and is not claimed as a new factor base. Membership after the
    push is not given an attack cost. KN-OPEN-020 is not escaped. The
    bounded-degree class stays scoped out. This stops at the degree
    comparison.
  novelty_status: unverified
  citations:
