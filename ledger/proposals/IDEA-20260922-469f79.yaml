      claim: >-
        The parent question is the degree profile inside an isogeny class.
        This proposal asks whether the graph presentation, rather than the
        native codomain equation, is what would move that profile.
      verified_by: idea-generator
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R3 includes E times E' gluings and Weil restriction. Kummer-line and
        degree-d-function-on-E representations are closed at model lever 1
        and are not used.
      verified_by: idea-generator
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Index calculus is the partial-action class. Deterministic propagation
        holds for factor-base translations only.
      verified_by: idea-generator
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C. An exactly sum-compatible bucket index on a prime-order
        group is a homomorphism, hence trivial or bijective. The graph
        degrees are not such a bucket.
      verified_by: idea-generator
    - ref: IDEA-20260901-863e36
      provenance: internal
      claim: >-
        Propagation is a property of a projection paired with an operation
        set. Sigma here is factor-base translation pushed by phi.
      verified_by: idea-generator
