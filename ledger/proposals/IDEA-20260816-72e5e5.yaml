idea:
  id: IDEA-20260816-72e5e5
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'Certify that a reduction-evaluation pipeline is an instrument and not a fixed-answer generator,
    using unstructured FrodoKEM as the free control: feed it two schemes matched on every input the
    bound actually consumes and demand that its output difference be exactly zero, then feed it deliberately
    mismatched inputs and demand that it move.'
  class: control
  claim: '(A) OBJECT. An FO-bound evaluator is a function from a term list plus an input vector to
    a bit-security figure. The tracked object is its RESPONSE PROFILE: the vector of output differences
    produced when its inputs are varied one at a time, together with the output difference produced
    when two different schemes are fed inputs that are matched on every coordinate the bound consumes.
    (B) IDENTITY CLAIM. A correct evaluator is blind to everything except the inputs it consumes.
    FrodoKEM''s distinguishing role in this portfolio is that it is the UNSTRUCTURED member, so if
    a structured KEM and FrodoKEM are fed identical correctness error, identical query budgets, identical
    user and ciphertext counts and identical placeholder advantage, a correct evaluator must return
    EXACTLY the same figure, bit for bit. A nonzero difference is not a discovery about structure;
    it is proof that the pipeline consumes something it should not, for example a hard-coded scheme
    label, a default from a configuration file, or an input silently defaulted rather than supplied.
    This turns the unstructured control into a zero-tolerance test with a forced value rather than
    a statistical comparison. (C) SENSITIVITY CLAIM. The same rig, run with inputs deliberately unmatched
    by a controlled amount on one coordinate at a time, must move the output by the amount the exponent
    of that coordinate predicts. An evaluator that returns the same figure for matched inputs but
    does not move correctly for unmatched ones is inert rather than blind, and inertness is the failure
    mode that a matched-pair test alone cannot detect. Both halves are required. (D) WHAT IS NOT CLAIMED.
    Nothing about whether structure helps or hurts any adversary, and nothing about FrodoKEM''s or
    any structured scheme''s security. Passing this test says only that a measuring device measures
    what it claims to; it produces no security number, no attack, and no comparison of schemes. In
    particular a zero difference between the two schemes is a property of the INSTRUMENT, and it would
    be a serious misreading to report it as evidence that structure does not matter, since the bound''s
    inputs are exactly where structure would enter and they were pinned equal by construction.'
  mechanism: 'STAGE 1. Define the evaluator''s input contract explicitly: the finite list of coordinates
    the bound consumes, with every one required and none defaulted. Any coordinate the implementation
    can obtain from anywhere other than the caller is a defect and is found by construction at this
    stage, before any run. STAGE 2. Build two scheme descriptors, one unstructured of Frodo shape
    and one structured of ring or module shape, that differ in every field EXCEPT the consumed coordinates,
    which are pinned equal. Feed both. The difference must be exactly zero in exact arithmetic. STAGE
    3. Adversarial variant: repeat with the descriptors carrying deliberately conflicting metadata,
    for example different names, different dimensions, different moduli and different ring degrees,
    still with the consumed coordinates pinned. The difference must still be exactly zero. STAGE 4.
    Sensitivity ladder: unpin one consumed coordinate at a time by a factor of two and check that
    the output moves by the exponent of that coordinate, in bits, to within interval width. STAGE
    5. Leakage hunt: instrument the evaluator so every read of any value not in the input contract
    raises. Run the whole matrix under that instrumentation. STAGE 6. Null arm: a deliberately contaminated
    evaluator that adds a small scheme-label-dependent term, which the identical test matrix must
    catch, establishing the test''s power rather than assuming it.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FRODO-a2dbe2 methods, in particular the nearby-object control demanding the identical
      evaluation be run on a second FO-based lattice KEM to establish that the pipeline distinguishes
      schemes, and the mutation control demanding a perturbed exponent be registered before agreement
      is reported. Read RQ-FRODO-3260cc methods for the null-object and mutation controls. Ran grep
      -ril over ledger/proposals/ for unstructured, structure-blind, nearby-object, control arm, instrument,
      matched null, and parsed the titles of the nearest hits.
    results: 'Two records own the matched-null instrument idea in this repository and both are on
      other schemes. IDEA-20260805-522b48 (RQ-MLKEM-003) states that the instrument is structure-blind
      and runs an observation-collision audit proving that ML-KEM security numbers from that campaign
      are statements about unstructured LWE at matched parameters, then searches for the cheapest
      separating observable. IDEA-20260805-7d97be (RQ-MQOM-001) makes MQOM the matched unstructured
      null for the structured MQ family, with the rule that any device firing on MQOM has proved it
      is not using the structure it claims to use. IDEA-20260805-530869 (RQ-MLKEM-001) builds a ring-deleted
      matched null calibrated against three forced values. All three concern HARDNESS instruments,
      that is, estimators and attack devices. None concerns a REDUCTION-BOUND evaluator, and the distinction
      is load-bearing: a hardness instrument is expected to differ between structured and unstructured
      inputs and the audit asks whether it does, whereas a bound evaluator must be exactly identical
      on matched inputs and the audit demands a forced zero. No FRODO proposal performs any instrument-validity
      test of this kind.'
    verdict: 'UNVERIFIED. No external literature is reachable, so nothing is asserted about published
      instrument-validation practice. Claimed new inside this repository: applying the matched-unstructured-control
      discipline to a REDUCTION-BOUND evaluator with a forced exact-zero criterion rather than a statistical
      comparison, and pairing it with a sensitivity ladder so that blindness and inertness are separated.
      Assembled from known parts: the discipline itself is RQ-FRODO-a2dbe2''s own nearby-object and
      mutation controls, made executable; the matched-null framing is IDEA-20260805-522b48 and IDEA-20260805-7d97be
      applied to a different class of instrument; the contaminated-evaluator null is standard positive-control
      practice.'
  object_first_candidate:
    tracked_object: 'The response profile of the bound evaluator: the vector of output differences
      under one-coordinate-at-a-time input changes, plus the scalar output difference between two
      scheme descriptors matched on all consumed coordinates and differing on everything else.'
    lossiness: 'The projection discards the bit-security figures themselves and keeps only differences,
      and further discards the scheme descriptors except through the consumed coordinates. It is genuinely
      lossy: any pair of descriptors agreeing on the consumed coordinates maps to the same profile,
      so an entire equivalence class of schemes collapses to one point. What survives propagates because
      the bound is a function of the consumed coordinates alone, by definition of the input contract,
      so a change of descriptor within a class cannot move the profile and a change of a consumed
      coordinate moves it by an amount fixed by that coordinate''s exponent. That is exactly why the
      forced zero of claim (B) is a theorem about a correct implementation rather than an empirical
      expectation.'
    propagation: One step of the target operation is one substitution into the evaluator. Under a
      step that changes only unconsumed metadata, the profile must not move at all; under a step that
      doubles one consumed coordinate, it must move by exactly that coordinate's exponent in bits.
      The object therefore has a fully specified one-step rule with no free parameters, which is what
      makes deviation a defect rather than an observation.
    survival_score: 'The forced-zero structure survives as long as the input contract is complete
      and the evaluator is pure. It dissolves at the first impurity: a default value, a cached configuration,
      a scheme-keyed table, or a floating-point path whose rounding depends on operand order. The
      proposal predicts the most likely real dissolution is operand-order rounding rather than a hard-coded
      label, which is why exact rational arithmetic is required and why an exact-zero criterion is
      affordable at all. Where it dissolves is the deliverable: the located impurity is a reusable
      finding about the pipeline every downstream FRODO batch will use.'
  null_object_control: 'A deliberately CONTAMINATED evaluator, identical in every respect except that
    it adds a term of one bit keyed on a hash of the scheme name, run through the IDENTICAL test matrix
    in the same invocation. This positive control must FAIL the matched-pair test, and must fail it
    at the smallest contamination the test is claimed to detect. If the contaminated evaluator passes,
    the test matrix has no power and a pass by the real evaluator means nothing. A second null is
    an INERT evaluator that ignores its inputs and returns a constant: it passes the matched-pair
    test trivially and must be caught by the sensitivity ladder, which is precisely why both halves
    are required and why either alone would be a fake control.'
  discriminated_from:
  - 'IDEA-20260805-522b48 (RQ-MLKEM-003): an observation-collision audit showing that a HARDNESS instrument''s
    outputs are statements about unstructured LWE at matched parameters, plus a search for a separating
    observable. That audit expects and hunts a difference; this one demands a forced exact zero from
    a bound evaluator, where any difference is a defect rather than a signal.'
  - 'IDEA-20260805-7d97be (RQ-MQOM-001): MQOM as the matched unstructured null for structured MQ solvers,
    where a device that fires on MQOM has disproved its own structure use. Same discipline, different
    instrument class: that is about attack devices, this is about arithmetic over a written inequality.'
  - 'IDEA-20260805-530869 (RQ-MLKEM-001): a ring-deleted matched null calibrated against three forced
    values, gating candidate mechanisms. It calibrates a hardness measurement; it does not test a
    reduction evaluator and cannot, since a bound evaluator consumes no lattice.'
  - An ordinary unit-test suite for the evaluator, which checks outputs against expected values. That
    checks agreement with an author's expectations; the matched-pair test checks a structural invariant
    the author may never have considered, and the contaminated-evaluator null measures the test's
    own power, which a unit test does not.
  - 'RQ-FRODO-a2dbe2''s own nearby-object control as written, which asks that the identical evaluation
    be run on a second FO-based KEM to show the pipeline distinguishes schemes. This proposal inverts
    the criterion where it should be inverted: on inputs matched to the bound''s contract the pipeline
    must NOT distinguish, and only on unmatched inputs must it move. Running the control as written,
    without pinning the consumed coordinates, would confuse a correct evaluator with a contaminated
    one.'
  assumptions:
  - The bound's input contract is finite and enumerable; if the bound consumes a quantity that cannot
    be pinned across two schemes, that quantity is named and the matched-pair test is scoped to exclude
    it, with the exclusion reported.
  - Exact rational arithmetic is used throughout, so that an exact-zero criterion is meaningful; a
    floating-point evaluator would require a tolerance and the test would lose most of its power.
  - The structured comparator descriptor is legitimate as a descriptor; no claim is made or needed
    about the structured scheme itself, since only its descriptor fields are used.
  - The evaluator under test is pure in the software sense, or is made pure before testing; instrumented
    reads outside the input contract are treated as defects rather than as configuration.
  - This test is run BEFORE any swept table is produced, consistent with RQ-FRODO-a2dbe2's requirement
    that baseline and controls gate downstream reporting.
  predictions:
  - metric: absolute output difference between two descriptors matched on all consumed coordinates,
      exact arithmetic
    direction: lower
    minimum_effect: forced value exactly 0; any nonzero value is a pipeline defect and the located
      impurity is the deliverable
  - metric: absolute output difference on the contaminated-evaluator positive control
    direction: higher
    minimum_effect: 1.0
  - metric: discrepancy between measured output movement and the exponent-predicted movement, on the
      sensitivity ladder, in bits
    direction: lower
    minimum_effect: 0.001
  - metric: output movement of the inert constant-returning null on the sensitivity ladder
    direction: lower
    minimum_effect: forced value exactly 0, which must be flagged as a failure by the ladder rather
      than as a pass by the matched-pair test
  - metric: number of reads of values outside the declared input contract, under instrumentation
    direction: lower
    minimum_effect: forced value 0
  minimal_test:
    design: 'This is the cheapest proposal in the set and it needs no primary source. Write the evaluator
      against an explicitly declared input contract, then write four descriptors: unstructured with
      pinned coordinates, structured with pinned coordinates, structured with pinned coordinates and
      deliberately conflicting metadata, and structured with one coordinate unpinned by a factor of
      two. Run all four through the real evaluator, the contaminated evaluator and the inert evaluator,
      in one invocation, under read instrumentation. Twelve evaluations decide everything: the real
      evaluator must return an exact zero difference on the first three and the exponent-predicted
      movement on the fourth, the contaminated evaluator must fail the first three, and the inert
      evaluator must pass the first three and fail the fourth. The whole run is seconds of CPU. Its
      value is that every later FRODO measurement built on this evaluator inherits either a certificate
      or a located defect, and neither is obtainable any other way.'
    controls:
    - Contaminated evaluator with a one-bit scheme-label-keyed term, as the positive control that
      establishes the test's power.
    - Inert constant-returning evaluator, which must pass the matched-pair test and fail the sensitivity
      ladder.
    - Conflicting-metadata descriptor pair, which strengthens the matched-pair test against a label
      leak that a bland descriptor would miss.
    - Read instrumentation over every value outside the declared input contract.
    - Exponent-predicted movement as the reference for the sensitivity ladder, registered before the
      run.
    - 'Operand-order permutation control: evaluate the same input with terms summed in three different
      orders and require bitwise identical output under exact arithmetic.'
    required_metrics:
    - matched-pair output difference, exact
    - contaminated-control output difference
    - per-coordinate measured versus predicted output movement, in bits
    - count of out-of-contract reads
    - operand-order permutation difference
    - inert-null behaviour on both halves of the test
  falsification_conditions:
  - The matched-pair difference is nonzero for the real evaluator, which localizes a pipeline impurity
    and is the result to report.
  - The contaminated positive control passes the matched-pair test, meaning the test has no power
    and no pass may be reported.
  - The inert null passes both halves, meaning the sensitivity ladder is not discriminating.
  - Measured movement on the sensitivity ladder disagrees with the exponent prediction beyond the
    stated tolerance.
  - Any out-of-contract read occurs.
  - Operand-order permutation changes the output, showing the arithmetic is not exact and the zero-tolerance
    criterion cannot be used.
  confounders:
  - 'An incomplete input contract makes the matched-pair test vacuous: if a consumed coordinate was
    forgotten and defaulted identically for both descriptors, the test passes for the wrong reason.
    The read instrumentation is the only guard and it is imperfect.'
  - Pinning the consumed coordinates equal is an act of construction, so a passing test says nothing
    about whether those coordinates would be equal for real schemes, and reporting it as if it did
    would be exactly the misreading claim (D) forbids.
  - A contaminated evaluator with a contamination smaller than the test's resolution would pass; the
    positive control is run at one bit and the resolution below that is not established by this design.
  - Exact rational arithmetic can still differ if the term list is built differently for the two descriptors;
    the term list must be shared, not rebuilt per scheme.
  - The structured comparator's descriptor fields could accidentally coincide with the unstructured
    one's, weakening the conflicting-metadata arm; the fields must be checked to differ.
  interpretation_limits:
  - A passing certificate is a statement about the instrument, never about either scheme. It is not
    evidence that structure does not affect security.
  - The certificate is valid only for the declared input contract and only for the evaluator version
    tested; any change to either voids it.
  - Test power is established only down to the contamination magnitude of the positive control, and
    nothing is claimed below that.
  - No bit-security figure produced by the certified evaluator is validated by this test; correctness
    of the transcription is a separate and unaddressed question.
  target_complexity:
    time_exponent: No attack exponent is claimed. The full test matrix is a few dozen exact-arithmetic
      evaluations, seconds.
    memory_exponent: No attack memory exponent is claimed. Kilobytes.
    best_known: 'The incumbent practice is RQ-FRODO-a2dbe2''s stated nearby-object control: run the
      identical evaluation on a second FO-based lattice KEM to show the pipeline distinguishes schemes.
      This proposal does not replace it but corrects its criterion for the matched-input case, where
      distinguishing is the failure and not the pass.'
    hidden_overhead: 'Declaring a complete input contract is the entire hidden cost and it is human:
      an evaluator written without one cannot be tested this way, and retrofitting a contract onto
      existing code is where the effort goes. A second hidden cost is that the certificate must be
      re-earned after every change to the evaluator, so the test is only cheap if it is wired into
      the pipeline rather than run once.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns no evidence record, so this program holds no FrodoKEM cost rows
    in time, memory or queries and there is nothing here to be dominated by. Against IDEA-20260805-522b48
    and IDEA-20260805-7d97be, which are the nearest instrument-validity records, no cost comparison
    exists because none of the three produces a cost.'
  sota_delta: no attack; conceptual and instrument-validity contribution only. The deliverable is
    a pass or a located defect plus a measured test power; no bit-security figure is produced or moved
    for any scheme.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Claim (B), that a correctly implemented evaluator returns an exact zero
    on matched descriptors: 0.95 as a theorem, but only about 0.6 that a first implementation actually
    passes it, and the gap between those two numbers is the whole value of the proposal. Claim (C),
    that the sensitivity ladder matches exponent predictions to the stated tolerance: 0.85, with the
    residual risk concentrated in bounds whose terms are not pure monomials, where the predicted movement
    is not a single exponent. Probability the positive control has adequate power at one bit: 0.9.
    Probability the exercise finds a real impurity rather than a clean pass: honestly around 0.4,
    and I would regard a clean pass as the less interesting but perfectly acceptable outcome, since
    it is a prerequisite every other FRODO batch consumes.'
