  citation_note: >-
    No web search was run. The product-space dimension k(l-1) + 1 is exact
    for V = span{1, z, ..., z^{l-1}} before reduction modulo the field
    polynomial (products of polynomials of degree < l have degree < k(l-1) +
    1); reduction can only lower it. All n = 131 numbers are hand arithmetic.

  assumptions:
    - V is the polynomial-basis coordinate subspace; a random subspace of the same dimension has product spaces that saturate FASTER (dim V^{(2)} about min(C(l+1, 2), 131)), so the polynomial basis is the best case for the symmetrisation and the certificate is stated at that best case.
    - 'OFF-LIMITS COMPONENTS DECLARED: F2, FGHR/JV symmetrisation, a77711.'
    - Arithmetic at n = 131; executable cells at n = 17.

  proof_search_map:
    bottleneck: >-
      Whether S_m-symmetrisation reduces the Boolean unknown count of the
      descended decomposition on a subspace base as it does on a subfield
      base; the answer is a dimension count.
    baseline_embedding:
      parameter_slice: >-
        The subfield case V = F_q in F_{q^n} (IDEA-20260922-70a67c's Oakley
        slice): V^{(k)} = F_q for all k, unknowns m log2 q, the symmetrisation
        works and is the JV 2010 result. The record must reproduce "no
        saturation, unknowns m log2 q" there by the same formula with
        V^{(k)} = V.
      reproduction_check: >-
        Symbolic. Frozen fixture: at RC-1 (n = 17, l = 6, m = 3) the
        dimensions 6, 11, 16 are computed by an explicit span in Python and
        must match k(l-1) + 1.
    observation_collision:
      observable: dimension of V^{(k)} per (l, k) and the spurious-lift factor per cell.
      distinct_preimage_search: >-
        A large spurious factor could come from (i) the missing Vieta lift
        (the claim) or (ii) an over-counting bug in the e-space solver;
        separated by lifting each e-solution back (factor the degree-m
        polynomial X^m + e_1 X^{m-1} + ... + e_m over F_{2^17} and test whether
        all roots lie in V), which is an exact check per solution.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the symmetrised equation fixed and vary the constraint set: (a)
          e_k free in V^{(k)} (the symmetrised descent as written); (b) e_k
          constrained by the Vieta lift (exact, equivalent to the plain
          system). The fibre of (a) over (b) is the spurious set, and its size
          is the measured number.
        predicted_gain: none; the certificate is that the fibre is huge.
    quantifier_order: >-
      FOR ALL l >= 27 and m >= 5 at n = 131: dim V^{(m)} = 131 for the
      polynomial-basis subspace (counting, unconditional); FOR ALL subspace
      bases the symmetrised unknown count exceeds ml once k(l-1) + 1 > l for
      some k, i.e. always for m >= 2. PREDICTED at RC-1: the spurious factor
      within 4x of m! 2^{sum dim V^{(k)} - ml}. The Frobenius part is
      a77711's forall statement, preregistered null.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 at every balanced l, the S_m-symmetrised descent of
        S_{m+1} over a polynomial-basis subspace has sum_k min(k(l-1) + 1,
        131) Boolean unknowns, at least 335 at m = 5 against 115 plain, and
        without the Vieta lift its solution count at RC-1 exceeds the genuine
        count by [measured factor]." It certifies nothing about solving cost
        with the lift imposed, which is the plain system.
      nearby_object_control: >-
        The subfield slice (symmetrisation works; V^{(k)} = V) as the
        proves-too-much object, and a size-matched random subspace at RC-1
        where saturation is faster and the spurious factor larger.
    proof_obligations:
      - claim: dim V^{(k)} = min(k(l-1) + 1, n) for the coordinate subspace before reduction; reduction cannot raise it.
        responsibility: size
      - claim: The n = 131 dimension table at (m, l) in {(5, 23), (5, 28), (6, 22), (6, 24), (8, 20)}.
        responsibility: correctness
      - claim: Every e-solution is lifted or refuted exactly by factoring the degree-m polynomial.
        responsibility: correctness
      - claim: The Frobenius part adds nothing beyond a77711 (preregistered null).
        responsibility: scope

  predictions:
    - metric: P1, spurious factor = (solutions of the symmetrised descent with e_k free in V^{(k)}) / (genuine decompositions), RC-1, m = 3, l in {4, 5, 6}, 50 targets pooled
      direction: higher
      minimum_effect: within a factor 4 of m! 2^{sum_k dim V^{(k)} - ml} (2^{9.6}, 2^{13.6}, 2^{17.6} at l = 4, 5, 6); a factor below 8 at l = 6 is the surprise branch.
    - metric: P2, dim V^{(k)} at RC-1 for k = 1..3 and l = 4..9, computed by explicit span
      direction: same
