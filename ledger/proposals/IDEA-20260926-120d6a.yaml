  minimal_test:
    design: >-
      CELL. RC-1 (n = 17, t^17 + t^3 + 1, A = 97044, B = 126251, #E = 4 *
      32603), V = {deg < l} for l in {4, 5, 6}, m = 3 (symmetrised S_4 in
      e_1, e_2, e_3; S_4 built by the resultant recursion, about 200 lines, or
      taken from IDEA-20260926-1ddce2's builder if it exists); 50 subgroup
      targets (seed 2026092731). Koblitz sibling y^2 + xy = x^3 + x^2 + 1 at
      n = 17 (order 2 * 65587) for P4 with 5 targets and their 17 conjugates.
      STAGE 0 (zero compute): the n = 131 dimension table; the RC-1 table.
      STAGE 1: build the symmetrised S_4 in (e_1, e_2, e_3, x_R), descend with
      e_k ranging over V^{(k)} (Boolean unknowns 6 + 11 + 16 = 33 at l = 6),
      and count solutions by exhaustive assignment over prod V^{(k)} (2^33 at
      l = 6 is too many for pure Python; use l in {4, 5} exhaustively, 2^21
      and 2^27 assignments, and at l = 6 the degree-D closure of closure.py to
      decide refutation only, reporting the solution count as a lower bound
      from sampling 2^24 assignments). Lift every found e-solution by factoring
      X^3 + e_1 X^2 + e_2 X + e_3 over F_{2^17} and testing roots in V; the
      genuine count is the exact enumeration over V^3. Report P1, P2.
      STAGE 2: repeat Stage 1 with a random subspace of matched dimension
      (P3).
      STAGE 3 (Frobenius part, a77711 arm A at this cell): on the Koblitz
      sibling with V = ker g(sigma) of dimension 8 (the stable subspace at
      n = 17, IDEA-20260918-9abf42), build the plain descent for one target
      and for the orbit of 17 conjugates, and compare W_4 work and first
      iteration containing 1; the ordinary RC-1 curve with 17 unrelated
      targets is the null. Report P4.
      OUTCOME TABLE. POSITIVE for the certificate: P1 within band, P2 exact,
      P3 at least P1, P4 null -- the symmetrisation row is entered as
      certified. NEGATIVE (surprise): P1 below 8 at l = 6 with the lift
      check exact -- the symmetrised equation carries the lift; the
      certificate is withdrawn and the symmetrised descent is re-priced.
      ARTIFACT: lift check disagrees with enumeration on any genuine
      decomposition, or P2 not exact -- defect.
      FALSIFICATION THRESHOLD, fixed now: P1 outside [1/4, 4] of the formula
      at two of three l; P2 not exact.
      COST (estimate, order of magnitude): implementation medium (symmetrised
      S_4 builder and e-space descent about 250 lines on macaulay.py; lifting
      by cubic factoring about 60 lines); compute low to medium, the 2^27
      exhaustive cell at l = 5 is hours in pure Python and may be sampled
      with the censoring reported. Nothing is missing.
    cell:
      curve: 'RC-1 (n = 17) and the Koblitz n = 17 sibling (a = 1, order 2 * 65587) for the Frobenius arm'
      m: 3
      l: 4, 5, 6 (RC-1); 8 (stable subspace on the Koblitz arm)
      factor_base: 'V = {deg < l} polynomial basis; size-matched random subspace; ker g(sigma) on the Koblitz arm'
      targets: 50 subgroup targets; 5 targets with conjugate orbits on the Koblitz arm
      seeds: 'PCG64 seed 2026092731, recorded'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py (descent; NEW symmetrised S_4 builder and e-space descent)
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py (W_D at l = 6)
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py
      - 'NEW: exhaustive e-space enumerator with lift-by-factoring (about 120 lines); Frobenius-stable subspace constructor (about 60 lines)'
    procedure:
      - 1. Stage 0 tables.
      - 2. Stage 1 symmetrised descent, counts, lifts (P1, P2).
      - 3. Stage 2 random-subspace null (P3).
      - 4. Stage 3 Frobenius arm with the ordinary null (P4).
      - 5. Three-row reading; table row entered.
    metrics:
      - name: spurious_factor
        unit: dimensionless
        definition: e-solutions over genuine decompositions, per cell, pooled over targets
      - name: product_space_dims
        unit: integers
        definition: dim V^{(k)} by explicit span
      - name: lift_agreement
        unit: fraction
        definition: genuine decompositions recovered by lifting over genuine decompositions by enumeration (must be 1.0)
      - name: orbit_closure_ratio
        unit: dimensionless
        definition: W_4 work on the 17-conjugate orbit system over 17 times one instance, Koblitz versus ordinary
    controls:
      - Exact enumeration over V^m as ground truth (blocking).
      - Size-matched random subspace (null of the same shape; predicted worse).
      - Ordinary RC-1 with unrelated targets as the null for the Frobenius arm.
      - The subfield slice as the symbolic proves-too-much control (Stage 0).
    outcomes:
      positive: P1-P4 in band; certificate entered.
      negative: P1 near 1 with exact lifts; certificate withdrawn and the symmetrised descent re-priced.
      artifact: lift disagreement or inexact dims; nothing read.
    falsification_threshold: 'P1 outside [1/4, 4] of the formula at two of three l; P2 not exact.'
    estimated_cost:
      implementation: medium
      compute: 'estimate: minutes at l = 4, hours at l = 5 (may be sampled), closure-only at l = 6'
    required_metrics:
      - spurious_factor per cell with exact counts or sampling bounds
      - product_space_dims
      - lift_agreement
      - orbit_closure_ratio per arm

  falsification_conditions:
    - 'P1 within a factor 8 of 1 at l = 6 with lift_agreement = 1: the symmetrised equation enforces the Vieta lift; (A) is false and the record is superseded by a re-pricing.'
    - 'P2 not exact: the product-space formula is wrong for the coordinate subspace; corrected before use.'
    - 'P4 shows a replicated closure-work drop on the Koblitz orbit absent on the ordinary null: a77711 Lemma A2 fails at this cell; reported for review.'

  confounders:
    - At small l the symmetrised system may be refuted at low degree for reasons unrelated to the lift; the exhaustive count at l in {4, 5} avoids the closure entirely.
    - Reduction modulo the field polynomial lowers dim V^{(k)} below k(l-1) + 1 once that exceeds n; the formula's min(., n) is the exact statement and P2 checks it.
    - The Frobenius arm's stable subspace at n = 17 has dimension 8, not a balanced l; P4 is a shape comparison, not a cost claim.

