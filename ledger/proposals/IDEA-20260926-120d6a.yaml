    - metric: P3, the same spurious factor on a size-matched random subspace
      direction: higher
      minimum_effect: at least the polynomial-basis value (faster saturation).
    - metric: P4, solving degree or closure work of the Frobenius-orbit-symmetrised system versus one instance (a77711 A1/A3)
      direction: same
