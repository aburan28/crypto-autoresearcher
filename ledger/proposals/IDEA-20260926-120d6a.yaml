    - 'It does NOT say symmetrisation is useless on subfield bases (the Oakley slice) or that FGHR torsion symmetrisation is closed beyond IDEA-20260922-29b1c5''s statement.'
    - 'KN-OPEN-020 class: scoped-out subspace base.'

