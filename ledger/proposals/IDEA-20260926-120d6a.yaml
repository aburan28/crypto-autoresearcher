idea:
  id: IDEA-20260926-120d6a
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    SYMMETRISING S_{m+1} BY THE ORDER-262 m! GROUP AT m >= 5 ON ECC2K-130
    SATURATES OR ACTS FREELY: the S_m part rewrites in elementary symmetric
    variables whose product spaces V^{(k)} reach dimension 131 at k >= 5 for
    every balanced l, so the symmetrised descent has more unknowns than the
    plain one and needs the Vieta lift it was meant to remove; the Frobenius
    part acts freely (a77711 A2) with no invariant below degree 131; the
    spurious-lift rate is measurable at RC-1 with the symmetrised S_4
  class: control

  claim: >-
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, elementary symmetric functions
    e_k(x_1, ..., x_m) of subspace coordinates in a polynomial basis; the
    attack stage is the per-attempt decomposition solve. TARGET ARITY AND
    BUDGET: m >= 5 on ECC2K-130 against 2^13.96 (m = 5), 2^19.77 (m = 6),
    2^27.37 (m = 8) under the producer's model (BRIEF-ROUND2 section 1), and
    IDEA-20260926-4b65e3's cap column 2^32.4, 2^37, 2^42. This is a structural
    certificate; it moves neither column.
    (A) THE S_m PART. S_{m+1}(x_1, ..., x_m, x_R) is symmetric in x_1..x_m, so
    it is a polynomial in e_1, ..., e_m and x_R (KR-IC-955fd6, Joux-Vitse and
    FGHR symmetrisation), with degree in each e_k at most 2^{m-1}. Over an
    extension field with the subfield base x_i in F_q the e_k also lie in F_q
    and the symmetrised descent has m unknowns in F_q, which is the whole
    gain. On a SUBSPACE base V of dimension l in polynomial basis
    V = span{1, z, ..., z^{l-1}} (KR-IC-73db3f's "small product spaces"), e_k
    lies in the product space V^{(k)} of dimension min(k(l-1) + 1, 131) before
    reduction modulo the field polynomial (Huang-Petit-Shinohara-Takagi 2013,
    recalled, is the published form of this observation for m <= 4). MY
    ARITHMETIC, zero compute: at the free-oracle-optimal l = 23 at m = 5, the
    dimensions are 23, 45, 67, 89, 111 (e_5 fits, barely); at the cap locus
    l = 28: 28, 55, 82, 109, 131 (e_5 saturates); at m = 6 (l = 22 or 24): e_6
    has dimension min(6 x 21 + 1, 131) = 127 or 131; at m = 8 every e_k with
    k >= 5 saturates at either l. The symmetrised unknown count sum_k dim
    V^{(k)} is 335 at (5, 23) and 405 at (5, 28) against ml = 115 or 140 for
    the plain descent: the symmetrised system has about three times MORE
    Boolean unknowns, with the same 131 equations, and is underdetermined by
    200 or more unknowns unless the Vieta-lift condition (that (e_1, ..., e_m)
    are the elementary symmetric functions of SOME tuple in V^m) is imposed
    -- which is m l further unknowns and the original problem. So on
    ECC2K-130 at m >= 5 the S_m symmetrisation does not shrink the descended
    system; it relocates the m! into the Vieta lift. This is the certificate.
    (B) THE FROBENIUS PART. Extending the symmetry group to <sigma> (order
    131) and <-1> (order 2, already the x-coordinate quotient) as the seam
    proposes: sigma acts on a decomposition (x_1, ..., x_m; x_R) of R by
    sending it to a decomposition of sigma(R); for a fixed target it is an
    equivariance, not a symmetry (IDEA-20260906-a77711 Lemma A1), and on the
    union of the 131 conjugate systems it acts freely (Lemma A2), so the
    invariant ring of the diagonal cyclic action needs a generator of degree
    131 (Consequence A3, Noether bound attained by the orbit product) and the
    quotient has the same number of points as one instance. The Frobenius
    extension therefore buys the GGMP constant 1/131 in the number of systems
    (KR-IC-b0fcda) on an orbit-union base and no degree drop; the record
    preregisters a77711's null as its own for this part and adds nothing to
    it beyond the count of (A).
    (C) THE SPURIOUS-LIFT RATE, THE ONE MEASURABLE. Drop the Vieta lift and
    solve the symmetrised descent in the e-coordinates alone at a toy cell:
    every genuine decomposition is a solution, and the excess solutions are
    those (e_1, ..., e_m) in prod V^{(k)} satisfying the symmetrised equation
    that come from NO tuple in V^m. Heuristically the solution count is
    2^{sum_k dim V^{(k)} - n} against the genuine count 2^{ml - n}/m!, so the
    spurious factor is m! 2^{sum_k dim V^{(k)} - ml}: at RC-1 with m = 3,
    l = 6 the dimensions are 6, 11, 16 (sum 33 against ml = 18), predicted
    spurious factor 6 x 2^15 = 2^17.6, i.e. essentially every solution of the
    symmetrised system is spurious. STATED SO IT CAN FAIL: the measured ratio
    (solutions of the symmetrised descent) / (genuine decompositions) at RC-1
    m = 3, l in {4, 5, 6} reads within a factor 4 of m! 2^{sum dim V^{(k)} -
    ml}; a ratio near 1 would mean the symmetrised equation itself enforces
    the Vieta lift, which would overturn (A) and is the surprise branch.
    (D) WHAT EACH OUTCOME MEANS. (i) The spurious factor tracks the formula:
    (A) stands and the symmetrisation row of the m >= 5 table is entered as
    "no unknown reduction on subspace bases at ECC2K-130's balanced l;
    Frobenius part constant 1/131". (ii) The ratio is near 1 and survives the
    size-matched random-subspace null: the symmetrised equation carries the
    lift for free, the certificate is wrong, and the symmetrised descent at
    m >= 5 must be re-priced (its degree 2^{m-1} in each e_k descends to
    Boolean degree about m 2^{m-1}, which is the next obstruction, named here
    in advance). (iii) Instrument disagreement between the e-solutions lifted
    back and the exact enumeration: defect.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the elementary symmetric coordinates
    (e_1, ..., e_m) in the product spaces V^{(k)} of a polynomial-basis
    subspace. Operation set Sigma: the S_m action on tuples (permutation of
    summands), negation, and -- for part (B) -- the diagonal Frobenius on
    (tuple, target). TRICHOTOMY: the tuple -> e-vector projection is Class I
    partial-action under S_m (the block system of S_m on ordered tuples); it
    does NOT propagate under translation by a factor-base element (adding a
    summand changes every e_k non-linearly), which is the same partial-action
    class as index calculus. LOSSY-PROJECTION TEST against Sigma: discarded,
    the ordering of the summands (m! to 1); Sigma-compatible, since e_k is
    S_m-invariant by definition; lossy in the representation used, since the
    e-vector does not determine the ordered tuple. The test passes, and the
    record's point is that the RETAINED part (the e-vector) needs MORE
    Boolean coordinates than the discarded ordering saved, because V is a
    subspace and not a subfield: V^{(k)} grows with k while F_q^{(k)} = F_q.
    THE ONE OPEN NUMBER: the canonicalisation cost of an S_m-orbit is a sort,
    O(m log m); the real price is the Vieta lift, measured as the spurious
    factor of (C).
    KN-OPEN-020 CLASS: the subspace base, scoped-out; unchanged. The
    saturation of V^{(k)} at 131 is the binary analogue of the "product space
    fills the field" phenomenon that makes bounded-degree bases weak.
    OFF-LIMITS COMPONENTS USED, NAMED. F2 (family); FGHR / JV symmetrisation
    (KR-IC-955fd6) and small product spaces (KR-IC-73db3f) as the prior
    constructions; a77711 for the Frobenius part. What is added: the
    saturation count at ECC2K-130's balanced l for m >= 5, the relocation
    of the m! into the Vieta lift, and the spurious-lift measurement.

