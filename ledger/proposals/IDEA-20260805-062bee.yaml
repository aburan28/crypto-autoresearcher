idea:
  id: IDEA-20260805-062bee
  question_id: RQ-SSI-001
  added: '2026-08-05'
  goal_id: GOAL-SSI-001
  title: >-
    The exponent 1/3 is a covering-threshold exponent, not an algorithmic constant:
    measure (beta, gamma) in P(delta(E) <= D) ~ c * D^beta * p^{-gamma} and the best-known
    supersingular endomorphism exponent is FORCED to gamma/beta
  class: mechanism

  claim: >-
    Let E/F_{p^2} be supersingular and let delta(E) be the SMALLEST degree of a separable
    isogeny E -> E^{(p)} to its Frobenius conjugate. The 2026 p^{1/3+o(1)} algorithm
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN FULL for the passages quoted
    below) is a meet-in-the-middle on exactly this object: it splits the minimal isogeny as
    phi = eta o psi with deg(eta) ~ deg(psi) ~ delta^{1/2} and claw-searches two lists of
    size ~ delta. THEREFORE ITS TIME EXPONENT IS THE EXPONENT OF delta, AND NOTHING ELSE.
    Write the distribution law over the supersingular vertex set as
      Pr[delta(E) <= D] ~ c * D^beta * p^{-gamma}.
    Covering the whole graph (N ~ p/12 vertices) requires c*D^beta*p^{-gamma} ~ 1, so the
    typical delta is p^{gamma/beta} and THE ALGORITHM'S EXPONENT IS gamma/beta. Three
    values of (beta, gamma) are derivable in advance and they bracket the entire question:
      (1/2, 1/2) -> exponent 1     : only the subfield-walk route exists (Kohel-level);
      (3/2, 1/2) -> exponent 1/3   : the optimal-embedding / class-number count, which is
                                     what Theorem 1.5's bound deg <= (p/2)^{1/3} predicts;
      (2,   1/2) -> exponent 1/4   : the target that RQ-SSI-001 and KN-OPEN-013 ask about.
    For a UNIFORMLY RANDOM target curve instead of E^{(p)}, the same law is forced to
    (beta, gamma) = (2, 1), giving exponent 1/2 -- WHICH IS EXACTLY THE CLASSICAL
    DELFS-GALBRAITH BASELINE. So the matched null of this measurement reproduces the
    pre-2026 exponent, and the treatment reproduces the 2026 one, from ONE slope on ONE
    log-log plot. That is the whole proposal: convert "can the supersingular endomorphism
    exponent move below 1/3?" into "is beta bigger than 3/2?", a single measurable number,
    measurable at toy scale on a graph this session has already built.

  object_first_candidate:
    tracked_object: >-
      delta(E) in Z_{>0}: the minimal degree of a separable isogeny E -> E^{(p)}. It is a
      single integer attached to each vertex of the supersingular 2-isogeny graph over
      F_{p^2}, and it is followed through the computation as: instance E -> re-randomising
      walk w: E -> E' -> delta(E') -> half-degree split delta(E')^{1/2} -> two claw lists
      of size ~delta(E') -> the endomorphism phi_hat o phi. Every cost in the published
      algorithm is a function of delta along that path.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS FOR THIS PROPOSAL, stated so that a variant cannot
      arrive in new notation and be mistaken for a new object:
      (a) meet-in-the-middle / claw / golden-collision search and every van Oorschot-Wiener
          reparametrisation of it -- this proposal does not propose a search, it measures
          the distribution the search runs against;
      (b) KLPT and quaternion-ideal-side algorithms (that is GOAL-SSIQ-001's lane);
      (c) orientation and CM-descent attacks -- CLOSED for this goal by DEC-20260804-3677f1
          / EV-SSI-8aaad0 under the Deuring-correspondence dichotomy, and not reopened here;
      (d) torsion-image / Kani higher-dimensional embeddings (SIDH shape, out of RQ-SSI-001
          scope as a positive target);
      (e) quantum hidden-shift / Kuperberg;
      (f) SQIsign transcript statistics (paused lane, DEC-20260804-cfe4d0).
    newness_score: >-
      The INGREDIENTS are old and this record says so: the Deuring correspondence, optimal
      embeddings, and the Eichler class-number count are classical, and the p^{1/3} degree
      bound is a published theorem the paper attributes to its reference [4]. What is not
      in this corpus, and is what the record supplies, is (i) the identity
      exponent = gamma/beta stated as a two-parameter law whose measurement decides the
      exponent question, (ii) the observation that the matched null of that measurement is
      forced to reproduce the classical p^{1/2} baseline, which makes the instrument
      self-calibrating, and (iii) a pre-registered three-way fork whose branches are three
      different best-known exponents. No EV-SSI-* record measures any isogeny-degree
      distribution; COUNTED IN THIS SESSION, 45 of the 47 EV-SSI-* records carry both
      `experiment_ids: []` and `run_ids: []`, and 41 are tiered `theory`.
    testability_score: >-
      High and cheap. The supersingular vertex set and the 2-isogeny graph were CONSTRUCTED
      AND VERIFIED IN THIS SESSION as a feasibility probe (see minimal_test.feasibility_probe)
      at p = 103, 251, 503, 1019 in pure Python + numpy, with vertex counts matching
      floor(p/12)+1, closure under conjugation, and a connected graph. The measurement is a
      Dijkstra distance and a log-log slope.
    survival_score: >-
      The object survives the entire published pipeline -- it IS the pipeline's cost
      parameter -- and it survives re-randomisation with a derived Lipschitz law
      (delta(E') <= m^2 delta(E) for a degree-m walk, derived in mechanism). It does NOT
      survive a change of target: replacing E^{(p)} by a random curve changes the law, and
      that is the null.

  mechanism: >-
    ALL QUOTED PASSAGES BELOW ARE FROM inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, WHICH
    WAS READ IN FULL IN THIS SESSION. Steps labelled RECALLED are candidates to check and
    are converted into experiment stages, never cited as authority.

    STEP 1 -- WHAT THE ALGORITHM ACTUALLY COSTS. The paper, section 1.4 (READ, verbatim):
    "a recent result [4] proves that there always exists an isogeny E -> E^{(p)} of degree
    at most (p/2)^{1/3} ... if the degree factors as a product of small primes ... then it
    factors as phi = eta o psi where both eta and psi are smooth and of much smaller degree
    ~ (p/2)^{1/6}. One can then hope to find them by listing smooth isogenies from E and
    from E^{(p)} of degree ~ (p/2)^{1/6}, until they 'meet in the middle'." And section 1.1
    (READ, verbatim): "the algorithm essentially resolves a claw-finding problem for two
    sets of size N = p^{1/3+o(1)}."
    Reconcile the two: the number of isogenies from a fixed curve of degree at most X is
    sum_{d <= X} sigma(d) ~ X^2 up to the smoothness density, so listing to X = (p/2)^{1/6}
    gives lists of size ~ (p/2)^{1/3}. The paper's own concrete cost model, section 4.1,
    writes the table size as M = Psi(X,B)*X, i.e. X^2 times the smoothness density -- the
    same X^2. So: IF THE MINIMAL DEGREE IS delta, THE LISTS HAVE SIZE ~delta AND THE TIME IS
    ~delta, up to the o(1). The exponent of the algorithm is the exponent of delta. This is
    a re-derivation of the paper's own bookkeeping, not a new algorithm.

    STEP 2 -- THE COVERING IDENTITY. Let N = #{supersingular j over F_{p^2}} ~ p/12, and let
    F(D) = #{E : delta(E) <= D}. Write F(D)/N = c * D^beta * p^{-gamma} on the range where
    the law holds. The algorithm must succeed on the GIVEN curve, and it re-randomises by a
    walk until it lands on a curve it can handle, so the operative threshold is the D at
    which F(D)/N reaches 1:
        c * D^beta * p^{-gamma} = 1  =>  D = (p^{gamma}/c)^{1/beta}  =>  EXPONENT = gamma/beta.
    THIS IS THE FORCED IDENTITY OF THE PROPOSAL. It is arithmetic, it costs nothing, and it
    is the reason a single measured slope decides an exponent.

    STEP 3 -- WHY (beta, gamma) = (3/2, 1/2) IS THE CANDIDATE THAT REPRODUCES 1/3.
    RECALLED, NOT VERIFIED AGAINST A READ SOURCE, AND THE LOAD-BEARING STEP OF THE WHOLE
    RECORD: curves admitting a degree-d isogeny to their Frobenius conjugate correspond,
    under the Deuring correspondence, to optimal embeddings of a quadratic order of
    discriminant of size ~ d*p into a maximal order of B_{p,infinity}, and the number of
    such curves is governed by a class number h ~ sqrt(d p) (up to a bounded L(1,chi) and
    up to a small multiplicity from Galois / Atkin-Lehner identifications). Summing,
        F(D) ~ c' * sqrt(p) * sum_{d <= D} sqrt(d) ~ (2c'/3) * sqrt(p) * D^{3/2},
    so F(D)/N ~ C * D^{3/2} * p^{-1/2}: beta = 3/2, gamma = 1/2, EXPONENT = 1/3. That this
    reproduces Theorem 1.5's exponent exactly is the internal check that the counting is the
    right counting -- and it is also why the record does NOT claim novelty for the counting.
    TWO INDEPENDENT ANCHORS OF THE SAME LAW, both already known:
      (i) D = 1. delta(E) = 1 exactly when E ~ E^{(p)}, i.e. when j(E) lies in F_p. The
          F_p-rational subfield set has size ~ h(-p) ~ sqrt(p), so F(1)/N ~ C p^{-1/2},
          matching the law at D = 1. In this session's feasibility probe the measured
          F_p-rational counts were 5, 14, 21, 26 at p = 103, 251, 503, 1019, against
          h(-103) = 5, 2h(-251) = 14, h(-503) = 21, 2h(-1019) = 26 -- consistent with the
          p = 3 mod 8 / 7 mod 8 doubling. (SCOUT/FEASIBILITY-COMPUTED IN THIS SESSION,
          OUTSIDE THE HARNESS; re-run in-harness before any record cites it.)
      (ii) The paper, section 1.3 (READ, verbatim), describing the earlier [24, 26]
          algorithms: "generating random isogenies E -> E' until E' is 'adjacent' to its
          conjugate E'^{(p)} -- an event which occurs with probability O(p^{-1/2})".
          Adjacency is delta = ell = O(1), so that published probability IS F(O(1))/N and
          it is p^{-1/2}. The law's p-exponent gamma = 1/2 is therefore pinned by a
          statement already in the paper.

    STEP 4 -- THE LIPSCHITZ LAW, WHICH IS WHY THE OBJECT PROPAGATES. Let w: E -> E' have
    degree m. Then w^{(p)}: E^{(p)} -> E'^{(p)} also has degree m, and for the minimal
    phi: E -> E^{(p)} the composite
        phi' = w^{(p)} o phi o w_hat : E' -> E'^{(p)}
    has degree m * delta(E) * m = m^2 delta(E). HENCE delta(E') <= m^2 delta(E), i.e.
    log delta is 2-Lipschitz in log-degree along the graph. Consequences, all forced:
      (a) Re-randomisation cannot make delta small: it can only pay m^2 to move.
      (b) A curve at 2-isogeny-graph distance k from the F_p-rational set (where delta = 1)
          satisfies delta <= 4^k. THIS IS AN EXACT PRE-REGISTERED UPPER ENVELOPE ON EVERY
          MEASURED VALUE and it can fail: one measured violation refutes the derivation or
          the implementation.
      (c) The expander growth of the subfield set alone (#{dist <= k} ~ sqrt(p) * 3*2^{k-1})
          gives, via D = 4^k, only F(D)/N >~ D^{1/2} p^{-1/2}, i.e. beta >= 1/2 and
          exponent <= 1. SO THE SUBFIELD-WALK ROUTE ALONE PREDICTS EXPONENT 1 (Kohel level),
          AND THE GAP BETWEEN beta = 1/2 AND beta = 3/2 IS EXACTLY THE STRUCTURE THE 2026
          RESULT LIVES ON. Measuring which of the two the data shows is the experiment.

    STEP 5 -- WHY THE TAIL CANNOT BE FARMED (a derived method ceiling, zero compute).
    Suppose one runs the meet-in-the-middle with a degree budget T on each of R
    independently re-randomised curves. Success needs some curve with delta <= T, i.e.
    R * c T^{beta} p^{-gamma} ~ 1, so R = p^{gamma} / (c T^{beta}); total cost ~ R * T =
    p^{gamma} T^{1-beta} / c. For beta > 1 this is STRICTLY DECREASING in T, so the optimum
    is T as large as the guarantee allows -- T = p^{1/3} by Theorem 1.5, R = 1, total
    p^{1/3}. THE PUBLISHED PARAMETER CHOICE IS ALREADY OPTIMAL WITHIN THIS ARCHITECTURE AND
    NO LUCKY-INSTANCE SEARCH IMPROVES IT, PROVIDED beta > 1. For beta < 1 the sign flips and
    small-T-many-walks would win. So beta is not only the exponent, it is also the
    parameter that decides whether the architecture is already tight.

    STEP 6 -- WHAT WOULD MOVE THE EXPONENT, STATED AS FORWARD GUIDANCE RATHER THAN A CLAIM.
    Since exponent = gamma/beta, exactly two levers exist inside this architecture:
    raise beta (a target whose "distance family" grows faster than D^{3/2}) or lower gamma
    (a target whose D = 1 fibre is bigger than sqrt(p)). Reaching p^{1/4} needs beta = 2 at
    gamma = 1/2. Note that the RANDOM-TARGET null has beta = 2 -- with gamma = 1 -- so
    beta = 2 is not intrinsically impossible; what a p^{1/4} route needs is a target that
    keeps the Frobenius conjugate's small gamma while acquiring the random target's larger
    beta. This record does not claim such a target exists; it states the two numbers any
    proposal must exhibit, which is a falsifiable screen no future SSI proposal currently has.

