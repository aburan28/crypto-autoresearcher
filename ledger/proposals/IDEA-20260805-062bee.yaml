  lossy_projection_identifiability_audit:
    projection: >-
      A supersingular curve E/F_{p^2} (equivalently a maximal order End(E) up to
      isomorphism, ~ p/12 objects) --> the single integer delta(E).
    what_is_discarded: >-
      Everything except one integer. The fibre over a typical value of delta is enormous:
      by the law, the number of curves with delta in [D, 2D] is ~ sqrt(p) D^{3/2}, so at
      D ~ p^{1/3} a single value already carries ~p^{1/2}-sized fibres and at small D the
      fibres are ~sqrt(p).
    why_genuinely_lossy: >-
      delta is one integer bounded by (p/2)^{1/3} attached to ~p/12 objects, so the map is
      at least ~p^{2/3}-to-one on average. It is not invertible even in principle.
    why_compatible_with_the_operations: >-
      This is the part that makes it a tracked object rather than a statistic. delta
      propagates DETERMINISTICALLY along the target's own operation (isogeny walks) via the
      derived law delta(E') <= m^2 delta(E) for a degree-m walk, with the witness explicitly
      constructed as w^{(p)} o phi o w_hat. The retained part therefore has a one-step
      propagation rule -- which is exactly the criterion inventor-protocol section 2 asks
      for -- and the rule is an inequality with a constructive witness, not a heuristic.
    is_it_only_a_change_of_coordinates: >-
      NO. The canonical failure (Delta, Pi) = (x xor y, x*y) in characteristic 2 loses
      nothing because the pair is recoverable as the roots of t^2 + Delta t + Pi. Nothing
      analogous exists here: delta(E) is a single bounded integer and E cannot be recovered
      from it, as the fibre sizes above show.
    mirror_failure_check: >-
      CHECKED, AND THE CHECK RETURNS "NOT CONSTANT", WITH A DERIVED SPREAD. The mirror
      failure is a projection so lossy it is constant across instances (zero comparator
      spread, the KN-TECH-1a5b7e tell). delta is forced to vary: it equals exactly 1 on the
      ~sqrt(p) F_p-rational curves and is bounded by (p/2)^{1/3} everywhere, and both ends
      of that range are occupied, so the comparator spread is at least (p/2)^{1/3} - 1 and
      is p-growing. The feasibility probe confirms the D = 1 fibre is a strict, small subset
      (5 of 9, 14 of 22, 21 of 43, 26 of 86 at p = 103, 251, 503, 1019 -- note the fraction
      is falling, as p^{-1/2} requires).

  assumptions:
    - >-
      Pure path-finding / endomorphism instances: two supersingular curves or one curve,
      NO torsion images published under a secret isogeny, no SQIsign transcript, no CSIDH
      secret. RQ-SSI-001 places the SIDH/SIKE torsion-image setting out of scope as a
      positive target and this record stays inside that.
    - >-
      delta is measured through SMOOTH-degree isogenies only (the graph is built from
      ell-isogeny edges for ell in a declared small set L). The measured quantity is
      delta_L(E) >= delta(E), and the pre-registered prediction is stated for delta_L with
      its own derived law (see predictions). Conflating delta_L with delta would be a
      measurement error and the contract forbids it.
    - >-
      The identity exponent = gamma/beta assumes the algorithm's cost on a curve with
      minimal degree delta is Theta(delta) up to the o(1) -- step 1. It inherits the paper's
      own accounting and is not an independent claim.

  proof_search_map_note: >-
    The paired hypothesis H-SSI-df550b carries the filled four-audit proof_search_map. It is
    not duplicated here.

  predictions:
    - metric: >-
        beta_hat: ordinary-least-squares slope of log(F_L(D)/N) against log(D) over the
        pre-declared window 1 <= D <= p^{1/3}, at the largest completed prime cell, with
        F_L the measured L-smooth minimal-degree CDF
      direction: different
      minimum_effect: >-
        PRE-REGISTERED THREE-WAY FORK, stated as numbers before any run.
        beta_hat in [1.35, 1.65] -> consistent with 3/2, the algorithm's exponent 1/3 is a
        covering threshold and is already optimal within the architecture (step 5).
        beta_hat in [0.35, 0.65] -> consistent with 1/2, i.e. only the subfield-walk route
        is visible at this scale; exponent 1 is what the data supports and the p^{1/3}
        structure has NOT been detected -- an instrument-scope result, not a refutation.
        beta_hat >= 1.85 -> the covering threshold is BELOW p^{1/3}, the published analysis
        is conservative at the tested scale, and this is the single most consequential
        outcome available in this goal.
        Any beta_hat outside [0.3, 2.5] with a residual R^2 below 0.9 is reported as
        "no power law at this scale" and NOTHING is concluded about the exponent.
    - metric: >-
        gamma_hat: slope of log(F_L(1)/N) against log(p) across the completed prime cells
        (the D = 1 anchor, which needs no smoothness restriction because delta = 1 is
        measured exactly)
      direction: different
      minimum_effect: >-
        -0.50 +/- 0.15. Derived from #{j in F_p} ~ h(-p) ~ sqrt(p) against N ~ p/12. This
        anchor is INDEPENDENT of the graph construction (it is a membership test on j) and
        is the cheapest falsifier of the p-scaling half of the law.
    - metric: >-
        envelope_violations: number of measured curves with delta_L(E) > 4^{k(E)}, where
        k(E) is the 2-isogeny-graph distance from E to the nearest F_p-rational vertex
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Derived in mechanism step 4(b) with an explicit witness
        (w^{(p)} o phi o w_hat). A single violation means the derivation or the
        implementation is wrong, and the run halts before any slope is reported.
    - metric: >-
        beta_hat_null and gamma_hat_null for a UNIFORMLY RANDOM target curve replacing
        E^{(p)}, same code, same graph, same D window
      direction: different
      minimum_effect: >-
        beta_hat_null = 2.0 +/- 0.25 and gamma_hat_null = -1.0 +/- 0.25, giving
        gamma/beta = 1/2 -- THE CLASSICAL DELFS-GALBRAITH EXPONENT. Derived from
        #{curves within degree D of a fixed curve} ~ D^2 out of N ~ p/12 vertices. If the
        null does not reproduce 1/2, the instrument does not measure exponents and no
        treatment number may be reported.
    - metric: >-
        positive_control_rate: fraction of curves with j(E) in F_p whose measured
        delta_L equals exactly 1
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000 (100%). Forced: j in F_p implies E^{(p)} is isomorphic to E, and the
        identity is a separable isogeny of degree 1. Anything below 1.000 is an
        implementation defect and NO negative result may be reported from that cell.
    - metric: >-
        smoothness_gap: measured ratio F_L(D) / F_L_predicted(D), where F_L_predicted is
        the L-smooth restriction of the step-3 law, computed exactly in integer arithmetic
        BEFORE the run as C * sqrt(p) * sum_{d <= D, d is L-smooth} sqrt(d)
      direction: different
      minimum_effect: >-
        The ratio must be within a factor 3 of a constant across the D window at fixed p
        (i.e. max/min of the ratio below 3). A ratio that DRIFTS with D means the smoothness
        restriction, not the law, is producing the measured slope -- the canonical artifact
        tell in this design -- and beta_hat is then uninterpretable and must not be reported
        as an exponent.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line. Full contract:
      experiments/EXP-SSI-6a2619/specification.yaml.
      STAGE 0 (zero compute, pen and paper): re-derive step 2's covering identity and step
      4's Lipschitz law, and compute the pre-registered L-smooth predicted CDF in exact
      integer arithmetic for every declared (p, D) cell. If step 4's witness does not
      typecheck, the whole proposal ends here at zero cost.
      STAGE 1 (seconds to minutes): build the supersingular vertex set at each declared
      prime by TWO INDEPENDENT constructions and require them to agree exactly.
      STAGE 2 (minutes): build the ell-isogeny graph for ell in L, run the positive control
      and the 4^k envelope check. Both are hard gates before any distribution is looked at.
      STAGE 3 (minutes): measure F_L(D) for the treatment (target E^{(p)}) and for the
      matched null (uniformly random target), fit beta and gamma, report the ratio to the
      predicted L-smooth law.
    feasibility_probe: >-
      RUN IN THIS SESSION, OUTSIDE THE HARNESS, DELIBERATELY LIMITED. The vertex-set
      construction (roots of the Deuring/Hasse polynomial over F_{p^2} = F_p[i], p = 3 mod 4,
      vectorised with numpy 2.4.6) and the 2-isogeny graph (pairwise Phi_2 vanishing test)
      were built at p = 103, 251, 503, 1019 in 0.01 / 0.18 / 1.45 / 14.5 seconds; vertex
      counts 9 / 22 / 43 / 86 against floor(p/12)+1 = 9 / 21 / 42 / 85; the set is closed
      under Frobenius conjugation at every prime; the 2-isogeny graph is connected at every
      prime; and every F_p-rational vertex is its own conjugate (the positive control's
      precondition). THE PROBE DELIBERATELY DID NOT COMPUTE OR PRINT ANY CDF, SLOPE, OR
      DISTANCE HISTOGRAM, so every prediction above remains genuinely pre-registered. These
      timings are SCOUT-COMPUTED outside the harness and must be re-measured in-harness
      before any record cites them.
    controls:
      - >-
        POSITIVE CONTROL (forced, exact, cannot be fudged): every curve with j in F_p must
        return delta_L = 1. Forced because E^{(p)} is isomorphic to E there and the identity
        is separable of degree 1. If the instrument does not fire on this, it cannot detect
        small degrees at all and no negative may be reported from the run (inventor protocol
        section 3).
      - >-
        MATCHED NULL (same shape, forced value derived pre-run, CAN FAIL): replace the
        target E^{(p)} by a uniformly random supersingular target E'' drawn from the same
        vertex set with a declared seed, and re-run the identical measurement. Forced
        (beta, gamma) = (2, 1), hence exponent 1/2. This null can fail in both directions:
        if it returns 3/2 the instrument is reading graph geometry rather than the Frobenius
        structure, and if it returns 1/2 for the TREATMENT too, the treatment has no signal.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: bucket every curve by
        k = 2-isogeny distance to the nearest F_p-rational vertex, k = 0, 1, 2, 3, 4, ...,
        and report median delta_L per bucket together with the forced envelope 4^k. Two
        pre-registered statements: median delta_L is NON-DECREASING in k, and no bucket
        violates the envelope. A failure localises the obstruction to a specific distance
        shell instead of leaving "it did not work".
      - >-
        CONSTRUCTION CONTROL: build the vertex set twice by independent methods (roots of
        the Deuring/Hasse polynomial; breadth-first search from j = 1728 via Phi_2) and
        require exact set equality at every prime where both complete. A mismatch is an
        integrity failure, not a mathematical result.
      - >-
        ORDERING CONTROL: the null arm is generated, measured, hash-committed and its slope
        recorded BEFORE the treatment arm is looked at. If the fitting rule cannot separate
        the two arms, it discriminates nothing and must be rewritten before the treatment is
        read.
    required_metrics:
      - F_L(D) tables per arm per prime, machine-readable, with D grid and vertex counts
      - beta_hat, gamma_hat, R^2 and residuals per arm, with the fitting window declared pre-run
      - positive-control rate and the exact count of envelope violations
      - the pre-computed L-smooth predicted CDF and the measured/predicted ratio across D
      - both vertex-set constructions and their agreement receipt

  falsification_conditions:
    - >-
      Any curve with j in F_p returning delta_L != 1. Instrument broken; nothing is
      reported.
    - >-
      Any envelope violation delta_L(E) > 4^{k(E)}. Either the Lipschitz derivation (step 4)
      is wrong -- in which case the record is withdrawn by a superseding record -- or the
      implementation is wrong. Both halt the run.
    - >-
      The matched null does not reproduce exponent 1/2 within the declared band. The
      instrument does not measure covering exponents and NO statement about beta may be made.
    - >-
      The measured/predicted ratio drifts by more than a factor 3 across the D window. The
      L-smooth restriction is producing the slope and beta_hat is not an exponent.
    - >-
      beta_hat lands in [0.35, 0.65] at every prime with good fit quality. Then the
      class-number counting of step 3 is NOT visible at toy scale, the covering exponent the
      data supports is 1, and the honest deliverable is that this instrument cannot see the
      structure the 2026 result depends on -- a scope statement about the measurement, NOT a
      refutation of the published theorem, which is an existence bound and is unaffected by
      any distributional measurement.

  confounders:
    - >-
      SMOOTHNESS RESTRICTION. delta_L >= delta and the gap grows with p. This is the largest
      confounder, it is why the predicted L-smooth law is computed separately and pre-run,
      and it is why the drift check is a falsification condition rather than a diagnostic.
    - >-
      TOY SCALE AND NARROW p RANGE. The validated construction runs comfortably to p ~ 2000
      and the cost grows like p^3 in the vectorised vertex-set method, so gamma_hat is fitted
      over roughly three binary orders of magnitude in p. beta_hat, by contrast, is a
      WITHIN-PRIME slope over the full D range and is far better conditioned. The contract
      therefore makes beta the primary and gamma a secondary, and says so.
    - >-
      CLASS-NUMBER FLUCTUATION. h(-p) fluctuates by a factor that is bounded only under GRH,
      so the D = 1 anchor at four primes is noisy by construction. Reported with the
      individual class numbers, never smoothed.
    - >-
      MULTIPLICITY BOOKKEEPING. The constant C in the step-3 law depends on optimal-embedding
      multiplicities, Atkin-Lehner / Galois identifications, and whether h or 2h is the right
      count. THE CONSTANT IS DELIBERATELY NOT PRE-REGISTERED, only the two exponents, because
      the bookkeeping is not derived here. A record that pre-registered C would be
      pre-registering a guess.
    - >-
      PAIRWISE Phi_2 VANISHING collapses edge multiplicities and self-loops, so the graph is
      a simple graph rather than the multigraph. This affects path COUNTS but not path
      EXISTENCE, and delta_L is an existence quantity. Stated because it would matter for any
      later counting measurement on the same artifact.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS CLAIMED TO MOVE. The deliverable is a measured
      distribution exponent and a pre-registered fork. A beta_hat >= 1.85 at toy scale is
      HYPOTHESIS-GENERATING ONLY and would authorise a derivation, not a claim.
    - >-
      Theorem 1.5 is an EXISTENCE bound proved for all E. No distributional measurement can
      refute it, and this record must never be cited as bearing on its correctness.
    - >-
      Toy p <= a few thousand is never crypto-scale evidence (AGENTS.md rule 7). Claim tier
      toy, and the tier may not be raised by any downstream citation.
    - >-
      Heuristic 1 of the paper concerns the SMOOTHNESS of the minimal degree. This proposal
      concerns its SIZE. They are independent statements and neither validates the other;
      any citation conflating them is out of scope.
    - >-
      A negative here closes exactly: the L-smooth minimal-degree covering law, at the
      declared primes, over the declared D window, on this graph construction. Forward
      guidance if it fails: the two levers of step 6 remain open, and the ell-set L can be
      enlarged, which is the cheapest reopening.

  heuristic_assumptions:
    - id: HEUR-DELTA-1
      statement: >-
        FOR ALL sufficiently large p and FOR ALL D in [1, (p/2)^{1/3}],
        #{E supersingular over F_{p^2} : exists a separable isogeny E -> E^{(p)} of degree
        exactly d, for some d <= D} = (C + o(1)) * sqrt(p) * D^{3/2}, with C a positive
        absolute constant independent of p and D.
      rigorous_support: >-
        RECALLED AND EXPLICITLY UNVERIFIED. The intended support is: Deuring correspondence
        between such curves and optimal embeddings of quadratic orders of discriminant of
        size ~ dp into maximal orders of B_{p,infinity}; Eichler's class-number relation
        giving ~ h(-4dp) ~ sqrt(dp) such curves per d up to a bounded L(1,chi) factor;
        summation sum_{d<=D} sqrt(d) ~ (2/3) D^{3/2}. NO SOURCE FOR THIS WAS READ. Two
        independent published anchors are consistent with it and ARE read: F(1) ~ sqrt(p)
        (the F_p-rational subfield set) and the paper's own "probability O(p^{-1/2})" for
        conjugate-adjacency (section 1.3, READ verbatim).
      validation_plan: >-
        The experiment IS the validation, at four primes with a matched null, an exact
        positive control, and an exact upper envelope. The L-smooth restriction is handled by
        computing the restricted prediction separately in exact integer arithmetic before the
        run and reporting the ratio, so a failure is attributable to the law or to the
        restriction rather than to their product.
      falsification_condition: >-
        beta_hat outside [1.35, 1.65] at every prime with fit quality R^2 >= 0.9 and a
        non-drifting measured/predicted ratio.
    - id: HEUR-DELTA-2
      statement: >-
        The L-smooth restriction multiplies the law by exactly
        (sum_{d <= D, d L-smooth} sqrt(d)) / (sum_{d <= D} sqrt(d)) and introduces no other
        D-dependence.
      rigorous_support: >-
        NOT PROVED. It assumes the per-degree curve counts are independent of the arithmetic
        type of d beyond the sqrt(d) factor, which is false in detail (d a square, d
        divisible by p, and small d all behave specially). It is stated because the
        measurement cannot avoid it, and its failure mode is exactly the drift the contract
        tests for.
      validation_plan: >-
        The measured/predicted ratio versus D is the direct test, and its drift is a
        pre-registered falsification condition rather than a diagnostic.
    - id: HEUR-DELTA-3
      statement: >-
        NOT LOAD-BEARING, RECORDED SO THAT NOBODY INFERS IT. Nothing in this proposal
        assumes, uses, or tests Heuristic 1 of the paper (the smoothness of the minimal
        degree). The two are independent and the record does not inherit Heuristic 1's
        condition.
      rigorous_support: n/a
      validation_plan: n/a

  target_complexity:
    time_exponent: >-
      THE EXPONENT UNDER AUDIT IS 1/3 (p^{1/3+o(1)}, the current best for the supersingular
      endomorphism / isogeny problem). This proposal moves no exponent by itself; it measures
      the quantity that determines it, and its pre-registered fork corresponds to exponents
      1, 1/3 and 1/4 -- i.e. a band of width p^{1/12} on either side of the current best,
      which is the largest band any single toy-scale measurement in this goal could address.
    memory_exponent: >-
      Of the algorithm under audit: p^{1/3+o(1)}, essentially as large as its time (paper
      section 1.1, READ). Of this proposal's own measurement: O(N) = O(p) integers at toy p,
      bounded by the declared budget.
    best_known: >-
      Time and memory p^{1/3+o(1)} (2026, frozen input, READ). Previously
      p^{1/2}*(log p)^{O(1)} with polynomial memory (Delfs-Galbraith), stable since 2006 per
      the paper's section 1.
    hidden_overhead: >-
      The o(1) in p^{1/3+o(1)} hides a SUPERPOLYNOMIAL overhead, "much larger than the
      previous (log p)^{O(1)} cofactor" (paper section 1.1, READ verbatim). This proposal's
      exponent statements are exponent statements and say nothing about that cofactor.
    tradeoff_note: >-
      The time-memory tradeoff of the algorithm under audit is the subject of the companion
      proposal IDEA-20260805-bc8246 and is deliberately not re-treated here.

  dominated_by: >-
    n/a (no attack proposed). ROWS CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES before
    writing n/a, as inventor-protocol section 5 requires:
    (1) Wesolowski 2026: time p^{1/3+o(1)}, memory p^{1/3+o(1)}, queries 0.
    (2) Delfs-Galbraith: time p^{1/2}(log p)^{O(1)}, memory polynomial, queries 0.
    (3) van Oorschot-Wiener interpolation: time p^{1/2+o(1)}/w^{1/2}, memory w, queries 0.
    (4) Meet-in-the-middle: time p^{1/2}, memory p^{1/2}, queries 0.
    (5) Kohel 1996: time p*(log p)^{O(1)}, memory polynomial, queries 0.
    The data/queries axis is 0 for every row -- path-finding takes a static two-curve input
    and consumes no oracle -- so no row can be dominated on that axis and the frontier is
    two-dimensional. This proposal adds no row to it.
  sota_delta: >-
    Zero on every attack axis: no time, memory, query or preprocessing cost is reduced by
    anything in this record. QUANTITATIVELY, the deliverable is a measured exponent beta with
    three pre-registered branches mapping to algorithm exponents 1, 1/3 and 1/4 -- i.e. the
    measurement's outputs differ from each other by p^{2/3} and p^{1/12} in the exponent of
    the central hard problem. The record's own contribution to sota is a SCREEN: any future
    SSI proposal in this architecture must exhibit its (beta, gamma) pair, and gamma/beta is
    its exponent whether or not it says so.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    The dominant measured cost in the feasibility probe is the vertex-set construction:
    14.5 s at p = 1019 and growing like p^3 in the vectorised method, so p ~ 2003 is minutes
    and p ~ 4003 is tens of minutes. The graph build and the Dijkstra are negligible beside
    it. The contract declares the breadth-first Phi_2 construction as the route to larger p
    and gates it on the two constructions agreeing at the small primes.
  recommended_priority: high
  honest_prior_of_survival: >-
    0.20 that beta_hat lands outside [1.35, 1.65] with fit quality good enough to survive
    review, and 0.03 that it lands at or above 1.85 (the outcome that would matter most).
    IT IS NOT LOWER BECAUSE: the L-smooth restriction genuinely changes the law and nobody
    in this corpus has measured it; the gap between the subfield-walk lower bound
    (beta >= 1/2) and the counting prediction (beta = 3/2) is a factor of 3 in the exponent
    and toy scale may well only reach the lower one; and DEC-20260805-2be965 records this
    programme's own red team finding four of five named obstructions defective on audit, so
    derived-but-unmeasured laws in this area have a poor track record.
    IT IS NOT HIGHER BECAUSE: the counting is elementary, it reproduces Theorem 1.5's
    exponent exactly, and it is anchored at D = 1 by two independently known facts (the
    F_p-rational subfield count and the paper's own O(p^{-1/2}) adjacency probability), so
    the most likely outcome by far is a confirmation at 3/2.
    Separately, 0.90 that the run reaches a decisive readout at all, since stage 0 is pen
    and paper and the construction is already demonstrated.

