idea:
  id: IDEA-20260828-8c7aa8
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    The partial-byte-match collision graph: a sample-based (not
    exhaustive-domain) invariant executable at REAL AES-128/192/256 scale,
    tested against the classical Erdos-Renyi/Poisson small-subgraph-count
    null
  class: mechanism

  claim: >-
    For a fixed key K, round count r, and a designated subset S of s output
    byte positions, draw M random plaintexts P_1,...,P_M and form the
    undirected graph G(K,r,S) on M vertices where an edge (u,v) exists iff
    the ciphertexts of P_u and P_v agree on every byte position in S. CLAIM:
    for M << 2^{8s} (the sparse/birthday regime), the EDGE COUNT and
    TRIANGLE COUNT of G(K,r,S) have asymptotically Poisson null
    distributions under the assumption that E_K behaves as a Haar-random
    permutation on the observed coordinates (edge probability
    p = 2^{-8s} per pair, edge count ~ Poisson(C(M,2)p), triangle count ~
    Poisson(C(M,3)p^3), via the classical Chen-Stein Poisson approximation
    for small-subgraph counts in sparse Erdos-Renyi random graphs).
    BECAUSE THIS INSTRUMENT NEEDS ONLY M SAMPLES, not the full domain, it
    is the FIRST INSTRUMENT IN THIS RQ'S PROPOSAL HISTORY EXECUTABLE
    DIRECTLY AT REAL AES-128/192/256 BLOCK SIZE rather than only at a toy
    field size -- discriminating between (H_prp) "edge and triangle counts
    match their Poisson null within calibrated tolerance at the full round
    count, for real AES-128/192/256" and (H_dev) "a replicated excess or
    deficit persists at the full round count," a genuine full-scale
    distinguisher signal, not a toy artifact.

  object_first_candidate:
    tracked_object: >-
      The undirected graph formed by partial-byte-match collisions among M
      independently sampled ciphertexts under one fixed key -- specifically
      its edge count and triangle count -- read at REAL AES-128/192/256
      block size via sampling, not exhaustive domain traversal.
    established_families_off_limits: >-
      All twelve off-limits families (differential/truncated differential;
      linear/multidimensional linear; integral/square/division property;
      impossible differential; meet-in-the-middle and Demirci-Selcuk;
      boomerang/retracing boomerang; biclique; algebraic/Groebner; yoyo;
      mixture differential/exchange; subspace trail; partial sums) are
      off-limits and none is used. In particular this is NOT
      meet-in-the-middle/biclique: no subkey is guessed and no
      partial-computation table is built or matched across key candidates;
      the graph is built purely among FULL CIPHERTEXTS under one FIXED,
      UNKNOWN key, to test randomness, not to eliminate key guesses. It is
      a generic random-graph statistic, structurally closer to
      birthday-paradox/collision-counting generic randomness testing (e.g.
      NIST SP800-22-style batteries) than to any of the twelve.
      THE NEAREST INTERNAL PRIOR ART, checked this session:
      IDEA-20260828-355431 (filed earlier today, same session) uses the
      EXACT CYCLE TYPE of the whole keyed permutation, requiring
      EXHAUSTIVE traversal of the full 2^n domain and hence toy-scale only
      (n <= ~24 per that record's own bound). This proposal is a
      genuinely different object (a graph over a random SAMPLE, not a
      partition of the WHOLE domain), with a genuinely different
      testability profile: cycle type cannot be computed from any sample
      smaller than the full domain; the collision graph is well-defined
      and computable at any M, including M polynomial in the block size.
      This discrimination is stated explicitly to preempt a
      "restatement" objection.
    newness_score: >-
      The general tool (collision/birthday statistics as a randomness
      test) is elementary and standard; new to this program's checked AES
      corpus is (i) its specific formulation as a partial-byte-match graph
      with edge/triangle counts read against the Poisson approximation,
      and (ii) that this formulation is the first in this RQ's history
      executable at real AES-128/192/256 block size rather than only a
      toy field size. Novelty against external literature is UNVERIFIED;
      no search specific to "AES collision graph triangle count" was
      performed this session.
    testability_score: >-
      High. One reading at a chosen M (e.g. 2^12-2^16) and s (e.g. s=2)
      costs M encryptions plus O(M log M) grouping work (sort on the
      S-byte window); comfortably inside the measured envelope for M up
      to at least 2^16-2^20 on 4 cores / 15 GB RAM.
    survival_score: >-
      Expected LOW for a genuine full-round deviation, matching this
      program's standing PRP prior. Unlike IDEA-20260828-355431, a CLEAN
      PASS here is a statement about REAL, full-scale AES-128/192/256
      rather than only a toy analogue -- a genuinely stronger deliverable
      even in the expected-negative case.

  mechanism: |
    THE NULL, DERIVED. For a Haar-random permutation restricted to
    M << 2^{8s} independent random inputs, the probability two distinct
    outputs agree on s designated bytes is, to leading order (birthday
    regime), p = 2^{-8s} per pair, with pairwise agreements weakly
    dependent through the permutation constraint (an O(M/2^n) correction
    at full block size n=128, the same order of approximation this
    program's co-degree ladders already accept for their own nulls).
    E[edge count] = C(M,2)p; E[triangle count] = C(M,3)p^3 (each of a
    candidate triangle's three edges must independently match, to leading
    order); both counts are approximately Poisson via the Chen-Stein
    method for sparse random graphs -- a rigorous, standard tool for
    small-subgraph counts, not invented for this record.

    WHY THIS IS EXECUTABLE AT REAL AES SCALE, UNLIKE EVERY OTHER
    FULL-PERMUTATION INSTRUMENT IN THIS RQ. The cycle-type instrument
    (IDEA-20260828-355431) and the co-degree/interpolation ladders
    (IDEA-20260805-62359f, IDEA-20260828-01fc51) each require exhaustive
    traversal of a domain or exhaustive enumeration of a byte's full
    256-value range, and are explicitly toy-scale for that reason. This
    instrument requires only M independent samples from the FULL 128/192/
    256-bit domain, with M chosen freely, so a reading at real AES-128
    costs exactly the same M encryptions it would at any toy analogue.
    The EXPECTED outcome, stated honestly, is a clean null, in which case
    the deliverable is a validated real-scale PRP-consistency measurement
    rather than a toy analogue's measurement.

  novelty_status: unverified

  citations:
    - ref: "IDEA-20260828-355431 (this session, same RQ, filed earlier today)"
      provenance: internal
      claim: >-
        Defines and measures the exact cycle type of a toy AES-shaped
        SPN's full permutation via exhaustive domain traversal (n <=
        ~24). Cited to establish the whole-domain vs sample-based
        discrimination that is the load-bearing novelty claim here.
      verified_by: "idea-generator subagent (read in full this session)"
    - ref: "Classical Chen-Stein Poisson approximation for small-subgraph counts in sparse Erdos-Renyi random graphs; the birthday-paradox collision formula"
      provenance: recalled
      claim: >-
        Standard results in probabilistic combinatorics. Recalled from
        training, NOT independently re-verified against a primary source
        this session; validation calibrates the finite-M, finite-p
        behaviour directly against an actual random-permutation null.
      verified_by: null

  assumptions:
    - >-
      That M ciphertexts and grouping by the S-byte window (sort/hash
      based, O(M log M)) for M up to 2^16-2^20 fits the measured resource
      envelope.
    - >-
      That the birthday-regime approximation (M^2 << 2^{8s}, M << 2^n)
      holds for the chosen (M,s); checked directly by choosing an
      expected edge count in a workable range (tens to low hundreds),
      never assumed silently.

  proof_search_map:
    not_applicable_reason: >-
      Empirical statistical measurement against a classical asymptotic
      null (Poisson approximation for sparse random graphs), not an
      asymptotic complexity claim, certificate family, or closure/
      reduction argument. No KN-TECH-080 audit applies.

  predictions:
    - metric: "edge_count(K,r,S) at full round count, s=2, M=2^14, over >= 200 independent keys"
      direction: different
      minimum_effect: >-
        PREDICTED Poisson(C(M,2)*2^-16) with the exact mean computed
        before the run; a measured mean/variance outside a pre-registered
        tolerance band is the signal.
    - metric: "triangle_count(K,r,S), same parameters"
      direction: different
      minimum_effect: >-
        PREDICTED Poisson(C(M,3)*2^-48); given the small expected value,
        any single observed triangle is reported with its exact tail
        probability, with replication on independent keys pre-registered
        before any claim.
    - metric: "matched random-permutation null: identical statistic on an actual random 128-bit bijection"
      direction: different
      minimum_effect: >-
        FORCED to match the derived Poisson parameters within Monte Carlo
        error over >= 1000 independent draws; can fail if the counting
        code is wrong.
    - metric: "round_count_decay_ladder: edge/triangle counts at r=1..10/12/14, real AES-128/192/256"
      direction: different
      minimum_effect: >-
        PREDICTED at the Poisson null from a small r onward; pre-registered
        SHAPE is monotone non-increasing deviation as r increases, with a
        non-monotone profile treated as the canonical artifact tell.
    - metric: "sibling_null: identical statistic on a full-round AES-shaped SPN with a uniformly random S-box"
      direction: different
      minimum_effect: >-
        PREDICTED to reproduce the real-S-box profile exactly; a mismatch
        localizes the finding to round geometry vs the specific S-box.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (seconds, CAN END THE LINE):
      matched random-permutation null calibration at the chosen (M,s).
      STAGE 1 (seconds-minutes): M ciphertexts under >= 200 independent
      AES-128 keys at the full round count, grouped by the S-byte window,
      edge/triangle counts computed. STAGE 2 (minutes): repeat at
      AES-192/256 and, budget permitting, a round-count ladder for
      AES-128. STAGE 3 (minutes): the sibling null. STAGE 4 (paper): write
      the finding.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: an actual random
        128-bit bijection read through identical sampling/grouping code.
        Forced Poisson-parameter match.
      - "SIBLING NULL THAT ISOLATES THE PROPERTY: the AES-shaped SPN with a uniformly random S-box, everything else identical."
      - "GRADED CONTROL: the round-count ladder, with monotonicity reported, per RQ-AES-002's mandatory round-count decay check."
      - "ORDERING CONTROL: the null-object calibration is computed and hash-committed before any AES treatment reading."
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository
        measures a partial-byte-match collision graph's edge or triangle
        count for any AES-shaped object. Recorded as unavailable.
    required_metrics: ["edge count and triangle count per (key,round,S) cell with exact Poisson tail probabilities", "matched null calibration", "sibling-null comparison", "round-count decay profile"]

  falsification_conditions:
    - "The matched random-permutation null does not reproduce the derived Poisson parameters. Counting/grouping code is wrong."
    - >-
      A replicated, statistically significant deviation persists at the
      full round count for real AES-128/-192/-256 after all controls
      pass. Requires the measured false-positive rate against the matched
      control at the same data complexity (built into this design, per
      RQ-AES-002 R7) and routes to independent xhigh/breakthrough review
      per AGENTS.md rule 12 before any stronger language.
    - "The sibling null reproduces the real-S-box profile exactly at every round."
    - "The deviation-from-null profile is non-monotone across the round-count ladder."

  confounders:
    - >-
      CHOICE OF S and its position relative to MixColumns' diffusion
      structure. Declared pre-run: S drawn from at least two structurally
      distinct choices (within one column vs spanning two columns),
      reported separately.
    - >-
      FINITE-M DEVIATION FROM THE ASYMPTOTIC POISSON APPROXIMATION (order
      M/2^n). Declared pre-run: shown negligible at the chosen M,n or
      explicitly included in the tolerance band.
    - "SEED/SAMPLE CORRELATION across keys and rounds: independent seed streams per cell, declared pre-run."

  interpretation_limits:
    - >-
      This is the one instrument in this RQ's own history whose CLEAN
      PASS is a statement at up to `toy`-exceeding tier about REAL
      full-round AES-128/192/256 rather than a toy analogue, since it
      needs only sample access -- but RQ-AES-002 R7's DEFAULT remains toy
      for all evidence, and any promotion beyond that default still
      requires the independent review chain and BLK-1/CM-1 gates; this
      proposal does not itself claim `crypto` tier. A clean pass licenses
      only: "the sampled partial-byte-match collision graph of full-round
      AES-K at these parameters is statistically consistent with the
      Poisson null for a Haar-random permutation, at this M, this s, this
      key sample."
    - >-
      A negative closes only the named class at the tested (M,s); forward
      guidance names larger s and non-uniform (structured coset) sampling
      as OPEN AND UNATTEMPTED.
    - "A positive is a distinguisher candidate only, explicitly not converted into a key-recovery claim by this record."

  heuristic_assumptions:
    - id: H1
      statement: >-
        For M independent random plaintexts under a Haar-random 128/192/
        256-bit permutation with M << 2^{8s}, the probability two outputs
        agree on a fixed s-byte window is 2^{-8s} to leading order, and
        the resulting edge/triangle counts are approximately Poisson,
        imitating the classical small-subgraph-count theorem for sparse
        Erdos-Renyi random graphs G(M,p).
      rigorous_support: >-
        The leading-order collision probability is exact for sampling
        without replacement from a permutation in the regime M << 2^n;
        the Poisson approximation for the resulting weakly-dependent rare
        events is a standard, rigorous result via the Chen-Stein method,
        not invented for this record.
      validation_plan: >-
        Stage 0's calibration measures the actual finite-M distribution
        directly (>= 1000 draws) rather than relying on the asymptotic
        formula alone, with a tail-consistency check on the single most
        extreme observed count against its exact hypergeometric-derived
        tail probability.
    - id: H2
      statement: >-
        AES-K, at its own full round count, behaves like a Haar-random
        permutation on this collision-graph statistic -- the PRP
        heuristic restated as a concrete prediction, tested at a
        testability regime that reaches real cryptographic block size.
      rigorous_support: >-
        NOT A THEOREM -- the genuinely uncertain content of this proposal,
        identical in kind to every other PRP-consistency check in this
        program but tested directly on the pinned FIPS-197 implementation
        at its own key sizes rather than on a toy analogue.
      validation_plan: >-
        MEASURED directly per minimal_test, with the round-count decay
        profile and sibling-null comparison reported regardless of the
        result's direction.

  target_complexity:
    time_exponent: >-
      NOT AN ATTACK; no exponent moved. One reading costs M encryptions
      plus O(M log M) grouping, M chosen independently of block size; at
      no parameter choice does this approach the definitional
      exhaustive-key-search reference.
    memory_exponent: "O(M) ciphertext samples (e.g. 16 MB at M=2^20), negligible, stated beside time."
    best_known: >-
      The reference is exhaustive key search under CM-1 (definitional);
      the published state of the art is UNADJUDICABLE here, asserted in
      neither direction. No attack-side best-known competitor exists.
    hidden_overhead: "None beyond the stated O(M log M) grouping cost."
    tradeoff_note: >-
      M and s trade off against each other and against the expected edge/
      triangle count; this is the instrument's only tunable frontier, no
      memory-for-time trade beyond ordinary sorting/hashing choices.

  dominated_by: >-
