  proof_search_map:
    bottleneck: '"The modular filter that lets HGJ enumerate only a 1/M fraction of each half."'
    baseline_embedding:
      parameter_slice: '"M = 1 (no filter) reproduces BSGS exactly."'
      reproduction_check: '"Symbolic: HGJ with M = 1 has time |L| = B^{m/2} = N^{1/2}."'
    observation_collision:
      observable: '"Representation multiplicity R together with filter feasibility."'
      distinct_preimage_search: Integer knapsack and ECDLP have the same R and different feasibility
        — the collision in R is exactly what localises the obstruction in the filter and not
        the counting.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: '"Digit-representation encoding of k with an enlarged alphabet."'
      predicted_gain: '"Would be N^{0.29} if a compatible filter existed; it does not."'
    - transform: observable_fiber
      proposed_object: '"The fibre of the map (u,v) -> u+v over the unknown target."'
      predicted_gain: '"Shows the fibre is nonempty and large but unaddressable."'
    quantifier_order: 'FOR ALL M > 1 and FOR ALL filters f computable from the enumerated
      integer alone, the HGJ pairing condition requires knowledge of k mod M; since k is the
      unknown and N is prime, NO such f exists that splits the search. NEGATION SOUGHT: EXISTS
      a filter computable from the group element alone that is additively compatible.'
    method_ceiling:
      strongest_certifiable_claim: '"Closure of the HGJ/BCJ family for ECDLP under the stated
        obstruction."'
      nearby_object_control: The same argument applied to DL in F_p^*, where index calculus
        supplies exactly the missing filter (smoothness of the integer lift) and the family
        does help. That the argument correctly separates the two settings is the control.
    proof_obligations:
    - claim: '"HGJ requires the target residue"'
      responsibility: correctness
    - claim: '"<P> of prime order has no usable proper quotient"'
      responsibility: scope
    - claim: '"representation count R is unaffected"'
      responsibility: size
