    "claim": "A walk transported by an explicit subgroup isomorphism has exactly the same first useful collision time, target by target and seed by seed, while a coordinate-rehashed walk need not. This can localize apparent within-class group-operation differences to walk construction without asserting that equal order alone forces identical distributions.",
    "mechanism": "R3 paired execution trace modulo a declared isogeny, paired with Sigma={matched walk extension}. Partial-action on paired traces; discard coordinates only after verifying the commuting square phi(F(P))=F'(phi(P)). The invariant trace label is lossy over coordinate encodings, not over scalar state.\n\nFor a prime-to-N map phi and inverse on G obtained from the dual times degree^{-1} mod N, define F'=phi o F o phi^{-1}. Transfer seed tables, coefficient updates and collision acceptance rules, so each step has an exact companion. Compare this coupled arm with a new coordinate hash on E'. The coupled equality is a theorem of conjugacy; any extra group operations needed to evaluate phi^{-1} remain charged. The difference between rehashed and coupled stopping distributions measures coordinate-rule sensitivity, which Tate's point-count identity by itself cannot rule out.",
