idea:
  id: IDEA-20260926-201e86
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE F_r[Z/131]-STRUCTURE OF THE ECC2K-130 RELATION MATRIX IS EXHAUSTED BY
    THE ORBIT QUOTIENT: e = ord_131(r) = 1 is forced, the block-circulant
    matrix splits into 131 F_r-blocks of which only the lambda-eigenblock is
    live, so linear algebra is exactly m (B/131)^2 and no lower; that term
    binds at m = 4 only, where any LA-dimension lever f buys f^3 on the
    oracle budget up to f = 29; the live block's spectral genericity is
    measured against a shape-matched null

  class: mechanism

  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinates, any basis);
    the attack stage whose charged cost is at issue is LINEAR ALGEBRA, and
    through it the oracle budget of the m = 4 row of the ECC2K-130 arity
    table.

    (A) e IS NOT OPEN, IT IS 1. IDEA-20260922-b19793 prices the equivariant
    block decomposition of the relation matrix by one open integer, e =
    ord_n(ell), and emits every deployed row OPEN pending a primary-source
    ell. But IDEA-20260922-261004 (A) derives, for n prime, that the
    Frobenius eigenvalue lambda on the order-r subgroup has ord(lambda) = n
    exactly, hence n | r - 1, hence r = 1 mod n, hence e = ord_n(r) = 1. So
    for EVERY prime-degree Koblitz and subfield row of the standardized
    population, x^n - 1 splits into n distinct linear factors over F_r (the
    roots are the powers of lambda), F_r[Z/n] is F_r^n, and b19793's
    "(n-1)/e blocks over F_{r^e}" reads "n blocks over F_r itself", with
    the extension-field exponent kappa never entering. Toy check, MY
    ARITHMETIC: the n = 19 Koblitz cell has r = 130873 and r - 1 = 130872 =
    19 * 6888; the composite n = 17 cell (#E = 4 * 137 * 239) has 136 = 17 *
    8 and 238 = 17 * 14. Any deployed row for which n does not divide r - 1
    refutes 261004 (A) and this record together.

    (B) ONLY ONE OF THE n BLOCKS IS LIVE, AND IT IS 261004's QUOTIENT
    SYSTEM. Index the columns of the raw B x B matrix by (orbit O, position
    e in the orbit) and Fourier-transform within each orbit with the
    characters chi_t(sigma) = zeta^t, zeta a primitive 131st root of unity in
    F_r. The true log vector satisfies x_{sigma^e P} = lambda^e x_P, so its
    Fourier component is nonzero at exactly one character, chi_{t*} with
    zeta^{t*} = lambda. The row family of one relation (its 131 conjugates,
    right-hand sides lambda^j log R) transforms, at character t, to the
    single row sum_i a_i zeta^{t e_i} y_{O_i, t} = [log R if t = t*, else 0].
    At t = t* this is LITERALLY 261004's quotient row sum_i a_i lambda^{e_i}
    y_{O_i} = log R; at every other t it is a homogeneous equation whose
    unknowns are identically zero. So block-circulant elimination on the raw
    matrix, done correctly, solves ONE (B/131) x (B/131) system over F_r and
    discards 130 trivial ones. Consequences, stated so they can fail: (i)
    the linear-algebra term is exactly m (B/131)^2 field operations under
    KN-TECH-008's sparse model, i.e. KN-LIT-796's n^2 (KR-IC-b0fcda), and
    Z/131-equivariance gives NOTHING below it; (ii) b19793's accounting,
    which solves all (n-1)/e = 130 blocks, undercounts the gain by a factor
    130 (it reports n, the truth is n^2), while 261004's quotient basis gets
    it right; (iii) beyond Z/131 there is no further symmetry to exhaust:
    TASK-20260926-995431's closure C4 says the Z[tau]-module block systems on
    the order-r subgroup are the <lambda, -1>-orbit partitions, negation is
    already absorbed into the per-x unknown, so the symmetric reduction of
    the ECDLP relation system on ECC2K-130 ENDS at (B/131)^2.

    (C) WHERE THE LA TERM MATTERS AT THE CAP LOCUS, PRICED. Under
    IDEA-20260926-4b65e3's corrected table (rho = 2^60.81, N = 2^131, plain
    subspace base): m = 4 is the ONLY arity where linear algebra binds (LA at
    the cap B_cap = 2^33.9 is 2^69.8 above rho, so the optimum sits sub-cap
    at B = 2^29.04 with oracle budget 2^11.0); at m >= 5 the LA at the cap is
    3.3 bits (m = 5) or more below rho and the budget is relation-bound. MY
    ARITHMETIC, zero compute. Any lever that divides the LA DIMENSION by f
    (LA cost / f^2, relation count unchanged) raises the m = 4 budget as f^3:
    minimising A B^{-3} + D B^2 with A = 24 * 2^131 * C and D = 4/f^2 gives
    T_min = (5/3) D B^2 and C_max proportional to D^{-3/2} = f^3; the cap
    B_cap = 2^33.9 is reached at D = 2^{-7.73}, i.e. f = 2^4.87 = 29, beyond
    which the budget is cap-bound at rho / B_cap = 2^26.9. So NFS-realistic
    filtering f in [1.15, 3] (IDEA-20260915-9191ed) buys 0.6 to 4.8 bits at
    m = 4 and, because the m >= 5 LA term is already below rho, at most 0.15
    bit at m = 5 and nothing at m >= 6. The orbit quotient is the one lever
    that also divides the RELATION count by 131 (one quotient row per
    solve, 261004): with it the m = 4 optimum moves to the cap (relations
    2^26.87, LA 4 (2^26.87)^2 = 2^55.7, both below rho) and the per-target
    budget is rho / 2^26.87 = 2^33.9 (2^33.2 with the 1.58 attempts at mu =
    1), a lift of about 23 bits over 2^11.0, of which about 16 come from the
    LA term and 7 from the relation count. At m = 5 the same lever gives
    2^40.2 against 2^32.4 (relation count only). THE CONDITION, stated
    plainly: an orbit-union base on ECC2K-130 has no stable subspace
    (KN-OPEN-095df5), so its decomposition oracle enumerates 131^{m-1}
    shift systems per target unless that enumeration is amortised
    (KN-FIND-47da4e measures the (representative, shift) encoding
    cost-neutral against the 131^{m-1} baseline at m = 2; IDEA-20260906-
    a77711 owns the equivariance question). With S = 131^3 = 2^21.1 systems
    per target at m = 4 the budget per SYSTEM is 2^12.8, a lift of 1.8 bits;
    at m = 5 with S = 131^4 = 2^28.1 it is 2^12.1, a LOSS of 20 bits against
    the plain base. So the orbit-quotient linear algebra is worth 23 bits at
    m = 4 if and only if the shift enumeration is amortised to O(1) systems
    per target, and is otherwise worth 2 bits at m = 4 and negative at m >= 5.
    This is the honest answer to the seam's "does the LA term ever matter at
    the cap locus": at m = 4, conditionally on FROB's open amortisation;
    nowhere else.

    (D) THE ONE MEASURED NUMBER: IS THE LIVE BLOCK SPECTRALLY GENERIC? After
    the symmetric reduction, the only route to an LA cost below m U^2 (U =
    B/131) is non-symmetric structure of the live block: a minimal
    polynomial of degree materially below U would shorten every Krylov
    method (IDEA-20260922-2e2a58's prediction (ii) and its review's
    successor seam), and displacement structure would admit superfast
    solvers (KN-OPEN-006). No record has measured either on an ECDLP
    relation matrix over a binary curve. PREDICTION, stated in advance:
    the minimal-polynomial degree of the live block on toy Koblitz cells
    equals that of the shape-matched random sparse null within 5 percent,
    and its displacement rank against Toeplitz/Hankel structure grows
    proportionally to U (no structure). The LEAD reading is a degree below
    0.8 U with the null at U.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the relation row vector over the
    factor base indexed by x-coordinates, in one of two coordinate systems
    (raw, dimension B; Fourier over the Z/131 orbit action, dimension B
    split into 131 blocks of B/131). Operation set Sigma: translation by
    factor-base elements (Class I, index calculus's own) together with
    <sigma> acting on the index set; Sigma is not the full translation
    action.

    TRICHOTOMY. Class I, partial-action, exactly as IDEA-20260922-261004
    places it: the relation vector propagates under translation by
    factor-base elements; <sigma> acts on the labelling.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The Fourier change of basis on
    the raw matrix is a change of coordinates and loses nothing (261004 says
    the same of its quotient map on one row). The LOSSY step is discarding
    the 130 non-live blocks, and the discard is Sigma-compatible because the
    log vector is a lambda-eigenvector of sigma (a fact about the group, not
    about the search): those blocks contain no information about any
    logarithm. What is genuinely discarded is search-side data (which
    conjugate was found), the same (131 -> 1) collapse 261004 names. This
    record proposes no new tracked object; it closes the equivariant LA
    question with a derivation and measures what is left.

    THE PRICED OPEN NUMBER. For the symmetric reduction, none: the gain is
    exactly 131^2 on LA and 131 on relations, at O(131) word comparisons per
    leg for canonicalisation (IDEA-20260922-6cf862), plus the 131^{m-1}
    shift-system enumeration that (C) charges. For the non-symmetric
    residue, the measured pair (minimal-polynomial degree / U, displacement
    rank / U) on the live block against the null.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (decomposition) is the family; F6
    (Frobenius orbit) is the quotient. What is added beyond KR-IC-b0fcda,
    261004 and b19793: the forced value e = 1, the single-live-block
    derivation that reconciles the n and n^2 accountings, the m = 4 exchange
    rate f^3 with its ceiling f = 29 and its conditional on shift
    amortisation, and the first spectral measurement of an ECDLP relation
    matrix over a binary curve. NOT KN-OPEN-006's line: no support design;
    the displacement rank is measured on the naturally produced matrix as a
    control, not engineered.

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1; attack stage LINEAR ALGEBRA.

