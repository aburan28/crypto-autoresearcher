  proof_search_map:
    bottleneck: >-
      Whether ANY structure of the ECDLP relation matrix on ECC2K-130 lowers
      the LA term below m (B/131)^2. Symmetry is exhausted by (B); the
      residue is the non-symmetric spectral structure of the live block,
      which (D) measures.
    baseline_embedding:
      parameter_slice: >-
        Setting e = 1 in b19793's formula with all n blocks solved gives a
        factor n; 261004's quotient basis gives n^2; KR-IC-b0fcda reports
        n^2. The record must reproduce n^2 from the Fourier picture (one live
        block) and exhibit the factor-n undercount as the cost of solving 130
        homogeneous blocks with zero solution.
      reproduction_check: >-
        Symbolic: the row-DFT computation in (B) at t = t* must return
        261004's quotient row verbatim, and at t != t* the right-hand side
        sum_j lambda^j zeta^{-tj} must vanish (a geometric sum over a full
        period of a nontrivial root of unity). Frozen fixture: on the n = 19
        Koblitz cell, the Fourier-transformed right-hand sides of every
        conjugate family are zero at the 18 non-live characters to machine
        exactness over F_r, and the live block reproduces the quotient system
        entry for entry.
    observation_collision:
      observable: >-
        The triple (minimal-polynomial degree / U, displacement rank / U,
        field operations to solve) on the live block, real versus null.
      distinct_preimage_search: >-
        A short minimal polynomial has two preimages: (i) genuine spectral
        structure of the curve's relation matrix, or (ii) rank deficiency of
        the relation set (duplicate or dependent rows, IDEA-20260815-fa56e7's
        deficit), which shortens the chain trivially. Separated by reporting
        the rank alongside the degree and comparing degree / rank rather than
        degree / U, and by the null, which is rewired from the real matrix
        with the same rank profile.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The raw relation matrix in the Z/131 Fourier basis: 131 blocks of
          size (#families) x (B/131); encoding exact and reversible;
          completeness (every relation's information sits in the live block)
          by the eigenvector argument; soundness (the live block's solution
          is the log vector) by 261004 (B).
        predicted_gain: >-
          LA exactly m (B/131)^2, reconciling b19793 (n) with 261004 and
          KR-IC-b0fcda (n^2); zero compute.
      - transform: specialization_pack
        proposed_object: >-
          The m = 4 sub-cap optimisation with LA divided by f^2, specialised
          to f in {1.15, 3, 29, 131}, giving the exchange rate f^3 and its
          ceiling.
        predicted_gain: >-
          A committed table column: which LA levers matter, where, and by
          how much; zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the LA cost model fixed and vary the matrix: real live block,
          shape-matched random null, relabelled Z/rZ replica (identical by
          module invariance), and a planted low-rank-perturbation-of-
          circulant matrix (the positive control for structure detection).
        predicted_gain: >-
          Makes the "no structure" reading admissible by exhibiting the
          instrument reading structure where it is planted.
    quantifier_order: >-
      (A) FOR ALL prime n and FOR ALL Koblitz or subfield rows with prime
      subgroup order r and Frobenius eigenvalue lambda of order n, e =
      ord_n(r) = 1. (B) FOR ALL Frobenius-stable factor bases and FOR ALL
      relation families, exactly one Fourier block carries the system.
      (C) Under the stated cost model, FOR ALL f, the m = 4 budget scales as
      f^3 up to f = 29. (D) FOR THE TESTED cells, the live block's
      minimal-polynomial degree and displacement rank are within the null's
      spread. NOT CLAIMED: any statement about non-symmetric structure at
      n = 131, or any oracle reaching the lifted budget.
    method_ceiling:
      strongest_certifiable_claim: >-
        "e = 1 on every prime-degree row; the equivariant LA gain on
        ECC2K-130 is exactly 131^2 and no more; the m = 4 oracle budget rises
        as f^3 in any LA-dimension lever up to f = 29, and to 2^33.9 with the
        orbit quotient if and only if the shift enumeration is amortised; on
        toy Koblitz cells n in {19, 23} the live block reads [values] against
        the null [values]." It can NEVER certify the absence of non-symmetric
        structure at n = 131, nor amortise the shift enumeration.
      nearby_object_control: >-
        The ORDINARY n = 19 CERTBIN curve (no Frobenius endomorphism, one
        block, the quotient is the identity: the instrument must report
        "nothing to reduce"); the composite n = 17 Koblitz cell (17 | 136 and
        17 | 238, e = 1 in each prime factor: the reduction works modulo each
        factor separately); and the planted structured matrix where the
        spectral instrument MUST read structure.
    proof_obligations:
      - claim: n | r - 1 at n = 19 (130872 = 19 * 6888) and for ECC2K-130's published r by one modular reduction.
        responsibility: correctness
      - claim: The right-hand sides vanish at every non-live character and the live block equals 261004's quotient system, on real toy relation families.
        responsibility: correctness
      - claim: The m = 4 exchange rate f^3 and the ceiling f = 29, recomputed in Python from 4b65e3's model.
        responsibility: runtime
      - claim: The spectral instrument reads degree U on the null, below U on the planted structured matrix, and reports the real block's value with an interval.
        responsibility: feasibility
      - claim: Nothing here amortises the 131^{m-1} shift enumeration or claims a budget at m = 4 without it.
        responsibility: scope

