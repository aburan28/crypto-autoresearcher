      Part 1 already asks for this); recompute (C) in Python. STAGE 1
      (instrument gate, minutes): on the n = 19 Koblitz cell build an
      orbit-union factor base S (a random subspace V' of dimension 12, its
      19 conjugates, |S| about 2^12.7, U about 400 orbits), collect m = 2
      relations by the exact (m-1)-fold loop for 3U random subgroup targets,
      form the 19 conjugates of each, build the raw matrix over F_r and its
      Fourier blocks, and check the two exact predictions (right-hand sides
      zero off the live character; live block equals the quotient system).
      STAGE 2 (the measurement): on the live block (and on the plain
      quotient matrix, which is the same object) run scalar Wiedemann over
      F_r with Berlekamp-Massey on the sequence u^T M^i v to get the
      minimal-polynomial degree, and a displacement-rank probe (rank of
      M - Z M Z^T for the shift Z, sampled), on the real block, the
      configuration-model null (rewired from the real hypergraph, same
      degrees, same rank profile), the relabelled Z/rZ replica, and a
      planted circulant-plus-low-rank control. Repeat at n = 23 (U about
      1500) with a general-n field module. STAGE 3 (zero compute): write the
      m = 4 column with the lever table and the conditional on shift
      amortisation. No attack is run.
    cell:
      curve: >-
        PRIMARY: Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 +
        t + 1), #E = 4 * 130873 (my arithmetic, recompute and prove
        primality at setup), lambda a root of T^2 + T + 2 mod 130873 of
        order 19. LADDER: a = 0 Koblitz at n = 23 with #E/4 prime (verify at
        setup). ORDINARY CONTROL: the n = 19 CERTBIN cell (A = 46693,
        B = 306147, h = 2), where the quotient is trivial. COMPOSITE
        CONTROL: n = 17 Koblitz, #E = 4 * 137 * 239, reduction modulo each
        prime factor. GENERIC CONTROL: relabelled Z/rZ with the same base
        and the same relation families (module invariance forces identical
        blocks).
      m: 2 (exact loop; m = 3 by the loop at n = 19 if time permits)
      l: orbit union of a dimension-12 random subspace at n = 19 (|S| about 2^12.7, U about 400); dimension 15 at n = 23 (U about 1500)
      factor_base: >-
        S = union of Frobenius orbits of V' (orbit-union base, implicit-
        membership class); the plain subspace V' itself as a second arm
        (no orbit structure, one block).
      targets: 3U random subgroup targets per cell, relations kept until rank U - 1 is reached; seeds enumerated 0..9.
      seeds: enumerated, recorded.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py, gf2n.py (n = 17 field; a general-n variant is NEW, about 150 lines)
      - src/crypto_autoresearcher/index_calculus/linalg.py (incremental elimination over a prime, reused for the rank profile only)
      - 'NEW: orbit-union base builder with canonical representatives, conjugate-family expansion, Fourier block construction over F_r (about 150 lines); scalar Wiedemann with Berlekamp-Massey over F_r and a displacement-rank probe (about 200 lines); configuration-model rewiring (about 60 lines); all pure Python'
      - 'missing: none; a block-Wiedemann engine is not needed for the degree measurement'
    procedure:
      - 1. Stage 0 reductions and the (C) recomputation; commit.
      - 2. Build the n = 19 cell; verify lambda's order and n | r - 1.
      - 3. Collect relation families by the exact loop; build raw and Fourier matrices; run the two exact checks (blocking).
      - 4. Stage 2 measurements on real, null, Z/rZ replica, planted control; report degree / rank and displacement rank / U with bootstrap intervals over 10 seeds.
      - 5. Repeat at n = 23; ordinary and composite controls.
      - 6. Write the three-row outcome and the m = 4 column.
    metrics:
      - name: rhs_offlive_nonzeros
        unit: count
        definition: number of nonzero Fourier right-hand-side entries at the 18 (or 22) non-live characters, summed over families
      - name: live_block_agreement
        unit: fraction
        definition: entries of the live block equal to the quotient-basis matrix of 261004
      - name: minpoly_degree_over_rank
        unit: dimensionless
        definition: degree of the minimal polynomial recovered by Berlekamp-Massey from 2U terms divided by the block's rank, per seed
      - name: displacement_rank_over_U
        unit: dimensionless
        definition: rank of M - Z M Z^T divided by U, for the cyclic shift Z on the orbit index in canonical order
      - name: budget_column
        unit: log2 group-op equivalents
        definition: the m = 4 oracle budget as a function of f, recomputed
    controls:
      - 'EXACT CHECKS (blocking): off-live right-hand sides zero; live block equals the quotient system.'
      - SHAPE-MATCHED CONFIGURATION-MODEL NULL with the same rank profile (blocking for any spectral reading).
      - RELABELLED Z/rZ REPLICA (must agree exactly; module invariance).
      - PLANTED circulant-plus-low-rank matrix of the same shape (the spectral instrument must read it).
      - ORDINARY n = 19 curve (one block, trivial quotient) and COMPOSITE n = 17 (reduction per prime factor).
      - RANK reported beside every degree (IDEA-20260815-fa56e7's deficit as the confound).
    outcomes:
      positive: >-
        (LEAD) minimal-polynomial degree / rank below 0.8 on the real live
        block with the null at 1.0 and the planted control detected, or
        displacement rank / U below 0.5 with the null near 1: the binary
        relation matrix has exploitable non-symmetric structure; route to
        independent review and to KN-OPEN-006's owner; the LA term could
        then fall below m (B/131)^2 and the m = 4 exchange rate applies to
        that gain.
      negative: >-
        real and null agree within 5 percent on degree / rank and within
        10 percent on displacement rank, the exact checks pass: the
        symmetric reduction is exhausted at 131^2 (derivation) and the
        residue is spectrally generic (toy measurement); the LA column of
        the ECC2K-130 table reads m (B/131)^2 with the m = 4 exchange rate
        and the shift-amortisation conditional, and the LA side is closed
        as an exponent lever with a named mechanism (Schur plus
        eigenvector; generic residue).
      artifact: >-
        an exact check fails, or the planted control is not detected, or
        the Z/rZ replica disagrees: instrument defect; nothing read.
    falsification_threshold: >-
      Stated before any run: the LEAD reading requires degree / rank below
      0.8 on at least 8 of 10 seeds at both n with the null's 10-seed
      minimum above 0.95 and the planted control read below 0.5 on every
      seed. Anything else is the negative or artifact row.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: U <= 1500, Wiedemann needs 2U sparse
        products of weight about 2U, i.e. under 2^24 field operations per
        seed; the exact loop at n = 23, dimension 15 is 2^15 additions per
        target times 4500 targets, about 2^27 additions in pure Python;
        under an hour per cell on one core.
    required_metrics:
      - rhs_offlive_nonzeros and live_block_agreement (must be 0 and 1.0)
      - minpoly_degree_over_rank and displacement_rank_over_U per seed, real, null, replica, planted
      - budget_column with the Python recomputation attached
      - certificate pass rate on every relation; termination_reason

  falsification_conditions:
    - 'Any prime-degree row with n not dividing r - 1: 261004 (A) and this record''s (A) are refuted for that row; every Frobenius accounting on it is void.'
    - 'A nonzero Fourier right-hand side at a non-live character on a verified relation family: the eigenvector argument or the instrument is wrong; blocks (B)-(D).'
    - 'The recomputed m = 4 exchange rate differs from f^3 by more than 0.5 bit at f in {2, 4, 8}: arithmetic error in (C), corrected before use.'
    - 'The LEAD threshold fires: the live block is not spectrally generic; the LA term is NOT closed at m (B/131)^2 and this record''s negative expectation is refuted in the interesting direction.'
    - 'The planted structured control is not detected by the spectral instrument: the instrument cannot see structure and no null reading is admissible.'

  confounders:
    - >-
      RANK DEFICIENCY masquerading as spectral structure: a short minimal
      polynomial from dependent rows; degree is reported over rank and the
      null carries the same rank profile.
    - >-
      SMALL U at n = 19 (about 400) makes the degree measurement coarse;
      n = 23 is the informative cell and both are reported, never pooled.
    - >-
      EXACT-LOOP RELATIONS at m = 2 have a different support law from
      solver-found relations at m >= 3 (b19793's H-BINSTD-LA-2 concern);
      the m = 3 arm by the loop is named as the check and m >= 4 is out of
      reach of the loop at these n.
    - >-
      COST MODEL: the f^3 rate is the sub-cap optimum under LA = m B^2; a
      dense or worse-conditioned LA changes the exponent, disclosed in
      assumptions.
    - >-
      THE SHIFT ENUMERATION is charged at the KN-FIND-47da4e baseline
      131^{m-1}, an unverified deposit; if a cheaper encoding exists the
      conditional in (C) loosens, which is FROB's question and is not
      assumed here either way.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT. (A)-(B) are derivations; (C) is a cost-model
      column; (D) is a toy measurement whose expected outcome is "generic".
    - >-
      KN-OPEN-020 CLASS: orbit-union bases are implicit-membership (charged
      in KN-FIND-47da4e and IDEA-20260922-6cf862); the plain subspace arm is
      the scoped class.
    - >-
      The m = 4 lift to 2^33.9 is CONDITIONAL on amortising the 131^{m-1}
      shift systems, which no record has achieved; without it the lift is
      1.8 bits and the m = 4 row stays effectively closed.
    - >-
      Toy scale n <= 23 for the spectral measurement; only the sign of
      "structure versus none" is carried forward, as a heuristic.
    - >-
      FORWARD GUIDANCE regardless of outcome: (i) the shift-amortisation
      question (FROB) is now priced at 23 bits on the m = 4 row and 8 bits
      at m = 5, which is what it is worth to answer; (ii) if the LEAD reading
      fires, the natural successor is a superfast solver on the live block
      (KN-OPEN-006's line, on a natural rather than designed matrix); (iii)
      the same Fourier reduction applies to the K-233 through K-571 rows
      with n in place of 131 and e = 1 there too.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE FOR (A) AND (B). Finite arithmetic and linear algebra over F_r;
        recorded so the absence is explicit.
      rigorous_support: Lagrange in (Z/r)^*, the DFT over a field with a primitive n-th root of unity, and 261004's disjoint-support and absorption arguments.
      validation_plan: The Stage 1 exact checks; seconds.
    - id: H2
      statement: >-
        GENERIC SPECTRUM. The live block of a real relation matrix behaves,
        for minimal-polynomial degree and displacement rank, like a
        uniformly random sparse matrix with the same degree sequence and rank
        profile; imitates the classical statement that a random sparse
        matrix over a large field has minimal polynomial of degree equal to
        its rank with probability 1 - O(1/r).
      rigorous_support: >-
        For random matrices over F_r the probability that the minimal
        polynomial has degree below the rank is O(1/r) (recalled, standard
        Wiedemann analysis); no analogue for the curve's matrix is known,
        which is why it is measured.
      validation_plan: >-
        SAMPLE: 10 seeds at n in {19, 23}, real versus configuration-model
        null. COMPARISON: degree / rank distributions; displacement rank / U.
        TAIL: the minimum degree / rank over seeds against the null's
        minimum. TRANSFER ASSUMPTION, stated: only the sign of a structure
        reading is carried to n = 131, and only as a heuristic.

  heuristic_note: >-
    (A) and (B) are unconditional. (C) is arithmetic on 4b65e3's model. The
    a-priori expectation for (D), stated in advance: generic; the record's
    predicted outcome closes the LA side of the ECC2K-130 table at
    m (B/131)^2 with a named mechanism and leaves the m = 4 lift hanging on
    FROB's amortisation.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. The LA term on ECC2K-130 with an orbit-union base is
      exactly m (B/131)^2 field operations (sparse model); the m = 4 oracle
      budget is 2^11.0 plain, 2^11.0 * f^3 for an LA-dimension lever f <= 29,
      2^12.8 with the orbit quotient and 131^3 shift systems, and 2^33.9
      with the orbit quotient and amortised shifts; m >= 5 budgets are
      unchanged by any LA lever (relation-bound).
    memory_exponent: >-
      Unchanged in exponent: U = B/131 words for the live block instead of
      B; the Fourier basis is not materialised (the quotient basis is the
      live block directly).
    best_known: matched rho 2^60.81 at O(1) per walk (KN-FIND-aa2efc); KR-IC-b0fcda's n^2 LA gain, reproduced and shown exhaustive.
    hidden_overhead: >-
      Canonicalisation O(131) word comparisons per leg; the 131^{m-1} shift
      systems per target for an orbit-union oracle, charged explicitly in
      (C) rather than hidden.
    tradeoff_note: >-
      The single live block is one sequential Krylov chain of length about
      2U/n0 (2e2a58's floor at U instead of B, i.e. 131 times shorter);
      nothing here changes rho's side of the time-memory plane.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Reuses the CERTBIN group law and the prime-modulus elimination; the
      new code is the Fourier block builder, a scalar Wiedemann with
      Berlekamp-Massey, a displacement probe and a rewiring null, a few
