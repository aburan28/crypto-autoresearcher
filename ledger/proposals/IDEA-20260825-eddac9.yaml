  batch: EC-STRUCTURE-20260825
  cluster: 'C5-lifting: why the anomalous attack is isolated'
  title: 'THE CANONICAL SECTION EXISTS, IS A HOMOMORPHISM, AND THEREFORE CARRIES ZERO INFORMATION: when
    gcd(N, p) = 1 the reduction E(Z/p^2) -> E(F_p) splits canonically, the section commutes with multiplication
    by k, and every p-adic logarithm route collapses -- the anomalous case escapes precisely because coprimality
    fails, which closes the whole lifting family with one mechanism'
  class: barrier
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The reason Smart's attack is confined to anomalous curves is standard and is recalled.
    The proposed contribution is stating it as a SPLITTING statement about the section rather than as
    a statement about the formal logarithm, because the splitting form closes the family uniformly, including
    lifts to Z/p^n and variants the formal-logarithm framing has to treat one at a time.
  claim:
    semantic_part: When gcd(N, p) = 1 the exact sequence 0 -> ker -> E(Z/p^2) -> E(F_p) -> 0 with kernel
      of order p splits canonically; the section sigma(P) = p (p^(-1) mod N) P~ is independent of the
      chosen lift P~ and is a group homomorphism, so sigma(kP) = k sigma(P) and the lift reveals nothing
      about k that the original instance did not.
    evaluator_part: 'Unestablished here: that the argument extends verbatim to E(Z/p^n) for all n and
      to every variant of the p-adic-logarithm family in this ledger. Extension is claimed as a target,
      not as a result.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - State the exact sequence and the coprimality hypothesis, and verify the section formula is lift-independent.
  - Verify the section is a group homomorphism, hence commutes with multiplication by k; conclude that
    the lifted instance is the image of the original under a homomorphism and so is information-theoretically
    equivalent to it.
  - 'Identify the exact escape: gcd(N, p) != 1, that is N = p, the anomalous case, where no canonical
    section exists and the formal logarithm on the kernel of reduction becomes usable -- which is Smart
    / Satoh-Araki / Semaev.'
  - Extend to Z/p^n and to the closest neighbours in this ledger's lifting lane, and record for each whether
    the argument applies unchanged.
  - Record the result as an obstruction block with a resource check, so it is a measured closure rather
    than prose.
  lossy_projection_test:
    tracked_object: the p-adic lift of a point modulo the kernel of reduction
    what_is_discarded: the kernel-of-reduction component of the lift
    propagation: deterministic; the section is a homomorphism
    verdict: 'FAILS section 2 decisively, and that failure IS the result: because the section is a homomorphism
      the projection loses nothing that k could be read from, so it is a change of coordinates. This is
      the cleanest available worked example of the lossy-projection test producing a closure at zero compute.'
  predictions:
  - id: P1
    status: established_formula
    statement: For gcd(N, p) = 1 the reduction sequence splits and sigma is a lift-independent group homomorphism.
  - id: P2
    status: established_formula
    statement: sigma(kP) = k sigma(P), so no function of the canonical lift separates k values that the
      instance does not already separate.
  - id: P3
    status: unestablished
    statement: Every p-adic-lifting proposal in this ledger factors through sigma and is therefore closed
      by P2.
  minimal_discriminating_test:
    status: specified_not_run
    test: 'Toy verification on both curve types: confirm sigma is lift-independent and multiplicative
      on ordinary curves with gcd(N, p) = 1, and confirm it is undefined on an anomalous curve, where
      the formal logarithm then recovers k.'
    pass: Both behaviours reproduce exactly, including the anomalous recovery as the positive control.
    fail: A non-anomalous curve where the lift carries information would falsify the closure and would
      be a major positive.
  controls:
  - An anomalous curve as the positive control, where the attack must succeed.
  - A random lift versus the canonical lift, to confirm the canonical one is genuinely lift-independent.
  - Z/p^3 as the extension check.
  confounders:
  - Implementations that accidentally use a non-canonical section can appear to leak information that
    is really an artifact of the lift choice.
  - Curves with small cofactor need the argument restated on the prime-order subgroup.
  - The formal-logarithm implementation must be validated on the anomalous control before its silence
    elsewhere means anything.
  falsification:
    semantic: An efficiently computable function of the canonical lift that depends on k beyond what sigma's
      homomorphism property permits.
    evaluator: A section-implementation bug scopes out that run.
    not_falsification: Failure to implement the lift.
  why_this_is_not_a_variant: IDEA-20260807-dbb250 closes p-adic HEIGHTS via a quadratic-form argument
    on prime-order groups. This record closes p-adic LIFTS via a splitting argument, which is a different
    mechanism reaching a neighbouring family, and it names the anomalous boundary explicitly, which the
    height argument does not.
