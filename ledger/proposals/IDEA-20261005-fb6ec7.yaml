idea:
  id: IDEA-20261005-fb6ec7
  question_id: RQ-HYPER-7ca025
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    One evaluated Richelot (2,2) codomain: subresultant triple against
    the classical Wronskian, on the first admissible genus-2 sextic
    over F_11.
  class: measurement
  claim: >-
    Let the object be the first triple of monic quadratics over F_11,
    in lexicographic order, that are pairwise coprime and whose product
    f is squarefree of degree 6. After the subresultant formulae and
    their natural normalization are read from the local PDF of
    KN-LIT-1371, that evaluator and the classical Wronskian Richelot
    evaluator return the same three monic quadratics up to order. The
    repeated-factor control (x^2+1, x^2+1, x^2+2) is rejected by both.
    The input kernel has four classes. This is a formula evaluation.
    It is not an ECDLP solver. It does not change RQ-GFPN-c01af8,
    RQ-OAKLEY-264353, RQ-BINSTD-b6f698, or RQ-FROB-7d8dd4.
  mechanism: >-
    The computed object is the codomain triple (U, V, W) of a
    Richelot (2,2)-isogeny, not a discrete logarithm. Two explanations
    are separated before the run. Agreement: the title-level
    equivalence sentence in KN-LIT-1371 holds on this sextic, up to
    the normalization that sentence calls natural. Disagreement: that
    sentence does not hold on this input, or an implementation does
    not match the PDF. A third outcome, acceptance of the
    repeated-factor control, means the admissibility guard failed.
    LOSSY-PROJECTION TEST. The underlying group is Jac of y^2 = f.
    Operation set Sigma is translation by the kernel K of the
    (2,2)-isogeny, a subgroup of the 2-torsion, not translation on a
    prime-order elliptic subgroup and not a factor-base action.
    Discarded: the choice of representative inside each coset of K
    (four classes). Compatible with Sigma: the cosets are a block
    system of translation by K, and the quotient group law is the
    codomain Jacobian. Lossy: four kernel classes map to the identity,
    so the isogeny is not injective and not a change of coordinates.
    The formulae then discard the kernel embedding and keep three
    quadratics. IDEA-20260812-104e1a only names Richelot as the cost
    class of a prime-level (N,N)-isogeny. IDEA-20260808-fa1d80
    tabulates Igusa chi_10. IDEA-20260909-4c5ee9 is a factor-base
    projector. None of those evaluates (U, V, W).
  novelty_status: unverified
  citations:
    - ref: KN-LIT-1371
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; local PDF not opened.
        The markdown relays an abstract sentence: a derivative-free
        Richelot (2,2) form via first subresultants is algebraically
        equivalent in F_p[x], odd characteristic, to the classical
        Wronskian under natural normalization, and a guarded evaluator
        returns a certified triple (U, V, W) or rejects non-admissible
        input. Author lines in the note are heuristically parsed and
        are not used.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-1371.md
    - ref: KN-LIT-921
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The
        abstract describes Richelot kernels on squared Kummer surfaces
        for a pairing, a VDF, and delay encryption. No codomain triple
        is written in the note.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-921.md
    - ref: IDEA-20260812-104e1a
      provenance: internal
      claim: >-
        Names Richelot and theta chains as algorithms polynomial in
        the level of an (N,N)-isogeny. Does not evaluate a (2,2)
        formula.
      verified_by: idea-generator, this session, via ledger/proposals/IDEA-20260812-104e1a.yaml
    - ref: Richelot 1876 / Bost-Mestre classical (2,2) formulae
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: a splitting of a sextic into
        three quadratics determines a (2,2)-isogeny of genus-2
        Jacobians by explicit quadratic formulae. Not support.
      verified_by: null
  assumptions:
    - Odd characteristic. The search starts at q = 11.
    - The first lexicographic admissible triple exists over F_11. If the search exhausts the monic triples without one, the record stops with that empty search and does not substitute another prime silently.
    - Natural normalization means monic quadratics sorted lexicographically, unless the PDF names a different normalization, in which case the PDF's rule is the one applied to both outputs.
  predictions:
    - metric: number of coefficients that differ between the two normalized triples on the first admissible sextic
      direction: different
      minimum_effect: 0
    - metric: kernel cardinality of the admissible input, counted as the identity plus the three quadratic 2-torsion divisors
      direction: different
      minimum_effect: 4
    - metric: accept bit of each evaluator on the repeated-factor control
      direction: different
      minimum_effect: 2 rejections out of 2 evaluators
  minimal_test:
    design: >-
      Read downloads/2025-2145.pdf, the local copy named by
      KN-LIT-1371, until the subresultant formulae and the
      normalization are on the page. The markdown does not contain
      them. Search F_11 for the first admissible quadratic triple.
      Evaluate both formulae. Normalize. Compare. Run the
      repeated-factor control. Stop. Do not build an isogeny chain
      and do not call a discrete-log routine.
    controls:
      - Repeated-factor triple must be rejected by both evaluators.
      - Swapping two input quadratics must leave the normalized output unchanged.
      - If normalized coefficients differ, compare #Jac(F_11) of the two codomains. Equal point counts with unequal coefficients are a normalization confound. Unequal point counts are a formula disagreement.
    required_metrics:
      - differing_coefficient_count
      - kernel_cardinality
      - control_reject_count
      - jacobian_point_count_if_coefficients_differ
  falsification_conditions:
    - Differing coefficient count is at least 1 and the two codomain Jacobians have different point counts over F_11.
    - Either evaluator accepts the repeated-factor control.
    - Kernel cardinality of an accepted input is not 4.
    - The admissible search over F_11 is empty.
  confounders:
    - Quadratic twist, scaling, and ordering of (U, V, W) can make the same isogeny look different. The point-count control separates that from a real disagreement.
    - A singular sextic can produce a triple that is not a genus-2 curve. Squarefreeness of f is required before either formula runs.
    - Characteristic 2 is outside the abstract's stated range.
  interpretation_limits:
    - Agreement on one sextic does not prove the algebraic identity.
    - Disagreement on one sextic falsifies universality of the equivalence as applied to this input, or falsifies the implementation. It does not rank isogeny graphs.
    - Not an attack claim. Gaudry's Jacobian exponent q^{2-2/g} is the baseline not claimed. For g = 2 that is exponent 1 in q. No sub-rho claim.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        Two formulae define the same principally polarized codomain,
        up to the PDF's natural normalization, if and only if their
        normalized triples coincide. This imitates uniqueness of the
        Richelot codomain given an ordered kernel, not a randomness
        model. The sample is one sextic at q = 11. No transfer to
        larger q is claimed.
      rigorous_support: >-
        KN-LIT-1371's abstract, title-level and not independently
        verified, asserts algebraic equivalence in F_p[x] under
        natural normalization. The proof was not opened. A separable
        (2,2)-kernel on a genus-2 Jacobian has order 4; that count is
        the input sanity check.
      validation_plan: >-
        On the one admissible triple, record coefficient agreement
        and, on disagreement, #Jac(F_11) of both codomains. The
        repeated-factor control must be rejected. No sampling past
        q = 11.
  target_complexity:
    time_exponent: >-
      Polynomial in the odd prime q, here q = 11, with input degree
      fixed at 6. No prime of F_q[T] is in scope. No sub-rho claim.
    memory_exponent: O(1) coefficients in F_q
    best_known: >-
      Gaudry's index calculus on a genus-g Jacobian has time exponent
      2-2/g (recalled; the paper was not opened). Not claimed. The
      opened baseline is KN-LIT-1371's unevaluated abstract sentence,
      which gives no numeral for a triple over F_11.
    hidden_overhead: >-
      None in an o(1) term. The evaluation is the whole computation.
    tradeoff_note: No time-memory tradeoff. One formula evaluation.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP attack. The ecdlp frontier classifies discrete-log
