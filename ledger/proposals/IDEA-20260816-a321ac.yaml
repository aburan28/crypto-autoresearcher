idea:
  id: IDEA-20260816-a321ac
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Test whether achievable reach is a function of the Howgrave-Graham slack alone: hold the
    pair (lattice dimension, log determinant) fixed while changing which shift set realises it, and
    ask whether two constructions with equal slack recover equal unknown-bit fractions.'
  class: theory
  claim: '(A) Every small-root construction pays for reach with two coupled costs: the lattice dimension
    D, which sets reduction cost and the quality of the shortest vector obtainable, and the log determinant,
    which sets how short a vector must be for the Howgrave-Graham condition to certify an integer
    identity. Define the slack of a construction at a given unknown-bit fraction as s = (log det)/D
    minus the log of the norm bound the condition requires, computed exactly as a rational before
    any run. (B) The claim under test is a SUFFICIENCY statement: that r_hat depends on the construction
    only through s, so that any two shift sets with the same D and the same log det, hence the same
    s, achieve the same r_hat to within the measurement resolution. This is the implicit content of
    quoting a bound in terms of dimension and determinant, and it has an obvious failure mode nobody
    here has measured: two bases with identical determinant can have wildly different Gram-Schmidt
    profiles, and reduction quality is a property of the profile, not of the determinant. (C) The
    claim is therefore two-sided and cheap: if sufficiency holds, the whole design space collapses
    to one scalar and every later entry in this bucket can be parameterised by s; if it fails, the
    measured failure names the profile statistic that carries the residual, and that statistic is
    the thing a reach bound should have been quoting all along. (D) WHAT IS NOT CLAIMED: no attack,
    no new construction, and no assertion that any published bound is misstated - a bound quoted in
    D and det can be perfectly correct as a SUFFICIENT condition while sufficiency in the sense tested
    here fails, because a sufficient condition is not required to be tight. No claim is made that
    equal-determinant shift sets exist in useful number for every construction; if they do not, the
    design is not executable and that is reported as such rather than worked around.'
  mechanism: 'Stage 1, zero compute: enumerate shift sets of a fixed dimension D for the reproduced
    construction and compute each one''s exact log determinant as an integer. Group them into equal-determinant
    classes; this is pure symbolic bookkeeping and costs nothing. Stage 2: from each class with at
    least three members, select members that differ maximally in a declared profile statistic, namely
    the variance of the log of the diagonal entries of the scaled basis, which is a determinant-preserving
    quantity. Stage 3: measure r_hat for each selected shift set on the identical seeded known-answer
    instances at the identical budget. Stage 4: regress r_hat on s alone, then on s plus the profile
    statistic, and report the residual variance explained by the second term. Sufficiency holds if
    the profile term explains no variance above the resolution floor established by the ablation entry''s
    no-op notch. Refutation route: if no equal-determinant class has three sufficiently different
    members at any feasible D, the design cannot be executed and the honest report is that the sufficiency
    question is not decidable by this construction at this dimension, naming the enumeration that
    showed it.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen as above. Additionally: grep -ril determinant over ledger/proposals/
      (67 files) and read the matching lines; grep -rih for Gram-Schmidt, profile, GSA and root-Hermite
      across ledger/proposals/; read knowledge/techniques/KN-TECH-041.md header for its GSA and BKZ
      simulation content.'
    results: 'Determinant appears in 67 proposal files, overwhelmingly in the lattice-KEM and index-calculus
      lanes where it is an input to a cost model rather than an object. KN-TECH-041 is the repository''s
      note on GSA and BKZ simulation and is the nearest technical neighbour: it concerns predicted
      basis profiles for reduction cost models, not whether a reach threshold is a function of determinant
      alone. Several proposals record Z-shape and basis-profile observations for ML-KEM lattices.
      No proposal in the corpus poses a sufficiency question of the form tested here, and none does
      so for a small-root shift lattice. IDEA-20260807-a6fb2a uses an LLL-based detector where the
      tracked quantity is a minimal degree, not a determinant class.'
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the equal-determinant class as an experimental design, and the sufficiency test
      of reach as a function of slack alone with a determinant-preserving profile statistic as the
      candidate residual carrier. Assembled from known parts: the Howgrave-Graham condition (KN-TECH-015),
      basis-profile thinking already present in KN-TECH-041, and the resolution floor produced by
      the ablation entry.'
  object_first_candidate:
    tracked_object: 'The equal-determinant class: a set of shift sets sharing dimension D and log
      determinant exactly, carried together with the within-class spread of a determinant-preserving
      profile statistic and the within-class spread of measured r_hat.'
    lossiness: Genuinely lossy, and the lossiness is the whole point. The full state of a construction
      is its entire basis matrix. The class projection retains only (D, log det), discarding the profile,
      the monomial identities and the ordering. The projection is compatible with the operation of
      comparing constructions precisely IF the reach depends on nothing that was discarded, which
      is the sufficiency claim; so the object is a projection whose validity is itself the hypothesis.
      If the within-class spread of r_hat exceeds the resolution floor, the projection is shown to
      be TOO lossy, and the recovered residual names what must be added back.
    propagation: One step of the target operation is replacing one shift set by another in the same
      class at fixed D. Under this step, by construction log det and hence s do not move at all. The
      prediction is that r_hat does not move either, beyond the resolution floor. Every measured move
      under a step that leaves the tracked pair fixed is direct evidence against sufficiency and is
      attributable to the profile statistic that did move.
    survival_score: Sufficiency is expected to hold at small D where the class members cannot differ
      much in profile, and to fail as D grows and the classes become wide. Concretely, survival is
      expected at D = 8 to 16 and the first failure is expected by D = 32 if it occurs at all; the
      measurement locates the dimension at which the projection stops being adequate, which is a number
      the program does not have.
  null_object_control: The identical within-class comparison runs against a null class constructed
    by taking shift sets with DELIBERATELY DIFFERENT determinants at the same dimension, spanning
    a declared range of s. The null must show a clear monotone dependence of r_hat on s across that
    range, at an effect size well above the resolution floor; if it does not, the instrument cannot
    detect a determinant effect at all and the within-class null result would be uninformative rather
    than evidence for sufficiency. A second null runs the whole comparison on rootless random polynomials,
    where every arm must fail, ruling out any class-dependent artifact of the lattice-building code.
  discriminated_from:
  - 'KN-TECH-041 (GSA and BKZ simulation): predicts basis profiles to cost a reduction. This entry
    holds determinant fixed and asks whether an APPLICATION-side threshold, r_hat, depends on anything
    besides the determinant, which is a different question about a different quantity.'
  - 'IDEA-20260808-e2315e: varies dimension and reads reach as a function of dimension. This entry
    holds dimension AND determinant fixed and varies the shift set, which that proposal never does.'
  - 'The stagewise-ablation entry of this bucket: changes stages and therefore usually changes the
    determinant. This entry is the determinant-preserving complement and is the reason that entry''s
    no-op floor is needed here.'
  - 'IDEA-20260807-a6fb2a (LLL level detector): uses lattice reduction to detect a structural level;
    its tracked quantity is a minimal degree, not a determinant class, and it does not test any sufficiency
    claim.'
  - 'A generic study of basis-profile effects on reduction quality: that measures the reducer''s output.
    This measures an application threshold with the reducer pinned, and the null class exists specifically
    to show the instrument can see a determinant effect when there is one.'
  assumptions:
  - Equal-determinant classes of at least three members with materially different profiles exist at
    some feasible dimension. STAGE 1 tests this symbolically before any compute is spent.
  - The declared profile statistic, the variance of log diagonal entries of the scaled basis, is determinant-preserving
    by construction and is a reasonable proxy for reduction-relevant shape. It is a proxy, not a derived
    quantity.
  - r_hat is measurable at the resolution established by the ablation entry; without that floor a
    null within-class result cannot be distinguished from an insensitive instrument.
  - The reduction algorithm is deterministic given a seed, so within-class differences are not reduction
    noise.
  predictions:
  - metric: within-class spread of r_hat at D = 8 to 16
    direction: lower
    minimum_effect: 0.02
  - metric: variance in r_hat explained by the profile statistic after s is accounted for, at the
      largest feasible D
    direction: different
    minimum_effect: No pre-committed value. Whether the residual appears at all is the question; committing
      to a fraction would presuppose the failure of sufficiency.
  - metric: null-class spread of r_hat across deliberately different determinants
    direction: higher
    minimum_effect: 0.05
  - metric: rootless-null recovery rate in every arm
    direction: lower
    minimum_effect: 0.0
  minimal_test:
    design: 'Do STAGE 1 alone first: it is zero compute. Enumerate shift sets at D in {8, 12, 16,
      24, 32} for the reproduced construction, compute exact log determinants as integers, and report
      the size and profile spread of every equal-determinant class. This costs minutes and answers
      a gating question the program cannot currently answer: whether the sufficiency test is executable
      at all. If and only if some dimension has a class with three members whose profile statistic
      differs by more than a declared threshold, proceed to measure r_hat for exactly those three
      members plus two null-class members of clearly different determinant, at n = 128 on 60 paired
      seeded instances. Five arms, one cell, a few CPU-hours. This discriminates because sufficiency
      failing within one well-chosen class is enough to refute it, and sufficiency holding in the
      widest available class at the largest feasible dimension is the strongest positive evidence
      a single cell can give.'
    controls:
    - Null class of deliberately different determinants, establishing that the instrument can see
      an s effect.
    - Rootless random-polynomial null across all arms in the same invocation.
    - Paired instances shared by every arm, so within-class comparison carries no instance variance.
    - Exact integer determinant recomputation for every shift set actually used, verifying class membership
      rather than assuming it.
    - Resolution floor imported from the ablation entry's no-op notch and re-measured here as a within-arm
      repeat.
    required_metrics:
    - exact log determinant per shift set, as an integer
    - slack s per shift set at each u, as an exact rational
    - r_hat per shift set with exact binomial interval
    - within-class spread of r_hat
    - profile statistic per shift set
    - residual variance explained by the profile statistic after s
    - 'class census: number of equal-determinant classes and their sizes per dimension'
  falsification_conditions:
  - 'No dimension yields an equal-determinant class of three members with materially different profiles:
    the sufficiency test is not executable by this construction and that enumeration is the deliverable.'
  - 'The null class shows no monotone dependence of r_hat on s: the instrument is insensitive and
    no within-class conclusion may be drawn.'
  - 'Within-class spread of r_hat exceeds the resolution floor at any dimension: sufficiency is refuted
    at that dimension.'
  - 'Rootless null recovers anything: run void.'
  - A shift set fails exact determinant recomputation, so class membership was mis-assigned.
  confounders:
  - Two shift sets in the same class may differ in the DEGREE of the polynomial relations they can
    express, which is not a profile effect at all; the class census records degree alongside the profile
    so this is separable in analysis.
  - Reduction implementation heuristics may be sensitive to row ordering, which is determinant-preserving
    but not a real profile difference; row order is randomised within each arm across replicate blocks.
  - Sample size limits the resolution floor, so a null within-class result at small samples is weak
    evidence for sufficiency and is reported with its power.
  - The chosen profile statistic may simply be the wrong residual carrier, so a null result on it
    does not establish sufficiency against every statistic. This is stated in every report.
  - At small D the classes are narrow for structural reasons, so an apparent survival at D = 8 may
    reflect the absence of contrast rather than the truth of sufficiency.
  interpretation_limits:
  - A null result supports sufficiency only against the one declared profile statistic and only at
    the tested dimensions and sample size.
  - A refutation of sufficiency is not a criticism of any published bound, which may be stated as
    a sufficient condition and remain correct.
  - No attack, no construction improvement and no statement about deployed RSA follows either way.
  - The class census is specific to the reproduced construction; a different construction has a different
    lattice of shift sets.
  target_complexity:
    time_exponent: No attack exponent is claimed. STAGE 1 is zero compute and symbolic. The measurement
      stages record wall time per arm only as budget accounting.
    memory_exponent: No attack memory exponent is claimed. Peak resident memory is recorded per arm
      beside time.
    best_known: The incumbent is the convention, visible in KN-TECH-015 and in how reach bounds are
      quoted throughout this repository, that a small-root construction is adequately described by
      its dimension and its determinant. This entry is the first thing in this repository to treat
      that convention as a testable sufficiency claim rather than as notation.
    hidden_overhead: The symbolic enumeration in STAGE 1 grows fast in the number of candidate shift
      sets, and the exact integer determinants become large; the human cost of defining a determinant-preserving
      profile statistic that is also reduction-relevant is the part most likely to be got wrong.
  dominated_by: n/a (no result claimed). No solver and no attack point is proposed, so no time, memory
    or query frontier row applies; I did not check frontier rows because there is nothing to place
    on one.
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is either a
    within-class null with its power stated, or a named residual statistic with the variance it explains,
    against a repository state that holds neither.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'STAGE 1 being executable and producing a class census: 0.9, since it
    is pure symbolic bookkeeping. A usable equal-determinant class with three materially different
    members existing at some feasible dimension: 0.5, and this is the single largest risk in the entry,
    which is why STAGE 1 gates everything. Sufficiency HOLDING at small dimension: 0.6. Sufficiency
    holding at the largest feasible dimension: 0.3, because basis profile is known in this repository
    to matter for reduction quality (KN-TECH-041) and there is no reason it should stop mattering
    here. The null class showing a clear s effect: 0.85.'
