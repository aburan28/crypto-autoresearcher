idea:
  id: IDEA-20260828-2804d3
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Ground the detector audit in real objects before trusting any re-implementation or synthetic
    analogue: run the actual deployed open-source counter-cryptanalysis library against the actual
    publicly released SHAttered and SHAmbles colliding artifacts, through both its direct file-hashing
    entry point and a manually chunked streaming entry point, and report agreement or divergence as
    the floor every symbolic or statistical detector claim in this batch must be consistent with.'
  class: control
  claim: '(A) Every detector-related proposal in this batch re-implements the predicate from primary
    specification (per the RQ''s own constraint) and tests it on either symbolic disturbance-vector
    enumeration or MD5-scale SYNTHETIC near-collision objects. None of them runs the ACTUAL, currently
    deployed library (e.g. cr-marcstevens/sha1collisiondetection, vendored into git and GnuPG) against
    the ACTUAL, already-public SHA-1 colliding artifacts the original research teams released -- the
    SHAttered identical-prefix PDF pair (2017) and the SHAmbles chosen-prefix PGP key pair with divergent
    UserIDs (2020). Both are already computed, already public, and using them produces no new SHA-1
    collision of any kind; they are the one class of concrete real evidence this program can touch
    for free. (B) This is a floor check, not a substitute for the symbolic coverage audit or the statistical
    error-rate audit: if the real deployed code fails to flag real released artifacts it uses to justify
    its own existence, every other proposal''s re-implementation must be checked against that fact before
    its own numbers are trusted, since a re-implementation that flags what the original does not (or
    vice versa) is itself evidence of a re-implementation defect. (C) A second, genuinely distinct question
    is entry-point sensitivity: is the flag decision a pure function of the message bytes regardless
    of how they are delivered to the library (a single buffer versus streamed in arbitrary chunk boundaries,
    as a real hashing library''s update()/finalize() API allows), or can chunk-boundary placement change
    the outcome on the SAME underlying bytes -- which would be a real, systems-level evasion surface
    distinct from anything a byte-level predicate audit can see. (D) WHAT IS NOT CLAIMED: no new collision,
    no assertion about any specific deployed repository''s exposure, no statement that the library is
    unsound if it flags everything correctly (that is the expected and equally reportable outcome),
    and no claim that this floor check substitutes for the coverage-over-a-generated-class audit this
    batch''s IDEA-20260816-3edd14 performs. (E) A clean pass -- both real artifacts flagged, both entry
    points agreeing -- is a fully valuable result: it is the first real, non-synthetic, non-symbolic
    grounding this program''s corpus would hold for any detector claim about SHA-1.'
  mechanism: 'STAGE 1: obtain the actual open-source counter-cryptanalysis library exactly as deployed
    (the cr-marcstevens/sha1collisiondetection source or the git.git vendored copy), build it unmodified,
    and record its exact commit/version. This is deliberately NOT a re-implementation from specification
    -- the whole point is to test the real artifact, complementing rather than duplicating the from-spec
    re-implementation this batch''s IDEA-20260816-70b60d performs. STAGE 2: obtain the actual publicly
    released colliding files -- the two SHAttered PDFs (shattered-1.pdf, shattered-2.pdf) and the SHAmbles
    PGP key material -- from their original public release locations, recording provenance and a hash
    of what was downloaded. STAGE 3: run the library''s direct file-hashing entry point on all four
    (plus their SHA-1 digests, confirming the digests match each other within each colliding pair --
    an independent sanity check that the downloaded files are what they claim to be, using only arithmetic
    this program is permitted to do, i.e. computing a digest of an EXISTING file, not searching for
    a new collision). STAGE 4: run the library''s lower-level streaming/update API, if exposed, feeding
    the identical bytes in several different chunk-boundary placements (e.g. one byte at a time, at
    the library''s natural 64-byte block boundary, and at deliberately misaligned boundaries relative
    to that), and compare flag outcomes across all placements against the STAGE-3 single-buffer result.
    STAGE 5, null control: run the identical STAGE-3/4 procedure over benign files of matched byte length
    (e.g. random files, or the SHAttered/SHAmbles files with one byte flipped in a region outside the
    near-collision blocks if that region is identifiable from public documentation, which would destroy
    the exact digest match without necessarily destroying near-collision structure) to confirm the library
    does not simply flag "large PDF" or "large PGP packet" shape. STAGE 6: cross-check STAGE 3''s flag
    decisions against IDEA-20260816-70b60d''s re-implementation, if that proposal has run by the time
    this one does, and report agreement or divergence explicitly -- a divergence between the real library
    and a from-spec re-implementation on the SAME real file is diagnostic of which one has the defect.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full. Read IDEA-20260816-70b60d and IDEA-20260816-3edd14
      in full: 70b60d''s own assumptions list states "MD5-scale near-collision objects are an admissible
      true-positive substrate for a predicate whose declared domain is a different hash function. THIS
      IS THE WEAKEST ASSUMPTION IN THE PROPOSAL"; its discriminated_from list explicitly disclaims constructing
      an evading object and never mentions the real SHAttered/SHAmbles artifacts. 3edd14''s discriminated_from
      list explicitly states it "never runs the detector on a message at all." Web-searched cr-marcstevens/sha1collisiondetection,
      the git.git vendored copy, and the sha-mbles.github.io release page for artifact availability.'
    results: Neither of the two detector-focused proposals in this batch uses the real deployed library
      or the real public SHA-1 collision artifacts; both deliberately substitute a re-implementation
      and a synthetic (MD5-scale or purely symbolic) substrate, and 70b60d names this substitution as
      its single weakest assumption without resolving it. No proposal anywhere in ledger/proposals (grepped
      for 'shattered', 'sha-mbles', 'shambles') references the actual public artifacts.
    verdict: 'UNVERIFIED. No claim is made about whether anyone outside this program has run the deployed
      library against these public artifacts -- it is likely the original papers and the library''s
      own test suite already do exactly this, in which case this proposal partly duplicates an existing
      check and should say so once that test suite is read. What is claimed new internally: this repository
      holds no record of running the real deployed code against the real public artifacts, and no record
      of the entry-point/chunk-boundary sensitivity test, which is a genuinely different object from
      byte-level predicate error rates.'
  citations:
    - ref: "https://github.com/cr-marcstevens/sha1collisiondetection"
      provenance: retrieved
      claim: "Open-source library and command-line tool implementing Stevens' counter-cryptanalysis SHA-1 collision detection, vendored by git.git."
      verified_by: "WebSearch 2026-08-28, repository existence and description confirmed; source not yet cloned or read by this session."
    - ref: "https://sha-mbles.github.io/"
      provenance: retrieved
      claim: "Public artifact release page for the 2020 SHAmbles chosen-prefix collision (PGP key pair with divergent UserIDs)."
      verified_by: "WebSearch 2026-08-28, page existence confirmed; artifact download not yet performed by this session."
    - ref: "eprint 2017/173 (Stevens, \"Speeding up detection of SHA-1 collision attacks using unavoidable attack conditions\")"
      provenance: retrieved
      claim: "The deployed detector's performance-optimised criterion (roughly 20x faster than the naive counter-cryptanalysis check, ~1.6x slower than plain SHA-1 overall) and the explicit caveat that unavoidable conditions require ruling out feasible variant attacks or a knowledgeable adversary could bypass them."
      verified_by: "WebSearch snippet 2026-08-28; full primary text not opened. File as KN-LIT before STAGE 1, per RQ constraint."
    - ref: KN-LIT-91b680
      provenance: internal
      claim: "Survey confirms SHAttered (2017) and the SHAmbles PGP web-of-trust application (2020) as the two public chosen-prefix/identical-prefix demonstration artifacts."
      verified_by: "Read in full this session."
  object_first_candidate:
    tracked_object: 'The flag/no-flag decision on a REAL public artifact, indexed by which entry point
      (direct file hash vs. chunked streaming API at a declared boundary placement) produced it. What
      is followed is the AGREEMENT PATTERN across entry points and across the real library versus any
      re-implementation, not the artifact''s bytes themselves.'
    lossiness: 'Genuinely lossy. The projection discards the artifact''s content entirely, retaining
      only a small table of (entry point, boundary placement) -> flag outcome plus the digest-match
      sanity check. It is compatible with the detector''s operation because the flag decision is exactly
      what the library computes and reports; nothing about WHY it flags (which internal candidate position
      fired) is retained here, which is why STAGE 6''s cross-check against 70b60d''s firing-pattern-level
      re-implementation is the mechanism for recovering that detail if a divergence is found.'
    propagation: 'One step of the target operation is one library invocation at one entry point with
      one chunk-boundary placement on one artifact. It adds one row to the agreement table; the table
      is complete once all four artifacts have been run through all declared entry points and boundary
      placements, at which point the object IS the deliverable.'
    survival_score: 'The object survives as long as the library exposes a streaming API at all -- if
      it only exposes whole-file hashing, STAGE 4''s chunk-boundary question dissolves entirely and
      only STAGE 3''s single-buffer floor check remains meaningful, which is itself a reportable scope
      limit on how much of this proposal is executable rather than a failure of the design.'
  null_object_control: 'Benign files of matched byte length and, where achievable without producing
    any new collision, single-byte-flipped variants of the real artifacts that destroy the exact digest
    match. The library must not flag matched-length benign files at a materially higher rate than IDEA-20260816-70b60d''s
    independently measured benign-corpus false-positive rate; if it does, this proposal''s specific
    artifacts or entry points are producing an artifact-shape-driven flag rather than a structure-driven
    one, and the floor-check result is not attributable to near-collision structure.'
  discriminated_from:
    - 'IDEA-20260816-70b60d (detector as instrument, false/true-positive rates): re-implements the predicate
      from specification and tests it on MD5-scale synthetic near-collision objects, explicitly naming
      that substitution as its weakest assumption; this proposal runs the REAL deployed code on the
      REAL public SHA-1 artifacts, with no re-implementation and no synthetic substrate, and is designed
      to cross-check 70b60d''s re-implementation against ground truth in STAGE 6.'
    - 'IDEA-20260816-3edd14 (disturbance-vector coverage enumeration): explicitly never runs the detector
      on any message; this proposal runs the real detector on real messages and produces no symbolic
      class enumeration at all.'
    - 'RQ-SHAONE-081e3a''s own claim_tier_ceiling: no new SHA-1 collision is produced or attempted here;
      the only SHA-1 arithmetic performed is computing digests of already-existing public files to confirm
      download provenance, which is not a search for anything.'
    - 'A generic "the detector works" citation from memory: this proposal produces a concrete pass/fail
      table across real artifacts and real entry points, with a null control and a cross-check against
      a sibling re-implementation, rather than restating an unverified belief.'
  assumptions:
    - The publicly released SHAttered and SHAmbles artifacts are obtainable from their original release
      locations and their digests can be confirmed to match within each colliding pair, establishing
      download provenance without any new collision search.
    - The deployed library's build is faithful to its documented behaviour on the platform this harness
      uses; a build failure or platform-specific divergence is reported as an infrastructure outcome,
      not evidence about the detector (AGENTS.md rule 3).
    - The library exposes a streaming/update API fine-grained enough to test chunk-boundary sensitivity;
      if it only exposes whole-file hashing, STAGE 4 is reported as not applicable rather than skipped silently.
    - A single-byte flip outside the near-collision blocks (if that region is identifiable from public
      documentation) destroys the digest match without necessarily destroying near-collision structure;
      this is used only as a shape-matched null and no claim is made about what it does to the artifact's
      other properties.
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical floor check running an existing tool on existing public files, not a proof
      or a novel algorithmic ceiling claim. There is no bottleneck step, no observation-collision search,
      and no constructive transform; KN-TECH-080's apparatus does not apply.
  predictions:
    - metric: flag rate on the four real public artifacts (two SHAttered files, two SHAmbles files), direct file-hashing entry point
      direction: higher
      minimum_effect: 'predicted 4/4 flagged; any miss is the single most important outcome this proposal can produce and is reported as such rather than folded into a rate'
    - metric: agreement of flag outcome across all tested chunk-boundary placements for a given artifact
      direction: different
      minimum_effect: 'predicted full agreement (boundary-invariant); any disagreement identifies a concrete streaming-entry-point evasion surface'
    - metric: flag rate on matched-length benign null files
      direction: lower
      minimum_effect: 'predicted materially lower than the real-artifact flag rate, consistent with IDEA-20260816-70b60d''s independently measured benign false-positive rate'
    - metric: agreement between this proposal's real-library flag decisions and IDEA-20260816-70b60d's re-implementation flag decisions on the same real artifacts, if both have run
      direction: different
      minimum_effect: 'predicted full agreement; any divergence is diagnostic and reported by which side (real library or re-implementation) it favours'
  minimal_test:
    design: 'The cheapest discriminating step is STAGE 1-3 alone on the direct file-hashing entry point:
      build the real library, obtain the four real public artifacts with digest-match provenance confirmation,
      and run the single-buffer flag test. This costs no GPU and no cryptographic search, only downloading
      already-public files and running an existing open-source tool. If any real artifact is not flagged,
      the run stops there and reports that as the primary finding before any streaming/entry-point test
      is attempted. If all four are flagged, STAGE 4''s entry-point sensitivity test is the next cheapest
      addition and requires no new artifacts.'
    controls:
      - Digest-match confirmation between each colliding pair before any detector run, establishing artifact provenance.
      - Matched-length benign null files run in the same invocation.
      - Recorded library build commit/version and platform, so a future re-run can be checked for build drift.
      - Cross-check against IDEA-20260816-70b60d's flag decisions on the same real artifacts, if available.
    required_metrics:
      - flag/no-flag per artifact per entry point per boundary placement
      - digest-match confirmation result per colliding pair
      - flag rate on matched-length benign nulls
      - agreement/disagreement with the sibling re-implementation, itemised by artifact
  falsification_conditions:
    - Any of the four real public artifacts is not flagged by the real deployed library through its direct file-hashing entry point.
    - Flag outcome differs across chunk-boundary placements for the same underlying bytes, revealing a streaming-entry-point evasion surface.
    - Matched-length benign null files are flagged at a rate inconsistent with the independently measured benign false-positive rate, showing the floor check is shape-driven rather than structure-driven.
    - The real library's flag decision disagrees with IDEA-20260816-70b60d's re-implementation on the same real artifact, showing at least one of the two implementations is defective.
    - The downloaded artifacts' digests do not match within a claimed colliding pair, invalidating provenance and halting the run.
  confounders:
    - Build environment differences (compiler flags, platform) could change the library's behaviour in ways unrelated to detector design; recorded build metadata is the mitigation, not a guarantee.
    - Public artifact hosting could serve a corrupted or modified file; the digest-match confirmation is the direct check for this.
    - A streaming API's chunk-boundary semantics may not correspond to anything an attacker could actually control in a real deployment (e.g. if the calling application always delivers whole files); a positive finding here is a capability statement about the API, scoped as such, not automatically a real-world exploit.
  interpretation_limits:
    - A clean pass on four artifacts and a handful of boundary placements is a floor result at this exact scale and this exact library version; it says nothing about disturbance vectors or attack variants outside these two published instances, which is exactly the coverage question IDEA-20260816-3edd14 addresses separately.
    - Nothing here is a statement about the security of any specific deployed system, repository, or certificate, per the RQ's binding constraint.
    - A finding that the real library and a from-spec re-implementation disagree does not by itself say which one is wrong; STAGE 6 only localises the disagreement, and resolving it is separate follow-up work.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The detector's flag decision is a pure function of the final assembled message bytes, invariant
        to how those bytes were delivered to the library's API (single buffer vs. streamed at arbitrary
        chunk boundaries) -- analogous to a hash function itself being a pure function of its input
        regardless of how the caller assembled the buffer.
      rigorous_support: >-
        Not a proved theorem; it is the design expectation for any correctly implemented streaming API
        wrapping a block-based compression function, since the compression function itself only ever
        sees complete blocks regardless of how the caller chunked the input stream.
      validation_plan: >-
        Sample: all four real public artifacts, plus at least one synthetic benign file of matched length,
        at every chunk-boundary placement the library's streaming API permits (byte-at-a-time, natural
        64-byte block alignment, and at least two deliberately misaligned placements). Shortcut: none
        needed; this is direct execution of an existing tool, not a sampling problem requiring a correspondence
        for scale. Comparison: exact agreement across all placements is the predicted distribution (a
        point mass on "flagged" or "not flagged," not a probability distribution), so the check is agreement/disagreement
        rather than a statistical test. Tail check: the deliberately misaligned placements are the adversarial
        tail of this small sample and are exactly where a violation of H1, if one exists, is expected to show up first.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a small pass/fail table over real artifacts and entry points.
    memory_exponent: No attack memory exponent is claimed. Memory cost is that of hashing four small files, negligible.
    best_known: >-
      The incumbent is the unstated assumption that the deployed detector's coverage claims, tested
      elsewhere in this batch by re-implementation and synthetic substrates, transfer without gap to
      the real deployed code running on the real public artifacts -- an assumption 70b60d itself names
      as its weakest link without resolving it. This proposal is the direct, cheap resolution.
    hidden_overhead: >-
      Obtaining and verifying provenance of the real public artifacts (rather than reconstructing them,
      which would violate the no-new-collision constraint) is the one part of this design that depends
      on external hosting availability and is reported as an infrastructure outcome if it fails, per AGENTS.md rule 3.
    tradeoff_note: not applicable; no time-memory tradeoff is exercised by running an existing tool on existing files.
  dominated_by: >-
    n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable is a
    grounding floor check using real, already-public artifacts and places no new point on any attack
    frontier; it is a precondition for trusting the other detector proposals in this batch rather than
    a competing result.
  sota_delta: >-
    No attack; conceptual/measurement contribution only. Quantitatively: the repository moves from
    zero runs of the actual deployed detection library against the actual public SHA-1 collision artifacts
    to a concrete pass/fail table across artifacts and entry points, a digest-match provenance check,
    a benign-null control, and an explicit cross-check against a sibling re-implementation's output
    on the same real files.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    Separable parts. (1) That the real artifacts are obtainable and digest-verifiable: about 0.85, since
    they are long-published and mirrored in multiple places, with the main risk being link rot at any
    single source. (2) That the real deployed library builds and runs on this harness's platform: about
    0.8. (3) That all four artifacts are flagged (the expected, well-known outcome): about 0.9 -- a miss
    here would be surprising and would immediately become this program's most important SHA-1 finding.
    (4) That the streaming API exists and exposes a genuine chunk-boundary sensitivity test: about 0.4,
    since many hashing libraries only expose whole-buffer or fixed-chunking interfaces, in which case
    STAGE 4 degrades gracefully to not_applicable. Composite for the full four-part design roughly 0.24;
    the minimal STAGE-1-3 test alone succeeds with probability near 0.7 and is nearly free to run.
