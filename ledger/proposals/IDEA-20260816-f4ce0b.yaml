idea:
  id: IDEA-20260816-f4ce0b
  question_id: RQ-MLKEM-003
  added: '2026-08-16'
  title: Represent the structure discount by the size of the instance's coefficient-isometry orbit
    rather than by the name of its ring, and test whether the discount obeys an amortisation law in
    that one integer across rings chosen to vary orbit size at fixed degree
  class: representation
  claim: '(A) KN-OPEN-026 describes the 2026 mechanism as amortisation of expensive preprocessing
    across symmetry-derived instances, and observes that this program''s own analogy to index calculus
    and to automorphism speedups is the program''s analogy and appears in none of the sources. If
    the amortisation reading is right, then the discount should be a function of ONE integer - the
    number of derived instances the symmetry supplies - and not of which ring supplied them. The object
    tracked here is that integer: g(I), the size of the orbit of instance I under the group of coefficient
    isometries acting on its ring, computed exactly from the ring''s structure. (B) The claim is that
    g is manipulable independently of the ring degree, because rings of the same degree can have coefficient-isometry
    groups of different sizes, and that this makes the amortisation reading falsifiable in a way no
    bit-count comparison is. The prediction is a law: the log of the discount is linear in log g with
    a slope near 1 if the discount is pure amortisation across orbit members, near 0 if the discount
    is a property of the ring that has nothing to do with orbit size, and anywhere between if amortisation
    is partial. Measuring the slope requires only running the recovery observable on instances with
    matched degree and different g. (C) The entry names the honest failure mode in advance: rings
    of equal degree with sufficiently different g may not be constructible within the reachable dimension
    band using only pure-Python arithmetic, in which case the design collapses to two points and the
    slope is unfittable. That outcome is reported as a construction obstruction with the attempted
    rings named. (D) NOT CLAIMED: no attack, no bit figure, no claim that the amortisation reading
    is correct, no claim that this program''s index-calculus analogy is real, no statement about deployed
    parameters, and no assertion about the contents of any source.'
  mechanism: 'STAGE 1. Enumerate, at each degree d in the reachable band, the rings Z[X]/(f) available
    with f from a stated family - cyclotomic of degree d, and non-cyclotomic monic f of the same degree
    with a computable automorphism count - and compute g exactly for each as the order of the group
    generated by the coefficient isometries the ring admits. Every g is computed, not assumed, and
    the computation is exhibited. STAGE 2. Build matched instances at fixed n = k*d across rings of
    differing g, holding q, m, secret law and error law identical and using the same secret pattern
    where the rings'' coefficient spaces allow it. STAGE 3. Run the recovery observable - progressive
    BKZ plus Babai to exact recovery against retained ground truth - in each ring''s arm and in the
    matched unstructured arm, obtaining a discount per ring. STAGE 4. Regress log discount on log
    g across rings at fixed d. STAGE 5. Run the orbit-inert null: an instance in a ring whose isometry
    group is declared of size g but whose isometries are broken by a seeded perturbation of the modulus
    polynomial''s coefficients, so that g is nominally present and operationally absent. STAGE 6.
    Report the slope with its interval and the null''s slope. Refutation: a slope indistinguishable
    from zero across a range of g is a measured statement that orbit size does not organise the discount
    at these parameters.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rilE 'module.structure|structure discount|ring structure|coefficient isometr' ledger/proposals/;
      grep -rilE 'estimator.*(disagree|instrument)|instrument.*estimator' ledger/proposals/. Read
      KN-OPEN-026 in full, in particular the 'Why it matters' paragraph containing the index-calculus
      analogy and its explicit disclaimer. Read titles and claim heads of IDEA-20260805-530869, IDEA-20260807-9ecc6f,
      IDEA-20260807-d329e2.
    results: The corpus has a rich orbit-and-quotient literature on the ECDLP side and none on the
      lattice side. IDEA-20260807-9ecc6f closes a cost-model question by showing that the commutant
      of a finite abelian group acting on a phi-stable factor base is a product of full matrix algebras,
      that the available saving is g in relations and g^2 in linear algebra, that block-diagonalisation
      and orbit-quotienting are the same saving and must not be multiplied, and that g <= 3 on the
      x-coordinates of any prime-field curve. That record is the corpus's clearest statement that
      an orbit size is the right variable for an amortisation saving - and it is about factor bases,
      not lattices. IDEA-20260807-d329e2 indexes a factor base by an automorphism-quotient coordinate.
      On the lattice side, IDEA-20260805-530869 uses the ring's commuting structure as a forced calibration
      value but not as a varied quantity. No record found varies orbit size at fixed degree in a lattice
      instance.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature, and in particular nothing
      is asserted about whether any source frames the discount as amortisation over an orbit - KN-OPEN-026
      states that the index-calculus correspondence is this program''s own analogy and appears in
      none of its sources, and this entry inherits that disclaimer rather than weakening it. Claimed
      new relative to this repository: transporting the orbit-size variable that IDEA-20260807-9ecc6f
      establishes for factor bases to a lattice instance, and making the transport falsifiable by
      varying g at fixed degree. Assembled from known parts: that record''s g-saving accounting, the
      matched generator of IDEA-20260805-530869, and the recovery observable used elsewhere in this
      batch.'
  object_first_candidate:
    tracked_object: g(I), the exact order of the group of coefficient isometries acting on the ring
      underlying instance I, computed from the modulus polynomial; and the pair (log g, log discount)
      per ring at fixed degree.
    lossiness: 'Genuinely lossy, and this is the entry''s whole point. The full state of a structured
      instance includes the ring''s entire multiplicative structure - its factorisation of q, its
      Galois group, its unit group, its geometry of numbers. g retains a single integer and discards
      all of it. The discard is compatible with the operation of interest if and only if the amortisation
      reading is right, because amortisation across derived instances depends on how many derived
      instances there are and not on what makes them derived. That conditional is the falsifiable
      content: if the discount is organised by g alone, the projection is legitimate and the law holds;
      if two rings with equal g show different discounts, the projection has thrown away something
      the operation needed, which is a clean refutation of the amortisation reading at these parameters
      and is a more informative outcome than confirmation.'
    propagation: One step of the target operation is applying one coefficient isometry to the instance.
      Under that step the public matrix is conjugated to another matrix in the same orbit, the secret
      is carried to another secret of the same shape, and any preprocessing already performed - a
      reduced basis in particular - is carried along with it at negligible cost. So one step produces
      one new instance at which the accumulated preprocessing is reusable, and after g steps the orbit
      is exhausted. The amortisation reading is exactly the statement that the effective preprocessing
      budget is multiplied by g, and the propagation law is therefore that log discount should advance
      by log g.
    survival_score: The design survives only where rings of equal degree with materially different
      g are constructible and where recovery is reachable. At degree 16 the cyclotomic ring supplies
      a large isometry group while a generic monic modulus of the same degree supplies a small one,
      giving at least two well-separated g values; whether a third intermediate value is constructible
      in pure Python at n <= 48 is the open construction question and is the boundary. The object
      therefore survives to at least two points at d in {8, 16} and dissolves as a fittable law if
      only two points exist, in which case the entry reports a two-point contrast with its interval
      and explicitly declines the slope.
  null_object_control: 'The orbit-inert null, executed in the same invocation: an instance built over
    a modulus polynomial perturbed by a seeded change of one coefficient, chosen so that the polynomial
    retains its degree and its irreducibility but its coefficient-isometry group collapses to the
    trivial one, while the instance''s dimension, modulus, secret, error and sample count are unchanged.
    Nominal g is recorded as the unperturbed value and operational g is 1. The null must show the
    discount collapsing to that of the matched unstructured arm; if the discount survives when the
    isometries do not, the effect is not amortisation over the orbit and every slope fitted on the
    signal arm is an artifact, recorded as a controlled null under inventor-protocol section 3. A
    second control confirms the g computation itself by exhibiting, for each ring, g explicit isometries
    and verifying they form a group of the stated order under composition.'
  discriminated_from:
  - 'IDEA-20260807-9ecc6f: establishes for factor bases that the orbit-quotient saving is g in relations
    and g^2 in linear algebra, and closes a cost-model question with an obstruction. That record is
    about the ECDLP and about a commutant algebra; this transports the variable to a lattice instance
    and makes it an experiment. The transport is asserted to be worth testing, not asserted to be
    valid.'
  - 'IDEA-20260805-530869: uses the ring''s commuting structure as a forced calibration value in a
    matched-null instrument; g is not varied there and no law is proposed.'
  - 'The matched-discount and sparsity entries in this same batch: those vary dimension and sparsity
    with the ring fixed. This varies the ring''s orbit size at fixed dimension and degree, which is
    the only manipulation that can separate ''structure helps'' from ''orbit size organises how much''.'
  - 'KN-OPEN-026''s index-calculus correspondence: explicitly labelled there as this program''s own
    analogy, present in none of its sources. This entry tests one measurable consequence of that analogy
    and does not assume it.'
  - 'NTRU ring-structure work: excluded by construction. No NTRU instance, no convolution modulus,
    and no overstretched regime appears in this design.'
  assumptions:
  - g can be computed exactly from the modulus polynomial for every ring in the stated family, and
    the computation is exhibited by listing generators and verifying closure.
  - Rings of equal degree with materially different g are constructible within the reachable band;
    if not, the entry reports a construction obstruction naming the rings attempted.
  - Matching instances across rings at fixed n, q, m and error law is meaningful even though the rings
    differ; the secret is matched by coefficient vector where the coefficient spaces are identified,
    and the identification is stated.
  - The recovery observable is comparable across rings, which requires that the primal embedding be
    constructed identically; the embedding is fixed and recorded.
  - A law fitted over the available g values carries no implication for rings outside the family or
    for dimensions above the band.
  predictions:
  - metric: slope of log2(discount) against log2(g) across rings at fixed degree
    direction: different
    minimum_effect: 'refusal to pre-commit on a value: the amortisation reading predicts a slope near
      1 and the ring-property reading predicts near 0, and both are live, so pre-committing would
      decide the question. An interval excluding zero is the threshold for reporting a dependence
      on g.'
  - metric: discount in the orbit-inert null arm, relative to the matched unstructured arm
    direction: different
    minimum_effect: 'forced value: 1.00, interval must contain 1. A surviving discount with the isometries
      broken refutes the orbit reading directly.'
  - metric: number of distinct g values realised at a single degree within the reachable band
    direction: higher
    minimum_effect: 2
  - metric: residual spread of log2(discount) among rings with equal g
    direction: lower
    minimum_effect: 0.15
  minimal_test:
    design: One degree, two rings, three arms. Fix d = 16, k = 2, n = 32, q = 3329, m = 2n, eta =
      2, blocksize ceiling 24. Choose ring A cyclotomic of degree 16 with its full coefficient-isometry
      group, and ring B a monic irreducible degree-16 modulus whose isometry group is verified trivial.
      Compute and exhibit g for both. Draw 60 seeds; at each, build the ring-A instance, the ring-B
      instance, the matched unstructured arm shared by both, and the orbit-inert null derived from
      ring A by the seeded coefficient perturbation. Run the recovery observable on all four in the
      same invocation. Report the discount per ring against the shared unstructured arm, the two-point
      contrast in g, and the orbit-inert null's discount. This is the cheapest design that discriminates
      because the entire claim is that discount tracks g, and two well-separated g values at fixed
      degree with a shared denominator and an inert null is the smallest configuration in which that
      claim can fail cleanly.
    controls:
    - 'Orbit-inert null: ring A''s modulus perturbed to collapse the isometry group while preserving
      degree and irreducibility.'
    - 'Shared unstructured denominator: one matched unstructured arm per seed, used as the denominator
      for every ring''s discount so that ring comparisons do not inherit denominator noise.'
    - 'g-verification control: for each ring, g explicit isometries exhibited and verified closed
      under composition.'
    - 'Equal-g replication: where two distinct moduli with the same g exist, both are run, and their
      discount spread bounds the law''s residual.'
    - Zero-error positive control in every ring, where recovery must succeed at minimal blocksize.
    required_metrics:
    - g per ring, with generators exhibited and closure verified
    - beta* or censoring per (seed, ring, arm)
    - discount per ring against the shared unstructured denominator
    - slope of log2 discount against log2 g with interval, where three or more g values exist
    - discount in the orbit-inert null arm
    - residual spread among equal-g rings
    - censoring fraction per arm
  falsification_conditions:
  - 'The orbit-inert null retains a discount: the effect is not amortisation over the isometry orbit
    and every slope is an artifact.'
  - 'Two rings with verified equal g show discounts differing by more than the stated residual: g
    does not determine the discount and the projection to a single integer has discarded something
    the operation needed - a clean refutation of the representation.'
  - 'Fewer than two distinct g values are constructible at any reachable degree: the design cannot
    run and reports a construction obstruction with the rings attempted named.'
  - 'g verification fails - the exhibited isometries do not close into a group of the stated order:
    every g is wrong and the design is void.'
  - 'The slope interval contains zero across the realised g range: orbit size does not organise the
    discount at these parameters, refuting the entry''s motivating expectation and supplying a measured
    obstruction.'
  - 'Censoring dominates in the non-cyclotomic ring arm only: the comparison is confounded by ring-dependent
    reachability rather than by g.'
  confounders:
  - Rings of equal degree differ in far more than g - splitting behaviour of q, unit group, geometry
    - so any dependence found could track a co-varying property; the equal-g replication control is
    the only defence and it is partial.
  - The primal embedding may behave differently across moduli even when constructed identically, introducing
    a ring effect unrelated to isometries.
  - The coefficient perturbation defining the inert null slightly changes the lattice, so the null
    differs from ring A in more than its isometries; the perturbation size is recorded and minimised.
  - Non-cyclotomic moduli may have larger coefficient growth, making pure-Python arithmetic slower
    and censoring more frequent in one arm.
  - With only two g values a slope is a line through two points and any residual is unmeasurable;
    this is why the equal-g replication exists.
  interpretation_limits:
  - A law fitted over two or three g values at one degree is a two- or three-point contrast and must
    not be described as an established scaling law.
  - The design tests one measurable consequence of the amortisation reading; confirming it would not
    establish the reading, and KN-OPEN-026 records that the index-calculus correspondence is this
    program's own analogy.
  - Ring-to-ring comparison is intrinsically confounded and the entry's strongest honest claim is
    conditional on the equal-g replication.
  - Nothing here bears on ML-KEM, on FIPS 203 parameters, on any FHE scheme, or on any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The design's cost is O(rings * seeds * BKZ) counted
      operations, with the g computation negligible.
    memory_exponent: No attack memory exponent is claimed. One basis of O(n^2) integers per instance.
    best_known: No incumbent attack is challenged. The nearest incumbent statement is IDEA-20260807-9ecc6f's
      accounting for factor bases - saving g in relations and g^2 in linear algebra, with block-diagonalisation
      and orbit-quotienting being the same saving - which this entry treats as the hypothesis being
      transported, not as an established result about lattices.
    hidden_overhead: 'Constructing non-cyclotomic moduli of a given degree with verified trivial isometry
      group, and confirming irreducibility over the relevant ring, is the hidden human cost and it
      is substantial in pure Python. Also hidden: the ring-to-ring confounding is not reducible by
      more compute, so the entry''s ceiling is set by how many equal-g replicates can be constructed,
      which is a mathematics problem rather than a budget problem.'
  dominated_by: n/a (no result claimed). Checked against every structure-related frontier row this
    corpus records - KN-OPEN-026's relayed bit figures, KN-TECH-046's class-group line at exp(Otilde(sqrt(n))),
    IDEA-20260807-9ecc6f's g and g^2 factor-base accounting, and the matched-null instrument of IDEA-20260805-530869
    - and none is a cost frontier this entry sits on, because the deliverable is a slope relating
    two logs and not a cost.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a two- or three-point
    contrast between orbit size and measured discount, an orbit-inert null, and an equal-g residual
    bound.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: low
  honest_prior_of_survival: 'Four separable parts, deliberately separated because they fail independently.
    (i) That g can be computed and verified for the candidate rings: about 0.85, this is elementary.
    (ii) That at least two well-separated g values are constructible at one degree within the band:
    about 0.6, and this is the design''s binding risk. (iii) That the orbit-inert null collapses the
    discount as required: about 0.5, since the perturbation changes more than the isometries and the
    null may be dirty. (iv) That a dependence of discount on g survives the equal-g replication: about
    0.15, and I decline to raise it, because ring-to-ring confounding is severe and the most likely
    honest outcome is a contrast that cannot be attributed to g. Priority is set low for exactly that
    reason, despite the question''s interest.'
