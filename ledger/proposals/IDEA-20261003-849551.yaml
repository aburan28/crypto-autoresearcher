# IDEA-20261003-849551
# Jacobian storage count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-849551
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A Jacobian point stores 3 field elements and an affine point stores 2
  class: representation
  claim: >-
    A Jacobian point stores 3 field elements. An affine point stores 2.
    Three exceeds two by 1, and the product of the two storage counts
    is 6. Their sum is 5. The gap is a representation cost, not an
    ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R1 is the stored coordinate tuple. The operation
    set is the group law written on that tuple. A Jacobian triple
    carries a homogenizing coordinate that an affine pair does not.
    Dropping that coordinate changes storage and does not by itself
    change the group order. This is not an x-only ladder and not a
    division-count comparison.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base dimension is a different lever from coordinate storage.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two storage layouts are frozen before the count.
    - No scalar is recovered.
  proof_search_map:
    bottleneck: The storage gap of 1 field element.
    baseline_embedding:
      parameter_slice: The counts 3 and 2.
      reproduction_check: >-
        Two readers subtract and must agree that 3 exceeds 2 by 1.
    observation_collision:
      observable: The storage gap and the product.
      distinct_preimage_search: >-
        Reporting both layouts as storing 3 elements drops the gap.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The affine pair.
        predicted_gain: One fewer stored field element. No exponent.
    quantifier_order: >-
      The layouts are fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The storage gap 1. Not a group-law runtime.
      nearby_object_control: >-
        Two Jacobian points. Both store 3, and the gap is 0.
    proof_obligations:
      - claim: The Jacobian point stores 3 field elements.
        responsibility: size
      - claim: The affine point stores 2.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: storage_gap
      direction: different
      minimum_effect: Three exceeds two by 1.
  minimal_test:
    design: >-
      Count stored field elements in the two frozen layouts. Do not
      run a group law.
    controls:
      - Two Jacobian points, whose gap is 0.
      - An independent count.
    required_metrics:
      - both storage counts
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two counts is not 6.
  confounders:
    - A sign bit or a point-at-infinity flag is an extra stored bit, not a field element.
  interpretation_limits:
    - Storage is not runtime.
    - No transfer to a cryptographic group law.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen Jacobian layout stores three coordinates and the
        frozen affine layout stores two.
      rigorous_support: >-
        No group-law theorem is claimed. The count is a reading of
        two layouts.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Three field elements versus two, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Flags and the point at infinity.
    tradeoff_note: Fewer stored elements can cost an inversion.
