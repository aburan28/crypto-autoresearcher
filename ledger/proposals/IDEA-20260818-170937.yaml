  minimal_test:
    design: >-
      THREE STAGES, STRICTLY ORDERED, EACH ABLE TO STOP THE NEXT.
      STAGE A (ZERO COMPUTE, HOURS). Primary-read the Biasse-Fieker degree
      threshold and the relative-discriminant tower formula. Recompute the
      Budget 1 feasible region with the read threshold. Run the baseline
      reproduction fixture (must return c = sqrt(2) at candidate exponent 1/2).
      Run Null 1, the degree-r control. STOP if the reproduction fixture or
      Null 1 fails.
      STAGE B (LOW COMPUTE, DAYS). Instrument an existing index-calculus
      implementation to log one scalar per relation trial: log N(b), plus
      whether the trial succeeded and the largest prime factor found. Collect
      >= 10^6 trials at each of |D| ~ 2^{64}, 2^{96}, 2^{128}, 2^{160}. Compare
      the candidate-size distribution against the Budget 2 prediction and
      against Null 2; compare the smoothness rate against rho(u) and against
      Null 3. Report the empirical CDF of log(largest prime factor)/log N(b)
      against Dickman-de Bruijn, with a dedicated zoom on the smoothest 500
      samples per |D| as a tail-consistency check.
      STAGE C (ZERO COMPUTE, DAYS). Write the enumeration of relation sources
      outside class C, each with the specific external construction it would
      need and the specific budget it evades, at the closure standard of
      docs/inventor-protocol.md section 4: named obstruction, argument, forward
      guidance.
    controls:
      - Null 1 degree-r control on the argument (Stage A, blocking).
      - Baseline reproduction fixture returning sqrt(2) (Stage A, blocking).
      - Null 2 random-lattice null for the candidate-size distribution.
      - Null 3 shuffled-smoothness null for the smoothness rate.
      - >-
        RELATION-SOURCE CONTROL: Stage B is run against at least two relation
        sources (random exponent vectors, and sieving) so the expected
        observation collision is measured rather than assumed.
      - >-
        Discriminants drawn as prime D = -p, p = 3 mod 4, matching the deployed
        convention, with >= 3 discriminants per size so per-size dispersion is
        visible.
    required_metrics:
      - Recomputed Budget 1 feasible region with the primary-read threshold.
      - Empirical CDF of log N(b) normalized by (1/2)ln|D|, per |D|, per source.
      - Tail probabilities P[log N(b) < delta ln|D|] at delta in {0.1,...,0.4}.
      - Realized smoothness rate versus rho(u), with the smoothest-500 tail check.
      - Null 2 and Null 3 comparison statistics with confidence intervals.
      - Exponent returned by the degree-r control.
      - The enumeration, with >= 4 entries.
      - Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
      The primary-read Biasse-Fieker degree threshold is materially weaker than
      the search-summary version and opens a non-empty feasible region at
