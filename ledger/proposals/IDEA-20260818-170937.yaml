  obstruction:
    statement: >-
      A CLAIM ABOUT THE OBJECT: for imaginary quadratic discriminants, the
      integer submitted to each smoothness test in index-calculus relation
      generation is the norm of a reduced ideal and is therefore confined to
      [1, sqrt(|D|/3)] with counting measure essentially uniform on that
      interval, so the per-trial probability of drawing a candidate of size
      |D|^{delta} is at most |D|^{delta-1/2+o(1)}. The exponent 1/2 in
      L_{|D|}[1/2, c] is the shadow of the ideal lattice having rank 2, i.e. of
      the field degree being 2.
    quantity: >-
      tail_mass(delta) := P[ log N(b) <= delta * ln|D| ] over relation trials,
      measured per discriminant per relation source; and the derived margin
      ratio tail_mass(delta) / rho(u_bulk), the factor by which the small-norm
      route is worse than the bulk route.
    value: >-
      NOT MEASURED. Predicted |D|^{delta-1/2+o(1)} by the derivation in
      `mechanism`; the derivation is NOT a measurement and this field must be
      filled from Stage B runs with bootstrap intervals, never from the
      prediction.
    measured_by: []
    scope: >-
      To be stated as: prime discriminants D = -p with p = 3 mod 4 at the four
      tested sizes, the two named relation sources, the named implementation and
      version, and the trial counts. Claimed for no other relation source, no
      other discriminant family, and explicitly NOT for sources given
      D-dependent advice or preprocessing.
    resource_check:
      examined: true
      reading: >-
        READ THE OTHER WAY ROUND, AND IT TAKES. (1) The statement "candidate
        size is pinned at |D|^{1/2} because rank = degree = 2" is the HYPOTHESIS
        of a lower-bound argument in the generic-relation model: it says any
        relation source that must exhibit a short vector of a rank-2 lattice
        pays a fixed price, which is exactly the shape of a query-complexity
        lower bound for a restricted class of index-calculus algorithms. That is
        a theory this program does not currently have and could build, and it
        would be a first: a conditional LOWER bound on class-group computation
        over a named algorithm class, rather than another upper bound.
        (2) The same measure statement is the hypothesis of a SAMPLING result:
        "reduced-ideal norms are near-uniform on [1, sqrt(|D|/3)]" is precisely
        the distributional input that a rigorous ideal-sampling analysis needs,
        and ePrint 2025/1514 builds its Part 1 around supplying exactly such
        statements provably. A measured version at cryptographic-adjacent sizes
        is a data point for or against the constants in that line of work.
        (3) Budget 1's inequality |disc L| >= |D|^{[L:K]} read as a resource
        says: the ONLY extensions that do not inflate the discriminant beyond
        the budget are UNRAMIFIED ones, i.e. subfields of the Hilbert class
        field -- whose degree is h(D) and whose construction presupposes the
        answer. That circularity is itself a structural statement worth
        recording, and it points at ring class fields and CM theory as the place
        where the circularity might be broken by a different presentation of the
        same field.
      spawned_ids: []

  forward_guidance: >-
    RELATION SOURCES OUTSIDE CLASS C, i.e. the classes that remain open after
    both budgets. Each is named with the budget it evades and the external
    ingredient it would need. NONE IS CLAIMED TO WORK.
    (F1) HIGHER-RANK LATTICES NOT COMING FROM FIELD EXTENSIONS. Binary cubic
    forms of discriminant D (Davenport-Heilbronn / Belabas) carry a rank-4
    lattice attached to D itself, with a map to Cl(D)[3] rather than to Cl(D).
    Evades Budget 1 (no field extension, no discriminant inflation) but supplies
    only 3-torsion information. See IDEA-20260818-0b933f.
    (F2) CM AND THE DEURING CORRESPONDENCE. Cl(D) acts simply transitively on
    elliptic curves with CM by O_D; relations can be read from isogeny volcanoes
    without any smoothness test at all. Evades Budget 2 entirely. Known cost is
    at least h(D) operations, so no exponent gain is known -- but the SOURCE is
    outside the model and this is the most structurally different candidate.
    (F3) TRACE-FORMULA / HURWITZ CLASS NUMBER RELATIONS. Eichler-Selberg-type
    identities give LINEAR relations among class numbers of MANY discriminants
    simultaneously. Evades both budgets; is a tabulation-scale rather than
    single-instance tool, so it attacks the cost of a SWEEP rather than of one
    D. Directly relevant to this RQ's measurement programme even if it never
    becomes an attack.
    (F4) PREPROCESSING / D-DEPENDENT ADVICE. The quantifier order above
    explicitly excludes sources allowed to depend on D. The Pellet-Mary-Hanrot-
    Stehle-style preprocessing paradigm for ideal lattices is the model:
    expensive one-time work on D, cheap queries afterwards. For a DEPLOYED
    hidden-order group the discriminant is FIXED AND PUBLIC FOR YEARS, which
    makes the preprocessing model the realistic adversary model and makes this
    the most deployment-relevant open class of the four.
    (F5) THE RIGOROUS IDEAL-SAMPLING PRIMITIVE OF ePrint 2025/1514 applied not
    to smooth ideals but to NEAR-PRIME ideals, described there as "a dense
    family of efficiently factorable ideals". This is the rigorous form of the
    large-prime variation; RECALLED expectation is that large-prime variations
    move constants and not exponents, and that expectation should be checked
    rather than assumed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (GRH / ERH.) The Generalized Riemann Hypothesis holds for the relevant
        Dirichlet and Hecke L-functions. Used for: the Bach-type bound that
        prime forms of norm at most 6(log|D|)^2 generate Cl(D), so that a
        polylogarithmic factor base suffices; the proved constant 3/sqrt(8) for
        Hafner-McCurley; and the analytic pinning of h(D) used by any
        certificate.
      rigorous_support: >-
        Unproved. Rigorous companion: unconditional versions exist with strictly
        worse bounds, so GRH's contribution is quantifiable. NUMBERED HERE
        RATHER THAN LEFT IN PROSE because every complexity statement in this
        record inherits it and every corollary must restate it.
      falsification_condition: >-
        Not falsifiable by this experiment. What is testable: whether a factor
        base bounded by the Bach bound in fact generates Cl(D) at the tested
        discriminants, checked by verifying that the computed group order
        matches the analytic estimate to within the ERH interval. A mismatch at
        a tested D is a bug or an ERH-bound violation and must be investigated
        as the former first.
      validation_plan: >-
        SAMPLE: the >= 12 discriminants of Stage B. COMPARISON: computed h
        against the truncated-Euler-product estimate with the ERH error term.
        TAIL CHECK: the discriminant with the largest relative deviation.
        TRANSFER: none.
    - id: H2
      statement: >-
        (SMOOTHNESS OF REDUCED-IDEAL NORMS.) For a uniformly random ideal class
        of a prime discriminant D = -p, the norm N(b) of its reduced
        representative is B-smooth with probability rho(u)^{1+o(1)},
        u = log N(b)/log B, uniformly for u in ((log|D|)^eps, (log|D|)^{1-eps})
        -- i.e. N(b) behaves like a uniformly random integer of its size with
        respect to smoothness.
      rigorous_support: >-
        THE EXEMPLAR PATTERN, INSTANTIATED. Rigorous size ingredient: Gauss
        reduction confines N(b) to [1, sqrt(|D|/3)], and the count of reduced
        ideals of norm at most Y is O(Y^{1+eps}). Classical distribution
        theorem imitated: Canfield-Erdos-Pomerance,
        Psi(X,B) = X u^{-u(1+o(1))}. The assumption asks only that this
        particular integer, arising from reduction theory rather than at random,
        is not smoothness-atypical for its size.
      falsification_condition: >-
        Realized smoothness rate differs from rho(u) by more than 15 percent
        systematically across three consecutive u values, OR differs from the
        shuffled-smoothness null (Null 3) beyond sampling error, at any tested
        discriminant. Either direction falsifies; the two directions have
        opposite security significance and both must be reported.
      validation_plan: >-
        SAMPLE: >= 10^6 relation trials at each of |D| ~ 2^{64}, 2^{96},
        2^{128}, 2^{160}, across >= 3 prime discriminants each, from two
        relation sources. SHORTCUT THAT MAKES SCALE REACHABLE: no full class
        group computation is required -- only the reduce-and-factor step, which
        is cheap and can be run at discriminant sizes well beyond where the full
        computation completes, so this heuristic can be validated at sizes the
        cost-curve programme cannot reach. COMPARISON: empirical CDF of
        log(largest prime factor of N(b))/log N(b) against Dickman-de Bruijn
        rho. TAIL CHECK: the 500 smoothest samples per discriminant, with their
        observed smoothness bound against the rho-predicted probability, in the
        style of the exemplar's Section 4.2. TRANSFER ASSUMPTION, STATED: that
        behaviour at 2^{160} transfers to deployed sizes. UNJUSTIFIED, and
        recorded as unjustified.
    - id: H3
      statement: >-
        (NEAR-UNIFORM NORM MEASURE.) For prime discriminants D = -p, the
        counting measure on reduced ideals induces a distribution on
        log N(b)/((1/2)ln|D|) whose mass below any delta < 1/2 is at most
        |D|^{delta-1/2+o(1)}.
      rigorous_support: >-
        Rigorous ingredient: the number of reduced forms of discriminant D with
        leading coefficient at most Y is O(Y^{1+eps}), while h(D) =
        |D|^{1/2+o(1)} by the analytic class number formula with the ERH bound
        on L(1, chi_D). The heuristic content is only the uniformity of the
        o(1) and the absence of arithmetic bias in the family D = -p.
      falsification_condition: >-
        Measured tail mass exceeds |D|^{delta-1/2} by a factor growing with |D|
        at any tested delta.
      validation_plan: >-
        SAMPLE: reduced representatives of >= 10^6 uniformly sampled classes per
        discriminant (sampled by taking random products of small prime forms and
        reducing; the mixing of that walk is itself assumed and is checked
        against Null 2). COMPARISON: measured tail masses at delta in
        {0.1,0.2,0.3,0.4} against |D|^{delta-1/2}. TAIL CHECK: the single
        smallest N(b) observed per discriminant against its predicted
        probability. TRANSFER: none beyond tested sizes.
    - id: H4
      statement: >-
        (RANDOM-WALK MIXING FOR CLASS SAMPLING.) Products of O(log|D|) uniformly
        chosen prime forms of norm at most the Bach bound are distributed
        statistically close to uniform on Cl(D).
      rigorous_support: >-
        Rigorous companion: the rapid-mixing theorem for random walks on the
        Arakelov class group of de Boer-Ducas-Pellet-Mary-Wesolowski, under the
        Riemann Hypothesis for Hecke L-functions, and its use in ePrint
        2025/1514's Corollary 6.5 to obtain near-uniformity in the Arakelov ray
        class group via a discrete prime-multiplication step plus a continuous
        Gaussian distortion. NOT PRIMARY-READ for the imaginary quadratic
        specialization, and the constants are unchecked.
      falsification_condition: >-
        The empirical distribution of a measurable class invariant (for example
        the genus character values, which are computable without knowing Cl(D))
        over walk endpoints deviates from uniform beyond sampling error at any
        tested walk length.
      validation_plan: >-
        SAMPLE: 10^6 walk endpoints per discriminant per walk length in
        {4, 8, 16, 32}. COMPARISON: chi-squared of genus character value
        distribution against uniform. TAIL CHECK: the least-represented genus
        class. TRANSFER: none. NOTE: for prime D = -p the genus group is
        trivial, so this check must be run on an auxiliary non-prime
        discriminant family where genus characters are non-trivial, and the
        transfer from that family to D = -p is itself an assumption and is
        recorded as one.

  target_complexity:
    time_exponent: >-
      TARGET IF BUDGET 1 IS FALSIFIED: L_{|D|}[1/3, c'] for class group
      computation of imaginary quadratic orders, against the incumbent
      L_{|D|}[1/2, c]. At a 1024-bit |D| that is exp(c' * 82.9 * ...) against
      exp(c * 68.3) -- NOTE CAREFULLY that at d = 709.8 the quantities
      d^{1/3}(ln d)^{2/3} = 8.92 * 3.53 = 31.5 and d^{1/2}(ln d)^{1/2} = 68.3
      differ by only a factor 2.2, so even a successful L(1/3) would move
      roughly 60-70 bits at 1024, not orders of magnitude -- the exponent
      matters asymptotically and the constants would decide the deployed case.
      THIS RECORD'S OWN EXPECTED OUTCOME IS THAT BUDGET 1 HOLDS and no exponent
      moves; the deliverable is then the quantified obstruction plus the
      enumeration, which is a legitimate first-class result under
      docs/inventor-protocol.md section 4 but is NOT an exponent claim.
    memory_exponent: >-
      Unchanged in the falsification branch: index calculus at L[1/2,c] time
      carries L[1/2,beta] memory for the factor base and relation matrix (see
      IDEA-20260818-ffeddf, which measures beta). An L(1/3) route would carry
      L[1/3, .] memory of the same shape. The record's own experiment (Stage B)
      is memory-trivial: it logs one scalar per trial and needs no matrix.
    best_known: >-
      FRONTIER ROWS CHECKED. Classical imaginary quadratic: Hafner-McCurley
      L[1/2, sqrt(2)] proved; Biasse-Erukulangara L[1/2, 3/sqrt(8)] proved under
      GRH; sieving/large-prime variants at the same exponent (RECALLED);
      de Boer-Pellet-Mary-Wesolowski Thm 1.3 (ERH) L_{|D|}(1/2) for fixed
      degree, retrieved by primary read, explicitly NOT an improvement for
      imaginary quadratic. Generic: Booker |D|^{1/4} under GRH with polynomial
      memory, |D|^{1/2} unconditional; Sutherland generic order
      O((N/loglog N)^{1/2}). Large degree: Biasse L(1/3), Biasse-Fieker
      L(1/3+eps) / L(1/3) -- NOT APPLICABLE at degree 2, and Budget 1 is the
      price of making it applicable. Quantum: Hallgren polynomial time for
      quadratic fields, dominating every row above on time.
    hidden_overhead: >-
      The o(1) in L[1/2,c] hides, at 1024 bits, a factor of e^{0.2*68.3} = e^{14}
      per 0.2 of exponent slack -- so the o(1) is worth more than the entire
      sqrt(2) vs 3/sqrt(8) constant gap unless it is small, and nothing in the
      cited literature bounds it explicitly at finite size. Any L(1/3) claim
      would carry a LARGER o(1), as the exemplar result explicitly warns for its
      own p^{1/3+o(1)}: the overhead there is superpolynomial. A record
      proposing L(1/3) here without a finite-size table would be uninformative
      about deployed sizes even if true.
    tradeoff_note: >-
      Relation collection is embarrassingly parallel and low-memory per worker;
      the linear algebra is neither. An L(1/3) route would inherit the same
      split. Against the generic family, index calculus trades polynomial memory
      for subexponential memory to buy a better time exponent, and at
      deployment-relevant sizes it is not obvious which side of that trade an
      adversary with bounded memory would take -- IDEA-20260818-ec1740 measures
      where the trade flips and IDEA-20260818-ffeddf measures the memory leg.

  dominated_by: >-
    CHECKED AGAINST EVERY ROW IN `target_complexity.best_known`, ON TIME, MEMORY
    AND DATA/QUERIES.
    AS AN ALGORITHM: this record currently proposes NO algorithm -- it prices two
    routes and finds (by its own derivation, pending primary-read verification)
    that both are closed. It is therefore dominated on time by EVERY classical
    row listed, trivially, because it offers no algorithm at all. That is the
    honest entry and it is not null.
    AS AN AUDIT / OBSTRUCTION MEASUREMENT: no incumbent exists in this corpus.
    Externally, the likely incumbents are the introductions of Biasse-Fieker and
    of ePrint 2025/1514, both UNREAD beyond page 4, and either may already state
    Budgets 1 and 2. That possibility is recorded rather than assumed away.
    AS A HEURISTIC-VALIDATION EXPERIMENT (Stage B): the incumbent is the
    unstated assumption in every index-calculus analysis that reduced-ideal
    norms are smoothness-typical. No measurement of it exists in this corpus,
    and none was found externally in the bounded screen. NOT NULL: the claim is
    "none found in a bounded screen", not "none exists".
    QUANTUM: Hallgren's polynomial-time algorithm dominates every classical row
    on time in the quantum regime and therefore dominates any L(1/3) this record
    might eventually enable. Any deployment-relevant reading of this record must
    state that the classical exponent question is a PRE-QUANTUM question.
  sota_delta: >-
    NO EXPONENT IS CLAIMED AND, ON THIS RECORD'S OWN DERIVATION, NONE MOVES.
    Quantitatively delivered: (i) Budget 1's feasible region computed exactly --
    |D| <= 21 under the search-summary threshold, with the recomputation under a
    primary-read threshold as the first test; (ii) the deficit at 1024 bits
    stated as an exponent comparison, of order 10^3 against 68.3 for index
    calculus and 709.8 for exhaustive search, i.e. the field-extension route is
    superexponential in |D|; (iii) Budget 2's margin as a measurable quantity,
    predicted |D|^{delta-1/2} tail mass against exp(-(c+o(1))sqrt(d ln d)) bulk;
    (iv) the first measurement in this corpus of whether reduced-ideal norms are
    smoothness-typical, at up to 2^{160}, reachable because it needs only the
    reduce-and-factor step and not a full class group computation; (v) an
    enumeration of >= 4 relation sources outside the closed class, of which F4
    (preprocessing against a fixed public discriminant) is the most
    deployment-relevant and is entirely unexplored here.

  estimated_cost:
