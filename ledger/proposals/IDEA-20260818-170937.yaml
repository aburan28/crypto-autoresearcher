idea:
  id: IDEA-20260818-170937
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-18'
  title: >-
    WHY IS THERE NO L(1/3) FOR IMAGINARY QUADRATIC CLASS GROUPS? Audit the two
    budgets that pin the exponent at 1/2 -- the relative-discriminant cost of
    buying degree, and the norm distribution of reduced ideals -- measure the
    deficit in each, and enumerate the relation sources that evade both
  class: algorithm

  claim: >-
    Factoring moved from L[1/2] to L[1/3] by changing the OBJECT whose
    smoothness is tested: from an integer of size N^{1/2} to a norm in an
    auxiliary field of size N^{o(1)}. Class-group computation made the same move
    for LARGE-DEGREE number fields (Biasse-Fieker) but not for imaginary
    quadratic fields, where the exponent has stood at 1/2 since 1989. Deployed
    hidden-order groups price their discriminants against that 1/2.
    THE CLAIM IS THAT THE 1/2 IS PINNED BY TWO SEPARATELY QUANTIFIABLE BUDGETS,
    that each budget's deficit is a number this program can compute and in part
    measure, and that the enumeration of relation sources evading both is
    finite, non-empty, and has never been written down here.
    BUDGET 1 (DEGREE). Any route that computes Cl(D) by computing Cl(L) for a
    field L containing K = Q(sqrt(D)) and pushing down by the norm map pays
    |disc L| >= |D|^{[L:K]} (relative-discriminant tower formula, rigorous). The
    retrieved threshold for the L(1/3) regime requires the degree to grow like a
    power of log|disc L|. DERIVATION IN THIS RECORD: those two constraints have
    a common feasible region only for |D| below roughly 21 in absolute value, so
    the route is not merely unhelpful at deployed sizes -- it is infeasible at
    every size of interest, and at 1024 bits it is worse than exhaustive search
    over Cl(D) by a factor whose exponent grows like (ln|D|)^{4/3} against
    (ln|D|)^{1/2}.
    BUDGET 2 (RANK). Within degree 2 the integer submitted to each smoothness
    test is the norm of a REDUCED ideal, which Gauss reduction confines to
    [1, sqrt(|D|/3)], and the counting measure on reduced ideals is essentially
    uniform on that interval rather than log-uniform. DERIVATION IN THIS RECORD:
    the small-norm tail therefore contributes at most |D|^{-1/2+delta} to the
    per-trial success probability while the bulk contributes
    exp(-(c+o(1))sqrt(ln|D| lnln|D|)), which is exponentially LARGER. Biasing
    relation generation toward small-norm reduced ideals cannot move the
    exponent, and the amount by which it cannot is |D|^{-1/2} against
    L_{|D|}[1/2,c]^{-1}.
    NO CLAIM IS MADE THAT L(1/3) IS IMPOSSIBLE FOR THIS PROBLEM. Both budgets
    are claimed only over an explicitly stated class of relation sources, and
    the record's fourth deliverable is the enumeration of sources OUTSIDE that
    class.

  mechanism: >-
    THE OBJECT BEING TRACKED IS THE SMOOTHNESS CANDIDATE -- the single integer
    whose factorization decides whether a trial yields a relation. Every
    index-calculus complexity in this area is, at bottom, the balance between
    that integer's size and the factor-base bound, and the exponent in
    L[alpha, c] is determined by how the candidate's LOGARITHM scales with
    ln|D|: candidate of size |D|^{1/2} gives alpha = 1/2; candidate of size
    exp((ln|D|)^{2/3}) gives alpha = 1/3.
    BUDGET 1 IN DETAIL. Write d = ln|D|, K = Q(sqrt(D)), L/K of degree m, so
    n = [L:Q] = 2m and D_L := ln|disc L|. The relative-discriminant tower
    formula disc(L) = N_{K/Q}(d_{L/K}) * disc(K)^{[L:K]} gives, unconditionally,
    D_L >= m*d, with equality exactly when L/K is unramified. The retrieved
    large-degree threshold requires roughly n >= D_L^{3/4} to leave the L(1/2)
    regime; combined with D_L >= (n/2)d this forces n <= 2 D_L/d and hence
    D_L^{3/4} <= 2 D_L/d, i.e. D_L >= (d/2)^4 = d^4/16. For the L(1/3) cost
    exp(c_3 D_L^{1/3}(ln D_L)^{2/3}) to beat exp(c_2 d^{1/2}(ln d)^{1/2}) one
    needs (ignoring log factors and constants) D_L <= d^{3/2}. The two
    requirements d^4/16 <= D_L <= d^{3/2} are compatible only for
    d^{5/2} <= 16, i.e. d <= 16^{2/5} = 3.03, i.e. |D| <= 21. At d = 709.8
    (1024-bit |D|) the forced D_L is at least d^4/16 = 1.58e9, whose cube root
    is 1166, so the route's exponent is of order 10^3 times (ln D_L)^{2/3}
    against 68.3 for index calculus and 709.8 for exhaustive search: the route
    is superexponential in |D|. THE DERIVATION'S LOAD-BEARING INPUT IS THE
    RETRIEVED DEGREE THRESHOLD, WHICH WAS READ FROM A SEARCH SUMMARY AND NOT
    FROM THE PAPER; verifying it is the first item of the minimal test, and if
    the true threshold is weaker the feasible region must be recomputed and may
    be non-empty.
    BUDGET 2 IN DETAIL. In degree 2 a relation is produced by taking a product
    of factor-base ideals, reducing it, and testing the reduced ideal's norm for
    B-smoothness. Gauss reduction guarantees every ideal class contains a
    reduced ideal of norm at most sqrt(|D|/3) -- this is the standard rigorous
    ingredient and it is an UPPER bound, not a floor. The relevant question is
    the MEASURE: the number of reduced ideals of norm at most Y is O(Y^{1+eps})
    while the total number is h(D) = |D|^{1/2+o(1)}, so norm is spread over
    [1, sqrt(|D|/3)] with roughly uniform rather than log-uniform density, and a
    uniformly chosen class has reduced-ideal norm of size |D|^{1/2-o(1)} with
    probability 1-o(1). Splitting the per-trial smoothness probability into the
    contribution from candidates below |D|^{delta} and the rest: the former has
    measure at most |D|^{delta-1/2} even granting smoothness probability 1, and
    the latter is Canfield-Erdos-Pomerance rho(u) with u = (d/2)/ln B, which at
    the optimizing B is exp(-(c+o(1))sqrt(d ln d)). Since sqrt(d ln d) = o(d),
    the bulk term dominates the tail term by a factor exp(d/2 - O(sqrt(d ln d))).
    THE CONCLUSION IS NOT "SMALL CANDIDATES DO NOT HELP" BUT THE SHARPER "THE
    SMALL-CANDIDATE TAIL IS EXPONENTIALLY TOO THIN TO BE WORTH BIASING TOWARD,
    BY A MEASURABLE MARGIN". The margin is a measurable quantity: the empirical
    distribution of reduced-ideal norms and of the resulting smoothness rates.
    WHY THE TWO BUDGETS ARE THE SAME OBSTRUCTION SEEN TWICE. The candidate size
    is |D|^{1/2} because the ideal lattice has RANK 2, and the rank is the field
    degree. Raising the rank lowers the relative candidate size -- which is
    exactly why the L(1/3) results need the degree to grow -- but raising the
    degree is what Budget 1 prices. The exponent 1/2 is the shadow of degree 2.
    Stating that as a single mechanism, with both prices quantified, is the
    record's core content.

  novelty_status: unverified

  novelty_screen:
    corpus_screened: >-
      ledger/proposals grepped by mechanism keyword ('class group', 'imaginary
      quadratic', 'Hafner', 'hidden order', 'VDF'); the 11 proposals citing
      RQ-CLGRP-66ab7f opened at title/claim level; IDEA-20260815-f2d15e and
      IDEA-20260815-beb144 read in full; RQ-CLGRP-66ab7f read in full.
    occupied_lanes_found: >-
      All 11 adjacent proposals are MEASUREMENT, CONTROL, TOOLING or COMPOSITION
      records about cost curves, certificates, assumption audits, parameter
      provenance and trusted-setup pricing. NOT ONE proposes or audits an
      algorithmic route to a better exponent. This is the corpus's clearest
      unoccupied lane on this target, and the fact that it is unoccupied after
      11 proposals is itself worth flagging to the Coordinator.
    nearest_neighbour_and_discriminator: >-
      NEAREST IS IDEA-20260818-ec1740 (this session), which measures the local
      exponent of EXISTING algorithms. DISCRIMINATOR: ec1740 asks which
      published exponent the data realize; this record asks why the published
      exponent is 1/2 and prices the two routes out of it. They share no metric
      and no experiment except the shared discriminant sample.
    web_screened: >-
      Retrieved: Hafner-McCurley constant, Biasse-Erukulangara GRH-proved
      constant, Biasse-Fieker L(1/3) and its degree condition (SEARCH SUMMARY
      ONLY), de Boer-Pellet-Mary-Wesolowski ePrint 2025/1514 (PRIMARY READ,
      pages 1-4). NOT screened: whether the "exponent 1/2 is the shadow of
      degree 2" argument, or the relative-discriminant budget computation, is
      already stated in the literature. IT VERY PLAUSIBLY IS -- this is folklore
      territory in computational number theory, and Biasse-Fieker's own
      introduction is the single most likely place for it. TREAT AS PROBABLY
      KNOWN UNTIL A PRIMARY READ SAYS OTHERWISE.
    verdict: >-
      UNVERIFIED, with an explicit expectation that Budgets 1 and 2 are known or
      folklore in the source literature. What is not known to be written down is
      the QUANTIFICATION (the |D| <= 21 feasible region, the |D|^{-1/2} versus
      L[1/2,c]^{-1} tail margin) and the ENUMERATION of evading relation
      sources. If a primary read finds both budgets already stated, this record
      degrades to `known` on the mechanism and retains value only as the
      enumeration plus the measurement, and that degradation must be recorded
      rather than argued away.

  citations:
    - ref: "Biasse & Fieker, Subexponential class group and unit group computation in large degree number fields, LMS J. Comput. Math. 17A (2014)"
      provenance: retrieved
      claim: >-
        Subexponential class group and unit group computation for arbitrary
        classes of number fields including degree tending to infinity;
        L(1/3+eps) in general and L(1/3) for restricted classes, notably when a
        defining polynomial with small coefficients relative to the discriminant
        is known. Retrieved summary further states that L(1/2) complexity is
        what is achieved when the extension degree n satisfies
        n <= (log|Delta_K|)^{3/4-eps}.
      verified_by: >-
        web search 2026-08-18 (Cambridge Core PDF, Semantic Scholar, author page
        located). NOT PRIMARY-READ. THE DEGREE THRESHOLD QUOTED IS FROM A SEARCH
        SUMMARY AND IS THE SINGLE LOAD-BEARING EXTERNAL NUMBER IN BUDGET 1; the
        minimal test's first item is to replace this with a primary read.
    - ref: "Biasse, An L(1/3) algorithm for ideal class group and regulator computation in certain number fields, arXiv:0912.1927 / Math. Comp."
      provenance: retrieved
      claim: >-
        L(1/3) class group and regulator computation for certain classes of
        number fields.
      verified_by: >-
        web search 2026-08-18 (arXiv and HAL records located). NOT primary-read.
    - ref: "de Boer, Pellet-Mary & Wesolowski, Rigorous methods for computational number theory, ePrint 2025/1514 (rev. 2026-02-19)"
      provenance: retrieved
      claim: >-
        Theorem 1.3 (ERH) gives class group and unit group computation in
        expected time polynomial in the input length, in L_{|D_K|}(1/2), in
        L_{n^n}(2/3), and in min(rho_K, L_{|D_K|}(2/3+o(1))), rho_K the residue
        at 1 of zeta_K. The introduction states that Biasse and Fieker
        conjectured this complexity with rho_K replaced by L_{n^n}(2/3), and
        that rho_K "arises from the best known estimates on the density of
        bounded smooth ideals". The heart of the method is a rigorous solution
        of the IDEAL SAMPLING PROBLEM: given a class [a], sample b in [a] with
        b in S*S_B with probability proportional to the density of S, via a
        random walk on the Arakelov ray class group whose discrete part
        multiplies by small-norm prime ideals and whose continuous part is a
        Gaussian distortion (Corollary 6.5).
      verified_by: >-
        PRIMARY READ of pages 1-4 this session, 2026-08-18. Theorem 1.1,
        Theorem 1.3, Remark 1.2 and the technique paragraph read directly.
        Pages 5+ UNREAD; in particular the exact form of the smoothness bound
        B = (log|D_K| + loglog(1/eps))^{O(1)} and the constants are unchecked.
      significance_for_this_record: >-
        THIS IS THE EXTERNAL STRUCTURAL INGREDIENT AND IT CUTS BOTH WAYS. It
        supplies a PROVABLE re-randomization primitive with an explicit mixing
        statement -- exactly the A5 ingredient of the target result profile --
        which is what a worst-case-to-average-case relation-generation argument
        needs. But its own Theorem 1.3 lands at L(1/2) for fixed degree, and its
        introduction states that imaginary quadratic fields were ALREADY the one
        case amenable to rigorous analysis. So the deployed regime is precisely
        the regime this advance does not move, and any proposal that cites it as
        reshaping the class-group frontier for DEPLOYED PARAMETERS would be
        misreading it. Recorded here so no later session makes that error.
    - ref: "de Boer, Ducas, Pellet-Mary & Wesolowski, Random self-reducibility of Ideal-SVP via Arakelov random walks, CRYPTO 2020, ePrint 2020/297"
      provenance: retrieved
      claim: >-
        Under the Riemann Hypothesis for Hecke L-functions, certain random walks
        on the Arakelov class group mix rapidly; the discrete part uses finite
        places and a continuous Gaussian walk over the infinite places clears
        high-frequency Fourier coefficients, yielding near-uniformity. Used to
        relate average-case and worst-case Ideal-SVP.
      verified_by: >-
        web search 2026-08-18 (ePrint 2020/297 and CRYPTO 2020 records located,
        abstract-level). NOT primary-read. Cited as the mixing-time source that
        any re-randomization step in this lane must lean on, per the target
        profile's requirement that the walk and its mixing bound be explicit.
    - ref: "Gauss reduction of positive definite binary quadratic forms; every class contains a reduced form with leading coefficient a <= sqrt(|D|/3)"
      provenance: recalled
      claim: >-
        The rigorous upper bound confining the smoothness candidate, and the
        counting statement that the number of reduced forms of discriminant D
        with a <= Y is O(Y^{1+eps}) while the total is h(D) = |D|^{1/2+o(1)}.
      verified_by: null
    - ref: "Canfield, Erdos & Pomerance (1983), Psi(X,B) = X u^{-u(1+o(1))}"
      provenance: recalled
      claim: >-
        The classical smoothness-density theorem supplying the distribution half
        of Heuristic H2 below; the same theorem the exemplar result uses.
      verified_by: null
    - ref: "Relative discriminant tower formula: disc(L) = N_{K/Q}(d_{L/K}) * disc(K)^{[L:K]}"
      provenance: recalled
      claim: >-
        The rigorous inequality |disc L| >= |disc K|^{[L:K]} underpinning
        Budget 1, with equality iff L/K is unramified.
      verified_by: null

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: (i) sweep-and-fit cost curves,
      (ii) two-torsion / ambiguous-form enumeration, (iii) parameter provenance,
      (iv) sieving and large-prime variations of relation collection, which are
      constant-factor moves within the same object and are explicitly NOT what
      this record tracks.
    tracked_object: >-
      THE SMOOTHNESS CANDIDATE'S LOGARITHM, as a function of ln|D| -- the single
      scalar log N(b) attached to each relation trial, tracked across relation
      sources.
    lossiness: >-
      LOSSY-PROJECTION TEST. From log N(b) one cannot recover b, its class, its
      factorization, or the trial that produced it: the projection collapses the
      entire relation-generation state to one real number and is massively
      lossy. What it discards is discarded COMPATIBLY with the operation that
      governs the complexity: the smoothness test depends on b ONLY through its
      factorization, and the CEP/Dickman law says the probability of that test
      succeeding depends on b only through log N(b) and log B, up to the o(1)
      that the whole analysis already carries. So the retained scalar propagates
      deterministically through the one step that matters (candidate -> success
      probability), while everything discarded is exactly what the complexity
      analysis is already agnostic to. CONTRAST WITH A FAILED PROJECTION: the
      pair (class of b, norm of b) loses nothing that reduction does not
      immediately restore, and is a change of coordinates, not an object.
    propagation: >-
      One-step propagation is defined and measurable: given a relation source,
      one trial maps to one value of log N(b); the induced distribution on
      [0, (1/2)ln(|D|/3)] is the object's state, and composing with the
      CEP density gives the per-trial success probability. Both the distribution
      and the success rate are directly instrumentable in any existing
      implementation by logging one number per trial.
    survival: >-
      The object survives as long as relations are produced by testing a single
      integer for smoothness. It DISSOLVES exactly at the relation sources
      enumerated in `forward_guidance`, which produce relations without a
      smoothness candidate at all -- and that dissolution is the record's most
      useful output, because it says precisely where to look next.
    scoring: >-
      GENUINELY NEW OR REPACKAGING: the object itself is standard (it is what
      every index-calculus analysis balances). What is not standard here is
      tracking its DISTRIBUTION rather than its typical size, which is what
      turns "the exponent is 1/2" into the measurable margin of Budget 2.
      Honest score: repackaging of a known quantity into a measurable one.
      CONCRETELY TESTABLE: yes, one logged scalar per trial.
      SURVIVAL: to the boundary of the smoothness-testing paradigm, which is
      named explicitly.

  proof_search_map:
    bottleneck: >-
      The size of the integer submitted to the smoothness test in relation
      generation. Removing the constraint that this integer be Theta(|D|^{1/2})
      is precisely what would change L[1/2, c] to L[1/3, c'], and nothing else
      in the algorithm needs to change for that to happen.
    baseline_embedding:
      parameter_slice: >-
        Candidate size |D|^{1/2} with factor-base bound B chosen to balance
        rho(u)^{-1} against B: this slice must reproduce
        L_{|D|}[1/2, sqrt(2)] (Hafner-McCurley) and, with the sharper density
        input, L_{|D|}[1/2, 3/sqrt(8)] (Biasse-Erukulangara).
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE, AND IT RUNS FIRST. Re-derive both constants from
        the balance: with candidate size |D|^{theta} and ln B = beta sqrt(d/ln d)
        the exponent is theta*d/(beta sqrt(d ln d)) * ln(...) + beta sqrt(d ln d);
        minimizing over beta must return c = sqrt(2) at theta = 1/2 under the
        naive per-trial accounting. IF IT DOES NOT RETURN sqrt(2), the record's
        model of where the exponent comes from is wrong and everything
        downstream is void. This is a frozen fixture, not a plot.
    observation_collision:
      observable: >-
        The empirical distribution of log N(b) over trials, together with the
        realized smoothness rate.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS INFORMATIVE. Random-exponent-vector
        relation generation and sieving-based relation generation (SIQS-style)
        should produce nearly the SAME candidate-size distribution while
        differing substantially in total cost, because sieving amortizes the
        factorization step rather than shrinking the candidate. Finding that
        collision confirms that the observable determines the EXPONENT but not
        the CONSTANT -- which is the correct scope for Budget 2 and must be
        stated as a limitation rather than discovered later. A collision in the
        other direction -- two sources with different candidate distributions
        and identical cost -- would falsify the claim that this object carries
        the exponent, and is the outcome to hunt for.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the rank-2 ideal lattice by a higher-rank lattice attached to
          D but not to K -- the lattice of binary cubic forms of discriminant D
          (Davenport-Heilbronn), or the rank-4 quaternion/CM lattices attached
          to elliptic curves with CM by O_D.
        predicted_gain: >-
          The Hermite-type bound on the smallest vector scales as
          |disc|^{1/rank}, so rank r gives candidates of size |D|^{1/r}; at
          r growing like (ln|D|)^{1/3} the candidate is exp((ln|D|)^{2/3}) and
          the exponent would be 1/3. THE OBLIGATION THIS INCURS, AND IT IS NOT
          DISCHARGED HERE: such a lattice must carry a GROUP HOMOMORPHISM to
          Cl(D) so that short vectors give relations. Budget 1 is precisely the
          statement that the obvious way to get one (field extension) prices
          itself out. Whether a non-field route exists is the open question this
          record hands forward.
      - transform: observable_fiber
        proposed_object: >-
          Hold the candidate-size distribution fixed and vary the relation
          source, looking for two sources with the same observable and different
          intrinsic cost.
        predicted_gain: >-
          Separates "the exponent is set by candidate size" (survives) from
          "the cost is set by candidate size" (does not). Cheap, and it bounds
          how much the record may claim.
    quantifier_order: >-
      BUDGET 2, STATED WITH EXPLICIT ORDER:
      FOR ALL delta > 0, FOR ALL relation sources P in the class C of sources
      that produce a relation by testing the norm of a reduced ideal of
      discriminant D for B-smoothness, THERE EXISTS D_0 such that FOR ALL |D| >
      D_0: the probability that a single P-trial yields a candidate of norm at
      most |D|^{delta} is at most |D|^{delta - 1/2 + o(1)}.
      NOTE THE ORDER CAREFULLY. The source P is quantified BEFORE D, so a source
      allowed to depend on D -- for instance one that has been handed a short
      vector in a class as advice, or one built from a precomputation depending
      on D -- IS NOT COVERED. That is not a gap to be patched; it is where a
      real attack would live, and it is named in `forward_guidance` as the
      preprocessing route.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: no relation source in
        class C, with no D-dependent advice, attains an exponent below 1/2. It
        CANNOT certify that L(1/3) is impossible for Cl(D), and no record
        produced under this proposal may say so.
      nearby_object_control: >-
        THE CONTROL THAT MATTERS: apply the identical argument to a number field
        of degree 3 (or degree growing with d) and the same discriminant size.
        There the ideal lattice has rank 3 (or r), the candidate size is
        |disc|^{1/3} (or |disc|^{1/r}), and the conclusion "exponent 1/2" MUST
        FAIL -- because Biasse-Fieker prove it fails. If the argument as written
        also yields 1/2 in the degree-r case, it is not tracking rank and has
        not identified the load-bearing structure; the argument is then void and
        must be rewritten or abandoned. THIS CONTROL IS CHEAP, SYMBOLIC, AND
        RUNS BEFORE ANY COMPUTE.
    proof_obligations:
      - claim: "Relative discriminant tower formula gives |disc L| >= |D|^{[L:K]}."
        responsibility: baseline
      - claim: "The retrieved large-degree threshold n >~ (log|disc L|)^{3/4} is stated correctly."
        responsibility: interface
      - claim: "The two constraints have common feasible region only for |D| <= ~21."
        responsibility: feasibility
      - claim: "Number of reduced ideals of norm <= Y is O(Y^{1+eps}); total is |D|^{1/2+o(1)}."
        responsibility: size
      - claim: "Small-norm tail contributes at most |D|^{delta-1/2} to per-trial success."
        responsibility: success_probability
      - claim: "Bulk contributes exp(-(c+o(1))sqrt(d ln d)) via CEP, dominating the tail."
        responsibility: success_probability
      - claim: "The degree-r nearby-object control yields exponent 1/2 -> 1/r, not 1/2."
        responsibility: strictness
      - claim: "Budgets are claimed only over class C and only for D-independent sources."
        responsibility: scope

  null_object_control: >-
    NULL 1 (DEGREE-r CONTROL, see method_ceiling). The symbolic argument applied
    to degree 3 and to degree growing with d must NOT yield exponent 1/2. This
    is the null object for the ARGUMENT and it runs before any compute.
    NULL 2 (RANDOM-LATTICE NULL). For the empirical half: sample a rank-2
    lattice of the same covolume as the ideal lattice but with no arithmetic --
    a random unimodular transform of a random Gram matrix of determinant
    |D|/4 -- and measure the distribution of shortest-vector norms and of the
    smoothness of those norms. Prediction: the reduced-ideal-norm distribution
    matches the random-lattice null in shape, because the confinement is
    geometric (reduction theory), not arithmetic. IF THE REAL DISTRIBUTION
    DIFFERS FROM THE NULL, arithmetic structure is biasing candidate sizes, and
    that bias is a lead worth chasing -- it is the only cheap way this
    experiment can produce an exponent-relevant positive.
    NULL 3 (SHUFFLED-SMOOTHNESS NULL). Recompute the realized smoothness rate
    after replacing each candidate by a uniformly random integer of the same
    bit-length. Prediction under H2: rates agree within sampling error. A
    systematic EXCESS in the real rate would mean reduced-ideal norms are
    smoother than random integers of their size -- which would move the
    constant c, is directly deployment-relevant, and would be the single most
    valuable outcome of this record. A systematic DEFICIT would mean the
    deployed cost model is optimistic in the safe direction.

  predictions:
    - metric: >-
        feasible-region upper bound on |D| from Budget 1, recomputed after a
        primary read of the Biasse-Fieker degree threshold
      direction: different
      minimum_effect: >-
        Predicted |D| <= 21 (i.e. d <= 3.03) under the search-summary threshold
        n >~ (log|disc L|)^{3/4}. Any primary-read threshold weaker than
        n >~ (log|disc L|)^{1/2} would open a non-empty feasible region at
        cryptographic d and would REVERSE this record's conclusion; that is the
        outcome the first test is looking for.
    - metric: >-
        empirical distribution of log N(b)/((1/2)ln|D|) over >= 10^6 relation
        trials, at several |D|
      direction: different
      minimum_effect: >-
        Predicted approximately uniform on (0,1] with density proportional to
        |D|^{x/2} d(x/2)-weighting, i.e. mass concentrated within a constant
        factor of the top; specifically P[log N(b) < delta*ln|D|] <=
        |D|^{delta-1/2+o(1)}, checked at delta in {0.1, 0.2, 0.3, 0.4}. An
        observed tail exceeding that bound by a factor of 10 at any delta
        falsifies the Budget 2 measure statement.
    - metric: >-
        realized B-smoothness rate of candidates versus rho(u) with
        u = log N(b)/log B, and versus the shuffled-smoothness null
      direction: different
      minimum_effect: >-
        Predicted agreement within 15 percent across the sampled u range, and
        agreement with Null 3 within sampling error. A reproducible excess of
        >= 15 percent is a constant-level finding on c and must be reported; a
        reproducible excess growing with |D| would be exponent-relevant and
        triggers escalation to adversarial review.
    - metric: >-
        exponent yielded by the symbolic argument applied to degree 3 and to
        degree r growing with d (Null 1)
