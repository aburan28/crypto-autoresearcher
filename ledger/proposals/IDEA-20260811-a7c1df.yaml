idea:
  id: IDEA-20260811-a7c1df
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    NAME THE OBJECT - the SEMAEV DEGENERATION DIVISOR on the j-line. Every factor
    of the form alpha*a^3 + beta*b^2 dividing a block of S_m coefficients cuts
    out the SINGLE rational j-value 1728*(-4 beta)/(27 alpha - 4 beta), so the
    six special j reported at p = 4001 are the mod-p reductions of six
    characteristic-INDEPENDENT rational points on the j-line; this record derives
    that dictionary in closed form, checks it against five of the six committed
    F_4001 values, and pre-registers a monotonicity prediction for S_5 under
    Semaev's resultant recursion whose FAILURE would prove the object is
    m-local and not a curve invariant at all
  class: mechanism

  object: >-
    OBJ-SDD, the Semaev degeneration divisor. The tracked object is the DIVISOR
    Div(S_m) on the j-line consisting of those j at which the monomial support of
    the m-th summation polynomial of y^2 = x^3 + a x + b drops below its generic
    value - NOT the j-invariant itself, NOT |Aut|, and NOT the CM discriminant.
    It is a j-line object because support is constant on the whole weighted orbit
    {(l^2 a, l^3 b)} (C-GAUGE, discharged on all 138 members, EV-ICINV-6b6264),
    so support factors through j exactly.

  resource: >-
    R2 (the curve equation and model) primarily; R1 secondarily, because the
    functional is the coefficient structure of a polynomial system in
    x-coordinates as FIELD elements. No group-operation output is consumed, so
    the H-ENDO-001 admissibility filter is passed: nothing here applies any
    endomorphism to any point of G, and no non-scalar action on G is required or
    claimed.

  claim: >-
    (A) THE DICTIONARY, DERIVED IN CLOSED FORM IN THIS RECORD. Let alpha, beta be
    non-zero rationals with 27 alpha - 4 beta not zero, and let
    L(alpha, beta) = {(a, b) : alpha a^3 + beta b^2 = 0}. At every non-singular
    point of L(alpha, beta), a^3 = -(beta/alpha) b^2, hence
    4 a^3 + 27 b^2 = (27 - 4 beta/alpha) b^2, hence
        j = 1728 * 4a^3 / (4a^3 + 27b^2)
          = 1728 * (-4 beta/alpha) / (27 - 4 beta/alpha)
          = 1728 * (-4 beta) / (27 alpha - 4 beta).
    So EVERY such locus is a single point of the j-line, and the point is a
    RATIONAL NUMBER depending only on (alpha : beta) - not on p.
    [DERIVED IN THIS RECORD. Elementary; two lines; to be re-verified
    symbolically as the experiment's first act.]

    (B) THE CHARACTERISTIC-ZERO DICTIONARY FOR S_4. EV-ICINV-6b6264 and
    VAL-20260810-dc8bd8 record the exact stratification of the 439 S_4
    coefficients over QQ[a,b] into blocks carrying the factors a (248), b (214),
    a^3+8b^2 (48), -a^3+8b^2 (36), -a^3+12b^2 (6), 3a^3+32b^2 (6), a^3+6b^2 (4),
    5a^3+48b^2 (1), and the six resulting special j over F_4001 as
    135, 1426, 2180, 2257, 2836, 3344. Applying (A) gives, IN CHARACTERISTIC
    ZERO:
        a^3 +  8b^2  ->  j =  55296/5    (= 1728*32/5)
       -a^3 +  8b^2  ->  j =  55296/59
       -a^3 + 12b^2  ->  j =  27648/25
       3a^3 + 32b^2  ->  j = 221184/47
        a^3 +  6b^2  ->  j = -13824      (an integer)
       5a^3 + 48b^2  ->  j = 110592/19
    and the two trivial factors give a -> j = 0 and b -> j = 1728.
    ARITHMETIC CROSS-CHECK PERFORMED IN THIS RECORD, BY HAND, AGAINST THE
    COMMITTED F_4001 LIST: -13824 mod 4001 = 2180; 110592 * 19^{-1} mod
    4001 = 135; 55296 * 59^{-1} mod 4001 = 2836; 27648 * 25^{-1} mod
    4001 = 1426; 221184 * 47^{-1} mod 4001 = 3344; and 55296 * 5^{-1} = 2257 is
    the value the validator already published. FIVE OF THE SIX WERE RE-DERIVED
    HERE FROM THE CHAR-0 FORMULA AND ALL FIVE MATCH. That is a genuine
    independent confirmation of the committed stratification and of (A) at once,
    and it is reported as hand arithmetic to be machine-verified, not as a run.

    (C) THE CONSEQUENCE THAT MAKES THIS AN OBJECT AND NOT A COINCIDENCE. The six
    j are FIXED RATIONAL NUMBERS. They are therefore defined before p is chosen,
    they reduce mod every p not dividing their denominators or the finitely many
    difference-numerators, and the six special j at p = 4001 are not a fact about
    4001. This is the first structure in RQ-JINV-8fc13a that is neither j = 0 nor
    j = 1728 nor a CM condition, and the lane has never considered it.

    (D) THE PRE-REGISTERED PREDICTION, WHICH IS WHAT MAKES THIS FALSIFIABLE. The
    summation polynomials satisfy the resultant recursion
    S_5(x1..x5) = Res_X(S_4(x1,x2,x3,X), S_3(x4,x5,X)) [standard construction,
    Semaev 2004; TO BE RE-VERIFIED against harness/semaev.py and KN-TECH-002
    before use, not asserted from memory]. Specialisation commutes with the
    resultant whenever the leading coefficient in X does not vanish on the locus,
    so S_5 restricted to L(alpha,beta) is the resultant of a DEGENERATE S_4 with
    a generic S_3. PREDICTION: supp(S_5) is strictly smaller than its generic
    value at every one of the six loci, and the RANK ORDER of the six drops
    agrees with the rank order of the S_4 drops (largest at a^3+8b^2, smallest
    at 5a^3+48b^2), with ties allowed only where the S_4 drops tie (6 and 6).
    A failure of the strict-drop half at any locus proves Div(S_m) is NOT
    monotone in m and that the object is m-local rather than a property of the
    curve; a failure of the rank half alone is a weaker negative and is
    reported as such.

  mechanism: >-
    S_m is a polynomial in x_1..x_m whose coefficients are polynomials in (a, b).
    Its support as a function of (a,b) is upper semi-continuous in the Zariski
    sense: it is generic on a dense open set and can only drop on the proper
    closed subset where whole coefficient blocks vanish. Those blocks vanish on
    loci defined by irreducible factors of the coefficients over QQ[a,b]. Because
    S_m is weighted-homogeneous under (a,b) -> (u^4 a, u^6 b) - the identity
    S_3^{(u^4 a, u^6 b)}(u^2 x) = u^8 S_3^{(a,b)}(x) is discharged exactly on all
    138 members (C-GAUGE, EV-ICINV-6b6264) - every such factor is itself
    weighted-homogeneous, so it has the shape alpha a^3 + beta b^2 (weight 12) or
    a power of a or of b. Weight-12 irreducible factors cut out single points of
    the j-line by (A). That is the whole mechanism: the j-line stratification of
    Semaev geometry is forced by weighted homogeneity, and the only freedom is
    WHICH weight-12 forms appear, which is an arithmetic fact about the recursion
    that this record proposes to compute rather than guess.

  novelty_status: adaptation
  novelty_note: >-
    Corpus checked. The S_4 stratification itself is committed
    (EV-ICINV-6b6264, VAL-20260810-dc8bd8) and DEC-20260810-d70ece explicitly
    names it "a strong candidate for KN-FIND" whose promotion is blocked only
    because it was a review side-computation with no run record; this proposal is
    the run record that revisit condition asks for. The CLOSED-FORM DICTIONARY
    (A), the char-0 j-values in (B), and the m-monotonicity prediction (D) are
    NOT in any committed record - grep of ledger/ and knowledge/ for
    "a^3 + 8b^2", "32/5" returns only GOAL-ENDO-001/goal.yaml,
    DEC-20260810-d70ece, EV-ICINV-6b6264 and the validation report, none of
    which carries a general formula or any j other than 1728*32/5. External
    literature NOT checked for prior publication of the S_m coefficient
    stratification over QQ[a,b]; that check is a deliverable of the minimal test,
    and until it is done this record is `adaptation`, not `speculative` and not
    novel.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-477e40 and NOT IDEA-20260807-8b9486. Both are about the a=0
    and b=0 specialisations only - the 13/9/10 support count of S_3 - and
    8b9486 explicitly CAPS the within-class variation at "j = 0 and j = 1728,
    each occurring at most once per class". This record's whole content is the
    SIX further loci that are neither, which 8b9486's cap misses because S_3 has
    no weight-12 coefficient factor and S_4 does. NOT IDEA-20260807-a6fb2a
    (height of j, an archimedean quantity destroyed by reduction); the loci here
    are algebraic and survive reduction exactly.

  assumptions:
  - >-
    Semaev's resultant recursion for S_5 is as stated. This is TO BE VERIFIED
    against harness/semaev.py and KN-TECH-002 in the first hour of the
    experiment, not assumed. If the harness builds S_5 by a different route, the
    prediction in (D) is restated against that route or withdrawn.
  - >-
    The committed stratification (block sizes 248/214/48/36/6/6/4/1 summing with
    the generic 439) is correct as recorded. It was produced by one independent
    validating session and is unreplicated (DEC-20260810-d70ece limitations); the
    minimal test re-derives it from scratch as its first gate.
  - >-
    p > 3 and p does not divide 5, 19, 25, 47, 59 or any difference numerator
    among the six values, so the six special j are distinct and distinct from 0
    and 1728. At p = 4001 this is satisfied and the six listed values are
    pairwise distinct.

  proof_search_map:
    bottleneck: >-
      The step whose removal would change the theorem is the identification of
      the weight-12 irreducible factors of the S_m coefficient ideal. Everything
      else - the j-value of a factor, the gauge invariance, the reduction mod p -
      is elementary once that list is known.
    baseline_embedding:
      parameter_slice: >-
        m = 3 is the exact baseline slice. S_3 has NO weight-12 coefficient
        factor, so the dictionary must reproduce exactly the committed 13/9/10
        (generic / a=0 / b=0) and predict NO further special j at m = 3. If the
        method invents a locus at m = 3 it is wrong at the boundary.
      reproduction_check: >-
        Symbolic: re-expand S_3 over QQ[a,b], factor every coefficient, confirm
        the only irreducible factors are a and b. Frozen fixture: the
        source_sha256-bound red_team_notes.md line recording 13/9/10.
    observation_collision:
      observable: >-
        The monomial support multiset of S_m, as a function on the j-line.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, and it is the object's principal limit. E and its
        quadratic twist have the same j and therefore the SAME support, but
        different traces, different group orders and different isogeny classes.
        So the observable has two distinct preimages lying on opposite sides of
        any class-level conclusion, and it can never separate isogeny classes.
        The separating condition, stated: this record claims a J-LINE fact only
        and makes NO class-level claim. See IDEA-20260811-bbcd68, which develops
        this collision into a general filter.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The divisor Div(S_m) with multiplicities (block sizes 248, 214, 48, 36,
        6, 6, 4, 1) rather than the bare support integer. The multiplicity is
        preserved state the final support count discards, and it is what makes
        the rank-order half of prediction (D) testable.
      predicted_gain: >-
        A rank-order prediction across six loci instead of a single yes/no per
        locus, i.e. five extra bits of falsifiability at zero extra compute.
    quantifier_order: >-
      FOR ALL m >= 3 THERE EXISTS a finite set J_m of rational numbers such that
      FOR ALL primes p outside a finite exceptional set S_m depending only on
      J_m, and FOR ALL curves E/F_p with j(E) not in J_m mod p, supp(S_m^E)
      equals the generic value. The witness J_m is allowed to depend on m and on
      NOTHING ELSE - in particular not on p, not on the curve and not on the
      isogeny class. The monotonicity prediction is the further claim
      J_4 is contained in J_5, and it is exactly the quantifier that could fail.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete, exact, p-independent list of the j at which S_m degenerates,
        for m = 3, 4, 5, with multiplicities. That is the CEILING. The method
        cannot certify anything about solving cost, about isogeny classes, or
        about any p not covered by the exceptional-set argument.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion fails is the
        f_V-BEARING system the harness actually solves. There the solving degree
        is pinned by |V| and not by the curve (MATCHED-ORDER-DESIGN.md section 2,
        and EV-ICINV-6b6264 boundary 2), so the divisor is invisible. A method
        that could not distinguish the f_V-free and f_V-bearing systems would
        have identified nothing load-bearing; this one distinguishes them by
        construction, because it never touches f_V.
    proof_obligations:
    - claim: The j-value formula for a weight-12 locus
      responsibility: correctness
    - claim: Every irreducible coefficient factor of S_m is weighted-homogeneous
      responsibility: correctness
    - claim: supp(S_5) drops strictly at each of the six loci
      responsibility: feasibility
    - claim: The exceptional-prime set is finite and explicitly computable
      responsibility: scope

  predictions:
  - metric: s4_special_j_char0_values
    direction: different
    minimum_effect: >-
      The six char-0 values are exactly 55296/5, 55296/59, 27648/25, 221184/47,
      -13824, 110592/19, and their reductions mod 4001 are exactly the committed
      multiset {135, 1426, 2180, 2257, 2836, 3344}. SIX OF SIX must match. Any
      mismatch falsifies formula (A) or the committed stratification, and which
      one is decided by re-deriving the stratification.
  - metric: s3_special_j_count
    direction: different
    minimum_effect: >-
      EXACTLY ZERO weight-12 coefficient factors in S_3, hence exactly two
      special j at m = 3 (namely 0 and 1728) and no others. A third locus at
      m = 3 falsifies the baseline embedding.
  - metric: s5_support_drop_at_each_of_six_loci
    direction: lower
    minimum_effect: >-
      Strictly lower than generic supp(S_5) at all six loci - at least one
      monomial at each, i.e. six of six. Five of six is a NEGATIVE for
      monotonicity and must be reported as such, not rounded up.
  - metric: s5_drop_rank_correlation_with_s4_drop
    direction: higher
    minimum_effect: >-
      Spearman rank correlation of the six S_5 drops against the six S_4 drops
      (248, 214 excluded; the six are 48, 36, 6, 6, 4, 1) at least +0.80, with
      the tie at 6/6 excluded from the rank computation.

  minimal_test:
    design: >-
      PURE SYMBOLIC COMPUTATION OVER QQ[a,b]. NO SAMPLING, NO TARGET DRAW, NO
      p-VALUE, NO NULL DRAW, NO TIMING. Four steps, each a gate on the next.
      STEP 1 (baseline, must pass first): expand S_3 over QQ[a,b], factor each
      coefficient, confirm the irreducible factor set is {a, b} and reproduce
      13/9/10. STEP 2: expand S_4 over QQ[a,b], factor every one of the 439
      coefficients, and re-derive the eight-block stratification from scratch;
      compare block sizes against the committed 248/214/48/36/6/6/4/1 and report
      any disagreement as the headline. STEP 3: evaluate formula (A) on each
      weight-12 factor, obtain the six rationals, reduce mod 4001, and compare
      against the committed six-value multiset. STEP 4: build S_5 by the
      resultant recursion, count its generic support, specialise to each of the
      six loci by substituting a rational parametrisation of the locus, and
      record the six support values and their rank order. Run the whole thing in
      TWO engines that share no code (SageMath and sympy suffice - unlike
      EXP-ICINV-e0cd8f this contract needs NO minimal free resolution, so the
      D1 backend precondition of DEC-20260810-d70ece does NOT bind it).
    controls:
    - >-
      C-BASELINE. Step 1 must reproduce 13/9/10 exactly before step 2 is allowed
      to run. A stratification engine that cannot reproduce the committed m = 3
      answer produces no admissible m = 4 or m = 5 answer.
    - >-
      C-GAUGE. Every support count is recomputed on (u^4 a, u^6 b) for a seeded
      random u and must agree. This is a WEAK control by the committed
      characterisation - weighted homogeneity makes it impossible to fail unless
      the code is wrong - and it is retained for exactly that purpose and
      labelled as an implementation check, never as evidence that a difference is
      real (EV-ICINV-6b6264, C-GAUGE limit).
    - >-
      C-NULL-LOCUS. The null object of the same shape - a locus that should show
      NOTHING. Draw ten random weight-12 forms alpha a^3 + beta b^2 whose
      (alpha:beta) is NOT among the six, specialise S_4 and S_5 to each, and
      confirm the support equals the GENERIC value on all ten. If a random locus
      also drops the support, the drop is an artifact of the specialisation
      procedure and every positive in this record is void.
    - >-
      C-ORDER. Support is monomial-order independent by definition, so no order
      control is needed for support; but the generic support of S_5 must be
      computed from the expanded polynomial, not from a Groebner-reduced form,
      and the contract must say so.
    required_metrics:
    - monomial_support_count_S3_S4_S5_generic
    - irreducible_factor_multiset_of_coefficients_over_QQ_ab
    - block_size_per_factor
    - char0_j_value_per_weight12_factor
    - reduction_mod_4001_of_each_char0_j
    - support_count_per_locus_per_m
    - null_locus_support_counts

  lossy_projection_answer: >-
    STATED FIRST, BECAUSE THE LANE'S OWN COMMITTED FAILURE IS EXACTLY HERE. The
    map (a,b) -> supp(S_m) is genuinely lossy: it discards every coefficient
    VALUE and retains only the vanishing pattern, and the discard is compatible
    with the target's operations in the precise sense that the retained part is
    invariant under the weighted gauge action, hence descends to the j-line and
    propagates deterministically through specialisation (C-GAUGE, discharged
    exactly on 138 members). So it passes the algebraic half of the test: it is
    a new object, not a change of coordinates. IT FAILS THE COST HALF, AND THIS
    RECORD SAYS SO UP FRONT: at j = 0 the S_3 support drops 30.8% while Groebner
    time moves -0.44% and gb_size moves the WRONG WAY, +3.41% (committed,
    red_team_notes.md section 11). THIS RECORD THEREFORE CLAIMS NO COST EFFECT
    AND MEASURES NO TIME. Its deliverable is the exact classification of the
    object; whether ANY cost functional can see it is deliberately quarantined
    into IDEA-20260811-97e244 (Newton polytope, the one functional that is
    provably a function of support) and IDEA-20260811-6034d0 (reducibility, the
    one degeneration that is provably a function of cost). Reading this record as
    a speedup claim is a misuse of it.

  t5_reachability_answer: >-
    NOT ENGAGED, DELIBERATELY, AND THE SUCCESSOR IS NAMED. T5 asks whether a
    cost-minimising vertex is reachable. This record produces no cost minimiser -
    it produces a divisor. The reachability question for that divisor is the
    entire content of IDEA-20260811-3e08e0 (how many classes at a given p contain
    a special j) and IDEA-20260811-22b6b8 (walk length to the vertex when one
    does). Stated here so no reader infers a reachability claim from a j-line
    fact.

  null_object: >-
    C-NULL-LOCUS above: ten random weight-12 loci of the SAME SHAPE
    (alpha a^3 + beta b^2 = 0, one point of the j-line each, one-parameter
    rational curve in the (a,b)-plane each) that are not among the six.
    Predicted result: generic support at all ten, at every m. This is the exact
    null the S_4 outlier never got - EV-ICINV-6b6264 records that C-CONTROL-SET
    was never drawn and that algebra was substituted for it.

  falsification_conditions:
  - >-
    Any of the six char-0 values fails to reduce to its committed F_4001
    counterpart. Formula (A) or the committed stratification is wrong; the
    dictionary is withdrawn and the record is superseded.
  - >-
    Step 1 fails to reproduce 13/9/10 exactly. The instrument is wrong and
    nothing downstream is admissible.
  - >-
    A random weight-12 locus in C-NULL-LOCUS shows a support drop. The drop is a
    specialisation artifact and every positive here is void.
  - >-
    supp(S_5) equals the generic value at any one of the six loci. Div is NOT
    monotone in m, the object is m-local, and its interpretation as a property of
    the CURVE is refuted. This is the single most informative possible outcome
    and it is cheap.
  - >-
    An irreducible coefficient factor of S_4 or S_5 is found that is NOT
    weighted-homogeneous. The mechanism above is wrong and the j-line
    factorisation of the object fails.

  confounders:
  - >-
    Expansion convention. Support depends on whether S_m is stored expanded, in a
    partially factored form, or homogenised with respect to x0. The contract must
    fix ONE convention before execution and record it; the committed 439 is the
    expanded affine count and must be reproduced under the same convention.
  - >-
    Locus parametrisation. Specialising to alpha a^3 + beta b^2 = 0 requires a
    rational parametrisation; a bad one (e.g. setting b = 0 accidentally) hits
    the singular point of the locus and reports a spurious drop. The contract
    must exclude the singular point explicitly and state its parametrisation.
  - >-
    Over QQ versus over F_p. Factorisation over F_p can split a factor
    irreducible over QQ, creating loci that exist only mod p. The primary
    computation is over QQ[a,b]; any F_p-only factor is reported separately and
    is NOT part of Div in the char-0 sense.

  interpretation_limits:
  - >-
    This is a statement about POLYNOMIALS, not about curves' difficulty, and not
    about isogeny classes. By the twist collision recorded in the proof search
    map, support can never separate isogeny classes.
  - >-
    claim_tier toy. No attack, no exponent, no speedup. Nothing here changes any
    cost.
  - >-
    Transfer to other p is by the exceptional-set argument only, and the
    exceptional set must be computed, not assumed empty.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN THIS RECORD. Every quantity
      is an exact symbolic computation over QQ[a,b] or an exact reduction mod a
      named prime. The only extrapolation is the p-independence claim, which is
      not a heuristic but a consequence of the loci being defined over QQ,
      subject to the named finite exceptional set.
    rigorous_support: >-
      Weighted homogeneity of S_m under (a,b) -> (u^4 a, u^6 b), discharged
      exactly on 138 members as C-GAUGE (EV-ICINV-6b6264), plus the elementary
      identity j = 1728*4a^3/(4a^3+27b^2).
    validation_plan: >-
      The p-independence claim is validated by REPEATING step 3 at three further
      primes - 2003, 6007 and one prime above 2^20 - and confirming that the
      reductions of the six fixed rationals are exactly the loci found by
      re-stratifying S_4 over F_p at that prime. Comparison distribution: none
      required, the check is exact equality of two six-element sets. Tail check:
      deliberately include one prime dividing a denominator (p = 19 or p = 59) and
      confirm the predicted DEGENERATION of the dictionary there, which is the
      exceptional set behaving as predicted rather than the theory failing.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED. This record proposes no algorithm and moves no exponent.
    memory_exponent: >-
      NONE CLAIMED.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); on CM curves the
      automorphism-discounted variant 0.886*sqrt(N/|Aut|) (KN-TECH-018), under
