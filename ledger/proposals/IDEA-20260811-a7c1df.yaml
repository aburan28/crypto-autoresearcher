    hidden_overhead: >-
      Not applicable - no asymptotic claim is made, so nothing hides in an o(1).
    tradeoff_note: >-
      Not applicable. The computation itself is a fixed symbolic job of a few
      CPU-minutes; there is no time-memory tradeoff to state.

  dominated_by: >-
    As an attack, totally dominated by parallel Pollard rho with distinguished
    points (KN-TECH-001, KN-TECH-006) and by its automorphism-discounted variant
    (KN-TECH-018). Every row of the frontier - rho, BSGS, Pollard kangaroo,
    index calculus over prime fields - dominates this on time, memory and
    queries simultaneously, because this record produces no solver at all.
  sota_delta: >-
    ZERO on every axis. No attack, no exponent, no speedup, no constant.
    Conceptual and classificatory contribution only.

  estimated_cost:
    implementation: low
    compute: low
  compute_note: >-
    S_4 expansion over QQ[a,b] and coefficient factorisation is minutes. S_5 by
    resultant over QQ[a,b] is the only real cost and may be large; the contract
    must carry a stopping rule that permits computing S_5 over a large prime
    field instead if the QQ computation exceeds budget, and must record which was
