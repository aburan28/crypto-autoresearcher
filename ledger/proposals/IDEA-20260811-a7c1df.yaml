  recommended_priority: high
  expected_value: >-
    HIGHEST IN THIS BATCH ON INFORMATION-PER-CPU-SECOND. It is exact, it needs no
    statistics, no null draw, no sampling and NO resolution backend (so it is not
    blocked by the D1 precondition that paused EXP-ICINV-e0cd8f), and it
    discharges DEC-20260810-d70ece's own stated revisit condition for promoting
    the stratification to KN-FIND. Both outcomes of the S_5 monotonicity test are
