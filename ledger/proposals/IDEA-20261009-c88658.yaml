  title: Function-field generator heights are O(chi), independent of p
  class: control
  claim: |-
    On E1 surfaces across p in {2^8, 2^12, 2^16, 2^20}, lambda_1 of the MW lattice lies in [chi/2, 2 chi] and is uncorrelated with p; on D2 Q-lifts lambda_1 grows proportionally to log p.
  mechanism: |-
    h(P) = 2 chi + 2 (P.O) - sum of local contributions, so minimal sections have height <= 2 chi regardless of p, unlike Q where Lang gives >= c log p. This is the single ingredient the function-field route has that the Q route lacks.
  novelty_status: unverified
