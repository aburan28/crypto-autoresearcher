  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    2-adic Euclid tower: a heights-free decision procedure for dependence of two
    points on the 2-isogeny family, with the same-sign typed table as level one
  class: algorithm
  claim: >-
    E: y^2=x(x^2+Ax+B), E(Q)[2^inf]=<T> (B, D non-squares), P,Q non-torsion,
    x_P != x_Q. W = {v in F_2^2 minus 0 : aP+bQ in 2E(Q)} is computed by
    squareness tests only. Same-sign typed table, (+,+) arm: W={(1,1)} type X
    (f_P f_Q in {1,D}; relation vector odd/odd, 26 box vectors); {(0,1)} Y
    (a even, b odd; 30); {(1,0)} Z (a odd, b even; 30); all three: type W (86);
    empty: independent for ALL coefficients. (+,-): W within {(1,0)};
    (-,-): within {(1,1)}. Step: adjoin the explicit half S (IDEA-20261016-3fe347 G1) and
    replace the basis by (S,Q), (P,S) or ((P+Q)/2,(P-Q)/2); each step is an
    index-2 enlargement, so it halts (independent: Gram determinant /4 against a
    positive bound; dependent: |k|+|l| of the hidden multipliers P=kH, Q=lH
    falls, binary Euclid). Output INDEP, DEP with exact (a,b,tau), or CAP
    (unresolved). It decides coefficients beyond |a|,|b|<=8 and odd torsion
    terms: fixture E=(13,11), P=(25,155), Q=(-4,10), P+2Q=2U with U of order 3,
    has no primitive exact relation, a blind spot of the gcd=1 rule.
  mechanism: >-
    PAIR: representation = (alpha,beta) signature in E(Q)/2E(Q) plus the
    explicit halving point; operation set = index-2 enlargement
    (P,Q)->(S,Q), ((P+Q)/2,(P-Q)/2). TRICHOTOMY: partial-action (a step exists
    only if W is non-empty). LOSSY-PROJECTION TEST: E(Q)->E(Q)/2E(Q) is a
    homomorphism with infinite-index kernel, and ker beta on ker alpha is exactly
    2E(Q), so W is the exact relation-parity data. Same-sign: P=kH'+t1,
    Q=lH'+t2 with a plus generator H' gives beta(P)=k beta(H'),
    beta(Q)=l beta(H') (notes). Halving-based 2-saturation is standard (mwrank,
    Siksek, Prickett); delta = Euclid on the multiplier vector, exact relation
    output, no heights.
