idea:
  id: IDEA-20260818-17300c
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  added: '2026-08-18'
  title: >-
    THE SMOOTHNESS INPUT TO EVERY PAIRING SECURITY LABEL IS A DICKMAN VALUE
    EVALUATED ON INTEGERS THAT ARE NOT RANDOM: track the small-prime VALUATION
    VECTOR of exTNFS tower norms over the sieve region, measure its mean shift
    and its Galois-orbit CORRELATION exactly by lattice counting, and report
    which direction it moves the relation yield
  class: mechanism

  claim: >-
    Every exTNFS cost model turns norm sizes into relation counts through one
    substitution: "a norm of N bits is B-smooth with probability rho(u),
    u = N/log2 B", the Dickman-de Bruijn law for UNIFORMLY RANDOM integers of
    that size. The integers in question are not uniformly random: they are
    norms of lattice points in a fixed sieve region, taken through a fixed
    polynomial pair in a fixed degree-eta tower. Their divisibility by small
    primes is determined by the splitting of those primes in the tower and by
    the region's position, and is therefore biased and, in the tower case,
    CORRELATED ACROSS PRIMES IN A GALOIS ORBIT. Three separately falsifiable
    parts:
    (V1) MEAN SHIFT. Define alpha_tower = sum over primes p <= P of
    ( E[v_p(N) * log p] - E_random[v_p(N) * log p] ), the expected excess
    contribution of small primes to the norm, relative to the random-integer
    baseline for the same ring. Claim: |alpha_tower| >= 2 bits of effective
    norm size at P = 10^3 for the tower shapes relevant to GF(p^12), for at
    least one of the (eta,kappa) factorisations of 12. THE SIGN IS NOT
    PREDICTED, and the sign is the finding: alpha_tower < 0 means the norms are
    MORE smooth than the model assumes and the published label is OPTIMISTIC in
    the attacker's favour; alpha_tower > 0 means the label is CONSERVATIVE.
    (V2) CORRELATION. Valuations at the eta prime ideals above a rational prime
    that splits completely in the Galois closure of the tower are NOT
    independent. Claim: the variance of the small-prime log-contribution
    exceeds the independent-valuation model's variance by >= 10% at the tested
    sizes, and the excess GROWS with eta.
    (V3) YIELD TRANSFER. Substituting the measured (alpha_tower, correlation)
    for the naive rho(u) changes the model's predicted relation yield at the
    deployed parameters by a factor >= 2, i.e. >= 1 bit on the headline figure.
    NOTHING HERE ASSERTS A BREAK OF ANY DEPLOYED CURVE. Both signs of V1 are
    admissible outcomes and both are scoped methodological results about a cost
    model's input, not statements about whether BLS12-381 or BN254 is secure.

  mechanism: >-
    THE MEASUREMENT IS EXACT COMBINATORICS, NOT A SIEVE. For a rational prime
    p and a prime ideal P above it in the order the exTNFS polynomial pair
    defines, the set of sieve candidates a with v_P(N(a)) >= 1 is exactly a
    sublattice of index Norm(P) inside the candidate lattice. That is not an
    approximation -- it is the reason lattice sieving works at all. So
    E[v_P] over a region is a lattice-point count, computable in closed form up
    to a boundary term, with NO relation collection, NO factorisation, and NO
    linear algebra. The whole of V1 is therefore evaluable at the DEPLOYED
    parameters directly, which is rare in this lane: every other proposal under
    this RQ must either extrapolate from small fields or trust a formula.
    THE STRUCTURAL INGREDIENT, and why this is not arithmetic polishing. For
    classical NFS over prime fields the mean-shift quantity is standard: it is
    the root property, quantified by Murphy's alpha, computed routinely by
    polynomial-selection software (RECALLED -- see citations; this session read
    no primary source). What is not standard, as far as this program's corpus
    shows, is (a) its evaluation for the TOWER case, where the relevant object
    is a valuation at prime ideals of a degree-eta*kappa ring rather than at
    rational primes, and (b) the CORRELATION structure, which is absent from
    the prime-field story and is forced in the tower case by Galois theory:
    if the tower's Galois closure has group G and a rational prime p splits
    completely, the eta ideals above it are permuted transitively by G, so the
    valuation vector (v_{P_1},...,v_{P_eta}) is exchangeable, not independent.
    The Dickman substitution assumes independence twice over -- across primes
    and across the ideals above one prime -- and the second assumption has no
    analogue in the prime-field case that justified the first.
    WHY THIS MOVES A CONSTANT AND NOT A COFACTOR. Relation-collection cost
    enters the exTNFS balance as 1/rho(u). A shift of delta bits in effective
    norm size shifts u by delta/log2 B, and rho(u+du)/rho(u) ~ exp(-du * log u)
    to leading order, so a constant shift in norm bits produces a shift in the
    L-notation CONSTANT, not merely a constant factor -- and it feeds directly
    into the balancing equation that IDEA-20260818-1fb37d re-solves. The two
    records compose: 1fb37d moves the argmin under a changed objective, this
    one corrects the yield term of the objective itself. Neither subsumes the
    other, and running 1fb37d on an uncorrected yield term propagates this
    bias into its answer.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus greps in this worktree on 2026-08-18, bounded to four queries per
      the dispatching Coordinator's instruction: 'question_id: RQ-PAIR-f2e31f'
      over ledger/proposals with 12 lines of context, recovering title, class
      and claim head for all 13 sibling proposals; 'RQ-PAIR-f2e31f' over
      ledger/ (18 files); targeted title/claim reads of IDEA-20260816-9cfbac,
      IDEA-20260816-dd425d and IDEA-20260815-f4deca. Read in full:
      RQ-PAIR-f2e31f, IDEA-20260818-1fb37d (including its heuristic H1, which
      names this record by ID as its companion and states the gap this record
      measures). NO WEB SEARCH, NO PRIMARY-TEXT FETCH by this session.
    results: >-
      NEAREST NEIGHBOURS FOUND, and how each differs. (a) IDEA-20260816-9cfbac
      (RQ-SNFS lane) computes the exact norm BIT-LENGTH distribution over a
      fixed sieve box for special versus general polynomials -- it measures the
      SIZE of the norms and explicitly reports the SNFS advantage as a shift of
      that distribution. This record measures not the size but the
      ARITHMETIC of the norms: their divisibility by small primes at fixed
      size. The two are orthogonal and compose exactly (size shift plus
      valuation shift give the effective u), and 9cfbac's box-enumeration
      machinery is the natural implementation substrate. (b)
      IDEA-20260818-1fb37d's heuristic H1 states the gap -- "norm products over
      a sieve region are not uniformly random integers of their size ... the
      region's geometry biases them" -- and names IDEA-20260818-17300c as the
      companion record that measures it. This record is that measurement. (c)
      IDEA-20260809-172a9e measures the distribution of achievable polynomial
      selections; a per-selection alpha_tower would be a natural OBJECTIVE for
      that search, but 172a9e tracks selection quality by the model's existing
      criterion and does not define this quantity. (d) IDEA-20260815-f4deca and
      KN-OPEN-025 concern Galois symmetry as a LINEAR-ALGEBRA speedup; this
      record uses the same Galois structure for a completely different purpose
      -- the correlation of valuations in relation collection -- and claims no
      linear-algebra gain.
      NOT FOUND in the screened set: any definition or measurement of a
      root-property/alpha quantity for the tower case; any statement about
      correlation between valuations at ideals in a Galois orbit; any
      correction of the Dickman substitution for either effect.
    verdict: >-
      UNVERIFIED, AND WITH A SPECIFIC EXTERNAL RISK NAMED. The mean-shift half
      (V1) is very likely known in some form for the tower case: alpha is
      standard for classical NFS and extending it is an obvious step for anyone
      implementing exTNFS polynomial selection, and this session read no
      external source at all. The reviewer must resolve V1 against the
      literature before it is called anything but `known` or `adaptation`. The
      correlation half (V2) is the part this session believes is less likely to
      be recorded, and even that belief is unsupported. Claimed here only:
      among the sibling proposals this session read, none holds this object.

  citations:
    - ref: 'Murphy, "Polynomial selection for the number field sieve integer factorisation algorithm" (thesis, 1999); the alpha / root-property quantity as implemented in CADO-NFS'
      provenance: recalled
      claim: >-
        RECALLED ONLY, NOT SEARCHED, NOT READ: that the expected excess
        contribution of small primes to NFS norms is a standard quantity
        (alpha), that it is used as a polynomial-selection criterion, and that
        it is computed by summing per-prime expected valuations against the
        random-integer baseline p/(p^2-1) weighted by log p. THIS IS THE
        LOAD-BEARING EXTERNAL INGREDIENT FOR V1 AND IT IS RECALLED. If the
        recalled content is right, V1 for the tower case is an ADAPTATION of a
        known technique and must be labelled as such; if a tower version is
        already published, V1 is `known` and only V2 survives as new. The
        reviewer must resolve this before any novelty language is used.
      verified_by: null
    - ref: 'Canfield, Erdos, Pomerance (1983), Psi(X,B) = X * u^{-u(1+o(1))}; Dickman-de Bruijn rho'
      provenance: recalled
      claim: >-
        RECALLED: the classical smoothness density for uniformly random
        integers, uniform in a stated u-range. This is the theorem the cost
        model substitutes, and the substitution's validity for non-random
        integers is precisely what this record measures. Used as the null
        prediction, never as support for a claim about tower norms.
      verified_by: null
    - ref: 'Chebotarev density theorem'
      provenance: recalled
      claim: >-
        RECALLED, standard: the density of rational primes with each splitting
        type in a Galois extension is |C|/|G| for the corresponding conjugacy
        class. Used to predict what fraction of small primes split completely
        in the tower's Galois closure, hence how many primes contribute to the
        correlation effect of V2. A textbook statement, but marked recalled
        because this session opened no text.
      verified_by: null
    - ref: IDEA-20260818-1fb37d
      provenance: internal
      claim: >-
        Its heuristic H1 asserts the Dickman law holds IN FORM for exTNFS norm
        products over the sieve region, states explicitly that these are not
        uniformly random integers, and names this record as the companion that
        measures the bias. This record therefore supplies an input to 1fb37d
        and is not an alternative to it.
      verified_by: 'this session read ledger/proposals/IDEA-20260818-1fb37d.yaml in full on 2026-08-18'
    - ref: IDEA-20260816-9cfbac
      provenance: internal
      claim: >-
        Establishes, in the SNFS lane, that the norm bit-length distribution
        over a fixed sieve box is computable exactly by integer arithmetic
        alone, with no sieve, no relation collection and no linear algebra, and
        uses a same-degree large-coefficient polynomial as the null object.
        This record adopts that null-object design and that "exact enumeration,
        no sieve" discipline, and adds the orthogonal valuation axis.
      verified_by: 'this session read the title and the first lines of the claim block of ledger/proposals/IDEA-20260816-9cfbac.yaml via grep on 2026-08-18; it did NOT read the full record'
    - ref: KN-OPEN-025
      provenance: internal
      claim: >-
        Cited by IDEA-20260818-1fb37d and IDEA-20260815-f4deca as the open
        problem asking for which automorphism orders Galois symmetry
        accelerates TNFS linear algebra. Referenced here only to DISCLAIM
        overlap: this record uses the Galois structure in relation collection
        and claims no linear-algebra speedup.
      verified_by: 'not opened by this session; taken from IDEA-20260818-1fb37d and from the title block of IDEA-20260815-f4deca, both read on 2026-08-18. Reviewer must open knowledge/open-problems/KN-OPEN-025 before relying on it.'

  object_first_candidate:
    tracked_object: >-
      THE SMALL-PRIME VALUATION VECTOR v(a) = ( v_P(N(a)) )_{P above p, p <= P0}
      of the exTNFS tower norm at a sieve candidate a. Not the norm, not the
      norm's size, not whether the candidate yields a relation: the vector of
      exponents at the small prime ideals, followed as the candidate moves
      through the region.
    established_families_off_limits: >-
      Declared off-limits as the primary lens, because this RQ is heavily
      worked and candidates otherwise regress into variants: (F1) norm SIZE
      estimation and its distribution over a box (that is IDEA-20260816-9cfbac
      and part of IDEA-20260809-1d1734); (F2) searching for a better polynomial
      pair (IDEA-20260809-172a9e); (F3) L-notation bookkeeping at a fixed tuple
      (IDEA-20260809-1a5cb2, IDEA-20260809-240828); (F4) re-optimising the
      balance (IDEA-20260818-1fb37d); (F5) Galois symmetry as a linear-algebra
      speedup (IDEA-20260815-f4deca, KN-OPEN-025); (F6) simulation-based
      relation counting; (F7) extrapolation from record computations
      (IDEA-20260809-22a00c). This record may consume any of them and may not
      use one as its lens.
    lossiness: >-
      LOSSY-PROJECTION TEST, applied before any experiment, costing no compute.
      The projection is (sieve candidate a, with its full norm N(a)) ->
      (v_P(N(a)))_{Norm(P) <= P0}. It DISCARDS: the candidate itself, the large
      prime factors of the norm, the norm's size, and whether the candidate is
      smooth. It RETAINS: the small-prime exponents.
      The discard is COMPATIBLE with the target's operations. The operation
      that matters in relation collection is translation of the candidate by a
      lattice vector, and v_P is exactly periodic under translation by the
      index-Norm(P) sublattice: the retained part propagates deterministically
      under the very operation the sieve performs, with no reference to the
      discarded part. That is not an analogy -- it is the identity lattice
      sieving is built on.
      The projection is genuinely LOSSY: the number of candidates sharing a
      given small-prime valuation vector grows like the region volume divided
      by a product of ideal norms, so exponentially many preimages share an
      image, and the norm is NOT recoverable from the vector (its large-prime
      part is unconstrained). It is therefore not a change of coordinates --
      contrast the (Delta, Pi) example of docs/inventor-protocol.md section 2,
      where the discarded pair was recoverable as roots of a quadratic.
      WHERE THE TEST BITES: if P0 were taken up to the smoothness bound B, the
      projection would retain nearly everything for smooth candidates and the
      object would degenerate. The object is only interesting for P0 well below
      the region's diameter, which is exactly the regime where the periodicity
      is visible inside the region. That threshold is stated as the object's
      survival boundary below, not hidden.
    propagation: >-
      One-step propagation is defined and measurable in two senses, both
      reported. (i) SPATIAL: translating a by one lattice step changes v(a)
      deterministically and periodically; the resulting per-prime occupancy is
      an exact lattice-point count over the region. (ii) PARAMETRIC: enlarging
      P0 by one prime adds one block of coordinates whose expected contribution
      is computable in closed form; the running partial sum of alpha_tower as a
      function of P0 is the record's primary curve, and its convergence or
      failure to converge is itself an observable.
    survival_score: >-
      Survives for all prime ideals whose norm is below the region's diameter,
      where periodicity is realised inside the region and the counts are exact.
      DISSOLVES above that: for Norm(P) exceeding the region diameter the
      sublattice meets the region in zero or one point, the expected valuation
      becomes a boundary-term artifact rather than a structural quantity, and
      alpha's tail becomes noise. That dissolution point is measurable, is
      reported as the scope boundary of every number in the deliverable, and is
      the reason P0 is a declared parameter rather than "all small primes".
    newness_score: >-
      Genuinely-new-vs-repackaging, scored honestly and pessimistically. V1
      (mean shift): the ingredients are entirely standard for classical NFS,
      and the tower version is an obvious next step for anyone implementing
      exTNFS polynomial selection -- score ADAPTATION AT BEST, quite possibly
      KNOWN, pending an external check this session did not perform. V2
      (Galois-orbit correlation): the object has no prime-field analogue,
      because there is only one ideal above a split prime in the classical
      linear-polynomial side, so the question does not arise there -- score
      ADAPTATION, with a plausible claim to being unrecorded in this program.
      V3 (yield transfer) is bookkeeping once V1 and V2 exist. Claimed as new
      only relative to this repository.

  null_object_control: >-
    NULL 1 -- RANDOM-INTEGER ESTIMATOR CONTROL (forced, blocking). Run the
    identical alpha estimator on uniformly random integers of the same
    bit-length drawn independently of any lattice. It MUST return
    alpha ~ 0 within its own error bars. If it does not, the estimator is
    biased and nothing downstream may be reported. This is the baseline
    embedding of docs/inventor-protocol.md section 8 audit 1.
    NULL 2 -- RANDOM-POLYNOMIAL CONTROL (forced, blocking). Replace the
    deployed tower's polynomial pair by a random pair of the same degrees and
    coefficient magnitudes, keeping the region and the estimator identical.
    Predicted alpha ~ 0 and correlation ~ 0. A nonzero alpha here means the
    estimator is measuring the region or the degree, not the polynomial.
    NULL 3 -- NON-GALOIS CONTROL, the mechanism guard. Repeat V2's correlation
    measurement in a tower of the SAME degree whose Galois closure is larger
    (so few primes split completely). If the correlation excess persists at the
    same magnitude, it is NOT caused by the Galois orbit structure, the
    mechanism attribution in this record is wrong, and V2 must be restated as
    an unexplained correlation -- a controlled null on the MECHANISM even if
    the phenomenon survives.
    NULL 4 -- DECAY CONTROL, per docs/inventor-protocol.md section 3's
    structural tell. The correlation excess SHOULD decay as P0 grows, because
    large primes rarely divide any candidate and their valuations are
    effectively independent. Measure the excess as a function of P0. An excess
    that stays constant as P0 grows is the signature of an estimator artifact,
    not of structure, and is reported as such.
    NULL 5 -- REGION-TRANSLATION CONTROL. Translate the sieve region by a
    random vector and re-measure. alpha_tower should be stable up to the
    boundary term; a large change means the measurement is dominated by the
    region's position rather than by the polynomial's arithmetic, and the
    quantity is not a property of the deployed parameters.

  discriminated_from:
    - >-
        IDEA-20260816-9cfbac: measures the norm bit-length distribution over a
        sieve box (size). This record measures small-prime valuations at fixed
        size (arithmetic). Orthogonal and composable; the two together give the
        effective u, which neither gives alone.
    - >-
        IDEA-20260818-1fb37d: re-solves the balancing step under a
        communication-charged objective, and its H1 assumes the Dickman law
        holds in form. This record measures whether it does and supplies the
        correction. 1fb37d moves the argmin; this one corrects the function.
    - >-
        IDEA-20260809-172a9e: measures the distribution of polynomial-selection
        outcomes under a search budget. This record defines a NEW per-selection
        statistic; it does not search, and it evaluates the deployed selection
        rather than sampling alternatives.
    - >-
        IDEA-20260815-f4deca and KN-OPEN-025: Galois symmetry as a
        linear-algebra accelerator. Same group, different stage, no speedup
        claimed here.
    - >-
        IDEA-20260809-240828: bounds the o(1) empirically across sizes. This
        record identifies one NAMED contributor to that o(1) and measures it
        directly at deployment parameters, which is a different epistemic move
        from bounding the aggregate.

  assumptions:
    - >-
        The exTNFS polynomial pair and tower structure for GF(p^12) at the
        deployed prime can be written down explicitly. RQ-PAIR-f2e31f
        constraint 1 forbids recording any COST figure before the exTNFS
        reference and a pairing key-size paper are filed as KN-LIT entries.
        V1 and V2 are not cost figures and may be measured before that filing;
        V3 IS a cost statement and is BLOCKED on it. The record separates the
        two deliberately so that most of it can run while the filing
        (IDEA-20260818-d44bba) is outstanding.
    - >-
        The deployed prime and the tower's defining polynomials are
        transcription-checked against two independent published statements
        before any measurement, not re-derived.
    - >-
        The random-integer baseline for E[v_p] in the relevant ring is stated
        explicitly and derived, not taken from the classical prime-field
        formula by analogy. Getting this baseline wrong would produce a
        spurious alpha of either sign, which is why NULL 1 is blocking.

  proof_search_map:
    bottleneck: >-
      The Dickman substitution itself: the single step where the cost model
      replaces "probability that this particular norm is B-smooth" by
      "probability that a random integer of that size is B-smooth". Every
      published relation-yield figure, and hence every published bit level for
      a pairing target field, passes through it.
    baseline_embedding:
      parameter_slice: >-
        eta = 1 collapses the tower to the classical NFS-DL setting, where the
        measured quantity must reduce to the standard classical root-property
        value for the same polynomial. n = 1 collapses further to the
        integer-factorisation setting. Both slices must reproduce the classical
        quantity computed by an independent implementation.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, not visual: for a declared set of classical
        polynomials with published or independently computed alpha values, the
        eta = 1 slice of this record's estimator must agree to a stated
        tolerance (target: 0.05 bits). The fixture stores the polynomials and
        the expected values. A curve that "looks like" the classical alpha is
        not an embedding.
    observation_collision:
      observable: >-
        The scalar alpha_tower -- one number summarising the whole valuation
        structure, exactly as a bit level summarises a whole cost surface.
      distinct_preimage_search: >-
        DIRECTLY SEARCHED AND EXPECTED TO SUCCEED. Two polynomial pairs can
        share alpha_tower and differ completely in the VARIANCE of the
        small-prime contribution -- one concentrating its bias in the primes 2
        and 3, the other spreading it over hundreds of primes. Their smoothness
        tails then differ even though the mean shift agrees, because smoothness
        is a tail event. Constructing such a pair is cheap (search over small
        polynomials for matched alpha and mismatched variance) and its
        existence is a direct falsifier of alpha_tower's identifiability as a
        summary. The additional condition that separates the preimages is the
        full valuation-contribution distribution, which is why the deliverable
        is a distribution and its first two moments, never a single alpha.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full valuation VECTOR and its joint distribution rather
          than the scalar expected contribution, preserving more state than the
          yield correction strictly requires -- because the correlation
          structure is exactly what the scalar destroys and what survives into
          the tail behaviour.
        predicted_gain: >-
          Converts an unidentifiable summary statistic into a distribution
          whose moments separate polynomial pairs that alpha alone cannot.
      - transform: representation_reduction
        proposed_object: >-
          Re-express "expected valuation over the sieve region" as an exact
          lattice-point count over an index-Norm(P) sublattice intersected with
          the region, so the hypothesis becomes an exact counting identity plus
          a boundary term rather than a statistical estimate.
        predicted_gain: >-
          Removes sampling error from the dominant term entirely; the only
          error left is the boundary term, which is bounded separately and is
          the subject of heuristic H3.
    quantifier_order: >-
      The cost model asserts: FOR ALL candidates a in the region, Pr[N(a)
      B-smooth] = rho(u). The honest statement is: FOR EACH residue class of a
      modulo the small-prime sublattices there EXISTS a distinct smoothness
      probability, and rho(u) is their average only if the classes are equally
      weighted and independent -- which the Galois orbit structure forbids. The
      published quantifier order hides a dependence of the probability on the
      candidate's residue data, and that dependence is what V1 and V2 measure.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: for the stated polynomial pair,
        stated region, and primes up to the stated P0, the expected small-prime
        contribution and its covariance structure take the measured values, and
        substituting them into the stated yield model changes the predicted
        relation count by the reported factor. It CANNOT certify a smoothness
        probability (the large-prime part is not measured), cannot certify any
        total attack cost, cannot exclude an unmodelled algorithm, and cannot
        say anything about whether any deployed curve is secure.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL: a
        polynomial pair of the same degrees with deliberately generic
        arithmetic (NULL 2). If the method reports a comparable alpha and
        comparable correlation there, it has not identified the load-bearing
        structure and its deployed-parameter output is uninterpretable.
        Second nearby object: the non-Galois tower of NULL 3, where the
        correlation must vanish if the stated mechanism is the true one.
    proof_obligations:
      - claim: 'The random-integer baseline for E[v_P] in the tower ring is derived, not transplanted from the prime-field formula.'
        responsibility: correctness
      - claim: 'The eta = 1 slice reproduces the classical root-property value to 0.05 bits on the frozen fixture.'
        responsibility: baseline
      - claim: 'The per-prime expectation is an exact lattice count plus a bounded boundary term.'
        responsibility: correctness
      - claim: '|alpha_tower| >= 2 bits for at least one (eta,kappa) factorisation of 12.'
        responsibility: strictness
      - claim: 'Variance excess over the independent model >= 10%, growing with eta.'
        responsibility: strictness
      - claim: 'Memory and wall-clock of the enumeration stated, with the region size that fits.'
        responsibility: memory
      - claim: 'No statement about deployed-curve security is derivable from the output.'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'alpha_tower in bits of effective norm size, at P0 = 10^3, per (eta,kappa) factorisation of 12'
      direction: different
      minimum_effect: >-
        |alpha_tower| >= 2.0 bits for at least one factorisation. SIGN IS NOT
        PREDICTED and the sign carries the interpretation: negative means the
        published yield model UNDERESTIMATES the attacker's relation rate;
        positive means it overestimates it. |alpha_tower| < 2.0 bits for every
        factorisation falsifies V1 and is a genuine validation of the Dickman
        substitution's mean behaviour for this target, which must be reported
        as one.
    - metric: 'excess variance of the small-prime log-contribution over the independent-valuation model, as a percentage'
      direction: higher
      minimum_effect: '>= 10% at the tested sizes, and increasing in eta. Below 10%, or flat in eta, falsifies V2.'
    - metric: 'ratio of predicted relation yield with and without the measured correction, at the deployed parameters'
      direction: different
      minimum_effect: '>= 2 (i.e. >= 1 bit). Below 2, V3 is falsified and the correction is confirmed negligible at deployment scale.'
    - metric: 'classical slice check: eta = 1 estimator output vs the frozen fixture value'
      direction: different
      minimum_effect: 'FORCED to agree within 0.05 bits. Disagreement halts the record.'
    - metric: 'NULL 1 estimator output on uniformly random integers'
      direction: different
      minimum_effect: 'FORCED to be 0 within its error bars. Nonzero halts the record.'
    - metric: 'correlation excess as a function of P0 (NULL 4 decay control)'
      direction: lower
      minimum_effect: >-
        Must DECAY as P0 grows. An excess flat in P0 is the artifact signature
        of docs/inventor-protocol.md section 3 and voids V2 regardless of its
        magnitude.
    - metric: 'empirical B-smooth fraction at small p, against rho(u_naive) and against rho(u_effective)'
      direction: different
      minimum_effect: >-
        The corrected prediction must fit better by a stated margin (target: a
        factor 1.5 reduction in absolute relative error) at >= 3 of 4 tested
        sizes. If the naive prediction fits at least as well, the correction is
        not doing the work claimed for it even where V1 measures a shift, and
        the transfer to V3 fails.

  minimal_test:
    design: >-
      NO SIEVE IS RUN, NO RELATION IS COLLECTED, NO LINEAR ALGEBRA. Four
      stages with stop gates.
      (M1) ESTIMATOR AND BASELINE, hours: derive the random-integer baseline
      for E[v_P] in a degree-eta*kappa order; implement alpha_tower as an exact
      lattice-point count per prime ideal plus a bounded boundary term;
      validate against NULL 1 (random integers, must give 0) and against the
      frozen classical fixture at eta = 1 (must agree to 0.05 bits). STOP GATE:
      either failure halts the record and is reported as the result.
      (M2) DEPLOYED-PARAMETER MEASUREMENT, hours: evaluate alpha_tower and the
      valuation covariance for the deployed BLS12-381 tower shape, for every
      factorisation 12 = eta*kappa, over P0 in {10, 10^2, 10^3, 10^4},
      reporting the running partial sum and its convergence. Run NULL 2
      (random polynomial pair), NULL 3 (non-Galois tower), NULL 4 (decay in
      P0) and NULL 5 (region translation). This stage requires NO KN-LIT
      filing because it produces no cost figure.
      (M3) GROUND TRUTH AT SMALL p, hours to a day: at p of 20-40 bits with the
      same tower shape, enumerate candidates, factor the norms COMPLETELY by
      trial division and ECM, and compare the empirical B-smooth fraction
      against rho(u_naive) and rho(u_effective). This is the only stage that
      tests the transfer from valuations to smoothness, and it is the stage
      that can falsify the record even when M2 succeeds.
      (M4) YIELD TRANSFER, blocked on the KN-LIT filing: substitute into the
      exTNFS yield model and report the factor change in predicted relation
      count at deployed parameters, as a pair (uncorrected, corrected) with the
      correction's own uncertainty. Never as a security level.
      COST: single machine, low compute, no cluster. Memory is dominated by the
      candidate enumeration at M3 and is bounded by the declared region size.
    controls:
      - 'NULL 1 random-integer estimator control (forced, blocking).'
      - 'NULL 2 random-polynomial control (forced, blocking).'
      - 'NULL 3 non-Galois tower, mechanism guard for V2.'
      - 'NULL 4 decay of the correlation excess in P0 (artifact tell).'
      - 'NULL 5 region translation stability.'
      - 'Frozen classical fixture at eta = 1 and at n = 1.'
      - 'Transcription check of the deployed prime and tower polynomials against two independent published statements.'
    required_metrics:
      - 'alpha_tower per (eta,kappa), per P0, with the boundary-term bound stated separately.'
      - 'full distribution of the small-prime log-contribution, with its first two moments.'
      - 'valuation covariance within and across Galois orbits.'
      - 'excess variance vs the independent model, as a function of P0 and eta.'
      - 'empirical smooth fraction vs rho(u_naive) and rho(u_effective) at each tested small p.'
      - 'estimator wall-clock and peak memory, and the largest region enumerated.'
      - 'the dissolution threshold: the ideal norm above which counts become boundary-dominated.'

  falsification_conditions:
    - >-
        NULL 1 fails: the estimator returns a nonzero alpha on uniformly random
        integers. The estimator or the baseline is wrong; the record halts and
        reports that. This is the most likely early failure and it is useful.
    - >-
        Classical fixture disagreement at eta = 1 beyond 0.05 bits. The
        implementation does not reproduce the known quantity and nothing
        downstream may be reported.
    - >-
        |alpha_tower| < 2.0 bits for every factorisation of 12. V1 false: the
        Dickman substitution's mean behaviour is validated for this target,
        which is a real and reportable reassurance about the published yield
        model.
    - >-
        Excess variance < 10%, or not increasing in eta. V2 false: valuations
        behave independently enough that the tower adds nothing to the
        prime-field picture.
    - >-
        NULL 2 shows comparable alpha for a random polynomial pair. The
        measurement is of the region or the degree, not of the deployed
        parameters; controlled null, no finding.
    - >-
        NULL 3 shows the correlation persisting in a non-Galois tower. The
        stated mechanism is wrong; V2's phenomenon may survive but its
        explanation does not, and the record must say so rather than retaining
        the Galois story.
    - >-
        NULL 4 shows the excess flat in P0. Artifact signature; V2 void.
    - >-
        M3 shows rho(u_naive) fitting the empirical smooth fraction at least as
        well as rho(u_effective). The correction does not transfer to
        smoothness at the tested scale, and V3 must not be attempted.
    - >-
        Yield ratio < 2 at deployed parameters. V3 false; the correction is
        real but negligible, and the published labels are robust to it.

  confounders:
    - >-
        BASELINE ERROR MASQUERADING AS SIGNAL: an incorrect random-integer
        baseline for the tower ring produces an alpha of either sign that looks
        exactly like a finding. NULL 1 and the eta = 1 fixture are both
        blocking for this reason, and the baseline derivation is a named proof
        obligation rather than an implementation detail.
    - >-
        BOUNDARY TERMS AT LARGE IDEAL NORM: for Norm(P) near the region
        diameter the count is dominated by how the region's edge cuts the
        sublattice. Mitigated by reporting alpha as a function of P0 with the
        boundary bound stated separately, and by NULL 5.
    - >-
        SMALL-p NON-TRANSFER: the smoothness ground truth at M3 is measured at
        20-40 bit p and says nothing directly about 381-bit p. Only the FORM of
        the correction is claimed to transfer, never the value, and the
        deliverable states this on every line that crosses the boundary.
    - >-
        ETA-CONFOUNDED WITH DEGREE: increasing eta increases both the orbit
        size and the total degree, so a variance trend in eta may be a degree
        effect. Mitigated by comparing towers of equal total degree and
        different eta, which the factorisations of 12 supply directly
        (2*6, 3*4, 4*3, 6*2).
    - >-
        SELECTION EFFECT IN THE POLYNOMIAL: the deployed tower polynomials were
        chosen for arithmetic efficiency, and efficiency criteria correlate
        with small-prime structure. A measured alpha is therefore not evidence
        that anyone chose it; the record reports the quantity and makes no
        claim whatever about intent.

  interpretation_limits:
    - >-
        NO ATTACK IS MOUNTED, NO DISCRETE LOGARITHM IS ATTEMPTED, and no
        statement that any deployed curve is broken or safe may be derived.
        Even alpha_tower < 0 with a factor-4 yield change is a scoped
        methodological result about one input to a cost model.
    - >-
        Every figure is scoped to the stated polynomial pair, region, P0, and
        tower factorisation. A different polynomial selection has a different
        alpha, and this record measures the deployed selection only.
    - >-
        The ground-truth stage is toy scale and never becomes a crypto-scale
        claim; it tests whether a correction measured exactly transfers to
        smoothness, and nothing else.
    - >-
        Exactness of the lattice count is exactness of a COUNT, not of a
        smoothness probability. The large-prime part of the norm is never
        measured here and carries all the remaining uncertainty.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR the exTNFS tower norms at the deployed parameters, CONDITIONAL on
        the small-prime valuation vector up to P0, the remaining cofactor
        behaves like a uniformly random integer of its size with respect to
        B-smoothness, so Pr[N B-smooth] = rho(u_eff)(1+o(1)) with
        u_eff = (log2 N - alpha_tower)/log2 B, uniformly over the region in the
        stated u-range.
      rigorous_support: >-
        Rigorous ingredient: Canfield-Erdos-Pomerance,
        Psi(X,B) = X * u^{-u(1+o(1))} uniformly in a stated u-range, for
        UNIFORMLY RANDOM integers. THE GAP, stated rather than hidden: the
        cofactor after removing small primes is not a uniformly random integer
        either -- it is a norm form value with the small part divided out, and
        its distribution inherits whatever structure lives above P0. H1 asks
        only that ALL the structure worth correcting lives below P0, which is
        exactly what the convergence of the alpha partial sum in P0 tests.
        This assumption imitates the classical practice of correcting u by
        alpha and then applying Dickman unchanged.
      validation_plan: >-
        SAMPLE: at p of 20, 28, 34 and 40 bits with the same tower shape,
        enumerate 10^5-10^6 candidates per parameter point over the exact
        region; factor each norm completely by trial division to 10^6 then ECM,
        declaring failure only when a composite cofactor exceeds B^2 (recorded,
        not silently dropped). COMPARE: the empirical B-smooth fraction against
        rho(u_naive) and against rho(u_eff) using the alpha measured at the
        same parameters -- a two-sided comparison in which the naive model can
        win. TAIL CHECK: the smoothest observed sample's u against its
        predicted extreme probability, for both models. TRANSFER ASSUMPTION,
        STATED: only the FORM of the correction is assumed to transfer from
        20-40 bit p to 381-bit p; the VALUE of alpha is re-measured at the
        deployed parameters directly (which M2 can do exactly) and never
        extrapolated.
      falsification_condition: >-
        rho(u_eff) failing to beat rho(u_naive) in absolute relative error at
        2 or more of the 4 tested sizes, or the corrected prediction departing
        from the empirical fraction by more than a factor 1.5 with the
        departure GROWING in p across the tested range. A departure that
        shrinks with p is a small-p artifact and is reported as such.
    - id: H2
      statement: >-
        FOR a rational prime p splitting completely in the Galois closure of
        the degree-eta*kappa tower, the valuation vector
        (v_{P_1}(N),...,v_{P_eta}(N)) at the ideals above p is EXCHANGEABLE
        under the Galois action, and vectors at distinct rational primes are
        independent. The density of such completely split primes is |{1}|/|G|
        = 1/|G| by Chebotarev, so the fraction of small primes exhibiting the
        effect is predicted, not fitted.
      rigorous_support: >-
        Rigorous ingredient: the Chebotarev density theorem gives the density
        of each splitting type exactly, and the Galois action permutes the
        ideals above a rational prime transitively, which forces the
        exchangeability of the SET of valuations. THE GAP: exchangeability of
        the multiset is a symmetry statement; it does NOT by itself give the
        joint distribution, and the assumption that inter-prime independence
        survives is imitating the classical convention with no theorem behind
        it.
      validation_plan: >-
        SAMPLE: at small p, enumerate candidates and record the full joint
        empirical distribution of the valuation vector at each completely split
        rational prime up to 10^3, at least 10^5 candidates per point. COMPARE:
        chi-square against (a) the exchangeable model and (b) the fully
        independent model; report both p-values. Independently, compare the
        OBSERVED fraction of completely split primes below 10^3 against the
        Chebotarev prediction 1/|G|, which is a check on the tower's Galois
        group as implemented. TAIL CHECK: the joint cell with the largest
        observed-over-expected ratio, and the largest eta tested, where the
        assumption is weakest by construction. TRANSFER ASSUMPTION, STATED: the
        exchangeability is a structural claim expected to be p-independent; the
        MAGNITUDE of the correlation is measured separately at deployed
        parameters and is not transferred from small p.
      falsification_condition: >-
        Chi-square rejecting exchangeability at p < 0.01 at two or more tested
        sizes with the deviation growing in p; OR the observed completely split
        fraction departing from 1/|G| by more than 3 standard errors, which
        would indicate the implemented tower is not the intended one.
    - id: H3
      statement: >-
        FOR the sieve region and every prime ideal P with Norm(P) below the
        region diameter, the number of region points in the index-Norm(P)
        sublattice equals Volume(region)/Norm(P) up to a boundary term bounded
        by C * Surface(region) * (covering radius), with C stated and
        independent of P in the tested range.
      rigorous_support: >-
        Rigorous ingredient: the standard lattice-point-count error bound for a
        convex body -- points in a convex region equal volume over determinant
        plus an error controlled by the surface area and the successive minima.
        THE GAP: the constant C depends on the region's shape and on the
        sublattice's skewness, and exTNFS sieve regions are skewed by design,
        so a bound proved for balls is being applied to a skewed box.
      validation_plan: >-
        SAMPLE: for a declared set of ideals spanning Norm(P) from 2 to the
        region diameter, count region points in the sublattice EXACTLY by
        enumeration at small region sizes, and compare against
        Volume/Norm(P). COMPARE: the observed error against the claimed bound;
        fit C and report it. TAIL CHECK: the largest Norm(P) tested, where the
        boundary term dominates, and the most skewed sublattice. TRANSFER
        ASSUMPTION, STATED: the fitted C is used only to bound the reported
        error bars on alpha_tower and never to correct its value.
      falsification_condition: >-
        Observed error exceeding the claimed bound for any tested ideal, or a
        fitted C that grows with Norm(P). Either restricts P0 to the range
        where the bound holds, and the restricted P0 is reported as the
        measurement's scope rather than as a failure.

  target_complexity:
    time_exponent: >-
      The object is the constant c in L_Q[1/3, c] for Q = p^12, NOT the 1/3.
      This record does NOT assert a value for a corrected c, and guessing one
      would be the fabrication AGENTS.md rule 5 forbids. What it asserts is the
      MECHANISM by which c would move: relation-collection cost enters the
      balance as 1/rho(u), and a shift of delta bits in effective norm size
      shifts u by delta/log2 B, giving a yield ratio of
      rho(u - delta/log2 B)/rho(u) ~ exp((delta/log2 B) * log u) to leading
      order. The record's job is to produce delta at deployed parameters; the
      conversion to c is then arithmetic inside the balancing equation that
      IDEA-20260818-1fb37d re-solves. Baseline for comparison (RECALLED,
      reviewer must resolve): c = (48/9)^{1/3} ~ 1.747 general,
      c = (32/9)^{1/3} ~ 1.526 special-form.
    memory_exponent: >-
      THE MEASUREMENT'S OWN MEMORY IS SMALL AND IS STATED RATHER THAN ASSUMED:
      alpha_tower at deployed parameters is a sum over at most |{ideals with
      norm <= P0}| closed-form counts, so memory is O(P0) numbers -- megabytes
      at P0 = 10^4, with no communication and no sequential depth. The
      small-p ground-truth stage (M3) stores 10^5-10^6 factored norms per
      parameter point, order 1 GB, single machine. THE DOWNSTREAM memory effect
      is the point: a yield correction of factor f changes the number of
      relations needed and hence the matrix dimension N, so the corrected
      memory exponent is the incumbent's shifted by the same delta in c_B.
      This record reports the shift in the INPUT; IDEA-20260809-1a5cb2 and
      IDEA-20260818-1fb37d hold the machinery that converts it to a memory
      figure, and this record must not state one on its own.
    best_known: >-
      Incumbent frontier rows checked for domination. (i) exTNFS in the target
      field, L_Q[1/3,(48/9)^{1/3}], RECALLED. (ii) SexTNFS for special-form p,
      L_Q[1/3,(32/9)^{1/3}], RECALLED -- the row that plausibly applies to
      BLS/BN primes and the subject of IDEA-20260809-1d1734. (iii) The Kim-Jeong
      arbitrary-composite-degree extension, KN-LIT-3742, corpus title record.
      (iv) The published post-exTNFS key-size re-estimates, RECALLED. (v) The
      Galois linear-algebra speedup of KN-LIT-7643. (vi) The lattice sieving of
      KN-LIT-4634. THIS RECORD IMPROVES NONE OF THEM. It measures a correction
      to an input every one of them shares.
      On the specific axis of "root property / alpha for the tower case", the
      dominating row is UNKNOWN rather than absent: the classical prime-field
      quantity certainly dominates the eta = 1 slice, and whether a tower
      version is published is exactly what this session could not check.
    hidden_overhead: >-
      Substantial and named. (a) The random-integer baseline for the tower ring
      is derived here and could be wrong in a way that produces a spurious
      alpha of either sign -- NULL 1 and the classical fixture exist for this
      and are blocking. (b) The transfer from a valuation correction to a
      smoothness probability is heuristic H1 and is only tested at 20-40 bit p.
      (c) The o(1) in L at Q = 12*381 = 4572 bits is not small, and a bit figure
      derived from asymptotics at that size inherits all of it
      (IDEA-20260809-240828 is the record that quantifies it). (d) alpha is a
      MEAN, and smoothness is a TAIL event; the observation-collision analysis
      above shows the mean does not determine the tail, which is why the
      deliverable is a distribution.
    tradeoff_note: >-
      No time-memory tradeoff exists in the measurement itself: it is a sum of
      closed-form counts, embarrassingly parallel over primes, with no
      communication and no sequential depth beyond the final sum. The
      DOWNSTREAM tradeoff is the one the correction feeds: a yield correction
      moves the optimal smoothness bound B, and moving B trades sieving time
      against matrix size, memory and traffic -- which is precisely the
      frontier IDEA-20260818-1fb37d is built to map. The two records should be
      run in that order.

  obstruction:
    statement: >-
      ANTICIPATED, TO BE MEASURED, NOT ASSERTED. The likely obstruction is
      CONCENTRATION: alpha_tower may be dominated by the two or three smallest
      rational primes, in which case the tower structure contributes nothing
      beyond the classical root property of the underlying polynomial, the
      correlation effect has too few contributing primes to matter, and the
      object dissolves into a known quantity. That dissolution is a property of
      the object, not of the attempt.
    quantity: >-
      The concentration profile of alpha_tower: the fraction of |alpha_tower|
      contributed by rational primes <= 10, by 10 < p <= 10^2, by
      10^2 < p <= 10^3, and by 10^3 < p <= 10^4; together with the number of
      completely split primes in each band.
    value: >-
      NOT YET MEASURED. Recording a value before the run would be fabrication
      under AGENTS.md rule 5.
    measured_by: []
    scope: >-
      To be claimed only for the stated polynomial pair, the stated tower
      factorisations of 12, the stated region, and P0 <= 10^4. Nowhere else.
    resource_check:
      examined: true
      reading: >-
        READ AS A RESOURCE, NOT A NUISANCE. Concentration at tiny primes is an
        ASSET for polynomial selection: a statistic dominated by the primes 2,
        3 and 5 is evaluable in microseconds, which makes it usable as a
        screening objective inside a large search rather than as a post-hoc
        diagnostic. The theory that wants that measurement is exactly
        IDEA-20260809-172a9e's distribution-over-selections study, which needs
        a cheap per-candidate quality score to sample the tail of achievable
        selections at all; a concentrated alpha supplies one and a diffuse
        alpha does not. Second reading: a diffuse alpha with many contributing
        split primes is the regime where V2's correlation effect has enough
        support to matter, so the two possible outcomes hand the work to two
        different successors rather than closing it. If neither successor takes
        it up, that is recorded honestly and is not a closure.
      spawned_ids: []

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES against the
    frontier named in target_complexity.best_known.
    AS AN ATTACK: n/a -- no attack is proposed and no algorithm is offered, so
    every frontier row dominates trivially.
    AS A COST MODEL FOR GF(p^12): dominated by the published exTNFS/SexTNFS
    analyses and by the published key-size re-estimates on the time axis, since
    those state a constant and this record states only a correction to one
    input.
    AS A ROOT-PROPERTY / VALUATION-BIAS MEASUREMENT: DOMINATED for the
    classical prime-field case by the standard alpha quantity and its existing
    implementations (RECALLED; this session read no source, so this domination
    is asserted on recollection and the reviewer must confirm it). For the
    TOWER case with the Galois-orbit correlation, no dominating row was
    identified in the screened corpus -- but the screen was bounded and no
    external search was run, so the honest label is UNKNOWN, not absent.
    ON THE MEMORY AND COMMUNICATION AXES: the measurement is trivially cheap
    and dominates nothing; it is not competing there.
    NOT NULL ON ANY AXIS.
  sota_delta: >-
    QUANTITATIVE, AND A PREDICTION RATHER THAN A RESULT. No exponent is
    improved: the 1/3 does not move and no corrected c is claimed. Predicted
    deliverable versus incumbent: alpha_tower in bits, with its full
    contribution distribution and its covariance structure, for each of the
    four nontrivial factorisations of 12 at the deployed parameters, against an
    incumbent that states NO value for this quantity in the tower case anywhere
    in this program's corpus; a variance excess predicted at >= 10% against an
    incumbent independence assumption of exactly 0%; and a yield ratio
    predicted at >= 2 against an incumbent ratio of 1 by construction. If every
    prediction fails, the delta is a validated Dickman substitution for this
    target with the numbers that validate it -- which this program also does
    not currently hold.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that the estimator passes NULL 1 and the classical eta = 1 fixture on
    a first attempt; the baseline derivation for the tower ring is the hard
    part and the likeliest halt. 0.7 that |alpha_tower| >= 2 bits for at least
    one factorisation, CONDITIONAL on the estimator passing -- polynomial pairs
    chosen for arithmetic convenience usually have non-generic small-prime
    behaviour. 0.35 that V2's correlation excess reaches 10% AND survives NULL
    3 and NULL 4; this is the novel half and the likeliest to be a controlled
    null. 0.45 that the yield ratio reaches 2 at deployed parameters. 0.5 that
    H1's small-p ground truth shows the corrected model beating the naive one
    at 3 of 4 sizes.

  blocked_on: >-
    Stage M4 only (the yield-transfer figure) is blocked by RQ-PAIR-f2e31f
    constraint 1, which forbids recording a cost figure before the exTNFS
    reference and a pairing key-size estimation paper are filed as KN-LIT
    entries -- the filing that IDEA-20260818-d44bba performs. Stages M1-M3
    produce no cost figure and are NOT blocked, which is why the record is
    staged this way: most of it is executable today, on one machine, without
    primary-source retrieval.

