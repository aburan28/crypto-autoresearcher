idea:
  id: IDEA-20260930-a6491b
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE SUBSET DOOR IS CLOSED AT THE EXPONENT FOR BOUNDED-DEGREE SUBSETS:
    restricting a cheap coordinate predictor to a cheaply decidable subset S of
    a prime-order subgroup buys a restricted advantage of at most
    c D L^2 sqrt(p) / |S| (the Weil-level correlation bound of
    IDEA-20260905-b6154d applied to 1_S times g), while every usable sample
    costs N / |S| re-randomisations and eps^(-2) samples are needed by
    information, so the product is at least sqrt(N) / polylog uniformly in |S|
    with the two regimes meeting exactly at |S| = sqrt(N) -- the escape the RQ
    names ("concentration on a structured subset of points") is available only
    to subsets cut out by high-degree conditions, of which the deformation
    digit of IDEA-20260930-8e3b75 is the first with an algebraic handle;
    measured as a thin-set obstruction ladder on the census instrument
  class: mechanism

  claim: >-
    REPRESENTATION CLASS AND STAGE. Class R1 (affine coordinates, the trivial
    field representation); attack stage: collision structure, specifically the
    route "coordinate distinguisher restricted to a structured subset leaks
    into key recovery"; the claimed change to the charged cost of that route
    is ZERO at the exponent for every subset defined by a bounded-degree
    coordinate condition, and the record's content is the inequality, its two
    nearby objects where it fails, and a measured obstruction ladder.

    (A) THE SETTING AND THE TWO COSTS. G = <P> of odd prime order N in
    E(F_p), N about p. A subset S of G is CHEAPLY DECIDABLE AT BOUNDED DEGREE
    if its indicator 1_S lies in the class C(D, L) of IDEA-20260905-b6154d
    (a function Phi(f_1, ..., f_j) of rational coordinate functions of
    degree at most D with an F_p-additive-character expansion of l^1 norm at
    most L, or a multiplicative character of such an f_i); x-intervals,
    residue classes of x, low bits, Legendre symbols of x + c and their
    Boolean combinations are all in it with D, L = polylog(p). Write sigma =
    |S| / N. Let g in C(D, L) be a predictor and define the RESTRICTED
    ADVANTAGE at frequency a as eps_S(a) = |sum over W in S of g(W)
    chi_a(W)| / |S|. Two costs attach to using g on S against a target Q:
    (COST-1, hitting) obtaining one sample W = Q + uP with W in S by
    re-randomisation costs 1/sigma group operations in expectation, and no
    cheaper hitter is known for a bounded-degree S (a sub-rejection hitter
    for an x-window IS a relation oracle for the window factor base, priced
    by KN-FIND-007 and IDEA-20260808-486ae2, and none beats 1/sigma);
    (COST-2, information) a per-sample bias eps carries O(eps^2) bits about
    the target predicate, so recovering Omega(1) bits needs Omega(eps^(-2))
    samples, independent of any amplification exponent.

    (B) THE CEILING ON THE SUBSET, CONDITIONAL ON b6154d (B). 1_S times g is
    again a bounded-degree coordinate function with l^1 norm at most L^2, so
    b6154d's recalled Weil-level bound gives |sum over S of g chi_a| <=
    c j D L^2 sqrt(p), hence
        eps_S(a) <= c j D L^2 sqrt(p) / |S| = c j D L^2 / (sigma sqrt(N)).
    This is informative exactly when sigma >= c j D L^2 / sqrt(N), i.e. for
    |S| above about sqrt(N) polylog, and vacuous below it (the THIN regime).

    (C) THE PRODUCT INEQUALITY. Total cost >= (1/sigma) * eps_S^(-2). In the
    informative regime (B) gives eps_S^(-2) >= sigma^2 N / (c j D L^2)^2, so
    cost >= sigma N / (c j D L^2)^2; in the thin regime cost >= 1/sigma >
    sqrt(N) / polylog trivially. Minimising over sigma, the two bounds meet at
    sigma* = (c j D L^2) / sqrt(N), and
        cost >= sqrt(N) / (c j D L^2)   for EVERY bounded-degree S.
    The subset route is therefore at best a polylog improvement over rho for
    the bounded-degree class, and the RQ's "concentration by a factor
    p^(1/4) above the Weil level on a structured subset of points" cannot be
    bought by any subset in that class. The random model predicts much more:
    for a random subset the restricted spike is at the Gumbel level
    sqrt(2 log N / |S|), so eps_S^(-2) / sigma = N / (2 log N) at EVERY size,
    far above the floor.

    (D) THE TWO NEARBY OBJECTS WHERE THE CONCLUSION FAILS, EACH AT A NAMED
    HYPOTHESIS. (D1) The kernel of the 2-descent character on a cyclic curve
    of order 2q with rational 2-torsion: S = {W : Legendre(x(W) - e) = +1} has
    sigma = 1/2 and eps_S = 1 at the frequency q; the hypothesis that fails is
    "N odd prime" (the Kummer sheaf matches a Lang torsor), exactly b6154d's
    (D1), and the instrument must read cost = 2 there. (D2) The discrete-log
    interval S' = {W : log_P(W) in [0, sigma N)}: eps = 1 for the full-log
    predicate, and membership is decided by a kangaroo in 2 sqrt(sigma N)
    steps; the hypothesis that fails is "bounded degree" (S' is not in
    C(D, L)); the inequality does not apply, and the honest cost
    (hitting plus membership) is 2 sqrt(sigma N) / sigma >= 2 sqrt(N),
    minimised at sigma = 1 where it IS the kangaroo on the whole group. A
    derivation that forbade (D2) would prove too much.

    (E) WHAT REMAINS OPEN, AND WHICH SUBSET TO MEASURE FIRST. By (C) the
    only subsets that can concentrate beyond the floor are those cut out by
    conditions of degree at least about sqrt(p): walk itinerary classes
    (IDEA-20260905-9c4f0c), bit-defined families (popcount, digit sums; the
    families I and J that KN-FIND-ffe1df leaves open), and digit-defined sets
    {W : delta(W) < B} for a canonical fast high-degree digit. Among these the
    deformation digit delta_KS of IDEA-20260930-8e3b75 is the first whose
    sumset structure has an ALGEBRAIC handle -- delta(P + Q) = delta(P) +
    delta(Q) + c(P, Q) with c of bounded degree -- so it is the one
    high-degree subset family this record puts on the ladder beside the
    bounded-degree ones. Subsets defined by coordinate-INDEPENDENT iterates
    (x of [k]W, of W + T, of phi(W) for an F_p-rational isogeny) are closed
    at zero compute by equivariance: their restricted spectra are
    permutations and phases of the base function's spectrum, so they inherit
    the bound of (B) with the same constants.

    TWO EXPLANATIONS DISCRIMINATED. E-FLOOR: every bounded-degree subset on
    the ladder sits at the random level (restricted spike within a factor 2
    of the Gumbel level, product within a factor 2 of N / (2 log N)) at every
    size, and so does the digit-defined family -- the subset door is closed
    for the tested classes with a measured obstruction and the thin-set
    meeting point exhibited. E-CONCENTRATION: some subset family has its
    product below N^(3/4) at every size with a decreasing fitted exponent and
    the random subset of equal size does not -- a localiser, routed to
    IDEA-20260905-9c4f0c's arc-concentration readout and to replication
    before any exploit is modelled.

  mechanism: >-
    OBJECT FRAME. THE PAIR: representation = affine coordinates (x, y)
    (class R1, trivial; the subsets are predicates on them); operation set
    Sigma = re-randomisation W |-> W + uP by KNOWN u (translation by known
    multiples of the generator) together with the frozen subset predicate and
    the frozen predictor. Sigma is not the full translation action as an
    unknown operation: the walk's bookkeeping knows u, and on the tracked
    object it acts by phases. TRICHOTOMY: Class III, coordinate-dependent,
    one-line reason: membership in S and the value of g are functions of the
    representation, not of the group element, and neither propagates under
    translation by an unknown element (a bounded-degree S is not a block
    system of anything, IDEA-20260901-863e36 (C1)). LOSSY-PROJECTION TEST
    AGAINST SIGMA: the tracked object is the pair (membership bit of W, the
    restricted spectral magnitudes |(1_S g)^(a)|); it discards the point and
    all N phases; under re-randomisation by a known u the magnitudes are
    invariant and the membership bit is re-drawn, which is exactly what the
    hitting cost charges; lossy and compatible, with the compatibility being
    the content of COST-1. THE PRICED OPEN NUMBER: for a Class III object the
    classification leaves open its concentration; here it is the product
    C(S) = eps_S^(-2) / sigma, bounded below by sqrt(N) / polylog in (C) and
    predicted at N / (2 log N) by the random model; the ladder measures it.
    OFF-LIMITS COMPONENTS NAMED: F1 (the walk) supplies the re-randomisation
    step as a component; F2's window factor base is the nearby object for the
    hitting cost (a cheaper hitter for an x-window would be a relation
    oracle); neither is the lens. What is added: the restricted-advantage
    bound, the hitting-times-information product, the exact meeting point at
    |S| = sqrt(N), the two nearby objects, the equivariance closure of
    coordinate-independent iterates, and the placement of the digit-defined
    subset as the first high-degree family with an algebraic handle.

    WHY THE PRODUCT IS THE RIGHT QUANTITY. The RQ's own arithmetic says a bias
    eps needs eps^(-2) samples and that a p^(-1/2) bias on the whole group is
    therefore useless; the escape it names is to make the bias large on a
    subset. But a subset is paid for twice: once because the bias bound
    scales as 1/|S| (the Weil sum does not shrink when the summation set
    does), and once because samples in S are rarer by 1/sigma. The two
    factors multiply to a quantity that is minimised exactly where the Weil
    bound stops being informative, and at that point the trivial hitting
    cost alone is already sqrt(N). This is the same "off by a square"
    correction b6154d records for the whole group, applied once more to the
    subset.

    WHY THE EQUIVARIANCE CLOSURE IS FREE. For a fixed scalar k, translation T
    or F_p-rational isogeny phi, the function g composed with [k], with
    translation by T, or with phi has DL-spectrum g^(a / k), e(a t / N) g^(a),
    or the spectrum of g on the isogenous curve at the same frequency; the
    restricted spectrum of 1_S composed with the same map is the spectrum of
    the pulled-back subset, whose indicator is still bounded-degree in the
    pulled-back coordinates. No new concentration can appear; the degree of
    the composite is irrelevant because the bound is applied before
    composition. Only coordinate-DEPENDENT iteration (the branch chosen from
    the point, 9c4f0c) escapes this, which is why 9c4f0c remains open.

    STAGE 0 (zero compute, HARD GATE). Write (A)-(D) with numbered steps; run
    the derivation on (D1) and (D2) and record the step at which it breaks on
    each (it must break at "N odd prime" on (D1) and at "bounded degree" on
    (D2) and nowhere else). STAGE 1 (hours). The ladder of claim (E) on the
    census instrument of EXP-ECDLP-184fc4: for each subset family and size,
    compute the restricted spectrum of 1_S and of 1_S times each library
    predictor, read the restricted max spike, form C(S), and compare with the
    random subset of the same size through the identical code path. STAGE 2
    (only if E-CONCENTRATION fires). Arc concentration of the logs of the
    offending subset (9c4f0c's statistic), replication at a further size and
    seed, independent review.

