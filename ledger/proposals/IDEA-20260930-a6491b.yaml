  assumptions:
    - >-
      N is an odd prime of large embedding degree (the hypotheses of b6154d
      (B)); (D1) and (D2) are the named failures of those hypotheses and are
      used as controls.
    - >-
      "Cheaply decidable" means evaluable from affine coordinates in polylog(p)
      field operations; the record's closure is for the bounded-degree
      sub-class only, and the fast high-degree sub-class is explicitly left
      open and partly populated by name.
    - >-
      The hitting cost is charged as rejection sampling at 1/sigma; the only
      escape (a sub-rejection hitter) is named as a relation oracle and is
      not assumed absent, only priced elsewhere.
    - >-
      OFF-LIMITS COMPONENTS: F1 supplies the re-randomisation step; F2's
      window base is the nearby object for the hitter; the census instrument
      of f31bc4 is reused.

  proof_search_map:
    bottleneck: >-
      The inequality cost >= eps_S^(-2) / sigma >= sqrt(N) / polylog for
      every bounded-degree S. Its failure for some S by a factor N^(1/4) is
      the only event that would make the subset route cheaper than rho; its
      holding closes the point half of the RQ's escape for the class.
    baseline_embedding:
      parameter_slice: >-
        S = G (sigma = 1): the inequality reduces to b6154d (C2)'s whole-group
        statement, cost >= eps^(-2) >= N / polylog. This is the exact old
        boundary and must be reproduced symbolically.
      reproduction_check: >-
        Symbolic: set sigma = 1 in (C) and recover b6154d (C2). Frozen fixture:
        on (D1) the derivation must break at "N odd prime" and the instrument
        must read eps_S = 1 at sigma = 1/2, cost 2; on (D2) it must break at
        "bounded degree" and the honest cost must reproduce the kangaroo at
        sigma = 1.
    observation_collision:
      observable: >-
        The pair (sigma, restricted max spike over a != 0 of |(1_S g)^(a)| /
        |S|) and the product C(S), per subset family and size.
      distinct_preimage_search: >-
        A random subset and a bounded-degree subset of equal size are
        predicted to have the same observable (both at the Gumbel level);
        the observable therefore cannot distinguish "structured but
        unconcentrated" from "random", and the record never claims it does:
        a null here is "no concentration", not "no structure". The dangerous
        collision is between "thin and concentrated" and "thin and noisy":
        for |S| below sqrt(N) the Gumbel level sqrt(2 log N / |S|) is itself
        large, so a high restricted spike on a thin set is expected and is
        only a signal if it exceeds the random subset's by a factor growing
        with N.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Split the cost into two charged factors (hitting, information) over
          the two regimes (Weil-informative, thin), each bounded separately,
          and multiply; the meeting point sigma* is where the two charges are
          equal.
        predicted_gain: >-
          A uniform floor sqrt(N) / polylog from two elementary bounds; no
          exponent moves.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the class from bounded-degree subsets to digit-defined
          subsets {delta_KS < B} and ask whether the restricted spike exceeds
          the random level; the first high-degree family with an algebraic
          handle.
        predicted_gain: >-
          Either the floor extends to the first high-degree family (predicted)
          or a localiser is found (not predicted).
    quantifier_order: >-
      FOR ALL E/F_p, FOR ALL odd-prime-order subgroups of large embedding
      degree, FOR ALL S with 1_S in C(D, L), FOR ALL g in C(D, L), FOR ALL
      a != 0: eps_S(a) <= c j D L^2 / (sigma sqrt(N)) and total cost >=
      eps_S(a)^(-2) / sigma >= sqrt(N) / (c j D L^2). D, L are fixed before S
      and g are chosen; choosing S after seeing a spectrum is excluded by the
      frozen ladder. THE WEAKER READING NOT CLAIMED: "for all cheaply
      decidable S" -- false by (D2) and open for itineraries and digits.
    method_ceiling:
      strongest_certifiable_claim: >-
        Conditional on b6154d's recalled bound: a derivation-level closure of
        the subset route for bounded-degree subsets and predictors at the
        exponent, plus a measured ladder showing the product at the random
        level for the declared families at toy scale. It certifies nothing
        about high-degree subsets beyond the ones on the ladder, nothing
        about adaptive combinations, and nothing at cryptographic scale.
      nearby_object_control: >-
        (D1) the 2-descent kernel on an even-order curve, where eps_S = 1 at
        sigma = 1/2 and the cost is 2; (D2) the discrete-log interval, where
        the inequality does not apply and the honest cost is the kangaroo. A
        method that cannot see (D1) as cheap or that forbids (D2) has not
        identified the load-bearing hypotheses (odd prime order; bounded
        degree).
    proof_obligations:
      - claim: 1_S times g lies in C(D, L^2) for 1_S, g in C(D, L), so b6154d (B) applies with l^1 norm L^2.
        responsibility: correctness
      - claim: Omega(eps^(-2)) samples are necessary by information, independent of amplification.
        responsibility: correctness
      - claim: Rejection hitting costs 1/sigma and a cheaper hitter for an x-window is a relation oracle for the window base.
        responsibility: runtime
      - claim: The minimum over sigma of max(sigma N / c^2, 1/sigma) is sqrt(N) / c at sigma = c / sqrt(N).
        responsibility: strictness
      - claim: The derivation breaks on (D1) at odd prime order and on (D2) at bounded degree and nowhere else.
        responsibility: baseline
      - claim: Coordinate-independent iterates give restricted spectra that are permutations and phases of the base spectra.
        responsibility: scope
    not_applicable_reason: null

