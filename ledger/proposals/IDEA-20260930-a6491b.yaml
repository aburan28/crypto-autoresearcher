      24}, three seeds each (one PCG64 stream per size, recorded), with
      tabulated logs; one cyclic even-order curve of order 2q per size for
      (D1). SUBSET FAMILIES (frozen before any log is read): x-intervals
      S_j = {x < p / 2^j} for j = 0 .. ceil(log2(p)/2) + 3; residues
      {x = 0 mod 2^j} for j = 1 .. ceil(log2(p)/2); the digit family
      {delta_KS < p / 2^j} for the same j (delta_KS as defined in
      IDEA-20260930-8e3b75, direction (1, 0), vertical reference); for each
      subset a seeded uniformly random subset of G of identical size (null);
      the 2-descent kernel on the even-order curve (positive control); the
      discrete-log interval {log < sigma N} at sigma = N^(-1/2) with its
      kangaroo membership cost charged (proves-too-much check, reported, not
      scored). PREDICTORS: g = 1 (the indicator itself) and the library
      {Legendre(x), low bit of x, Legendre(y)}.
      INSTRUMENT. EXP-ECDLP-184fc4's census code path: for each (subset,
      predictor), the length-N FFT of 1_S times g in the DL ordering; read
      the max spike over a != 0, divide by |S|; form C(S); identical code
      path and hash for object and null.
      PROCEDURE. (0) Stage 0 note with the (D1)/(D2) break points. (1) The
      (D1) control at each size (blocking). (2) The ladder: all families, all
      sizes, all predictors; per cell the restricted spike, its ratio to the
      null, C(S), the Weil-informative flag. (3) The meeting point per size.
      (4) Fits: exponent of min_j C(S_j) in N per family; slopes of the
      spike ratio in log p.
      OUTCOME TABLE. E-FLOOR: every family within band at every size -- the
      subset door is closed for bounded-degree subsets with a measured
      obstruction (the product at N / (2 log N) at every size, the meeting
      point exhibited) and the digit family reported as a controlled null.
      E-CONCENTRATION: a family below N^(3/4) at every size with decreasing
      exponent and the null not -- route to 9c4f0c's arc statistic, replicate
      at a fourth seed and a further size, independent review; no exploit is
      modelled before that. ARTIFACT: the (D1) control missed, or a spike
      ratio that does not decay with the parameter meant to destroy it (p)
      on the null as well -- run void.
      FALSIFICATION THRESHOLD, FIXED NOW. E-FLOOR is falsified iff some
      family's spike ratio to the null is >= 4 at every size; E-CONCENTRATION
      is falsified iff every family's ratio is <= 2 at every size.
      COST (estimate, order of magnitude): implementation low (subset masks
      and a loop on the existing census); compute low (one FFT of length
      2^24 per cell, a few hundred cells, under a few CPU-hours). Not a
      measurement.
    controls:
      - (D1) 2-descent kernel on an even-order curve, eps_S = 1 at sigma = 1/2 (blocking positive control).
      - Seeded random subset of identical size for every subset on the ladder, identical code path (blocking null).
      - (D2) discrete-log interval with kangaroo membership charged (proves-too-much check; reported).
      - Whole-group slice sigma = 1 reproducing f31bc4's statistics for each predictor (baseline embedding).
      - Decay test in p of every spike ratio across the three sizes (artifact tell).
    required_metrics:
      - the (D1)/(D2) break steps of the derivation
      - per (family, j, size, predictor): restricted max spike, null spike, ratio, sigma, C(S), Weil-informative flag
      - the meeting point j* per size
      - fitted exponents of min_j C in N per family with residuals; slopes in log p
      - the (D1) reading and the (D2) honest cost
      - wall-clock and peak memory per stage

  falsification_conditions:
    - 'E-FLOOR falsified iff some subset family has spike ratio to the null >= 4 at every size with a non-decreasing trend.'
    - 'E-CONCENTRATION falsified iff every family has ratio <= 2 at every size.'
    - 'The derivation goes through on (D1) or (D2): it proves too much and is wrong at an unidentified step; nothing downstream may cite it.'
    - 'A recalled ingredient (b6154d''s Weil-level bound), once read, carries a factor growing with N: the floor is recomputed by a superseding record.'
    - 'The (D1) control is missed: run void (AGENTS.md rule 3).'
    - 'A sub-rejection hitter for a bounded-degree subset is exhibited: COST-1 is revised and the floor becomes (hitter cost) times eps^(-2); the record is superseded, not amended.'

  confounders:
    - >-
      Thin-set noise. Below sqrt(N) the Gumbel level itself is large, so a
      thin bounded-degree set shows a high restricted spike for a reason that
      has nothing to do with structure; only the ratio to the equal-size
      random subset is read, never the level.
    - >-
      Constants. c j D L^2 decides the meeting point at toy scale and nothing
      asymptotically; the ladder reports ratios and slopes, not levels.
    - >-
      The digit family depends on the conventions of IDEA-20260930-8e3b75
      (direction, reference); a different convention is a different family
      and must be reported as such.
    - >-
      Predictor-subset aliasing. For g = Legendre(x) and S = an x-interval the
      product 1_S g has a larger l^1 norm than either; the bound's L^2 is the
      honest constant and a spike seen only in a product cell is reported
      with its own constant.
    - >-
      One curve family at each size; cofactor-1 toy curves have n within
      2 sqrt(p) of p and no small torsion, which is the intended object.

  interpretation_limits:
    - >-
      Conditional on b6154d's recalled bound, which has not been read in this
      program; until it is, (C) is a derivation with a recalled input and no
      decision may rest on it alone (AGENTS.md rule 9); the ladder's numbers
      stand on their own as measurements.
    - >-
      A closure of the bounded-degree subset class, not of the lane: itinerary
      classes (9c4f0c), bit-defined families (KN-FIND-ffe1df I, J) and digit-
      defined subsets remain open, and the last is on the ladder only as a
      first member.
    - >-
      Toy tier; nothing transfers to cryptographic p by any argument here.
    - >-
      No exponent moves and no attack is proposed; a positive is a localiser
      candidate routed to 9c4f0c's exploit model, which is itself a model.
    - >-
      If {delta_KS < B} were used as a factor base it would be in KN-OPEN-020's
      implicit-membership, high-degree, target-independent class with no
      algebraic decomposition handle and conserved yield; it is not proposed
      as a base here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Weil-level restricted correlation.) For 1_S, g in C(D, L) and every
        a != 0, |sum over W in S of g(W) chi_a(W)| <= c j D L^2 sqrt(p),
        uniformly in S and g at fixed (D, L).
      rigorous_support: >-
        b6154d (B)'s bound applied to the product function, itself resting on
        the recalled Bombieri / Kohel-Shparlinski bounds (neither opened in
        this program). It is a theorem shape, not a theorem, until those are
        read; it imitates the classical square-root cancellation for
        character sums on a genus-1 curve twisted by a subgroup character.
      validation_plan: >-
        SAMPLE: the complete restricted spectrum of 1_S for every x-interval
        and residue subset on the ladder at N in {2^16, 2^20, 2^24} (no
        sampling shortcut; the group is enumerable). COMPARISON: the
        restricted max spike against c sqrt(p) log p / |S| for the
        Weil-informative sizes, and against the Gumbel level for all sizes.
        TAIL CHECK: the largest ratio to the null over all cells per size,
        against the largest over an equal number of null replicates.
        SAMPLED PARAMETERS RECORDED: p, n, seed, j, predictor, per cell.
        TRANSFER: none claimed (H2).
    - id: H2
      statement: >-
        (Random model below the informative size, and transfer.) For |S|
        below sqrt(N) polylog the restricted spectrum of a bounded-degree
        subset behaves like that of a random subset of equal size, and a
        floor reading at toy scale persists at cryptographic p.
      rigorous_support: >-
        None; the Weil bound is vacuous there by construction. Imitates the
        random-subset Gumbel law for the maximum of |S| unit phases over N
        frequencies. The transfer half is an EXTRAPOLATION and is labelled so.
      validation_plan: >-
        The thin half of the ladder (j above the meeting point) against the
        equal-size random subsets, with the slope in log p of the ratio
        reported; the transfer half is not validatable here and is named in
        next_gate as a medium-scale replication.

  heuristic_note: >-
    (A), COST-2 and the minimisation in (C) are exact arithmetic; H1 is the
    recalled Weil-level input and is the record's only conditional step; H2
    carries the thin-regime random model and the only transfer.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. The record is a ceiling: for
      bounded-degree subsets and predictors the subset-restricted
      distinguisher route costs at least sqrt(N) / (c j D L^2), i.e. rho up
      to a polylog, and the random model puts it at N / (2 log N). A
      concentration signature (product below N^(3/4) with decreasing
      exponent) would be routed to 9c4f0c's localised-kangaroo model, whose
      cost k + 2 sqrt(A N) beats rho only for arc fraction A < 0.196 -- a
      model, never run here.
    memory_exponent: Not applicable; no algorithm. The census stores one length-N spectrum per cell at toy scale.
    best_known: >-
      Generic rho 0.886 sqrt(N) (KN-TECH-006, KR-RHO-fb88e6); the generic lower
      bound Omega(sqrt N) (KR-RHO-13bf67); kangaroo on an interval of width W
      in about 2 sqrt(W) (KR-RHO-898783); b6154d's whole-group ceiling.
    hidden_overhead: >-
      The polylog c j D L^2 in the floor and the Gumbel log in the random
      level; both reported separately. Nothing hides in an o(1) because no
      asymptotic claim is made.
    tradeoff_note: Not applicable; no algorithm, no time-memory position.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. Subset masks and a loop over families on the existing census
