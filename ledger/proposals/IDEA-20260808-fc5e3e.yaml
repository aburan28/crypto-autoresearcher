idea:
  id: IDEA-20260808-fc5e3e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ALBIN-001
  goal_id: GOAL-DREG-001
  title: Re-cost the binary Weil-descent Semaev attack under the crossbred algorithm instead
    of plain F4-at-first-fall - either the crossbred exponent is strictly below the published
    one on the Petit-Quisquater diagonal, or the crossbred admissibility condition fails on
    Semaev systems, and that failure is a named obstruction with a mechanism
  class: algorithm
  claim: 'The published binary-ECDLP Weil-descent complexity is derived by charging a Groebner
    basis computation at the first-fall degree, an assumption KN-LIT-7607 itself reports is
    unlikely to hold for a constructible family. The crossbred algorithm (Joux-Vitse; recorded
    in this corpus as KN-TECH-053 alongside XL and BooleanSolve) charges differently: it performs
    a PARTIAL Macaulay computation at a degree D on all variables, keeping only monomials
    of degree <= d in a distinguished subset of k variables, then exhaustively enumerates
    the remaining n'' - k variables and solves a linear system per guess. Its cost is about
    (number of guesses 2^{n''-k}) times (linear algebra on the reduced system) plus the one-off
    partial Macaulay, and its admissibility requires that the degree-D partial Macaulay matrix
    have enough independent rows whose k-degree is <= d. CLAIM: applied to the descended Semaev
    system with n'' = nm boolean variables, either (A) there exists a choice (D, d, k) whose
    charged crossbred cost is strictly below the published F4-at-first-fall cost on the diagonal,
    in which case the literature''s binary exponent is not the best known and this is a concrete
    cryptanalytic improvement; or (B) the row-count condition fails - the descended Semaev
    system''s degree-D rows have k-degree concentrated too high for any useful k - in which
    case the reason is a structural property of the chained descent (its variable-sharing
    graph confines low-k-degree rows to single subtrees) and that is a named obstruction that
    also explains why hybrid methods have not helped this family.'
  mechanism: 'Two facts make this worth doing rather than an obvious thing someone would have
    done. First, the crossbred admissibility condition is about the JOINT degree distribution
    of Macaulay rows in a variable split, and the descended Semaev system has an exceptionally
    structured split available for free - split by subtree of the chaining graph, or split
    by which coordinate of the descent basis a variable belongs to. Neither split is generic
    and neither is what a generic crossbred analysis assumes. Second, this corpus already
    measured the object the condition depends on: KN-FIND-006''s exact deficits (deficit(3)
    = 1, deficit(4) = 8k-1) are statements about which rows are dependent at low degree, i.e.
    exactly the rows crossbred needs to count. So the admissibility condition can be evaluated
    against committed artifacts before any new solve is run.'
  why_not_a_renamed_known_approach: 'Nearest known: applying crossbred/BooleanSolve to an
    MQ system, which is standard, and applying it to Weil-descended ECDLP systems, which may
    exist in the literature and could not be checked this session. The specific and possibly-new
    content is the choice of variable split induced by the CHAINING GRAPH rather than a generic
    or greedy split, and the evaluation of the admissibility condition from already-committed
    rank data rather than from a new solve. If the literature already reports crossbred against
    binary ECDLP, the record collapses to a reproduction - and finding that out is step 1
    of the minimal test, not a discovery to be made later.'
  predictions:
  - observable: number of degree-D Macaulay rows with k-degree <= d
    metric: exact count for the descended Semaev system at n in {12,15,18}, D in {3,4,5},
      several splits
    predicted: Under the subtree split the count should be much larger than under a random
      split of the same size, because rows supported inside one subtree have low k-degree
      with respect to a k that excludes that subtree. If the subtree split shows NO advantage
      over a random split, the structural premise fails and outcome (B) is reached by the
      cheapest possible route.
  - observable: charged crossbred cost versus published F4-at-first-fall cost
    metric: log_2 operations on the diagonal, as a curve in n
    predicted: Reported as two curves with the crossover, if any, marked. A crossbred cost
      above the published one at every n on the diagonal is outcome (B) and is a clean negative.
  - observable: sensitivity to the first-fall assumption
    metric: crossbred cost computed with and without assuming first fall equals solving degree
    predicted: Crossbred's cost does NOT depend on the first-fall assumption in the same way,
      because it fixes D as a parameter rather than inferring it. If the crossbred curve is
      close to the published one, that is evidence the published number is robust to the assumption;
      if it is far, the assumption is load-bearing and the published number should carry a
      wider band.
  minimal_test: 'Step 1 (literature, blocking): check whether crossbred has already been applied
    to Weil-descended Semaev systems, and record the result either way in knowledge/literature/.
    WEB TOOLS FAILED THIS SESSION so step 1 is UNRUN and no novelty is asserted. Step 2 (zero
    compute): evaluate the crossbred admissibility row count from committed EXP-DREG-001 rank
    artifacts at D in {3,4,5} for the subtree split and for >= 3 random splits of the same
    size. Step 3 (low compute): if step 2 is favourable, charge the crossbred cost on the
    diagonal and plot against the published curve. Step 4: only if steps 2 and 3 are favourable,
    run one small end-to-end crossbred solve at n = 12 as a plumbing check.'
  controls:
  - RANDOM-SPLIT ARM at matched k (above) - the null that decides whether the chaining graph
    contributes anything.
  - PUBLISHED-BASELINE REPRODUCTION: the F4-at-first-fall cost must be recomputed from the
      published formula and its inputs transcribed, not recalled; if it cannot be transcribed
      the comparison is UNRUN.
  - SEMI-REGULAR SYSTEM ARM: run the same admissibility count on the support-matched null;
      crossbred is known to be usable on generic MQ, so the null should show a baseline count
      and the Semaev arm's excess (or deficit) over it is the structural quantity.
  - PARAMETER-SWEEP HONESTY: (D, d, k) must be swept, not chosen post hoc to favour a conclusion;
      the whole grid is reported.
  confounders:
  - Crossbred's cost model has several free parameters and is easy to make look good by tuning;
    the full grid must be published, not the argmin alone.
  - The published binary-ECDLP curve itself depends on a factor-base balance and on the first-fall
    assumption; comparing a carefully-tuned crossbred against a loosely-quoted baseline would
    be unfair in the attack's favour.
  - Committed rank artifacts were produced for a different purpose and may not record k-degree
    profiles; if not, step 2 becomes a new computation and the cost rises.
  - Boolean field equations interact with the split; they must be assigned to a side and the
    assignment recorded.
  falsification_conditions:
  - The subtree split shows no row-count advantage over random splits. Outcome (B); the structural
    premise is dead and the obstruction is named at zero compute.
  - The charged crossbred curve lies above the published curve across the whole diagonal.
    Outcome (B) with a quantitative margin.
  - The literature already reports this. The record is a reproduction and must be relabelled
    as one.
  - Committed artifacts cannot supply k-degree profiles. Step 2 is UNRUN and the record waits
    rather than concluding.
  interpretation_limits: Binary fields only. Any improvement found is an improvement over
    a published HEURISTIC estimate, and would itself be heuristic - crossbred's cost model
    carries its own assumptions. Toy tier for any executed cell. Nothing here transfers to
    prime fields, where E2-03 argues the hybrid optimum is the boundary and E2-08 gives the
    reason.
  assumptions:
  - The descended system is the standard chained-Semaev Weil restriction used by this corpus's
    own generator.
  - omega declared in advance, reported at two values.
  heuristic_assumptions:
  - id: HA-1
    statement: The crossbred admissibility condition - enough degree-D rows with k-degree
      <= d - is satisfied for the descended Semaev system at some (D, d, k) with k a union
      of chaining subtrees, with the number of such rows exceeding the number of monomials
      that must be eliminated.
    rigorous_ingredient: 'Rigorous: rows supported entirely within a subtree have k-degree
      0 with respect to any k disjoint from that subtree; the chaining graph guarantees such
      rows exist. The heuristic part is whether there are ENOUGH of them and whether they
      are independent.'
    distribution_imitated: The generic MQ case, where the count of low-k-degree rows follows
      the semi-regular series and crossbred's admissible region is computed from it.
    validation_route: Exact row counts and ranks from committed artifacts at n in {12,15,18},
      D in {3,4,5}, subtree and random splits. This is a direct measurement of the condition,
      not a proxy. TOY SCALE.
    tail_checks: Report the split achieving the maximum admissible row count and check it
      is a subtree split rather than a random one; if the best split is random, the structural
      story is wrong even if the count is adequate.
  target_complexity:
    time_exponent: The object is the published binary-ECDLP subexponential estimate versus
      generic 2^{n/2}. Crossbred's charged cost is 2^{n'-k} * (linear algebra on the reduced
      system) + partial Macaulay at degree D; the deliverable is that expression evaluated
      on the diagonal. No exponent is claimed in advance.
    memory_exponent: The partial Macaulay matrix at degree D over n' = nm variables, which
      is the dominant memory term and which published F4-at-first-fall costings routinely
      omit - a correction this record must report even if the time comparison is unfavourable.
    best_known_baseline: Pollard rho at 2^{n/2} with O(1) memory; the published Weil-descent/Groebner
      estimates (heuristic).
    hidden_overhead_disclosure: Crossbred's own admissibility is heuristic in the generic
      case and is being evaluated on a highly non-generic system; the cost model's free parameters
      are its main weakness and the full grid is published to expose it.
    time_memory_tradeoff: Crossbred explicitly trades a large one-off memory-bound partial
      Macaulay against a cheap enumeration; that tradeoff must be plotted, not summarised,
      and compared against rho's O(1) memory.
  sota_delta: 'Best case: a strictly lower charged exponent for binary ECDLP on the Petit-Quisquater
    diagonal than the published F4-at-first-fall estimate, with the margin stated in bits
    at named n. Worst and expected case: a named obstruction (low-k-degree rows confined to
    single subtrees, too few to make any split admissible) which also explains the absence
    of hybrid gains in this family, plus a memory-accounting correction to how the published
    estimate is usually quoted.'
  dominated_by: For binary ECDLP the frontier is Pollard rho 2^{n/2} at O(1) memory, the published
    heuristic Weil-descent estimates, and GHS cover attacks on special curves. Every row checked.
    This record produces no algorithm until step 3 succeeds; until then it is dominated by
    all of them and says so.
  estimated_cost: Implementation medium (a crossbred coster plus a k-degree profiler); compute
    low for steps 1-3, medium for step 4.
  recommended_priority: medium
  honest_prior_of_survival: 0.3 that the subtree split shows a real row-count advantage. 0.1
    that the charged crossbred curve beats the published one anywhere on the diagonal. 0.6
    that the record produces a usable named obstruction, which is its realistic value.
  novelty_status: unverified
  novelty_class: adaptation
  novelty_screen: 'Corpus: KN-TECH-053 (XL, BooleanSolve, crossbred), KN-TECH-004, KN-TECH-011,
    KN-FIND-006 in full, KN-LIT-477, KN-LIT-7605, KN-LIT-7607, RQ-ALBIN-001 in full, EXISTING_PROPOSALS
    titles, KNOWLEDGE_BARRIERS, CATALOGUE_TITLES. The corpus records crossbred as a technique
    and never applies it here. NOVELTY_STATUS UNVERIFIED: step 1 of the minimal test is exactly
    the literature check that could not be run this session, and the record must not be filed
    as novel until it is.'
  discriminated_from: E2-03 asks the same guess-versus-solve question over PRIME fields and
    predicts the boundary optimum; this asks it over binary fields with the crossbred cost
    model, where the membership degree is 2 and an interior optimum is expected - the two
    are designed as a matched pair and their contrast is the deliverable. KN-TECH-053 records
    the technique; this instantiates it on a specific non-generic family with a specific structural
    split. E2-07 audits the last-fall-degree bound on the same diagonal; that is a bound on
    the degree, this is a different algorithm at a chosen degree.
