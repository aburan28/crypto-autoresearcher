idea:
  id: IDEA-20260727-001
  question_id: RQ-ECDLP-002
  title: >-
    Orbit-quotient and rank control for H-STR-002 - does the phi-invariant
    displacement-rank result exceed the published automorphism factor-base
    reduction, and is the measured alpha taken on a solvable matrix
  class: control
  claim: >-
    For the j=0 GLV instances of EXP-STR-002, the measured O(1) displacement
    rank of the phi-invariant relation matrix yields no linear-algebra
    advantage beyond two already-known effects, and at least one headline
    instance is degenerate. Specifically: (a) a plain sparse Wiedemann solve on
    the (B/r) x (B/r) orbit-quotient matrix will cost within a factor 2 of the
    modelled structured solve on the B x B phi-matrix, so the entire advantage
    is the orbit-representative reduction of Galbraith-Granger-Merz-Petit
    (eprint 2020/1315) instantiated with orbit length r = 3 instead of n,
    i.e. at most 3x on relation count and 9x on linear algebra, both constants;
    and (b) for the B = 397 instance reporting phi_alpha = 1, the relation
    matrix rank will be strictly less than B - 1, meaning the displacement rank
    was measured on a matrix that cannot determine the factor-base logarithms.
    The competing outcome - quotient-control ratio below 0.5 and decreasing
    with B, on a matrix of rank B - 1, with the phi-log determinacy residual
    nonzero - would establish structure beyond orbit collapse and would require
    independent review before any knowledge promotion.
  mechanism: >-
    On a prime-order subgroup of order n, an efficiently computable
    endomorphism phi acts as multiplication by a public eigenvalue lambda
    satisfying lambda^2 + lambda + 1 = 0 mod n for CM discriminant -3.
    Therefore log(phi^i(P)) = lambda^i * log(P) mod n for every point P in the
    subgroup. The columns of a phi-orbit of length r are consequently NOT
    independent unknowns - a phi-invariant factor base of size B carries only
    B/r independent logarithms, and the remaining B - B/r columns are exact
    linear images of the representatives with publicly known coefficients.
    The block-circulant commutation M * Phi = Phi * M and the resulting O(r)
    displacement rank are the matrix-level shadow of that determinacy, not new
    compressibility of independent data. Once the orbits are quotiented the
    system is a generic sparse system of dimension B/r, whose Wiedemann cost is
    2 (B/r)^2 = (2/r^2) B^2 - exactly the r^2 linear-algebra saving and r
    relation-count saving that Galbraith, Granger, Merz and Petit prove for
    Frobenius-invariant factor bases on subfield curves, with their orbit
    length n replaced here by the constant r = 3. A second, independent
    mechanism can produce the same measured signature without any structure:
    the displacement operator image (Z1 M - M Z2) has small rank whenever M
    itself has few nonzero rows or is rank-deficient, so alpha = 1 is equally
    consistent with an almost-empty matrix. EV-STR-002 records that all Groebner
    solves ran on trivial ideals with no decompositions at B >= 27, so the
    matrices at B = 204 and B = 397 were not built from harvested
    decompositions, and their rank was never reported. The control therefore
    discriminates three explanations of the same EXP-STR-002 numbers -
    (i) genuine structural compressibility beyond orbit collapse,
    (ii) the known automorphism orbit reduction restated in displacement-rank
    language, and (iii) a rank-degenerate matrix artifact.
  novelty_status: known
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "displacement rank" in the report corpus - 34 occurrences across 14
        files. Nearest prior art read in full - research/linear_algebra_axis_attack_map.md
        Route 5 item 3 states "Symmetry/group-algebra block-diagonalization -
        if the matrix commutes with a large group action it block-diagonalizes
        and LA drops. This is exactly the PKM /n^2 mechanism (Route 3) - and it
        is the ONLY currently-known instance of sub-|FB|^2 LA for EC index
        calculus, and it is poly, not exponential." Same document Route 3
        quantifies the Frobenius orbit mechanism as /n relation count, /n^2
        linear algebra, net /sqrt(n), and states it "NEVER closes the
        exponential fixed-m gap".
      - >-
        "automorphism" in the report corpus - 1268 occurrences across 189 files,
        including research/experiment_contract_p1410_addition_compatible_automorphism_orbit_dag_after_p1409.md
        and research/experiment_contract_p1412_orbit_closed_weighted_factor_columns_after_p1411.md
        (orbit-closed weighted factor columns), i.e. the orbit-closed factor
        column construction is already a contracted experiment family there.
      - >-
        "Duursma|Gaudry-Thome|Theriault" - 20 occurrences across 14 files.
      - >-
        In this ledger, "displacement|Toeplitz|circulant|phi-orbit|phi-invariant"
        - 88 occurrences across 12 files, all inside the H-STR-001/H-STR-002
        lane (H-STR-002 15, EV-STR-002 9, DEC-20260726-006 6,
        IDEA-20260726-002 34). No prior ledger record contains an orbit-quotient
        control or a relation-matrix rank report.
    literature_verified:
      - >-
        Galbraith, Granger, Merz, Petit, "On Index Calculus Algorithms for
        Subfield Curves", eprint 2020/1315, retrieved 2026-07-27. Factor bases
        invariant under the q-power Frobenius automorphism reduce the number of
        polynomial systems by a factor n and accelerate the linear algebra step
        by a factor n^2.
    conclusion: >-
      The mechanism is known and published; this record is a control on an
      internal claim, not a novel mechanism. What is not present in either
      corpus is the orbit-quotient control, the phi-log determinacy check, and
      the relation-matrix rank report - those three are the contribution.
  assumptions:
    - >-
      The tested curves are j=0 with p = 1 mod 3 and phi(x,y) = (zeta_3 x, y),
      so phi has order r = 3 on the curve and acts on the prime-order subgroup
      as multiplication by a lambda with lambda^2 + lambda + 1 = 0 mod n.
    - >-
      lambda is publicly computable from the curve and n by solving the
      quadratic mod n, so the orbit-quotient transformation requires no secret.
    - >-
      Toy sizes (12-20 bit) permit brute-force computation of every
      factor-base logarithm, so the determinacy residual can be checked exactly
      rather than statistically.
    - >-
      The displacement rank reported in EV-STR-002 was computed with respect to
      the phi-shift operator pair, and can be recomputed on the same matrices.
  predictions:
    - metric: phi_log_determinacy_residual_fraction
      direction: lower
      minimum_effect: >-
        The fraction of factor-base phi-orbits for which
        log(phi(P)) - lambda * log(P) mod n is nonzero equals 0.000 on all
        tested instances. A nonzero fraction on any instance refutes the
        determinacy mechanism and reopens the structural reading.
    - metric: structured_solve_ops_over_orbit_quotient_wiedemann_ops
      direction: different
      minimum_effect: >-
        Ratio >= 0.5 at every tested B, i.e. the modelled structured solve
        alpha^2 B log2 B is not more than 2x cheaper than plain Wiedemann on
        the (B/r) x (B/r) quotient matrix. The competing prediction is
        ratio < 0.5 AND decreasing monotonically over B in {55, 204, 397},
        which would indicate an advantage beyond orbit collapse.
    - metric: relation_matrix_rank_deficit
      direction: higher
      minimum_effect: >-
        deficit = (B - 1) - rank(M) is strictly greater than 0 for the B = 397
        instance that reported phi_alpha = 1, and greater than 0 for at least
        2 of the 3 headline instances (B = 55, 204, 397). deficit = 0 on all
        three would mean the matrices are solvable and the alpha values are
        not a degeneracy artifact.
    - metric: fully_charged_ic_ops_over_rho_ops
      direction: higher
      minimum_effect: >-
        Ratio >= 1.0 on every instance when relation collection (including the
        measured 2-3x phi-density penalty), the structured or quotient solve,
        and descent are all charged, against 0.886 sqrt(N) matched rho. A
        ratio below 1.0 on any instance is a scoped positive requiring
        independent review.
  minimal_test:
    design: >-
      Reuse the exact EXP-STR-002 instance set (j=0 curves, p = 1 mod 3, bits
      12/16/20, seeds 1-3, B up to 397) and the same harness. For each
      instance - (1) compute lambda by solving x^2 + x + 1 = 0 mod n, compute
      every factor-base logarithm by brute force at these toy sizes, and report
      the fraction of orbits violating log(phi(P)) = lambda log(P);
      (2) recompute the displacement rank alpha and ALSO report rank(M),
      number of nonzero rows of M, and the number of harvested relations that
      produced M; (3) construct the orbit-quotient matrix M_q of dimension
      (B/r) x (B/r) by folding each orbit's columns onto its representative
      with weights lambda^i, and count operations for a plain sparse Wiedemann
      solve on M_q; (4) compare three cost models at each B - structured solve
      alpha^2 B log2 B, quotient Wiedemann 2 (B/r)^2, full Wiedemann 2 B^2;
      (5) assemble the fully charged end-to-end totals (relation collection
      with the density penalty, chosen solve, descent, verification) against
      matched rho and BSGS in group-operation equivalents.
    controls:
      - >-
        Orbit-quotient control (the primary discriminator) - plain Wiedemann on
        the (B/r) x (B/r) matrix. If it matches or beats the structured solve,
        the advantage is orbit collapse.
      - >-
        Random factor base at identical B on the identical curve, alpha and
        rank both reported - the EV-STR-001 baseline.
      - >-
        AP factor base from EV-STR-001 at identical B - reproduce alpha ~ B and
        the 17.5x penalty as a calibration benchmark.
      - >-
        phi-ablation - recompute alpha for the same M with a random permutation
        shift operator instead of the phi-shift. alpha must return to ~ B.
      - >-
        Synthetic positive control - a full-rank, genuinely block-circulant
        matrix of dimension B with block size r. The structured solve must beat
        the quotient control here; if it does not, the cost model is wrong.
      - >-
        Synthetic degeneracy control - a matrix of dimension B with only B/10
        nonzero rows. It must show small alpha AND large rank deficit,
        confirming the rank report can detect the artifact.
      - >-
        Matched Pollard rho with negation (0.886 sqrt(N), honest op count) and
        matched BSGS (operations and memory) on the same instances.
    required_metrics:
      - phi_log_determinacy_residual_fraction per instance
      - alpha for phi, random, AP, and phi-ablated operators per instance
      - rank(M), nonzero row count, harvested relation count per instance
      - structured solve model ops, quotient Wiedemann ops, full Wiedemann ops
      - measured relation-density penalty for phi-invariant vs random bases
      - fully charged end-to-end group-operation totals per configuration
      - matched rho and BSGS group-operation counts and BSGS memory
  falsification_conditions:
    - >-
      The orbit-quotient control is at least 2x more expensive than the
      structured solve at B = 204 and B = 397 with the gap widening in B, on
      matrices of rank B - 1 - the phi structure then carries an advantage the
      known orbit reduction does not explain, and the claim of this record is
      false.
    - >-
      The determinacy residual is nonzero for any orbit - the eigenvalue
      mechanism is wrong for these instances and the whole argument collapses.
    - >-
      rank(M) = B - 1 on all three headline instances - the degeneracy
      explanation is excluded and only explanations (i) and (ii) remain.
    - >-
      The synthetic positive control fails (structured solve does not beat the
      quotient control on a genuine full-rank block-circulant matrix) - the
      cost models being compared are not valid and the test is inconclusive
      rather than negative.
  confounders:
    - >-
      r = 3 is a constant, unlike the Frobenius orbit length n on subfield
      curves. Any saving is therefore a constant even in the best case, which
      makes the fully-charged comparison, not the alpha value, decisive.
    - >-
      H-STR-002 fixes B = ceil(sqrt(N)). At that factor-base size the relation
      COUNT alone is sqrt(N), which already equals matched rho before any
      solve cost is charged - see IDEA-20260727-003. A linear-algebra win at
      this B cannot produce an end-to-end win regardless of alpha.
    - >-
      EV-STR-002 is explicitly instance-dependent - B = 24, 52 and 107 gave
      phi_alpha >= rand_alpha, and 16-bit seed 1 gave rand_alpha = 2, lower
      than phi_alpha = 6. Selecting only the favourable instances would bias
      the comparison; all nine instances must be reported.
    - >-
      Brute-force logarithms are available only at toy sizes, so the
      determinacy check is exact here but is a derivation, not a measurement,
      at larger sizes.
    - >-
      Model-op comparisons are not wall-clock. Reporting both is required, and
      neither substitutes for the other.
  interpretation_limits:
    - >-
      A confirmation of this record is a scope correction on H-STR-002, not a
      new negative about ECDLP. It bounds what EV-STR-002 may be promoted to;
      it says nothing about crypto-scale behaviour.
    - >-
      A refutation of this record (quotient control loses, rank full,
      determinacy residual nonzero) is a structural signal only, still bounded
      by the generic lower bounds and still requiring a fully-charged
      end-to-end win to matter.
    - >-
      All conclusions are scoped to j=0 GLV curves at 12-20 bits with r = 3.
      Nothing transfers to generic prime-field curves, whose only automorphism
      is negation.
    - >-
      Per DEC-20260726-007 the endomorphism oracle is GGM-simulable, so any
      advantage found here is non-generic and does not contradict the Shoup
      bound - it also does not beat it.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  source_refs:
    - ledger/hypotheses/H-STR-002.yaml
    - ledger/evidence/EV-STR-002.yaml
    - ledger/decisions/DEC-20260726-006.yaml
    - experiments/EXP-STR-002/analysis.md
    - /Volumes/Volume/git/autolab/research/linear_algebra_axis_attack_map.md
    - https://eprint.iacr.org/2020/1315
