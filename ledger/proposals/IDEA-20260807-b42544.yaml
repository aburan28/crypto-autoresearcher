idea:
  id: IDEA-20260807-b42544
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    THE L4 MEASUREMENT CONTRACT: the primary quantity for every phi-stable
    factor-base claim is RANK INCREMENT PER SUCCESSFUL DECOMPOSITION SEARCH over
    the reduced unknown set, never relation rows per search, measured against a
    CARDINALITY-MATCHED random factor base on the same curve and same targets,
    with an orbit-breaking parameter epsilon whose increase must destroy any
    phi-attributed effect
  class: control

  claim: >-
    (A) THE ARITHMETIC THAT DECIDES THE WHOLE LANE. Let E/F_p have j = 0
    (a = 0, p = 1 mod 3) with automorphism phi(x, y) = (zeta_3 x, y), and let
    G = <P> have prime order N. In End(E) the relation 1 + phi + phi^2 = 0
    holds, so phi acts on G as multiplication by a scalar lambda in Z/N with
    lambda^2 + lambda + 1 = 0 (mod N) (H-ENDO-001, KN-FIND-b7e091). Let the
    factor base V be a union of m phi-orbits of x-coordinates, |V| = 3m. Write
    l_j for the discrete log of a chosen lift of the j-th orbit representative.
    Then log(phi^c(P_j)) = lambda^c * l_j, so the linear system has m unknowns,
    NOT 3m. A collected relation
      R_t = sum_i eps_i * phi^{c_i}(P_{j_i}),   R_t = a_t P + b_t Q,
    contributes exactly ONE equation
      a_t + b_t k = sum_i eps_i * lambda^{c_i} * l_{j_i}  (mod N),
    with eps_i in {+1, -1} (negation acts trivially on x, so the sign is part of
    the lift choice) and coefficients in {+-1, +-lambda, +-lambda^2}. Applying
    phi to that relation returns lambda times the SAME equation. Its rank
    increment is exactly ZERO.

    (B) THE CONSEQUENCE, WHICH IS THE THING THIS PROPOSAL MAKES MEASURABLE.
    An orbit-closure step that emits phi(R) and phi^2(R) alongside R produces
    THREE ROWS and ONE INDEPENDENT EQUATION. Any metric of the form
    "relation rows per search", "hit rate", or "searches per relation row"
    therefore reads a factor of 3 that is pure bookkeeping. The honest
    comparison at matched cardinality |V| = 3m is: the phi-stable base needs m
    successful searches to reach full rank, the cardinality-matched random base
    needs 3m, and the per-search success probability is the same for both
    (approximately |V|^2 / 2N at arity 2, a function of |V| only). The saving is
    exactly the factor r = 3, it lives entirely in the UNKNOWN COUNT, and it is
    the classical automorphism-quotient saving already recorded in this
    repository as the known baseline (DEC-20260727-009 R5; EV-STR-003 O-11) and
    in the external literature (Tsakou-Ionica, see novelty_screen).

    (C) WHAT THIS PROPOSAL IS. Not a mechanism and not an attack: it is the
    instrument that makes every other L4 proposal citable. It specifies (i) the
    primary metric, (ii) the cardinality-matched null, (iii) the decay parameter
    epsilon, and (iv) three pre-registered numbers that a correct instrument
    MUST reproduce. If the instrument fails any of the three, no L4 measurement
    means anything and the lane stops until it is repaired.

    (D) THE THREE PRE-REGISTERED INSTRUMENT NUMBERS.
      I1. rank_increment_per_successful_search = 1.000 exactly, in BOTH arms, at
          every tested instance. Any value above 1 in the phi arm contradicts
          H-ENDO-001 on that instance and is an unexpected observation that must
          be recorded under AGENTS.md rule 8, not smoothed away.
      I2. successful_searches_to_full_rank(random, |V| = 3m) /
          successful_searches_to_full_rank(phi, |V| = 3m) = 3.00, within the
          sampling band declared below. Not 2.6, not 3.2 -- those were
          rows-per-search ratios measured on a different quantity.
      I3. rows_emitted_per_successful_search = 3.00 in the phi arm under orbit
          closure and 1.00 in the random arm, WITH rank increment 1.000 in both.
          I3 beside I1 is the explicit exhibition of the bookkeeping factor.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    This proposal mounts no attack and consumes no non-generic resource: it
    defines metrics, a null, and a decay parameter. It is admissible in the
    trivial sense that it claims nothing about ECDLP hardness. Note the
    asymmetry it exists to police: the metric it REPLACES (rows per search) is
    exactly the quantity a generic-group simulator could also inflate, because
    emitting phi(R) requires only one scalar multiplication in G and is
    therefore simulable (KN-FIND-b7e091, Oracle D). A measurement that rewards
    simulable work is measuring the simulator, not the curve.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; replication obligation
      DEFER-BATCH009-001 OPEN). This proposal asserts NOTHING about H-STR-002 in
      either direction. It does not measure displacement rank, does not measure
      any phi-shift operator, does not construct a block-circulant matrix, and
      does not price a structured solve against Wiedemann. The mechanism the
      DEC-20260727-009 weaken did not touch, and which this proposal does not
      touch either, is whether phi-invariance of the factor base yields an
      equivariant relation SYSTEM; the quantity this proposal defines is the
      RANK of the relation system over the REDUCED unknown set, which appears
      nowhere in H-STR-002, in EXP-STR-002, in EXP-STR-003 or in EXP-STR-004.
    - >-
      EV-STR-003 observation O-11, which reports searches-per-relation-row
      ratios 2.62 / 3.17 / 2.97 / 3.20 and reads them as the automorphism
      quotient. This proposal makes no assertion about whether that reading is
      right; it points out that rows and independent equations are different
      quantities and that the lane needs the second one measured. Whether the
      committed EXP-STR-003 numbers are rows or equations is a fact about that
      run package, not a claim made here.
    - >-
      L14 / RQ-INSTR-f8faa0, the campaign's general instrumentation lane. This
      is the L4-specific instantiation: the specific metric, the specific
      cardinality match, the specific decay parameter. It does not supersede or
      duplicate the general lane.
    - >-
      KN-TECH-018 (rho automorphism discount). That is a baseline for a
      different algorithm. This proposal fixes an index-calculus metric and does
      not touch the rho baseline, which remains the comparison target.

  object_first_candidate:
    tracked_object: >-
      THE RANK OF THE ACCUMULATED RELATION SYSTEM over the reduced unknown set
      Z/N^{m}, followed as a function of the number of successful decomposition
      searches. One integer per search, monotone non-decreasing, bounded by m.
    lossiness: >-
      GENUINELY LOSSY. It forgets which factor-base elements appeared, which
      phases c_i they carried, the sparsity pattern, the row order, and the
      target coefficients (a_t, b_t). What it retains is the only quantity that
      controls whether the linear-algebra stage can run at all.
    propagation: >-
      Deterministic and additive under the operation the lane actually performs
      (append one collected relation): the rank either rises by 1 or stays. It
      propagates compatibly with the phi-action because phi maps the relation
      space to itself by the scalar lambda, which fixes every subspace -- which
      is precisely why the increment for a phi-image is 0 and why the projection
      discards exactly the redundant part.
    survival_score: >-
      Survives every change this lane can make: arity m, factor-base size,
      curve, orbit structure, encoding, solver. It dies only if the group order
      stops being prime (then End(G) is no longer Z/N and lambda is no longer a
      scalar) -- which is itself the forward guidance of IDEA-20260807-5dfe4a.

  mechanism: >-
    STEP 1 -- REDUCED-COORDINATE RELATION ROWS. Replace the bare 0/1 incidence
    vector of harness/endomorphism_la.py::_collect_relations with a record
    (a_t, b_t, [(j_i, c_i, eps_i)]) naming, per summand, the orbit index j_i,
    the phase c_i in Z/3 and the sign eps_i. From it build the reduced row
    vector over Z/N with entry eps_i * lambda^{c_i} at column j_i, and the
    right-hand side a_t + b_t k, kept symbolic in k as the pair (a_t, b_t).
    lambda is computed once by solving lambda^2 + lambda + 1 = 0 mod N and
    verified by checking phi(P) == [lambda] P with the harness point
    arithmetic. This is the step DEC-20260727-009 R3 records as never having
    been performed ("rows are bare 0/1 incidence vectors ... no linear system
    with a right-hand side has ever been assembled"); performing it is a
    prerequisite for any rank measurement and asserts nothing about H-STR-002.

    STEP 2 -- THE PRIMARY METRIC. After each successful search, recompute
    rank over F_N of the accumulated reduced matrix (incremental Gaussian
    elimination; m <= a few hundred at toy scale). Record the increment.
    Report rank_increment_per_successful_search, and separately
    rows_emitted_per_successful_search, so I1 and I3 are visible side by side.

    STEP 3 -- THE CARDINALITY-MATCHED NULL, WHICH IS THE WHOLE POINT. Arms are
    run on the SAME curve, SAME target stream (same a_t, b_t seeds), SAME arity,
    SAME budget:
      ARM P: V = union of m phi-orbits, |V| = 3m, unknowns m.
      ARM R: V = 3m uniformly drawn on-curve x-coordinates, |V| = 3m,
             unknowns 3m.
      ARM R-small: V = m uniformly drawn on-curve x-coordinates, |V| = m,
             unknowns m. This is the FORBIDDEN comparison, run deliberately and
             labelled as such, because it is the one that manufactures a fake
             advantage: it matches unknown counts while mismatching cardinality,
             so its success probability is 9x lower at arity 2. Reporting ARM P
             against ARM R-small is the specific error this contract exists to
             prevent, and having the number in the record makes the error
             visible rather than arguable.

    STEP 4 -- THE DECAY PARAMETER epsilon. Fix |V| = 3m. For epsilon in
    {0, 1/3, 2/3, 1}, build V by taking (1 - epsilon) * m complete phi-orbits
    and filling the remaining 3 * epsilon * m slots with uniformly drawn
    on-curve x-coordinates that are NOT in any selected orbit; the unknown count
    is then (1 - epsilon) m + 3 epsilon m. epsilon = 0 is ARM P and epsilon = 1
    is ARM R. THE DECAY REQUIREMENT: every quantity attributed to phi-stability
    must move monotonically from its ARM P value to its ARM R value as epsilon
    increases. A quantity that stays flat across epsilon is an artifact of the
    construction or of the bookkeeping, and is reported as an artifact.

    STEP 5 -- THE PLANTED-SIGNAL DIRECTION. An instrument that cannot detect a
    signal is as useless as one that hallucinates one. Plant a known linear
    dependency: inject, into ARM R, three rows that are exact scalar multiples
    of each other. The rank meter must report increments 1, 0, 0. If it does
    not, the meter is broken and nothing else is run.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session (ripgrep via the Grep
      tool, repository root /home/user/crypto-autoresearcher):
      (1) 'phi-invariant|phi-orbit|phi-stable|equivariant",' over the whole
      repository, files_with_matches;
      (2) 'orbit representative|factor.base quotient|quotient the factor base|
      reduced factor base|lambda \* l|scalar lambda' over ledger/, content;
      (3) 'DEFER-BATCH009-001' over the repository, content;
      (4) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content.
      Records read in full before writing: RQ-EQIC-8cb959, H-STR-002,
      DEC-20260727-009, EV-STR-003 (partial, lines 280-340),
      experiments/EXP-STR-004/derivation_note.md, harness/semaev.py,
      harness/endomorphism_la.py, KN-TECH-002/003/004/011/012/018,
      KN-FIND-b7e091, KN-OPEN-019, KN-OPEN-025, KN-LIT-004, KN-LIT-006.
      External: two web searches (see IDEA-20260807-1ea327 for the full text)
      surfaced Tsakou-Ionica, "Index Calculus Attacks on Hyperelliptic Jacobians
      with Effective Endomorphisms", eprint 2021/721, Trans. Math. Cryptology
      1(2) 2022, 102-114; the eprint abstract page was fetched and reads, in
      full: "For a hyperelliptic curve defined over a finite field F_{q^n} with
      n > 1, the discrete logarithm problem is subject to index calculus
      attacks. We exploit the endomorphism of the curve to reduce the size of
      the factorization basis and hence improve the complexity of the index
      calculus attack for certain families of ordinary elliptic curves and genus
      2 hyperelliptic Jacobians defined over finite fields."
    results: >-
      Grep (1) returned 60 files at the head limit, so 60 is a FLOOR not a
      count; the hits are the H-STR-002 / EXP-STR-002/003/004 cluster plus the
      two RQ records of this campaign. Grep (2) returned 11 content hits, of
      which the two load-bearing ones are DEC-20260727-009 line 176 and
      EV-STR-003 line 304, both naming the "standard factor-r factor-base
      quotient" as the known literature baseline. NO record in this repository
      defines rank increment per successful search, and DEC-20260727-009 R3
      states positively that no linear system with a right-hand side has ever
      been assembled in this line of work. Externally, a search-result summary
      (NOT the paper) attributes to Tsakou-Ionica the statement that each point
      decomposition yields "a new line in the matrix of relations whose
      coefficients are powers of the eigenvalue of the endomorphism", which is
      the same arithmetic as claim (A); their setting is extension fields
      F_{q^n} with n > 1, not prime fields.
    verdict: >-
      ADAPTATION. The arithmetic in claim (A) is not new -- it is the classical
      automorphism quotient, recorded internally as the known baseline and
      published externally for the extension-field case. What is new to THIS
      REPOSITORY is (i) writing it down as an exact rank statement rather than a
      hit-rate statement, (ii) the cardinality-matched null with the deliberate
      ARM R-small counterexample, and (iii) the epsilon decay parameter. No
      novelty against the external literature is claimed and none is needed: an
      instrument does not have to be new to be necessary. Full-text reads of
      Tsakou-Ionica and KN-LIT-004 are Stage-0 obligations of any experiment
      derived from this record.

  null_object_control: >-
    MANDATORY AND BLOCKING, and this record IS the null-object specification for
    lane L4. MATCHED NULL: ARM R, a uniformly drawn factor base of the SAME
    cardinality 3m on the SAME curve with the SAME target stream and seeds --
    matched on curve, p, N, |V|, arity, target sequence, budget and solver, and
    differing ONLY in whether V is a union of phi-orbits. DECAY PARAMETER:
    epsilon, the fraction of orbits replaced by unaffiliated random points at
    fixed |V| = 3m; every phi-attributed quantity must move monotonically to its
    ARM R value as epsilon goes 0 -> 1/3 -> 2/3 -> 1. A quantity flat in epsilon
    is the canonical artifact tell (docs/inventor-protocol.md section 3).
    ANTI-NULL (planted signal): three deliberately dependent rows injected into
    ARM R must produce rank increments 1, 0, 0. NEGATIVE CONTROL ON THE
    FORBIDDEN COMPARISON: ARM R-small is run and reported precisely so that the
    size-mismatched comparison is visible as a number rather than available as
    an argument.

  assumptions:
    - >-
      N is prime and phi restricted to G is multiplication by lambda with
      lambda^2 + lambda + 1 = 0 mod N. VERIFIED PER INSTANCE by checking
      phi(P) == [lambda] P with harness point arithmetic; a failure invalidates
      the instance, not the metric.
    - >-
      Toy scale only: p up to about 32 bits, pure Python, sympy/numpy, no Sage.
      m is small enough that incremental exact rank over F_N is affordable.
    - >-
      The per-search success probability depends on |V| and arity only, not on
      whether V is orbit-structured. THIS IS AN ASSUMPTION AND IT IS ONE OF THE
      MEASURED QUANTITIES, not a premise -- prediction 4 below tests it, and
      IDEA-20260807-4d7e8e derives the algebraic reason it should hold on j = 0
      curves.

  proof_search_map:
    not_applicable_reason: >-
      Purely instrumental. No theorem, bound, certificate family, reduction or
      closure argument is proposed. The one algebraic statement it relies on
      (phi acts as a scalar on a prime-order subgroup) is already carried by
      H-ENDO-001 and KN-FIND-b7e091 and is re-verified numerically per instance
      rather than re-proved here. The proof-oriented sibling in this lane is
      IDEA-20260807-4d7e8e, which carries a full map.

  predictions:
    - metric: rank_increment_per_successful_search
      direction: different
      minimum_effect: >-
        Exactly 1.000 in ARM P and in ARM R at every instance and every epsilon.
        The pre-registered discrimination: a measured value above 1.000 in ARM P
        would mean a phi-image relation carried new information, contradicting
        H-ENDO-001 on that instance -- which would be the single most important
        observation the lane could produce and must be reported, not filtered.
        A measured value below 1.000 means duplicate or dependent rows are being
        counted as successes and the collection code is wrong.
    - metric: >-
        successful_searches_to_full_rank ratio, ARM R over ARM P, at matched
        |V| = 3m
      direction: higher
      minimum_effect: >-
        3.00, with a pre-registered acceptance band of [2.70, 3.30] over at
        least 20 independent target streams per instance (the band is the
        binomial spread of the number of searches at these m, fixed before
        running). Outside the band in either direction is an instrument defect
        and blocks the lane. Inside the band confirms that the entire phi-stable
        factor-base effect at arity 2 is the constant r = 3 and nothing else.
    - metric: rows_emitted_per_successful_search
      direction: higher
      minimum_effect: >-
        3.00 in ARM P under orbit closure against 1.00 in ARM R, WITH rank
        increment 1.000 in both. This pair of numbers is the deliverable: it
        exhibits the bookkeeping factor next to the quantity it does not affect.
    - metric: >-
        per-search decomposition success probability, ARM P against ARM R at
        matched |V| = 3m
      direction: different
      minimum_effect: >-
        Predicted EQUAL within Poisson noise (ratio in [0.85, 1.18] over the
        pooled stream). A ratio outside that band would mean orbit structure
        changes decomposition density, which is a genuine mechanism claim and
        would be routed to a new proposal rather than absorbed here.
    - metric: epsilon-decay slope of the searches-to-full-rank ratio
      direction: lower
      minimum_effect: >-
        Monotone decrease from about 3.00 at epsilon = 0 to 1.00 at epsilon = 1,
        with the intermediate points within 0.30 of the predicted
        3 / (1 + 2 epsilon) curve. Flatness is the artifact tell and halts the
        lane.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write the reduced-row record format and the
      lambda check. STAGE 1 (minutes): planted-signal control -- rank meter must
      return 1, 0, 0 on three dependent rows. HARD GATE. STAGE 2 (minutes):
      lambda verification phi(P) == [lambda] P on every generated instance. HARD
      GATE. STAGE 3 (about an hour): ARM P, ARM R, ARM R-small at
      field_bits in {12, 16, 20}, seeds {1, 2, 3}, arity 2, |V| = 3m with
      3m = ceil(sqrt(N)) rounded down to a multiple of 3, at least 20 target
      streams per cell, recording all five metrics. STAGE 4 (about an hour): the
      epsilon ladder {0, 1/3, 2/3, 1} at the largest affordable instance.
      STAGE 5 (zero compute): report I1, I2, I3 and the epsilon curve. Every
      arm reuses harness/toycurve.py, harness/semaev.py::_find_decomposition and
      harness/endomorphism_la.py::_generate_j0_instance /
      _build_phi_invariant_factor_base unmodified for instance and base
      generation; only the row record and the metric are new code, and the
      committed measurement function _measure_displacement_rank is NOT called.
    controls:
      - ARM R, cardinality-matched random factor base, same curve and stream
      - ARM R-small, the deliberately size-mismatched forbidden comparison
      - epsilon ladder {0, 1/3, 2/3, 1} at fixed |V|
      - planted dependent rows (anti-null), must give increments 1, 0, 0
      - per-instance verification that phi(P) == [lambda] P
      - >-
        every collected relation carries a decomposition certificate
        re-verified by semaev.verify_decomposition_certificate independently of
        the collector (docs/claims-and-verification.md)
    required_metrics:
      - rank_increment_per_successful_search, per arm, per epsilon
      - rows_emitted_per_successful_search, per arm
      - successful_searches_to_full_rank, per arm, per target stream
      - per-search decomposition success probability, per arm
      - unknown count and |V| recorded explicitly per arm (the size control)
      - sha256 of the factor base and of the reduced row list per cell
      - wall-clock and peak RSS per cell

  falsification_conditions:
    - >-
      The planted-signal control does not return increments 1, 0, 0. Instrument
      broken; nothing is reported and the lane halts.
    - >-
      phi(P) != [lambda] P on a generated instance. That instance is invalid
      (bad zeta_3 or bad lambda root); it is excluded and recorded, and it is
      NOT evidence about anything mathematical.
    - >-
      The ARM R / ARM P searches-to-full-rank ratio falls outside [2.70, 3.30].
      Either the arithmetic in claim (A) is wrong at toy scale -- which would be
      a major finding requiring its own record -- or the collection code is
      double-counting. Both dispositions are pre-registered and the record must
      say which was checked first.
    - >-
      Any quantity attributed to phi-stability is flat across the epsilon
      ladder. That quantity is an artifact and may not be reported as a
      phi effect.
    - >-
      Exact rank over F_N is not affordable at the largest instance within
      budget. That is an INFRASTRUCTURE outcome under AGENTS.md rule 5, recorded
      as such, and it is not evidence about rank increments.

  confounders:
    - >-
      DUPLICATE TARGETS. The committed _collect_relations skips a target whose
      x-coordinate was already seen. A repeated target yields a proportional
      row and a zero rank increment that has nothing to do with phi. Targets
      must be drawn with recorded (a_t, b_t) and de-duplicated on (a_t, b_t),
      not on x.
    - >-
      FACTOR-BASE TRUNCATION. _build_phi_invariant_factor_base returns xs[:B],
      which cuts a partial orbit whenever B mod 3 != 0 and silently drops
      coordinates during any orbit closure (EXP-STR-004 derivation note,
      Lemma 4a and Theorem 2). This lane must fix |V| to a multiple of 3 so the
      truncation tail is empty, and must record B mod 3 per cell.
    - >-
      SIGN AND NEGATION. Negation acts trivially on x-coordinates, so each base
      x carries a +- pair of points and each relation carries signs eps_i. A
      collector that drops the sign produces rows that are wrong over Z/N even
      though they look right as incidence vectors. This is the most likely
      concrete bug and the certificate re-verification is what catches it.
    - >-
      SMALL m. At m below about 10 the searches-to-full-rank ratio has large
      relative variance and the [2.70, 3.30] band is not meaningful; the band
      applies only at cells where m >= 16, and smaller cells are reported
      without a verdict.
    - >-
      lambda AMBIGUITY. lambda^2 + lambda + 1 = 0 has two roots mod N; the phase
      convention must fix which one, consistently with the chosen zeta_3, or the
      reduced rows are built with the wrong coefficients and the rank is wrong.

  interpretation_limits:
    - >-
      This record produces NO evidence about H-STR-002 in either direction and
      no downstream record may cite it as such. It measures a quantity
      H-STR-002 does not mention, on a construction H-STR-002 does not specify.
      DEFER-BATCH009-001 is unaffected and remains open.
    - >-
      Toy tier only, capped at claim_tier toy. m and p here are orders of
      magnitude below any deployed parameter.
    - >-
      A confirmed factor of 3.00 is a CONSTANT and is already the published
      baseline. Confirming it is calibration, not progress, and the record must
      say so in the same sentence in which the number appears.
    - >-
      Scoped to j = 0 curves (CM discriminant -3, p = 1 mod 3), which are a
      measure-zero family; no standardized curve in this program's target set
      has j = 0.
    - >-
      The metric is defined for arity 2 relation collection with the committed
      exhaustive-pair decomposition search. Extending it to arity 3 or to a
      Groebner-based search requires re-deriving the success-probability model
      and is out of scope here.

  reachability_gate: >-
    NOT APPLICABLE and stated rather than omitted. This proposal moves between
    no curves: every arm runs on ONE fixed curve, and the only thing that varies
    is the factor base. T5 (the isogeny-class reachability gate) does not bind.
    The scope limit that DOES bind is T4: j = 0 requires D_0 = -3, so the curve
    family this instrument is defined on cannot be reached by walking from a
    curve whose isogeny class lacks it, and no amount of instrument quality
    changes that.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. For the record, the exponent this lane
      lives inside: at arity 2 over a prime field with factor base size B, the
      per-target success probability is about B^2 / 2N, the number of
      independent relations needed is B / r, so the number of searches is about
      2N / (r B) and the cost per search is about c * B, giving a total of about
      2 c N / r -- LINEAR in N, independent of B. The r-fold quotient divides a
      hopeless N by 3. Any exponent-relevant lever in L4 is on the algebraic
      decomposition cost at higher arity, not here.
    memory_exponent: >-
      The instrument stores m x m reduced rows over Z/N -- O(m^2 log N) bits,
      m about sqrt(N) / 3 at the balanced choice, so about N * log N / 9 bits.
      That is worse than rho's O(1) memory by the full square-root factor and is
      recorded as a cost of the measurement, not of an algorithm.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); on a j = 0 curve
      the automorphism-discounted variant at 0.886 sqrt(N) / sqrt(6)
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory.
    hidden_overhead: >-
      Nothing hides here because nothing asymptotic is claimed. The honest
      overhead is that exact incremental rank over F_N costs O(m^2) per inserted
      row, which is why the instrument is toy-scale only.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. The instrument's own memory is
      reported per cell for feasibility bookkeeping.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an attack this
    proposal mounts none, so it is dominated on every axis by every row of the
    prime-field frontier: parallel rho with distinguished points (0.886 sqrt(N)
