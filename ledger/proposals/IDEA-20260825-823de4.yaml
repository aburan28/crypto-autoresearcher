idea:
  id: IDEA-20260825-823de4
  title: Dyadic quotient-ring unit-product interface
  class: algorithm
  question_ids:
    - RQ-ECDLP-002
  goal_ids:
    - GOAL-ECDLP-001
  source_handoff: TASK-20260825-10a615
  status: proposed
  object: >-
    An exact dyadic quotient-ring unit-product summary with typed bridge,
    CRT, valuation, lineage, multiplicity, and orientation metadata.
  depth_of_verified_structure: >-
    Conceptual mechanism only; no product interface, implementation, or
    experiment was executed in this task.
  claim: >-
    A dyadic interval can expose its exact unit-product state as an element of a
    typed quotient ring, computed by a binary product tree with certified leading
    coefficient, multiplicity, and CRT metadata. If that state is sufficient for
    target-local relation extraction, it supplies the second accepted GOAL trigger
    without building a represented factor-base table or evaluating roots. No
    speedup is claimed until the unit-product interface is shown to reduce the
    complete charged path.
  mechanism: >-
    For each dyadic subinterval I, define A_I = F_p[T]/g_I(T) and represent the
    public unit factors u_j(T) in A_I. Compute U_I = product of u_j by recursively
    multiplying adjacent child summaries, while carrying a typed boundary map,
    CRT component, valuation/multiplicity vector, and an orientation bit. A
    parent summary is obtained from child summaries and a fixed bridge operator;
    no source root is materialized. Relation candidates are extracted only when
    an independently verified certificate maps U_I back to the required public
    group coefficients.
  nearest_record_delta:
    screened_against:
      - FINDING-PF-IC-001:ECFG-P1533-R0
      - FINDING-PF-IC-001:ECFG-P1546-R0
      - FINDING-PF-IC-001:ECFG-P1547-R0
      - FINDING-PF-IC-001:ECFG-P1551-R0
      - GOAL-ECDLP-001.next_action
    overlap_axes:
      - dyadic interval decomposition
      - polynomial/product summaries
      - relation extraction from public elliptic data
    exact_delta: >-
      Unlike P1533 this is not a resultant or multiset collision producer;
      unlike P1546/P1547 it proves no projected-smoothness or jet theorem; and
      unlike P1551 it is not a finite-domain high-degree selector circuit. The
      proposed object is an exact quotient-ring product interface whose only
      promised output is a typed unit-product state suitable for a later
      certificate check.
  novelty_status: unverified
  duplicate_screen:
    corpus_scope: >-
      The handoff's 106 RQ-ECDLP-002 proposals and adjacent ECDLP, Semaev,
      endomorphism, isogeny, representation, multi-target, and cost-model
      records were the declared comparison corpus.
    method: >-
      Compared the tracked object, parent/child update rule, root and witness
      dependence, and output certificate against the named frontier summaries.
    outcome: >-
      No exact duplicate was identified in the available frontier summaries;
      the proposal is still unverified and requires Coordinator per-file
      deduplication before admission.
    unresolved_gaps:
      - The exact 106-record body-level comparison remains a Coordinator verification gate.
      - A product-tree interface may conceal a represented-table cost if its live state is not bounded.
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: Prime-field ECDLP methods must be public, testable, and fully costed.
      verified_by: ledger/questions/RQ-ECDLP-002.yaml
    - ref: GOAL-ECDLP-001
      provenance: internal
      claim: >-
        The active goal explicitly accepts an exact dyadic subinterval
        unit-product interface only after its typed computation and full cost
        boundary are supplied.
      verified_by: ledger/goals/GOAL-ECDLP-001/goal.yaml:9469-9499
    - ref: FINDING-PF-IC-001:ECFG-P1533-R0
      provenance: internal
      claim: The nearby multiset-resultant family is an exclusion boundary.
      verified_by: ledger/FINDING-PF-IC-001.md:1337-1366
    - ref: FINDING-PF-IC-001:ECFG-P1546-R0
      provenance: internal
      claim: The split-Jacobian projected-smoothness route is adjacent but distinct.
      verified_by: ledger/FINDING-PF-IC-001.md:2272-2306
    - ref: KN-TECH-080
      provenance: internal
      claim: >-
        Representation/reduction proposals require encoding, completeness,
        soundness, transfer, and cost obligations plus cheap proof audits.
      verified_by: knowledge/techniques/KN-TECH-080.md:94-124
    - ref: KN-TECH-003
      provenance: internal
      claim: The final relation and sparse-solve path remains mandatory.
      verified_by: knowledge/techniques/KN-TECH-003.md:14-21
  assumptions:
    - Every child unit factor is publicly constructible from the frozen elliptic input and has a declared ring type.
    - Child summaries compose associatively up to a recorded bridge and orientation map.
    - Multiplicity and nonreduced fibre information fit in a bounded explicit metadata state.
    - A unit-product state can be mapped to a useful relation without hidden source enumeration.
  proof_search_map:
    bottleneck: >-
      The bottleneck is an exact, witness-free unit-product interface whose
      output can be consumed by relation extraction while preserving lineage.
    baseline_embedding:
      parameter_slice: >-
        For a single-element interval, the product tree must reduce to the
        baseline public factor construction; for a two-element interval it must
        reproduce the direct product and its certificate exactly.
      reproduction_check: >-
        Freeze degree-one and degree-two fixtures, recompute products by direct
        multiplication and by the tree, and charge both the product build and
        certificate conversion.
    observation_collision:
      observable: >-
        U_I together with ring type, degree, leading coefficient, valuation
        vector, CRT labels, lineage summary, and Q-orientation.
      distinct_preimage_search: >-
        Search distinct ordered and unordered child multisets, including a
        repeated child and a coalesced fibre, with equal U_I but unequal required
        group coefficients; this is the required observable-fibre falsifier.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A dyadic unit-product summary with a certified specialisation map to
          the target-local relation interface.
        predicted_gain: >-
          Reuse child products across adjacent intervals and expose output
          sensitive relation candidates without retaining a full represented
          table; any gain is conditional on a bounded live state.
    quantifier_order: >-
      For every declared curve and valid dyadic interval I, there exists a
      bounded typed summary U_I computed from public inputs such that every valid
      parent interval is obtained from its children by the declared bridge; only
      then may there exist an asymptotic schedule with lower full-path cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        The method can certify exact composition and certificate conversion of
        unit products; it cannot certify relation yield, scalar recovery, or an
        exponent change without separate lemmas.
      nearby_object_control: >-
        Use random degree-matched factors and an elliptic instance with its
        provenance labels permuted. Exact products should survive permutation
        only where the claimed algebra permits it, while any elliptic relation
        gain must vanish on the controls.
    proof_obligations:
      - claim: Typed ring and public child-factor construction
        responsibility: interface
      - claim: Associative tree composition with bridge correctness
        responsibility: correctness
      - claim: Multiplicity, CRT, and orientation preservation
        responsibility: scope
      - claim: Bounded state and coefficient growth
        responsibility: size
      - claim: Relation conversion and independent certificate verification
        responsibility: feasibility
      - claim: Complete preprocessing, online, traffic, and amortization cost
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: direct-product equality on all toy intervals
      direction: higher
      minimum_effect: exact equality for every accepted interval
    - metric: live summary size per dyadic block
      direction: lower
      minimum_effect: asymptotically below a represented full factor-base table or the proposal is rejected
    - metric: certificate failures on repeated and coalesced fibres
      direction: lower
      minimum_effect: zero on exact controls; any failure falsifies the interface
    - metric: useful relation yield after certificate conversion
      direction: different
      minimum_effect: must differ from random-polynomial and label-permuted nulls before any speed claim
  minimal_test:
    design: >-
      Implement no production code in this task; specify a toy-only exact audit
      that enumerates small dyadic intervals, computes direct and tree products,
      checks certificate conversion, and records all degree/rank/nonzero/storage
      fields before any relation interpretation.
    controls:
      - Direct multiplication of the same public child factors.
      - Degree- and coefficient-matched random polynomial factors.
      - Squarefree, repeated-root, and nonreduced elliptic fibres.
      - CRT components and exception strata with labels permuted.
      - Q and -Q from the same public input.
      - Pollard rho and standard Semaev m=2 as end-to-end cost controls.
    required_metrics:
      - product and certificate exactness
      - degree, rank, nonzeros, coefficient bits, and live storage
      - build/query/bridge time and inter-worker traffic
      - lineage and multiplicity retention
      - relation yield, verification rate, and full time-memory-data boundary
  falsification_conditions:
    - The parent product depends on a hidden source root, factor, witness, or represented table.
    - Child composition is not associative under a declared bridge or fails a CRT/exception stratum.
    - Equal summary states correspond to different source relations after all metadata are included.
    - Summary memory grows to the same order as enumerating the complete source table with no compensating gain.
    - Any apparent relation signal survives the random-polynomial and label-permuted null unchanged.
  confounders:
    - Product-tree reuse can move cost into preprocessing and falsely appear free.
    - Ring normalization and coefficient growth may dominate field operations.
    - A certificate conversion can silently become a source-unranking oracle.
    - Small intervals can have atypical smoothness or multiplicity distributions.
  interpretation_limits:
    - Exact unit products are not relations until a public certificate maps them to group coefficients.
    - A bounded interface is not an exponent-moving algorithm.
    - A negative toy result applies only to the tested ring, degree, and interval schedule.
    - No live-target or secret-key inference is permitted.
  heuristic_assumptions:
    - id: H1
      statement: >-
        After the exact unit-product interface is fixed, the density of
        certificate-bearing blocks follows the degree-matched random-polynomial
        baseline up to a declared transfer factor.
      rigorous_support: >-
        Tree composition and certificate equality can be proved exactly; the
        distributional density transfer is not proved by the interface.
      validation_plan: >-
        Enumerate toy elliptic blocks and random polynomial blocks at the same
        degrees, compare empirical yield CDFs and tails, and repeat on a
        correspondence-generated public family where direct cryptographic-scale
        enumeration is infeasible.
    - id: H2
      statement: >-
        The number of distinct lineage states represented by one quotient-ring
        unit product is subexponential in the block size under the declared
        metadata encoding.
      rigorous_support: >-
        The proposal requires an explicit metadata bound but supplies no theorem
        that the bound is subexponential.
      validation_plan: >-
        Exhaustively count state multiplicities on small repeated-root and
        coalesced fibres, compare to a random-labelled null, and fit only a
        scoped growth bound with uncertainty intervals.
  target_complexity:
    time_exponent: >-
      Unverified conditional target p^(1/3+o(1)) if certificate-bearing block
      composition replaces the current relation bottleneck; baseline remains
      p^(1/2+o(1)).
    memory_exponent: >-
      Conditional target between p^(o(1)) and p^(1/3+o(1)), determined by the
      live product-tree frontier; no exponent claim is currently supported.
    best_known: p^(1/2+o(1)) generic rho, with standard Semaev and specialized routes charged separately
    hidden_overhead: >-
      Include product-tree width, coefficient swell, certificate conversion,
      failed-block probability, sparse linear algebra, relation verification,
      and all build/query amortization.
    tradeoff_note: >-
      Retaining more child summaries lowers recomputation but increases memory
      and traffic; a distributed tree must charge duplicate summaries and
      synchronization.
  cost_boundary:
    public_inputs: E, P, Q, p, n, ring and CRT definitions, dyadic interval geometry, and public unit-factor construction
    per_attempt: >-
      Build child factors, normalize ring elements, compose the tree, convert the
      parent summary to a certificate, test relation validity, and verify it.
    preprocessing: >-
      Child-factor construction, reusable product nodes, CRT bases, and any
      coefficient transforms, all with time, memory, and traffic charged.
    online: >-
      Interval selection, bridge application, certificate conversion, relation
      filtering, source unranking, and independent verification.
    success_probability: >-
      Unspecified pending a matched-control density measurement; expected cost is
      per-attempt cost times inverse success probability.
    time: >-
      Include all field/polynomial operations, normalization, relation collection,
      sparse solve, descent, scalar recovery, and certification.
    memory: >-
      Include live tree frontier, CRT/valuation metadata, certificates, caches,
      factor-base state, and replicas.
    data_queries: >-
      Count public group operations, field operations, coefficient transfers,
      relation/certificate requests, verification, and worker traffic.
    exclusions: >-
      No hidden roots, factors, witnesses, support tables, secret keys, deployed
      systems, or free preprocessing.
  dominated_by:
    result: Pollard rho baseline (KN-TECH-006) until a complete certified relation path beats it
    frontier_checked: [generic rho, BSGS, standard Semaev, endomorphism, multi-target preprocessing, current P1533-P1551 frontier]
    reason: >-
      The unit-product interface has no verified relation or scalar-recovery gain
      and currently pays nontrivial memory and certificate costs.
  sota_delta:
    time_exponent: "0 verified; conditional aspiration -1/6"
    memory_exponent: "unknown; likely positive table cost until bounded"
    data_queries: "0 verified; certificate and traffic costs unresolved"
    status: unverified
  estimated_cost:
    implementation: high
    compute: medium
    rationale: >-
      Exact toy composition is feasible, but repeated-root metadata, certificate
      conversion, and full-path accounting are expensive.
  priority: high
  recommended_priority: high
