idea:
  id: IDEA-20260809-7753fe
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Score the model machinery against a hidden-shift instance small enough to
    solve by brute force, where ground truth exists
  class: control
  claim: >-
    The reconstructed cost function is a chain of assumptions with no ground
    truth at CSIDH parameters. The claim is that ground truth EXISTS at tiny
    parameters: an abelian hidden-shift instance small enough to enumerate
    classically, where the true query complexity of the underlying algorithm can
    be measured by simulation rather than modelled. Scoring the model against that
    measurement is the only empirical anchor available anywhere in this goal.
  mechanism: >-
    Construct tiny abelian hidden-shift instances, simulate the algorithm's query
    behaviour classically where the state space permits, measure query counts, and
    compare against the model's prediction at the same parameters.
  why_not_a_renamed_known_approach: >-
    Small-scale simulation of quantum algorithms is standard practice. Using it as
    a SCORING CONTROL for a disputed cost model, with the model's predictions
    stated before the simulation runs, is what makes this record a falsification
    gate rather than a demonstration.
  predictions:
  - observable: measured versus predicted query counts at tiny parameters
    metric: ratio, with predictions committed before simulation
    predicted: Within a small factor. A large miss disqualifies the model's query-count component and must be resolved before any comparison of published analyses is recorded.
  - observable: how far up in parameter size the simulation can go
    metric: largest simulable parameter
    predicted: Very small, and the record must state the gap between it and CSIDH parameters explicitly rather than implying continuity.
  minimal_test: >-
    Two tiny instances, predictions committed in advance, simulation run, ratios
    reported with the simulable-size ceiling stated.
  controls:
  - 'PREDICTION PRE-COMMITMENT before simulation.'
  - 'SIMULATION VALIDATION: the simulator must reproduce known behaviour on a trivial instance whose answer is computable by hand.'
  falsification_conditions:
  - Model predictions miss the measured counts by more than the declared factor.
  - No instance is simulable within budget, in which case this goal has no empirical anchor and every later record must state that.
  interpretation_limits: >-
    Tiny-parameter behaviour need not extrapolate; the record states the size gap
    and claims nothing across it.
  sota_delta: 'No verdict. Delta: the only empirical anchor in a goal otherwise made of models.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate and sharply limited by state-space size.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for hidden shift simulation: no records. WEB NOT CHECKED.'
  source_refs:
  - Kuperberg algorithm references -- RECALLED, REQUIRED READS.
