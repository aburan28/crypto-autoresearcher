idea:
  id: IDEA-20260809-972c12
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    A class group structure certificate and an independent checker, so a
    structure claim is verifiable without rerunning the computation
  class: tooling
  claim: >-
    A class group computation's output — generators, relations, and the structure
    they imply — is checkable far more cheaply than it is produced, provided the
    output is emitted in a declared format. The claim is that such a certificate
    can be defined, that a checker sharing no code with the computation can verify
    it in seconds where the computation took hours, and that this raises every
    structure result in the goal to the certificate tier.
  mechanism: >-
    The certificate carries the discriminant, the generating forms, the relation
    matrix and the claimed structure. The checker recomputes the relations by
    composition, verifies the matrix's Smith normal form, and confirms the claimed
    structure follows — with a declared statement of what it does NOT verify,
    namely that the relation set is complete.
  why_not_a_renamed_known_approach: >-
    Certificates of this kind are used in computational number theory. Defining
    one for this program, with an explicit statement of the unverified part, is
    what makes it usable as evidence here — the incompleteness caveat is the part
    that a naive certificate would hide.
  predictions:
  - observable: checker runtime versus computation runtime
    metric: ratio
    predicted: Orders of magnitude smaller, which is what makes independent verification realistic.
  - observable: what the checker cannot verify
    metric: explicit list
    predicted: >-
      Relation-set completeness, which is exactly the part that makes a class
      group computation hard. The certificate is therefore conditional and must
      say so wherever it is cited.
  minimal_test: >-
    Define the format, implement the checker independently, run it over every
    certificate from the sweep, and verify it rejects perturbed certificates.
  controls:
  - 'INDEPENDENCE: the checker links no computation code, verified mechanically.'
  - 'NEGATIVE SET: perturbed relation matrices and wrong structure claims must be rejected.'
  falsification_conditions:
  - The checker accepts a perturbed certificate.
  - Certificates cannot be made self-contained, in which case the structure results stay below the certificate tier and every record says so.
  interpretation_limits: >-
    The certificate verifies that the claimed structure is consistent with the
    exhibited relations. It does not verify completeness, so a certified structure
    is a lower bound statement, and every citation must carry that qualifier.
  sota_delta: 'No attack. Delta: certificate-tier evidence for structure results, with the conditional part stated rather than elided.'
  dominated_by: Not dominated by any corpus record; parallels IDEA-20260809-2d4427 for lattices.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for structure certificate: no records. WEB NOT CHECKED.'
