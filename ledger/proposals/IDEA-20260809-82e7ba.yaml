idea:
  id: IDEA-20260809-82e7ba
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Sweep the challenge space down and measure where forgery cost stops matching
    the entropy the parameters assume
  class: measurement
  claim: >-
    Soundness parameters assume each challenge contributes its full entropy, but
    the challenge is a hash output mapped into a structured set — a field element,
    a subset of indices, a coset — and the mapping can lose entropy or induce
    collisions. The claim is that measured forgery cost as a function of nominal
    challenge entropy departs from the assumed relation at some point, and that
    the departure is attributable to the mapping rather than to the hash.
  mechanism: >-
    Parameterize the challenge mapping; sweep nominal entropy; measure the
    expected work for a grinding prover to obtain a favourable challenge; compare
    against the nominal relation. Then ablate the mapping — replace it with a
    uniform sampler over the same set — to attribute any departure.
  why_not_a_renamed_known_approach: >-
    Sampling bias in challenge derivation is a known implementation concern. What
    is proposed is the measured departure curve plus the ablation that attributes
    it, which converts a caution into a quantity.
  predictions:
  - observable: measured forgery work versus nominal entropy
    metric: log2 work versus nominal bits
    predicted: Linear with slope one until the mapping's structure begins to matter, then flattening. The flattening point is the deliverable.
  - observable: effect of replacing the mapping with a uniform sampler
    metric: shift in the departure point
    predicted: The departure moves or disappears, attributing it to the mapping. No change means the departure comes from the protocol rather than the mapping, which is a different and more interesting result.
  minimal_test: >-
    Sweep nominal entropy across a declared range at fixed protocol parameters,
    measure grinding work with declared seeds, then repeat with the uniform
    sampler.
  controls:
  - 'UNIFORM-SAMPLER ABLATION as the attribution control.'
  - 'HASH-QUALITY CONTROL: the underlying hash is fixed and standard throughout, so the measurement isolates the mapping rather than the hash.'
  falsification_conditions:
  - No departure from the nominal relation anywhere in the swept range.
  - The departure is unchanged by the uniform-sampler ablation and cannot be attributed.
  interpretation_limits: >-
    Measured on a reference implementation at reduced parameters; extrapolation to
    realistic entropy is stated as such.
  sota_delta: 'No attack. Delta: an attributed departure curve where the field has a coding caution.'
  dominated_by: Complements IDEA-20260809-7ca867; not dominated by any corpus record.
  estimated_cost: Implementation small; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for challenge sampling bias: no records. WEB NOT CHECKED.'
  source_refs:
  - Protocol specifications defining challenge derivation -- REQUIRED READS.
