idea:
  id: IDEA-20260816-7001ed
  question_id: RQ-ARGON-141710
  added: '2026-08-16'
  title: Run this lane's graph pipeline unchanged on scrypt's second-loop access pattern and on two
    degenerate designs whose answers are structurally forced, so that every Argon2 number arrives
    with nearby objects on both sides of it rather than as a bare figure with nothing to be compared
    against.
  class: control
  claim: '(A) The inventor protocol''s section 8 audit four requires applying a method to the closest
    object where the hoped-for conclusion fails, on the grounds that a method which cannot distinguish
    the pair has not identified the load-bearing structure. This lane currently plans to measure Argon2
    and a randomized null, and nothing else. RQ-ARGON-141710''s own scope names scrypt and bcrypt
    as nearby objects, and no proposal under the question touches either. (B) The claim is that scrypt''s
    second loop -- which selects its access target from the CONTENT of the current accumulator over
    the whole previously filled array, rather than from a growing window under a recency-biased transform
    -- is the ideal nearby object, because it is a real deployed design in the same family whose access
    structure differs from Argon2''s in exactly the coordinate this lane''s entire mechanism story
    rests on, namely whether reference targets are window-bounded and recency-concentrated or unbounded
    and flat. Running the identical graph measurement on it converts an isolated Argon2 number into
    a two-point comparison in which the mechanism narrative makes a directional prediction it can
    fail. (C) It is further claimed that two degenerate designs bracket the scale from both ends with
    forced answers: the pure sequential chain, whose depth-reducing set must be essentially the whole
    graph and whose live set is exactly one, and the fully-connected-backward design in which every
    block references block zero, whose live set is trivially small. These are not nulls in the randomization
    sense; they are anchors with known values, and their role is to place the Argon2 and scrypt numbers
    on a scale rather than to test significance. (D) WHAT IS NOT CLAIMED: no comparative security
    claim between Argon2 and scrypt in either direction, and the record forbids one; no claim that
    either design is better, safer, or preferable; no claim about deployed parameters of either; and
    no assertion about what any published analysis of scrypt says, which this environment cannot check.
    bcrypt is deliberately excluded from the graph arm because its cost structure is not a large-array
    access DAG and forcing it into this pipeline would produce a number with no meaning. (E) The named
    way the cost model flatters the defender: comparing a design only against a randomized version
    of itself guarantees a favorable-looking ratio whenever the randomization is weaker, and never
    asks whether a differently structured real design would score better on the same instrument.'
  mechanism: 'STAGE 1: implement scrypt''s ROMix access structure as a reference-target array, at
    reduced N, directly from a primary specification -- and this is a hard prerequisite, because no
    scrypt specification is currently filed as a KN-LIT record in this repository and the whole arm
    is blocked until one is, exactly as RFC 9106 blocked the Argon2 arm until KN-LIT-7f3c21 was filed.
    STAGE 2: implement the two degenerate designs, whose reference arrays are one line each. STAGE
    3: run the lane''s existing measurement functions -- greedy depth-reducing set, exact native depth,
    exact live-set integral, orphan fraction, back-distance distribution -- on all four objects with
    byte-identical code, at matched node counts and matched edge counts, so no comparison is confounded
    by size. STAGE 4: check the two forced answers first: the sequential chain must return a removal-set
    size equal to the theoretical value for a path and a live-set integral of exactly one per step;
    the reference-block-zero design must return its own closed form. Neither is a result; both are
    instrument checks that gate everything after them. STAGE 5: report all four objects on one table,
    with the mechanism''s directional prediction stated in advance -- if recency-biased window-bounded
    selection is what makes Argon2''s graph cheap to shatter, then scrypt''s unbounded flat selection
    must score closer to the randomized null than Argon2 does. STAGE 6: apply the section 8 audit-four
    test explicitly: if the instrument returns indistinguishable numbers for Argon2 and scrypt, it
    has not identified the structure the mechanism narrative attributes the effect to, and that is
    recorded as a bound on the method rather than as a similarity between the designs.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril for scrypt, bcrypt, ROMix, nearby object across ledger/proposals/, ledger/hypotheses/
      and knowledge/; read ledger/questions/RQ-ARGON-141710.yaml scope block, which names scrypt and
      bcrypt as nearby objects; grep -l RQ-ARGON-141710 ledger/proposals/*.yaml and read all ten titles
      and classes; read docs/inventor-protocol.md section 8, audit four, on method ceiling and nearby-object
      control; check knowledge/literature/ for any filed scrypt specification.
    results: 'The term scrypt hits IDEA-20260812-318db8 under this question and several knowledge/literature
      records (KN-LIT-2689, KN-LIT-4892, KN-LIT-6385, KN-LIT-7247) plus knowledge/sources.json. The
      318db8 hit is a mention, not a measurement arm: that proposal''s whole design is Argon2 real
      graph against window-matched uniform null, and its test boundary lists only Argon2 variants.
      The term bcrypt hits IDEA-20260805-01dfba and H-AES-8c2d07, both under other questions, and
      KN-LIT-3f2ee6. RQ-ARGON-141710''s scope field explicitly lists scrypt and bcrypt as nearby objects
      for the question, so this is a scoped-in direction that nine months of proposals have not taken
      up. No proposal under this question has any measurement arm other than Argon2 and a randomized
      null. Critically, I did not verify that any of the scrypt literature records contains a usable
      primary specification -- their titles were not opened -- so the KN-LIT prerequisite in stage
      1 stands as a real blocking gap rather than a formality.'
    verdict: 'UNVERIFIED. No assertion is made about what any published analysis of scrypt, Argon2,
      or their comparison contains; this environment cannot read it and this record explicitly declines
      to guess. What is claimed new within this repository is running this lane''s own instrument
      on a second real deployed design and on two forced-answer anchors at matched size, and pre-committing
      the mechanism''s directional prediction across that pair. Assembled from known parts: the instrument
      is the lane''s existing code, the degenerate anchors are trivial, and the nearby-object requirement
      is quoted directly from docs/inventor-protocol.md section 8. The contribution is noticing that
      RQ-ARGON-141710''s own scope already asked for this and nobody did it.'
  object_first_candidate:
    tracked_object: 'The reference-target array as a design-agnostic representation: a single integer
      per block naming its non-chain predecessor, which is exactly what all four objects reduce to
      and exactly what makes them comparable on one instrument.'
    lossiness: 'The projection discards the compression function, the block size, the arithmetic,
      the salt handling, and every difference between the four designs except which earlier block
      each block reads. It is severely lossy and the losses are asymmetric across the objects: scrypt''s
      second loop and Argon2''s indexing differ in far more than their target arrays, and reducing
      both to arrays deliberately throws that away. That is defensible only because the quantity under
      study -- depth robustness, retention, back-distance -- is a function of the array alone, and
      the record states plainly that any conclusion is a conclusion about access structure, never
      about the designs as cryptographic objects. What survives the projection propagates deterministically
      for all four objects under the same rules, which is precisely why one code path can measure
      all of them.'
    propagation: 'One step of the target operation, for each design, appends a block with one chain
      edge and one reference edge. The designs differ only in where the reference edge may point:
      Argon2 into a growing window under the RFC offset transform; scrypt''s second loop into the
      whole filled array under a content-derived index; the sequential chain nowhere at all; the degenerate
      design always at block zero. Every graph functional this lane computes propagates identically
      given the array, so the comparison across designs is a comparison of four input arrays through
      one fixed function, with no per-design code path that could introduce a difference by implementation
      rather than by structure.'
    survival_score: For the two forced-answer anchors, the structure survives trivially and completely,
      by construction, at every size -- that is what makes them anchors. For the scrypt arm, the concrete
      statement is the largest matched node count at which the measured separation between the scrypt
      and Argon2 arms exceeds the null spread; below that size the two designs are indistinguishable
      on this instrument and above it they are not, and reporting that crossover size is the honest
      form of survival here.
  null_object_control: 'The randomized null runs on EVERY object, not only on Argon2 -- that is the
    design''s core requirement. For each of the four designs, a matched randomization is constructed
    that preserves node count, edge count and the design''s own target-eligibility support while destroying
    the selection rule within it: for Argon2 the window-matched uniform null already specified by
    the lane, for scrypt a uniform-over-filled-array null, for the sequential chain a null that is
    identical to it since there is nothing to randomize, and for the degenerate design a null that
    is likewise nearly identical. The nulls for the two anchors being trivially equal to the anchors
    is itself informative and is reported: a design with no selection freedom has no null distinct
    from itself, which sets the floor of what this instrument can detect. For any cross-design comparison
    to mean anything, each design''s own signal-minus-null gap must be reported alongside the raw
    numbers, since comparing raw values across designs with different supports would confound the
    selection rule with the support.'
  discriminated_from:
  - IDEA-20260812-318db8 and H-ARGON-ef2f0b measure Argon2 against a randomized version of itself,
    with no second real design anywhere in the test boundary; this record adds the nearby real object
    that inventor-protocol section 8 audit four requires and that RQ-ARGON-141710's own scope already
    named.
  - IDEA-20260809-bcf891 calibrates the greedy algorithm against families whose depth robustness is
    known independently. Those are synthetic calibration families chosen for having known answers;
    scrypt is a real deployed design chosen for differing from Argon2 in one specific structural coordinate.
    Different purpose, different objects, and both are needed.
  - IDEA-20260809-b17238 compares the three Argon2 variants on one harness. That is a within-design
    comparison across indexing modes; this is a cross-design comparison at matched size.
  - A comparative security evaluation of password-hashing designs. No security claim, no ranking,
    no recommendation and no attack appears; the deliverable is a table of graph functionals with
    each design's own null gap beside it.
  - Password-cracking benchmarks. Nothing is evaluated for guess throughput, no candidate list exists,
    and all inputs are synthetic and generated in-run.
  assumptions:
  - A primary scrypt specification can be obtained and filed as a KN-LIT record before the scrypt
    arm runs; until then that arm is blocked, exactly as the Argon2 arm was blocked before KN-LIT-7f3c21
    was filed, and no RECALLED description of scrypt is used anywhere.
  - Reducing all four designs to reference-target arrays preserves the quantities under study, which
    is true by definition for graph functionals but is a real restriction on what the comparison can
    mean.
  - Matched node and edge counts make the comparison fair; where a design cannot be matched exactly
    the mismatch is reported rather than smoothed.
  - The two degenerate anchors' closed forms are correctly derived; they are derived independently
    by two routes before use.
  - bcrypt is out of scope for the graph arm because its cost structure is not a large-array access
    DAG; this exclusion is a stated judgement rather than a claim about bcrypt.
  predictions:
  - metric: signal-minus-null gap in the depth-reducing-set size ratio, for scrypt's second loop relative
      to the same gap for Argon2, at matched node count
    direction: lower
    minimum_effect: at least 0.15 smaller in ratio units, that is, scrypt's access structure sits
      closer to its own randomized null than Argon2's does to its own, which is what the recency-bias
      mechanism narrative predicts and which fails if the two gaps coincide
  - metric: live-set integral ratio for the pure sequential chain
    direction: lower
    minimum_effect: exactly 1/q, a forced value from the closed form; any deviation halts the run
      as an instrument defect
  - metric: matched node count at which the scrypt and Argon2 arms first separate by more than the
      null spread
    direction: different
    minimum_effect: 'REFUSAL TO PRE-COMMIT: this crossover size is precisely what is unknown and no
      honest number can be stated in advance. What is pre-committed is that the sweep covers at least
      four matched sizes so a crossover, if present, is located rather than asserted.'
  - metric: mean back-distance as a fraction of array size, scrypt second loop versus Argon2i
    direction: higher
    minimum_effect: at least twice as large, since an unbounded uniform-over-filled-array selection
      has mean back-distance near one half of the filled portion while a recency-concentrated window-bounded
      selection does not
  minimal_test:
    design: 'One instrument, four designs, matched sizes. Build reference-target arrays for Argon2i,
      Argon2id, scrypt''s second loop, the pure sequential chain, and the reference-block-zero degenerate
      design, at matched node counts of 1024, 2048, 4096 and 8192 and matched edge counts. Run the
      lane''s existing measurement functions on all of them with byte-identical code: greedy depth-reducing
      set at the 50-percent threshold, exact native depth, exact live-set integral, orphan fraction,
      back-distance distribution. Build each design''s own matched randomized null, twenty draws,
      and report each design''s signal-minus-null gap rather than its raw value. Verify the two anchors
      against their independently derived closed forms before reading anything else. Report the five-row
      table per size, the gaps, and the crossover size at which scrypt and Argon2 separate. Cost is
      dominated by the greedy passes -- roughly one hundred graphs per size -- and is minutes to an
      hour on one core; the real cost is the blocked KN-LIT prerequisite and the scrypt implementation.'
    controls:
    - Pure sequential chain anchor with independently derived closed forms for every reported functional.
    - Reference-block-zero degenerate anchor with its own closed forms at the opposite extreme.
    - A per-design matched randomized null, so that cross-design comparison is on gaps rather than
      on raw values with different supports.
    - Matched node and edge counts across designs, with any unavoidable mismatch reported explicitly.
    - Byte-identical measurement code across all designs, verified by measuring one design through
      two nominally different entry points and checking equality.
    required_metrics:
    - greedy depth-reducing-set size and its ratio to the design's own null, per design and size
    - exact native depth per design and size
    - live-set integral ratio per design and size
    - orphan fraction per design and size
    - mean and full back-distance distribution per design
    - crossover matched size at which scrypt and Argon2 gaps separate beyond null spread
  falsification_conditions:
  - The scrypt and Argon2 signal-minus-null gaps coincide within null spread at every matched size,
    which under inventor-protocol section 8 audit four is recorded as the instrument failing to identify
    the structure the mechanism attributes the effect to -- a bound on the method, not a similarity
    between designs.
  - Either anchor fails to reproduce its independently derived closed form, halting the run.
  - Scrypt's mean back-distance is not at least twice Argon2i's, falsifying the structural premise
    on which the whole comparison is built.
  - The byte-identical-code check fails, meaning some measured difference could be an implementation
    difference.
  - The scrypt arm cannot be built because no primary specification can be filed, in which case the
    arm is reported as blocked and no RECALLED substitute is used -- a budget and access outcome,
    never a negative result about scrypt.
  confounders:
  - 'Matched node count does not mean matched difficulty: scrypt''s second loop performs 2N operations
    over an N-block array while Argon2 performs t*m over m, so the natural matching is ambiguous and
    the choice must be declared and its alternative reported.'
  - The greedy heuristic's approximation error may differ systematically between designs with different
    back-distance profiles, which would masquerade as a structural difference; the companion exact-DP
    record in this batch is the only route to bounding this and its absence is a stated limitation.
  - Reduced N for scrypt changes its second loop's character relative to deployed N, just as reduced
    q does for Argon2, and the two reductions are not equivalent.
  - Filing a KN-LIT record for scrypt from a source of uncertain provenance would silently make every
    scrypt number unreliable; the provenance requirement is as strict as it was for RFC 9106.
  - The two anchors have no distinct nulls, so their gaps are zero by construction, and reading that
    as them being uninteresting rather than as the instrument's floor would be a misreading.
  interpretation_limits:
  - No comparative security statement between Argon2 and scrypt is made or supported, in either direction,
    and none may be derived from this table.
  - All conclusions are about access structure reduced to reference-target arrays, not about the designs
    as cryptographic objects.
  - Reduced sizes for all designs; nothing is at deployed parameters for either.
  - bcrypt is excluded and nothing here bears on it.
  - Depth-reducing-set numbers remain heuristic upper bounds inherited from the lane's existing instrument.
  target_complexity:
    time_exponent: No attack exponent is claimed for any design. The measurement is one greedy pass
      per graph, O(n^2) worst case, over roughly one hundred graphs per matched size.
    memory_exponent: No attack exponent is claimed. Each graph is O(n) integers.
    best_known: Inside this repository the incumbent is the Argon2-against-its-own-randomized-null
      comparison specified by H-ARGON-ef2f0b and EXP-ARGON-2608c2, with no second design in any test
      boundary. RQ-ARGON-141710's scope already names scrypt and bcrypt as nearby objects, so the
      incumbent is a stated intention nobody has executed. Nothing is asserted about external comparative
      analyses.
    hidden_overhead: 'The blocked KN-LIT prerequisite is the dominant hidden cost and it is not a
      formality: the Argon2 arm of this lane spent an entire review cycle on RFC access, per EV-ARGON-209ece,
      and the scrypt arm will face the same problem with less institutional memory. Second, the matching
      decision -- what makes an scrypt instance the same size as an Argon2 instance -- looks like
      bookkeeping and silently determines the answer.'
  dominated_by: 'n/a (no result claimed). Pareto check performed rather than asserted: all ten proposals
    under RQ-ARGON-141710 were enumerated and read by title and class, EV-ARGON-209ece is a proposal
    review with no measurement, and experiments/EXP-ARGON-2608c2/runs/ is empty, so no time, memory
    or data/query frontier row exists under this question at all. Across questions, no record measures
    scrypt''s access graph, so there is no row on any axis for the scrypt arm either.'
  sota_delta: No attack; control contribution only. The quantitative delta is that every Argon2 graph
    number this lane produces currently has exactly one comparator, its own randomization, and this
    record supplies three more at matched size, two of them with forced values. The reported delta
    is the difference between the Argon2 and scrypt signal-minus-null gaps in ratio units, which is
    a number that does not currently exist anywhere in this repository in any form.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the two anchors reproduce their closed forms and the instrument
    check passes: very high, around 0.95. That a primary scrypt specification can be filed as a KN-LIT
    record in this environment: genuinely uncertain, around 0.5, and it is a hard gate -- the Argon2
    arm needed a raw HTTP fetch route that WebFetch could not provide, per EV-ARGON-209ece. That scrypt''s
    mean back-distance is at least twice Argon2i''s: high, around 0.85, since this follows almost
    directly from unbounded versus windowed selection. That the signal-minus-null gaps separate by
    0.15 in ratio units: moderate, around 0.45 -- and the failure case is the more interesting one,
    since under section 8 audit four it would bound what this lane''s instrument can identify.'
