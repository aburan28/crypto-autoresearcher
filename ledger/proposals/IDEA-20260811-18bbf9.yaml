idea:
  id: IDEA-20260811-18bbf9
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE SHAM CURVE - a null object of the same SHAPE as a special-j Semaev system
    but with no curve behind it: take a generic curve's S_m and delete exactly
    the monomials that a degeneration locus deletes, then solve all three systems
    (generic, sham, genuinely special) under one paired protocol; the three-way
    outcome DISCRIMINATES, before any interpretation, between a purely
    combinatorial support effect, a coefficient-value effect, and no effect at
    all - which is the control the committed j = 0 timing pair never had
  class: control

  object: >-
    OBJ-SHAM, a polynomial system carrying a special-j SUPPORT PATTERN with
    generic COEFFICIENT VALUES. It is not the Semaev system of any curve, and
    that is exactly its purpose: it occupies the fibre of the support map over a
    special-j support class at a generic point, so comparing it with the real
    special-j system isolates the contribution of support from the contribution
    of everything support forgets.

  resource: >-
    R1 and R2 on the two real arms; the sham arm consumes no curve resource at
    all, which is what makes it a null. H-ENDO-001 admissibility: no endomorphism
    acts on G in any arm.

  claim: >-
    (A) THE GAP THIS FILLS, STATED FROM COMMITTED RECORDS. The campaign has one
    timing measurement bearing on special j: at j = 0 the S_3 support drops 30.8%
    while Groebner time moves -0.44%, and at j = 1728 support drops 23.1% while
    time moves -0.67% and gb_size moves +3.41% (red_team_notes.md section 11,
    committed). That pair is quoted throughout the campaign as the standing
    lossy-projection demonstration. IT HAS NO CONTROL. There is no measurement of
    what a system with the SAME SUPPORT and DIFFERENT COEFFICIENTS costs, so the
    campaign cannot say whether the near-zero timing change means "support does
    not matter" or "support matters but was cancelled by something else at
    j = 0". Those are different explanations with different consequences and
    nothing in the ledger separates them.
    (B) THE CONSTRUCTION. Fix a prime p, a generic curve E_g and a degeneration
    locus L with vanishing coefficient block B (for m = 3, L = {a = 0} with
    |B| = 4, or L = {b = 0} with |B| = 3; for m = 4, any of the six weight-12
    loci with |B| in {48, 36, 6, 6, 4, 1}). Build three polynomials:
      ARM-G  S_m of E_g, untouched.
      ARM-S  S_m of E_g with exactly the monomials of B deleted - same monomial
             positions, generic coefficients elsewhere. THE SHAM.
      ARM-X  S_m of a genuine curve on L at the same p.
    All three are put through the identical solve pipeline with identical factor
    bases, identical targets, identical monomial order, identical budget, and a
    paired design over seeds.
    (C) THE THREE-WAY READING, FIXED BEFORE THE DATA EXISTS.
      OUTCOME A - cost(ARM-S) is indistinguishable from cost(ARM-X) and both
        differ from cost(ARM-G): the effect is PURELY COMBINATORIAL. Support is
        the whole story, the coefficient values are irrelevant, and the lane
        should chase support after all - contradicting the predicted O-INTERIOR
        of IDEA-20260811-97e244.
      OUTCOME B - cost(ARM-S) is indistinguishable from cost(ARM-G) and both
        differ from cost(ARM-X): the effect is a COEFFICIENT-VALUE effect that
        support cannot explain. This would point at reducibility or singular
        structure and would promote IDEA-20260811-6034d0 and
        IDEA-20260811-34f29d.
      OUTCOME C (PREDICTED) - all three indistinguishable within the paired
        design's stated detectable effect: there is no cost effect of either
        kind, the committed j = 0 pair is confirmed with a control for the first
        time, and the lossy projection is established rather than asserted.
      OUTCOME D - ARM-S differs from BOTH: the sham is not a valid null, most
        likely because deleting coefficients changed the dimension or degree of
        the ideal; the run is INVALID rather than informative and the invalidation
        rule below catches it before interpretation.
    (D) WHAT MAKES THIS DIFFERENT FROM EVERY NULL THE CAMPAIGN HAS RUN. NULL-C is
    a between-class mean detector with power 1.00 at a 0.9% shift and says
    nothing about within-class or within-curve structure (red_team_notes.md
    section 5); it is DISQUALIFIED here and is not used. NULL-B is a binomial
    null for decomposition rates and is about a different statistic. The sham
    curve is a null on the ALGEBRAIC OBJECT rather than on the sampling
    distribution, which is a null the campaign does not currently possess.

  mechanism: >-
    Solver cost is a function of the ideal, and the ideal is determined by the
    coefficients, of which support is a coarse shadow. If cost depended only on
    support, then any system with the same support would cost the same, and the
    sham would reproduce the special curve exactly. If cost depended on finer
    structure - a factorisation, a singular locus, a non-generic Hilbert function
    - the sham would behave like the generic system, because deleting monomials
    at generic coefficients does not create any of those. The experiment is
    therefore a direct fibre probe of the support map, and its three outcomes
    correspond exactly to the three places the dependence could live.

  novelty_status: speculative
  novelty_note: >-
    The construction is new in this program: corpus grep finds no record building
    a support-matched polynomial with generic coefficients, and no control of any
    kind attached to the committed j = 0 timing pair. It is labelled `speculative`
    rather than `adaptation` because the CONTROL's validity - that a
    coefficient-deleted system remains a comparable computational object - is
    itself an assumption that the invalidation rules test rather than assume.
    External literature NOT checked for prior use of support-matched nulls in
    Groebner-basis benchmarking, which is a plausible place for prior art and is
    a deliverable of the minimal test.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-bfa86b, which plants a KEY-SIDE signal (a small-box GLV key)
    to calibrate rho and BSGS instruments; that plant is about the search
    instrument, this one is about the algebraic instrument, and neither
    substitutes for the other. NOT IDEA-20260807-a3d644, whose nulls are matched
    CURVES; the sham is deliberately not a curve. NOT the L14 instrument lane's
    NULL-B and NULL-C, both of which are sampling nulls.

  assumptions:
  - >-
    Deleting a coefficient block leaves a zero-dimensional ideal of the same
    degree in the f_V-bearing formulation. THIS MUST BE CHECKED PER ARM AND IS AN
    INVALIDATION RULE, not an assumption to be carried: if the sham ideal has a
    different dimension or degree from ARM-G, it is not a valid null and the cell
    is dropped and reported as dropped.
  - >-
    The host can run a timing experiment honestly. DEC-20260810-d70ece NA6
    records load averages of 51.08 / 50.05 / 48.10 on a 14-core host at one probe
    and 43.77 / 47.15 / 47.15 at another, and states that a statistical contract
    cannot be run honestly at that oversubscription. THIS CONTRACT IS A TIMING
    CONTRACT AND IS THEREFORE GATED ON HOST LOAD; a degraded run is an
    infrastructure event and never a null result.
  - >-
    Both the f_V-free and f_V-bearing formulations are run and reported
    separately, because the deployed system's solving degree is pinned by |V|
    (EV-ICINV-6b6264 boundary 2) and only the f_V-free one is a curve functional.

  proof_search_map:
    bottleneck: >-
      The bottleneck is the missing control on the campaign's single most-cited
      cost measurement. Without it, "support does not project onto cost" is an
      observation about one pair of numbers rather than a controlled result.
    baseline_embedding:
      parameter_slice: >-
        ARM-G at m = 3 with the committed factor-base configuration is the
        baseline slice, and the contract must reproduce the committed Groebner
        time and gb_size for j = 0 and j = 1728 relative to generic - the
        -0.44%, -0.67% and +3.41% figures - within the stated run-to-run
        variability, before any sham arm is interpreted.
      reproduction_check: >-
        A frozen regression fixture: re-run the committed j = 0 / generic pair on
        the same code path and confirm the sign and order of magnitude. If the
        pair cannot be reproduced, the timing instrument has drifted and no
        comparison is admissible.
    observation_collision:
      observable: Groebner solve time, gb_size, and solving-degree proxy.
      distinct_preimage_search: >-
        PERFORMED. Two very different systems can share a solve time by accident,
        which is why the design is PAIRED over seeds and reports a distribution
        rather than a point estimate. More seriously: the campaign's own
        groebner_basis_max_degree is annotated in source as "proxy, NOT degree of
        regularity" (harness/semaev.py line 85, committed), so the degree
        observable is known to collide with the quantity it is named after. The
        contract must report it under its true name and must not infer d_reg.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the support map: hold support fixed, vary coefficients. The
        sham and the special-j system are two points of one fibre, and the
        generic system is a point of a different fibre.
      predicted_gain: >-
        Turns an uncontrolled anomaly into a three-way discrimination with a
        pre-registered reading for each branch. That is the entire value of the
        record.
    quantifier_order: >-
      FOR ALL degeneration loci L and FOR ALL generic curves E_g, the solve cost
      of ARM-S equals the solve cost of ARM-G within the stated band. The
      existential that breaks it is THERE EXISTS a locus and a generic curve
      where the sham costs measurably less - which would be OUTCOME A. Note the
      claim quantifies over E_g, so the design must use several generic curves
      and not one, or the quantifier is untested.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the tested p, m, factor-base size, monomial order and budget, the
        three arms are indistinguishable at the stated detectable effect size.
        It CANNOT certify that no cost effect exists at other parameters, and the
        record must report the minimum detectable effect rather than claiming
        absence.
      nearby_object_control: >-
        The nearby object where a difference SHOULD appear is a system with a
        genuinely smaller solving degree - e.g. one factor-base polynomial of
        lower degree. Running that and confirming the pipeline sees a difference
        is the method's sensitivity floor and it is a blocking control.
    proof_obligations:
    - claim: The sham ideal has the same dimension and degree as ARM-G
      responsibility: interface
    - claim: The three arms are indistinguishable at the stated band
      responsibility: success_probability
    - claim: The pipeline detects a planted genuine cost difference
      responsibility: interface
    - claim: The committed j = 0 pair reproduces
      responsibility: baseline

  predictions:
  - metric: paired_groebner_time_ratio_sham_over_generic
    direction: different
    minimum_effect: >-
      Within +-3% with a 95% paired confidence interval containing 1.000. Pre-
      registered as NO DIFFERENCE. The 3% band is chosen a priori to be wider
      than the committed -0.44% / -0.67% effects and is an UNTESTED TOLERANCE,
      stated as such.
  - metric: paired_groebner_time_ratio_special_over_generic
    direction: different
    minimum_effect: >-
      Within +-3%, pre-registered as NO DIFFERENCE, and expected to reproduce the
      committed sign (slightly negative at j = 0).
  - metric: gb_size_ratio_sham_over_generic
    direction: different
    minimum_effect: >-
      Within +-6%, pre-registered as NO DIFFERENCE. The band is wider because the
      committed gb_size effect at j = 1728 was +3.41%, i.e. the wrong direction
      and larger than the timing effect, so the quantity is known to be noisy or
      structurally unrelated to support.
  - metric: ideal_dimension_and_degree_equality_across_arms
    direction: different
    minimum_effect: >-
      EXACT EQUALITY required for the cell to be admissible. Any inequality
      invalidates that cell of the sham arm; the count of invalidated cells is
      reported and is itself informative about how violent the deletion is.
  - metric: sensitivity_floor_detection
    direction: different
    minimum_effect: >-
      The planted genuine cost difference must be detected with the paired design
      at the declared seed count. A miss makes every null in this record void.

  minimal_test:
    design: >-
      A PAIRED TIMING EXPERIMENT WITH AN ALGEBRAIC NULL, GATED ON HOST LOAD. (1)
      Verify host load is below a declared threshold before and after every run
      and record it from a source, not by hand (CORR-20260810-7cf0e9 corrected an
      unsourced load-average triple; the contract must bind the source). (2)
      Reproduce the committed j = 0 / generic timing pair. (3) For m = 3 with
      L in {a = 0, b = 0}, and for m = 4 with the two largest weight-12 blocks
      (48 and 36), construct ARM-G, ARM-S, ARM-X at p = 4001 with at least five
      distinct generic curves E_g and a declared factor-base density swept over
      at least three values bracketing 1/m! ~ 0.167 (the committed over-dispersion
      decays from 2.04 to 0.93 as density falls, red_team_notes.md section 4, so
      the saturated row must not be run alone). (4) Solve all arms with identical
      settings, paired over at least 20 seeds, reporting the full distribution
      and not a point estimate (committed failure mode N5). (5) Check ideal
      dimension and degree per arm as an admissibility gate. (6) Report both
      f_V-free and f_V-bearing formulations in separate tables.
    controls:
    - >-
      C-SENSITIVITY (BLOCKING). A planted genuine cost difference - e.g. reducing
      the factor-base size by a factor that should change the solve time by a
      predictable amount - must be detected by the paired design. Without it the
      nulls are void (DECOMPOSITION.md L14, both directions).
    - >-
      C-DIMENSION (BLOCKING). Ideal dimension and degree equal across arms per
      cell, or the cell is dropped.
    - >-
      C-LOAD (BLOCKING). Host load recorded from a bound source before and after
      each run, below the declared threshold. Above it, the run is an
      infrastructure receipt and never a null.
    - >-
      C-ORDER. Two monomial orders; a cost conclusion that flips with order is a
      conclusion about the order.
    - >-
      NULL-C IS EXPLICITLY NOT USED and the contract must say so. It is a
      between-class mean detector by its own committed characterisation and this
      design has no classes in it at all.
    required_metrics:
    - groebner_time_distribution_per_arm_per_seed
    - gb_size_per_arm_per_seed
    - groebner_basis_max_degree_proxy_per_arm_reported_under_its_true_name
    - ideal_dimension_and_degree_per_arm
    - host_load_before_and_after_each_run_with_source
    - sensitivity_control_detection_boolean
    - dropped_cell_count_and_reasons

  lossy_projection_answer: >-
    THIS RECORD IS THE MEASUREMENT THE LOSSY-PROJECTION TEST HAS BEEN MISSING. It
    does not argue about the projection; it runs the identical cost measurement
    on the two points of a single fibre and on a point outside it. The protocol's
    demand that a signal be an artifact until a control speaks is met literally.
    THE HONEST WEAKNESS, STATED: the outcome most likely is C, "no difference
    anywhere", and a null on a timing measurement is only as good as its power -
    so the record's real deliverable is a MINIMUM DETECTABLE EFFECT for the
    campaign's central cost functional, which the campaign has never established
    for any Groebner comparison.

  t5_reachability_answer: >-
    NOT ENGAGED. The sham is not a curve, so it is not reachable by anything and
    the notion does not apply to it. For ARM-X, T5 is answered by
    IDEA-20260811-3e08e0 (at most twelve classes per p contain a special-j
    vertex) and by T4 for the CM points. If OUTCOME A or B fired, reachability
    would become the binding gate immediately and would already be answered
    negatively, which is a reason to run the cheap census FIRST.

  null_object: >-
    ARM-S, the sham, IS the null object, and it is a null of exactly the right
    shape - same monomial positions, same variable count, same degree,
    generic coefficients. C-SENSITIVITY is the matching positive control.
    Together they satisfy both directions of the L14 requirement.

  falsification_conditions:
  - >-
    C-SENSITIVITY is not detected. The instrument is blind; the run is INVALID
    and no null may be reported.
  - >-
    ARM-S and ARM-X agree with each other and differ from ARM-G beyond the band.
    OUTCOME A: support is the whole story and O-INTERIOR is falsified.
  - >-
    ARM-S agrees with ARM-G and ARM-X differs beyond the band. OUTCOME B: a
    coefficient-value effect exists; escalate to the reducibility and
    singular-locus records.
  - >-
    The sham ideal's dimension or degree differs from ARM-G in most cells. The
    null is not valid at this deletion size and the m = 4 large-block arms must
    be dropped, retaining only the small-block ones.
  - >-
    The committed j = 0 pair does not reproduce. The instrument has drifted and
    the whole comparison is inadmissible.
  - >-
    Host load exceeds the declared threshold. Infrastructure receipt, never a
    result (AGENTS.md rule 5).

  confounders:
  - >-
    Host oversubscription, which is a live and documented problem on this
    execution host and is the single most likely cause of a spurious timing
    difference. It is a blocking gate, not a caveat.
  - >-
    Factor-base density. The committed over-dispersion decays from 2.04 to 0.93
    as density falls; a single saturated row is not admissible and the sweep is
    mandatory.
  - >-
    Target sampling. If any arm draws targets, it must use targets_B
    (harness/exp_icinv_fullgroup.py) and not targets_uniform, which samples only
    the cyclic subgroup <G> and is disputed by H-ICINV-6c7920 (status
    `specified`, neither presumed true nor false). Reusing targets_uniform would
    measure two different estimands on the two halves of every configuration.
  - >-
    The sham's mathematical meaninglessness. ARM-S does not solve any ECDLP
    instance and its solutions are not decompositions; only its COST is
    comparable, and any correctness statistic from it is void by construction.
    The contract must not compute a decomposition rate on ARM-S.
  - >-
    The four committed p = 4001 classes carry an ordered class-mean gradient
    (traces 36, -36, 12, -12 with distinct rate means, red_team_notes.md section
    4), so an additive planted shift is constructive or destructive BY SIGN. This
    design does not plant between-class shifts and so does not inherit that
    asymmetry - stated because a careless extension of the design would.

  interpretation_limits:
  - >-
    Scoped to the tested p, m, factor-base configuration, monomial order, engine
    and budget. A null is a bound at the stated detectable effect, never an
    absence.
  - >-
    ARM-S is not a curve; nothing measured on it is a statement about elliptic
    curves.
  - >-
    claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.

  heuristic_assumptions:
  - id: H1
    statement: >-
      A polynomial obtained from S_m by deleting a coefficient block, with the
      remaining coefficients generic, behaves computationally like a random
      member of its support class - in particular its ideal is zero-dimensional
      of the same degree as the generic one in the f_V-bearing formulation.
    rigorous_support: >-
      In the f_V-bearing formulation the two univariate membership polynomials
      already generate a zero-dimensional radical ideal of degree |V|^2 in shape
      position, and S_m only cuts it down (MATCHED-ORDER-DESIGN.md section 2,
      derived from the committed harness source). So zero-dimensionality is
      structural rather than heuristic there; the heuristic part is only that the
      degree is unchanged.
    validation_plan: >-
      Sample: every constructed sham cell, of which there are at least
      5 curves x 4 loci x 3 densities. Comparison: exact equality of dimension
      and degree against ARM-G, computed by staircase from a Groebner basis.
      Tail check: report the worst-case cell and inspect it individually. Any
      cell failing is dropped and counted, not silently retained.
  - id: H2
    statement: >-
      Paired Groebner timings at fixed input are log-normally distributed with a
      run-to-run coefficient of variation small enough that 20 seeds detect a 3%
      mean shift at 80% power.
    rigorous_support: >-
      No theorem; this is an empirical assumption about the instrument, and the
      campaign has never measured it. It is stated as a heuristic precisely
      because the record's whole value rests on the achieved power.
    validation_plan: >-
      MEASURE IT FIRST, as a pilot arm before the main run: 40 repetitions of the
      identical input, report the empirical distribution of solve time, its
      coefficient of variation, and the resulting minimum detectable effect at 20
      seeds. If the achieved MDE exceeds 3%, the band is widened BEFORE the main
      run and the widening is recorded, never adjusted afterwards.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant on CM curves (KN-TECH-018), under which a
      factor at or below sqrt(6) is baseline calibration.
    hidden_overhead: Not applicable.
    tradeoff_note: >-
      Not applicable to a claim. Operationally, memory is the binding constraint
      on the m = 4 arms and the contract caps it.

  dominated_by: >-
    Every row of the attack frontier dominates - parallel rho with distinguished
    points, BSGS, kangaroo, index calculus over prime fields. Checked against
    each. This record produces no solver improvement and its predicted outcome is
    that there is none to produce.
  sota_delta: ZERO on every axis.

  estimated_cost:
    implementation: medium
    compute: high
  compute_note: >-
    The only high-compute proposal in this batch, because it is the only one that
    measures time. It is also the only one gated on host load, and the coordinator
    should treat that gate as blocking rather than advisory given the recorded
    load averages on this host.

  recommended_priority: medium
  expected_value: >-
    MEDIUM. Its scientific value is high - it supplies the missing control on the
    campaign's most-cited cost measurement, and its three-way reading is fixed
    before the data - but its cost is the highest in the batch and its predicted
    outcome (OUTCOME C, no difference anywhere) is already the campaign's working
    assumption. THE CASE FOR RUNNING IT ANYWAY: the working assumption currently
    rests on two uncontrolled numbers, and the record would replace them with a
    controlled null plus a stated minimum detectable effect, which is what makes
    the campaign's other negatives citable. THE CASE FOR DEFERRING IT: if
    IDEA-20260811-97e244 confirms O-INTERIOR symbolically for pennies, the
    expensive timing experiment becomes confirmatory rather than decisive. I
    would run it AFTER the symbolic records, and only if the host load gate can
    actually be met.
