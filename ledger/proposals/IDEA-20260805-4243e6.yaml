idea:
  id: IDEA-20260805-4243e6
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-08-05'
  title: >-
    The hiding budget IS the rho budget: an unconditional class-mass identity
    that caps every ordinary F_p secret-isogeny trapdoor at zero exponent margin,
    reduces the whole design problem to a detection/exploitation cost asymmetry,
    and gates the queued BATCH-003 "full-class" screen before it spends budget

  class: control

  claim: >-
    For an ordinary curve E/F_p with #E(F_p) = N = p + 1 - t, the set of curves
    that a Teske-style designer may use as a secret trapdoor endpoint is EXACTLY
    the F_p-isogeny class of E (Tate: F_p-isogenous <=> equal point count), whose
    size, counted as F_p-isomorphism classes weighted by 1/|Aut|, is the
    Hurwitz-Kronecker class number H(4p - t^2). Three consequences follow by
    counting alone, before any experiment.
    (A) HARD CAP, UNCONDITIONAL. h(D) <= (sqrt|D|/pi)(log|D| + 2) from the class
    number formula with the trivial bound on L(1,chi), and |4p - t^2| <= 4p, so
    H = O(sqrt(p) log p) for EVERY p and EVERY trace. No GRH, no Brauer-Siegel,
    no heuristic. The designer's entire hiding space is p^{1/2 + o(1)}.
    (B) TYPICAL VALUE, EXACT. The Kronecker-Hurwitz relation
    sum_{t^2 <= 4p} H(4p - t^2) = 2p over the ~4 sqrt(p) admissible traces forces
    the MEAN class size to be exactly 2p / (2*floor(2 sqrt p) + 1) -> sqrt(p)/2,
    while matched Pollard rho on a prime-order N ~ p costs sqrt(pi N / 2) ~
    1.2533 sqrt(p) group operations. Ratio 0.399.
    (C) THE ATTACK THE CAMPAIGN HAS NOT COSTED. A public attacker walks the class
    from E_pub by small-degree isogenies, testing each curve for the endpoint
    weakness and RETAINING THE PATH TAKEN. There is no separate path-recovery
    stage: the walk that finds E_s is the path. Total cost is about
    H * (c_test + c_step) where c_test is the per-curve weakness test and c_step
    one isogeny step, both in group-operation-equivalents. Hence the security
    margin of ANY ordinary-F_p secret-isogeny trapdoor over matched rho is
    exactly log2(c_test + c_step) - 1.33 bits and is ZERO IN THE EXPONENT.
    The claim is therefore NOT that such trapdoors are impossible. It is that
    rarity of the endpoint weakness is irrelevant to this bound, and that the
    only design lever it leaves is an asymmetry: the weakness must cost more to
    RECOGNIZE without the secret than to EXPLOIT with it. That reframing, and the
    named escape (a weakness not recognizable without the trapdoor, for which the
    bound does not apply at all), is the deliverable.

  object_first_candidate:
    tracked_object: >-
      THE DESIGNER'S SECRET, MEASURED AS A SET. Not a curve, not a meter, not a
      polynomial system: the cardinality of the set of admissible trapdoor
      endpoints, followed through the construction as a single integer and its
      base-2 logarithm (the hiding entropy in bits). The chain followed is
      p -> t -> D_pi = t^2 - 4p -> H(4p - t^2) = |isogeny class| -> log2 H
      = bits of secret the designer can possibly hide -> compared against
      log2(matched rho work) = (1/2) log2 N + 0.33.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: Semaev / summation-
      polynomial index calculus; Groebner and Macaulay solving-degree meters;
      GHS and Weil-descent transfer; MOV / Frey-Ruck pairing transfer;
      anomalous (trace-1) Smart transfer; GLV/GLS endomorphism speedups;
      Pollard rho / kangaroo / BSGS variants; xedni and lifting attacks.
      NOT off-limits, deliberately: the CM / class-group family. This proposal
      does not propose an attack inside that family; it COUNTS inside it. That
      is the one move the "declare the family off-limits" rule does not forbid,
      and it is the same exemption IDEA-20260805-e805b6 took.
    newness_score: >-
      The class-number arithmetic is entirely classical and certainly known to
      number theorists. What is not in this corpus, and what the audit supplies,
      is (i) the identification of the isogeny class size with the DESIGNER'S
      HIDING BUDGET, (ii) the observation that the class walk needs no separate
      path-recovery stage, and (iii) the resulting quantitative statement of the
      one requirement GOAL-ECTD-001's completion criterion states only
      qualitatively ("public path search and public detection remain at least
      matched-rho hard"). No ECTD record contains a number for that limb.
    testability_score: >-
      Very high, and nearly free. The headline is an inequality plus an exact
      summation identity; both are checkable in pure Python (no Sage, no sympy,
      no PARI -- verified absent in this container) in seconds to minutes at
      p up to ~10^7 by counting reduced binary quadratic forms.
    survival_score: >-
      The tracked object survives the designer's entire secret operation by
      construction: the F_p-isogeny class is invariant under every F_p-isogeny.
      That invariance is exactly what makes it a bound on the designer rather
      than a tool for him.

  lossy_projection_identifiability_audit:
    projection: >-
      Full trapdoor instance (p, E_pub, secret chain chi, endpoint E_s, weakness
      W, all key material) --> the single integer H = |isogeny class of E_pub|,
      equivalently the pair (p, t).
    what_is_discarded: >-
      Everything except p and the trace t. The fibre over an observed H is the
      entire instance space at that (p, t): every curve in the class, every chain
      between any two of them, every weakness definition.
    why_genuinely_lossy: >-
      Maximally lossy. This is not a re-coordinatisation of the instance; it is a
      count of the instance space itself.
    why_compatible_with_the_operations: >-
      Exactly compatible, and that is the mechanism. The horizontal CM action of
      Cl(O) is simply transitive on each volcano level, and by Tate's isogeny
      theorem F_p-isogeny preserves #E(F_p), so H is INVARIANT under every
      operation the designer is permitted to perform. The retained quantity
      therefore propagates deterministically -- trivially so, since it does not
      move at all.
    is_it_only_a_change_of_coordinates: >-
      No. Checked explicitly against BOTH named failure modes.
      (1) The KN-LIT-7595 failure (nothing discarded, e.g. (Delta,Pi) =
      (x xor y, x*y) in char 2): NOT PRESENT -- H is a single integer standing
      for a set of size H, so the projection is about as lossy as a projection
      can be.
      (2) The MIRROR failure (so lossy it is constant across instances, zero
      comparator spread): CHECKED AND ABSENT AS AN INSTANCE STATISTIC. Across
      the ~4 sqrt(p) traces at fixed p, H ranges over roughly three orders of
      magnitude at p = 10^6 (SCOUT-COMPUTED below), so the comparator has real
      spread and the second horn of the mechanism uses precisely that spread.
      It IS constant along the designer's own operation, which is the point:
      constant under the treatment, variable across instances, is the signature
      of a genuine invariant rather than of a constant of the apparatus.

  mechanism: >-
    DERIVED IN THIS RECORD. Every step is either elementary or explicitly
    labelled RECALLED-UNVERIFIED with a stage of the experiment assigned to
    check it. No theorem number, page, or venue is asserted anywhere below.

    STEP 1 -- THE ENDPOINT SET IS THE ISOGENY CLASS, AND ITS SIZE IS A CLASS
    NUMBER. Tate's isogeny theorem over finite fields: two elliptic curves over
    F_p are F_p-isogenous if and only if they have the same number of F_p-points.
    (Filed in this corpus as the "algorithmic Tate isogeny theorem" framing of
    KN-LIT-7630; the theorem itself is standard and is RECALLED here, not
    fabricated.) So a Teske-style designer who needs the DLP on E_pub to
    transport to a secret endpoint E_s must take E_s with #E_s(F_p) =
    #E_pub(F_p) = N. Write t = p + 1 - N, D_pi = t^2 - 4p < 0. The number of
    F_p-isomorphism classes of elliptic curves over F_p with trace t, counted
    with the standard 1/|Aut| weighting, is the Hurwitz-Kronecker class number
    H(4p - t^2) = sum over conductors f with f^2 | (4p - t^2) and
    (4p-t^2)/f^2 = 0 or 3 mod 4, of h(-(4p-t^2)/f^2) with the usual 1/2 and 1/3
    weights at discriminants -4 and -3 (Deuring). The vertical volcano levels are
    INSIDE this count, not outside it -- that is why this bound also covers
    priority family (2).

    STEP 2 -- THE UNCONDITIONAL CAP. The Dirichlet class number formula gives
    h(D) = sqrt|D| * L(1, chi_D) / pi for D < -4, and the elementary bound
    L(1, chi_D) = O(log|D|) (Polya-Vinogradov / partial summation, no GRH) gives
    h(D) <= (sqrt|D| / pi)(log|D| + 2) as a clean sufficient form
    [RECALLED-UNVERIFIED in this exact constant; the EXPONENT 1/2 is the only
    thing the argument needs, and the constant is re-measured in Stage 2 rather
    than trusted]. Summing over the O(log|D|) conductor divisors preserves the
    exponent. Since 0 < 4p - t^2 <= 4p always,
        H(4p - t^2)  =  O( sqrt(p) * log p )   for every p, every trace.
    THIS IS THE DIRECTION THE BARRIER NEEDS AND IT IS UNCONDITIONAL. Note the
    asymmetry carefully: a public attacker who enumerates the class pays H, so
    the attacker wants an UPPER bound on H, which is the unconditional side.
    Brauer-Siegel's lower bound h(D) >> |D|^{1/2 - epsilon} is ineffective and is
    used ONLY for the secondary "typical value" statement, never for the cap.

    STEP 3 -- THE TYPICAL VALUE, BY AN EXACT IDENTITY. The Kronecker-Hurwitz
    class number relation, for p prime,
        sum_{t in Z, t^2 <= 4p} H(4p - t^2)  =  2p
    [RECALLED as the p-prime case of sum_{d | n} max(d, n/d); COMPUTED IN THIS
    SESSION OUTSIDE THE HARNESS and reproduced EXACTLY, ratio 1.000000, at
    p = 11, 13, 101, 1009, 10007, by counting reduced binary quadratic forms
    (a,b,c), |b| <= a <= c, b >= 0 when |b| = a or a = c, with weights 1/2 at
    (a,0,a) and 1/3 at (a,a,a). Re-run in-harness before citing.] The number of
    admissible traces is 2*floor(2 sqrt p) + 1 ~ 4 sqrt(p), so
        MEAN class size  =  2p / (4 sqrt p)  =  sqrt(p) / 2   exactly in the limit,
    and SCOUT-COMPUTED mean / (sqrt(p)/2) = 0.998 at p = 10007. The median runs
    lower: SCOUT-COMPUTED log(median H)/log(sqrt p) = 0.790, 0.846, 0.870 at
    p = 10^4, 10^5, 10^6 -- increasing, consistent with a slow |D|^{o(1)}
    approach to 1 and NOT yet at 1 at toy sizes. The observed maximum sits at
    about 2.5 sqrt(p) at all three sizes, consistent with the Step-2 cap.

    STEP 4 -- THE PUBLIC ATTACK, AND WHY IT HAS NO PATH-RECOVERY STAGE. Prior
    ECTD records treat "find E_s" and "find the connecting isogeny" as two
    problems and hope both are hard. They are one problem, and doing them
    together is cheaper than either analysis suggests. The attacker starts at
    E_pub, walks the class using isogenies of small degree ell (the horizontal
    CM action plus vertical steps), and at each curve visited applies the
    endpoint-weakness test. Every curve is reached BY a chain the attacker
    constructed, so on the first weak curve found the attacker already holds the
    path and transports the DLP immediately. Cost, in group-operation-equivalents:
        C_pub  ~  H * (c_test + c_step)  <=  O(sqrt(p) log p) * (c_test + c_step)
    with O(log p) memory -- a WALK, not a table, so it is not dominated on the
    memory axis by BSGS.
    Against matched rho at sqrt(pi N / 2) ~ 1.2533 sqrt(p) and using the mean
    class size sqrt(p)/2:
        C_pub / C_rho  ~  0.399 * (c_test + c_step),
        SECURITY MARGIN  =  log2(c_test + c_step) - 1.33  BITS,   0 IN THE EXPONENT.
    FORCED VALUE, derived before any run: margin_bits(c) = log2(c) - 1.33 for
    c >> 1. A Semaev/Groebner endpoint meter of the kind EXP-ECTD-001 freezes
    plausibly costs 2^20 to 2^30 group-operation-equivalents at toy N, giving
    18.7 to 28.7 bits of margin. That is a constant-factor result. It is not
    nothing -- 28 bits is a real design margin -- but it is not, and can never
    be, an exponent.

    STEP 5 -- WHAT THE BOUND DOES NOT COVER, STATED BEFORE ANY CONCLUSION. The
    attack of Step 4 requires the attacker to be ABLE TO EVALUATE c_test. If the
    endpoint weakness is not recognizable without the trapdoor secret, the class
    walk has nothing to test and the bound does not apply. THIS IS THE REAL
    ESCAPE AND IT IS ALSO THE REDIRECTION: the ordinary-F_p trapdoor design
    problem is not "find a rare weak endpoint" -- rarity does not enter the bound
    at all, a unique weak curve and a class half of whose curves are weak give
    the same C_pub -- it is "find a weakness whose RECOGNITION cost without the
    secret exceeds its EXPLOITATION cost with the secret by more than
    log2(rho / class size) = 1.33 bits". That is an indistinguishability
    requirement, and no ECTD record states it.

    STEP 6 -- THE SAME COUNT APPLIED TO THE EXEMPLAR. Teske's construction lives
    over F_{2^161}; the class size there is h(t^2 - 4q) ~ q^{1/2} = 2^{80.5}
    against rho at ~2^{80.5}. The identical bound applies, and its margin is
    again log2(c_test). Stage 0 reads KN-LIT-7261's local PDF and records
    whether Teske's own security analysis addresses class enumeration. BOTH
    OUTCOMES ARE USEFUL: if it does, its answer is the design principle this
    campaign needs and should be lifted verbatim; if it does not, that is a
    finding about the campaign's own exemplar. NOTHING IS ASSERTED ABOUT WHAT
    TESKE SAYS IN THIS RECORD -- the PDF has NOT BEEN READ in this session.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals/IDEA-20260731-016.yaml
      - ledger/proposals/IDEA-20260731-017.yaml
      - ledger/proposals/IDEA-20260731-018.yaml
      - ledger/proposals/IDEA-20260801-004.yaml
      - ledger/hypotheses/H-ECTD-001.yaml
      - experiments/EXP-ECTD-001/specification.yaml
      - ledger/questions/RQ-ECTD-001.yaml
      - ledger/goals/GOAL-ECTD-001.yaml
      - knowledge/literature/KN-LIT-7261.md
      - knowledge/literature/KN-LIT-7630.md
      - knowledge/findings/KN-FIND-007.md
    grep_results:
      - >-
        All four prior ECTD ideas measure a PRIVATE-ADVANTAGE meter on curves.
        None costs the PUBLIC limb, and none contains a number for
        "public path search and public detection remain at least matched-rho
        hard" although the goal's completion criterion requires it.
      - >-
        No ECTD record contains the isogeny class size, the Hurwitz class number,
        the Kronecker-Hurwitz relation, or any estimate of how many curves the
        designer may choose among.
      - >-
        The ANGLE-BRIEF's item 18 (owner GOAL-ECDLP-001) asks whether h(f^2 D)
        can be driven past sqrt(p) so as to supply an algebraic structure of
        order N for a GLV-style speedup. That is a DIFFERENT question with the
        same arithmetic input: it asks about the SCALAR DOMAIN of an
        endomorphism, this asks about the DESIGNER'S HIDING BUDGET and the
        PUBLIC DETECTOR's cost. The overlap is the class-number growth law and
        it is declared here rather than hidden. This proposal makes no GLV or
        endomorphism-speedup claim of any kind.
    conclusion: >-
      Classical arithmetic, applied to a limb of this campaign that has never
      been costed. Novelty is claimed only for the application and the
      reframing, and even that is UNVERIFIED against external literature: the
      corpus-wide caveat of KN-OPEN-3f7a21 (7,809 literature entries, 95% bulk-
      seeded, backing artifacts absent) means a novelty screen here can see very
      little, and this sentence records that rather than hiding it.

  assumptions:
    - >-
      N = #E(F_p) is prime or has a prime factor of the same bit size, so that
      "matched rho" is sqrt(pi N / 2) and the group is cyclic on the relevant
      subgroup. Small-cofactor cases change constants, not the exponent.
    - >-
      The designer is restricted to F_p-rational isogenies. An F_p-bar isogeny
      that is not F_p-rational does not transport the F_p-DLP, so this is not a
      restriction on the adversary model but a property of the object.
    - >-
      c_test and c_step are expressible in group-operation-equivalents. The
      experiment measures nothing about them; they are carried as free symbols
      and only a TABLE of margins as a function of c is produced.
    - >-
      The class walk of Step 4 can visit the whole class. For the horizontal
      level this is the simple transitivity of the Cl(O) action; for a volcano
      with several levels it needs vertical steps, whose cost is folded into
      c_step. This is the weakest structural assumption in the record and
      Stage 4 is assigned to it.

  predictions:
    - metric: >-
        KRONECKER-RELATION RATIO: [ sum_{t^2 <= 4p} H(4p - t^2) ] / (2p), at
        p in {11, 101, 1009, 10007, 100003, 1000003}
      direction: different
      minimum_effect: >-
        EXACTLY 1.000000 at every tested prime, to the last bit of exact
        rational arithmetic. Forced, not fitted. Any deviation means the class
        number implementation is wrong and the run reports an INSTRUMENT FAILURE
        with no mathematical content whatsoever.
    - metric: >-
        MEAN-VALUE RATIO: mean_t H(4p - t^2) / (sqrt(p)/2)
      direction: different
      minimum_effect: >-
        Within [0.97, 1.03] for every p >= 10^4, and converging to 1 as p grows
        (the exact value is 2p / [(2*floor(2 sqrt p)+1) * sqrt(p)/2], whose
        deviation from 1 is O(p^{-1/2})). SCOUT-COMPUTED 0.998 at p = 10007.
    - metric: >-
        MEDIAN EXPONENT: log(median_t H(4p - t^2)) / log(sqrt p) at
        p in {10^3, 10^4, 10^5, 10^6, 10^7}
      direction: higher
      minimum_effect: >-
        MONOTONE INCREASING across the five sizes, and inside [0.70, 1.00] at
        every size. THE BAND IS DELIBERATELY NOT [0.90, 1.00]: the values
        SCOUT-COMPUTED at 10^4, 10^5, 10^6 are 0.790, 0.846, 0.870, so a naive
        "it should already be 1/2 in the exponent, i.e. this ratio should be 1"
        prediction would have been falsified by toy-size finite-size effects
        rather than by mathematics. A DECREASING sequence, or any value below
        0.70, falsifies the typical-value limb at tested scale.
    - metric: >-
        MAXIMUM RATIO: max_t H(4p - t^2) / sqrt(p)
      direction: different
      minimum_effect: >-
        Bounded above by (2/pi)(log 4p + 2) at every tested p, and observed
        between 1.5 and 4.0. SCOUT-COMPUTED 2.64, 2.16, 2.63 at p = 10^4, 10^5,
        10^6. A value above the analytic cap means the cap constant recalled in
        Step 2 is wrong and must be re-derived before it is used.
    - metric: >-
        NON-GENERICITY OF ENUMERABLE CLASSES: f(h0, p) = weighted fraction of
        ordinary curves over F_p lying in a class of size <= h0, for
        h0 in {8, 64, 256, 1024} and p in {10^4, 10^5, 10^6, 10^7}
      direction: lower
      minimum_effect: >-
        Strictly decreasing in p at every fixed h0, with a fitted slope in
        log-log within [-2.0, -1.0] (the counting heuristic gives f ~ h0^3
        p^{-3/2}). SCOUT-COMPUTED f(64, p) = 0.500, 0.0399, 0.00104 at
        p = 10^4, 10^5, 10^6 -- successive ratios 0.080 and 0.026, bracketing
        the predicted 10^{-1.5} = 0.0316. Extrapolated to the campaign's own
        N ~ 2^40, f(64) ~ 1e-12. IF f DOES NOT DECREASE, the feasibility gate of
        Step 4's consequence (2) is void and BATCH-003 may proceed as written.
    - metric: >-
        SUPERSINGULAR NEARBY-OBJECT EXPONENT: log(#supersingular j-invariants
        over F_{p^2}) / log(p)
      direction: higher
      minimum_effect: >-
        1.00 +/- 0.02 at every tested p (the count is floor(p/12) + eps with
        eps in {0,1,2} by p mod 12 -- RECALLED, and re-derived by direct
        supersingular-polynomial computation at toy p in the run). THIS IS THE
        POSITIVE CONTROL AND IT MUST MOVE. If the instrument reports 1/2 here it
        cannot distinguish hiding budgets at all and NO NEGATIVE MAY BE REPORTED
        from any other arm.
    - metric: >-
        SECURITY-MARGIN TABLE: margin_bits(c) = log2(0.399 * c) over
        c in {1, 2, 2^8, 2^16, 2^20, 2^24, 2^30} group-operation-equivalents
      direction: different
      minimum_effect: >-
        A pure arithmetic table, no compute, no fitted parameter. Forced values:
        -1.33, -0.33, 6.67, 14.67, 18.67, 22.67, 28.67 bits. Reported as the
        complete quantitative answer to GOAL-ECTD-001's public-limb completion
        criterion at the mean class size, together with the same table at the
        observed maximum class size (add log2(2.5/0.5) = 2.32 bits).

  minimal_test:
    design: >-
      Five stages, cheapest first; stages 0 and 1 can each terminate the line.
      STAGE 0 (reading, zero compute): open the local Teske PDF recorded at
      inputs/ECTD-TESKE-20260731/sources/ and KN-LIT-7630's local copy, and
      record VERBATIM whether either addresses exhaustive isogeny-class search as
      an attack. Nothing about their contents is asserted before this stage runs.
      STAGE 1 (pen and paper, zero compute): write out Steps 1-4 in full, have an
      independent reviewer attack them, and in particular attack the claim that
      the class walk needs no separate path stage.
      STAGE 2 (pure Python, minutes): compute H(4p - t^2) for all admissible t at
      p in {10^3, 10^4, 10^5, 10^6, 10^7} by exact reduced-form counting; emit the
      Kronecker ratio, the mean ratio, the median exponent, the max ratio, and
      f(h0, p).
      STAGE 3 (pure Python, minutes): the supersingular F_{p^2} positive control
      and the composite-modulus null.
      STAGE 4 (arithmetic, zero compute): the margin table, plus the BATCH-003
      feasibility statement -- for each (N bit size in {40, 48, 56}) report the
      expected class size and the implied number of per-curve meter evaluations,
      against the campaign's remaining wall-clock budget.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, CAN ACTUALLY FAIL -- THE COMPOSITE MODULUS.
        Run the identical summation sum_{t^2 <= 4n} H(4n - t^2) at composite
        n in {12, 100, 1000, 10008}. FORCED VALUE DERIVED BEFORE THE RUN: the
        relation for general n > 0 is sum_{d | n} max(d, n/d), which equals 2n
        only when n is prime. At n = 12 the forced value is
        12 + 6 + 4 + 4 + 6 + 12 = 44, NOT 24. So this null MUST return a
        different number from the treatment; if the code returns 2n at a
        composite modulus the summation is not measuring what it claims and the
        whole table is void. [The general-n form is RECALLED-UNVERIFIED; the
        run computes both sides and reports the comparison rather than assuming
        either.]
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE CONCLUSION FAILS -- THE
        SUPERSINGULAR CLASS OVER F_{p^2}. The whole point of the bound is that
        the ordinary F_p hiding budget is p^{1/2}. The closest object where the
        hoped-for conclusion (a large hiding budget) HOLDS is the supersingular
        graph over F_{p^2}, of size ~p/12: exponent 1, not 1/2. THE INSTRUMENT
        MUST REPORT 1.00 +/- 0.02 THERE. If it does not, the measurement cannot
        tell a p^{1/2} hiding budget from a p^1 one and no negative from any
        other arm may be reported. This control is free: the supersingular count
        is a one-line formula cross-checked against direct enumeration at toy p.
      - >-
        GRADED CONTROL, 5 INTERIOR POINTS, MONOTONICITY REPORTED -- p across
        {10^3, 10^4, 10^5, 10^6, 10^7}, reporting the median exponent and
        f(64, p) at each. A median exponent that fails to increase, or an f that
        fails to decrease, localises the obstruction to a specific size regime
        instead of leaving "the counting did not work". This is the arm that
        would catch a finite-size artifact masquerading as an asymptotic law,
        and it already caught one in the writing of this record (see the
        MEDIAN EXPONENT prediction band).
      - >-
        ORDERING CONTROL. The composite-modulus null and the supersingular
        control are computed, hashed and committed BEFORE the ordinary treatment
        table is read, and the decision rule is executed on them first. If the
        rule emits the same verdict on the null as on the treatment it
        discriminates nothing and must be rewritten before the treatment arm is
        looked at.
      - >-
        ARCHIVE CHECK (zero compute). List every prior measurement in this
        corpus of the same observable (isogeny class size / Hurwitz class number).
        NOT AVAILABLE -- grep over ledger/ and knowledge/ returned none, and this
        unavailability is recorded here rather than reported as a passed check.
    required_metrics:
      - Kronecker ratio per prime, in exact rational arithmetic
      - mean ratio, median exponent, max ratio per prime
      - f(h0, p) table over the 4 x 5 grid
      - composite-modulus null values against sum_{d|n} max(d, n/d)
      - supersingular exponent, both by formula and by direct enumeration
      - the margin table and the BATCH-003 feasibility statement
      - verbatim record of what the Teske and Galbraith PDFs do or do not say about class enumeration

  falsification_conditions:
    - >-
      THE PRIMARY FALSIFIER, ZERO COMPUTE: a construction is exhibited in which
      the endpoint weakness cannot be evaluated without the trapdoor secret. The
      class-walk attack then has nothing to test, C_pub is not bounded by
      H*(c_test + c_step), and the whole barrier limb is void. This is not a
      remote possibility; it is where the interesting designs would live, and it
      is stated FIRST so that the record cannot later be read as a closure it is
      not.
    - >-
      The Kronecker ratio is not exactly 1 at a tested prime. Instrument failure;
      the run is reported as such and NOTHING mathematical is concluded
      (AGENTS.md rule 5).
    - >-
      The median exponent decreases with p, or leaves [0.70, 1.00]. The
      typical-value limb is falsified at tested scale. NOTE: the UNCONDITIONAL
      cap of Step 2 would survive this, so the barrier would weaken to
      "O(sqrt p log p), typical value unknown at tested sizes" rather than
      collapse.
    - >-
      f(64, p) does not decrease in p. The BATCH-003 feasibility gate is void
      and the queued full-class screen may proceed exactly as frozen.
    - >-
      The supersingular positive control returns an exponent near 1/2. THE
      INSTRUMENT IS BROKEN AND NO NEGATIVE MAY BE REPORTED FROM ANY ARM.
    - >-
      An independent reviewer shows that a class walk cannot in fact enumerate a
      multi-level volcano within the stated c_step, e.g. because descending
      requires knowledge the walker does not have. The bound then applies to the
      horizontal level only, H is replaced by h(O) rather than H(4p - t^2), and
      the exponent is unchanged but the constant improves for the designer. This
      is a REFINEMENT the record invites rather than a refutation it fears.

  confounders:
    - >-
      WEIGHTING CONVENTION. "Class size" can mean F_p-isomorphism classes,
      1/|Aut|-weighted classes, or curves-with-a-marked-point. They differ by
      factors of 2, 4, 6 at j = 0 and j = 1728. All three are computed and
      reported; the margin table is stated for each. A factor of 6 is 2.6 bits
      and this record refuses to hide it.
    - >-
      TWISTS. E and its quadratic twist have traces t and -t, hence the same
      |D_pi| and the same class number. Whether the designer may use the twist
      doubles or does not double the hiding budget by exactly 1 bit. Reported,
      not absorbed.
    - >-
      c_test IS NOT MEASURED HERE AND MUST NOT BE INVENTED. The margin is a
      FUNCTION of c, presented as a table. The illustrative range 2^20-2^30 for a
      Groebner-class meter is a PLAUSIBILITY BRACKET, not a measurement, and any
      downstream citation that drops the word "illustrative" misrepresents this
      record.
    - >-
      AUTHORSHIP ASYMMETRY. A barrier argument is cheap to produce and reads as
      rigour. The design carries a positive control that can void it, a primary
      falsifier stated before any conclusion, and a redirection that keeps the
      lane open -- precisely so a negative costs something to reach.
    - >-
      INEFFECTIVITY. Brauer-Siegel's lower bound is ineffective. It is used only
      for the typical-value statement and never for the cap. A reader who takes
      the typical value as a guarantee has strengthened this record beyond what
      it says.

  interpretation_limits:
    - >-
      THIS IS NOT AN IMPOSSIBILITY RESULT AND MAY NOT BE CITED AS ONE. It bounds
      the security margin of ordinary-F_p secret-isogeny trapdoors AGAINST ONE
      NAMED ATTACK (class walk with a per-curve recognizable weakness test), by
      a constant factor, with the exponent unchanged at 1/2 on both sides. It
      says nothing about trapdoors whose weakness is not recognizable without
      the secret, nothing about trapdoor-DDH (IDEA-20260731-018's lane), and
      nothing about supersingular or extension-field constructions.
    - >-
      Forward guidance, mandatory under inventor-protocol section 4: what remains
      open is (i) endpoint weaknesses with a recognition/exploitation cost
      asymmetry, which is the reframed design target; (ii) whether c_step for a
      full volcano traversal is genuinely poly(log p) or hides a class-group
      computation; (iii) the trapdoor-DDH lane, where the private object is a
      predicate rather than a solve and the class walk may not apply; (iv) the
      genus and base-field escapes catalogued in IDEA-20260805-51996a.
    - >-
      NO STATUS CHANGE to EXP-ECTD-001, H-ECTD-001, or GOAL-ECTD-001 is proposed
      or implied. The BATCH-003 feasibility statement is INFORMATION FOR THE
      COORDINATOR, who alone may re-register a frozen contract (AGENTS.md rule 1).
    - >-
      Toy-tier. The class-number computations run at p <= 10^7; the campaign's
      own N is 2^40-2^56. The IDENTITIES are size-independent algebra, so the toy
      computation CHECKS a derivation rather than extrapolating a measurement --
      but the f(h0, p) extrapolation to 2^40 IS an extrapolation and is labelled
      one.

  heuristic_assumptions:
    - id: HEUR-ECTD-MASS-1
      statement: >-
        NONE LOAD-BEARING FOR THE CAP. The Step-2 bound H = O(sqrt(p) log p) is
        unconditional: it needs the class number formula and the elementary
        L(1,chi) = O(log|D|) bound, neither of which is a heuristic and neither
        of which needs GRH. This entry exists to record that the record's
        headline is UNCONDITIONAL where its predecessors in this question were
        heuristic-conditional (HEUR-ECTD-TAIL-1, HEUR-ECTD-VERT-1,
        HEUR-ECTD-DDH-1 are all explicitly unsupported by any theorem).
      rigorous_support: >-
        h(D) = sqrt|D| L(1, chi_D)/pi (Dirichlet); L(1, chi_D) = O(log|D|) by
        partial summation against the Polya-Vinogradov character sum bound.
        Both classical, both RECALLED, both re-checked numerically in Stage 2
        against the computed maximum rather than trusted.
      validation_plan: >-
        Stage 2 reports max_t H / sqrt(p) against (2/pi)(log 4p + 2) at five
        primes. If the observed maximum ever exceeds the analytic cap, the
        recalled constant is wrong and is re-derived before use.
    - id: HEUR-ECTD-MASS-2
      statement: >-
        FOR ALL p prime and FOR ALL admissible traces t, a public attacker can
        traverse the entire F_p-isogeny class of E_pub in H steps, each of cost
        c_step = poly(log p), retaining the connecting chain.
      rigorous_support: >-
        On a single volcano level this is the simple transitivity of the Cl(O)
        action and needs only that enough small split primes exist, which is a
        Chebotarev statement. ACROSS LEVELS IT IS NOT PROVED HERE and is the
        weakest link in the record: descending and ascending require identifying
        the level, i.e. partial endomorphism-ring information, whose cost is
        RECALLED-UNVERIFIED as subexponential L_p(1/2) and is NOT asserted.
      validation_plan: >-
        Stage 1 assigns an independent reviewer to attack it. Stage 4 reports the
        margin table under BOTH readings: H = H(4p - t^2) (all levels reachable)
        and H = h(O_max) (horizontal only). The two differ by the conductor
        factor and the CONCLUSION -- zero exponent margin -- is identical under
        both, which is why the record's headline does not depend on this
        heuristic.

  target_complexity:
    time_exponent: >-
      This proposal MOVES NO EXPONENT and says so plainly. What it does is BOUND
      one: it shows the public-attack exponent against any ordinary-F_p
      secret-isogeny trapdoor with a publicly recognizable endpoint weakness is
      at most 1/2 + o(1), which is exactly matched rho, so the trapdoor's
      security exponent can never EXCEED rho's. The deliverable is the constant:
      log2(c_test + c_step) - 1.33 bits.
    memory_exponent: >-
      O(log p) for the class-walk attack (a walk, not a table). This matters and
      is stated because the obvious alternative, BSGS at sqrt(N) memory, IS
      dominated on the memory axis -- the class walk is not.
    best_known: >-
      Pollard rho at sqrt(pi N / 2) ~ 1.2533 sqrt(N) time, O(log N) memory, no
      data/query cost. No subexponential prime-field ECDLP algorithm is known.
    hidden_overhead: >-
      c_test and c_step, both carried as free symbols; the |D|^{o(1)} in the
      typical-value statement; the 1/|Aut| weighting convention (up to 2.6 bits);
      the twist factor (1 bit).
    tradeoff_note: >-
      The class walk is a genuine Pareto point against BSGS: same 1/2 exponent,
      O(log p) memory instead of sqrt(N), at the price of the c_test factor.

  dominated_by: >-
    n/a (no attack and no improvement is claimed; this is a bound and an audit).
    ROWS CHECKED before writing that, across time, memory, and data/queries:
    Pollard rho (time 1.2533 sqrt N, memory O(log N), queries 0);
    BSGS (time sqrt N, memory sqrt N, queries 0);
    Pollard kangaroo on an interval (time ~2 sqrt(w), memory O(log N));
    van Oorschot-Wiener parallel rho (time 1.2533 sqrt(N)/M, memory per unit);
    Gaudry/Semaev prime-field index calculus (no subexponential prime-field
    result exists in this corpus or in the scout sweep);
    KN-LIT-7630 Galbraith isogeny construction (exponential worst case,
    conductor gap the named obstruction);
    ordinary endomorphism-ring computation at subexponential L_p(1/2)
    (RECALLED-UNVERIFIED, not used anywhere in the argument);
    MOV/Frey-Ruck and anomalous transfer (excluded by RQ-ECTD-001's own scope as
    class invariants). Absence of a dominating row in this corpus is not evidence
    that none exists (AGENTS.md retrieval policy), and the corpus-wide
    KN-OPEN-3f7a21 caveat applies with full force.
  sota_delta: >-
    Quantitative. The public limb of GOAL-ECTD-001's completion criterion
    currently has NO number anywhere in the campaign: it says "at least matched-
    rho hard" and stops. This supplies one -- the margin is
    log2(c_test + c_step) - 1.33 bits at the mean class size and
    log2(c_test + c_step) - 3.65 bits at the observed maximum class size
    (2.5 sqrt p), and 0 in the exponent. Illustrated over the plausibility
    bracket c = 2^20 to 2^30, that is 18.7 to 28.7 bits. Against the incumbent
    frontier (Pollard rho) the delta is ZERO on every attack axis: no attack is
    proposed, no exponent moves, and the contribution is a bound plus a
    redirection of the design target from rarity to recognition-cost asymmetry.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.72. It is not higher because two links are genuinely soft: the class-walk
    attack across volcano LEVELS (HEUR-ECTD-MASS-2) is not proved here, and the
    entire barrier evaporates for a weakness that is not recognizable without
    the secret -- which an adversarial reviewer will and should press, and which
    is the single most likely route by which this record gets narrowed. It is not
    lower because the load-bearing pieces are exact counting rather than
    modelling: the Kronecker identity reproduced to ratio 1.000000 at five primes
    in this session, the mean-value consequence is arithmetic, and the Step-2 cap
    is unconditional and does not depend on either soft link. Separately, 0.92
    that the run reaches a decisive reading at all, because Stage 1 is
    pen-and-paper and Stage 2 is minutes of pure Python in an environment
    verified to have numpy 2.4.6 and no Sage, sympy, PARI or gmpy2.
