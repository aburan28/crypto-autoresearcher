idea:
  id: IDEA-20260828-4d7330
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-28'
  title: >-
    Ripple carries run low-bit to high-bit only: audit HEUR-H1's aggregate
    uniformity claim across the active MITM lineage's matching-window
    observable for a bit-position entropy gradient
  class: measurement
  claim: >-
    (A) H-MDFIVE-bf7767's HEUR-H1, H-MDFIVE-0ca596's HEUR-H1, and
    IDEA-20260828-69bde4's H1 each state a single AGGREGATE distributional
    claim -- the m-bit matching-window value of a declared boundary register
    behaves as uniformly random / pairwise-independent as the free word
    ranges over its window -- tested ONLY by a chi-square (or distinct-value
    count) over the WHOLE window jointly. None of these three records, nor
    IDEA-20260828-12ce12/400967, examine whether uniformity is uniform ACROSS
    BIT POSITIONS within that window.
    (B) In ripple-carry addition mod 2^32 (RFC 1321's arithmetic, underlying
    every ADD this lineage's matching-window observable is computed through),
    bit i of a+b is a deterministic function of bits 0..i of a and b ONLY --
    carries propagate strictly low-order to high-order, never the reverse; an
    exact, definitional fact of binary addition, not a heuristic.
    Consequently, since this lineage's own experimental design already holds
    a free word's HIGH bits fixed and varies only its LOW k bits (H-MDFIVE-
    bf7767's test_boundary: "bottom 10 bits discarded and replaced
    per-candidate by the search"), the LOWEST-order bits of a boundary
    register, immediately after the free word first enters an addition and
    before any rotation redistributes bit positions, depend on strictly fewer
    of the word's free bits and accumulated carry-mixing events than the
    HIGHER-order bits of the same m-bit window. This yields a concrete,
    falsifiable prediction: the per-bit marginal bias |Pr[bit=1]-0.5| of the
    matching-window observable, measured bit-by-bit rather than pooled, shows
    a GRADIENT correlated with distance from the free word's low-order entry
    point (tracked through the known, exact rotation amounts) -- a shape an
    aggregate joint test can mask if the two tails happen to average out.
    (C) Two-outcome discriminator: EITHER the per-bit profile is flat within
    noise (strengthening confidence that HEUR-H1 holds not just in aggregate
    but uniformly by bit position), OR a real gradient is found that the
    pooled chi-square could not see -- requiring every future HEUR-H1-style
    aggregate test in this lineage to add a per-bit marginal check before
    being trusted.
    (D) EXPLICITLY NOT CLAIMED: that a gradient, if found, changes any
    already-recorded hypothesis status (H-MDFIVE-bf7767 is already `weakened`
    for an unrelated, already-proven reason; this record neither reinterprets
    nor edits it -- status changes are the Coordinator's authority alone);
    this is a refinement to the VALIDATION PROTOCOL, not a re-litigation of
    any verdict; no claim about attack cost or full-primitive preimage
    resistance; no pre-committed exact curve shape beyond the qualitative
    "closer to entry, more biased" prediction, itself reported as observed.
  mechanism: >-
    STAGE 1 reuses, VERBATIM, the already-built and already-validated toy
    harness (harness/run_md4_ceiling.py's forward_step / observable
    functions) from H-MDFIVE-bf7767/0ca596 -- no reimplementation, avoiding a
    second uncross-checked instrument. STAGE 2 computes, for each of the m
    bit positions individually, the empirical marginal Pr[bit_j=1] across the
    SAME N>=200 independently drawn targets already specified in
    H-MDFIVE-0ca596's HEUR-H1 validation protocol (reusing its exact
    seeds/procedure rather than drawing a new sample), reporting
    |Pr[bit_j=1]-0.5| per position j=0..m-1, indexed by PRE-rotation bit
    position (mapped through the known, exact rotation amount, to avoid a
    post-rotation relabeling confound -- PO-1). STAGE 3 runs a pre-declared
    rank-correlation test between bit position and measured bias. STAGE 4
    runs the identical per-bit analysis on H-MDFIVE-0ca596's own R1-SEP10
    construction (component v6, step distance 3, the branch-coverage-maximal
    choice) -- testing whether even this lineage's "best-designed"
    construction still shows a gradient. STAGE 5 runs a positive control: the
    identical per-bit analysis on H-MDFIVE-bf7767's already-proven-degenerate
    batch-4 slice (word9's backward pass-through, ANOM-1), where the per-bit
    profile is predicted to be trivially degenerate (some bit's Pr forced to
    exactly 0 or 1) -- confirming the per-bit method detects a KNOWN
    degeneracy before its verdict on non-degenerate constructions is trusted.
  novelty_status: unverified
  citations:
    - ref: H-MDFIVE-bf7767
      provenance: internal
      claim: >-
        HEUR-H1's aggregate uniformity claim and the already-established
        ANOM-1 degeneracy, reused as this proposal's positive control.
      verified_by: "idea-generator subagent (read in full, this session)"
    - ref: H-MDFIVE-0ca596
      provenance: internal
      claim: >-
        HEUR-H1/HEUR-H1b, the R1-SEP10 construction, and the declared
        validation sampling seeds/procedure this record reuses verbatim
        rather than resampling.
      verified_by: "idea-generator subagent (read in full to line 874 of 1198, this session; per-bit falsification protocol not located in the read portion and is treated as absent, not assumed present)"
    - ref: IDEA-20260828-69bde4
      provenance: internal
      claim: >-
        69bde4's own H1 (algebraic-erasure decay with chain length);
        discriminated -- 69bde4's H1 is a binary degeneracy detector
        (constant vs non-constant), this proposal measures a continuous
        per-bit bias gradient on constructions already known non-degenerate.
      verified_by: "idea-generator subagent (read in full, this session)"
    - ref: "RFC 1321 sec 3.4, pinned in this goal"
      provenance: internal
      claim: The ADD operation definition establishing the low-to-high carry-direction fact.
      verified_by: "already pinned and validated in this goal"
    - ref: harness/run_md4_ceiling.py
      provenance: internal
      claim: The forward_step/backward_step/observable functions reused verbatim.
      verified_by: "already validated in this goal (RUN-MDFIVE-buildcheck and successors)"
  assumptions:
    - >-
      The carry-direction fact (bit i of a+b depends only on bits 0..i of
      a,b) is proved and applies BEFORE rotation redistributes bit positions;
      after rotation, "low bits" of the post-rotation register are a rotated
      view of pre-rotation positions, so this record tracks bias by ORIGINAL
      bit index through the known rotation amount, not by nominal
      post-rotation position (PO-1, named explicitly to avoid a labeling
      confound).
    - >-
      H-MDFIVE-0ca596's exact sampling seeds/procedure, as read in the
      available portion of that record, are reused unchanged; if that
      record's HEUR-H1 run has not yet executed, this proposal executes it
      once and derives both the aggregate and per-bit statistics from the
      identical raw draw, at no additional sampling cost.
  proof_search_map:
    bottleneck: "Aggregate joint statistic (existing lineage's method) versus per-bit-position statistic (this proposal's method)."
    baseline_embedding:
      parameter_slice: >-
        Identical sampling protocol, seeds, and target construction as
        H-MDFIVE-0ca596's HEUR-H1 validation.
      reproduction_check: >-
        This proposal's aggregate chi-square, recomputed from the SAME
        per-bit raw data by pooling, must reproduce 0ca596's own reported
        aggregate statistic exactly -- a frozen cross-check, not a new claim
        -- before any per-bit finding is trusted.
    observation_collision:
      observable: "Per-bit marginal probability Pr[bit_j=1]."
      distinct_preimage_search: >-
        Many distinct free-word samples can share the same aggregate
        statistic while differing at individual bit positions -- exactly
        what the aggregate test cannot see and this test is built to see.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the single joint m-bit chi-square with m independent
          per-bit binomial tests plus one pre-declared rank-correlation test
          against bit position -- a strictly finer partition of the same
          data, at no additional sampling cost.
        predicted_gain: >-
          Reveals bit-position structure invisible to the pooled statistic,
          if present; costs nothing beyond re-tabulating already-drawn
          samples.
    quantifier_order: >-
      FOR the declared construction (R1-SEP10 or the batch-4 null), FOR each
      bit position j=0..m-1, Pr[bit_j=1] is estimated from the SAME N-sample
      draw used for the existing aggregate test -- an existential-per-bit
      measurement on a fixed sample, not a universal claim across
      constructions or seeds.
    method_ceiling:
      strongest_certifiable_claim: >-
        A per-bit bias profile measured on this lineage's already-built
        harness and already-drawn (or identically reproduced) samples, at the
        declared N, with a positive control confirming the method detects
        known degeneracy.
      nearby_object_control: >-
        The ANOM-1 batch-4 slice (STAGE 5) is the required nearby object with
        a KNOWN verdict (trivially degenerate per-bit profile), directly
        analogous to H-MDFIVE-0ca596's own PO-1 detector-null-control
        discipline.
    proof_obligations:
      - claim: "The recomputed aggregate statistic exactly matches H-MDFIVE-0ca596's own reported number."
        responsibility: correctness
      - claim: "The ANOM-1 positive control shows at least one bit position with Pr in {0,1} exactly."
        responsibility: correctness
      - claim: "Bit-position tracking is by pre-rotation index, mapped through the known exact rotation amount."
        responsibility: interface
      - claim: "Any finding is reported as a validation-protocol refinement, never as a change to bf7767's or 0ca596's status (Coordinator authority only)."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "rank correlation between bit position (distance from free-word low-order entry, post-rotation-corrected) and measured |Pr[bit=1]-0.5|, on R1-SEP10's v6 construction"
      direction: different
      minimum_effect: "|rho| > 0.3 is a reportable gradient; |rho| <= 0.3 is a reportable flat profile, both pre-declared as informative"
    - metric: "ANOM-1 positive-control per-bit profile"
      direction: different
      minimum_effect: "forced -- at least one bit position with Pr in {0,1} exactly; any softer result invalidates the detector"
    - metric: "recomputed aggregate statistic versus H-MDFIVE-0ca596's own reported number"
      direction: different
      minimum_effect: "forced exact match (recomputation from identical raw data, not a new measurement)"
  minimal_test:
    design: >-
      Reuse H-MDFIVE-0ca596's already-declared N>=200-target sampling run
      (or, if not yet executed, run it once and derive both the aggregate and
      per-bit statistics from the identical raw samples, at zero additional
      sampling cost beyond what 0ca596 already budgets); compute per-bit
      marginals and the rank-correlation test on R1-SEP10's v6; repeat
      identically on the batch-4 ANOM-1 slice as positive control.
    controls:
      - "Exact reproduction of 0ca596's aggregate statistic from the same raw data (correctness check)."
      - "ANOM-1 positive control (detector-sensitivity check)."
      - "MD4 vs MD5 paired per-bit profile at the same construction, matching this lineage's established convention."
    required_metrics: ["per-bit Pr[bit=1] for j=0..m-1 on both constructions", "rank correlation and its p-value", "aggregate cross-check pass/fail", "ANOM-1 forced-degeneracy pass/fail"]
  falsification_conditions:
    - "The ANOM-1 positive control does NOT show a trivially forced bit value at any position -- invalidates the per-bit detector, STOP before any other reading."
    - "The recomputed aggregate statistic does not exactly match 0ca596's own reported number -- a data-handling defect, STOP."
    - "The rank correlation on R1-SEP10 is |rho| <= 0.3 with the ANOM-1 control passing -- a genuine, reportable finding that HEUR-H1 holds uniformly across bit positions at this scale, not a defect."
  confounders:
    - "Rotation-position relabeling -- addressed by PO-1, tracking pre-rotation bit index."
    - "Per-bit binomial tests are individually weaker than the pooled chi-square at fixed N -- addressed by reporting confidence intervals per bit and a single pre-declared rank-correlation summary, not per-bit multiple-comparison significance claims."
    - "Reusing 0ca596's exact samples means this cannot claim independent replication of that draw, only a finer read of it -- disclosed, not hidden."
  interpretation_limits:
    - >-
      A per-bit gradient, if found, is a property of the declared toy-scale
      harness and sample; it does not by itself revise any hypothesis's
      status (Coordinator authority only) and is reported as a
      validation-protocol finding, not a new verdict on bf7767 or 0ca596.
    - No claim about full-scale MD5/MD4 or attack cost.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Per-bit bias decreases with distance (post-rotation-corrected) from
        the free word's low-order entry point.
      rigorous_support: >-
        Imitates the classical "avalanche strengthens with more mixing"
        intuition underlying every HEUR-H1-style claim in this lineage, but
        is an UNPROVED extrapolation of the carry-direction fact (proved) to
        a claim about DEGREE of bias (not proved).
      validation_plan: >-
        The pre-declared rank-correlation test at N>=200 (reusing 0ca596's
        committed sample size), with the explicit caveat that a small |rho|
        could reflect either genuine flatness or insufficient power to detect
        a real but small gradient -- disclosed as an open direction for a
        larger-N replication, not resolved here.
  target_complexity:
    time_exponent: "No attack exponent is claimed. The deliverable is a per-bit bias profile and one rank-correlation statistic at toy scale, reusing already-budgeted sampling."
    memory_exponent: Negligible.
    best_known: >-
      The aggregate chi-square test already specified by HEUR-H1 across
      bf7767/0ca596/69bde4, which this proposal strictly refines (a finer
      partition of identical data) rather than replaces.
    hidden_overhead: >-
      Per-bit tests at fixed N have less statistical power per bit than the
      pooled aggregate test, so a "flat" verdict here is weaker evidence of
      true flatness than the aggregate chi-square's pass was for its own
      (weaker) claim -- disclosed explicitly.
    tradeoff_note: >-
      Not applicable -- no new compute/memory tradeoff; computes at the
      sample size already budgeted elsewhere in this goal.
