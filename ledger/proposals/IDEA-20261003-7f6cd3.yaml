# IDEA-20261003-7f6cd3
# x-only storage count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-7f6cd3
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A full affine point stores 2 field elements and an x-only state stores 1
  class: representation
  claim: >-
    A full affine point stores 2 field elements. An x-only ladder state
    stores 1. Two exceeds one by 1, and the product of the two storage
    counts is 2. The gap is a representation cost, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R1 is the stored coordinate tuple. The operation set
    is the ladder step that consumes that tuple. Dropping the y
    coordinate changes storage and does not by itself change the group
    order. This is not a point-count comparison between curve models.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base dimension is a different lever from coordinate storage.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two storage layouts are frozen before the count.
    - No scalar is recovered.
  proof_search_map:
    bottleneck: The storage gap of 1 field element.
    baseline_embedding:
      parameter_slice: The counts 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The storage gap and the product.
      distinct_preimage_search: >-
        Reporting both layouts as storing 2 elements drops the gap.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The x-only state.
        predicted_gain: One fewer stored field element. No exponent.
    quantifier_order: >-
      The layouts are fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The storage gap 1. Not a ladder runtime.
      nearby_object_control: >-
        Two full affine points. Both store 2, and the gap is 0.
    proof_obligations:
      - claim: The affine point stores 2 field elements.
        responsibility: size
      - claim: The x-only state stores 1.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: storage_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Count stored field elements in the two frozen layouts. Do not run
      a ladder.
    controls:
      - Two affine points, whose gap is 0.
      - An independent count.
    required_metrics:
      - both storage counts
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two counts is not 2.
  confounders:
    - A sign bit or a point-at-infinity flag is an extra stored bit, not a field element.
  interpretation_limits:
    - Storage is not runtime.
    - No transfer to a cryptographic ladder.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen x-only state stores the x coordinate and no y coordinate.
      rigorous_support: >-
        No ladder theorem is claimed. The count is a reading of two layouts.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: One field element versus two, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Flags and the point at infinity.
    tradeoff_note: Fewer stored elements can cost recomputation of y.
  estimated_cost:
    implementation: low
    compute: low
