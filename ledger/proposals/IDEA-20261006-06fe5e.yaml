idea:
  id: IDEA-20261006-06fe5e
  question_id: RQ-ECDLP-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Six planted S_3 zeros against six explicit values at third coordinate 7
    on y^2 = x^3 + x + 2 over F_41
  class: control
  claim: >-
    On E: y^2 = x^3 + x + 2 over F_41, the points (0, 17), (1, 2),
    (3, 14), and (5, 3) lie on E. For each of the six unordered pairs,
    the Semaev polynomial S_3 from KN-TECH-002 vanishes at
    (x(P), x(Q), x(-(P+Q))). At third coordinate 7 the six values, in
    pair order (0,1), (0,3), (0,5), (1,3), (1,5), (3,5), are 13, 33,
    35, 11, 28, and 38. A recount that returns any other value, or a
    nonzero value on a true sum, is a negative. The same pair evaluated
    twice returns the same integer.
  mechanism: >-
    The tracked object is the integer value of one explicit polynomial,
    not a discrete logarithm. The representation is the triple of
    x-coordinates. The operation set is evaluation of
    S_3(x1,x2,x3) = (x1-x2)^2 x3^2 - 2*((x1+x2)*(x1*x2+a)+2*b)*x3
    + ((x1*x2-a)^2 - 4*b*(x1+x2)) in F_41, with a=1 and b=2, together
    with the chord-and-tangent sum that names x(-(P+Q)). The polynomial
    is the condition that three points with those x-coordinates sum to
    the identity for some choice of signs. Replacing the third
    coordinate by 7 leaves the polynomial, and on these six pairs the
    value is the listed nonzero field element. The projection discards
    y. It does not shrink a search.
  assumptions:
    - The four points satisfy the curve equation over F_41, and 4*1^3 + 27*2^2 = 112 is nonzero modulo 41.
    - S_3 is the formula in KN-TECH-002, not a different normalisation.
    - -(P+Q) is the chord-and-tangent inverse of the sum, with identity at infinity.
  predictions:
    - metric: true_sum_nonzero_count
      direction: lower
      minimum_effect: >-
        The number of nonzero S_3 values on the six true sums is 0.
    - metric: fixed_seven_values
      direction: different
      minimum_effect: >-
        The six values at third coordinate 7 are exactly 13, 33, 35,
        11, 28, 38 in the stated pair order.
  minimal_test:
    design: >-
      Recompute the four point checks, the six sums, S_3 on each true
      third coordinate, and S_3 at 7. Use two arithmetic implementations.
      Record the six true values and the six values at 7.
    controls:
      - Each true sum evaluated a second time in the other implementation. Disagreement voids the cell.
      - The curve equation at each of the four points. A failure voids the cell.
      - S_3(x,x,7) is not one of the six pair rows. It is recorded and it is not a success value.
    required_metrics:
      - the six S_3 values on the true sums
      - the six S_3 values at third coordinate 7
      - whether the two implementations agree
  falsification_conditions:
    - Any true sum has S_3 nonzero.
    - Any value at third coordinate 7 differs from the listed integer.
    - A listed point fails the curve equation. That voids the claim rather than scoring a new gap.
  confounders:
    - A different normalisation of S_3 multiplies every value by a unit and can move the six integers without changing the zero set.
    - Choosing the wrong sign for -(P+Q) still has the same x-coordinate, so the x-only polynomial is insensitive to that sign. A bug that drops the inverse and uses x(P+Q) is the same x.
  interpretation_limits:
    - Vanishing of S_3 on a sum is the defining property in KR-IC-5a43e5. These six integers do not show that prime-field index calculus beats rho.
    - The test is one curve and six pairs. It does not transfer to S_4 or to a cryptographic prime.
    - KR-IC-5931ee remains the known negative for naive prime-field Semaev index calculus. This control does not contradict it.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. Each listed value is the image of an
        explicit polynomial at an explicit triple in F_41.
      rigorous_support: >-
        KN-TECH-002 states the polynomial and the vanishing rule. The
        six integers are a direct evaluation under that formula. They
        are not a smoothness probability.
      validation_plan: >-
        Re-evaluate the twelve triples in two implementations. The
        predicted comparison is exact equality with 0,0,0,0,0,0 and
        with 13, 33, 35, 11, 28, 38.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Evaluating twelve triples is O(1) field
      operations. This idea does not beat Pollard rho.
    memory_exponent: >-
      Unchanged. The worksheet stores twelve integers.
    best_known: >-
      Semaev's summation polynomial, as recorded on KR-IC-5a43e5, and
      the prime-field negative on KR-IC-5931ee. This control does not
      beat either statement.
    hidden_overhead: >-
      No o(1) term is claimed.
    tradeoff_note: >-
      There is no time-memory tradeoff. The test does not build a
      factor base and does not interpolate toward a BSGS table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
  citations:
    - ref: ledger/questions/RQ-ECDLP-001.yaml
      provenance: internal
      claim: >-
        The question asks how Semaev S_3 decomposition cost behaves at
        toy prime-field scale. This control checks the polynomial
        before any cost is charged.
      verified_by: ledger/questions/RQ-ECDLP-001.yaml
    - ref: KN-TECH-002
      provenance: internal
      claim: >-
        S_3 for y^2 = x^3 + a x + b is the displayed quadratic in x3,
        and it vanishes when three points with those x-coordinates sum
        to the identity for some signs.
      verified_by: knowledge/techniques/KN-TECH-002.md
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_m vanishes exactly on x-coordinates of points that sum to the
        identity, up to signs. Using that fact as a decomposition
        method is the index-calculus framework.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Under stated statistical assumptions, naive Semaev index
        calculus over prime fields does not beat generic algorithms.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the vanishing rule and degree 2^{m-2}. This
          idea pins twelve integers on one curve: six zeros on planted
          sums and the values 13, 33, 35, 11, 28, 38 at third
          coordinate 7. The separator is exact equality of those
          twelve integers. The exponent movement is 0.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a cost lower bound for naive prime-field Semaev
          index calculus. This idea does not estimate a cost. The
          distance to that bound is the full generic exponent 1/2,
          which this evaluation does not move.
  dominated_by: >-
    The vanishing rule is already KR-IC-5a43e5, and the prime-field
    cost ceiling is already KR-IC-5931ee. Twelve field evaluations do
    not beat rho in time, memory, or queries.
  sota_delta: >-
    The quantitative separator is twelve explicit residues in F_41,
    six of them zero and six of them the listed nonzeros. The distance
    to a sub-square-root algorithm is the full exponent 1/2, and this
    idea moves that exponent by 0.
