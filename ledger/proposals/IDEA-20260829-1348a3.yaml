idea:
  id: IDEA-20260829-1348a3
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  title: >-
    Is base rank actually free? A height-matched, censoring-controlled measurement
    of whether the rank-excess decay exponent beta depends on the family's generic
    rank r

  class: control

  claim: >-
    The entire base-rank strategy of this research question rests on an unexamined
    additivity premise: that the rank of a fibre over Q equals r plus extra(t) with
    the distribution of extra INDEPENDENT of r, so that each unit of generic rank
    is worth a factor exp(beta) of sieve volume and is otherwise free. THE CLAIM
    UNDER TEST IS THAT THIS PREMISE IS FALSE IN A SPECIFIC, MEASURABLE WAY.
    KN-FIND-91f871 establishes that a family of generic rank r needs degree d at
    least ceil((r+2)/10) and therefore has fibre height slope at least 1.2(r+2);
    higher base rank means systematically larger fibres at any fixed parameter box,
    and larger fibres have smaller excess. So beta should be an INCREASING function
    of r, and the operational claim is that the derivative of beta with respect to
    r is at least 0.15 per unit of rank, measured across at least four in-repo
    families of known generic rank at MATCHED FIBRE HEIGHT rather than matched
    parameter box. Two readings are pre-declared and both are consequential. If the
    derivative is indistinguishable from zero at matched height, base rank IS free,
    the ladder economics are confirmed, and the volume needed for rank 32 from a
    given base becomes computable for the first time in this program. If the
    derivative is at least 0.15, every unit of base rank is partly refunded, the
    value of the base-rank lane is overstated by roughly exp(0.5 * slope * r^2) at
    large r, and it would supply a mechanism for the otherwise puzzling fact that
    the world record moved by exactly +1 in the eighteen years after a rank-17 base
    became available.

  mechanism: >-
    Two facts already measured inside this program collide, and nobody has made
    them collide. FACT ONE (KN-FIND-91f871, derivation tier): a minimal Weierstrass
    model of an elliptic surface of degree d has fibre naive height
    12 d log|t| + O(1) and Shioda-Tate caps generic rank at 10d - 2, so generic
    rank r forces slope at least 1.2(r+2) -- generic rank is bought with height.
    FACT TWO (EV-ECQ-0d142e OBS-6, empirical): the Mestre-Nagao score behaves as a
    rank-EXCESS detector whose per-rank shift matches the sum of log p over p for p
    up to 1000, namely 5.6095, to within 6 percent, which is the BSD-flavoured
    signature of excess being an arithmetic property of the individual fibre. Put
    together: a higher-r family at the same parameter box has larger conductor, and
    under the standard picture in which rank excess becomes rarer as conductor
    grows, its excess distribution must be thinner. The additivity premise silently
    compares families at matched PARAMETER, which is the wrong matching variable;
    the correct one is matched fibre height or matched conductor. This design is
    therefore not a bigger sieve -- it is the SAME sieve run with the matching
    variable changed, which is the cheapest way to convert an assumption into a
    number. The projection being tested has a null with a mechanism, which is what
    separates it from a fishing expedition.

  tracked_object:
    object: >-
      The excess random variable extra(t), equal to the fibre rank minus r,
      projected onto its tail exponent beta in the law that log of the probability
      that extra is at least k behaves like minus beta times k, as a FUNCTION of
      the family's generic rank r at matched fibre height.
    lossy_projection_test: >-
      PASSES AS A PROJECTION, WITH A DECLARED WEAKNESS. It sends the entire
      arithmetic of a family -- every fibre, every point, every local datum -- to a
      pair of real numbers, beta and r. The loss is total: beta determines no curve
      and no point. It is discarded compatibly with the operation the pipeline
      performs, namely restriction to a sub-box, because extra(t) is defined
      fibre-by-fibre and its conditional distribution on a sub-box is well defined.
      HONEST WEAKNESS, DECLARED RATHER THAN GLOSSED: this is a statistical summary,
      not an algebraic invariant with deterministic one-step propagation. It does
      not propagate under any algebraic operation on the surface, and it therefore
      sits lower on the protocol's "how far does it survive" axis than an algebraic
      object would. Its claim to a slot is that it is the quantity the whole
      research question's decision target ("the sieve volume reached versus what
      would be needed") is a function of, and that quantity is currently unmeasured.
    what_the_loss_costs: >-
      beta cannot tell you WHICH fibre to certify, only how many you must certify.
      Family selection still needs the height envelope gate of KN-FIND-91f871 and
      the ordering statistic of EV-ECQ-0d142e OBS-6.

  novelty_status: unverified
  novelty_note: >-
    Internal check done and disclosed. IDEA-20260824-95d8d8 (internal, claim block
    read via grep) already proposes fitting a family-dependent beta for a FIXED
    family and predicting the k = 5 and k = 6 counts in a held-out box; that record
    is prior art and this proposal does not restate it. THE DIFFERENCE IS THE
    CROSS-FAMILY DERIVATIVE OF beta IN r AND THE MATCHING VARIABLE: 95d8d8 measures
    beta within a family in a parameter box, and this measures whether beta moves
    with r when the comparison is made at matched fibre HEIGHT, which is the
    variable KN-FIND-91f871 shows is confounded with r by construction. External
    literature was NOT checked for this question: there is a recalled body of work
    on rank distributions and conductor-dependence of rank excess that could
    already settle or reframe it, and no search for it was run this session.
    `unverified` is therefore the required label.

  citations:
    - ref: KN-FIND-91f871
      provenance: internal
      claim: >-
        For an elliptic surface of degree d over P^1, the fibre naive height is
        12 d log|t| + O(1); Shioda-Tate caps generic rank at 10d - 2, so generic
        rank r forces d at least ceil((r+2)/10) and an asymptotic height slope of
        at least 1.2(r+2). The small-parameter lever exhausts inside a bounded
        region and inside it the fibre height is set by the family's own O(1)
        constant. Worked instance: the transcribed NAGAO-1994 quartic, d = 2,
        predicted slope 24 against a measured 24.14, lower envelope
        109.5051651866501 at t = plus or minus 62 over 141221 fibres, against
        Mestre 1982's 79.329 at the same rank 12. Proof status: derivation, and
        must not be stated stronger than EV-ECQ-cbc837.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-91f871.md
    - ref: EV-ECQ-0d142e
      provenance: internal
      claim: >-
        Supplies the in-repo r = 8 family with 137 certified fibres and the full
        rank histogram of 93 at rank 8, 14 at rank 9, 17 at rank 10, 12 at rank 11
        and 1 at rank 12 -- an excess histogram already in hand. OBS-6 gives the
        dose-response: mean score by certified rank is 990.18, 995.44, 999.36 and
        1001.97 against a BSD-flavoured per-rank prediction of 5.6095, with the
        observed first step +5.26. Boundary B-2 states the largest observed excess
        is +4 while the published ladder is built from excess of order +10 to +12
        on higher surfaces. UC-3 records 60 percent censoring, its mechanism (a
        Spearman correlation of +0.765 between log of the absolute a6 and timeout),
        and that re-descending the censored fibres at a longer alarm is the
        highest-value unrun measurement of that round.
      verified_by: >-
        idea-generator session 2026-08-29; FULL record read at
        ledger/evidence/EV-ECQ-0d142e.yaml
    - ref: KN-FIND-e1b836
      provenance: internal
      claim: >-
        Supplies additional families at known generic-rank and ceiling values:
        Mestre's rank-12 quartic construction is capped at Shioda-Tate 15 on 13391
        of 13391 admissible families; only 0.688 percent reach ceiling at least 13;
        the worked instance at tuple (0, 20, 40, 45, 52, 77) with t = 23 has naive
        height 86.77369390941135 at certified rank at least 12 while the same
        family's envelope minimum is 69.28330998318052 at rank 8 -- a 17.49
        log-unit separation WITHIN one family, which is precisely the
        height-versus-rank coupling this design must control for.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-e1b836.md
    - ref: IDEA-20260824-95d8d8
      provenance: internal
      claim: >-
        PRIOR ART. Proposes extra(t) as the fibre rank minus r, with the log of the
        probability that extra is at least k approximately linear in k over
        k = 1 to 6 with a family-dependent slope beta, and the number of
        specialisations needed scaling as exp(beta*k) times a certification-cost
        factor; falsifiable by fitting beta on k = 1 to 4 and predicting k = 5 and
        k = 6 in a held-out box within a factor of 3.
      verified_by: >-
        idea-generator session 2026-08-29; TITLE, class and claim block only, read
        via repository grep. The full record was not opened, so its box, controls
        and censoring treatment are unknown to this session and any overlap beyond
        the claim text is unassessed.
    - ref: GOAL-ECQ-001
      provenance: internal
      claim: >-
        Completion criterion C2 requires "the sieve volume covered" and "NUMBERS on
        both axes", and its adjudication reports axis 2 as 97,640 specialisations
        scored at 1.028 ms each, 1,548 in the matched tier-2 box, 140 descents
        attempted, 84 timeouts, 56 completed and 1,993.0 s total. The half of the
        decision target that says "versus what would be needed" is NOT answered by
        those numbers, because answering it requires beta.
      verified_by: >-
        idea-generator session 2026-08-29; read lines 1 to 120 of
        ledger/goals/GOAL-ECQ-001/goal.yaml, covering the objective, both
        completion criteria with their adjudications, pause conditions and
        next_action. The remainder of the file was not read.
    - ref: GOAL-ECQ-2298dc
      provenance: internal
      claim: >-
        odds_assessment records the ladder timeline the mechanism must explain: 28
        (Elkies 2006), 29 (Elkies-Klagsbrun 2024), 30 (2026-08-20) and 31
        (2026-08-23), with the published record ladder standing on a rank-17
        elliptic K3 fibration so that 28 = 17 + 11 and 29 = 17 + 12. It also
        records that a constant factor on sieve yield buys well under one unit of
        rank.
      verified_by: >-
        idea-generator session 2026-08-29; FULL goal record read at
        ledger/goals/GOAL-ECQ-2298dc/goal.yaml
    - ref: >-
        The minimalist and Goldfeld-style picture that rank excess above the
        generic value becomes rarer as the conductor grows, and Watkins-style
        empirical rank distributions by conductor
      provenance: recalled
      claim: >-
        RECALLED AND USED ONLY AS THE MECHANISM'S MOTIVATION, NOT AS SUPPORT. If
        this recalled picture is wrong, the predicted SIGN of the derivative is
        wrong and the measurement is still valid -- the design tests the sign, it
        does not assume it.
      verified_by: null

  assumptions:
    - >-
      Four or more families of KNOWN generic rank are available in-repo: the pencil
      at r = 8 (proven exactly), the Mestre M10 route measured to saturate at 9,
      the Mestre quartic families at r = 11 to 12 with ceilings measured family by
      family, and a rank-0 or rank-1 twist family from the EV-ECRANK-b6c9b6 pool.
      If any family's generic rank is not certified in-repo, it is excluded rather
      than assumed.
    - >-
      Fibre naive height in the KN-FIND-91f871 convention is computable at about
      1e5 fibres per family per two seconds, so height-matched cells can be
      populated cheaply before any descent is spent.
    - >-
      A certification budget large enough to keep descent completion above 95
      percent in EVERY height cell is affordable. If it is not, the experiment does
      not run, because the confound below would dominate the effect.

  proof_search_map:
    bottleneck: >-
      The research question's decision target has two halves and only one is
      answered. "The sieve volume reached" is measured (97,640 scored, 1,548
      matched, 140 attempted, 56 completed). "Versus what would be needed" is not,
      and cannot be, without beta. The bottleneck is the missing exponent in
      V(R) = exp(beta*(R - r)), and the deeper bottleneck is that nobody has
      checked whether beta is a constant across the very lever (raising r) the
      whole programme is built on.
    baseline_embedding:
      parameter_slice: >-
        The single-family case r = 8 with matching by parameter box, which is
        exactly IDEA-20260824-95d8d8's design and exactly what BATCH-7e06d3 already
        ran. Restricting this design to one family and to parameter-matching must
        reproduce EV-ECQ-0d142e's published histogram -- 93 at rank 8, 14 at rank
        9, 17 at rank 10, 12 at rank 11 and 1 at rank 12 -- on the same 137 fibres.
      reproduction_check: >-
        Frozen fixture: recompute that histogram from certified_curves.json (sha256
        a342ff9c...d15aee) and require exact agreement before any new descent runs.
        A pipeline that cannot reproduce the committed histogram may not produce a
        new one.
    observation_collision:
      observable: >-
        The fitted pair of generic rank and beta, per family.
      distinct_preimage_search: >-
        COLLISION FOUND, AND IT IS THE EXPERIMENT'S CENTRAL DANGER. Two mechanisms
        produce the SAME observed increase of beta with r: (a) the real effect,
        larger conductor thins the excess; and (b) the censoring artefact, larger
        fibres time out more, timeouts are recorded as the section floor, and the
        floor is exactly extra = 0. Since higher r forces larger height, (b)
        manufactures (a). SEPARATION CONDITION, MANDATORY: the alarm is set per
        cell so that descent completion exceeds 95 percent in EVERY cell, the
        completion rate is published per cell, and the analysis is repeated on
        completed-descent denominators only, following EV-ECQ-0d142e boundary B-5.
        If completion cannot be brought above 95 percent in some cell, that cell is
        reported as censored and excluded from the fit, and the exclusion is
        published.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure V(R) = exp(beta(r)*(R - r)) times the certification
          cost, realised by matched height cells, with charges added only over
          cells proved disjoint by height binning.
        predicted_gain: >-
          Converts "what would be needed" from a rhetorical phrase into a number
          with a confidence interval, for the first time in this research question.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the triple of generic rank, height cell and completion rate rather
          than the rank alone, because the weaker summary (rank alone) is exactly
          what makes the additivity premise look true.
        predicted_gain: >-
          Separates the two colliding mechanisms above; the weaker invariant cannot.
    quantifier_order: >-
      FOR ALL families F in the declared in-repo set, FOR ALL height cells H in the
      declared common height range, THERE EXISTS beta depending on F and H such
      that the log of the probability that extra is at least k, conditional on F
      and H, equals minus beta times k plus a constant, for k = 1 to k_max(F). The
      claim under test is then a statement about the FUNCTION beta of F and H: that
      its partial derivative in r at fixed H is bounded away from zero. Note the
      order: the common height range must be nonempty for all families
      simultaneously, which KN-FIND-91f871's slope law makes a real constraint --
      high-r families cannot reach low heights at all. Cells outside the common
      range are excluded and the exclusion is published, because a fit over
      non-overlapping supports is not a comparison.
    method_ceiling:
      strongest_certifiable_claim: >-
        A fitted derivative of beta in r with a confidence interval, over four to
        five in-repo families, in a common height window, at a declared completion
        rate, with k at most 4. It cannot certify the shape of the tail beyond the
        measured k, cannot extrapolate to the excess of +20 that rank 32 from base
        12 would need, and cannot say anything about families this program does not
        own.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion should FAIL: two families
        of the SAME generic rank but very different height envelopes -- Mestre 1982
        at envelope 79.329 and the NAGAO-1994 quartic at 109.505, both at rank 12,
        both already measured in KN-FIND-91f871. If beta differs between THOSE two
        as much as it differs across r, then beta tracks the envelope constant and
        not the rank, and the whole framing is misattributed.
    proof_obligations:
      - claim: The committed 137-fibre histogram is reproduced exactly before new data is generated.
        responsibility: baseline
      - claim: Descent completion exceeds 95 percent in every retained cell.
        responsibility: correctness
      - claim: The common height window is nonempty across all compared families.
        responsibility: scope
      - claim: The derivative in rank is separated from the derivative in the envelope constant.
        responsibility: strictness
      - claim: The compute fits the declared budget at the alarm needed for 95 percent completion.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        derivative of beta with respect to generic rank, fitted across at least
        four in-repo families of certified generic rank in a common height window,
        on completed-descent denominators
      direction: different
      minimum_effect: >-
        the test is two-sided against the null hypothesis that the derivative is
        zero. Declared detectable effect: absolute value at least 0.15 per unit
        rank at p below 0.05 with the declared sample. A confidence interval
        containing 0 and excluding 0.15 is the "base rank is free" reading and is
        equally reportable.
    - metric: >-
        mean extra at MATCHED fibre height, r = 8 family versus the r = 11 and
        r = 12 families
      direction: different
      minimum_effect: >-
        a difference of at least 0.5 rank units, in either direction, with the
        completion rate published per cell
    - metric: >-
        the same comparison at matched PARAMETER BOX rather than matched height
      direction: different
      minimum_effect: >-
        reported alongside, precisely so the two matchings can be contrasted. The
        prediction is that parameter-matching shows a LARGER apparent advantage for
        high-r families than height-matching does, and the size of that gap is the
        measurement of how much the additivity premise has been overcounting.
    - metric: >-
        envelope control -- beta for Mestre 1982 at envelope 79.329 versus the
        NAGAO-1994 quartic at envelope 109.505, both at rank 12
      direction: different
      minimum_effect: >-
        if the absolute difference between those two betas is at least three times
        the fitted derivative in rank, the effect is attributed to the envelope
        constant and NOT to rank, and the headline framing is withdrawn
    - metric: >-
        derived deliverable -- predicted number of certified specialisations needed
        for an excess of at least 20 from a base of 12
      direction: different
      minimum_effect: >-
        reported as a number with a confidence interval and with the extrapolation
        from k at most 4 to k = 20 flagged in the same sentence. This is the half
        of RQ-ECQ-80f23c's decision target that has never been answered.

  minimal_test:
    design: >-
      STAGE 0 (reproduction gate, about 30 min). Recompute the committed 137-fibre
      rank histogram from certified_curves.json and require exact agreement.
      STAGE 1 (height cells, about 1 CPU-hour). For each of the declared families,
      measure the minimal-model naive height over 1e5 fibres in the KN-FIND-91f871
      convention, and construct the COMMON height window plus at least three
      disjoint cells inside it. Publish the window, the cells, and any family
      excluded for non-overlap.
      STAGE 2 (alarm calibration, about 2 CPU-hours). In each cell, run a pilot of
      20 descents to find the alarm that gives completion above 95 percent. If no
      affordable alarm does, mark the cell censored and exclude it -- BEFORE any
      outcome is seen.
      STAGE 3 (staged main run, about 10 to 30 CPU-hours). Certify at least 150
      fibres per family per retained cell at the calibrated alarm, in two stages
      with a pre-declared interim look, and fit beta per family and cell on
      completed-descent denominators.
      STAGE 4 (controls and fit, about 2 CPU-hours). Run the envelope control at
      fixed rank 12, the rank-0 or rank-1 null, and the parameter-matched arm; fit
      the derivative in rank; report the derived volume figure with its
      extrapolation flagged.
    controls:
      - >-
        REPRODUCTION CONTROL: the committed 137-fibre histogram must come back
        exactly. If it does not, nothing else runs.
      - >-
        CENSORING CONTROL, THE LOAD-BEARING ONE: per-cell completion above 95
        percent, per-cell completion rates published, all fits on
        completed-descent denominators, and any cell that cannot reach 95 percent
        excluded before outcomes are seen.
      - >-
        ENVELOPE CONTROL AT FIXED RANK: Mestre 1982 versus NAGAO-1994 at rank 12,
        which separates "beta tracks rank" from "beta tracks the O(1) height
        constant".
      - >-
        NULL FAMILY: a rank-0 or rank-1 twist family, where extra is the whole rank
        and beta should be largest. Its beta anchors the low-r end of the fit and a
        wildly out-of-line value indicates the fit is not comparing like with like.
      - >-
        MATCHING CONTRAST: the identical analysis with parameter-box matching, run
        as a deliberate reproduction of the WRONG matching so the size of the
        matching artefact is measured rather than argued.
      - >-
        BLIND ORDER: cells are certified in a pre-declared randomised order so that
        budget exhaustion cannot preferentially censor one family.
    required_metrics:
      - per-family certified generic rank with its in-repo provenance
      - per-family measured height envelope over 1e5 fibres
      - the common height window, the cell boundaries, and every exclusion with its reason
      - per-cell descent completion rate, alarm, and coefficient-size distribution
      - per-family-and-cell excess histogram on completed denominators, and fitted beta with CI
      - fitted derivative in rank with CI, under both matchings, and the envelope-control contrast
      - derived volume figure with its extrapolation range flagged
      - wall clock and peak RSS per stage

  falsification_conditions:
    - >-
      If the committed 137-fibre histogram is not reproduced exactly, the pipeline
      is not measuring what the predecessor measured and no number may be reported.
    - >-
      If the common height window across the compared families is empty, the
      comparison is impossible as designed and the correct report is that the
      height-slope law makes height-matching infeasible for these families --
      itself a strong result, since it would mean high-r and low-r families can
      NEVER be compared at matched height and the additivity premise is untestable
      this way.
    - >-
      If per-cell completion cannot exceed 95 percent at any affordable alarm, the
      censoring confound dominates the effect and the experiment must not be run to
      a conclusion.
    - >-
      If the envelope control shows an absolute beta difference at rank 12 at least
      three times the fitted derivative in rank, the effect is attributed to the
      envelope and the rank framing is withdrawn.
    - >-
      If the fitted confidence interval for the derivative contains 0 and excludes
      0.15, the pre-declared "base rank is free" reading is recorded as the result,
      with its own consequence: the base-rank lane is confirmed and the volume
      function becomes computable.

  confounders:
    - >-
      CENSORING IS THE CONFOUND THAT CAN MANUFACTURE THE ENTIRE RESULT, and its
      direction is exactly the direction of the hypothesis: higher r forces larger
      height forces more timeouts forces more fibres recorded at the floor forces
      smaller apparent excess forces larger apparent beta. This is why the 95
      percent completion rule is a gate and not a nicety. EV-ECQ-0d142e measured a
      Spearman correlation of +0.765 between log of the absolute a6 and timeout, so
      the mechanism is not hypothetical.
    - >-
      GENERIC RANK PROVENANCE. Some in-repo family ranks are lower bounds at
      derivation tier (GOAL-ECQ-002 C2 records rank at least 11 for Mestre's family
      as UNREPLICATED, with no exhibited-point certificate). Using a lower bound as
      r biases extra upward for that family. Controlled by recording each family's
      rank provenance and by re-fitting with the affected families dropped.
    - >-
      THE O(1) ENVELOPE CONSTANT is confounded with r across families and is the
      alternative explanation for any effect; the fixed-rank envelope control
      exists solely to break it.
    - >-
      SMALL k. beta is fitted over k = 1 to 4 at best, since the largest excess
      ever observed in this program is +4. Any statement about k = 20 is an
      extrapolation of a factor of five in the exponent and must be labelled as
      such in the same sentence, every time.
    - >-
      TORSION AND ISOGENY STRUCTURE differ between families and affect excess
      independently of r. Recorded per family and reported; not controlled for in
      this design, and that limitation is stated.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE AND CERTIFIES NO RANK. It cannot advance
      GOAL-ECQ-e72c0b's completion criteria by a single point, and rank at least 31
      over Q remains a live record held by others.
    - >-
      Scoped to the in-repo families, their certified generic ranks, the common
      height window actually achieved, the alarms actually used, and k at most 4.
      It says nothing about the record fibration, about families this program does
      not own, or about excess beyond the measured k.
    - >-
      A "base rank is free" result would CONFIRM an existing strategy, not discover
      one, and must be reported at that strength. A "base rank is not free" result
      would REPRICE a lane, not close it -- premature closure is a failure mode
      symmetric with overclaiming.
    - >-
      The derived "volume needed for rank 32" figure is a projection from a fitted
      exponent, not a plan, and no batch may be authorised on the strength of it
      alone.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (LOG-LINEAR EXCESS TAIL.) For each family F of certified generic rank r and
        each height cell H in the common window, the log of the probability that
        extra is at least k, conditional on F and H, equals minus beta times k plus
        a constant, for k = 1 to 4, with beta positive, depending on F and H and
        not on k in that range.
      rigorous_support: >-
        RIGOROUS PART: none is claimed for the functional form; what is rigorous is
        that every extra counted is an unconditional lower bound from points
        exhibited on the exact specialised curve, and that where ellrank returns an
        upper bound equal to the count, extra is exact. DISTRIBUTION IMITATED: the
        standard geometric shape of rank-excess frequencies in the empirical
        rank-distribution literature, and the exponential form is exactly what
        IDEA-20260824-95d8d8 independently proposes for the single-family case.
      validation_plan: >-
        Sample: at least 150 certified fibres per family and cell, across at least
        4 families and at least 3 common cells, giving roughly 1800 certified
        fibres. Shortcut making this feasible: the r = 8 family already has 137
        certified fibres committed under a content hash, and the Mestre pool has
        34,740 scanned curves with 1,206 in a certified pool, so two of the arms
        are largely pre-paid. Compare: the empirical log-probability curve against
        the fitted straight line, per cell, with the fit reported alongside its
        residuals rather than only its slope. Tail check: fit on k = 1 to 3 and
        predict the count at k = 4 in the SAME cell, requiring agreement within a
        factor of 3 -- the same held-out test IDEA-20260824-95d8d8 declares. A cell
        whose k = 4 prediction misses by more than a factor of 3 has its beta
        reported as shape-unvalidated and is excluded from the derivative fit.
        TRANSFER ASSUMPTION, STATED IN FULL: extrapolating a slope fitted over
        k = 1 to 4 to the k = 20 that rank 32 from a base of 12 would require is an
        extrapolation by a factor of five in the exponent, is supported by nothing
        measured here, and is the single least defensible number the experiment
        will produce. It is reported only with that sentence attached.
    - id: H2
      statement: >-
        (HEIGHT AS THE SUFFICIENT MATCHING VARIABLE.) Conditional on the
        minimal-model naive height cell H, the distribution of extra is independent
        of which family the fibre came from, EXCEPT through the family's generic
        rank r. That is, height is a sufficient statistic for the family-level
        confounding that KN-FIND-91f871 identifies.
      rigorous_support: >-
        RIGOROUS PART: the fibre naive height is 12 d log|t| + O(1) with d at least
        ceil((r+2)/10), so height is the variable through which generic rank
        mechanically constrains fibre size; matching on it removes that mechanical
        channel. DISTRIBUTION IMITATED: the standard practice of conditioning rank
        statistics on conductor, or on a monotone proxy for it, rather than on a
        parameter box. H2 IS THE ASSUMPTION MOST LIKELY TO BE FALSE, because the
        O(1) constant, the fibre-type vector, the torsion and the isogeny structure
        all vary between families at fixed height.
      validation_plan: >-
        Sample: the fixed-rank envelope control -- Mestre 1982 at envelope 79.329
        and the NAGAO-1994 quartic at envelope 109.505, both at rank 12, both
        measured in KN-FIND-91f871 -- certified in the same common cells, at least
        150 fibres each. Compare: if H2 holds, their beta values agree within the
        fitting error; the observed absolute difference is the DIRECT MEASUREMENT
        of H2's failure. Tail check: repeat the comparison in the highest and
        lowest common cells separately, since H2 should fail worst where the two
        envelopes are furthest apart. If H2 fails, the correct report is that beta
        tracks something family-specific that is not rank, which is itself a
        first-class result and withdraws the headline rather than rescuing it. Also
        report conductor as a second matching variable alongside height, and state
        whether the two matchings give the same sign for the derivative;
        disagreement between them is reported, never reconciled by choosing one.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC EXPONENT IS MOVED. This idea MEASURES the exponent of the
      programme's central search: V(R) = exp(beta*(R - r)) times the certification
      cost, the number of fibres to certify for a target rank R from base r. beta
      is at present entirely unmeasured in this repository, so the campaign's own
      cost model has an unknown exponent in it, and the second half of
      RQ-ECQ-80f23c's decision target ("the sieve volume reached versus what would
      be NEEDED") is not computable without it. Measuring an exponent is not moving
      one, and this record does not present it as such.
    memory_exponent: >-
      Flat and negligible: independent descents, streamed. Budget 2 GB peak RSS,
      against the 1.22 GB the predecessor campaign measured on the same class of
      box.
    best_known: >-
      For beta in a SINGLE family, IDEA-20260824-95d8d8 is the filed prior proposal
      and is unrun. For the cross-family derivative at matched height, this session
      found nothing in the corpus and did not check external literature. This
      programme's only relevant measured numbers are the r = 8 excess histogram (93
      at rank 8, 14 at rank 9, 17 at rank 10, 12 at rank 11, 1 at rank 12) and the
      standing fact that the largest excess ever observed anywhere in this
      programme is +4.
    hidden_overhead: >-
      Two disclosures. (1) The censoring rate is not a nuisance parameter but a
      potential generator of the entire effect, in the same direction as the
      hypothesis; the 95-percent-completion gate is what stands between this
      measurement and an artefact, and it may make the experiment unaffordable, in
      which case it must not run. (2) beta is fitted at k at most 4 and the number
      a reader will want is at k = 20; the factor-of-five extrapolation in the
      exponent is the dominant uncertainty and is not reduced by any amount of
      extra sampling at k at most 4.
    tradeoff_note: >-
      The real trade is ALARM LENGTH against NUMBER OF CELLS. A longer alarm buys
      completion, and therefore validity, at linear cost per descent; more cells
      buy resolution in the derivative. Validity is not tradeable, so the alarm is
      set first, by pilot calibration, and the cell count absorbs whatever budget
      remains. Trivially parallel across cells, but the campaign runs at
      max_concurrent 1 and GOAL-ECQ-002's accounting note records that exact linear
      algebra and descent are CPU-bound, so 2 concurrent producers is the honest
      ceiling on that box.

  dominated_by: >-
    DOMINATED, AND BY A RECORD IN THIS REPOSITORY. IDEA-20260824-95d8d8 dominates
    this proposal on the single-family estimate of beta: it is the same
    measurement, filed first, on 2026-08-24, for a fixed family, and anything this
    design learns about beta within one family is already its territory. This
    proposal is strictly the cross-family, height-matched, censoring-gated
    extension, and it is dominated by 95d8d8 on every axis except the r-dependence
    and the matching variable, which 95d8d8's claim text does not address. It is
    further dominated by KN-FIND-91f871 on family SELECTION -- the measured
    height-envelope gate is already the operational recommendation, costs about two
    seconds and 1e5 fibres per family, and does not require a single descent,
    whereas this design costs tens of CPU-hours. Frontier rows checked across time,
    memory and data: the envelope gate (dominates on cost by three orders of
    magnitude, answers a different question); 95d8d8 (dominates on the
    single-family beta); the Mestre-Nagao ordering statistic of EV-ECQ-0d142e OBS-6
    (dominates on choosing WHICH fibre to certify, says nothing about how many);
    direct enumeration of the excess histogram at r = 8 (already done, already
    committed, and is one of this design's four arms rather than a competitor). On
    the specific axis "does beta depend on r at matched height", no row dominates
    it because no row addresses it.
  sota_delta: >-
    QUANTITATIVELY. Current state of the number: beta is UNMEASURED in this
    repository, so the volume function has an unknown exponent and the campaign's
    stated axis-2 figures (97,640 scored, 1,548 matched, 140 attempted, 56
    completed, 1,993.0 s) cannot be compared to any requirement. After this
    measurement: beta known per family with a confidence interval over k at most 4,
    the derivative in rank known with a confidence interval, and the volume
    function computable with its extrapolation range stated. Delta on rank over Q:
    exactly ZERO. Delta on the world record: exactly ZERO. Delta on the programme's
    ability to price its own strategy: from "no number" to "a number with a flagged
    five-fold extrapolation", which is the honest size of the gain and is smaller
    than it will be tempting to report.

  estimated_cost:
    implementation: medium
    compute: high
    basis: >-
      Implementation reuses the predecessor's certify_rank, specialise and height
      machinery plus a cell constructor, an alarm calibrator and a fitting harness;
      no new mathematics. Compute is the problem and is honestly high: roughly 15
      to 35 CPU-hours depending on the alarm the 95-percent-completion gate
      demands, dominated by STAGE 3, with two of the four arms partly pre-paid by
      committed data. STAGE 2 is a genuine stop-gate -- if no affordable alarm
      reaches 95 percent completion in the high-height cells, the experiment must
      be abandoned before STAGE 3 rather than run at a censoring rate that
      generates its own answer.

  recommended_priority: medium
