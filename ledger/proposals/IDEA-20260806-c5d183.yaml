idea:
  id: IDEA-20260806-c5d183
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    No lossy ECDLP object propagates deterministically under the FULL
    translation action: a five-line orbit argument forces every tracked object
    into exactly three classes (partial-action, branching, or
    coordinate-dependent), which supplies KN-OPEN-019 with an INDEX SET rather
    than a tally and forces the value of IDEA-20260802-002's primary metric
    before that meter is built
  class: mechanism

  claim: >-
    (A) THE THEOREM-SHAPED CLAIM, WITH ITS PROOF STATED IN THE CLAIM BECAUSE IT
    IS FIVE LINES. Let G = <P> be cyclic of prime order N, let S be any set, and
    let pi: G -> S. Say pi PROPAGATES DETERMINISTICALLY UNDER THE FULL
    TRANSLATION ACTION if there is a family of maps T_h: S -> S, h in G, with
    pi(g + h) = T_h(pi(g)) for all g, h in G. Then:
        pi is either CONSTANT or INJECTIVE.
    PROOF. The relation pi o (+h) = T_h o pi says pi is a factor map of the
    G-action on itself by translation onto the induced G-action on pi(G). A
    factor of a transitive action is transitive, so G acts transitively on
    pi(G); hence |pi(G)| divides |G| = N; hence |pi(G)| in {1, N}. QED.
    CONSEQUENCE, WHICH IS THE POINT: "lossy" (|pi(G)| < N) and "propagates
    deterministically under all translations" are MUTUALLY EXCLUSIVE for the
    ECDLP. The cell (L >= 1 bit, branching b = 1) of the inventor protocol's
    own lossy-projection test IS EMPTY, and it is empty for a reason that fits
    on a postcard.

    (B) THE TRICHOTOMY THIS FORCES, AND IT IS EXHAUSTIVE BY CONSTRUCTION. Every
    non-trivial ECDLP tracked object must therefore violate at least one
    hypothesis of (A), and there are exactly three hypotheses to violate:
      CLASS I - PARTIAL ACTION. Determinism is required only for h in a proper
        subset H subset G, not all of G. This is exactly index calculus: the
        object is a relation vector and it propagates deterministically only
        under translation by FACTOR-BASE elements. The class's cost is governed
        by how far H's word metric reaches, i.e. by |mF| versus N - which is
        precisely the conservation identity KN-FIND-007 already owns.
      CLASS II - BRANCHING. T_h is set-valued or stochastic (b > 1). This is the
        transfer-operator / partition lens (EV-TRA-001), the Kummer-line
        pseudo-addition, and every "coarse cell" object. Survival depth is
        log(budget)/log(b) steps, which is IDEA-20260802-002's own formula.
      CLASS III - COORDINATE DEPENDENCE. pi is not a function of the group
        element at all but of its REPRESENTATION (affine coordinates, a lift, a
        curve model). This is jets, x-coordinate arithmetic, twist weights,
        p-adic lifts, integer lifts. It is exactly the class KN-TECH-005's
        opaque-label model excludes, and exactly the class KN-FIND-002 screens
        by simulability.
    A FOURTH CLASS CANNOT EXIST WITHOUT REFUTING (A). That is what makes this an
    index set rather than a list.

    (C) A FORCED VALUE FOR AN ALREADY-COMMITTED EXPERIMENT'S PRIMARY METRIC.
    IDEA-20260802-002 proposes to measure, for at least twelve pre-registered
    projections, the pair (L = bits discarded, b = branching factor), and states
    its success branch as "at least one has L >= 1 bit together with b <= 4 - a
    genuinely lossy object that still propagates with bounded branching". Under
    (A), the sub-case b = 1 with L >= 1 is IMPOSSIBLE for full-translation
    propagation, and can only occur when the meter is measuring propagation
    under a PARTIAL set of translations. So (A) predicts, before that meter
    exists: EVERY candidate the meter scores at b = 1 will have L = 0, and every
    candidate it scores at L >= 1 will have b > 1 - UNLESS the meter's step set
    is a proper subset of G, in which case its readings are Class I readings and
    must be labelled as such. THAT IS A POINT PREDICTION ABOUT AN EXISTING
    PROPOSAL'S OUTPUT, IT IS CHECKABLE, AND IT CAN FAIL.

    (D) WHAT IT IS NOT. It is NOT a proof that the ECDLP is hard, NOT a
    statement that any class is empty of good attacks, and NOT a saturation
    claim. All three classes are non-empty and Class I contains every index
    calculus that has ever worked in any setting. What it supplies is the thing
    docs/inventor-protocol.md section 4 says this program does not have: a
    closure argument over an ENUMERATED index set, rather than a count of
    rejected mechanisms.

  object_first_candidate:
    tracked_object: >-
      THE PROPAGATION TYPE OF A PROJECTION: the triple
      (H, b, coordinate_dependence) = (the subset of G under which pi's
      propagation is deterministic, the branching factor, whether pi factors
      through the group element or only through its representation). This is a
      projection OF projections - it discards what pi computes and retains only
      how pi moves.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: Semaev and summation polynomials;
      Groebner solving degree; factor-base geometry; Weil descent and covers;
      isogeny, CM and endomorphism leverage; pairing transfer; lattice methods;
      Pollard rho and BSGS as algorithms. NO ATTACK IS PROPOSED. The object is a
      property of the map, not of the curve, and the record's whole content is
      classificatory.
    newness_score: >-
      The orbit argument is elementary and I claim no novelty for it; a factor of
      a transitive action is transitive is a first-course fact, and for a group
      of prime order the conclusion is immediate. What the duplication audit did
      not find in the 64 committed proposals or the 47 ECDLP catalogue entries is
      (i) the statement that the (lossy, deterministic) cell is EMPTY rather than
      merely unpopulated, (ii) the resulting three-class index set presented as
      the KN-OPEN-019 index, or (iii) a forced value for IDEA-20260802-002's
      primary metric. The nearest relative, catalogue A3-6, argues from
      equivariance under AGL(1, Z/n) ACROSS INSTANCES; this argues from
      equivariance under translation WITHIN one instance, and reaches a
      conclusion about determinism rather than about information content.
    testability_score: >-
      High and almost free, and the testability is the reason to file it rather
      than merely believe it. The theorem is checkable by exhaustive enumeration
      at toy N: for a candidate pi, verify computationally that
      pi(g+h) = T_h(pi(g)) fails for some (g, h) whenever 1 < |pi(G)| < N. The
      classification of the corpus's own O1-O10 object lists into I/II/III is
      pure reading and can fail by exhibiting an object in none of the three.
    survival_score: >-
      The theorem survives to every N and every scale because it is finite group
      theory. It DISSOLVES the moment the group is not of prime order - in
      Z/(ab) the projection to Z/a is lossy AND deterministic - which is exactly
      why Pohlig-Hellman exists and is the built-in nearby-object control.

  mechanism: >-
    DERIVED IN THIS RECORD. Nothing below is cited; all of it is checkable by
    hand in ten minutes, which is the point.

    WHY PRIME ORDER IS DOING ALL THE WORK, AND WHY THAT IS INFORMATIVE RATHER
    THAN TRIVIAL. In Z/(ab) with a, b > 1 the reduction map Z/(ab) -> Z/a is
    lossy (loses log b bits) and propagates perfectly deterministically
    (T_h = +h mod a). It is a genuine Class-0 object and it is the entire
    content of Pohlig-Hellman. So the empty cell is not an artifact of the
    lossy-projection test being too strict: the cell is NON-EMPTY for composite
    order and EMPTY for prime order, and the difference is exactly the reason
    cryptographic curves are chosen with prime-order subgroups. This makes the
    theorem a statement with a working nearby object rather than a vacuity.

    WHY THE THREE CLASSES ARE EXHAUSTIVE. The hypotheses of (A) are: pi is a
    function of the group element (not the representation); T_h exists for ALL
    h; T_h is single-valued. Negating them in turn gives Class III, Class I and
    Class II respectively. There is no fourth hypothesis, so there is no fourth
    class. The exhaustiveness is over HYPOTHESES, not over objects, which is the
    honest form: it does not claim the classes are small, only that they are all.

    WHAT EACH CLASS COSTS, STATED SO THE INDEX SET IS USABLE RATHER THAN
    DECORATIVE.
      CLASS I. Determinism under H only. The object's reach after m steps is the
      sumset mH, and by the double count that gives KN-FIND-007 the mean number
      of length-m words hitting a given target is C(|H|+m-1, m)/N EXACTLY,
      independent of how H is chosen. So Class I's whole design freedom is the
      coverage/collision split, and the corpus already owns both the identity and
      the 1.582 headroom bound. FORWARD GUIDANCE: Class I is not empty and is not
      closed, but its mean-yield axis is provably inert.
      CLASS II. Branching b > 1. After k steps the object's fibre has size b^k,
      so it carries information for at most log(budget)/log(b) steps. With a
      budget of N^{1/2} steps and any b >= 2 that is (1/2) log_2 N / log_2 b
      steps - LINEAR IN log N, not in N. FORWARD GUIDANCE: a Class-II object can
      only help if b is subconstant in a suitable amortized sense, or if the
      branches can be pruned by a test cheaper than following them.
      CLASS III. Coordinate dependence. This is precisely the class KN-TECH-005's
      lower bound does not cover, and it is where every non-generic attack that
      has ever worked (Weil descent, MOV, SSSA, Gaudry-Diem) lives. FORWARD
      GUIDANCE: Class III is the ONLY class in which a sub-1/2 exponent for
      prime-field ECDLP can possibly live, and KN-FIND-002's simulability screen
      is exactly a test for whether a given Class-III object collapses back to
      Class 0 (i.e. is computable from the transcript at O(1) overhead).

    THE ONE-SENTENCE CONSEQUENCE FOR THIS PROGRAM'S SEARCH. Every future
    ideation session against the ECDLP can be required to name which of the
    three classes its object lives in and to state the corresponding cost
    obligation - conservation-mean coverage for I, branching survival depth for
    II, simulability overhead for III. That is a checklist derived from an
    argument, and it is what KN-OPEN-019 asks for.

  novelty_status: unverified

  literature_context:
    - >-
      docs/inventor-protocol.md READ IN FULL, in particular section 2's
      lossy-projection test and its worked failure (Delta, Pi) = (x xor y, x*y),
      and section 1's statement that "This program has no such enumeration for
      the ECDLP. Writing one down is KN-OPEN-019."
    - >-
      ledger/proposals/IDEA-20260802-002.yaml examined by targeted grep (the
      claim block, the L/b definitions, the null-object and coarsening-ladder
      controls). Its own text defines "b = 1 means deterministic propagation,
      b = |S| means the object carries no information forward, and 1 < b << |S|
      means a probabilistic lens whose survival depth is log(budget)/log(b)
      steps". Full body NOT read; the discrimination below is stated so a
      reviewer who does read it can check it.
    - >-
      knowledge/techniques/KN-TECH-005.md and knowledge/findings/KN-FIND-002.md
      READ IN FULL, used only to place Class III.
    - >-
      ideas/catalogue-20260805/A3-representations.md READ IN FULL; entry A3-6 is
      the nearest catalogue relative and is discussed below. It is pre-ledger and
      mints no identifier.
    - >-
      PRIMARY SOURCES UNREACHABLE. The orbit argument is almost certainly
      classical in some form and may be explicit in the random-self-reducibility
      literature; nothing here is claimed novel and nothing is dismissed as
      known. If a reviewer finds it stated, the honest status becomes `known` and
      the DELIVERABLE - the index set and the forced value in (C) - is unchanged.

  lossy_projection_identifiability_audit:
    projection: >-
      A projection pi: G -> S -> its propagation type
      (H, b, coordinate_dependence).
    what_is_discarded: >-
      Everything pi computes. Two projections with completely different outputs
      (say, the low bit of x and a random 1-bit hash of the point) share the same
      type.
    why_genuinely_lossy: >-
      Maximally lossy; the fibres are enormous. Not the (Delta, Pi) failure -
      nothing about pi is recoverable from its type.
    why_compatible_with_the_operations: >-
      The operation the type must survive is COMPOSITION of projections, and it
      does so deterministically: for pi_2 o pi_1 the deterministic set is
      H_1 intersect H_2, the branching multiplies (b <= b_1 * b_2), and
      coordinate dependence is inherited by either factor. That is a complete
      propagation rule on the retained triple alone.
    is_it_only_a_change_of_coordinates: >-
      NO, and the honest weakness is recorded. It is not a re-coordinatisation
      (huge fibres) and it is not constant (the corpus's own object lists
      populate all three classes). THE WEAKNESS: the type is COARSE - it cannot
      distinguish a good Class-III object from a useless one, and it will never
      by itself find an attack. Its value is that it makes the empty cell
      provable and the remaining cells nameable, which is a search discipline,
      not a discovery.

  assumptions:
    - >-
      The subgroup has PRIME order N. Everything fails for composite order, by
      design, and that failure is the nearby-object control rather than a
      limitation to be apologised for.
    - >-
      "Propagates deterministically" is taken to mean the existence of T_h with
      pi(g+h) = T_h(pi(g)) for all g, uniformly in h in H. A weaker notion -
      T_h defined only on a subset of S, or defined only with high probability
      over g - escapes the theorem, and the classification must then record
      which weakening a candidate uses. Stage 0 enumerates the weakenings
      explicitly rather than leaving them implicit.
    - >-
      Class III is defined by pi failing to factor through the group element.
      An object that factors through the group element but whose T_h is only
      efficiently computable given coordinates is Class 0 mathematically and
      Class III computationally; the record reports both readings rather than
      choosing.

  predictions:
    - metric: >-
        Exhaustive verification of (A) on toy groups: for every projection pi in
        a pre-registered list with 1 < |pi(G)| < N, the number of pairs (g, h)
        with pi(g) = pi(g') but pi(g+h) != pi(g'+h)
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE for EVERY such pi, at every prime N tested
        (N in {101, 401, 1009, 4001}). FORCED BY THE THEOREM: a single pi with
        1 < |pi(G)| < N and ZERO such pairs refutes (A) outright and is the
        cheapest possible falsification of this record.
    - metric: >-
        The same count for the COMPOSITE-order nearby object: G = Z/(ab) and
        pi = reduction mod a
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO, at every (a, b) tested. This is the control that shows the
        instrument can return zero when zero is correct; if it reports violations
        for Pohlig-Hellman's own projection, the instrument is broken and no
        prime-order negative may be read from it.
    - metric: >-
        Classification of the corpus's own committed object lists - O1-O7 of
        catalogue A1, O1-O10 of catalogue A4, the eleven objects of catalogue
        A3, and the tracked objects named in the 34 committed RQ-ECDLP-002
        proposals - into Classes I, II, III
      direction: different
      minimum_effect: >-
        EVERY object must land in at least one class, with the violated
        hypothesis named. FORCED CONSEQUENCE AND THE DECISIVE ALTERNATIVE: an
        object in NONE of the three classes refutes the exhaustiveness argument
        and is, by construction, the most interesting object in the corpus - it
        would be lossy, deterministic under all translations, and a function of
        the group element, which (A) says cannot exist. Finding one means the
        theorem is wrong; finding none means the index set is usable.
    - metric: >-
        Forced value for IDEA-20260802-002's primary metric: the number of its
        >= 12 pre-registered projections scoring (L >= 1 bit AND b = 1) under
        full-translation propagation
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO. If that meter, once built, reports a nonzero count under a
        FULL step set, either the theorem is false or the meter is mis-measuring
        b - and distinguishing those two is a further cheap check (recompute b by
        exhaustive enumeration on the same projection). If its step set is a
        proper subset of G, its readings are Class I and must be relabelled,
        which is a free improvement to an already-committed proposal.

  minimal_test:
    design: >-
      Two stages. Stage 0 alone is the deliverable; stage 1 is confirmation.
      STAGE 0 (paper, ZERO compute, ~2 hours). Write (A) and its proof; enumerate
      the three classes and the weakenings of "deterministic" that escape each;
      classify every object in the corpus's four committed object lists, naming
      the violated hypothesis per object; state the per-class cost obligation;
      state the forced value for IDEA-20260802-002.
      STAGE 1 (pure Python, minutes, no numpy and no SageMath). Toy verification
      at N in {101, 401, 1009, 4001} on generated prime-order curves, over a
      pre-registered list of >= 15 projections spanning all three classes plus
      the two degenerate ends (constant, identity). For each: compute |pi(G)|
      exactly, count propagation violations over all (g, h) pairs (exhaustive at
      N = 101, 401; sampled with a stated sample size at 1009, 4001), and record
      the measured b. Then repeat the whole battery on Z/(ab) with the reduction
      projection.
    controls:
      - >-
        KNOWN-ANSWER EDGE WITH NO HIDDEN COST (runs first). The two degenerate
        projections: pi = constant must return |pi(G)| = 1 and ZERO violations;
        pi = identity must return |pi(G)| = N and ZERO violations. Both answers
        are known for free from the theorem's own statement. An instrument that
        reports violations on either is broken, and no other cell may be read.
        This is the calibration edge: an instrument built to detect propagation
        failure will detect it everywhere unless it returns zero on the two
        objects that provably have none.
      - >-
        NULL OBJECT OF THE SAME SHAPE (CAN FAIL). A random projection
        pi = uniform random label in a set of size k, with no relation to the
        group. FORCED VALUE: violation count at the balls-in-bins expectation
        for k bins, and b at the same expectation. If a random projection shows
        FEWER violations than a structured one of the same |pi(G)|, the counter
        is measuring something other than propagation.
      - >-
        COMPOSITE-ORDER POSITIVE CONTROL (CAN FAIL, AND IS THE ONE THAT MATTERS).
        G = Z/(ab), pi = reduction mod a, for (a,b) in {(7,11), (13,17),
        (31,37)}. FORCED VALUE: |pi(G)| = a strictly between 1 and ab, and
        violations EXACTLY ZERO. This is a genuinely lossy, genuinely
        deterministic projection, and the instrument MUST find it. An instrument
        that cannot exhibit the one object the theorem says exists in the
        composite case has no power to assert its absence in the prime case.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS. Take a fixed projection and
        coarsen it progressively (label = x mod 2^j for j = 1..log N). Violation
        count must be strictly positive at every intermediate j and must fall to
        zero only at the two ends. A violation count that does NOT respond to
        the coarsening parameter is the canonical artifact tell.
      - >-
        ARCHIVE CHECK (zero compute). Record the exact sentence in
        IDEA-20260802-002 that this record makes a prediction about, and the
        exact sentence in catalogue A3-6 that it does NOT duplicate. Under
        AGENTS.md retrieval policy item 7 the relationship is reported; no status
        change to either is proposed.
    required_metrics:
      - >-
        per projection: |pi(G)|, exact violation count (or sampled with n
        stated), measured b
      - the same for the random null and for the composite-order positive control
      - the coarsening ladder's violation curve
      - >-
        the classification table: object -> class -> violated hypothesis -> cost
        obligation
      - the count of corpus objects landing in NO class (predicted zero)

  falsification_conditions:
    - >-
      Any projection with 1 < |pi(G)| < N on a PRIME-order group exhibits zero
      propagation violations. The theorem is false as stated, the trichotomy is
      not exhaustive, and this record is withdrawn rather than re-scoped.
    - >-
      The composite-order positive control fails to exhibit a lossy
      deterministic projection. The instrument has no power and no prime-order
      negative may be reported.
    - >-
      Some object in the corpus's committed lists lands in none of the three
      classes. Exhaustiveness fails; and per (C) that object is the most
      valuable finding this record could produce.
    - >-
      The degenerate calibrations (constant, identity) report nonzero
      violations. Instrument broken.
    - >-
      IDEA-20260802-002, once executed with a full step set, reports a candidate
      at L >= 1 and b = 1. Either (A) is false or that meter's b is
      mis-measured; both are decision-relevant and the record specifies the
      follow-up check that separates them.

  confounders:
    - >-
      DEFINITIONAL DRIFT ON "PROPAGATES". The theorem is sensitive to whether
      T_h must exist for all h, be single-valued, and be defined on all of S.
      Every weakening opens a class, and a careless reader can make the theorem
      look either trivial or false by silently choosing a different definition.
      Stage 0 enumerates the weakenings explicitly for exactly this reason.
    - >-
      TRIVIALITY RISK, STATED RATHER THAN HIDDEN. The proof is five lines and
      the result may be folklore. Its VALUE does not depend on being new: it
      depends on the corpus currently having no index set for KN-OPEN-019 and on
      IDEA-20260802-002 planning to search for an object in a cell that (A) says
      is empty. Both of those are facts about this repository, not about the
      literature.
    - >-
      CLASS III IS A DUMPING GROUND. Nearly every interesting object is
      coordinate-dependent, so the classification's discriminating power is
      concentrated in separating I from II and in the per-class cost obligation,
      not in the class label itself. Saying so is part of the deliverable.
    - >-
      An author who wants a clean trichotomy can force objects into classes by
      relabelling. The classification table therefore requires the VIOLATED
      HYPOTHESIS to be named per object, which is checkable, rather than only the
      class.

  interpretation_limits:
    - >-
      NO ATTACK. NO EXPONENT MOVED. sota_delta is zero on every ECDLP cost axis.
      This record proposes no algorithm and solves nothing.
    - >-
      IT IS NOT A SATURATION CLAIM AND MAY NOT BE QUOTED AS ONE. All three
      classes are non-empty; Class III contains every non-generic attack that has
      ever worked; the record explicitly does not assert that any class has been
      exhausted. Under docs/inventor-protocol.md section 4 this is a closure of
      ONE cell (lossy + fully-deterministic) with a named obstruction
      (transitivity of a factor action on a prime-order orbit) and forward
      guidance (the three surviving classes with their cost obligations).
    - >-
      It does not settle KN-OPEN-019. It supplies an index set and an argument
      for its exhaustiveness; KN-OPEN-019 additionally wants the classes
      POPULATED and their reach characterised, and that is not done here.
    - >-
      It proposes no status change to IDEA-20260802-002, which remains a
      worthwhile measurement: the meter's other readings (b for Class-II
      objects, L for Class-III ones) are exactly what the index set needs
      populated, and this record makes its primary metric's null branch
      PREDICTABLE rather than unmotivated.
    - >-
      Forward guidance, mandatory. What remains open regardless of outcome:
      (a) whether Class II admits any object with amortized branching below the
      survival-depth bound - the corpus's transfer-operator lane is the only
      probe and it measured delta = 0.0195; (b) whether Class I admits an H
      whose word metric reaches N in fewer than the conservation-forced number
      of steps - this is KN-OPEN-001 in its sharpest form; (c) which Class-III
      objects survive KN-FIND-002's simulability screen at NON-constant
      overhead, which IDEA-20260727-004 already prices and which is the only
      cell where a sub-1/2 prime-field exponent can live.
    - >-
      Residue carried from a candidate this session DROPPED as duplicative (the
      CM norm-form lens, which reproduces catalogue A1-2's meet-in-the-middle
      exponent exactly): the multiplicative structure of an imaginary quadratic
      order End(E) is a Class-I structure whose H is the set of small-norm
      endomorphism images, and it is unusable not because of the group law but
      because CLASS MEMBERSHIP CANNOT BE TESTED WITHOUT THE ANSWER - given a
      target residue one cannot decide whether its minimal-norm lift is smooth
      without first knowing the residue. That is a Class-I obstruction of a
      different kind from coverage, it is not the conservation identity, and it
      deserves its own record if anyone pursues the CM lane.

  standing_screen_verdicts:
    kn_find_007_mean_yield:
      verdict: PASSES, AND CITES THE IDENTITY AS A CLASS-I COST OBLIGATION
      reasoning: >-
        No factor base is proposed and no yield advantage is claimed. The
        conservation identity is USED, in the direction the finding licenses: it
        is named as the cost obligation every Class-I object must discharge, and
        the record explicitly states that Class I's mean-yield axis is provably
        inert. Nothing here promises higher mean yield at matched size; the
        record's content is that no Class-I object can.
    kn_find_c41ea9_generic_fibre:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        The observable is a propagation-violation count over group-element pairs
        and a class label. It is not a Galois group, a cycle type, a monodromy
        statistic, a Frobenius census, or any statistic of the summation cover's
        generic fibre, and it is not evaluated on any locus of that cover.
        A candidate of exactly the screened type - the quadratic-character word
        chi(x(R) - x(P_i)) - was generated and DROPPED by this screen during the
        audit (duplication_audit.md, row D5), which is recorded there.
    kn_find_002_ggm_simulable:
      verdict: PASSES, AND PLACES THE CLOSED FAMILIES RATHER THAN REOPENING THEM
      reasoning: >-
        No augmented oracle is proposed and no closed family is reopened. Jets
        and endomorphism oracles are placed in Class III and the record states
        that KN-FIND-002's simulability screen is exactly the test for whether a
        Class-III object collapses to Class 0. That is a use of the simulation
        argument, not an attempt to defeat it. The record additionally carries
        KN-FIND-002's own scope caveat - that its verdicts are reached in the
        structured GGM while the Omega(sqrt N) bound is proved in the
        opaque-label model - as an open item, without resolving it.

  discriminated_from:
    nearest_existing_idea: IDEA-20260802-002
    nearest_existing_read: >-
      Examined by targeted grep over the committed file: the id/title block, the
      claim block including the L >= 1 / b <= 4 success branch and the (a)/(b)/(c)
      outcome enumeration, the F1-F7 family list, the lossy-projection paragraph
      quoting the (Delta, Pi) failure, the L/b semantics, the nearest-records
      note, the assumptions block, and three of its prediction/control blocks
      including the random-label null and the coarsening ladder. Full body not
      read line by line.
    differing_observable: >-
      IDEA-20260802-002's observable is the MEASURED PAIR (L, b) per candidate
      projection, obtained by running a meter. This record's observable is the
      COUNT OF PROPAGATION VIOLATIONS - the number of pairs (g, h) with
      pi(g) = pi(g') and pi(g+h) != pi(g'+h) - which is a DIFFERENT quantity
      computed from the same enumeration, and whose value is FORCED to be
      strictly positive for every lossy pi by a theorem rather than measured.
      The relationship is not restatement but prediction: this record predicts
      the null branch of 002's primary metric (zero candidates at L >= 1, b = 1)
      before 002's meter is built, and supplies the reason. 002's own success
      branch (b) - "EVERY CANDIDATE HAS EITHER L = 0 OR b close to |S|" - is
      exactly what (A) proves must happen under a full step set, so this record
      converts 002's expected-but-unexplained outcome into a derived one, and
      converts its (a) branch into a check on 002's step set rather than a
      discovery about the ECDLP. ONE SHARED ENUMERATION SEPARATES THEM: run 002's
      candidates under a FULL step set and under a proper-subset step set and
      report both. If the readings differ, 002's b was a Class-I reading.
    second_and_third_records_checked:
      - >-
        Catalogue A3-6 (ideas/catalogue-20260805/A3-representations.md, read in
        full). Its T1 states that an object invariant under BOTH the scalar and
        translation actions of AGL(1, Z/n) is constant across instances with the
        same (E, P) and carries zero information about k; its classifying datum
        is the STABILIZER SUBGROUP in AGL(1, Z/n) x twist torus x End(E). That
        is a statement about information content under a group acting on the
        INDEX ACROSS INSTANCES. This record says nothing about information
        content and does not use the scalar action at all; it is about
        DETERMINISM OF PROPAGATION under translation WITHIN one instance, and its
        index set is a three-element list of violated hypotheses rather than the
        divisor lattice of n-1. The observables differ: A3-6 measures
        pi(g.s) = rho(g).pi(s) equivariance over 10^4 random instances; this
        record counts propagation violations over (g, h) pairs in one instance.
        A3-6 is pre-ledger and mints no identifier.
      - >-
        IDEA-20260727-005 (title read via the audit's E3 enumeration): the
        exit-map classification barrier, which classifies efficiently computable
        algebraic HOMOMORPHISMS out of a prime-order prime-field subgroup into
        three classes each with exponent >= 1/2. That record classifies MAPS THAT
        ARE HOMOMORPHISMS and bounds their exponents; this record classifies ALL
        projections, homomorphic or not, and its conclusion is that the
        homomorphic ones are exactly the degenerate cases (constant or
        injective) - which is a statement 727-005's framing presupposes rather
        than derives. The differing observable: 727-005's is an attack exponent;
        this record's is a violation count and carries no exponent.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE OF THE CENTRAL CLAIM IS HEURISTIC. Statement (A) and the
        exhaustiveness of the trichotomy in (B) are unconditional finite group
        theory, valid for every prime N and every set S, with no distributional
        assumption anywhere. This item is numbered and recorded PRECISELY SO
        THAT THE ABSENCE IS EXPLICIT rather than inferred from silence: a reader
        may not later attribute a heuristic to this record's core.
      rigorous_support: >-
        Transitivity of a factor of a transitive action, plus Lagrange for
        prime order. Both are theorems.
      validation_plan: >-
        Exhaustive enumeration over all (g, h) pairs at N = 101 and N = 401
        (10,201 and 160,801 pairs) verifies the statement completely at those
        sizes, and complete verification at a size is stronger than a
        distributional check. Labelled TOY SCALE for the ENUMERATION, but the
        THEOREM is scale-independent and the enumeration is a bug-check on the
        implementation, not evidence for the theorem.
    - id: H2
      statement: >-
        The per-class COST OBLIGATIONS - conservation-mean coverage for Class I,
        survival depth log(budget)/log(b) for Class II, simulation overhead for
        Class III - correctly capture what each class must pay.
      rigorous_support: >-
        Class I's obligation is the exact double count of KN-FIND-007 and is
        rigorous. Class II's is the elementary observation that a b-fold
        branching after k steps yields a fibre of size b^k; rigorous as an upper
        bound on retained information, HEURISTIC as a cost statement because
        branches may be prunable. Class III's rests on KN-TECH-005's bound,
        which is rigorous in the opaque-label model and whose applicability to
        coordinate-visible oracles KN-FIND-002 itself flags as a model question.
        THIS IS THE WEAKEST LINK IN THE RECORD and it is stated as such.
      validation_plan: >-
        Class I: already validated in this corpus at 144 cells with deviation
        exactly 0 (EV-FBG-001) - no new work. Class II: measure b and the
        recoverable-information depth on a Class-II object at N <= 2^14 and
        check the depth against log(budget)/log(b); the transfer-operator
        instrument of EXP-TRA-001 is the natural vehicle. Class III: NOT
        validatable here - it depends on the model question KN-FIND-002 leaves
        open, and the record's honest position is that Class III's cost
        obligation is CONDITIONAL on that question, which is exactly the gap
        catalogue A3-1 prices and which is blocked because KN-LIT-7606's body is
        unread and eprint is unreachable.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS PROPOSED AND NONE IS MOVED. The record's only quantitative
      statements about exponents are the per-class obligations it quotes from
      committed material: Class I is bounded by the conservation mean
      C(B+m-1,m)/N with coverage headroom <= 1.582; Class II retains information
      for at most log(budget)/log(b) steps, i.e. O(log N) steps at any constant
      b >= 2 within a N^{1/2} budget; Class III is bounded below by
      c*sqrt(N)/C_sim when the object is GGM-simulable at overhead C_sim
      (IDEA-20260727-004's budget). Against Pollard rho at 0.886*sqrt(N) and
      BSGS at N^{1/2}, the delta is exactly zero.
    memory_exponent: >-
      No algorithm, hence no memory claim. The verification at stage 1 uses
      O(N) memory at N <= 4001 for the exhaustive tables, which is an
      implementation detail and not a complexity claim. Against rho's O(1) and
      BSGS's N^{1/2} memory: not comparable, because no algorithm is proposed.
    best_known: >-
      Pollard rho, 0.886*sqrt(N) group operations at O(1) memory, remains the
      best known prime-field ECDLP algorithm and is untouched. BSGS at
      (N^{1/2}, N^{1/2}). Multi-target sqrt(T*N). Preprocessing frontier
      S*T^2 = Omega~(N). Nothing here changes any of them.
    hidden_overhead: >-
      Nothing hides in an o(1) because there is no asymptotic claim. What hides
      instead, and is disclosed: the classification's usefulness depends
      entirely on Class III's cost obligation, which is conditional on an
      unresolved model question (structured versus opaque-label GGM), and Class
      III is where nearly every interesting object lands.
    tradeoff_note: >-
      Not applicable - no algorithm, hence no time-memory tradeoff and no
      parallelization position. Multi-target: not applicable for the same
      reason. Recorded explicitly rather than omitted.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the conclusion: the transitivity of
      the translation action of G on itself. If the action were not transitive,
      pi(G) could be a non-trivial orbit space and lossy deterministic
      projections would exist.
    baseline_embedding:
      parameter_slice: >-
        Composite order N = ab. The argument must FAIL there, exhibiting the
        reduction map Z/(ab) -> Z/a as lossy and deterministic.
      reproduction_check: >-
        Symbolic and then by frozen fixture: the violation counter must return
        EXACTLY 0 for pi = reduction mod a on Z/(ab) at (a,b) in {(7,11),
        (13,17), (31,37)}, and must return |pi(G)| = a. This is a
        baseline-reproduction audit against Pohlig-Hellman, not a similar-looking
        plot.
    observation_collision:
      observable: >-
        The propagation-violation count together with |pi(G)|.
      distinct_preimage_search: >-
        A collision is guaranteed and is stated rather than hidden: any two
        projections with the same image size and the same violation count are
        indistinguishable to this observable, and one may be an excellent attack
        object while the other is noise. THE OBSERVABLE THEREFORE MAY NEVER BE
        USED TO ARGUE THAT TWO OBJECTS ARE EQUIVALENT, only to argue that the
        (lossy, zero-violation) cell is empty - which is an existence statement
        about a single value, not an identification.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (lossy, deterministic) fixed and vary the forgotten
          structure - the group order. The intrinsic invariant distinguishing the
          resulting objects is the divisor lattice of |G|: non-trivial for
          composite order, trivial for prime. That is exactly the
          observable-fibre counterexample construction, and it is why the theorem
          is a statement about prime order rather than about elliptic curves.
    quantifier_order: >-
      FOR ALL prime N, FOR ALL sets S, FOR ALL pi: Z/N -> S, IF THERE EXISTS a
      family (T_h)_{h in Z/N} with pi(g+h) = T_h(pi(g)) FOR ALL g and FOR ALL h,
      THEN |pi(Z/N)| in {1, N}. The T_h are allowed to depend on h (that is the
      point) but NOT on g; a T that may depend on g is not a propagation rule and
      the theorem does not apply to it. Writing the order down is what exposes
      that escape, and stage 0 enumerates it as one of the weakenings.
    method_ceiling:
      strongest_certifiable_claim: >-
        That one cell of the object space is empty, that the remaining cells are
        exactly three, and that each carries a stated cost obligation. It can
        NEVER certify that any of the three classes is exhausted, that the ECDLP
        is hard, or that any specific object fails - and it can never produce an
        attack.
    nearby_object_control: >-
      Composite-order groups, where the desired conclusion FAILS and a lossy
      deterministic projection exists. A method that could not distinguish
      Z/(ab) from Z/N would not have identified the load-bearing structure; this
      one distinguishes them by construction and the distinction is the
      positive control in the minimal test.
    proof_obligations:
      - claim: a factor of a transitive action is transitive
        responsibility: correctness
      - claim: "prime order forces |pi(G)| in {1, N}"
        responsibility: correctness
      - claim: the three hypotheses of (A) are the only ones available to negate
        responsibility: strictness
      - claim: composite order admits a lossy deterministic projection
        responsibility: baseline
      - claim: per-class cost obligations as stated
        responsibility: scope

  dominated_by: >-
    n/a (no result claimed on any cost axis) - written only after checking every
    frontier row this corpus holds, because an unchecked null would be a
    fabrication. TIME: Pollard rho 0.886*sqrt(N); BSGS N^{1/2}; the
    automorphism-quotient rho variant sqrt(N/|Aut|); multi-target sqrt(T*N);
    the memory-matched generic baseline sqrt(N/S) derived in
    IDEA-20260806-3b91c7; prime-field index calculus, which has no known
    advantage (KN-OPEN-001, and EV-IC-002 retracted this program's only support
    verdict). MEMORY: rho O(1); BSGS N^{1/2}; preprocessing frontier
    S*T^2 = Omega~(N). DATA/QUERIES: all query-free on public parameters. This
    record proposes no algorithm and occupies no point on any of these axes, so
    it is neither dominated nor dominating. No row was left unchecked.
  sota_delta: >-
    ZERO on every ECDLP cost axis - no attack, no solve, no relation, no
    certificate, no exponent. The delta is methodological and is stated
    quantitatively where it can be: one cell of the object space proved EMPTY
    (lossy + fully deterministic, for prime order) by a five-line argument; an
    index set of size EXACTLY THREE with an exhaustiveness argument over
    hypotheses rather than a tally over mechanisms; a per-class cost obligation
    each of which is already owned by a committed record (KN-FIND-007's
    C(B+m-1,m)/N for I, log(budget)/log(b) for II, c*sqrt(N)/C_sim for III); and
    a FORCED VALUE OF ZERO for the count of candidates in IDEA-20260802-002's
    stated success cell under a full step set. Against docs/inventor-protocol.md
    section 4's standard, that is a closure of one cell with a named obstruction
    and forward guidance, not a fatigue report - and it does not close, and may
    not be quoted as closing, any of the three surviving classes.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.97 that (A) is correct as stated, since it is five lines of first-course
    group theory and the composite-order control shows it is not vacuous. 0.85
    that the trichotomy survives the classification of the corpus's four object
    lists with every object landing in a named class - not higher, because
    several catalogue objects (the incidence count, the exponent triple, the
    preprocessed advice string) are not projections of a group element at all
    and may require a fourth "not an instance-projection" bucket, which would be
    a real repair rather than a refutation. 0.60 that a reviewer does NOT find
    (A) stated in the literature in some form; my honest expectation is that it
    is folklore, and the record is written so that its value is unchanged if so.
    0.90 that the forced value in (C) holds against IDEA-20260802-002 once that
    meter is built with a full step set.

