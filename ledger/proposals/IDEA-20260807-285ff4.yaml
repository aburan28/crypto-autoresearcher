idea:
  id: IDEA-20260807-285ff4
  question_id: RQ-ECDLP-002
  added: '2026-08-07'
  title: H-ENDO-001's only two claims with algorithmic content, P2 (first-minimum shrinkage) and
    P3 (cost neutrality), were never measured at any rank, on any curve, at any size, because
    the instrument was withdrawn before dispatch -- and DEC-20260728-005 records RC-6 as NOT DISCHARGED
  class: measurement
  claim: 'H-ENDO-001 makes three claims about the lattice W_r of integer relations among {phi_i(P),
    phi_i(Q)}: P1 index pinning, P2 that the infinity-norm first minimum shrinks like N^{1/(2r)},
    P3 that a balanced meet-in-the-middle over 2r coordinates stays at exponent 1/2. EV-ENDO-001
    has strength ''strong'' and direction ''contradicts'', and reports ZERO RUNS: it refutes only
    the EIGENVALUE SOURCE for the frozen J0 family, via a Vieta identity forcing lambda_2 + lambda_3
    + 1 = 0 mod N, plus a computed 33-bit counterexample. DEC-20260728-005''s own limitations
    say it outright: ''RC-6 IS NOT DISCHARGED. No SVP was run on a curve-backed alternative eigenvalue
    triple, so the positive statement that relation-free genuine r = 3 cells are typical is UNMEASURED.''
    The decision itself says the result is ''NOT A CRYPTANALYTIC RESULT ... paper algebra about
    a withdrawn instrument''. H-ENDO-001 is still status `approved` and was never transitioned;
    no successor hypothesis or contract exists.'
  mechanism: 'Build a curve-backed rank-3 endomorphism configuration whose eigenvalues carry NO
    derived linear relation -- the defect EV-ENDO-001 identified was that the frozen J0 source
    forces one -- for instance by combining a genuine CM endomorphism with an eigenvalue drawn
    from a different, independently generated source, and verifying the absence of the Vieta relation
    before use. Then measure P2 and P3 directly: exact first-minimum enumeration of W_r in dimension
    2r <= 6 against the Minkowski prediction N^{1/(2r)}, and the measured operation count of the
    balanced 2r-coordinate meet-in-the-middle against a matched BSGS and rho control on the same
    instances. Dimension 6 is small enough that exact enumeration is trivially feasible, so the
    measurement is cheap and decisive.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/hypotheses
    - experiments
    - ledger/proposals
    grep_results:
    - ledger/hypotheses contains only H-ENDO-001 in this family and experiments/ only EXP-ENDO-001;
      no successor exists.
    - KN-FIND-009 records the eigenvalue-relation obstruction, not a measurement of P2 or P3.
    conclusion: P2 and P3 are unmeasured in this corpus.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: index calculus, Semaev systems,
      rho/BSGS as mechanisms (they appear only as matched controls), and the whole leakage/HNP
      family.'
    tracked_object: The lattice W_r of integer relations among the images {phi_i(P), phi_i(Q)},
      tracked through its first minimum and its index.
    one_step_propagation_rule: Adding an endomorphism adds two coordinates and one lattice dimension;
      the index and the first minimum both update deterministically from the new eigenvalue.
    newness_score: Nil as mathematics; the object is H-ENDO-001's, already approved. The content
      is that its measurable claims were never measured.
  lossy_projection_identifiability_audit:
    projection: the pair (P, Q) together with r endomorphisms -> the relation lattice W_r.
    what_is_discarded: The curve's concrete arithmetic; only the integer relation structure is
      retained.
    is_it_only_a_change_of_coordinates: 'NO -- W_r is strictly coarser than the instance; many
      instances share a lattice. Honest caveat: KN-FIND-009 establishes that the degeneracy of
      these lattices is governed by short eigenvalue relations rather than by rank(End(E)), so
      a large part of the object''s apparent freedom is already known to be illusory. This record''s
      job is to find out whether ANY of it is real, on a source that provably lacks the known
      relation.'
    mirror_failure_check: CHECKED. The failure would be a construction where the eigenvalue relation
      is forced again by a route nobody checked. The construction therefore VERIFIES the absence
      of the Vieta relation numerically before the lattice is built, and reports the check as
      a gate.
  null_object_control:
    primary_null: A RANDOM integer lattice of the same dimension and determinant, with no curve
      behind it. Its first minimum must match the Minkowski prediction; if the curve-backed lattice
      does not differ from it, P2 asserts nothing beyond generic lattice geometry.
    secondary_nulls:
    - 'RELATION-PRESENT POSITIVE CONTROL: build a configuration that DOES satisfy the Vieta relation
      and confirm the degeneracy KN-FIND-009 predicts, so the instrument is known to detect the
      failure mode it is avoiding.'
    - 'MATCHED BASELINE: rho and BSGS on the identical instances, so P3''s exponent claim is measured
      as a ratio rather than extrapolated.'
  assumptions:
  - A curve-backed r = 3 configuration free of the forced eigenvalue relation exists and is constructible
    at 33-64 bit sizes. IF IT DOES NOT EXIST, that is a stronger negative than EV-ENDO-001 currently
    records and is the record's most valuable possible outcome.
  - Exact first-minimum enumeration in dimension 6 is cheap, which it is.
  predictions:
  - metric: infinity-norm first minimum of W_r versus the Minkowski prediction N^{1/(2r)}
    direction: different
    minimum_effect: A ratio outside [0.5, 2] sustained across sizes, measured against the random-lattice
      null.
  - metric: measured operation count of the balanced 2r-coordinate MITM against matched rho
    direction: higher
    minimum_effect: P3 predicts no better than exponent 1/2; any measured ratio below 1 against
      rho at three sizes would contradict the program's standing reading and demands immediate
      adversarial review.
  minimal_test:
    design: Construct three curve-backed r = 3 configurations at ~33, ~48 and ~64 bits with the
      no-relation gate verified; enumerate the first minimum exactly in dimension 6; run the balanced
      MITM and matched rho/BSGS on the same instances; report ratios with the random-lattice null
      and the relation-present positive control.
    controls:
    - random integer lattice of matched dimension and determinant
    - relation-present positive control
    - matched rho and BSGS
    required_metrics:
    - exact first minimum and its ratio to N^{1/(2r)}
    - lattice index (P1 check)
    - MITM operation count and its ratio to rho
    - no-relation gate outcome
  falsification_conditions:
  - 'First minimum tracks the Minkowski prediction within the random-lattice envelope: P2 asserts
    nothing beyond generic geometry and the lane closes on a measurement.'
  - 'MITM operation count is at or above matched rho at every size: P3 holds and the object is
    cost-neutral, as H-ENDO-001 itself predicts.'
  - 'No relation-free curve-backed configuration exists at any tested size: the strongest negative
    available, and it supersedes EV-ENDO-001''s scope rather than repeating it.'
  confounders:
  - Dimension 6 is small enough that lattice-reduction quality is not a factor, but it is also
    small enough that asymptotic predictions are poorly resolved; report the ratio, not a fitted
    exponent.
  - CM curves are a non-generic family; any positive reading is scoped to them and must say so.
  - The 33-bit counterexample in EV-ENDO-001 is a single instance; matching its size is not matching
    its construction.
  interpretation_limits:
  - Toy scale (<= 64 bits). No cryptographic-scale claim.
  - Discharging RC-6 is a scope repair, not a result about ECDLP hardness.
  - This record does not transition H-ENDO-001; only the Coordinator may (AGENTS.md rule 1).
  heuristic_assumptions:
  - id: HEUR-ENDO2-1
    statement: First-minimum behaviour in dimension 6 at <= 64 bits is directionally representative
      of larger r and larger N.
    rigorous_support: None; Minkowski gives an average-case expectation, not an instance bound.
    validation_plan: Measure at three sizes and two ranks and report the trend.
  target_complexity:
    time_exponent: P3 claims exponent 1/2 (no improvement). This record measures it.
    memory_exponent: Balanced MITM over 2r coordinates is memory-heavy; the memory exponent must
      be reported, not assumed.
    best_known: Pollard rho, exponent 1/2, O(1) memory.
    hidden_overhead: Cost of constructing the configuration and of the SVP call itself, both of
      which must be charged.
    tradeoff_note: A memory-heavy method at the same time exponent is Pareto-dominated by rho
      and must be recorded as such.
  dominated_by: 'Pollard rho at exponent 1/2 and O(1) memory, which dominates any balanced MITM
    at the same time exponent on the memory axis. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2} time, O(1) memory); BSGS (p^{1/2} time, p^{1/2} memory);
    van Oorschot-Wiener parallel rho (p^{1/2}/w); Semaev index calculus as costed in FINDING-PF-IC-001
    (total exponent ~2.05 per target at toy scale, i.e. worse than rho). Queries are 0 on every
    row.'
  sota_delta: Predicted ZERO. Deliverable is the discharge of RC-6 and the first measurement of
    P2 and P3, in a lane DEC-20260728-005 left explicitly unmeasured.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.60 that a relation-free curve-backed r = 3 configuration can be
    built at all -- KN-FIND-009 suggests short eigenvalue relations are common rather than exceptional.
    0.85, conditional on that, that the first minimum matches the random-lattice null and P2 is
    generic. 0.03 that the MITM beats matched rho, which would be extraordinary and is not expected.
    The record's value is in discharging a declared-undischarged obligation cheaply, not in the
    probability of a positive.
