idea:
  id: IDEA-20260816-5d0c27
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Measure the transfer law itself rather than assuming it: hold mantissa width fixed and sweep
    lattice dimension, fitting the exponent in divergence proportional to dimension raised to that
    exponent, because every toy-to-deployed extrapolation in this goal silently assumes a value nobody
    in this corpus has measured.'
  class: composition
  claim: '(A) Every argument in this research question that moves from a toy measurement to a statement
    about deployed dimension passes through an unstated law of the form divergence proportional to
    dimension raised to an exponent gamma, at fixed precision and fixed per-leaf width. Three values
    of gamma are defensible a priori and they disagree by orders of magnitude at dimension 1024: gamma
    = 0.5 if per-leaf errors are independent and add in quadrature; gamma = 1.0 if they add as a sum
    of independent nonnegative contributions to a divergence; gamma = 2.0 if a common-mode error across
    leaves adds coherently before being squared into a divergence. (B) The claim is that gamma is
    MEASURABLE at accessible dimensions, because doubling dimension four times from 4 to 64 spans
    a factor of 16 and therefore a factor of 4, 16 or 256 in divergence depending on which gamma holds,
    and those three are trivially separable at modest sample sizes. (C) The claim is further that
    gamma is a property of the ERROR CORRELATION STRUCTURE and not of the dimension, so it should
    be STABLE across the tested range, and its stability is the testable content: a gamma that drifts
    with dimension falsifies the existence of a single transfer law and therefore falsifies every
    extrapolation built on one, which is more valuable than any particular value. (D) WHAT IS NOT
    CLAIMED: this record performs no extrapolation and reports no deployed-dimension number. Measuring
    gamma over dimensions 4 to 64 licenses nothing at 1024; it says only what the law looks like where
    it was measured and whether it is stable there. No attack, no security consequence, and no statement
    about any specification. (E) The negative outcome, gamma drifting or the fit failing, is the most
    useful result in the batch: it would mean the other precision entries must report toy numbers
    as toy numbers with no transfer language at all, putting a measured obstruction under a habit
    the corpus currently exercises informally.'
  mechanism: 'STAGE ONE constructs toy lattice bases at dimensions 4, 8, 16, 32 and 64 with a CONTROLLED
    Gram-Schmidt norm profile, so the per-leaf width is held to a fixed target across dimensions and
    dimension is varied alone. This is the load-bearing construction: without it a dimension sweep
    also sweeps conditioning and gamma becomes uninterpretable. STAGE TWO fixes mantissa width at
    three values, 16, 20 and 24, chosen so divergence is measurable at all five dimensions. STAGE
    THREE measures divergence against exact arithmetic at each cell using the frozen statistic and
    a fixed signature count. STAGE FOUR fits log divergence against log dimension separately at each
    precision and reports gamma with its confidence interval plus the residual pattern, since curvature
    in the log-log plot is the signature of a drifting gamma. STAGE FIVE runs the discriminating control:
    a deliberately COMMON-MODE injected error identical at every leaf, which must produce gamma near
    2.0, and a deliberately INDEPENDENT injected error fresh at every leaf, which must produce gamma
    near 0.5. Those two arms calibrate the instrument against the ends of the correlation spectrum,
    so a measured gamma in between is interpretable rather than merely reported. Refutation is direct:
    if the two injected arms do not separate, the instrument cannot read gamma and no signal value
    means anything.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FNDSA-001 in full, noting that its claim_tier_ceiling forbids reporting toy results
      as statements about standardized parameters. Read H-FNDSA-6a9cbb's assumptions block, which
      states that the standardized value is reached BY DERIVATION ONLY and the empirical arm runs
      at small widths. Extracted all twelve RQ-FNDSA-001 proposal titles. Ran grep -ril for extrapolation,
      scaling, dimension, transfer and toy over ledger/proposals/. Read docs/inventor-protocol.md
      sections 4, 5 and 6, in particular the validation ladder's step 2 on scaled-down instances.
    results: H-FNDSA-6a9cbb handles the toy-to-deployed gap by DERIVING the deployed value in closed
      form and using the toy ladder only to validate the law's shape, which is a legitimate strategy
      and is not a measured transfer exponent. IDEA-20260808-e7ba81 gives a dimension-dependent detection
      threshold from random-matrix theory, a statement about DETECTION cost in dimension rather than
      about how the divergence itself scales with dimension at fixed precision. IDEA-20260813-aaf02e's
      end-to-end budget composes across nodes and therefore implicitly contains a dimension law, but
      as a bound rather than a measured exponent. docs/inventor-protocol.md section 6 step 2 names
      running the pipeline on a scaled-down instance as the step this program most often skips, which
      is the general form of what this proposal instantiates.
    verdict: UNVERIFIED. No claim about outside literature. What is claimed new HERE is treating the
      toy-to-deployed transfer exponent as an object to be MEASURED with its own controls, rather
      than as a step performed silently inside other arguments, and in particular the pair of injected-error
      calibration arms, common-mode and independent, that bracket gamma at 2.0 and 0.5 and make an
      intermediate measured value interpretable. The derivation-based transfer strategy is assembled
      from H-FNDSA-6a9cbb; the dimension-dependence idea is assembled from IDEA-20260808-e7ba81; the
      calibrated measurement of gamma with bracketing controls is the part no record contains.
  object_first_candidate:
    tracked_object: 'The DIVERGENCE-VERSUS-DIMENSION CURVE at fixed precision and fixed per-leaf width,
      treated as a single object with one shape parameter, followed as dimension doubles. Not a divergence
      value at one dimension, not a distribution, not an error: the exponent of the curve, plus the
      residual pattern saying whether one exponent suffices.'
    lossiness: 'The projection discards the divergence VALUES and keeps only the exponent relating
      them, so every pair of runs whose divergences differ by a constant factor maps to the same object.
      That is genuinely lossy and it is the point: a prefactor depends on the implementation, the
      emulator and the basis construction, none of which transfer, whereas an exponent determined
      by correlation structure might. What survives propagates because doubling the dimension acts
      on the exponent multiplicatively and on the prefactor not at all, so extrapolation, the operation
      of interest, is a function of the retained part alone. The residual pattern is retained precisely
      because it detects when the projection is invalid, that is when no single exponent exists.'
    propagation: One step is a doubling of the lattice dimension, which doubles the number of leaves
      and adds one level to the tree. Acting on the tracked object, a doubling multiplies the divergence
      by two raised to gamma exactly, so the object is a fixed point of the doubling operation and
      gamma is its eigenvalue. Curvature in the log-log fit means the doubling operation is not acting
      linearly on the log divergence, which is the observable signature that no single transfer law
      exists.
    survival_score: 'The object survives while divergence stays above the estimator noise floor and
      below saturation. Concretely: at 16 bits the divergence is measurable from dimension 4 to at
      least 64 with 10^5 signatures per cell; at 24 bits it is expected to fall under the noise floor
      somewhere between 4 and 16, and that crossover is reported rather than pushed past. The upper
      limit is compute: at dimension 128 the sampler still runs but the controlled-profile basis construction
      becomes the bottleneck. The honest survival range is dimension 4 to 64, a factor of 16, at precisions
      16 to 20.'
  null_object_control: The null arm sweeps dimension with the sampler at reference precision 53 in
    every role, through the identical pipeline and log-log fit. The null must show divergence indistinguishable
    from the estimator noise floor at every dimension and a fitted gamma whose confidence interval
    contains no meaningful value, that is a fit that fails rather than one that succeeds with a small
    number. If the null returns a clean nonzero gamma, the pipeline is manufacturing a dimension trend
    out of estimator behaviour and every signal reading is void. The two injected-error arms, common-mode
    and independent, serve as bracketing positive controls at 2.0 and 0.5.
  discriminated_from:
  - H-FNDSA-6a9cbb reaches the deployed value by closed-form derivation and uses toy runs only to
    check the law's shape. This measures the transfer exponent empirically and, unlike a derivation,
    can detect that no single exponent exists.
  - IDEA-20260808-e7ba81 gives the dimension dependence of the DETECTION THRESHOLD from random-matrix
    theory. That is how many samples are needed to see a fixed deviation; this is how large the deviation
    is at fixed precision. The two multiply rather than duplicate.
  - IDEA-20260813-aaf02e's interval budget implicitly contains a dimension law as an upper bound.
    An upper bound on divergence bounds gamma only if the bound is tight at every dimension, which
    is not known.
  - The enumeration entry in this batch is confined to dimensions at most 8 and cannot see a dimension
    law at all; this entry uses a sampled statistic precisely to buy dimension reach at the cost of
    exactness.
  - The three-role ablation entry in this batch measures a growth exponent in the number of SIGNATURES.
    This measures one in DIMENSION. Both are exponents and neither determines the other.
  assumptions:
  - Toy bases at each dimension can be constructed with a controlled Gram-Schmidt norm profile so
    per-leaf width is held fixed while dimension varies. If this fails, gamma is confounded with conditioning
    and the experiment measures nothing.
  - The frozen divergence statistic is comparable across dimensions, meaning it is normalized so its
    exact-arithmetic expectation does not itself scale with dimension in a way that imitates gamma.
  - Divergence at the chosen precisions stays above the estimator noise floor across the tested dimension
    range, checked cell by cell against the null.
  - Toy bases are constructed in-run and are not claimed to be FN-DSA keys; no deployed key property
    is imported.
  - A single power law is the right functional form to fit; this is tested through the residual pattern
    rather than assumed, and a failed fit is a reportable outcome.
  predictions:
  - metric: fitted gamma in the common-mode injected-error control arm
    direction: higher
    minimum_effect: 2.0, forced by coherent addition before squaring, tolerance plus or minus 0.25
  - metric: fitted gamma in the independent injected-error control arm
    direction: lower
    minimum_effect: 0.5, forced by quadrature addition, tolerance plus or minus 0.25
  - metric: fitted gamma in the signal arm at 16 bits
    direction: different
    minimum_effect: 'no pre-committed value. Refusal reason: gamma in the signal arm is the unknown
      the experiment exists to measure, and the two control arms exist precisely so that any value
      between 0.5 and 2.0 is interpretable without a prior guess.'
  - metric: curvature of the log divergence against log dimension fit, measured as the coefficient
      of a quadratic term
    direction: different
    minimum_effect: consistent with zero within its confidence interval, otherwise no single transfer
      law exists and that is the reported finding
  - metric: stability of fitted gamma across the three precisions 16, 20 and 24
    direction: different
    minimum_effect: the three fitted values agree within 0.25, otherwise gamma depends on precision
      and the two-variable law is not separable
  minimal_test:
    design: The cheapest discriminating measurement runs only the two bracketing control arms and
      one signal arm, at three dimensions rather than five. Fix 16 bits and a constant width target.
      Build bases at dimensions 4, 16 and 64, spanning a factor of 16 so the three candidate gammas
      predict divergence ratios of 4, 16 and 256, separable with 10^4 signatures per cell. Run the
      common-mode injected control, the independent injected control, the signal arm and the all-53
      null in the same invocation. If the two injected arms do not come out near 2.0 and 0.5, the
      instrument cannot read gamma and nothing else in the design is worth running. If they do, the
      signal arm's gamma is already located to within about 0.3 from three points, which is enough
      to decide whether the full five-dimension, three-precision grid earns its compute.
    controls:
    - All-53 null arm swept across the same dimensions, must show divergence at the noise floor and
      a failed rather than a clean gamma fit.
    - Common-mode injected-error positive control, identical error at every leaf, must fit gamma near
      2.0.
    - Independent injected-error positive control, fresh error at every leaf, must fit gamma near
      0.5.
    - 'Conditioning control: at each dimension report the Gram-Schmidt norm spread and confirm it
      is held within a frozen tolerance across the sweep.'
    - 'Statistic-normalization control: verify the exact-arithmetic expectation of the frozen statistic
      is dimension-independent by construction, computed in exact arithmetic at each dimension.'
    required_metrics:
    - divergence of the frozen statistic from its exact expectation at each cell, with confidence
      interval
    - fitted gamma with confidence interval at each precision
    - quadratic curvature coefficient of the log-log fit with confidence interval
    - Gram-Schmidt norm spread at each dimension
    - estimator noise floor from the all-53 null at each dimension
    - fitted gamma in each of the two injected-error control arms
  falsification_conditions:
  - The two injected-error control arms fail to separate, or either misses its forced gamma by more
    than 0.25, voiding the instrument.
  - The all-53 null returns a clean nonzero gamma, proving the pipeline manufactures dimension trends.
  - The Gram-Schmidt norm spread drifts outside its frozen tolerance across dimensions, confounding
    gamma with conditioning.
  - The quadratic curvature coefficient is significantly nonzero, falsifying the single-power-law
    premise, which is reported as the finding.
  - Fitted gamma differs by more than 0.25 across the three precisions, falsifying separability of
    the precision and dimension dependences.
  - Divergence falls below the noise floor at dimension 4 for every tested precision, meaning the
    accessible window is empty.
  confounders:
  - Basis conditioning drifting with dimension, the dominant confounder and the reason the norm-profile
    control is mandatory rather than optional.
  - A statistic whose exact-arithmetic expectation itself scales with dimension, producing an apparent
    gamma with no error content.
  - Saturation at low precision, where divergence approaches its maximum and the log-log slope flattens
    for reasons unrelated to correlation structure.
  - An estimator noise floor that itself depends on dimension, imitating or masking a trend.
  - Tree depth changing by one at each doubling, so dimension and depth cannot be separated within
    this design; the record states this as a genuine limitation rather than a solved problem.
  interpretation_limits:
  - A gamma measured over dimensions 4 to 64 is a statement about that range only. This record performs
    no extrapolation and reports no deployed-dimension number.
  - Tree depth and dimension are perfectly confounded in this design, so gamma is the exponent of
    the joint variation and cannot be attributed to dimension alone.
  - The measured gamma is specific to the toy implementation, the emulator and the frozen statistic,
    and its prefactor transfers to nothing.
  - A stable gamma over the tested range is evidence that a single law describes that range; it is
    not evidence the law continues beyond it, and the contract contains no step that would make it
    so.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: linear in signatures per
      cell and roughly linear-times-logarithmic in dimension per signature, so the full grid is dominated
      by the largest dimension cell.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is linear in dimension
      per signature with streaming accumulation.
    best_known: Inside this repository the incumbent transfer strategy is the closed-form derivation
      of H-FNDSA-6a9cbb, which reaches deployed parameters analytically rather than by extrapolation,
      together with the dimension-dependent detection threshold of IDEA-20260808-e7ba81. No claim
      is made about anything outside this repository.
    hidden_overhead: 'Constructing toy bases at five dimensions with a genuinely controlled Gram-Schmidt
      norm profile is most of the work and most of the risk, and it is invisible in the deliverable:
      the reported gamma looks like one number and its validity rests entirely on a basis-construction
      routine whose tolerance is easy to state and hard to achieve. The lower-order term that will
      bite is tree depth, which changes with dimension and cannot be held fixed at all.'
  dominated_by: 'n/a (no attack result claimed). Pareto check on instrument axes: against the closed-form
    derivation route of H-FNDSA-6a9cbb, dominated on cost since a derivation costs nothing, dominating
    on falsifiability since a derivation cannot detect that its own assumed law fails. Against the
    enumeration entry, dominated on exactness, dominating on dimension reach by a factor of eight.
    Against interval bounding, dominated on compute, dominating on tightness. No attack frontier is
    engaged and no frontier row is claimed to be beaten.'
  sota_delta: 'No attack; conceptual and measurement contribution only. The quantitative comparison
    is between candidate transfer exponents rather than against an attack baseline: at the ratio of
    dimension 1024 to 64, the three candidate gammas of 0.5, 1.0 and 2.0 predict divergence ratios
    of 4, 16 and 256, a spread of 64 times, which is the size of the error any silent extrapolation
    in this goal currently risks carrying.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Separate parts. That the two injected-error control arms cleanly bracket
    at 2.0 and 0.5: about 0.8, since both are forced by simple addition arguments. That toy bases
    with a controlled norm profile can be built across a factor of 16 in dimension: about 0.5, the
    part most likely to sink the experiment. That a single gamma fits the signal arm with no significant
    curvature: about 0.45, genuinely uncertain. That the result changes how the rest of this goal
    writes about toy-to-deployed transfer: about 0.6 if the fit succeeds and higher if it fails, because
    a failed fit is the stronger constraint.'
