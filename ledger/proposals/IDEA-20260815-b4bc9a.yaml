idea:
  id: IDEA-20260815-b4bc9a
  question_id: RQ-CSIDH-64343f
  added: '2026-08-15'
  title: >-
    CSIDH's SECURITY ARGUMENT ASSUMES THE CLASS-GROUP ACTION IS FREE AND
    TRANSITIVE ON THE SUPERSINGULAR SET: verify that at every proposed
    parameter set rather than at the one where it was first checked
  class: control

  claim: >-
    The group-action framing that makes CSIDH analysable requires the class
    group to act freely and transitively on the set of supersingular curves
    with the given endomorphism ring. That is a theorem under stated
    hypotheses, and whether every proposed parameter set satisfies those
    hypotheses is a per-parameter check that is cheap and is usually assumed
    rather than performed.

  mechanism: >-
    For each proposed parameter set, verify the hypotheses: the endomorphism
    ring is the expected order, the class number matches the enumerated
    orbit size, and the action has no fixed points. Report per-parameter
    verification.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-CSIDH-001; grep 'free and transitive', 'group action',
      'class number' co-occurrence with parameter sets.
    results: >-
      The group-action framing is used throughout the CSIDH analysis; no
      record verifies its hypotheses per proposed parameter set.
    verdict: >-
      ADAPTATION. The theorem and its hypotheses are published; the
      contribution is per-parameter verification rather than inheritance
      from the original setting.

  object_first_candidate:
    tracked_object: >-
      THE ACTION'S FREENESS AND TRANSITIVITY at each proposed parameter
      set.
    lossiness: >-
      Reducing the action to two properties discards its structure, which
      is exactly what the security analysis does and why the properties
      must hold.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy parameters where the orbit is enumerable; at
      proposed cryptographic parameters the orbit is far too large and
      only the hypotheses can be checked, not the orbit itself.

  null_object_control: >-
    NULL 1 -- a parameter set where the hypotheses are known to hold, which
    must verify. NULL 2 -- a deliberately broken parameter set (wrong order,
    or a discriminant with extra automorphisms), which must fail; a check
    that passes everything verifies nothing.

  discriminated_from:
    - >-
        The CSIDH cost-model reconstruction in this series, which
        reconciles quantum cost estimates; this verifies the structural
        premise those estimates all assume.
    - >-
        The oracle-cost measurement in this series, which measures the
        action's evaluation cost; this checks the action is the object the
        analysis thinks it is.

  assumptions:
    - >-
        Orbit enumeration is feasible at toy parameters, so the
        transitivity check is a real check there rather than a
        restatement.
    - >-
        At proposed parameters only the hypotheses are checkable, not the
        orbit; the record must say clearly which parameter sets got which
        level of verification.

  predictions:
    - metric: >-
        known-good parameter null
      direction: different
      minimum_effect: >-
        FORCED verified.
    - metric: >-
        deliberately broken parameter null
      direction: different
      minimum_effect: >-
        FORCED to fail; a check passing this verifies nothing.
    - metric: >-
        verification level achieved per proposed parameter set
      direction: different
      minimum_effect: >-
        The deliverable, stating explicitly which sets got orbit
        enumeration and which only hypothesis checking.

  minimal_test:
    design: >-
      Toy parameters with full orbit enumeration, plus hypothesis checks
      at one proposed set, both nulls.
    controls:
      - >-
          Known-good and deliberately broken parameter nulls.
      - >-
          Orbit size checked against the independently computed class
          number where enumeration is feasible.
      - >-
          Verification level recorded per parameter set, never
          conflated.
    required_metrics:
      - >-
          Verification outcome and level per parameter set.
      - >-
          Orbit size against class number where enumerable.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The broken-parameter null verifies. The check is vacuous.
    - >-
        A proposed parameter set fails a hypothesis. The group-action
        framing does not apply there and its security analysis needs
        revisiting, which would be a significant finding.
    - >-
        All sets verify at the level achievable. The framing's premise is
        confirmed rather than assumed, which is cheap and worth having.
    - >-
        Orbit enumeration is infeasible even at toy parameters.
        Transitivity cannot be checked directly anywhere and the record
        must say so.

  confounders:
    - >-
        VERIFICATION-LEVEL CONFLATION: hypothesis checking is much weaker
        than orbit enumeration, and reporting both as verified would
        overstate what was done.
    - >-
        INHERITED HYPOTHESES: a parameter set may satisfy the hypotheses
        of a theorem whose applicability depends on further conditions
        nobody enumerated.

  interpretation_limits:
    - >-
        Verifies a structural premise; makes no security claim about
        CSIDH.
    - >-
        Scoped to the checked parameter sets and the verification level
        achieved at each.
    - >-
        Hypothesis checking is not orbit verification and the two are
        reported separately.

  heuristic_assumptions:
    - id: HEUR-CSIDH-ACT-1
      statement: >-
        Verifying the stated hypotheses at a parameter set implies the
        class-group action is free and transitive there.
      rigorous_support: >-
        Rigorous ingredient: the theorem that the class group acts
        freely and transitively on the set of curves with a given
        endomorphism ring, under the stated hypotheses, which is
        classical Deuring theory. THE GAP: the theorem's hypotheses
        include conditions on the base field and on the orientation that
        are easy to state and easy to check incompletely, and a
        partially checked hypothesis set gives no guarantee at all.
      falsification_condition: >-
        A parameter set satisfying the checked hypotheses where orbit
        enumeration nonetheless shows non-transitivity.
      validation_plan: >-
        SAMPLE: all toy parameter sets with enumerable orbits, plus
        hypothesis checks at proposed sets. COMPARISON: hypothesis
        verdict against orbit enumeration wherever both are available.
        TAIL CHECK: any disagreement between the two, which would
        indicate an incompletely checked hypothesis. TRANSFER:
        hypothesis checking alone does not transfer and is labelled as
        the weaker level.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is orbit enumeration at toy parameters plus
      hypothesis checks elsewhere.
    memory_exponent: >-
      Orbit storage at toy parameters; negligible.
    best_known: >-
      The incumbent is the published Deuring-theoretic result underpinning
      the group-action framing, used here and not improved.
    hidden_overhead: >-
      Orbit enumeration is infeasible at proposed parameters, so the
      strongest check is available only where it matters least.
    tradeoff_note: >-
      Orbit enumeration gives certainty at toy scale; hypothesis checking
      gives coverage at proposed scale. Both are done and reported
      separately.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As theory: dominated by classical Deuring
    theory, which is the source. As per-parameter verification in this
    program: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: per-parameter verification of
    the freeness and transitivity premise every CSIDH security analysis
    assumes, with the verification level stated explicitly so orbit
    enumeration and hypothesis checking are never conflated.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that toy orbits are enumerable. 0.9 that the nulls behave. 0.05
    that a proposed parameter set fails a hypothesis, which would be a
    significant finding and is why the check is worth its small cost.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
