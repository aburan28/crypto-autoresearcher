  heuristic_assumptions:
    - id: HEUR-MSI-P1
      statement: >-
        FOR ALL (N, l, d', m) in the tested grid, the truncated period map
        restricted to the short set behaves, with respect to collision counts,
        like a uniformly random map into (Z/l^m Z)^{d'} of the same image size --
        that is, the number of colliding pairs among K enumerated short classes
        is (1 + o(1)) K^2 / (2 l^{m r'}) with r' the rank of the released block.
      rigorous_support: >-
        The rigorous ingredient is that the map is a homomorphism with kernel of
        index l^{m r'} (IDEA-20260811-4a55dd claim L1 plus the elementary divisor
        computation), which makes the fibres EXACTLY equal in size -- so the
        collision count is determined by how the short set distributes over
        fibres. The classical distribution statement being imitated is the
        birthday model for a uniformly random assignment of K balls to l^{m r'}
        equal bins. THE ASSUMPTION IS THAT THE SHORT SET IS SPREAD OVER FIBRES AS
        A UNIFORM ASSIGNMENT WOULD SPREAD IT, WHICH IS EXACTLY WHAT A LATTICE
        SHORT SET DOES NOT DO IN GENERAL -- short vectors cluster in the fibre of
        0 -- and the measured excess is therefore expected to be positive. Its
        SIZE is the measurement.
      falsification_condition: >-
        Collision excess over the birthday prediction exceeding 3 standard
        deviations in a majority of cells, or, in the other direction, a deficit,
        which would be harder to explain and would indicate an implementation
        error.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of the short set at N in {11, 17, 19, 23,
        37}, l in {2, 3, 5}, all m in 1..12, all d' in 1..d -- of order 10^3
        cells with short sets of size up to about 10^6, minutes to hours per
        cell. SHORTCUT USED TO REACH SCALE: none; exhaustion is the point, and no
        sampling estimate is accepted for this quantity. COMPARISON DISTRIBUTION:
        the birthday count K^2 / (2 l^{m r'}) with its binomial error bars, and
        separately the empirical collision curve of the random linear encoder
        null at identical shape. TAIL CHECK: report the 20 largest fibres
        observed, since the largest fibre and not the average is what an
        adversary would find first. TRANSFER ASSUMPTION, STATED: none is offered
        beyond the enumerated grid; the clustering of short vectors near 0 is
        expected to grow with n, so the toy excess is a LOWER bound on the excess
        at larger n, and even that direction is an argument rather than a bound.
    - id: HEUR-MSI-P2
      statement: >-
        The empirical entropy of the instance generator equals log_2 h(O) to
        within one bit, i.e. the attaching map hits the O-oriented set
        essentially uniformly and injectively.
      rigorous_support: >-
        Rigorous ingredient: Cl(O) acts freely and transitively on the
        primitively O-oriented set, so the target set's SIZE is exactly h(O). The
        classical statement being imitated is the rapid mixing of isogeny-graph
        random walks used for re-randomisation throughout this literature
        (KN-TECH-027 setting). This assumption is shared with HEUR-MSI-R2 of
        IDEA-20260811-55932a and should be validated once and cited twice.
      falsification_condition: >-
        Measured empirical entropy more than one bit below log_2 h(O), which
        would mean the generator concentrates and every redundancy figure is
        understated.
      validation_plan: >-
        SAMPLE: 10^4 instances per cell at h(O) between 20 and 200, at least 10
        cells. COMPARISON: empirical Shannon entropy of the class distribution
        against log_2 h(O), and a chi-squared uniformity test. TAIL CHECK: the
        three most frequent classes and their excess over 1/h(O). TRANSFER: toy
        p only; at cryptographic p the enumeration that makes this measurable
        does not exist and the assumption is carried untested, which is recorded
        rather than hidden.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED BY THIS RECORD AND THAT IS STATED RATHER THAN
      OMITTED. This is a measurement and a counting derivation; it proposes no
      algorithm and improves nothing. The exponents it CONSUMES are
      IDEA-20260811-4a55dd's -- poly(n, m log l) for LLL plus Babai and
      2^{Theta(n/log n)} for BKZ at dimension n ~ N/6 -- and the exponents it
      PRODUCES are counting exponents rather than cost exponents: published bits
      d' m log_2 l against secret entropy at most (1/2) log_2 |disc O| and at most
      log_2 p - log_2 12, giving redundancy R > 1 at m = 1 once
      N > 12 H_sec / log_2 l.
    memory_exponent: >-
      Exhaustive enumeration of the short set dominates and costs memory linear
      in its size, up to about 10^6 vectors of n small integers at the toy grid --
      megabytes. No memory claim of any consequence.
    best_known: >-
      For MSI: none published. For the QUESTION this record answers -- the
      safe-publication boundary of an isogeny-side assumption -- there is no
      known baseline for ANY assumption: KN-OPEN-015's own text records that a
      general characterisation of which auxiliary data is fatal "is not settled",
      and that the dividing line is understood only for the specific SIDH attack.
      No exponent is claimed against these because none of them is a cost.
    hidden_overhead: >-
      The counting identity hides the fact that all three entropy bounds are
      UPPER bounds, so R is a lower bound on the true redundancy -- the record is
      conservative in the direction that favours MSI, which is the correct
      direction for a record that might otherwise be read as an attack. The
      measurement hides the exhaustion cost, which grows like the short set and
      caps the grid at small N.
    tradeoff_note: >-
      The relevant tradeoff is not time against memory but PUBLICATION against
      FUNCTIONALITY: reducing d' m below B* is the only lever a construction has,
      and reducing it below m_inj destroys uniqueness of decoding, so the usable
      band is m_inj <= d' m log_2 l < B*. Measuring both ends of that band is the
      record's deliverable, and if the band is empty at some (N, l, S) that is a
      complete answer for those parameters.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW. As an attack: none is proposed, so it is
    dominated on time, memory and data by every row of every baseline --
    Delfs-Galbraith p^{1/2}(log p)^{O(1)}, Wesolowski p^{1/3+o(1)} conditional,
    meet-in-the-middle vectorization at sqrt(h(O)), Kuperberg quantumly, LLL and
    BKZ on the lattice side, and IDEA-20260811-4a55dd's own pipeline which this
    record calls as a subroutine and does not improve. As a MEASUREMENT there is
    no incumbent to be dominated by, because no safe-publication boundary exists
    in this corpus for any assumption; that absence is checked against
    KN-OPEN-015's own statement that the characterisation is unsettled, and is
    the reason this field is not null.
  sota_delta: >-
    Zero speedup, no algorithm, on every axis. QUANTITATIVE CONTENT DELIVERED:
    the closed-form redundancy R = d' m log_2 l / H_sec with all three entropy
    bounds evaluated; the derived threshold N > 12 H_sec / log_2 l at which even
    m = 1 over-determines, and the observation that it COLLIDES with the lattice
    dimension requirement so that the two cannot be satisfied at once; the
    forced-value lemma that Hecke compatibility yields exactly zero additional
    constraints, with its geometric consequence handed to
    IDEA-20260811-0f89a9; a pre-registered decision rule separating informational
    from geometric control of invertibility; and the first safe-publication
    boundary B* computed for any assumption in this program.

