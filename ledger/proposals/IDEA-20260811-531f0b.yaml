idea:
  id: IDEA-20260811-531f0b
  question_id: RQ-MSI-f760b2
  added: '2026-08-11'
  title: >-
    THE PUBLICATION BUDGET OF MSI, AND A TWO-LINE LEMMA THAT KILLS THE NAIVE SIDH
    ANALOGY: the truncated period vector publishes d m log_2 l bits about a
    secret carrying at most log_2 h(O) <= log_2 #SS(p) bits, so the redundancy
    R = d m log_2 l / H_sec exceeds 1 ALREADY AT m = 1 whenever
    N > 12 log_2 p / log_2 l -- over-publication is MSI's default regime, not its
    edge case -- while Hecke COMPATIBILITY, read correctly as an intertwining,
    supplies the adversary with NO additional constraint at all, because
    A T_q x = T_q* A x holds on the entire coset; the real consequence of Hecke
    compatibility is that ker(A) is a Hecke SUBMODULE, which is a geometric gift
    and not an informational one
  class: measurement

  claim: >-
    (A) WHY THIS IS THE KN-OPEN-015 QUESTION AND NOT A REPHRASING OF IT.
    KN-OPEN-015 records the SIDH lesson as a question about auxiliary structure:
    for which assumptions does revealed auxiliary information about a secret map
    collapse the assumption, and which are safe. Its recorded dividing line is
    "publishes images of points under the secret isogeny at known degree", and
    its recorded survivors -- CGL, CSIDH, SQIsign -- survive because they publish
    no such images. MSI publishes SOMETHING: a vector in (Z/l^m Z)^d derived from
    the secret. The operational question is therefore not "is MSI like SIDH" but
    HOW MUCH IS PUBLISHED, MEASURED AGAINST HOW MUCH THE SECRET CONTAINS, AND AT
    WHICH m DOES THE FORMER EXCEED THE LATTER. That is a counting question with a
    closed-form answer, and this record computes it and then measures whether the
    count is what actually controls invertibility.

    (B) THE COUNTING IDENTITY, AND THE PARAMETER THRESHOLD IT PRODUCES. Published
    bits: B_pub(d', m) = d' m log_2 l, where d' <= d is the number of period
    coordinates actually released. Secret entropy: the secret is an instance of
    the attaching map, so
      H_sec <= log_2 (number of O-oriented supersingular curves) = log_2 h(O),
    and independently H_sec <= log_2 #SS(p) = log_2(p/12) + O(1), and
    independently H_sec <= log_2 #{x in M : ||x|| <= S}. THE BINDING BOUND IS THE
    SMALLEST OF THE THREE and for the oriented setting it is normally log_2 h(O),
    which under Siegel is about (1/2) log_2 |disc O| and is at most about
    (1/2) log_2 p for orders embeddable in a supersingular endomorphism ring.
    Define the REDUNDANCY R(d', m) = B_pub / H_sec. Then:
      R(d, 1) > 1  <==>  d log_2 l > H_sec,
    and with d = dim S_2(Gamma_0(N)) = genus of X_0(N) ~ N/12 for prime N, this
    reads
      N  >  12 H_sec / log_2 l  ~  12 log_2 p / log_2 l  for the crude bound,
    i.e. for l = 2 and log_2 p = 256, N greater than about 3000 makes even
    m = 1 over-determining. AND IDEA-20260811-4a55dd's OWN SECURITY ARGUMENT
    DEMANDS N OF EXACTLY THAT SIZE OR LARGER, since the lattice dimension is
    n ~ N/6 and must reach several hundred. THE TWO REQUIREMENTS COLLIDE: the N
    that makes the lattice hard is the N at which a single period coordinate
    vector already over-determines the secret many times over. That collision is
    this record's headline and it is derived, not measured.

    (C) THE TWO-LINE LEMMA THAT REMOVES THE NAIVE SIDH FEAR, STATED BECAUSE IT IS
    THE OBVIOUS WORRY AND IT IS WRONG. The abstract says the attachment is
    "compatible with the Hecke action". The natural fear, by analogy with
    published torsion images, is that an adversary holding v can apply Hecke
    operators to obtain further constraints on the secret for free. HE CANNOT.
    Compatibility, read as an intertwining -- there exists a computable T_q* on
    the codomain with A T_q = T_q* A -- gives, for any candidate preimage x with
    A x = v,
        A (T_q x) = T_q* A x = T_q* v,
    which holds for EVERY element of the coset x + ker(A) and therefore excludes
    nothing. THE EXTRA EQUATIONS ARE CONSEQUENCES OF THE ORIGINAL ONE, NOT
    ADDITIONS TO IT. This is elementary and it is exactly the kind of claim that
    would otherwise be assumed in the wrong direction and cost the program a
    batch. WHAT COMPATIBILITY ACTUALLY BUYS THE ADVERSARY IS DIFFERENT AND
    STRICTLY GEOMETRIC: A T_q = T_q* A forces ker(A) to be stable under T_q, so
    the MSI lattice is a module over the Hecke algebra rather than a generic
    lattice. That is a gift, but it is a gift to lattice reduction, and it is
    handed to IDEA-20260811-0f89a9, which is built to receive it.

    (D) THE DISCRIMINATING EXPERIMENT, WHICH SEPARATES TWO MECHANISMS THAT ARE
    NORMALLY CONFLATED. Two candidate explanations of MSI invertibility:
      MECHANISM I (INFORMATIONAL): invertibility is controlled by the redundancy
      R = d' m log_2 l / H_sec -- how many bits are published relative to the
      secret -- and the split of the product d' m between coordinates and
      precision is irrelevant.
      MECHANISM II (GEOMETRIC): invertibility is controlled by the lattice gap
      gamma = sqrt(n/(2 pi e)) l^{m r/n} / S, in which d' and m enter DIFFERENTLY
      -- m enters through the modulus and d' through the rank r -- so the split
      matters at fixed product.
    THESE MAKE OPPOSITE PREDICTIONS UNDER A 2-FACTOR DESIGN AT FIXED d' m: hold
    the product constant and vary the split, e.g. (d', m) = (1, 12), (2, 6),
    (3, 4), (4, 3), (6, 2), (12, 1). Mechanism I predicts a FLAT recovery rate
    along that curve; Mechanism II predicts a monotone trend, because
    det(L) = l^{m r} depends on m and r = min(d', ...) separately and the
    exponent m r / n is not a function of the product alone once r saturates.
    ONE FACTORIAL SWEEP DECIDES WHICH VARIABLE IS THE REAL ONE, and either answer
    is decision-relevant: Mechanism I confirms the KN-OPEN-015 lens is the right
    one and gives a construction designer a bit-budget rule; Mechanism II shows
    the bit budget is a red herring and hands the question to
    IDEA-20260811-4a55dd's geometry.

    (E) THE SAFE-PUBLICATION BOUNDARY, WHICH IS THE NUMBER A DESIGNER NEEDS. Let
    B*(N, l, S, p) be the smallest value of d' m log_2 l at which the measured
    exact-recovery rate first exceeds 0.5. B* is the operational form of
    KN-OPEN-015's dividing line for this assumption -- the answer to "how much of
    the period vector may be published" -- and no such number exists anywhere in
    this program's corpus for any assumption. Producing it for MSI is this
    record's concrete deliverable.

    (F) THE THREE THRESHOLDS AND THEIR PREDICTED ORDER. m*(informational): the
    smallest m with R >= 1. m_inj: the smallest m at which Per_m is injective on
    the short set, measured by exhaustive collision search. m_lat: the smallest m
    at which LLL plus Babai recovers exactly. PREDICTED ORDER
    m* <= m_inj << m_lat, with the last gap of order n^2 / (2 r log_2 l) in m
    because unique decodability needs only S below the packing radius while LLL
    needs S below 2^{-n/2} times it. IF THE MEASURED ORDER DIFFERS -- in
    particular if m_inj > m_lat, meaning the attack succeeds before the answer is
    even unique -- the pipeline is returning a WRONG short vector that happens to
    verify, and that is a correctness failure that must be caught before any
    other number is believed.

  mechanism: >-
    STAGE 0 (ZERO COMPUTE, HARD GATE, NOT PERFORMED IN THIS SESSION). From the
    paper body: the definition of d, whether releasing a subset of coordinates is
    meaningful in the paper's formulation, the shortness measure, and whether the
    secret is the oriented curve, the homology class, or the representative --
    THESE ARE THREE DIFFERENT SECRETS WITH THREE DIFFERENT ENTROPIES and the
    counting in (B) changes with the answer. This session read only the abstract;
    both web tools failed with a backend model error and no local PDF exists in
    this worktree.

    STAGE 1 (ZERO COMPUTE): write out the counting identity of (B) and the
    lemma of (C) in full, with the three entropy bounds evaluated at a table of
    (N, l, p, disc O) including at least one row at cryptographic size, and state
    the threshold N > 12 H_sec / log_2 l explicitly per row. THE COLLISION
    BETWEEN THIS THRESHOLD AND IDEA-20260811-4a55dd's DIMENSION REQUIREMENT IS
    THE DELIVERABLE AND IT COSTS NOTHING.

    STAGE 2 (INJECTIVITY BY EXHAUSTION): at toy (N, l), enumerate ALL homology
    classes with ||x|| <= S -- exhaustively, not by sampling -- compute Per_m for
    every m in 1..12 and every d' in 1..d, and count collisions exactly. Report
    m_inj(d') as a curve. Compare the collision counts against the birthday
    prediction under HEUR-MSI-P1; a systematic excess of collisions means the
    encoder is degenerate in a way the random model does not capture, which is a
    finding and is where IDEA-20260811-0f89a9's rank deficiency would show up
    first.

    STAGE 3 (THE 2-FACTOR SWEEP): the design of (D). For each (d', m) cell on the
    fixed-product curve, run the identical recovery pipeline on identical
    instances and record exact-recovery rate, together with the predicted
    redundancy R and the predicted gap gamma. Fit recovery rate against R alone,
    against gamma alone, and against both; report which single-variable model
    explains more variance and by how much. PRE-REGISTER THE DECISION RULE: if
    the R-only model explains within 5 percentage points of the two-variable
    model's variance, Mechanism I is adopted; if the gamma-only model does, so is
    Mechanism II; if neither, both are rejected and the record says so.

    STAGE 4 (SAFE-PUBLICATION BOUNDARY): compute B* per (N, l, S, p) cell and
    tabulate it, with the two nulls below attached to every row.

    STAGE 5 (ZERO COMPUTE): state the KN-OPEN-015 verdict in that record's own
    terms -- what MSI publishes, what it publishes about, at what redundancy, and
    where its dividing line sits relative to the recorded SIDH line and the
    recorded survivors.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus screen as in IDEA-20260811-4a55dd, plus reads of KN-OPEN-015,
      KN-OPEN-013, KN-TECH-027, and the RQ.
    results: >-
      KN-OPEN-015 poses the auxiliary-structure question and records the SIDH
      arc and the survivors, but contains NO quantitative publication budget and
      no threshold for any assumption -- its own text says a general
      characterisation "is not settled". No record in knowledge/ or ledger/
      contains a redundancy computation, a safe-publication boundary, or the
      Hecke-intertwining no-free-lunch lemma. The lemma itself is elementary
      linear algebra and is not claimed as new mathematics; it is claimed as a
      correction to an analogy this program would otherwise draw.
    verdict: >-
      UNVERIFIED. Corpus checked and empty; external literature NOT checked
      because this session's web tools failed. The counting is arithmetic that
      any reader could do, and the possibility that the source paper already does
      it is open and unchecked.

  object_first_candidate:
    tracked_object: >-
      NOT A NEW OBJECT, AND THE RECORD SAYS SO RATHER THAN DRESSING ONE UP. The
      quantity followed is the BIT BUDGET of the encoding -- the pair
      (published bits, secret entropy) -- which is a property of the projection
      IDEA-20260811-4a55dd defines and not an independent tracked object. Under
      docs/inventor-protocol.md section 2 a bit count is not a lossy projection
      of the state at all; it is a measurement of one. This record is therefore
      classed `measurement` and makes no object-first claim.
    lossiness: >-
      Not applicable to a bit count. The lossiness question belongs to the
      projection being measured and is answered in IDEA-20260811-4a55dd's
      object_first_candidate block. The one genuinely projection-like statement
      here is the lemma of claim (C): Hecke compatibility does NOT enlarge the
      information content of the observation, so the observation's fibre is
      unchanged by the Hecke action -- an assertion ABOUT the projection, which
      is what a measurement record should produce.
    propagation: not_applicable
    survival_score: not_applicable

  null_object_control: >-
    NULL 1 (RANDOM LINEAR ENCODER): replace A by a uniformly random d-by-n matrix
    over Z/l^m Z and repeat Stages 2, 3 and 4 in full. The collision curve, the
    2-factor surface and B* must all be recomputed on it. IF THE RANDOM ENCODER
    REPRODUCES THE MEASURED CURVES WITHIN NOISE, THEN NOTHING ABOUT MODULAR
    SYMBOLS IS BEING MEASURED and every conclusion is a conclusion about random
    linear codes over Z/l^m Z -- which is an honest, publishable, and quite
    likely outcome that the record pre-commits to reporting as such.
    NULL 2 (RANDOM NON-LINEAR ENCODER): a random function from the short set to
    (Z/l^m Z)^{d'} with no structure. Its collision curve is the pure birthday
    curve and is the reference against which any structural excess in the real
    encoder is measured.
    NULL 3 (SHUFFLED SECRETS): permute the instance-to-vector pairing. Recovery
    must collapse to chance at every (d', m).
    DECAY CONTROL: the parameter that should destroy recoverability is DECREASING
    d' m. Recovery rate must fall monotonically as d' m falls. A recovery rate
    that stays high as the published budget shrinks toward H_sec is the artifact
    signature of docs/inventor-protocol.md section 3 -- the harness is leaking
    the answer through the instance generator -- and it halts the run.

  discriminated_from:
    - >-
      H-MOD-e9d87e (zero-bit closure). NOT CAUGHT. That closure counts bits too,
      which makes the separation worth stating carefully: it concerns
      diamond-invariant functions of a SINGLE point of a SINGLE X_1(N) fibre for a
      rational ECDLP instance, and its zero-bit conclusion follows from freeness
      and transitivity of the diamond action on that fibre. This record counts
      bits of a period vector attached to an O-oriented supersingular curve over
      F_{p^2}, in the relative homology of X_0(N), under the Hecke action, with
      no fibre, no diamond operator, no rational instance and no scalar k. The
      two records share only the verb "count".
    - >-
      DEC-20260810-2c7e3c (closed CM canonical-lift lane). NOT THAT LANE: nothing
      is lifted, no point has a canonical height, and the l-adic analysis lives on
      the modular curve rather than on any ECDLP instance curve. Stated because
      the decision requires it stated.
    - >-
      KN-TECH-3b593f: no prime-field ECDLP claim, no Smith subgroup, no Kani
      embedding, no torsion advice.
    - >-
      IDEA-20260811-4a55dd. Deliberately complementary and the 2-factor design
      exists precisely to adjudicate between the two records' variables. If
      Mechanism II wins, this record's own headline variable is demoted and it
      says so in advance -- a proposal that can lose to its sibling.
    - >-
      IDEA-20260811-0f89a9. The lemma of claim (C) hands that record its central
      hypothesis (ker A is a Hecke submodule) and explicitly declines to pursue
      it here. No overlap in what is measured.

  assumptions:
    - >-
      The secret whose entropy bounds the budget is the O-oriented curve, or
      equivalently its class. NOT VERIFIED -- if the secret is instead the
      representative itself, H_sec is the log of the short-set size and is much
      larger, and every number in (B) changes. Stage 0 decides.
    - >-
      d = dim S_2(Gamma_0(N)) = genus of X_0(N), and releasing a subset of d'
      coordinates is meaningful. INFERRED FROM THE ABSTRACT, NOT VERIFIED.
    - >-
      #SS(p) = p/12 + O(1). CLASSICAL (Eichler mass formula), RECALLED NOT READ;
      checkable exactly at toy p and Stage 2 does check it.
    - >-
      h(O) = |disc O|^{1/2+o(1)} where it is used, per HEUR-MSI-R1 of
      IDEA-20260811-55932a, with Siegel's ineffectivity inherited.
    - >-
      Hecke compatibility is an intertwining A T_q = T_q* A. IF IT IS INSTEAD THE
      WEAKER STATEMENT THAT THE IMAGE IS A HECKE SUBMODULE, the lemma of (C)
      still holds for the constraints but the submodule consequence needs
      restating. Stage 0 decides; this is the same ambiguity
      IDEA-20260811-55932a flags.

  proof_search_map:
    bottleneck: >-
      WHICH VARIABLE CONTROLS RECOVERABILITY -- the published bit budget or the
      lattice gap. Everything else in this record is arithmetic that can be done
      on paper. The 2-factor sweep at fixed product is the entire experimental
      content and it is designed so that the two candidate mechanisms cannot both
      survive it.
    baseline_embedding:
      parameter_slice: >-
        d' m log_2 l exactly equal to H_sec, i.e. R = 1 -- the information-
        theoretic boundary, where a random encoder is at the birthday threshold.
        The measured collision rate at that slice must reproduce the random
        encoder's to within the binomial error, or the encoder is not behaving
        like a random map and the deviation is the finding.
      reproduction_check: >-
        Frozen fixture: a named (N, l, d', m, S) cell with R = 1 within 1
        percent, its exact enumerated short set, its exact collision count, and
        the binomial prediction with its confidence interval. Exact integer
        counts, not a fitted curve.
    observation_collision:
      observable: >-
        The released prefix of the period vector, i.e. its first d' coordinates
        truncated to l^m.
      distinct_preimage_search: >-
        THE COLLISION SEARCH IS THE PRIMARY MEASUREMENT AND IT IS EXHAUSTIVE, NOT
        SAMPLED: enumerate the entire short set and bucket by observable. Every
        bucket of size at least 2 is a certified identifiability failure at that
        (d', m), and its two preimages are recorded verbatim. Empty buckets prove
        nothing about hardness and the record forbids that reading in advance.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure -- the published budget
          d' m log_2 l -- realised by the specialisation "release only d'
          coordinates to precision m", with charges added only over the
          proved-disjoint blocks given by distinct (d', m) cells run on identical
          instances.
        predicted_gain: >-
          The safe-publication boundary B*, a number that does not exist in this
          corpus for any assumption and which KN-OPEN-015 explicitly says is not
          settled in general.
      - transform: observable_fiber
        proposed_object: >-
          Hold the released prefix fixed and vary the unreleased coordinates and
          the unreleased precision; ask what intrinsic property of the oriented
          curve is thereby forgotten.
        predicted_gain: >-
          A characterisation of what the truncation discards in arithmetic terms
          rather than in bit counts, which is the qualitative half of the
          KN-OPEN-015 answer and is the record's most likely source of a genuine
          surprise.
    quantifier_order: >-
      THE MEASUREMENT CLAIM: FOR ALL (N, l, S, p) in the tested grid THERE EXISTS
      a threshold B*(N, l, S, p) such that FOR ALL (d', m) with
      d' m log_2 l < B* the measured recovery rate is below 0.5 and FOR ALL
      (d', m) above it the rate is above 0.5. THE TRAP, NAMED: the threshold is
      allowed to depend on the cell but NOT on the instance; a B* fitted per
      instance is meaningless. The run record must show B* fitted once per cell
      over all instances in that cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at the tested cells, the released budget required for
        50 percent recovery is B*, the encoder's collision statistics deviate
        from the random-encoder null by such-and-such, and the recovery surface
        is better explained by R or by gamma." It can NEVER certify a hardness
        claim, can never certify that publishing below B* is SAFE -- only that
        THIS attack fails there -- and cannot extrapolate B* beyond the grid.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL is a secret drawn from a
        set of entropy DELIBERATELY EXCEEDING the published budget by a large
        factor, constructed by widening S. Recovery must then be impossible for
        information-theoretic reasons alone, at every algorithm. A pipeline that
        still recovers there is leaking through its instance generator, and the
        whole run is void. THIS COSTS ALMOST NOTHING AND IT IS THE SHARPEST CHECK
        THE RECORD HAS.
    proof_obligations:
      - claim: "B_pub = d' m log_2 l and H_sec <= min(log_2 h(O), log_2 #SS(p), log_2 #short set)."
        responsibility: size
      - claim: R(d, 1) > 1 whenever N > 12 H_sec / log_2 l for prime N.
        responsibility: size
      - claim: A T_q = T_q* A implies the Hecke-derived equations hold on the whole coset.
        responsibility: correctness
      - claim: A T_q = T_q* A implies ker(A) is T_q-stable.
        responsibility: correctness
      - claim: collision counts at R = 1 match the birthday prediction.
        responsibility: baseline
      - claim: the fixed-product sweep separates Mechanism I from Mechanism II.
        responsibility: feasibility
      - claim: B* is fitted per cell and never per instance.
        responsibility: interface
      - claim: all thresholds are scoped to the tested grid.
        responsibility: scope

  predictions:
    - metric: >-
        redundancy R = d' m log_2 l / H_sec at the parameters
        IDEA-20260811-4a55dd's lattice-security argument requires
      direction: higher
      minimum_effect: >-
        PREDICTED GREATER THAN 1 ALREADY AT m = 1 whenever N exceeds
        12 H_sec / log_2 l -- about 3000 for l = 2 and log_2 p = 256. This is a
        derivation, not a measurement, and it is falsified only by a different
        value of d or a different secret than Stage 0 finds.
    - metric: >-
        number of collisions in the exhaustively enumerated short set at each
        (d', m), against the birthday prediction
      direction: different
      minimum_effect: >-
        Predicted to MATCH the random-encoder null within binomial error at
        R near 1. An excess of at least 3 standard deviations, reproducible
        across cells, is structural degeneracy in the encoder and is the finding
        that hands the question to IDEA-20260811-0f89a9.
    - metric: >-
        variance in recovery rate explained by R alone versus by gamma alone,
        along the fixed-product curve
      direction: different
      minimum_effect: >-
        No direction is predicted; the decision rule is pre-registered in
        Stage 3. A difference of at least 5 percentage points in explained
        variance selects a mechanism; less than that rejects both single-variable
        models and the record reports that MSI's invertibility is not controlled
        by either variable alone, which is itself informative.
    - metric: >-
        Hecke-augmentation gain -- reduction in the recovery threshold B* when
        the adversary additionally uses the equations A T_q x = T_q* v
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY ZERO, by the lemma of claim (C). This is a
        forced-value prediction and it is the cheapest correctness check in the
        record: a measured gain means either the implementation is wrong or the
        compatibility is not an intertwining, and either diagnosis is worth more
        than the measurement.
    - metric: >-
        safe-publication boundary B* per (N, l, S, p) cell
      direction: different
      minimum_effect: >-
        Reported as a table with its fit and its confidence interval. Predicted
        to lie ABOVE H_sec by a factor growing with n, because Mechanism II
        predicts that unique determination is far cheaper than recovery.
    - metric: >-
        wide-S information-theoretic control -- recovery rate when H_sec exceeds
        the published budget by a factor of 4
      direction: lower
      minimum_effect: >-
        PREDICTED 0. Any success voids the run.

  minimal_test:
    design: >-
      STAGE 0 (hard gate, zero compute): paper body; decide what the secret is.
      STAGE 1 (zero compute): the counting table of (B) and the lemma of (C),
      including a cryptographic-size row, delivered as a derivation artifact.
      STAGE 2 (hours): exhaustive collision enumeration over the short set at
      N in {11, 17, 19, 23, 37}, l in {2, 3, 5}, m in 1..12, d' in 1..d, with the
      two encoder nulls.
      STAGE 3 (hours to a day): the fixed-product 2-factor sweep with the
      pre-registered decision rule.
      STAGE 4 (hours): B* per cell, with the wide-S control and the shuffled
      null.
      STAGE 5 (zero compute): the KN-OPEN-015 verdict in that record's terms.
    controls:
      - Random linear encoder of matched shape (Null 1) on every stage.
      - Random unstructured encoder as the pure birthday reference (Null 2).
      - Shuffled instance-to-vector pairing (Null 3).
      - Wide-S information-theoretic control, which must defeat every algorithm.
      - Frozen R = 1 fixture with exact integer collision counts.
      - Hecke-augmentation arm, whose forced value is zero gain.
    required_metrics:
      - B_pub, H_sec by all three bounds, and R per cell.
      - Exact collision counts per (d', m), with the colliding pairs recorded.
      - Recovery rate per (d', m) on the fixed-product curve, real and null.
      - Explained variance of the R-only, gamma-only and two-variable models.
      - B* per cell with confidence interval.
      - Hecke-augmentation gain, expected 0, reported whatever it is.
      - Wide-S control recovery rate, expected 0.

  falsification_conditions:
    - >-
      The Hecke-augmentation arm shows a nonzero gain that is not an
      implementation error. The lemma of (C) is wrong or compatibility is not an
      intertwining; the record is superseded and the corrected reading becomes
      the finding.
    - >-
      The random linear encoder reproduces every measured curve within noise.
      Then the measurements are about random codes over Z/l^m Z and carry no
      arithmetic content; the record must say exactly that and must not present
      the numbers as facts about modular symbols.
    - >-
      The wide-S information-theoretic control shows any recovery. The instance
      generator leaks; the run is void.
    - >-
      Recovery rate does not decay monotonically as the published budget falls.
      Artifact signature; halt and diagnose.
    - >-
      m_inj exceeds m_lat, i.e. recovery succeeds before the answer is unique.
      The pipeline is accepting wrong answers that verify; correctness failure,
      halt.
    - >-
      Stage 0 finds that the secret is the representative rather than the curve.
      Every entropy bound in (B) changes and the counting must be redone before
      any threshold is quoted.

  confounders:
    - >-
      WHICH SECRET. Oriented curve, homology class, and short representative are
      three secrets with three entropies, and the redundancy is meaningless until
      one is fixed. This is the largest interpretive risk and Stage 0 exists for
      it.
    - >-
      d' IS NOT A FREE KNOB IF THE PAPER'S CONSTRUCTION FIXES THE FORM BASIS. The
      2-factor design assumes coordinates can be withheld; if the encoding is
      atomic, the design collapses to a 1-factor sweep in m and cannot separate
      the mechanisms. Stage 0 must confirm the knob exists.
    - >-
      RANK SATURATION. Once d' exceeds rank(A mod l), further coordinates add no
      determinant and R keeps rising while gamma does not -- which is precisely
      what makes the 2-factor design work, and also precisely what makes it
      sensitive to a misreported rank. The rank must be measured, not assumed,
      in every cell.
    - >-
      ENTROPY BOUNDS ARE UPPER BOUNDS. H_sec is bounded by three quantities and
      the true entropy of the instance generator may be lower than all three, in
      which case R is understated. The generator's empirical entropy must be
      estimated and reported alongside the bounds.
    - >-
      TOY SIZE. At toy N the short set is small enough to enumerate, which is
      exactly why the collision counts are exact -- and exactly why they say
      little about a regime where enumeration is impossible. The transferable
      output is the SHAPE of the curves, not their thresholds.

