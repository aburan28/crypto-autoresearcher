idea:
  id: IDEA-20260905-aaaf6e
  title: Rank-conditioned relation cost as a stopped-process quantity
  class: composition
  claim: 'A relation pipeline''s expected cost to attain a target informative rank cannot generally be inferred
    from mean attempt cost divided by mean relation probability. Conjecture: a rank-conditioned drift certificate
    gives a correct upper or lower cost envelope and identifies whether a geometric sampling rule is spending most
    of its effort on redundant rows.'
  mechanism: Let C be an attempt's cost and Delta r its increase in the informative quotient rank. Both depend on
    current row space and may correlate with the same geometry that changes decomposition difficulty. A potential
    based on remaining rank can telescope only under conditional bounds given the accumulated state. This is a renewal-reward
    question with a stopping time, not an independent Bernoulli model. A structural opportunity would be a publicly
    testable class of relations whose conditional informative yield remains high near saturation. No collection
    or extraction workflow is proposed.
