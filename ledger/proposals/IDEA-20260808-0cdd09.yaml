idea:
  id: IDEA-20260808-0cdd09
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  title: 'Validate the NFS cost model on RATIOS between record computations, where the implementation
    constant cancels exactly, instead of on absolute core-years where it cannot: the model
    predicts the RSA-240 to RSA-250 sieving ratio at 2.72 and the post-merge matrix-row ratio
    at 1.65, and the residual is this program''s only available estimate of the o(1)''s local
    slope — the quantity every future RSA extrapolation''s error bar depends on'
  class: measurement
  claim: 'SCOPE: cost-model validation. No factorization, no attack, no statement about deployed
    keys. THE PROBLEM WITH THE GOAL''S OWN FIRST GATE: an L-notation model predicts K*exp((c+eps(n))
    f(n)) with K unknown and eps uncontrolled; it cannot predict an absolute core-year figure,
    so a model that "reproduces" 2700 core-years has absorbed K into one datum. THE ABSOLUTE
    GATE IS A CALIBRATION THAT ALWAYS SUCCEEDS, NOT A TEST. CLAIM: ratios kill K exactly and
    reduce eps to its DIFFERENCE across the size gap. With f(b) = (b ln2)^(1/3)(ln(b ln2))^(2/3)
    and c = (64/9)^(1/3) = 1.922999, DERIVED BY HAND THIS SESSION: f(795 bits) = 8.1980 *
    3.4157, exponent 53.845; f(829 bits) = 8.3134 * 3.4308, exponent 54.847; PREDICTED SIEVING-TIME
    RATIO exp(1.002) = 2.724; PREDICTED FACTOR-BASE / MATRIX-DIMENSION RATIO exp((beta/c)*1.002)
    = exp(0.5010) = 1.650 with beta = (8/9)^(1/3) = 0.961500. Against the RELAYED RSA-250
    figure of 405M post-merge rows this predicts RSA-240 at 245M rows and RSA-240 sieving
    at 2450/2.724 = 899 core-years on the same reference core. RSA-240''s matrix dimensions
    are, per RQ-RSA-afe33c, not in this corpus at all. SECOND CLAIM: the residual (observed/predicted)
    is a direct estimate of the o(1)''s local slope over a 34-bit gap. In the crudest linear
    model the extrapolation error to 2048 bits grows like residual^((2048-829)/34) = residual^35.9
    — enormous for any residual not very close to 1. A cost table at 2048 bits emitted without
    this quantity has no error bar, and the program currently has no estimate of it whatsoever.'
  mechanism: 'DERIVED IN-REPO; a reviewer can reproduce every digit with a calculator and
    I invite exactly that. Writing T(n) = K exp((c + eps(n)) f(n)), T(n2)/T(n1) = exp(c(f2
    - f1)) * exp(eps2 f2 - eps1 f1): K cancels EXACTLY and the correction depends on eps only
    through a difference, so a slowly varying eps contributes a factor near 1 even when eps
    itself is not small. That is why the ratio gate is a real test and the absolute gate is
    not. THE THREE-POINT STRUCTURE THE LITERATURE ALREADY BUILT: DLP-240 sits at the same
    size as RSA-240, giving two independent ratios of different kinds — a SIZE ratio (RSA-240
    to RSA-250, testing size dependence) and a PROBLEM ratio at fixed size (testing problem
    dependence). IDEA-20260805-72bcb5 already claims the second for the LINEAR ALGEBRA; this
    record claims the first for SIEVING and MATRIX DIMENSION. Passing one and failing the
    other localizes the defect, which is strictly more information than either alone. THE
    MATRIX RATIO IS THE SHARPER OF THE TWO: running times depend on hardware and operator
    choices, but post-merge dimension depends on the factor-base bound and the filtering,
    both published. It is weighted higher for that reason. A TRANSCRIPTION PRECONDITION COMES
    FREE: RQ-RSA-afe33c records that the RSA-250 phase figures sum to 2830 against a headline
    2700. Ratio work forces that to be resolved against primary text before any ratio is quoted,
    rather than smoothed over.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN: standard extrapolation of record timings
    through L-notation, which every key-size recommendation performs. The difference is directional
    — standard practice USES the model assuming it valid; this uses two records to TEST it
    and measures the residual as an error bar on all future use. Second difference: the matrix-dimension
    ratio is a structural rather than a timing prediction, and no in-corpus record uses it
    as a validation gate.'
  predictions:
  - observable: RSA-250 sieving core-years / RSA-240 sieving core-years on comparable hardware
    metric: ratio
    predicted: 2.724 DERIVED; pass band declared in advance [2.18, 3.41] (factor 1.25).
  - observable: RSA-250 post-merge rows / RSA-240 post-merge rows
    metric: ratio
    predicted: 1.650 DERIVED; pass band [1.32, 2.06].
  - observable: RSA-240 post-merge rows predicted from RSA-250's relayed 405M
    metric: millions of rows
    predicted: 245M DERIVED; pass band [196M, 306M].
  - observable: implied local slope of the o(1) between 795 and 829 bits
    metric: '|log(observed/predicted)| / (f(829) - f(795))'
    predicted: Reported with propagated uncertainty. Below 0.05 licenses a cautious extrapolation
      with a stated band; above 0.2 forbids the RSA-2048 table entirely, and that prohibition
      is the deliverable.
  minimal_test: 'STAGE 0 (reading, required before design by RQ-RSA-afe33c.constraints): obtain
    the RSA-240, RSA-250 and DLP-240 primary texts; extract sieving and linear-algebra core-years,
    factor-base bounds, relation counts and post-merge dimensions for all three; resolve 2830-vs-2700
    against primary text; file as KN-LIT entries with provenance levels. STAGE 1 (zero compute):
    independently re-derive the two predicted ratios (do not copy the numbers above), declare
    the pass bands BEFORE reading observed values, then compare. STAGE 2 (zero compute): propagate
    the residual into extrapolation bands at 1024/2048/3072 and state whether criterion 3''s
    table is reachable.'
  controls:
  - PRE-DECLARED PASS BAND: factor 1.25, declared here before any observation. Widening it
      afterwards is a versioned protocol amendment with exploratory-only status, never an
      edit.
  - POWER CHECK (MANDATORY, ZERO COST): a wrong-exponent null with c = 1 predicts a sieving
      ratio exp(1.002/1.923) = 1.67. If the pass band admits both 2.72 and 1.67 the test has
      no power and must be tightened or abandoned.
  - SECOND NULL: a pure exponential model fitted to one point predicts a different ratio;
      report which of the three models the observation prefers, so the test discriminates
      rather than merely confirms.
  - CROSS-PROBLEM CONTROL: run the identical machinery on DLP-240 vs RSA-240 with the discrete-log
      constant, checking the machinery is not tuned to factoring.
  confounders:
  - Different hardware, software versions and operator parameter choices between the two records;
    a core-year ratio mixes algorithmic scaling with all of it. This is why the matrix ratio
    is weighted higher and why a time-ratio disagreement alone is reported as ambiguous.
  - Realized factor-base bounds are operator choices, not theoretical optima; the comparison
    must use actual bounds when published, with the theoretical counterfactual reported alongside.
  - Whether "sieving" includes cofactorization and duplicate removal must be defined identically
    for both records or the ratio compares different things.
  - A 34-bit gap is short. Two points cannot separate a slowly varying eps from a wrong constant;
    the output is a residual, and no functional form for eps may be inferred from two points.
  falsification_conditions:
  - Either observed ratio falls outside its pre-declared band — the leading term does not
    transport across this gap, criterion 3's extrapolated table is not licensed, and the negative
    CLOSES THE GOAL'S MOST EXPENSIVE BRANCH EARLY, exactly as GOAL-RSA-001.next_action asks.
  - The pass band admits both the true model and the c = 1 null — no discriminating power;
    must not be reported as validation.
  - The 2830-vs-2700 discrepancy cannot be resolved — the time ratio carries a 4.8 per cent
    unresolved error and must be quoted with it or dropped in favour of the matrix ratio.
  - RSA-240 matrix dimensions unobtainable — acquisition failure under AGENTS.md rule 5, never
    a model result.
  interpretation_limits: A validation procedure for a cost model. It factors nothing, claims
    no break, moves no exponent, says nothing about deployed keys. A passing ratio establishes
    that the leading term transports across 34 bits — NOT that extrapolation to 2048 is correct,
    and the record must never let those be confused. The residual-to-error-bar propagation
    uses the crudest linear model of eps and is an order-of-magnitude statement, not a confidence
    interval.
  assumptions:
  - Classical GNFS with the standard parameterization; c = (64/9)^(1/3), beta = (8/9)^(1/3)
    at theta = 0.
  - Comparable enough deployments that a core-year is one unit — explicitly doubted in confounders,
    which is why the matrix ratio leads.
  - Identical stage boundaries across records; verified in Stage 0, not assumed.
  heuristic_assumptions:
  - id: HA-9
    statement: (Slow variation of the o(1).) There is eps(n) -> 0 with true cost K exp((c
      + eps(n)) f(n)) and |eps(829) f(829) - eps(795) f(795)| < 0.25, so the predicted ratio
      is correct to within exp(0.25) = 1.284.
    rigorous_ingredient: That eps -> 0 is the content of the standard heuristic GNFS analysis
      and is not in dispute; what is assumed here is a RATE, which no published analysis supplies.
    distribution_imitated: None — an analytic smoothness assumption, which is the honest name
      for what every published RSA key-size extrapolation silently assumes.
    validation_route: 'The test measures it: the observed residual IS an estimate of the left-hand
      side. A third record point (RSA-232, RSA-768, or the 795-bit DLP) turns one residual
      into two and permits a first constancy check; Stage 0 should acquire as many as the
      network policy allows, since each point is free discriminating power.'
    tail_checks: Compare residuals across the largest available gap and check whether |eps
      f| differences grow faster than linearly in the f-difference; state the DIRECTION of
      any failure, because only one direction (pessimistic for the attacker) is safe to inherit.
  target_complexity:
    time_exponent: NO EXPONENT MOVES. This validates the exponent the program already quotes,
      L[1/3, (64/9)^(1/3)] uncharged, and is the precondition for quoting the charged variants
      of H-RSA-68884a and X1-05.
    memory_exponent: 'The matrix-dimension ratio IS a memory prediction: the post-merge matrix
      scales as L[beta], so 1.650 is a predicted memory ratio. Reporting it beside the time
      ratio satisfies RQ-RSA-afe33c''s memory-beside-time constraint at the validation stage,
      not only at the table stage.'
    best_known_baseline: The published record measurements themselves; this does not beat
      them, it checks whether a model predicts the relation between them.
    hidden_overhead_disclosure: 'The entire content is an attempt to BOUND what hides in the
      o(1) over one 34-bit gap. What remains undisclosed afterwards: eps beyond 829 bits,
      which two points cannot constrain and which this record refuses to infer.'
    time_memory_tradeoff: Not applicable to a validation procedure; the tradeoff belongs to
      the model being validated (H-RSA-68884a's beta(theta), X1-05's branch).
  sota_delta: No attack cost changes. The program gains two pre-registered ratio predictions
    (2.724, 1.650) and, for the first time, a measured bound on the o(1)'s local slope — the
    quantity on which every future RSA extrapolation's error bar depends and which is absent
    from the corpus.
  dominated_by: 'CHECKED against every in-corpus RSA row: H-RSA-68884a (declares its concrete-size
    transfer obligation UNMET, so does not dominate), IDEA-20260805-72bcb5 (orthogonal same-size
    cross-problem ratio), IDEA-20260805-1775f2, IDEA-20260805-73cccc, KN-TECH-036 (records
    the practice of calibration without supplying these predictions), KN-TECH-052 (the extrapolation
    technique, not this instantiation). Not dominated in-corpus. EXTERNALLY UNCHECKED: the
    published NFS simulation methodology named in RQ-RSA-afe33c predicts phase times from
    parameters and may already contain a cross-size validation; that is the Stage-0 prior-art
    question and the honest status until then is "possibly dominated".'
  estimated_cost: Implementation low (a dozen lines of arithmetic, inputs quoted to full precision).
    Compute negligible. The entire cost is Stage-0 reading, already budgeted by the goal.
  recommended_priority: high
  honest_prior_of_survival: 0.5 that both ratios land inside the 1.25 band. Not higher because
    the records differ in hardware and the sieving stage boundary is exactly the kind of definition
    that differs between announcements; not lower because the matrix ratio rests on structural
    parameters and 1.650 is a modest prediction over a short gap. The most likely single outcome,
    in my view, is TIME ratio fails and MATRIX ratio passes — which would say the model transports
    structurally but not temporally, and that is highly informative.
  novelty_status: screened
  novelty_screen: SCREENED against H-RSA-68884a (full), IDEA-20260805-72bcb5 (Part A), RQ-RSA-afe33c
    and GOAL-RSA-001 (full), KN-LIT-2663 (full), the six /tmp/ideas-ctx/*.txt dedup files
    (KN-TECH-036 and KN-TECH-052 noted as the adjacent techniques), and my own X1.yaml. No
    in-corpus record states a cross-size ratio prediction. External literature unreachable
    this session; the NFS simulation methodology is the named prior-art risk.
  discriminated_from: 'IDEA-20260805-72bcb5: same-size cross-PROBLEM ratio for the linear
    algebra; this is a cross-SIZE ratio for sieving and matrix dimension — different pair,
    different stage, different constant cancelling. H-RSA-68884a: asymptotic family whose
    concrete-size transfer obligation is DECLARED UNMET; this attempts exactly that obligation
    in the only form in which it is attemptable, the ratio. KN-TECH-052: the technique; this
    is a specific instantiation with declared bands and a power check.'
  source_refs:
  - ledger/questions/RQ-RSA-afe33c.yaml
  - ledger/goals/GOAL-RSA-001.yaml
