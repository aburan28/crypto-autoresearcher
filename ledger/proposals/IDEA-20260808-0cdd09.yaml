  - 'NAMED IN RQ-RSA-afe33c.provenance, NOT READ THIS SESSION: the CADO-NFS RSA-250 announcement,
    the "Factoring RSA-250" talk, the merge/filtering paper, and eprint 2020/697 (the 240-digit
    factorization-vs-DLP experiment).'
  proof_search_map:
    bottleneck: Whether the leading L-term transports across a 34-bit size gap. Every extrapolation
      the goal wants passes through it and it has never been checked in this program.
    baseline_embedding:
      parameter_slice: n2 = n1 (ratio exactly 1, symbolically), and eps == 0 (prediction exact,
        residual 1 by construction).
      reproduction_check: 'Symbolic: f(n) - f(n) = 0 so both ratios are exp(0) = 1. FROZEN
        FIXTURE: the six intermediate values (8.1980, 3.4157, 53.845, 8.3134, 3.4308, 54.847)
        must be reproduced to four decimals by an independent implementation before any observed
        number is read.'
    observation_collision:
      observable: the two scalar ratios.
      distinct_preimage_search: 'COLLISION EXHIBITED: only c*Delta f + Delta(eps f) is observed,
        so a wrong c with a compensating eps is indistinguishable from the right one on two
        points. SEPARATING CONDITION: a third size, converting one equation into two — which
        is why Stage 0 should acquire every extra record point available.'
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: Compare only quantities whose implementation constants provably cancel
        — same stage, same software family, same defined boundary.
      predicted_gain: A test the model can actually fail, unlike an absolute comparison it
        always passes by absorbing K.
    - transform: observable_fiber
      proposed_object: Hold the ratio fixed and vary (c, eps); the intrinsic invariant is
        the second difference across three sizes.
      predicted_gain: Names in advance exactly what a third data point buys, so acquisition
        is targeted.
    quantifier_order: THERE EXISTS one parameter-free formula (given c and beta) SUCH THAT
      FOR ALL pairs of record computations in the acquired set it predicts the ratio within
      the pre-declared band. The formula may not be chosen per pair and the band may not be
      widened after observation. The weaker order — for all pairs there exists a band containing
      the observation — is vacuous and is not claimed.
    method_ceiling:
      strongest_certifiable_claim: 'At most: that the leading-order L-model predicts the observed
        ratio between two named records within a declared factor, and that the residual bounds
        the o(1)''s variation over that gap. Cannot certify any absolute cost, any unobserved
        size, any bound on eps beyond the largest observed size, or anything about a deployed
        key.'
      nearby_object_control: 'MUST FAIL: a special-NFS pair, whose exponent is (32/9)^(1/3).
        Applying the GNFS ratio formula there must give a visibly wrong answer; if it does
        not, the test cannot detect a wrong exponent and its passes are uninformative. GOAL-ECTD-001
        owns SNFS substantively; used here only as a control, as GOAL-RSA-001.non_duplication
        permits.'
    proof_obligations:
    - claim: K cancels exactly in the ratio.
      responsibility: correctness
    - claim: The six intermediate values reproduce to four decimals independently.
      responsibility: baseline
    - claim: The pass band admits the true model and excludes the c = 1 null.
      responsibility: strictness
    - claim: The matrix ratio is reported beside the time ratio in every citation.
      responsibility: memory
    - claim: No functional form for eps is inferred from two points.
      responsibility: scope
    not_applicable_reason: null
