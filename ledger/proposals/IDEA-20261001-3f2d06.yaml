  assumptions:
    - Identical frozen (n,ℓ,V,modulus,instance batch,seeds) for both solvers.
    - Both engines already admitted or the cell is failed_infrastructure (never evidence).
    - Toy n only; ratio threshold 0.8 pre-registered; no post-hoc edits.

  heuristic_assumptions:
    - id: HEUR-BINSTD-3f2d06-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: on a frozen batch of ≥30 descended
        S_3 PDP instances that both Crossbred and XOR-SAT finish within the
        per-instance wall budget, median(t_crossbred)/median(t_xorsat) ≤ 0.8.
      random_model_justification: >-
        Rigorous: KR-IC-e847d1 / KR-IC-5765d2 name the two solver classes.
        Classical: MQ hybrids can dominate pure SAT in intermediate density
        regimes; whether that holds for Semaev-descended Boolean systems at
        these toys is the transfer hypothesis under test. KR-IC-1fcdbc
        forbids reading a toy win as practical IC.
      supporting_results:
        - KR-IC-e847d1
        - KR-IC-5765d2
      validation_experiment_ids: []
      falsification_condition: >-
        Ratio > 0.8 on a completed batch, OR a matched-size random Boolean
        system shows the same ratio within ε=0.05 (Semaev structure is not
        the driver), OR either solver is missing (infrastructure stop, not
        falsification).

  predictions:
    - metric: crossbred_over_xorsat_median_wall_ratio
      direction: upper_bounded
      minimum_effect: '≤ 0.8 on each toy cell among dual-finished instances'
    - metric: dual_finish_fraction
      direction: lower_bounded
      minimum_effect: '≥ 0.7 of the frozen batch finished by both solvers'
    - metric: random_boolean_control_ratio
      direction: differ
      minimum_effect: '|ratio_semaev − ratio_random| ≥ 0.1 OR control fails dual-finish gate'

  minimal_test: >-
    Stage 0: freeze (n,ℓ,V), instance generator, seeds, wall budgets, solver
    versions. Stage 1: n=17, ℓ∈{3,4}, ≥30 instances, report medians, ratio,
    dual-finish fraction. Stage 2: n=19,23 + matched random Boolean null.
    Budget: ≤60 runs, ≤12 CPU-hours. Stop if either admitted engine is absent
    (IMP, never evidence).

  controls:
    - ctl_identical_instance_batch
    - ctl_frozen_solver_versions
    - null_random_boolean_matched_size
    - ctl_no_posthoc_ratio_edit

  falsification_conditions:
    - Claiming practical binary IC from a toy Crossbred win (KR-IC-1fcdbc).
    - Transferring toy ratios to n≥131 without a new contract.
    - Editing the 0.8 threshold after seeing times.
    - Treating missing Crossbred/SAT binaries as mathematical falsification.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Constant-factor / regime comparison of two MQ
      engines on toys; IC remains dominated by rho (KR-IC-1fcdbc).
    memory_exponent: Polynomial in the descended system size at n≤23, ℓ≤4
    best_known: >-
      KR-IC-5765d2 XOR-SAT path; KR-IC-e847d1 Crossbred class; practical
      negative KR-IC-1fcdbc.
    hidden_overhead: Engine constants; dual-finish censoring bias.
    tradeoff_note: n/a — meter, not an attack tradeoff.

  estimated_cost:
