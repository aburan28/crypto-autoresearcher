# IDEA-20261001-3f2d06 -- Crossbred vs XOR-SAT on toy S_3 Weil-descent PDP.
# Calibrates KR-IC-e847d1 against KR-IC-5765d2; no break / no exponent claim.
# =============================================================================
idea:
  id: IDEA-20261001-3f2d06
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES CROSSBRED BEAT XOR-SAT ON TOY S_3 WEIL-DESCENT PDP CELLS?
    On binary toys n∈{17,19,23} with frozen V (dim ℓ∈{3,4}), compare wall
    time and success of a frozen Crossbred (Macaulay+enum) solver against
    the program's admitted XOR-SAT path on identical descended S_3 instances.

  class: heuristic_validation

  claim: >-
    KR-IC-e847d1 reports Crossbred as a hybrid Boolean MQ method; KR-IC-5765d2
    records XOR-SAT (WDSat / CryptoMiniSat) as the measured binary PDP path.
    CLAIM: at each toy cell (n,ℓ)∈{17,19,23}×{3,4}, on a frozen batch of
    ≥30 identical descended S_3 PDP instances, Crossbred median wall time is
    ≤ 0.8× XOR-SAT median wall time among instances both solvers finish —
    OR the ratio is >0.8 and is recorded as Crossbred-not-faster at this
    scale. CLAIM TIER: heuristic_validation. NO break. NO exponent. NO claim
    that Crossbred yields practical binary IC (KR-IC-1fcdbc remains the
    practical negative). NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 on x-coordinates with factor
    base {P : x(P)∈V}, Weil-restricted to F_2 Boolean/MQ form (KR-IC-5a43e5 /
    KR-IC-73db3f). Operation set: two elimination/search engines only —
    Crossbred (KR-IC-e847d1) vs XOR-SAT (KR-IC-5765d2) — reporting time and
    success, not a full IC campaign. Trichotomy: Class I partial-action (IC
    relation under FB translation) used as instrument. Lossy-projection:
    solvers discard algebraic content beyond satisfiability; null is a
    random Boolean system of matched size/degree whose Crossbred/SAT ratio
    should not inherit any Semaev structure. OFF-LIMITS: asserting
    KR-IC-889857; provisioning new CAS mid-run; claiming SAT-PDP as a new
    mechanism (KR-IC-5765d2 already owns it). WHAT IS NEW: a pre-registered
    Crossbred-vs-XOR-SAT ratio band on RQ-BINSTD toys.

  novelty_status: unverified
