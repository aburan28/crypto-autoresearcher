      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
  assumptions:
    - The lexicographically least monic irreducible cubic over F_11 exists and is unique under the stated coefficient order.
    - E: y^2 = x^3 + x + 1 is nonsingular over F_11 because 4 + 27 = 31 is nonzero mod 11.
    - At least one degree-3 x makes x^3 + x + 1 a square on E, and the c-search finds a nonsingular E' with j(E') not in F_11. If either fails, the cell is unmeasured, not a falsification.
    - Families F1-F7 are off-limits as the primary lens. S_3 is the system under test, and the addition is the orbit-dimension comparison.
  predictions:
    - metric: galois_orbit_dimension_gap
      direction: lower
      minimum_effect: d(E, R_E) <= d(E', R_E') - 1
  minimal_test:
    design: >-
      Build F_1331 from the least monic irreducible cubic over F_11. Select
      R_E and E', R_E' by the rules in the claim. Expand S_3(x(R), T, U) and
      its two Frobenius conjugates in the monomial basis, write coefficients
      on the basis 1, z, z^2, and row-reduce over F_11. Record both dimensions
      and the gap.
    controls:
      - A point of E defined over F_11 must give orbit dimension 1, because all three conjugates are equal. Any other value means the rank instrument is wrong and the cell is unmeasured.
      - A coefficient vector of the same length with entries drawn by a fixed linear congruential generator, seed 20261006, must be scored the same way. That null is the random-matrix comparison for HA-1, not a second curve.
      - The same x, if it lies on both E and E', is an extra shared-x row. The scored claim still uses each curve's own designated point.
    required_metrics:
      - d(E, R_E)
      - d(E', R_E')
      - gap d(E, R_E) - d(E', R_E')
      - instrument check on one F_11-rational point, which must equal 1
  falsification_conditions:
    - d(E, R_E) >= d(E', R_E'). Equal dimensions, and the case d(E, R_E) = 3, are the negative outcome and mean this conjugate span adds no linear collapse beyond the control.
    - The F_11-rational-point control returns a dimension other than 1. That falsifies the instrument, not the curve.
  confounders:
    - R_E and R_E' may have different x-coordinates, so a gap can come from the point rather than from E being defined over F_11.
    - A singular c or a j(E') in F_11 that escapes the selection rule would mix the two arms.
    - Monomial support larger than the actual support of S_3 can pad zero columns and must be reduced before the rank.
  interpretation_limits:
    - One pair of curves at n = 3. A gap of 1 is a constant factor at most 3/2 in the number of independent conjugate polynomials, not a change of the exponent 4/3 in q.
    - The result does not transfer to characteristic 2, where KR-IC-f5c584 already forces a trace equation.
    - No factor base is proposed. KN-OPEN-020 is not escaped.
    - Dimension 3 on E means the only Frobenius saving left in scope for this polynomial is the known 1/n factor-base symmetry of KR-IC-b0fcda.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a uniform random vector v in F_{q^n}^M with M >= n, q = 11, n = 3,
        and M equal to the number of monomials of bidegree at most (2, 2), the
        F_q-span of {v, v^q, v^{q^2}} has dimension n with probability
        1 - O(q^{-1}), and dimension <= n - 2 with probability O(q^{-2}).
      rigorous_support: >-
        The orbit has n vectors, so the dimension is at most n. After choosing
        an F_q-basis of F_{q^n}, this is the rank of an n by nM matrix over
        F_q. The proved comparison is the distribution of the rank of a uniform
        random matrix over a finite field, whose full-rank probability is
        the product formula prod_{i=0}^{n-1} (1 - q^{i-nM}) for nM >= n.
        The imitation is that an S_3 coefficient vector behaves like that
        uniform matrix. Subfield structure of E is exactly what the claim says
        violates the imitation.
      validation_plan: >-
        At q = 11, n = 3, compute the orbit dimension for every affine point of
        E(F_1331) whose x has degree 3, and for 200 seed-20261006 random
        coefficient vectors of the same length. Compare the fraction with
        dimension < 3 to the random-matrix tail bound O(q^{-1}) = O(1/11).
        Tail check: the count of samples with dimension <= 1, excluding points
        defined over F_11, is at most twice the predicted full-rank-failure
        count, or else HA-1 is rejected on this field. Transfer assumption:
        the random vectors match the monomial support of S_3 and are not
        themselves Frobenius-invariant.
  target_complexity:
    time_exponent: >-
      Unchanged heuristic Gaudry exponent q^{2-2/n} = q^{4/3} at n = 3.
      A confirmed gap of 1 multiplies the conjugate-polynomial count by at
      most 2/3 and does not change 4/3.
    memory_exponent: >-
      Unchanged. The descended linear system is the same order as Gaudry's
      list, O~(q^{4/3}) field elements up to the n! 2^{n(n-1)} factor, and
      this rank uses O(1) memory at n = 3.
    best_known: >-
      Pollard rho on E(F_{q^n}) is q^{n/2} = q^{3/2} group operations.
      Gaudry decomposition is heuristic O~(q^{4/3}) for fixed n = 3
      (KR-IC-46d822). Frobenius-invariant factor bases add a constant 1/n
      on the number of systems (KR-IC-b0fcda), not a new exponent.
    hidden_overhead: >-
      Gaudry's O~ hides n! · 2^{n(n-1)} and (log q)^{O(1)}. At n = 3 those
      factors dominate a 3/2 change in orbit dimension.
    tradeoff_note: >-
      No new time-memory tradeoff. Parallel row reduction of one 3-by-9
      matrix does not interact with van Oorschot-Wiener. An exponent movement
      would require the codimension to grow with n. This cell does not claim
      that growth.
