  title: Frobenius orbit dimension of one S_3 coefficient vector on a subfield curve versus a curve not defined over the subfield
  class: mechanism
  claim: >-
    Representation R1, attack stage relation decomposition. On E: y^2 = x^3 + x + 1
    over F_11, let z be a root of the lexicographically least monic irreducible
    cubic z^3 + c2 z^2 + c1 z + c0 over F_11, ordered by (c2, c1, c0). Let R_E be
    the point whose x-coordinate is the lexicographically least degree-3 element
    of F_1331, in the basis 1, z, z^2, at which x^3 + x + 1 is a square, with the
    smaller y in that same order. Let E' be y^2 = x^3 + z x + c over F_1331 for
    the least c in {1, 2, ..., 10} such that E' is nonsingular and j(E') is not
    in F_11, and let R_E' be chosen by the same x-then-y rule on E'. Let d(C, R)
    be the dimension over F_11 of the span of the three q-power Frobenius
    conjugates of the polynomial S_3(x(R), T, U) in F_1331[T, U]. The claim is
    d(E, R_E) <= d(E', R_E') - 1. The negative outcome is d(E, R_E) >= d(E', R_E'),
    including the case d(E, R_E) = 3. No unconditional ECDLP break is claimed.
  mechanism: >-
    OBJECT FRAME. Representation R1: the coefficient vector of S_3(x(R), T, U)
    on the monomials T^i U^j with i, j <= 2. Operation set Sigma: the 11-power
    Frobenius on those coefficients, and F_11-linear combinations of the orbit.
    Sigma does not contain elliptic translation. Trichotomy: partial-action.
    The span is invariant under Frobenius, and index-calculus relation
    propagation is still only under addition of factor-base points; this record
    prices the coefficient span, not a new factor base. LOSSY-PROJECTION TEST.
    The tracked object is the integer dimension. It discards which subspace
    occurred. Frobenius permutes the three polynomials and does not change the
    span, so the discard is compatible with Sigma. The ordered triple of
    conjugates is not a function of the integer, so the projection is lossy.
    Keeping the three polynomials would be a coordinate change of the same
    orbit. The open number is d(E, R_E) - d(E', R_E'), predicted <= -1.
    Orbit canonicalisation is one Gaussian elimination on at most 3 rows and
    9 monomial columns over F_11. Families F1-F7 are not the lens. This is not
    a rewrite of S_3 in elementary symmetric variables. A drop that is only a
    constant 3/2 at n = 3 does not by itself change Gaudry's q^{4/3} exponent.
