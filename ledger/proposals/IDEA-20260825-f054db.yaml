  batch: EC-STRUCTURE-20260825
  cluster: 'C1-frame: what an instance actually reveals'
  title: 'SCALAR COLLAPSE AS A STANDING ADMISSIBILITY GATE FOR THE WHOLE ENDOMORPHISM LANE: require every
    future End(E)-leverage proposal to exhibit a NON-SCALAR action on the object it actually uses, and
    re-audit the lane''s existing records against that one question'
  class: barrier
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The gate is a procedural artifact built on the algebraic fact recorded in IDEA-20260825-7260b2.
    Its novelty is not mathematical and is not claimed; what needs screening is whether the lane's records
    really do all fail the gate, which is an empirical question about this ledger.
  claim:
    semantic_part: Every endomorphism of an ordinary E/F_p acts on the prime-order rational subgroup as
      a publicly computable scalar, so any proposal whose leverage is an endomorphism applied to points
      OF THAT SUBGROUP is bounded a priori by a known-scalar relabelling and cannot exceed the |Aut|-quotient
      constant.
    evaluator_part: 'Unestablished: that every existing endomorphism-lane record in this ledger in fact
      operates on the rational subgroup rather than on full N-torsion. That is the audit this record proposes,
      not an assertion it makes.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'State the gate as a single admissibility question: on WHICH module does the proposed mechanism apply
    End(E), and is the action there non-scalar?'
  - 'Two admissible answers only: the mechanism works on full E[N] (and then pays the embedding degree
    explicitly in its cost model), or it works on a curve whose N-torsion action is reducible over F_p
    (and then names that curve family and its density).'
  - Re-audit each existing endomorphism-lane record -- H-ENDO-001 and its predictions P1/P2/P3, KN-FIND-009,
    IDEA-20260727-008, IDEA-20260807-285ff4, IDEA-20260808-621df3, IDEA-20260808-c5f9a2 -- against exactly
    that question, and record for each whether the gate is passed, failed, or inapplicable.
  - Publish the gate in the idea-generator contract so that it fires at generation time rather than at
    review time.
  lossy_projection_test:
    tracked_object: 'not applicable: this is a procedural gate, not a tracked object'
    what_is_discarded: null
    propagation: null
    verdict: N/A -- the lossy-projection test does not apply to an admissibility rule.
  predictions:
  - id: P1
    status: unestablished
    statement: Every endomorphism-lane record currently in the ledger applies End(E) to points of the
      rational prime-order subgroup and therefore fails the gate.
  - id: P2
    status: unestablished
    statement: Applying the gate at generation time reduces the endomorphism lane's proposal volume without
      removing any record that survived review.
  minimal_discriminating_test:
    status: specified_not_run
    test: Read each named record and classify it as gate-passed, gate-failed, or gate-inapplicable, with
      the module it uses quoted from the record.
    pass: Every record classifies unambiguously and the classification is reproducible by a second reader
      from the quoted text alone.
    fail: Any record whose module cannot be determined from its own text is a finding about the record's
      specification, not about the gate.
  controls:
  - Include at least one record the gate should NOT fire on (a proposal that explicitly pays the embedding
    degree), to show the gate is not vacuously universal.
  - 'Blind the classification: have the module determined before the record''s outcome is read, so a known-rejected
    record is not classified as failed by hindsight.'
  confounders:
  - 'Hindsight bias: records already rejected will look like gate failures.'
  - A gate that rejects everything is a fatigue report, not a filter -- the negative control above is
    what distinguishes the two.
  - Procedural gates can suppress a genuine lead; the gate must be stated as a disclosure requirement,
    never as a prohibition.
  falsification:
    semantic: An endomorphism-lane record that works on the rational subgroup and nonetheless exceeds
      the known-scalar bound falsifies the gate.
    evaluator: A classification that a second reader cannot reproduce scopes out the audit's reliability,
      not the gate.
    not_falsification: The gate rejecting many records; that is its purpose and carries no information
      by itself.
  why_this_is_not_a_variant: The ledger's existing endomorphism closures are per-record and post-hoc.
    This is a pre-compute, generation-time filter with a stated escape clause, which is what the inventor
    protocol's closure standard asks for and what a list of individual rejections cannot supply.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No algorithmic content and no cost improvement. Process artifact only.
    dominated_by:
    - 'not applicable: no algorithmic claim'
    axes:
