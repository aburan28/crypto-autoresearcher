idea:
  id: IDEA-20260814-c3af09
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-08-14'
  proposed_by: idea-generator
  status: proposed
  class: algorithm

  title: >-
    Lift-stable tropical initial-form decoder for Semaev decomposition: a fixed
    valuation branch must return exact factor-base points, not merely prune a
    polynomial system, and its advantage must survive changing the integral lift

  object: >-
    TRACKED OBJECT. For a fixed prime-field curve, factor base, target R, arity m,
    integral model of the Semaev polynomial S_{m+1}, and declared p-adic precision
    r, track the ordered monomial-valuation vector together with the residue
    initial form at every branch of a branch-and-Hensel decoder. The record keeps
    the winning valuation cells, residue roots, lift multiplicities, exact source
    indices, and point-sum certificates. It discards the full p-adic coefficients
    after their valuations and residue initial forms have been recorded. The
    object is not a tropicalization of the curve alone, a valuation of one lifted
    point, a Newton-polytope score, or a solver timing.

  lossy_projection_test: >-
    The projection from a full lifted polynomial system and a source tuple to its
    monomial valuations and residue initial form is genuinely lossy: distinct
    coefficient lifts and distinct residue roots can have the same tropical cell.
    What is retained propagates deterministically under multiplication,
    substitution, taking initial forms, and Hensel refinement, but it does not by
    itself identify a factor-base tuple. That missing inverse is deliberate and
    testable. A surviving decoder must attach a residue branch and return every
    exact source tuple with an independently verified elliptic sum. If it returns
    only a cell, valuation vector, rank drop, or candidate filter, the proposed
    mechanism has failed rather than succeeded.

  claim: >-
    CONDITIONAL ALGORITHM TARGET, NOT A RESULT. Fix m in {3,4}, a public
    factor base F of size B=N^beta, a target-independent integral lift rule, and a
    finite precision schedule. There may exist a fixed branch-and-Hensel decoder
    D such that, for a target R, D uses tropical initial-form cancellations to
    enumerate all and only the Semaev roots whose coordinates lift to points of F,
    returns exact signed point tuples summing to R, and has complete relation,
    factor-log, masked-target-descent, verification, retry, output, and peak-memory
    exponents below 1/2. The cheapest decisive test does not test that asymptotic
    claim. It tests the necessary interface: on exhaustive toy instances the
    decoder must have complete source recall, bounded ambiguity, and a cost
    advantage over the same Hensel decoder with its tropical branch order erased;
    the advantage must persist across independent integral lifts. A lift-sensitive
    advantage is a representation artifact and falsifies this version.

  mechanism: >-
    Semaev decomposition is first expressed over a fixed integral model. Monomial
    valuations identify cells in which at least two lowest terms can cancel.
    Instead of sending the whole system to a generic solver, the algorithm visits
    only those cells, solves each residue initial form, Hensel-lifts every residue
    root, maps the lifted coordinates back to exact points in F, and verifies the
    signed sum. The potential gain is a target-dependent branching reduction
    before nonlinear elimination. The public observable is the target-conditioned
    initial-form branch set. The decoder is the residue-root plus Hensel plus
    factor-base-index recovery path; it is mandatory. No target-specific chart,
    source-indexed advice, known logarithm, or live key enters the construction.

  novelty_status: unverified
  novelty_note: >-
    COMPLETE REPOSITORY SCREEN. All 79 current RQ-ECDLP-002 proposals, all 795
    proposal files, and the 1,166-file legacy ideas tree were screened, including
    deferred ECDLP-IDEA-103, ECDLP-IDEA-087, ECDLP-IDEA-098, rejected
    ECDLP-IDEA-085, ECDLP-IDEA-436, KN-OPEN-3417fc, and the p-adic/ramification
    records. The nearest record is deferred ECDLP-IDEA-103, which requires a
    finite source-faithful tropical atlas and exact residue/source inverse for the
    universal addition family. This proposal is a materially narrower special
    mechanism: one fixed integral Semaev system, its monomial initial forms, and a
    branch-and-Hensel decoder whose advantage must be invariant across coefficient
    lifts. ECDLP-IDEA-087 uses stable-log-map gluing components; ECDLP-IDEA-098
    uses a squarefree initial ideal and shelling facets; ECDLP-IDEA-085 uses
    exceptional-divisor valuation words; ECDLP-IDEA-436 measures valuations of a
    canonical lift of a single prime-to-p torsion point. None has the same
    lift-ensemble falsifier or the same fixed initial-form-to-exact-source decoder
    interface. This is at most a speculative specialization until external and
    independent review; absence from the screen is not evidence of novelty.

  primary_sources_checked:
    - >-
      Igor Semaev, Summation polynomials and the discrete logarithm problem on
      elliptic curves, IACR ePrint 2004/031,
      https://eprint.iacr.org/2004/031.pdf. The paper supplies the summation-
      polynomial decomposition equation; it supplies no tropical decoder.
    - >-
      Paul Alexander Helminck, Faithful tropicalizations of elliptic curves using
      minimal models and inflection points, arXiv:1809.09892,
      https://arxiv.org/abs/1809.09892. The paper distinguishes numerical from
      faithful tropicalization and proves a curve-embedding statement under
      non-archimedean hypotheses; it does not provide finite-field source recovery
      for Semaev fibers.
    - >-
      Amadori, Pintore, and Sala, On the discrete logarithm problem for prime-field
      elliptic curves, IACR ePrint 2017/609,
      https://eprint.iacr.org/2017/609.pdf. It supplies the prime-field PDP,
      relation-matrix, and factor-base path that this decoder must complete.

  assumptions:
    - >-
      E/F_p is a public ordinary curve with a public prime-order subgroup
      G=<P> of order N asymptotic to p; only public or generated toy instances are
      used.
    - >-
      The factor base, arity, signed-source convention, integral polynomial model,
      coefficient lifts, valuation field, precision schedule, branch order, and
      independent verifier are frozen before targets are sampled.
    - >-
      Every accepted branch returns exact factor-base indices and signs. A branch
      that reports only existence, a root count, or a coordinate outside F earns
      no relation credit.
    - >-
      Setup, valued extensions, coefficient height, precision limbs, failed
      branches, residue solves, Hensel steps, emitted roots, retries, factor-log
      linear algebra, masked descent, verification, and serialized bytes are
      charged.
    - >-
      No finite-size exponent is transferred to cryptographic sizes without a
      separately validated scaling assumption and independent review.

  proof_search_map:
    bottleneck: >-
      Remove the generic polynomial-membership solve by proving that a
      target-uniform set of initial-form branches can be traversed and inverted to
      exact source tuples with total query and output cost below the rho boundary.
    baseline_embedding:
      parameter_slice: >-
        With all valuation branches tied, or with branch priority randomly
        permuted, the procedure is exactly the same residue/Hensel solver without
        tropical pruning. With one chart per source tuple it is explicit
        enumeration and receives no compression credit.
      reproduction_check: >-
        Exhaustive truth through 16-bit subgroup order must reproduce every
        Semaev decomposition and the unpruned solver's identical accepted-source
        set before any timing or pruning ratio is read.
    observation_collision:
      observable: >-
        The ordered monomial-valuation vector and residue initial form of a target
        branch.
      distinct_preimage_search: >-
        Exhaustively find distinct source tuples and distinct coefficient lifts
        with the same observable. Every collision must either be separated by the
        declared residue/Hensel state or retained in the output list. One lost
        source falsifies completeness; an ambiguity list as large as exhaustive
        search falsifies the cost mechanism.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace one dense Semaev solve by a finite initial-form branch graph with
          exact residue roots and Hensel edges.
        predicted_gain: >-
          Fewer nonlinear branches visited per accepted relation, without losing
          source labels.
      - transform: observable_fiber
        proposed_object: >-
          Hold the tropical branch observable fixed while changing integral lifts
          and residue roots.
        predicted_gain: >-
          Distinguish lift-stable geometric pruning from a coefficient-encoding
          artifact before any scaling claim.
    quantifier_order: >-
      THERE EXISTS one target-independent lift rule, precision schedule, and
      decoder D such that FOR ALL targets in the declared toy family and FOR ALL
      valid factor-base source tuples, D returns that tuple, while FOR RANDOM
      blinded targets its expected complete cost, including retries and output,
      is below the declared bound. D may not be selected after seeing a target.
    method_ceiling:
      strongest_certifiable_claim: >-
        The proposed test can certify only exact toy source recovery and a measured
        branch-cost ratio under the frozen lift ensemble. It cannot certify a
        cryptographic exponent, source-faithful tropicalization in general, or an
        ECDLP improvement.
      nearby_object_control: >-
        A random polynomial system matched in variable count, degree, monomial
        support, coefficient-valuation histogram, and number of residue roots. A
        pruning ratio shared with this null is solver behavior, not elliptic
        structure.
    proof_obligations:
      - claim: The unpruned slice reproduces exhaustive Semaev source truth.
        responsibility: baseline
      - claim: Every retained initial-form branch lifts to all exact residue roots.
        responsibility: correctness
      - claim: Every exact source is returned with its signs and multiplicities.
        responsibility: correctness
      - claim: Branch and output counts stay below the claimed bounds.
        responsibility: size
      - claim: Per-attempt cost times inverse success probability is below rho.
        responsibility: runtime
      - claim: Peak valued-state and output memory is below the stated cap.
        responsibility: memory
      - claim: Lift-ensemble invariance separates mechanism from encoding artifact.
        responsibility: strictness
      - claim: The decoder uses only public target-dependent data.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: exact source recall against exhaustive truth
      direction: higher
      minimum_effect: >-
        1.000000 on every completed toy cell; one missed tuple falsifies this
        decoder interface.
    - metric: verified false-source rate after elliptic point-sum checking
      direction: lower
      minimum_effect: >-
        Exactly zero; every accepted tuple carries a replayable point-sum
        certificate.
    - metric: median visited-branch ratio versus the branch-order-erased decoder
      direction: lower
      minimum_effect: >-
        At most 0.70 on each of three increasing sizes and at least two arities,
        with the same accepted-source set.
    - metric: variation of the pruning ratio across independent integral lifts
      direction: lower
      minimum_effect: >-
        Coefficient of variation at most 0.10 and no monotone collapse toward 1 as
        the lift randomization amplitude increases.
    - metric: pruning ratio on the support-and-valuation-matched random-system null
      direction: different
      minimum_effect: >-
        The elliptic arm must improve by at least 0.15 absolute beyond the null;
        otherwise the observed pruning is not target-specific elliptic structure.

  minimal_test:
    design: >-
      On at least six public toy curves at subgroup sizes 12, 14, and 16 bits,
      arities m in {3,4}, and two factor-base sizes per cell, enumerate exhaustive
      source truth. Run the exact same residue/Hensel backend in four arms: frozen
      tropical branch order, branch-order-erased baseline, ten independent
      coefficient lifts obtained by adding declared p-multiples without changing
      the reduced Semaev system, and a random polynomial system matched in degree,
      support, valuation histogram, and root count. Blind each target as R+[t]P,
      retain the public mask only for final verification, and emit a certificate
      for every tuple. Stop before larger sizes if recall is below one, if any
      branch depends on target-specific advice, or if the lift-decay control fires.
    controls:
      - exhaustive source truth and unpruned residue/Hensel baseline
      - same-shape random polynomial null with matched monomial valuations
      - ten coefficient-lift variants reducing to the identical F_p system
      - source-label permutation preserving all tropical coordinates
      - planted sparse initial-form system with a known unique Hensel lift
      - matched Pollard rho and memory-matched BSGS operation accounting
    required_metrics:
      - source recall, multiplicity recall, false-source count, and certificate pass fraction
      - initial-form cells, residue roots, Hensel branches, failures, and retries per target
      - base-field operations, precision-limb operations, serialized bytes, wall time, and peak memory
      - branch ratio by lift, size, arity, and null arm with confidence intervals
      - factor-base relation rank credit and complete masked-target ambiguity

  falsification_conditions:
    - Any valid exhaustive source tuple is absent from the decoder output.
    - Any accepted tuple fails independent point membership or signed-sum verification.
    - >-
      The apparent advantage vanishes or changes sign as p-multiple coefficient
      randomization increases while the reduced polynomial is unchanged.
    - >-
      The same-shape random polynomial null matches the elliptic pruning ratio
      within 0.15 on every completed cell.
    - >-
      Source ambiguity, atlas state, precision, or complete cost has lower
      confidence exponent at least 1/2 on every tested scaling fit.
    - The decoder selects a lift, chart, branch order, or precision after seeing the target.

  confounders:
    - >-
      A coefficient lift can change valuations without changing the F_p equation;
      this is the primary artifact and is why the lift ensemble is blocking.
    - >-
      Tropical pre-variety membership can include spurious cells that are not in
      the tropical variety; residue and Hensel checks must retain this distinction.
    - >-
      Counting cells but not residue-root multiplicity can hide the original
      source enumeration in one large cell.
    - >-
      Reusing known toy logarithms to index factor-base points would silently
      supply the decoder the answer; source indices come only from public
      coordinate membership.
    - >-
      Timing different solver backends would confound branch ordering with
      implementation; every arm uses the same backend and cost unit.

  interpretation_limits:
    - >-
      This is a proposed toy decoder test, not an experiment, result, algorithmic
      improvement, approval, or breakthrough claim.
    - >-
      A valid tropicalization, a small cell count, or one recovered relation is
      not evidence for a full index-calculus path.
    - >-
      No observation transfers to cryptographic sizes without separate evidence
      for branch, precision, density, rank, descent, and memory scaling.
    - >-
      Timeouts, crashes, unavailable software, and invalid certificates are
      infrastructure outcomes, not evidence against the mathematical mechanism.

  heuristic_assumptions:
    - id: H-TROP-1
      statement: >-
        For the frozen lift ensemble and declared parameter family, the number of
        source-bearing initial-form branches per random blinded target is
        N^{theta+o(1)} with one target-independent theta<1/2, uniformly over the
        declared arities and lift-randomization amplitude.
      rigorous_support: >-
        Rigorous facts: the fundamental theorem of tropical geometry relates
        valuations of algebraic roots to the tropical variety, and every exact
        F_p source is checked by the Semaev identity after reduction. Random-model
        component: branch occupancy is modeled by a support-and-valuation-matched
        random polynomial ensemble. Neither fact supplies the claimed theta.
      validation_plan: >-
        Measure complete branch-count distributions over all targets through 16
        bits and random blinded samples thereafter; compare empirical CDFs and
        upper tails against the matched random ensemble; fit theta separately for
        every lift and require stability. Tail check: maximum branch count and
        ambiguity at each size, not only the mean. Transfer beyond toy scale is
        explicitly unvalidated.
    - id: H-TROP-2
      statement: >-
        Conditional on a source-bearing initial form, residue roots lift with
        bounded expected multiplicity N^{o(1)}, and the lift failure/retry law is
        stable across coefficient lifts of the same reduced system.
      rigorous_support: >-
        Simple nonsingular roots satisfy the ordinary Hensel uniqueness condition;
        the random-model extension treats singularity and collision events like
        those in the matched residue-root ensemble. Singular Semaev fibers are not
        covered by the theorem and are retained as a separate stratum.
      validation_plan: >-
        Stratify roots by Jacobian rank, record complete multiplicity and retries,
        compare nonsingular cells to the forced unique-lift value, and compare
        singular tails across the lift ensemble and random-system null. One
        unrecorded or lost branch falsifies the operational assumption.

  target_complexity:
    time_exponent: >-
      Conditional target below N^{1/2}; no exponent is claimed. If B=N^beta,
      setup=N^a, one decoded attempt=N^q, reciprocal relation and target success
      probabilities=N^delta and N^delta_t, source output=N^o, factor-log linear
      algebra=N^ell, and final ambiguity=N^u, then the target is
      max(a,beta+delta+q+o,ell,delta_t+q+o+u)<1/2.
    memory_exponent: >-
      Conditional target max(a_m,q_m,beta+o,ell_m,u)<1/2, with every chart,
      precision limb, branch, residue root, source tuple, and verifier buffer
      counted.
    best_known: >-
      Pollard rho at approximately 0.886*sqrt(N) group operations with constant
      state, and BSGS at sqrt(N) time and sqrt(N) memory. The prime-field
      Semaev/PDP route has no established fully charged sub-rho algorithm.
    hidden_overhead: >-
      Valued-field arithmetic, coefficient height, precision growth, singular-root
      branching, chart construction, output serialization, and inverse success
      probabilities; none is hidden as polylogarithmic without measurement.
    tradeoff_note: >-
      Setup is curve and factor-base specific and is charged once. Per-target work
      is reported separately and compared to the memory-matched generic
      preprocessing frontier. Parallel branches reduce wall time only; their total
      work and combined peak live memory remain charged.

  complete_cost_boundary:
    preprocessing: >-
      Integral Semaev model, all lift variants, branch graph, factor-base index,
      and any target-independent residue tables.
    advice: >-
      No target-specific advice. All coefficients, charts, and branch priorities
      are serialized and their full byte size charged.
    target_dependent_work: >-
      Initial-form evaluation, branch traversal, residue solves, Hensel lifts,
      factor-base lookup, source output, and masked descent.
    success_and_retries: >-
      Charge inverse relation density, lift failures, singular branches, masked
      target failures, and every retry.
    memory: >-
      Peak simultaneous live branches plus shared tables and complete emitted
      ambiguity; not a maximum of isolated branch peaks.
    data_queries: >-
      Public curve and factor-base data only; count each membership test and table
      probe. No oracle or deployed target is used.
    verification: >-
      Independent point-on-curve, factor-base-membership, signed-sum, factor-log,
      and final [k]P=Q checks.
    multi_target: >-
      Report setup once and per-target cost for T targets; compare total setup plus
      T queries against matched multi-target rho, without amortizing at T=1.
    matched_baselines:
      - Pollard rho in group operations and converted base-field operations
      - memory-matched BSGS
      - branch-order-erased residue/Hensel decoder
      - support-and-valuation-matched random polynomial system

  dominated_by: >-
    No result is claimed, so the research record is dominated on attack cost by
    Pollard rho and BSGS. The relevant Pareto rows checked also include the generic
    preprocessing tradeoff, multi-target rho, the ordinary Semaev/PDP baseline,
    and existing ECDLP-IDEA-103's broader theorem-gated atlas. This proposal offers
    only a cheaper falsification slice; it does not dominate any attack row.
  sota_delta:
    time_exponent: '0; no attack or measured improvement is claimed'
    memory_exponent: '0; no attack or measured improvement is claimed'
    data_or_query_exponent: '0; public toy inputs only'
    note: >-
      The quantitative research delta is a blocking interface: exact source recall
      1.0, false-source rate 0, visited-branch ratio at most 0.70, and at least 0.15
      separation from the matched random null. Until those gates are observed and
      independently reviewed, the attack delta is exactly none.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    The proposed minimal test is exhaustive only through 16 bits, maximum one
    bounded run family, and should fit within a few CPU-hours and 4 GB. This record
    authorizes neither implementation nor execution.
  recommended_priority: medium
