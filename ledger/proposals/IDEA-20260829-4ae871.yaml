  assumptions:
    - >-
      The module-Kannan embedding above is a correct lattice formulation of
      the ML-DSA key-recovery instance, and the R-multiples of (s1, s2, 1)
      lie in it. This is an algebraic identity to be verified symbolically in
      stage 1, not assumed.
    - >-
      The rotations X^i (s1, s2, 1) for i = 0..255 are linearly independent
      over Z and near-orthogonal, so vol(D)^(1/256) is approximated by the
      secret norm. Stage 1 computes vol(D) exactly for the scaled instances
      and reports the approximation error rather than assuming it is small.
    - >-
      A crossover measured at ring degree 16-64 transfers to degree 256 only
      through an explicitly fitted and stated extrapolation (stage 6).
  proof_search_map:
    bottleneck: >-
      The single inequality deciding whether the dense submodule is inserted
      before a secret-length vector is, i.e. whether
      log2 vol(D) is below the sum of the last r log Gram-Schmidt norms, and
      whether that inequality is governed by Z-ranks (2048 = d - r) or by
      module ranks (8 = module rank - 1).
    baseline_embedding:
      parameter_slice: >-
        Ternary NTRU at n = 256 with q swept through 0.004 n^2.484 = 3904,
        which is the published fatigue point and the exact boundary case
        r/d = 1/2 of the same inequality.
      reproduction_check: >-
        Numeric: the implemented crossover must land on the published fatigue
        point within the tolerance the source states. Symbolic: at r = d/2 the
        general inequality must reduce algebraically to the NTRU form. Both
        run before any ML-DSA row is computed.
    observation_collision:
      observable: >-
        The pair (event label, block size at which the event fires), where the
        event label is DSD or SKR.
      distinct_preimage_search: >-
        The collision to hunt is a vector that is BOTH as short as the secret
        AND an element of D -- which would make the two events
        indistinguishable by norm alone and would silently convert every
        SKR into a reported DSD. This is why the event label is assigned by an
        exact R-multiple membership test on the inserted vector and never by a
        norm threshold. A second collision: two instances with identical
        (r/d, Delta) but different crossover block sizes would falsify the
        claim that the projected pair is a sufficient statistic, and stage 4
        must include at least two instances per (r/d, Delta) cell to look for
        it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The key-recovery instance re-presented as a module over R with an
          explicit rank-1 dense submodule, so that the hypothesis "the secret
          is short" becomes an exact statement about a submodule covolume
          rather than about a single vector.
        predicted_gain: >-
          If the algebraic Pataki-Tural condition scales with module rank
          rather than Z-rank, the required root-Hermite factor at ML-DSA-44
          relaxes from delta below 1.00143 to something in the range attained
          at block sizes comparable to or below beta_SKR. Predicted gain if
          the substitution holds and algebraic LLL's field-degree cost does
          not eat it: MLWE binds at beta_DSD instead of beta_SKR, moving the
          binding assumption at that category. Predicted gain if it does not
          hold: zero, and a closure with a measured obstruction.
      - transform: stronger_invariant
        proposed_object: >-
          Track the covolume of the projected submodule pi_tail(D) rather than
          only the norm of the shortest vector, since the covolume is what
          survives recursion through BKZ tours while the shortest-vector norm
          does not.
        predicted_gain: >-
          Makes the one-step propagation measurable per tour, which is what
          converts stage 4 from a pass/fail into a curve.
    quantifier_order: >-
      FOR EACH FIPS 204 category k and FOR EACH of the two named detectability
      conditions (Euclidean Pataki-Tural, algebraic Pataki-Tural), THERE
      EXISTS a computed pair (beta_SKR(k), beta_DSD(k)) and a margin. The
      claim is NOT the universal statement that no dense-submodule attack can
      ever beat SKR at these parameters; it is the existential statement that
      THESE TWO named conditions, at THESE parameters, give THIS margin. A
      third condition from an unread paper could change the answer, which is
      exactly why stage 3 reads two of them.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under [named condition], at FIPS 204's exact parameters, the DSD
        event requires block size beta_DSD(k) against beta_SKR(k) for secret
        key recovery, a margin of M(k) in block size and B(k) in classical
        core-SVP bits, validated at ring degree 16-64 with the stated
        extrapolation." The method can never certify that ML-DSA's MLWE
        instance has no exploitable algebraic structure of any kind, and
        cannot certify anything about MSIS or SelfTargetMSIS.
      nearby_object_control: >-
        Ternary NTRU at n = 256, q = 8380417 -- the SAME modulus ML-DSA uses,
        in a rank-2 module. That object IS overstretched by more than three
        orders of magnitude past its fatigue point. A method that cannot
        cleanly separate ML-DSA's rank-9 module from NTRU at the identical
        modulus has not identified the load-bearing structure, and this pair
        is the sharpest available discriminator because the modulus is held
        fixed and only the module rank varies.
    proof_obligations:
      - claim: "The R-multiples of (s1, s2, 1) lie in the module-Kannan lattice."
        responsibility: correctness
      - claim: "The implemented crossover reproduces the published ternary-NTRU fatigue point at n = 256."
        responsibility: baseline
      - claim: "At r = d/2 the general inequality reduces symbolically to the NTRU form."
        responsibility: strictness
      - claim: "DSD and SKR events are separated by an exact membership test, not a norm threshold."
        responsibility: interface
      - claim: "vol(D) is computed exactly at scaled parameters and the near-orthogonality approximation's error is reported."
        responsibility: size
      - claim: "The null instance, with no dense submodule, never produces a DSD event."
        responsibility: correctness
      - claim: "Algebraic LLL's cost dependence on field degree is extracted before any algebraic threshold is reported as a gain."
        responsibility: runtime
      - claim: "The degree-16-to-256 extrapolation is stated as an extrapolation with its fit interval."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "Euclidean margin beta_DSD(k) - beta_SKR(k) at ML-DSA-44/65/87"
      direction: higher
      minimum_effect: >-
        Predicted strictly positive and large -- at least 200 in block size at
        every category, from the (d - r) = 2048/2816/3840 factor in the
        threshold. A margin below 50 anywhere would be the surprising outcome
        and would justify an immediate escalation.
    - metric: "Algebraic margin beta_DSD_alg(k) - beta_SKR(k), same categories"
      direction: different
      minimum_effect: >-
        Unpredicted by design; this is the discriminating quantity. Positive
        and large means the module structure buys the attacker nothing and the
        lane closes with a measured obstruction. Zero or negative at any
        category means MLWE binds at a block size no record in this program
        has computed, and the record must escalate rather than report.
    - metric: "FORCED CONTROL 1: fatigue point reproduced for ternary NTRU at n = 256"
      direction: different
      minimum_effect: "must land on 0.004 * n^2.484 within the source's stated tolerance, or every ML-DSA row is void"
    - metric: "NULL: DSD event rate on the no-dense-submodule instances"
      direction: lower
      minimum_effect: "must be exactly zero over all trials; any non-zero count voids stage 4"
    - metric: "Density deficit Delta(k) and module-rank ratio r/d, recomputed in-harness"
      direction: different
      minimum_effect: >-
        Must reproduce the scout values 4.222/4.401/5.046 and 1/9, 1/12, 1/16
        to within 0.02 bits, or the recalled parameter table is wrong and
        everything downstream is void.
  minimal_test:
    design: >-
      THE CHEAPEST DISCRIMINATOR IS STAGES 1-2 PLUS FORCED CONTROL 1: closed-
      form arithmetic, zero lattice reduction, minutes of compute. That alone
      decides the Euclidean row and either closes it with a number or
      escalates. Stage 3 is a full-text read of two papers. Stage 4-5 is the
      only part needing real compute: reduced-degree module instances at
      n in {16, 32, 64}, module ranks holding r/d = 1/9, q swept across the
      predicted thresholds, BKZ via fplll/G6K plus the released algebraic LLL,
      with per-tour event labelling by exact R-multiple membership. Budget:
      single workstation, days not weeks, because ring degree 64 with module
      rank 9 is dimension 576 and the sweep is over q, not over dimension.
      THIS DISCRIMINATES because FORCED CONTROL 1 has a value known in advance
      from the literature, because the NULL has a value forced to zero, and
      because the Euclidean and algebraic conditions make DIFFERENT
      predictions for the same measured instances -- so stage 4 adjudicates
      between two named theories rather than measuring one.
    controls:
      - "FORCED CONTROL 1: reproduce the published ternary-NTRU fatigue point at n = 256 with the same code path."
      - "FORCED CONTROL 2: symbolic reduction of the general inequality to the NTRU form at r = d/2."
      - "NULL OBJECT: same lattice shape with a non-short generator; DSD must never fire."
      - "TWO INSTANCES PER (r/d, Delta) CELL, to test whether the projected pair is a sufficient statistic."
      - "EVENT LABELLING by exact algebraic membership, never by norm threshold."
      - "MODULUS-HELD-FIXED CONTROL: ternary NTRU at q = 8380417, which must come out massively overstretched, against ML-DSA's rank-9 module at the same q."
    required_metrics:
      - "Delta(k) and r/d per category, recomputed in-harness"
      - "beta_SKR(k), beta_DSD(k) Euclidean, beta_DSD_alg(k) algebraic, and both margins"
      - "per-tour event log with event labels and the block size at first DSD and first SKR, for every scaled instance"
      - "null-instance DSD count (must be zero) and its trial count"
      - "algebraic LLL cost as a function of field degree, as extracted from ePrint 2024/844"
      - "the fitted degree-to-margin curve with interval, and the stated extrapolation to n = 256"
  falsification_conditions:
    - "FORCED CONTROL 1 fails: the implemented crossover misses the published NTRU fatigue point. Nothing is reportable; the instrument is wrong."
    - "The NULL produces any DSD event: the membership test or the instance generator is broken; stage 4 is void."
    - "Euclidean margin is large at all three categories AND the algebraic condition, once read, scales with Z-rank rather than module rank: the lane closes at the section-4 standard with the (d - r) obstruction named and measured, and forward guidance points at multi-generator submodules and at the MSIS/SelfTargetMSIS lattice, which this record does not touch."
    - "Algebraic LLL's cost is exponential in the field degree at the rate needed here: the algebraic threshold, however favourable, is unreachable, and that is a closure with a runtime obstruction rather than a geometric one."
    - "Algebraic margin is zero or negative at any category and survives the controls: escalate; do not report. This is the outcome that would contradict a fielded standard and it is routed to independent review before it leaves the program."
    - "Two instances in the same (r/d, Delta) cell give crossover block sizes differing by more than the fit interval: the projected pair is not a sufficient statistic and the object must be enriched before any FIPS 204 row is claimed."
  confounders:
    - "The near-orthogonality approximation for vol(D). At small ring degree the rotations of a short element are measurably non-orthogonal; stage 1 computes vol(D) exactly for the scaled instances, so the approximation is only used at n = 256 and its error is reported, never assumed."
    - "BKZ implementations insert vectors for reasons other than the two named events (preprocessing, randomisation, early-abort). The per-tour log must classify every insertion, and unclassifiable insertions are reported as a third category rather than folded into either event."
    - "Ring degree 16-64 is far from 256 and the GSA is known to be least accurate at small dimension. This is the single largest threat to transfer and is why stage 6 is a stated extrapolation with an interval rather than a claim."
    - "Module rank and Z-rank ratio are confounded in the scaled instances if (l, k) is varied together with n. Hold r/d fixed while varying n, and vary r/d only at fixed n, in separate sweeps."
    - "The recalled FIPS 204 parameter table. If eta, k or l is wrong, Delta is wrong. The first in-harness step re-derives Delta from primary text."
  interpretation_limits:
    - "No forgery, no key recovery, no certified break at any parameter set. The deliverable is a distance."
    - "Toy tier for anything measured at ring degree 16-64, per RQ-MLDSA-001's claim_tier_ceiling. The FIPS 204 rows are closed-form arithmetic under a named condition, not measurements."
    - "A closure here closes exactly the rank-1 dense submodule generated by the secret under the two named detectability conditions. It says nothing about submodules with more than one generator, about the MSIS or SelfTargetMSIS lattices, or about any condition not read."
    - "The comparison to NTRU is structural, not a claim that ML-DSA is an NTRU variant. Module rank is precisely the difference and precisely what is measured."
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a BKZ-beta-reduced basis of the module-Kannan lattice LAMBDA of
        dimension d and determinant q^(256 k), the Gram-Schmidt profile
        follows the geometric series assumption log2 ||b*_i|| = log2 ||b*_1||
        + (i - 1) log2 alpha with alpha = delta(beta)^(-2), uniformly for
        i outside the first and last 4 percent of indices and for beta in
        [40, 200] at ring degree n in [16, 64] and module rank in [3, 16].
      rigorous_support: >-
        The Pataki-Tural lemma is a rigorous inequality bounding the covolume
        of any rank-r sublattice below the product of the last r Gram-Schmidt
        norms; it is exact and assumes nothing. What is assumed is only the
        SHAPE of the profile, and the classical statement it imitates is the
        geometric series assumption of Schnorr, which is the standard model
        under which every core-SVP estimate in this ledger and in FIPS 204's
        own lineage is computed.
      validation_plan: >-
        Sample 200 independent ML-DSA-shaped module instances per cell at each
        n in {16, 32, 64} and each module rank in {3, 6, 9, 12}, reduce at
        beta in {40, 60, 80, 100}, and record the full Gram-Schmidt profile.
        Compare the empirical log-profile against the GSA line by least
        squares; report the residual slope and the head/tail deviation. TAIL
        CHECK, and it is the one that matters here because the claim depends
        on the LAST r norms specifically: report the empirical product of the
        last r Gram-Schmidt norms against the GSA prediction for that product,
        per instance, and report the WORST instance's ratio, not the mean --
        a heavy lower tail in the tail product silently makes DSD look
        unreachable when it is not. SAMPLED PARAMETERS recorded per cell.
        TRANSFER ASSUMPTION: that the residual and tail behaviour at n = 64
        extrapolates to n = 256; stated, fitted, and never assumed.
    - id: H2
      statement: >-
        The 256 rotations X^i (s1, s2, 1), i = 0..255, of the ML-DSA secret
        generate a Z-lattice D of rank exactly 256 whose covolume satisfies
        log2 vol(D) = 256 log2 ||(s1, s2, 1)|| + O(1), with the O(1) term
        bounded by 0.05 * 256 bits with probability at least 0.99 over the
        key-generation randomness of FIPS 204.
      rigorous_support: >-
        Rigorous ingredient: for any lattice, Hadamard gives
        vol(D) <= PROD ||v_i||, so the stated equality can only fail in one
        direction and the O(1) term is one-sided. The classical distribution
        statement it imitates is that the rotations of a random element of a
        cyclotomic ring behave like independent random vectors of their norm,
        for which the expected orthogonality defect is O(1) per dimension --
        the same assumption used throughout ideal-lattice cryptanalysis.
      validation_plan: >-
        At n in {16, 32, 64, 128} sample 10,000 ML-DSA-distributed secrets per
        n (uniform coefficients in [-eta, eta]), compute vol(D) EXACTLY by
        Gram determinant, and compare log2 vol(D)/r against log2 ||s||. Report
        the empirical CDF of the orthogonality defect against the prediction
        that it is O(1) per dimension, and TAIL CHECK on the 100 largest
        defects: if the upper tail grows with n, the approximation used at
        n = 256 in clause (C) is unsafe and Delta must be recomputed with a
        defect correction. Sampled parameters and the eta value recorded per
        cell. TRANSFER ASSUMPTION: degree 128 to 256, one doubling, stated.
    - id: H3
      statement: >-
        The algebraic geometric series assumption of ePrint 2024/844 holds for
        ML-DSA-shaped modules of rank l + k + 1 in [3, 16] over the power-of-
        two cyclotomic of degree n in [16, 64], in the same sense and over the
        same index range as H1 holds for the Euclidean profile.
      rigorous_support: >-
        Rigorous ingredient: the algebraic Pataki-Tural lemma itself, which
        the source proves for modules over any number field and which, like
        its Euclidean counterpart, is an inequality assuming nothing. The
        classical statement imitated is again Schnorr's GSA, transported to
        the profile of ideal norms. NOTE HONESTLY: the source states and
        verifies its algebraic GSA for rank-2 modules (the NTRU case); its
        validity at rank 9 to 16 is an EXTENSION this record proposes to test,
        not a result to inherit.
      validation_plan: >-
        Run the released algebraic LLL on the same instances used for H1,
        record the profile of ideal norms, and fit the algebraic GSA. Compare
        the predicted algebraic DSD threshold against the OBSERVED first-DSD
        block size, per instance. TAIL CHECK: report the instances where the
        observed threshold is EARLIER than predicted, since an early DSD is
        the outcome that would matter and an averaged fit would hide it.
        Cross-validate at rank 2, where the source's own verification applies,
        before trusting any rank-9 row. Sampled parameters recorded.
        TRANSFER ASSUMPTION: rank 2 to rank 9 and degree 64 to 256, both
        stated, both fitted, neither assumed.
  target_complexity:
    time_exponent: >-
      The object is a crossover, so the target is a change in WHICH exponent
      applies to MLWE key recovery at FIPS 204 parameters. Incumbent:
      2^(0.292 beta_SKR + o(beta)) classical core-SVP with beta_SKR the
      unique-SVP block size (recalled as roughly 423 at ML-DSA-44, itself
      disputed inside this ledger by 591f9d). Target if the algebraic
      condition scales with module rank: 2^(0.292 beta_DSD_alg + o(beta)) with
      beta_DSD_alg to be computed. PREDICTED, and stated so the record cannot
      be read as a claim: beta_DSD_alg is LARGER than beta_SKR at every
      category and the incumbent exponent stands.
    memory_exponent: >-
      2^(0.2075 beta) for either event under the sieve model, charged
      identically in every row; no row is reported memory-free. The DSD event
      needs no additional storage beyond the reduction itself, so this record
      introduces no new memory term and no memory-for-time trade of its own.
    best_known: >-
      Primal unique-SVP on the MLWE key instance at 2^(0.292 beta_SKR), which
      is what FIPS 204's lineage reports and what every prior RQ-MLDSA-001
      record assumes without checking for a competing event.
    hidden_overhead: >-
      Two, both disclosed. First, algebraic LLL's cost depends on the field
      degree and that dependence is UNREAD; a favourable algebraic threshold
      reached only by an algorithm exponential in degree 256 is not a gain,
      and stage 3 item (iv) exists to price it. Second, the o(beta) in both
      core-SVP figures hides the usual sieve overheads, which are charged
      identically on both sides so that the MARGIN, which is what this record
      reports, is insensitive to them -- this is the reason the deliverable is
      a margin rather than an absolute block size, given 591f9d's documented
      355-in-beta instrument discrepancy.
    tradeoff_note: >-
      No new time-memory tradeoff is introduced. The van Oorschot-Wiener style
      interpolation is not applicable: neither event is a claw search. If the
      algebraic route were to win, its parallelization position would need
      separate treatment because algebraic LLL is far less studied for
      parallel execution than sieving is, and that gap is named here rather
      than papered over.
  dominated_by: >-
    n/a for the measurement itself (no attack result is claimed), but the
    Pareto rows were checked rather than waved at. Time/memory/data frontier
    for MLWE key recovery at ML-DSA parameters: (i) primal unique-SVP,
    2^(0.292 beta_SKR) time, 2^(0.2075 beta_SKR) memory, no data beyond the
    public key -- dominates any DSD route whose beta_DSD exceeds beta_SKR,
    which is the predicted case; (ii) dual/dual-sieve, same data, contested
    heuristic, treated in IDEA-20260829-a9d9b7; (iii) hybrid guess-and-lattice
    routes, treated in IDEA-20260829-bb336b; (iv) signature-transcript routes
    (IDEA-20260821-4d4e5f, and the t0 lane of RQ-MLDSA-ffa0f5), which consume
    data this record's adversary does not have and therefore sit on a
    different data axis rather than dominating. On the algebraic side no row
    exists in this ledger at all, which is the gap. If the predicted closure
    lands, this record is dominated by (i) on every axis and says so; if it
    does not, (i) is dominated on the time axis and the record escalates.
  sota_delta: >-
    Quantitatively, the deliverable is the pair of margins
    (beta_DSD - beta_SKR) Euclidean and algebraic, per category, in block size
    and in classical core-SVP bits. Against the incumbent, whose value for
    that margin is not "large" but UNSTATED -- no record in this program or in
    anything read this session gives a number for it at FIPS 204 parameters.
    The smallest margin this record would treat as a genuine finding rather
    than instrument noise is 50 in block size, given the 355-in-beta
    instrument discrepancy 591f9d documents; anything smaller is reported as
    below the instrument's resolution and routed to a calibration task first.
