idea:
  id: IDEA-20260829-4ae871
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    ML-DSA's key lattice contains a rank-1 dense SUBMODULE (the R-rotations of
    the secret) exactly as NTRU does, but at module-rank ratio 1/9, 1/12, 1/16
    instead of NTRU's 1/2. Compute the DSD-versus-SKR crossover for that
    structure under BOTH the Euclidean Pataki-Tural condition and Karenin-
    Kirshanova's ALGEBRAIC Pataki-Tural lemma, and report the distance from
    FIPS 204 to the module fatigue point in block size, not in adjectives.
  class: mechanism
  claim: >-
    (A) THE STRUCTURE, STATED EXACTLY. Write the ML-DSA key equation
    t = A s1 + s2 over R = Z[X]/(X^256 + 1), q = 8380417. The module-Kannan
    embedding
    LAMBDA = {(x, y, z) in R^l x R^k x R : y = A x + t z mod q}
    is a Z-lattice of dimension d = 256 (l + k + 1) and determinant q^(256 k).
    It contains the R-SUBMODULE D generated by the single element
    (s1, s2, 1), because for every i the rotation X^i (s1, s2, 1) again
    satisfies the defining congruence. D therefore has Z-rank r = 256 and is
    spanned by 256 vectors of norm approximately ||(s1, s2, 1)||. THIS IS THE
    SAME OBJECT THAT DRIVES THE NTRU OVERSTRETCHED PHENOMENON -- in NTRU the
    dense submodule is the rank-1 R-module generated by (f, g) inside a rank-2
    module, i.e. r/d = 1/2. In ML-DSA it is a rank-1 R-module inside a rank
    (l + k + 1) module, i.e. r/d = 1/9 at ML-DSA-44, 1/12 at ML-DSA-65 and
    1/16 at ML-DSA-87.
    (B) THE TWO EVENTS, AND WHY "WHICH ASSUMPTION BINDS" DEPENDS ON THEM.
    Ducas and van Woerden separate lattice reduction on an NTRU-shaped lattice
    into SKR (a vector as short as the secret enters the basis) and DSD (a
    vector of the dense sublattice enters the basis), and locate the fatigue
    point at the modulus where DSD becomes cheaper than SKR -- reported by
    them, per the search synthesis cited below, at q approximately
    0.004 n^2.484 for ternary NTRU. THIS PROGRAM HAS NEVER ASKED WHERE THAT
    CROSSOVER LIES FOR ML-DSA's MLWE INSTANCE. Every RQ-MLDSA-001 record that
    touches MLWE (IDEA-20260808-5a748c prices t0, IDEA-20260808-63427b treats
    the l-infinity conversion, IDEA-20260805-591f9d the norm budget) costs
    MLWE as an ORDINARY unique-SVP instance, i.e. it assumes SKR-first without
    checking. If DSD were cheaper at FIPS 204 parameters, MLWE would bind at a
    block size no RQ-MLDSA-001 record has computed and every "which of the
    three binds" statement in this lane would be answering with the wrong
    number for one of the three.
    (C) SCOUT ARITHMETIC, COMPUTED THIS SESSION IN EXACT/CLOSED FORM OUTSIDE
    THE HARNESS AND FLAGGED FOR RE-RUN. Using RECALLED FIPS 204 parameters
    (n = 256, q = 8380417, (k, l, eta) = (4, 4, 2) / (6, 5, 4) / (8, 7, 2)):
    define the DENSITY DEFICIT
    Delta = log2(det^(1/d)) - log2(vol(D)^(1/r)),
    which is the single scalar comparing how dense D is against how dense the
    ambient lattice is. With vol(D)^(1/r) approximated by the secret norm
    (rotations of a random ring element are close to orthogonal), this gives
    ML-DSA-44: d = 2304, log2 det = 1024 * 22.9986 = 23550.6,
    log2 det/d = 10.222, ||(s1, s2, 1)|| = sqrt(2048 * 2 + 1) = 64.0,
    log2 = 6.000, Delta = 4.222, r/d = 1/9;
    ML-DSA-65: d = 3072, log2 det/d = 11.499, ||s|| = sqrt(2816 * 20/3) =
    137.0, log2 = 7.098, Delta = 4.401, r/d = 1/12;
    ML-DSA-87: d = 4096, log2 det/d = 11.499, ||s|| = sqrt(3840 * 2) = 87.6,
    log2 = 6.453, Delta = 5.046, r/d = 1/16.
    For comparison, ternary NTRU AT the reported fatigue point (n = 256,
    q = 3904): d = 512, log2 det/d = 5.97, ||(f, g)|| = 18.5, log2 = 4.21,
    Delta = 1.76, r/d = 1/2.
    (D) THE EUCLIDEAN CONDITION AND ITS PREDICTED CLOSURE. Under the geometric
    series assumption with ratio alpha = delta^(-2), the product of the last r
    Gram-Schmidt norms is
    log2 PROD = r log2(det)/d + (r (d - r)/2) log2 alpha,
    so Pataki-Tural detectability of D (log2 vol(D) below that product)
    rearranges to the clean inequality
    DELTA > ((d - r)/2) * |log2 alpha| = (d - r) * log2 delta.
    At ML-DSA-44 that demands log2 delta below 4.222/2048 = 0.00206, i.e.
    delta below 1.00143 -- far stronger reduction than the block size at which
    SKR fires. PREDICTED OUTCOME, STATED BEFORE ANY RUN: the Euclidean
    analysis closes the lane, DSD requires a block size several hundred above
    the SKR block size, and the closure is a SECTION-4 closure with a measured
    obstruction (the (d - r) factor: the DSD threshold scales with the AMBIENT
    dimension minus the submodule rank, so a module of rank 9 pays 8/1 times
    the reduction quality NTRU's rank-2 module pays).
    (E) WHERE THE UPSIDE ACTUALLY LIVES, AND WHY THIS IS NOT A FOREGONE
    CONCLUSION. Karenin and Kirshanova (ePrint 2024/844, AFRICACRYPT 2024)
    prove an ALGEBRAIC analogue of the Pataki-Tural lemma over an arbitrary
    number field, formulate an algebraic DSD event and an algebraic geometric
    series assumption, and verify them with an implemented algebraic LLL. In
    that formulation the ranks entering the inequality are MODULE ranks
    (1 inside l + k + 1 = 9, 12, 16) and the norms are ideal norms, NOT the
    Z-ranks 256 inside 2304. If the algebraic condition has the same shape
    with (module rank - 1) replacing (d - r), the threshold at ML-DSA-44 reads
    Delta > 8 * |log2 alpha_alg| instead of 2048 * |log2 alpha| -- a
    difference of more than two orders of magnitude in the required reduction
    quality. WHETHER THAT SUBSTITUTION IS LEGITIMATE IS THE ENTIRE RESEARCH
    CONTENT and is what the minimal test decides. This record does NOT assert
    it; it asserts that nobody in this program has checked it and that the
    check is cheap.
    (F) WHAT IS NOT CLAIMED. No attack, no forgery, no key recovery, no
    assertion that ML-DSA is overstretched. The two possible deliverables are
    a measured closure with a named obstruction (predicted) or a measured
    crossover distance small enough to warrant an experiment at scale
    (not predicted, but not excluded).
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE. The tracked
    object is the R-submodule D generated by the secret, projected to the
    single scalar pair (r/d, Delta). This projection is genuinely lossy: it
    discards the actual coefficients of s1 and s2, the matrix A, the seed rho,
    and every algebraic invariant of D beyond its rank and covolume. It
    discards them COMPATIBLY with the operation that matters, because BKZ's
    insertion behaviour under GSA depends on the basis profile and on the
    covolume of the competing sublattice, not on which particular short
    generator D has. A change of coordinates it is not: two instances with the
    same (r/d, Delta) can have completely different secrets, and the
    propagation rule (one BKZ tour updates the profile, hence the tail product,
    hence the detectability margin) is defined without reference to the
    discarded data.
    STAGE 1, EUCLIDEAN BASELINE AND FORCED CONTROLS. Implement the Pataki-
    Tural/GSA inequality of clause (D) as a function of (d, r, det, vol(D),
    delta). FORCED CONTROL 1: instantiate it at ternary NTRU with n = 256 and
    sweep q; the crossover between the SKR block size (2016-estimate uSVP
    condition) and the DSD block size must land at the Ducas-van Woerden
    fatigue point 0.004 n^2.484 to within the tolerance those authors state.
    If it does not, the implementation is wrong and no ML-DSA row is
    reportable. FORCED CONTROL 2: at r = d/2 the inequality must reduce
    algebraically to the NTRU form; verify symbolically, not numerically.
    STAGE 2, EVALUATE THE EUCLIDEAN ROW AT FIPS 204. Report, per category,
    beta_SKR (unique-SVP), beta_DSD (Pataki-Tural), and the margin
    beta_DSD - beta_SKR in block size and in classical core-SVP bits under the
    ledger's pinned convention.
    STAGE 3, TRANSCRIBE THE ALGEBRAIC CONDITION. Read the FULL TEXT of ePrint
    2024/844 -- not the abstract -- and extract (i) the exact statement of the
    algebraic Pataki-Tural lemma, (ii) the algebraic GSA and what plays the
    role of delta in it, (iii) the algebraic DSD prediction and its stated
    validity range, and (iv) the field-degree dependence of algebraic LLL's
    cost, since a threshold that is favourable but only reachable by an
    algorithm whose cost is exponential in the field degree is not a gain.
    Item (iv) is the single most likely place the upside dies and must be
    extracted before the threshold is celebrated.
    STAGE 4, THE SCALED-DOWN LADDER, WHICH IS WHERE THE MONEY IS. Build
    ML-DSA-SHAPED module instances at ring degree n in {16, 32, 64} with
    module ranks (l, k) chosen to hold r/d fixed at 1/9 and q chosen to sweep
    Delta across the predicted Euclidean threshold and across the algebraic
    one. Run BKZ (fplll/G6K) and, separately, the released algebraic LLL
    implementation, recording for each tour whether an inserted vector lies in
    D (DSD) or is merely as short as the secret without lying in D (SKR). The
    event label is decided by an exact algebraic membership test (is the
    inserted vector an R-multiple of the secret generator), not by a norm
    threshold, so the two events are never confused.
    STAGE 5, NULL OBJECT. Repeat stage 4 with the secret generator replaced by
    a uniformly random (non-short) element of LAMBDA, so the lattice has the
    same d, det and q-ary structure but NO dense submodule. DSD must never
    fire. A DSD event in the null means the membership test or the instance
    generator is broken and every stage-4 row is void.
    STAGE 6, TRANSFER. Fit beta_DSD - beta_SKR against n at fixed (r/d, Delta)
    and state the extrapolation to n = 256 explicitly as an extrapolation,
    with the fit's interval, per AGENTS.md rule 4.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Grepped the whole repository (yaml + md, case-insensitive) for
      "overstretched|dense sublattice|dense submodule|fatigue|Kirchner|Pataki|
      Karenin|Kirshanova". Forty files matched the OR-pattern; every ML-DSA
      hit was the word "fatigue" used in the inventor-protocol sense of
      "fatigue report" (IDEA-20260821-5535fe line 89), not the NTRU fatigue
      point. No ML-DSA record in ledger/proposals, ledger/hypotheses or
      knowledge/ mentions DSD, SKR, dense submodules, Pataki-Tural, or the
      overstretched regime. Read in full or in substantial part this session:
      IDEA-20260801-008, -20260805-591f9d, -20260808-5a748c, -20260808-63427b,
      -20260808-c1abd1, -20260821-4c0246, -20260821-5535fe, -20260821-5bbea6,
      -20260828-9643b1, -20260828-fe3cee, plus the title line of all 15 prior
      RQ-MLDSA-001 records and the sibling question RQ-MLDSA-ffa0f5 in full.
    web: >-
      Three WebSearch queries this session (2026-08-29) surfaced Ducas-van
      Woerden "NTRU Fatigue: How Stretched is Overstretched?" (ePrint 2021/999,
      ASIACRYPT 2021) with the SKR/DSD distinction and the q = 0.004 n^2.484
      fatigue point; Karenin-Kirshanova "Finding Dense Submodules with
      Algebraic Lattice Reduction" (ePrint 2024/844, AFRICACRYPT 2024) with
      the algebraic Pataki-Tural lemma, algebraic DSD event, algebraic GSA and
      a released algebraic-LLL implementation; and, on the direct question of
      whether this applies to Dilithium/Kyber, only a search-engine summary
      stating the attack "applies primarily to NTRU-based schemes rather than
      being a primary concern for the parameter choices used in Kyber and
      Dilithium" -- WHICH IS EXACTLY THE UNQUANTIFIED SENTENCE THIS RECORD
      PROPOSES TO REPLACE WITH A NUMBER, and which was not traced to any
      primary source. Also surfaced and not read: "On Module Unique-SVP and
      NTRU" (ePrint 2022/1203) and "Predicting Module-Lattice Reduction"
      (arXiv 2510.10540), either of which may already contain the module-rank
      generalisation this record wants; both must be read before any novelty
      claim above `unverified` is made.
    verdict: >-
      UNVERIFIED. The ingredients are published and the qualitative belief
      ("module ranks above 2 are safe") is folklore. What was not found, in
      the corpus or in anything read this session, is the crossover distance
      evaluated at FIPS 204's exact (n, k, l, q, eta) under either the
      Euclidean or the algebraic condition. Two unread papers could dominate
      this record entirely; stage 3 exists to find out.
  object_first_candidate:
    tracked_object: >-
      The R-submodule D of the module-Kannan key lattice generated by
      (s1, s2, 1), followed through lattice reduction and projected to the
      pair (module-rank ratio r/d, density deficit Delta).
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record, because the
      RQ-MLDSA-001 corpus has mined them: (1) the scalar norm budget zeta and
      its decomposition (591f9d, 008); (2) the two-arm min between lattice
      cost and |B_tau| and any interpolation between them (5194f9, c1abd1,
      fe3cee); (3) coefficient-level or CRT-coordinate projections of the
      verification equation (5535fe); (4) fault-induced or side-channel-
      induced constraint systems (818196, 6e79b4); (5) signature-count and
      multi-target amortisation axes (4d4e5f, 4c0246). The tracked object here
      is none of these: it is a SUBMODULE of the key lattice, and its
      propagation rule is basis-profile insertion, not norm arithmetic.
    genuinely_new_or_repackaging: >-
      New to this program with certainty and new to the ML-DSA literature only
      probably. The object itself is standard in NTRU cryptanalysis; what is
      new here is asking it of a module of rank above 2 at deployed signature
      parameters and pricing the answer.
    concretely_testable: >-
      Yes. One-step propagation is defined (one BKZ tour changes the GS
      profile, hence the tail product, hence the Pataki-Tural margin) and the
      event is decided by an exact algebraic membership test rather than by a
      threshold, so DSD and SKR are never conflated.
    survival_score: >-
      Predicted to dissolve well before FIPS 204 parameters under the
      Euclidean condition (by roughly a factor 15 in Delta, or several hundred
      in block size). Survival under the ALGEBRAIC condition is unknown and is
      the reason to run the test.
  null_object_control: >-
    Stage 5. Same d, det, q-ary structure, secret generator replaced by a
    uniformly random module element so that no dense submodule exists. DSD
    must never fire. Additionally, FORCED CONTROL 1 (reproducing the published
    NTRU fatigue point with the same code path) is a positive control whose
    answer is known in advance.
  discriminated_from:
    - >-
      IDEA-20260808-5a748c prices t0 by comparing the block size of the
      t1-only MLWE instance against the full-t instance. Both of its rows are
      SKR rows. This record does not change either of them; it asks whether a
      third event fires first in either. The two are composable, not
      competing.
    - >-
      IDEA-20260821-5535fe projects the verification equation onto a subset of
      CRT coordinates and looks for a meet-in-the-middle split. Its object is
      a ring quotient of the EQUATION; this record's object is a submodule of
      the KEY LATTICE, and the two have different propagation rules (5535fe's
      is a ring homomorphism applied to an identity; this record's is basis
      insertion under reduction).
    - >-
      IDEA-20260828-9643b1 audits the worst-case-to-average-case reduction's
      loss. That is a question about what a THEOREM certifies. This record is
      a question about what an ALGORITHM does on the concrete instance, and
      its outcome would move the best-known-attack estimate itself, which
      9643b1 explicitly says it does not touch.
