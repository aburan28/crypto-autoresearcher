idea:
  id: IDEA-20261017-3f46a5
  title: Bounded k11 solver-to-certificate viability on matched binary bases
  class: control
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator
  added: '2026-10-17'
  claim: On certified GF(2^61), r=576460752557211763, both frozen B=316 k11 m=8 bases yield checked solver
    models for their separate positive controls and at least one certified natural projected relation
    over eight common targets under fixed caps. This is bounded instrument viability, not a speed claim.
  mechanism: Use the R1 torsion coordinate t=gamma/(x+gamma) and an 11-bit Hamming-cut base, with seven
    chained S3 additions and cofactor-4 projection. The relation vector is Class I partial-action. A same-width
    random base has 316 projected columns and matched circuit construction. Exact point checking restores
    lost signs and excludes poles and nonbase values; setup and duplicate rows are charged.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-73db3f
    provenance: internal
    claim: Structured binary factor-base subspaces are known.
    verified_by: idea-generator
  - ref: KR-IC-5765d2
    provenance: internal
    claim: SAT and native-XOR point decomposition are known mechanisms.
    verified_by: idea-generator
  - ref: IDEA-20260915-3119c9
    provenance: internal
    claim: The earlier ICPERF base idea uses a distinct cofactor-2 trace-count mechanism.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-73db3f
    - KR-IC-5765d2
    - KR-IC-889857
    - KR-IC-5a43e5
    - KR-IC-b0fcda
    nearest:
    - ref: KR-IC-5765d2
      provenance: internal
      relation: special_case
      delta: A matched 316-column, 60-bit-prime-subgroup finite solver/certificate gate; zero measured
        cost gain.
    searched:
      frontier_review: 25 live index-calculus rows checked at e2263064.
      proposal_index: Ledger index checked; nearest prior proposal named in citations.
  assumptions:
  - Bases and setup scans precede targets; no retuning.
  - Separate planted targets only gate the instrument; four raw channels share each projected target.
  - Unproved solver UNSAT is unvalidated; watchdog stops are censored.
  proof_search_map:
    bottleneck: Can both k11 systems yield exact point relations within one fixed solver cap?
    baseline_embedding:
      parameter_slice: Same GF(2^61), B=316, four channels, seven S3 links; local-random control.
      reproduction_check: Recheck both planted full Boolean and point witnesses.
    observation_collision:
      observable: XCNF gate or SAT conflict count.
      distinct_preimage_search: Compare equal-gate bases whose models have different point-certificate
        and row outcomes.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Weighted coordinate set with exact point map.
      predicted_gain: A certified finite-cap search interface for a later powered comparison.
    quantifier_order: Fix bases, target hash, binary and caps; run both bases on every target/channel
      without retuning.
    method_ceiling:
      strongest_certifiable_claim: Bounded solver/certificate viability.
      nearby_object_control: Same-width 316-column random base and separate positive fixtures.
    proof_obligations:
    - claim: SAT model satisfies frozen CNF and XOR.
      responsibility: correctness
    - claim: Full signed points sum to target and project to valid row.
      responsibility: interface
    - claim: Charge setup/censoring; rank, LA and target work remain later.
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: planted_model_solver_and_certificate_recovery
    direction: higher
    minimum_effect: Both separate SAT-positive controls return a full satisfying model and point certificate
      within 300 s and 8 GiB RSS per call.
  - metric: natural_common_target_certificates
    direction: higher
    minimum_effect: At least one distinct certified projected row in either arm over eight base-independent
      targets and four channels each; feasibility only.
  - metric: weighted_vs_local_paired_cost_and_yield
    direction: different
    minimum_effect: Exploratory paired estimate with censoring; no superiority threshold from eight targets.
  minimal_test:
    design: Freeze CryptoMiniSat hash/options, formula hashes, target hash, arm/channel order and outputs.
      Cap each call at 300 s, 8 GiB RSS and 64 primary models; cap the quiet-host schedule at seven hours.
      First solve both separately planted positives; if both pass, attempt eight new base-independent
      targets in two arms and four channels (64 calls). Retain all models, failures and censoring; deduplicate
      projected rows. The pilot tests viability only. A later powered comparison must freeze its effect,
      paired censored-outcome variance, target N, power and total cap before confirmatory targets.
    controls:
    - same-width 316-column local-random base
    - two separate planted SAT-positive fixtures
    - bit-flipped model rejection
    - all four raw channels
    - independent full-point replay
    required_metrics:
    - solver version/hash
    - wall
    - CPU
    - peak RSS
    - conflicts
    - SAT/UNSAT/timeout/memory classification
    - attempted/accepted models
    - full-point certificate status
    - distinct projected rows
    - per-arm setup work
  falsification_conditions:
  - A planted fixture fails to return a checked model within the cap.
  - Both planted gates pass but all 64 common-target calls give no certified natural projected row.
  - An invalid model or point certificate is an implementation defect, not negative evidence about the
    base.
  confounders:
  - different planted targets
  - projected-row duplicates
  - sign/pole branches
  - solver branching order
  - correlated four channels
  - setup scan difference
  - target-schedule sample error
  - RSS watchdog overshoot
  interpretation_limits:
  - One GF(2^61) m=8 pair; eight targets cannot resolve a 1.25x effect.
  - SAT conflicts are not regularity; rank, LA, held-out target and rho remain open.
  heuristic_assumptions:
  - id: H1
    statement: B=316 signed m=8 sums on uniform subgroup targets approximately follow a Poisson random
      map after collision accounting.
    rigorous_support: C(2B+7,8) bounds distinct targets; uniformity is unproved.
    validation_plan: Enumerate smaller same-shape binary cells; compare occupancy and tails to random-map
      and cyclic-group controls; state full-width transfer assumptions.
  target_complexity:
    time_exponent: 'Conditional cold cost: C_FB + B*C_dec/(q_rel*rho_rank) + C_LA + C_target_attempt/q_target
      + C_verify. If B=r^beta, q_rel~B^m/r in a validated sparse regime, C_dec=r^gamma and rho_rank=r^-delta,
      the relation exponent is 1-(m-1)*beta+gamma+delta; the full exponent also includes setup, LA and
      target. No exponent is measured.'
    memory_exponent: Conditional peak max{base, solver, LA, target table}; all r exponents unmeasured.
    best_known: Matched generic rho has r^0.5 group-operation scaling up to family constants; the ordinary-binary
      full-width IC baseline at this r is missing.
    hidden_overhead: No o(1) suppression; failed calls, four correlated channels, sign/pole filtering,
      setup, rank, LA and verification remain explicit.
    tradeoff_note: Cold-start single-target primary; charge C_FB/T only in a separately labelled T-target
      reuse analysis.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  dominated_by: n/a (no attack result claimed; all 25 live index-calculus frontier rows checked).
  sota_delta: Zero verified end-to-end gain; at most 66 capped solver calls test feasibility only.
