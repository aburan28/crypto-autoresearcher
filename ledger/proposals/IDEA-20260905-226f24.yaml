idea:
  id: IDEA-20260905-226f24
  title: Compositional transcript binding for batch verification statements
  class: composition
  claim: 'A batch-verification proof can be organized around a typed transcript invariant: every residual is bound
    to its decoded key, exact message mode, domain separator and canonical byte transcript before a batch statement
    is formed.'
  mechanism: Track a dependent pair consisting of an abstract prime-subgroup residual and the transcript that defines
    its challenge. A normalization map is allowed only if it preserves both the decoded algebraic value and the
    hash input bytes, or if a separate proof establishes the intended redefinition. The batch interface consumes
    these typed residuals and attaches its coefficient-generation rule to the entire ordered collection. Algebraic
    correctness and probabilistic soundness are separate obligations. On a prime-order residual domain with coefficients
    chosen independently after the list is fixed, a nonzero residual vector admits the standard at-most1/r linear-cancellation
    probability argument; deterministic or adaptively chosen coefficients require a different theorem and are excluded.
