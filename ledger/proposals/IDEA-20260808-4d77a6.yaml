idea:
  id: IDEA-20260808-4d77a6
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  title: The isogeny-volcano level of an ordinary curve is partially readable straight off
    the PUBLIC group structure E(F_p) = Z/n_1 x Z/n_2 with O(log p) group operations and no
    modular polynomial, because Lenstra's CM structure theorem gives n_1 = gcd(A-1, f/f_E)
    exactly; the lane's level instrument is therefore cheaper than the one it is planning,
    and the same identity says how often the shortcut is VACUOUS
  class: measurement
  claim: "(A) THE IDENTITY, DERIVED. Let E/F_p be ordinary with trace t, Frobenius pi, D =\
    \ t^2 - 4p = f^2 D_0 with D_0 fundamental, End_{F_p}(E) = O of conductor f_E | f, and\
    \ m := [O : Z[pi]] = f / f_E. Lenstra's complex multiplication structure theorem gives\
    \ E(F_p) ~= O/(pi - 1)O as an O-module. In the Z-basis {1, theta} of O with theta = f_E\
    \ * omega_K and omega_K = (D_0 + sqrt(D_0))/2, one has pi = A + m*theta with A = (t -\
    \ f*D_0)/2. Writing theta^2 = u*theta + v (u, v in Z), the sublattice (pi - 1)O of O ~=\
    \ Z^2 has basis matrix rows (A-1, m) and (m*v, (A-1) + m*u). Its Smith normal form has\
    \ first invariant factor gcd(A-1, m, m*v, (A-1)+m*u) = gcd(A-1, m). Hence, writing E(F_p)\
    \ ~= Z/n_1 x Z/n_2 with n_1 | n_2:\n    n_1 = gcd(A - 1, m) = gcd((t - f*D_0)/2 - 1, f\
    \ / f_E),\n    n_1 * n_2 = #E(F_p) = p + 1 - t.\n(B) THE INSTRUMENT. For every prime ell,\n\
    \    v_ell(n_1) = min( v_ell(A-1), v_ell(f/f_E) ),\nand v_ell(f/f_E) is exactly the height\
    \ of E above the FLOOR of the ell-volcano. Since A, t, f, D_0 are public (given the factorisation\
    \ of D) and n_1 is computable from E(F_p) alone, the quantity\n    level_hat_ell(E) :=\
    \ v_ell(n_1)\nis a publicly computable LOWER BOUND on the ell-volcano level of E, equal\
    \ to the true level whenever v_ell(A-1) >= v_ell(f/f_E), and identically 0 when ell does\
    \ not divide A-1. Computing n_1 costs O(log p) group operations per candidate ell (test\
    \ whether E(F_p)[ell] is bicyclic by multiplying a few random points by #E/ell), against\
    \ Otilde(ell^2) or worse for the modular-polynomial route (build Phi_ell, root-find, count\
    \ rational ell-isogenies) that IDEA-20260807-b1b604 proposes to implement. (C) THE HONEST\
    \ OTHER HALF, WHICH IS WHY THIS IS A MEASUREMENT AND NOT A TOOL DELIVERY. n_1 always divides\
    \ p - 1 (Weil pairing), and for the instrument to be non-vacuous at ell one needs ell\
    \ | gcd(A-1, f). For a \"random\" A this has heuristic density about 1/ell per ell | f,\
    \ so the instrument is expected to be informative essentially only at ell = 2 and ell\
    \ = 3, and to be identically vacuous on a substantial fraction of classes. The record\
    \ claims the identity in (A) exactly, and claims the usefulness in (B) only conditionally\
    \ on a measured non-vacuity rate."
  mechanism: 'The group E(F_p) is the O-module O/(pi-1)O, so its Z-module invariants are Smith
    invariants of an explicit 2x2 integer matrix whose entries involve exactly the two quantities
    the volcano lane cares about: the distance of pi from 1, and the index m = f/f_E that
    measures how far End(E) sits above Z[pi]. The ell-volcano level is by definition v_ell(f/f_E).
    The instrument works because the SAME integer m appears in the group structure and in
    the endomorphism-ring conductor, so a purely group-theoretic measurement (bicyclicity
    of the ell-Sylow) reads a purely endomorphism-theoretic quantity. Nothing about points
    of G is used, so the admissibility filter is satisfied by resource R3 (End(E) as a ring)
    being READ OUT of R-nothing: the measurement consumes only the public group structure,
    which is why it is cheap.'
  why_not_a_renamed_known_approach: 'Nearest known method: counting F_p-rational ell-isogenies
    via the modular polynomial Phi_ell (Kohel; Fouquet-Morain; Sutherland) [recall-confident],
    which is what DECOMPOSITION.md L2 and IDEA-20260807-b1b604 specify. The difference is
    the cost model and the failure mode: the modular route is Otilde(ell^2)-plus per curve
    per ell and always answers; the group- structure route is O(log p) and answers only up
    to the cap v_ell(A-1). In the literature the 2-Sylow special case is used to locate curves
    on 2-volcanoes (Miret-Moreno-Rio-Valls and successors) [recall-uncertain, not verified
    this session]. The record''s contribution to THIS program is (i) the general-ell identity
    n_1 = gcd(A-1, m) written out with its derivation, (ii) the explicit non-vacuity condition
    ell | gcd(A-1, f) as a measurable rate, and (iii) the cross-lane consequence in E3-08
    that a "hidden conductor" is partly public.'
  predictions:
  - observable: agreement of the shortcut with an independent level computation
    metric: fraction of curves in a fully enumerated toy ordinary isogeny class on which v_ell(n_1)
      equals min(v_ell(A-1), v_ell(f/f_E)), with f_E obtained independently (modular-polynomial
      volcano climb)
    predicted: exactly 1.000 (this is an identity, not a correlation); any single disagreement
      falsifies either the derivation or the implementation
  - observable: non-vacuity rate of the instrument
    metric: over sampled ordinary classes with f > 1, the fraction for which gcd(A-1, f) >
      1, reported per ell in {2,3,5,7}
    predicted: decreasing in ell, of order 1/ell per ell | f under the heuristic that A-1
      is equidistributed mod ell; concretely the ell=2 rate is predicted strictly larger than
      the ell=5 rate. A measured rate that is flat in ell falsifies HA-1 and means A-1 and
      f are not independent
  - observable: cost separation
    metric: field multiplications per curve per ell for the group-structure route vs the modular-polynomial
      route, at matched p and ell
    predicted: group-structure route lower by a factor growing with ell (its cost is ell-independent
      up to the divisibility test; the modular route is at least quadratic in ell)
  minimal_test: 'One toy ordinary isogeny class, p of 20-24 bits, chosen with f divisible
    by 4 and by 9 so that the 2- and 3-volcanoes have depth >= 2. Enumerate the class by ell-isogeny
    walks for ell in {2,3}; for each curve compute (i) n_1 by group-structure computation
    and (ii) the volcano level by counting roots of Phi_ell(j(E), Y) in F_p. Report the confusion
    matrix of v_ell(n_1) against min(v_ell(A-1), level). Then repeat over 200 randomly sampled
    ordinary classes at 20-24 bits to measure the non-vacuity rate per ell. Budget: single
    machine, order of one hour with an existing modular-polynomial table for ell <= 3.'
  controls:
  - 'NULL OBJECT: run the same measurement on classes with f = 1 (Z[pi] is maximal, no volcano
    above the crater). The instrument must return level_hat = 0 for every curve; any nonzero
    output there is an artifact.'
  - 'PLANTED SIGNAL: construct, via the Hilbert class polynomial for a small D_0 and a chosen
    conductor, a curve of known level >= 2, and require the instrument to report v_ell(n_1)
    = min(v_ell(A-1), 2). Two-directional control as required by RQ-INSTR-f8faa0 / GOAL-ENDO-001
    C4.'
  - 'Independent group-structure computation by two methods (random-point order testing vs.
    structure from #E and ell-divisibility of a basis) to separate an implementation bug from
    the identity.'
  confounders:
  - Factoring D = t^2 - 4p is required to know f and D_0. At toy scale this is free; at crypto
    scale it is a genuine cost (subexponential) and the record does NOT claim the instrument
    is cheap at crypto scale.
  - n_1 is often 1 for reasons unrelated to the level (namely ell does not divide A-1). Reporting
    "level 0" then is correct but uninformative, and must not be pooled with genuine floor
    detections.
  - Curves with j = 0 or 1728 have extra automorphisms and O^* larger than {+-1}; the module
    identity is unchanged but the unit index changes class number formulas used in cross-checks.
  falsification_conditions:
  - 'Any curve in the enumerated class where v_ell(n_1) != min(v_ell(A-1), v_ell(f/f_E)) under
    two independent implementations: the derivation in (A) is wrong.'
  - 'Non-vacuity rate measured as 0 across all sampled classes at ell in {2,3}: the instrument
    exists but is useless in practice, and the lane must fall back to the modular-polynomial
    route. This is a real negative outcome and it is the more likely one for large ell.'
  - 'Cost measurement showing the group-structure route is NOT cheaper at ell = 2, 3 (plausible,
    since small-ell modular polynomials are tiny): the cost claim is then scoped to ell >=
    5.'
  interpretation_limits: 'Toy scale only. This is an INSTRUMENT, not an attack: it changes
    no attack cost and moves no exponent. It reads a curve-only invariant, and by the lane''s
    own standing obstruction (endomorphisms act on G as scalars, H-ENDO-001) a curve-only
    invariant is k-independent by construction. Its value is that it makes L2 stratification
    affordable and that it bounds what a "hidden conductor" can hide (E3-08).'
  assumptions:
  - E ordinary over F_p, p > 3, End_{F_p}(E) = O an order of conductor f_E in K = Q(sqrt(D_0)).
  - 'Lenstra''s CM structure theorem E(F_p) ~= O/(pi-1)O [recall-confident: H. W. Lenstra
    Jr., "Complex multiplication structure of elliptic curves", J. Number Theory 56 (1996)
    227-241; NOT re-verified this session].'
  - The volcano-level definition v_ell(f/f_E) as height above the floor (Kohel; Fouquet-Morain;
    Sutherland) [recall-confident].
  heuristic_assumptions:
  - id: HA-1
    statement: For ordinary isogeny classes sampled by choosing p and t at random subject
      to |t| < 2 sqrt(p) and t not congruent to 0 mod p, the residue A - 1 mod ell is equidistributed
      in Z/ell independently of the event ell | f, uniformly for ell <= (log p)^2.
    rigorous_ingredient: A = (t - f D_0)/2 is an explicit integer-valued function of (t, p);
      the Deuring/Waterhouse correspondence makes every admissible t occur, and the number
      of curves with a given t is h(D)-weighted (a proved statement), so the sampling distribution
      over t is explicit and not assumed.
    distribution_imitated: Equidistribution of a fixed integer polynomial's values in residue
      classes, the same shape as the Chebotarev/Cramer-style heuristics already used elsewhere
      in this corpus for "a specific integer behaves like a random integer of its size".
    validation_route: 'Direct sampling at toy scale: 10^4 ordinary (p, t) pairs at 20-32 bits,
      compute A-1 and f by factoring D, tabulate the empirical joint distribution of (v_ell(A-1),
      v_ell(f)) for ell in {2,3,5,7,11} and compare against the product of the marginals by
      a chi-squared test. This is TOY-SCALE validation and is labelled as such; it does not
      establish the heuristic at crypto scale, where factoring D is itself the obstruction
      to sampling.'
    tail_checks: 'Check the extreme cells: the observed maximum of v_2(n_1) over the sample
      against the predicted geometric tail P(v_2(A-1) >= j) = 2^{-j}; and separately the count
      of samples with gcd(A-1, f) > 100, predicted rare, against the heuristic prediction.'
  target_complexity:
    time_exponent: 'No attack exponent is claimed and none moves. Instrument cost per curve
      per ell: O(log p) group operations, i.e. (log p)^{O(1)} bit operations, versus Otilde(ell^2
      + ell log p) for the modular-polynomial level test. This is a (log p)^{O(1)}-cofactor-class
      contribution and is LOW priority under the program''s exponent-first bias except as
      a building block.'
    memory_exponent: O(log p) bits per curve; O(h) if the whole class is stored, which is
      p^{1/2+o(1)} and is the caller's choice, not this instrument's cost.
    best_known_baseline: Modular-polynomial volcano climbing (Kohel; Fouquet-Morain; Sutherland),
      Otilde(ell^2) per test plus the cost of Phi_ell.
    hidden_overhead_disclosure: The instrument PRESUPPOSES the factorisation of D = t^2 -
      4p, which is free at toy scale and subexponential at crypto scale. Any claim of cheapness
      at crypto scale would be dishonest and is not made.
    time_memory_tradeoff: Not applicable; the instrument is a constant-memory local test.
      If used inside a class enumeration the enumeration's own time-memory position applies
      (see E3-02).
  sota_delta: 'Zero against any attack. Against the lane''s own planned instrument: a (log
    p)^{O(1)} versus Otilde(ell^2) cost improvement for the level test, conditional on a non-vacuity
    rate that this record does not know and proposes to measure. This is explicitly a building
    block, filed as such.'
  dominated_by: 'As an attack: dominated by everything, since it is not an attack. Checked
    against the frontier rows the program maintains: parallel Pollard rho with distinguished
    points at 0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant at 0.886 sqrt(N/r) (KN-TECH-018); BSGS at sqrt(N) time
    and sqrt(N) memory (KN-TECH-031). As an INSTRUMENT, dominated by nothing in this repository,
    because no code in this repository computes a volcano level at all (established by IDEA-20260807-b1b604''s
    grep of harness/).'
  estimated_cost: "Implementation: >-\n  low (group-structure computation and a Smith-normal-form\n\
    check; the only nontrivial dependency is a small Phi_ell table for the control arm). Compute:\
    \ low (order of one CPU-hour at 20-24 bits)."
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the identity in (A) verifies exactly (it is a short
    derivation from a theorem the author is confident of, and the toy test is a direct check).
    0.30 that the instrument is non-vacuous often enough to replace the modular-polynomial
    route in practice. 0.02 that it leads to anything with an exponent. The high probability
    of the first and low probability of the third are why this is filed as a building block.
  novelty_status: unverified
