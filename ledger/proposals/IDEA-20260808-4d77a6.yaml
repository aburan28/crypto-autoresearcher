  discriminated_from: 'IDEA-20260807-b1b604 (RQ-VOLC tooling: builds a volcano-level computation
    because none exists) proposes the modular-polynomial route; this record proposes a strictly
    cheaper partial route and states exactly when it is vacuous, so the two are complements,
    not duplicates - b1b604''s arm is this record''s control. IDEA-20260807-3f5545 treats
    the conductor as a VECTOR (v_ell(f_E) per ell); this record supplies a cheap estimator
    for the coordinates of that vector and a cap on which coordinates it can see. IDEA-20260807-a2b59a
    exploits independence of v_{ell_1}, v_{ell_2}; this record is upstream of it. IDEA-20260807-cbe8c1
    derives a crater criterion from D = c^2 D_K; that criterion is about the class, this identity
    is about an individual curve inside it.'
