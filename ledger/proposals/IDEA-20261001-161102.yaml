  assumptions:
    - Frozen V, seeds, XOR-SAT pin, and chained-S_3 intermediate reinjection rule.
    - Both S_4 and S_3 encoders already admitted or cell is failed_infrastructure.
    - Cost band 0.85 and ≥40 targets pre-registered; no post-hoc edits.
    - Cheaper toy schedule ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-161102-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: on ≥40 matched random targets under
        the frozen XOR-SAT pin, C(S_4) ≤ 0.85 × C(chained-S_3×S_3) where
        C = median_wall / max(success_rate, ε) with ε=1/40.
      random_model_justification: >-
        Rigorous: KR-IC-5a43e5 gives deg(S_4)=4 vs deg(S_3)=2 per variable,
        so one S_4 system is algebraically larger while two S_3 attempts
        pay a second success-probability factor. Classical: if the extra
        degree dominates, C(S_4) should exceed C(chained); if the second
        success factor dominates, C(S_4) wins. The ≤0.85 band is the
        pre-registered transfer hypothesis under test at toys — not a claim
        that either schedule changes the ECDLP exponent vs rho.
      supporting_results:
        - KR-IC-5a43e5
        - KR-IC-5765d2
      validation_experiment_ids: []
      falsification_condition: >-
        C(S_4) > 0.85 × C(chained) at a completed cell (S_4-not-cheaper),
        OR either schedule's encoder/solver is absent (infrastructure stop),
        OR success_rate=0 on both arms (inconclusive; report, do not invent
        a ratio).

  predictions:
    - metric: charged_cost_ratio_S4_over_chained
      direction: upper_bounded
      minimum_effect: '≤ 0.85 at each (n,ℓ) cell'
    - metric: target_count
      direction: lower_bounded
      minimum_effect: '≥ 40 matched targets per cell'
    - metric: both_arms_nonzero_success
      direction: lower_bounded
      minimum_effect: '≥ 1 success on each arm, else mark inconclusive'

  minimal_test: >-
    Stage 0: freeze V, seeds, XOR-SAT pin, chain reinjection rule, band 0.85.
    Stage 1: n=17, ℓ∈{3,4} — ≥40 targets; report C ± bootstrap CI.
    Stage 2: n=19,23 + random-Boolean null. Budget: ≤12 CPU-hours.
    Stop if either encoder absent (IMP, never evidence).

  controls:
    - ctl_matched_random_targets
    - null_random_boolean_matched_size
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_band_edit
    - ctl_shared_xorsat_pin

  falsification_conditions:
    - Claiming practical binary IC from a toy S_4 win (KR-IC-1fcdbc).
    - Treating 'use S_4' as novelty (KR-IC-5a43e5 forbids).
    - Transferring the cost band to n≥131 without a new contract.
    - Editing the 0.85 band after seeing timings.
    - Treating encoder absence as mathematical falsification.

