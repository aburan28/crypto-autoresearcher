idea:
  id: IDEA-20261001-161102
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    IS ONE S_4 DECOMPOSITION CHEAPER THAN TWO CHAINED S_3 ATTEMPTS AT TOYS?
    On binary toys n∈{17,19,23} with frozen V (dim ℓ∈{3,4}), compare
    expected wall cost × inverse success of a single Semaev S_4 PDP attempt
    against two sequential S_3 attempts that compose to a 4-point relation
    (chained S_3), on matched random targets.

  class: heuristic_validation

  claim: >-
    KR-IC-5a43e5 defines Semaev S_m via resultant recursion (deg 2^{m−2} per
    variable); RQ-BINSTD lists chained S_3 as an alternative relation source
    beside direct higher-m. CLAIM: at each toy cell (n,ℓ)∈{17,19,23}×{3,4},
    on ≥40 matched random targets, the charged cost C = median_wall /
    success_rate satisfies C(S_4) ≤ 0.85 × C(chained-S_3×S_3) — OR the
    inequality fails and is recorded as S_4-not-cheaper at this scale.
    CLAIM TIER: heuristic_validation. NO break. NO exponent. NO claim that
    either path beats rho (KR-IC-1fcdbc). NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev summation polynomials on
    x-coordinates with factor base {P : x(P)∈V} (KR-IC-5a43e5 /
    KR-IC-73db3f), Weil-restricted to the admitted Boolean/XOR path
    (KR-IC-5765d2). Operation set: two relation-source schedules only —
    (A) one S_4 system per target; (B) two sequential S_3 systems whose
    intermediate is re-injected (chained). Trichotomy: Class I
    partial-action (relation under FB translation). Lossy-projection:
    charged cost discards which algebraic path produced the relation;
    null is a matched-size random Boolean 4-var family whose C(A)/C(B)
    ratio should not inherit Semaev resultant structure. OFF-LIMITS:
    asserting KR-IC-889857; engine races that fix S_3 only
    (IDEA-20261001-3f2d06 / 5c936b / c35b2a); S_m novelty (forbidden —
    Semaev is known). WHAT IS NEW: a pre-registered S_4 vs chained-S_3
    charged-cost band on RQ-BINSTD toys.

  novelty_status: unverified
