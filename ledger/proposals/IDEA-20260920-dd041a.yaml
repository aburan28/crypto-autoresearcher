  minimal_test:
    design: >-
      PAPER-LEVEL DISCRIMINATOR, ZERO COMPUTE, INSIDE THE RQ CLAIM BOUNDARY. No
      curve generation, no run, no ECDLP result.
      STEP 1 (Gauss sums, twenty minutes). Compute ||vhat||_1 for the index-L
      subgroup indicator of F_p^* in the ADDITIVE character basis, exactly,
      carrying the zero element and the constant term. Then compute it for the
      interval, the top-k-bits map, and a degree-d algebraic condition. Emit
      the lambda table of (D2) with a provenance column per row.
      STEP 2 (substitution, five minutes). Substitute each lambda into
      IDEA-20260920-b6ad24's floor (4 - 2 lambda)/11 and read off which families
      are excluded. Verify the two forced endpoints 1/6 -> 1/3 and 0 -> 4/11.
      STEP 3 (the band, ten minutes). Place IDEA-20260904-f68c7f's 1/4 next to
      1/6 and state (D1) with both necessary conditions quoted verbatim from
      their sources. Check explicitly that the band is not an artifact of two
      different normalisations -- f68c7f's threshold is on A(v) = eps and this
      record's is on ||vhat||_1, and the bridge between them is f68c7f's own
      (E); if that bridge is misapplied the band is spurious, AND THAT IS THE
      CHEAPEST WAY THIS RECORD DIES.
      STEP 4 (the reduction, thirty minutes). Expand the fibre indicator
      multiplicatively, derive the n^{7/12} requirement from
      IDEA-20260920-b6ad24 (A1), and write the Outcome 1 / Outcome 2 arithmetic
      with both exponents pinned.
      STEP 5 (literature extraction, the blocking step). Obtain the mixed
      character-sum statement for elliptic curves with a multiplicative
      character of the x-coordinate twisted by a character of the point group,
      from the Lange-Shparlinski, Ahmadi-Shparlinski and Shparlinski
      sum-product lineage. Record VERBATIM its size and its dependence on the
      character's ORDER. If the literature gives only the genus-weighted bound,
      RECORD THAT THE QUESTION IS OPEN and stop -- that is a complete and
      honest deliverable and is the record's expected outcome on the extraction
      axis.
      STEP 6 (the second obligation, symbolic). Write (D6): is
      chi(x(R+S)) determined by (chi(x(R)), chi(x(S))) up to b values? Attempt
      a closed-form rule from the addition law; if none, state the table charge
      M^2 b = n^{2/3} b as P explicitly.
      STEP 7 (archive check, zero compute). Read IDEA-20260829-4b34c5 IN FULL
      and re-check the differentiation clause in `mechanism`; this session read
      only its header. Record the exact sentence of IDEA-20260901-d77aa8 (E4)
      that (D1) contradicts as a universal. No status change is proposed.
      EXPLICITLY REQUIRING A SCOPE EXTENSION AND NOT PROPOSED HERE: any
      measurement of b or of the mixed sum on a curve. An exact FFT at 24 to 34
      bits would decide the toy-scale behaviour cheaply and the Coordinator
      would have to grant it; note that at 24 bits n^{1/2} and n^{7/12} differ
      by a factor 2.8, so the toy scale CANNOT separate the two outcomes and
      the record predicts an inconclusive toy cell rather than a signal.
    controls:
      - "NORMALISATION GATE, run first: confirm ||vhat||_1 is the ADDITIVE F_p L1 norm and A(v) is the DL-Fourier maximum over <P>, and that f68c7f (E) is the only bridge used. Two different transforms over two different groups; conflating them manufactures the band."
      - "RANDOM-SET NULL at matched density: a uniform subset of F_p of density 1/L has the same lambda = 1/2 up to logs and forced b = M. Every reading of lambda is an excess over this null, never over an idealised value, and lambda alone must be reported as NOT discriminating."
      - "DEGENERATE-L CONTROLS: L = 2 must fail by Cauchy-Davenport alone; L = p - 1 must fail the lossy-projection test alone. Neither may consume a character sum."
      - "FLOOR-SILENCE CONTROL: at lambda = 1/2 the floor returns 3/11 < 1/3 and is SILENT; the report must state silence and must not quote 3/11 as an exponent."
      - "SUM-KEY VERSUS LEAF-KEY CONTROL: IDEA-20260829-4b34c5's object is the accepted set on the SUM. Any statement derived here must be checked to be about the LEAF key, per IDEA-20260901-d77aa8's category warning."
      - "MANDATORY PARETO ROWS: Pollard rho at 0.886 sqrt(n), O(1) memory, and BSGS at (n^{1/2}, n^{1/2}), reported against the conditional n^{1/3} of Outcome 2 at memory n^{1/3} and against the closure of Outcome 1."
      - "CURVE-SELECTION CONTROL: record how restrictive L | p - 1 with L near n^{1/3} actually is, since a construction that needs a special p is not a generic attack and must not be reported as one."
    required_metrics:
      - "the lambda table with a provenance column per row and the character basis named per row"
      - "the floor value at each panel lambda, with 1/6 -> 1/3 and 0 -> 4/11 verified by substitution"
      - "an explicit check that the 1/6 and 1/4 bars are stated in compatible normalisations, with the bridge cited"
      - "the n^{7/12} mixed-sum requirement with its derivation, and both Outcome exponents pinned"
      - "the verbatim extracted mixed character-sum statement including its dependence on the character order, or an explicit 'the literature gives only the genus-weighted bound and the question is open'"
      - "the (D6) branch-rule verdict, with the table charge M^2 b stated as P if no closed form exists"
      - "PASS/FAIL of each control, with the floor-silence control reported as silence"

  falsification_conditions:
    - "STEP 3 finds the 1/6 and 1/4 bars are stated in incompatible normalisations. The band is spurious, (D1) is withdrawn, and the record reduces to (D2)-(D6). This is the cheapest and most likely single-point failure and is why STEP 3 is third, not last."
    - "The Gauss-sum computation gives ||vhat||_1 = O(log p) rather than Theta(p^{1/2}) for the power-residue indicator. Then no corpus family clears 1/6 except the digit-sum one, the band has no tunable inhabitant, and the lane closes further than this record claims -- a stronger negative than predicted."
    - "STEP 5 extracts a mixed-sum bound of n^{1/2+o(1)} uniform in the character order. OUTCOME 1: the power-residue family fails the branching threshold by exactly n^{1/6-o(1)}, IDEA-20260829-4b34c5's positive side closes in branching vocabulary, and combined with IDEA-20260920-b6ad24 and -C the coordinate-projection branching lane closes with a named mechanism. THIS IS THE PREDICTED OUTCOME AND IT IS A CLOSURE, NOT A FAILURE."
    - "STEP 5 extracts, or the literature states as open, the possibility of a mixed sum of size n^{7/12}. The band is populated at lambda = 1/2, the merge is strictly the better use of the object, and the finding routes to review-breakthrough at max effort with the cost table attached. This is the outcome that would matter most and the record does NOT claim it."
    - "STEP 6 finds a closed-form branch rule for chi(x(R+S)). That would be an approximate homomorphism from <P> to Z/L evaluable from coordinates, which by the IDEA-20260806-c5d183 / KN-FIND-ffe1df lineage at b = 1 is impossible and at b > 1 is precisely the open window -- so finding one is itself a review-breakthrough event and is not an ordinary pass."
    - "IDEA-20260829-4b34c5, read in full, already contains the leaf-key branching analysis. Then (D4) is a duplicate, novelty_status is `known`, and the record must be reduced to (D1)-(D3)."
    - "Lemma (A1) of IDEA-20260920-b6ad24 fails. Every quantitative statement here fails with it; only (D2)'s lambda table survives."

  confounders:
    - "WHICH FOURIER BASIS. ||vhat||_1 is the ADDITIVE F_p norm; in the MULTIPLICATIVE basis the same indicator has L1 norm 1. Reporting the multiplicative norm would place the power-residue key at lambda = 0 and exclude it, reversing the record's conclusion. THE BASIS MUST BE NAMED ON EVERY LINE."
    - "WHICH GROUP AND WHICH CODOMAIN. b, doubling, and tau are computed in <P> with fibres as subsets of <P>; chi and ||vhat||_1 are computed in F_p^* and F_p. lambda is an exponent in n, not in p, and with a cofactor h the two differ. A single line that slides from F_p^* to <P> without saying so invalidates the whole chain -- the lane has already merged one record whose forced values switched codomain mid-sentence."
    - "SILENCE IS NOT ACHIEVABILITY. At lambda = 1/2 the floor returns 3/11 = 0.2727, which is BELOW n^{1/3}. That number is the floor declining to constrain, not a predicted exponent, and presenting it as an attack cost would be the most serious possible misreading of this record."
    - "LAMBDA IS NECESSARY, NEVER SUFFICIENT. A random set of the same density has the same lambda and forced b = M. Nothing about structure follows from a high spectral norm."
    - "LEAF KEY VERSUS SUM KEY. IDEA-20260829-4b34c5's D_chi is an accepted set on R + S; this record's fibres are a partition of the leaves. IDEA-20260901-d77aa8 records this as a category error waiting to happen and it is repeated here deliberately."
    - "THE DECISION MARGIN IS n^{1/12}. Outcome 1 and Outcome 2 are separated by a factor n^{1/12}, which at 24 to 34 bits is between 4 and 7. No toy computation can separate them and none is proposed; an extraction whose bound is loose by n^{1/12} also decides nothing."
    - "CURVE SELECTION. L | p - 1 with L near n^{1/3} is not automatic. A construction requiring a special p is a special-curve result, and this lane's constraint list already forbids presenting one as generic."

