  title: >-
    THE lambda >= 1/6 BAND IS NONEMPTY AND HAS EXACTLY ONE CORPUS INHABITANT.
    The spectral floor excludes every key whose F_p ADDITIVE spectral norm is
    below n^{1/6}, and IDEA-20260904-f68c7f's learner needs n^{1/4}, so
    lambda in [1/6, 1/4) is a band where the four-list merge could reach
    n^{1/3} while spectral learning is NOT sub-rho -- the first region this
    lane has identified in which the merge is not dominated by the learner. Of
    the corpus key panel only two families clear n^{1/6}, and only ONE has an
    image size tunable to n^{1/3} at polylog evaluation cost: the L-th power
    residue character of x(R). Its decision reduces to a single mixed character
    sum, and the expected square-root-cancelling answer closes it by a factor
    of exactly n^{1/6}
  class: representation

  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE: R1 of RQ-ECDLP-623a32 -- x(R) in
    F_p postprocessed by ONE exponentiation, which is F_p arithmetic on the
    coordinate and is neither a Kummer-line model nor a degree-d function on E,
    so the model-lever-1 closure is untouched. The attack stage is COLLISION
    STRUCTURE.

    (D1) THE BAND. IDEA-20260920-b6ad24 (A3) gives, for a coordinate key whose
    fibre indicators have F_p additive spectral norm ||vhat||_1 = n^lambda,
    the floor T >= n^{(4 - 2 lambda)/11}, hence lambda >= 1/6 is NECESSARY for
    the n^{1/3} corner. IDEA-20260904-f68c7f (D)-(E) gives, for the SAME
    quantity, the necessary condition lambda > 1/4 for the spectral-learning
    route to be sub-rho. THEREFORE lambda in [1/6, 1/4) IS A BAND IN WHICH THE
    MERGE ROUTE IS NOT EXCLUDED BY THE FLOOR AND THE LEARNER ROUTE IS EXCLUDED
    BY ITS OWN NECESSARY CONDITION. This is the first quantitative region in
    this lane where the four-list construction is not dominated by the cascade
    that IDEA-20260901-d77aa8 (E4) and IDEA-20260901-a66d70 use to dismiss
    every concentrating key. NOT CLAIMED: that the band is occupied. Claimed:
    that "a concentrating key is never used best by the four-list route" is
    FALSE AS A UNIVERSAL STATEMENT, with the counterexample region named.

    (D2) THE PANEL TABLE, DERIVABLE AT ZERO COMPUTE. lambda = log_n ||vhat||_1
    with vhat the ADDITIVE Fourier transform over F_p of the fibre-defining
    function v on F_p -- codomain named, this is NOT the multiplicative
    transform and NOT the DL transform over <P>.
      x-coordinate interval bucket: ||vhat||_1 = O(log p), lambda = 0. FAILS.
      top-k-bits of x: O(log p), lambda = 0. FAILS.
      x mod a small prime: O(log p) per residue class, lambda = 0. FAILS.
      any condition algebraic on x of degree d: O(d log p), lambda = log_n d,
        and by IDEA-20260920-b6ad24 (A4) the evaluation cost Theta(d) multiplies
        T monotonically, so raising d NEVER pays. FAILS AS A CLASS.
      digit-sum family: ||vhat||_1 about p^{0.39} per KN-FIND-ffe1df's committed
        measurement as reported in IDEA-20260904-f68c7f (E), lambda about 0.39.
        CLEARS 1/6 and also 1/4 -- but its image size M is fixed by the digit
        structure and is not freely tunable to n^{1/3}, and it has no
        candidate branch rule; it is named, not proposed.
      indicator of the index-L multiplicative subgroup of F_p^* pulled back
        through x: by Gauss sums each |chihat^j(xi)| = p^{-1/2} for every
        nonzero xi and every nontrivial j, and the indicator is
        (1/L) sum over j of chi^j, giving ||vhat||_1 = Theta(p^{1/2}), i.e.
        lambda = 1/2. CLEARS BOTH BARS BY THE MAXIMUM POSSIBLE MARGIN, at an
        evaluation cost of ONE exponentiation, O(log p) field operations.
    SO EXACTLY ONE CORPUS FAMILY HAS THE THREE PROPERTIES SIMULTANEOUSLY --
    lambda >= 1/6, image size M = L freely tunable, evaluation cost n^{o(1)}.

    (D3) THE DECOUPLING, WHICH IS WHY THE FLOOR DOES NOT REACH IT.
    IDEA-20260920-b6ad24 (A4) closes the degree route because a degree-d
    condition costs Theta(d) to evaluate, so spectral norm and cost rise
    together. The power-residue condition BREAKS THAT COUPLING: its spectral
    norm is p^{1/2} while its evaluation is one exponentiation. The surviving
    class is therefore not "high degree" but "HIGH SPECTRAL NORM AT LOW
    EVALUATION COST", and the character is the canonical instance. This is the
    precise form KN-OPEN-020's open classes take in this lane: an
    IMPLICIT-MEMBERSHIP description -- membership in the subgroup is tested by
    exponentiation and the subgroup is never enumerated -- declared here as
    required by the constraint block even though no factor base and no relation
    mechanism is introduced anywhere in this record.

    (D4) THE DECISION, REDUCED TO ONE SUM. Take L = M = n^{1/3}, fibres
    A_i = { R in <P> : chi(x(R)) = zeta^i } of size about n^{2/3}. The
    four-list branching route reaches n^{1/3} only if b < sqrt(M) = n^{1/6},
    i.e. only if |A_i + A_i| <= n^{1/6} |A_i| = n^{5/6}. By
    IDEA-20260920-b6ad24 (A1) that forces a nontrivial DL-Fourier coefficient
      tau = max over a != 0 of | sum over R in <P> of 1_{A_i}(R) e_n(-a log_P R) |
        >= |A_i| / sqrt(2b) >= n^{2/3} / (sqrt 2 * n^{1/12}) = n^{7/12}/sqrt 2.
    Expanding 1_{A_i} = (1/L) sum over j of zeta^{-ij} chi^j(x(.)), some j != 0
    must satisfy
      | sum over R in <P> of chi^j(x(R)) e_n(-a log_P R) | >= n^{7/12 - o(1)},
    a MIXED multiplicative-additive character sum over the points of the
    subgroup, of size n^{1/12} ABOVE the square-root level n^{1/2}. The Weil
    bound for this sum carries a genus factor of order L = n^{1/3} and is
    therefore n^{5/6}, which does NOT forbid n^{7/12}. THE QUESTION IS
    GENUINELY OPEN AND IS EXACTLY: is the mixed sum square-root cancelling
    UNIFORMLY IN THE ORDER OF THE MULTIPLICATIVE CHARACTER, or only up to the
    genus-weighted bound?

    (D5) THE TWO OUTCOMES, BOTH INFORMATIVE, WITH THEIR NUMBERS.
    OUTCOME 1, the expected one. If the mixed sum is n^{1/2+o(1)} uniformly in
    j, then tau <= n^{1/2+o(1)} and inverting (A1) gives
    b >= n^2/(2 M^2 tau^2) = n^{1/3 - o(1)}/2, against the requirement
    b < n^{1/6}. THE KEY FAILS THE BRANCHING THRESHOLD BY A FACTOR
    n^{1/6 - o(1)}, EXACTLY, and the power-residue lane closes with a named
    mechanism rather than with a taste judgement. IDEA-20260829-4b34c5's
    positive side is then closed too, in branching vocabulary, by three lines
    rather than by the bilinear-sum programme it proposed.
    OUTCOME 2. If a mixed sum of size n^{7/12} exists for some order-L
    character, the branching window of IDEA-20260920-a5757d (E) is POPULATED at
    lambda = 1/2, the floor of IDEA-20260920-b6ad24 is silent there by
    construction, the learner's necessary condition is met but its actual bias
    eps = tau/n >= n^{-5/12} is BELOW its n^{-1/4} threshold so the learner is
    NOT sub-rho, and the merge is strictly the better use of the object -- the
    (D1) band realised. That would route to review-breakthrough at max effort.
    NOT CLAIMED, and the record predicts Outcome 1.

    (D6) THE SECOND, INDEPENDENT OBLIGATION. Even under Outcome 2 the branch
    index set must be O(1)-computable from (i, j), i.e. chi(x(R+S)) must be
    predictable from chi(x(R)) and chi(x(S)) up to b values. That is an
    APPROXIMATE-HOMOMORPHISM condition on chi composed with x, which is the
    IDEA-20260806-c5d183 / KN-FIND-ffe1df rigidity lineage at branching b. A
    key passing (D4) but failing (D6) must be charged an enumerated table of
    size M^2 b = n^{2/3} b, which is Bernstein-Lange precomputation and appears
    as P, not as free structure. BOTH obligations must be met; the record does
    not assert either.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: R1 -- the affine x-coordinate in F_p
    postprocessed by a single exponentiation x -> x^{(p-1)/L}, which is an
    F_p-arithmetic function of the coordinate. The y-sign is discarded (the
    condition is automatically sign-invariant since x(-R) = x(R)), which is
    recorded because it forces A_i = -A_i and hence 0 in A_i + A_i.
    OPERATION SET SIGMA: pair addition on <P>, used at depth EXACTLY 2. Sigma
    contains the full translation action, so per the constraint block THIS IS A
    BRANCHING OBJECT and is declared as such.
    TRICHOTOMY (IDEA-20260806-c5d183): CLASS II, BRANCHING. One-line reason:
    the propagation rule chi(x(R+S)) from (chi(x(R)), chi(x(S))) is set-valued
    of size b > 1 and (D6) is precisely the question of how large b is; the
    b = 1 cell is empty by KN-FIND-ffe1df Theorem C and is not disputed.
    LOSSY-PROJECTION TEST AGAINST SIGMA. DISCARDED: log(n/L) = (2/3)log n bits
    -- everything about R except which of L power-residue classes x(R) lies in.
    COMPATIBLE WITH SIGMA: only up to a stated branching bound b, which is the
    only compatibility available on a prime-order group; a block system would
    require b = 1 and is empty. LOSSY IN THE REPRESENTATION ACTUALLY USED: yes,
    strongly -- x(R) does not determine R, and chi(x(R)) determines x(R) only
    up to a set of size (p-1)/L = about n^{2/3}. Nothing is recoverable, so
    this is not the (Delta, Pi) failure of inventor-protocol section 2.
    PRICED OPEN NUMBER: the (L_loss, b) pair of IDEA-20260802-002 with
    L_loss = (2/3) log_2 n bits discarded, and b the one-step additive
    branching, whose decision threshold is sqrt(M) = n^{1/6} and whose value is
    determined by the mixed character sum of (D4). The record's content is that
    this one number decides the family.
    WHY THIS IS NOT IDEA-20260829-4b34c5. That record uses the multiplicative
    subgroup as an ACCEPTED SET on the SUM -- a post-hoc predicate
    chi(x(R+S)) = 1 -- and proposes BILINEAR character sums over the
    acceptance matrix chi(x(R_i + S_j)) to decide pseudorandomness, predicting
    the bilinear threshold exceeds n^{1/3}. This record uses the same character
    as a LEAF KEY with a branch rule, which is the distinction
    IDEA-20260901-d77aa8 drew (keys on sums versus keys on leaves), and the
    decision becomes a ONE-VARIABLE mixed sum rather than a bilinear one --
    available at every list length, where the bilinear form was not. Applying
    this record's conclusion to 4b34c5's sum-bucket, or vice versa, is a
    category error and is flagged as a confounder.
    OFF-LIMITS COMPONENTS USED, NAMED: F1 only as M1's level-2 birthday. F7
    only as the charge levied in (D6). No factor base is introduced; the
    KN-OPEN-020 declaration in (D3) is made because the DESCRIPTION is
    implicit-membership, not because any relation mechanism exists here.

