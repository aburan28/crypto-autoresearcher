  assumptions:
    - "A1. n is prime, G = <P> of order n, and L divides p - 1 so that the index-L subgroup of F_p^* exists. The second condition is a CONSTRAINT ON CURVE SELECTION and is not automatic; a curve whose p - 1 has no divisor near n^{1/3} is outside the construction and that is a real restriction, not a technicality."
    - "A2. Cost model M1 of IDEA-20260920-a5757d is imported unchanged, with the per-evaluation cost c = O(log p) field operations for one exponentiation charged explicitly as a multiplier on T."
    - "A3. Lemma (A1) of IDEA-20260920-b6ad24 is correct. Everything quantitative here inverts it; if it fails, (D4) and (D5) fail with it."
    - "A4. The Gauss-sum computation ||vhat||_1 = Theta(p^{1/2}) for the index-L subgroup indicator uses |chihat^j(xi)| = p^{-1/2} for all nonzero xi and nontrivial j, which is exact for multiplicative characters of F_p^*; the O(1/p) boundary terms from the zero element are carried and do not change the order."
    - "A5. Off-limits components used: F1 inside M1 only; F7 as the (D6) table charge only. No factor base; KN-OPEN-020's implicit-membership class is declared for the DESCRIPTION, per (D3)."

  proof_search_map:
    bottleneck: >-
      The single step whose resolution decides the record is the size of the
      mixed sum | sum over R in <P> of chi^j(x(R)) e_n(-a log_P R) | as a
      function of the ORDER of chi^j. If it is n^{1/2+o(1)} uniformly in the
      order, Outcome 1 fires and the family closes by a factor n^{1/6}. If the
      genus-weighted bound n^{1/2} * ord(chi^j) is attainable, Outcome 2 is
      live. Nothing else in the record moves the answer, and both branches are
      fully specified in advance.
    baseline_embedding:
      parameter_slice: >-
        SLICE 1, L = 2. chi is the quadratic character, M = 2, the fibres are
        the two classes of x(R) by quadratic residuosity, and sqrt(M) = 1.41 <
        2 <= b by Cauchy-Davenport, so the key FAILS trivially and the
        derivation must say so without invoking any character sum. A
        derivation that needs the sum at L = 2 has mis-stated the threshold.
        SLICE 2, L = p - 1. chi is injective on F_p^*, the key is x itself,
        M = p - 1, no loss, and the lossy-projection test must FAIL (a
        projection that loses nothing is a change of coordinates). The record
        must exclude this slice by its own test rather than by the sum.
        SLICE 3, lambda = 0. Substituting ||vhat||_1 = n^{o(1)} must reproduce
        IDEA-20260920-b6ad24's floor n^{4/11} exactly, confirming that (D1)'s
        band is a continuation of the same formula and not a separate claim.
      reproduction_check: >-
        SYMBOLIC AND EXACT, each value with its group, field and codomain
        named. (i) ||vhat||_1 for the index-L subgroup indicator of F_p^*,
        computed in the ADDITIVE character basis of F_p: FORCED
        Theta(p^{1/2}), specifically (1 + o(1)) (1 - 1/L) p^{1/2} + 1 from the
        L - 1 nontrivial multiplicative components each contributing p * p^{-1/2}
        / L plus the constant term. (ii) ||vhat||_1 for an interval of length
        p/M in F_p, same basis: FORCED Theta(log p), the Fejer/Dirichlet kernel
        L1 norm. (iii) The floor formula at lambda = 1/2:
        (4 - 2*(1/2))/11 = 3/11 = 0.2727, which is BELOW 1/3 -- so the floor is
        not merely silent at lambda = 1/2, it is silent with room, and the
        record must NOT present 3/11 as an achievable exponent. This is the
        single most likely misreading and is pinned here as a forced value with
        its interpretation attached. (iv) At lambda = 1/6 the formula returns
        exactly 1/3, which is the band's lower edge.
    observation_collision:
      observable: "The pair (lambda, M) = (F_p additive spectral norm exponent of the fibre condition, image size)."
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS STATED. The index-L power-residue key and
        a uniformly RANDOM subset of F_p of the same density have nearly the
        same additive spectral norm exponent (a random set of density 1/L has
        ||vhat||_1 = Theta(p^{1/2}) up to logs as well, by the same square-root
        heuristic), and they sit on opposite sides of the branching conclusion
        -- the random set has b = M with certainty, the character key is
        undecided. SO lambda ALONE CANNOT CERTIFY ANYTHING: it is a NECESSARY
        condition only, and a successor that treats a high lambda as evidence
        of structure has an identifiability failure. This is why (D4) reduces
        to the mixed SUM and not to the spectral norm. Second collision: the
        digit-sum family and the power-residue family both clear lambda = 1/6
        and are distinguished only by whether M is tunable, which is not a
        spectral property at all.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the fibre indicator by its multiplicative-character
          expansion 1_{A_i} = (1/L) sum over j of zeta^{-ij} chi^j(x(.)), so
          that a statement about a SET's DL-Fourier coefficient becomes a
          statement about L - 1 explicit MIXED character sums.
          ENCODING exact (orthogonality of multiplicative characters);
          COMPLETENESS every fibre is expanded; SOUNDNESS the triangle
          inequality loses nothing needed, since the conclusion is that SOME j
          is large; TRANSFER none needed; COST LOSS none.
        predicted_gain: >-
          Turns an undecidable-looking combinatorial question (does a
          multiplicative coset pullback have small additive doubling) into a
          single named analytic quantity for which a literature answer either
          exists or is a stated open problem -- and either way the record
          reports a decision rather than an intuition.
      - transform: observable_fiber
        proposed_object: >-
          Hold lambda = 1/2 fixed and vary the forgotten structure: the
          power-residue key versus a random set of the same density. The
          distinguishing intrinsic invariant is the maximum additive doubling
          of a fibre.
        predicted_gain: "Shows lambda is necessary and never sufficient, which is the record's own guard against over-reading (D2)."
      - transform: boundary_lift
        proposed_object: >-
          Extend the excluded region from "bounded-degree algebraic conditions"
          (closed by IDEA-20260920-b6ad24 (A4) on the cost coupling) to
          "conditions whose spectral norm is bounded by their evaluation cost",
          and prove the strict inward improvement that only the decoupled class
          survives.
        predicted_gain: "Converts (D3) from an observation about one key into a closure criterion over a class, at the section 4 standard."
    quantifier_order: >-
      (D1): FOR ALL coordinate keys v with F_p additive spectral norm n^lambda:
      IF lambda < 1/6 THEN the merge route is floored above n^{1/3}; and IF
      lambda <= 1/4 THEN IDEA-20260904-f68c7f's learner necessary condition
      fails. THERE EXISTS an interval of lambda, namely [1/6, 1/4), on which
      the first consequent is absent and the second is present. This is an
      EXISTENCE claim about the band, NOT about any key occupying it.
      (D4): FOR ALL primes p and curves with |<P>| = n prime and L | p - 1,
      L = n^{1/3}: IF the fibre system of chi has one-step additive branching
      b < n^{1/6} THEN THERE EXISTS a nontrivial multiplicative j and a nonzero
      frequency a with mixed sum at least n^{7/12 - o(1)}. The witnesses j and
      a may depend on p, the curve, chi and the fibre; they may NOT depend on
      the point being evaluated.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "the merge route's necessary spectral-norm exponent is 1/6 and
        the learner's is 1/4, so the band [1/6, 1/4) exists; of the corpus key
        panel only the digit-sum and power-residue families clear 1/6, and only
        the latter has tunable M at polylog cost; and the power-residue family
        is decided by one mixed character sum whose two answers are
        n^{1/3}-achievability or a failure by exactly n^{1/6}". IT CANNOT
        CERTIFY: that any key occupies the band; that the power-residue key has
        small branching; that the mixed sum is or is not large; that no key
        outside the panel clears 1/6; or anything about the branch rule, which
        is the separate obligation (D6).
      nearby_object_control: >-
        A uniformly random subset of F_p of density 1/L pulled back to <P>:
        same lambda = 1/2 up to logs, and the desired conclusion (small
        branching) FAILS with certainty, since the sumset of two random fibres
        of density n^{-1/3} covers <P>. A method that cannot distinguish the
        power-residue key from this random set on the BRANCHING axis has
        identified nothing, and lambda alone cannot. SECOND CONTROL: the
        quadratic character L = 2, where b >= 2 > sqrt(2) = sqrt(M) forces
        failure with no analysis at all -- the method must reach that verdict
        by Cauchy-Davenport and not by a character sum.
    proof_obligations:
      - claim: "||vhat||_1 = Theta(p^{1/2}) for the index-L subgroup indicator in the ADDITIVE F_p basis, by Gauss sums"
        responsibility: size
      - claim: "lambda >= 1/6 is necessary for the n^{1/3} corner, by substitution into (A3)"
        responsibility: baseline
      - claim: "lambda > 1/4 is IDEA-20260904-f68c7f's learner necessary condition, quoted not re-derived"
        responsibility: interface
      - claim: "the band [1/6, 1/4) is nonempty and the universal form of d77aa8 (E4) fails on it"
        responsibility: strictness
