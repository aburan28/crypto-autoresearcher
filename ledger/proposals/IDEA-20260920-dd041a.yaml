  heuristic_assumptions:
    - id: H1
      statement: >-
        MIXED-SUM BEHAVIOUR AT HIGH CHARACTER ORDER. For every prime p, every
        ordinary E/F_p with prime-order subgroup <P> of order n, every
        multiplicative character chi of F_p^* of order L | p - 1, every
        nontrivial power chi^j, and every nonzero a in Z/n,
          | sum over R in <P> of chi^j(x(R)) e_n(-a log_P R) | <= C n^{1/2}
          (log n)^{C'}
        with C, C' ABSOLUTE and in particular INDEPENDENT of L. The competing
        hypothesis, which the record treats as live, is that only the
        genus-weighted bound C * L * n^{1/2} holds and is attained.
      rigorous_support: >-
        The genus-weighted bound is the standard Weil consequence for a
        character sum along the curve y^L = f(x) twisted by a group character,
        and it is n^{5/6} at L = n^{1/3} -- rigorous but too weak to decide
        anything here. The L-independent form imitates the classical uniformity
        of Burgess and Polya-Vinogradov-type bounds in the modulus and the
        observed square-root cancellation of Kloosterman and Salie sums
        uniformly in their parameters. IT IS A HEURISTIC HERE AND IS THE
        RECORD'S BLOCKING EXTRACTION: the WebSearch of 2026-09-20 confirmed the
        existence of the Lange-Shparlinski, Ahmadi-Shparlinski and Shparlinski
        sum-product papers and their topics; no body was read and no statement
        was extracted; the one PDF fetched returned unparseable binary.
      validation_plan: >-
        EXTRACTION FIRST, and it is STEP 5 of minimal_test. Obtain
        Ahmadi-Shparlinski (bilinear character sums and sum-product problems on
        elliptic curves), Lange-Shparlinski (Canad. J. Math. 57(2) 2005), and
        Shparlinski arXiv 0806.0640, and record VERBATIM the mixed-sum bound
        and its dependence on the character ORDER. COMPARISON: the predicted
        n^{1/2+o(1)} against the genus-weighted n^{1/2} L, against the trivial
        bound n, and against the decision threshold n^{7/12}. TAIL CHECK: the
        largest character order for which the cited bound is nontrivial, i.e.
        the L at which L n^{1/2} exceeds the fibre size n/L -- that is
        L = n^{1/4}, so for L > n^{1/4} the genus-weighted bound is VACUOUS and
        the literature cannot decide the corner at L = n^{1/3} even in
        principle; RECORDING THAT VACUITY IS ITSELF A COMPLETE DELIVERABLE.
        SAMPLING ROUTE, FLAGGED AS REQUIRING A SCOPE EXTENSION AND NOT
        PROPOSED: exact FFT of chi(x(.)) over the log coordinate at 24 to 34
        bits, at least 8 curves per size, comparing max |sum| against n^{1/2}
        log n and against n^{7/12}. TRANSFER ASSUMPTION, STATED AND
        UNFAVOURABLE: at those sizes the two hypotheses differ by a factor
        between 4 and 7, so the sampling cannot separate them and can only
        detect a gross violation.
    - id: H2
      statement: >-
        NO CHEAP BRANCH RULE FOR chi COMPOSED WITH x. There is no
        O(1)-evaluable function F with chi(x(R+S)) in F(chi(x(R)), chi(x(S)))
        for a set of size b = n^{o(1)}, for all R, S in <P>.
      rigorous_support: >-
        At b = 1 this is exactly KN-FIND-ffe1df Theorem C: an exactly
        sum-compatible index map is a surjective homomorphism onto a group of
        order dividing n, impossible for prime n with 1 < L < n. At b > 1
        nothing is proved and that is the open window of
        IDEA-20260920-a5757d. The statement imitates the classical
        independence of additive and multiplicative structure in F_p (the
        sum-product phenomenon), which is why the Shparlinski sum-product line
        is the right literature.
      validation_plan: >-
        SYMBOLIC, zero compute, STEP 6. Write x(R+S) as the rational function
        of x(R), y(R), x(S), y(S) given by the addition law and ask whether its
        power-residue class is determined by those of x(R) and x(S) up to a
        small set. Record the obstruction explicitly (the numerator is a sum,
        and the character of a sum is not a function of the characters of the
        summands -- which is the whole content). COMPARISON: Wagner's low-bits
        rule on Z/N as the forced-PASS case with b = 2 and a closed form, and a
        random partition as the forced-FAIL case with table size M^2 b. TAIL
        CHECK: if any closed form is found, it is an approximate homomorphism
        and routes immediately to review-breakthrough rather than being
        recorded as a pass. TRANSFER ASSUMPTION: none; per-key symbolic.

  target_complexity:
    time_exponent: >-
      TWO NUMBERS, BOTH CONDITIONAL, NEITHER A CLAIMED ATTACK.
      (i) THE BAND. The merge route's necessary spectral-norm exponent is
      lambda >= 1/6; the spectral-learning route's is lambda > 1/4
      (IDEA-20260904-f68c7f (D)-(E)). On [1/6, 1/4) the merge is not floored
      above n^{1/3} while the learner's necessary condition fails.
      (ii) THE CONDITIONAL EXPONENT. Under Outcome 2 -- a mixed sum of size
      n^{7/12} at L = n^{1/3} -- cost model M1 gives T = n^{1/3+o(1)} group
      operations with b = O(n^{1/6-delta}), times the evaluation cost
      O(log p) per leaf, which is n^{o(1)}. Under Outcome 1 -- square-root
      cancellation -- b >= n^{1/3-o(1)}/2 and the route is NOT sub-rho, failing
      the threshold by a factor n^{1/6-o(1)}.
      THE RECORD PREDICTS OUTCOME 1. Nothing below n^{1/2} is claimed.
    memory_exponent: >-
      Under Outcome 2, memory equals time at n^{1/3}, with P = 0 (no advice)
      unless (D6) fails, in which case an enumerated branch table of size
      M^2 b = n^{2/3} b is precomputation and must be charged as P, which at
      b = n^{1/6} is P = n^{5/6} and destroys the point. Under Outcome 1 no
      memory statement applies. In either case the family is strictly worse
      than Pollard rho on the memory axis at every operating point.
    best_known: >-
      Pollard rho 0.886 sqrt(n) time, O(1) memory; automorphism- and
      negation-discounted rho sqrt(n/|Aut|); BSGS (n^{1/2}, n^{1/2}); van
      Oorschot-Wiener total work n^{1/2}; Shoup's generic Omega(sqrt n), which
      Outcome 2 would violate, consistent only because coordinate evaluation is
      non-generic; preprocessing S T^2 = Omegatilde(n) (KN-LIT-013) and
      P T = n (KN-LIT-5230), inapplicable at P = 0 but applicable the moment
      (D6) forces a table; prime-field index calculus, no known advantage
      (KN-OPEN-001).
    hidden_overhead: >-
      Five disclosures. (i) Everything is conditional on Lemma (A1) of
      IDEA-20260920-b6ad24 and on H1, which is unextracted and whose literature
      may be VACUOUS at L > n^{1/4} -- so the question may be unanswerable from
      the current literature, and that is a stated possible deliverable.
      (ii) The decision margin between the two outcomes is n^{1/12}; any bound
      loose by that much decides nothing. (iii) (D6) is a second, independent
      obligation whose failure converts the route into an n^{5/6}
      precomputation. (iv) The construction requires L | p - 1 with L near
      n^{1/3}, a curve-selection restriction that makes any positive result a
      special-p statement until shown otherwise. (v) The evaluation cost is one
      exponentiation, O(log p) field operations per leaf, which is n^{o(1)} but
      is a large polylog constant in practice and is charged, not absorbed.
    tradeoff_note: >-
      Under Outcome 2 the point is (S, T) = (n^{1/3}, n^{1/3}) with P = 0, so
      S T^2 = n -- exactly ON the Corrigan-Gibbs-Kogan preprocessing iso-curve
      and on the same curve as Pollard rho at (1, n^{1/2}), which
      IDEA-20260829-390ccc already records: even full success would be a NEW
      POINT ON an existing curve, incomparable to rho rather than dominating
      it. van Oorschot-Wiener interpolates at reduced memory w.
      Parallelisation: list build and level-1 scan embarrassingly parallel, the
      level-2 birthday the standard distinguished-point communication
      bottleneck.

