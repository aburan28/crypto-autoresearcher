idea:
  id: IDEA-20260913-cedd2f
  title: >-
    Trace-parity confinement: on y^2 + xy = x^3 + a x^2 + b over F_{2^n} the map
    P -> Tr(x_P) + Tr(a) is the quotient E(F_q) -> E/2E, so a factor base whose
    x-window V lies in ker(Tr) -- Semaev's own low-degree V at every even n -- puts
    every relation sum into ONE coset of 2E; this predicts, with no free parameter,
    the f_dispersion = 0.79-0.82 and variance/mean = 1.46-1.52 measured in
    RUN-SEMBIN-1b9afe, predicts exactly ZERO decompositions for half of that run's
    targets, and imposes on Nagao's disjoint cosets V + v_i a parity constraint
    sum_i Tr(v_i) = m Tr(a) (mod 2) that his Section 7 does not state and that half
    of all coset families violate.
  class: mechanism
  claim: >-
    Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, and let Tr be the absolute
    trace F_q -> F_2. Two facts, one elementary and one standard:

      (F1) x(2P) = lambda^2 + lambda + a with lambda = x + y/x, so Tr(x(2P)) = Tr(a)
           for every P: the double of any point has x-trace equal to Tr(a). This is
           one line and unconditional.
      (F2) Conversely P = (x, y) in E(F_q) lies in 2E(F_q) iff Tr(x) = Tr(a) (the
           point-halving criterion). E has exactly one rational point of order 2,
           (0, sqrt b), so 2E has index 2, and (F1)+(F2) say the index-2 quotient
           E(F_q)/2E(F_q) = Z/2 is computed by the affine formula
           P |-> Tr(x_P) + Tr(a), with the identity mapped to 0.

    CONSEQUENCE FOR ANY SUBSPACE FACTOR BASE. Let V be an F_2-subspace of F_q and
    Fb = {P : x_P in V}. Either V is contained in ker(Tr), or V meets ker(Tr) in a
    hyperplane of V; there is no third case. In the confined case every P in Fb has
    parity Tr(a), so every sum P_1 + ... + P_m of m factor-base points has parity
    m Tr(a) (mod 2), and a target R with Tr(x_R) + Tr(a) != m Tr(a) has EXACTLY ZERO
    m-decompositions, for every choice of the P_i, every curve coefficient b, and
    every chain topology. The relation search never sees half of E(F_q).

    WHEN IS SEMAEV'S V CONFINED. Semaev's default V = span{1, alpha, ..., alpha^{k-1}}
    (2015/310 Section 4.4). Tr(1) = n mod 2, and for a field polynomial
    x^n + x^s + (lower) Newton's identities give Tr(alpha^j) = 0 for 1 <= j < n - s.
    So at EVEN n with k < n - s the low-degree V lies in ker(Tr) and the factor base
    is confined; at odd n, 1 in V has trace 1 and it is not. A random k-dimensional V
    is confined with probability about 2^{-k}, i.e. essentially never.

    THIS IS WHAT RUN-SEMBIN-1b9afe MEASURED. Its three cells (n, m, t, k) =
    (20, 2, 2, 10), (22, 2, 2, 11), (24, 2, 2, 12) are all even n, on a = 0 curves,
    with moduli x^20 + x^3 + 1, x^22 + x + 1, x^24 + x^4 + x^3 + x + 1; this record's
    author checked with the run's own field code that Tr(alpha^j) = 0 for every
    j < k at all three cells (a proposal-time algebraic check, not a measurement of
    the research question). Targets were drawn uniformly on affine points with
    x not in V, so half of them have Tr(x_R) = 1 and are unreachable. With
    lambda := the eq. (11) mean, the confined model is a 50/50 mixture of
    Poisson(2 lambda) and the point mass at 0:

      hit fraction     = (1 - e^{-2 lambda}) / 2
      f_dispersion     = [(1 - e^{-2 lambda})/2] / (1 - e^{-lambda})
      variance / mean  = 1 + lambda .

    At the run's measured means lambda = 0.45 ... 0.52 this gives f_dispersion =
    0.819 ... 0.797 and variance/mean = 1.45 ... 1.52. The validator's measured
    values (coordination/review/sembin-20260913-run2/TASK-20260913-31d530/report.md)
    are f_dispersion 0.79-0.82 and variance/mean 1.46-1.52 for low_degree_polynomial
    V, and 0.99-1.01 and 0.99-1.00 for random_k_dimensional V, with no dependence on
    b. Every one of those numbers is what the parity model predicts before any
    fitting. The validator correctly localised the deficit to "a property of the
    x-coordinate window" and left the mechanism unnamed; this proposal names it and
    makes it falsifiable per target.

    CONSEQUENCE FOR NAGAO. In EQS3/EQS4 the i-th variable ranges over V + v_i. If V is
    confined, coset i has constant parity Tr(v_i) + Tr(a), and the m-sum has parity
    sum_i Tr(v_i) + m Tr(a). The relation search reaches only the 2E-coset of that
    parity. The ECDLP targets R = uP + vQ live in an odd-order subgroup, which lies
    inside 2E (parity 0). So Theorem 1's construction has a yield of exactly zero on
    every cryptographic target unless sum_i Tr(v_i) = m Tr(a) (mod 2) -- a condition
    Section 7 does not state, that a uniformly random disjoint family fails with
    probability 1/2, and that costs nothing to impose once known. This is not the
    m! question: it is a factor of 0 or 2, orthogonal to it, and it must be
    controlled before any typed-versus-untyped image ratio is read.

    THE LOSSY-PROJECTION READING. E -> E/2E is a genuinely lossy projection that
    propagates deterministically under the group law -- consistent with KN-FIND-ffe1df
    Theorem C, because it is TRIVIAL on the prime-order subgroup where the DLP lives.
    It is therefore not an attack; it is a yield obstruction on the factor base and a
    correction to how yield data taken over all of E(F_q) transfer to the subgroup.
    On subgroup targets (all in 2E) the confined factor base delivers mean 2 lambda,
    not lambda: the validator's "eq. (11) overstates P by 18-22% for the paper's own
    V" reverses sign for the targets the algorithm actually decomposes.
  mechanism: >-
    THE OBJECT TRACKED. The parity class pi(P) := Tr(x_P) + Tr(a) in Z/2, extended by
    pi(O) = 0. Operation set: the group law restricted to sums of factor-base points.
    Lossy-projection test: pi discards everything but one bit; it is compatible with
    addition because it is the quotient map onto E/2E (F1 gives pi(2P) = 0, and 2E
    has index 2 because E[2](F_q) = {O, (0, sqrt b)} has order 2); so pi(P + Q) =
    pi(P) + pi(Q) and the retained bit propagates deterministically. On the
    odd-order subgroup pi is identically 0, which is why it is a constraint on the
    factor base rather than a projection of the DLP instance.

    WHY THE DEFICIT LOOKS LIKE OVER-DISPERSION. Conditioned on pi(R) = m Tr(a) the
    counts are what eq. (11) predicts but with the image concentrated on half the
    group, so mean 2 lambda; conditioned on the other class they are identically 0.
    Pooling the two classes gives mean lambda (unchanged) and variance lambda +
    lambda^2, hence variance/mean = 1 + lambda > 1 and a hit fraction below
    1 - e^{-lambda}. That is exactly a shape deficit with an intact mean -- the
    signature the validator reported and could not attribute.

    WHY b DOES NOT ENTER. The criterion involves a and the x-coordinate only; b fixes
    which x carry points but not their parity class. The validator's observed
    b-independence is therefore predicted, not incidental.

    WHY THE RANDOM SUBSPACE SHOWS NOTHING. A random V is confined only if all k basis
    vectors have trace 0, probability 2^{-k} ~ 10^{-3} at k = 10; otherwise the factor
    base has both parities in equal measure and every target is reachable.

    WHAT IT DOES TO NAGAO'S SECTION 7. Each coset V + v_i is monochromatic in parity
    when V is confined. The typed relation set reaches one class; the untyped
    (Semaev) set with the same V also reaches one class (parity m Tr(a)). Both image
    sizes in RUN-SEMBIN-cbd770 must be read against a target set of size #E/2, not
    #E, at the confined cells -- the (n, k, m) = (12, *, *) rows with
    low_degree_polynomial V, since n = 12 is even and k <= 4 < 12 - s. The odd-n
    rows (15, 17) and all random_k_dimensional rows are unconfined. So the run
    contains its own matched comparison, unanalysed.
