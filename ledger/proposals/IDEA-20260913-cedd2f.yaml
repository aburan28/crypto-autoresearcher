    this_proposal_claims: >-
      NOTHING about the exponent. It corrects the per-target yield by a factor in
      {0, 2} depending on Tr-confinement and target class, and adds one parity
      condition to the choice of Nagao's representatives. Constant-factor and
      correctness-of-construction only.
    claim_kind: mechanism
  dominated_by:
