  novelty_screen:
    what_is_not_new: >-
      (F1)/(F2) are textbook: the halving criterion Tr(x) = Tr(a) is in Fong,
      Hankerson, Lopez, Menezes (2003) Lemma 4.1(iv) and in Pornin ePrint 2022/1325
      Section 3 ("a point P' can be halved if and only if Tr(x0 + A) = 0"), both
      retrieved and read this session. The E/2E quotient as a lossy object is already
      used in this program for odd p by IDEA-20260913-31457a (halving-branch
      selection) and IDEA-20260829-c705b4 (2-descent images). The over-dispersion
      measurement itself is TASK-20260913-31d530's.
    what_is_new: >-
      Applying the parity quotient to a subspace factor base -- the observation that a
      trace-zero x-window confines every Semaev relation to one coset of 2E, that
      Semaev's own low-degree V is trace-zero at every even n, that this reproduces
      the measured f_dispersion and variance/mean at RUN-SEMBIN-1b9afe with zero free
      parameters, and that it imposes a parity condition on Nagao's coset
      representatives. A targeted web search (Semaev / summation polynomial / factor
      base / trace / 2E; hits: ePrint 2015/319 Karabina, ePrint 2004/031, 2022/1325)
      found no statement of the constraint in the PDP literature, and the fetched
      2015/319 text contains no occurrence of "trace" or "2E". Absence in one search is
      not evidence of absence; hence `speculative`, not `adaptation`.
    searched: >-
      rg over knowledge/, ledger/, docs/, experiments/ for "Tr(x) = Tr(a)", "point
      halving", "E/2E", "2E(F" (hits listed above; none on binary-curve factor bases);
      the RUN-SEMBIN-1b9afe validator report in full (it stops at "property of the
      x-coordinate window"); RUN-SEMBIN-1b9afe/code/yield_core.py and yield_run.py for
      the subspace and target constructions; RUN-SEMBIN-cbd770 code for its curve
      (A = 0) and cells. The kb MCP index is not populated in this worktree, so
      absence of a retrieval hit is not evidence and is not offered as such.
  citations:
