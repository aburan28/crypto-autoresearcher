  assumptions:
    - >-
      (F2)'s converse direction (Tr(x) = Tr(a) implies P in 2E) is taken from the
      retrieved sources and was additionally confirmed by exhaustive enumeration at
      n = 7, 8, 9 for a in {0, 1} using the run's own field code (2E affine points =
      {P : Tr(x_P) = Tr(a)} exactly, six cases). That check is part of the
      lossy-projection test and is not evidence about any cell of the research
      question.
    - >-
      RUN-SEMBIN-1b9afe's targets are uniform on affine points with x outside V, so
      the two parity classes are equally represented up to O(q^{-1/2}). Verified by
      reading draw_targets in yield_run.py.
    - >-
      The measured means 0.45-0.52 stand in for eq. (11)'s lambda; the model's
      predictions are computed at the measured mean, not at a fitted one.
  predictions:
    - >-
      P1 (deterministic, zero free parameters). In RUN-SEMBIN-1b9afe's
      low_degree_polynomial configurations, every target with Tr(x_R) = 1 has
      decomposition count EXACTLY 0, in both the single and chained presentations, in
      all 3 cells, all seeds, both b modes. One nonzero count on one such target
      falsifies the mechanism outright.
    - >-
      P2. Conditioned on Tr(x_R) = 0, the same configurations have mean 2 lambda
      (within sampling error of twice the pooled mean) and variance/mean within
      sampling error of 1.00 -- the Poisson shape is RESTORED inside the reachable
      class. The pooled variance/mean equals 1 + lambda to within error.
    - >-
      P3. In random_k_dimensional configurations, both classes are hit, with means
      equal within error, and the per-class variance/mean is about 1.00; no
      stratification effect.
    - >-
      P4 (new cells). At ODD n with low-degree V (e.g. n = 21, 23, k = ceil(n/2)),
      1 in V has trace 1, so no confinement: f_dispersion within error of 1.00 for
      the low-degree V. The deficit is an even-n phenomenon, not a low-degree-V
      phenomenon as such.
    - >-
      P5 (Nagao's cosets). For EQS3/EQS4-style typed families over a confined V at
      even n, a family with sum_i Tr(v_i) != m Tr(a) (mod 2) has image size 0 on
      targets in 2E; a family satisfying the congruence has image contained in 2E.
      In RUN-SEMBIN-cbd770's n = 12 low_degree_polynomial rows, every typed and
      untyped image lies in a single parity class, and neither does at n = 15, 17 or
      for random V.
    - >-
      P6 (sign reversal on subgroup targets). Restricted to targets in the odd-order
      subgroup, the confined factor base's per-target mean is 2 lambda, so the
      validator's finding that eq. (11) overstates P by 18-22% for Semaev's own V
      becomes an UNDERstatement of the mean by a factor 2 on exactly the targets the
      algorithm decomposes. This is a re-reading of existing data, not a new claim
      about Semaev's complexity: it changes the constant, not the exponent.
  minimal_test:
    what: >-
      A pure re-analysis of RUN-SEMBIN-1b9afe/per-R-counts.json: compute Tr(x_R) for
      each recorded target under the run's own modulus, split every configuration's
      counts by that bit, and report per class: count of targets, count of nonzero
      decompositions, mean, variance/mean. P1 is decided by a single integer (number
      of nonzero counts in the Tr = 1 class of low-degree configurations, predicted
      0). Then the same split on RUN-SEMBIN-cbd770's image-sizes.json membership
      where the images are recorded, for P5. No new curve arithmetic beyond the trace.
    controls:
      - >-
        NULL OBJECT: the random_k_dimensional configurations of the same run, same
        cells, same seeds. The mechanism predicts no stratification there (P3). If the
        Tr = 1 class shows a deficit for random V too, the effect is not parity
        confinement and P1's zero is a coincidence to be explained otherwise.
      - >-
        KNOWN-FALSE OBJECT: a synthetic split of the same data by an unrelated bit
        (e.g. the lowest bit of x_R, or Tr(x_R) computed under a DIFFERENT irreducible
        modulus of the same degree). Both classes must then show equal means and the
        pooled over-dispersion must persist in each. If a random bit also produces an
        empty class, the analysis code is wrong.
      - >-
        MATCHED NULL: the run's own eq. (11) symmetric random-map null, which has no
        curve and hence no parity; its "Tr split" (by any bit) must show two
        indistinguishable Poisson classes.
      - >-
        RECONSTRUCTION CHECK: the pooled statistics recomputed from the two classes
        must reproduce the validator's f_dispersion and variance/mean to the printed
        precision, or the re-analysis is not reading the same data.
    stopping: >-
      The re-analysis is finite and complete when every configuration in the two run
      packages has been split. New-cell tests (P4) are a follow-up and are scoped by
      the largest odd n the existing counting code reaches; an unreached cell is a
      recorded scope limit.
  falsification_conditions:
    - >-
      Any target with Tr(x_R) = 1 in a low_degree_polynomial configuration of
      RUN-SEMBIN-1b9afe having a nonzero decomposition count falsifies (F2) as
      applied, or the confinement claim, at that cell -- and since the claim is a
      theorem given (F1), (F2) and V in ker(Tr), it would indicate an error in the
      recorded x_R, the modulus, or this record's reading of the code; that error
      would be recorded, not the theorem.
    - >-
      Per-class variance/mean in the Tr = 0 class remaining at 1.4-1.5 falsifies the
      claim that parity confinement is the WHOLE deficit: something else over-disperses
      the counts and the validator's open attribution stands with this mechanism
      subtracted.
    - >-
      Low-degree V at odd n showing f_dispersion 0.79-0.82 falsifies the even-n
      scoping (P4) and points to a different window property.
    - >-
      An n = 12 low-degree typed image in RUN-SEMBIN-cbd770 containing points of both
      parity classes falsifies P5 and with it the transfer of the mechanism to the
      typed construction as that run implemented it.
  confounders:
    - >-
      MODULUS MISMATCH. Tr depends on the field representation only through the
      identification of elements; the recorded x_R are integers under the run's
      modulus, so the re-analysis must use modulus_for(n) from the run's own code, not
      a transcribed polynomial.
    - >-
      THE x = 0 POINT. (0, sqrt b) is the 2-torsion point, lies in V, and is excluded
      from targets; it IS in the factor base. Its parity is Tr(0) + Tr(a) = Tr(a),
      consistent with the confined class, so it does not break confinement, but a
      count of factor-base parities must include it.
    - >-
      TWIST SIDE. The run also counts on the quadratic twist; the twist has its own a'
      with Tr(a') = Tr(a) + 1, so the confined class flips. The split must be done per
      side with the side's own a.
    - >-
      CHAINED PRESENTATION. The chained system introduces intermediate U variables not
      restricted to V; but the relation it encodes is still R = sum of m factor-base
      points, so parity applies identically. The run's finding that chained never
      gains a solution over single is consistent and is not re-derived here.
  interpretation_limits:
    - >-
      Says nothing about first fall degree, Proposition 5, or the exponent of Theorem
      1. It is a statement about which targets a factor base can reach and about how a
      yield measured over E(F_q) transfers to a subgroup.
    - >-
      Says nothing about any curve's security. The projection is trivial on the
      prime-order subgroup and is not an attack ingredient.
    - >-
      Scoped to y^2 + xy = x^3 + a x^2 + b over F_{2^n} with a single rational 2-torsion
      point (b != 0). Supersingular binary curves have different 2-torsion and are out
      of scope.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. The mechanism is a theorem given (F1)-(F2); its predictions P1 and P5 are
    deterministic. P2/P3 use the Poisson shape only as the comparison the original
    run already used.
