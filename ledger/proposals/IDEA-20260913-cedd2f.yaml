      zero parity conditions recorded on {v_i}.
    delta_if_successful: >-
      Mechanism named and confirmed by a zero-parameter per-target prediction (P1);
      one necessary condition sum_i Tr(v_i) = m Tr(a) (mod 2) added to Theorem 1's
      construction; the transfer of eq. (11) yield to subgroup targets corrected by a
      factor 2 in the confined case.
  recommended_priority: high
  estimated_cost:
    wall_clock_seconds: null
    memory_gb: 1
    note: >-
      Advisory. The minimal test is a re-analysis of two committed JSON artifacts with
