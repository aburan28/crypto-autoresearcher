  title: >-
    Multiplication by 34 has degree 1156 and multiplication by 33 has degree 1089
  class: measurement
  claim: >-
    Multiplication by 34 has degree 1156. Multiplication by 33 has
    degree 1089. One thousand one hundred fifty-six exceeds one thousand
    eighty-nine by 67. The product of the two degrees is 1258884.
    Their sum is 2245. The gap is a map degree, not an ECDLP exponent
    and not the degree pair 1089 and 1024.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Thirty-four squared is 1156. Thirty-three squared is 1089. Two
    maps of degree 1089 have gap 0 and product 1185921. No point is mapped.
  novelty_status: unverified
