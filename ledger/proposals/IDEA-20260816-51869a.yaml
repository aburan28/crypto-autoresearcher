idea:
  id: IDEA-20260816-51869a
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: Obtain the optimal forgery probability EXACTLY by enumerating difference-polynomial root
    sets over the entire key space in matched scaled-down GHASH and Poly1305 analogues, and report
    the measured-to-bound RATIO as a surface over message length and query count in both fields from
    one invocation
  class: measurement
  claim: '(A) Define, for a scaled-down GHASH analogue over GF(2^n) and a scaled-down Poly1305 analogue
    over a prime field of the same bit width n, the quantity P_opt(L, q, n) = the maximum over achievable
    forgery strategies of the probability, taken over the uniform authentication key and the uniform
    per-nonce mask, that at least one of q verification queries is accepted, where every queried message
    has at most L blocks. (B) The claim is that P_opt is obtainable EXACTLY rather than estimated
    at these parameters, because acceptance of a fixed candidate forgery is equivalent to the authentication
    key lying in the root set of a difference polynomial of degree at most L whose coefficients the
    forger chooses subject to the mode''s encoding constraints; that root set is enumerable by direct
    evaluation over the whole key space of size at most 2^n, so the maximisation is a finite search
    rather than a sampling problem. (C) The deliverable is not P_opt but the RATIO R(L, q, n) = P_opt
    / B(L, q, n), where B is the forgery bound instantiated at exactly those parameters and computed
    in the same script from a single pinned formula whose provenance must be a KN-LIT entry read from
    primary text - that pinning is a declared derivation gap for the Coordinator, not something this
    record supplies. (D) The pairing claim: R is computed for both fields inside one invocation, on
    matched parameters, and the quantity under test is the discrepancy R_binary minus R_prime. A model
    of tightness that fits one arm and not the other is a property of the field and is recorded as
    such. (E) WHAT IS NOT CLAIMED: no forgery, weakness, attack, or security consequence for AES-GCM,
    ChaCha20-Poly1305, or any deployed protocol or library; no assertion that either bound is loose
    or tight at deployed parameters; and no extrapolation of R from n at most 20 to n = 128 is offered
    as evidence - any such extrapolation is a labelled projection under the anchor question''s constraints.'
  mechanism: 'STAGE 1 fixes both analogues and freezes them before any measurement: a binary arm over
    GF(2^n) with a pinned irreducible polynomial, blocks of n bits, digest equal to the sum of message
    blocks times descending powers of the key plus a length block, tag equal to digest XOR a per-nonce
    uniform mask; a prime arm over a prime p of bit width n, blocks of n-2 bits carrying a forced
    high bit exactly as the full construction pads, digest equal to the same power sum modulo p, tag
    equal to digest plus a per-nonce uniform mask reduced to n-2 bits. The mask is modelled as an
    ideal uniform value rather than a cipher output; that substitution is declared, and its consequence
    is that the measurement is about the hash layer only. STAGE 2 enumerates, for each length L, the
    achievable difference polynomials and computes each one''s root set by evaluating at every key.
    Because the key space is at most 2^20 this is exhaustive, not sampled. STAGE 3 maximises over
    achievable differences to obtain the single-query optimum, then composes q non-adaptive queries
    by union of root sets and searches for the maximising q-tuple under a declared enumerable strategy
    family. STAGE 4 instantiates B at the same (L, q, n) and divides. STAGE 5 runs the identical pipeline
    against the null arm in the same process. Refutation: if the maximising search does not converge
    to a stable optimum under a doubled strategy family, the record reports a bracket rather than
    a value.'
  novelty_status: unverified
  novelty_screen:
    method: Read ledger/questions/RQ-POLYMAC-7c89e4.yaml in full and ledger/goals/GOAL-POLYMAC-001.yaml.
      Ran a repository-wide grep for POLYMAC, GHASH, Poly1305, poly1305 and ghash across ledger/proposals,
      ledger/hypotheses, knowledge/ and experiments/, and a second grep for universal hash, Carter-Wegman,
      wegman and forgery across ledger/proposals, knowledge/techniques, knowledge/findings and knowledge/open-problems.
      Listed the titles of every proposal attached to RQ-AEADC-8db132. Read knowledge/literature/KN-LIT-4060.md,
      KN-LIT-5652.md and KN-LIT-7035.md front matter and claim sections.
    results: 'Exactly one proposal in the whole ledger is reached by the POLYMAC grep, and it is a
      cross-reference rather than a POLYMAC proposal: IDEA-20260809-3a39bc, filed under RQ-AEADC-8db132,
      whose own novelty_screen line states that GOAL-POLYMAC-001 owns forgery bounds as a different
      property. IDEA-20260807-812fd2 uses GHASH''s power weighting as an output combiner in an AES
      integral-transfer argument, not as a MAC under forgery. The nine RQ-AEADC-8db132 proposals are
      all key-commitment certificates, k-way collision curves, committing-construction overhead, and
      padding-fix bounds - none measures forgery probability against a bound. KN-LIT-5652 and KN-LIT-4060
      are corpus entries at confidence reported, generated in a bulk seeding pass from first two pages,
      explicitly marked not verified here; KN-LIT-5652''s relevance note is mis-tagged to pairing-based
      reductions. No evidence record, hypothesis, or experiment directory contains a measured forgery-to-bound
      ratio in either field.'
    verdict: 'UNVERIFIED. No agent in this environment can read external literature, so nothing here
      asserts what is or is not published. What is claimed new WITHIN THIS REPOSITORY is the ratio
      itself as the deliverable object and the two-field simultaneity: a single invocation that produces
      R for a binary-extension arm and a prime arm on matched parameters and reports their difference.
      What is assembled from known parts: the scaled-down analogue idea is written into the anchor
      question''s methods; the root-set characterisation of forgery acceptance is elementary polynomial
      algebra; the bound formula B is not supplied here at all and must arrive through a KN-LIT entry
      read from primary text. The honest statement is that this record contributes an instrument and
      a ratio, not a new attack idea.'
  object_first_candidate:
    tracked_object: The ROOT SET of the difference polynomial induced by a candidate forgery - that
      is, the subset of the authentication-key space on which a fixed forgery attempt is accepted.
      Everything the forger controls enters only through the coefficient vector of that polynomial,
      and everything the verifier does enters only through membership of the key in the root set.
    lossiness: The projection is genuinely lossy. It discards the message contents, the nonce, the
      per-nonce mask, the block ordering beyond its effect on coefficients, and the identity of individual
      accepted keys - retaining only an unordered subset of the key space and its cardinality. This
      is compatible with the target operation because the mask is uniform and independent of the key,
      so it cancels in the difference, and because acceptance depends on the key only through the
      vanishing of the difference polynomial. Two entirely different forgeries with the same root
      set are indistinguishable under this projection, which is exactly why it is a projection and
      not a change of coordinates.
    propagation: 'One additional verification query acts on the tracked object by union: the accepted-key
      set after q queries is the union of the q individual root sets. One additional message block
      acts by raising the maximum possible degree of the difference polynomial by one, hence the maximum
      possible cardinality of a single root set by one, since a degree-d polynomial over a field has
      at most d roots. The forger''s optimisation is therefore a covering problem over the key space,
      and the whole measurement reduces to how large a union of achievable root sets can be made at
      budget (L, q).'
    survival_score: 'The object survives every operation of the hash layer exactly and without approximation,
      at every parameter, because it is definitional. It DISSOLVES at two named places: first, when
      the mask stops being uniform and independent - a real block cipher output is not, and the substitution
      is declared, so the object describes the hash layer and not the AEAD; second, when the forger
      is adaptive across queries, because then the coefficient choice at query i depends on the rejection
      of queries 1 to i-1 and the union is no longer over a fixed family. The contract measures the
      non-adaptive union exactly and reports the adaptive case as a declared strategy family with
      its enumeration bound, not as a solved optimum.'
  null_object_control: 'The null arm replaces the polynomial-evaluation digest with a uniformly random
    function of the same interface and output width - implemented in the same process as a keyed table
    drawn once per key from the system RNG - and runs the IDENTICAL enumeration, maximisation and
    ratio computation. For the signal arm to mean anything the null must show: the accepted-key set
    for any fixed forgery has expected cardinality independent of L, so the null''s R must be flat
    in L; and the union over q queries must grow linearly in q with no degree ceiling. If the null
    instead shows an L-dependent R, the enumeration or the bound instantiation is wrong and the signal
    arm is uninterpretable. A second null, a ring arm over Z_m with m composite of the same bit width,
    is included because zero divisors change root counts: it must show root-set cardinalities exceeding
    the degree, and if it does not, the root-counting code is not measuring what it claims.'
  discriminated_from:
  - 'IDEA-20260809-3a39bc (RQ-AEADC-8db132): measures the cost of constructing a two-key commitment
    certificate for ChaCha20-Poly1305 versus GCM and ablates clamping and mask. That is a construction
    cost for a different predicate; this record measures acceptance probability against a bound and
    never builds a certificate.'
  - 'IDEA-20260809-313546 (RQ-AEADC-8db132): derives a two-key GCM certificate from the authenticator''s
    linear structure at full parameters. It uses the same algebra in the opposite direction - solving
    for keys given a target - and produces an artifact, not a ratio.'
  - 'IDEA-20260807-812fd2 (RQ-AES-001): treats GHASH''s power weighting as an output combiner blocking
    integral transfer into the tag. The tracked object there is a balanced multiset of AES states;
    here it is a root set in the key space, and no cipher is evaluated at all.'
  - KN-LIT-5652, a corpus entry at confidence reported and citation_verified read, whose relayed abstract
    concerns optimal forgeries against polynomial MACs. This record does not restate or rely on that
    entry's claims; it supplies a measured ratio at declared toy parameters and requires the bound
    formula to arrive separately through primary text.
  - 'A generic Monte Carlo estimate of forgery probability: this record does not sample. The optimum
    is obtained by exhaustive evaluation over the full key space, which is what makes the toy scale
    worth using at all.'
  assumptions:
  - The per-nonce mask can be modelled as uniform and independent of the authentication key for the
    purpose of measuring the hash layer. This is a declared substitution, not a property of any deployed
    construction.
  - A scaled-down analogue with pinned irreducible polynomial, pinned prime, and pinned padding rule
    is a faithful structural analogue at the hash layer. The analogue and its scaling rule are frozen
    before measurement per the anchor question's constraints.
  - The bound formula B can be instantiated at toy parameters at all - that is, it is a formula in
    (L, q, field size) and not a statement valid only asymptotically. If it is not, the ratio is undefined
    and the contract reports that as its result.
  - The declared non-adaptive strategy family contains the optimum, or the reported value is a lower
    bound on P_opt and is labelled as such.
  predictions:
  - metric: R(L, q, n) = P_opt / B at matched parameters, binary arm
    direction: lower
    minimum_effect: R is at most 1 at every measured (L, q, n); any measured R strictly greater than
      1 by more than one part in 10^6 is treated as an instrument fault or a bound-instantiation error,
      not as a finding, and halts the run
  - metric: absolute difference |R_binary - R_prime| at matched parameters
    direction: different
    minimum_effect: 'no pre-commitment. Reason: this record deliberately holds no numeric prior for
      either bound because the anchor question forbids seeding the ledger with remembered constants,
      and a pre-committed effect size here would be invented rather than derived.'
  - metric: dependence of null-arm R on message length L
    direction: different
    minimum_effect: the null arm's R must be flat in L to within 5 percent relative across the L ladder;
      more variation than that disqualifies the invocation
  - metric: maximum single-query accepted-key-set cardinality divided by L
    direction: higher
    minimum_effect: the ratio is at most 1 exactly, in both arms, at every L - this is a hard algebraic
      check on the enumerator and a violation is a code fault
  minimal_test:
    design: 'The cheapest discriminating measurement fixes n = 12 only, L in {1, 2, 4, 8}, q = 1,
      and both fields, and computes the single-query optimum by brute force. At n = 12 the key space
      is 4096 and the achievable difference-coefficient space at L = 8 is enumerable in seconds in
      pure Python. The discriminating quantity is a single pair of numbers: R_binary(L, 1, 12) and
      R_prime(L, 1, 12) at each L, together with the null arm''s R at the same points. Three outcomes
      discriminate. If both arms track their bound with the same R curve in L, the pairing supports
      a field-independent tightness picture at this scale and the contract earns the larger (q greater
      than 1, n up to 20) run. If the two arms separate by more than the null arm''s spread, the separation
      is the result and the next question is which structural feature carries it, which is what the
      padding and clamping entries in this bucket exist to answer. If the null arm is not flat, nothing
      is learned about the constructions and the run reports an instrument failure, which is a usable
      outcome about the instrument and not about the mathematics.'
    controls:
    - 'Null arm: uniformly random keyed function of the same output width, identical enumeration path,
      same invocation.'
    - Composite-modulus arm over Z_m of the same bit width, whose zero divisors must produce root-set
      cardinalities exceeding the polynomial degree - a positive control that the root counter can
      detect anomalous root counts at all.
    - 'Degree-0 known-answer gate: at L = 0 the difference polynomial is a constant and the accepted-key
      set is empty or the whole space; the measured value must be exactly 0 or exactly 1 with no intermediate
      result.'
    - 'Seed replication: the mask draws and any tie-breaking in the maximisation are seeded, and the
      whole run is repeated at three seeds with identical exhaustive results required, since exhaustive
      quantities must not depend on a seed.'
    - Cross-implementation check of both digest functions against independently written naive reference
      implementations inside the same file, on random inputs, before any measurement.
    required_metrics:
    - P_opt(L, q, n) per arm, as an exact rational where possible
    - B(L, q, n) per arm, from the pinned formula
    - R = P_opt / B per arm
    - R_binary - R_prime at matched parameters
    - maximum single-query accepted-key-set cardinality per (L, arm)
    - null-arm R at every measured point
    - wall-clock and enumeration counts per stage
  falsification_conditions:
  - The null arm's R varies with L by more than 5 percent relative, indicating the enumeration or
    bound instantiation is measuring something other than the claimed quantity.
  - Any measured single-query accepted-key-set cardinality exceeds the difference polynomial's degree
    in a field arm, which is algebraically impossible and therefore a code fault.
  - R exceeds 1 in either field arm, indicating a bound-instantiation error rather than a discovery.
  - The exhaustive result changes between seeds, indicating the pipeline is sampling where it claims
    to enumerate.
  - The composite-modulus positive control fails to show root counts above the degree, indicating
    the root counter cannot detect the anomaly it is supposed to detect.
  - The bound formula cannot be instantiated at toy parameters, in which case the ratio is undefined
    and the contract's central quantity does not exist at this scale.
  confounders:
  - 'The uniform-mask substitution: any difference between arms could be an artifact of how the mask
    is truncated in the prime arm versus the binary arm, rather than of the field. Mitigated by a
    matched-width variant run.'
  - 'The padding rule: the prime arm forces a high bit per block and the binary arm does not, so the
    achievable coefficient sets differ before the field does. This is a real confounder for the pairing
    and is the subject of a separate entry in this bucket.'
  - 'Bit-width matching: a prime of bit width n and a binary field of extension degree n do not have
    the same number of elements, so R comparisons must be made at matched log-cardinality and not
    at matched n.'
  - The declared strategy family for q greater than 1 may exclude the true optimum in one arm and
    not the other, manufacturing a difference that is a property of the search, not of the construction.
  - 'Small-n effects: at n = 8 the key space is small enough that discreteness of the accepted-key
    count dominates the ratio''s resolution.'
  interpretation_limits:
  - Every number produced is a statement about the declared analogues at n at most 20 and about the
    hash layer with an idealised mask. It is not a statement about GHASH, Poly1305, AES-GCM, or ChaCha20-Poly1305
    at their real parameters.
  - A ratio far from 1 at toy scale does not imply looseness at full scale, and a ratio near 1 does
    not imply tightness at full scale. The n-dependence of R is itself unmeasured here and is the
    subject of a separate scaling-ladder entry.
  - 'If only one of the two field arms runs, the record is materially weaker and must say so: a single-field
    measurement cannot distinguish a property of the construction from a property of the field.'
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement's own cost is O(2^n * L * A) field
      operations, where A is the size of the enumerated achievable-difference family, and at n at
      most 20 with A bounded by the declared strategy family this is a bounded desktop computation.
    memory_exponent: No attack memory exponent is claimed. The measurement stores accepted-key sets
      as bitmaps of 2^n bits, so O(2^n) bits per query, at most a few megabytes at n = 20.
    best_known: The incumbent this would have to beat is not an attack but the current practice of
      quoting the bound alone. Within this repository the named incumbent is the pair of corpus entries
      KN-LIT-5652 and KN-LIT-7035, both at confidence reported and both explicitly marked not verified
      here, which supply bound statements as relayed abstracts and no measured ratio.
    hidden_overhead: 'The human cost of freezing the analogue and its scaling rule before measurement,
      and of obtaining the bound formula from primary text, dominates the compute. Lower-order terms
      hide in the maximisation over achievable differences: the declared strategy family is a modelling
      choice, and widening it is unbounded work that the stopping rule must cap.'
  dominated_by: n/a (no result claimed). The Pareto check was performed against every row this repository
    actually holds for polynomial MACs - the six KN-LIT entries matching GHASH or Poly1305 (KN-LIT-4060,
    KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445) and the nine RQ-AEADC-8db132
    proposals - and none of them occupies a time, memory or query frontier that this record competes
    on, because this record produces a measured ratio at toy parameters and claims no attack at any
    parameters. There is therefore no frontier row for it to be dominated by, and that is stated as
    a scope fact rather than as an absence of competitors.
  sota_delta: No attack; measurement contribution only. Quantitatively the delta is from zero measured
    ratios to a table of R(L, q, n) at n in {8, 12, 16, 20}, L in {1, 2, 4, 8, 16} and q in {1, 2,
    4}, in two fields, with a null-arm column - which is 0 rows today in the ledger's 419 evidence
    records.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separated by part. That P_opt is exactly computable at n at most 20 by
    root enumeration: about 0.95, because it is elementary algebra plus a finite loop, and the residual
    risk is the achievable-difference enumeration being larger than expected. That the ratio R is
    well defined at toy parameters, i.e. that the bound formula instantiates there: about 0.6, because
    bounds written for asymptotic use sometimes carry terms that degenerate at small field size, and
    this record deliberately holds no numbers to check against. That the two field arms produce R
    curves agreeing within the null arm''s spread: about 0.35 - a genuine coin toss weighted by the
    fact that the padding rules already differ, which is a non-field reason for them to separate.
    That the whole thing survives red team as a record about the constructions rather than about the
    analogues: about 0.5, and the honest hedge is that the interpretation limits above are load-bearing.'
