idea:
  id: IDEA-20260807-cbe8c1
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    RATIONAL FULL ell-TORSION IS EXACTLY A NON-FLOOR CONDITION IN THE
    ell-VOLCANO: E(F_p)[ell] = (Z/ell)^2 if and only if ell | (m-1) and
    ell * f_E | c, so descending to the ell-floor DESTROYS the rational
    ell-torsion that a translation-symmetrized factor base needs -- routing a
    depth effect through R5 into an R1 cost, with a three-way discriminator
    (step at the floor vs gradient in depth vs flat) and an explicit cofactor
    budget against rho
  class: mechanism

  claim: >-
    (A) THE EXACT CRITERION, DERIVED HERE. Let E/F_p be ordinary, t its trace,
    t^2 - 4p = c^2 D_K with D_K fundamental, K = Q(sqrt(D_K)),
    omega = (D_K + sqrt(D_K))/2, so O_K = Z[omega] and Z[pi] = Z[c omega]. Write
    pi = m + c omega with m = (t - c D_K)/2 in Z. Let End(E) = O_f = Z[f omega]
    with f | c; the level of E in the ell-volcano is v_ell(f) and the volcano
    height is v_ell(c) (Kohel). For ordinary E, E(F_p) is isomorphic to
    O_f / (pi - 1) O_f as an O_f-module, and pi - 1 = (m - 1) + c omega. Hence
      E(F_p)[ell] = (Z/ell)^2
        <=>  (pi - 1)/ell = (m-1)/ell + (c/ell) omega  lies in  Z[f omega]
        <=>  ell | (m - 1)   AND   ell * f | c.
    The FIRST condition is CLASS-FIXED: it depends only on t, c, D_K, hence is
    the same for every curve in the F_p-isogeny class. The SECOND condition is
    exactly "v_ell(f_E) < v_ell(c)", i.e. E IS NOT AT THE FLOOR OF THE
    ell-VOLCANO. Therefore, in any class with ell | (m-1) and ell | c:
      FULL RATIONAL ell-TORSION IS PRESENT AT EVERY LEVEL EXCEPT THE FLOOR,
      AND ABSENT AT THE FLOOR.
    Note the shape: this is a STEP at the bottom, not a gradient in depth. That
    shape is the proposal's primary discriminator and it is stated before any
    measurement.

    (B) WHY THIS IS ADMISSIBLE WHERE ALMOST NOTHING IN THIS LANE IS. The
    resource is R5 -- ell-torsion for ell != N as a Galois/End module -- and it
    is consumed OUTSIDE G. Nothing here applies an endomorphism to a point of G,
    so H-ENDO-001 does not bite; nothing here is an oracle returning group
    elements, so KN-FIND-b7e091's GGM simulation does not bite; and
    IDEA-20260807-5cabfc's vertical transport closure explicitly does not bite,
    because the measured cost functional is a Groebner/relation-collection cost
    on x-COORDINATES (R1) and does not factor through the abstract triple.
    This is, as far as this lane's own analysis goes, the UNIQUE place where the
    volcano level is coupled to something the attack can read: the level IS a
    statement about ell-power torsion, and R5 at the SAME ell is the only
    resource that reads it directly rather than through a proxy.

    (C) THE COUPLING TO AN ATTACK COST, STATED AS THIS RECORD'S OWN MECHANISM.
    Let T in E(F_p) have order ell and let V be a factor base stable under the
    translation P -> P + T. For a decomposition R = P_1 + ... + P_m with all
    P_i in V, the map (P_1, P_2) -> (P_1 + T, P_2 - T) preserves the sum and
    stays inside V. The solution variety of the decomposition system therefore
    carries a free action of (Z/ell)^(m-1), so the ideal has ell^(m-1) times as
    many solutions as its quotient, and the system can in principle be descended
    to the quotient. Full rational ell-torsion (rank 2) gives TWO independent
    such shifts, i.e. an action of ((Z/ell)^2)^(m-1) available only OFF the
    floor; a single rational point of order ell (rank 1) gives one. So the
    available symmetrization group is a step function of the level. This
    mechanism is derived in this record and is NOT attributed to any paper.

    (D) THE HONEST CEILING, STATED BEFORE THE EXPERIMENT. Quotienting by a group
    of order ell^(m-1) divides the degree of the ideal by ell^(m-1). For fixed
    small ell and m this is a CONSTANT FACTOR, not an exponent, and this record
    does not claim otherwise. The only way it could become an exponent is by
    taking ell large -- and the criterion in (A) forces ell^2 | #E(F_p), so a
    large ell means a large cofactor, hence a smaller prime subgroup N ~ p/ell^2,
    hence a rho cost of only 0.886 sqrt(p)/ell. THE COFACTOR BUDGET IS THE
    DELIVERABLE: rho gains a factor ell from the same cofactor that the
    symmetrization gains ell^(m-1) from, and the two must be compared in one
    charged cost model. Computing where (if anywhere) that crossover lies is a
    quantitative question with a definite answer, and answering it is worth more
    than the toy speedup.

    (E) THE SCOPE LIMIT, WHICH IS ITSELF A RESULT. The criterion needs
    ell | (m-1) and ell | c, which together force ell^2 | #E(F_p). FOR A
    PRIME-ORDER CURVE (cofactor 1) THE MECHANISM IS EMPTY AT EVERY ell AND AT
    EVERY LEVEL: E(F_p) is cyclic of prime order, so E(F_p)[ell] is trivial for
    every ell != N, at the crater and at the floor alike. secp256k1, P-256 and
    every cofactor-1 standardized curve are therefore untouched by this
    mechanism, and the honest headline of a confirming experiment would be
    "COFACTOR DIVISIBILITY BY ell^2 IS EXACTLY THE RESOURCE THAT MAKES
    ell-VOLCANO DEPTH VISIBLE IN THE RATIONAL GROUP STRUCTURE" -- a scoping
    statement about which curves could ever have a depth effect, not an attack.

  resource_label: R5 (ell-torsion for ell != N as a Galois/End module), consumed into an R1 cost functional
  admissibility: admissible
  admissibility_argument: >-
    The resource consumed is E(F_p)[ell] for ell != N, which lies OUTSIDE G:
    G has prime order N and ell != N, so G intersect E[ell] = {O}. No
    endomorphism is applied to any point of G, so H-ENDO-001's scalar collapse
    does not apply. The measured functional is the cost of a Groebner
    computation on a polynomial system in x-COORDINATES (R1), which returns
    field data rather than group elements and is therefore not
    generic-group-simulable in the sense of KN-FIND-b7e091. Finally, and
    critically for this lane, the functional does NOT factor through the abstract
    triple (G, P, Q), so IDEA-20260807-5cabfc's vertical transport closure leaves
    it open by construction. All three admissibility filters are passed for
    stated reasons rather than by assertion.

  discriminated_from:
    - >-
      H-ENDO-001 (endomorphisms act as scalars on G). No endomorphism is applied
      to a point of G here. The object is a TRANSLATION by a torsion point, which
      is not a group homomorphism at all, acting on a FACTOR BASE, which is not
      contained in G.
    - >-
      DECOMPOSITION lane L4 / RQ-EQIC-8cb959 (phi-equivariant relation
      collection) and H-STR-002 (weakened, DEC-20260727-009). Those use ORBITS OF
      AN ENDOMORPHISM phi under R3. This uses ORBITS OF A TRANSLATION by a
      rational torsion point under R5. Different group (Z/ell versus the
      multiplicative order of phi), different resource label, and -- decisively --
      different availability: phi-orbits exist only on CM curves with small |D_0|
      and are a class-fixed property, whereas translation orbits exist or not
      ACCORDING TO THE VOLCANO LEVEL and therefore vary WITHIN a class. This
      record does not re-assert H-STR-002 and does not depend on it in either
      direction.
    - >-
      H-ECTD-19017a. That hypothesis measures whether Semaev meters JUMP across a
      LARGE prime conductor step (q >= 17) with no stated mechanism for why they
      should. This record supplies a specific mechanism at SMALL ell, predicts a
      specific SHAPE (a step at the floor, not a jump at an arbitrary conductor
      step), and predicts the effect is ABSENT unless ell | (m-1) -- a condition
      H-ECTD-19017a does not impose and whose failure would explain a null there.
      The two are complementary and this record neither confirms nor pre-empts
      that experiment.
    - >-
      The bibliography entry faugere_huot_joux_renault_vitse_2014_symmetrized
      ("Symmetrized summation polynomials: Using small order torsion points to
      speed up elliptic curve index calculus", EUROCRYPT 2014; title, authors and
      venue verified from knowledge/SOURCES.md and inputs/bibliography.json).
      THE PAPER WAS NOT READ. Its title asserts that small-order torsion points
      speed up elliptic-curve index calculus, which makes it near-certain that
      the symmetrization half of (C) is KNOWN. What is not known to be in it, and
      is what this record contributes, is the LEVEL CRITERION of (A) and the
      observation that torsion availability is a within-isogeny-class variable
      controlled by the volcano floor. Reading that paper is Stage 0 of the
      minimal test and a positive hit is an ingredient, not a disappointment.

  object_first_candidate:
    tracked_object: >-
      THE ell-TORSION SUBGROUP E(F_p)[ell] AS AN O_f-MODULE -- concretely the
      pair (rank of E(F_p)[ell] over Z/ell, the induced translation action on a
      factor base) -- followed down a descending path of the ell-volcano from
      crater to floor.
    lossiness: >-
      LOSSY, and the lossy-projection test is passed. The projection
      E |-> E(F_p)[ell] discards the curve equation, the j-invariant, the entire
      prime-to-ell part of E(F_p) including G itself, and all higher ell-power
      torsion beyond level 1. It is not a change of coordinates: from
      E(F_p)[ell] one cannot recover E, cannot recover N, and cannot recover k.
      COMPATIBILITY WITH THE OPERATIONS -- the part the test actually tests --
      holds because a descending ell-isogeny maps E[ell] onto E'[ell] with a
      one-dimensional kernel, so the RANK of the rational part propagates
      deterministically under a descending step: rank 2 stays rank 2 until the
      floor, where it drops to rank 1 or 0. The retained quantity therefore has a
      deterministic one-step propagation rule, which is the whole requirement.
    propagation: >-
      One descending ell-step: rank(E'(F_p)[ell]) = rank(E(F_p)[ell]) while
      v_ell(f) + 1 < v_ell(c), and drops at the last step. One ascending step:
      rank can only rise or stay. Horizontal steps preserve End(E) hence preserve
      the criterion in (A) exactly, so rank is a HORIZONTAL INVARIANT -- which is
      the control that separates this object from any j-dependent artifact.
    survival_score: >-
      Survives the whole ell-volcano, which is at most log_ell(2 sqrt(p)) levels
      deep. Dies immediately if ell does not divide (m-1) -- the class condition
      -- in which case the object is constantly trivial and the lane is empty for
      that class. Dies entirely for cofactor-1 curves. Those two death conditions
      are checkable before any compute and are the first thing the experiment
      does.

  mechanism: >-
    STEP 1 -- CLASS SELECTION (pure arithmetic, seconds). At toy scale
    p ~ 2^12 to 2^16, enumerate traces t; for each, compute D = t^2 - 4p,
    factor it (feasible at toy scale), get D_K and c; compute m = (t - c D_K)/2.
    KEEP classes satisfying, for ell in {2, 3, 5}: ell | c (so the volcano has
    height >= 1) AND ell | (m - 1) (so the criterion in (A) can fire). RECORD the
    rejected fraction: it is a measurement of how rare the whole mechanism's
    precondition is, and that number is a deliverable by itself.

    STEP 2 -- BUILD THE VOLCANO AND LABEL LEVELS. Using the instrument of
    IDEA-20260807-b1b604: for each curve, count F_p-rational ell-isogenies via
    the ell-division polynomial's kernel factors, construct neighbours by Velu,
    verify each codomain's trace equals t, and assign levels by Fouquet-Morain
    descent (walk down; the number of steps to a dead end gives h - i).

    STEP 3 -- VERIFY THE CRITERION EMPIRICALLY BEFORE USING IT. For every curve
    in the enumerated volcano, compute E(F_p)[ell] directly (roots of the
    ell-division polynomial that lift to rational points) and compare with the
    prediction from (A). This is a HARD GATE: the criterion is derived in this
    record and a single counterexample halts the line and supersedes the record.

    STEP 4 -- THE TRANSLATION-STABLE FACTOR BASE. On each curve with a rational
    T of order ell, build V as a union of (P, P+T, ..., P+(ell-1)T) orbits, of
    declared size B. Build the matched control bases described under
    null_object_control.

    STEP 5 -- THE MEASUREMENT. Run the frozen m = 3 Semaev decomposition
    measurement (harness/semaev.py, KN-TECH-002/KN-TECH-003) on each factor base
    and record: Groebner wall time, basis size, basis maximum total degree
    (labelled a proxy, never the degree of regularity -- the harness docstring is
    explicit about this), relation yield per target, and number of targets
    attempted. Compare crater, mid-levels, and floor.

    STEP 6 -- THE COFACTOR BUDGET (zero extra compute). For each measured cell,
    compute the FULLY CHARGED comparison: index-calculus total cost with the
    measured symmetrization gain versus 0.886 sqrt(N) with N = #E / cofactor,
    and versus 0.886 sqrt(N/|Aut|). Report the crossover in ell, or report that
    there is none in the tested range. This is the step that converts a toy
    speedup into a cost-model statement.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) over the repository on 2026-08-07 for: "symmetriz" and
      "small-order torsion" and "FHJRV" (case-insensitive, whole repo);
      "torsion-aligned|torsion aligned|symmetrized summation|translation-invariant
      factor base" over ledger/; "group structure" over ledger/; "volcano" over
      ledger/ and knowledge/. Read in full: DECOMPOSITION.md, H-ENDO-001,
      H-ECTD-19017a, IDEA-20260805-38aebb, KN-FIND-b7e091, KN-TECH-018,
      harness/toycurve.py, harness/semaev.py.
    results: >-
      "torsion-aligned|symmetrized summation|translation-invariant factor base"
      over ledger/: ZERO matches. "symmetriz" whole-repo: 25 files, all in
      digests/indexes/bibliography rather than in a ledger proposal or knowledge
      technique; the substantive hit is the bibliography entry
      faugere_huot_joux_renault_vitse_2014_symmetrized, which has NO KN-LIT
      record. "group structure" over ledger/: 20 occurrences across 15 files,
      none about E(F_p) group structure varying with volcano level. NO record in
      this repository states the criterion in (A), and the corpus contains no
      knowledge entry for the symmetrized-summation technique at all.
    verdict: >-
      ADAPTATION. The module isomorphism E(F_p) = O/(pi-1) and the resulting
      group-structure criterion are classical (they underlie the standard
      "read the volcano level off the group structure" technique, associated with
      Miret et al. and with Ionica-Joux's pairing method -- BOTH RECALLED,
      UNVERIFIED, neither present as a KN-LIT record and neither read). The
      symmetrization half is near-certainly known from the EUROCRYPT 2014 paper
      above, unread. What is an adaptation rather than a repackaging is the
      JOIN: torsion availability as a within-class, level-controlled variable
      that gates an R1 cost, with the step-versus-gradient discriminator and the
      cofactor budget. A Stage-0 literature check is mandatory before any run.

  null_object_control: >-
    FOUR NULLS, all mandatory, three of them blocking.
    (N1) SIZE-MATCHED RANDOM FACTOR BASE on the SAME curve: same |V|, x-values
      drawn by the harness's deterministic sampler, NOT translation-stable. This
      isolates SYMMETRY from SIZE and is the same control DECOMPOSITION lane L4
      declares mandatory. Blocking: no symmetry claim without it.
    (N2) THE HEIGHT-ZERO VOLCANO NULL: a class at the same p with v_ell(c) = 0,
      so there is no floor and no non-floor. Any measured "level effect" there is
      pure artifact. Blocking.
    (N3) THE CLASS-CONDITION NULL: a class with ell | c but ell does NOT divide
      (m-1). By (A) no curve in it has full rational ell-torsion at any level, so
      the mechanism predicts a FLAT profile across all levels. If an effect
      appears anyway, the measurement is reading depth by some other route and
      this record's mechanism is not the explanation. Blocking, and this is the
      sharpest of the four.
    (N4) RESAMPLED k on a fixed curve: gives the instance-noise band against
      which every ratio is judged.
    DECAY PARAMETER: the volcano height h = v_ell(c). The claimed effect must be
    IDENTICALLY ZERO at h = 0 (no levels exist), must appear at h = 1, and must
    NOT grow with h beyond the single floor step -- because (A) predicts a step,
    not a gradient. AN EFFECT THAT GROWS WITH h IS THE ARTIFACT TELL HERE, and it
    is the reverse of the usual one, which is exactly why it is stated in
    advance.

  assumptions:
    - >-
      E(F_p) is isomorphic to O_f/(pi - 1) O_f for ordinary E with End(E) = O_f.
      RECALLED, UNVERIFIED as a citation (it is the standard consequence of the
      Deuring correspondence for ordinary curves); DERIVED consequences are
      checked directly in Step 3 against computed group structures, so the record
      does not rest on the citation.
    - >-
      Kohel's stratification: levels are v_ell(f_E), height is v_ell(c). RECALLED,
      UNVERIFIED (KN-LIT-360 present in corpus, not read). Verified empirically in
      Step 2 by isogeny counting.
    - >-
      The symmetrization mechanism in claim (C) is THIS RECORD'S OWN
      reconstruction. It is not attributed to any paper and the size of its gain
      is [open] until measured.
    - >-
      Toy scale only: p up to ~2^16, m = 3, pure Python with sympy. The Groebner
      metrics are implementation-bound proxies, exactly as harness/semaev.py's
      docstring states, and are interpreted only as trends against parameters.
    - >-
      Timeouts and memory exhaustion on the Groebner step are infrastructure
      outcomes under AGENTS.md rule 5 and are never reported as a level effect.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal would change the cost is the Groebner solve of
      the m = 3 decomposition system. The claim is that the translation action
      reduces the number of solutions of that system by ell^(m-1) and hence its
      solving cost. Everything upstream (class selection, volcano construction,
      torsion computation) is polynomial and cheap.
    baseline_embedding:
      parameter_slice: >-
        ell = 1 (no torsion, no symmetrization) must reproduce EXACTLY the frozen
        Semaev measurement already used elsewhere in this program, on the same
        instance, seed and factor base. Equivalently: the FLOOR curve with a
        non-stable factor base is the baseline, and the crater curve with a
        stable factor base is the treatment.
      reproduction_check: >-
        Frozen fixture: one instance from an existing Semaev run record, re-run
        through the new driver with the symmetrization switched off. Exact
        agreement in basis size and maximum degree, wall time within a factor 2.
        Any mismatch is an instrument-comparability failure and halts the line.
    observation_collision:
      observable: >-
        The Groebner cost vector (wall time, basis size, basis max total degree,
        relation yield).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED between the CRATER and any OTHER
        NON-FLOOR LEVEL: by (A) they have identical rational ell-torsion, so the
        mechanism predicts an identical observable. That collision is a
        PREDICTION of this record, not a falsifier, and finding the two levels
        distinguishable would refute the "torsion is what matters" explanation in
        favour of "depth itself matters" -- which is the three-way discriminator.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Descend the decomposition system to the quotient by the (Z/ell)^(m-1)
          translation action, so that the hypothesis "the factor base is
          translation-stable" becomes an exact statement about the dimension of
          the invariant ring rather than a heuristic about symmetry.
        predicted_gain: >-
          Ideal degree divided by ell^(m-1); measured Groebner wall-time ratio
          predicted in [1, ell^(m-1)] and predicted NOT to exceed ell^(m-1).
          A measured ratio ABOVE ell^(m-1) is an artifact, not a bonus.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full O_f-module type of E(F_p)[ell^infinity], not merely the
          rank of E(F_p)[ell]. This preserves more state than the goal requires
          and is what would survive a change of ell or a move to ell^2-torsion.
        predicted_gain: >-
          Resolution: distinguishes levels that rank alone cannot, and is the
          object that would carry a gradient if one exists.
    quantifier_order: >-
      CLAIMED: FORALL ordinary classes with ell | c and ell | (m-1), FORALL
      curves E in the class, E(F_p)[ell] = (Z/ell)^2 IF AND ONLY IF
      v_ell(f_E) < v_ell(c). This is an unconditional biconditional, uniform over
      the class.
      SEPARATELY AND MUCH WEAKER, the cost claim: FORALL such classes, THERE
      EXISTS a factor-base construction and a measurement scale at which the
      non-floor curves show a lower Groebner cost than the floor curve. The
      existential over constructions is deliberate and is the honest form; a
      reading in which every construction shows the gain is NOT claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In classes with ell^2 | #E arising from ell | c and ell | (m-1),
        translation-symmetrization of the m = 3 decomposition system is available
        off the ell-floor and unavailable on it, and the measured Groebner cost
        ratio at toy scale is R." It can never certify an exponent change, and it
        certifies nothing at all for cofactor-1 curves, where the mechanism is
        empty.
      nearby_object_control: >-
        A CLASS WITH ell | c BUT ell NOT DIVIDING (m-1) -- null N3. The volcano
        has the same shape, the same number of levels, and the same isogeny
        structure, but no rational ell-torsion anywhere. If the method reports a
        level effect there it has not identified the load-bearing structure and
        every positive it produces is void.
    proof_obligations:
      - claim: E(F_p) = O_f/(pi-1) O_f for ordinary E.
        responsibility: baseline
      - claim: (pi-1)/ell in Z[f omega] iff ell | (m-1) and ell f | c.
        responsibility: correctness
      - claim: ell | (m-1) is class-fixed.
        responsibility: correctness
      - claim: The criterion is equivalent to "E is not at the ell-floor".
        responsibility: strictness
      - claim: The translation action on the decomposition variety is free of order ell^(m-1).
        responsibility: correctness
      - claim: The measured gain does not exceed ell^(m-1).
        responsibility: size
      - claim: Fully charged cost versus rho at N = #E/cofactor.
        responsibility: baseline
      - claim: Mechanism is empty for cofactor-1 curves.
        responsibility: scope

  predictions:
    - metric: >-
        rank of E(F_p)[ell] over Z/ell, per curve, against the level assigned by
        the isogeny-counting instrument
      direction: different
      minimum_effect: >-
        Rank 2 at 100 percent of non-floor vertices and rank <= 1 at 100 percent
        of floor vertices, in every class satisfying ell | c and ell | (m-1).
        This is a biconditional derived in (A); a single counterexample refutes
        it and halts the line. Zero tolerance.
    - metric: >-
        Groebner wall time and basis max total degree for a translation-stable
        factor base versus a size-matched random factor base, ON THE SAME CURVE
      direction: lower
      minimum_effect: >-
        A ratio of at least 1.5 in wall time, reproducible over >= 10 seeds, with
        the size-matched control passing. Below 1.5 the symmetrization is not
        measurable at this scale and the record reports that as a null.
    - metric: >-
        the SHAPE of the cost profile across levels -- crater, mid-levels, floor
      direction: different
      minimum_effect: >-
        THE THREE-WAY DISCRIMINATOR, pre-registered.
        (E1) STEP: crater and all mid-levels statistically indistinguishable,
          floor separated by >= 1.5x. Reading: the TORSION is what matters and
          depth is merely its address. This is the predicted outcome.
        (E2) GRADIENT: cost monotone in level with each additional level
          contributing a detectable increment. Reading: depth ITSELF matters
          through some channel this record has not named; the mechanism in (A) is
          not the explanation and a new one is required.
        (E3) FLAT: no separation anywhere beyond the noise band. Reading: at toy
          scale the symmetrization gain is below the measurement floor; report as
          a controlled null and record the achieved power.
        A result that is neither a clean step nor a clean gradient is declared
        INCONCLUSIVE in advance so neither branch can be reached by rounding.
    - metric: >-
        fraction of toy isogeny classes satisfying ell | c AND ell | (m-1), for
        ell in {2, 3, 5}
      direction: different
      minimum_effect: >-
        A measured density with confidence intervals. No directional prediction;
        the number is the deliverable, and it bounds how often the mechanism's
        precondition holds at all.
    - metric: >-
        fully charged index-calculus cost with measured symmetrization versus
        0.886 sqrt(N/|Aut|) rho, as a function of the cofactor ell^2
      direction: higher
      minimum_effect: >-
        Predicted: rho wins at every tested ell, because the cofactor that buys
        ell^(m-1) symmetrization simultaneously buys rho a factor ell by
        shrinking N. Report the crossover ell if one exists in range; report "no
        crossover in [2, ell_max]" if not. A crossover would be a genuine
        cost-model finding and would require independent review before any
        interpretation.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): read
      faugere_huot_joux_renault_vitse_2014_symmetrized and write a KN-LIT record.
      If it already contains the level criterion of (A), this record is
      downgraded to `duplicate` and the remaining value is the cofactor budget.
      STAGE 1 (minutes): class selection arithmetic of Step 1 plus the density
      measurement. Pure integer arithmetic, no curves.
      STAGE 2 (hours): volcano construction and level labelling at ell in {2, 3},
      p ~ 2^12 to 2^14, with the instrument's own controls passing.
      STAGE 3 (minutes, HARD GATE): verify the criterion in (A) on every vertex.
      A counterexample halts everything.
      STAGE 4 (hours to days): the Semaev measurement across levels with all four
      nulls on the identical pipeline.
      STAGE 5 (zero compute): the cofactor budget and the E1/E2/E3 verdict.
    controls:
      - size-matched non-stable factor base on the same curve (N1)
      - height-zero volcano class (N2)
      - class with ell | c but ell not dividing (m-1) (N3)
      - resampled k on a fixed curve, for the noise band (N4)
      - matched Pollard rho with negation and matched BSGS per instance
      - the frozen Semaev fixture with symmetrization off, for baseline
        comparability
    required_metrics:
      - rank of E(F_p)[ell] and assigned level, per vertex
      - Groebner wall time, basis size, basis max total degree, relation yield
      - factor base size and construction mode, per measurement
      - rho and BSGS operation counts per instance
      - class-selection density with confidence intervals
      - fully charged cost comparison per cell
      - pass/fail of every control

  falsification_conditions:
    - >-
      Any curve violating the biconditional in (A) with the instrument's controls
      passing. The derivation is wrong; the record is superseded, not amended.
    - >-
      Outcome E3 (flat) with adequate power: the symmetrization gain is below the
      toy measurement floor. The mechanism is not refuted but is unmeasurable at
      this scale, and the honest report says exactly that, including the achieved
      power.
    - >-
      An effect in null N3 (no rational ell-torsion anywhere) of the same size as
      in the treatment classes. The measurement is reading something other than
      torsion and no claim in this record may be made.
    - >-
      A measured Groebner ratio ABOVE ell^(m-1). That exceeds the mechanism's own
      ceiling and indicates a factor-base size or sampling artifact, not a bonus.
    - >-
      Groebner runs exceeding the memory or wall-clock budget before any level is
      resolved. Infrastructure outcome under AGENTS.md rule 5; recorded as such
      and never as evidence about depth.

  confounders:
    - >-
      FACTOR-BASE SIZE. A translation-stable base built from orbits has size a
      multiple of ell and may differ from the control base by rounding. Sizes must
      be matched exactly, not approximately, and the achieved sizes reported.
    - >-
      SELECTION ON THE CLASS. Classes are chosen by conditions on t, c, D_K --
      curve-only data -- so the selection cannot bias k. But it CAN bias #E and
      hence N, and every cost comparison must therefore be made within a class,
      never across classes with different N.
    - >-
      sympy's Groebner routine is not an optimized F4 and its wall time is
      sensitive to variable ordering and to coefficient shape. Two independent
      orderings must agree on the direction of any reported ratio.
    - >-
      COFACTOR CONFOUND. Classes with ell^2 | #E have a smaller N at the same p
      than cofactor-1 classes. Comparing them to cofactor-1 curves would confound
      the mechanism with N; all comparisons are within-class and within-N.
    - >-
      The floor curve differs from a crater curve in EVERY endomorphism-ring
      quantity at once (conductor, class number, short-endomorphism density --
      see IDEA-20260805-38aebb). Attributing an observed difference specifically
      to torsion requires null N3, which holds every other quantity roughly fixed
      while removing the torsion.

  interpretation_limits:
    - >-
      Toy scale only. Nothing here is crypto-scale validation and the Groebner
      metrics are implementation-bound proxies by the harness's own statement.
    - >-
      The mechanism is EMPTY for cofactor-1 curves. No standardized prime-order
      curve is affected and none is claimed to be.
    - >-
      A confirmed E1 is a CONSTANT-FACTOR result on one step of one attack
      family, in a curve family excluded from deployment by cofactor hygiene. It
      is a demonstration that depth is not vacuous for R1 functionals, not an
      attack.
    - >-
      Even a confirmed gain leaves the fully charged comparison dominated by rho
      unless the cofactor budget shows a crossover, and the record predicts there
      is none.

  reachability_gate: >-
    T5 PASSES, AND THIS IS THE RARE LANE WHERE IT DOES. The good object here is
    "any non-floor vertex of the ell-volcano", which is not a SPECIFIED curve but
    a LOCALLY DETECTABLE PROPERTY -- exactly case (ii) of the DECOMPOSITION's T5
    dichotomy. Two independent cheap routes:
    (R-a) ASCEND. From any vertex, the ascending ell-isogeny is identifiable by
      Fouquet-Morain walking (try each of the <= ell+1 neighbours, walk down h
      steps, the one that does not dead-end is the ascent). Cost O(ell * h) Velu
      steps per level, and h = v_ell(c) <= log_ell(2 sqrt(p)), so reaching the
      crater from anywhere costs O(ell * log^2 p) isogeny computations.
    (R-b) TEST LOCALLY. Off-floor is detected in ONE step by counting rational
      ell-isogenies: ell+1 off the floor, 1 at the floor (for h >= 1). No global
      address is needed.
    Moreover the volcano height itself is computable WITHOUT FACTORING:
    v_ell(c) = floor(v_ell(t^2 - 4p) / 2) for odd ell (see
    IDEA-20260807-3c6bd8). So the entire reachability question for this lane is
    polynomial, and a negative result here cannot be blamed on unreachability.
    The one cost that is NOT free is the transport itself, which is O(h) Velu
    steps and therefore also polynomial.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE IS CLAIMED, and the record is explicit that the
      mechanism's ceiling is a constant. Best case: the decomposition step's
      ideal degree is divided by ell^(m-1), a factor of 4 at ell = 2, m = 3 and
      9 at ell = 3, m = 3. The ECDLP exponent stays 1/2 (rho, KN-TECH-005/006)
      and no index-calculus exponent for prime fields is affected.
    memory_exponent: >-
      Unchanged by the mechanism. Groebner memory is the binding toy-scale
      constraint and is measured per cell; a smaller quotient system should
      REDUCE peak memory by roughly the same factor as the ideal degree, and
      that is a secondary prediction worth recording.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N), O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted variant (KN-TECH-018);
      BSGS at 2 sqrt(N) time, sqrt(N) memory (KN-TECH-031); toy-scale Semaev
      index calculus, recorded tight at toy scale in KN-FIND-f8c290.
    hidden_overhead: >-
      Disclosed rather than hidden: (i) the mechanism requires ell^2 | #E, i.e. a
      cofactor, which is itself a rho discount of factor ell -- that is the
      cofactor budget and it is charged, not ignored; (ii) building the volcano
      and labelling levels costs O(ell log^2 p) Velu steps per curve; (iii) the
      quotient-system construction has its own polynomial overhead that is
      measured, not assumed negligible.
    tradeoff_note: >-
      The mechanism sits on the memory-heavy end (Groebner) of the frontier and
      is therefore dominated by rho on the memory axis regardless of any time
      gain. Parallelization: relation collection is embarrassingly parallel, but
      so is rho with distinguished points, which parallelizes with linear speedup
      and O(1) memory per processor; the mechanism does not improve that
      position.

  dominated_by: >-
    Checked row by row across time, memory and data/queries. TIME: dominated by
    parallel Pollard rho at 0.886 sqrt(N) (KN-TECH-001, KN-TECH-006) -- and
    dominated MORE severely in exactly the curve family where the mechanism
    applies, since a cofactor of ell^2 shrinks N and hence rho's cost by a factor
    ell while the mechanism only speeds one step of a slower algorithm. MEMORY:
    dominated by rho's O(1) against the Groebner step's superlinear peak.
    DATA/QUERIES: no query advantage; the factor base is computed, not queried.
    Against BSGS (KN-TECH-031) it is dominated on time and comparable on memory,
    which is not a win. Against toy Semaev index calculus (KN-FIND-f8c290) the
    proposal is a constant-factor improvement on one step of that same algorithm,
    which is the only row it improves at all -- and that row is itself dominated
    by rho at toy scale per KN-FIND-f8c290.
  sota_delta: >-
    Predicted zero against every attack baseline. Quantitatively: best case a
    factor ell^(m-1) (4 at ell = 2, m = 3; 9 at ell = 3, m = 3) on the Groebner
    solve of the decomposition step, against a rho baseline that is already
    faster by a factor of roughly sqrt(N)/(index-calculus total) at toy scale,
    and against which the same cofactor grants rho an independent factor ell.
    Net expected delta: 0, with the deliverable being the exact criterion in (A),
    the measured density of classes where it can fire, and the charged crossover
    computation.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the biconditional in (A) verifies exactly as derived -- it follows
    from a standard module isomorphism by a two-line lattice-membership argument,
    and the residual risk is a normalization slip in the omega basis at ell = 2,
    where 2-adic subtleties in D_K are real. 0.55 that outcome E1 (a clean step
    at the floor) is measurable at toy scale with sympy's Groebner routine;
    0.10 for E2 (gradient, which would be the surprising and most valuable
    result); 0.35 for E3 (flat, below the measurement floor). Near 0.05 that the
    cofactor budget shows any crossover beating rho. The reason to run it despite
    the low attack prior is that it is the ONLY admissible within-class depth
    mechanism this lane has found that survives the transport closure, and E2
    would be a genuine anomaly.

