idea:
  id: IDEA-20260807-6eab6a
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    THE ELL-PRIMARY COPRIMALITY OBSTRUCTION FOR L7: every homomorphic
    ell-power-torsion invariant of an ECDLP instance vanishes identically on a
    prime-order subgroup G with ell != N, so ell-descent images, Kummer classes,
    reductions modulo ell*E(F_p), and Weil/Tate pairings of G against E[ell] are
    k-independent BY THEOREM rather than by measurement -- and the unique prime
    at which the obstruction is void is ell = N, which is exactly where the one
    known torsion-based total break of the prime-field ECDLP lives
  class: mechanism

  claim: >-
    (A) THE THEOREM. Let A = E(F_p), let N be a prime with N || #A, let
    G = A[N] = <P> be the prime-order subgroup, and let Q = [k]P. Let ell be any
    prime with ell != N. Let M be any abelian group of exponent dividing ell^m
    for some m >= 1, and let f: A -> M be any group homomorphism. Then
    f(G) = {0}. PROOF: for R in G, the order of f(R) divides both N (the order of
    R) and ell^m (the exponent of M), and gcd(N, ell^m) = 1, so f(R) = 0. In
    particular f(P) = f(Q) = 0 on every instance, for every k. The map
    k |-> (f(P), f(Q)) is therefore CONSTANT, so it carries exactly zero bits
    about k. This is elementary and unconditional; it needs no heuristic, no
    experiment, and no scale qualification.

    (B) FOUR NAMED CORROLLARIES, EACH KILLING A CANDIDATE THIS LANE WAS OPENED TO
    EXAMINE.
      C1 -- REDUCTION MOD ell*E(F_p). Since gcd(ell, N) = 1, multiplication by
        ell is an automorphism of G, so G = [ell]G is contained in ell*A, hence
        also in ell^m * A for every m. Therefore P and Q both have image 0 in
        A/ell*A. The "position of P modulo ell*E(F_p)" named in the L7 brief is
        the zero class on every instance.
      C2 -- ell-DESCENT / KUMMER IMAGE. The ell-descent map on A factors through
        A/ell*A, which C1 shows annihilates G. For an ell-isogeny phi: E -> E'
        the descent quotient E'(F_p)/phi(E(F_p)) has exponent dividing ell and is
        therefore also annihilated on the image of G. The ell-descent image of P
        and of Q is trivial.
      C3 -- WEIL AND TATE PAIRINGS BETWEEN G AND E[ell]. Take P in E[N],
        T in E[ell], and the Weil pairing e_{ellN} on E[ellN]. Bilinearity gives
        e_{ellN}(P,T)^N = e_{ellN}([N]P, T) = 1 and
        e_{ellN}(P,T)^{ell} = e_{ellN}(P, [ell]T) = 1, so e_{ellN}(P,T) has order
        dividing gcd(N, ell) = 1 and equals 1 identically. The reduced Tate
        pairing t_N(P, T) is 1 for the same reason: T lies in N*E(F_p) because
        [N] is invertible on the ell-part, so T is trivial in E(F_p)/N*E(F_p).
        Pairing the target point against ell-torsion is identically trivial.
      C4 -- THE ell-DIVISION FIELD OF THE POINT IS CURVE-ONLY. By C1 there is
        R_0 in E(F_p) with [ell^m]R_0 = P. Every ell^m-division point of P has
        the form R_0 + T with T in E[ell^m], so F_p(R_0 + T) = F_p(T). The
        multiset of fields of definition of the ell^m-division points of P equals
        the multiset {F_p(T) : T in E[ell^m]}, which depends on E only. The
        Kummer extension attached to P is trivial, so the field-of-definition
        statistic of the point's division points is k-independent.

    (C) WHERE THE OBSTRUCTION IS VOID, WHICH IS THE FORWARD GUIDANCE AND NOT A
    DECORATION. The proof uses only gcd(N, ell^m) = 1. It says nothing at ell = N.
    And the one place in the recorded literature where torsion at the group-order
    prime demolishes the prime-field ECDLP is exactly ell = N = p: the anomalous
    (trace-one) curves, where #E(F_p) = p, the p-torsion structure supplies a
    globally defined formal-group logarithm, and the ECDLP collapses to a division
    in O(log p) field operations (KN-TECH-033, relaying KN-LIT-087/088/089).
    KN-TECH-033 states the general lesson this record adopts verbatim:
    representations win exactly when the curve supplies a global structural
    coincidence, and a proposal must NAME its coincidence. This record names the
    coincidence that the whole ell != N lane is missing: coprimality is the
    obstruction, and only ell = N voids it.

    (D) HARD-CONSTRAINT ENGAGEMENT (mandatory in this lane). Is the data
    point-dependent? The invariants in B1-B4 ARE evaluated at the points P and Q,
    so they are point-dependent as expressions and publicly computable without any
    discrete logarithm. The theorem's content is that they are CONSTANT in k
    anyway -- the point-dependence is formal, not informational. This is why the
    lane's hard constraint has to be stated as "point-dependent AND non-constant
    on G", and this record supplies the exact criterion separating the two:
    a homomorphic invariant valued in an ell-primary group is constant on G;
    only a NON-HOMOMORPHIC invariant can be non-constant, and IDEA-20260807-df906f
    takes up exactly that complement.

    (E) WHAT THIS IS NOT. It is not a lower bound on the ECDLP. It is not a
    statement about ell = N, about extension fields, about supersingular curves
    over F_{p^2} (where End has rank 4 and the analysis differs), or about
    composite-order base points. It closes ONE sub-family -- ell-primary
    homomorphic invariants, ell != N -- and it closes it completely, which is more
    than a measurement of that sub-family could ever do.

  resource_label: 'audit: consumes no resource (the audited resource is R5)'
  admissibility: admissible
  admissibility_argument: >-
    This proposal mounts no attack and consumes no resource; it is an audit in the
    sense of L12 (RQ-GGMB-6eaabc), applied inside L7. It is admissible as a
    deliverable because it does not apply any endomorphism to points of G and
    claims no speedup. Its CONCLUSION is stronger than the admissibility filter
    itself: the filter says a G-only endomorphism oracle is generic-group
    simulable and therefore closed at exponent 1/2 (KN-FIND-b7e091, H-ENDO-001);
    this record says an ell-primary homomorphic invariant on G is not merely
    simulable but CONSTANT, i.e. it has zero entropy about k rather than
    sqrt(N)-bounded usefulness. Constant is strictly worse than simulable, and
    the distinction matters because a simulable oracle can still be part of a
    correct algorithm while a constant one cannot be part of any.

  discriminated_from:
    - >-
      KN-FIND-b7e091 / EV-GGM-79e710 / DEC-20260804-3b4258. Those close incidence
      and endomorphism-image oracles by GGM SIMULABILITY -- an oracle whose answer
      the algorithm could have computed itself. This record closes a different
      family by CONSTANCY -- an oracle whose answer is the same on every instance.
      Neither implies the other: a simulable oracle can be highly k-dependent
      (endomorphism images are), and a constant oracle need not be simulable in
      the GGM sense at all (the pairing computation uses field arithmetic).
    - >-
      H-ENDO-001. That hypothesis concerns endomorphisms acting on G as scalars
      lambda_i in Z/N and the geometry of the augmented witness lattice; its
      objects are non-trivial scalars. This record concerns maps OUT of G into
      ell-primary targets, whose only possible value is zero. The two arguments
      share the phrase "prime order" and nothing else.
    - >-
      KN-TECH-030 (Pohlig-Hellman). Pohlig-Hellman exploits an ell-part of the
      order of the BASE POINT. Here P has prime order N by construction, so there
      is no ell-part to project onto and Pohlig-Hellman contributes nothing. The
      full three-regime taxonomy separating these cases is
      IDEA-20260807-146aa8; this record supplies its regime-(iii) theorem.
    - >-
      KN-TECH-032 (MOV / Frey-Ruck). Pairing transfers pair G against ITSELF or
      against another N-torsion subgroup over F_{p^{k_emb}} -- the ell = N case,
      which corollary C3 explicitly does not touch. C3 is about pairing G against
      ell-torsion for ell != N and shows it is trivial. Nothing here weakens or
      strengthens MOV.

  object_first_candidate:
    tracked_object: >-
      The image f(R) of a curve point R under a homomorphism f from E(F_p) into
      an ell-primary abelian group -- concretely the class of R in
      E(F_p)/ell*E(F_p), its ell-descent class, or the value of a Weil/Tate
      pairing of R against a fixed ell-torsion point.
    lossiness: >-
      Maximally lossy on G: the projection collapses the entire subgroup to a
      single point. That is the failure mode the lossy-projection test warns
      about from the other side. docs/inventor-protocol.md section 2 says a
      projection that loses NOTHING is a change of coordinates; this is the
      complementary defect -- a projection that loses EVERYTHING is not an object
      either, and the test as written does not say so. Recording that gap is part
      of this proposal's contribution.
    propagation: >-
      Propagates perfectly (it is a homomorphism, so v(R+S) = v(R)+v(S)), which
      is exactly what makes it useless: perfect propagation plus prime order
      forces constancy. See IDEA-20260807-df906f for the general form of that
      implication.
    survival_score: >-
      Survives every operation and every parameter change, at the value zero. It
      dies as an OBJECT the moment ell = N, where it becomes the N-primary
      structure and, in the single coincidence ell = N = p, becomes the anomalous
      break (KN-TECH-033).

  mechanism: >-
    STEP 1 (zero compute) -- write out the four corollaries as a derivation note
    with each step justified by an elementary group-theoretic fact, in the form
    given in the claim. No literature dependency beyond the definitions of the
    Weil and Tate pairings.

    STEP 2 (minutes of compute, KNOWN-ANSWER INSTRUMENT TEST, not evidence for
    the theorem) -- on toy instances at 16-24 field bits generated by
    harness/toycurve.py, and for ell in {3,5,7,11,13}: (a) verify computationally
    that P and Q lie in ell*E(F_p) by exhibiting an explicit ell-division point,
    which is cheap because [ell^{-1} mod N]P is an ell-division point of P inside
    G itself; (b) verify that the reduced Tate pairing t_N(P, T) equals 1 for
    every T in E(F_p)[ell]; (c) verify that the Weil pairing e_{ellN}(P,T) equals
    1. Purpose: these are KNOWN-ANSWER CHECKS on the instrument that
    IDEA-20260807-bd5d91 builds. A disagreement is an implementation bug, NEVER
    evidence against the theorem (AGENTS.md rule 5 applies to the instrument, and
    the theorem is not an empirical claim).

    STEP 3 (zero compute) -- record the boundary explicitly: the exact hypothesis
    used is gcd(N, ell) = 1. State the three ways it can fail in practice and
    what each implies: (i) ell = N (out of lane; MOV/Frey-Ruck territory,
    KN-TECH-032); (ii) the base point does not have prime order (Pohlig-Hellman,
    KN-TECH-030; a change of instance, not of algorithm); (iii) ell = N = p
    (anomalous, KN-TECH-033; total break). Nothing else voids it.

    STEP 4 (zero compute) -- forward guidance for the lane, which is the part a
    later agent will actually use. What remains open after this closure:
    (i) NON-HOMOMORPHIC point functionals derived from ell-torsion, taken up by
    IDEA-20260807-df906f; (ii) objects living on E[ell] itself rather than on G,
    where the group is (Z/ell)^2 and therefore has ell+1 proper subgroups and
    genuine lossy quotients -- these are the Elkies isogenies, taken up by
    IDEA-20260807-053a55 and IDEA-20260807-1d9c5f; (iii) everything at ell = N.

  novelty_status: known
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "Pohlig" knowledge/ ledger/ docs/ analysis/`;
      `grep -ri "Tate pairing\|Weil pairing" knowledge/techniques/ ledger/`;
      `grep -ril "descent\|Selmer\|Mordell-Weil" ledger/`;
      `grep -ri "coprim\|Sylow" knowledge/techniques/`; plus full reads of
      KN-FIND-b7e091, H-ENDO-001, KN-TECH-009, KN-TECH-030, KN-TECH-032 (header),
      KN-TECH-033, KN-TECH-034, KN-OPEN-005, KN-OPEN-019.
    results: >-
      The mathematics is textbook (Lagrange plus bilinearity) and this record
      claims no mathematical novelty. Corpus state: KN-TECH-030 states
      Pohlig-Hellman and its hygiene obligations but does NOT state the
      vanishing theorem or any of C1-C4. KN-TECH-032 covers pairing transfers at
      ell = N only. KN-TECH-033 supplies the "name your coincidence" framing this
      record adopts. KN-FIND-b7e091 closes two oracle families by simulability,
      not by constancy. No record in ledger/ or knowledge/ states that ell-descent
      images or G-versus-E[ell] pairings are identically trivial, and
      RQ-TORS-8c7b79's decision_target names these as candidates still to be
      evaluated -- which is the gap this record fills.
    verdict: >-
      KNOWN as mathematics; NEW TO THIS CORPUS as a stated, cited closure of a
      named candidate family. Filed because the lane brief explicitly names three
      of the four corollaries as candidates worth considering carefully, and the
      cheapest honest answer to a named candidate is a proof rather than an
      experiment.

  null_object_control: >-
    MANDATORY AND SUPPLIED, for the STEP 2 instrument only (the theorem itself is
    not an empirical claim and takes no control). MATCHED NULL OBJECT: the same
    pairing and division computations run at ell = N -- that is, t_N(P, T) for
    T in G itself, and the reduced Tate self-pairing -- where the value is NOT
    forced to 1 and generically is not. DECAY PARAMETER: ell/N coprimality,
    realised by sweeping ell over the divisors of #E(F_p): for every ell dividing
    the cofactor with ell != N the computed pairing must be 1, and at ell = N it
    must be non-trivial for at least one T. AN INSTRUMENT THAT RETURNS 1
    EVERYWHERE, INCLUDING AT ell = N, IS MEASURING ITS OWN ZERO AND ITS ell != N
    OUTPUTS ARE VOID. This is the canonical artifact tell in this setting: a
    quantity that fails to change when the parameter that must change it does.

  assumptions:
    - >-
      E is an ordinary elliptic curve over a prime field F_p, p > 3, with
      #E(F_p) = h*N, N prime, N exactly dividing #E(F_p), and P of order exactly
      N. This is the program's target family and is enforced by
      harness/toycurve.py's instance generator, which takes N to be the largest
      prime factor of #E and kills the cofactor.
    - >-
      ell is a prime different from N. The theorem places no other restriction on
      ell: it holds for ell = p, for ell dividing the cofactor h, and for ell
      coprime to #E(F_p) alike.
    - >-
      "Publicly computable" means computable from (p, a, b, P, Q, N) without
      solving a discrete logarithm. All four corollaries concern quantities that
      are publicly computable in this sense; the theorem is about their VALUE,
      not their computability.

  proof_search_map:
    bottleneck: >-
      There is no computational bottleneck: the closure is a two-line argument.
      The bottleneck being removed is a RESEARCH bottleneck -- the lane would
      otherwise spend compute measuring correlations between k and quantities
      that are provably constant, and would then have to interpret the resulting
      null as an empirical negative rather than as an algebraic identity.
    baseline_embedding:
      parameter_slice: >-
        The exact boundary of the theorem is ell = N. At that slice the argument
        fails and the corresponding statements are the classical ones: the
        reduced Tate pairing t_N(P,Q) is generically non-trivial and is the basis
        of MOV/Frey-Ruck (KN-TECH-032). Reproducing that non-triviality at ell = N
        is the baseline embedding.
      reproduction_check: >-
        Frozen fixture: one toy curve at 20 field bits with small embedding
        degree, on which t_N(P, Q) is computed over F_{p^{k_emb}} and shown to be
        a non-trivial N-th root of unity, alongside t_N(P, T) = 1 for T of order
        ell | h. Exact comparison of the two values. If the ell = N case also
        returns 1, the pairing implementation is wrong and every other number in
        the line is void.
    observation_collision:
      observable: >-
        The value f(P), f(Q) of the ell-primary invariant.
      distinct_preimage_search: >-
        REQUIRED AND GUARANTEED TO SUCCEED, which is the entire point: every pair
        of instances (E, P, [k]P) and (E, P, [k']P) with k != k' has the identical
        observable, namely 0. The collision is total, not partial, and that total
        collision IS the closure. Recording it in this field rather than as a
        surprise is the discipline docs/inventor-protocol.md section 8 audit 2
        asks for.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (it is always 0) and vary the forgotten
          structure (k). The fibre is all of Z/N. The intrinsic invariant that
          would be needed to separate points of the fibre must therefore be
          non-homomorphic, which is the transform's output and the handoff to
          IDEA-20260807-df906f.
        predicted_gain: >-
          No attack gain. The gain is a precise redirection: it converts "measure
          whether ell-torsion data correlates with k" into "only non-homomorphic
          ell-torsion functionals can correlate with k", which is a smaller and
          sharper search space.
    quantifier_order: >-
      Claimed: FORALL primes ell != N, FORALL abelian groups M of exponent
      dividing a power of ell, FORALL homomorphisms f: E(F_p) -> M, FORALL
      instances (E, P, Q) in the declared family, FORALL k: f(P) = f(Q) = 0.
      The witness (the vanishing) does not depend on the instance, the seed, the
      characteristic, or k -- it is uniform in everything, which is what makes it
      a closure rather than an observation. The dangerous weaker reading NOT
      claimed: "for every instance there EXISTS an ell for which f vanishes",
      which would be an accident rather than a theorem.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No group homomorphism from E(F_p) into an ell-primary abelian group,
        ell != N, distinguishes any two ECDLP instances on the same (E, P)." It
        can never certify anything about non-homomorphic functionals, about
        ell = N, about composite-order base points, or about maps defined on
        E(F_pbar) that are not homomorphisms of E(F_p).
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is the same instance with a
        base point of composite order h*N -- there the projection to the ell-part
        is non-trivial and recovers k modulo ell, which is Pohlig-Hellman. A
        method that could not distinguish the prime-order from the composite-order
        case would not have identified the load-bearing structure. The distinction
        is exactly gcd(ord(P), ell), and the derivation note must exhibit it.
    proof_obligations:
      - claim: gcd(N, ell^m) = 1 forces f(R) = 0 for R of order N.
        responsibility: correctness
      - claim: G is contained in ell^m * E(F_p) for every m.
        responsibility: correctness
      - claim: The Weil and Tate pairing computations in C3 use the stated bilinearity correctly.
        responsibility: correctness
      - claim: The division-point field argument in C4 uses that P is ell-divisible in E(F_p).
        responsibility: correctness
      - claim: The instrument reproduces non-triviality at ell = N on the frozen fixture.
        responsibility: baseline
      - claim: Every reported statement names its scope (prime-order P, ell != N, prime field).
        responsibility: scope

  predictions:
    - metric: >-
        Reduced Tate pairing t_N(P, T) for T ranging over E(F_p)[ell],
        ell in {3,5,7,11,13} with ell | #E(F_p) and ell != N, at 16-24 field bits
      direction: different
      minimum_effect: >-
        Exactly 1 (the identity of the target group) on 100 percent of cells. A
        single non-trivial value is an implementation error and halts the line;
        it is NOT evidence against the theorem. BASIS - derivation in this
        record; NOT measured anywhere in this campaign.
    - metric: >-
        Image of P and of Q in E(F_p)/ell*E(F_p), computed by exhibiting an
        explicit ell-division point in E(F_p)
      direction: different
      minimum_effect: >-
        Exactly the zero class on 100 percent of cells, with the explicit witness
        [ell^{-1} mod N]P recorded per cell as a certificate re-verifiable by
        multiplying by ell (docs/claims-and-verification.md). BASIS - derivation;
        UNTESTED.
    - metric: >-
        Reduced Tate pairing at the boundary ell = N (the baseline embedding)
      direction: different
      minimum_effect: >-
        Non-trivial for at least one T in G on at least one fixture with small
        embedding degree. If this is 1 everywhere, the instrument cannot see a
        non-trivial pairing and every ell != N result it produced is void.
        BASIS - classical (KN-TECH-032), used here as a KNOWN-ANSWER
        CALIBRATION; this campaign has never measured it.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the actual deliverable): write the derivation note
      with C1-C4 and the boundary analysis. This is complete without any run.
      STAGE 1 (minutes): implement the three known-answer checks of STEP 2 on
      5 seeds x {16, 20, 24} field bits, restricted to curves whose cofactor has
      a small prime factor ell in {3,5,7,11,13} so that E(F_p)[ell] is non-empty.
      STAGE 2 (minutes, HARD GATE): the ell = N baseline embedding on a
      small-embedding-degree fixture. Must return a non-trivial pairing.
      STAGE 3 (zero compute): record the forward-guidance list.
      Total budget: well under one CPU-hour. Division polynomials are NOT needed
      for this proposal; ell-torsion points are found by multiplying random points
      by #E/ell, which is cheap at these sizes.
    controls:
      - >-
        ell = N boundary (must be non-trivial) -- blocking.
      - >-
        Composite-order base point control: on the same curve, take a generator
        of the full group E(F_p) (order h*N) instead of P, and confirm the
        projection to the ell-part IS non-trivial and DOES recover the scalar mod
        ell. This demonstrates the instrument can see a real leak when one exists
        and pins the exact hypothesis the theorem uses. It is Pohlig-Hellman and
        is labelled as such.
      - >-
        A planted-positive: an artificially constructed map that is NOT a
        homomorphism (e.g. R |-> x(R) mod ell) must be seen to vary with k, so
        that a null result on the homomorphic family is not an instrument-wide
        null.
    required_metrics:
      - t_N(P,T) and e_{ellN}(P,T) values per (seed, bits, ell, T)
      - the explicit ell-division point of P and its re-verification by [ell]
      - the ell = N boundary pairing value per fixture
      - the composite-order control's recovered scalar mod ell, verified against ground truth
      - pass/fail of every gate control

  falsification_conditions:
    - >-
      A correctly implemented pairing returns a non-trivial value for
      e_{ellN}(P,T) or t_N(P,T) with ell != N on a curve satisfying the stated
      hypotheses. This contradicts an elementary theorem and must be treated as a
      suspected implementation error and replicated independently before being
      reported as anything else.
    - >-
      P is found NOT to lie in ell*E(F_p) on some instance with gcd(ell, N) = 1.
      Same disposition.
    - >-
      The ell = N boundary control returns 1 everywhere. The instrument is blind
      and the run set is INVALID rather than confirmatory (AGENTS.md rule 5).
    - >-
      The composite-order control fails to recover the scalar mod ell. The
      instrument cannot see a leak that provably exists, so its nulls are void.

  confounders:
    - >-
      Cofactor structure at toy scale. At 16-32 bits a randomly generated curve
      frequently has a smooth cofactor, so E(F_p)[ell] is often non-trivial and
      the checks are runnable -- but the same smoothness makes accidental
      degeneracies more likely (KN-TECH-030 obligation 2, KN-TECH-033 hygiene).
      Every instance must record its factored group order.
    - >-
      Pairing implementation subtleties. The reduced Tate pairing requires
      exponentiation by (p^{k_emb} - 1)/N and the embedding degree must be
      computed, not assumed. An unreduced Tate pairing is only defined up to N-th
      powers and would produce meaningless comparisons.
    - >-
      Confusing "identically 1" with "1 on the sampled points". The theorem gives
      the former; the experiment can only exhibit the latter. The write-up must
      cite the derivation for the universal statement and the run only for the
      instrument's health.

  interpretation_limits:
    - >-
      This closes ONE sub-family of L7 candidates. It says nothing about
      non-homomorphic torsion functionals, which is where the lane's remaining
      live question sits (IDEA-20260807-df906f).
    - >-
      It is not a hardness result and not a lower bound. It removes a class of
      would-be attacks by showing they carry no information, which constrains
      attackers and defenders symmetrically and changes no security estimate.
    - >-
      Scoped to prime-field ordinary curves with a prime-order base point.
      Nothing transfers to supersingular curves over F_{p^2}, to composite-order
      base points, or to ell = N.
    - >-
      The forward guidance in STEP 4 is a redirection, not a prediction that any
      of the remaining classes will succeed.

  heuristic_assumptions: []

  reachability_gate: >-
    NOT APPLICABLE AND STATED AS SUCH. This proposal moves between no curves: all
    four corollaries are evaluated on the single given curve E. T5 (the
    reachability gate of DECOMPOSITION.md section 3) therefore imposes no cost
    here. For completeness, the theorem is transport-stable: if phi: E -> E' is
    an F_p-isogeny of degree coprime to N, then phi(G) is again of prime order N,
    so every corollary holds verbatim on E' with no additional reachability cost.
    That stability is used by IDEA-20260807-053a55.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and none can follow from this record: its
      content is that a family of quantities is constant. The derivation costs
      zero; the instrument check costs O(polylog p) field operations per instance.
    memory_exponent: >-
      O(1) beyond the instance. Not a binding constraint at any scale.
    best_known: >-
      For prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886*sqrt(N) group operations and small per-processor memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted by at most sqrt(|Aut|)
      on CM curves (KN-TECH-018); BSGS at 2*sqrt(N) operations and sqrt(N)
      storage (KN-TECH-031). Pohlig-Hellman (KN-TECH-030) fixes N as the largest
