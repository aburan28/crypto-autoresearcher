idea:
  id: IDEA-20260806-b60c35
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-08-06'
  title: >-
    MEASUREMENT WORK, NOT EXPONENT WORK: Heuristic 1 is stated uniformly in p and the only
    experiment ever run for it used exactly the two DEPLOYED SQIsign primes and no control
    prime -- supply the missing null arm, matched random primes of the same size and
    congruence class, and find out whether the field's single piece of evidence for
    Heuristic 1 is about the heuristic or about those two primes
  class: control

  claim: >-
    STATED FIRST, AS THE HANDOFF REQUIRES: THIS RECORD MOVES NO EXPONENT AND PROPOSES NO
    ALGORITHM. It is measurement and control work on the one assumption every cost row in
    two campaigns multiplies.
    Heuristic 1 (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 69, READ) quantifies
    over a uniformly random supersingular E, "uniformly as p -> infinity". Section 4.2
    (READ) reports the only experimental support that exists: 100,000 samples at
    p = 5*2^248 - 1 and 10,000 samples at p = 27*2^500 - 1. BOTH OF THOSE ARE SQIsign
    PARAMETERS, AND BOTH ARE HIGHLY SPECIAL PRIMES OF THE FORM c*2^k - 1 CHOSEN SO THAT
    p + 1 CARRIES A LARGE POWER OF TWO. THE EXPERIMENT HAS A THEORETICAL COMPARISON (the
    Dickman-de Bruijn rho) AND NO MATCHED NULL. No random prime of matched size has ever
    been sampled, in the paper or anywhere in this corpus, so nothing in the record
    distinguishes "the heuristic holds" from "the heuristic holds at these two primes".
    docs/inventor-protocol.md section 3 is explicit that a reported signal is an artifact
    until the identical measurement has been run against a null object of the same shape.
    Two arithmetic facts, DERIVED IN THIS SESSION AND OFFERED FOR RECHECKING, show the two
    primes are not even a matched pair with each other: 2^248 = 1 mod 3 and 5 = 2 mod 3, so
    5*2^248 - 1 = 1 mod 3; while 27*2^500 = 0 mod 3, so 27*2^500 - 1 = 2 mod 3. Both are
    3 mod 4 (each is a multiple of 4 minus 1). SO j = 1728 IS SUPERSINGULAR FOR BOTH AND
    j = 0 IS SUPERSINGULAR FOR THE NIST-V PRIME AND NOT FOR THE NIST-I PRIME. The two
    experiments therefore sit in different congruence classes, which is a controlled
    variation the published data already contains and which nobody has read out of it.
    THE PROPOSAL IS THE MISSING CONTROL, IN THREE ARMS, WITH A PRE-REGISTERED THREE-WAY
    FORK:
      ARM T (treatment): the two deployed primes.
      ARM M (matched null): random primes of the same bit length AND the same class mod 12.
      ARM C (cross null): random primes of the same bit length in the OTHER classes mod 12.
    IF T = M = C, Heuristic 1's uniformity in p is corroborated at cryptographic scale for
    the first time with a control, and the campaign's P0 stands on stronger ground than it
    does now. IF T = M != C, the effect is the congruence class alone -- a known, small,
    computable effect -- and the correction is a constant. IF T != M, THE DEPLOYED PRIMES
    ARE NOT REPRESENTATIVE OF THEIR OWN CONGRUENCE CLASS, the deviation is caused by the
    additive shape c*2^k that SQIsign chose for arithmetic efficiency, and every cost row
    in GOAL-SSI-001 and GOAL-P13-001 that multiplies P0 must be recomputed at the deployed
    prime rather than at the uniform prediction. NO DIRECTION IS PREDICTED FOR THAT LAST
    BRANCH AND THE RECORD DOES NOT CLAIM THE DEPLOYED PRIMES ARE WEAKER; THE BIAS COULD GO
    EITHER WAY AND EITHER DIRECTION IS A RESULT.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-2d2c41
    why_it_is_the_nearest: >-
      2d2c41 is the only committed record that audits the CONDITIONING of Heuristic 1, and
      it is the record that identifies delta_E as a value of a ternary quadratic form
      subject to local conditions -- the same algebraic object this record varies.
    differing_observable: >-
      THE AXIS OF VARIATION IS p, NOT E. 2d2c41 holds p fixed and conditions on the rare
      event delta_E <= T, asking whether the smoothness of delta_E survives conditioning on
      a p^{3theta/2 - 1/2}-probability event over CURVES. This record conditions on nothing
      about E -- it samples uniformly, exactly as Heuristic 1 specifies -- and varies THE
      PRIME. Concretely: 2d2c41's measured quantity is a conditional smoothness CDF at one
      p; this record's measured quantity is the DIFFERENCE between two unconditional
      smoothness CDFs at two different p of the same size. 2d2c41's experiment cannot
      detect a p-shape effect because it has one prime, and this record's experiment cannot
      detect a conditioning effect because it conditions on nothing. They are orthogonal and
      they compose: if this record finds T != M, 2d2c41's conditioning audit must be re-run
      at the deployed prime rather than at a generic one.
    also_discriminated_from:
      - >-
        IDEA-20260805-062bee -- measures the covering law Pr[delta <= D] ~ c D^beta
        p^{-gamma} at FOUR TOY PRIMES p in {103, 251, 503, 1019}, i.e. it fits gamma ACROSS
        p at toy scale. Two differences, both concrete: (i) 062bee measures the SIZE of
        delta and this record measures the SMOOTHNESS of delta, which the record's own
        interpretation_limits correctly says are independent statements; (ii) 062bee's
        p-variation is across three binary orders of magnitude at toy scale, and this
        record's is a same-size comparison at crypto scale, which is the only place a
        deployed-parameter statement can be made.
      - >-
        ideas/catalogue-20260805/C1-7 (pre-ledger) -- "crypto-scale tail validation of
        Heuristic 1 by trial-division smoothness". That entry proposes ONE ARM: sample and
        compare against rho. This record's deliverable is the DIFFERENCE BETWEEN ARMS, and
        a one-arm experiment cannot produce it however large the sample. C1-7 is a
        prerequisite instrument for this record, not a substitute, and the record says so.
      - >-
        ideas/catalogue-20260805/C1-8 (pre-ledger) -- sampler fidelity, "is uniformly
        random up to conjugation actually uniform?". That is an instrument question at one
        prime; this record inherits its answer as a precondition and adds nothing to it.
      - >-
        ideas/catalogue-20260805/B1-12 (pre-ledger) -- quaternion-side distribution test on
        SQIsign KEYGEN OUTPUT versus uniform maximal orders. That varies the SAMPLING
        DISTRIBUTION over orders at a fixed prime; this record varies the PRIME at a fixed
        (uniform) sampling distribution. The two nulls are different objects and a
        difference found by one does not explain a difference found by the other.
      - >-
        No committed proposal in either goal varies p at fixed bit length. The audit at
        coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-fd3518/duplication_audit.md
        records the grep that establishes this.

  object_first_candidate:
    tracked_object: >-
      THE LOCAL-INVARIANT VECTOR of the ternary lattice (P, Nrd/p): the tuple of local
      symbols of the quadratic form at a fixed finite set of small primes {2, 3, 5, 7, ...},
      together with p's residue class mod 12. It is followed as p varies at fixed bit
      length, and it is what mediates any p-shape effect on the smoothness of the values
      the form represents.
    one_step_propagation_rule: >-
      DETERMINISTIC AND CHEAP, WHICH IS WHAT MAKES THIS AN OBJECT RATHER THAN A STATISTIC.
      The algebra B_{p,infinity} is ramified exactly at p and infinity, so at every small
      prime l it is split and the local structure of a maximal order is independent of p.
      What is NOT p-independent is the interaction of the reduced norm with the two-sided
      ideal P of norm p and with the ramification at p, which is governed by p's class mod
      small moduli; the classical visible consequences are that j = 1728 is supersingular
      exactly when p = 3 mod 4 and j = 0 exactly when p = 2 mod 3, and that the count of
      F_p-rational supersingular curves is h(-p) or 2h(-p) according to p mod 8. So: FIX
      THE CLASS OF p MOD 12 AND THE LOCAL-INVARIANT VECTOR AT SMALL PRIMES IS FIXED; CHANGE
      IT AND THE VECTOR CHANGES BY A COMPUTABLE RULE. That is the one-step propagation, and
      it is exactly what the ARM M / ARM C split is designed to hold fixed and vary.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: every attack family. This record proposes no attack,
      no algorithm and no bound. Specifically off-limits: MITM/claw/vOW, KLPT as an attack,
      orientation/CM (closed by DEC-20260804-3677f1), torsion-image/Kani, quantum,
      SQIsign transcript statistics, CSIDH/FC0. ALSO off-limits: re-deriving Heuristic 1's
      theoretical justification, which the frozen source supplies and which this record
      does not touch.
    newness_score: >-
      As mathematics, nil. As a control, it is the matched null for the field's only
      Heuristic-1 experiment, and neither the frozen source nor any record in this corpus
      contains one. The record claims nothing about whether such a control exists in the
      unreachable literature.
    testability_score: >-
      High but GATED, and the gate is stated rather than assumed: the arms require a
      quaternion-side sampler (random maximal order in B_{p,infinity}, form the two-sided
      ideal P of norm p, find its shortest vector, factor the norm). The frozen source's
      section 4.2 (READ) states exactly this pipeline as its own method, and the pre-ledger
      catalogue's B1 section 0.4 records that it is 4x4 integer HNF plus a 4-dimensional
      SVP plus integer smoothness testing -- implementable in pure Python here, with NO
      SageMath. Until that sampler exists and passes C1-8's fidelity check, this record is
      BLOCKED, and that is a precondition rather than an excuse.
    survival_score: >-
      The local-invariant vector survives every variation of p at fixed class by
      construction. It DISSOLVES as an explanation the moment a difference appears BETWEEN
      primes of the same class -- which is precisely the ARM T versus ARM M comparison, and
      precisely the outcome that would matter most.

  mechanism: >-
    STEP 1 -- WHAT THE PUBLISHED EXPERIMENT DOES AND DOES NOT CONTROL. Section 4.2 (READ)
    describes the shortcut that makes crypto-scale sampling possible: "instead of a random
    elliptic curve E, we generate a random maximal order O in the quaternion algebra
    B_{p,infinity} ... the lattice of isogenies Hom(E, E^{(p)}) (with the quadratic form
    deg) is isometric to the unique two-sided ideal P of reduced norm p in O (with the
    quadratic form Nrd/p) ... we sample random maximal orders (uniformly random up to
    conjugation), compute the ideal P, and find the smallest vector in P ... We then factor
    this norm, and record its largest prime factor l." The comparison is against the
    theoretical rho(u). THAT IS A THEORY COMPARISON, NOT A NULL OBJECT: it tells you the
    data matches a model, not that the model's p-uniformity has been exercised.
    THE TWO TAIL POINTS THE PAPER REPORTS ARE ALSO A FREE, ZERO-SAMPLE CHECK AND THEY ARE
    THIS RECORD'S INSTRUMENT GATE (READ, verbatim): "In the case p = 5*2^248-1, the
    smoothest sample out of 100,000 is 12589-smooth. The predicted probability to be
    12589-smooth is rho(u) = 1/69232, consistent with the observation." And: "In the case
    p = 27*2^500-1, the smoothest sample out of 10,000 is e^23-smooth. The predicted
    probability to be e^23-smooth is rho(u) = 1/3312."
    THOSE TWO SENTENCES CONTAIN FOUR NUMBERS AND A FUNCTION, AND THE CAMPAIGN HAS NEVER
    RECOMPUTED THEM. With u = log(p/2)/(3 log B) (line 69, READ) and the Dickman-de Bruijn
    rho, computing rho(u) at B = 12589 and at B = e^23 and checking that it returns 1/69232
    and 1/3312 is minutes of numpy. IT IS A KNOWN-ANSWER GATE ON THE CAMPAIGN'S OWN READING
    OF u -- and u is not a detail: P0 = u^{-u(1+o(1))} multiplies every margin row this
    programme has produced, and EV-SSI-59f7a2's whole correction sits on top of it. If the
    recomputation misses, either the campaign's u is wrong or the paper's rho is being read
    differently, and either way every downstream cost row is affected.

    STEP 2 -- WHY p'S SHAPE COULD MATTER, STATED HONESTLY AS A HYPOTHESIS WITH NO ASSERTED
    MECHANISM. This record does NOT have a derivation forcing a p-shape effect and says so.
    What it has is three reasons the question is open rather than idle:
      (i) delta is the minimum of a ternary form, not a random integer, and 2d2c41 already
      records that "integers represented by a fixed ternary form satisfy local conditions at
      the primes dividing its discriminant" and that "THE BIAS COULD GO EITHER WAY". Those
      local conditions are p-dependent through the ramification at p.
      (ii) The visible p-dependencies are classical and non-trivial: j = 1728 supersingular
      iff p = 3 mod 4, j = 0 supersingular iff p = 2 mod 3, and the F_p-rational count is
      h(-p) or 2h(-p) by p mod 8. Those are constants, not exponents -- but the campaign's
      entire dispute is over 6-8 bits, which is a constant.
      (iii) SQIsign's primes are chosen so that p + 1 is divisible by a large power of 2.
      Whether the additive shape of p leaves any trace in the multiplicative structure of
      the values represented by (P, Nrd/p) is EXACTLY the kind of question that is cheap to
      test and expensive to argue, and the three-arm design tests it without needing the
      argument.

    STEP 3 -- THE DESIGN, WITH THE FORK PRE-REGISTERED BEFORE ANY SAMPLING. Three arms at
    each of two bit lengths (250 and 501, matching the deployed primes), N samples per arm
    with N fixed in advance. ARM T: the two deployed primes. ARM M: three random primes per
    bit length in the same class mod 12 as the corresponding deployed prime. ARM C: three
    random primes per bit length in a different class mod 12. Primary statistic: the
    empirical CDF of log(largest prime factor of the minimal norm), i.e. exactly the
    quantity the frozen source's Figures 1 and 2 plot. Primary comparison: a two-sample
    Kolmogorov-Smirnov statistic between arms, PLUS the residual of each arm against rho(u)
    at three declared quantiles. THE ARM-VERSUS-ARM COMPARISON IS THE DELIVERABLE; the
    arm-versus-rho residual is the sanity check that each arm's instrument is working.
    ORDERING: ARM M and ARM C are generated, measured and hash-committed BEFORE ARM T is
    looked at, so the treatment cannot tune the test.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-06'
    corpus_paths_read:
      - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (Heuristic 1, Theorem 1.4, section 4.2 including both tail sentences, READ)
      - ledger/proposals/IDEA-20260805-2d2c41.yaml (head), -062bee.yaml (full)
      - knowledge/findings/KN-FIND-d1c853.md (Heuristic 1 pairing rule; records that NC-3/NC-6 failed with an infrastructure error and the j-invariant distribution test was NOT executed)
      - knowledge/findings/KN-FIND-4e7a92.md
      - ideas/catalogue-20260805/{INDEX.md, C1 heading list, B1 section 0.4}
    findings:
      - >-
        KN-FIND-d1c853 records in terms: "Heuristic 1 has NOT been empirically validated"
        in this programme, and that the validation experiment failed with an infrastructure
        error. So the field's only evidence is the frozen source's own two-prime
        experiment, and this corpus has added none.
      - >-
        A grep of ledger/proposals for "special prime|prime shape|5.*2\\^248|27.*2\\^500"
        returned four files, of which only IDEA-20260805-2d2c41 is a Heuristic-1 record, and
        it varies E rather than p.
      - >-
        No committed record recomputes the paper's two reported rho(u) values.
    literature_verified: []
    literature_unverified:
      - >-
        The classical supersingularity criteria (j = 1728 iff p = 3 mod 4, j = 0 iff
        p = 2 mod 3) and the h(-p) versus 2h(-p) doubling are RECALLED STANDARD FACTS, not
        read from a source in this session. Each is checkable at toy scale in minutes and
        the validation plan does so.
      - >-
        The congruence computations for the two SQIsign primes were DERIVED IN THIS SESSION
        by hand (2^248 = 1 mod 3 since 2 = -1 mod 3 and 248 is even; 5 = 2 mod 3; 27 = 0
        mod 3; both primes are a multiple of 4 minus 1). They are elementary and are stated
        so a reviewer can recheck them in one line each. They are NOT taken from any source.
    conclusion: unverified.

  lossy_projection_identifiability_audit:
    projection: >-
      A prime p together with the full arithmetic of B_{p,infinity} and its maximal orders
      is projected to a finite tuple: the class of p mod 12 and the local symbols of
      (P, Nrd/p) at a declared finite set of small primes.
    what_is_discarded: >-
      The size of p, its additive shape, the class number, the entire graph, every maximal
      order, and every curve.
    why_genuinely_lossy: >-
      Infinitely many primes share any given tuple, and primes of wildly different size and
      shape collide. Nothing about p beyond a finite congruence datum survives.
    why_compatible_with_the_operations: >-
      The operation here is variation of p at fixed bit length, and the tuple is determined
      by p's residue class alone, so it transforms deterministically under that operation.
      That is what makes ARM M (same tuple) and ARM C (different tuple) a controlled
      contrast rather than two unrelated samples.
    is_it_only_a_change_of_coordinates: >-
      NO -- and the record is careful here, because THE PROJECTION IS DESIGNED TO BE
      INSUFFICIENT. The tuple deliberately discards the additive shape of p. If ARM T
      differs from ARM M, the tuple does NOT determine the observable, the projection has
      been shown insufficient, and THAT IS THE FINDING. A projection whose insufficiency is
      the experiment's positive outcome is a legitimate tracked object; one that could never
      be shown insufficient would not be.
    mirror_failure_check: >-
      CHECKED. The mirror failure is a projection constant across inputs. The tuple is
      forced to vary across the arms by construction -- ARM C is defined by having a
      different one -- and the classical criteria guarantee the variation is real
      (j = 0 supersingular in one class and not another). If ARM C's tuple did not differ
      from ARM M's, the arm assignment is misimplemented and nothing may be read.

  null_object_control:
    primary_null: >-
      ARM M, the SIZE- AND CLASS-MATCHED RANDOM PRIME. Random primes of the same bit length
      and the same class mod 12 as the deployed prime, sampled with a declared seed, run
      through the identical pipeline with the identical sample size.
    why_it_can_fail: >-
      IT CAN FAIL IN BOTH DIRECTIONS AND BOTH ARE INFORMATIVE. If ARM M's CDF is
      indistinguishable from ARM T's, the deployed primes are representative and the
      published evidence for Heuristic 1 gains a control it has never had -- a positive
      result for the incumbent's conditionality. If ARM M differs from ARM T, the published
      evidence is about those two primes and not about the heuristic as stated, and every
      cost row that multiplies P0 must be recomputed at the deployed prime. THE
      INSTRUMENT-KILLING FAILURE IS ALSO REACHABLE: if ARM M differs from ARM C by more than
      ARM M's own internal spread across its three primes, the between-prime variance
      exceeds the between-class signal and NO arm comparison may be read.
    secondary_nulls:
      - >-
        rho KNOWN-ANSWER GATE (zero sampling, run FIRST): recompute rho(u) at
        (p, B) = (5*2^248-1, 12589) and (27*2^500-1, e^23) and require 1/69232 and 1/3312
        within a declared tolerance. If the recomputation misses, the campaign's reading of
        u is wrong and NOTHING downstream -- in this record or in any committed cost row --
        is interpretable. This gate is capable of failing and it is cheap.
      - >-
        WITHIN-ARM SPREAD CONTROL: ARM M contains three distinct primes per bit length, so
        its internal spread is measured, not assumed. Every between-arm difference is
        reported as a multiple of that spread. A design with one prime per arm could not do
        this and would produce an uninterpretable number.
      - >-
        SAMPLER-FIDELITY PRECONDITION: the maximal-order sampler must first pass the
        internal consistency checks the pre-ledger entry C1-8 specifies (Eichler mass
        formula sum 1/|Aut| = (p-1)/24, disc(O) = p, P^2 = pO, Gram determinant). A failure
        halts everything; toy-scale agreement with a brute-force curve-side enumeration at
        p <= 1019 is the positive control.
      - >-
        DEGENERATE-VARIATION CONTROL: run ARM M against ITSELF split in half by seed. The
        two halves must be indistinguishable. A statistic that separates a sample from
        itself is measuring the sampler.

  assumptions:
    - >-
      The Deuring-side shortcut of section 4.2 is faithful: the minimal norm of the
      two-sided ideal P equals the minimal degree of an isogeny E -> E^{(p)} for the
      corresponding curve. This is the frozen source's own stated method and it is inherited,
      not re-derived.
    - >-
      "Uniformly random up to conjugation" is the intended sampling distribution and its
      fidelity is a precondition (C1-8), not a result of this record.
    - >-
      Classical computation; no quantum position is taken.

  predictions:
    - metric: >-
        rho_gate_residual: |computed rho(u) - reported value| / reported value, at the two
        (p, B) pairs the frozen source states
      direction: lower
      minimum_effect: >-
        Below 0.15 at both points. This is a KNOWN-ANSWER GATE and it can fail; a residual
        above 0.5 means the campaign's u or its rho implementation is wrong and every
        committed cost row inherits the error.
    - metric: >-
        KS_TM: two-sample Kolmogorov-Smirnov statistic between ARM T and ARM M at matched
        bit length and sample size
      direction: different
      minimum_effect: >-
        PRE-REGISTERED FORK. KS_TM below the ARM M internal spread -> deployed primes are
        representative; Heuristic 1's p-uniformity gains its first control and the record
        closes positively for the incumbent. KS_TM above three times the ARM M internal
        spread -> the deployed primes are NOT representative of their own class and the
        additive shape leaves a trace. Intermediate -> underpowered, report the required
        sample size and nothing else.
    - metric: >-
        KS_MC: the same statistic between ARM M and ARM C (class contrast)
      direction: different
      minimum_effect: >-
        Predicted small but non-zero: the congruence class changes the number of small-CM
        curves by O(sqrt(p)) out of p/12, a relative O(p^{-1/2}) effect that should be
        INVISIBLE at any feasible sample size. IF KS_MC IS LARGE, the local-invariant vector
        matters far more than the counting suggests, which is itself a finding and one this
        record's tracked object predicts should not happen.
    - metric: >-
        P0_shift_bits: the change in log2(1/P0) at the deployed prime implied by the ARM T
        versus ARM M difference, evaluated at the campaign's committed B_opt
      direction: different
      minimum_effect: >-
        Predicted 0.0 +/- 0.5 bits. Reported with sign. A shift exceeding 1 bit in either
        direction is material against the committed 6-8 bit gap of EV-SSI-59f7a2 and must be
        propagated into every downstream cost row rather than reported in isolation. NO
        DIRECTION IS PREDICTED: a shift favouring the defender is exactly as reportable as
        one favouring the attacker.
    - metric: >-
        self_split_KS: ARM M against itself split by seed
      direction: lower
      minimum_effect: >-
        Below the nominal significance threshold. A significant self-split means the
        statistic is measuring the sampler and no arm comparison may be read.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line.
      STAGE 0 (minutes, numpy only, ZERO SAMPLING): the rho known-answer gate. Recompute
      rho(u) at the two published (p, B) pairs and compare to 1/69232 and 1/3312. Also
      recheck the two congruence computations by hand. If the gate misses, stop and report
      the gate failure as the finding -- it would be the most consequential outcome
      available here, because u multiplies everything.
      STAGE 1 (BLOCKED UNTIL THE SAMPLER EXISTS): build the quaternion-side sampler in pure
      Python -- random maximal order in B_{p,infinity}, two-sided ideal P of norm p,
      shortest vector by LLL-then-enumerate on a 4x4 Gram matrix, trial-division smoothness
      -- and pass the C1-8 fidelity checks plus a toy-scale cross-check against direct
      curve-side enumeration at p <= 1019. NO SageMath. This is the record's real cost and
      it is stated as a prerequisite, not folded into the measurement.
      STAGE 2 (hours): generate and measure ARM M and ARM C, hash-commit their statistics,
      and measure the within-arm spread and the self-split control.
      STAGE 3 (hours): measure ARM T and compute KS_TM, KS_MC and P0_shift_bits against the
      pre-committed null statistics.
    controls:
      - rho known-answer gate (zero sampling, runs first, can fail)
      - ARM M matched null, hash-committed before ARM T is read (ordering control)
      - ARM C cross null (graded contrast on the tracked object)
      - within-arm spread across three primes per arm
      - self-split degenerate-variation control
      - sampler fidelity preconditions and the toy-scale positive control
    required_metrics:
      - the two recomputed rho values beside the two published values
      - per-arm empirical CDFs and their residuals against rho at three declared quantiles
      - KS_TM, KS_MC, within-arm spread, self_split_KS
      - P0_shift_bits with sign and its propagation into the committed cost rows
      - sampler fidelity receipts and the toy cross-check table

  falsification_conditions:
    - >-
      The rho gate misses by more than 50 per cent. The campaign's u or rho is wrong; halt
      and report that, because it invalidates committed cost rows and is far more important
      than anything else in this record.
    - >-
      The sampler fails its fidelity checks or disagrees with toy-scale curve-side
      enumeration. Instrument broken; no distributional statement may be made.
    - >-
      The self-split control is significant. The statistic measures the sampler; nothing
      may be read.
    - >-
      Within-arm spread exceeds the between-arm differences. Underpowered; report the
      required sample size and make no claim in either direction.
    - >-
      KS_TM large with all controls passing. Heuristic 1's evidence base is prime-specific
      and every P0-multiplied row must be recomputed. This is the record's positive branch
      and it is reportable in whichever direction the shift goes.

  confounders:
    - >-
      SAMPLE SIZE. The frozen source used 100,000 and 10,000 samples. Matching that in pure
      Python at 250- and 501-bit primes is the dominant cost and may not be reachable within
      a task budget; an underpowered comparison is uninterpretable, so the contract must fix
      N in advance and report power rather than quietly shrinking the arms.
    - >-
      FACTORING THE MINIMAL NORM. The published method factors the norm to get its largest
      prime factor. Full factorisation at 250+ bits is expensive; trial division to a bound
      gives a ONE-SIDED answer (B-smooth or not), which is sufficient for a CDF at declared
      B values and is what the pre-ledger entry C1-7 proposes. The contract must state which
      is used, because a truncated test biases the tail.
    - >-
      SEED AND PRIME SELECTION. ARM M and ARM C primes must be drawn by a declared,
      reproducible rule before any measurement. Selecting primes after seeing a result is
      the classic way this design fails.
    - >-
      TWO BIT LENGTHS ONLY. The deployed primes are 250 and 501 bits; the comparison is a
      same-size contrast and says nothing about the p -> infinity limit in Heuristic 1's
      statement. The record measures representativeness, not uniformity in the limit.

  interpretation_limits:
    - >-
      MEASUREMENT AND CONTROL WORK. No exponent moves, no algorithm is proposed, no attack
      exists, and no security claim about SQIsign follows in either direction.
    - >-
      A difference between arms would NOT falsify Heuristic 1, which is a statement about
      uniformly random E as p -> infinity and which no finite experiment can refute. It
      would show that the evidence FOR it is prime-specific, which is a statement about the
      evidence.
    - >-
      Even a large KS_TM affects P0, which is p^{o(1)}. The consequence is CONCRETE BITS at
      deployed parameters, never an exponent, and the record forbids any exponent reading.
    - >-
      The result is scoped to the exact sampler, the exact primes, the exact sample sizes
      and the exact smoothness bounds tested. Toy-scale sampler validation is toy-scale and
      may never be presented as crypto-scale validation (AGENTS.md rule 7); the crypto-scale
      arms, if they run, ARE crypto-scale for the sampled quantity and for nothing else.
    - >-
      Forward guidance if the arms agree: the p axis is closed for these two bit lengths and
      sample sizes, and the open axes are the conditioning axis (IDEA-20260805-2d2c41) and
      the keygen-distribution axis (pre-ledger B1-12).

  heuristic_assumptions:
    - id: H-PSHAPE-1
      statement: >-
        FOR ALL primes p in a fixed class mod 12 and FOR a maximal order O sampled uniformly
        up to conjugation in B_{p,infinity}, the distribution of the largest prime factor of
        the minimal value of (P, Nrd/p) depends on p only through log p, up to o(1).
      rigorous_support: >-
        This IS Heuristic 1 restricted to a congruence class, and its rigorous ingredient is
        the same pair the frozen source names: Theorem 1.5's bound (p/2)^{1/3} on the
        minimal degree and Theorem 1.4 (Canfield-Erdos-Pomerance) for the smoothness of a
        uniformly random integer of that size. The classical distribution statement it
        imitates is the Dickman-de Bruijn rho.
      validation_plan: >-
        THE EXPERIMENT IS THE VALIDATION, and its comparison distribution is rho(u) with the
        tail consistency check the frozen source itself performs (smoothest observed sample
        against the predicted rho(u)) run separately per arm. CRYPTO SCALE via the section-4.2
        quaternion shortcut, which is why this record exists at all; the sampler's own
        validation is toy scale and is labelled toy.
      falsification_condition: >-
        KS_TM above three times the within-arm spread with all controls passing.
    - id: H-PSHAPE-2
      statement: >-
        The local-invariant vector at small primes, together with p mod 12, determines any
        p-dependence of the smoothness law at fixed bit length; the additive shape of p
        leaves no trace.
      rigorous_support: >-
        NOT PROVED, AND THE RECORD SAYS SO. The supporting intuition is that B_{p,infinity}
        splits at every l different from p, so small-prime local structure is p-independent
        except through the ramification at p. THIS IS EXACTLY THE ASSUMPTION THE ARM T
        VERSUS ARM M COMPARISON TESTS, and its failure is the record's positive branch
        rather than a defect.
      validation_plan: >-
        ARM T versus ARM M is the direct test. The graded ARM C contrast measures how much
        the class alone is worth, which calibrates how large a T-versus-M difference would
        have to be to mean anything.
      falsification_condition: >-
        A significant KS_TM with a negligible KS_MC: same class, same local invariants,
        different law.
    - id: H-PSHAPE-3
      statement: >-
        Trial division to bound B decides B-smoothness of the minimal norm exactly, so a CDF
        evaluated at declared B values is unbiased even without full factorisation.
      rigorous_support: >-
        Exact and elementary: an integer is B-smooth if and only if trial division by all
        primes up to B reduces it to 1. No heuristic is involved for the CDF at declared B;
        the heuristic would enter only if the LARGEST PRIME FACTOR itself were estimated
        rather than bracketed, which the design forbids.
      validation_plan: >-
        Zero compute: the statement is a definition check. The contract must state the
        declared B grid before the run and must never interpolate between grid points.
      falsification_condition: >-
        Not applicable; the record instead pre-registers that any reported quantity outside
        the declared B grid is an interpolation and is inadmissible.

  target_complexity:
    time_exponent: >-
      UNCHANGED AT p^{1/3+o(1)}, AND THE TITLE SAYS SO. This record measures an input to the
      o(1) and moves no exponent. Its largest possible consequence is a shift in
      log2(1/P0) at the deployed primes, i.e. concrete bits inside the o(1).
    memory_exponent: >-
      Of the algorithm under study: p^{1/3+o(1)}, unaffected. Of this record's own
      measurement: O(N) integers of 500-1000 bits per arm, bounded by the declared sample
      size and trivially within any task budget.
    best_known: >-
      Time and memory p^{1/3+o(1)} conditional on Heuristic 1 (frozen source Theorem 1.1,
      READ). This record neither improves nor challenges it; it tests the evidence base of
      the condition.
    hidden_overhead: >-
      P0^{-1} = u^{u(1+o(1))} is precisely part of the superpolynomial overhead the frozen
      source discloses in section 1.1 (READ). A measured P0 shift is a change to a number
      INSIDE that overhead and may never be reported as an exponent change. Conversely, the
      record forbids assuming the deployed prime's P0 equals the uniform prediction, which
      is what every committed row currently assumes.
    tradeoff_note: >-
      P0 multiplies the time axis and not the memory axis (frozen source section 4.1, READ:
      "the memory cost of the algorithm is ~ M, and its time cost is ~ M/P0"). A P0 shift
      therefore moves the full-memory point HORIZONTALLY on the (time, memory) frontier and
      moves the van Oorschot-Wiener branch by the same additive amount in log time. That is
      a derived, checkable statement and it is the record's only frontier claim.

  dominated_by: >-
    n/a (no attack proposed, no algorithm exhibited, no cost reduced). ROWS CHECKED ACROSS
    TIME, MEMORY AND DATA/QUERIES before writing n/a, per docs/inventor-protocol.md section
    5: (1) Wesolowski 2026, time and memory p^{1/3+o(1)}, queries 0; (2) Delfs-Galbraith,
    p^{1/2}(log p)^{O(1)} at polynomial memory, queries 0; (3) van Oorschot-Wiener,
    p^{1/2+o(1)}/w^{1/2} at memory w, queries 0; (4) meet-in-the-middle, p^{1/2} at p^{1/2},
    queries 0; (5) Kohel 1996, p*(log p)^{O(1)} at polynomial memory, queries 0. The
    data/queries axis is 0 on every row. This record adds no row.
  sota_delta: >-
    ZERO on every attack axis. QUANTITATIVELY, the deliverable is the first controlled
    measurement of an assumption that multiplies every cost row in two campaigns, with a
    pre-registered material threshold of 1 bit of log2(1/P0) against EV-SSI-59f7a2's
    committed 6-8 bit gap -- i.e. a measurement whose material outcomes span roughly a sixth
    of the disputed margin, in a direction the record refuses to predict. Its contribution to
    sota is a CONTROL: the field's only Heuristic-1 experiment currently has a theory
    comparison and no null object, and this supplies the null object.

  estimated_cost:
    implementation: high
    compute: medium
  compute_budget_note: >-
    STAGE 0 is minutes with numpy and is the only stage runnable today. STAGES 1-3 are GATED
    on a quaternion-side sampler that DOES NOT EXIST in this repository. The pre-ledger
    catalogue's B1 section 0.4 records that the sampler is implementable in pure Python
    (4x4 integer HNF, LLL-then-enumerate for 4-dimensional SVP, integer smoothness testing)
    and that SageMath is unavailable and uninstallable here. Building and validating it is
    the record's real cost and it is stated as a prerequisite rather than absorbed. An
    infrastructure failure in Stage 1 is an infrastructure outcome and is never negative
    mathematical evidence (AGENTS.md rule 5) -- which is exactly what happened to this
    programme's previous Heuristic-1 attempt, per KN-FIND-d1c853.
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.60 that the rho known-answer gate passes at both points; it is not higher because the
    paper's u convention and the campaign's may differ and nobody has checked, which is the
    whole reason the gate is Stage 0.
    0.20 that Stages 1-3 complete within a realistic budget, gated almost entirely on the
    sampler; this programme's previous Heuristic-1 validation failed on infrastructure
    (KN-FIND-d1c853) and that is the base rate this number reflects.
    0.10 that ARM T differs from ARM M with all controls passing. IT IS NOT LOWER BECAUSE
    the deployed primes are extremely special and nobody has ever compared them to anything;
    IT IS NOT HIGHER BECAUSE B_{p,infinity} splits at every small prime, so the mechanism by
    which an additive shape would reach the multiplicative structure of the represented
    values is not visible, and the record admits it has no derivation for one.

