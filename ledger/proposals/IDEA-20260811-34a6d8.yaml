  novelty_screen: >-
    Screened on 2026-08-11 against the committed corpus by ripgrep at snapshot
    f05894024. EXTERNAL NOVELTY IS NOT ESTABLISHED AND IS NOT CLAIMED: WebSearch
    and WebFetch failed on every call this session (Bedrock-routed inference
    profile, access denied -- the same outage disclosed for the BATCH-aeeb17
    producers and recorded as not-completable in VAL-20260811-de63ea), and the
    crypto-kb MCP index is empty. Queries run over ledger/: "Pohlig" (43 files,
    all ENDO-linked hits triaged), "cofactor" (94 proposal files),
    "ray[- ]class" (11 files), "level structure", "v_ell". FULL READS:
    IDEA-20260811-319a07 (the seed, complete, including D4, Prediction 3 and the
    planted-signal control that this record corrects), IDEA-20260807-e9d57c
    (claim and discrimination sections -- the nearest prior on leaked
    valuations), IDEA-20260808-5158fa (claim -- the char-0 closure of the
    small-l character ladder), IDEA-20260811-40c0b5 (complete),
    RQ-RAYCL-3985f4, DECOMPOSITION.md L10.
    RESULT: no record states that the ideal n acts on E(F_p) as multiplication
    by N, none decomposes psi into a norm-graded price list, and none has
    noticed the convention conflation in the seed's bit prediction. Pohlig-Hellman
    itself is classical and no novelty is claimed for it.
  discriminated_from: >-
    IDEA-20260811-319a07 (the seed) is the record this one corrects. The
    correction is narrow and is stated without inflation: D4's qualitative
    conclusion ("the computable part of psi is exactly Pohlig-Hellman") is
    ACCEPTED; its quantitative bit count and the planted-signal control derived
    from it are corrected, because they answer for the full-group DLP while the
    campaign's instance is the prime-order one. Everything else in the seed is
    untouched by this record.
    IDEA-20260807-e9d57c is the nearest prior in KIND: it measures the leak of
    the kernel-ideal bridge for N = ell^e and prices it at log2(e + 1) bits,
    free by Pohlig-Hellman. Its setting is a DLP whose whole group is
    prime-power, so the leaked valuation is genuinely a valuation of the answer.
    Here the answer lives modulo a prime N coprime to the leaked part, so the
    analogous count is 0 rather than log2(c). The two records agree on the
    principle and differ on the arithmetic, and this record predicts e9d57c's
    measurement will reproduce exactly, which is a cross-check on both.
    IDEA-20260808-5158fa closes the small-l quotient-character ladder in
    CHARACTERISTIC ZERO by a triviality of the Artin symbol at p. This record
    closes the characteristic-p analogue by an elementary congruence
    (k*c = 0 mod q). Different mechanism, different characteristic, consistent
    conclusion; each is a cross-check on the other and neither implies the
    other.
    IDEA-20260811-25ad05 (same session) argues the level structure is publicly
    samplable, which is about the INPUT; this record is about the OUTPUT of the
    computable part of psi. They are complementary legs of the same T1 verdict
    and neither subsumes the other.
    IDEA-20260807-413fcc (curve-measurable oracles carry zero bits) closes
    oracles taking NO group handle. Everything measured here takes a group
    handle (it is a function of Q), so 413fcc does not cover it.
