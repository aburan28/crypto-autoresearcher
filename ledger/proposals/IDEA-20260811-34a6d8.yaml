idea:
  id: IDEA-20260811-34a6d8
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RAYCL-3985f4
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  claim_tier: toy
  title: >-
    psi PRICED PRIME BY PRIME, AND THE SEED'S BIT COUNT IS WRONG IN A WAY THAT
    WOULD HAVE VOIDED ITS OWN RUN SET. Two corrections and one sharp
    discriminator. (1) The arrow that fails is NOT the projection. For every
    prime ideal q | m the quotient map E(F_p) -> E(F_p)/q E(F_p) is computable
    in O(log p) group operations -- for q = n = (N, pi - 1) it is literally
    "multiply by the cofactor", since pi - 1 kills E(F_p) so n acts as
    multiplication by N. What is NOT computable is the IDENTIFICATION of that
    quotient with O/q ~= F_{Norm(q)}, which costs O(sqrt(Norm(q))) by BSGS. So
    D3's "one non-computable arrow" is really "one non-computable CHOICE OF
    COORDINATE", and the budget-B computable part of psi is exactly its
    components at primes of norm <= B^2. (2) Consequently, for the campaign's
    own instance convention -- P of PRIME order N, k in (Z/N)^* -- the
    computable part of psi yields EXACTLY ZERO bits of k FOR EVERY COFACTOR c,
    including c = 8, because psi(Q) = k*c reduces to 0 modulo every prime ideal
    dividing c. The seed's prediction of log2(c) bits, and its planted-signal
    control declaring an instrument that recovers 0 bits at c = 8 "blind" and
    the run set INVALID, silently switch to the FULL-GROUP DLP convention. Run
    as written that control would have discarded a correct instrument. This
    record separates the two conventions, predicts 0 and log2(c) bits
    respectively, and makes the pair the sharpest available T1/T2 discriminator
  class: measurement

  claim: >-
    (A) WHY THIS RECORD EXISTS. RQ-RAYCL-3985f4 sub-question (b) asks whether
    there is ANY publicly computable partial information about psi beyond what
    Pohlig-Hellman already gives via the cofactor. The seed
    (IDEA-20260811-319a07) answers with D4 -- "the computable part of psi is
    exactly Pohlig-Hellman", quantified as log2(c) bits of k and zero when
    c = 1 -- and the question record names that prediction as the sharpest T1/T2
    discriminator available. It is the right target and the stated bit count is
    wrong. Getting it right matters twice: the corrected count is a STRONGER T1
    statement (zero bits, always, not log2(c)), and the seed's control as
    written would declare a correct instrument invalid.

    (B) SETUP. As in IDEA-20260811-25ad05 part (B): E/F_p ordinary, O maximal,
    m = (pi - 1)O, #E(F_p) = N*c with N prime, n := (N, pi - 1) of norm N,
    G = <P> of order N, Q = [k]P, k in (Z/N)^*. psi : E(F_p) -> O/m is the
    O-module coordinate normalised at a chosen generator.

    (C) CORRECTION 1 -- THE PROJECTION IS FREE; THE COORDINATE IS NOT.
      Let q be a prime ideal dividing m, of norm ell^f. Then:
        (i) THE QUOTIENT IS COMPUTABLE. q*E(F_p) is a subgroup of index Norm(q)
            and membership in it is decidable by group operations alone. The
            sharpest case is q = n: since pi acts as the identity on E(F_p),
            the ideal n = (N, pi - 1) acts on E(F_p) exactly as multiplication
            by N, so n*E(F_p) = N*E(F_p) = the prime-to-N part, and the
            quotient map is "reduce modulo the cofactor subgroup" -- O(log p)
            group operations. NOTHING IS HARD HERE.
        (ii) THE COORDINATE IS NOT COMPUTABLE FOR FREE. E(F_p)/q E(F_p) is an
            abstract cyclic group of order Norm(q) with NO canonical
            isomorphism to O/q ~= F_{Norm(q)}. Computing the coordinate of a
            point in that quotient relative to the image of the base point is a
            discrete logarithm in a group of order Norm(q), i.e.
            Theta(sqrt(Norm(q))) group operations by BSGS or rho, and O(Norm(q))
            by naive search.
      CONSEQUENCE, STATED AS THE RECORD'S FIRST DELIVERABLE:
        THE BUDGET-B COMPUTABLE PART OF psi is exactly the vector of its
        components at the prime ideals q | m with Norm(q) <= B^2, and it costs
        sum sqrt(Norm(q)) <= |{q}| * B group operations. That is a SHARPER and
        more useful statement of the seed's D3 than "one arrow is not
        computable": the diagram's failure is localised not at a map but at a
        CHOICE OF BASIS, and it is graded by norm rather than binary.

    (D) CORRECTION 2 -- THE BIT COUNT, UNDER BOTH CONVENTIONS, WRITTEN OUT.
      CONVENTION I (THE CAMPAIGN'S, AND THE ONE H-ENDO-001 AND EVERY GOAL-ENDO-001
      cost functional use): the instance is (E, P, Q = [k]P) with P of PRIME
      order N and the answer k in (Z/N)^*. Fix a full O-module generator R
      (publicly constructible -- IDEA-20260811-25ad05 Lemma 3) with [c]R = P.
      Then psi(R) = 1, psi(P) = c and
        psi(Q) = k * c   in O/m ~= Z/(N*c) when E(F_p) is cyclic.
      For any prime ideal q | m with Norm(q) = ell^f and ell | c we have
      c = 0 mod q, hence
        psi(Q) = k * c = 0 mod q,  FOR EVERY k.
      THE COMPONENT IS CONSTANT IN k. It carries ZERO bits of k. The only
      component that carries any information about k at all is the one at
      q = n, whose norm is N, whose computation costs Theta(sqrt(N)) -- which is
      rho, exactly, with no discount. So under Convention I:
        BITS OF k RECOVERABLE WITHIN BUDGET B < sqrt(N) = 0, for every cofactor
        c, including c = 8 and c = 1.
      CONVENTION II (the composite-order DLP): the instance is (E, R, S = [k']R)
      with R a full generator and k' in Z/(N*c). Then psi(S) = k' and the
      component at q | c gives k' mod q, i.e. the Pohlig-Hellman content of the
      smooth part: exactly log2(c) bits when c is squarefree and coprime to N,
      and in general log2(c) bits of k' from the c-part.
      THE SEED'S ERROR, NAMED PRECISELY AND WITHOUT INFLATION: D4 and
      Prediction 3 of IDEA-20260811-319a07 state "number of bits of K recovered
      ... exactly log2(c) bits, and exactly 0 when c = 1", and its planted-signal
      control states "at c = 8 the instrument MUST recover exactly 3 bits. An
      instrument recovering 0 bits at c = 8 is blind and the run set is INVALID
      rather than negative." That is Convention II's answer applied to
      Convention I's instance. Under Convention I the correct measurement IS 0
      bits at c = 8, so the control as written would classify a correct
      instrument as blind and void a valid run set. THIS IS A CONTROL-DESIGN
      DEFECT, NOT A MATHEMATICAL ERROR IN THE SEED'S ALGEBRA, and it is
      correctable by declaring the convention per arm, which is what this record
      does.

    (E) THE DISCRIMINATOR, AND IT IS THE CHEAPEST T1/T2 TEST IN THE QUESTION.
      Run BOTH conventions on the SAME curves with the SAME instrument and
      measure recovered bits about the respective unknown:
        ARM I (prime-order): predicted 0 bits for every c in {1, 2, 4, 8, 9}.
        ARM II (full-group): predicted exactly log2(c) bits, so 3 bits at c = 8.
      THREE OUTCOMES, EACH WITH A PRE-DECLARED MEANING:
        OUTCOME 1 (predicted, T1). Arm I measures 0 within the null band on
          every rung and Arm II measures log2(c) exactly. Then the computable
          part of psi carries nothing about the campaign's k, the seed's D4 is
          confirmed in its corrected form, and sub-question (b) is answered NO
          within the tested budget. The instrument is simultaneously proved
          non-blind BY ARM II, which is the planted signal placed where it is
          actually a signal.
        OUTCOME 2 (T2, and it is a P3 event). Arm I measures MORE than 0 bits
          about k mod N, replicated, on any identifiable family. That is
          publicly computable partial information about psi strictly beyond
          Pohlig-Hellman. Per the standing constraint the executing session
          FLAGS AND STOPS and hands it to the Coordinator; it does not state an
          excess, does not extrapolate, and does not continue the ladder.
        OUTCOME 3 (instrument failure, not evidence). Arm II measures 0 bits.
          The instrument is blind, the run set is INVALID rather than negative,
          and Arm I's zeros mean nothing. This is the seed's control, relocated
          to the arm where it discriminates.
      Note the asymmetry that makes this cheap and honest: Outcome 1 is a
      NEGATIVE with a positive control attached, so it cannot be produced by a
      broken instrument.

    (F) THE ENUMERATION, AND ITS HONEST BOUNDARY. The claim "0 bits" is a claim
      about a SPECIFIC family of computations: the components of psi at prime
      ideals dividing m, computed within budget B. It is NOT a claim that no
      publicly computable function of (E, P, Q) leaks a bit -- that would be a
      lower bound this record cannot prove and does not assert. The family is
      enumerated explicitly (part C), its cost is graded by norm, and the
      residual class is named in the forward guidance: functions that do not
      factor through any single q, e.g. joint functions of several components,
      and functions using field-element data of x(Q) rather than group
      structure. IDEA-20260807-413fcc and KN-FIND-b7e091 bear on the latter and
      are extended, never revisited.

  resource_label: >-
    R3 (End(E) as a ring: the ideal m, the primes above it, the finite ring
    O/m) and R5 (torsion/level structure). The measurement consumes only group
    operations and public ring arithmetic.
  admissibility: admissible
  admissibility_argument: >-
    No endomorphism is applied to a point of G. The computations are: multiply a
    point by an integer (the cofactor or N), decide subgroup membership, and do
    ring arithmetic in O/m. The one place an element of O touches a point is
    where n acts on E(F_p) -- and the record's finding there is precisely that
    it acts as the INTEGER N, which is H-ENDO-001's scalar collapse observed
    rather than evaded. H-ENDO-001 is not retested; it is the reason the
    measurement comes out zero, and the record says so.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the PRIMARY lens, per docs/inventor-protocol.md
      section 1: the connecting ideal class; the kernel ideal of <Q>; the scalar
      lambda of an endomorphism on G; cost functionals as class functions; the
      generic-group transcript; and the ray-class coordinate itself
      (IDEA-20260811-319a07's object), which this record does not adopt. The
      program has no written ECDLP object enumeration (KN-OPEN-019), so this
      list is a sketch and not a taxonomy.
    tracked_object: >-
      THE COMPONENT VECTOR OF psi GRADED BY PRIME NORM: the tuple
      (psi(Q) mod q)_{q | m}, each component tagged with its computation cost
      sqrt(Norm(q)). The object followed is not the coordinate but its
      DECOMPOSITION INTO PRICED PIECES.
    lossiness: >-
      GENUINELY LOSSY, and the loss is the point. Truncating the component
      vector to primes of norm <= B^2 discards every component of larger norm --
      in particular the component at n, which is where all the information about
      k lives. What survives is a strictly smaller object, and it is discarded
      COMPATIBLY with the target's operations: the O-module structure means the
      component at q of a sum is the sum of the components, and the component at
      q of [u]Q is u * (component of Q), so one-step propagation under both
      group operations and ideal action is defined and deterministic on the
      truncated vector alone. Nothing about the discarded components is
      recoverable from the retained ones (Chinese remaindering over coprime
      ideals is independent), so this is a genuine projection and not a change
      of coordinates. Contrast the full untruncated vector, which by CRT IS the
      whole of psi and therefore IS a change of coordinates -- the record uses
      the truncation, not the total.
    propagation: >-
      One step, defined and measurable: multiplying the point by u multiplies
      each retained component by u mod q; applying a smooth isogeny permutes
      nothing and multiplies the coordinate by the ideal's class. Both are one
      modular multiplication per component and both are directly instrumentable.
    survival_score: >-
      Survives the whole instance family and every cofactor. DISSOLVES exactly
      where the grading does: when m is not coprime to the conductor (non-maximal
      O), when E(F_p) is not O-cyclic, and when q = n is admitted into the
      budget, at which point the object stops being a truncation and becomes the
      ECDLP itself. The last dissolution point is the record's own boundary and
      is stated as such rather than discovered.

  mechanism: >-
    STEP 1 (zero compute). Factor m into prime ideals over the rational primes
    dividing #E(F_p); tabulate each q with Norm(q) and the BSGS cost
    ceil(sqrt(Norm(q))). This table is the deliverable an outside reader is
    handed first, and it replaces the seed's binary "one non-computable arrow"
    with a graded price list.

    STEP 2 (zero compute). Prove the two structural facts of part (C): that n
    acts on E(F_p) as multiplication by N, and that the quotient by q*E(F_p) is
    computable while the coordinate in it is a DLP of size Norm(q).

    STEP 3 (zero compute). Write out both conventions of part (D) and the exact
    predicted bit counts, and freeze them BEFORE any measurement, so the
    discriminator is pre-registered rather than fitted.

    STEP 4 (toy compute, minutes). ARM II FIRST -- the positive control. On the
    cofactor ladder c in {1, 2, 4, 8, 9}, with a full generator R and a uniform
    k' in Z/(N*c), measure the mutual information between the truncated
    component vector and k'. Predicted log2(c) exactly. If this fails, STOP:
    the instrument is blind and Arm I would be uninterpretable.

    STEP 5 (toy compute, minutes). ARM I -- the measurement of record. Same
    curves, same instrument, instance (E, P, Q = [k]P) with P of prime order N
    and uniform k in (Z/N)^*. Measure the mutual information between the
    truncated component vector and k mod N. Predicted 0 on every rung.

    STEP 6 (toy compute, minutes). THE MATCHED NULL. Repeat Arm I with a
    k-INDEPENDENT surrogate at matched entropy (a freshly sampled uniform point
    of the same order, unrelated to Q). The measured mutual information there is
    the null band; Arm I's value must lie inside it.

    STEP 7 (zero compute). Record the residual class of part (F) explicitly:
    joint functions of several components, and field-element functions of x(Q).
    Route the latter to KN-FIND-b7e091 and IDEA-20260807-413fcc as already
    covered, and name the former as open.

  why_not_a_renamed_known_approach: >-
    Pohlig-Hellman is classical and NOTHING about it is claimed as new. What is
    absent from this corpus is: (i) the statement that the ideal n acts on
    E(F_p) as the integer N, so the quotient map is free and only the coordinate
    is hard -- which localises the seed's D3 obstruction at a choice of basis
    rather than at a map; (ii) the graded price list of psi's components by
    prime norm; and (iii) the observation that the seed's own bit prediction and
    planted-signal control mix two instance conventions with different correct
    answers. IDEA-20260807-e9d57c computes the leak of the kernel-ideal bridge
    for N = ell^e and gets log2(e + 1) bits -- a DIFFERENT setting (the DLP is
    IN the prime-power group), a different bridge, and a different quantity;
    this record's contribution is precisely to show that the analogous count in
    the campaign's own prime-order convention is 0, not log2(c), and that
    conflating the two is what produced the seed's defective control.

  proof_search_map:
    bottleneck: >-
      The identification of E(F_p)/q E(F_p) with O/q, for q = n. Every bit about
      k lives there and its cost is Theta(sqrt(N)). Nothing else in the record
      is load-bearing: the quotient maps are free, the small-norm components are
      constant in k, and the arithmetic is exact.
    baseline_embedding:
      parameter_slice: >-
        Set B = sqrt(N), i.e. admit q = n into the budget. The measurement
        recovers all of k and costs exactly Theta(sqrt(N)) -- which IS the
        best-known baseline (BSGS at sqrt(N) time and memory, KN-TECH-031, or
        rho at 0.886*sqrt(N) with O(1) memory, KN-TECH-001/006). The family
        therefore contains the baseline as an exact parameter slice rather than
        resembling it. Second boundary: set c = 1, so the only prime dividing m
        of interest is n itself and the truncated vector is empty; the recovered
        bits must be 0 by construction.
      reproduction_check: >-
        Frozen fixture: on toy instances at 16 and 20 bits, running the
        instrument at B = sqrt(N) must return k exactly on 100 percent of
        instances and its operation count must match the repository's BSGS/rho
        baseline within 20 percent. If the baseline is not reproduced at the
        boundary of the family, no interior measurement is interpretable.
    observation_collision:
      observable: >-
        The truncated component vector (psi(Q) mod q)_{Norm(q) <= B^2}.
      distinct_preimage_search: >-
        REQUIRED, AND THE PREDICTION IS A MASSIVE COLLISION -- which here is the
        CONFIRMING direction. Under Convention I the observable is predicted to
        take the SAME value (the all-zero vector) for every k in (Z/N)^*, so its
        fibre is the entire instance family: N - 1 distinct ground-truth objects
        with one observable. That is the strongest possible statement that the
        observable is non-identifying, and it is exactly what "zero bits" means
        operationally. Under Convention II the fibres are the congruence classes
        modulo c and the observable separates exactly c of them. Measuring BOTH
        fibre structures on the same instrument is the experiment.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The graded price list: psi decomposed over prime ideals, each
          component carrying its own sqrt(Norm(q)) charge, with charges added
          only over the provably disjoint blocks supplied by CRT over coprime
          ideals. The specialisation is the truncation at budget B.
        predicted_gain: >-
          None as an attack. The gain is that "one non-computable arrow" becomes
          a priced decomposition in which one can see, per prime, exactly what
          is affordable and exactly what it is worth -- and the answer is that
          everything affordable is worth zero under Convention I.
      - transform: observable_fiber
        proposed_object: >-
          Hold the truncated component vector fixed at the all-zero value and
          vary k over (Z/N)^*. The fibre is the whole family; the intrinsic
          invariant distinguishing its members is k itself, which by
          construction the observable does not see.
        predicted_gain: >-
          Negative by design: it certifies that the affordable observable cannot
          separate instances, which is the record's conclusion stated as a
          fibre computation rather than as an intuition.
    quantifier_order: >-
      ASSERTED (Convention I, the zero-bit claim): FORALL p, FORALL ordinary
      (E, O) with O maximal and E(F_p) cyclic, FORALL cofactors c, FORALL prime
      ideals q | m with q != n, FORALL k in (Z/N)^*:
      psi(Q) = 0 mod q, where Q = [k]P and P = [c]R for a full generator R.
      Hence the mutual information between the truncated component vector and k
      is exactly 0, uniformly in k -- not on average over k.
      ASSERTED (Convention II): FORALL such instances with a FULL-ORDER base
      point, the component at q gives k' mod q, so the recovered bit count is
      log2(c) for squarefree c coprime to N.
      NOT ASSERTED: that no publicly computable function of (E, P, Q)
      whatsoever leaks a bit of k -- that is a lower bound this record cannot
      prove; the enumeration is scoped in part (F). NOT ASSERTED: that the
      component at n is hard -- only that computing it costs a DLP of size N,
      which is the baseline, not a barrier.
      NOTE ON ORDER: the zero-bit statement is FORALL k, not "for random k",
      which is why one counterexample instance would refute it and why Outcome 2
      is a genuine P3 event rather than a statistical anomaly.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within budget B < sqrt(N), the prime-graded components of psi carry
        exactly zero bits of k under the prime-order-subgroup convention, and
        exactly log2(c) bits of k' under the full-group convention." It can
        NEVER certify that ECDLP is hard, can never certify anything about
        functions outside the enumerated family, and can never rule out a joint
        function of several components that is not itself a component.
      nearby_object_control: >-
        THE FULL-GROUP CONVENTION IS THE NEARBY OBJECT ON WHICH THE DESIRED
        CONCLUSION FAILS, in a controlled and quantified way: there the
        computable part is NOT information-free, it yields exactly log2(c) bits,
        and the same instrument must measure that. A version of this argument
        that reported zero bits in both conventions would be identifying the
        wrong thing (it would be measuring its own blindness). A second nearby
        object: N = ell^e (IDEA-20260807-e9d57c's setting), where the analogous
        count is log2(e + 1) and is likewise nonzero. The method must reproduce
        both nonzero answers to be trusted on the zero.
    proof_obligations:
      - claim: >-
          pi acts as the identity on E(F_p), hence n = (N, pi - 1) acts as
          multiplication by N and n*E(F_p) = N*E(F_p).
        responsibility: correctness
      - claim: >-
          For q | m, membership in q*E(F_p) is decidable in O(log p) group
          operations, and the coordinate in E(F_p)/q E(F_p) costs
          Theta(sqrt(Norm(q))).
        responsibility: runtime
      - claim: >-
          psi(Q) = k*c in O/m under Convention I with psi(R) = 1 and [c]R = P.
        responsibility: correctness
      - claim: >-
          k*c = 0 mod q for every prime ideal q | c, hence the component is
          constant in k.
        responsibility: strictness
      - claim: >-
          The enumerated family (components at primes dividing m) is exactly the
          family the claim covers, and functions outside it are not covered.
        responsibility: scope

  predictions:
    - metric: >-
        measured mutual information, in bits, between the truncated component
        vector of psi and k mod N, under Convention I (P of prime order N), over
        at least 2000 uniform k per curve, on a cofactor ladder c in
        {1, 2, 4, 8, 9}
      direction: lower
      minimum_effect: >-
        0 bits, within the 95th-percentile band of the matched k-independent
        null at the same sample size, on EVERY rung including c = 8. A measured
        value above that band, replicated on independent curves, is Outcome 2:
        FLAG AND STOP under pause condition P3, hand to the Coordinator, and
        state no excess.
    - metric: >-
        measured mutual information, in bits, between the same truncated
        component vector and k' mod (N*c), under Convention II (full-order base
        point), same curves, same instrument
      direction: higher
      minimum_effect: >-
        exactly log2(c) bits, so exactly 3.000 at c = 8 and exactly 0.000 at
        c = 1, within sampling error. A value of 0 at c = 8 means the instrument
        is blind: the run set is INVALID rather than negative and Arm I is
        uninterpretable.
    - metric: >-
        measured cost, in group operations, of computing the component of psi at
        a prime ideal q, fitted against Norm(q) across the primes dividing m on
        the ladder
      direction: higher
      minimum_effect: >-
        fitted exponent 0.50 +- 0.05 in Norm(q), consistent with BSGS. An
        exponent materially BELOW 0.5 for any q would mean a sub-birthday
        coordinate computation exists in a cyclic group of that order --
        FLAG AND STOP under P3, since applied at q = n it would beat the rho
        baseline. An exponent above 0.5 means the implementation is naive
        search and the price list overstates costs.
    - metric: >-
        agreement of the measured component vector with the algebraic prediction
        psi(Q) = k*c mod q, computed independently from the ideal side
      direction: different
      minimum_effect: >-
        exact agreement on 100 percent of instances. This is an identity; a
        mismatch is an implementation bug until independently replicated and is
        not a mathematical finding.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it decides the correction). Verify by hand, on
      one instance, that n acts on E(F_p) as multiplication by N, and that
      psi(Q) = k*c reduces to 0 modulo every prime ideal above a divisor of c.
      Two lines of algebra decide whether the seed's log2(c) prediction or this
      record's 0 is the right one for Convention I. If the hand check goes the
      seed's way, this record is refuted at zero cost.
      STAGE 1 (minutes). Toy ordinary curves at 12-24 bits, O maximal, h(O) in
      [4, 40], N prime, cofactor ladder c in {1, 2, 4, 8, 9}, E(F_p) cyclic.
      Build m, factor it into prime ideals, tabulate norms and BSGS costs.
      STAGE 2 (minutes). ARM II, the positive control, run FIRST (STEP 4). The
      instrument must recover log2(c) bits.
      STAGE 3 (minutes). ARM I, the measurement of record (STEP 5).
      STAGE 4 (minutes). The matched k-independent null (STEP 6) and the
      cost-exponent fit of prediction 3.
      Total: well under one CPU-hour with a CAS doing order arithmetic and a
      basic BSGS. No solver beyond BSGS at toy sizes, no certificate, no new
      infrastructure.
    controls:
      - >-
        MATCHED NULL (mandatory): the identical measurement with a
        k-INDEPENDENT surrogate at matched entropy -- a freshly sampled uniform
        point of the same order in place of Q. Arm I's measured mutual
        information must lie inside this null's band. This is the canonical
        control of docs/inventor-protocol.md section 3 and it is what converts
        "we measured 0" into a controlled null rather than an assertion.
      - >-
        PLANTED SIGNAL, RELOCATED TO WHERE IT IS A SIGNAL (mandatory): Arm II at
        c = 8 must return exactly 3 bits. THE SEED'S VERSION OF THIS CONTROL IS
        NOT ADOPTED: applying it to Arm I would declare a correct instrument
        blind. The relocation is this record's control-design correction and it
        must be carried into any experiment contract derived from either record.
      - >-
        NULL OBJECT: m = (1). Every component vector is empty, both arms must
        return 0 bits, and any nonzero reading means the pipeline is reading k
        from somewhere it should not; the run set is VOID.
      - >-
        DECAY CONTROL: the budget B. Recovered bits in Arm I must remain 0 as B
        grows, all the way up to B just below sqrt(N), and must then JUMP to
        log2(N) when n enters the budget. A gradual rise as B grows is the
        artifact tell and means components are being mis-attributed.
      - >-
        Two independent implementations of the component map -- one via subgroup
        membership and group operations, one via explicit ring arithmetic in
        O/m -- must agree elementwise, so an arithmetic bug cannot masquerade as
        an information finding.
      - >-
        SUPERSINGULAR REFUSAL: one supersingular instance; the pipeline must
        refuse rather than emit a number.
    required_metrics:
      - mutual information in bits, Arm I, per rung, with null band
      - mutual information in bits, Arm II, per rung
      - per-prime component cost and its fitted exponent in Norm(q)
      - exact-agreement rate against the algebraic prediction
      - per-instance h(O), |D|, cofactor c, group structure, prime factorisation of m

  controls:
    - >-
      MATCHED NULL: the k-independent surrogate described above. This is the
      matched null the deliverable requires.
    - >-
      DECAY PARAMETER: the cofactor c. Under Convention II the recovered bits
      must decay to exactly 0 as c -> 1; under Convention I they must be 0
      throughout. A signal in Arm I that does NOT decay with c is meaningless
      because it was never supposed to depend on c -- which is precisely why Arm
      I's null must be a k-independent surrogate rather than a c-ladder.
    - >-
      A second decay parameter: h(O). Nothing in this record depends on the
      class, so every measurement must be invariant in h. A dependence on h
      means the instrument is picking up curve data and the measurement is
      confounded.

  confounders:
    - >-
      CONVENTION DRIFT. The single largest confounder, and the one that produced
      the defect being corrected: an implementation that silently promotes P to
      a full generator, or that samples k over Z/(N*c) instead of (Z/N)^*, will
      measure Convention II's answer while reporting Convention I's label. The
      instance convention must be recorded per run and asserted programmatically.
    - >-
      NON-CYCLIC E(F_p). psi(Q) = k*c presumes a Z-cyclic group so that O/m is
      Z/(N*c). For E(F_p) ~= Z/d x Z/(de) the arithmetic is in a product ring and
      the component statement must be restated per factor; scoped out of the
      primary claim and checked per instance.
    - >-
      NON-MAXIMAL ORDERS. m may fail to be coprime to the conductor and the
      prime factorisation of m may not behave; primary claims are scoped to O
      maximal.
    - >-
      SMALL-N ARTIFACTS. At toy sizes N is small enough that sqrt(N) is within
      the measurement budget, so the boundary B = sqrt(N) is reachable. That is
      a feature for the baseline reproduction check and a hazard for the decay
      control; the two must be run at separate B settings and reported
      separately.
    - >-
      MUTUAL-INFORMATION ESTIMATOR BIAS. Plug-in MI estimators are biased upward
      at finite samples, which would manufacture a fake nonzero in Arm I. The
      matched null absorbs the bias by construction (it is estimated the same
      way on the same sample size), and the comparison must be null-relative,
      never against the theoretical 0.

  falsification_conditions:
    - >-
      Arm I measures mutual information above the matched null's band,
      replicated on independent curves. Then publicly computable partial
      information about psi beyond Pohlig-Hellman exists, T2 holds on that
      family, and the executing session FLAGS AND STOPS under P3 rather than
      recording a number. This is the branch the record most wants tested and
      rates least likely.
    - >-
      The STAGE 0 hand check shows psi(Q) is NOT identically 0 mod q for q | c
      under Convention I. Then the seed's log2(c) prediction is right, this
      record's central correction is wrong, and the record is superseded at zero
      compute cost.
    - >-
      Arm II measures 0 bits at c = 8. Instrument blind; run set INVALID, not
      negative; nothing about Arm I may be concluded.
    - >-
      The fitted per-component cost exponent falls materially below 0.5 for any
      prime ideal. A sub-birthday coordinate computation in a cyclic group would
      apply at q = n as well; FLAG AND STOP under P3.
    - >-
      The m = (1) null returns nonzero bits in either arm. Pipeline leaks; every
      measurement VOID.

  interpretation_limits:
    - >-
      THIS IS NOT A LOWER BOUND ON ECDLP AND NOT A PROOF THAT NOTHING LEAKS. It
      measures one explicitly enumerated family of computations (part F) within
      one budget, on toy parameters, and closes exactly that.
    - >-
      A measured 0 is a CONTROLLED NULL only because Arm II and the matched
      surrogate are run alongside it. Quoted without them it is an uncontrolled
      absence and means nothing.
    - >-
      The correction to IDEA-20260811-319a07 is a CONTROL-DESIGN correction plus
      a bit-count correction. It does NOT impugn the seed's algebra, its exact
      sequence, its torsor construction, or its reduction; those stand or fall on
      other grounds (see IDEA-20260811-9402e9 and IDEA-20260811-25ad05).
    - >-
      Scoped to ORDINARY curves over F_p, O maximal, N prime, E(F_p) cyclic, toy
      scale (p up to about 24 bits). Nothing is claimed about supersingular
      curves, non-maximal orders, extension fields, or any deployed curve.
    - >-
      Convention II's log2(c) bits are bits of k', the full-group logarithm, and
      are worth nothing against a cryptographic instance where the challenge is
      k mod N. Nobody may quote "log2(c) bits recovered" as partial progress on
      ECDLP.

  assumptions:
    - >-
      A1. E ordinary over F_p, p > 3, End_{F_p}(E) = O maximal, N prime with
      N || #E(F_p), E(F_p) cyclic as an abelian group, G the unique order-N
      subgroup. Checked per instance.
    - >-
      A2. '[recall-confident, NOT re-verified this session] Lenstra''s CM
      structure theorem, relayed via IDEA-20260811-319a07, giving
      E(F_p) ~= O/m as O-modules. WebSearch and WebFetch failed on every call
      and the crypto-kb index is empty, so no primary source was consulted.'
    - >-
      A3. BSGS in a cyclic group of order M costs Theta(sqrt(M)) group
      operations and sqrt(M) memory (KN-TECH-031), and rho costs
      0.886*sqrt(M) with O(1) memory (KN-TECH-001, KN-TECH-006). These are
      corpus-internal technique records, not external citations.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        NOT A HEURISTIC -- RECORDED SO NO CONDITIONALITY IS IMPORTED. The
        zero-bit claim under Convention I is an EXACT algebraic identity
        (k*c = 0 mod q whenever q divides c), holding for every k without
        exception, and the log2(c) claim under Convention II is the Chinese
        Remainder Theorem. Neither uses any distributional assumption. The only
        statistical content in this record is in the ESTIMATION of mutual
        information from finite samples, which is an instrument property and not
        a mathematical assumption.
      rigorous_support: >-
        Elementary ideal arithmetic in O/m plus CRT over coprime ideals. No
        analytic input whatsoever.
      validation_plan: >-
        Prediction 4 IS the validation: the measured component vector must agree
        exactly with the independently computed algebraic prediction on 100
        percent of instances. An exact identity is checkable rather than sampled,
        and this is recorded so that a reader does not mistake the record's
        statistical machinery for a conditional claim.
      tail_checks: >-
        Not applicable (no distribution). The analogue is the m = (1) null and
        the Arm II positive control, which must exhibit the opposite behaviour.
    - id: HA-2
      statement: >-
        For the ESTIMATOR only: over the sampled instances, the plug-in mutual
        information estimator applied to a k-independent surrogate at matched
        entropy and matched sample size has the same finite-sample bias
        distribution as the estimator applied to the true component vector, so
        the null band is a valid calibration of the estimator's bias. Formally:
        the bias depends only on the alphabet sizes and the sample size, both of
        which are matched by construction.
      rigorous_support: >-
        Pairs the rigorous Miller-Madow bias expansion for the plug-in entropy
        estimator (bias = (A - 1)/(2 n ln 2) + O(n^{-2}) with A the effective
        alphabet size) with the classical assumption that the surrogate's
        empirical distribution behaves like a uniform draw of the same support
        size. This is the same rigorous-bound x classical-distribution
        composition the exemplar profile requires, applied to an instrument
        rather than to an algorithm.
      validation_plan: >-
        Toy scale, and no correspondence shortcut is needed since everything is
        directly computable: for each rung, estimate the MI on 100 independent
        k-independent surrogates at sample sizes 500, 1000, 2000, 4000 and check
        that the estimated bias decays as 1/n with the predicted Miller-Madow
        constant for the observed alphabet size. Record the ladder, the sample
        sizes, and the transfer assumption explicitly: this calibrates the
        estimator at toy alphabet sizes only, and nothing is transferred to
        crypto scale because no crypto-scale measurement is proposed.
      tail_checks: >-
        Compare the largest surrogate MI observed across all rungs against the
        predicted upper quantile of the bias distribution at that sample size. A
        surrogate excursion beyond the predicted quantile means the null band is
        mis-calibrated and Arm I's comparison is void rather than negative.

  reachability_gate: >-
    T5 STATUS: NOT BINDING. Every computation happens on the instance's own
    curve E; no walk to any other curve occurs, so the reachability cost that T5
    prices is zero here. The binding cost is the per-component coordinate cost
    sqrt(Norm(q)), which is a different quantity entirely and is the record's
    own price list.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. ECDLP stays at p^{1/2}. The
      exponents this record states are: 0 (the number of bits of k obtainable
      below budget sqrt(N) under Convention I -- an information count, not a
      time), and 1/2 in Norm(q) for the per-component coordinate cost, which at
      q = n reproduces the rho/BSGS baseline exactly. The foreclosed prize, had
      Arm I measured a nonzero, would have been a Pohlig-Hellman ladder on the
      small primes -- and if such a ladder existed for all small l | N - 1 with
      N - 1 smooth, ECDLP would fall outright, which is precisely the family
      IDEA-20260808-5158fa closes in characteristic zero. The record predicts
      the char-p analogue is closed for the elementary reason in (D).
    memory_exponent: >-
      O(sqrt(Norm(q))) for a BSGS component and O(1) for a rho component; O(log p)
      for everything else. At the boundary q = n this is BSGS's sqrt(N) memory
      or rho's O(1), i.e. exactly the baseline, which is the point of the
      baseline-embedding check. The instrument itself (MI estimation over 2000
      samples) needs O(1) in p.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) (KN-TECH-018), sqrt(6) being baseline calibration and
      never an exponent; Pohlig-Hellman on the smooth part of the group order,
      which is the incumbent for every quantity this record measures in Arm II.
      None is changed.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic algorithm is proposed. What
      IS disclosed: the price list presumes the factorisation of m into prime
      ideals, hence the factorisation of #E(F_p) and knowledge of D -- the
      latter requiring the factorisation of t^2 - 4p, which is subexponential at
      crypto scale. Also disclosed: "computable in O(log p)" for the quotient map
      counts group operations, each of which is a polynomial number of field
      operations.
    tradeoff_note: >-
      Per component the tradeoff is the standard one: BSGS at
      sqrt(Norm(q)) time and memory versus rho at 0.886*sqrt(Norm(q)) time and
      O(1) memory, interpolated by van Oorschot-Wiener at sqrt(Norm(q)^3/w) with
      memory w. Since the record's conclusion is that the affordable components
      are worth zero bits regardless, NO memory setting changes the conclusion --
      the tradeoff is stated for completeness and to make clear that no
      memory-rich regime rescues the partial-information route.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after, O(1) memory in both cases.
    The delta is a correction and a sharpening: it replaces the seed's D4 bit
    count (log2(c) bits of k) with the correct one for the campaign's own
    instance convention (0 bits, every c), relocates the seed's planted-signal
    control to the arm where it discriminates instead of the arm where it would
    void a correct run set, and converts D3's binary "one non-computable arrow"
    into a graded price list localised at a choice of basis rather than at a map.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises: parallel rho with
    distinguished points (0.886*sqrt(N), O(1) memory, KN-TECH-001/006);
    automorphism-discounted rho (KN-TECH-018); BSGS (sqrt(N) time and memory,
    KN-TECH-031); Pollard kangaroo on an interval of width W (about 2*sqrt(W));
    van Oorschot-Wiener at sqrt(N^3/w) with memory w; and, for every quantity
    measured in Arm II, plain Pohlig-Hellman, which obtains the identical
    log2(c) bits in O(sum sqrt(ell)) group operations with no ideal arithmetic
    at all. This record mounts no attack and is dominated by every row on time;
    in Arm II it is additionally dominated by a first-year textbook method on
    the very quantity it measures. It consumes no oracle queries.
    dominated_by is NOT null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that the STAGE 0 hand check confirms psi(Q) = k*c is 0 modulo every
    prime ideal dividing c under Convention I -- it is two lines of arithmetic.
    0.90 that Arm I measures 0 within the null band on every rung. 0.85 that Arm
    II measures exactly log2(c), the residual risk being estimator bias at c = 9
    and unit effects at D_0 = -3, -4. 0.80 that the per-component cost exponent
    fits 0.50 within band at toy sizes, where asymptotics are weak. Below 0.02
    that Arm I shows a genuine nonzero -- and that branch is the only one here
    that would move anything, which is why Arm II runs first and why the
    stopping rule is written before the measurement.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base, phi-stable or otherwise, appears anywhere;
    H-STR-002 and DEFER-BATCH009-001 are untouched in both directions.
    P3: FLAGGED AS ADJACENT AND NOT TRIGGERING. Two branches would, if they
    fired, bear on the automorphism-discounted rho baseline: a nonzero Arm I
    measurement (partial information about k below sqrt(N) budget), and a fitted
    per-component cost exponent below 0.5 (a sub-birthday coordinate
    computation, which applied at q = n would beat rho). Per the standing
    constraint both are written as STOPPING CONDITIONS and escalation triggers.
    The record states no excess, contains no candidate that exceeds the
    baseline, and predicts both branches do not fire. If either fires in an
    experiment, the executing session stops and hands it to the Coordinator
    rather than recording a number.

