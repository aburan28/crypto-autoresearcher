idea:
  id: IDEA-20260926-89886c
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE SAT/UNSAT ASYMMETRY LAW AT m = 3: a sound early-abort mutant-closure
    filter (W_3, then W_4) on the chained S_3 descent at n = 17, l = 6, priced
    per attempt as ops-to-first-1 on unsatisfiable attempts against
    ops-to-fixpoint on satisfiable ones and against the 2^{(m-1)l} enumeration
    oracle, with the miss rate and the crossover l* stated before any run
  class: algorithm

  claim: >-
    CEILING FIRST. This bears on arity m = 3 and on the chained regime. On
    ECC2K-130 the product law (KN-FIND-aa2efc, EV-ICPERF-10c5fc, unreviewed)
    puts the m = 3 free-oracle floor at 2^68.58 against rho's 2^60.81, so no
    per-attempt gain at m = 3 reaches the challenge; the record says so and does
    not pretend otherwise. What it buys is the missing cost law for the only
    sub-enumeration refutation this program has measured: at m = 2 the degree-4
    mutant closure W_4 refutes every unsatisfiable subgroup-target S_3 descent
    at n = 17 (386/386, KN-FIND-5a8d3e) and n = 19 (400/400, KN-FIND-c3a917),
    always at its first iteration, but "its cost is unmeasured at any m >= 3"
    (KN-FIND-c3a917 boundary 6) and only a W-type filter is eligible for an
    m = 3 pricing design (DEC-20260926-901ea1 n19_dr9_ruling). Representation
    class R1 (Boolean coordinates of x_1, x_2, x_3 in a basis of V and of the
    chain node u in the field basis); attack stage: the per-attempt
    decomposition solve.

    THE OBJECT. Chained S_3 at m = 3 (KN-TECH-b18366): S_3(x_1, x_2, u) = 0 and
    S_3(u, x_3, x_R) = 0 with x_i in V = {deg < 6} and u in F_{2^17}; after Weil
    descent with field equations, N = 3l + n = 35 Boolean variables, 17 cubic
    and 17 quadratic equations (the first S_3 carries x_1 x_2 u; the second is
    quadratic once x_R is fixed). Re-derived sizes: M_3 is 629 x 7176 and M_4 is
    11339 x 59536 (rows 17 x 36 + 17 x 631; columns sum_{i <= 4} C(35, i)),
    agreeing with IDEA-20260923-5d0b8e's dense figure of 80.5 MiB. W_D is the
    least subspace of B_{<= D} containing M_D and closed under g -> v_j g for
    deg g <= D - 1, exactly as EXP-CERTBIN-e94b27 defines it.

    THE ASYMMETRY, STATED AS TWO QUANTITIES. On an unsatisfiable attempt the
    closure may stop at the first iteration whose echelon contains the constant
    row (ops_to_1); on a satisfiable attempt 1 is never reached (Proposition S
    of IDEA-20260923-5d0b8e) and the closure runs to its fixpoint
    (ops_to_fix). The per-attempt filter cost is therefore
    C_unsat = ops_to_1 on the refuted fraction r_D, C_unsat = ops_to_fix +
    C_enum on the missed fraction 1 - r_D (the fallback is the enumeration
    oracle), and C_sat = ops_to_fix + C_enum (solutions are extracted by
    enumeration in this design). The enumeration oracle at m = 3 chained costs
    about 2^{(m-1) l} = 2^12 pairs (x_1, x_2), each two quadratic root-findings
    (u from the first S_3, x_3 from the second) with a linear membership test,
    about 2^13 root-findings per attempt at l = 6.

    THE THREE READINGS, DECIDED BY PREDEFINED COUNTS. E-PERSIST-3: the tensor-
    neighbourhood refutation of KN-FIND-c3a917 survives the chain node u
    (whose products x_1 u and x_2 u DO reduce modulo f, unlike x_1 x_2 on the
    diagonal), and W_4 refutes >= 90% of unsatisfiable attempts at its first
    iteration. E-FAIL-3: the reduction modulo f destroys the convolution
    structure the m = 2 refutation rests on, and W_4 refutes <= 10%, as the
    same-support nulls do; the filter is then void at m = 3 and the m = 2
    result is a diagonal artifact in the sense of KN-OPEN-3c8f51 item (B).
    MIXED: anything between, reported with the exact CP95 interval. A fourth,
    cheaper reading is tested first: E-W3, W_3 already refutes >= 50%
    (KN-FIND-c3a917 records W_3 refuting 3 of 3 S_3 systems at n = 19, m = 2,
    a located observation, not a rate).

    THE COST LAW AND THE CROSSOVER. At the toy cell the filter LOSES to
    enumeration by orders of magnitude and the record predicts so: a bit-packed
    echelon of M_4 costs on the order of rows x rank x words, about 1.1 x 10^4
    x 1.1 x 10^4 x 930 = 1.2 x 10^11 word operations (estimate), against about
    2^13 root-findings of a few hundred field operations each, about 10^6.
    The content is the SHAPE of the two laws, not the toy verdict: enumeration
    is exponential in (m - 1) l while a fixed-degree closure is polynomial in
    N = m l + (m - 2) n, so along Semaev's diagonal n = 2l - 1 there is a
    crossover l* at which the filter becomes cheaper than enumeration PROVIDED
    r_D stays near 1 there. Stage 0 computes l* from the measured per-cell
    constants and the Macaulay size formulas, and states it as an extrapolation
    with its transfer assumption named (H2). On ECC2K-130 at m = 3, l = 44,
    N = 263 the D = 4 Macaulay matrix has about 4.6 x 10^6 rows and 2 x 10^8
    columns (arithmetic on the formulas; an estimate), so even a free crossover
    cannot cross the product law; the number belongs to the m >= 4 rows, where
    the filter is the only sub-enumeration route this program has any
    measurement for, and where it is priced by a separate design if
    E-PERSIST-3 holds.

  mechanism: >-
    OBJECT FRAME. Representation R1 as above. The relation-search object is
    unchanged from ordinary index calculus (the relation vector over the factor
    base, Class I partial action under translation by factor-base elements,
    IDEA-20260806-c5d183); this record adds no group-side object and makes no
    group-structure claim. The solver-side tracked object is the degree-D
    truncated closure W_D(x_R) of the descended ideal I_R. Its operation set
    Sigma is the D-bounded ring action of B (multiplication by variables and
    F_2-linear combination inside B_{<= D}) together with re-targeting
    (x_R -> a fresh x_R). TRICHOTOMY: for the solver-side object the placement
    is COORDINATE-DEPENDENT in the weak sense only: by the invariance argument
    of IDEA-20260926-917981 (this batch) W_D depends on the SET V and on x_R,
    not on the basis used to descend; it is not a projection of the group and
    has no translation action to survive, so it is neither partial-action nor
    branching on the group. LOSSY-PROJECTION TEST against Sigma: W_D discards
    every consequence of I_R of degree above D; the discard is Sigma-compatible
    because W_D is by definition closed under the D-bounded action; it is
    genuinely lossy in this representation because the plain truncation M_4 is
    strictly smaller than W_4 on the U62 instances (62 refutations recovered
    only by the mutant step, KN-FIND-5a8d3e) and W_4 itself is strictly smaller
    than I_R cap B_{<= 4} wherever an unsatisfiable attempt is not refuted. THE
    ONE OPEN NUMBER is the pair (miss rate 1 - r_D, ops ratio ops_to_1 /
    ops_to_fix) at m = 3, and it is measured, not asserted.
    WHY THE ASYMMETRY IS THE LEVER. Per attempt the expected relation count is
    tiny in the regime that matters (about 0.35 decompositions per target at
    this cell, about 2^{-16} at ECC2K-130's m = 3 row by the product law's own
    arithmetic), so the mean per-attempt cost is C_unsat up to a vanishing
    correction. Any filter whose ops_to_1 is far below ops_to_fix, and whose
    miss rate is small, moves the constant in front of the oracle column; a
    filter that refutes only at its fixpoint buys nothing over a full solve.
    WHY IT MIGHT FAIL AT m = 3. KN-FIND-c3a917 locates the m = 2 refutation in
    the neighbourhood of the convolution tensor of x_1 x_2 in the polynomial
    basis, where products of two degree-< l polynomials never reduce modulo f.
    In the chain the node u is a full field element, so x_1 u and x_2 u reduce
    modulo f and the quadratic part of the first S_3 is a different tensor; the
    second S_3 has u x_3 with the same feature. The record does not know which
    way this goes, and that is the point of the measurement.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2):
    F2 (factor-base decomposition) is the family; the factor base V = {deg < 6}
    is the bounded-degree linear subspace inside KN-OPEN-020's scoped-out class
    and this record does not try to escape it. What is added beyond F2 as
    filed: the two-quantity per-attempt cost law with the enumeration fallback
    charged, at the first m >= 3 cell.

