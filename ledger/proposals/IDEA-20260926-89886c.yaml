  assumptions:
    - >-
      Satisfiability of every attempt is decided by an exact oracle (the
      m = 3 enumeration oracle, or oracle B on the 2^35 assignments only where
      affordable, which it is not at N = 35; the enumeration oracle is the
      ground truth here), never by a closure.
    - >-
      The polynomial basis and V = {deg < 6} are the Stage-1 conventions; the
      chain node u is unconstrained over F_{2^17} (KN-TECH-b18366 condition 3).
      Targets are subgroup targets in the odd-order part, drawn by the Stage-1
      rule of EXP-CERTBIN-4e92d7 on the RC-1 curve.
    - >-
      The RC-1 instruments are pure Python with numpy under a 3 GB cap; the
      W_4 product stack at N = 35 (up to 35 x 7176 rows of 931 words, about
      1.9 GB bit-packed) is reduced in chunks against the current echelon. If
      chunking is not implemented the W_4 rung is declared UNDETERMINED(budget)
      per instance, never "not refuted".
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; V inside KN-OPEN-020's scoped-out
      class; nothing here escapes it.

  proof_search_map:
    bottleneck: >-
      Whether a degree-bounded mutant closure refutes unsatisfiable m = 3
      chained attempts at a rate near 1 and at an ops count far below its own
      fixpoint, so that the per-attempt oracle cost at m >= 3 is governed by a
      polynomial-in-N law rather than by 2^{(m-1)l} enumeration.
    baseline_embedding:
      parameter_slice: >-
        The m = 2 diagonal cells (RC-1 at n = 17 and the n = 19 cell) are the
        exact slice where W_4 refutes 386/386 and 400/400 at iteration 1; the
        instrument must reproduce those archived outcomes on 10 archived
        systems before any m = 3 number is read (C-BASE).
      reproduction_check: >-
        Frozen regression: rerun closure.py at (nv, D, neq) = (18, 4, 17) on 10
        archived U62 instances and 5 S62 instances of RUN-CERTBIN-c417e0 and
        reproduce the archived W_4 labels, iteration counts and dimensions
        exactly; any mismatch is an instrument defect and nothing at m = 3 is
        read.
    observation_collision:
      observable: >-
        Per attempt: the exact sat flag and solution count s, the W_3 and W_4
        labels with the first iteration containing 1, ops_to_1 and ops_to_fix
        in GF(2) row operations, and the degree-disciplined certificate.
      distinct_preimage_search: >-
        A high refutation rate could come from (i) the descended S_3 structure,
        (ii) the extra linear falls that any system with 17 quadratics in the
        (u, x_3) block acquires, or (iii) an instrument that reaches 1 on
        satisfiable systems. (iii) is excluded by Proposition S plus the
        satisfiable control (any refutation there voids the run). (ii) is
        separated by the same-support null (uniform coefficients on the union
        support of the 34 equations, redrawn per target): if the null is
        refuted at the same rate the effect is Boolean-shape generic. (i) is
        what remains.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The per-attempt cost split into (refuted at W_3, refuted at W_4,
          missed) x (ops_to_1, ops_to_fix, C_enum), charged over disjoint
          outcome classes so the mean per-attempt cost is a sum of measured
          products.
        predicted_gain: >-
          None at the toy cell (enumeration wins by an estimated 10^5); the
          measured constants and the polynomial size law give l* by
          extrapolation under H2, which is the deliverable.
      - transform: observable_fiber
        proposed_object: >-
          Hold the W_4 label fixed and vary the chain node encoding: u
          unconstrained (the object) against u restricted to a random
          17-dimensional relabelling of the field basis (a change of
          coordinates, predicted no effect by IDEA-20260926-917981's invariance)
          and against the same-support null (predicted large effect).
        predicted_gain: Separates structure from shape at zero extra modelling cost.
    quantifier_order: >-
      Soundness: FORALL attempts, FORALL D, 1 in W_D implies unsatisfiable
      (Proposition S, exact). The empirical claim: FOR the cell (n = 17,
      f = t^17 + t^3 + 1, m = 3 chained, l = 6, RC-1 curve, subgroup targets),
      the refuted fraction r_3, r_4 and the ops ratios are as measured with
      CP95 intervals; EXISTS-or-not a cell on the diagonal ladder where the
      measured law crosses enumeration is an extrapolation under H2, never a
      measured fact at n = 131.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the named cell, W_3 refutes r_3 and W_4 refutes r_4 of the
        unsatisfiable chained m = 3 attempts, at ops_to_1 / ops_to_fix = rho
        (measured), with 0 refuted satisfiable controls and null rates as
        measured; the enumeration oracle costs about 2^13 root-findings; the
        crossover l* under H2 is (computed)." It certifies nothing about F4
        step degree, about m >= 4, about any n >= 19, or about any cost on
        ECC2K-130.
      nearby_object_control: >-
        The same-support null at m = 3 (the object where the desired
        conclusion is expected to fail: nulls were 0/62 and 0/200 at m = 2)
        and, as the proves-too-much object, the satisfiable planted arm (where
        refutation must fail by theorem).
    proof_obligations:
      - claim: Proposition S applies to the chained Boolean system with field equations (it is radical and zero-dimensional over F_2).
        responsibility: correctness
      - claim: M_3 is 629 x 7176 and M_4 is 11339 x 59536 at N = 35 (C-FIX analogue).
        responsibility: size
      - claim: The enumeration oracle's solution set equals the set of Boolean solutions found by any closure-side extraction on 20 satisfiable instances.
        responsibility: correctness
      - claim: The per-attempt mean cost is the outcome-weighted sum stated in claim, with every term measured in one unit (GF(2) row operations), the oracle's field operations converted by a measured constant.
        responsibility: runtime
      - claim: The crossover l* is an extrapolation under H2 and is labelled so wherever it appears.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: r_4 = verified W_4 refutations among unsatisfiable chained m = 3 attempts at the cell (CP95 exact)
      direction: different
      minimum_effect: >-
        E-PERSIST-3 iff r_4 >= 0.90; E-FAIL-3 iff r_4 <= 0.10; MIXED otherwise.
        No direction is preferred; the record's honest prior is about 0.45 on
        E-PERSIST-3 because the chain node's products reduce modulo f.
    - metric: r_3 = verified W_3 refutations among the same attempts
      direction: different
      minimum_effect: >-
        E-W3 iff r_3 >= 0.50. r_3 <= r_4 is forced by monotonicity (W_3 is
        contained in W_4 after multiplication by 1), an instrument check.
    - metric: first iteration containing 1, per refuted instance
      direction: lower
      minimum_effect: >-
        If E-PERSIST-3, modal value 1 as at m = 2; a modal value >= 2 is a
        different mechanism and is reported as such.
    - metric: ops_to_1 / ops_to_fix on refuted instances (GF(2) row operations, dimensionless)
      direction: lower
      minimum_effect: >-
        Below 0.5 for the filter to be worth an early abort at all; above 0.9
        means refutation costs a full closure and the asymmetry is empty at
        this cell.
    - metric: refuted satisfiable controls (count)
      direction: same
      minimum_effect: 'exactly 0 by Proposition S; any refutation voids the instrument.'
    - metric: same-support null refutation rate at W_4 (CP95)
      direction: lower
      minimum_effect: >-
        S_3-ABOVE-NULL iff the CP95 lower bound of r_4 exceeds the null's CP95
        upper bound; NOT DISTINGUISHED otherwise. A null refuted like the
        object is the Boolean-shape-generic reading.
    - metric: l* (diagonal crossover, extrapolated under H2 from the measured constants and the Macaulay size law)
      direction: different
      minimum_effect: >-
        Reported with its assumptions; no value predicted. Labelled estimate.

  minimal_test:
    design: >-
      CELL. n = 17, f = t^17 + t^3 + 1, RC-1 curve A = 97044, B = 126251,
      #E = 4 x 32603, m = 3 chained (KN-TECH-b18366), l = 6, polynomial
      V = {deg < 6}, N = 35 Boolean variables. Targets: 200 subgroup targets
      x_R in the order-32603 subgroup drawn by the Stage-1 rule from a fresh
      seed stream, kept until 100 unsatisfiable and 30 satisfiable attempts are
      collected (expected P_sat about 0.30). Secondary cell l = 5 (N = 32,
      P_sat about 0.045), 100 unsatisfiable attempts, to sit closer to the
      unsat-dominated regime. Koblitz sibling arm (BRIEF section 3): the same
      procedure on y^2 + xy = x^3 + x^2 + 1 over the same field, whose order
      the session hand-derived as 2 x 65587 from the Lucas recurrence
      (t(E_1/F_2) = +1; 65587 checked prime by trial division to 251; agrees
      with the r = 65587 quoted in KN-OPEN-095df5) and which the run re-counts
      before use; the ordinary RC-1 curve is its control.
      INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/closure.py (generic in
      nv, D, neq), macaulay.py extended to descend the two-equation chain,
      oracles_rc1.py generalised to the m = 3 enumeration oracle (loop over
      (x_1, x_2) in V^2, two quadratic root-findings, membership test), the
      separate-process verifier for every counted refutation. No external
      solver; nothing is `missing`.
      PROCEDURE. (0) Zero-run arithmetic: C-FIX sizes; the semi-regular
      reference series (1+z)^35 / ((1+z^2)^17 (1+z^3)^17) and its D_reg;
      the enumeration op count; the size law along the diagonal. (1) C-BASE
      regression on archived m = 2 systems. (2) Enumeration oracle on every
      attempt: exact sat flag and s. (3) W_3 on every attempt (seconds each,
      estimate). (4) M_4 and W_4 on the first 40 unsatisfiable, 15 satisfiable
      and 15 null attempts (minutes to an hour each, estimate; chunked
      products). (5) Certificates verified by the separate process; ops
      counters logged per elimination. (6) Aggregation with exact CP95.
      SEEDS. One PCG64 stream per arm, recorded; instance sets fixed by rule
      before any closure runs.
      METRICS (units). r_3, r_4 (fractions with CP95); first iteration (count);
      ops_to_1, ops_to_fix (GF(2) 64-bit-word XOR operations); C_enum (field
      multiplications, and the measured conversion to word operations on this
      host); wall time and peak RSS (secondary); certificate sizes.
      CONTROLS. Same-support null (uniform coefficients on the union support of
      the 34 descended equations, redrawn per target, one unsatisfiable draw
      kept per slot); satisfiable planted arm (x_R = x(P_1 + P_2 + P_3),
      P_i in the factor base); random-x_R arm (x_R uniform in F_{2^17}, not
      necessarily an x-coordinate) as the curve-blindness check; the m = 2
      archived regression (C-BASE). No relabelled Z/NZ control: no
      group-structure claim is made.
      OUTCOME TABLE. POSITIVE (E-PERSIST-3 with ops ratio < 0.5 and null NOT
      refuted): the filter's per-attempt law at m = 3 is polynomial in N with
      measured constants; l* is computed and handed to an m >= 4 pricing design.
      NEGATIVE (E-FAIL-3, or null refuted at the object's rate, or ops ratio
      >= 0.9): the W-type filter is void at m = 3 on this cell; the m = 2 result
      is recorded as diagonal-specific pending KN-OPEN-3c8f51 item (A); no
      m >= 4 design is seeded. ARTIFACT (any refuted satisfiable control, any
      failed certificate, C-BASE mismatch, or W_4 UNDETERMINED(budget) on more
      than 20% of instances): the run is void and says nothing about m = 3.
      FALSIFICATION THRESHOLD, FIXED NOW. E-PERSIST-3 is falsified iff
      r_4 <= 0.50 on the primary cell; E-FAIL-3 is falsified iff r_4 >= 0.50.
      COST (estimate, order of magnitude): implementation medium (chain
      descent, m = 3 oracle, chunked products, about 400 lines on the existing
      modules); compute about 10^1 to 10^2 CPU-hours, dominated by W_4 on 70
      instances.
    controls:
      - Same-support null family at m = 3, per target, identical closure code path (hash recorded).
      - Satisfiable planted control; any refutation voids the instrument (Proposition S).
      - Random-x_R control for curve-blindness of the rate.
      - C-BASE regression on 15 archived RC-1 m = 2 systems (labels, iterations, dimensions exact).
      - Enumeration oracle as the sole satisfiability ground truth; every counted refutation certified by the separate-process verifier.
    required_metrics:
      - r_3 and r_4 with exact CP95, per arm and cell
      - first iteration containing 1, distribution per arm
      - ops_to_1 and ops_to_fix per instance (GF(2) word operations) and their ratio
      - C_enum per attempt (field operations) and the host conversion constant
      - null and satisfiable-control counts; certificate verification counts
      - the Stage-0 size law and the H2 crossover l*, labelled extrapolation

  falsification_conditions:
    - 'E-PERSIST-3 falsified iff r_4 <= 0.50 (primary cell, verified refutations only).'
    - 'E-FAIL-3 falsified iff r_4 >= 0.50.'
    - 'The asymmetry reading is falsified at this cell iff ops_to_1 / ops_to_fix >= 0.9 on refuted instances.'
    - 'S_3-ABOVE-NULL is falsified iff the null CP95 upper bound reaches the object CP95 lower bound.'
    - >-
      Instrument falsified (run void) iff any satisfiable control is refuted,
      any submitted certificate fails, or C-BASE mismatches; a void run is not
      evidence about m = 3 (AGENTS.md rule 3).

  confounders:
    - >-
      P_sat about 0.30 at l = 6 is not the unsat-dominated regime; the
      asymmetry law is measured per outcome class, so the mix does not bias
      the per-class constants, but the MEAN per-attempt cost at this cell is
      not the mean at ECC2K-130's mix. The l = 5 cell narrows this.
    - >-
      Ops counters in numpy row operations are host-independent but not
      engine-independent; a compiled elimination changes the constants, not
      the size law.
    - >-
      The chain topology (KN-TECH-b18366 versus Karabina's) and the choice of
      which S_3 carries x_R change the tensor; one topology is measured.
    - >-
      Lower-chain unsatisfiability (KN-TECH-b18366 condition 1) is assumed by
      the m = 3 oracle; attempts with an m = 2 decomposition are labelled and
      excluded from the primary counts.
    - >-
      One curve, one V, one n; the h = 2 Koblitz sibling arm changes the curve
      and the cofactor together.

  interpretation_limits:
    - Toy tier. n = 17, m = 3 chained, one V, two curves. Nothing about F4 step degree, Semaev's Assumption 1, m >= 4, or any n >= 19.
    - >-
      A W_D non-refutation is a degree-D statement; it is never a hardness
      claim. A refutation rate is not a solve.
    - >-
      No exponent moves. The record's ECC2K-130 bearing is confined to the
      m >= 4 rows of the product-law table and only through a later design.
    - KN-OPEN-020 class of V is the scoped-out linear-subspace class; not escaped.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Outcome-weighted cost law.) At fixed (m, l, n, D) the per-attempt cost
        of the filter-plus-fallback pipeline is the expectation over the four
        outcome classes (refuted-at-W_3, refuted-at-W_4, missed, satisfiable)
        of the measured per-class costs, with class probabilities estimated by
        the sampled rates.
      rigorous_support: >-
        Exact as bookkeeping once the classes are exhaustive and disjoint,
        which they are by construction; imitates nothing beyond the law of
        total expectation. The heuristic content is only that the sampled
        rates estimate the population rates (binomial, CP95).
      validation_plan: >-
        SAMPLE 100 unsatisfiable and 30 satisfiable attempts at l = 6 (100 at
        l = 5); COMPARE per-class ops distributions against their means;
        TAIL: the maximum ops_to_fix and the maximum certificate size are
        reported beside the means, not averaged away. TRANSFER: none.
    - id: H2
      statement: >-
        (Size-law transfer along the diagonal.) The refuted fraction r_4 and
        the ops ratio measured at (n, l) = (17, 6) persist along n = 2l - 1,
        m = 3, so that the crossover l* against 2^{2l} enumeration is governed
        by the polynomial Macaulay size law alone.
      rigorous_support: >-
        None rigorous. The size law (rows and columns as binomial sums in N)
        is exact; the persistence of r_4 imitates the generic-system
        assumption that a fixed-degree refutation rate is scale-free, which
        KN-FIND-c3a917 section 3 already shows is FALSE for plain M_4 between
        n = 17 and n = 19 (0.839 to 0) and true for W_4 (386/386 to 400/400)
        at m = 2 only. It is the assumption most likely to fail.
      validation_plan: >-
        SAMPLE the same measurement at (n, l) = (19, 7) with 50 attempts if
        the primary cell returns E-PERSIST-3; COMPARE r_4 and the ops ratio
        across the two cells; TAIL: any drop of r_4 below 0.5 at n = 19 refutes
        H2 at the tested scale. Extrapolation to n = 131 is stated as
        extrapolation everywhere it appears.

  heuristic_note: >-
    Soundness (Proposition S) and the matrix sizes are exact. H1 is
    bookkeeping; H2 carries the only transfer and is labelled so.

  target_complexity:
    time_exponent: >-
      NO EXPONENT ON THE ECDLP IS CLAIMED OR MOVED. Per attempt at m = 3 the
      filter replaces 2^{(m-1) l} root-findings by a cost polynomial in
      N = m l + (m - 2) n at fixed D (rows x rank x words, about N^{3D-2}
      word operations at D = 4, an estimate of the size law) on the refuted
      fraction, plus the fallback on the rest; the crossover l* is an
      extrapolation under H2. On ECC2K-130 the m = 3 row is closed by the
      product law regardless.
    memory_exponent: >-
      Bit-packed Macaulay and product stacks, polynomial in N; 84 MB for M_4
      and up to about 1.9 GB for the W_4 product stack at N = 35 (chunked),
      against O(1) memory for enumeration. Disclosed as a real cost.
    best_known: >-
      Parallel Pollard rho with negation and the 131-fold Frobenius class
      reduction, about 2^60.81 iterations on ECC2K-130 (KN-FIND-aa2efc,
      convention CORR-20260922-81aeab); at the toy cell, rho at about 160
      group operations for q = 32603 and the enumeration oracle at about 2^13
      root-findings per attempt.
    hidden_overhead: >-
      The constants of a pure-Python elimination, disclosed as host and engine
      constants; the chunking overhead of the W_4 product stack; the fallback
      enumeration on every satisfiable attempt (solutions are not extracted
      from the closure in this design).
    tradeoff_note: >-
      Attempts are embarrassingly parallel; the filter trades memory
      (polynomial in N) for time against O(1)-memory enumeration; no
      van Oorschot-Wiener style interpolation applies.

  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Estimate. About 400 lines on the existing RC-1 modules (chain descent,
      m = 3 oracle, chunked product reduction, ops counters). W_3 on 300
      attempts in minutes; M_4 in minutes per instance; W_4 up to an hour per
      instance on 70 instances; total on the order of 10^1 to 10^2 CPU-hours
      on one core under 3 GB. Not a measurement.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 and prime-degree binary siblings; per-attempt decomposition cost at m = 3 (RQ-CERTBIN-836ce2)
    prior_best: Rho at 2^60.81 on ECC2K-130; enumeration at 2^{(m-1)l} root-findings per attempt; no measured m >= 3 refutation cost in this program
    time_exponent: 'per attempt: polynomial in N at fixed D on the refuted fraction versus 2^{(m-1)l}; total ECDLP cost unchanged and closed at m = 3 by the product law'
    memory_exponent: polynomial in N (bit-packed Macaulay), disclosed
    hidden_cofactor: engine and host constants; fallback enumeration on satisfiable attempts
    claim_kind: per_attempt_cost_law_measurement

  dominated_by: >-
    Checked row by row. At the toy cell: the enumeration oracle (about 2^13
    root-findings, O(1) memory) dominates the filter on time by an estimated
    five orders of magnitude and on memory outright; parallel rho (about 160
    operations at q = 32603) dominates the DLP. At ECC2K-130: rho at 2^60.81
    dominates every m = 3 oracle by the product law (free-oracle floor
    2^68.58), so no row is claimed. The record dominates nothing; it supplies a
    cost law. n/a (no attack claimed) is the honest Pareto answer.

  sota_delta:
    time: >-
      Zero on every ECDLP axis. Against the program's prior state: the first
      measured W-type refutation rate and ops asymmetry at any m >= 3, and the
      first per-attempt law with the fallback charged.
    memory: Zero on the ECDLP; the filter's polynomial memory is disclosed above.
    data_queries: Not applicable.

