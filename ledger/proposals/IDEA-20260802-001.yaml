idea:
  id: IDEA-20260802-001
  question_id: RQ-ECDLP-002
  title: >-
    Saddle-point smoothness reference - repairing the ABSOLUTE reference that every
    conditional exponent statement in the Gaudry-Semaev lane multiplies by, and
    deciding whether the measured Dickman departure is a property of the reference
    or of the sampler
  class: measurement
  claim: >-
    RUN-LPF-001-calib measured a KNOWN-UNIFORM integer arm departing UPWARD from the
    asymptotic Dickman reference rho(u) by ratios R_unif(u) = 1.1702, 1.4522, 2.0521,
    4.5709, 11.5937 at u_target 2,3,4,5,6 for the bits-16 cell (D = 2**32) and
    1.1279, 1.3055, 1.6443, 2.4453, 5.0386 at the bits-20 cell (D = 2**40), each value
    independently recomputed by a second quadrature scheme in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml.
    THIS RECORD CLAIMS THOSE DEPARTURES ARE A PROPERTY OF THE ASYMPTOTIC REFERENCE AT
    FINITE y AND NOT OF THE SAMPLER OR THE ENCODING. Concretely - substituting the
    Hildebrand-Tenenbaum saddle-point estimate for Psi(x, y), with alpha the solution
    of sum_{p <= y} log p / (p**alpha - 1) = log x, in place of x * rho(u), reduces
    max_u |ln R(u)| by a factor of at least 3 at BOTH cells (the bits-16 reference
    figure to beat is |ln 11.5937| = 2.4506, so the target is max_u |ln R_sp(u)| <= 0.82),
    and brings all five rungs at both cells inside the frozen constant-factor band
    [1/8, 8], restoring LIMB B decidability from 9 of 10 rungs to 10 of 10. IF IT DOES
    NOT, the departure is not a known finite-y reference effect and the calibration's
    uniform sampler, its bitlength matching, or its u-parameterization is implicated -
    which is an instrument finding of equal decision value and, unlike the first
    branch, one that would put a question mark over the null arm of every LPF reading.
  mechanism: >-
    Hildebrand's theorem gives Psi(x, y) = x * rho(u) * (1 + O(log(u+1) / log y))
    uniformly for log x < y <= x**(1/3), with u = log x / log y. The relative error
    term is NOT small at this campaign's toy parameters - at the bits-16 cell and
    u = 6 the smoothness bound is y = D**(1/6) = 2**(32/6) which is about 40, so
    log y is about 3.7 and log(u+1)/log y is about 0.53, i.e. the asymptotic reference
    is being used at the exact edge of its stated range with an error term of order
    unity. The Hildebrand-Tenenbaum saddle-point formula does not degrade in that
    regime because it never passes to the u -> infinity asymptotic - it evaluates the
    Dirichlet-series saddle directly at the actual y. THE POINT IS NOT ACCURACY FOR ITS
    OWN SAKE. Every conditional cost statement this program has entertained in the
    Gaudry-Semaev lane is an instance of the target profile's per-attempt-cost times
    inverse-success-probability bookkeeping, and the inverse success probability IS
    rho(u)**-1. A reference whose error grows from 17 percent to 1059 percent across
    u in [2, 6] mis-states that factor by an amount that grows exactly along the axis
    the parameter optimization runs on, so the argmin over B - and therefore any
    conditional exponent read off that optimization - is computed against a curve that
    is measurably the wrong curve. This record does not claim the correction changes
    an exponent; it claims the correction is a precondition for any exponent statement
    in this lane being computed at all.
    THE DESIGN DISCRIMINATES THREE EXPLANATIONS, NOT TWO.
    (a) REFERENCE EFFECT - the saddle-point estimate absorbs the departure at every
    rung. Then the campaign's frozen [1/8, 8] band was being applied against a
    reference that a correct null provably could not satisfy at u = 6, LIMB B becomes
    decidable everywhere, and the correction is carried into every successor contract.
    (b) SAMPLER OR SPECIFICATION EFFECT - the saddle-point estimate leaves a residual
    of the same order. Then the departure is not explained by finite-y analysis and
    the uniform arm itself is under suspicion; the exact-Psi control below localizes it.
    (c) PARTIAL - absorbed at low u, residual at high u. Then the decidable-rung set is
    reported as measured and the residual is a named open item rather than a result.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/decisions
    - ledger/hypotheses
    - knowledge/literature
    - knowledge/techniques
    grep_results:
    - >-
      'saddle|Hildebrand|Tenenbaum' returns no ledger proposal, hypothesis, experiment
      contract or reading rule in this repository. The EXP-LPF-001 contract, RR-LPF-1
      and RR-LPF-2 use the asymptotic Dickman rho(u) as the sole absolute reference.
    - >-
      Matches exist in knowledge/literature under generic smoothness tags but none is
      bound to the EXP-LPF-001 reference choice and none was consulted when the band
      was frozen, as far as the frozen artifacts record.
    - >-
      IDEA-20260731-009 concerns a crypto-size first-fall-degree correspondence and is
      a different object; it does not touch the smoothness reference.
    literature_verified:
    - >-
      Hildebrand-Tenenbaum saddle-point method for Psi(x, y) with alpha = alpha(x, y)
      defined by sum_{p < y} (log p)/(p**alpha - 1) = log x - CONFIRMED as the standard
      statement by web search on 2026-08-02 against multiple secondary sources
      including arXiv 1705.02442 (explicit estimates for the distribution of numbers
      free of large prime factors). PRIMARY SOURCE NOT YET READ IN THIS SESSION; the
      formula must be transcribed from the primary paper before any implementation is
      frozen, and a KN-LIT entry is owed.
    - >-
      Psi(x, y) = x rho(u) (1 + O(log(u+1)/log y)) for log x < y <= x**(1/3) - same
      provenance and same caveat. The u-range condition is load-bearing here and must
      be checked against the primary source, because at the bits-16 u=6 rung y is about
      40 against log x about 22, which is inside the range only just.
    conclusion: >-
      Adaptation of standard analytic number theory into this program's reference
      layer. novelty_status stays `unverified` because the primary sources have not
      been read in this session and no KN-LIT entry exists yet.
  assumptions:
  - >-
    The archived RUN-LPF-001-calib arrays are what they are recorded to be. This
    proposal reads them; it does not re-run the calibration and does not edit any
    EXP-LPF-001 artifact.
  - >-
    At the bits-16 cell, D = 2**32 is small enough that Psi(D, B) is computable EXACTLY
    by a dynamic program over primes up to B, so an exact reference exists at that cell.
    This assumption is checkable before any measurement and its failure is a scope
    reduction, not a result.
  - No live keys, no discrete logarithm computed, no curve arithmetic required at all.
  predictions:
  - metric: max_rung_absolute_log_ratio_saddle
    direction: lower
    minimum_effect: >-
      max_u |ln R_sp(u)| <= 0.82 at both cells, against the archived asymptotic figures
      max_u |ln R_rho(u)| = 2.4506 (bits 16) and 1.6171 (bits 20, = |ln 5.0386|). A
      reduction smaller than a factor of 3 at either cell fails this prediction.
  - metric: limb_b_decidable_rung_count
    direction: higher
    minimum_effect: >-
      10 of 10 under the saddle reference against the archived 9 of 10 under rho(u).
      Nine or fewer fails.
  - metric: exact_reference_residual_bits16
    direction: same
    minimum_effect: >-
      With the EXACT Psi(2**32, B) reference at bits 16, the uniform arm's R_exact(u)
      lies inside [0.90, 1.11] at every rung u in {2,3,4,5,6}. This is the absolute
      discriminator - it is a point prediction against a reference that is a theorem,
      not an approximation, and it can fail.
  - metric: monotonicity_of_R_rho_in_u
    direction: increasing
    minimum_effect: >-
      Strictly increasing in u at both cells - already true of the archived arrays and
      used here as the ARTIFACT TELL. A reference error must grow with u because the
      Hildebrand error term grows with u at fixed x. If the residual AFTER the saddle
      correction is non-monotone in u, the residual is not a reference effect and
      branch (b) or (c) is indicated regardless of its magnitude.
  minimal_test:
    design: >-
      Pure computation, no curve arithmetic, no new sampling. (1) Implement two
      independent references - REF-SP, the Hildebrand-Tenenbaum saddle-point estimate
      with alpha solved by Newton on sum_{p<=y} log p/(p**alpha - 1) = log x, and
      REF-EXACT, the exact count Psi(D, B) at the bits-16 cell by a dynamic program
      over primes <= B (D = 2**32 makes this tractable). (2) Recompute R(u) for the
      ARCHIVED uniform arm of RUN-LPF-001-calib under each of the three references
      (rho asymptotic as archived, REF-SP, REF-EXACT where available), at all five
      rungs at both cells. (3) Report max_u |ln R(u)| per reference per cell, the
      decidable-rung count under the frozen [1/8, 8] band, and the residual's
      monotonicity in u. (4) Cross-check REF-SP against REF-EXACT at bits 16 - two
      independently derived references that disagree by more than 5 percent at any
      rung void the exercise and are reported as such.
    controls:
    - >-
      REF-EXACT AS AN ABSOLUTE CONTROL. U1 says a two-sample design is blind to a
      deviation both arms share, and a finite-X reference error is precisely such a
      deviation. The exact count is the only reference in this design that is not an
      approximation, and it is what makes branch (b) detectable at all.
    - >-
      LOW-u AGREEMENT NULL. At u = 2 the asymptotic and exact references are expected
      to agree to within a few percent. If they do not, the implementation is wrong and
      no branch is read.
    - >-
      THIRD-QUADRATURE rho RECHECK. The archived rho values were already reproduced to
      8.7e-06 relative by an independent quadrature at TASK-20260801-051; this must be
      reproduced a third time by this implementation before any comparison is made.
      Disagreement is an implementation failure, never a finding.
    - >-
      NO NEW SAMPLING. The uniform arm is the archived one. Redrawing it would confound
      a reference question with a sampling question.
    required_metrics:
    - max_u |ln R(u)| per reference per cell
    - per-rung R(u) under all three references, machine-readable
    - decidable-rung count under the frozen [1/8, 8] band per reference
    - REF-SP versus REF-EXACT relative disagreement per rung at bits 16
    - sign and monotonicity of the post-correction residual in u
  falsification_conditions:
  - >-
    'F1 - the saddle reference reduces max_u |ln R(u)| by less than a factor of 3 at
    either cell: the departure is not explained as a finite-y reference effect and the
    sampler or the specification is implicated. Branch (b). This is a POSITIVE finding
    about the apparatus and is reported as such, not as a null result.'
  - >-
    'F2 - REF-EXACT at bits 16 puts the archived uniform arm outside [0.90, 1.11] at any
    rung: the archived uniform arm is not behaving as a uniform sample of its stated
    bitlength against a reference that is a theorem. This would be the strongest
    instrument finding available from this design and it blocks every LPF reading until
    localized.'
  - >-
    'F3 - REF-SP and REF-EXACT disagree by more than 5 percent at any bits-16 rung:
    implementation failure, exercise void, no branch read in either direction.'
  - >-
    'F4 - the post-correction residual is non-monotone in u: the residual is not a
    reference effect; report branch (c) with the residual as a named open item.'
  confounders:
  - >-
    The exact-Psi dynamic program counts integers in [1, D]; the archived uniform arm
    may be drawn matched-BITLENGTH rather than matched-RANGE. That difference is itself
    a candidate explanation of the departure and MUST be read out of the archived
    manifest before the comparison, not assumed. If the sampler is matched-bitlength,
    REF-EXACT must be computed over the same bitlength window or the control is invalid.
  - >-
    u is defined in the archived arrays as ln(D)/ln(Bsm) with non-integer values at
    several rungs (2.999875, 5.006009, 6.012858 at bits 16). Every reference must be
    evaluated at the archived u, not at the nominal integer target.
  - >-
    Floating-point evaluation of rho at u >= 6 is delicate. Both references must be
    computed in a stated precision and the precision recorded.
  interpretation_limits:
  - >-
    THIS MOVES NO EXPONENT AND MAKES NO STATEMENT ABOUT THE SEMAEV MAP IN EITHER
    DIRECTION. It concerns the reference and the uniform arm only. The real arm of
    EXP-LPF-001 is not read, re-read or re-scored by this proposal.
  - >-
    A repaired reference at toy D = 2**32 and 2**40 is a repaired reference at toy D.
    The uncertified class V6 of the EXP-LPF-001 contract is untouched.
  - >-
    Nothing here authorizes editing RR-LPF-1, RR-LPF-2 or the EXP-LPF-001
    specification. A correction to a frozen band is a superseding record under a new
    id, per AGENTS.md rule 4.
  heuristic_assumptions:
  - id: HEUR-SP-1
    statement: >-
      For x = D and y = Bsm in the archived ladder ranges, the Hildebrand-Tenenbaum
      saddle-point estimate approximates Psi(x, y) to within a relative error below
      0.10, uniformly over the five archived rungs at both cells.
    rigorous_support: >-
      Hildebrand's theorem Psi(x,y) = x rho(u) (1 + O(log(u+1)/log y)) for
      log x < y <= x**(1/3) supplies the ERROR SCALE of the asymptotic reference, and
      the saddle-point method of Hildebrand and Tenenbaum supplies the replacement
      estimate. Both are cited from secondary sources verified by search on 2026-08-02;
      neither primary source has been read in this session and a KN-LIT entry is owed
      before implementation is frozen.
    validation_plan: >-
      Direct and absolute, at toy scale where it is decidable - compare REF-SP against
      REF-EXACT (an exact dynamic-program count of Psi(2**32, B)) at all five bits-16
      rungs. This is not a distribution comparison against a sample; it is one computed
      number against another computed number, and it either agrees within 5 percent or
      it does not. At bits 20, D = 2**40 makes the exact count more expensive and it is
      declared OPTIONAL with its feasibility to be reported rather than assumed. TOY
      SCALE, LABELLED AS SUCH - this validates the estimator at toy D and says nothing
      about its behaviour at cryptographic D, which is IDEA-20260802-004's problem.
  target_complexity:
    time_exponent: >-
      n/a - this proposal claims no algorithm and moves no exponent. It repairs the
      reference that appears as the inverse-success-probability factor in every
      conditional exponent statement this lane can make.
    memory_exponent: n/a
    best_known: >-
      n/a as an attack. As a reference, the incumbent in this repository is the
      asymptotic Dickman rho(u), which a known-uniform arm was MEASURED to depart from
      by a factor of 11.5937 at the bits-16 u=6 rung (RUN-LPF-001-calib, validated
      ADMISSIBLE at TASK-20260801-051).
    hidden_overhead: >-
      The saddle-point evaluation costs a prime enumeration to y plus a Newton solve;
      negligible at every scale considered here. The EXACT count is a dynamic program
      whose cost grows with D and is stated to be feasible at 2**32 and optional at
      2**40 - that feasibility is measured and reported, not assumed.
    tradeoff_note: n/a
  dominated_by: >-
    n/a - no attack result is claimed. On the cost axes this program tracks (time,
    memory, data/queries for an ECDLP solve) this record moves no point, and that is
    stated rather than left as null. As a REFERENCE, it is intended to dominate the
    incumbent asymptotic rho(u) on accuracy at the archived parameters, and the
    prediction that it does is exactly what the test can falsify.
  sota_delta: >-
    Quantitatively zero on every ECDLP cost axis. The claimed delta is on the reference
    layer - from a measured maximum relative error of 1059 percent (bits 16, u=6) to a
    predicted maximum below 10 percent, and from 9 of 10 to 10 of 10 decidable rungs
    under the frozen band.
  instrument_failure_guards:
    decision_variable: >-
      max_u |ln R(u)| under each reference, plus the per-rung R_exact(u) at bits 16.
    what_would_make_it_vary: >-
      THE CHOICE OF REFERENCE, and nothing else - the sample is held fixed at the
      archived uniform arm by design. That is what makes this a clean test of the
      reference rather than of the sampler, and it is why no new sampling is permitted.
    power_against: >-
      Multiplicative errors in the absolute reference at the archived rungs, of any
      magnitude above the 5 percent implementation-agreement floor.
    no_power_against: >-
      Errors that the asymptotic and the saddle-point references SHARE (both are
      integer-smoothness references; a departure caused by the ENCODING producing
      non-uniform integers is invisible to this design and is IDEA-20260802-004's and
      the real arm's business); anything about the Semaev map; anything at
      cryptographic D; errors in the archived arrays themselves.
    demonstrated_movement: >-
      BY MEASUREMENT, NOT ARGUMENT - the archived arrays already exhibit the statistic
      moving from 1.1702 to 11.5937 across the u ladder, so the statistic is
      demonstrably responsive to the quantity under test before this experiment runs.
      Additionally REF-EXACT versus REF-ASYMPTOTIC at bits 16 is a computed difference
      that either appears or does not.
    lessons_addressed: >-
      Lesson 2 (thresholds frozen from asymptotic theory that a correct null could not
      satisfy) - this IS that failure, already observed at bits-16 u=6, and this
      proposal is its repair. Lesson 1 (a decision variable that is a closed form in the
      protocol's own parameters) - R_exact is measured against an exactly computed
      count, not against a formula in the protocol's parameters. Standing limit U1 - the
      absolute reference is supplied by REF-EXACT rather than by a second sample.
  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Prime sieve to 2**20 plus a dynamic program over Psi(2**32, B) for five B values;
    single-core hours, not days. No curve arithmetic, no factorization, no sampling.
  recommended_priority: high
  dependencies:
  - >-
    None. Reads archived arrays only. IDEA-20260802-004 depends on THIS record, not the
    reverse.
