idea:
  id: IDEA-20260813-4a824d
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Challenge-conditioned support-orbit imbalance for weighted ISD
  class: composition
  claim: >-
    Test whether the source-defined hypercube challenge and opening pattern
    partition d-split error supports into public automorphism orbits with
    nonuniform posterior weights, even when the total d-split admissibility
    ratio matches its baseline, and whether a weighted information-set schedule
    converts that imbalance into lower fully charged work than plain-random-SD
    ISD. No imbalance or advantage is claimed.
  mechanism: >-
    A random-permutation reduction relies on exchangeability of support
    positions under the adversary's observable. A hypercube challenge may leave
    a smaller stabilizer, so supports in different public orbits can have equal
    global admissibility yet unequal conditional likelihood after openings. An
    attacker could rank information sets by orbit weight instead of sampling
    uniformly. The mechanism is absent if the challenge-conditioned support law
    is exchangeable or if weighting gains are consumed by learning, data, and
    verification costs.
  why_not_a_renamed_known_approach: >-
    IDEA-20260808-632866 is the nearest control: it gives a random-permutation
    reduction and names an adversary exception. This proposal attempts to
    instantiate that exception as a public stabilizer-orbit imbalance and must
    fail if the reduction's exchangeability hypotheses hold. IDEA-20260805-
    cbd93d counts total d-split admissibility but cannot distinguish different
    weights among equally admissible orbits. IDEA-20260805-7504c6 varies d, and
    IDEA-20260808-a7872e uses algebraic factorization rather than a weighted ISD schedule.
  predictions:
    - metric: divergence of challenge-conditioned orbit weights from exchangeable null
      direction: higher
      minimum_effect: >-
        A preregistered corrected separation with identical total admissibility,
        orbit sizes, and challenge counts.
    - metric: weighted-versus-uniform information-set success per attempt
      direction: higher
      minimum_effect: >-
        At least a factor of 2 on a held-out source-valid toy slice while using
        identical attempt cost and no secret-derived features.
    - metric: fully charged work versus IDEA-20260813-27df0c
      direction: lower
      minimum_effect: >-
        At least 1 net work bit after weight estimation, data, preprocessing,
        memory, and verification; exponent relevance requires orbit min-entropy
        loss linear in code length and a realizable sampler.
    - metric: planted orbit-bias positive-control recovery
      direction: higher
      minimum_effect: Recover the planted orbit ordering and designed attempt reduction.
  minimal_test:
    design: >-
      Without executing here, derive the public automorphism group and
      challenge stabilizer from primary sources on a frozen toy capsule.
      Enumerate or certify support orbit sizes and challenge-conditioned weights,
      compare them with an exchangeable orbit-size-matched null and a planted
      biased law, then evaluate a preregistered weighted ISD schedule on held-out
      challenges. Charge all weight estimation and sampling against 27df0c.
    controls:
      - Fully charged IDEA-20260813-27df0c baseline first.
      - Exact random-permutation reduction conditions from IDEA-20260808-632866.
      - Exchangeable support law matched on d-split admissibility and orbit sizes.
      - Challenge-label and block-label permutation nulls.
      - Planted positive control with known public-orbit odds.
      - Uniform ISD schedule with identical per-attempt implementation and data.
    required_metrics:
      - Orbit sizes, stabilizers, conditional weights, and min-entropy with uncertainty.
      - Held-out weighted and uniform per-attempt success.
      - Weight-learning data, preprocessing, storage, and sampler cost.
      - Total work, peak memory, oracle access, target count, and verification.
  controls:
    - certified_charged_isd_baseline
    - exchangeable_orbit_size_matched_null
    - random_permutation_reduction_check
    - planted_public_orbit_bias_positive_control
  confounders:
    - Estimating weights from the same challenges used to measure decoding success.
    - Orbit sizes alone creating apparent nonuniform counts without unequal per-support probability.
    - Secret-dependent orbit labels unavailable to an attacker.
    - Retry, grinding, or challenge-selection effects already covered by bf6448.
    - Toy stabilizers that disappear at scheme parameters.
    - Ignoring the cost of sampling nonuniform information sets.
  falsification_conditions:
    - Conditional support probability is uniform within and across equal-size public orbits under the matched null while the planted bias is recovered.
    - The random-permutation reduction remains exact after conditioning on every attacker-visible challenge field.
    - Weighted scheduling fails to improve held-out per-attempt success by a factor of 2 or 1 net charged work bit.
    - Any imbalance is fully explained by cbd93d admissibility, orbit size, grinding, or train-test leakage.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - An orbit-frequency correlation is not a mechanism until exchangeability is causally broken by a public challenge field.
    - A held-out toy weighting gain is not an asymptotic decoder improvement.
    - Multi-target data and preprocessing cannot be amortized beyond available transcripts.
    - Overall forgery complexity may still be bounded by IDEA-20260808-d873bc's MPCitH crossover.
  assumptions:
    - Primary sources define a public challenge action and an attacker-computable automorphism group on support positions.
    - The matched exchangeable null preserves total d-split admissibility and orbit sizes.
    - A weighted information-set sampler can be specified without secret-derived labels.
  heuristic_assumptions:
    - id: H-ORBIT-1
      statement: >-
        Conditional on total d-split admissibility, public challenge class, and
        orbit size, the random-permutation baseline assigns equal probability to
        all supports in an orbit and exchangeable weights across equivalent orbits.
      rigorous_support: >-
        Group actions give exact orbit-stabilizer counts; exchangeable
        probabilities follow only if the source-defined challenge distribution
        is invariant under the declared action.
      validation_plan: >-
        Prove invariance where possible, enumerate complete toy orbits, compare
        full likelihood-ratio tails under block and challenge relabellings, and
        use held-out keys or challenges. Mark all scaling transfer unvalidated.
    - id: H-ORBIT-2
      statement: >-
        If challenge-conditioned orbit min-entropy loses rho N bits with rho
        greater than zero, a preregistered weighted ISD sampler captures a
        positive constant fraction of that loss after estimation cost.
      rigorous_support: >-
        Optimal importance sampling prioritizes higher-probability regions; the
        unsupported step is efficient estimation and sampling of the relevant
        orbit weights from attacker-visible data.
      validation_plan: >-
        Compare exact optimal and implementable weighted schedules on enumerated
        slices, hold out challenges, report weight and success tails at three or
        more sizes, and falsify exponent relevance if entropy loss is sublinear.
  proof_search_map:
    bottleneck: >-
      Exhibit an attacker-visible failure of support exchangeability that
      survives exact orbit-size and admissibility conditioning and admits an efficient sampler.
    baseline_embedding:
      parameter_slice: >-
        Frozen 27df0c plain-SD and d-split frontier rows plus the exact 632866
        random-permutation-reduction slice for the same instance.
      reproduction_check: >-
        Reproduce baseline work within 0.25 bit, cbd93d admissibility, and the
        reduction's exchangeability conclusion before seeking an exception.
    observation_collision:
      observable: Public orbit identifier and challenge-conditioned orbit weight.
      distinct_preimage_search: >-
        Find support laws with identical orbit sizes and total admissibility but
        different conditional weights, and laws with unequal raw counts but
        identical per-support probability.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Fibre of supports sharing one public challenge-orbit identifier.
        predicted_gain: Separates per-support probability from orbit cardinality.
      - transform: representation_reduction
        proposed_object: Weighted information-set distribution over orbit representatives.
        predicted_gain: Converts a public posterior imbalance into a concrete decoder schedule.
    quantifier_order: >-
      Fix the public group action, orbit partition, training regime, held-out
      challenges, weight estimator, and ISD sampler before seeing decoding
      outcomes. One estimator must apply across all held-out keys in scope.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy, source-gated held-out bound on public orbit imbalance and the
        fully charged success of one weighted ISD schedule.
      nearby_object_control: >-
        An exchangeable law with the same orbit sizes and admissibility but
        independently permuted orbit labels; weighted and uniform schedules must tie.
    proof_obligations:
      - claim: Reproduce the charged baseline and random-permutation reduction.
        responsibility: baseline
      - claim: Prove every feature used by the sampler is public and attacker-computable.
        responsibility: interface
      - claim: Separate orbit size, admissibility, and per-support probability.
        responsibility: correctness
      - claim: Bound held-out estimation and weighted-sampler success.
        responsibility: success_probability
      - claim: Charge training data, weight storage, sampling, retries, and verification.
        responsibility: runtime
      - claim: Require linear entropy loss and matched instances for exponent relevance.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      Target tau_plain minus epsilon only if public orbit min-entropy loss is
      rho N for rho greater than zero and the charged weighted sampler realizes
      epsilon greater than zero; current delta is zero.
    memory_exponent: At most the matched baseline cap after including orbit-weight tables.
    best_known: >-
      The fully charged and reoptimized plain-random-SD frontier reproduced by
      IDEA-20260813-27df0c, with IDEA-20260808-632866 as the exact reduction control.
    hidden_overhead: >-
      Orbit enumeration, training data, weight fitting, alias or rejection
      sampling, preprocessing, retries, memory access, and verification are explicit.
    tradeoff_note: >-
      Finer orbit partitions may improve prioritization but increase data and
      storage. Coarser partitions reduce estimation cost but can erase the signal.
  sota_delta:
    claim: No current improvement; a one-bit matched gain and linear entropy-loss scaling are required.
    current_net_work_delta_bits: 0.0
    current_time_exponent_delta: 0.0
    current_memory_exponent_delta: 0.0
    minimum_concrete_net_gain_bits: 1.0
    minimum_per_attempt_gain_factor: 2.0
    asymptotic_gate: 'liminf orbit_min_entropy_loss/N > 0 and charged epsilon > 0'
    pareto_rows:
      time: Weight fitting, nonuniform sampling, attempts, and inverse success are charged.
      memory: Orbit tables, estimator state, and ISD tables count at peak occupancy.
      data: Training and held-out challenge or transcript counts are explicit.
      preprocessing: Group, orbit, and weight construction are split into global and per-key work.
      oracle: Only attacker-visible source-permitted challenge data; no support or decoder oracle.
      verification: Held-out likelihoods, candidate errors, and orbit certificates are checked.
    frontier_check: >-
      All six rows are checked against 27df0c. A higher success rate that depends
      on unavailable training data or excessive orbit storage is dominated.
