# IDEA-20261003-236fb7
# Addition count for the integer 6. Proposal only. Not approved.
idea:
  id: IDEA-20261003-236fb7
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 6 has bit length 3, 2 doublings, and 1 addition
  class: measurement
  claim: >-
    The integer 6 has bit length 3. It is reached from 1 by 2
    doublings and 1 addition. Three exceeds two by 1. Two exceeds
    one by 1. The product of the three counts is 6. Their sum is 6.
    The binary weight is 2. These are writing counts, not an ECDLP
    exponent.
  mechanism: >-
    The object is the writing of 6, whose bits are 1, 1, 0. The
    chain is 1 doubled to 2, doubled to 4, then 4 added to 2. Two
    readings of 6 have the same addition count, so that gap is 0.
    No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group lower bound is a different object from a bit length.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 6 is frozen before the counts are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The excess 1 of the bit length over the doubling count.
    baseline_embedding:
      parameter_slice: The integer 6 and the counts 3, 2, and 1.
      reproduction_check: >-
        Two readers must agree that the bit length is 3, the
        doubling count is 2, and the addition count is 1.
    observation_collision:
      observable: The length 3 and the addition count 1.
      distinct_preimage_search: >-
        Reporting the addition count as 0 drops that count. Two
        readings of 6 have addition gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 6.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The integer is fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 3, 2, and 1. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of 6. Both have 1 addition, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 6 is 3.
        responsibility: size
      - claim: The doubling count is 2 and the addition count is 1.
        responsibility: size
      - claim: The product of the three counts is 6.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: length_gap
      direction: different
      minimum_effect: Three exceeds two by 1.
  minimal_test:
    design: >-
      Count the bits of 6, the doublings from 1 to 4, and the one
      addition that reaches 6. Do not add a curve point.
    controls:
      - Two readings of 6, whose addition gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
  falsification_conditions:
    - The bit length is not 3.
    - The addition count is not 1.
  confounders:
    - A different addition chain can use more additions.
  interpretation_limits:
    - An addition count is not a walk length.
    - No transfer to a cryptographic scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen writing of 6 has bit length 3, and the frozen
        chain from 1 uses 2 doublings and 1 addition.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Another chain for 6 can add more than once.
    tradeoff_note: One addition on this integer is not a shorter discrete-log walk.
