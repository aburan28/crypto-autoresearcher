  dominated_by: >-
    Generic rho at exponent 1/2, already discounted by about sqrt(6)
    on this j=0 curve, dominates any reading of the residue 29 as an
    attack. The map does not reduce group operations, memory, or
    queries below that discounted baseline.
  sota_delta: >-
    The separator is the single residue 29 against the null point
    that leaves its curve. The gap to a sub-square-root discrete
    logarithm is the full exponent 1/2, and this idea moves that
    exponent by 0.
  proof_search_map:
    bottleneck: >-
      Whether phi(G) equals 29*G and the null point leaves its curve.
    baseline_embedding:
      parameter_slice: p=751, zeta=678, G=(4, 559), N=67
      reproduction_check: >-
        Two group laws agree on 29*G and on 67*G = O.
    observation_collision:
      observable: equality of phi(G) and 29*G
      distinct_preimage_search: >-
        The same map on (5, 631) must leave y^2 = x^3 + x + 1. Landing
        on that curve means the observable is not carried by the j=0
        equation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the point (459, 559) and the residue 29
        predicted_gain: equality, or an explicit mismatch
    quantifier_order: >-
      This one generator at p=751, not every j=0 curve.
    method_ceiling:
      strongest_certifiable_claim: >-
