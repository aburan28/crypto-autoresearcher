# IDEA-20261006-3e180c
# One j=0 eigenvalue. Proposal only. Not a hypothesis.
idea:
  id: IDEA-20261006-3e180c
  question_id: RQ-JINV-8fc13a
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Order-3 map on y^2 = x^3 + 1 over F_751 sends G to 29G
  class: measurement
  claim: >-
    Let E0 be y^2 = x^3 + 1 over F_751. This session counted #E0 = 804
    by a Legendre sum and by enumeration, and found G = (4, 559) of
    order 67. Let zeta = 678, which satisfies zeta^3 = 1 and zeta is
    not 1. The map phi(x, y) = (zeta*x, y) sends G to (459, 559), and
    29*G equals that image. The residue 29 satisfies
    29^2 + 29 + 1 = 0 modulo 67. On the ordinary curve
    y^2 = x^3 + x + 1, the same map sends (5, 631) to (386, 631),
    which is not on that curve. A recomputation in which 29*G is not
    phi(G), or in which the image of (5, 631) lands on
    y^2 = x^3 + x + 1, is a negative. The map is one scalar
    multiplication by 29. It is not a walk-step ratio.
  mechanism: >-
    The tracked object is the scalar by which one rational
    automorphism acts on one generator. The representation is the
    affine point. The operation is multiplication of the
    x-coordinate by zeta. On a j=0 curve the cube roots of unity give
    an order-3 automorphism, and an order-3 unit modulo N satisfies
    lambda^2 + lambda + 1 = 0. IDEA-20260807-f8a045 states that
    identity as a relation-yield fact. This idea names the residue 29
    on one generator and checks that the same coordinate map leaves a
    point of an |Aut|=2 curve. No pairing is evaluated. The
    non-generic resource is the rational automorphism, whose
    rho discount is the constant sqrt(6) and not an exponent change.
  assumptions:
    - 751 is 1 mod 3, so a primitive cube root of unity lies in F_751. This session found 678 and 72.
    - 67 divides 804, 67 is prime, and 67 is 1 mod 3, so an element of order 3 exists modulo 67.
    - phi is frozen as (x, y) mapped to (678*x, y) before the scalar is scored.
  predictions:
    - metric: eigenvalue_residue
      direction: different
      minimum_effect: >-
        phi(G) equals 29*G, and 29^2 + 29 + 1 is divisible by 67.
    - metric: null_curve_escape
      direction: different
      minimum_effect: >-
        phi(5, 631) does not satisfy y^2 = x^3 + x + 1 over F_751.
  minimal_test:
    design: >-
      Recompute #E0 two ways, check that 67*G is the identity, apply
      phi, and compare with 29*G in two group-law implementations.
      Evaluate 29^2 + 29 + 1 modulo 67. Apply phi to (5, 631) and
      test the curve equation of y^2 = x^3 + x + 1. Run
      distinguished-point rho and BSGS on the ten scalars 1..10 in
      the order-67 subgroup and record the operation counts. Those
      counts are not the primary metric.
    controls:
      - The point (5, 631) on y^2 = x^3 + x + 1. If its image lies on that curve, the map is not using the j=0 equation.
      - Two group-law implementations on 2G and on 67*G. Disagreement voids the comparison.
      - Distinguished-point rho and BSGS on the ten scalars, recorded as attack-cost controls and not as the eigenvalue.
    required_metrics:
      - whether phi(G) equals 29*G
      - 29^2 + 29 + 1 modulo 67
      - whether phi(5, 631) lies on y^2 = x^3 + x + 1
      - rho step counts and BSGS operation counts on the ten shared logs
  falsification_conditions:
    - Both group laws agree and 29*G is not equal to phi(G).
    - 29^2 + 29 + 1 is not 0 modulo 67.
    - phi(5, 631) satisfies y^2 = x^3 + x + 1.
  confounders:
    - The other cube root 72 is the inverse automorphism and is a different map. The frozen zeta is 678. Scoring 72 as if it were 678 is a protocol miss, not a second eigenvalue claim.
    - x=0 is fixed by phi, so a point with x=0 does not witness escape. The null point has x=5.
    - Identifying lambda in a group of order 67 is a toy discrete log of one related point. It is the witness, not a sub-square-root algorithm.
  interpretation_limits:
    - One residue on one generator does not show that every j=0 curve has an eigenvalue, and it does not measure a step-count ratio.
    - KR-RHO-0528e7 already prices the sqrt(6) constant. Landing on lambda=29 does not improve that constant.
    - The test covers one prime and one generator.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this j=0 curve the frozen order-3 map acts on the
        order-67 subgroup as multiplication by 29, and 29 has order 3
        modulo 67. The same map does not preserve the named |Aut|=2 curve.
      rigorous_support: >-
        KR-RHO-0528e7, opened this session, records that a rational
        automorphism group of order m discounts rho by about sqrt(m),
        with the j=0 case equal to sqrt(6), and that the exponent
        stays 1/2. The residue 29 is this session's group-law
        computation, not a step count from that row.
      validation_plan: >-
        Recompute phi(G) and 29*G in two group laws, and test the
        null point. The pre-registered residue is 29. Do not replace
        it after the comparison.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Applying phi is one field multiplication.
      The rho discount for an order-6 automorphism group is the
      constant sqrt(6), already in KR-RHO-0528e7, and is not improved
      here.
    memory_exponent: >-
      Unchanged. The map stores O(1) field elements. BSGS memory of
      order sqrt(67) is the matched control and is not improved.
    best_known: >-
      Generic rho at exponent 1/2 (KR-RHO-13bf67), with the j=0
      automorphism discount sqrt(6) (KR-RHO-0528e7, KN-TECH-018).
      This measurement does not beat that discounted baseline.
    hidden_overhead: >-
      None. The residue 29 and the constant sqrt(6) are explicit.
      No o(1) saving is claimed.
    tradeoff_note: >-
      There is no time-memory tradeoff in the eigenvalue check.
      Rho and BSGS on ten logs only price the matched controls.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
