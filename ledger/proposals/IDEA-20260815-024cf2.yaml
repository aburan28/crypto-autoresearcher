idea:
  id: IDEA-20260815-024cf2
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE PROGRAM'S NEGATIVE RESULTS ARE SCOPED BY CONVENTION AND THE SCOPE
    LANGUAGE IS NEVER CHECKED: audit whether each scoped negative's stated
    boundary matches the parameters its run actually covered
  class: control

  claim: >-
    AGENTS.md requires every conclusion to be scoped to the tested curves,
    parameters, solver and budget. A scope statement that is broader than
    the run behind it is an overclaim in the most consequential place, since
    scoped negatives are what close lanes. Comparing each negative's stated
    scope against its run manifests is mechanical and bounded.

  mechanism: >-
    For each scoped negative in the ledger, extract its stated scope and the
    parameters its cited runs actually covered. Compare field by field.
    Report matches, overstatements, and negatives whose runs cannot be
    identified.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep the evidence and decision records for scoped negatives; read
      docs/evidence-and-reproducibility.md's mandated negative-result
      phrasing.
    results: >-
      The mandated phrasing exists and is used; no record audits stated
      scopes against run coverage.
    verdict: >-
      ADAPTATION. Auditing claims against their support is elementary;
      applying it to the phrasing that closes lanes is what is missing.

  object_first_candidate:
    tracked_object: >-
      EACH SCOPED NEGATIVE'S STATED BOUNDARY, against the parameter
      coverage of its cited runs.
    lossiness: >-
      A scope statement compresses a run's parameter coverage into prose,
      and the audit measures whether that compression widened it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while negatives cite runs identifiably; those that do not
      are the audit's key category and cannot be checked at all.

  null_object_control: >-
    NULL 1 -- a negative whose scope is known to match its runs, which must
    audit clean. NULL 2 -- a deliberately widened test scope, which must be
    flagged.

  discriminated_from:
    - >-
        The findings-promotion audit in this series, which checks findings
        against evidence; this checks decision scope against run coverage,
        which is one layer lower.
    - >-
        The citation-verification audit, which concerns external sources
        rather than internal run coverage.

  assumptions:
    - >-
        Negatives cite runs identifiably; those that do not are reported
        rather than assumed sound.
    - >-
        Run manifests record the parameters actually covered, which the
        schema requires but which older runs may not fully carry.

  predictions:
    - metric: >-
        clean-scope null
      direction: different
      minimum_effect: >-
        FORCED clean; a flag means the criterion is too strict.
    - metric: >-
        deliberately widened scope
      direction: different
      minimum_effect: >-
        FORCED flagged.
    - metric: >-
        count of negatives whose stated scope exceeds their run coverage
      direction: different
      minimum_effect: >-
        The deliverable; each is an overclaim in the place that closes
        lanes.
    - metric: >-
        count of negatives whose runs cannot be identified
      direction: different
      minimum_effect: >-
        Reported separately; these are unauditable and their standing is
        unclear by construction.

  minimal_test:
    design: >-
      All scoped negatives in the ledger, both nulls first.
    controls:
      - >-
          Clean-scope and widened-scope nulls.
      - >-
          Field-by-field comparison rather than impressionistic reading.
      - >-
          Negatives with unidentifiable runs reported as a distinct
          category.
    required_metrics:
      - >-
          Per-negative verdict with the run manifests checked.
      - >-
          Counts of overstated and unauditable negatives.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        A null misbehaves. The criterion is miscalibrated.
    - >-
        Several negatives overstate their scope. Corrections must
        supersede them and the lanes they closed may need reopening, which
        is the outcome with the largest consequence.
    - >-
        Many negatives cannot be traced to runs. The scoping convention is
        not producing auditable claims, which is a process finding.
    - >-
        All negatives audit clean. The scoping discipline works, which is
        worth establishing since the program's closures depend on it.

  confounders:
    - >-
        CRITERION STRICTNESS: scope prose is necessarily more general than
        a parameter list, so an over-strict criterion would flag every
        negative and produce noise.
    - >-
        SCHEMA DRIFT: older run manifests may not record all parameters,
        making a negative look overstated when the coverage simply was not
        logged.

  interpretation_limits:
    - >-
        Audits internal consistency; establishes nothing mathematical.
    - >-
        Scoped to negatives citing identifiable runs.
    - >-
        An overstatement is corrected by superseding record and may reopen
        a lane, which is a Coordinator decision rather than this record's.

  heuristic_assumptions:
    - id: HEUR-SCOPE-1
      statement: >-
        A scoped negative's stated boundary is comparable field by field
        against the parameter coverage recorded in its cited run
        manifests.
      rigorous_support: >-
        Rigorous ingredient: both the scope phrasing and the run
        manifest schema declare curves, parameters, solver and budget,
        so the comparison is structured. THE GAP: scope prose
        legitimately generalises -- 'toy prime fields' covers a
        parameter set without listing it -- so deciding when
        generalisation becomes overstatement requires judgement that the
        audit must record per entry rather than apply silently.
      falsification_condition: >-
        A negative flagged as overstated whose generalisation a reviewer
        judges reasonable.
      validation_plan: >-
        SAMPLE: all scoped negatives. COMPARISON: field by field, with
        judgement calls recorded. TAIL CHECK: the oldest negatives,
        where manifest schema adherence is weakest. TRANSFER: none; each
        is audited individually.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is manual comparison per negative.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent scope audit exists; the mandated phrasing is specified
      without its output being checked.
    hidden_overhead: >-
      Older manifests may not record the parameters needed, making
      unauditable and overstated hard to distinguish exactly where it
      matters most.
    tradeoff_note: >-
      Auditing scope protects every closure that rests on a negative;
      leaving it unaudited lets a lane stay closed on a claim wider than
      its evidence.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As mathematics: nothing. As an audit of the
    program's closure claims: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a per-negative comparison of
    stated scope against actual run coverage across the ledger's scoped
    negatives, with counts of overstatements and of negatives too
    untraceable to audit, covering the claims that close lanes.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that most negatives cite runs identifiably. 0.8 that the nulls
    calibrate the criterion. 0.35 that at least one negative materially
    overstates its scope, which could reopen a closed lane and is the
    outcome with the largest consequence.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - KN-OPEN-019
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - KN-TECH-056
