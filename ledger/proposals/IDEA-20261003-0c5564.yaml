idea:
  id: IDEA-20261003-0c5564
  question_id: RQ-ECDLP-bc7a54
  goal_id: GOAL-ECDLP-001
  goal_id_note: >-
    Copied from RQ-ECDLP-bc7a54 goal_ids. Binding and any budget consequence
    are Coordinator decisions; this record makes none.
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    THE INVERTIBLE HALF IS GRADED, AND RECOGNITION IS WORTH EXACTLY ONE STRIP:
    an exact total coordinate omega is its own chi (verify by one scalar
    multiplication), so the duality survives only for PARTIAL omegas; price a
    candidate by (alpha = density exponent, beta = fraction of the log's bits
    its omega supplies, gamma = omega cost exponent, kappa = native chi cost
    exponent), and a claw of walk candidates against a tame window table beats
    rho WITHOUT any chi iff alpha - gamma > 1/2 and alpha + beta - gamma > 1,
    a native chi is necessary exactly on the strip 0 < beta <= 1 - alpha, and
    the note's D_x (beta = 0) and D_w / log-intervals (chi only by verification
    at gamma = alpha/2) sit on the two boundary lines where the exponent is
    1/2 -- one law that prices every future cheap-advice proposal, validated
    by a planted-oracle pipeline on the generic null and a hit-rate arm on
    real curves
  class: mechanism

  claim: >-
    WHICH SIDE. Neither side is assumed: this record changes the OBJECT the
    RQ asks about. The note (section 5) defines a hint family as a triple
    (D, chi, omega) with one common cost c and an EXACT omega; the duality
    (section 7) is then a statement about two triples. Both definitions hide
    a degree of freedom, and the duality's two columns turn out to be the two
    boundary lines of a phase diagram.

    (V) LEMMA V (VERIFICATION COLLAPSE; exact). If omega is TOTAL and
    computable from coordinates in time n^gamma on every input, then
    chi_V(Q) := [ [omega(Q)] g == Q ] decides D_omega = {Q : omega(Q) =
    log_g Q} exactly at cost n^gamma + O(log n) group operations. So "dense,
    coordinate-invertible, not recognizable" is EMPTY: the note's D_w is
    invertible only by GENERATION (k is chosen first), and once its omega is
    written as a coordinate function (meet-in-the-middle on W(m, w),
    gamma = alpha/2) Lemma V gives its chi at that price.

    (G) THE EXCHANGE LAW. A PARTIAL omega returns, for Q in D, a window J(Q) of
    width E = n^{1 - beta} with log_g Q in J(Q) (with probability s on D;
    s constant below); beta = 1 is exact. A hit at Q = h g^a gives
    log_g h in J(Q) - a, finished by kangaroo in (2 + o(1)) sqrt(E)
    (KR-RHO-898783, proven). Writing every cost as n^{exponent} with polylog
    factors suppressed:
      (G1) NATIVE CHI (cost n^kappa per step): one walk to a hit, one omega
      call, one kangaroo finish:
        tau_chi = max(1 - alpha + kappa, gamma, (1 - beta)/2).
      Gain (tau < 1/2) iff alpha > 1/2 + kappa, gamma < 1/2, beta > 0.
      (A multi-hit claw does not enlarge this region; checked at Stage 0.)
      (G2) NO CHI, CLAW WITH MEMORY. Walk N candidates, call omega on each
      (it may return garbage off D), and look each window-relative point
      Q g^{-c(Q)} up in a table of T tame points g^j, j in [0, E). A true
      candidate matches with probability T/E. Minimising N n^gamma + T subject
      to N n^{alpha - 1} T = E and T <= E:
        tau_claw = 1 - (alpha + beta - gamma)/2   if beta <= alpha - gamma,
        tau_claw = 1 - alpha + gamma              otherwise (Lemma V regime),
      with memory n^{tau_claw}. Gain iff alpha - gamma > 1/2 AND
      alpha + beta - gamma > 1.
      (G3) NO CHI, LOW MEMORY: kangaroo with cutoff from every candidate,
        tau_kang = 1 - alpha + max(gamma, (1 - beta)/2), polylog memory;
      dominated by G2 in time whenever beta <= alpha - gamma; van Oorschot-
      Wiener-type interpolation between G2 and G3 is stated as an obligation,
      not derived.

    (P) THE PHASE DIAGRAM (gamma = kappa = o(1)). In the unit square of
    (alpha, beta): chi-less candidates beat rho on {alpha > 1/2,
    alpha + beta > 1}; candidates with a free native chi beat rho on the
    larger set {alpha > 1/2, beta > 0}. RECOGNITION IS WORTH EXACTLY THE STRIP
    {alpha > 1/2, 0 < beta <= 1 - alpha}. Outside it a partial omega needs no
    chi at all; inside it a cheap chi is indispensable; on beta = 0 (no
    omega) nothing helps.

    (T) THE PRICING TABLE (hand arithmetic; each row a 4-vector and its tau).
      D_x(p^alpha), no omega: (alpha, 0, -, 0): tau = 1/2 (rho). The note's
        recognizable column is the line beta = 0.
      D_x with a promised-input omega of cost n^gamma (Route 1 / ICPERF): tau =
        max(1 - alpha, gamma) -- the n^{1/3} target is alpha = 2/3,
        gamma <= 1/3, the note's section 7 sentence recovered as a special case.
      Interval of logs D_I(n^alpha) or D_w(n^alpha): exact omega by kangaroo or
        meet-in-the-middle, gamma = alpha/2, no native chi: G2 is in its
        Lemma-V branch (beta = 1 > alpha/2), tau = 1 - alpha/2 > 1/2 for
        alpha < 1. The note's invertible column is the line gamma = alpha/2.
      Anomalous curve: (1, 1, o(1), 0): tau = o(1). Small embedding degree k:
        (1, 1, subexponential in p^k, 0). Both are the law's known-true
        corners.
      j = 0 beta-orbits: not an exponent-moving family; a factor-3 hit-rate
        gain for the beta-closed D_x, recovered by the curve arm.
      Bernstein-Lange tables: outside the law (preprocessed trail structure,
        P charged; IDEA-20260920-a92b0f's model).
    A 2-parameter family the note does not consider becomes the target: a
    coordinate predictor that returns the top beta log2 n bits of log_g Q on
    a recognizable set of density n^{alpha - 1} with alpha > 1/2 and ANY
    beta > 0 moves the exponent, by min(alpha - 1/2, beta/2).

    (C) CEILING. At alpha = 1 (D = all points) the law is not tight: bit-
    security reductions (Duc-Jetchev, KN-LIT-4155; Boneh-Shparlinski,
    KN-LIT-5602; HNP for MSBs, KN-LIT-043) amplify a predictor on ALL inputs
    by random translation Q -> Q g^r. On a sparse D those translations leave D
    (on a prime-order group no translation preserves a proper subset), so the
    amplification route needs D closed under the reduction's maps -- in
    general only automorphism-closed D, a constant. The law is therefore the
    right baseline for sparse D and an upper bound (achievability) only; it is
    never a lower bound.

  mechanism: >-
    OBJECT FRAME. The tracked object is the WINDOW J(Q) that omega attaches to
    a walk point, carried through the walk by the known offset a (J(Q) - a is
    a window for log_g h). Representation: R1 for the native-chi arm (the
    x-coordinate test of D_x); the generic label for the planted arm.
    Operation set Sigma: translation by the walk's step multipliers g^s,
    acting on windows by shifts (deterministic: J(Q g^s) is not computed, but
    J(Q) - a is exactly propagated as the offset accumulates); and the claw
    lookup, which compares window-relative points against a tame table.
    TRICHOTOMY: partial action -- the window propagates deterministically
    under the walk's translations BECAUSE the offset is known, i.e. only along
    the walk's own trajectory, never as a function of an arbitrary group
    element (that would be a sum-compatible bucket function, closed by
    KN-FIND-ffe1df Theorem C on a prime-order group). LOSSY-PROJECTION TEST
    AGAINST SIGMA. log_g h -> J(Q) - a discards all but beta log2 n bits
    (lossy for beta < 1); the discard is compatible with the walk's
    translations (a window shifted by a known offset is a window of the same
    width); at beta = 1 it loses nothing and IS the answer, which is Lemma V's
    corner. PRICED OPEN NUMBER: the measured exponent tau-hat per (alpha,
    beta) cell against the law, and the hit rate of D per walk step against
    |D|/n.
    WHY THIS IS NOT D_x OR D_w IN NEW NOTATION. Both appear as the two
    boundary lines of (P); the record's content is the region between and
    beyond them and the exact strip where chi matters.
    OFF-LIMITS AS PRIMARY LENS: F1-F7 of IDEA-20260802-002 and this lane's four
    closures. Components used and named: F1 (r-adding walk, kangaroo finish,
    claw table) as plumbing only; F7 is outside the law by construction;
    F5/F4 appear only as the pricing table's known-true corners.

