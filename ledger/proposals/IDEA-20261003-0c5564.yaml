  citation_note: >-
    The law is bookkeeping over a proved kangaroo bound and a stated hitting-
    time heuristic; every exponent is hand-derived and labelled. No run exists.

  assumptions:
    - n prime; HINTWALK as in the note, r-adding walk with r >= 16 and uniformly random step multipliers, restarts every L steps.
    - Omega's window placement relative to the true log is uniform within J(Q) (planted oracle by construction; for a natural omega this is H3).
    - s (omega's success rate on D) is a constant; a natural omega with s = n^{-sigma} multiplies the walk term by n^{sigma}, stated not modelled.
    - 'Off-limits components used: F1 as plumbing (walk, kangaroo, claw table).'
    - No factor base appears; KN-OPEN-020 is not engaged.

  proof_search_map:
    bottleneck: >-
      The hit process: every exponent in the law assumes the walk hits D at
      rate |D|/n per step independently of D's shape. For log-structured D
      (intervals of logs, low-weight logs) an additive walk's log-trajectory
      is itself structured, and a deviation there would change the law
      exactly on the note's invertible column.
    baseline_embedding:
      parameter_slice: >-
        beta = 0 (no omega): G1 and G3 reduce to kangaroo on the full range,
        tau = 1/2; beta = 1, gamma = o(1), alpha = 1 (anomalous): tau =
        o(1); beta = 1, total omega: G2's second branch equals Lemma V's
        verification walk, tau = 1 - alpha + gamma.
      reproduction_check: >-
        Symbolic: the three slices evaluated from the closed forms at Stage 0.
        Executable: the planted pipeline at beta = 0 must reproduce the
        full-range kangaroo constant 2 sqrt(n) within 10 percent, and a plain
        rho row on the same instances must reproduce 0.886 sqrt(n) within 10
        percent; at beta = 1 the Lemma V arm must show zero false
        certificates.
    observation_collision:
      observable: The measured exponent tau-hat per cell and the hit rate per walk step.
      distinct_preimage_search: >-
        Two candidates with equal (alpha, beta, gamma, kappa) are priced
        identically; the collision that could mislead is a planted oracle that
        leaks the exponent through its window placement (a non-uniform offset
        makes the claw succeed early). The uniform-offset construction and a
        deliberately biased-offset arm (where the law MUST be beaten) separate
        them.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Per-candidate resource measure: walk steps (charged n^{1-alpha} per
          hit), omega calls (n^gamma each), finish (sqrt(E)) or claw table
          (T); charges added only across these disjoint stages.
        predicted_gain: The closed forms of G1-G3 and the phase diagram.
      - transform: observable_fiber
        proposed_object: >-
          Hold (alpha, beta) fixed and vary whether chi is native or absent;
          the invariant that separates the two costs is exactly the strip
          0 < beta <= 1 - alpha.
        predicted_gain: Locates the price of recognition as a region, not an anecdote.
    quantifier_order: >-
      FOR EACH candidate 4-vector (alpha, beta, gamma, kappa) and constant s,
      THERE EXISTS an algorithm (G1, G2 or G3) with expected cost n^{tau + o(1)}
      under H1-H3 -- an achievability statement. It is NOT "for all
      algorithms the cost is at least n^tau": no lower bound is claimed, and
      the alpha = 1 bit-security amplification is the named counterexample to
      that stronger reading.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under H1-H3, the stated costs are achievable; on the planted generic
        null at n in {2^22, 2^24, 2^26} the measured exponents match the law
        within 0.07 at the tested cells; on toy curves D_x is hit at rate
        |D_x|/n and the beta-closed D_x on j = 0 at three times that." It
        cannot certify that any natural omega with beta > 0 exists, nor any
        lower bound.
      nearby_object_control: >-
        A biased-offset oracle (window placed so that log_g Q is always in the
        first E/16 of J(Q)): the planted pipeline MUST then beat the law's
        G2 cost by about a factor 4 (sqrt of 16); a pipeline that does not see
        this cannot certify the law's accounting.
    proof_obligations:
      - claim: Lemma V exact (chi_V has no false positives or negatives).
        responsibility: correctness
      - claim: G1, G2 (both branches), G3 closed forms and the multi-hit check for G1.
        responsibility: runtime
      - claim: G2 memory n^{tau_claw}; G3 polylog; G2-G3 interpolation stated as open.
        responsibility: memory
      - claim: Phase diagram regions and the strip.
        responsibility: size
      - claim: Pricing table rows (hand arithmetic), each with its source record.
        responsibility: interface
      - claim: The law is achievability only; the alpha = 1 amplification ceiling.
        responsibility: scope
    not_applicable_reason: null

  null_object_control: >-
    NULL-1 (MANDATORY; Stage 1 runs ENTIRELY on it): Z/n under a keyed random
    relabelling, a literal generic group, with planted oracles -- D a random
    subset of density n^{alpha - 1} (membership from a keyed PRF of the
    exponent, cost 1), omega returning a window of width n^{1 - beta} with a
    uniform random offset, correct with s = 0.9. NULL-2: matched random
    prime-order toy curves in the Stage 2 hit-rate arm. POSITIVE CONTROL
    (RQ-mandated): j = 0 prime-order curves, walk on beta-orbit classes
    (canonical representative of {Q, beta Q, beta^2 Q, -Q, ...}) with the
    beta-closed D_x^beta = union of beta^i D_x(B): the hit rate per class step
    must be 3 times the base rate (exact factor recovered within CI) while a
    random curve shows 1. SECOND POSITIVE CONTROL: the biased-offset oracle
    of method_ceiling. DECAY TEST: tau-hat is fitted across n in {2^22, 2^24,
    2^26}; a measured cost ratio that does not move with n where the law
    says it should is the artifact tell.

  predictions:
    - metric: M1 -- tau-hat per (alpha, beta) cell, arms G1 (chi oracle on), G2 (claw), G3 (per-candidate kangaroo), alpha in {0.55, 0.6, 0.7, 0.8}, beta in {0.1, 0.3, 0.5, 0.7}
      direction: different
      minimum_effect: >-
        Agreement with the law: |tau-hat - tau_law| <= 0.07 at every cell (CI
        from 30 targets per cell and three n). Example cells (hand
        arithmetic): (0.7, 0.2) in the strip -- G1 tau = 0.4, G2 tau = 0.55
        (no gain without chi); (0.8, 0.5) -- G1 tau = 0.25, G2 tau = 0.35
        (gain without chi); (0.6, 0.3) -- G1 tau = 0.4, G2 tau = 0.55.
    - metric: M2 -- hit rate of D per walk step divided by |D|/n, for D random, D an interval of logs, D a low-weight log set, at matched alpha (planted null)
      direction: different
      minimum_effect: >-
        Within [0.8, 1.25] at the largest n for all three shapes (H1). A shape
        outside the band is a structural finding that changes the law on the
        note's invertible column, and is reported as the record's main result
        if it occurs.
    - metric: M3 -- Lemma V arm, false certificates
      direction: lower
      minimum_effect: 'FORCED exactly 0 (a certificate is a verified scalar multiplication).'
    - metric: M4 -- beta = 0 baseline (full-range kangaroo) and the plain rho row
      direction: different
      minimum_effect: Kangaroo 2 sqrt(n) and rho 0.886 sqrt(n) each reproduced within 10 percent; otherwise the walk implementation is void.
    - metric: M5 -- biased-offset oracle (nearby object)
      direction: lower
      minimum_effect: G2 cost below the uniform-offset G2 cost by a factor in [2.5, 6] (predicted about 4).
    - metric: M6 -- curve arm, D_x(p^alpha) hit rate per step on random toy curves, and the j = 0 beta-closed hit-rate factor
      direction: different
      minimum_effect: >-
        Random curves: ratio to |D_x|/n within [0.9, 1.1] at n about 2^24. j = 0:
        factor in [2.7, 3.3] (forced by the orbit count, up to overlap
        corrections computed exactly). Outside these on random curves: a
        coordinate-walk correlation, routed to RQ-ECDLP-4fcbd3 (bias owner),
        not read here.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the main deliverable). Write Lemma V, G1-G3 with
      both G2 branches and the G1 multi-hit check, the phase diagram, the
      pricing table with a source per row, and the alpha = 1 ceiling; hash it.
      STAGE 1 (planted pipeline on NULL-1; about a CPU-day). n in {2^22, 2^24,
      2^26} (prime n); the 16 (alpha, beta) cells of M1; arms G1, G2, G3; 30
      targets per cell per n; group operations counted by one frozen counter
      (walk steps, kangaroo steps, table builds, lookups separately); peak
      words traced. Shape arm M2 at alpha in {0.6, 0.7}. Biased-offset arm M5
      at two cells. Lemma V arm at beta = 1 with a planted exact omega.
      Every solve certified by an independent scalar multiplication.
      STAGE 2 (curve hit-rate arm; hours). Toy prime-order curves n about 2^20
      to 2^24: 10 random curves, 2 j = 0 curves, with native chi D_x(p^alpha)
      (alpha in {0.6, 0.7}); r-adding walk with r = 32; hits per step measured
      over 10^7 steps per curve; the j = 0 orbit-class walk on D_x^beta. The
      log table is used ONLY to verify certificates, never by chi.
      OUTCOME TABLE. LAW-HOLDS (M1 within tolerance, M2 in band, controls pass):
      the law becomes the lane's pricing instrument -- decision target (a)'s
      "so that every future cheap-advice proposal can be priced against it" --
      with the strip named as the place recognition matters. SHAPE-EFFECT (M2
      out of band for a log-structured D): the walk-hit process interacts with
      exponent structure; the law is amended on that column and the effect is
      reported as a finding at toy scale. ARTIFACT (M3 nonzero, M4 or M5 or the
      j = 0 factor missed): void.
      FALSIFICATION THRESHOLDS, FIXED NOW: the law is falsified at the tested
      scale iff |tau-hat - tau_law| > 0.07 with CI excluding the law at three
      or more cells of one arm; H1 is falsified iff M2 leaves [0.8, 1.25] for
      any shape at the largest n.
      SEEDS: one PCG64 stream per arm; oracle keys drawn after the cell grid
      is frozen and hash-committed before any target is drawn.
    controls:
      - NULL-1 keyed relabelled Z/n (mandatory; all of Stage 1).
      - NULL-2 matched random prime-order curves (Stage 2).
      - j = 0 beta-orbit positive control (factor 3 in hit rate).
      - Biased-offset oracle (the law must be beaten).
      - beta = 0 kangaroo and rho baselines and the beta = 1 Lemma V arm (forced values).
      - Decay in n across three sizes.
    required_metrics:
      - per cell and arm -- mean and median cost in group operations, tau-hat with CI, peak words
      - hit rate per step by D shape (planted) and on curves (D_x, D_x^beta)
      - Lemma V certificate count and false-certificate count
      - biased-offset cost ratio
      - sha256 of the Stage 0 note, the cell grid and the oracle key commitments

  falsification_conditions:
    - 'F1. |tau-hat - tau_law| > 0.07 with CI excluding the law at three or more cells of one arm: the law is wrong as stated at the tested scale; the deviating arm is re-derived.'
    - 'F2. Hit-rate ratio outside [0.8, 1.25] for any planted D shape at the largest n: H1 falsified; the law is amended on that shape.'
    - 'F3. Any false certificate in the Lemma V arm: implementation bug; void.'
    - 'F4. Kangaroo or rho constant not reproduced at beta = 0, biased-offset gain not seen, or j = 0 factor outside [2.7, 3.3]: instrument void.'
    - 'F5. Timeouts or crashes: infrastructure outcomes (AGENTS.md rule 3), never evidence.'

  confounders:
    - >-
      ORACLE LEAKAGE. A window oracle keyed from the same stream as the
      targets can leak the log; keys are committed before targets are drawn.
    - >-
      SMALL-n EXPONENT FITS. Three sizes over a 16x range give a slope with a
      CI of a few hundredths; polylog factors are visible at this scale and
      are fitted as a nuisance term ln n, reported.
    - >-
      KANGAROO CUTOFF. Kangaroos launched from false candidates are stopped
      at c sqrt(E); the cutoff constant trades false work against missed true
      hits and is fixed in Stage 0 (c = 4).
    - >-
      CLAW TABLE COST. Building T tame points costs T group operations and T
      words; both are charged, never only the lookups.
    - >-
      CURVE-ARM BIAS. A hit-rate deviation for D_x on real curves would be a
      recognizability-side effect owned by RQ-ECDLP-4fcbd3; this record only
      reports it.

  interpretation_limits:
    - Claim tier toy; the law is a derivation-level achievability statement under H1-H3 and is never a lower bound.
    - Planted oracles are not hint families; the pipeline validates bookkeeping, not existence. No natural omega with beta > 0 is claimed.
    - The alpha = 1 ceiling (bit-security amplification) means the law understates what is possible when D is everything.
    - No status change, experiment or approval is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Shape-independent hitting.) For an r-adding walk with r >= 16 on a
        prime-order group, and for D in each of the classes {random set,
        interval of logs, low-weight log set} of density delta with
        n^{-1/2} < delta < 1/2, the number of steps to the first hit of D is
        geometric with mean (1 + o(1))/delta, independently of the class.
      rigorous_support: >-
        Rigorous ingredient: additive walks mix to within a sqrt(log n)
        factor of a random mapping for collision purposes (KR-RHO-93979e,
        Bos-Dudeanu-Jetchev; Kim-Montenegro-Peres-Tetali). Classical statement
        imitated: the hitting time of a set of stationary mass delta by a
        rapidly mixing chain is approximately exponential with mean 1/delta
        when delta times the mixing time is small (Aldous-Fill, recalled).
      validation_plan: >-
        SAMPLE on NULL-1 with planted D of each class at alpha in {0.6, 0.7},
        n in {2^22, 2^24, 2^26}, 10^3 independent first-hit times per cell;
