idea:
  id: IDEA-20260808-c959c7
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRUOV-001
  goal_id: GOAL-QRUOV-001
  title: 'The security-neutrality of QR-UOV''s compression has a forced integer value: the
    derived algebra-polar equations P''(x, t^j x) = 0 are A-multiples of the public equations,
    so their F_q-rank is exactly m*ell and not ell*m*ell -- and measuring that one rank, with
    SNOVA as the positive control, decides neutrality without any attack'
  class: control
  claim: 'QR-UOV''s public map is A-BILINEAR: its coefficient blocks lie in A, so P''(ax,
    y) = a P''(x,y) for a in A. Consequently the derived conditions P''(x, t^j x) = 0 that
    give SNOVA a genuine equation gain (M1-06) collapse for QR-UOV into t^j P''(x,x) = 0,
    which is vacuous in char 2 and a scalar multiple of the original in odd characteristic.
    FORCED PREDICTION: the F_q-rank of the derived equation span is exactly the rank of the
    original span, m*ell (the m A-valued equations, each contributing ell F_q-components),
    with NO gain -- whereas for SNOVA the same measurement returns a strictly larger number.
    CLAIM: this single rank comparison, run with one instrument on three arms (QR-UOV, SNOVA,
    matched flattened plain UOV), is a necessary-and-sufficient test for the "does the ring
    structure hand the attacker a smaller effective system" half of GOAL-QRUOV-001, and its
    value is forced in advance for two of the three arms -- which is what makes it a control
    rather than a fishing expedition.'
  mechanism: A-bilinearity means the algebra action is already inside the public map's symmetry
    group, so applying it yields nothing new; non-A-bilinearity (SNOVA, because of the Q-twists)
    means the action is outside, so applying it yields new equations. The rank of the derived
    span is exactly the measurement of "inside or outside". Compression that preserves A-bilinearity
    is therefore security-neutral with respect to this entire family of derived equations,
    and the claim can be stated as a theorem-shaped statement whose numerical prediction is
    checkable in minutes.
  why_not_a_renamed_known_approach: 'Nearest known method: the folklore claim that QR-UOV
    reduces to UOV over F_{q^ell}, which is an assertion about an equivalence rather than
    a measurement. Nearest internal record: IDEA-20260805-8d9ac0 audits the ell-cancellation
    between QR-UOV and its matched baseline by forced ratios; that record''s forced quantities
    are cost ratios, this record''s forced quantity is the rank of an explicitly constructed
    equation span, and a cost ratio can cancel while a rank does not (and vice versa). IDEA-20260805-bb9f73
    audits the direction of the reduction and proposes an integer r; that r is about identifiability
    of the reduction, not about derived equation rank.'
  predictions:
  - observable: F_q-rank of the derived equation span, three arms
    metric: integer, normalised by the arm's own base equation count
    predicted: 'QR-UOV: ratio exactly 1 (FORCED by A-bilinearity). Matched flattened plain
      UOV: exactly 1 (no algebra to act with). SNOVA: strictly above 1. Any deviation in the
      first two arms falsifies either the derivation or the implementation, and that is the
      point of a forced value.'
  - observable: measured solving degree of the derived system in each arm
    metric: integer
    predicted: Identical to the base system for QR-UOV and plain UOV; strictly lower for SNOVA.
      A drop in the QR-UOV arm would mean A-bilinearity fails in the spec's actual construction,
      which would be a significant finding about QR-UOV.
  - observable: the same measurement after replacing QR-UOV's A-structured blocks with generic
      blocks of the same shape (structure-stripped null)
    metric: rank ratio
    predicted: Ratio 1 as well, because the derived equations only gain when the oil object
      is a module for an algebra the map is NOT bilinear over. This separates "A-bilinear"
      from "has a ring at all".
  minimal_test: 'One instrument, three arms, toy sizes. Arms: (i) QR-UOV-shaped key over A
    = F_q[t]/(f), f irreducible of degree ell, at (q, ell, V, M) = (7, 3, 6, 3) and (11, 4,
    8, 3); (ii) SNOVA at matched flattened dimensions; (iii) plain UOV at the same flattened
    (N, M, O). For each, build the base equation span for one oil vector, adjoin the derived
    equations P''(x, b x) = 0 for b running over an F_q-basis of the coefficient algebra,
    and compute the exact F_q-rank of both spans. Report the ratio. Then solve both systems
    in each arm and report solving degree.'
  controls:
  - 'FORCED-VALUE CONTROL: the QR-UOV and plain-UOV ratios are predicted to be exactly 1 in
    advance. Any other value is an implementation bug, not a finding -- this is the control
    that validates the instrument before its SNOVA reading is believed.'
  - 'SNOVA POSITIVE CONTROL: must return a ratio above 1, otherwise the instrument cannot
    see the effect at all and its QR-UOV reading is uninformative.'
  - 'STRUCTURE-STRIPPED NULL: generic blocks with the same shape but no A-structure.'
  - 'ELL-SWEEP in the QR-UOV arm: the ratio must stay at 1 as ell grows. A ratio that drifts
    with ell indicates numerical or basis error.'
  confounders:
  - In odd characteristic P'(x,x) = 2P(x) is not vacuous, so the a = 1 term must be handled
    separately; QR-UOV's RECALLED q = 127 or 31 is odd and SNOVA's q = 16 is even, so the
    two arms differ in this convention and a careless implementation will manufacture a spurious
    difference. This is the single most likely artifact.
  - The choice of F_q-basis for the coefficient algebra affects the span's presentation but
    not its rank; a rank that depends on the basis is a bug.
  - Flattening conventions must be identical across arms or the comparison is meaningless;
    the instrument must emit its flattening parameters with every reading.
  falsification_conditions:
  - The QR-UOV arm returns a ratio different from 1 (then either A-bilinearity fails in the
    real construction, or the instrument is wrong -- and the plain-UOV arm distinguishes these).
  - The SNOVA arm returns exactly 1 (the instrument cannot see the effect; no conclusion may
    be drawn about QR-UOV).
  - The structure-stripped null returns a ratio above 1 (the effect is not about A-bilinearity).
  interpretation_limits: A rank ratio of 1 shows neutrality with respect to THIS family of
    derived equations only. It does not show that QR-UOV's compression is security-neutral
    in general -- other structures (the block-symmetric shape, the choice of f) are untouched,
    and M1-07 attacks exactly one of them. Toy scale throughout.
  assumptions:
  - QR-UOV's public map is A-bilinear (RECALLED from its construction; the spec read must
    confirm).
  - The oil object is a free A-module in both QR-UOV and SNOVA.
  - Matched flattening conventions are used across arms.
  heuristic_assumptions:
  - id: HA-1
    statement: For a matched flattened plain-UOV key with no algebra structure, the derived
      equation span equals the base span exactly, for every choice of adjoined multiplier,
      with probability 1.
    rigorous_ingredient: 'This is not heuristic at all: with no algebra there is no multiplier
      to adjoin beyond the identity, and P''(x,x) is 0 in char 2 and 2P(x) in odd characteristic.
      The value is forced by algebra, which is why this arm is the instrument''s calibration.'
    distribution_imitated: None -- a forced value, recorded here so that the schema's requirement
      is met honestly rather than by inventing a distribution.
    validation_route: Compute the ratio for 200 plain-UOV keys at each toy cell and confirm
      it is exactly 1 every time. Any exception is a bug report, not data.
    tail_checks: Zero variance expected; any variance at all invalidates the instrument.
  target_complexity:
    time_exponent: No attack. The comparative statement is that the effective equation count
      for one oil vector is m*ell for QR-UOV and up to ell*m*ell^2 for SNOVA at matched flattened
      dimensions; the exponent consequence is carried by M1-06 and is not restated here.
    memory_exponent: Instrument memory is the equation span's coefficient matrix, O((base
      equations) x binom(N+1,2)) field elements, which at toy sizes is megabytes and is reported.
    best_known_baseline: The matched extension-field-UOV baseline declared by GOAL-QRUOV-001,
      and the flattened plain-UOV baseline.
    hidden_overhead_disclosure: None; the instrument computes an exact rank.
    time_memory_tradeoff: Not applicable.
  sota_delta: No attack, no cost delta. The deliverable is a forced-value control that converts
    GOAL-QRUOV-001's neutrality question, for one explicit family of derived equations, from
    an assertion into a measurement, and simultaneously supplies the calibration arm that
    M1-06's SNOVA reading needs to be believed.
  dominated_by: 'n/a (no result claimed) for the attack axis. As an instrument, not dominated:
    frontier rows checked are IDEA-20260805-8d9ac0 (forced cost ratios), -bb9f73 (reduction
    direction), -bd8339 (factorisation type), IDEA-20260801-015 (toy compression comparison),
    and IDEA-20260805-70aa6e (oil object counting). None computes a derived equation rank.'
  estimated_cost: 'Implementation low-medium once M1-06''s builder exists (this is the same
    instrument with two extra arms). Compute low: exact ranks on matrices of a few thousand
    columns.'
  recommended_priority: medium
  honest_prior_of_survival: 'That the QR-UOV ratio is exactly 1: ~0.85 -- the risk is that
    the spec''s construction is not exactly A-bilinear in the way recalled, which would itself
    be the finding. That the instrument distinguishes the arms cleanly: ~0.9. That the result
    changes anyone''s view of QR-UOV: ~0.2, honestly -- its main value is as the calibration
    that makes the SNOVA reading trustworthy.'
  novelty_status: unverified
  novelty_screen: Same corpus screen as M1-03, plus IDEA-20260805-8d9ac0, -bb9f73, -bd8339
    titles/claims and H-QRUOV-677301, H-QRUOV-e8ae3e statements. No corpus record constructs
    the derived algebra-polar equation span for any scheme. WEB NOT CHECKED.
  discriminated_from: 'IDEA-20260805-8d9ac0: forced COST ratios between QR-UOV and the matched
    baseline; this record''s forced quantity is an equation-span RANK, and the two are independent.
    IDEA-20260805-bb9f73: quantifier-order audit of the reduction''s direction. M1-06 (this
    file): the same construction with the opposite predicted outcome -- the pair is the experiment.'
