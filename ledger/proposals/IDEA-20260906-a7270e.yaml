    "claim": "An explicit lattice-point discrepancy bound for the collision-slope unions can turn a schedule-specific grumpy mean into a certified interval for its limit; failure of uniform phase control can demonstrate that the proposed constant depends on the arithmetic schedule subsequence. Zero established exponent gain.",
    "mechanism": "The representation is a union of modular lattice slices with multiplicities forgotten only after exact inclusion–exclusion, paired with Sigma={increase a fixed round-robin horizon}. It is partial-action on the collision incidence arrangement, not point translation. The discarded labels are recovered only for overlap certificates; their number is charged.\n\nFor fixed M and horizon t, write the three pair-collision congruences in integer boxes, including modular wraps and division by 2. Decompose each intersection into floor-sum cells. Maintain upper and lower counts with an explicit boundary-cell budget B_t. Summing B_t/N over horizons bounds the error in E[T], rather than assuming that a pointwise limiting covered density may be integrated. The key test is whether sum_t B_t=O(N) uniformly in M=floor(mu sqrt(N)) and the residue phases; if only O(N log N) is available the normalized error is still O(log(N)/sqrt(N)), whereas a bulk O(N^{3/2}) discrepancy does not certify a limit. This audits the integration and limit interchange, not the already-known finite union identity.",
