  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 26 has degree 676 and multiplication by 25 has degree 625
  class: measurement
  claim: >-
    Multiplication by 26 has degree 676. Multiplication by 25 has
    degree 625. Six hundred seventy-six exceeds six hundred
    twenty-five by 51. The product of the two degrees is 422500. Their
    sum is 1301. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 625 and 576.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-six squared is 676. Twenty-five squared is 625. Two
    maps of degree 625 have gap 0 and product 390625. No point is mapped.
  novelty_status: unverified
  citations:
