idea:
  id: IDEA-20260809-5a36f3
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Cost RSA and ECDLP under ONE pipeline, because they are always compared
    across papers that do not share assumptions
  class: composition
  claim: >-
    The routine statement that elliptic-curve keys fall to a quantum adversary
    sooner or more cheaply than RSA keys is assembled from estimates in different
    papers with different physical assumptions and different circuit
    optimizations. The claim is that costing both under a single assumption set,
    with this program's own arithmetic-layer counts, produces a RATIO whose value
    differs from the ratio implied by the published pairs, and that the difference
    is attributable to specific assumption mismatches that can be named.
  mechanism: >-
    Instantiate one pipeline twice, changing only the arithmetic layer (modular
    exponentiation versus elliptic-curve point addition and its group order), and
    report the ratio of physical qubits and of wall-clock time with everything
    else held fixed.
  why_not_a_renamed_known_approach: >-
    Both estimates exist. The like-for-like comparison at fixed assumptions is
    what does not, and it is the specific quantity this program's ECDLP lane
    needs when reasoning about the relative urgency of its own work.
  predictions:
  - observable: qubit and time ratio between the two problems under one assumption set
    metric: two ratios with the assumption set listed
    predicted: >-
      Different from the ratio obtained by dividing published headline numbers.
      Agreement would mean the published assumptions are effectively aligned,
      which is worth establishing rather than presuming.
  - observable: contribution of each assumption mismatch to the difference
    metric: decomposition of the ratio difference by assumption
    predicted: Dominated by one or two assumptions; identifying which is the practical output.
  minimal_test: >-
    Run both problems through the pipeline at several assumption sets including
    each published paper's own, and report the ratio and its decomposition.
  controls:
  - 'SINGLE-CHANGE CONTROL: the two runs must differ only in the arithmetic layer; any other difference makes the ratio incomparable.'
  - 'PAPER-ASSUMPTION REPRODUCTION: each paper''s own ratio must be recoverable by adopting its assumptions, confirming the pipeline can express them.'
  falsification_conditions:
  - The pipeline cannot express one paper's assumption set, in which case the comparison is incomplete and says so.
  - The ratio difference cannot be decomposed by assumption, indicating strong interactions that must be reported instead of a decomposition.
  interpretation_limits: >-
    A ratio under stated assumptions is not a statement about which cryptosystem
    will be broken first, and no timeline, ordering-in-time or migration
    implication may be drawn or recorded.
  sota_delta: 'No feasibility claim. Delta: a like-for-like ratio with a decomposition, replacing a cross-paper division.'
  dominated_by: Downstream of IDEA-20260809-593de3; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the pipeline; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for quantum resource estimate: no records. WEB NOT CHECKED.'
  source_refs:
  - Published RSA and ECC quantum resource estimates -- RECALLED, REQUIRED READS.
