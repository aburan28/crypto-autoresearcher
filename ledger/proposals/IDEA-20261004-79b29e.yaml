# IDEA-20261004-79b29e
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-79b29e
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 23 has degree 529 and multiplication by 22 has degree 484
  class: measurement
  claim: >-
    Multiplication by 23 has degree 529. Multiplication by 22 has
    degree 484. Five hundred twenty-nine exceeds four hundred
    eighty-four by 45. The product of the two degrees is 256036. Their
    sum is 1013. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 484 and 441.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-three squared is 529. Twenty-two squared is 484. Two
    maps of degree 484 have gap 0 and product 234256. No point is mapped.
  novelty_status: unverified
  citations:
