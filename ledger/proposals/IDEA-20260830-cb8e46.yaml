  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE, one page. Write the tensor-CRT argument
      for general m and check the m = 2 B = 1 and m = 3 B = 2 boundary cells by
      hand. If the m = 3 planted cell does not give {x1 - v_i, x2 - v_j,
      x3 - v_k}, stop and report.
      STAGE 1, MINUTES. Implement Z_m directly from the group law - for each
      (m-1)-tuple of factor-base points compute the 2^{m-1} signed sums with R,
      take x-coordinates, intersect with V. No summation polynomial is used on
      this path at all, and that independence is the entire value of the check.
      Implement I(Z_m) by Buchberger-Moeller in grevlex.
      STAGE 2, THE m = 2 GRID, MINUTES. p in {2^8, 2^10, 2^12} in scope plus
      2^14 and 2^16 flagged as out-of-scope calibration, B in {4, 8, 16, 32},
      5 seeds, targets STRATIFIED so |Z_2| takes each of 0, 1, 2, 3 at least 20
      times. Compare harness observables against Stage 1 field by field.
      STAGE 3, THE m = 3 GRID, THE BLOCKING ARM, TENS OF MINUTES. This requires
      building an S_4 decomposition measurement, which HAS NO IMPLEMENTATION IN
      harness/semaev.py TODAY - only s4_expr exists, and KN-OPEN-5b3a08 records
      that this exact function was wrong on the result path of 21 archived runs
      before the committed fix. So Stage 3 begins with an EXACT WITNESS CHECK -
      plant P1 + P2 + P3 = R and require s4_expr(a,b) to evaluate to 0 at
      (x(P1), x(P2), x(P3), x(R)) on at least 200 planted witnesses - and is
      abandoned if that check fails. Cells - p in {2^8, 2^10, 2^12},
      B in {4, 6, 8}, 5 seeds, targets stratified for |Z_3| in {0,1,2,3}. B is
      capped at 8 at m = 3 BECAUSE OF THE MEMORY CONTRACT, see the envelope
      below.
      STAGE 4, THE CHAINED ARM, MINUTES. Same p and B as Stage 3 in the
      variables (x1,x2,x3,u). Report per cell - deg gcd, whether d_c is
      squarefree, and the residue-field degrees. Compare the total quotient
      dimension against the count of distinct rational solutions.
      STAGE 5, THE BLOCKING NEARBY-OBJECT CONTROL, MINUTES. Non-squarefree
      membership fV times (x - v_1) at m = 2. The standard-monomial count must
      strictly exceed the distinct-solution count.
      STAGE 6, ZERO COMPUTE. Report. If everything matches, propose to the
      Coordinator a section-4 closure of the fV-encoded ideal-invariant
      instrument at every arity, with forward guidance naming
      IDEA-20260830-ad0be4 and IDEA-20260830-84cdb7. Never a status change -
      that is the Coordinator's authority alone.
      MEMORY ENVELOPE, STATED EXPLICITLY BECAUSE THIS PROGRAM HAS A LIVE
      MEMORY WALL. The 2026-08-28 GOAL-DREG-001 attempt stopped as
      resource_exhaustion at roughly 12 GiB against an 8 GiB contract with a
      768,212-column monomial space and its rank kernel never invoked - an
      INFRASTRUCTURE stop under AGENTS rule 3, never negative mathematical
      evidence. This test cannot reproduce it because IT NEVER BUILDS A
      MACAULAY MATRIX. The largest object anywhere here is a polynomial in at
      most 4 variables of degree at most B in each - at m = 3, B = 8 that is at
      most 9^3 = 729 monomials, and at m = 2, B = 32 at most 33^2 = 1089. Every
      stage runs a PRE-FLIGHT monomial count and ABORTS BEFORE ALLOCATION if
      the count exceeds 50,000 or the projected working set exceeds 2 GiB, on a
      host with 14 cores and 48 GB. Peak RSS is a required reported metric so
      the sub-2-GiB prediction can fail.
    controls:
      - >-
        MATCHED-Z INTERPOLATED NULL at m = 2 and m = 3 (blocking for every
        ideal-invariant claim). Replace S_{m+1} by a grid-interpolated
        polynomial with the same vanishing pattern. Reduced bases and
        staircases must be IDENTICAL. This is the inventor-protocol section 3
        null-object control.
      - >-
        NON-SQUAREFREE MEMBERSHIP NEARBY OBJECT (blocking). The method must
        NOT conclude degeneracy here, and the standard-monomial count must
        strictly exceed the distinct-solution count.
      - >-
        2-TORSION-LOADED CHAINED ARM. A factor base deliberately containing a
        2-torsion x-coordinate must produce a non-reduced fibre algebra at a
        measurable rate, demonstrating the instrument can see multiplicity
        when it exists rather than being blind to it.
      - >-
        SATISFIABLE AND UNSATISFIABLE ARMS. Targets with |Z_m| = 0 must give
        the unit ideal; targets with |Z_m| >= 1 must not. An instrument
