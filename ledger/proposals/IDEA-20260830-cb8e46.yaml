idea:
  id: IDEA-20260830-cb8e46
  question_id: RQ-SDEG-001
  added: '2026-08-30'
  title: >-
    THE CRT DEGENERACY IS ARITY-UNIVERSAL, SURVIVES THE CHAINED TREE ENCODING,
    AND GETS STRICTLY WORSE AS p GROWS, SO RQ-SDEG-001 HAS NO MEDIUM LEG AS
    POSED - the S_4 nearby-object control that IDEA-20260829-bdca13 declares
    blocking and predicts must fail is here derived to SUCCEED at every m, the
    free-auxiliary-variable escape is closed by Theorem C of KN-FIND-a8990a
    plus the discriminant identity, and the expected decomposition count
    2^m B^m / p forces either B of order p^{1/m} (a single generator of degree
    2^21 at 64 bits) or planted targets whose staircase is fixed by
    construction
  class: mechanism

  claim: >-
    Let E be y^2 = f(x) = x^3 + ax + b over F_p, p > 3, let V be a set of B
    DISTINCT x-coordinates of F_p-rational points, fV(x) the product over v in V
    of (x - v), and let R be an affine target with x-coordinate xR.
    (A) ARITY-UNIVERSALITY. For EVERY m >= 2 the direct decomposition ideal
    I_m = (S_{m+1}(x_1,...,x_m,xR), fV(x_1), ..., fV(x_m)) in F_p[x_1,...,x_m]
    is radical, zero-dimensional, and equal to the vanishing ideal I(Z_m) of
    Z_m = {v in V^m such that S_{m+1}(v, xR) = 0}, with
    dim_{F_p} F_p[x]/I_m = |Z_m| exactly. Proof, and it is three lines - the
    membership quotient factors as a TENSOR PRODUCT of m split etale algebras,
    tensor_{i=1..m} (F_p[x_i]/fV(x_i)) = F_p^{V^m} by CRT applied once per
    variable; adjoining a single element of a product of fields kills exactly
    the coordinates where that element is nonzero and can do nothing else. The
    number of variables NEVER ENTERS. Consequently bdca13's own declared
    BLOCKING nearby-object control - "the degeneracy argument must NOT extend
    unchanged" at m = 3 - is predicted here to FAIL: it does extend unchanged,
    and by bdca13's own falsification clause the conclusion re-scopes from
    "m = 2 is degenerate" to "the squarefree split membership encoding is
    degenerate at every arity", which is the statement RQ-SDEG-001 needs
    because RQ-SDEG-001 declares an S_4 leg.
    (B) THE CHAINED TREE DOES NOT ESCAPE EITHER, AND THE REASON IS THIS
    PROGRAM'S OWN THEOREM C. The natural escape is a FREE auxiliary variable -
    the resultant-tree encoding J = (S_3(x_1,x_2,u), S_3(u,x_3,xR), fV(x_1),
    fV(x_2), fV(x_3)) in F_p[x_1,x_2,x_3,u], where u is NOT constrained to V.
    Here the quotient is NOT a product of copies of F_p a priori - it is the
    product over grid cells c = (v_1,v_2,v_3) of F_p[u]/(d_c), where
    d_c = gcd(S_3(v_1,v_2,u), S_3(u,v_3,xR)) because F_p[u] is a PID - so this
    encoding CAN in principle carry residue-field and multiplicity data that a
    grid incidence pattern cannot. It does not, and both halves are already
    committed in this corpus. Residue fields are all F_p because both fibre
    polynomials have ALL their known arguments on the factor-base locus, so
    Theorem C of KN-FIND-a8990a forces complete splitting over F_p and d_c is
    a product of distinct linear factors unless a root repeats. A root repeats
    only where the discriminant vanishes, and disc_T S_3 = 16 f(t_1) f(t_2)
    exactly, so multiplicity requires f(v_1) f(v_2) = 0 or f(v_3) f(xR) = 0 -
    a 2-torsion x-coordinate in the factor base or a 2-torsion target - or the
    leading-coefficient degeneration v_1 = v_2 respectively v_3 = xR. Hence
    the chained quotient is reduced off a stratum of density O(B/p) + O(1/B),
    and outside that stratum J is again the vanishing ideal of a finite set of
    F_p-rational points.
    (C) THE MEDIUM LEG IS AN ARITHMETIC NO-GO, NOT A BUDGET PROBLEM. By
    Theorem C each of the B^{m-1} choices of m-1 factor-base coordinates gives
    exactly 2^{m-1} candidate last coordinates in F_p (the signed sums), each
    landing in V with probability about B/|X| = 2B/p (1 + O(t/p)), so
    E|Z_m| = 2^m B^m / p (1 + O(t/p)). Reading this at RQ-SDEG-001's declared
    ladder - toy first, MEDIUM after protocol approval - gives the decisive
    number. At medium p = 2^64 and m = 3, |Z_3| reaches 1 only at
    B of order p^{1/3} = 2^{21.3}, at which point fV is a SINGLE UNIVARIATE
    GENERATOR OF DEGREE 2^21 and the Groebner instrument is out of reach by
    roughly fifteen orders of magnitude in the monomial count; and at any
    feasible B the ideal is the UNIT ideal with probability 1 - 2^m B^m / p,
    so the committed observables are the constants (1, 0, true). The only
    remaining option is planted targets, under which |Z_m| is fixed BY
    CONSTRUCTION and the staircase is a designed constant. Either way there
    is no scaling law in p to fit, at any compute budget, and the honest
    answer to RQ-SDEG-001's decision target under this encoding is that the
    numerator cannot be measured here - not that it is expensive.
    (D) WHAT REPLACES IT, STATED SO THE RECORD IS NOT A FATIGUE REPORT. Z_m is
    computable WITHOUT ANY GROEBNER COMPUTATION in 2^{m-1} B^{m-1} group
    operations plus a hash-table membership test, and the reduced Groebner
    basis of I_m in any order then follows from Z_m alone by
    Buchberger-Moeller. So the charged decomposition cost this question is
    supposed to model is bounded above, unconditionally and with no fitting,
    by the enumerative oracle; a fitted Groebner cost model is an upper bound
    on an upper bound. Forward guidance names two live classes and this record
    proposes both as siblings - measure a GENERATOR-level observable, which is
    provably not an ideal invariant (IDEA-20260830-ad0be4), or change the
    presentation so that generator degrees stop growing with B
    (IDEA-20260830-84cdb7).

  mechanism: >-
    THE TRACKED OBJECT AND WHERE IT IS FORCED TO CHANGE. The object followed
    through the computation is the FIBRE ALGEBRA over a grid cell - the local
    ring the quotient contributes at each point of V^m (direct encoding) or
    V^3 (chained encoding). In the direct encoding at every arity that algebra
    is F_p or zero, so the object degenerates to a boolean incidence pattern.
    In the chained encoding it is F_p[u]/(d_c), which has room for a quadratic
    residue field and for multiplicity - and this record's content is that
    both rooms are shut by results this program already derived, complete
    splitting on the factor-base locus and the exact discriminant identity.
    That is why the escape has to be argued rather than assumed, and why the
    argument is short.
    LOSSY-PROJECTION TEST, APPLIED. The projection state maps to (isomorphism
    class of the fibre algebra at each cell) is genuinely lossy - from it one
    cannot recover S_{m+1}, the curve coefficients, p, or the target beyond
    what the vanishing pattern implies. It discards compatibly with the
    target's operations, and that is the load-bearing half - ring operations
    in the membership quotient factor through the CRT idempotents indexed by
    cells, so normal-form reduction, S-polynomial reduction and every step of
    any Groebner algorithm act coordinatewise, and the projection propagates
    deterministically one step at a time. The contrasting FAILURE is recorded
    rather than hidden - the pair (x_1 + x_2, x_1 x_2) loses nothing because
    the unordered pair is the root set of a quadratic (KN-LIT-7595's worked
    failure), and the digit re-encoding of IDEA-20260830-84cdb7 also fails
    this test as an object, for reasons that record states itself.
    WHY ARITY WAS THE PLAUSIBLE ESCAPE AND WHY IT IS NOT. bdca13 reasons that
    at m >= 3 "the SEARCH is now over a 3-dimensional grid and the added
    structure is a hypersurface rather than an evaluation vector". The second
    clause is where it goes wrong - the image of a polynomial in a product of
    fields IS an evaluation vector no matter how many variables the polynomial
    has, because the product decomposition is indexed by POINTS of the grid,
    not by coordinates of the ambient space. The hypersurface intuition is
    about the ambient A^m; the algebra is about V^m. Nothing about
    S_{m+1} enters the argument except the values it takes on the grid.
    WHY p HURTS RATHER THAN HELPS, WHICH IS THE OPPOSITE OF THE QUESTION'S
    PREMISE. RQ-SDEG-001 is built on the expectation that toy instances are
    small and medium instances will be informative. Under (C) the informative
    content of an instance is |Z_m|, which DECREASES like B^m / p at fixed B.
    So scaling p with a feasible factor base drives the instrument toward the
    unit ideal, monotonically. The premise is inverted, and this is checkable
    at toy scale by measuring the unit-ideal fraction against 1 - 2^m B^m / p
    on a p-ladder.

  novelty_status: unverified

