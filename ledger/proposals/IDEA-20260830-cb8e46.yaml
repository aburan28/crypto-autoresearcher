  assumptions:
    - >-
      p > 3, E non-singular in short Weierstrass form, matching RQ-SDEG-001's
      declared scope of short_weierstrass generic ordinary curves over prime
      fields.
    - >-
      The factor base consists of DISTINCT x-coordinates of F_p-rational
      points, so fV is squarefree and splits completely over F_p. This is the
      one structural precondition of part (A) and it is CHECKED per instance,
      never assumed - both harness scopes satisfy it by construction.
    - >-
      The target R is affine and S_{m+1}(., xR) is not identically zero on the
      grid, which fails only in degenerate cases enumerated in the confounders.
    - >-
      Part (C)'s expectation uses |X|, the number of x in F_p with f(x) a
      square, computed from the true curve order rather than approximated by
      p/2. The trace term is carried, not dropped.
    - >-
      Part (B)'s density statement assumes V is drawn without regard to the
      2-torsion x-coordinates. A deliberately 2-torsion-loaded factor base
      makes the non-reduced stratum arbitrarily large and is therefore a
      SEPARATE arm, reported separately, not a counterexample.

  proof_search_map:
    bottleneck: >-
      The step "solve the decomposition system by Groebner basis and read a
      solving degree off it", which is the numerator RQ-SDEG-001 exists to
      model. This record asserts that under the fV encoding, at EVERY arity
      and in both the direct and the chained presentation, that step computes
      an object determined by a point set which is itself obtainable in
      2^{m-1} B^{m-1} group operations, so removing the step changes the cost
      model completely while changing no mathematics.
    baseline_embedding:
      parameter_slice: >-
        Two exactly hand-checkable slices per arity. m = 2, B = 1 - the grid is
        a single cell and I is either the maximal ideal (x1 - v, x2 - v) or the
        unit ideal. m = 3, B = 2 with exactly one vanishing cell - the reduced
        Groebner basis must be exactly {x1 - v_i, x2 - v_j, x3 - v_k}. These
        are the boundary cases part (A) must reproduce, and they are computed
        by hand before any battery runs.
      reproduction_check: >-
        Frozen regression fixture. Take the exact instance, seed, factor base
        and target of an existing committed EXP-SEMAEV-family run record; re-run
        it through harness.semaev.measure_s3_decomposition AND through an
        independent Buchberger-Moeller computation of I(Z_2) built from Z_2
        alone, where Z_2 is obtained by group arithmetic with NO use of the
        summation polynomial. Exact equality of the two reduced bases,
        polynomial by polynomial, is the reproduction check. Any inequality
        halts the line and is reported as an instrument finding under
        KN-OPEN-5b3a08's precedent, never as evidence about solving degree.
    observation_collision:
      observable: >-
        The triple (groebner_basis_size, groebner_basis_max_degree,
        is_trivial_ideal) at m = 2, its m = 3 analogue, and the standard
        monomial count.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED at every arity - that is the content,
        not an accident. Build, at matched Z_m, (a) the genuine Semaev system
        and (b) a synthetic system with S_{m+1} replaced by ANY polynomial
        vanishing on exactly Z_m within the grid and nowhere else in the grid,
        obtained by grid interpolation. Part (A) forces the two to generate the
        SAME ideal and therefore to produce byte-identical reduced bases and
        identical staircases. A collision here does not falsify the
        measurement, it CALIBRATES it and bounds every conclusion drawn from
        it. This record prohibits reporting a Semaev solving-degree number from
        an ideal invariant without having run this search. The complementary
        question - whether GENERATOR-level observables also collide - is
        deliberately NOT settled here and is the whole subject of
        IDEA-20260830-ad0be4.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question "what does the toy Groebner cost measure at arity
          m" into the CRT decomposition of the membership quotient, where it
          becomes the exact equality F_p[x_1..x_m]/I_m = F_p^{Z_m} - a
          dimension and vanishing condition instead of solver behaviour.
          Obligations discharged separately - encoding (fV squarefree and
          split), completeness (Z_m is the whole variety and consists of
          rational points), soundness (no nilpotents, so no embedded structure
          is lost), transfer (STATED TO FAIL for non-squarefree membership and
          for factor bases not contained in F_p), cost loss (none, the
          reduction is free).
        predicted_gain: >-
          Replaces a per-cell empirical curve at every arity with one integer
          |Z_m| plus a combinatorial staircase, at zero compute, and converts
          the medium-scale feasibility question into the closed expression
          2^m B^m / p. NO ATTACK EXPONENT IS MOVED.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed and vary the forgotten structure - the
          curve, p, the coefficients of S_{m+1}, and the ARITY itself - then
          look for an intrinsic invariant separating the resulting systems.
          The prediction is that none exists at any m under this encoding,
          because the fibre of the observable over Z_m is the entire space of
          polynomials with that grid vanishing pattern.
        predicted_gain: >-
          A clean statement of what the instrument cannot see at any arity,
          which is the content of the forward guidance and the reason the two
          sibling records exist.
    quantifier_order: >-
      CLAIMED. FORALL primes p > 3, FORALL m >= 2, FORALL short-Weierstrass
      non-singular E over F_p, FORALL finite sets V of DISTINCT x-coordinates
      of F_p-rational points, FORALL affine targets R, EXISTS a finite set
      Z_m contained in V^m, given EXPLICITLY IN ADVANCE by the group law as
      the grid restriction of the signed-sum correspondence and computable
      before any Groebner call, such that FORALL monomial orders the reduced
      Groebner basis of I_m equals the reduced Groebner basis of I(Z_m).
      The dangerous weaker reading, NOT claimed and vacuous, is - FORALL
      instances EXISTS SOME point set with the same basis, which is true of
      every zero-dimensional radical ideal by definition. The content is the
      order of the quantifiers - Z_m is produced before the solver runs.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every arity m, over prime fields, with a factor base imposed by a
        squarefree completely split membership polynomial, in either the direct
        or the chained presentation, the IDEAL-INVARIANT Groebner observables
        of the decomposition system carry exactly the information in the grid
        point set and no more, and that point set is computable in
        2^{m-1} B^{m-1} group operations." It can NEVER certify anything about
        GENERATOR-dependent quantities such as solving degree, first fall
        degree or last fall degree - those are not ideal invariants and are
        outside this record's reach by construction. It certifies nothing
        about extension fields, nothing about the boolean chained systems of
        GOAL-DREG-001, which use a different encoding, and nothing about the
        difficulty of the ECDLP.
      nearby_object_control: >-
        THE NON-SQUAREFREE MEMBERSHIP INSTANCE, and it is blocking. Replace
        fV by fV times (x - v_1), so that one factor-base value is a DOUBLE
        root. The quotient acquires a nilpotent, the ideal is no longer
        radical, and the standard-monomial count must EXCEED the number of
        distinct grid solutions. If the method concludes degeneracy here too,
        it has not identified the load-bearing structure and is merely
        detecting that the system is zero-dimensional. A second, weaker nearby
        object is the 2-torsion-loaded chained instance of part (B), where the
        quotient must be non-reduced at a measurable rate.
    proof_obligations:
      - claim: >-
          The tensor product of m split squarefree univariate quotients is
          F_p^{V^m}.
        responsibility: correctness
      - claim: >-
          Adjoining one element to a finite product of fields kills exactly the
          coordinates where it is nonzero.
        responsibility: correctness
      - claim: >-
          I_m is radical and equals I(Z_m) at every m, with quotient dimension
          exactly |Z_m|.
        responsibility: strictness
      - claim: >-
          In the chained encoding the quotient is the product over cells of
          F_p[u]/(gcd) and every such gcd splits over F_p on the factor-base
          locus.
        responsibility: correctness
      - claim: >-
          The chained quotient is non-reduced only on the 2-torsion or
          leading-coefficient stratum, of density O(B/p) + O(1/B).
        responsibility: size
      - claim: >-
          E|Z_m| = 2^m B^m / p (1 + O(t/p)) at a uniform random factor base
          and uniform random target.
        responsibility: size
      - claim: >-
          Harness observables equal the independently computed I(Z_m)
          observables on the frozen fixture at m = 2 and m = 3.
        responsibility: baseline
      - claim: >-
          The non-squarefree nearby object is NOT concluded degenerate.
        responsibility: scope
      - claim: >-
          Every Macaulay-free step of the test stays under the declared memory
          contract, checked by a pre-flight monomial count that aborts before
          allocation.
        responsibility: memory

  predictions:
    - metric: >-
        agreement between harness-reported ideal-invariant observables and the
        same quantities computed independently from Z_m by Buchberger-Moeller,
        at m = 2 AND m = 3, direct encoding
      direction: different
      minimum_effect: >-
        FORCED EXACT on every cell of the grid described in minimal_test. A
        single disagreement at either arity is either a harness defect or a
        refutation of part (A), and this record commits in advance to
        hand-deriving the disagreeing cell and reporting which, with no edit to
        any prior record.
    - metric: >-
        standard-monomial count of the reduced Groebner basis versus |Z_m|,
        m = 2 and m = 3
      direction: different
      minimum_effect: >-
        FORCED EQUAL exactly in every cell whose factor base is squarefree.
        This is the sharpest single integer in the record - a mismatch of 1
        refutes part (A). On the non-squarefree nearby-object arm the count
        must be STRICTLY GREATER, by at least 1, which is the control proving
        the instrument can see non-radicality when it is there.
    - metric: >-
        bdca13's declared blocking m = 3 nearby-object control
      direction: different
      minimum_effect: >-
        PREDICTED TO REPRODUCE THE DEGENERACY UNCHANGED, which is the exact
        outcome bdca13 pre-registers as forcing a re-scope of its own
        conclusion. Concretely - at m = 3 the standard-monomial count equals
        |Z_3| and the reduced basis equals that of I(Z_3), on at least 40 cells
        with |Z_3| >= 1. If instead any m = 3 cell shows quotient dimension
        different from |Z_3| with a squarefree factor base, THIS record is
        wrong and bdca13's arity intuition is right, which is the most
        informative possible negative here.
    - metric: >-
        fraction of chained-encoding cells whose fibre algebra F_p[u]/(d_c) is
        NON-REDUCED, as a function of p at fixed B
      direction: lower
      minimum_effect: >-
        PREDICTED to decrease at least as fast as c B / p across
        p in {2^8, 2^10, 2^12, 2^14, 2^16}, i.e. a fitted p-exponent at or
        below -1 with the fit's confidence interval excluding 0. A fraction
        that is FLAT in p, or that fails to fall below 1 percent by p = 2^16,
