  falsification_conditions:
    - >-
      Any cell at either arity where harness observables differ from the
      independently computed I(Z_m) observables with a squarefree factor base.
      Either part (A) is false or the harness is not computing the stated
      ideal; the record commits in advance to hand-deriving the disagreeing
      cell and reporting which.
    - >-
      Standard-monomial count differs from |Z_m| in any squarefree cell.
      Part (A) is refuted.
    - >-
      The m = 3 arm shows a quotient that is not F_p^{Z_3}. The arity-universal
      claim is false, bdca13's blocking control was right, and the m >= 3
      instrument is NOT degenerate - the outcome that would rescue
      RQ-SDEG-001's S_4 leg as posed and would be the most valuable negative
      this record can produce.
    - >-
      The chained non-reduced fraction is flat in p, or stays above 1 percent
      at p = 2^16. Part (B) is refuted and the chained tree is a live
      non-degenerate encoding; the lane should move there rather than to the
      siblings.
    - >-
      The measured unit-ideal fraction departs from 1 - 2^m B^m / p beyond
      binomial error at three or more cells. Part (C)'s arithmetic no-go loses
      its quantitative basis and the medium-leg conclusion must be withdrawn.
    - >-
      The non-squarefree nearby object also comes out radical. The method is
      detecting zero-dimensionality rather than the membership encoding, and
      the scope of every conclusion collapses accordingly.
    - >-
      The matched-Z interpolated null gives DIFFERENT reduced bases at equal
      Z_m. Part (A) is refuted at its sharpest point, and the surviving
      difference is a genuine summation-polynomial signal in an ideal
      invariant - the most valuable possible outcome of this record and the
      reason the null is run rather than assumed.
    - >-
      Everything matches. The fV-encoded ideal-invariant instrument is closed
      at the section-4 standard at every arity, RQ-SDEG-001's medium leg is
      reported as arithmetically unreachable under this encoding, and the
      forward guidance is the two sibling records.

  confounders:
    - >-
      STRATIFICATION BIAS. Targets are deliberately stratified by |Z_m| because
      random targets at these parameters give |Z_m| = 0 most of the time. The
      stratification is a sampling design, not a result, and NO yield or
      coverage statement may be read off this battery - yield belongs to
      KN-FIND-007 and its siblings. The unit-ideal-fraction prediction is the
      one arm that must use UNSTRATIFIED random targets, and it is run
      separately for exactly that reason.
    - >-
      SYMPY MODULUS SEMANTICS. sympy.groebner with modulus=p must genuinely
      compute over F_p. If it lifts to Z or applies the modulus only at output,
      every committed observable in this lane is of a different ideal. Checked
      directly by planting a cell whose answer over Z and over F_p provably
      differ.
    - >-
      REDUCED VERSUS NON-REDUCED BASES, AND ORDER. Basis size and max degree
      are order-dependent; comparisons are only ever between REDUCED bases in
      the SAME order, frozen to grevlex before any cell runs. Order-dependence
      of the SOLVING degree is a different matter entirely and is outside this
      record.
    - >-
      DEGENERATE TARGETS. If xR is in V, if f(xR) = 0, or if V contains a
      2-torsion x-coordinate, the leading coefficients and the fibre analysis
      change. These cells are enumerated and reported separately rather than
      excluded silently.
    - >-
      THE S_4 INSTRUMENT DOES NOT EXIST YET. Building it is a prerequisite of
      Stage 3 and inherits the KN-OPEN-5b3a08 Q1 risk directly. A Stage 3
      result obtained without the exact-witness gate is not admissible.
    - >-
      WHOLE-CURVE FACTOR-BASE SAMPLING. build_factor_base defaults to
      full_curve rather than the target subgroup (KN-OPEN-5b3a08 Q2). Part (A)
      is indifferent to this - it needs only distinctness - but part (C)'s
      yield expectation is NOT, so the yield arm must declare its scope and use
      the target_subgroup option or report the cofactor.
    - >-
      SCOPE LEAKAGE TO DREG. The boolean chained systems of GOAL-DREG-001 use a
      DIFFERENT encoding and this record says nothing about them. Any reader
      concluding that the DREG measurements are also degenerate is reading
      beyond the record.

  interpretation_limits:
    - >-
      This is an INSTRUMENT result, not a mathematical result about the ECDLP
      or about summation polynomials. No attack, no exponent, no hardness
      claim.
    - >-
      It is scoped to IDEAL-INVARIANT observables. It says NOTHING about
      solving degree, first fall degree, last fall degree, or Macaulay rank
      profiles, all of which depend on the generating set and are outside its
      reach by construction. Reading this record as "the solving degree is
      degenerate" is a claim-tier violation.
    - >-
      Scoped to prime fields, short Weierstrass, squarefree completely split
      membership, and measured p at most 2^16. It does not transfer to
      extension fields, to non-squarefree membership, or to factor bases not
      contained in F_p.
    - >-
      Part (C)'s medium-leg statement is an arithmetic consequence of the
      yield expression plus the Bezout-forced generator degree. It is NOT a
      claim that no medium-scale prime-field solving-degree measurement is
      possible - only that this encoding cannot supply one.
    - >-
      A closure of this instrument is NOT a closure of KN-OPEN-002. How the
      solving degree grows for prime-field summation-polynomial systems remains
      open; what this record would establish is that the ideal-invariant
      instrument cannot answer it at any arity.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the nearest eight
      records were read in full; one external source was fetched this session
      and it is not about this claim. The Buchberger-Moeller citation is
      recalled only. The mathematics is elementary and may well be folklore;
      the honest status is unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Let V be a set of B distinct x-coordinates of F_p-rational points on E
        drawn uniformly, let R be a uniformly random affine target, and let
        |X| = #{x in F_p such that f(x) is a square} = (p - t - r)/2 with t the
        trace and r a small correction from the 2-torsion. Then |Z_m| is
        distributed as Binomial(2^{m-1} B^{m-1}, (B - O(1))/|X|), so
        E|Z_m| = 2^m B^m / p times (1 + O(t/p)) and
        Pr[Z_m empty] = exp(-2^m B^m / p) times (1 + o(1)).
      rigorous_support: >-
        The RIGOROUS ingredients are two and both are already committed here.
        Theorem C of KN-FIND-a8990a fixes the number of candidate last
        coordinates at EXACTLY 2^{m-1} off the branch locus - they are the
        signed sums and they are all in F_p - so the candidate count is exact
        and not estimated; and the exact conservation double count of
        KN-FIND-007 fixes the mean per-target decomposition yield at
        binom(B+m-1,m)/N with measured deviation exactly zero. The CLASSICAL
        DISTRIBUTION IMITATED is the independent-uniform occupancy or
        Poissonisation model - the 2^{m-1} B^{m-1} algebraically determined
        candidate x-coordinates are assumed to behave, with respect to
        membership in V, like independent uniform draws from X. This is the
        same imitation that makes the Gaudry-Diem 1/m! decomposition
        probability agree with the conservation mean.
      validation_plan: >-
        SAMPLE - exhaustive over the COMPLETE target set at p in {2^8, 2^10,
        2^12} (every affine target, not a sample) and 2000 random targets at
        p in {2^14, 2^16}, for 12 generated curves with generic j, B in
        {4, 8, 16, 32} at m = 2 and B in {4, 6, 8} at m = 3, 5 factor-base
        seeds. COMPARISON DISTRIBUTION - the exact Binomial with |X| computed
        from the true curve order by point counting, NOT approximated by p/2;
        the trace term is the whole content of the check at these sizes. TAIL
        CHECKS - (a) observed maximum |Z_m| against the binomial upper tail at
        the 1/1000 level; (b) observed empty-Z fraction against
        exp(-E|Z_m|), which is the KN-FIND-007 coverage bound instantiated;
        (c) chi-square goodness of fit at the 1 percent level per cell, with
        the NUMBER OF FAILING CELLS reported rather than the best cell.
        SAMPLED PARAMETERS RECORDED - p, curve coefficients, curve order,
        trace, |X|, B, m, seed, factor-base scope, target-selection rule.
        TRANSFER ASSUMPTIONS - none is claimed. Nothing is validated above
        p = 2^16 and no extrapolation to cryptographic scale is performed or
        licensed; part (C)'s statement at p = 2^64 is an ARITHMETIC
        EVALUATION of the formula, flagged as conditional on H1 wherever it
        appears.
    - id: H2
      statement: >-
        sympy's grevlex Groebner routine with modulus=p returns the REDUCED
        Groebner basis of the ideal generated by its inputs over F_p, so the
        reported basis size and maximum total degree are properties of the
        ideal and not of the routine's internal strategy.
      rigorous_support: >-
        This is an implementation property, not a mathematical one, and the
        harness module docstring already declines to treat its outputs as
        theoretical quantities, calling them "implementation-bound proxies,
        never the theoretical degree of regularity". The rigorous anchor is
        that the reduced Groebner basis of an ideal in a fixed monomial order
        is UNIQUE, so two correct implementations must agree exactly - which
        converts the assumption into a testable equality rather than a matter
        of trust.
      validation_plan: >-
        SAMPLE - every cell of Stages 2 and 3. COMPARISON - an independent
        Buchberger-Moeller computation of I(Z_m) that never touches the
        summation polynomial, plus a second independent Groebner
        implementation where one is available in the environment. TAIL CHECK -
        the cells with the largest B and the largest |Z_m|, where
        implementation differences are most likely to surface, reported
        individually. A disagreement between two correct implementations is an
        INSTRUMENT FAILURE and is reported as such, never as a finding about
        solving degree.
    - id: H3
      statement: >-
        For a uniformly drawn factor base of size B, the probability that a
        given chained-encoding cell has a NON-REDUCED fibre algebra
        F_p[u]/(d_c) is at most c_1 B / p + c_2 / B for absolute constants
        c_1, c_2, uniformly over p in the tested range.
      rigorous_support: >-
        The RIGOROUS ingredient is the exact discriminant identity
        disc_T S_3 = 16 f(t_1) f(t_2), recorded as exact in Z[x1,x2,A,B] by
        EXP-SMON-e5cbe6 and stated with the complete m = 3 branch locus
        {t_1 = t_2} union {f(t_1) f(t_2) = 0} "and nothing else - verified to
        the exact point count", together with Theorem C which forces complete
        splitting so that only repeated roots, and not irreducible factors,
        can obstruct reducedness. The CLASSICAL DISTRIBUTION IMITATED is the
        uniform-hit model for a fixed algebraic condition of codimension one -
        the at most three 2-torsion x-coordinates are assumed to meet a
        uniformly drawn B-element factor base like B independent uniform
        draws, giving the B/p term, while the 1/B term is the exact density of
        the diagonal v_1 = v_2 in the grid and is not heuristic at all.
      validation_plan: >-
        SAMPLE - the full chained grid of Stage 4, p in {2^8, 2^10, 2^12,
        2^14, 2^16}, B in {4, 6, 8}, 5 seeds, 12 curves, with 2-torsion
        structure of each curve recorded (full rational 2-torsion, one point,
        none). COMPARISON DISTRIBUTION - the predicted c_1 B/p + c_2/B fitted
        by least squares in log-log with the diagonal contribution SUBTRACTED
        analytically first, so the p-dependence is isolated. TAIL CHECKS -
        (a) the curves with full rational 2-torsion, which should show the
        LARGEST non-reduced fraction and are reported separately; (b) the
        single cell with the largest observed non-reduced fraction, reported
        with its curve invariants; (c) a deliberately 2-torsion-loaded factor
        base as a positive control, where the fraction must rise by at least
        an order of magnitude. SAMPLED PARAMETERS RECORDED - p, curve
        coefficients, 2-torsion order, B, seed. TRANSFER ASSUMPTIONS - none;
        nothing above p = 2^16 is validated.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for any
      hard problem and moves nothing. What it states as a cost fact, directly
      relevant to the lane's accounting, is that the m-decomposition test over
      a factor base of size B has an unconditional 2^{m-1} B^{m-1}
      group-operation solution via the signed-sum correspondence of
      KN-FIND-a8990a Theorem C, plus an O(B) hash-table membership test, and
      that the reduced Groebner basis then follows from the resulting point
      set by Buchberger-Moeller with no summation polynomial involved. Any
      Groebner-based decomposition cost is therefore an upper bound on an upper
      bound. For reference the target-keyed meet-in-the-middle does the same
      test in B^{ceil(m/2)} time and B^{floor(m/2)} memory.
    memory_exponent: >-
      O(B) for the group-law derivation and the sweep; O(|Z_m|) for the
      Buchberger-Moeller staircase; at most (B+1)^m dense coefficients for the
      direct Groebner instrument, which at the declared envelope (m = 2 B = 32,
      or m = 3 B = 8) is at most 1089 respectively 729 coefficients. No
      Macaulay matrix is built anywhere in this test, which is precisely why it
      cannot reproduce the 2026-08-28 GOAL-DREG-001 768,212-column stop.
    best_known: >-
      For prime-field ECDLP - Pollard rho at 0.886 sqrt(N) group operations
      with O(1) memory, and BSGS at (N^{1/2}, N^{1/2}). For the
      m-decomposition subtask specifically - the enumerative signed-sum sweep
      at 2^{m-1} B^{m-1} group operations and O(B) memory, and the target-keyed
      meet-in-the-middle at B^{ceil(m/2)} time and B^{floor(m/2)} memory. This
      record improves neither and claims neither.
    hidden_overhead: >-
      The entire content hides inside "with a squarefree completely split
      membership polynomial over F_p". That qualifier is not a technicality -
      a non-squarefree membership polynomial gives a non-radical quotient to
      which none of part (A) applies, which is exactly why the non-squarefree
      instance is the blocking nearby-object control. A second hidden term is
      the "good point" hypothesis of Theorem C - the branch and degeneration
      loci are excluded from parts (B) and (C) and their density, not merely
      their existence, is what H3 makes falsifiable. Third, part (C)'s medium
      statement is an evaluation of H1's formula at p = 2^64, which is far
      outside the validated range and is labelled conditional wherever it
      appears.
    tradeoff_note: >-
      Not applicable to this record, which produces no algorithm. For the
      subtask it references, the tradeoff is the standard one - the
      enumerative sweep is time 2^{m-1} B^{m-1} at memory O(B) and is
      embarrassingly parallel over (m-1)-tuples with no communication; the
      meet-in-the-middle buys time B^{ceil(m/2)} at memory B^{floor(m/2)} and
      parallelizes with the usual distinguished-point machinery. Neither is
      proposed or improved here.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY FRONTIER ENTRY ENUMERATED IN CATALOGUE
    A1-13 AND AGAINST THE IN-CORPUS COST ROWS. As an ATTACK - this record
    mounts none, so it is dominated by every row on every axis - Pollard rho
    (time N^{1/2}, memory O(1), no queries), multi-target rho (sqrt(T N)),
    BSGS (N^{1/2}, N^{1/2}), van Oorschot-Wiener parallel rho, the
    preprocessing frontier S T^2 = Omega~(N), meet-in-the-middle index
    calculus (N^{1/2 + 1/m}, N^{1/2}), and two-term index calculus at its
    optimum. Time, memory and data/queries all checked, none approached, none
    affected. As a COST STATEMENT about the decomposition subtask - dominated
    by the target-keyed meet-in-the-middle at B^{ceil(m/2)}, which this record
    cites and does not improve, and it is strictly worse than the enumerative
    sweep it recommends. As a STRUCTURAL STATEMENT about the toy S_3 system at
    m = 2 - DOMINATED BY IDEA-20260829-bdca13, which states the m = 2 theorem
    first and in full; this record is undominated only on the arity-universal
    extension, the chained-encoding closure, and the medium-leg arithmetic. As
    a SOLVING-DEGREE statement - it makes none and is dominated by
    IDEA-20260808-093497 (the semi-regular null) and IDEA-20260808-afe4ce (the
    last-fall-degree floor) on that axis entirely. As an INSTRUMENT - dominated
    by any generator-level instrument on a non-degenerate presentation, which
    is exactly what its two sibling records propose. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent moved in either
    direction, no security claim. Quantified deltas against the prior state of
    this program. (1) Extends the m = 2 degeneracy of bdca13 to ALL m by a
    tensor-CRT argument, and thereby predicts the FAILURE of bdca13's own
    declared blocking control - the corpus currently records the opposite
    prediction, so the two records disagree on a checkable integer and one of
    them is wrong. (2) Closes the free-auxiliary-variable escape that bdca13
    leaves open, using Theorem C plus the exact discriminant identity, and
    quantifies the residual non-degenerate stratum at density
    O(B/p) + O(1/B) rather than asserting it is empty. (3) Supplies the number
    RQ-SDEG-001's decision target actually needs - E|Z_m| = 2^m B^m / p - and
    evaluates it on the question's own declared medium ladder, where reaching
    |Z_3| = 1 at p = 2^64 requires B about 2^{21.3} and hence a single
    univariate generator of degree 2^21, roughly fifteen orders of magnitude
    of monomials beyond the tested envelope. Against the prior state, in which
    the lane intended to fit a scaling law in p, the delta is a closed-form
    reason the fit has no medium leg under this encoding, plus two named
    successor encodings.

