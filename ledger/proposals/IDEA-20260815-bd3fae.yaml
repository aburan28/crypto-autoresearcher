idea:
  id: IDEA-20260815-bd3fae
  question_id: RQ-ECDLP-001
  added: '2026-08-15'
  title: >-
    THE ORIGINAL S_3 TOY MEASUREMENT IS THE FOUNDATION EVERY LATER SEMAEV
    RECORD BUILDS ON AND IT HAS NEVER BEEN INDEPENDENTLY REPRODUCED: re-run
    it from the frozen contract on a clean checkout
  class: measurement

  claim: >-
    RQ-ECDLP-001 asked whether toy S_3 decomposition measurement is stable
    and cheap enough to justify scaling. Everything in the SDEG, RELN and
    ICEX lanes rests on that answer. A foundation measurement that has been
    extended repeatedly but never independently reproduced is a single point
    of failure for the whole tier path, especially given KN-OPEN-5b3a08's
    confirmed bug in the shared implementation.

  mechanism: >-
    Check out the frozen contract at its recorded commit, rebuild every
    artifact from scratch, re-run with the recorded seeds, and compare every
    reported metric against the original run records field by field.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-ECDLP-001 and its evidence; grep 'reproduction',
      'replication', 'rebuild from scratch'.
    results: >-
      The original measurement exists with run records; no independent
      reproduction from a clean checkout is recorded.
    verdict: >-
      ADAPTATION. Reproduction is the program's declared standard under
      docs/inventor-protocol.md section 6 step 4; the contribution is
      performing it for the tier path's foundation measurement.

  object_first_candidate:
    tracked_object: >-
      THE ORIGINAL MEASUREMENT'S REPORTED METRICS, re-derived from the
      frozen contract rather than inherited.
    lossiness: >-
      Citing a prior result projects away everything about how it was
      produced, which is exactly what reproduction restores.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the frozen contract and its commit are reachable; if
      they are not, the foundation is unreproducible and that is the
      finding.

  null_object_control: >-
    NULL 1 -- a metric that must be seed-independent, which must agree
    exactly regardless of run. NULL 2 -- deliberately changing a seed, which
    must change the seed-dependent metrics; if it does not, the seeds are
    not wired through and the original run's determinism claim is wrong.

  discriminated_from:
    - >-
        The semaev.py defect blast-radius record in this series, which
        maps which records touched the broken paths; this reproduces the
        foundation measurement regardless of whether it did.
    - >-
        The original run records themselves, which this compares against
        rather than replacing; any disagreement is recorded as a
        correction, never as an edit.

  assumptions:
    - >-
        The frozen contract and its commit are reachable and the
        environment is reconstructible.
    - >-
        The original run records report enough metrics for a field-by-
        field comparison; those they omit cannot be checked and are
        listed.

  predictions:
    - metric: >-
        seed-independent metric agreement
      direction: different
      minimum_effect: >-
        FORCED exact; disagreement means the environment differs in a
        way that matters.
    - metric: >-
        seed-change sensitivity
      direction: different
      minimum_effect: >-
        FORCED: seed-dependent metrics change. If they do not, the
        original determinism claim is wrong.
    - metric: >-
        field-by-field agreement with the original run records
      direction: different
      minimum_effect: >-
        The measurement; disagreement on any metric requires a
        superseding correction rather than an edit.
    - metric: >-
        metrics the original did not report
      direction: different
      minimum_effect: >-
        Listed explicitly; unreported metrics cannot be reproduced and
        bound what the reproduction establishes.

  minimal_test:
    design: >-
      One full reproduction of the smallest frozen S_3 configuration, both
      nulls, field-by-field comparison.
    controls:
      - >-
          Seed-independent metric exact-agreement null.
      - >-
          Seed-change sensitivity null.
      - >-
          Every artifact rebuilt from scratch rather than reused, per
          inventor-protocol section 6 step 4.
      - >-
          Unreported metrics listed rather than silently skipped.
    required_metrics:
      - >-
          Field-by-field comparison against the original run records.
      - >-
          Rebuild receipt for every artifact.
      - >-
          List of metrics the original did not report.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The frozen contract or its commit is unreachable. The foundation
        is unreproducible, which is a serious finding about the tier
        path's basis.
    - >-
        Seed-dependent metrics do not respond to seed changes. The
        original determinism claim is wrong.
    - >-
        A metric disagrees materially. The foundation measurement is not
        reproducible as reported and a superseding correction is required,
        with consequences for every lane built on it.
    - >-
        Everything agrees. The tier path's foundation is independently
        reproduced, which is worth having explicitly given how much rests
        on it.

  confounders:
    - >-
        ENVIRONMENT DRIFT: library versions change and a disagreement may
        be environmental rather than substantive, so the resolved
        environment must be compared as carefully as the metrics.
    - >-
        SELECTIVE COMPARISON: comparing only the headline metric would
        miss disagreements in the supporting ones, which is why the
        comparison is field by field.

  interpretation_limits:
    - >-
        Reproduces one measurement; establishes nothing new
        mathematically.
    - >-
        Scoped to the reproduced configuration and the metrics the
        original reported.
    - >-
        Any disagreement is handled by superseding correction per
        AGENTS.md rule 2, never by editing the original record.

  heuristic_assumptions:
    - id: HEUR-REPRO-1
      statement: >-
        The frozen contract plus its recorded seeds and environment
        determines the original measurement's reported metrics.
      rigorous_support: >-
        Rigorous ingredient: the contract declares the protocol and the
        manifest records the resolved environment and seeds, which is
        what the reproducibility discipline exists to guarantee. THE
        GAP: solver libraries can change behaviour across patch versions
        in ways the manifest's version pin may not capture, and Groebner
        implementations are particularly prone to this -- so an
        unreproduced metric may indicate library drift rather than an
        error in either run.
      falsification_condition: >-
        A metric disagreeing while the resolved environment matches the
        manifest exactly.
      validation_plan: >-
        SAMPLE: every metric the original reported, compared field by
        field. TAIL CHECK: metrics closest to a solver-implementation
        detail, reported separately since they are most exposed to
        library drift. TRANSFER: none; the reproduction binds this
        measurement.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one re-run of the original configuration
      plus a full artifact rebuild.
    memory_exponent: >-
      Same as the original run's profile.
    best_known: >-
      The incumbent is the original measurement itself, which this
      reproduces rather than improves.
    hidden_overhead: >-
      Reconstructing the original environment exactly may be harder than
      the measurement itself and is where reproductions usually fail.
    tradeoff_note: >-
      Reproducing the foundation costs one small re-run and either secures
      the tier path's basis or reveals that it needs correcting.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a measurement: identical to the original
    by construction, which is the point. As an independent reproduction:
    none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an independent reproduction
    of the tier path's foundation S_3 measurement from its frozen contract
    on a clean checkout, compared field by field against the original run
    records, with a full rebuild receipt and an explicit list of metrics the
    original did not report.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that the frozen contract and commit are reachable. 0.5 that the
    environment is reconstructible closely enough for exact agreement on
    deterministic metrics. 0.25 that a material disagreement appears, which
    would require a superseding correction with consequences across the tier
    path.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-001
    - KN-OPEN-002
    - KN-OPEN-5b3a08
    - GOAL-SDEG-001
    - docs/evidence-and-reproducibility.md
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
