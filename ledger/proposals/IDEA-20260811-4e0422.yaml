    EXTERNAL NOVELTY IS NOT ESTABLISHED: WEB SEARCH WAS UNAVAILABLE THIS SESSION
    (backend model error on every attempt). The problem shape is adapted from a
    known external problem, which is why novelty_status is `adaptation` rather
    than `speculative`; the ordinary fixed-trace instance is not known to this
    corpus to have been posed, and that is a statement about this corpus only.
  discriminated_from: >-
    IDEA-20260807-5d7606: this record AUDITS it and corrects its published
    falsifier. It does not contradict OBS-1, OBS-2 or its density accounting,
    and it does not re-file its content. The relationship is
    audit-and-correction, which docs/inventor-protocol.md and KN-TECH-080 treat
    as a first-class deliverable.
    IDEA-20260807-1b7241 (section E) NAMES the residual class as "bridges
    passing through the concrete representation of points"; this record
    SPECIFIES the one condition in that class that actually binds, and prices
    three algorithms for it. Naming versus specifying is the difference.
    IDEA-20260807-bbdcf3 supplies condition (iii) -- the h < N size gap and the
    consequence that at best half of k is available. This record cites it rather
    than re-deriving it, and adds conditions (i) and (ii) around it.
    IDEA-20260807-326442 (h different x-coordinate views, killed by the isogeny
    degree cost) also constructs many in-class curves, but for a factor-base
    purpose and with the degree cost as the obstruction; it never asks whether
    the constructor knows the address, which is this record's whole variable.
    IDEA-20260811-40c0b5 supplies the self-addressing observation that makes
    condition (ii) necessary; this record supplies the problem that condition
    (ii) reduces to. They are a pair.
    IDEA-20260808-28361d (the class is enumerable inside the rho budget) is
    adjacent and important: if the whole class is enumerable at p^{1/2}, then
    blind sampling at p^{1/2} is unsurprising, and the two records agree. They
    differ in what they conclude -- 28361d concludes T5 never binds and a
    density criterion replaces it; this record concludes the binding condition
    is blindness, which 28361d does not consider.
