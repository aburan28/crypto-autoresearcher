idea:
  id: IDEA-20260811-4e0422
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    A FAILED AUDIT THAT IS THE USEFUL RESULT -- IDEA-20260807-5d7606's OWN
    STATED FALSIFIER IS SATISFIABLE IN POLYNOMIAL TIME, by hashing x(Q) into a
    short exponent vector over the split small primes and applying the
    class-group action, which produces an in-class curve depending
    non-constantly on k. The record survives, but its declared boundary is
    wrong, and the CORRECTED criterion has three conditions, not one:
    in-class, BLIND (the constructor cannot compute the address), and
    address-determines-enough-of-k. This record isolates the blind condition as
    a standalone problem, BLIND-SAMPLE(p, t), whose only known routes all cost
    p^{1/2} -- exactly the rho baseline, which is why the boundary is sharp
  class: algorithm

  claim: >-
    (A) THE AUDIT, AND ITS FAILURE. IDEA-20260807-5d7606 closes the forward
    direction with OBS-1 (the kernel-ideal bridge is constant on the instance
    family) and states, as its first falsification condition and again in its
    claim section (E):
      "Exhibit a polynomial-time algorithm that, from (E, P, Q) alone, outputs
       a curve E'' in the isogeny class of E such that the map k |-> E''(k) is
       non-constant on (Z/N)^*."
    THAT ALGORITHM EXISTS AND IS ELEMENTARY. Given (E, P, Q) and the
    factorisation of D = t^2 - 4p (i.e. given End(E)):
      1. compute the split small primes ell_1 < ... < ell_r of O, i.e. those
         with (D | ell_i) = 1, taking r = O(log p / log log p);
      2. derive from the field element x(Q) an exponent vector
         (e_1, ..., e_r) with |e_i| <= B, by any fixed public encoding;
      3. output E'' := [l_1^{e_1} ... l_r^{e_r}] * E, computed by r*B
         small-degree isogeny steps, each polynomial time.
    E'' lies in the isogeny class BY CONSTRUCTION (the action preserves the
    trace), the whole computation is polynomial time, and k |-> E''(k) is
    non-constant because the action is free and distinct exponent vectors give
    distinct curves. So 5d7606's stated falsifier is met.
    IT DOES NOT REFUTE 5d7606'S MATHEMATICS. OBS-1 is about bridges factoring
    through the subgroup lattice, and this construction does not; the record's
    substance stands. What fails is its DECLARED BOUNDARY -- the criterion it
    published for what would reopen the lane. Under docs/inventor-protocol.md
    and KN-TECH-080, a failed audit of a published falsifier is itself the
    useful result, and correcting the criterion is worth more than adding
    another closure.

    (B) THE CORRECTED CRITERION, WITH THREE CONDITIONS. A curve construction
    C : (E, P, Q) -> E'' reopens Direction 2 only if ALL of:
      (i)   IN-CLASS: E'' has trace t, so a Cl(O)-vectorization oracle for the
            class accepts it as a query;
      (ii)  BLIND: the constructor cannot compute, in time below the baseline,
            the class [a] with [a] * E = E'' -- otherwise the oracle's answer
            is something the reduction already knew, and by the self-addressing
            observation of IDEA-20260811-40c0b5 the oracle contributes nothing;
      (iii) INFORMATIVE: the induced map nu : k |-> address(E''(k)) has fibres
            small enough that knowing nu(k) narrows k usefully -- at best to
            about N/h = p^{1/2} candidates, since |Cl(O)| = h = p^{1/2+o(1)},
            which is exactly the size gap IDEA-20260807-bbdcf3 prices.
    The hash construction of (A) satisfies (i) and (iii) and FAILS (ii)
    maximally: the constructor chose the exponent vector, so it knows the
    address exactly. That is why the construction is simultaneously a valid
    falsifier of the published criterion and worth nothing as an attack, and
    stating both halves is the point of this record.

    (C) THE ISOLATED PROBLEM. Define
      BLIND-SAMPLE(p, t): output a curve E'/F_p of trace t together with a
      transcript, such that no polynomial-time algorithm given (p, t, E', the
      transcript) outputs the ideal class connecting E' to a fixed reference
      curve E of the same trace.
      k-BLIND-SAMPLE: the same, but the output must additionally depend on an
      input field element x, non-constantly and with small fibres.
    Blindness is necessarily a COMPUTATIONAL notion -- an algorithm always
    knows its own randomness -- so the definition is transcript-based, exactly
    as the trusted-setup formulation in the isogeny literature is.
    KNOWN ROUTES AND THEIR COSTS, stated as arithmetic and to be measured:
      R-a REJECTION SAMPLING: pick random curves, point count (polynomial
          time), accept when the trace is t. The class has about h = p^{1/2+o(1)}
          members among about 2p isomorphism classes, so the acceptance density
          is about p^{-1/2} and the expected cost is p^{1/2+o(1)}. BLIND: yes.
      R-b CM CONSTRUCTION: compute the Hilbert class polynomial H_D mod p and
          take a root. Cost about |D|^{1+o(1)} = p^{1+o(1)} by the CRT method.
          BLIND: yes, but strictly worse than R-a.
      R-c WALKING: apply small-prime isogenies from a known class member.
          Cost polynomial. BLIND: NO -- the walker knows the address. This is
          the only cheap route and it is exactly the one that fails (ii).
    THE OBSERVATION THAT MAKES THE BOUNDARY SHARP: the cheapest known blind
    route costs p^{1/2+o(1)}, which is the rho baseline itself. So the
    boundary between "Direction 2 is dead" and "Direction 2 is live" sits
    exactly at the baseline, and this coincidence is not decorative -- it is
    what makes the closure tight rather than comfortable.

    (D) THE CONDITIONAL, STATED AS A CONDITIONAL AND FLAGGED. If a
    k-BLIND-SAMPLE algorithm existed with cost T_blind and fibre size at most
    N/h, then by IDEA-20260811-40c0b5's elimination-cost accounting the
    resulting ECDLP algorithm needs NO oracle at all: construct E''(Q), vectorise
    it against E at the classical cost of about h^{1/2} = p^{1/4}, obtain
    nu(k), and finish with a kangaroo search on the residual set of about
    p^{1/2} candidates at about p^{1/4} steps. Total about
    max(T_blind, p^{1/4+o(1)}). NO SUCH ALGORITHM IS PROPOSED HERE and the
    record's own prediction is that none exists with T_blind below p^{1/2}; the
    conditional is written down so that the target is precise instead of vague,
    and so that a reviewer can attack the right object. See p2_p3_flags.

    (E) WHY THIS IS WORTH A RECORD RATHER THAN A FOOTNOTE. Two reasons, both
    checkable. FIRST, it converts the lane's residual open class -- named but
    never specified by IDEA-20260807-1b7241 (section E), IDEA-20260807-5d7606
    (STEP 5) and IDEA-20260807-413fcc -- into ONE named problem with a
    definition, three known algorithms, and measured costs. A residual class
    that is named but not specified is where premature closure hides. SECOND,
    the problem has an EXTERNAL analogue with an active literature: generating
    supersingular curves of unknown endomorphism ring without trusted setup
    (recorded in this repository's own research digest at
    research_digest/batches/batch_046.md, entry 14004354.pdf, "Supersingular
    Curves You Can Trust", Basso, Codogni, Connolly, De Feo et al.). The
    ordinary fixed-trace analogue posed here is, as far as this corpus knows,
    not studied. Either answer is publishable-shaped: a sub-p^{1/2} ordinary
    blind sampler would be of independent interest to that literature, and a
    lower bound would make the Direction-2 closure unconditional.

  resource_label: >-
    R4 (the isogeny graph and class-group action, which supplies both the cheap
    non-blind route and the structure the blind routes must reproduce), R2 (the
    curve equation, since rejection sampling works on Weierstrass coefficients),
    and R1 (x(Q) as a field element, which is what makes the construction
    k-dependent and is exactly the residual resource every prior L10 closure
    names).
  admissibility: admissible
  admissibility_argument: >-
    No endomorphism is applied to a point of G anywhere in this record. The
    k-dependence enters through x(Q) as a FIELD ELEMENT (resource R1), which is
    precisely the resource H-ENDO-001 does not cover and which
    IDEA-20260807-1b7241's CAGG model explicitly excludes and names as its
    residual class. The record is admissible on its face and its whole content
    is the specification of that residual class.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: the connecting ideal class; the
      kernel ideal of <Q>; the endomorphism scalar on G; cost functionals as
      class functions; the generic-group transcript.
    tracked_object: >-
      THE CONSTRUCTOR'S OWN IGNORANCE: the pair (curve produced, address the
      producer can compute), tracked through the construction. The object is
      not the curve and not the address but the GAP between them.
    lossiness: >-
      GENUINELY LOSSY. The projection maps the full construction transcript --
      every random choice, every field operation, every isogeny step -- to a
      single bit: is the address polynomial-time computable from the transcript.
      Everything else is discarded. It is discarded COMPATIBLY with the target's
      operations because the bit propagates deterministically under composition:
      composing a blind construction with a KNOWN walk keeps it blind (the
      address is the unknown one times a known one), and composing two known
      walks stays known. That is a genuine one-step propagation rule and it is
      what makes the object more than a label.
    propagation: >-
      One step, defined and measurable: append an isogeny step of known ideal;
      blindness is preserved. Append a rejection-sampled curve; blindness is
      created. Query a vectorization oracle; blindness is destroyed. All three
      are instrumentable directly in any implementation by tracking whether an
      address is held.
    survival_score: >-
      Survives every polynomial-time post-processing that does not query a
      vectorization oracle or run a p^{1/4} search -- which is a long way. It
      DISSOLVES exactly when the class becomes small enough to enumerate
      (h below the search budget), because then the address is computable by
      brute force. That dissolution point is measurable and is the record's
      declared boundary at toy scale, where h is small and every construction is
      trivially non-blind -- a scaling caveat that must be stated loudly,
      because it means blindness itself cannot be validated at toy scale, only
      the COSTS of the routes can.

  mechanism: >-
    STEP 1 (zero compute). Write the corrected criterion (B) and file it as the
    replacement for 5d7606's published falsifier. This alone is the deliverable
    if nothing else is done.

    STEP 2 (zero compute). Implement the hash construction of (A) on paper for
    one toy instance and confirm it satisfies (i) and (iii) and fails (ii). This
    is the audit that closes the loop on 5d7606's boundary.

    STEP 3 (toy compute). MEASURE the three routes' costs on a p-ladder:
      R-a: count point-counting calls until the trace matches; fit the exponent
           against the predicted 1/2 and against the measured class density
           h/(2p).
      R-b: measure the cost of building H_D mod p at small |D| and fit against
           |D|.
      R-c: measure the cost of a walk of length sufficient to mix, confirming it
           is polylog.
    This turns three quoted asymptotics into three measured curves with
    confidence intervals.

    STEP 4 (toy compute). NULL AND PLANTED CONTROLS, see controls. In
    particular measure the rejection-sampling exponent for a RANDOM trace t'
    (predicted identical) and for the supersingular trace t = 0 (predicted
    different, because the supersingular set has size about p/12 rather than
    about p^{1/2}), which calibrates the instrument in both directions.

    STEP 5 (zero compute). State the two open questions precisely so a later
    session can attack either: (Q1) is there a blind in-class sampler below
    p^{1/2}; (Q2) is there a lower bound for BLIND-SAMPLE in any restricted
    model, e.g. against algorithms that only walk and point-count. A model-
    relative lower bound for (Q2) would make IDEA-20260811-40c0b5's Direction-2
    closure unconditional in that model.

  why_not_a_renamed_known_approach: >-
    The nearest known approach is the CM method for constructing curves of
    prescribed order, and rejection sampling with point counting -- both
    textbook, and neither claimed as new. The nearest CONCEPT is the
    trusted-setup problem for supersingular curves of unknown endomorphism
    ring, which is an active external area (corpus digest entry above) and which
    this record explicitly cites rather than reinvents. What is not present
    anywhere in this corpus is the ORDINARY FIXED-TRACE version of that problem,
    its role as condition (ii) of the corrected criterion, and the observation
    that its cheapest known solution costs exactly the rho baseline. The record
    is therefore an adaptation of a known problem shape to a new setting, plus
    a correction to a published falsifier, and it is filed as such rather than
    as a new mathematical object.

  proof_search_map:
    bottleneck: >-
      Condition (ii), blindness. Conditions (i) and (iii) are satisfiable by
      elementary constructions -- the record exhibits one. Everything in
      Direction 2 turns on whether an in-class curve can be produced without
      knowing its address, below the baseline cost.
    baseline_embedding:
      parameter_slice: >-
        Drop condition (ii). The criterion degenerates to 5d7606's published
        one-condition falsifier, which the hash construction satisfies -- so the
        old boundary is exactly the (ii)-free slice of the new one, and the
        embedding is exact rather than analogous. Second slice: set h = 1; the
        class has one curve, blindness is vacuous, and everything degenerates
        correctly.
      reproduction_check: >-
        Frozen fixture: run the hash construction on three toy instances and
        assert (a) trace preserved, (b) non-constant over k, (c) address held by
        the constructor. Assertions (a) and (b) reproduce 5d7606's falsifier
        being met; (c) is the new condition failing.
    observation_collision:
      observable: >-
        The address nu(k) = the class connecting E to E''(k).
      distinct_preimage_search: >-
        REQUIRED. Since |Cl(O)| = h is about p^{1/2} and k ranges over about p
        values, nu has fibres of size about p^{1/2} BY COUNTING -- collisions
        are forced and abundant. This is not a defect to be repaired; it is
        condition (iii)'s exact content, and it is why the best conceivable
        outcome is half of k and not all of k. Stating the collision structure
        up front is what keeps a later session from claiming full recovery.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Lift the published one-condition falsifier to the three-condition
          criterion. The proof obligation is STRICTNESS: exhibit an object
          satisfying the old criterion and not the new one (the hash
          construction), which the record does, so the inclusion is proper and
          not cosmetic.
        predicted_gain: >-
          None as an attack. The gain is that the lane's reopening condition is
          now correct, so a future positive result cannot be mistakenly claimed
          on the old criterion and a future negative cannot be mistakenly
          claimed as complete.
      - transform: representation_reduction
        proposed_object: >-
          The reduction of Direction 2 to k-BLIND-SAMPLE, with obligations:
          encoding (field element to curve), completeness (output always
          in-class), soundness (address determines the promised bits), transfer
          (the residual kangaroo step), and cost loss (the p^{1/4} vectorization
          that replaces the oracle).
        predicted_gain: >-
          Reduces an open reduction question to one concrete sampling problem,
          which is the form in which it can actually be attacked or lower
          bounded.
    quantifier_order: >-
      ASSERTED (the audit): THERE EXISTS a polynomial-time construction C such
      that FORALL ordinary (E, O) with the factorisation of D given, FORALL P of
      prime order N, the map k |-> C(E, P, [k]P) is in-class and non-constant on
      (Z/N)^*. Note the existential is OUTERMOST over constructions and the
      universals are over instances -- the strong form, and it is met.
      ASSERTED (the correction): the above does NOT suffice for a reduction;
      conditions (ii) and (iii) are additionally necessary, and (ii) fails for C.
      NOT ASSERTED: that no blind construction exists; that BLIND-SAMPLE
      requires p^{1/2}; that Direction 2 is impossible. Those are the OPEN
      questions the record poses and it is careful not to smuggle them in as
      conclusions.
      WITH OR WITHOUT End(E): the construction C needs the factorisation of D to
      know the split primes. A construction that does NOT need it would be
      strictly stronger and is not exhibited. This is the one quantifier axis on
      which the record's own object is not free.
    method_ceiling:
      strongest_certifiable_claim: >-
        "5d7606's published falsifier is satisfiable in polynomial time given
        End(E), so the correct reopening criterion has three conditions, and the
        binding one is blindness." It can NEVER certify that blindness is
        unachievable, nor any lower bound for BLIND-SAMPLE -- the record poses
        that as open and would be overclaiming to do otherwise.
      nearby_object_control: >-
        THE SUPERSINGULAR SETTING, where the analogous blind-sampling problem is
        studied externally and where the answer is known to be nontrivial
        (trusted setup is an active problem precisely because naive sampling
        leaks the endomorphism ring). If the ordinary problem posed here turned
        out to be trivially easy, the method would have failed to notice that
        its supersingular analogue is not -- so the control is: run the same
        analysis on the supersingular set and confirm the analysis distinguishes
        the two cases (it does: the supersingular set has density about p^{-1}
        among j-invariants over F_{p^2} but about p^{-1/2} over F_p, and the
        ordinary fixed-trace class has density about p^{-1/2}; the numbers are
        different and the record must reproduce that difference rather than
        blur it).
    proof_obligations:
      - claim: >-
          The class-group action preserves the trace, so the hash construction
          outputs an in-class curve.
        responsibility: correctness
      - claim: >-
          The action is free, so distinct exponent vectors give distinct curves
          and the construction is non-constant in k.
        responsibility: correctness
      - claim: >-
          r*B small-prime isogeny steps cost polynomial time given the split
          primes.
        responsibility: runtime
      - claim: >-
          The isogeny class has h = p^{1/2+o(1)} members among about 2p
          isomorphism classes, so rejection sampling costs p^{1/2+o(1)}.
        responsibility: size
      - claim: >-
          Knowing nu(k) narrows k to about N/h = p^{1/2} candidates and no
          fewer.
        responsibility: strictness
      - claim: >-
          Blindness is not achievable below p^{1/2} by any algorithm.
        responsibility: scope
        status: >-
          '[open] -- THIS IS THE RECORD''S CENTRAL OPEN QUESTION AND IS NOT
          CLAIMED. It is listed so that no reader mistakes the record for a
          closure.'

  predictions:
    - metric: >-
        whether the hash construction of (A) outputs a curve of trace exactly t,
        over 200 values of k on each of five toy curves
      direction: higher
      minimum_effect: >-
        1.00. A single output with the wrong trace means the action is
        mis-implemented, not that the construction fails.
    - metric: >-
        number of distinct curves produced by the hash construction over 200
        values of k
      direction: higher
      minimum_effect: >-
        at least min(200, h) up to birthday collisions, i.e. clearly greater
        than 1. Exactly 1 would mean the construction is constant and 5d7606's
        falsifier is NOT met, which would reverse the record's central audit.
    - metric: >-
        fitted exponent of rejection-sampling cost against log p, over a ladder
        of at least five p values
      direction: higher
      minimum_effect: >-
        slope in [0.35, 0.65], consistent with 1/2. A slope materially below
        0.35 would mean in-class curves are far denser than the class-number
        bound allows and the blind route is cheaper than believed -- the outcome
        that would reopen the lane and the reason to measure rather than quote.
    - metric: >-
        fitted exponent of Hilbert-class-polynomial construction cost against
        log|D|
      direction: higher
      minimum_effect: >-
        slope near 1, confirming route R-b is strictly worse than R-a and can be
        set aside.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the cheapest discriminator): write the hash
      construction and check by inspection that the action preserves the trace
      and is free. If either fails, the audit fails and 5d7606's boundary was
      right after all. Minutes on paper.
      STAGE 1 (minutes): implement the hash construction at 16-24 bits on
      classes with h(O) in [20, 200]; verify trace preservation and
      non-constancy over 200 values of k per curve; verify the constructor holds
      the address.
      STAGE 2 (minutes to an hour): the cost ladder of STEP 3 for R-a and R-c,
      with R-b at the smallest sizes only.
      STAGE 3 (minutes): the controls below.
      STAGE 4 (zero compute): write the two open questions of STEP 5.
      No new infrastructure beyond a small-prime isogeny walker and a point
      counter, both of which the campaign's L1/L2 pipelines already require.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): rejection sampling for a RANDOM trace
        t' with |t'| < 2 sqrt(p), t' != t. The measured cost exponent must be
        indistinguishable from the real-trace case, because the cost is a
        density effect and not a property of the particular class. A material
        difference means the instrument is measuring something class-specific
        and the exponent fit is void.
      - >-
        PLANTED SIGNAL (two-directional control, mandatory): a synthetic
        "class" of artificially high density -- e.g. accept any curve whose
        trace lies in a window of width p^{1/2} around t -- for which the
        sampler MUST succeed in polylog time. A sampler that still takes
        p^{1/2} there is blind to density and every cost measurement it
        produced is invalid rather than negative.
      - >-
        SUPERSINGULAR CONTRAST: the same rejection-sampling measurement for
        t = 0. The exponent must differ from the ordinary case in the direction
        the density arithmetic predicts; if it does not, the density model is
        wrong.
      - >-
        BLINDNESS BOOKKEEPING: an explicit assertion, per construction, of
        whether the address is held. This is a code-level control, not a
        statistical one, and it is what keeps route R-c from being silently
        counted as blind.
    required_metrics:
      - trace-preservation rate and distinct-curve count for the hash construction
      - rejection-sampling cost exponent, real trace, with confidence interval
      - the same, random-trace null
      - the same, planted high-density control
      - the same, supersingular contrast
      - Hilbert-class-polynomial cost exponent at small |D|
      - per-construction blindness flag

  controls:
    - >-
      NULL OBJECT: the random-trace rejection-sampling arm, as above.
    - >-
      DECAY PARAMETER: the class density h/(2p). Sampling cost must scale as its
      inverse. A cost that does not respond to density is measuring the point
      counter, not the search, and is the canonical artifact tell.
    - >-
      SCALE CAVEAT AS A CONTROL: at toy scale h is small enough to enumerate, so
      EVERY construction is non-blind by brute force. The blindness flag must
      therefore be recorded as an ALGORITHMIC property (does this algorithm
      compute an address) and never inferred from a measurement. Any record that
      reports "measured blindness" at toy scale is making a category error and
      must be rejected in review.

  confounders:
    - >-
      KNOWLEDGE OF End(E). The hash construction needs the split primes, hence
      the factorisation of D, which is free at toy scale and subexponential at
      crypto scale. The audit of 5d7606's falsifier is therefore in the
      WITH-End(E) quantifier; whether a falsifier exists in the without-End(E)
      quantifier is not addressed and is stated as such.
    - >-
      VOLCANO LEVEL. The action is defined on curves at a fixed level with the
      same order O; a construction that wanders off the crater changes O and
      leaves the class. The implementation must verify the level of every output.
    - >-
      SMALL h AT TOY SCALE. With h in the tens, the hash construction's outputs
      collide constantly and "non-constant" is barely visible. The distinct-curve
      count must be compared against the birthday prediction for h, not against
      200.
    - >-
      POINT-COUNTING COST. Rejection sampling's per-trial cost is Schoof-style
      point counting, whose own asymptotics could confound the fitted exponent.
      The fit must be on the number of TRIALS, not on wall-clock time, and both
      must be reported.

  falsification_conditions:
    - >-
      The hash construction fails to preserve the trace or is constant in k.
      Then 5d7606's published falsifier is NOT met, the audit fails, and this
      record's central claim is wrong. Checkable in minutes.
    - >-
      Rejection sampling is measured to cost materially less than p^{1/2}. Then
      a cheap blind route exists, condition (ii) is satisfiable below the
      baseline, and Direction 2 reopens on the strength of a measurement. This
      is the record's most consequential possible outcome and it must be
      escalated, not stated (see p2_p3_flags).
    - >-
      A reviewer exhibits a k-BLIND-SAMPLE algorithm below p^{1/2}. Same
      consequence, by argument rather than measurement.
    - >-
      The planted high-density control is not solved in polylog time.
      Instrument blind; the run set is INVALID rather than negative.

  interpretation_limits:
    - >-
      NOT AN ATTACK. No algorithm proposed here beats any baseline; the record
      poses a problem and prices three known solutions to it.
    - >-
      The audit of 5d7606 corrects a published CRITERION, not that record's
      mathematics. OBS-1 stands. Anyone citing this record as refuting 5d7606 is
      misreading it.
    - >-
      BLINDNESS CANNOT BE VALIDATED AT TOY SCALE, only asserted algorithmically,
      because a toy class is enumerable. Every empirical statement here is about
      COSTS, never about blindness.
    - >-
      The conditional in (D) has an antecedent this record believes false. It
      must never be quoted without its antecedent.
    - >-
      Scoped to ordinary curves over F_p at fixed trace, classical algorithms,
      toy-scale measurements at p up to about 24 bits.

  assumptions:
    - >-
      E ordinary over F_p, End_{F_p}(E) = O, the class is a Cl(O)-torsor at the
      crater, N prime with N || #E(F_p).
    - >-
      '[fact, elementary] The class-group action preserves the trace and is free
      and transitive on the crater, so the hash construction lands in the class
      and is non-constant.'
    - >-
      '[recall-confident] h(O) = |D|^{1/2+o(1)} by the analytic class number
      formula; the number of F_p-isomorphism classes is about 2p; hence the
      density about p^{-1/2}. NOT re-verified this session.'
    - >-
      '[recall-confident] The Hilbert class polynomial modulo p can be computed
      in time about |D|^{1+o(1)} by CRT methods (Sutherland). NOT re-verified
      this session, and route R-b is not load-bearing.'
    - >-
      '[corpus-verified this session] The supersingular trusted-setup analogue
      is an active external problem: research_digest/batches/batch_046.md,
      entry 14004354.pdf, "Supersingular Curves You Can Trust" (Basso, Codogni,
      Connolly, De Feo et al.), described there as addressing generation of
      supersingular curves with unknown endomorphism ring without trusted setup.
      The DIGEST ENTRY was read this session; THE PAPER WAS NOT.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For curves sampled uniformly from the Weierstrass parameter space over
        F_p, the trace t(E) is distributed with the Deuring class-number
        weighting, so the probability of hitting a fixed admissible trace t is
        Theta(h(t)/p) = Theta(p^{-1/2} log p), uniformly for |t| < 1.9 sqrt(p).
      rigorous_support: >-
        Pairs the rigorous Deuring mass formula (the number of curves with a
        given trace is a class-number-weighted count -- a theorem) with the
        classical equidistribution statement it imitates (Birch's
        Sato-Tate-style trace distribution for random curves over F_p). The
        rigorous half fixes the counts; the heuristic half is only about
        uniformity of the sampler over the parameter space.
      validation_plan: >-
        Toy scale: sample 10^5 random curves per p over a ladder of five p
        values at 16-24 bits, tabulate the empirical trace histogram, and
        compare against the class-number-weighted prediction by a chi-squared
        test; separately measure the acceptance rate for one fixed t and compare
        against h(t)/(2p). Record the p-ladder, the sample sizes, and the fact
        that TRANSFER TO CRYPTO SCALE IS NOT CLAIMED -- at crypto scale point
        counting per trial is itself the dominant cost and the measurement
        changes character.
      tail_checks: >-
        Check the extreme traces near the Hasse endpoints, where h(t) is small
        and the acceptance rate should be visibly lower, and the traces with
        |D| divisible by a large square, where the conductor changes h; both are
        predicted deviations and their absence would falsify the weighting.
    - id: HA-2
      statement: >-
        For the hash construction, exponent vectors derived from x(Q) by a fixed
        public encoding behave, as k varies over (Z/N)^*, like independent
        uniform draws from the box [-B, B]^r, so the induced map to Cl(O) has
        the collision statistics of a random function.
      rigorous_support: >-
        Imitates the standard random-function heuristic for a fixed public
        encoding of a field element, the same shape as "this integer behaves
        like a random integer of its size". It is genuinely heuristic because
        x([k]P) is not a random function of k, and that gap is exactly what the
        distinct-curve count measures.
      validation_plan: >-
        Toy scale: for 5 curves and 10^4 values of k each, record the multiset
        of resulting classes and compare the collision count against the
        birthday prediction for h. Record h, B, r and the encoding. A collision
        count far BELOW prediction would mean the encoding is structured and is
        worth investigating in its own right.
      tail_checks: >-
        Check the most frequently hit class against the extreme quantile for a
        random function; a single class hit far too often indicates the encoding
        is degenerate rather than that the class group is.

  reachability_gate: >-
    T5 STATUS, AND IT IS THE CENTRAL POINT OF THE RECORD. T5 says a random curve
    in the class is reachable cheaply and a specified curve is not. BLIND-SAMPLE
    asks for something T5 does not address at all: a curve that is reachable
    cheaply AND whose position is unknown to the reacher. Random walking gives
    the first without the second; rejection sampling gives the second at
    p^{1/2}. So BLIND-SAMPLE is a THIRD requirement, orthogonal to T5's
    dichotomy, and naming it is the record's contribution to the campaign's
    reachability vocabulary.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. Measured targets: the blind
      routes at p^{1/2+o(1)} (rejection) and p^{1+o(1)} (CM), and the non-blind
      route at polylog. The conditional in (D) would reach p^{1/4+o(1)} IF a
      sub-baseline k-blind sampler existed, which is not claimed and is the
      record's open question.
    memory_exponent: >-
      O(1) for rejection sampling and for walking; the p^{1/4} vectorization in
      the conditional of (D) needs p^{1/4} memory and that is disclosed there
      rather than hidden.
    best_known: >-
      Parallel Pollard rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006); BSGS at sqrt(N) time and memory (KN-TECH-031);
      automorphism-discounted rho (KN-TECH-018); kangaroo at about 2*sqrt(W) on
      an interval of width W. None is changed.
    hidden_overhead: >-
      The o(1) in the rejection-sampling cost hides the class-number log factor
      AND the per-trial point-counting cost, which is polynomial but not small;
      at crypto scale that polynomial factor is the practical bottleneck and is
      disclosed rather than absorbed. The hash construction hides the
      subexponential factorisation of t^2 - 4p.
    tradeoff_note: >-
      The conditional route in (D) is memory-heavy at its vectorization step
      (p^{1/4} memory, van Oorschot-Wiener degradation to sqrt(h^3/w) with
      memory w, so w = 1 gives p^{3/4} and the route dies). Any memory-poor
      reading of the conditional is therefore strictly worse than rho, and that
      must be stated wherever the conditional is quoted.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after. The delta is a corrected
    falsification criterion for a committed record, a named and defined open
    problem replacing a vaguely named residual class, and three measured cost
    curves replacing three quoted asymptotics.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row this
    campaign recognises: parallel rho with distinguished points (0.886*sqrt(N),
    O(1) memory, KN-TECH-001/006); automorphism-discounted rho (KN-TECH-018);
    BSGS (sqrt(N) time and memory, KN-TECH-031); kangaroo (about 2*sqrt(W)); van
    Oorschot-Wiener (sqrt(N^3/w), memory w); meet-in-the-middle vectorization at
    about h^{1/2}. This record mounts no attack and is dominated by all of them
    on time. Its cheapest blind route (rejection sampling at p^{1/2}) TIES rho's
    exponent while doing something entirely different, which is the coincidence
    the record highlights and not an improvement. dominated_by is NOT null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the hash construction verifies as stated and 5d7606's published
    falsifier is confirmed satisfiable -- it is elementary and the only risk is
    an action-implementation error. 0.85 that the rejection-sampling exponent
    measures at 1/2 within the pre-registered band. 0.05 that any blind route
    below p^{1/2} turns up in this session's scope, and that branch is the one
    worth the hour. Below 0.02 that a k-blind sampler with small fibres exists
    at all, which is the record's honest prior on the conditional in (D).

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base of any kind appears; H-STR-002 and
    DEFER-BATCH009-001 are untouched.
    P3: FLAGGED AS ADJACENT, AND THE STOPPING RULE IS WRITTEN INTO THE RECORD.
    Section (D) is a conditional whose consequent is an exponent below the
    baseline. No candidate is proposed, no excess is measured, and no excess is
    stated. If the rejection-sampling measurement or a reviewer's construction
    ever makes the antecedent true, the executing session MUST stop, flag, and
    hand it to the Coordinator for an independent review-adversarial session
    rather than record a number. This record is the correct place for the
    Coordinator to attach that routing instruction.

