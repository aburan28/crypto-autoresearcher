    "vectorization" (43 files); "question_id: RQ-CLGP-b99df5" (11 records,
    headers read in full).
    FULL READS: IDEA-20260807-5d7606 (complete -- the audited record, including
    its falsification_conditions and its STEP 5 residual class),
    IDEA-20260807-1b7241 (section E residual class), IDEA-20260807-bbdcf3
    (the size gap, which supplies condition (iii)), IDEA-20260807-413fcc,
    KN-FIND-b7e091, DECOMPOSITION.md.
    RESULT: no record in the corpus states a blind in-class sampling problem, no
    record audits 5d7606's falsifier, and no record gives the three-condition
