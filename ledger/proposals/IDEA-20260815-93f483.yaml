idea:
  id: IDEA-20260815-93f483
  question_id: RQ-CANL-63098f
  added: '2026-08-15'
  title: >-
    THE CANONICAL-LIFT LANE WAS CLOSED BY DECISION AND ITS OWN LIMITATIONS
    RECORD SAYS THE CHEAP STAGE-0 AND STAGE-1 CHECKS WERE NEVER RUN: run
    them, because a closure whose cheapest checks were skipped is not at the
    section 4 standard
  class: control

  claim: >-
    DEC-20260810-2c7e3c closed the canonical-lift lane, and
    IDEA-20260811-626f00 records that this decision's own limitations note
    that its cheap Stage 0 and Stage 1 checks were never run. A closure
    resting on unrun cheap checks is a fatigue report under docs/inventor-
    protocol.md section 4, whatever its conclusion. Running them either
    upgrades the closure to the standard or reopens the lane.

  mechanism: >-
    Extract the specific Stage 0 and Stage 1 checks the decision's
    limitations name. Run each. Report whether the closure's conclusion
    survives, and if it does, record it as a closure meeting the standard
    rather than as an unverified one.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of DEC-20260810-2c7e3c and IDEA-20260811-626f00's
      discriminated_from entry recording the unrun checks; grep 'canonical
      lift' (18), 'Serre-Tate' (10).
    results: >-
      The decision exists and its unrun-checks limitation is recorded by a
      later idea; no record runs those checks.
    verdict: >-
      ADAPTATION. The checks are specified by the decision itself; the
      contribution is running them so the closure meets the program's own
      standard.

  object_first_candidate:
    tracked_object: >-
      THE CLOSURE'S OWN CHEAP CHECKS, treated as an outstanding obligation
      rather than as a detail.
    lossiness: >-
      A closure conclusion projects away the checks behind it, and the
      inventor protocol's whole point is that the projection is only valid
      when the checks were run.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the decision specifies its checks concretely; checks
      specified only vaguely are the finding rather than a nuisance.

  null_object_control: >-
    NULL 1 -- a check with a known outcome, confirming the harness
    reproduces it. NULL 2 -- running the checks on a lane where the closure
    is uncontested, which should also pass; a harness that fails everything
    cannot upgrade anything.

  discriminated_from:
    - >-
        DEC-20260810-2c7e3c itself, whose conclusion this record does not
        contest; it discharges the obligation the decision left open.
    - >-
        IDEA-20260811-626f00, which records the unrun checks as a
        practical inheritance for its own design; this record acts on that
        observation.

  assumptions:
    - >-
        The decision specifies its Stage 0 and Stage 1 checks concretely
        enough to run; if it does not, that vagueness is the finding and
        the closure cannot be upgraded.
    - >-
        Running the checks now is meaningful despite the lane being
        closed, which holds because a closure's standing depends on its
        checks rather than on its age.

  predictions:
    - metric: >-
        known-outcome check reproduction
      direction: different
      minimum_effect: >-
        FORCED reproduced; otherwise the harness cannot evaluate
        anything.
    - metric: >-
        Stage 0 and Stage 1 check outcomes
      direction: different
      minimum_effect: >-
        The measurement; passing upgrades the closure to the section 4
        standard, failing reopens the lane.
    - metric: >-
        specificity of the decision's check descriptions
      direction: different
      minimum_effect: >-
        Reported explicitly; a decision that cannot say what its checks
        were is a process finding independent of the mathematics.

  minimal_test:
    design: >-
      Run the named checks only. No new lane work unless a check fails.
    controls:
      - >-
          Known-outcome reproduction.
      - >-
          Uncontested-lane harness check.
      - >-
          Check descriptions quoted verbatim from the decision, so the
          record cannot substitute its own easier checks.
    required_metrics:
      - >-
          Outcome per named check.
      - >-
          Verdict on whether the closure meets the section 4 standard.
      - >-
          Assessment of how concretely the decision specified its
          checks.

  falsification_conditions:
    - >-
        The known-outcome reproduction fails. Harness cannot evaluate;
        halt.
    - >-
        The decision does not specify its checks concretely. The closure
        cannot be upgraded and stays unverified, which is a process
        finding.
    - >-
        A check fails. The closure's basis is undermined and the lane
        reopens, which is the outcome with the largest consequence.
    - >-
        All checks pass. The closure is upgraded to the section 4
        standard, which is the cheapest possible way to convert an
        unverified closure into a real one.

  confounders:
    - >-
        SUBSTITUTED CHECKS: running easier checks than the decision named
        would produce a false upgrade, which is why the descriptions are
        quoted verbatim.
    - >-
        POST-HOC INTERPRETATION: reading the decision's vague check
        descriptions charitably is itself a way to manufacture a pass.

  interpretation_limits:
    - >-
        Discharges a recorded obligation; does not contest the closure's
        conclusion.
    - >-
        An upgrade is scoped to the named checks and does not validate the
        lane's other reasoning.
    - >-
        A failed check reopens the lane rather than reversing its
        conclusion, which would need its own work.

  heuristic_assumptions:
    - id: HEUR-CANL-1
      statement: >-
        The Stage 0 and Stage 1 checks named in the decision's
        limitations are the checks whose absence made the closure
        unverified.
      rigorous_support: >-
        Rigorous ingredient: the decision's own limitations record names
        them, so the program's contemporaneous judgement identified them
        as the gap. THE GAP: that judgement could have been incomplete,
        and running exactly the named checks upgrades the closure only
        against the gap the decision itself perceived -- not against
        gaps nobody noticed.
      falsification_condition: >-
        A reviewer identifying a cheap check the decision did not name
        whose absence also undermines the closure.
      validation_plan: >-
        SAMPLE: every check named in the decision's limitations. TAIL
        CHECK: any check the decision mentions without specifying,
        reported as unrunnable-as-stated. TRANSFER: none; the upgrade
        binds this closure only.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is running the named cheap checks, which the
      decision itself characterised as cheap.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the closure itself, whose conclusion this record
      does not challenge and whose standing it attempts to raise.
    hidden_overhead: >-
      Whether the checks are actually cheap is the decision's own
      assessment and may not hold when someone tries to run them.
    tradeoff_note: >-
      Running a closed lane's checks costs little and either strengthens a
      closure or reopens a lane; leaving them unrun leaves the closure at
      unverified indefinitely.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As mathematics: nothing new. As discharging
    a recorded closure obligation: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the outcome of the Stage 0
    and Stage 1 checks the canonical-lift closure's own limitations record
    leaves outstanding, and a verdict on whether that closure meets the
    inventor protocol's section 4 standard or remains a fatigue report.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that the decision specifies its checks concretely enough to run,
    which is the binding uncertainty. 0.85 that the checks are genuinely
    cheap if specified. 0.2 that a check fails and reopens the lane, which
    would be the highest-consequence outcome.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
