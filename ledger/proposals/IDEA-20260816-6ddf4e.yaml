idea:
  id: IDEA-20260816-6ddf4e
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'Chi is the only nonlinear step and it is row-local, so it cannot destroy translation symmetry
    at all: exhaust its 5-bit difference distribution table and measure, as an exact codimension per
    active row, the degrees of freedom an internal differential must spend there rather than assuming
    a uniform per-row charge'
  class: mechanism
  claim: (A) A NEGATIVE STRUCTURAL FACT, STATED PRECISELY. chi acts independently on each of the 320
    rows (fixed y, fixed z) of the state and its action does not depend on z. Consequently chi COMMUTES
    with every cyclic z-translation and maps each fixed subspace S_t into itself exactly. The only
    nonlinear step of Keccak-f[1600] therefore contributes ZERO symmetry decay in the subspace-dimension
    sense. Whatever cost an internal differential pays at chi is not a loss of symmetry; it is a loss
    of FREEDOM, and the two have been conflated in the informal framing this repository inherited
    in RQ-SHATHREE-cd2cb2. (B) THE COST IS AN EXACT CODIMENSION AND IT IS TINY TO COMPUTE. For the
    5-bit map y_j = x_j XOR ((NOT x_{j+1}) AND x_{j+2}), the full difference distribution table is
    32x32 = 1024 entries, computable by brute force in microseconds. For each nonzero input difference
    d and each reachable output difference e, this contract computes the exact SET of inputs x realising
    (d -> e), its cardinality, and whether that set is an affine subspace of GF(2)^5 -- and if so
    its dimension. The per-active-row charge is then log2(32 / |solution set|), an exact rational,
    not a modelling constant. Aggregated over the active rows of a deviation vector, this converts
    the active-row curve of the companion contract into a degrees-of-freedom ledger with no fitted
    parameter anywhere. (C) THE DISCRIMINATING PREDICTION. The charge is predicted to be strongly
    NON-UNIFORM across input differences -- specifically, that low-weight row differences are much
    cheaper than high-weight ones -- so that a cost model charging a constant per active row misprices
    the trail by an amount this contract quantifies in bits. (D) NOT CLAIMED. No attack, no trail,
    no collision, no complexity, and nothing about full-round SHA-3. It is NOT claimed that the per-row
    charges compose independently across rows -- that is exactly the assumption the companion contracts
    must test separately, and this record flags it as unproven rather than assuming it. It is not
    claimed that the affine structure of chi's solution sets, if found, is a new observation about
    chi; only that this repository has never computed it and that every downstream cost claim here
    depends on it.
  mechanism: 'STAGE 1: brute-force the 5-bit chi map over all 32 inputs and tabulate the full 32x32
    DDT by counting, for each ordered pair (d, e), the number of x with chi(x) XOR chi(x XOR d) =
    e. STAGE 2: for every (d, e) with nonzero count, materialise the solution set explicitly and test
    whether it is an affine subspace by checking closure of pairwise-XOR differences under a linear
    span; report the dimension when affine and the exact set when not. This is a complete, exhaustive,
    deterministic characterisation -- there is no sampling and no residual uncertainty. STAGE 3: define
    the charge c(d, e) = 5 - log2|solution set| in bits and emit the full charge matrix; also emit
    the marginal minimum charge c_min(d) = min over reachable e, which is the cheapest possible way
    through an active row with input difference d. STAGE 4: take the deviation vectors D_r computed
    by the companion active-row contract, decompose each into its 320 row differences, and aggregate
    sum over active rows of c_min(d) per round -- producing a degrees-of-freedom curve in bits. STAGE
    5: compare that curve against the naive constant-charge model used implicitly by the active-row
    count, and report the mispricing in bits per round. STAGE 6: run the identical stages 1-3 against
    null 5-bit maps. REFUTATION: the mechanism fails if chi''s solution sets are not affine and not
    otherwise compactly describable, because then no exact per-row charge exists and the whole ledger
    is replaced by a table lookup with no structure -- still a usable measured obstruction, and still
    cheap.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0),
      capacity (20), padding (15), "birthday bound" (38). Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001,
      KN-TECH-080 in full, docs/inventor-protocol.md sections 1-8, and headers of KN-TECH-066, KN-TECH-073,
      KN-TECH-074, KN-TECH-056. Additionally grepped ledger/ for `DDT`, `difference distribution table`,
      `S-box` and `chi` across proposals, hypotheses and experiments.'
    results: '`chi step` returns zero hits in ledger/proposals and ledger/hypotheses. S-box DDT work
      in this repository exists only on the AES side, where the measured r=5..7 effects and their
      null controls are established internal results and are explicitly off-limits for re-derivation;
      that lane''s S-box factors as an affine map composed with field inversion, a completely different
      algebraic object from chi. KN-TECH-066 catalogues differential cryptanalysis of permutations
      and is cited by zero ledger and zero experiment records, so no prior record consumes it.'
    verdict: 'UNVERIFIED. This program cannot read external literature and asserts nothing about whether
      chi''s DDT structure is documented there; it very plausibly is, and that would not change this
      record''s status, because the deliverable is a computed table committed to this repository and
      consumed by named companion contracts. NEW relative to this repository: any computed property
      of chi whatsoever. ASSEMBLED FROM KNOWN PARTS: brute-force DDT construction is textbook and
      is the same instrument the AES lane already used; the affine-solution-set test is standard linear
      algebra. The contribution claimed is the exact per-row charge and the mispricing measurement
      against the naive model, not the discovery of chi''s structure.'
  object_first_candidate:
    tracked_object: The row difference d in GF(2)^5 attached to each of the 320 rows of a deviation
      vector, together with the exact solution set S(d, e) subset GF(2)^5 of inputs realising a given
      transition -- i.e. the FIBER of the difference observable, followed through one chi application.
    lossiness: 'The row difference discards the actual row value entirely: 32 inputs collapse to at
      most 32 differences and the map x -> (x, x XOR d) -> d forgets which pair produced it. That
      discard is exactly what the solution set S(d, e) measures -- the size of the fiber is the number
      of bits of forgotten information the attacker must re-supply, which is why it is the right cost
      unit. Honest caveat: within a single row the difference plus the solution-set membership recovers
      the pair, so the projection is lossy only because the attacker is denied the second coordinate;
      the discard is real for the attacker, not for the mathematics.'
    propagation: One chi application maps a row difference d to an output difference e with the pair
      (d, e) admissible exactly when |S(d, e)| > 0, and the attacker must place the row's actual value
      inside S(d, e), spending 5 - log2|S(d, e)| bits of freedom. Because chi is row-local, propagation
      of the full 320-row difference vector through chi is the independent product of 320 such transitions
      -- independent as a map, though NOT independent as a constraint once the linear layer couples
      rows in the next round, which is the flagged unproven assumption.
    survival_score: Reported as the number of rounds for which the cumulative degrees-of-freedom charge
      stays below the controllable symmetric dimension of the smallest digest size (288 bits at SHA3-512
      by the companion count). That crossing round is an exact integer once the charge table and the
      deviation vectors exist, and it is this contract's concrete statement of how far the structure
      survives.
  null_object_control: 'Identical stages 1-3 applied, in the same invocation and by the same code
    path, to (i) 1000 uniformly random permutations of GF(2)^5, (ii) 1000 uniformly random functions
    GF(2)^5 -> GF(2)^5, and (iii) the 5-bit identity and a random affine bijection as degenerate anchors.
    For the chi result to mean anything, chi''s charge distribution -- in particular the fraction
    of (d, e) pairs with affine solution sets and the spread of c_min(d) -- must lie outside the central
    90 percent of the random-permutation null. If chi''s charges look like a random 5-bit permutation''s,
    the recorded result is a controlled null: chi is expensive in the generic way and the internal-differential
    cost carries no chi-specific structure.'
  discriminated_from:
  - The AES r=5..7 measured-effect lane and its S-box work -- an established internal result of this
    program that must not be re-derived; that S-box is affine-composed-with-inversion over GF(2^8)
    with a dense DDT, while chi is a 5-bit quadratic map with degree 2 and row locality, and neither
    the object nor the cost unit transfers.
  - The companion active-row contract -- that one counts WHICH rows are active and never asks what
    a row costs; this one computes the cost and is useless without the other, which is why they are
    proposed as a pair rather than merged.
  - Generic 'compute a DDT' tooling -- the deliverable here is not the table but the charge function
    c_min(d) and the measured mispricing of the constant-charge model in bits per round.
  - KN-TECH-073 and KN-TECH-074 (cube attacks, division property) -- both also concern chi's algebraic
    degree, but they track monomials and integral sums, not difference fibers, and neither yields
    a per-row freedom charge.
  assumptions:
  - The 5-bit chi map as transcribed from FIPS 202 (y_j = x_j XOR ((NOT x_{j+1}) AND x_{j+2}), indices
    mod 5) is correct; validated by recomposing the full permutation and matching hashlib.
  - Degrees of freedom is the right cost currency in the unkeyed setting, where the attacker chooses
    inputs and spends freedom rather than collecting data -- the framing recorded in KN-TECH-066.
  - Per-row charges are aggregated by summation, which presumes row independence within one chi layer;
    this is true as a map and is flagged as UNPROVEN as a constraint across rounds.
  - Taking c_min(d) as the per-row charge is optimistic by construction and is therefore a lower bound
    on cost, not an estimate.
  predictions:
  - metric: fraction of nonzero-count (d, e) pairs whose solution set is an affine subspace of GF(2)^5
    direction: higher
    minimum_effect: 0.9
  - metric: spread of c_min(d) across the 31 nonzero input differences, in bits
    direction: higher
    minimum_effect: 2
  - metric: correlation between Hamming weight of d and c_min(d)
    direction: higher
    minimum_effect: 0.5
  - metric: mispricing of the constant-charge model versus the exact charge, at round 4, in bits
    direction: different
    minimum_effect: no pre-commitment on sign; whether the naive model over- or under-charges depends
      on the weight profile of the deviation vectors, which the companion contract has not yet produced
  - metric: separation of chi's affine-fraction from the random-5-bit-permutation null band
    direction: higher
    minimum_effect: 0.3
  minimal_test:
    design: 'Stages 1-3 alone are the discriminating measurement and cost under one second of CPU
      with no sampling anywhere. Enumerate all 32 inputs of the 5-bit chi map; build the 32x32 DDT
      by counting pairs; for each of the at most 1024 cells with nonzero count, list the solution
      set explicitly and test affineness by fixing an element x0 and checking that {x XOR x0 : x in
      S} is closed under XOR. Emit the charge matrix and the marginal c_min(d). This is exhaustive:
      there is no statistical uncertainty, no seed, and no possibility of a sampling artifact. The
      null arm is 2000 further such enumerations, still under a minute. At that point the contract
      has already answered the sharp question -- is chi''s per-row cost structured or generic -- and
      stages 4-5, which require the companion deviation vectors, can be deferred to a separate approval
      without wasting the measurement. The cheapness is the point: this is the audit that should have
      run before any cost model was written down.'
    controls:
    - 1000 random 5-bit permutations, identical enumeration code path.
    - 1000 random 5-bit functions (non-bijective), to separate 'permutation' from 'chi'.
    - 'Identity map anchor: must give charge zero for d = e and no reachable e != d.'
    - 'A random affine bijection anchor: must give |S(d, e)| = 32 for exactly one e per d and zero
      elsewhere, charge exactly 0 bits -- a hard correctness check on the charge definition.'
    - 'Recomposition control: rebuild the full Keccak permutation from the tabulated chi and re-match
      hashlib digests, so the table cannot drift from the map it claims to describe.'
    required_metrics:
    - full 32x32 chi DDT counts
    - affineness verdict and dimension for every nonzero cell
    - charge matrix c(d, e) = 5 - log2|S(d,e)| in bits
    - marginal minimum charge c_min(d) for all 31 nonzero d
    - branch number and maximum DDT entry of chi
    - null distributions of affine-fraction, c_min spread and maximum DDT entry
    - per-round aggregated degrees-of-freedom charge when companion deviation vectors are available
  falsification_conditions:
  - Fewer than 50 percent of nonzero DDT cells have affine solution sets, which removes the compact
    charge description the downstream ledger depends on.
  - c_min(d) is constant across all 31 nonzero d, making the exact charge identical to the naive constant
    model and the contract's premise empty.
  - chi's affine-fraction and c_min spread both lie inside the random-permutation null band -- controlled
    null, recorded as such.
  - The affine-bijection anchor yields a nonzero charge, which falsifies the charge definition rather
    than any fact about chi.
  - Recomposition from the table fails to reproduce hashlib digests, voiding the run.
  confounders:
  - A 5-bit map has only 31 nonzero differences, so 'spread' and 'correlation' statistics are computed
    on tiny samples and are easy to over-read; all are reported with exact values rather than fitted
    summaries.
  - c_min(d) is optimistic and treating it as the actual charge would systematically understate cost;
    the mean and max charge are reported alongside.
  - Row independence within a chi layer does not imply constraint independence across rounds, and
    summing charges silently assumes the latter -- the single largest confounder and the reason this
    contract cannot on its own price a trail.
  - Random 5-bit permutations are a weak null for a map chosen for hardware cost rather than for differential
    strength; a quadratic-map null would be sharper and is listed as a derivation gap.
  interpretation_limits:
  - An exact per-row charge is not a trail probability and not an attack complexity; converting one
    into the other requires an independence argument this contract does not supply.
  - The measurement is about chi in isolation and says nothing about how the linear layer couples
    rows between chi applications.
  - Round-reduced framing only; nothing here bears on full 24-round SHA-3 or on any deployed use.
  - A controlled-null outcome would say chi behaves like a generic 5-bit permutation on this axis,
    which is neither reassuring nor alarming about the standard.
  target_complexity:
    time_exponent: No attack exponent is claimed. The exhaustive enumeration is 2^10 evaluations for
      the signal arm and 2^11 x 2^10 for the nulls, i.e. under 2^22 operations total.
    memory_exponent: No attack memory exponent is claimed. A 32x32 integer table plus at most 1024
      explicit subsets of GF(2)^5, well under one megabyte.
    best_known: The incumbent for pricing an internal differential is whatever charge model published
      round-reduced work uses, described but not read in RQ-SHATHREE-cd2cb2's provenance block. This
      contract produces no attack and no complexity and therefore competes with nothing; internally,
      the incumbent it displaces is the implicit constant-per-active-row charge of the companion contract.
    hidden_overhead: 'The lower-order term that hides is exactly the independence assumption: a per-row
      ledger that composes wrongly can be off by tens of bits over several rounds while every individual
      entry is exact. The human cost is small; the risk is that an exact-looking table lends unearned
      precision to a model whose composition rule is unproven.'
  dominated_by: 'n/a (no result claimed). Every frontier axis checked: no time, memory or data/query
    row is produced for any attack. As an internal comparison, the exact charge table strictly refines
    the constant-charge model on the accuracy axis at identical compute cost, and that refinement
    is a property of this repository''s own modelling, not of any published frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. The numbers produced are DDT counts,
    solution-set dimensions and charges in bits.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That chi commutes with z-translation and contributes zero symmetry decay
    in the dimension sense: 0.95, it follows from row locality by inspection. That a large majority
    of chi''s DDT solution sets are affine: 0.75, because chi is quadratic and quadratic maps commonly
    have affine difference fibers, but I have not computed it and will not assert it. That c_min(d)
    varies by at least 2 bits across differences: 0.7. That chi separates from a random-5-bit-permutation
    null: 0.6. That the resulting exact charge changes any downstream conclusion by more than a bit
    or two per round: 0.3.'
