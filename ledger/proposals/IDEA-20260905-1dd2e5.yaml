idea:
  id: IDEA-20260905-1dd2e5
  title: Isogeny-class arithmetic heterogeneity as an auxiliary-computation resource
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-05'
  status: proposed
  proposed_by: user
  recorded_by: coordinator
  task_id: TASK-20260905-755297
  class: representation
  claim: 'User conjecture: arithmetic variation within an ordinary prime-field isogeny class might lower the
    cost of a specified auxiliary computation enough to justify transport and search. No inexpensive auxiliary
    task or net advantage is established.'
  mechanism: Compare arithmetic presentations at different endomorphism orders while keeping the field and
    curve point count fixed. Transport must preserve the selected subgroup and its scalar relation. Finding
    and evaluating the maps, locating a favorable presentation, and using its auxiliary output all consume
    resources; transport is not free.
  novelty_status: unverified
  source:
    kind: user_message
    verbatim: 'Second one, more concrete: isogeny volcanoes over prime fields. You have a huge graph of curves
      connected by isogenies, all with the same point count, and the discrete log transfers freely across it.
      Everyone treats that as neutral. But the curves in that class have wildly varying arithmetic — different
      endomorphism structure at different levels, different torsion. Searching the isogeny class for a curve
      where some auxiliary computation is easy is a resource nobody exploits, because we assume all curves
      in a class are equally hard. That assumption has never been proven.'
    complete: true
    missing_text: null
    editorial_note: Claim, controls and caveats are Coordinator intake annotations, not additional user assertions.
  design_readiness:
    ready: false
    approved_by: null
    reason: Auxiliary computation and transport contract remain unspecified.
  novelty_screen:
    status: incomplete
    retrieval: Knowledge CLI attempted with top_k=4, source_type=ledger; unavailable because the configured
      in-memory collection does not exist. Direct local searches and limited primary-source abstract retrieval
      used instead.
    claim_boundary: No novelty, impossibility, prior-experiment outcome or successful cryptanalysis asserted.
  citations:
  - ref: https://arxiv.org/abs/math/0411378v3
    provenance: retrieved
    claim: Abstract states GRH-conditional polynomial random reducibility for curves with nearly the same endomorphism
      rings; abstract only read, not a theorem-level scope audit.
    verified_by: coordinator intake session 2026-09-05
  - ref: IDEA-20260807-3f5545
    provenance: internal
    claim: Opening claim already proposes full conductor-level-vector stratification of within-class auxiliary
      cost; overlap, not evidence of a run or result.
    verified_by: coordinator intake session 2026-09-05
  - ref: IDEA-20260905-7c2cc1
    provenance: internal
    claim: Opening claim proposes conductor-interaction measurements through mixed Hecke differences; related
      proposal, not evidence of a result.
    verified_by: coordinator intake session 2026-09-05
  assumptions:
  - Only mathematical definitions and user conjectures are recorded; all proposed advantages remain unverified.
  - Any later study uses declared generated fixtures and requires a separately frozen contract.
  predictions:
  - metric: Auxiliary work by presentation and conductor level
    direction: different
    minimum_effect: Not numerically specified by the user; must be frozen with the missing interface before
      experimental approval.
  minimal_test:
    design: First specify the auxiliary computation and admissible transport conditions. A later bounded descriptive
      comparison on self-generated small ordinary classes would hold field, trace and subgroup fixed while
      separating conductor level, coordinate presentation and auxiliary cost. Freeze sizes, sampling and stopping
      rules before any run.
    proposal_only: true
    controls:
    - Same curve with different coordinate presentations.
    - Within-level versus between-level comparisons with the same trace and subgroup.
    - Permutation of level labels; verify that transport has not killed the subgroup.
    required_metrics:
    - Auxiliary work by presentation and conductor level
    - Search and isogeny construction/evaluation work
    - Peak memory, success frequency and selection bias
    execution_authorized: false
  falsification_conditions:
  - The proposed auxiliary statistic is constant under the specified admissible transport.
  - Variation disappears under coordinate normalization or matched sampling.
  - All apparent auxiliary savings are consumed by search and map costs in the frozen scope; this does not
    close the isogeny direction generally.
  confounders:
  - Hidden preprocessing, selection bias, coordinate artifacts and unmatched comparison budgets.
  - A definitional or mixing effect need not supply useful logarithm information.
  interpretation_limits:
  - No experiment, proof, speedup, generic-group separation or novelty result is supplied.
  - No global direction closure follows from a failed specified construction.
  - This intake neither replaces an existing campaign next_action nor approves an experiment.
  heuristic_assumptions:
  - id: H1
    statement: The distribution of auxiliary costs across accessible presentations contains enough favorable
      cases to offset full search and transport costs.
    rigorous_support: None established for this conjecture. No distribution theorem or random-model justification
      is supplied; this is a design prerequisite, not a supported heuristic.
    validation_plan: First specify the auxiliary computation and admissible transport conditions. A later bounded
      descriptive comparison on self-generated small ordinary classes would hold field, trace and subgroup
      fixed while separating conductor level, coordinate presentation and auxiliary cost. Freeze sizes, sampling
      and stopping rules before any run. Compare all declared controls and report uncertainty and tails; no
      transfer from small fixtures is assumed.
  target_complexity:
    time_exponent: Unspecified; aspirational target below n^(1/2), no bound claimed.
    memory_exponent: Unspecified; evaluator, tables, maps and sampling storage must be accounted for.
    best_known: 'Comparison target: generic Pollard rho, expected O(sqrt(n)) group work under the usual random-walk
      heuristic, with small sequential storage; n denotes subgroup order, not field size.'
    hidden_overhead: No o(1) claim; include preparation, representation conversion, precision, search, failed
      attempts, output interpretation and verification.
    tradeoff_note: No Pareto position or parallel speedup established; report memory and data/query costs together
      with time.
