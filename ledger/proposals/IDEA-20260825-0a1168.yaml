  batch: EC-STRUCTURE-20260825
  cluster: 'C6-arity: what the rigidity closure leaves open'
  title: HOW MUCH OF THE GRAPH OF [k] DOES ONE INSTANCE REVEAL? the graph of multiplication by k is a
    curve in E x E whose numerical class determines k, and an instance is a single rational point on it
    -- measure the information deficit geometrically, independently of any algorithm
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The Neron-Severi structure of E x E and the numerical class of a graph are standard and
    recalled. The proposed contribution is the reformulation of the ECDLP as recovering a divisor class
    on an abelian surface from one point of a member, which gives an algorithm-independent measure of
    the deficit.
  claim:
    semantic_part: The graph of [k] is a curve in E x E whose class in the Neron-Severi group is determined
      by k through its intersection numbers with the two fibres and the diagonal; an ECDLP instance is
      one rational point of that curve, so the ECDLP is the problem of recovering a divisor class from
      a single point of a member of the family.
    evaluator_part: 'Unestablished: how many points, and of what kind, pin the class; and whether any
      of them are obtainable below matched rho. Both are the questions, not results.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Compute the class of the graph of [k] in NS(E x E) explicitly, including the extra generators contributed
    by the CM structure when End(E) is larger than Z.
  - Determine the minimal number of rational points of the graph that pin its class, and whether the points
    must be in general position.
  - 'Ask which of those points an instance supplies for free: (P, Q) is one; (mP, mQ) for known m is another
    but is not independent, since the class is already determined by the pair''s relation.'
  - Formalize the resulting deficit and check it agrees with the rank statement in IDEA-20260825-7260b2;
    agreement between a geometric and a module-theoretic measure would be evidence the deficit is intrinsic
    rather than an artifact of either framing.
  lossy_projection_test:
    tracked_object: the numerical class of the graph of [k] in NS(E x E)
    what_is_discarded: everything about the graph except its class
    propagation: classes add under composition of correspondences, so the object propagates under the
      natural operations
    verdict: 'PASSES: the class is a genuine invariant, strictly coarser than the graph, and composition-compatible.'
  predictions:
  - id: P1
    status: established_formula
    statement: The class of the graph of [k] is determined by k and determines k.
  - id: P2
    status: unestablished
    statement: The minimal number of rational points pinning the class exceeds what a single instance
      supplies.
  - id: P3
    status: unestablished
    statement: The geometric deficit and the module-theoretic rank deficit agree.
  minimal_discriminating_test:
    status: specified_not_run
    test: 'Toy scale: enumerate the graph for small k, compute its class, and determine empirically how
      many points are needed to pin the class among the candidate classes.'
    pass: The empirical count matches the derived one and is greater than one.
    fail: A single point sufficing at toy scale would refute the framing, most likely because the candidate
      class set is too small at that size.
  controls:
  - The graph of [1] (the diagonal) and of [0], whose classes are known, as correctness checks.
  - A curve in E x E that is not a graph, to confirm the class computation distinguishes graphs from non-graphs.
  - A CM curve where NS has an extra generator, to check the extra generator does not silently change
    the count.
  confounders:
  - At toy scale the candidate class set is small, so 'pinning' is easy for reasons with no bearing on
    the cryptographic size.
  - NS rank depends on End(E); a CM curve behaves differently and must be reported separately.
  - Rational points of the graph over F_p are plentiful; the constraint is which ones an instance actually
    supplies.
  falsification:
    semantic: A construction pinning the class from one instance point falsifies P2 and would be a genuine
      positive.
    evaluator: A class-computation error scopes out that cell.
    not_falsification: Failure to enumerate at larger toy sizes.
  why_this_is_not_a_variant: 'IDEA-20260806-0c9de1 represents an instance as a pair of points on a modular
    curve. This record stays on E x E and tracks a NUMERICAL CLASS rather than a point, which places it
    in a different taxonomy cell (value target: a lattice class, not a point) and gives an algorithm-independent
    deficit measure that a point representation cannot.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
