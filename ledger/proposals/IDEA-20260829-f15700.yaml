idea:
  id: IDEA-20260829-f15700
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  goal_id_note: >-
    ROUTING ONLY. Naming a goal is not a dispatch and authorizes no run. This
    record consumes committed censuses and runs no new family construction.

  title: >-
    The family-selection gate optimises the CEILING and the campaign needs the
    TOTAL: measure d(excess)/dR against the reducible-fibre root-lattice
    contribution R at matched height, and find where ceiling plus excess is
    actually maximised

  class: control

  claim: >-
    Every family-selection gate this program owns pushes the SAME knob in the
    SAME direction, and nobody has checked that the knob is monotone in the
    quantity the campaign actually needs. KN-FIND-e1b836's free pre-filter -
    one resultant on a degree-20 polynomial testing near-squarefreeness of the
    discriminant, which cut an exhaustive measurement set from 13,077 families to
    90 - selects for FEW REDUCIBLE FIBRES, because the Shioda-Tate ceiling is
    exactly 18 - sum(m_v - 1) and every reducible fibre subtracts from it. Write
    R = sum(m_v - 1) for that root-lattice contribution, so the ceiling is
    10*chi - 2 - R and the pre-filter is a device for making R small. But the
    rank of a specialisation over Q is BASE PLUS EXCESS, and the excess is not
    known to be independent of R. THE CLAIM UNDER TEST IS THAT IT IS NOT, AND
    THAT THE CHANNEL IS STRUCTURAL RATHER THAN METRIC. Costa and Salgado
    (arXiv:2205.07801, abstract retrieved this session) prove for rational
    elliptic surfaces that, under CONDITIONS ON THE SINGULAR FIBRES, the
    collection of fibres whose rank jumps by at least 3 is not thin - a theorem
    whose hypothesis is a statement about exactly the objects R counts. Define
    T(R) = (10*chi - 2 - R) + E(R), with E(R) the mean certified excess at
    MATCHED fibre naive height in a declared box. TWO READINGS ARE PRE-DECLARED
    AND BOTH ARE DECISIONS, NOT OPINIONS. IF the fitted derivative dE/dR at
    matched height is at most 0.3, then the ceiling dominates, T is decreasing in
    R, the existing pre-filter is optimising the right quantity, and BATCH-8b08ef
    searched the correct stratum and simply did not find a cell. IF dE/dR is at
    least 1.0, then T is non-decreasing in R, the campaign has spent its family
    budget at the WRONG END of the only knob it has, the 0.688 percent
    high-ceiling stratum is a stratum of geometric promises that arithmetic does
    not keep, and the correct gate is a two-term one that this program can write
    down the same day it measures the derivative.

  mechanism: >-
    Two committed measurements and one external theorem meet at a single scalar
    and nobody has put them together. FIRST, R IS THE ONLY KNOB. Shioda-Tate
    gives free rank 10*chi - 2 - R exactly, and KN-FIND-e1b836 measured that
    identity holding on 13,391 of 13,391 Mestre families with the Euler check
    sum(deg * v_disc) = 24 = 12d passing in every case checked; what varies
    between admissible tuples is the number of REDUCIBLE FINITE fibres, since
    every family carries the same I_4 or I_6 at T = infinity. So the census is
    already indexed by R, at zero additional cost. SECOND, R IS ALREADY KNOWN TO
    BE COUPLED TO HEIGHT, AND THE COUPLING IS MEASURED, WHICH IS WHY MATCHING IS
    MANDATORY. KN-FIND-91f871 records that the O(1) height constant tracks the
    reducible-finite-fibre count, and KN-FIND-e1b836 fits a ceiling coefficient of
    -0.30 per unit with coefficient content and class size matched. A comparison
    across R that does not match on height is therefore measuring the height law,
    not R. THIRD, THE STRUCTURAL CHANNEL IS EXTERNAL AND RECENT. Costa-Salgado's
    rank-jump-at-least-3 theorem is conditioned on the singular fibres, and
    Loughran-Salgado's non-thinness result is stated for elliptic surfaces
    admitting extra structure, with del Pezzo surfaces of degree 1 named in the
    abstract. A hypothesis about singular fibres is a hypothesis about R. If
    those conditions are satisfiable only when certain reducible fibres are
    PRESENT, then the excess is produced by exactly the fibres the pre-filter
    removes, and the campaign's two halves are in direct competition on one
    parameter. THE DESIGN IS NOT A BIGGER SIEVE. It is the same certification
    budget re-allocated across strata of R at matched height, which is the
    cheapest way to convert an unexamined monotonicity assumption into a fitted
    derivative with a confidence interval.

  tracked_object:
    object: >-
      The ROOT-LATTICE CONTRIBUTION of the singular fibres, R = sum over v of
      (m_v - 1), together with the multiset of Kodaira types realising it. NOT
      the family, NOT the fibres, NOT the points, NOT the score, NOT the height.
    lossy_projection_test: >-
      PASSES. The projection sends an elliptic surface over Q - its Weierstrass
      model, its j-map, its Mordell-Weil group, every specialisation and every
      point - to one non-negative integer and a short multiset of Kodaira
      symbols. From R one cannot recover the family, cannot recover a fibre,
      cannot compute a height, cannot exhibit a point, and cannot decide whether
      the ceiling is attained. It is NOT a change of coordinates: infinitely many
      pairwise non-isomorphic surfaces share any given R, and KN-FIND-e1b836's
      own census exhibits 13,352 families sharing the type at T = infinity. What
      is retained propagates DETERMINISTICALLY under the operations the pipeline
      performs, by exact bookkeeping rather than analogy: Shioda-Tate turns R
      into the ceiling in one step; the Euler relation sum(deg * v_disc) = 12*chi
      constrains which multisets are admissible at a given chi; a quadratic base
      change doubles chi and transforms each fibre type by a determined rule, so
      R propagates to the base-changed surface; and specialisation cannot change
      R at all, which is exactly why R is the right index for a stratification
      over specialisations.
    what_the_loss_costs: >-
      R prices no family. Two families with the same R can differ by 17.49 log
      units in height envelope - KN-FIND-e1b836 measured exactly that spread
      WITHIN one family between its envelope minimum and its rank-12 locus - so
      family choice still needs the measured envelope gate of KN-FIND-91f871, and
      R is a stratification variable, never a ranking.

  novelty_status: unverified
  novelty_note: >-
    CORPUS CHECK PERFORMED THIS SESSION AND THE NEAREST PRIOR ART OVERLAPS ON
    DATA, NOT ON THE QUESTION. IDEA-20260829-1348a3 (read IN FULL this session)
    measures the derivative of the excess-tail exponent beta with respect to
    GENERIC RANK across FOUR DIFFERENT CONSTRUCTIONS at matched height. This
    record holds ONE construction fixed - KN-FIND-e1b836's 13,391-family Mestre
    quartic census, all of the same chi and the same shape - and varies only R
    within it; the outcome variable is the mean excess and the TOTAL T =
    ceiling + excess, which is the quantity a family-selection GATE must
    maximise, not a tail slope. THE TWO RECORDS PREDICT THE SAME SIGN BY
    DIFFERENT MECHANISMS AND THAT IS STATED RATHER THAN GLOSSED: 1348a3's
    mechanism is metric (higher ceiling permits higher generic rank, which forces
    larger height and conductor, which thins the excess) and is supposed to be
    REMOVED by height matching, so its own null at matched height is a derivative
    of zero; this record's mechanism is structural (reducible fibres are the
    hypothesis of the rank-jump theorems) and survives height matching. The
    discriminator between them is therefore whether the effect concentrates on
    families whose fibre configuration satisfies the external conditions, and
    that discriminator is a declared metric below. KN-FIND-e1b836 is prior art
    for the census and for the statement that a higher ceiling does NOT cost
    envelope with content and class size matched (fitted ceiling coefficient
    -0.30 per unit), and this record does not restate it. External literature was
    checked only at ABSTRACT level, two fetches, no theorem read; `unverified` is
    the required label.

  citations:
    - ref: "arXiv:2205.07801"
      provenance: retrieved
      claim: >-
        Renato Dias Costa and Cecilia Salgado, "Large rank jumps on elliptic
        surfaces and the Hilbert property", submitted 16 May 2022, no journal
        reference shown. ABSTRACT STATES: given a RATIONAL elliptic surface over
        a number field, they study the collection of fibres whose Mordell-Weil
        rank is greater than the generic rank, and give CONDITIONS ON THE
        SINGULAR FIBRES to assure that the collection of fibres for which the
        rank jumps by at least 3 is not thin. THE CONDITIONS THEMSELVES ARE
        UNKNOWN TO THIS SESSION and are the unresolved dependency this design's
        step 0 exists to settle.
      verified_by: >-
        idea-generator session 2026-08-29, WebFetch of the arXiv ABSTRACT PAGE
        for 2205.07801. Full text NOT read; no theorem, hypothesis or constant is
        relied on as verified.
    - ref: "arXiv:1907.01987"
      provenance: retrieved
      claim: >-
        Daniel Loughran and Cecilia Salgado, "Rank jumps on elliptic surfaces and
        the Hilbert property", submitted 3 Jul 2019, revised 25 Nov 2020,
        journal reference "Annales de l'institut Fourier, to appear". ABSTRACT
        STATES: for an elliptic surface over a number field, under suitable
        assumptions, the collection of fibres with Mordell-Weil rank greater than
        the generic rank is NOT THIN; the results apply to quadratic twist
        families and DEL PEZZO SURFACES OF DEGREE 1.
      verified_by: >-
        idea-generator session 2026-08-29, WebFetch of the arXiv ABSTRACT PAGE
        for 1907.01987. Full text NOT read.
    - ref: KN-FIND-e1b836
      provenance: internal
      claim: >-
        THE CENSUS THIS RECORD STRATIFIES, AND THE MEASURED COUPLING IT MUST
        CONTROL FOR. Over an exhaustive census of 13,077 admissible canonical
        integer 6-tuples of spread at most 74 plus 314 further families, every
        family of Mestre's rank-12 quartic construction carries a multiplicative
        fibre at T = infinity of type I_4 (13,352 of 13,391) or I_6 (39), so the
        cap is 15 and never 18; the per-family ceiling is exactly
        18 - sum(m_v - 1) on 13,391 of 13,391, with the Euler check
        sum(deg * v_disc) = 24 = 12d passing in every case checked; only 90 of
        13,077, that is 0.688 percent, reach ceiling at least 13; what varies
        between tuples is the number of REDUCIBLE FINITE fibres. A higher ceiling
        does NOT cost envelope: with coefficient content and class size matched,
        every high-ceiling class sits at or below the size-matched generic
        minimum and the fitted ceiling coefficient is -0.30 per unit. Worked
        instance: tuple (0, 20, 40, 45, 52, 77) at t = 23, minimal model
        [0, 0, 0, -75951713419, 5158556462007754], naive height
        86.77369390941135 at certified rank at least 12, against the same
        family's envelope minimum 69.28330998318052 at t = 4 at certified rank 8
        - 17.49 log units apart within one family. Status at writing:
        BATCH-8b08ef searched the low-content corner of the high-ceiling stratum
        and reached BRANCH C, coverage 138/146 of the target stratum and 38/5549
        of the unfinished set, with the zero observed below the benchmark
        consistent with the measured rate and NOT informative about it; nothing
        there says the lever is closed or the stratum is empty.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-e1b836.md
    - ref: KN-FIND-91f871
      provenance: internal
      claim: >-
        THE MATCHING VARIABLE AND WHY IT IS MANDATORY. Fibre naive height is
        12 d log|t| + O(1); Shioda-Tate caps generic rank at 10d - 2, so generic
        rank r forces slope at least 1.2(r+2); the small-parameter lever exhausts
        inside a bounded region and inside it the fibre height is set by the
        family's own O(1) constant. THE OPERATIONAL GATE is to rank candidate
        families by MEASURED lower envelope of minimal-model naive height, about
        two seconds and 1e5 fibres per family. And the sentence this record turns
        into a hypothesis: the batch-3 refinement identifies WHICH family
        property the O(1) constant tracks in the construction of Mestre - the
        REDUCIBLE-FINITE-FIBRE COUNT, selected for by the pre-filter. Worked
        instance: NAGAO-1994 quartic d = 2, predicted slope 24 against measured
        24.14, envelope 109.5051651866501 at t = plus or minus 62 over 141221
        fibres, against Mestre 1982's 79.329 at the same rank 12.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-91f871.md
    - ref: EV-ECQ-0d142e
      provenance: internal
      claim: >-
        The certification cost model and the censoring gate this design must
        respect. 140 descents attempted on 137 distinct fibres, 84 timeouts, 56
        completed, mean 7.5 s at an 8 s alarm; Spearman(log|a6|, timeout) =
        +0.765 against Spearman(score, timeout) = -0.104; boundary B-5 requires
        conditional rates on completed-descent denominators; boundary B-2 records
        the largest excess ever observed anywhere in this program as +4; the
        137-fibre histogram is 8 x93, 9 x14, 10 x17, 11 x12, 12 x1 on a family
        whose R is 0 by construction, since all twelve fibres are irreducible
        I_1 - which makes the pencil the ZERO POINT of this record's abscissa and
        an already-paid data point.
      verified_by: >-
        idea-generator session 2026-08-29; FULL record read at
        ledger/evidence/EV-ECQ-0d142e.yaml
    - ref: IDEA-20260829-1348a3
      provenance: internal
      claim: >-
        PRIOR ART ON THE ADJACENT DERIVATIVE. Measures the derivative of the
        excess-tail exponent beta with respect to GENERIC RANK across at least
        four in-repo families at MATCHED FIBRE HEIGHT, on completed-descent
        denominators, under a mandatory 95-percent-completion censoring gate,
        with a fixed-rank envelope control (Mestre 1982 at envelope 79.329 versus
        NAGAO-1994 at 109.505) that separates "beta tracks rank" from "beta
        tracks the O(1) height constant". Its declared detectable effect is
        absolute derivative at least 0.15 per unit rank.
      verified_by: >-
        idea-generator session 2026-08-29; FULL record read at
        ledger/proposals/IDEA-20260829-1348a3.yaml
    - ref: IDEA-20260829-4bbd2a
      provenance: internal
      claim: >-
        COMPANION RECORD, FILED THIS SESSION. Proposes constructing excess on the
        in-repo rational elliptic surface via the residual conic of a line
        through a single base point, and names as an open dependency exactly the
        question this record measures: whether Costa-Salgado's conditions on the
        singular fibres exclude a surface whose twelve fibres are all irreducible
        I_1. The two records are complementary - one constructs excess on an
        R = 0 surface, the other asks whether R = 0 is where excess lives.
      verified_by: >-
        idea-generator session 2026-08-29; authored in the same session and read
        as written at ledger/proposals/IDEA-20260829-4bbd2a.yaml.
    - ref: >-
        Shioda-Tate for elliptic surfaces and the Kodaira classification of
        singular fibres
      provenance: recalled
      claim: >-
        RECALLED AND LOAD-BEARING FOR THE ABSCISSA. Free Mordell-Weil rank is
        10*chi - 2 minus sum over reducible fibres of (m_v - 1), where m_v is the
        number of components of the fibre at v. The design RECOMPUTES R and the
        ceiling for every family from its own discriminant with the Euler check,
        reproducing KN-FIND-e1b836's committed table first, so a misremembered
        form of the formula falsifies a reproduction gate rather than corrupting
        a derivative.
      verified_by: null

  assumptions:
    - >-
      The 13,391-family census is recoverable from committed state with its fibre
      configurations, or recomputable from each family's own discriminant. If it
      is not, the design stops and reports an input gap.
    - >-
      A common height window exists across the R strata. KN-FIND-e1b836's fitted
      ceiling coefficient of -0.30 per unit says the coupling is weak enough that
      one should, but the emptiness of the common window is a real possible
      outcome and is a pre-declared falsification condition rather than a
      surprise.
    - >-
      Descent completion above 95 percent is affordable in every retained cell,
      following IDEA-20260829-1348a3's gate. If it is not, the experiment does not
      run to a conclusion, because the censoring confound points in the direction
      of the hypothesis.

  proof_search_map:
    bottleneck: >-
      Deciding which family to spend a certification budget on. Today that
      decision is made by a gate that maximises the GEOMETRIC CEILING - one
      resultant testing near-squarefreeness, which selects small R - and the
      campaign has never checked whether the excess it then has to find is
      independent of that choice. Removing the bottleneck means a gate on the
      TOTAL rather than on the ceiling, which requires exactly one number: the
      derivative of excess with respect to R at matched height.
    baseline_embedding:
      parameter_slice: >-
        The R = 0 case is not a lookalike, it is a committed data point: the
        pencil of EV-ECQ-0d142e has all twelve fibres irreducible I_1, so R = 0,
        ceiling 8, and its excess histogram over 137 certified fibres is already
        paid for. The existing gate is the assertion that this end of the
        abscissa is optimal, and it is the exact old-method boundary.
      reproduction_check: >-
        Frozen fixture, two of them. (i) Recompute the per-family ceiling
        18 - sum(m_v - 1) on all 13,391 families from their own discriminants and
        require EXACT agreement with the committed deliverable, with the Euler
        check sum(deg * v_disc) = 24 = 12d passing. (ii) Recompute the committed
        137-fibre histogram from certified_curves.json (sha256
        a342ff9c...d15aee) and require exact agreement. A pipeline that cannot
        reproduce both may not produce a derivative.
    observation_collision:
      observable: >-
        The pair (R, mean certified excess at matched height), and the fitted
        derivative dE/dR.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE EXPERIMENT'S CENTRAL DANGER, and it has
        THREE distinct preimages producing the same positive derivative. (a) The
        structural channel this record is about: reducible fibres are the
        hypothesis of the rank-jump theorems and genuinely produce excess. (b)
        The metric channel of IDEA-20260829-1348a3: small R permits large generic
        rank, which forces larger height and conductor, which thins the excess -
        removed by height matching if and only if height is a sufficient
        matching variable, which is that record's own H2 and its stated weakest
        assumption. (c) The censoring artefact: small R means larger fibres at a
        fixed parameter box, larger fibres time out more, timeouts are recorded
        at the section floor, and the floor is excess zero - so (c) manufactures
        (a). SEPARATION CONDITIONS, ALL MANDATORY AND ALL DECLARED IN ADVANCE:
        matching on measured height envelope rather than on parameter box
        separates (b); a 95-percent per-cell completion gate with published
        per-cell completion rates and analysis on completed denominators
        separates (c); and the CONFIGURATION-CONCENTRATION metric - whether the
        excess gain concentrates on families whose fibre multiset satisfies the
        Costa-Salgado conditions read at full text - is what separates (a) from a
        smooth dependence on R alone. Without that third test a positive
        derivative is uninterpretable between (a) and (b).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the whole Kodaira multiset rather than the single integer R,
          because the external theorems' hypotheses are conditions on the TYPES
          and the weaker invariant R cannot express them.
        predicted_gain: >-
          Separates the structural channel from a smooth dependence on a scalar,
          which is precisely the distinction the weaker summary destroys.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure counting certified fibres per unit of TOTAL rank
          T = ceiling + excess, charged over disjoint (R, height) cells with
          declared denominators fixed before any family is measured.
        predicted_gain: >-
          Converts the gate from a one-term rule (maximise the ceiling) into a
          two-term rule with a measured coefficient, which is a decision the
          campaign can act on the same day.
    quantifier_order: >-
      DECLARED BEFORE ANY FAMILY IS CERTIFIED. FOR ALL R strata S in the declared
      partition and FOR ALL height cells H in the declared common window, THERE
      EXISTS a mean excess E(S, H) estimated on completed-descent denominators;
      the claim under test is a statement about the FUNCTION E, namely that its
      partial derivative in R at fixed H is bounded away from zero. Note the
      order: the common height window must be non-empty for ALL retained strata
      SIMULTANEOUSLY, which KN-FIND-91f871's slope law and KN-FIND-e1b836's
      -0.30 coefficient make a real constraint; strata whose height support does
      not overlap the common window are EXCLUDED before outcomes are seen and the
      exclusion is published, because a fit over non-overlapping supports is not
      a comparison.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over this census, in this common height window, at this completion rate,
        the mean certified excess changes by this much per unit of R, with this
        confidence interval, and the total ceiling-plus-excess is maximised at
        this R." That is a fitted derivative over one construction. It certifies
        no rank, exhibits no curve, cannot extrapolate to other constructions,
        cannot extrapolate to chi at least 3, and cannot say anything about
        excess beyond the k at most 4 this program has ever observed.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must FAIL: two families
        with the SAME R but very different measured height envelopes - the
        NAGAO-1994 quartic at 109.505 against Mestre 1982 at 79.329, both at rank
        12, both already measured in KN-FIND-91f871. If their excesses differ as
        much as the fitted derivative in R predicts across a whole stratum, then
        the effect tracks the O(1) envelope constant and not R, and the framing
        is withdrawn rather than rescued.
    proof_obligations:
      - claim: The committed 13,391-family ceiling table and the 137-fibre histogram are reproduced exactly first.
        responsibility: baseline
      - claim: The common height window across retained R strata is non-empty.
        responsibility: scope
      - claim: Per-cell descent completion exceeds 95 percent in every retained cell.
        responsibility: correctness
      - claim: The derivative in R is separated from the derivative in the envelope constant.
        responsibility: strictness
      - claim: The Costa-Salgado conditions are written down at full text before configuration concentration is tested.
        responsibility: scope
      - claim: The census strata are canonical representatives with published multiplicities.
        responsibility: scope
      - claim: The budget fits at the alarm the completion gate demands.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        geometric_reproduction -- families of KN-FIND-e1b836's census whose
        recomputed ceiling 18 - sum(m_v - 1) matches the committed deliverable,
        with the Euler check
      direction: different
      minimum_effect: >-
        exactly 13,391 of 13,391. Any mismatch halts the experiment before an
        excess number is produced.
    - metric: >-
        excess_derivative dE/dR -- the fitted partial derivative of mean
        certified excess with respect to R at matched measured height envelope,
        over at least five R strata spanning at least six units of R, on
        completed-descent denominators
      direction: different
      minimum_effect: >-
        two-sided against the null of zero, with a declared detectable effect of
        0.3 per unit of R. AT LEAST 1.0 is the "the gate is at the wrong end"
        reading; AT MOST 0.3 with a confidence interval excluding 1.0 is the "the
        ceiling dominates and the gate is right" reading. Both are reportable and
        both change what the next batch does.
    - metric: >-
        total_argmax -- the value of R maximising T = (18 - R) + E(R) over the
        census, with a confidence interval
      direction: different
      minimum_effect: >-
        reported as an integer with its interval. R at its census minimum is the
        current gate's implicit answer; any interior argmax is a direct,
        actionable correction to the gate.
    - metric: >-
        configuration_concentration -- whether the excess gain concentrates on
        families whose Kodaira multiset satisfies the Costa-Salgado conditions,
        measured as the difference in mean excess between qualifying and
        non-qualifying families AT THE SAME R and the same height cell
      direction: different
      minimum_effect: >-
        at least 0.4 rank units would attribute the effect to the STRUCTURAL
        channel; a difference indistinguishable from zero at the same R would say
        the dependence is smooth in R and is therefore not distinguishable from
        the metric channel of IDEA-20260829-1348a3. THIS IS THE METRIC THAT
        SEPARATES THE TWO MECHANISMS and it is the reason this record is not a
        duplicate of that one.
    - metric: >-
        high_ceiling_stratum_contrast -- maximum certified rank in the 90-family
        ceiling-at-least-13 stratum against a size-matched, height-matched sample
        from an interior R stratum, at an identical certification budget
      direction: different
      minimum_effect: >-
        at least 1 rank unit in either direction. An interior stratum winning
        would supply a mechanism for BATCH-8b08ef's BRANCH C outcome that is not
        "the search was too small".
    - metric: >-
        envelope_control -- the difference in mean excess between NAGAO-1994
        (envelope 109.505) and Mestre 1982 (envelope 79.329), both at rank 12, in
        the common height cells
      direction: different
      minimum_effect: >-
        if the absolute difference exceeds three times the fitted per-unit
        derivative in R, the effect is attributed to the O(1) envelope constant
        and the R framing is WITHDRAWN.
    - metric: >-
        per_cell_completion -- descent completion rate in every retained cell
      direction: higher
      minimum_effect: >-
        at least 0.95 in every retained cell, published per cell. Any cell below
        it is excluded before outcomes are seen and the exclusion is published.

  minimal_test:
    design: >-
      STEP 0 (hypothesis audit, about 4 h, no compute). Read arXiv:2205.07801 and
      arXiv:1907.01987 AT FULL TEXT and write down the conditions on the singular
      fibres explicitly. Classify every family in the census as qualifying or
      not. A finding that the conditions exclude the entire census - or that they
      exclude every surface with all fibres irreducible, which would immediately
      answer IDEA-20260829-4bbd2a's open dependency - is a complete and
      legitimate result obtained for the price of reading two papers.
      STEP 1 (reproduction gate, about 1 CPU-hour). Recompute the 13,391-family
      ceiling table with the Euler check and the committed 137-fibre histogram.
      STOP CONDITION.
      STEP 2 (stratification and height matching, about 2 CPU-hours). Partition
      the census into at least five R strata with canonical representatives and
      published multiplicities; measure each family's lower height envelope over
      1e5 fibres in the KN-FIND-91f871 convention at about two seconds per
      family; construct the COMMON height window and at least three disjoint
      cells inside it; publish the window, the cells and every exclusion with its
      reason.
      STEP 3 (alarm calibration, about 2 CPU-hours). Pilot 20 descents per cell
      to find the alarm giving completion above 95 percent. Cells where no
      affordable alarm does are marked censored and excluded BEFORE any outcome
      is seen.
      STEP 4 (staged main run, about 12 to 30 CPU-hours). Certify at least 150
      fibres per retained (stratum, cell) at the calibrated alarm, in two stages
      with a pre-declared interim look, in a pre-declared randomised order so
      budget exhaustion cannot preferentially censor one stratum. Fit dE/dR and
      T(R) on completed denominators.
      STEP 5 (controls and adjudication, about 3 CPU-hours). Run the fixed-R
      envelope control, the configuration-concentration test at fixed R, and the
      high-ceiling-versus-interior contrast; report the argmax of T and the
      resulting two-term gate, with its coefficient and interval.
    controls:
      - >-
        REPRODUCTION CONTROL: the 13,391-family ceiling table and the 137-fibre
        histogram must both come back exactly. If not, nothing else runs.
      - >-
        CENSORING CONTROL, LOAD-BEARING: per-cell completion above 95 percent,
        rates published per cell, all fits on completed denominators, cells that
        cannot reach it excluded before outcomes are seen. The confound points in
        the direction of the hypothesis, so this is a gate and not a nicety.
      - >-
        ENVELOPE CONTROL AT FIXED R: NAGAO-1994 against Mestre 1982, both rank
        12, separating "excess tracks R" from "excess tracks the O(1) constant".
      - >-
        CONFIGURATION CONTROL AT FIXED R: qualifying against non-qualifying
        Kodaira multisets within one R stratum and one height cell. This is what
        separates the structural channel from the metric one.
      - >-
        R = 0 ANCHOR: the committed pencil, whose twelve fibres are all
        irreducible I_1 and whose excess histogram is already paid for, anchors
        the low end. A fit that cannot accommodate the anchor is not comparing
        like with like.
      - >-
        BLIND ORDER: cells certified in a pre-declared randomised order.
      - >-
        MULTIPLICITY CONTROL: canonical representatives with published
        per-class multiplicities, since distinct 6-tuples can give isomorphic
        surfaces and a distribution over a multiset with unknown multiplicities
        is not a distribution.
    required_metrics:
      - the Costa-Salgado and Loughran-Salgado conditions as written down at full text, with per-family qualification
      - recomputed ceiling and R for all 13,391 families, with the Euler check outcome
      - per-family measured height envelope over 1e5 fibres, and the common window with all exclusions
      - per-cell alarm, descent completion rate, and coefficient-size distribution
      - per (stratum, cell) excess histogram on completed denominators, with denominators declared first
      - fitted dE/dR with confidence interval, and T(R) with its argmax and interval
      - the configuration-concentration difference at fixed R and fixed cell
      - the fixed-R envelope-control difference
      - wall clock, peak RSS, and every timeout recorded as operational

  falsification_conditions:
    - >-
      If either reproduction gate fails, no derivative may be reported.
    - >-
      If the common height window across the retained R strata is EMPTY, the
      comparison is impossible as designed, and the correct report is that the
      height law makes height-matched comparison across R infeasible for this
      construction - itself a strong result, since it would mean the gate's
      correctness is untestable this way.
    - >-
      If per-cell completion cannot exceed 95 percent at any affordable alarm,
      the censoring confound dominates the effect and the experiment must not be
      run to a conclusion.
    - >-
      If the fitted dE/dR confidence interval contains 0 and excludes 1.0, the
      pre-declared "the ceiling dominates" reading is recorded: the existing
      pre-filter is confirmed as optimising the right quantity, and BATCH-8b08ef
      searched the correct stratum.
    - >-
      If the fixed-R envelope control shows a difference at least three times the
      fitted per-unit derivative, the effect is attributed to the O(1) constant
      and the R framing is withdrawn.
    - >-
      If STEP 0 finds the external conditions exclude the entire census, the
      structural mechanism has no support here; only the empirical derivative
      stands, and it must be reported without the theorem attached.
    - >-
      A timeout, OOM or crash is an OPERATIONAL condition under AGENTS.md rule 3
      and is never negative evidence about a stratum.

  confounders:
    - >-
      CENSORING CAN MANUFACTURE THE ENTIRE RESULT AND POINTS IN THE HYPOTHESIS'S
      DIRECTION. Small R means a larger ceiling means potentially larger fibres
      means more timeouts means more fibres recorded at the section floor means
      smaller apparent excess at small R means a positive apparent dE/dR. The
      95-percent completion gate is what stands between this measurement and an
      artefact, and the mechanism is not hypothetical - Spearman(log|a6|,
      timeout) = +0.765 is measured.
    - >-
      HEIGHT AS AN INSUFFICIENT MATCHING VARIABLE. KN-FIND-91f871 records that
      the O(1) constant tracks the reducible-finite-fibre count, which is R
      itself, so height and R are coupled by construction at a measured -0.30
      per ceiling unit. Matching on measured envelope removes the mechanical part
      of that coupling but not necessarily all of it; the fixed-R envelope
      control is the direct measurement of the residue.
    - >-
      CENSUS MULTIPLICITY AND SELECTION. Distinct canonical 6-tuples can give
      isomorphic surfaces, and the 90-family high-ceiling stratum was itself
      selected by a squarefree-discriminant pre-filter that acts on exactly the
      fibre configuration this record uses as its abscissa. Any contrast
      involving that stratum is conditional on that selection, and the matched
      interior sample exists solely to break it.
    - >-
      GENERIC RANK PROVENANCE. A family's actual generic rank can be below its
      ceiling, and using the ceiling as a proxy for the base biases the computed
      excess. Controlled by reporting excess against the family's own certified
      generic rank where one exists and against the ceiling where it does not,
      with the two never pooled.
    - >-
      ONE CONSTRUCTION. The whole census is Mestre's rank-12 quartic
      construction at one chi, which is the price paid for holding the
      construction fixed. Nothing measured transfers to the pencil route, to a
      K3, or to chi at least 3, and the R = 0 anchor is a single family from a
      DIFFERENT construction and is used as an anchor, not as a census member.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE AND CERTIFIES NO RANK. It cannot advance
      GOAL-ECQ-e72c0b's completion criteria by a single point.
    - >-
      A derivative is not a gate. Even a decisive dE/dR yields a REVISED
      SELECTION RULE, which still has to be tested by finding curves, and no
      batch may be authorised on the strength of the coefficient alone.
    - >-
      A "the ceiling dominates" result CONFIRMS existing practice rather than
      discovering anything and must be reported at that strength. A "the gate is
      at the wrong end" result REPRICES the family lane; it does not close it,
      and it does not retroactively make BATCH-8b08ef's coverage figures wrong -
      they remain exactly what they measured.
    - >-
      Scoped to this census, this construction, the common height window actually
      achieved, the alarms actually used, and excess at k at most 4. Rank at
      least 31 over Q remains a live claimed record held by others.
    - >-
      The external theorems were read at ABSTRACT level only by the session that
      proposed this. Any use of their hypotheses before STEP 0 reads them at full
      text is unsupported.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (HEIGHT SUFFICIENCY ACROSS R.) Conditional on the measured minimal-model
        naive height cell H, the distribution of the certified excess is
        independent of the family, EXCEPT through the root-lattice contribution R
        and through the qualification of its Kodaira multiset under the external
        conditions. That is, measured height envelope is a sufficient statistic
        for the metric confounding that KN-FIND-91f871 identifies.
      rigorous_support: >-
        RIGOROUS PART: the fibre naive height is 12 d log|t| + O(1) with
        d at least ceil((r+2)/10), so height is the variable through which the
        ceiling mechanically constrains fibre size, and matching on it removes
        that mechanical channel exactly. STRUCTURAL FACT: R is invariant under
        specialisation, so the abscissa cannot be perturbed by the sampling.
        DISTRIBUTION IMITATED: the standard practice of conditioning rank
        statistics on conductor or on a monotone proxy for it rather than on a
        parameter box. H1 IS THE ASSUMPTION MOST LIKELY TO BE FALSE and it is the
        same assumption IDEA-20260829-1348a3 records as its own weakest, which is
        why the fixed-R envelope control is mandatory here as it is there.
      validation_plan: >-
        Sample: the fixed-R envelope control - NAGAO-1994 at envelope
        109.5051651866501 and Mestre 1982 at 79.329, both at rank 12, both
        measured in KN-FIND-91f871 - certified in the same common cells, at least
        150 fibres each, plus at least three further same-R pairs drawn from the
        census with maximally separated envelopes. Shortcut making this feasible:
        the envelope is measurable at about two seconds and 1e5 fibres per
        family with no descent at all, so pairing is free and only the
        certification costs. Compare: if H1 holds, same-R pairs agree within the
        fitting error; the observed spread across same-R pairs is the DIRECT
        MEASUREMENT of H1's failure and is reported as such. Tail check: repeat
        in the highest and lowest common cells separately, where H1 should fail
        worst; also report conductor as a second matching variable and state
        whether the two matchings give the same sign for dE/dR - disagreement is
        reported, never reconciled by choosing one. TRANSFER ASSUMPTION, STATED:
        sufficiency measured on one construction at one chi transfers to no other
        construction and to no other chi.
    - id: H2
      statement: >-
        (STRUCTURAL CHANNEL LOCALISATION.) If the excess genuinely depends on the
        singular-fibre configuration through the mechanism the external theorems
        describe, then at FIXED R and FIXED height cell the families whose
        Kodaira multiset satisfies the published conditions carry a mean excess
        at least 0.4 rank units above those that do not; whereas if the
        dependence is metric, that difference is indistinguishable from zero.
      rigorous_support: >-
        RIGOROUS PART: none is claimed for the size 0.4, which is a declared
        detectable effect and not a prediction from theory. WHAT IS STRUCTURAL is
        that the external results condition on the singular fibres and not on R,
        so a mechanism operating through them must be visible at fixed R - a
        logical consequence of the hypotheses' shape, independent of their
        content, which is why this test can be designed before the papers are
        read. DISTRIBUTION IMITATED: none; this is a localisation test, in the
        same shape as testing whether an effect survives conditioning on a
        summary statistic.
      validation_plan: >-
        Sample: within each R stratum and each common height cell, at least 60
        qualifying and 60 non-qualifying families, qualification assigned in STEP
        0 from the full-text conditions BEFORE any certification runs, with the
        assignment frozen and published. Shortcut: qualification is read off the
        already-computed Kodaira multiset at no additional cost. Compare: the
        mean-excess difference against the 0.4 threshold, with a Fisher or
        t-interval, per stratum and pooled. Tail check: report the maximum
        certified rank in each arm as well as the mean, since a structural
        channel producing rank JUMPS OF AT LEAST 3 - the external abstract's own
        phrasing - should show up in the upper tail before it shows in the mean;
        an effect visible only in the mean and not in the tail is reported as
        such. TRANSFER ASSUMPTION, STATED: a localisation result on this census
        says nothing about whether the theorems' conclusions hold for it, since
        satisfying a hypothesis is not the same as exhibiting the conclusion, and
        this program certifies conclusions by exhibited points only.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC OR CRYPTOGRAPHIC EXPONENT IS MOVED, AND THIS RECORD DOES NOT
      PRESENT ONE. What it measures is a coefficient inside the campaign's own
      cost model. The campaign selects families to maximise 10*chi - 2 - R and
      then pays exp(beta * k) certified fibres for excess k. If dE/dR is c, then
      the total attainable rank is (10*chi - 2 - R) + E_0 + c*R, whose gradient
      in R is c - 1: for c above 1 the campaign is walking downhill in its own
      objective at every family-selection decision it has ever made, and for c
      below 1 it is walking uphill. Measuring a coefficient is not moving an
      exponent and this record does not claim otherwise.
    memory_exponent: >-
      Flat and negligible: independent descents streamed, plus a census table of
      13,391 rows. Budget 2 GB peak RSS against the 1.22 GB the predecessor
      campaign measured on the same class of box.
    best_known: >-
      IN THIS REPOSITORY: family selection is done by the KN-FIND-e1b836
      pre-filter (one resultant on a degree-20 polynomial, cheaper than a single
      one of the 73 height evaluations it replaces) followed by the
      KN-FIND-91f871 envelope gate (about two seconds and 1e5 fibres per family).
      Both are one-term rules on the CEILING and the ENVELOPE; neither has an
      excess term, and no measurement of an excess term exists at any R.
      EXTERNALLY: the rank-jump non-thinness results of Loughran-Salgado and
      Costa-Salgado, read at abstract level only this session.
    hidden_overhead: >-
      Three disclosures. (1) The censoring confound points in the direction of
      the hypothesis and can generate the whole effect; the 95-percent gate may
      make the experiment unaffordable, in which case it must not run. (2) The
      derivative is fitted at excess k at most 4, the largest this program has
      ever observed, so any statement about the k that a record needs is an
      extrapolation and is labelled as one in the same sentence. (3) The abscissa
      R is a scalar summary of a multiset, and the external hypotheses are about
      the multiset; a null on R is not a null on the structure, which is exactly
      what the configuration-concentration metric exists to catch.
    tradeoff_note: >-
      Not a time-memory problem. The real trade is ALARM LENGTH against NUMBER OF
      STRATA: a longer alarm buys completion and therefore validity at linear
      cost per descent, more strata buy resolution in the derivative, and
      validity is not tradeable - so the alarm is set first by pilot calibration
      and the stratum count absorbs what remains. Trivially parallel across
      cells; the campaign runs at max_concurrent 1 and GOAL-ECQ-002's accounting
      note records exact linear algebra and descent as CPU-bound, so 2 concurrent
      producers is the honest ceiling on that box.

  dominated_by: >-
    FRONTIER ROWS CHECKED ACROSS TIME, MEMORY AND DATA. (1) THE KN-FIND-91f871
    ENVELOPE GATE DOMINATES ON COST BY THREE ORDERS OF MAGNITUDE - two seconds
    per family, no descent at all - and answers a strictly weaker question,
    namely which family is cheap to sieve rather than which is worth sieving.
    (2) IDEA-20260829-1348a3 DOMINATES ON GENERALITY: it varies generic rank
    across four constructions where this varies R within one, and anything it
    learns about the excess tail at matched height is partly this record's
    territory too. It is dominated here on the DECISION OBJECT - it fits a tail
    slope, this fits the total T and the argmax that a gate needs - and on the
    mechanism discriminator, since its design has no test separating a structural
    channel from a metric one. A batch running both would share STEP 1 to STEP 3
    entirely and should. (3) IDEA-20260829-4bbd2a DOMINATES ON CONSEQUENCE - it
    produces points, this produces a coefficient - and depends on this record's
    STEP 0 for its own open dependency. (4) COSTA-SALGADO AND LOUGHRAN-SALGADO
    DOMINATE THE MATHEMATICS entirely; nothing here is a theorem and no theorem
    is claimed. (5) A larger search of the existing high-ceiling stratum
    dominates on simplicity and is exactly what BATCH-8b08ef did, reaching BRANCH
    C with coverage 138/146 and 38/5549 and no cell taken - which is the
    strongest available reason to check whether the stratum was the right one
    before enlarging the search of it. On the axis this record competes on -
    whether the campaign's own family-selection rule is monotone in the quantity
    it needs - no row in this repository dominates it, because no row asks.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: EXACTLY ZERO. Delta on the world
    record: ZERO. WHAT MOVES IS A COEFFICIENT THE CAMPAIGN HAS BEEN ASSUMING TO
    BE ZERO WITHOUT SAYING SO. Current state: the family gate is a one-term rule
    maximising 18 - R, applied to a census of 13,391 families and used to select
    a 90-family stratum (0.688 percent) which BATCH-8b08ef then searched to
    coverage 138/146 of the target stratum and 38/5549 of the unfinished set,
    taking no cell; the implicit assumption that excess does not depend on R has
    never been tested at any R. After: dE/dR with a confidence interval over at
    least five strata at matched measured height on completed denominators, the
    argmax of T = (18 - R) + E(R), a mechanism-discriminating localisation test
    at fixed R, and a two-term gate with a numerical coefficient. Estimated cost
    roughly 20 to 38 CPU-hours plus a four-hour zero-compute reading step that
    can, on its own, answer an open dependency of IDEA-20260829-4bbd2a.

  estimated_cost:
    implementation: medium
    compute: high
    basis: >-
      Implementation reuses the committed ceiling and Euler-check machinery, the
      envelope measurement, the certify_rank path, plus a stratifier, an alarm
      calibrator and a fitting harness; no new mathematics to code. Compute is
      the problem and is honestly high at roughly 20 to 38 CPU-hours depending on
      the alarm the 95-percent completion gate demands, dominated by STEP 4. STEP
      0 costs no compute and is the highest-value four hours in the proposal.

  recommended_priority: medium

