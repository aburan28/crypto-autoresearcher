idea:
  id: IDEA-20260808-d830c6
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  title: 'A KN-FIND is warranted for the ONE reproducible endomorphism effect and it must
    be drafted so that it cannot be misread in either direction: the factor r = |Aut(E)|/2
    in searches-per-relation is the classical automorphism-quotient constant and is CONFIRMED
    at four toy instances, while the linear-algebra claim is UNADJUDICATED (KN-OPEN-006) -
    and the draft''s job is to make the second sentence as prominent as the first'
  class: measurement
  claim: '(A) WHAT IS ACTUALLY ESTABLISHED, QUOTED FROM THE LEDGER. DEC-20260727-009 rationale
    R5 records that across all four EXP-STR-003 instances the phi arm needed about a factor
    of 3 fewer relation-collection searches per relation row than the random arm (searches
    per row 0.692/1.811, 0.364/1.154, 0.383/1.136, 0.770/2.466, i.e. ratios 2.62, 3.17, 2.97,
    3.20), identifies this as r = 3, the classical automorphism-quotient saving already in
    the literature (Wiener-Zuccherato and Duursma-Gaudry-Morain for rho at sqrt(r); the factor-r
    factor-base quotient for index calculus), and states it is a CONSTANT FACTOR and therefore
    not target-class. (B) WHAT IS NOT ESTABLISHED, ALSO QUOTED. The same decision records
    instrument_question_disposition: UNADJUDICATED - whether phi_alpha is an artifact of the
    row-insertion rule "is OPEN and may be asserted in neither direction by any downstream
    record" - and records that the claimed super-constant B/(alpha^2 log B) linear-algebra
    saving "is exactly the part that is not supported". DEC-20260727-009 further declines
    to create a KN-FIND, on the stated grounds that the decision is `weaken` (not `support`
    or `reject_scoped`), that EV-STR-003 is `preliminary`, and that the r = 3 effect "is already
    the published specialized baseline, so recording it as an internal finding would add nothing
    to the corpus". (C) THE CLAIM OF THIS RECORD, WHICH DISAGREES WITH (B)''s LAST CLAUSE
    ONLY. Recording it adds something the corpus demonstrably needs: not the mathematical
    content (which is published), but the CLAIM BOUNDARY. In the eleven months of proposals
    screened for this slice, the r-factor and the linear-algebra claim are repeatedly adjacent,
    and DEC-20260727-009''s own limitation note has to spell out that "an honest structural
    ceiling for exact C_3-equivariance is a factor r = 3 ... which no arm tested". A KN-FIND
    whose statement is "the reproducible endomorphism effect on prime-field relation collection
    is the classical factor r = |Aut|/2, and the linear-algebra question is KN-OPEN-006 and
    is open in BOTH directions" is a boundary record, and boundary records are exactly what
    the goal''s own completion criterion asks for ("claim boundaries no stronger than cited
    EV/DEC scope"). (D) THE PROMOTION PRECONDITION THIS RECORD ACCEPTS. DEC-20260727-009 and
    docs/claims-and-verification.md require replication before any transition, and DEFER-BATCH009-001
    is open. So the proposal is: draft the KN-FIND now with its exact boundary, and gate its
    promotion on the EXP-STR-004 successor reproducing the r ratio under a contract frozen
    in advance. If the successor reproduces r, promote; if it does not, the promotion is blocked
    AND that non-reproduction is itself a finding about the only effect this line of work
    has. (E) THE DRAFT BOUNDARY, IN THE FORM IT SHOULD BE COMMITTED. Scope: toy tier; four
    j = 0 (D_0 = -3) prime-field curves with p = 1 mod 3 at 12, 12, 16, 20 field bits; n <=
    158071; B <= 397; arity m = 2 only; one realisation per cell. Claims: the ratio of searches-per-relation-row
    between a phi-stable and a size-matched random factor base was measured in [2.62, 3.20]
    at 4 of 4 instances, consistent with r = 3. Explicitly does NOT claim: any linear-algebra
    saving; any displacement-rank property; any statement about m = 3, about B > 397, about
    j != 0, or about any scale above toy; and it does NOT adjudicate whether phi_alpha measures
    row-insertion bookkeeping.'
  mechanism: 'Knowledge records prevent re-tread only when they carry the boundary, not just
    the headline. The failure mode this draft is designed against is the one the corpus already
    exhibited once: a real constant-factor measurement sitting next to an unsupported super-constant
    claim, with nothing in the record forcing a reader to keep them apart. Writing the negative
    half into the finding''s statement, rather than into a limitations block that downstream
    summaries drop, is the corrective.'
  why_not_a_renamed_known_approach: 'Nearest known: the KN-FIND promotion process itself (GOAL-FIND-001
    BATCH-001/002, which promoted KN-FIND-001..027 from replicated EV records). Those promotions
    were of records with a `support` or `reject_scoped` decision. This proposal is for a promotion
    from a `weaken` decision, of the one component that the weaken explicitly did NOT weaken
    - a case the existing process does not cover and which DEC-20260727-009 declined for a
    reason this record addresses directly rather than ignores.'
  predictions:
  - observable: reproduction of the r ratio under a frozen contract
    metric: searches-per-relation-row ratio (random arm / phi arm) at each instance of the
      EXP-STR-004 successor, with base-row budgets matched and the orbit-closure convention
      controlled
    predicted: in [2.4, 3.6] at every instance with 3 | (N - 1) and a phi-stable factor base,
      i.e. consistent with r = 3; and, critically, NOT larger - a ratio materially above r
      would indicate the arms differ in something besides the automorphism quotient
  - observable: independence of the ratio from B
    metric: the ratio as a function of B over at least four values of B
    predicted: flat in B (a constant factor, not a growing one). A ratio growing with B would
      contradict the constant-factor characterisation and would be the single most interesting
      outcome available in this lane
  - observable: the linear-algebra separation
    metric: end-to-end solve cost (with an actual right-hand side, which DEC-20260727-009
      R3 records has never been assembled) for the phi arm against the folded (B/r) x (B/r)
      system and against plain Wiedemann
    predicted: the phi arm's cost equals the folded system's cost up to a small constant,
      i.e. the entire structured saving is the folding already accounted for by r; a phi-arm
      cost materially BELOW the folded system's would be genuine residual structure and would
      reopen KN-OPEN-006 in the positive direction
  minimal_test: 'This record proposes a DRAFT plus a gate, not a new experiment: the measurement
    is the EXP-STR-004 successor that DEC-20260727-009''s next_actions already specifies (arms
    A-prime and E-prime, matched base-row budgets, alpha reported conditional on suppression
    count, sha256 of factor base and final row list per cell). The only addition proposed
    here is that the successor also record searches-per-relation-row per arm per instance
    (it is already computed) and, if feasible within budget, one end-to-end solve with a right-hand
    side at the smallest instance, so that prediction 3 has any data at all.'
  controls:
  - 'The successor''s own arms are the controls: E-prime is the phi-free closure that isolates
    closure convention from endomorphism content.'
  - SIZE-MATCHED RANDOM FACTOR BASE at identical B - the one-variable comparison DEC-20260727-009
    R2 identifies as the ablation the original experiment declared and never implemented.
  - 'A curve with 3 not dividing N - 1, where the order-3 structure is absent, as a null:
    the ratio must fall to 1 there. This control does not appear in any prior arm and is cheap.'
  confounders:
  - '"Searches per relation row" depends on the dedup and zero-filter policy; DEC-20260727-009
    records that the committed harness mixes three such policies. The ratio must be reported
    per policy, not pooled.'
  - A phi-stable factor base of size B covers only B/r orbits, so the two arms differ in effective
    factor-base size unless B is matched in ORBITS rather than in points - the choice must
    be declared and both reported.
  - Toy B values are small enough that a factor of 3 is a handful of searches; variance across
    seeds may exceed the effect at the smallest instance.
  falsification_conditions:
  - 'Ratio not in [2.4, 3.6] under the frozen contract: the one reproducible effect does not
    reproduce, the KN-FIND draft must not be promoted, and that is the finding.'
  - 'Ratio growing with B: the constant-factor characterisation is wrong.'
  - 'Ratio at or near 1 on curves with 3 | N - 1 and a genuinely phi-stable base: the automorphism-quotient
    mechanism itself is not operating in this harness.'
  interpretation_limits: A promoted KN-FIND here would record a CONSTANT FACTOR that is already
    published; it is a boundary record, not a discovery, and it must never be cited as an
    endomorphism advantage over rho. It adjudicates nothing about phi_alpha. It creates no
    permission to re-assert H-STR-002, which remains `weakened` with an open replication obligation.
    This record proposes; only the Coordinator may promote anything.
  assumptions:
  - The quoted values from DEC-20260727-009 R5 and its instrument_question_disposition are
    as recorded [corpus, read in full this session].
  - The classical automorphism-quotient results (Wiener-Zuccherato; Duursma-Gaudry-Morain)
    say what DEC-20260727-009 R5 says they say [corpus attribution; the papers were NOT read
    this session].
  heuristic_assumptions:
  - id: HA-1
    statement: The searches-per-relation-row ratio between a phi-stable and a size-matched
      random factor base converges to r = |Aut(E)|/2 as B grows, with fluctuation O(1/sqrt(number
      of relations)) at fixed B.
    rigorous_ingredient: The orbit-counting fact that a phi-stable base of B points has B/r
      orbits and that a decomposition found for one orbit representative yields r relations
      by equivariance - an exact statement, not a modelled one.
    distribution_imitated: Binomial fluctuation of hit counts around their mean, the standard
      model for relation-collection yield already used elsewhere in this corpus.
    validation_route: Measured directly by the successor experiment across at least four B
      values and at least three seeds per cell, at TOY SCALE (labelled toy). Crypto-scale
      validation is not available and is not claimed.
    tail_checks: Report the per-seed minimum and maximum ratio, not only the mean, and check
      that the spread narrows as B grows as the binomial model predicts. A spread that does
      not narrow indicates the ratio is not a yield effect.
  target_complexity:
    time_exponent: The finding records a CONSTANT factor r <= 3 in relation collection and
      r-related savings in the folded linear algebra. No exponent moves. Under the program's
      exponent-first bias this is explicitly LOW ambition, and it is filed as a boundary/building-block
      record rather than as a result - exactly the disclosure the brief requires for constant-factor
      items.
    memory_exponent: unchanged by the effect.
    best_known_baseline: Automorphism-discounted rho at 0.886 sqrt(N/r) (KN-TECH-018); the
      classical factor-r factor-base quotient for index calculus.
    hidden_overhead_disclosure: The r-fold collection saving presupposes that phi is evaluable
      in O(1) field operations, true for j = 0 and j = 1728 and false in general.
    time_memory_tradeoff: not applicable.
  sota_delta: Zero. The effect is the published baseline. The delta is a claim boundary that
    prevents the corpus from re-attaching an unsupported super-constant claim to a supported
    constant one.
  dominated_by: 'The effect itself is dominated by the published automorphism-quotient results
    it reproduces (Wiener-Zuccherato; Duursma-Gaudry-Morain for the rho side; the factor-base
    quotient for the index-calculus side). Frontier rows checked: rho 0.886 sqrt(N) / O(1);
    automorphism-discounted rho 0.886 sqrt(N/r) / O(1) - which already contains this effect;
    BSGS sqrt(N) / sqrt(N); van Oorschot-Wiener sqrt(N^3/w) / w. Nothing is beaten.'
  estimated_cost: 'Implementation: low (the ratio is already computed by the existing harness;
    the end-to-end solve at the smallest instance is the only new code). Compute: low.'
  recommended_priority: medium
  honest_prior_of_survival: '0.75 that the ratio reproduces in [2.4, 3.6] under a frozen contract
    - the mechanism is a one-line consequence of equivariance, and the risk is entirely in
    the harness conventions that have already caused two corrections in this lane. 0.1 that
    prediction 3 shows residual structure beyond folding. Filed medium: the mathematical content
    is known, the boundary value is real, and the goal it serves is paused.'
  novelty_status: unverified
  novelty_screen: Screened against KNOWLEDGE_BARRIERS.txt (no KN-FIND currently records the
    r-factor or KN-OPEN-006's economics; KN-OPEN-006 exists as an open problem), EXISTING_PROPOSALS.txt
    rows for RQ-EQIC-8cb959 and RQ-EQLA-0d3f40, full reads of H-STR-002.yaml, DEC-20260727-009.yaml,
    CORR-20260727-007.yaml, and targeted reads of IDEA-20260807-1e673d and IDEA-20260807-d6956c.
    WEB SEARCH UNAVAILABLE, so the Wiener-Zuccherato and Duursma-Gaudry-Morain attributions
    are repeated from DEC-20260727-009 and were NOT independently verified.
  discriminated_from: IDEA-20260807-1e673d proposes the synthetic matched-null generator that
    measures structure statistics as a surface over nuisance variables; this record proposes
    a knowledge-promotion draft with a boundary and a gate, and relies on 1e673d's successor
    for its data rather than duplicating it. IDEA-20260807-d6956c derives the B/g folding
    saving; this record accepts that derivation and asks only whether the measured collection
    ratio reproduces and whether anything survives beyond folding. IDEA-20260807-267b95 addresses
    the missing right-hand side; prediction 3 here depends on that being fixed and does not
    re-propose it.
  source_refs:
