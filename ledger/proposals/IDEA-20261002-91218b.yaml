idea:
  id: IDEA-20261002-91218b
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-02'
  title: >-
    Count the few-time signature addresses the official CEDRUS+C code can
    reach (sign-03-1)
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, reports that a macro precedence error in
    CEDRUS+C leaves only four reachable few-time signature addresses
    (finding sign-03-1). This idea asks whether the official round-1
    reference source has an address map whose image has size 4 on the
    domain the specification assigns. It proposes no new attack. CEDRUSɑ
    (sign-04) is not this candidate.
  mechanism: >-
    Read the specification's few-time address domain and the expression
    the reference source actually evaluates. Enumerate that domain, or the
    domain the finding names, and count distinct outputs of the source
    expression. The scored build is the unmodified official source. A
    parenthesization suggested by the finding may be counted beside it and
    is not the scored map.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      CEDRUS+C is an NGCC round-1 hash-based signature candidate, not an
      elliptic-curve discrete-log instance. The corpus entry that names it
      is a round-1 listing and states that it includes no third-party
      analysis.
    nearest:
      - ref: KN-LIT-4775e4
        provenance: kb
        relation: adjacent
        delta: >-
          KN-LIT-4775e4 records that CEDRUS+C is signature candidate 3 and
          states that the specification and reference code were not read.
          This idea adds an image-size count for published finding
          sign-03-1. It adds no new attack.
    searched:
      corpus_grep:
        - "knowledge/literature/KN-LIT-4775e4.md read 2026-10-02; it is the CEDRUS+C listing"
        - "knowledge/literature/KN-LIT-6f1b30.md is CEDRUSɑ, sign-04, and is not this candidate"
      web: []
      blocked: []
  test_boundary: >-
    Official CEDRUS+C zip from the round-1 roster (sign-03), every parameter
    set the package declares. sign-04 is out of scope. No claim about a
    repaired or later submission.
  falsification: >-
    On every declared parameter set, the unmodified source address map has
    as many distinct outputs as the specification's address domain.
  status: proposed
  proposed_by: coordinator
