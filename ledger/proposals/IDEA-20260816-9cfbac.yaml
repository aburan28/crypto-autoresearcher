idea:
  id: IDEA-20260816-9cfbac
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: Compute rather than quote the SNFS versus GNFS advantage as a function of special-form degree
    d and coefficient bound H by measuring the exact norm-bit distribution over a fixed sieve box,
    with a same-degree large-coefficient polynomial as the null object
  class: mechanism
  claim: (A) THE ADVANTAGE LIVES IN ONE DISTRIBUTION. Whatever the special number field sieve gains
    over the general one, it gains it because the algebraic norms it must factor are smaller. For
    a polynomial f of degree d and a linear companion x - m, the quantity that decides everything
    downstream is the bit-length distribution of the product |F(a,b)| times |a - b m| over the sieve
    box, where F is the homogenisation of f. This proposal asserts that the entire SNFS advantage
    at fixed size can be reported as a shift of that distribution, computed exactly at any size by
    integer arithmetic alone, with no sieve, no relation collection and no linear algebra. (B) THE
    CLASS AND THE NULL. Fix the class C(d,H) as before. The special arm uses f with coefficients bounded
    by H; the null arm uses a polynomial of the same degree d whose coefficients are of the size a
    general construction would produce, about p^(1/(d+1)), and which is otherwise treated identically.
    Both arms are evaluated over the identical sieve box and scored by the identical function, so
    the comparison isolates coefficient size and nothing else. (C) THE COMPUTABLE GAP. The deliverable
    is Delta(d,H,n), the difference in mean log2 norm between the arms, together with the induced
    difference in smoothness probability obtained by evaluating the Dickman function numerically from
    its defining delay differential equation, which is implementable in a few dozen lines of pure
    Python. Delta is a computed quantity with error bars from the box, not a quoted asymptotic constant.
    (D) THE TOY VALIDATION THAT KEEPS IT HONEST. At small n the predicted smoothness probability is
    checked against an exact count of B-smooth norm values obtained by trial division over the same
    box. A predicted probability that does not match the counted one falsifies the use of Dickman
    at these sizes and is reported as such, since the counted value is ground truth and the predicted
    one is a model. (E) WHAT IS NOT CLAIMED. No factorization, no discrete logarithm, no running time
    for any sieve, no crossover in wall-clock terms, and no claim that a special form confers any
    exploitable advantage against any real parameter set. A norm-distribution shift is a statement
    about norms. Converting it into a running time requires the relation-collection and linear-algebra
    costs that this proposal deliberately does not touch, and the specification forbids reporting
    Delta as a speedup.
  mechanism: 'STAGE ONE: define the sieve box as coprime pairs (a,b) with |a| <= A and 1 <= b <= B,
    and define the scoring function as the exact bit length of |F(a,b)| times |a - bm|, computed in
    arbitrary-precision integers with no floating point. STAGE TWO: construct the two arms. Special
    arm, draw f with coefficients bounded by H and a base m such that f(m) is an n-bit prime, recording
    the seed. Null arm, for the same p, construct a degree-d polynomial with coefficients of size
    about p^(1/(d+1)) that also has m as a root modulo p, which is the standard base-m construction
    with digits, so the null is not a different problem but the same p attacked without smallness.
    STAGE THREE: evaluate the score over the entire box on both arms and record the full histogram,
    not just the mean, since the tail is what smoothness depends on. STAGE FOUR: implement Dickman
    rho by numerically integrating its delay differential equation on a fixed grid and use it to convert
    each histogram into a predicted smooth-value count for declared smoothness bounds B_s. STAGE FIVE:
    count actual B_s-smooth values by trial division over the same box and compare counted with predicted.
    The claim stands if Delta is a stable, size-scaling quantity and the predicted and counted smooth
    counts agree within a stated factor; it is refuted if the histograms overlap so that Delta is
    inside its own error bar, or if Dickman mispredicts the counts badly enough that the conversion
    step is unusable at these sizes, in which case the honest deliverable is the counted ratio alone.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666, GOAL-SNFS-001 and RQ-RSA-afe33c, the last of which owns
      the GNFS cost model and explicitly assigns SNFS-as-an-object to GOAL-SNFS-001. Greps: grep -ril
      Dickman over ledger/ and knowledge/; grep -ril -E ''trapdoor|SNFS|special number field'' ledger/proposals/;
      grep -ril -E ''special.form|SNFS'' ledger/hypotheses/. Header inspection of IDEA-20260809-1d1734,
      IDEA-20260808-0cdd09 and IDEA-20260805-1775f2.'
    results: 'The Dickman grep returns only files under ledger/corrections/, specifically a superseded
      proposal copy IDEA-ISO-7f3e2d.v2, a superseded specification copy EXP-P13-NC36, and material
      under the CORR-20260805-12e5b8 branch including EXP-SMTH-4403c4, none of which is an SNFS norm
      computation and all of which sit in the corrections tree rather than in the live ledger. No
      live proposal computes a norm-bit distribution for a special-form polynomial. IDEA-20260809-1d1734
      is the closest live record: it asks what the special form of pairing-friendly primes gives the
      sieve, under RQ-PAIR-f2e31f, and it is about BLS and BN seed polynomials rather than about a
      detectability class, but it is the one record that overlaps in subject and it is named in discriminated_from
      for that reason. The RQ-RSA-afe33c cost lane predicts running times from published record data
      and does not compute norm distributions.'
    verdict: 'UNVERIFIED. No claim is made about external literature. Claimed new relative to this
      repository: the specific matched-arm design in which the null is the same prime attacked with
      a large-coefficient polynomial rather than a different prime, the reporting of the advantage
      as a full norm-bit histogram with its tail rather than as a mean or an asymptotic constant,
      and the counted-versus-predicted smoothness check that can falsify the Dickman conversion at
      the tested sizes. Assembled from known parts: norms, homogenisation, the base-m digit construction
      and Dickman rho are all standard, and the existence of an SNFS advantage of this general shape
      is exactly what GOAL-SNFS-001 already assumes when it asks for a crossover.'
  object_first_candidate:
    tracked_object: The bit-length histogram of the norm product N(a,b) = |F(a,b)| times |a - b m|
      over a fixed coprime sieve box, together with its lower tail below each declared smoothness
      bound. The object followed through the computation is this histogram, not any individual norm
      and not any relation.
    lossiness: Genuinely lossy. The histogram discards which pair (a,b) produced each value, the factorisation
      of every norm, all sign information, and the algebraic structure of the number field entirely;
      what survives is a distribution over integers. The fibres are enormous, since the box has millions
      of pairs mapping into a few hundred bit-length buckets. It propagates because the operation
      that matters downstream, testing a norm for smoothness, depends on the value only through its
      size and its factorisation, and the size half is exactly what the histogram retains. The honest
      limitation is that the discarded half, the factorisation, is not independent of the retained
      half for structured polynomials, which is precisely why STAGE FIVE counts real smooth values
      instead of trusting the size-only model.
    propagation: One step of the target operation is enlarging the sieve box, b maps to b+1 at fixed
      A. The added row contributes norm values whose bit length grows like d times log2 b for the
      algebraic side and log2 of (A + b m) for the rational side, so the histogram's mass shifts right
      by a computable amount per row and its lower tail thins. The special and null arms shift at
      the same rate in the rational factor and at different rates in the algebraic factor, since the
      null's leading coefficient is about p^(1/(d+1)) rather than at most H, so Delta is predicted
      to be nearly invariant under box growth while the absolute smooth counts fall. That invariance
      is a checkable propagation statement and its failure would mean Delta is a property of the box
      rather than of the polynomial.
    survival_score: The advantage survives while the algebraic norm remains the dominant term, that
      is while d log2(max(A,b)) plus log2 of the leading coefficient exceeds the rational norm size;
      once the box grows large enough that the rational side dominates, both arms converge and Delta
      collapses toward zero. The concrete statement is that Delta stays within a stated tolerance
      of its small-box value up to log2 A of about (n/(d+1)) minus log2 H, and dissolves beyond it.
      That threshold is directly measurable by sweeping A.
  null_object_control: The same prime p, the same base m, the same box, the same scoring function,
    and a degree-d polynomial with coefficients of ordinary size obtained from the base-m digit construction,
    so the only difference between the arms is coefficient magnitude. Additionally a random-coefficient
    control in which the null polynomial does not have m as a root modulo p at all, which must show
    a norm histogram statistically identical to the structured null; if the structured null and the
    random null differ, the measured Delta is contaminated by the root condition rather than by smallness.
    For the signal arm to mean anything, the null must show a norm histogram whose lower tail is materially
    thinner and whose counted smooth values are materially fewer, at the same box and the same smoothness
    bound.
  discriminated_from:
  - 'IDEA-20260809-1d1734 under RQ-PAIR-f2e31f: it asks what the seed-polynomial form of pairing-friendly
    primes gives the sieve and whether a deployed estimate accounts for it. This record computes a
    norm-bit histogram for a detectability class and reports no security estimate at all; it also
    uses a matched same-prime null, which that record does not.'
  - 'IDEA-20260808-0cdd09 under RQ-RSA-afe33c: validates a cost model on ratios between published
    record computations. This computes a distribution from scratch and never predicts a running time.'
  - 'IDEA-20260805-1775f2, the wiring exponent family: an asymptotic full-cost exponent construction.
    This is a finite, exactly computed histogram at named parameters with no asymptotic claim.'
  - 'The superseded Dickman-using material in ledger/corrections/ including EXP-SMTH-4403c4: that
    sits in the corrections tree, concerns a different lane, and is named here so the overlap in the
    word smoothness is not mistaken for an overlap in object.'
  assumptions:
  - The norm product bit length is the operative quantity for relation yield, so that a shift in the
    histogram is the right summary of the advantage; the counted smooth values in STAGE FIVE are what
    tests this rather than assuming it.
  - The base-m digit construction is a fair stand-in for a general polynomial selection at the null
    arm; it is not optimised, and a better null would shrink Delta, so the measurement is biased toward
    overstating the advantage and that direction is stated.
  - Dickman rho computed by numerical integration is accurate enough on the grid used; the integration
    is validated against exact values at small arguments.
  - Trial-division smoothness counting is exact at the smoothness bounds used, which holds because
    the bounds are small enough to enumerate the prime base completely.
  predictions:
  - metric: mean log2 norm product, special arm minus null arm, at n=64, d=3, box A=B=200
    direction: lower
    minimum_effect: at least 8 log2 units lower on the special arm
  - metric: counted B_s-smooth pair count, special arm divided by null arm, same box and bound
    direction: higher
    minimum_effect: 3.0
  - metric: Delta stability under box growth from A=50 to A=400
    direction: different
    minimum_effect: Delta varies by no more than 2 log2 units across the sweep
  - metric: ratio of Dickman-predicted to trial-division-counted smooth pairs
    direction: different
    minimum_effect: 'no pre-commitment: the accuracy of an asymptotic smoothness model at 64-bit norms
      is exactly what this measures, and asserting a factor in advance would be assuming the answer'
  minimal_test:
    design: 'One prime, two polynomials, one box, one scoring loop. Take a single 64-bit prime p generated
      as f(m) with d = 3 and H = 64, seed recorded. Build the special arm from that f, and the null
      arm from the base-m digit expansion of p in base m, which has the same degree and the same root
      m modulo p but coefficients of ordinary size. Enumerate every coprime pair with |a| <= 200 and
      1 <= b <= 200, about 49000 pairs, and for each compute the exact integer norm product for both
      arms. Emit both full bit-length histograms and, for smoothness bounds in {2^10, 2^12, 2^14},
      the exact count of pairs whose norm product is smooth by trial division. The discrimination
      is direct: if the special histogram is not shifted left and the smooth counts are not higher,
      there is no measurable advantage at this setting and Delta is inside its error bar. Total cost
      is under a minute of pure-Python integer arithmetic and a few megabytes.'
    controls:
    - The matched same-prime large-coefficient null, run in the same loop with only the polynomial
      swapped.
    - A random-coefficient polynomial with no root condition, to confirm the structured null is not
      itself anomalous.
    - A box-growth sweep at A in {50, 100, 200, 400} to test Delta invariance.
    - A Dickman-integration validation against exact rho values at arguments 1 through 3, where rho
      is known in closed form.
    - A degree control at d = 2 and d = 4 with H fixed, to confirm Delta moves with degree in the
      derived direction.
    required_metrics:
    - full norm-product bit-length histogram per arm
    - mean and median log2 norm per arm and their difference Delta
    - counted smooth-pair count per arm per smoothness bound
    - Dickman-predicted smooth-pair count per arm per bound
    - predicted-to-counted ratio
    - lower-tail mass below each smoothness bound
    - wall-clock seconds and peak memory per box
  falsification_conditions:
  - The two histograms overlap so that Delta is within its own bootstrap error bar, meaning no measurable
    advantage at this setting.
  - Counted smooth ratios are at or below 1, contradicting the histogram shift and showing size is
    not the operative variable.
  - Delta varies strongly with box size, meaning it is a property of the box rather than of the polynomial
    and cannot be quoted as an advantage.
  - The random-coefficient control differs from the structured null, showing the root condition rather
    than coefficient smallness drives the measurement.
  - Dickman-predicted counts miss the counted values by more than an order of magnitude at every bound,
    invalidating the conversion step and reducing the deliverable to raw counts.
  - The Dickman integration fails its own closed-form validation, in which case no predicted count
    may be reported at all.
  confounders:
  - Leading-coefficient magnitude affects both the norm size and the number of roots modulo small
    primes, so a size effect and a projective-root effect are entangled unless the root distribution
    is also measured.
  - Trial division cost depends on the value being tested, so timing-derived metrics can leak the
    arm.
  - Small boxes have strong edge effects near a = 0 and b = 1 where norms are atypically small in
    both arms.
  - The digit-based null is a specific, unoptimised construction, so Delta measures the special arm
    against that construction rather than against the best available null.
  - Smoothness bounds chosen to be enumerable are far below what any real sieve would use, so the
    counted ratios are at an unrepresentative operating point.
  interpretation_limits:
  - A norm-histogram shift is not a running time; converting it into one requires relation-collection
    and linear-algebra costs that this contract does not measure and forbids inferring.
  - The advantage is measured against one specific null construction and would shrink against a better
    one; the number is an upper bound on the advantage in that sense.
  - Results are scoped to the named degrees, coefficient bounds, box sizes and smoothness bounds,
    and not to cryptographic parameters.
  - Nothing here says anything about whether any real parameter set has a special form, which is a
    separate question this contract does not touch.
  target_complexity:
    time_exponent: No attack exponent is claimed and no sieve is run. The measurement cost is exactly
      one integer norm evaluation per coprime pair, so linear in box area, about A times B times a
      constant; the deliverable Delta is a distributional shift in bits and is not an exponent.
    memory_exponent: No attack memory exponent is claimed. The scoring loop is streaming and holds
      only histogram counters, so memory is O(number of bit-length buckets), a few kilobytes, independent
      of box size.
    best_known: The incumbent within this program is the assumption embedded in GOAL-SNFS-001 that
      a crossover exists and must be measured; no computed norm-gap figure exists anywhere in this
      repository, and the nearest live record, IDEA-20260809-1d1734, poses the sieve-advantage question
      for pairing-friendly primes without answering it. No external baseline is asserted from here.
    hidden_overhead: The lower-order terms hide the entire relation-collection and matrix cost, which
      is where a real comparison lives; a norm advantage that does not survive duplicate accounting
      and matrix growth is not an advantage in practice. Trial-division smoothness counting is only
      affordable at absurdly small smoothness bounds, so the measured operating point is far from
      any realistic one. The human overhead is in choosing the null construction, which sets the number
      and is a judgement call that must be declared before scoring.
  dominated_by: n/a for attack claims, none is made. As a measurement, I checked the frontier rows
    this repository holds on sieve cost, namely IDEA-20260805-1775f2 on GNFS full-cost exponents,
    IDEA-20260808-0cdd09 on cost-model ratio validation, KN-LIT-2663 as recorded in RQ-RSA-afe33c
    on area-time batch costing, and the superseded smoothness material EXP-SMTH-4403c4 in the corrections
    tree; none of them reports a matched norm-bit histogram for a special-form polynomial, so nothing
    dominates this measurement and nothing is directly comparable to it. That emptiness was checked
    record by record and is not an assumed null.
  sota_delta: No attack; measurement contribution only. Quantitatively the delta is from no computed
    number to a specific pair, Delta in log2 units and a counted smooth-pair ratio at a named box
    and bound, with the direction of bias stated, namely that an unoptimised null makes the advantage
    look larger than it is. Nothing is claimed to be faster, and the contract forbids expressing Delta
    as a speedup.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A and C, that a matched norm-bit histogram shows a clear left shift
    for the small-coefficient arm: about 0.9, because the leading coefficient enters the algebraic
    norm directly and the arms differ in it by many orders of magnitude by construction; failure would
    indicate a bug rather than a discovery. Part D, that Dickman-predicted smooth counts match trial-division
    counts within an order of magnitude at 64-bit norms: about 0.4, since these norms are far too
    small for an asymptotic smoothness model and the mismatch is a likely and useful outcome. That
    Delta is stable under box growth as predicted: about 0.6. That Delta translates into anything
    about a real crossover: not claimed, and the contract forbids it.'
