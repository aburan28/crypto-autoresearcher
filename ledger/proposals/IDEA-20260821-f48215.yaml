idea:
  id: IDEA-20260821-f48215
  research_question: RQ-SSI-001
  question_id: RQ-SSI-001
  added: '2026-08-21'
  title: >-
    The preprocessing axis nobody has charged: shared-precomputation batch
    attacks on the supersingular endomorphism problem lie on the exact frontier
    (per-instance time) x (storage) = p, anchored at the F_p locus and
    calibrated by Delfs-Galbraith at its s = 0 endpoint -- from which follow two
    honest conclusions, that precomputation buys NOTHING for a single instance
    (every point costs at least p^{1/2} once the table is charged), and that
    this is nonetheless the only known mechanism converting storage ABOVE
    p^{1/3} into per-instance time below it, at a target count of order
    p^{1/6+s}
  class: composition

  claim: >-
    WHAT THIS IS NOT, STATED BEFORE ANYTHING ELSE AND BINDING ON EVERY LATER
    QUOTATION OF IT. This is NOT a single-instance algorithm and NOT an exponent
    improvement. Every point of the frontier below costs at least p^{1/2+o(1)}
    for ONE instance once its precomputation is charged, which is strictly worse
    than the incumbent p^{1/3+o(1)}. The per-instance figure p^{1/2-s} is an
    AMORTISED number in a batch model and may never be quoted without its
    storage exponent 1/2+s AND its break-even target count of order p^{1/6+s}.
    Nothing here states, implies, or is structured to suggest that a p^{1/4}
    algorithm over F_{p^2} exists, is likely, or is nearly obtained.

    THE CONSTRUCTION. Let V_p be the F_p-rational supersingular locus,
    |V_p| = Theta(p^{1/2}); every F in V_p carries the Frobenius endomorphism
    pi with pi^2 = -p, which is non-scalar. Let W_s be the ball of radius r
    around V_p in the 2-isogeny graph, with 2^r = p^s and 0 <= s <= 1/2, so
    |W_s| = Theta(p^{1/2+s}) while 2^r <= p^{1/2}. Every F in W_s carries a
    STORED WITNESS: if rho : F_0 -> F is the recorded length-r path from
    F_0 in V_p, then rho o pi o dual(rho) lies in End(F) and is non-scalar,
    because its degree 2^{2r} p is not a square. Storage per vertex is
    O(log p + r) bits: a j-invariant and a path, not an endomorphism ring.

    THE PER-INSTANCE ATTACK. Given a target E, stream isogenies from E of
    increasing smooth degree, testing each codomain against the stored table.
    On a hit at F in W_s with connecting isogeny sigma : E -> F,
    dual(sigma) o rho o pi o dual(rho) o sigma is a non-scalar endomorphism of E
    (its degree deg(sigma)^2 2^{2r} p is again not a square). Under Heuristic H3
    below, a hit occurs after N = Theta(p / |W_s|) streamed codomains, so

        PER-INSTANCE TIME   = p^{1/2 - s + o(1)},
        SHARED STORAGE      = p^{1/2 + s + o(1)},
        PRECOMPUTATION      = p^{1/2 + s + o(1)}  (one BFS over the ball),
        PER-INSTANCE MEMORY = polylog beyond the shared table,
        i.e.  (per-instance time) x (storage) = p^{1 + o(1)}.

    THREE CALIBRATION POINTS, ALL FORCED, NONE FITTED.
      s = 0: time p^{1/2}, storage p^{1/2}. This IS Delfs-Galbraith with its
             subfield locus tabulated rather than walked to, and p^{1/2} is
             exactly the complexity the frozen source attributes to it at line
             51. (THE CONTESTED Otilde(p^{1/4}) F_p-RESTRICTED FIGURE OF
             KN-TECH-058 RC4 IS NOT USED AND IS NOT NEEDED.)
      s = 1/2: storage p, time p^{o(1)}. Tabulating the whole graph makes every
             instance trivial -- the degenerate endpoint any correct frontier
             must contain.
      s = 1/6: time p^{1/3}, storage p^{2/3}. The frontier meets the
             incumbent's TIME exponent exactly here, at strictly worse memory
             (p^{2/3} shared versus p^{1/3} per-instance).

    THE TWO CONCLUSIONS, ONE NEGATIVE AND ONE NOT, BOTH STATED WITH THEIR
    ARITHMETIC.
      (I) NEGATIVE, AND IT IS THE HEADLINE. Charging precomputation to a single
      instance gives total p^{1/2+s} + p^{1/2-s} >= p^{1/2} for every s: THE
      ENTIRE FRONTIER IS DOMINATED BY THE INCUMBENT IN THE SINGLE-INSTANCE
      MODEL. In the k-target model the batch wins only when s > 1/6 and
      k > p^{1/2+s}/(p^{1/3} - p^{1/2-s}), i.e. k of order p^{1/6+s}. At
      SQIsign NIST-I (log2 p about 250) the point s = 1/4 would need about
      2^{187} bits of shared storage and about 2^{104} simultaneous targets
      before it pays. THE MULTI-TARGET SECURITY OF THE SURVIVING SUPERSINGULAR
      ASSUMPTIONS IS THEREFORE NOT DEGRADED BY SHARED PRECOMPUTATION AT ANY
      REALISABLE NUMBER OF TARGETS -- a scope statement RQ-SSI-001 demands
      ("all preprocessing, memory, oracle, quantum-query and verification costs
      must be charged") and that no filed record on it makes.
      (II) NOT NEGATIVE, AND IT IS WHY THE RECORD IS WORTH FILING RATHER THAN
      DISCARDING. Every known single-instance algorithm SATURATES in memory at
      p^{1/3}: the van Oorschot-Wiener curve sqrt(N^3/w) with N = p^{1/3+o(1)}
      is defined only for w <= N, and at w = N it returns the incumbent's
      p^{1/3}; storage beyond p^{1/3} buys nothing in any published method. The
      construction above is the only mechanism this program has identified that
      converts storage ABOVE p^{1/3} into per-instance time BELOW p^{1/3}, and
      it does so only at the price named in (I). Whether that price is
      intrinsic -- i.e. whether instance-independent preprocessing can ever be
      amortised at realisable k -- is the open question this record hands
      forward, and it is a question about the preprocessing axis, not about the
      exponent.

    THE DISCRIMINATING CONTENT. The frontier rests entirely on H3: that a list
    of N smooth-degree codomains from a random E hits the STRUCTURED set W_s at
    the rate N|W_s|/|V| that a random set of the same size would give. W_s is
    built around the fixed-point set of the Frobenius involution, the most
    structured subset of this graph, so a deficit or a surplus is a live
    possibility with a named mechanism (correlation of 1_{V_p} with a low-lying
    eigenvector of the Brandt/Hecke operators). Measuring the hit rate against a
    matched random-target null discriminates:
      (A) rate = N|W|/|V| within error ==> mixing dominates, the frontier is
          exactly as derived, and Delfs-Galbraith's own "walk until you hit the
          subfield locus" step inherits the same validation; or
      (B) rate materially below ==> the F_p locus is clustered relative to short
          smooth-reachable sets, the frontier is WORSE than derived, and every
          analysis that walks to the subfield locus carries an uncharged
          correction -- a result about a published algorithm, not about this
          construction; or
      (C) rate materially above ==> smooth-reachable sets are biased toward the
          subfield locus, a structural fact new to this corpus, bearing directly
          on IDEA-20260821-167fd9's recogniser question.
    All three are informative, and (B) and (C) are not symmetric restatements:
    they point at opposite corrections to a published algorithm.

  mechanism: >-
    (1) WHY THE ANCHOR IS THE F_p LOCUS AND NOT SOMETHING BETTER. A stored
    vertex is only useful if it comes with a witness, and witnesses are cheap
    exactly where they are structurally free. V_p is the delta = 1 stratum
    (E isomorphic to E^{(p)}), where the witness is Frobenius itself, of size
    O(1). Every other stratum's witness costs a search. Ball expansion then
    propagates witnesses at O(1) per new vertex, because an ell-step multiplies
    the witness degree by ell^2 and the PATH is what is stored. So the
    precomputation is a single BFS: cost Theta(|W_s|) modular-polynomial steps,
    which is why precomputation and storage share an exponent.

    (2) WHY THE BALL GROWS MULTIPLICATIVELY, AND WHERE IT STOPS. |W_s| =
    Theta(p^{1/2} 2^r) requires that the radius-r balls around distinct points
    of V_p be essentially disjoint, which holds while p^{1/2} 2^r = o(p), i.e.
    s < 1/2. Beyond that the ball saturates the graph and the frontier reaches
    its trivial endpoint. This is an expansion statement and is H4 below.

    (3) WHY THE PULLBACK IS NON-SCALAR, EVERY TIME, WITH NO GENERICITY CAVEAT.
    Each composed endomorphism has degree of the form (square) x p, and p is not
    a square, so it cannot equal [m], whose degree is m^2. This is the frozen
    source's own correctness argument (line 220) reused verbatim, and it is
    worth stating because "the pullback might be scalar" is the standard
    objection to composed-endomorphism attacks and it does not apply here.

    (4) WHY THE FRONTIER IS A COVERING BOUND AND NOT A HELLMAN TRADEOFF. The
    exponent comes from the covering condition N |W| = Theta(p) -- one streamed
    list must meet one stored set inside a vertex set of size Theta(p) -- not
    from chain structure. That is why the product is time x storage = p rather
    than a Hellman-type time x storage^2. Stated so the frontier is not
    mis-cited as an instance of a generic tradeoff.

    (5) WHAT WOULD MOVE THE FRONTIER, NAMED SO THE NEXT SESSION NEED NOT
    REDERIVE IT. Three things, each with the quantity to compute:
      (i) a cheaper witness supply -- any efficiently constructible,
          instance-independent family of curves with known non-scalar
          endomorphisms and DENSITY above p^{-1/2+o(1)} would replace V_p and
          shift the anchor. Quantity: the family's density and its per-vertex
          witness cost.
      (ii) a hit rate above the covering bound -- outcome (C). Quantity: the
          measured surplus and its scaling in p.
      (iii) a stored structure answering membership without storing the set --
          IDEA-20260821-167fd9's object, deliberately not duplicated here.

