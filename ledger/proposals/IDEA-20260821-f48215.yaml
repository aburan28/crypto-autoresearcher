  assumptions:
    - >-
      That witnesses propagate along the ball at O(1) storage per vertex, i.e.
      that storing a path suffices and no endomorphism is ever expanded until a
      hit occurs.
    - >-
      That streaming the list from E costs Theta(1) per codomain tested and
      polylog memory. Same list-cost accounting as the incumbent (Lemma 3.3)
      with the local table replaced by lookups into the shared structure; the
      per-element cost of producing list elements WITHOUT a local table is
      Theta(log X) modular-polynomial steps rather than Theta(1) amortised, a
      (log p)-cofactor disclosed in hidden_overhead and not hidden.
    - >-
      That the shared table's access cost is charged rather than assumed free.
      It is, in target_complexity, under the Wiener model.
    - >-
      That the k targets are independent instances over the SAME p. A batch over
      different characteristics shares nothing, and that is the boundary of the
      whole model.

  proof_search_map:
    bottleneck: >-
      The covering condition N |W| = Theta(p): how many codomains must be
      streamed before meeting a stored witness. Everything else in the frontier
      is bookkeeping around it.
    baseline_embedding:
      parameter_slice: >-
        s = 0 reproduces Delfs-Galbraith's p^{1/2+o(1)} exactly, with the
        subfield locus stored rather than walked to. s = 1/2 reproduces trivial
        whole-graph tabulation. Both ends are forced.
      reproduction_check: >-
        SYMBOLIC: substitute s = 0 into (p^{1/2-s}, p^{1/2+s}) and require
        (p^{1/2}, p^{1/2}); substitute s = 1/2 and require (p^{o(1)}, p); check
        the s = 1/6 crossing at (p^{1/3}, p^{2/3}). A frozen fixture asserts all
        three plus the single-instance domination statement. If the s = 0 slice
        does not reproduce Delfs-Galbraith, the model is wrong and nothing else
        is recorded.
    observation_collision:
      observable: >-
        "The streamed codomain lies in W_s" -- a table hit.
      distinct_preimage_search: >-
        TWO DISTINCT GROUND-TRUTH SITUATIONS PRODUCE THE SAME OBSERVABLE and
        must be separated: a hit because the codomain is in the ball proper, and
        a hit because it is in V_p itself (radius 0), which is a much denser
        event at small r and would inflate the measured rate at exactly the toy
        parameters where r is forced to be small. Separating condition: record
        each hit's ball-radius stratum and report the rate per stratum, never
        pooled.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure -- "stored witnesses" -- realised
          by the F_p-locus specialisation, with the ball's charges added over
          radius strata that are disjoint by construction (each vertex assigned
          to its minimal radius).
        predicted_gain: >-
          The frontier time x storage = p, which is the first charged
          preprocessing axis on this question.
      - transform: boundary_lift
        proposed_object: >-
          Delfs-Galbraith as the s = 0 boundary of a family, lifted by enlarging
          the stored set rather than by improving the search.
        predicted_gain: >-
          A strict inward improvement in PER-INSTANCE time (p^{1/2-s} <
          p^{1/2}) at a stated storage cost, and -- honestly -- no improvement
          at all once precomputation is charged to a single instance.
    quantifier_order: >-
      There EXISTS a table W_s, computable from p ALONE (independent of every
      instance), such that FOR ALL supersingular E the per-instance cost is
      p^{1/2-s+o(1)}. THE INSTANCE-INDEPENDENCE OF THE TABLE IS THE ENTIRE
      CLAIM: a table allowed to depend on E would be a single-instance algorithm
      with its preprocessing mislabelled, which is the standard way
      precomputation results are overstated, and this quantifier order is where
      that would be caught.
    method_ceiling:
      strongest_certifiable_claim: >-
        "With an instance-independent table of p^{1/2+s} stored witnesses
        anchored at the F_p locus, per-instance cost is p^{1/2-s+o(1)}." It
        certifies nothing about tables anchored elsewhere, nothing about
        single-instance cost, and nothing below p^{1/2} total for one instance.
      nearby_object_control: >-
        THE INCUMBENT ITSELF, where the hoped-for conclusion "precomputation
        helps" is KNOWN FALSE: the p^{1/3+o(1)} algorithm needs no shared table
        and beats every point of this frontier in the single-instance model. A
        precomputation analysis that cannot see that it loses to a no-table
        algorithm has mis-charged its own preprocessing, and this control is why
        conclusion (I) is a negative.
    proof_obligations:
      - claim: "|W_s| = Theta(p^{1/2} 2^r) for 2^r <= p^{1/2-eps}."
        responsibility: size
      - claim: "Precomputation cost is Theta(|W_s|) modular-polynomial steps."
        responsibility: runtime
      - claim: "Each stored witness is non-scalar, and so is every pullback (degree = square x p)."
        responsibility: correctness
      - claim: "A hit occurs within N = Theta(p/|W_s|) streamed codomains."
        responsibility: success_probability
      - claim: "The s = 0 slice reproduces Delfs-Galbraith."
        responsibility: baseline
      - claim: "Single-instance total is at least p^{1/2+o(1)} at every s, hence dominated by the incumbent."
        responsibility: scope

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) single-instance path-finding
      algorithms of every kind, including the incumbent -- they appear only as
      the comparison baseline; (b) torsion-image / Kani attacks, which need
      published auxiliary data this setting has none of; (c) orientation and
      class-group attacks; (d) the quantum axis. THE OBJECT IS THE PREPROCESSING
      AXIS, which none of the 33 filed RQ-SSI-001 proposals uses.
    tracked_object: >-
      THE STORED WITNESS SET W together with its density -- a set of curves each
      carrying a known non-scalar endomorphism, tracked as it is enlarged by
      ball expansion. Not a curve, not an isogeny: a growing table and its
      density in the vertex set.
    one_step_propagation_rule: >-
      One ell-isogeny step from a witnessed curve produces a witnessed curve
      (conjugate the witness by the step; the degree gains ell^2 and
      non-scalarity survives because the degree remains (square) x p). Exact,
      not heuristic, which is what makes the object propagate deterministically.
    newness_score: >-
      The ingredients (F_p anchor, ball expansion, witness conjugation) are all
      standard. WHAT IS NEW IS THE AXIS: a search of the filed RQ-SSI-001
      proposals via this session's prior-art digest found none that charges
      preprocessing or states a multi-target model, while RQ-SSI-001's own
      constraints demand exactly that. A cost axis a question requires and no
      record on it uses is not a saturated axis.
    testability_score: >-
      High and cheap. The hit-rate measurement needs only the toy vertex set,
      one BFS and one streamed list; the forced null value N|W|/|V| is exact.
    survival_score: >-
      The frontier survives as arithmetic. Conclusion (I) survives unless H3
      fails by an exponent -- a constant-factor deficit or surplus moves nothing
      -- and that limitation is stated so the measurement is not oversold.

  lossy_projection_test:
    projection: >-
      "supersingular curve with a known non-scalar endomorphism, together with
      its full witness" -> "a j-invariant plus a path index in a stored table";
      and at the cost level, "the whole attack" -> "(per-instance time exponent,
      storage exponent)".
    what_is_discarded: >-
      The endomorphism itself (never expanded until a hit), the endomorphism
      ring, the degrees, and every arithmetic property of the stored curve
      except its identity as a vertex.
    why_genuinely_lossy: >-
      Recovering the witness from the j-invariant alone is the very problem
      being attacked. The path index is what preserves recoverability, and it is
      O(r) bits against the object it stands for; drop it and nothing is
      recoverable -- which is the proof that the projection discards something
      real.
    why_compatible_with_the_operations: >-
      The two operations are "extend the ball by one step" and "test a streamed
      codomain for membership". Both act on the projected object alone: the
      first appends a step index, the second is a table lookup on j. Nothing
      discarded is needed to propagate either.
    is_it_only_a_change_of_coordinates: >-
      NO. Not invertible (above), and not constant across candidates: the
      projection's value (the density |W|/|V|) is the entire content and it
      varies by a factor p^{1/2} across the frontier. THE HONEST LIMITATION: the
      projection is blind to WHICH endomorphism a witness yields, so it cannot
      distinguish a witness giving a small endomorphism from one giving an
      astronomically large one. That matters for anything downstream needing a
      SHORT endomorphism, and this record claims only non-scalarity, which is
      what OneEnd asks for.

  null_object_control:
    primary_null: >-
      MATCHED RANDOM TARGET SET: replace W_s by a uniformly random subset of the
      vertex set of the SAME cardinality and measure the hit rate of the same
      streamed list. FORCED VALUE: the two rates must agree, because the whole
      frontier assumes W_s behaves like a random set of its size. A DIFFERENCE
      IS THE FINDING, in either direction, and its sign selects outcome (B) or
      (C).
    secondary_nulls:
      - >-
        STRATIFIED HIT ACCOUNTING by ball radius (r = 0, 1, ..., R). Pooling
        conflates "hit the F_p locus" with "hit the ball" -- the observation
        collision named above.
      - >-
        SHUFFLE CONTROL: recompute the hit rate with streamed codomains replaced
        by uniformly random vertices. Forced value exactly N|W|/|V|; separates
        "the list is unusual" from "the target set is unusual".
      - >-
        DECAY CONTROL at three list radii X. A genuine deviation must shrink as
        X grows (more mixing); one constant in X is an artifact per
        docs/inventor-protocol.md section 3.
      - >-
        WITNESS-VALIDITY CHECK (correctness positive control): for every hit,
        expand the pullback and verify it does not act as a scalar on a random
        torsion basis. A construction producing scalars is broken and no rate
        from it counts.

  predictions:
    - metric: "measured hit rate of a length-N streamed list against W_s, divided by the covering prediction N|W_s|/|V|"
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00. Accept H3 at the tested scope if the ratio lies in
        [0.8, 1.25] at three toy primes and three radii. A ratio outside
        [0.5, 2.0], replicated and decaying in X, is outcome (B) or (C) and is
        the finding.
    - metric: "|W_r| / (|V_p| * 2^r) -- measured ball growth"
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 while 2^r <= p^{1/2-eps}, falling below as the ball
        saturates. The radius at which it first drops below 0.8 is the measured
        boundary of the frontier's validity and must be reported.
    - metric: "fraction of expanded pullbacks that are non-scalar"
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 exactly (degree = square x p is never a square). Any
        deviation is an implementation bug: a correctness control, not a
        statistic.
    - metric: "measured (per-instance time) x (storage), in units of p"
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 up to p^{o(1)}, across at least three values of s. A
        drift with s means the frontier's exponent is wrong.
    - metric: "single-instance total cost with precomputation charged, as a multiple of p^{1/2}"
      direction: higher
      minimum_effect: >-
        FORCED to be at least 1.0 for every s. This is conclusion (I) and it
        must be measured, not merely derived, at toy scale.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): the symbolic frontier and its three calibration
      slices, with a frozen fixture asserting (p^{1/2}, p^{1/2}) at s = 0,
      (p^{o(1)}, p) at s = 1/2, (p^{1/3}, p^{2/3}) at s = 1/6, and the
      single-instance domination statement. If the s = 0 slice does not return
      Delfs-Galbraith, stop.
      STAGE 1 (small compute): at three primes with log2 p in [20, 40],
      enumerate the vertex set, identify V_p, BFS to radius R, record |W_r|
      against 2^r.
      STAGE 2: for at least 200 random target curves E per prime, stream
      smooth-degree codomains and measure the hit rate against W_s, stratified
      by radius, with the matched-random-target null, the shuffle control and
      the decay control.
      STAGE 3: expand every pullback and verify non-scalarity on a random
      torsion basis.
      STAGE 4: report the ratios with intervals, the measured saturation radius,
      and the single-instance total against p^{1/2}.
    controls:
      - "Matched random target set of the same cardinality (primary null)."
      - "Radius-stratified hit accounting (defeats the named observation collision)."
      - "Shuffled-list control (forced value exactly the covering bound)."
      - "Decay control across three list radii."
      - "Witness-validity check on every expanded pullback (forced 100% non-scalar)."
    required_metrics:
      - "Hit rate over covering prediction, per prime, per radius stratum, per list radius, with intervals."
      - "Measured ball growth and the saturation radius, against a matched random anchor set."
      - "Measured (time x storage)/p at three values of s."
      - "Single-instance total with precomputation charged, in units of p^{1/2}."
      - "Non-scalarity rate of expanded pullbacks."

  falsification_conditions:
    - >-
      The s = 0 slice fails to reproduce Delfs-Galbraith's p^{1/2}. The cost
      model is wrong and nothing else is recorded.
    - >-
      The measured hit rate deviates from the covering prediction by more than a
      factor 2, replicated at three primes and decaying in X. H3 IS FALSE AT THE
      TESTED SCOPE. A DEFICIT means the frontier is worse than derived AND every
      published analysis that walks to the F_p locus inherits an uncharged
      correction -- a result about Delfs-Galbraith, not about this construction.
      A SURPLUS means smooth-reachable sets are biased toward the subfield
      locus, which must be measured and reported into IDEA-20260821-167fd9's
      lane.
    - >-
      Ball growth departs from |V_p| 2^r well below the predicted saturation
      radius, and earlier than for a matched random anchor set. H4 is false at
      the tested scope, V_p is clustered, and the storage exponent is optimistic.
    - >-
      Any expanded pullback is scalar. The construction is broken and the degree
      argument in mechanism (3) is misstated.
    - >-
      A reader exhibits an instance-independent witness family of density above
      p^{-1/2+o(1)} constructible in time proportional to its size. The anchor is
      then not optimal, the frontier shifts, and the record is superseded rather
      than patched.

  confounders:
    - >-
      TOY-SCALE RADIUS. At log2 p = 20 the vertex set is a few hundred curves
      and V_p a few dozen, so the ball saturates after two or three steps and
      the frontier has almost no dynamic range. Three primes and stratified
      reporting are the mitigation; a single-prime run measures nothing.
    - >-
      SELF-INTERSECTION OF THE BALL. Overlapping balls around nearby points of
      V_p inflate the storage count if vertices are double-counted; vertices are
      assigned to their minimal radius, which the stratified accounting enforces.
    - >-
      PRECOMPUTATION CHARGED PER INSTANCE. The commonest way a precomputation
      result is overstated. The design measures the single-instance total
      explicitly and reports it first.
    - >-
      FULL-COST TABLE ACCESS (KN-TECH-057). A shared table of p^{1/2+s} entries
      pays a Wiener wiring penalty p^{(1/2+s)/3} that a polynomial-memory
      algorithm does not. Charged in target_complexity; omitting it would make
      the frontier look better than it is.
    - >-
      THE OUTPUT ENDOMORPHISM IS ENORMOUS: degree deg(sigma)^2 2^{2r} p. Anything
      downstream needing a SHORT endomorphism (a reduction whose cost depends on
      the degree) must charge that separately; no shortness is claimed.

  interpretation_limits:
    - >-
      THIS IS NOT A SINGLE-INSTANCE ALGORITHM AND NOT AN EXPONENT IMPROVEMENT.
      Every point costs at least p^{1/2+o(1)} for one instance with
      precomputation charged, i.e. it is dominated by the incumbent
      p^{1/3+o(1)}. The per-instance figure p^{1/2-s} is amortised and may never
      be quoted without its storage exponent and its break-even target count.
      Nothing here suggests a p^{1/4} algorithm over F_{p^2} exists, is likely,
      or is nearly obtained.
    - >-
      THE ILLUSTRATIVE NIST-I FIGURES (about 2^{187} storage and about 2^{104}
      targets at s = 1/4) ARE EXPONENT ARITHMETIC, NOT CONCRETE SECURITY
      PREDICTIONS. The incumbent's own concrete numbers sit above a disclosed
      superpolynomial o(1) and no conclusion may be computed there.
    - >-
      TOY SCALE IS TOY SCALE. A hit-rate ratio measured at 2^40 is evidence
      about 2^40; the transfer assumption is recorded in H3's validation plan,
      which also records that this heuristic has NO known route to
      cryptographic-scale validation.
    - >-
      SCOPE IS ONE CHARACTERISTIC. A batch shares a table only across instances
      with the same p -- exactly the setting of a deployed scheme family and
      exactly not the setting of a randomly chosen instance.
    - >-
      ACADEMIC / DEFENSIVE ONLY, per RQ-SSI-001's first constraint. No
      operational key recovery against any live system is proposed or implied.

  heuristic_assumptions:
    - id: H3
      statement: >-
        STRUCTURED-TARGET COVERING. Let E be a uniformly random supersingular
        curve over F_{p^2}, let C_N(E) be the set of the first N distinct
        codomains of smooth-degree cyclic isogenies from E, and let W be the
        radius-r ball around the F_p-rational locus with |W| = p^{1/2+s},
        s < 1/2. Then
            Pr[ C_N(E) cap W is non-empty ] = 1 - exp(-Theta(N |W| / |V|)),
        i.e. the structured set W is hit at the rate a uniformly random set of
        the same cardinality would be, uniformly for N|W| between p^{1-eps} and
        p^{1+eps}.
      rigorous_support: >-
        (i) RIGOROUS SIDE: the supersingular ell-isogeny graph is Ramanujan
        (Pizer, RECALLED and unverified in this program), so a non-backtracking
        walk of length Theta(log p) is within o(1) of stationary in total
        variation -- the fact the frozen source invokes at line 193 -- and the
        expander mixing lemma bounds the deviation of |C_N cap W| from N|W|/|V|
        by the second eigenvalue times sqrt(N|W|). (ii) THE CLASSICAL
        DISTRIBUTION STATEMENT IT IMITATES: quasirandomness -- two "balls" in an
        expander meet in the product of their densities. THE GAP, PLAINLY: the
        mixing lemma controls the deviation only when N|W| is comfortably large,
        and W is the fixed-point set of the Frobenius involution enlarged by a
        ball, the most structured set available, so a correlation of 1_{V_p}
        with a low-lying Brandt/Hecke eigenvector is a NAMED mechanism by which
        H3 could fail. That mechanism is why this is measured rather than
        assumed.
      validation_plan: >-
        DIRECT AT TOY SCALE, WITH A MATCHED NULL. At three primes with log2 p in
        [20, 40]: enumerate V, identify V_p, build W by stratified BFS, stream
        C_N(E) for at least 200 random E per prime, and measure the hit rate
        against the covering prediction, stratified by ball radius, at three
        list radii X, with (a) a matched random target set of the same
        cardinality, (b) a shuffled-list control whose forced value is exactly
        the covering bound, and (c) the decay control in X. Predicted ratio
        1.00; acceptance band [0.8, 1.25]. TRANSFER ASSUMPTIONS, RECORDED:
        (T1) toy primes have tiny V_p, so the measured ratio bounds nothing at
        cryptographic p and is reported as a toy-scale bound only; (T2) the ball
        saturates quickly at toy scale, so only small s is testable and the
        large-s end of the frontier is untested by construction; (T3) THE
        DEURING-SIDE SHORTCUT USED BY THE FROZEN SOURCE DOES NOT APPLY HERE,
        because this measurement needs the graph's global geometry rather than
        one curve's lattice -- so unlike H1 of IDEA-20260821-e99afd, THIS
        HEURISTIC HAS NO KNOWN ROUTE TO CRYPTOGRAPHIC-SCALE VALIDATION, and that
        is the honest ceiling of this record's evidence.
      falsification_condition: >-
        A measured hit-rate ratio outside [0.5, 2.0] at two or more primes, with
        the shuffled-list control returning 1.00 (so the deviation is in the
        target set, not the instrument) and the deviation decaying in X.
    - id: H4
      statement: >-
        BALL GROWTH. For 2^r <= p^{1/2-eps}, the radius-r non-backtracking ball
        around the F_p-rational locus has cardinality Theta(p^{1/2} 2^r), i.e.
        balls around distinct anchors are essentially disjoint up to saturation.
      rigorous_support: >-
        Non-backtracking walks in an (ell+1)-regular graph give exactly
        ell^r (ell+1) endpoints with multiplicity; disjointness up to saturation
        follows from expansion (Pizer, RECALLED). The failure mode: V_p is itself
        a union of class-group orbits and therefore clustered, so its ball could
        self-overlap earlier than a random anchor set of the same size.
      validation_plan: >-
        Measure |W_r| against p^{1/2} 2^r at three toy primes and report the
        radius at which the ratio first falls below 0.8, comparing against a
        MATCHED RANDOM ANCHOR SET of the same cardinality. That comparison
        isolates clustering of V_p from ordinary saturation.
      falsification_condition: >-
        Measured ball growth below 0.8 of prediction at a radius materially
        smaller than the matched random anchor set's, replicated at two primes.

  target_complexity:
    time_exponent: >-
      PER-INSTANCE, AMORTISED IN A BATCH MODEL: p^{1/2-s+o(1)} for
      0 <= s <= 1/2. SINGLE-INSTANCE, PRECOMPUTATION CHARGED:
      p^{1/2+s+o(1)} + p^{1/2-s+o(1)} >= p^{1/2+o(1)}, WORSE THAN THE INCUMBENT
      p^{1/3+o(1)} AT EVERY s. No exponent improvement is claimed on any axis.
    memory_exponent: >-
      Shared storage p^{1/2+s+o(1)}; per-instance working memory polylog beyond
      the shared table. At the s = 1/6 crossing the storage is p^{2/3}, i.e. the
      frontier matches the incumbent's TIME exponent only at strictly worse
      memory. Under the Wiener full-cost model (KN-TECH-057) the shared table
      additionally pays a wiring factor p^{(1/2+s)/3}, so the full-cost
      per-instance figure is p^{1/2-s+(1/2+s)/3+o(1)} = p^{2/3-2s/3+o(1)} --
      which at s = 1/6 is p^{5/9}, materially worse than the step-count figure,
      and is charged here rather than omitted.
    best_known: >-
      TIERS NAMED. Unconditional: p^{1/2}(log p)^{O(1)} time at polynomial
      memory, no precomputation (Delfs-Galbraith, frozen source line 51).
      Conditional on Heuristic 1: p^{1/3+o(1)} time and memory, no
      precomputation (Theorem 1.1). Intermediate memory without precomputation:
      the van Oorschot-Wiener curve p^{1/2+o(1)}/w^{1/2}, VALID FOR
      w <= N = p^{1/3+o(1)} AND SATURATING AT THE INCUMBENT WHEN w = N. THIS
      RECORD BEATS NONE OF THEM IN THE SINGLE-INSTANCE MODEL.
    hidden_overhead: >-
      Two disclosures. (i) The p^{o(1)} here is NOT the frozen source's: this
      construction needs no smoothness heuristic, so its cofactors are
      (log p)^{O(1)} from the BFS, the list build and the table lookups, plus
      the Theta(log X) per-element cost of producing list elements without a
      local table. It is NOT claimed that this o(1) is smaller than the
      incumbent's superpolynomial one -- it is a different quantity, and the
      comparison is made at the exponent level only, as this program's rules
      require. (ii) The NIST-I illustrations are exponent arithmetic sitting
      above the incumbent's disclosed o(1); no concrete security conclusion is
      drawn from them.
    tradeoff_note: >-
      The frontier IS the tradeoff: (per-instance time) x (storage) =
      p^{1+o(1)}, a line of slope -1 in the log-log plane, with Delfs-Galbraith
      at one end and whole-graph tabulation at the other. It is a COVERING
      bound, not a Hellman-type chain tradeoff, which is why the product is
      time x storage rather than time x storage^2. THE ONE STRUCTURAL POINT
      WORTH CARRYING FORWARD: the van Oorschot-Wiener curve is defined only for
      w <= p^{1/3} and returns p^{1/3} at its endpoint, so NO PUBLISHED METHOD
      CONVERTS STORAGE ABOVE p^{1/3} INTO TIME BELOW p^{1/3}; this construction
      does, and pays for it with instance-independent precomputation amortised
      over of order p^{1/6+s} targets. Parallelisation: perfect across
      instances, and embarrassingly parallel within one, giving per-instance
      wall clock p^{1/2-s+o(1)}/n at unchanged storage.

  dominated_by: >-
    Wesolowski 2026 (p^{1/3+o(1)} time and memory, conditional on Heuristic 1)
    dominates this record ON THE SINGLE-INSTANCE AXIS at every s, since the
    single-instance total here is at least p^{1/2+o(1)}. EVERY FRONTIER ROW WAS
    CHECKED across time, memory AND the preprocessing/data axis this record
    adds:
      - Kohel 1996: p(log p)^{O(1)}, no preprocessing. Dominated by everything.
      - Delfs-Galbraith: p^{1/2}(log p)^{O(1)} time, polynomial memory, no
        preprocessing. THIS RECORD'S s = 0 SLICE EQUALS IT and does not beat it;
        for s > 0 the record beats its per-instance time and loses on storage.
      - MITM: p^{1/2} time and memory, no preprocessing; full cost
        Otilde(p^{2/3}) (KN-TECH-057). Dominated by VW.
      - van Oorschot-Wiener: time p^{1/2+o(1)}/w^{1/2} at memory w, no
        preprocessing, DEFINED FOR w <= N = p^{1/3+o(1)} and returning the
        incumbent at w = N. It therefore does NOT dominate this record's s > 1/6
        points: no value of w lets it go below p^{1/3}, because increasing w
        past N buys nothing. (An earlier draft of this record wrongly
        extrapolated the VW formula to w = p^{1/2+s} and obtained a figure below
        p^{1/3}; that extrapolation is invalid and is recorded here so the error
        is not repeated.)
      - Wesolowski 2026: p^{1/3+o(1)} time and memory, conditional. Dominates
        the single-instance model and is not beaten in it by anything here.
      - The F_p-restricted Otilde(p^{1/4}) row of KN-TECH-058 is EXCLUDED
        (different problem; relayed_from_abstract and contested, RC4).
      - PREPROCESSING/DATA AXIS: every row above has ZERO preprocessing. This
        record is the only entry with a non-zero value, so on the three-axis
        Pareto order (time, memory, preprocessing) its s > 1/6 points are NOT
        dominated -- and that fact is worth exactly as much as the break-even
        target count of order p^{1/6+s} makes it worth, which at any realisable
        k is nothing. Both halves of that sentence are the deliverable.
  sota_delta: >-
    SINGLE-INSTANCE: strictly worse, by p^{1/6}, than the incumbent
    (p^{1/2+o(1)} against p^{1/3+o(1)}). BATCH MODEL: per-instance
    p^{1/2-s+o(1)} against p^{1/3+o(1)}, an improvement of p^{s-1/6} for
    s > 1/6, purchased with p^{1/2+s+o(1)} instance-independent storage and
    break-even at k of order p^{1/6+s} (about 2^{104} targets at NIST-I for
    s = 1/4). QUANTITATIVE DELIVERABLES: the first charged preprocessing axis on
    RQ-SSI-001, as an exact frontier time x storage = p with three forced
    calibration points; the scope statement that multi-target security is
    undegraded below about p^{1/6+s} targets; the observation that no published
    method converts storage above p^{1/3} into time below p^{1/3} while this one
    does; and a measurable heuristic (H3) whose failure would carry an uncharged
    correction back into the published Delfs-Galbraith analysis.

