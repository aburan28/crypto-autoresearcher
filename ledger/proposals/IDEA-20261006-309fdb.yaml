idea:
  id: IDEA-20261006-309fdb
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    F_2-rank of Frobenius-sum relation indicators versus a frozen shift
    on y^2 = x^3 + 4x + 1 over F_17
  class: measurement
  claim: >-
    On E: y^2 = x^3 + 4x + 1 over F_17, let F be the x-coordinates in
    F_17 of affine points. For P in E(F_{17^2}) with x(P) not in F_17,
    a Frobenius row is the F_2-indicator in F^{|F|} of the set
    {x(P), x(π(P)), x(P+π(P))} when all three lie in F and are not all
    equal. Let K be the number of distinct rows and let rank_frob be
    their F_2-rank. Let Q0 be the least affine point whose x-coordinate
    lies in F. A shift row is the indicator of
    {x(P), x(Q0), x(-(P+Q0))} under the same membership rule, taking the
    first K such points in lexicographic order. Let rank_shift be that
    rank. The claim is K >= 8 and rank_frob + 2 <= rank_shift. The
    discrete-log time exponent stays 1/2 and the delta versus Pollard rho
    is 0.
  mechanism: >-
    Two explanations are distinguished before any rank is seen.
    Explanation A: Frobenius-closed triples of base-field x-coordinates
    are as linearly independent, over F_2, as a frozen translate of the
    same length, so rank_frob + 2 > rank_shift. Explanation B: closure
    under the coordinate 17-power adds at least two dependencies beyond
    that translate. The claim is explanation B. OBJECT FRAME.
    Representation: indicator vectors of x-coordinates in F_17.
    Operation set Sigma: the coordinate 17-power. Sigma is not
    translation. The measured object is an F_2-rank, not a proportion
    and not a Gröbner basis. F1 and F3-F7 are not used.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base speeds linear algebra by n^2.
        This proposal measures one toy rank gap of 2 and does not claim
        that speedup.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials vanish on relation x-coordinates. This
        proposal lists triples by the group law and does not build S_m.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-fbdb61
      provenance: internal
      claim: >-
        Last fall degree, solving degree, and degree of regularity are
        distinct. This proposal reports an F_2-rank, not a solving degree.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-fbdb61.yaml
  assumptions:
    - K under 8 voids the run. It is not the rank negative.
    - Duplicate Frobenius rows are dropped before the rank, and the shift sample is truncated to that same K.
    - The modulus of F_{17^2} is the least monic quadratic over F_17 with no root, recorded before the rank.
  proof_search_map:
    bottleneck: not_applicable
    constructive_transforms: []
    proof_obligations: []
    not_applicable_reason: >-
      One rank comparison inside F_17. It does not certify a smaller exponent.
  predictions:
    - metric: F_2-rank of Frobenius-sum indicators versus the frozen shift
      direction: lower
      minimum_effect: "K >= 8 and rank_frob + 2 <= rank_shift"
  minimal_test:
    design: >-
      Confirm the discriminant of y^2 = x^3 + 4x + 1 is nonzero in F_17.
      Enumerate affine points over F_17 and over F_{17^2}. Build the two
      indicator matrices and compute their ranks over F_2 by Gaussian
      elimination. Toy scope is n=2 and q=17 only.
    controls:
      - A second elimination order, reversing the columns, returns the same two ranks on this matrix size.
      - Q0 is recorded before the shift rows are built.
      - Every row has weight 1, 2, or 3, and a row of weight 0 is dropped.
      - K and the shift-row count are equal.
    required_metrics:
      - K (integer)
      - rank_frob (integer)
      - rank_shift (integer)
      - "|F| (integer)"
  falsification_conditions:
    - K >= 8 and rank_frob + 2 > rank_shift, which selects explanation A on this instance.
    - K < 8, which voids the run.
    - The two elimination orders disagree.
    - The discriminant is zero.
  confounders:
    - A factor base of size under 4 makes rank + 2 a comparison of tiny matrices. |F| is reported. If |F| < 4 the run is void.
    - Conjugate points can repeat an x-coordinate. Distinct rows already collapse that repetition.
  interpretation_limits:
    - A rank gap of 2 on one curve over F_17 does not establish an n^2 linear-algebra saving.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0.
    - This is not a summation-polynomial degree and it is not a trace proportion.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Indicator vectors of K random triples on a set of size |F| have
        F_2-rank close to min(K, |F|). Explanation B says the Frobenius
        rows fall short of the shift rows by at least 2. The random
        model is the comparison being imitated. The shortfall is unproved.
      rigorous_support: >-
        KR-IC-b0fcda states an n^2 saving for a Frobenius-invariant
        factor base under a heuristic. It does not give this rank gap.
        KR-IC-fbdb61 separates solving degree from last fall degree and
        does not compute this matrix.
      validation_plan: >-
        The minimal test is the measurement. Tail check: drop the last
        row of each matrix and require the two ranks to change by at most
        1. A larger change does not choose the row; it is reported.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "0 in the group order; the matrix has |F| columns with |F| <= 17"
    best_known: >-
      Pollard rho at exponent 1/2. KR-IC-b0fcda's n^2 linear-algebra
      factor is a constant-factor symmetry, not a smaller exponent, and
      this proposal does not claim it.
    hidden_overhead: >-
      No o(1) term. The gap of 2 is an absolute rank on one matrix with
      at most 17 columns.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-b0fcda, KR-IC-5a43e5, KR-IC-fbdb61, KR-IC-46d822, and
    KR-IC-f5c584. None dominates: b0fcda is an n^2 symmetry of a factor
    base, 5a43e5 is the summation polynomial, fbdb61 separates three
    degree notions, 46d822 is Gaudry's exponent, and f5c584 is a
    characteristic-2 trace equation. None states a rank gap of 2 on this
    curve.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus Pollard
    rho is 0. The pre-registered gap is 2 in F_2-rank, on one factor base
    inside F_17, and only when K >= 8.
  prior_art:
