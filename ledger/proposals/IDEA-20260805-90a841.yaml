        No record derives it.
    conclusion: >-
      Not found in this corpus. Absence of a search result is not evidence the
      identity is unknown - it is elementary and any competent reader of the
      builder could write it - which is exactly the finding: it was available
      and not used.

  lossy_projection_identifiability_audit:
    projection: >-
      Full boolean system (2n polynomials with coefficients over F_2 determined
      by the curve, the basis alpha, R_X and the seed)  -->  the 4-block
      incidence pattern {(A: U,X3, deg 2), (B: U,X1,X2, deg 3)} and the block
      sizes (n,k,k,k).
    what_is_discarded: >-
      All coefficients, hence the curve E, the constant B_curve, the point R and
      its x-coordinate R_X, the basis alpha, and the seed. Everything arithmetic.
    why_genuinely_lossy: >-
      The fibre over an observed incidence pattern is the whole space of systems
      with those supports - a set of size roughly 2^(sum_i |supp(f_i)|), i.e.
      astronomically large. Nothing about the elliptic curve is recoverable.
      This is NOT the (Delta,Pi) = (x xor y, x*y) failure of KN-LIT-7595: there
      is no analogue of "recover the pair as roots of t^2 + Delta t + Pi" here,
      because the coefficients are simply gone.
    why_compatible_with_the_operations: >-
      Compatible with exactly one operation and no more, and that limit is
      stated rather than hidden. Macaulay column formation is a purely
      set-theoretic up-closure of supports, so the projected object propagates
      through it DETERMINISTICALLY (EV-SIG-006 verified zero cancellation and
      zero parity deviation at n=9, which is the empirical statement that no
      coefficient cancellation removes a column). It does NOT propagate through
      row reduction: rank depends on coefficients. The projection therefore
      predicts the column set exactly and the rank not at all.
    is_it_only_a_change_of_coordinates: >-
      No - it discards essentially everything. The failure mode this projection
      is at risk of is the MIRROR one named in the contract: being so lossy that
      it is CONSTANT across instances and therefore says nothing. CHECK RUN, AND
      IT PASSES NON-TRIVIALLY: the projection is constant across seeds and
      curves at fixed (n,D) - by design - but it is strongly NON-constant across
      (n,D), taking the values 1,584 / 1,848 / 16,016 / 196,518 over the tested
      ladder, and it is non-constant across SYSTEMS OF THE SAME DEGREE HISTOGRAM
      (a generic 2n-equation system with n quadrics and n cubics in nb variables
      has u_D = 0). That second contrast is the one that carries information:
      the comparator spread against the full-support null is 16,016 at the
      single decisive cell, not zero. Where it IS constant - across seeds - that
      constancy is a PREDICTION (u_D must not depend on the seed) and the
      committed seed-2 value 16,018 is a 2-column deviation from it that the
      paired experiment is required to explain rather than absorb.

  assumptions:
    - >-
      That the pinned builder for every cited cell is src/semaev_tree.py at
      t = 3, ti = 0, as the EXP-SIG-*/EXP-DREG-* lineages record. The per-cell
      system_hash values exist (EXP-DREG-004 prefix 0da7ff6aa40007e8) and the
      first stage of the paired experiment re-derives the supports from the
      committed hash rather than trusting this assumption.
    - >-
      That the union over the n alpha-coefficient equations of family A covers
      every (u_{1,j}, x_{3,i}) pair, and similarly for family B. This is what
      makes u_D the generic MINIMUM missing count; a seed for which some pair is
      absent has a slightly LARGER u_D. The committed pair 16,016 (seed 2026)
      and 16,018 (seed 2) is consistent with exactly this and inconsistent with
      the law being wrong by a variable amount - a 2-column, one-part-in-8,000
      residual - but the residual is NOT waved away: explaining it is a required
      metric.

  predictions:
    - metric: >-
        u_D and ncols recomputed from the closed form against the six committed
        column integers (1,584; 1,848; 16,016; 29,332; 174,035; 778,394)
      direction: different
      minimum_effect: >-
        EXACT integer equality on all six, zero tolerance. Already computed and
        holding at the time of writing; the experiment's job is to re-derive them
        from the committed system hashes rather than from this record's algebra.
        A single miss falsifies the law outright.
    - metric: ncols(n=18, D=5) for the missing on-lattice rung
      direction: different
      minimum_effect: >-
        EXACTLY 358,678 = N(36,5) - u_5 - u_4 = 443,704 - 84,996 - 30. Forced
        before any run. No record in this corpus contains this number.
    - metric: ncols(n=15, D=5) and ncols(n=17, D=5)
      direction: different
      minimum_effect: >-
        EXACTLY 143,421 and EXACTLY 314,472. Both forced pre-run; n=17 is the
        off-lattice check (k = 6, nb = 35), where any formula written with the
        common but wrong shorthand nb = 2n gives a different answer, so this cell
        discriminates the correct nb law from the shorthand at zero compute.
    - metric: seed residual - u_6(n=12) measured on seed 2 minus the law's 16,016
      direction: lower
      minimum_effect: >-
        Predicted +2 exactly, attributed to exactly 2 (u,x_3) or (u,x_1,x_2)
        support pairs absent from that seed's union support. The experiment must
        EXHIBIT the two absent monomials by name. If the residual is not
        explainable as absent support pairs, the law has an unmodelled term.
    - metric: >-
        arm-R residual - the 8,746 that H-SDEG-0dd021 cites as u_5 for the n=12
        D5 arm-R column-matched null, against the law's sem value 8,736
      direction: different
      minimum_effect: >-
        Delta = 10, to be either explained (the arm-R null is a seeded greedy
        set-cover construction, NOT the sem, so its supports may legitimately
        differ) or recorded as a discrepancy against a cited number. NO CLAIM IS
        MADE HERE THAT EITHER NUMBER IS WRONG. This proposal asserts only that
        the two are not the same quantity unless the arm-R construction is
        column-identical to the sem, and that no record currently says which.

  minimal_test:
    design: >-
      See EXP-DREG-519ad9. Three stages, cheapest first, and stage 1 alone can
      end the line: (1) evaluate the closed form in pure Python against the six
      committed integers - milliseconds, no solver, no Sage; (2) rebuild the
      support sets directly from the committed per-cell system artifacts and
      recompute {a_k} by up-closure, confirming the law from the systems rather
      than from algebra; (3) emit forced column counts for n = 15, 17, 18, 24, 30
      at D = 5, 6 as pre-registered predictions for whoever next builds a rung.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL): a
        FULL-SUPPORT random boolean system with the identical degree histogram
        (n quadrics, n cubics) in the same nb variables, i.e. supports drawn from
        all of U,X1,X2,X3. Its forced u_D is EXACTLY 0 at every D >= 2, because
        every degree-D monomial is then divisible by some support monomial of the
        required degree. This null can fail: if the measured u_D of the
        full-support null is nonzero, the up-closure implementation is wrong and
        nothing else in the experiment may be reported. It is also the object
        against which the whole "support gap" was defined, so its value being 0
        is what makes 16,016 a gap at all.
      - >-
        POSITIVE CONTROL / nearby object where the effect MUST appear: the n=9
        cell, where BOTH u_5 = 1,584 and u_6 = 1,848 are independently committed
        by a different experiment lineage (EV-SIG-006 / H-SDEG-0dd021) from the
        n=12 and n=21 cells. If the implementation does not reproduce n=9, it is
        broken and NO statement about any other n may be made.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported: interpolate
        between the block-incidence supports and full support by adding a
        fraction f of the forbidden cross-block monomials (X1-X3 pairs, X2-X3
        pairs, and U-free triples) for f in {0, 0.25, 0.5, 0.75, 1}. u_D must
        decrease monotonically to 0 at f = 1. A non-monotone or non-vanishing
        curve says the missing-column count is not driven by block incidence and
        localises the residual to a specific monomial class rather than leaving
        "the formula did not fit".
      - >-
        ARCHIVE CHECK: list every committed artifact holding a column count for
        this family and state whether each was reproduced, was not reachable, or
        disagreed. EV-DREG-004's lineage carries two data-loss incidents
        (INC-20260724-EXFAT-01/-02) and EV-SIG-008's run directories are recorded
        by its own artifact_absence_statement as absent or on a pre-current
        schema; unreachability is recorded as unreachability and never as a pass.
    required_metrics:
      - the six committed integers, each with its source path and reproduced value
      - the forced predictions for n = 15, 17, 18, 24, 30 at D = 5, 6
      - the two named absent support monomials explaining the seed-2 residual, or a statement that they were not found
      - the full-support null's measured u_D (forced 0) and the graded curve

  falsification_conditions:
    - >-
      Any one of the six committed integers is not reproduced exactly. The law is
      wrong and this proposal is withdrawn by a superseding record.
    - >-
      The supports rebuilt from a committed system hash contain a monomial the
      block decomposition forbids (an X1-X3 pair, an X2-X3 pair, or a
      U-free triple). The block reading of semaev_tree.py is then wrong and the
      derivation collapses at its first step.
    - >-
      The full-support null's u_D is measured nonzero. The instrument is broken;
      no result is reported.
    - >-
      u_D is found to depend on the seed by more than the handful of columns that
      absent support pairs can account for. The law is at best generic-case and
      must be restated as a bound rather than an identity.

  confounders:
    - >-
      POST-HOC FIT RISK, THE MAIN ONE. The six committed integers were available
      to the author before the closed form was written down, so this is a
      REPRODUCTION, not a prediction, and it must never be reported as a
      prediction. The mitigation is structural rather than procedural: the form
      has no free parameter to fit, it is forced by the supports alone, and the
      n = 15/17/18/24/30 values are genuine out-of-sample predictions that no
      committed number could have shaped. Weight the out-of-sample cells and
      discount the in-sample ones accordingly.
    - >-
      BUILDER DRIFT. Several copies of semaev_tree.py exist under experiments/*.
      If any cited cell used a copy that differs from src/semaev_tree.py, the
      supports may differ. Stage 2 must diff the copies and report.
    - >-
      DEFINITIONAL DRIFT IN "ncols". Some records count columns of all degrees
      <= D (190,051 - 16,016 = 174,035 is of that kind) and a formula that counts
      only degree exactly D will appear to fail. Every reported number must state
      its convention.

  interpretation_limits:
    - >-
      THIS IS A COLUMN-SET RESULT AND NOTHING ELSE. It predicts no rank, no
      deficit, no d_reg, no solving degree, no cost. It does not support, weaken
      or bear on H-DREG-001's mathematical content, and it may not be cited as
      evidence for or against the polynomial-solve scenario.
    - >-
      BOOLEAN, TOY, t = 3 ONLY. The derivation uses the char-2 Frobenius
      identity and the specific t = 3 chain in which the loop over intermediate
      links is empty. For t >= 4 there are u-to-u links and the block graph is a
      path rather than two blocks sharing one vertex; the law will differ and
      this record asserts nothing about it. Nothing transfers to prime fields.
    - >-
      What it DOES license, and this is the deliverable: the support-gap term in
      every past and future deficit in this lane can be computed rather than
      measured, so the quarantine imposed in BATCH-002 has an analytic
      resolution, and no further CTRL-B-shaped measurement is needed to obtain
      one. Whether the quarantine SHOULD be lifted is a Coordinator decision and
      is not asserted here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING for the identity itself. u_D as stated is a
        consequence of (i) the char-2 expansion of S_3, (ii) the Weil-descent
        substitution in semaev_tree.weil_descend_to_F2, and (iii) the up-closure
        column law. (i) and (ii) are exact algebra read from source. (iii) is the
        only step with empirical content and it is machine-verified rather than
        assumed.
      rigorous_support: >-
        (i): (a+b+c)^2 = a^2+b^2+c^2 over any commutative ring of characteristic
        2. (ii): y^2 = y for y in F_2 makes the coordinate expansion of a square
        F_2-linear. (iii): EV-SIG-006 observation (1), machine-checked at n = 9
        seed 1 across D = 3..6 on both arms, zero cancellation, zero parity
        deviation.
      validation_plan: >-
        (i) and (ii) re-derived symbolically in the experiment; (iii) re-verified
        by rebuilding the column set from committed supports and comparing set
        hashes, not counts.
    - id: H2
      statement: >-
        GENERIC-SUPPORT ASSUMPTION. For every alpha-basis and every admissible
        R_X, the union over the n coefficient equations of family A contains
        every (u_{1,j}, x_{3,i}) pair, and the union over family B contains every
        (u_{1,j}, x_{1,i}, x_{2,i'}) triple.
      rigorous_support: >-
        NOT PROVED HERE, and labelled as such. It is a statement about the
        F_2-linear map "coefficient of alpha^l" applied to products of basis
        elements, and it can fail for particular bases. The committed evidence is
        one seed hitting the law exactly (16,016) and one missing it by 2
        (16,018), which is the behaviour of a near-generic assumption.
      validation_plan: >-
        Enumerate, for the committed n = 12 seed-2 system, the pairs and triples
        absent from the union support, and check that their count matches the
        residual exactly. This is a direct test and it is cheap.

  target_complexity:
    time_exponent: >-
      n/a for this audit - it moves no exponent and proposes no algorithm, and
      that is stated plainly rather than dressed up. What it moves is the COST OF
      A MEASUREMENT in this program's own instrument: from a chunked 1,623.8 s /
      7.16 GB rank job (TASK-20260731-016) to a binomial evaluation.
    memory_exponent: n/a (kilobytes).
    best_known: >-
      No competing method exists for this quantity in-corpus; it has only ever
      been obtained by construction and counting.
    hidden_overhead: >-
      None in the arithmetic. The real overhead is upstream and is named: the
      supports must be re-derivable from a committed system hash, and for
      EV-SIG-008's cells the run directories are recorded as absent.
    tradeoff_note: n/a

  dominated_by: >-
