idea:
  id: IDEA-20260805-90a841
  question_id: RQ-DREG-001
  added: '2026-08-05'
  title: >-
    The block-incidence column law: a closed form for the boolean chained-Semaev
    (t=3) Macaulay support gap that reproduces every committed column count in
    GOAL-DREG-001 at zero compute, and retires the support-gap quarantine
    analytically instead of by a 7 GB rank measurement
  class: control

  claim: >-
    For the boolean chained Semaev system built by src/semaev_tree.py at t = 3,
    ti = 0 (m = 3), the number of degree-D monomials MISSING from the Macaulay
    column set is a parameter-free closed form in (n, D) alone, independent of
    the seed, the curve, the point R, and the field basis. With
    k = ceil(n/3), nb = n + 3k, N(v,D) = sum_{j<=D} C(v,j):
      u_D     = C(3k, D) + 2*C(n+k, D) - 2*C(k, D) - C(n, D)
      u_{D-1} = 2*C(k, D-1)
      u_j     = 0 for all j <= D-2
      ncols(n,D) = N(nb,D) - u_D - u_{D-1}
    This was DERIVED from the equation supports (below) and then checked, before
    this record was written, against every committed structural integer this
    program holds for the lane. It reproduces, exactly and with no fitted
    parameter: 1,584 (n=9 D5 missing) and 1,848 (n=9 D6 missing); 16,016 (n=12
    D6 missing, seed 2026, committed as deleted_degree_histogram_equals_6_16016);
    29,332 (n=9 D6 ncols, EV-SIG-006 N1); 174,035 (n=12 D6 ncols, seed 2026);
    and 778,394 (n=21 D5 ncols, EXP-DREG-004) - the last of which needs BOTH the
    u_D term (196,518) AND the separately derived u_{D-1} term (70) to land.
    CONSEQUENCE, which is the point of the proposal: the support-gap confound
    that has governed this goal since BATCH-002 is not an empirical quantity at
    all. It is a binomial identity. CTRL-B (TASK-20260731-016: chunked, 15 units,
    1,623.8 s, peak RSS 7.16 GB) measured a number that was derivable in one
    line, and every future rung's support gap is now free forever.

  object_first_candidate:
    tracked_object: >-
      The VARIABLE-BLOCK INCIDENCE PATTERN: the bipartite record of which of the
      four variable blocks U = {u_{1,j}}_{j<n}, X1 = {x_{1,i}}_{i<k},
      X2 = {x_{2,i}}, X3 = {x_{3,i}} co-occur in which equation family. It is
      followed through exactly one step - Macaulay column formation by the
      up-closure law - and it determines the entire column set. Nothing else
      about the system (coefficients, curve, seed, basis alpha, R_X) is carried.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: index calculus and
      relation collection; Groebner/F4/F5 solving-degree estimation as a
      black box; Pollard rho / BSGS cost comparison; Weil-descent /
      Gaudry-Diem-style decomposition attacks; semi-regular Hilbert-series
      modelling used as an oracle rather than as an object; subset-column corank
      (already ruled an artifact by h012 finding iv and by this goal's own
      admissible-evidence clause). The semi-regular series IS used here, but as
      a CALIBRATION TARGET to be reproduced exactly, never as an authority.
    newness_score: >-
      The up-closure column law itself is not new - EV-SIG-006 machine-verified
      it at n=9 with zero cancellation or parity deviation, and
      H-SDEG-0dd021 restates it. What is new is that nobody in this lane ever
      evaluated it. The corpus treats {a_k}, u_D and the "support gap" as
      MEASURED data (BATCH-002 quarantines a headline on it; BATCH-003 defers
      CTRL-B to pin it; EV-DREG-006/007/008 run a protocol-freeze, a red team
      and a chunked 7 GB job to obtain it) while the generating supports are
      three lines of char-2 algebra in a file that has been in the repository the
      whole time. This is the "attack the measurement" move, and the measurement
      turned out to be a binomial coefficient.
    testability_score: >-
      Maximal, and already partly discharged. The law is integer-exact, has no
      free parameter, and has 6 independent committed integers to hit; it hits
      all 6. The remaining tests (n=15, 17, 18, 24 column counts; the 16,018 vs
      16,016 seed-2 residual; the 8,746 vs 8,736 arm-R residual) are pure-Python
      arithmetic in milliseconds and need no solver, no Sage, and no rank.
    survival_score: >-
      The object survives exactly one step and then stops - which is the honest
      statement. It determines the COLUMN SET completely and determines the RANK
      not at all. Any attempt to read a d_reg conclusion out of it directly is
      the error this proposal exists to prevent.

  mechanism: >-
    READ FROM SOURCE, NOT RECALLED. src/semaev_tree.py, lines 55-87 and 90-171.
    At t = 3 the chained system has n_u = t-2 = 1 F_q-unknown u_1 and n_x = t = 3
    F_q-unknowns x_1, x_2, x_3, and the loop `for i in range(t-3)` is EMPTY, so
    exactly two S_3 equations are built:
      (B)  S_3(u_1, x_1, x_2) = 0
      (A)  S_3(u_1, x_3, R_X) = 0      with R_X a CONSTANT of F_q.
    S_3(a,b,c) = (ab + ac + bc)^2 + abc + B_curve. In characteristic 2 squaring
    is Frobenius and additive, so (ab+ac+bc)^2 = a^2 b^2 + a^2 c^2 + b^2 c^2, and
      S_3(a,b,c) = a^2 b^2 + a^2 c^2 + b^2 c^2 + abc + B_curve.
    Weil descent (lines 90-171): u_1 = sum_{j<n} u_{1,j} alpha^j with all n
    coordinates free, x_i = sum_{l<k} x_{i,l} alpha^l with only k = ceil(n/m)
    coordinates, m = t = 3. Because the boolean coordinates satisfy y^2 = y, a
    SQUARE of an F_q-variable is F_2-LINEAR in its coordinates:
    u_1^2 = sum_j u_{1,j} alpha^{2j}. Hence each squared PRODUCT is F_2-BILINEAR
    (boolean degree 2) and the single unsquared product abc is boolean degree 3
    - unless one of its three arguments is a constant, in which case it drops to
    degree 2.

    THE TWO EQUATION FAMILIES AND THEIR SUPPORTS. Taking the coefficient of
    alpha^l for l = 0..n-1 gives n boolean equations per S_3, 2n in total, in
    nb = n + 3k boolean unknowns (matching semaev_tree's own header count
    n*(t-2) + k*t).
      FAMILY A (from S_3(u_1, x_3, R_X), n equations, boolean degree 2):
        terms u_1^2 x_3^2 and u_1 x_3 R_X give monomials u_{1,j} x_{3,i};
        u_1^2 R_X^2 gives u_{1,j}; x_3^2 R_X^2 gives x_{3,i}; B_curve gives 1.
        supp(A) subset {u x_3 pairs} U {u} U {x_3} U {1}. X1 and X2 DO NOT OCCUR.
      FAMILY B (from S_3(u_1, x_1, x_2), n equations, boolean degree 3):
        u_1^2 x_1^2 -> u_{1,j} x_{1,i}; u_1^2 x_2^2 -> u_{1,j} x_{2,i};
        x_1^2 x_2^2 -> x_{1,i} x_{2,i'}; u_1 x_1 x_2 -> u_{1,j} x_{1,i} x_{2,i'};
        B_curve -> 1.
        supp(B) subset {deg-2 pairs among U,X1,X2} U {u x_1 x_2 triples} U {1}.
        X3 DOES NOT OCCUR. supp(B) HAS NO DEGREE-1 MONOMIAL.
    So the system at t = 3 is an AMALGAM OF TWO BLOCKS GLUED ALONG U: block A on
    (U, X3) with n quadrics in n+k variables, block B on (U, X1, X2) with n
    cubics in n+2k variables. "n equations of degree 2 and n of degree 3", the
    degree histogram every record in this lane quotes, is a shadow of that
    block structure; the block structure is the thing, and no record names it.

    THE COLUMN LAW. Macaulay at degree D multiplies f_i (degree d_i) by every
    monomial of degree <= D - d_i, so a squarefree monomial m of degree D' is a
    column iff some m' in supp(f_i) divides m with deg(m') >= D' - (D - d_i).
    At D' = D: family A needs deg(m') >= 2, i.e. m must contain at least one U
    variable AND at least one X3 variable; family B needs deg(m') >= 3, i.e. m
    must contain at least one U, one X1 and one X2 variable. At D' = D-1: A needs
    deg(m') >= 1, i.e. m meets U or X3; B needs deg(m') >= 2, i.e. m meets at
    least two of U, X1, X2. At D' <= D-2 the constant term B_curve (degree 0)
    reaches every monomial, so ALL columns of degree <= D-2 are present - which
    is why every committed cell records its whole deficiency in the top degree.
    Inclusion-exclusion on the missing set at degree D, {a=0} U {b3=0 and
    (b1=0 or b2=0)} where (a,b1,b2,b3) are the block occupancies, gives
      u_D = C(3k,D) + 2*C(n+k,D) - C(k,D) - C(k,D) - C(n,D),
    and at degree D-1 the missing set is {m subset X1} U {m subset X2}, giving
      u_{D-1} = 2*C(k,D-1).

    THE NUMBERS, DERIVED BEFORE ANY OF THEM WAS LOOKED UP AGAIN.
      n=9  (k=3, nb=18): u_5 = 2*C(12,5) = 1,584. u_6 = 2*C(12,6) = 1,848.
                         ncols(9,6) = 31,180 - 1,848 = 29,332.
      n=12 (k=4, nb=24): u_6 = 924 + 2*8,008 - 0 - 924 = 16,016; u_5 = 2*C(4,5)
                         = 0; ncols(12,6) = 190,051 - 16,016 = 174,035.
      n=21 (k=7, nb=42): u_5 = 20,349 + 2*98,280 - 2*21 - 20,349 = 196,518;
                         u_4 = 2*C(7,4) = 70; N(42,5) = 974,982;
                         ncols(21,5) = 974,982 - 196,518 - 70 = 778,394.
    Every one of those is a committed integer in this goal's artifacts. The n=21
    hit is the strongest single check because it requires the u_{D-1} = 70 term,
    which no prior record in this lane has ever written down.

