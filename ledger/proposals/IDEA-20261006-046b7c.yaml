idea:
  id: IDEA-20261006-046b7c
  title: >-
    Unit-rank gap between x^4 - x - 1 and x^4 + x + 1
  class: measurement
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  added: '2026-10-06'
  question_id: RQ-PAIR-f2e31f
  novelty_status: unverified
  claim: >-
    Let r(f) be the number of real roots of a square-free monic polynomial
    f in Z[x], counted without multiplicity, and let u(f) = r(f) +
    (deg(f) - r(f))/2 - 1 when f is irreducible. Then u(x^4 - x - 1) = 2
    and u(x^4 + x + 1) = 1, so the gap is 1. A charge that uses only the
    degree assigns 3 to both and has gap 0. The degree-only charge and
    the signature charge are separated by this gap. The polynomial x^4 - 1
    is reducible and must not be given a value of u. No discrete logarithm
    is computed and no deployed prime is costed.
  mechanism: >-
    Signature reading: real-root counts are 2 and 0, complex places make
    up the rest of the degree, and u is that combination, hence 2 and 1.
    Degree reading: both degrees are 4, so both overheads are 3 and the
    gap is 0. Sign checks used to predict the counts, which the test must
    repeat: x^4 - x - 1 is positive at x = -1, negative at x = 0, negative
    at x = 1, and positive at x = 2, and its derivative 4x^3 - 1 has one
    real zero, so there are two simple real roots. x^4 + x + 1 has
    derivative 4x^3 + 1 with one real zero near -0.63, and the value there
    is positive, so there is no real root. Irreducibility of x^4 - x - 1
    is the rational-root check at plus or minus 1 together with the failure
    of a quadratic factorization over Z (the cross term cannot be -1 when
    the constant terms are a unit pair). x^4 + x + 1 is irreducible over
    F_2 and therefore over Q. OBJECT FRAME. The representation is the
    coefficient vector of a monic quartic. Sigma is complex conjugation
    acting on the set of embeddings. Sigma is not translation on a curve.
    Trichotomy class: partial-action. Conjugation fixes the real
    embeddings and pairs the others; it is not the full set of field
    automorphisms and it is not a group translation. LOSSY-PROJECTION
    TEST. The projection discards the numerical roots and keeps the pair
    of counts (number of real embeddings, number of conjugate pairs).
    The discard is compatible with Sigma because conjugation preserves
    the real-or-not bit. Lossy: four roots collapse to two integers, and
    the roots are not recovered. OFF-LIMITS AS PRIMARY LENS: families
    F1-F7. Component used: F6, only as the conjugation action on
    embeddings that produces the two counts. No orbit of curve points is
    searched. F4 is not a component.
  assumptions:
    - A reducible polynomial is refused rather than assigned u.
    - Multiple roots would be refused. Both irreducible quartics above are predicted to be square-free because each real root is simple and the non-real roots come in distinct conjugate pairs.
    - u is computed from the signature counts alone. No class group and no unit generator is constructed.
  predictions:
    - metric: u(x^4 - x - 1) minus u(x^4 + x + 1)
      direction: different
      minimum_effect: >-
        The difference equals 1. The degree-only differences equal 0.
        The two differences are not the same integer.
  minimal_test:
    design: >-
      Isolate real roots by a Sturm sequence on [-2, 2], which contains
      every real root of either quartic because both leading terms dominate
      outside that interval (values at plus or minus 2 are positive and
      large). Count sign changes. Confirm irreducibility by rational roots
      and by trying quadratic factors with constant term plus or minus 1.
      Emit u only if both checks pass. On input x^4 - 1, emit a refusal.
    controls:
      - >-
        Degree-only null: report deg - 1 for both irreducible quartics.
        That pair is (3, 3). The signature pair is predicted (2, 1).
      - >-
        Same-degree null is the second quartic itself. Equal degree and
        unequal u is the whole claim.
      - >-
        Reducible nearby object x^4 - 1. A run that prints a rank for it
        has left the stated domain.
      - >-
        Sign table at x in {-2,-1,0,1,2} reproduced by a second evaluator
        before the Sturm count is trusted.
    required_metrics:
      - Real-root counts of both irreducible quartics
      - The two values of u
      - The degree-only pair (3, 3)
      - The refusal bit on x^4 - 1
  falsification_conditions:
    - A Sturm count returns a real-root number other than 2 for x^4 - x - 1 or other than 0 for x^4 + x + 1.
    - Either polynomial is reported reducible, or x^4 - 1 is given a numeric u.
    - The signature gap and the degree-only gap are the same integer.
  controls:
    - Same degree, different signature, as the null pair.
    - Reducible x^4 - 1 refused.
  confounders:
    - Counting a complex root as real because a floating-point imaginary part underflowed.
    - Using deg - 1 and labeling it u, which forces the gap to 0 by construction.
    - Factoring in F_p for a single p and treating a root mod p as a real root.
  interpretation_limits:
    - Not an attack. No ECDLP exponent. No discrete logarithm in any field.
    - The gap of 1 is a difference of two small integers attached to two quartics. It is not a security level and not a memory figure for a deployed prime.
    - Nothing here says which overhead a published estimate actually charges. The measurement only separates the two charging rules on these inputs.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For these two irreducible quartics, u equals the signature
        expression r + (4 - r)/2 - 1, and the degree-only charge equals
        3 for both. The claim under test is that those two functions
        disagree on this pair. No distribution of number fields is
        assumed, and no statement is made about units of a degree-12 field.
      rigorous_support: >-
        The signature expression is the classical rank shape for the unit
        group of the ring of integers of a number field. That theorem is
        a recalled pointer, not a file opened in this session, so it is
        not support. The finite support used here is the sign table and
        the factorization check, both of which are exact integer
        arithmetic on these two polynomials.
      validation_plan: >-
        Run the Sturm count and the factorization check independently of
        the sign table written above. If the Sturm count matches the sign
        table, record the gap 1. If it does not, the prediction is false
        on these inputs. As a tail check, evaluate the same procedure on
        x^4 + 1, which is irreducible (it is the 8th cyclotomic polynomial;
        this irreducibility is recalled and must be rechecked by the same
        quadratic-factor search, not taken from the recall) and has no
        real root, so the predicted u is 1, matching x^4 + x + 1 and not
        matching x^4 - x - 1. A rank printed for a reducible input voids
        the run.
  target_complexity:
    time_exponent: >-
      A constant-time Sturm count on two degree-4 polynomials. No new
      exponent. No sub-rho claim.
    memory_exponent: >-
      A constant number of integers. One extra dense column is not
      estimated, because no relation block is built.
    best_known: >-
      Opened row KR-RHO-13bf67 gives the generic-group square-root bound.
      This idea does not state an ECDLP time. Opened note KN-LIT-7084
      mentions a tower adaptation of a Schirokauer variant at abstract
      level and does not give these two ranks.
    hidden_overhead: >-
      None derived. No o(1) term is present.
    tradeoff_note: >-
      No time-memory tradeoff. A gap of one in u would be one extra
      integer column only after a relation matrix exists, and this
      measurement does not build that matrix.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
