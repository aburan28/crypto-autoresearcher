idea:
  id: IDEA-20260816-2c83a3
  question_id: RQ-SDITH-001
  added: '2026-08-16'
  title: Build a toy MPC-in-the-head protocol small enough that every transcript can be enumerated,
    run a genuinely optimal cheating prover against the complete challenge space, and compare the
    exhaustively measured soundness error against the per-repetition formula the paradigm budgets
    for it.
  class: measurement
  claim: (A) EXHAUSTIVE IS REACHABLE. At party count N in the range 2 to 16 and repetition count tau
    in the range 1 to 4, over a field of size 2 to 16, the full challenge space of a threshold-style
    MPC-in-the-head protocol has size at most a few million, so the maximum over all cheating strategies
    of the probability that the honest verifier accepts a false statement can be computed EXACTLY
    by enumeration rather than bounded. The quantity normally called the soundness error becomes a
    measured integer ratio with no statistical error bars at all. (B) THE COMPARISON IS THE POINT.
    The paradigm budgets a per-repetition error of the shape p = 1/N + something/|F| and composes
    it across tau repetitions. Part (B) claims that the exhaustively measured maximum acceptance probability
    equals the composed budget at tau equal to one for every (N, |F|) in the grid, and that any deviation
    at tau greater than one is attributable to a NAMED coupling between repetitions rather than to
    the per-repetition term. Whether such a deviation exists is what the run measures. (C) THE ATTRIBUTION
    IS PARADIGM-LEVEL. The toy protocol carries a placeholder relation with no algebraic content,
    so anything measured here belongs to the PROOF PARADIGM and not to syndrome decoding, AES or MQ.
    That is the whole reason to build a toy rather than instrument a scheme. (D) WHAT IS NOT CLAIMED.
    No forgery, no break, no security consequence, and no statement about SDitH, FAEST or MQOM at
    their own parameters, which are far outside the enumerable range. A measured deviation at toy
    scale is NOT evidence that any deployed bound is loose; extrapolating an enumerable-scale ratio
    to lambda-bit parameters is exactly the move this program's own record of extrapolation failures
    warns against, and the contract forbids it. It is also NOT claimed that the toy protocol is any
    of the three schemes; it is a shell in the family, and its fidelity is itself one of the reported
    uncertainties.
  mechanism: 'The protocol shell: a prover secret-shares a witness among N parties, commits to each
    party view, the verifier samples one hidden party index per repetition plus a field challenge,
    the prover opens N-1 views, and the verifier recomputes the missing view''s consistency check.
    STAGE 1 implements honest prover and verifier and checks completeness at 100 percent over a full
    sweep. STAGE 2 implements a cheating prover as an EXPLICIT search: for a false statement, enumerate
    every assignment of corrupted shares the prover can commit to, and for each, enumerate every challenge
    in the full space and count accepts. The maximum over corruptions of accepts divided by challenge-space
    size is the exact soundness error. Because both enumerations are finite and small at the declared
    grid, this terminates. STAGE 3 sweeps N, |F| and tau and tabulates measured error against the
    composed budget, plotting the ratio. STAGE 4 runs the null: an identical protocol whose verifier
    check is replaced by a check that accepts with a hard-coded probability independent of the transcript,
    so its measured error is known in advance. If the instrument does not return that known value
    exactly, the instrument is broken and the signal arm is void. STAGE 5 runs a second known-answer
    control at N equal to 2, where the soundness error of a one-of-two cut-and-choose is hand-computable,
    and requires exact agreement. The refutation path is cheap and informative in both directions:
    if the measured error equals the budget everywhere, the paradigm''s per-repetition accounting
    is confirmed exact at enumerable scale, which is a usable measured obstruction against the hope
    that slack hides there. If it does not, the deviation''s dependence on tau localizes the missing
    coupling term.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: soundness error, MPCitH, VOLE, repetition, GGM tree,
      Fiat-Shamir, grinding. Read titles and class fields of IDEA-20260808-721f2b, IDEA-20260801-005,
      IDEA-20260731-019, IDEA-20260805-7abf04, IDEA-20260731-002, IDEA-20260808-e8586d, IDEA-20260805-38048d.
      Read RQ-SDITH-001 and RQ-WFS-e776b6 in full; read H-SDITH-d37289 in full to check whether an
      exhaustive-enumeration instrument already exists in the SDitH lane.'
    results: 'IDEA-20260808-721f2b is the nearest record: it computes the OPTIMAL forger cost by dynamic
      programming over the TCitH challenge structure at toy parameters. It optimises over a challenge
      structure taken as given from the published accounting. IDEA-20260801-005 proposes reconstructing
      the FAEST soundness chain at toy fields and measuring per-round soundness error empirically,
      which is closer still in intent but is scheme-specific to VOLEitH field sizes and is a chain
      reconstruction rather than a full-transcript enumeration. IDEA-20260731-019 targets the VOLEitH
      Schwartz-Zippel bound. H-SDITH-d37289 contains no protocol implementation at all; it is exact-arithmetic
      ISD counting. No record was found that implements an executable prover and verifier and enumerates
      the complete transcript space with a genuinely optimal cheating prover.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature. Assembled from known parts:
      cut-and-choose soundness analysis, exhaustive enumeration at toy scale, and known-answer instrument
      calibration are all standard, and IDEA-20260808-721f2b and IDEA-20260801-005 already occupy
      adjacent ground in this repository. Claimed new relative to THIS repository only: an EXECUTABLE
      protocol shell whose transcript space is enumerated in full so the soundness error is an exact
      integer ratio rather than an optimum over a modelled structure, with the deviation from the
      composed budget read as a function of tau.'
  object_first_candidate:
    tracked_object: 'The accept-count function A: (corruption, challenge) maps to accept or reject,
      as a complete boolean table over the finite product of the corruption space and the challenge
      space. The soundness error is the maximum row-sum of that table divided by the number of columns.'
    lossiness: 'Genuinely lossy. The table discards the witness, the relation''s algebra, the commitment
      scheme''s internals, the message and the hash function, retaining only which (corruption, challenge)
      pairs the verifier accepts. It propagates because the verifier''s decision is a function of
      the transcript alone: no accept decision reads back into the discarded content. It is not a
      change of coordinates, because many distinct protocols with different relations induce the same
      accept table, and the whole attribution argument in claim (C) depends on exactly that many-to-one
      collapse.'
    propagation: One step of the target operation is adding one repetition. Under it the accept table
      maps to the tensor product of the previous table with a fresh copy, IF repetitions are independent.
      That tensor structure is the paradigm's composition assumption, and one step therefore acts
      on the tracked object either as a clean tensor product or as something else. Detecting which
      is the measurement.
    survival_score: The tensor structure survives exactly as far as the repetitions share no state.
      It dissolves the moment the shell reuses a salt, a commitment root or a challenge-derivation
      across repetitions. Concretely, the sweep reports the largest tau at which the measured error
      equals the tau-th power of the tau-equals-one measured error to within one part in 10000, and
      that tau is the survival number. Because the enumerable range is tau up to 4, a survival score
      of 4 is the ceiling this design can report, and that ceiling is stated rather than hidden.
  null_object_control: 'Two nulls, both executed in the same invocation as the signal arm. NULL-1:
    an identical shell whose verifier accepts on a hard-coded, transcript-independent coin of known
    bias b; the instrument must return exactly b. NULL-2: an identical shell run on a TRUE statement
    with an honest prover, where the accept rate must be exactly 1. For the signal arm to mean anything,
    NULL-1 must return b to the last bit and NULL-2 must return 1 exactly. If either misses, the enumeration
    is measuring the implementation and not the protocol, and no soundness number from that run is
    admissible.'
  discriminated_from:
  - 'IDEA-20260808-721f2b, exact optimal forger by dynamic programming over the TCitH challenge structure:
    it optimises within a challenge structure imported from the published accounting, so an error
    in that structure is invisible to it. This enumerates the transcript space of an executable protocol,
    so the structure is an output rather than an input.'
  - 'IDEA-20260801-005, VOLEitH field-size round-trip with empirical per-round soundness: scheme-specific
    to FAEST field sizes and empirical in the sampling sense. This is scheme-agnostic by construction
    and exhaustive, so it has no sampling error at all.'
  - 'IDEA-20260731-019, VOLEitH Schwartz-Zippel tightness: its object is a polynomial-identity bound
    over a deployed field. No polynomial identity testing occurs here; the relation is a placeholder
    with no algebra.'
  - 'H-SDITH-d37289, the d-split ISD counting hypothesis: its object is the hard problem''s search
    space. This record forbids itself from touching any hard problem, per the bucket directive.'
  - A generic statistical estimate of soundness by Monte Carlo forgery attempts. That yields error
    bars and a lower bound on the true maximum; enumeration yields the maximum exactly, and the difference
    is the reason to build the toy small.
  assumptions:
  - The toy shell is a faithful member of the MPC-in-the-head family at the level of its challenge
    structure. Fidelity is a reported uncertainty, not an established fact, and Stage 1 records exactly
    which structural features the shell has and lacks.
  - The corruption space is fully enumerable at the declared grid. Where it is not, the run reports
    a LOWER BOUND on the soundness error and labels it as such rather than silently reporting a maximum.
  - The commitment scheme is idealized as perfectly binding and hiding, so commitment-layer terms
    are deliberately absent. Any measured deviation therefore cannot be attributed to the commitment
    layer, which is a scoping restriction and is stated in every result.
  - Exact rational arithmetic on integer counts; no floating-point comparison decides whether the
    measured error equals the budget.
  - 'The placeholder relation carries no algebraic structure a cheating prover could exploit. Verified
    by construction: the relation is a random linear check over a small field with a freshly sampled
    matrix per instance.'
  predictions:
  - metric: measured soundness error at tau equal to one, as a ratio to the composed budget
    direction: different
    minimum_effect: 1.0
  - metric: ratio of measured error at tau to the tau-th power of measured error at tau equal to one
    direction: higher
    minimum_effect: 1.0
  - metric: NULL-1 measured accept rate minus its hard-coded bias b
    direction: lower
    minimum_effect: 0
  - metric: NULL-2 honest-prover accept rate
    direction: higher
    minimum_effect: 1.0
  minimal_test:
    design: Fix N equal to 4, field size 4, tau equal to 1 and 2, and a placeholder relation of three
      linear equations. Implement honest prover and verifier in about 200 lines. Enumerate the corruption
      space (all assignments of corrupted shares consistent with the commitments the prover can choose)
      crossed with the full challenge space (hidden-party index times field challenge, raised to tau).
      Count accepts, take the maximum over corruptions, and report the exact rational. Run NULL-1
      and NULL-2 through the identical enumeration in the same invocation. Compare the tau-equals-1
      measured value against the hand-computed 1/N plus 1/|F| style budget and the tau-equals-2 value
      against its square. The whole test fits in seconds on one core, needs no cryptography, and either
      reproduces the budget exactly (a usable measured obstruction against slack hiding in the per-repetition
      term) or does not, in which case the deviation's tau dependence is immediately visible from
      two data points.
    controls:
    - 'NULL-1: transcript-independent verifier with hard-coded accept bias b; must return b exactly.'
    - 'NULL-2: honest prover on a true statement; must return accept rate exactly 1.'
    - 'N equal to 2 hand-computed fixture: the one-of-two cut-and-choose soundness error is computable
      by hand and must be reproduced exactly.'
    - 'tau equal to 1 versus tau equal to 2 at fixed (N, |F|): the tensor-composition check.'
    - A shuffled-challenge control in which the challenge is drawn from a permuted but identical space;
      the measured maximum must be invariant under permutation.
    required_metrics:
    - exact measured soundness error as an integer ratio, per (N, |F|, tau)
    - the composed budget value at the same point, exact rational
    - the ratio of the two
    - size of the enumerated corruption space and challenge space per point
    - NULL-1 deviation from b
    - NULL-2 accept rate
    - argmax corruption strategy, recorded so the maximizing cheat is inspectable
  falsification_conditions:
  - NULL-1 does not return b exactly, voiding every soundness number from the run.
  - NULL-2 does not return exactly 1, indicating the honest protocol is not complete and the shell
    is misimplemented.
  - The N-equal-2 fixture is not reproduced exactly.
  - The corruption space is not enumerable at the smallest declared grid point, so the design cannot
    deliver a maximum at any scale and only lower bounds are available.
  - The measured error at tau equal to 1 exceeds the budget, which under the toy shell would indicate
    a shell-construction error rather than a finding, and must be diagnosed as such before any interpretation.
  - The measured maximum changes under the shuffled-challenge control, indicating the enumeration
    depends on challenge ordering.
  confounders:
  - A shell whose challenge structure was, consciously or not, built to reproduce the budget. Mitigated
    by writing the budget formula only AFTER the shell is frozen, and by recording the argmax cheating
    strategy so a reader can see what the maximum actually exploits.
  - Idealized commitments removing exactly the term where deviation would live, producing a clean
    agreement that means less than it looks.
  - Enumeration bugs that silently under-count corruptions, biasing the measured maximum downward.
    Mitigated by the N-equal-2 fixture and by reporting enumerated space sizes.
  - Small (N, |F|) regimes where 1/N and 1/|F| are the same order, making the two budget terms indistinguishable.
    Mitigated by including grid points with N and |F| far apart.
  interpretation_limits:
  - Results hold for the declared toy shell at the enumerated grid only. They are NOT statements about
    SDitH, FAEST or MQOM, whose parameters are outside the enumerable range by many orders of magnitude.
  - Because commitments are idealized, no conclusion touches the commitment or hash layer.
  - A measured agreement with the budget at toy scale is evidence about the per-repetition accounting
    IN THIS SHELL and is not evidence that a deployed bound is tight.
  - The survival score is capped at tau equal to 4 by enumerability, so a clean tensor structure through
    tau equal to 4 says nothing about tau equal to 32.
  target_complexity:
    time_exponent: No attack exponent is claimed. The enumeration itself is O(|corruptions| times
      |challenges|), exponential in tau by construction and deliberately kept small.
    memory_exponent: No attack exponent is claimed. Memory is O(|challenges|) counters, kept under
      a few hundred megabytes by the grid bound.
    best_known: The incumbent is the analytic per-repetition soundness bound the paradigm quotes,
      and within this repository the dynamic-programming optimum of IDEA-20260808-721f2b and the empirical
      per-round measurement of IDEA-20260801-005.
    hidden_overhead: 'The corruption space is the term that explodes: a shell whose prover has more
      freedom than the design anticipates turns an enumeration into a search, and the honest fallback
      is a lower bound rather than a maximum. Human cost hides in shell fidelity: arguing about whether
      the toy is really in the family will consume more reviewer time than the compute does.'
  dominated_by: 'n/a (no result claimed). Every frontier axis was considered: no time, memory or query
    point is placed, because the run solves no instance and forges nothing.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that exhaustive enumeration is reachable at the declared grid:
    0.8, the arithmetic is straightforward and the only risk is a corruption space larger than anticipated.
    Part (B), that measured equals budget at tau equal to 1: 0.65, because a well-designed toy usually
    does, and the informative outcome is the tau greater than 1 comparison, for which I give 0.5 that
    any deviation appears at all. Part (C), that the attribution is genuinely paradigm-level: 0.7,
    contingent entirely on shell fidelity, which is the weakest link. Part (D) is scoping and carries
    no probability.'
