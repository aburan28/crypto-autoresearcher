idea:
  id: IDEA-20260809-2d4427
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    A lattice-recovery certificate format and independent checker, so that every
    claimed recovery in this program is verifiable by a reader in milliseconds
  class: tooling
  claim: >-
    Lattice results in this program are currently reported as run outcomes rather
    than as objects. For NTRU key recovery the object is small and its check is
    trivial: a candidate (f, g) is verified by one ring multiplication against the
    public key and a norm check. The claim is that a declared certificate format
    plus a checker that shares no code with the solver makes every recovery in
    this goal independently verifiable, and that the same format transfers to the
    other lattice goals unchanged.
  mechanism: >-
    Define the certificate as the recovered short vector plus the instance's
    public data and a declared verification predicate; implement a checker that
    reads only the certificate, links no solver code, and returns accept or
    reject with a reason.
  why_not_a_renamed_known_approach: >-
    Certificate discipline exists in this program for symmetric results, where a
    collision is self-evidently checkable. Extending it to lattice recoveries —
    where the community usually reports success rates — is the transfer, and the
    no-shared-code requirement is what makes it a real independence check.
  predictions:
  - observable: checker accepts every recovery the solver reports and rejects perturbed certificates
    metric: two rates over the run set
    predicted: 100 percent and 0 percent respectively. Any deviation is a bug in one of the two and must be resolved before results are recorded.
  - observable: checker runtime per certificate
    metric: milliseconds
    predicted: Milliseconds at toy dimension, which is what makes third-party verification realistic.
  minimal_test: >-
    Run the checker over every recovery produced by the main sweep, plus a
    negative set of deliberately perturbed certificates, and report both rates.
  controls:
  - 'INDEPENDENCE: the checker must not import or link the solver, and this is verified mechanically in the run package rather than asserted.'
  - 'NEGATIVE SET: perturbed certificates must be rejected, or the checker is not checking anything.'
  falsification_conditions:
  - The checker accepts a perturbed certificate.
  - Certificates cannot be made self-contained without including solver state, which would defeat the purpose and must be reported.
  interpretation_limits: >-
    A verified certificate proves a recovery happened at the stated parameters.
    It says nothing about the cost of obtaining it, which is recorded separately.
  sota_delta: 'No attack. Delta: reusable verification infrastructure that raises the evidence tier of every lattice result in this program.'
  dominated_by: Not dominated by any corpus record; intended for reuse by the ML-KEM and FrodoKEM goals without modification.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for certificate checker: symmetric goals only. WEB NOT CHECKED.'
  source_refs:
  - docs/claims-and-verification.md -- IN CORPUS, to be re-read for the certificate tier definitions.
