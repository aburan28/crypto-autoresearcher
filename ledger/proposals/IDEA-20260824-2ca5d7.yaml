idea:
  id: IDEA-20260824-2ca5d7
  title: >-
    Quadratic-twist and near-neighbour search re-posed on a HIGH-rank base:
    Mestre-Nagao triage then an exact height/independence gate, with the
    existing rank-0 twist negative (0 of 364756) preregistered as the null
    object and coverage reported as numerator over denominator
  class: measurement
  recorded_at: '2026-08-24'
  goal_id: GOAL-ECQ-002
  question_id: RQ-ECQ-80f23c
  role: idea-generator
  origin: >-
    User proposal in session, assessed against committed state before filing.
    The user's framing named ECDLP; that reading is REJECTED here and the
    reason is recorded under interpretation_limits rather than dropped.

  claim: >-
    Quadratic twisting of a base curve of HIGH Mordell-Weil rank over Q, sieved
    by a Mestre-Nagao partial-sum statistic and gated by an exact
    height-pairing independence check, yields at least one curve of rank
    strictly greater than its base within a preregistered budget -- whereas the
    same pipeline run on rank-0 bases at matched candidate count yields none.
    Falsified if the high-rank arm's best excursion over base rank is <= 0 at
    equal or greater coverage than the control arm.

  mechanism: >-
    Mordell-Weil rank is not invariant under quadratic twist: rank E^(D)(Q) and
    rank E(Q) are independent summands of rank E(Q(sqrt D)), so E^(D) can
    exceed E. The Mestre-Nagao partial sum S(N) = sum_{p<=N} (a_p log p)/p (or
    the standard variant) is a rank-EXCESS detector: it estimates rank above
    the family's own floor, with a measured per-rank signal of about 5.61 at
    N = 1000 and a noise floor set by the family (EV-ECQ-0d142e OBS-10). The
    causal content of this proposal is that the detector's discriminating power
    depends on the SIZE OF THE EXCURSION ASKED OF IT, not on the twist
    construction. EV-ECRANK-b6c9b6 asked it for a 0 -> +5 excursion off rank-0
    bases at conductor ~1e11 and got nothing; a high-rank base asks for
    +1..+3 off a fixed, structurally capped floor, which is the regime where
    the same statistic was measured to work (3.9% of the tier-2 domain
    certified under GOAL-ECQ-001). Whether the twist construction itself is
    what failed, or only the excursion size, is currently CONFOUNDED in the
    committed record. This proposal separates them.

  novelty_status: unverified

  citations:
    - ref: EV-ECRANK-b6c9b6
      provenance: internal
      claim: >-
        Mestre-Nagao prefilter over 364756 squarefree twists of five
        small-conductor (rank-0) curves, |d| <= 300000, primes to 1500,
        ellrank on the top 400 scoring twists per curve (0.11% of domain):
        NO twist of rank >= 5. Separately, 49692 small-coefficient curves gave
        497 distinct j-invariants of rank >= 3 and exactly 2 of rank 4.
      verified_by: session read of ledger/evidence/EV-ECRANK-b6c9b6.yaml
    - ref: EV-ECQ-0d142e
      provenance: internal
      claim: >-
        OBS-10: the rank-0-twist prior did NOT transfer to a high-rank family;
        the diagnosis recorded is structural (excursion size, domain, coverage),
        and S(N) is characterised there as a rank-excess detector with a
        per-rank signal ~5.61 at N = 1000.
      verified_by: session read of ledger/evidence/EV-ECQ-0d142e.yaml
    - ref: GOAL-ECQ-001
      provenance: internal
      claim: >-
        Certified rank 13 over Q on a rational elliptic surface whose Q(t) rank
        is capped at 8 by Shioda-Tate (10d-2 at d=1); the gap to the record is
        base rank, not sieve volume.
      verified_by: session read of ledger/goals/GOAL-ECQ-001/goal.yaml
    - ref: KN-LIT-020
      provenance: internal
      claim: Xedni calculus -- the global-lift route from ECDLP to Mordell-Weil rank.
      verified_by: session read of knowledge/literature/KN-LIT-020.md
    - ref: KN-LIT-021
      provenance: internal
      claim: >-
        Xedni is virtually certain to fail; the failure is driven by an ABSOLUTE
        BOUND on the coefficients of any relation the lifted points can satisfy,
        not by scarcity of high-rank curves.
      verified_by: session read of knowledge/literature/KN-LIT-021.md
    - ref: null
      provenance: recalled
      claim: >-
        Goldfeld's conjecture -- average analytic rank in a quadratic twist
        family is 1/2, so the high-rank tail is thin. Pointer only; not read in
        this program and supports nothing here.
      verified_by: null

  assumptions:
    - The base curve's rank over Q is known exactly, not just bounded below.
    - ellrank (or equivalent descent) terminates on the gated survivors within
      the per-candidate budget; non-termination is a budget event, never
      negative mathematical evidence (AGENTS.md rule 3).
    - Twisting does not change the base's rank contribution, so an observed
      rank above base rank is genuinely twist-supplied.

  predictions:
    - metric: max_excursion_over_base_rank_high_arm
      direction: higher
      minimum_effect: >-
        >= +1 on at least one gated survivor. A +0 result at full coverage
        falsifies the claim.
    - metric: mestre_nagao_auc_high_arm_vs_control
      direction: higher
      minimum_effect: >-
        Strictly better ranking of true positives than a random-order control
        on the same candidate set. If S(N) does not beat random ordering here,
        the triage stage has no value and the proposal collapses to brute force.
    - metric: naive_height_of_best_survivor
      direction: higher
      minimum_effect: >-
        PREDICTED ADVERSE. Twisting by D inflates coefficients, so survivors are
        expected to be WORSE on the ICARM rank-relative-to-height metric that
        GOAL-ECQ-002 axis A2 targets. Recorded as a prediction against the
        proposal's own usefulness, not hidden.

  minimal_test:
    design: >-
      Two arms, matched candidate count and matched compute, run under one
      frozen protocol. HIGH arm: quadratic twists of a base of known high rank
      (the GOAL-ECQ-001 rank-13 certified curve, and/or specialisations of the
      rank-8 Q(t) surface). CONTROL arm (NULL OBJECT): the same pipeline on
      rank-0 bases, i.e. a re-run of the EV-ECRANK-b6c9b6 regime at the new
      budget. Stage 1 Mestre-Nagao S(N) triage over squarefree D; stage 2 exact
      height-pairing regulator + independence gate on the top-scoring survivors
      only. Isogeny-class dedup BEFORE the gate.
    controls:
      - >-
        NULL OBJECT: rank-0-base arm at matched N. Belief in the high arm is
        licensed only by the DIFFERENCE between arms.
      - >-
        RANDOM-ORDER control: gate an equally sized random sample of the same
        candidate set, to measure what S(N) triage actually buys. Its absence
        was flagged as a validity threat on the prior twist work
        (TASK-20260822-53748a line 75).
      - >-
        ISOGENY DEDUP control: rank is isogeny-invariant, so isogenous
        neighbours are wasted gate budget AND inflate the denominator.
        Report deduped and raw denominators separately.
      - >-
        NEAR-NEIGHBOUR arm (optional, cheap): small perturbations of (a4, a6)
        in coefficient space rather than twist orbits, to test whether "near
        neighbour" buys anything twisting does not. Predicted to dominate the
        twist arm on height while losing on rank.
    required_metrics:
      - candidates_screened (denominator, raw and isogeny-deduped)
      - candidates_gated (numerator)
      - coverage_fraction reported EXPLICITLY as numerator/denominator, never
        as a bare percentage or a bare "we searched widely"
      - rank_distribution_of_gated per arm
      - max_excursion_over_base_rank per arm
      - regulator_condition_number and exact-arithmetic verdict per survivor
      - naive_height and conductor of every survivor
      - wall_clock and non-terminations per stage, separated from negatives

  falsification_conditions:
    - >-
      Max excursion over base rank <= 0 in the HIGH arm at coverage >= the
      control arm's. This kills the claim outright.
    - >-
      S(N) triage does not outperform random ordering on the HIGH arm's
      candidate set. Kills the triage architecture even if a survivor is found.
    - >-
      Survivors are all isogenous to the base (excursion is an artefact of
      dedup failure).
    - >-
      Every survivor's independence gate fails in exact arithmetic, i.e. the
      apparent rank was a numerical-regulator artefact.

  confounders:
    - >-
      LOAD-BEARING. The committed negative EV-ECRANK-b6c9b6 confounds three
      things: twist construction, rank-0 base (excursion size +5), and 0.11%
      coverage at conductor ~1e11. This proposal exists only to separate them.
      If the design does not hold base rank as the single varied factor, it
      re-measures the confound instead of resolving it.
    - >-
      Conductor grows with |D|, so the HIGH and CONTROL arms must be matched on
      conductor range, not only on candidate count, or the comparison measures
      conductor.
    - >-
      Analytic-rank-based ordering can be biased by the family's own root
      number distribution; twists split by sign of the functional equation and
      that split must be reported, not averaged over.

  interpretation_limits:
    - >-
      THIS IS NOT AN ECDLP ROUTE, and no result here may be reported as one.
      Mordell-Weil rank is undefined for E/F_p. The only bridge is the
      global-lift (xedni) family, and KN-LIT-021 establishes that its failure is
      driven by an ABSOLUTE COEFFICIENT BOUND on admissible relations, not by
      scarcity of high-rank curves -- so raising twist rank does not touch the
      binding constraint. The program's own function-field re-measurement of
      that same wall is KN-FIND-003 / KN-FIND-005. Any downstream record that
      cites this idea in an ECDLP context is misusing it.
    - >-
      A positive result raises rank above a FIXED base; it does not raise the
      generic rank of a Q(t) base, which is the constraint GOAL-ECQ-001
      measured as separating 13 from 28-30. This proposal therefore cannot be
      progress toward rank >= 31 over Q (open world record, 30, Alpoge-Howell
      2026) and must not be presented as such.
    - >-
      Any conclusion is scoped to the tested bases, the |D| range, the prime
      bound N in S(N), the descent implementation, and the stated budget.

  heuristic_assumptions:
    - id: H1
      statement: >-
        S(N) partial sums order twists by rank excess above the family floor
        with signal-to-noise sufficient to resolve a +1..+3 excursion at the
        tested conductor range.
      rigorous_support: >-
        Birch-Swinnerton-Dyer heuristics behind the Mestre-Nagao sum; the
        proved content is only the connection between a_p statistics and
        analytic rank under BSD, which is itself conjectural.
      validation_plan: >-
        Random-order control on the same candidate set; report ranking AUC and
        the measured per-rank signal against the 5.61-at-N=1000 figure recorded
        in EV-ECQ-0d142e OBS-10.
    - id: H2
      statement: >-
        The high-rank tail of a quadratic twist family is thin (Goldfeld-type
        behaviour), so absence at a given coverage is weak evidence of absence.
      rigorous_support: >-
        Not established here; pointer only (recalled citation above).
      validation_plan: >-
        Report coverage as numerator/denominator so that any null is
        interpretable as a bound on excursion frequency at that coverage,
        rather than as "no such twist exists".

  obstruction:
    statement: >-
      Mestre-Nagao triage over quadratic twists of RANK-0 bases did not surface
      any curve of rank >= 5.
    quantity: gated survivors of rank >= 5 per twists screened
    value: 0 of 364756 screened (400 per curve, 0.11%, gated by ellrank)
    scope: >-
      Five small-conductor rank-0 base curves, |d| <= 300000, primes to 1500,
      conductor ~1e11, excursion asked 0 -> +5. EV-ECRANK-b6c9b6.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the measurement is a calibrated statement
        about EXCURSION SIZE, and it is reusable as a preregistered null object
        rather than only as a discouragement. That is the resource this
        proposal takes: the control arm is already measured, so the incremental
        cost of the comparison is the high-rank arm alone.
      spawned_ids: []

  target_complexity:
    not_applicable_reason: >-
      This is a measurement proposal on a search pipeline, not a complexity
      claim. No exponent is asserted and none may be read into it.

  estimated_cost:
    implementation: low
    compute: medium
  compute_note: >-
    The triage stage is cheap and already implemented under GOAL-ECQ-001/002;
    the exact gate is the CPU-bound part and descent dominates. Sizing must
    respect the 2-producer ceiling recorded in GOAL-ECQ-002 campaign_budget.

  recommended_priority: low
  priority_rationale: >-
    LOW, stated against the proposer's interest. The architecture is right and
    the confound is real, but on GOAL-ECQ-002's own two axes this proposal
    helps neither: it cannot raise generic base rank (axis A1), and it is
    predicted to move the WRONG WAY on naive height, which is the metric the
    winnable ICARM r>=15 cell is scored on (axis A2). It is worth running only
    as a cheap confound-resolving control, or if the near-neighbour arm is
    substituted for the twist arm. Recorded rather than discarded because
    declining to search a plausible lead without measuring it is the failure
    mode docs/inventor-protocol.md treats as symmetric with overclaiming.
  dominated_by: >-
    GOAL-ECQ-002 axis A1 (replace the rank-8 Q(t) base with a base of generic
    rank > 8) dominates this proposal on the record axis. Axis A2
    (small-parameter specialisation for the ICARM height-relative cell)
    dominates it on the winnable-now axis.
  sota_delta: >-
    None claimed. Best case is a +1..+3 excursion over a base of rank <= 13,
    against a world record of 30 over Q. This proposal moves no exponent and
    takes no record.

  authority_note: >-
    PROPOSAL ONLY. This record approves nothing, freezes no protocol, creates no
    hypothesis or experiment, and changes no status. Specifying H-* / EXP-* and
    approving execution is Coordinator authority (AGENTS.md rule 1).
