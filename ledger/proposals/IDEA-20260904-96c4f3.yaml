  assumptions:
    - >-
      V is an F_2-subspace of F_{2^n}, so membership is a linear test. If the
      factor base is defined by any non-linear condition, (A)'s poly-memory
      property is lost and the memory row of (D) applies instead. This is the
      single load-bearing structural assumption and it is exactly the definition
      the frozen source uses.
    - >-
      Group operations are the counting unit on both sides. The SAT enumerator's
      unit is a leaf, the loop's unit is a curve addition plus a membership
      test; the domination claim of (B) is stated in each side's own natural
      unit and the CONVERSION between them is measured, never assumed, in the
      minimal test.
    - >-
      The decomposition probability is the conservation mean of KN-FIND-007.
      Deviations from it for structured targets are possible and are exactly
      what RQ-RELN-001 exists to measure; this record uses the mean and says so.
    - >-
      No claim is made that this factor-base family is the right one. The
      identity T_relations = m 2^n is about THIS construction.

  proof_search_map:
    bottleneck: >-
      The per-target pdp cost, and specifically its exponent in the factor-base
      size |B| = 2^l. Every complexity statement in this lane is
      (number of targets) x (per-target cost), the first factor is pinned by
      yield conservation (KN-FIND-007) and cannot be improved, so the ONLY
      movable exponent is the second. Naming the current value (|B|^{m-1}) and
      the value needed to reach rho (|B|^{1/2} at m = 3) is what turns this lane
      from benchmarking into a target.
    baseline_embedding:
      parameter_slice: >-
        m = 2. There the loop is a single pass over B with a membership test,
        costing 2^l operations, and the CNF-XOR core cube is 2^{2l}/2 - so the
        ratio 2^l/m = 2^l/2 is checkable by direct enumeration at l = 3, 4, 5
        where BOTH sides can be run to completion and both solution sets
        compared element by element. This is the exact old-method boundary: at
        m = 2 the summation polynomial S_3 is the familiar closed form and the
        whole apparatus degenerates to something enumerable, so agreement there
        is a genuine embedding, not a resemblance.
      reproduction_check: >-
        A frozen fixture at m = 2, l in {3,4,5} and m = 3, l in {3,4}: enumerate
        ALL decompositions of a fixed R by brute force over B^{m}, and require
        that (i) the loop of (A) returns exactly the same solution set as a
        multiset, and (ii) a complete solve of the descended CNF-XOR system
        returns the same projected solution set. Exact set equality, not counts.
        Additionally, the closed forms 2^{(m-1)l}/(m-1)! and 2^{ml}/m! are
        evaluated as integers and compared against the instrumented operation
        and leaf counters at those cells.
    observation_collision:
      observable: >-
        The set of m-multisets of factor-base points summing to R - i.e. the
        certificate set, which is what any pdp method must produce.
      distinct_preimage_search: >-
        The two methods are two preimages of the SAME observable by
        construction, which is the point: they must agree exactly on the
        certificate set, and any disagreement is a bug in one of them, exhibited
        as a named multiset. The collision hunted on the other side is a target
        R for which the algebraic model reports SAT but no valid certificate can
        be produced - i.e. a solution of the descended system whose x-values do
        not lift to points of E, or lift to points not summing to R. Such
        spurious solutions are a known hazard of Weil-descent models (the system
        constrains x-coordinates, not points), their density is measured here
        directly, and every claimed decomposition is re-verified by independent
        curve arithmetic per docs/claims-and-verification.md.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from the model where the hypothesis is "the descended Boolean
          system has a solution" to the model where it is an exact membership
          condition, x(R - P_1 - ... - P_{m-1}) in V, which is a rank-l GF(2)
          linear condition. Separate obligations: ENCODING (the two problems
          have the same solution set - proved by closure of B under negation and
          checked exactly at small cells); COMPLETENESS (every decomposition is
          reached - the loop is exhaustive over multisets); SOUNDNESS (every
          reported decomposition is a real one - certificate re-verification);
          TRANSFER (fails the moment V is not a subspace); COST LOSS (none: the
          reduction is strictly cheaper by 2^l/m operations).
        predicted_gain: >-
          A factor 2^l/m on the pdp operation count and a factor 2^l on the
          published relation-collection asymptotic, at unchanged memory. Not an
          attack; a corrected baseline.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure charging the whole pipeline in group operations
          only: relation collection m 2^n, linear algebra about m 2^{2l},
          verification 2^l, over the proved-disjoint blocks (targets tried,
          matrix operations, certificate checks). Charges are added only across
          blocks that do not share work.
        predicted_gain: >-
          The single number T_total(n, m, l) with every term named, against
          0.886 2^{n/2} for rho - the artifact RQ-ICEX-001 requires and that no
          record in this lane currently has for binary fields.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FORALL n prime, FORALL m >= 2, FORALL l with
      m(l-1) <= n, FORALL curves E/F_{2^n} with j != 0, FORALL targets R, the
      loop of (A) returns the complete set of m-multisets from B summing to R,
      in at most 2^{(m-1)l}/(m-1)! + O(2^l) group operations and O(poly(n,l))
      memory. That statement is UNCONDITIONAL and is a derivation, not a
      heuristic. The SEPARATE claim (C), T_relations = m 2^n, is
      HEURISTIC-CONDITIONAL: it holds on average over targets under the
      yield-conservation mean of KN-FIND-007 plus the Poisson assumption H1, and
      the two must never be conflated. Per docs/claims-and-verification.md the
      conditional claim and its heuristic support are separate records with
      separate identifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (i) an unconditional cost identity for the loop; (ii) a
        heuristic-conditional relation-collection identity; (iii) a Pareto table
        with four rows; (iv) an executed toy-scale confirmation at m in {2,3}
        and l <= 8 that the loop's operation count matches its closed form and
        that its certificate set equals the algebraic method's. IT CANNOT
        certify that index calculus over binary fields cannot beat rho - that is
        a universal impossibility claim, forbidden by
        docs/claims-and-verification.md at every tier and belonging to
        open-problems. It cannot certify anything about non-subspace factor
        bases, about prime fields, about m large, or about quantum costs.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE HOPED-FOR CONCLUSION FAILS, and the
        reason (F) exists: the SAME pdp with V replaced by a factor base of the
        same size 2^l defined by a NON-linear condition (e.g. an arbitrary
        random subset of x-coordinates). There the membership test needs a table
        and the loop's memory becomes 2^l, so the poly-memory domination of (B)
        evaporates while every other feature is unchanged. A method that cannot
        distinguish those two factor bases has not identified the load-bearing
        structure, which is LINEARITY OF MEMBERSHIP and nothing else. Running
        both is cheap and is in the design.
    proof_obligations:
      - claim: >-
          B is closed under negation, so enumerating multisets of m-1 points and
          testing the residual finds every signed decomposition.
        responsibility: correctness
      - claim: >-
          Membership x in V is a rank-l GF(2) linear test costing O(n) with a
          precomputed dual basis.
        responsibility: feasibility
      - claim: >-
          The loop's operation count is 2^{(m-1)l}/(m-1)! + O(2^l), measured by
          an instrumented counter and matched to the closed form.
        responsibility: runtime
      - claim: >-
          The loop's memory is O(poly(n,l)), measured as peak RSS and shown not
          to grow with 2^l.
        responsibility: memory
      - claim: >-
          The loop's certificate set equals the algebraic method's at every
          brute-forceable cell.
        responsibility: correctness
      - claim: >-
          T_relations = m 2^n given the conservation mean; and the derivation is
          heuristic-conditional and labelled as such.
        responsibility: success_probability
      - claim: >-
          The forward condition c = 1 - m/(2(m-1)) is derived correctly from
          n(1 - (1-c)(m-1)/m) = n/2 at l = n/m.
        responsibility: strictness
      - claim: >-
          Nothing here asserts an impossibility; the scope excludes non-subspace
          bases, prime fields, and untested m.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        loop_operation_ratio = (instrumented curve additions + membership tests
        by the loop) / (2^{(m-1)l}/(m-1)!), at m in {2,3}, l in {4,...,8}
      direction: different
      minimum_effect: >-
        In [0.95, 1.1]. A ratio far above 1 means the implementation is not the
        algorithm analysed.
    - metric: >-
        certificate_set_equality between the loop and a complete solve of the
        descended CNF-XOR system, at m in {2,3}, l in {3,4}
      direction: different
      minimum_effect: >-
        Exact multiset equality at every tested target. Any disagreement is a
        bug in one method and must be localised to a named multiset before
        anything else is reported.
    - metric: >-
        operation_domination_ratio = (instrumented leaves of the complete
        core-cube enumerator) / (instrumented loop operations), same instances
      direction: higher
      minimum_effect: >-
        >= 0.5 * 2^l/m, i.e. within a factor 2 of the predicted 2^l/m. A ratio
        below 1 would mean the enumerator is actually cheaper in operations and
        the whole domination claim is wrong.
    - metric: >-
        wall_clock_crossover_l = the smallest l at which the loop's wall clock
        is below the SAT enumerator's on matched instances, same machine, same
        session, pinned versions
      direction: lower
      minimum_effect: >-
        <= 6. THIS IS THE PREDICTION MOST LIKELY TO FAIL: a curve addition costs
        far more than a propagation step, so the operation-count domination may
        not become a wall-clock domination until larger l. If the crossover is
        above 8, the honest conclusion is that the domination is OPERATION-COUNT
        ONLY at tested scale, and the record must say exactly that.
    - metric: >-
        c_leaf_over_c_eval = (seconds per leaf of the SAT enumerator) /
        (seconds per point of a Gray-code exhaustive evaluator over the same
        descended system), same machine, same session
      direction: higher
      minimum_effect: >-
        > m! = 6 at m = 3. The SAT enumerator beats exhaustive search on this
        model IF AND ONLY IF this ratio is below m!, since exhaustive search
        visits 2^{ml} points and the enumerator 2^{ml}/m! leaves. A measured
        ratio below 6 would mean the SAT route is genuinely the better of the
        two, which is the source's untested claim finally tested - and would be
        a positive result for the SAT direction.
    - metric: >-
        spurious_solution_rate = fraction of solutions of the descended system
        that fail independent certificate re-verification
      direction: lower
      minimum_effect: >-
        Reported per cell with a binomial confidence interval. A nonzero rate is
        not a failure of the algebraic method but a cost the method carries and
        that no comparison may omit; a rate above 0.1 would change the effective
        per-target cost of the algebraic route materially.
    - metric: >-
        nonlinear_base_memory = peak RSS of the loop on the non-subspace
        factor-base control at matched 2^l
      direction: higher
      minimum_effect: >-
        Grows proportionally to 2^l, confirming that linearity of membership -
        not the loop - is the load-bearing ingredient.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT ALONE DELIVERS THE PARETO TABLE). Evaluate
      the four frontier rows of (C)-(D) and the forward condition of (E) as
      exact expressions for m in {2,3,4} and n in {59, 89, 127, 163, 233}, with
      every term named and the cost model stated (unit = one group operation on
      E(F_{2^n}); membership test = one rank-l GF(2) projection; linear algebra
      = m 2^{2l} by Wiedemann). Commit the table BEFORE any run. This is the
      artifact docs/target-result-profile.md A8 requires and RQ-ICEX-001's
      contract requires, and it costs nothing.

      STAGE 1 (CORRECTNESS, BRUTE-FORCEABLE). m = 2 at l in {3,4,5} and m = 3 at
      l in {3,4}, n in {11, 13, 17}: build B from make_V_subspace, enumerate ALL
      decompositions of each target by exhaustive search over B^m, run the loop,
      and run a complete solve of the descended CNF-XOR system. Require exact
      multiset equality of the three solution sets. Every claimed decomposition
      re-verified by independent curve arithmetic; a failed certificate makes
      the run invalid_measurement, never a negative observation.

      STAGE 2 (THE DOMINATION MEASUREMENT). m = 3, l in {6, 7, 8}, n in
      {3l-1, 4l}, 10 planted-decomposable and 10 random targets per cell, >= 3
      seeds. Run three methods on the SAME targets: the loop of (A); the
      complete core-cube enumerator (the harness DPLL of
      IDEA-20260904-3c7a91); and a Gray-code exhaustive evaluator over the same
      descended system. Record instrumented operation counts for each in its own
      unit, wall clock with pins, peak RSS, and the certificate outcome. Report
      SAT and UNSAT separately.

      STAGE 3 (THE STRUCTURAL CONTROL). Repeat one cell with a NON-SUBSPACE
      factor base of the same size, confirming that the loop's memory becomes
      2^l and that its time is unchanged. This isolates linearity of membership
      as the load-bearing ingredient and is what makes (F) a measurement rather
      than a caveat.

      STAGE 4 (THE CHARGED ROW, ANALYTIC ONLY). Combine stage-2 measured
      per-target costs with the conservation mean of KN-FIND-007 to produce a
      measured-constant version of T_relations at the tested cells, and compare
      to a matched rho baseline computed on the same curves. NOTE THIS IS TOY
      SCALE AND SETTLES NOTHING AT CRYPTOGRAPHIC SIZE; it is the executed
      instance of the stage-0 table, per validation-ladder step 2 of
      docs/inventor-protocol.md section 6.
    controls:
      - >-
        BRUTE-FORCE ORACLE CONTROL (stage 1) - the true solution set. Any method
        disagreeing with it is wrong and is fixed before stage 2.
      - >-
        NON-SUBSPACE FACTOR-BASE CONTROL (stage 3) - isolates membership
        linearity; the loop's memory must grow there.
      - >-
        MATCHED RHO CONTROL (stage 4) - a Pollard rho / VW run on the SAME
        curves at the SAME n, so the comparison is not against a literature
        constant. Required by the RQ's own constraint list.
      - >-
        SPURIOUS-SOLUTION CONTROL - every algebraic-method solution independently
        certificate-checked; the failure rate is a reported metric, not an
        assumption.
      - >-
        UNIT-CONVERSION CONTROL - the operation-count domination and the
        wall-clock comparison are reported separately, and the measured
        seconds-per-operation of each method is reported so a reader can
        re-convert.
      - >-
        NULL-TARGET CONTROL - random (usually non-decomposable) targets included
        in equal number, since the UNSAT profile is where the two methods differ
        most and pooling them would be a composition artifact.
    required_metrics:
      - loop_operation_count (curve additions, membership tests, separately)
      - enumerator_instrumented_leaf_count
      - gray_code_evaluation_count
      - seconds_per_unit for each method (pinned version, commit, hardware, seed)
      - peak_rss_mb per method
      - certificate_verified and spurious_solution_rate
      - matched_rho_group_operations on the same curve
      - factor_base_kind (subspace | nonsubspace), m, l, n, seed, target_kind
      - termination_reason (completed | timeout | memory_abort | crash)

  falsification_conditions:
    - >-
      F1. The loop's certificate set differs from the brute-force oracle's at
      any stage-1 cell. The algorithm as stated is incomplete or unsound; the
      offending multiset is exhibited and the claim withdrawn.
    - >-
      F2. operation_domination_ratio < 1 at any cell. The domination claim (B)
      is false - the more important outcome, since it would mean the algebraic
      route is genuinely competitive on operations and the whole framing of this
      record is wrong.
    - >-
      F3. loop_operation_ratio outside [0.95, 1.1]. The implementation is not
      the analysed algorithm and no cost conclusion may be drawn from it.
    - >-
      F4. c_leaf_over_c_eval < m!. Exhaustive search does NOT dominate the SAT
      enumerator on this model, the source's untested libFes comparison resolves
      in the SAT approach's favour, and that is a positive result for the SAT
      direction which this record would have found by trying to kill it.
    - >-
      F5. wall_clock_crossover_l > 8. The domination is operation-count only at
      tested scale; the record reports exactly that and does not claim a
      wall-clock advantage.
    - >-
      F6. The non-subspace control shows the loop still running in poly memory.
      The mechanism attribution is wrong - membership linearity is not what is
      doing the work - and the reason must be found before (F) is stated.
    - >-
      F7 (PRE-REGISTERED NEGATIVE). If the loop wins as predicted, that is NOT a
      result about ECDLP. The deliverable is the four-row Pareto table, the
      measured constants, the |B|^{3/2} forward condition, and the explicit
      statement that the family remains a factor about 3.4 * 2^{n/2} above rho.
      A record that reports the win without the gap has misrepresented it.

  confounders:
    - >-
      UNIT MISMATCH is the central confounder: leaves, curve additions and
      Gray-code evaluations are different units with different costs, and a
      naive comparison of raw counts is meaningless. Handled by reporting counts
      in native units, seconds per unit separately, and the conversion
      explicitly.
    - >-
      IMPLEMENTATION QUALITY. A hand-written Sage loop against a compiled SAT
      solver is not a fair wall-clock comparison. This is why the primary claim
      is on operation counts, and why the wall-clock crossover is reported as a
      property of THESE implementations, named and pinned.
    - >-
      SPURIOUS SOLUTIONS of the descended system (x-coordinates that do not lift
      to points, or lift to points not summing to R) inflate the algebraic
      method's effective cost. Measured, not assumed away, and reported as part
      of that method's cost rather than as a defect.
    - >-
      THE m! IN THE MULTISET COUNT is not exact when points coincide; at small l
      the coincidence density O(m^2 2^{-l}) is non-negligible (about 14% at
      l = 6, m = 3 by that estimate) and both closed forms are reported.
    - >-
      YIELD CONSERVATION (KN-FIND-007) is a statement about the MEAN. Coverage,
      not mean, governs one-relation-per-target harvesting, and the bounded gain
      <= 1.582 is carried explicitly rather than dropped.
    - >-
      LINEAR ALGEBRA is charged with a Wiedemann/Lanczos estimate, not measured
      here. That term is m 2^{2l} = 2^{2n/3} at l = n/3 and is already above the
      rho baseline on its own; it is flagged as an ESTIMATE and routed to
      RQ-ICEX-001 rather than claimed.
    - >-
      A comparison against Grobner is IMPOSSIBLE in this repository: Magma's F4
      is not available per the source freeze. No Grobner row is measured and the
      source's Grobner column is not cited as a measurement here.

  interpretation_limits:
    - >-
      NO UNIVERSAL IMPOSSIBILITY IS CLAIMED OR MAY BE READ OUT OF THIS RECORD.
      "Index calculus over binary fields cannot beat rho" is exactly the kind of
      statement docs/claims-and-verification.md forbids at every tier. What is
      claimed is a cost identity for ONE factor-base construction and ONE
      decomposition method, plus a stated condition (E) under which the family
      WOULD beat rho.
    - >-
      CLAIM TIER toy for everything executed (n <= 32 bits); the identities of
      (B)-(E) are arithmetic derivations, labelled derivation, and are not
      elevated by any measurement.
    - >-
      THE LOOP IS ALMOST CERTAINLY FOLKLORE. Novelty is not claimed for the
      algorithm; it is claimed, weakly and as unverified, only for the specific
      exponent comparison against the published Theorem 1 and for the |B|^{3/2}
      forward condition. A reviewer with retrieval should check Gaudry, Diem,
      Galbraith-Gebregiyorgis and Karabina before this record is cited as new.
    - >-
      NOTHING TRANSFERS TO PRIME FIELDS, to small-degree extensions with large
      base field (where the enumeration is the expensive direction and the
      algebraic route exists for exactly that reason), or to non-subspace factor
      bases.
    - >-
      This record does not close RQ-SATIC-1ae57a. It supplies the baseline
      against which that question's decision_target part (c) - "large enough to
      survive full charging against matched rho" - is to be answered, and the
      answer it predicts is no, with the margin stated.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DECOMPOSITION PROBABILITY. For a uniformly random target R in
        E(F_{2^n}) and B the set of points with x in an l-dimensional subspace
        V, the probability that R is a sum of m elements of B equals
        P = 2^{ml}/(m! 2^n) (1 + o(1)), uniformly for m(l-1) <= n and m fixed.
      rigorous_support: >-
        RIGOROUS INGREDIENT: KN-FIND-007's conservation identity - the total
        number of size-m multisets from a base of size |B| is exactly
        C(|B|+m-1, m), and each sums to exactly one target, so the MEAN number
        of decompositions per target is exactly C(|B|+m-1, m)/N with no
        dependence on the base's geometry. That is a proved double count, not an
        estimate. CLASSICAL DISTRIBUTION IMITATED: the Poisson/occupancy law -
        the assumption that the number of decompositions of a given target
        behaves like a Poisson variable with that mean, so that
        P(at least one) = 1 - e^{-mu} and, in the sparse regime mu << 1 relevant
        here, P = mu(1 + o(1)). This is the same assumption Diem's analysis
        makes and the frozen source cites; its failure mode is CONCENTRATION -
        additive structure in V creating repeated sums, which KN-FIND-007
        measures directly (a small-multiples base collapsing to coverage ratio
        0.0021 while its concentration statistic reached 1224x). Since V IS an
        additive subgroup, this failure mode is not hypothetical here and is the
        main reason H1 must be measured rather than assumed.
      validation_plan: >-
        SAMPLE: the empirical decomposition count per target. At n in
        {11, 13, 17, 19} and l = ceil(n/3), enumerate ALL C(|B|+2,3) triples of
        factor-base points by brute force, bin them by target, and obtain the
        EXACT distribution of decomposition counts over the whole group - not a
        sample, the entire distribution, which is affordable for |B| <= 2^7.
        SHORTCUT FOR LARGER PARAMETERS: at l up to 10 the pair-sum table is
        buildable (2^{20} entries), so the exact distribution of the number of
        pair sums per target is obtainable at m = 2, and the m = 3 distribution
        is estimated by sampling 10^6 random targets and running the loop of (A)
        on each - O(10^6 2^{2l}) which is affordable to l = 8. COMPARISON
        DISTRIBUTION: the empirical count distribution is compared against the
        Poisson(mu) prediction with mu = C(|B|+2,3)/N, by chi-squared on the
        count histogram, and the coverage (fraction of targets with at least one
        decomposition) is compared against 1 - e^{-mu} and against the
        conservation bound coverage <= min(1, mu). TAIL CHECKS: report the
        MAXIMUM number of decompositions any single target admits and compare
        against the Poisson tail; a heavy upper tail is the signature of the
        additive-structure concentration KN-FIND-007 warns about, and it would
        mean coverage is materially below mu and the target count in (C) is an
        underestimate. SAMPLED PARAMETERS RECORDED: (n, l, m, curve_id, seed,
        basis alpha, |B| measured not assumed). TRANSFER ASSUMPTIONS, STATED:
        results at n <= 19 exact and n <= 32 sampled are assumed to indicate the
        behaviour at cryptographic n only through the conservation identity,
        which is exact at every n, and NOT through the Poisson half, which is
        checked only at toy scale.
    - id: H2
      statement: >-
        SIGN AND LIFT REGULARITY. For an l-dimensional subspace V, the number of
        points of E(F_{2^n}) with x-coordinate in V is 2^l (1 + o(1)) - i.e.
        about half the elements of V are x-coordinates of points and each
        contributes two points - uniformly over curves with j != 0 and over
        admissible V.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for each x != 0 the equation
        y^2 + xy = x^3 + ax^2 + b has 0 or 2 solutions according to the absolute
        trace of (x^3 + ax^2 + b)/x^2, an exact criterion; so
        |B| = 2 #{x in V : Tr(...) = 0}. CLASSICAL DISTRIBUTION IMITATED: the
        assumption that this trace is equidistributed over V, i.e. that V is not
        special with respect to the curve - the standard Weil-type
        equidistribution heuristic, whose rigorous form for a subspace of
        dimension l ~ n/3 is not available and is exactly the gap. FAILURE MODE:
        a subspace correlated with the trace form could make |B| materially
        larger or smaller than 2^l, which shifts every cost in (B)-(E) by the
        same factor and would show up first as a mismatch between the closed
        forms and the instrumented counts.
      validation_plan: >-
        SAMPLE: |B| measured directly by enumeration, for every (n, l, curve,
        basis) cell in the design - this is free, since the factor base is built
        anyway by make_V_subspace and lift_x. COMPARISON DISTRIBUTION: the
        measured |B| against 2^l, and the per-cell ratio against a binomial
        model for the number of trace-zero elements in V. TAIL CHECKS: report
        the minimum and maximum |B|/2^l over all cells and over >= 20 random
        subspaces V at one (n, curve); an outlier subspace is exhibited and its
        trace structure examined rather than averaged away. SCALE: n <= 32
        exactly. TRANSFER: none claimed beyond the tested n; the record uses the
        MEASURED |B| in every cost comparison rather than 2^l, so a failure of
        H2 changes the constants and not the exponents.

  target_complexity:
    time_exponent: >-
      pdp step, per target, poly memory: 2^{(m-1)l}/(m-1)! group operations -
      i.e. |B|^{m-1}/(m-1)!, an EXPONENT of (m-1)l against the ml of any
      complete core-cube enumerator, a strict improvement of l in the exponent.
      Relation-collection phase, heuristic-conditional on H1: m * 2^n group
      operations at poly memory, independent of l and m - against the frozen
      source's published Theorem 1 of Otilde(2^{n+l}) = Otilde(2^{(1+1/m)n}) at
      l = n/m. So the exponent for this family moves from (1 + 1/m)n to n.
      Memory-assisted row: Otilde(2^{2n/3}) time at m = 3.
    memory_exponent: >-
      O(poly(n, l)) for the loop and for the enumerator - both are poly-memory,
      which is why (B) is a strict Pareto domination rather than a trade. The
      precomputed-table variant is 2^{(m-1)l} = 2^{2n/3} at m = 3, l = n/3, and
      is reported as a separate frontier row precisely so it is not confused
      with the poly-memory one. The matrix step needs 2^l m words for the sparse
      relation matrix, which is negligible beside either.
    best_known: >-
      Pollard rho / van Oorschot-Wiener: about 0.886 * 2^{n/2} group operations,
      negligible memory, linear parallel speedup on w processors and the
      standard time-memory interpolation. Every row above remains a factor about
      3.4 * 2^{n/2} (poly-memory) or 2^{n/6} (table variant) worse. Within the
      binary index-calculus family, the best previously recorded row this agent
      could find is the frozen source's own Theorem 1, Otilde(2^{n+l}), and
      Faugere-Perret-Petit-Renault's Otilde(2^{omega n/2 + l}) which the source
      cites for comparison.
    hidden_overhead: >-
      The Otilde in T_relations = m 2^n hides the O(n^2) or O(n) cost of one
      GF(2) membership test and the cost of one curve addition, i.e. a
      polynomial in n; nothing superpolynomial hides anywhere, which is a real
      difference from the exemplar profile's p^{o(1)} and is stated rather than
      glossed. What DOES hide is (i) the spurious-solution rate of the algebraic
      comparison arm, measured here; (ii) the constant in the Wiedemann estimate
      for the matrix step, which is not measured here and is routed to
      RQ-ICEX-001; and (iii) the Poisson half of H1, which is exactly the term
      that could make the target count larger than m! 2^{n-(m-1)l} if V's
      additive structure concentrates sums.
    tradeoff_note: >-
      The frontier is explicitly four-rowed and the tradeoff is real: poly
      memory at 2^n, or 2^{2n/3} memory at 2^{2n/3} time. Parallelisation: the
      loop is embarrassingly parallel over the outer index with no shared state
      and linear speedup; rho parallelises by van Oorschot-Wiener to
      sqrt(pi N/4)/w with distinguished points, so parallelism does not change
      the ordering. The forward condition (E) is itself a time-memory statement
      in disguise: a per-target cost of |B|^{1/2} at m = 3 is below the size of
      the factor base, so any algorithm attaining it must consult a preprocessed
      structure, which means the poly-memory column of the frontier is not where
      such an algorithm could live - and identifying what that structure could
      be is the single most valuable open direction this record produces.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  implementation_notes: >-
    The cheapest of the five by a wide margin. Stage 0 is pure integer
    arithmetic and needs nothing. Stage 1 and the loop itself need only what
    src/semaev_tree.py already provides - build_field_and_curve,
    make_V_subspace, gen_decomposable_R, gen_random_R - plus about 40 lines for
    the loop, the dual-basis membership test and the certificate verifier. The
    only NEW heavy dependency is the comparison arm (the CNF-XOR encoder and
    enumerator), which is shared with the other four proposals and can be
    deferred: stages 0, 1 (loop and brute-force oracle only), 3 and the H1/H2
    validations are all runnable TODAY with no encoder and no solver. That is
    why this record is recommended for immediate execution even though its
    headline is a negative for the lane it sits in.

  dominated_by: >-
    Pollard rho / van Oorschot-Wiener at about 0.886 * 2^{n/2} group operations
    with negligible memory, which dominates every row proposed here on both time
    and memory at every n considered. Stated flatly: THIS RECORD PROPOSES AN
    ALGORITHM THAT IS DOMINATED, and its value is the corrected baseline, not
    the algorithm. Checked against every frontier row this program records for
    the binary pdp and for binary ECDLP: the frozen source's Theorem 1
    (Otilde(2^{n+l}) - dominated BY this record on time at equal memory);
    Faugere-Perret-Petit-Renault Otilde(2^{omega n/2 + l}) as cited by the
    source (dominated by this record for omega > 2 at l = n/m); Grobner F4 as
    reported in claim C5/C6 (memory > 200GB at l = 8, not reproduced here);
    generic and XOR-aware CDCL (source Table 2 and the CP 2020 slide); Gray-code
    exhaustive search / libFes and the Joux-Vitse crossbred algorithm (named by
    the source as untested, and measured here in stage 2); KN-FIND-2a8b7e and
    KN-FIND-8f2c90 (BKK sparse Semaev, prime field, constant factor 3-5x - a
    different field and a different step, so not comparable and not counted).
    Not null.

  sota_delta: >-
    Quantitatively, three numbers. (i) On the pdp step at matched poly memory:
    2^l/m fewer operations than any complete core-cube enumerator - 21.3x at
    l = 6, 85.3x at l = 8, 683x at l = 11, m = 3. (ii) On the published
    relation-collection asymptotic for this factor base: Otilde(2^n) against the
    frozen source's Theorem 1 of Otilde(2^{n+l}), a factor 2^{n/m}. (iii)
    Against the generic baseline: still worse by a factor about 3.4 * 2^{n/2},
    which is about 2.6 * 10^9 at n = 59 - so the source's reported "up to 300x"
    on the pdp, even taken at face value on the authors' hardware, closes about
    8.2 of the 31.2 bits of that gap. The forward condition is the fourth
    number: a per-target pdp cost of |B|^{1/2} instead of |B|^2 at m = 3 - a
    |B|^{3/2} improvement - would tie rho. sota_delta on actual attack
    capability: zero.

  honest_prior_of_survival: >-
    About 0.95 that the loop is correct and that (B) holds as arithmetic - it is
    a two-line algorithm and a division. About 0.9 that (C)'s identity is right
    given H1. About 0.85 that the operation-count domination is confirmed
    experimentally. About 0.4 that it becomes a WALL-CLOCK domination at l <= 8,
    which is the prediction most likely to fail and the reason the record
    separates the two axes. About 0.25 that the c_leaf/c_eval test comes out
    FAVOURING the SAT enumerator (ratio < 6), which would be the one positive
    outcome for the lane. About 0.15 that any of this is genuinely novel rather
    than folklore, which is why novelty_status is unverified and why a reviewer
    with retrieval is asked to check Gaudry, Diem, Galbraith-Gebregiyorgis and
    Karabina before it is cited.
