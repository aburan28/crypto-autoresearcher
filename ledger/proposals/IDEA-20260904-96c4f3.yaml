idea:
  id: IDEA-20260904-96c4f3
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SATIC-1ae57a
  title: >-
    Charge the pdp honestly - a subspace factor base makes membership a GF(2)
    linear test, so an (m-1)-fold loop solves the pdp in 2^{(m-1)l}/(m-1)!
    group operations at poly memory, a factor 2^l/m below any complete
    enumerator of the ml core cube; relation collection then costs m*2^n
    independently of l and m, and beating rho needs a pdp oracle at |B|^{1/2}

  class: algorithm

  claim: >-
    SCOPE: binary elliptic curves over F_{2^n}, n prime, factor base
    B = {(x,y) in E(F_{2^n}) : x in V} for V an l-dimensional F_2-subspace,
    m-fold point decomposition, m in {2,3,4}, l in 3..11 for the analytic part
    and l in 3..8 for the executed part. CLAIM TIER toy for anything measured;
    the cost identities are arithmetic and are labelled derivation, never proof.
    NO ATTACK ON ANY DEPLOYED SYSTEM. NO CLAIM THAT INDEX CALCULUS BEATS
    ANYTHING.

    (A) THE ALGORITHM, WHICH IS TWO LINES AND USES NO POLYNOMIAL SYSTEM. To
    decide whether a target R decomposes as R = P_1 + ... + P_m with all
    P_i in B: enumerate the (m-1)-element multisets {P_1, ..., P_{m-1}} from B,
    compute S = R - P_1 - ... - P_{m-1}, and test whether x(S) lies in V. The
    membership test is a GF(2) LINEAR test - V is a subspace, so it is a rank-l
    projection costing O(n^2) bit operations, or O(n) with a precomputed dual
    basis. Cost:
        2^{(m-1)l}/(m-1)!  curve additions and membership tests,
        O(poly(n, l))      memory.
    Completeness is exact: B is closed under negation (both y-roots of each
    admissible x are in B), so every decomposition with any sign pattern is
    found.

    (B) THE DOMINATION STATEMENT, AT MATCHED POLY MEMORY. Any complete
    enumerator of the ml-variable core cube - which is what the CNF-XOR
    summation-polynomial model reduces the pdp to, since Proposition 1 of
    SRC-SATIC-TRIMOSKA-2019 fixes the backdoor at exactly ml variables and the
    section-5 bound is 2^{ml}/m! - visits
        2^{ml}/m!  leaves.
    The ratio is
        (2^{ml}/m!) / (2^{(m-1)l}/(m-1)!) = 2^l / m,
    i.e. 2^l/m FEWER operations for the loop, at the same asymptotic memory:
    21.3x at l = 6, m = 3; 85.3x at l = 8; 683x at l = 11. This is a strict
    Pareto domination on the operation axis with no memory concession, and it
    holds for every m >= 2 and every l.

    (C) THE END-TO-END IDENTITY, WHICH IS THE RECORD'S MAIN DELIVERABLE. Under
    the standard heuristic decomposition probability
    P = 2^{ml}/(m! 2^n) - which KN-FIND-007 shows is not merely an estimate but
    the EXACT conservation mean for a factor base of size 2^l, so no factor-base
    redesign can raise it at matched size - the relation-collection phase needs
    2^l/P = m! 2^{n-(m-1)l} targets, each costing 2^{(m-1)l}/(m-1)! by (A).
    The product is
        T_relations = m * 2^n     group operations, poly memory,
    INDEPENDENT OF BOTH l AND m. Compare the published Theorem 1 of the frozen
    source, Otilde(2^{n+l}), which at l = n/m is Otilde(2^{(1+1/m)n}): the loop
    is a factor 2^l = 2^{n/m} cheaper, an EXPONENT-level statement about the
    published complexity, obtained with no new mathematics.
    Compare Pollard rho / van Oorschot-Wiener at about 0.886 * 2^{n/2} group
    operations with negligible memory: the loop is still a factor about
    3.4 * 2^{n/2} MORE expensive. So this record improves the published exponent
    for this family from (1 + 1/m)n to n and leaves it a full n/2 above the
    generic baseline - which is exactly the source's own qualitative conclusion,
    now with the arithmetic written down.

    (D) THE MEMORY-ASSISTED FRONTIER ROW, FOR COMPLETENESS. Precomputing the
    table of all (m-1)-fold sums once, keyed by point, gives per-target cost
    2^l lookups and total m! 2^{n-(m-1)l} * 2^l group operations with
    2^{(m-1)l} memory; at m = 3 and l = n/3 that is Otilde(2^{2n/3}) time and
    Otilde(2^{2n/3}) memory. Better in time than (C), worse in memory, and still
    above 2^{n/2}. The four-row frontier for this factor base is therefore
        SAT/Grobner over the ml core cube : time 2^{(1+1/m)n},  memory poly
        (m-1)-fold loop                   : time 2^{n},         memory poly
        precomputed-table variant         : time 2^{2n/3},      memory 2^{2n/3}
        Pollard rho / VW                  : time 2^{n/2},       memory poly
    and every future pdp record in this program must place itself on it.

    (E) THE FORWARD CONDITION, STATED AS AN EXPONENT. Suppose a pdp oracle costs
    2^{c(m-1)l} per target for some c <= 1. Then
    T_relations = m! 2^{n - (1-c)(m-1)l}, minimised at the largest admissible
    l = n/m, giving exponent n(1 - (1-c)(m-1)/m). Setting that equal to n/2
    gives c = 1 - m/(2(m-1)); at m = 3 this is c = 1/4, i.e. a pdp oracle
    costing 2^{2l/4} = 2^{l/2} = |B|^{1/2} per target would TIE Pollard rho, and
    anything faster would beat it. The current best (A) is |B|^{m-1} = |B|^2.
    SO THE GAP THIS FAMILY MUST CLOSE IS A FACTOR |B|^{3/2} ON THE PDP, at
    m = 3, at poly memory. That number - 3/2 in the exponent of the factor-base
    size - is the honest target this RQ should be measured against, and no
    constant-factor or log-cofactor improvement can reach it.

    (F) THE ONE PROPERTY THE SAT APPROACH KEEPS. The loop of (A) needs the
    factor base to be a SUBSPACE so that membership is linear. Against a factor
    base with no such structure - and against the pdp posed abstractly, where
    membership is a set lookup costing memory 2^l - the loop still works but its
    memory is 2^l rather than poly. That is the only regime in which the
    summation-polynomial route has an argument at these parameters, and it is
    named here rather than suppressed.

  mechanism: >-
    WHY THE FACTOR BASE'S OWN DEFINITION DEFEATS THE ALGEBRAIC ROUTE. The whole
    summation-polynomial apparatus exists to answer "is there a tuple in V^m
    summing to R" without enumerating V^m. Over small-degree extensions with a
    large base field q, that is essential: the factor base has size about q and
    enumerating m-1 of them costs q^{m-1}, which is enormous. Over F_{2^n} with
    n prime the situation inverts: the factor base is defined as the points
    whose x-coordinate lies in an l-DIMENSIONAL F_2-SUBSPACE, and "lies in a
    subspace" is a rank-l linear condition testable in O(n) word operations.
    One of the m unknowns can therefore be eliminated for free, by solving for
    it on the curve and testing membership, instead of being carried through a
    Weil descent as l Boolean variables. That removes l of the ml core
    variables, and 2^l of the search space, at zero cost.

    Stated as the object being tracked: the summation-polynomial route tracks
    the BOOLEAN COORDINATE VECTOR of all m points simultaneously; the loop
    tracks the PARTIAL POINT SUM S_k = R - P_1 - ... - P_k, an element of
    E(F_{2^n}). The lossy-projection test applies to the second and is the
    reason it is a different object rather than a re-encoding. S_k is a
    genuinely lossy projection of the search state: it discards which
    P_1, ..., P_k produced it - the fibre over a given S_k has size about
    2^{kl}/k! - and it discards every coordinate of every individual summand.
    What it discards is discarded COMPATIBLY with the target's operation,
    because the operation being iterated is group addition, and
    S_{k+1} = S_k - P_{k+1} depends only on S_k and on the new summand: the
    retained part propagates deterministically, exactly and with no loss of
    determinism, which is the compatibility the test demands. The final test,
    "x(S_{m-1}) in V", is a linear predicate on the retained object. Contrast
    the projection that FAILS the test: the vector of core variables (c_{i,j})
    itself, which by Proposition 1 determines every other variable in the
    CNF-XOR model - it loses nothing, is a change of coordinates on V^m, and
    that is precisely why the SAT search over it is a complete enumeration of
    V^m with extra steps.

    WHY THIS IS AN HONESTY RECORD AND NOT A BREAKTHROUGH. Nothing in (A) is
    difficult and it is very likely folklore; the reason it belongs in the
    ledger is docs/inventor-protocol.md section 5, which requires every
    deliverable to name the best-known result that dominates it in the Pareto
    sense. This program has no such row for the pdp, the frozen source states
    none, and without one every "300x faster on the pdp" statement is
    uninterpretable. KN-TECH-071 records the corpus's canonical example of what
    happens when a solving-cost claim is made without that row.

  novelty_status: unverified

