  deterministic_generators:
    integer_convention: >-
      All indices and counters are unsigned integers; signed eta uses canonical
      decimal -4,0,4. Seed fields are UTF-8 with literal vertical bars.
      SHAKE256 bytes and bit prefixes are big-endian. Modulus sampling reads
      successive 64-bit words and rejects values at or above the largest
      multiple below 2^64; list streams additionally reject duplicates already
      accepted in that list. Every accepted-word index is retained.
    domain_separation_rule: >-
      Every literal prefix below is distinct and begins with this successor ID.
      No XOF state, byte offset, accepted-word index, seed, generated list, bit,
      selected-pair table, rank value, or bootstrap index is reused across
      prefixes or distinct complete keys. A compiler rejects a missing tuple
      field, out-of-range field, duplicate complete key, or prefix collision.
    rank_primitive:
      bytes_per_key: 32
      interpretation: unsigned_big_endian_uint256
      sort_order: ascending_by_pair_rank_then_numeric_object_id
      tie_break: numeric_object_id_ascending
      xof_consumption: >-
        Squeeze exactly the first 32 bytes from a fresh SHAKE256 state for each
        complete rank key and close the state. No rejection or additional byte
        is permitted, including on a tie.
    domains:
      treatment_canonical_root: >-
        IDEA-20260809-c4ecac|treatment-canonical-root-v3|bits=<18|21|24|27|30>|
        curve=<00..31>|root=<000..255>|component=<a|b|z|list-0|list-1|list-2|list-3>
      treatment_model_derived_record: >-
        IDEA-20260809-c4ecac|treatment-model-derived-v3|bits=<18|21|24|27|30>|
        curve=<00..31>|root=<000..255>|model=<0..3>|component=<Q-prime|list-0|list-1|list-2|list-3>
      treatment_model_derived_semantics: >-
        This is a record-identity domain, not an XOF domain. Model 0 is the
        canonical bytes. Models 1..3 apply the frozen curve model phi_u to the
        same canonical Q-prime and list points. It creates no new a,b,z,scalar,
        or list draw.
      selector_control: >-
        IDEA-20260809-c4ecac|selector-control-v4|arm=<CTRL-BALANCED-ANTISYMMETRIC|CTRL-PLANTED-GAMMA-1-6|CTRL-PLANTED-GAMMA-5-18|CTRL-PLANTED-GAMMA-3-10|CTRL-EXACT-QUOTIENT>|bits=<18|21|24|27|30>|cluster=<00..31>|root=<000..255>|component=<a|b|z|list-0|list-1|list-2|list-3>
