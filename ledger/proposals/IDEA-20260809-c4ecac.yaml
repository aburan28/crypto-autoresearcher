      serialization_write_and_read: {id: traffic.fixture.CTRL-ISOMORPHISM-APPARATUS.curve-check.serialization-roundtrip, event_count: 104960, byte_width: 16, bytes: 1679360}
      on_curve_result_write_and_verify: {allocation_bytes: 6560, event_count: 13120, byte_width: 1, bytes: 13120}
