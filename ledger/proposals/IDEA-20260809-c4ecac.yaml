      coverage: >-
        For each complete (gamma_num,gamma_den,dataset,bits) tuple, generate
        32 coverage-cluster-rank values, sort by (rank,cluster), assign z=-1 to
        ranks 0..15 and z=+1 to ranks 16..31. The rank key never contains root;
        the data key always contains root. Ties use the frozen numeric tie-break.
      matched_mean: >-
        For each bits value, generate 32 matched-mean-cluster-rank values once,
        common to both arms; ranks 0..15 receive A_c=1024 and ranks 16..31
        receive A_c=3072. Within each (arm,bits,cluster), generate 8192 distinct
        matched-mean-root-rank values, sort by (rank,root), and select the first
        A_c or A_c/kappa roots as specified by that arm. No sentinel or omitted
        tuple field is used.
