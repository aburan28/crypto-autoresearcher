      Each event owns one independent 256-bit SHAKE256 prefix. For a
      non-dyadic algebraic q, the unique length-256 prefix cell that
      straddles q is a cap hit and invalidates the complete package. Given
      package admission, independent event streams remain independent and
      each emitted bit is Bernoulli(A/(2^256-1)), where
      A=floor(q*2^256). For a dyadic row the decision terminates exactly,
      no prefix is excluded, and the law is Bernoulli(A/2^256). The
      admitted non-dyadic law is never called Bernoulli(q).
