      model certificate, and the canonical point record hash. Regeneration
      must yield all four model streams and their ordered hashes exactly.
    compiler_assertions:
      - No stochastic treatment key contains model.
      - Every derived model record identity contains model.
      - Exactly 65011712 canonical point generations and 195158016 transforms occur.
      - Exactly 260046848 model list records and 163840 model root metrics occur.
      - A model-specific a, b, z, or list draw is a hard schedule invalidation.

