  unequal_isomorphism_fixture:
    id: CTRL-ISOMORPHISM-APPARATUS
    timing: hard_pre_treatment_gate
    admitted_curves: 160
    noncanonical_models_per_curve: 3
    equal_fixtures_per_curve: 8
    unequal_fixtures_per_curve: 8
    equal_fixture_count: 1280
    unequal_fixture_count: 1280
    model_generator: >-
      Rejection-sample nonzero u. Require (u^4,u^6) pairwise distinct and
      different from (1,1), with accepted curves having nondegenerate A and B.
      Define E_u:y^2=x^3+(A*u^4)x+B*u^6 and
      phi_u(x,y)=(u^2*x,u^3*y), phi_u(O)=O.
    equal_generator: >-
      Rejection-sample distinct nonzero r1..r4 and nonzero a, derive known k,
      and set b_eq=r1+r2+r3+r4-a*k mod N. Compute R_j=[r_j]P,
      A0=R1+R2, B0=R3+R4, T0=A0+B0, and Q_eq=[a]Q+[b_eq]P.
      Q_eq and T0 are the same unique point and are encoded once.
    unequal_generator: >-
      From the disjoint unequal key rejection-sample delta uniformly from
      {1,...,N-1}. Set D_delta=[delta]P, b_neq=b_eq+delta mod N,
      Q_neq=Q_eq+D_delta, k_hat_neq=a^(-1)*(sum_j r_j-b_neq) mod N,
      and W_neq=[k_hat_neq]P.
    noncollision_proof: >-
      T0=[sum r_j]P and Q_neq=[sum r_j+delta]P. Equality would imply
      [delta]P=O, hence delta=0 mod N because P has prime order N, contradicting
      delta in {1,...,N-1}. Each phi_u is bijective, so equality after
      transformation is equivalent to equality before it. Thus all accepted
      unequal fixtures are noncolliding without probabilistic appeal.
    mandatory_checks:
      - Every explicitly enumerated canonical and transformed point is on its declared curve.
      - Every forward point round-trips to identical canonical bytes.
      - The three positive homomorphism sums and final equality hold.
      - 'T0!=Q_neq and phi_u(T0)!=phi_u(Q_neq) for all models.'
      - 'phi_u(Q_eq)+phi_u(D_delta)=phi_u(Q_neq).'
      - 'k_hat_eq=k and [k_hat_eq]P=Q in all four models.'
      - 'k_hat_neq!=k and W_neq!=Q in all four models.'
    fixture_record_schema: >-
      One fixed 160-byte little-endian record per curve/fixture pair: 16-byte
      identifiers; ten u32 scalars r1..r4,a,b_eq,delta,b_neq,k_hat_eq,
      k_hat_neq; 32-byte equal canonical transcript SHA-256; 32-byte unequal
      canonical transcript SHA-256; 32-byte aggregate transformed transcript
      SHA-256; u32 non-on-curve check mask; u32 model mask. The separate ordered
      on-curve bitset and per-curve hash bind every point check.
    archive_records: 1280
    archive_record_width_bytes: 160
    archive_bytes: 204800
    pass_rule: >-
      Every one of the 1280 equal and 1280 unequal fixtures passes on the
      canonical model and all three noncanonical models before treatment.

  fixture_on_curve_charge:
    schema: crypto.autoresearch.identity_inclusive_curve_check.v1
    status: prospective_not_executed
    frozen_point_encoding:
      schema_id: toy-affine-or-infinity-16-v1
      width_bytes: 16
      byte_order: little_endian
      infinity_hex: ffffffffffffffffffffffffffffffff
      affine_layout: u64_x_then_u64_y
      affine_canonicality: '0<=x<p and 0<=y<p; all toy fields satisfy p<2^32.'
      rejection_rules:
        - Exactly the all-ff 16-byte word is infinity.
        - A partial sentinel, coordinate at least p, wrong width, or noncanonical integer is invalid.
        - No affine encoding can equal infinity because both affine coordinates are below p.
      global_use: >-
        This is the sole encoding for P, Q, Q-prime, list points, pair sums,
        candidates, fixture intermediates, phi_u inputs and outputs, equality,
        hashing, archive records, and h_y. h_y(infinity)=0 and
        phi_u(infinity)=infinity.
    branch_semantics:
      identity: >-
        Compare both u64 words with the sentinel. If both match, record
        is_identity=1 and on_curve=1. No affine coordinate is decoded. The
        constant-budget arithmetic slots below still execute on masked zeros
        and are charged, but their equation outcome is ignored.
      affine: >-
        If neither word is sentinel, require canonical x and y, read A and B,
        compute y2=y^2, x2=x^2, x3=x2*x, Ax=A*x, rhs=x3+Ax+B, compare y2=rhs,
        and record is_identity=0 plus the comparison bit. A mixed sentinel is
        invalid before the equation.
      constant_budget_rule: >-
        Every one of 52480 enumerated checks receives two field
        multiplications, two field squarings, two field additions, one field
        equality comparison, two sentinel comparisons, one branch decision,
        one serialization round trip, two coefficient reads, and two retained
        outcome bits. Actual identity frequency never refunds an operation or
        byte.
    canonical_point_enumeration:
      - {category: curve_P_and_Q, formula: '160*2', points: 320}
      - {category: positive_R1_R2_R3_R4_A0_B0_T0, formula: '160*8*7', points: 8960}
      - {category: unequal_D_delta_Q_neq_W_neq, formula: '160*8*3', points: 3840}
      - {category: canonical_total, formula: '320+8960+3840', points: 13120}
    transformed_point_enumeration:
      - {category: transformed_P_and_Q, formula: '3*160*2', points: 960}
      - {category: transformed_positive_points, formula: '3*160*8*7', points: 26880}
      - {category: transformed_unequal_points, formula: '3*160*8*3', points: 11520}
      - {category: transformed_total, formula: '960+26880+11520', points: 39360}
    total_on_curve_checks: 52480
    total_formula: '13120+39360=52480.'
    P_and_Q_policy: >-
      P and Q are checked once on every canonical curve and once in each of
      three transformed models. Curve certificates do not substitute for these
      1280 checks.
    operation_charge:
      multiplications_per_check: 2
      squarings_per_check: 2
      additions_per_check: 2
      field_comparisons_per_check: 1
      sentinel_comparisons_per_check: 2
      branch_decisions_per_check: 1
      field_multiplications: 104960
      field_squarings: 104960
      field_additions: 104960
      field_comparisons: 52480
      sentinel_comparisons: 104960
      branch_decisions: 52480
      formulas:
        - '52480*2=104960 multiplications, squarings, additions, and sentinel comparisons.'
        - '52480*1=52480 field comparisons and branch decisions.'
    traffic_charge:
