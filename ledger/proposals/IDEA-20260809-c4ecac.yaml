  cost_accounting:
    derivation:
      per_root_raw: N^(1/3+o(1))
      marginal_boolean_success: N^(-1/3+gamma_s+o(1))
      expected_roots: N^(1/3-gamma_s+o(1))
      total_raw: N^(2/3-gamma_s+o(1))
      live_entries: N^(1/3+o(1))
      wiring_multiplier: N^(1/9+o(1))
      total_full_cost: N^(7/9-gamma_s+o(1))
      raw_rho_crossover: gamma_s>1/6
      full_rho_crossover: gamma_s>5/18
      standard_BSGS_full_crossover: gamma_s>1/9
    conditionality: >-
      These are symbolic consequences of the named assumptions and Boolean
      bridge, not evidence that any gamma_s is positive or any crossover holds.
    preprocessing: >-
      Fixed-base tables, curve/model construction, shared canonical-root
      generation, all failed controls, calibration, rank generation, exact
      sampling, on-curve checks, archive, and discovery are charged. No model
      search occurs.
    discovery_gate: >-
      Screening J=N^delta_m models with R=N^rho_m roots costs raw
      N^(delta_m+rho_m+1/3) and full N^(delta_m+rho_m+4/9); rho comparison also
      requires delta_m+rho_m<1/18 and untouched-holdout gamma_s>5/18.
    parallel_form: >-
      N^pi engines reduce wall exponent to 2/3-gamma_s-pi until roots exhaust;
      total work is unchanged and every separate table, byte, engine, and
      message is charged.
    multi_target: >-
      K=N^tau independent targets without sharing cost tau+2/3-gamma_s raw and
      tau+7/9-gamma_s full. No multi-target gain is claimed.

