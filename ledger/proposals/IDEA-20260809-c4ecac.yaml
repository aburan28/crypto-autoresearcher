      Every preceding control, exact compiler equality, throughput gate, and
      resource reserve must pass. A missing, capped, nonconverged, or failed
      control prohibits treatment and is not ECDLP evidence.
    balanced_antisymmetric: >-
      On odd prime Z/NZ, H=(N-1)/2. Derive a unit a and c mod H, put
      pi(t)=a*t+c mod H, and for nonzero r use r=epsilon*u with
      u=min(r,N-r), h_null(r)=epsilon*(pi(u-1) mod M) mod M; h_null(0)=0.
      This is exactly antisymmetric and balanced within one count.
    exact_quotient:
