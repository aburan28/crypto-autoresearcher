    coverage_classification: >-
      A Q21.104 bootstrap interval covers the exact target only if its lower
      endpoint is at most gamma_lo/reference_denominator and its upper endpoint
      is at least gamma_hi/reference_denominator. It misses below or above only
      when separated from the whole bracket. Endpoint overlap with an
      unresolved bracket is invalid, never guessed.
