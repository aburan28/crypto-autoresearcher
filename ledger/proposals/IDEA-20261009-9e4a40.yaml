  title: |-
    Teichmueller lifts are useless for index calculus in F_p^* - size, not canonicity, is what NFS exploits
  class: control
  claim: |-
    Pr[omega(a) mod p^k is B-smooth] is about rho(k log p / log B), far below Pr[a in [0, p) is B-smooth] = rho(log p / log B), with no bias at any k >= 2.
  mechanism: |-
    NFS uses the non-homomorphic representative lift to [0, p) because smoothness is a size property. The Teichmueller lift omega is homomorphic and sizeless; truncated to Z/p^k it is a pseudo-random integer of size p^k. This is the reframing that sends the lifting question to routes D and E.
  novelty_status: unverified
