idea:
  id: IDEA-20260802-002
  question_id: RQ-ECDLP-002
  title: >-
    Tracked-object enumeration for the ECDLP with an EXECUTABLE one-step propagation
    meter - discharging KN-OPEN-019 to the inventor-protocol closure standard instead
    of to a tally
  class: mechanism
  claim: >-
    An attack family on the ECDLP can be indexed by its TRACKED OBJECT, and that index
    can be made measurable rather than rhetorical. For a projection pi from the group
    <P> subset E(F_p) to a set S, define two measurable quantities on a toy curve -
    the LOSS L(pi) = log2 of the mean fibre size, and the PROPAGATION BRANCHING
    b(pi) = the mean over ordered pairs (s, t) in image(pi)**2 of the number of distinct
    values taken by pi(A + B) over all A in pi**-1(s) and B in pi**-1(t). THIS RECORD
    CLAIMS (i) that a meter computing (L, b) reproduces FOUR known answers exactly -
    pi = identity returns (0, 1); pi = x-coordinate returns L = 1 bit and b = 2 EXACTLY
    (the two preimages +-A and +-B give exactly the two values x(A+B) and x(A-B));
    pi = a uniformly random k-bit label returns b within 5 percent of the
    balls-in-bins expectation for |S| = 2**k; and pi = the frozen half-arity Semaev
    fibre map INT-2 returns a branching whose duplicate structure equals the 2-torsion
    translate-orbit count derived independently by two sessions in BATCH-023 (20 orbit
    pairs at the bits-16 cell, and EXACTLY 0 at the bits-20 cell where the curve order
    is odd and the translate map does not exist); and (ii) that among a list of at
    least twelve candidate projections PRE-REGISTERED BEFORE MEASUREMENT and drawn from
    OUTSIDE the established families F1-F7 named below, either at least one has
    L >= 1 bit together with b <= 4 - a genuinely lossy object that still propagates
    with bounded branching, i.e. a candidate new attack family - or NONE does, in which
    case this program obtains, for the first time, a closure over an enumerated list
    with a per-candidate named obstruction rather than a count of rejections.
  mechanism: >-
    ESTABLISHED FAMILIES, NAMED AND DECLARED OFF-LIMITS AS THE PRIMARY LENS FOR THIS
    RECORD, per docs/inventor-protocol.md section 1 -
    F1 walk-collision (Pollard rho, kangaroo, van Oorschot-Wiener, BSGS) tracks a group
    element carried with its known representation aP + bQ;
    F2 factor-base decomposition (Semaev summation polynomials, Gaudry, Diem, descent)
    tracks a relation vector over a factor base;
    F3 isogeny path tracks a vertex or walk in an isogeny graph;
    F4 pairing transfer (MOV, Frey-Ruck) tracks the image in F_{q**k}**;
    F5 p-adic lift (Smart, SSSA) tracks a lift into a formal group;
    F6 endomorphism or automorphism orbit tracks an orbit representative;
    F7 preprocessing table tracks a precomputed advice string.
    The lossy-projection test of docs/inventor-protocol.md section 2 says a tracked
    object must DISCARD something and must discard it COMPATIBLY with the target's
    operation, so that the retained part still propagates. The worked failure in the
    source session is the pair (Delta, Pi) = (x xor y, x*y), which propagates perfectly
    and is worthless because nothing was discarded. THE ENTIRE POINT OF THIS RECORD IS
    THAT THIS TEST IS CURRENTLY APPLIED BY ARGUMENT AND CAN INSTEAD BE APPLIED BY
    MEASUREMENT. L(pi) is exactly "how much is discarded" and b(pi) is exactly "does
    the retained part still propagate" - b = 1 means deterministic propagation, b = |S|
    means the object carries no information forward, and 1 < b << |S| means a
    probabilistic lens whose survival depth is log(budget)/log(b) steps, which is the
    ECDLP analogue of "how many rounds does the characteristic survive".
    The meter therefore discriminates the three outcomes KN-OPEN-019 itself enumerates.
    (a) SOME CANDIDATE HAS L > 0 AND b SMALL - a new lens exists, its survival depth is
    a measured number, and the follow-on is to ask whether that depth reaches the
    p**(1/2) budget.
    (b) EVERY CANDIDATE HAS EITHER L = 0 (a change of coordinates, not an object) OR
    b close to |S| (no propagation) - and the per-candidate reason is recordable, which
    is a closure with mechanisms in the sense of section 4 rather than a fatigue report.
    (c) THE METER FAILS ITS OWN CALIBRATIONS - the tool is void and the enumeration is
    not attempted, which is an honest infrastructure outcome and not a mathematical one.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - knowledge/open-problems/KN-OPEN-019.md
    - knowledge/techniques/KN-TECH-056.md
    - docs/inventor-protocol.md
    - ledger/proposals
    - ledger/hypotheses
    grep_results:
    - >-
      KN-OPEN-019 states the enumeration has never been written down, offers a partial
      four-family sketch it labels as this program's own and possibly wrong, and says
      explicitly that no candidate object outside the known families is proposed. It
      names writing the enumeration as the cheap first step and records that the step
      has not been taken.
    - >-
      No ledger proposal defines a measurable loss or branching quantity for an ECDLP
      projection. The nearest records are IDEA-20260731-011 (a structure-destruction
      null gate, which is a control on claimed speedups, not an object meter) and the
      EXP-EQD-001 lane, which measured ONE specific projection's output distribution
      rather than its propagation.
    - >-
      The 2-torsion injectivity result that supplies calibration four is recorded at
      DEC-20260801-008 as RT049-B2 and as candidate KN-CAND-BATCH023-A, currently
      WITHHELD from promotion because its empirical leg is unarchived. This record does
      not promote it and does not depend on its promotion - it uses it as a PREDICTION
      THAT CAN FAIL.
    literature_verified: []
    conclusion: >-
      Adaptation of the symmetric-cryptanalysis object taxonomy into an executable
      meter for the ECDLP. The taxonomy analogy is KN-LIT-7595's; the meter, the four
      calibrations and the pre-registered candidate list are this record's contribution.
      No literature was verified in this session; status is `adaptation` on the strength
      of the corpus screen alone.
  assumptions:
  - >-
    Toy prime-field curves with prime-order subgroups small enough for exhaustive or
    heavily sampled pair enumeration. No live keys; no discrete logarithm is solved or
    claimed.
  - >-
    A candidate projection is admissible only if it is computable from the point ALONE,
    without knowledge of its discrete logarithm. Projections that require the index
    (for example an elliptic divisibility sequence term W_n, which needs n) are
    INADMISSIBLE and are recorded as such WITH THE REASON - that exclusion is part of
    the enumeration's content, not an omission from it.
  - >-
    The candidate list is frozen and hash-bound BEFORE any measurement, and its
    expected (L, b) for the four calibrators is written down before the meter runs.
  predictions:
  - metric: calibration_identity_pair
    direction: same
    minimum_effect: >-
      'pi = identity returns exactly L = 0.000 and b = 1.000. Any deviation voids the
      meter.'
  - metric: calibration_x_coordinate_branching
    direction: same
    minimum_effect: >-
      'pi = x-coordinate returns L = 1.000 bit and b = 2.000 exactly on every curve
      tested, excluding the 2-torsion and identity fibres which are enumerated and
      reported separately. This is a POINT PREDICTION derived from the algebra - the
      unordered-pair ambiguity of +-A, +-B gives exactly {x(A+B), x(A-B)} - and it can
      fail.'
  - metric: calibration_random_label_branching
    direction: same
    minimum_effect: >-
      'pi = a random k-bit label returns b within 5 percent of the balls-in-bins
      expectation at |S| = 2**k, for k in {4, 8, 12}. This is the NULL OBJECT of the
      meter - an object with maximal loss and no propagation - and it must return the
      no-propagation answer or the meter cannot tell propagation from its absence.'
  - metric: calibration_INT2_translate_orbits
    direction: same
    minimum_effect: >-
      'pi = the frozen half-arity Semaev fibre map INT-2 returns a duplicate structure
      matching the archived BATCH-023 counts EXACTLY - 20 duplicate pairs at the
      bits-16 instance and 0 at the bits-20 instance. This is the fourth calibration and
      it is the sharpest, because it is a point prediction from a derivation this
      program produced independently in two sessions and has never archived
      machine-readably. Its failure would be evidence against that derivation, which is
      a decision-relevant outcome in its own right.'
  - metric: candidate_survivor_count
    direction: different
    minimum_effect: >-
      'Among at least 12 pre-registered non-F1-F7 candidates, the count with
      L >= 1 bit AND b <= 4 is either >= 1 (a candidate new lens, requiring an
      independent review before any further claim) or exactly 0 (a closure over the
      tested list, requiring a named obstruction per candidate). Both are reportable;
      neither is a null result.'
  - metric: branching_decay_with_fibre_size
    direction: increasing
    minimum_effect: >-
      'ARTIFACT TELL. For a family of projections of increasing loss built by
      progressively coarsening a fixed base projection, b must increase monotonically
      with L for objects that do NOT propagate, and must stay bounded for objects that
      do. A coarsening ladder on which b neither rises nor stays bounded is an
      implementation defect, and the ladder is run before any candidate is read.'
  minimal_test:
    design: >-
      (1) Freeze the candidate list, the four calibrators and their expected values in a
      hash-bound file. (2) On toy curves with prime subgroup order n <= 2**12, compute
      (L, b) EXHAUSTIVELY over all n**2 ordered pairs. (3) On curves with n up to
      2**20, compute (L, b) by uniform sampling of 10**7 pairs and report bootstrap
      intervals; verify at the overlap size n = 2**12 that the sampled estimate
      reproduces the exhaustive one to within its interval - a sampled estimator that
      does not reproduce its own exhaustive answer is void. (4) Run the four
      calibrations FIRST and abort if any fails. (5) Only then read the candidate list,
      and for every candidate with L = 0 record WHY it loses nothing (the inversion
      argument), and for every candidate with b large record WHY it fails to propagate.
    controls:
    - >-
      NULL OBJECT - the random k-bit label, which must return the no-propagation answer.
      Without it the meter cannot distinguish "propagates" from "the code always says
      it propagates".
    - >-
      IDENTITY CONTROL - which must return (0, 1) and detects a meter that manufactures
      loss.
    - >-
      GENERIC-GROUP CONTROL - the identical meter run on Z/nZ with a random labelling of
      elements and the SAME candidate projections transported through that labelling.
      Any candidate whose (L, b) is the same on the curve and on the relabelled cyclic
      group is carrying no elliptic-curve content, which is exactly the attribution
      failure EV-DS-003 and DEC-20260801-003 established for the degree-split lane on
      Z/753848Z. THIS CONTROL IS MANDATORY FOR EVERY CANDIDATE, NOT OPTIONAL.
    - >-
      SAMPLED-VERSUS-EXHAUSTIVE OVERLAP CHECK at n = 2**12.
    required_metrics:
    - L and b per candidate per curve, with exhaustive-or-sampled flag and intervals
    - the four calibration outcomes, pass or fail, before any candidate is read
    - generic-group transported (L, b) per candidate, paired with the curve value
    - per-candidate obstruction text for every candidate that fails, written at the
      time of failure and not reconstructed afterwards
    - survival depth log(2**40)/log(b) for every candidate with 1 < b < 16
  falsification_conditions:
  - >-
    'G1 - any of the four calibrations fails: METER VOID. No candidate is read, no
    closure is claimed, and the failure is reported as an instrument outcome. In
    particular a failure of the INT-2 calibration is ALSO evidence about the BATCH-023
    2-torsion derivation and must be routed there rather than absorbed.'
  - >-
    'G2 - the sampled estimator does not reproduce the exhaustive answer at n = 2**12
    within its own interval: estimator void at larger n; results restricted to the
    exhaustive regime.'
  - >-
    'G3 - a candidate shows L >= 1 bit and b <= 4 on the curve AND the identical value
    on the relabelled cyclic group: the candidate is a generic-group object with no
    elliptic content, and the correct disposition is to record it as such rather than as
    a new ECDLP lens. This is the specific overclaim the design exists to prevent.'
  - >-
    'G4 - every candidate fails: the closure branch. It is a first-class deliverable
    ONLY IF each failure carries its named obstruction and the record names the classes
    that remain open. Without those it is a fatigue report and its honest status is
    `unverified` (docs/inventor-protocol.md section 4).'
  confounders:
  - >-
    A candidate can appear to propagate merely because its image is tiny - b <= 4 is
    trivially satisfied when |S| = 4. The reading rule must require b <= 4 AND
    |S| >= 2**8, and must report b normalized by |S| alongside the raw value.
  - >-
    Small-order curves have atypical torsion. Every curve in the panel must have its
    full torsion structure recorded and at least one odd-order and one even-order
    instance must be present, because the INT-2 calibration's two branches depend on
    exactly that difference.
  - >-
    A projection defined by a lookup table on a small curve will not transport to a
    larger one. Candidates must be defined by formulas evaluable at any p.
  interpretation_limits:
  - >-
    THIS PROPOSAL MOVES NO EXPONENT AND MAKES NO ATTACK CLAIM. A candidate surviving
    the meter is a candidate LENS, not an attack; converting a bounded-branching
    projection into an algorithm is a separate problem the meter does not address and
    must not be presented as addressing.
  - >-
    The enumeration is over a PRE-REGISTERED LIST. A closure over that list is a closure
    over that list, and the record must say so in the same sentence as the closure. The
    transitivity-style argument that would close the whole class - the analogue of the
    source session's <PGL(2, 2**8), GL(8,2)> argument - is NOT produced here and its
    absence is the honest limit of this deliverable.
  - >-
    Toy curves only. Nothing transfers to cryptographic p by any argument this record
    offers.
  heuristic_assumptions:
  - id: HEUR-OBJ-1
    statement: >-
      For a projection pi that is a formula in the curve coordinates, the branching
      b(pi) measured on toy curves of order n in [2**10, 2**20] is bounded above,
      uniformly in n, by its value at the largest tested n plus one - that is, b does
      not grow with the field once the projection's algebraic structure is fixed.
    rigorous_support: >-
      For the calibrators this is a theorem, not an assumption - b = 1 for the identity
      and b = 2 for the x-coordinate hold at every p by the algebra of the unordered
      pair. No theorem covers the general candidate, and this assumption is exactly the
      extrapolation that would have to be justified before any candidate is taken to
      cryptographic scale.
    validation_plan: >-
      MEASURE IT RATHER THAN ASSUME IT - report b(pi, n) as a curve in n across at least
      five sizes spanning 2**10 to 2**20 for every candidate that survives, and record
      the fitted growth exponent with its interval. A candidate whose b grows as a power
      of n is dead at scale and the measurement says so. TOY SCALE, LABELLED AS SUCH.
  target_complexity:
    time_exponent: >-
      n/a - no algorithm is claimed. The closure branch asserts no complexity. The
      survivor branch would report a survival depth log(budget)/log(b) as the quantity a
      follow-on algorithm proposal would have to convert into a cost.
    memory_exponent: n/a
    best_known: >-
      Pollard rho at 0.886 * sqrt(N) group operations with O(1) memory is the incumbent
      for prime-field ECDLP and is not challenged by this record.
    hidden_overhead: >-
      The meter itself costs O(n**2) in the exhaustive regime and O(samples) otherwise;
      this is measurement cost, not attack cost, and is not part of any complexity claim.
    tradeoff_note: n/a
  dominated_by: >-
    n/a - no attack result is claimed, so no Pareto point is occupied. Stated as `n/a
    (no result claimed)` rather than as an unchecked null, per docs/inventor-protocol.md
    section 5.
  sota_delta: >-
    Zero on every ECDLP cost axis. The claimed delta is methodological - KN-OPEN-019
    moves from "the enumeration has never been written down" to either an enumeration
    with a per-candidate obstruction, or a candidate object with a measured survival
    depth. This program's standing saturation conclusions cannot be upgraded above
    `unverified` without this step, by the inventor protocol's own terms.
  instrument_failure_guards:
    decision_variable: >-
      The pair (L, b) per candidate, and the candidate survivor count.
    what_would_make_it_vary: >-
      The ALGEBRA OF THE PROJECTION - specifically whether the fibres of pi are
      permuted compatibly by the group law. The four calibrators are chosen precisely
      because their (L, b) are known IN ADVANCE from that algebra and differ from each
      other across the whole range of the statistic, so the statistic is demonstrated to
      vary before any unknown candidate is read.
    power_against: >-
      Projections that lose nothing (detected by L = 0) and projections that do not
      propagate (detected by b close to |S|), at the toy sizes measured, over the
      pre-registered list.
    no_power_against: >-
      Objects that require more than one group operation to reveal their structure (a
      two-step or adaptive object would show large b at one step and small b at two -
      the meter as specified is a ONE-STEP meter and this is its declared blind spot);
      objects requiring the discrete logarithm as input, which are inadmissible by
      construction; set-valued or adaptive objects (IDEA-20260802-006 supplies one such
      object and is deliberately NOT covered by this meter); anything at cryptographic p.
    demonstrated_movement: >-
      BY MEASUREMENT - the ladder of progressively coarsened projections in prediction 6
      must move b monotonically, and the four calibrators are four points at which the
      statistic's value is predicted in advance from algebra. If the ladder does not
      move b, the meter is void and no candidate is read. This is the direct repair of
      the failure in which a statistic could not be moved by any rung of its own ladder.
    lessons_addressed: >-
      Lesson 1 - (L, b) are enumerated over the group, not closed forms in the
      protocol's parameters, and for the calibrators the closed form is used as the
      CHECK rather than as the measurement. Lesson 4 - the coarsening ladder is a
      perturbation demonstrated to move the statistic before any inference is drawn.
      Lesson 5 - the ladder and the statistic are the same construction by design.
      Standing limit U1 - the generic-group transport control is an ABSOLUTE reference
      (an object with known zero elliptic content), not a second sample of the same kind.
  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Exhaustive regime is n**2 = 1.7e7 group operations per candidate at n = 2**12;
    twelve candidates and four calibrators over four curves is under an hour. Sampled
    regime is 10**7 pairs per candidate per curve. No factorization, no lattice work.
  recommended_priority: high
  dependencies:
  - >-
    None. It reads no archived array except the two BATCH-023 duplicate counts, which it
    uses as a prediction rather than as an input.
  proposed_by: idea-generator
  proposed_at: '2026-08-02'
  inference:
    requested_policy: idea-generation
    resolved_model_id: claude-opus-5
    reasoning_effort: null
