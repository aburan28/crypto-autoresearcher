idea:
  id: IDEA-20260816-f2575b
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: The Case C closure gives the SIGN of the easy-instance density decay and never its MAGNITUDE;
    measure the decay exponent directly by exact enumeration of bounded-denominator fractional ideals
    of fixed relative norm in small CM fields, without reopening any question KN-OPEN-028 closed.
  class: measurement
  claim: '(A) KN-OPEN-028 is closed_all_questions_answered and stays closed; its Q1 closure records
    that the algorithm samples bounded-norm beta, which bounds the denominator of accessible fractional
    O_F-ideals, so the density of easy principal ideals tends to zero as the bound grows, giving super-polynomial
    runtime with no sub-exponential advantage established (EV-HAWK-c99848, EV-HAWK-21edba, DEC-20260805-ed4cd3).
    That is a settled direction. (B) The claim is that KN-OPEN-028''s own text names the residual
    quantity in the same breath - it says ''appears to run in super-polynomial time'' is ''a direction,
    not a bound'' - and that under docs/inventor-protocol.md section 4 the reusable content of a negative
    result is the NUMBER it measured, not the verdict it reached. The direction was recorded; the
    number never was. The claim is that the number is separately measurable, at small scale, by pure
    exact arithmetic and with no attack implementation: fix a small CM field F = K(sqrt(alpha)) with
    K a small cyclotomic field, fix a relative norm target, and count fractional O_F-ideals of that
    relative norm with denominator bounded by R, as a function of R, then count how many of those
    lie in the trivial class. The ratio is the density, its log-log slope in R is the decay exponent,
    and that exponent is the missing magnitude. (C) The claim is that this exponent is a reusable
    measurement independent of the attack: it belongs to the obstruction registry as a quantity with
    units and error bars and a scope, available to any later theory that wants it - which is exactly
    the second reading section 4 requires and which the resource-reading entry elsewhere in this batch
    needs as its input. (D) NOT CLAIMED: that KN-OPEN-028 is reopened, that any of its Q1, Q2 or Q3
    closures is doubted, or that the paper''s authors'' super-polynomial characterisation is wrong;
    that a measured exponent at small conductor transfers to any HAWK parameter; that the measurement
    yields any attack, any improvement, or any statement about the route''s viability; and no statement
    about HAWK''s security in either direction. A measured exponent that confirms the closure exactly
    is the expected outcome and is a complete result.'
  mechanism: 'Stage 1 fixes the setting exactly as the committed evidence describes it, not as intuition
    suggests: F = K(sqrt(alpha)) is a CM field, a totally complex quadratic extension of a totally
    real or cyclotomic K, and O_F is a Dedekind domain in which fractional ideals are well defined
    - EV-HAWK-21edba is explicit that this is the Dedekind-domain setting and NOT the totally definite
    quaternion setting, and that an earlier record confused the two. The contract inherits that correction
    as a hard precondition. Stage 2 chooses the smallest fields where exact computation is possible:
    K a cyclotomic field of degree 2 or 4, alpha declared, giving O_F of degree 4 or 8 over Q, with
    class group and unit group computable by exhaustive means in exact integer arithmetic. Stage 3
    enumerates, for each denominator bound R on a geometric ladder, the set of fractional ideals I
    with relative norm N_{F/K}(I) equal to the fixed target, writing each as (1/a) times an integral
    ideal with the norm of a bounded by R, exactly as the Case C argument in EV-HAWK-c99848 describes
    the construction. Stage 4 tests principality of each enumerated ideal by exact search over a bounded
    region of the ring, and counts. Stage 5 forms density(R) = principal count divided by total count
    and fits log density against log R, with the slope and its bootstrap interval over independent
    choices of alpha and of the norm target as the deliverable. Stage 6 runs a null: the same enumeration
    and principality test on a field of the same degree and comparable discriminant but with a DIFFERENT
    class number, where the density is expected to differ predictably; if the fitted exponent is identical
    across class numbers the measurement is not seeing class structure. Stage 7 registers the measurement
    in the obstruction form of templates/research-records.md with value, units, error bars, source
    runs and scope.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grep -ril ''fractional ideal'' over ledger/proposals/ returned 0 files - no proposal
      in this repository mentions the object at all. Grep -ril ''hawk|module-lip|nrd-pip|nrdpip|lattice
      isomorphism'' returned 11, all titles read. Read knowledge/open-problems/KN-OPEN-028.md in full
      including its q1_closure, q2_closure and q3_closure blocks and its ''what would resolve it''
      item 2, which explicitly says ''derive the corrected count independently: fractional ideals
      of norm q-prime in O_F is a standard algebraic-number-theory quantity, and the corrected exponent
      may follow without the paper''. Read ledger/evidence/EV-HAWK-c99848.yaml and EV-HAWK-21edba.yaml
      in full, including the correction of EV-HAWK-68b8b6 on the definite/indefinite quaternion point.
      Read knowledge/techniques/KN-TECH-081.md in full. Read docs/inventor-protocol.md section 4 in
      full including the obstruction-block and resource_check requirements.'
    results: 'No proposal touches fractional ideals. KN-OPEN-028''s ''what would resolve it'' item
      2 is the closest existing statement and asks for exactly the derivation this entry proposes
      to MEASURE rather than derive - and it was written before the entry was closed, so it is a stated-but-undone
      task now sitting behind a closure. The closure itself (q1_closure) settles direction, citing
      EV-HAWK-c99848 and DEC-20260805-ed4cd3, and says explicitly ''no sub-exponential advantage over
      brute force established'' - a statement about what was established, not a magnitude. EV-HAWK-21edba
      is critical to get right and is the reason this contract fixes the Dedekind-domain setting as
      a precondition: it corrects EV-HAWK-68b8b6, which wrongly applied an indefinite-quaternion local-global
      principle to HAWK''s totally definite algebra. That correction is the single most likely way
      for a naive version of this measurement to go wrong. KN-TECH-081 separates commutative, rank-1
      non-commutative and rank-2 non-commutative PIP and warns that conflating them is ''the easiest
      available way for this program to make a false novelty or false-hardness call''; this entry
      works strictly in the commutative Dedekind setting of O_F and says so.'
    verdict: 'UNVERIFIED. Claimed new: performing the count as an EXACT SMALL-SCALE MEASUREMENT with
      a fitted decay exponent, error bars and a class-number null, rather than as an asymptotic derivation,
      and registering the result as a reusable obstruction measurement rather than as an answer to
      a closed question. Assembled from known parts: the object and the setting are given verbatim
      by EV-HAWK-c99848 and EV-HAWK-21edba; the request for an independent derivation is KN-OPEN-028''s
      own item 2; counting ideals of bounded norm in a number field is entirely standard algebraic
      number theory; the obstruction-block and second-reading discipline is docs/inventor-protocol.md
      section 4. What is mine is only the decision to measure rather than derive, and the null design.
      This program cannot read external literature and asserts nothing about what is known outside.'
  object_first_candidate:
    tracked_object: 'The bounded-denominator pool: the set P(R) of fractional O_F-ideals of a fixed
      relative norm expressible as (1/a) times an integral ideal with norm of a at most R, followed
      as R grows, together with its principal subset. The object followed through the computation
      is the pair (|P(R)|, |P(R) intersect principal|) as a function of R.'
    lossiness: 'Genuinely lossy. Passing from the pool to the pair of counts discards the identity
      of every ideal, its class, its generators and its geometry, retaining two integers per R. This
      is compatible with the operation of interest because the algorithm''s step is a uniform-ish
      draw from the pool followed by a principality-and-shortness test, so its success probability
      depends on the pool only through the ratio of those two counts. What does not survive: any question
      about WHICH ideals are easy, any correlation between consecutive draws, and any geometry of
      the short-generator problem - the second stage that KN-TECH-081 insists is a different problem
      from the first. Those are named here as out of scope, and the entry measures stage-one principality
      only, not short-generator recovery.'
    propagation: 'One step of the target operation is incrementing the denominator bound R: the pool
      grows by the fractional ideals newly admitted, and the density updates as a ratio of two monotone
      increasing counts. Propagation is deterministic and monotone - both counts only increase - so
      the density''s behaviour is entirely determined by the relative growth rates, which is exactly
      what the fitted exponent measures.'
    survival_score: 'The exact enumeration survives while both the class-group computation and the
      bounded-region principality search remain complete. Concretely: expected to survive at O_F of
      degree 4 over Q for R up to about 10^4, and at degree 8 for R up to about 10^2 or 10^3, dissolving
      above that as the principality search becomes budget-bound. The largest (degree, R) pair completed
      exactly is a required reported number, and any point where the search switches from exhaustive
      to heuristic must be flagged in the output, with heuristic points excluded from the primary
      fit.'
  null_object_control: 'The null object is a number field of the same degree and comparable discriminant
    but with a different class number - ideally class number 1, where every ideal is principal and
    the density is identically 1 by construction - run through the IDENTICAL enumeration and principality
    pipeline in the same invocation. For the signal arm to mean anything: the class-number-1 null
    must return density exactly 1 at every R, confirming the principality test does not spuriously
    fail; and a second null with a larger class number must return a density measurably below the
    signal arm''s if and only if class structure is what the measurement is reading. If the fitted
    exponent is the same across fields of different class number, the measurement is reading the denominator
    bound alone and not the arithmetic, and the exponent must be reported as a statement about counting,
    not about class structure.'
  discriminated_from:
  - 'KN-OPEN-028''s q1_closure: that closure establishes the DIRECTION (density tends to zero, super-polynomial)
    from the algorithm''s structure. This entry does not re-derive, dispute or reopen it; it measures
    a magnitude the closure explicitly declined to state, and it cites the closure as settled input.'
  - 'KN-OPEN-028 ''what would resolve it'' item 2: that asks for an independent DERIVATION of the
    corrected count. This entry proposes a MEASUREMENT with error bars and a null instead, on the
    grounds that a small-scale exact count is available now and a derivation is not, and that section
    4 privileges the measured number.'
  - 'EV-HAWK-68b8b6 as superseded by EV-HAWK-21edba: the superseded record applied an indefinite-quaternion
    local-global principle to a totally definite algebra. This contract works in the commutative Dedekind
    setting of O_F and makes that a hard precondition precisely so the same error cannot recur.'
  - 'KN-TECH-081''s PIP three-settings table and the two-stage discipline: this entry measures stage
    one (principality) only and explicitly does not touch stage two (short generator), which KN-TECH-081
    insists is a separate problem.'
  - 'IDEA-20260801-019 (independent reimplementation of the reported attack): that would implement
    the attack; this implements no part of it, runs no re-randomisation, and never forms an nrd-PIP
    instance.'
  assumptions:
  - The Dedekind-domain setting recorded in EV-HAWK-21edba is the correct setting for this count,
    and the quaternion-order intuition corrected there does not apply. This is inherited as a precondition,
    not re-derived.
  - Class group and unit group of O_F are computable exactly at degrees 4 and 8 over Q by exhaustive
    means within budget, without a computer-algebra system.
  - Principality can be tested exactly by bounded search over a region determined by Minkowski-type
    bounds computable at these degrees; where the bound is too large for exhaustive search the point
    is flagged heuristic and excluded from the primary fit.
  - The pool construction (1/a) times integral I with norm of a bounded by R faithfully represents
    the accessible set described in EV-HAWK-c99848; where the evidence record is not explicit, the
    construction used is declared and the ambiguity recorded as a scope limit.
  predictions:
  - metric: fitted log-log slope of density(R) in R, signal field, degree 4
    direction: lower
    minimum_effect: strictly negative with the bootstrap interval excluding zero; a slope consistent
      with zero would contradict the direction already settled in KN-OPEN-028 and would be reported
      as an instrument failure to be diagnosed, not as a refutation of the closure
  - metric: density(R) on the class-number-1 null field
    direction: different
    minimum_effect: 'forced value: exactly 1.0 at every R; any other value proves the principality
      test is broken'
  - metric: difference in fitted slope between fields of different class number, same degree
    direction: different
    minimum_effect: 0.1 in absolute value; if the slopes agree within that, the measurement is reading
      the denominator bound rather than class structure and must be reported as such
  - metric: largest (field degree, R) pair enumerated exhaustively rather than heuristically
    direction: different
    minimum_effect: 'refusal to pre-commit: the principality search cost depends on the Minkowski-type
      bound for the specific fields chosen, which is not known before they are fixed, and a guess
      would be a fabricated expectation'
  minimal_test:
    design: 'Smallest possible: one CM field F of degree 4 over Q with small discriminant and class
      number greater than 1, one class-number-1 null field of the same degree, one fixed relative-norm
      target, and a denominator ladder R in a geometric sweep from 10 to 10^4. In one invocation,
      for each R and each field, enumerate the bounded-denominator pool, test each element for principality
      by exhaustive bounded search, and record the two counts. Fit log density against log R on the
      exhaustive points only. Report the fitted slope with a bootstrap interval taken over independent
      choices of relative-norm target (at least 10 targets), the class-number-1 null''s density (which
      must be exactly 1 at every R), and the count of heuristic-flagged points excluded. This discriminates
      because it produces the missing magnitude with an error bar while simultaneously proving, via
      the class-number-1 arm, that the principality machinery is sound. Cost is minutes to hours of
      single-core exact integer arithmetic; no lattice reduction, no solver, no attack code.'
    controls:
    - 'Class-number-1 null field, identical pipeline, same invocation: density must be exactly 1 at
      every R.'
    - 'Second null with a larger class number: fitted slope must differ from the signal field''s,
      else the measurement is not reading class structure.'
    - Exhaustive-versus-heuristic flag on every point, with the primary fit restricted to exhaustive
      points and a secondary fit reported on all points for comparison.
    - 'Norm-target replication: at least 10 independent relative-norm targets, with the bootstrap
      interval taken across them, so no exponent rests on one target.'
    - 'Monotonicity audit: both counts must be non-decreasing in R by construction; a violation is
      a bug and halts the run.'
    required_metrics:
    - '|P(R)| and |P(R) intersect principal| at every R, per field, per norm target'
    - fitted log-log slope of density(R) with bootstrap interval, per field
    - class-number-1 null density at every R
    - count and location of heuristic-flagged points
    - largest exhaustively completed (degree, R) pair
    - slope difference across class numbers with its interval
  falsification_conditions:
  - The class-number-1 null returns any density other than exactly 1, proving the principality test
    unsound and voiding every other number.
  - The fitted slope is consistent with zero on the exhaustive points, which contradicts a settled
    direction and must be diagnosed as an instrument failure rather than reported as a result about
    the route.
  - Slopes agree across fields of different class number, meaning the measurement reads the denominator
    bound and not the arithmetic.
  - Fewer than three exhaustive points are available on the R ladder, so no fit is possible and the
    contract reports a budget limit rather than an exponent.
  - The monotonicity audit fails.
  - The pool construction cannot be pinned down from EV-HAWK-c99848 closely enough to declare it,
    in which case the contract reports the ambiguity and does not run.
  confounders:
  - The relative-norm target's factorisation type strongly affects the pool size, so a single target
    could give a slope characteristic of that factorisation rather than of the field - which is why
    replication across at least 10 targets is mandatory rather than optional.
  - Bounded-region principality search silently becomes incomplete as the region grows, converting
    exact counts into undercounts of the principal set and biasing density downward; the exhaustive/heuristic
    flag is the only defence and must be enforced in code.
  - Small fields have small class groups, so density statistics are coarse and the fitted slope may
    be dominated by a handful of classes; the class-number null is designed to expose this.
  - The correspondence between the paper's denominator bound (norm of beta below order n to the 13/2,
    per EV-HAWK-c99848) and the R used here is a modelling choice, not an identity, and every conclusion
    is scoped to the declared R.
  - Working at degree 4 or 8 over Q while the setting of interest has degree growing with the ring
    degree means the measured exponent may be a small-field artifact; this is stated as the principal
    scope limit and no extrapolation is offered.
  interpretation_limits:
  - KN-OPEN-028 remains closed. A measured exponent refines a recorded direction into a number at
    small scale; it does not answer, reopen or revise any of Q1, Q2 or Q3.
  - The exponent is measured at field degrees 4 and 8 over Q with small discriminants and does NOT
    extrapolate to the fields arising at HAWK parameters; no extrapolation is offered and none is
    licensed.
  - Stage-one principality only. Nothing here touches short-generator recovery, which KN-TECH-081
    records as a separate problem that broke at a different time in the commutative history.
  - No statement about the route's viability, about any attack cost, or about HAWK's security in either
    direction follows from any value.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measured quantity IS an exponent, but it is
      the decay exponent of an ideal-density ratio in a denominator bound - not a computational cost
      exponent - and the contract forbids reading it as one.
    memory_exponent: No attack memory exponent is claimed. Storage is two integer counts per (field,
      target, R) plus the enumerated ideal list, megabytes at these degrees.
    best_known: 'For the route itself, the incumbent characterisation is KN-OPEN-028''s own: super-polynomial,
      no sub-exponential advantage over the 2^{(n/2+1)+o(n)} Straznickas-Weis baseline established
      (EV-HAWK-c99848, KN-LIT-7592). This entry does not compete with that characterisation; it supplies
      a number the characterisation left unstated at a scale far below it.'
    hidden_overhead: 'The exhaustive-versus-heuristic boundary in the principality search is where
      everything hides: it is easy to write a search that quietly stops early and reports a clean
      exponent. The second hidden cost is the modelling step connecting the paper''s beta bound to
      the R used here, which is a judgement call presented as a parameter. Both are called out as
      required reported metrics precisely because they are the places a lazy run would produce a confident
      wrong number.'
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP super-polynomial, underived (KN-LIT-7674);
    definite/indefinite LIP reporting HAWK unaffected (KN-LIT-7648); the SLIP AM-intersect-coAM ceiling
    (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional lattice. This entry produces
    no attack and enters no frontier row: n/a (no result claimed).'
  sota_delta: No attack; measurement contribution only. The quantity moved is the easy-instance density
    decay exponent, which goes from a recorded DIRECTION (tends to zero, per KN-OPEN-028 q1_closure)
    to a MEASURED MAGNITUDE with a bootstrap interval, a class-number null and an explicit small-field
    scope - available thereafter as a registered obstruction measurement for any theory that wants
    it.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that the count is exactly enumerable at degree 4 over a useful
    R ladder: 0.6, with the principality search the binding risk. Part (B), that a stable fitted exponent
    emerges across at least 10 norm targets: 0.45 - small fields give coarse statistics and the across-target
    variance may swamp the slope. Part (C), that the measured exponent is reusable by the resource-reading
    entry in this batch: 0.4, since that entry needs a magnitude at the fields arising in the real
    setting and this one supplies it only at degree 4 or 8, so the reuse is by analogy and is explicitly
    not a transfer. Probability the honest outcome is ''budget-bound, fewer than three exhaustive
    points, no exponent'': 0.3, and that outcome is reported as a budget limit and never as negative
    mathematical evidence, per AGENTS.md rule 3.'
