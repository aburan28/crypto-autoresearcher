idea:
  id: IDEA-20260807-018769
  question_id: RQ-TRA-001
  added: '2026-08-07'
  title: 'The transfer-operator barrier is a property of the PARTITION, not of the walk: x-interval
    cells identify P with -P, which is what forces the operator reversible and its spectrum real
    -- rebuild the exact coarse operator on (x-interval, sign of y) cells and see whether the
    phase channel that DEC-20260718-007 says is ''destroyed structurally'' comes back'
  class: measurement
  claim: 'EV-TRA-001 is a well-controlled negative: L = O(1) with fitted growth exponent delta
    = 0.0195, hit rates at the chance floor, charged costs 11,358-51,135 times sqrt(n), and both
    controls passing (C = n recovers k exactly; random permutations at ratio 0.993). Its rule-8
    observation is sharper than the predicted barrier and is the problem: all 54 exact coarse
    operators are exactly reversible (detailed-balance residual 2.5e-17) with entirely real spectra
    (max |Im lambda| = 3.7e-16), and DEC-20260718-007 attributes this to the +/- fold -- ''for
    negation-symmetric x-interval partitions there are NO eigenvalue phases at any budget''. A
    partition by x-interval identifies P with -P by construction. THE RECORDED MECHANISM IS THEREFORE
    CAUSED BY THE CHOICE OF CELLS, and EV-TRA-001''s own unresolved_confounds say so: ''non-negation-symmetric
    partitions and multi-mode estimators untested; reversibility obstruction is measured (and
    symmetry-argued) for x-cells, not proved for all partitions.'' The axis the mechanism identifies
    as load-bearing has no owner.'
  mechanism: 'The coarse-grained transfer operator of the translation-by-P walk is built by pushing
    the walk forward onto a cell partition of the group. When cells are unions of {P, -P} orbits,
    the walk restricted to cells inherits a reversibility that the walk itself does not have,
    because the fold sends the forward step to the backward step. Reversible operators have real
    spectra, so no eigenvalue carries a phase and the phase channel cannot localise k. Cells indexed
    by (x-interval, sign of y) break the fold: the forward and backward steps land in different
    cells, detailed balance need not hold, and the spectrum may leave the real axis. The cheapest
    decisive step needs no sampling at all -- it is an exact linear algebra computation on a C
    x C matrix at toy n.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    grep_results:
    - Six Koopman/transfer-operator records exist (IDEA-20260806-bcbcf5, IDEA-20260806-6bb3ef,
      IDEA-20260806-c5d183, IDEA-20260806-071255, H-SPC-5a6007 and one further proposal), and
      all sit in the isogeny-spectral or leakage-Fourier lanes. None partitions the translation-by-P
      walk.
    - No record tests a non-negation-symmetric cell family on any walk.
    conclusion: The specific axis is untouched in this corpus. External novelty unverified.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: rho/kangaroo distinguished
      points, index calculus, GGM oracle screens, character-sum/H-PSEUDO methods. This record
      proposes no attack.'
    tracked_object: 'The cell index of the current walk state under a partition that DISTINGUISHES
      P from -P: the pair (x-interval, sign of y).'
    one_step_propagation_rule: Translation by P maps a cell to a distribution over cells; the
      coarse operator is the matrix of those transition probabilities, computed exactly at toy
      n by enumerating the group.
    newness_score: Nil as mathematics -- coarse-graining a group walk is standard. The content
      is that the committed barrier was measured on the one partition family for which the obstruction
      is forced, and the complementary family was named untested and left so.
  lossy_projection_identifiability_audit:
    projection: group element -> (x-interval index, sign of y).
    what_is_discarded: The position within the interval; roughly log2(n/C) bits.
    is_it_only_a_change_of_coordinates: NO -- C is far smaller than n by construction, so the
      map is many-to-one and strictly lossy. The honest caveat is that this projection is only
      ONE BIT less lossy than the x-interval projection already tested, so if character orthogonality
      is what forces L = O(1) then the extra bit will not save it. That is a real possibility
      and it is the second falsification condition below.
    mirror_failure_check: 'CHECKED. The failure would be an operator that is reversible for every
      partition, making the diagnostic constant. It is not: reversibility is a checkable property
      of the constructed matrix, and the fold argument in DEC-20260718-007 predicts it holds for
      x-cells and gives no reason for it to hold once the fold is broken. Two distinct values
      are therefore possible before any measurement.'
  null_object_control:
    primary_null: The same (x-interval, sign) construction applied to a RANDOM PERMUTATION of
      the group of the same order, which EXP-TRA-001 already implements as its negative control.
      If the random permutation also loses reversibility and gains complex eigenvalues at the
      same rate, the phases are an artifact of breaking the fold and carry no information about
      the translation walk.
    secondary_nulls:
    - 'POSITIVE CONTROL, retained unchanged: C = n must recover k exactly on the new partition
      too.'
    - 'REGRESSION: reproduce EV-TRA-001''s max |Im lambda| = 3.7e-16 and detailed-balance residual
      2.5e-17 on the ORIGINAL x-interval cells before trusting any new number.'
  assumptions:
  - The exact coarse operator is constructible at the toy n EXP-TRA-001 used, since it already
    was for 54 cells.
  - y-sign is well defined on the curve model used (it is, for short Weierstrass over F_p with
    p odd, taking the representative in [0,(p-1)/2)).
  predictions:
  - metric: detailed-balance residual of the exact coarse operator on (x-interval, sign) cells
    direction: higher
    minimum_effect: Any value many orders above the 2.5e-17 floor measured on x-cells is a loss
      of reversibility.
  - metric: max |Im lambda| of the exact coarse operator
    direction: higher
    minimum_effect: Leaving the 3.7e-16 numerical-zero floor at all. That is the phase channel
      DEC-20260718-007 says is structurally destroyed.
  - metric: localisation L(S,C) on the non-symmetric family
    direction: different
    minimum_effect: L growing with n at any fitted exponent above the 0.0195 measured for x-cells
      would reopen the channel; L flat upgrades the barrier from partition-specific to general.
  minimal_test:
    design: 'Stage 1, zero sampling: rebuild the exact C x C coarse operator from EXP-TRA-001''s
      tra1_koopman.sage with cells indexed by (x-interval, sign of y) and with one deliberately
      non-symmetric interval family, at the same toy n as the committed run. Report detailed-balance
      residual and max |Im lambda|. Stage 2, only if Stage 1 shows phases: re-measure L(S,C) and
      the charged cost on the new family with the existing estimator, against the same positive
      and negative controls.'
    controls:
    - random-permutation null on the identical partition
    - C = n positive control
    - x-interval regression against EV-TRA-001
    required_metrics:
    - detailed-balance residual
    - max |Im lambda|
    - L(S,C) and its fitted growth exponent
    - charged cost as a multiple of sqrt(n)
  falsification_conditions:
  - 'The operator stays reversible and the spectrum stays real on non-symmetric cells: the barrier
    is general rather than partition-specific, which is the proved negative KN-OPEN-010 says would
    be valuable, and this record''s premise is wrong.'
  - 'Phases appear but L stays O(1) with the same fitted exponent: character orthogonality forces
    localisation regardless of the phase channel, which is a STRONGER and more general barrier
    statement than the one currently committed.'
  - 'The random-permutation null gains phases at the same rate: the effect is the fold-breaking,
    not the walk.'
  confounders:
  - Cell count C changes between the two partitions (2C cells for the same interval family), so
    L must be compared at matched C, not at matched interval count.
  - Floating-point conditioning of the eigenvalue computation at larger C could manufacture spurious
    imaginary parts; use exact or high-precision arithmetic and report the conditioning.
  - The sign convention on y is a choice; a different representative set is a different partition
    and must be reported as such.
  interpretation_limits:
  - Toy scale only. No cryptographic-scale claim.
  - A complex spectrum is not an attack. It is the precondition for the phase channel that KN-OPEN-010
    asks about, and nothing more.
  - This record does not dispute EV-TRA-001 inside its declared boundary.
  heuristic_assumptions:
  - id: HEUR-TRAP-1
    statement: Spectral behaviour of the exact coarse operator at toy n is directionally representative
      of larger n at matched C/n.
    rigorous_support: None; the same assumption underwrites EV-TRA-001's fitted delta.
    validation_plan: Compute at three values of n and report the trend in max |Im lambda| and
      in the residual.
  target_complexity:
    time_exponent: n/a -- measurement
    memory_exponent: n/a
    best_known: Pollard rho at exponent 1/2
    hidden_overhead: n/a
    tradeoff_note: No cost claim is made.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked before writing: rho (p^{1/2}, O(1)
    memory); BSGS (p^{1/2}, p^{1/2}); kangaroo for bounded intervals; the committed EV-TRA-001
    charged costs, which are 11,358-51,135 times sqrt(n) and therefore far worse than rho. No
    row is added by this record.'
  sota_delta: ZERO. Deliverable is either a partition-independent barrier statement -- an upgrade
    of a scoped rejection to the theorem DEC-20260718-007 said it wanted -- or a reopened channel.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: '0.80 that reversibility is lost on the non-symmetric partition --
    the fold argument is explicit about why it held, and breaking the fold removes that reason.
    0.65 that max |Im lambda| leaves the numerical-zero floor. 0.10 that L(S,C) then grows measurably
    with n: character orthogonality is a separate and stronger obstruction than reversibility,
    and it is untouched by the partition change. The record is worth running because the first
    two are cheap and decide whether the committed barrier statement is general or an artifact,
    not because the third is likely.'
