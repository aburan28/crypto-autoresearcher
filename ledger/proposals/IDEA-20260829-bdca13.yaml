idea:
  id: IDEA-20260829-bdca13
  question_id: RQ-ECDLP-001
  added: '2026-08-29'
  title: >-
    THE TOY S_3 GROEBNER INSTRUMENT IS NOT MEASURING A SEMAEV SOLVING DEGREE, AND
    THE PROOF IS ONE APPLICATION OF THE CHINESE REMAINDER THEOREM: because the
    factor-base membership polynomials are squarefree and split completely, the
    ideal is the RADICAL vanishing ideal of a subset Z of the grid V x V, so every
    reported Groebner observable is a function of the incidence pattern of Z alone
    -- with |Z| of expected size 4B^2/p, meaning 0, 1 or 2 points at this
    question's own parameters -- and a medium-scale scaling study of it would be
    measuring sympy
  class: mechanism

  claim: >-
    (A) THE STRUCTURE THEOREM. Let E be the curve y^2 = f(x) = x^3 + ax + b over
    F_p with p > 3. Let V = {v_1,...,v_B} be distinct x-coordinates of
    F_p-rational points, let fV(x) be the product over i of (x - v_i), let R be
    an affine target with x-coordinate xR, and set s(x1,x2) = S_3(x1, x2, xR).
    The system measured by harness.semaev.measure_s3_decomposition is
    I = (s, fV(x1), fV(x2)) inside F_p[x1,x2]. Then:
    (i) A := F_p[x1,x2]/(fV(x1), fV(x2)) is isomorphic to the product ring
    F_p^{V x V} of dimension B^2, because fV is squarefree and splits completely
    over F_p (Chinese Remainder Theorem);
    (ii) the image of s in A is the evaluation vector (s(v_i, v_j)), so
    F_p[x1,x2]/I is isomorphic to F_p^{Z} where
    Z := {(v_i, v_j) such that s(v_i, v_j) = 0};
    (iii) hence I IS RADICAL, zero-dimensional, and equal to the full vanishing
    ideal I(Z) of the finite reduced point set Z contained in V x V;
    (iv) therefore the reduced Groebner basis of I in ANY monomial order, its
    cardinality, its maximum total degree, and the trivial-ideal flag are ALL
    determined by Z as a point set -- with the standard-monomial count equal to
    |Z| exactly -- and depend on the curve, on p, and on the coefficients of S_3
    ONLY through Z.
    (B) WHAT Z IS, EXACTLY. By the classical identity
    disc_{x2} s = 16 f(v) f(xR) -- verified exactly in Z[x1,x2,A,B] by this
    program's own EXP-SMON-e5cbe6 and recorded as a corollary of KN-FIND-a8990a
    -- and by Theorem C of that same record (the factor-base locus lies in the
    totally split locus), the fibre of Z over each v in V is EXACTLY the
    two-element set {x(R + P_v), x(R - P_v)} intersected with V, where P_v is a
    lift of v. So Z is the graph of a 2-valued algebraic correspondence
    restricted to the grid, |Z| has mean 4B^2/(p + O(sqrt p)) by KN-FIND-007, and
    the fibre degenerates to ONE element exactly on the branch locus
    f(v) f(xR) = 0 union {v = xR}, which KN-FIND-a8990a pins as the complete m=3
    branch locus.
    (C) THE CONSEQUENCE FOR RQ-ECDLP-001'S DECISION TARGET, WHICH IS THE POINT.
    At this question's declared scope (8, 10, 12 bits, so p <= 4096) with a factor
    base of a few dozen elements, the mean |Z| is O(1) and is most often 0. The
    committed metric groebner_basis_max_degree is therefore not a solving-degree
    proxy for the Semaev system at all: it is a staircase statistic of a
    zero-or-one-point set. The quantity that DOES grow is deg fV = B, an artifact
    of the encoding forced by Bezout (any plane predicate cutting out B points has
    degree at least B/3), not a property of the summation polynomial. PREDICTION:
    measured Groebner cost and degree depend on B and are essentially independent
    of p at fixed B. Expanding this measurement to medium scale would measure the
    computer algebra system, and the honest answer to "expand or redesign" is
    REDESIGN, with the derivation supplied rather than the fatigue report.
    (D) BOTH OUTCOMES ARE DELIVERABLES. If the predicted staircase matches, the
    instrument is closed at the inventor-protocol section 4 standard with a named
    obstruction (radicality via CRT), an argument (i)-(iv), and forward guidance
    (measure the graded Hilbert function of a system whose quotient is NOT a
    product of fields, i.e. m >= 3, or measure the sweep/MITM cost instead). If it
    does not match, then either the implementation is not computing what its
    docstring says (a harness defect of exactly the class KN-OPEN-5b3a08 already
    records) or the theorem is false, and either is worth more than the scaling
    study.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY
    EXPERIMENT. The tracked object is Z, the INCIDENCE PATTERN of the summation
    correspondence on the grid V x V -- which cells vanish, and nothing else. It
    is genuinely lossy: from Z one cannot recover S_3, the curve E, its
    coefficients, the field, or even the target beyond the constraints Z imposes;
    the projection collapses a bivariate polynomial with explicit coefficients to
    a subset of a B x B boolean matrix. The discarded data is discarded
    COMPATIBLY with the operations of the target, and this is the load-bearing
    half: the ring operations of F_p[x1,x2]/I factor through the CRT idempotent
    decomposition, whose idempotents are indexed by Z, so normal-form reduction,
    S-polynomial reduction and the entire Groebner computation act
    coordinatewise on F_p^{Z} and are determined by Z. Contrast the projection
    that FAILS the test and is deliberately not used: the pair (x1 + x2, x1 x2)
    of a decomposition, which loses nothing because the unordered pair is
    recoverable as the roots of a quadratic -- the KN-LIT-7595 worked failure this
    program already records.
    WHY THE THEOREM IS FORCED RATHER THAN PLAUSIBLE. Every step is finite-
    dimensional linear algebra over F_p and can be checked mechanically. fV is
    squarefree because V consists of DISTINCT values, which the harness enforces
    by construction (it skips repeats). fV splits completely over F_p because its
    roots are by definition elements of F_p. So (fV(x1), fV(x2)) is the vanishing
    ideal of the reduced grid and A is a product of B^2 copies of F_p, with no
    nilpotents anywhere. Adding any further polynomial to a product of fields
    kills a subset of coordinates and can do nothing else -- there is no room for
    a non-radical quotient, no room for embedded components, and no room for a
    solving degree that is not a staircase statistic. This is why the argument
    does not depend on the curve and why NO amount of scaling p can make the
    instrument informative about Semaev structure while the factor base is imposed
    by a squarefree split membership polynomial.
    WHERE THE ARGUMENT STOPS, STATED HERE AND NOT HIDDEN. It stops the moment the
    membership condition is not a product of distinct linear factors over F_p --
    for instance a factor base defined by an irreducible predicate, by a
    higher-degree curve, or over an extension field where Weil restriction makes
    membership free (catalogue A1-11). It also stops at m >= 3 unknowns, where the
    grid is V^m and the added summation equations no longer form a single
    evaluation vector. Those are exactly the settings the forward guidance names.

  novelty_status: unverified

  citations:
    - ref: harness/semaev.py
      provenance: internal
      claim: >-
        measure_s3_decomposition builds exactly the system
        [s3_expr(a,b).subs(x3, xR), fV1, fV2] with fV1 the product of (x1 - v)
        and fV2 the product of (x2 - v) over a factor base of DISTINCT on-curve
        x-coordinates, and calls sympy.groebner with modulus=p and order grevlex;
        it reports groebner_basis_size, groebner_basis_max_degree and
        is_trivial_ideal, and its own module docstring already labels these
        "implementation-bound proxies, never ... the theoretical degree of
        regularity". Also confirms that the s4_expr variable-collision bug of
        KN-OPEN-5b3a08 Q1 is now FIXED in the committed source
