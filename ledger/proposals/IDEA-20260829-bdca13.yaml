  assumptions:
    - >-
      p > 3 and the curve is in short Weierstrass form, matching RQ-ECDLP-001's
      declared scope (short_weierstrass, prime fields).
    - >-
      The factor base consists of DISTINCT x-coordinates of F_p-rational points.
      Both harness scopes satisfy this by construction; a factor base containing a
      repeated value would make fV non-squarefree and is the one input that breaks
      radicality, so it is checked as a precondition and not assumed.
    - >-
      The target is affine (the harness raises otherwise) and s is not identically
      zero on the grid, which fails only in the degenerate case V = {xR}.
    - >-
      sympy.groebner with modulus=p computes the reduced Groebner basis of the
      ideal generated by the inputs over F_p. If it instead computes over Z or
      mishandles the modulus, every committed observable in this lane is measuring
      something else -- which is itself one of the outcomes this test separates.

  proof_search_map:
    bottleneck: >-
      The step "solve the decomposition system by Groebner basis". This proposal
      asserts that at m = 2 with a split squarefree membership polynomial that
      step has no algebraic content beyond evaluating s on the grid, so its
      removal changes the reported cost model completely while changing no
      mathematics.
    baseline_embedding:
      parameter_slice: >-
        B = 1 and B = 2 with a planted decomposition. At B = 1 the grid is a
        single point and the ideal is either the maximal ideal (x1 - v, x2 - v) or
        the unit ideal; at B = 2 with exactly one vanishing cell the reduced
        Groebner basis must be exactly {x1 - v_i, x2 - v_j}. These are hand-
        checkable boundary cases the theorem must reproduce.
      reproduction_check: >-
        Frozen regression fixture: the exact instance, seed, factor base and
        target of an existing RQ-ECDLP-001 / EXP-SEMAEV run record, re-run through
        the harness AND through an independent Buchberger-Moeller computation of
        I(Z) built from Z alone. Exact equality of the two reduced bases,
        polynomial by polynomial, is the reproduction check. Any inequality halts
        the line and is reported as an instrument finding.
    observation_collision:
      observable: >-
        The triple (groebner_basis_size, groebner_basis_max_degree,
        is_trivial_ideal) that this question's committed runs report.
      distinct_preimage_search: >-
        REQUIRED, AND EXPECTED TO SUCCEED -- which is the whole point and is
        exactly why it must be run rather than argued. Construct two systems with
        the SAME observable and different ground truth: (a) a genuine Semaev
        instance whose Z is a single cell, and (b) a synthetic system
        (r(x1,x2), fV(x1), fV(x2)) with r a random bidegree-(2,2) polynomial
        chosen so that its vanishing set on the grid is the SAME single cell.
        Prediction: byte-identical Groebner observables. A collision here does not
        falsify the measurement, it CALIBRATES it: it establishes that the
        observable carries no summation-polynomial information and bounds every
        conclusion drawn from it. Reporting a Semaev solving-degree number without
        having run this search is prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question "what does the toy S_3 Groebner cost measure" into
          the CRT decomposition of the quotient ring, where it becomes the exact
          equality F_p[x1,x2]/I = F_p^{Z} -- a dimension and vanishing condition
          rather than a solver behaviour. Obligations discharged separately:
          encoding (fV squarefree and split), completeness (Z is the whole
          variety), soundness (no nilpotents, so no embedded structure is lost),
          transfer (fails at m >= 3 and for non-split membership, stated), cost
          loss (none; the reduction is free).
        predicted_gain: >-
          Replaces a per-cell empirical scaling curve with one integer |Z| per
          instance plus a combinatorial staircase, at zero compute. The gain is in
          what the number MEANS, not in attack cost. NO ATTACK EXPONENT IS MOVED.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (a given Groebner triple) and vary the
          forgotten structure (the curve, p, the coefficients of s), then look for
          an intrinsic invariant separating the resulting systems. The prediction
          is that NONE exists at m = 2, because the fibre of the observable over Z
          is the whole space of bidegree-(2,2) polynomials with that vanishing
          pattern.
        predicted_gain: >-
          A clean statement of what the instrument cannot see, which is the
          content of the redesign recommendation.
    quantifier_order: >-
      CLAIMED: FORALL primes p > 3, FORALL short-Weierstrass E over F_p, FORALL
      finite sets V of DISTINCT x-coordinates of rational points, FORALL affine
      targets R, EXISTS a finite reduced set Z contained in V x V such that FORALL
      monomial orders, the reduced Groebner basis of (s, fV(x1), fV(x2)) equals
      the reduced Groebner basis of I(Z) in that order.
      The dangerous weaker reading, which is NOT claimed and would be vacuous:
      FORALL instances EXISTS SOME set of points such that the bases agree -- true
      of every zero-dimensional radical ideal by definition. The content is that Z
      is given EXPLICITLY and in advance by the group law, before any Groebner
      computation, as the grid restriction of the correspondence
      v maps to {x(R + P_v), x(R - P_v)}.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m = 2 with a factor base imposed by a squarefree completely split
        membership polynomial over F_p, the Groebner observables of the Semaev
        decomposition system carry exactly the information in Z and no more."
        It can NEVER certify anything about m >= 3, about factor bases defined by
        irreducible or higher-degree predicates, about extension fields, or about
        the difficulty of the ECDLP. It also does not certify that the DREG lane's
        boolean chained systems are similarly degenerate -- those have a different
        encoding and are explicitly out of scope.
      nearby_object_control: >-
        THE m >= 3 INSTANCE, and it is blocking. Build the S_4 system
        (S_4(x1,x2,x3,xR), fV(x1), fV(x2), fV(x3)) at the same p and B. The
        quotient is still a product of fields by the same CRT argument, but the
        SEARCH is now over a 3-dimensional grid and the added structure is a
        hypersurface rather than an evaluation vector, so the degeneracy argument
        must NOT extend unchanged. If the method concludes the same thing at
        m = 3 as at m = 2 with no distinction, it has not identified the
        load-bearing structure and is measuring the membership encoding only.
    proof_obligations:
      - claim: >-
          fV squarefree and completely split implies A is a product of fields.
        responsibility: correctness
      - claim: >-
          Adding s to A kills exactly the coordinates where s(v_i,v_j) is nonzero.
        responsibility: correctness
      - claim: >-
          I is radical and equals I(Z).
        responsibility: strictness
      - claim: >-
          The fibre of Z over v is {x(R+P_v), x(R-P_v)} intersected with V.
        responsibility: correctness
      - claim: >-
          The expected size of Z is 4B^2/p + O(B/sqrt p) at a uniform random
          factor base.
        responsibility: size
      - claim: >-
          Harness observables equal the independently computed I(Z) observables on
          the frozen fixture.
        responsibility: baseline
      - claim: >-
          The random-(2,2) null reproduces identical observables at equal Z.
        responsibility: interface
      - claim: >-
          The m=3 nearby-object control is NOT concluded degenerate.
        responsibility: scope

  predictions:
    - metric: >-
        agreement between harness-reported (groebner_basis_size,
        groebner_basis_max_degree, is_trivial_ideal) and the same three
        quantities computed independently from Z by Buchberger-Moeller
      direction: different
      minimum_effect: >-
        FORCED EXACT on every cell of a 200-cell grid (p in {2^8, 2^10, 2^12},
        B in {4, 8, 16, 32}, 5 seeds, targets chosen to give |Z| in {0,1,2,3}).
        A single disagreement is either a harness defect or a refutation of the
        structure theorem, and the record commits in advance to reporting which
        by re-deriving the disagreeing cell by hand.
    - metric: >-
        standard-monomial count of the computed reduced Groebner basis versus the
        size of Z
      direction: different
      minimum_effect: >-
        FORCED EQUAL, exactly, in every non-degenerate cell. This is the sharpest
        single number in the proposal: the dimension of F_p[x1,x2]/I equals |Z| is
        an integer identity that can fail.
    - metric: >-
        Groebner observables of the Semaev system versus a random bidegree-(2,2)
        null system with the same grid vanishing pattern
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL, and that prediction is recorded here in advance so
        that a match is a CONFIRMED CONTROLLED NULL rather than a disappointment.
        Any difference at all in the reduced basis (beyond relabelling of the
        coordinate values) falsifies part (A)(iv).
    - metric: >-
        sympy Groebner wall time and reported max degree as functions of B at
        fixed p, and of p at fixed B
      direction: different
      minimum_effect: >-
        PREDICTED: a clean power law in B with exponent at least 2 (the dense
        bivariate linear algebra on about B^2 monomials), and NO systematic trend
        in p at fixed B beyond coefficient-arithmetic cost, i.e. a fitted
        p-exponent whose magnitude is below 0.2 across p = 2^8..2^16. A fitted
        p-exponent above 0.5 would mean the instrument sees something the theorem
        says is not there and is the most interesting possible negative.
    - metric: >-
        fibre size of Z over a factor-base element as a function of the branch
        locus
      direction: different
      minimum_effect: >-
        FORCED: the two candidate partners x(R + P_v) and x(R - P_v) coincide
        EXACTLY when f(v) f(xR) = 0 or v = xR, and are distinct otherwise. This is
        an exact point prediction over the complete enumeration of V at every
        tested cell; one counterexample refutes the identity
        disc = 16 f(v) f(xR) as applied here.
    - metric: >-
        the m = 3 (S_4) nearby-object control
      direction: different
      minimum_effect: >-
        FORCED NEGATIVE: the degeneracy argument must NOT reproduce at m = 3. If
        the S_4 system's observables are also a pure function of a grid incidence
        set with no additional structure, the method is measuring the membership
        encoding and not the arity, and the scope of every conclusion narrows
        accordingly.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, one page, HARD GATE). Write the CRT argument and
      check the B = 1 and B = 2 boundary cases by hand. If the B = 2 planted case
      does not give {x1 - v_i, x2 - v_j}, stop.
      STAGE 1 (minutes). Implement Z directly from the group law: for each v in V
      compute the two points R + P_v and R - P_v and take their x-coordinates,
      intersect with V. Independently implement I(Z) by Buchberger-Moeller. No
      Semaev polynomial is used in this path at all -- that independence is the
      whole value of the check.
      STAGE 2 (minutes to an hour, the main grid). 200 cells: p in {2^8, 2^10,
      2^12} plus two out-of-scope calibration primes 2^14 and 2^16 flagged as
      such, B in {4, 8, 16, 32}, 5 seeds, targets stratified so that |Z| takes
      each of 0, 1, 2, 3 at least 20 times (stratification is necessary because
      at these parameters random targets give |Z| = 0 the great majority of the
      time and an unstratified grid would be almost all trivial ideals).
      Compare harness observables against Stage 1 field by field.
      STAGE 3 (minutes, BLOCKING NULL). The random bidegree-(2,2) null at matched
      Z. Identical pipeline, identical metrics.
      STAGE 4 (minutes, BLOCKING CONTROL). The m = 3 / S_4 nearby object.
      STAGE 5 (zero compute). Report; if everything matches, propose the section-4
      closure of the instrument with its forward guidance, as a proposal for the
      Coordinator and never as a status change.
      ENVELOPE, STATED EXPLICITLY BECAUSE THE PROGRAM HAS A LIVE MEMORY WALL.
      The largest object anywhere in this test is a bivariate polynomial in two
      variables of degree at most 32 in each, i.e. at most 1089 monomials --
      roughly seven orders of magnitude below the 768,212-column monomial space
      reported for the GOAL-DREG-001 n=15 D=6 attempt. This test CANNOT reproduce
      that stop because it never builds a Macaulay matrix; and that stop was a
      resource_exhaustion INFRASTRUCTURE failure under AGENTS.md rule 3, never
      negative mathematical evidence about d_reg or anything else. Peak RSS here
      is predicted below 500 MB and is a required reported metric so the
      prediction can fail.
    controls:
      - >-
        RANDOM BIDEGREE-(2,2) NULL at matched grid vanishing pattern (blocking):
        observables must be identical. This is the inventor-protocol section 3
        null-object control and no Semaev-specific statement may be made without
        it.
      - >-
        SATISFIABLE AND UNSATISFIABLE ARMS: targets with |Z| = 0 must give the
        unit ideal and is_trivial_ideal true; targets with |Z| at least 1 must
        not. An instrument that reports a trivial ideal where a certified
        decomposition exists is broken and the line halts.
      - >-
        CERTIFICATE ARM, required by RQ-ECDLP-001's own constraint: every cell
        with |Z| at least 1 emits a decomposition certificate that an independent
        verifier re-checks by point addition (verify_decomposition_certificate),
        and every cell with |Z| = 0 emits the sorted 2B-element candidate list as
        a CHECKABLE NEGATIVE CERTIFICATE -- a verifier recomputes it in
        O(B log B) and confirms disjointness from V. Today the negative outcome is
        a solver self-report; this makes it independently verifiable.
      - >-
        m = 3 / S_4 NEARBY-OBJECT CONTROL (blocking): the argument must not
        extend unchanged.
      - >-
        BOUNDARY CASES B = 1, 2 computed by hand before any battery runs.
      - >-
        FACTOR-BASE DISTINCTNESS PRECONDITION checked per cell; a repeated value
        would break squarefreeness and is the theorem's one structural
        precondition.
    required_metrics:
      - 'harness basis size, max degree and trivial flag, per cell'
      - 'independently computed I(Z) basis, size, max degree, standard monomials'
      - 'size of Z computed from the group law with no use of S_3'
      - 'fibre-size table against the branch locus f(v) f(xR) = 0 union v = xR'
      - 'null-system observables at matched Z'
      - 'S_4 control observables'
      - 'fitted B-exponent and p-exponent of Groebner wall time and max degree'
      - 'peak RSS and wall time per cell'
      - 'certificate verification pass/fail, positive and negative arms'

  falsification_conditions:
    - >-
      Any cell where the harness observables differ from the independently
      computed I(Z) observables. Either the theorem is false or the harness is not
      computing the stated ideal; the record commits in advance to hand-deriving
      the disagreeing cell and reporting which, and NOT to editing any prior
      record.
    - >-
      Standard-monomial count differs from |Z| in any non-degenerate cell. The
      radicality argument fails and part (A)(iii) is refuted.
    - >-
      The random-(2,2) null gives DIFFERENT observables at matched Z. Part
      (A)(iv) is refuted, and the surviving difference is a genuine
      summation-polynomial signal in the Groebner data -- the most valuable
      possible outcome of this proposal and the reason the null is run rather
      than assumed.
    - >-
      A fibre of Z over some v has two coincident candidates OFF the branch locus,
      or two distinct candidates ON it. The discriminant identity as applied here
      is wrong and part (B) collapses.
    - >-
      The fitted p-exponent of Groebner cost at fixed B exceeds 0.5. The
      instrument responds to p in a way the theorem forbids.
    - >-
      The S_4 control reproduces the degeneracy unchanged. The conclusion is
      re-scoped from "m = 2 is degenerate" to "the membership encoding is
      degenerate at every arity", which is a broader and more consequential
      finding requiring its own record.
    - >-
      Everything matches. The instrument is closed as a Semaev meter at the
      section-4 standard, RQ-ECDLP-001's decision target is answered REDESIGN with
      a derivation attached, and the forward guidance names what remains.

  confounders:
    - >-
      STRATIFICATION BIAS. Targets are deliberately stratified by |Z| because
      random targets at these parameters give |Z| = 0 almost always. The
      stratification is a sampling design, not a result, and no yield or coverage
      statement may be read off this battery -- yield questions belong to
      KN-FIND-007 and to the sibling proposal IDEA-20260829-c6e7a4.
    - >-
      SYMPY MODULUS SEMANTICS. sympy.groebner with modulus=p must genuinely
      compute over F_p. If it lifts to Z or applies the modulus only at output,
      the observables are of a different ideal. This is checked directly by
      planting a cell whose answer over Z and over F_p provably differ.
    - >-
      REDUCED VERSUS NON-REDUCED BASES. Basis size is order- and reduction-
      dependent; the comparison is made only between REDUCED bases in the SAME
      order, and the order is frozen (grevlex) before any cell runs.
    - >-
      DEGENERATE TARGETS. If xR is in V, or f(xR) = 0, the leading coefficient
      (xR - v)^2 vanishes for some v and the fibre analysis changes. These cells
      are enumerated and reported separately rather than excluded silently.
    - >-
      SCOPE LEAKAGE TO DREG. The boolean chained Semaev systems of
      GOAL-DREG-001 use a DIFFERENT encoding (Weil-restriction style, boolean
      field equations, m = 3 chained) and this theorem says nothing about them.
      Any reader tempted to conclude the DREG measurements are also degenerate is
      reading beyond the record.

  interpretation_limits:
    - >-
      This is an INSTRUMENT result, not a mathematical result about the ECDLP or
      about summation polynomials. It says what one measurement can and cannot
      see. No attack, no exponent, no hardness claim.
    - >-
      Scoped to m = 2, prime fields, short Weierstrass, squarefree completely
      split membership polynomials, and p <= 2^16. It does not transfer to
      extension fields, to irreducible membership predicates, or to m >= 3.
    - >-
      A closure of this instrument is NOT a closure of KN-OPEN-002. The growth of
      the solving degree for prime-field summation-polynomial systems remains
      open; what this record would establish is that the current toy instrument
      cannot answer it.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the four nearest
      records read in full; the external literature was NOT searched for this
      specific statement, and the classical machinery (Buchberger-Moeller,
      Cerlienco-Mureddu) is cited from memory only. The mathematics is elementary
      and may well be folklore; the honest status is unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of size B drawn uniformly from the x-coordinates of
        E(F_p), and a uniformly random target R, the size of Z is distributed as
        Binomial(2B, (B - O(1))/|X|) with |X| the number of x in F_p for which
        f(x) is a square, equal to (p - t - r)/2, so the expected size of Z is
        4B^2/p times (1 + O(t/p)) and the probability that Z is empty is
        exp(-4B^2/p) times (1 + o(1)).
      rigorous_support: >-
        The RIGOROUS ingredient is twofold and both halves are already committed
        in this repository: the exact conservation double count of KN-FIND-007
        fixes the mean with deviation measured at exactly 0, and the exact
        discriminant identity disc = 16 f(v) f(xR) with Theorem C of
        KN-FIND-a8990a fixes the fibre size at exactly 2 off the branch locus, so
        there are exactly 2B candidates and not an estimated number. The
        CLASSICAL DISTRIBUTION IMITATED is the independent-uniform occupancy /
        Poissonisation model: the 2B algebraically determined candidate
        x-coordinates are assumed to behave, with respect to membership in V, like
        2B independent uniform draws from X. This is the same imitation that makes
        the Gaudry-Diem 1/n! decomposition probability equal the conservation
        mean, as KN-FIND-007 records.
      validation_plan: >-
        SAMPLE: exhaustive over the complete target set at p in {2^8, 2^10, 2^12}
        (every target, not a sample) and 2000 random targets at p in {2^14, 2^16},
        for 12 generated curves and B in {4, 8, 16, 32}, 5 factor-base seeds.
        COMPARISON DISTRIBUTION: the exact Binomial(2B, (B-1)/|X|) with |X|
        computed from the true curve order via point counting, NOT approximated by
        p/2 -- the trace term is the whole content of the check at these sizes.
        TAIL CHECKS: (a) the observed maximum size of Z against the Binomial upper
        tail at the 1/1000 level; (b) the observed count of empty-Z targets
        against exp(-mean), which is the coverage bound min(1, mean) of
        KN-FIND-007 instantiated; (c) the chi-square goodness of fit at the 1%
        level per cell, with the number of failing cells reported rather than the
        best cell. SAMPLED PARAMETERS RECORDED: p, curve coefficients, curve
        order, trace, |X|, B, seed, target-selection rule. TRANSFER ASSUMPTIONS:
        NONE is claimed. Nothing here is validated above p = 2^16 and no
        extrapolation to cryptographic scale is performed or licensed.
    - id: H2
      statement: >-
        sympy's grevlex Groebner routine with modulus=p returns the REDUCED
        Groebner basis of the ideal generated by its inputs over F_p, so that the
        reported basis size and maximum total degree are properties of the ideal
        and not of the routine's internal strategy.
      rigorous_support: >-
        This is an implementation property, not a mathematical one, and the
        harness's own module docstring already declines to treat its outputs as
        theoretical quantities ("implementation-bound proxies, never ... the
        theoretical degree of regularity"). The rigorous anchor is that the
        reduced Groebner basis of an ideal in a fixed monomial order is UNIQUE, so
        two correct implementations must agree exactly -- which converts the
        assumption into a testable equality rather than a matter of trust.
      validation_plan: >-
        SAMPLE: every cell of the Stage 2 grid. COMPARISON: an independent
        Buchberger-Moeller computation of I(Z) that never touches S_3, plus a
        second independent Groebner implementation where available. TAIL CHECK:
        the cells with the largest B, where implementation differences are most
        likely to surface. A disagreement between two correct implementations is
        an INSTRUMENT FAILURE and is reported as such, never as a finding about
        solving degree.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for any
      hard problem. What it does state as a cost fact, and what is directly
      relevant to the lane's accounting, is that the m = 2 decomposition test has
      an unconditional O(B) group-operation / O(B log B) sorting solution via the
      correspondence v maps to {x(R + P_v), x(R - P_v)}, which is the per-trial
      charge KN-FIND-8f2c90 already commits to; the Groebner route at the same
      task costs at least the dense bivariate linear algebra on about B^2
      monomials. That is a polynomial overhead of the instrument, not an advance
      in either direction.
    memory_exponent: >-
      O(B) for the derivation and the sweep; O(B^2) monomials for the Groebner
      instrument, which at this question's parameters is under 10^3 coefficients.
      The entire test runs in well under 1 GB and is predicted under 500 MB, which
      is a reported metric so the prediction can fail.
    best_known: >-
      For prime-field ECDLP: Pollard rho at 0.886*sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006). For the m = 2 decomposition subtask: the O(B)
      signed-sum sweep, with the BKK mixed-volume constant improvement to about
      B/2 measured in KN-FIND-8f2c90. This record improves neither and claims
      neither.
    hidden_overhead: >-
      The entire content hides inside "with a squarefree completely split
      membership polynomial". That qualifier is not a technicality: a factor base
      imposed by an irreducible predicate, or by a domain restriction as in the
      extension-field construction (catalogue A1-11), gives a quotient that is NOT
      a product of copies of F_p and to which none of this applies. Disclosed
      here and required in every downstream summary.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced and no cryptanalytic tradeoff
      exists. The instrument's own time-memory behaviour is measured for
      feasibility bookkeeping only.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY FRONTIER ENTRY ENUMERATED IN CATALOGUE A1-13.
    As an ATTACK: mounts none, so dominated by every row on every axis -- rho
    (N^{1/2}, O(1)), multi-target rho, BSGS (N^{1/2}, N^{1/2}), vOW, the
    preprocessing frontier, MITM index calculus (N^{1/2+1/m}, N^{1/2}), two-term
    index calculus at optimum. Checked across time, memory and data/queries. As a
    STRUCTURAL STATEMENT about the toy S_3 system: the incumbents are
    KN-FIND-a8990a (whose Theorem C and discriminant corollary this record USES
    and does not compete with) and the harness's own docstring caveat; this record
    dominates the latter on precision, replacing "these are proxies" with an exact
    identification of what the proxies equal. As an INSTRUMENT: dominated by any
    graded-Hilbert-function instrument on a non-degenerate encoding, which is
    exactly what its forward guidance recommends building. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent moved in either
    direction. Quantified instrument delta: replaces three empirical observables
    of unknown meaning with one integer |Z| plus a staircase determined by it;
    predicts the expected size of Z as 4B^2/p, which at RQ-ECDLP-001's own
    declared scope (p <= 2^12, B <= 32) is at most 1.0 and is 0 for the large
    majority of targets; converts the negative outcome from a solver self-report
    into an O(B log B) independently checkable certificate; and, if confirmed,
    answers this question's decision target with REDESIGN plus a derivation
    instead of a scaling study whose measured quantity would be a computer
    algebra system.

