idea:
  id: IDEA-20260805-d426f9
  question_id: RQ-XEDN-003
  added: '2026-08-05'
  title: >-
    The prescribed-support cost equation for the function-field xedni relation
    source: a parameter count that forces exactly four free prescribed sections,
    re-derives the measured alpha = 3 from dimension alone, and prices every
    further section at p^3
  class: cost_architecture

  claim: >-
    The XEDN lane measured the wrong support. An index-calculus-style relation
    source does not need a relation among ALL sections of a surface; it needs a
    relation supported on the PRESCRIBED sections -- the lifts of the target
    points -- and a minimum taken over a larger set can only be smaller, so the
    census metric neither bounds nor estimates the attack-relevant quantity. Put
    the prescribed support back in and a cost equation appears that no XEDN
    record contains. Over F_p(t) with deg a <= 4 and deg b = 6, prescribing k
    section x-coordinates and solving for the surface is a system with 12 + 4k
    unknowns (5 for a, 7 for b, 4 per y_i) and 7k equations (one per coefficient
    of the degree-6 identity y_i^2 = x_i^3 + a x_i + b). The expected number of
    surfaces carrying a prescribed k-tuple therefore scales as p^(12 - 3k). TWO
    FORCED CONSEQUENCES, both derived before any run: (1) k = 4 is the exact
    boundary of the free regime -- up to four prescribed sections can be planted
    at O(1) cost, and the fifth and each one after it costs a factor of p^3;
    (2) that p^3 is, independently, the alpha = 3 this program already MEASURED
    as P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) in DEC-20260724-021, so a dimension
    count and an exhaustive census agree on the same exponent by two unrelated
    routes. Combined with the rank ceiling of the Mordell-Weil lattice (at most 8
    independent sections, at most 240 sections total, on any chi = 1 surface),
    this gives the first end-to-end cost statement for the route: a relation
    supported on k prescribed points costs about p^(3(k-4)) surface trials for
    k > 4, and requires the planted sections to be DEPENDENT, which is a further
    condition whose exponent is exactly what should be measured next. NOTHING IS
    CLAIMED HERE ABOUT WHETHER THE ROUTE WORKS. DEC-20260724-021 publishes a list
    of sentences that must not be quoted from it, and this record states none of
    them: it does not say the multi-section or Mordell-Weil relation-source route
    is closed, and it does not say no lifting-based relation source exists over
    F_p(t). It says what a relation costs under a stated model, and it names the
    measurement that would move the number.

  object_first_candidate:
    tracked_object: >-
      The PRESCRIBED-SUPPORT relation lattice: for a fixed tuple
      (Q_1, ..., Q_k) of target points and a surface S carrying sections P_i
      specialising to them, the lattice
      L(S; Q) = {c in Z^k : c_1 P_1 + ... + c_k P_k = O in MW(S/F_p(t))},
      followed through the computation together with its cost of production. The
      lane tracked instead the relation lattice of ALL observed sections and
      reported one scalar from it. The difference is not cosmetic: L(S; Q) can be
      zero when the global relation lattice is large, and the global minimum can
      be 1 when L(S; Q) is zero. The object carried here is (L(S; Q), cost(S)) as
      a pair, because a relation lattice with no price attached is not a relation
      source.
    established_families_off_limits: >-
      Off-limits as the primary lens: Semaev summation polynomials and
      solving-degree instrumentation; classical xedni-as-lift-to-Q; descent and
      Selmer machinery; isogeny/CM/class-group transfers; generic-group lower
      bounds; rho and kangaroo birthday search. Index calculus is NOT off-limits
      but is used here only as the CONSUMER whose requirement (about B
      independent relations over a factor base of size B) sets the target, never
      as the mechanism -- the mechanism proposed is a dimension count over a
      Weierstrass parameter space, which is not a member of any established ECDLP
      attack family in this corpus.
    newness_score: >-
      The parameter count is elementary linear algebra and someone has certainly
      done it somewhere; what is checkable is that it is not in this corpus. No
      XEDN experiment contract (EXP-XEDN-002 through -007), no XEDN evidence
      record (EV-XEDN-001 through -006), and no XEDN knowledge finding
      (KN-FIND-005, -010, -011) states a cost per prescribed section, a
      prescribed-support relation lattice, or a k = 4 boundary. What the corpus
      does have is DEC-20260724-021's measured alpha = 3 under the UNIFORM
      per-slot measure and its red team's note that the attack uses the
      PRESCRIBED-POINT measure instead -- a distinction recorded and then never
      converted into a cost. This proposal is that conversion.
    testability_score: >-
      High and cheap. The k = 4 boundary and the p^(12-3k) scaling are testable
      by solving small linear systems over F_p in pure Python: for each k, draw k
      random x-polynomials, solve for (a, b, y_1..y_k), and count solutions. No
      elliptic-curve arithmetic is needed for the counting arm at all. The
      dependence condition needs the group law over F_p(t), which is pure-Python
      polynomial arithmetic (sympy and sage are ABSENT in this environment,
      measured this session; numpy 2.4.6 is present and the frozen predicate
      module experiments/EXP-XEDN-001/xedni_sections.py imports cleanly).
    survival_score: >-
      The dimension count survives as long as the system behaves like a generic
      one of its shape, which is exactly the assumption that fails interestingly:
      y_i^2 = ... is QUADRATIC in y_i, so solvability carries a square-class
      condition with its own factor of about 2^-k, and the count is an
      expectation rather than an existence statement. It dies outright at
      chi >= 2 (deg b >= 7), where the parameter budget changes and the rank
      ceiling of 8 is replaced by up to 18.

  mechanism: >-
    THE CONSUMER'S REQUIREMENT. An index-calculus relation source must produce
    relations among prescribed points: given target points Q_1, ..., Q_k in
    E(F_p) drawn from a factor base or from the challenge, produce integers c_i,
    not all zero, with sum c_i Q_i = O. The function-field xedni idea is to lift
    the Q_i to sections P_i of a surface over F_p(t) that specialises to E at
    some t_0, find a relation among the P_i in the Mordell-Weil group, and
    specialise it back. Two facts about this pipeline are missing from every
    record in the lane.

    FACT 1 -- SUPPORT. A relation is useful only if it is supported on the
    prescribed points. The lane's metric is min over ALL nonzero relations among
    ALL enumerated sections of the infinity norm. Minimisation over a superset is
    monotone downward, so that metric is a LOWER BOUND on nothing the attack
    needs and an UPPER BOUND on nothing either: the prescribed-support lattice
    L(S; Q) can be {0} on a surface whose global relation lattice has rank 8.
    Conversely the global minimum is 1 on essentially every section-rich surface
    (see IDEA-20260805-4ddf4e), which is why the metric never moved. The
    attack-relevant statistic is (a) whether L(S; Q) is nonzero and (b) the
    infinity norm of its minimal-support vectors, which by the affine-mark
    argument of IDEA-20260805-4ed1b1 lies in {1,2,3,4,6}.

    FACT 2 -- PRICE. Cost bookkeeping for this route is per-attempt cost times
    inverse success probability, and the success probability has never been
    written down for prescribed points. Write it down.
      Unknowns. a has 5 coefficients (deg <= 4). b has 7 (deg 6 exactly, so the
      leading one is nonzero). For each prescribed section, x_i is FIXED by the
      instance (it is the lift of the target's x-coordinate, 3 coefficients, not
      free) and y_i is free with 4 coefficients (deg <= 3). Total: 12 + 4k.
      Equations. Each section imposes the polynomial identity
      y_i^2 = x_i^3 + a x_i + b. Both sides have degree at most 6 -- deg x_i^3
      <= 6, deg(a x_i) <= 6, deg b = 6 -- so the identity is 7 scalar equations
      over F_p. Total: 7k. The system is LINEAR in (a, b) at fixed (x_i, y_i) and
      QUADRATIC in each y_i.
      Expected solution count. For a system of 7k equations in 12 + 4k unknowns
      over F_p behaving generically, the expected number of solutions is
      p^(12 + 4k - 7k) = p^(12 - 3k).
    Reading the exponent 12 - 3k:
      k = 1: p^9      -- abundant, no constraint.
      k = 2: p^6      -- abundant. THIS IS THE REGIME THE CENSUS SAMPLER USES:
                         EXP-XEDN-005's fiber_find_rich_surfaces draws two
                         sections and solves for (a,b), and it succeeds easily,
                         which is what a 6-dimensional solution family predicts.
      k = 3: p^3      -- still abundant.
      k = 4: p^0      -- THE BOUNDARY. Exactly determined; expect O(1) surfaces
                         per prescribed 4-tuple.
      k = 5: p^-3     -- expect one surface per about p^3 prescribed 5-tuples.
      k: each section beyond the fourth multiplies the cost by p^3.
    THE CROSS-CHECK, AND IT IS THE STRONGEST THING IN THIS RECORD. That marginal
    p^3 is not a new number. DEC-20260724-021 measured, exhaustively and with an
    independently re-derived closed form, the per-slot lift probability
    P_lift(p) = (1 - 2/p + p^-3)/(2 p^3), i.e. alpha = 3, on this very family --
    by counting squares, not by counting parameters. Two unrelated derivations,
    one combinatorial and one dimensional, produce the same exponent 3 for the
    marginal cost of one more prescribed section. That agreement is either real
    structure or a coincidence, and deciding which is cheap.

    FACT 3 -- THE CEILINGS. On a chi = 1 surface with irreducible fibres the
    Mordell-Weil lattice is E8: at most 8 independent sections and at most 240
    sections of the free-x shape, absolutely, for every p. So one surface can
    carry at most 8 independent relations' worth of structure and at most 240
    prescribed points of this shape. A relation supported on k prescribed
    sections requires those sections to be DEPENDENT, hence k > rank of their
    span; with k <= 4 free-plantable sections, a relation needs their span to
    have rank <= 3, which is a proper closed condition on the solution family and
    carries its own exponent -- call it delta, currently UNKNOWN and the single
    most useful number this proposal asks for.

    THE COST EQUATION, ASSEMBLED. Under the model above, the expected number of
    surface trials to obtain one relation supported on k prescribed points is
      T(k, p) ~ 2^k * p^(max(0, 3(k-4))) * p^delta,
    where the 2^k is the square-class factor from the quadratic y_i (each
    identity requires the relevant leading constant to be a square, which the
    census code handles explicitly by testing both signs), the p^(3(k-4)) is the
    dimension deficit, and p^delta prices the dependence condition. Every factor
    is stated so it can be measured separately -- which is the validation-ladder
    discipline, isolate each assumption the analysis rests on and measure it at a
    scale where measurement is possible. NOTHING IS ASSERTED ABOUT T's VALUE:
    delta is unmeasured, the genericity behind p^(12-3k) is unproved, and the
    equation is offered as the object to falsify, not as a result.

    WHY THIS IS THE EXPONENT-RELEVANT QUESTION AND THE CENSUS WAS NOT. The census
    asked whether a coefficient grows. The affine-mark argument says it cannot,
    in this window, ever. The cost equation asks what a relation costs, which is
    the quantity that decides whether a relation source is worth anything, and it
    is the quantity that the consumer (index calculus over a factor base of size
    B) actually consumes: B relations at T(k,p) trials each, against a Pollard
    rho baseline of about sqrt(N) group operations at negligible memory. Writing
    T down and measuring delta either produces a number that can be compared to
    sqrt(N) -- the first such comparison in this lane -- or shows the model is
    wrong at a specific measured factor. Both are deliverables and neither is a
    closure.

  novelty_status: unverified

  literature_context:
    - >-
      ledger/decisions/DEC-20260724-021.yaml. READ IN FULL THIS SESSION. Supplies
      the measured P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) with alpha = 3 under the
      UNIFORM per-slot measure, the note that the attack uses the prescribed-point
      measure instead, the in-corpus statement that the counted sections are
      height-2 E8 roots with absolutely bounded relation coefficients, and the
      published forbidden-sentence list that binds this record verbatim. Its own
      limitations also record that "alpha = 3 is the naive square-density
      codimension count, NOT the Jacobson-Koblitz-Silverman-Stein-Teske
      prediction" -- which is exactly why the dimensional re-derivation offered
      here is a check on that reading rather than a restatement of it.
    - >-
      experiments/EXP-XEDN-005/implementation/run_census.sage. READ IN FULL THIS
      SESSION. The function fiber_find_rich_surfaces implements the k = 2 case of
      the construction analysed here, including the divisibility test that a
      polynomial quotient exists, the deg-a and deg-b filters, and the
      consistency check against the second section. Every statement in this
      record about how the census obtained its surfaces comes from that file.
    - >-
      Jacobson, Koblitz, Silverman, Stein and Teske on the failure of xedni
      calculus, held here as KN-LIT-021. NOT READ -- relayed claim. Used only to
      name the obstruction the literature is said to identify
      (relation-coefficient growth) and to record that it is a DIFFERENT
      obstruction from the cost obstruction priced here. Nothing about their
      argument is reproduced or relied on.
    - >-
      Silverman's original xedni calculus. NOT READ -- relayed claim. Named only
      to locate the family; no parameter, bound or claim from it is used.

  lossy_projection_identifiability_audit:
    projection: >-
      (ECDLP instance, target tuple Q) --> the set of surfaces carrying
      prescribed lifts of Q --> for each, the prescribed-support relation lattice
      L(S; Q) --> (is it nonzero, its minimal-support infinity norms) together
      with the number of trials spent.
    what_is_discarded: >-
      The surface, the non-prescribed sections, the full Mordell-Weil group, and
      the specific lifts. Retained: a rank-and-norm summary of one sublattice of
      Z^k, plus a cost counter.
    why_genuinely_lossy: >-
      Genuinely lossy -- many surfaces give the same L(S; Q) -- and lossy in a
      way that matters, because the discarded part (which surface) is exactly
      what the attacker is free to re-draw, so discarding it is what makes the
      object a cost model rather than a description of one instance.
    why_compatible_with_the_operations: >-
      Compatible: specialisation MW(S/F_p(t)) -> E(F_p) at a good fibre is a
      group homomorphism, so any relation in L(S; Q) maps to a relation among the
      Q_i. The retained part therefore propagates deterministically through the
      one operation the attack performs. This is the property the lane's global
      relation-norm metric does NOT have, since a global relation supported off
      the prescribed set specialises to a relation among points the attacker did
      not ask about.
    is_it_only_a_change_of_coordinates: >-
      NO, and both failure modes were checked. Not a change of coordinates: the
      map from a surface to its prescribed-support relation lattice is heavily
      non-injective and cannot be inverted. Not the constant/mirror failure
      either -- and here is the check that decides it, stated before any run: the
      indicator "L(S; Q) is nonzero" MUST vary across surfaces at fixed Q, since
      at k = 4 the generic solution family has rank-4 independent sections
      (L = {0}) while a proper closed subfamily has rank <= 3 (L nonzero). If the
      indicator turns out to be constant -- always 0 or always nonzero -- across
      the sampled surfaces, the object has zero comparator spread and this
      proposal fails on its own test rather than on a later one. That is the
      first thing the paired experiment measures.

  assumptions:
    - >-
      The prescribed x_i are FIXED by the instance and are not free. If an
      attacker may choose the lifts' x-polynomials freely (rather than being
      handed them by the target points), the count changes to 12 + 7k unknowns
      against 7k equations and every k is free -- which is the census sampler's
      situation and precisely NOT the attacker's. The distinction between these
      two counts is the whole content of "prescribed" and this record turns on
      it.
    - >-
      Genericity of the solution count: the expected p^(12-3k) is a dimension
      heuristic over a finite field, not an existence theorem. It is numbered
      HEUR-P1 and is measured directly.
    - >-
      Squarefree discriminant and chi = 1, so the rank ceiling 8 and the section
      ceiling 240 hold. Outside the window they do not.
    - >-
      Specialisation of a Mordell-Weil relation to a relation among the target
      points requires a fibre of good reduction and injectivity of the
      specialisation map on the relevant subgroup; the first is checkable per
      fibre, the second is NOT automatic and is declared UNRESOLVED here rather
      than assumed. A relation that dies under specialisation is worth nothing to
      the attack, and no arm of this proposal assumes it survives.

  predictions:
    - metric: >-
        solution_count_exponent: log_p of the mean number of (a, b, y_1..y_k)
        solutions per prescribed k-tuple of x-polynomials, for k in {1,2,3,4,5},
        at p in {7,13,19,31}, at least 2000 tuples per cell
      direction: different
      minimum_effect: >-
        The measured exponents must match 12 - 3k, i.e. 9, 6, 3, 0, -3, each
        within +/- 0.4 in log_p units after the square-class factor is divided
        out. FORCED VALUES, DERIVED BEFORE THE RUN. A measured slope in k that is
        not -3 refutes HEUR-P1 and the whole cost equation is rebuilt around the
        measured slope, which is a better outcome than confirmation because the
        slope is the exponent everything else multiplies.
    - metric: >-
        free_plant_boundary: the largest k for which the mean solution count per
        prescribed k-tuple is at least 1 at every tested p
      direction: different
      minimum_effect: >-
        EXACTLY 4. Forced. If it is 3 or 5, the counting is wrong by one
        somewhere and the error must be found before any cost statement is made.
    - metric: >-
        alpha_agreement: the measured marginal exponent d(log_p mean solution
        count)/dk, compared against the alpha = 3 of
        P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) recorded in DEC-20260724-021
      direction: different
      minimum_effect: >-
        -3.0 +/- 0.4, agreeing with alpha = 3 in magnitude. Two independent
        derivations, one dimensional and one combinatorial, are predicted to give
        the same exponent. Disagreement is the more informative outcome and
        localises the error to one of the two, both of which are re-derivable.
    - metric: >-
        prescribed_support_nonzero_rate: fraction of surfaces obtained from a
        prescribed 4-tuple on which L(S; Q) is nonzero, i.e. the four planted
        sections are dependent, measured by the group law over F_p(t)
      direction: different
      minimum_effect: >-
        Strictly between 0 and 1 at every tested p -- this is the comparator
        spread test and it can fail. A rate of exactly 0 across all surfaces and
        all primes means the free-plant regime never yields a usable relation and
        delta is infinite in the tested window; a rate of exactly 1 means the
        planted sections are always dependent, which would mean the construction
        imposes a hidden relation and the object is not measuring the instance.
        Either extreme is a real finding and both are reportable.
    - metric: >-
        delta_exponent: log_p of the inverse of prescribed_support_nonzero_rate,
        regressed against log p
      direction: different
      minimum_effect: >-
        No forced value is claimed. THIS IS THE UNKNOWN THE PROPOSAL EXISTS TO
        MEASURE, and stating a prediction for it without a derivation would be
        the failure mode this program calls out. What IS pre-registered is the
        reporting rule: delta is reported with its regression uncertainty and
        with the statement that the cost equation's exponent 3(k-4) + delta is
        only as good as its worst-measured factor.
    - metric: >-
        prescribed_minimal_support_norms: the infinity norms of minimal-support
        vectors of L(S; Q) wherever it is nonzero
      direction: different
      minimum_effect: >-
        A subset of {1,2,3,4,6}, with 5 FORBIDDEN, inherited from the affine-mark
        argument of IDEA-20260805-4ed1b1. A single observed 5 falsifies that
        argument through this experiment rather than through its own, which is
        why it is carried here as a cross-check.

  minimal_test:
    design: >-
      Cheapest-first, and Stage 1 can end the line with no elliptic-curve
      arithmetic at all. STAGE 0 (pen and paper, zero compute): write the
      parameter count out in full, including the degree bookkeeping that makes
      the identity 7 equations rather than 9 or 13, and have it checked
      independently; a single off-by-one here changes every exponent. STAGE 1
      (pure Python linear algebra over F_p, minutes): for k in {1,2,3,4,5}, draw
      prescribed x-tuples, solve the linear-in-(a,b) system with y_i handled by
      the square-class split, and count solutions; regress log_p count against k.
      If the slope is not -3, STOP and rebuild. STAGE 2 (pure Python group law
      over F_p(t), bounded): for k = 4, test dependence of the planted sections
      and measure prescribed_support_nonzero_rate and delta. STAGE 3
      (bookkeeping, zero compute): assemble T(k,p), state it beside sqrt(N) for
      the tested p, and state explicitly what it does NOT say.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL. Prescribe
        k x-polynomials that are NOT lifts of anything -- drawn uniformly at
        random from F_p[t] of degree <= 2, with no relation to any curve or
        target. The parameter count does not know where x_i came from, so the
        FORCED VALUE is that the solution-count exponent is IDENTICAL to the
        treatment arm's, 12 - 3k, at every k and every p. If the random-x arm
        differs from the target-lift arm, the count is not the mechanism and
        something about the lifts is doing the work -- which would be a genuine
        discovery and is the reason this null is worth running. This null can
        fail.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. The k = 2 cell must
        reproduce the behaviour of the committed census sampler
        fiber_find_rich_surfaces: solutions must be abundant and the sampler's
        own success pattern must be recovered when the identical filters (a
        nonzero, deg a <= 4, deg b = 6, disc nonzero, j non-constant) are
        applied. If the k = 2 cell does not reproduce a working sampler, the
        implementation is broken and NO negative statement about any k may be
        reported. This is the sensitivity demonstration and its comparator is a
        committed artifact rather than an expectation.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. The k sweep
        {1,2,3,4,5} IS the graded control: the forced sequence of exponents is
        9, 6, 3, 0, -3, strictly decreasing with constant step -3. A sequence
        that is flat, or decreasing with a different constant step, or
        non-monotone, localises the error to a specific k rather than leaving
        "the model did not fit". A quantity that fails to decay as k increases is
        the canonical artifact tell here and would mean the solver is finding
        spurious solutions.
      - >-
        ORDERING CONTROL. The forced exponents 9, 6, 3, 0, -3 and the k = 4
        boundary are committed with their hashes before any cell is run, and the
        null arm is run and committed before the treatment arm is looked at.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Enumerate every prior cost statement for
        this route in the corpus. What exists: DEC-20260724-021's alpha = 3 under
        the uniform measure, and its red team's recorded observation that the
        attack uses the prescribed-point measure. What does not exist: any
        per-relation cost, any k-dependence, any comparison to sqrt(N). Reported
        as an absence.
    required_metrics:
      - the full parameter count with its degree bookkeeping, written out and independently checked
      - per-(k, p) solution counts with sample sizes and the seed derivation rule, treatment and null arms separately
      - the regression of log_p solution count against k with uncertainty, per arm
      - the k = 2 reproduction of the committed sampler's behaviour under identical filters
      - prescribed_support_nonzero_rate and delta with uncertainty, and the group-law verification transcript for every dependence found
      - the assembled T(k,p) beside sqrt(N) at the tested p, with every factor's provenance labelled measured, derived or unmeasured

  falsification_conditions:
    - >-
      The measured solution-count exponent is not 12 - 3k. HEUR-P1 is refuted and
      the cost equation is withdrawn and rebuilt around the measured slope.
    - >-
      The free-plant boundary is not exactly k = 4. The count has an off-by-one
      and no cost statement may be made until it is found.
    - >-
      The null arm (random prescribed x, no curve) differs from the treatment
      arm. The dimension count is not the operative mechanism.
    - >-
      The k = 2 positive control fails to reproduce the committed sampler.
      Nothing negative may be reported at all.
    - >-
      prescribed_support_nonzero_rate is exactly 0 or exactly 1 at every p. The
      tracked object has no comparator spread and this proposal fails its own
      identifiability test.
    - >-
      A minimal-support vector of L(S; Q) with infinity norm 5, or greater than
      6, appears. The affine-mark ceiling of IDEA-20260805-4ed1b1 is refuted
      through this experiment.

  confounders:
    - >-
      DIMENSION COUNTS OVER FINITE FIELDS ARE EXPECTATIONS. p^(12-3k) predicts a
      mean, not existence, and the variance matters at k = 4 where the mean is
      O(1). The reporting rule is the full histogram of solution counts per
      tuple, not the mean alone.
    - >-
      THE SQUARE-CLASS FACTOR. y_i^2 = f_i requires f_i to be a square in
      F_p[t], which is a condition on both the polynomial being a square and its
      leading constant being a quadratic residue; the census code handles the
      sign explicitly. Folding that factor into the exponent instead of dividing
      it out would corrupt the slope.
    - >-
      SPECIALISATION IS NOT ASSUMED TO PRESERVE THE RELATION. A relation in
      MW(S/F_p(t)) specialises to a relation among the fibre points, but a
      relation among the fibre points need not lift, and the specialisation map
      need not be injective. No arm claims a usable ECDLP relation was produced;
      the deliverable is a cost, and the specialisation gap is declared UNMET
      rather than deferred.
    - >-
      THE CONSUMER'S REQUIREMENT IS NOT MODELLED HERE. Index calculus needs about
      B independent relations over a factor base of size B, plus a linear-algebra
      stage whose cost this proposal does not compute. Presenting T(k,p) as an
      attack cost would be exactly the partial-cost error this program's own
      records forbid; T is a per-relation figure and is labelled as one
      everywhere.
    - >-
      SMALL p. The regression uses p in {7,13,19,31}, a range of under half a
      decade in log p. A slope fitted there is fragile, its uncertainty is
      reported, and no extrapolation to cryptographic p is made or implied.

  interpretation_limits:
    - >-
      Claim tier toy. Nothing here is a crypto-scale statement, an attack, or a
      cost bound on any deployed curve. The forced exponents are properties of a
      Weierstrass parameter space over small primes.
    - >-
      DEC-20260724-021's forbidden-sentence list binds this record word for word.
      This proposal does NOT state, and must not be read as stating, that the
      multi-section or Mordell-Weil relation-source route is closed, that no
      lifting-based relation source exists over F_p(t), or that section-rich
      surfaces are exponentially rare. It prices one construction under one
      stated model and names the unmeasured factor.
    - >-
      Forward guidance, required by the closure standard and supplied whatever
      the outcome: if T(k,p) turns out large, the named ways out are (i) chi >= 2
      surfaces, where the parameter budget grows (deg a <= 8, deg b <= 12) and
      the rank ceiling rises from 8 to as much as 18, changing every exponent in
      the count; (ii) non-integral sections, x = g/h^2, which enlarge the section
      supply beyond the 240 roots and which no XEDN contract has enumerated;
      (iii) prescribing FEWER points and accepting relations of small support,
      trading relation quality for cost; (iv) amortising one surface across many
      target tuples, which the ceilings of 8 and 240 bound explicitly. None of
      these is claimed to work and each is named as open.
    - >-
      No status change to any XEDN record is proposed or implied.

  heuristic_assumptions:
    - id: HEUR-P1
      statement: >-
        FORMALLY: let X = (x_1, ..., x_k) be k polynomials of degree <= 2 over
        F_p, drawn uniformly. Let N(X) be the number of tuples
        (a, b, y_1, ..., y_k) with deg a <= 4, deg b = 6, deg y_i <= 3 and
        y_i^2 = x_i^3 + a x_i + b for all i. Then
        E_X[N(X)] = c_k * p^(12 - 3k) * (1 + o(1)) as p -> oo, with c_k a
        constant depending only on k and accounting for the square-class
        condition.
      rigorous_support: >-
        The unconditional part is the count itself: the system has exactly 7k
        scalar equations in exactly 12 + 4k unknowns, which is a matter of degree
        bookkeeping and is checked by hand in Stage 0. The heuristic part is that
        the solution count behaves like that of a generic system of the same
        shape -- i.e. that the variety is a complete intersection of the expected
        dimension with no excess components. That is a genuine assumption: the
        equations are far from generic (they share a and b across all i, and are
        quadratic in y_i), and excess intersection is exactly what a hidden
        structure would look like. NO SOURCE IS CITED and none is claimed.
      validation_plan: >-
        Direct measurement at k in {1,2,3,4,5} and p in {7,13,19,31}, pure Python,
        reporting the full solution-count histogram and the regressed slope
        against k, in both the target-lift arm and the random-x null arm.
        Falsification condition: measured slope not -3 within +/- 0.4.
    - id: HEUR-P2
      statement: >-
        The dependence event (the k planted sections span a lattice of rank < k)
        occurs with probability p^(-delta) for some delta >= 0 that is constant
        in p over the tested range.
      rigorous_support: >-
        NONE OFFERED, AND THIS IS THE WEAKEST LINK IN THE RECORD, stated as such
        rather than smoothed over. That dependence is a proper closed condition
        on the solution family is clear; that its probability follows a clean
        power of p is an assumption made only so that the measurement has a form
        to report against. If the measured rate does not follow a power law, the
        rate itself is reported as the deliverable and no exponent is invented
        for it.
      validation_plan: >-
        Measure the rate at k = 4 at each of p in {7,13,19,31} with group-law
        verification of every dependence found, regress log(1/rate) against
        log p, and report the fit quality alongside the raw rates so that a poor
        fit is visible rather than absorbed.

  proof_search_map_note: >-
    The paired hypothesis H-XEDN-beb408 carries the filled proof_search_map with
    all four audits for this proposal's cost-architecture claim.

  target_complexity:
    exponent_moved: >-
      NONE IS CLAIMED, and the honest statement is stronger than a refusal: this
      proposal produces an exponent where the lane had none. The quantity
      3(k - 4) + delta is the per-relation exponent of the function-field xedni
      relation source under the stated model, and it is the first such number in
      the lane. Whether it is favourable is not asserted; measuring delta is what
      decides it. The comparison target is the Pollard rho baseline of about
      N^(1/2) group operations at negligible memory, and this proposal explicitly
      does NOT claim to approach it.
    memory_exponent: >-
      Not yet charged, and that gap is declared rather than hidden. A relation
      source that stores surfaces or section tables has a memory cost, and the
      corpus's own standard requires memory stated beside time. Stage 3 records
      the working-set size of the search as measured, and states that the
      end-to-end memory exponent of any attack built on it is UNCOMPUTED.
    best_known: >-
      Pollard rho, time N^(1/2), memory O(1), data 0. For index calculus over
      prime-field curves this corpus records no working subexponential variant.
    hidden_overhead: >-
      The square-class factor 2^k, the specialisation-injectivity gap (declared
      unresolved), the linear-algebra stage of the consuming index calculus (not
      modelled), and the constant c_k in HEUR-P1. All four are named so that no
      downstream record can quote 3(k-4) as if it were the whole cost.
    tradeoff_note: >-
      The obvious trade is k against delta: fewer prescribed points are cheaper
      to plant but yield relations of smaller support and less information per
      relation, while more prescribed points cost p^3 each. The equation makes
      that trade explicit and measurable, which is the deliverable.

  dominated_by: >-
    Pollard rho dominates any attack built on this relation source at every
    currently-defensible parameter setting, and saying so is part of the record
    rather than a caveat. Rows checked across time, memory and data/queries
    before writing that: Pollard rho (time N^(1/2), memory O(1), data 0);
    parallel rho with distinguished points (time N^(1/2)/w, memory w, data 0);
    BSGS (time N^(1/2), memory N^(1/2)); the corpus's prime-field
    index-calculus lane (no working subexponential variant recorded, so no row to
    compare against); Semaev/Gaudry-Diem index calculus (extension fields only --
    not a competitor on the prime-field target); classical xedni (recorded as
    refuted, and this route's function-field analogue is what is being priced).
    The domination is on TIME at the tested scale and is asserted only there;
    memory and data are not where this route loses, and the record does not
    pretend otherwise.
  sota_delta: >-
    Negative or undefined on time, by an amount this proposal exists to quantify:
    at k = 5 the model already prices one relation at about p^3 surface trials
    times p^delta, against a total rho cost of about p^(1/2) group operations for
    the whole discrete logarithm. No memory or data advantage is claimed. The
    contribution is therefore not a better point on the frontier but the first
    numerical statement of where this route's point IS -- which is what
    Pareto honesty requires of a lane that has produced six evidence records
    without one.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that the measured solution-count exponent matches 12 - 3k within
    tolerance. It is not higher because the system is visibly non-generic (a and
    b are shared across all k identities, the equations are quadratic in y_i, and
    excess components are exactly what a hidden structure would produce), and
    because small p makes a slope fitted over p in {7..31} fragile. It is not
    lower because the count is elementary and self-checking, because the k = 2
    cell is already known to behave as predicted -- the census sampler works, and
    a 6-dimensional solution family is why -- and because the independently
    measured alpha = 3 of DEC-20260724-021 lands on the same marginal exponent
    from an unrelated derivation. Separately, 0.35 that delta turns out small
    enough for the k = 4 free-plant regime to yield relations at a rate worth
    reporting as favourable; that number is low, it is the interesting half of
    the experiment, and it is the reason the record refuses to state a prediction
    for delta at all.
