idea:
  id: IDEA-20260805-637a3b
  question_id: RQ-FNDSA-001
  added: '2026-08-05'
  title: >-
    The width homotopy from NTRUSign to FN-DSA: sigma is the parameter that
    is supposed to destroy the parallelepiped signal, the second-moment
    anisotropy must therefore decay as exp(-4 pi^2 sigma^2), and the
    NTRUSign endpoint is a positive control where the attack MUST work --
    which makes the deviation-to-signature-count curve measurable instead of
    asserted
  class: mechanism

  claim: >-
    RQ-FNDSA-001's motivating analogy is that NTRUSign died from
    distributional rather than timing error. That analogy is testable as a
    CONTINUOUS DEFORMATION rather than as an analogy, because Klein's sampler
    at width sigma degenerates to Babai's deterministic nearest-plane -- which
    IS the NTRUSign signing map -- as sigma tends to zero, and converges to a
    trapdoor-independent spherical Gaussian as sigma grows past the smoothing
    parameter. sigma is therefore exactly the parameter meant to destroy the
    parallelepiped signal, and the inventor protocol's canonical test applies
    directly: a signal that does not decay as that parameter increases is an
    artifact. THIS PROPOSAL DERIVES THE DECAY LAW AND FINDS IT SHARPER THAN
    EXPECTED. Writing eps = exp(-2 pi^2 sigma_i^2), the conditional leaf
    variance is Var(D_{Z, sigma_i, c}) =
    sigma_i^2 (1 - 8 pi^2 sigma_i^2 eps cos(2 pi c) + O(eps^2)), which is
    FIRST order in eps -- but its average over a uniform center vanishes
    identically at first order, and the O(eps^2) inflation of the second
    moment CANCELS EXACTLY against the variance of the first-order mean bias
    -4 pi sigma_i^2 eps sin(2 pi c). The surviving pooled second-moment
    anisotropy is 8 pi^2 sigma_i^2 eps^2, i.e. QUADRATIC in eps where the
    log-likelihood channel is linear. Numerically, at FN-DSA-512 the moment
    channel's relative anisotropy is 2^-85.99 against the log-likelihood
    channel's per-leaf 2^-46.5, and the implied signature counts are 2^162
    against 2^83. THE NTRUSIGN-LINEAGE MOMENT ATTACKS ARE THEREFORE ABOUT 79
    BITS WORSE THAN THE NORMALIZER CHANNEL AT FN-DSA PARAMETERS, and that
    redirection is derived at zero compute. The proposal's experimental half
    is the ladder that makes the derived exponent -- is the decay eps or
    eps^2? -- MEASURABLE at small sigma, where both are large, with the
    NTRUSign endpoint as the positive control that must fire.

  object_first_candidate:
    tracked_object: >-
      The SECOND-MOMENT TENSOR OF THE SIGNATURE CLOUD EXPRESSED IN THE SECRET
      GRAM-SCHMIDT FRAME: M = E[s s^T] decomposed as
      sum over i of v_i b~_i b~_i^T / ||b~_i||^2, with
      v_i = ||b~_i||^2 Var(z_i). This is the object the parallelepiped attack
      integrates, it is the object that killed NTRUSign, and it is followed
      here through a one-parameter family indexed by sigma that connects the
      broken scheme to the standardized one.
    established_families_off_limits: >-
      Off-limits as the primary lens: (a) timing and microarchitectural side
      channels; (b) BKZ and lattice-reduction cost estimation; (c)
      overstretched-NTRU, subfield and dense-sublattice attacks; (d) fault
      injection; (e) goodness-of-fit testing of the signature histogram; (f)
      the normalizer / log-likelihood channel of IDEA-20260805-2bbfb2, which
      is deliberately excluded here so that this proposal cannot silently
      become a restatement of its companion. The moment family is IN scope
      because this proposal's purpose is to bound it, not to use it.
    newness_score: >-
      The degeneration of Klein's sampler to Babai rounding as sigma tends to
      zero is elementary and surely known. What this corpus does not have, and
      what the record supplies, are three things: the exact first-order leaf
      variance modulation -8 pi^2 sigma^2 eps cos(2 pi c), the EXACT
      CANCELLATION at second order that pushes the pooled anisotropy from
      O(eps) to O(eps^2), and the resulting 79-bit separation between the
      moment channel and the normalizer channel. The cancellation in
      particular was found by deriving the two terms separately and noticing
      they are equal, and it is the reason the record exists rather than
      restating folklore.
    testability_score: >-
      High and cheap. Every derived quantity was checked during ideation
      against direct theta summation at four values of c and four values of
      sigma, agreeing to 1e-9 relative at sigma = 0.8, and the c-averaged
      second-order coefficient was recovered as 8 pi^2 sigma^2 to four
      significant figures at sigma in {0.45, 0.50, 0.55, 0.60, 0.70}. Those
      checks were run OUTSIDE THE HARNESS on this machine and must be re-run
      in-harness before citation.
    survival_score: >-
      The object survives the whole width homotopy, which is the point: it is
      large and exploitable at one end, provably tiny at the other, and the
      decay between the ends is the measurement. It does NOT survive to being
      an attack at FN-DSA parameters, and the derivation says so with a
      number rather than an intuition.

  mechanism: >-
    DERIVED IN-RECORD, and every closed form below was numerically confirmed
    during ideation against direct summation of the defining theta series.

    THE HOMOTOPY. Klein's sampler with per-direction width
    sigma_i = sigma / ||b~_i|| draws z_i from D_{Z, sigma_i, c_i}. As
    sigma_i tends to 0 the discrete Gaussian concentrates on round(c_i) and
    the algorithm becomes Babai's nearest-plane in the Gram-Schmidt basis,
    whose output offset from the target is uniform-like over the fundamental
    parallelepiped of the Gram-Schmidt vectors -- the NTRUSign signing map and
    the exact object the learning-a-parallelepiped attack recovers. As
    sigma_i grows past the smoothing parameter of Z the draws become
    trapdoor-independent and the cloud becomes spherical. sigma is thus a
    genuine homotopy parameter between a broken scheme and a standardized one,
    and the inventor protocol's structural tell -- a quantity that should
    decay as the destroying parameter increases -- has a derivable decay law
    here rather than an expectation.

    THE FIRST-ORDER LEAF LAW. With Z_sigma(c) = sum over z of
    exp(-(z - c)^2 / (2 sigma^2)) and eps = exp(-2 pi^2 sigma^2), Poisson
    summation gives Z_sigma(c) = sigma sqrt(2 pi) (1 + 2 eps cos(2 pi c) +
    O(eps^4)). Differentiating under the sum:
      MEAN BIAS: E[z - c] = sigma^2 d(log Z)/dc
                          = -4 pi sigma^2 eps sin(2 pi c) + O(eps^4);
      SECOND MOMENT ABOUT THE CENTER:
                 E[(z - c)^2] = sigma^2 (1 - 8 pi^2 sigma^2 eps cos(2 pi c))
                                + O(eps^2).
    BOTH WERE CHECKED NUMERICALLY. At sigma = 0.8, c = 0, the closed form
    gives 0.6398944965 against a directly summed 0.6398944972, a relative
    agreement of 1.1e-9; at sigma = 0.7, 3.1e-7; at sigma = 0.6, 3.8e-5 --
    a convergence rate consistent with the O(eps^2) remainder, which is itself
    a check on the derivation.

    THE CANCELLATION, WHICH IS THE CONTENT. Average over a uniformly
    distributed center. The first-order cos and sin terms integrate to zero,
    so the leading anisotropy is second order, and there are exactly two
    second-order contributions:
      (i) the c-average of E[(z - c)^2] is
          sigma^2 (1 + 8 pi^2 sigma^2 eps^2) + O(eps^3);
      (ii) the variance of the mean bias across centers is
          E[(4 pi sigma^2 eps sin(2 pi c))^2] = 8 pi^2 sigma^4 eps^2.
    Term (i) exceeds sigma^2 by 8 pi^2 sigma^4 eps^2. Term (ii) equals
    8 pi^2 sigma^4 eps^2. THEY ARE EQUAL. Consequently the WITHIN-CENTER
    variance, E_c[Var_z(z | c)] = (i) - (ii), equals sigma^2 through order
    eps^2, while the POOLED second moment -- the only one an attacker who
    cannot see c can measure -- retains the inflation
      M_ii / sigma^2 - 1 = 8 pi^2 sigma_i^2 eps_i^2 + O(eps_i^3).
    Numerical confirmation during ideation: the measured ratio of
    (c-averaged second moment / sigma^2 - 1) to eps^2 was 16.005, 19.742,
    23.885, 28.425 and 38.689 at sigma = 0.45, 0.50, 0.55, 0.60, 0.70,
    against the derived 8 pi^2 sigma^2 = 15.995, 19.739, 23.885, 28.425,
    38.689. Agreement to four significant figures at four of five points.

    THE COST BOOKKEEPING AND THE SEPARATION. The attacker measures M from N
    signatures. The per-entry sampling noise on a covariance estimate is
    Theta(sigma^2 / sqrt(N)), so detecting a relative anisotropy delta needs
    N = Theta(1 / delta^2), improved by at most a factor d if the d directions
    can be pooled coherently: N = Theta(1 / (d delta^2)). With
    delta = 8 pi^2 sigma_min^2 eps_0^2:
      FN-DSA-512: sigma_min = 1.277833697, eps_0 = 2^-46.500,
        delta = 1.3018e-26 = 2^-85.99, d = 1024, N_moment = 2^161.98.
      FN-DSA-1024: sigma_min = 1.298280334, eps_0 = 2^-48.000,
        delta = 1.6798e-27 = 2^-88.94, d = 2048, N_moment = 2^166.89.
    Against the companion proposal's normalizer channel at N_LLR = 2^83.00
    and 2^85.00, THE MOMENT CHANNEL IS 79 AND 82 BITS WORSE. The forward
    consequence is a redirection, not a closure of the goal: if a
    distributional attack on FN-DSA exists at all, it does not go through the
    moment tensor that killed NTRUSign, and a campaign that spends its
    remaining batches computing signature covariances is spending them on the
    provably weaker of the two channels.

    WHY THIS IS NOT A CLOSURE AND WHAT REMAINS OPEN. The derivation assumes
    uniform, independent leaf centers (HEUR-FN-5). If the centers are
    correlated with the secret -- which is exactly what a defective ffSampling
    recursion or a reduced-precision center computation would produce -- the
    first-order term -8 pi^2 sigma_i^2 eps_i cos(2 pi c_i) NO LONGER AVERAGES
    AWAY, the anisotropy reverts from eps^2 to eps -- to 8 pi^2 sigma_min^2 eps_0 =
    2^-39.49 -- and N_moment collapses from 2^161.98 to about 2^68.98, which
    is 14 bits BELOW the normalizer channel and would make the moment channel
    the leading distributional route rather than the dominated one. THE
    ENTIRE 79-BIT SEPARATION RESTS ON CENTER UNIFORMITY, and that is therefore
    the quantity the experiment must measure rather than assume. Stating this
    is the difference between a closure at the protocol's standard and a
    fatigue report.

  novelty_status: unverified

  literature_context:
    - >-
      NGUYEN-REGEV, LEARNING A PARALLELEPIPED, AND THE BREAK OF NTRUSIGN:
      RECALLED, UNVERIFIED. That such an attack exists, that it recovers the
      secret basis from the fourth moment of a cloud uniform on a
      parallelepiped, and that it required on the order of thousands of
      signatures, are all recalled from memory of the literature. NO NUMBER
      FROM IT IS USED IN ANY DERIVATION HERE. The paired experiment's
      positive-control arm needs only that SOME statistic recovers the
      generating frame from the sigma-to-zero endpoint, which the experiment
      establishes for itself by measurement at toy dimension rather than by
      citation.
    - >-
      DRAFT FIPS 206 / FN-DSA: NOT READ. q = 12289, sigma_min = 1.277833697
      and 1.298280334, signature sigma = 165.736617183, the key-acceptance
      bound ||B||_GS <= 1.17 sqrt(q): ALL RECALLED, UNVERIFIED, and inputs to
      be replaced by primary text.
    - >-
      GPV AND THE TRAPDOOR-INDEPENDENCE ARGUMENT: RECALLED, UNVERIFIED as a
      citation. The statement that sampling above the smoothing parameter
      makes the output basis-independent is the design rationale this
      proposal makes quantitative; the quantitative content is derived here
      and does not rest on any retrieved source.
    - >-
      This corpus contains no measurement of a signature covariance for any
      scheme, and no application of a width homotopy as a graded control
      anywhere. The census informing this session records 39 control runs out
      of 1694 run directories and one arms-and-controls block in 195
      experiment specifications; a graded control with a derived decay law is
      therefore unusual here, which is a statement about this corpus and not a
      claim of external novelty.

  lossy_projection_identifiability_audit:
    projection: >-
      The stream of signatures s^(1), ..., s^(N) in Z^{2n}, projected to the
      empirical second-moment matrix M = (1/N) sum s s^T, and then to the
      scalar anisotropy functional A = lambda_max(M) / lambda_min(M) and to
      the alignment between M's eigenvectors and the secret Gram-Schmidt
      frame.
    what_is_discarded: >-
      All higher-order structure, all per-signature information, the ordering,
      and the messages. N vectors of dimension 2n collapse to a symmetric
      2n-by-2n matrix and then to a handful of scalars.
    why_genuinely_lossy: >-
      Genuinely and irreversibly: the map from a sample to its covariance is
      many-to-one by an enormous margin, and the further map to the anisotropy
      ratio discards the frame itself.
    why_compatible_with_the_operations: >-
      Compatible because the sampler generates coordinates independently along
      the Gram-Schmidt directions, so the covariance is EXACTLY diagonal in
      that frame with entries v_i = ||b~_i||^2 Var(z_i). The projection
      therefore propagates deterministically: the covariance of the output is
      a function of the per-leaf variances and the frame, with no residual
      coupling. This is the strongest form of compatibility available and it
      is what makes the closed form derivable at all.
    is_it_only_a_change_of_coordinates: >-
      NO, and both canonical failures were checked explicitly.
      NOT the (Delta, Pi) = (x xor y, x y) failure: the covariance is not
      invertible back to the sample, so information is genuinely discarded.
      THE MIRROR FAILURE IS THE ONE THAT ALMOST FIRES HERE, AND THE RECORD
      SAYS SO. The whole content of the derivation is that the observable
      becomes ASYMPTOTICALLY CONSTANT as sigma grows: at first order in eps
      the c-averaged anisotropy is exactly zero, so a first-order instrument
      measuring this observable at FN-DSA parameters would have zero
      comparator spread and would be measuring its own apparatus. The check
      was run at second order and the spread is NOT zero -- it is
      8 pi^2 sigma^2 eps^2, derived and numerically confirmed to four
      significant figures -- so the object survives the identifiability test
      by a margin of one order in eps. That margin, and nothing else, is why
      the number 2^162 exists rather than "infinity", and it is why the
      proposal reports a bound rather than a closure.
      OBSERVATION COLLISION, CHECKED: two distinct secret bases with the same
      Gram-Schmidt norm profile but different frames produce the SAME
      anisotropy ratio A while producing different eigenvector alignments. The
      scalar A is therefore NOT identifying and the experiment must report the
      alignment, not only the ratio. This is recorded as a design requirement
      rather than found later.

  assumptions:
    - >-
      That FN-DSA's sampler is Klein-family, so that the covariance is
      diagonal in the Gram-Schmidt frame. If the draft specifies a different
      recursion this diagonality may fail and the derivation must be redone.
    - >-
      That signatures are observable as lattice vectors, i.e. that the
      compressed signature can be expanded to (s_1, s_2) with s_1 recoverable
      from the public key and the message. RECALLED as true for FN-DSA and to
      be verified in Stage 0.
    - >-
      That the leaf centers are close to uniform and independent (HEUR-FN-5).
      THIS IS LOAD-BEARING TO THE TUNE OF 79 BITS and is measured, not
      assumed.

  predictions:
    - metric: >-
        anisotropy_decay_exponent -- the fitted exponent alpha in
        (pooled second-moment anisotropy) proportional to eps^alpha, over the
        sigma ladder {0.45, 0.50, 0.55, 0.60, 0.65, 0.70} at toy dimension
      direction: different
      minimum_effect: >-
        PREDICTED alpha = 2.00, from the exact cancellation derived above,
        with a tolerance of 0.15. A measured alpha near 1.00 means the
        cancellation does not occur in the full recursive sampler -- almost
        certainly because the centers are not uniform -- and the moment
        channel's cost drops from 2^161.98 to about 2^68.98 at FN-DSA-512,
        which is BELOW the normalizer channel's 2^83.00. THAT IS
        THE OUTCOME THAT WOULD MATTER, and it is what the ladder is for.
    - metric: >-
        anisotropy_coefficient -- the fitted constant in
        (anisotropy) = K sigma^2 eps^2
      direction: different
      minimum_effect: >-
        PREDICTED K = 8 pi^2 = 78.957, tolerance 10 per cent. Pre-derived
        reference values of 8 pi^2 sigma^2 at the ladder rungs: 15.995,
        19.739, 23.885, 28.425, 33.362, 38.689. Ideation-session direct
        summation returned 16.005, 19.742, 23.885, 28.425, --, 38.689.
    - metric: >-
        babai_endpoint_recovery -- fraction of toy keys at n = 8 and 16 for
        which a fourth-moment or covariance-based procedure recovers the
        Gram-Schmidt frame to within 5 degrees per direction from N = 10^5
        signatures at sigma_i = 0.05
      direction: higher
      minimum_effect: >-
        AT LEAST 0.90. THIS IS THE POSITIVE CONTROL AND IT MUST FIRE. At
        sigma_i = 0.05 the sampler is Babai rounding for every practical
        purpose and the cloud is the parallelepiped; if the procedure cannot
        recover the frame there, the instrument has no sensitivity to the
        signal it exists to bound, and NO NEGATIVE RESULT MAY BE REPORTED
        FROM ANY OTHER RUNG.
    - metric: >-
        smoothing_endpoint_null -- the same recovery fraction at
        sigma_i = 3.0, where eps = 7.0e-78 and the derived anisotropy is
        below any representable double
      direction: lower
      minimum_effect: >-
        EXACTLY 0 out of the tested keys, and a measured anisotropy consistent
        with pure sampling noise 1 / sqrt(N). THIS NULL CAN FAIL: a bug in the
        frame-alignment procedure, in the random source, or in the estimator
        would produce spurious recovery at a width where the derivation
        forbids any signal. Any nonzero recovery here invalidates the package.
    - metric: >-
        center_uniformity -- max over leaves of |E[cos(2 pi c_i)]| and max
        over leaf pairs of |E[cos(2 pi c_i) cos(2 pi c_j)]| measured from a
        toy recursive sampler at n in {8, 16, 32} over 10^6 messages
      direction: lower
      minimum_effect: >-
        Below 2^-10 for both, at which the cancellation holds to within the
        0.15 tolerance on alpha. A measured value above 2^-5 for either means
        HEUR-FN-5 fails, the 79-bit separation is void and reverses, and the
        derivation
        must be restated conditionally on a measured center distribution.
    - metric: >-
        moment_vs_normalizer_separation at the standardized constants
      direction: different
      minimum_effect: >-
        79.0 bits at n = 512 and 82.0 bits at n = 1024, computed as
        log2(N_moment) - log2(N_LLR) = 161.98 - 83.00 and 166.89 - 85.00.
        Derived pre-run; a recomputation differing by more than 1 bit
        falsifies the arithmetic.

  minimal_test:
    design: >-
      Four stages, cheapest first.
      STAGE 0 (zero compute): the same primary-source reading as the companion
      proposals; and, independently of it, the closed-form re-derivation of
      the two second-order terms and their cancellation, checked symbolically.
      THIS STAGE CAN END THE LINE: if the cancellation is an arithmetic slip,
      the anisotropy is O(eps) and the whole redirection reverses.
      STAGE 1 (leaf ladder, minutes, numpy): measure the pooled second-moment
      inflation of the one-dimensional leaf sampler at the six sigma rungs
      with uniformly drawn centers, fit alpha and K, compare with 2.00 and
      8 pi^2.
      STAGE 2 (toy lattice homotopy, hours): build toy NTRU-shaped bases at
      n in {8, 16, 32} over a small q, run the full Klein sampler at
      sigma_i in {0.05, 0.45, 0.60, 0.80, 1.20, 3.00}, measure the covariance
      anisotropy and the eigenvector alignment with the true Gram-Schmidt
      frame at each rung, and report the decay curve against the derived law.
      STAGE 3 (center diagnostics, minutes): measure the leaf-center harmonic
      moments in the same toy sampler and report them beside the assumed
      bound.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, AND IT CAN
        FAIL. The sigma_i = 3.0 rung, where eps = exp(-2 pi^2 * 9) = 7.0e-78
        and every derived anisotropy is far below double precision. FORCED
        VALUE: measured anisotropy indistinguishable from the sampling-noise
        floor 1 / sqrt(N), and recovery fraction exactly 0. It can fail
        through an estimator bug, a correlated random source, or a
        frame-alignment procedure that finds structure in noise -- three
        concrete, distinguishable failure modes.
      - >-
        POSITIVE CONTROL, MANDATORY BEFORE ANY NEGATIVE IS REPORTED. The
        sigma_i = 0.05 Babai endpoint, where the cloud IS the parallelepiped
        and recovery MUST succeed at 0.90 or better. This is the strongest
        available positive control because it is the historically broken
        object itself, reached by continuous deformation from the object
        under study rather than by analogy.
      - >-
        GRADED CONTROL WITH SIX INTERIOR POINTS AND A DERIVED DECAY LAW. The
        sigma ladder above spans eps from 1.8e-2 down to 6.3e-5 at the leaf
        and covers the crossing of the smoothing parameter. The report states
        the measured anisotropy at every rung, whether the sequence is
        monotone decreasing, and the fitted alpha with its confidence
        interval. A failure to decay AT ALL is the canonical artifact tell; a
        decay at the wrong exponent localises the obstruction to the
        cancellation rather than leaving "it did not work".
      - >-
        FRAME CONTROL AGAINST THE OBSERVATION COLLISION. Two toy keys with
        matched Gram-Schmidt norm profiles but different frames must produce
        the same anisotropy ratio and different eigenvector alignments. If
        they produce different ratios, the ratio is responding to something
        other than the profile and the estimator is not measuring what the
        derivation describes.
      - >-
        ORDERING CONTROL. The sigma = 3.0 null and the ladder are generated,
        analysed and hash-committed before the Babai endpoint is examined, and
        the decision rule is executed on the null first.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Prior covariance or fourth-moment
        measurements of a signature cloud in this corpus: NONE, for any
        scheme. Recorded as unavailable, not as a passed check.
    required_metrics:
      - the symbolic re-derivation of both second-order terms and their difference
      - measured pooled anisotropy at all six leaf rungs with the fitted alpha and K
      - measured covariance anisotropy and eigenvector alignment at all six lattice rungs, per toy key
      - recovery fraction at the Babai endpoint and at the sigma = 3.0 null
      - leaf-center harmonic moments with the assumed bound beside them
      - the recomputed N_moment, N_LLR and their separation at the Stage-0 constants
      - all seeds, the seed derivation rule, and the exact toy key construction

  falsification_conditions:
    - >-
      The second-order cancellation does not hold on symbolic re-derivation.
      The pooled anisotropy is O(eps) rather than O(eps^2), N_moment falls to
      about 2^68.98, the 79-bit separation reverses, and the moment channel
      becomes as interesting as the normalizer channel. This is the outcome
      that would most change the campaign.
    - >-
      The measured decay exponent alpha differs from 2.00 by more than 0.15 in
      the full recursive sampler while matching 2.00 at the isolated leaf. The
      recursion breaks the cancellation, which localises the failure to the
      center distribution and directs the next batch there.
    - >-
      The Babai-endpoint positive control does not reach 0.90 recovery. The
      instrument is insensitive and no negative may be reported from any rung.
    - >-
      The sigma = 3.0 null shows any recovery or any anisotropy above the
      noise floor. The instrument is broken and the package is invalid.
    - >-
      Measured center non-uniformity above 2^-5. HEUR-FN-5 fails and every
      derived separation must be restated conditionally.

  confounders:
    - >-
      TOY DIMENSION. n in {8, 16, 32} is far from 512, and the number of
      leaves d enters both the coherent-pooling factor and the center
      correlation structure. The decay LAW in sigma is a property of the leaf
      and should transfer; the pooling factor is a property of dimension and
      should not be extrapolated. The record separates the two rather than
      reporting one curve.
    - >-
      ESTIMATOR BIAS AT SMALL N. A covariance anisotropy estimated from
      N samples in dimension 2n has an upward bias of order 2n / N even under
      perfect isotropy; the design fixes N >= 100 * 2n and reports the
      bias-corrected statistic alongside the raw one.
    - >-
      FRAME KNOWLEDGE. The alignment metric uses the TRUE Gram-Schmidt frame,
      which an attacker does not have. The experiment therefore measures an
      upper bound on what an attacker could achieve, and the record must say
      so: a recovery fraction measured with the frame known is not an attack
      success rate.
    - >-
      A DERIVATION THAT CLOSES A FAMILY IS CHEAP TO PRODUCE. The positive
      control at the Babai endpoint exists precisely so that the negative
      conclusion has to be earned against an instrument demonstrated to work.

  interpretation_limits:
    - >-
      A confirming outcome bounds the MOMENT CHANNEL at the tested parameters
      and redirects effort to the normalizer and implementation channels. It
      does not close RQ-FNDSA-001, does not state that FN-DSA is secure, and
      does not license the sentence "moment attacks on FN-DSA are impossible".
      FORWARD GUIDANCE, mandatory: what remains open is (i) whether the leaf
      centers are uniform in the real recursion, which is worth 79 bits; (ii)
      the higher moments beyond the second, which this derivation does not
      cover; (iii) any statistic conditioned on public information that
      partially reconstructs the centers.
    - >-
      Toy tier for every measured quantity; derivation tier for the closed
      forms, conditional on Stage 0. The numbers 2^162 and 2^83 are
      derivation-tier statements about a channel and are not attack costs.
    - >-
      The eigenvector-alignment metric uses secret information and therefore
      overstates attacker capability by construction. Every reported recovery
      figure carries that qualifier.

  heuristic_assumptions:
    - id: HEUR-FN-5
      statement: >-
        In the real ffSampling recursion at FN-DSA parameters, the leaf-center
        fractional parts satisfy |E[cos(2 pi c_i)]| <= 2^-10 for every leaf
        and |E[cos(2 pi c_i) cos(2 pi c_j)]| <= 2^-10 for every distinct pair,
        so the first-order anisotropy term averages away and the pooled
        anisotropy is 8 pi^2 sigma_i^2 eps_i^2 rather than
        8 pi^2 sigma_i^2 eps_i.
      rigorous_support: >-
        Partial. Uniformity at the root follows from the message hash being
        uniform on the ambient torus. Propagation through the recursion is
        plausible because each residual target is an affine image of a
        near-uniform quantity and the leaf widths sit above the smoothing
        parameter, but it is NOT proved, and the failure direction is
        UNSAFE: correlated centers restore a first-order anisotropy and cost
        93 bits of the moment channel's cost, reversing the claimed 79-bit
        separation into a 14-bit deficit the other way. Recorded as the
        load-bearing
        assumption of this proposal.
      validation_plan: >-
        Direct measurement in a toy recursive sampler at n in {8, 16, 32} over
        10^6 messages, reporting the maximum single-leaf and pairwise harmonic
        moments beside the assumed 2^-10 bound, and reporting the implied
        N_moment at both extremes rather than a single figure.
    - id: HEUR-FN-6
      statement: >-
        The sample complexity of detecting a relative covariance anisotropy
        delta in dimension d from N signatures is Theta(1 / (d delta^2)), with
        the factor d available only when the d directions can be pooled.
      rigorous_support: >-
        Standard concentration for sample covariance; the pooling factor is
        the optimistic end and is stated as such. Using it makes the reported
        N_moment SMALLER, i.e. more favourable to the attacker, so the
        separation of 79 bits is conservative in the direction that matters.
      validation_plan: >-
        Measure the detection threshold directly on the toy ladder at three
        dimensions and check the 1 / (d delta^2) scaling in both arguments.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED and no attack is proposed. What the proposal
      produces is an exponent-shaped SEPARATION between two channels --
      2^162 against 2^83 in signature count at FN-DSA-512 -- which is a
      statement about where an exponent could conceivably move and where it
      cannot. Stating that plainly rather than dressing a channel bound as an
      attack is required by this program's accounting rules.
    memory_exponent: >-
      The covariance estimator needs O(d^2) = O(n^2) words, i.e. about 2^20
      words at n = 512, which is trivial in absolute terms but is 20 orders of
      magnitude more than the normalizer channel's O(1) streaming statistic.
      CHARGED AND REPORTED, because a Pareto comparison between two channels
      that ignores this difference is incomplete, and because the moment
      channel is the one that loses on both axes.
    best_known: >-
      For NTRUSign-style deterministic signing, the parallelepiped-learning
      family is the incumbent and is devastating; for Gaussian-sampled
      hash-and-sign there is no known moment attack, which is the position
      this derivation supports quantitatively rather than overturns.
    hidden_overhead: >-
      The coherent-pooling factor d is assumed available; if the d directions
      cannot be pooled the moment channel is a further 10 bits worse at
      n = 512. Disclosed rather than buried.
    tradeoff_note: >-
      Time against memory: the streaming normalizer statistic is O(1) memory
      and 2^83 queries; the covariance statistic is O(n^2) memory and 2^162
      queries. There is no interpolation between them because they are
      different observables, and reporting them as a single frontier would be
      a category error.

  dominated_by: >-
    Within the goal's own space of distributional channels, THIS PROPOSAL'S
    OBJECT IS DOMINATED, and saying so is the point of the record. The
    normalizer / log-likelihood channel of IDEA-20260805-2bbfb2 dominates the
    moment channel on every axis checked: TIME -- 2^83 against 2^162 units of
    work; MEMORY -- O(1) words against O(n^2) words; DATA / QUERIES -- 2^83
    against 2^162 signatures; PREPROCESSING -- none against none; ORACLE --
    signature queries in both; VERIFICATION -- none in both. There is no axis
    on which the moment channel wins, which is a clean Pareto fact and is
    exactly the deliverable. Against EXTERNAL work no domination is claimed
    because no attack is claimed. Corpus rows checked for a prior
    covariance-based analysis of a lattice signature: ledger/proposals,
    ledger/evidence, ledger/hypotheses, experiments, knowledge/techniques --
    none found, with this corpus's novelty screens discounted as usual.
  sota_delta: >-
    Quantitative, and stated as a separation rather than an improvement: the
    moment channel requires 2^161.98 signatures at FN-DSA-512 and 2^166.89 at
    FN-DSA-1024, against 2^83.00 and 2^85.00 for the normalizer channel and
    against a design query bound of 2^64 -- so the moment channel is 98 bits
    outside the query bound and 79 bits behind the best channel in the same
    family. No attack is claimed and no exponent moves. The contribution is
    that a program which currently holds zero numbers on this question will
    hold a derived, control-calibrated ordering of its two candidate channels.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.75 that the exact second-order cancellation survives symbolic
    re-derivation and reproduces at the isolated leaf. It is not higher
    because the cancellation was found numerically and confirmed at only five
    sigma values, and an exact-looking agreement to four significant figures
    is consistent with a coefficient that differs in a term this ideation did
    not probe. It is not lower because the two contributing quantities were
    derived independently, by differentiating the theta series once and twice,
    and their equality has a plausible structural cause -- both are the same
    Fourier coefficient squared. 0.45 that it also survives in the FULL
    recursion, which is materially lower because HEUR-FN-5 is unproved and its
    failure mode is exactly the one a real recursion could exhibit. 0.95 that
    the Babai-endpoint positive control fires, because the parallelepiped
    signal at sigma = 0.05 is enormous. Below 0.02 that any measured
    anisotropy at the standardized parameters could be detected at feasible N,
    which is not a reason to skip the experiment: the deliverable is the
    ordering of the channels and the measured decay exponent, both of which
    are obtained regardless.
