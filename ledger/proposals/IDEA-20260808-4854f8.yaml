  discriminated_from: M2-1 varies the key; this fixes the key and varies the coordinate pair.
    IDEA-20260807-05e12c corrects the MARGINAL compression law; this addresses the JOINT law
    across coordinates. IDEA-20260805-411b60 supplies the mutation-control discipline adopted
    here rather than duplicated.
  lossy_projection_test: 'PASSES. Tracked object: the pair of failure indicators (1[|w_i|
    > q/4], 1[|w_j| > q/4]) — two bits distilled from the full error vector, with the fibre
    being every error vector sharing that failure pattern. Discarded compatibly, because the
    FO transform''s failure event is exactly a disjunction of these indicators, so the retained
    bits are precisely what a decapsulation oracle reveals and they propagate deterministically
    into the failure-boosting counter. Tracking w loses nothing and is the incumbent.'
  source_refs:
  - KN-TECH-048 (corpus, read in full) — failure boosting, its three stages, and the "a revised
    failure rate is not an attack" rule.
  - GOAL-FRODO-001.yaml (corpus, read in full) — the exact-arithmetic and mutation-control
