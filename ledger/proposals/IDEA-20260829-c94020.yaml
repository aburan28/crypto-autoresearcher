  assumptions:
    - >-
      The committed adjudicator is used FROZEN AND UNMODIFIED. This record adds
      census content and measures behaviour; it repairs nothing. If a
      manufactured entry cannot be loaded at all, THAT IS THE RESULT and is
      reported as a key-format finding rather than worked around by editing the
      instrument.
    - >-
      A conforming pair at reduced steps is obtainable within the declared
      budget for at least one primitive. If not, the run reports a budget
      outcome and NO conclusion about instrument separation may be drawn, since
      the instrument would never have met a real object.
    - >-
      The known-false instrument set is the one this campaign already built,
      inheriting its recorded limitation that four of them were built once by
      one session and re-executed from the same file. At least one additional
      known-false instrument must be constructed independently for this round,
      or the instrument population remains a single point and the separation
      measurement is about that construction.
    - >-
      Reduced-step MD5 and reduced-step SHA-1 are DIFFERENT PRIMITIVES from MD5
      and SHA-1. Every path manufactured here is a path for the reduced
      primitive and is labelled so in the entry itself, not only in the report.

  proof_search_map:
    bottleneck: >-
      The adjudicator has never met a real differential path. Its entire
      calibration -- recall, null false-positive rate, ablation battery,
      differing-cell count, five known-false instruments -- was measured on 16
      synthetic entries whose MD5 differences are degenerate by this program's
      own record. Every verdict about the instrument's power is therefore scoped
      to a population that no attack would produce, and the campaign has no way
      to tell whether the measured blindness is a property of the instrument or
      of the population.
    baseline_embedding:
      parameter_slice: >-
        Restricting the population to the 16 synthetic planted entries
        reproduces the campaign's existing measurements EXACTLY. That slice must
        be recovered: run on the synthetic population alone and require the
        honest and known-false verdict vectors to match the committed evidence
        records object by object.
      reproduction_check: >-
        Frozen regression fixture comparing this run's synthetic-population
        verdict vectors against the committed ones from EV-DIFFP-b878aa,
        EV-DIFFP-b16b01, EV-DIFFP-afd96c and EV-DIFFP-1e08cc, per object and per
        instrument. Any disagreement means the harness changed and no comparison
        between populations is valid.
    observation_collision:
      observable: >-
        The per-instrument verdict vector over the population, and the
        adjudicator's canonical key as serialised for each entry.
      distinct_preimage_search: >-
        TWO-SIDED AND BOTH CHEAP. (i) KEY COLLISION, THE DANGEROUS DIRECTION:
        search for a manufactured real path and a synthetic planted entry with
        the SAME serialised canonical key. If one exists, the key cannot
        represent the distinction between a real path and a degenerate one, and
        no population change can help -- which would be a first-class finding
        about the key format rather than about the instruments. (ii) VARIANCE
        CHECK: for each key component, measure whether it VARIES across the
        manufactured population and across the synthetic one, and report the two
        variance profiles side by side. A component constant in both populations
        cannot be probed by either, and the prediction of instrument separation
        applies ONLY to components that vary in the new population and not in
        the old.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A census entry whose provenance is a CERTIFICATE (a literal conforming
          message pair, independently re-verified) instead of a CITATION,
          carried under its own never-summed count and structurally barred from
          supporting any novelty statement.
        predicted_gain: >-
          The adjudicator's first non-synthetic object, obtained without
          acquisition, without crossing the quarantine, and without weakening
          the rule that the published census is built only from sources an agent
          opened.
      - transform: observable_fiber
        proposed_object: >-
          Hold the adjudicator fixed and vary the POPULATION rather than the
          instrument; the fibre is the set of populations, and the intrinsic
          invariant distinguishing them is the per-component variance profile of
          the canonical key.
        predicted_gain: >-
          A direct answer to whether four batches of measured
          indistinguishability were about the instruments or about the objects
          they were shown, which no further control on the old population can
          give.
    quantifier_order: >-
      Claim B is a bare EXISTENTIAL -- "THERE EXISTS a known-false instrument
      and an object in the manufactured population on which its verdict differs
      from the honest instrument's" -- discharged by exhibiting the pair, which
      is why it is cheap and why its negation is the informative outcome rather
      than an inconclusive one. Claim C is a count over the declared key fields
      for a declared population, universally quantified over the fields and
      reported per field. NEITHER IS A STATEMENT ABOUT PUBLISHED PATHS, and no
      quantifier anywhere in this record ranges over the literature.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a specific reduced-step differential path is REAL, certified by a
        literal message pair an independent implementation re-verifies; that the
        adjudicator's key admits or rejects it, field by field; and that a
        specific known-false instrument does or does not differ from the honest
        one on that population. IT CANNOT CERTIFY anything about published
        paths, cannot make the readable census nonempty, cannot support any
        novelty claim in either direction, and cannot show that the adjudicator
        would handle a PUBLISHED characteristic correctly -- only that it
        handles a REAL one, which is strictly less and is strictly more than the
        campaign has now.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL: a NEAR-REAL
        DECOY -- a manufactured path with exactly one step's difference
        corrupted, so that no message pair conforms to it, presented to the
        adjudicator in the identical entry format. If the well-formedness gate
        and the adjudicator treat it identically to the certified path, then the
        entry format is not checking conformance and "real" is doing no work in
        this design; that must be reported as the ceiling it is. A SECOND nearby
        object: a manufactured path for a DIFFERENT reduced step count, which
        must adjudicate as a distinct object; if it does not, the key is not
        reading the step count.
    proof_obligations:
      - claim: >-
          PO-0. Both specifications are pinned from primary text (RFC 1321,
          FIPS 180-4) before any path is constructed or any conformance is
          checked.
        responsibility: baseline
      - claim: >-
          PO-1. Every certified pair is re-verified by a reference
          implementation INDEPENDENT of the construction code, and the
          independence is recorded as a construction path, not asserted.
        responsibility: correctness
      - claim: >-
          PO-2. The synthetic-population baseline reproduces the committed
          verdict vectors object by object before any cross-population
          comparison is made.
        responsibility: baseline
      - claim: >-
          PO-3. The new provenance count is carried as a FOURTH never-summed
          integer, and the emitted schema makes it structurally impossible for a
          novelty statement to cite it.
        responsibility: interface
      - claim: >-
          PO-4. Per-instrument verdict vectors are reported and never averaged;
          any instrument whose score is entailed by its own definition is
          flagged ENTAILED and excluded from any separation count.
        responsibility: strictness
      - claim: >-
          PO-5. The per-component variance profile of the canonical key is
          reported for BOTH populations, so that a separation is attributed to a
          component that actually varies rather than to the population change in
          general.
        responsibility: correctness
      - claim: >-
          PO-6. No path under coordination/goals/GOAL-MD5-001/quarantine is
          opened, enforced BY MECHANISM and recorded in the receipt, not by
          attestation.
        responsibility: scope

  predictions:
    - metric: >-
        certified_paths_count, per primitive (manufactured reduced-step paths
        with a literal conforming message pair independently re-verified)
      direction: higher
      minimum_effect: >-
        at least 3 for MD5 at r at most 24 and at least 1 for SHA-1 at r at most
        32. THIS IS THE GATING POSITIVE CONTROL. Zero certified paths for a
        primitive means that primitive's arm reports a budget outcome and NO
        adjudicator conclusion may be drawn from it.
    - metric: >-
        key_field_admission_fraction (fraction of the adjudicator's canonical
        key fields populated, well-formed and gate-admitted on a real path)
      direction: lower
      minimum_effect: >-
        strictly below 1.0, with the failing fields named. Exactly 1.0 is the
        opposite result and is the first evidence the schema works outside its
        design population; it is reported as such and not as a null.
    - metric: >-
        instrument_separation_count (number of declared known-false instruments
        whose verdict vector differs from the honest one on at least one
        manufactured object, ENTAILED rows excluded)
      direction: higher
      minimum_effect: >-
        at least 1, against a MEASURED baseline of 0 on the synthetic population
        over the adjudicated cells. This is the number the record lives or dies
        by, and 0 is a clean, reportable negative that redirects the campaign
        away from population repair and toward instrument redesign.
    - metric: >-
        varying_component_count, per population (number of canonical-key
        components that take more than one distinct value across the population)
      direction: higher
      minimum_effect: >-
        strictly greater on the manufactured population than on the synthetic
        one, by at least 2 components. IF IT IS NOT GREATER, the manufactured
        population is not more informative and the separation prediction has no
        mechanism; that must be reported BEFORE any separation number.
    - metric: >-
        near_real_decoy_rejection_rate (fraction of corrupted, non-conforming
        manufactured paths the entry gate rejects)
      direction: higher
      minimum_effect: >-
        at least 0.9. A gate that admits non-conforming paths is not checking
        conformance and the word "real" in this record means nothing; this is
        the method ceiling made measurable.
    - metric: >-
        synthetic_baseline_reproduction_rate (agreement between this run's
        synthetic-population verdict vectors and the committed ones)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0. Below that the harness changed and no cross-population
        comparison is valid.
    - metric: >-
        key_collision_count (manufactured and synthetic entries sharing one
        serialised canonical key)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Any collision is a direct falsifier of the key's
        identifiability and is reported before any separation number.
    - metric: >-
        construction_cost_seconds_per_certified_path, per primitive, with the
        declared budget beside it
      direction: lower
      minimum_effect: >-
        reported with the budget spent, so that a fast construction that
        searched almost nothing is visible as such and so a later batch can plan
        a larger population from a measured rate.

  minimal_test:
    design: >-
      ONE EXECUTOR TASK IN FIVE STAGES AGAINST THE FROZEN, UNMODIFIED COMMITTED
      ADJUDICATOR, ACQUIRING NOTHING AND SEARCHING NO DIFFERENCE SPACE. STAGE 0
      pins both specifications from primary text and implements two INDEPENDENT
      reference implementations per primitive, one for construction and one for
      verification, recording the construction path so independence is a fact
      and not a claim. STAGE 1 IS THE GATING POSITIVE CONTROL: manufacture the
      paths. For MD5 at r at most 24, pick message differences from a declared
      low-weight family, derive the step-wise signed difference trace and the
      condition set from an actual conforming pair found by brute force within a
      declared evaluation budget, and re-verify every pair independently. For
      SHA-1 at r at most 32, take a low-weight disturbance vector, place local
      collisions at its set bits, derive the induced near-collision path, and
      search for a conforming pair under the same discipline. IF NO PAIR IS
      CERTIFIED FOR A PRIMITIVE, THAT ARM REPORTS A BUDGET OUTCOME AND NOTHING
      ELSE. STAGE 2 serialises each certified path as a census entry with
      provenance `certificate`, adds the fourth never-summed count, and measures
      key_field_admission field by field, reporting every rejection with the
      gate's own reason string. STAGE 3 runs the honest adjudicator and EACH
      known-false instrument separately -- including at least one constructed
      independently for this round -- over three populations reported separately
      and never pooled: synthetic only (the baseline reproduction), manufactured
      only, and the union. It emits per-instrument verdict vectors, the
      per-component variance profile of the key on each population, and the
      differing-cell count WITH ITS SELECTOR NAMED on every row. STAGE 4 runs
      the near-real decoys, the different-step-count nearby object, the key
      collision hunt, and the firewall receipt. Every table emits unmeasured
      cells as null, never as 0.
    controls:
      - >-
        POSITIVE CONTROL, GATING, AND IT IS A CERTIFICATE RATHER THAN A
        CITATION: at least one literal conforming message pair per primitive,
        independently re-verified. The instrument is shown to meet a real object
        for the first time, and no negative from any later stage may be read
        from a run in which this did not happen.
      - >-
        BASELINE-REPRODUCTION CONTROL: the synthetic-population verdict vectors
        must reproduce the committed evidence records exactly, or the comparison
        between populations is measuring the harness.
      - >-
        NEAR-REAL DECOY CONTROL: corrupted, non-conforming manufactured paths
        must be rejected by the entry gate. A gate that cannot reject is not a
        gate, and this is the control that keeps the word "real" honest.
      - >-
        PER-INSTRUMENT REPORTING, NEVER AVERAGED, with ENTAILED flags for any
        instrument whose score follows from its own definition, exactly as this
        campaign's dependency-graph audit requires.
      - >-
        INDEPENDENTLY CONSTRUCTED KNOWN-FALSE INSTRUMENT: at least one built for
        this round by a different construction path, because four instruments
        re-executed from one file are one construction and a separation measured
        only against them measures that construction.
      - >-
        VARIANCE-PROFILE CONTROL: the per-component variance of the canonical
        key on each population, reported BEFORE any separation number, so that a
        separation is attributed to a component that varies and a non-separation
        is attributable to one that does not.
      - >-
        NULL OBJECT: a population of freshly generated SYNTHETIC entries of the
        same size as the manufactured one, built by the old machinery. If it
        produces the same separation as the manufactured population, the effect
        is population SIZE and not population REALITY.
      - >-
        SCOPE CONTROL: every emitted table carries the four never-summed
        provenance counts and the shadow count, and no table permits a novelty
        statement to reference the certified_internal count.
      - >-
        FIREWALL CONTROL BY MECHANISM: no read access to
        coordination/goals/GOAL-MD5-001/quarantine/**, recorded in the receipt.
      - >-
        DEFERRED PUBLISHED-PATH CONTROL, PRE-REGISTERED: if acquisition ever
        unblocks, the identical battery is re-run with published entries and the
        separation count compared. Recorded now so the prediction precedes the
        object; NOT executable here and reported as unmeasured, never as
        satisfied.
    required_metrics:
      - certified_paths_count per primitive, each with its literal message pair,
        its step count, and its independent re-verification record
      - key_field_admission_fraction with the per-field table and gate reasons
      - instrument_separation_count with the full per-instrument verdict vectors
      - varying_component_count per population, per primitive
      - differing-cell counts WITH THE SELECTOR NAMED on every row, per
        population, never merged across populations
      - near_real_decoy_rejection_rate
      - synthetic_baseline_reproduction_rate
      - key_collision_count
      - construction_cost_seconds_per_certified_path and the declared budget
      - the four never-summed provenance counts plus the shadow count, on every
        emitted table

  falsification_conditions:
    - >-
      Zero certified conforming pairs for both primitives within the declared
      budget. The instrument never met a real object, every downstream number is
      reported as UNINTERPRETED, and the shortfall is recorded as a budget
      outcome about a solver and never as evidence that reduced-step paths do
      not exist.
    - >-
      synthetic_baseline_reproduction_rate below 1.0. The harness has changed
      and no cross-population comparison from the run may be cited.
    - >-
      instrument_separation_count of 0 with varying_component_count strictly
      greater on the manufactured population. Claim B is FALSE: the population
      was not the limiting factor, the instrument's blindness is structural, and
      the campaign's repair effort should move from census content to instrument
      redesign. This is a clean negative and is the outcome that would most
      change the campaign's direction.
    - >-
      varying_component_count NOT greater on the manufactured population. The
      manufactured entries are not more informative than the synthetic ones,
      claim B has no mechanism, and the separation prediction is withdrawn
      before it is tested rather than after.
    - >-
      Any key collision between a manufactured and a synthetic entry. The key
      cannot represent the distinction the whole design rests on, and this is
      reported before any other result.
    - >-
      near_real_decoy_rejection_rate below 0.9. The entry gate does not check
      conformance, so "certificate provenance" is a label rather than a
      property, and the record's central premise fails.
    - >-
      key_field_admission_fraction exactly 1.0 AND instrument_separation_count 0
      AND varying_component_count greater. The key format is adequate and the
      instruments are structurally blind -- the strongest and least comfortable
      combination, and it must be reported as such rather than split across
      sections.
    - >-
      Either specification, once read from primary text, differs from the
      recalled form. Every manufactured path is a path for a different primitive
      and is withdrawn rather than reinterpreted.

  confounders:
    - >-
      REAL IS NOT PUBLISHED, AND THIS IS THE MISREADING THE WHOLE DESIGN GUARDS
      AGAINST. A manufactured entry exercises the instrument; it says nothing
      about the literature. Anyone reading a separation measured on manufactured
      entries as evidence that the adjudicator would handle a PUBLISHED
      characteristic has crossed the scope line this campaign has held for four
      batches. The separate never-summed count exists to make that crossing
      visible in the artifact itself.
    - >-
      REDUCED-STEP PATHS MAY BE STRUCTURALLY DEGENERATE TOO, IN A DIFFERENT WAY.
      A path found by brute force at 24 steps is biased toward low condition
      counts and may vary in fewer key components than a full-round published
      path would. The variance-profile control measures exactly this, and if the
      manufactured population's variance advantage is small the whole prediction
      is weak and is reported as weak.
    - >-
      CONSTRUCTION AND VERIFICATION INDEPENDENCE DEGRADES SILENTLY. If the same
      session writes both implementations from one prompt, independence is
      nominal and a shared misreading of the specification would certify a
      non-path. The construction path is recorded as an artifact, as this
      campaign already records sibling blindness.
    - >-
      THE KNOWN-FALSE POPULATION IS STILL A SINGLE CONSTRUCTION unless the new
      instrument is genuinely built by a different path. A separation found only
      against four instruments re-executed from one file is a measurement of
      that file.
    - >-
      POPULATION SIZE VERSUS POPULATION REALITY. Adding any entries at all
      changes the denominators. The freshly generated synthetic null population
      of matched size exists so that a separation cannot be attributed to
      reality when size explains it.
    - >-
      A GATE REJECTION IS AMBIGUOUS. A field failing the well-formedness gate
      may indicate a key format too narrow for real objects, or a construction
      that emitted the field in the wrong encoding. Every rejection is reported
      with the gate's own reason string and with the offending value, so the two
      can be told apart by a reader rather than by the author.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW FOR EITHER PRIMITIVE AT ANY TIER, no cryptanalytic
      improvement is claimed, and a manufactured census entry is not a
      contribution to the literature. Claim tier ceiling `analyzed`, except that
      each conforming pair is a `certified` object in the narrow sense of
      docs/claims-and-verification.md and is nothing more.
    - >-
      THE READABLE PUBLISHED CENSUS REMAINS AT ZERO AFTER THIS RUN, BY DESIGN. A
      NON-MEMBER verdict against a census of manufactured entries carries no
      information about the literature, and the MD5 acquisition lane remains
      BLOCKED AND NOT CLOSED.
    - >-
      Reduced-step MD5 and reduced-step SHA-1 are different primitives; their
      conforming pairs are not collisions of MD5 or SHA-1 and no such result
      would be new.
    - >-
      Scoped to the frozen committed adjudicator, its declared generator set
      with each generator's verification status, the instrument population
      actually used, the step counts and budgets actually spent, and the seeds
      actually used.
    - >-
      This record introduces NO new tracked object; it changes the population an
      existing instrument is measured on. Its mechanism section says so first.

  heuristic_assumptions:
    - id: H1
      statement: >-
        POPULATION VARIANCE IS THE MECHANISM OF SEPARATION. An adjudicator whose
        canonical key omits component X returns verdicts identical to the honest
        one on any population in which X is constant, and can differ only on a
        population in which X varies. Formally: the known-false instrument is a
        function of a projection of the key, so its verdict vector equals the
        honest one whenever the projection is injective on the population, and
        the probability of a differing pair grows with the number of distinct
        values the omitted components take across the population. This imitates
        the standard information-theoretic statement that a function cannot
        distinguish inputs its argument does not separate.
      rigorous_support: >-
        Rigorous as a statement about the instrument AS A FUNCTION OF ITS KEY.
        It is NOT rigorous about an implementation, which may read the object
        outside the key -- and this campaign's measured surprises have all lived
        in exactly that gap. The rigorous half is what makes the prediction
        mechanistic; the gap is what makes it falsifiable.
      validation_plan: >-
        Compute, per key component and per population, the number of distinct
        values taken and the induced partition of the population; then predict,
        BEFORE running the adjudicator, exactly which instruments can possibly
        differ and on which objects, and compare that prediction with the
        measured verdict vectors. A separation on a component predicted constant
        means the implementation reads the object outside the key and is traced
        to the specific line, reported as an implementation finding. A
        non-separation on a component predicted to vary means the verdict is
        insensitive to that component for another reason, which is traced
        through the key's functional-dependency graph in the manner
        KN-TECH-6785f2 Rule C requires, RECOMPUTED PER INSTRUMENT rather than
        under the honest instrument. Sampled parameters: both primitives, all
        declared key components, all three populations, declared seeds. TAIL
        CHECK: the single object on which any separation occurs is printed in
        full with both instruments' keys beside it. TRANSFER ASSUMPTION,
        STATED: variance profiles measured on manufactured reduced-step paths do
        not transfer to published full-round paths.
    - id: H2
      statement: >-
        MANUFACTURED REALITY IS DIAGNOSTIC. A reduced-step path certified by a
        conforming message pair exercises the adjudicator's key in the same
        qualitative regime that a published full-round path would -- multi-word
        signed differences, a nontrivial step-wise difference trace, a nonempty
        condition set -- so a key or an instrument that fails on the former
        would fail on the latter. This imitates the standard practice of
        validating an instrument on scaled-down instances of the same shape,
        which docs/inventor-protocol.md section 6 step 2 requires.
      rigorous_support: >-
        NONE distributional. The rigorous content is only that the path CONFORMS
        -- certified by a literal pair re-verified independently -- and that
        conformance is the property the entry format claims to carry. Whether
        reduced-step reality resembles full-round reality in the ways the key
        cares about is exactly what is assumed and is NOT established here.
      validation_plan: >-
        Report the manufactured entries' field-by-field profile beside the
        synthetic entries' and beside the schema's declared domains: number of
        differing words, signed-difference weights, condition-set size, step
        span. Measure the fraction of schema fields whose value distribution
        differs between the two populations and report it as the quantitative
        content of "more realistic". Vary the step count across at least two
        values so that a trend, not a point, is observed. Sampled parameters:
        MD5 at r in {16, 24}, SHA-1 at r in {24, 32}, declared seeds and
        budgets. TAIL CHECK: the manufactured path with the LARGEST condition
        set is inspected individually, since a degenerate easy path could
        anchor the whole profile. TRANSFER ASSUMPTION, STATED: no transfer to
        published paths is claimed, and the deferred published-path control is
        pre-registered rather than executed.

  target_complexity:
    time_exponent: >-
      No asymptotic parameter. Path construction is dominated by the
      conforming-pair search: capped by a declared budget of at most 2^32
      compression-step evaluations per primitive, i.e. hours single-threaded and
      well under an hour on four cores at reduced step counts where conditions
      are few. Adjudication is unchanged from the committed instrument, one
      canonicalisation per (entry, instrument) pair, roughly 2^13 bit operations
      each, over a population of tens of entries and about five instruments --
      negligible. Variance profiling and the collision hunt are linear in
      population size.
    memory_exponent: >-
      Negligible throughout: the population is tens of entries of a few kilobytes
      each, and the search is memoryless. No table and no time-memory tradeoff.
    best_known: >-
      IN THIS PROGRAM: the number of REAL, non-synthetic differential paths any
      instrument of this campaign has ever adjudicated is ZERO, across four
      batches; the readable census is 0 and the only real path in the repository
      is quarantined under another goal's firewall and referenced by digest
      only. So the baseline is not a worse number, it is the absence of the
      object. IN THE LITERATURE: NOT APPLICABLE -- constructing reduced-step
      conforming pairs is routine and certainly published many times over, and
      NO NOVELTY IS CLAIMED FOR THE CONSTRUCTION. What has no counterpart
      anywhere is the measurement in claim B, which is about THIS campaign's
      instruments.
    hidden_overhead: >-
      No o(1). What is hidden and is stated: the manufactured population is
      reduced-step and brute-force-findable, so it is biased toward low
      condition counts, and the strength of claim B's mechanism is bounded by
      how much MORE the key varies on it than on the synthetic population --
      which is measured first, as a required metric, precisely so the bound is
      visible before the headline.
    tradeoff_note: >-
      The conforming-pair search is embarrassingly parallel and memoryless, and
      trades wall clock against the number and quality of certified paths; that
      trade is reported per path with the budget spent, never as a single
      success count. Adjudication needs no parallelism at all.

  dominated_by: >-
    PARETO CHECK, ROW BY ROW, ACROSS TIME, MEMORY AND EVIDENTIAL STRENGTH. (1)
    Against the committed adjudicator and its four batches of controls
    (KN-TECH-6785f2; EV-DIFFP-b878aa, b16b01, afd96c, 1e08cc): NOT dominated on
    evidential strength -- every one of those measurements is confined to a
    synthetic population and none can distinguish a property of the instrument
    from a property of the objects; it IS dominated on cost, since those
    measurements needed no path construction. The trade is disclosed and is the
    whole design. (2) Against IDEA-20260829-9e6650: NOT dominated and
    COMPLEMENTARY IN A PRECISE SENSE -- that record changes the verdict TYPE on
    the old population, this changes the POPULATION under the old type, and the
    campaign's central failure has exactly those two candidate causes. If both
    run, the 2-by-2 is informative in all four cells. (3) Against the pending
    roughly 2950-second selector-swap control in the goal's live next_action:
    NOT dominated and not a substitute -- that asks whether a differing-cell
    count is a property of the pair or of the selector, on the same population;
    this asks whether it is a property of the population. They compose, and this
    one does not presuppose the funding decision. (4) Against Tier C acquisition
    of a published path: NOT DOMINATED BUT STRICTLY WEAKER ON THE QUESTION
    ACQUISITION ANSWERS, and this is stated in the direction that does not
    flatter the record: a published characteristic would test the adjudicator
    against the object the census is actually for, which a manufactured path
    cannot do. This record is what is available while that lane is blocked, and
    it is EXPLICITLY NOT an argument for continuing to defer acquisition -- the
    lane is BLOCKED, NOT CLOSED, and its named unblocking route is unaffected by
    anything here. (5) Against IDEA-20260829-c92c2f: PARTIALLY OVERLAPPING ON
    MACHINERY AND NOT DOMINATED ON CLAIM -- that record's stage 3 builds MD5
    conforming pairs to corroborate a screen verdict; this one builds them to
    populate a census and probe an instrument. If that record runs first, this
    one's MD5 construction is nearly free. (6) Against IDEA-20260829-d81e3b,
    -a03f74, -f2ffc1 and -ea385e: NOT dominated and disjoint -- code structure,
    automorphisms, denominators and cost invariance, none of which touches the
    adjudicator's population. (7) Against the 2026-08-28 RQ-SHAONE round,
    specifically IDEA-20260828-2804d3 (acquire the SHAttered and SHAmbles
    artifacts) and IDEA-20260828-ca6584 (validate a detector against
    classically-constructed collisions): NOT DOMINATED AND THE NEAREST
    NEIGHBOURS IN THE WHOLE CORPUS -- both obtain or construct real colliding
    objects to test an instrument, which is the same instinct. They differ on
    the object and the instrument: those test collision DETECTORS against
    already-public COLLISIONS, this tests a novelty ADJUDICATOR against
    manufactured PATHS, and a collision is not a path. The overlap is declared
    rather than hidden and the machinery may be shared.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THIS CAMPAIGN'S OWN MEASURED BASELINES. Number of
    real, non-synthetic differential paths this program's adjudicator has ever
    seen: 0, after four batches. Number of key components measured to vary
    across the population it was calibrated on: bounded by a 16-entry synthetic
    set whose MD5 differences all have weight 1. Separation between the honest
    adjudicator and the message-difference-blind one: MEASURED at 0 by the
    planted-positive and null controls (96 of 96 versus 96 of 96, 0 of 3000
    versus 0 of 3000) and MEASURED at 0 by the differing-cell count over the
    adjudicated cells. This record moves the first number from 0 to at least 4
    for under 2^32 compression evaluations, reports the second as a measured
    per-component profile for the first time, and predicts the third becomes at
    least 1. THE READABLE PUBLISHED CENSUS IS UNCHANGED AT 0 AND NO NOVELTY
    STATEMENT BECOMES AVAILABLE IN EITHER DIRECTION. NO CRYPTANALYTIC DELTA IS
    CLAIMED: no attack, no path claimed new, no cost, and nothing about any
    deployed system.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation is two independent reference implementations per primitive,
      a conforming-pair search with elementary message modification, a census
      entry serialiser matching the committed schema, and a driver that runs the
      frozen adjudicator over three populations and about five instruments.
      Compute is dominated by the conforming-pair searches under a declared cap
      of 2^32 compression-step evaluations per primitive; the MD5 arm at r = 16
      is minutes and is the one that gates the conclusion.

  recommended_priority: high
