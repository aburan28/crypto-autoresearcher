idea:
  id: IDEA-20260829-c94020
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    A CENSUS ENTRY DOES NOT NEED A CITATION TO BE REAL -- manufacture the
    adjudicator's first NON-SYNTHETIC objects by constructing reduced-step
    differential paths that carry literal conforming message pairs as
    certificates, carry them under a THIRD never-summed provenance count that
    can never support a novelty statement, and measure whether the five
    known-false instruments that are indistinguishable on the 16 planted
    entries stay indistinguishable when the instrument finally meets a real path
  class: control

  claim: >-
    (A) THE PROVENANCE CLAIM, AND IT IS THE ONE THAT UNBLOCKS THE LANE. This
    campaign's census is readable-empty because every route to content runs
    through acquisition, which is refused at Tier A and blocked at Tier B. But
    "readable" and "published" are different predicates. A differential path
    CONSTRUCTED BY THIS PROGRAM at reduced steps, carrying a literal pair of
    messages that conform to it and re-verified by an independent reference
    implementation, is a genuine, non-synthetic instance of exactly the tracked
    object RQ-DIFFP-a5c483 declares -- a real message-difference vector with a
    real signed bit-difference path and a real condition set for MD5, a real
    disturbance vector with a real induced near-collision path for SHA-1. It is
    REAL and it is NOT PUBLISHED, and those two facts are carried as separate
    counts that are never summed: readable_published stays at 0,
    quarantined_not_read stays at 1, acquisition_gap stays at 8,
    shadow_planted stays at 16, and a NEW count certified_internal is added
    beside them. NO NOVELTY STATEMENT OF ANY KIND MAY CITE THE NEW COUNT, and
    the schema enforces that by construction.
    (B) THE FALSIFIABLE, MEASURABLE CLAIM, AND IT IS WHAT THE EXPERIMENT
    ACTUALLY TESTS. This campaign measured five known-false instruments -- among
    them one whose canonical key cannot see the message difference at all, and
    one returning NON-MEMBER for every object -- to be indistinguishable from
    the honest adjudicator under its verdict-based controls, with a
    differing-cell count of EXACTLY 0 over the adjudicated cells. Every one of
    those measurements was taken on a synthetic population of 16 planted
    entries in which every MD5 entry carries a weight-1 message difference no
    real characteristic has. THE CLAIM IS THAT THE POPULATION WAS PART OF THE
    PROBLEM: on a population of manufactured REAL paths, at least ONE of the
    declared known-false instruments becomes distinguishable from the honest one
    -- its per-instrument verdict vector differs on at least one object. IF NO
    INSTRUMENT BECOMES DISTINGUISHABLE, the synthetic population was NOT the
    limiting factor, the instrument's blindness is structural rather than a
    sampling artifact, and that is a stronger and more useful negative than any
    further control on synthetic objects could produce. BOTH OUTCOMES CLOSE A
    QUESTION THAT FOUR BATCHES HAVE LEFT OPEN.
    (C) THE SECOND MEASURABLE CLAIM, ABOUT THE KEY FORMAT RATHER THAN THE
    INSTRUMENTS. The fraction of the adjudicator's canonical-key fields that are
    populated, well-formed and admitted by its own well-formedness gate on a
    real path is STRICTLY BELOW 1.0 -- at least one field is under-specified,
    absent, or gate-rejected, because the key and its gate were designed and
    tuned against weight-1 synthetic differences. If the fraction is exactly
    1.0, the key format is confirmed adequate for real objects for the first
    time in this campaign, which is also a result and is the first evidence the
    schema was ever exercised outside its design population.
    (D) WHAT IS NOT CLAIMED. No path is claimed new, for either primitive, at
    any tier. A manufactured entry is by construction NOT evidence about the
    literature, a NON-MEMBER verdict against a census containing only
    manufactured entries carries no information about the literature at all, and
    a reduced-step conforming pair is not a collision of MD5 or SHA-1 and would
    not be new if it were.

  mechanism: >-
    THE DIAGNOSIS, AND IT IS ABOUT A POPULATION RATHER THAN AN INSTRUMENT. Four
    batches strengthened the controls around a verdict and each time discovered
    the previous reading had been about something else. What never changed
    across those four batches is the POPULATION: 16 synthetic planted entries,
    built by one session, with degenerate MD5 differences. Every measured
    indistinguishability -- 96 of 96 against 96 of 96, 0 of 3000 against 0 of
    3000, a differing-cell count of 0 -- is a statement about how those
    instruments behave ON THAT POPULATION. A key component can only be shown to
    matter by a population in which it VARIES, and a population of weight-1
    differences varies in almost nothing.
    THE MECHANISM IS TO CHANGE THE POPULATION, AND THE ONLY OBSTACLE WAS A
    CATEGORY ERROR. The campaign has treated "census entry" and "published path"
    as the same thing, so an empty acquisition lane read as an empty census. But
    what the adjudicator consumes is a PATH, not a citation, and what makes a
    path real is that messages conform to it -- a property this program can
    ESTABLISH BY CERTIFICATE, exactly as docs/claims-and-verification.md already
    requires for every claimed solve. Reduced-step conforming pairs are within
    reach of brute force plus elementary message modification, so a real path
    can be manufactured in an afternoon without opening a single paper and
    without approaching the quarantine.
    WHY THIS SEPARATES THE KNOWN-FALSE INSTRUMENTS, MECHANISTICALLY AND NOT BY
    HOPE, AND WHY THE PREDICTION IS FALSIFIABLE. An instrument blind to a key
    component behaves identically to the honest one exactly when that component
    is CONSTANT across the population. On the synthetic population the MD5
    message differences are all weight 1 and structurally near-identical, so the
    difference field is close to constant and the blind instrument agrees. A
    manufactured path has a multi-word signed difference, a nontrivial step-wise
    difference trace and a nonempty condition set, so the field varies -- and
    the blind instrument must diverge WHERE IT VARIES or its blindness is not
    where the campaign thinks it is. THE PREDICTION IS THEREFORE MECHANISTIC AND
    ITS FAILURE IS INFORMATIVE: if the instrument still agrees on a population
    where the withheld component varies, the component is being read outside the
    key, and that is an implementation finding with a specific line attached.
    THE LOSSY-PROJECTION TEST, ANSWERED IN THE NEGATIVE AND SAID FIRST. THIS
    RECORD INTRODUCES NO NEW TRACKED OBJECT. Its objects are instances of the
    object RQ-DIFFP-a5c483 already declares; what is new is their PROVENANCE
    TYPE and the never-summed count that carries it. The record is a control and
    a population change, and claiming otherwise would fail the test on
    inspection.

  novelty_status: unverified
