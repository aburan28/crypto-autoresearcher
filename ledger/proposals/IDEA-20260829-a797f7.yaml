idea:
  id: IDEA-20260829-a797f7
  question_id: RQ-MLKEM-002
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    "At least one additional implementation" counts artifacts, not
    observations. Measure the lineage partition of the comparison-routine
    population and the effective independent sample size N_eff -- and note the
    forced-zero cell the lane has never named: a differential gate whose
    reference shares a lineage with its peer has power EXACTLY ZERO against
    the systemic hypothesis it exists to test
  class: control

  claim: >-
    (A) THE DECISION TARGET COUNTS THE WRONG THING. RQ-MLKEM-002 asks to decide
    "whether the incomplete-comparison class is isolated to the audited wolfSSL
    pre-fix routines or appears in at least one additional implementation whose
    comparison routine is in the same defect-mechanism neighborhood". That
    sentence counts IMPLEMENTATIONS. The inference it licenses -- isolated
    versus systemic -- requires INDEPENDENT OBSERVATIONS. Those are the same
    thing only if distinct implementations wrote their comparison routines
    independently. Optimized cryptographic comparison routines are among the
    most-copied code in the ecosystem: they are short, subtle, and correctness-
    critical, which is exactly the profile that makes an implementer paste
    rather than reinvent. If the fetchable population descends from a small
    number of ancestors, then finding the defect in two implementations is one
    observation reported twice, and finding it in one is not evidence of
    isolation either -- both verdicts are computed against an unmeasured
    effective sample size.
    (B) THE FORCED-ZERO CELL, WHICH IS THE SHARP PART. A differential
    conformance gate observes a disagreement between a PEER UNDER TEST and a
    REFERENCE. A SYSTEMIC defect is, by definition, one present in both. If the
    reference is drawn from the same lineage as the peer -- a sibling fork, a
    vendored copy, a port of the same routine -- then a lineage-wide defect is
    present in both arms, the two arms AGREE, and the gate reports no
    disagreement. Its per-probe detection probability against a lineage-wide
    defect is EXACTLY 0, for every generator, every budget, every parameter set
    and every mutation class. This is a null-that-cannot-fail (KN-TECH-1a5b7e
    mode 1) aimed squarely at the gate's own target conclusion, and it is
    located in the POPULATION -- neither in the control arm
    (IDEA-20260724-001/-002), nor in the generator's support law
    (IDEA-20260821-13b667, which computes power against a defect the reference
    does not share), nor in the instrument's wiring (EV-MLKEM-009/-010). No
    record in this lane names it.
    (C) THE OBJECT, AND WHY IT IS DECIDABLE. Define the COMPARISON SKELETON of
    a routine: its source or disassembly token stream after normalizing away
    identifiers, types, literal constants, comments, whitespace and register
    names, retaining only the operator sequence and control-flow shape. Two
    routines are LINEAGE-LINKED at resolution n if they share a common
    contiguous skeleton n-gram covering at least a declared fraction of the
    shorter routine. The transitive closure of that relation partitions the
    fetched population into LINEAGE CLASSES, and N_eff is the number of
    classes. Both N_eff and the class membership are computed mechanically from
    fetched source, with no judgement call of the kind that produced
    EXP-MLKEM-009's five taste-based rejections.
    (D) THE STRUCTURAL TELL THAT SEPARATES SHARED CODE FROM SHARED IDIOM. Any
    two constant-time byte comparisons look alike; that is not lineage, it is a
    small idiom vocabulary. The discriminator is a DECAY CURVE. Plot the
    longest shared skeleton n-gram, or the shared-n-gram coverage, as a
    function of n. For two independently written routines drawing on the same
    idiom vocabulary, shared coverage must DECAY toward zero as n grows, since
    agreement at long range requires agreement on choices the idiom does not
    force. For two routines with a common ancestor, coverage stays HIGH out to
    n comparable with the routine's own length. This is the inventor protocol's
    section-3 tell used in its exact canonical form: a quantity that should
    decay under the parameter meant to destroy it, and does not, is the
    signature -- here, of shared origin rather than of an artifact.
    (E) THE CORPUS ALREADY CONTAINS ONE LINEAGE OBSERVATION AND NEVER USED IT.
    IDEA-20260828-033cb3, read in full this session, refers to
    "IDEA-20260821-121612's ALREADY-NOTED aws-lc/mlkem-native duplication" as a
    known phenomenon it declines to re-examine. Two of the five candidate
    implementations EXP-MLKEM-009's strict order considered are therefore
    already suspected of code sharing inside this program's own records, and
    that suspicion has never been converted into a population statement. If it
    holds, the population that the goal searched and found empty was smaller,
    in independent-observation terms, than its count of artifacts suggested --
    which bears directly on how much the recorded
    second_impl_unavailable disposition is a fact about the world versus a fact
    about the sample.
    (F) THE DISCRIMINATING QUESTION, WITH TWO REACHABLE AND OPPOSITE ANSWERS.
    What is N_eff over the fetchable ML-KEM comparison-routine population, at
    a declared resolution?
    N_eff LARGE (say at least 3 classes with the wolfSSL routine in a class of
    its own): the isolation-versus-systemic verdict is licensable, the record
    states at what resolution and with what class sizes, and this proposal
    returns a clean negative that STRENGTHENS every existing null in the lane
    by supplying the independence premise they all assume.
    N_eff = 1, or the wolfSSL routine sharing a class with the intended
    reference: the verdict is not licensable by any amount of probing of that
    population, and that is a closure at the inventor protocol section-4
    standard -- a NAMED OBSTRUCTION (the population is one sample), an ARGUMENT
    (the forced-zero cell of claim (B)), and FORWARD GUIDANCE naming the
    classes that remain: independently authored implementations, formally
    verified ones whose comparison is generated from a specification rather
    than written, hardware or smartcard implementations, and a
    specification-derived reference written for this program precisely so that
    it shares no lineage with anything it is used to test.
    (G) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement, no
    statement about MLWE hardness or ML-KEM security at any parameter set. No
    claim that any two named implementations share code -- that is the
    measurement, not the premise. No claim that shared lineage implies shared
    defect: it implies that a differential gate cannot SEE a shared defect,
    which is a statement about the instrument's power and not about any
    implementation's correctness. Copying well-reviewed cryptographic code is
    ordinarily good practice and nothing here says otherwise. Any newly
    observed conformance defect escalates to the coordinator per RQ-MLKEM-002
    and is published by no agent.

  mechanism: >-
    STAGE 0 -- FREEZE THE NORMALIZER AND THE RESOLUTION BEFORE ANY PAIR IS
    SCORED. Define the skeleton normalizer exactly: strip comments and
    whitespace; replace every identifier with a positional placeholder; replace
    every integer and floating literal with a single token; replace every type
    name with a token carrying only its width class; retain operators,
    punctuation, control-flow keywords and call structure in order. Define
    lineage-linkage at resolution n as shared contiguous skeleton n-grams
    covering at least a fraction f of the shorter routine's skeleton, with n
    and f declared and hashed in advance. Emit the normalizer's output on two
    fixture inputs and hash it, so that a later change to the normalizer is
    visible rather than silent.
    STAGE 1 -- CALIBRATE THE NORMALIZER AT BOTH ENDS BEFORE MEASURING ANYTHING.
    Two forced-value calibration sets, both able to fail:
      KNOWN-FORK SET: pairs that are the SAME routine at two commits, or a file
      and its vendored copy -- for instance the wolfSSL comparison at the two
      peeled commits already pinned in this lane's records (1d363f3 and
      ac01707), which differ by a known small edit. FORCED: lineage-linked at
      every resolution up to nearly the routine's length, with high coverage.
      A known fork scored as unrelated means the normalizer is destroying the
      signal.
      KNOWN-UNRELATED SET: pairs that cannot share an ancestor -- a comparison
      routine against a memcpy, against an NTT butterfly, against a comparison
      routine from an unrelated cryptosystem in a different project. FORCED:
      coverage decaying to zero well before n reaches the routine length. A
      known-unrelated pair scored as linked means the normalizer has erased so
      much that everything collides, which is the failure mode a
      too-aggressive normalization produces and the one this calibration
      exists to catch.
    STAGE 2 -- THE DECAY CURVE, MEASURED NOT ASSUMED. For every pair in the
    population and in both calibration sets, plot shared-skeleton coverage
    against n over a declared grid, and report the curve rather than a single
    threshold verdict. The deliverable is the CURVE and its separation between
    the two calibration sets; the threshold is chosen from the calibration sets
    alone and frozen before any real pair is scored, so that no pair's
    classification can be tuned after it is seen.
    STAGE 3 -- THE PARTITION AND N_eff. Compute the transitive closure of
    linkage at the frozen resolution over the fetched population, report the
    classes with their members, and report N_eff. Report separately, for each
    class, whether it contains the wolfSSL routine that founded this lane and
    whether it contains whatever routine any archived or planned gate used as
    its REFERENCE arm. That second column is the one that decides claim (B) for
    this program's own experiments.
    STAGE 4 -- THE POWER STATEMENT, HANDED TO THE GATE. For each (peer,
    reference) pair the lane has used or plans to use, emit the pair's lineage
    relationship and the consequent statement: SAME CLASS means power exactly 0
    against a defect inherited from the common ancestor, and the archived null
    from that pair carries no information about that defect family; DIFFERENT
    CLASSES means the pair is a genuine differential and its power is whatever
    IDEA-20260821-13b667's formalism says it is. This record computes no
    probability of its own; it supplies the premise 13b667's formalism silently
    assumes, and says so rather than duplicating it.
    STAGE 5 -- THE CROSS-ISA BOUNDARY, DECLARED AND MEASURED. A port of one
    routine from AVX2 to NEON changes every operator token, so the skeleton
    method CANNOT detect that lineage and will report the pair as unrelated.
    That is a false negative of a known kind and it is measured rather than
    argued: score the wolfSSL AVX2 and NEON comparison routines against each
    other -- two routines this lane's own founding evidence describes as the
    same defect being fixed in the same release, hence plausibly a deliberate
    pair -- and report the method's verdict beside the known relationship. If
    the method calls them unrelated, N_eff as measured is an UPPER BOUND on the
    true number of independent origins, and every conclusion is stated in that
    direction rather than in the flattering one.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over the repository plus first-hand reads; the crypto-kb MCP index's
      availability was not re-checked and is not relied on. Grep of
      ledger/proposals (glob *MLKEM*) for
      `lineage|ancestry|derived from|copied|common ancestor|independen`,
      case-insensitive, count mode: ZERO MATCHES ACROSS ZERO FILES. Read in
      full or in their claim/mechanism/object blocks this session: all eleven
      RQ-MLKEM-002 proposals, RQ-MLKEM-002, RQ-MLKEM-001, RQ-MLKEM-003,
      EV-MLKEM-005 (full), RUN-MLKEM-007 summary.json (full). No web retrieval
      was performed for this record.
    results: >-
      The zero-match grep is the headline: not one filed proposal in this lane
      uses the vocabulary of code provenance, shared origin, or sample
      independence, despite the decision target turning on a count of
      implementations. EV-MLKEM-005's boundaries clause names "shared-defect"
      among the classes its null does not cover -- the closest the corpus comes
      -- and no proposal has taken it. IDEA-20260828-033cb3 refers in passing to
      "IDEA-20260821-121612's ALREADY-NOTED aws-lc/mlkem-native duplication"
      while explicitly declining to examine it, which establishes both that the
      phenomenon has been seen here and that it has never been made an object.
      IDEA-20260821-25d3ca's census asks whether ONE implementation's two sites
      share a symbol -- sharing WITHIN an artifact, not BETWEEN artifacts, and
      a different question with a different consequence. IDEA-20260821-13b667
      computes detection power per (generator, defect class) and its entire
      derivation presumes a correct reference peer; it never asks where the
      reference comes from. Outside the repository, code-clone detection,
      software provenance and token n-gram similarity are established fields
      with a large literature; NO SEARCH was performed and NO EXTERNAL NOVELTY
      IS CLAIMED for the detection technique, which is deliberately the most
      ordinary one available so that the contribution rests on the population
      argument rather than on the tool.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: distinguishing
      artifact count from independent-observation count in this lane's decision
      target; the forced-zero cell for a same-lineage (peer, reference) pair;
      N_eff as the quantity the verdict should be computed against; the decay
      curve as the discriminator between shared code and shared idiom; and the
      section-4 closure that a population with N_eff = 1 supplies, with its
      forward guidance. ASSEMBLED FROM KNOWN PARTS: the null-that-cannot-fail
      framing is KN-TECH-1a5b7e's, applied to a new location; the power
      formalism this record supplies a premise for is IDEA-20260821-13b667's;
      the aws-lc/mlkem-native observation is IDEA-20260821-121612's;
      token-normalized clone detection is standard software engineering and is
      claimed as nobody's discovery.

  object_first_candidate:
    tracked_object: >-
      THE COMPARISON SKELETON and the LINEAGE PARTITION it induces on the
      fetchable population, with N_eff -- the number of lineage classes -- as
      the derived scalar the verdict must be computed against. What is followed
      is not a defect, a byte position or a probability but the PROVENANCE
      RELATION between artifacts.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens per
      inventor-protocol section 1: (a) the silent set and every derived
      quantity -- size, profile, period, shape (IDEA-20260805-1beeca, -ee2018);
      (b) the length residue L mod w (IDEA-20260805-3c957e); (c) the
      generator's difference support and its power law (IDEA-20260821-13b667),
      which this record supplies a premise for rather than extends;
      (d) compiled stride, coverage determinacy and call-site specialization
      (IDEA-20260821-121612, IDEA-20260828-033cb3); (e) downstream primitives
      (IDEA-20260828-40db79, -edec21); (f) control-arm wiring and
      baseline-invisibility (IDEA-20260724-001, -002), which is about where the
      instrument is attached and not about where the peers came from;
      (g) every cryptanalytic and physical side-channel lens, excluded by
      RQ-MLKEM-002.
    lossiness: >-
      Genuinely and aggressively lossy, and the discard is compatible with the
      operation that actually occurs during code reuse. A routine's full state
      is its source text with every identifier, type, constant, comment,
      formatting choice and register allocation. The skeleton retains only the
      operator and control-flow sequence. The fibre over a skeleton is
      enormous: every renaming, every retyping, every reformatting, every
      constant substitution and every comment rewrite of a routine maps to the
      same point, which is precisely the set of transformations a developer
      applies when adapting borrowed code, and is why the projection tracks
      provenance rather than text.
      IT IS NOT A CHANGE OF COORDINATES: the source is not recoverable from the
      skeleton, and the calibration sets prove the fibre is non-singleton by
      construction (the same skeleton is reached from two different commits of
      the same routine).
      COMPATIBILITY IS PARTIAL AND THE BOUNDARY IS DECLARED IN ADVANCE. The
      skeleton is preserved under rename, retype, reformat and constant change;
      it is preserved up to bounded edit distance under small functional edits
      such as the one that separates the two pinned wolfSSL commits; and it is
      DESTROYED by a cross-ISA port, which rewrites every operator. So the
      projection propagates through some code-reuse operations and not others,
      making measured N_eff an UPPER BOUND on the number of independent origins
      and every conclusion drawn from it conservative in one specific,
      nameable direction. That asymmetry is stated wherever N_eff is reported.
    propagation: >-
      One step of the operation of interest is "an implementer adapts an
      existing comparison routine into a new project". The propagation law is:
      rename, retype, reformat and constant substitution leave the skeleton
      INVARIANT; a local functional edit changes it by a bounded number of
      tokens, so shared-n-gram coverage degrades gracefully rather than
      vanishing; a cross-ISA port maps it to an unrelated skeleton. Composing
      over a chain of adaptations, coverage decays with the number of
      functional edits and not with the number of cosmetic ones -- which is
      exactly the behaviour a provenance tracker needs and exactly what the
      calibration sets measure rather than assume.
    survival_score: >-
      Survives two steps and dies at a stated third. Step 1, cosmetic
      adaptation: survives exactly. Step 2, small functional edit: survives
      with graceful degradation, and the known-fork calibration set at the two
      pinned wolfSSL commits measures how graceful. Step 3, cross-ISA port or a
      rewrite from the specification: DIES, and the Stage-5 AVX2-versus-NEON
      measurement quantifies the death rather than assuming it. A fourth step,
      "does shared lineage imply the shared routine actually carries the same
      defect", is NOT attempted: lineage bounds what the gate can SEE, not what
      the code DOES, and conflating the two would be the correlation-to-
      mechanism error the idea-generator contract forbids.

  discriminated_from:
    - >-
      IDEA-20260821-13b667 computes P_hit per (generator, defect class) and
      translates archived budgets into power. Every one of its cells presumes
      the reference peer would reject what the peer under test accepts. This
      record does not compute any probability; it measures whether that
      presumption holds for a given pair, and it identifies the one
      configuration -- same lineage -- in which every cell of that matrix is
      identically 0 regardless of generator or budget. The two are
      complementary and neither restates the other.
    - >-
      IDEA-20260821-25d3ca asks whether ONE implementation uses the SAME SYMBOL
      at two call sites, so that a gate at one site transitively covers the
      other. That is sharing WITHIN an artifact and its consequence is extra
      coverage. This record measures sharing BETWEEN artifacts and its
      consequence is LESS INFORMATION, because two artifacts sharing a routine
      are one observation, not two. Same word, opposite consequence, different
      object.
    - >-
      IDEA-20260828-033cb3 asks whether one symbol fractures into distinct
      machine bodies across call sites under LTO. That is a question about a
      compiler acting on one source. This record is a question about developers
      acting across projects, and it explicitly does not re-examine the
      aws-lc/mlkem-native duplication -033cb3 declines to examine, it MEASURES
      it as one cell of a population census.
    - >-
      IDEA-20260724-001 and -002 repair WHERE the adequacy control is wired and
      whether it is baseline-invisible. A perfectly wired, perfectly invisible
      control still tells you nothing about the systemic hypothesis if the two
      arms of the differential are the same code. This record is orthogonal to
      both and consumes their conclusions unchanged.
    - >-
      A conventional code-clone or plagiarism detection exercise reports
      similarity for its own sake. This record reports exactly one derived
      quantity, N_eff, and exactly one consequence, the licensability of the
      lane's decision target, with a forced-zero power cell as the argument
      connecting them.

