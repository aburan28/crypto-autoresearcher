  assumptions:
    - >-
      The comparison routine of each candidate implementation is locatable and
      fetchable as source. Where only a binary is available, the skeleton is
      taken from disassembly and the cell is marked as such, since disassembly
      skeletons are not comparable with source skeletons and are scored only
      against each other.
    - >-
      Cosmetic adaptation dominates functional rewriting in real code reuse, so
      that a shared ancestor leaves a detectable long-range skeleton match.
      This is the load-bearing behavioural assumption and it is what the
      known-fork calibration set measures rather than asserts.
    - >-
      The frozen threshold derived from the calibration sets separates them
      cleanly. If the two calibration sets' decay curves overlap at every
      resolution, no threshold exists, the method cannot classify, and the
      record reports that rather than picking a threshold anyway.
    - >-
      No conclusion transfers beyond the artifacts actually fetched and scored.
      N_eff is a property of a fetched population at a declared resolution and
      of nothing else.

  proof_search_map:
    bottleneck: >-
      The step from "these two routines share a long skeleton n-gram" to "they
      share an ancestor, hence are one observation rather than two". Short
      constant-time comparison routines draw on a small idiom vocabulary, so
      the inference is not automatic; the decay curve and its two calibration
      sets are the entire apparatus for licensing it, and if they do not
      separate, the bottleneck is not passable and the record says so.
    baseline_embedding:
      parameter_slice: >-
        At the degenerate resolution where every pair is declared unlinked,
        N_eff equals the artifact count and every existing verdict in this lane
        is recovered exactly as stated. The lane's current implicit model is
        therefore the n = infinity slice of this one, and the proposal is a
        family extension that can only reduce N_eff below the artifact count,
        never raise it. That monotone direction is what makes the correction
        conservative.
      reproduction_check: >-
        Verify on the known-fork calibration pair that at a resolution chosen
        high enough to declare everything unlinked, the method does declare the
        two pinned wolfSSL commits unlinked -- i.e. that the degenerate slice is
        actually reachable and the method has a knob rather than a fixed
        verdict. A method that reports linkage at every resolution is not
        measuring resolution and its curve is meaningless.
    observation_collision:
      observable: >-
        The lane's verdict observable: "the defect was found in k of n
        implementations".
      distinct_preimage_search: >-
        Two ground-truth-distinct worlds produce the identical observable
        "found in 2 of 5": (i) five independently written routines, two of
        which independently made the same mistake -- genuine evidence of a
        systemic hazard; and (ii) five artifacts comprising two lineages, where
        one lineage of two artifacts carries one ancestral mistake -- a single
        observation of a single bug. The count cannot distinguish them. This is
        a direct collision on the quantity the decision target is defined in
        terms of, and the separating condition is the lineage partition, which
        is measured from the artifacts and not from the verdict.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The lineage partition, preserved alongside the defect count, because
          the partition is what survives when the population is enlarged by a
          fetch and the raw count does not.
        predicted_gain: >-
          Makes the verdict a function of (defect count, N_eff) rather than of
          the count alone, so that adding a fetched artifact changes the
          verdict only when it adds an independent origin.
      - transform: observable_fiber
        proposed_object: >-
          The verdict observable held fixed at "found in k of n" while the
          forgotten structure -- the provenance relation among the n -- is
          varied.
        predicted_gain: >-
          Exhibits two worlds with the same observable and opposite correct
          verdicts, which is precisely what identifies the missing premise.
    quantifier_order: >-
      The forced-zero cell is universal and unconditional given its hypothesis:
      FOR ALL differential gates, FOR ALL generators, FOR ALL budgets, IF the
      peer and the reference both contain a defect inherited from a common
      ancestor, THEN the gate observes agreement and its detection probability
      is 0 -- no witness may depend on the generator, which is what makes it a
      structural rather than a statistical statement. The population claim is
      existential and per-fetch: THERE EXIST two fetched artifacts in one
      lineage class -- checked by measurement, never asserted uniformly, and
      possibly false, in which case the record returns its clean negative.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a stated, finite set of fetched routines at a declared resolution,
        this method certifies an UPPER BOUND on the number of independent
        origins and identifies which (peer, reference) pairs are same-class. It
        cannot certify a LOWER bound, because a cross-ISA port or a rewrite
        from the specification is invisible to it; it certifies nothing about
        whether any shared routine actually carries a defect; and it certifies
        nothing about artifacts not fetched.
      nearby_object_control: >-
        The known-unrelated calibration set -- a comparison routine against a
        memcpy and against a comparison routine from an unrelated cryptosystem
        -- is the nearby object on which the conclusion must FAIL. Both share
        the idiom vocabulary (a loop, an accumulate, a branchless reduce) and
        neither shares an ancestor. A method that links them has learned the
        idiom rather than the provenance, and the entire partition it produces
        is worthless. Reporting them unlinked, with a decaying curve, is the
        pass criterion.
    proof_obligations:
      - claim: A same-lineage (peer, reference) pair has detection probability exactly 0 against a defect inherited from their common ancestor.
        responsibility: correctness
      - claim: The decay curves of the known-fork and known-unrelated calibration sets separate at some declared resolution.
        responsibility: feasibility
      - claim: Measured N_eff is an upper bound on the true number of independent origins, never a lower bound.
        responsibility: scope
      - claim: The threshold is frozen from calibration alone, before any population pair is scored.
        responsibility: interface
      - claim: Shared lineage bounds what the gate can see and does not imply any implementation is defective.
        responsibility: scope

  predictions:
    - metric: >-
        calibration_separation: the gap, at the frozen resolution, between the
        minimum shared-skeleton coverage over the known-fork set and the
        maximum over the known-unrelated set
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE, i.e. the two sets must not overlap at the chosen
        resolution. A non-positive gap means no threshold classifies both sets
        correctly, the method cannot measure lineage on this material, and NO
        partition, N_eff or power statement is reportable. This is the arm the
        whole record depends on and it can fail outright.
    - metric: >-
        known_fork_linkage: whether the two pinned wolfSSL comparison routines
        at commits 1d363f3 and ac01707 are classified as lineage-linked
      direction: different
      minimum_effect: >-
        MUST BE LINKED, with no tolerance. They are the same routine with a
        known small edit. A method that calls them unrelated is destroying the
        signal it exists to detect and every unlinked verdict elsewhere is
        uninterpretable.
    - metric: >-
        known_unrelated_linkage: the number of known-unrelated calibration
        pairs classified as lineage-linked
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with no tolerance. Any linkage here means the normalizer has
        collapsed the idiom vocabulary onto itself and the partition is an
        artifact of normalization rather than a measurement of provenance.
    - metric: >-
        N_eff: the number of lineage classes over the fetched
        comparison-routine population at the frozen resolution
      direction: different
      minimum_effect: >-
        No number is predicted and the refusal is deliberate: this is the
        record's discriminator. N_eff equal to the artifact count means the
        population is as independent as the lane has assumed and every existing
        null gains a premise it was silently relying on. N_eff strictly below
        the artifact count names the specific artifacts that collapse, and any
        verdict computed against the raw count is restated against N_eff
        instead.
    - metric: >-
        same_class_gate_pairs: the number of (peer, reference) pairs this
        program has used or planned that fall in one lineage class
      direction: lower
      minimum_effect: >-
        No direction is predicted for real pairs and the refusal is deliberate.
        Zero is the expected and fully acceptable outcome and strengthens the
        archive. Any nonzero count names an archived or planned configuration
        whose power against a lineage-wide defect is exactly 0; that is a
        statement about the instrument, changes no hypothesis status, and only
        the Coordinator may act on it.
    - metric: >-
        cross_isa_false_negative: the method's verdict on the wolfSSL AVX2
        versus NEON comparison routine pair
      direction: different
      minimum_effect: >-
        The method is EXPECTED to report UNLINKED, and reporting it is the
        point rather than a failure: it quantifies the known blind spot and
        establishes that measured N_eff is an upper bound. If the method
        instead links them, the skeleton survives a cross-ISA port, the blind
        spot is smaller than declared, and the record says so.

  minimal_test:
    design: >-
      THE MINIMAL DISCRIMINATING VERSION IS STAGES 0-2 ON THE CALIBRATION SETS
      ALONE, AND IT DECIDES WHETHER THE REST IS WORTH RUNNING: freeze the
      normalizer, assemble a known-fork set (the two pinned wolfSSL commits,
      plus any file-and-vendored-copy pair already in this repository) and a
      known-unrelated set (a comparator against a memcpy, an NTT butterfly, and
      a comparator from an unrelated project), and measure both decay curves.
      That is a few hundred lines of tooling, no cryptography, no builds, and
      minutes of compute. If the curves do not separate, the record stops there
      with a reportable methodological negative and nothing further is spent.
      If they separate, Stage 3's partition over the fetched population is
      bounded by fetch budget and is pure reading, and Stage 4's power
      statement is arithmetic. No comparison is ever executed, no key is
      generated, and no ciphertext is probed anywhere in this record -- which
      makes it the cheapest of the four proposals filed this session and the
      only one that needs no build at all.
    controls:
      - >-
        KNOWN-FORK CALIBRATION SET, FORCED LINKED AND ABLE TO FAIL: pairs with
        a documented common origin, including the two pinned wolfSSL commits
        this lane's own evidence record describes as differing by one fix.
      - >-
        KNOWN-UNRELATED CALIBRATION SET, FORCED UNLINKED AND ABLE TO FAIL:
        pairs that share the idiom vocabulary and cannot share an ancestor.
        This is the null object proper -- same shape, forced value derived in
        advance, and it fails loudly if the normalizer over-collapses.
      - >-
        DECAY-CURVE CONTROL: the separation is required to be a CURVE
        separation across a resolution grid, not a single-threshold verdict, so
        that a method which happens to separate at one lucky n is distinguished
        from one that separates robustly. The reported deliverable is the
        curve pair.
      - >-
        NULL-FIRST DECISION RULE (KN-TECH-1a5b7e mode 4): the linked/unlinked
        rule is emitted on both calibration sets and frozen BEFORE any
        population pair is scored. If it returns the same label on both
        calibration sets it discriminates nothing and is rewritten before
        anything real is read.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST REPORT OUT OF SCOPE: a
        source skeleton scored against a disassembly skeleton. The method must
        refuse the comparison rather than emit a number, since the two token
        alphabets are incomparable.
      - >-
        CROSS-ISA BOUNDARY MEASUREMENT: the AVX2-versus-NEON pair, scored and
        reported beside its known relationship, so the method's false-negative
        direction is measured rather than argued.
      - >-
        ORDERING CONTROL: the normalizer, the resolution grid, the coverage
        fraction f and the threshold are committed and hashed before the first
        population pair is fetched.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior statement in the
        corpus about the candidate population's size or independence --
        EXP-MLKEM-009's five rejections, IDEA-20260821-121612's correction to
        two buildable candidates, IDEA-20260828-033cb3's aws-lc/mlkem-native
        remark -- and report the new partition beside them rather than in place
        of them.
    required_metrics:
      - the frozen normalizer, resolution grid, coverage fraction and threshold, with hash
      - decay curves for both calibration sets, with the measured separation gap
      - the linked/unlinked verdict for every calibration pair beside its known relationship
      - the lineage partition of the fetched population, with class membership and N_eff
      - per-(peer, reference) pair lineage relationship for every gate configuration this program has used or planned
      - the cross-ISA pair's verdict, reported as the method's measured blind spot
      - the list of artifacts reported OUT OF SCOPE or UNMEASURABLE, with reasons
      - every fetched artifact with its URL and pinned commit

  falsification_conditions:
    - >-
      The two calibration sets' decay curves overlap at every resolution. No
      threshold classifies both correctly, the method cannot measure lineage on
      this material, and no partition, N_eff or power statement is reportable.
      The record returns a methodological negative and stops.
    - >-
      A known-fork pair is classified unlinked. The normalizer destroys the
      signal; every unlinked verdict is uninterpretable until repaired.
    - >-
      Any known-unrelated pair is classified linked. The normalizer
      over-collapses; the partition is an artifact and every linked verdict is
      void.
    - >-
      N_eff equals the artifact count over the whole fetched population. The
      population is as independent as the lane has assumed, the decision
      target's count is licensed, and this record returns a clean negative that
      strengthens every existing null by supplying the premise. This is a
      FIRST-CLASS OUTCOME and is not a failure of the proposal.
    - >-
      A (peer, reference) pair the program has used is found same-class. The
      power of that configuration against a lineage-wide defect is exactly 0
      and the record says which configuration; this changes no hypothesis
      status and is reported to the Coordinator.
    - >-
      The cross-ISA pair is classified LINKED. The declared blind spot does not
      exist, measured N_eff is tighter than claimed, and the conservative
      direction stated throughout must be restated.
    - >-
      Fetch failures for a majority of candidates. INFRASTRUCTURE outcome under
      AGENTS.md rule 3, never evidence about independence; the partition is
      reported over whatever was fetched, as a floor on collapsing and an upper
      bound on N_eff.

  confounders:
    - >-
      SHORT ROUTINES COLLIDE. A constant-time byte comparison is perhaps twenty
      to sixty tokens after normalization, which is near the floor where
      n-gram methods discriminate at all. This is the method's principal
      hazard, it is why the known-unrelated calibration set exists, and if the
      routines prove too short to separate, that is the honest finding rather
      than a threshold to be lowered until something is detected.
    - >-
      SHARED IDIOM IS NOT SHARED CODE, AND THE CONVERSE FAILS TOO. Two
      implementers reading the same well-known write-up may produce the same
      skeleton without copying; two implementers copying the same routine into
      different ISAs produce different skeletons. The method errs in both
      directions and the calibration sets bound each direction separately.
    - >-
      LINEAGE IS NOT A DEFECT CLAIM. A shared ancestor tells you the gate
      cannot see a shared defect. It does not tell you a shared defect exists,
      and no count of linked pairs is evidence that any code is wrong.
      Presenting it otherwise would be exactly the correlation-to-mechanism
      error the idea-generator contract forbids.
    - >-
      COPYING IS USUALLY GOOD. Reusing reviewed cryptographic code is normally
      the right engineering choice. This record measures a consequence for an
      instrument's power; it is not an argument against code reuse and must not
      be summarized as one.
    - >-
      SELECTION BY FETCHABILITY. The partition is over what could be fetched,
      so N_eff is an upper bound on independent origins within a population
      that is itself a floor on what exists. Both directions are stated
      wherever a number appears.
    - >-
      GIT HISTORY IS SUGGESTIVE AND NOT DECISIVE. Vendoring, squashed imports
      and license-header copying can indicate lineage, but a project may
      rewrite from scratch and keep a header, or copy and rewrite the header.
      Where history and skeleton disagree, the record reports both and
      adjudicates neither.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY
      PARAMETER SET. RQ-MLKEM-002's constraints bind unchanged; any newly
      observed conformance defect escalates to the coordinator and is published
      by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or
      for any archived evidence or decision record. Measuring the independence
      premise of a verdict is not re-reading that verdict, and only the
      Coordinator may act on the result.
    - >-
      NO ACCUSATION OF COPYING IS MADE OR IMPLIED ABOUT ANY NAMED PROJECT.
      Lineage linkage as measured here is a statement about token skeletons at
      a declared resolution, is an upper-bound method with known false
      negatives and calibrated false positives, and is not a finding about
      authorship, licensing or attribution. Any report must say this in its own
      voice.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A partition of
      fetched source files at a declared resolution is a measurement about a
      corpus and is never crypto-scale or MLWE evidence.
    - >-
      A population found fully independent does NOT establish that the
      isolation-versus-systemic question is answerable, only that it is not
      unanswerable for THIS reason. The other named obstacles -- an empty
      neighborhood under the strict predicate, undecidable precedence
      (KN-TECH-054), and unmeasured generator power (IDEA-20260821-13b667) --
      remain exactly as they were. Premature closure is a failure mode
      symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SAME-LINEAGE BLINDNESS. FOR ALL differential conformance gates whose
        detection event is "the peer under test accepts an input that the
        reference rejects", FOR ALL generators and FOR ALL probe budgets, if
        the peer and the reference both compute the same silent set S_anc
        inherited from a common ancestor, then on every input whose difference
        support lies in S_anc both arms accept, the gate observes no
        disagreement, and its detection probability against that defect is
        exactly 0.
      rigorous_support: >-
        Not a distributional heuristic; a rigorous consequence of the gate's
        own detection event as stated in IDEA-20260821-13b667 and anchored
        there to EXP-MLKEM-006's committed control semantics. A differential
        observes a DIFFERENCE; two arms computing the same function have none.
        It imitates no classical distribution theorem and is not presented as
        one. Its hypothesis -- that the inherited routine computes the same
        silent set in both arms -- can fail even for genuinely copied code if
        the two builds differ in stride, alignment or call-site
        specialization, which is precisely what IDEA-20260821-121612,
        IDEA-20260828-033cb3 and IDEA-20260829-bb55d5 measure; where they show
        the two arms' silent sets differ, H1's hypothesis fails and the pair
        recovers some power, which is stated rather than assumed away.
      validation_plan: >-
        Validated by construction on planted arms rather than by sampling,
        because the statement is deterministic: build a gate whose peer and
        reference are the SAME planted comparator with a declared 32-byte
        silent window, drive it with the lane's exhaustive single-byte suite
        (255 * L probes, about 4 x 10^5 at ML-KEM-1024, seconds), and confirm
        the detection count is EXACTLY 0 with zero tolerance. Then replace the
        reference by a complete comparator and confirm the detection count is
        EXACTLY 32 -- the must-fire mirror, without which a zero is
        uninterpretable. Report both, at all three parameter sets. No transfer
        to any real implementation pair is claimed by this validation; it
        establishes the law, and the census establishes which real pairs fall
        under it.
    - id: H2
      statement: >-
        ADAPTATION PRESERVES SKELETON. FOR ALL code-reuse events consisting of
        renaming, retyping, reformatting, constant substitution and a bounded
        number of local functional edits, the adapted routine's normalized
        skeleton shares a contiguous n-gram with its ancestor's covering at
        least a fraction f of the shorter skeleton, for n up to a value
        substantially exceeding the longest shared n-gram between two routines
        with no common ancestor.
      rigorous_support: >-
        Rigorous for the cosmetic half by construction: the normalizer is
        defined to erase exactly renaming, retyping, reformatting and literal
        changes, so those transformations are the identity on skeletons. The
        bounded-functional-edit half is DISTRIBUTIONAL and imitates the
        standard assumption underlying token n-gram clone detection, namely
        that edits are local and sparse relative to routine length. It has NO
        rigorous support for the cross-ISA case, where it is FALSE by
        inspection, and that failure is declared as the method's blind spot
        rather than treated as noise.
      validation_plan: >-
        Measured on the two calibration sets, whose ground truth is known
        independently of the method. Sampled parameters recorded: the exact
        artifact list with URLs and pinned commits, the routine lengths in
        normalized tokens, n over a declared grid, and f. The comparison is the
        empirical decay curve of shared coverage against n for each set, and
        the tail check is the extreme statistic -- the longest shared n-gram
        observed in the known-unrelated set, which must fall strictly below the
        shortest observed in the known-fork set. Transfer assumption stated
        explicitly: calibration is performed on cryptographic C routines of
        comparable length to the population's, and no claim is made that the
        threshold transfers to routines of substantially different length or to
        another language, so any population member outside the calibrated
        length band is reported as OUT OF CALIBRATION rather than classified.

  target_complexity:
    time_exponent: >-
      n/a -- no exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation. Stated plainly. The deliverable is a
      population measurement and a structural power statement, not an
      asymptotic result.
    memory_exponent: n/a
    best_known: >-
      n/a -- no competing statement of population independence exists in this
      repository. The nearest row, IDEA-20260821-121612's correction of the
      candidate population from five to two BUILDABLE artifacts, measures a
      different quantity and does not dominate. No external search was
      performed and the detection technique is explicitly claimed as standard.
    hidden_overhead: >-
      n/a. Skeleton extraction and n-gram comparison over a few dozen routines
      of tens of tokens each is milliseconds; the real cost is fetch budget and
      human-legible reporting. Nothing hides in an o(1) and no cryptographic
      computation occurs anywhere in this record.
    tradeoff_note: >-
      n/a. The one scaling note is that pairwise comparison is quadratic in the
      population size, which is irrelevant at a population of tens and is
      recorded only so that a later census over hundreds of artifacts knows to
      index rather than to compare all pairs.

  dominated_by: >-
    n/a (no result claimed as an algorithm; no time, memory or data/query cost,
    hence no Pareto point). Rows checked inside this repository on 2026-08-29
    for a prior treatment of population independence, code provenance, or the
    reference arm's origin: all eleven filed RQ-MLKEM-002 proposals, read in
    full or in their claim/mechanism/object blocks, plus a case-insensitive
    grep of every RQ-MLKEM-002 proposal for lineage vocabulary returning ZERO
    matches; RQ-MLKEM-001 and RQ-MLKEM-003 in full; EV-MLKEM-005 in full, whose
    "shared-defect" boundaries clause is the closest row in the corpus and
    which names rather than measures it; RUN-MLKEM-007 summary.json in full.
    IDEA-20260821-121612 corrects the candidate population from five to two on
    BUILDABILITY grounds and is the nearest measured row; it does not dominate,
    because independence and buildability are different quantities and the two
    corrections compose. NO EXTERNAL SEARCH was performed; the code-clone
    literature certainly contains better detectors than the one proposed here
    and no novelty is claimed for the detector.
  sota_delta: >-
    No attack; control and premise-supply contribution only. Quantitatively,
    against the lane's own state: the decision target is defined over a count
    of implementations, five candidates were considered by EXP-MLKEM-009's
    strict order, that count was already corrected once to two on buildability
    grounds by IDEA-20260821-121612, and the corpus separately records a
    suspected code-sharing relationship between two of the five -- yet no
    record has ever computed the number the verdict should be divided by. This
    record supplies it, and supplies one structural fact the lane does not
    have: a (peer, reference) pair in one lineage class has detection
    probability EXACTLY 0 against the systemic hypothesis, uniformly over every
    generator and budget in IDEA-20260821-13b667's 35-cell matrix. Cost: no
    build, no key generation, no comparison execution, no cryptographic compute
    of any kind -- the cheapest of the four proposals filed this session and
    the only one whose minimal test needs nothing but fetched text.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
