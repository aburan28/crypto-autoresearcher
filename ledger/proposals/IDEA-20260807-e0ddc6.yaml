idea:
  id: IDEA-20260807-e0ddc6
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    THE TRANSPORT COMPATIBILITY DICHOTOMY: preprocessing survives an isogeny
    exactly when its VALUE is a function of the (point, scalar) pairing and dies
    exactly when its value is a function of the ENCODING, so a known-log table
    transports at 100% while a distinguished-point store, an x-coordinate index
    and an enumeration-testable factor base all revert to the chance baseline --
    and the sharp middle case is the ALGEBRAIC description degree of a factor
    base, which a resultant argument shows IS preserved while every shape
    invariant that non-algebraic decomposition exploits is not
  class: representation

  claim: >-
    (A) THE DICHOTOMY, STATED AS A CRITERION. Preprocessing for a discrete-log
    attack is a set A together with a VALUE PREDICATE v that says what makes an
    element of A useful. Let phi: E -> E' be an F_p-isogeny with
    gcd(deg phi, N) = 1. Then:
      CLASS I -- GROUP-VALUED PREPROCESSING. v depends only on the pair
        (group element, its logarithm). Examples: a known-log table
        {(R_i, r_i)}, a factor-base LOGARITHM table, a set of relations among
        stored points, a kangaroo trap set indexed by log. For these,
        v(phi(R), r) = v(R, r) identically, because phi|_G is an injective
        homomorphism (T1). TRANSPORT IS EXACT AND LOSSLESS. Retention 1.000.
      CLASS II -- ENCODING-VALUED PREPROCESSING. v depends on how the point is
        WRITTEN. Examples: the distinguished-point predicate "the low d bits of
        x(R) are zero", a hash-bucket index on x(R), a Gaudry/Semaev factor base
        defined by "x(R) lies in the interval [0, B)", any structure whose test
        is an ENUMERATION or COMPARISON on field elements. For these,
        v(phi(R)) is a function of x(phi(R)) = f_phi(x(R)) where f_phi is a
        rational function of degree deg phi, and NO relation between v(phi(R))
        and v(R) survives. TRANSPORT MOVES THE SET AND DESTROYS THE VALUE.
        Retention reverts to the chance baseline |A| / #E'(F_p).
      CLASS III -- THE SHARP MIDDLE, WHICH IS THE PART WORTH MEASURING. A
        Semaev-style factor base is F = {R : g(x(R)) = 0} for a polynomial g of
        degree B. Its image is phi(F) = {R' : g'(x(R')) = 0} where
        g'(X) = Res_x( g(x), X*den_phi(x) - num_phi(x) ), and deg g' <= B
        because g has only B roots and each contributes one value. SO THE
        ALGEBRAIC DESCRIPTION DEGREE IS A TRANSPORT INVARIANT. What is NOT
        invariant is the SHAPE of the root set: an interval maps to a set with
        the same cardinality, the same description degree, and (predicted)
        random additive structure. Hence: the GROBNER-side difficulty of
        decomposition, which is governed by deg g and by the summation
        polynomial, transports; the ENUMERATION-side and LATTICE-side methods,
        which need interval-ness or subspace-ness, do not.

    (B) WHY THE CRITERION IS THE RIGHT ONE AND NOT A RESTATEMENT. The criterion
    is exactly the lossy-projection test of docs/inventor-protocol.md applied to
    the preprocessing object. Class I projections discard the encoding, and the
    encoding is discarded COMPATIBLY with phi, because phi is a homomorphism on
    the retained part. Class II projections also discard information -- but they
    discard the group-theoretic part and RETAIN the encoding, and the encoding is
    precisely what phi does not respect, so the retained part does not propagate
    deterministically. A projection whose retained part fails to propagate is not
    a tracked object at all; it is a coincidence detector. That is the general
    statement of why EXP-ISADV-001 measured nothing: its advice set was an
    x-coordinate set, i.e. Class II, and it was moreover moved by NO map.

    (C) THE ONE-STEP PROPAGATION IS DEFINABLE AND MEASURABLE FOR EVERY CLASS,
    WHICH IS WHAT MAKES THIS A PROPOSAL AND NOT A TAXONOMY.
      Class I: retention_I = (# transported entries passing [r]phi(P) == phi(R))
        / S. Predicted 1.000 exactly.
      Class II-DP: retention_DP = (# transported entries that are still
        distinguished under the SAME predicate) / S. Predicted 2^{-d}, the
        chance rate, for every ell >= 2, and 1.000 at ell = 1 ONLY IF the
        isomorphism is the identity on x -- note an F_p-isomorphism of short
        Weierstrass curves acts by x -> u^2 x, so even at ell = 1 a low-bits
        predicate is destroyed while a DILATION-INVARIANT predicate is not.
        This asymmetry is a prediction, not a nuisance.
      Class II-BOX: retention_BOX = |f_phi(B) intersect B| / |B| for B the
        factor-base interval. Predicted |B|/p, the chance rate, for ell >= 2.
      Class III: deg g' measured by actually forming the resultant, predicted
        EXACTLY <= B and generically = B; and, separately, the additive energy
        E(f_phi(B)) compared against E(B) and against a random set of the same
        size. Predicted: E(u^2 B) = E(B) exactly at ell = 1 (dilation is an
        additive automorphism -- a rigorous positive control), and
        E(f_phi(B)) ~ random for ell >= 2.

    (D) WHY THE ANSWER MATTERS TO THE CAMPAIGN AND NOT ONLY TO L13. If Class III
    had turned out fully invariant -- if a low-degree factor base transported to
    a low-degree factor base WITH its shape -- then a class-wide search for the
    curve on which the factor base is best-conditioned would be a live lane (L1's
    target). The resultant argument says the DEGREE part transports, so that
    particular hope is already partly dead by algebra, at zero compute. The
    measurement decides the shape part, and a positive there (shape survives)
    would be a genuine surprise that reopens L1/L4.

  resource_label: >-
    R8 primary (what makes preprocessing preprocessing), R4 (the isogeny supplies
    the map), R1 secondary (x-coordinates as field elements are the object of the
    Class II and Class III measurements).

  admissibility: admissible

  admissibility_argument: >-
    The Class I half is exactly the H-ENDO-001 / KN-FIND-b7e091 situation and
    yields nothing on its own -- and this record SAYS so rather than presenting a
    100% retention rate as a discovery. The admissible content is Class II and
    Class III: they concern the behaviour of FIELD-LEVEL data (x-coordinates as
    elements of F_p, factor-base description polynomials) under an isogeny, which
    is resource R1 crossed with R4. A generic-group oracle cannot answer "is
    x(phi(R)) in [0, B)" because it returns opaque labels, so the question is not
    GGM-simulable and the closure of KN-FIND-b7e091 does not reach it. The honest
    caveat: escaping the GGM is necessary, not sufficient, and the predicted
    answer on the admissible half is DESTRUCTION, i.e. an admissible resource
    that measurably provides nothing.

  discriminated_from:
    - >-
      IDEA-20260807-a127ab (this lane, filed same batch) -- that record COSTS the
      Class I transport and builds the multi-curve accounting on it. This record
      asks the prior question of WHICH preprocessing objects are Class I at all,
      and supplies the criterion plus the Class III resultant argument, which
      a127ab does not contain.
    - >-
      IDEA-20260807-5cabfc (L2) -- closes cost functionals that factor through
      the abstract triple. Class I is inside that closure and this record says so.
      Class II and Class III are OUTSIDE it, because they are functionals of the
      encoding and of the curve equation, which the abstract triple forgets.
      This record is the statement of what 5cabfc's closure leaves open, made
      concrete for preprocessing.
    - >-
      EXP-ISADV-001 -- measured a Class II object moved by no map. Its null
      result is re-read here as a Class II prediction confirmed by accident.
    - >-
      Lane L4 (RQ-EQIC-8cb959, phi-equivariant relation collection) -- that lane
      asks whether a phi-STABLE factor base on ONE curve helps. This record asks
      whether a factor base SURVIVES being moved to ANOTHER curve. Different
      question, different map (endomorphism vs isogeny), and this record must not
      be read as re-asserting H-STR-002, which is `weakened` under
      DEC-20260727-009 with an open replication obligation.

  object_first_candidate:
    tracked_object: >-
      THE VALUE PREDICATE v OF A PREPROCESSING SET -- not the set, the predicate.
      Followed through one isogeny step and asked: does v compose with phi?
    lossiness: >-
      LOSSY in the strongest sense: an entire preprocessing scheme collapses to a
      single yes/no ("does v factor through the group?") plus, in Class III, one
      integer (deg g'). Everything about the scheme's efficiency, its constants
      and its solver is forgotten.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED FOR CLASS I AND CLASS III, AND
      DELIBERATELY FAILED FOR CLASS II -- the failure is the finding. Class I:
      what is discarded (encoding) is discarded compatibly with phi, so
      propagation is deterministic. Class III: what is discarded (the shape of
      the root set) is discarded compatibly with the RESULTANT operation, so
      deg g' propagates deterministically even though the root set does not.
      Class II: what is discarded (the group structure) is exactly what phi acts
      on, so nothing propagates -- the projection is not compatible and the
      object is not a tracked object. Recording a NON-object explicitly is the
      cheapest part of this proposal and it is the part that would have saved
      EXP-ISADV-001.
    survival_score: >-
      Class I survives unboundedly many steps. Class III survives with its degree
      intact for unboundedly many steps but with its shape dissolving at step
      one. Class II survives zero steps. A single number for the record: the
      dichotomy itself survives every change of curve, model, field and solver,
      because it is a statement about function composition.

  mechanism: >-
    STEP 1 -- ZERO-COMPUTE ALGEBRA, DONE BEFORE ANY RUN. Write out f_phi for
    ell = 2 and ell = 3 from Velu explicitly; form the resultant
    g'(X) = Res_x(g(x), X*den(x) - num(x)) symbolically for a small g; confirm
    deg g' <= deg g. If this fails the Class III claim is wrong and the record is
    superseded before any compute is spent.
    STEP 2 -- CLASS I ARM. As in IDEA-20260807-a127ab Step 4: transport a
    known-log table and certify every entry. Predicted 1.000.
    STEP 3 -- CLASS II-DP ARM. Fix a distinguished-point predicate with rate
    2^{-d} for d in {2, 3, 4}. Build a set of S distinguished points on E.
    Transport by phi. Measure the fraction still distinguished on E'. Predicted
    2^{-d}, i.e. the chance rate, indistinguishable from a random size-matched
    subset of E'(F_p).
    STEP 4 -- CLASS II-BOX ARM. Fix an interval B = [0, b) in F_p. Compute
    f_phi(B) explicitly. Measure |f_phi(B) intersect B| / |B|, the number of
    3-term arithmetic progressions in f_phi(B), and the additive energy
    E(f_phi(B)). Compare against B itself, against u^2 B for an F_p-isomorphism
    (the RIGOROUS positive control: dilation preserves additive energy exactly),
    and against a uniformly random subset of F_p of the same size.
    STEP 5 -- CLASS III ARM. Form g' by resultant, record deg g', and record the
    Groebner solving-degree proxy of the m = 3 Semaev system over the transported
    factor base on E' against the same proxy on E over the original factor base.
    Predicted: same description degree, same or statistically indistinguishable
    solving-degree proxy, DIFFERENT shape statistics.
    STEP 6 -- ell SWEEP, WHICH IS THE DECAY TEST. Repeat Steps 3-5 at
    ell in {1 (isomorphism), 2, 3, 5, 7, 11} and at composite paths of length
    L in {1, 2, 3}. Every Class II statistic must be a MONOTONE decay from the
    ell = 1 value to the random baseline. A Class II statistic that stays high at
    ell = 11 is an artifact.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Run 2026-08-07 against the working tree. Commands:
      (1) grep -rin "distinguished.point" ledger/ -> 143 hits across 76 files
      (2) grep -rin "additive energy" knowledge/ ledger/ analysis/
      (3) grep -rin "resultant" knowledge/techniques/
      (4) grep -rin "factor base" ledger/proposals/ | count
      (5) grep -rn "isogeny" harness/ -> ZERO
      (6) reading of experiments/EXP-ISADV-001/advice_transfer.py in full.
    results: >-
      (1) Distinguished points appear only as a rho implementation detail
      (KN-TECH-006 and the rho baseline records); ZERO records ask what happens
      to the DP predicate under a map between curves.
      (2) Additive energy / sum-product material exists (KN-TECH-016,
      KN-TECH-010, and analysis/o2-sum-compatible-filters/) but is applied to
      SUM-COMPATIBLE FILTERS on one curve, never to the image of a box under an
      isogeny x-map. The o2 analysis's measured result -- that x(P+Q) carries no
      usable partial information from x(P), x(Q) -- is the CLOSEST prior and is
      about the group law, not about phi.
      (3) The Res_x argument for the image of a factor base under an isogeny
      x-map returns ZERO hits.
      (4) Factor-base records are numerous (H-STR-002, H-IC-001, H-MTIC-001, L4)
      and all concern ONE curve.
      (5)/(6) as recorded in IDEA-20260807-a127ab.
    verdict: >-
      ADAPTATION. The dichotomy is a repackaging of elementary facts
      (homomorphisms compose with group-valued predicates; rational maps do not
      preserve intervals) into a criterion this program has not written down.
      The Class III resultant observation is the one piece that is not obviously
      a repackaging and is the piece most likely to be already known externally;
      it is flagged for a Stage-0 literature check and a positive hit there is an
      ingredient, not a defeat.

  null_object_control: >-
    MANDATORY AND BLOCKING, ONE NULL PER CLASS, ALL OF THE SAME SHAPE AS THE
    TREATMENT.
    Class I null: a size-matched RANDOM RELABELLING {(sigma(R_i), r_i)} for a
      uniform bijection sigma: G -> G'. Certification must be 1/N.
    Class II null: a uniformly random size-matched subset of E'(F_p) in place of
      phi(A). The DP-retention and box-retention statistics of the TREATMENT must
      be statistically indistinguishable from this null -- and here,
      INDISTINGUISHABILITY IS THE PREDICTED RESULT, so the null doubles as the
      prediction and the test is whether the treatment DEVIATES from it.
    Class III null: a random degree-B polynomial g_rand in place of g', measured
      on the identical Groebner pipeline. If the transported factor base's
      solving-degree proxy matches g_rand's, the transported base is
      structureless, which is the predicted outcome.
    POSITIVE CONTROL, RIGOROUS AND REQUIRED: the ell = 1 arm. An F_p-isomorphism
      acts by x -> u^2 x, so the additive energy of the image equals that of B
      EXACTLY (dilation is an automorphism of (F_p, +)). An instrument that does
      not reproduce E(u^2 B) = E(B) is broken and no Class II or Class III number
      from it may be reported.
    DECAY PARAMETER: ell (and path length L). Every Class II statistic must decay
    monotonically from its ell = 1 value to the random baseline as ell grows. A
    statistic that does not decay is the canonical artifact tell.

  assumptions:
    - >-
      f_phi is a well-defined rational function of x alone. This holds because
      phi(-R) = -phi(R) for an isogeny of curves in short Weierstrass form, so
      x(phi(R)) depends only on x(R). Stated explicitly because it is exactly the
      fact that makes the x-support a COMPATIBLE lossy projection, and without it
      the whole Class II/III analysis is ill-posed.
    - >-
      deg f_phi = deg phi = ell for a separable ell-isogeny. Standard; verified
      constructively at ell = 2, 3 in Step 1 rather than assumed.
    - >-
      The Groebner solving-degree proxy used in Step 5 is the program's existing
      one (harness/semaev.py, whose honesty note records it is
      implementation-bound). All Class III comparisons are within-implementation
      and within-machine only.
    - >-
      Toy scale. Additive-energy and AP counts on a set of size b in F_p need
      b^2 or b^3 work; at p up to 2^{16} and b up to 2^8 this is trivial, at
      p ~ 2^{32} it is not. The prime ladder is bounded by that, not by the
      mathematics.

  proof_search_map:
    bottleneck: >-
      The Class III resultant claim deg g' <= deg g. Everything else is either
      a one-line homomorphism argument (Class I) or a measurement (Class II).
      This is the only step that could be wrong in a way that changes the
      dichotomy.
    baseline_embedding:
      parameter_slice: >-
        ell = 1 (F_p-isomorphism). The dichotomy must degenerate correctly:
        Class I retention 1.000, Class III degree preserved, and Class II
        retention EXACTLY 1.000 for dilation-invariant predicates and NOT 1.000
        for low-bits predicates.
      reproduction_check: >-
        E(u^2 B) = E(B) computed exactly for at least 20 values of u at
        p = 1009. Exact integer equality is required, not statistical agreement.
        A failure means the additive-energy instrument is wrong and every Class
        II/III number is void.
    observation_collision:
      observable: >-
        "Retention at the chance baseline."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: a treatment arm that is at the chance
        baseline for a reason OTHER than transport-destruction, namely the
        no-map arm of EXP-ISADV-001 (a Class II set compared against a different
        curve with no map at all). Both produce chance-baseline retention. The
        collision is the point: it proves that "retention at baseline" ALONE
        cannot distinguish "the map destroyed the structure" from "there was no
        map". The disambiguator is the ell = 1 positive control, which must show
        retention where the no-map arm does not. Reporting a Class II baseline
        without the ell = 1 arm is prohibited by this record.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "is the set an interval" by "additive energy of the set",
          which is defined for every set, is dilation-invariant, and has a known
          random baseline (~|B|^3/p for |B| >> sqrt(p)).
        predicted_gain: >-
          Converts a yes/no shape question into a graded statistic with an exact
          positive control and a computable null, which is what makes the decay
          test possible at all.
      - transform: representation_reduction
        proposed_object: >-
          Replace "the factor base" by "the polynomial cutting it out", turning
          transport into a resultant computation.
        predicted_gain: >-
          Turns an apparently geometric question into a degree bound that is
          decided by algebra at zero compute.
    quantifier_order: >-
      INTENDED: FORALL isogenies phi with gcd(deg phi, N) = 1, FORALL
      preprocessing sets A with value predicate v, IF v factors through
      (element, log) THEN FORALL entries the value is preserved; and IF v factors
      through the encoding THEN there EXISTS no relation, i.e. FORALL entries the
      retained value is at the chance baseline in expectation.
      The DANGEROUS weaker reading, NOT claimed: FORALL v EXISTS phi preserving
      it -- one can always find a phi (namely the identity) preserving anything,
      which is vacuous. The audit obligation is that phi is quantified FIRST and
      is a genuine isogeny of degree >= 2.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under an F_p-isogeny of degree >= 2, group-valued preprocessing is
        preserved exactly and encoding-valued preprocessing reverts to the chance
        baseline, on the tested toy family." It can NEVER certify that no
        encoding-valued preprocessing survives -- only that these declared ones
        do not -- and it says nothing about crypto scale.
      nearby_object_control: >-
        A predicate that is DELIBERATELY dilation-invariant but not
        homomorphism-invariant, e.g. "x(R) is a quadratic residue". Under an
        isomorphism x -> u^2 x this is preserved exactly; under an ell-isogeny
        it should revert to 1/2. If the instrument shows it destroyed at ell = 1
        too, the instrument is conflating "changed coordinates" with "changed
        curve" and its Class II numbers are void.
    proof_obligations:
      - claim: x(phi(R)) is a function of x(R) alone.
        responsibility: correctness
      - claim: deg Res_x(g, X*den - num) <= deg g.
        responsibility: correctness
      - claim: Class I retention is exactly 1 (inherited from T1).
        responsibility: correctness
      - claim: The additive-energy instrument reproduces E(u^2 B) = E(B) exactly.
        responsibility: baseline
      - claim: Every reported Class II baseline is accompanied by the ell = 1 arm.
        responsibility: scope
      - claim: The random-set null is size-matched, not merely density-matched.
        responsibility: soundness

  predictions:
    - metric: Class I retention (certificate pass rate of a transported known-log table)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000, at every ell and every path length. Anything else is an
        implementation error.
    - metric: Class II-DP retention (fraction still distinguished after transport)
      direction: lower
      minimum_effect: >-
        Within 2 standard errors of the chance rate 2^{-d} for every ell >= 2,
        and NOT at the chance rate at ell = 1 for a dilation-invariant predicate.
        A retention above chance by more than 3 standard errors at any ell >= 2
        is the surprise outcome and reopens the lane.
    - metric: additive energy E(f_phi(B)) normalised by the random baseline
      direction: lower
      minimum_effect: >-
        Ratio within [0.8, 1.25] of the random baseline for ell >= 2, against a
        ratio of exactly 1.000 relative to E(B) at ell = 1. A ratio above 2 at
        any ell >= 2 means the isogeny x-map preserves additive structure, which
        would be a genuinely new and important fact and must be independently
        replicated before it is reported.
    - metric: deg g' for the transported factor-base polynomial
      direction: different
      minimum_effect: >-
        Exactly <= B in 100% of cells, and equal to B in at least 90%. A
        systematic drop below B would mean transport COLLAPSES factor bases,
        which would be a positive result for the campaign and must be checked
        against the trivial explanation (g' has repeated roots because f_phi is
        not injective on the root set of g).
    - metric: Groebner solving-degree proxy on E' over the transported base vs on E over the original base
      direction: different
      minimum_effect: >-
        Predicted NO difference beyond the harness's own run-to-run spread. A
        systematic difference of at least 1 in the proxy, surviving the random-g
        null, would be a within-class variance signal and belongs to lane L1
        (RQ-ICINV-475b5e), not here; this record would hand it over rather than
        claim it.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): the Step 1 symbolic resultant at
      ell = 2, 3. Kills the Class III claim outright if it fails.
      STAGE 1 (minutes, THE CHEAP DISCRIMINATOR): one toy class at p = 1009 or
      similar; one ell = 2 isogeny; measure Class I retention, Class II-DP
      retention and the ell = 1 positive control. Three numbers. This separates
      the dichotomy's two halves and validates the instrument in one run.
      STAGE 2 (minutes): the ell sweep {1, 2, 3, 5, 7, 11} and the decay test.
      STAGE 3 (hours): additive energy, AP counts, deg g', and the Groebner
      proxy on the larger toy ladder.
    controls:
      - random size-matched subset of E'(F_p) (Class II null)
      - random degree-B polynomial (Class III null)
      - ell = 1 isomorphism arm (rigorous positive control, E(u^2 B) = E(B))
      - quadratic-residue predicate (nearby-object control)
      - random-relabelling null for Class I
    required_metrics:
      - retention per class per ell per path length
      - additive energy and 3-AP count for B, u^2 B, f_phi(B), and random
      - deg g' and the multiplicity profile of g'
      - Groebner solving-degree proxy and basis size, per arm
      - chance baselines computed exactly, not estimated
      - wall clock and peak memory per cell

  falsification_conditions:
    - >-
      deg g' > deg g in any cell. The Class III claim is false as stated and the
      record is superseded rather than amended.
    - >-
      E(u^2 B) != E(B) exactly at ell = 1. Instrument broken; no Class II or III
      number may be reported.
    - >-
      Class II-DP retention stays above chance as ell grows (no decay). Either
      the isogeny x-map preserves the predicate -- a major and unexpected result
      requiring independent replication -- or the measurement is an artifact. The
      protocol cannot distinguish these without the decay sweep, which is why the
      sweep is mandatory.
    - >-
      Class I retention below 1.000 with gcd(deg phi, N) = 1. Implementation
      error, halts the line.
    - >-
      Additive energy of f_phi(B) exceeds twice the random baseline at ell >= 2.
      Falsifies the "shape is destroyed" half of the dichotomy and reopens the
      class-wide factor-base search.

  confounders:
    - >-
      SMALL-p COINCIDENCE. At p = 101 an interval of size 8 and its image can
      overlap by chance at rates that look like signal. Every retention figure
      needs its exact chance baseline computed and at least three primes.
    - >-
      NON-INJECTIVITY OF f_phi ON THE ROOT SET. phi is 1-to-1 on G but the
      x-map is ell-to-1 on the x-line, so distinct roots of g can collide,
      shrinking deg g' for a trivial reason. The multiplicity profile of g' must
      be reported alongside its degree.
    - >-
      TWIST AND SIGN. x-only measurements conflate R with -R. A DP predicate
      defined on x is automatically negation-invariant; one defined on (x, y) is
      not. The convention must be frozen before Stage 1 and reported.
    - >-
      MODEL DEPENDENCE. u^2 dilation is specific to short Weierstrass. In
      Montgomery or Edwards form the isomorphism acts differently and the ell = 1
      positive control changes. One model is frozen for the whole line.
    - >-
      The Groebner proxy is implementation-bound (harness/semaev.py sympy
      Buchberger). Class III solving-degree comparisons are valid only
      within-implementation.

  interpretation_limits:
    - >-
      The dichotomy is a criterion, not an attack. Its Class I half is inside the
      closure of IDEA-20260807-5cabfc and provides no speedup; its Class II half
      predicts destruction, i.e. it provides no speedup either. The record exists
      to make future negatives citable and to stop the program from re-running
      EXP-ISADV-001's mistake.
    - >-
      Class III's degree invariance says NOTHING about whether prime-field index
      calculus works. A degree-B constraint polynomial is hopeless on both
      curves; transport preserves hopelessness.
    - >-
      Toy scale only, claim_tier: toy. Additive-energy behaviour at p ~ 2^{16}
      does not license any statement at p ~ 2^{256}.
    - >-
      A surprise in the Class II decay test would be a fact about isogeny x-maps,
      not an attack, and would need its own proposal with its own cost model.

  reachability_gate: >-
    LOW-DEMAND: this record does not need to reach a SPECIFIED curve. Every
    measurement is of the form "take any isogeny of degree ell out of E and look
    at what happens", so a SINGLE STEP of a random walk suffices and the
    reachability cost is one isogeny construction, O(ell^3) field operations in
    the conservative ordinary-curve model
