  predictions:
    - metric: absolute_gap_first_positive_new_falls_degree
      direction: different
      minimum_effect: >-
        Absolute difference at least 1 between the Semaev comparison value
        and the median of the 20 null comparison values, cap sentinel 7
        included.
  minimal_test:
    design: >-
      Freeze the curve by the lexicographic trace test. Build the raw
      descended S_3 system at m=3, n'=1. Compute new_falls(D) for D from
      1 through 6. Draw 20 null systems on the same support and the same
      order. Compare the two first-positive degrees, using 7 when none
      occurs. Do not build a hyperelliptic Jacobian.
    controls:
      - >-
        The 20 support-matched nulls. A dense random system of different
        support is not the control. A semi-regular degree prediction is
        not the control.
      - >-
        A second implementation of new_falls on one null draw. Disagreement
        voids the cell.
    required_metrics:
      - Semaev comparison value in {1,2,3,4,5,6,7}
      - null median
      - absolute gap
      - the 20 null comparison values
      - curve coefficients (A, B) and the trace
      - Jacobian operations performed, required to be 0
  falsification_conditions:
    - >-
      Both profiles finish through degree 6 and the absolute gap is 0.
    - >-
      The two implementations disagree on the repeated null draw. That
      voids the cell and is not evidence about S_3.
  confounders:
    - >-
      Symmetrized S_3, a different monomial order, or n' greater than 1
      is a different cell.
    - >-
      IDEA-20260929-688ea4 is the binary re-measure. IDEA-20260916-71ab94
      is the binary trace identity. IDEA-20260903-399a18 is a multi-cell
      table on RQ-PFDR-ae2fba. None is this F_5 cell.
    - >-
      A timeout or an unfinished matrix is infrastructure, not a high
      degree of regularity.
    - >-
      KR-IC-5ea2f8 is a GHS cover. Matching the words Weil descent does
      not make this Macaulay profile into a Jacobian discrete logarithm.
  interpretation_limits:
    - >-
      One cell at q=5, m=3, n'=1 does not determine growth in n or m and
      does not move the generic exponent 1/2.
    - >-
      The sentinel 7 is a cap, not a fall at degree 7.
    - >-
      A nonzero gap is not a license to assume the first-fall degree stays
      bounded at cryptographic size, and it is not a claim that the
      last-fall bound in KR-IC-fbdb61 fails.
    - >-
      new_falls as used here is not identified with last fall degree. The
      opened row says those degree invariants are distinct.
  heuristic_assumptions:
    - id: H1
      statement: >-
        With the zero pattern held fixed, independent uniform nonzero
        coefficients on that support produce a first-positive new_falls
        degree whose median is a stable one-cell baseline. The Semaev
        coefficient pattern is one point against that baseline. This
        imitates a uniform random sparse matrix of the same shape over a
        finite field. It is not a semi-regular degree prediction. No
        rank-probability theorem was opened for the constant.
      rigorous_support: >-
        The support constraint is exact: the null and the Semaev system
        have the same zero pattern by construction. The uniform draw on
        the nonzero positions is the model. KR-IC-fbdb61, opened, says
        semi-regular predictions do not describe descended summation
        systems, so this heuristic does not use one. KR-IC-889857 does not
        supply a rank formula for this matrix.
      validation_plan:
        sampling: >-
          20 independent uniform nonzero fills of the frozen support over
          F_5, grevlex, degree cap 6.
        comparison: >-
          Median of the 20 comparison values against the single Semaev
          comparison value. Not against a semi-regular formula.
        tail_check: >-
          Range of the 20 null comparison values. A range of 2 or more
          marks the median unstable and the cell inconclusive rather than
          a structural gap.
        parameters: >-
          q=5, m=3, n'=1, cap 6, sentinel 7, 20 draws, one ordinary curve
          selected by nonzero trace. No transfer to F_{2^n}, to n' > 1, or
          to a hyperelliptic Jacobian.
  target_complexity:
    time_exponent: >-
      No improvement. Generic rho remains exponent 1/2. KN-TECH-018 adjusts
      the constant by about sqrt(|Aut|), not the exponent. No subexponential
      index-calculus cost is claimed.
    memory_exponent: >-
      Not claimed. The matrix is the Macaulay matrix through degree 6 at
      this cell.
    best_known: >-
      Pollard rho at N^{1/2}, automorphism-adjusted constant as stated in
      the opened KN-TECH-018. KR-IC-889857 records a disputed binary
      subexponential claim that this cell does not join. KR-IC-fbdb61
      records a last-fall bound independent of extension degree under
      stated conditions. This cell does not replace that bound.
    hidden_overhead: >-
      Weil descent setup, grevlex, and the degree cap. A one-cell gap hides
      no o(1) attack term because no attack is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff and not a van Oorschot-Wiener schedule.
      The output is one integer gap. GHS Jacobian cost is not charged
      because 0 Jacobian operations are performed.
