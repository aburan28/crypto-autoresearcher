  assumptions:
    - >-
      Over F_5, trace of Frobenius nonzero is the ordinary test used to
      freeze the curve. This session did not open a source for that
      criterion. If the frozen curve is later shown supersingular, the
      cell is void, not a negative.
    - >-
      The monomial order is grevlex and is frozen before the null draws.
    - >-
      The null keeps the Semaev support and replaces nonzero coefficients
      by independent uniform nonzero field elements. The zero pattern is
      not redrawn.
    - >-
      Degree cap 6. The sentinel 7 means no positive new_falls through
      degree 6. It is not a measured degree of 7.
