idea:
  id: IDEA-20261005-be4540
  question_id: RQ-DREG-bd6c86
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    One F_5 S_3 first-fall gap against a support-matched null
  class: measurement
  claim: >-
    On the first short-Weierstrass curve y^2 = x^3 + A x + B over F_5, in
    lexicographic order of (A, B), whose trace of Frobenius is nonzero,
    frozen before any matrix is built, the raw Weil descent of S_3 at
    m=3 and n'=1 has a first positive new_falls degree that differs by at
    least 1 from the median of the same degree on 20 support-matched null
    systems. new_falls(D) is the formula in the title of
    IDEA-20260916-4b7c1e: rank(M_D) minus the rank of the degree-exactly-D
    columns of M_D minus rank(M_{D-1}). The degree cap is 6. A value with
    no positive new_falls through degree 6 is recorded as 7 for the
    comparison only. Equal comparison values falsify a structural gap at
    this cell. No subexponential ECDLP cost is claimed. The cell does not
    assert that last fall degree grows with the extension degree, does not
    use a semi-regular estimate, and is not a GHS cover attack.
  mechanism: >-
    OBJECT FRAME. Representation R2: the curve equation and the descended
    polynomials, not a coordinate of a point. Operation set Sigma:
    multiplication by degree-1 monomials that appends the next Macaulay
    block. Sigma is not translation on the prime-order subgroup.
    Trichotomy: branching. The integer new_falls(D) does not determine the
    new rows, so the fall count does not propagate as a function of the
    previous integer alone. Two row spaces of equal rank collide, so the
    projection from the row space onto the fall sequence is lossy. The
    open number is the gap between the Semaev first positive degree and
    the null median. Families F1 through F7 are not the lens. S_3 is the
    system under test, which is the framework of KR-IC-5a43e5, and the
    addition is the prime-field null comparison at this one cell. This
    does not propose a factor base and does not claim an escape from the
    bounded-degree algebraic factor-base scope. A gap of at least 1 means
    the support-matched null does not reproduce the Semaev fall at this
    cell. Equal values mean the support accounts for the fall at this
    cell, including the censored pair (7, 7). The descent here is the
    polynomial system at n'=1. It is not the GHS map to a hyperelliptic
    Jacobian.
