idea:
  id: IDEA-20260805-d38a8c
  question_id: RQ-SIG-001
  added: '2026-08-05'
  title: >-
    Leverage, not count: normalise the Semaev non-rewritable cascade by the gap
    it would have to close, and decide GOAL-SIG-001 on a decay law that needs no
    D>=6 null baseline at all

  class: control

  claim: >-
    Every measurement this goal has made is an ABSOLUTE syzygy count, and the
    goal's decision target ("is the cascade an exploitable algebraic structure
    for decomposition cost") is a RATIO question that no record has ever formed.
    Form it. Define the model leverage
    lam_D(n) = residual_D(n) / Q^model_D(n), where residual_D is this goal's own
    D-born non-rewritable component and Q^model_D(n) = sum_{d<=D} HF_n(d) is the
    semi-regular quotient dimension from the goal's own pinned Hilbert series
    H(z) = (1+z)^{2n} / ((1+z^2)^n (1+z^3)^n). Q^model_D is exactly computable
    with no run, no solver and no null arm. Evaluated on the numbers ALREADY
    COMMITTED in EV-SIG-005 (residual_5 = 344 / 878 / 1158 / 974 at
    n = 9/12/15/18), lam_5 = 0.11054 / 0.03372 / 0.01119 / 0.00327 -- monotone
    decreasing across four interior points, geometric ratio 3.28 / 3.01 / 3.42
    per step of dn = 3, and a log-log fit gives lam_5 ~ n^{-5.01} against the
    n^{-D} = n^{-5} that "residual bounded, quotient Theta(n^D)" forces. The same
    normalisation on the D6 axis gives lam_6 = 0.84030 (n=9) -> 0.08118 (n=12),
    a 10.4x collapse. If this decay is real, the cascade is a genuine structure
    (H-SIG-001's growth clause survives at D4: residual_4 = 2n/3 + 1, confirmed
    at six sizes) that is nonetheless NON-OPERATIVE for cost, and GOAL-SIG-001
    can reach its committed decision with an argued bound instead of waiting on
    a D>=6 null baseline that two batches have failed to construct.
    NOTHING HERE IS A RESULT. The arithmetic above was performed by the idea
    generator in this session outside the harness (label: SESSION-COMPUTED) from
    numbers quoted out of committed evidence records; re-deriving it in-harness
    is stage 0 of the paired experiment and can terminate the line.

  object_first_candidate:
    tracked_object: >-
      The RATIO of two dimensions, followed together through the size axis:
      numerator = dim of the degree-D-born non-rewritable syzygy space
      (residual_D = extra_D - A_{D-1}, this goal's own definition); denominator =
      dim of the quotient the Macaulay matrix would still have to kill before the
      solving degree could fall to D, i.e. Q_D - |V| where Q_D = ncols_D - rank_D.
      The tracked object is the PAIR, because either component alone is a number
      whose growth cannot be interpreted. The pair is followed across n at fixed
      D (does the cascade keep pace with the space it must fill?) and across D at
      fixed n (does the cascade compound with degree, as the word "cascade"
      asserts?).
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: F5/signature tracking as
      a discovery instrument (it is the incumbent and produced every number here;
      it is used as a data source, not as the lens); Groebner first-fall / d_reg
      estimation as a way of ASSERTING solver impact (EV-SIG-003 already showed
      the syzygy family and the Macaulay rank deficit are not the same object
      rank-wise, so a d_reg argument would be borrowing an unearned link);
      Weil-descent / summation-polynomial construction variants; any new null
      construction (this proposal exists precisely because the null lane is
      blocked, and reusing it would inherit the block); Yokoyama semi-normality
      / #G* (the RQ's other arm, untouched here).
    newness_score: >-
      The ingredients are all committed and none is new. What does not exist
      anywhere in this corpus is the ratio: a grep for a normalised residual, a
      quotient-dimension denominator, a leverage or gap-to-solving comparator
      across ledger/, experiments/*/specification.yaml and knowledge/ returns
      nothing for this area (SESSION-CHECKED 2026-08-05; absence of a search
      result is not evidence something was not tried, AGENTS.md retrieval
      policy). Ten evidence records, eight experiments, and every one reports an
      absolute count against an absolute baseline.
    testability_score: >-
      Very high and mostly free. Q^model_D is a truncated power series in pure
      Python; the four lam_5 points already exist; the decisive new cell
      (n=21, D=5) is the cell EXP-SIG-007 was already built for and lost to
      infrastructure, so the instrument exists and is pinned.
    survival_score: >-
      The ratio survives every step of the pipeline because both its components
      are dimensions of subquotients of the same graded piece; it is not
      destroyed by the reductions that destroy the absolute counts'
      comparability. Its weakness is the opposite one and is named in the audit
      below: a ratio whose denominator is a MODEL quantity inherits the model's
      failure, which at n=9 D6 is exactly what happened.

  mechanism: >-
    STEP 1 -- pin the denominator without a run. The goal's pinned baseline is
    semireg_rank_pred in experiments/EXP-SIG-006/src/h013_f5_signatures.sage:
    a[j] = C(nb,j), then for each equation degree d, a[j] -= a[j-d] for
    j >= d, truncated at the first non-positive coefficient. That is exactly
    H(z) = (1+z)^{nb} / prod_i (1+z^{d_i}), truncated-positive, with nb = 2n,
    n equations of degree 2 and n of degree 3. Reconstructing it independently
    (SESSION-COMPUTED, pure Python, no solver) reproduces EVERY committed value:
    HF_9 = [1, 18, 144, 645, 1566, 738] and freeze degree 6 (EV-SIG-006 verbatim);
    sr_pred = ncols_full(D) - sum_{d<=D} HF(d) gives 180 / 1674 / 9504 / 28068 at
    n=9 D3..D6, 312 / 3834 / 29418 / 156520 at n=12, 484520 at n=15 D6 and
    1216266 at n=18 D6 -- every one of these is a number a committed record
    already carries. Row counts reproduce too: nrows(12,6) = 12*sum_{k<=4}C(24,k)
    + 12*sum_{k<=3}C(24,k) = 155412 + 27900 = 183312, and nrows(12,5) = 31512,
    both exactly as EV-SIG-008 records them. The baseline is therefore fully
    re-derivable at zero compute, which is what makes the denominator free.
    STEP 2 -- why a ratio and not a count. A non-rewritable syzygy family lowers
    the solving degree at D only by making the degree-D Macaulay matrix reach the
    rank at which the quotient collapses to the variety: rank_D = ncols_D - |V|.
    The distance to that event is Gap_D = Q_D - |V| with Q_D = ncols_D - rank_D.
    A cascade of size residual_D contributes at most residual_D dimensions of the
    kernel that a rewritable model does not already predict; it therefore has
    leverage residual_D / Gap_D on the only event that would change cost. On the
    committed cells: n=9 D6 gives Q_6 = 29332 - 27292 = 2040, Gap = 2034 (using
    the measured |V_sem| = 6), residual_6 = 2615, leverage 1.286 -- i.e. at n=9
    the cascade is the same size as the whole remaining gap. n=12 D6 gives
    Q_6 = 174033 - 138570 = 35463, Gap = 35457, residual_6 = 2722, leverage
    0.0768 -- a 16.7x collapse over one step of dn = 3. (|V_sem| at n=12 is
    UNMEASURED; |V_N1| = 2 was measured for the null. The leverage is insensitive
    to it: any |V| below 3000 moves the n=12 figure by under 10%, and this
    sensitivity is stated rather than hidden.)
    STEP 3 -- the model-leverage variant, which needs nothing measured at all.
    Replacing Gap_D by the model quotient Q^model_D = sum_{d<=D} HF(d) removes
    the last measured input from the denominator, so lam_D can be evaluated at
    any n for free and can be PRE-REGISTERED. Committed residuals give
    lam_5 = 344/3112, 878/26037, 1158/103502, 974/297823 = 0.11054, 0.03372,
    0.01119, 0.00327 at n = 9, 12, 15, 18. Monotone across four points; ratios
    3.278, 3.014, 3.421 (geometric mean 3.233) per dn = 3; log-log slope -5.010.
    STEP 4 -- the derivation the fit is testing. For fixed D below the freeze
    degree, Q^model_D <= sum_{k<=D} C(2n,k) = Theta(n^D), and the measured
    fraction Q^model_D / ncols_full(D) rises through 0.247, 0.469, 0.593, 0.671
    at n = 9..18, so Q^model_D = Theta(n^D) with a constant approaching its
    ceiling. Meanwhile the ONE residual whose growth law this program has
    actually established is residual_4 = 2n/3 + 1, confirmed at six on-lattice
    sizes with zero seed variance (EV-SIG-005 P1): LINEAR. If residual_D is
    n^{O(1)} with an exponent independent of D -- the numbered heuristic below --
    then lam_D(n) = O(n^{1-D}), which vanishes for every D >= 2 and vanishes
    FASTER the higher the degree. The measured slope -5.01 at D = 5 is what
    n^{1-D} with a bounded residual predicts; it is not a free parameter.
    STEP 5 -- what would overturn it, stated now rather than after the fact. The
    word "cascade" asserts multiplicative compounding: the D4 family should
    generate a larger D5 family, which should generate a larger D6 family. The
    goal's own closure numbers are the place to test that and they point BOTH
    ways: the inherited part does grow (A5 = 6282 at n=9 -> 15260 at n=12, x2.43;
    extra_6 = 8897 -> 17982, x2.02) while the newly-born part does not
    (residual_6 = 2615 -> 2722, +4.1%). Normalised, even the inherited part loses
    ground: extra_6 / Q^model_6 = 2.859 (n=9) -> 0.536 (n=12). The proposal is
    falsified if residual_D or extra_D grows like Q^model_D at any tested cell.

  novelty_status: unverified

  literature_context:
    - >-
      INTERNAL, READ IN FULL, and the entire numerical basis of this proposal:
      ledger/EV-SIG-004.yaml (canonical rank-exact D4 residual series),
      ledger/EV-SIG-005.yaml (residual_4 = 2n/3+1 at six sizes; residual_5 =
      344/878/1158/974 at n=9/12/15/18, n=18 replicated across two seeds),
      ledger/evidence/EV-SIG-006.yaml (n=9 diagnosis, pinned sr_pred semantics,
      freeze law, residual_6 = 2615), ledger/evidence/EV-SIG-008.yaml (n=12 D6:
      sem rank 138570, ncols 174033, residual_6 = 2722, null extra_6 = 7110).
      EVERY NUMBER THIS PROPOSAL USES IS QUOTED FROM ONE OF THOSE FOUR RECORDS.
    - >-
      ADMISSIBILITY CAVEAT, stated up front because it bounds what this proposal
      may become. EV-SIG-006 and EV-SIG-008 both declare their D6 quantities
      INADMISSIBLE as cascade evidence, because no valid D6 null baseline exists
      at those cells. This proposal does not overturn that and does not need to:
      its primary axis is D = 5, where EV-SIG-005 records each cell as
      null-validated (D5 null extra = 0, rank == sr_pred). The D6 leverage
      figures are reported as SUPPORTING CONTEXT ONLY and inherit the
      inadmissibility verbatim.
    - >-
      ARTIFACT CAVEAT. EV-SIG-008's own artifact_absence_statement records that
      its cited run manifests do not register (pre-current schema, or absent),
      and that experiments/EXP-SIG-008/specification.yaml is Markdown prose with
      a .yaml extension so the experiment does not register either. Its numbers
      are used here as QUOTED FROM A COMMITTED LEDGER RECORD, not as
      run-receipt-backed measurements, and the paired experiment re-measures the
      n=12 D5 cell rather than trusting the D6 ones.
    - >-
      RECALLED, UNVERIFIED -- the general position that a bounded-size syzygy
      family cannot lower the degree of regularity of a growing system is the
      kind of statement the Bardet-Faugere-Salvy semi-regularity literature would
      be expected to contain in some form. NO SUCH SOURCE WAS READ, no theorem
      number is asserted, and the paired experiment carries "search for a prior
      statement of the O(n^{1-D}) leverage bound" as an explicit step. If one
      exists, this proposal's contribution shrinks to the instantiation and must
      be rewritten to say so.

  lossy_projection_identifiability_audit:
    projection: >-
      The full syzygy module of the degree-D Macaulay matrix (a graded module
      with a signature filtration) --> the single rational number
      lam_D = residual_D / Q_D.
    what_is_discarded: >-
      Which syzygies, where they sit, their signatures, their supports, their
      block structure, and every distinction between two families of equal
      dimension.
    why_genuinely_lossy: >-
      Massively lossy -- a 2722-dimensional space is replaced by one rational.
      The discard is not a change of coordinates: the pair (residual_D, Q_D) is
      NOT recoverable from lam_D, and the syzygy module is not recoverable from
      the pair. This is the opposite of the canonical (Delta, Pi) = (x XOR y,
      x*y) failure in char 2, where the pair is recoverable as the roots of
      t^2 + Delta t + Pi and nothing was gained.
    why_compatible_with_the_operations: >-
      The target operation is "does the solving degree fall to D", which is the
      single predicate rank_D = ncols_D - |V|. Both components of the ratio are
      dimensions of subquotients of the same graded piece and both propagate
      deterministically under the elimination the solver performs, so the
      retained part is exactly the part the target operation reads. That is why
      the projection is admissible despite discarding almost everything.
    is_it_only_a_change_of_coordinates: >-
      No -- checked and rejected in that direction. The failure checked FOR here
      is the MIRROR one: a projection so lossy that it is constant across
      instances (zero comparator spread), which is the tell KN-TECH-1a5b7e
      catalogues. THE CHECK RETURNED: not constant. Across the four committed
      D5 cells lam_5 takes four distinct values spanning a factor of 33.8
      (0.11054 down to 0.00327), and across the two D6 cells a factor of 10.4.
      A constant-across-instances statistic could not have done that. The
      residual comparator-spread risk that remains is different and is named in
      confounders: lam is monotone in n BY CONSTRUCTION IF residual_D is bounded,
      so the decay is only informative against the alternative that residual_D
      grows like Q^model_D -- which is exactly why that alternative is written
      into the falsification conditions as a numeric threshold rather than left
      implicit.

  assumptions:
    - >-
      That residual_D as this goal defines it (extra_D - A_{D-1}, the D-born
      non-rewritable component after the closure of the lower-degree families)
      is the right numerator. If part of what the pipeline calls "born at D" is
      inherited content the closure failed to attribute, the numerator is
      inflated and the decay is UNDERSTATED, which is the safe direction for
      this proposal and the dangerous direction for the opposite conclusion.
    - >-
      That the pinned semi-regular series is the correct model quotient. This is
      NOT assumed to be true of the real system -- it is used only as a
      denominator with a stated growth rate Theta(n^D), and the ratio's
      interpretation survives any denominator with that growth rate. The
      experiment reports the ratio against the MEASURED Q_D as well, so the
      conclusion does not rest on the model.
    - >-
      That |V_sem| stays O(1) in n (it is 6 = 3! at n=9, the decomposition
      orderings). If |V_sem| grew, Gap_D would shrink and leverage would rise.
      This is measurable by enumeration at n=9 (done) and n=12 (not done) and is
      a required arm.

  predictions:
    - metric: >-
        lam_5(21) = residual_5(21) / Q^model_5(21), with Q^model_5(21) = 706308
        computed before the run from the pinned series
      direction: lower
      minimum_effect: >-
        FORCED DICHOTOMY, both sides derived before any run. NON-OPERATIVE side:
        lam_5(21) < 0.00327, equivalently residual_5(21) < 2311. OPERATIVE side:
        lam_5(21) >= 0.00327, equivalently residual_5(21) >= 2311 (the cascade
        keeping pace with the quotient). Point prediction from the four-point
        geometric law: lam_5(21) = 0.00101, residual_5(21) = 714, with a stated
        band of 400-1400 to absorb the non-monotonicity already recorded at
        n = 18. A measured residual_5(21) >= 2311 FALSIFIES this proposal
        outright.
    - metric: >-
        lam_5(24) with Q^model_5(24) = 1469033
      direction: lower
      minimum_effect: >-
        Non-operative side: residual_5(24) < 4805. Point prediction 460, band
        200-1100. Stated now so the n=24 cell cannot be interpreted after the
        fact.
    - metric: >-
        Sign of the finite difference lam_5(n+3) - lam_5(n) over every tested
        pair
      direction: lower
      minimum_effect: >-
        Negative at every one of the >= 4 available steps (9->12, 12->15, 15->18,
        18->21). A SINGLE non-negative step is a graded-control failure and
        localises the obstruction to that size rather than leaving the result as
        "it decayed".
    - metric: >-
        log-log slope of lam_5 against n over all measured sizes
      direction: lower
      minimum_effect: >-
        <= -3.5. The derivation forces -4 for a strictly bounded residual and the
        four committed points give -5.010; a slope above -3.5 means the residual
        is growing faster than the derivation allows and the O(n^{1-D}) bound is
        wrong.
    - metric: >-
        lam_4(n) = (2n/3 + 1) / Q^model_4(n), computed with NO new measurement
        from the closed form EV-SIG-005 confirmed at six sizes
      direction: lower
      minimum_effect: >-
        Strictly decreasing in n with slope near -3 on a log-log fit (n^{1-D},
        D = 4). This costs zero compute and is the cheapest possible internal
        consistency check on the whole construction: if the D4 axis, where the
        growth law is PROVEN linear and null-validated, does not show the
        predicted decay, the leverage construction is wrong and the line stops
        before anything is measured.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to end the line. STAGE 0 (pen and
      paper / pure Python, minutes, ZERO new measurement, TERMINATES THE RUN IF
      IT FAILS): re-derive the pinned series in-harness, reproduce all committed
      sr_pred and nrows values, then evaluate lam_4 and lam_5 on the ALREADY
      COMMITTED residuals. If lam_4 -- whose numerator is the one proven growth
      law in this goal -- does not decay, stop. STAGE 1 (zero compute): the
      internal-consistency and sanity identities, plus a literature step to look
      for a prior statement of the leverage bound. STAGE 2 (the one real
      measurement): residual_5 at n = 21 with the pinned instrument and the
      memory-safe staging EXP-SIG-007 was built for; this is the pre-registered
      cell. STAGE 3 (only if stage 2 lands inside the band): n = 24 D5, and
      |V_sem| by enumeration at n = 12 to replace the assumed 6.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, AND IT CAN FAIL.
        The D5 support-matched null at each tested size, which EV-SIG-005 records
        as validating (extra_5 = 0, rank == sr_pred). Its forced leverage is
        lam_5^null = 0 / Q^model_5 = EXACTLY 0 at every n. This null can fail in
        two distinct ways and both are informative: a nonzero null extra (the
        support-matching confound EV-SIG-006 measured as 369 at n=9 D5 reappearing
        at n=21) means the numerator is contaminated and the treatment arm may
        not be read; a null extra that GROWS with n means the whole normalisation
        is measuring the null construction.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. A system
        carrying a deliberately planted non-rewritable family of KNOWN dimension
        k, built at n = 9 and n = 12 where the pipeline is cheap. The instrument
        must return residual_5 >= 0.8k above its baseline on that object. IF IT
        DOES NOT, THE INSTRUMENT IS NOT SENSITIVE TO THE QUANTITY THIS GOAL HAS
        BEEN MEASURING FOR EIGHT EXPERIMENTS AND NO NEGATIVE RESULT MAY BE
        REPORTED AT ALL. This goal has never run such a control; the design is
        IDEA-20260805-8a68d3 and it is a required arm here, not an optional one.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. The n axis
        at fixed D = 5 already supplies four interior points (9, 12, 15, 18) and
        stage 2 adds a fifth (21). Report the sign of every finite difference,
        not just the endpoints, so a failure localises to a size.
      - >-
        SECOND GRADED CONTROL ON THE OTHER AXIS. lam_D at fixed n = 12 across
        D = 4, 5, 6 (0.000..., 0.03372, 0.08118 -- to be recomputed in-harness):
        the derivation predicts leverage falls with D for fixed n only after the
        quotient outgrows the cascade, and the n=12 D6 point rising above D5 is
        a real tension that must be reported, not smoothed. It is the single
        most likely place this proposal is wrong.
      - >-
        ORDERING CONTROL. lam is computed and its decision label emitted on the
        NULL arm and on the already-committed sizes BEFORE the n=21 treatment
        number is looked at. The decision rule is frozen in the contract.
      - >-
        ARCHIVE CHECK, zero compute. Every committed residual and rank used in
        stage 0 is re-read from its ledger record and its run-registration status
        recorded next to it, so a reader sees which inputs are receipt-backed
        (EV-SIG-005, EV-SIG-006) and which are quoted-only (EV-SIG-008).
    required_metrics:
      - lam_D table with numerator, denominator, provenance and registration status per cell
      - sign of every finite difference in n, and the log-log slope with its residuals
      - null-arm extra_5 per size, reported before the treatment arm
      - planted-family recovery fraction on the positive control, with k and the measured excess
      - measured Q_D alongside model Q^model_D wherever a rank exists, with the two ratios reported separately

  falsification_conditions:
    - >-
      residual_5(21) >= 2311 (equivalently lam_5(21) >= 0.00327). The cascade is
      then keeping pace with the quotient and the decay claim is dead.
    - >-
      Any non-negative finite difference in lam_5 across the size ladder,
      unexplained by a null-arm failure at the same cell.
    - >-
      lam_4, computed at zero cost from the proven 2n/3+1 law, failing to decay.
      This kills the construction before any measurement.
    - >-
      The positive control failing: the instrument does not recover a planted
      family of known size. Then NO negative may be reported and the goal's
      standing conclusions need re-examination rather than extension.
    - >-
      |V_sem| measured at n = 12 turning out to grow with n rather than sitting
      at O(1). Gap_D shrinks and the leverage argument must be re-derived.

  confounders:
    - >-
      DENOMINATOR INHERITS THE MODEL'S FAILURE. Q^model_D is exactly the quantity
      that EV-SIG-006 showed is unrealizable at and above the freeze degree
      (n = 9, D = 6: model quotient 3112 against measured variety sizes 0/1/6).
      Below freeze it is a legitimate scale; at or above it, it is not. The D5
      axis is below freeze at every tested size (freeze = 6/7/8/9 at
      n = 9/12/15/18, so D5 is below freeze for n >= 12 and AT freeze-1 for
      n = 9). The n = 9 D5 cell is therefore the closest to the model's failure
      and its lam value is the largest -- exactly what a model artifact would
      also produce. Mitigation: report lam against the MEASURED Q_D in parallel,
      and treat n = 9 as an out-of-lattice size, which EV-SIG-005 already does.
    - >-
      A DECAYING RATIO IS PARTLY BUILT IN. If residual_D is bounded, lam_D must
      decay; the informative content is only the comparison against the
      alternative that residual_D grows like Q^model_D. That alternative is
      therefore written as a numeric threshold in the predictions and is the only
      thing the measurement decides.
    - >-
      NUMERATOR DEFINITION DRIFT. EV-SIG-002 and EV-SIG-004 record two DIFFERENT
      D4 residual series over the same cells (9/10/13/14 vs 9/11/13/15 at
      n = 12/15/18/21), agreeing at n = 12 and n = 18 and disagreeing at n = 15
      and n = 21. BOTH ARE REPORTED HERE AND NEITHER IS PICKED (AGENTS.md
      retrieval policy item 7). The closed form 2n/3 + 1 that EV-SIG-005 confirms
      at six sizes fits the EV-SIG-004 series exactly and the EV-SIG-002 series
      at two of four points; that is an observation about a fit, not an
      adjudication, and the experiment records which reduction produced which.
    - >-
      SINGLE-SEED CELLS. residual_6 at n = 12 is seed 2 only. The D5 ladder has
      better replication (n = 18 across two seeds, zero variance) and is the
      primary axis for that reason.
    - >-
      AUTHORSHIP ASYMMETRY. A bounding result is cheap to produce and reads as
      rigour. The positive control and the numeric operative threshold exist so
      that the non-operative conclusion costs something to reach.

  interpretation_limits:
    - >-
      Toy scale throughout (AGENTS.md rule 7): boolean chained Semaev, m = 3,
      t = 3, n <= 24, one lattice of sizes. NOTHING here is a crypto-scale
      statement and nothing here licenses a claim about prime-field ECDLP cost.
      See IDEA-20260805-0d2a21 for the separate and unresolved question of
      whether a boolean measurement bears on this goal's stated prime-field
      objective at all.
    - >-
      A confirmed decay does NOT say the cascade is absent, is uninteresting, or
      that the lane is dead. H-SIG-001's growth clause survives it at D4. What it
      would say, and the only thing it would say, is that at the tested sizes and
      degrees the D-born non-rewritable component is a vanishing fraction of the
      gap to a solving-degree collapse, so no cost consequence follows from its
      existence at those cells.
    - >-
      FORWARD GUIDANCE, required by inventor protocol section 4 and supplied
      rather than promised. Three concrete things remain open even under a clean
      decay: (a) MULTIPLICATIVE COMPOUNDING -- the inherited component A_{D-1}
      grows (x2.43 from n=9 to n=12) while the born component does not, and
      whether the compounding rate can exceed the quotient's growth at larger D
      is untested; (b) the CM panel, which RQ-SIG-001 names and which no SIG
      experiment has touched -- a curve family whose residual grows faster than
      2n/3 + 1 would overturn this immediately and is exactly where to look;
      (c) the Yokoyama arm (#G*, NS(Syz), signatures Phi(s)), the RQ's other and
      never-implemented half.
    - >-
      This proposal makes NO status change to H-SIG-001 and no goal transition.
      Those are Coordinator decisions.

  heuristic_assumptions:
    - id: HEUR-LEV-1
      statement: >-
        For every fixed D >= 4 below the freeze degree, the D-born non-rewritable
        component of the boolean chained Semaev ideal satisfies
        residual_D(n) = O(n^c) for a constant c independent of D, with c = 1
        conjectured from the only established case.
      rigorous_support: >-
        Established only at D = 4, where residual_4 = 2n/3 + 1 exactly at
        n = 12, 15, 18, 21, 24 with zero seed variance (EV-SIG-005 P1), plus the
        off-lattice n = 9 value 24. At D = 5 the four measured values
        (344/878/1158/974) are consistent with a bounded-or-slowly-growing
        function and are NON-MONOTONE, which is not what a clean n^c does; the
        heuristic is stated as a heuristic precisely because of that. NOT proved,
        NOT quoted from any source, NOT to be presented as established.
      validation_plan: >-
        The n = 21 and n = 24 D5 cells of the paired experiment, against the
        pre-registered thresholds above. A residual_5(21) >= 2311 refutes it.
      falsification_condition: >-
        Any measured residual_D exceeding 2 * residual_D(n-3) at a null-validated
        cell.
    - id: HEUR-LEV-2
      statement: >-
        Q^model_D(n) = sum_{d<=D} HF_n(d) = Theta(n^D) for fixed D below the
        freeze degree, with the implied constant bounded away from 0 and
        infinity over the tested lattice.
      rigorous_support: >-
        Upper bound is immediate: Q^model_D <= sum_{k<=D} C(2n,k) = Theta(n^D).
        The lower bound is where the heuristic lives, and it is supported
        numerically rather than proved: the ratio Q^model_5 / ncols_full(5) is
        0.247, 0.469, 0.593, 0.671 at n = 9, 12, 15, 18, rising toward its
        ceiling (SESSION-COMPUTED from the pinned series). A rising bounded ratio
        is exactly Theta(n^D); a ratio that fell toward 0 would not be.
      validation_plan: >-
        Extend the ratio table to n = 21, 24, 27 at zero compute in stage 0 and
        report it; it is a pure series evaluation and needs no experiment.
      falsification_condition: >-
        Q^model_D / ncols_full(D) turning over and decreasing across the lattice.
    - id: HEUR-LEV-3
      statement: >-
        |V_sem|, the number of solutions of the boolean chained Semaev system,
        is O(1) in n (measured 6 = 3! at n = 9, the decomposition orderings).
      rigorous_support: >-
        Measured once, by full 2^18 enumeration at n = 9 (EV-SIG-006 C5). The
        combinatorial reading -- one solution per ordering of an m = 3
        decomposition -- predicts 6 independent of n, but that reading is the
        idea generator's and is NOT sourced.
      validation_plan: >-
        Enumerate at n = 12 (2^24, feasible) as a required arm. If |V_sem| is 6
        again the heuristic strengthens; if it grows, Gap_D shrinks and the
        leverage argument must be re-derived at the measured value.
      falsification_condition: "|V_sem| at n = 12 exceeding 100."

  proof_search_map_ref: >-
    Carried in full on the paired hypothesis H-SIG-e7ff26; not duplicated here.

  target_complexity:
    time_exponent: >-
      THIS PROPOSAL MOVES NO EXPONENT AND SAYS SO PLAINLY. It is an audit whose
      output is a bound on how much an exponent COULD move. What it decides is
      whether the object GOAL-SIG-001 has spent eight experiments measuring is
      capable of moving the solving degree of the boolean chained Semaev system
      at all; the honest reading of the committed numbers is that its leverage
      decays as n^{1-D}, in which case the answer is no at the tested sizes and
      the exponent that stays put is the semi-regular d_reg-driven Groebner
      exponent for Semaev decomposition. The reason it is still worth running is
      the reason the target-result profile gives for costing honestly: a bounded
      structure that everyone assumes is exploitable is a standing
      misallocation, and eliminating it redirects the whole Tier-1 lane.
    memory_exponent: >-
      n/a -- no algorithm is proposed. The COST of the audit is memory-bound, not
      time-bound (the n = 21 D5 echelon is what killed EXP-SIG-007), and the
      contract charges memory explicitly.
    best_known: >-
      For boolean chained Semaev decomposition at these sizes the incumbent is
      the semi-regular d_reg prediction from the same pinned Hilbert series used
      as the denominator here; there is no published faster route this proposal
      competes with, because it proposes no route.
    hidden_overhead: >-
      The O(n^{1-D}) bound hides the constant in HEUR-LEV-1's residual_D = O(n^c)
      and is only as good as c. At c = 1 the bound is n^{1-D}; at c = D - 1 it is
      O(1) and the whole argument evaporates. That sensitivity is the proposal's
      real weak point and is stated rather than buried.
    tradeoff_note: n/a.

  dominated_by: >-
    null, and here is exactly what was checked before writing that. TIME: this
    proposal claims no algorithm, so no time-frontier row can dominate it; the
    incumbent cost statement for the underlying system is the semi-regular d_reg
    prediction, which this audit uses rather than competes with. MEMORY: the only
    memory-frontier fact in scope is that the n = 21 D5 echelon exceeded the
    budget in EXP-SIG-007 -- that is a cost the contract must pay, not a
    domination. DATA / QUERIES: zero new instances are required for stage 0 and
    stage 1, and stages 2-3 reuse the frozen instance family, so no data-frontier
    row applies. On the QUESTION rather than the method, the rows checked for a
    prior normalised comparator were: all ten EV-SIG records, all eight EXP-SIG
    specifications, ledger/proposals/, knowledge/techniques/, knowledge/findings/
    and a repository-wide grep for quotient-dimension / leverage / normalised-
    residual language (SESSION-CHECKED 2026-08-05). None found. Absence of a
    search result is not evidence that nothing exists (AGENTS.md retrieval policy
    item, and the ANGLE-BRIEF's T-H caveat that this corpus's novelty screens are
    weak applies here in full).
  sota_delta: >-
    Quantitative, and it is an EVIDENTIARY delta, not a performance one.
    (1) It supplies a decision-relevant statistic where the goal currently has
    ten records of absolute counts: lam_5 = 0.11054 / 0.03372 / 0.01119 /
    0.00327 across n = 9/12/15/18, a 33.8x span computed at zero new compute.
    (2) It removes the goal's blocking dependency: two batches and roughly
    28,800 s of declared campaign wall clock have been spent on a D >= 6 null
    baseline that has failed at every attempted cell, and the primary axis here
    is D = 5, where every cell is ALREADY null-validated. (3) It converts the
    goal's completion criterion from "wait for a baseline" into "measure one
    pre-registered cell (n = 21, D = 5) against a threshold of 2311". Against the
    status quo of no comparator at all, the delta is the difference between a
    decidable and an undecidable goal.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.72 that lam_5 continues to decay through n = 21 and n = 24 as predicted.
    It is not higher because residual_5 is already NON-MONOTONE over the four
    committed points (344 -> 878 -> 1158 -> 974, replicated at n = 18), so the
    numerator is not a clean n^c and one more upward step at n = 21 is entirely
    possible; because the n = 12 D6 leverage (0.0812) sits ABOVE the n = 12 D5
    leverage (0.0337), which is the wrong direction for the degree axis and is a
    live tension this proposal does not resolve; and because the entire numerator
    series comes from an instrument that has never been shown to detect a syzygy
    family of known size. It is not lower because the D4 axis has a PROVEN linear
    law at six sizes with zero seed variance, because the denominator's
    Theta(n^D) growth is close to immediate, because the four-point log-log slope
    (-5.010) lands within 1% of the value the derivation forces (-5), and because
    a coincidence that sharp across a 33.8x span is unlikely to be an artifact of
    the normalisation alone. Separately: 0.93 that stage 0 reaches a decisive
    reading, because it is a power-series evaluation on committed numbers and
    needs no solver, no null, and no new instance.
