idea:
  id: IDEA-20260807-e57607
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    THE ONE PLACE AN EXPONENT COULD MOVE IN THIS LANE, AND AN HONEST LOW PRIOR
    ON IT: everything phi does to the factor base is a constant, so the only
    exponent-relevant lever is the GROWTH IN ARITY of the solving degree --
    measure whether the phi-quotiented encodings shift d_ff by a constant
    (constant-factor, dead) or change its growth rate in m (exponent-relevant),
    with a third encoding ENC-AUX that lowers the membership degree from r m to
    m without inflating the summation polynomial at all
  class: measurement

  claim: >-
    (A) WHY THIS IS THE ONLY EXPONENT-RELEVANT QUESTION IN L4, DERIVED. For
    prime-field point decomposition at arity m with factor base size B and
    automorphism order r acting on the x-line: the per-target success
    probability is about B^m / (m! N); the number of independent relations
    needed is B / r (IDEA-20260807-5dfe4a); so the number of successful searches
    is about m! N / (r B^{m-1}), and the total is that times G(m, B), the cost
    of one algebraic decomposition test. Balancing at B = N^{1/m} gives
      total  =  (m! / r) * N^{1/m} * G(m, N^{1/m}).
    THE FACTOR 1/r IS A CONSTANT AND CANNOT MOVE AN EXPONENT. THE FACTOR
    N^{1/m} FALLS WITH m. SO THE ENTIRE QUESTION IS WHETHER G(m, B) GROWS
    SLOWLY ENOUGH IN m TO LET m GROW -- and G is governed by the solving degree
    D through roughly (m + D choose D)^omega (KN-TECH-011). Everything else in
    lane L4 -- the orbit quotient, the phase statistic, the factor-base design,
    the |Aut| sweep -- is a constant. D(m) is the exponent.

    (B) THE TWO BRANCHES, PRE-REGISTERED AND MUTUALLY EXCLUSIVE. Let
    D_X(m) be the measured solving degree of the incumbent encoding and
    D_I(m) that of a phi-quotiented encoding.
      BRANCH CONST: D_I(m) - D_X(m) is bounded as m grows (a constant shift, or
        zero). Then the quotient buys a constant factor in G and nothing more,
        the exponent of the method is unchanged, and L4 IS CLOSED FOR EXPONENT
        PURPOSES with a named obstruction -- "the automorphism quotient acts on
        the constant, not on the degree". That is a closure at the
        docs/inventor-protocol.md section 4 standard and it is the expected
        outcome.
      BRANCH RATE: D_I(m) / D_X(m) tends to a limit strictly below 1, or D_I
        grows in a strictly smaller class. Then the quotient acts on the
        exponent and the composed cost above changes, and the honest next step
        is a full conditional-complexity record with numbered heuristics and a
        cost table -- not a claim made here.
    NOTHING IN BETWEEN IS REPORTABLE AS A RATE CHANGE FROM TWO OR THREE ARITIES,
    and the record says so in advance: with m in {2, 3} and possibly 4, a
    measured ratio is a data point, never a growth rate. THE HONEST CEILING OF
    THIS EXPERIMENT IS THEREFORE TO REFUTE BRANCH RATE OR TO FAIL TO REFUTE IT,
    and the record is written to make the refutation cheap.

    (C) THE THREE ENCODINGS, AND ENC-AUX IS THE NEW ONE. Let V be a union of m'
    orbits, |V| = r m', with orbit invariants u_1, ..., u_{m'} and membership
    polynomial g of degree m' (IDEA-20260807-1ea327 claim (B)).
      ENC-X: {S_{m+1}(x_1,..,x_m,x_R) = 0} together with f_V(x_i) = 0 for each
        i. Variables m. Degree sequence (2^{m-1}, r m', ..., r m').
      ENC-SYM: the norm form on the invariant line,
        {T_m(u_1,..,u_m) = 0, g(u_i) = 0}. Variables m. Degree sequence
        ((2r)^{m-1}, m', ..., m'). The membership degree falls by r; the
        summation degree RISES by r^{m-1}. This is the encoding of
        IDEA-20260807-1ea327 and IDEA-20260807-5ddccf.
      ENC-AUX (NEW HERE, AND THE POINT OF THIS RECORD): keep the summation
        polynomial in the x-variables and introduce auxiliary invariants,
        {S_{m+1}(x_1,..,x_m,x_R) = 0,  u_i - x_i^r = 0,  g(u_i) = 0}.
        Variables 2m. Degree sequence (2^{m-1}, r, ..., r, m', ..., m').
        THE MAXIMUM GENERATOR DEGREE IS max(2^{m-1}, r, m'), against ENC-X's
        max(2^{m-1}, r m') and ENC-SYM's max((2r)^{m-1}, m'). ENC-AUX is the
        only encoding that gets the r-fold membership reduction WITHOUT paying
        the r^{m-1} summation inflation, and it pays instead in VARIABLE COUNT,
        doubling m. Whether trading degree for variables helps a Groebner
        computation is exactly the kind of question that degree bookkeeping does
        not answer and measurement does.

    (D) WHY THE BOOKKEEPING MIGHT NOT PREDICT THE ANSWER, WHICH IS THE ONLY
    REASON THIS IS WORTH RUNNING. KN-TECH-011's applicability limits record that
    "the clean semi-regular complexity is a HEURISTIC: Semaev systems are
    structured (symmetric, sparse) and may not be semi-regular, so measured
    solving degrees can deviate from Hilbert-series predictions -- a deviation
    is itself a finding, not an error." The phi-quotient changes the structure
    in a specific way (it removes an exact group symmetry from the solution set,
    reducing the solution count by r^m while raising or holding degrees), and
    structured systems are precisely where degree predictions fail. So the
    measurement can disagree with the bookkeeping, and if it does, the direction
    of the disagreement is the finding.

    (E) RELATION-COUNT ARITHMETIC, UNCHANGED AND STATED. In every encoding, a
    solved system certifies one decomposition and yields ONE independent
    equation over the m' reduced unknowns, with coefficients in the powers of
    lambda; the automorphism images are lambda-multiples with rank increment 0.
    No encoding manufactures relations. The encodings differ ONLY in the cost of
    finding one, which is G(m, B), which is claim (A)'s exponent.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1: the measured quantity is the degree behaviour of a polynomial system in
    x-coordinates as FIELD ELEMENTS. A generic-group simulator cannot form a
    summation polynomial, cannot introduce an auxiliary invariant variable, and
    cannot report a solving degree, so nothing here is simulable in the sense of
    KN-FIND-b7e091. R2: the invariant u = x^r exists only because of the curve
    equation (a = 0 for r = 3, b = 0 for r = 2), a biconditional established in
    IDEA-20260807-5ddccf claim (A). phi is never applied to a point of G to gain
    information; claim (E) states positively that doing so yields rank 0.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). Nothing
      asserted about it in either direction. H-STR-002's subject is the
      LINEAR-ALGEBRA stage (displacement rank, structured solve against
      Wiedemann); this record's subject is the RELATION-COLLECTION stage's
      algebraic cost, i.e. G(m, B), which H-STR-002 does not mention and no arm
      of EXP-STR-002/003/004 measures. The two stages are the two halves of
      index calculus and improving one says nothing about the other.
    - >-
      IDEA-20260807-1ea327. That record measures ENC-X against ENC-SYM and
      ENC-ASYM at arity 2 only, and its question is whether the degree inflation
      cancels the candidate deflation at that single arity. This record's
      question is the GROWTH IN m and it introduces ENC-AUX, which does not
      appear there. The two overlap at (m = 2, ENC-X vs ENC-SYM) and must agree
      there; disagreement is an instrument problem.
    - >-
      IDEA-20260807-5ddccf. That sweeps r at fixed small m across curve
      families. This sweeps m at fixed r on one family. Orthogonal axes of the
      same two-parameter surface, deliberately separated so a positive result on
      either is attributable.
    - >-
      RQ-DREG-001 / KN-OPEN-002, the program's existing degree-of-regularity
      lane. That lane measures d_ff and d_reg for the STANDARD Semaev system
      over prime fields and asks whether d_ff tracks d_reg. This record measures
      the SAME quantities on two additional encodings and asks a comparative
      question. It is a consumer of that lane's instrument and its methodology,
      not a duplicate, and its ENC-X arm must reproduce that lane's recorded
      values on any shared instance -- a hard consistency gate.
    - >-
      IDEA-20260806-e4f96e (polynomial-calculus refutation degree). That
      proposal seeks a SOLVER-INDEPENDENT lower bound on the degree for a fixed
      encoding. This record compares SOLVER-DEPENDENT measured degrees across
      encodings. They are complementary and would compose: a PC-degree
      measurement on ENC-AUX would say whether its degree advantage, if any, is
      real or an artifact of one solver. That composition is named here as a
      follow-on and is not attempted.

  object_first_candidate:
    tracked_object: >-
      THE SOLVING-DEGREE FUNCTION D_E(m) -- the maximum degree reached by the
      solver on encoding E at arity m -- tracked as m grows, for
      E in {ENC-X, ENC-SYM, ENC-AUX}.
    lossiness: >-
      SEVERELY LOSSY: the whole polynomial system, its solutions, its geometry
      and its solver trace collapse to one integer per (E, m). What is retained
      is the quantity that controls G(m, B) and hence, by claim (A), the
      exponent. HONEST CAVEAT: D is a property of a SOLVER on an ENCODING, not
      of the underlying decomposition problem, so the projection is not
      canonical -- a different solver or monomial order gives a different D. That
      non-canonicity is the object's main weakness and it is why the
      polynomial-calculus composition named in discriminated_from would be the
      natural strengthening.
    propagation: >-
      Deterministic given (solver, encoding, instance). Propagates under arity
      growth in the sense that the arity-(m+1) system contains the arity-m
      structure after specialisation, which is why monotonicity in m is a
      testable prediction rather than an assumption.
    survival_score: >-
      Survives change of curve, factor base and target. Dies at: change of
      solver or monomial order (non-canonicity above); and at the arity where
      the system becomes infeasible in this harness, which for ENC-SYM at r = 3
      is m = 3 by the degree (2r)^{m-1} = 36 and for ENC-AUX may be later
      because its generator degrees are much smaller. The differing death points
      are themselves a measured comparison.

  mechanism: >-
    STEP 1 -- BUILD THE THREE ENCODINGS AT m = 2 AND m = 3, WITH DEGREES
    VERIFIED. Construct ENC-X from S_3 and S_4
    (harness/semaev.py::s3_expr, s4_expr), ENC-SYM by iterated resultants, and
    ENC-AUX by adding the m auxiliary equations u_i - x_i^r and the m membership
    equations g(u_i). Verify the declared degree sequences exactly; a mismatch
    halts the line.

    STEP 2 -- CONSISTENCY GATE AGAINST THE EXISTING DREG LANE. On an instance
    already recorded in the RQ-DREG-001 family, run ENC-X through this record's
    instrumentation and require exact agreement with the recorded solving-degree
    proxy. If the two meters disagree, they are not measuring comparable things
    and no cross-encoding comparison is valid. THIS GATE COMES BEFORE ANY NEW
    NUMBER IS PRODUCED.

    STEP 3 -- MEASURE D AND d_ff ON ALL THREE, AT m = 2 AND m = 3. Report both
    proxies: the maximum total degree of the reduced basis (the
    implementation-bound proxy harness/semaev.py already computes and labels)
    and, where the solver exposes it, the first-fall degree. KN-OPEN-002 records
    that whether d_ff tracks d_reg over prime fields is open, so BOTH are
    reported and neither is presented as the other.

    STEP 4 -- THE SEMI-REGULAR PREDICTION, COMPUTED SYMBOLICALLY AND FOR FREE.
    From each encoding's degree sequence and variable count, compute the
    Bardet-Faugere-Salvy semi-regular degree of regularity as the index of the
    first non-positive coefficient of the Hilbert series
      prod_i (1 - t^{d_i}) / (1 - t)^{n}.
    This costs no compute and gives a PREDICTION for each (E, m) before any
    solver runs. The deviation between prediction and measurement is the
    quantity KN-TECH-011 flags as itself a finding, and it is reported per cell.

    STEP 5 -- THE ARITY EXTRAPOLATION, AND ITS REFUSAL. Tabulate
    D_E(2), D_E(3) and, if feasible, D_E(4) for each encoding, together with the
    semi-regular predictions at m up to 8 (which are free to compute at any m).
    STATE EXPLICITLY that two or three measured points cannot distinguish a
    constant shift from a rate change, and that the extrapolation reported is
    the SEMI-REGULAR PREDICTION -- a symbolic model -- not a measurement. The
    measurement's role is to say whether the model is trustworthy at the arities
    where it can be checked.

    STEP 6 -- THE NULLS. For each encoding, the size-matched random factor base;
    and for the invariant encodings, the formal substitution on a curve without
    the automorphism (NULL-1 of IDEA-20260807-1ea327). Plus the r = 1
    degeneration, where all three encodings collapse toward ENC-X and the
    measured differences must vanish.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content mode;
      (2) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode.
      Records read: KN-TECH-004, KN-TECH-011 (including its applicability-limits
      paragraph, quoted in claim (D)), KN-TECH-012, KN-OPEN-002 (via
      KN-TECH-004/011 cross-references), KN-LIT-004, KN-LIT-006,
      DEC-20260727-009, H-STR-002, harness/semaev.py. External web searches as
      recorded in IDEA-20260807-1ea327.
    results: >-
      The program has an existing degree-of-regularity lane (RQ-DREG-001,
      KN-OPEN-002, EXP-DREG family, KN-FIND-006 which records a Macaulay-rank
      shortfall against the Bardet-Faugere-Salvy semi-regular prediction) and
      KN-TECH-011 records the semi-regular formula and its limits. What is
      ABSENT is any comparison of solving degree ACROSS ENCODINGS of the same
      decomposition problem, and specifically the ENC-AUX encoding
      (auxiliary invariant variables u_i = x_i^r with a degree-m' membership
      polynomial), which appears nowhere. Externally, KN-LIT-004 exploits the
      S_m symmetry to shrink systems and reports an exponential factor
      2^{omega(n-1)} in the extension-field setting; that is the closest prior
      art and it concerns a different group and a different field regime.
    verdict: >-
      ADAPTATION. Comparing solving degrees across encodings is standard
      practice in polynomial-system cryptanalysis and nothing about the method
      is claimed as new. ENC-AUX is a natural encoding that this repository does
      not contain, and the arity-growth framing of claim (A) -- that everything
      else in L4 is a constant and only D(m) is an exponent -- is not written
      down anywhere in this corpus. NO EXTERNAL NOVELTY IS CLAIMED; a full read
      of KN-LIT-004 and of the Bardet-Faugere-Salvy source is a Stage-0
      obligation.

  null_object_control: >-
    MANDATORY AND BLOCKING, FOUR LAYERS.
    NULL-1, THE r = 1 DEGENERATION: on a generic curve, u = x^1 = x, so ENC-SYM
    and ENC-AUX both collapse toward ENC-X (ENC-AUX retains its auxiliary
    variables but they become u_i = x_i, i.e. trivially eliminable). The
    measured degrees must coincide, and the residual spread IS the instrument's
    noise band. Every cross-encoding claim must exceed that measured band.
    NULL-2, THE FAKE-INVARIANT CURVE: apply the formal substitution u = x^3 on a
    curve with a != 0, where no automorphism exists. If the encodings behave the
    same there, the degree behaviour belongs to the substitution and not to the
    endomorphism.
    NULL-3, THE SIZE-MATCHED RANDOM BASE at |V| = r m' in every encoding.
    NULL-4, THE SEMI-REGULAR PREDICTION as a MODEL null: if measured degrees
    match the Hilbert-series prediction in all three encodings, then the
    encodings differ exactly as their degree sequences say and there is no
    structural surprise -- a controlled null, and the pre-registered expectation.
    DECAY PARAMETER: r, run downward to 1, where the effect must vanish
    identically because the encodings become the same system. Secondarily,
    epsilon (orbit-breaking at fixed |V|), under which the invariant encodings
    become ill-posed and the required decay is measured on ENC-AUX's solvable
    fraction.

  assumptions:
    - >-
      p = 1 mod 3 (r = 3) or p = 1 mod 4 (r = 2), a = 0 or b = 0 respectively,
      verified per instance.
    - >-
      N prime, so claim (E)'s relation arithmetic holds.
    - >-
      The solver's reported maximum reduced-basis total degree is a usable proxy
      for the solving degree. IT IS IMPLEMENTATION-BOUND (KN-TECH-004,
      harness/semaev.py honesty note): sympy uses a Buchberger/F5-style routine,
      not an optimized F4. Only within-solver cross-encoding trends are
      interpreted.
    - >-
      Toy scale: m in {2, 3} and possibly 4, p up to about 20 bits, pure Python.
      NO CRYPTO-SCALE VALIDATION IS POSSIBLE HERE AND NONE IS CLAIMED -- see the
      heuristic validation plans, which state this limitation explicitly rather
      than gesturing at a correspondence trick that does not exist for this
      quantity.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the declared toy family and solver, the measured solving degree of
        encoding E at arity m is a function D_E(m), and the comparative
        hypothesis is that D_ENC-AUX(m) - D_ENC-X(m) is bounded in m (BRANCH
        CONST) rather than that D_ENC-AUX(m) / D_ENC-X(m) tends to a constant
        strictly below 1 (BRANCH RATE).
      rigorous_support: >-
        The rigorous half is the Bardet-Faugere-Salvy degree of regularity for
        SEMI-REGULAR sequences (KN-TECH-011, KN-LIT-029): for a system of n
        variables with degree sequence (d_1, ..., d_k), the degree of regularity
        is the index of the first non-positive coefficient of
        prod_i (1 - t^{d_i}) / (1 - t)^n. That formula is exact for semi-regular
        sequences and computable symbolically at any m for all three encodings.
        The classical distribution statement it imitates: "these systems behave
        like a RANDOM system with the same degree sequence and variable count",
        which is the standard genericity heuristic in polynomial-system
        cryptanalysis and is precisely what KN-TECH-011 flags as questionable
        for Semaev systems.
      validation_plan: >-
        SAMPLE: the measured solving degree at every feasible (E, m, instance)
        cell, at least 3 instances and 20 targets per cell. SHORTCUT TO LARGER
        SCALE: NONE EXISTS FOR THIS QUANTITY, and that is stated rather than
        finessed -- there is no analogue here of the Deuring correspondence that
        lets isogeny heuristics be sampled at cryptographic size, because the
        solving degree can only be obtained by running the solver. COMPARISON
        DISTRIBUTION: the semi-regular prediction computed from each encoding's
        degree sequence, which IS available at any m for free and which supplies
        the null curve the measurements are read against. TAIL CHECK: the
        largest single-cell deviation between measurement and prediction, and
        whether deviations are systematically signed per encoding (a systematic
        sign is the structural finding; scattered deviations are noise).
        SCALE LABEL: TOY-SCALE VALIDATION ONLY. Nothing measured here validates
        H1 at cryptographic parameters and no record may present it as doing so.
    - id: H2
      statement: >-
        The first-fall degree d_ff tracks the degree of regularity d_reg for
        these three encodings, so that the cheaper d_ff proxy may stand in for
        the expensive one in the arity comparison.
      rigorous_support: >-
        d_ff <= d_reg holds by definition of the first degree fall, giving a
        rigorous one-sided bound. The heuristic is the reverse inequality up to
        a constant, which is the standard assumption in the ECDLP
        polynomial-system literature (KN-TECH-004) and which KN-OPEN-002 records
        as OPEN over prime fields -- so this assumption is explicitly one the
        program has already flagged as unsettled, and it is named here rather
        than used silently.
      validation_plan: >-
        SAMPLE: measure both d_ff and the maximum-reduced-basis-degree proxy on
        every cell where both are obtainable, at m = 2 and m = 3, across at
        least 3 instances. COMPARISON: the per-cell difference d_reg-proxy minus
        d_ff, tabulated per encoding. TAIL CHECK: the maximum observed gap and
        whether it grows with m. FAILURE HANDLING: if the gap grows with m in
        ANY encoding, d_ff may not be used for the arity comparison in that
        encoding and the comparison must be run on the expensive proxy only,
        with the reduced arity range that implies. SCALE LABEL: toy only; this
        does not resolve KN-OPEN-002 and must not be cited as doing so.
    - id: H3
      statement: >-
        Trading generator degree for variable count is cost-neutral to
        first order, so ENC-AUX's doubling of the variable count from m to 2m
        offsets its reduction of the membership degree from r m' to m', leaving
        the solving degree unchanged.
      rigorous_support: >-
        The rigorous anchor is that the semi-regular prediction depends on the
        pair (degree sequence, variable count) jointly, so the trade is
        computable exactly under the genericity heuristic -- H3 is precisely the
        statement that the computed prediction for ENC-AUX equals that for
        ENC-X. The distribution statement it imitates is again "random system of
        the same shape". H3 IS THE ASSUMPTION MOST LIKELY TO BE FALSE, because
        the auxiliary equations u_i - x_i^r are pure binomials and binomial
        subsystems are famously non-generic.
      validation_plan: >-
        SAMPLE: compute the semi-regular prediction for ENC-X and ENC-AUX
        symbolically at m = 2..8 (free), then measure both at m = 2, 3 and
        compare. If the measured ENC-AUX degree falls BELOW its own semi-regular
        prediction while ENC-X matches its own, the binomial structure is
        supplying a degree fall the genericity model does not see -- which is the
        single most interesting outcome available in this record and is exactly
        the deviation KN-TECH-011 says is itself a finding. TAIL CHECK: whether
        the deviation grows with m over the two or three measurable points,
        reported as a difference and never fitted as a rate. SCALE LABEL: toy
        only.

  proof_search_map:
    bottleneck: >-
      The solving degree D at arity 3 for each encoding. That single number
      determines whether an arity-3 cell is computable at all in this harness,
      and by claim (A) it is the quantity through which the method's exponent
      would move. Everything else in the record is instrumentation around it.
    baseline_embedding:
      parameter_slice: >-
        r = 1 and m = 2. There all three encodings reduce to the incumbent
        ENC-X: T_2 = S_3, g = f_V, and ENC-AUX's auxiliary equations become
        u_i = x_i, which any solver eliminates immediately. The claimed family
        contains the incumbent as an exact slice.
      reproduction_check: >-
        TWO fixtures, both hard gates. (i) Symbolic: at r = 1 the constructed
        T_2 must equal S_3 coefficientwise and ENC-AUX must reduce to ENC-X
        after eliminating u. (ii) Frozen regression against the program's own
        DREG lane: this record's ENC-X meter must reproduce the recorded
        solving-degree value on a shared RQ-DREG-001 instance exactly. Fixture
        (ii) is the one that makes the numbers comparable with existing ledger
        records and it must pass before any new number is reported.
    observation_collision:
      observable: >-
        The integer D_E(m).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why NULL-4 is blocking: find
        two encodings with the same D at the same m. Under BRANCH CONST that is
        the expected outcome and it CALIBRATES rather than falsifies -- it
        establishes that D at this scale is a function of the degree sequence
        and variable count alone, bounding what any conclusion may say. The
        collision that would be informative in the other direction is two
        encodings with the SAME semi-regular prediction and DIFFERENT measured D
        -- which would isolate a structural effect invisible to the degree
        bookkeeping, and ENC-AUX versus a degree-matched random system is the
        specific pair to test for it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the factor-base membership constraint from a degree-(r m')
          condition on x to a degree-m' condition on an auxiliary invariant u,
          paying m extra variables and m extra binomial equations (ENC-AUX).
          Encoding obligation: u_i - x_i^r = 0 is exact. Completeness: every
          solution of ENC-X lifts uniquely. Soundness: every ENC-AUX solution
          projects to an ENC-X solution and is certificate-checked. Transfer: the
          recovered relation is one equation over the m' reduced unknowns.
          Cost loss: 2m variables instead of m, and the binomial subsystem's
          non-genericity, which cuts both ways.
        predicted_gain: >-
          The maximum generator degree falls from max(2^{m-1}, r m') to
          max(2^{m-1}, r, m'). Whether that moves D is the measurement; H3 says
          it does not and H3 is flagged as the most likely assumption to fail.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full Hilbert-series coefficient sequence of each encoding
          rather than only its first non-positive index, so that the comparison
          is between curves rather than between two integers.
        predicted_gain: >-
          Far more resolution at the same cost (the series is free to compute),
          and it makes a systematic per-encoding deviation visible at m = 2
          where a single integer cannot separate it from noise.
    quantifier_order: >-
      Stated carefully because this is where an exponent claim would be made or
      lost.
      BRANCH RATE would assert: THERE EXISTS an encoding E and a constant c < 1
      such that FOR ALL m in the declared range, D_E(m) <= c * D_ENC-X(m).
      THE DANGEROUS WEAKER READING, EXPLICITLY NOT CLAIMED: FOR ALL m THERE
      EXISTS an encoding beating ENC-X at that m -- which allows the winning
      encoding to depend on m and supports no asymptotic statement whatsoever.
      A further audit obligation: even the strong form over m in {2, 3} is NOT
      an asymptotic statement, and the record must never write "the growth rate
      is lower" on the basis of two points. The strongest honest phrasing
      available from this experiment is "BRANCH RATE is not refuted at the
      measurable arities", and that phrasing is pre-registered here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m in {2, 3} on these toy curves with this solver, encoding E's
        measured solving degree is D_E(m), and the ENC-X / E differences are
        these integers, against these semi-regular predictions." It can NEVER
        certify an asymptotic growth rate, an exponent change, anything about an
        optimized F4/F5, anything at crypto scale, or anything about the ECDLP.
        Even BRANCH RATE, if not refuted, licenses only a follow-on conditional
        record with its own heuristics and cost table.
      nearby_object_control: >-
        A random polynomial system matched to ENC-AUX on variable count, degree
        sequence and support size but with no binomial structure and no
        summation-polynomial structure. If ENC-AUX's measured degree equals that
        system's, the encoding is doing nothing structural and the number
        measures shape. This is the closest object where the hoped-for
        conclusion must fail.
    proof_obligations:
      - claim: the three encodings have the stated degree sequences.
        responsibility: size
      - claim: ENC-AUX solutions project bijectively onto ENC-X solutions.
        responsibility: correctness
      - claim: at r = 1 all three encodings coincide.
        responsibility: baseline
      - claim: this record's ENC-X meter reproduces the DREG lane's value.
        responsibility: baseline
      - claim: the semi-regular prediction is computed correctly.
        responsibility: correctness
      - claim: d_ff <= the reduced-basis degree proxy in every cell.
        responsibility: correctness
      - claim: two or three arities do not determine a growth rate.
        responsibility: scope

  predictions:
    - metric: >-
        maximum generator degree of each encoding at m = 2, 3 (r = 3, m' the
        orbit count)
      direction: different
      minimum_effect: >-
        Exactly max(2^{m-1}, 3 m') for ENC-X, max(6^{m-1}, m') for ENC-SYM, and
        max(2^{m-1}, 3, m') for ENC-AUX. Arithmetic predictions with zero
        tolerance; a deviation falsifies the encoding construction cheaply.
    - metric: >-
        measured solving degree, ENC-AUX minus ENC-X, at m = 2 and m = 3
      direction: different
      minimum_effect: >-
        BRANCH CONST is recorded if the difference is the same integer at both
        arities (or differs by at most 1). BRANCH RATE is NOT REFUTED only if
        the difference grows by at least 2 between m = 2 and m = 3 in ENC-AUX's
        favour AND that growth exceeds the r = 1 noise band. The pre-registered
        expectation is BRANCH CONST.
    - metric: >-
        measured solving degree minus semi-regular prediction, per encoding
      direction: different
      minimum_effect: >-
        Predicted small and unsigned for ENC-X and ENC-SYM. FOR ENC-AUX A
        SYSTEMATIC NEGATIVE DEVIATION OF AT LEAST 2 IS THE INTERESTING OUTCOME
        (H3 failing in the useful direction: the binomial subsystem supplies a
        degree fall the genericity model does not predict). A systematic
        POSITIVE deviation for ENC-AUX means the extra variables cost more than
        the degree reduction saves, which refutes the encoding.
    - metric: >-
        r = 1 degeneration: solving degrees of the three encodings on a generic
        curve
      direction: different
      minimum_effect: >-
        Identical. Any spread is the instrument noise band and every other claim
        must exceed it. A large spread is an instrument defect and blocks the
        record.
    - metric: >-
        d_ff against the reduced-basis degree proxy, per cell
      direction: different
      minimum_effect: >-
        Gap reported per cell; a gap GROWING with m in any encoding disqualifies
        d_ff as the arity-comparison metric for that encoding (H2's failure
        handling).
    - metric: >-
        highest arity at which each encoding is solvable within the memory
        budget
      direction: higher
      minimum_effect: >-
        Reported as three integers. Predicted ENC-SYM dies first (degree
        6^{m-1} = 36 at m = 3), ENC-X and ENC-AUX later. An infeasibility is
        recorded with its peak memory under AGENTS.md rule 5 and is not
        presented as a mathematical statement.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR, AND IT USES NO SOLVER AT ALL: STEP 4, the
      semi-regular prediction. Compute the Hilbert series
      prod_i (1 - t^{d_i}) / (1 - t)^n for all three encodings at m = 2..8 from
      their degree sequences. This is symbolic, costs seconds, and yields the
      predicted degree curves for every arity including ones no solver can
      reach. IF THE PREDICTIONS FOR ENC-AUX AND ENC-X COINCIDE AT EVERY m, then
      BRANCH RATE is unsupported by the only model available at large m, and the
      remaining question is narrowed to whether the measured degrees deviate
      from the model -- which is a much smaller and cheaper question than the
      one this record started with.
      THEN, the consistency gate (STEP 2) against the existing DREG lane.
      THEN, hours: measure all three encodings at m = 2 on 3 instances and 20
      targets, plus the r = 1 noise floor and the fake-invariant null.
      THEN, as budget allows: m = 3, expecting ENC-SYM to be infeasible and
      recording its memory number when it is.
    controls:
      - r = 1 degeneration noise floor (blocking)
      - DREG-lane consistency gate on ENC-X (blocking)
      - fake-invariant curve (a != 0) with the formal substitution
      - size-matched random factor base in every encoding
      - >-
        degree-and-variable-matched random polynomial system as the shape null
        for ENC-AUX
      - semi-regular prediction computed for every cell before measurement
      - certificate re-verification of every claimed decomposition
      - identical solver, monomial order and modulus across encodings
    required_metrics:
      - degree sequence and variable count per encoding per arity
      - semi-regular predicted degree of regularity per cell
      - measured maximum reduced-basis total degree per cell
      - measured first-fall degree per cell where obtainable
      - measurement minus prediction, per cell, with its sign
      - Groebner wall time and peak memory per cell
      - highest feasible arity per encoding, with the memory number at failure
      - r = 1 noise band as a measured spread

  falsification_conditions:
    - >-
      A constructed encoding does not have its declared degree sequence. The
      construction is wrong; nothing is reported.
    - >-
      The DREG-lane consistency gate fails. The meters are not comparable and no
      cross-encoding number may be reported or compared with existing ledger
      records.
    - >-
      The r = 1 degeneration shows a spread between encodings. Instrument
      defect; the record is blocked.
    - >-
      The ENC-AUX minus ENC-X degree difference is the same at m = 2 and m = 3.
      BRANCH CONST FIRES: the phi-quotient acts on the constant, not on the
      degree; L4 is closed for exponent purposes with that named obstruction;
      and the forward guidance is that only a change to the summation polynomial
      itself, or a non-algebraic decomposition method, remains.
    - >-
      ENC-AUX's measured degree exceeds its semi-regular prediction
      systematically. The extra variables cost more than the degree reduction
      saves and the encoding is refuted.
    - >-
      Arity 3 is infeasible for every encoding. Then only m = 2 is measurable,
      no arity comparison is possible at all, and the record must say so plainly
      rather than reporting a one-point trend. This is a BUDGET outcome under
      AGENTS.md rule 5.

  confounders:
    - >-
      TWO POINTS ARE NOT A RATE. The single largest interpretive risk here, and
      it is forbidden in advance: with m in {2, 3} no growth rate is
      measurable, and the semi-regular curve at larger m is a MODEL, not data.
    - >-
      SOLVER NON-CANONICITY. D depends on solver and monomial order. All
      conclusions are within-solver; the composition with
      IDEA-20260806-e4f96e's solver-independent refutation degree is the fix and
      is named, not attempted.
    - >-
      BINOMIAL NON-GENERICITY. ENC-AUX's u_i - x_i^r equations are binomials,
      and binomial ideals are highly non-generic; the semi-regular prediction is
      least trustworthy exactly for the encoding whose behaviour matters most.
      This is why the shape null (a degree-and-variable-matched random system)
      is a required control rather than an optional one.
    - >-
      m' VERSUS m. The orbit count m' and the arity m are different parameters
      and both appear in the degree sequences. Conflating them produces wrong
      predictions; every table must carry both.
    - >-
      TARGET DEPENDENCE. The summation polynomial is specialised at x_R, so the
      system and its degree depend on the target. Degrees must be reported as
      distributions over at least 20 targets, not as single values.
    - >-
      ELIMINATION ORDER. ENC-AUX has a natural elimination order (eliminate u
      first, or x first) and the two can give very different degrees. Both must
      be run, or the encoding is credited or debited by an arbitrary choice.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IN EITHER DIRECTION; DEFER-BATCH009-001
      remains open and untouched. This record concerns relation collection's
      algebraic cost; H-STR-002 concerns the linear-algebra stage.
    - >-
      Toy tier, claim_tier toy, m in {2, 3}, p up to about 20 bits, one solver.
      NO ASYMPTOTIC STATEMENT IS SUPPORTED BY THE MEASUREMENTS, and the
      semi-regular extrapolation is a symbolic model whose applicability to
      Semaev systems KN-TECH-011 explicitly questions.
    - >-
      Even BRANCH RATE, if not refuted, is not an exponent claim. It would be a
      reason to open a conditional-complexity record with its own numbered
      heuristics, cost table and promotion gates -- which this record does not
      pre-empt and does not satisfy.
    - >-
      Scoped to curves with a rational automorphism acting nontrivially on the
      x-line: j = 0 or j = 1728, measure-zero families fixed by the isogeny
      class (T4), containing no standardized curve in this program's target set.
    - >-
      H2 is an OPEN question in this program (KN-OPEN-002) and nothing here
      resolves it; d_ff is used as a proxy only where the measured gap does not
      grow with m.
    - >-
      No crypto-scale validation route exists for the solving degree and none is
      implied. The validation plans in heuristic_assumptions say so explicitly
      rather than gesturing at a correspondence trick that does not exist for
      this quantity.

  reachability_gate: >-
    NOT APPLICABLE TO THE DESIGN: encodings are compared on one fixed curve per
    instance, with the null curves constructed rather than reached, so T5 does
    not bind and no reachability cost is paid. BINDING ON THE SCOPE via T4: the
    invariant encodings exist only on curves whose isogeny class has D_0 = -3 or
    -4, which cannot be reached from a class that lacks them at any cost. NOTE
    THE ASYMMETRY WORTH RECORDING: the ENC-X arm and the semi-regular
    predictions are NOT scope-limited to CM curves, so the part of this record
    that concerns how solving degree grows with arity for the standard system is
    of general prime-field interest, while only the comparative part is confined
    to the measure-zero families.

  target_complexity:
    time_exponent: >-
      THIS IS THE ONE RECORD IN THE LANE WHERE AN EXPONENT COULD MOVE, AND IT
      CLAIMS NO MOVE. The composed cost from claim (A) is
      (m!/r) * N^{1/m} * G(m, N^{1/m}) with G governed by D through roughly
      (m + D choose D)^omega. Under BRANCH CONST the exponent is exactly that of
      the incumbent and the quotient contributes the constant 1/r. Under BRANCH
      RATE the exponent would change, but the record explicitly cannot certify
      BRANCH RATE from two or three arities, so NO EXPONENT IS CLAIMED IN EITHER
      DIRECTION. For scale: the incumbent prime-field position is that this
      composed cost does not beat rho's N^{1/2} at any m (KN-LIT-006), and
      nothing here disputes that.
    memory_exponent: >-
      Macaulay-matrix memory at the reached degree, roughly (m + D choose D) --
      the binding constraint on the reachable arity and the quantity that
      determines each encoding's death point. Measured per cell and reported as
      the primary feasibility number. On the attack side, the relation matrix is
      Theta((B/r)^2 log N), untouched by this record.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) time and O(1)
      memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on these
      families at 0.886 sqrt(N)/sqrt(|Aut|) (KN-TECH-018); BSGS at sqrt(N) time
      and memory. For the decomposition step, the incumbents are the degree of
      regularity and first-fall degree measured on ENC-X in the program's own
      DREG lane (KN-TECH-004, KN-TECH-011, KN-OPEN-002, KN-FIND-006).
    hidden_overhead: >-
      The o(1) that would hide in any asymptotic statement here is the
      genericity assumption H1 -- the semi-regular model -- which
      KN-TECH-011 records as questionable for exactly these systems. That is not
      a small cofactor: if the model is wrong the extrapolation is worthless,
      and the record's design measures the deviation rather than assuming it
      away. Second disclosure: ENC-SYM's norm construction costs r^m resultant
      factors per target, which is charged and which alone may make it
      infeasible before its degree does.
    tradeoff_note: >-
      The arity m is the lane's real time-memory dial: larger m means fewer
      relations needed (N^{1/m}) and superlinearly more memory for the Macaulay
      matrix. The three encodings sit at different points of that frontier --
      ENC-SYM buys candidate reduction with degree, ENC-AUX buys degree
      reduction with variables, ENC-X buys neither -- and locating them is the
      record's structural contribution. Parallelization is unaffected: targets
      are independent in every encoding.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an attack: none
    is mounted, so dominated by parallel rho with distinguished points
    (0.886 sqrt(N) time, O(1) memory, KN-TECH-001/006), by the
    automorphism-discounted rho on these exact families
    (0.886 sqrt(N)/sqrt(|Aut|), O(1) memory, KN-TECH-018), and by BSGS (sqrt(N)
    time, sqrt(N) memory); and the method whose step it measures, prime-field
    point-decomposition index calculus, is itself dominated by all three
    (KN-TECH-003, KN-LIT-006). On data/queries no row is beaten. AS A
    MEASUREMENT the incumbents are the DREG lane's d_reg and d_ff meters on
    ENC-X (KN-TECH-004, KN-TECH-011); this record neither dominates nor is
    dominated by them, since it uses the same meters on two additional
    encodings -- it EXTENDS rather than competes, and it is dominated by
    IDEA-20260806-e4f96e's proposed polynomial-calculus degree on the axis of
    solver-independence, which is a real weakness and is recorded as one.
  sota_delta: >-
    Zero speedup against any attack baseline. The quantities delivered, stated
    numerically: three degree sequences with maximum generator degrees
    max(2^{m-1}, r m'), max((2r)^{m-1}, m') and max(2^{m-1}, r, m'); the
    semi-regular predicted degree of regularity for each at m = 2..8; measured
    degrees at m = 2 and 3 with their deviations from prediction; and a
    pre-registered two-branch verdict. Under the expected BRANCH CONST the
    sota_delta is exactly zero and the deliverable is a closure with the named
    obstruction "the automorphism quotient acts on the constant, not on the
    degree". Under BRANCH RATE the delta is still zero until a separate
    conditional record establishes it.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: low

  honest_prior_of_survival: >-
    0.85 that the degree sequences and semi-regular predictions come out as
    stated -- symbolic bookkeeping with low risk. 0.80 that m = 2 is measurable
    for all three encodings and 0.45 that m = 3 is measurable for ENC-X and
    ENC-AUX; near 0.10 that m = 3 is measurable for ENC-SYM at r = 3, whose
    generator degree is 36. 0.75 that BRANCH CONST fires, i.e. that the record's
    honest outcome is a closure. 0.08 THAT BRANCH RATE SURVIVES TO THE END OF
    THE EXPERIMENT, and that number is deliberately low and deliberately stated:
    the degree bookkeeping in claim (C) points the other way for ENC-SYM and is
    neutral for ENC-AUX, and the only positive reason to run it is
    KN-TECH-011's own warning that these systems are structured and that
    measured degrees deviate from Hilbert-series predictions. The record is
    filed at LOW priority on cost-adjusted grounds -- compute is high, the prior
    is 0.08 -- while noting that it is the ONLY item in lane L4 whose positive
    outcome would be exponent-relevant rather than constant-factor, which is why
    it is filed at all rather than dropped.

