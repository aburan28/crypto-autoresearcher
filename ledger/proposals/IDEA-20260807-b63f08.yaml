idea:
  id: IDEA-20260807-b63f08
  question_id: RQ-UOV-001
  added: '2026-08-07'
  title: Four Round-3 goals declare a shared plain-UOV accounting basis a PREREQUISITE, the KN-TECH
    entry does not exist, and three hypotheses have already each derived their own -- the exact
    divergence GOAL-UOV-001 warned against, now committed three times
  class: tooling
  claim: 'GOAL-UOV-001.next_action states the risk in its own words: MAYO, QR-UOV and SNOVA all
    consume the plain-UOV baseline, and ''three independently derived UOV cost conventions would
    make their Pareto comparisons meaningless''. GOAL-MAYO-001.next_action gates ideation on the
    matched plain-UOV baseline ''being written down as a KN-TECH entry''; GOAL-QRUOV-001.next_action
    repeats the gate and adds ''must not be re-derived twice with two different cost conventions''.
    RQ-UOV-001.motivation calls the plain-UOV cost model ''a shared dependency of four Round-3
    goals''. THE KN-TECH ENTRY DOES NOT EXIST: knowledge/techniques/ contains no multivariate
    or UOV costing entry at all -- KN-TECH-011 (Groebner/solving degree) and KN-TECH-053 (MQ/XL/crossbred)
    were both written for the ECDLP index-calculus thread and neither states what a UOV oil-space-recovery
    figure counts, at what rate, with what memory charge, or in what unit. Meanwhile H-UOV-4d1377,
    H-QRUOV-e8ae3e and H-SNOVA-ec84c2 each state in their own mechanism fields that their baselines
    were ''DERIVED IN-REPO'' this session with no source read. SECOND AND SEPARATELY: three proposals
    independently assert their scheme''s structural modification is exponent-neutral against a
    matched plain-UOV baseline (IDEA-20260805-258212 for whipping, IDEA-20260805-8d9ac0 for the
    quotient ring, IDEA-20260805-70aa6e for the matrix ring), each filed under its own RQ, and
    NONE CITES THE OTHER TWO. The conjunction -- that ONE calibration of plain UOV governs all
    four candidates and the three liftings are exponent-preserving changes of presentation --
    is stated nowhere as a single falsifiable object.'
  mechanism: 'Two joined deliverables. (i) A scheme-independent ''UOV-FC-2026'' ACCOUNTING BASIS:
    parameterless, no arithmetic, fixing for the whole family what an oil-space-recovery figure
    counts (field ops versus gates), the memory charge model and its exponent AS A DECLARED ROW
    rather than an assumption, whether key-expansion and seed-expansion preprocessing are charged,
    and the signature-query budget -- followed by a Coordinator decision that ADOPTS it, so the
    four goals'' Pareto rows become subtractable. The code-based half of this repository already
    built exactly this artifact (ISD-FC-2026) and the multivariate half never did. (ii) ONE FAMILY-LEVEL
    OBJECT: the oil-space-recovery Macaulay/rank profile of a public map, computed at matched
    (q, n, m) on four arms -- plain UOV, whipped (MAYO shape), quotient-ring (QR-UOV shape), matrix-ring
    (SNOVA shape) -- plus the MQOM-shaped null, with the three predicted exponent-neutrality identities
    PRE-REGISTERED as forced values that the arms either reproduce or falsify.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - knowledge/techniques/ contains no multivariate/UOV costing entry.
    - 'IDEA-20260801-014 is a MEASUREMENT scoped to RQ-UOV-001: it produces numbers at toy (q,v,m),
      not an accounting basis. A cost convention fixes what is counted so two goals'' figures
      can be subtracted; that is a different kind of artifact.'
    - IDEA-20260805-7d97be is the closest cross-scheme record but its tracked object is a ratio
      curve swept along ONE axis (oil-space dimension o = 0..o_max inside the plain-UOV shape,
      with o = 0 being the MQOM object). The whipped, quotient-ring and matrix-ring shapes are
      not arms of that sweep, so it tests structured-versus-random, not modification-versus-modification.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: attacking any single scheme.
      The object is the FAMILY and the convention that makes its rows comparable.'
    tracked_object: The oil-space-recovery Macaulay/rank profile of a public map, one profile
      per structural shape at matched (q, n, m).
    one_step_propagation_rule: Applying a structural lifting (whip, quotient, matrix ring) maps
      the profile by a predicted bookkeeping factor (k, ell, ell^2 respectively); the identities
      under test say exactly that.
    newness_score: The accounting basis is pure bookkeeping. The conjunction is a single conditional
      statement covering four NIST Round-3 candidates, which is the exponent-first cross-family
      shape docs/target-result-profile.md names.
  lossy_projection_identifiability_audit:
    projection: a public map -> its Macaulay/rank profile.
    what_is_discarded: The map's coefficients and its trapdoor.
    is_it_only_a_change_of_coordinates: 'NO -- many maps share a profile, which is what makes
      the cross-shape comparison meaningful. Honest caveat: the profile is a coarse invariant
      and can agree across shapes for reasons unrelated to attack cost, which is why the identities
      are pre-registered as forced values rather than fitted afterwards.'
    mirror_failure_check: 'CHECKED. The comparison must be able to fail: the three proposals each
      predict a SPECIFIC bookkeeping factor (k, ell, ell^2), so a profile differing by any other
      factor falsifies the conjunction immediately.'
  null_object_control:
    primary_null: THE MQOM-SHAPED ARM -- an unstructured random MQ map at matched (q, n, m). Every
      structured arm is reported as a deviation from it. If all four structured arms match the
      unstructured null, structure is invisible to this profile and the instrument says nothing.
    secondary_nulls:
    - 'PRE-REGISTRATION GATE: the three identities are committed before any arm is computed.'
    - 'FORCED VALUE: the plain-UOV arm must reproduce the published intersection-attack profile
      at its own parameters.'
  assumptions: []
  predictions:
  - metric: ratio of each structured arm's profile to the plain-UOV arm at matched (q, n, m)
    direction: different
    minimum_effect: Any deviation from the pre-registered k, ell or ell^2 factor outside tolerance
      falsifies the conjunction for that scheme.
  minimal_test:
    design: Write UOV-FC-2026; then compute the profile on five arms (plain, whipped, quotient-ring,
      matrix-ring, unstructured MQOM null) at two matched (q, n, m) settings, with the three identities
      pre-registered.
    controls:
    - unstructured MQOM-shaped null
    - pre-registration gate
    - published-profile forced value on the plain arm
    required_metrics:
    - profile per arm per setting
    - ratio to plain UOV
    - agreement with each pre-registered identity
    - the adopted accounting basis document itself
  falsification_conditions:
  - 'All three identities hold: one conditional statement covers four Round-3 candidates and is
    stated on numbered heuristics -- the target output shape.'
  - 'One arm disagrees: the conjunction is killed cheaply, which is the point of stating it as
    one object, and that scheme''s structural lifting is NOT exponent-neutral.'
  - 'Every arm matches the unstructured null: the profile is not a discriminating instrument and
    nothing may be concluded from it.'
  confounders:
  - Matching (q, n, m) across four different public-key shapes requires a stated correspondence;
    get it wrong and every ratio is meaningless.
  - Macaulay profiles depend on the monomial order and the degree bound; pin both.
  - Toy (q, n, m) may not exhibit the structure that appears at real parameters.
  interpretation_limits:
  - Toy scale. No claim about any scheme's Round-3 security level.
  - An accounting basis is adopted by a Coordinator decision; this record proposes it and does
    not adopt it (AGENTS.md rule 1).
  heuristic_assumptions:
  - id: HEUR-UOVFC-1
    statement: The Macaulay/rank profile at toy (q, n, m) is a faithful proxy for oil-space-recovery
      cost ordering across the four shapes.
    rigorous_support: None; the three source proposals derive identities but none measures the
      profile.
    validation_plan: The unstructured null and the published-profile forced value together bound
      how much faith the proxy can carry; report both.
  target_complexity:
    time_exponent: The conjunction PREDICTS no exponent movement across the four shapes; the test
      is whether that holds.
    memory_exponent: Declared as a row in the accounting basis rather than assumed -- which is
      the basis's main purpose.
    best_known: Published intersection-attack complexity at plain-UOV parameters.
    hidden_overhead: Key-expansion and seed-expansion preprocessing, currently charged differently
      by different records.
    tradeoff_note: Three private bookkeepings make any margin claim an artifact of the bookkeeping;
      that is the defect being fixed.
  dominated_by: 'No attack proposed; the published intersection attack dominates the plain-UOV
    row. Rows checked: intersection attack, Kipnis-Shamir, direct/Groebner, and the reconciliation
    attack, each at plain-UOV Round-3 parameters.'
  sota_delta: ZERO on attack axes. Unblocks the declared next_action of THREE goals simultaneously
    and makes any later MAYO / QR-UOV / SNOVA-versus-UOV margin claim admissible instead of an
    artifact of three private bookkeepings.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the accounting basis is writable -- ISD-FC-2026 shows the
    shape. 0.5 that a Coordinator decision adopts it, which is the step ISD-FC-2026 never got
    and the reason it is still `proposed`. 0.6 that all three identities hold on the arms. 0.3
    that at least one fails, which would be the more interesting outcome.
