  heuristic_assumptions:
    - id: H1
      statement: >-
        For p a fixed odd prime and x drawn uniformly from F_p, the twist
        indicator chi(f(x)) takes the value +1 with probability
        N_plus/p = 1/2 - (t + r)/(2p) and the value -1 with probability
        N_minus/p = 1/2 + (t - r)/(2p), where t is the trace and
        r = 2 + chi(A^2 - 4); consequently the empirical indicator frequency over
        M uniform samples is an unbiased estimator of N_plus/p with standard
        error at most 1/(2*sqrt(M)), and no sample of size below Theta(p)
        distinguishes the true value from 1/2.
      rigorous_support: >-
        RIGOROUS THROUGHOUT, and recorded as an assumption only because it is the
        modelling step that turns a counting identity into a statement about an
        experiment. The two probabilities are the exact counting identity C3
        divided by p, with N_plus + N_minus + r = p and N_plus - N_minus = -t, so
        nothing is approximated. The Hasse bound |t| at most 2*sqrt(p) is a
        theorem. The sampling standard error 1/(2*sqrt(M)) is the exact binomial
        standard deviation for a Bernoulli parameter near 1/2. The only modelling
        content is that the executor's pseudorandom x are uniform on F_p, which is
        a property of the random number generator and not of the mathematics. THE
        ASSUMPTION IS THEREFORE ABOUT THE INSTRUMENT, NOT ABOUT THE CURVE.
      validation_plan: >-
        SAMPLING - 10^6 uniform x per 383-bit curve, seeds recorded; plus the
        exhaustive census at toy primes near 2^10 to 2^12 where the EXACT counts
        N_plus, N_minus and r are computed over the whole of F_p rather than
        sampled. COMPARISON DISTRIBUTION - the empirical frequency against 1/2 by
        an exact binomial test at 3 sigma, and separately the exhaustive toy
        counts against C3's exact prediction, where agreement must be EXACT and
        not statistical. AN ADDITIONAL EXACT CHECK IS NOW AVAILABLE AT FULL SIZE -
        with the mirror's cofactor 2^3 and its published prime subgroup order,
        C3 predicts N_plus = 4*l - 1 exactly for both 383-bit rows, so the toy
        identity has a cryptographic-size instance whose value is pinned even
        though N_plus itself cannot be counted there. SCALE RECORDED - the toy
        primes, the population sizes and the seeds. TAIL CHECK - the scaling study
        of the density deviation against p over ten octaves, whose fitted exponent
        must be near -1/2. TRANSFER - the exact identity is validated exhaustively
        at 10 to 12 bits and used at 383 bits only through its rigorous
        consequence C4.
    - id: H2
      statement: >-
        A ladder implementation whose output agrees with an affine reference on
        100 percent of the ENTIRE input space at 10 to 12 bits, and whose
        conservation oracle is silent on 10^6 random inputs at 383 bits, is
        correct at 383 bits; formally, it has no size-dependent failure mode -
        overflow, reduction, exceptional-branch, or constant-representation -
        that first appears above 12 bits.
      rigorous_support: >-
        NONE as a mathematical statement, and the record says so plainly. Same
        shape as heuristic H2 of IDEA-20260829-d052e6 and the archived plan's H4.
        TWO MITIGATIONS, stated as mitigation and not as support. FIRST, this
        record has a FULL-SIZE CORRECTNESS ORACLE that fires without any reference
        implementation, namely the conservation law C2, checkable at 383 bits on
        arbitrarily many inputs at one Legendre symbol each. SECOND, the mirror
        supplies a full-size pinned value for the 2-torsion count - exactly 1
        point of order 2 on both rows - so the ladder's degenerate stratum has a
        published expected size at cryptographic scale, which no toy census can
        provide.
      validation_plan: >-
        Six checks, none of which discharges the assumption. (i) Exhaustive
        input-space agreement at 10 to 12 bits. (ii) THE FULL-SIZE CONSERVATION
        ORACLE over 10^6 inputs per curve. (iii) The n = 2 fixture against
        IDEA-20260829-d052e6's independently derived doubling map at 383 bits.
        (iv) The degenerate stratum at 383 bits against the mirror's published
        count of 1 point of order 2. (v) The corrupted-variant positive controls,
        which measure the oracle's detection latency rather than assuming it.
        (vi) THE MATCHED-PAIR CONSISTENCY CHECK - a defect appearing on exactly
        one of two curves over the identical prime is localised to the
        coefficient-dependent code path, which no single-curve run can do, and a
        defect appearing on both is localised to the field arithmetic.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, AND ONE IMPOSSIBILITY EXPONENT IS. C1 costs
      one integer division. C2's oracle costs ONE Legendre symbol per invocation,
      that is O(log p) modular squarings or O(log^3 p) bit operations with
      schoolbook arithmetic, against a full ladder of O(log p) group steps each
      costing several field multiplications - so the oracle is a small constant
      fraction of the computation it audits. C3 costs nothing at 383 bits and
      O(p) at toy scale. C4 IS THE EXPONENT STATEMENT - density sampling needs
      Theta(p) samples, against Shanks-Mestre order finding at p^{1/4 + o(1)} and
      Pollard rho for the discrete logarithm at 0.886*sqrt(N); the sampling route
      is WORSE THAN BOTH by a full exponent and is closed on those grounds, not
      on grounds of effort.
    memory_exponent: >-
      O(log p) everywhere at 383 bits; O(p) time and O(1) memory per curve for
      the toy exhaustive census. The 48 GB envelope is not binding. The census
      over the input space (A, x, n) is O(p^3) at toy scale, which is why the
      exhaustive stage is capped near 2^{10} to 2^{12} and why the cap is stated
      rather than implied.
    best_known: >-
      For LADDER INTEGRITY, the incumbent is full point validation - check that
      the recovered point satisfies the curve equation - which KN-TECH-034
      records as a two-sided obligation and which requires the y-coordinate. The
      conservation oracle is x-only and therefore applies where full validation
      cannot, which is exactly the x-only setting the criterion is about; the two
      are Pareto-incomparable. For LADDER COMPLETENESS, the incumbent is
      Bernstein and Lange's retrieved 2017 proof, which strictly dominates any
      census on generality; this record claims nothing there. For the CRITERION
      CELLS AND TORSION COUNTS, the incumbent is now reading
      inputs/SAFECURVES-20260825/tables/{ladder,complete}.tsv, which strictly
      dominates on cost and which this record uses rather than duplicates. For
      MEASURED LADDER COST, no incumbent was identified inside or outside this
      program for these curves - the mirror publishes verdicts, not costs.
      Against the ECDLP attack frontier - KN-TECH-001, KN-TECH-006, KN-TECH-018,
      KN-TECH-031, KN-TECH-032, KN-TECH-033, KN-TECH-035 - this record is
      dominated by every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Three honest hidden costs. (i) The
      throughput result measures an implementation and may vanish in a backend
      whose multiplication cost is interpreter-dominated - which is why a counted
      field-multiplication metric is required alongside the wall clock. (ii)
      Exhaustiveness is available only at 10 to 12 bits, so "all inputs" is a
      toy-scoped phrase throughout. (iii) The conservation oracle detects an
      off-curve excursion with probability about 1/2 per invocation and therefore
      never certifies absence from a single call; the number of invocations is
      part of every integrity statement.
    tradeoff_note: >-
      The tradeoff is DETECTION PROBABILITY AGAINST COST and it is unusually
      cheap - one Legendre symbol buys about one bit of integrity evidence per
      invocation, so k symbols buy 1 - 2^{-k}, and twenty symbols cost about
      twenty modular exponentiations for a detection probability above
      1 - 10^{-6}. There is no time-memory tradeoff. Parallelisation is
      irrelevant at 383 bits and embarrassingly parallel for the toy census
      across the 14 cores, which is the only nontrivial compute in the proposal.
      One further tradeoff is stated because it is the design's real cost - the
      matched-pair control is unrepeatable, so the design buys attribution at the
      price of applying to exactly one pair in twenty curves.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row simultaneously on time,
    memory and data because it is not an attack - rho (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035),
    MOV and Frey-Ruck (KN-TECH-032), the trace-one transfer (KN-TECH-033). AS A
    STATEMENT ABOUT LADDER COMPLETENESS it is STRICTLY DOMINATED by Bernstein and
    Lange's retrieved 2017 full proof, which covers all inputs rather than an
    enumerable toy subset; conceded without qualification. AS A SOURCE OF THE
    CRITERION CELLS, THE TORSION COUNTS AND THE GENERATION RECIPES it is
    STRICTLY DOMINATED by reading inputs/SAFECURVES-20260825/tables/*.tsv, which
    is in this repository and costs one file read; this record consumes that
    source rather than competing with it. AS A TRACE-EXTRACTION METHOD, C4's
    sampling route at Theta(p) is dominated by Shanks-Mestre at p^{1/4 + o(1)},
    by SEA at soft-O(log^4 p), and by IDEA-20260829-fa8d4e's residues at
    O(q^2 log p) - dominated by all three by a full exponent, which is the point
    of stating C4 as a closure. AS A LADDER INTEGRITY ORACLE it is NOT dominated -
    full point validation needs the y-coordinate and is unavailable in the x-only
    setting where the twist attack lives, so the two are Pareto-incomparable on
    the information-versus-applicability plane. AS A MEASURED COST SEPARATION
    BETWEEN TWO CURVES THE PUBLISHED TABLE RATES IDENTICALLY it is not dominated,
    because no incumbent producing that number was found and the mirror does not
    contain it. Both non-dominations are narrow and are stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. THE DELTA AS DATA HAS
    SHRUNK AND IS RESTATED HONESTLY - the criterion cells, torsion counts,
    cofactors, costs and generation recipes are now available in-repository, so
    this record no longer creates them and instead consumes them. QUANTITATIVELY
    AS MEASUREMENT - the repository holds ZERO ladder implementations, ZERO
    measured curve costs, ZERO exceptional-case enumerations and ZERO indicator
    measurements, and the mirror holds none either; this record would produce a
    paired 383-bit cost table over a shared prime, an enumerated degenerate
    stratum of predicted size exactly 2, a measured conservation rate over 10^6
    inputs per curve, a measured twist-blindness rate, and detection latencies for
    five injected defects. QUANTITATIVELY AS SEPARATION - the mirror rates M-383
    and Curve383187 IDENTICALLY in ladder, complete, rho and twist, four columns
    and seven cells; this record predicts a measurable 5 to 15 percent
    ladder-throughput separation between them with a mechanism-isolating control
    and a published cause in tables/rigid.tsv. That is information the best
    available table does not contain, and it is the record's clearest
    quantitative case. QUANTITATIVELY AS PRECISION - KN-TECH-034's twist-attack
    row moves from a qualitative statement to a measured wrong-group rate near
    0.5 with a 10^3-sample confidence interval. QUANTITATIVELY AS CLOSURE - C4
    replaces "sampling the Kummer line might reveal the trace" with a named
    obstruction of measured size below 2^{-191.5} in density at 383 bits, a
    Theta(p) sample-complexity lower bound for that estimator class, and forward
    guidance naming the three classes that remain open.
  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is an x-only ladder, an affine reference, a Legendre oracle
      and a timing harness - a few hundred lines, no external dependency. The
      real cost is the disciplined timing protocol, not the code. Compute is
      minutes for the toy exhaustive census on 14 cores and seconds for every
      383-bit run; the input-space census is capped at 2^{12} because it is cubic.
  recommended_priority: medium

