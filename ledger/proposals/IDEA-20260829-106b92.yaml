  question_id: RQ-SCURVE-b10b2c
  goal_id: GOAL-SCURVE-31fc17
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE MATCHED-PAIR SEPARATION INSTRUMENT - Curve383187 and M-383 are two
    DIFFERENT Montgomery curves over the IDENTICAL prime 2^383 - 187 whose
    published SafeCurves ladder, completeness, rho and twist columns are
    IDENTICAL cell for cell, so any measured difference is information the table
    does not contain; establish that the twist indicator chi(f(x)) is a CONSERVED
    QUANTITY of x-only ladder arithmetic and turn it into a one-Legendre-symbol
    integrity oracle; and prove that sampling the Kummer line CANNOT see the
    trace, needing Theta(p) samples where Shanks-Mestre needs p^{1/4}
  class: measurement

  claim: >-
    The twenty-row family contains exactly one pair of distinct curves over the
    SAME prime - M-383 with A = 2065150 and Curve383187 with A = 229969, both
    over p = 2^383 - 187, confirmed by direct read of the in-repository
    SafeCurves mirror's tables/field.tsv and tables/equation.tsv. That
    coincidence is a controlled experiment nobody in this program has run,
    because every quantity depending only on p is held exactly fixed while the
    coefficient varies. THE MIRROR MAKES THE DESIGN SHARPER, NOT REDUNDANT - it
    gives the two rows IDENTICAL cells in tables/ladder.tsv (Montgomery ladder
    True, cofactor 2^3), IDENTICAL cells in tables/complete.tsv (complete
    single-scalar and multi-scalar formulas True, 1 point of order 2, 2 points of
    order 4), IDENTICAL published costs in tables/rho.tsv (2^189.8) and
    tables/twist.tsv (combined attack 2^188.3, twist rho 2^190.3, cofactor 2^3,
    twist cofactor 2^2). THE PUBLISHED TABLE CANNOT TELL THESE TWO CURVES APART
    ON ANY LADDER-RELEVANT AXIS. Five sub-claims, each independently falsifiable.

    (C1) RIGOROUS, ZERO COMPUTE, AND IT IS A CURVE PROPERTY THE TABLE DOES NOT
    RECORD. The Montgomery ladder's doubling step uses a constant a24 which the
    curve's own designers write as (A - 2)/4 - the mirror's tables/rigid.tsv
    records for Curve25519 that "(A-2)/4 selected as a small integer for
    efficiency ('to speed up the multiplication by (A-2)/4')", and for M-511 that
    "(A - 2)/4 is as small as possible for A > 2". For A congruent to 2 modulo 4
    both (A - 2)/4 and (A + 2)/4 are integers and the argument is the same for
    either convention.
    M-383: A - 2 = 2065148 = 4 * 516287 EXACTLY, so a24 is the INTEGER 516287,
    below 2^20.
    Curve383187: A - 2 = 229967, which is ODD and hence NOT divisible by 4, so
    a24 is the full-width field element 229967 * inverse(4) modulo p, a generic
    383-bit value with no small representation.
    The same division gives 29262 for M-221 (A = 117050), 132609 for M-511
    (A = 530438) and 121665 for Curve25519 (A = 486662), all small integers - so
    CURVE383187 IS THE UNIQUE MONTGOMERY ROW OF THE FAMILY WITHOUT A SMALL LADDER
    CONSTANT, and the unique one whose A is odd. Verifiable by hand in one
    division. This is a parameter-level cost fact, not a security fact, and it is
    exactly the kind of "measurable cost change" the question asks for.

    (C1b) THE MIRROR EXPLAINS WHY, AND THE EXPLANATION IS PUBLISHED. From
    tables/rigid.tsv, read at the TSV tier with empty cells preserved:
    Curve383187 carries "p is largest prime smaller than 2^383; B=1; A > 2 is as
    small as possible." M-511 carries "p = 5 (mod 8) is largest prime smaller
    than 2^511; B=1; (A - 2)/4 is as small as possible for A > 2; A^2 - 4 is not
    a square; curve order is n = 8r and quadratic twist order is n' = 4r'."
    M-221 carries "p is largest prime smaller than 2^221; B=1; A > 2 is as small
    as possible." AND M-383's COMMENTS CELL IS EMPTY - which is precisely
    MIRROR-DEF-1's confirmed defect instance, so no recipe is attributed to
    M-383 anywhere in this record. TWO DIFFERENT PUBLISHED RULES ARE THEREFORE IN
    PLAY OVER THE SAME PRIME - one minimises A itself, which permits odd A and
    produces 229969 with no small a24; the other minimises (A - 2)/4, which
    forces A congruent to 2 modulo 4 and produces a small a24 by construction.
    C1's asymmetry is thus not a coincidence but the visible consequence of a
    documented design divergence, and the record's earlier inference that the two
    curves came from different rules is now SOURCED rather than derived.

    (C2) RIGOROUS. THE TWIST INDICATOR IS A CONSERVED QUANTITY OF X-ONLY
    ARITHMETIC. Let f(x) = x^3 + A x^2 + x and let chi be the Legendre symbol
    modulo p. For x in F_p with f(x) nonzero, x is the x-coordinate of a point of
    E(F_p) when chi(f(x)) = +1 and of the quadratic twist E^t(F_p) when
    chi(f(x)) = -1; these are the only possibilities and they are exclusive.
    x-only scalar multiplication computes x([n]P) from x(P) and stays inside
    whichever of the two groups the input belongs to. THEREFORE, for every scalar
    n and every input x with a non-degenerate output x',
    chi(f(x')) = chi(f(x)) EXACTLY. This is a one-line consequence of the group
    structure and it has an immediate operational payoff - A LADDER INTEGRITY
    ORACLE COSTING ONE LEGENDRE SYMBOL. Any exceptional case, carry bug, wrong
    constant, or fault that pushes the computation off both curves is detected
    with probability about 1/2 per invocation, and with near-certainty over a
    handful of invocations.

    (C3) RIGOROUS EXACT IDENTITY, NO HEURISTIC, AND THE MIRROR PINS ITS ONE
    UNKNOWN. Let N_plus = #{x in F_p : chi(f(x)) = +1},
    N_minus = #{x in F_p : chi(f(x)) = -1}, and
    r = #{x in F_p : f(x) = 0} = 2 + chi(A^2 - 4). Then
    #E(F_p) = 1 + r + 2 * N_plus, hence
    N_plus = (#E(F_p) - 1 - r) / 2 EXACTLY, and symmetrically
    N_minus = (#E^t(F_p) - 1 - r) / 2. Writing #E = p + 1 - t gives
    N_plus = (p - t - r)/2 and N_minus = (p + t - r)/2, and the density of curve
    x-coordinates on the Kummer line is N_plus / p = 1/2 - (t + r)/(2p).
    THE MIRROR FIXES r FOR BOTH CURVES - tables/complete.tsv reports exactly 1
    point of order 2 for each, so #E[2](F_p) = 2, the cubic f has exactly one
    root in F_p, r = 1, and chi(A^2 - 4) = -1. Combined with the published
    cofactor 2^3, N_plus = (8*l - 2)/2 = 4*l - 1 exactly, where l is the prime
    subgroup order.

    (C4) RIGOROUS IMPOSSIBILITY, WITH AN EXPONENT, AND IT IS A CLOSURE AT THE
    docs/inventor-protocol.md SECTION 4 STANDARD. By Hasse, |t| is at most
    2*sqrt(p) and r is at most 3, so the density of C3 deviates from exactly 1/2
    by at most (2*sqrt(p) + 3)/(2p), which is below p^{-1/2}. AT p = 2^383 - 187
    THAT BOUND IS ABOUT 2^{-191.5}. Distinguishing the true density from 1/2 by
    sampling requires a standard error below the deviation, hence Theta(p)
    samples. NAMED OBSTRUCTION - Hasse-bounded density deficit. MEASURED VALUE -
    below 2^{-191.5} at 383 bits, with error bars given by the Hasse bound
    itself, which is a theorem. SCOPE - all elliptic curves over all prime
    fields. CONSEQUENCE - "sample the Kummer line and read the trace off the
    curve-versus-twist split" costs p^1, WORSE THAN Pollard rho's p^{1/2} for the
    discrete logarithm and catastrophically worse than Shanks-Mestre's p^{1/4}
    for the order. FORWARD GUIDANCE - the trace information in the Kummer line is
    carried by the GROUP STRUCTURE, reachable by order-finding, and not by the
    MEASURE of the curve-point stratum; classes that remain open are
    order-finding on the Kummer line, structure-exploiting walks, and the
    small-prime residue route of IDEA-20260829-fa8d4e at O(q^2 log p).

    (C5) THE FALSIFIABLE EXPERIMENT AND ITS TWO EXPLANATIONS. Run one ladder
    implementation, one prime, two coefficients. THE COMPETING EXPLANATIONS OF
    "BOTH CURVES SATISFY THE LADDER CRITERION AND CARRY IDENTICAL PUBLISHED
    CELLS" ARE - (L1) LADDER SAFETY AND LADDER COST ARE PROPERTIES OF THE
    MONTGOMERY FORM, so the two curves are indistinguishable under every ladder
    measurement over the shared prime and the table's inability to separate them
    reflects a real identity; and (L2) THEY ARE PROPERTIES OF THE COEFFICIENT, so
    measurable differences appear over the identical prime and the table is
    simply not recording them. C1 already predicts a specific L2 difference in
    throughput, and C1b supplies its published cause. The experiment decides
    between them quantitatively and, because the prime is shared, WITHOUT any
    confound from field arithmetic.

  mechanism: >-
    THE TRACKED OBJECT is the TWIST INDICATOR, the map
    x -> chi(f(x)) in {+1, -1, 0} from the Kummer line P^1(F_p) to three values,
    together with the degenerate stratum Z = 0. It is the coarsest nontrivial
    function on the x-line that x-only arithmetic respects.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute, which is the entire point of the test.
    WHAT IS DISCARDED. A 383-bit x collapses to one trit. Both coordinates of the
    point, the choice between P and -P, the point's order, the scalar, and the
    whole group are discarded. The fibre over each of the two nonzero values has
    size about p/2, by C3 exactly; the fibre is Theta(p) and nothing about x is
    recoverable from its indicator.
    IS IT A CHANGE OF COORDINATES? No, and the contrast with the worked
    counterexample of KN-LIT-7595 is exact. There, (Delta, Pi) = (x XOR y, x*y)
    lost nothing because the unordered pair was recoverable as the roots of a
    quadratic. Here NOTHING is recoverable - one trit cannot encode 383 bits, and
    the fibres are provably enormous by C3. PASSES the test that example fails.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Four operations, four
    deterministic answers, and this is C2 stated operationally. (i) X-ONLY SCALAR
    MULTIPLICATION - the indicator is INVARIANT, exactly, for every scalar; the
    strongest possible form of deterministic propagation, a conservation law
    rather than a transformation rule. (ii) QUADRATIC TWISTING - the twist of E_A
    is given by the same f up to a nonsquare factor, so the indicator map is
    unchanged as a function and only its INTERPRETATION swaps; the two curves
    share one Kummer line and that sharing is exactly the twist attack of
    KN-TECH-034. (iii) THE ISOMORPHISM A -> -A WITH x -> -x. Since
    f_A(-x) = -f_{-A}(x) and, for p congruent to 1 modulo 4, chi(-1) = +1, the
    indicator is PRESERVED; the mirror's tables/field.tsv confirms every
    Montgomery-row prime is congruent to 1 modulo 4, so this is not hypothetical.
    (iv) F_p-ISOGENY - NOT compatible; an isogeny moves to a different Kummer
    line and the indicator does not transport. That failure is disclosed rather
    than glossed and it is the boundary between this record and
    IDEA-20260829-96bd39, whose object is isogeny-stable and ladder-blind, the
    exact complement of this one.
    WHERE THE STRUCTURE DISSOLVES, AND THE MIRROR NOW PINS ITS SIZE EXACTLY. At
    the degenerate stratum - the x with f(x) = 0, which are the rational
    2-torsion x-coordinates, together with the projective identity Z = 0. Since
    tables/complete.tsv gives both curves exactly 1 point of order 2, the cubic
    has exactly one root in F_p, namely x = 0, so THE DEGENERATE STRATUM HAS SIZE
    EXACTLY 2 - the single point (0,0) and the identity - and not "at most 4" as
    a generic Montgomery curve would allow. Enumerating it and showing the census
    hits both members is part of the deliverable.

    WHY THE MATCHED PAIR IS THE INSTRUMENT AND NOT A CONVENIENCE, AND WHY THE
    MIRROR STRENGTHENS RATHER THAN REPLACES IT. Every measurement in this
    campaign confounds two things - what the prime does and what the coefficient
    does - and no single-curve design can separate them. M-383 and Curve383187
    hold p EXACTLY fixed: the same modulus, the same reduction routine, the same
    Legendre implementation, the same word count, the same cache behaviour. The
    mirror sharpens this in a way that could not be anticipated before it was
    read - ITS PUBLISHED CELLS FOR THE TWO ROWS ARE IDENTICAL in ladder,
    complete, rho and twist, and differ only in the trace, the twist subgroup
    order l', and the CM discriminant (approximately -2^383.0 versus -2^382.8).
    So the table itself asserts a ladder-level equivalence, and this record
    measures whether that equivalence survives contact with an implementation.
    THIS IS THE ONLY PLACE IN THE TWENTY-ROW FAMILY WHERE THAT IS POSSIBLE.

    EXECUTION. Step 1, zero compute - verify C1's two divisions by hand, read
    C1b's rigid cells at the TSV tier, and confirm C2 and C3 symbolically with
    r = 1 taken from the mirror and re-derived from chi(A^2 - 4). Step 2,
    implement an x-only Montgomery ladder with the standard projective doubling
    and differential addition, plus an independent affine reference
    implementation with full coordinates. Step 3, VALIDATE BY EXHAUSTION at toy
    scale - for small p, for EVERY admissible A, for EVERY x in P^1(F_p) and
    EVERY scalar n below the group exponent, compare the ladder output against
    the reference and record every degenerate output. A complete census over the
    entire input space, affordable only at toy size, which is stated. Step 4,
    verify C3 exactly by counting N_plus and comparing against brute-force #E for
    every A. Step 5, run the frozen instrument on both 383-bit curves, side by
    side, and publish the paired table beside the mirror's identical published
    cells. Step 6, run the twist-blindness mutation control.

  novelty_status: unverified
  novelty_rationale: >-
    Every mathematical ingredient is expected to be `known`. That x-only
    arithmetic does not distinguish a curve from its twist is the basis of the
    twist attack and is recorded internally as KN-TECH-034; the counting identity
    C3 is the standard character-sum derivation of #E; the Hasse bound is
    textbook; and Bernstein and Lange's retrieved 2017 abstract announces "a full
    proof of a complete constant-time ladder algorithm", so formula-level ladder
    completeness is already settled in the literature and NOTHING NEW IS CLAIMED
    ABOUT IT. What is new is confined to this program and to the design - the
    conservation law stated as an integrity oracle, the exact identity C3 turned
    into the impossibility C4 with a named exponent, and the matched-pair design
    over a shared prime. THE LABEL REMAINS `unverified`, AND THE REASON HAS
    CHANGED. It is no longer that the SafeCurves data could not be retrieved -
    the in-repository mirror was read directly this session and supplies the
    criterion cells, the generation recipes and the cost figures used above. It
    is that no full text of any mathematical source was read: the two preprint
    fetches returned abstracts only, the cr.yp.to PDF fetch failed, and the
    mirror contains SafeCurves' pages and specs but no mathematical literature.
