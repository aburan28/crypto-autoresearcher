  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers, and a wall-clock timer adequate for microsecond-scale
      differential measurement. The 14 cores matter here for the toy census only.
    - >-
      No SEA, Sage or PARI backend. Everything is F_p arithmetic plus an O(p)
      brute-force point counter used only at toy scale.
    - >-
      Both intake tuples are taken from their own RQ records, cross-checked
      against the mirror's equation.tsv and field.tsv, and re-checked - p prime
      at a stated tier, p congruent to 1 modulo 4, A^2 - 4 nonzero for both A and
      equal to the mirror's published 52885740957 and 4264844522496, and THE TWO
      MODULI CONFIRMED BIT-IDENTICAL, which is the premise of the whole design.
    - >-
      Timing measurements are made under a declared protocol - same process, same
      interpreter, interleaved A-B-A ordering to absorb drift, medians over at
      least 10^4 repetitions, and the machine otherwise idle. Absent that, C1's
      cost prediction is untestable and must not be reported.
    - >-
      Every mirror value used is a TIER-2 reading from tables/*.tsv. Before any
      claim leaves the repository the corresponding pages/*.html cell must be
      read, per MIRROR-DEF-1's authority order. No value is taken from
      pages/*.txt, and no generation recipe is attributed to M-383.
    - >-
      Scope is prime fields of odd characteristic and Montgomery-form curves.

  proof_search_map:
    bottleneck: >-
      That every measurement in this campaign confounds the prime with the
      coefficient, so no observed quantity can be attributed to the curve. The
      mirror does not remove this - it makes it acute, because it assigns the two
      rows IDENTICAL cells in every ladder-relevant column, so the published
      table asserts an equivalence that has never been tested. There is no
      computation to speed up here; the bottleneck is EXPERIMENTAL DESIGN, and it
      is removed by a coincidence in the parameter table rather than by an
      algorithm.
    baseline_embedding:
      parameter_slice: >-
        At scalar n = 1 the ladder must return its input x unchanged and the
        conservation oracle must return the input's own indicator; at n = 2 it
        must reproduce the Montgomery doubling map that IDEA-20260829-d052e6
        derives symbolically, on identical inputs. d052e6's doubling map is the
        best-known baseline inside this program for x-only arithmetic and this
        record must CONTAIN it at n = 2, not merely resemble it.
      reproduction_check: >-
        A frozen fixture asserting bit-identical agreement between the ladder at
        n = 2 and d052e6's doubling numerator and denominator on 10^3 random x at
        both 383-bit curves, run before any larger scalar is trusted; plus, at
        toy scale, exhaustive agreement of the ladder against an affine reference
        over the entire input space; plus agreement of the computed 2-torsion
        count with the mirror's published 1 point of order 2 for both rows.
    observation_collision:
      observable: >-
        The twist indicator chi(f(x)), and derivatively the paired measurement
        table for the two curves.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS PROVED IN ADVANCE BY C3 RATHER THAN SEARCHED
        FOR. Collisions are MAXIMAL - the indicator takes three values on p + 1
        inputs, so each nonzero fibre has size about p/2 exactly, and any two
        inputs in the same fibre are indistinguishable by the observable. THE
        CONSEQUENCE, WHICH IS C4 - no amount of sampling identifies the curve,
        the trace or the order; the observable's information content about t is
        bounded by the Hasse deviation of the fibre sizes, below 2^{-191.5} in
        density at 383 bits. A SECOND COLLISION AT THE PUBLISHED-TABLE LEVEL,
        NEWLY EXHIBITED BY THE MIRROR AND LOAD-BEARING FOR THIS RECORD - M-383
        and Curve383187 have IDENTICAL cells in ladder, complete, rho and twist,
        so the SafeCurves observable does not separate them either; the fibre of
        the criterion table over these two curves is not a singleton and the
        record's whole purpose is to exhibit an intrinsic invariant that
        distinguishes them. A THIRD COLLISION THAT MATTERS OPERATIONALLY - a
        CURVE point and a TWIST point are distinguished by the indicator but NOT
        by the ladder, which processes both identically; that collision is the
        twist attack, and the mutation control exhibits it deliberately.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the twist indicator alongside the ladder state, rather than
          only the final x. The stronger state is what survives every scalar
          multiplication as an exact conservation law and is what detects a
          computation that has left both curves; the final x alone detects
          nothing.
        predicted_gain: >-
          A ladder integrity oracle costing one Legendre symbol per invocation -
          O(log p) modular squarings against the ladder's own O(log p) group
          steps, hence a negligible constant fraction - detecting off-curve
          excursions with probability about 1/2 each. This is the concrete answer
          to KN-TECH-034's own unrun validation experiment.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed - the mirror's ladder, complete, rho and
          twist cells, which are identical for the two rows - and vary the
          forgotten structure, namely the coefficient A, over the identical
          prime. The matched pair IS the fibre, instantiated at cryptographic
          size with exactly two members and with the collision now EXHIBITED
          from published data rather than conjectured.
        predicted_gain: >-
          An intrinsic invariant distinguishing two curves that the published
          criterion table cannot distinguish - concretely the integrality of
          (A - 2)/4 and the measured ladder throughput - converting "both rows
          carry identical cells" into a quantified cost separation with a
          published cause in tables/rigid.tsv.
    quantifier_order: >-
      C1 is claimed PER CURVE AND EXISTENTIALLY - FOR THESE two integers, the
      exhibited divisions hold. C1b is claimed PER CURVE AND EXISTENTIALLY as a
      reading of published text, for Curve383187, M-221, M-511 and Curve25519,
      and is EXPLICITLY NOT CLAIMED for M-383, whose cell is empty. C2 is claimed
      UNIFORMLY - FOR ALL odd primes p, FOR ALL admissible A, FOR ALL x with f(x)
      nonzero and FOR ALL scalars n with non-degenerate output,
      chi(f(x([n]P))) = chi(f(x)). C3 is claimed UNIFORMLY over all odd p and
      admissible A. C4 is claimed UNIFORMLY AND AS AN IMPOSSIBILITY - FOR ALL odd
      p and ALL curves over F_p, ANY sampling estimator of the indicator density
      needs Theta(p) samples to resolve the trace; the quantifier order matters
      because the claim is a lower bound over ALL estimators OF THIS RESTRICTED
      FORM, NOT over all algorithms, and a record reading it as the latter has
      overstated a closure. C5 is claimed PER PAIR AND EXISTENTIALLY.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the identical prime 2^383 - 187, the two curves differ measurably
        in the exhibited ways and agree in the exhibited ways; the ladder
        conservation law held on every one of N tested inputs; the degenerate
        stratum was exactly the two predicted members; and the identity C3 holds
        exactly on every tested toy curve." It certifies NOTHING about the group
        orders, NOTHING about either criterion cell, NOTHING about security, and
        NOTHING about any curve outside the pair. Pushed to its limit the method
        could certify that a specific ladder implementation is exception-free on
        a specific finite input set, and by exhaustion at toy scale that ALL
        Montgomery ladders over small primes are exception-free outside the
        degenerate stratum - but never at 383 bits, where the input space is not
        enumerable, and Bernstein and Lange's retrieved abstract indicates the
        proof-level statement is already in the literature.
      nearby_object_control: >-
        THE PAIR IS ITSELF THE CONTROL, AND THAT IS THE RECORD'S DESIGN. M-383
        and Curve383187 differ in exactly one input and agree in every other,
        including every published ladder-relevant cell. A SECOND, SHARPER ONE FOR
        C1 - A' = 229970 over the same p, one unit from Curve383187's coefficient
        and congruent to 2 modulo 4, so (A' - 2)/4 = 57492 is a small integer. If
        the measured throughput of A' matches M-383's rather than Curve383187's,
        the cost difference is attributable to a24 INTEGRALITY and not to the
        coefficient's magnitude or parity as such; if it matches Curve383187's,
        C1's mechanism is wrong and the measured difference has another cause.
        A' = 229970 is absent from the mirror, so no published value can leak
        into its verdict. THIS IS THE CONTROL THAT ISOLATES THE LOAD-BEARING
        STRUCTURE and a naive two-curve comparison would omit it.
    proof_obligations:
      - claim: >-
          A - 2 = 2065148 is divisible by 4 with quotient 516287, and
          A - 2 = 229967 is odd and not divisible by 4.
        responsibility: correctness
      - claim: >-
          For f(x) nonzero, x is an x-coordinate on E if chi(f(x)) = +1 and on
          E^t if chi(f(x)) = -1, exclusively.
        responsibility: correctness
      - claim: >-
          x-only scalar multiplication stays within the group determined by the
          input, hence the indicator is invariant.
        responsibility: correctness
      - claim: >-
          #E = 1 + r + 2*N_plus with r = 2 + chi(A^2 - 4), giving C3 exactly; and
          r = 1 for both rows, consistent with the mirror's published count of 1
          point of order 2.
        responsibility: correctness
      - claim: >-
          The density deviation from 1/2 is at most (2*sqrt(p) + 3)/(2p), hence
          Theta(p) samples are needed - a Hasse consequence with no heuristic.
        responsibility: size
      - claim: >-
          The degenerate stratum has size exactly 2 for both rows, namely x = 0
          and the projective identity, and the census exercises both.
        responsibility: scope
      - claim: >-
          The exhaustive toy census covers the ENTIRE input space (A, x, n) at
          each size where exhaustiveness is claimed, and is labelled a subsample
          everywhere else.
        responsibility: scope
      - claim: >-
          The timing protocol supports attributing a measured throughput
          difference to a24 rather than to environment drift.
        responsibility: baseline
      - claim: >-
          The twist-blindness mutation control achieves the predicted wrong-group
          rate, so the instrument is demonstrated to fire.
        responsibility: strictness
    not_applicable_reason: null

  predictions:
    - metric: >-
        integrality of a24 = (A - 2)/4 as an integer, for M-383 and for
        Curve383187
      direction: different
      minimum_effect: >-
        PREDICTED integral with value 516287 for M-383 and NON-integral for
        Curve383187, both derived by hand in this record and to be confirmed by
        machine, with the same verdicts for (A + 2)/4. A contrary result means an
        intake coefficient is mis-transcribed - though the mirror's equation.tsv
        independently confirms both coefficients, so a contrary result would
        indicate an arithmetic error rather than a transcription defect.
    - metric: >-
        median wall-clock per ladder step for Curve383187 relative to M-383, same
        code, same prime, interleaved A-B-A protocol, at least 10^4 repetitions,
        reported beside a counted number of full-width field multiplications
      direction: higher
      minimum_effect: >-
        PREDICTED at least 5 percent slower, point estimate near 10 to 15
        percent, on the reasoning that a combined double-and-add step costs about
        four multiplications, two squarings and one multiplication by a24, and
        that the a24 multiplication becomes a full-width one for Curve383187.
        THE TWO OUTCOMES MEAN DIFFERENT THINGS - a difference at or above 5
        percent supports explanation L2, that ladder COST is a coefficient
        property, and IS A QUANTITY THE PUBLISHED TABLE DOES NOT CONTAIN, since
        the mirror gives both rows identical ladder, rho and twist cells; a
        difference indistinguishable from zero in BOTH the wall clock and the
        multiplication count means the implementation is not exploiting the small
        constant, in which case the comparison measures the implementation and
        not the curves, and the record must say so rather than report a null as a
        finding.
    - metric: >-
        conservation rate of chi(f(x)) across 10^6 random (x, n) pairs on each of
        the two 383-bit curves
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 on both, since C2 is a theorem. A SINGLE
        violation is not a mathematical discovery - it is an implementation
        defect, and it is the defect the oracle exists to catch. The record
        pre-commits to treating any violation as a bug until proved otherwise and
        to reporting the offending (x, n) as a reproducible artifact.
    - metric: >-
        fraction of uniformly random x in F_p with chi(f(x)) = -1, over 10^6
        samples at each 383-bit curve
      direction: different
      minimum_effect: >-
        PREDICTED 0.5 within 3 standard errors, that is 0.5 plus or minus 0.0015,
        on BOTH curves. THE DISCRIMINATOR - agreement confirms C4 operationally,
        namely that half of all attacker-chosen x land on the twist and the
        ladder cannot tell, which is the quantitative content of KN-TECH-034's
        twist-attack row and the reason the mirror's twist cofactor 2^2 with a
        prime l' matters; a measured deviation beyond 3 standard errors would
        contradict the Hasse bound and therefore prove an implementation error.
    - metric: >-
        wrong-group rate of a Kummer-line order certificate that OMITS the
        Legendre discrimination step, over 10^3 random x
      direction: higher
      minimum_effect: >-
        PREDICTED close to 0.5, the blocking mutation control. This is the
        deliberate-invalid-instance experiment KN-TECH-034 names as never having
        been run. A rate near zero means the omission does not matter, which
        would contradict C2's interpretation and require KN-TECH-034's
        twist-attack row to be re-examined; a rate near 0.5 quantifies exactly how
        much the one omitted Legendre symbol is worth, which the corpus currently
        states only qualitatively.
    - metric: >-
        size and membership of the degenerate stratum for each 383-bit curve
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 2 MEMBERS for each - the single rational 2-torsion
        x-coordinate x = 0, and the projective identity Z = 0 - because the
        mirror reports exactly 1 point of order 2 for both rows, so the cubic has
        exactly one root in F_p. A third member found means chi(A^2 - 4) = +1,
        contradicting the mirror's complete.tsv, and is a material discrepancy to
        be resolved against pages/complete.html at the authoritative tier before
        anything else proceeds.
    - metric: >-
        exhaustive agreement of the ladder with an affine reference over the
        ENTIRE input space (A, x, n) at toy primes
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 outside the degenerate stratum, and PREDICTED to
        FAIL on the degenerate stratum itself. Both halves are required - an
        implementation that never produces a degenerate output has not exercised
        the exceptional cases and cannot claim to have surveyed them, and one
        that produces them outside the predicted stratum has found an exceptional
        case the analysis missed, which is the single most valuable outcome of
        the census.
    - metric: >-
        exact agreement of N_plus counted directly with (#E - 1 - r)/2 computed
        from brute-force #E, over every admissible A at toy primes
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000, exhaustive, zero exceptions permitted, because
        C3 is an identity. Any exception refutes C3 or the point counter, and the
        record pre-commits to determining which by checking the counter against a
        second independent implementation first.
    - metric: >-
        measured scaling exponent of the observed absolute value of
        (density - 1/2) against p, over toy primes spanning 2^10 to 2^20
      direction: different
      minimum_effect: >-
        PREDICTED an exponent near -1/2, matching the Hasse bound. Confirming
        -1/2 empirically over ten octaves turns C4 from an inequality into a
        measured obstruction with a scaling law, which is the form in which the
        closure should be recorded. An exponent materially shallower than -1/2
        would mean the density carries more trace information than Hasse permits,
        which is impossible for a correct implementation and therefore indicates
        a bug.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, AND IT IS THE CHEAPEST VALID DISCRIMINATOR. Verify
      C1's two divisions by hand - 2065148 divided by 4 is 516287 exactly, and
      229967 is odd - and confirm from the mirror's field.tsv that the two rows
      print the identical modulus. Read C1b's rigid cells at the TSV tier and
      confirm that M-383's comments cell is empty. If the moduli differ, the
      matched-pair premise is void and the record dies at zero cost.
      STAGE 1, minutes of compute. EXHAUSTIVE CENSUS at two toy primes near
      2^10 to 2^12, small enough that the FULL input space (A, x, n) is
      enumerable. Compare the ladder against an affine reference on every input;
      record every degenerate output and check it lies in the predicted stratum;
      check the conservation law on every input; count N_plus and check C3
      against brute-force #E for every A. One pass settles C2, C3 and the
      exceptional-set claim simultaneously.
      STAGE 2, minutes. The scaling study for C4 - toy primes spanning 2^10 to
      2^20, measuring the absolute deviation of the density from 1/2 and fitting
      the exponent.
      STAGE 3, minutes. THE PAIRED 383-BIT RUN. Same process, same code, same
      prime, two coefficients, interleaved A-B-A, medians over at least 10^4
      ladder invocations - conservation rate, indicator density, throughput
      ratio, counted full-width multiplications per step, the degenerate stratum,
      and the a24 representation actually used. Publish the result beside the
      mirror's identical published cells for the two rows.
      STAGE 4, seconds. The a24-isolating control A' = 229970 over the same p.
      STAGE 5, minutes. The blocking twist-blindness mutation control on both
      curves.
      STAGE 6, seconds. The family sweep - compute (A - 2)/4 integrality for the
      five Montgomery rows of the mirror and confirm Curve383187 is the unique
      row without a small constant; record which rows the instrument REFUSES
      because they are not in Montgomery form.
    controls:
      - >-
        BLOCKING MUTATION CONTROL, AND IT IS THE EXPERIMENT KN-TECH-034 NAMES AS
        MISSING - run a Kummer-line order-verification routine with the Legendre
        discrimination step DELETED, on 10^3 random x per curve, and measure how
        often it certifies in the wrong group. PREDICTED near 0.5. A rate near
        zero voids the record's operational claim.
      - >-
        POSITIVE, BLOCKING - deliberately corrupted ladder variants, at least
        five, each with a single injected defect (wrong a24, a dropped carry, a
        swapped operand, an off-by-one loop bound, a wrong exceptional-case
        branch). The conservation oracle must detect each within a stated number
        of invocations. AN ORACLE NEVER SHOWN TO FIRE CANNOT CERTIFY INTEGRITY,
        which is IDEA-20260807-98a970's rule applied here.
      - >-
        NEGATIVE, PARAMETER-MATCHED, SAME PRIME - M-383 against Curve383187, the
        defining control of the design, and the pair the published table cannot
        separate.
      - >-
        MECHANISM-ISOLATING - A' = 229970 over the same p, one unit from
        Curve383187 and with an integral (A - 2)/4 = 57492. This separates "a24 is
        small" from "A is small" and from "A is odd", and without it the
        throughput result is uninterpretable. Absent from the mirror by
        construction.
      - >-
        NULL, SAME SHAPE - 10^6 uniformly random 383-bit values fed to the
        Legendre routine, whose symbol distribution must be 0.5 plus or minus
        0.0015 at 3 sigma. A symbol routine returning all +1 or all -1 is broken
        and voids everything; this is the same null d052e6 specifies, reused so
        the two records share a calibration.
      - >-
        REFUSAL CONTROL - the short-Weierstrass rows of the mirror, for which a24
        is undefined. The instrument must REFUSE rather than compute something; a
        number returned for a curve with no Montgomery model is evidence the code
        is not reading the model it claims to read.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol computed twice, by Euler's
        criterion and by the binary Jacobi recursion; every ladder output checked
        against the affine reference wherever the reference is affordable.
        Disagreement voids the run.
      - >-
        SOURCE-TIER CONTROL - for every mirror value that enters a reported
        result, re-read the corresponding cell from pages/*.html before
        publication, per MIRROR-DEF-1's authority order. No pages/*.txt file is
        read at any point, and no generation recipe is attributed to M-383.
    required_metrics:
      - 'a24 = (A - 2)/4 integrality and its exact value or full-width form, per curve'
      - 'per toy p, exhaustive ladder-versus-reference agreement over the full input space'
      - 'per toy p and per A, the enumerated degenerate stratum with its size'
      - 'per toy p and per A, N_plus counted and N_plus predicted by C3, and their difference'
      - 'the fitted scaling exponent of the density deviation against p over 2^10 to 2^20'
      - 'per 383-bit curve, conservation rate over 10^6 (x, n) pairs'
      - 'per 383-bit curve, median ladder step time, its interquartile range, and the paired ratio'
      - 'per 383-bit curve, the counted number of full-width field multiplications per ladder step'
      - 'the a24-isolating control timing for A prime = 229970'
      - 'the twist-blindness wrong-group rate with and without the Legendre step'
      - 'per corrupted ladder variant, the number of invocations to first detection'
      - 'per mirror value used, the file, the table number, the line, and the tier read'

  falsification_conditions:
    - >-
      The two intake moduli are not the same integer, or the mirror's field.tsv
      does not print them identically. The matched-pair premise is false, the
      design has no control, and the record is withdrawn - a zero-cost negative
      available at Stage 0.
    - >-
      Any conservation violation on either 383-bit curve. C2 is a theorem, so
      this is an implementation defect; the run is void as an
      invalid_measurement per docs/claims-and-verification.md, the offending
      input is published, and no timing or density number from that run is
      reported.
    - >-
      Any toy input where the ladder disagrees with the affine reference OUTSIDE
      the predicted degenerate stratum. The exceptional-set analysis is
      incomplete, the stratum must be re-derived, and the 383-bit run does not
      proceed. This is the census's most valuable possible outcome.
    - >-
      A degenerate stratum of size other than 2 at either 383-bit curve. This
      contradicts the mirror's published count of 1 point of order 2 - halt,
      recompute chi(A^2 - 4) independently, and re-read pages/complete.html at
      the authoritative tier before reporting.
    - >-
      Any admissible toy A where N_plus differs from C3's prediction. C3 or the
      point counter is wrong; determine which against a second counter before
      reporting.
    - >-
      A corrupted ladder variant that the conservation oracle never detects. The
      oracle does not fire on a defect it is claimed to catch, and every
      integrity statement it supports is withdrawn.
    - >-
      The twist-blindness wrong-group rate is near zero. The operational reading
      of C2 is wrong and KN-TECH-034's twist-attack row must be re-examined
      against this measurement rather than the other way round.
    - >-
      The measured throughput difference is indistinguishable from zero AND the
      a24-isolating control shows no difference AND the counted
      full-width-multiplication metric shows no difference. C1's cost mechanism is
      not operative; the record reports a measured null, explicitly does NOT claim
      a cost change, and draws its conclusion about the implementation rather than
      about either curve.
    - >-
      An empirical indicator density deviating from 0.5 beyond 3 standard errors
      at 383 bits. This contradicts a theorem and therefore proves an
      implementation error; nothing is reported.

  confounders:
    - >-
      A COST DIFFERENCE IS NOT A SECURITY DIFFERENCE. C1 measures how fast a
      ladder step runs, not how hard a discrete logarithm is. The mirror gives
      both rows rho 2^189.8 and twist rho 2^190.3, identical; a record citing the
      throughput result as bearing on the ladder criterion's SAFETY has committed
      a category error.
    - >-
      TIMING MEASURES AN IMPLEMENTATION. In pure Python, big-integer
      multiplication cost is dominated by interpreter overhead and the small-a24
      advantage may be invisible even though it is real in a field-operation
      count. The deliverable must therefore report BOTH the measured wall clock
      AND a counted number of full-width field multiplications per step, and must
      treat the operation count as the primary result and the wall clock as
      corroboration.
    - >-
      THE INDICATOR SEES THE PAIR, NOT THE CURVE. Because E and E^t share one
      Kummer line, every statement here is a statement about the unordered pair.
      Which member is called the curve is a convention, and a record inferring an
      asymmetry between them from indicator data alone has read a convention as a
      result. This is the same convention hazard IDEA-20260829-e37b52 records for
      its instrument I3.
    - >-
      MIRROR-DEF-1 BITES THE OTHER MEMBER OF THIS PAIR. M-383's rigid comments
      cell is EMPTY and THIS RECORD'S CURVE, Curve383187, carries the adjacent
      recipe. The direction of the hazard is therefore to over-attribute a recipe
      to M-383, not to Curve383187 - but the record still reads only tables/*.tsv
      and pages/*.html tiers and never pages/*.txt.
    - >-
      EXHAUSTIVENESS IS TOY-ONLY. The full input space (A, x, n) is enumerable
      only near 2^10 to 2^12. Every statement about "all inputs" is scoped to
      those primes; the 383-bit runs are samples of size 10^6 out of about
      2^{383}, a coverage of about 2^{-363}, and no sentence may blur the two.
    - >-
      TOY-SCALE DEGENERACY RATE. At 10 to 12 bits, supersingular, anomalous and
      tiny-order curves are common (KN-TECH-033), and the census must count them
      rather than let them dominate an agreement statistic.
    - >-
      SHARED-PRIME DOES NOT MEAN SHARED ISOGENY CLASS. The mirror's disc.tsv
      gives the two rows DIFFERENT traces and different CM discriminants, so
      their group orders differ. The design controls for the FIELD, not for the
      group, and any observation depending on the group order is NOT controlled
      by this pairing.
    - >-
      MIRROR TIER. Every mirror value used here is tier 2 (tables/*.tsv). The
      tier-1 pages/*.html remain the authority and a tier-2 reading may not be
      the last word on any externally reported number.

  interpretation_limits:
    - >-
      Nothing here adjudicates any SafeCurves criterion cell. The mirror supplies
      the cells, and under the goal's claim boundaries they remain
      user_supplied_unverified intake and a preregistered comparison target, not
      evidence. What the mirror changes is that the comparison target is now
      legible in full and the two rows are seen to be identical on every
      ladder-relevant axis.
    - >-
      C1, C2, C3 and C4 are proved. C1b is a reading of published text at tier 2.
      C5 is an empirical comparison of one implementation on two coefficients and
      its conclusions are scoped to that implementation, language, machine and
      protocol.
    - >-
      C4 is an impossibility for a RESTRICTED CLASS of estimators - those that
      sample the twist indicator and estimate its density. It is NOT a lower
      bound over all algorithms, and it explicitly does not apply to
      Shanks-Mestre order finding at p^{1/4} or to the small-prime residue route
      of IDEA-20260829-fa8d4e at O(q^2 log p). Reading it as a general
      impossibility would be exactly the premature closure
      docs/inventor-protocol.md treats as a failure mode symmetric with
      overclaiming.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER of C2,
      C3 and C4 to EVERY curve over EVERY odd prime field - they use no
      Montgomery hypothesis beyond the shape of f and no branch on p modulo 4
      except in the isomorphism remark, and C3 and C4 hold for any Weierstrass
      cubic verbatim. (b) FULL TRANSFER of C1's computation to the four other
      Montgomery rows of the mirror, where (A - 2)/4 is derived here as 29262 for
      M-221, 516287 for M-383, 132609 for M-511 and 121665 for Curve25519, all
      small integers - so CURVE383187 IS PREDICTED TO BE THE UNIQUE MONTGOMERY
      ROW WITHOUT A SMALL LADDER CONSTANT, and that prediction is falsified by any
      counterexample among the twenty rows. (c) TRANSFER OF C1b IS PARTIAL AND
      ASYMMETRIC - the mirror publishes a generation recipe for Curve383187,
      M-221, M-511, Curve25519, Curve1174, Curve41417, Ed448-Goldilocks,
      Anomalous and BN(2,254), and leaves the cell EMPTY for M-383, E-222, E-382
      and E-521. No recipe may be attributed to those four. (d) NO TRANSFER of
      the matched-pair DESIGN to any other row, because no other pair in the
      family shares a prime; this control structure is unrepeatable and that is
      precisely its value. (e) NO TRANSFER of the throughput measurement across
      machines, languages or arithmetic backends. (f) NO TRANSFER to any statement
      about group orders, cofactors or the ECDLP.
    - >-
      Bernstein and Lange's retrieved 2017 abstract announces a full proof of a
