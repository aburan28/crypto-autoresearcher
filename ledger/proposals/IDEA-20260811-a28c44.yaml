idea:
  id: IDEA-20260811-a28c44
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    THE FORWARD/BACKWARD GENERIC GROUP MODEL, AND A POSITIVE SEPARATION RESULT --
    "writing down a point you never constructed" is a state-CREATING primitive
    that lies outside every oracle taxonomy this campaign has built, and it is
    provably FREE AND WORTHLESS. Adding an unlimited CREATE primitive (return a
    handle to a group element whose discrete log the adversary does not learn,
    optionally constrained by any predicate on labels) leaves the Shoup bound
    intact at (g+s+2)^2/N. Therefore the index-calculus escape is NOT located in
    the factor-base construction step, and resource R1 must be split into a
    forward half (read x as a field element) that is free and harmless, and a
    backward half (discover a relation among created points) that is the entire
    game
  class: mechanism

  claim: >-
    (A) THE MODEL. FB-GGM (forward/backward generic group model). Fix prime N,
    G = <P> of order N, Q = [k]P with k uniform in Z/N. An adversary A holds
    opaque handles and has four primitives.
      FORWARD, all of them state-CONSUMING, each taking handles A already holds:
        ADD(h_1, h_2) -> handle of the sum; NEG(h) -> handle of the negation;
        EQ(h_1, h_2) -> bit.
      BACKWARD, state-CREATING, taking NO handle as an argument:
        CREATE(Pi) -> a handle h to a group element drawn uniformly from
        {R in G : Pi(label(R))}, where Pi is any predicate the adversary writes
        down on the label alphabet. A learns the label of h. A does NOT learn
        the discrete logarithm of h, and no promise is made that A can express h
        in terms of handles it already holds.
    CREATE is the abstraction of the one move a real index-calculus adversary
    makes and a Shoup adversary cannot make -- producing a point by SOLVING for
    it (root-finding on the curve equation at a chosen x, or enumerating a factor
    base) rather than by composing group operations. It is not an "augmenting
    oracle" in the sense of KN-FIND-b7e091, IDEA-20260807-5876b8 or
    IDEA-20260807-7270d1, because it does not ANSWER a question about handles: it
    MANUFACTURES a handle. Every taxonomy this campaign has written quantifies
    over answer-valued oracles and is therefore silent about it.

    (B) THEOREM FB-1 (the positive separation result, and it is the deliverable).
    In FB-GGM, for every adversary A making g invocations of ADD/NEG/EQ and s
    invocations of CREATE,
        Pr[ A outputs k ] <= binom(g + s + 2, 2) / N  +  1/N,
    where the probability is over uniform k, over the labeling, and over the
    CREATE draws. Consequently g + s = Omega(sqrt(N)) for constant success
    probability, and THE BOUND IS INDEPENDENT OF THE PREDICATE Pi. Free,
    unlimited, arbitrarily-structured point creation buys nothing.

    (C) PROOF, IN FULL, BECAUSE IT IS SHORT. Simulate. Maintain for each handle a
    formal linear form in the free variables (1, k, e_1, ..., e_s) over Z/N: the
    two initial handles get (1,0,0,...) and (0,1,0,...); ADD and NEG act linearly;
    the j-th CREATE introduces a FRESH variable e_j and a fresh label consistent
    with Pi. EQ is answered by formal equality. The simulated transcript is a
    deterministic function of A's coins alone, hence independent of
    (k, e_1, ..., e_s). The simulation diverges from the real execution only if
    two FORMALLY DISTINCT linear forms evaluate equally at the true
    (k, e_1, ..., e_s). Their difference is a nonzero linear form over the field
    Z/N (N prime) in variables that are uniform and independent in the ideal
    model, so it vanishes with probability exactly 1/N. There are at most
    binom(g+s+2, 2) such pairs. Union bound; add 1/N for a blind guess. QED.

    (D) WHAT THE THEOREM MEANS, STATED SO IT CANNOT BE OVER-READ. It does NOT say
    index calculus fails. It says the escape is not where the campaign's own
    resource taxonomy puts it. Resource R1 in DECOMPOSITION.md section 2 is
    "x-coordinates as field elements", which silently bundles two capabilities:
      R1-fwd, READ-OUT: given a handle, obtain x as a field element. Adjudicated
        by IDEA-20260807-070d03 -- self-computable, zero error, verdict PUB.
      R1-bwd, POINT CREATION: given field data, obtain a handle to a point
        satisfying it. Adjudicated HERE -- simulable, exponent 1/2 preserved.
    BOTH HALVES OF R1 ARE NOW CLOSED. What is not closed, and what neither half
    is, is the third capability: RELATE -- discovering that a specific signed
    subset of created handles sums to a target. That is the arity-m decomposition
    oracle, it is cell (c) of IDEA-20260807-5876b8, it is the Z = binom(L,m) row
    of IDEA-20260807-7270d1, and its cost is IDEA-20260807-070d03's open C.
    THE BOUNDARY OF THE GENERIC MODEL RUNS EXACTLY BETWEEN CREATE AND RELATE,
    and this record establishes the CREATE side of it.

    (E) THE TAXONOMY CHANGE THIS RECORD ASKS FOR. DECOMPOSITION.md section 2
    should split R1 into R1-fwd and R1-bwd and add a genuinely new entry for the
    capability that neither covers:
      R9 -- RELATION DISCOVERY: the ability to exhibit a nontrivial signed
      Z-linear relation among group elements whose discrete logarithms the
      adversary does not know, at a cost below the birthday bound of the set it
      searches.
    R9 is the only resource in the campaign whose consumption is not closed at
    exponent 1/2 by an argument the campaign already owns. This is a request for
    a Coordinator taxonomy amendment, not an amendment.

    (F) THE SANITY CHECK THAT MAKES (B) NON-VACUOUS. Give A a free CREATE
    restricted to a factor base of size L = N^{1/m} and let it create the whole
    base at s = L. In the real world the base has L specific discrete logarithms
    and a relation among m of them exists once binom(L,m) >~ N. Theorem FB-1 says
    that FINDING one generically costs sqrt(N) -- which is exactly right, because
    the generic way to find a subset-sum relation among L unknown-log elements IS
    a birthday search. The theorem therefore reproduces the known state of affairs
    rather than contradicting it, and the gap between sqrt(N) and the N^{1/m}
    queries an index-calculus adversary actually uses is precisely the
    non-generic work done by Semaev/Groebner. The theorem localises the whole
    prime-field question into one number and does not pretend to answer it.

  resource_label: >-
    R1, audited and SPLIT. This record proposes that R1 be read as R1-fwd
    (coordinate read-out, closed by IDEA-20260807-070d03) plus R1-bwd (point
    creation from field data, closed here), and that a NEW taxonomy entry R9
    (relation discovery among unknown-log elements) be opened for the capability
    that neither half covers. The record itself consumes no resource: it is an
    audit, exactly as lane L12 is defined.
  admissibility: admissible
  admissibility_argument: >-
    Admissible with room to spare. No endomorphism is applied to any point of G,
    so H-ENDO-001 is not touched, not tested and not needed. The record does not
    re-open the incidence or endomorphism-image closures of KN-FIND-b7e091; it
    extends the same technique (exhibit a simulator, bound its error) to a
    primitive class those closures do not reach, which is the declared purpose of
    lane L12.

  object_first_candidate:
    tracked_object: >-
      THE DIRECTION OF EACH ACCESS TO THE LABELING. Project an algorithm's whole
      execution onto the word in the two-letter alphabet {FORWARD, BACKWARD}
      obtained by recording, for each primitive invocation, whether it consumed
      handles to produce a handle (forward, i.e. it moves along sigma) or
      produced a handle from non-handle data (backward, i.e. it moves along
      sigma^{-1}).
    lossiness: >-
      GENUINELY LOSSY, and lossy in the direction that matters. Discarded: every
      field element, every label, every scalar, the curve, the prime, the
      predicate Pi, and the arithmetic content of every step. Retained: one bit
      per step. Uncountably many algorithms share any given word, so the
      projection is not invertible and is not a change of coordinates. Contrast
      the KN-LIT-7595 cautionary example (Delta, Pi) = (x xor y, x*y), which
      discarded nothing because the pair was recoverable as roots of a quadratic:
      here nothing at all is recoverable from the word.
    propagation: >-
      DETERMINISTIC, and this is the non-obvious half. The simulator's state --
      the list of formal linear forms over the variable set (1, k, e_1, ..., e_s)
      -- is updated deterministically by each letter of the word: FORWARD applies
      a fixed linear map to two existing forms, BACKWARD adjoins a fresh basis
      variable and one new form. What is discarded (the field data) is discarded
      COMPATIBLY with the group law, because the group law acts on the retained
      part (the linear forms) and never consults the discarded part. That is
      precisely the inventor-protocol section 2 condition, verified rather than
      asserted.
    survival_score: >-
      Survives until the first RELATE step and not one step further. RELATE
      imposes an equation among the e_j that the word does not record, so the
      retained state stops determining the real state at exactly that point.
      That the object's death is sharp, and coincides with the boundary the axis
      is trying to locate, is the reason to track it.

  mechanism: >-
    STEP 1 (zero compute) -- WRITE THE MODEL DOWN. Fix the four primitives, the
    cost unit (one primitive invocation), and the promise structure of CREATE
    (uniform on the Pi-preimage; discrete log withheld). Freeze the signature
    before anything is claimed about it, per the quantifier-freeze discipline of
    IDEA-20260807-63056d.

    STEP 2 (zero compute) -- PROVE THEOREM FB-1 as written in (C). Four lines of
    Schwartz-Zippel over a rank-(s+2) free module plus a union bound.

    STEP 3 (zero compute) -- THE BASELINE EMBEDDING. Set s = 0 and check the
    bound collapses to binom(g+2,2)/N, i.e. Shoup exactly. Then set Pi = TRUE and
    check that unrestricted creation is covered. Then set |Pi-preimage| = 1 (a
    single fixed point) and check the bound is unchanged, which is the null-object
    slice.

    STEP 4 (zero compute) -- THE FIDELITY AUDIT, which is where the record is
    weakest and must say so. Enumerate every way the real world differs from the
    model: (i) real created points have FIXED discrete logs determined by the
    curve, not fresh uniform variables; (ii) a real CREATE with |Pi-preimage| < s
    returns repeats; (iii) a real CREATE costs field work, which the model prices
    at one unit. Each is stated as a numbered heuristic or a declared idealisation
    below, none is hidden.

    STEP 5 (zero compute) -- THE TAXONOMY REQUEST of (E), written as a request to
    the Coordinator, changing nothing.

    STEP 6 (toy compute, optional and NOT required for the theorem) -- the
    instrument check of the minimal_test: measure, on toy curves, whether a
    generic adversary restricted to ADD/EQ/CREATE can find a subset-sum relation
    among created points below the birthday bound. The theorem says it cannot;
    the measurement exists to catch a modelling error, not to establish the
    theorem.

  why_not_a_renamed_known_approach: >-
    The nearest KNOWN external object is Shoup's 1997 generic group model itself
    (KN-TECH-005), of which FB-GGM is a conservative extension recovered exactly
    at s = 0. The nearest INTERNAL objects are IDEA-20260807-5876b8's four-cell
    dichotomy and IDEA-20260807-7270d1's existential width, and this record is not
    a renaming of either for one structural reason: both of those quantify over
    oracles that ANSWER a query about handles the adversary already holds, and
    are therefore functions of the formal linear forms or of a candidate set of
    them. CREATE takes no handle as an argument and returns a handle whose linear
    form is a FRESH VARIABLE. It enlarges the simulator's variable set rather
    than its answer set, which is a different operation on the simulator's state
    and is why the proof needs a rank-(s+2) Schwartz-Zippel step where the
    incumbent arguments need only rank 2. That the two arguments have different
    proofs is the operational test of "not a renaming", and it is met.
    EXTERNAL NOVELTY IS NOT CLAIMED. Sampling primitives of this shape are
    standard in the generic-group literature under other names and web search was
    unavailable this session (see novelty_screen).

  predictions:
  - observable: baseline collapse of the FB-GGM bound
    metric: the symbolic value of binom(g+s+2,2)/N at s = 0
    direction: different
    predicted: exactly Shoup's binom(g+2,2)/N, with no residual term of the same
      order. Any residual means the extension is not conservative and the record
      is withdrawn.
  - observable: predicate-independence of the bound
    metric: the bound as a function of |Pi-preimage| over the ladder
      |Pi-preimage| in {1, N^{1/4}, N^{1/2}, N}
    direction: different
    predicted: constant in |Pi-preimage|. If a correct derivation makes the bound
      depend on |Pi-preimage|, claim (B) is false as stated and must be
      re-scoped to unrestricted CREATE only.
  - observable: generic relation-finding cost among created points, measured
    metric: number of ADD/EQ operations a best-effort generic search needs to
      exhibit a signed m-subset relation among s created handles, at
      p in {2^16, 2^18, 2^20}, m = 3, s on the ladder {N^{1/4}, N^{1/3}, N^{1/2}}
    direction: higher
    predicted: fits c*sqrt(N) with c of order 1 and NO dependence on s beyond the
      s ops spent creating; specifically the fitted exponent in N lies in
      [0.45, 0.55]. A fitted exponent below 0.40 at any s contradicts Theorem
      FB-1 and means either the proof is wrong or the harness is leaking discrete
      logs into the created handles.
  - observable: leak check on CREATE
    metric: mutual information proxy -- the measured success rate of an adversary
      that uses ONLY created handles and equality tests, never touching Q
    direction: lower
    predicted: exactly the guessing rate 1/N. A higher rate means the harness's
      CREATE is correlated with k, which would be an implementation defect and
      not evidence about the model.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about two hours, HARD GATE, AND IT IS THE WHOLE
      TEST). Write the four-line proof of Theorem FB-1 and audit it against three
      declared attacks on the argument. (a) THE DEPENDENCE ATTACK: A chooses Pi_j
      adaptively as a function of earlier labels, so the e_j are not independent
      of A's view. Check the standard lazy-sampling order of quantifiers still
      applies. (b) THE COLLISION ATTACK: A calls CREATE with |Pi-preimage| = 1
      twice and gets the same label, learning e_1 = e_2; check that this is a
      formal identity the simulator also produces, so no divergence occurs.
      (c) THE ZERO ATTACK: A calls CREATE with Pi selecting only the identity, or
      a Pi whose preimage is empty; check the model's answer is defined. If any
      of the three breaks the proof, THE RECORD DIES AT ZERO COST, and that is
      the cheapest available discriminator -- no curve, no solver, no run.
      STAGE 1 (toy compute, <= 30 minutes, INSTRUMENT CHECK ONLY, NOT the test of
      the theorem). Implement the four primitives over toy curves at
      p in {2^16, 2^18, 2^20} with N prime, and measure the two predictions above
      that are measurable: the generic relation-finding cost, and the leak check.
      STAGE 2 (zero compute). The taxonomy request and the fidelity audit list.
    controls:
    - >-
      NULL OBJECT (matched, blocking): CREATE with |Pi-preimage| = 1, i.e. a
      primitive that returns the SAME fixed group element every time. It creates
      state, costs the same, and carries provably zero information. Every
      measured quantity must be indistinguishable between this null and a
      full-strength CREATE. If a measured advantage appears for full CREATE but
      not for the null, either the theorem is wrong or the harness leaks.
    - >-
      SECOND NULL, THE OTHER DIRECTION (planted signal, blocking): CREATE_CHEAT,
      which returns a handle TOGETHER with its discrete log. This is outside the
      model and must produce a visible advantage -- with s = L cheating creations
      and one exhaustively-searched relation, k falls out at about N^{1/m}
      operations (this is the IDEA-20260807-7270d1 (D) witness, cited, not
      re-derived). An instrument that cannot see CREATE_CHEAT's advantage cannot
      see any advantage, and every null it reports is void rather than negative.
    - >-
      DECAY PARAMETER: the creation count s on the ladder
      {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}}. Theorem FB-1 predicts the measured
      relation-finding cost is flat in s once s is subtracted. A putative
      advantage that does NOT decay as the ladder is climbed is the canonical
      artifact tell.
    - >-
      Hygiene: factored group order and largest prime factor per curve
      (KN-TECH-030); #E != p (KN-TECH-033); N prime, since the 1/N per-pair
      probability uses primality.
    required_metrics:
    - pass/fail of each of the three Stage-0 proof attacks, individually named
    - fitted exponent of relation-finding cost in N, with confidence interval
    - measured success rate of the null CREATE and of CREATE_CHEAT, side by side
    - the symbolic s = 0 collapse, recorded as a frozen fixture

  controls:
  - >-
    NULL OBJECT: the |Pi-preimage| = 1 CREATE (a constant primitive). Matched on
    cost and on state-creation shape, carrying zero information. Blocking.
  - >-
    PLANTED SIGNAL: CREATE_CHEAT (creation with the discrete log revealed), which
    must break the bound. Blocking in the opposite direction.
  - >-
    Baseline fixture: the s = 0 slice, which must reproduce Shoup symbolically.
  - >-
    Decay ladder in s, as the artifact test.

  confounders:
  - >-
    IDEALISED CREATE VERSUS REAL CREATE. In FB-GGM the created element's discrete
    log is a fresh uniform variable. On a real curve, the point with a given
    x-coordinate has a FIXED discrete log determined by the curve and the base
    point. The theorem is a statement about the model; carrying it to the real
    world requires HA-1 below and the record does not carry it silently.
  - >-
    PREDICATE COST. The model charges one unit per CREATE. A real CREATE costs a
    square-root in F_p plus a curve-equation solve, which is poly(log p) and
    therefore does not change any exponent -- but a Pi that requires solving a
    system (for instance "x is a coordinate of a point in a prescribed
    decomposition") is NOT a CREATE at all, it is a RELATE, and mis-filing one as
    the other would make the theorem appear to prove far more than it does. This
    is the single most likely misreading of this record.
  - >-
    EXHAUSTION. With |Pi-preimage| = L and s > L creations, the adversary sees
    repeats. Repeats give formal identities the simulator also produces, so they
    are harmless, but a harness that silently de-duplicates would change the
    measured counts.
  - >-
    OPERATION-UNIT MISMATCH. Comparing s + g against 0.886*sqrt(N) requires the
    same unit on both sides. A CREATE is not a group operation and pricing them
    equally is a modelling choice, stated here, not a fact.

  falsification_conditions:
  - >-
    Any of the three Stage-0 proof attacks breaks the argument. The theorem is
    false as stated and the record is superseded, at zero compute cost. This is
    the intended cheap death.
  - >-
    The s = 0 slice does not reproduce Shoup's bound exactly. The extension is
    not conservative; a non-conservative extension that reopens closed oracles is
    far more likely an error than a discovery, and the line halts.
  - >-
    A correct derivation makes the bound depend on |Pi-preimage|. Claim (B)'s
    predicate-independence is false and must be re-scoped.
  - >-
    The measured generic relation-finding exponent falls below 0.40 at any rung
    of the s ladder, with the null CREATE and hygiene controls passing. Either
    the theorem is wrong or the model is not the model implemented. Escalate to
    independent review before any record states a number (GOAL-ENDO-001 pause
    condition P3 applies if the implied cost sits below the automorphism-
    discounted rho baseline).
  - >-
    CREATE_CHEAT shows no advantage. The instrument is blind and no null it
    produces is citable.
  - >-
    The Coordinator judges CREATE to be already covered by
    IDEA-20260807-5876b8's cell taxonomy. Then the model is a renaming and the
    only surviving content is the taxonomy split in (E).

  interpretation_limits:
  - >-
    THEOREM FB-1 IS A STATEMENT ABOUT A MODEL, NOT ABOUT ELLIPTIC CURVES. It says
    nothing about whether prime-field ECDLP is hard, and it must never be cited as
    a hardness result.
  - >-
    It does NOT close index calculus. It closes one of the three capabilities
    index calculus uses and explicitly leaves the third (RELATE, the proposed R9)
    wide open, with its cost the campaign's stated open quantity C.
  - >-
    It does not revisit KN-FIND-b7e091, whose incidence and endomorphism-image
    verdicts stand exactly as written and are used here, not re-derived.
  - >-
    The Stage-1 measurements are toy scale (p <= 2^20, one solver, one harness)
    and are instrument checks. The theorem's support is Stage 0 and is
    scale-independent within the model.
  - >-
    Nothing here bears on H-STR-002 or on phi-stable factor bases. No
    equivariance property of any factor base is used, assumed or tested, so this
    record is NOT P2-adjacent. If a reviewer disagrees, pause condition P2
    applies and the record waits.

  assumptions:
  - N prime, so a nonzero linear form over Z/N has exactly one root per free
    variable and the per-pair coincidence probability is exactly 1/N.
  - k uniform in Z/N and independent of the adversary's coins.
  - >-
    Shoup's generic group lower bound is cited in the form Pr[success] =
    O(g^2/N), not reproved (KN-TECH-005).
  - >-
    The CREATE promise (uniform on the Pi-preimage, discrete log withheld) is an
    IDEALISATION and is declared as such. Its fidelity is HA-1.
  - >-
    One primitive invocation is one cost unit. This is a modelling choice and is
    stated, not derived.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      CREATED-POINT LOG UNIFORMITY. Let B = {R in E(F_p) of order N : x(R) in S}
      for a set S subset F_p of size L, and let e(R) = log_P(R). Then the family
      (e(R))_{R in B}, viewed as a subset of Z/N, is indistinguishable from L
      uniform independent draws by any statistic computable in the FB-GGM -- in
      particular, the number of signed m-subsets of B summing to a given target
      is within a constant factor of binom(L,m)/N for all but a o(1) fraction of
      targets.
    rigorous_ingredient: >-
      RIGOROUS PART: the theorem itself needs no independence. Theorem FB-1 is
      proved by a union bound over pairs of formal linear forms, and a union
      bound assumes nothing about the joint distribution of the e_j beyond each
      being uniform, which is exact when CREATE draws uniformly from a set. HA-1
      is used ONLY to argue that the model is FAITHFUL to a real curve -- i.e.
      that the model's conclusion transfers -- and never inside the proof. This
      separation is the reason the record survives HA-1 being false.
    distribution_imitated: >-
      The same statement classical index-calculus analyses make about factor-base
      elements, and of the same shape as the equidistribution assumptions the
      program already uses elsewhere ("this specific integer behaves like a
      uniform integer of its size"). The classical rigorous ingredient in the
      neighbourhood is the Weil bound for character sums over curve points, which
      gives equidistribution of x-coordinates over intervals but NOT, on its own,
      of the discrete logarithms; that gap is exactly what makes this a heuristic
      and it is stated rather than papered over.
    validation_route: >-
      Direct sampling at toy scale, where discrete logs are computable. At
      p in {2^16, 2^18, 2^20} with N prime, take S an interval of size L on the
      ladder L in {N^{1/4}, N^{1/3}, N^{1/2}}, compute e(R) for every R in B by
      brute force, and test (i) equidistribution of e(R) in Z/N by a chi-squared
      test on 64 bins, (ii) absence of short signed relations beyond the count
      predicted by binom(L,m)/N for m in {2,3}, by exhaustive enumeration at the
      two smallest rungs. TAIL CHECK: the count of m-subsets summing to 0
      (self-relations of the base), predicted Poisson with mean binom(L,m)/N; a
      systematic excess is the failure mode that would matter, because it would
      mean prime-field factor bases carry structure the model discards. SAMPLED
      PARAMETERS AND TRANSFER: this validates HA-1 at p <= 2^20 only. Nothing is
      claimed at cryptographic size, where the same assumption is standard in the
      literature and is validated by nothing in this repository.
  - id: HA-2
    statement: >-
      COST-UNIT COMMENSURABILITY. One CREATE on a real curve costs
      poly(log p) field operations, hence is within a (log p)^{O(1)} factor of one
      group operation, so pricing them equally changes no exponent.
    rigorous_ingredient: >-
      Rigorous for the specific CREATE realisations named (choose x in S, solve
      y^2 = x^3 + ax + b by one square root in F_p, cofactor-multiply to order N):
      each is poly(log p) by standard algorithms. It is NOT rigorous for an
      arbitrary predicate Pi, and the record says so: a Pi whose preimage is not
      samplable in poly(log p) is not a CREATE and the theorem does not price it.
    distribution_imitated: none; this is a cost accounting, not a distributional
      assumption.
    validation_route: >-
      Count field multiplications per CREATE directly in the Stage-1 harness at
      three primes and check the growth is (log p)^{O(1)} and not polynomial in p.
      Report the measured ratio CREATE-cost / ADD-cost; if it exceeds
      (log p)^2 the equal pricing is withdrawn and the bound is restated in
      field-operation units.

  proof_search_map:
    bottleneck: >-
      The Schwartz-Zippel step at rank s+2. Everything else in Theorem FB-1 is
      bookkeeping already present in Shoup's proof; the entire novelty and the
      entire risk sit in whether adjoining s adversary-triggered fresh variables
      preserves the "formal distinctness implies divergence with probability
      1/N" step under ADAPTIVE choice of the predicates Pi. Removing that step
      removes the theorem. Zero compute, and it is where all attention belongs.
    baseline_embedding:
      parameter_slice: >-
        s = 0. At this slice FB-GGM is literally Shoup's model and the bound is
        literally Shoup's binom(g+2,2)/N. A second slice: |Pi-preimage| = 1 for
        every CREATE, at which the created handles are formally redundant and the
        bound must again be Shoup's up to the s ops spent.
      reproduction_check: >-
        SYMBOLIC at both slices, checked by substitution and recorded as a frozen
        fixture. Additionally, a REGRESSION check on the campaign's existing
        verdicts: re-derive the KN-FIND-b7e091 Oracle C and Oracle D simulators
        inside FB-GGM and require both verdicts UNCHANGED. Any change to an
        existing verdict halts the line -- a model extension that reopens closed
        oracles is far more likely an error than a discovery.
    observation_collision:
      observable: >-
        The forward/backward word (the tracked object), together with the
        simulator's formal-linear-form state.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, DELIBERATELY. CREATE and CREATE_CHEAT produce
        IDENTICAL forward/backward words and identical simulator states, while
        one preserves the bound and the other destroys it. The observable
        therefore does NOT identify the conclusion by itself, and the separating
        condition is exactly whether the created element's discrete log is
        revealed. Stating that collision is what keeps the record from claiming
        that "backward steps are free" in general -- only DISCRETE-LOG-WITHHOLDING
        backward steps are. A SECOND collision, in the other direction: a
        RELATE step and a CREATE step can both be described in English as
        "obtaining a point from field data", and they have completely different
        verdicts. That collision is the confounder listed above and it is the
        most likely way this record gets misread.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Carry the simulator's variable SET (1, k, e_1, ..., e_s) rather than the
        rank-2 form (alpha, beta) that every previous L12 record carries. The
        stronger state is what survives the operation that matters -- state
        creation -- under which the rank-2 state is simply undefined.
      predicted_gain: >-
        Converts "CREATE is outside our taxonomy" into a bound with the incumbent
        recovered exactly at s = 0. No attack speedup; the gain is that one of the
        three index-calculus capabilities moves from unadjudicated to closed, and
        the remaining open capability is named.
    - transform: boundary_lift
      proposed_object: >-
        Treat Shoup's theorem as the s = 0 boundary of a two-parameter family
        indexed by (g, s), and prove the strict statement for s > 0 rather than
        asserting feasibility.
      predicted_gain: >-
        A two-parameter frontier g + s = Omega(sqrt(N)) in place of a point,
        which is what makes the CREATE/RELATE boundary statable at all.
    quantifier_order: >-
      THE CLAIM, WITH THE ORDER THAT CARRIES THE CONTENT:
        EXISTS a single simulator S (the fresh-variable formal-linear-form
        simulator, fixed once and for all, not depending on Pi), FORALL predicate
        families (Pi_1, ..., Pi_s) CHOSEN ADAPTIVELY BY THE ADVERSARY, FORALL
        adversaries A making g forward and s backward invocations, over uniform k
        and uniform CREATE draws:
          Pr[ A outputs k ] <= binom(g+s+2, 2)/N + 1/N.
      THE ORDER IS THE ARGUMENT. The simulator is quantified FIRST and does not
      depend on Pi; that is what makes the bound predicate-independent, and it is
      the claim a reviewer should attack. The weaker statement "FORALL Pi EXISTS a
      simulator" would be nearly vacuous, because a simulator tailored to Pi could
      be handed the answer.
      NOT CLAIMED, AND THE CONVERSE IS FALSE: that a primitive failing to be a
      CREATE is useful. RELATE fails to be a CREATE and its usefulness is
      undetermined pending C.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In FB-GGM with prime N, uniform k, and CREATE drawing uniformly from a
        declared predicate preimage with the discrete logarithm withheld, any
        adversary making g forward and s backward invocations succeeds with
        probability at most binom(g+s+2,2)/N + 1/N." It can NEVER certify that
        prime-field ECDLP is hard, that index calculus fails, that a real
        factor-base construction is worthless, or anything about an adversary that
        learns a relation. Dropping any of those qualifiers is overclaiming under
        AGENTS.md rule 4.
      nearby_object_control: >-
        CREATE_CHEAT -- creation WITH the discrete logarithm revealed -- is the
        nearest object on which the desired conclusion FAILS, and it fails
        catastrophically: with s = N^{1/m} cheating creations and one relation, k
        is recovered (IDEA-20260807-7270d1 (D)). The method distinguishes the pair
        cleanly, because the proof's Schwartz-Zippel step consumes exactly the
        withheld randomness. A SECOND nearby object: CREATE restricted to a
        predicate whose preimage has size 1, on which the conclusion holds
        trivially -- included so that agreement on the easy case is not read as
        evidence.
    proof_obligations:
    - claim: The fresh-variable simulator is well defined under adaptive Pi.
      responsibility: correctness
    - claim: >-
        Formally distinct linear forms over (1,k,e_1..e_s) coincide at the true
        values with probability exactly 1/N for prime N.
      responsibility: correctness
    - claim: The union bound gives binom(g+s+2,2)/N.
      responsibility: success_probability
    - claim: The s = 0 slice reproduces Shoup and reopens no existing verdict.
      responsibility: baseline
    - claim: The bound is independent of the predicate Pi.
      responsibility: scope
    - claim: >-
        A real CREATE realisation costs poly(log p) field operations, so the
        cost unit is commensurable (HA-2).
      responsibility: runtime
    - claim: >-
        CREATE_CHEAT breaks the bound, so the instrument can see a break.
      responsibility: interface
    - claim: >-
        The record changes no status and requests, rather than makes, the
        taxonomy amendment.
      responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT MOVES AND NONE IS CLAIMED. The record's content is a
      LOWER bound inside a model: g + s = Omega(sqrt(N)) primitive invocations,
      i.e. exponent 1/2 preserved under unlimited free point creation. Against the
      best known attack the delta is exactly zero. Against the campaign's own
      state of knowledge the delta is that one of three index-calculus
      capabilities moves from "unadjudicated" to "closed at 1/2".
    memory_exponent: >-
      The model charges no memory. A real adversary using s creations stores s
      labels, i.e. s*log p bits; at the index-calculus parameter s = N^{1/m} that
      is N^{1/m} log p bits, which is BELOW the sqrt(N) memory of BSGS and above
      the O(1) of rho with distinguished points. The record makes no claim about
      that position because it mounts no attack.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-
      discounted variant on CM curves at a constant factor at most sqrt(6)
      (KN-TECH-018), which is baseline calibration and never an exponent; BSGS at
      sqrt(N) time and sqrt(N) memory (KN-TECH-031). Unmoved by this record.
    hidden_overhead_disclosure: >-
      TWO DISCLOSURES. First, the theorem prices one CREATE at one unit; a real
      CREATE is poly(log p) field operations, so a bound stated in primitive
      invocations hides a (log p)^{O(1)} factor when converted to bit operations.
      Second and much more important, the theorem is about the IDEALISED CREATE.
      Transferring it to a real curve rests entirely on HA-1, and if HA-1 fails --
      if real factor bases carry short-relation structure the model discards --
      the transfer fails while the theorem stands. That would itself be the most
      valuable outcome available here and the validation route is designed to
      look for it.
    time_memory_tradeoff: >-
      Not applicable to the record, which occupies no point on the frontier. For
      the objects it bounds: an FB-GGM adversary sits at (time g+s, memory s), so
      the s = 0 corner is rho's corner and the s = sqrt(N) corner is BSGS's
      corner, and Theorem FB-1 says the whole segment between them is at exponent
      1/2. Parallelisation: forward invocations parallelise as rho does; CREATE is
      embarrassingly parallel; neither changes the bound, which counts
      invocations rather than wall clock.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data.
    Nothing here is an attack and none is claimed. Quantitative content stated
    the other way: the record converts an unadjudicated capability into a bound
    with an explicit constant, binom(g+s+2,2)/N, exact at s = 0; it moves ONE
    campaign object (R1-bwd / factor-base construction) from unadjudicated to
    closed at exponent 1/2; and it isolates exactly ONE remaining capability
    (relation discovery, proposed R9) as the sole unclosed resource in the
    fourteen-lane decomposition. The largest number in the record is the size of
    the reduction in the open space, not a speedup.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked one
    by one, because it is not an attack. Parallel Pollard rho with distinguished
    points at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006)
    dominates it on every axis; the automorphism-discounted variant (KN-TECH-018)
    dominates by a further constant at most sqrt(6); BSGS (KN-TECH-031) at
    sqrt(N) time and sqrt(N) memory dominates it on time and is dominated on
    memory only in the vacuous sense that this record uses none. `null` is not
    available and would be a fabrication under AGENTS.md rule 5.
    AS A MODEL: the incumbent is Shoup's generic group model (KN-TECH-005), which
    dominates this on generality, on citation weight, and on being a theorem of
    record rather than a proposal; this record dominates it on nothing except
    coverage of one primitive it does not define. The nearest live internal
    competitor is IDEA-20260806-530fdd's degree-budgeted AOM_d, which dominates
    on algebraically-specified answer oracles and is dominated here on
    state-creating primitives, which it does not model.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that Theorem FB-1 is correct as stated -- it is a short and standard
    argument and I have written it out, and the residual risk is concentrated in
    the adaptive-Pi step, which is exactly what Stage 0 attacks. 0.55 that a
    reviewer agrees CREATE is genuinely outside IDEA-20260807-5876b8's cell
    taxonomy rather than a rephrasing of cell (b); this is the record's main
    novelty risk and it is a judgement call I cannot make for the reviewer. 0.35
    that the Coordinator adopts the R1 split and the R9 entry. 0.02 that anything
    here leads to an exponent. Priority is HIGH despite that last number because
    the cost is two hours of derivation with no compute, and because the record's
    consequence -- naming the unique unclosed resource -- is what the campaign
    needs in order to stop spending on closed ones.

  novelty_status: adaptation
  novelty_screen: >-
    PERFORMED 2026-08-11 against the committed proposal corpus in
    ledger/proposals/ (146 records under this goal) using the harness Grep tool.
    Patterns and results. (1) `^  question_id: RQ-GGMB-6eaabc` returned 9 records
    -- IDEA-20260807-fd2d89 (canonical-height oracle), -7270d1 (existential width
    Z), -413fcc (zero-information oracle class), -d73e83 (isogeny-transport
    oracle), -569c82 (pairing oracle), -5ddd98 (control catalogue), -63056d (the
    L12 adjudication procedure), -5876b8 (the oracle-framing collapse), -070d03
    (factor-base membership). ALL NINE WERE OPENED AND READ IN PART OR IN FULL;
    -070d03 and -7270d1 were read in full because they are the nearest art.
    (2) `generic group|GGM|Shoup|simulab|simulator|Maurer` case-insensitive over
    ledger/proposals/ returned 166 files, confirming the topic is heavily worked.
    (3) `interpolation|Winterhof|Shparlinski|straight-line program|generic ring`
    returned 72 files, none in this lane and none defining a state-creating
    primitive. (4) knowledge/ was screened for Winterhof / Shparlinski /
    interpolation: only KN-LIT-044 (Nguyen-Shparlinski, HNP) and
    KN-FIND-e7a3b1 (a Shparlinski Fourier-expansion row) exist, neither on
    generic models. FINDING: no record in the corpus defines a primitive that
    RETURNS A HANDLE WITHOUT CONSUMING ONE, and every simulability argument on
    the books is a function of the rank-2 formal linear form (alpha, beta). The
    fresh-variable rank-(s+2) simulator is not present. EXTERNAL NOVELTY IS NOT
    ESTABLISHED: WebSearch and WebFetch both failed this session with a backend
    model error, so no external literature was checked. Sampling / point-creation
    primitives are common in the generic-group literature and this record does
    NOT claim to have invented one; it claims that this campaign has not
    adjudicated one. novelty_status is therefore `adaptation`, not `speculative`.
  discriminated_from: >-
    IDEA-20260807-5876b8 (oracle-framing collapse, four cells) is the nearest
    record. Its dichotomy quantifies over oracles whose answer is a function
    f(lambda(h_1),...,lambda(h_r), public, args) of handles the adversary already
    holds; CREATE takes NO handle argument and returns a handle whose lambda is a
    fresh variable, so it is not in the domain the dichotomy quantifies over.
    Cell (b) ("not simulable but self-computable") is the closest cell and CREATE
    is not in it: CREATE is SIMULABLE, which is cell (a), but with a simulator
    whose state has unbounded rank, which cell (a)'s T_sim accounting does not
    describe. IDEA-20260807-7270d1 (existential width Z) grades ANSWER-valued
    oracles by the size of the candidate set their answer quantifies over; CREATE
    has no candidate set to quantify over and Z is undefined for it, which
    -7270d1's own survival_score field anticipates as a limit of Z. This record
    is complementary to -7270d1 and cites its (D) witness as the planted-signal
    control rather than re-deriving it. IDEA-20260807-070d03 (factor-base
    membership, R1) adjudicates the READ-OUT half of R1 and explicitly states
    that the R1/R2 family "has one generator, x, and it is free"; this record
    agrees, adds that the generator statement covers only the forward direction,
    and closes the backward direction separately -- which -070d03 does not do and
    does not claim to do. IDEA-20260806-530fdd (AOM_d) grades simulator overhead
    by algebraic degree of the oracle's defining variety; CREATE's simulator has
    O(1) overhead at every degree, so AOM_d assigns it no interesting coordinate.
    IDEA-20260807-413fcc (zero-information oracle class) covers oracles taking no
    group handle AND returning no group handle; CREATE takes no handle but
    RETURNS one, which is exactly the case -413fcc excludes. KN-FIND-b7e091 is
    cited as binding, used as a regression fixture, and not revisited.
