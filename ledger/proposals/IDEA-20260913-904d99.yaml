  minimal_test:
    execution_status: design_only
    design: >-
      STAGE-0 FINITE EXACT IDENTITY (named). Freeze p=19, A=1, B=-1 (curve
      y^2 = x^3 + x - 1), and the 2-element set S = {P, [2]P} with
      P = (2, 3) (on-curve: 9 = 8 + 2 - 1). REAL values: Pi = x*y = 6 and
      Pi' = x([2]P)*y([2]P) computed from the affine doubling formulae in F_19,
      recorded as exact field elements. Known-false claim: Pi' = 6
      (invariance of the product). Null object: two independent uniform F_19
      elements' product, not required to match Pi'. Invalid-input reject:
      the point with y=0 on the same curve must reject. Unary-closure cell:
      tabulate (Pi(Q), Pi([2]Q)) for every affine non-singular Q on this
      frozen curve and test functional dependence.
    matched_null: Independent uniform field elements; their product is not the doubling product.
    known_false: Pi' = Pi = 6 on the frozen REAL point (wrong-value invariance).
    controls:
      - kind: matched_null
        design: Random field products with no group law.
      - kind: known_false
        design: Claim Pi' = 6 on P=(2,3)/F_19.
      - kind: invalid_input
        design: y=0 rejects.
      - kind: baseline
        design: Identity projection (retain (x,y)) has unary closure trivially and is the lossless control. Random-label  F_19 tags are the generic-group control.
      - kind: pgl2_reparametrisation
        design: One public affine change of x; if unary closure appears only in one chart, it is chart artifact.
    required_metrics:
      - product_identity_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      REAL Pi and Pi' must match independent recomputation from the group law.
      Known-false invariance must fail (or the frozen P is replaced and the
      replacement recorded). Unary closure is a separate yes/no on this curve
      only. No exponent claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect.
      - No run is authorized here.
    required_artifacts:
      - frozen (p, A, B, P, [2]P, Pi, Pi') manifest
      - REAL / known-false / null / invalid outcomes
      - optional full-curve (Pi, Pi') table
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: requires a new approved frozen handoff
  falsification_conditions:
    - REAL Pi' disagrees with an independently recomputed [2]P product (procedure defect).
    - Unary F exists and the PGL_2 null reproduces it (chart artifact).
    - A later walk gain that matches the random-label control is an artifact.
    - Scope is the frozen p=19 curve and its affine census only.
  confounders:
