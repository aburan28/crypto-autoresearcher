idea:
  id: IDEA-20260913-904d99
  title: Affine product xy as a lossy joint coordinate under doubling
  class: representation
  claim: >-
    The single field element Pi(P) = x(P)*y(P) is a lossy R1 projection of an
    affine short-Weierstrass point (it discards the ratio y/x). Paired with
    Sigma={[2]}, either (A) Pi([2]P) is a rational function of Pi(P) alone, so
    the fibres are a block system of <[2]>, or (B) Pi does not close and is a
    branching / retained-point object priced by (L, b). KN-FIND-ffe1df lists
    joint (x,y) nonlinear members (including xy) as not closed as
    sum-compatible filters under translation; this proposal asks the different
    question of doubling-compatibility. Stage-0 is a frozen 2-element product
    identity. No exponent gain is claimed. Attack stage targeted: collision
    structure.
  mechanism: >-
    Representation: affine coordinates (x, y) (R1), tracked object Pi = x*y.
    Operation set Sigma = {[2]}, not full translation. Trichotomy class:
    coordinate-dependent -- Pi is a function of the affine chart and is not a
    homomorphism of the group (Theorem C of KN-FIND-ffe1df forbids an exact
    sum-compatible bucket of this shape). One-line reason: xy is a bilinear
    chart polynomial, not a class function of <P>. R1 class. Attack stage:
    collision structure (whether Pi is a closed doubling-compatible predicate).

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: the ratio
    y/x (equivalently one of the two affine coordinates given the on-curve
    equation, up to sign of y once x is known — here both x and y are dropped
    except for their product). The inventor-protocol section 2 example
    (Delta, Pi) = (x+y, x*y) loses nothing in characteristic 2 because {x, y}
    are the roots of t^2 + Delta t + Pi. Retaining ONLY Pi, and working in
    odd characteristic, is genuinely lossy: the fibre over a typical value is
    a curve-cut of dimension 0 and size greater than 1. Discard compatibility:
    doubling supplies explicit formulae x' = lambda^2 - 2x,
    y' = lambda*(x - x') - y, lambda = (3x^2+A)/(2y), so Pi' = x'*y' is a
    rational function of (x, y), hence of the retained point. Compatibility
    with Sigma as a unary map on Pi alone is exactly the question Outcome A
    versus B. If A, fibres of Pi are a block system of <[2]> and the open
    number is orbit-canonicalisation cost from the Pi label. If B, measure
    (L, b) against identity, random-label, and relabelled Z/NZ.

    Not F2: no factor base, no Semaev. Not the Hessian x+y degree-2 coordinate
    of IDEA-20260807-dadcd2 (that is a Kummer-class function to P^1). Not the
    lossless (Delta, Pi) pair. KN-OPEN-020 does not apply.
