idea:
  id: IDEA-20260809-0ca459
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    Batch verification is structurally cofactored, so its acceptance set is a
    strict superset of strict single verification — witnessed, not argued
  class: mechanism
  claim: >-
    The standard batch verification equation aggregates signatures with random
    scalars and is checked once in the group; the aggregation makes it
    insensitive to exactly the torsion components that distinguish cofactored
    from cofactorless verification. The claim is that there exists a batch whose
    aggregate check PASSES while at least one member fails strict single
    verification — a literal certificate — and, symmetrically, that no batch
    passes while a member fails for a non-torsion reason.
  mechanism: >-
    Construct a batch containing one honest triple and one triple perturbed by a
    torsion element. If the aggregation multiplies through by the cofactor, or
    if the random scalars are drawn from a range that annihilates the torsion
    contribution, the aggregate equation is blind to the perturbation.
  why_not_a_renamed_known_approach: >-
    That batch and single verification can disagree is folklore. The record's
    content is a CERTIFICATE plus a statement of the exact structural reason,
    and a check of the converse direction, which folklore does not address:
    whether a batch can pass while a member fails for a reason unrelated to
    torsion.
  predictions:
  - observable: existence of a batch passing aggregate verification with a member failing strict single verification
    metric: boolean plus the certificate bytes
    predicted: Exists. Non-existence would be a genuinely surprising and valuable negative result.
  - observable: the converse -- a batch passing with a member failing for a non-torsion reason
    metric: boolean
    predicted: Does not exist within the enumerated class; the aggregate check should be sound against non-torsion perturbations up to the random scalars' soundness error.
  minimal_test: >-
    Implement batch verification from the specification, validate on batches of
    honest signatures, then insert one torsion-perturbed member and record both
    verdicts. Sweep batch size and the random-scalar bit length, since the
    soundness error depends on the latter. Emit the certificate.
  controls:
  - 'ALL-HONEST CONTROL: batches of honest signatures must pass, and single verification of each member must pass under every reading.'
  - 'GARBAGE-MEMBER CONTROL: a batch containing a random invalid signature must fail; if it passes, the batch implementation is broken.'
  - 'SCALAR-LENGTH SWEEP: the random scalar bit length is the soundness parameter and must be varied, since a divergence that appears only at a truncated scalar length is an implementation artifact rather than a property of the equation.'
  falsification_conditions:
  - No torsion-perturbed member is accepted in a batch that a strict verifier rejects.
  - The divergence appears only for scalar lengths outside the specified range, making it an artifact.
  interpretation_limits: >-
    A batch/single divergence is a statement about two verification procedures.
    It says nothing about the difficulty of forging a signature, and no record
    may present it as an attack on the scheme.
  sota_delta: 'No attack. Delta: a certificate and an exact structural account where the literature has a caution.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for batch verification: no EdDSA records. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 -- REQUIRED READ, NOT YET READ.
