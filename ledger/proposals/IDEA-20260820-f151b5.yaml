idea:
  id: IDEA-20260820-f151b5
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Certified likelihood branch-and-bound over SQIsign ideal fibres
  class: proof-oriented algorithm proposal
  claim: >-
    Conditional on an explicitly specified finite candidate fibre, calibrated
    candidate-conditioned transcript laws, and valid node upper bounds, a
    branch-and-bound procedure can return a coverage-auditable top-k list of
    ideals together with public-curve reproduction witnesses. This is a testable
    algorithmic proposal, not a leakage, recovery, or complexity result.
  corrects: IDEA-20260820-5370ca
  supersedes: null
  correction: >-
    Preserves the predecessor's certificate-carrying likelihood search, finite
    candidate boundary, and public witnesses. It repairs citation metadata on
    every internal or knowledge-base source and removes the unsupported claim
    that a GRH boundary binds this card. KN-TECH-058 supplies only inherited and
    unverified reduction caveats here and no verified GRH claim for this card.
  mechanism: >-
    Fix a finite, publicly reproducible ideal fibre C(E_A) and a factorized
    candidate score S_q(I) from q public transcripts. Partition C(E_A) into a
    search tree. Each node carries a proved upper bound U(v) on every descendant
    score. Expand the live node with maximal U(v), retain the k best witnessed
    leaves, and stop only when their kth score exceeds every unexplored bound.
    Each output includes an ideal and the deterministic conversion data needed
    to reproduce the public curve. Tiny instances are also enumerated
    exhaustively to audit both scores and pruning certificates.
  novelty_status: unverified
  status: proposed
