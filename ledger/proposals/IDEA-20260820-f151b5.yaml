  predictions:
    - id: P1
      statement: >-
        On exhaustive toy fibres, every pruned node upper bound dominates the
        maximum exact descendant score with zero violations across all trials.
      metric: upper-bound violations
      threshold: exactly 0
      test_boundary: finite toy fibres with exhaustive descendant enumeration
    - id: P2
      statement: >-
        In a planted family whose true ideal has per-transcript mean log-score
        advantage at least 0.08, median visited leaves are at most 0.50 times
        exhaustive enumeration by q = 128 while empirical list coverage is at
        least 0.95 with a two-sided 95 percent interval reported.
      metric: visited-leaf ratio and planted-ideal coverage
      threshold: ratio <= 0.50 and coverage >= 0.95
      test_boundary: calibrated planted distributions, q <= 128
    - id: P3
      statement: >-
        Under the genuine simulator null, any apparent top-k advantage over
        exchangeable labels remains within the preregistered 0.05 family-wise
        error rate and does not persist as q increases.
      metric: family-wise false contraction rate
      threshold: <= 0.05
      test_boundary: matched true-simulator transcripts
  controls:
    - genuine-simulator null with candidate labels permuted before scoring
    - planted positive with a continuously tunable log-score advantage from 0 to 0.08
    - exhaustive baseline reproducing every leaf score and the exact top-k list
    - deliberately invalid node bound that must be detected by exhaustive auditing
    - nearby public curves with identical fibre size but independently randomized scores
    - public-curve reproduction check for every returned ideal witness
  falsification_conditions:
    - any admissible-bound violation on the declared finite test boundary
    - true-simulator false contraction exceeding 0.05 after multiplicity correction
    - failure to reproduce the public curve from any returned certificate
    - no pruning gain at the stated planted separation and q boundary
  confounders:
    - candidate enumeration may omit the planted or actual ideal
    - score calibration error can masquerade as transcript information
    - shared preprocessing can make leaf scores non-independent
    - representation multiplicity can create duplicate leaves
  interpretation_limits:
    - no claim that a practical SQIsign candidate fibre can be enumerated
    - no claim that real signing transcripts differ from a true simulator
    - no EndRing, OneEnd, path-finding, key-recovery, or security conclusion
    - KN-TECH-058 reductions remain inherited and unverified; no GRH support is claimed
  heuristic_assumptions:
    - the declared candidate fibre contains the target ideal
    - candidate-conditioned score factors are calibrated on disjoint data
    - node upper bounds are proved for the exact score used
  target_complexity:
    baseline: exhaustive evaluation of N candidate ideals costs Theta(N q)
    proposed: output-sensitive search; no asymptotic improvement claimed before proof
    success_probability: explicitly measured coverage of the returned finite list
  cost_model:
    time: score evaluation plus all expanded-node bound computations
    memory: frontier, k retained leaves, and witness material
    data: q public transcripts plus disjoint calibration transcripts
    preprocessing: finite fibre construction, tree construction, and score calibration
    oracle_access: no secret or timing oracle; public transcript access only
    verification: exhaustive tiny-instance audit and public-curve reproduction per output
  proof_search_map:
    baseline_reproduction: reproduce exhaustive scores and top-k exactly on every toy fibre
    observation_collision_search: search for distinct ideals with identical score vectors and retain both
    quantifier_order: fix fibre, calibration law, q, k, and confidence before drawing transcripts
    method_ceiling: derive worst-case N-node expansion and exhibit a flat-score family attaining it
    nearby_object_control: run identical pruning on randomized score trees where no candidate signal exists
  nearest_neighbors:
