idea:
  id: IDEA-20260901-c75e81
  question_id: RQ-RSA-d46f02
  research_question: RQ-RSA-d46f02
  goal_id: GOAL-RSA-002
  added: '2026-09-01'
  title: >-
    THE DIMENSION COST OF APPROACHING A SMALL-ROOT BOUND HAS AN EXPONENT AND
    NOBODY QUOTES IT: under the exact determinant criterion the loss eps(D)
    below the asymptotic reach scales as D^{-1/e}, with e = 1 for univariate
    shift lattices (constant beta(1-beta), derived in-record and reproducing
    Coppersmith's limit at D to infinity) and e = 2 predicted for
    Boneh-Durfee-type bivariate lattices, because the finite-dimension bound
    is a Riemann-sum discretisation of the continuous exponent optimisation
    over an integer grid of shift exponents -- so every published sublattice
    trick is predicted to move the constant and not e; compute e at zero
    compute for four constructions, measure the operative e on known-answer
    instances, and treat any construction with a smaller e as an exponent
    result about the cost of reaching a stated leakage fraction
  class: mechanism

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE OBJECT. For a small-root construction C
    with asymptotic reach exponent u_inf (the published limit bound, taken
    from the KN-LIT filing GOAL-RSA-002's next_action requires, not from
    memory), define D_HG(eps; C) as the smallest lattice dimension at which
    the EXACT Howgrave-Graham determinant criterion -- evaluated as an exact
    rational inequality on the actual constructed basis, with the LLL factor
    2^{(D-1)/4} and the sqrt(D) term included -- certifies reach u_inf - eps.
    Define the dimension exponent e(C) as the limit of log D_HG(eps) /
    log(1/eps) as eps to 0. This is a property of the construction, computable
    at zero compute, and it is the quantity that turns 'for sufficiently large
    lattice dimension' into a number. (B) THE UNIVARIATE DERIVATION, DONE IN
    THIS RECORD AND CHECKABLE IN EXACT RATIONALS. For the standard
    approximate-divisor shift set {N^{m-i} f^i, i = 0..m} union {x^j f^m,
    j = 1..t}, f(x) = p0 + x, divisor p >= N^beta, D = m + t + 1, the
    determinant is N^{m(m+1)/2} X^{D(D-1)/2} and the criterion, written in
    log_N and ignoring the two constant-bit terms, reads
    m(m+1)/(2D) + ((D-1)/2) log_N X < beta m. Optimising m at fixed D gives
    m = beta D - 1/2 and log_N X < beta^2 - (beta - beta^2 - 1/(4D))/(D-1).
    Hence eps(D) = beta(1-beta)/(D-1) + O(1/D^2), the limit is beta^2
    (Coppersmith's bound, half the bits of p at beta = 1/2), and e = 1 with
    constant beta(1-beta). In BITS at modulus size n the predicted loss is
    n beta(1-beta)/(D-1) plus a constant of at most about one bit from the
    LLL and sqrt(D) terms: at beta = 1/2 that is n/(4(D-1)) bits. (C) THE
    BIVARIATE PREDICTION. For Boneh-Durfee-type lattices the shift exponents
    (i, j) range over a two-dimensional integer region of size Theta(m^2), so
    D = Theta(m^2) and the discretisation error of the two-dimensional
    Riemann sum is O(1/m) = O(D^{-1/2}); hence e = 2 is predicted for the
    full Boneh-Durfee lattice, for its non-square 0.292 sublattice, for
    Herrmann-May unravelled linearisation, and for the low-rank alternatives
    of Ryan's known-moduli method, each of which is predicted to change the
    constant only. (D) THE OPERATIVE EXPONENT. On known-answer instances the
    smallest D at which the declared reducer reaches u_inf - eps on 90 percent
    of instances defines D_op(eps), and e_op is its exponent. The claim is
    that e_op = e_HG within 0.15 at D <= 100 for the univariate family
    (reduction costs a constant number of bits, not a growing fraction), and
    the competing explanation -- that e_op exceeds e_HG because reduction
    quality degrades with D and bit-size -- is exactly what the measurement
    would show instead, and would be the more consequential finding for
    RQ-RSA-d46f02. (E) WHAT IS NOT CLAIMED. No small-root BOUND moves: u_inf
    is untouched and every published bound stands. No attack. e is an
    exponent of the COST of approaching a bound, and a construction found
    with e < 2 for a bivariate problem would be an exponent result about that
    cost, not about RSA. The general statement 'e is forced by the integer
    grid for every standard construction' is a CONJECTURE stated as
    motivation; the claims tested are for the four named constructions.

  mechanism: >-
    Every published small-root bound is the limit of a finite optimisation:
    choose integer shift exponents, compute log det / D as an average over
    the shift set, compare with the modulus-power exponent, and let the
    dimension grow. In the limit the average becomes an integral over a
    continuous region of exponent space and the bound is the value of that
    integral optimisation. At finite D the average is a Riemann sum over a
    grid of spacing 1/m in each exponent direction, and the difference
    between a Riemann sum and its integral is of the order of the grid
    spacing. In one exponent dimension D = Theta(m) so the loss is
    Theta(1/D); in two exponent dimensions D = Theta(m^2) so the loss is
    Theta(1/m) = Theta(D^{-1/2}). Sublattice tricks delete rows whose
    contribution to the average is unfavourable, which changes the region
    and the constant but not the grid spacing, hence not e. The LLL
    approximation factor 2^{(D-1)/4} and the sqrt(D) term enter the
    criterion as an additive (D-1)/4 + log_2(sqrt D) bits against a
    coefficient of (D-1)/2 on log_2 X, and so cost a constant of about one
    half bit of X plus a vanishing term -- which is why the determinant
    criterion, not the reducer, sets the exponent, and why e_op is predicted
    to match e_HG unless reduction quality itself degrades with D. The
    derivation in claim (B) is the univariate instance of this mechanism and
    is the record's zero-compute falsifier: if the exact rational evaluation
    of D_HG(eps) on the actual basis does not give slope 1 on a log-log plot
    with constant beta(1-beta), the mechanism is wrong before any lattice is
    reduced.

  novelty_status: unverified

