  novelty_screen:
    method: >-
      Filesystem and ledger screening plus web search. Read the fourteen
      RQ-RSA-d46f02 proposals by title and seven claim blocks in full; listed
      the ten EXP-RSAPI contracts; read KN-TECH-015, KN-LIT-7566, KN-LIT-7659.
      Web: searched for asymptotic-bound computation in Coppersmith's method
      and retrieved the abstracts of the sumset-theory (CRYPTO 2025), linear
      programming (2026), known-moduli (EUROCRYPT 2025), focus-groups and
      AASW optimality papers; searched for practical small-private-exponent
      records (ePrint 2023/367 abstract retrieved, which notes the 0.292
      bound is hard to reach because of lattice dimension and reduction
      limits but does not state a dimension exponent).
    results: >-
      Every retrieved source computes or improves the LIMIT bound or reports
      a practical record at some dimension; none defines or reports the rate
      at which the finite-dimension bound approaches the limit as an
      exponent in D. The Riemann-sum reading of the finite-D loss is standard
      intuition in the field and almost certainly appears in some lecture
      notes; the derived constant beta(1-beta) for the approximate-divisor
      family is elementary and may appear in a thesis. The e = 2 prediction
      for bivariate families and the prediction that sublattice tricks leave
      e unchanged were not found stated anywhere opened this session.
    verdict: >-
      UNVERIFIED. The object (the dimension exponent e) and the two
      predictions are not in any opened source; the univariate derivation is
      elementary and may be known. The retrieval index was empty. Unverified
      is the only permissible label.

  object_first_candidate:
    tracked_object: >-
      THE DIMENSION EXPONENT e(C) OF A CONSTRUCTION, read off the boundary of
      the exact determinant-criterion region along the dimension axis, and
      its operative counterpart e_op measured on known-answer instances.
      Established families declared OFF-LIMITS as the primary lens: limit
      bound computation, shift-set design for a better limit, reducer
      tuning. This record asks how fast a construction gets where it is
      going, not where it goes.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. From the full cell table (n, D, u)
      -> success, the object retains one scalar per construction, the
      log-log slope of the G boundary, discarding the constant and every
      finite-size detail. It is compatible with the operations that generate
      the table: enlarging the shift set along the same grid moves D and eps
      together along the same power law, and the slope is invariant under
      rescaling n. It is not a change of coordinates: two constructions with
      the same e and different constants are identified by the projection,
      which is exactly the collapse the record predicts for sublattice
      tricks.
    propagation: >-
      ONE-STEP PROPAGATION: adding one row to the shift set changes D by one
      and log det by the new row's diagonal exponent; the predicted change in
      the certified reach is the derivative of the closed form,
      beta(1-beta)/(D-1)^2 in exponent units for the univariate family. The
      record measures that increment cell by cell as the first test of the
      closed form.
    survival_score: >-
      Survives for every construction whose shift exponents live on an
      integer grid of fixed dimension, which is every standard Coppersmith
      construction. Dissolves at constructions with mixed moduli or
      fractional effective exponents, where the grid argument does not apply
      and e is undefined by this route; those are named as the open class.
      Also dissolves as an OPERATIVE statement wherever reduction quality
      degrades with D faster than a constant number of bits, which is the
      competing explanation and the interesting outcome for the RQ.

  proof_search_map:
    bottleneck: >-
      The unquantified clause 'for sufficiently large lattice dimension' in
      every published small-root bound. Replacing it by D = Theta(eps^{-e})
      with a computed e and constant is the step that turns the asymptotic
      frontier into a dimension-charged one, which is GOAL-RSA-002's
      objective in one number.
    baseline_embedding:
      parameter_slice: >-
        D to infinity in the closed form of claim (B): the certified reach
        exponent must tend to beta^2 exactly, which at beta = 1/2 is
        Coppersmith's half-the-bits bound as stated in KN-TECH-015's
        description of the method. At finite D the exact rational evaluation
        on the constructed basis must agree with the closed form to O(1/D^2).
      reproduction_check: >-
        SYMBOLIC AND EXACT: evaluate the determinant criterion as a rational
        inequality on the actual basis for D from 5 to 1000 at beta = 1/2,
        solve for the certified log_2 X in bits at n = 1024, and check (i)
        the limit n/4, (ii) the residual against n/(4(D-1)) is O(n/D^2),
        (iii) the log-log slope of D_HG(eps) against 1/eps is 1.00 +- 0.02
        over the last decade of D. A frozen fixture of these values is
        committed before any lattice is reduced.
    observation_collision:
      observable: >-
        The exponent e and the constant c in eps(D) = c D^{-1/e}.
      distinct_preimage_search: >-
        A COLLISION IS PREDICTED AND IS THE POINT: the four bivariate
        constructions are predicted to share e = 2 and differ in c, so e
        alone cannot identify the construction. That is not a defect -- it is
        the claim that sublattice tricks are constant-level -- and the
        separating invariant is c, which is reported beside e. A SECOND
        collision that would be a defect: a construction whose e_HG is 2 but
        whose fitted slope over an affordable D range reads below 2 because
        the asymptotic regime is not reached; guarded by requiring the fit
        over at least one decade of D and reporting the local slope as a
        function of D, not a single number.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The Riemann-sum measure: for each construction, the exact gap
          between the finite-D average of diagonal exponents and its integral
          limit, packed over the shift rows as disjoint blocks and reported
          as a function of D.
        predicted_gain: >-
          A construction-specific closed form for eps(D) that every measured
          reach curve in this bucket can be compared against at zero compute.
      - transform: boundary_lift
        proposed_object: >-
          Treat the integer exponent grid as the boundary case and ask what
          family enlarges it: constructions using two moduli (N and e in
          partial-key-exposure settings) or auxiliary known multiples, whose
          effective exponents are not confined to a single grid.
        predicted_gain: >-
          Named as the open class only; no gain is claimed and no such
          construction is proposed here.
    quantifier_order: >-
      FOR EACH of the four named constructions there EXISTS an exponent e and
      constant c such that D_HG(eps) = (c/eps)^e (1 + o(1)) as eps to 0; the
      witnesses depend on the construction and on nothing else -- not on n,
      not on the instance, not on the reducer. The operative statement
      quantifies additionally over the declared reducer and budget and over
      the tested n, and is asymptotic in nothing: e_op is a fitted slope over
      a declared D range and is reported as one. The conjecture that e is
      forced for ALL standard constructions is NOT claimed at any quantifier
      order.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: e and c for the four enumerated constructions under the
        exact determinant criterion, and a measured e_op on one univariate
        construction over a declared grid. It cannot certify e for a
        construction not enumerated, cannot certify that no construction
        with smaller e exists, and moves no bound.
      nearby_object_control: >-
        THE FIXED-RANK LINEARISATION LATTICE. Linearising N = (p0 + x)(q0 + y)
        into one linear equation in (x, y, xy) gives a lattice of rank
        bounded independently of any parameter, whose certified reach does
        NOT improve with D at all: eps(D) does not tend to zero and e is
        undefined. The machinery must return exactly that on this object; a
        method that reports a finite e for the fixed-rank lattice has not
        identified the load-bearing structure.
    proof_obligations:
      - claim: >-
          The determinant of the approximate-divisor shift lattice is
          N^{m(m+1)/2} X^{D(D-1)/2} for the declared shift set.
        responsibility: correctness
      - claim: >-
          The closed form eps(D) = beta(1-beta)/(D-1) + O(1/D^2) follows from
          the criterion with m = beta D - 1/2, and its limit is beta^2.
        responsibility: baseline
      - claim: >-
          The LLL and sqrt(D) terms cost at most about one bit of X at every
          D, computed exactly.
        responsibility: size
      - claim: >-
          D = Theta(m^2) for each bivariate construction enumerated, with the
          constant stated per construction.
        responsibility: correctness
      - claim: >-
          The fitted slope is taken over at least one decade of D and the
          local slope is reported as a function of D.
        responsibility: strictness
      - claim: >-
          e_op is measured at the declared reducer and budget on known-answer
          instances and is reported beside e_HG, never in its place.
        responsibility: interface
      - claim: >-
          No bound, no attack, no deployed-key statement, four constructions
          only.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The constructions' shift sets are taken from the KN-LIT filings
      GOAL-RSA-002's next_action requires; the univariate closed form in
      claim (B) is derived in-record for the standard approximate-divisor
      shift set and must be re-derived against the filed primary text before
      it is used as a prediction.
    - >-
      Exact rational arithmetic is available (Python fractions) for the
      zero-compute arm; a reducer with flatter-class performance is available
      for the operative arm up to D of about 100 at n up to 1024.
    - >-
      Known-answer instances with recorded seeds, per RQ-RSA-d46f02.

  predictions:
    - metric: >-
        univariate_HG_slope: log-log slope of D_HG(eps) against 1/eps for the
        approximate-divisor construction, exact rational evaluation, D from
        50 to 1000
      direction: different
      minimum_effect: >-
        1.00 +- 0.02, with constant within 5 percent of beta(1-beta) = 1/4 at
        beta = 1/2. Any other slope falsifies the derivation at zero compute
        and the record terminates.
    - metric: >-
        univariate_bits_lost: certified window loss in bits at n = 1024 and
        n = 2048, D in {17, 33, 65, 129}, exact
      direction: different
      minimum_effect: >-
        n/(4(D-1)) plus a constant between 0 and 2 bits, i.e. at n = 2048
        about 16, 8, 4, 2 bits respectively. This is the zero-compute
        prediction of the gap GOAL-RSA-002 exists to measure, for the
        determinant criterion alone.
    - metric: >-
        bivariate_HG_slope: the same slope for the full Boneh-Durfee lattice,
        its 0.292 sublattice, Herrmann-May unravelled linearisation, and the
        Ryan low-rank alternative, exact evaluation over m from 4 to 40
      direction: different
      minimum_effect: >-
        2.0 +- 0.15 for all four, with four DIFFERENT constants c. A slope
        below 1.85 for any of them falsifies claim (C) for that construction
        and is a positive finding about the dimension cost.
    - metric: >-
        operative_exponent_gap: e_op minus e_HG for the univariate
        construction at the declared reducer, D from 20 to 100, n in {512,
        1024}
      direction: different
      minimum_effect: >-
        Within 0.15. A gap above 0.3 means reduction quality degrades with D
        faster than a constant number of bits on these lattices, which
        contradicts the constant-bits reading in the mechanism and is the
        more consequential result for the RQ; it must then be attributed by
        IDEA-20260901-c5e859's shape/reduction split.
    - metric: >-
        fixed_rank_control: certified reach of the linearisation lattice
        against D
      direction: different
      minimum_effect: >-
        FLAT -- no improvement with D, e undefined. Any fitted finite e here
        means the fitting procedure manufactures exponents and every other
        slope is void.

  minimal_test:
    design: >-
      TWO ARMS. ZERO-COMPUTE ARM (minutes): for each of the five objects (the
      univariate construction, the four bivariate constructions) build the
      shift set symbolically, evaluate the exact determinant criterion as a
      rational inequality on the actual basis for a ladder of D, solve for
      the certified reach, compute eps(D), fit the log-log slope over at
      least one decade of D, report e_HG and c per construction together
      with the local slope as a function of D; run the fixed-rank
      linearisation control through the identical procedure and confirm it
      returns no exponent. OPERATIVE ARM (hours): on known-answer instances
      at n in {512, 1024}, D in {20, 30, 50, 70, 100}, for the univariate
      construction only, find by bisection the largest window at which 90
      percent of ten seeded instances succeed under the declared reducer,
      convert to eps_op(D), fit e_op, and report the gap to e_HG with the
      per-cell shape/reduction attribution of IDEA-20260901-c5e859 attached
      wherever a cell failed. Every run charges wall time, peak memory and
      achieved root-Hermite factor in the shared convention.
    controls:
      - >-
        BASELINE LIMIT (blocking): the univariate closed form must tend to
        beta^2 and match the exact rational evaluation to O(1/D^2).
      - >-
        FIXED-RANK NULL (blocking): the linearisation lattice must return no
        exponent.
      - >-
        DECADE RULE: no slope is reported from fewer than ten-fold range in
        D; the local slope is reported as a curve.
      - >-
        CONSTANT-SEPARATION CHECK: the four bivariate constants must differ
        by more than the fit error, otherwise the constant-level claim is
        not distinguishable from 'identical constructions'.
      - >-
        PRE-REGISTRATION: shift sets, D ladders, seeds, success threshold and
        reducer frozen in a committed file with hash before any run.
    required_metrics:
      - e_HG and c per construction with fit intervals, and the local slope curve
      - certified bits lost at n in {1024, 2048} and D in {17, 33, 65, 129} for the univariate construction
      - e_op with fit interval and the gap to e_HG
      - per-cell success rate, wall time, peak memory, achieved root-Hermite factor
      - fixed-rank control output
      - frozen protocol hash, seeds, artifact manifest with rebuild receipt

  falsification_conditions:
    - >-
      ZERO COMPUTE, PRIMARY FALSIFIER: the univariate exact evaluation does
      not give slope 1 with constant near beta(1-beta), or does not tend to
      beta^2. The derivation is wrong and the record is withdrawn.
    - >-
      The fixed-rank control returns a finite exponent. The fitting procedure
      is broken and no slope may be reported.
    - >-
      A bivariate construction returns e_HG below 1.85 over a decade of D.
      Claim (C) fails for that construction; the finding is that the
      construction has a smaller dimension cost exponent, which is reported
      as the positive result it is, with the construction named.
    - >-
      e_op exceeds e_HG by more than 0.3 on the univariate construction. The
      constant-bits reading of reduction is wrong on these lattices at these
      sizes; the record reports the gap and hands the cause to c5e859.
    - >-
      Reduction at D = 100, n = 1024 exceeds the campaign budget. The
      operative arm is scoped down to the largest feasible D; this is a
      budget outcome and says nothing about e.

  confounders:
    - >-
      PRE-ASYMPTOTIC SLOPES. Over a short D range the local slope can read
      anything. MITIGATION: decade rule and the local-slope curve.
    - >-
      SHIFT-SET PARAMETRISATION. The bivariate families have two free
      parameters (m, t) and the optimal t/m ratio shifts with D; a bad t
      choice inflates c and can bias the slope. MITIGATION: optimise t at
      each m exactly in the zero-compute arm and record the chosen ratio.
    - >-
      SUCCESS THRESHOLD. e_op depends on the 90 percent threshold through
      the transition width IDEA-20260816-c9e5d2 measures. MITIGATION: report
      e_op at 50 and 90 percent and cite c9e5d2's width.
    - >-
      BIT-SIZE GROWTH. Entries grow like m n bits, so LLL precision effects
      grow with D and n together; a precision artefact would look like a
      reduction effect. MITIGATION: IDEA-20260816-7d747d's precision arm is
      the control; run the D = 100 cells at two precisions.
    - >-
      ALGEBRAIC INDEPENDENCE in the bivariate operative case is NOT tested
      here; the operative arm is univariate only, precisely to avoid that
      heuristic.

  interpretation_limits:
    - >-
      CLAIM TIER: statements about the determinant criterion of named
      constructions and about one construction's behaviour under a declared
      reducer on known-answer instances. Nothing about any deployed key.
    - >-
      e_HG is a property of a SUFFICIENT condition; a construction can
      succeed at a cell the criterion does not certify, and
      IDEA-20260816-684f4a's undecided band is exactly that. e_op is the
      operative quantity and the two are reported side by side.
    - >-
      The conjecture that the integer grid forces e for every standard
      construction is motivation, not a claim; only the enumerated
      constructions are covered.
    - >-
      The bits-lost prediction at 2048 bits is a prediction of the
      determinant criterion at the stated D and is conditional on the shift
      set matching the filed primary text; it is not a measurement until the
      operative arm runs at that size.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CONSTANT-BIT REDUCTION LOSS. For the univariate construction, the
        declared reducer returns a first vector whose scaled norm is at most
        2^{a D + b} det^{1/D} with a <= 1/4 (the LLL guarantee) and, in
        practice, with an achieved a_op that is stable in D over the tested
        range, so that reduction costs at most (a_op D + b)/((D-1)/2) bits of
        the window, a quantity bounded by a constant.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the LLL guarantee ||b_1|| <= 2^{(D-1)/4}
        det^{1/D}, which already yields a constant-bit loss. CLASSICAL
        STATEMENT IMITATED: the empirical stability of LLL's root-Hermite
        factor with dimension on random lattices. THE GAP: on Coppersmith
        lattices with entries of m n bits and D up to 100 the practical
        reducer may lose precision or hit its own dimension limits, in which
        case a_op grows with D and the loss is no longer constant; that is
        the competing explanation and the operative arm measures it.
      validation_plan: >-
        SAMPLE: achieved root-Hermite factor per cell on every operative-arm
        cell, ten seeds, n in {512, 1024}, D in {20, 30, 50, 70, 100}.
        SHORTCUT: none needed. COMPARISON: a_op against D, fitted for a trend;
        the null is a flat line. TAIL CHECK: the largest a_op observed against
        the LLL guarantee 1/4, which it may not exceed. TRANSFER: no
        extrapolation of a_op beyond D = 100 or n = 1024.
    - id: H2
      statement: >-
        RIEMANN-SUM RATE FOR BIVARIATE FAMILIES. For each enumerated
        bivariate construction, the difference between the finite-m average
        of diagonal exponents over the shift region and its continuum limit
        is Theta(1/m), with the constant determined by the boundary of the
        region.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the standard error bound for a Riemann sum of a
        smooth function over a region with piecewise-smooth boundary is
        O(grid spacing). CLASSICAL STATEMENT IMITATED: none needed; this is
        analysis, not probability. THE GAP: the sublattice constructions
        have non-rectangular regions and the Boneh-Durfee 0.292 sublattice is
        non-square, so the boundary term must be computed per construction
        and not assumed; the zero-compute arm computes it exactly.
      validation_plan: >-
        SAMPLE: exact rational eps(m) for m from 4 to 40 per construction.
        COMPARISON: eps(m) times m against a constant. TAIL CHECK: the last
        three m values' local slope against 2.0. TRANSFER: none; the
        statement is exact per construction.

  target_complexity:
    time_exponent: >-
      NO SMALL-ROOT BOUND MOVES; u_inf is unchanged for every construction.
      THE EXPONENT CLAIMED IS OF THE COST OF APPROACHING THE BOUND: reaching
      reach u_inf - eps needs D = Theta(eps^{-e}) and, with the in-corpus LLL
      cost O~(D^6 B^3) from KN-TECH-015 at entry size B = Theta(m n) =
      Theta(D n) for the univariate family, time T(eps) = O~(eps^{-9 e} n^3),
      i.e. eps^{-9} n^3 for e = 1 and eps^{-18} n^3 for e = 2 under that cost
      model; under the rounding speedup of Bi et al. the D and B exponents
      drop and the eps exponent drops proportionally. These are cost
      exponents of a polynomial-time method and are reported as such. A
      construction with e = 1 for a bivariate problem would halve the eps
      exponent of that cost and is the open direction; none is proposed.
    memory_exponent: >-
      The basis, O(D^2 B) = O(D^3 n) bits, so eps^{-3e} n; measured per cell,
      not assumed.
    best_known: >-
      For each construction, its published limit bound with the dimension
      clause unquantified; for the dimension cost, no published exponent was
      found. The sumset-theory and linear-programming works compute the
      limit provably; this record adds the rate.
    hidden_overhead: >-
      The O(1/D^2) term and the constant-bit reduction term in the univariate
      closed form; the boundary constants in the bivariate cases, computed
      exactly rather than hidden; and in the operative arm, everything the
      reducer does beyond its guarantee, which H1 names and measures.
    tradeoff_note: >-
      Time and memory both grow polynomially in eps^{-e}; there is no
      time-memory tradeoff to state within a single construction.
      Parallelisation is trivial across cells. The brute-force-over-excess
      route trades 2^k time for a smaller D and is costed in
      IDEA-20260901-cc08db, not here.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER ON TIME, MEMORY AND DATA BEFORE
    ANSWERING. As a reach or attack claim: n/a (no result claimed). As an
    analysis of the dimension cost: NOT dominated -- the sumset-theory
    (Feng et al. 2025) and linear-programming (Ding et al. 2026) methods, both
    retrieved, compute the limit bound and not the rate; IDEA-20260816-684f4a
    computes the cell table from which e could be read but does not read it;
    IDEA-20260816-b4e5b7 measures the curve without a model. On the axis 'a
    closed form for the finite-dimension loss with a computed exponent', no
    row exists.
  sota_delta: >-
    +0 on every attack axis: every published bound stands. What the record
    adds, quantitatively: for the univariate family a zero-compute prediction
    that the determinant-criterion gap at 2048 bits is about n/(4(D-1)) bits
    -- roughly 16, 8, 4, 2 bits at D = 17, 33, 65, 129 -- plus at most about
    one bit from reduction, which is a prediction the campaign can check on
    its first frontier run; and for four bivariate constructions a predicted
    common exponent e = 2 with four different constants, which if confirmed
    says every published sublattice trick is a constant-level saving in the
    dimension cost, and if refuted names the construction that is not.

  discriminated_from:
    - >-
      IDEA-20260816-b4e5b7 measures R(n, D) with no model; this record
      predicts 1 - R in closed form for the univariate family and turns the
      curve into a test.
    - >-
      IDEA-20260816-684f4a computes per-cell regions; this record extracts
