  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the univariate zero-compute arm confirms slope 1 with constant
    beta(1-beta), since it is a derivation checked once in this record by
    hand and not yet by machine. 0.6 that all four bivariate constructions
    return e = 2 within tolerance; the 0.292 non-square sublattice and the
