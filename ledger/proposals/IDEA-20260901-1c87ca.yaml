idea:
  id: IDEA-20260901-1c87ca
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  title: >-
    GOAL-MLDSA-001's second completion criterion (place each published fault attack
    inside or outside the fault-security proof's boundary) has been UNREACHABLE
    because "the fault-security proof itself is NOT in this corpus" (IDEA-20260805-818196,
    H-MLDSA-acac6d). It is now in hand: this session READ IN FULL a fault-security
    proof with an EXPLICIT boundary -- Aranha, Orlandi, Takahashi, Zaverucha, "Security
    of Hedged Fiat-Shamir Signatures under Fault Attacks", EUROCRYPT 2020 (ePrint
    2019/956), whose Table 1 partitions eleven fault positions f0..f10 into tolerated
    and untolerated. But it is proved for PLAIN Fiat-Shamir (Schnorr, Picnic2), NOT
    for Fiat-Shamir-WITH-ABORTS. Transplant the f0..f10 taxonomy onto ML-DSA's abort
    loop, identify which tolerance results the loop breaks, and place Jendral, Shin,
    and the polytope test-skip inside or outside the transplanted boundary.
  class: composition
  claim: >-
    (A) THE MISSING PROOF, NOW SUPPLIED. IDEA-20260805-818196 and H-MLDSA-acac6d both
    close on the same named gap: "NO KN-LIT ENTRY CORRESPONDS TO THE FAULT-SECURITY
    PROOF that RQ-MLDSA-001's motivation names", so the boundary conditional's
    antecedent is "relayed and unsourced" and GOAL-MLDSA-001's second criterion is
    "currently UNREACHABLE from the filed corpus." This session read, in full, a
    fault-security proof that IS filed (KN-LIT-6517, ePrint 2019/956) and that carries
    an explicit, tabulated boundary. It is not the internal-function-boundary NTT proof
    the motivation vaguely names (that is likely Gupta 2026/1188 / KN-LIT-8ce0b5); it is
    a SECOND, independent, and more general fault-security proof -- for the hedged
    Fiat-Shamir transform -- whose boundary is a clean 11-position taxonomy. Supplying it
    and its boundary is the un-gating this criterion has waited for.
    (B) THE BOUNDARY, VERBATIM FROM Table 1 AND Fig 1. The paper models a single-bit
    tampering fault at one of eleven positions in the signing dataflow HE -> Com -> H ->
    Resp -> CSF (HE = hedged extractor deriving randomness rho from (sk, m, nonce); Com =
    commitment; H = challenge hash; Resp = response; CSF = serialization). The positions:
    f0 = fault on the (m, nonce) pair into HE; f1 = fault on sk into HE; f2 = HE output
    rho; f3 = Com input; f4 = Com output; f5 = H input; f6 = H output; f7 = Resp input;
    f8 = Resp output; f9/f10 = CSF input/output. Table 1 result (UF-fCMNA):
      TOLERATED for the generic hedged FS scheme: f1, f5, f6, f8, f9, f10 (six of eleven).
      TOLERATED additionally when the ID scheme is SUBSET-REVEALING: f4, f7 (eight total).
      NOT TOLERATED (proven attacks, Lemmas 11/12/13): f0, f2, f3.
    f0 (fault the (m,nonce) input to the hedged extractor) yields two signatures on the
    same randomness -> full key recovery; f2 (fault rho) and f3 (fault the commitment
    input, i.e. bias the randomness into Com) likewise break via the SSND/LRB attacks the
    paper surveys in Section 2.3.
    (C) THE TRANSPLANT, AND THE ONE STRUCTURAL FACT THAT DOES NOT CARRY. ML-DSA is
    Fiat-Shamir-WITH-ABORTS: Com (w = A y) and Resp (z = y + c s1) are inside a REJECTION
    LOOP that reruns with fresh y until the norm checks pass. The 2019/956 taxonomy is
    proved for a SINGLE commit-challenge-response pass. Three loop-induced changes must be
    checked position by position: (i) the commitment is recomputed each iteration, so an
    f3/f4 commitment fault that a single-pass subset-revealing argument tolerates may be
    RE-EXERCISED per iteration and interact with the abort predicate; (ii) the response z is
    the leaky object rejection sampling is designed to make secret-independent, so an f7/f8
    response fault meets ML-DSA's own norm-rejection rather than plain Schnorr's algebra;
    (iii) ML-DSA's HE in hedged mode derives rho' = H(K || mu) with mu = H(tr || M), so f0
    faults the (mu, rnd) input and f1 faults K -- and the deterministic mode (rnd = 0)
    collapses f0's two-signatures-on-one-randomness attack onto DISTINCT MESSAGES only,
    which is the explicit hedged-vs-deterministic distinction RQ-MLDSA-001 asks for. The
    claim is that the transplanted boundary is Table 1 MINUS the positions the loop breaks,
    PLUS an explicit determination of whether ML-DSA's ID scheme is subset-revealing (which
    decides whether f4, f7 are tolerated).
    (D) THE PLACEMENT, WHICH IS THE COMPLETION CRITERION. Map each published ML-DSA fault
    attack to a position f_i and read its tolerance off the transplanted table: Jendral
    nonce-erasure (KN-LIT-4f3b80) faults the hedged randomness -> f0/f2 class -> OUTSIDE
    (not tolerated), consistent with 818196's rank-forcing argument that a single-signature
    full recovery forces the y-generation site; Shin DFA (KN-LIT-340675, challenge-sampling
    from public info) -> f5/f6 class (challenge hash) -> TOLERATED by the generic result,
    a NON-trivial placement that says the DFA sits INSIDE the hedged proof's guarantee if
    the transplant holds; the polytope test-skip (ePrint 2025/195) faults the REJECTION
    PREDICATE itself, which is a position 2019/956 does NOT model (its faults are on
    function inputs/outputs, not on the abort test), so it falls in the loop-induced GAP the
    transplant must name as OUT OF THE PROOF'S SCOPE. That last placement is the sharpest:
    the abort test is a fault target the plain-FS taxonomy has no position for, and naming
    it is a forward-guidance closure of exactly the kind docs/inventor-protocol.md section 4
    requires.
    (E) WHAT IS NOT CLAIMED. No fault is injected, simulated, or enabled. No attack is
    improved. Under AGENTS.md rule 7 nothing here is evidence about MLWE, MSIS or
    SelfTargetMSIS in either direction. The deliverable is a boundary statement -- the
    transplanted f0..f10 tolerance table for ML-DSA's abort structure, with the subset-
    revealing determination and the loop-broken positions named -- and the placement of the
    published attacks against it, which is GOAL-MLDSA-001's second completion criterion, now
    reachable because the proof is in hand.
  mechanism: >-
    STAGE 0, FILE THE PROOF AND READ THE ABORT STRUCTURE. KN-LIT-6517 exists but its body
    was "not verified... parsed from the first two pages"; this session rendered and read the
    full EUROCRYPT 2020 PDF (Fig 1, Table 1, the f0..f10 definitions in Section 3.2, the
    negative Lemmas 11/12/13, and the subset-revealing Definition 3). The executing session
    upgrades KN-LIT-6517 to a fully-read entry under a run record and re-reads FIPS 204
    Algorithm 7's abort loop and hedged/deterministic rho' derivation.
    STAGE 1, THE POSITION MAP. For each of f0..f10, write down the ML-DSA dataflow object it
    faults (mu/rnd, K, rho', w=Ay, HighBits, c-tilde=H(mu||w1), SampleInBall, z=y+cs1, h,
    sigEncode) and whether the object lives INSIDE the rejection loop. This is pen-and-paper
    and either confirms a position transfers unchanged or flags it as loop-affected.
    STAGE 2, THE SUBSET-REVEALING DETERMINATION. 2019/956 Definition 3: an ID scheme is
    subset-revealing if Resp derives an index set from the challenge alone and reveals only a
    subset of committed values. Determine whether ML-DSA's Resp (z = y + c s1, with c in
    B_tau selecting tau shifts) is subset-revealing, input-delayed, or neither. This decides
    whether f4 and f7 are tolerated and is a derivable fact about ML-DSA's structure, not a
    measurement.
    STAGE 3, THE LOOP OBSTRUCTION. For the positions inside the loop (f3, f4, f7, f8),
    determine whether the single-pass tolerance argument survives re-exercise across
    iterations and interaction with the norm-abort predicate. Where it does not, mark the
    position LOOP-BROKEN and state the mechanism (e.g. an f4 commitment-output fault that is
    re-injected each iteration until an aborting attempt passes could bias the accepted w in a
    way the single-pass argument does not cover). This is the transplant's real content and
    the step most likely to fail or to require narrowing.
    STAGE 4, THE HEDGED-VS-DETERMINISTIC FORK. State f0's consequence in hedged mode (rnd
    fresh per attempt -> two-signatures-on-one-randomness needs a fault) versus deterministic
    mode (rnd = 0 -> repeated same-message signatures are identical, so f0's attack is over
    DISTINCT messages and its query count is read differently), which is RQ-MLDSA-001's
    explicit hedged-vs-deterministic attacker-model distinction, now grounded in a proof.
    STAGE 5, THE PLACEMENT AND THE NAMED GAP. Place Jendral (f0/f2, outside), Shin (f5/f6,
    inside if the transplant holds), and the polytope test-skip (abort-predicate fault, a
    position 2019/956 does not model -> OUT OF SCOPE) against the transplanted table. Report
    the boundary as the tolerance table plus the loop-broken positions plus the abort-predicate
    gap, with every row carrying its provenance (transferred / loop-broken / out-of-scope) and
    every published-attack placement carrying whether its site is determinable from the
    obtained material (818196's discipline: undetermined rows stay undetermined).
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Read this session in full: IDEA-20260805-818196 and H-MLDSA-acac6d (the rank taxonomy
      and its closure "the fault-security proof is NOT in this corpus... criterion 2 is
      currently UNREACHABLE"), RQ-MLDSA-001 (the fault-boundary and hedged-vs-deterministic
      targets), EV-MLDSA-32d752 (coverage determinations placing Shin and Jendral
      outside_formal_model of KN-LIT-3907), H-MLDSA-f3a291 and H-MLDSA-c7b4e8 (the Shin and
      Jendral outside-the-proof hypotheses), IDEA-20260828-6e79b4 (folding a fault hint and
      the t0 hint into one lattice). The nearest record, 818196/H-MLDSA-acac6d, classifies
      fault attacks by CONSTRAINT RANK (an algebraic invariant of the dataflow) and explicitly
      states the boundary conditional is unsourced. This record classifies by INJECTION-SITE
      fault-type from an EXTERNAL, now-read proof (Aranha et al. f0..f10) and supplies the
      missing antecedent. The two compose: the rank invariant says what a landed fault
      CONSTRAINS; the f0..f10 taxonomy says whether the PROOF covers that position. No corpus
      record transplants a hedged-FS fault taxonomy onto the abort loop or determines ML-DSA's
      subset-revealing status.
    web: >-
      This session fetched and READ IN FULL the rendered 24-page EUROCRYPT 2020 PDF of ePrint
      2019/956 (Fig 1 dataflow, Fig 4 UF-fCMNA experiment with OFaultHSign taking a tamper
      function phi and position j in [0,10], Table 1 tolerance summary, Lemmas 11/12/13
      negative results for f0/f2-f3, Definition 3 subset-revealing, Lemmas 4-10 positive
      results). Confirmed the paper covers Schnorr/XEdDSA/Picnic2 and does NOT treat
      Fiat-Shamir-with-aborts or Dilithium (Section 2.1, application sections). Concurrent
      work Fischlin-Gunther (memory fault model) noted. The corpus entry KN-LIT-6517 held only
      a first-two-pages abstract before this session.
    verdict: >-
      UNVERIFIED. The Table 1 tolerance results and the f0..f10 definitions are read from the
      rendered PDF and must be re-verified by the executing session under a run record before
      any placement enters evidence. The transplant onto the abort loop and the subset-revealing
      determination are DERIVATIONS this program has not performed and are the claimed
      contribution; the underlying taxonomy is the paper's. External novelty of the transplant
      itself is not established -- a hedged-FS-with-aborts fault analysis may exist in the
      literature (e.g. follow-ups to 2019/956) and was not searched exhaustively this session --
      so the label is unverified rather than a novelty claim.
  object_first_candidate:
    tracked_object: >-
      The fault POSITION f_i in ML-DSA's signing dataflow, carried as a triple (dataflow
      object faulted; inside-the-abort-loop or not; 2019/956 tolerance verdict for the
      single-pass analogue), followed from the eleven-position taxonomy of the hedged-FS
      proof, through ML-DSA's rejection loop, to a per-position INSIDE / OUTSIDE / OUT-OF-SCOPE
      boundary verdict. Not the faulty signature, not the glitch, not the device: the position
      in the algorithm and whether the proof reaches it.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) the constraint-RANK invariant (818196, H-MLDSA-acac6d
      own that; this record CONSUMES it as the "what does a landed fault constrain" companion,
      not as a competitor); (2) performing or simulating any fault injection; (3) lattice
      re-costing of the three problems; (4) the ffa0f5 conformance and t0 objects; (5)
      countermeasure design. The lens is the injection-site fault-type and the abort loop's
      effect on a published tolerance taxonomy.
    genuinely_new_or_repackaging: >-
      The f0..f10 taxonomy is the paper's (repackaging of a published proof). What is not a
      repackaging: no record in this program has read this proof, transplanted its boundary
      onto Fiat-Shamir-with-aborts, determined ML-DSA's subset-revealing status, or named the
      abort-predicate as a fault position the plain-FS taxonomy has no slot for. Supplying the
      missing antecedent that 818196/H-MLDSA-acac6d flagged is the concrete new thing.
    concretely_testable: >-
      Yes and cheaply -- it is a derivation, not a measurement. One-step propagation is one
      position mapped to one dataflow object with one inside/outside-the-loop bit; the observable
      is the per-position verdict. The subset-revealing determination and the loop-obstruction
      analysis are pen-and-paper, checkable by a reviewer in one reading.
    survival_score: >-
      The taxonomy survives to the positions the abort loop does not touch (f1, f5, f6, f9, f10 --
      the hedged extractor's sk input, the challenge hash, and serialization, all single-pass in
      ML-DSA too). It dissolves at the loop-internal positions (f3, f4, f7, f8) and at the
      abort-predicate fault (which has no f_i at all); reporting exactly where it dissolves, and
      why, is the deliverable and the closure's forward guidance.
  null_object_control: >-
    (1) OUT-OF-SCOPE NULL, forced by construction: the abort-predicate fault (skip the norm
    check) must map to NO position f0..f10, because 2019/956's faults are on function
    inputs/outputs and the abort test is neither; a transplant that assigns it an f_i has
    mis-read either the taxonomy or the dataflow. (2) UNFAULTED / f-IDENTITY CONTROL: the phi =
    Id case (no fault) must be TOLERATED at every position (it is the non-faulty oracle), a
    forced value the transplanted table must reproduce. (3) PLAIN-SCHNORR REPRODUCTION: applying
    the transplant machinery to plain Schnorr (no abort loop) must reproduce 2019/956 Table 1
    exactly, isolating the abort loop as the only source of any divergence; a discrepancy there
    is a transplant-implementation error, not an ML-DSA finding. (4) RANK CROSS-CHECK: for each
    placed attack, 818196's constraint rank and this record's tolerance verdict must be
    CONSISTENT (an OUTSIDE placement should coincide with a full-rank / y-generation site); a
    contradiction localizes an error in one of the two analyses.
  discriminated_from:
    - >-
      IDEA-20260805-818196 and H-MLDSA-acac6d classify fault attacks by CONSTRAINT RANK r(F),
      an algebraic invariant of the dataflow, and explicitly leave the boundary conditional's
      antecedent unsourced. This record supplies that antecedent (a read fault-security proof
      with a tabulated boundary) and classifies by INJECTION-SITE fault-type. The two compose:
      the rank says what a landed fault constrains; the f0..f10 verdict says whether the proof
      covers the position. This record cites 818196's rank as a cross-check (null control 4),
      not as a competitor, and does not re-derive it.
    - >-
      EV-MLDSA-32d752 places Shin and Jendral outside_formal_model of KN-LIT-3907 (the
      CMA-to-NMA proof, a MATHEMATICAL forgery proof with no fault model at all). This record
      places them against a FAULT-security proof (2019/956) that does model faults, so the
      placements are about a different, fault-aware boundary; where 32d752 says "no fault model",
      this record supplies one and asks inside/outside within it.
    - >-
      H-MLDSA-f3a291 and H-MLDSA-c7b4e8 hypothesize Shin and Jendral operate outside the formal
      fault proof but name no proof with an explicit boundary. This record names one (2019/956
      Table 1) and gives each attack a specific position (Shin -> f5/f6; Jendral -> f0/f2), which
      those hypotheses could not do without the proof in hand.
    - >-
      ePrint 2019/956 itself proves the taxonomy for plain Fiat-Shamir (Schnorr, Picnic2), NOT
      for Fiat-Shamir-with-aborts. This record does not reproduce that proof; it TRANSPLANTS its
      boundary onto ML-DSA's abort loop and names the loop-broken positions and the
      abort-predicate gap, which the paper does not treat.
  citations:
    - ref: "ePrint 2019/956 (KN-LIT-6517) -- Aranha, Orlandi, Takahashi, Zaverucha, \"Security of Hedged Fiat-Shamir Signatures under Fault Attacks\", EUROCRYPT 2020"
      provenance: retrieved
      claim: >-
        Full 24-page PDF rendered and read this session. Fig 1 and Section 3.2 define eleven
        single-bit fault positions f0..f10 on the hedged-FS dataflow HE->Com->H->Resp->CSF
        (f0=(m,nonce) into HE; f1=sk into HE; f2=rho; f3=Com input; f4=Com output; f5=H input;
        f6=H output; f7=Resp input; f8=Resp output; f9/f10=CSF). Table 1: generic hedged FS
        tolerates f1,f5,f6,f8,f9,f10; subset-revealing additionally tolerates f4,f7; f0,f2,f3
        NOT tolerated (Lemmas 11,12,13). Definition 3 defines subset-revealing. The paper covers
        Schnorr/XEdDSA/Picnic2 and explicitly does NOT treat Fiat-Shamir-with-aborts or Dilithium.
      verified_by: "idea-generator subagent, PDF render read 2026-09-01; re-verification and KN-LIT-6517 upgrade required under a run record before any placement enters evidence."
    - ref: "IDEA-20260805-818196 and H-MLDSA-acac6d (this ledger)"
      provenance: internal
      claim: >-
        Define the fault constraint-rank r(F), derive N_LA/N_IT brackets, force a single-signature
        full recovery to the y-generation site, and close on the named gap that the fault-security
        proof is not in the corpus and criterion 2 is unreachable. This record supplies the missing
        proof and its boundary; the rank invariant is used as a cross-check.
      verified_by: "idea-generator subagent, read in full 2026-09-01."
    - ref: "KN-LIT-4f3b80 (Jendral nonce-erasure), KN-LIT-340675 (Shin DFA), ePrint 2025/195 (polytope test-skip)"
      provenance: retrieved
      claim: >-
        Jendral faults the hedged randomness (nonce erasure) -> f0/f2 class; Shin recovers the
        challenge from public info and targets challenge-hash computation -> f5/f6 class; 2025/195
        faults the rejection-sampling TEST -> a position 2019/956 does not model. 2025/195's body
        was read this session; the Jendral and Shin placements are from their abstracts as recorded
        in this corpus (EV-MLDSA-faf2ec, EV-MLDSA-32d752) and are Stage-5 determinations, marked
        undetermined where the site is not fixable from the obtained material.
      verified_by: "idea-generator subagent, 2025/195 read this session; Jendral/Shin at abstract strength per corpus records."
  assumptions:
    - >-
      The 2019/956 Table 1 verdicts and f0..f10 definitions as transcribed are exact. Stage 0
      re-renders under a run record; the plain-Schnorr reproduction null is the check.
    - >-
      ML-DSA's dataflow maps onto the HE->Com->H->Resp->CSF template with the abort loop around
      Com/Resp, as in FIPS 204 Algorithm 7. If the mapping is structurally different, the
      transplant is re-instantiated mechanically; if a position has no ML-DSA analogue, it is
      reported as inapplicable rather than forced.
    - >-
      The subset-revealing determination for ML-DSA's Resp is decidable from its structure
      (z = y + c s1, c in B_tau). Its outcome decides f4/f7 tolerance and is stated as a derived
      fact with its argument, not assumed.
    - >-
      Nothing distributional or measured is used; this is a derivation and a placement. No fault
      is injected and no secret is recovered.
  proof_search_map:
    bottleneck: >-
      The step that decides, per loop-internal position (f3, f4, f7, f8), whether 2019/956's
      single-pass tolerance argument survives re-exercise across the rejection loop and interaction
      with the norm-abort predicate. Every INSIDE/OUTSIDE verdict for a loop-internal position and
      the whole hedged-vs-deterministic fork pass through it; it is the one step whose resolution
      changes the boundary rather than one row of it.
    baseline_embedding:
      parameter_slice: >-
        Plain Schnorr (no abort loop) is the exact slice where the transplant machinery must
        reproduce 2019/956 Table 1; it is the single-pass boundary case of the with-aborts
        transplant.
      reproduction_check: >-
        Symbolic: applying the position map and tolerance rules to Schnorr must return Table 1
        exactly (f1,f5,f6,f8,f9,f10 tolerated; f0,f2,f3 not; f4,f7 tolerated iff subset-revealing).
        A frozen fixture records it before ML-DSA's loop is analyzed.
    observation_collision:
      observable: "The per-position INSIDE/OUTSIDE/OUT-OF-SCOPE verdict and the placement of a named attack."
      distinct_preimage_search: >-
        Two published attacks can share a position f_i (same site) yet differ in reported success
        probability, because success is a hardware quantity (818196's f4 separation), and two
        attacks on different positions can be indistinguishable from the reported (N, p) alone. So
        the reported attack observable does not determine the boundary verdict; the position does.
        The record therefore places attacks by their SITE, marks undeterminable sites as undetermined,
        and cross-checks each placement against 818196's rank (an OUTSIDE placement should coincide
        with a full-rank / y-generation site).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The transplanted f0..f10 tolerance table for ML-DSA's abort structure, moving "is this
          fault attack covered by the proof" from an argument into a table lookup keyed by injection
          site, with three loop-affected rows and one abort-predicate gap explicitly flagged.
        predicted_gain: >-
          Converts GOAL-MLDSA-001's second completion criterion from unreachable (no proof) into a
          derivable boundary statement plus attack placements; diagnostic, no attack, no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold the fault position fixed and vary the transform (plain FS vs FS-with-aborts); the
          intrinsic invariant that flips tolerance is whether the faulted object lives inside the
          rejection loop. For f3/f4/f7/f8 the loop is the forgotten structure that a single-pass
          verdict discards.
        predicted_gain: >-
          Decides which positions the plain-FS taxonomy can be quoted for unchanged and which need a
          with-aborts argument, before any of them is re-proved.
    quantifier_order: >-
      FOR EACH fault position f_i and FOR ML-DSA's abort structure, THERE EXISTS a verdict in
      {TOLERATED, NOT TOLERATED, LOOP-BROKEN, OUT-OF-SCOPE}, derived from 2019/956's single-pass
      verdict and the position's relation to the rejection loop. The BOUNDARY claim is a CONDITIONAL:
      IF 2019/956's hedged-FS proof (as transplanted) is the fault model, THEN attack X at position
      f_i is inside/outside it. It is NOT claimed that this is the ONLY fault-security proof for
      ML-DSA, nor that the transplant is tight; a with-aborts-specific proof could tolerate more.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The hedged-FS fault-tolerance taxonomy of ePrint 2019/956, transplanted onto ML-DSA's abort
        structure, tolerates positions [set], does not tolerate [set], has loop-broken [set] and an
        abort-predicate position it does not model; and the published attacks Jendral / Shin /
        polytope-test-skip place at f0-f2 / f5-f6 / out-of-scope respectively, cross-checked against
        818196's rank where the site is determinable." It cannot certify that a with-aborts-specific
        proof exists or is wider, cannot certify any implementation is vulnerable, and says nothing
        about MLWE/MSIS/SelfTargetMSIS.
      nearby_object_control: >-
        Plain Schnorr, where the transplant must reproduce Table 1 exactly (no loop-broken rows).
        A transplant that reports loop-broken positions for Schnorr has not isolated the abort loop
        as the load-bearing difference and is mis-implemented.
    proof_obligations:
      - claim: "The transplant reproduces 2019/956 Table 1 exactly for plain Schnorr."
        responsibility: baseline
      - claim: "Each position maps to an ML-DSA dataflow object with a correct inside/outside-loop bit."
        responsibility: correctness
      - claim: "ML-DSA's Resp is/ is not subset-revealing, decided with an argument, fixing f4/f7."
        responsibility: interface
      - claim: "The loop-internal positions' single-pass tolerance is re-examined and the broken ones named with a mechanism."
        responsibility: strictness
      - claim: "The abort-predicate fault maps to no f_i and is reported OUT-OF-SCOPE."
        responsibility: scope
      - claim: "Each placement is cross-checked against 818196's rank, or marked undetermined."
        responsibility: feasibility
      - claim: "No statement bears on MLWE/MSIS/SelfTargetMSIS; no fault is injected."
        responsibility: scope
  predictions:
    - metric: "plain-Schnorr reproduction of 2019/956 Table 1 by the transplant machinery"
      direction: different
      minimum_effect: "exact reproduction (f1,f5,f6,f8,f9,f10 tolerated; f0,f2,f3 not; f4,f7 iff subset-revealing); any deviation is a transplant-implementation error and halts the ML-DSA analysis."
    - metric: "ML-DSA subset-revealing determination"
      direction: different
      minimum_effect: "a definite verdict (subset-revealing / input-delayed / neither) with its argument; this fixes whether f4 and f7 are tolerated and is the pivot of the transplanted table."
    - metric: "count of LOOP-BROKEN positions among {f3, f4, f7, f8}"
      direction: different
      minimum_effect: >-
        pre-registered expectation: at least one (the abort loop re-exercises commitment/response
        faults), but the specific set is the deliverable; zero loop-broken positions would mean the
        plain-FS taxonomy transfers wholesale, itself a clean and reportable result.
    - metric: "placement of Jendral, Shin, and the polytope test-skip against the transplanted boundary"
      direction: different
