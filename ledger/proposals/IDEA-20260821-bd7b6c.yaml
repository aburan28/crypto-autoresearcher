idea:
  id: IDEA-20260821-bd7b6c
  question_id: RQ-FRODO-3260cc
  added: '2026-08-21'
  title: >-
    A 2026 attack claims up to 13 bits over the best known "by leveraging the ring structure" and
    publishes NO unstructured control - FrodoKEM is the standardized unstructured control that
    costs nothing to build, so measure the ring-attributable share of that gain directly on a
    two-dimensional ladder in ring degree at fixed total dimension and in secret sparsity at fixed
    ring degree, which separates three competing explanations (ring structure, sparsity, generic
    decoder improvement) that the published claim cannot separate - and if the gain is generic,
    Frodo's own published estimates move too
  class: measurement
  claim: >-
    (A) THE GAP. Hou and Jiang, "Careful with the Ring: Enhanced Hybrid Decoding Attacks against
    Module/Ring-LWE" (eprint 2026/366, abstract page fetched 2026-08-21) reports a complexity
    improvement by a factor O(N) in the sparse-secret setting, 17x to 114x speedups on known
    broken instances, improvements up to 13 bits on all considered parameter sets, and 12 of 16
    parameter sets falling below 128-bit security; the parameter sets are FHE ones (JM22, CCKS23,
    BCKS24, CHKS25, AKP25) and the abstract page returned NO unstructured LWE baseline and no
    FrodoKEM comparison. The attribution "leveraging the ring structure" is therefore
    UNCONTROLLED as published: a gain measured only inside the ring family cannot distinguish a
    gain that COMES FROM the ring from a gain in the decoder that would apply equally without one.
    (B) THE CLAIM, AS A NUMBER. Define the ring-attributable share R = gain_structured -
    gain_unstructured, in bits, where gain_X is the improvement of the enhanced hybrid decoder
    over its own stated baseline on instance family X, and the unstructured twin is built with
    IDENTICAL total dimension, modulus, secret distribution, secret Hamming weight and sample
    count, differing only in that the ring degree is 1. This record claims that R is measurable,
    that it is currently unmeasured, and that its value discriminates: R within 3 bits of the full
    claimed gain means the ring attribution stands; R below 3 bits means at least ten of the
    claimed thirteen bits are a GENERIC decoder improvement, in which case it applies to
    unstructured LWE and therefore TO FRODOKEM, whose published estimates would then be the ones
    that move - which is why this record sits in the FrodoKEM lane and not in an FHE one.
    (C) THE THIRD EXPLANATION THE PUBLISHED CLAIM ALSO CANNOT SEPARATE. The reported factor is
    stated for the SPARSE-SECRET setting. FrodoKEM's secret is dense (drawn coordinatewise from
    chi with support up to |z| <= 12), so a gain that is really about sparsity rather than about
    the ring would leave FrodoKEM untouched for a reason completely different from the one the
    paper gives. Three explanations, two ladders: a ring-degree ladder at fixed total dimension
    and a sparsity ladder at fixed ring degree. Their two-dimensional cross is what separates
    ring from sparsity from generic, and no single comparison can.
    (D) WHY FRODOKEM IS THE RIGHT NULL OBJECT AND WHY IT IS FREE. This program repeatedly needs an
    unstructured anchor and has used FrodoKEM as one exactly once (IDEA-20260816-1418f4). It is
    free because it is a real, standardized, published parameter set at three security categories
    with no ring structure whatsoever - not a synthetic construction whose realism can be
    disputed - so the N = 1 end of the ring ladder is anchored on a document rather than on an
    invention. That is a stronger null than any synthetic arm: it cannot be accused of being
    unrepresentative, because it is deployed.
    (E) EXPLICIT LANE DISCIPLINE, DECLARED UP FRONT RATHER THAN DISCOVERED LATER.
    GOAL-FRODO-001.non_duplication[0] reserves core-SVP conventions and memory-charged sieve cost
    for GOAL-MLKEM-003 and GOAL-MLKEM-004, and RQ-FRODO-3260cc's claim-tier ceiling forbids any
    statement about LWE hardness at Frodo's dimensions. THIS RECORD DERIVES NO SIEVE COST AND
    ASSERTS NO HARDNESS FIGURE. It measures the SENSITIVITY of a published cost function to one of
    its arguments, holding the cost model fixed as given. If a batch running it finds itself
    choosing a core-SVP convention or a memory model, it has left the lane and must hand off; the
    Coordinator may well route this record to GOAL-MLKEM-003/004 or to RQ-FHE-001 instead, and
    that routing decision is the Coordinator's, not this record's.
    (F) NOT CLAIMED. No attack is proposed, improved, or implemented. No statement is made that
    eprint 2026/366 is wrong - the abstract page was fetched, the paper body was NOT read, and a
    missing control in an abstract is not a defect in a paper. No FrodoKEM parameter set is
    asserted to be weaker or stronger than published. A measured R is a statement about an
    attribution, at the tier of the cost model that produced it.
  mechanism: >-
    STAGE 0 - SYMBOLIC AUDIT, CHEAP, AND IT CAN KILL THE WHOLE THING BEFORE ANY COMPUTE. Transcribe
    the enhanced decoder's cost expression and its stated baseline's cost expression from the filed
    primary text, and enumerate every syntactic occurrence of the ring degree N. Classify each as
    (i) entering only through the total dimension n = N*k, (ii) entering through a
    ring-specific acceleration (rotations giving free samples, a cyclic structure in the guessing
    set, an FFT over the ring), or (iii) entering through a quantity that happens to be named N but
    is a sample count or a block size. FORCED VALUE DERIVED HERE, BEFORE ANY RUN: if every
    occurrence is of type (i), then substituting N = 1, k = n makes the claimed O(N) factor collapse
    to O(1) identically and R must be EXACTLY the claimed gain; if any occurrence is of type (iii),
    the attribution is a naming artefact and the audit ends there with a symbolic result and zero
    compute. This is the observation-collision audit of docs/inventor-protocol.md section 8 applied
    to a cost formula, and it is the highest-value-per-CPU-second step in the record.
    STAGE 1 - BASELINE REPRODUCTION GATE. Reproduce the paper's own reported baseline and enhanced
    figures on at least 3 of its 16 parameter sets, to within a declared tolerance, BEFORE building
    any twin. A pipeline that cannot reproduce the source's own numbers at the source's own inputs
    cannot be trusted when it disagrees - this is RQ-FRODO-a2dbe2.methods' rule and it binds here
    too. If the gate fails, the deliverable is the reproduction failure and its size, and no ladder
    is run.
    STAGE 1b - COST CALIBRATION AND THE HALTING RULE, ADDED 2026-08-24 (see repair_provenance).
    Before any ladder cell is evaluated, time the FIRST 8 evaluations of Stage 1 and record the
    measured median seconds per estimator evaluation. Multiply by the declared cell count of
    whichever design variant has been authorized and compare against the batch's allocated wall
    clock. IF THE PROJECTION EXCEEDS THE ALLOCATION, THE RUN HALTS THERE and the deliverable is
    Stage 0's symbolic audit plus the calibration figure - which is itself the number this record
    was mispriced for lacking. A halt here is a BUDGET outcome about a computation and is never
    evidence about the attribution question (AGENTS.md rule 3).
    STAGE 2 - THE RING LADDER. Hold total dimension n, modulus q, secret distribution, secret
    Hamming weight and sample count FIXED, and sweep the ring degree N over {1, 2, 4, 16, 64, 256}
    with module rank k = n/N - six points, hence four interior ones, satisfying the
    KN-TECH-1a5b7e obligation-3 refinement that at least three interior points are needed before
    any direction may be attached to a label. Comparator NAMED: the N = 1 arm. Threshold declared
    before the run: the gain at N = 256 must exceed the gain at N = 1 by at least 3 bits for the
    ring attribution to be scored as supported. MONOTONICITY in log N reported explicitly, because
    a non-monotone response means the label "more ring structure" cannot be signed.
    STAGE 3 - THE SPARSITY LADDER. Hold N and n fixed and sweep the secret Hamming weight from the
    sparsest setting the paper uses through to a dense Frodo-like secret, at >= 5 points. Report the
    gain as a function of density. This is what separates "the ring did it" from "sparsity did it",
    and the two ladders are run in the SAME invocation on the SAME code path so that no
    cross-arm implementation difference can masquerade as an effect.
    STAGE 4 - THE STANDARDIZED ANCHOR. Run both decoders on Frodo-640, Frodo-976 and Frodo-1344 as
    filed - dense secret, ring degree 1, real parameters - and report gain_Frodo in bits. This is
    the number with the most direct consequence: a gain_Frodo above the declared 3-bit threshold
    means a published attack improvement applies to a standardized unstructured KEM and has not
    been reported as doing so, and that finding is handed to GOAL-MLKEM-003/004 rather than acted
    on here.
    STAGE 5 - THE ARITHMETIC. R = gain at N = 256 minus gain at N = 1 at matched everything else,
    with an interval from the ladder's own spread, reported alongside gain_Frodo and the sparsity
    response surface. The deliverable is a response surface, not a verdict.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant). Instrument:
      Grep tool (ripgrep) plus WebSearch/WebFetch.
      GREPS RUN: (1) 'hybrid decoding|sparse secret|2026/366|Careful with the Ring' -i -> repo root
      -> 39 files. The ledger matches are IDEA-20260821-0d1fde and IDEA-20260821-01623a (both
      RQ-MLKEM-001, both from today's batch, and I read both titles: a field-norm Wesolowski
      instantiation and a NoMod robust-regression breakdown-point record - neither is an attribution
      audit), RQ-FHE-001, IDEA-20260816-bd7f26, IDEA-20260816-3fc7b2, IDEA-20260813-17acdf,
      IDEA-20260807-a06996, IDEA-20260805-3d71ca, IDEA-20260805-2b94fe; the knowledge matches are
      KN-TECH-082, KN-OPEN-026, KN-LIT-7c2620, KN-LIT-7666, KN-LIT-7667, KN-LIT-4388b3, KN-LIT-1810
      and GATHER-20260801B; plus EXP-FHEX-5e6e4f/specification.yaml. NONE is under RQ-FRODO-3260cc
      and none measures a ring-attributable share.
      (2) 'lattice.estimator|lattice_estimator|core-SVP|core SVP' -i -> ledger/ -> 91 files,
      including GOAL-MLKEM-003, GOAL-MLKEM-004, GOAL-MLKEM-005, GOAL-FRODO-001, GOAL-FRODO-002,
      H-FRODO-8ea540, H-FRODO-e0c651 and many ML-KEM proposals. I read GOAL-FRODO-001 in full: its
      non_duplication[0] explicitly reserves the estimator lane, which is why part (E) of this
      record declares the handoff rather than assuming the lane.
      (3) 'Frodo' -i -> knowledge/ -> 9 files, none of which is an unstructured-control record.
      READ IN FULL: the lane's 8 pre-extracted titles (IDEA-20260816-1418f4 is the single existing
      use of Frodo as an unstructured control, and it compares failure-indicator correlation, not
      attack cost); RQ-FRODO-3260cc; RQ-FRODO-a2dbe2; GOAL-FRODO-001; docs/inventor-protocol.md;
      docs/target-result-profile.md; knowledge/techniques/KN-TECH-1a5b7e.md.
      WEB SEARCHES RUN (the one bearing on this record): 'lattice estimator LWE ring structure
      ignored module-LWE same estimate as unstructured plain LWE'. It returned, among others, the
      Hou-Jiang paper and general statements that known RLWE attacks proceed by attacking the
      transformed unstructured instance.
      WEB FETCH: https://eprint.iacr.org/2026/366 SUCCEEDED and returned title, authors (Jianhua
      Hou and Haodong Jiang, Information Engineering University), and an abstract summary carrying
      the O(N) factor, the 17x-114x speedups, the "up to 13 bits" and "12 of 16 below 128-bit"
      figures, the FHE parameter-set list, and the explicit statement that no unstructured LWE
      baseline or FrodoKEM analysis appears. THE PAPER BODY WAS NOT READ.
      2026-08-24 REPAIR PASS: no new retrieval was performed. The pass redid the compute-cost
      arithmetic against GOAL-FRODO-001.campaign_budget, which was re-read from
      ledger/goals/GOAL-FRODO-001.yaml; nothing external was fetched and no provenance was
      upgraded.
    results: >-
      Nothing in this repository measures the ring-attributable share of any claimed attack gain,
      for any scheme. RQ-FHE-001 and the FHE-adjacent proposals concern FHE parameter regimes and
      hybrid attacks as targets, not as objects of an attribution audit. IDEA-20260816-1418f4 is
      the only prior use of Frodo as an unstructured control in the repository and its statistic is
      a failure-indicator correlation matrix at matched marginals - a chi-and-ciphertext-side
      object with no attack cost in it. IDEA-20260808-dd4d30 concerns the rank-nbar dense
      sublattice that Frodo's matrix secret plants, which is a statement about ONE instance's
      lattice geometry rather than about the N-dependence of a cost function across a family. On
      the external side, the search returned the general position that known RLWE attacks work by
      attacking the transformed unstructured instance - which is precisely the background against
      which a claimed ring-specific gain is notable and against which an unstructured control is
      the obvious missing arm.
    verdict: >-
      UNVERIFIED. One eprint abstract page was fetched; the paper body was not read, and no claim
      here asserts what that paper does or does not contain beyond what the fetched page returned.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY: measuring a ring-attributable share as a number in
      bits; using a standardized unstructured KEM as the N = 1 anchor of a ring-degree ladder at
      fixed total dimension; and the two-dimensional ring-by-sparsity cross that separates three
      explanations. ASSEMBLED FROM KNOWN PARTS: hybrid decoding, the estimator, and ablation
      ladders are all standard; the observation that the estimator is largely structure-blind is
      common knowledge in the field. The contribution is the controlled attribution, not any
      component.
  object_first_candidate:
    tracked_object: >-
      The RING DEGREE AS AN ARGUMENT OF THE ATTACK COST FUNCTION - concretely, the map
      N -> cost(N, k = n/N) at fixed total dimension n, modulus, secret distribution and sample
      count, and its discrete derivative in log N. What is followed through the computation is not
      an instance or a vector but the SENSITIVITY of a published cost expression to redistributing
      dimension between ring degree and module rank.
    lossiness: >-
      GENUINELY LOSSY. The projection discards the entire attack - the blocksize schedule, the
      guessing set, the decoder's internal structure, the lattice itself - and retains exactly one
      scalar per ladder point. The discard is compatible with the operation being tracked, because
      the operation is "move one factor of 2 from k into N and re-evaluate", and the cost function
      is defined at every point of that family by the paper's own formulas; nothing that was
      discarded is needed to take the next step. It is emphatically NOT a change of coordinates:
      the attack is not recoverable from its cost curve, and two entirely different attacks can
      produce the same curve - which is a limitation the record names explicitly in
      observation_collision rather than hiding.
    propagation: >-
      One step of the target operation is one doubling of N with k halved. The propagation law is
      the claimed O(N) factor: if it is real and ring-borne, each doubling adds one bit of gain, so
      the ladder should show a slope of +1 bit per doubling over four interior points. If it is
      generic, the slope is 0. If it is sparsity-borne, the slope is 0 in N and nonzero along the
      other ladder. Three propagation laws, three distinguishable measured slopes, all on one plot
      with error bars - which is exactly the "can its one-step propagation be defined and measured"
      criterion of docs/inventor-protocol.md section 1.
    survival_score: >-
      SURVIVES THE WHOLE FAMILY BUT DISSOLVES AT BOTH ENDPOINTS, and both dissolutions are
      informative. At N = 1 "ring structure" is not merely absent, the concept is undefined - which
      is why the anchor must be a real unstructured scheme rather than a degenerate ring. At N = n
      the module rank is 1 and the instance is plain Ring-LWE, where the module-specific parts of
      the cost expression may themselves degenerate. The record therefore reports the ladder over
      the interior and treats the two endpoints as anchors whose formulas must be checked for
      degeneracy before use - a check that can fail and that Stage 0 performs symbolically.
  null_object_control: >-
    FOUR ARMS, each able to fail, with the forced values derived first so that agreement is not
    mistaken for evidence.
    NULL-1 (BASELINE REPRODUCTION, and it can fail): reproduce the source's own reported figures on
    >= 3 of its 16 parameter sets before anything else runs. Declared tolerance: within 1 bit. A
    failure here stops the record and is reported as the result.
    NULL-2 (THE N = 1 ARM, and its status is carefully stated): the unstructured twin is the
    comparator, and the FORCED VALUE derived in Stage 0 is that a purely ring-borne gain must give
    gain_{N=1} = 0 exactly. Because that value is derived, its agreement carries no information -
    obligation 4 of KN-TECH-1a5b7e - and the arm's power lies entirely in its capacity to
    DISAGREE, i.e. to return a nonzero gain on an instance with no ring at all. That is a control
    that can fail in the direction that matters.
    NULL-3 (THE GRADED LADDERS, supplying threshold, dynamic range and monotonicity): six ring
    points and >= 5 sparsity points, comparator named as the N = 1 arm, threshold declared before
    the run (>= 3 bits of ring-attributable gain at N = 256), both ends of the dynamic range
    exhibited, and MONOTONICITY reported rather than inferred from endpoints. The refinement in
    KN-TECH-1a5b7e is directly on point: a two-point gate can establish that the statistic MOVES
    without establishing that it can be SIGNED, and a gain that is non-monotone in N cannot be read
    as "more ring structure helps more".
    NULL-4 (COMPARATOR REPLICATION, mode 5): wherever any arm depends on a randomised choice -
    instance generation, a randomised guessing schedule, a seed in the cost model - draw it >= 8
    times and report the INTERVAL, never a point. A residual read against a single draw of a
    generated comparator inherits an unknown standard error, which is precisely the failure
    KN-TECH-1a5b7e mode 5 records. THE >= 8 DRAWS ARE NOT NEGOTIABLE AND WERE DELIBERATELY NOT
    CUT BY THE 2026-08-24 COST REPAIR: reducing them would have made the budget arithmetic work by
    disabling the arm that detects the record's single most likely quiet failure, which is a
    dishonest repair. The budget was cut on BREADTH instead - see interpretation_limits.
    CAN THIS NULL FAIL: yes at all four arms. NULL-1 fails if the source's numbers do not
    reproduce; NULL-2 fails if the ringless twin gains; NULL-3 fails if the ladder is flat or
    non-monotone; NULL-4 fails if the comparator interval is wider than the effect, which is the
    single most likely quiet failure and the one that would otherwise be invisible.
  discriminated_from:
  - >-
    IDEA-20260816-1418f4 also uses an unstructured-versus-negacyclic contrast, but its statistic is
    the per-coordinate failure-indicator correlation matrix at matched marginals - a
    decryption-side object. This record's statistic is a cost-function sensitivity and contains no
    failure event. The two would give consistent or inconsistent pictures of "what ring structure
    does" through entirely different channels, which makes them complementary rather than
    duplicative.
  - >-
    IDEA-20260808-dd4d30 concerns the rank-nbar dense sublattice planted by Frodo's matrix secret,
    i.e. the geometry of ONE instance. This record varies a FAMILY parameter and measures a
    derivative; it makes no claim about any single instance's lattice.
  - >-
    GOAL-MLKEM-003 and GOAL-MLKEM-004 own core-SVP conventions and memory-charged sieve cost. This
    record fixes the cost model as published and varies only its ring-degree argument; it selects
    no convention and charges no memory. Part (E) declares the handoff explicitly and the
    Coordinator may route the record elsewhere entirely. SEE repair_provenance: an independent
    red-team screen has since found this separation NOT ACHIEVABLE by the declared mechanism, and
    that finding is recorded as UNREPAIRED rather than argued with.
  - >-
    RQ-FHE-001 and the FHE-adjacent proposals treat FHE parameter regimes as targets. Here the FHE
    parameter sets appear only as the source's own inputs for the baseline reproduction gate; no
    FHE claim is made and no FHE parameter set is asserted to be secure or insecure.
  - >-
    RQ-FRODO-a2dbe2 owns the FO reduction ledger and takes LWE hardness as a given input. This
    record does not evaluate any IND-CCA bound and does not convert bits of attack cost into bits
    of scheme security through any reduction.
