  - ref: 'Howgrave-Graham, "A Hybrid Lattice-Reduction and Meet-in-the-Middle Attack against NTRU"'
    provenance: recalled
    claim: >-
      The origin of the hybrid lattice-reduction plus meet-in-the-middle decoding family whose
      cost expression is the baseline being audited. Not read this session.
    verified_by: null
  - ref: 'Albrecht, Player, Scott and the lattice-estimator maintainers'
    provenance: recalled
    claim: >-
      The standard LWE cost estimator takes (dimension, modulus, secret and error distributions,
      sample count) and is, for the primal and dual families, structure-blind: a module or ring
      instance is costed through its transformed unstructured instance. Not read this session; this
