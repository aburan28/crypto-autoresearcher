      baseline or FrodoKEM analysis appears. THE PAPER BODY WAS NOT READ.
    results: >-
      Nothing in this repository measures the ring-attributable share of any claimed attack gain,
      for any scheme. RQ-FHE-001 and the FHE-adjacent proposals concern FHE parameter regimes and
      hybrid attacks as targets, not as objects of an attribution audit. IDEA-20260816-1418f4 is
      the only prior use of Frodo as an unstructured control in the repository and its statistic is
      a failure-indicator correlation matrix at matched marginals - a chi-and-ciphertext-side
      object with no attack cost in it. IDEA-20260808-dd4d30 concerns the rank-nbar dense
      sublattice that Frodo's matrix secret plants, which is a statement about ONE instance's
      lattice geometry rather than about the N-dependence of a cost function across a family. On
      the external side, the search returned the general position that known RLWE attacks work by
      attacking the transformed unstructured instance - which is precisely the background against
      which a claimed ring-specific gain is notable and against which an unstructured control is
      the obvious missing arm.
    verdict: >-
      UNVERIFIED. One eprint abstract page was fetched; the paper body was not read, and no claim
      here asserts what that paper does or does not contain beyond what the fetched page returned.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY: measuring a ring-attributable share as a number in
      bits; using a standardized unstructured KEM as the N = 1 anchor of a ring-degree ladder at
      fixed total dimension; and the two-dimensional ring-by-sparsity cross that separates three
      explanations. ASSEMBLED FROM KNOWN PARTS: hybrid decoding, the estimator, and ablation
      ladders are all standard; the observation that the estimator is largely structure-blind is
      common knowledge in the field. The contribution is the controlled attribution, not any
      component.
  object_first_candidate:
    tracked_object: >-
      The RING DEGREE AS AN ARGUMENT OF THE ATTACK COST FUNCTION - concretely, the map
      N -> cost(N, k = n/N) at fixed total dimension n, modulus, secret distribution and sample
      count, and its discrete derivative in log N. What is followed through the computation is not
      an instance or a vector but the SENSITIVITY of a published cost expression to redistributing
      dimension between ring degree and module rank.
    lossiness: >-
      GENUINELY LOSSY. The projection discards the entire attack - the blocksize schedule, the
      guessing set, the decoder's internal structure, the lattice itself - and retains exactly one
      scalar per ladder point. The discard is compatible with the operation being tracked, because
      the operation is "move one factor of 2 from k into N and re-evaluate", and the cost function
      is defined at every point of that family by the paper's own formulas; nothing that was
      discarded is needed to take the next step. It is emphatically NOT a change of coordinates:
      the attack is not recoverable from its cost curve, and two entirely different attacks can
      produce the same curve - which is a limitation the record names explicitly in
      observation_collision rather than hiding.
    propagation: >-
      One step of the target operation is one doubling of N with k halved. The propagation law is
      the claimed O(N) factor: if it is real and ring-borne, each doubling adds one bit of gain, so
      the ladder should show a slope of +1 bit per doubling over four interior points. If it is
      generic, the slope is 0. If it is sparsity-borne, the slope is 0 in N and nonzero along the
      other ladder. Three propagation laws, three distinguishable measured slopes, all on one plot
      with error bars - which is exactly the "can its one-step propagation be defined and measured"
      criterion of docs/inventor-protocol.md section 1.
    survival_score: >-
      SURVIVES THE WHOLE FAMILY BUT DISSOLVES AT BOTH ENDPOINTS, and both dissolutions are
      informative. At N = 1 "ring structure" is not merely absent, the concept is undefined - which
      is why the anchor must be a real unstructured scheme rather than a degenerate ring. At N = n
      the module rank is 1 and the instance is plain Ring-LWE, where the module-specific parts of
      the cost expression may themselves degenerate. The record therefore reports the ladder over
      the interior and treats the two endpoints as anchors whose formulas must be checked for
      degeneracy before use - a check that can fail and that Stage 0 performs symbolically.
  null_object_control: >-
    FOUR ARMS, each able to fail, with the forced values derived first so that agreement is not
    mistaken for evidence.
    NULL-1 (BASELINE REPRODUCTION, and it can fail): reproduce the source's own reported figures on
    >= 3 of its 16 parameter sets before anything else runs. Declared tolerance: within 1 bit. A
    failure here stops the record and is reported as the result.
    NULL-2 (THE N = 1 ARM, and its status is carefully stated): the unstructured twin is the
    comparator, and the FORCED VALUE derived in Stage 0 is that a purely ring-borne gain must give
    gain_{N=1} = 0 exactly. Because that value is derived, its agreement carries no information -
    obligation 4 of KN-TECH-1a5b7e - and the arm's power lies entirely in its capacity to
    DISAGREE, i.e. to return a nonzero gain on an instance with no ring at all. That is a control
    that can fail in the direction that matters.
    NULL-3 (THE GRADED LADDERS, supplying threshold, dynamic range and monotonicity): six ring
    points and >= 5 sparsity points, comparator named as the N = 1 arm, threshold declared before
    the run (>= 3 bits of ring-attributable gain at N = 256), both ends of the dynamic range
    exhibited, and MONOTONICITY reported rather than inferred from endpoints. The refinement in
    KN-TECH-1a5b7e is directly on point: a two-point gate can establish that the statistic MOVES
    without establishing that it can be SIGNED, and a gain that is non-monotone in N cannot be read
    as "more ring structure helps more".
    NULL-4 (COMPARATOR REPLICATION, mode 5): wherever any arm depends on a randomised choice -
    instance generation, a randomised guessing schedule, a seed in the cost model - draw it >= 8
    times and report the INTERVAL, never a point. A residual read against a single draw of a
    generated comparator inherits an unknown standard error, which is precisely the failure
    KN-TECH-1a5b7e mode 5 records.
    CAN THIS NULL FAIL: yes at all four arms. NULL-1 fails if the source's numbers do not
    reproduce; NULL-2 fails if the ringless twin gains; NULL-3 fails if the ladder is flat or
    non-monotone; NULL-4 fails if the comparator interval is wider than the effect, which is the
    single most likely quiet failure and the one that would otherwise be invisible.
  discriminated_from:
  - >-
    IDEA-20260816-1418f4 also uses an unstructured-versus-negacyclic contrast, but its statistic is
    the per-coordinate failure-indicator correlation matrix at matched marginals - a
    decryption-side object. This record's statistic is a cost-function sensitivity and contains no
    failure event. The two would give consistent or inconsistent pictures of "what ring structure
    does" through entirely different channels, which makes them complementary rather than
    duplicative.
  - >-
    IDEA-20260808-dd4d30 concerns the rank-nbar dense sublattice planted by Frodo's matrix secret,
    i.e. the geometry of ONE instance. This record varies a FAMILY parameter and measures a
    derivative; it makes no claim about any single instance's lattice.
  - >-
    GOAL-MLKEM-003 and GOAL-MLKEM-004 own core-SVP conventions and memory-charged sieve cost. This
    record fixes the cost model as published and varies only its ring-degree argument; it selects
    no convention and charges no memory. Part (E) declares the handoff explicitly and the
    Coordinator may route the record elsewhere entirely.
  - >-
    RQ-FHE-001 and the FHE-adjacent proposals treat FHE parameter regimes as targets. Here the FHE
    parameter sets appear only as the source's own inputs for the baseline reproduction gate; no
    FHE claim is made and no FHE parameter set is asserted to be secure or insecure.
  - >-
    RQ-FRODO-a2dbe2 owns the FO reduction ledger and takes LWE hardness as a given input. This
    record does not evaluate any IND-CCA bound and does not convert bits of attack cost into bits
    of scheme security through any reduction.
  citations:
  - ref: >-
      Hou and Jiang, "Careful with the Ring: Enhanced Hybrid Decoding Attacks against
      Module/Ring-LWE", eprint 2026/366
    provenance: retrieved
    claim: >-
      Abstract page reports a complexity improvement by a factor O(N) in the sparse-secret setting
      over prior hybrid decoding attacks, 17x-114x speedups on known broken instances, improvements
      of up to 13 bits on all considered parameter sets, and 12 of 16 parameter sets falling below
      128-bit security; parameter sets are FHE ones (JM22, CCKS23, BCKS24, CHKS25, AKP25); the
      returned page contained no unstructured LWE baseline, no FrodoKEM, no ML-KEM and no Dilithium.
      ABSTRACT PAGE ONLY - the paper body was not read, and the returned text is a summariser's
      rendering.
    verified_by: idea-generator@2026-08-21
  - ref: 'Howgrave-Graham, "A Hybrid Lattice-Reduction and Meet-in-the-Middle Attack against NTRU"'
    provenance: recalled
    claim: >-
      The origin of the hybrid lattice-reduction plus meet-in-the-middle decoding family whose
      cost expression is the baseline being audited. Not read this session.
    verified_by: null
  - ref: 'Albrecht, Player, Scott and the lattice-estimator maintainers'
    provenance: recalled
    claim: >-
      The standard LWE cost estimator takes (dimension, modulus, secret and error distributions,
      sample count) and is, for the primal and dual families, structure-blind: a module or ring
      instance is costed through its transformed unstructured instance. Not read this session; this
      is the background assumption Stage 0 is designed to CHECK rather than to rely on.
    verified_by: null
  assumptions:
  - >-
    The enhanced decoder's cost expression can be transcribed from the filed primary text with
    every symbol bound to a definition. If it cannot - if the improvement is only reported as
    measured runtimes with no closed-form cost - Stage 0 is impossible and the record must be
    rewritten around measured runtimes instead, which is a much more expensive design.
  - >-
    An unstructured twin at the same total dimension, modulus, secret distribution and sample count
    is a fair comparator. This is the load-bearing modelling assumption and it is contestable:
    matching total dimension is one of several possible matchings (one could instead match the
    lattice determinant, the Gaussian heuristic root-Hermite target, or the number of unknowns),
    and the choice must be declared before the run and its alternatives reported as a sensitivity.
  - >-
    The paper's claimed gain is stated against a baseline that is itself reproducible. Stage 1's
    gate tests this and can fail.
  - >-
    Frodo's parameters as filed are the right dense anchor. They are dense by design, which is the
    property that matters, but they also differ from the FHE sets in modulus size and sample
    count, and those differences are confounders named below rather than assumed away.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the attribution itself: the published gain
      is measured entirely within the ring family, so the family index and the decoder improvement
      are perfectly confounded. Breaking that confound is the whole content, and it is broken by
      adding a family member with ring degree 1 - which requires no new mathematics, only an arm
      nobody ran.
    baseline_embedding:
      parameter_slice: >-
        The published claim is reproduced exactly as the slice (N = the paper's ring degree,
        sparse secret, the paper's 16 parameter sets), which is one corner of the two-dimensional
        ladder. The ladder is a family extension of the published experiment and contains it.
      reproduction_check: >-
        Stage 1's gate: >= 3 of the source's 16 reported figures reproduced to within 1 bit, as a
        frozen fixture, before any new arm is evaluated. A curve that merely looks similar is not
        a reproduction.
    observation_collision:
      observable: >-
        The bit-gain of the enhanced decoder over its stated baseline, as a scalar per instance
        family.
      distinct_preimage_search: >-
        The collision is REAL and is the design's central limitation: two structurally different
        attacks - one genuinely exploiting ring automorphisms, one merely reorganising the guessing
        set - can produce the same bit-gain curve. The record does not claim to distinguish them
        from the curve alone. What it claims is that the curve's SLOPE IN N separates
        ring-dependence from ring-independence, which is a weaker and defensible separation, and
        the sparsity ladder is the additional condition that separates the remaining pair. Where a
        collision survives both ladders, the record reports it as unresolved rather than picking a
        side.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Specialize the family at N = 1 - a real, standardized, published instance rather than a
        degenerate limit - and measure the gain there; charges are added only over the
        ladder points, which are disjoint by construction since each is a distinct (N, k) pair.
      predicted_gain: >-
        A signed, interval-valued ring-attributable share R in bits, where currently only an
        uncontrolled total exists.
    - transform: observable_fiber
      proposed_object: >-
        Hold the bit-gain fixed and vary the ring degree; the fibre is the set of (N, sparsity)
        pairs giving the same gain. Its shape is the response surface, and a fibre that is a
        horizontal line in N is a direct refutation of the ring attribution.
      predicted_gain: >-
        A geometric statement about the attribution rather than a scalar, which is more robust to
        cost-model choices than any single comparison.
    quantifier_order: >-
      FOR ALL instance families F in the declared ladder, THERE EXISTS a measured gain g(F) with an
      interval, AND the claim under test is: FOR ALL F with ring degree 1, g(F) <= 3 bits. Note
      what is NOT claimed: no statement of the form "there exists an attack such that for all
      instances ..." is made, because this record runs no attack. The witness (the decoder) is
      FIXED and the instance varies, which is the safe order; the unsafe order - letting the
      decoder be retuned per instance family - is explicitly forbidden by the protocol and any
      retuning must be reported as a separate arm.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: within THIS cost model, the gain does or does not
        depend on the ring degree, by this many bits, with this interval. The method can never
        certify that no ring-exploiting attack exists, can never certify that the cost model is
        right, and can never convert a bit-gain into a statement about any real adversary. It is
        also bounded by the source's own scope: if the source's improvement is only meaningful for
        sparse secrets, then the FrodoKEM anchor may return zero for a reason that has nothing to
        do with the ring, and the sparsity ladder is what prevents that from being misread.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails is a MODULE instance with k > 1 and
        small N - say N = 4, k = 160 at Frodo-640's total dimension. It has ring structure but very
        little of it, so a method that reports "ring-attributable" on this object as strongly as on
        N = 256 has not identified the load-bearing structure and is reading something else,
        probably the module rank. This point is included in the ladder for exactly that reason.
    proof_obligations:
    - claim: every occurrence of N in the cost expression is classified as type (i), (ii) or (iii)
      responsibility: baseline
    - >-
        claim: >= 3 of the source's reported figures reproduce to within 1 bit
        responsibility: baseline
    - claim: the unstructured twin matches on dimension, modulus, secret law, weight and samples
      responsibility: interface
    - claim: the ladder's gain slope in log N is measured with an interval from >= 8 draws
      responsibility: success_probability
    - claim: no core-SVP convention or memory model is selected by this record
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: number of type-(ii) ring-specific occurrences of N in the transcribed cost expression
    direction: different
    minimum_effect: >-
      >= 1 is required for the ring attribution to be even syntactically possible; 0 would settle
      the question symbolically at zero compute and is a complete result
  - metric: gain of the enhanced decoder over its baseline on the N = 1 unstructured twin, in bits
    direction: lower
    minimum_effect: >-
      <= 3 bits if the attribution holds; > 3 bits means at least ten of the claimed thirteen are
      generic and apply to unstructured LWE
  - metric: slope of gain in bits per doubling of N at fixed total dimension
    direction: higher
    minimum_effect: >-
      >= 0.5 bits per doubling for the ring attribution to be scored as supported; a slope
      indistinguishable from 0 over four interior points refutes it within this cost model
  - metric: monotonicity of gain in log N across the six ladder points
    direction: different
    minimum_effect: >-
      monotone, or else no directional reading may be attached to the label at all (KN-TECH-1a5b7e
      obligation-3 refinement)
  - metric: gain on Frodo-640 / Frodo-976 / Frodo-1344 as filed, in bits
    direction: lower
    minimum_effect: >-
      <= 1 bit expected; a gain above 3 bits on a standardized unstructured KEM is a finding that
      must be handed to GOAL-MLKEM-003/004 and independently reviewed before it is reported anywhere
  - metric: width of the comparator interval from >= 8 draws, relative to the measured effect
    direction: lower
    minimum_effect: >-
      < 0.5; an interval wider than half the effect means the effect is unresolved and must be
      reported as unresolved rather than as measured
  minimal_test:
    design: >-
      STAGED, WITH A CHEAP KILL SWITCH FIRST. Stage 0 (hours of human time, zero compute): the
      symbolic occurrence audit of N in the transcribed cost expressions. If it returns zero
      type-(ii) occurrences, the record terminates with a symbolic result and no compute is spent.
      Stage 1 (hours of compute): the baseline reproduction gate on >= 3 of the source's 16
      parameter sets. Stage 2-3 (the expensive part): the six-point ring ladder crossed with the
      >= 5-point sparsity ladder, each cell evaluated under both decoders, with >= 8 draws wherever
      anything is randomised. Stage 4: the three FrodoKEM anchors. THIS DISCRIMINATES because the
      three competing explanations predict three different response surfaces - ring-borne gives a
      positive slope in N and flat in density, sparsity-borne gives flat in N and a strong slope in
      density, generic gives flat in both with a nonzero intercept at N = 1 - and no two of those
      surfaces are confusable given the declared thresholds. NEGATIVE OUTCOMES ARE FULLY DEFINED:
      a flat-in-N surface refutes the ring attribution within this cost model; a failure of Stage 1
      voids everything downstream and is reported as a reproduction failure with its size; an
      interval wider than the effect is reported as unresolved, which is the honest third answer.
    controls:
    - baseline reproduction gate on >= 3 source parameter sets to within 1 bit, run first
    - >-
      N = 1 unstructured twin with its forced value derived before the run, so that agreement is
      not read as evidence and only disagreement is informative
    - six-point ring ladder with the comparator named, threshold pre-declared, monotonicity reported
    - '>= 5-point sparsity ladder at fixed N, run on the identical code path in the same invocation'
    - '>= 8 draws of every randomised comparator, reported as intervals (KN-TECH-1a5b7e mode 5)'
    - >-
      matching-rule sensitivity: repeat the twin construction under at least one alternative
      matching (lattice determinant instead of total dimension) so that a result that depends
      entirely on the matching rule is exposed
    - >-
      degeneracy check at both ladder endpoints, symbolically, before the endpoints are used as
      anchors
    required_metrics:
    - classification counts of N-occurrences by type (i)/(ii)/(iii)
    - reproduced versus reported figures on the gate parameter sets, with residuals in bits
    - gain in bits at each of the six ring-ladder points, with intervals
    - gain in bits at each sparsity-ladder point, with intervals
    - measured slope in bits per doubling of N, with an interval
    - monotonicity flags for both ladders
    - gain on each of the three FrodoKEM parameter sets, with intervals
    - R = gain(N=256) - gain(N=1), with an interval
    - comparator interval widths relative to the measured effects
  falsification_conditions:
  - >-
    Stage 0 finds zero type-(ii) occurrences. The ring attribution is refuted symbolically at zero
    compute, and that is the complete result.
  - >-
    Stage 1 fails to reproduce the source's figures. Nothing downstream is readable; the
    reproduction failure and its size are the deliverable, and no claim about the source is made
    beyond "this pipeline did not reproduce these figures at these inputs".
  - >-
    The ring ladder is flat within intervals. The gain is not ring-attributable within this cost
    model, at least ten of the thirteen bits are generic, and the consequence for unstructured
    LWE - including FrodoKEM - must be handed off and independently reviewed.
  - >-
    The ring ladder is non-monotone. No directional reading may be attached; the record reports the
    surface and withdraws the label.
  - >-
    The sparsity ladder shows the gain vanishing at Frodo-like density. Then the FrodoKEM anchor's
    zero is explained by sparsity rather than by the ring, the attribution question is left open,
    and saying so is the honest outcome.
  - >-
    Comparator intervals exceed half the effect at any headline cell. That cell is reported as
    unresolved. This is the outcome the record most expects to have to report somewhere.
  - >-
    The result inverts under the alternative matching rule. The number is an artefact of the
    matching choice and not a property of the attack; the matching rule becomes the finding.
  confounders:
  - >-
    THE MATCHING RULE IS THE BIGGEST ONE. "Same instance except for the ring" is not well-defined,
    and matching total dimension is a choice that could itself create or destroy the effect. The
    mitigation is to declare it first and to run at least one alternative.
  - >-
    Modulus and sample count differ between the FHE parameter sets and FrodoKEM by large factors,
    so the FrodoKEM anchor is not a matched twin of anything in the source - it is a standardized
    dense unstructured reference point. Reading it as a matched control would be an error and the
    record must not do so.
  - >-
    Decoder retuning. If the enhanced decoder's internal parameters are re-optimised per family,
    the comparison silently becomes "best tuning found for family A versus best found for family
    B", which is a search-effort comparison rather than a structural one. Tuning budget must be
    equalised and reported.
  - >-
    Cost-model drift between the source's baseline and this program's baseline. The gate exists to
    catch it, but a gate passed on 3 of 16 sets does not license the other 13.
  - >-
    Publication-side selection: "up to 13 bits" is a maximum over 16 sets, and comparing a maximum
    against a controlled median would manufacture a difference. Report the full distribution of
    gains, never the maximum alone.
  interpretation_limits:
  - >-
    NO ATTACK IS PROPOSED, IMPLEMENTED OR IMPROVED, and no exponent is claimed or moved.
  - >-
    Every number is inside the transcribed cost model and inherits all of its assumptions. A gain
    measured in a cost model is not a gain against a real adversary.
  - >-
    Nothing here asserts that eprint 2026/366 is wrong. An abstract without an unstructured control
    is not an error; the control being absent from the ABSTRACT PAGE THIS SESSION FETCHED is all
    that is established, and the paper body was not read.
  - >-
    No FrodoKEM parameter set is asserted to be weaker or stronger than published. If the FrodoKEM
    anchor moves, that finding is a handoff to GOAL-MLKEM-003/004 and requires independent review
    before any security reading, per RQ-FRODO-3260cc's claim-tier ceiling.
  - >-
    Scoped to the ladder points actually evaluated, the cost model as transcribed, and the matching
    rules actually run.
  heuristic_assumptions:
  - id: H1
    statement: >-
      For the cost model as transcribed, the estimated bit-security of an instance depends on the
      pair (N, k) only through the total dimension n = N*k, EXCEPT through the syntactic
      occurrences classified as type (ii) in Stage 0. Formally: for all (N, k) and (N', k') with
      N*k = N'*k' = n and all other parameters equal, cost(N, k) = cost(N', k') whenever the
      type-(ii) terms are suppressed.
    rigorous_support: >-
      The rigorous companion is the symbolic audit itself, which either exhibits the identity or
      exhibits the terms that break it - so unlike most heuristics this one is settled by algebra
      rather than by sampling, and the heuristic content reduces to "the transcription is
      complete". Its role here is the analogue of the exemplar's rigorous size bound: a proved
      structural fact that the distributional assumption is then layered on.
    validation_plan: >-
      Machine-checked symbolic substitution: evaluate the transcribed expression at every ladder
      point with type-(ii) terms suppressed and require BITWISE identical outputs across the whole
      ring ladder at fixed n. Any nonzero spread localises an unclassified occurrence. Sampled
      parameters: the six ladder points at each of the source's 16 parameter sets and at the three
      FrodoKEM sets. Transfer assumption: none - this is a symbolic identity check at the real
      parameters, not an extrapolation.
  - id: H2
    statement: >-
      The unstructured twin at matched (n, q, secret law, Hamming weight, sample count) is a
      faithful null for the ring question, i.e. its gain differs from the ring instance's gain by
      an amount attributable to the ring alone and not to the matching rule.
    rigorous_support: >-
      No rigorous support exists; this is a modelling choice and is named as the record's weakest
      assumption. The nearest rigorous fact is the recalled background position that known
      Ring-LWE attacks proceed via the transformed unstructured instance, which if true makes the
      twin the natural null - but that position was not verified this session.
    validation_plan: >-
      Sensitivity rather than proof: repeat the entire ladder under a second matching rule
      (matched lattice determinant) and report both surfaces. If the sign of R differs between the
      two matchings, H2 is refuted and the deliverable becomes the matching-dependence itself,
      which is a usable obstruction with a number. Sampled parameters: the same ladder, run twice.
      Transfer assumption: explicitly recorded - results under one matching do not transfer to the
      other and neither transfers to a third.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED BY THIS RECORD, and this must be said plainly against
      docs/target-result-profile.md: the record is a control, not a target-class result, and it
      would fail checklist item C1. It EARNS its priority as a building block in the sense the Idea
      Generator contract permits, because the quantity it measures - whether a claimed
      structure-borne gain is structure-borne - is a precondition for interpreting any exponent
      claim in the module/ring family, including every ML-KEM estimate this program holds. Cost of
      the measurement: cost-model evaluations only, no lattice reduction; the source reports its
      own gains as estimates, so each ladder cell is an optimisation over blocksize and guessing
      parameters costing seconds to minutes, times roughly 6 x 5 x 2 x 19 cells x 8 draws.
    memory_exponent: >-
      No attack memory exponent is claimed. The evaluation is memory-trivial; only the response
      surface is stored.
    best_known: >-
      The incumbent for the QUANTITY MEASURED is nothing: no published or internal record gives a
      ring-attributable share in bits, which is the gap. The incumbent for the ATTACK is the source
      itself as transcribed, and this record does not compete with it.
    hidden_overhead: >-
      What is hidden is human effort and cost-model risk rather than an o(1). Transcribing a cost
      expression faithfully from a paper is the dominant cost and the dominant risk; if the source
      reports only measured runtimes and no closed form, Stage 0 is impossible and the record's
      cost rises by an order of magnitude. The record also inherits every optimism and pessimism of
      the transcribed model, in both directions, and cannot detect them.
    tradeoff_note: >-
      The ladders parallelise perfectly - every cell is independent - so wall-clock scales as
      cells/processors with no communication. The real tradeoff is ladder resolution against
      false-match rate: more ladder points give a better-resolved slope and more opportunities for
      a spurious monotone run, so the number of points is declared before the run and the slope's
      interval is computed from the >= 8 draws rather than from the ladder's own scatter.
  dominated_by: >-
    n/a (no attack result claimed). Checked before writing: this repository holds no time/memory/
    data frontier row for FrodoKEM, and the ML-KEM cost rows under GOAL-MLKEM-003/004 concern
    core-SVP conventions and memory-charged sieve cost, which this record explicitly does not
    compute or compete with. Externally, eprint 2026/366 as fetched dominates on the ATTACK axis by
    construction - it is the attack; this record is not on that axis. On the MEASUREMENT axis
    nothing dominates, because no ring-attributable share exists anywhere this session's searches
    reached. Bare 'null' is not written, because that would assert a check against a frontier row
    that does not exist (AGENTS.md rule 5).
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively: the published claim is a single
    uncontrolled maximum ("up to 13 bits", 12 of 16 sets below 128) with no ring-degree-1 arm; this
    record would produce a response surface over 6 ring points x >= 5 sparsity points x 2 decoders
    with intervals from >= 8 draws, plus three standardized unstructured anchors, plus a scalar R
    with an interval. The delta is the creation of an attribution number and its null floor where
    only an uncontrolled total exists.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part. (i) That the cost expression can be transcribed in closed form at all: ~0.6 - this is
    the single biggest execution risk and it is upstream of everything. (ii) That Stage 0 finds at
    least one genuine type-(ii) occurrence: ~0.8; a paper claiming an O(N) ring factor probably has
    one, though "probably" is doing real work here. (iii) That the baseline reproduction gate
    passes on >= 3 of 16 sets to within 1 bit: ~0.5 - reproducing another group's estimator numbers
    is historically hard and this program has no track record of doing it. (iv) That the ring
    ladder shows a slope distinguishable from zero over four interior points: ~0.55, and I would
    genuinely not predict the sign of the surprise. (v) That the FrodoKEM anchors return <= 1 bit:
    ~0.75. (vi) That the whole thing produces a defensible response surface within a bounded
    budget: ~0.45 - this is the most likely record in this batch to be halted at a gate, and the
    staged design with a zero-compute kill switch exists because of that.
