  repair_provenance:
  - date: '2026-08-24'
    by: idea-generator
    finding: >-
      Red-team BLOCKING 5 against this record: the compute estimate is wrong by about two orders of
      magnitude against the goal's entire campaign budget, and estimated_cost said 'medium'.
    status: REPAIRED
    what_was_wrong: >-
      target_complexity.time_exponent stated the design as 'roughly 6 x 5 x 2 x 19 cells x 8 draws'
      and never multiplied it out. The product is 9120 estimator evaluations. At the record's own
      assumed 10 s per evaluation that is 91200 s = 25.3 hours; at 60 s it is 547200 s = 152 hours.
      GOAL-FRODO-001.campaign_budget.total_wall_clock_seconds is 10800 - three hours for the WHOLE
      six-batch campaign - so the design overruns the entire campaign budget by 8.4x to 50.7x, and
      estimated_cost.compute 'medium' mispriced it for the Coordinator's ranking, which is the one
      field prioritisation reads.
    repair: >-
      THE ARITHMETIC WAS REDONE AND THE DESIGN CUT, NOT THE PROSE SOFTENED.
      GOAL-FRODO-001.campaign_budget was re-read and added as an `internal` citation with
      verified_by. (a) estimated_cost.compute raised from medium to HIGH, with a `note` carrying
      the full derivation - 9120 cells, the assumed 10-60 s per cell, the 91200-547200 s total, the
      10800 s campaign budget and the 8.4x-50.7x overrun - written into the field itself as the
      finding requires. (b) target_complexity.time_exponent now carries the same derivation in
      full plus a BUDGETED SUBSET: 48 + 96 + 80 + 48 = 272 evaluations. (c) That subset is honestly
      reported as STILL NOT FITTING - 2720 s at the cheap end is 25 per cent of the whole campaign
      budget and 16320 s at the dear end is 151 per cent of it - so the record carries an EXPLICIT
      BUDGET REQUEST of up to 16320 s rather than pretending to fit, and states that the receiving
      goal must check 272 times its own measured per-cell cost against its own budget before
      approval. (d) A new Stage 1b was added: measure the median per-evaluation cost on the first 8
      Stage-1 timings, project, and HALT BEFORE ANY LADDER CELL if the projection exceeds the
      grant, with the halt recorded as a budget outcome under AGENTS.md rule 3. A matching
      prediction, falsification condition, control, required metric and proof obligation were added
      for it. (e) An assumption was added recording that the 10-60 s per-cell figure is ASSUMED by
      the proposing agent and supported by no run record. (f) tradeoff_note now notes
