  - Logical-gate depth is the right currency for a MAXDEPTH comparison. It is what NIST states,
    and it is NOT what determines buildability; the record does not conflate them.
  - The depth algebra (add / max / no-change) is applied to the algorithm as PUBLISHED, not to a
    reconstruction. A paper whose composition structure is not explicit enough to walk is excluded.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion: the conversion of a quantum GATE COUNT into a
      security-category comparison without checking the DEPTH the gate count presupposes. That
      conversion is performed implicitly by every quantum core-SVP number and is checked nowhere in
      this program.
    baseline_embedding:
      parameter_slice: >-
        MAXDEPTH = infinity reproduces the quoted quantum exponent exactly, and the depth-limited
        gate count must equal the unlimited one in that limit. That is the exact old-method
        boundary and it is a runnable configuration of the pipeline, not a limit argument.
      reproduction_check: >-
        Symbolic and frozen: at MAXDEPTH = infinity the pipeline must return the paper's own
        quoted exponent for every algorithm in scope, digit for digit as quoted. A pipeline that
        cannot reproduce the unconstrained number has no standing to report a constrained one.
    observation_collision:
      observable: 'delta, the coherent-depth exponent, one rational per algorithm.'
      distinct_preimage_search: >-
        COLLISION FOUND AND STATED: two algorithms with the same delta can have wildly different
        gate counts, T-counts and physical footprints, so delta alone does not rank algorithms.
        A collision on the two SIDES of the conclusion: an algorithm with tiny delta and enormous
        QRAM width passes the MAXDEPTH test and is unbuildable; an algorithm with large delta and
        no QRAM fails the MAXDEPTH test and could be run in segments with a modest classical
        overhead. THE PIPELINE THEREFORE REPORTS A TRIPLE, NOT A SCALAR, and every verdict is
        per-axis. Reporting a single "quantum margin is / is not real" verdict would be exactly the
        mode-4 failure KN-TECH-1a5b7e records.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Carry the resource TRIPLE (depth, QRAM width, query count) through the composition instead
        of the single gate count the published exponent preserves. The stronger state is what
        survives the MAXDEPTH operation; the gate count does not.
      predicted_gain: >-
        Makes the MAXDEPTH question decidable at all. The measurable output is a per-cell signed
        depth excess in bits and a realisable exponent per MAXDEPTH value; predicted magnitude is
        21.2 and 45.6 bits of depth excess at ML-KEM-768 and -1024 under MAXDEPTH 2^40 IF the
        strawman depth model of part (C) turns out to describe a real algorithm, which is the very
        thing Stage 1 tests.
    - transform: representation_reduction
      proposed_object: >-
        Restate the quantum security claim in the model where the hypothesis is an exact inequality
        (coherent depth <= MAXDEPTH) rather than a weighting, with separate encoding, soundness and
        cost-loss obligations for the depth-limited parallelisation penalty.
      predicted_gain: A conditional statement with an explicit, checkable side condition.
    quantifier_order: >-
      FOR EACH algorithm in scope and FOR EACH MAXDEPTH value D in {2^40, 2^64, 2^96} and FOR EACH
      of the three committed sieve dimensions, THERE EXISTS a realisable gate-count exponent
      t_D >= t_quoted computed by the depth-limited accounting. THE DISCRIMINATING CLAIM reverses
      the innermost quantifier and is the one that can fail: THERE EXISTS an algorithm in scope and
      a D in that set such that t_D > t_quoted STRICTLY, at a dimension in the committed set. NOTE
      what is NOT claimed: nothing uniform over all quantum algorithms, nothing about algorithms
      not yet published, and nothing about algorithms whose primary text Stage 1 could not read.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the quantum sieve costings whose primary text was read, at the three committed
        effective sieve dimensions and under NIST's stated MAXDEPTH values, the coherent depth is
        [table] and the realisable gate-count exponent is [table], against the quoted exponent
        [table]." NOTHING about buildability, nothing about physical qubits, nothing about whether
        ML-KEM is secure, and nothing about algorithms outside the read set.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a quantum algorithm with the SAME
        gate count and NEGLIGIBLE coherent depth - many independent short Grover searches whose
        results are combined classically. The method must give it a MAXDEPTH-free pass while
        penalising a genuinely sequential algorithm of identical gate count. If the pipeline
        treats the two identically it is reading gate count, not depth, and has not identified the
        load-bearing structure. This control is explicitly constructible and is in the required
        list.
    proof_obligations:
    - claim: At MAXDEPTH = infinity the pipeline reproduces each paper's quoted exponent exactly.
      responsibility: baseline
    - claim: NULL-K reproduces the published depth-limited AES-128 figures within the source's slack.
      responsibility: correctness
    - claim: NULL-C returns no depth penalty on a classical algorithm.
      responsibility: soundness
    - claim: The nearby-object control (many short searches) is not penalised.
      responsibility: strictness
    - claim: Every exponent read is attributed to a page of primary text or the algorithm is excluded.
      responsibility: interface
    - claim: No claim is made about physical resources or buildability.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'delta, the coherent-depth exponent of the longest quantum subroutine, read from
      primary text, for the quantum sieve costings in scope'
    direction: higher
    minimum_effect: '0.10 for at least one algorithm - which puts coherent depth above 2^{38.5} at
      the smallest committed sieve dimension and makes MAXDEPTH = 2^40 a live constraint. delta
      below 0.05 for every algorithm refutes the claim.'
  - metric: 'signed depth excess over MAXDEPTH = 2^40, in bits, at the three committed effective
      sieve dimensions'
    direction: higher
    minimum_effect: '0 bits at ML-KEM-512 and 20 bits at ML-KEM-1024, under the strawman model of
      part (C); a measured-from-text value below 0 at every set refutes the claim'
  - metric: 'realisable quantum gate-count exponent under MAXDEPTH = 2^64 minus the quoted quantum
      exponent'
    direction: higher
    minimum_effect: '0.01 - about 8 bits at the ML-KEM-1024 sieve dimension; zero means the bound
      does not bite and Explanation A wins on the depth axis'
  - metric: 'spread of the realisable exponent across the three QRAM query-cost models
      (unit / sqrt-width / width)'
    direction: higher
    minimum_effect: '0.027, the quoted classical-minus-quantum exponent gap at memory 0.2075; a
      spread below that means QRAM pricing cannot change the category verdict and Explanation B''s
      memory leg is refuted'
  - metric: 'NULL-K agreement with the published depth-limited AES-128 gate count'
    direction: different
    minimum_effect: 'within the source''s own stated slack; outside it, the instrument is void and
      no ML-KEM cell is reportable'
  - metric: 'NULL-C depth penalty applied to a classical sieve'
    direction: different
    minimum_effect: 'exactly zero; anything else voids the pipeline'
  minimal_test:
    design: >-
      READING AND ARITHMETIC, NO SIMULATION, NO SIEVE, NO INSTRUMENT REBUILD. Step 1: obtain
      MAXDEPTH's values from primary text, or record the failure and mark every conclusion
      conditional (RQ-MLKEM-003's provenance block already records that csrc.nist.gov is
      unreachable from this harness, so this step may legitimately fail). Step 2: run NULL-K on
      AES-128 - read the published depth-limited figures, walk them through the pipeline, and
      compare. THIS IS DONE BEFORE ANY LATTICE ALGORITHM IS TOUCHED and the batch stops here if it
      fails. Step 3: run NULL-C on a classical sieve; the pipeline must report no penalty. Step 4:
      read the primary text of the quantum sieve costings in scope, extract the composition
      structure and the resource triple per subroutine, and check the internal falsifier (the
      algebra must reproduce the paper's own gate count). Step 5: emit the depth table, the
      depth-excess table and the realisable-exponent table at the three committed dimensions and
      the three MAXDEPTH values. Step 6: run NULL-Q, the three-model QRAM ladder, and REPORT
      monotonicity across it. Step 7: emit the three-branch verdict per algorithm per axis, having
      already emitted it on NULL-C.
      WHY THIS DISCRIMINATES: the two explanations differ by roughly 40 bits in a quantity that is
      READ from published text rather than fitted, so no statistical power argument is involved and
      no seed is drawn. The cheapest cell - delta for a single algorithm - already separates them.
      STOPPING RULE: if NULL-K fails, nothing about ML-KEM is reported and the deliverable is the
      calibration failure, which is itself a usable result about this program's ability to do
      quantum accounting at all.
    controls:
    - 'NULL-K: the identical pipeline on Grover key search for AES-128, against published
      depth-limited figures fixed by a third party, run FIRST'
    - 'NULL-C: the identical pipeline on a classical sieve, which must show zero depth penalty'
    - 'nearby-object control: an algorithm of identical gate count composed of many short
      independent searches, which must NOT be penalised'
    - 'MAXDEPTH = infinity regression reproducing each paper''s quoted exponent digit for digit'
    - 'NULL-Q: the three-model QRAM ladder with monotonicity reported, not assumed'
    - 'internal falsifier: the depth algebra must reproduce each paper''s own gate count from its
      own subroutine structure'
    - 'exclusion list: every algorithm whose primary text could not be read, recorded rather than
      estimated'
    required_metrics:
    - delta per algorithm with the page of primary text it was read from
    - QRAM width exponent and query-count exponent per algorithm, with the paper's declared memory model
    - qubit-count exponent, carried separately and never summed with bit counts
    - coherent depth in bits at 385.084530 / 590.132012 / 825.235330
    - signed depth excess against each of 2^40, 2^64, 2^96
    - realisable gate-count exponent per (algorithm, MAXDEPTH, dimension), against the quoted one
    - NULL-K agreement and its slack; NULL-C penalty (must be zero); nearby-object verdict
    - the QRAM ladder's three exponents and the monotonicity statement
    - the exclusion list and, for each excluded algorithm, why
  falsification_conditions:
  - 'delta < 0.05 for every algorithm read: MAXDEPTH does not bind at any FIPS 203 sieve dimension
    even at 2^40, Explanation A wins on the depth axis, the quoted quantum exponents stand, and the
    claim is refuted. This is a real and valuable negative that would close the depth question for
    this lane.'
  - 'The realisable exponent equals the quoted one at every MAXDEPTH and dimension: the depth
    accounting changes nothing and the record''s premise is empty.'
  - 'The QRAM ladder moves the realisable exponent by less than the classical-quantum gap: QRAM
    pricing cannot change a category verdict and Explanation B''s memory leg is refuted
    independently of its depth leg.'
  - 'NULL-K fails to reproduce the published AES-128 depth-limited figures: the pipeline is not
    calibrated, no ML-KEM number is reportable, and the batch reports a calibration failure.'
  - 'NULL-C reports a nonzero depth penalty on a classical algorithm: the pipeline charges
    something it should not and is void.'
  - 'The nearby-object control (many short searches) is penalised identically to a sequential
    algorithm of the same gate count: the pipeline is reading gate count, not depth.'
  - 'Stage 1 finds the question already answered in AGPS20 or a successor: the record is demoted to
    a literature note with a citation, which is a good outcome and is declared as such in advance.'
  confounders:
  - >-
    LOGICAL VERSUS PHYSICAL. MAXDEPTH is stated in logical gates; feasibility is physical. arXiv
    2410.13759's ~10^13 physical qubits and ~10^31 years at dimension 400 shows the two answers
    diverge enormously. Conflating them would make the record either alarmist or complacent
    depending on direction, and the pipeline never crosses the boundary.
  - >-
    THREE MEMORY RESOURCES, ONE HABIT OF SUMMING THEM. Classical bits, QCRAM bits and qubits are
    distinct; ePrint 2025/2189 reports 2^{0.1887d} of the first two and 2^{o(d)} of the third, and
    an accounting that adds them is a category error. Carried as separate columns throughout.
  - >-
    The depth-limited parallelisation penalty has more than one form in the literature and the
    choice changes the answer. The form used must be declared, cited, and applied identically to
    NULL-K, where a third party's answer constrains it.
  - >-
    Published quantum exponents are asymptotic with unbounded o(d), exactly as the classical ones
    are; EV-MLKEM-020 already flags this for the classical memory exponent. Depth exponents inherit
    the same slack and no conclusion may rest on a difference smaller than it.
  - >-
    Reading risk. A composition structure inferred rather than read is a fabrication route. The
    exclusion list exists to make the reading boundary auditable, and an algorithm read from a
    survey rather than from its own paper is excluded.
  - >-
    MAXDEPTH itself is a NIST modelling choice, not a physical law, and its three values span 56
    bits. A verdict that flips across that span is reported as a table, never as a conclusion.
  interpretation_limits:
  - Nothing here is a measurement. No circuit is simulated, no instance is solved, no quantum
    resource is executed. Every number is read from published text or derived from it by exact
    composition algebra.
  - A finding that MAXDEPTH binds would mean a quantum COST MODEL charges too little under NIST's
    own stated bound. It would NOT mean ML-KEM is more secure than believed in any operational
    sense, because MAXDEPTH is a modelling convention and an attacker is not bound by it.
  - A finding that MAXDEPTH does not bind would NOT mean the quantum attack is feasible; arXiv
    2410.13759, retrieved this session, argues the opposite on physical grounds and this record
    does not contradict it.
  - Every conclusion is scoped to the algorithms whose primary text was read and appears in the
    inclusion list. The exclusion list is part of the result.
  - The three committed sieve dimensions are themselves outputs of a pinned classical estimator run
    and inherit its assumptions, including the d4f convention that the sibling record
    IDEA-20260821-374af4 puts in question. If that convention moves, these dimensions move and
    every depth figure here moves with them.
  - AGENTS.md rule 12 is UNMET and inherited; no committed record's status is proposed to change.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (DEPTH ALGEBRA FIDELITY) For each quantum sieve costing in scope, the composition structure
      stated in its primary text is complete enough that applying serial-addition,
      parallel-maximum and classical-repetition-invariance to its declared subroutines yields the
      true longest coherent depth up to a factor 2^{o(d)}. Formally: there exist constants such
      that depth_true(d) = 2^{delta*d + o(d)} with delta the value the algebra returns, uniformly
      for d in [385, 826].
    rigorous_support: >-
      The rigorous ingredient is exact and unconditional: the three composition rules are theorems
      about circuits, not assumptions. What H1 adds is that the PAPERS' descriptions are complete -
      the same kind of assumption every reader of an algorithm makes, and the classical statement it
      imitates is the standard convention that a published complexity analysis accounts for all
      dominant subroutines. H1 is falsifiable by the internal check: the same algebra must
      reproduce the paper's own gate count.
    validation_plan: >-
      SAMPLE: the subroutine decomposition of each algorithm in the inclusion list, plus AES-128
      Grover as the calibration object. SCALE: not a sampling exercise - the validation is
      reproduction of two published quantities per algorithm (its gate count and, where stated, its
      depth) from its own structure. COMPARISON DISTRIBUTION: none; the comparison is against the
      paper's own printed exponents, digit for digit. TAIL CHECK: the algorithm with the most
      complex composition structure (ePrint 2025/2189's two-level amplitude amplification is the
      obvious candidate) is the one where H1 is most likely to fail, and it is checked first rather
      than last. TRANSFER ASSUMPTION, STATED: H1 is validated only for the algorithms read; it
      transfers to no other algorithm, and an unread algorithm is excluded rather than assumed to
      obey it.
  - id: H2
    statement: >-
      (DIMENSION TRANSFER) The effective sieve dimensions 385.084530 / 590.132012 / 825.235330,
      committed in EV-MLKEM-020 as outputs of the pinned classical estimator under RC.MATZOV, are
      the dimensions at which a quantum attacker's sieve would run. Formally: the blocksize a
      quantum attacker needs is the same as the one a classical attacker needs, so only the COST
      of the sieve changes and not its DIMENSION.
    rigorous_support: >-
      The rigorous part is that the required blocksize is set by the lattice geometry - the
      root-Hermite factor needed for recovery - which is a property of the instance and not of the
      machine. The distributional statement H2 imitates is the standard estimator convention that
      the reduction quality target is machine-independent. H2 CAN FAIL: an attacker with a cheaper
      SVP oracle may re-optimise to a LARGER blocksize, which would move the dimensions upward and
      make every depth figure here an underestimate. That failure direction is stated because it
      makes the record's conclusion conservative, not because it is harmless.
    validation_plan: >-
      SAMPLE: re-run the pinned estimator with the quantum reduction cost model in place of
      RC.MATZOV and record the selected (beta, eta) for each FIPS 203 set. COMPARISON: the selected
      dimensions against the committed classical ones. This is one estimator invocation and is the
      cheapest validation in this record. TAIL CHECK: if the quantum-optimised dimensions exceed
      the classical ones by more than 5%, every depth number in the deliverable is recomputed at
      the new dimensions and both tables are reported. TRANSFER ASSUMPTION: this validates H2
      inside the pinned estimator's own optimisation, not against a real attacker.
  target_complexity:
    time_exponent: >-
      NO NEW ATTACK EXPONENT IS CLAIMED. The record's output is a SIGNED CORRECTION to a published
      quantum exponent under a stated depth budget: realisable t_D minus quoted t, per algorithm
      per MAXDEPTH per dimension. The quoted anchors are 0.265 [RECALLED, Laarhoven 2-sieve] and
      0.2846 [RETRIEVED, ePrint 2025/2189 3-sieve at memory 0.1887], against classical 0.292
      [RECALLED]. The correction's sign is forced non-negative; its magnitude is the deliverable and
      is currently unknown. The record's own compute cost is a table: seconds.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED, but the memory MODEL is half the object. The quantum
      points carry 2^{0.2075d} or 2^{0.1887d} of QUANTUM-ACCESSIBLE memory, which is a strictly
      stronger requirement than the same quantity of classical memory, and no cost model in this
      lane charges the difference. ePrint 2025/2189's 2^{o(d)} qubit count is the good news on this
      axis and is reported as such. The record's own memory is a table of a few dozen rows.
    best_known: >-
      There is no incumbent anywhere in this repository: the greps above establish that no
      RQ-MLKEM-003 record contains any quantum analysis, and the MAXDEPTH-bearing records belong to
      other schemes. Externally, arXiv 2410.13759 is the closest published work and it answers the
      PHYSICAL question rather than the MAXDEPTH question; whether AGPS20 or a successor already
      answers the MAXDEPTH question for a lattice sieve is UNKNOWN to this record and is Stage 1's
      first job.
    hidden_overhead: >-
      (i) The o(d) in every quantum exponent is unbounded exactly as in the classical case, and
      EV-MLKEM-020's own record flags this for the classical memory exponent; a depth exponent
      inherits the same slack. (ii) MAXDEPTH is stated in logical gates and hides the entire
      fault-tolerance overhead, which arXiv 2410.13759 estimates at ~10^13 physical qubits at
      dimension 400 - so a MAXDEPTH pass hides a physical infeasibility of enormous size, and a
      MAXDEPTH failure is therefore the weaker of the two objections. (iii) The QCRAM assumption
      hides an unbuilt device; the record prices it three ways rather than pretending to resolve it.
      (iv) The committed sieve dimensions are outputs of a classical estimator whose own d4f
      convention the sibling record IDEA-20260821-374af4 puts in question.
    tradeoff_note: >-
      The depth-limited parallelisation penalty IS a time-memory-parallelism tradeoff and is the
      content of Stage 3: under a depth cap D, an amplitude amplification of length L must be run as
      roughly (L/D)^2 independent instances of depth D, so the gate count rises while the wall-clock
      time falls - the classic Grover parallelisation position. This is exactly the van
      Oorschot-Wiener-shaped interpolation the target profile asks every asymptotic claim to state,
      transposed to the quantum setting. PARALLELISATION POSITION, stated: quantum sieving under a
      depth cap parallelises BADLY in the sense that costs matter (gate count grows) and WELL in the
      sense that wall-clock does not, which is why the choice of metric - gate count versus
      gate-count-depth product - changes the verdict and must be declared before the table is built,
      not after.
  dominated_by: >-
    n/a (no result claimed on any attack axis), stated after checking rather than asserted. This
    record implements nothing, solves nothing and queries nothing, so there is no cost triple to
    place on any frontier. On the ANALYSIS axis I checked all 21 RQ-MLKEM-003 proposal titles, the
    27 QRAM/Grover-bearing proposals across all lanes, the 27 MAXDEPTH-bearing files, and the
    committed GOAL-MLKEM-003/004 evidence records; none performs quantum cost analysis for a
    lattice sieve, so nothing in this repository dominates. EXTERNALLY: arXiv 2410.13759 dominates
    any claim about the PHYSICAL feasibility of quantum sieving and is cited rather than competed
    with; if AGPS20 or a successor already reports the MAXDEPTH-constrained exponents for these
    algorithms, that work dominates this record entirely and Stage 1 is designed to find out first
    and say so. Writing `null` here would be a fabrication under AGENTS.md rule 5.
  sota_delta: >-
    No attack; audit and control contribution only. Quantitatively: this repository holds ZERO
    quantum cost analysis for ML-KEM across eighteen committed batches and twenty-one proposals,
    while the category assignment it is auditing has a quantum half. The delta is (i) the first
    quantum resource triple for this lane, (ii) a depth table at the three committed effective
    sieve dimensions against NIST's three MAXDEPTH values - the strawman arithmetic already puts
    coherent depth at 2^{39.95} / 2^{61.23} / 2^{85.62}, i.e. straddling the smallest MAXDEPTH -
    and (iii) a calibration null whose answer key is fixed by a third party, which is a property no
    measurement in this lane currently has and which IDEA-20260807-8fbc86 independently identified
    as the missing anchor.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part. (i) That MAXDEPTH's primary values can be obtained: ~0.5 - RQ-MLKEM-003's own
    provenance block records csrc.nist.gov as unreachable from this harness, and this is the single
    most likely reason the record returns conditional numbers rather than absolute ones. (ii) That
    the published depth-limited AES-128 figures can be read and NULL-K calibrated: ~0.7. (iii) That
    the primary text of at least two quantum sieve costings can be read and their composition
    structure walked: ~0.65. (iv) That delta exceeds 0.10 for at least one algorithm, making
    MAXDEPTH = 2^40 bite: ~0.45 - genuinely uncertain, and the amplitude-amplification structure of
    ePrint 2025/2189 cuts both ways since two-level amplification is deeper per round but the
    algorithm's own 2^{o(d)} qubit count suggests a shallow-and-wide design. (v) That the question
    turns out to be already answered in the literature, demoting the record to a citation: ~0.3,
    and I would be pleased by that outcome rather than embarrassed by it. (vi) That the batch
    produces either a defensible table or a defensible calibration failure: ~0.8. This is the
    record I am least confident about and the reason it is ranked below the other three.
