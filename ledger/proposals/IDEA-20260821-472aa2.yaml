    records, and knowledge/ appeared nowhere in it. The rows now checked, by axis:
    (i) CORPUS ROWS ON THE QUANTUM-COST AXIS: KN-LIT-122 (AGPS20, circuit-level quantum sieving
    cost, citation_verified: read) - DOMINATES any statement this record could make about
    realisable quantum sieving COST, and is the reason best_known was rewritten; KN-LIT-703
    (quantum k-Sieve, QRAM model, 0.2989 time / 0.1395 memory) - dominates any exponent statement
    about QRAM-model tuple sieving; KN-LIT-4639 (Chailloux-Loyer, 0.2570) - dominates the Laarhoven
    time anchor; KN-TECH-040 (cost-model zoo) and KN-TECH-044, KN-OPEN-017 - dominate any claim
    that the memory or gate-count convention is unexamined in this program. NONE of them imposes a
    depth cap, so none dominates the residual MAXDEPTH claim; that "none" is a statement about
    seven files read in full, not about the corpus as a whole.
    (ii) LEDGER ROWS: all 21 RQ-MLKEM-003 proposal titles, the 27 QRAM/Grover-bearing proposals
    across all lanes, the 27 MAXDEPTH-bearing files, and the committed GOAL-MLKEM-003/004 evidence
    records; none performs quantum cost analysis for a lattice sieve.
    (iii) EXTERNALLY: arXiv 2410.13759 dominates any claim about the PHYSICAL feasibility of
    quantum sieving and is cited rather than competed with; if AGPS20's full text or a successor
    already reports MAXDEPTH-constrained exponents for these algorithms, that work dominates this
