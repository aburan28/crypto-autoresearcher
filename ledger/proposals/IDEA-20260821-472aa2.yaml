  minimal_test:
    design: >-
      READING AND ARITHMETIC, NO SIMULATION, NO SIEVE, NO INSTRUMENT REBUILD. Step 0: freeze the
      part-(C2) threshold table (nine cells, exact arithmetic on committed dimensions) and obtain
      MAXDEPTH's values from primary text, or record the failure and mark every conclusion
      conditional (RQ-MLKEM-003's provenance block already records that csrc.nist.gov is
      unreachable from this harness, so this step may legitimately fail). Step 1: obtain
      ePrint 2019/1161 (KN-LIT-122) full text and answer the single question "does it report
      coherent depth, and if so what delta"; record the answer with a page citation before
      anything else is read. Step 2: run NULL-K on AES-128 - read the published depth-limited
      figures, walk them through the pipeline, and compare. THIS IS DONE BEFORE ANY LATTICE
      ALGORITHM IS COSTED and the batch stops here if it fails. Step 3: run NULL-C on a classical
      sieve; the pipeline must report no penalty. Step 4: read the primary text of the remaining
      quantum sieve costings in scope, extract the composition structure and the resource triple
      per subroutine, and check the internal falsifier (the algebra must reproduce the paper's own
      gate count, and where AGPS20 has costed the same circuit, its figure too). Step 5: emit the
      depth table, the depth-excess table and the realisable-exponent table at the three committed
      dimensions and the three MAXDEPTH values, with binding decided per cell against delta > L/d.
      Step 6: run NULL-Q, the three-model QRAM ladder, and REPORT monotonicity across it. Step 7:
      emit the three-branch verdict per algorithm per axis per cell, having already emitted it on
      NULL-C.
      WHY THIS DISCRIMINATES: the two explanations differ by 21.23 to 45.62 bits of depth,
      depending on parameter set, in a quantity that is READ from published text rather than
      fitted, so no statistical power argument is involved and no seed is drawn. The cheapest cell
      - delta for a single algorithm - already separates them.
      STOPPING RULE: if Step 1 returns "AGPS20 answers this", the deliverable is a literature note
      and the batch stops. If NULL-K fails, nothing about ML-KEM is reported and the deliverable is
      the calibration failure, which is itself a usable result about this program's ability to do
      quantum accounting at all.
    controls:
    - 'NULL-K: the identical pipeline on Grover key search for AES-128, against published
      depth-limited figures fixed by a third party, run FIRST'
    - 'NULL-C: the identical pipeline on a classical sieve, which must show zero depth penalty'
    - 'nearby-object control: an algorithm of identical gate count composed of many short
      independent searches, which must NOT be penalised'
    - 'MAXDEPTH = infinity regression reproducing each paper''s quoted exponent digit for digit'
    - 'NULL-Q: the three-model QRAM ladder with monotonicity reported, not assumed'
    - 'internal falsifier: the depth algebra must reproduce each paper''s own gate count from its
