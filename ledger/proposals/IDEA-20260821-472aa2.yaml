  falsification_conditions:
  - 'delta < 0.0484710 for every algorithm read: coherent depth stays below 2^40 even at the
    largest committed sieve dimension 825.235330, so MAXDEPTH does not bind at ANY FIPS 203 sieve
    dimension at ANY of NIST''s three values, Explanation A wins on the depth axis, the quoted
    quantum exponents stand, and the claim is refuted. CORRECTED ON RED-TEAM REVIEW: the filed
    version used 0.05 here, which at ML-KEM-1024 gives depth 2^{41.26} and therefore EXCEEDS 2^40 -
    the rule as frozen would have emitted "refuted, MAXDEPTH does not bind" over delta in
    [0.0484710, 0.05) at the parameter set with the thinnest margin. This is a real and valuable
    negative that would close the depth question for this lane.'
  - 'delta lands in [0.0484710, 0.1038733) for every algorithm read: neither branch fires, the
    honest deliverable is the nine-cell table with no scalar verdict, and the record reports that
    the MAXDEPTH question is parameter-set-dependent rather than settled. Declared in advance so
    that it is a result and not a disappointment.'
  - 'The realisable exponent equals the quoted one at every cell: the depth accounting changes
    nothing and the record''s premise is empty.'
  - 'The QRAM ladder moves the realisable exponent by less than the classical-quantum gap: QRAM
    pricing cannot change a category verdict and Explanation B''s memory leg is refuted
    independently of its depth leg.'
  - 'NULL-K fails to reproduce the published AES-128 depth-limited figures: the pipeline is not
    calibrated, no ML-KEM number is reportable, and the batch reports a calibration failure.'
  - 'NULL-C reports a nonzero depth penalty on a classical algorithm: the pipeline charges
    something it should not and is void.'
  - 'The nearby-object control (many short searches) is penalised identically to a sequential
    algorithm of the same gate count: the pipeline is reading gate count, not depth.'
  - 'Step 1 finds KN-LIT-122''s full text already reports coherent depth against a depth cap for
    these circuits: the record is demoted to a literature note with a citation, which is a good
    outcome and is declared as such in advance. The same applies to any successor of AGPS20.'
  confounders:
  - >-
    LOGICAL VERSUS PHYSICAL. MAXDEPTH is stated in logical gates; feasibility is physical.
    KN-LIT-122's "small and assumption-laden" realisable speedup and arXiv 2410.13759's ~10^13
    physical qubits and ~10^31 years at dimension 400 show the two answers diverge enormously.
    Conflating them would make the record either alarmist or complacent depending on direction, and
    the pipeline never crosses the boundary.
  - >-
    THE BASELINE ALREADY EMBEDS A RE-COSTING OF THE SAME MODEL. ADDED ON REVIEW. KN-LIT-122 records
    that MATZOV obtains part of its claimed security reduction by revising sieving gate-count
    estimates downward, and EV-MLKEM-020's committed figures are RC.MATZOV figures. A depth or QRAM
    correction produced here is therefore NOT independent of the baseline it would be compared
    against, and the report must state which version of the gate-count model each side of any
    comparison uses - KN-TECH-040's rule that "in lattice cryptanalysis the cost model is part of
    the claim".
  - >-
    THREE MEMORY RESOURCES, ONE HABIT OF SUMMING THEM. Classical bits, QCRAM bits and qubits are
    distinct; ePrint 2025/2189 reports 2^{0.1887d} of the first two and 2^{o(d)} of the third,
    KN-LIT-703 reports 2^{0.1395d} in the QRAM model, and an accounting that adds them is a
    category error. Carried as separate columns throughout.
  - >-
    The depth-limited parallelisation penalty has more than one form in the literature and the
    choice changes the answer. The form used must be declared, cited, and applied identically to
    NULL-K, where a third party's answer constrains it.
  - >-
    Published quantum exponents are asymptotic with unbounded o(d), exactly as the classical ones
    are; EV-MLKEM-020 already flags this for the classical memory exponent. Depth exponents inherit
    the same slack and no conclusion may rest on a difference smaller than it. The 21.23-45.62 bit
    branch separation is chosen to be far outside that slack; a per-cell verdict near a threshold
    is not.
  - >-
    Reading risk. A composition structure inferred rather than read is a fabrication route. The
    exclusion list exists to make the reading boundary auditable, and an algorithm read from a
    survey rather than from its own paper is excluded. A corpus entry that relays an abstract -
    which KN-LIT-122, KN-LIT-703 and KN-LIT-4639 all say of themselves - is a pointer strong enough
    to redirect the search and not strong enough to close a cell.
  - >-
    MAXDEPTH itself is a NIST modelling choice, not a physical law, and its three values span 56
    bits. A verdict that flips across that span is reported as a table, never as a conclusion -
    which is now enforced by the nine-cell structure rather than left to discipline.
  interpretation_limits:
  - Nothing here is a measurement. No circuit is simulated, no instance is solved, no quantum
    resource is executed. Every number is read from published text or derived from it by exact
    composition algebra.
  - A finding that MAXDEPTH binds would mean a quantum COST MODEL charges too little under NIST's
    own stated bound. It would NOT mean ML-KEM is more secure than believed in any operational
    sense, because MAXDEPTH is a modelling convention and an attacker is not bound by it.
  - A finding that MAXDEPTH does not bind would NOT mean the quantum attack is feasible; KN-LIT-122
    in this corpus and arXiv 2410.13759 retrieved this session both argue the opposite on
    circuit-level and physical grounds, and this record contradicts neither.
  - Every binding verdict is per (algorithm, MAXDEPTH, dimension) cell. A scalar restatement of
    this record's conclusion is a misquotation of it, and the filed version's own scalar boundary
    is the worked example of why.
  - Every conclusion is scoped to the algorithms whose primary text was read and appears in the
    inclusion list. The exclusion list is part of the result.
  - The three committed sieve dimensions are themselves outputs of a pinned classical estimator run
    and inherit its assumptions, including the d4f convention that the sibling record
    IDEA-20260821-374af4 examines. If that convention moves, these dimensions move, every depth
    figure here moves with them, and so does every threshold L/d in part (C2).
  - AGENTS.md rule 12 is UNMET and inherited; no committed record's status is proposed to change.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (DEPTH ALGEBRA FIDELITY) For each quantum sieve costing in scope, the composition structure
      stated in its primary text is complete enough that applying serial-addition,
      parallel-maximum and classical-repetition-invariance to its declared subroutines yields the
      true longest coherent depth up to a factor 2^{o(d)}. Formally: there exist constants such
      that depth_true(d) = 2^{delta*d + o(d)} with delta the value the algebra returns, uniformly
      for d in [385, 826].
    rigorous_support: >-
      The rigorous ingredient is exact and unconditional: the three composition rules are theorems
      about circuits, not assumptions. What H1 adds is that the PAPERS' descriptions are complete -
      the same kind of assumption every reader of an algorithm makes, and the classical statement it
      imitates is the standard convention that a published complexity analysis accounts for all
      dominant subroutines. H1 is falsifiable by the internal check: the same algebra must
      reproduce the paper's own gate count, and, where KN-LIT-122 has costed the same circuit
      non-asymptotically, its figure as a second target.
    validation_plan: >-
      SAMPLE: the subroutine decomposition of each algorithm in the inclusion list, plus AES-128
      Grover as the calibration object. SCALE: not a sampling exercise - the validation is
      reproduction of two published quantities per algorithm (its gate count and, where stated, its
      depth) from its own structure. THE SHORTCUT THAT EXISTS HERE, NAMED: KN-LIT-122 supplies
      circuit-level, non-asymptotic costings of near-neighbour search under several metrics, which
      is a second independent target for the same algebra at parameters no experiment in this
      program can reach - the closest thing this record has to a substitute-sampling device.
      COMPARISON DISTRIBUTION: none; the comparison is against printed exponents and printed
      circuit costs, digit for digit. TAIL CHECK: the algorithm with the most complex composition
      structure (ePrint 2025/2189's two-level amplitude amplification is the obvious candidate) is
      the one where H1 is most likely to fail, and it is checked first rather than last. TRANSFER
      ASSUMPTION, STATED: H1 is validated only for the algorithms read; it transfers to no other
      algorithm, and an unread algorithm is excluded rather than assumed to obey it.
  - id: H2
    statement: >-
      (DIMENSION TRANSFER) The effective sieve dimensions 385.084530 / 590.132012 / 825.235330,
      committed in EV-MLKEM-020 as outputs of the pinned classical estimator under RC.MATZOV, are
      the dimensions at which a quantum attacker's sieve would run. Formally: the blocksize a
      quantum attacker needs is the same as the one a classical attacker needs, so only the COST
      of the sieve changes and not its DIMENSION.
    rigorous_support: >-
      The rigorous part is that the required blocksize is set by the lattice geometry - the
      root-Hermite factor needed for recovery - which is a property of the instance and not of the
      machine. The distributional statement H2 imitates is the standard estimator convention that
      the reduction quality target is machine-independent. H2 CAN FAIL: an attacker with a cheaper
      SVP oracle may re-optimise to a LARGER blocksize, which would move the dimensions upward,
      LOWER every threshold L/d in part (C2), and make every depth figure here an underestimate.
      That failure direction is stated because it makes the record's conclusion conservative, not
      because it is harmless.
    validation_plan: >-
      SAMPLE: re-run the pinned estimator with the quantum reduction cost model in place of
      RC.MATZOV and record the selected (beta, eta) for each FIPS 203 set. COMPARISON: the selected
      dimensions against the committed classical ones, and the recomputed threshold table L/d
      against the frozen one. This is one estimator invocation and is the cheapest validation in
      this record. TAIL CHECK: if the quantum-optimised dimensions exceed the classical ones by
      more than 5%, every depth number and every threshold in the deliverable is recomputed at the
      new dimensions and both tables are reported. TRANSFER ASSUMPTION: this validates H2
      inside the pinned estimator's own optimisation, not against a real attacker.
  target_complexity:
    time_exponent: >-
      NO NEW ATTACK EXPONENT IS CLAIMED. The record's output is a SIGNED CORRECTION to a published
      quantum exponent under a stated depth budget: realisable t_D minus quoted t, per algorithm
      per MAXDEPTH per dimension. The quoted anchors are 0.265 [RECALLED, Laarhoven 2-sieve,
      corroborated in-corpus at 0.2653 by KN-LIT-703 and KN-LIT-4639], 0.2989 at memory 0.1395
      [corpus KN-LIT-703, QRAM model], 0.2570 [corpus KN-LIT-4639] and 0.2846 [RETRIEVED, ePrint
      2025/2189, 3-sieve at memory 0.1887], against classical 0.292 [RECALLED, and a core-SVP
      convention per KN-TECH-040]. The correction's sign is forced non-negative; its magnitude is
      the deliverable and is currently unknown. The record's own compute cost is a table: seconds.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED, but the memory MODEL is half the object. The quantum
      points carry 2^{0.2075d}, 2^{0.1887d} or 2^{0.1395d} of QUANTUM-ACCESSIBLE memory, which is a
      strictly stronger requirement than the same quantity of classical memory, and no cost model
      in this lane charges the difference. KN-TECH-044 and KN-OPEN-017 make the same point for the
      classical memory axis and record that no source in this corpus computes the crossover under
      full cost. ePrint 2025/2189's 2^{o(d)} qubit count is the good news on this axis and is
      reported as such. The record's own memory is a table of a few dozen rows.
    best_known: >-
      CORRECTED ON RED-TEAM REVIEW. THE INCUMBENT IS KN-LIT-122 (AGPS20), the corpus's own
      circuit-level quantum sieving analysis: it replaces the asymptotic 2^{0.265b} with a
      non-asymptotic circuit-level cost and concludes the realisable speedup in cryptanalytic
      dimensions is small and assumption-laden. Any claim this record makes about the realisable
      quantum cost of sieving is dominated by that work unless it adds the depth coordinate, which
      - so far as the corpus entry records - AGPS20 does not carry. The filed assertion that "there
      is no incumbent anywhere in this repository" is withdrawn. Secondary incumbents: KN-LIT-703
      for QRAM-model exponents; KN-TECH-040 for the convention being audited; arXiv 2410.13759 for
      the physical question. What has NO incumbent, in ledger or corpus or - so far as this record
      knows, unverified - in the literature, is the application of a MAXDEPTH bound to a lattice
      sieve at a stated sieve dimension, and that is the whole of the residual claim.
    hidden_overhead: >-
      (i) The o(d) in every quantum exponent is unbounded exactly as in the classical case, and
      EV-MLKEM-020's own record flags this for the classical memory exponent; a depth exponent
      inherits the same slack. (ii) MAXDEPTH is stated in logical gates and hides the entire
      fault-tolerance overhead, which arXiv 2410.13759 estimates at ~10^13 physical qubits at
      dimension 400 and which KN-LIT-122 already found decisive at circuit level - so a MAXDEPTH
      pass hides a physical infeasibility of enormous size, and a MAXDEPTH failure is therefore the
      weaker of the two objections. (iii) The QRAM/QCRAM assumption hides an unbuilt device; the
      record prices it three ways rather than pretending to resolve it. (iv) The committed sieve
      dimensions are outputs of a classical estimator whose own d4f convention the sibling record
      IDEA-20260821-374af4 examines, and whose cost model already embeds MATZOV's downward revision
      of the very gate counts being audited.
    tradeoff_note: >-
      The depth-limited parallelisation penalty IS a time-memory-parallelism tradeoff and is the
      content of Stage 3: under a depth cap D, an amplitude amplification of length L must be run as
      roughly (L/D)^2 independent instances of depth D, so the gate count rises while the wall-clock
      time falls - the classic Grover parallelisation position. This is exactly the van
      Oorschot-Wiener-shaped interpolation the target profile asks every asymptotic claim to state,
      transposed to the quantum setting. PARALLELISATION POSITION, stated: quantum sieving under a
      depth cap parallelises BADLY in the sense that costs matter (gate count grows) and WELL in the
      sense that wall-clock does not, which is why the choice of metric - gate count versus
      gate-count-depth product - changes the verdict and must be declared before the table is built,
      not after. KN-LIT-122's several cost metrics are the corpus's evidence that this choice is
      load-bearing in practice and not only in principle.
  dominated_by: >-
    n/a (no result claimed on any attack axis), stated after checking rather than asserted. This
    record implements nothing, solves nothing and queries nothing, so there is no cost triple to
    place on any frontier. CORRECTED ON RED-TEAM REVIEW: the enumeration recorded at filing listed
