    and NULL-K calibrated: ~0.7. (iii) That KN-LIT-122's full text can be read and answers the
    "does it report coherent depth" question one way or the other: ~0.85. (iv) That the primary
    text of at least two further quantum sieve costings can be read and their composition structure
    walked: ~0.65. (v) That delta exceeds 0.1038733 for at least one algorithm, making MAXDEPTH =
    2^40 bite at all three sets: ~0.4 - genuinely uncertain, and the amplitude-amplification
    structure of ePrint 2025/2189 cuts both ways since two-level amplification is deeper per round
