  assumptions:
  - KN-LIT-122's full text can be obtained in Stage 1. If it cannot, the record says so and every
    downstream statement about what AGPS20 does or does not report stays at the corpus entry's own
    stated confidence, which is abstract-only.
  - Primary text for at least two quantum sieve costings can be obtained in Stage 1b; if it cannot,
    the record produces the calibration null and the depth algebra and reports the reading failure,
    not a verdict.
  - MAXDEPTH's values can be obtained from primary text or the record states they could not be and
    marks every numeric conclusion conditional. RQ-MLKEM-003's own provenance block already records
    that csrc.nist.gov is unreachable from this harness.
  - Logical-gate depth is the right currency for a MAXDEPTH comparison. It is what NIST states,
    and it is NOT what determines buildability; the record does not conflate them.
  - The depth algebra (add / max / no-change) is applied to the algorithm as PUBLISHED, not to a
    reconstruction. A paper whose composition structure is not explicit enough to walk is excluded.
  - Every branch threshold is L/d for the specific (MAXDEPTH, dimension) cell. No scalar boundary
    is used anywhere, because the filed version of this record used one and it was wrong at
    ML-KEM-1024.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion: the conversion of a quantum GATE COUNT into a
      security-category comparison without checking the DEPTH the gate count presupposes. That
      conversion is performed implicitly by every quantum core-SVP number, is checked nowhere in
      this program's ledger, and is not checked by KN-LIT-122 either so far as its corpus entry
      records - AGPS20 refines the gate count rather than bounding the depth.
    baseline_embedding:
      parameter_slice: >-
        MAXDEPTH = infinity reproduces the quoted quantum exponent exactly, and the depth-limited
        gate count must equal the unlimited one in that limit. That is the exact old-method
        boundary and it is a runnable configuration of the pipeline, not a limit argument.
      reproduction_check: >-
        Symbolic and frozen: at MAXDEPTH = infinity the pipeline must return the paper's own
        quoted exponent for every algorithm in scope, digit for digit as quoted. A pipeline that
        cannot reproduce the unconstrained number has no standing to report a constrained one.
        Where KN-LIT-122 has costed the same circuit non-asymptotically, its figure is the second
        reproduction target.
    observation_collision:
      observable: 'delta, the coherent-depth exponent, one rational per algorithm.'
      distinct_preimage_search: >-
        COLLISION FOUND AND STATED: two algorithms with the same delta can have wildly different
        gate counts, T-counts and physical footprints, so delta alone does not rank algorithms.
        A collision on the two SIDES of the conclusion: an algorithm with tiny delta and enormous
        QRAM width passes the MAXDEPTH test and is unbuildable; an algorithm with large delta and
        no QRAM fails the MAXDEPTH test and could be run in segments with a modest classical
        overhead. THE PIPELINE THEREFORE REPORTS A TRIPLE, NOT A SCALAR, and every verdict is
        per-axis and per-cell. Reporting a single "quantum margin is / is not real" verdict would
        be exactly the mode-4 failure KN-TECH-1a5b7e records, and collapsing the nine-cell table of
        part (C2) to one threshold is how the filed version of this record got a branch boundary
        wrong.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Carry the resource TRIPLE (depth, QRAM width, query count) through the composition instead
        of the single gate count the published exponent - and, so far as its corpus entry records,
        KN-LIT-122's refinement of it - preserves. The stronger state is what survives the MAXDEPTH
        operation; the gate count does not.
      predicted_gain: >-
        Makes the MAXDEPTH question decidable at all. The measurable output is a per-cell signed
        depth excess in bits and a realisable exponent per MAXDEPTH value; predicted magnitude is
        21.23 and 45.62 bits of depth excess at ML-KEM-768 and -1024 under MAXDEPTH 2^40 IF the
        strawman depth model of part (C) turns out to describe a real algorithm, which is the very
        thing Stage 1b tests.
    - transform: representation_reduction
      proposed_object: >-
        Restate the quantum security claim in the model where the hypothesis is an exact inequality
        (coherent depth <= MAXDEPTH, i.e. delta <= L/d cell by cell) rather than a weighting, with
        separate encoding, soundness and cost-loss obligations for the depth-limited
        parallelisation penalty.
      predicted_gain: A conditional statement with an explicit, checkable side condition.
    quantifier_order: >-
      FOR EACH algorithm in scope and FOR EACH MAXDEPTH value D = 2^L in {2^40, 2^64, 2^96} and FOR
      EACH of the three committed sieve dimensions d, THERE EXISTS a realisable gate-count exponent
      t_D >= t_quoted computed by the depth-limited accounting, with the constraint active exactly
      when delta > L/d. THE DISCRIMINATING CLAIM reverses the innermost quantifier and is the one
      that can fail: THERE EXISTS an algorithm in scope and a cell (L, d) in that nine-element grid
      such that t_D > t_quoted STRICTLY. NOTE what is NOT claimed: nothing uniform over all quantum
      algorithms, nothing about algorithms not yet published, nothing about algorithms whose
      primary text Stage 1b could not read, and nothing uniform over the grid - a claim quantified
      over all nine cells at once is exactly the scalar-boundary error this revision removes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the quantum sieve costings whose primary text was read, at the three committed
        effective sieve dimensions and under NIST's stated MAXDEPTH values, the coherent depth is
        [table] and the realisable gate-count exponent is [table], against the quoted exponent
        [table], with binding decided cell by cell against delta > L/d." NOTHING about
        buildability, nothing about physical qubits, nothing about whether ML-KEM is secure, and
        nothing about algorithms outside the read set.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a quantum algorithm with the SAME
        gate count and NEGLIGIBLE coherent depth - many independent short Grover searches whose
        results are combined classically. The method must give it a MAXDEPTH-free pass while
        penalising a genuinely sequential algorithm of identical gate count. If the pipeline
        treats the two identically it is reading gate count, not depth, and has not identified the
        load-bearing structure. This control is explicitly constructible and is in the required
        list.
    proof_obligations:
    - claim: At MAXDEPTH = infinity the pipeline reproduces each paper's quoted exponent exactly.
      responsibility: baseline
    - claim: NULL-K reproduces the published depth-limited AES-128 figures within the source's slack.
      responsibility: correctness
    - claim: NULL-C returns no depth penalty on a classical algorithm.
      responsibility: soundness
    - claim: The nearby-object control (many short searches) is not penalised.
      responsibility: strictness
    - claim: Every binding verdict is computed against the exact cell threshold L/d and never
        against a rounded scalar; the part-(C2) table is frozen in Stage 0.
      responsibility: correctness
    - claim: Every exponent read is attributed to a page of primary text or the algorithm is excluded.
      responsibility: interface
    - claim: No claim is made about physical resources or buildability.
      responsibility: scope
    not_applicable_reason: null
