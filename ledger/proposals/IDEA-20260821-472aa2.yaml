  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: dual-attack score geometry (six GOAL-MLKEM-004
      batches, eight in-lane proposals), estimator-arithmetic differencing (twelve GOAL-MLKEM-003
      batches), the module-structure discount (four in-lane proposals), classical single-call
      resource fitting (IDEA-20260807-8fbc86), and the classical memory-price family
      (IDEA-20260816-70e41d, -7bc28c, EV-MLKEM-020's T*M^c). All five are classical; the lens here
      is the quantum resource triple, which no in-lane record has ever used.
    tracked_object: >-
      The depth budget consumed per amplitude-amplification round: one non-negative rational per
      subroutine of a published quantum sieve, aggregated by the circuit-composition algebra into
      a single exponent delta with longest-coherent-depth = 2^{delta*d}, carried alongside the QRAM
      width exponent and the query-count exponent as a resource TRIPLE rather than a scalar.
    lossiness: >-
      LOSSY, and the discard is exactly what makes the object usable. The underlying state is a
      quantum circuit family: every gate, its type, its position, the qubit it acts on, the
      error-correction overhead, the compilation to a fault-tolerant gate set. The projection
      retains three exponents. It discards gate type entirely - a Toffoli and a CNOT are the same
      here - discards width except as a separate coordinate, discards all wiring, and discards
      every constant.
      NOT A CHANGE OF COORDINATES, and this is provable rather than assertable: circuits with
      identical (depth, width, query-count) exponents can differ in T-count by unbounded factors,
      so the map is many-to-one and non-invertible.
      THE COMPATIBILITY CONDITION, which is the reason this projection is legitimate and the reason
      the record exists: the operation the TARGET performs - MAXDEPTH truncation - is a function of
      depth ALONE. NIST's bound reads exactly the coordinate retained and nothing else. So the
      discarded structure is discarded compatibly with the operation being modelled, and the
      retained part propagates deterministically under circuit composition (add for serial, max for
      parallel, no change for classical repetition). A projection that kept gate types would be
      more faithful and no more predictive of MAXDEPTH behaviour; a projection that kept only gate
      COUNT - which is what the published exponent is - is precisely the one that CANNOT predict
      MAXDEPTH behaviour, which is the defect this record names.
    propagation: >-
      One step is one composition. depth(A then B) = depth(A) + depth(B); depth(A parallel B) =
      max; depth(classical repetition of A, k times) = depth(A). Exact and deterministic. THE CHEAP
      INTERNAL FALSIFIER: applying the algebra to the published algorithm must reproduce the
      published GATE COUNT as depth times width summed over subroutines, up to the paper's own
      stated slack. If it does not, the structural reading is wrong and no delta is reportable -
      this check costs no compute and is run before any conclusion.
    survival_score: >-
      Survives the full composition of one algorithm - that is what the algebra is for - and
      dissolves at the boundary between logical and physical resources, because MAXDEPTH is stated
      in LOGICAL gates while the thing that is actually infeasible is physical. Reported as: the
      object answers "does the logical depth exceed MAXDEPTH" exactly, and answers "is this
      buildable" not at all. arXiv 2410.13759's ~10^13 physical qubits and ~10^31 years at
      dimension 400 is the retrieved evidence that the second question has a very different answer
      from the first, and this record does not attempt it.
  null_object_control: >-
    Structured on KN-TECH-1a5b7e's checklist.
    NULL-K, THE THIRD-PARTY ANSWER KEY, AND IT IS THE LOAD-BEARING CONTROL. Run the IDENTICAL
    depth-accounting pipeline on Grover key search for AES-128, an object where the depth-limited
    answer is published, is not this program's, and anchors NIST's own category-1 definition. The
    pipeline must reproduce the published depth-limited gate count within the source's own stated
    slack. OBJECT REMOVED: the lattice. OBJECT PRESERVED: the amplitude-amplification structure and
    the MAXDEPTH accounting. CAN IT FAIL: YES, and this is the whole point - if the pipeline
    cannot reproduce a published figure whose value it did not choose, then every ML-KEM number it
    produces is uninterpretable and the batch reports exactly that. This is the one control in this
    batch of four proposals whose answer key is set outside the program entirely.
    NULL-Q, THE QRAM ABLATION AS A GRADED CONTROL. Three declared QRAM query-cost models (unit,
    sqrt-of-width, width). SENSITIVITY CRITERION per KN-TECH-1a5b7e obligation 3: the comparator is
    named in advance as the unit-cost model - the arm the null is about - the threshold is that the
    realisable exponent must move by at least the quoted quantum-classical gap between the extreme
    models, and BOTH ENDS are exhibited. MONOTONICITY IS REPORTED, NOT ASSUMED: the three models
    are a graded ladder and the record states explicitly whether the realisable exponent is
    monotone across them, because the refinement in KN-TECH-1a5b7e is that two endpoints do not
    establish a direction.
    NULL-C, THE CLASSICAL CONTROL. Run the identical pipeline on a CLASSICAL sieve, where depth is
    not a constraint at all and MAXDEPTH must therefore have zero effect. If the pipeline reports
    any depth-limited penalty on a classical algorithm, it is charging something it should not and
    the instrument is void. CAN IT FAIL: yes, and it catches the most likely implementation error -
    applying the parallelisation penalty to sequential classical work.
    FORCED VALUE DERIVATION, DONE BEFORE ANY READING (obligation 4): three things are forced and
    carry no information, and reporting them as findings is inadmissible. (1) A depth-limited gate
    count is never LOWER than the unlimited one - the penalty is one-sided by construction.
    (2) At MAXDEPTH = 2^96 a coherent depth of 2^{39.95} cannot bind, so ML-KEM-512 at the largest
    MAXDEPTH is a forced pass. (3) Any algorithm whose coherent depth exponent is 0 (fully
    classical repetition of constant-depth blocks) is unaffected at every MAXDEPTH. The informative
    content is confined to the cells not covered by those three, and the report must state that
    restriction explicitly.
    VERDICT ON THE NULL ARM FIRST: the three-branch rule of Stage 5 (delta < 0.05 / delta > 0.10 /
    UNDECIDED in between) is emitted on NULL-C, the classical arm, before any quantum arm is read.
    NULL-C must return "MAXDEPTH does not bind" by construction; if the rule returns anything else
    there, it discriminates nothing.
  discriminated_from:
  - >-
    EV-MLKEM-020 and the twelve GOAL-MLKEM-003 batches behind it are entirely classical - the
    sensitivity family sweeps a classical sieve-memory exponent, classical memory units, classical
    charge models and a classical enumeration falsifier. Nothing in that record charges depth,
    mentions a quantum resource, or bears on a quantum cutoff. This record cannot correct it and
    does not attempt to; it addresses the half of the category assignment that record never
    entered.
  - >-
    IDEA-20260821-46c09f (this session's sibling) takes the published quantum exponents AT FACE
    VALUE and asks about the geometry of the resulting frontier. THIS record asks whether those
    exponents are admissible under a depth budget at all. The two are deliberately complementary
    and each states its dependence on the other: if this record finds the quantum points
    depth-inadmissible, 46c09f's part (D) is voided; if it finds them admissible, 46c09f's
    gap-widening conclusion stands on a firmer footing. Neither can substitute for the other and
    neither duplicates the other's method.
  - >-
    IDEA-20260816-70e41d prices memory to locate a classical enumeration/sieving crossover, and
    IDEA-20260816-7bc28c prices sieve memory by access locality. Both charge memory SIZE or memory
    ACCESS on a classical machine. This record charges DEPTH on a quantum one - a different
    resource, a different bound, a different cutoff, and a different cost model. A QRAM query and a
    cache miss are not the same object and the two records do not overlap.
  - >-
    The MAXDEPTH-bearing records elsewhere in the ledger (IDEA-20260731-002 through -006 and -019,
    IDEA-20260805-88ecef, -5194f9, IDEA-20260809-72eda3, H-SLHDSA-3a403a, H-MLDSA-12f563) apply
    the bound to symmetric primitives and signature schemes, where the object is a hash or block
    cipher and the quantum algorithm is a single Grover search. A lattice sieve is a different
    composition structure - nested amplitude amplification over a QRAM-resident database - and the
    depth algebra gives a different answer. None of those records is under RQ-MLKEM-003 and none
    concerns a sieve.
  - >-
    IDEA-20260821-374af4 and IDEA-20260821-41cd67 (this session's siblings) measure classical
    quantities on a real sieve. No overlap in object, resource, cost model, or method.
