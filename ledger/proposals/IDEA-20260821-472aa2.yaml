    Writing `null` here would be a fabrication under AGENTS.md rule 5.
  sota_delta: >-
    No attack; audit and control contribution only. CORRECTED ON RED-TEAM REVIEW - the filed claim
    that "this repository holds ZERO quantum cost analysis" was false of the corpus. Quantitatively
    and as now checked: the LEDGER holds zero quantum cost analysis for ML-KEM across eighteen
    committed batches and twenty-one proposals; the CORPUS holds one circuit-level quantum sieving
