      a written instruction to use it, and the LEDGER has never used either.
      WHAT REMAINS A TRUE NEGATIVE, AND IT IS NARROWER. No record in ledger/ - proposal,
      hypothesis, evidence or experiment - performs any quantum cost analysis for ML-KEM;
      EV-MLKEM-020's sensitivity family is entirely classical; the MAXDEPTH hits in
      ledger/proposals belong to other schemes' lanes (ML-DSA, SLH-DSA, FAEST), where MAXDEPTH is a
      symmetric-primitive concern, and none applies the bound to a lattice sieve. Nothing in
      knowledge/ applies a MAXDEPTH bound to a lattice sieve either: KN-LIT-122 costs circuits and
      gates, not a depth cap, and the string MAXDEPTH does not occur in any of the seven corpus
      files read. The corpus contains no entry for arXiv 2410.13759 and none for ePrint 2025/2189;
      both are brought in by this session, the latter also by the sibling IDEA-20260821-46c09f.
      ONE CONSEQUENCE FOR THE BASELINE THIS RECORD INHERITS, RECORDED BECAUSE IT IS LOAD-BEARING:
      KN-LIT-122 states that MATZOV (KN-LIT-110) obtains part of its claimed security reduction
      precisely by revising these sieving gate-count estimates DOWNWARD, so "anyone comparing
      MATZOV's numbers with earlier ones is comparing two versions of this cost model, not two
      attacks". EV-MLKEM-020's committed figures are RC.MATZOV figures. Any depth or QRAM
      correction this record produces lands on top of a baseline that already embeds one revision
      of the same gate-count model, and the report must say so rather than present the two as
      independent.
    verdict: >-
