    (KN-TECH-040, KN-TECH-044, KN-OPEN-017); and NEITHER holds any application of a depth cap to a
    lattice sieve, in that the string MAXDEPTH does not occur in any of the seven corpus files read
    and no ledger record applies it to a sieve. The delta is therefore (i) the first depth
    coordinate for this lane, on top of a gate-and-width analysis the corpus already had, (ii) a
    frozen nine-cell threshold table delta = L/d at the three committed effective sieve dimensions
    against NIST's three MAXDEPTH values, with the strawman arithmetic putting coherent depth at
    2^{39.95} / 2^{61.23} / 2^{85.62}, i.e. straddling the smallest MAXDEPTH, and (iii) a
    calibration null whose answer key is fixed by a third party, which is a property no measurement
    in this lane currently has and which IDEA-20260807-8fbc86 independently identified as the
    missing anchor. WITHDRAWN FROM THE DELTA: "the first quantum resource triple for this lane"
    stated as if the lane had no quantum source at all.
