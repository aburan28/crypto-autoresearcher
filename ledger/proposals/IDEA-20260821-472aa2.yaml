idea:
  id: IDEA-20260821-472aa2
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    ML-KEM's quantum category assignment is a single exponent that hides three unnamed inputs -
    coherent circuit depth, QRAM width, and QRAM query count - and NIST's own MAXDEPTH bound is
    the one place the standard says those inputs must be charged: track the DEPTH BUDGET CONSUMED
    PER AMPLITUDE-AMPLIFICATION ROUND as the object, propagate it through the algorithm's own
    composition structure, and decide between "the quantum margin is realisable capability" and
    "the quantum margin is an artifact of unbounded depth and free QRAM" - calibrated against the
    published depth-limited AES-128 figures NIST's categories are anchored on, where the answer is
    fixed by a third party
  class: control
  claim: >-
    (A) THE ASYMMETRY, STATED PRECISELY. The three FIPS 203 parameter sets are placed in NIST
    security categories by comparison against a CLASSICAL gate-count cutoff and a QUANTUM one. This
    program's committed evidence covers only the classical side: EV-MLKEM-020 records
    primal_bdd/RC.MATZOV at 140.1994731076207 / 200.9587149140538 / 270.7236234535225 bits against
    "NIST classical cutoffs 143 / 207 / 272", i.e. undercuts of +2.800527 / +6.041285 /
    +1.276377 bits, and every subsequent mutation in that record - the sieve-memory exponent swept
    over [0.05, 0.40], three memory units, two charge models, the BKZ-versus-SVP sieve dimension,
    an enumeration falsifier - is CLASSICAL. Eighteen committed batches across GOAL-MLKEM-003 and
    GOAL-MLKEM-004 contain, by the grep recorded below, ZERO quantum cost analysis. The quantum
    side of the category assignment has never been touched by this program at all.
    (B) THE THREE INPUTS THE EXPONENT HIDES. A quantum sieve exponent such as the commonly quoted
    2^{0.265d} [RECALLED] is a GATE COUNT under a model that leaves three quantities unstated:
    (1) the DEPTH of the longest coherent computation; (2) the WIDTH of the quantum-accessible
    memory that must answer superposed queries; (3) the NUMBER of such queries. NIST's own
    submission call bounds the first with MAXDEPTH, proposed at 2^40, 2^64 or 2^96 logical gates
    [RECALLED, corroborated by a search summary but not fetched from primary text]. A gate count
    that requires more depth than MAXDEPTH is not achievable at that gate count: the standard
    depth-limited accounting forces the computation to be parallelised, and for amplitude
    amplification that parallelisation costs back a large part of the quadratic advantage.
    (C) THE SIZE OF THE QUESTION, AS ARITHMETIC ON COMMITTED NUMBERS. A single Grover-style search
    over a sieve database of size 2^{0.2075 d} has sequential depth 2^{0.10375 d}. At the three
    committed effective SVP sieve dimensions from EV-MLKEM-020 - 385.084530 / 590.132012 /
    825.235330 - that is depth 2^{39.95} / 2^{61.23} / 2^{85.62}. Against MAXDEPTH = 2^40 the
    ML-KEM-512 figure lands exactly on the boundary while ML-KEM-768 exceeds it by 21.2 bits of
    depth and ML-KEM-1024 by 45.6; against 2^64 only ML-KEM-1024 exceeds, by 21.6; against 2^96
    none does. THIS ARITHMETIC IS A DERIVATION, NOT A MEASUREMENT, AND IT IS DELIBERATELY A
    STRAWMAN: no published quantum sieve is a single Grover search over the whole pool, and whether
    the real algorithms contain a coherent search of that length is EXACTLY what Stage 1 must read
    out of the primary papers rather than assume. The arithmetic is stated only to establish that
    the depth question sits at the same order of magnitude as NIST's own bound, which is why it is
    worth an audit rather than a shrug.
    (D) THE CLAIM PROPER, FALSIFIABLE, TWO-SIDED, AND STATED AS A DISCRIMINATION. Two explanations
    of ML-KEM's quantum margin are both currently defensible in this program because neither has
    been examined. EXPLANATION A, REALISABLE CAPABILITY: the published quantum sieves decompose
    into many short coherent segments, the longest coherent depth is polynomial or mildly
    exponential in a small exponent, MAXDEPTH does not bind at ML-KEM's sieve dimensions even at
    2^40, and the quantum exponent stands as quoted. EXPLANATION B, IDEALISATION ARTIFACT: the
    amplitude amplification is inherently sequential at depth exponential in d with an exponent
    above 0.05, MAXDEPTH binds at one or more FIPS 203 sets under at least one of NIST's three
    proposed values, and the realisable quantum exponent under that constraint is strictly larger
    than the quoted one - shrinking or eliminating the quantum-classical gap that the category
    assignment rests on. THE CLAIM IS THAT THESE ARE SEPARATED BY ONE READABLE NUMBER PER
    ALGORITHM - the depth exponent delta such that coherent depth is 2^{delta*d} - and that at
    least one published quantum sieve has delta such that 2^{delta*d} exceeds 2^40 at
    d = 385.084530.
    (E) THE DIRECTION IS NOT PREDETERMINED, AND THE OPPOSITE DIRECTION IS ALSO LIVE. ePrint
    2025/2189 (RETRIEVED this session) reports a quantum 3-tuple sieve at 2^{0.2846d} using
    2^{0.1887d} classical and QCRAM bits and only 2^{o(d)} qubits - a qubit count that is
    sub-exponential, which is evidence FOR Explanation A on the width axis even while the QCRAM
    requirement is evidence for Explanation B on the memory axis. The two axes can and probably do
    disagree, and the deliverable is a per-axis verdict, not a single one.
    (F) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved, nothing measured. This record
    runs no quantum circuit and simulates none. Every conclusion is a statement about what a
    published cost model does and does not charge, scoped to the algorithms whose primary text
    Stage 1 actually reads. Nothing here proposes a status change to any committed record;
    AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004.
  mechanism: >-
    STAGE 0 - THE CALIBRATION TARGET, CHOSEN BEFORE THE OBJECT. Identify the published
    depth-limited Grover key-search figures for AES-128 that NIST's category-1 definition is
    anchored on, and record their exact values, their source, and their stated depth model. THEY
    ARE NOT QUOTED IN THIS RECORD BECAUSE I HAVE NOT READ THEM; quoting them from memory is exactly
    the failure this program's rule 5 forbids. This is the null arm's answer key and it is fixed
    by a third party.
    STAGE 1 - READ THE THREE HIDDEN INPUTS OUT OF THE PRIMARY TEXT. For each quantum sieve costing
    in scope, extract and tabulate: (i) the composition structure - which parts are coherent and
    which are classical repetition; (ii) the coherent depth of the longest quantum subroutine, as
    an exponent delta with 2^{delta*d}; (iii) the QRAM width in addressable cells and the query
    count; (iv) the qubit count; (v) the memory model the paper itself declares (classical bits,
    QCRAM bits, qubits are three different resources and must not be summed). Any algorithm whose
    primary text cannot be read is EXCLUDED and recorded as excluded, never estimated.
    STAGE 2 - THE TRACKED OBJECT AND ITS PROPAGATION. The object is the DEPTH BUDGET CONSUMED PER
    AMPLITUDE-AMPLIFICATION ROUND: one non-negative number per subroutine. Its propagation law is
    the composition algebra of circuits and is exact, not statistical: serial composition ADDS
    depth, parallel composition takes the MAXIMUM, and classical repetition of a coherent block
    does NOT add to it. Walking the algorithm's own structure with those three rules yields the
    longest coherent depth as a closed form in d. This is a derivation on paper, not a simulation.
    STAGE 3 - THE DEPTH-LIMITED RECOSTING. For each algorithm and each MAXDEPTH in {2^40, 2^64,
    2^96}, and at each of the three committed effective sieve dimensions 385.084530 / 590.132012 /
    825.235330, report: does the coherent depth exceed MAXDEPTH; if so, by how many bits; and what
    is the gate count after the standard depth-limited parallelisation penalty is applied. Emit the
    resulting realisable quantum exponent alongside the quoted one and the classical 0.292
    [RECALLED], as a single table with a sign per cell.
    STAGE 4 - THE QRAM ABLATION, WHICH IS THE SECOND AXIS AND IS RUN SEPARATELY. Recompute every
    cell under three declared QRAM query-cost models - unit cost (the convention the published
    exponents use), cost proportional to the square root of the width, and cost proportional to the
    width - and report the realisable exponent under each. If the exponent is unchanged across all
    three, QRAM is not load-bearing and Explanation B's memory leg is refuted independently of its
    depth leg. If it moves by more than the quoted quantum-classical exponent gap, the quantum
    margin is an artifact of the unit-cost convention.
    STAGE 5 - WHY THIS DISCRIMINATES RATHER THAN DESCRIBES. Explanations A and B make OPPOSITE
    predictions about a number that is read, not fitted: the depth exponent delta. Under A, delta
    is below 0.05 for every algorithm in scope, so 2^{delta*d} < 2^{41} at every FIPS 203 sieve
    dimension and nothing binds even at the smallest MAXDEPTH. Under B, delta is above 0.10 for at
    least one algorithm, so the bound bites at 2^40 for all three sets and at 2^64 for at least
    one. The gap between the two predictions is roughly 40 bits of depth and cannot be closed by
    interpretation. A THIRD OUTCOME is declared in advance: delta in [0.05, 0.10], where the answer
    depends on which MAXDEPTH is chosen, and the honest report is a table with no verdict - that
    branch exists because GOAL-MLKEM-004 batch 4 froze a two-outcome rule and got neither, and
    KN-TECH-1a5b7e mode 4 records that the defect was upstream in the design.
