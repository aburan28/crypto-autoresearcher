  - >-
    IDEA-20260816-70e41d prices memory to locate a classical enumeration/sieving crossover, and
    IDEA-20260816-7bc28c prices sieve memory by access locality. Both charge memory SIZE or memory
    ACCESS on a classical machine. This record charges DEPTH on a quantum one - a different
    resource, a different bound, a different cutoff, and a different cost model. A QRAM query and a
    cache miss are not the same object and the two records do not overlap.
  - >-
    KN-OPEN-017 and KN-TECH-044 ask where the enumeration/sieving crossover moves once sieving
    MEMORY is fully charged in Wiener's sense, and both cite KN-LIT-122 in passing. ADDED ON
    REVIEW. That is a memory-and-wiring question about classical and quantum sieves alike; this is
    a DEPTH question about quantum sieves only, under a bound (MAXDEPTH) that has no classical
    analogue. This record neither closes KN-OPEN-017 nor is closed by it, and the QRAM ablation of
