idea:
  id: IDEA-20260821-472aa2
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    ML-KEM's quantum category assignment is a single exponent that hides three unnamed inputs -
    coherent circuit depth, QRAM width, and QRAM query count - and NIST's own MAXDEPTH bound is
    the one place the standard says those inputs must be charged: track the DEPTH BUDGET CONSUMED
    PER AMPLITUDE-AMPLIFICATION ROUND as the object, propagate it through the algorithm's own
    composition structure, start from the circuit-level analysis this corpus already holds
    (KN-LIT-122 / AGPS20) rather than from an unread exponent, and decide between "the quantum
    margin is realisable capability" and "the quantum margin is an artifact of unbounded depth and
    free QRAM" - calibrated against the published depth-limited AES-128 figures NIST's categories
    are anchored on, where the answer is fixed by a third party
  class: control
  claim: >-
    (A) THE ASYMMETRY, STATED PRECISELY, AND NARROWED ON RED-TEAM REVIEW. The three FIPS 203
    parameter sets are placed in NIST security categories by comparison against a CLASSICAL
    gate-count cutoff and a QUANTUM one. This program's committed LEDGER evidence covers only the
    classical side: EV-MLKEM-020 records primal_bdd/RC.MATZOV at 140.1994731076207 /
    200.9587149140538 / 270.7236234535225 bits against "NIST classical cutoffs 143 / 207 / 272",
    i.e. undercuts of +2.800527 / +6.041285 / +1.276377 bits, and every subsequent mutation in that
    record - the sieve-memory exponent swept over [0.05, 0.40], three memory units, two charge
    models, the BKZ-versus-SVP sieve dimension, an enumeration falsifier - is CLASSICAL. Eighteen
    committed batches across GOAL-MLKEM-003 and GOAL-MLKEM-004 contain, by the greps recorded
    below, no quantum cost analysis, and no RQ-MLKEM-003 proposal contains one.
    WHAT THE ORIGINAL FILING GOT WRONG AND IS CORRECTED HERE: it asserted that ZERO records in
    this repository analyse the quantum side. That is false of the KNOWLEDGE CORPUS, which the
    filed screen never searched. knowledge/literature/KN-LIT-122.md is Albrecht-Gheorghiu-
    Postlethwaite-Schanck, "Estimating quantum speedups for lattice sieves" (ASIACRYPT 2020 /
    ePrint 2019/1161), citation_verified: read - the AGPS20 this record's own citation said it did
    not know the contents of. It is exactly the circuit-level quantum sieving analysis this record
    proposed to go looking for, and the corpus entry states its conclusion: the realisable
    advantage over classical sieving is "small" and assumption-laden, and "the program should not
    treat a quantum exponent as a cost without a circuit-level source". Also present and unread at
    filing: KN-LIT-703 (quantum k-Sieve with explicit QRAM-model exponents), KN-TECH-040 (the
    core-SVP cost-model zoo, carrying 2^{0.265b}), KN-TECH-044 and KN-OPEN-017, both of which
    already cite the circuit-level quantum sieving result. THE ASYMMETRY THAT SURVIVES IS
    NARROWER AND STILL REAL: the corpus holds a circuit-level source and a standing instruction to
    use it; the LEDGER has never used it, and NOBODY - inside this program or, as far as this
    record knows, outside it - has applied a MAXDEPTH bound to a lattice sieve at ML-KEM's sieve
    dimensions.
    (B) THE THREE INPUTS THE EXPONENT HIDES. A quantum sieve exponent such as the commonly quoted
    2^{0.265d} [RECALLED, and recorded in this corpus at KN-TECH-040 as a core-SVP convention, not
    as a cost] is a GATE COUNT under a model that leaves three quantities unstated: (1) the DEPTH
    of the longest coherent computation; (2) the WIDTH of the quantum-accessible memory that must
    answer superposed queries; (3) the NUMBER of such queries. NIST's own submission call bounds
    the first with MAXDEPTH, proposed at 2^40, 2^64 or 2^96 logical gates [RECALLED, corroborated
    by a search summary but not fetched from primary text]. A gate count that requires more depth
    than MAXDEPTH is not achievable at that gate count: the standard depth-limited accounting
    forces the computation to be parallelised, and for amplitude amplification that parallelisation
    costs back a large part of the quadratic advantage. KN-LIT-122 is the corpus's evidence that
    (2) and (3) are already known to be load-bearing at the circuit level; whether (1) is, at these
    dimensions, is what this record asks.
    (C) THE SIZE OF THE QUESTION, AS ARITHMETIC ON COMMITTED NUMBERS. A single Grover-style search
    over a sieve database of size 2^{0.2075 d} has sequential depth 2^{0.10375 d}. At the three
    committed effective SVP sieve dimensions from EV-MLKEM-020 - 385.084530 / 590.132012 /
    825.235330 - that is depth 2^{39.95} / 2^{61.23} / 2^{85.62}. Against MAXDEPTH = 2^40 the
    ML-KEM-512 figure falls 0.05 bits SHORT of the bound while ML-KEM-768 exceeds it by 21.23 bits
    of depth and ML-KEM-1024 by 45.62; against 2^64 only ML-KEM-1024 exceeds, by 21.62; against
    2^96 none does. THIS ARITHMETIC IS A DERIVATION, NOT A MEASUREMENT, AND IT IS DELIBERATELY A
    STRAWMAN: no published quantum sieve is a single Grover search over the whole pool, and whether
    the real algorithms contain a coherent search of that length is EXACTLY what Stage 1 must read
    out of the primary text rather than assume. The arithmetic is stated only to establish that
    the depth question sits at the same order of magnitude as NIST's own bound, which is why it is
    worth an audit rather than a shrug.
    (C2) THE BINDING THRESHOLD IS PER DIMENSION AND PER MAXDEPTH, NOT A SCALAR. CORRECTED ON
    RED-TEAM REVIEW, because the filed version of this record put its refutation branch on the
    wrong side of the boundary at the parameter set it cares about most. A coherent depth
    2^{delta*d} exceeds a bound 2^L exactly when delta > L/d. The full threshold table, exact
    arithmetic on the committed dimensions:
    L = 40: delta_bind = 0.1038733 (d = 385.084530) / 0.0677815 (590.132012) / 0.0484710
    (825.235330).
    L = 64: 0.1661973 / 0.1084503 / 0.0775537.
    L = 96: 0.2492960 / 0.1626755 / 0.1163305.
    The filed record used delta = 0.05 as its "nothing binds" boundary. At ML-KEM-1024, delta =
    0.05 gives depth 2^{41.26}, which EXCEEDS 2^40; the binding threshold there is 0.0484710. As
    frozen, the old rule would have emitted "refuted, MAXDEPTH does not bind" over the whole
    interval delta in [0.0484710, 0.05) at ML-KEM-1024, where it does bind. That branch boundary is
    replaced by the table above and by the branch definitions in Stage 5.
    (D) THE CLAIM PROPER, FALSIFIABLE, TWO-SIDED, AND STATED AS A DISCRIMINATION. Two explanations
    of ML-KEM's quantum margin are both currently defensible in this program because neither has
    been examined against a depth bound. EXPLANATION A, REALISABLE CAPABILITY: the published
    quantum sieves decompose into many short coherent segments, the longest coherent depth is
    polynomial or mildly exponential with delta below 0.0484710 - the tightest cell of the table -
    so MAXDEPTH does not bind at ANY FIPS 203 sieve dimension even at 2^40, and the quantum
    exponent stands as quoted. EXPLANATION B, IDEALISATION ARTIFACT: the amplitude amplification is
    inherently sequential at depth exponential in d with delta at or above 0.1038733, so MAXDEPTH
    binds at ALL THREE FIPS 203 sets at 2^40 and at ML-KEM-1024 already at 2^64, and the realisable
    quantum exponent under that constraint is strictly larger than the quoted one - shrinking or
    eliminating the quantum-classical gap that the category assignment rests on. THE CLAIM IS THAT
    THESE ARE SEPARATED BY ONE READABLE NUMBER PER ALGORITHM - the depth exponent delta such that
    coherent depth is 2^{delta*d} - and that at least one published quantum sieve has delta >
    0.1038733, i.e. exceeds 2^40 of coherent depth already at d = 385.084530.
    (E) THE DIRECTION IS NOT PREDETERMINED, AND THE OPPOSITE DIRECTION IS ALSO LIVE. ePrint
    2025/2189 (RETRIEVED this session) reports a quantum 3-tuple sieve at 2^{0.2846d} using
    2^{0.1887d} classical and QCRAM bits and only 2^{o(d)} qubits - a qubit count that is
    sub-exponential, which is evidence FOR Explanation A on the width axis even while the QCRAM
    requirement is evidence for Explanation B on the memory axis. KN-LIT-703 records a quantum
    k-Sieve at 2^{0.2989d} using 2^{0.1395d} memory explicitly in the QRAM model, which is a third
    point on the same two axes. The axes can and probably do disagree, and the deliverable is a
    per-axis verdict, not a single one.
    (F) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved, nothing measured. This record
    runs no quantum circuit and simulates none. Every conclusion is a statement about what a
    published cost model does and does not charge, scoped to the algorithms whose primary text
    Stage 1 actually reads. Nothing here proposes a status change to any committed record;
    AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004.
  mechanism: >-
    STAGE 0 - THE CALIBRATION TARGET, CHOSEN BEFORE THE OBJECT. Identify the published
    depth-limited Grover key-search figures for AES-128 that NIST's category-1 definition is
    anchored on, and record their exact values, their source, and their stated depth model. THEY
    ARE NOT QUOTED IN THIS RECORD BECAUSE I HAVE NOT READ THEM; quoting them from memory is exactly
    the failure this program's rule 5 forbids. This is the null arm's answer key and it is fixed
    by a third party. Freeze in the same step the per-dimension, per-MAXDEPTH threshold table of
    part (C2) - it is exact arithmetic on committed numbers and costs nothing - so that no branch
    is decided against a scalar.
    STAGE 1 - START INSIDE THE CORPUS, NOT OUTSIDE IT. RESTATED ON RED-TEAM REVIEW: the filed
    version made Stage 1's first job "find out whether AGPS20 already answers this record's exact
    question". It is in the corpus, at knowledge/literature/KN-LIT-122.md, and the first job is
    therefore to EXTRACT THE DELTA FROM KN-LIT-122'S CIRCUIT-LEVEL ANALYSIS. Concretely: obtain
    ePrint 2019/1161's full text, and for each near-neighbour-search circuit it costs, read out
    (i) whether it reports a DEPTH figure at all or only gate counts and widths, (ii) if it does,
    the depth exponent delta implied at cryptanalytic dimensions, and (iii) which of its cost
    metrics is closest to a MAXDEPTH-style constraint. Record explicitly whether the answer to (i)
    is no - "AGPS20 costs gates and width but not coherent depth" is a complete and reportable
    Stage-1 result that establishes the gap this record exists to fill, and "AGPS20 reports depth
    and the answer is X" demotes this record to a literature note, which is equally good. The
    corpus entry's own "Not verified here" section states only the abstract was read and no
    speedup factor was extracted, so the full text is owed either way.
    STAGE 1b - READ THE THREE HIDDEN INPUTS OUT OF THE REMAINING PRIMARY TEXT. For each further
    quantum sieve costing in scope - KN-LIT-703's k-Sieve, ePrint 2025/2189's 3-tuple sieve,
    KN-LIT-4639's quantum random walk, Laarhoven's 2-sieve - extract and tabulate: (i) the
    composition structure, which parts are coherent and which are classical repetition; (ii) the
    coherent depth of the longest quantum subroutine, as an exponent delta with 2^{delta*d};
    (iii) the QRAM width in addressable cells and the query count; (iv) the qubit count; (v) the
    memory model the paper itself declares (classical bits, QCRAM bits, qubits are three different
    resources and must not be summed). Any algorithm whose primary text cannot be read is EXCLUDED
    and recorded as excluded, never estimated.
    STAGE 2 - THE TRACKED OBJECT AND ITS PROPAGATION. The object is the DEPTH BUDGET CONSUMED PER
    AMPLITUDE-AMPLIFICATION ROUND: one non-negative number per subroutine. Its propagation law is
    the composition algebra of circuits and is exact, not statistical: serial composition ADDS
    depth, parallel composition takes the MAXIMUM, and classical repetition of a coherent block
    does NOT add to it. Walking the algorithm's own structure with those three rules yields the
    longest coherent depth as a closed form in d. This is a derivation on paper, not a simulation.
    STAGE 3 - THE DEPTH-LIMITED RECOSTING. For each algorithm and each MAXDEPTH in {2^40, 2^64,
    2^96}, and at each of the three committed effective sieve dimensions 385.084530 / 590.132012 /
    825.235330, report: does the coherent depth exceed MAXDEPTH, judged against the exact threshold
    delta > L/d from part (C2) and never against a rounded scalar; if so, by how many bits; and
    what is the gate count after the standard depth-limited parallelisation penalty is applied.
    Emit the resulting realisable quantum exponent alongside the quoted one and the classical 0.292
    [RECALLED, and a core-SVP convention per KN-TECH-040], as a single nine-cell table with a sign
    per cell.
    STAGE 4 - THE QRAM ABLATION, WHICH IS THE SECOND AXIS AND IS RUN SEPARATELY. Recompute every
    cell under three declared QRAM query-cost models - unit cost (the convention the published
    exponents use), cost proportional to the square root of the width, and cost proportional to the
    width - and report the realisable exponent under each. If the exponent is unchanged across all
    three, QRAM is not load-bearing and Explanation B's memory leg is refuted independently of its
    depth leg. If it moves by more than the quoted quantum-classical exponent gap, the quantum
    margin is an artifact of the unit-cost convention. KN-LIT-122 is the external anchor for this
    stage: it already prices near-neighbour search at circuit level, so a QRAM ablation that
    contradicts it is an instrument failure and not a finding.
    STAGE 5 - WHY THIS DISCRIMINATES RATHER THAN DESCRIBES, WITH THE BRANCHES CORRECTED. The two
    explanations make OPPOSITE predictions about a number that is read, not fitted: the depth
    exponent delta. THE BRANCH BOUNDARIES ARE THE EXTREMES OF THE PART-(C2) TABLE, AND THE VERDICT
    IS A NINE-CELL TABLE, NEVER A SCALAR.
    BRANCH A: delta < 0.0484710 for every algorithm in scope. This is the tightest cell in the
    whole table (ML-KEM-1024 at MAXDEPTH 2^40), so below it nothing binds at any FIPS 203 sieve
    dimension at any of NIST's three MAXDEPTH values, and the quoted quantum exponents stand.
    BRANCH B: delta >= 0.1038733 for at least one algorithm. This is the loosest cell (ML-KEM-512
    at 2^40), so at or above it the bound bites at ALL THREE sets at 2^40, and at ML-KEM-1024 it
    already bites at 2^64 (threshold 0.0775537) and at 2^96 (0.1163305) is decided cell by cell.
    BRANCH UNDECIDED, declared in advance and expected: delta in [0.0484710, 0.1038733), where
    whether the bound binds depends on WHICH parameter set and WHICH MAXDEPTH, and the honest
    report is the table with no scalar verdict. That branch exists because GOAL-MLKEM-004 batch 4
    froze a two-outcome rule and got neither, and KN-TECH-1a5b7e mode 4 records that the defect was
    upstream in the design. The separation between branch A and branch B is 21.23 bits of depth at
    ML-KEM-512, 32.70 at ML-KEM-768 and 45.62 at ML-KEM-1024, which is far larger than any reading
    ambiguity and cannot be closed by interpretation.
