    results: >-
      CORRECTED ON RED-TEAM REVIEW; the filed version of this field asserted "ZERO records in this
      repository analyse the quantum side of ML-KEM's category assignment" and that assertion is
      FALSE of the knowledge corpus, which the filed screen never searched.
      WHAT THE CORPUS ACTUALLY HOLDS. KN-LIT-122 (Albrecht-Gheorghiu-Postlethwaite-Schanck,
      "Estimating quantum speedups for lattice sieves", ASIACRYPT 2020 / ePrint 2019/1161,
      citation_verified: read) replaces the asymptotic 2^{0.265b} figure with a non-asymptotic,
