    answer lands in the UNDECIDED band [0.0484710, 0.1038733) and the deliverable is the table:
    ~0.35, and that is now a declared branch rather than a failure. (vii) That the question turns
    out to be already answered by AGPS20's full text, demoting the record to a citation: ~0.35,
    revised UP from 0.3 now that AGPS20 is known to be in the corpus and to be circuit-level, and I
    would be pleased by that outcome rather than embarrassed by it. (viii) That the batch produces
    either a defensible table or a defensible calibration failure: ~0.8. This is the record I am
    least confident about and the reason it is ranked below the other three.
