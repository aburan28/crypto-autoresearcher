idea:
  id: IDEA-20260816-bbff88
  question_id: RQ-SDITH-001
  added: '2026-08-16'
  title: 'Measure the signature-size versus soundness tradeoff curve instead of quoting it: emit real
    bytes from a toy MPC-in-the-head shell across a full (N, tau, tree-shape) grid, measure the exact
    soundness at each point by enumeration, and report the residue between measured bytes and the
    analytic size formula.'
  class: measurement
  claim: '(A) THE CURVE IS AN EMITTED ARTIFACT, NOT A FORMULA. For a toy MPC-in-the-head shell, every
    point of the (N, tau, tree-shape) grid yields two numbers that can both be obtained by running
    rather than by algebra: the exact byte length of a serialized signature, and the exact soundness
    error by transcript enumeration. Part (A) claims the resulting Pareto frontier in (bits of measured
    soundness, bytes) is computable in full at the declared grid and that its shape is not monotone
    in N at fixed measured soundness, because opening cost grows with tree depth while soundness improves
    with N. (B) THE RESIDUE IS WHERE THE ACCOUNTING LIVES. Define residue R = measured_bytes minus
    formula_bytes, where formula_bytes is the standard analytic size expression. Part (B) claims R
    is strictly positive at every grid point, that it decomposes exactly into named components (salt,
    counter, length prefixes, alignment padding, per-repetition framing), and that R divided by measured_bytes
    exceeds two percent at small N and decays as N grows. This is a claim about serialization overhead
    being a measurable and decomposable quantity rather than a rounding note. (C) THE ATTRIBUTION
    AXIS IS EXPLICIT. The shell carries a placeholder relation with no algebraic content, so the curve''s
    shape and the residue''s decomposition are PARADIGM-LEVEL properties. Any component of R that
    changes when the relation is swapped for a different placeholder is by construction scheme-level,
    and the grid includes that swap so the attribution is measured rather than asserted. (D) WHAT
    IS NOT CLAIMED. No forgery, no break, no speedup, no security consequence, and no claim about
    the actual signature sizes of SDitH, FAEST or MQOM, which have not been read and are not modelled.
    It is NOT claimed that the toy curve predicts any deployed curve; the deployed regime is far outside
    the enumerable soundness range and the contract forbids extrapolating across it. It is also NOT
    claimed that a positive residue indicates a design flaw: serialization overhead is expected and
    the contribution is its decomposition, not a verdict.'
  mechanism: 'STAGE 1 reuses the enumerable toy shell: prover, verifier, and a serializer that emits
    an actual byte string with declared framing. STAGE 2 at each grid point measures bytes by len()
    on the emitted signature, over many messages and seeds, and records the distribution rather than
    a single value, because opening size is a random variable and a single sample would misreport
    the curve. STAGE 3 measures soundness exactly by enumerating the transcript space at that point,
    so the horizontal axis is measured and not budgeted. STAGE 4 computes formula_bytes from a declared
    analytic expression frozen before the run, and forms R. STAGE 5 decomposes R by instrumenting
    the serializer to attribute every byte to a named component, so the decomposition sums to R exactly
    by construction and any shortfall is an instrumentation bug that halts the lane. STAGE 6 runs
    the null object: a NULL SERIALIZER that emits the same logical content with a deliberately minimal,
    alignment-free, prefix-free framing whose byte count is hand-computable. The residue against the
    null serializer must be zero to the byte; if it is not, the byte accounting is measuring the instrument.
    STAGE 7 swaps the placeholder relation for a second placeholder of different arity and re-runs
    the whole grid, and every component of R that moves is reclassified from paradigm to scheme. The
    Pareto frontier is then computed over the union of all grid points, with dominated points explicitly
    listed rather than dropped, because a dominated point is the evidence that the frontier is where
    it is.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: signature size, soundness error, MPCitH, repetition,
      GGM tree, opening. Read titles and class of IDEA-20260808-721f2b, IDEA-20260805-7abf04, IDEA-20260805-38048d,
      IDEA-20260808-aa551f, IDEA-20260731-002, IDEA-20260813-27df0c. Read RQ-SDITH-001 and RQ-MQOM-001
      in full. Checked ledger/hypotheses for SDITH, FAEST, MQOM prefixed records.'
    results: 'IDEA-20260813-27df0c is a certified fully charged plain-SD and d-split ISD Pareto baseline:
      a Pareto object, but over ISD attack cost axes, not over signature size and soundness, and its
      subject is the hard problem. IDEA-20260805-7abf04 evaluates a design inequality at MQOM''s triples
      and finds exact equality, which is adjacent to a size-soundness tradeoff but is an audit of
      quoted parameters rather than emitted bytes. IDEA-20260805-38048d concerns opening-size filtering.
      No record was found that serializes an actual signature and measures its byte length, and none
      forms a residue against an analytic size formula or decomposes it by component.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; measured size-soundness
      curves may well exist there. Assembled from known parts: Pareto frontier construction, serialization
      instrumentation and enumerable-scale soundness measurement are all standard, and this repository
      already contains a Pareto record (IDEA-20260813-27df0c) on different axes. Claimed new relative
      to THIS repository only: emitting real bytes from an executable shell so the size axis is measured,
      pairing each point with an exactly enumerated soundness value so the other axis is also measured,
      and the null-serializer control that forces the residue decomposition to be exact.'
  object_first_candidate:
    tracked_object: The pair (measured_bytes, exact_soundness) per grid point, together with the component
      decomposition of measured_bytes, followed as the grid moves along N, tau and tree shape.
    lossiness: 'Genuinely lossy. The pair discards the witness, the message, the relation''s algebra,
      the seed values and the entire transcript content, retaining only a length and an acceptance
      probability. It propagates because the design decision the curve informs, choosing (N, tau)
      at a target soundness, reads only those two numbers. The decomposition is a deliberate partial
      un-lossing: it retains which named component contributed each byte, which is strictly more than
      the length alone, and the record is explicit that the decomposition is the finer object and
      the pair is the coarser one. Nothing is claimed to be discarded in the decomposition beyond
      byte identity, which is why the null serializer is required to show the decomposition is exact
      rather than a re-labelling.'
    propagation: One step of the target operation is incrementing tau by one. Under it measured_bytes
      gains one repetition's framing plus one opening whose size is itself a random variable, while
      exact_soundness maps to a value the enumeration recomputes rather than predicts. So one step
      moves the tracked pair by an increment whose first coordinate has a measurable distribution
      and whose second coordinate is measured, and the curve is the trace of those increments.
    survival_score: The pair remains a faithful summary of the design tradeoff for as long as soundness
      is enumerable, which at the declared grid is tau up to 4 and N up to 16. Beyond that the second
      coordinate must be budgeted rather than measured, and the object degrades into the analytic
      curve it was meant to check. The run reports that boundary explicitly as the largest grid point
      at which enumeration completed within the declared cap, and reports every point beyond it as
      size-only with no soundness coordinate rather than pairing measured bytes with a budgeted number.
  null_object_control: 'NULL-SERIALIZER: the identical logical signature content emitted through a
    deliberately minimal framing whose byte count is hand-computable from (N, tau, seed length, field
    size) alone, run in the same invocation. The residue against this null must be exactly zero at
    every grid point. If it is not, the byte instrumentation is measuring itself and no residue decomposition
    from the signal arm is admissible. A second null, NULL-RELATION, swaps the placeholder relation
    for one of different arity; components of R that move under it are, by definition, not paradigm-level,
    and this is how the attribution in claim (C) is measured rather than asserted.'
  discriminated_from:
  - 'IDEA-20260813-27df0c, certified fully charged ISD Pareto baseline: a Pareto frontier over attack
    time and memory for the underlying hard problem. This record forbids itself from touching the
    hard problem and its axes are emitted bytes and enumerated soundness.'
  - 'IDEA-20260805-7abf04, the MQOM zero-slack ledger: audits quoted parameters against a design inequality.
    No bytes are emitted there and no soundness is enumerated; here both axes are measured outputs
    of a running program.'
  - 'IDEA-20260808-721f2b, optimal forger by dynamic programming: produces a soundness-side optimum
    only, with no size axis and no serializer.'
  - A straightforward plot of the analytic size formula against the analytic soundness formula. That
    is the object being checked, and reproducing it would be the null result; the residue R exists
    precisely because the two curves are not the same curve.
  - 'IDEA-20260805-38048d, the opening-size filter: concerns which openings are admissible under a
    size bound. Here no size bound is imposed and the full size distribution is emitted.'
  assumptions:
  - The toy shell is a faithful member of the family at the level of what a signature must contain.
    Fidelity is a reported uncertainty and the contents list is frozen at Stage 0 so a reader can
    judge it.
  - Soundness enumeration is affordable at the declared grid, per the same enumerability argument
    used elsewhere in this bucket; points that exceed the cap are reported size-only.
  - The analytic size formula compared against is DERIVED HERE and frozen before the run, not read
    from any specification. Its provenance is recorded as derived-here in every emitted table.
  - Serialization framing choices (length prefixes, alignment, ordering) are declared design choices
    of this shell, not claims about any scheme's format.
  - Byte counts are exact integers with no compression applied anywhere; a compressed variant would
    be a separate arm and is not run.
  predictions:
  - metric: residue R divided by measured_bytes at the smallest N on the grid
    direction: higher
    minimum_effect: 0.02
  - metric: residue against NULL-SERIALIZER
    direction: lower
    minimum_effect: 0
  - metric: number of Pareto-nondominated grid points in (measured soundness bits, measured bytes)
    direction: higher
    minimum_effect: 3
  - metric: number of R components that move under NULL-RELATION, i.e. are scheme-level rather than
      paradigm-level
    direction: different
    minimum_effect: 'refuse to pre-commit: the count is the attribution result itself, and forcing
      a value would presuppose the answer the control exists to supply'
  minimal_test:
    design: Fix N in {2, 4, 8}, tau in {1, 2, 3}, tree shape in {tau independent trees, one merged
      tree}, one placeholder relation. For each of the 18 points, sign 200 messages with declared
      seeds, record the exact byte length distribution, and enumerate the transcript space to get
      the exact soundness. Compute the frozen analytic size formula, form R, and decompose R by instrumented
      attribution so the components sum to R exactly. Emit the same 200 signatures through NULL-SERIALIZER
      and require the residue against its hand-computable count to be zero to the byte. Re-run all
      18 points with a second placeholder relation of different arity and mark every component of
      R that moves. Plot the 18 points in (measured soundness bits, median bytes), list the dominated
      points explicitly, and report the frontier. This is minutes of compute, needs no cryptography
      beyond a hash for commitments, and delivers both a measured curve and an attribution.
    controls:
    - NULL-SERIALIZER with hand-computable byte count; residue must be exactly zero.
    - NULL-RELATION with different arity; moving components are reclassified as scheme-level.
    - tau equal to 1, where the composition contribution to both axes is trivial and both must reduce
      to hand-computed values.
    - 'Honest-prover completeness check at every grid point: acceptance must be exactly 1 before any
      size is reported, so no size is measured on a broken shell.'
    - 'Byte-length determinism check: re-serializing the same logical signature must produce the identical
      byte string, or the size distribution is measuring nondeterminism.'
    required_metrics:
    - measured byte length distribution (min, median, max, variance) per grid point
    - exact enumerated soundness error per grid point
    - formula_bytes and residue R per grid point
    - component decomposition of R with the exactness check
    - Pareto frontier membership per grid point, with the dominated points listed
    - count of R components moving under NULL-RELATION
    - residue against NULL-SERIALIZER, which must be zero
  falsification_conditions:
  - The residue against NULL-SERIALIZER is nonzero, voiding the byte accounting.
  - The component decomposition does not sum to R exactly, indicating instrumentation error.
  - R is zero or negative at every grid point, falsifying claim (B) that serialization overhead is
    a measurable positive quantity.
  - The frontier has fewer than three nondominated points, so there is no tradeoff to speak of at
    the declared grid.
  - Byte length is nondeterministic under re-serialization of identical logical content.
  - Honest-prover completeness is below 1 at any grid point, blocking all size reporting there.
  confounders:
  - Framing choices of this shell driving the entire residue, which is true by construction and is
    why NULL-SERIALIZER and the explicit component decomposition are mandatory rather than optional.
  - Opening size being a random variable, so a single-sample byte count would misreport the curve.
    Mitigated by reporting the full distribution over 200 messages per point.
  - The frozen analytic formula being written to match the serializer, making R artificially small.
    Mitigated by freezing the formula at Stage 0 before the serializer is instrumented and recording
    both artifacts in the run record.
  - Enumerability limits correlating with grid position, so the measured-soundness points are a biased
    subset of the grid. Mitigated by reporting size-only points separately and never pairing them
    with budgeted soundness.
  interpretation_limits:
  - The curve describes the declared toy shell with the declared framing at the declared grid, and
    nothing else. It is not a model of any deployed signature format.
  - The soundness axis is exact only where enumeration completed; elsewhere there is no soundness
    coordinate at all, by design.
  - A positive residue is expected serialization overhead. It is not a criticism of any design and
    carries no security content.
  - Paradigm-versus-scheme attribution here is relative to TWO placeholder relations. Two points do
    not establish invariance across the whole family, and the record says so rather than generalizing.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(messages times grid) signings plus the
      enumeration cost of the soundness measurement.
    memory_exponent: No attack exponent is claimed. Memory is dominated by the transcript enumeration,
      bounded by the declared cap.
    best_known: The incumbent is the analytic size-versus-soundness formula the family quotes, and
      within this repository the parameter-audit approach of IDEA-20260805-7abf04 and the Pareto discipline
      of IDEA-20260813-27df0c on different axes.
    hidden_overhead: The residue itself is literally the hidden lower-order term being surfaced, so
      the honest disclosure is that the lower-order term hiding beneath THIS measurement is the compression
      that a real implementation might apply and that this run deliberately omits. Human cost hides
      in the serializer instrumentation, which must attribute every single byte or the decomposition
      is not exact.
  dominated_by: 'n/a (no result claimed). Considered every frontier axis: this record places no attack
    point on time, memory or queries. The Pareto frontier it constructs is over design axes (signature
    bytes, measured soundness) of a toy shell and is not comparable to any attack frontier.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part (A), that the frontier is computable in full at the declared grid
    and non-monotone in N: 0.6 for computability being straightforward and non-monotonicity being
    a genuine guess that could easily fail if opening cost grows too slowly. Part (B), that R is strictly
    positive and decomposes exactly: 0.9 for positivity, which is near-certain given any framing at
    all, and 0.8 for exact decomposition, limited only by instrumentation discipline. That R over
    measured_bytes exceeds two percent at small N: 0.65. Part (C), that at least one component is
    shown scheme-level by NULL-RELATION: 0.5, and a result of zero moving components is an informative
    outcome rather than a failure.'
