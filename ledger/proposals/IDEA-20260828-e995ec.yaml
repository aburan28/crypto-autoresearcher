    - >-
      The sequential-vs-shuffled comparison shows a large, replicated
      difference even where the AES-vs-null comparison shows none --
      indicates an order-sensitivity artifact unrelated to AES's own
      security property, investigated before any AES-specific claim.
    - "The sibling null reproduces the real-S-box profile exactly at every round."

  confounders:
