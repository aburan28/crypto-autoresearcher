idea:
  id: IDEA-20260828-e995ec
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    Sequential-stream Lempel-Ziv parsing complexity of counter-indexed AES
    ciphertext, tested against the Ziv-Lempel asymptotic equipartition rate
    -- an ORDERED-STREAM object, distinct from the whole-domain cycle-type
    and sampled collision-graph objects filed alongside it
  class: mechanism

  claim: >-
    For a fixed key K and round count r, form the bit-string B(K,r,M) by
    concatenating the M ciphertexts C_1,...,C_M of SEQUENTIAL counter-like
    plaintexts P_t = t (t=0,...,M-1, as an unsigned integer of the block's
    bit width) under AES_K at round count r. CLAIM: the number of distinct
    phrases c(n) in the LZ78 incremental parsing of B(K,r,M) (n = M *
    blocksize) is, for a genuinely i.i.d.-uniform bit source, governed by
    the classical Ziv-Lempel asymptotic equipartition result
    c(n) ~ n/log2(n), giving an exact asymptotic target this record checks
    AES's counter-mode-like output against, discriminating between
    (H_iid) "AES-K's sequential ciphertext stream, at the full round
    count, is indistinguishable from an i.i.d.-uniform source on this
    compressibility statistic" and (H_struct) "the SEQUENTIAL,
    COUNTER-STRUCTURED plaintext family (each P_t differing from P_{t-1}
    by exactly +1, a very low-Hamming-weight, highly structured difference
    for most of the range) leaves a measurable compressibility excess or
    deficit" -- informative in either direction, and specifically
    informative about a property (real-world CTR-mode indistinguishability)
    neither of this batch's other two objects can address, since both
    discard input ORDER entirely.

  object_first_candidate:
    tracked_object: >-
      The LZ78 incremental-parsing phrase count (and secondary order-0/
      order-1 entropy estimates) of the ORDERED, CONCATENATED bit-stream
      of ciphertexts from a SEQUENTIAL COUNTER-INDEXED plaintext family
      under one fixed key -- a STREAM/SEQUENCE object, distinct in data
      topology from the whole-permutation cycle-type object
      (IDEA-20260828-355431, an unordered partition of the full domain)
      and the sampled collision-graph object (IDEA-20260828-8c7aa8, an
      unordered graph over independent samples). This object specifically
      requires ORDER and is therefore sensitive to sequential/counter-mode
      input correlation, which the other two objects discard by
      construction.
    established_families_off_limits: >-
      All twelve off-limits families are off-limits and none is used.
      LZ-complexity of a ciphertext stream is not a difference, parity,
      balance/coset-sum, impossible-event, table-match key-elimination,
      adaptive two-directional-oracle, subkey-guessing precomputed table,
      polynomial-system, swap/exchange, or subspace-dimension technique.
      It is a generic sequence-compressibility/source-coding statistic
      (the same family as Maurer's universal statistical test and NIST
      SP800-22's compression test), applied here to a SEQUENTIALLY
      structured input family rather than independent random inputs.
      DISCRIMINATION FROM THE OTHER TWO NEW OBJECTS IN THIS BATCH,
      explicit: cycle type needs the whole domain, no query order;
      the collision graph needs independent random samples, explicitly
      discarding order; this object needs neither exhaustive enumeration
      nor independence -- it needs SEQUENTIAL, ordered queries, and its
      null theorem (Ziv-Lempel asymptotic equipartition) is a THIRD,
      distinct classical result from the two already used this session
      (Poisson/Erdos-Renyi; Cauchy/Ewens in IDEA-20260828-355431).
    newness_score: >-
      The general tool (LZ-complexity as a randomness test) is standard
      in information theory and generic-PRNG testing. New to this
      program's checked AES corpus is its application, in this specific
      sequential-counter-indexed form, to a full-round AES ciphertext
      stream, as a distinct discriminator from independent-sample or
      whole-domain statistics. Novelty against external literature is
      UNVERIFIED; no search specific to "AES Lempel-Ziv complexity counter
      mode" was performed this session.
    testability_score: >-
      High. One reading costs M encryptions (e.g. 2^16-2^20 blocks) plus
      an O(n log n) LZ78 parse; comfortably inside the measured envelope
      and, like the collision graph, executable at REAL AES-128/192/256
      block size since it needs only M sequential samples.
    survival_score: >-
      Expected LOW for a genuine, cryptographically meaningful deviation,
      stated honestly: this is precisely the property CTR-mode AES is
      designed to provide. The instrument's value is a real-scale
      compressibility-based measurement this program's corpus does not
      currently hold, and a genuinely different discriminator (sequential
      structure) from the other two objects filed this round.

  mechanism: |
    THE CLASSICAL NULL. LZ78 parses a bit-string into phrases, each the
    shortest prefix of the remaining string not already seen plus one new
    bit. For an i.i.d.-uniform Bernoulli(1/2) source, the Ziv-Lempel
    asymptotic equipartition theorem gives c(n) ~ n/log2(n) as n ->
    infinity, a rigorous classical result from information theory (not
    invented here); finite-n fluctuation results are established in the
    information-theory literature (RECALLED, unverified from a primary
    source this session). This record's validation plan calibrates the
    finite-M behaviour directly against Monte Carlo draws of an actual
    i.i.d.-random bit source of the SAME length n, rather than relying on
    the recalled asymptotic formula alone -- the same discipline this
    program's other instruments apply to their own approximate nulls.

    WHY SEQUENTIAL/COUNTER STRUCTURE IS THE GENUINELY DIFFERENT AXIS.
    Every other instrument in this batch and RQ uses the full domain
    (cycle type), a fixed byte-coset with all else fixed (co-degree
    ladders), or independent random samples (the collision graph). None
    uses a SEQUENTIALLY ORDERED, low-Hamming-weight-increment input
    family, the actual input structure of real CTR-mode AES usage. The
    plaintext difference P_{t+1} XOR P_t has extremely low average
    Hamming weight for most t (a highly structured difference pattern
    across the sequence) -- exactly the kind of structured input a
    compressibility statistic, which is sensitive to dependence ACROSS
    the sequence, could in principle detect if AES's mixing did not fully
    erase counter-structure by full round count. THE FALSIFIABLE,
    DISCRIMINATING PREDICTION: c(n) for AES-K's full-round CTR-like
    stream should match the i.i.d.-random target within calibrated
    tolerance at the full round count; a measured, replicated departure
    in EITHER direction would be a genuine, previously unmeasured finding.

  novelty_status: unverified

