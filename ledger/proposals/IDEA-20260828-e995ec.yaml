      verified_by: "authored in this same session"

  assumptions:
    - >-
      That M sequential counter-indexed plaintexts and their ciphertexts,
      for M up to 2^16-2^20, can be generated and LZ78-parsed within the
      measured resource envelope using an O(n log n) trie-based
      implementation in pure Python, requiring no numpy dependency and
      thereby reducing exposure to the toolchain contradiction
      RQ-AES-002's resource-envelope constraint names.
    - >-
      That the recalled Ziv-Lempel formula, even if imprecisely recalled
      in its exact constant, is directionally correct enough to be
      checked against an actual i.i.d.-random calibration in stage 0
      before any AES reading is interpreted; the record does not rely on
      the recalled formula's precision.

  proof_search_map:
    not_applicable_reason: >-
      Empirical statistical measurement against a classical asymptotic
      information-theoretic result, not an asymptotic complexity claim
      about an attack, a certificate family, or a closure/reduction
      argument. No KN-TECH-080 audit applies.

  predictions:
    - metric: "c(n): LZ78 phrase count of B(K,r,M) at full round count, M=2^16 blocks, over >= 50 independent keys"
      direction: different
      minimum_effect: >-
        PREDICTED to match, within a pre-registered tolerance band from
        Monte Carlo calibration against an actual i.i.d.-random source of
        the same n, the calibrated null mean/variance; a value outside
        the band is the signal.
    - metric: "i.i.d.-random calibration: c(n) for a true random bit source of identical length n, over >= 200 draws"
      direction: different
      minimum_effect: >-
        Establishes the calibrated null directly rather than relying on
        the asymptotic formula alone; checked for directional consistency
        with the recalled asymptotic rate as a secondary sanity check.
    - metric: >-
        sequential-vs-independent comparison: c(n) for the same M
        ciphertexts, once in sequential counter order and once randomly
        shuffled
      direction: different
      minimum_effect: >-
        PREDICTED EQUAL within sampling noise; any LARGE, replicated
        difference isolates sequential/counter structure specifically as
        the source of any deviation, discriminating it from a generic
        marginal-distribution deviation.
    - metric: "round_count_decay_ladder: c(n) at r=1..10/12/14, full AES-128/192/256"
      direction: different
      minimum_effect: >-
        PREDICTED at the calibrated null from a small r onward; SHAPE
        pre-registered as monotone non-increasing deviation as r
        increases, non-monotone profile is the canonical artifact tell.
    - metric: "sibling_null: c(n) for a full-round AES-shaped SPN with a uniformly random S-box, same sequential input"
      direction: different
      minimum_effect: >-
        PREDICTED to reproduce the real-S-box profile exactly; a mismatch
        localizes any finding to the specific S-box vs round geometry.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (seconds-minutes, CAN END THE
      LINE): unit-test the LZ78 parser against hand-computable reference
      strings; calibrate c(n) for i.i.d.-random sources at the target n
      via >= 200 draws, BEFORE any AES reading. STAGE 1 (minutes): M=2^16
      sequential ciphertexts under >= 50 independent AES-128 keys at the
      full round count; compute c(n); repeat the sequential-vs-shuffled
      comparison on the same set. STAGE 2 (minutes, budget permitting):
      AES-192/256 and a round-count ladder for AES-128. STAGE 3 (minutes):
      the sibling null. STAGE 4 (paper): write the finding.
    controls:
      - "UNIT TEST: the LZ78 parser is verified against hand-computable reference strings before any statistical reading is trusted."
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: an actual
        i.i.d.-uniform bit source of identical length n. If the
        calibration is inconsistent with the recalled asymptotic
        direction, the citation is flagged unreliable and the record
        proceeds on the measured calibration alone.
      - >-
        SEQUENTIAL-VS-SHUFFLED CONTROL, THE INSTRUMENT'S OWN
        DISCRIMINATING TEST: the same M ciphertexts read in sequential
        vs randomly shuffled order.
      - "SIBLING NULL THAT ISOLATES THE PROPERTY: the AES-shaped SPN with a uniformly random S-box, everything else identical."
      - "GRADED CONTROL: the round-count ladder, monotonicity reported, per RQ-AES-002's decay check."
      - "ORDERING CONTROL: the i.i.d. calibration and unit test are computed and hash-committed before any AES treatment reading."
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository
        measures an LZ-complexity or sequence-compressibility statistic
        for any AES-shaped object under sequential input. Recorded as
        unavailable.
    required_metrics: ["LZ78 unit-test results", "i.i.d.-random calibration mean/variance", "c(n) per (key,round) cell with tolerance band", "sequential-vs-shuffled comparison", "sibling-null comparison", "round-count decay profile"]

  falsification_conditions:
    - "The LZ78 parser fails its unit test. Instrument broken; nothing may be reported."
    - >-
      The i.i.d.-random calibration is qualitatively inconsistent with
      the recalled Ziv-Lempel asymptotic direction. The citation is
      flagged unreliable; the record proceeds on the measured calibration
      alone, noted explicitly as a correction.
    - >-
      A replicated, statistically significant deviation between AES's
      c(n) and the calibrated null persists at the full round count after
      all controls pass. Requires the sequential-vs-shuffled
      discrimination before any stronger language; routes to independent
