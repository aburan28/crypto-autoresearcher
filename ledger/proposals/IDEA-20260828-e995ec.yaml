  heuristic_assumptions:
    - id: H1
      statement: >-
        For an i.i.d.-uniform Bernoulli(1/2) bit source of length n, the
        LZ78 phrase count c(n) satisfies c(n) ~ n/log2(n) as n ->
        infinity, with computable finite-n fluctuation behaviour,
        imitating the classical source-coding rate theorems (the same
        role Cauchy/Ewens and Poisson play for this batch's other two
        objects).
      rigorous_support: >-
        A classical, rigorous asymptotic result from information theory
        (Ziv-Lempel 1978), not invented for this record; RECALLED here
        and not independently re-verified against a primary source this
        session.
      validation_plan: >-
        Stage 0's i.i.d.-random Monte Carlo calibration measures the
        ACTUAL finite-n distribution directly (>= 200 draws at the target
        n), used as the operative null throughout, with the asymptotic
        rate checked only as a directional sanity check on the
        calibration itself.
    - id: H2
      statement: >-
        AES-K's sequentially-ordered, counter-indexed ciphertext stream,
        at its own full round count, is statistically indistinguishable
        from an i.i.d.-uniform bit source on the LZ78 phrase-count
        statistic -- the CTR-mode security heuristic restated as a
        concrete prediction, tested via a statistic sensitive
        specifically to sequential/order structure.
      rigorous_support: >-
        NOT A THEOREM -- the genuinely uncertain content of this proposal,
        and exactly the property real-world CTR-mode deployment already
        relies on informally; the sequential-vs-shuffled control is built
        specifically to make a violation reportable as a real,
        order-attributable finding rather than dismissed as expected.
      validation_plan: >-
        MEASURED directly per minimal_test, with the sequential-vs-
        shuffled discrimination and round-count decay profile reported
        regardless of the result's direction.

  target_complexity:
