    memory_exponent: >-
      O(n) for the bit-string plus O(c(n)) for the LZ78 dictionary trie,
      both linear in M and negligible at the tested M (e.g. ~1 MB at
      M=2^16 blocks); stated beside time.
    best_known: >-
