    memory_exponent: Negligible — store per-target success bits and V generators.
    best_known: >-
      KR-IC-b0fcda (τ-invariant FB); KR-IC-73db3f (V as subspace).
    hidden_overhead: τ-saturation may inflate effective product-space dim.
    tradeoff_note: >-
      Closure packs orbits but may worsen V·V geometry — the meter decides
      which dominates at toys only.

