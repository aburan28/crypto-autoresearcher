  assumptions:
    - Stdlib or already-admitted toy Koblitz cells; do not provision curve libs.
    - Shared solver pin; τ-closure constructed by saturating under Frobenius.
    - Yield band 1.25 and ≥40 targets pre-registered; no post-hoc edits.
    - Toy yield enrichment ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-0fcbe2-H1
      formal_statement: >-
        FORALL n∈{17,23,31}, ℓ∈{3,4}: on ≥40 matched random targets under a
        frozen solver pin, R_τ ≥ 1.25 × R_open where R is empirical Semaev
        m=3 success rate on τ-closed vs matched-dim open V.
      random_model_justification: >-
        Rigorous: KR-IC-b0fcda gives that τ-orbits collapse equivalent FB
        points, so a closed V packs more inequivalent x-coordinates per
        dim than a random open V of the same dim. Classical: if packing
        dominates, R_τ rises; if τ-closure forces a geometrically worse
        product space, R_τ may fall. The ≥1.25 band is the pre-registered
        transfer hypothesis at toys — not a claim of the 1/n asymptotic
        or any exponent vs rho.
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-73db3f
      validation_experiment_ids: []
      falsification_condition: >-
        R_τ < 1.25 × R_open at a completed cell (τ-stable-not-richer), OR
        curve/solver absent (infrastructure stop), OR both arms have zero
        successes (inconclusive; report, do not invent a ratio).

  predictions:
    - metric: success_rate_ratio_tau_over_open
      direction: lower_bounded
      minimum_effect: '≥ 1.25 at each (n,ℓ) cell'
    - metric: target_count
      direction: lower_bounded
      minimum_effect: '≥ 40 matched targets per cell'
    - metric: both_arms_nonzero_success
      direction: lower_bounded
      minimum_effect: '≥ 1 success on each arm, else mark inconclusive'

  minimal_test: >-
    Stage 0: freeze seeds, ℓ, solver pin, τ-saturation rule, band 1.25.
    Stage 1: n=17, ℓ∈{3,4} — ≥40 targets; report R ± bootstrap CI.
    Stage 2: n=23,31 + random-Boolean null. Budget: ≤8 CPU-hours.
    Stop if curve cell or encoder absent (IMP, never evidence).

  controls:
    - ctl_matched_dim_open_V
    - ctl_matched_random_targets
    - null_random_boolean_matched_size
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_band_edit
    - ctl_shared_solver_pin

  falsification_conditions:
    - Claiming practical binary IC from a toy τ-yield win (KR-IC-1fcdbc).
    - Treating 'use τ-stable FB' as novelty (KR-IC-b0fcda forbids).
    - Transferring the 1.25 band to n≥131 without a new contract.
    - Editing the band after seeing yields.
    - Treating missing curve libs as mathematical falsification.

  target_complexity:
