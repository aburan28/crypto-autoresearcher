idea:
  id: IDEA-20261001-0fcbe2
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES A FROBENIUS-CLOSED FACTOR BASE RAISE RELATION YIELD AT TOY KOBLITZ?
    On stdlib (or already-admitted) toy Koblitz cells n∈{17,23,31}, compare
    Semaev m=3 relation success rate under a τ-closed F_2-subspace V against
    a matched-dimension non-closed V on ≥40 matched random targets.

  class: heuristic_validation

  claim: >-
    KR-IC-b0fcda states Frobenius-invariant factor bases reduce the number of
    systems to solve by up to 1/n on subfield curves. CLAIM: at each toy cell
    n∈{17,23,31} with frozen dim(V)=ℓ∈{3,4}, on ≥40 matched random targets
    under a shared XOR-SAT (or admitted) pin, the success rate
    R_τ = P(decompose | V τ-closed) satisfies R_τ ≥ 1.25 × R_open where
    R_open uses a matched-dim non-closed V — OR the inequality fails and is
    recorded as τ-stable-not-richer at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO n≥131 transfer. NO claim
    that τ-closure beats rho (KR-IC-1fcdbc).

  mechanism: >-
    OBJECT FRAME. Representation: factor base {P : x(P)∈V} with V an
    F_2-subspace of F_{2^n} (KR-IC-73db3f), on Koblitz E/F_2 with Frobenius τ
    (KR-IC-b0fcda). Operation set: build (A) a τ-closed V by saturating a
    seed subspace under τ, and (B) a non-closed V with the same dim, then
    run identical S_3 PDP attempts. Trichotomy: Class I partial-action
    (relation under FB translation). Lossy-projection: success bit discards
    which conjugates were hit; null is a matched-size random Boolean system
    whose R_τ/R_open ratio should not inherit τ-closure. OFF-LIMITS:
    counting orbit attempts on a fixed non-stable V (IDEA-20261001-cb6a72);
    usable_dimensions emptiness predictors (fbee3f / 880180); walk-constant
    √(2n) (833e78). WHAT IS NEW: a pre-registered ≥1.25 yield band for
    τ-closed vs matched open V at RQ-BINSTD toys.

  novelty_status: unverified
