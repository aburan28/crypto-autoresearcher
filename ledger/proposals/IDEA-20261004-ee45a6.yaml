# IDEA-20261004-ee45a6
# Class-number count for discriminants -2088 and -2107. Proposal only. Not approved.
idea:
  id: IDEA-20261004-ee45a6
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -2088 is 10 and of discriminant -2107 is 9
  class: measurement
  claim: >-
    Discriminant -2088 has 10 reduced binary quadratic forms.
    Discriminant -2107 has 9. Ten exceeds nine by 1. The product of
    the two class numbers is 90. Their sum is 19. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -2088 has the forms with coefficients 1, 0, 522 and
    2, 0, 261 and 3, 0, 174 and 6, 0, 87 and 9, -6, 59 and 9, 0, 58
    and 9, 6, 59 and 18, -12, 31 and 18, 0, 29 and 18, 12, 31.
    Discriminant -2107 has the forms with coefficients 1, 1, 527 and
    7, 7, 77 and 11, -7, 49 and 11, 7, 49 and 13, -5, 41 and 13, 5, 41
    and 17, -1, 31 and 17, 1, 31 and 23, 3, 23. Two copies of class
    number 9 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks which j-invariant distinctions change an
        attack cost.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
