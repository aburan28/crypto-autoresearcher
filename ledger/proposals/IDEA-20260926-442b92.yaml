#
# DISCLOSED REVISION AT FILING (not softening; AGENTS.md rule 5). The draft
# claimed that for curves with a published small orientation, a class-group
# meet-in-the-middle on the Frobenius-twin isogeny could beat p^{1/3+o(1)} for
# small discriminant D. The novelty check required before filing found three
# defects. (1) Given a published orientation iota, OneEnd is immediate: iota of
# a generator of O is already a non-scalar endomorphism, so the Frobenius-twin
# search is not needed at all. (2) The residual problem, EndRing given one
# endomorphism, is a PUBLISHED result: classical time about disc(Z[alpha])^{1/4}
# under GRH (Herledan Le Merdy-Wesolowski, eprint 2023/1448, abstract retrieved
# this session). (3) The draft's threshold arithmetic was wrong. sqrt(#Cl(O)) is
# D^{1/4+o(1)}, which beats p^{1/3} for D < p^{4/3}, not D < p^{2/3}. The
# record is filed as what it now is: a control/closure recording the
# regression, the corrected arithmetic, one routing observation for
# GOAL-SSIQ-001, and a bookkeeping scope check.
idea:
  id: IDEA-20260926-442b92
