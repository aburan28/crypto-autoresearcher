  proposed_by: idea-generator
  status: proposed
  title: >-
    The oriented Frobenius-twin route regresses to a known result. With a
    published orientation, OneEnd is immediate, and EndRing costs about
    disc(Z[alpha])^{1/4} classically under GRH (Herledan Le Merdy-Wesolowski
    2023). Filed as a closure, plus one routing note: the same result carries
    Wesolowski's OneEnd output to EndRing at matching exponent p^{1/3}.
  class: control

  claim: >-
    (C1, CLOSURE OF THE DRAFT.) Let (E, iota) be a supersingular curve with a
    PUBLISHED primitive O-orientation, as in SCALLOP-type group actions. Then
    OneEnd for E is solved at no cost, since iota(omega) for a generator omega
    of O is non-scalar. The draft's reformulation of the Frobenius-twin search
    as a Cl(O) vectorisation therefore targets a problem that is already solved
    for these curves. The problems that remain hard for oriented curves are
    O-vectorisation and EndRing. These are polynomially equivalent under GRH
    (given the factorisation of disc O; Wesolowski, Eurocrypt 2022,
    eprint 2021/1583), and EndRing given one endomorphism alpha costs classical
    time about disc(Z[alpha])^{1/4} under GRH (eprint 2023/1448). A
    meet-in-the-middle over Cl(O) costs sqrt(h(O)) = |D|^{1/4+o(1)}, the same
    exponent, so the draft mechanism at best reproduces the published bound.
    (C2, CORRECTED ARITHMETIC.) |D|^{1/4} < p^{1/3} iff |D| < p^{4/3}. The
    draft's "D < p^{2/3}" was an arithmetic error and is retracted.
    (C3, ROUTING OBSERVATION FOR GOAL-SSIQ-001; derivation from abstracts
    only.) The frozen source's OneEnd output is alpha = pi o phi with deg
    alpha = p * delta(E) <= p (p/2)^{1/3}. Hence
    |disc Z[alpha]| <= 4 deg alpha = O(p^{4/3}). The 2023/1448 algorithm then
    returns End(E) in about (p^{4/3})^{1/4} = p^{1/3}, which is the same
    exponent as OneEnd, assuming Heuristic 1 and GRH. This is a second
    OneEnd -> EndRing route alongside [35, Theorem 7.2]. GOAL-SSIQ-001's SC-2
    records that [35]'s route needs log deg alpha = (log p)^{O(1)} for an
    unstated lambda, and SC-3 that its concrete cost carries an
    Omega((log N)^{-12}) factor. The 2023/1448 route takes alpha of polynomial
    degree directly. Whether its "about" hides overheads comparable to SC-3's
    is NOT known from the abstract. That is the open item this observation
    hands over.
    (C4, SCOPE CHECK, BOOKKEEPING.) For each published oriented construction,
    compare its stated |D| with p^{4/3} under the corrected arithmetic. The
    expected outcome is that every construction sets |D| >= p^{4/3}. SCALLOP's
    stated purpose is to enable large-discriminant orientations, and the frozen
    source already lists (qt-)Pegasis among constructions "explicitly safe"
    (docs/target-result-profile.md A8). A construction with |D| < p^{4/3} would
    have a published EndRing algorithm faster than p^{1/3}. That would still
    be a known-algorithm observation, not a new attack.
  mechanism: >-
    Representation: (E, iota) with iota an explicit orientation. Operation set:
    the Cl(O)-action on primitively O-oriented curves, which is commutative.
    TRICHOTOMY: partial-action, since the tracked class [a] propagates only
    under the class-group action, on the oriented locus only. LOSSY-PROJECTION
    TEST against Sigma = the Cl(O)-action. The map (E, iota) -> orbit position
    discards the choice of walk realising a class. That is compatible with
    Sigma and lossy relative to the isogeny graph when |D| << p^2. The test is
    PASSED, but the object is exactly the one CSIDH/SCALLOP cryptanalysis
    already tracks, so passing it establishes a valid object, not a new one.
    That is the regression this record files.
