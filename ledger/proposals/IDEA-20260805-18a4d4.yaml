idea:
  id: IDEA-20260805-18a4d4
  question_id: RQ-SQISIGN-001
  added: '2026-08-05'
  title: >-
    The secret cancels: a two-line quaternion identity that kills an entire
    family of multi-signature transcript statistics before anyone measures one,
    plus the hybrid factor q that nobody has charged against the
    zero-knowledge parameter
  class: theory

  claim: >-
    TWO DERIVATIONS, BOTH ZERO-COMPUTE, BOTH DECIDING WHERE A MULTI-SIGNATURE
    TRANSCRIPT ATTACK CAN AND CANNOT LIVE.
    (1) THE CANCELLATION. For a SQIsign-shaped protocol the response of
    signature i corresponds to a left O_A-ideal J_i equivalent to
    conj(I_tau) * I_{psi_i} * I_{phi_i}, where I_tau is the SECRET connecting
    ideal and psi_i, phi_i are the commitment and challenge of that signature.
    For any two signatures the connecting ideal class between their response
    codomains is
        [conj(J_i) * J_j] = [conj(I_{psi_i} I_{phi_i}) * I_{psi_j} I_{phi_j}],
    because conj(conj(I_tau)) * conj(I_tau) = I_tau * conj(I_tau) =
    n(I_tau) * O_0 is a SCALAR and scalars act trivially on ideal classes.
    THE SECRET CANCELS EXACTLY. Therefore EVERY statistic that is a function of
    the pair of response codomains alone - their graph distance, the degree of
    the minimal isogeny between them, any invariant of the connecting class,
    any "do two signatures land suspiciously close together" test - is provably
    independent of the secret key, at every parameter, at every scale, with no
    heuristic. That is a NAMED OBSTRUCTION for a whole family of the most
    natural multi-signature statistics, obtained before a single signature is
    generated, and it comes with forward guidance: information about I_tau can
    only survive in functionals sensitive to WHICH REPRESENTATIVE of the class
    the signer emitted - i.e. to the ideal-to-isogeny conversion's choice - and
    those are exactly the odd-multiplicity functionals in which conj(I_tau)
    appears once and is not paired with I_tau.
    (2) THE HYBRID FACTOR. The zero-knowledge property is (RECALLED,
    UNVERIFIED) stated per transcript. Multi-signature indistinguishability
    follows by a hybrid over the query budget q, at a cost of a FACTOR q in the
    distinguishing advantage. So a scheme targeting lambda bits with a signing
    budget of q queries needs per-transcript statistical distance
    delta < 2^-(lambda + log2 q), not 2^-lambda. At lambda = 128 and
    q = 2^64 that is 2^-192, and 64 extra bits of required indistinguishability
    is not a rounding error - fed into the sibling proposal
    IDEA-20260805-bb4bf8's spectral formula it raises the required commitment
    walk length from 3004 to (0.5*252.415 + 193)/0.0849625 = 3757 two-isogeny
    steps. THE CLAIM IS NOT THAT THE DESIGNERS OMITTED THIS. The claim is that
    THIS CORPUS has never written the q down, that a proposal or evidence
    record which compares a measured transcript bound against 2^-lambda is
    comparing against the wrong threshold, and that checking which threshold the
    specification's own parameter derivation uses is a reading task with a
    binary answer.

  object_first_candidate:
    tracked_object: >-
      The IDEAL CLASS of the connecting module between two response codomains,
      [conj(J_i) * J_j], followed through the Deuring correspondence from the
      pair of signatures back to the quaternion side - together with its
      complement, the CHOICE OF REPRESENTATIVE within that class, which is what
      the class functor forgets. The proposal's content is precisely the split
      between the two: everything in the class is secret-blind, everything
      secret-dependent lives in the representative.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: (i) endomorphism-ring and path-finding
      attacks, and any use of KN-TECH-057's baselines as an attack route -
      GOAL-SSI-001's lane, and this proposal costs no hard problem; (ii) the
      SIDH/Kani torsion-image template and the published-data-surface inventory
      - GOAL-SQISIGN-002's lane, explicitly excluded here; (iii) side channels
      of every kind, excluded by RQ-SQISIGN-001's own "not timing:
      distributional" scoping; (iv) lattice reduction and hint-integration
      machinery (KN-TECH-019, KN-TECH-047), which is the natural reflex for a
      "many signatures leak the key" question and is the wrong reflex here
      because there is no lattice in sight; (v) generic statistical testing of
      whole transcripts, which is IDEA-20260801-020's approach and which this
      proposal deliberately does not repeat - the point is to decide by ALGEBRA
      which statistics are worth testing before any are tested.
    newness_score: >-
      The identity I * conj(I) = n(I) * O is textbook quaternion-order
      arithmetic and the composition-equals-ideal-product rule is the Deuring
      correspondence's basic bookkeeping; neither is new mathematics and this
      record does not pretend otherwise. What is new is the USE: applying the
      cancellation as a PRE-COMPUTE FALSIFIER that removes a family of
      experiments from consideration before they are budgeted, and pairing it
      with an explicit statement of where the surviving information must sit.
      This corpus contains no such derivation - it contains no records of any
      kind in area SQISIGN.
    testability_score: >-
      The derivation is testable by inspection and by an independent reviewer
      with pen and paper, which is the cheapest possible test. The empirical
      half is testable at toy scale but expensive (it needs real ideal
      arithmetic), and is therefore staged AFTER the derivation and gated on it,
      not merged with it.
    survival_score: >-
      The cancellation survives every parameter choice and every scale, because
      it is an identity rather than an estimate - which is the strength and also
      the limit: it says nothing whatever about the single-transcript question,
      where the information actually is.

  mechanism: >-
    DERIVED HERE. The protocol shape is RECALLED, UNVERIFIED (no SQIsign
    specification of any version has been read by this program;
    RQ-SQISIGN-001.provenance says so and its constraints forbid treating any
    per-scheme claim as established). Verifying the shape is Stage 0 and is a
    gate.

    NOTATION. B a quaternion algebra ramified at p and infinity, O_0 a fixed
    maximal order with End(E_0) = O_0. Deuring: isogenies from E_0 correspond to
    left O_0-ideals; the codomain's endomorphism ring is the ideal's RIGHT
    order; composition of isogenies corresponds to the product of the
    corresponding ideals when the right order of the first equals the left order
    of the second; the dual isogeny corresponds to the conjugate ideal
    conj(I) = { conj(x) : x in I }; and deg(isogeny) = n(I), the reduced norm.
    Standard: I * conj(I) = n(I) * O_left(I) and conj(I) * I = n(I) * O_right(I).
    LABELLED: these are recalled from standard quaternion-order theory, are
    re-derivable, and their re-derivation is a declared proof obligation rather
    than an appeal to a citation.

    THE SIGNING RELATION. Secret tau : E_0 -> E_A with ideal I_tau (left O_0,
    right O_A). Signature i: commitment psi_i : E_0 -> E_{1,i} with ideal
    I_{psi_i}; challenge phi_i : E_{1,i} -> E_{2,i} with ideal I_{phi_i};
    response sigma_i : E_A -> E_{2,i} with ideal J_i (left O_A, right
    O_{2,i}). Since the composite E_A -> E_0 -> E_{1,i} -> E_{2,i} is an
    isogeny with the same endpoints as sigma_i, and connecting ideals between a
    fixed pair of orders form a single class,
        [J_i] = [conj(I_tau) * I_{psi_i} * I_{phi_i}].
    THE COMPUTATION. Write K_i = I_{psi_i} * I_{phi_i} (left O_0, right
    O_{2,i}). Then
        conj(J_i) * J_j
          = conj(conj(I_tau) * K_i) * (conj(I_tau) * K_j)
          = conj(K_i) * conj(conj(I_tau)) * conj(I_tau) * K_j
          = conj(K_i) * (I_tau * conj(I_tau)) * K_j
          = conj(K_i) * (n(I_tau) * O_0) * K_j
          = n(I_tau) * (conj(K_i) * K_j).
    n(I_tau) is a rational integer, so it scales the module without changing its
    class. Hence
        [conj(J_i) * J_j] = [conj(K_i) * K_j],
    a class determined by the two commitments and the two challenges ALONE.
    CONSEQUENCE, STATED AS A THEOREM-SHAPED CLAIM WITH ITS SCOPE: for any
    function F of the pair (E_{2,i}, E_{2,j}) - equivalently of the connecting
    class - the law of F(E_{2,i}, E_{2,j}) under honest signing does not depend
    on I_tau. In particular the minimal connecting degree is bounded by
    n(K_i) * n(K_j) = (D_psi D_phi)^2 in BOTH the honest and any
    secret-substituted world, so the "two responses are unexpectedly close"
    family of tests is dead on arrival as a KEY-RECOVERY route. It is NOT dead
    as a DISTINGUISHER: the simulated pair's codomains are two endpoints of
    independent degree-D_sigma walks from E_A, whose minimal connecting degree
    is generically ~p, so if (D_psi D_phi)^2 < p the pair statistic separates
    honest from simulated - a distinguisher that provably carries no key
    information. THAT ASYMMETRY IS THE PROPOSAL'S SHARPEST OUTPUT, because
    GOAL-SQISIGN-001's completion criterion asks for a distinguisher WITH a
    stated conversion path to key information, and here is a candidate
    distinguisher with a PROVEN ABSENCE of one. The comparison
    (D_psi D_phi)^2 versus p is a two-number check against the specification and
    is the cheapest decisive gate in this proposal.

    WHERE THE INFORMATION MUST BE, i.e. THE FORWARD GUIDANCE THE CLOSURE
    STANDARD REQUIRES. The cancellation happened because conj(I_tau) appeared
    once with multiplicity +1 in J_j and once with multiplicity -1 in
    conj(J_i). Any functional in which the net multiplicity of I_tau is NONZERO
    can retain information. Three named survivors, in decreasing cheapness:
    (S1) single-transcript functionals of the emitted REPRESENTATIVE J_i - its
    norm form, its reduced basis, the 2-adic shape of its generator - which is
    where the ideal-to-isogeny conversion's output distribution lives and which
    is the subject of the sibling proposal IDEA-20260805-2a669e;
    (S2) triple products conj(J_i) J_j conj(J_k) and higher odd combinations,
    where one conj(I_tau) survives;
    (S3) functionals coupling a response to the PUBLIC key's own structure, e.g.
    the pair (E_A, E_{2,i}) rather than (E_{2,i}, E_{2,j}).
    Each is stated so a later agent can attack it; none is claimed to work.

    THE HYBRID FACTOR, DERIVED. Let D_1 be the law of one honest transcript
    given the public key and S_1 the simulator's law, with statistical distance
    delta. Honest transcripts are mutually independent given the public key
    (fresh commitment randomness per signature) and the simulator needs no
    secret, so the q-transcript laws satisfy
        SD(D_1^{(x)q}, S_1^{(x)q}) <= q * delta,
    by the standard hybrid, and this bound is tight in the worst case. A scheme
    claiming lambda-bit zero-knowledge under a q-query signing budget therefore
    needs delta <= 2^-lambda / q = 2^-(lambda + log2 q). NUMBERS, FIXED HERE
    BEFORE ANY READING: lambda = 128 with q = 2^64 gives 2^-192.
    Substituting into the spectral walk-length formula derived in
    IDEA-20260805-bb4bf8, k* = (0.5*log2(n) + lambda' + 1)/0.0849625 with
    lambda' = 192 and log2(n) = 252.415 gives
    (126.208 + 193)/0.0849625 = 3757.1, against 3003.8 at lambda' = 128. A
    25 per cent increase in a quantity that is already 12x the natural
    parameter. THIS IS AN ACCOUNTING CLAIM ABOUT WHAT MUST BE CHARGED, NOT A
    CLAIM THAT THE SCHEME FAILS TO CHARGE IT.

  novelty_status: unverified

  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals (RQ-SQISIGN-001 prior art)
      - ledger/goals/GOAL-SQISIGN-001.yaml, GOAL-SQISIGN-002.yaml
      - knowledge/techniques (grep for zero-knowledge, abort, rejection)
    grep_results:
      - >-
        One prior proposal on this question (IDEA-20260801-020). It proposes
        measuring a transcript-vs-baseline divergence; it contains no algebra,
        no cancellation analysis, and no multi-signature accounting, so this
        proposal is not a variant of it.
      - >-
        No record in this corpus states a hybrid loss for any signature scheme's
        zero-knowledge parameter, and no record writes down an ideal-class
        cancellation of any kind.
    conclusion: >-
      Novel within this corpus. Almost certainly known to the designers as
      folklore - the cancellation is exactly the kind of thing a scheme designer
      checks - and this record does not claim external novelty. The screen is
      discounted for the corpus-wide reason recorded in the ANGLE-BRIEF: 7420 of
      7809 literature entries carry a bulk-seeding caveat while their
      citation_verified field reads "read", so "no prior work does X" is not
      assertable from this corpus and is not asserted.

  literature_context:
    - >-
      NOT READ: any SQIsign specification, of any version. Every protocol-shape
      statement in this record is RECALLED, UNVERIFIED and is a candidate to
      check. Stage 0 replaces this paragraph with quotations or records that the
      source could not be obtained.
    - >-
      RECALLED, UNVERIFIED but re-derivable, and its re-derivation is a declared
      proof obligation: the Deuring dictionary (isogeny <-> left ideal,
      composition <-> product, dual <-> conjugate, degree <-> reduced norm) and
      the identity I * conj(I) = n(I) * O_left(I). No theorem number, page,
      author or venue is asserted anywhere in this record.
    - >-
      READ IN-REPO: knowledge/techniques/KN-TECH-057.md, for the matched
      full-cost baselines this proposal does not compete with.
    - >-
      RELAYED VIA scratchpad/scout/ANGLE-BRIEF.md, NOT READ: ePrint 2026/1305,
      reported to show SQIsign is not SUF-CMA with concrete malleability in the
      v2.0 specification. Listed because a malleability result is ALSO a
      statement that two related transcripts exist - which is adjacent to this
      proposal's object - and a later agent should check whether the reported
      basis-change malleability interacts with the cancellation identity. NOT
      USED HERE and no claim about it is made.

  lossy_projection_identifiability_audit:
    projection: >-
      The pair of full signing transcripts, plus all signer-internal state
      (I_tau, psi_i, psi_j, all randomness) --> the ideal CLASS
      [conj(J_i) * J_j], equivalently the connecting isogeny E_{2,i} -> E_{2,j}
      up to pre- and post-composition with endomorphisms.
    what_is_discarded: >-
      The choice of representative ideal within the class - which is to say, the
      entire output of the ideal-to-isogeny conversion - along with both
      commitments' identities, the challenges, and the secret.
    why_genuinely_lossy: >-
      Genuinely lossy: the class functor forgets the representative, and the
      fibre over a class is the full set of ideals of the relevant norms in it,
      which is large. Not a relabelling.
    why_compatible_with_the_operations: >-
      Compatible in the strongest possible sense: ideal multiplication descends
      to the class groupoid, so the projection propagates DETERMINISTICALLY
      through composition, which is the target's own operation. That is exactly
      why the cancellation goes through - and, in the same breath, exactly why
      the projection is useless for key recovery.
    is_it_only_a_change_of_coordinates: >-
      NO. The KN-LIT-7595 failure - (Delta, Pi) = (x xor y, x*y) in
      characteristic 2, where the unordered pair is recoverable as the roots of
      t^2 + Delta t + Pi so nothing is discarded and nothing gained - does not
      apply, because the representative is not recoverable from the class.
    which_failure_was_checked_for: >-
      BOTH, AND ONE OF THEM FIRES - WHICH IS THE POINT OF THE RECORD. Checked
      for the change-of-coordinates failure: negative, the projection is
      strictly lossy. Checked for the MIRROR failure, a projection so lossy it
      is CONSTANT across instances with zero comparator spread: POSITIVE WITH
      RESPECT TO THE SECRET AND NEGATIVE WITH RESPECT TO THE SIMULATOR. The
      class is provably constant as I_tau varies with the commitments and
      challenges held fixed - zero spread in the secret direction, so zero key
      information - while it is NOT constant as one moves between the honest and
      simulated worlds, so nonzero spread in the distinguisher direction. A
      projection can be simultaneously a perfect distinguisher and an
      information-free one, and this is a worked instance. Identifying that
      before spending a budget is the deliverable.

  assumptions:
    - >-
      That the response ideal satisfies [J_i] = [conj(I_tau) K_i]. IF THE
      ROUND-3 DESIGN BUILDS THE RESPONSE DIFFERENTLY - and the recalled
      higher-dimensional redesign is reported (RELAYED via
      GOAL-SQISIGN-002.non_duplication, NOT READ) to sample the response from a
      more natural distribution - the relation may be different and the
      cancellation must be re-derived against the actual construction. The
      derivation's SHAPE survives any construction in which the response
      connects the public key to a curve reached from E_0, because that is all
      the cancellation uses; the details do not.
    - >-
      That the equivalence "[J_i] = [conj(I_tau) K_i]" is equality of classes in
      the relevant groupoid rather than of specific ideals. It is; the record is
      written in classes throughout and never treats a class statement as a
      representative statement.
    - >-
      That left ideal classes form a GROUPOID, not a group. They do, and this is
      the standard objection to sloppy quaternion-class reasoning (recorded in
      this corpus's own SSIQ lane per the ANGLE-BRIEF). The derivation above is
      groupoid-safe: every product written has matching orders, and no
      commutativity is used anywhere.

  proof_search_map_note: >-
    This proposal is proof-oriented; the full four-audit proof_search_map is
    carried by the paired hypothesis when one is written for it. It is NOT
    carried here because the paired hypothesis for this batch is
    H-SQISIGN-f40078, which pairs with IDEA-20260805-bb4bf8. A coordinator
    promoting THIS idea must require its own proof_search_map first
    (docs/inventor-protocol.md section 8; AGENTS.md).

  predictions:
    - metric: >-
        secret_dependence_of_the_pair_class: number of distinct values of the
        connecting ideal class [conj(J_i) J_j] observed at a toy parameter set
        as the SECRET I_tau is varied over R independent keys, with the
        commitments and challenges held fixed by seed
      direction: lower
      minimum_effect: >-
        EXACTLY 1, derived before any run. If more than one value is observed
        the derivation is WRONG and must be withdrawn as a superseding record.
        This is the derived null that can actually fail.
    - metric: >-
        pair_separation: minimal connecting degree between two response
        codomains, honest arm versus simulated arm, at a toy parameter set
      direction: different
      minimum_effect: >-
        Honest arm bounded by (D_psi D_phi)^2; simulated arm generically ~p.
        The PRE-RUN DISCRIMINATOR is the inequality (D_psi D_phi)^2 < p read off
        the specification's parameters. If it holds, the pair statistic
        separates the arms and the deliverable is a proven-key-blind
        distinguisher. If it fails, the family is closed for distinguishing too,
        and that closure carries its named obstruction and forward guidance.
    - metric: >-
        hybrid_threshold_check: whether the specification's own zero-knowledge
        parameter derivation compares its statistical distance against
        2^-lambda or against 2^-(lambda + log2 q)
      direction: different
      minimum_effect: >-
        A BINARY ANSWER read from the document. If it uses 2^-lambda, the
        deliverable is a stated 64-bit accounting gap with the corrected number;
        if it uses the q-charged threshold, the deliverable is that this
        program's own future comparisons must use it too, which is a correction
        to THIS corpus and is worth exactly as much.
    - metric: >-
        corrected_walk_length: k*(lambda + log2 q) computed from the sibling
        spectral formula
      direction: higher
      minimum_effect: >-
        3757 two-isogeny steps at lambda = 128, q = 2^64, p = 2^256, against
        3004 at q = 1. Both numbers are derived in this record before any
        reading or run and are recomputable in one line.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (pen and paper, hours, DECISIVE): an
      independent reviewer re-derives the cancellation, checks every product for
      matching orders (the groupoid trap), and either confirms it or names the
      step that fails. A failure here ends the proposal at zero cost and is the
      most valuable possible outcome per unit spend. STAGE 1 (reading, gated by
      source availability): obtain the specification; extract D_psi, D_phi,
      D_sigma, p, lambda and the signing-query budget q; evaluate
      (D_psi D_phi)^2 versus p and the 2^-lambda versus 2^-(lambda + log2 q)
      question. STAGE 2 (toy computation, only if Stages 0-1 survive): implement
      quaternion ideal arithmetic at a toy prime and verify the
      secret-dependence prediction (exactly 1 distinct class over R keys) and
      the pair-separation prediction. STAGE 3: write the closure at the
      docs/inventor-protocol.md section 4 standard - obstruction, argument,
      forward guidance naming S1, S2, S3 - or withdraw.
    controls:
      - >-
        DERIVED NULL THAT CAN FAIL: vary the secret I_tau over R independent
        keys with commitments and challenges frozen by seed, and measure the
        number of distinct pair classes. FORCED VALUE 1, derived pre-run. If the
        measurement returns more than 1, the identity is wrong. This is a null
        with real teeth because the identity, not a distributional assumption,
        is what forces the value.
      - >-
        POSITIVE CONTROL THAT MUST FIRE: a DELIBERATELY BROKEN variant in which
        the response is built as conj(I_tau) K_i but the pair statistic is
        formed as [J_i * J_j] instead of [conj(J_i) * J_j]. There the secret does
        NOT cancel (the I_tau multiplicities add rather than subtract), so the
        measured number of distinct classes MUST exceed 1 and should be ~R. If
        the instrument reports 1 there too, it is measuring nothing and NO
        conclusion may be drawn from the main arm.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS: form the m-fold alternating
        product with m = 2, 3, 4, 5, 6 responses. The net I_tau multiplicity is
        0 for even m and 1 for odd m, so the predicted distinct-class count is
        1, R, 1, R, 1 - an alternating pattern that no plausible instrument
        artifact reproduces, and whose failure localises exactly which
        multiplicity bookkeeping is wrong.
      - >-
        ARCHIVE CHECK, zero compute: no prior measurement of this observable
        exists in this corpus - there are no SQISIGN-area records at all. The
        absence is recorded as an absence and not claimed as a passed check.
    required_metrics:
      - the re-derivation verdict, with the failing step named if it fails
      - distinct pair-class count per arm, per m in the graded family
      - (D_psi D_phi)^2 versus p, with both numbers quoted from the source
      - the threshold the specification actually uses, quoted verbatim
      - corrected k* at the q-charged threshold

  falsification_conditions:
    - >-
      An independent re-derivation finds a step where orders do not match or
      where a class statement was used as a representative statement. The
      cancellation is withdrawn.
    - >-
      The toy measurement returns more than one distinct pair class across
      secrets at fixed commitments. The identity is false as applied and the
      whole proposal collapses - the cheapest and most decisive falsifier
      available.
    - >-
      The positive control does not fire. Nothing may be concluded from any arm.
    - >-
      The Round-3 response is not built from a path through E_0, so the relation
      [J_i] = [conj(I_tau) K_i] does not hold. The derivation must be redone
      against the actual construction; the shape survives, the details do not.
    - >-
      The specification already charges the q factor. The accounting half of the
      proposal is void as an external observation and becomes an internal
      correction to this program's own comparison threshold.

  confounders:
    - >-
      CLASS VERSUS REPRESENTATIVE. The single most likely way to get this wrong
      is to compute with representatives and report a class conclusion, or to
      let a normalisation of representatives leak secret information back in
      through the implementation. Every stage-2 measurement must canonicalise
      classes by a stated, secret-independent rule and must record that rule.
    - >-
      THE GROUPOID. Left ideal classes are not an abelian group; a step that
      silently commutes two products would produce the cancellation spuriously.
      The re-derivation's explicit job is to check every order match.
    - >-
      "PROVABLY NO KEY INFORMATION" IS SCOPED TO THIS FUNCTIONAL FAMILY. It says
      nothing about the single-transcript functionals S1, which is where the
      interesting risk is. A write-up that blurs the two would be a premature
      closure of exactly the kind docs/inventor-protocol.md section 4 forbids.
    - >-
      THE HYBRID BOUND IS AN UPPER BOUND. q * delta is tight in the worst case
      but a specific scheme may do better; the accounting claim is about what
      must be CHARGED absent a better argument, not about what is achievable.

  interpretation_limits:
    - >-
      CLAIM TIER: theory for the derivation, toy for any measurement. No
      cryptographic-scale statement is licensed by either.
    - >-
      This is a NEGATIVE RESULT ABOUT A FAMILY OF ATTACKS, delivered at the
      section 4 standard (obstruction: the exact cancellation; argument: the
      four-line computation; forward guidance: S1, S2, S3). It is NOT a claim
      that SQIsign transcripts are safe, and it must never be cited as one. A
      count of screened functionals would be a fatigue report; a derived
      identity is not.
    - >-
      This proposal costs NO hard problem and does not enter GOAL-SSI-001's
      endomorphism-ring lane or GOAL-SQISIGN-002's published-data-surface lane.
    - >-
      A key-blind distinguisher, if the pair-separation inequality holds, is a
      statement about the ZERO-KNOWLEDGE ARGUMENT only, never about
      unforgeability.

  heuristic_assumptions:
    - id: HEUR-SC-1
      statement: >-
        NONE LOAD-BEARING FOR THE CANCELLATION. It is an identity in a quaternion
        order - FORALL I_tau, FORALL K_i, K_j with matching orders,
        [conj(J_i) J_j] = [conj(K_i) K_j] - and is proved, not assumed. This
        entry exists to record that the record's headline is UNCONDITIONAL, and
        that the only assumption in the vicinity is evidentiary: that the
        recalled protocol shape is the real one.
      rigorous_support: >-
        I * conj(I) = n(I) * O_left(I); scalars act trivially on classes;
        conj(AB) = conj(B) conj(A). All elementary and all re-derivable.
      validation_plan: >-
        Independent pen-and-paper re-derivation (Stage 0) plus the toy
        distinct-class measurement with its alternating graded control.
    - id: HEUR-SC-2
      statement: >-
        The q-query hybrid is the correct accounting for the scheme's stated
        security model - i.e. the model charges signing queries and the
        zero-knowledge statement is per-transcript rather than per-transcript-set.
      rigorous_support: >-
        The hybrid inequality itself is rigorous. What is assumed is which
        statement the specification makes, which is a fact about a document and
        is settled by reading it, not by argument.
      validation_plan: >-
        Stage 1: quote the specification's zero-knowledge statement and its
        parameter derivation verbatim, or record that the source could not be
        obtained.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVED, and the record says so plainly rather than dressing an
      audit as an exponent result. The proposal removes a family of candidate
      attacks from consideration and corrects a threshold. Stated against
      docs/target-result-profile.md's exponent-first bias: this is not exponent
      work and is proposed because it is cheap, decisive, and gates how the rest
      of the goal's budget is spent.
    memory_exponent: n/a
    best_known: >-
      KN-TECH-057's matched full-cost baselines (MITM p^{2/3}, Delfs-Galbraith
      p^{1/3}, van Oorschot-Wiener p^{1/2} and p^{1/4} conditional), read
      in-repo. Not competed with.
    hidden_overhead: n/a
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no attack claimed). FRONTIER ROWS CHECKED before writing null: all four
    KN-TECH-057 rows under the Wiener 3D wiring model, in time and in memory;
    Wesolowski's p^{1/3+o(1)} in time AND memory (per
    docs/target-result-profile.md, Pareto-incomparable to the
    p^{1/2}-time/negligible-memory row rather than dominating it); the
    data/query axis, which is where this proposal WOULD sit if it produced an
    attack - it consumes q signatures - and which is empty because it produces
    none. WHAT WAS NOT CHECKED: the external literature on SQIsign transcript
    security, because no specification or paper has been read; that gap is the
    reason novelty_status is unverified.
  sota_delta: >-
    No attack; the delta is entirely in what is REMOVED and what is RE-COSTED.
    Removed: the whole family of pair-of-response-codomain statistics, closed by
    an identity rather than by a screening count, at zero compute. Re-costed:
    the required per-transcript statistical distance moves from 2^-128 to
    2^-192 at a 2^64 signing budget, and the corresponding spectral walk-length
    requirement from 3004 to 3757 two-isogeny steps at p = 2^256 - a 25 per cent
    increase in a number this corpus had never computed at all.

  estimated_cost:
    implementation: >-
      Stages 0-1: none, pen and paper plus reading. Stage 2: HIGH - toy
      quaternion ideal arithmetic with canonical class representatives is real
      work, and this container has no Sage, no PARI, no sympy (VERIFIED on this
      machine 2026-08-05), so it would be written from scratch. Stage 2 is
      therefore explicitly gated and is not proposed for this batch.
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the cancellation identity survives independent re-derivation. Not
    higher because the groupoid structure is a real trap and because the
    protocol shape it is applied to is RECALLED, UNVERIFIED - the likeliest
    failure is not that the algebra is wrong but that it is aimed at the wrong
    construction. Not lower because the computation is four lines, uses only
    I conj(I) = n(I) O and conj(AB) = conj(B) conj(A), and is checkable by a
    reviewer in minutes. SEPARATELY, 0.6 that the specification turns out to
    charge the hybrid factor q already, in which case the accounting half
    becomes a correction to this program's own comparison threshold rather than
    an observation about the scheme - still worth having, and stated in advance
    so that the less flattering outcome cannot be quietly dropped.
