idea:
  id: IDEA-20261009-43737a
  question_id: RQ-QLWE-9108dc
  added: '2026-10-09'
  status: proposed
  approved_by: null
  title: Module-rank dilution of per-field preprocessing advice at fixed total dimension
  class: control
  claim: >-
    At fixed total dimension kd = 64 over power-of-two cyclotomics, cells
    (d,k) in {(64,1),(32,2),(16,4),(8,8)} with each column a planted
    principal ideal of O_K with a ternary generator: the per-column
    log-unit decoding success and the advice advantage ratio (advice-cell
    approximation factor divided by plain-LWE null at the same BKZ budget)
    degrade monotonically in k and cross 1 at a measured rank k*, or stay
    above 1 through k = 8 (no-dilution finding). Either outcome is the
    deliverable. No deployed parameter set is touched; no exponent moves.
  mechanism: >-
    The object is the interpolation between the ideal regime (k=1, whole
    instance attackable by the class-group/log-unit chain) and plain LWE
    (random columns), parameterised by rank at fixed kd. PHS/Twisted-PHS
    advice (KN-LIT-2568, KN-LIT-7288) depends only on K, so one advice set
    serves every column of a rank-k module with ideal columns; the control
    measures whether module composition (cross-column geometry of the
    direct sum) dilutes the per-column advantage. Lossy projection: the
    column projection pi_j: K^k -> K, under which the module becomes one
    ideal — a mechanism surviving every pi_j is per-column, and measured
    dilution is cross-column geometry, not ring loss. KN-TECH-046 records
    that module rank is unaddressed by the ideal chain; RQ-QLWE-9108dc
    records rank-dependence as unrecorded. This is the classical shadow of
    that question at toy scale.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-2568
      provenance: kb
      claim: >-
        Ideal-lattice preprocessing advice depends only on K; query phase
        exp(O((log D)^{2/3})) classically. Read from the corpus entry; not
        re-derived.
      verified_by: knowledge/literature/KN-LIT-2568.md
    - ref: KN-LIT-7288
      provenance: kb
      claim: Twisted-PHS uses the product formula; at least as good as PHS.
      verified_by: knowledge/literature/KN-LIT-7288.md
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        Ideal chain reaches exp(O~(sqrt(n))) on cyclotomic principal ideals;
        module rank unaddressed. Read from knowledge/techniques/KN-TECH-046.md.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: RQ-QLWE-9108dc
      provenance: internal
      claim: The rank axis is an unrecorded obstruction surface.
      verified_by: ledger/questions/RQ-QLWE-9108dc.yaml
  assumptions:
    - Columns are principal ideals of the same O_K across cells (shared advice).
    - Ternary generators per column; no other secret law.
    - Classical log-unit decoding stands in for the quantum chain; class
      groups computed once per ring by exact arithmetic.
  predictions:
    - metric: per_column_decoding_success
      direction: lower
      minimum_effect: >-
        1.0 on (64,1) declining below 0.25 on (8,8) monotone over >= 3
        cells; or >= 0.75 on every cell (no-dilution).
    - metric: advice_advantage_ratio
      direction: different
      minimum_effect: >-
        Tabulated per (d,k); the k* where it crosses 1, or its absence by
        k = 8.
    - metric: cross_column_geometric_penalty
      direction: higher
      minimum_effect: >-
        Rank-k determinant-normalised shortest-vector band at most sqrt(k)
        above the k=1 band, separating direct-sum geometry from structure
        loss.
  minimal_test:
    design: >-
      Six cells at total dimension 64. (A-D) planted modules over
      Z[x]/(x^d+1), (d,k) = (64,1),(32,2),(16,4),(8,8), columns principal
      ideals with independent ternary generators, advice (class group,
      log-unit basis) computed once per ring exactly. (E) plain-LWE null:
      dimension-64 q-ary lattice, ternary secret, same BKZ budget. (F)
      nearby-ring control: one non-cyclotomic monogenic field of degree 8,
      full unit group, no Stickelberger generator set.
    controls:
      - Plain LWE, same total dimension and budget.
      - Non-cyclotomic nearby ring at the smallest ring degree.
      - Advice disabled on one cell (gain must need the advice).
    required_metrics:
      - per-cell decoding success over columns
      - achieved approximation factor (advice and no-advice variants)
      - advice advantage ratio versus the null
      - determinant-normalised shortest-vector band per cell
  falsification_conditions:
    - >-
      The (64,1) planted cell fails to decode its short generator: the
      instrument does not detect the chain; all dilution readings blocked.
    - >-
      The plain-LWE null matches advice cells within a factor 2 at every k:
      the advantage is a BKZ budget artifact.
    - >-
      The advantage ratio is non-monotone in k without a mechanistic
      reading: the interpolation is uncontrolled.
    - >-
      The non-cyclotomic control shows the same advantage profile: the
      measured structure use is not unit-lattice specific.
  confounders:
    - >-
      Ring degree varies with k at fixed kd; the no-advice cell separates
      the BKZ part, and the entanglement is stated, not hidden.
    - >-
      At degree 8, exp(O~(sqrt(d))) overlaps polynomial factors; the
      certificate carries the ideal cell's label.
    - A failed class-group computation is infrastructure, never evidence.
  interpretation_limits:
    - Toy scale, dimension 64; no transfer to any deployed parameter set
      or statement about ML-KEM, ML-DSA, Falcon, Hawk, NTRU, FrodoKEM.
    - The classical shadow stands in for the quantum chain; no quantum cost
      model is exercised.
    - Measures dilution of planted per-column structure, not an attack on
      random MLWE.
  proof_search_map:
    bottleneck: >-
      Whether module direct-sum composition preserves per-column ideal
      advantage at fixed kd; resolving it converts the unrecorded
      rank-dependence question into a toy-scale boundary.
    baseline_embedding:
      parameter_slice: >-
        (d,k)=(64,1) reproduces the ideal cell of IDEA-20261005-9f4777 at
        degree 64 (planted principal ideal, classical log-unit decoding).
      reproduction_check: >-
        Certificate=1 on the (64,1) cell under the scaled decoder settings
        before any rank reading.
    observation_collision:
      observable: per-column decoding success and matched-budget
        approximation factor.
      distinct_preimage_search: >-
        A random ideal with a long generator: same geometry, nothing to
        decode — 'success' there means decoder bias, not structure.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The rank-k module as a direct sum of ideals read through column
          projections, so dilution becomes cross-column perturbation of
          per-column certificates.
        predicted_gain: a measured k* (or its absence) for the rank axis.
    quantifier_order: >-
      For every planted module in the census (exists instance) the reading
      is taken; never 'for every module including random MLWE', which this
      control does not sample.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per-column planted ideal structure is (or is not) diluted by module
        composition at dimension 64, versus a matched plain-LWE null.
      nearby_object_control: >-
        Non-cyclotomic ring cell and long-generator ideal; a reading not
        separating them certifies nothing.
    proof_obligations:
      - claim: the (64,1) cell reproduces the ideal baseline
        responsibility: baseline
      - claim: BKZ budget matched across cells
        responsibility: scope
      - claim: advice cells beat the no-advice variant where decoding succeeds
        responsibility: correctness
      - claim: >-
          dilution readings separate cross-column geometry from ring-degree
          effects
        responsibility: strictness
      - claim: exact arithmetic with recorded seeds
        responsibility: runtime
  heuristic_assumptions:
    - id: H1
      statement: >-
        Planted per-column principal ideals with ternary generators are a
        faithful toy stand-in for the ideal regime: classical log-unit
        decoding succeeds near-1 at degree 64.
      rigorous_support: >-
        KN-LIT-115 decodability for prime-power cyclotomics and typical
        short-generator distributions (reported, not re-derived).
      validation_plan: >-
        The (64,1) cell is the validation: certificate=1 required before
        rank readings; failure blocks interpretation rather than counting
        against H1 elsewhere.
    - id: H2
      statement: >-
        The advice advantage ratio under matched BKZ budget is a sufficient
        statistic for 'structure benefit' at fixed kd.
      rigorous_support: >-
        BKZ on random q-ary lattices follows the Gaussian heuristic
        (spherical-model framing, KN-LIT-5227); the null instantiates the
        structure-blind model.
      validation_plan: >-
        No-advice variant and plain-LWE null at every cell: the ratio must
        move only when advice is present, and the long-generator cell must
        not fake a certificate.
  target_complexity:
    time_exponent: >-
      No exponent claimed. Exact class-group and unit computations per ring
      (seconds at d <= 64); BKZ block size <= 30 on dimension 64.
    memory_exponent: negligible at this scale.
    best_known: >-
      Structure-blind BKZ on the same lattices; the quantum chain at
      exp(O~(sqrt(d))) on the k=1 cell (KN-TECH-046).
    hidden_overhead: >-
      Exact class-group computation grows superpolynomially in d in the
      worst case; the census caps d at 64 so the overhead stays toy-sized.
    tradeoff_note: none proposed.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP question; the ECDLP map has no lattice module-rank rows.
    nearest:
      - ref: KN-TECH-046
        provenance: kb
        relation: adjacent
        delta: >-
          States module rank is unaddressed; this control measures the
          classical per-column shadow of that gap with matched nulls.
      - ref: KN-LIT-2568
        provenance: kb
        relation: special_case
        delta: >-
          PHS advice applies to ideals of a fixed K; this extends the
          advice-bearing instance to rank-k modules of shared advice and
          measures dilution (the k* boundary or its absence).
      - ref: KN-LIT-7288
        provenance: kb
        relation: adjacent
        delta: >-
          Twisted-PHS improves the ideal query phase; this measures how much
          of it survives module composition.
  dominated_by: >-
    Baseline named: matched-budget BKZ on every cell plus the plain-LWE
    null at dimension 64; the quantum chain at exp(O~(sqrt(d))) on k=1
    (KN-TECH-046). Not beaten by this control.
  sota_delta: >-
    Not an attack claim. Separator: the measured advantage ratio per (d,k)
    cell and the rank k* where it crosses 1 (or its absence through k=8)
    — the first toy reading of the rank axis RQ-QLWE-9108dc records as
    unrecorded.
