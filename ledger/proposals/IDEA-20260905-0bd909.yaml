idea:
  id: IDEA-20260905-0bd909
  title: Dependency-preserving uncertainty envelopes for pairing estimators
  class: composition
  claim: An estimator with shared latent assumptions can produce a materially different uncertainty envelope when
    dependencies are preserved than when every input is varied independently. A dependency certificate can identify
    which numerical conclusions survive all admissible model choices.
  mechanism: Track a symbolic cost expression together with a constraint set on its latent variables. If one uncertain
    smoothness or filtering parameter influences several terms, represent it once and propagate it through each
    occurrence rather than treating repeated uses as independent errors. Interval or affine bounds over the constrained
    set yield a lower and upper envelope; a sensitivity attribution identifies which assumption controls the width.
    On a fixed finite list of candidate models, robust dominance requires one model to dominate another over the
    entire feasible set across time, memory and data. An inconclusive comparison remains unresolved. The proposal
    concerns mathematical consistency of uncertainty propagation, not generation of an operationally optimized parameter
    set.
