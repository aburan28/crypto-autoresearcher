idea:
  id: IDEA-20261005-1896e8
  question_id: RQ-CSIDH-64343f
  title: >-
    Memory-cap ratio of one declared hidden-shift probe at p=419, against a
    memory-blind control
  class: control
  claim: >-
    At the single prime p=419 (p=4*3*5*7-1, p≡3 mod 4), let O be the quadratic
    order Z[(1+sqrt(-p))/2] of discriminant -419. Let N be the class number of
    O, certified by agreement of two independent enumerations of the reduced
    positive-definite binary quadratic forms of that discriminant. Define
    n=max(1, ceil(log2(max(N,2)))), M_free=2^{ceil(sqrt(n))}, and the probe
    cost C(G,M)=G*2^{ceil(sqrt(n))}*ceil(M_free/M) for a positive common oracle
    factor G. The claim is that the named quantity M, the quantum-accessible
    memory cap in logical qubits, separates this probe at this prime: with
    G fixed at 1, C(1,2)/C(1,M_free) is an integer at least 2, while the
    memory-blind control C_blind(G)=G*2^{ceil(sqrt(n))} satisfies
    C_blind(1)/C_blind(1)=1 at both labels M=2 and M=M_free. Scaling G from 1
    to 2 multiplies both C and C_blind by 2 and leaves both ratios unchanged.
    If the certified N yields M_free<4, the cap does not bind and the claim
    that this toy parameter isolates a memory gap fails. No CSIDH-512 security
    level is stated, and C is an instrument defined here, not a reproduction of
    a published bit figure.
  mechanism: >-
    Object frame. Representation (R2): the public CSIDH object is a
    supersingular Montgomery coefficient over F_p, but the tracked object is
    not that curve and not an isogeny-graph vertex. It is the pair of integers
    (N, M), with N the class number of O and M a memory cap. Operation set
    Sigma is {replace M, scale the common oracle factor G}, not elliptic
    translation and not ideal-class composition. Trichotomy of
    IDEA-20260806-c5d183: coordinate-dependent, because the cost ratio is a
    function of the resource-model coordinate M and the integer N, not of a
    hidden class-group element; shifting the secret does not change it.
    Lossy-projection test against Sigma: the projection discards the form
    class, the curve coefficient, and the gate list of any group-action
    oracle, and retains only the ratio of probe costs. The discard is
    compatible with Sigma because the written formula depends on the class
    group only through N and on the oracle only through a common G that
    cancels in the ratio. It is lossy: many orders and circuits share an N.
    A projection that still moved after M was deleted would be sensitive to
    something other than M; that is the blind control. F3 (isogeny path)
    appears only as the reason a group-action oracle exists; it is not the
    lens. The probe's 2^{ceil(sqrt(n))} factor is a declared stand-in for the
    shape 2^{O(sqrt(log N))} recorded in KN-LIT-071, with the O left
    unexpanded because KN-TECH-051 states that the concrete CSIDH-512 figures
    were not obtained. KN-TECH-051 names the axis between the collimation
    position (KN-LIT-127) and the resource-constrained re-costing (KN-LIT-129)
    as how much quantum memory is allowed. This record tests whether that one
    coordinate separates a fully written toy probe, and whether deleting it
    leaves a control that cannot separate.
  novelty_status: adaptation
  citations:
    - ref: KN-TECH-051
      provenance: internal
      claim: >-
        Positions 2 and 3 in that note disagree on the quantum-memory
        allowance, not on a quoted security number; the note forbids citing it
        for a CSIDH security figure. Concrete bit counts were not obtained.
      verified_by: knowledge/techniques/KN-TECH-051.md
    - ref: KN-LIT-127
      provenance: internal
      claim: >-
        The note reports that the collimation sieve uses exponentially less
        quantum memory than earlier hidden-shift algorithms and that a
        classical simulator exists. This idea does not import an unreproduced
        query count.
      verified_by: knowledge/literature/KN-LIT-127.md
    - ref: KN-LIT-129
      provenance: internal
      claim: >-
        The note says the disagreement with the EUROCRYPT 2020 analyses is
        substantially about which resources the adversary is allowed, and that
        the response was a parameter increase. No NIST-level bit figure is
        used here.
      verified_by: knowledge/literature/KN-LIT-129.md
    - ref: KN-LIT-071
      provenance: internal
      claim: >-
        The note records Kuperberg's sieve as 2^{O(sqrt(log N))}. The probe
        uses a fixed stand-in inside that shape and does not evaluate the O.
      verified_by: knowledge/literature/KN-LIT-071.md
    - ref: KN-OPEN-014
      provenance: internal
      claim: >-
        Concrete CSIDH quantum cost and parameter size remain open in that
        note. This idea does not close them.
      verified_by: knowledge/open-problems/KN-OPEN-014.md
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if they have the
        same number of points, and an isogeny walk does not reach a curve
        whose weakness class (anomalous, small embedding degree, smooth order)
        differs, because those invariants are shared. The probe ratio is not
        that statement.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  assumptions:
    - >-
      Discriminant -419 is the discriminant of O=Z[(1+sqrt(-419))/2]. Both
      enumerations must use that discriminant; a mismatch of -419 versus
      -4*419 is an invalid run, not a class-number result.
    - >-
      C and C_blind are the instrument above. They are not claimed to equal
      Peikert's simulator or the SQALE cost model.
  proof_search_map:
    not_applicable_reason: >-
      This is a control on one cost-model coordinate at one class number, not
      a proof of a hidden-shift algorithm or of a CSIDH security level.
    bottleneck: >-
      The step that decides whether the two probe evaluations differ is the
      integer ceil(M_free/M) once N is fixed. Removing M from the formula
      removes the gap; refining the 2^{O(sqrt(log N))} constant does not, and
      is out of scope.
    baseline_embedding:
      parameter_slice: >-
        p=419, disc=-419, G in {1,2}, caps M=2 and M=M_free(N).
      reproduction_check: >-
        Two reduced-form enumerations of disc=-419 return the same N, and
        that N equals the cardinality of the set of forms.
    observation_collision:
      observable: the ratio C(1,2)/C(1,M_free)
      distinct_preimage_search: >-
        Any other order with the same N yields the same ratio. The test
        records that the ratio is constant on N and is not a secret-key
        invariant of a second kind.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the pair (N, M) at disc=-419
        predicted_gain: >-
          A yes/no separation of the memory cap at one certified N, with the
          blind control required to stay at ratio 1.
    quantifier_order: >-
      forall certified class numbers N of disc=-419 (there is one), exists
      the derived M_free, such that C(1,2)/C(1,M_free)>=2, and forall labels
      M in {2,M_free}, C_blind is independent of M. A single N with M_free<4
      falsifies the separation.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either the probe ratio at this prime is an integer >=2 and the blind
        control ratio is 1, or the certified N is too small for M=2 to bind.
        Neither outcome is a quantum security level.
      nearby_object_control: >-
        The same probe on the degenerate input N=1, which forces n=1 and
        M_free=2, must return ratio 1. An implementation that reports a gap
        at N=1 is wrong. N=1 is not asserted to be the class number of -419.
    proof_obligations:
      - claim: The ratio depends on M only through ceil(M_free/M).
        responsibility: correctness
  predictions:
    - metric: C(G=1,M=2)/C(G=1,M=M_free)
      direction: higher
      minimum_effect: integer factor at least 2
  minimal_test:
    design: >-
      Enumerate the reduced positive-definite binary quadratic forms of
      discriminant -419 with two independent implementations and require
      equal cardinalities N. Set G=1, compute M_free from N, evaluate C at
      M=2 and at M=M_free, evaluate C_blind at the same two labels, then
      repeat with G=2. Do not run a quantum algorithm and do not quote a
      CSIDH-512 bit level.
    controls:
      - >-
        Memory-blind control: C_blind has the ceil(M_free/M) factor deleted.
        Its ratio between the two M labels must be exactly 1. If it moves,
        the probe is not isolating M and the claim fails.
      - >-
        Oracle-scale control: replacing G by 2G must multiply every cost by
        2 and must leave both ratios unchanged. If a ratio changes, G is not
        a common factor and the claim that the gap reduces to M fails.
      - >-
        Degenerate nearby object: the same code on the forced input N=1 must
        return ratio 1. A nonzero gap at N=1 falsifies the implementation.
    required_metrics:
      - certified N and the two form counts
      - M_free
      - C(1,2), C(1,M_free), and their ratio
      - C_blind at both labels
      - both ratios again at G=2
  falsification_conditions:
    - The two form enumerations disagree on N.
    - The certified N gives M_free<4, so the ratio is 1 rather than >=2.
    - C_blind changes when M changes.
    - Either ratio changes when G is replaced by 2G.
    - The forced input N=1 produces a ratio other than 1.
  confounders:
    - >-
      Using discriminant -4*419 instead of -419 changes N. The test locks
      disc=-419.
    - >-
      A published model can differ from this probe by more than M. Agreement
      of the probe with itself does not mean the papers differ only by M.
    - >-
      Class-number codes that sample forms probabilistically can disagree
      without a mathematical discrepancy. Both enumerations must be exhaustive.
  interpretation_limits:
    - >-
      A separation, or a failure to separate, at p=419 says nothing about
      CSIDH-512. RQ-CSIDH-64343f forbids a security-level verdict.
    - >-
      The probe is not KN-LIT-127's simulator and not KN-LIT-129's
      constrained sieve. Reproducing those figures remains a different task
      and still requires primary texts.
    - >-
      Failure because N is small is a statement about this prime, not a
      statement that memory is irrelevant at large class numbers.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. N is the cardinality of a finite set of
        reduced forms, and C is an integer function of (N,G,M).
      rigorous_support: >-
        The class number of a negative discriminant equals the number of
        reduced binary quadratic forms of that discriminant; the set is
        finite and the probe arithmetic is exact.
      validation_plan: >-
        Sample the full set of reduced forms of discriminant -419 twice,
        independently. Comparison distribution: the two counts must be
        identical, not close. Tail check: every kept form has discriminant
        -419 and is reduced, and the count of that finite list equals N, so
        there is no statistical tail.
  target_complexity:
    time_exponent: >-
      2^{O(sqrt(log N))} quantum hidden-shift queries, unchanged. The probe
      does not improve the O.
    memory_exponent: >-
      Unchanged relative to the hidden-shift sieve. M_free is a function of
      N inside the same 2^{Theta(sqrt(log N))} shape; the cap M=2 is a
      coordinate being tested, not a new algorithm.
    best_known: >-
      Kuperberg sieve 2^{O(sqrt(log N))} as recorded in KN-LIT-071, with
      concrete constants and memory conventions left open by KN-OPEN-014 and
      KN-TECH-051.
    hidden_overhead: >-
      The O in 2^{O(sqrt(log N))} is exactly what this probe does not
      estimate. No superpolynomial term is claimed to be removed.
    tradeoff_note: >-
      The probe's only tradeoff is the explicit factor ceil(M_free/M). It is
      not a van Oorschot-Wiener curve and it is not a claim that a
      memory-capped quantum attack has that cost.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    The hidden-shift shape 2^{O(sqrt(log N))} in KN-LIT-071 dominates any
    reading of this probe as a faster algorithm; the exponent delta is zero,
    so that reading is dominated and is not the claim. Opened baselines that
    do not dominate the toy ratio itself: KN-TECH-051 (names the memory axis
    and withholds a security number), KN-LIT-127 and KN-LIT-129 (the two
    positions, without formulas evaluated here), KN-OPEN-014 (still open),
    KR-RHO-755e35 (isogenous curves are equally hard; this probe is not an
    isogeny walk), and the earlier proposals IDEA-20260809-66ef77,
    IDEA-20260809-758a6a, and IDEA-20260809-666d3d (switch reproduction,
    classical floor, reversible gate count). None of those evaluates
    ceil(M_free/M) at disc=-419 against a memory-blind control.
  sota_delta: >-
    Hidden-shift query-exponent delta is 0 relative to 2^{O(sqrt(log N))}.
    Discrete-log exponent delta is 0. The quantity that is claimed to move
    is the probe cost ratio between M=2 and M=M_free at the certified class
    number of discriminant -419, which is not an isogeny-walk cost.
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      knowledge/frontiers/ecdlp has no abelian hidden-shift or CSIDH
      quantum-memory row. The top ECDLP-map hit KR-RHO-755e35 is cited below
      and is orthogonal: the probe ratio at disc=-419 is not an isogeny-walk
      cost. The comparison of the probe itself remains the knowledge notes
      opened this session.
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          The row states that isogenous curves are equally hard and that an
          isogeny walk does not find a curve in a different weakness class.
          The probe ratio at disc=-419 is not an isogeny-walk cost, and the
          discrete-log exponent delta is 0.
      - ref: KN-TECH-051
        provenance: internal
        relation: adjacent
        delta: >-
          That note names quantum memory as the dispute axis and does not
          evaluate a ratio at disc=-419. This idea adds one integer ratio
          and a blind control; it adds no security bits. Exponent delta 0.
      - ref: KN-OPEN-014
        provenance: internal
        relation: adjacent
        delta: >-
          The open problem asks for the concrete CSIDH cost. This idea
          leaves that cost untouched and only tests a toy probe's memory
          factor. Exponent delta 0.
    searched:
      corpus_grep:
        - ledger/proposals question_id RQ-CSIDH-64343f
        - knowledge KN-TECH-051 KN-LIT-127 KN-LIT-129 KN-LIT-071 KN-OPEN-014
        - knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      web: []
      blocked:
        - Primary papers were not fetched; only the knowledge notes and the frontier row were opened.
  status: proposed
  added: '2026-10-05'
  approved_by: null
