idea:
  id: IDEA-20260803-48e258
  question_id: RQ-SSI-001
  title: >-
    Stop reporting the Wesolowski margin as a number at one point - emit the crossover
    curve p*(w), the prime size at which the corrected p^(1/3+o(1)) method overtakes
    Delfs-Galbraith as a function of available memory
  class: cost-model
  claim: >-
    GOAL-P13-001 HAS PRODUCED THE PROGRAMME'S ONLY MEDIUM-TIER MEASURED RESULTS AGAINST A
    CRYPTOGRAPHICALLY SCALED TARGET, AND IS REPORTING THEM IN A SHAPE THAT CANNOT BE
    CONCLUSIVE. Three batches have narrowed the NIST-I margin at w = 2^30 from
    [2.27, 34.27] to [8.3498, 13.1544] bits across all eighteen measured-gamma readings,
    with the sign robust (clearing both irreproducibility bands by 4.8-6.1 bits) and the
    magnitude not (span 13.94-16.62 bits against a 2.23-bit band). DEC-20260802-48c72c has
    already assessed completion criterion 1 as unreachable by this method within budget.
    A SCALAR AT ONE (p, w) POINT CANNOT BE ANYTHING BUT INCONCLUSIVE WHEN ITS BAND EXCEEDS
    ITS VALUE. THE CURVE CAN BE CONCLUSIVE WHERE THE SCALAR IS NOT, because the crossover
    is a SIGN CHANGE and the sign is exactly the part BATCH-003 established as robust.
    Emit p*(w): the prime size at which the corrected method's cost curve crosses the
    matched Delfs-Galbraith / van Oorschot-Wiener middle-memory baseline, as a function of
    available memory w, with an uncertainty band propagated from the committed c bracket
    [1.327077, 1.576444] and the eighteen measured-gamma readings, and with the batched-
    evaluation term L4 carried as an explicit two-valued scenario rather than a point.
    PRE-REGISTERED, AND IT CAN FAIL: p*(w) > 2^512 for every w <= 2^40 under EVERY one of
    the eighteen gamma readings and BOTH L4 scenarios. If that holds, the deliverable is a
    strictly stronger statement than the current INCONCLUSIVE - the method is
    asymptotically real and concretely irrelevant across the whole deployed range, stated
    as a curve rather than defended as a margin. IF IT FAILS - if any admissible reading
    puts p*(w) below 2^512 at deployable memory - THAT IS THE CONCRETE THREAT FINDING THE
    CAMPAIGN HAS BEEN UNABLE TO REACH, and it is reached by rearrangement of committed
    numbers rather than by new measurement.
  mechanism: >-
    THE ARITHMETIC IS ALREADY DONE AND IS COMMITTED. BATCH-003 acquired and admitted 47 of
    47 ell, at both implementations, at the identical j-set, with ell = 97 re-acquired at
    exactly the SHA-256 the Validator obtained independently in BATCH-002; C-REPRO
    reproduces 884 overlapping samples bit-for-bit; twelve of twelve gating controls pass
    on the Validator's own recomputation; the Red Team attacked on six fronts and broke it
    on none. The seam-free exponents on W-MID are gamma_A = 0.9328644281 and
    gamma_B = gamma_S-MIN = 0.8100336227, and the ell-independent structural prefactor is
    2^8.92 per entry. NOTHING NEW NEEDS TO BE MEASURED TO PLOT A CROSSOVER.
    WHY THE CURVE IS THE RIGHT OBJECT AND THE SCALAR IS THE WRONG ONE. The two costs scale
    differently in p - one as p^(1/3+o(1)) with a large measured overhead, the other as
    p^(1/2) with a memory-dependent van Oorschot-Wiener constant - so their RATIO is
    monotone in p and its zero crossing is a well-defined function of w. A margin evaluated
    at one p inherits the full width of the overhead uncertainty; a crossing point inherits
    only how fast the ratio moves through zero, which is governed by the DIFFERENCE of the
    exponents (about 1/6) and is therefore far better conditioned. THAT IS THE ENTIRE
    MECHANISM: the same uncertainty that makes the margin's magnitude unusable makes the
    crossover's location usable, because a 13-bit band on a quantity whose slope is p^(1/6)
    is a factor of 2^78 in p only if the band is fully adversarial in one direction, and
    the eighteen readings bound how adversarial it can be.
    WHY IT MUST CARRY HEURISTIC 1 ON ITS FACE. THE CAMPAIGN'S OWN NEXT_ACTION RECORDS THAT
    HEURISTIC 1 HAS NEVER BEEN PAIRED WITH A VALIDATION EXPERIMENT ACROSS THREE BATCHES,
    while P0 multiplies every one of the eighteen margin rows identically. This proposal
    does NOT substitute for that pairing and must not be allowed to. It is a rearrangement
    of a CONDITIONAL result and inherits the condition exactly: every emitted curve is
    labelled conditional on Heuristic 1, and if NC-3/NC-6 later falsifies or repairs it,
    the curve is recomputed rather than defended. Emitting the curve first is nonetheless
    correct sequencing, because the curve tells NC-3/NC-6 which p range its sampler must
    reach to matter.
    THE L4 TERM IS THE ONE PLACE A CURVE BEATS A POINT DECISIVELY. Batched evaluation
    removes 11.50-13.25 bits of a 21.23-25.22-bit total - 48-59 per cent and STILL
    DOMINANT - and has never been built. As a point estimate that is a 13-bit ambiguity
    sitting on top of a 13-bit margin, which is why the margin is inconclusive. As a
    two-valued scenario on a curve it is two curves, and if BOTH lie above 2^512 the
    ambiguity is DISCHARGED WITHOUT BUILDING THE IMPLEMENTATION. That is the single largest
    return available in this campaign for zero compute.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - ledger/goals/GOAL-P13-001.yaml
    - ledger/evidence/EV-WESO-001.yaml
    - ledger/evidence/EV-PEC-2e67ff.yaml
    - ledger/evidence/EV-PEC-857664.yaml
    - ledger/decisions/DEC-20260802-48c72c.yaml
    grep_results:
    - >-
      GOAL-P13-001's BATCH-004 plan lists NC2d-PROPER, NC2b-SLOPE, the bibliographic
      subtask, and NC-3/NC-6. NONE OF THEM IS A CROSSOVER CURVE and none produces one as a
      by-product; all four are controls on the overhead law rather than rearrangements of
      its consequence. This record is complementary and explicitly does not displace
      NC-3/NC-6, which the campaign's own next_action correctly identifies as the
      substantive item.
    - >-
      EV-WESO-001 states the deciding control as "an empirical calibration of the per-entry
      table construction cost" - which BATCH-002/003 then delivered. The crossover is the
      unconsumed consequence of that delivery.
    - >-
      No corpus record contains p*(w), a crossover locus, or any presentation of the margin
      as a function of two parameters rather than as a scalar.
    literature_verified: []
    literature_unverified:
    - >-
      The Delfs-Galbraith p^(1/2) baseline and the van Oorschot-Wiener middle-memory
      tradeoff are named in GOAL-P13-001's own objective and their constants must be
      transcribed from the frozen bibliography rather than recalled. THE FREE BIBLIOGRAPHIC
      SUBTASK - Sutherland (ANTS X, 2013), Santos-Costello-Shi [15], Adj et al. [3] - HAS
      BEEN NAMED AS NECESSARY IN THREE CONSECUTIVE RED-TEAM REPORTS AND EXECUTED IN NONE.
      It sits under the baseline constant k, which sits under every margin row and
      therefore under every point of this curve. It is a BLOCKING subtask here.
    conclusion: >-
      Adaptation. Plotting a crossover between two cost curves is elementary. The
      contribution is recognizing that the campaign's committed uncertainty is
      badly conditioned for a margin and well conditioned for a crossing, and that the L4
      ambiguity can be discharged as a two-curve scenario without building the batched
      implementation.
  assumptions:
  - >-
    Every input is a COMMITTED number from BATCH-002/003 or a value transcribed from a
    primary source with a quoted excerpt and a hash. NO NUMBER IS INVENTED, INTERPOLATED
    BEYOND ITS FITTED WINDOW, OR CARRIED FROM RECOLLECTION. Any required quantity that is
    neither committed nor transcribable makes the corresponding curve segment UNDEFINED
    rather than estimated, and undefined segments are drawn as gaps.
  - >-
    c is used ONLY as the bracket [1.327077, 1.576444] with its eight mandatory
    attachments, NEVER as a number. DEC-20260802-48c72c's prohibition on citing c = 0.864
    binds here without exception.
  - >-
    The FC-4 MECHANISM-INCONSISTENT designation STANDS (a post-hoc restriction to
    ell in {3,5} cannot lift a pre-registered falsifier) and must be attached to every
    curve until BATCH-004's NC2d-PROPER retires it BY MEASUREMENT. If NC2d-PROPER fires
    FC-4 again on ell >= 47, L5 is contradicted where it is applied and THIS RECORD'S
    CURVES MUST BE RECOMPUTED WITH THE MEASURED EXPONENT, not defended.
  - >-
    The charging point at ell = B_opt overstates the entry-weighted cost by 0.60-1.00 bits
    (assumption L2, priced by the Red Team against its own prior direction). That
    overstatement is carried explicitly as a signed correction on every curve rather than
    absorbed.
  predictions:
  - metric: crossover_locus_lower_bound
    direction: same
    minimum_effect: >-
      'p*(w) > 2^512 for every w <= 2^40, under EVERY one of the eighteen measured-gamma
      readings and BOTH L4 scenarios. A single admissible reading placing p*(w) at or below
      2^512 falsifies this and is the campaign''s concrete-threat finding.'
  - metric: crossover_band_width_in_log2p
    direction: decreasing
    minimum_effect: >-
      'The width of the p*(w) band in log2(p), propagated from the same inputs, must be
      NARROWER as a fraction of its value than the margin band is as a fraction of the
      margin at the matched w = 2^30 point. THIS IS THE PROPOSAL''S CENTRAL CLAIM AND IT
      CAN FAIL: if the crossover band is proportionally as wide as the margin band, the
      reconditioning argument is wrong and the curve buys nothing over the scalar.'
  - metric: L4_scenario_separation
    direction: same
    minimum_effect: >-
      'The two L4 curves (batched evaluation absent / present at the 11.50 and 13.25 bit
      extremes) are emitted separately, and an explicit statement is made of whether they
      BOTH satisfy the crossover lower bound. A joint satisfaction discharges the L4
      ambiguity for this question without building the implementation; a split is reported
      as a split and the ambiguity stands.'
  - metric: margin_reproduction_at_the_committed_point
    direction: same
    minimum_effect: >-
      'Evaluated at w = 2^30 and the NIST-I prime, the curve machinery must return a margin
      inside [8.3498, 13.1544] bits for every one of the eighteen readings, reproducing the
      committed BATCH-003 result to within its stated precision. KNOWN-ANSWER GATE - a
      curve that cannot reproduce the point it generalizes is void.'
  - metric: undefined_segment_disclosure
    direction: same
    minimum_effect: >-
      'Every p or w value at which any required input is outside its fitted window is
      reported as an UNDEFINED SEGMENT with the missing input named. A curve drawn through
      an unfitted region without disclosure is the failure this metric exists to prevent,
      and the BATCH-002 defect - an extrapolation law that discarded its measured intercept
      and returned c ~ 0 for an object costing 2^12.3 - is the historical instance.'
  minimal_test:
    design: >-
      ZERO NEW COMPUTE BEYOND ARITHMETIC ON COMMITTED NUMBERS. (1) Freeze the crossover
      definition, the baseline cost model, the propagation rule, and the fitted-window
      boundaries in a hash-bound specification BEFORE any curve is drawn. (2) BLOCKING -
      execute the free bibliographic subtask and transcribe the Delfs-Galbraith / vOW
      constants and the baseline constant k with quoted excerpts and hashes; if
      unobtainable, emit the curve ONLY in ratio form against an unpinned k and report the
      absolute locus as UNRUN under AGENTS.md rule 5. (3) Run the known-answer gate at
      w = 2^30. (4) Emit p*(w) over w in {2^20, 2^25, 2^30, 2^35, 2^40} for all eighteen
      gamma readings and both L4 scenarios, with the L2 charging-point correction applied
      and signed. (5) Report the band-width comparison against the margin band. (6) Mark
      undefined segments. (7) Attach FC-4, Heuristic 1, and the eight mandatory c
      attachments to every emitted object.
    controls:
    - >-
      KNOWN-ANSWER GATE at the committed (p, w) point, as a hard blocker. The curve must
      reproduce BATCH-003's margin band before it is evaluated anywhere else.
    - >-
      FITTED-WINDOW GUARD. Every evaluation outside a fitted window is UNDEFINED, not
      extrapolated. This control exists because the campaign's own BATCH-002 extrapolation
      defect is the exact failure it prevents, and that defect was found by review rather
      than by the contract.
    - >-
      NULL-BASELINE CONTROL. Recompute p*(w) with the corrected overhead REPLACED by the
      paper's original one-operation-per-entry convention. The crossover must move by the
      measured overhead - a curve that barely moves means the overhead correction is not
      driving the result and the whole BATCH-002/003 contribution is not doing the work
      claimed for it here.
    - >-
      ADVERSARIAL-CORNER CHECK. Evaluate at the corner of the c bracket and gamma readings
      MOST favourable to the attack, and report that corner explicitly. The pre-registered
      lower bound is claimed only if it survives that corner.
    required_metrics:
    - the p*(w) table, machine-readable, eighteen readings x two L4 scenarios x five w
    - band width in log2(p) against the matched margin band width
    - known-answer gate residual at w = 2^30
    - null-baseline displacement of the crossover
    - the adversarial corner and its p* value
    - a list of undefined segments with the missing input named for each
  falsification_conditions:
  - >-
    'F1 - the known-answer gate does not reproduce the committed margin band: the curve
    machinery is wrong and nothing may be emitted.'
  - >-
    'F2 - the crossover band is proportionally no narrower than the margin band: the
    reconditioning claim is FALSE, the curve buys nothing, and that negative result is the
    honest deliverable.'
  - >-
    'F3 - any admissible reading puts p*(w) at or below 2^512 for w <= 2^40: the
    pre-registered bound fails and the campaign has a concrete threat finding. This is the
    outcome the proposal most wants to be able to detect.'
  - >-
    'F4 - the null-baseline control shows the crossover barely moves: the corrected
    overhead is not driving the locus and the record must be re-described.'
  - >-
    'F5 - the bibliographic subtask cannot be executed: only the ratio-form curve is
    emitted, the absolute locus is UNRUN, and the pre-registered bound is NOT evaluated.'
  confounders:
  - >-
    THE o(1) IN p^(1/3+o(1)) IS NOT A CONSTANT AND THE CURVE TREATS IT AS ONE OVER THE
    PLOTTED RANGE. This is the largest modelling gap and it is exactly the sort of term that
    a crossover locus is sensitive to at large p, which is where the pre-registered bound
    lives. It must be stated on the curve, not in a footnote.
  - >-
    The eighteen gamma readings are not independent - they share the same 47 acquired ell
    and the same two implementations - so their spread is not a confidence interval and
    must never be reported as one.
  - >-
    gamma_B = 0.810 is a TRANSIENT of the unimproved shared reduction, so THE BRACKET'S LOW
    END IS THE OPTIMISTIC ONE. The Red Team recorded this against the programme's own
    convenience and it binds here: the low end may not be treated as a conservative bound.
  - >-
    A crossover in an asymptotic cost model is not a crossover in practice; implementation
    constants, parallelism, and memory hierarchy are outside the model entirely.
  interpretation_limits:
  - >-
    CONDITIONAL ON HEURISTIC 1, WHICH REMAINS UNVALIDATED AFTER THREE BATCHES. This record
    does not validate it, does not substitute for NC-3/NC-6, and must not be cited as
    reducing the need for that pairing. It inherits the condition exactly.
  - >-
    concrete_threat_nist1 REMAINS INCONCLUSIVE unless F3 fires. A crossover above the
    deployed range is a statement about a MODEL, not a security proof for any parameter set.
  - >-
    No review-breakthrough tier is available here and none is claimed; the tier is
    non-degradable and unavailable in this campaign per DEC-20260802-48c72c.
  - >-
    Claim tier at most `medium`, matching the inputs, and only for segments inside fitted
    windows with the bibliographic constants transcribed.
  heuristic_assumptions:
  - id: HEUR-XO-1
    statement: >-
      The measured overhead law, fitted over 2 <= ell <= 211 at p ~ 2^40, extends to the
      p and ell ranges at which the crossover is evaluated with the same exponent and the
      same ell-independent prefactor.
    rigorous_support: >-
      The prefactor 2^8.92 was found ell-INDEPENDENT and STRUCTURAL, surviving any
      multiplication routine - that is measured and is the strongest support available. The
      p-extension is NOT supported: the fit is at a single p ~ 2^40 and the p-scaling
      exponent alpha is precisely what BATCH-004's NC2d-PROPER is being run to test at
      ell >= 47, where FC-4 has already fired once at ell in {3,5}.
    validation_plan: >-
      DO NOT EVALUATE THE CURVE OUTSIDE THE FITTED WINDOW - mark it undefined instead. Re-run
      this record after NC2d-PROPER reports, and if FC-4 fires again on ell >= 47, recompute
      every curve with the measured exponent. The sequencing is deliberate: this record is
      cheap enough to redo and tells NC2d-PROPER what its outcome would change.
  - id: HEUR-XO-2
    statement: >-
      The van Oorschot-Wiener middle-memory baseline is correctly charged at the w values
      plotted, including its collision-detection and memory-access costs.
    rigorous_support: >-
      NOT ESTABLISHED IN THIS CORPUS. GOAL-P13-001's objective names the vOW comparison as
      part (b) of the goal and BATCH-001 assessed it, but the baseline constant k has never
      been quantified - which is exactly why the bibliographic subtask has been named
      necessary three times.
    validation_plan: >-
      Emit the curve in RATIO form against an unpinned k as the primary object, so the
      shape and the sign are readable without k, and emit the absolute locus ONLY if k is
      transcribed. A record that needs k and does not have it reports the locus as UNRUN.
  target_complexity:
    time_exponent: >-
      No new attack. The objects are the crossover locus p*(w) and its band; the underlying
      exponents are p^(1/3+o(1)) for the assessed method and p^(1/2) for the matched
      Delfs-Galbraith baseline, both taken from the committed record.
    memory_exponent: >-
      w is a free axis of the deliverable rather than a fixed assumption, which is the
      whole point - the current margin is quoted at w = 2^30 only.
    best_known: >-
      Delfs-Galbraith with vOW middle memory, as charged by GOAL-P13-001's own frozen
      baseline.
    hidden_overhead: >-
      The o(1); the untested batched-evaluation term L4 at 48-59 per cent of corrected
      overhead; the L2 charging-point overstatement of 0.60-1.00 bits, which is applied and
      signed rather than absorbed.
    tradeoff_note: >-
      The deliverable IS the time-memory tradeoff, read as a locus rather than a point.
  dominated_by: >-
    Not applicable - no new attack is proposed. The assessed method's own position against
    Delfs-Galbraith is the OUTPUT, and reporting it as a locus rather than as an unchecked
    null is the point of the record.
  sota_delta: >-
    Zero on any attack axis - nothing is improved and no cost is reduced. The assessment
    delta is from a margin at one (p, w) point whose band exceeds its usable precision, to a
    crossover locus over a memory range with a pre-registered lower bound that can fail.
    BATCH-003 already moved the margin band width 17.27 -> 13.94 (-19.3%); this changes the
    SHAPE of the reported object rather than narrowing it further.
  instrument_failure_guards:
    decision_variable: >-
      The crossover locus p*(w) and the ratio of its band width to the matched margin band
      width.
    what_would_make_it_vary: >-
      The memory budget w, an externally imposed knob with a monotone predicted effect -
      more memory helps the vOW baseline and pushes p* UP. A p*(w) that is flat or
      non-monotone in w means the baseline's memory dependence is not wired in and the
      instrument is not responding to the parameter it is built around.
    power_against: >-
      An overhead correction that does not actually move the comparison (null-baseline
      control), silent extrapolation outside fitted windows (fitted-window guard), and a
      favourable-corner reading presented as the general case (adversarial-corner check).
    no_power_against: >-
      Heuristic 1, which is untouched and unvalidated. The o(1) term. Implementation
      constants. Whether the batched implementation is buildable at all. Anything about
      NIST-III/V, which retain comfortable margins under every tested scenario and are not
      re-examined here.
    demonstrated_movement: >-
      By the known-answer gate at w = 2^30 against a committed band, and by the
      null-baseline control, which forces the corrected overhead to demonstrate that it
      moves the locus rather than being assumed to.
    lessons_addressed: >-
      Addresses the BATCH-002 extrapolation defect directly - a law that discarded its
      measured intercept and returned c ~ 0 for an object costing 2^12.3 - by making
      out-of-window evaluation UNDEFINED by contract rather than by reviewer vigilance.
      Addresses the three-times-deferred bibliographic subtask by making it BLOCKING rather
      than optional.
  estimated_cost:
    implementation: low
    compute: none
  compute_budget_note: >-
    Arithmetic on 47 committed ell series and eighteen committed gamma readings. Under an
    hour. The blocking cost is bibliographic retrieval, which is a network-reachability
    problem and has been deferred three times for that reason; if it fails, the record
    degrades gracefully to ratio form rather than failing entirely.
  recommended_priority: high
  dependencies:
  - >-
    BLOCKING - the free bibliographic subtask (Sutherland ANTS X 2013; frozen bibliography
    [15] Santos-Costello-Shi and [3] Adj et al.) for the absolute locus. Ratio form is
    emittable without it.
  - >-
    SEQUENCING - re-run after BATCH-004's NC2d-PROPER reports, since an FC-4 firing at
    ell >= 47 replaces L5 with a measured exponent and every curve is recomputed.
  - >-
    DOES NOT DEPEND ON and DOES NOT SUBSTITUTE FOR NC-3/NC-6. The Heuristic 1 pairing
    remains the campaign's substantive outstanding item and this record says so on its face.
