idea:
  id: IDEA-20260815-528b6e
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE RIGIDITY THEOREM ASSUMES THE OBJECT IS A FUNCTION OF ONE POINT; ASK
    WHAT HAPPENS FOR OBJECTS ON PAIRS, WHICH IS WHERE POLLARD RHO'S
    COLLISION ACTUALLY LIVES
  class: theory

  claim: >-
    IDEA-20260807-df906f classifies maps v from the group to a set. Rho does
    not track such a map: it tracks a relation on PAIRS of points, namely
    whether two walk states collide. The theorem's escape E4 names this and
    stops. Extending the classification to symmetric functions on pairs
    would say whether rho is the only inhabitant of that cell or merely the
    first one found.

  mechanism: >-
    Define a pair-object as a symmetric map on G x G and the propagation
    condition it would need. Apply the same coset argument and determine
    what it forces. Enumerate which known methods are pair-objects and
    whether any cell is unpopulated.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of IDEA-20260807-df906f escape E4 and IDEA-20260815-f558e4;
      grep 'pair object', 'symmetric function', 'collision relation'.
    results: >-
      E4 is named and left with rho as its only inhabitant; no record
      classifies pair-objects or attempts the corresponding rigidity
      argument.
    verdict: >-
      UNVERIFIED. The single-point theorem is this program's own;
      extending it to pairs is a natural next question that nobody has
      asked, though the answer may be immediate.

  object_first_candidate:
    tracked_object: >-
      A SYMMETRIC MAP ON PAIRS of group elements, generalising the single-
      point tracked object.
    lossiness: >-
      A pair-map discards far more than a point-map, and whether it can do
      so compatibly with the group law is exactly the question.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives if a meaningful propagation condition for pair-objects can
      be stated; if the natural condition collapses to the single-point
      case, the extension is vacuous and that is the honest answer.

  null_object_control: >-
    NULL 1 -- the difference map (R,S) |-> v(R-S) for single-point v, which
    reduces to the existing theorem and must reproduce its conclusion. NULL
    2 -- the collision indicator itself, which must appear as a pair-object;
    a framework that cannot express rho's object is the wrong framework.

  discriminated_from:
    - >-
        IDEA-20260807-df906f, whose theorem this extends rather than
        restates; the single-point case is cited, not re-derived.
    - >-
        IDEA-20260815-f558e4, which quantifies the probabilistic regime
        for single-point objects; the pair case is a separate quantifier
        and is not covered by it.

  assumptions:
    - >-
        A propagation condition for pair-objects can be stated that is
        neither trivially satisfied nor a restatement of the single-point
        condition. THIS IS THE RECORD'S CENTRAL RISK and it fails cheaply
        if not.
    - >-
        The coset argument extends; if it does not, that failure
        identifies exactly what prime order was doing in the original
        proof.

  predictions:
    - metric: >-
        difference-map null
      direction: different
      minimum_effect: >-
        FORCED to reproduce the single-point theorem's conclusion;
        otherwise the extension is not a generalisation.
    - metric: >-
        collision-indicator expressibility
      direction: different
      minimum_effect: >-
        FORCED expressible; a framework that cannot express rho's object
        is wrong.
    - metric: >-
        classification outcome for pair-objects
      direction: different
      minimum_effect: >-
        The deliverable: either an analogous rigidity statement, or an
        identified cell that single-point rigidity does not reach.

  minimal_test:
    design: >-
      Symbolic, plus exhaustive verification over Z/N for small prime N by
      enumerating symmetric pair-maps into small target sets.
    controls:
      - >-
          Difference-map reduction null.
      - >-
          Collision-indicator expressibility check.
      - >-
          Exhaustive small-N enumeration as a check on the derivation.
    required_metrics:
      - >-
          Whether a pair-object rigidity statement holds, with its proof
          or its obstruction.
      - >-
          Classification of known methods as pair-objects or not.
      - >-
          Exhaustive small-N verification outcome.

  falsification_conditions:
    - >-
        No non-trivial propagation condition can be stated. The extension
        is vacuous and the record says so rather than forcing one.
    - >-
        The difference-map null does not reduce correctly. The framework
        is not a generalisation.
    - >-
        An analogous rigidity theorem holds. E4 narrows sharply and rho's
        position as sole inhabitant gains an argument.
    - >-
        The argument fails for pair-objects. The cell is genuinely open
        and the record identifies what breaks, which is the more valuable
        outcome.

  confounders:
    - >-
        VACUOUS GENERALISATION: a condition so weak that everything
        satisfies it would produce a theorem about nothing, and the
        difference-map null is the check against that.
    - >-
        REDISCOVERING RHO: any pair-object found will probably be rho in
        new notation, which is exactly the variant-regression failure the
        inventor protocol warns about.

  interpretation_limits:
    - >-
        Extends one theorem's scope; establishes no attack and no
        exponent.
    - >-
        Prime order and the group law throughout, inheriting both
        boundaries.
    - >-
        A rigidity result for pairs would not close KN-OPEN-019, only
        narrow one escape.

  heuristic_assumptions:
    - id: HEUR-PAIR-RIG-1
      statement: >-
        The coset argument of the single-point rigidity theorem extends
        to symmetric maps on pairs under the natural propagation
        condition.
      rigorous_support: >-
        Rigorous ingredient: the original argument uses only that a
        collision forces translation-invariance by a generated subgroup,
        which is a statement about the group and not about the map's
        arity. THE GAP: for pairs the relevant translations act on a
        product group, whose subgroup structure is richer than Z/N's
        even when N is prime, so the step where primality forces the
        whole group may simply fail.
      falsification_condition: >-
        A symmetric pair-map that propagates exactly, is lossy, and is
        not reducible to a single-point map.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of symmetric pair-maps into
        target sets of size 2 and 3, for prime N up to 13. COMPARISON:
        any exhibited example against the predicted impossibility. TAIL
        CHECK: near-propagating maps, reported as candidates for the
        probabilistic regime. TRANSFER: none; the enumeration is a check
        on the derivation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic plus small exhaustive enumeration.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the single-point rigidity theorem, which is sharper
      in its own domain and says nothing about pairs.
    hidden_overhead: >-
      The product group's richer subgroup structure is the term most
      likely to break the argument and is named rather than discovered
      later.
    tradeoff_note: >-
      Extending to pairs buys coverage of the cell rho occupies and risks
      producing a vacuous generalisation; the difference-map null decides
      which.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a structural result: downstream of the
    single-point theorem, which it cites. As a pair-object classification:
    none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: either a rigidity statement
    for pair-objects that narrows escape E4, or an identification of exactly
    which step of the single-point argument fails for pairs, together with
    an exhaustive small-N check on whichever holds.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.5 that a non-vacuous propagation condition can be stated, which is the
    record's main risk and fails cheaply. 0.35 that the coset argument
    extends given the product group's richer subgroup structure. 0.8 that
    the exhaustive small-N enumeration settles the question either way at
    those sizes.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - KN-OPEN-019
    - IDEA-20260807-df906f
    - IDEA-20260815-f558e4
    - KN-TECH-056
