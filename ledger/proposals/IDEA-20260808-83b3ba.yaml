idea:
  id: IDEA-20260808-83b3ba
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  title: Branch number as the KNOB - replace MixColumns by matrices of branch number 2, 3,
    4 and 5 and predict the r=5 excess MONOTONE in the branch number before measuring, turning
    the campaign's six batches of "what it is not" into one measurement of "what it is".
  class: control
  claim: 'Under the mechanism that the r=5 yoyo excess is produced by MDS coset geometry (A1-04),
    the excess must be a MONOTONE INCREASING function of the linear layer''s branch number,
    with a PRE-REGISTERED ordering: excess(identity layer, branch 2) below excess(random invertible
    non-MDS, branch 3-4) below excess(random MDS, branch 5) approximately equal to excess(AES
    MixColumns, branch 5). SECOND ARM - replace ShiftRows by the identity while keeping MixColumns;
    the excess must COLLAPSE, because with no row shift the swap orbit never spreads across
    columns. THE DISCRIMINATION IS THREE-WAY. Monotone in branch number AND collapsing without
    ShiftRows = the wide-trail geometry is the mechanism, A1-04''s derivation has its cause
    confirmed independently, and the object is not a distinguisher. Flat in branch number
    = the excess is not diffusion-driven and every geometric explanation including A1-04''s
    is wrong. Non-monotone = the effect depends on a finer invariant than the branch number
    (e.g. the number of weight-5 codewords), which names the next object precisely.'
  mechanism: 'The campaign has already run the two coarsest substitutions - S-box (excess
    survives) and whole cipher (excess dies). Between them lies the LINEAR LAYER, which no
    committed arm has varied, and which is the only remaining named ingredient. Branch number
    is the single scalar that controls how a diagonal swap spreads, and it is tunable by construction:
    identity gives 2, a random invertible GF(2^8) 4x4 matrix typically gives 4, a Cauchy or
    Vandermonde MDS matrix gives 5. Because the tunable parameter is the one the mechanism
    names, this is exactly the "quantity must decay when the parameter meant to destroy it
    is removed" test that docs/inventor-protocol.md makes the canonical artifact tell.'
  why_not_a_renamed_known_approach: Nearest known method - the wide trail strategy itself
    (recalled_unverified), which uses branch number to BOUND active S-boxes; here branch number
    is used as an EXPERIMENTAL KNOB on a measured statistic, with a pre-registered monotone
    ordering. Nearest internal records - BATCH-713991 (S-box substitution), BATCH-009 (ideal-permutation
    substitution) and BATCH-014 (Feistel PRP substitution). All three replace a WHOLE component
    with something structureless; this one VARIES ONE SCALAR while holding everything else
    fixed, which is what turns an exclusion into an identification. LOSSY-PROJECTION TEST
    - the tracked object is the same coset-label projection as A1-04 (states -> coset of the
    difference modulo the mixing-layer image); replacing the matrix changes the image subspace
    and hence the label set, which is precisely the intended intervention. Genuinely lossy,
    propagates through AddRoundKey/ShiftRows/MixColumns deterministically, dies at SubBytes.
    PASSES.
  predictions:
  - observable: hit count at r=5, N matched to the campaign's committed exposure, per branch
      number
    metric: hits
    predicted: strictly increasing in branch number, with identity-layer near the ideal-permutation
      reading and MDS near AES's 59
  - observable: hit count with ShiftRows replaced by the identity, MixColumns unchanged
    metric: hits
    predicted: collapse to within the pre-registered [0,12] band the campaign already uses
  - observable: two independent random MDS matrices
    metric: hits, each
    predicted: both within a factor 2 of AES's reading - i.e. MDS-generic, not AES-specific,
      the same shape the S-box arm already established
  - observable: round-count decay for each layer
    metric: hits at r = 4, 5, 6
    predicted: every arm decays with r; a non-decaying arm voids that arm
  - observable: number of weight-5 codewords of the layer's code, as a finer covariate
    metric: correlation with hits across the four layers
    predicted: recorded whether or not it is needed - it is the fallback object if the branch-number
      ordering comes out non-monotone
  minimal_test: Reuse the existing instrument. Add a compile-time matrix parameter to the
    committed yoyo probe, instantiate the four layers plus the ShiftRows-off arm, and run
    each at the exposure the campaign has already shown affordable (a 2^32 diagonal sweep
    measured at 53 s; the BATCH-009 arms ran at 2^30 and 2^33). Pre-register the monotone
    ordering and the [0,12] band in a commit before running. Verify the branch number of each
    instantiated matrix by exhaustive minimum-weight computation, not by construction folklore.
  controls:
  - Pre-registered ordering committed before execution.
  - Independently verified branch numbers (exhaustive minimum weight over the codeword space
    of the 4-byte code, or the standard MDS determinant criterion checked on all 2x2, 3x3
    and 4x4 minors).
  - Round-count decay per arm.
  - Two independent random MDS draws, so "MDS-generic" is a measurement and not one sample.
  - The ShiftRows-off arm as a second, structurally different knob - a mechanism confirmed
    by one knob only is a coincidence.
  confounders:
  - Changing MixColumns changes the cipher's invertibility and its key schedule interaction;
    the arms must keep the key schedule fixed or the comparison is contaminated.
  - A random invertible matrix's branch number is a random variable - it must be measured
    per draw, not assumed.
  - Shared-harness bugs conditional on the round function are the residual risk class BATCH-010's
    red team named and which no control to date rules out; running at least one arm on the
    independent rc8probe.c lineage is the mitigation.
  - KN-FIND-029 practice rule 4 is live - a structured key/plaintext can whiten to a constant
    state on which MixColumns is the identity, so every arm uses multiple random vectors.
  falsification_conditions:
  - Flat across branch numbers - all geometric explanations, including A1-04's, are wrong.
  - Non-monotone - the branch number is the wrong invariant; the weight-5 codeword count becomes
    the named successor object.
  - The ShiftRows-off arm does NOT collapse - the swap-spreading mechanism is wrong even if
    the branch-number ordering holds, and the two knobs disagree, which must be reported as
    an unresolved contradiction rather than averaged.
  - Any arm fails its round-count decay check - that arm is void.
  interpretation_limits: Toy tier, reduced-round. Identifying the mechanism of a statistic
    is NOT producing a distinguisher, and a confirmed geometric mechanism most likely REMOVES
    a claimed distinguisher. Results are about the modified ciphers actually run, never about
    AES beyond the arm that is AES.
  assumptions:
  - The committed yoyo probe can take a matrix parameter without changing its counting logic
    - to be confirmed by code read, not assumed.
  - Exposure levels already demonstrated affordable (2^30, 2^32, 2^33) remain so under max_concurrent
    3 shared across three AES goals.
  heuristic_assumptions:
  - id: HA-1
    statement: FOR ALL invertible 4x4 GF(2^8) mixing matrices L, the expected r=5 hit count
      of the pinned probe is a function of L only through the weight enumerator of the code
      generated by [I | L], and is monotone in that code's minimum distance.
    rigorous_ingredient: The branch number of L is exactly the minimum distance of [I | L]
      - a definition-level fact, exhaustively checkable for any given L.
    distribution_imitated: The random-linear-code heuristic - a random invertible L behaves
      like a random linear code of its parameters with respect to low-weight codeword counts,
      i.e. the coding-theoretic analogue of "behaves like a uniformly random object of its
      size".
    validation_route: TOY, LABELLED. On GF(2^4) with 4x4 layers, enumerate the full weight
      enumerator for many random L and measure the hit count exhaustively; fit hits against
      minimum distance and against the weight-5 count, and report which fits better. At real-AES
      scale, the four instantiated arms give four points only - stated as four points, never
      as a curve.
    tail_checks: Report the arm whose hit count deviates most from the monotone prediction
      and its weight enumerator; a single MDS matrix far from AES's reading falsifies "MDS-generic"
      regardless of the mean.
  target_complexity:
    time_exponent: No attack, no exponent. Cost relevance is that it closes or redirects a
      line the campaign has spent six batches on; the arms cost minutes each against producer
      slots of 1600 s.
    memory_exponent: As the existing probe - the BATCH-012 record shows dom+rng pair-storage
      arrays alone cost 8.590 GB at 2^26, so exposure is memory-bound and the arms must be
      sized to the already-measured ceiling rather than to ambition.
    best_known_baseline: The campaign's own committed arms - AES 59, random S-boxes 58/51,
      ideal permutation 14 vs 1, Feistel PRP OUTCOME-A prime.
    hidden_overhead_disclosure: Four arms are four points. Monotonicity across four points
      is weak evidence for a functional form and must be reported as an ORDERING test, not
      a fit.
    time_memory_tradeoff: Exposure is memory-bound at the pair-storage array; the BATCH-012
      load-factor lever is arithmetically exhausted and an O(1)-memory-per-query construction
      is the named unresolved engineering item.
  sota_delta: No attack delta. It converts six batches of exclusions into one identification
    or one refutation, which is the highest-information cheap action available on this lane.
  dominated_by: The queued identity/affine-S-box arm (BATCH-713991) is cheaper and tests a
    question two arms already answered; it does not dominate. The O(1)-memory-per-query ideal-permutation
    construction (BATCH-012's named lever, promoted to rank 1 for BATCH-015) dominates on
    EXPOSURE for the cipher-substitution comparison but answers a different question. Checked
    RC-A, RC-B, RC-C, RC-D and both BATCH-015 candidates.
  estimated_cost: Implementation LOW (a matrix parameter plus branch-number verification);
    compute LOW-MEDIUM (five arms at the campaign's demonstrated exposure); one producer slot.
  recommended_priority: high
  honest_prior_of_survival: Monotone in branch number 0.5; ShiftRows-off collapse 0.65; both
    together 0.4; a clean three-way decision 0.85. This is the cheapest arm in the slice with
    the highest probability of producing a determinate verdict.
  novelty_status: unverified
  novelty_class: adaptation
  novelty_screen: CATALOGUE_TITLES.txt (A2-7's tunable planted-self-similarity schedule family
    is the nearest in SPIRIT - a tunable knob used to measure an instrument's detection threshold
    - but its knob is a KEY SCHEDULE property and its target is instrument sensitivity; mine
    varies the LINEAR LAYER and targets mechanism identification); EXISTING_HYPOTHESES.txt
    (H-AES-8c2d07 covers AES-shaped ten-round SPN objects derived by replacing one named layer
    - THE CLOSEST RECORD, and the difference is that it is a full-round rung-reading construction
    while this is a single-scalar sweep on one measured statistic at r=5; this record should
    be cross-checked against H-AES-8c2d07 by the Coordinator before dispatch); EXISTING_PROPOSALS.txt,
    REJECTED_TITLES.txt, DEFERRED_TITLES.txt, KNOWLEDGE_BARRIERS.txt. EXTERNAL LITERATURE
    NOT SCREENED.
  discriminated_from: H-AES-8c2d07 - replaces a named layer to build ten-round SPN objects
    for rung readings; this varies ONE scalar (branch number) across four instantiations of
    one layer to test a monotone prediction about ONE measured statistic at ONE round count.
    A2-7 - knob on the key schedule for instrument sensitivity; this is a knob on the linear
    layer for mechanism identification.
  source_refs:
  - ref: EV-AES-048545, EV-AES-e4c091, EV-AES-dec938, EV-AES-d81acf and the BATCH-012 memory
      figure (8.590 GB at 2^26)
    status: internal_committed
  - ref: wide trail strategy - branch number as the diffusion parameter
    status: recalled_unverified
    use: named as the source of the knob; not authority.
  proof_search_map:
    not_applicable_reason: Not a proof-oriented proposal - it is a controlled measurement
      with a pre-registered ordering. The audits that DO apply are discharged in `controls`
      (baseline arms already committed), `predictions` (the observation-collision search is
      the two-independent-MDS arm) and `falsification_conditions` (the method ceiling is that
      an ordering over four points identifies a mechanism, never a functional form).
