idea:
  id: IDEA-20260809-47bb6d
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Implement the ROS solver and produce a literal blind-Schnorr forgery, then
    report cost as a curve in concurrency rather than as a verdict
  class: algorithm
  claim: >-
    The polynomial-time ROS solver can be implemented and run to completion at
    small group orders inside one batch, producing a LITERAL forged signature
    that verifies under an independently implemented honest verifier. The claim
    is that its cost, measured across the number of concurrent sessions and the
    group order, follows a stateable curve, and that having the curve rather than
    the asymptotic verdict is what lets any later instantiation question in this
    goal be answered quantitatively.
  mechanism: >-
    The solver builds a system of linear relations among challenge values across
    concurrently opened sessions and solves it to obtain a signature on a message
    never signed. Implementation follows the published construction; the
    measurement is over concurrency and group order with declared seeds.
  why_not_a_renamed_known_approach: >-
    The algorithm is published; this record does not claim it. It claims the
    ARTIFACT and the CURVE — a reproduced forgery inside this program and a
    measured cost surface, neither of which the corpus contains and the second of
    which is not usually published.
  predictions:
  - observable: forgery produced and verified at the smallest parameter
    metric: boolean plus certificate bytes
    predicted: Yes. Failure means the implementation is wrong and halts the goal until fixed.
  - observable: solver cost versus number of concurrent sessions
    metric: operations and memory versus session count, at several group orders
    predicted: >-
      Falling sharply once the session count passes the logarithm of the group
      order, and prohibitive below it. The location and sharpness of that
      transition is the deliverable.
  minimal_test: >-
    Three group orders, session counts swept around the logarithm of each, twenty
    trials per cell with declared seeds, certificates emitted at every successful
    cell and verified by an independent verifier.
  controls:
  - 'HONEST-PATH CONTROL: the blind signing protocol must produce valid signatures on the honest path before any forgery is attempted; a broken protocol implementation manufactures forgeries out of its own bugs.'
  - 'BELOW-THRESHOLD CONTROL: at session counts well below the threshold the solver must fail within the declared budget, confirming the transition is real and not an artifact of the search order.'
  falsification_conditions:
  - No forgery at any reachable parameter within the batch budget.
  - The transition does not track the logarithm of the group order, contradicting the published account and requiring investigation before anything is recorded.
  interpretation_limits: >-
    Certificates are against this program's own blind-Schnorr implementation at
    small parameters. Nothing here is a statement about any deployed protocol,
    wallet, service or chain, and non-completion at a cell is a budget outcome
    about this solver (AGENTS.md rule 3).
  sota_delta: 'No new attack. Delta: a reproduced forgery and a measured cost surface, which are the instruments for the rest of the goal.'
  dominated_by: Externally dominated by the original ROS result, stated plainly. Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for ROS / blind Schnorr / MuSig: no records. WEB NOT CHECKED.'
  source_refs:
  - The ROS insecurity reference -- RECALLED, REQUIRED READ, NOT YET READ.
