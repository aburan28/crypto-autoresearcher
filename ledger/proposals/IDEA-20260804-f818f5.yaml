idea:
  id: IDEA-20260804-f818f5
  question_id: RQ-ECDLP-002
  title: Source-free inverse theorem for translation-compatible lossy predicates
  class: control
  claim: >-
    A proposed lossy tracked object pi can be an exponent-moving ECDLP
    ingredient only if it supplies both a deterministic public propagation law
    pi(X+Y)=T(pi(X),pi(Y),public data) and a source-free inverse I that returns
    exact factor indices from an accepted propagated state without an orbit
    dictionary, source-labelled aggregate, or order-N scalar computation.  The
    proposed theorem audit seeks either such an interface with a fully charged
    N^(0.45+o(1)) assembly or a scoped obstruction for the named candidate; it
    currently improves no exponent.
  mechanism: >-
    The tracked object is an equivalence class pi(X), not a coordinate change:
    the lossy-projection test requires a fibre of size greater than one, while
    T must be well-defined on those fibres.  The additional source-free inverse
    separates a usable quotient from endpoint aggregation: I receives only the
    propagated state and public deck description, not source leaves.  This
    is distinct from scalar-orientation return because I must output factor
    indices/relation witnesses rather than a scalar orbit position.
  novelty_status: unverified
  assumptions:
    - >-
      The candidate family is frozen before testing: for L in {2,3,4} and
      h in {1,2}, enumerate in lexicographic coefficient order the rational
      functions f in the public Riemann--Roch basis L(LO) with coefficients in
      {0,1}; retain only triples (pi_f,T_h,I_h) whose explicitly written
      rational addition and inverse formulas pass symbolic denominator and
      representative-independence checks.  Jet, scalar-orbit, fixed-cover,
      tensor, and source-labelled candidates are excluded.
    - >-
      Select the first retained triple under this order; if none survives, the
      protocol terminates with CANDIDATE-CLASS-EMPTY rather than selecting a
      new object after observing data.
    - Exact source output includes signs, repetitions, infinity, verification, duplicate normalization, rank, factor-log completion, and blind descent.
  proof_search_map:
    bottleneck: Proving that a lossy quotient can retain deterministic propagation while still admitting a source-free exact inverse.
    baseline_embedding:
      parameter_slice: pi=identity, which is source-invertible but fails loss and gives the direct baseline.
      reproduction_check: Verify that the identity branch has singleton fibres and no claimed compression; it must reproduce the direct factor-source interface.
    observation_collision:
      observable: (pi-state, propagated transcript, inverse output).
      distinct_preimage_search: Search two distinct source decompositions with the same pi-state and transcript but different valid index outputs; one collision refutes an unconditional inverse claim.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: A quotient state augmented only by public, source-free certificates necessary to make I single-valued.
        predicted_gain: If state is N^(0.45+o(1)) and I is sub-rho, it could satisfy the P1552 source-locator interface; no such state is supplied.
    quantifier_order: >-
      For every target-independent candidate (pi,T,I), if pi is lossy,
      T is fibre-compatible on every admitted stratum, and I returns every
      accepted source from public data alone, then its charged cost is compared
      with rho; no existential claim is made over unspecified predicates.
    method_ceiling:
      strongest_certifiable_claim: A candidate-specific source-free inverse theorem or a witnessed collision/hidden-source dependency.
      nearby_object_control: A random quotient with the same state cardinality and an identity-labelled inverse table; the latter must be charged as source advice.
    proof_obligations:
      - {claim: pi has nontrivial fibres and T is independent of representatives, responsibility: correctness}
      - {claim: I has biconditional source recall on every stratum, responsibility: interface}
      - {claim: public certificate size and I construction do not encode a source dictionary, responsibility: memory}
      - {claim: assembled relation rank and descent meet the target rectangle, responsibility: runtime}
    not_applicable_reason: null
  predictions:
    - {metric: propagation_fibre_violation_rate, direction: lower, minimum_effect: "Zero over exhaustive toy fibres; one violation rejects the candidate before performance tests."}
    - {metric: inverse_source_recall, direction: higher, minimum_effect: "One for every accepted source and zero false sources after replay."}
    - {metric: public_inverse_advice_exponent, direction: lower, minimum_effect: "At most 0.45 in N; N^(1/2) or larger merges with BSGS/rho-scale indexing."}
  minimal_test:
    design: >-
      First execute the frozen finite candidate-selection protocol in
      assumptions.  If it returns CANDIDATE-CLASS-EMPTY, report that
      disqualifying outcome and do not run a performance comparison.  For its
      single selected triple, on complete toy groups enumerate all X,Y and source tuples, test
      representative-independent propagation, then attempt inverse replay using
      only pi-state and public data.  Run the identical procedure on a random
      same-cardinality quotient.  A collision means no source-free inverse;
      an inverse requiring labelled advice diagnoses a source-preserving
      transform rather than a new object.
    controls:
      - Identity projection as a no-loss positive control.
      - Random same-fibre-size quotient with the same state encoding.
      - Deliberately supplied source table, reported as a forbidden advice control.
    required_metrics: [fibre_sizes, propagation_collisions, source_recall, false_source_rate, inverse_advice_bytes, exact_rank]
  falsification_conditions:
    - The finite protocol returns CANDIDATE-CLASS-EMPTY; this rejects the stated rational-function class, not all source-free inverses.
    - Distinct source tuples with identical observable require different outputs.
    - Propagation depends on a discarded representative.
    - The only successful inverse uses a source table, scalar orientation, or rho-scale search.
  confounders:
    - A quotient may be lossy but merely a random hash; the same-shape random quotient distinguishes compression from curve structure.
    - Complete toy enumeration verifies only the tested candidate and sizes.
    - A certificate that names source leaves is not source-free even if compact.
  interpretation_limits:
    - This is an interface theorem/control, not an attack or a universal impossibility theorem.
    - It excludes generic source aggregation only for a candidate that exhibits the stated collision or advice dependency.
  heuristic_assumptions:
    - id: H-SFI-1
      statement: "One triple selected by the frozen L(LO), coefficient-{0,1}, L<=4, h<=2 protocol is lossy, fibre-compatible, and has public inverse state of N^(0.45+o(1)) size with full source recall."
      rigorous_support: "The quotient/inverse implications are finite algebra once pi,T,I are specified; no rigorous existence bound or classical distribution theorem is known in this local corpus."
      validation_plan: "First perform algebraic collision search at toy scale and compare fibre and inverse-state distributions with random same-shape quotients; tail checks use maximum fibre and worst-case inverse advice. This is toy-only and cannot validate the asymptotic premise."
  target_complexity:
    time_exponent: "No current improvement; conditional assembly target N^(0.45+o(1)) versus rho N^(1/2+o(1))."
    memory_exponent: "Conditional N^(0.45+o(1)); current demonstrated value unavailable."
    best_known: "Pollard rho N^(1/2+o(1)) time/N^o(1) memory; BSGS N^(1/2+o(1)) time and memory."
    hidden_overhead: "Construction of pi, exceptional-stratum handling, inverse certificates, relation rank, factor logs, descent, and verification must be explicit."
    tradeoff_note: "A source table trades inverse time for memory and is dominated unless its complete exponent lies below the named frontier."
  estimated_cost: {implementation: medium, compute: low}
  dominated_by: "n/a (no result claimed)"
  sota_delta: "No attack: time/memory/data exponents 0.00. Information gain is a cheap algebraic discriminator of the missing source-free interface."
  recommended_priority: high
  source_refs: [knowledge/open-problems/KN-OPEN-019.md, coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/semantic_dedup.md, ideas/reviews/P1552_MECHANISM_FRONTIER_20260718.md]
