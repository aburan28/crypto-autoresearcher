idea:
  id: IDEA-20260815-3c9919
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    POLLARD RHO'S CONSTANT IS THE ONLY THING ANY ECDLP RESULT HERE COMPETES
    WITH, AND THIS PROGRAM HAS NEVER MEASURED IT: build the charged rho
    baseline with distinguished points, memory and parallelism accounted
  class: measurement

  claim: >-
    Every comparison in this campaign is against Pollard rho, always cited
    asymptotically as O(sqrt(N)) with an unstated constant. A charged
    baseline needs the constant, the distinguished-point overhead, the
    collision-storage memory and the parallel speedup curve, measured on the
    same hardware as any competitor. Without it no charged comparison in the
    program is actually charged on both sides.

  mechanism: >-
    Implement parallel rho with distinguished points. Measure group
    operations to solution, wall clock, memory, and speedup versus processor
    count across a size ladder. Fit the constant and report it with the cost
    model.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep 'Pollard rho' (126), 'distinguished point', 'rho constant',
      'parallel rho'; check whether any record measures rho rather than
      citing it.
    results: >-
      Rho is cited throughout as the baseline; no record in this corpus
      measures its constant, its distinguished-point overhead, or its
      parallel curve on the program's own hardware.
    verdict: >-
      UNVERIFIED as a measurement here; the algorithm and its analysis are
      classical and van Oorschot-Wiener parallelisation is published, so
      nothing mathematical is new.

  object_first_candidate:
    tracked_object: >-
      THE MEASURED COST OF RHO including constant, memory and parallel
      behaviour, replacing an asymptotic citation.
    lossiness: >-
      Citing O(sqrt(N)) projects away the constant and the memory, which
      is precisely what a charged comparison needs.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at any toy size; the fitted constant is hardware- and
      implementation-bound and is reported as such.

  null_object_control: >-
    NULL 1 -- instances with known solutions, verifying correctness before
    any timing is recorded. NULL 2 -- BSGS on the same instances, giving a
    second measured baseline and catching implementation-quality problems
    that a single baseline would hide.

  discriminated_from:
    - >-
        The published rho analyses, which give the asymptotic and the
        parallel speedup; this record measures the constants on this
        program's hardware.
    - >-
        The ICEX comparison, which consumes a rho baseline; this record
        supplies a measured one instead of a cited one.

  assumptions:
    - >-
        A competent rho implementation is achievable; an unoptimised one
        inflates the baseline in the direction that flatters every
        competitor, which is the dangerous direction.
    - >-
        Toy sizes admit enough repetitions for the constant to be fitted
        with a usable interval.

  predictions:
    - metric: >-
        known-solution verification
      direction: different
      minimum_effect: >-
        FORCED correct before any timing is recorded.
    - metric: >-
        fitted constant with interval across the size ladder
      direction: different
      minimum_effect: >-
        The measurement; reported with hardware and implementation
        stated.
    - metric: >-
        parallel speedup versus processor count
      direction: higher
      minimum_effect: >-
        Predicted near-linear per van Oorschot-Wiener; a materially
        worse curve indicates an implementation problem rather than a
        finding.

  minimal_test:
    design: >-
      Four sizes, at least thirty instances each, with BSGS alongside and
      known-solution verification first.
    controls:
      - >-
          Known-solution verification.
      - >-
          BSGS second baseline on the same instances.
      - >-
          Implementation quality reviewed before results are admitted,
          since a weak baseline flatters everything compared against it.
    required_metrics:
      - >-
          Group operations to solution, wall clock, memory and processor
          count per instance.
      - >-
          Fitted constant with interval.
      - >-
          Parallel speedup curve.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        A known solution is not recovered. Implementation wrong.
    - >-
        The parallel curve is far from linear. Implementation problem; fix
        before reporting a baseline.
    - >-
        The fitted constant is far from the published expectation. Either
        the implementation is weak or the cost model differs, and both
        must be resolved before the baseline is used.

  confounders:
    - >-
        IMPLEMENTATION QUALITY, the dominant risk: a weak rho baseline
        makes every competitor look better and would corrupt every charged
        comparison downstream.
    - >-
        HARDWARE BINDING: the constant is machine-specific, so only ratios
        against competitors measured on the same machine are portable.

  interpretation_limits:
    - >-
        Measures a known algorithm; produces no new attack and no
        exponent.
    - >-
        The constant is implementation- and hardware-bound and is not a
        property of the algorithm.
    - >-
        Toy sizes only; the fit is a toy-range fit.

  heuristic_assumptions:
    - id: HEUR-RHO-BASE-1
      statement: >-
        The measured rho constant at toy sizes describes the constant at
        larger sizes for the same implementation.
      rigorous_support: >-
        Rigorous ingredient: the birthday analysis giving the
        sqrt(pi*N/4) expected step count, which is exact and size-
        independent. THE GAP: the per-step cost is not size-independent,
        since field arithmetic cost grows with p, so the wall-clock
        constant does not transfer even though the step-count constant
        does -- and conflating the two is the specific error this
        heuristic guards against.
      falsification_condition: >-
        A measured step-count constant departing from the birthday
        prediction.
      validation_plan: >-
        SAMPLE: >= 4 sizes x >= 30 instances. COMPARISON: measured step
        count against sqrt(pi*N/4). TAIL CHECK: instances in the slowest
        decile, checked for distinguished-point parameter effects.
        TRANSFER: step-count constant transfers; wall-clock constant
        does not, and both are reported separately.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is many full rho solves at toy sizes.
    memory_exponent: >-
      Distinguished-point table, which is the memory term being measured.
    best_known: >-
      The incumbent is the published rho analysis and its van Oorschot-
      Wiener parallelisation, measured here and not improved.
    hidden_overhead: >-
      Distinguished-point parameter choice trades memory against restart
      cost and can be tuned to flatter the baseline in either direction,
      so it is reported per run.
    tradeoff_note: >-
      A stronger baseline makes every competitor look worse and is the
      honest choice; a weak one silently inflates every comparison in the
      campaign.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As an algorithm: entirely dominated by the
    published rho literature. As a measured baseline on this program's
    hardware: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a measured rho constant,
    distinguished-point overhead, memory footprint and parallel speedup
    curve, so that charged comparisons in this campaign have a measured
    baseline on both sides rather than an asymptotic citation on one.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that a competent implementation is achievable. 0.85 that the step-
    count constant matches the birthday prediction. 0.5 that the existing
    campaign comparisons change materially once a measured rather than cited
    baseline is used, which is the reason this is high priority.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
