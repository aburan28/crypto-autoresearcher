idea:
  id: IDEA-20260807-7c00e6
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    FILED AS A RECORDED CLOSURE, INADMISSIBLE ON ITS FACE: transporting one
    ECDLP instance to every member of its isogeny class and combining the
    resulting ensemble adds no congruence, because Tate's theorem fixes N across
    the class so there is no second modulus to CRT against, and the ensemble is
    EXACTLY parallel collision search with h independent iteration functions at
    an extra isogeny evaluation per step -- strictly worse than parallel rho on
    one curve, with the exact cost ratio computed here
  class: mechanism

  claim: >-
    (A) THE ATTRACTIVE-LOOKING IDEA, STATED AT ITS STRONGEST BEFORE IT IS
    CLOSED. By T1, an F_p-isogeny phi_i : E -> E_i of degree coprime to N maps
    (E, P, Q, k) to (E_i, phi_i(P), phi_i(Q), k) WITH THE SAME k. A class has
    h ~ p^{1/2} members. So one instance becomes h instances of the same secret,
    each on a different curve with a different coordinate representation, a
    different factor base, a different summation polynomial and a different
    pseudo-random walk. That is a genuine multiplication of DATA at polylog cost
    per member. The natural hope: combine the h instances -- by CRT, by lattice
    reduction on an enlarged witness lattice, by pooling relations, or by
    running h walks and looking for cross-curve collisions -- and beat
    0.886 sqrt(N).

    (B) THE OBSTRUCTION, NAMED AND STATED AS AN EQUALITY, NOT A DIFFICULTY.
      (B1) NO SECOND MODULUS. Every E_i in the class has #E_i(F_p) = p + 1 - t,
        identical, by Tate's isogeny theorem. So every transported instance
        lives in a group of the SAME prime order N. CRT combines congruences to
        DISTINCT moduli; here every instance gives k mod N and nothing else. The
        product of the moduli does not grow. THE INDEX OF THE WITNESS LATTICE
        STAYS EXACTLY N, WHATEVER h IS.
      (B2) THE SCALAR ARGUMENT, IN ITS ISOGENY FORM. H-ENDO-001 states that
        every endomorphism acts on the prime-order subgroup G as multiplication
        by a scalar. The same argument applies to an isogeny between class
        members: phi_i restricted to G is an injective homomorphism of
        prime-order groups onto phi_i(G), hence an isomorphism, hence -- after
        identifying both with Z/N via generators -- multiplication by a unit.
        Adding r transported instances therefore adds r coordinates to the
        witness lattice and NO NEW CONGRUENCE; the meet-in-the-middle exponent
        stays 1/2 and the constant grows.
      (B3) GENERIC-GROUP SIMULABILITY. The ensemble {(E_i, phi_i(P), phi_i(Q))}
        is, as an abstract group-theoretic object, h copies of one instance in
        one cyclic group of order N, with the i-th copy related to the first by
        a known isomorphism. A generic-group algorithm can SIMULATE the whole
        ensemble from one instance by choosing h random relabelings, so any
        advantage the ensemble confers is available in the generic model and is
        therefore closed at exponent 1/2 by Shoup (KN-TECH-005), by exactly the
        argument KN-FIND-b7e091 uses for the incidence and endomorphism-image
        oracles. THE ENSEMBLE IS A NEW ORACLE CLASS AND IT SIMULATES.
      NAMED OBSTRUCTION (O-ONEMODULUS): the isogeny class fixes the group order,
      so transport multiplies representations without multiplying moduli; a
      family of representations of one congruence is generic-group simulable and
      closed at exponent 1/2.

    (C) THE QUANTITATIVE STATEMENT, WHICH IS THE PART WORTH RECORDING. Running
    an independent rho walk on each of r transported curves is EXACTLY parallel
    collision search with r distinct iteration functions on one group of order
    N. Total expected work to a collision within one walk is unchanged at
    0.886 sqrt(N) group operations; distributing it over r processors divides
    WALL CLOCK by r and leaves TOTAL WORK identical, which is precisely
    KN-TECH-006's parallel rho with distinguished points -- available WITHOUT
    any isogeny. And cross-curve collisions do not help either: two walks on
    E_i and E_j collide in the abstract group iff their pulled-back points
    coincide in G, which is exactly the same event as a collision between two
    walks on E itself. So the ensemble buys:
        speedup factor = 1, exactly,
        extra cost per step = one isogeny evaluation, i.e. sum of the small
          prime degrees, poly(log p) field operations,
        net effect = a STRICT SLOWDOWN by the isogeny-evaluation factor.
    That is a closure with an exact constant, not a qualitative dismissal.

    (D) WHAT WOULD HAVE TO CHANGE FOR IT TO ESCAPE, WHICH IS THE FORWARD
    GUIDANCE THE CLOSURE STANDARD REQUIRES. The obstruction is exactly (B1),
    so the escape routes are exactly the ways to obtain a SECOND MODULUS or a
    NON-SIMULABLE side channel:
      (E1) DIFFERENT SECRETS, not different representations. h instances with
        DIFFERENT k in the same group is the multi-instance problem, which is
        genuinely different and is RQ-MTGT-2cabee / L13's territory, where the
        relevant bound is the multi-target birthday accounting and the
        Bernstein-Lange / Mihailescu preprocessing bounds. This record does not
        touch it and explicitly hands it over.
      (E2) A GROUP OF A DIFFERENT ORDER. Not available inside a class; available
        across TWISTS (trace -t, order p + 1 + t) and across extension fields.
        The twist is a different class and its group has a different order, so
        it is the one place a genuine second modulus exists -- but the DLP
        instance does not transport to the twist (there is no F_p-isogeny), so
        there is nothing to combine. Stated explicitly because it is the first
        thing a reader will propose.
      (E3) DATA THAT IS NOT A GROUP ELEMENT. The whole rest of this lane: the
        FIELD-side data of each transported instance -- factor bases, summation
        polynomials, solving degrees -- is not simulable in the generic model
        and is exactly what IDEA-20260807-0ff796, -0a3272, -692e9b and -427cf3
        measure. So the correct reading of this closure is not "the isogeny
        class is useless" but "the isogeny class is useless AS A SOURCE OF GROUP
        ELEMENTS, and its only possible value is as a source of field-side
        variation" -- which is precisely the lane's live question.
      (E4) PREPROCESSING TRANSFER. Whether a table built on E retains value on
        E_i after transport is a sharp, cheap question and it is L13's
        (RQ-MTGT-2cabee). This record's argument does not settle it, because a
        preprocessed table is not a group element and its transport is not
        covered by (B3).

  resource_label: >-
    R4 (the isogeny graph) NOMINALLY, but the resource is consumed only to
    produce GROUP ELEMENTS on other curves, which places the proposal on the
    wrong side of the DECOMPOSITION.md section 2 admissibility filter. The
    honest label is: R4 in, R-nothing out.
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    FAILS THE FILTER, AND THE RECORD IS FILED ANYWAY AS THE BRIEF DIRECTS. The
    only thing the ensemble does with the isogenies is apply them to points of
    G. Section 2 of DECOMPOSITION.md closes exactly that: "a lane is
    inadmissible on its face if the only thing it does with phi is apply it to
    points of G". The mechanism of the closure is (B2) plus (B3): every
    transported copy is related to the original by an isomorphism of
    prime-order groups, so the ensemble is a generic-group object, simulable
    from one instance by random relabeling, and therefore subject to Shoup's
    Omega(sqrt(N)) bound (KN-TECH-005) exactly as the incidence and
    endomorphism-image oracles are (KN-FIND-b7e091, EV-GGM-79e710,
    DEC-20260804-3b4258). The simulator is explicit and is written out in Step 2
    below rather than asserted, so this record also discharges the
    RQ-GGMB-6eaabc obligation for this particular oracle class.

  discriminated_from:
    - >-
      H-ICI-063e91 (weakened, DEC-20260804-d0c452), which pulled a FACTOR BASE
      back along an isogeny and measured augmentation. That is a field-side
      mechanism (E3) and is not closed by this record's argument; this record
      closes only the group-side ensemble. The distinction matters because
      conflating them would make this closure look like it settles more than it
      does.
    - >-
      RQ-MTGT-2cabee / L13, which owns multi-target and preprocessing inside a
      class. This record hands (E1) and (E4) to that lane explicitly and claims
      nothing about either. In particular it does NOT claim that preprocessing
      cannot transfer.
    - >-
      KN-FIND-b7e091's Oracle D (endomorphism images). That oracle returns
      phi(G), phi(Q) for endomorphisms of ONE curve. This record's object is a
      family of instances on DIFFERENT curves. The simulability argument is the
      same in structure and different in object, which is why it is written out
      here rather than cited as already done.
    - >-
      Parallel rho itself (KN-TECH-006). The ensemble is not merely dominated by
      parallel rho -- it is IDENTICAL to it up to an extra isogeny evaluation
      per step, and (C) says so as an equality rather than an inequality.

  object_first_candidate:
    tracked_object: >-
      THE TRANSPORTED-INSTANCE ENSEMBLE: the family
      {(E_i, phi_i(P), phi_i(Q))}_{i = 1..h} over the whole F_p-isogeny class,
      together with the isogenies relating them.
    lossiness: >-
      IT IS NOT LOSSY AT ALL, AND THAT IS EXACTLY WHY IT FAILS THE
      LOSSY-PROJECTION TEST. Each transported instance determines the original
      (invert the isogeny by its dual, up to the known degree), and the ensemble
      as a group-theoretic object is h relabelings of one cyclic group of order
      N. Nothing is discarded; the map instance -> transported ensemble is a
      change of presentation, not a projection. THE PROTOCOL'S TEST IS EXPLICIT
      ABOUT THIS CASE: a projection that loses nothing is a change of
      coordinates, not a new object. The test is algebraic, costs no compute,
      and disqualifies the object before any experiment -- which is the whole
      point of applying it in the proposal rather than in the experiment.
    propagation: >-
      Perfectly deterministic and perfectly uninformative: the secret k
      propagates unchanged through every edge (T1), which is what makes the
      ensemble a single congruence repeated h times.
    survival_score: >-
      Survives everything and buys nothing -- the degenerate case. It would stop
      surviving, and start being interesting, only if the class contained curves
      of different group order, which Tate forbids.

  mechanism: >-
    STEP 1 -- THE WITNESS-LATTICE COMPUTATION, EXPLICIT AND FINITE. Write the
    lattice generated by the relations available from r transported instances:
    each contributes phi_i(Q) = [k] phi_i(P), i.e. one relation modulo N in the
    single unknown k. Stack them: the resulting lattice in Z^{r+1} has the
    r-fold repeated congruence and its index in Z^{r+1} is EXACTLY N, not N^r.
    Compute the Hermite normal form symbolically for r = 1, 2, 3 and exhibit the
    index. This is a three-line computation and it is the closure's core.

    STEP 2 -- THE EXPLICIT SIMULATOR, WHICH IS WHAT MAKES (B3) A PROOF AND NOT
    AN ASSERTION. Given generic-group access to one instance (G, P, Q) of order
    N, simulate the ensemble as follows: for each i, draw a uniformly random
    unit lambda_i in (Z/N)^*, and define the i-th "curve" to be the same group
    with encoding sigma_i(x) = sigma(lambda_i x) for a fresh random injective
    labeling sigma_i. Then the simulated (P_i, Q_i) = (sigma_i(1),
    sigma_i(k)) have exactly the distribution of a transported instance as seen
    by a generic algorithm, and every group operation on curve i is answered by
    one operation on the real oracle. Cost: O(1) per query. Therefore any
    algorithm using the ensemble yields an algorithm using one instance with the
    same query count, and Shoup's Omega(sqrt(N)) applies. WHAT THE SIMULATOR
    DOES NOT COVER, stated plainly: it does not simulate the x-COORDINATES of
    the transported points, because those are field elements that depend on the
    actual curve equations. So the closure is exactly and only about the
    group-side ensemble, and (E3) survives it untouched.

    STEP 3 -- THE EXACT COST RATIO. Implement r-curve parallel rho at toy scale:
    r independent walks, one per transported curve, each using the standard
    iteration function on its own curve, with distinguished points pooled. Count
    TOTAL group operations to solve, and compare against (i) r-processor
    parallel rho on the ORIGINAL curve alone and (ii) single-thread rho. The
    prediction is that (i) and the ensemble have statistically identical total
    work, and the ensemble additionally pays the isogeny evaluations. Report the
    measured ratio with its confidence interval over >= 30 seeds.

    STEP 4 -- THE ONE OBSERVATION THAT WOULD BREAK THE CLOSURE, LOOKED FOR
    DELIBERATELY. Cross-curve distinguished-point collisions: if a walk on E_i
    and a walk on E_j produce distinguished points whose pullbacks to G coincide
    MORE OFTEN than two independent walks on E would, then the isogenies are
    correlating the walks in a way the simulator does not capture, and the
    argument has a gap. Measure the cross-curve collision rate against the
    same-curve rate over >= 30 seeds. Predicted identical. This is the record's
    own falsifier and it costs one extra counter.

    STEP 5 -- HAND OFF THE SURVIVORS. Write the (E1)-(E4) forward guidance into
    the record's conclusion with the owning lane named for each, so the closure
    cannot be read as closing more than it does.

  novelty_status: known_negative
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "isogeny class" over the repository. Targeted reads
      of KN-FIND-b7e091 (Oracles C and D, EV-GGM-79e710, DEC-20260804-3b4258),
      DECOMPOSITION.md section 2 and T1/T2, H-ENDO-001 as summarised in the goal
      record, KN-TECH-005, KN-TECH-006, H-ICI-063e91, RQ-MTGT-2cabee.
    results: >-
      KN-FIND-b7e091 closes the endomorphism-image oracle by exactly the
      argument this record extends to isogenies between class members;
      DECOMPOSITION.md section 2 states the filter this record fails;
      H-ENDO-001 states the scalar-action argument. The specific object -- the
      whole-class transported ensemble -- is not written down anywhere in the
      corpus, and no record computes the exact cost ratio in (C).
    verdict: >-
      KNOWN_NEGATIVE. The mechanism is closed by material already in the corpus
      and this record adds no new mathematics. What it adds is (i) the explicit
      simulator for this particular oracle class, discharging the
      RQ-GGMB-6eaabc obligation for it before any lane invents it again;
      (ii) the exact cost ratio in (C) rather than a qualitative dismissal; and
      (iii) the (E1)-(E4) forward guidance that separates what is closed from
      what is not. Filing it is what stops the same idea from being re-proposed
      with a different name, which is the recorded-closure function the brief
      asks for.

  null_object_control: >-
    MANDATORY EVEN THOUGH THE RECORD IS A CLOSURE, because the cost measurement
    in Step 3 is a real measurement with a real artifact risk. MATCHED NULL:
    r-processor parallel rho on the ORIGINAL curve, with r independent random
    starting points and r independent iteration functions -- the same shape
    (r walks, one group, pooled distinguished points), differing only in that no
    isogeny is applied. DECAY PARAMETER: r. Any apparent ensemble advantage must
    VANISH as r grows relative to the matched null, because both are the same
    algorithm; an advantage that PERSISTS or GROWS in r is the artifact tell and
    almost certainly means the ensemble arm and the null arm are not using
    equivalent iteration functions. SECOND NULL: the cross-curve collision rate
    against the same-curve rate (Step 4), which must be equal. THIRD, DERIVED,
    NULL: the forced value. Both arms are the same algorithm, so the forced
    ratio is 1.000 before any run; observing 1.000 is a passed control and NOT
    evidence, and observing anything else is a bug hunt, not a discovery. Stating
    the forced value in advance is what stops a 5% timing difference from being
    reported as a finding.

  assumptions:
    - >-
      [fact] T1 transport preserves k. Elementary; certificate-checked per
      transport.
    - >-
      [fact] Tate: every member of an F_p-isogeny class has the same #E(F_p),
      hence the same N. This is (B1) and it is the whole obstruction.
    - >-
      [fact] A homomorphism between groups of the same prime order is either
      trivial or an isomorphism. This is (B2).
    - >-
      [fact, cited] Shoup's generic-group lower bound Omega(sqrt(N))
      (KN-TECH-005), applied through the simulator of Step 2.
    - >-
      [scope] The closure covers the GROUP-SIDE ensemble only. Field-side data
      of the transported instances is explicitly outside it, and (E3) says so.
    - >-
      [scope] Toy scale for the cost measurement; the simulability argument is
      scale-free and is the part that carries the closure.

  proof_search_map:
    bottleneck: >-
      Step 2's simulator, specifically whether it correctly reproduces the JOINT
      distribution of the h instances as seen by a generic algorithm. If the
      transported instances were correlated in a way random relabelings do not
      reproduce, the simulation would fail and the closure would not hold. That
      single step is the closure, and it is why the simulator is written out
      rather than gestured at.
    baseline_embedding:
      parameter_slice: >-
        r = 1: a single transported instance. There the ensemble is one instance
        on one curve and the cost must reproduce single-thread rho at
        0.886 sqrt(N) exactly, with no discount.
      reproduction_check: >-
        Frozen regression fixture: run harness/rho.py on the original and on one
        transported instance over >= 30 seeds and confirm the mean step counts
        are statistically indistinguishable and both consistent with
        0.886 sqrt(N). A transported instance that solved faster at r = 1 would
        contradict T1 plus the group-isomorphism argument and would trigger
        GOAL-ENDO-001 pause condition P3 before anything is written down.
    observation_collision:
      observable: >-
        Total group operations to solve, as a function of r.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS BY DESIGN: the ensemble arm and the matched
        parallel-rho null produce the same observable because they are the same
        algorithm. The collision is therefore CERTAIN and it is the point -- it
        is the constructive demonstration that the ensemble is a change of
        presentation. Any experiment that found them different would be
        reporting an implementation asymmetry.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the map "transported ensemble -> abstract group-theoretic
          content". It is a single point: every ensemble over a class has the
          same content, namely one congruence mod N. Exhibiting that the fibre
          is a point IS the closure.
        predicted_gain: >-
          None, and that is the finding. The transform is applied to prove
          absence of gain rather than to find one, which is the legitimate use
          of an observable-fibre argument.
      - transform: representation_reduction
        proposed_object: >-
          Reduce "attack with h transported instances" to "attack with one
          instance plus h random relabelings" via the Step 2 simulator.
        predicted_gain: >-
          Reduces an h-curve model to the standard one-instance generic model at
          O(1) overhead per query, which is exactly what makes Shoup's bound
          apply. The gain is in CLOSURE STRENGTH.
    quantifier_order: >-
      Claimed: FORALL h, FORALL F_p-isogeny classes, FORALL ensembles of h
      transported instances, FORALL generic algorithms A using the ensemble,
      THERE EXISTS a generic algorithm A' using ONE instance with the same
      success probability and query count up to O(1) per query. The weaker
      reading that would NOT suffice: FORALL A EXISTS an h depending on A --
      letting the reduction depend on the algorithm would leave open an
      adaptive strategy. The simulator in Step 2 is uniform in A, which is what
      the audit must confirm.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The transported-instance ensemble, used as a source of GROUP ELEMENTS,
        confers no advantage over one instance and is closed at exponent 1/2."
        It can NEVER certify anything about the field-side data of those
        instances, about preprocessing transfer, about multi-target attacks with
        distinct secrets, or about the ECDLP itself.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS: an ensemble of
        instances in groups of DIFFERENT prime order -- e.g. the same secret
        reduced modulo several distinct primes, as in a Pohlig-Hellman or CRT
        setting. There the ensemble genuinely combines, the index of the witness
        lattice is the product of the moduli, and the attack works. Exhibiting
        that object is what shows the closure turns entirely on (B1) and not on
        a general prejudice against ensembles.
    proof_obligations:
      - claim: All class members have the same N (Tate).
        responsibility: baseline
      - claim: The witness-lattice index is N, not N^r.
        responsibility: strictness
      - claim: The Step 2 simulator is correct and uniform in the algorithm.
        responsibility: correctness
      - claim: Simulation cost is O(1) per query.
        responsibility: runtime
      - claim: Cross-curve collision rate equals same-curve rate.
        responsibility: soundness
      - claim: The closure does not cover field-side data.
        responsibility: scope

  predictions:
    - metric: >-
        index of the witness lattice generated by r transported instances
      direction: different
      minimum_effect: >-
        EXACTLY N for every r >= 1. Not N^r, not rN, not anything growing in r.
        This is an exact symbolic computation with no statistical content.
    - metric: >-
        total group operations to solve with an r-curve transported ensemble,
        divided by the same for r-processor parallel rho on the original curve
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.000, derived before the run because the two are the same
        algorithm. Declared in advance so that observing 1.000 is a passed
        control. A measured ratio outside [0.9, 1.1] over >= 30 seeds indicates
        an implementation asymmetry between the arms and is a bug, not a result.
    - metric: >-
        cross-curve distinguished-point collision rate versus same-curve rate
      direction: different
      minimum_effect: >-
        Statistically identical over >= 30 seeds. A cross-curve rate materially
        HIGHER would mean the isogenies correlate the walks in a way the
        simulator does not capture, which is the one observation that would open
        a gap in the closure -- and it is looked for deliberately.
    - metric: >-
        wall-clock overhead of the ensemble arm attributable to isogeny
        evaluation per step
      direction: higher
      minimum_effect: >-
        Strictly positive, and reported as the exact slowdown factor. The
        closure's quantitative content is that the ensemble is not merely
        no-better but measurably worse, by this amount.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, THE DELIVERABLE): the witness-lattice computation
      of Step 1, the simulator of Step 2 written out in full, and the (E1)-(E4)
      forward guidance. This is a complete closure and needs no compute at all.
      STAGE 1 (minutes, HARD GATE): the r = 1 baseline reproduction -- a single
      transported instance must cost the same as the original.
      STAGE 2 (~1 hour): the r-curve cost ratio against the matched
      parallel-rho null over >= 30 seeds and r in {2, 4, 8}, with the forced
      value 1.000 declared in advance.
      STAGE 3 (~1 hour): the cross-curve collision-rate control, which is the
      record's own falsifier.
      Stage 0 alone discharges the record; Stages 1-3 exist to make the
      quantitative statement in (C) an observation rather than an assertion, and
      to give the campaign a measured number for a claim it would otherwise make
      from theory alone.
    controls:
      - matched null: r-processor parallel rho on the original curve
      - forced value 1.000 declared before the run
      - r = 1 baseline reproduction against 0.886 sqrt(N)
      - cross-curve versus same-curve collision rates
      - transport certificates: Q_i = [k] P_i re-verified on every member
      - the nearby object (distinct moduli) exhibited to show the closure turns on (B1)
    required_metrics:
      - witness-lattice Hermite normal form and index for r = 1, 2, 3
      - total group operations per arm per seed, with the ratio and its interval
      - cross-curve and same-curve collision counts
      - isogeny-evaluation overhead per step, measured
      - certificate pass/fail per transported instance

  falsification_conditions:
    - >-
      The witness-lattice index exceeds N for some r. Then (B1) is wrong and the
      closure fails outright -- this is the cheapest possible falsifier and it
      is a symbolic computation.
    - >-
      The r = 1 transported instance solves measurably faster than the original.
      Contradicts T1 plus the isomorphism argument; triggers pause condition P3
      and an independent review before anything is recorded.
    - >-
      The ensemble arm's total work is materially below the matched
      parallel-rho null, reproducibly. The simulator has a gap; escalate to
      RQ-GGMB-6eaabc and to a review-breakthrough session before any record
      states the excess.
    - >-
      Cross-curve collisions occur at a higher rate than same-curve collisions.
      The isogenies correlate the walks; the closure has a gap at exactly the
      point Step 4 was designed to probe.
    - >-
      A transport certificate fails. INFRASTRUCTURE failure under AGENTS.md
      rule 5; the instance is discarded and re-derived, and no mathematical
      conclusion is drawn from it.

  confounders:
    - >-
      ITERATION-FUNCTION ASYMMETRY. If the ensemble arm's walks use a different
      partition function or a different distinguished-point criterion from the
      null arm, the comparison measures the walk design and not the ensemble.
      Both arms must use the identical walk parameters.
    - >-
      ISOGENY EVALUATION COUNTED OR NOT. Whether the isogeny cost is charged
      changes the reported ratio. It IS charged, and the uncharged ratio is
      reported separately so the two are never confused.
    - >-
      SMALL N. At toy scale the rho step count has large relative variance;
      >= 30 seeds is a floor and the interval must be reported, not the mean.
    - >-
      FRUITLESS CYCLES. Negation-based walks on different curves can have
      different cycle behaviour; if one arm uses negation and the other does
      not, the constants differ for reasons unrelated to the ensemble.
    - >-
      SELECTIVE r. Reporting the r at which the ratio looks best is forking. All
      r are declared in advance and all are reported.

  interpretation_limits:
    - >-
      This closes the GROUP-SIDE use of the isogeny class and nothing else. The
      field-side lanes -- relation yield, solving degree, factor-base geometry,
      flatness -- are explicitly untouched, and (E3) names them.
    - >-
      It does not close multi-target attacks with distinct secrets (E1) or
      preprocessing transfer (E4); both are handed to RQ-MTGT-2cabee.
    - >-
      A closure at exponent 1/2 in the generic model is a statement about
      generic algorithms. It does not assert that no non-generic attack exists;
      it asserts that this ensemble supplies no non-generic information.
    - >-
      The measured cost ratio is toy scale and its role is to confirm a derived
      forced value, not to establish anything on its own.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The number of members of an F_p-isogeny class is h = H(t^2 - 4p), the
        Kronecker class number, which is p^{1/2 + o(1)}; so "the whole class" is
        an ensemble of about p^{1/2} instances and transporting to all of them
        costs at least that many isogeny evaluations.
      rigorous_support: >-
        The class-number formula gives h ~ sqrt(|D|) up to log factors, with
        |D| = |t^2 - 4p| <= 4p; the heuristic part is only the typical size
        rather than the worst case, and it imitates the classical Siegel-type
        estimate for class numbers of imaginary quadratic orders.
      validation_plan: >-
        Exhaustive enumeration at p in {2003, 4001, 8191, 16381}: tabulate the
        empirical class sizes against sqrt(|D|) and report the distribution of
        the ratio, including its tails (the smallest and largest classes). This
        is a distribution-level check against a stated prediction. TOY SCALE,
        labelled; it does not validate the asymptotic.
      note: >-
        H1 matters for the closure only in the direction that makes it stronger:
        the more members there are, the more isogeny evaluations the ensemble
        pays for zero benefit.
    - id: H2
      statement: >-
        Rho walks on distinct transported curves behave as independent random
        functions on the abstract group of order N, so pooling their
        distinguished points gives exactly the parallel-collision-search
        behaviour of KN-TECH-006 with no correlation bonus or penalty.
      rigorous_support: >-
        The rigorous half is the simulator of Step 2, which shows the ensemble
        is generically indistinguishable from independent relabelings. The
        heuristic half is the standard random-function model that the rho
        baseline itself rests on -- so assuming it here assumes no more than the
        baseline the record is charging against, which is the honest position.
      validation_plan: >-
        Step 4's cross-curve versus same-curve collision-rate comparison over
        >= 30 seeds is precisely this validation, and a deviation is the
        record's own falsifier rather than a nuisance.

  reachability_gate: >-
    NOT APPLICABLE AS A GATE, AND THE REASON IS ITSELF THE FINDING. T5 asks
    whether a COST-MINIMISING class member is reachable. This record's ensemble
    does not seek a minimiser at all -- it seeks to use ALL members at once --
    so reachability of a specific curve is irrelevant to it. What IS relevant,
    and is recorded, is that visiting all h members costs h ~ p^{1/2} isogeny
    evaluations, which already equals the rho baseline in order of magnitude
    before any walk step is taken. So even if the ensemble had conferred an
    advantage, assembling it would have cost the baseline. That is a second,
    independent reason the direction is closed, and it is the same
    identification-cost barrier IDEA-20260807-c36472 identifies for the
    minimiser search.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED AND PROVED UNCHANGEABLE BY THIS MECHANISM in the generic
      model, via the Step 2 simulator plus Shoup (KN-TECH-005). The ensemble's
      concrete cost is 0.886 sqrt(N) group operations PLUS one isogeny
      evaluation per step PLUS h ~ p^{1/2} isogeny computations to assemble --
      i.e. strictly worse than the baseline on every term.
    memory_exponent: >-
      Same as parallel rho with distinguished points: O(1) per processor plus
      the distinguished-point table. The ensemble adds the storage of h curve
      equations, O(h log p) = O(p^{1/2} log p) bits, which is a memory INCREASE
      for no time benefit -- worth stating because a Pareto comparison must
      cover memory and this direction loses on that axis too.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory per processor with linear
      parallel speedup (KN-TECH-001, KN-TECH-006), including the negation
      discount (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031).
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic improvement is claimed. The
      overhead that IS present and must be stated: the isogeny evaluation per
      step and the h isogeny computations to assemble the ensemble, both
      concrete and both charged.
    tradeoff_note: >-
      There is no favourable tradeoff. The ensemble strictly increases memory
      (h curve equations) and strictly increases time (isogeny evaluations)
      while leaving total work at 0.886 sqrt(N). It is Pareto-dominated on both
      axes simultaneously, which is the rarest and cleanest form of domination
      and is why the record is filed as a closure.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES, AND DOMINATED ON ALL THREE
    SIMULTANEOUSLY. (i) Parallel Pollard rho with distinguished points: same
    0.886 sqrt(N) total work, O(1) memory per processor, and NO isogeny
    evaluations -- so it strictly dominates the ensemble on time and memory
    (KN-TECH-001, KN-TECH-006). (ii) The automorphism-discounted variant on CM
    curves: dominates by a further constant up to sqrt(6) (KN-TECH-018).
    (iii) BSGS: sqrt(N) time and memory, deterministic, and needs no isogeny
    (KN-TECH-031) -- dominates on data/queries since it needs only the group.
    The ensemble is dominated by (i) on every axis with no compensating
    advantage anywhere, which is the definition of a strictly dominated point.
    dominated_by is NOT null.
  sota_delta: >-
    NEGATIVE, and quantified: the transported-instance ensemble costs
    0.886 sqrt(N) group operations (identical to the baseline) PLUS one isogeny
    evaluation per step PLUS h ~ p^{1/2} isogeny computations to assemble, and
    PLUS O(p^{1/2} log p) bits to store the class. Speedup factor: exactly 1.000
    by derivation, with the isogeny overhead making the realised factor strictly
    below 1. Witness-lattice index: exactly N for every ensemble size, versus N
    for a single instance -- an information gain of exactly zero bits. This is
    the sharpest form the campaign's admissibility filter can take on a concrete
    proposal, and recording it prevents the mechanism from being re-proposed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    As a MECHANISM: under 0.02 that it confers any advantage -- the witness
    lattice computation and the simulator are both short and both decisive, and
    the direction contradicts a closure the program has already established for
    a structurally identical oracle. As a RECORDED CLOSURE it survives with
    probability ~0.95, the residual being the possibility that Step 4 finds a
    cross-curve collision anomaly that opens a gap in the simulator argument --
    which is the only outcome here that would matter, and is precisely why that
    control is included rather than omitted as obviously unnecessary. The low
    priority reflects the near-certainty of the mechanism's failure, not any
    doubt about the value of having it on the record.

