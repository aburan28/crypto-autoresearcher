idea:
  id: IDEA-20260905-55c34e
  title: An information partial order for obstruction certificates
  class: control
  claim: 'An obstruction certificate can support a negative only if its observable separates a planted positive
    from the matched null within the exact claimed scope. Conjecture: a partial order by deterministic coarsening
    identifies missing mathematical information in the campaign''s degree, rank and incidence instruments more precisely
    than a single sensitivity score.'
  mechanism: Let instrument A be a deterministic function of instrument B on a declared finite family. Then equal
    B-values force equal A-values. This elementary factorization gives an exact information ceiling without a statistical
    fit. Search for two systems with identical A but differing certified mathematical property, then identify the
    least added B-coordinate that separates them. The tracked object is an observation fiber, not a record index.
    Existing replicated findings are only candidates for later Coordinator promotion; no evidence status is changed
    and no new run is asserted.
