# IDEA-20261004-af9351
# Class-number count for discriminants -2267 and -2275. Proposal only. Not approved.
idea:
  id: IDEA-20261004-af9351
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -2267 is 11 and of discriminant -2275 is 10
  class: measurement
  claim: >-
    Discriminant -2267 has 11 reduced binary quadratic forms.
    Discriminant -2275 has 10. Eleven exceeds ten by 1. The product of
    the two class numbers is 110. Their sum is 21. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -2267 has the forms with coefficients 1, 1, 567 and
    3, -1, 189 and 3, 1, 189 and 7, -1, 81 and 7, 1, 81 and 9, -1, 63
    and 9, 1, 63 and 21, -13, 29 and 21, -1, 27 and 21, 1, 27 and
    21, 13, 29. Discriminant -2275 has the forms with coefficients
    1, 1, 569 and 5, 5, 115 and 7, 7, 83 and 13, 13, 47 and 19, -9, 31
    and 19, 9, 31 and 23, -5, 25 and 23, 5, 25 and 25, 15, 25 and
    25, 25, 29. Two copies of class number 10 have gap 0. No curve
    is enumerated.
