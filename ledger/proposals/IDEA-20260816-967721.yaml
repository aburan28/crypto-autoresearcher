idea:
  id: IDEA-20260816-967721
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: 'Treat HQC''s deployed fixed-weight sampler as an object with its own null: measure the position-index
    marginal, the gap distribution and the rejection statistics of the procedure actually specified,
    against an exact-uniform Fisher-Yates null at identical length and weight, with an exhaustive
    ground truth at sizes where every support can be enumerated'
  class: control
  claim: '(A) THE GAP THIS ADDRESSES, STATED PRECISELY. H-HQC-18d1b4 fixes its probability space using
    the UNIFORM sampler - its own text names SampleFixedWeightVect-dollar per assumption A22 - and
    every committed measurement under GOAL-HQC-001 therefore describes a pipeline fed by an idealised
    uniform draw. The deployed procedure is a different object. Whether the two agree is an empirical
    question this program has never asked, and every downstream number inherits the answer. (B) THE
    CLAIM. The sampler''s output law is measurable in its own right, independently of any code, ring
    or decoder, and it admits an EXACT ground truth: at small (n, w) the full distribution over C(n,
    w) supports can be tabulated by exhaustive counting, so ''is this sampler uniform'' has a definite
    answer rather than a statistical one. At larger (n, w) three summary statistics - the position-index
    marginal, the cyclic gap distribution between consecutive support positions, and the rejection/collision
    count profile - are computable at high precision and each has an exactly known value under uniformity.
    (C) WHY THIS IS A CONTROL AND NOT AN ATTACK. Any deviation found is a statement about a random
    number generator''s output distribution at the tested sizes. It is not a key-recovery route, it
    is not a bias with a stated exploitation cost, and no exploitation is proposed. Its value is that
    it either licenses the campaign''s idealisation or bounds the error that idealisation introduces.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no security consequence, no statement about deployed
    parameters, and no assertion whatever about what any implementation or standard contains - the
    deployed procedure is read from the transcription already committed under GOAL-HQC-001 BATCH-001,
    and if that transcription is incomplete the run reports the gap rather than guessing. A null result
    - the sampler is indistinguishable from uniform at the tested precision - is the expected outcome
    and is a first-class deliverable, because it converts assumption A22 from an idealisation into
    a measured bound. No attack, break, speedup or security consequence is claimed here or would follow
    from a run. No statement is made about what the published literature does or does not contain;
    this environment cannot reach external literature. No direction is declared impossible.'
  mechanism: 'STAGE 1, exhaustive and exact: at (n, w) with C(n, w) at most 10^6 - for instance n
    = 31, w = 4 giving 31465 supports, and n = 29, w = 5 giving 118755 - run the deployed sampler
    10^8 times, tabulate the empirical frequency of every support, and compare to the exact uniform
    frequency 1/C(n, w) by a chi-square over the full support space. This is a complete answer at
    those sizes, not a summary. STAGE 2, summary statistics at larger sizes: at n up to a few thousand,
    compare the position-index marginal (exactly w/n per index under uniformity), the cyclic gap distribution
    (a known negative-hypergeometric-type law), and the rejection/collision counts against their exact
    uniform values. STAGE 3, the null arm: an exact-uniform sampler implemented by partial Fisher-Yates,
    run through the IDENTICAL statistics in the same invocation, so that every test statistic has
    a measured null distribution rather than an asymptotic one. STAGE 4, sensitivity calibration:
    inject a deliberate, parameterised deviation of known magnitude into a third arm and measure the
    smallest deviation the battery detects at the executed sample size. Without this the null result
    of STAGE 1-3 has no meaning, because ''we found nothing'' with unmeasured sensitivity is a fatigue
    report under inventor-protocol section 4.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from /home/user/crypto-autoresearcher: `grep -ril "hqc" --include=*.yaml --include=*.md
      .` (33 proposal files match), then extracted question_id and title for every one of those 33
      with a python3/yaml one-liner; `grep -ril "quasi-cyclic" ledger/proposals/` (8 files), `grep
      -ril "cyclic shift" ledger/proposals/` (7), `grep -ril "Reed-Solomon" ledger/proposals/` (2),
      `grep -ril "outer decoder" ledger/proposals/` (0), `grep -ril "syndrome weight" ledger/proposals/`
      (0), `grep -ril "local exponent" ledger/proposals/` (0), `grep -ril "failure boosting" ledger/proposals/`
      (7), `grep -ril "mutual information" ledger/proposals/` (15), `grep -ril "rejection sampling"
      ledger/proposals/` (19), `grep -ril "weight distribution" ledger/proposals/` (10), `grep -ril
      "SampleFixedWeight" ledger/proposals/` (3), `grep -ril "hypergeometric" ledger/proposals/` (8),
      `grep -ril "autocorrelation" ledger/proposals/` (8), `grep -ril "circulant" ledger/proposals/`
      (14), `grep -ril "Toeplitz" ledger/proposals/` (4), `grep -ril "maximum likelihood decoder"
      ledger/proposals/` (0), `grep -ril "margin distribution" ledger/proposals/` (0), `grep -ril
      "tie-break" ledger/proposals/` (8), `grep -ril "soft information" ledger/proposals/` (1), `grep
      -ril "differential testing" ledger/proposals/` (2). Read in full: ledger/questions/RQ-HQC-001.yaml,
      ledger/goals/GOAL-HQC-001.yaml (first 120 lines incl. batch_checkpoints and campaign_budget),
      the statement head of ledger/hypotheses/H-HQC-18d1b4.yaml, the id/title/objective/status blocks
      of experiments/EXP-HQC-982268, EXP-HQC-bd30c0 and EXP-HQC-50ebe9 specification.yaml, the observations
      blocks of EV-HQC-b71230, EV-HQC-469c08 and EV-HQC-927899, knowledge/open-problems/KN-OPEN-3f7a21.md,
      and docs/inventor-protocol.md sections 1-8. Listed the HQC literature entries by title: KN-LIT-b9e1a8
      (Hamming Quasi-Cyclic spec), KN-LIT-1c9474 (HQC-RMRS), KN-LIT-2141, KN-LIT-4c1133, KN-LIT-5677ae,
      KN-LIT-7565, KN-LIT-de5373. Additionally read the opening of ledger/hypotheses/H-HQC-18d1b4.yaml''s
      statement field, which names the sampler explicitly as ''the UNIFORM sampler SampleFixedWeightVect-dollar
      per A22'', confirming that the idealised variant is what the committed measurements assume.'
    results: '`grep -ril "SampleFixedWeight" ledger/proposals/` returns exactly 3 files; `grep -ril
      "rejection sampling" ledger/proposals/` returns 19, spread across schemes; `grep -ril "weight
      distribution" ledger/proposals/` returns 10. The HQC records among them - IDEA-20260805-15258a,
      IDEA-20260805-db5afa, IDEA-20260808-d21021 - treat the sampler as a specified procedure whose
      output is assumed uniform and build on that assumption; none measures the sampler''s own output
      law. H-HQC-18d1b4''s statement pins the probability space to the uniform variant explicitly.
      RQ-HQC-001''s targets list names the timing/single-trace line as a separate claim class and
      mentions non-constant-time rejection sampling as a reported implementation-attack surface, but
      the campaign has run nothing on it and this proposal is about the output DISTRIBUTION, not timing.
      The nearest non-HQC analogue is IDEA-20260805-390957 (five exact identities a FrodoKEM sampling
      distribution must satisfy) and IDEA-20260805-411b60 (a mutation control with a derived magnitude),
      both under RQ-FRODO-3260cc - same genre, different scheme, different object.'
    verdict: 'UNVERIFIED. No claim is made about published literature or about any specific implementation,
      neither of which this environment can read. Claimed NEW relative to this repository: making
      the sampler''s output law the tracked object for HQC, with an exhaustive full-support-space
      ground truth at small (n, w) rather than summary statistics only, and with a sensitivity calibration
      arm that gives a null result a measured meaning. ASSEMBLED FROM KNOWN PARTS: the genre - a sampler
      audited against exact identities with a derived-magnitude mutation control - is IDEA-20260805-390957
      and IDEA-20260805-411b60''s, transferred to a different scheme and object; exhaustive enumeration
      at small sizes is the technique EXP-HQC-bd30c0 already uses for its n = 7 parity gate; the uniform-sampler
      idealisation is H-HQC-18d1b4''s A22.'
  object_first_candidate:
    tracked_object: 'The output law of the sampler: the probability measure it induces on the set
      of weight-w supports of Z_n. At small (n, w) the object is that measure in full; at larger sizes
      it is the triple (position-index marginal, cyclic gap distribution, rejection-count profile),
      which are its cheapest faithful shadows.'
    lossiness: 'TWO REGIMES, AND THEY DIFFER - which is worth stating plainly rather than blurring.
      At the exhaustive sizes NOTHING IS DISCARDED: tabulating the frequency of every support is the
      full measure, so that arm is a change of coordinates and not a lossy projection, and by inventor-protocol
      section 2 it earns no novelty credit as an object - its value is that it is an exact ground
      truth, not that it is a new lens. At the larger sizes the projection onto the three summary
      statistics IS lossy and heavily so, discarding all higher-order structure of the support; the
      discard is compatible with the target operation only in the weak sense that these statistics
      are the ones a fixed-weight law is most likely to break first, which is a heuristic and is labelled
      as one. The sensitivity calibration arm exists precisely because that heuristic could be wrong.'
    propagation: 'The target operation here is one invocation of the sampler, and the tracked object
      is its output law, so propagation is trivial by construction at the first step and the interesting
      question is the SECOND step: how a deviation of measured magnitude in the sampler''s law propagates
      into the pipeline downstream. That is answered by a small forward-propagation arm: feed the
      deployed sampler and the exact-uniform sampler into the identical decoding pipeline and measure
      the induced difference in the per-block failure rate and in log2 A-hat_2. A sampler deviation
      that does not move either is a deviation that the campaign''s measurements are insensitive to,
      which is exactly the licensing statement the campaign needs.'
    survival_score: One step by construction, two with the forward-propagation arm, and the second
      is where it matters. The concrete survival score is the ratio (measured shift in log2 A-hat_2
      between sampler arms) divided by (measured deviation of the sampler from uniformity), i.e. a
      transfer coefficient. If that coefficient is indistinguishable from zero at the executed precision,
      the sampler's law dissolves before reaching any measured quantity and A22 is licensed within
      a stated bound - which is the most likely and most useful outcome.
  null_object_control: 'The null object is an exact-uniform sampler: partial Fisher-Yates over the
    index array, whose output law is provably uniform on weight-w supports, implemented independently
    of the deployed procedure and run through the IDENTICAL statistics and the identical downstream
    pipeline in the same invocation. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) at
    the exhaustive sizes, a chi-square over the full support space consistent with its degrees of
    freedom - a null arm that itself fails uniformity means the test statistic or the enumeration
    is wrong and no signal-arm verdict is admissible; (ii) position-index marginals matching w/n and
    gap distributions matching their exact law to within Monte-Carlo error; and (iii) in the sensitivity
    arm, a deliberately biased sampler must be DETECTED at a measured magnitude, establishing the
    battery''s detection floor so that agreement between deployed and uniform arms is reportable as
    a bound rather than as an absence.'
  discriminated_from:
  - IDEA-20260805-390957 derives five exact identities a FrodoKEM sampling distribution must satisfy
    and uses them to discriminate a damaged table extraction. That is a different scheme, a different
    sampler family (a fixed discrete table versus a fixed-weight support draw), and its object is
    a published table rather than a procedure's output law.
  - IDEA-20260805-411b60 predicts, before running, how many bits a FrodoKEM DFR must move when one
    table entry is perturbed. This proposal borrows that genre - a mutation control with a derived
    magnitude - and applies it as the sensitivity arm, which is why 411b60 is named here rather than
    silently reused.
  - H-HQC-18d1b4 and EXP-HQC-982268 assume the uniform sampler as their probability space (A22) and
    measure downstream joint moments. This measures the assumption itself; the two are strictly complementary
    and the forward-propagation arm is what connects them.
  - RQ-HQC-001 names a reported timing / non-constant-time rejection-sampling implementation-attack
    line as a separate claim class. This proposal measures an output DISTRIBUTION and records no timing
    whatsoever, so it neither enters nor supports that claim class.
  - A generic randomness-quality test suite would test the underlying PRNG. This tests the sampler's
    induced law on a structured space, holding the PRNG fixed and shared between arms so PRNG quality
    cancels.
  assumptions:
  - The deployed procedure can be reconstructed faithfully from the transcription committed under
    GOAL-HQC-001 BATCH-001; if the transcription is incomplete for the sampler, the run reports the
    gap and does not guess, and that report is itself the deliverable.
  - Partial Fisher-Yates over an index array gives an exactly uniform law on weight-w supports; this
    is elementary and is additionally checked empirically by the null arm's own chi-square.
  - C(n, w) at most 10^6 is exhaustively tabulable at 10^8 samples with roughly 100 expected hits
    per support, enough for a chi-square with C(n, w) - 1 degrees of freedom.
  - The PRNG is shared and seeded identically across arms so that PRNG artefacts cancel in the arm
    difference rather than appearing as sampler deviations.
  - No conclusion transfers to deployed parameter sizes without a numbered heuristic; none is offered.
  predictions:
  - metric: chi-square over the full support space, deployed sampler versus exact uniform, at (n,
      w) = (29, 5)
    direction: different
    minimum_effect: 'no pre-commitment to a magnitude, with reason: predicting a specific deviation
      would be asserting something about an implementation this environment has not executed. What
      IS pre-committed is that the reported verdict is the measured detection floor from the sensitivity
      arm, so a null result carries a number.'
  - metric: maximum absolute deviation of the position-index marginal from w/n, deployed arm minus
      uniform arm
    direction: different
    minimum_effect: 0.0
  - metric: 'transfer coefficient: shift in log2 A-hat_2 per unit of measured sampler deviation'
    direction: lower
    minimum_effect: no pre-commitment; this is the quantity the forward-propagation arm exists to
      produce for the first time.
  - metric: smallest injected bias magnitude detected by the battery at 10^8 samples (sensitivity
      arm)
    direction: lower
    minimum_effect: 0.001
  minimal_test:
    design: 'The exhaustive arm alone discriminates and is cheap. Fix (n, w) = (29, 5), C(29,5) =
      118755. Run the deployed sampler 10^8 times and the exact-uniform Fisher-Yates sampler 10^8
      times off the same PRNG stream, in one invocation, tabulating the frequency of every support
      in both. Compute a chi-square against 1/C(n, w) for each arm and the two-sample chi-square between
      arms. Then run the sensitivity arm: a sampler with a parameterised index bias at three magnitudes,
      and report the smallest magnitude the battery separates from uniform. This discriminates because
      at these sizes the full law is observable, so no summary statistic can hide a deviation, and
      because the sensitivity arm converts a null verdict into a bound. Cost: minutes to an hour of
      single-core CPU and about a megabyte of counters.'
    controls:
    - Exact-uniform Fisher-Yates null arm on the same PRNG stream, same invocation, same statistics.
    - 'Self-consistency of the null arm: its own chi-square must be consistent with its degrees of
      freedom, or the test is void.'
    - Sensitivity arm with parameterised injected bias at three magnitudes, giving a measured detection
      floor.
    - Shared PRNG across arms so generator artefacts cancel in the arm difference.
    - 'Forward-propagation arm: both samplers through the identical decoding pipeline, reporting the
      induced shift in per-block failure rate and log2 A-hat_2.'
    required_metrics:
    - full-support-space frequency table and chi-square per arm at exhaustive sizes
    - two-sample chi-square between deployed and uniform arms
    - position-index marginal maximum deviation per arm
    - cyclic gap distribution and its deviation from the exact law per arm
    - rejection/collision count profile per arm
    - measured detection floor from the sensitivity arm
    - transfer coefficient from the forward-propagation arm
  falsification_conditions:
  - 'Deployed and uniform arms are indistinguishable at every statistic: A22 is licensed within the
    measured detection floor, and that floor with its error bars is the recorded obstruction.'
  - 'The null arm''s own chi-square is inconsistent with its degrees of freedom: the test or the enumeration
    is wrong and no verdict is admissible.'
  - 'The sensitivity arm fails to detect even the largest injected bias: the battery has no demonstrated
    power and reports none.'
  - 'The transcription of the deployed sampler is incomplete: the run reports the gap and produces
    no verdict on the deployed procedure.'
  - 'A deviation is measured but the transfer coefficient is indistinguishable from zero: the deviation
    does not reach any quantity the campaign measures, and the licensing statement holds anyway -
    which must be reported as such rather than as a finding.'
  confounders:
  - PRNG quality masquerading as sampler bias; controlled by sharing the stream across arms so it
    cancels in the difference.
  - Multiple-testing inflation across a large number of statistics and support cells; controlled by
    pre-declaring the battery and reporting family-wise adjusted values.
  - Small-cell chi-square invalidity if the expected count per support is too low; controlled by the
    10^8-sample budget and by reporting the minimum expected cell count.
  - Deviations that exist only at parameter sizes far from the exhaustive regime, which this design
    cannot see and must not claim to exclude.
  - Incompleteness of the committed transcription of the deployed procedure, which would make the
    signal arm a measurement of a reconstruction rather than of the procedure.
  interpretation_limits:
  - Any measured deviation is a statement about an output distribution at the tested sizes and is
    not an attack, a bias with an exploitation cost, or a security consequence.
  - A null verdict is bounded by the measured detection floor and says nothing below it.
  - No timing, no side channel and no implementation behaviour beyond the output distribution is measured,
    so nothing here touches the timing claim class RQ-HQC-001 keeps separate.
  - Results at exhaustive sizes do not extrapolate to deployed sizes; the summary-statistic arm is
    the only bridge and it is explicitly lossy.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs O(SAMPLES * w) sampler operations
      plus O(C(n,w)) for the tabulation, both trivial at the declared sizes.
    memory_exponent: No attack memory exponent is claimed. Storage is one counter per support, at
      most 10^6 counters, i.e. a few megabytes.
    best_known: There is no incumbent measurement of any sampler's output law in this repository.
      The nearest committed statement is H-HQC-18d1b4's A22, which ASSUMES uniformity rather than
      measuring it, so this proposal measures an assumption that currently has no measured status
      at all.
    hidden_overhead: 'The hidden cost is fidelity of reconstruction: the whole signal arm is only
      as good as the transcription of the deployed procedure, and verifying that the reconstruction
      is faithful is human reading work whose difficulty is invisible in the compute budget. A second
      is multiple testing - a battery over 10^5 support cells will produce extreme cells by chance,
      and reporting them responsibly requires the family-wise adjustment to be fixed before the data
      exists.'
  dominated_by: n/a (no result claimed). No attack cost triple exists, so no Pareto frontier row applies
    and 'null' would be a fabrication. On the measurement axis the closest genre neighbours are IDEA-20260805-390957
    and IDEA-20260805-411b60, both unexecuted proposals against a different scheme, so neither dominates
    nor is dominated.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: assumption A22
    currently has no measured support and no measured error bound anywhere in this repository; this
    run produces a detection floor and, if a deviation exists, its magnitude and its transfer coefficient
    - three numbers where there are presently zero.'
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (i) That the exhaustive arm runs cleanly and its null arm passes
    its own chi-square: ~0.9. (ii) That the sensitivity arm yields a finite, small detection floor:
    ~0.85. (iii) That the deployed sampler shows a measurable deviation from uniform at these sizes:
    ~0.2 - my honest expectation is that it does not, and the value of the run is the bound, not the
    discovery. (iv) That the transfer coefficient, if a deviation exists, is large enough to move
    any committed measured quantity: ~0.1. (v) That the run delivers a defensible licensing bound
    on A22 either way: ~0.9. The proposal is worth running because of (v), and anyone who prices it
    on (iii) is pricing it wrong.'
