idea:
  id: IDEA-20260816-6536d7
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: The inner Reed-Muller decoder scores every codeword, so the block failure event is the sign
    of a continuous margin - best correlation minus runner-up; measure that margin's distribution
    and use it as a variance-reduced failure-rate estimator, validated against direct counting in
    the regime where both are affordable and refused outside it
  class: tooling
  claim: (A) THE OBJECT. Maximum-likelihood decoding of an inner Reed-Muller block computes a correlation
    for every codeword. Define the margin M_j := (correlation of the transmitted codeword) minus (maximum
    correlation over all other codewords). Then F_j = 1{M_j < 0} exactly, with the deployed deterministic
    rule resolving M_j = 0. The block failure event is not a primitive - it is the sign of a continuous
    scalar that the decoder already computes and then throws away. (B) THE INSTRUMENT CLAIM. Because
    the failure event is a sign, its probability can be estimated from the MARGIN DISTRIBUTION rather
    than from failure counts, and margin-based estimation uses every trial rather than only the failing
    ones. The claim is that this yields a measured variance reduction at fixed trial count, quantified
    as the ratio of trials needed for equal relative standard error, and that the reduction grows
    as the failure rate falls - which is exactly the regime where GOAL-HQC-001's measurements are
    most expensive. (C) THE VALIDITY GATE THAT MAKES IT USABLE. A variance-reduced estimator is worthless
    without a demonstration that it is unbiased. The design therefore requires the margin estimator
    to reproduce the DIRECTLY COUNTED failure rate, within confidence intervals, at every parameter
    where direct counting is affordable, and it REFUSES to report an extrapolated value outside that
    regime unless the extrapolation is stated as a numbered heuristic with its fitted tail model named.
    Any tail fit is a heuristic and is labelled as one everywhere it appears. (D) WHAT IS NOT CLAIMED.
    No attack, no break, no security consequence. It is NOT claimed that this estimator can reach
    deployed-parameter failure rates - the honest expectation is that it moves the affordable frontier
    by a few orders of magnitude and no further, and a few orders of magnitude is not the distance
    to a deployed DFR. It is not claimed that the fitted tail is correct; a tail fit that is validated
    only inside the countable regime is evidence about that regime alone. No attack, break, speedup
    or security consequence is claimed here or would follow from a run. No statement is made about
    what the published literature does or does not contain; this environment cannot reach external
    literature. No direction is declared impossible.
  mechanism: 'STAGE 1: instrument the existing decoder to emit M_j per block at no extra asymptotic
    cost, since the correlations are already computed by the fast Walsh-Hadamard transform and the
    margin is a second max over an array the decoder already materialises. STAGE 2: at a parameter
    set with a per-block failure rate near 1e-2, estimate the rate three ways in one invocation -
    direct counting, the empirical margin CDF at zero, and a fitted parametric tail of the margin
    distribution - and compare all three against each other with intervals. Agreement of the first
    two is a consistency requirement, since the empirical CDF at zero IS the direct count; the point
    of including it is to catch instrumentation errors. STAGE 3: walk the parameter ladder downward
    so the failure rate falls to 1e-3, 1e-4, 1e-5, and at each rung record the trial count each method
    needs for a fixed relative standard error. The variance-reduction ratio as a function of rate
    is the deliverable. STAGE 4: the null and the analytic control. Run the identical instrument on
    an i.i.d. Bernoulli(p*) channel feeding the same Reed-Muller decoder, where the margin distribution
    is a sum of independent contributions and its shape can be computed directly, and check that the
    fitted tail recovers the computed one. A tail fit that cannot recover a known answer must not
    be trusted on an unknown one. Refutation: if the fitted tail fails the analytic control, or if
    the variance-reduction ratio is near 1, the instrument does not earn its complexity and the measured
    ratio is the recorded obstruction.'
  novelty_status: unverified
