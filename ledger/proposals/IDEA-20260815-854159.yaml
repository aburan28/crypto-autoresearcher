idea:
  id: IDEA-20260815-854159
  question_id: RQ-SSIQ-9702af
  added: '2026-08-15'
  title: >-
    WHICH OF THE THREE EXPONENT-CARRYING FACTORS IN THE p^(1/3) ALGORITHM IS
    ACTUALLY BINDING? Re-derive the exponent with each factor idealised in
    turn, so the campaign attacks the one that moves it rather than the one
    that is easiest to study
  class: cost-model

  claim: >-
    Wesolowski's p^(1/3+o(1)) cost is a product of table size, per-attempt
    runtime, and inverse success probability. GOAL-SSIQ-001 asks which
    factor could be pushed toward p^(1/4). The campaign cannot answer that
    without knowing which factor binds. Idealise each in turn to its best
    conceivable value, holding the others, and recompute the exponent; the
    factor whose idealisation moves the exponent most is the only one worth
    attacking.

  mechanism: >-
    Instantiate the exponent arithmetic symbolically from Lemmas 3.2-3.5.
    Idealise table size, then runtime, then success probability, each to its
    information-theoretic best. Report the resulting exponent per
    idealisation and rank the three.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-SSIQ-001 objective and inputs/P13-WESOLOWSKI-2026
      exponent assembly; grep for 'binding factor', 'sensitivity',
      'idealise'.
    results: >-
      The exponent assembly is recorded; no record performs a per-factor
      idealisation to rank which is binding.
    verdict: >-
      ADAPTATION. Sensitivity analysis of a published complexity assembly;
      nothing mathematical is new.

  object_first_candidate:
    tracked_object: >-
      THE EXPONENT AS A FUNCTION OF ITS THREE FACTORS, rather than as a
      single number.
    lossiness: >-
      Idealising a factor discards its real behaviour in one direction
      only, making a negative conclusive and a positive uninformative.
    propagation: >-
      Not applicable.
    survival_score: >-
      Survives while the exponent assembly is symbolic and each factor has
      a defensible best value.

  null_object_control: >-
    NULL 1 -- reproduce the published p^(1/3) exponent with all factors at
    their stated values; failure means the assembly is misread. NULL 2 --
    idealise all three simultaneously, giving the floor any variant of this
    algorithm could reach.

  discriminated_from:
    - >-
        GOAL-P13-001's assessment. THAT ASSESSED the result as published;
        this asks which factor a successor could move.
    - >-
        IDEA-20260726-008 (sqrt-elu charging re-audit). DIFFERENT TERM:
        that re-audits isogeny evaluation charging; this ranks the three
        exponent factors.

  assumptions:
    - >-
        The exponent assembly is faithfully reproducible from the frozen
        full text.
    - >-
        Each factor has a defensible information-theoretic best; where
        not, it is marked unbounded rather than guessed.

  predictions:
    - metric: >-
        reproduction of the published exponent
      direction: different
      minimum_effect: >-
        FORCED to match p^(1/3+o(1)); failure blocks the record.
    - metric: >-
        exponent under each single idealisation
      direction: lower
      minimum_effect: >-
        Ranks the factors; the largest movement identifies the binding
        one.
    - metric: >-
        exponent under simultaneous idealisation
      direction: lower
      minimum_effect: >-
        Gives the floor for this algorithm family; if that floor exceeds
        1/4, the goal's target is unreachable by this route.

  minimal_test:
    design: >-
      Symbolic only, no compute. Reproduce, idealise, rank.
    controls:
      - >-
          Published-value reproduction.
      - >-
          All-idealised floor.
      - >-
          Unbounded factors listed, not guessed.
    required_metrics:
      - >-
          Exponent per idealisation.
      - >-
          Ranking of the three factors.
      - >-
          The all-idealised floor.

  falsification_conditions:
    - >-
        Published exponent not reproduced. Assembly misread; halt.
    - >-
        The all-idealised floor exceeds 1/4. The goal's target is
        unreachable within this algorithm family, which is a decisive
        scoped negative.
    - >-
        All three factors move the exponent equally. No binding factor;
        the campaign has no cheap prioritisation and must say so.

  confounders:
    - >-
        o(1) HANDLING: the exponent hides superpolynomial overhead per the
        paper's own disclosure, and idealising factors can silently change
        what the o(1) absorbs.
    - >-
        IDEALISATION REALISM: an information-theoretic best that no
        algorithm could approach makes a factor look binding when it is
        not.

  interpretation_limits:
    - >-
        Symbolic sensitivity; establishes no algorithm and no new bound.
    - >-
        A floor above 1/4 closes this algorithm family only, not the
        p^(1/4) question.

  heuristic_assumptions:
    - id: HEUR-SSIQ-FACT-1
      statement: >-
        The three exponent factors are independently improvable, so
        idealising one while holding the others fixed is meaningful.
      rigorous_support: >-
        The rigorous ingredient is the paper's single-responsibility
        lemma decomposition, in which table size, runtime and success
        probability are proved separately. THE GAP: the lemmas share the
        parameters B and X, so idealising one factor changes the
        parameter choice that the others depend on, and true
        independence does not hold.
      falsification_condition: >-
        An idealisation that forces a parameter choice contradicting
        another factor's stated bound.
      validation_plan: >-
        SAMPLE: all three single idealisations plus pairwise.
        COMPARISON: parameter consistency checked per idealisation. TAIL
        CHECK: idealisations requiring extreme B or X, flagged as
        unrealisable. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic re-derivation only.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the published p^(1/3+o(1)) result itself,
      reproduced and not improved.
    hidden_overhead: >-
      The paper discloses that o(1) hides superpolynomial overhead larger
      than the previous polylog cofactor; any idealisation that ignores
      this overstates the achievable gain.
    tradeoff_note: >-
      Idealisation buys a cheap ranking and forfeits realism; the record
      is decisive only when the floor is above the target.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    frontier row applies. As a complexity result: entirely dominated by the
    published paper, which is the source. As a sensitivity analysis: none
    exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent claim. Content delivered: a ranking of which
    exponent factor binds, and a floor for the whole algorithm family that
    may show p^(1/4) is unreachable by this route -- both obtainable before
    any compute.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the published exponent reproduces. 0.6 that the factors are
    separable enough for the ranking to be meaningful given HEUR-SSIQ-
    FACT-1's named coupling gap. 0.4 that the all-idealised floor exceeds
    1/4, which would be a decisive and cheap scoped negative for the goal.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
