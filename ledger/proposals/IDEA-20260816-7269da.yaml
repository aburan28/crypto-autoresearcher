idea:
  id: IDEA-20260816-7269da
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: 'Measure one folding step of a low-degree test as a counted object: over a toy Reed-Solomon
    domain small enough to enumerate every function at a fixed distance, count how often a delta-far
    function folds to something strictly closer, and report the distance-preservation rate against
    the term the folding accounting charges'
  class: measurement
  claim: '(A) A folding-based low-degree test reduces a claim about a function on a domain of size
    N to a claim about a folded function on a domain of size N over two, and the soundness accounting
    charges a per-fold term for the possibility that a function far from the code folds to a function
    that is closer to the smaller code. That term is where the layered soundness of the whole test
    comes from, and it is normally reasoned about rather than counted. (B) At a toy Reed-Solomon instance
    with a small evaluation domain and a small rate, the space of functions at a fixed Hamming distance
    from the code is enumerable, or exactly samplable with a stated construction, so the fold can
    be applied to every one of them and the resulting distance to the smaller code computed exactly
    by nearest-codeword search. The deliverable is the measured distribution of the distance change
    under one folding step, at named (domain size, rate, folding challenge), and specifically the
    measured probability, over the folding challenge, that a delta-far input folds to a strictly closer
    output, reported as a number and compared against the per-fold term the accounting uses. (C) The
    measurement is per-challenge exhaustive: for each input function the fold is applied at every
    possible folding challenge in the field, so the reported probability is over the complete challenge
    set and not a sample, and the worst-case input over the enumerated family is reported alongside
    the average. (D) NOT CLAIMED: no attack on any low-degree test, no claim that any folding accounting
    is wrong or tight beyond the tested parameters, no claim about any proximity conjecture, no claim
    about any deployed, third-party or standardized proof system, none of which is examined; and no
    security consequence, since a per-fold rate measured on a toy domain does not compose into any
    statement about a full test at any real parameters.'
  mechanism: 'STAGE A: fix the code. Reed-Solomon over F_p evaluated on a multiplicative subgroup
    of size N with N a power of two dividing p minus one, message length k, rate k over N. STAGE B:
    fix the fold. Split the domain by the two-to-one squaring map, write each function as an even
    and an odd part in the standard way, and fold with challenge z into a function on the size N over
    two domain. STAGE C: build the input family. Start from codewords and corrupt exactly e positions
    with values chosen from a declared set, giving functions at Hamming distance exactly e; enumerate
    all position patterns when the binomial count is affordable and a structured plus random family
    otherwise, with the restriction labelled. STAGE D: apply the fold at every challenge z in F_p
    and compute, for each folded function, its exact distance to the smaller code by nearest-codeword
    search, which at these sizes is done by exhaustive interpolation over subsets or by syndrome decoding
    depending on e. STAGE E: form the counted quantities: the fraction of challenges at which the
    relative distance strictly decreases, the mean distance change, and the worst case over the input
    family. STAGE F: compare against the accounting term and report the ratio. STAGE G: run the null
    arm, uniformly random functions on the same domain rather than deliberately corrupted codewords,
    through the identical fold and the identical decoder.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for proximity gap, folding, low-degree
      test, FRI, Merkle and Schwartz-Zippel. Read the titles of all thirteen RQ-WFS-e776b6 proposals
      from a PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml, whose third
      target names the grinding curve for a FRI-like protocol and whose fourth names the conjecture
      surface. Checked the class and question id of the closest RQ-WFS record, IDEA-20260809-7ca867.
    results: The string proximity gap returned ZERO hits across ledger/proposals/ and ledger/hypotheses/.
      The string folding hits IDEA-20260807-61049d, IDEA-20260805-d426f9, IDEA-20260813-a46301 and
      IDEA-20260816-e5c333, none on RQ-WFS and, from their ids, belonging to isogeny and lattice lanes
      where folding means something else. The string low-degree test hits exactly one proposal, IDEA-20260809-7ca867,
      which measures a grinding curve for a reference low-degree-test protocol against a quoted bit
      level. FRI hits IDEA-20260815-0676d4, IDEA-20260807-464ff8, IDEA-20260731-008 and IDEA-20260807-653dda,
      none of which is on RQ-WFS and which concern pairings, isogenies and other lanes.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; folding-based low-degree
      tests and their per-fold soundness terms are standard and are treated here as known, and the
      existence of a conjecture surface is already named in the question record itself. What is claimed
      new is only internal: no record here counts distance change under a single folding step over
      a complete challenge set with an exact nearest-codeword decoder. The parts assembled, Reed-Solomon
      codes, the even-odd fold, and exhaustive decoding, are all known.'
  object_first_candidate:
    tracked_object: 'The distance profile of a function under folding: the vector, indexed by folding
      challenge z in F_p, of the exact Hamming distance from the folded function to the smaller Reed-Solomon
      code. One input function yields one such vector, and every reported quantity is a functional
      of it.'
    lossiness: 'Genuinely lossy. The full state is the function itself, N field values, of which there
      are p to the N; the distance profile keeps only p integers in the range zero to N over two,
      collapsing every function with the same profile into one object and discarding entirely which
      positions are corrupted and by how much. The discard is compatible with the target operation
      because the next round of the test sees the folded function only through its proximity to the
      smaller code, so any feature of the input that does not change that proximity cannot change
      the test''s future behaviour. The retained profile propagates deterministically: folding again
      acts on the profile by re-indexing over the next challenge, which is how the layered accounting
      composes.'
    propagation: One step of the target operation is one folding round. On the tracked object it acts
      by mapping a function at distance e on a domain of size N to a distribution over distances on
      a domain of size N over two, indexed by the challenge. The accounting assumes this map does
      not decrease relative distance except with small probability; the measured profile says exactly
      how often it does, at these parameters. Iterating the fold composes the profiles, and the layered
      soundness term is the product of the per-layer survival probabilities, so a measured per-fold
      number is the input to any layered statement, which this record supplies without making the
      layered statement itself.
    survival_score: 'The object survives while exact nearest-codeword decoding is affordable, which
      holds for N up to 64 with distance e up to about 8 by exhaustive subset interpolation, and further
      with syndrome decoding at the cost of more implementation. It survives every challenge because
      the challenge set is enumerated. It dissolves at two named boundaries: when N grows past the
      point where exact decoding is affordable, at which point the distance becomes a bound from a
      list decoder and the profile becomes approximate; and when the input family stops being enumerable,
      at which point the worst case becomes a lower bound over a sampled family rather than an attained
      maximum, which is labelled wherever it applies.'
  null_object_control: 'NULL OBJECT: uniformly random functions on the same domain, drawn from a declared
    seed rather than constructed as corrupted codewords, pushed through the identical fold at every
    challenge and the identical exact decoder in the same invocation. A uniformly random function
    is at large distance from the code with overwhelming probability, so the null must show a distance
    profile concentrated near the maximum with essentially no challenges at which the folded function
    is close to the smaller code. For the signal arm to mean anything the null must show a strictly
    smaller strict-decrease rate than the corrupted-codeword arm; if the two agree, the measurement
    is reading generic distance geometry rather than any property of near-codeword structure, and
    the record closes as a controlled null. A second null is a genuine codeword, at distance exactly
    zero, which must fold to a codeword at every challenge, giving distance zero at every z and confirming
    the decoder and the fold agree.'
  discriminated_from:
  - IDEA-20260809-7ca867 measures a grinding curve for a reference low-degree-test protocol against
    a quoted bit level. Grinding is an adversary budget spent retrying the challenge derivation; this
    record spends no budget and counts what one honest uniform folding challenge does to distance.
  - IDEA-20260816-f05ef2 counts how many distinct challenges a grinding budget buys. Here the entire
    challenge set is used, exhaustively, with no budget notion at all.
  - The batching record in this set, whose object is a root set of a univariate error polynomial.
    Here the object is a distance profile over a code, the operation is folding rather than linear
    combination, and the measured quantity is a Hamming distance rather than a vanishing event.
  - The AIR quotient record in this set, whose object is a failure locus of an identity check on a
    trace. That measures a single algebraic identity; this measures proximity to a code under a domain-halving
    map, and neither reduces to the other.
  - Any statement about proximity conjectures, which concern the soundness of testing at distances
    beyond a decoding radius. This record makes no conjecture and tests only distances where exact
    decoding is affordable, which is explicitly the easy regime.
  assumptions:
  - The evaluation domain is a multiplicative subgroup of size a power of two dividing p minus one,
    so the two-to-one squaring map and the even-odd decomposition are exact.
  - Exact nearest-codeword decoding is affordable at the named N and e; where it is not, the reported
    distance is from a named list decoder and the corresponding cells are labelled as bounds.
  - The corrupted-codeword family, comprising enumerated position patterns with values from a declared
    set, is representative of near-codeword inputs at distance e; where the enumeration is truncated
    the worst case is a lower bound and is labelled so.
  - Folding challenges are drawn uniformly from the full field, so this record measures the fold and
    not the sampler; sampler non-uniformity is the object of a sibling record in this set.
  - Exact integer and field arithmetic throughout, with distances counted as integers and rates as
    exact rationals.
  predictions:
  - metric: fraction of folding challenges at which a distance-e input folds strictly closer in relative
      distance
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a number: the whole reason to run this is that
      the per-fold term is normally reasoned about rather than counted at these parameters, and pre-committing
      a value would invent the answer; the pre-registered structure is only that the rate is non-increasing
      in e'
  - metric: codeword null distance profile
    direction: different
    minimum_effect: 'forced value: exactly zero at every challenge; anything else voids the decoder
      or the fold'
  - metric: strict-decrease rate of the corrupted-codeword arm relative to the uniformly random null
    direction: higher
    minimum_effect: 2.0
  - metric: worst-case strict-decrease rate over the enumerated family as a function of code rate
    direction: higher
    minimum_effect: 'forced structure: monotone non-decreasing in rate, since a larger code makes
      closeness easier; a non-monotone measurement indicates a decoder fault'
  minimal_test:
    design: 'One script, hours at most. Take p equal to 65537, evaluation domain the subgroup of size
      N equal to 32, message length k equal to 4 giving rate one eighth, and folded code of length
      16 with message length 2. Build the input family at distance e in {1, 2, 3, 4}: enumerate all
      position subsets of that size, which is at most 35960 patterns, each with 8 declared corruption
      values, capped at 65536 functions per e. For each input apply the fold at every one of the 65537
      challenges and decode the folded function exactly by interpolating over every subset of 2 positions
      and taking the minimum distance, which is 120 interpolations per decode and is the cost driver.
      Record the distance profile, the strict-decrease fraction, and the worst case. Run the codeword
      null and the uniformly random null through the identical pipeline in the same invocation. The
      discriminating output is one number per e: the maximum over the family of the fraction of challenges
      that fold strictly closer. If that number is at the random-function level for every e, the measured
      obstruction is that corrupted-codeword structure is invisible to a single fold at these parameters,
      which is a usable result.'
    controls:
    - Codeword null at distance zero, required to fold to a codeword at every challenge.
    - Uniformly random function null through the identical fold and decoder in the same invocation.
    - Degenerate control at rate one, where every function is a codeword and every distance must be
      zero.
    - 'Decoder self-check: re-encode the decoded message and confirm the reported distance equals
      the actual Hamming distance to the re-encoding.'
    - Two code rates and two domain sizes so the measured rate is not a coincidence of one parameter
      pair.
    - Seed replay of the random null reproducing its profile histogram exactly.
    required_metrics:
    - exact distance profile per input function over all challenges
    - fraction of challenges at which relative distance strictly decreases, per input
    - maximum of that fraction over the enumerated family, per (N, rate, e)
    - mean relative distance change under folding, per (N, rate, e)
    - codeword null profile
    - uniformly random null strict-decrease fraction distribution
    - number of input functions enumerated and decoder wall time
  falsification_conditions:
  - The codeword null does not fold to distance zero at every challenge.
  - The decoder self-check fails on any decode.
  - The corrupted-codeword arm and the uniformly random null show indistinguishable strict-decrease
    rates, closing the record as a controlled null with the geometry named.
  - The worst-case strict-decrease rate is zero at every e and every parameter pair, falsifying the
    premise that a single fold can bring a far input closer at these parameters and closing with that
    obstruction and the distances that would need to be tested to reopen it.
  - The measured rate is non-monotone in the code rate, indicating a decoder fault rather than a finding.
  - Replay from the declared seed does not reproduce the null histogram.
  confounders:
  - 'Relative versus absolute distance: the domain halves under folding, so an unchanged absolute
    distance is an increased relative distance, and conflating the two would invert the sign of the
    headline number.'
  - Truncating the input family converts an attained worst case into a lower bound, which reads as
    a smaller effect if not labelled.
  - Corruption values drawn from a small declared set may all lie in a subgroup, correlating the induced
    folded functions.
  - Exact decoding is only affordable at small e; using a list decoder at larger e changes the meaning
    of distance and must not be mixed into the same column.
  - A tiny folded code, message length 2, has so few codewords that closeness is common by chance,
    which inflates the strict-decrease rate for reasons unrelated to folding.
  interpretation_limits:
  - Every number is scoped to the named p, domain size, rate, distance range and corruption family;
    nothing about a full multi-layer test or about cryptographic parameters follows.
  - A per-fold rate is an input to a layered accounting but is not itself a statement about the layered
    soundness of any test, and this record does not compose it.
  - Distances tested are inside the exact-decoding regime, which is explicitly the regime where proximity
    questions are easiest; nothing about larger distances is measured or implied.
  - No statement about any deployed, third-party or standardized proof system, and no statement about
    any proximity conjecture, follows from any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(|family| times p times decode cost) field
      operations, about 2 to the 36 at the named parameters before optimisation, which the stopping
      rule bounds by truncating the family.
    memory_exponent: No attack memory exponent is claimed. Memory is O(p) for one profile plus O(N)
      per function; profiles are summarised and not all retained.
    best_known: The incumbent is the standard per-fold soundness accounting for folding-based low-degree
      tests, in which the distance-preservation term is bounded rather than counted. This record does
      not beat it; it produces a counted value at toy parameters inside the exact-decoding regime.
    hidden_overhead: The decoder dominates wall time and contributes no headline number, and the relative-versus-absolute
      distance convention is the single easiest place to invert the result. The human cost lies in
      choosing a folded code large enough that closeness is not common by chance while small enough
      that exact decoding remains affordable, which is a narrow window.
  dominated_by: n/a (no result claimed). No solve, forgery or cost improvement is proposed, so no
    time, memory or query frontier row exists to compare; asserting null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a counted per-fold
    distance-preservation rate at named toy parameters, with no cost comparison to any algorithm.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the fold, the exact decoder and the complete challenge enumeration
    run correctly at the named parameters: about 0.7, with the decoder being the main implementation
    risk and the cost driver. Part B, that the corrupted-codeword arm separates measurably from the
    uniformly random null: about 0.55, since at a folded message length of 2 the code is so small
    that chance closeness may swamp structure. Part C, that the measured per-fold rate is close enough
    to the accounting term to be informative about tightness: about 0.2, and this is the part I expect
    to disappoint, because the toy window where exact decoding is affordable is also the window where
    the code is too small for the accounting to be meaningful. Part D, that the resulting decoder
    and fold instrument are reusable by other records in this question: about 0.6.'
