# IDEA-20261003-6cb4c0
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-6cb4c0
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 13 has degree 169 and multiplication by 12 has degree 144
  class: measurement
  claim: >-
    Multiplication by 13 has degree 169. Multiplication by 12 has
    degree 144. One hundred sixty-nine exceeds one hundred forty-four
    by 25. The product of the two degrees is 24336. Their sum is 313.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 144 and 121.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Thirteen squared is 169. Twelve squared is 144. Two maps of
    degree 144 have gap 0 and product 20736. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 13 and 12 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 25.
    baseline_embedding:
      parameter_slice: The degrees 169 and 144.
      reproduction_check: >-
        Two readers must agree that 13 squared is 169 and that 12
        squared is 144.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 144 drops the gap. Two maps of
