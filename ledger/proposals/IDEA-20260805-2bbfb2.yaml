idea:
  id: IDEA-20260805-2bbfb2
  question_id: RQ-FNDSA-001
  added: '2026-08-05'
  title: >-
    The leaf-normalizer theta defect: FN-DSA's signature distribution is
    provably NOT an exact discrete Gaussian even in exact arithmetic, the
    deviation has a closed form 2 exp(-2 pi^2 sigma_min^2), and that closed
    form converts the goal's deviation-to-signature-count curve from a
    measurement into a derivation with 9.5 bits of margin
  class: control

  claim: >-
    FN-DSA's security argument is usually stated as "the signature
    distribution is an exact discrete Gaussian over the lattice coset,
    therefore trapdoor-independent". That statement is FALSE AS AN EQUALITY
    for every sampler in the Klein/GPV/ffSampling family, including an
    implementation in exact real arithmetic with perfect one-dimensional
    leaf samplers, and the size of the failure is computable in closed form
    before any experiment. The randomized-nearest-plane identity gives
    P(v) proportional to rho_sigma,c(v) divided by the PRODUCT OF THE LEAF
    NORMALIZERS Z_i(c_i(v)) = sum over z in Z of exp(-(z-c_i)^2/(2 sigma_i^2)),
    and those normalizers depend on the leaf centers c_i, which depend on the
    draw. Poisson summation gives
    Z_i(c) = sigma_i sqrt(2 pi) (1 + 2 sum over k >= 1 of
    exp(-2 pi^2 sigma_i^2 k^2) cos(2 pi k c)), so the log-density deviation
    from the ideal is exactly
    -2 sum over leaves of eps_i cos(2 pi c_i) + O(eps_i^2), with
    eps_i = exp(-2 pi^2 sigma_i^2) and sigma_i = sigma / ||b~_i||.
    THREE CONSEQUENCES, ALL FORCED VALUES DERIVED BEFORE ANY RUN.
    (1) The key-acceptance bound ||B||_GS <= 1.17 sqrt(q) is EXACTLY the
    condition sigma_i >= sigma_min, because sigma = 1.17 sqrt(q) sigma_min;
    an ideation-session evaluation of that identity at q = 12289 and
    sigma_min = 1.277833697 returns 165.736617, reproducing the recalled
    FN-DSA-512 signature sigma to six decimals. The design rationale is
    therefore RECONSTRUCTED, not assumed.
    (2) At the standardized parameters the per-leaf amplitude is
    eps_0 = 2^-46.500 (n = 512) and 2^-48.000 (n = 1024); the per-signature
    Kullback-Leibler divergence from the ideal is d eps_0^2 = 2^-83.000 and
    2^-85.000 for d = 2n = 1024 and 2048 leaves; hence the
    information-theoretic floor on the number of signatures for ANY
    distinguisher exploiting this channel is 2^83 and 2^85.
    (3) The threshold at which that floor drops to the standard's own
    signature-query bound q_s = 2^64 is eps_crit = 2^-37.000 (n = 512) and
    2^-37.500 (n = 1024). THE MARGIN BETWEEN THE EXACT-ARITHMETIC DEFECT AND
    THE CRITICAL DEFECT IS 9.5 AND 10.5 BITS. That single number is the whole
    research question of this goal made quantitative, and no record in this
    corpus contains it.

  object_first_candidate:
    tracked_object: >-
      The LEAF NORMALIZER Z_i(c) = sum over z in Z of
      exp(-(z - c)^2 / (2 sigma_i^2)), followed as a function of the leaf
      center c through the ffSampling recursion. Not the signature, not the
      signature's histogram, not a timing trace: the denominator that the
      randomized-nearest-plane identity leaves behind, and the only place in
      an exact-arithmetic Klein sampler where the secret basis can enter the
      output distribution at all. Its first Fourier coefficient in c is the
      entire carrier of the deviation, and its amplitude
      exp(-2 pi^2 sigma_i^2) is a function of ||b~_i||, a secret quantity.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal, because every one of
      them is where the FN-DSA literature already lives and a variant of any
      of them would arrive in new notation and be invisible as a repackaging:
      (a) TIMING AND MICROARCHITECTURAL SIDE CHANNELS on the sampler,
      including rejection-count leakage, cache attacks on the CDT, and
      floating-point instruction timing; (b) BKZ / LATTICE-REDUCTION cost
      estimation against the NTRU or forgery lattice; (c) OVERSTRETCHED-NTRU
      subfield and dense-sublattice attacks; (d) FAULT INJECTION; (e) generic
      GOODNESS-OF-FIT TESTING of the signature histogram, which is the prior
      proposal on this question (IDEA-20260801-010) and which this proposal
      does not extend, imitate, or depend on. The Klein/GPV analysis family is
      deliberately NOT off-limits, for the same reason IDEA-20260805-e805b6
      kept the class-group family in scope: this proposal does not propose a
      new attack inside it, it audits a load-bearing constant of the standard
      that lives inside it.
    newness_score: >-
      The Poisson-summation expansion of the one-dimensional Gaussian
      normalizer is textbook, and the smoothing-parameter argument that
      bounds it is the standard justification for sigma_min; nothing in the
      MATHEMATICS is new and the record says so. What is new to this corpus,
      and what makes the record worth having, is the arithmetic: writing
      eps_crit down, comparing it to eps_0, and getting 9.5 bits. This corpus
      contains one prior FN-DSA proposal and it neither states the exact-
      arithmetic deviation nor derives any signature count. The house
      exemplar's move -- take a quantity a claimed pipeline is FORCED to
      produce and compute it -- is applied here to the standard's own design
      constant rather than to an external break claim.
    testability_score: >-
      Very high and almost free. The headline is a closed-form evaluation
      checkable by hand and reproducible in pure-Python floating point in
      milliseconds; the reference values were computed in this ideation
      session by direct theta summation and by the asymptotic form, which
      agree to 1e-9 relative at sigma = 0.8. The one genuinely uncertain
      input is the standard's actual sigma_min, which Stage 0 reads from the
      primary text.
    survival_score: >-
      The object survives the entire ffSampling recursion by construction,
      because the recursion is exactly a composition of leaf draws and the
      normalizers multiply. It does NOT survive the step to an attacker-
      computable statistic, and that is the honest limit of the proposal: the
      centers c_i are not observable without the trapdoor, so the optimal
      distinguisher derived here is not an algorithm an adversary can run.
      The record states this rather than hiding it, and it is the reason the
      2^83 figure is a FLOOR and not an attack.

  mechanism: >-
    DERIVED IN-RECORD. No primary source for FN-DSA or FALCON has been read
    by this program; every scheme-specific constant below is labelled and is
    an input to be replaced in Stage 0, not an authority.

    STEP 1, THE RANDOMIZED-NEAREST-PLANE IDENTITY. Klein's sampler, of which
    FN-DSA's ffSampling is the fast recursive form over the cyclotomic tower,
    processes the Gram-Schmidt directions b~_d, ..., b~_1 in order. At step i
    it forms the center c_i = <c, b~_i> / <b~_i, b~_i>, sets
    sigma_i = sigma / ||b~_i||, draws z_i from the one-dimensional discrete
    Gaussian D_{Z, sigma_i, c_i}, and subtracts z_i b_i from the target. The
    output is v = sum z_i b_i and its probability is the product over i of
    exp(-(z_i - c_i)^2 / (2 sigma_i^2)) / Z_i(c_i), where
    Z_i(c) = sum over z in Z of exp(-(z - c)^2 / (2 sigma_i^2)).
    The NUMERATORS multiply to exactly rho_sigma,c(v), because the squared
    distance decomposes orthogonally along the Gram-Schmidt directions and
    (z_i - c_i)^2 sigma_i^-2 = (z_i - c_i)^2 ||b~_i||^2 sigma^-2. The
    DENOMINATORS do not multiply to a constant: each Z_i depends on c_i, and
    c_i depends on the choices already made. Therefore
      P(v) / D_{Lambda, sigma, c}(v)
        = rho_sigma,c(Lambda) / product over i of Z_i(c_i(v)),
    and the output is the ideal discrete Gaussian IF AND ONLY IF that product
    is constant in v. IT IS NOT CONSTANT. This is the whole mechanism, and it
    is an identity, not a heuristic.

    STEP 2, POISSON SUMMATION MAKES THE DEFECT EXPLICIT. For any sigma > 0,
      Z_sigma(c) = sum over z in Z of exp(-(z - c)^2 / (2 sigma^2))
                 = sigma sqrt(2 pi) sum over k in Z of
                   exp(-2 pi^2 sigma^2 k^2) exp(2 pi i k c)
                 = sigma sqrt(2 pi) (1 + 2 sum over k >= 1 of
                   exp(-2 pi^2 sigma^2 k^2) cos(2 pi k c)).
    Writing eps = exp(-2 pi^2 sigma^2), the k >= 2 terms are eps^4 and
    smaller, so to first order
      log Z_sigma(c) = log(sigma sqrt(2 pi)) + 2 eps cos(2 pi c) + O(eps^4),
    and the log-density deviation of the sampler from the ideal is
      L(v) = log(P(v) / D(v)) = const - 2 sum over i of eps_i cos(2 pi c_i(v))
             + O(eps^2).
    THIS IS THE OPTIMAL (NEYMAN-PEARSON) DISTINGUISHING STATISTIC for the
    exact-arithmetic sampler against the ideal, derived rather than guessed.

    STEP 3, THE SECRET ENTERS THROUGH eps_i AND ONLY THROUGH eps_i. Since
    eps_i = exp(-2 pi^2 sigma^2 / ||b~_i||^2), the amplitude of the i-th
    harmonic is a strictly increasing function of ||b~_i||. The Gram-Schmidt
    profile of the NTRU basis IS the trapdoor's shape. So the deviation is
    not white: it is a structured, trapdoor-dependent modulation. That is why
    this channel, and not the histogram, is the one a distributional attack
    would have to use.

    STEP 4, THE COST BOOKKEEPING. The c_i are, for a uniformly random message
    hash, close to uniform and close to independent across leaves (HEUR-FN-1
    below; it is stated formally and given a falsification plan rather than
    assumed). Under that model, E[L] is a constant and
      Var(L) = 4 sum over i of eps_i^2 E[cos^2] = 2 sum over i of eps_i^2,
    so the per-signature Kullback-Leibler divergence is
      KL(P || D) = Var(L) / 2 + O(eps^3) = sum over i of eps_i^2
                 = d eps_0^2 when all leaves sit at the floor sigma_min,
    with d = 2n the number of leaves. The number of signatures at which an
    optimal distinguisher achieves constant advantage is N = Theta(1 / KL).
    PER-ATTEMPT COST TIMES INVERSE SUCCESS PROBABILITY, stated in the house
    form: each signature costs one query and O(1) work to fold into the
    statistic, and the inverse success probability is 1 / (N KL); the total is
    Theta(1 / KL) queries and Theta(1 / KL) work, with O(1) memory, because
    the statistic is a running sum. Memory is charged and it is negligible;
    that is a genuine Pareto fact and it is stated because a channel that is
    cheap in memory and impossible in queries is a different object from one
    that trades them.

    STEP 5, THE KEY-ACCEPTANCE BOUND IS THE FLOOR ON sigma_i, AND THE
    IDENTITY CLOSES. sigma_i = sigma / ||b~_i|| >= sigma / ||B||_GS, so a
    keygen rejection rule ||B||_GS <= 1.17 sqrt(q) enforces
    sigma_i >= sigma / (1.17 sqrt(q)) at EVERY leaf. If, as recalled,
    sigma = 1.17 sqrt(q) sigma_min, then that floor is exactly sigma_min and
    the design is tight by construction. An ideation-session evaluation
    (pure Python, this machine, OUTSIDE THE HARNESS -- re-run in-harness
    before citing) gives 1.17 * sqrt(12289) * 1.277833697 = 165.736617,
    against a RECALLED FN-DSA-512 signature sigma of 165.736617183. Two
    independently recalled constants satisfying an identity to six decimals is
    strong evidence that the recall is faithful and that the mechanism above
    is the actual design rationale -- but it is evidence, not a citation, and
    Stage 0 replaces it.

    STEP 6, THE NUMBERS. With sigma_min = 1.277833697 (n = 512):
    2 pi^2 sigma_min^2 = 32.231344, eps_0 = 1.004859e-14 = 2^-46.500,
    2 eps_0 = 2^-45.500; d = 1024; KL = 1.0340e-25 = 2^-83.000;
    N_LLR = 2^83.00. With sigma_min = 1.298280334 (n = 1024):
    eps_0 = 2^-48.000, d = 2048, KL = 2^-85.000, N_LLR = 2^85.00. Inverting
    for the query bound q_s = 2^64: eps_crit = sqrt(2^-64 / d) = 2^-37.000
    and 2^-37.500. MARGIN 9.50 AND 10.50 BITS. Every one of these is a
    closed-form evaluation performed before any run and is falsifiable by
    recomputation.

    STEP 7, WHAT THE MECHANISM DOES NOT GIVE, STATED HERE SO THE CLOSURE IS
    HONEST. L(v) is not attacker-computable: recovering c_i(v) from v needs
    the Gram-Schmidt frame, i.e. the trapdoor. So 2^83 is an INFORMATION-
    THEORETIC FLOOR on this channel, and the best attacker-computable
    statistic is somewhere above it, possibly far above. Closing the gap --
    exhibiting a trapdoor-free statistic that captures a constant fraction of
    KL, or proving that no such statistic exists -- is the forward guidance
    this proposal hands to the next batch, and it is the interesting question.

  novelty_status: unverified

  literature_context:
    - >-
      DRAFT FIPS 206 / FN-DSA: NOT READ. No FIPS text, no FALCON
      specification, and no reference implementation has been read by this
      program. The scheme-specific constants used above -- q = 12289,
      sigma_min = 1.277833697 (n = 512) and 1.298280334 (n = 1024),
      signature sigma = 165.736617183 (n = 512) and approximately
      168.38857 (n = 1024), key-acceptance bound ||B||_GS <= 1.17 sqrt(q),
      53-bit floating-point arithmetic in the reference sampler -- are ALL
      RECALLED, UNVERIFIED. They are candidates to check, never authorities.
      Stage 0 of the paired experiment replaces every one of them with a
      quotation and a page reference, or records that the source could not be
      obtained, in which case no statement about FN-DSA may be made at all
      and the derivation stands only as a statement about the Klein sampler
      family at the stated sigma_min values.
    - >-
      KLEIN'S SAMPLER AND THE GPV FRAMEWORK: RECALLED, UNVERIFIED as
      citations; DERIVED IN-RECORD as mathematics. The randomized-nearest-
      plane identity and the observation that the leaf normalizers are what
      obstruct exactness are re-derived above from scratch and do not rest on
      any retrieved source. The standard smoothing-parameter argument that
      bounds the obstruction is exactly what this proposal makes numerical.
      Whether the FN-DSA specification states the resulting deviation, and in
      what divergence (statistical distance, Kullback-Leibler, or Renyi), is
      a Stage 0 reading task, and the answer materially changes how the
      standard's own security claim should be compared with the numbers above.
    - >-
      NGUYEN-REGEV "LEARNING A PARALLELEPIPED" AND THE DEATH OF NTRUSIGN:
      RECALLED, UNVERIFIED. The motivating analogy in RQ-FNDSA-001 is that
      NTRUSign died from distributional rather than timing error. This
      proposal does NOT rely on any number from that work, and the companion
      proposal IDEA-20260805-637a3b treats the moment channel it used as a
      separate object with its own forced value.
    - >-
      IDEA-20260801-010, the only prior proposal on RQ-FNDSA-001, proposes a
      chi-square or Kolmogorov-Smirnov goodness-of-fit test of sampler
      outputs against the ideal discrete Gaussian. It is not superseded,
      contradicted, or extended here. This proposal is disjoint from it in
      tracked object (the normalizer, not the histogram), in method
      (derivation, not testing), and in deliverable (a signature count, not a
      p-value). The companion proposal IDEA-20260805-4a6dc7 does address that
      proposal's testability directly and should be read for that.

  lossy_projection_identifiability_audit:
    projection: >-
      Full signature (s_1, s_2) in Z^{2n}, together with the message hash,
      projected to the single scalar
      T(v) = sum over leaves of eps_i cos(2 pi c_i(v)).
    what_is_discarded: >-
      Everything except one real number per signature. The fibre over a given
      value of T is essentially the whole signature space.
    why_genuinely_lossy: >-
      Extremely lossy: 2n integer coordinates collapse to one bounded real.
      This is not a change of coordinates in any sense -- the map is neither
      injective nor invertible even up to symmetry, and the fibres are
      astronomically large.
    why_compatible_with_the_operations: >-
      Compatible in the strongest available sense: T is not merely correlated
      with the deviation, it IS the deviation, to first order, by the Poisson
      identity in the mechanism. The retained part propagates deterministically
      because the ffSampling recursion multiplies normalizers and the logarithm
      turns the product into the sum that defines T. There is no modelling step
      between the sampler and T.
    is_it_only_a_change_of_coordinates: >-
      NO -- checked explicitly against the canonical failure. The
      (Delta, Pi) = (x xor y, x y) failure in characteristic 2 is the case
      where the projection is invertible and therefore gains nothing; T is not
      invertible and the check is trivially passed.
      THE MIRROR FAILURE IS THE ONE THAT HAD TO BE CHECKED HERE, and it was:
      is T CONSTANT across instances, with zero comparator spread, in which
      case it would be an artifact of the apparatus rather than a statistic?
      It is not constant, and the derivation says why: Var(T) = sum eps_i^2 / 2,
      which is nonzero for every finite sigma_i and is a strictly increasing
      function of the Gram-Schmidt norms. The spread is derived, not assumed,
      and its numerical value at the standardized parameters (2^-84 in
      variance) is exactly what makes the channel useless in practice -- so
      the honest reading is that T passes the identifiability test and fails
      the magnitude test, and those are different failures with different
      forward guidance.
      THIRD FAILURE MODE, CHECKED AND FAILED, AND THIS IS THE PROPOSAL'S MAIN
      WEAKNESS: T is not computable by an adversary who does not already hold
      the trapdoor, because c_i(v) requires the Gram-Schmidt frame. A
      projection can be lossy, compatible, non-constant, and STILL not an
      attack, because it is not evaluable from public data. That is recorded
      here as a defect of the object and not discovered later.

  assumptions:
    - >-
      That FN-DSA's sampler is in the Klein/GPV randomized-nearest-plane
      family, i.e. that ffSampling is a fast recursive realization of it with
      the same output distribution up to the precision analysis. IF THE DRAFT
      STANDARD SPECIFIES A DIFFERENT SAMPLER -- for instance an integer-only
      reformulation with a different recursion -- the identity in Step 1 may
      not hold and the whole derivation must be redone against what the text
      actually says. Stage 0 exists to settle this and it is the single most
      likely way this proposal is wrong.
    - >-
      That the quantity of interest is the deviation of the SIGNATURE
      distribution from the ideal lattice Gaussian, not the deviation of any
      intermediate quantity.
    - >-
      That exact arithmetic is the right baseline to compute first. It is,
      because a floating-point analysis that does not know the exact-arithmetic
      floor cannot say whether a measured deviation is implementation error or
      the design's own residue.

  predictions:
    - metric: >-
        sigma_reconstruction_identity -- the value of
        1.17 * sqrt(q) * sigma_min computed at the sigma_min and q READ FROM
        THE PRIMARY SPECIFICATION IN STAGE 0, compared with the signature
        sigma read from the same source
      direction: different
      minimum_effect: >-
        Predicted to agree to at least 6 significant figures at both
        parameter sets. Pre-run value at the recalled constants:
        165.736617 for n = 512. IF THE SPEC'S OWN CONSTANTS DO NOT SATISFY
        THIS IDENTITY, the reconstruction of the design rationale in Step 5
        is wrong, the key-acceptance bound is not the floor on sigma_i, and
        the weak-key question in the paired experiment becomes live rather
        than closed. That is the single most interesting way this prediction
        can fail.
    - metric: >-
        eps_0 = exp(-2 pi^2 sigma_min^2), evaluated at the spec's sigma_min
      direction: different
      minimum_effect: >-
        EXACTLY 2^-46.500 at n = 512 and 2^-48.000 at n = 1024, to three
        decimal places in the exponent, at the recalled sigma_min values.
        The near-exact half-integer powers of two are themselves a prediction
        about the standard's design: sigma_min appears to have been chosen so
        that this quantity is a round binary number. A measured exponent more
        than 0.05 away from those values means the recalled sigma_min is
        wrong and every downstream number must be recomputed.
    - metric: >-
        N_LLR = 1 / (d eps_0^2), the information-theoretic signature floor for
        the normalizer channel
      direction: different
      minimum_effect: >-
        2^83.00 at n = 512 (d = 1024) and 2^85.00 at n = 1024 (d = 2048).
        Derived before any run. A recomputation differing by more than 1 bit
        falsifies the arithmetic.
    - metric: >-
        eps_crit = sqrt(2^-64 / d), the per-leaf relative density error at
        which N_LLR falls to the standard's own signature-query bound
      direction: different
      minimum_effect: >-
        2^-37.000 at n = 512 and 2^-37.500 at n = 1024, hence a margin of
        9.50 and 10.50 bits over the exact-arithmetic defect. THIS IS THE
        PROPOSAL'S HEADLINE NUMBER and the quantity the rest of the campaign
        should be pointed at.
    - metric: >-
        max_leaf_gs_norm_excess -- over 200 toy NTRU-shaped keys at n in
        {8, 16, 32} that PASS a two-extreme key-acceptance check, the number
        for which some interior Gram-Schmidt norm exceeds 1.17 sqrt(q)
      direction: lower
      minimum_effect: >-
        PREDICTED 0 out of 200, because ||B||_GS is by definition the maximum
        over all Gram-Schmidt norms and the acceptance bound is stated on it.
        THIS CONTROL CAN FAIL, and its failure is the live weak-key finding:
        if the standard's keygen checks only the two extreme norms
        ||(g, -f)|| and its dual partner, and some interior leaf exceeds the
        bound, then sigma_i < sigma_min for that leaf and eps_i is amplified
        DOUBLY EXPONENTIALLY -- sigma dropping from 1.278 to 1.100 raises
        2 eps from 2^-45.5 to 2^-33.5, twelve bits, and to 2^-27.5 at
        sigma = 1.0. Any count above 0 out of 200 converts this proposal from
        an audit into an attack surface and is routed to rule 12.
    - metric: >-
        asymptotic_form_relative_error -- |theta-sum value minus asymptotic
        1 + 2 eps cos(2 pi c)| / (2 eps), evaluated on the sigma ladder
        {0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80}
      direction: lower
      minimum_effect: >-
        MONOTONE DECREASING in sigma across all eight rungs, and below 1e-8
        at sigma = 0.80. Ideation-session evaluation gives a relative
        discrepancy of 2.07e-3 at sigma = 0.50 and 1.08e-9 at sigma = 0.80.
        This is the instrument's own self-check: the asymptotic expansion
        must converge at the rate the derivation says it does, and if it does
        not, the closed form is not the closed form of this object.

  minimal_test:
    design: >-
      Four stages, ordered cheapest-first, each able to terminate the line.
      STAGE 0 (reading, zero compute, and it can end everything): obtain the
      draft FIPS 206 / FN-DSA specification through the declared source-
      preference order, quote the sampler pseudocode, sigma, sigma_min,
      sigma_max, q, and the key-acceptance rule, with page references. If the
      sampler is not in the Klein/GPV family, STOP and redesign. If the text
      cannot be obtained, record it as a source-availability outcome, DO NOT
      report any statement about FN-DSA, and continue only as a statement
      about the Klein family at the stated constants.
      STAGE 1 (closed form, seconds, pure Python): evaluate eps_0, KL, N_LLR
      and eps_crit at the Stage-0 constants; check the reconstruction
      identity; check the asymptotic convergence ladder. TERMINATES THE LINE
      IF eps_0 EXCEEDS eps_crit, in which case the exact-arithmetic sampler
      alone already puts the distinguisher inside the query bound and the
      campaign's priority changes completely.
      STAGE 2 (leaf instrument, minutes, numpy): validate the closed form
      empirically on the one-dimensional leaf sampler at the sigma ladder,
      where the effect is measurable, against an exactly computed rational
      reference. This is the calibration the goal's completion criterion
      demands, executed where ground truth exists.
      STAGE 3 (Gram-Schmidt audit, minutes, exact rational arithmetic): build
      toy NTRU-shaped bases at n in {8, 16, 32}, compute ALL 2n Gram-Schmidt
      norms exactly with fractions, and check whether the two-extreme
      acceptance check implies the all-leaf bound.
    controls:
      - >-
        NULL OBJECT, FORCED VALUE DERIVED PRE-RUN, AND IT CAN FAIL. Replace
        the leaf sampler by a CONTINUOUS Gaussian of the same sigma_i, for
        which the normalizer is exactly sigma_i sqrt(2 pi) INDEPENDENT OF c
        by translation invariance. The derived deviation is therefore EXACTLY
        ZERO, all harmonics vanish identically, and any measured nonzero
        first-harmonic amplitude in this arm is an instrument artifact and
        invalidates the whole package. This is a true null: it has the same
        shape, the same code path, and the same statistic, and it can fail.
      - >-
        POSITIVE CONTROL, AND NOTHING NEGATIVE MAY BE REPORTED IF IT DOES NOT
        FIRE. Run the identical measurement on the discrete leaf sampler at
        sigma = 0.45, where the derived first-harmonic amplitude is
        2 eps_0 = 3.673436e-2 and the derived mean bias at c = 0.25 is
        -4.673880e-2. The instrument MUST recover both to within 5 per cent
        at N = 10^5 samples. If it does not, the measurement is broken and no
        conclusion, positive or negative, may be drawn from any other rung.
      - >-
        GRADED CONTROL WITH SIX INTERIOR POINTS AND A DERIVED MONOTONE LAW.
        The sigma ladder {0.45, 0.50, 0.55, 0.60, 0.65, 0.70} has pre-derived
        first-harmonic amplitudes 2 eps_0 = 3.673436e-2, 1.438377e-2,
        5.102812e-3, 1.640149e-3, 4.776327e-4, 1.260206e-4 and mean biases at
        c = 0.25 of -4.673880e-2, -2.259397e-2, -9.698729e-3, -3.709930e-3,
        -1.267946e-3, -3.879873e-4. THE QUANTITY MUST DECAY as sigma -- the
        parameter meant to destroy it -- increases, and it must decay at the
        derived rate exp(-2 pi^2 sigma^2), not merely decay. A quantity that
        decays more slowly than the derived law is the canonical artifact
        tell and localises the obstruction to a specific rung instead of
        leaving "it did not work".
      - >-
        ORDERING CONTROL. The null arm and the graded ladder are generated,
        analysed and hash-committed BEFORE the treatment arm at the
        standardized sigma_min is looked at, and the decision rule is
        executed on the null first. If the rule emits the same label on the
        null and on the treatment, it discriminates nothing and must be
        rewritten before either is read.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Prior measurements of this observable in
        this corpus: NONE. Area FNDSA has no experiments, no runs and no
        evidence records. That absence is recorded here rather than presented
        as a passed check, and it means the instrument has no lineage and
        every calibration must be established in this package.
    required_metrics:
      - the primary-source quotations for q, sigma, sigma_min, sigma_max and the key-acceptance rule, with page references, or an explicit statement that the source could not be obtained
      - eps_0, KL, N_LLR and eps_crit at the Stage-0 constants, with the evaluation code and its output
      - the reconstruction-identity residual at both parameter sets
      - measured first-harmonic amplitude and mean bias at every ladder rung, with sample counts and seeds, beside the pre-derived value
      - the continuous-Gaussian null arm's measured amplitude, which must be consistent with zero
      - the full list of 2n exact Gram-Schmidt norms for every toy key, and the count of keys whose interior norms exceed the two-extreme bound

  falsification_conditions:
    - >-
      The draft standard's sampler is not in the Klein/GPV family, so the
      normalizer identity does not apply. The derivation is void as a
      statement about FN-DSA and must be withdrawn and redone. THIS IS THE
      MOST LIKELY SINGLE FAILURE OF THE PROPOSAL AS WRITTEN.
    - >-
      The spec's sigma_min does not satisfy 1.17 sqrt(q) sigma_min = sigma.
      The reconstruction of the design rationale is wrong; the floor on
      sigma_i is not sigma_min; every derived number must be recomputed
      against the true floor.
    - >-
      The measured first-harmonic amplitude on the ladder does not follow
      exp(-2 pi^2 sigma^2) across the six rungs. The closed form does not
      describe this object and the derivation is wrong somewhere between
      Step 1 and Step 2.
    - >-
      The continuous-Gaussian null arm shows a nonzero first-harmonic
      amplitude. The instrument is broken and no result of any sign may be
      reported.
    - >-
      A recomputation of eps_crit or N_LLR differs from 2^-37.000 or 2^83.00
      by more than one bit at the recalled constants. The arithmetic is
      wrong.

  confounders:
    - >-
      SECOND-HAND CONSTANTS. Every FN-DSA number in this record is recalled.
      The internal consistency of two of them under an identity is suggestive
      and is reported as suggestive; it is not verification, and Stage 0
      exists to remove this confounder before anything is claimed about the
      standard.
    - >-
      FLOATING-POINT FLOOR IN THE MEASUREMENT ITSELF. At sigma = 1.0 the
      derived amplitude is 5.35e-9 and at sigma_min it is 2.0e-14, which is
      near or below double-precision resolution for empirical estimation. The
      ladder therefore stops at sigma = 0.70 and the standardized sigma is
      reached BY DERIVATION ONLY. Any attempt to measure at sigma_min with
      double arithmetic would measure the arithmetic, not the sampler, and
      the contract forbids it.
    - >-
      THE UNIFORM-CENTER HEURISTIC. The KL computation assumes the leaf
      centers are close to uniform and close to independent. If they are
      strongly correlated across leaves the variance of the log-likelihood
      ratio changes by up to a factor d, moving N_LLR by up to 10 bits at
      n = 512. This is HEUR-FN-1, it is the only load-bearing heuristic, and
      it has an explicit validation plan.
    - >-
      REFUTATION IS CHEAP AND READS AS RIGOUR. A derivation that concludes
      "the channel is 19 bits out of reach" is exactly the kind of result an
      agent can produce without effort. The positive control, the weak-key
      arm that can fire, and the explicit statement that 2^83 is a floor
      rather than an attack are all present so that the negative outcome
      costs something to reach.

  interpretation_limits:
    - >-
      A confirming outcome closes ONE CHANNEL -- the leaf-normalizer defect
      of an exact-arithmetic Klein/ffSampling sampler -- and closes it only
      at the parameter sets whose constants Stage 0 actually reads. It says
      NOTHING about: the floating-point or fixed-point precision channel;
      any integer-only reformulation in the draft; the base sampler's
      rejection-table truncation; the CDT's resolution; timing; or any attack
      that does not go through the output distribution. FORWARD GUIDANCE, and
      it is mandatory: the residual channels are precisely those four, the
      margin they must consume to matter is 9.5 bits at n = 512, and the next
      batch should be pointed at whichever of them the specification's own
      precision analysis leaves least defended.
    - >-
      2^83 IS A FLOOR ON AN INFORMATION-THEORETIC QUANTITY, NOT AN ATTACK
      COST. No adversary can evaluate the optimal statistic without the
      trapdoor. Reporting 2^83 as "an attack in 2^83 signatures" would be
      false and is forbidden by this record.
    - >-
      Nothing here is evidence. No run has happened. The claim tier of any
      future run on the toy ladder is TOY; the derivation at the standardized
      constants is DERIVATION-TIER and conditional on Stage 0, and neither
      may be reported as a crypto-scale measurement of FN-DSA.
    - >-
      If the weak-key arm fires, the resulting claim is a claim about a
      standardized algorithm and is automatically routed to rule 12
      review-breakthrough at max effort before it leaves this program.

  heuristic_assumptions:
    - id: HEUR-FN-1
      statement: >-
        For a uniformly random message hash and an accepted FN-DSA key, the
        vector of leaf-center fractional parts (frac(c_1), ..., frac(c_d))
        produced by ffSampling is close to uniform on [0,1)^d and close to
        independent across leaves, in the sense that
        |E[cos(2 pi c_i)]| <= 2^-20 for every i and
        |E[cos(2 pi c_i) cos(2 pi c_j)]| <= 2^-20 for every i not equal to j.
      rigorous_support: >-
        Partial and stated as partial. The top-level center is a uniformly
        random point of the ambient torus because the message hash is, which
        gives uniformity at the root; the recursion's centers are affine
        images of the residual target, and for sigma_i above the smoothing
        parameter the residual mixes. What is NOT proved is the joint
        independence, and the failure mode is concrete: correlated centers
        would let the d harmonics add coherently, changing Var(L) from
        2 sum eps_i^2 to as much as 4 (sum eps_i)^2, which raises the
        deviation and LOWERS N_LLR by up to 10 bits at n = 512. The heuristic
        is therefore CONSERVATIVE IN THE UNSAFE DIRECTION and must be
        measured rather than assumed.
      validation_plan: >-
        Measure the empirical first and second harmonic moments of the leaf
        centers directly from a toy ffSampling implementation at n in
        {8, 16, 32}, over 10^6 messages, and report the largest |E[cos]| and
        the largest off-diagonal |E[cos cos]| beside the assumed 2^-20 bound.
        Report the implied correction to N_LLR at both extremes (fully
        independent and fully coherent) rather than a single number.
    - id: HEUR-FN-2
      statement: >-
        The sample complexity of an optimal distinguisher between two
        distributions at Kullback-Leibler divergence KL is Theta(1 / KL) for
        small KL.
      rigorous_support: >-
        Standard, and used here only for an order-of-magnitude floor. It is
        stated as a heuristic rather than a theorem because the constant and
        the regime of validity depend on the tails of the log-likelihood
        ratio, which here are bounded (|L| <= 2 sum eps_i) so the regime is
        benign. No claim above one bit of precision rests on it.
      validation_plan: >-
        Measure the empirical number of leaf samples needed to reach a fixed
        distinguishing advantage at each ladder rung, and check that it
        follows the 1 / KL law across the six rungs. This is a direct test of
        the conversion the whole goal depends on, at parameters where it is
        measurable.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL and the record says so plainly.
      It produces an exponent-shaped NUMBER -- 2^83 signatures for the
      normalizer channel at FN-DSA-512, against a design query bound of 2^64
      and a claimed security level of 2^128 -- but that number is a floor on
      a channel, not an attack cost, and no algorithm is proposed. It is
      worth running because it decides where the campaign's remaining five
      batches point, at a cost of minutes, and because the 9.5-bit margin it
      computes is the quantity every subsequent precision analysis must beat.
    memory_exponent: >-
      O(1) words for the distinguishing statistic, which is a running sum.
      Charged explicitly because a channel that is query-bound and
      memory-free is a different Pareto object from one that trades them, and
      this program's own accounting rules require memory beside time.
    best_known: >-
      For FN-DSA key recovery the incumbent is lattice reduction against the
      NTRU lattice at the parameter sets' claimed security levels; this
      proposal does not compete with it and does not compare to it, because
      it proposes no attack. For the specific question "how exact is the
      sampler", this corpus contains no prior measurement or derivation at
      all.
    hidden_overhead: >-
      The o(1) hiding in "close to uniform centers" is HEUR-FN-1 and is worth
      up to 10 bits in N_LLR. That is disclosed rather than buried, and the
      validation plan measures it.
    tradeoff_note: >-
      None available: the channel is query-bound and the statistic is
      streaming, so there is no time-memory interpolation to report.

  dominated_by: >-
    n/a (no attack claimed). Rows checked before writing this, and listed as
    the accounting rule requires: (i) TIME -- no attack is proposed, so there
    is no time row to dominate; (ii) MEMORY -- the statistic is O(1) words,
    which is the minimum possible, so nothing dominates it on memory; (iii)
    DATA / QUERIES -- 2^83 signatures, which is DOMINATED by the trivial
    observation that the standard bounds q_s at 2^64, i.e. the channel is
    out of reach by 19 bits and any attack that stays inside the query bound
    beats it on that axis by construction; (iv) PREPROCESSING -- none; (v)
    ORACLE ACCESS -- signature queries only, no oracle beyond the signer;
    (vi) VERIFICATION -- none, as nothing is claimed to be recovered. The
    corpus rows checked for a prior derivation of this quantity:
    ledger/proposals (IDEA-20260801-010 is the only FNDSA proposal and
    contains no derivation), ledger/evidence (no FNDSA records), experiments
    (no FNDSA directories), and the knowledge corpus by area code. Absence of
    a search result is not evidence that no prior derivation exists, and this
    corpus's own novelty screens are discounted by the bulk-seeding caveat on
    95 per cent of its literature entries.
  sota_delta: >-
    Quantitatively, against the state of this program's knowledge rather than
    against the state of the art: this program currently holds ZERO numbers on
    FN-DSA sampler exactness. The proposal produces five, each derived before
    any run: eps_0 = 2^-46.500, KL = 2^-83.000, N_LLR = 2^83.00,
    eps_crit = 2^-37.000, margin = 9.50 bits, at n = 512, with the n = 1024
    counterparts 2^-48.000, 2^-85.000, 2^85.00, 2^-37.500, 10.50 bits.
    Against the external state of the art it claims no delta at all: the
    smoothing-parameter bound is standard and the numbers are almost certainly
    known to the designers, which is exactly why the reconstruction identity
    is a prediction rather than a discovery. The delta is that this program
    will hold them, with a calibrated instrument attached, instead of an
    untested assumption.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the derivation survives Stage 0 and Stage 1 intact, i.e. that
    the sampler is Klein-family, the reconstruction identity holds, and the
    numbers stand. It is not higher because every FN-DSA constant here is
    recalled and unverified, because the draft standard may specify an
    integer-only reformulation whose recursion differs, and because a single
    misremembered sigma_min moves eps_0 by many bits. It is not lower because
    the mathematics in Steps 1 to 4 is an identity plus Poisson summation and
    does not depend on any retrieved source, and because the reconstruction
    identity already agrees to six decimals on two independently recalled
    constants, which is a strong internal check that the recall is faithful.
    SEPARATELY: 0.05 that the weak-key arm fires, i.e. that some accepted key
    has an interior Gram-Schmidt norm above the acceptance bound. It is low
    because ||B||_GS is by definition the maximum over all such norms; it is
    not zero because whether the specification CHECKS the maximum or only two
    extremes is exactly the kind of gap between an argument and an
    implemented predicate that this program exists to find, and because the
    payoff if it fires is twelve bits of amplification per 0.18 of sigma lost.
    0.30 that the campaign's later batches find an implementation channel
    consuming the 9.5-bit margin, which is the honest reason to run this at
    all rather than a reason to expect a break.
