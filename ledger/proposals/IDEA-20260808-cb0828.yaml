idea:
  id: IDEA-20260808-cb0828
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  title: FN-DSA keygen REJECTS long (f,g), which conditions the NTRU secret to be shorter
    than the nominal Gaussian and therefore pushes the instance TOWARD the overstretched regime
    — compute the conditional second moment and the resulting shift in the dense-sublattice
    attack's block size.
  class: mechanism
  claim: 'FN-DSA key generation samples f, g from a discrete Gaussian and REJECTS the pair
    unless a norm/Gram-Schmidt bound is met (RECALLED: acceptance requires max(||(g,-f)||,
    ||(F,G) - proj||) <= 1.17 sqrt(q), and f must be invertible). Therefore the DEPLOYED secret
    is not distributed as the nominal Gaussian but as that Gaussian CONDITIONED ON BEING SHORT.
    Since the NTRU fatigue point is a statement about q relative to the secret''s size, conditioning
    on shortness moves the deployed instance monotonically toward the overstretched regime.
    CLAIM, falsifiable in two parts: (A) the conditional second moment E[||(f,g)||^2 | accept]
    is strictly smaller than the unconditional 2n sigma_fg^2 by a factor r(n, q) computable
    in closed form from a chi-squared-with-2n-degrees-of-freedom truncation, and r is a NUMBER,
    not a direction; (B) substituting the conditional moment into the published fatigue-point
    criterion moves FN-DSA-512''s distance to fatigue by Delta = -10 log10(r) decibels in
    q-equivalent terms, and the resulting margin — the ratio (fatigue q) / 12289 recomputed
    with the conditional moment — differs from the margin computed with the nominal moment
    by a stated factor. If that recomputed margin is below about 1.3, the dense-sublattice
    attack''s block size is within modelling error of the generic uSVP block size and FN-DSA-512''s
    security argument rests on which of two attacks binds, a question nobody has posed at
    the conditional distribution.'
  mechanism: 'Two facts compose, and both are elementary. FIRST: rejection sampling on a norm
    bound is conditioning, and for a 2n-dimensional isotropic Gaussian the squared norm is
    sigma^2 chi^2_{2n}, extremely concentrated (relative sd 1/sqrt(n)). If the acceptance
    bound sits in the BULK of that law, the conditioning is mild and r is close to 1; if it
    sits at or below the mode, the conditioning is severe and r is materially below 1. Which
    regime FN-DSA is in is decided by the exact constant in the acceptance test versus sqrt(2n)
    sigma_fg, and that comparison is a two-line computation from the specification''s own
    numbers — nobody has to run anything. SECOND: the overstretched-NTRU / fatigue analysis
    (KN-TECH-045 in this corpus) says that when q is large relative to the secret''s size,
    the NTRU lattice contains a DENSE SUBLATTICE generated by the rotations of (g, -f), and
    lattice reduction finds that sublattice at a block size much smaller than the generic
    uSVP prediction; the boundary is the fatigue point. KN-TECH-041 records this as the single
    most consequential known failure of the GSA-based predictor and notes it "was substantial
    enough to hide an entire attack regime for years". The fatigue criterion is stated in
    terms of q and the secret''s WIDTH. Feeding it the nominal width when the deployed width
    is conditionally smaller is a systematic error in the SAFE-LOOKING direction: it reports
    the instance as farther from fatigue than it is. The mechanism is therefore not a new
    attack but a correction to the input of an existing regime test, and its sign is forced.'
  why_not_a_renamed_known_approach: 'Nearest known approach: applying the Ducas-van Woerden
    fatigue criterion to FALCON''s (n, q) — which is standard and which every FALCON analysis
    does. The difference is the INPUT: everyone plugs in the nominal sampling width; the deployed
    width is the conditional one, and the conditioning is not a rounding detail but a rejection
    test that is REQUIRED for the scheme to function (a long basis breaks the sampler''s width
    guarantee, so the rejection is not optional). Nearest corpus record: the review note "B3
    — ML-KEM is 0.2 bits from the NTRU fatigue point, not 8", which applies a fatigue computation
    to ML-KEM, a different scheme with a different (and non-NTRU) lattice; and the catalogue''s
    "M1 — Dense-submodule transfer: is there an overstretched R-LWE / M-LWE?", which asks
    whether the phenomenon exists for R-LWE/M-LWE at all. Neither touches FN-DSA, and neither
    raises the conditioning point for any scheme.'
  predictions:
  - observable: Acceptance rate of FN-DSA keygen's norm test under the nominal sampling width,
      computed exactly from the chi-squared law and verified by direct sampling of (f,g) at
      n = 512 (which costs nothing — no NTRU solving, no lattice work, just Gaussian draws
      and a norm).
    metric: Acceptance probability p_acc, and r = E[chi^2 | accept] / E[chi^2].
    predicted: 'A definite number. Three qualitatively different regimes, all informative:
      p_acc > 0.9 with r > 0.98 (conditioning negligible, claim (A) true but claim (B) void
      and the lane closes cleanly); p_acc in [0.1, 0.9] with r in [0.9, 0.98] (material);
      p_acc < 0.1 (severe conditioning, and also a statement about keygen cost that is checkable
      against reported FALCON keygen timings as an external consistency test).'
  - observable: Fatigue-point q* computed from the published criterion at n = 512 and n =
      1024, evaluated once with the nominal width and once with the conditional width.
    metric: Margin ratio m = q* / q with q = 12289 (RECALLED), reported for both widths, with
      the criterion's own stated uncertainty propagated.
    predicted: m_conditional < m_nominal strictly. The claim is falsified if the two are equal
      to within the criterion's uncertainty, and it is DRAMATICALLY confirmed if m_conditional
      < 1.3.
  - observable: Predicted block size for the dense-sublattice route versus the generic uSVP
      route at both widths, at n = 512.
    metric: beta_dense - beta_uSVP, in block-size units, with the sign stated.
    predicted: The gap narrows when the conditional width is used. If the sign flips (beta_dense
      < beta_uSVP) at the conditional width, that is a first-order finding about FN-DSA-512
      and must be routed to independent review before it is written anywhere as a conclusion.
  - observable: 'NULL CONTROL: the same computation for FN-DSA-1024, where n doubles and the
      chi-squared concentration is tighter, so the conditioning must be WEAKER.'
    metric: r(1024) versus r(512).
    predicted: r(1024) > r(512), i.e. the effect DECAYS with the parameter that should destroy
      it. A conditioning effect that does not decay as n grows is an artifact of the computation,
      per the inventor protocol's canonical artifact tell, and would invalidate the whole
      calculation.
  minimal_test: Zero lattice work, one afternoon. (1) Re-read the FN-DSA/FALCON keygen acceptance
    test and the sampling width from PRIMARY TEXT and file them — the goal's own gate forbids
    designing on recalled values, and every number in this record is recalled. (2) Compute
    p_acc and r exactly from the truncated chi-squared law; verify by direct Gaussian sampling
    with a norm filter at n = 512 and 1024 (10^6 draws, seconds). (3) Re-read the fatigue
    criterion from primary text; evaluate it at both widths for both parameter sets; propagate
    the criterion's stated uncertainty. (4) Report the four margins and the two block sizes
    as a table with the criterion's own error bars, and state explicitly which of the three
    regimes in prediction 1 was observed. NOTHING in this test requires BKZ, fpylll, Sage,
    or an NTRU solver.
  controls:
  - 'DECAY CONTROL (the artifact tell): r must increase toward 1 as n grows, because chi-squared
    concentrates. Report r at n = 256, 512, 1024, 2048. A flat or increasing effect falsifies
    the arithmetic.'
  - 'UNCONDITIONED ARM: evaluate the fatigue criterion with the nominal width and confirm
    it reproduces the published FALCON margin. If it does not, the criterion has been mis-transcribed
    and no comparison is meaningful. This is the baseline-reproduction gate.'
  - 'SECOND-MOMENT-ONLY CHECK: the fatigue criterion may depend on the secret''s distribution
    through more than its second moment. Verify by evaluating the criterion on a synthetic
    distribution with the conditional second moment but the nominal SHAPE; if the answer differs
    from the true conditional evaluation, the second-moment summary is insufficient and the
    claim must be restated in terms of the full conditional law.'
  - The (F, G) half of the basis is produced by NTRUSolve, not by rejection sampling, and
    its size is determined by f, g. Conditioning on short (f,g) may make (F,G) LONGER. Compute
    both halves; an effect that reverses when the full basis is considered is not an effect.
  confounders:
  - FALCON's acceptance test is (RECALLED) on the Gram-Schmidt norm of the full basis, not
    only on ||(f,g)||. If so the conditioning is on a different statistic and r must be computed
    for that statistic. This is the single largest transcription risk and it is why step (1)
    is a hard gate.
  - The fatigue criterion in the literature is stated for a particular secret distribution
    (ternary, or Gaussian with a specific normalisation). Applying it to a conditioned Gaussian
    may be outside its calibrated range. State the range the criterion was fitted on and whether
    FN-DSA's conditional distribution lies inside it; if it does not, the answer is "the criterion
    does not apply here", which is a legitimate and useful closure.
  - q = 12289 is RECALLED. If FN-DSA's draft changed q, every number changes.
  - A margin below 1.3 computed from a criterion whose own fit uncertainty is a factor of
    2 is NOT a finding. Propagate the criterion's uncertainty or do not state a margin.
  falsification_conditions:
  - p_acc > 0.9 and r > 0.98 at both parameter sets — the conditioning is negligible and claim
    (B) is dead. This is a clean lane closure with a named quantity, and it is my modal expectation.
  - The fatigue criterion's stated uncertainty exceeds the shift caused by the conditioning
    — the effect is real but unresolvable by the available criterion, which is a statement
    about the criterion and not about FN-DSA.
  - r does not decay with n — arithmetic error, everything void.
  - Conditioning on short (f,g) lengthens (F,G) enough that the full basis's relevant width
    is unchanged — the effect cancels and the mechanism is dead for the right reason.
  interpretation_limits: 'This is a CRYPTO-parameter computation (n = 512, 1024 exactly) but
    its output is a REGIME-TEST INPUT, not an attack cost. Even in the strongest branch it
    says "the deployed instance is closer to the fatigue boundary than the nominal computation
    implies by a factor X"; it does not exhibit an attack, does not run a reduction, and does
    not license any statement that FN-DSA-512 is broken or weakened. The fatigue criterion
    is itself a fitted heuristic (KN-TECH-041 and KN-TECH-045 in this corpus), so both the
    input and the criterion carry model error and the record must carry both. Claim tier:
    derivation for r; model readout for the margin.'
  assumptions:
  - FN-DSA keygen rejects (f,g) failing a norm/Gram-Schmidt bound. RECALLED and load-bearing;
    step (1) of the minimal test is the gate.
  - A published fatigue-point criterion exists relating q, n and the secret width, with a
    stated fit range and uncertainty. RECALLED from KN-TECH-045's subject matter; the criterion
    itself was not read this session.
  - The dense-sublattice attack applies to FALCON's NTRU lattice in the same form it applies
    to overstretched NTRU generally.
  heuristic_assumptions:
  - id: HA-1
    statement: The fatigue-point criterion depends on the secret distribution only through
      its second moment, uniformly over distributions obtained from a Gaussian by conditioning
      on a norm bound with acceptance probability bounded away from 0.
    rigorous_ingredient: The dense-sublattice detection condition is standardly written in
      terms of the sublattice's DETERMINANT, which for the module generated by the rotations
      of (g,-f) is controlled by ||(f,g)||^{2n} up to a shape factor; determinants of Gaussian-generated
      modules concentrate, so second moments are the natural sufficient statistic. That much
      is structural.
    distribution_imitated: The classical statement it imitates is the Gaussian heuristic for
      the determinant of a random module lattice, i.e. that a random short module is as dense
      as its second moment allows.
    validation_route: Sample (f,g) at n = 128 and 256 both unconditionally and with the norm
      filter, compute the ACTUAL sublattice determinant for each, and check that the ratio
      of determinants matches the ratio predicted from second moments alone. This is exact
      linear algebra on small NTRU-shaped modules, no reduction required. TOY SCALE in n;
      the extrapolation to 512/1024 is explicitly a fit, not a measurement.
    tail_checks: Report the determinant ratio's full distribution, not its mean. If the conditioning
      changes the SHAPE (e.g. removes a heavy tail) rather than only the scale, HA-1 is false
      and the criterion must be evaluated on the full conditional law.
  - id: HA-2
    statement: Conditioning on the keygen acceptance event does not change the ANGULAR distribution
      of (f,g) — i.e. the conditional law is the nominal law with a radially truncated profile
      and an unchanged uniform direction.
    rigorous_ingredient: 'Exact for a spherically symmetric Gaussian conditioned on ||.||
      alone: the direction is independent of the radius. Rigorous, not heuristic, IF the acceptance
      test is a pure norm bound.'
    distribution_imitated: The polar decomposition of an isotropic Gaussian.
    validation_route: Only needed if the acceptance test is NOT a pure norm bound (e.g. if
      it involves a Gram-Schmidt norm or an invertibility condition on f, which is NOT rotation-invariant).
      Test by comparing the empirical direction distribution of accepted (f,g) against the
      uniform one via the distribution of a few fixed linear functionals. Cheap.
    tail_checks: The invertibility condition on f mod q removes a set of measure about 1/q
      per factor and is angularly non-uniform in principle; verify the removed mass is negligible
      at q = 12289 rather than assuming it.
  target_complexity:
    time_exponent: NO ATTACK IS PROPOSED. The quantity moved is the INPUT to a regime test.
      If the strongest branch holds, the consequence would be that the binding attack at FN-DSA-512
      changes identity from generic uSVP at beta_uSVP to the dense sublattice route at beta_dense,
      and the exponent statement would then be 2^{0.292 beta_dense} versus 2^{0.292 beta_uSVP}
      — but this proposal computes the two block sizes and does not claim which wins.
    memory_exponent: Unchanged; both routes are sieve-bound at 2^{0.2075 beta}.
    best_known_baseline: The published FALCON security estimate at the nominal sampling width,
      whose distance-to-fatigue is computed from the same criterion with a different input.
    hidden_overhead_disclosure: The entire result is conditional on a FITTED criterion with
      its own uncertainty, and that uncertainty may exceed the effect. This must be printed
      beside any margin, exactly as GOAL-MLKEM-005's C1 requires an f'' sensitivity table
      beside any curvature-dependent figure.
    time_memory_tradeoff: Not applicable at this stage.
  sota_delta: 'If the conditioning is negligible: ZERO, and the deliverable is a closed lane
    with a number attached. If material: the deliverable is a corrected input to the standard
    FALCON margin computation, expressed as a factor on q*, with the block-size consequence
    stated as a model readout. In neither branch is an attack improved by this proposal alone.'
  dominated_by: 'n/a (no attack-cost result claimed). Pareto check on the FN-DSA analysis
    axis: the corpus''s six FN-DSA records are all about sampler distributional exactness
    and none evaluates NTRU trapdoor hardness or the fatigue distance, so none dominates.
    RQ-FNDSA-001''s target list names "NTRU trapdoor hardness at FN-DSA parameters and distance
    from the overstretched regime" as a declared target with NO record against it — this proposal
    is the first.'
  estimated_cost: 'Implementation: low. Gaussian sampling with a norm filter, a truncated
    chi-squared computation, and an evaluation of a published formula. Under 200 lines. Compute:
    low. Minutes. The expensive part is reading two primary documents correctly.'
  recommended_priority: medium
  honest_prior_of_survival: P(the acceptance test is a norm-type bound and r is computable
    as described) ~ 0.85. P(r < 0.98, i.e. the conditioning is more than a rounding effect)
    ~ 0.45 — FALCON's bound is chosen to accept a decent fraction of keys, which argues for
    mild conditioning, but the bound 1.17 sqrt(q) against a nominal width of 1.17 sqrt(q/(2n))
    times sqrt(2n) is EXACTLY at the mean, which would make p_acc close to 1/2 and the conditioning
    distinctly non-negligible — that coincidence is the reason I am proposing this rather
    than dismissing it. P(the margin recomputation lands below 1.3) ~ 0.12. P(the whole thing
    survives the primary-text gate without a transcription correction) ~ 0.6.
  novelty_status: unverified
  novelty_screen: 'Corpus screened: EXISTING_PROPOSALS.txt (all FNDSA rows), EXISTING_HYPOTHESES.txt
    (H-FNDSA-58b464, -6a9cbb), CATALOGUE_TITLES.txt (entries "M1 — Dense-submodule transfer"
    and "B3 — ML-KEM is 0.2 bits from the NTRU fatigue point"), KNOWLEDGE_BARRIERS.txt (KN-TECH-045
    overstretched NTRU, KN-TECH-041), RQ-FNDSA-001 in full. WEB SCREEN NOT PERFORMED (tool
    failure). External prior-art risk I could not check: whether any FALCON analysis already
    uses the post-rejection conditional width in a fatigue computation. Given how elementary
    the observation is, a non-trivial chance it is folklore; that is exactly what `unverified`
    is for.'
  discriminated_from: '"B3 — ML-KEM is 0.2 bits from the NTRU fatigue point, not 8" applies
    a fatigue computation to ML-KEM at the nominal distribution; this applies one to FN-DSA
    at the CONDITIONAL distribution, and the conditioning is the entire content. Catalogue
    "M1 — Dense-submodule transfer" asks whether an overstretched regime exists for R-LWE/M-LWE;
    FN-DSA''s lattice IS an NTRU lattice, so the regime indisputably exists and the only question
    is distance. No FN-DSA record in the corpus addresses trapdoor hardness at all.'
  lossy_projection_test: 'PASSES. The tracked object is the scalar ||(f,g)||^2 (or the corresponding
    Gram-Schmidt norm), a one-number projection of the secret key. Massively lossy: the fibre
    is a sphere of dimension 2n-1 in the secret space, so all directional information — which
    is all the information needed to sign — is destroyed. What is discarded is discarded COMPATIBLY
    with the operation that matters here, because the dense-sublattice DETECTION condition
    is a statement about the sublattice determinant, which depends on the secret only through
    its size and shape factor: the retained scalar propagates deterministically into the fatigue
    criterion. Contrast with a projection that fails the test: tracking (f, g) up to the unit-rotation
    action loses nothing usable, since the rotations are exactly the symmetry the NTRU lattice
    already has.'
  source_refs:
  - KN-TECH-045 (corpus, title only via KNOWLEDGE_BARRIERS.txt) — overstretched NTRU and the
    fatigue point as an instance-validity check. NOT read in full this session; the criterion
    must be read from it or from primary text before use.
  - KN-TECH-041 (corpus, read in full) — the record that the overstretched regime is the most
    consequential documented failure of the GSA predictor, which is what makes the distance-to-fatigue
    worth computing carefully.
  - RQ-FNDSA-001 (corpus, read in full) — declares "distance from the overstretched regime"
    as an in-scope target and marks all recalled FN-DSA parameters UNVERIFIED.
