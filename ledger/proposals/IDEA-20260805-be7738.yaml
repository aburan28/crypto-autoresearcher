idea:
  id: IDEA-20260805-be7738
  question_id: RQ-MQOM-001
  added: '2026-08-05'
  title: >-
    MQOM's own MQ-hardness tables reproduce exactly from fifteen lines of
    integer arithmetic with no solver -- and once reproduced they show that the
    BINDING attack row is chosen by a minimum over algorithms whose memory is
    printed in the same table and never charged, with the q=2 rows in gates and
    the q=16 / q=256 rows in unstated units
  class: measurement

  claim: >-
    THE REPRODUCTION, DERIVED IN THIS SESSION. The MQOM v2.1 specification
    predicts the cost of algebraic attacks on its own MQ instances from one
    series, stated in Section 4.2: sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(n+1),
    with the solving degree defined as the smallest j with a_j <= 0. Applying
    that series to the HYBRID sub-system (m equations in n - k variables) and
    minimising k*log2(q) + log2(2 * C(n-k+D,D)^2 * C(n-k+2,2)) over k reproduces
    the specification's own published (k, D) choices at ALL SIX of its q=16 and
    q=256 parameter sets EXACTLY: (k,D) = (13,13), (17,19), (24,24) for
    q=16 at n = 56, 84, 116 and (3,22), (5,28), (8,33) for q=256 at
    n = 48, 72, 96, against Tables 17 and 16 respectively. The reconstructed
    log2 cost differs from the published cost by a CONSTANT 6.1 bits at all six
    cells (144.5 vs 150.6, 204.7 vs 210.8, 272.8 vs 278.9, 150.9 vs 157.0,
    211.4 vs 217.5, 274.3 vs 280.4). A constant residual across six cells
    spanning three security levels and two field sizes is a missing factor in
    the transcription of the cost formula, not a modelling disagreement, and
    identifying it is a one-page deliverable.
    THE FINDING THE REPRODUCTION UNLOCKS. Each security level's MQ margin is set
    by a MINIMUM over several algorithm rows, and the minimising row is
    repeatedly the one with the largest memory. At q=2 Level V the published
    table gives Crossbred cost 282 with log2|A| = 145 and Dinur's second
    algorithm cost 280 with SPACE 208; the binding number, 280, belongs to the
    2^208-space row. At q=2 Level III the two are 213 and 214, one bit apart,
    with spaces 111 and 158. At q=16 Level I the binding row is PXL at 142.8
    with log2|A| = 79.3 against WXL at 150.6 with log2|A| = 50.7. NO ROW IS
    CHARGED FOR ITS MEMORY ANYWHERE IN THE TABLE, although the memory column is
    printed. Under any positive memory charge -- Wiener AT^2, a memory-access
    penalty, or simply declaring 2^208 bits unrealisable -- the minimum moves to
    a different row and the derived margin CHANGES, in the direction that makes
    MQOM look STRONGER. A result that makes a scheme look stronger is still a
    result, and it is the honest half of this goal's completion criterion.
    THE UNIT DEFECT. The q=2 table is explicitly in GATES: the specification
    applies "a penalty of a factor 20n" to the Moebius transform and writes "we
    (optimistically) consider that the cost of the memory efficient Moebius
    transform is about 20*n*d*2^n gates". The q=16 and q=256 tables report a
    quantity called "cost" derived from a count of ARITHMETIC OPERATIONS in
    F_16 and F_256 with no stated conversion. Comparing 142.8 from the q=16
    table against a gate-count security bar is therefore a unit comparison this
    corpus must not make silently, and stating which unit each row is in is a
    first-class deliverable of the audit.

  object_first_candidate:
    tracked_object: >-
      THE BINDING ROW: which algorithm attains the minimum in a scheme's own
      security table, and how that identity changes as cost axes are added.
      Followed through the computation as an ordered pair (algorithm identity,
      its memory exponent), from the published table, through an exact
      re-derivation, through re-costing under memory-charged models, to a
      possibly different minimising row. The object is a discrete label plus one
      exponent, and it propagates deterministically: adding a cost axis is a
      monotone transformation of each row's cost and therefore a well-defined
      permutation of the ordering.
    established_families_off_limits: >-
      Off-limits as the primary lens: inventing a new MQ solving algorithm;
      Fiat-Shamir/soundness analysis (that is IDEA-20260805-7abf04); structural
      attacks that exploit oil spaces or quotient rings (MQOM has neither by
      design -- see IDEA-20260805-7d97be); side channels and faults;
      lattice reduction. This proposal deliberately refuses to look for a faster
      MQ solver and looks instead at the accounting that turns any solver's
      cost into a parameter choice. That is the scout brief's T-D template and
      it has never been applied to the MQ case in this corpus.
    newness_score: >-
      The individual ingredients are all public (the series is the standard
      semi-regular Hilbert series; AT^2 accounting is KN-TECH-035/044/050/057 in
      this corpus). What is new, and what the scout brief's F7 section states is
      never attempted -- "D5 Wiener -> crossbred/BooleanSolve split: memory
      footprint as a function of (D,d,k) at the reported optimum vs the time
      exponent under AT^2. Never charged in the MQ case." -- is charging it, on
      a scheme whose own table prints the memory column and then takes an
      uncharged minimum. The unit defect appears to be new here too, but see the
      novelty screen: this corpus's screen is weak and no external claim of
      novelty is made.
    testability_score: >-
      Very high and almost free. The reproduction is fifteen lines of pure-Python
      integer arithmetic using only math.comb; the re-costing is a table
      transformation. NO SOLVER, NO SAGE, NO SYMPY IS REQUIRED, which matters
      enormously here: see the infrastructure finding in the mechanism.
    survival_score: >-
      The reproduction survives completely (already achieved). The re-costing
      survives to whatever depth the memory model is defensible, which is
      shallow: AT^2 is a lower bound for a specific physical model and its
      applicability to a block-Wiedemann computation is arguable. The audit's
      durable core is therefore the TABLE OF WHICH ROW BINDS UNDER WHICH MODEL,
      not a single revised number, and it is written that way.

  mechanism: >-
    PROVENANCE. All specification numbers are READ from the MQOM v2.1
    specification, fetched this session from https://mqom.org/docs/mqom-v2.1.pdf
    (HTTP 200, 707578 bytes) and extracted via a pure-zlib stream reader,
    because pdftotext is absent and pypdf crashes on import in this container.
    THE EXTRACTION IS LOSSY and table cells are recovered in reading order;
    stage 0 of the paired experiment re-verifies every cell against the rendered
    PDF. All arithmetic labelled "derived in this session" was computed here in
    pure Python with exact integers, OUTSIDE the harness, and carries no run
    record; it is re-derivable in seconds and must be re-derived in-harness
    before any evidence record cites it.

    INFRASTRUCTURE FINDING, REPORTED AS INFRASTRUCTURE AND NEVER AS MATHEMATICS
    (AGENTS.md rule 5). GOAL-MQOM-001's next_action requires checking the
    harness's degree-of-regularity backend before any solving-degree experiment
    is designed. Measured this session: `python3 -c "import numpy"` succeeds
    (numpy 2.4.6); `import sympy` fails (ModuleNotFoundError); `import sage`
    fails, so src/ic_first_fall_fast.py CANNOT BE IMPORTED AT ALL -- its line 23
    is `from sage.all import GF, Matrix`. The d_reg backend is therefore not in
    the state EV-DREG-004 left it in; it is unavailable in this container
    entirely. EV-DREG-004 itself records validity_status in_progress_rebuilt,
    two data-loss incidents, a cell that reached 24.93 per cent of columns and
    was destroyed, and three of four run_ids that are collective range labels
    resolving to nothing. Its object is a BOOLEAN CHAINED SEMAEV system at
    n = 21 over GF(2) with field equations -- a different object from MQOM's
    dense random MQ over F_2, F_16, F_256 with m = n. This resolves the scout
    brief's flagged environment disagreement in the direction: numpy YES,
    sage/sympy NO. THE CONSEQUENCE IS THE POINT: the entire audit below needs
    none of it, so the goal's second flank is executable today rather than
    blocked on an infrastructure request.

    THE SPECIFICATION'S OWN MODEL, quoted from the extracted Section 4.2.
    "Consider the series expansion: sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(n+1).
    The smallest index j such that a_j <= 0 is the solving degree of the
    semi-regular sequence (see [CG23] for more details). When d is strictly less
    than the solving degree, then the rank of the degree-d Macaulay matrix is
    C(n+d,d) - a_d (in the non-binary case). If d is equal or greater than the
    solving degree, then the rank is just C(n+d,d)." The specification also
    gives an equivalent matrix-F5 recurrence R_{d,j+1} = R_{d,j} +
    C(n+d-2,d-2) - R_{d-2,j} with R_{d,m} = C(n+d,d) - a_d, and a BW1 operation
    count of about 2*(1 + n~/m~)*N^2*(C(n+2,2) + m~) with N = C(n+d,d).

    THE HYBRID LAYER IS LOAD-BEARING AND THE SPEC SAYS SO. MQOM sets m = n at
    every parameter set. At m = n the series collapses:
    (1 - z^2)^n / (1 - z)^(n+1) = (1+z)^n / (1-z), so a_d = sum_{j<=d} C(n,j),
    which is STRICTLY POSITIVE FOR EVERY d. Verified this session for all nine
    (q, n=m) pairs out to d = 60: no nonpositive coefficient exists. Hence the
    specification's own definition of "solving degree" IS UNDEFINED AT MQOM'S
    OWN PARAMETERS, and becomes defined only after k >= 1 variables are guessed,
    which is precisely why the specification says of the hybrid method that "the
    sub-systems that are actually solved in step 3 are more overdetermined than
    the input system, and therefore have a much lower solving degree". This is
    not an error; it is a fact about exactly-determined systems (Bezout gives
    2^n projective solutions, so the ideal is not the ideal of a single point).
    IT IS RECORDED HERE BECAUSE IT MAKES A CITATION HYGIENE RULE: any statement
    of the form "MQOM's solving degree is D" is meaningless without naming k,
    and any transfer of this program's d_reg instrumentation to MQOM must target
    the k-guessed sub-system, not the public map.

    THE RECONSTRUCTION, DERIVED IN THIS SESSION. For each (q, n=m) and each
    k in [0, n), set nv = n - k, compute d_solv(k) = min{ d : a_d <= 0 } for
    the series (1 - z^2)^m / (1 - z)^(nv+1), and score
    cost(k) = k*log2 q + log2( 2 * C(nv+d,d)^2 * C(nv+2,2) ).
    The minimising (k, d_solv) is:
      q=16, n=56  -> k=13, D=13, cost 144.5   [spec Table 17: k=13, D=13, 150.6]
      q=16, n=84  -> k=17, D=19, cost 204.7   [spec Table 17: k=17, D=19, 210.8]
      q=16, n=116 -> k=24, D=24, cost 272.8   [spec Table 17: k=24, D=24, 278.9]
      q=256, n=48 -> k=3,  D=22, cost 150.9   [spec Table 16: k=3,  D=22, 157.0]
      q=256, n=72 -> k=5,  D=28, cost 211.4   [spec Table 16: k=5,  D=28, 217.5]
      q=256, n=96 -> k=8,  D=33, cost 274.3   [spec Table 16: k=8,  D=33, 280.4]
    Six of six on BOTH (k, D), with log2 N also matching (40.8 at the first
    cell, against the published 40.8). This is the inventor protocol's audit-1
    baseline reproduction, and it PASSED before this record was written. The
    residual 6.1 bits is identical at all six cells; the two candidate
    explanations, to be settled in the audit, are (i) the dropped
    (1 + n~/m~) and + m~ terms of the specification's BW1 formula and (ii) a
    fixed number of matrix-vector products per Wiedemann invocation (the
    specification elsewhere criticises CryptographicEstimators for "assuming
    that the Wiedemann algorithm requires 3N matrix-vector products, when the
    block-Wiedemann algorithm with proper parameter choice can require
    <= 1.75 N"), plus a possible field-operation-to-something conversion.
    2^6.1 is about 68.6, which is not 3, not 1.75, and not any obvious product
    of them -- so the residual is genuinely unexplained and worth one page.

    THE PUBLISHED TABLES, TRANSCRIBED (re-verification is stage 0):
      Table 16, q=256: WXL  (n=48) k=3  D=22 log2N=57.9 log2|A|=68.0  cost 157.0
                       WXL  (n=72) k=5  D=28 log2N=79.6 log2|A|=90.8  cost 217.5
                       WXL  (n=96) k=8  D=33 log2N=98.7 log2|A|=110.6 cost 280.4
                       PXL  (n=48) k=5  D=17 log2 alpha=36   log2|A|=86.5  cost 148
                       PXL  (n=72) k=7  D=24 log2 alpha=54.6 log2|A|=128.9 cost 216
                       PXL  (n=96) k=9  D=30 log2 alpha=73   log2|A|=169   cost 283
      Table 17, q=16:  WXL  (n=56) k=13 D=13 log2N=40.8 log2|A|=50.7 cost 150.6
                       WXL  (n=84) k=17 D=19 log2N=62.2 log2|A|=73.5 cost 210.8
                       WXL  (n=116)k=24 D=24 log2N=81.9 log2|A|=94.0 cost 278.9
                       PXL  (n=56) k=12 D=14 log2 alpha=32   log2|A|=79.3  cost 142.8
                       PXL  (n=84) k=17 D=19 log2 alpha=48.6 log2|A|=116.3 cost 209.3
                       PXL  (n=116)k=26 D=23 log2 alpha=62.7 log2|A|=149.2 cost 284.9
      Table 18, q=2:   Crossbred  n=160 h=3 D=13 k=31 log2N=61.7 log2|A|=75.3 cost 144
                       Crossbred  n=240 h=4 D=20 k=44 log2N=95.9 log2|A|=111  cost 213
                       Crossbred  n=320 h=3 D=27 k=56 log2N=130  log2|A|=145  cost 282
                       Crossbred+ n=160 h=86  D=5  k=26 log2|A|=37.3 cost 147
                       Crossbred+ n=240 h=122 D=8  k=38 log2|A|=54   cost 216
                       Crossbred+ n=320 h=160 D=11 k=51 log2|A|=70.4 cost 285
                       Dinur 1st  n=160 n1=39 Space 129 cost 160
                       Dinur 1st  n=240 n1=58 Space 190 cost 223
                       Dinur 1st  n=320 n1=80 Space 248 cost 283
                       Dinur 2nd  n=160 n1=34 Space 107 cost 148
                       Dinur 2nd  n=240 n1=49 Space 158 cost 214
                       Dinur 2nd  n=320 n1=64 Space 208 cost 280

    THE BINDING-ROW OBJECT, EVALUATED ON THE PUBLISHED TABLE (derived here by
    inspection, to be recomputed in the audit):
      q=2   L1: min = Crossbred 144  (space 2^75.3)
      q=2   L3: min = Crossbred 213  (space 2^111), next Dinur2nd 214 at 2^158
      q=2   L5: min = Dinur 2nd 280  (SPACE 2^208), next Crossbred 282 at 2^145
      q=16  L1: min = PXL 142.8 (2^79.3), next WXL 150.6 (2^50.7)
      q=16  L3: min = PXL 209.3 (2^116.3), next WXL 210.8 (2^73.5)
      q=16  L5: min = WXL 278.9 (2^94.0), next PXL 284.9 (2^149.2)
      q=256 L1: min = PXL 148 (2^86.5), next WXL 157.0 (2^68.0)
      q=256 L3: min = PXL 216 (2^128.9), next WXL 217.5 (2^90.8)
      q=256 L5: min = WXL 280.4 (2^110.6), next PXL 283 (2^169)
    In six of nine levels the binding row is the higher-memory one, and in the
    q=2 Level V case it is a row the specification's own prose calls impractical
    for exactly that reason ("we expect the space requirements to make the
    algorithm completely impractical" is written of Dinur's first algorithm; the
    second is the one that binds, at 2^208 bits).

    THE RE-COSTING, WHICH IS THE EXPERIMENT. For a menu of declared cost models
    -- (M0) time only, reproducing the table; (M1) time subject to a hard memory
    ceiling C, rows above C excluded, C swept over 2^40, 2^60, 2^80, 2^100;
    (M2) Wiener AT^2, score = log2 T + (1/2) log2 M as a lower-bound proxy with
    its assumptions declared; (M3) a memory-access penalty, score = log2 T +
    c*log2 M with c in {0, 0.1, 0.25} -- report the binding row and the binding
    cost per level. The DELIVERABLE IS THE PERMUTATION TABLE, not a single
    number, and the headline is the count of levels at which the binding row
    changes. Also derived per level: the margin against lambda, and separately
    against the classical gate-count bar for the corresponding AES key search,
    which is RECALLED AS 2^143 / 2^207 / 2^272 and is UNVERIFIED -- retrieving
    the NIST call document (whose URL the specification's own bibliography
    carries) and reading the bar is a declared stage, not an assumption.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals
      - ledger/evidence
      - knowledge/techniques
      - knowledge/open-problems
      - experiments/
    grep_results:
      - >-
        No experiment or evidence record in this corpus charges memory for any
        MQ solving algorithm. KN-OPEN-004 records that the Newton polytopes and
        mixed volumes of the UOV / MAYO / QR-UOV / SNOVA / MQOM public maps have
        never been computed here, which is a different and adjacent gap.
      - >-
        The AT^2 machinery exists in this corpus (KN-TECH-035, -044, -050, -057)
        and GOAL-ICEX-001, the program's own charging vehicle, is active and has
        never executed.
      - >-
        No prior record reproduces any scheme's published attack table from its
        own stated series.
    conclusion: >-
      New within this corpus. NOT claimed novel externally: re-costing published
      MQ estimates under memory constraints is an obvious move and may well
      exist in the literature; the specification itself criticises
      CryptographicEstimators for overestimating Crossbred's SPACE complexity,
      which shows the designers are aware of the axis. The novelty that matters
      here is that THIS PROGRAM has never done it and that the goal asks for it.

  literature_context:
    - >-
      READ (primary, this session, lossy extraction): MQOM v2.1 specification,
      Sections 4.2, 4.2.3 and Tables 16, 17, 18. Source of every number above.
    - >-
      READ (primary, this session): https://mqom.org/resources.html lists v2.1
      (2025-09-22) as the latest specification and v2.0 as the Round-2
      submission. NO ROUND-3 SPECIFICATION EXISTS PUBLICLY as of this session
      (Round-3 tweaks due 2026-08-14). All scope is v2.1.
    - >-
      NOT READ, named by the specification and load-bearing for its own
      estimates: [FK24] the Polynomial-XL algorithm; [JV17] Joux-Vitse
      Crossbred; [Din21a,b,c] Dinur's algorithms; [BFS+13] BooleanSolve
      (asymptotic 2^(0.792 n)); [BFP09, BFP12] the hybrid method; [CG23] for the
      solving-degree definition; [Bou24] for the 20-cycles-per-bit-operation
      Moebius penalty. None of these was retrieved. Every claim attributed to
      them here is the SPECIFICATION'S characterisation of them, not this
      record's, and is labelled as such.
    - >-
      IMPORTANT AND VERIFIED IN THE EXTRACTED TEXT: the specification states
      that it developed its OWN estimator for Crossbred ("we have developped our
      own estimator"), that this estimator is unpublished, that
      CryptographicEstimators v2.0.0 (git commit 0d9bd3f925e) is wrong in FOUR
      named ways (overestimates space by assuming dense representation;
      underestimates the exhaustive-search phase by assuming n^omega linear
      algebra on tiny matrices; overestimates by ignoring external hybridation;
      overestimates by assuming 3N matrix-vector products rather than <= 1.75 N),
      and that the q=2 tables also use an UNPUBLISHED trick called Crossbred+
      based on [MPG13, Proposition 3]. The specification quotes
      CryptographicEstimators giving 151.17 (and 150.43 with h=3) for
      MQEstimator.MQProblem(n=160, m=160, q=2), against its own Table-18
      Crossbred figure of 144. THE BINDING SECURITY NUMBER FOR THE q=2 SETS
      THEREFORE RESTS ON AN UNPUBLISHED ESTIMATOR AND AN UNPUBLISHED ALGORITHM,
      with the public estimator differing by 7 bits in the conservative
      direction. That is a measurement-provenance fact, it is stated openly by
      the designers, and it is exactly the "attack the measurement" target this
      program is supposed to prefer.

  lossy_projection_identifiability_audit:
    projection: >-
      Full algorithm-and-parameter description of an MQ attack --> the pair
      (binding row identity, its memory exponent), plus a scalar cost.
    what_is_discarded: >-
      The entire algorithm: its correctness argument, its success probability,
      its data structures, its practical implementability. Two structurally
      unrelated algorithms with the same (cost, space) pair are identified.
    why_genuinely_lossy: >-
      Genuinely lossy and irreversibly so: Dinur's second algorithm and
      Crossbred+ at q=2 Level V have costs 280 and 285 and spaces 2^208 and
      2^70.4; from those four numbers neither algorithm is recoverable.
    why_compatible_with_the_operations: >-
      Compatible with the operation that matters -- taking a minimum over rows
      and re-taking it under an added cost axis -- because that operation reads
      only the retained coordinates. The retained part propagates
      deterministically under any monotone cost model.
    is_it_only_a_change_of_coordinates: >-
      NO. Reducing an algorithm to (cost, space) discards everything and cannot
      be inverted. THE FAILURE MODE CHECKED FOR IS THE MIRROR ONE, constancy
      across instances: does the binding row ever change, or is it the same row
      everywhere so that the object has zero comparator spread? IT IS NOT
      CONSTANT, and that is checkable from the published table before any work:
      the binding row is Crossbred at q=2 L1 and L3 but Dinur 2nd at q=2 L5, and
      PXL at q=16 L1 and L3 but WXL at q=16 L5. The observable already varies
      across the nine published levels under the trivial model M0, so it has
      nonzero spread before any memory charge is applied. That is the check, and
      it returned "not constant".

  assumptions:
    - >-
      That the extracted Tables 16, 17, 18 are faithful. Stage 0 re-verifies
      every cell against the rendered PDF; a single transposed column would
      change the binding-row analysis and the audit halts if one is found.
    - >-
      That the reconstruction's cost formula is the specification's, up to the
      constant residual. This is NOT assumed -- resolving the 6.1 bits is a
      declared deliverable, and until it is resolved the reconstruction is used
      ONLY for (k, D), where it is exact, and never for a cost claim.
    - >-
      AT^2 and memory-access penalties are declared MODELS, not facts. No claim
      is made that any of them is the right accounting for block Wiedemann; the
      deliverable is the permutation table indexed by model, which is honest
      under every model simultaneously.

  predictions:
    - metric: >-
        kd_reproduction: number of the six q=16 / q=256 cells whose published
        (k, D) is reproduced exactly by minimising the reconstructed cost over k
        using the specification's own series
      direction: higher
      minimum_effect: >-
        EXACTLY 6 of 6, both coordinates. Derived in this session before the
        experiment. Below 6 means the series or the hybrid framing was misread.
    - metric: >-
        cost_residual_spread: max minus min of (published cost - reconstructed
        cost) over the six cells, in bits
      direction: lower
      minimum_effect: >-
        BELOW 0.2 bits, around a common value of about 6.1. Derived in this
        session. A spread above 0.2 means the residual is parameter-dependent,
        the reconstruction is wrong in a way that matters, and no re-costing may
        be built on it.
    - metric: >-
        undefined_solving_degree: number of the nine (q, n=m) MQOM parameter
        sets at which the specification's series has a nonpositive coefficient
        a_d for some d <= 400 with k = 0
      direction: lower
      minimum_effect: >-
        EXACTLY 0 of 9. Forced by the identity
        (1-z^2)^n/(1-z)^(n+1) = (1+z)^n/(1-z) giving a_d = sum_{j<=d} C(n,j) > 0.
        Verified this session to d = 60; the experiment extends to d = 400. A
        single nonpositive coefficient falsifies the identity and the citation
        hygiene rule it supports.
    - metric: >-
        binding_row_changes: number of the nine security levels at which the
        minimising row under model M1 (hard memory ceiling 2^80) differs from
        the minimising row under M0 (time only)
      direction: higher
      minimum_effect: >-
        AT LEAST 2 of 9. Derived from the published table by inspection: at
        q=2 L5 a 2^80 ceiling excludes Dinur 2nd (space 2^208) and Dinur 1st
        (2^248), moving the minimum from 280 to Crossbred's 282; at q=256 L3 it
        excludes PXL (2^128.9), moving the minimum from 216 to WXL's 217.5.
        If fewer than 2 change, the transcription is wrong.
    - metric: >-
        margin_direction: sign of (binding cost under M1 at ceiling 2^80) minus
        (binding cost under M0), per level
      direction: higher
      minimum_effect: >-
        NON-NEGATIVE AT EVERY LEVEL, strictly positive at at least two.
        Charging memory can only remove rows or raise scores, so the derived
        margin can only grow. THIS IS A PREDICTION THAT MQOM LOOKS STRONGER
        under memory charging, stated before the run, and it is the honest
        direction: an audit that can only find good news about the target is
        being run precisely because this program's completion criteria reward
        the derivation, not the verdict.
    - metric: >-
        unit_statement: whether the specification states the unit (gates versus
        field operations) of the "cost" column in Tables 16 and 17
      direction: different
      minimum_effect: >-
        A BINARY ANSWER WITH A PAGE CITATION. Predicted: NOT STATED for
        Tables 16/17, STATED AS GATES for Table 18 via the explicit 20*n
        Moebius penalty. If the unit is stated somewhere this record missed,
        the unit-defect line closes and is reported closed.

  minimal_test:
    design: >-
      Five stages, cheapest first, each able to terminate.
      STAGE 0 (reading, zero compute): re-verify Tables 16, 17, 18 and the
      Section 4.2 series against the rendered PDF; record the unit statement or
      its absence; retrieve the NIST call document (URL in the specification's
      bibliography) and read the actual Category I/III/V bars rather than using
      the recalled 2^143 / 2^207 / 2^272.
      STAGE 1 (arithmetic, seconds, pure Python + math.comb only): recompute the
      series, the k=0 undefinedness check to d=400, and the (k, D) minimisation;
      report the six-cell reproduction table and the residual spread. IF THE
      REPRODUCTION FAILS, STOP -- nothing downstream is interpretable.
      STAGE 2 (one page, zero compute): resolve the 6.1-bit residual against the
      specification's stated BW1 formula. Report it resolved or unresolved; an
      unresolved residual caps every downstream statement at "the (k,D) choices
      reproduce, the costs do not".
      STAGE 3 (table transformation, seconds): compute the binding row and cost
      under M0, M1 (four ceilings), M2, M3 (three c values); report the
      permutation table and the count of levels whose binding row changes.
      STAGE 4 (reporting): margins against lambda and against the read bars,
      per level, per model, with units stated on every row.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced value derived before the run, able
        to fail: apply the identical reconstruction pipeline to a SYNTHETIC
        parameter set that is NOT in the specification -- q=16 with n=56 and
        m=112 (over-determined, twice as many equations as unknowns). FORCED
        VALUE: the optimal k must be 0 or very small and the solving degree must
        be far lower than 13, because an over-determined system has a
        nonpositive series coefficient at low degree without any guessing. If
        the pipeline returns k=13 and D=13 there too, it is responding to n
        alone and not to the (n, m) pair, and the reproduction is a coincidence
        of the search range rather than a model. Second null: q=16, n=56, m=28
        (under-determined) must give a HIGHER optimal k. Both are exact
        integer computations and both can fail.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT, where the effect MUST appear. The
        published Table 18 already contains a level at which the binding row is
        the high-memory one (q=2 Level V, Dinur 2nd at cost 280 and space 2^208
        against Crossbred at 282 and 2^145). Imposing ANY memory ceiling below
        2^208 must move that level's binding row to Crossbred and raise its cost
        to 282. IF THE RE-COSTING PIPELINE DOES NOT REPRODUCE THAT SINGLE
        HAND-CHECKABLE FLIP, THE INSTRUMENT IS BROKEN AND NO RESULT MAY BE
        REPORTED FROM STAGE 3 AT ALL.
      - >-
        GRADED CONTROL with more than three interior points, monotonicity
        reported. Sweep the memory ceiling C over 2^40, 2^60, 2^80, 2^100,
        2^120, 2^150, 2^210 and report, per level, the binding cost as a
        function of C. The prediction derived before the run: the binding cost
        is NON-INCREASING in C at every level (a larger ceiling admits more
        rows), and is exactly constant once C exceeds the largest space in that
        level's rows. A non-monotone response localises a bug in the filter; a
        response that never changes at any level means the memory axis is inert
        for MQOM and that negative is the deliverable.
      - >-
        ARCHIVE CHECK (zero compute). List every archived measurement of a
        solving degree in this corpus and state whether it applies. It does not:
        EV-DREG-001/002/004 and EV-SIG-006/008 all measure BOOLEAN CHAINED
        SEMAEV systems over GF(2) with field equations carried, at n <= 21, and
        MQOM's objects are dense random MQ over F_2/F_16/F_256 with m = n. The
        non-applicability is recorded rather than glossed.
      - >-
        VERDICT-ON-THE-NULL-FIRST. Stage 1's decision rule is executed on the
        two synthetic nulls and committed before the MQOM cells are scored.
    required_metrics:
      - the six-cell (k, D) reproduction table with published and reconstructed values side by side
      - the residual per cell and its spread
      - the k=0 series check to d=400 at all nine (q, n=m)
      - the binding-row permutation table across models M0..M3, with the count of levels changed
      - the graded memory-ceiling sweep with monotonicity reported
      - the unit of every cost column, cited to a page, or an explicit statement that the specification does not state it
      - the retrieved NIST category bars with their source, or a recorded failure to retrieve

  falsification_conditions:
    - >-
      The (k, D) reproduction failing at any of the six cells. The
      reconstruction is then not the specification's model and every downstream
      statement is void.
    - >-
      The residual spread exceeding 0.2 bits. The 6.1 constant is then an
      artifact of the six chosen cells and no cost re-derivation may be built.
    - >-
      A nonpositive series coefficient at k=0 for any MQOM (q, n=m). The
      undefinedness identity is then wrong.
    - >-
      The positive control failing: a memory ceiling below 2^208 not moving the
      q=2 Level V binding row. No stage-3 result may be reported.
    - >-
      The graded sweep showing no binding-row change at any level under any
      ceiling. The memory axis is then inert for MQOM's published table, and
      that scoped negative -- "for MQOM v2.1's published attack rows, charging
      memory changes nothing" -- is the deliverable, stated with its exact
      tested boundary (four models, nine levels, twelve rows).

  confounders:
    - >-
      EXTRACTION FIDELITY, as above. Stage 0 removes it or halts.
    - >-
      MODEL ARBITRARINESS. AT^2 and the memory-access penalty are choices, and a
      determined analyst can pick a model that produces any ordering. The
      defence is that the model menu is FROZEN IN THE CONTRACT BEFORE THE RUN
      and every model is reported, including those that change nothing.
    - >-
      UNIT CONFUSION IS THE CONFOUNDER AND ALSO THE TARGET. Comparing a q=16
      field-operation count against a gate-count bar is exactly the error being
      audited, so the audit must not commit it while performing it. Every
      reported number carries its unit or is not reported.
    - >-
      THE UNPUBLISHED ESTIMATOR. The q=2 costs come from an estimator this
      program cannot inspect and from an algorithm (Crossbred+) that is
      unpublished. No independent verification of the q=2 costs is possible from
      the specification alone, and the audit must say so rather than treating
      Table 18 as reproducible. The reproduction achieved here covers Tables 16
      and 17 only.
    - >-
      SUCCESS-PROBABILITY BOOKKEEPING. The hybrid method's k guesses succeed
      with probability q^(-k) per attempt and the cost above already multiplies
      by q^k; if the specification instead amortises over multiple solutions the
      accounting differs. This is checked as part of resolving the residual.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK. No MQ instance is solved, no key is recovered,
      no forgery is produced, and no exponent is moved. The claim tier is at most
      "derivation" and any evidence record must scope itself to the exact tables,
      models and parameter sets audited.
    - >-
      A finding that MQOM looks STRONGER under memory charging is not a
      certification of MQOM. It is a statement about one accounting axis applied
      to twelve published rows, and it says nothing about algorithms not in the
      table -- in particular nothing about any future MQ solver.
    - >-
      The k=0 undefinedness observation is a citation-hygiene rule, not a
      weakness of MQOM. It says that "MQOM's solving degree" is not a
      well-formed phrase without k, and it warns any transfer of this program's
      d_reg instrumentation away from the public map and onto the k-guessed
      sub-system.
    - >-
      Scoped to MQOM v2.1. The Round-3 specification does not exist as of this
      session.

  heuristic_assumptions:
    - id: HEUR-MQOM-COST-1
      statement: >-
        SEMI-REGULARITY. The specification's model assumes the MQ public map is
        a semi-regular sequence, so that the degree-d Macaulay rank depends only
        on (n, m, d) and not on the coefficients. Formally: for the MQOM key
        generation distribution over (A_i, b_i), for all d below the solving
        degree, rank of the degree-d Macaulay matrix equals C(n+d,d) - a_d with
        probability 1 - o(1).
      rigorous_support: >-
        The specification's own justification, quoted: the assumption "is usually
        well-verified in practice on unstructured systems, and is therefore
        standard in all the cryptographic literature". That is an appeal to
        practice, not a theorem. THIS PROGRAM HAS A SPECIFIC REASON FOR CAUTION
        AND IT IS RECORDED: the scout brief measures semi-regularity as an
        unnamed inherited assumption across 24 files and 13 experiment contracts
        in this corpus, and notes it is exactly the assumption KNOWN TO FAIL for
        summation-polynomial systems. MQOM's map is unstructured by design, which
        is the strongest case for the assumption, and that is why MQOM is also
        the right null object for the structured schemes (IDEA-20260805-7d97be).
      validation_plan: >-
        Not validated here. This proposal deliberately does NOT test
        semi-regularity; it audits the accounting that sits on top of it.
        Testing it is IDEA-20260805-7d97be's job and the two records are written
        to be run in either order.
    - id: HEUR-MQOM-COST-2
      statement: >-
        That a cost model charging memory (AT^2 or a memory-access penalty)
        better predicts realisable attack cost than a bare operation count, for
        block-Wiedemann-style computations at the reported sizes.
      rigorous_support: >-
        NONE OFFERED, and the record says so. The specification itself argues
        the opposite direction is also unclear: it notes that block Wiedemann
        "is well-known to be memory-bound or communication-bound, so the number
        of operations is not necessarily well-correlated to the actual running
        time", and reports a measured discrepancy (99.25 Gop/s for BW1/BW3
        against 260.6 Gop/s for enumeration on the same machine) which it
        attributes to memory-access cost. That measured factor of about 2.6 is
        the only empirical anchor available and it is far smaller than any AT^2
        correction.
      validation_plan: >-
        Report every model side by side and never select one. The measured 2.6x
        BW-versus-enumeration ratio from the specification is used as a declared
        sanity anchor for the smallest plausible memory penalty.

  target_complexity:
    time_exponent: >-
      No exponent is moved by this proposal and it says so plainly. The
      quantities under audit are the specification's own claimed attack
      exponents: 144 / 213 / 282 bits at q=2 for n = 160 / 240 / 320,
      142.8 / 209.3 / 278.9 at q=16 for n = 56 / 84 / 116, and
      148 / 216 / 280.4 at q=256 for n = 48 / 72 / 96. The audit's possible
      output is a revision of WHICH of these numbers binds, by a few bits, in
      the direction of larger.
    memory_exponent: >-
      The memory exponents ARE the object: 2^75.3 to 2^145 for Crossbred,
      2^37.3 to 2^70.4 for Crossbred+, 2^107 to 2^248 for Dinur, 2^50.7 to
      2^110.6 for WXL, 2^79.3 to 2^169 for PXL. Charging them is the proposal.
    best_known: >-
      As published by the designers in Tables 16-18, with the caveat that the
      q=2 rows rest on an unpublished estimator and an unpublished algorithm
      variant, and that CryptographicEstimators v2.0.0 gives 151.17 against
      Table 18's 144 for the same n=160 instance.
    hidden_overhead: >-
      Two are already identified before any run: the unexplained constant 6.1
      bits between the stated formula and the stated cost, and the unstated unit
      of the q=16 / q=256 cost column. A third is stated by the designers
      themselves: the factor-20 penalty applied to Dinur's bit-operation count
      following [Bou24], which they call optimistic.
    tradeoff_note: >-
      The table is a time-memory frontier and is never treated as one. Crossbred+
      is described by the designers as always requiring "much less space than the
      normal Crossbred and usually almost as fast" -- an explicit Pareto trade
      inside their own analysis, whose memory advantage is never scored.

  dominated_by: >-
    n/a (no result claimed): this proposal produces no attack and no cost point
    of its own, so nothing can dominate it. On the QUESTION it audits, the
    incumbent frontier is exactly Tables 16-18 of the specification, and the
    audit's product is a re-ordering of those rows rather than a new row. Rows
    checked before writing "n/a": time axis -- the twelve published rows, all
    transcribed above; memory axis -- the same twelve rows' printed space
    columns, all transcribed above; data/queries axis -- every listed algorithm
    is a direct key-recovery solver consuming zero signatures and zero oracle
    queries, so no row differs on that axis and the axis cannot reorder them.
    Corpus rows checked: no MQ cost claim of any kind exists in this corpus.
  sota_delta: >-
    Quantitatively: at the two levels identified above, imposing a 2^80 memory
    ceiling raises the derived binding cost from 280 to 282 bits (q=2 Level V)
    and from 216 to 217.5 bits (q=256 Level III), i.e. +2.0 and +1.5 bits, and
    changes which algorithm is named as the best attack at both. Across the nine
    levels the predicted aggregate is at least two binding-row changes and a
    non-negative cost shift everywhere. Separately, and independent of the
    memory question, the audit supplies something this corpus does not have at
    all: an independently reproduced (k, D) table for a NIST Round-3 candidate's
    own security analysis, exact at six of six cells, computed with no solver.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the audit produces a complete, citable binding-row permutation
    table with at least one level whose binding row changes under a declared
    memory model. That number is high because the reproduction has ALREADY been
    achieved in this session at six of six cells and the rest is table
    arithmetic. It is not higher because stage 0 could find a transposed table
    cell and because the 6.1-bit residual might resist a one-page resolution, in
    which case the cost half of the audit caps at "the (k,D) choices reproduce,
    the costs do not". Separately: 0.10 that the audit finds any level whose
    derived margin FALLS below the specification's claim -- charging a cost axis
    can only raise costs, so a fall could only come from a transcription error
    or from the unit defect resolving against the q=16 rows, and the latter is
    the one route by which this proposal could produce bad news rather than
    good. That 0.10 is not 0.00 precisely because the q=16 Level I binding
    figure, 142.8, sits within a bit of the recalled AES-128 gate bar, and the
    unit question decides which side of it the number is really on.
