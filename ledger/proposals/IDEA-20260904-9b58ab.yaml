idea:
  id: IDEA-20260904-9b58ab
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    THE MEMORY EXPONENT IS THE FROZEN SOURCE'S OWN NAMED OPEN PROBLEM AND
    IDEA-20260901-6a7a3e ALREADY BUILT THE OBJECT THAT ANSWERS IT AT THE
    BOUNDARY, THEN READ ONLY THE TIME AXIS: the alpha-stable ball has
    cardinality Theta~(X) instead of Theta(X^2), so a comparison predicate
    costing exactly p^{1/6} gives time p^{1/3+o(1)} at memory p^{1/6+o(1)} -- no
    time gain, HALF THE MEMORY EXPONENT -- and an absolute stratum detector of
    per-curve cost D^{alpha} IS a comparison predicate, which bridges that lever
    to the alpha axis at C_cmp = O(log D) D^{alpha} and puts the whole
    (time, memory) frontier on one parameter

  class: algorithm

  claim: >-
    STATED FIRST. No time exponent below 1/3 is claimed. The object at the
    centre of this record is NOT this record's -- the alpha-stable ball and its
    Theta~(X) cardinality are IDEA-20260901-6a7a3e's lever L2, read in this
    session, and the priority is entirely that record's. What is proposed here is
    three things that record does not do: read its lever on the MEMORY axis,
    supply the missing instantiation of its comparison predicate, and test the
    one assertion the whole lever rests on and which nobody has measured.

    (A) THE OPEN PROBLEM, QUOTED. The frozen source's section 1.1 states that the
    algorithm's "memory cost is essentially as high as the complexity
    p^{1/3+o(1)}, a serious obstacle for any deployment of the algorithm on
    instances of cryptographic size" and that "It is currently unclear how to
    reduce the memory cost without increasing the time." Every known way of
    trading memory down -- the van Oorschot-Wiener interpolation
    time = sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} -- INCREASES the time: at
    w = p^{1/6} it gives p^{5/12}, which is worse than p^{1/3} by a full
    exponent of 1/12. So the open problem is exactly: is there a point strictly
    inside the (time, memory) box (p^{1/3}, p^{1/3}) that is not on the vOW
    curve?

    (B) THE OBJECT THAT PUTS ONE THERE, AND WHOSE IT IS. IDEA-20260901-6a7a3e's
    T1-T2-T4 (read in full this session, lines 1-115) establish, at derivation
    tier: for the minimal conjugate isogeny phi: E -> E^{(p)} of degree d,
    alpha = Frob o phi is a trace-zero endomorphism with alpha^2 = -p*d; alpha
    descends along every alpha-stable kernel; the alpha-stable order-ell
    subgroups are the eigenlines of alpha on E[ell], so their number is
    g_ell = 1 + (-p*d / ell) for odd ell not dividing p*d and g_2 >= 1 always;
    and -- the load-bearing consequence -- the middle curve E' of ANY balanced
    split phi = eta o psi satisfies ker(psi) contained in ker(phi) contained in
    ker(alpha), so psi is an alpha-stable path and the restricted family
    "alpha-stable paths from E of degree at most X" CONTAINS the required psi
    with probability 1 while having cardinality Theta~(X) rather than Theta(X^2).
    That is a factor X = p^{1/6} fewer table entries, and 6a7a3e names its price
    correctly: enumerating the restricted family requires deciding, per
    neighbour, the comparison predicate P(E_1 | E) := [delta_{E_1} <= delta_E]
    without knowing alpha.

    (C) THE AXIS 6a7a3e DID NOT READ. Its numeric condition is stated as "the
    time exponent falls below 1/3 iff C_cmp = p^{< 1/6}", i.e. the boundary case
    C_cmp = p^{1/6} exactly is treated as a non-event. It is not a non-event. At
    C_cmp = p^{1/6+o(1)} the algorithm is
        time  = X * C_cmp = p^{1/6} * p^{1/6} = p^{1/3+o(1)},
        memory = Theta~(X) = p^{1/6+o(1)},
    which TIES the incumbent on time and HALVES ITS MEMORY EXPONENT, and which
    is off the van Oorschot-Wiener curve entirely -- vOW at w = p^{1/6} costs
    p^{5/12}, so the proposed point beats it by p^{1/12} in time at the same
    memory. That is a direct answer, at the boundary, to the exact question the
    frozen source poses in (A). A Pareto improvement on the memory axis at
    unchanged time is a first-class result under
    docs/inventor-protocol.md section 5's own accounting rules, and this program
    has never scored it because its records optimise time.

    (D) THE BRIDGE, WHICH IS THIS RECORD'S ONLY NEW MATHEMATICS AND IS TWO
    LINES. 6a7a3e leaves C_cmp uninstantiated and says no candidate exists below
    the incumbent's absolute-detection cost. But an ABSOLUTE detector -- a
    predicate Det_D(E) deciding [delta_E <= D] at per-curve cost D^{alpha}, the
    object of IDEA-20260904-ec17aa's alpha axis -- IS a comparison predicate:
        delta_E is recovered in O(log D) calls by binary search on D;
        then P(E_1 | E) = Det_{delta_E}(E_1) is ONE further call.
    Hence C_cmp <= O(log D) * D^{alpha} = p^{alpha/3 + o(1)} at D = p^{1/3}, and
    substituting into (C):
        time  = p^{1/6 + alpha/3 + o(1)},   memory = p^{1/6+o(1)}.
    Read this off against alpha:
        alpha = 1   (incumbent's own detection cost): time p^{1/2}. WORSE than
                    the incumbent in time, better in memory -- a genuine but
                    unattractive point, and it must be reported.
        alpha = 1/2: time p^{1/3}, memory p^{1/6}. THE (C) POINT.
        alpha < 1/2: BOTH exponents below the incumbent's.
        alpha = 1/4: time p^{1/4}, memory p^{1/6}.
    So 6a7a3e's C_cmp threshold p^{1/6} is exactly alpha = 1/2, and the two
    program levers -- the alpha axis and the alpha-stable ball -- turn out to be
    the same one-parameter family viewed on two axes. Neither record states this.

    (E) WHAT IS ACTUALLY BEING PROPOSED FOR TEST, AND WHY IT IS CHEAP. Not an
    algorithm: the ingredient (a sub-linear absolute detector) does not exist and
    this record does not claim it does. What is proposed is the measurement that
    decides whether the lever is real BEFORE anyone spends a session hunting the
    detector, and it is a measurement nobody has run: 6a7a3e's claim that the
    alpha-stable ball CONTAINS a balanced split with probability 1 and has
    cardinality Theta~(X) is a derivation, and derivations about lattice
    stability under descent are exactly the kind that fail at the boundary
    (non-cyclic phi, alpha non-primitive at ell where g_ell jumps to ell + 1,
    d not coprime to p, and the vertices with extra automorphisms). The four
    committed toy graphs at p in {2437, 3889, 5737, 7333} carry ARCHIVED delta_E
    labels and are small enough to enumerate the whole ball, so both quantities
    are exactly computable, with a null, in minutes.

    (F) NOT CLAIMED. No detector. No time exponent below 1/3. No statement that
    C_cmp = p^{1/6} is achievable. The memory point of (C) is CONDITIONAL on an
    object that does not exist, and the record's honest expected outcome is
    either a confirmed lever with a measured cardinality exponent, or a boundary
    failure that scopes 6a7a3e's L2 to the vertices where it holds.

  mechanism: >-
    TRACKED OBJECT: the ALPHA-STABLE SUB-BALL of the smooth ball -- the set of
    smooth-degree isogeny paths out of E whose every step is an eigenline of the
    (unknown) orientation alpha -- carried as a SUBSET of Wesolowski's table
    L(E, X, B), together with the per-step decision that selects it.

    LOSSY-PROJECTION TEST (algebraic, zero compute, and the loss is the entire
    point). The full table L(E, X, B) records every smooth path of degree at
    most X; the projection keeps only the alpha-stable ones. It is drastically
    lossy: Theta~(X) entries survive out of Theta(X^2), so a fraction X^{-1} =
    p^{-1/6} of the object is retained, and what is discarded -- every path that
    is not an eigen-path of alpha -- cannot be recovered from what is kept.
    Crucially, what is discarded is discarded COMPATIBLY with the operation the
    algorithm applies, namely composition of isogeny steps: by 6a7a3e's T2,
    alpha descends along a stable step, so the stable-ness of a path is
    determined step by step and the retained set is closed under prefixes. That
    is what makes the retained part propagate deterministically and is why this
    is an object rather than a re-coordinatisation. Contrast the projection that
    FAILS this test and which a careless version of the same idea would use:
    keeping only paths of prime-power degree loses nothing about alpha and
    changes no cost, because the split lemma already ranges over all
    factorisations.

    THE ALGORITHM, STATED SO IT CAN BE PRICED. (1) Recover d = delta_E by binary
    search with the absolute detector, O(log p) calls, cost p^{alpha/3+o(1)}.
    (2) Grow the stable ball from E breadth-first: at each frontier curve and
    each prime ell <= B, evaluate the comparison predicate on the (ell + 1)
    ell-neighbours and keep those with delta <= d. By T2 the surviving count is
    g_ell in {0, 1, 2} generically, so the frontier grows by a bounded factor
    per degree and the ball has Theta~(X) entries. (3) Key the surviving
    codomains and look up the Frobenius conjugates, exactly as Algorithm 2 does.
    (4) On a hit, compose and pull back through the outer walk exactly as
    Algorithm 3 does. Steps (3) and (4) are unchanged from the frozen source;
    only the table is smaller.

    WHY THE TABLE SHRINKS WITHOUT LOSING THE SOLUTION. The split lemma needs ONE
    pair (psi, chi) with psi a prefix of phi. Every prefix of phi is
    alpha-stable, so it survives the projection. The X^2 - X entries thrown away
    are paths that could never have been the prefix. This is the rare case where
    a restriction is complete by construction rather than by a probability
    argument, and it is 6a7a3e's T4 observation, not this record's.

