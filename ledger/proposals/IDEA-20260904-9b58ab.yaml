  null_object_control: >-
    NULL OBJECT ONE (blocking, and it is the decisive one): the RANDOM FILTER of
    matched selectivity. Replace the alpha-stability predicate by a random filter
    keeping the same expected number of the ell + 1 branches. Predicted: table
    size indistinguishable from the treatment arm (any filter of equal
    selectivity gives the same count) and success rate collapsing to at most the
    ambient stratum rate. If BOTH arms succeed, the measurement is seeing
    selectivity rather than stability and no conclusion may be drawn -- this is
    the control that separates "we pruned" from "we pruned the right thing".
