  assumptions:
    - >-
      6a7a3e's T2 is correct as a derivation: alpha descends along alpha-stable
      kernels with the same reduced norm and trace, and the descended
      endomorphism remains inseparable. This is assumed, not re-derived, and its
      failure would empty the record.
    - >-
      The minimal conjugate isogeny phi has cyclic kernel (frozen source Lemma
      3.4 argues this from minimality), so every prefix is a genuine step in the
      isogeny graph and the alpha-stable ball is a subgraph rather than a
      multiset with collapses.
    - >-
      The comparison predicate is evaluated on the FULL neighbour set at each
      step, so the enumeration is complete relative to the predicate's answers; a
      predicate with one-sided error would prune the true prefix and is excluded
      by construction here (a predicate with only FALSE-POSITIVE error is
      admissible and merely enlarges the ball, which is confounder C3).
    - >-
      Memory is counted in table entries of O(log p) bits, matching the frozen
      source's own convention in section 4.1 (M = Psi(X,B) X entries).

  proof_search_map:
    bottleneck: >-
      The size of the table that Algorithm 2 must materialise, which is
      Theta(Psi(X,B) X) = p^{1/3+o(1)} and which equals the memory cost. Removing
      the factor X from it -- not the factor Psi(X,B), which smoothness already
      handles -- is what changes the memory exponent.
    baseline_embedding:
      parameter_slice: >-
        C_cmp = Theta(X) = p^{1/6}, i.e. the comparison predicate is evaluated by
        enumerating the full ball. Then time = X * C_cmp = p^{1/3} and memory is
        forced back to p^{1/3} because the predicate materialises the full ball,
        and the algorithm degenerates EXACTLY to Algorithm 2. That degeneration
        is the required embedding: the incumbent is the point where the
        comparison predicate is implemented by the table it was meant to replace.
      reproduction_check: >-
        Frozen fixture, symbolic plus toy. Symbolic: substituting
        C_cmp = Theta(X), X = B^{1/2}(p/2)^{1/6} must return exactly the frozen
        source's Lemma 3.3 runtime and Lemma 3.2 table size. Toy: at the four
        committed primes, an implementation of the restricted enumeration with
        the predicate replaced by "always true" must produce a table whose size
        equals the full L(E, X, B) computed independently, entry for entry.
    observation_collision:
      observable: >-
        The comparison predicate's answer bit P(E_1 | E) = [delta_{E_1} <=
        delta_E], and downstream, the identity of the surviving frontier.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IT IS THE MAIN RISK. P returns true for two
        genuinely different reasons: (i) E_1 = E/K with K an alpha-stable line,
        which is the wanted case; (ii) E_1 happens to carry an UNRELATED small
        conjugate isogeny of its own, i.e. delta_{E_1} <= delta_E by accident.
        The ambient rate of (ii) is Pr[delta <= d] = Theta(d^{3/2} p^{-1/2}),
        which is Theta(1) at d = p^{1/3} -- SO AT THE OPERATING POINT THE
        ACCIDENTAL CASE IS NOT RARE, AND THE PREDICATE MAY NOT PRUNE AT ALL.
        That is the single most likely way this lever dies, it is measurable
        exactly on the toy graphs, and it is prediction P2. The separating
        condition, if one exists, is that (i) preserves the ORIENTATION CLASS
        (the same d, the same Z[sqrt(-p*d)]) while (ii) generically does not, so
        the predicate should be strengthened from [delta_{E_1} <= delta_E] to
        [delta_{E_1} = delta_E] -- an equality test, which is strictly more
        information and may be strictly more expensive. Recording that the
        predicate 6a7a3e names may have to be strengthened is part of this
        record's contribution.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve more state than the final goal needs: carry the plateau label
          (d, [alpha mod ell]) along the enumeration rather than only the
          codomain, because that stronger state is what survives the recursion
          down the stable ball and is what distinguishes case (i) from case (ii)
          in the observation collision.
        predicted_gain: >-
          Turns the >= predicate into an = predicate and removes the accidental
          branch. Cost: the label is not computable from the curve without alpha,
          so the transform is only available to an ORACLE-model analysis, and
          saying so is part of the deliverable rather than a gap to hide.
      - transform: representation_reduction
        proposed_object: >-
          Move "grow the table" into "grow the alpha-stable subgraph", where the
          hypothesis is the exact eigenline condition alpha(K) contained in K.
          Encoding: paths become eigen-paths. Completeness: exact, by 6a7a3e T4.
          Soundness: exact. Transfer: C_cmp. Cost loss: exactly the factor
          C_cmp/1 per node, charged in full and never absorbed.
        predicted_gain: >-
          memory X instead of X^2, i.e. p^{1/6} instead of p^{1/3}; time
          X * C_cmp instead of X^2.
    quantifier_order: >-
      FOR ALL p, FOR ALL supersingular E/F_{p^2}, IF THERE EXISTS a family of
      predicates {P_D} computable in time p^{alpha/3+o(1)} from the pair of
      curves alone -- NOT depending on E's endomorphism ring, NOT depending on
      alpha, and NOT depending on the instance beyond its input -- THEN the
      alpha-stable enumeration runs in time p^{1/6+alpha/3+o(1)} and memory
      p^{1/6+o(1)}. THE QUANTIFIER ORDER IS THE WHOLE DIFFICULTY, exactly as in
      the sibling record: a predicate allowed to depend on alpha is free and
      useless (it is the answer), and 6a7a3e's own statement that no candidate
      exists below the incumbent's detection cost is a statement about this
      order. NOT CLAIMED: that any such family exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an ORACLE-MODEL complexity, "given a comparison oracle of cost
        C, the algorithm costs (X*C, X)", verified end to end at toy scale with
        the oracle supplied from ground truth; plus the measured cardinality
        exponent of the alpha-stable ball and the measured false-positive rate of
        the >= predicate. It can NEVER certify that a predicate exists, and it
        certifies nothing at all about the time exponent, which does not move
        unless alpha < 1/2.
      nearby_object_control: >-
        THE OBJECT WHERE THE CONCLUSION IS KNOWN FALSE: an unrelated fixed target
        j_0 in place of j^p. There no orientation identity holds -- Frob o phi is
        not an endomorphism, alpha does not exist, there is no eigenline
        structure, and the "stable ball" is undefined. Running the enumeration
        with the predicate replaced by an equally-selective RANDOM filter must
        reproduce the cardinality exponent 1 (any filter keeping O(1) of ell+1
        branches does) but must FAIL to contain the required prefix -- so the
        end-to-end success rate must collapse while the table size does not.
        A method that reports both a small table AND success under the random
        filter has not identified the load-bearing structure and every number is
        void.
    proof_obligations:
      - claim: >-
          #(alpha-stable smooth ball of radius X) = Theta~(X), against Theta(X^2)
          for the full ball.
        responsibility: size
      - claim: >-
          Every balanced split prefix psi of the minimal phi is alpha-stable,
          hence in the restricted family. Completeness, probability 1.
        responsibility: correctness
      - claim: time = Theta~(X * C_cmp), memory = Theta~(X).
        responsibility: runtime
      - claim: memory is Theta~(X) entries and no auxiliary structure of larger size is needed.
        responsibility: memory
      - claim: >-
          C_cmp <= O(log D) * (absolute detector cost D^{alpha}), the bridge of
          claim (D).
        responsibility: interface
      - claim: C_cmp = Theta(X) degenerates to Algorithm 2 exactly.
        responsibility: baseline
      - claim: >-
          The >= predicate has a false-positive rate equal to the ambient
          Pr[delta <= d], which at the operating point is Theta(1); the = variant
          is what prunes.
        responsibility: strictness
      - claim: >-
          Oracle-model only; no claim that a predicate exists, no time-exponent
          claim, no deployed-parameter claim.
        responsibility: scope

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: van Oorschot-Wiener and distinguished
      points (the standard memory answer, and the one the frozen source already
      spends); quantum memory reduction (eprint 2026/1821 covers Grover and Tani
      and this session screened that out); the smooth-ball parameter variants
      (radius enlargement in 056e9d, divisor split in 1f5a62); the polynomial
      detector object (22428d).
    tracked_object: >-
      The alpha-stable sub-ball -- PRIORITY IDEA-20260901-6a7a3e, lever L2.
    lossiness: >-
      Retains p^{-1/6} of the full ball; what is discarded cannot be recovered;
      what is retained is prefix-closed and propagates step by step under
      composition, which is the compatibility the test requires.
    propagation: >-
      One step is defined and measurable: from a frontier curve, the ell + 1
      neighbours reduce to g_ell in {0, 1, 2, ell+1} survivors by the Kronecker
      rule. The branching factor is the measurable quantity and its geometric
      mean over ell <= B is what makes the cardinality Theta~(X) rather than
      Theta(X^2).
    newness_score: >-
      LOW as an object -- it is 6a7a3e's. The memory reading, the bridge, and the
      falsification of the derivation are what is new here, and the record says
      so rather than repackaging.
    testability_score: >-
      Very high: both load-bearing quantities are exactly computable on graphs
      the program has already committed, with archived delta labels.
    survival_score: >-
      The object survives as long as alpha exists, i.e. for every supersingular
      curve. It degenerates at the vertices 6a7a3e itself flags -- alpha scalar
      mod ell (g_ell = ell + 1, no pruning at all), ell dividing d, extra
      automorphisms at j = 0 and 1728 -- and measuring how large that degenerate
      set is at the operating point is prediction P3.

  predictions:
    - metric: >-
        P1 -- fitted exponent c in #(alpha-stable ball of radius X) = Theta(X^c),
        measured by exhaustive enumeration on the four committed toy graphs with
        alpha supplied from ground truth
      direction: lower
      minimum_effect: >-
        Predicted c = 1.0 +/- 0.15 against c = 2.0 +/- 0.15 for the unrestricted
        ball measured on the identical graphs. A fitted c above 1.5 refutes
        6a7a3e's L2 cardinality claim at the tested scope and empties the memory
        reading; a c between 1 and 1.5 scopes the gain to a smaller exponent
        which must then be reported instead of 1/6.
    - metric: >-
        P2 -- false-positive rate of the predicate [delta_{E_1} <= delta_E],
        i.e. the fraction of surviving neighbours that are NOT alpha-stable,
        measured against ground-truth stability
      direction: higher
      minimum_effect: >-
        Predicted to be LARGE and to be the lever's main risk: at the operating
        point d ~ p^{1/3} the ambient rate Pr[delta <= d] is Theta(1), so the
        >= predicate may prune almost nothing. If the measured false-positive
        rate exceeds 0.5 at the toy primes and does not fall as p grows across
        the four, the >= predicate is NOT the right one and the record's
        strengthened = predicate becomes mandatory, with its cost re-derived. A
        measured rate below 0.1 with a falling trend in p is the favourable
        branch.
    - metric: >-
        P3 -- fraction of vertices at which alpha is scalar mod ell for some
        ell <= B, i.e. where g_ell = ell + 1 and the predicate prunes nothing
      direction: lower
      minimum_effect: >-
        Predicted O(1/ell) per prime and o(1) in aggregate. A fraction above 0.2
        in aggregate at the toy primes means the branching factor is not bounded
        and the Theta~(X) cardinality is a statement about typical vertices only,
        which must then be stated as such.
    - metric: >-
        P4 -- end-to-end success rate of the restricted enumeration in finding a
        balanced split of the minimal phi, on every vertex of each toy graph
      direction: higher
      minimum_effect: >-
        Predicted EXACTLY 1.0 (6a7a3e T4 asserts probability 1). Any vertex where
        the restricted family misses the split is a counterexample to the
        completeness derivation and is the most valuable single outcome of the
        test, because completeness is the one thing the lever cannot survive
        losing.
    - metric: >-
        P5 -- table size and success rate under the RANDOM-FILTER null with
        matched selectivity
      direction: different
      minimum_effect: >-
        Table size must match the treatment arm within a factor 2 (any filter of
        the same selectivity gives the same size), while success rate must
        collapse to at most the ambient rate. Equal success rates in both arms
        means the measurement is seeing selectivity and not stability, and the
        run is a controlled null.

  minimal_test:
    design: >-
      ALL OF IT RUNS AT TOY SCALE ON GRAPHS THE PROGRAM HAS ALREADY COMMITTED,
      AND IT IMPLEMENTS NO ATTACK. Stage 0 (zero compute): write the bridge (D)
      and the symbolic baseline embedding C_cmp = Theta(X) -> Algorithm 2, and
      freeze both as fixtures. Stage 1 (minutes): at p in {2437, 3889, 5737,
      7333}, for every vertex, compute alpha from the archived delta labels plus
      the quaternion side, enumerate the FULL smooth ball and the ALPHA-STABLE
      ball for radii X up to the graph's diameter, and fit P1. Stage 2 (minutes):
      compute the ground-truth stability of every neighbour and score P2 and P3.
      Stage 3 (minutes): for every vertex, check whether the restricted family
      contains a balanced split of the minimal phi, scoring P4 vertex by vertex
      and reporting every exception individually rather than as a rate. Stage 4
      (minutes): the random-filter null and the unrelated-target null, scoring
      P5. NOTHING IS RUN AT CRYPTOGRAPHIC SIZE and no detector is implemented.
    controls:
      - >-
        RANDOM-FILTER NULL (blocking). Replace the stability predicate by a
        random filter keeping the same expected number of branches. Table size
        must match; success rate must collapse. This is the control that decides
        whether the effect is stability or mere selectivity.
      - >-
        UNRELATED-TARGET NULL (blocking). Fixed unrelated j_0 in place of j^p,
        where alpha does not exist. The enumeration must have no completeness
        property at all there. Shared with IDEA-20260904-ec17aa and
        IDEA-20260901-22428d so the three records' nulls are comparable.
      - >-
        BASELINE FIXTURE (blocking). Predicate replaced by "always true" must
        reproduce the full table L(E, X, B) entry for entry, and the symbolic
        substitution C_cmp = Theta(X) must return Lemma 3.2 and Lemma 3.3
        exactly.
      - >-
        DECAY CHECK. The alpha-stable ball's cardinality ratio to the full ball
        must FALL like X^{-1} as X grows. A ratio flat in X is the artifact tell
        of docs/inventor-protocol.md section 3 and the run is rejected.
      - >-
        AUTOMORPHISM CONVENTION. The treatment of j = 0 and j = 1728 and of
        vertices with extra automorphisms is fixed in writing BEFORE any count is
        scored, because those vertices are where 6a7a3e's rule has its
        exceptions and a convention chosen after the fact would decide P4.
    required_metrics:
      - fitted c for the alpha-stable ball and for the full ball, per prime, with confidence intervals
      - false-positive rate of the >= predicate, per prime, with the trend in p
      - fraction of vertices with alpha scalar mod ell, per ell <= B
      - per-vertex completeness of the restricted family (P4), with every exception listed
      - table size and success rate in both null arms

  falsification_conditions:
    - >-
      F1. Fitted c >= 1.5 for the alpha-stable ball. 6a7a3e's L2 cardinality
      claim fails at the tested scope, the memory exponent 1/6 is wrong, and this
      record is superseded. Report the measured c as the obstruction quantity.
    - >-
      F2. Any vertex where the restricted family misses a balanced split. The
      completeness derivation T4 is false as stated; the lever needs a repaired
      statement and none is offered here. THIS IS THE MOST INFORMATIVE POSSIBLE
      OUTCOME and must be reported vertex by vertex.
    - >-
      F3. Random-filter null matches the treatment arm on success rate.
      Controlled null; nothing is read from the treatment measurement.
    - >-
      F4. Baseline fixture fails (the always-true predicate does not reproduce
      L(E,X,B), or the symbolic substitution does not return Lemmas 3.2 and 3.3).
      The instrument is broken; no number is quotable.
    - >-
      F5. IDEA-20260821-167fd9, once opened, already contains the memory reading.
      Then this record's only surviving content is the bridge (D), and it should
      be merged into IDEA-20260904-ec17aa rather than carried separately.
    - >-
      F6. Reference [40] (eprint 2026/1219, oriented isogeny algorithms), once
      opened, already contains alpha-stable ball enumeration. Then the record is
      novelty_status known-in-the-literature and its contribution is limited to
      connecting it to the frozen source's memory problem.

  confounders:
    - >-
      C1, THE OPERATING-POINT PROBLEM. At d = p^{1/3} the ambient probability
      Pr[delta <= d] is Theta(1), so a >= predicate is nearly vacuous exactly
      where the algorithm runs. All toy measurements are at d far below the
      analogous point, so the toy false-positive rate UNDERSTATES the problem and
      the trend across the four primes, not any single number, is the evidence.
      This is the most important limitation of the whole test and it is not
      fixable at toy scale.
    - >-
      C2. alpha is supplied from ground truth in the test and is NOT available to
      any real algorithm. Every number measured is oracle-model. The record does
      not and cannot measure the cost of the predicate; that cost is exactly the
      missing ingredient.
    - >-
      C3. A predicate with false positives but no false negatives merely enlarges
      the ball and remains COMPLETE, so the lever degrades gracefully in one
      direction and catastrophically in the other. The test must therefore
      distinguish false-positive rate (tolerable, costs table size) from
      false-negative rate (fatal, costs completeness), and report them
      separately.
    - >-
      C4. Toy graphs at p <= 7333 have diameter of order log p with tiny
      constants, so "radius X up to the diameter" covers a very short range of X
      and the fitted exponent c has wide error bars. Report intervals, not point
      estimates, and refuse to quote c beyond two significant figures.
    - >-
      C5. Memory is counted in entries. A real implementation storing paths
      rather than codomains pays an extra factor log X per entry, which is inside
      o(1) asymptotically and is NOT inside the concrete comparison against vOW.

  interpretation_limits:
    - >-
      THE CENTRAL OBJECT IS IDEA-20260901-6a7a3e'S, NOT THIS RECORD'S. Any
      write-up, decision, or synthesis quoting the p^{1/6} memory point must
      attribute the alpha-stable ball and its Theta~(X) cardinality to that
      record. This record contributes the memory reading of its boundary case,
      the detector-to-comparator bridge, and the missing validation.
    - >-
      No comparison predicate is exhibited and none is claimed to exist. The
      (p^{1/3}, p^{1/6}) point is CONDITIONAL on an object that does not exist,
      and at the incumbent's own detection cost (alpha = 1) the construction is
      WORSE in time than the incumbent by p^{1/6}. That unfavourable corner is
      stated in the claim rather than omitted.
    - >-
      Oracle-model measurements only. Nothing here is evidence about the cost of
      any predicate, and no concrete-cost table is produced or implied.
    - >-
      This record does not touch, cite, or depend on the frozen EXP-WESOVOW-001
      charging-law defect, the fitted_opt / PAPER_PAIRS anchor reconciliation,
      the P = 512 crossover, or the w = 2^80 sign. The vOW comparison used here
      is the frozen source's own section 1.1 formula p^{1/2+o(1)}/w^{1/2}
      evaluated symbolically at w = p^{1/6}, and nothing else.
    - >-
      SURVIVOR SCOPE. No torsion images are used or assumed anywhere; the target
      publishes none. Academic and defensive analysis only.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random supersingular E/F_{p^2} with delta_E = d, and for
        primes ell <= B not dividing 2*p*d, the number of alpha-stable
        order-ell subgroups is 1 + (-p*d / ell) with the Kronecker symbol
        equidistributed over ell, so the expected branching factor of the
        alpha-stable enumeration is 1 + o(1) per prime and the ball of smooth
        radius X has cardinality X^{1+o(1)}.
      rigorous_support: >-
        RIGOROUS SIDE. The eigenline count itself is exact, not heuristic: the
        characteristic polynomial of alpha on E[ell] is x^2 + p*d mod ell, so the
        number of eigenlines is 1 + (-p*d/ell) whenever alpha is not scalar mod
        ell. That is IDEA-20260901-6a7a3e's T2 and is elementary linear algebra
        over F_ell. CLASSICAL DISTRIBUTION STATEMENT IMITATED. Chebotarev /
        quadratic reciprocity equidistribution of the Kronecker symbol
        (-p*d / ell) over primes ell, which gives symbol value +1 for half the
        primes and -1 for the other half, hence mean branching
        (1/2)*2 + (1/2)*0 = 1. H1 asks only that the symbol behave for THIS
        fixed discriminant -p*d like a random quadratic character, over the
        primes ell <= B actually used.
      validation_plan: >-
        WHAT TO SAMPLE. Two things, separately, because they can fail
        independently: the symbol distribution and the realised branching.
        SYMBOL ARM, AT CRYPTOGRAPHIC SCALE AND FOR FREE. For p = 5*2^248 - 1 and
        p = 27*2^500 - 1, sample delta values d by the frozen source's own
        Deuring shortcut (random maximal orders, the two-sided ideal P of reduced
        norm p, shortest vector of Nrd/p), then compute (-p*d / ell) for every
        ell <= B with B = e^{(1/3) sqrt(log(p/2))}. This is pure integer
        arithmetic once d is in hand, so it runs at the deployed primes with no
        curve computation at all. Predicted: +1 for a fraction 1/2 + O(B^{-1/2})
        of primes, and geometric-mean branching 1 within 5 percent.
        BRANCHING ARM, AT TOY SCALE WITH GROUND TRUTH. At p in {2437, 3889, 5737,
        7333}, count the realised alpha-stable neighbours at every vertex and
        every ell in {2, 3, 5, 7}, and compare vertex by vertex against
        1 + (-p*d/ell). Predicted exact agreement except at the flagged
        exceptions (alpha scalar mod ell, ell dividing d, extra automorphisms),
        which are counted separately and reported as P3.
        TAIL CHECK. The largest observed branching factor over all vertices and
        all ell <= B, against the prediction that it equals ell + 1 exactly at
        the non-primitive vertices and 2 elsewhere. A branching factor of 3 or
        more at a primitive vertex refutes T2's eigenline count.
        PARAMETERS RECORDED: p, B, the sampled d values, the order-sampling
        method, and the automorphism convention.
        TRANSFER ASSUMPTION, STATED. The symbol arm is at deployed p but uses d
        values sampled through the Deuring correspondence, inheriting the frozen
        source's own transfer assumption; the branching arm is toy and its
        transfer to deployed p is exactly H1.
    - id: H2
      statement: >-
        The false-positive rate of the predicate [delta_{E_1} <= delta_E] --
        the probability that a NON-stable neighbour nevertheless satisfies it --
        equals the ambient stratum probability Pr[delta <= d] =
        Theta(d^{3/2} p^{-1/2}) up to a bounded enrichment factor R = O(1).
      rigorous_support: >-
        RIGOROUS SIDE. For a non-stable step, the pushforward of alpha has
        reduced norm ell^2 p d, so every vector inherited from E has degree at
        least ell^2 d; a smaller conjugate degree at E_1 must therefore come from
        OUTSIDE the image sublattice, which is the ambient event. This is
        IDEA-20260901-6a7a3e's L4 argument and it is a genuine sublattice
        statement, not a guess. CLASSICAL DISTRIBUTION STATEMENT IMITATED. The
        ternary lattice-point count Pr[delta <= d] = Theta(d^{3/2} p^{-1/2})
        (heuristic H1 of IDEA-20260904-ec17aa, itself from
        IDEA-20260829-056e9d), applied to the residual lattice as if it were a
        fresh uniform sample. R = O(1) is exactly 6a7a3e's predicted value.
      validation_plan: >-
        WHAT TO SAMPLE. At the four toy primes, over every (vertex, ell,
        neighbour) triple with the neighbour known non-stable from ground truth,
        the indicator [delta_{E_1} <= delta_E]. COMPARISON. The empirical rate
        against the ambient Pr[delta <= delta_E] computed from the same graph's
        own delta histogram -- so the comparison is internal and needs no
        asymptotic constant. The ratio is R and the prediction is R = O(1),
        specifically within [0.5, 2] at every prime. TAIL CHECK. The upper tail:
        vertices where MANY non-stable neighbours pass the predicate. If R has a
        heavy right tail the predicate's cost model is wrong even when its mean
        is right. TREND. R measured at all four primes and reported as a trend;
        an R growing with p is the favourable branch (the predicate prunes better
        at scale) and an R falling with p is fatal, and only the trend transfers.
        TRANSFER ASSUMPTION, STATED EXPLICITLY: toy primes have d far below
        p^{1/3}, so the measured regime is NOT the operating regime; this is
        confounder C1 and no toy value of R may be quoted as an operating-point
        value.

  target_complexity:
    time_exponent: >-
      p^{1/6 + alpha/3 + o(1)} where alpha is the exponent of the absolute
      stratum detector via bridge (D), equivalently X * C_cmp for a comparison
      predicate of cost C_cmp. AT THE BOUNDARY C_cmp = p^{1/6} (alpha = 1/2):
      p^{1/3+o(1)}, i.e. EQUAL to the incumbent, no time gain and none claimed.
      At alpha = 1 (the incumbent's own detection cost): p^{1/2+o(1)}, WORSE.
      Below alpha = 1/2 both exponents improve. CONDITIONAL ON AN OBJECT THAT
      DOES NOT EXIST.
    memory_exponent: >-
      p^{1/6+o(1)} table entries, against the incumbent's p^{1/3+o(1)}. THIS IS
      THE CLAIM. It halves the memory exponent and it is independent of alpha --
      the table is small whatever the predicate costs, because the predicate is
      evaluated on the frontier and its intermediate state is not stored. The
      predicate's own working memory is charged separately and is unknown, which
      is confounder C2 and a genuine gap: a predicate needing p^{1/3} scratch
      space would annul the entire memory claim, and nothing here excludes that.
    best_known: >-
      Wesolowski, time p^{1/3+o(1)} at memory p^{1/3+o(1)}, conditional on
      Heuristic 1. Udovenko eprint 2026/1575, time and memory p^{2/5+o(1)},
      unconditional (abstract level). Delfs-Galbraith, p^{1/2}(log p)^{O(1)} at
      polynomial memory, unconditional. van Oorschot-Wiener interpolation,
      p^{1/2+o(1)}/w^{1/2} at memory w -- the row this record must beat at
      w = p^{1/6}, where it costs p^{5/12}.
    hidden_overhead: >-
      The rho^{-1} = u^{u(1+o(1))} superpolynomial smoothness retry of the
      incumbent is INHERITED IN FULL and is not reduced by anything here; the
      restricted ball changes the table size, not the smoothness probability. The
      o(1) in the memory exponent hides the log X bits per entry and the
      Psi(X,B)/X smooth-density factor. The predicate's scratch memory is
      entirely outside the accounting, which is the honest gap named above.
    tradeoff_note: >-
      The proposed point (p^{1/3}, p^{1/6}) is OFF the van Oorschot-Wiener curve
      by construction, not a point on it: vOW at memory p^{1/6} costs p^{5/12},
      so the gap is p^{1/12} in time at equal memory. If the point is realised it
      also becomes a new left endpoint for a vOW interpolation of its own, over a
      claw of size p^{1/6} rather than p^{1/3}, and that re-interpolation is NOT
      derived here. Parallelisation is straightforward for the enumeration and
      the lookup; the predicate's parallelism is unknown.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES; NOT SET TO NULL.
    AS FILED, with no predicate in hand, the construction is realisable only at
    C_cmp = Theta(X), where it IS Algorithm 2 and is therefore tied, not better,
    on every axis. The comparison below is for the conditional object.
    (i) Wesolowski p^{1/3} time, p^{1/3} memory: DOMINATES the conditional object
    on TIME for every alpha > 1/2, and is dominated by it on MEMORY for every
    alpha. At alpha = 1/2 neither dominates -- the conditional object is strictly
    better on memory and equal on time, which is a genuine Pareto improvement and
    is the only reason this record exists.
    (ii) van Oorschot-Wiener at w = p^{1/6}: time p^{5/12}. DOMINATED by the
    conditional object at alpha <= 1/2 (p^{1/3} < p^{5/12} at equal memory), and
    it DOMINATES the conditional object at alpha >= 3/4. The crossover is
    alpha = 3/4, and stating it is part of the deliverable.
    (iii) Delfs-Galbraith, p^{1/2} at POLYNOMIAL memory: DOMINATES everything
    above on the memory axis by a full exponent and remains the correct choice at
    any memory budget below p^{1/6}. This row is not beaten by anything proposed
    here.
    (iv) Udovenko p^{2/5} time and memory, unconditional: dominates the
    conditional object on the ASSUMPTION axis unconditionally, and on time for
    alpha > 7/10. Listed because the assumption axis is a real axis and ignoring
    it would flatter this record.
    (v) Quantum rows (eprint 2026/1821, abstract level): Grover removing the
    memory requirement is a DIRECT competitor for this record's memory claim in a
    different cost model, and Tani's gate-memory tradeoff likewise. Neither is
    classically comparable and no quantum claim is made, but a reviewer weighing
    the value of a classical memory reduction must weigh these.
    (vi) Data/queries: all rows use zero data and zero oracle queries EXCEPT the
    conditional object, which uses X = p^{1/6} predicate calls. That is a new
    cost axis this record introduces and it is charged in the time column, not
    hidden.
  sota_delta: >-
    ON MEMORY: -1/6 in the exponent, from p^{1/3+o(1)} to p^{1/6+o(1)}, i.e. the
    memory exponent is HALVED. At the frozen source's own section 4.1 sizes this
    is illustrative arithmetic only, and is not quoted here because re-optimising
    B jointly with the restricted table is not done in this record.
    ON TIME: +0 at alpha = 1/2 (exactly tied with the incumbent); NEGATIVE
    (worse) by p^{1/6} at alpha = 1, which is the only alpha currently
    inhabited. Both are stated so the record cannot be read as a time result.
    AGAINST vOW AT EQUAL MEMORY: p^{1/12} faster at w = p^{1/6}, conditional on
    alpha <= 1/2.
    ON DATA/QUERIES: introduces p^{1/6} predicate calls where the incumbent uses
    none.
    UNCONDITIONAL DELIVERABLES, INDEPENDENT OF ANY PREDICATE: the measured
    cardinality exponent c of the alpha-stable ball (predicted 1 against the full
    ball's 2); the measured per-vertex completeness of 6a7a3e's T4 (predicted
    exactly 1.0, and a single exception would be the most valuable outcome); the
    measured false-positive rate and enrichment R; and the bridge C_cmp <=
    O(log D) D^{alpha}, which is two lines and costs nothing.

