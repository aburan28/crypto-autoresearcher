    is_exponent_moving: true
    axis: memory
    assumption_attacked: >-
      The supersingular endomorphism / OneEnd problem underlying the CGL hash and
      the SQIsign family, in the concrete regime where memory is the binding
      constraint.
    baseline: >-
      Wesolowski, frozen source Theorem 1.1 and section 1.1: time p^{1/3+o(1)},
      MEMORY p^{1/3+o(1)}; van Oorschot-Wiener interpolation time
      p^{1/2+o(1)}/w^{1/2} at memory w, which at w = p^{1/6} costs p^{5/12};
      Delfs-Galbraith p^{1/2}(log p)^{O(1)} at polynomial memory.
    target: >-
      time p^{1/3+o(1)} at memory p^{1/6+o(1)} -- memory exponent HALVED at
      unchanged time, and p^{1/12} faster than vOW at the same memory.
      CONDITIONAL on a comparison predicate of cost p^{1/6+o(1)}, equivalently an
      absolute stratum detector of exponent alpha = 1/2, which does not exist.

