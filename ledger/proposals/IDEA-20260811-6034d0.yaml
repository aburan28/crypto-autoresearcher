idea:
  id: IDEA-20260811-6034d0
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE ONLY DEGENERATION THAT WOULD SURVIVE THE LOSSY-PROJECTION TEST -
    REDUCIBILITY. Support is cost-invisible (committed: -30.8% support, -0.44%
    time at j = 0) but a summation polynomial that FACTORS on a degeneration
    locus splits the decomposition search into strictly smaller systems, which
    every solver charges for; test whether S_4 or S_5 becomes reducible, acquires
    a repeated factor, or drops its elimination-polynomial degree at any of the
    eight loci - with the expected answer NO at all eight, and a named
    obstruction O-IRREDUCIBLE if so
  class: measurement

  object: >-
    OBJ-FACT, the factorisation type of the summation polynomial as a function on
    the j-line: the multiset of degrees of the irreducible factors of S_m over
    F_p and over QQ(a,b) specialised to each locus, together with the squarefree
    part, the content, and the degree and factorisation type of the elimination
    polynomial of the m-variable decomposition system. This is a
    COEFFICIENT-VALUE object, not a combinatorial one - it is exactly what
    IDEA-20260811-97e244's observable-fibre analysis identifies as the class of
    functionals a Newton polytope cannot see.

  resource: >-
    R1 and R2. The functional is the algebraic structure of a polynomial system
    over the field, determined by the curve equation. H-ENDO-001 admissibility:
    no endomorphism acts on G; nothing here needs a non-scalar action and the
    record would be dead on arrival if it did.

  claim: >-
    (A) WHY REDUCIBILITY IS THE RIGHT FUNCTIONAL AND SUPPORT IS NOT. The lane's
    committed anomaly is that a 23-31% support drop at j = 0 and j = 1728 moves
    Groebner time by -0.44% and -0.67% and moves gb_size the WRONG WAY, +3.41%
    (red_team_notes.md section 11, committed). Support is a combinatorial shadow
    that no standard solver charges directly. REDUCIBILITY IS DIFFERENT IN KIND:
    if S_m = F * G with deg F, deg G both positive, then the decomposition
    variety is a union of two components and the solver may work on each
    separately; every Groebner, resultant and homotopy method pays for the total
    degree of the component it is on, so a genuine split changes the cost by a
    factor the cost model itself defines. Equally, a REPEATED factor makes the
    ideal non-radical, which changes the Groebner basis and the elimination
    degree, and a drop in the ELIMINATION POLYNOMIAL DEGREE is a direct reduction
    of the work in the final univariate solve. So this record proposes the three
    functionals that could actually move cost, in place of the one that provably
    does not.
    (B) THE PRE-REGISTERED PREDICTION, WHICH IS NEGATIVE. S_3 is irreducible over
    QQ(a,b) and remains irreducible at a = 0 and at b = 0; S_4 likewise at all
    six weight-12 loci. PREDICTED: no locus produces a factorisation, a repeated
    factor, or a drop in the degree of the elimination polynomial. Basis for the
    prediction: the loci were located by COEFFICIENT VANISHING, and coefficient
    vanishing that preserves the Newton polytope (the prediction of
    IDEA-20260811-97e244) generically preserves irreducibility, since
    irreducibility is generic in any fixed support class. THIS IS A PREDICTION
    THAT COULD BE WRONG AND THE RECORD IS WRITTEN TO FIND OUT.
    (C) THE ONE PLACE A POSITIVE IS PLAUSIBLE, NAMED IN ADVANCE SO IT IS NOT
    FISHING. At a = 0 (j = 0) the polynomial S_3 has all monomials of total
    degree congruent to 1 mod 3, so it is a relative invariant of weight 1 for
    the diagonal mu_3-action (this is derived and committed in
    IDEA-20260807-5ddccf claim (A)). A polynomial that is a relative invariant
    for a finite group action can factor into orbits of the action. Likewise at
    b = 0 (j = 1728) every monomial has even total degree, so S_3 is a genuine
    invariant of the diagonal sign action and is therefore a polynomial in the
    products x_i x_k and squares - a substitution that lowers degree in the new
    variables. THOSE TWO ARE THE CANDIDATES; the six weight-12 loci carry no
    known group action and are the ones I expect to be inert.
    (D) WHAT EACH OUTCOME MEANS.
      NO factorisation anywhere: the named obstruction O-IRREDUCIBLE -
        "the summation polynomials are irreducible on their own degeneration
        divisor, so no j-line degeneration splits the decomposition variety, and
        the only cost channel special j could have used is closed." Combined with
        the predicted O-INTERIOR from IDEA-20260811-97e244 this closes the
        algebraic half of RQ-JINV-8fc13a on BOTH the combinatorial and the
        component-structure axes, with arguments, which is a genuine closure at
        the inventor-protocol standard.
      A factorisation at j = 0 or j = 1728: the mu_r invariance is doing real
        work, the cost consequence must be charged end to end against the
        automorphism-discounted baseline (KN-TECH-018), and the record must
        determine whether the gain exceeds sqrt(6) - below which it is baseline
        calibration and NEVER an attack.
      A factorisation at a weight-12 locus: unexpected, unexplained by any group
        action, and the single most interesting outcome available in this lane;
        it would demand its own contract and independent replication before any
        description.

  mechanism: >-
    Specialising a polynomial to a subvariety of its coefficient space can only
    do three things to its factorisation type: nothing, split it, or make it
    non-reduced. Which occurs is decided by whether the specialisation lands in
    the discriminant of the family - the locus where the Galois group of the
    generic fibre drops. The degeneration loci were found by a completely
    different criterion (a block of coefficients sharing a factor), so a priori
    they have no reason to lie in that discriminant, which is why the prediction
    is negative. Where a FINITE GROUP acts, however, there is a reason: an
    invariant or relative invariant of a group action on a polynomial ring is
    frequently a product over orbits, and both j = 0 and j = 1728 carry such
    actions and only those two do. The mechanism therefore predicts, with a
    reason rather than a guess, which of the eight loci are candidates and which
    are not - and the experiment tests that split.

  novelty_status: adaptation
  novelty_note: >-
    Factorisation of summation polynomials is a natural question and may well be
    settled in the published literature; EXTERNAL LITERATURE NOT CHECKED, and
    until it is this record is `adaptation` and its outcome may already be known.
    Corpus grep: no record in ledger/ or knowledge/ computes the factorisation
    type or elimination degree of any S_m; EV-ICINV-6b6264 records that the
    elimination-polynomial degree and F_p-factorisation type were among the
    families NEVER COMPUTED because EXP-ICINV-e0cd8f stopped at SR3, and the
    only data that exists is a five-curve capability probe explicitly recorded as
    NON-EVIDENCE.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-5ddccf, which derives the mu_3 / sign invariance and uses
    it to build an INVARIANT REFORMULATION with a stated (2r)^{m-1} degree
    penalty; this record does not reformulate anything - it asks whether the
    ORIGINAL polynomial factors, which 5ddccf never asks. NOT
    IDEA-20260807-477e40 (support only). NOT IDEA-20260811-97e244, which tests
    the combinatorial shadow and explicitly hands the coefficient-value question
    here.
  builds_on_non_evidence_declaration: >-
    EV-ICINV-6b6264's forward_lead records that on five class members the
    elimination ideal was generated by the curve's own cubic, with splitting
    types [1,1,1] and [1,2]. THAT IS NON-EVIDENCE by its own record - five
    curves, no control, not pre-registered - and DEC-20260810-d70ece NA7 requires
    a successor contract to ANTICIPATE that the elimination family may reduce to
    the splitting type of x^3 + a x + b and say so BEFORE execution. THIS RECORD
    SAYS SO HERE: if the elimination polynomial is the curve cubic, then its
    factorisation type is a function of E(F_p)[2], which 2-isogenies do not
    preserve, so it would vary within a class for a reason with NO Semaev content
    and NO j-line content, and the contract must stratify on the root count
    r = #{x in F_p : x^3 + a x + b = 0} and report it separately rather than
    letting it masquerade as a degeneration effect.

  assumptions:
  - >-
    The degeneration loci are as catalogued in IDEA-20260811-a7c1df. This record
    re-derives them as its first gate so it does not depend on that record having
    run.
  - >-
    Factorisation over QQ(a,b) specialised to a locus is computed via a rational
    parametrisation of the locus that avoids its singular point; the
    parametrisation is declared before execution.
  - >-
    The elimination polynomial is computed from the f_V-FREE system, since the
    f_V-bearing system's elimination degree is pinned by |V| and not by the curve
    (EV-ICINV-6b6264 boundary 2). Both are reported; only the f_V-free one is a
    curve functional.

  proof_search_map:
    bottleneck: >-
      The exact bottleneck is the final univariate solve and the component
      structure of the decomposition variety. A split there changes the cost of
      relation collection; nothing else in this record would.
    baseline_embedding:
      parameter_slice: >-
        The generic curve is the baseline: S_3 and S_4 must be reported
        irreducible over QQ(a,b) with the known per-variable degrees, and the
        elimination polynomial must have the generic degree. This reproduces the
        standard picture exactly.
      reproduction_check: >-
        Symbolic irreducibility certificate for generic S_3 (two independent
        engines), and the elimination degree checked against the dense Bezout
        bound. A frozen fixture records both.
    observation_collision:
      observable: >-
        The multiset of irreducible factor degrees of S_m, plus the elimination
        polynomial's degree and F_p-splitting type.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE IN A WAY THAT MATTERS. The F_p-SPLITTING TYPE of
        the elimination polynomial is NOT a j-line function: it depends on the
        curve's rational 2-torsion, which differs between twists and varies
        inside an isogeny class. So that observable has distinct preimages on
        both sides of any class or j conclusion, and reading a splitting-type
        difference as a degeneration effect would be exactly the error
        DEC-20260810-d70ece warned against. THE SEPARATING CONDITION IS
        MANDATORY STRATIFICATION ON r, declared above.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Track the full factorisation type over the algebraic closure - including
        multiplicities and the field of definition of each factor - rather than
        the Boolean "is it irreducible". The stronger state is what survives
        specialisation to a subvariety and what distinguishes a genuine split
        from a base-field artifact.
      predicted_gain: >-
        Distinguishes "S_m factors" from "S_m factors only after a field
        extension", which is the difference between a usable split and a
        curiosity, at no extra compute.
    quantifier_order: >-
      FOR ALL eight loci L and FOR ALL m in {3,4}, S_m restricted to L is
      irreducible over the algebraic closure of the function field of L. The
      existential that would break it - THERE EXISTS a locus and an m with a
      non-trivial factorisation - is allowed to depend on m and on the locus but
      NOT on p, since the loci and the coefficients are defined over QQ; a
      factorisation appearing only mod some p is recorded as a
      characteristic-specific event and does not falsify the char-0 statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete factorisation type table for S_3 and S_4 at all eight loci,
        with elimination degrees, over QQ and over two named F_p. It CANNOT
        certify a cost consequence - even a positive would require an end-to-end
        charged comparison against the automorphism-discounted baseline before
        any cost claim, and the record refuses to make one.
      nearby_object_control: >-
        The nearby object where the conclusion fails is a polynomial DESIGNED to
        factor on a locus: construct F(a,b;x) * G(a,b;x) whose product has the
        same support as S_4 generically and whose factorisation is visible only
        on a chosen weight-12 locus. The method must find that split. If it
        cannot, every irreducibility negative it reports is void.
    proof_obligations:
    - claim: Generic S_3 and S_4 are irreducible
      responsibility: baseline
    - claim: No locus induces a factorisation
      responsibility: feasibility
    - claim: The elimination degree does not drop at any locus
      responsibility: runtime
    - claim: A planted split is detected
      responsibility: interface
    - claim: Splitting-type variation is attributed to r, not to the locus
      responsibility: scope

  predictions:
  - metric: irreducibility_of_S3_at_a0_and_b0
    direction: different
    minimum_effect: >-
      IRREDUCIBLE at both, over the algebraic closure. This is the prediction
      most likely to fail, because both carry a group action; a failure here is a
      pre-registered positive, not a surprise, and it is named in claim (C).
  - metric: irreducibility_of_S4_at_the_six_weight12_loci
    direction: different
    minimum_effect: >-
      IRREDUCIBLE at all six. Six of six is the predicted outcome; any single
      factorisation is the interesting event and must be replicated in a second
      engine before it is described.
  - metric: elimination_polynomial_degree_ratio_locus_over_generic
    direction: different
    minimum_effect: >-
      EXACTLY 1.000 at all eight loci in the f_V-free formulation. A ratio below
      1 is a direct, chargeable cost reduction and is the one result in this lane
      that would deserve escalation.
  - metric: squarefree_part_degree_ratio
    direction: different
    minimum_effect: >-
      EXACTLY 1.000 at all eight loci; a repeated factor at a locus makes the
      ideal non-radical and changes the Groebner behaviour independently of
      degree.
  - metric: planted_split_detection
    direction: different
    minimum_effect: >-
      DETECTED, 1 of 1. A miss invalidates every negative in the record.

  minimal_test:
    design: >-
      EXACT SYMBOLIC FACTORISATION, NO TIMING, NO SAMPLING. (1) Reproduce the
      generic baseline: factor S_3 and S_4 over QQ(a,b) and over F_p(a,b) for
      p in {4001, one prime above 2^20}, in two independent engines. (2) For each
      of the eight loci, substitute the declared rational parametrisation and
      factor the specialised polynomial over the function field of the locus and
      over its algebraic closure; record the full factorisation type with
      multiplicities and fields of definition. (3) Build the f_V-free m = 3
      elimination polynomial for a generic curve and for a curve on each locus at
      p = 4001, record its degree and F_p-factorisation type, and STRATIFY the
      splitting type on r = #{x : x^3 + a x + b = 0}. (4) Run the planted-split
      control and the null-locus control. (5) Report the table. THIS CONTRACT
      NEEDS NO MINIMAL FREE RESOLUTION AND NO BETTI TABLE, so the D1 backend
      precondition that paused EXP-ICINV-e0cd8f (DEC-20260810-d70ece NA3) does
      not bind it - a deliberate design choice, stated here so the contract is
      dispatchable on the host as it stands.
    controls:
    - >-
      C-PLANT-SPLIT (BLOCKING positive control). A constructed polynomial that
      factors only on a chosen weight-12 locus. Must be detected.
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci not among the eight; predicted
      irreducible at all, confirming that irreducibility is the generic outcome
      of specialising to such a locus and that a positive at one of the eight
      would be meaningful.
    - >-
      C-R-STRATIFY (BLOCKING for the elimination arm). Every elimination-splitting
      statistic is reported per r-stratum. An unstratified elimination result may
      not be cited, per the anticipation required by DEC-20260810-d70ece NA7.
    - >-
      C-ENGINE. Two independent factorisation engines must agree on every
      factorisation type. Note this is a genuinely available cross-check, unlike
      graded Betti numbers, for which the host has no independent engine at all
      (DEC-20260810-d70ece D1).
    required_metrics:
    - factorisation_type_with_multiplicities_per_locus_per_m
    - field_of_definition_of_each_factor
    - squarefree_part_degree_per_locus
    - elimination_polynomial_degree_and_splitting_type_per_locus_per_r_stratum
    - planted_split_detected_boolean
    - null_locus_factorisation_types
    - engine_agreement_count

  lossy_projection_answer: >-
    THIS RECORD EXISTS BECAUSE OF THE LOSSY-PROJECTION FAILURE, AND ITS ANSWER IS
    STRUCTURAL RATHER THAN HOPEFUL. The chain support -> polytope -> cost is
    predicted to break at the first arrow (IDEA-20260811-97e244). Factorisation
    type is NOT downstream of support: two polynomials with identical support can
    have different factorisation types, and the factorisation type is upstream of
    the component structure that every solver charges for. So it is a genuinely
    lossy projection of the coefficient vector - it discards the coefficients and
    keeps only the component degrees - and what it discards is discarded
    compatibly with the operation that matters, since factorisation type is
    preserved by field automorphisms and by the gauge action, and multiplies
    correctly under the resultant recursion. The honest caveat: this record still
    does not MEASURE cost, it measures the functional that cost is a function of,
    and it says so rather than claiming a speedup.

  t5_reachability_answer: >-
    CONDITIONAL AND PRE-DECIDED. Under the predicted negative, T5 is vacuous -
    there is no minimiser. Under a positive at j = 0 or j = 1728, T5 is answered
    by T4: you cannot walk to j = 0 unless the class has D_0 = -3, so the
    "advantage" is a curve-generation property, not an attack, and must be
    reported against the automorphism-discounted baseline. Under a positive at a
    weight-12 locus, T5 is answered by IDEA-20260811-3e08e0's census: at most
    twelve classes per p contain such a vertex, so the result would be a
    structural curiosity with density Theta(1/p) and NOT an attack, and the
    record commits to that reading in advance.

  null_object: >-
    C-NULL-LOCUS (ten random weight-12 loci, identical pipeline, predicted
    irreducible) is the matched null of the same shape; C-PLANT-SPLIT is the
    planted positive. Both are required, the second is blocking. Note that
    NULL-C, the campaign's permutation null, is IRRELEVANT here and is
    deliberately not used: this record computes no mean and no p-value, so its
    committed disqualification for within-class contrasts does not arise.

  falsification_conditions:
  - >-
    S_3 or S_4 is found reducible at any of the eight loci. The prediction is
    falsified; replicate in the second engine, determine the field of definition,
    and only then consider a cost claim.
  - >-
    The elimination-polynomial degree drops at any locus in the f_V-free
    formulation. A direct cost channel exists and the lane is live on the
    algebraic axis.
  - >-
    C-PLANT-SPLIT is not detected. Every negative here is void and the run is
    INVALID rather than negative.
  - >-
    A random locus in C-NULL-LOCUS produces a factorisation. Specialisation is
    generically splitting the polynomial and the eight loci are not special;
    the record's framing collapses and must be rewritten.
  - >-
    The two engines disagree on any factorisation type. Nothing is established
    until reconciled.

  confounders:
  - >-
    Field of definition. A polynomial irreducible over QQ can split over an
    extension; reporting "factors" without the field is meaningless and the
    contract requires the field per factor.
  - >-
    The 2-torsion splitting confound, in full. If the m = 3 elimination
    polynomial reduces to the curve cubic, its F_p-splitting type is a function
    of E(F_p)[2] and varies within an isogeny class for reasons with no Semaev
    content. Stratification on r is mandatory and blocking.
  - >-
    Parametrisation singularities, as in IDEA-20260811-a7c1df: hitting the
    singular point of a locus fabricates a degeneration.
  - >-
    Characteristic-specific factorisations. A split appearing only mod p is not a
    char-0 result and must be labelled; small p are especially prone.

  interpretation_limits:
  - >-
    Even a positive is NOT an attack. Any consequent gain is charged against the
    automorphism-discounted rho baseline (KN-TECH-018), where a factor at or
    below sqrt(6) is baseline calibration and never an attack, and against the
    reachability verdict of IDEA-20260811-3e08e0.
  - >-
    The result is about the f_V-free formulation. The deployed f_V-bearing system
    has its elimination degree pinned by |V|, so nothing here transfers to it,
    and the record states that boundary exactly as EV-ICINV-6b6264 does.
  - >-
    claim_tier toy. Two primes, m in {3,4}, one parametrisation per locus.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Irreducibility is generic in a fixed support class: for a fixed monomial
      support, the reducible polynomials form a proper closed subvariety of the
      coefficient space, so a specialisation chosen for an unrelated reason lands
      in it with probability zero.
    rigorous_support: >-
      Reducibility is a Zariski-closed condition on coefficients (the resultant
      /Noether forms cut it out), which is rigorous; the heuristic part is only
      that the degeneration loci are "unrelated" to that closed set, which is
      exactly what the experiment tests. The classical statement imitated is
      Hilbert irreducibility.
    validation_plan: >-
      Sample: the ten random weight-12 loci of C-NULL-LOCUS, plus 100 random
      points on each of the eight special loci over F_p at p = 4001 and at one
      prime above 2^20. Comparison: the fraction of sampled specialisations that
      are reducible, predicted to be 0/1080 in the null arm. Tail check: if any
      reducible case appears in the null arm, report its locus and check whether
      it is a characteristic artifact by re-testing at the second prime. Transfer
      to other p is not claimed.
  - id: H2
    statement: >-
      A polynomial that is a relative invariant of a finite group action on the
      variables is more likely than a generic polynomial of its support to factor
      into orbit products.
    rigorous_support: >-
      The mu_3 and sign invariance of S_3 at a = 0 and b = 0 respectively are
      DERIVED and committed in IDEA-20260807-5ddccf claim (A), with
      biconditionals. The link from invariance to factorisation is classical
      invariant theory but is NOT a theorem in general, and is labelled heuristic
      here rather than asserted.
    validation_plan: >-
      Direct: attempt the factorisation at a = 0 and b = 0 explicitly, in two
      engines, over QQ and over the algebraic closure. There is no distribution
      to compare against - the check is a single exact computation, and H2 is
      recorded only to justify naming those two loci as the a priori candidates
      so that a positive there is not read as fishing.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED. If a genuine split of degree d1 + d2 = d were found, the
      naive cost consequence would be a constant-factor reduction in the
      decomposition solve, NOT an exponent; the record commits in advance to
      reporting it as a constant.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant on CM curves (KN-TECH-018).
    hidden_overhead: Not applicable; no asymptotic claim is made.
    tradeoff_note: >-
      Not applicable. Any future cost claim arising from a positive would have to
      be charged in a full model with memory beside time, and that costing is
      explicitly outside this record.

  dominated_by: >-
    Every row of the attack frontier dominates - parallel rho with distinguished
    points (KN-TECH-001, KN-TECH-006), BSGS, kangaroo, prime-field index
    calculus. Checked against each. No solver is produced.
  sota_delta: ZERO on every axis.

  estimated_cost:
    implementation: low
    compute: medium
  compute_note: >-
    S_4 factorisation over a function field is the dominant cost and may be
    heavy; the stopping rule permits substituting a specialisation to a large
    prime field with a stated loss of char-0 generality, recorded rather than
    hidden.

  recommended_priority: high
  expected_value: >-
    HIGH, AND THE HIGHEST-UPSIDE PROPOSAL IN THE BATCH. Its predicted outcome is
    negative, but it is the ONLY functional in the lane whose positive would have
    a mechanically chargeable cost consequence rather than a lossy one, and its
    two a priori candidates (j = 0 and j = 1728, both carrying genuine group
    actions) are named before the data. It is also cheap, needs no resolution
    backend, and its negative composes with IDEA-20260811-97e244's negative into
    a real two-axis closure of the algebraic half of this lane. I would run it
    FOURTH, or SECOND if the coordinator prefers to front-load the single
    highest-upside test rather than the cheapest one.
