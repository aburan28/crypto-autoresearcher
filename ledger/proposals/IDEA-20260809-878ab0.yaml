idea:
  id: IDEA-20260809-878ab0
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Where did the deployed discriminant size come from? Restate the translation
    rule from RSA-modulus estimates and check whether it holds
  class: measurement
  claim: >-
    Deployed discriminant sizes appear to be derived by translating an RSA-modulus
    security estimate through a rule relating the two subexponential complexities.
    The claim is that this rule can be restated explicitly, that its inputs can be
    named, and that applying it with the measured curve from this goal gives a
    size that differs from the deployed one — or does not, which would validate
    the translation and is equally worth establishing.
  mechanism: >-
    Extract the translation rule from filed sources where stated; where it is not
    stated, reconstruct the most plausible rule and label it as this program's
    reconstruction. Apply it with both the literature's constants and this
    program's measured ones, and compare the outputs against deployed sizes.
  why_not_a_renamed_known_approach: >-
    Key-size translation tables exist across primitives. Auditing the specific
    translation behind a specific deployed choice, with the reconstruction
    labelled where the source is silent, is a documentation-and-arithmetic task
    that produces an auditable provenance chain rather than another table.
  predictions:
  - observable: whether the translation rule is stated in any filed source
    metric: categorical with citation or 'reconstructed by this program'
    predicted: >-
      Not fully stated. An unstated rule behind a deployed parameter is the
      program's recurring pattern and is the likely finding here.
  - observable: discriminant size implied by the rule versus deployed size
    metric: bits of difference
    predicted: Within a factor if the rule is right; a large difference means either the rule is misreconstructed or the deployed size came from elsewhere, and both are reportable.
  minimal_test: >-
    Audit filed sources for the rule, apply it with two constant sets, and report
    the implied sizes alongside deployed ones with every reconstruction labelled.
  controls:
  - 'RECONSTRUCTION LABELLING: any rule not read from a source is labelled as this program''s reconstruction in every sentence that uses it, since attributing a reconstructed rule to a designer would be a false statement about a document.'
  - 'TWO-CONSTANT-SET CONTROL: applying the rule with literature constants and with measured ones separates rule error from constant error.'
  falsification_conditions:
  - The rule cannot be reconstructed coherently, in which case the record reports that the provenance is undetermined.
  - Implied and deployed sizes agree exactly under both constant sets, which would suggest the translation is exactly what was done and closes the question positively.
  interpretation_limits: >-
    A provenance finding is a statement about documents and derivations, never
    about the adequacy of a parameter or about any designer's competence.
  sota_delta: 'No attack. Delta: an explicit provenance chain for a deployed parameter, or a documented gap where none exists.'
  dominated_by: Depends on IDEA-20260809-843eb6 for measured constants; not dominated by any corpus record.
  estimated_cost: Acquisition-dominated; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for parameter provenance: adjacent discipline in other goals, no records for this object. WEB NOT CHECKED.'
  source_refs:
  - VDF and accumulator construction papers with parameter recommendations -- RECALLED, REQUIRED READS.
