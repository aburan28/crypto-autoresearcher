idea:
  id: IDEA-20260813-55d3a0
  question_id: RQ-QALG-74bf20
  goal_id: GOAL-QALG-001
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  title: >-
    CRT/factorization decomposition of the CSIDH dihedral hidden-shift
    instance via the class group's own computed order, tested as a
    lossy-projection existence question
  class: mechanism

  claim: >-
    CSIDH's class-group order N = |Cl(O)| is a specific, computable integer
    (CSI-FiSh determined Cl(O) is cyclic with a fully factored order for
    CSIDH-512; other CSIDH parameter proposals have their own computable N).
    If N factors as N = N1*N2 with N1, N2 coprime and each of comparable
    bit-length to N, the CRT isomorphism Z_N ~= Z_{N1} x Z_{N2} embeds the
    dihedral group D_N as a fiber product D_{N1} x_{Z_2} D_{N2} sharing one
    Z_2 factor. This proposal asks whether a Regev-form coset-state sample
    for the D_N hidden-shift instance, when its Z_{N1}-component register is
    measured/traced out, still yields a valid, usefully biased coset-state
    sample for the smaller D_{N2} hidden-shift instance (recovering d mod
    N2), and symmetrically for D_{N1} -- i.e. whether the D_N instance is a
    lossy projection of two independently Kuperberg-solvable smaller
    instances whose combined cost is smaller than solving D_N directly.

  mechanism: >-
    Write N = N1*N2, coprime, via CRT x -> (x mod N1, x mod N2), a ring
    isomorphism hence compatible with negation, the involution generating
    each dihedral group. A D_N coset sample (|0,x> + |1,x+d mod N>)/sqrt(2),
    x uniform mod N, becomes under CRT (|0,(x1,x2)> + |1,(x1+d1 mod N1,
    x2+d2 mod N2)>)/sqrt(2) with x1=x mod N1, x2=x mod N2, d1=d mod N1,
    d2=d mod N2, and crucially the SAME coin/branch label b appears in both
    components -- the two branches of the superposition share one qubit, so
    this is not two independent samples. The candidate mechanism: measure
    the x2 register (collapsing to a value x2*) and ask what state remains
    on the (b,x1) registers. If, conditioned on x2*, the surviving (b,x1)
    state is still (up to a calculable, x2*-dependent relabeling) a valid
    D_{N1} coset sample with shift d1, then a batch of D_N samples can be
    converted, via classical CRT bookkeeping and this partial measurement,
    into a batch of genuine D_{N1} coset samples (solving for d1 by
    Kuperberg's sieve at the smaller size log2(N1)) and a separate batch of
    D_{N2} coset samples (solving for d2 similarly), with d recovered by
    CRT-recombining d1, d2.

  established_families_declared_off_limits: >-
    Per docs/inventor-protocol.md section 1: Kuperberg's sieve (KN-LIT-2c8264)
    and its collimation variant (KN-LIT-127) as applied DIRECTLY to the full
    D_N instance are the declared baseline; the Childs-Jao-Soukharev
    reduction of isogeny path-finding to a hidden-shift instance
    (KN-LIT-071) is the declared source of the D_N instance itself and is
    NOT modified here -- this proposal only asks whether the resulting D_N
    instance, once formed, decomposes further given N's known factorization.
    No filed KN-* entry addresses a CRT/divide-and-conquer decomposition of
    the dihedral-HSP instance itself.

  novelty_status: unverified
  novelty_screen: >-
    crypto-kb MCP was unavailable and WebSearch failed on every attempt this
    session (see retrieval-screen.yaml). Corpus grep of knowledge/ and
    ledger/proposals/ found no prior filing addressing a CRT/factorization
    decomposition of the dihedral hidden-shift problem applied to CSIDH's
    class group. This is the single strongest match in this batch to the
    search heuristics' "hunt for external structural ingredients" bias
    (CSI-FiSh's computed class-group order is exactly the kind of recent,
    concrete structural fact the heuristics call for) and to "meet-in-the-
    middle / claw decompositions," but absence of a corpus/web hit is not
    treated as evidence of novelty given the incomplete screening this
    session could perform.

  assumptions:
    - >-
      CSI-FiSh's published class-group structure for CSIDH-512 is treated as
      a citable external fact but is NOT adopted numerically without
      independent re-derivation, per this RQ's own baseline-reproduction
      constraint and its explicit prohibition on adopting figures from
      GOAL-CSIDH-001's in-progress reconstruction.

  proof_search_map:
    bottleneck: >-
      Whether measuring x2 (equivalently, the natural quotient induced by
      the CRT decomposition) commutes with the coset sample's defining phase
      relation, such that the reduced (b,x1) state after measurement is
      still, for EVERY measured outcome x2*, expressible as a valid D_{N1}
      coset state with the same shift d1 (up to a publicly computable
      relabeling depending on x2*) -- or whether the b-register's phase gets
      scrambled by an x2*-dependent term that a single-sample partial trace
      cannot undo.
    baseline_embedding:
      parameter_slice: >-
        Kuperberg's sieve applied directly to D_N (the full, unfactored
        instance), 2^{O(sqrt(log N))}, is the exact old-method boundary;
        this proposal's parameter slice is N -> N1*N2 with N1 ~ N2 ~
        sqrt(N), the case where a split is most favorable IF favorable at
        all, which (if the mechanism works) would cost
        2*2^{O(sqrt(log(sqrt N)))} = 2*2^{O(sqrt((log N)/2))} -- a reduction
        in the sqrt(log N) exponent's argument by a factor of 2 per split,
        and recursively, for k roughly-equal coprime factors,
        2^{O(sqrt((log N)/k))}.
      reproduction_check: >-
        Not performed this session. Required before Coordinator approval:
        independently confirm N's actual factorization for CSIDH-512 from
        CSI-FiSh's own published class-group computation (NOT adopted from
        GOAL-CSIDH-001's in-progress reconstruction, per this RQ's own
        non-duplication constraint) -- if N is prime or has only one large
        prime factor (a real possibility CSI-FiSh's own class-number
        computation would settle), this entire mechanism is vacuous for
        CSIDH-512 specifically regardless of whether the lossy-projection
        test passes; this is a cheap, decisive, likely-checkable-first audit
        step.
    observation_collision:
      observable: The measured (b,x1) register's phase/amplitude pattern after tracing out x2.
      distinct_preimage_search: >-
        Construct two distinct full-instance shift values d, d' (differing
        mod N1 or mod N) that, after the x2 measurement and CRT relabeling,
        produce the SAME (b,x1) observable distribution -- if such a
        collision exists for shift values differing specifically in their
        d1-component in a way the relabeling cannot distinguish, that is a
        direct falsifier of the mechanism's claimed ability to recover d1
        from the projected state alone.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express the D_N coset-sampling process as a fiber product of
          two independent group actions, with the shared coin bit b as the
          only entangling resource between the two sub-instances, and derive
          the exact completeness/soundness/transfer/cost-loss obligations
          for converting a D_N sample batch into a D_{N1} sample batch plus a
          D_{N2} sample batch.
        predicted_gain: >-
          If achievable losslessly (aside from the shared-b entanglement,
          costing at most a constant per-sample factor to handle, e.g. by
          discarding samples where b's measured value is inconsistent across
          a matched pair), the predicted gain is a change in the round-count/
          list-size balance from a function of log N to a function of
          (log N)/k for k roughly-equal coprime factors.
    quantifier_order: >-
      Existing claim (Kuperberg + CJS): for all N, there exists a
      2^{O(sqrt(log N))} algorithm. This proposal's claim, if it survives:
      for all N admitting a coprime factorization N=N1*...*Nk with each
      log Ni ~ (log N)/k, there exists a 2^{O(sqrt((log N)/k))}-time
      algorithm, PROVIDED the fiber-product sample-reduction mechanism above
      is shown correct for THAT SPECIFIC N's factorization (the witness --
      the exact reduction map -- depends on N's factorization, which is
      public and computable, so this dependency is legitimate, not a hidden
      non-uniformity). The critical quantifier risk: does the mechanism's
      correctness depend on N1, N2 being of COMPARABLE size, or does it
      degrade when the factorization is very unbalanced -- for CSIDH-512's
      ACTUAL class-group order, whichever factorization CSI-FiSh reports,
      this must be checked, not assumed favorable.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best (projection lossless/compatible AND N favorably factorable
        AND recursion possible), a genuine reduction of the sqrt(log N)
        exponent's argument by a constant factor of sqrt(k) for k
        roughly-equal factors -- a CONSTANT improvement to the exponent's
        argument (log N / k inside the sqrt), which per the exemplar's A1
        distinction is NOT a functional-form change (still
        2^{O(sqrt(log N'))} for a smaller effective N'). This must be
        reported honestly as a PARAMETER-REDUCTION result (effectively
        attacking a smaller instance), not a method-level exponent change.
      nearby_object_control: >-
        Apply the identical fiber-product reduction attempt to the
        degenerate case N1=N (k=1, no split) -- the mechanism must reduce
        exactly to Kuperberg's original algorithm with no claimed gain, a
        sanity check on the construction's bookkeeping. Also apply it to a
        toy instance where N=p*q, p,q comparable-size primes, log2 N <= 20
        (fully classically simulable exactly), and directly verify by
        exhaustive computation whether the traced-out (b,x1) state, for
        every possible measured x2* and every possible true d, is or is not
        a valid biased D_{N1} coset sample -- decisive, requires no quantum
        hardware, only classical linear algebra over the state vector.
    proof_obligations:
      - claim: N's actual factorization for CSIDH-512 (and larger proposed CSIDH parameters) admits at least one nontrivial coprime split with comparable-size factors.
        responsibility: baseline
      - claim: The CRT map on Z_N is compatible with the dihedral group's involution (an algebraic fact, provable symbolically).
        responsibility: correctness
      - claim: Tracing out x2 leaves a valid, usefully biased D_{N1} coset state for every measurement outcome x2*, not merely for a subset requiring post-selection at a cost that erases the gain.
        responsibility: correctness
      - claim: The combined cost of the k smaller Kuperberg-sieve instances, plus classical CRT recombination and any post-selection overhead, is smaller than the direct D_N cost at CSIDH-standardized N.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        whether N (CSIDH-512's class-group order, independently re-obtained
        from CSI-FiSh, not adopted from GOAL-CSIDH-001) admits a nontrivial
        comparable-size coprime factorization
      direction: different
      minimum_effect: >-
        existence of at least one factor pair N1,N2 with log2(N1), log2(N2)
        both within a constant factor of (log2 N)/2. CSI-FiSh reported
        Cl(O) for CSIDH-512 as CYCLIC; cyclicity of the group does not by
        itself determine whether its ORDER N is composite with comparable
        factors -- this is a pure number-theoretic fact about one specific
        integer, checkable by factoring N, honestly predicted as UNKNOWN
        without doing the factoring, not assumed favorable.
    - metric: >-
        on toy instances (N=p*q, log2 N <= 20), fraction of measurement
        outcomes x2* for which the traced-out (b,x1) state is a valid biased
        D_{N1} coset sample with the correct d1
      direction: higher
      minimum_effect: >-
        1.0 (exact), if the CRT-compatibility algebra holds -- the algebra
        is exact, not probabilistic, so any measured fraction below 1.0
        (beyond exact-arithmetic tolerance) falsifies the mechanism as
        stated.

  minimal_test:
    design: >-
      Two stages. Stage 1 (number-theoretic, classical, no simulation):
      independently compute or obtain (with citation) the exact
      factorization of CSIDH-512's class-group order N, and of any larger
      standardized CSIDH parameter set's N, per this RQ's own
      baseline-reproduction requirement (not adopted from GOAL-CSIDH-001).
      Stage 2 (toy algebraic verification, N=p*q with log2 N <= 20, fully
      classically simulable exactly since the state vector is over exact
      roots of unity): construct the D_N coset-sample state exactly, apply
      CRT, symbolically trace out the x2 register for every possible
      measurement outcome, and check EXACTLY whether the resulting (b,x1)
      reduced density matrix, for every outcome, is (up to a computable
      relabeling) the density matrix of a genuine D_{N1} coset sample with
      shift d1 = d mod N1.
    controls:
      - N1=N (k=1, no split) as the degenerate sanity control, must reproduce Kuperberg's ordinary sample exactly.
      - >-
        A "wrong" CRT map (an incorrect or non-coprime pseudo-factorization)
        as a negative control that must demonstrably fail the compatibility
        check, confirming the harness can detect a genuine incompatibility
        when one is present.
      - A from-scratch-generated genuine D_{N1} coset sample (constructed directly, not via projection) as the ground truth the projected state is checked against.
    required_metrics:
      - CSIDH-512's (and larger standardized sets') exact class-group order factorization, with source citation
      - exact fidelity between the projected (b,x1) state and the ground-truth D_{N1} coset state, for every measurement outcome, at each toy (p,q) pair tested
      - >-
        combined cost estimate (symbolic) of the two-instance approach
        versus the direct instance, at the toy size and extrapolated (with
        extrapolation explicitly flagged) to CSIDH-512's actual
        factorization if Stage 1 finds a favorable split

  falsification_conditions:
    - >-
      CSIDH-512's class-group order N has no nontrivial comparable-size
      coprime factorization (e.g. N is prime, or N = small-prime *
      huge-cofactor) -- makes the mechanism vacuous for CSIDH-512
      specifically regardless of the algebra, though it would not close the
      question for OTHER standardized or proposed CSIDH parameter sets whose
      N might factor differently.
    - >-
      The exact toy-scale fidelity check shows the projected (b,x1) state is
      NOT (even up to relabeling) a valid D_{N1} coset state for at least
      one measurement outcome -- a direct algebraic falsifier, decisive and
      requiring no statistics.
    - >-
      The combined two-instance cost, even under a favorable factorization,
      exceeds the direct instance's cost once all overhead (classical CRT
      bookkeeping, any required post-selection, recombination) is charged --
      closes the proposal on cost grounds even if the algebra is sound.

  confounders:
    - >-
      CSI-FiSh's published class-group computation is for CSIDH-512
      specifically; larger proposed CSIDH parameters (SQALE's NIST levels
      1-3, KN-LIT-129) may have DIFFERENT, independently computed class-group
      orders with different factorization properties -- a finding for one
      parameter set does not transfer to another without its own
      factorization check.
    - >-
      A composite N does not by itself guarantee a usable split even if the
      algebra is sound -- e.g. if all of N's prime factors are tiny (N
      extremely smooth), the comparable-size-factors premise fails and the
      balanced-split gain does not materialize even though a factorization
      technically exists.
    - >-
      The shared coin-bit b entanglement between the two projected
      sub-instances is a genuine correlation this proposal's mechanism
      section asserts can be handled "at most a constant per-sample factor"
      -- this claim needs the toy-scale verification, not assumption; if
      handling it costs a factor growing with N rather than a true constant,
      the claimed gain could be erased.

  interpretation_limits:
    - >-
      A toy-scale (log2 N <= 20) exact algebraic verification, positive or
      negative, is hypothesis-generating only; it does not establish
      anything about CSIDH-512's actual N without Stage 1's factorization
      check succeeding favorably.
    - No claim about CSIDH's security level is made regardless of outcome.
    - >-
      If Stage 1 finds CSIDH-512's N unfavorable (prime or highly
      unbalanced), that closes THIS specific parameter set for this
      mechanism with a named, checkable obstruction (per
      docs/inventor-protocol.md section 4's closure standard) but explicitly
      leaves open whether OTHER CSIDH-like parameter proposals might factor
      favorably -- forward guidance, not a blanket closure.

  heuristic_assumptions:
    - id: H1
      statement: >-
        None required for Stage 1 (a deterministic number-theoretic fact) or
        for Stage 2's exact algebraic verification (exact linear algebra
        over roots of unity, not a probabilistic claim). This proposal is
        unusual in this batch for being resolvable, at toy scale, without
        any heuristic assumption -- the only place a heuristic-style
        extrapolation enters is in generalizing the toy-scale (log2 N <= 20)
        exact finding to CSIDH-512's actual class-group bit-length.
      rigorous_support: >-
        The toy-scale finding, if positive, is an EXACT algebraic fact (a
        finite-dimensional linear-algebra identity), not a statistical
        claim, so it does not need a classical-distribution-theorem
        composition in the Wesolowski A2 sense; the extrapolation risk is
        instead about whether the SAME algebraic identity (scale-invariant
        in its derivation, since CRT compatibility with negation holds for
        every N) genuinely holds at cryptographic scale, which is a matter
        of correctly generalizing a proof, not of a probabilistic heuristic
        -- flagged here anyway per the discipline of naming every
        conditional dependency explicitly.
      validation_plan: >-
        Re-run the exact Stage 2 verification at successively larger toy N
        (up to the largest exactly-simulable size this program's compute
        budget allows, likely log2 N ~ 28-32 using exact symbolic/rational
        arithmetic rather than floating point) and confirm the fidelity
        result remains exactly 1.0 at every tested size with no degradation
        trend; any degradation trend as N grows is the tail-consistency
        check flagging a scale-dependent effect this proposal's algebra did
        not anticipate.

  target_complexity:
    time_exponent: >-
      Conditional on a favorable factorization existing for the relevant
      CSIDH parameter set: 2^{O(sqrt((log N)/k))} for k roughly-equal
      coprime factors, recursively -- an improvement to the CONSTANT inside
      the sqrt (not the sqrt itself), i.e. a parameter-reduction result,
      honestly NOT classified as a full exponent-form change.
    memory_exponent: >-
      Comparable to k independent Kuperberg-sieve instances run at the
      smaller size (log N)/k each, i.e. no worse than, and possibly better
      than, the direct instance's memory -- to be confirmed by the same
      reproduction that establishes the time claim.
    best_known: >-
      2^{O(sqrt(log N))} time and query (Kuperberg 2005 / CJS reduction,
      KN-LIT-2c8264, KN-LIT-071), applied directly to the full, unfactored
      class-group order.
    hidden_overhead: >-
      Even in the favorable case, classical CRT bookkeeping and any
      post-selection to handle the shared coin-bit b add overhead this
      proposal has not yet bounded precisely (see confounders); until
      bounded, the o(1) in the claimed 2^{O(sqrt(log N/k))} may hide this
      overhead rather than being a clean asymptotic gain.
    tradeoff_note: >-
      No quantum-memory-versus-time tradeoff is proposed here (that is
      IDEA-20260813-b650e0's subject); this proposal's tradeoff, if any, is
      purely about whether solving k smaller instances plus classical
      recombination beats one larger instance, a classical divide-and-
      conquer tradeoff layered on top of Kuperberg's own algorithm, not a
      new quantum resource tradeoff.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  dominated_by: >-
    Kuperberg's sieve applied directly to the full class-group order
    (KN-LIT-2c8264, KN-LIT-071) dominates as of this session on every
    checked axis, since this proposal is unimplemented and its Stage 1
    factorization check (the cheapest, most decisive step) has not yet been
    run; no row of the CSIDH-relevant frontier is dominated by this proposal
    at present, and it may prove VACUOUS for CSIDH-512 specifically if N
    proves unfavorably factored (falsification condition above).

  sota_delta: >-
    0x / no measured improvement; no experiment run. If Stage 1 finds a
    favorable split into k roughly-equal factors AND Stage 2's algebra
    holds, the structural best-case quantitative delta is a factor-of-
    sqrt(k) reduction in the sqrt(log N) exponent's argument -- stated as a
    formula, not a number, since k depends entirely on N's actual,
    currently-unverified-in-this-session factorization.

