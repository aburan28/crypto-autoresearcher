    The second is high because q^ell - 1 is odd for even q is not a claim that
    can be wrong, and is not 1.0 only because it is conditional on the acting
    group being A^x rather than GL_ell(F_q) - the same unresolved branch that
    limits the companion proposal. 0.05 that any of this converts into a
    measured cost improvement against any published parameter set within this
    goal's budget.
