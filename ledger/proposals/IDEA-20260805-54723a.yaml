idea:
  id: IDEA-20260805-54723a
  question_id: RQ-SNOVA-001
  added: '2026-08-06'
  title: >-
    Make the group action measurable: the multiplier algebra of the public key
    is a computable invariant with a forced value and a matched null, and
    Maschke's condition resolves in the attacker's favour for a reason the
    characteristic-two folklore gets backwards
  class: identifiability_audit

  claim: >-
    SNOVA's reported attacks are called group-action attacks, and this program
    has never written down which group, nor any quantity that measures it.
    There is one, it is an invariant of the PUBLIC key alone, it costs a small
    amount of exact linear algebra, and its value is forced in advance on both
    arms. Define the multiplier algebra of a quadratic map P over F_q as
    Mult(P) = {(M, M') in M_ell(F_q) x M_ell(F_q) : the polar forms of P
    intertwine left multiplication by M with right multiplication by M'}, or in
    the single-sided reading Comm(P) = {M : M commutes with every polar form of
    P in the flattened basis}. DERIVED BELOW: if SNOVA's coefficients lie in
    the commutative subalgebra A = F_q[S], the public map is A-equivariant by
    construction, so dim_{F_q} Comm(P) is AT LEAST ell for every SNOVA public
    key, at every parameter set, with no secret knowledge required. For a
    random quadratic map of the same shape over the same field the same
    quantity is 1 with overwhelming probability. That is a distinguisher whose
    value is derived before the run, whose null can actually fail, and which
    grades monotonically in ell. SECOND, AND SEPARATELY: this session's
    scouting brief guesses that Maschke's condition blocks equivariant
    block-diagonalization for SNOVA because q = 16 gives characteristic two.
    THE GUESS IS BACKWARDS FOR THE GROUP THAT MATTERS. The acting group in
    Reading 1 is A^x = F_{q^ell}^x, of order q^ell - 1, which is ODD PRECISELY
    BECAUSE q IS EVEN; the group algebra is therefore semisimple, the isotypic
    idempotents exist, and the device is admissible. It is only for the FULL
    unit group GL_ell(F_q), whose order is even for q even and ell >= 2, that
    Maschke fails. Which of those two is SNOVA's group is the same branch the
    companion proposal IDEA-20260805-70aa6e has to settle, and settling it
    decides both.

  object_first_candidate:
    tracked_object: >-
      The multiplier algebra of the public map - the set of ell-by-ell matrices
      that intertwine the public quadratic's polar forms with themselves -
      tracked as an F_q-algebra, from the key generator through publication and
      into an attacker's hands: secret coefficient algebra A = F_q[S] -> the
      A-equivariance of the central map -> the A-equivariance of the composed
      public map (equivariance survives composition with A-linear secret maps)
      -> the commutant computed from published data alone -> its F_q-dimension,
      which is the single number followed to the end.
    established_families_off_limits: >-
      Off-limits as the primary lens: the wedge-product attack, MinRank and
      rectangular MinRank, Kipnis-Shamir, reconciliation, intersection attacks,
      direct Groebner attacks on the public map, hybrid guess-and-solve,
      quantum MQ solvers, weak-key search, and all implementation attacks.
      Nothing here is derived from any of them. This is an invariant of the
      published object, computed before any attack is chosen.
    newness_score: >-
      Computing the commutant of a structured public key is an old idea in
      multivariate cryptanalysis and some form of it is almost certainly inside
      the published SNOVA attacks; no novelty against the literature is
      claimed. What is new AS A RECORD IN THIS PROGRAM is that the corpus's
      only device of this type, the isotypic/equivariant decomposition, has
      been used exactly once (on a Semaev system) and has never been pointed at
      a scheme whose attacks are literally named after a group action; and that
      the quantity is stated here with a pre-derived value on BOTH arms rather
      than measured and then interpreted.
    testability_score: >-
      High and cheap. Computing a commutant is solving a homogeneous linear
      system of size at most ell^2 over F_q; the ambient objects are ell-by-ell
      matrices with ell <= 5 in every published parameter set. Exact arithmetic
      over F_16 in pure Python is enough, which matters because the container's
      algebra-package availability is disputed between two scouting reports.
    survival_score: >-
      The invariant survives to a single integer per key, and that integer is
      exactly what a structural attack needs to exist. It does not survive into
      a cost: a large commutant proves structure is present and proves nothing
      about how much it costs to exploit, which is stated as the ceiling.

  mechanism: >-
    SOURCE DISCIPLINE. GOAL-SNOVA-001's next_action forbids restating this
    program's inherited secondhand SNOVA figures; none is restated here and
    none is used. Sources actually touched in this session, 2026-08-06:
    https://snova.pqclab.org/ FETCHED (HTTP 200, model-rendered), giving the
    eleven parameter rows with q = 16 and ell in {2,3,4,5} and the definition
    of the ring as F_q[S] = span_{F_q}{1, S, ..., S^{ell-1}};
    https://eprint.iacr.org/2026/237 ABSTRACT PAGE FETCHED (HTTP 200), title,
    authors and date recorded, BODY NOT READ. The internal form of SNOVA's
    central map, and in particular which group the secret transformation ranges
    over, is RECALLED, UNVERIFIED, and is the branch point.

    PART ONE - THE EQUIVARIANCE, AND WHY IT SURVIVES TO THE PUBLIC KEY. Suppose
    the central map F has coefficients in the commutative algebra A = F_q[S]
    and the secret transformation T is A-linear. Write the flattened public map
    as P = F o T with polar forms P'_a, a = 1..m, acting on the flattened
    variable space V of F_q-dimension ell^2 n. A acts on V; call the
    corresponding algebra of ell^2 n by ell^2 n matrices rho(A), of
    F_q-dimension ell when A is a field. Equivariance of F under rho(A) and
    A-linearity of T together give equivariance of P: for every s in A,
    rho(s)^tr P'_a rho(s) is expressible inside the same coefficient algebra,
    so the commutant
      Comm(P) = {M in End_{F_q}(V) : M^tr P'_a = P'_a M for all a}
    contains rho(A). Hence dim_{F_q} Comm(P) >= ell, unconditionally, for every
    SNOVA public key. THIS IS THE FORCED VALUE, and it is forced from the
    construction rather than measured. The precise intertwining relation
    (transpose-conjugation versus plain commutation, one-sided versus
    two-sided) depends on the exact shape of the central map and is exactly
    what Stage 0 must read; all admissible variants are enumerated as a closed
    list before any computation, and the experiment computes all of them.

    PART TWO - THE NULL, WHICH CAN ACTUALLY FAIL. For a quadratic map drawn
    uniformly at random with the same m, the same variable count and the same
    field, the commutant is the solution space of a homogeneous linear system
    with m ell^4 (or m (ell^2 n)^2) equations in ell^2 (or (ell^2 n)^2)
    unknowns. It always contains the scalars, so its dimension is at least 1;
    for m >= 2 generic forms the system is heavily overdetermined and the
    dimension is exactly 1 with probability 1 - O(q^{-1}). FORCED NULL VALUE:
    EXACTLY 1. This null is not decorative - if a random matched map returns a
    commutant of dimension ell as well, then the quantity is measuring the
    ambient block structure of the flattening and not SNOVA, and the whole
    proposal is void. That is the mirror failure and it is checked, not
    assumed.

    PART THREE - THE MASCHKE GATE, RESOLVED, AND RESOLVED AGAINST THE
    FOLKLORE. The isotypic/equivariant decomposition device needs the acting
    group's algebra over F_q to be semisimple: Maschke requires char F_q not
    dividing |G|. This session's scouting brief conjectures that q = 16 gives
    char 2, that |G| is plausibly a two-power, and that the device is therefore
    blocked. DERIVED HERE, AND IT GOES THE OTHER WAY. Under Reading 1 the group
    is A^x = F_q[S]^x. If the characteristic polynomial of S is irreducible,
    A = F_{q^ell} and |A^x| = q^ell - 1, which is ODD FOR EVERY EVEN q. So char
    2 does not divide it, F_q[A^x] is semisimple, the idempotents exist and the
    device is ADMISSIBLE. The equivalent, cleaner criterion avoids groups
    entirely: A = F_q[S] is a semisimple F_q-algebra if and only if the
    characteristic polynomial of S is SQUAREFREE, in any characteristic. It is
    only under Reading 2, where the acting group is the full unit group
    GL_ell(F_q) with |GL_ell(F_q)| = q^{ell(ell-1)/2} prod_{i=1..ell}(q^i - 1)
    - even for q even and ell >= 2 - that Maschke fails. The gate therefore
    does not close SNOVA off; it closes off one reading of it, and it names
    exactly the datum (the factorization type of the characteristic polynomial
    of S) that decides which.

    PART FOUR - WHAT THE DECOMPOSITION IS AND IS NOT WORTH, COSTED HONESTLY.
    Grant Reading 1 and semisimplicity. Then any A-equivariant linear system of
    F_q-dimension D is an A-linear system of dimension D/ell over A, solvable
    in (D/ell)^omega operations in A. Each A-operation costs M(ell) F_q
    operations - ell^2 schoolbook, about ell^{1.58} with Karatsuba - so the
    speedup against D^omega F_q operations is ell^omega / M(ell), i.e. between
    ell^{omega-2} and ell^{omega-1.58}. At omega = 2.37 and ell = 4 that is
    between 1.6 and 2.9. THAT IS A CONSTANT FACTOR AND THIS PROPOSAL SAYS SO
    RATHER THAN CALLING IT AN EXPONENT. The exponent lives one level up: if the
    DERIVED attack system is A-quadratic in N/ell A-variables rather than
    F_q-quadratic in N F_q-variables, then a degree-d Macaulay matrix has
    C(N/ell + d, d) columns instead of C(N + d, d), a ratio of order ell^{-d},
    and the linear-algebra exponent applies to the smaller number. Whether the
    derived system is A-quadratic is a structural question with a yes/no
    answer, it is NOT settled here, and the proposal deliberately stops at the
    invariant that decides it rather than asserting the consequence.

  novelty_status: unverified

  literature_context:
    - >-
      SNOVA project page, FETCHED 2026-08-06 (HTTP 200), model-rendered.
      Supplies the ring definition F_q[S] with F_q = GF(16) and the eleven
      parameter rows with ell in {2,3,4,5}. THE SPECIFICATION DOCUMENT WAS NOT
      READ; in particular the page does not settle whether the characteristic
      polynomial of S is irreducible, which is the single datum the Maschke
      gate turns on.
    - >-
      ePrint 2026/237, "Exploiting SNOVA's Structure in the Wedge Product
      Attack", Bros, Le, Lichtinger, Minaud, Perlner, Smith-Tone, Valenzuela,
      2026-02-13. ABSTRACT FETCHED, BODY NOT READ. ABSTRACT-RELAYED and not
      reproduced or used here: the attack is described by its authors as
      exploiting the block-ring structure. That phrase is the reason this
      proposal exists, and it is the only thing taken from the source.
    - >-
      The corpus's only prior use of an isotypic/equivariant decomposition is
      EXP-EQJ-001, on a Semaev system, in an entirely different family. NOT
      RE-READ IN THIS SESSION; named from this session's scouting brief, which
      is a relayed pointer and not an authority. Whether its instrumentation is
      reusable is an open question this proposal does not assume - the
      commutant computation here is small enough to write from scratch.
    - >-
      Maschke's theorem and the squarefree-characteristic-polynomial criterion
      for semisimplicity of F_q[S] are standard. NO CITATION IS ASSERTED; both
      are derived in the mechanism and both are checked computationally at toy
      sizes, which is what this program's rules require when no source was
      read.

  lossy_projection_identifiability_audit:
    projection: >-
      Public key P (m polar forms over F_q, published in full) --> the
      F_q-dimension of its multiplier/commutant algebra: one small integer.
    what_is_discarded: >-
      Essentially everything. The public key carries on the order of m ell^4 n^2
      field elements and the observable is a single integer no larger than
      ell^2. The fibre over one value of the observable contains almost the
      entire public-key space.
    why_genuinely_lossy: >-
      Extremely lossy, and deliberately so: the observable is an isomorphism
      invariant, so it is constant on the orbit of the equivalent-key group,
      which is precisely the group the attacks are named after. That is the
      property that makes it usable as a structure test at all.
    why_compatible_with_the_operations: >-
      The commutant is preserved under exactly the transformations the scheme's
      security argument allows the attacker to apply: it is invariant under the
      A-linear change of basis that defines equivalent keys, so the retained
      part propagates deterministically through the one operation that matters.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, AND NO. A commutant dimension cannot be inverted to recover the
      key; there is no analogue of recovering {x, y} from (x xor y, x . y)
      because the map to a single integer is nowhere near injective.
    mirror_failure_check: >-
      CHECKED, AND THIS IS THE REAL RISK, SO IT IS THE CONTROL. The mirror
      failure is a projection so lossy that it is constant across instances
      with zero comparator spread. Here the observable IS constant across
      SNOVA instances at fixed ell - that is the forced value - so the only
      thing that makes it informative is that it takes a DIFFERENT constant on
      the null arm. The entire content of the proposal is the pair (ell, 1),
      not the value ell. If the null also returns ell, the statistic is a
      constant of the apparatus and reports nothing; that is the pre-declared
      void condition, and it is checked before the SNOVA arm is looked at.

  assumptions:
    - >-
      That SNOVA's central-map coefficients lie in F_q[S] and the secret
      transformation is F_q[S]-linear (Reading 1). The ring is confirmed by the
      project-page fetch; the LINEARITY OF THE SECRET TRANSFORMATION IS
      RECALLED, UNVERIFIED. Under Reading 2 the forced value becomes ell^2
      rather than ell and Maschke fails; both are pre-declared.
    - >-
      That the characteristic polynomial of S is squarefree. RECALLED,
      UNVERIFIED, and decisive for the Maschke half. If it is not, F_q[S] is
      not semisimple, no idempotents exist, and the honest deliverable is a
      NAMED OBSTRUCTION with its forward guidance - the local case still admits
      a filtration by radical powers, which is weaker than a decomposition and
      is what remains open.
    - >-
      That the intertwining relation defining the multiplier algebra can be
      written down from the specification. If the central map's exact shape
      cannot be obtained, the closed list of candidate relations is computed on
      all variants and the ambiguity is reported rather than resolved by
      choosing the one that gives the nicer answer.

  predictions:
    - metric: >-
        comm_dim_snova: dim_{F_q} of the commutant of a freshly generated
        toy SNOVA-shaped public key, over 50 independent keys
      direction: higher
      minimum_effect: >-
        AT LEAST ell, on 50 of 50 keys, and predicted EXACTLY ell under Reading
        1 with S of irreducible characteristic polynomial. A value of 1 on any
        key falsifies the equivariance derivation and the proposal is
        withdrawn. A value of ell^2 on all keys indicates Reading 2 instead and
        redirects rather than refutes.
    - metric: >-
        comm_dim_null: dim_{F_q} of the commutant of a uniformly random
        quadratic map with matched m, matched variable count and matched field,
        over 50 independent draws
      direction: lower
      minimum_effect: >-
        EXACTLY 1 on at least 48 of 50 draws. This is the forced null value and
        it can fail; if it returns ell the statistic is an artifact of the
        flattening and NOTHING from the treatment arm may be reported.
    - metric: >-
        comm_dim_ratio_grading: comm_dim_snova as a function of
        ell in {1, 2, 3, 4}, at otherwise matched toy parameters
      direction: higher
      minimum_effect: >-
        The sequence must be exactly (1, 2, 3, 4) under Reading 1. The ell = 1
        entry is the null object of the same shape: at ell = 1 SNOVA degenerates
        to plain UOV over F_q, there is no ring, and the commutant dimension is
        forced to 1. Any deviation at ell = 1 means the instrument is reporting
        its own construction.
    - metric: >-
        maschke_gate: char(F_q) divides |A^x| for A = F_q[S] with S of
        irreducible characteristic polynomial and q even
      direction: different
      minimum_effect: >-
        FALSE, always, because |A^x| = q^ell - 1 is odd whenever q is even.
        This is a one-line arithmetic check with a pre-derived answer, and it
        contradicts the scouting brief's conjecture. If the check somehow
        returns TRUE the derivation is wrong and the Maschke half is withdrawn.
    - metric: >-
        equivariant_linear_algebra_speedup: ratio of F_q operations for a
        D-dimensional F_q-linear solve to those for the D/ell-dimensional
        A-linear solve, at omega = 3 with schoolbook A-arithmetic
      direction: higher
      minimum_effect: >-
        EXACTLY ell^{omega} / ell^2 = ell at omega = 3, i.e. 4 at ell = 4, and
        EXACTLY 1 at ell = 1. Recorded as a CONSTANT FACTOR. This proposal will
        not present it as an exponent and any downstream record that does is
        misciting it.

  minimal_test:
    design: >-
      Three stages, cheapest first, each able to end the line. STAGE 0 (zero
      compute): read from primary text which group the secret transformation
      ranges over and whether the characteristic polynomial of S is squarefree;
      run the Maschke arithmetic, which is one line and needs no source beyond
      q and ell. If the source cannot be obtained, record a source blocker -
      infrastructure signal, never mathematical evidence - and stop before the
      SNOVA arm. STAGE 1 (minutes, pure Python over F_q, no dependencies):
      implement a toy SNOVA-shaped key generator at small (v, o, q, ell),
      generate keys, compute the commutant on the closed list of candidate
      intertwining relations, and compare against the forced values - null arm
      first, hashed and committed, before the treatment arm is looked at.
      STAGE 2 (minutes): the graded ell ladder and the QR-UOV-shaped nearby
      object.
    controls:
      - >-
        MATCHED NULL, SAME SHAPE, CAN FAIL: a uniformly random quadratic map
        with identical m, identical variable count and identical field, run
        through the identical commutant code. FORCED VALUE DERIVED PRE-RUN:
        dimension exactly 1. Committed and hashed before the treatment arm is
        computed.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: a hand-planted
        A-equivariant quadratic map built directly from A = F_{q^ell}, with no
        SNOVA structure at all. Its commutant MUST contain rho(A), so the
        measured dimension MUST be at least ell. If it is not, the commutant
        code is broken and NO negative about SNOVA may be reported.
      - >-
        GRADED CONTROL, four interior points, monotonicity reported:
        ell = 1, 2, 3, 4 with forced values 1, 2, 3, 4. A failure at one rung
        localises the obstruction to that ell instead of leaving "it did not
        work".
      - >-
        NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION CHANGES: a QR-UOV-shaped
        instance, whose coefficient algebra is commutative of F_q-dimension ell
        but whose variables are NOT full matrices. The commutant is forced to
        at least ell there too - so this control demonstrates that the
        invariant does NOT separate SNOVA from QR-UOV, which is a limitation of
        the method and is pre-registered as such rather than discovered
        afterwards.
      - >-
        NON-SEMISIMPLE CONTROL: build S with characteristic polynomial x^ell,
        so F_q[S] is local. The commutant is still at least ell-dimensional but
        the idempotents do not exist. The experiment must report the commutant
        dimension AND the semisimplicity verdict separately, because they come
        apart exactly here.
      - >-
        ARCHIVE CHECK, zero compute: no prior measurement of this observable
        exists anywhere in the corpus. Recorded as unavailable, not as passed.
    required_metrics:
      - commutant dimension per key per arm, with the intertwining relation used
      - the pre-registered forced value each was compared against
      - the null-arm commitment hash and the timestamp proving it preceded the treatment arm
      - the Maschke arithmetic, shown
      - the semisimplicity verdict for each S used

  falsification_conditions:
    - >-
      The matched null returns a commutant dimension of ell rather than 1. The
      statistic is an artifact of the flattening and the proposal is void; no
      treatment number may be reported.
    - >-
      A SNOVA-shaped key returns commutant dimension 1. The equivariance
      derivation is wrong and must be withdrawn as a superseding record.
    - >-
      The ell = 1 arm returns anything other than 1. The instrument is
      measuring its own construction.
    - >-
      Stage 0 establishes Reading 2 or a structure in which the secret
      transformation is not linear over any subalgebra larger than F_q. The
      Maschke half must be restated for GL_ell(F_q), where it fails, and the
      deliverable becomes a NAMED OBSTRUCTION rather than an admissible device.
    - >-
      The positive control fails. Nothing negative may be reported.

  confounders:
    - >-
      DEFINITIONAL DRIFT IN "MULTIPLIER ALGEBRA". One-sided commutant,
      two-sided multiplier pairs, and transpose-conjugation intertwiners are
      three different objects with three different generic dimensions. The
      closed list is fixed before the run and ALL members are computed and
      reported; picking the one that gives the nicest separation afterwards
      would be exactly the criterion-revision failure EV-IC-002 records.
    - >-
      TOY KEY GENERATOR RISK. Stage 1 uses a SNOVA-SHAPED generator written
      from a recalled description, not the reference implementation. It is
      therefore a test of the derivation's internal consistency, not of SNOVA.
      Every statement from Stage 1 carries that label, and a mismatch with the
      real scheme is a failure of the shape, not of the mathematics.
    - >-
      A LARGE COMMUTANT IS NOT A COST. Detecting structure and exploiting it
      are different claims separated by the whole of the attack literature.
      This proposal makes the first and explicitly declines the second.
    - >-
      THE FOLKLORE-CONTRADICTION IS CHEAP TO PRODUCE AND READS AS RIGOUR.
      Contradicting a scouting brief's conjecture costs one line of arithmetic;
      the record is built with a falsification condition on that line so a
      wrong contradiction is caught rather than celebrated.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED. A commutant dimension of ell demonstrates that the
      structure is visible from the public key alone and demonstrates nothing
      about the cost of exploiting it.
    - >-
      The claimed speedup from equivariant block decomposition is a CONSTANT
      FACTOR between ell^{omega-2} and ell^{omega-1.58} on the linear-algebra
      step. The exponent-level consequence is conditional on the derived attack
      system being A-quadratic, which this proposal does not establish and
      explicitly leaves open.
    - >-
      The invariant does not separate SNOVA from QR-UOV. That limitation is
      pre-registered, and it means the method has not isolated
      noncommutativity - only the presence of a coefficient algebra.
    - >-
      Toy tier throughout. Nothing here transfers to a statement about any
      published parameter set.
    - >-
      No figure from any reported SNOVA attack is confirmed, contradicted or
      reproduced, and the goal's next_action constraint is respected in full.

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a quadratic map drawn uniformly at random with m >= 2 forms over
        F_q in the matched variable count, dim_{F_q} Comm(P) = 1 with
        probability 1 - O(q^{-1}).
      rigorous_support: >-
        The commutant is the kernel of a homogeneous linear system that is
        heavily overdetermined for m >= 2, and it always contains the scalars.
        The heuristic is that a random instance of an overdetermined system has
        the generic kernel dimension. This is stated as a heuristic and not as
        a theorem because the system's coefficients are not independent.
      validation_plan: >-
        MEASURED DIRECTLY as the null arm over 50 draws, at several (q, m).
        This heuristic is not assumed anywhere; it is the null and it is the
        first thing computed.
    - id: H2
      formal_statement: >-
        Equivariance of the central map under rho(A) is preserved by
        composition with an A-linear secret transformation, so the public map's
        commutant contains rho(A).
      rigorous_support: >-
        Elementary: the composite of A-equivariant maps is A-equivariant, and
        the polar form of an A-equivariant quadratic is A-equivariant as a
        bilinear form under the corresponding twisted action. DERIVED IN THIS
        RECORD; no citation asserted. The precise twist depends on the central
        map's exact shape, which is why the closed list of candidate relations
        exists.
      validation_plan: >-
        The positive control - a hand-planted A-equivariant map with no SNOVA
        structure - tests this directly and independently of any SNOVA recall.

  target_complexity:
    time_exponent: >-
      This proposal moves NO exponent, and says so rather than dressing a
      constant as one. The equivariant decomposition it licenses is a constant
      factor of between ell^{omega-2} and ell^{omega-1.58} on a linear-algebra
      step: at ell = 4 and omega = 2.37, between 1.6 and 2.9. The one
      exponent-level consequence in view - a Macaulay column count of
      C(N/ell + d, d) instead of C(N + d, d), a ratio of order ell^{-d} - is
      CONDITIONAL on a structural fact this proposal does not establish, and it
      is recorded as an open successor question rather than as a claim.
    memory_exponent: >-
      n/a; the measured object is the kernel of a system with at most ell^2
      unknowns.
    best_known: >-
      For SNOVA key recovery, the reported best known is the wedge-product
      attack of ePrint 2026/237 (ABSTRACT-RELAYED, body not read). This
      proposal neither competes with it nor compares to it.
    hidden_overhead: >-
      None in the invariant. The hidden risk is that the toy key generator does
      not faithfully reproduce SNOVA's shape, which is an evidentiary rather
      than a computational overhead.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed) on the attack frontier, because no algorithm and no
    cost are proposed. Rows checked: (i) the corpus, by grep for SNOVA across
    knowledge/, ledger/ and docs/, and by inspection of the SNOVA area's
    experiment, evidence and hypothesis directories, which are empty - no prior
    record computes a commutant, a multiplier algebra, or any equivariance
    invariant for any multivariate scheme; (ii) the one prior equivariant
    device in the corpus, EXP-EQJ-001, which is a Semaev-family record and does
    not dominate anything here; (iii) the reported external frontier, ePrint
    2026/237, ABSTRACT ONLY - and the honest statement is that its body almost
    certainly contains a stronger version of this observation, which is a
    reason to read it and not a reason to skip the measurement. Time, memory
    and data axes considered and inapplicable. What this check cannot
    establish is novelty against the multivariate literature; none is claimed.
  sota_delta: >-
    Zero on every attack axis. Quantitatively, the contribution is a pair of
    forced integers - ell on the treatment arm against 1 on a matched null -
    and one arithmetic correction: |F_{q^ell}^x| = q^ell - 1 is odd for even q,
    so the Maschke obstruction conjectured for SNOVA in this session's scouting
    brief does not hold under Reading 1, and holds only under Reading 2 where
    |GL_ell(F_q)| is even for q even and ell >= 2. On the linear-algebra axis
    the delta is a constant between ell^{omega-2} and ell^{omega-1.58},
    reported as a constant.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that a SNOVA-shaped public key has commutant dimension at least ell
    while a matched random map has 1, and 0.9 that the Maschke arithmetic
    stands. The first is high because the equivariance follows from the
    construction rather than from any conjecture, and because the null's
    genericity argument is the standard one for an overdetermined system; it is
    not higher because the exact intertwining relation depends on the central
