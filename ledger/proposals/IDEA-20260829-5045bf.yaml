idea:
  id: IDEA-20260829-5045bf
  question_id: RQ-SYMF-5ab172
  title: >-
    Decide whether the frontier's comparison keys are auditable at all, by
    recovering the key canonicalisation as a decidable search over a declared
    grid of serialization conventions against the 164 committed SHA-256 key
    digests, with a zero-false-positive acceptance criterion
  class: control
  claim: >-
    Schema v2 requires the field target_qualified_key_sha256 on every row and
    states NO rule for constructing it - no field order, no separator, no
    encoding, no rendering of integers, no composition rule for the three
    identity fields. The only construction description anywhere in committed
    state is one sentence in the J1 validation report, and that sentence is
    internally ambiguous - it says the literal key is an "ordered mapping of
    the 11 fields listed under frontier-schema.yaml
    required_row_fields.comparison_key" AND that it is "canonical JSON with
    sorted keys", which are two DIFFERENT serializations, because the schema's
    field order is security_property, attacker_model, oracle_access,
    key_relation, target_component, round_scope, rounds_attacked, total_rounds,
    round_convention, result_kind, success_probability_convention, whereas
    lexicographic order begins attacker_model, key_relation, oracle_access.
    The claim is that this is decidable rather than merely regrettable, because
    the corpus contains a dense oracle - 67 raw_comparison_key_sha256 plus 67
    target_qualified_key_sha256 in the validation report and 30
    target_qualified_key_sha256 in the canonical compilation - and a candidate
    convention either reproduces a digest or does not, with no partial credit
    and, at 256 bits per row, no possibility of accidental agreement.
    Specifically - (Q1) a precommitted grid of at most 2^12 canonicalisation
    rules, evaluated first against the two anchor rows whose 14 field values
    and both digests were read from committed text this session, contains a
    rule reproducing BOTH anchor digests; (Q2) that rule reproduces all 67 raw
    and all 67 target-qualified digests, i.e. 134 of 134; (Q3) the rule that
    succeeds is NOT the one the validation report's sentence most naturally
    denotes, so the committed prose description is itself wrong; and (Q4) an
    independent arithmetic contradiction exists inside that same report - its
    comparison_key_reconstruction block reports literal_unique_keys 59 while
    defect D-KEY-001's mechanical_evidence reports "67 rows produce 60 literal
    keys", and at most one of those can be true, decidable by the identity
    unique = N - sum of multirow group sizes + number of multirow groups.
    THE DECISION THIS FORCES, WHICHEVER WAY IT GOES - if no rule reproduces the
    digests, then every row's key is an unverifiable attestation, "exactly
    matched" is not machine-checkable on this corpus, and every downstream
    frontier instrument must be re-based on recomputed keys under a declared
    canon rather than on the committed ones.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the BYTE
    STRING that hashes to a committed key digest - the preimage - and the
    canonicalisation rule is the map from a row's field values to that string.
    One-step propagation is defined and exactly measurable - each axis of the
    grid (field order, separator, quoting, ASCII escaping, integer rendering,
    identity composition, trailing newline, input encoding) is a single
    substitution on the byte string, and the observable after each substitution
    is a 256-bit digest that either equals the committed one or does not.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection
    field tuple -> SHA-256 digest is the most lossy projection in this entire
    question - 11 or 14 free-text fields, unbounded in length, collapse to 256
    bits, and the fibre over any digest is infinite. The discard is compatible
    with the operation the target performs, because schema v2's dominance gate
    consumes ONLY the equality test on keys, and a collision-resistant hash
    preserves equality exactly while destroying content. So the retained part
    propagates deterministically under dominance, and the object passes
    cleanly. It is emphatically not a change of coordinates - the map is
    designed to be non-invertible.
    AND THAT IS PRECISELY WHY THE CANON MUST BE STATED. The projection is only
    a FUNCTION of the result once a serialization is fixed. Without a canon,
    "the key of this row" is not one digest but a family of digests indexed by
    convention, and the committed field is a value someone computed rather than
    a value anyone can check. The identifiability failure here runs in the
    unusual direction - not two ground truths sharing one observable, which
    collision resistance forbids, but ONE ground truth admitting many
    observables, one per convention. A reader cannot distinguish "this row's
    key was computed correctly" from "this row's key was computed under a
    convention nobody wrote down" from "this digest was typed in", and the
    committed schema gives no way to try.
    WHY THIS IS DECIDABLE RATHER THAN A COMPLAINT. Two facts make the search
    well-posed. First, the grid is small and declarable - the degrees of
    freedom in serializing eleven string-or-integer fields are enumerable, and
    a grid of 2^10 to 2^12 rules covers the conventions a Python or JSON
    implementation would plausibly produce. Second, the acceptance criterion
    has NO FALSE POSITIVES - a wrong rule agrees with a committed 256-bit
    digest with probability 2^-256, so requiring agreement on even two rows
    makes accidental success impossible at 2^-512, and requiring 134 makes the
    criterion absolute. A match is therefore proof, not evidence, and the
    ordinary worry about a search that keeps going until something fits does
    not apply to correctness - only to the separate and honestly reportable
    question of how far the true rule sat from any documented one.
    WHY THE TWO ANCHOR ROWS MAKE THE PILOT NEARLY FREE. This session read, from
    committed text, the complete 14-field key content of two rows together with
    BOTH their digests - LEGACY-SHA0-COLLISION-DEMO (raw
    73a2164210e1999ea9568599646000a6989350cb07b3cad0d70a0fd92ffb3c0f,
    target-qualified
    ba4711994a125889cc37dd7ec2bc4457eac1a2b2fd3e3e38b453541add01bb30) and
    LEGACY-SHA1-IP-COLLISION-THEORY (raw
    133a1001feed4421852c2cf7561a62524e9402aee1db076c137de7764d338411,
    target-qualified
    86c8fe7d8e17d2a746d00984c6df386fe829657e60a8276308e897fe145585fb). The
    entire grid can be swept against those four digests before any bulk parsing
    is written, which is why the pilot is minutes rather than hours.
    WHY THE ARITHMETIC AUDIT RIDES ALONG. Unique-key counts are a second,
    independent oracle over the same computation and cost nothing extra. For a
    corpus of N rows partitioned into classes, the number of distinct keys
    equals N minus the total size of the multirow groups plus the number of
    those groups. The validation report supplies N = 67, literal_multirow_groups
    7, target_qualified_multirow_groups 4, target_qualified_unique_keys 63 and
    literal_unique_keys 59, and separately asserts 60 literal keys inside
    D-KEY-001. Recomputing the key classes settles which figure is right and
    whether the four enumerated cross-target collision groups are the complete
    list of literal multirow groups or only the four that mattered for that
    defect.
  tracked_object: >-
    The canonical byte string that hashes to a committed comparison-key digest,
    propagated by single-axis substitutions of the serialization convention
    (field order, separators, quoting, escaping, integer rendering, identity
    composition, encoding).
  lossy_projection_test: >-
    PASSES, and the pass is the argument. field tuple -> SHA-256 digest is
    non-invertible with an infinite fibre, and what it retains - the equality
    relation on keys - is exactly and only what the dominance gate consumes.
    The corollary the proposal exploits is that the projection is a function
    only relative to a serialization, so the discarded structure (the
    convention) must be declared for the retained structure to be checkable at
    all.
  novelty_status: unverified
  citations:
    - ref: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-bb6d5d/validation-report.yaml
      provenance: internal
      claim: >-
        comparison_key_reconstruction states literal_key as "ordered mapping of
        the 11 fields listed under frontier-schema.yaml
        required_row_fields.comparison_key; canonical JSON with sorted keys,
        SHA-256 bound per row below" and target_qualified_diagnostic_key as
        "identity.primitive + identity.primitive_variant +
        identity.primitive_class + the literal 11-field key; diagnostic only,
        not an amendment to the frozen schema"; it reports literal_unique_keys
        59, target_qualified_unique_keys 63, literal_multirow_groups 7,
        target_qualified_multirow_groups 4. Defect D-KEY-001's
        mechanical_evidence states "67 rows produce 60 literal keys but 63
        target-qualified diagnostic keys". Row LEGACY-SHA0-COLLISION-DEMO
        carries raw_comparison_key_sha256
        73a2164210e1999ea9568599646000a6989350cb07b3cad0d70a0fd92ffb3c0f and
        target_qualified_key_sha256
        ba4711994a125889cc37dd7ec2bc4457eac1a2b2fd3e3e38b453541add01bb30; row
        LEGACY-SHA1-IP-COLLISION-THEORY carries raw
        133a1001feed4421852c2cf7561a62524e9402aee1db076c137de7764d338411 and
        target-qualified
        86c8fe7d8e17d2a746d00984c6df386fe829657e60a8276308e897fe145585fb. The
        file contains 67 occurrences of target_qualified_key_sha256.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - lines
        1-1129 of 2256 read in full (all header blocks, the full defect list,
