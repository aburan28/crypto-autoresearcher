  assumptions:
    - >-
      The grid of candidate canonicalisation rules is DECLARED AND FROZEN,
      with its exact size, before any digest is computed. Extension rounds are
      permitted, but each is declared separately with its size and its order in
      the sequence, and the report states in which round the successful rule
      was found. This does not affect correctness - the acceptance criterion
      has no false positives - it affects only the honest statement of how far
      the true convention sits from any documented one.
    - >-
      A recovered rule is NEVER back-written into the committed schema or any
      committed row by this experiment. The deliverable is a derived artifact
      plus a recommendation; only a Coordinator decision on reviewed evidence
      can normatively record a canon.
    - >-
      No cryptanalytic search, attack execution, or hash cryptanalysis occurs.
      SHA-256 is used only as an oracle over a declared domain of at most 2^12
      candidate strings per row. No property of SHA-256 is assumed beyond
      collision resistance, and it is used in the safe direction only - a
      match implies equal inputs with overwhelming probability.
    - >-
      Field values are taken verbatim from the committed YAML as parsed, with
      the parser and its version recorded, because YAML type coercion (integer
      80 versus string "80", the unquoted value "null", boolean-looking
      strings) is itself one of the grid axes and must not be silently
      normalised by the reader before the grid is applied.
    - >-
      If two committed digests for the same row are mutually inconsistent under
      every rule in every declared round, that is reported as a defect of the
      committed artifacts and is not repaired by choosing whichever rule
      matches more rows.
  proof_search_map:
    bottleneck: >-
      The step "recompute this row's comparison key and compare it with the
      committed one". Every audit of the frontier's central operation - and
      every sibling proposal filed under this question, all four of which
      recompute or re-partition keys - passes through this step. If it cannot
      be executed, no independent party can check a single dominance decision,
      and the frontier's comparability rests on trusting one producer session's
      arithmetic.
    baseline_embedding:
      parameter_slice: >-
        The rule the validation report's sentence most naturally denotes -
        canonical JSON, sorted keys, UTF-8, compact separators, integers
        rendered as JSON numbers, identity fields prepended in the order
        primitive, primitive_variant, primitive_class. This is the exact
        old-method boundary and is grid element 0, evaluated first and reported
        separately whatever the sweep later finds.
      reproduction_check: >-
        THREE-PART FROZEN FIXTURE, each part exact and each able to fail.
        (a) ANCHOR - grid element 0 against the four anchor digests of the two
        rows whose complete field content was read this session. (b) BULK - the
        successful rule, if any, against all 67 raw and all 67 target-qualified
        digests in the validation report, requiring 134 of 134. (c) CROSS-FILE
        - the same rule against the 30 target_qualified_key_sha256 values
        carried independently in the canonical compilation, requiring exact
        agreement with the validation report on the rows they share, which also
        tests whether the two artifacts were produced by the same code path.
    observation_collision:
      observable: >-
        The 256-bit committed key digest.
      distinct_preimage_search: >-
        THE COLLISION RUNS IN THE UNUSUAL DIRECTION AND IS ALREADY PRESENT.
        Two distinct ground truths sharing one digest is what collision
        resistance forbids and is not the failure here. The failure here is
        ONE ground truth admitting MANY observables - a single row's field
        tuple maps to a different digest under each serialization convention,
        so the map result -> digest is not a function until a canon is fixed,
        and the committed corpus fixes none. SEPARATING CONDITION, which is a
        concrete schema recommendation - the canon must be stated normatively
        in the schema (field order, separators, encoding, integer rendering,
        identity composition, and a worked test vector with its digest), at
        which point the digest becomes an auditable binding rather than an
        attestation. A SECOND collision to hunt during execution - two
        different rules in the grid producing identical byte strings for every
        row of this corpus (for instance a separator choice that never occurs
        because no field value contains the separator character), which would
        mean the recovered rule is under-determined by this corpus; the report
        must list ALL rules that match, not the first one found.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the committed digest" by "(declared canon, recomputed
          digest, agreement flag)", so that key identity becomes an exactly
          checkable condition rather than a recorded value.
        predicted_gain: >-
          MODELED, NOT MEASURED. Encoding obligation - the canon must reproduce
          134 of 134 committed digests or the disagreement must be itemised
          per row. Soundness obligation - no row's key may be adjusted to fit a
          rule. Transfer obligation - a canon recovered from this snapshot is
          declared for this snapshot and does not retroactively validate
          artifacts produced under other code paths. Cost-loss obligation - the
          added cost is one paragraph of schema text and one test vector.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the digest) fixed and vary the forgotten
          structure (the convention), exhibiting the set of conventions
          consistent with the committed digests; report its cardinality.
        predicted_gain: >-
          MODELED, NOT MEASURED. A cardinality of exactly 1 means the corpus
          determines the canon uniquely and recovery is complete; a cardinality
          above 1 means the canon is under-determined and the report must say
          which axes the corpus cannot resolve; a cardinality of 0 is the
          decisive negative and is the outcome that matters most.
    quantifier_order: >-
      CLAIMED - THERE EXISTS a rule c in the declared grid G such that FOR ALL
      67 rows r, SHA256(c(key(r))) equals the committed digest of r, for both
      the literal and the target-qualified key. The existential is over a
      DECLARED, FROZEN, FINITE set whose size is reported, which is what
      distinguishes this from an unbounded fit. NOT CLAIMED - that the
      recovered rule is the one the producer intended, that it is the right
      canon for future artifacts, or that any rule outside G fails (a
      negative outcome is scoped to G and to the declared extension rounds,
      and is reported with |G| and the round sizes attached).
    method_ceiling:
      strongest_certifiable_claim: >-
        For snapshot commit 5fc23783da8a2e62e2b3ab8728e47c48958ce02f - either
        (i) an exhibited canonicalisation rule with a worked test vector that
        reproduces all 134 committed digests, together with the complete set of
        grid rules that do so, or (ii) the statement that no rule in a declared
        grid of stated size, over stated axes, reproduces even the two anchor
        rows, with the per-axis elimination recorded. The method can NEVER
        certify that the producer used the recovered rule, NEVER certify that
        a non-matching digest was fabricated rather than computed under an
        unlisted convention, and NEVER say anything whatever about any
        published attack or cost.
      nearby_object_control: >-
        THE PERTURBED-ROW NULL OBJECT. Take an anchor row, change ONE character
        of ONE comparison-key field value (for example round_convention
        SHA_steps to SHA_step), and re-run the entire sweep. The required
        outcome is that NO rule in the grid matches the committed digest. If
        some rule does match a perturbed row, the instrument is not testing
        what it claims - it is searching a space large enough to absorb an
        error - and every positive result from that run is void. This control
        is the direct analogue of inventor-protocol section 3's null object,
        applied to the search rather than to the data, and it must be run
        before any success is reported.
    proof_obligations:
      - claim: >-
          The grid is declared with its exact size and axes before the first
          digest is computed, and the declaration is hash-bound in the run
          record.
        responsibility: interface
      - claim: >-
          Grid element 0 (the literal reading of the validation report's
          sentence) is evaluated and reported separately whatever else is
          found.
        responsibility: baseline
      - claim: >-
          A rule is accepted only on 134 of 134 agreement; partial agreement is
          reported as partial and localised per row and per key type.
        responsibility: correctness
      - claim: >-
          The complete set of matching rules is reported, not the first match,
          so that under-determination of the canon is visible.
        responsibility: strictness
      - claim: >-
          The perturbed-row null control returns zero matches.
        responsibility: correctness
      - claim: >-
          Unique-key counts are recomputed and the 59-versus-60 contradiction
          is resolved by the identity unique = N - sum of multirow group sizes
          + number of multirow groups, with the complete list of multirow
          groups emitted.
        responsibility: correctness
      - claim: >-
          All conclusions scoped to the committed snapshot and to the declared
          grid, with |G| and every extension round size stated in the summary
          sentence, not only in an appendix.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Q1 anchor recovery - whether some rule in the declared grid reproduces
        all four anchor digests (raw and target-qualified for
        LEGACY-SHA0-COLLISION-DEMO and LEGACY-SHA1-IP-COLLISION-THEORY)
      direction: different
      minimum_effect: >-
        Two-sided and both sides decisive. Success means the canon is
        recoverable and the defect is documentation-only. Failure across a
        declared grid of at least 2^10 rules means the committed digests are
        not derivable from the committed fields by any conventional
        serialization, which is a first-order reproducibility defect and is the
        more consequential outcome.
    - metric: >-
        Q2 bulk agreement - number of committed digests reproduced by the best
        rule, out of 134 (67 raw plus 67 target-qualified in the validation
        report)
      direction: higher
      minimum_effect: >-
        134 of 134 for acceptance. Any value strictly between 1 and 134 is the
        MOST informative outcome available, because it localises the failure to
        specific rows or to one key type, and those rows become named
        candidate defects. A value of 0 with a successful anchor match is
        impossible and would indicate an instrument bug.
    - metric: >-
        Q3 documentation fidelity - whether the successful rule is grid element
        0, the literal reading of the validation report's own sentence
      direction: different
      minimum_effect: >-
        Two-sided. If element 0 succeeds, the prose is accurate and the only
        repair needed is to move it from a review report into the schema. If a
        different element succeeds, the committed prose description of the key
        is WRONG and a successor correction is required naming both.
    - metric: >-
        Q4 canon determinacy - the number of distinct grid rules that reproduce
        all 134 digests
      direction: lower
      minimum_effect: >-
        exactly 1 for a complete recovery. A count above 1 means the corpus
        under-determines the canon on at least one axis, and the report must
        name which axes are unresolved rather than presenting one rule as the
        canon.
    - metric: >-
        Q5 unique-key arithmetic - the recomputed number of distinct literal
        comparison keys over the 67 rows
      direction: different
      minimum_effect: >-
        Exactly one of 59 or 60 is reproduced, resolving the contradiction
        inside the committed validation report; the complete list of multirow
        groups is emitted alongside, and the prediction is that the 4
        enumerated cross-target collision groups are a strict subset of the 7
        reported literal multirow groups. A third value reproducing neither
        figure would mean the recomputation and the report disagree entirely
        and would be reported as such.
    - metric: >-
        Q6 perturbed-row null control - number of grid rules matching a
        deliberately corrupted anchor row's committed digest
      direction: lower
      minimum_effect: >-
        exactly 0. Any nonzero value voids every positive result from the run.
  minimal_test:
    design: >-
      Pure recomputation over committed files; no retrieval, no network, no
      cryptanalysis, no adjudication, no judgment calls.
      STEP 0 - declare and hash-bind the grid - the axes are at least (a) field
      order (schema order versus lexicographic), (b) serialization form (JSON
      object, JSON array of values, delimiter-joined key=value, delimiter-joined
      values only), (c) separator and item separator, (d) ensure_ascii on or
      off, (e) integer rendering (JSON number versus quoted string) for
      rounds_attacked and total_rounds, (f) trailing newline present or absent,
      (g) input encoding (UTF-8 versus UTF-8 with BOM), (h) identity
      composition for the target-qualified key (three fields prepended as a
      delimiter-joined string, versus merged into the same object under their
      own names, versus a nested object), and (i) whether the digest is over
      the string or over its hex or base64 form. Report the exact product size.
      STEP 1 - sweep the entire grid against the four anchor digests. This is
      the whole pilot and it needs no YAML bulk parsing.
      STEP 2 - for every rule surviving STEP 1, sweep all 67 rows for both key
      types from the validation report's row_checks, requiring 134 of 134;
      cross-check against the compilation's 30 values.
      STEP 3 - run the perturbed-row null control and report its zero.
      STEP 4 - recompute key classes and settle Q5, emitting the complete
      multirow-group list with sizes.
      STEP 5 - report the matching rule set, the per-axis elimination table,
      and, if nothing matches, the axes that were varied and the declared grid
      size, as a reproducibility finding.
      Every step's output is reported whether or not the predictions hold; a
      run that recovers nothing is a complete result and is arguably the more
      important one.
    controls:
      - >-
        Perturbed-row null object - a one-character corruption of an anchor
        row must yield zero matches across the whole grid; nonzero voids the
        run.
      - >-
        Grid element 0 baseline - the literal reading of the committed prose is
        evaluated and reported separately, so the answer to "is the
        documentation right" is never merged into "was a rule found".
      - >-
        Cross-file consistency control - the 30 digests in the canonical
        compilation must agree with the corresponding validation-report digests
        for the same rows; disagreement means the two artifacts were produced
        by different code paths and is itself a defect.
      - >-
        Complete-match-set reporting - all matching rules are enumerated rather
        than the first, so that an under-determined canon is visible instead of
        being presented as recovered.
      - >-
        Parser-invariance control - the sweep is run twice with two different
        YAML parsers or two different type-coercion settings, and any
        difference in the field values fed to the grid is reported, since a
        parser that silently coerces the integer round counts would change
        every digest.
    required_metrics:
      - "declared grid axes, the exact product size |G|, and the hash of the frozen declaration"
      - "Q1 anchor result - matching rule count over the four anchor digests"
      - "Q2 bulk agreement count out of 134, with per-row and per-key-type breakdown of any failures"
      - "Q3 whether grid element 0 succeeded, stated as a bare yes or no in the summary"
      - "Q4 number of distinct rules reproducing all 134 digests, with the full list"
      - "per-axis elimination table - for each axis, which values were excluded by which rows"
      - "Q5 recomputed distinct-literal-key count, the complete multirow-group list with sizes, and the resolution of the 59-versus-60 contradiction"
      - "Q6 perturbed-row null control match count (must be 0)"
      - "cross-file consistency result on the 30 shared digests"
      - "parser and version used, and the parser-invariance control outcome"
      - "instrument wall-clock runtime and the number of SHA-256 evaluations performed"
  falsification_conditions:
    - >-
      No rule in a declared grid of at least 2^10 elements reproduces even the
      anchor digests, and no bounded extension round does either. The committed
      key digests are then not derivable from the committed field values by any
      conventional serialization; "exactly matched" is not machine-checkable on
      this corpus; and the forward guidance is that every future frontier
      instrument must recompute keys under a declared canon and must treat the
      committed digests as historical attestations rather than as bindings.
    - >-
      A rule reproduces the anchors but fewer than 134 of 134 in bulk. The
      canon is partially recovered and the non-matching rows are named
      candidate defects; no global claim about the corpus is made.
    - >-
      Grid element 0 succeeds on all 134. The committed prose is accurate, the
      lane closes as a controlled positive with the named repair being to move
      the canon into the schema with a worked test vector, and Q3 is answered
      "documentation is right, location is wrong".
    - >-
      More than one rule reproduces all 134 digests. The canon is
      under-determined by this corpus; the report names the unresolved axes and
      declines to present any single rule as the canon.
    - >-
      The perturbed-row control produces a match. The search space is large
      enough to absorb a corruption; the instrument cannot support a positive
      claim and every result from the run is withdrawn.
    - >-
      The recomputed distinct-key count reproduces neither 59 nor 60. The
      recomputation and the committed report disagree entirely, which
      supersedes the narrower contradiction and is reported as the finding.
    - >-
      Cross-file digests disagree between the compilation and the validation
      report for a shared row. Two committed artifacts carry different keys for
      one row, which is a blocking defect and is reported before any canon
      claim.
  confounders:
    - >-
      Overfitting the convention, in the reputational rather than the
      statistical sense. The acceptance criterion has no false positives at
      2^-256 per row, so a match is correct; what an unbounded search can
      corrupt is the CLAIM about documentation quality. Mitigated by freezing
      and hash-binding the grid, by evaluating element 0 first and reporting it
      separately, and by stating the round in which the match was found in the
      summary sentence.
    - >-
      Parser coercion. rounds_attacked and total_rounds are YAML integers and
      several fields could be coerced (a value "null", a value that looks
      boolean, a value with a leading zero). A parser that normalises before
      the grid sees the values would silently eliminate correct rules.
      Mitigated by the parser-invariance control and by recording the parser
      and version.
    - >-
      Whitespace and line folding. Several committed field values contain
      spaces and at least one contains a slash and a bracketed expression
      ("first/selected consecutive Keccak-p[1600] rounds as parameterized in
      source Table 5"), and YAML line folding can alter internal whitespace on
      re-emission. The grid must operate on parsed values, and the report must
      state whether any value's parsed form differs from its literal file text.
    - >-
      Digest transcription. A committed digest could itself contain a typo, in
      which case exactly one row fails under the true rule. This is why bulk
      failure must be reported per row rather than as a fraction - a single
      failing row is a different finding from a systematic mismatch.
    - >-
      Scope creep into hash cryptanalysis. Nothing here attacks SHA-256 and
      nothing may be reported as if it did; the search domain is a declared set
      of at most a few thousand strings per row and the report must say so
      explicitly to prevent a later reader from mistaking it for a preimage
      claim.
  interpretation_limits:
    - >-
      Scoped to snapshot commit 5fc23783da8a2e62e2b3ab8728e47c48958ce02f, the
      67 rows of the validation report's row_checks, and the 30 digests in the
      canonical compilation. It says nothing about artifacts produced by other
      tasks or other code paths.
    - >-
      A recovered rule is the rule CONSISTENT WITH the committed digests over
      this corpus. It is not proof that the producer used it, and it does not
      retroactively validate any other artifact.
    - >-
      A failure to recover is scoped to the declared grid and its stated size.
      It is not a claim that no rule exists, and the report must state |G| in
      the same sentence as the negative.
    - >-
      No attack, cost, trail, collision, or key recovery is reproduced,
      verified, or questioned. This experiment never touches the truth of any
      published number.
    - >-
      Resolving the 59-versus-60 contradiction identifies which figure in a
      committed review report is wrong. It does not impugn the report's
      verdicts, which rest on the enumerated collision groups rather than on
      the summary count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Conventionality of the unknown serialization.) The serialization used
        by the producing session lies in the finite set G generated by the
        declared axes - that is, it is a composition of choices a standard
        JSON or string-formatting implementation offers, rather than a bespoke
        transformation such as case folding, field renaming, value
        normalisation, sorting of values, or omission of a field.
      rigorous_support: >-
        No proof is available and none is claimed; the assumption is the whole
        content of the search's completeness and is stated as such. The
        rigorous ingredients in hand are two. First, the validation report's
        own sentence names two specific conventions (schema field order and
        canonical JSON with sorted keys), so at least one intended axis value
        is documented rather than guessed. Second, the acceptance criterion is
        exact, so H1 affects only COMPLETENESS of the search and never
        SOUNDNESS of a positive result - a rule found is correct whether or not
        H1 holds, and H1 is needed only to interpret a negative.
      validation_plan: >-
        WHAT TO SAMPLE - the whole declared grid against the four anchor
        digests, then the survivors against all 134. SCALE - complete
        enumeration of G; no sampling, since |G| is at most 2^12 and each
        candidate costs 67 SHA-256 evaluations, so the exhaustive sweep is
        under 2^19 hash calls. SHORTCUT USED TO REACH SCALE - the two anchor
        rows, whose full field content and both digests are already extracted,
        eliminate almost the entire grid before any bulk parsing is written;
        that is the shortcut and it is exact rather than statistical.
        PREDICTED DISTRIBUTION - under H1 the number of surviving rules after
        the anchor sweep is small (1 to 4) and collapses to 1 after the bulk
        sweep; under the null that the digests are unrelated to the fields, the
        expected number of survivors is |G| * 2^-1024 across four anchor
        digests, i.e. zero, which is exactly why a negative is interpretable.
        TAIL CHECK - if survivors after the anchor sweep number more than 8,
        the anchor rows are too structurally similar to separate the axes (both
        are legacy hash rows with rounds 80 of 80), and a third anchor row from
        a different shard with different field shapes must be extracted before
        continuing; that contingency is written into the design rather than
        discovered later. TRANSFER ASSUMPTION, STATED - a canon recovered here
        is asserted only for this snapshot's artifacts and is not assumed for
        any other producing session.
    - id: H2
      statement: >-
        (Digest fidelity of the committed record.) The 134 digests in the
        validation report and the 30 in the compilation were computed by
        machine from the committed field values, and any single-row mismatch
        under an otherwise successful rule is a transcription defect in one
        digest rather than evidence against the rule.
      rigorous_support: >-
        Not proved, and it is the assumption that decides how a partial bulk
        match is read. The rigorous ingredient in hand is the internal
        redundancy of the record - the report carries per-row raw AND
        target-qualified digests, per-row peer lists, and aggregate unique-key
        counts, and these constrain one another, so a fabricated or
        mistranscribed digest is very likely to break the peer-list
        consistency as well.
      validation_plan: >-
        WHAT TO SAMPLE - every row that fails under an otherwise successful
        rule; for each, check whether its recorded raw_key_peers and
        target_qualified_peers lists are consistent with the classes the
        recomputed digests induce. SCALE - complete enumeration of the failing
        set, expected to be small or empty. PREDICTED DISTRIBUTION - under H2,
        failures are isolated, do not cluster in one shard or one key type, and
        leave the peer lists consistent; under its negation, failures cluster
        systematically, which indicates a second code path rather than a typo
        and must be reported that way. TAIL CHECK - the failing row whose peer
        list is MOST inconsistent with the recomputed classes, reported
        explicitly with both lists. TRANSFER ASSUMPTION - H2 is asserted only
        for these two artifacts and is not a general statement about this
        program's records.
  target_complexity:
    time_exponent: >-
      NO CRYPTANALYTIC EXPONENT IS CLAIMED OR MOVED, AND NO HASH FUNCTION IS
      ATTACKED. Instrument cost - the anchor sweep is |G| * 4 SHA-256
      evaluations, at most 2^14 for |G| = 2^12; the bulk sweep is
      (survivors) * 134, at most a few thousand; the class recomputation is
      O(N log N) on N = 67 digests. Total well under 2^19 hash evaluations and
      under one second of CPU. The search domain is a declared finite set of
      serialization conventions, not an unstructured preimage space, and this
      distinction must be stated in the run record.
    memory_exponent: >-
      O(N * F) for N = 67 rows and F = 14 fields, plus O(|G|) rule descriptors
      - kilobytes. No memory pressure and no time-memory tradeoff.
    best_known: >-
      There is no incumbent. The committed schema states no canonicalisation,
      so the incumbent procedure for checking a committed key is to trust it;
      the incumbent value on every metric here is UNDEFINED rather than worse.
      The nearest incumbent inside this program is IDEA-20260829-9aaa40, which
      names key-hash reproduction as a halt condition and a hidden cost but
      declares no search space, no acceptance criterion and no null control,
      and therefore cannot produce any of Q1 to Q6. Externally, canonical
      serialization for hashing is standard engineering practice (JSON
      Canonicalization Scheme and similar); no external work on recovering an
      undocumented canon from a corpus of digests was located this session, and
      nothing was fetched, so external dominance is BOUNDED-SEARCH NEGATIVE
      rather than established absent.
    hidden_overhead: >-
      The o(1) is small and honest here, which is unusual for this question -
      there is no adjudication, no reviewer time, and no retrieval. The real
      hidden cost is the risk of an OPEN-ENDED grid: if the declared grid
      fails, the temptation to keep adding axes is unbounded, and the design
      absorbs that by requiring each extension round to be declared with its
      size and reported in the summary. A second hidden cost - if the true rule
      involves value normalisation (case folding, whitespace collapse), the
      grid as specified cannot find it, and the negative would then be an
      artifact of H1 rather than of the corpus; this is the exact failure mode
      H1's validation plan is written to expose.
    tradeoff_note: >-
      The instrument's analogue of a time-memory tradeoff is a
      COMPLETENESS-versus-CREDIBILITY tradeoff and it must be reported as a
      curve. Enlarging the grid monotonically increases the chance of
      recovering the canon and monotonically weakens any statement that the
      canon was documented, because a rule found in extension round 5 of a 2^16
      grid is by construction not the rule anyone wrote down. Deliverable - the
      (round index, cumulative grid size, matched or not) table, so the
      distance between the recovered rule and the documented one is visible
      rather than buried. Parallelization is irrelevant at this scale and is
      not claimed.
