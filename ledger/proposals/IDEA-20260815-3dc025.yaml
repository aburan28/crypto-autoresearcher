idea:
  id: IDEA-20260815-3dc025
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    "THERE IS NO NORM ON E(F_p)" IS FALSE AS USUALLY STATED, AND FIXING IT LOCATES
    THE REAL OBSTRUCTION: Lenstra's CM structure theorem gives E(F_p) = O/(pi-1)O,
    an honest QUOTIENT RING carrying an honest norm and therefore an honest
    smoothness notion -- the exact ingredient index calculus uses over F_p^* -- so
    the barrier is not the absence of the structure but the DLP-equivalence of the
    coordinate that exposes it, and that is a sharper and more attackable statement
    than the folklore it replaces
  class: barrier

  claim: >-
    (A) THE FOLKLORE AND WHY IT IS THE WRONG SENTENCE. The standard explanation for
    why index calculus works over F_p^* and not over E(F_p) is that the former sits
    inside a ring with unique factorisation, giving a notion of smoothness, and the
    latter "has no ring structure" and therefore no smoothness. THE SECOND HALF IS
    FALSE. For an ordinary curve with End(E) = O an order in an imaginary quadratic
    field, Lenstra's CM structure theorem gives an isomorphism of O-modules
        E(F_p)  ~=  O / (pi - 1) O
    where pi is Frobenius. The right-hand side IS a quotient of a ring. O has a
    norm form, ideals of O factor, and a residue class can be called smooth if it
    has a representative of smooth norm. EVERY INGREDIENT THE FOLKLORE SAYS IS
    MISSING IS PRESENT. This record's first claim is that the program should stop
    repeating the folklore sentence, which is not merely imprecise but points
    attention at the wrong place.

    (B) WHERE THE OBSTRUCTION ACTUALLY IS. The isomorphism of (A) is an isomorphism
    of abstract O-modules. To USE it for relation collection an attacker needs, for
    a given point R, its residue class in O/(pi-1)O -- and computing that class for
    an arbitrary R is DLP-equivalent: fixing a generator P identifies E(F_p) with
    O/(pi-1)O as a cyclic module, and recovering R's class is recovering its
    coordinate with respect to P, which is the discrete logarithm. THE RING
    STRUCTURE EXISTS AND THE COORDINATE THAT EXPOSES IT IS THE SECRET. That is a
    named obstruction at the docs/inventor-protocol.md section 4 standard, and it
    is strictly more informative than "there is no ring": it says exactly what is
    missing (an effective coordinate), which is a thing one can go looking for.

    (C) THE CONSISTENCY CHECK WITH THE PROGRAM'S OWN THEOREM. This is not an
    isolated observation. IDEA-20260807-df906f's rigidity theorem says every
    exactly-propagating lossy map out of a prime-order subgroup is injective or
    constant. A smoothness predicate derived from the CM coordinate WOULD BE such a
    map if it were computable, so the theorem PREDICTS IN ADVANCE that it cannot
    be. Two independent routes -- Lenstra's theorem plus effectivity, and rigidity
    -- give the same verdict. That agreement is the main reason to believe the
    framing is right, and it is the kind of cross-check the program's structural
    results should be generating and mostly are not.

    (D) THE PART THAT IS ACTUALLY OPEN, AND IS THE REASON TO RUN THIS. The
    coordinate is not uniformly unavailable. On curves with an EFFICIENTLY
    COMPUTABLE ENDOMORPHISM -- j = 0 with the cube-root automorphism, j = 1728 with
    the fourth-root automorphism, GLV/GLS families -- the attacker can apply a
    specific element of O to any point for free. That is genuinely PARTIAL access
    to the O-module structure: the action of one element of O is effective even
    though the coordinate is not. The known consequence is the GLV decomposition,
    which yields a CONSTANT-FACTOR speedup and nothing more. THE OPEN QUESTION THIS
    RECORD POSES: is the constant-factor ceiling a theorem or a habit? Concretely
    -- does effective access to the action of a proper subring O' of O give any
    relation-supply advantage beyond the known scalar decomposition, and is there a
    quantitative statement of the form "effective access to a subring of index f
    buys at most X"? NO SUCH STATEMENT EXISTS IN THIS REPOSITORY, and it is the
    difference between a barrier that is understood and one that is merely
    observed.

    (E) THE PRE-REGISTERED EXPECTED OUTCOME, STATED BEFORE MEASUREMENT SO IT CANNOT
    BE TUNED. Expected: no advantage beyond the known constant factor, with the
    reason being that the efficiently computable endomorphism acts on the
    prime-order subgroup as multiplication by a SCALAR lambda (it must, since it
    commutes with Frobenius and preserves the rational eigenline -- a fact already
    recorded in this program as IDEA-20260807-464ff8), so it supplies no
    information the scalar lambda does not, and lambda is public. IF THAT IS RIGHT,
    the record's deliverable is the quantitative barrier plus the corrected
    folklore. IF IT IS WRONG -- if some subring access yields relation structure
    beyond the scalar -- that is a genuine finding on structured curves and routes
    immediately to its own proposal.

  mechanism: >-
    STAGE 1 (SYMBOLIC). State (A) precisely with the hypotheses Lenstra's theorem
    actually needs (ordinary, End over F_p, the (pi-1) normalisation), state (B)'s
    DLP-equivalence as a reduction in both directions, and state (C)'s cross-check
    against the rigidity theorem. Record the smoothness notion explicitly: which
    norm, on which representatives, with which ambiguity from the choice of
    representative -- THE REPRESENTATIVE AMBIGUITY IS WHERE A NAIVE VERSION OF THIS
    IDEA WOULD DIE and it must be confronted, not deferred.
    STAGE 2 (TOY CONSTRUCTION, TO MAKE THE OBSTRUCTION CONCRETE RATHER THAN
    ASSERTED). At toy p where the DLP is solvable by brute force, actually BUILD
    the CM coordinate for every point of a prime-order subgroup, compute the
    induced smoothness predicate, and measure the decomposition rate a factor base
    of smooth classes would achieve. THIS MEASURES WHAT THE ATTACKER WOULD GET IF
    THE COORDINATE WERE FREE, which is the quantity the barrier is denying, and no
    record in this program has ever computed it. If the rate is poor even with the
    coordinate handed over, the barrier is over-determined and the folklore is
    wrong in a second, more interesting way.
    STAGE 3 (THE PARTIAL-ACCESS LADDER, THE OPEN PART). On j = 0 and j = 1728 toy
    curves and matched generic controls, measure what is computable about the CM
    coordinate WITHOUT the DLP: the action of the efficient endomorphism, the
    induced lattice, and any statistic of the class that is computable from it.
    Compare relation supply against (i) the generic control and (ii) the
    full-coordinate upper bound from Stage 2. The gap between those two is the
    quantitative barrier.
    STAGE 4 (DECISION). Either a quantitative statement bounding what subring
    access buys, with the corrected folklore as a knowledge entry, or an identified
    advantage on structured curves which routes to a new proposal with its own
    exponents and cost table.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over ledger/proposals, ledger/hypotheses and knowledge/ for "O/(pi-1)",
      "CM coordinate", "End(E)-module", "module structure", "Lenstra", "norm form",
      "smoothness on the curve", "no norm", "quotient ring", plus reads of the four
      records that use the module isomorphism.
    results: >-
      The isomorphism itself is KNOWN AND USED here: IDEA-20260808-4d77a6 reads the
      isogeny-volcano level off the public group structure via Lenstra's theorem,
      and three other records invoke it for Smith-invariant arguments. "CM
      coordinate": 0. "End(E)-module": 0. "smoothness on the curve": 0. No record
      derives a SMOOTHNESS NOTION from the ring structure, none states the
      DLP-equivalence of the coordinate as the located obstruction, and none
      measures the decomposition rate under a handed-over coordinate.
      IDEA-20260807-464ff8 independently establishes the scalar-action fact that
      (E) relies on, which strengthens the expected outcome rather than duplicating
      the proposal.
    verdict: >-
      UNVERIFIED, with the honest caveat that this is the record in the batch most
      likely to be KNOWN IN SUBSTANCE outside this repository. Lenstra's theorem is
      from 1996, the DLP-equivalence of the CM coordinate is the kind of remark
      that appears in survey footnotes, and "no norm on E(F_p)" folklore has
      presumably been corrected in print by someone. The Stage 1 literature search
      is therefore a blocking obligation, not a formality, and a finding that this
      is stated elsewhere should DOWNGRADE the record to `known` and keep only the
      Stage 2 and Stage 3 measurements, which are this program's own.

  object_first_candidate:
    tracked_object: >-
      THE RESIDUE CLASS of a point in O/(pi-1)O, and derived from it the SMOOTHNESS
      of that class under the norm form of O -- the direct transplant of the object
      that makes index calculus work over F_p^*, where the tracked object is the
      smoothness of an integer lift.
    lossiness: >-
      GENUINELY LOSSY: the smoothness predicate maps a class to a bit, discarding
      almost everything. It therefore passes the docs/inventor-protocol.md section 2
      test as a projection -- AND IS IMMEDIATELY CAUGHT BY THE RIGIDITY THEOREM,
      which is (C). The object is well formed; the obstruction is effectivity, and
      keeping those two verdicts separate is the record's main analytical duty.
    propagation: >-
      Does NOT propagate under the group law: smoothness of a class is a
      multiplicative-side notion while the group law is the additive side of the
      quotient ring. THAT MISMATCH IS THE SECOND OBSTRUCTION AND IS INDEPENDENT OF
      EFFECTIVITY -- even a handed-over coordinate would not make relations compose,
      which is precisely what Stage 2 measures rather than assumes.
    survival_score: >-
      Survives as a definition; dies at effectivity (B) and, independently, at
      propagation. Two independent deaths is itself the finding, and it is why the
      barrier is stronger than the folklore version.

  null_object_control: >-
    NULL 1 -- GENERIC CURVE CONTROL at matched size for every Stage 3 measurement,
    since j = 0 and j = 1728 differ from generic curves in ways unrelated to the CM
    coordinate (automorphism count above all) and any structured-curve excess must
    be attributed carefully.
    NULL 2 -- RANDOM PREDICATE of matched density in place of the smoothness
    predicate, in Stage 2. If a random predicate of the same density gives the same
    decomposition rate, the smoothness notion carries nothing and the Stage 2
    number is about density, not about the norm.
    NULL 3 -- THE F_p^* POSITIVE CONTROL. Run the identical Stage 2 pipeline on the
    multiplicative group, where index calculus DEMONSTRABLY WORKS. The pipeline
    must show a strong decomposition rate there. IF IT DOES NOT, THE PIPELINE
    CANNOT DETECT SUCCESS AND ITS NEGATIVE ON E(F_p) IS WORTHLESS. This is the most
    important control in the record and it is the one a rushed implementation would
    skip.

  discriminated_from:
    - >-
      IDEA-20260808-4d77a6. SAME THEOREM, DIFFERENT USE: that record reads the
      VOLCANO LEVEL off the public group structure E(F_p) = Z/n_1 x Z/n_2 and is a
      curve-level structural readout. This record asks about the SMOOTHNESS notion
      on residue classes and about point-level relation supply. Neither implies the
      other, and this record should cite that one for the module machinery rather
      than rebuild it.
    - >-
      IDEA-20260807-464ff8. NOT DUPLICATED BUT DEPENDED ON: that record establishes
      that a geometric endomorphism acts on the rational subgroup as a scalar. This
      record uses that as the REASON for its pre-registered expected outcome (E).
      If that record is wrong, this record's expectation flips and Stage 3 becomes
      far more interesting -- so the dependency is stated, not buried.
    - >-
      The GLV/GLS lane (23 records). NOT A GLV PROPOSAL: GLV is a scalar
      decomposition for FAST ARITHMETIC and its constant-factor character is
      established. This record asks whether that constant-factor ceiling is a
      theorem, which is a different question that the GLV literature does not pose
      because it has no reason to.
    - >-
      KN-OPEN-020 and the bounded-degree factor-base theorem. DIFFERENT ROUTE TO A
      NEIGHBOURING PLACE: that lane bounds ALGEBRAICALLY DESCRIBED factor bases by
      Bezout-type counting. This one asks about a factor base described by a
      NUMBER-THEORETIC predicate (norm smoothness) which is not an algebraic locus
      in the curve coordinates at all, so KN-OPEN-020's obstruction does not
      obviously apply to it. THAT NON-APPLICABILITY IS THE RECORD'S STRONGEST
      REASON TO EXIST and is why the smoothness predicate is worth measuring rather
      than dismissed by citation.
    - >-
      The xedni and lifting lane. NOT THAT: nothing is lifted to a global field, no
      height is computed, no Mordell-Weil group appears. The ring here is the
      endomorphism order, which is finite-index and imaginary quadratic.

  assumptions:
    - >-
      The curve is ordinary and End(E) is an order O in an imaginary quadratic
      field with the standard normalisation. Supersingular curves are OUT OF SCOPE
      -- there End(E) is an order in a quaternion algebra, the module statement
      differs, and the whole analysis would need redoing.
    - >-
      Lenstra's structure theorem as recalled in this repository is stated
      correctly. IT IS FLAGGED IN IDEA-20260808-4d77a6 AS "recall-confident" AND
      NOT RE-VERIFIED, which for a load-bearing citation is not good enough; Stage 1
      must check it against the source rather than inherit the recall.
    - >-
      The representative ambiguity in defining smoothness on a residue class can be
      resolved coherently. NOT OBVIOUS: a class has many representatives of
      differing norms, so "smooth class" needs either a canonical representative or
      a quantifier ("some representative of norm below B"), and the two give
      different predicates with different densities. Stage 1 must fix this
      explicitly; leaving it implicit would make every Stage 2 number
      uninterpretable.
    - >-
      Toy p small enough for brute-force DLP so the coordinate can be handed over.
      This bounds Stage 2 to p of a few thousand and is the reason its numbers are
      an upper-bound probe rather than a trend.

  proof_search_map:
    bottleneck: >-
      THE REPRESENTATIVE AMBIGUITY OF THE SMOOTHNESS PREDICATE. Everything else is
      either classical or measurable. If the predicate cannot be defined without
      arbitrariness, Stage 2 measures an artifact of the definition and the whole
      record collapses to the corrected folklore of (A) -- which is still worth
      recording but is much less than the proposal claims.
    baseline_embedding:
      parameter_slice: >-
        The F_p^* positive control at the same p: the classical index calculus
        setting where the analogous smoothness predicate demonstrably supports
        relation collection.
      reproduction_check: >-
        The Stage 2 pipeline must reproduce a healthy decomposition rate on F_p^*
        at toy p, matching the standard smooth-number density prediction for the
        chosen bound. IF IT CANNOT REPRODUCE SUCCESS WHERE SUCCESS IS KNOWN, no
        negative it reports on E(F_p) may be recorded. This is the record's
        baseline embedding in the sense of KN-TECH-080 audit 1.
    observation_collision:
      observable: >-
        The measured decomposition rate of a smooth-class factor base.
      distinct_preimage_search: >-
        The collision to hunt: THE SMOOTHNESS PREDICATE AND A RANDOM PREDICATE OF
        MATCHED DENSITY producing the same rate. That is NULL 2, and if it fires
        then the observable is measuring density alone and the norm structure is
        doing no work -- a direct falsifier for the idea that the ring structure is
        the relevant ingredient.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP into the model where the hypothesis is an exact ring
          condition: E(F_p) as O/(pi-1)O, with relations as ideal factorisations.
          ENCODING: point |-> residue class. COMPLETENESS: exact as an abstract
          isomorphism. SOUNDNESS: exact. TRANSFER: BROKEN AT EFFECTIVITY, which is
          claim (B) and is the whole result. COST LOSS: total -- the encoding costs
          a discrete logarithm, which is the problem being solved. RECORDING A
          TRANSFORM WHOSE COST LOSS IS FATAL IS THE POINT: it localises the failure
          to one obligation instead of leaving it distributed over folklore.
        predicted_gain: >-
          None as an attack. As analysis: converts an absence-of-structure story
          into a single named effectivity obligation, which can then be attacked
          directly on curves where it is partially discharged (Stage 3).
    quantifier_order: >-
      THE CLAIM: FOR ALL ordinary E/F_p THERE EXISTS a ring structure with a norm
      (Lenstra), and FOR ALL efficiently computable procedures THERE DOES NOT EXIST
      one producing the residue class without solving the DLP. THE TRAP, NAMED: the
      second half must be quantified over procedures, not over points -- for MANY
      INDIVIDUAL points the class is computable (the identity, small multiples of
      the generator, anything with known discrete log), and a demonstration on such
      points proves nothing. Stage 3 must sample points with unknown logs only, and
      that sampling discipline is easy to violate without noticing.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "the ring structure exists and carries a norm; the coordinate is
        DLP-equivalent; under a handed-over coordinate at toy scale the
        decomposition rate is [measured]; and with partial subring access on
        structured toy curves the relation supply exceeds the generic control by
        [measured] and falls short of the handed-over bound by [measured]." NO
        ASYMPTOTIC AND NO CRYPTO-SCALE CLAIM follows from any of it.
      nearby_object_control: >-
        F_p^* ITSELF, where the identical analysis SUCCEEDS. A method that reports
        the same barrier for the multiplicative group has not identified what
        distinguishes the two, which is the only question the record is asking.
        This is NULL 3 and it is blocking.
    proof_obligations:
      - claim: E(F_p) = O/(pi-1)O under the stated hypotheses, verified against the source.
        responsibility: correctness
      - claim: computing the residue class of an arbitrary point is DLP-equivalent, both directions.
        responsibility: correctness
      - claim: the smoothness predicate is well defined despite representative ambiguity.
        responsibility: correctness
      - claim: the Stage 2 pipeline reproduces success on F_p^*.
        responsibility: interface
      - claim: Stage 3 samples only points with unknown discrete log.
        responsibility: interface
      - claim: the efficient endomorphism acts as a scalar on the rational subgroup.
        responsibility: correctness

  predictions:
    - metric: F_p^* positive control decomposition rate
      direction: higher
      minimum_effect: >-
        FORCED HEALTHY, matching smooth-number density for the chosen bound. Failure
        voids every negative in the record.
    - metric: decomposition rate on E(F_p) with the CM coordinate HANDED OVER
      direction: different
      minimum_effect: >-
        NO DIRECTION PREDICTED, and this is the record's genuinely unknown number.
        A healthy rate localises the barrier entirely at effectivity (B); a poor
        rate means the additive/multiplicative mismatch kills it independently,
        which is the more interesting outcome and a stronger barrier.
    - metric: smoothness predicate versus matched-density random predicate
      direction: higher
      minimum_effect: >-
        The smoothness predicate must beat the random predicate for the norm
        structure to be doing any work. If it does not, the ring framing is
        decorative and the record must say so.
    - metric: >-
        relation supply on j = 0 / j = 1728 with partial subring access, against
        matched generic controls
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXPECTATION: no advantage beyond the known constant factor,
        because the endomorphism acts as a public scalar (IDEA-20260807-464ff8). An
        advantage that survives the generic control and the automorphism-count
        confounder is the record's positive outcome and routes to a new proposal.
    - metric: sampling discipline audit
      direction: different
      minimum_effect: >-
        FORCED: zero Stage 3 points with known discrete log. A single leaked point
        invalidates the measurement.

  falsification_conditions:
    - >-
      Stage 1 finds Lenstra's theorem misstated in this repository's recall. Fix the
      citation first; every downstream claim is suspended until then.
    - >-
      The smoothness predicate cannot be defined without arbitrary choices. The
      record reduces to the corrected folklore (A) and must report that reduction
      explicitly rather than proceed with an arbitrary choice.
    - >-
      The F_p^* control fails. Pipeline cannot detect success; no negative is
      admissible.
    - >-
      A random predicate of matched density matches the smoothness predicate. The
      ring structure carries nothing measurable and the framing is decorative.
    - >-
      Partial subring access yields relation supply beyond the generic control,
      reproducibly and surviving the automorphism confounder. The pre-registered
      expectation is WRONG and this becomes a structured-curve finding.
    - >-
      Any Stage 3 point turns out to have a known discrete log. Measurement void.

  confounders:
    - >-
      THE AUTOMORPHISM CONFOUNDER, which is the dominant one. j = 0 and j = 1728
      have extra automorphisms (6 and 4 rather than 2), and any relation-supply
      excess on them is FIRST explained by automorphism-induced factor-base
      reduction -- an effect already known and already in this repository's ledger.
      Attributing it to CM-coordinate access instead would be a straightforward
      error and the generic control alone does not separate the two; a matched
      automorphism-count control is also required.
    - >-
      HANDED-OVER-COORDINATE ARTIFICIALITY. Stage 2 measures an upper bound no
      attacker can reach. Reporting it without that framing on every single
      mention would be the most misleading number this record could produce.
    - >-
      TOY-SCALE SMOOTHNESS DENSITY. Smooth-number densities at p in the thousands
      bear little relation to cryptographic scale; Stage 2 rates are diagnostic of
      the mechanism, never of the exponent, and must never be extrapolated.
    - >-
      RECALLED CITATION. The repository's own flag on Lenstra's theorem is
      "recall-confident, NOT re-verified". A barrier built on an unverified recall
      is not a barrier.

  interpretation_limits:
    - >-
      Ordinary prime-field curves only. Supersingular curves have quaternionic
      endomorphism rings and nothing here applies to them.
    - >-
      No attack, no exponent, no crypto-scale claim. Toy scale throughout;
      claim_tier capped at toy.
    - >-
      A negative on the smoothness route closes THAT route at THAT scale with the
      named obstruction. It does not close index calculus, does not close
      KN-OPEN-001, and does not say the direction is impossible -- which the Idea
      Generator prohibition forbids.
    - >-
      The corrected folklore of (A) is a statement about how this program should
      describe a known theorem. It is not itself a research result and must not be
      promoted as one.

  heuristic_assumptions:
    - id: HEUR-CMC-1
      statement: >-
        For an ordinary E/F_p with End(E) = O, computing the residue class of a
        uniformly random point of the prime-order subgroup in O/(pi-1)O is
        polynomial-time equivalent to solving the ECDLP on that subgroup.
      rigorous_support: >-
        The rigorous ingredient is Lenstra's CM structure theorem, which supplies
        the isomorphism; the reduction ingredient is that fixing a generator makes
        the class a coordinate with respect to that generator, so class-computation
        gives the discrete logarithm directly and conversely. Both directions are
        short and are a Stage 1 duty rather than an assumption to carry. THIS IS
        RECORDED AS A HEURISTIC ONLY BECAUSE THE NORMALISATION CONVENTIONS relating
        the module structure to a chosen generator have not been checked here, and
        a normalisation slip is exactly what would make a "reduction" circular.
      falsification_condition: >-
        A polynomial-time procedure computing the class of an arbitrary point
        without solving the DLP; or a demonstration that the reduction is circular
        under the correct normalisation.
      validation_plan: >-
        SAMPLE: toy curves with p in the hundreds to low thousands, ordinary,
        prime-order target subgroup, >= 10 curves x >= 100 random points each, with
        discrete logs computed by brute force ONLY for verification and never
        exposed to the procedure under test. COMPARISON: agreement between the
        class computed via the module route and the brute-force logarithm. TAIL
        CHECK: report any point where the two disagree, since disagreement would
        indicate a normalisation error rather than a cryptographic finding.
        TRANSFER ASSUMPTION: none needed -- the reduction is structural, and the
        toy runs check the normalisation rather than support an extrapolation.
    - id: HEUR-CMC-2
      statement: >-
        Effective access to the action of a proper subring O' of O -- as on GLV
        curves -- yields no relation-supply advantage beyond the public scalar
        lambda by which that endomorphism acts on the rational subgroup.
      rigorous_support: >-
        The rigorous ingredient is that a geometric endomorphism commutes with
        Frobenius and therefore preserves the rational eigenline, acting as a
        scalar on the prime-order subgroup -- established independently in this
        program as IDEA-20260807-464ff8. The distributional ingredient is that a
        public scalar supplies no information beyond itself. THE COMPOSITION IS
        UNWRITTEN and this is a genuine heuristic; the gap is whether relation
        SUPPLY, as opposed to point transport, is fully determined by the scalar
        action.
      falsification_condition: >-
        A measured relation-supply excess on structured curves over matched generic
        AND matched-automorphism-count controls, reproducible across >= 3 curves.
      validation_plan: >-
        SAMPLE: >= 5 j = 0 curves, >= 5 j = 1728 curves, >= 10 generic controls, and
        >= 5 controls matched on automorphism count but without an efficiently
        computable endomorphism -- that last class is what separates the two
        explanations and is the plan's main cost. COMPARISON: relation supply per
        unit work, paired by size. TAIL CHECK: the 10 largest excesses, reported
        with their automorphism counts, since a clean correlation with automorphism
        count rather than with endomorphism availability is the expected confounded
        outcome. TRANSFER ASSUMPTION, STATED AND UNJUSTIFIED: that toy-scale
        relation supply predicts crypto-scale behaviour. IT DOES NOT and is recorded
        as an open extrapolation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The record proposes no algorithm and the route
      it examines is expected to be blocked at effectivity. Stated explicitly rather
      than omitted. IF the pre-registered expectation of (E) failed and subring
      access did buy relation supply, the relevant comparison would be against
      Pollard rho at O(sqrt(N)) and would require its own cost table under
      docs/target-result-profile.md A8 -- none is offered here because no advantage
      is claimed.
    memory_exponent: >-
      Toy-scale only: O(N) to tabulate a prime-order subgroup at p in the low
      thousands, so megabytes. No memory question arises at this scale.
    best_known: >-
      For prime-field ECDLP the incumbent is Pollard rho at O(sqrt(N)) with
      negligible memory, and NOTHING HERE COMPETES WITH IT. For the specific
      question of what subring access buys, the incumbent is the GLV literature's
      constant-factor speedup, which this record does not improve and instead asks
      whether anyone has shown to be optimal. For the structure theorem the
      incumbent is Lenstra 1996, cited and not improved.
    hidden_overhead: >-
      The handed-over-coordinate measurement of Stage 2 hides the entire cost of
      obtaining the coordinate, which is the problem itself. That is deliberate --
      it is an upper-bound probe -- but a number produced under a fatal cheat must
      carry that label everywhere it appears, per docs/inventor-protocol.md section
      6 step 3, which classifies it as soundness-losing.
    tradeoff_note: >-
      The tradeoff exposed is between STRUCTURE AND EFFECTIVITY, and it is the same
      shape as the one IDEA-20260815-f558e4 finds: the structure that would help is
      exactly the structure whose coordinate is the secret. Two independent lanes
      arriving at the same tradeoff is the most interesting thing in this batch and
      is flagged for the coordinator as a possible unifying theme rather than
      claimed as a result.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. AS AN ATTACK: n/a (no result claimed) -- no attack is
    proposed, so no row of the ECDLP frontier applies. AS A STRUCTURE THEOREM:
    entirely dominated by Lenstra 1996, which is the source and is not improved. AS
    A BARRIER: neighbouring but not comparable to KN-OPEN-020's bounded-degree
    factor-base obstruction, which covers ALGEBRAIC factor bases and does not
    obviously cover a norm-smoothness predicate; neither dominates the other, and
    that non-overlap is this record's reason to exist. AS AN ACCOUNT OF GLV: the
    existing GLV literature is more developed on everything except the optimality
    question this record poses. AS A STRUCTURAL RESULT: IDEA-20260807-df906f's
    rigidity theorem reaches the same verdict more cheaply and more generally, and
    this record's independent route is corroboration rather than improvement. Null
    is NOT claimed on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent. CONTENT DELIVERED: a correction to a
    folklore sentence this program repeats -- the ring structure and the norm
    exist, by a cited 1996 theorem -- with the obstruction relocated from "no
    structure" to "DLP-equivalent coordinate", which is a named obstruction at the
    section 4 standard rather than an absence; an independent corroboration route
    for the rigidity theorem, since two unrelated arguments reach the same verdict;
    the first measurement in this program of what decomposition rate a CM-coordinate
    factor base would achieve IF the coordinate were free, which is the quantity
    every version of this folklore implicitly assumes without measuring; and a
    posed, currently unanswered question -- whether the GLV constant-factor ceiling
    is a theorem or a habit -- with a measurement protocol and matched controls.
    Against the prior state, the delta is the relocation of the obstruction and the
    two measurements, and explicitly not any new mathematics.

