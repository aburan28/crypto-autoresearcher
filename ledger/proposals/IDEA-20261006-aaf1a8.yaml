          cofactor-1 null. It does not re-derive the constant 2^{omega(n-1)}.
      - ref: KR-IC-e2d81b
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
        relation: adjacent
        delta: >-
          The row records a designer estimate of at least 2^142 for
          Gaudry-type decomposition on ecGFp5 and says the FGHR symmetry
