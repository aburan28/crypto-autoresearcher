  dominated_by: >-
    KR-IC-46d822 dominates the exponent: O-tilde(q^{8/5}) already includes a
    constant of shape n! times 2^{n(n-1)}, and KR-IC-955fd6 prices torsion
    symmetrization as a further constant about 2^{omega(n-1)}. The gap that
    remains is the unmeasured ideal degree of the double-odd quotient
    (KN-OPEN-9b4a2b), a constant, not an exponent. The distance from 8/5 to
    the rho exponent 5/2 on a group of size about q^5 stays 0.9, and this
    rank does not shrink it.
  sota_delta: >-
    Zero change to the exponent 8/5. The integer the test measures is a
    degree-4 Macaulay rank ratio, with a predicted factor of 2 on one arm.
    Relative to the ecGFp5 estimate of at least 2^142 in KR-IC-e2d81b, a toy
    factor of 2 does not change the leading term.
