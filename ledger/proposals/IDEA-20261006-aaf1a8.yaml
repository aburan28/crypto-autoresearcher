idea:
  id: IDEA-20261006-aaf1a8
  question_id: RQ-GFPN-c01af8
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Degree-4 Macaulay rank of the double-odd 2-torsion quotient against a cofactor-1 null
  class: measurement
  claim: >-
    On a double-odd curve over F_{p'^5} with exactly one F_{p'^5}-rational
    2-torsion point, the rank of the degree-4 Macaulay matrix of the
    (Z/2)^{4} rtimes S_5 quotient of the m=5 summation system is at most half
    the degree-4 Macaulay rank of the S_5-only symmetrization of the same
    system, while the same formal substitution t = u + c/u on a cofactor-1
    curve over the same field, where that substitution is not translation by a
    rational 2-torsion point, does not drop the degree-4 rank by that factor.
    Representation class R1 (Weil-restriction digits of the symmetrized
    summands, as field elements of F_{p'}). Attack stage charged: relation
    decomposition, and only the degree-4 piece of one PDP system. This does
    not move Gaudry's exponent 8/5.
  mechanism: >-
    PAIR. Representation: each decomposed summand is stored by its
    Weil-restriction digits in F_{p'} after the coordinate t = u + beta/u,
    together with one global product w of the signed terms (R1). Operation
    set Sigma: the finite group (Z/2)^{4} rtimes S_5 that permutes the five
    summands and flips the signs coming from translation by the rational
    2-torsion point. Sigma is not the translation action of the prime-order
    subgroup. Full translation of the target is not in Sigma.
    TRICHOTOMY. Partial-action. The elementary symmetric polynomials in the
    t_i and the single sign product w are invariant under Sigma, and they are
    not invariant under a generic translation of the target point, so the
    retained coordinates propagate under this finite symmetry and not under
    the group law.
    LOSSY-PROJECTION TEST. The projection sends an ordered signed 5-tuple of
    summands to (sigma_1, ..., sigma_5, w). It discards the ordering of the
    summands and the individual signs, retaining only the product w. The
    discard is compatible with Sigma because those generators are invariant
    under the group. It is lossy whenever the t_i are pairwise distinct: up
    to 5! times 2^{4} ordered signed tuples share one image, so the map is
    not injective and is not a change of coordinates of a single point. The
    degree-2 function t = u + beta/u is the symmetry coordinate already
    present in the summation system; it is not proposed as a new model of one
    point, and the Kummer-line and degree-d-function-on-E paradigms are not
    the representation being returned. The tracked object is the quotient
    ideal.
    OFF-LIMITS. F2 (factor-base decomposition) is a component: the system is
    a Semaev PDP. What is added is the degree-4 rank comparison of the
    2-torsion quotient against the S_5-only system and against the cofactor-1
    null. No new factor base is built. Membership remains the published
    rescaled predicate x/lambda in F_{p'}, a degree-1 condition inside the
    bounded-degree class scoped by KN-OPEN-020. This proposal does not claim
    a KN-OPEN-020 escape and stops at the Macaulay rank. F1, F3, F4, F5, F6
    and F7 are not used. Families F1 through F7 are off-limits as the primary
    lens.
    The mechanism is not the trace morphism of KR-IC-f5c584, which forces a
    linear equation over F_2. The measurement here is a degree-4 rank in odd
    characteristic. It is also not KR-IC-cd159a: no point is lifted to
    characteristic zero and no rank-deficient lift is sought.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-9b4a2b
      provenance: internal
      claim: >-
        The open degree question for the F_p-rational (Z/2)^{m-1} rtimes S_m
        quotient at n = m = 5 is whether D equals 2^{(m-1)^2} = 2^16; the
        S_5-symmetrized system is recorded there as D = 2^20, and the m = 5
        ideal degree was not measured because the F4 run exhausted memory.
      verified_by: knowledge/open-problems/KN-OPEN-9b4a2b.md
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Exploiting S_m symmetry and small-order torsion reduces PDP cost by
        about 2^{omega(n-1)}; the ecGFp5 quotient ideal degree is marked open.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        For fixed n, Gaudry decomposition on E(F_{q^n}) runs in
        O-tilde(q^{2-2/n}), with the constant growing like n! times
        2^{n(n-1)}, beating rho's q^{n/2} for n >= 3 only asymptotically and
        only heuristically.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-e2d81b
      provenance: internal
      claim: >-
        The designer estimate for ecGFp5 Gaudry-type decomposition is at
        least 2^142, and the applicability of the FGHR symmetry estimate to
        ecGFp5 is unexamined.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
    - ref: KR-IC-cd159a
      provenance: internal
      claim: >-
        Silverman's xedni calculus, lifting points to Q and looking for
        rank-deficient lifts, succeeds with negligible probability, and
        lifting-based ECDLP approaches inherit that obstruction.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases are scoped by an interface
        obstruction; the universal no-go remains open for high-degree,
        implicit-membership, and target-dependent descriptions.
      verified_by: knowledge/open-problems/KN-OPEN-020.md
    - ref: RQ-GFPN-c01af8
      provenance: internal
      claim: >-
        The question asks for the symmetrization-aware cost of Gaudry
        decomposition on EcGFp5 versus curves without rational 2-torsion,
        at a toy ladder in the base prime with n = 5 fixed.
      verified_by: ledger/questions/RQ-GFPN-c01af8.yaml
  assumptions:
    - >-
      F2 is used only as the summation system under test. The factor base is
      the published degree-1 rescaled predicate and is not a KN-OPEN-020
      escape.
    - >-
      A memory abort of the linear algebra is an infrastructure outcome and
      is not a mathematical negative.
    - >-
      The degree-4 rank is a proxy for whether the 2-torsion relations remove
      generators. It is not itself the ideal degree D.
  proof_search_map:
    bottleneck: >-
      The per-system cost of the m = 5 PDP, whose p'-independence is what
      lets the relation-collection exponent stay 2 - 2/5 rather than pick up
      a factor from the ideal degree. The bottleneck step inside this test
      is the degree-4 piece of that system.
    baseline_embedding:
      parameter_slice: >-
        S_5-only symmetrization of the same m = 5 system, whose ideal degree
        is the 2^20 figure recorded in KN-OPEN-9b4a2b, together with Gaudry's
        exponent q^{2-2/5} from KR-IC-46d822 at n = 5.
      reproduction_check: >-
        On the cofactor-1 arm the quotient rewriting is not a group
        translation, so its degree-4 rank must match the S_5-only rank up to
        the change caused by the formal substitution alone. A mismatch of the
        S_5-only generator count against the monomial support recorded for
        the symmetrized system in KN-OPEN-9b4a2b voids the instrument.
    observation_collision:
      observable: >-
        The degree-4 Macaulay rank of the quotient ideal, which forgets the
        ordered signed tuple and keeps the Sigma-invariant generators.
      distinct_preimage_search: >-
        Two ordered 5-tuples with the same (sigma, w) and different
        underlying point-sums, if found, show the observable does not
        determine the relation. The search is exhaustive at the toy p'.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The ideal of Sigma-invariants inside the Weil-descended m = 5
          summation ideal, generated by elementary symmetric polynomials in
          t_i = u_i + beta/u_i and by w.
        predicted_gain: >-
          A drop of the degree-4 rank by a factor of at least 2 on the
          double-odd arm only. The exponent 8/5 is unchanged; a factor 2 in
          a fixed-degree rank is inside the constant of KR-IC-46d822.
    quantifier_order: >-
      For every small prime p' in the test ladder, and for every double-odd
      curve over F_{p'^5} in the frozen sample, there exists a presentation
      of the (Z/2)^4 rtimes S_5 quotient whose degree-4 Macaulay rank is at
      most half the S_5-only rank, and there exists a cofactor-1 curve over
      the same field on which the formal substitution does not achieve that
      drop.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor change in the degree-4 piece of one PDP system on
        curves with a rational 2-torsion point. The strongest claim this
        method can support is that the 2-torsion quotient removes degree-4
        generators the S_5 symmetrization keeps. It cannot certify
        D = 2^16, and it cannot move the exponent 8/5.
      nearby_object_control: >-
        A cofactor-1 ordinary curve over the same F_{p'^5}, plus a second
        ordinary curve that has a rational 2-torsion point but is not
        double-odd. The desired drop must fail on the cofactor-1 curve. If
        the drop also fails on every rational-2-torsion curve that is not
        double-odd, the mechanism is the double-odd equation rather than
        translation by 2-torsion.
    proof_obligations:
      - claim: >-
          The S_5-only degree-4 rank is reproduced on both arms before the
          quotient is compared.
        responsibility: baseline
      - claim: >-
          The quotient generators are invariant under (Z/2)^4 rtimes S_5 and
          cut out the same PDP solutions as the ordered system.
        responsibility: correctness
      - claim: >-
          A factor-of-two rank drop at degree 4, if observed, is a constant
          and does not change the exponent 2 - 2/5.
        responsibility: runtime
      - claim: >-
          The rank drop decays when the rational 2-torsion point is removed.
        responsibility: strictness
      - claim: >-
          The test prices one system at toy p' and does not charge a full
          relation collection.
        responsibility: scope
    not_applicable_reason: >-
      No subfield is inapplicable. Boundary lift and telescoping potential
      are not the transform in use; the selected transform is
      stronger_invariant, recorded above.
  predictions:
    - metric: >-
        Ratio of degree-4 Macaulay rank of the (Z/2)^4 rtimes S_5 quotient
        to the degree-4 Macaulay rank of the S_5-only system, on the
        double-odd arm.
      direction: lower
      minimum_effect: "<= 1/2"
    - metric: >-
        The same rank ratio for the formal substitution t = u + c/u on the
        cofactor-1 arm, where the substitution is not a group translation.
      direction: higher
      minimum_effect: "> 1/2"
  minimal_test:
    design: >-
      Take the smallest prime p' >= 3 such that F_{p'^5} contains both a
      double-odd curve y^2 = x(x^2 + a x + b) with b nonsquare and a
      cofactor-1 ordinary curve. Build the m = 5 S_5-only system and the
      (Z/2)^4 rtimes S_5 quotient on the double-odd arm, and the S_5-only
      system plus the formal t-substitution on the cofactor-1 arm. Compute
      degree-4 Macaulay ranks only. Do not run F4 to completion and do not
      use p' = 4111, where a previous degree-33 matrix exhausted memory.
      Include one further ordinary curve with a rational 2-torsion point
      that is not double-odd. The curve y^2 = x^3 + x + 1 is not used.
    controls:
      - S_5-only symmetrization of the same system on each arm
      - cofactor-1 curve over the same field, formal substitution only
      - ordinary curve with rational 2-torsion that is not double-odd
      - a second base prime p'' > p' at which degree 4 still fits, as the decay check in p'
    required_metrics:
      - degree-4 Macaulay rank of each arm
      - ratio of quotient rank to S_5 rank on each arm
      - whether the rational 2-torsion translation identity holds on that arm
      - memory used, so an abort can be labelled infrastructure
  falsification_conditions:
    - >-
      On the double-odd arm the degree-4 rank ratio is greater than 1/2.
    - >-
      On the cofactor-1 arm the formal substitution drops the degree-4 rank
      by a factor of 2 or more, matching the object arm, so the drop is the
      coordinate substitution rather than the group action.
    - >-
      The non-double-odd rational-2-torsion curve does not drop while the
      double-odd curve does, so the mechanism is special to that equation
      and the claim as stated about 2-torsion translation is false.
  confounders:
    - >-
      S_5 symmetrization already removes the permutations; a rank drop can be
      that symmetry rather than the (Z/2)^4 factor unless the S_5-only arm
      is the baseline.
    - >-
      A singular or empty PDP at tiny p' makes both ranks zero.
    - >-
      Rewriting t = u + beta/u changes monomial support even when it is not
      a translation, which is why the cofactor-1 arm uses the same algebra.
    - >-
      Degree 4 can miss a drop that appears only at the ideal degree.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. Gaudry's exponent at n = 5
      remains 8/5. A factor 2 in a degree-4 rank, or a drop from the
      recorded 2^20 to 2^16 in solution count, sits inside the constant
      n! times 2^{n(n-1)} of KR-IC-46d822.
    - >-
      The bounded-degree factor base is not escaped. KN-OPEN-020 high-degree,
      implicit-membership, and target-dependent classes are not entered.
    - >-
      A toy rank is claim_tier toy and does not speak to the 2^142 designer
      estimate.
    - >-
      Equality of ranks is a negative about degree 4 only, not a proof that
      D is unchanged.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For fixed n = m = 5, the degree-4 Macaulay rank of each frozen
        presentation, divided by the rank of the S_5-only presentation, is
        independent of the base prime p' once p' is large enough that the
        system is not identically degenerate.
      rigorous_support: >-
        The mixed volume of the raw m = 5 system is recorded in
        KN-OPEN-9b4a2b as 5! times 2^20, a combinatorial count with no p' in
        it. H1 imitates that p'-free count in the same way a mixed volume
        imitates a generic hypersurface degree, and it is not a theorem
        about Macaulay ranks.
      validation_plan: >-
        Compute the rank ratio at the two smallest admissible p' and at the
        next prime where the degree-4 matrix still fits in memory. Compare
        the ratios to each other, not to a density model. If the ratios
        differ by more than a factor of 2 across those primes, H1 fails and
        no p'-independent degree is inferred. No transfer to
        p = 2^64 - 2^32 + 1 is claimed or used.
  target_complexity:
    time_exponent: >-
      Unchanged at q^{8/5} for relation collection at n = 5, times a
      p'-independent constant. The test prices a degree-4 matrix rank, an
      integer, and does not derive a new exponent.
    memory_exponent: >-
      Unchanged. Gaudry linear algebra is the same order q^{8/5} as relation
      collection. One toy Macaulay matrix at degree 4 is polynomial in the
      number of degree-4 monomials in a fixed number of variables.
    best_known: >-
      KR-IC-46d822, opened for this proposal: Gaudry decomposition
      O-tilde(q^{2-2/n}) for fixed n, which is q^{8/5} at n = 5, against
      rho at q^{n/2} = q^{5/2}. KR-IC-955fd6 prices the symmetry as a
      constant about 2^{omega(n-1)}, not as an exponent.
    hidden_overhead: >-
      The O-tilde hides n! times 2^{n(n-1)} and the cost of one Gröbner
      basis. A factor 16 in ideal degree, even if later confirmed, is inside
      that constant.
    tradeoff_note: >-
      No time-memory tradeoff is claimed. Double-large-prime balancing stays
      the one in KR-IC-46d822. Parallelism is irrelevant to a single toy
      rank.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-955fd6
      - KR-IC-e2d81b
      - KR-IC-46d822
      - KR-IC-f5c584
      - KR-IC-cd159a
    nearest:
      - ref: KR-IC-955fd6
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        relation: adjacent
        delta: >-
          The row claims that S_m symmetry and small-order torsion reduce PDP
