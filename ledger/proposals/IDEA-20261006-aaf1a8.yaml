      - ref: KR-IC-f5c584
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        relation: orthogonal
        delta: >-
          The row claims that the trace morphism forces first fall degree 2
          for Weil descent of S_3 on ordinary binary curves. The measurement
          here is a degree-4 Macaulay rank in odd characteristic under a
          2-torsion quotient, not a trace equation over F_2.
      - ref: KR-IC-cd159a
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
        relation: orthogonal
        delta: >-
          The row claims that Silverman's xedni calculus, lifting points to Q
          and looking for rank-deficient lifts, succeeds with negligible
