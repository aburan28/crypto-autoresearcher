idea:
  id: IDEA-20260816-9a91df
  question_id: RQ-ALR-002
  added: '2026-08-16'
  title: Instrument the peak live-slot watermark of a straight-line program and of its transpose at
    matched toy sizes, because the transposition principle preserves operation count but not memory,
    so a moment stream obtained by transposing a composition program may reintroduce the very body
    the compact route exists to avoid
  class: tooling
  claim: '(A) RQ-ALR-002 lists power_projection among its methods and H-ALR-002 emits weighted power
    moments, which is the shape of a transposed modular-composition program. Both ALR questions ask
    for an SLP-direct constructor. Whatever route reaches the moment stream, its cost claim is a memory
    claim, and a memory claim about a straight-line program is a claim about its peak live-slot watermark,
    which nobody in this lane has instrumented. (B) The measurable is that watermark: walking a straight-line
    program instruction by instruction, maintaining the set of slots whose values are still needed
    by a later instruction, and recording the maximum size of that set. The instrument reports it
    for a forward program and for its transpose at matched sizes. (C) The claim under test is a decoupling:
    operation count and watermark move independently under transposition. Specifically, transposition
    of a linear straight-line program preserves the instruction count up to an additive term, but
    the transposed program''s watermark is determined by a different liveness pattern and may exceed
    the forward program''s by a factor that grows with the program''s fan-out structure. If that factor
    is large, then a softly O(n+N+c) operation count obtained by transposition does not deliver a
    softly O(n+N+c) memory footprint, and the lane''s cost claim needs both numbers, not one. (D)
    The deliverable is a reusable instrument plus a table: for each matched pair, forward instruction
    count, forward watermark, transposed instruction count, transposed watermark, and the two ratios.
    The instrument is the durable part and outlives whatever it is pointed at. (E) NOT CLAIMED: no
    attack, no speedup, no assertion that any specific ALR route is or is not obtained by transposition,
    no claim that a large watermark ratio is unavoidable, and no lower bound on the memory of any
    program. The entry builds a measuring device and reports what it reads on programs it constructs;
    it does not measure the open constructor, which does not exist to be measured.'
  mechanism: 'STAGE 1, build the instrument. A straight-line program is represented as a list of instructions
    over F_p, each naming its operands and its result slot. A liveness walk computes, for each instruction
    index, the set of slots still referenced later, and the watermark is the maximum cardinality.
    This is standard compiler bookkeeping and its correctness is checkable against hand-computed small
    cases. STAGE 2, build matched program pairs. Take linear straight-line programs whose transposes
    are well defined, including a modular-composition program and its transpose, a Horner evaluation
    and its transpose, and a Vandermonde application and its transpose, all at toy sizes over F_p.
    STAGE 3, instrument both members of each pair and record instruction count and watermark. STAGE
    4, verify each transpose numerically: the transposed program must compute the adjoint map, checkable
    by comparing bilinear forms on random vectors, and no watermark from an unverified transpose is
    reported. STAGE 5, sweep size and report the watermark ratio as a curve. STAGE 6, run the null
    below. STAGE 7, apply the structural tell: the operation-count ratio should hug one across the
    sweep, since that is what the transposition principle asserts, and if the instrument reports an
    operation-count ratio far from one then the transposes are wrong and no watermark number may be
    interpreted. The operation-count ratio is thus a built-in self-check, not a finding.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-ALR-002.yaml, ledger/hypotheses/H-ALR-002.yaml, ledger/evidence/EV-ALR-002.yaml
      in full. Greps run: grep -ril ''transposition principle'' ledger/ knowledge/ (ZERO hits anywhere
      in the repository); grep -ril ''power.projection|modular composition|Berlekamp.Massey|Prony''
      ledger/proposals/ (3 hits, all titles resolved); grep -ril ''straight.line|straight_line|SLP''
      ledger/proposals/ (11 hits, sampled and resolved); grep -ril ''peak.*live'' ledger/proposals/
      (6 hits, none about slot liveness).'
    results: The phrase transposition principle returns zero hits across the entire repository, ledger
      and knowledge corpus alike, which is the strongest negative screen available here. Power projection
      and modular composition appear as method names in RQ-ALR-001 and RQ-ALR-002 scope blocks but
      in no proposal. The eleven straight-line-program proposals belong to RQ-EWALK-8fa147, RQ-JINV-8fc13a,
      RQ-CANL-63098f and other lanes and none instruments liveness. The six peak-live hits are unrelated
      uses of the words. No record in this repository measures the memory watermark of any program.
    verdict: 'UNVERIFIED. No claim about external literature, and the transposition principle and
      liveness analysis are both standard techniques that this record does not claim to have invented.
      Assembled from known parts: liveness walking is ordinary compiler practice and transposition
      of linear programs is a standard construction. Claimed new only as an instrument in this repository:
      no ALR record, and no record found anywhere in this ledger, reports a peak live-slot watermark
      for any program, so the lane currently has no way to check a memory claim about a straight-line
      program even in principle.'
  object_first_candidate:
    tracked_object: 'The peak live-slot count of a straight-line program: a single integer per program,
      derived from the sequence of live-set cardinalities along the instruction list. The object followed
      through the computation is the live-set cardinality at each step, and the tracked summary is
      its maximum.'
    lossiness: 'The projection discards every field value, every operation identity and the program''s
      entire semantics, keeping one integer per instruction and then one integer overall. It is severely
      lossy: two programs computing completely different functions have the same watermark, and nothing
      about correctness survives. The retained cardinality still propagates because liveness is computed
      by a deterministic backward pass over the instruction list: each instruction adds its result
      slot and removes any operand slot whose last use it is, so the live-set size evolves by a rule
      that depends only on the program''s structure and never on its data. That data-independence
      is exactly what makes the watermark a static measurable and distinguishes it from a runtime
      memory profile.'
    propagation: 'One step of the target operation is one instruction. Acting on the tracked object,
      an instruction maps live-set cardinality L to L + 1 - k where k is the number of its operands
      whose last use it is. Composing over the instruction list produces the cardinality trace, whose
      maximum is the watermark. Under transposition the instruction list is reversed and each instruction
      is replaced by its adjoint, which permutes the pattern of last uses entirely: an operand read
      many times in the forward program becomes a slot written many times in the transpose, so k is
      redistributed and the maximum can move. That redistribution is the mechanism the run measures.'
    survival_score: The watermark is exact and survives every program the instrument can parse, with
      no decay, because it is a static structural quantity. It dissolves for programs with data-dependent
      control flow, which are not straight-line programs at all, and the instrument refuses them rather
      than approximating. The reported survival number is therefore the size of the largest matched
      pair the instrument handles with a verified transpose, together with the largest size at which
      the watermark ratio has been measured rather than extrapolated.
  null_object_control: Generate random straight-line programs of the same length, the same slot count
    and the same operand-reuse distribution as each matched pair member, transpose them by the identical
    construction, and instrument both by the identical code path in the same invocation. The null
    gives the watermark ratio attributable to program shape alone. The signal arm means something
    only if the structured programs, composition and its transpose, depart from that shape-matched
    baseline. If they do not, the finding is that the watermark ratio is a property of program shape
    and carries no information specific to modular composition, which is a complete and usable result.
    A second null instruments a program against itself, where the ratio must be exactly one, catching
    any asymmetry in the instrument.
  discriminated_from:
  - The size ledger entry in this same batch, which counts coefficient slots of a mathematical object;
    this entry counts live slots of a program, so one is a property of a representation and the other
    a property of a schedule, and a program can have a small watermark while manipulating a large
    object by streaming it.
  - The bond-rank entry in this same batch, which measures storage implied by an exact rank factorisation;
    that is a static size of an intermediate, while a watermark is a peak over time and the two can
    differ by the whole depth of the computation.
  - The eleven straight-line-program proposals found in other lanes, none of which instruments liveness
    or memory and all of which use the SLP notion as a cost model rather than as an object to measure.
  - 'The blacklisted RQ-INSTR cost-model and machine-variance audits: nothing here times anything
    or touches hardware, and the watermark is a static count derived from an instruction list, identical
    on every machine.'
  - IDEA-20260807-fafc04, which counts matrix-vector products for Wiedemann under an equivariance
    fold; that is an operation count in a different lane, and this entry's whole point is that operation
    count and watermark are different numbers.
  assumptions:
  - Programs under test are genuinely straight-line, with no data-dependent control flow, so liveness
    is static.
  - The transposition construction applied is the standard one for linear straight-line programs and
    its output is verified numerically before any watermark is reported.
  - A slot holds one F_p element and all slots are charged equally, matching the charging model of
    the size ledger entry so the two remain commensurable.
  - Operation count under transposition is preserved up to an additive term, which the run checks
    rather than assumes and treats as a self-check.
  - Programs large enough to show a watermark effect can be built and transposed at toy sizes.
  predictions:
  - metric: operation_count_ratio_transpose_over_forward
    direction: different
    minimum_effect: 'forced value: must be 1 up to an additive term linear in the number of inputs
      and outputs, since that is what the transposition construction guarantees; a ratio far from
      1 means the transposes are wrong and is a falsification condition, not a finding'
  - metric: watermark_ratio_transpose_over_forward_for_modular_composition_pair
    direction: higher
    minimum_effect: 1.5
  - metric: structured_pair_watermark_ratio_minus_shape_matched_random_null_ratio
    direction: different
    minimum_effect: 0.0
  - metric: self_transpose_null_watermark_ratio
    direction: different
    minimum_effect: 'forced value: exactly 1, or the instrument is asymmetric and void'
  minimal_test:
    design: 'Build the liveness instrument, about one hundred and fifty lines, and validate it on
      three hand-computed programs whose watermarks are known by inspection. Then build three matched
      pairs at sizes 8, 16, 32, 64: Horner evaluation and its transpose, Vandermonde application and
      its transpose, and modular composition and its transpose. Verify each transpose by checking
      the bilinear identity on twenty random vector pairs over F_p, which is exact and cheap. Instrument
      all six programs per size and report instruction count and watermark for each, plus both ratios.
      In the same invocation generate thirty shape-matched random straight-line programs per size,
      transpose and instrument them identically, and report the null ratio distribution. The self-transpose
      null runs on every program. Total compute is seconds, since nothing is executed at scale and
      the walk is linear in program length. It discriminates because the operation-count ratio is
      a hard self-check: a run whose transposes are wrong announces itself before any watermark is
      read.'
    controls:
    - Shape-matched random straight-line programs, thirty per size, transposed and instrumented by
      the identical code path in the same invocation.
    - Self-transpose null, where the ratio must be exactly one, catching instrument asymmetry.
    - Numerical transpose verification by bilinear identity on twenty random vector pairs, before
      any watermark from that transpose is reported.
    - Hand-computed validation programs whose watermarks are known by inspection, run at every invocation
      as a regression check.
    - 'Operation-count self-check: the transpose-over-forward instruction ratio must sit at one up
      to the additive term, or the run is void.'
    required_metrics:
    - forward_instruction_count
    - forward_peak_live_slot_watermark
    - transpose_instruction_count
    - transpose_peak_live_slot_watermark
    - watermark_ratio_transpose_over_forward
    - operation_count_ratio_transpose_over_forward
    - shape_matched_null_watermark_ratio_distribution
    - transpose_verification_pass_rate
  falsification_conditions:
  - The operation-count ratio departs from one beyond the allowed additive term, indicating the transposes
    are wrong and voiding every watermark number in the run.
  - The self-transpose null returns a ratio other than exactly one, indicating an asymmetric instrument.
  - Any transpose fails its bilinear verification.
  - The structured pairs' watermark ratios are indistinguishable from the shape-matched random null
    at every size, so the ratio is a shape property with no composition-specific content.
  - The instrument disagrees with a hand-computed watermark on any validation program.
  - The watermark ratio is exactly one for every pair at every size, which would mean transposition
    preserves memory as well as operations and the entry's central premise is empty.
  confounders:
  - 'Slot reuse policy: an instrument that assumes maximal slot reuse measures a different quantity
    from one that assumes none, and the two can differ by the whole program length; the policy is
    therefore declared and reported with every number.'
  - Shape matching for the null is defined by length, slot count and operand-reuse distribution, and
    a distribution matched only in its mean would not control fan-out, which is the very feature under
    study.
  - The transposition construction has variants, and a variant that inserts accumulation slots changes
    the watermark for construction reasons rather than structural ones.
  - Toy sizes may be too small for a fan-out effect to appear, since watermark differences typically
    grow with fan-out depth.
  - The programs measured are constructed by the experimenter and are not the ALR route, so any ratio
    describes those programs and not the lane's open constructor.
  interpretation_limits:
  - No ALR route is measured; the entry builds an instrument and reads it on constructed programs,
    and the connection to the lane is that the instrument is a precondition for checking any future
    memory claim.
  - A watermark is a static structural count under a declared slot-reuse policy, not a runtime memory
    measurement, and the two can diverge.
  - All numbers are scoped to the constructed programs at the tested sizes, and no asymptotic watermark
    law is claimed.
  - A large watermark ratio does not show that any particular construction must pay it, since a different
    program computing the same map may not.
  target_complexity:
    time_exponent: No attack exponent is claimed. Instruction counts are reported for the constructed
      programs as static counts, which is a property of those programs and not of any algorithm against
      the ECDLP.
    memory_exponent: No asymptotic memory exponent is claimed. The reported memory quantity is the
      peak live-slot watermark in F_p elements, an absolute static count per program under a declared
      slot-reuse policy, together with its ratio between a program and its transpose.
    best_known: 'There is no incumbent instrument: no record found in this repository reports a live-slot
      watermark for any program, so the comparison is against the current practice of stating memory
      claims without a measurable, which the entry replaces with a number.'
    hidden_overhead: 'Hidden in the lower-order terms is the slot-reuse policy, which can move a watermark
      by a factor equal to the program length and is invisible unless declared. The human cost hides
      in transposition: writing a transpose by hand is error-prone and a wrong transpose produces
      entirely plausible watermark numbers, which is why numerical verification gates every reported
      value.'
  dominated_by: n/a (no result claimed). All frontier rows recorded in this lane were checked, the
    B^(5/2) rho proxy and the B^(7/2) represented projector and A-linear target-Krylov routes of EV-ALR-002,
    and an instrument places no point on any frontier.
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative deliverable is,
    per matched pair and size, the pair of ratios: operation count transpose over forward, expected
    at one, and watermark transpose over forward, measured, together with the shape-matched null distribution
    for the latter.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the instrument is built correctly and passes its hand-computed validation
    and self-transpose null: 0.85, since this is ordinary bookkeeping with clear checks. That all
    three transposes verify numerically at all four sizes: 0.7, transposition being the error-prone
    part. That the modular-composition pair shows a watermark ratio above 1.5: 0.45, because toy sizes
    may be too small for fan-out effects to separate. That the structured pairs depart from the shape-matched
    random null: 0.3, and a null result there is the useful outcome, since it would say watermark
    ratio is a shape property and redirect the lane to measuring shape. That the instrument is reused
    by a later ALR entry: 0.6, which is the main reason to build it.'
