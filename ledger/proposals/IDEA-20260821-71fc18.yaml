        results. Relevant as a ready-made ground truth for the tier-0 detector's
        calibration, and as evidence that the crafted-input axis is already
        covered by others.
      verified_by: null

  assumptions:
    - >-
      t = t1 * 2^d + t0 and the public key carries t1 only, so the LowBits
      predicate is not evaluable from pk alone. This is the correction in claim
      (A) and it is a Stage 1 symbolic obligation; if it is wrong the LowBits
      row moves to tier 1 and outcome E2 is realised.
    - >-
      The auditor observes genuine transcripts from a signer under one key and
      can accumulate them. A deployment that rotates keys before the audit's
      sample size is reached defeats the whole lattice, and that is a scope
      statement rather than a result.
    - >-
      Errors in a partially recovered t0 are roughly independent across
      coefficients, so the propagated error is sqrt(tau) delta/sqrt(3) rather
      than the worst case tau delta. The design measures the realised
      propagated error instead of assuming it, because the estimator's errors
      may well be correlated.
    - >-
      No side channel, no fault, no timing. The auditor sees signatures. The
      instant it needs anything else it has crossed into GOAL-MLDSA-001.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the tier assignment of
      the LowBits predicate. If it were tier 1, an auditor would need no t0 at
      all for that predicate, the composition of the question's two objects
      would break for half the table, and the headline sentence would be false.
      Everything else is arithmetic on top of that one classification.
    baseline_embedding:
      parameter_slice: >-
        The exact boundary that reproduces the known case is delta = 0 (exact
        t0), where the tier-2 auditor must agree with the sk-holding instrument
        on every predicate evaluation for every signature. That is the
        old-method limit and it must be reproduced exactly, not approximately.
      reproduction_check: >-
        Frozen fixture of 10^3 signatures per parameter set: with exact t0 the
        auditor's predicate evaluations must equal the signer's recorded ones
        bit for bit. A single disagreement means the auditor's reconstruction
        of w - <<c s2>> is wrong and the whole lattice is unbuilt.
    observation_collision:
      observable: >-
        The certificate is "the auditor's predicate evaluation agrees with the
        signer's". Distinct ground-truth objects with the same observable: an
        auditor that genuinely evaluates the predicate, and an auditor whose
        ambiguous band happens to sit entirely off the events of interest so
        that it agrees on every SAMPLED signature while being unable to decide
        the ones that matter. Because the ct0 events occur at 7e-9, an
        agreement measured on 10^3 conforming signatures says nothing about the
        auditor's power on violating ones.
      distinct_preimage_search: >-
        Broken by moving to a synthetic reachable cell (gamma2 lowered so
        violations are common) and measuring agreement ON THE VIOLATING EVENTS
        specifically, stratified by distance to the threshold. That
        stratification is the only way the ambiguous band's size is observed
        rather than modelled, and it is required before any precision claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express "is this signer conforming" as a statistical experiment
          indexed by side information, so that the question becomes a
          comparison of experiments rather than an open-ended search for a
          detector. Obligations: encoding (tier assignments), completeness
          (every predicate lands somewhere), soundness (monotonicity of
          evaluability), transfer (precision instead of exactness), cost loss
          (the ambiguous band).
        predicted_gain: >-
          Converts "can a verifier tell" into a table of sample sizes with an
          optimality argument, and prices the side information in signatures.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the auditor family from "holds t0" to "holds t0 to precision
          delta", and prove a strict inward improvement: the audit is feasible
          strictly inside the exact-t0 boundary, at delta = 32 for the ct0
          predicate and delta = 128 for LowBits.
        predicted_gain: >-
          A factor of about 63 in signature cost between the two audits, and a
          factor of 2.6 to 6.6 against the full-recovery figure for the LowBits
          audit specifically.
    quantifier_order: >-
      FOR EACH predicate R and EACH parameter set, THERE EXISTS a tier k(R) and
      a precision delta(R) such that FOR ALL transcripts and FOR ALL observers
      holding tier-k(R) information at precision delta(R), the predicate is
      evaluable except on an ambiguous set of stated measure. NOTE THE ORDER:
      the precision is allowed to depend on the PREDICATE and on the parameter
      set but NOT on the transcript, which is what makes the audit a fixed cost
      rather than an adaptive one. A claim with the quantifiers reversed - one
      precision serving all predicates - is explicitly NOT made and is exactly
      what the factor 56 refutes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is a table of detection sample sizes
        for the constructed detectors on the tested parameter sets, with an
        optimality argument inherited from IDEA-20260821-60ba98 that applies to
        TRANSCRIPT-ONLY detectors only. It cannot certify that a signer is
        conforming - absence of a detected violation at 10^5 signatures bounds
        nothing useful when the rate is 7e-9 - and saying so is the honest
        headline rather than a caveat.
      nearby_object_control: >-
        The nearby object where the conclusion fails: ML-DSA-65 and -87, where
        the ct0 predicate cannot fire. There the audit is vacuous, and a method
        that reported "undetectable" identically at -44 and at -65 would have
        conflated "the event is rare" with "there is no event". The design
        forces the two apart by requiring the -65/-87 cells to be labelled
        VACUOUS rather than UNDETECTABLE.
    proof_obligations:
      - claim: 'the LowBits and ct0 predicates are tier 2 and the z-norm and hint-weight predicates are tier 0'
        responsibility: correctness
      - claim: 'propagated error in <<c t0>> is sqrt(tau) delta/sqrt(3) typical and tau delta worst case'
        responsibility: size
      - claim: 'audit precision requirements are delta = 128 (LowBits) and delta = 32 (ct0) at ML-DSA-44'
        responsibility: strictness
      - claim: 'the tier-2 detector is Neyman-Pearson optimal among transcript-only detectors'
        responsibility: baseline
      - claim: 'the tier-0 detector needs 1/(p_R (1 - sigma)) signatures, a factor 1/(1-sigma) worse'
        responsibility: success_probability
      - claim: 'the audits cost 4.7e3 and 7.6e4 signatures of prior t0 recovery at ML-DSA-44'
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        exact-t0 auditor agreement with the signer's own recorded predicate
        evaluations, over 10^3 signatures per parameter set
      direction: different
      minimum_effect: >-
        FORCED VALUE: 1.000, bit for bit, on all four predicates. Any
        disagreement means the auditor's reconstruction is wrong and no row of
        the table is readable.
    - metric: >-
        lowest tier at which the LowBits predicate is evaluable
      direction: different
      minimum_effect: >-
        FORCED VALUE: tier 2, not tier 1. This is the correction to
        IDEA-20260808-4f83f6 and it is decided symbolically at zero compute; if
        it comes out tier 1 the headline composition is false for that
        predicate and outcome E2 is realised for half the table.
    - metric: >-
        ambiguous fraction of ct0-predicate audit decisions as a function of
        bit-plane b, at a synthetic reachable cell, stratified by distance to
        the threshold
      direction: lower
      minimum_effect: >-
        Must fall by a factor of about 2 per bit-plane and must cross 1% at
        b = 6 within one plane. A curve that does not halve per plane means the
        propagated error is not sqrt(tau) delta/sqrt(3) - most plausibly
        because the recovery errors are correlated across coefficients - and
        the precision requirements are re-derived from the measured propagation
        instead.
    - metric: >-
        ratio of the ct0 audit's precision requirement to the LowBits audit's
      direction: higher
      minimum_effect: >-
        FORCED VALUE: about 56 (= gamma2/1693 at ML-DSA-44), i.e. about 2.9
        bit-planes, i.e. about 63 times more signatures. A measured ratio near
        1 would mean the tier-2 predicates need the same precision, the graded
        refinement is empty, and the proposal reduces to the plain tier lattice.
    - metric: >-
        detection sample size for a ct0-omitting signer, tier 0 versus tier 2,
        measured at a synthetic reachable cell and extrapolated by the derived
        1/p and 1/(p(1-sigma)) forms
      direction: higher
      minimum_effect: >-
        The ratio must be 1/(1-sigma), predicted about 110 at the true
        ML-DSA-44 overshoot scale. The MEASUREMENT is at the synthetic cell and
        the extrapolation to true parameters is an explicit transfer
        assumption, never a measurement.
    - metric: >-
        verdict label at ML-DSA-65 and ML-DSA-87
      direction: different
      minimum_effect: >-
        FORCED VALUE: VACUOUS, not UNDETECTABLE, because the envelope theorem
        makes the event impossible rather than rare. A record that emits
        UNDETECTABLE there has conflated the two and fails its own
        interpretation standard.

  minimal_test:
    design: >-
      FIVE STAGES, CHEAPEST FIRST, EACH ABLE TO TERMINATE THE LINE.
      STAGE 0 (algebra, ZERO COMPUTE, TERMINATING, AND IT DECIDES THE HEADLINE):
      derive the tier of each of the four predicates symbolically from FIPS 204
      Algorithm 7 and Algorithm 8, and in particular settle whether the LowBits
      predicate needs t0. This is two lines and it decides between E1 and E2
      for half the table before any machine runs.
      STAGE 1 (exact-t0 auditor, minutes): build the tier-2 auditor with the
      TRUE t0 and check it reproduces the signer's own predicate evaluations
      bit for bit on 10^3 signatures per parameter set.
      STAGE 2 (precision curve, tens of minutes): degrade t0 to bit-planes
      b in {12, 10, 8, 6, 4} and measure the ambiguous fraction per predicate,
      at a SYNTHETIC REACHABLE CELL where ct0 violations are common enough to
      stratify by distance to the threshold. Report monotonicity.
      STAGE 3 (detectors, tens of minutes): run the tier-0 and tier-2 detectors
      against (i) a conforming signer - verdicts committed FIRST - and (ii) a
      ct0-omitting signer, at the synthetic cell; measure both detection rates
      and their ratio against the predicted 1/(1-sigma).
      STAGE 4 (the table): assemble predicate x tier x precision x signature
      cost x detection sample size, with every cell labelled measured, derived,
      theorem, or vacuous, and with the ML-DSA-65/-87 ct0 cells labelled
      VACUOUS.
      WHAT DISCRIMINATES: Stage 0 alone separates E1 from E2 at zero cost.
      Stage 2's curve separates E1 from E3 - if the ambiguous fraction does not
      fall below the interesting events at any affordable b, the obstruction is
      precision and not rate. Stage 3's ratio tests the one number that makes
      the lattice worth having.
    controls:
      - Verdict-on-the-null-first: both detectors run against the CONFORMING signer and their verdicts committed before the omitting signer is examined.
      - Degraded-t0 graded control at five values of b with monotonicity reported (two endpoints do not give a direction).
      - Resampled-t0 arm as the b -> infinity endpoint of the graded control, labelled as such rather than as an independent null.
      - Exact-t0 reproduction check as the delta = 0 boundary, required to be exact rather than approximate.
      - VACUOUS-versus-UNDETECTABLE labelling check at ML-DSA-65 and -87, which is a control on the RECORD rather than on the instrument and is the one this lane is most likely to fail.
      - Stratification by distance to threshold, without which an agreement measured on conforming signatures says nothing about power on violating ones.
    required_metrics:
      - the four tier assignments with their two-line derivations
      - exact-t0 auditor agreement (must be 1.000) per parameter set
      - ambiguous fraction versus bit-plane per predicate, stratified by distance to threshold
      - measured propagated error in <<c t0>> versus the predicted sqrt(tau) delta/sqrt(3)
      - the precision-requirement ratio against the predicted 56
      - tier-0 and tier-2 detection rates at the synthetic cell and their ratio against 1/(1-sigma)
      - the assembled table with every cell's provenance label
      - the signature costs 4.7e3 and 7.6e4 with their dependence on IDEA-20260821-65739b stated in the cell

  falsification_conditions:
    - >-
      Stage 0 shows the LowBits predicate is evaluable from pk alone. The
      correction to IDEA-20260808-4f83f6 is wrong, that record stands as
      written, and this proposal's composition is false for half the table.
    - >-
      The exact-t0 auditor does not reproduce the signer's evaluations bit for
      bit. The auditor's reconstruction is wrong and nothing is readable.
    - >-
      The ambiguous fraction does not halve per bit-plane. The propagated-error
      model is wrong; the precision requirements and both signature costs are
      withdrawn and re-derived from the measured propagation.
    - >-
      The two tier-2 predicates turn out to need the same precision. The graded
      refinement in claim (C) is empty and the proposal reduces to the plain
      tier lattice, which is still worth recording but is a much smaller
      result.
    - >-
      The tier-0 to tier-2 detection ratio is not 1/(1-sigma). Either
      IDEA-20260805-031ce2's sigma is wrong or the detectors are not what the
      derivation describes.
    - >-
      IDEA-20260821-65739b's price curve fails. The two signature costs move
      with it; the tier lattice and the precision requirements survive
      unchanged, and stating which half survives which failure is part of the
      deliverable.
    - >-
      IDEA-20260821-60ba98's identity fails. The optimality argument for the
      tier-2 detector is withdrawn and the table becomes a list of achievable
      sample sizes with no lower bound attached.

  confounders:
    - >-
      AGREEMENT ON CONFORMING SIGNATURES IS NOT POWER ON VIOLATING ONES. With a
      7e-9 event rate, an auditor can agree with the signer on every signature
      anyone will ever see and still be unable to decide the events that
      matter. The stratified synthetic cell is the only defence and its
      transfer to true parameters is an assumption, not a result.
    - >-
      CORRELATED RECOVERY ERRORS. The propagated-error model assumes the
      partial-t0 errors are roughly independent across coefficients. If the
      recovery estimator's errors are correlated - and an averaging estimator's
      errors share the same noise realisations - the propagated error is larger
      than sqrt(tau) delta/sqrt(3) and both precision requirements tighten.
      Measured rather than assumed.
    - >-
      THE SYNTHETIC CELL IS NOT ML-DSA. Lowering gamma2 to make violations
      common changes the ratio gamma2/overshoot, which is the very quantity
      claim (C) computes. The design must recompute the predicted ambiguous
      fractions AT THE SYNTHETIC CELL's own parameters and score against those,
      not against the ML-DSA-44 numbers - scoring a synthetic-cell measurement
      against a true-parameter prediction would manufacture a discrepancy or
      hide one.
    - >-
      A CHAIN OF FOUR INTERNAL DEPENDENCIES. This record consumes sigma, p_R,
      N(b) and the TV identity from four other proposals, none of which has
      been executed. Confidence must not compound optimistically: the table's
      cells inherit the weakest link and each is labelled with its source.
    - >-
      "UNDETECTABLE" IS A COMFORTABLE AND CHEAP CONCLUSION, and it is also the
      one most likely to be misread as reassuring. The VACUOUS-versus-
      UNDETECTABLE control exists because the difference between "there is
      nothing to detect" and "there is something and nobody can see it" is the
      entire content of the parameter-set comparison.

  interpretation_limits:
    - >-
      NOT A BREAK. Everything here is conformance and detection; nothing bears
      on MLWE, MSIS or SelfTargetMSIS in any direction, and no forgery or
      unknown-key signature is produced.
    - >-
      The optimality argument covers TRANSCRIPT-ONLY detectors. A party with
      timing, power or memory observations detects an omitted check trivially,
      and that party is out of scope by this question's own boundary with
      GOAL-MLDSA-001.
    - >-
      Absence of a detected violation bounds almost nothing at these rates and
      must never be reported as evidence that a signer is conforming. The
      licensed sentence is "no violation was observed in N signatures, which
      bounds the omission rate above 1/N".
    - >-
      The ML-DSA-65 and -87 ct0 cells are VACUOUS, not UNDETECTABLE, and every
      downstream restatement must preserve that distinction.
    - >-
      The two signature costs (4.7e3 and 7.6e4) are estimator-relative and
      inherit IDEA-20260821-65739b's conditionality in full; a better recovery
      estimator lowers them and IDEA-20260821-6109f8 exists to find out by how
      much.
    - >-
      This proposal COSTS one specific enablement of t0 - transcript-based
      conformance auditing - as RQ-MLDSA-ffa0f5 requires. It costs no other
      enablement, and in particular says nothing about what t0 buys a
      side-channel adversary, which is the enablement the literature actually
      cares about and which this question forbids estimating.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The per-coefficient errors of a partially recovered t0 are
        approximately independent and symmetric, so that the error propagated
        into <<c t0>>_j by multiplication with a weight-tau ternary challenge
        has standard deviation sqrt(tau) * delta / sqrt(3) rather than the
        worst case tau * delta. LOAD-BEARING for both precision requirements
        and therefore for both signature costs.
      rigorous_support: >-
        Rigorous ingredient: (c e)_j is EXACTLY a signed sum of tau distinct
        coefficients of the error vector e, because c has exactly tau nonzero
        coefficients in {-1,+1} (FIPS 204 Section 2.3), so tau * delta is an
        unconditional worst-case bound with no assumption at all. Classical
        statement imitated: the central limit theorem for a sum of tau bounded
        independent terms, giving the sqrt(tau) scaling that replaces the
        worst case.
      validation_plan: >-
        Measured directly and cheaply at REAL FIPS 204 parameters: take the
        recovery estimator's actual error vector at each bit-plane b, multiply
        by 10^4 realised challenges, and compare the empirical standard
        deviation of the propagated error against sqrt(tau) delta/sqrt(3) and
        against the worst case tau delta. Tail check on the largest propagated
        errors specifically, since the audit's ambiguity is decided by the tail
        and not the bulk. Report the empirical correlation of the error vector's
        coefficients against the assumed 0; sampled parameters, keys and seeds
        recorded. Transfer assumption: none across parameter sets, each
        measured.
    - id: H2
      statement: >-
        The exceedance overshoot of ||<<c t0>>||_inf above gamma2 is
        approximately exponential with mean 1693 at ML-DSA-44, so the ct0
        audit's decision margin has that scale. LOAD-BEARING for the ct0
        precision requirement and hence for the factor 56.
      rigorous_support: >-
        Inherited from IDEA-20260805-031ce2, where it is derived from the tail
        of the same tau-fold convolution that IDEA-20260805-bb52fa computes
        exactly; the classical statement imitated is the exponential limit of
        the overshoot in renewal and large-deviation theory. Labelled
        generator-computed and re-derivation-required in its source and treated
        the same way here.
      validation_plan: >-
        Directly measurable at a synthetic reachable cell where violations are
        common: record the empirical distribution of the overshoot and fit its
        scale, comparing against the exponential prediction with a tail check
        on the largest overshoots. This also validates 031ce2's sigma in the
        same run, at the same cost, which is the reason to run the synthetic
        cell at all. The transfer of the fitted scale from the synthetic cell
        to true ML-DSA-44 parameters is an EXPLICIT assumption and the record
        must recompute the prediction at the synthetic cell's own parameters
        before scoring.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The costs that move are stated in
      signatures. AUDIT ENABLEMENT COST at ML-DSA-44: 4.7e3 signatures of prior
      t0 recovery for the LowBits predicate and 7.6e4 for the ct0 predicate,
      against 2e5-5e5 for the full recovery reported in the literature - a
      factor of 2.6 to 6.6 for the cheaper audit and 42 to 106 for the LowBits
      audit specifically. DETECTION SAMPLE SIZE at ML-DSA-44: 1/p_R = 1.4e8
      signatures for the optimal tier-2 auditor and 1/(p_R(1-sigma)) = 1.5e10
      for the tier-0 one. Compute per audited signature is one polynomial
      multiplication, so the auditor is cheaper than the verifier it sits
      beside.
    memory_exponent: >-
      O(256k) for the auditor's t0 estimate, plus O(1) per signature audited
      because the audit is a streaming predicate evaluation. The auditor need
      not store the transcript it has already audited, which is worth stating
      because the naive framing ("a verifier that stores signatures") suggests
      otherwise.
    best_known: >-
      IN-CORPUS: nothing. No record states a detection sample size, an audit
      cost or a tier assignment. EXTERNAL: the nearest efforts found are the
      Crucible conformance harness and the ACVP sigVer vectors, both of which
      test verifiers against crafted inputs rather than signers against genuine
      transcripts, and NEITHER WAS FETCHED - both are known only through
      search-result summaries and could cover more than the summaries say.
    hidden_overhead: >-
      Two disclosures. (i) The audit costs are estimator-relative and inherit a
      sibling proposal's unexecuted price curve; quoting 4.7e3 without that
      dependency would be dishonest. (ii) The detection sample sizes are
      dominated entirely by 1/p_R, so every improvement in the audit's
      enablement cost is irrelevant to the bottom line - the table's honest
      reading is that the audit is cheap and the WAIT is impossible, which is
      the opposite of the intuition the composition starts from and is the
      result.
    tradeoff_note: >-
      The genuine tradeoff is precision against signatures and it is priced by
      IDEA-20260821-65739b's exchange rate: four times the signatures buys one
      more bit-plane, and one more bit-plane halves the ambiguous fraction. So
      audit quality improves as the FOURTH ROOT of the signature count, which is
      a bad exponent and is why the audit's enablement saturates quickly rather
      than being pushed to exactness.

  dominated_by: >-
    n/a on the attack axis (no attack, no cost triple claimed). Rows actually
    checked. IN-CORPUS: all five RQ-MLDSA-ffa0f5 proposals and both
    RQ-MLDSA-ffa0f5 hypotheses - none states a tier, a detection sample size or
    an audit cost, so none dominates on the result axis; IDEA-20260805-031ce2
    dominates on COST for the sigma input and IDEA-20260805-bb52fa for the p_R
    input, and both are consumed rather than competed with. EXTERNAL, AND THE
    HONEST ANSWER IS PARTIAL DOMINANCE: the Crucible harness reportedly covers
    51 ML-DSA conformance tests across six categories including signing
    internals and verification edge cases against five implementations, and the
    ACVP sigVer vectors cover crafted modifications with published expected
    results. On the CRAFTED-INPUT axis this proposal is dominated by both and
    should not be run as a conformance harness. The residue that is NOT
    dominated, as far as two search-result summaries can establish: neither is
    reported to ask what side information an observer needs to evaluate a
    signing-only predicate, neither prices that side information in signatures,
    and neither states a detection sample size against a signer that omits a
    check. NEITHER SOURCE WAS FETCHED, so this dominance assessment is itself
    at recalled provenance and Stage 0 must fetch both before the record is
    promoted.
  sota_delta: >-
    no attack; structural and measurement contribution only. Quantitatively:
    RQ-MLDSA-ffa0f5's under-explored object (d) asks whether a verifier that
    stores signatures can distinguish a conforming from a non-conforming signer
    and after how many signatures, and the corpus contains no number of any
    kind. This supplies a full table: four predicates, four tiers, two
    precision requirements differing by a factor of 56, two audit enablement
    costs (4.7e3 and 7.6e4 signatures at ML-DSA-44), two detection sample sizes
    (1.4e8 optimal, 1.5e10 naive) and an optimality argument bounding every
    transcript-only detector. It also corrects one cell of an existing
    proposal's classification at zero compute. The headline is a CLOSURE at the
    docs/inventor-protocol.md section 4 standard rather than a capability: the
    named obstruction is the firing rate p_R, measured over the stated scope,
    and the forward guidance is that the classes remaining open are non-
    transcript observers (timing, power, memory - GOAL-MLDSA-001's territory)
    and multi-signer or cross-key statistics, neither of which this lattice
    covers.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    BY PART. (i) That the LowBits predicate is tier 2 rather than tier 1, i.e.
    that the correction to IDEA-20260808-4f83f6 is right: ~0.9 - the public key
    carries t1, not t, and that is stated in FIPS 204 Section 6.1 itself.
    (ii) That the exact-t0 auditor reproduces the signer's evaluations bit for
    bit: ~0.85. (iii) That the ambiguous fraction halves per bit-plane as
    predicted: ~0.65, with correlated recovery errors the main risk.
    (iv) That the precision ratio is near 56: ~0.5 - it is a ratio of two
    derived scales, one of which (1693) comes from another unexecuted proposal.
    (v) That the composition's headline survives - that the audit is cheap and
    the wait is impossible: ~0.75, and note this is a NEGATIVE headline, which
    is exactly why the VACUOUS-versus-UNDETECTABLE control and the forward
    guidance are load-bearing rather than decorative. (vi) That the whole
    record is not dominated by the Crucible harness on the axis that matters:
    ~0.6, and it cannot be settled without fetching it, which Stage 0 must do.

