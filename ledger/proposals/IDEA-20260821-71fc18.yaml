      theorem and p_R (bb52fa), the identity and its optimality consequence
      (IDEA-20260821-60ba98), and the price curve N(b) (IDEA-20260821-65739b).
      This record is explicitly a COMPOSITION and its value is exactly the
      composition; if any of the four inputs falls, the corresponding row falls
      with it, and that dependency map is written into the falsification
      conditions rather than left implicit. AFTER THE 2026-08-24 REPAIR the
      novel numeric content of claim (C) is a NEGATIVE result - that the
      precision currency does not buy an audit at ML-DSA-44 - and it is claimed
      at exactly that strength.

  object_first_candidate:
    tracked_object: >-
      THE SIDE-INFORMATION LATTICE together with the PREDICATE-EVALUABILITY MAP
      on it: the chain of observer states (transcript) < (transcript, pk) <
      (transcript, pk, t0 to precision delta) < (transcript, sk), and the
      function assigning to each rejection predicate the lowest element at
      which it becomes computable. What is tracked is not a signature or a
      secret but AN OBSERVER'S CAPABILITY, followed as the observer's side
      information grows. Established families declared off-limits as the
      primary lens: lattice reduction and estimator work; fault injection and
      physical side channels (GOAL-MLDSA-001's scope - this proposal's auditor
      sees only signatures, and the moment it needs a trace it has left this
      question); nonce misuse and the HNP family; forgery search. The lens is
      the elementary theory of statistical experiments ordered by side
      information, which is not an attack family.
    lossiness: >-
      LOSSY, AND THE LOSSINESS IS GRADED RATHER THAN BINARY - THAT IS THE
      PROPOSAL'S CONTENT. The projection sends the observer's full state to the
      pair (tier, achievable detection sample size), discarding which signature
      it was, which key, which message. It is compatible with the target's
      operations in the strong sense the lossy-projection test demands:
      evaluability is monotone in side information, so the retained part
      propagates deterministically up the lattice - an observer that can
      evaluate a predicate at tier k can evaluate it at every tier above.
      IT IS NOT A CHANGE OF COORDINATES: the tier does not determine the
      observer's state, and the fibre over "tier 2" is every possible t0 and
      every possible transcript. THE MIRROR FAILURE - a projection so lossy it
      is constant - is the real risk here and is checked explicitly: if all
      four predicates landed at the same tier the map would carry no
      information. They do not; two are at tier 0 and two at tier 2, and the
      graded precision refinement in claim (C) still splits the tier-2 pair,
      though after the 2026-08-24 re-derivation it splits them by about 3
      bit-planes IN THE OPPOSITE DIRECTION from the version filed on
      2026-08-21: the ct0 audit tolerates the coarser t0, not the finer. A
      measured outcome in which the two tier-2 predicates turned out to need
      the SAME precision would be the pre-registered tell that the refinement
      is empty.
    propagation: >-
      One step is one increment of side information - one more bit-plane of t0.
      The one-step propagation law is measurable and derived: adding one
      bit-plane halves the per-coefficient error standard deviation s_b, hence
      halves the propagated standard deviation sqrt(tau)*s_b, hence halves the
      ambiguous fraction of audit decisions WHILE THAT FRACTION IS SMALL, at a
      cost of four times the signatures under the averaging estimator. The
      halving law is a linearization and fails once the fraction approaches its
      saturation value - for the LowBits predicate at ML-DSA-44 the fraction is
      already 35% at b = 6 and 43% at b = 8, so the halving regime is entered
      only below b = 2. The measurable one-step quantity is therefore the
      ambiguous fraction as a function of b, and the design reports that whole
      curve including its saturated end rather than a threshold.
    survival_score: >-
      Survives from tier 0 to tier 3 by construction - monotonicity means the
      object never dies going up. It dissolves going DOWN, at exactly the point
      named in claim (A): below tier 2 the two interesting predicates are not
      functions of the observer's state at all, so the map is undefined rather
      than uninformative. That asymmetry is why the composition is sequential
      and not parallel. The GRADED refinement of tier 2, by contrast, dissolves
      at the top of its own range: at ML-DSA-44 the LowBits audit has no usable
      interior at all, which the 2026-08-24 re-derivation predicts and the
      design now tests directly.

  null_object_control: >-
    NULL-1, AND IT IS AN UNUSUAL ONE BECAUSE IT CAN FAIL IN BOTH DIRECTIONS:
    the DEGRADED-t0 AUDITOR. Give the auditor t0 corrupted to a stated
    per-coefficient error standard deviation s and measure its agreement with
    the ground-truth predicate evaluation (computed with the true t0 by an
    instrument that holds sk). The forced values are derived before the run:
    agreement must be 1 at s = 0, and the disagreement rate must follow
    P_hat(e) - P(fire) with e = sqrt(tau)*s for LowBits and sqrt(2/pi)*e/1693
    for ct0, saturating rather than continuing to grow. This is a genuine
    control because both ends are derived and the interior is a prediction, not
    a hope.
    NULL-2, THE RQ-MANDATED RESAMPLED-t0 ARM, RUN AND LABELLED HONESTLY: an
    auditor holding a t0 resampled independently of the key. Its forced value
    is the SATURATED disagreement rate, which for the LowBits predicate at
    ML-DSA-44 is a flag rate of essentially 1 rather than chance agreement.
    UNDER KN-TECH-1a5b7e THIS CANNOT FAIL AS A TEST OF THE COMPOSITION - it is
    the s -> infinity endpoint of NULL-1 - so it is reported as the endpoint of
    the graded arm and never as a separate confirmation.
    NULL-3, GRADED WITH FOUR INTERIOR POINTS AND MONOTONICITY REPORTED: run
    NULL-1 at b in {8, 6, 4, 2, 0} and report whether the disagreement rate is
    monotone in b AND whether it halves per plane only where it is small. Two
    endpoints do not give a direction (KN-TECH-1a5b7e's refinement), and the
    whole claim (C) is a statement about the interior. NOTE THE CHANGED GRID:
    the 2026-08-21 version ran {12, 10, 8, 6, 4}, which after the re-derivation
    lies entirely inside the saturated regime for LowBits and would have shown
    a flat useless curve with no interior at all.
    NULL-4, THE DETECTOR RUN ON A CONFORMING SIGNER FIRST: the tier-0 and
    tier-2 detectors are executed against a CONFORMING signer's transcript and
    their verdicts committed before any omitting signer is examined. A detector
    that fires on the conforming arm discriminates nothing. THIS CONTROL IS NOW
    THE RECORD'S CHEAPEST DISCRIMINATOR BETWEEN ITS OWN TWO DERIVATIONS: the
    2026-08-21 version predicts the tier-2 LowBits detector at b = 8 flags
    about 0.5% of conforming signatures; the 2026-08-24 re-derivation predicts
    it flags 99.96% of them. One run of NULL-4 at b = 8 decides which
    derivation is right, and it is the arm to run first.
    NULL-5, THE VACUOUS CELL AS A POSITIVE CONTROL FOR THE INSTRUMENT'S
    HONESTY: at ML-DSA-65 and -87 the ct0 predicate cannot fire, so the audit
    is vacuous and BOTH detectors must report nothing forever. A design that
    reports a detection there is broken; a design that reports "undetectable"
    there without noting that there is nothing to detect is dishonest, and the
    record must distinguish the two.

  discriminated_from:
    - >-
      IDEA-20260805-031ce2 censuses predicates into verifier-enforced,
      self-enforcing and unobservable, and derives sigma. Its census is over
      CONSEQUENCE (does violation break verification); this lattice is over
      OBSERVER STATE (what side information evaluates the predicate), and the
      two orderings are different - the LowBits predicate is self-enforcing in
      031ce2's sense and tier 2 in this one, and both are true.
    - >-
      IDEA-20260808-4f83f6 partitions predicates into public and secret and
      measures a challenge-law deviation. This proposal CORRECTS one cell of
      that partition (LowBits is tier 2, not pk-evaluable) and then asks a
      question 4f83f6 does not: what does an observer need in order to CHECK a
      predicate, and what does checking cost. 4f83f6's measurement programme is
      unaffected in its other parts and is cited rather than displaced.
    - >-
      IDEA-20260821-60ba98 (this batch) supplies the optimality bound that
      makes the tier-2 auditor optimal. That record is about the SIGNER's
      output law and stops at the bound; this one builds the detectors, prices
      the side information they need, and reports the table. Neither contains
      the other: 60ba98 without this has no auditor and no precision
      requirement; this without 60ba98 has no optimality argument and would not
      know that 1/p_R cannot be beaten.
    - >-
      IDEA-20260821-65739b (this batch) measures the price curve N(b). This
      proposal consumes it - after the 2026-08-24 repair, through the closed
      form err(N) = sigma_r0/sqrt(N) rather than through two grid points - and
      asks what a given precision buys. If that record's curve is wrong, this
      record's two cost figures move with it and nothing else changes.
    - >-
      IDEA-20260808-e5f947 counts the verifier's accept fibre over byte
      strings. Different domain and different question; no auditor, no side
      information, no detection sample size.
    - >-
      The external Crucible harness and the ACVP sigVer vectors test a VERIFIER
      against crafted inputs with published expected results. This proposal
      tests an OBSERVER's ability to detect a non-conforming SIGNER from
      genuine transcripts, which is the direction neither is reported to cover.
      That is the non-dominated residue and it is claimed as a residue only.

