  assumptions:
    - >-
      t = t1 * 2^d + t0 and the public key carries t1 only, so the LowBits
      predicate is not evaluable from pk alone. This is the correction in claim
      (A) and it is a Stage 1 symbolic obligation; if it is wrong the LowBits
      row moves to tier 1 and outcome E2 is realised.
    - >-
      The auditor observes genuine transcripts from a signer under one key and
      can accumulate them. A deployment that rotates keys before the audit's
      sample size is reached defeats the whole lattice, and that is a scope
      statement rather than a result.
    - >-
      Errors in a partially recovered t0 are roughly independent across
      coefficients, so the propagated standard deviation is sqrt(tau)*s and
      hence sigma_r0/sqrt(N) for the averaging estimator. The design measures
      the realised propagated error instead of assuming it, because the
      estimator's errors may well be correlated. NOTE: there is no worst-case
      "tau*delta" companion bound for this estimator, because its errors are
      approximately Gaussian and unbounded; the 2026-08-21 version of this
      record carried one and it is withdrawn.
    - >-
      The LowBits coefficients r0_j are approximately i.i.d. uniform on
      (-gamma2, gamma2], which is what makes the maximum's concentration scale
      gamma2/n and the fire rate 1 - (1 - beta/gamma2)^n. Stage 1 measures the
      realised fire rate directly, so this assumption is checked and not
      assumed; if the realised rate differs materially from 0.5677 at ML-DSA-44
      the whole LowBits margin re-derivation is re-done from the measured
      distribution.
    - >-
      No side channel, no fault, no timing. The auditor sees signatures. The
      instant it needs anything else it has crossed into GOAL-MLDSA-001.

  proof_search_map:
    bottleneck: >-
      TWO STEPS, AND THE 2026-08-24 REPAIR PROMOTED THE SECOND. (i) The tier
      assignment of the LowBits predicate: if it were tier 1, an auditor would
      need no t0 at all for that predicate, the composition of the question's
      two objects would break for half the table, and the headline sentence
      would be false. (ii) The DECISION MARGIN of the LowBits predicate: the
      2026-08-21 version took it to be gamma2 and the re-derivation puts it at
      the order-statistic scale gamma2/n = 93, which is where the entire
      cheap-audit claim lived and died. Everything else is arithmetic on top of
      those two.
    baseline_embedding:
      parameter_slice: >-
        The exact boundary that reproduces the known case is s = 0 (exact t0),
        where the tier-2 auditor must agree with the sk-holding instrument on
        every predicate evaluation for every signature. That is the old-method
        limit and it must be reproduced exactly, not approximately.
      reproduction_check: >-
        Frozen fixture of 10^3 signatures per parameter set: with exact t0 the
        auditor's predicate evaluations must equal the signer's recorded ones
        bit for bit. A single disagreement means the auditor's reconstruction
        of w - <<c s2>> is wrong and the whole lattice is unbuilt. The same
        fixture also yields the realised LowBits fire rate, which must match
        1 - (1 - beta/gamma2)^n = 0.5677 at ML-DSA-44 within binomial error at
        n_sig = 10^3; that is the calibration of the repaired margin model and
        it costs nothing extra.
    observation_collision:
      observable: >-
        The certificate is "the auditor's predicate evaluation agrees with the
        signer's". Distinct ground-truth objects with the same observable: an
        auditor that genuinely evaluates the predicate, and an auditor whose
        ambiguous band happens to sit entirely off the events of interest so
        that it agrees on every SAMPLED signature while being unable to decide
        the ones that matter. Because the ct0 events occur at 7e-9, an
        agreement measured on 10^3 conforming signatures says nothing about the
        auditor's power on violating ones. THE LOWBITS ROW DOES NOT SUFFER THIS
        COLLISION, because its predicate fires on 57% of signing attempts, so
        agreement on conforming transcripts is directly informative there - and
        that asymmetry between the two rows is itself part of the finding.
      distinct_preimage_search: >-
        Broken by moving to a synthetic reachable cell (gamma2 lowered so ct0
        violations are common) and measuring agreement ON THE VIOLATING EVENTS
        specifically, stratified by distance to the threshold. That
        stratification is the only way the ambiguous band's size is observed
        rather than modelled, and it is required before any ct0 precision claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express "is this signer conforming" as a statistical experiment
          indexed by side information, so that the question becomes a
          comparison of experiments rather than an open-ended search for a
          detector. Obligations: encoding (tier assignments), completeness
          (every predicate lands somewhere), soundness (monotonicity of
          evaluability), transfer (precision instead of exactness), cost loss
          (the ambiguous band).
        predicted_gain: >-
          Converts "can a verifier tell" into a table of sample sizes with an
          optimality argument, and prices the side information in signatures.
          UNAFFECTED BY THE 2026-08-24 REPAIR.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the auditor family from "holds t0" to "holds t0 with
          per-coefficient error standard deviation s", and ask for a strict
          inward improvement: is the audit feasible strictly inside the
          exact-t0 boundary? RE-DERIVED 2026-08-24: YES for the ct0 predicate
          and NO for the LowBits predicate at ML-DSA-44. Standard S-C is met at
          propagated error 21.2, i.e. N = 6.70e6, strictly inside the averaging
          estimator's own exact-recovery cost N(0) = 3.10e8. Standard S-L
          requires propagated error 2.68, i.e. N = 4.21e8, which is OUTSIDE
          N(0) - the boundary lift fails for that row.
        predicted_gain: >-
          A factor of 46 in signature cost for the ct0 audit against exact
          recovery WITHIN the averaging estimator class, and NO GAIN AT ALL for
          the LowBits audit. Against the 2e5-5e5 a published full recovery
          costs, both audits are more expensive - 13x to 34x for ct0 and 842x
          to 2105x for LowBits - so the transform yields no cross-estimator
          gain on either row. The 2026-08-21 version claimed "a factor of about
          63 between the two audits and 42 to 106 against full recovery for
          LowBits"; both figures are WITHDRAWN.
    quantifier_order: >-
      FOR EACH predicate R and EACH parameter set, THERE EXISTS a tier k(R) and
      a precision s(R) such that FOR ALL transcripts and FOR ALL observers
      holding tier-k(R) information at precision s(R), the predicate is
      evaluable except on an ambiguous set of stated measure. NOTE THE ORDER:
      the precision is allowed to depend on the PREDICATE and on the parameter
      set but NOT on the transcript, which is what makes the audit a fixed cost
      rather than an adaptive one. A claim with the quantifiers reversed - one
      precision serving all predicates - is explicitly NOT made. NOTE ALSO WHAT
      THE 2026-08-24 REPAIR ADDS TO THE ORDER: the ambiguous-set measure is
      itself defined relative to a DECLARED EVENT CLASS, which differs between
      the two predicates (all signatures for LowBits, near-threshold events for
      ct0), so "s(R) exists" is a statement per (predicate, standard) pair and
      not per predicate alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is a table of detection sample sizes
        for the constructed detectors on the tested parameter sets, with an
        optimality argument inherited from IDEA-20260821-60ba98 that applies to
        TRANSCRIPT-ONLY detectors only. It cannot certify that a signer is
        conforming - absence of a detected violation at 10^5 signatures bounds
        nothing useful when the rate is 7e-9 - and saying so is the honest
        headline rather than a caveat. It also cannot certify anything about
        recovery estimators outside the conjugate-averaging class, so the
        comparison against the literature's 2e5-5e5 is cross-class and is
        labelled as such wherever it appears.
      nearby_object_control: >-
        The nearby object where the conclusion fails: ML-DSA-65 and -87, where
        the ct0 predicate cannot fire. There the audit is vacuous, and a method
        that reported "undetectable" identically at -44 and at -65 would have
        conflated "the event is rare" with "there is no event". The design
        forces the two apart by requiring the -65/-87 cells to be labelled
        VACUOUS rather than UNDETECTABLE. A SECOND NEARBY OBJECT, ADDED
        2026-08-24: the LowBits predicate itself, whose margin analysis differs
        from the ct0 one not in its algebra but in the ORDER STATISTIC of the
        maximum - a method that applied the same "margin = full width" reasoning
        to both is exactly the method that produced the withdrawn numbers, and
        it is retained here as the named failure mode.
    proof_obligations:
      - claim: 'the LowBits and ct0 predicates are tier 2 and the z-norm and hint-weight predicates are tier 0'
        responsibility: correctness
      - claim: 'propagated standard deviation in <<c t0>> is sqrt(tau)*s = sigma_r0/sqrt(N), with no /sqrt(3) and no worst-case tau*delta companion'
        responsibility: size
      - claim: 'the LowBits decision margin is the order-statistic scale gamma2/n = 93, not gamma2, and P(fire) = 1-(1-beta/gamma2)^n = 0.5677 at ML-DSA-44'
        responsibility: correctness
      - claim: 'audit precision requirements at f = 1% are propagated error 2.68 (LowBits, standard S-L) and 21.2 (ct0, standard S-C) at ML-DSA-44'
        responsibility: strictness
      - claim: 'the tier-2 detector is Neyman-Pearson optimal among transcript-only detectors'
        responsibility: baseline
      - claim: 'the tier-0 detector needs 1/(p_R (1 - sigma)) signatures, a factor 1/(1-sigma) worse'
        responsibility: success_probability
      - claim: 'the audits cost 4.21e8 and 6.70e6 signatures of prior averaging-estimator recovery at ML-DSA-44, both above the 2e5-5e5 of a published full recovery'
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        exact-t0 auditor agreement with the signer's own recorded predicate
        evaluations, over 10^3 signatures per parameter set
      direction: different
      minimum_effect: >-
        FORCED VALUE: 1.000, bit for bit, on all four predicates. Any
        disagreement means the auditor's reconstruction is wrong and no row of
        the table is readable.
    - metric: >-
        lowest tier at which the LowBits predicate is evaluable
      direction: different
      minimum_effect: >-
        FORCED VALUE: tier 2, not tier 1. This is the correction to
        IDEA-20260808-4f83f6 and it is decided symbolically at zero compute; if
        it comes out tier 1 the headline composition is false for that
        predicate and outcome E2 is realised for half the table.
    - metric: >-
        realised LowBits fire rate on a conforming signer's signing attempts at
        ML-DSA-44, over 10^3 attempts
      direction: different
      minimum_effect: >-
        FORCED VALUE: 0.5677 = 1 - (1 - 78/95232)^1024, within binomial error
        (about +/- 0.031 at n = 10^3). This is the calibration of the repaired
        margin model and it is the cheapest thing in the whole design. A
        materially different rate means the r0-uniformity model is wrong and
        every LowBits precision number is re-derived from the measured
        distribution before anything else is read.
    - metric: >-
        tier-2 LowBits auditor's flag rate on CONFORMING signatures at
        bit-plane b = 8 (equivalently propagated error 799), ML-DSA-44
      direction: higher
      minimum_effect: >-
        THIS IS THE DISCRIMINATOR BETWEEN THIS RECORD'S TWO DERIVATIONS AND IT
        COSTS ONE RUN. The 2026-08-21 version implies about 0.5% - i.e. the
        auditor is nearly exact at b = 8. The 2026-08-24 re-derivation forces
        0.9996 - i.e. the auditor flags essentially every conforming signature
        and is useless at b = 8. The two differ by a factor of about 2000 and
        no intermediate value is predicted by either. A measured value near 1
        confirms the repair; a measured value near 0.005 means the repair is
        wrong, the order-statistic argument does not apply, and the withdrawn
        headline is reinstated by a superseding record.
    - metric: >-
        LowBits auditor disagreement rate versus bit-plane b at
        b in {8, 6, 4, 2, 0}, ML-DSA-44
      direction: lower
      minimum_effect: >-
        FORCED CURVE: 43.2%, 35.5%, 15.1%, 4.41%, 1.15%. It must be monotone
        decreasing in b, must NOT halve per plane in the saturated upper range,
        and must approach halving only at the bottom. A curve that halves
        cleanly across all five points means the saturation model is wrong.
    - metric: >-
        ct0-predicate audit disagreement rate versus bit-plane b, at a
        synthetic reachable cell, conditional on the near-threshold event class
        and stratified by distance to the threshold
      direction: lower
      minimum_effect: >-
        Must fall by a factor of about 2 per bit-plane while it is small, and
        must cross the declared 1% of standard S-C between b = 3 (forced 1.18%)
        and b = 2 (forced 0.59%). The 2026-08-21 version forced a crossing "at
        b = 6 within one plane", which its own numbers contradicted; that value
        is withdrawn. A curve that does not halve per plane means the
        propagated error is not sigma_r0/sqrt(N) - most plausibly because the
        recovery errors are correlated across coefficients - and the precision
        requirements are re-derived from the measured propagation instead. THE
        MEASUREMENT IS AT THE SYNTHETIC CELL and the forced values above must be
        recomputed at that cell's own gamma2 and overshoot scale before scoring.
    - metric: >-
        ratio of the LowBits audit's precision requirement to the ct0 audit's,
        under the two declared standards S-L and S-C
      direction: higher
      minimum_effect: >-
        FORCED VALUE: the LowBits audit needs 7.9x FINER t0 than the ct0 audit
        (2.68 versus 21.2 in propagated error), about 3 bit-planes, about 63x
        more signatures. NOTE THE SIGN: the 2026-08-21 version forced the
        opposite, "ct0 needs about 56x finer t0", and that value is withdrawn.
        A measured ratio near 1 would mean the two tier-2 predicates need the
        same precision, the graded refinement is empty, and the proposal reduces
        to the plain tier lattice. A measured ratio near 56 in the ORIGINAL
        direction would mean the order-statistic correction is wrong.
    - metric: >-
        detection sample size for a ct0-omitting signer, tier 0 versus tier 2,
        measured at a synthetic reachable cell and extrapolated by the derived
        1/p and 1/(p(1-sigma)) forms
      direction: higher
      minimum_effect: >-
        The ratio must be 1/(1-sigma), predicted about 110 at the true
        ML-DSA-44 overshoot scale. The MEASUREMENT is at the synthetic cell and
        the extrapolation to true parameters is an explicit transfer
        assumption, never a measurement.
    - metric: >-
        verdict label at ML-DSA-65 and ML-DSA-87
      direction: different
      minimum_effect: >-
        FORCED VALUE: VACUOUS, not UNDETECTABLE, because the envelope theorem
        makes the event impossible rather than rare. A record that emits
        UNDETECTABLE there has conflated the two and fails its own
        interpretation standard.

  minimal_test:
    design: >-
      FIVE STAGES, CHEAPEST FIRST, EACH ABLE TO TERMINATE THE LINE.
      STAGE 0 (algebra, ZERO COMPUTE, TERMINATING, AND IT DECIDES THE HEADLINE
      OF PART (A)): derive the tier of each of the four predicates symbolically
      from FIPS 204 Algorithm 7 and Algorithm 8, and in particular settle
      whether the LowBits predicate needs t0. This is two lines and it decides
      between E1 and E2 for half the table before any machine runs. Re-derive,
      also at zero compute, the repaired constants of claim (C): err(N) =
      sigma_r0/sqrt(N), P(fire) = 1-(1-beta/gamma2)^n = 0.5677, the S-L and S-C
      requirements 2.68 and 21.2, and the costs 4.21e8 and 6.70e6. If the
      re-derivation disagrees with the values written here, this record is
      superseded before anything is run.
      STAGE 1 (exact-t0 auditor, minutes): build the tier-2 auditor with the
      TRUE t0 and check it reproduces the signer's own predicate evaluations
      bit for bit on 10^3 signatures per parameter set; in the same fixture,
      measure the realised LowBits fire rate against the forced 0.5677.
      STAGE 2 (THE DISCRIMINATOR, minutes, RUN THIS FIRST AFTER STAGE 1): run
      the tier-2 LowBits auditor at b = 8 against a CONFORMING signer's 10^3
      signatures and report its flag rate. The 2026-08-21 derivation forces
      about 0.005; the 2026-08-24 re-derivation forces about 0.9996. One number
      decides which of this record's two derivations is right, at a cost of
      minutes, and everything downstream is read in the light of that answer.
      STAGE 3 (precision curves, tens of minutes): degrade t0 to bit-planes
      b in {8, 6, 4, 2, 0} and measure the disagreement rate per predicate -
      for LowBits against the forced curve 43.2/35.5/15.1/4.41/1.15 per cent on
      conforming transcripts, and for ct0 at a SYNTHETIC REACHABLE CELL where
      violations are common enough to stratify by distance to the threshold,
      against forced values recomputed at that cell's own parameters. Report
      monotonicity and where the halving law holds.
      STAGE 4 (detectors and the table, tens of minutes): run the tier-0 and
      tier-2 detectors against (i) a conforming signer - verdicts committed
      FIRST - and (ii) a ct0-omitting signer, at the synthetic cell; measure
      both detection rates and their ratio against the predicted 1/(1-sigma).
      Then assemble predicate x tier x precision x signature cost x detection
      sample size, with every cell labelled measured, derived, theorem, or
      vacuous, the ML-DSA-65/-87 ct0 cells labelled VACUOUS, and every
      cross-estimator comparison labelled cross-estimator.
      WHAT DISCRIMINATES: Stage 0 alone separates E1 from E2 at zero cost.
      Stage 2 alone separates this record's withdrawn arithmetic from its
      repaired arithmetic at the cost of one run. Stage 3's curves separate E1
      from E3 - and after the repair E3 is the pre-registered expectation for
      the LowBits row, so a Stage 3 that showed a usable interior there would
      be the surprise. Stage 4's ratio tests the one number that makes the
      lattice worth having.
    controls:
      - Verdict-on-the-null-first: both detectors run against the CONFORMING signer and their verdicts committed before the omitting signer is examined; at b = 8 this control is also the record's internal discriminator.
      - Degraded-t0 graded control at five values of b in {8, 6, 4, 2, 0} with monotonicity reported (two endpoints do not give a direction) and with the saturated upper range identified rather than fitted.
      - Resampled-t0 arm as the s -> infinity endpoint of the graded control, labelled as such rather than as an independent null; its forced value for LowBits is a flag rate of essentially 1, not chance agreement.
      - Exact-t0 reproduction check as the s = 0 boundary, required to be exact rather than approximate.
      - Realised LowBits fire rate against the forced 0.5677, which calibrates the repaired margin model at no extra cost and can fail.
      - VACUOUS-versus-UNDETECTABLE labelling check at ML-DSA-65 and -87, which is a control on the RECORD rather than on the instrument and is the one this lane is most likely to fail.
      - Stratification by distance to threshold on the ct0 arm, without which an agreement measured on conforming signatures says nothing about power on violating ones.
      - Cross-estimator labelling check: every comparison between an averaging-estimator N and the literature's 2e5-5e5 is marked cross-class, because the two are different estimator families and an unlabelled comparison would repeat the error this repair corrected.
    required_metrics:
      - the four tier assignments with their two-line derivations
      - exact-t0 auditor agreement (must be 1.000) per parameter set
      - realised LowBits fire rate against the forced 0.5677 at ML-DSA-44
      - tier-2 LowBits auditor flag rate on conforming signatures at b = 8, against the two competing forced values 0.005 and 0.9996
      - disagreement rate versus bit-plane per predicate, stratified by distance to threshold on the ct0 arm
      - measured propagated error in <<c t0>> versus the predicted sigma_r0/sqrt(N), and the measured cross-coefficient correlation of the recovery error
      - the two precision requirements against the forced 2.68 (S-L) and 21.2 (S-C), and their ratio against the forced 7.9 with the LowBits side the finer
      - tier-0 and tier-2 detection rates at the synthetic cell and their ratio against 1/(1-sigma)
      - the assembled table with every cell's provenance label and every cross-estimator comparison marked
      - the audit costs 4.21e8 and 6.70e6 with their dependence on IDEA-20260821-65739b stated in the cell

  falsification_conditions:
    - >-
      Stage 0 shows the LowBits predicate is evaluable from pk alone. The
      correction to IDEA-20260808-4f83f6 is wrong, that record stands as
      written, and this proposal's composition is false for half the table.
    - >-
      The exact-t0 auditor does not reproduce the signer's evaluations bit for
      bit. The auditor's reconstruction is wrong and nothing is readable.
    - >-
      The realised LowBits fire rate is not 0.5677 within binomial error. The
      r0-uniformity model is wrong, the order-statistic margin argument loses
      its basis, and every LowBits precision number in claim (C) is withdrawn
      and re-derived from the measured distribution.
    - >-
      Stage 2 returns a LowBits flag rate near 0.005 at b = 8 rather than near
      0.9996. The 2026-08-24 re-derivation is wrong, the order-statistic
      correction does not apply, and the 2026-08-21 headline should be
      reinstated by a superseding record - which would be the most interesting
      outcome available here and is why the arm is run second.
    - >-
      The ct0 disagreement rate does not halve per bit-plane in its small
      range. The propagated-error model sigma_r0/sqrt(N) is wrong; the
      precision requirements and both signature costs are withdrawn and
      re-derived from the measured propagation.
    - >-
      The two tier-2 predicates turn out to need the same precision. The graded
      refinement in claim (C) is empty in both directions and the proposal
      reduces to the plain tier lattice, which is still worth recording but is
      a much smaller result.
    - >-
      The tier-0 to tier-2 detection ratio is not 1/(1-sigma). Either
      IDEA-20260805-031ce2's sigma is wrong or the detectors are not what the
      derivation describes.
    - >-
      IDEA-20260821-65739b's price curve fails. The two signature costs move
      with it; the tier lattice, the order-statistic margin argument and the
      precision requirements in propagated-error units survive unchanged, and
      stating which half survives which failure is part of the deliverable.
    - >-
      IDEA-20260821-60ba98's identity fails. The optimality argument for the
      tier-2 detector is withdrawn and the table becomes a list of achievable
      sample sizes with no lower bound attached.

  confounders:
    - >-
      A MAXIMUM'S MARGIN IS NOT ITS RANGE, AND THIS RECORD ALREADY FELL FOR IT
      ONCE. The 2026-08-21 version priced the LowBits audit off the width of a
      single LowBits coefficient and got a requirement three orders of
      magnitude too loose, because the predicate is a max over 1024 near-uniform
      coefficients and its threshold sits inside the max's concentration scale.
      Any future predicate added to this table must have its margin derived from
      the order statistic that actually decides it.
    - >-
      AGREEMENT ON CONFORMING SIGNATURES IS NOT POWER ON VIOLATING ONES, FOR
      THE ct0 ROW. With a 7e-9 event rate, an auditor can agree with the signer
      on every signature anyone will ever see and still be unable to decide the
      events that matter. The stratified synthetic cell is the only defence and
      its transfer to true parameters is an assumption, not a result. The
      LowBits row is exempt because its predicate fires on 57% of attempts.
    - >-
      CORRELATED RECOVERY ERRORS. The propagated-error model assumes the
      partial-t0 errors are roughly independent across coefficients. If the
      recovery estimator's errors are correlated - and an averaging estimator's
      errors share the same noise realisations - the propagated error is larger
      than sigma_r0/sqrt(N) and both precision requirements tighten further.
      Measured rather than assumed.
    - >-
      THE SYNTHETIC CELL IS NOT ML-DSA. Lowering gamma2 to make ct0 violations
      common changes both gamma2 and the overshoot scale, which are the very
      quantities claim (C) computes, and it also changes the LowBits fire rate
      and hence its order-statistic margin. The design must recompute the
      predicted disagreement rates AT THE SYNTHETIC CELL's own parameters and
      score against those, not against the ML-DSA-44 numbers - scoring a
      synthetic-cell measurement against a true-parameter prediction would
      manufacture a discrepancy or hide one.
    - >-
      CROSS-ESTIMATOR COMPARISON. N(b) and every cost derived from it belong to
      the conjugate-averaging estimator; the 2e5-5e5 full-recovery figure comes
      from a different and better estimator class in the literature. The
      corrected headline ("both audits cost more than buying t0 outright") is a
      cross-class statement and would change if the audit were priced with the
      literature's estimator instead. IDEA-20260821-6109f8 exists to find out
      by how much, and until it reports, the honest within-class statement is
      the 46x ct0 saving and the LowBits non-saving.
    - >-
      A CHAIN OF FOUR INTERNAL DEPENDENCIES. This record consumes sigma, p_R,
      N(b) and the TV identity from four other proposals, none of which has
      been executed. Confidence must not compound optimistically: the table's
      cells inherit the weakest link and each is labelled with its source.
    - >-
      "UNDETECTABLE" IS A COMFORTABLE AND CHEAP CONCLUSION, and it is also the
      one most likely to be misread as reassuring. The VACUOUS-versus-
      UNDETECTABLE control exists because the difference between "there is
      nothing to detect" and "there is something and nobody can see it" is the
      entire content of the parameter-set comparison.

  interpretation_limits:
    - >-
      NOT A BREAK. Everything here is conformance and detection; nothing bears
      on MLWE, MSIS or SelfTargetMSIS in any direction, and no forgery or
      unknown-key signature is produced.
    - >-
      The optimality argument covers TRANSCRIPT-ONLY detectors. A party with
      timing, power or memory observations detects an omitted check trivially,
      and that party is out of scope by this question's own boundary with
      GOAL-MLDSA-001.
    - >-
      Absence of a detected violation bounds almost nothing at these rates and
      must never be reported as evidence that a signer is conforming. The
      licensed sentence is "no violation was observed in N signatures, which
      bounds the omission rate above 1/N".
    - >-
      The ML-DSA-65 and -87 ct0 cells are VACUOUS, not UNDETECTABLE, and every
      downstream restatement must preserve that distinction.
    - >-
      THE 2026-08-21 FIGURES 4.7e3 AND 7.6e4 ARE WITHDRAWN AND MUST NOT BE
      QUOTED FROM THIS RECORD OR ANY DESCENDANT OF IT. The replacements 4.21e8
      (LowBits, standard S-L) and 6.70e6 (ct0, standard S-C) are
      estimator-relative, standard-relative and generator-computed, and inherit
      IDEA-20260821-65739b's conditionality in full; a better recovery
      estimator lowers them and IDEA-20260821-6109f8 exists to find out by how
      much.
    - >-
      The two declared standards S-L and S-C are DESIGN PARAMETERS, not facts
      about ML-DSA. Every cost figure here scales as 1/f^2 in the declared
      ambiguity threshold f, and the two standards are applied to different
      event classes on purpose because the two predicates fire eight orders of
      magnitude apart. No single ratio between the two audits is a property of
      the standard; the 7.9x figure is a property of (S-L, S-C).
    - >-
      This proposal COSTS one specific enablement of t0 - transcript-based
      conformance auditing - as RQ-MLDSA-ffa0f5 requires, and after the repair
      the answer is that the enablement is not cheap. It costs no other
      enablement, and in particular says nothing about what t0 buys a
      side-channel adversary, which is the enablement the literature actually
      cares about and which this question forbids estimating.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The per-coefficient errors of a partially recovered t0 are
        approximately independent and symmetric with standard deviation s, so
        that the error propagated into <<c t0>>_j by multiplication with a
        weight-tau ternary challenge has standard deviation sqrt(tau)*s - which
        for the conjugate-averaging estimator at N signatures equals
        sigma_r0/sqrt(N) exactly, independently of tau. LOAD-BEARING for both
        precision requirements and therefore for both signature costs.
      rigorous_support: >-
        Rigorous ingredient: (c e)_j is EXACTLY a signed sum of tau distinct
        coefficients of the error vector e, because c has exactly tau nonzero
        coefficients in {-1,+1} (FIPS 204 Section 2.3). Under independence the
        variance is exactly tau*s^2 with no approximation; the assumption is
        the independence, not the scaling. Classical statement imitated: the
        central limit theorem for a sum of tau bounded independent terms.
        WITHDRAWN 2026-08-24: the companion "worst case tau*delta" bound that
        the 2026-08-21 version carried. It requires a hard per-coefficient
        error bound delta, and the averaging estimator's errors are
        approximately Gaussian and unbounded, so no such bound exists for this
        estimator; s_b = 2^(b-1) is a standard deviation, not a half-width, and
        treating it as one is what produced the withdrawn /sqrt(3) factor.
      validation_plan: >-
        Measured directly and cheaply at REAL FIPS 204 parameters: take the
        recovery estimator's actual error vector at each bit-plane b, multiply
        by 10^4 realised challenges, and compare the empirical standard
        deviation of the propagated error against sigma_r0/sqrt(N). Tail check
        on the largest propagated errors specifically, since the audit's
        ambiguity is decided by the tail and not the bulk, and a Gaussian tail
        check rather than a bounded-support one. Report the empirical
        correlation of the error vector's coefficients against the assumed 0;
        sampled parameters, keys and seeds recorded. Transfer assumption: none
        across parameter sets, each measured.
    - id: H2
      statement: >-
        The exceedance overshoot of ||<<c t0>>||_inf above gamma2 is
        approximately exponential with mean 1693 at ML-DSA-44, so the ct0
        audit's decision margin has that scale. LOAD-BEARING for the ct0
        precision requirement 21.2 and hence for the 6.70e6 figure.
      rigorous_support: >-
        Inherited from IDEA-20260805-031ce2, where it is derived from the tail
        of the same tau-fold convolution that IDEA-20260805-bb52fa computes
        exactly; the classical statement imitated is the exponential limit of
        the overshoot in renewal and large-deviation theory. Labelled
        generator-computed and re-derivation-required in its source and treated
        the same way here.
      validation_plan: >-
        Directly measurable at a synthetic reachable cell where violations are
        common: record the empirical distribution of the overshoot and fit its
        scale, comparing against the exponential prediction with a tail check
        on the largest overshoots. This also validates 031ce2's sigma in the
        same run, at the same cost, which is the reason to run the synthetic
        cell at all. The transfer of the fitted scale from the synthetic cell
        to true ML-DSA-44 parameters is an EXPLICIT assumption and the record
        must recompute the prediction at the synthetic cell's own parameters
        before scoring.
    - id: H3
      statement: >-
        The LowBits coefficients r0_j = LowBits(w - <<c s2>>)_j are
        approximately i.i.d. uniform on (-gamma2, gamma2] across the
        n = 256k coefficients, so the predicate's fire rate is
        1 - (1 - beta/gamma2)^n = 0.5677 at ML-DSA-44 and the maximum
        concentrates within about gamma2/n = 93 of gamma2. LOAD-BEARING for the
        entire LowBits margin re-derivation and hence for the withdrawal of the
        2026-08-21 headline; ADDED 2026-08-24.
      rigorous_support: >-
        Rigorous ingredient: w = A y with y uniform on a range far wider than
        the decomposition window, so w - <<c s2>> is close to uniform mod q and
        its LowBits is close to uniform on the window; independence across
        coefficients is the assumed part, not the marginal. Classical statement
        imitated: the extreme-value behaviour of the maximum of n i.i.d.
        uniforms, whose distance below the upper endpoint is Exponential-like
        with scale (range)/n. Corroborative cross-check, RECALLED AND NOT
        VERIFIED: this fire rate together with the analogous z-norm figure
        reproduces the approximately 4.25 expected signing iterations reported
        for ML-DSA-44.
      validation_plan: >-
        Directly measured in Stage 1 at real ML-DSA-44 parameters and at zero
        marginal cost, from the same 10^3-signature fixture that checks the
        exact-t0 auditor: report the realised fire rate against 0.5677 with its
        binomial interval, the empirical distribution of the maximum |r0_j| and
        its distance below gamma2 against the predicted scale 93, and the
        empirical cross-coefficient correlation of |r0_j| against the assumed 0.
        Tail check on the upper order statistics specifically, since it is the
        top few coefficients and not the bulk that decide the predicate. Sampled
        parameters: ML-DSA-44 first, then -65 and -87 with n = 1536 and 2048 and
        their own forced rates recomputed. Transfer assumption: none across
        parameter sets, each measured.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The costs that move are stated in
      signatures. AUDIT ENABLEMENT COST at ML-DSA-44, RE-DERIVED 2026-08-24 and
      priced for the conjugate-averaging estimator of IDEA-20260821-65739b via
      N = (sigma_r0/err_max)^2: 4.21e8 signatures for the LowBits predicate at
      declared standard S-L and 6.70e6 for the ct0 predicate at declared
      standard S-C (on the integer bit-plane grid, b = 2 and N(2) = 1.93e7).
      Against the 2e5-5e5 of the full recovery reported in the literature -
      A CROSS-ESTIMATOR COMPARISON - the LowBits audit is 842x to 2105x MORE
      expensive and the ct0 audit is 13x to 34x MORE expensive. WITHIN the
      averaging estimator class the ct0 audit saves a factor of 46 against that
      estimator's own exact-recovery cost N(0) = 3.10e8 and the LowBits audit
      saves nothing at all. THE 2026-08-21 FIGURES 4.7e3 AND 7.6e4, AND THE
      "FACTOR OF 2.6 TO 6.6 / 42 TO 106" CLAIMS BUILT ON THEM, ARE WITHDRAWN.
      DETECTION SAMPLE SIZE at ML-DSA-44, unchanged: 1/p_R = 1.4e8 signatures
      for the optimal tier-2 auditor and 1/(p_R(1-sigma)) = 1.5e10 for the
      tier-0 one. Compute per audited signature is one polynomial
      multiplication, so the auditor is cheaper than the verifier it sits
      beside.
    memory_exponent: >-
      O(256k) for the auditor's t0 estimate, plus O(1) per signature audited
      because the audit is a streaming predicate evaluation. The auditor need
      not store the transcript it has already audited, which is worth stating
      because the naive framing ("a verifier that stores signatures") suggests
      otherwise.
    best_known: >-
      IN-CORPUS: nothing. No record states a detection sample size, an audit
      cost or a tier assignment. EXTERNAL: the nearest efforts found are the
      Crucible conformance harness and the ACVP sigVer vectors, both of which
      test verifiers against crafted inputs rather than signers against genuine
      transcripts, and NEITHER WAS FETCHED - both are known only through
      search-result summaries and could cover more than the summaries say.
    hidden_overhead: >-
      Three disclosures. (i) The audit costs are estimator-relative and inherit
      a sibling proposal's unexecuted price curve; quoting 6.70e6 without that
      dependency would be dishonest, and comparing it to the literature's
      2e5-5e5 is a comparison across estimator classes. (ii) The costs are also
      STANDARD-relative and scale as 1/f^2 in the declared ambiguity threshold
      f = 1%; a 3-sigma rather than 1-sigma reading of the ambiguous band would
      multiply both by 9. (iii) The detection sample sizes are dominated
      entirely by 1/p_R, so every change in the audit's enablement cost is
      irrelevant to the bottom line - and after the 2026-08-24 repair the
      enablement is not merely irrelevant but expensive, so the table's honest
      reading is that the audit is dear AND the wait is impossible. That is a
      strictly worse story than the one this record was filed with, and it is
      the result.
    tradeoff_note: >-
      The genuine tradeoff is precision against signatures and it is priced by
      IDEA-20260821-65739b's exchange rate: four times the signatures buys one
      more bit-plane, and one more bit-plane halves the propagated error - and
      therefore halves the ambiguous fraction ONLY while that fraction is small.
      Audit quality therefore improves as the FOURTH ROOT of the signature
      count in the small-ambiguity regime and not at all in the saturated one,
      which is a bad exponent twice over and is why the enablement cannot be
      pushed cheaply toward exactness. For the LowBits predicate at ML-DSA-44
      the saturated regime covers every bit-plane above b = 2, which is the
      whole affordable range, and that is the mechanical reason the cheap-audit
      claim failed.

  dominated_by: >-
    n/a on the attack axis (no attack, no cost triple claimed). Rows actually
    checked. IN-CORPUS: all five RQ-MLDSA-ffa0f5 proposals and both
    RQ-MLDSA-ffa0f5 hypotheses - none states a tier, a detection sample size or
    an audit cost, so none dominates on the result axis; IDEA-20260805-031ce2
    dominates on COST for the sigma input and IDEA-20260805-bb52fa for the p_R
    input, and both are consumed rather than competed with. NEW AFTER THE
    2026-08-24 REPAIR: on the AUDIT-ENABLEMENT axis this record is now
    DOMINATED BY THE PLAIN "recover t0 outright" ROUTE at ML-DSA-44 - the
    literature's 2e5-5e5 full recovery beats both re-derived partial-precision
    costs (4.21e8 and 6.70e6), so the partial-precision refinement is Pareto
    dominated on that axis and is retained only as a negative result and as the
    within-averaging-class 46x for ct0. EXTERNAL, AND THE HONEST ANSWER IS
    PARTIAL DOMINANCE: the Crucible harness reportedly covers 51 ML-DSA
    conformance tests across six categories including signing internals and
    verification edge cases against five implementations, and the ACVP sigVer
    vectors cover crafted modifications with published expected results. On the
    CRAFTED-INPUT axis this proposal is dominated by both and should not be run
    as a conformance harness. The residue that is NOT dominated, as far as two
    search-result summaries can establish: neither is reported to ask what side
    information an observer needs to evaluate a signing-only predicate, neither
    prices that side information in signatures, and neither states a detection
    sample size against a signer that omits a check. NEITHER SOURCE WAS
    FETCHED, so this dominance assessment is itself at recalled provenance and
    Stage 0 must fetch both before the record is promoted.
  sota_delta: >-
    no attack; structural and measurement contribution only, and after the
    2026-08-24 repair the numeric half of it is NEGATIVE. Quantitatively:
    RQ-MLDSA-ffa0f5's under-explored object (d) asks whether a verifier that
    stores signatures can distinguish a conforming from a non-conforming signer
    and after how many signatures, and the corpus contains no number of any
    kind. This supplies a full table: four predicates, four tiers, two declared
    audit standards with two precision requirements (propagated error 2.68 for
    LowBits and 21.2 for ct0, the LowBits side being about 7.9x the FINER of
    the two), two audit enablement costs (4.21e8 and 6.70e6 signatures at
    ML-DSA-44 for the conjugate-averaging estimator), two detection sample
    sizes (1.4e8 optimal, 1.5e10 naive) and an optimality argument bounding
    every transcript-only detector. It also corrects one cell of an existing
    proposal's classification at zero compute. THE FIGURES 4.7e3 AND 7.6e4
    PREVIOUSLY CLAIMED HERE ARE WITHDRAWN, together with the claim that the
    audit is cheaper than full recovery: it is not, on either row, at
    ML-DSA-44. The headline is a CLOSURE at the docs/inventor-protocol.md
    section 4 standard rather than a capability, and after the repair it has
    two named obstructions rather than one: the firing rate p_R for the
    detection half, and the order-statistic concentration of the LowBits
    maximum for the enablement half, both measured over the stated scope. The
    forward guidance is that the classes remaining open are non-transcript
    observers (timing, power, memory - GOAL-MLDSA-001's territory),
    multi-signer or cross-key statistics, and recovery estimators outside the
    conjugate-averaging class (IDEA-20260821-6109f8's object), which is the one
    that could move the enablement costs back down and is the only route by
    which the withdrawn headline could be recovered.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low
  honest_prior_of_survival: >-
    BY PART, REVISED 2026-08-24. (i) That the LowBits predicate is tier 2
    rather than tier 1, i.e. that the correction to IDEA-20260808-4f83f6 is
    right: ~0.9 - the public key carries t1, not t, and that is stated in FIPS
    204 Section 6.1 itself. This is now the record's main surviving asset and
    it costs zero compute.
    (ii) That the exact-t0 auditor reproduces the signer's evaluations bit for
    bit: ~0.85.
    (iii) That the re-derived LowBits margin is right - that the predicate's
    decision scale is the order statistic gamma2/n and not gamma2, and that the
    b = 8 auditor flags essentially every conforming signature: ~0.8. The
    residual doubt is in the i.i.d.-uniform model H3 and in the linearization,
    not in the direction, and Stage 2 settles it in minutes.
    (iv) That the disagreement curves follow the forced values within a factor
    of 2 at every bit-plane: ~0.6, with correlated recovery errors and the
    linearization's breakdown near saturation the main risks.
    (v) That the corrected precision ratio is near 7.9 with the LowBits side
    finer: ~0.55 - it is a ratio of two derived scales under two declared
    standards, one of which (1693) comes from another unexecuted proposal.
    (vi) That the composition's REPAIRED headline survives - that the audit is
    expensive AND the wait is impossible: ~0.75, and note this is now a doubly
    negative headline, which is exactly why the VACUOUS-versus-UNDETECTABLE
    control and the forward guidance are load-bearing rather than decorative.
    (vii) That the whole record is not dominated by the Crucible harness on the
    axis that matters: ~0.6, and it cannot be settled without fetching it,
    which Stage 0 must do.
    (viii) NEW: that a recovery estimator outside the averaging class
    (IDEA-20260821-6109f8) restores a genuine cheap-audit claim for at least
    one predicate: ~0.3, and that is the only route by which this record's
    original headline could come back.

  repair_provenance: >-
    REPAIRED 2026-08-24 by idea-generator in response to red-team BLOCKING
    finding 1 against this record (audit-precision arithmetic stated three
    mutually inconsistent ways; headline resting on the smallest; forced values
    in predictions 3 and 4 contradicted by the record's own numbers;
    target_complexity labelling 7.6e4 "the cheaper audit" when it was the more
    expensive). The finding was cleared BY REDOING THE DERIVATION, and the
    corrected derivation kills most of the claim, so the claim is withdrawn and
    this record says so.
    WHAT WAS RE-DERIVED, BY HAND (Bash was unavailable in the repair session,
    so every figure below was computed by hand and cross-checked twice; none is
    a measurement and none comes from a run):
    (1) THE PROPAGATION FACTOR. IDEA-20260821-65739b's 2^(b-1) is a per-
    coefficient error STANDARD DEVIATION, not a uniform half-width, so the
    2026-08-21 propagation sqrt(tau)*delta/sqrt(3) divided by sqrt(3) twice -
    sigma_r0 = (gamma2-beta)/sqrt(3) already carries that factor. Corrected:
    err = sqrt(tau)*s = sigma_r0/sqrt(N), tau-free. err(8) = 799 not 461,
    err(6) = 200 not 115. The companion worst-case bound tau*delta is withdrawn
    as inapplicable to an unbounded Gaussian-like error.
    (2) THE LOG-BASE ERROR THE FINDING NAMED IS CONFIRMED: log2(56.25) = 5.81
    planes and 4^5.81 = 3.2e3, never "2.9 planes, 4^2.9 = 63".
    (3) THE LOWBITS DECISION MARGIN, AND THIS IS THE DEFECT THE REPAIR FOUND
    BEYOND THE FINDING. The 2026-08-21 version priced the LowBits audit off
    gamma2, the width of a single LowBits coefficient. The predicate is a
    MAXIMUM over n = 256k = 1024 coefficients, so its margin is the
    order-statistic scale gamma2/n = 93, a factor of about 1000 smaller. Model:
    P(fire) = 1-(1-beta/gamma2)^n = 0.5677 (which cross-checks against the
    recalled ~4.25 expected signing iterations at ML-DSA-44) and flag rate
    P_hat(e) = 1-(1-(beta+sqrt(2/pi)*e)/gamma2)^n.
    (4) TWO DECLARED STANDARDS REPLACE THE SINGLE RATIO SENTENCE, as the
