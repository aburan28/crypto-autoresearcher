idea:
  id: IDEA-20260821-71fc18
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    The two things FIPS 204 asserts without deriving are the same thing: the
    LowBits and ct0 rejections become transcript-evaluable EXACTLY when t0 is
    known, so the t0 claim is what decides whether a non-conforming signer is
    detectable at all - and the PRECISION-CURRENCY REFINEMENT THAT ONCE CARRIED
    THIS TITLE IS WITHDRAWN ON RE-DERIVATION: at ML-DSA-44 the audit is NOT
    bought from the cheap bit-planes, because the LowBits predicate's decision
    margin is set by the order statistic of a maximum over 1024 coefficients
    (scale about 1e2) and not by the LowBits width gamma2, so the two audits
    need 4.2e8 and 6.7e6 signatures of prior averaging-estimator recovery rather
    than the 4.7e3 and 7.6e4 this record previously claimed - both ABOVE the
    2e5-5e5 a published full recovery costs
  class: composition

  claim: >-
    (A) THE TIER LATTICE, AND ONE CORRECTION IT FORCES. Order the side
    information an observer of an ML-DSA transcript may hold: TIER 0, the
    signature and the message alone; TIER 1, plus the public key (rho, t1);
    TIER 2, plus t0; TIER 3, the full private key. For each rejection predicate
    of FIPS 204 Algorithm 7, the lowest tier at which it becomes an evaluable
    function of the transcript is a derivable fact, and the answer is:
    ||z||_inf >= gamma1 - beta at TIER 0 (z is in the signature and Algorithm 8
    Line 13 already checks it); hint weight > omega at TIER 0 (count the ones
    in h; Algorithm 21 already refuses to decode otherwise);
    ||LowBits(w - <<c s2>>)||_inf >= gamma2 - beta at TIER 2; and
    ||<<c t0>>||_inf >= gamma2 at TIER 2.
    THE CORRECTION: IDEA-20260808-4f83f6 classifies the LowBits predicate as
    "a PUBLIC predicate ... a public function of (z, c, pk)" on the strength of
    the identity w - c s2 = A z - c t. The identity is right and the
    classification is off by one tier, because t is NOT public in ML-DSA - the
    public key carries t1, and t = t1 * 2^d + t0. Evaluating the LowBits
    predicate from a transcript therefore requires t0, exactly like the ct0
    predicate. That is checkable in two lines and it is what makes this
    proposal's composition non-trivial: BOTH non-self-enforcing predicates flip
    from unevaluable to evaluable at the SAME tier, and that tier is the one
    whose price is the other half of this research question. PART (A) IS
    UNAFFECTED BY THE 2026-08-24 REPAIR and remains the record's cheapest
    deliverable.

    (B) THE COMPOSITION. RQ-MLDSA-ffa0f5 holds two objects and treats them as
    parallel. They are not parallel, they are sequential: the t0 claim is the
    HYPOTHESIS of the detectability question. If FIPS 204's "a small number of
    signatures" is right, then any party that has watched a signer long enough
    holds t0 and can audit the signer's conformance on every subsequent
    signature; if it is wrong, the non-self-enforcing predicates are
    unauditable by anyone outside the signer, and the defect class this goal
    was built around is permanently invisible. The deliverable is therefore not
    two numbers but one table: predicate x tier x detection sample size, with
    the price of each tier attached.

    (C) THE PRECISION-CURRENCY REFINEMENT, RE-DERIVED AND LARGELY WITHDRAWN.
    The idea of the refinement stands: evaluating a predicate does not need t0
    exactly, only to whatever precision keeps the decision unambiguous, so each
    predicate has its own AUDIT PRECISION REQUIREMENT. What this record got
    wrong, and what the 2026-08-24 repair corrects by redoing the arithmetic,
    is every number attached to it.
    (C.1) TWO DECLARED STANDARDS, NOT ONE RATIO. The two predicates fire at
    rates that differ by eight orders of magnitude (LowBits at 0.568 per
    signing attempt, ct0 at 7.34e-9), so no single unconditional
    ambiguous-fraction standard is meaningful for both, and the previous
    version's single "ratio 56" sentence is retracted rather than rescaled.
    Each audit is now held to its OWN declared threshold, both set at f = 1%:
    STANDARD S-L (LowBits) - the per-signature probability that the auditor's
    LowBits verdict differs from the signer's ground-truth verdict is at most
    1%. STANDARD S-C (ct0) - the probability that the auditor's ct0 verdict
    differs from the signer's, CONDITIONAL on the true value lying within a few
    overshoot scales of gamma2 (i.e. within the event class the audit exists
    to decide), is at most 1%. Both are declared design parameters; the closed
    forms below let any other f be re-derived without touching this record.
    (C.2) THE PROPAGATION FACTOR, CORRECTED. IDEA-20260821-65739b defines
    bit-plane b as resolved when the averaging estimator's per-coefficient
    error STANDARD DEVIATION falls below s_b = 2^(b-1). The previous version of
    this record propagated that as sqrt(tau)*s_b/sqrt(3), dividing a standard
    deviation by sqrt(3) a second time - sigma_r0 = (gamma2-beta)/sqrt(3)
    already carries the uniform-variance factor. The correct propagated
    standard deviation into each coefficient of <<c t0>> is
        err(b) = sqrt(tau) * s_b = 6.245 * 2^(b-1) = 3.1225 * 2^b,
    and, equivalently and free of tau because the two taus cancel exactly,
        err(N) = sqrt(tau) * sigma_r0/sqrt(N*tau) = sigma_r0/sqrt(N).
    At ML-DSA-44: err(8) = 799 (previously written 461), err(6) = 200
    (previously 115), err(2) = 12.5, err(0) = 3.12. GENERATOR-COMPUTED,
    RE-DERIVATION REQUIRED.
    (C.3) THE LOWBITS MARGIN, CORRECTED BY A FACTOR OF ABOUT 1000, AND THIS IS
    THE DEFECT THE REPAIR FOUND. The previous version asserted that "the
    decision margin is spread over the full width gamma2". It is not. The
    predicate is a MAXIMUM over n = 256k = 1024 coefficients of a near-uniform
    r0, so the max concentrates within about gamma2/n = 93 of gamma2, while the
    threshold gamma2 - beta sits only beta = 78 below gamma2. The decision
    margin is therefore of order 1e2, not 9.5e4. Under the model r0_j ~
    U(-gamma2, gamma2] i.i.d., P(fire) = 1 - (1 - beta/gamma2)^1024 = 0.5677 -
    which cross-checks against the published ~4.25 expected signing iterations
    at ML-DSA-44 when combined with the analogous z-norm figure - and the
    auditor's flag rate at error standard deviation e is
        P_hat(e) = 1 - (1 - (beta + sqrt(2/pi)*e)/gamma2)^1024.
    Disagreement rates: 1.15% at b = 0, 4.41% at b = 2, 15.1% at b = 4, 35.5%
    at b = 6, 43.2% at b = 8. AT b = 8 THE AUDITOR FLAGS 99.96% OF CONFORMING
    SIGNATURES AS VIOLATING. The previous version predicted 0.5% ambiguity
    there. Standard S-L requires e <= 2.68, i.e. N >= (sigma_r0/2.68)^2 =
    4.21e8 signatures - PAST N(0) = 3.10e8, the averaging estimator's cost for
    every bit. The LowBits audit is not bought from cheap bit-planes at all; it
    needs t0 essentially exactly.
    (C.4) THE ct0 MARGIN, UNCHANGED IN KIND. The events of interest sit at the
    threshold and IDEA-20260805-031ce2 derives the exceedance overshoot as
    approximately exponential with mean 1693, so the conditional disagreement
    is about sqrt(2/pi)*err/1693: 0.59% at b = 2, 1.18% at b = 3, 9.4% at
    b = 6. Standard S-C requires err <= 21.2, i.e. N >= 6.70e6 signatures on
    the continuous curve, or bit-plane b = 2 at N(2) = 1.93e7 on the integer
    grid.
    (C.5) THE HEADLINE, INVERTED FOR BOTH ROWS. 4.7e3 and 7.6e4 are WITHDRAWN.
    Against the 2e5-5e5 a published full recovery costs, the LowBits audit at
    4.21e8 is 842x to 2105x MORE expensive and the ct0 audit at 6.70e6 (grid
    1.93e7) is 13x to 34x (grid 39x to 97x) MORE expensive. An auditor at
    ML-DSA-44 should buy t0 outright by the best published method rather than
    partially by averaging. THE ONLY SURVIVING SAVING IS WITHIN THE AVERAGING
    ESTIMATOR CLASS AND ONLY FOR ct0: 6.70e6 against N(0) = 3.10e8 is a factor
    of 46. For LowBits there is no saving in any class.
    (C.6) THE RATIO, INVERTED IN DIRECTION. Under the two declared standards
    the ct0 audit tolerates err = 21.2 and the LowBits audit err = 2.68, so ct0
    tolerates 7.9x COARSER t0 - about 3 bit-planes, about 63x fewer signatures.
    The previous claim that ct0 needs 56x FINER t0 is wrong in magnitude and in
    sign, and its conversion to bit-planes was additionally a log-base error:
    log2(56.25) = 5.81 planes and 4^5.81 = 3.2e3, never "2.9 planes, 4^2.9 =
    63".

    (D) WHAT THE TABLE THEN SAYS, AND WHY IT IS NOT COMFORTING. Detection
    sample size is bounded below by IDEA-20260821-60ba98's identity: no
    transcript-only detector can distinguish a P_R-omitting signer from a
    conforming one with advantage above 1 - (1 - p_R)^N, so a TIER-2 auditor
    needing 1/p_R signatures is optimal. A TIER-0 auditor sees an omitted ct0
    check only as a verification failure, at rate p_R * (1 - sigma) with
    sigma ~ 0.991, so it needs 1/(p_R (1 - sigma)) - a factor 1/(1 - sigma) ~
    110 worse. At ML-DSA-44 that is 1.4e8 signatures for the optimal auditor
    and 1.5e10 for the naive one; at ML-DSA-65 and -87 the ct0 predicate cannot
    fire at all (IDEA-20260805-bb52fa's envelope theorem), so auditing it is
    vacuous and omitting it is genuinely free. THE HONEST HEADLINE IS
    THEREFORE A CLOSURE WITH A NAMED OBSTRUCTION: the ct0 check is not
    auditable in practice, and the obstruction is the RATE, not the secrecy of
    t0 - buying t0 improves the auditor by a factor of 110 and leaves it
    needing 1.4e8 signatures. That is a different sentence from "it is
    undetectable because t0 is secret", which is what a reader would guess, and
    the two are separated by this design. PART (D) SURVIVES THE REPAIR
    UNCHANGED, and after the repair it is the whole of the record's positive
    content: the enablement cost was never the binding constraint, and now it
    is not even a saving.

    NOT A BREAK. Every object is a conformance quantity; nothing bears on MLWE,
    MSIS or SelfTargetMSIS in any direction; no forgery is constructed and no
    unknown-key signature is produced.

  mechanism: >-
    (1) THE TIER ASSIGNMENTS, DERIVED. z is a field of the signature, so the
    z-norm predicate is TIER 0 and is checked verbatim by Algorithm 8 Line 13.
    The hint weight is read off h after hintBitUnpack, so it is TIER 0 and is
    enforced by the encoding (IDEA-20260805-031ce2 establishes this and it is
    consumed here, not re-derived). For the other two: the verifier computes
    w'Approx = A z - c t1 2^d, which equals (w - <<c s2>>) + <<c t0>>. So
    w - <<c s2>> = w'Approx - <<c t0>>, and its LowBits - the quantity the
    Line-23 predicate tests - is computable exactly when t0 is known and not
    before. And <<c t0>> itself obviously needs t0. Hence both are TIER 2. THE
    LATTICE HAS NO INTERMEDIATE RUNG: nothing in the transcript plus the public
    key alone evaluates either predicate, which is why the correction to
    IDEA-20260808-4f83f6 matters rather than being pedantic - that record
    builds a measurement programme on the LowBits predicate being pk-evaluable.

    (2) WHY PRECISION, NOT EXACTNESS, IS THE RIGHT CURRENCY - AND WHAT IT COSTS
    ONCE THE ARITHMETIC IS DONE RIGHT. An auditor holding t0_hat whose
    per-coefficient error has standard deviation s computes <<c t0_hat>> with
    per-coefficient error a signed sum of exactly tau such errors, hence with
    standard deviation sqrt(tau)*s when the errors are independent across
    coefficients (H1). For the conjugate-averaging estimator of
    IDEA-20260821-65739b, s = sigma_r0/sqrt(N*tau), so the propagated standard
    deviation is exactly sigma_r0/sqrt(N) - the two taus cancel, and the
    propagated error does not depend on tau at all. THE PREVIOUS VERSION OF
    THIS RECORD DIVIDED THIS BY sqrt(3) AND ALSO CARRIED A WORST-CASE
    "tau*delta" ALTERNATIVE; both are wrong for this estimator. s_b = 2^(b-1)
    is a standard deviation and not a half-width, so there is no second uniform
    factor to divide out, and the averaging estimator's errors are
    approximately Gaussian by the CLT over N*tau noise terms and therefore
    unbounded, so no worst-case multiple of a bound exists. The audit is exact
    wherever the true quantity is further from its threshold than the realised
    error, and ambiguous otherwise; the ambiguity rate is the propagated
    standard deviation divided by the DECISION MARGIN of the predicate, and the
    substantive content of this proposal is what those two margins actually
    are.

    (3) THE TWO MARGINS, EXPLICITLY, AND THE ONE THAT WAS WRONG BY THREE ORDERS
    OF MAGNITUDE. For the ct0 predicate the auditor must decide
    |<<c t0>>|_inf >= gamma2 and the events of interest are exactly the ones
    near the threshold; IDEA-20260805-031ce2 derives the exceedance overshoot
    as approximately exponential with mean 1693, so the conditional ambiguous
    fraction is sqrt(2/pi)*err/1693 and the margin scale is 1693. That row is
    unchanged in kind. For the LowBits predicate the auditor must decide
    ||LowBits(w'Approx - <<c t0>>)||_inf >= gamma2 - beta, AND THIS IS A
    MAXIMUM OVER n = 256k COEFFICIENTS, WHICH IS THE STEP THE PREVIOUS VERSION
    SKIPPED. Each LowBits coefficient is near-uniform on a width of 2*gamma2,
    so the previous version concluded the margin was gamma2. But the max of
    1024 such coefficients concentrates within about gamma2/n = 93 of gamma2,
    and the threshold gamma2 - beta lies only beta = 78 below gamma2 - inside
    that concentration scale. The margin is therefore of order 1e2 and not
    9.5e4, a factor of about 1000, and it is why the corrected requirement for
    the LowBits audit is a propagated error below 2.68 rather than below 950.
    The model is P(fire) = 1 - (1 - beta/gamma2)^n = 0.5677 and
    P_hat(e) = 1 - (1 - (beta + sqrt(2/pi)*e)/gamma2)^n for an auditor whose
    propagated error has standard deviation e; both are GENERATOR-COMPUTED,
    LINEARIZED IN e, AND RE-DERIVATION REQUIRED, and the model is calibrated
    rather than merely asserted because P(fire) = 0.5677 together with the
    analogous z-norm figure reproduces the published ~4.25 expected signing
    iterations at ML-DSA-44.

    (4) THE DETECTION SAMPLE SIZES, AND THEIR OPTIMALITY. Under
    IDEA-20260821-60ba98's identity the likelihood ratio between the conforming
    and omitting signers is supported entirely on the violating event, so the
    Neyman-Pearson optimal transcript-only test is "did I see a violating
    signature", and its sample size is 1/p_R. A tier-2 auditor implements that
    test exactly (up to the ambiguous band from (2)); a tier-0 auditor can only
    see the sub-event where the violation ALSO breaks verification, of
    conditional probability 1 - sigma. So the lattice's value is quantified by
    a single ratio 1/(1 - sigma), and that ratio is measurable at a synthetic
    reachable cell rather than argued. UNAFFECTED BY THE REPAIR.

    (5) THE THREE OUTCOMES THIS DISCRIMINATES. E1 - THE BOUNDARY IS t0: both
    non-tier-0 predicates flip at tier 2, the audit precision requirements are
    as re-derived in claim (C), and the composition holds: the standard's t0
    sentence is the hypothesis of its own unaudited check. E2 - THE BOUNDARY IS
    BELOW t0: some predicate turns out to be evaluable from pk alone or from a
    coarser functional of t0 than derived, in which case auditing is cheaper
    than the t0 price and the two objects decouple. E3 - THE BOUNDARY IS ABOVE
    t0: the ambiguous band swallows the events of interest at every affordable
    precision, so even a tier-2 auditor cannot audit at partial precision and
    the obstruction is precision rather than either rate or secrecy. AFTER THE
    REPAIR, E3 IS THE PRE-REGISTERED EXPECTATION FOR THE LOWBITS ROW - the
    re-derivation predicts it outright - and the experiment's job is to confirm
    or refute the re-derivation, not to discover a saving. Each outcome is a
    different sentence about a fielded standard and the design says in advance
    which measurement produces which.

  novelty_status: unverified

