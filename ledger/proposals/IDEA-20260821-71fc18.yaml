idea:
  id: IDEA-20260821-71fc18
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    The two things FIPS 204 asserts without deriving are the same thing: the
    LowBits and ct0 rejections become transcript-evaluable EXACTLY when t0 is
    known, so the t0 claim is what decides whether a non-conforming signer is
    detectable at all - and because each predicate needs t0 only to a stated
    PRECISION, the audit is bought from the cheap bit-planes, at a predicted
    4.7e3 signatures for LowBits and 7.6e4 for ct0 rather than the 2e5-5e5 of
    a full recovery
  class: composition

  claim: >-
    (A) THE TIER LATTICE, AND ONE CORRECTION IT FORCES. Order the side
    information an observer of an ML-DSA transcript may hold: TIER 0, the
    signature and the message alone; TIER 1, plus the public key (rho, t1);
    TIER 2, plus t0; TIER 3, the full private key. For each rejection predicate
    of FIPS 204 Algorithm 7, the lowest tier at which it becomes an evaluable
    function of the transcript is a derivable fact, and the answer is:
    ||z||_inf >= gamma1 - beta at TIER 0 (z is in the signature and Algorithm 8
    Line 13 already checks it); hint weight > omega at TIER 0 (count the ones
    in h; Algorithm 21 already refuses to decode otherwise);
    ||LowBits(w - <<c s2>>)||_inf >= gamma2 - beta at TIER 2; and
    ||<<c t0>>||_inf >= gamma2 at TIER 2.
    THE CORRECTION: IDEA-20260808-4f83f6 classifies the LowBits predicate as
    "a PUBLIC predicate ... a public function of (z, c, pk)" on the strength of
    the identity w - c s2 = A z - c t. The identity is right and the
    classification is off by one tier, because t is NOT public in ML-DSA - the
    public key carries t1, and t = t1 * 2^d + t0. Evaluating the LowBits
    predicate from a transcript therefore requires t0, exactly like the ct0
    predicate. That is checkable in two lines and it is what makes this
    proposal's composition non-trivial: BOTH non-self-enforcing predicates flip
    from unevaluable to evaluable at the SAME tier, and that tier is the one
    whose price is the other half of this research question.

    (B) THE COMPOSITION. RQ-MLDSA-ffa0f5 holds two objects and treats them as
    parallel. They are not parallel, they are sequential: the t0 claim is the
    HYPOTHESIS of the detectability question. If FIPS 204's "a small number of
    signatures" is right, then any party that has watched a signer long enough
    holds t0 and can audit the signer's conformance on every subsequent
    signature; if it is wrong, the non-self-enforcing predicates are
    unauditable by anyone outside the signer, and the defect class this goal
    was built around is permanently invisible. The deliverable is therefore not
    two numbers but one table: predicate x tier x detection sample size, with
    the price of each tier attached.

    (C) THE PART THAT IS NEW AND CHEAP: THE AUDIT NEEDS ONLY PARTIAL t0, AND
    THE PRECISION IS DIFFERENT FOR EACH PREDICATE. Evaluating a predicate does
    not need t0 exactly - it needs t0 to whatever precision keeps the decision
    unambiguous. An error of delta per coefficient of t0 propagates to an error
    of at most tau * delta, and typically sqrt(tau) * delta / sqrt(3), in each
    coefficient of <<c t0>>. GENERATOR-COMPUTED, RE-DERIVATION REQUIRED, at
    ML-DSA-44 (tau = 39, gamma2 = 95232, beta = 78): for the LowBits predicate
    the decision margin is spread over the full width gamma2, so t0 known to
    bit-plane 8 (delta = 128, typical propagated error 461) leaves about 0.5%
    of coefficient decisions ambiguous; for the ct0 predicate the margin is the
    exceedance overshoot, whose scale IDEA-20260805-031ce2 derives as 1693, so
    bit-plane 8 is not enough and bit-plane 6 (delta = 32, typical propagated
    error 115) is. Combining with IDEA-20260821-65739b's price curve
    N(b) = 4 sigma_r0^2/(tau 4^b), the audit costs 4.7e3 signatures for the
    LowBits predicate and 7.6e4 for the ct0 predicate at ML-DSA-44 - against
    2e5 to 5e5 for the full recovery the literature reports. THE AUDITOR NEVER
    NEEDS ALL OF t0, AND THE CHEAP BIT-PLANES ARE THE ONES IT NEEDS.

    (D) WHAT THE TABLE THEN SAYS, AND WHY IT IS NOT COMFORTING. Detection
    sample size is bounded below by IDEA-20260821-60ba98's identity: no
    transcript-only detector can distinguish a P_R-omitting signer from a
    conforming one with advantage above 1 - (1 - p_R)^N, so a TIER-2 auditor
    needing 1/p_R signatures is optimal. A TIER-0 auditor sees an omitted ct0
    check only as a verification failure, at rate p_R * (1 - sigma) with
    sigma ~ 0.991, so it needs 1/(p_R (1 - sigma)) - a factor 1/(1 - sigma) ~
    110 worse. At ML-DSA-44 that is 1.4e8 signatures for the optimal auditor
    and 1.5e10 for the naive one; at ML-DSA-65 and -87 the ct0 predicate cannot
    fire at all (IDEA-20260805-bb52fa's envelope theorem), so auditing it is
    vacuous and omitting it is genuinely free. THE HONEST HEADLINE IS
    THEREFORE A CLOSURE WITH A NAMED OBSTRUCTION: the ct0 check is not
    auditable in practice, and the obstruction is the RATE, not the secrecy of
    t0 - buying t0 improves the auditor by a factor of 110 and leaves it
    needing 1.4e8 signatures. That is a different sentence from "it is
    undetectable because t0 is secret", which is what a reader would guess, and
    the two are separated by this design.

    NOT A BREAK. Every object is a conformance quantity; nothing bears on MLWE,
    MSIS or SelfTargetMSIS in any direction; no forgery is constructed and no
    unknown-key signature is produced.

  mechanism: >-
    (1) THE TIER ASSIGNMENTS, DERIVED. z is a field of the signature, so the
    z-norm predicate is TIER 0 and is checked verbatim by Algorithm 8 Line 13.
    The hint weight is read off h after hintBitUnpack, so it is TIER 0 and is
    enforced by the encoding (IDEA-20260805-031ce2 establishes this and it is
    consumed here, not re-derived). For the other two: the verifier computes
    w'Approx = A z - c t1 2^d, which equals (w - <<c s2>>) + <<c t0>>. So
    w - <<c s2>> = w'Approx - <<c t0>>, and its LowBits - the quantity the
    Line-23 predicate tests - is computable exactly when t0 is known and not
    before. And <<c t0>> itself obviously needs t0. Hence both are TIER 2. THE
    LATTICE HAS NO INTERMEDIATE RUNG: nothing in the transcript plus the public
    key alone evaluates either predicate, which is why the correction to
    IDEA-20260808-4f83f6 matters rather than being pedantic - that record
    builds a measurement programme on the LowBits predicate being pk-evaluable.

    (2) WHY PRECISION, NOT EXACTNESS, IS THE RIGHT CURRENCY. An auditor holding
    t0_hat with per-coefficient error at most delta computes <<c t0_hat>> with
    per-coefficient error a signed sum of tau errors: at most tau * delta, and
    with standard deviation sqrt(tau) * delta / sqrt(3) if the errors are
    independent and roughly uniform. The audit is exact wherever the true
    quantity is further from its threshold than that error, and ambiguous
    otherwise. So each predicate has an AUDIT PRECISION REQUIREMENT set by the
    distribution of its own decision margin, and the two predicates in question
    have very different margins - which is the substantive content of this
    proposal and the reason it is not a corollary of any single sibling record.

    (3) THE TWO MARGINS, EXPLICITLY. For the LowBits predicate the auditor must
    decide |LowBits(w'Approx - <<c t0>>)| >= gamma2 - beta. LowBits is
    essentially uniform on a range of width 2 gamma2, so the decision margin is
    uniform on that scale and the ambiguous fraction is approximately
    (propagated error)/gamma2. For the ct0 predicate the auditor must decide
    |<<c t0>>| >= gamma2, and the events of interest are exactly the ones near
    the threshold - the whole event has probability 7e-9 and
    IDEA-20260805-031ce2 derives the exceedance overshoot as approximately
    exponential with mean 1693 - so the ambiguous fraction is approximately
    (propagated error)/1693. The ratio of the two requirements is therefore
    gamma2/1693 = 56 at ML-DSA-44, i.e. the ct0 audit needs roughly 56 times
    finer t0, i.e. about 2.9 more bit-planes, i.e. about 4^2.9 = 63 times more
    signatures. GENERATOR-COMPUTED; the factor is the deliverable.

    (4) THE DETECTION SAMPLE SIZES, AND THEIR OPTIMALITY. Under
    IDEA-20260821-60ba98's identity the likelihood ratio between the conforming
    and omitting signers is supported entirely on the violating event, so the
    Neyman-Pearson optimal transcript-only test is "did I see a violating
    signature", and its sample size is 1/p_R. A tier-2 auditor implements that
    test exactly (up to the ambiguous band from (2)); a tier-0 auditor can only
    see the sub-event where the violation ALSO breaks verification, of
    conditional probability 1 - sigma. So the lattice's value is quantified by
    a single ratio 1/(1 - sigma), and that ratio is measurable at a synthetic
    reachable cell rather than argued.

    (5) THE THREE OUTCOMES THIS DISCRIMINATES. E1 - THE BOUNDARY IS t0: both
    non-tier-0 predicates flip at tier 2, the audit precision requirements are
    as derived, and the composition holds: the standard's t0 sentence is the
    hypothesis of its own unaudited check. E2 - THE BOUNDARY IS BELOW t0: some
    predicate turns out to be evaluable from pk alone or from a coarser
    functional of t0 than derived, in which case auditing is cheaper than the
    t0 price and the two objects decouple. E3 - THE BOUNDARY IS ABOVE t0: the
    ambiguous band swallows the events of interest at every affordable
    precision, so even a tier-2 auditor cannot audit and the obstruction is
    precision rather than either rate or secrecy. Each outcome is a different
    sentence about a fielded standard and the design says in advance which
    measurement produces which.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb MCP index UNAVAILABLE (in-memory Qdrant per the operating
      brief); not called and nothing attributed to it.
      GREPS RUN WITH COUNTS: (i) -i "bit-plane|bit plane|per-key dispersion|
      ACVP|interoperab" over the repository (*.yaml, *.md) -> 39 files, none
      under RQ-MLDSA-ffa0f5; (ii) -i "linear program|polytope|bounded noise|
      bounded-noise|Chebyshev center" over ledger/ -> 54 files, none in area
      MLDSA; (iii) "MLDSA" over ledger/hypotheses -> 8 files, two under this
      question (H-MLDSA-2ae88d on the t0 claim, H-MLDSA-2d4123 on the four
      predicates).
      READ IN FULL OR IN LARGE PART: RQ-MLDSA-ffa0f5, GOAL-MLDSA-002, the
      lane's complete 5-row proposal inventory, IDEA-20260805-bb52fa,
      IDEA-20260805-630606, IDEA-20260805-031ce2 (lines 1-120, including its
      three-cell census and the sigma ~ 0.991 derivation), IDEA-20260808-4f83f6
      (lines 1-160, INCLUDING the part (A) sentence this proposal corrects),
      IDEA-20260808-e5f947, knowledge/techniques/KN-TECH-1a5b7e.md,
      docs/inventor-protocol.md sections 1-8.
      WEB QUERIES RUN (6): S1 (eprint 2024/1373, 8 links); S2 (t0 recovery,
      bounded noise, 8); S3 (t0 attack method, 10); S4 ('ML-DSA ACVP test
      vectors signatureVerification ... expected results', 9); S5 (per-bit-plane
      recovery cost, 8); S6 ('ML-DSA implementations differential testing
      disagree accept set malformed hint verifier conformance liboqs PQClean',
      10). S4 and S6 were run specifically against the detectability and
      conformance axes of this proposal.
      FETCHED AND READ (LANDING/ABSTRACT PAGES ONLY): eprint.iacr.org/2025/195,
      eprint.iacr.org/2024/1373, eprint.iacr.org/2024/2046,
      eprint.iacr.org/2026/1333. FETCH FAILURES RECORDED: both eprint PDFs
      unparseable binary; Springer chapter 303 to an authentication endpoint.
    results: >-
      IN-CORPUS: IDEA-20260805-031ce2 supplies the three-cell census (which
      predicates are verifier-enforced, self-enforcing, or unobservable) and
      sigma; IDEA-20260808-4f83f6 supplies a public/secret split whose LowBits
      classification this proposal corrects; IDEA-20260805-630606 and
      H-MLDSA-2ae88d supply the t0 price question. NO RECORD composes them:
      nothing in the corpus asks what side information an auditor needs, nothing
      states a detection sample size, and nothing states an audit PRECISION
      requirement in bit-planes for any predicate.
      EXTERNAL: search S6 surfaced two directly relevant conformance efforts
      that this program did not know about and that a reviewer must weigh.
      First, the Crucible harness (symbolicsoft/crucible), described in the
      search results as a conformance-testing harness for ML-KEM and ML-DSA
      with "an ML-DSA battery of 51 tests across 6 categories (norm checks,
      arithmetic, signing internals, verification edge cases, serialization,
      constant-time behavior)" run against libcrux, AWS-LC, CIRCL, liboqs and
      Trail of Bits ml-dsa, reporting two conformance gaps and zero security
      vulnerabilities. Second, ACVP's ML-DSA sigVer vectors (usnistgov/
      ACVP-Server, gen-val/json-files), which include deliberately modified
      message, commitment, z and hint components with published expected
      results. NEITHER PAGE WAS FETCHED - both are known to this session only
      through search-result summaries and are recorded at that provenance.
      Their existence bears on this proposal in a specific way: they cover
      CRAFTED edge cases against a verifier, and neither is reported as
      covering a signer that omits a signing-only predicate, which is the
      object here. That distinction is the proposal's non-dominated residue and
      it is stated as a residue, not as a claim that the prior work is absent.
    verdict: >-
      UNVERIFIED. Claimed new relative to this corpus: the tier lattice, the
      correction to IDEA-20260808-4f83f6's LowBits classification, the audit
      PRECISION requirement as a currency, the two bit-plane requirements and
      the factor 56 between them, and the detection-sample-size table with its
      optimality argument. Assembled from parts already here: the three-cell
      census and sigma (031ce2), the envelope theorem and p_R (bb52fa), the
      identity and its optimality consequence (IDEA-20260821-60ba98), and the
      price curve N(b) (IDEA-20260821-65739b). This record is explicitly a
      COMPOSITION and its value is exactly the composition; if any of the four
      inputs falls, the corresponding row falls with it, and that dependency
      map is written into the falsification conditions rather than left
      implicit.

  object_first_candidate:
    tracked_object: >-
      THE SIDE-INFORMATION LATTICE together with the PREDICATE-EVALUABILITY MAP
      on it: the chain of observer states (transcript) < (transcript, pk) <
      (transcript, pk, t0 to precision delta) < (transcript, sk), and the
      function assigning to each rejection predicate the lowest element at
      which it becomes computable. What is tracked is not a signature or a
      secret but AN OBSERVER'S CAPABILITY, followed as the observer's side
      information grows. Established families declared off-limits as the
      primary lens: lattice reduction and estimator work; fault injection and
      physical side channels (GOAL-MLDSA-001's scope - this proposal's auditor
      sees only signatures, and the moment it needs a trace it has left this
      question); nonce misuse and the HNP family; forgery search. The lens is
      the elementary theory of statistical experiments ordered by side
      information, which is not an attack family.
    lossiness: >-
      LOSSY, AND THE LOSSINESS IS GRADED RATHER THAN BINARY - THAT IS THE
      PROPOSAL'S CONTENT. The projection sends the observer's full state to the
      pair (tier, achievable detection sample size), discarding which signature
      it was, which key, which message. It is compatible with the target's
      operations in the strong sense the lossy-projection test demands:
      evaluability is monotone in side information, so the retained part
      propagates deterministically up the lattice - an observer that can
      evaluate a predicate at tier k can evaluate it at every tier above.
      IT IS NOT A CHANGE OF COORDINATES: the tier does not determine the
      observer's state, and the fibre over "tier 2" is every possible t0 and
      every possible transcript. THE MIRROR FAILURE - a projection so lossy it
      is constant - is the real risk here and is checked explicitly: if all
      four predicates landed at the same tier the map would carry no
      information. They do not; two are at tier 0 and two at tier 2, and the
      graded precision refinement in claim (C) splits the tier-2 pair further
      by a factor of 56. A measured outcome in which the two tier-2 predicates
      turned out to need the SAME precision would be the pre-registered tell
      that the refinement is empty.
    propagation: >-
      One step is one increment of side information - one more bit-plane of t0.
      The one-step propagation law is measurable and derived: adding one
      bit-plane halves delta, hence halves the propagated error
      sqrt(tau) delta/sqrt(3), hence roughly halves the ambiguous fraction of
      audit decisions, at a cost of four times the signatures under the
      averaging estimator. The measurable one-step quantity is therefore the
      ambiguous fraction as a function of b, and the design reports that whole
      curve rather than a threshold.
    survival_score: >-
      Survives from tier 0 to tier 3 by construction - monotonicity means the
      object never dies going up. It dissolves going DOWN, at exactly the point
      named in claim (A): below tier 2 the two interesting predicates are not
      functions of the observer's state at all, so the map is undefined rather
      than uninformative. That asymmetry is why the composition is sequential
      and not parallel.

  null_object_control: >-
    NULL-1, AND IT IS AN UNUSUAL ONE BECAUSE IT CAN FAIL IN BOTH DIRECTIONS:
    the DEGRADED-t0 AUDITOR. Give the auditor t0 corrupted to a stated
    precision delta and measure its agreement with the ground-truth predicate
    evaluation (computed with the true t0 by an instrument that holds sk). The
    forced values are derived before the run: agreement must be 1 at delta = 0
    and must fall to chance as delta grows past the decision margin, with the
    ambiguous fraction tracking (propagated error)/margin. This is a genuine
    control because both ends are derived and the interior is a prediction, not
    a hope.
    NULL-2, THE RQ-MANDATED RESAMPLED-t0 ARM, RUN AND LABELLED HONESTLY: an
    auditor holding a t0 resampled independently of the key. Its forced value
    is chance agreement at every predicate. UNDER KN-TECH-1a5b7e THIS CANNOT
    FAIL AS A TEST OF THE COMPOSITION - it is the delta -> infinity endpoint of
    NULL-1 - so it is reported as the endpoint of the graded arm and never as a
    separate confirmation.
    NULL-3, GRADED WITH FOUR INTERIOR POINTS AND MONOTONICITY REPORTED: run
    NULL-1 at b in {12, 10, 8, 6, 4} and report whether the agreement is
    monotone in b. Two endpoints do not give a direction (KN-TECH-1a5b7e's
    refinement), and the whole claim (C) is a statement about the interior.
    NULL-4, THE DETECTOR RUN ON A CONFORMING SIGNER FIRST: the tier-0 and
    tier-2 detectors are executed against a CONFORMING signer's transcript and
    their verdicts committed before any omitting signer is examined. Both must
    report "no violation" at every signature. A detector that fires on the
    conforming arm discriminates nothing, and this is the verdict-on-the-null-
    first check in its exact KN-TECH-1a5b7e form.
    NULL-5, THE VACUOUS CELL AS A POSITIVE CONTROL FOR THE INSTRUMENT'S
    HONESTY: at ML-DSA-65 and -87 the ct0 predicate cannot fire, so the audit
    is vacuous and BOTH detectors must report nothing forever. A design that
    reports a detection there is broken; a design that reports "undetectable"
    there without noting that there is nothing to detect is dishonest, and the
    record must distinguish the two.

  discriminated_from:
    - >-
      IDEA-20260805-031ce2 censuses predicates into verifier-enforced,
      self-enforcing and unobservable, and derives sigma. Its census is over
      CONSEQUENCE (does violation break verification); this lattice is over
      OBSERVER STATE (what side information evaluates the predicate), and the
      two orderings are different - the LowBits predicate is self-enforcing in
      031ce2's sense and tier 2 in this one, and both are true.
    - >-
      IDEA-20260808-4f83f6 partitions predicates into public and secret and
      measures a challenge-law deviation. This proposal CORRECTS one cell of
      that partition (LowBits is tier 2, not pk-evaluable) and then asks a
      question 4f83f6 does not: what does an observer need in order to CHECK a
      predicate, and what does checking cost. 4f83f6's measurement programme is
      unaffected in its other parts and is cited rather than displaced.
    - >-
      IDEA-20260821-60ba98 (this batch) supplies the optimality bound that
      makes the tier-2 auditor optimal. That record is about the SIGNER's
      output law and stops at the bound; this one builds the detectors, prices
      the side information they need, and reports the table. Neither contains
      the other: 60ba98 without this has no auditor and no precision
      requirement; this without 60ba98 has no optimality argument and would not
      know that 1/p_R cannot be beaten.
    - >-
      IDEA-20260821-65739b (this batch) measures the price curve N(b). This
      proposal consumes two points of it (b = 8 and b = 6) and asks what they
      buy. If that record's curve is wrong, this record's two cost figures move
      with it and nothing else changes.
    - >-
      IDEA-20260808-e5f947 counts the verifier's accept fibre over byte
      strings. Different domain and different question; no auditor, no side
      information, no detection sample size.
    - >-
      The external Crucible harness and the ACVP sigVer vectors test a VERIFIER
      against crafted inputs with published expected results. This proposal
      tests an OBSERVER's ability to detect a non-conforming SIGNER from
      genuine transcripts, which is the direction neither is reported to cover.
      That is the non-dominated residue and it is claimed as a residue only.

