idea:
  id: IDEA-20260805-15258a
  question_id: RQ-HQC-001
  added: '2026-08-05'
  title: >-
    The additive energy of the secret support makes HQC's decoding failure rate
    a per-key quantity, while the analytic model forces it to be a constant:
    a dispersion test whose direction CAN be signed, unlike the joint moment
    the campaign is currently queued to measure
  class: measurement

  claim: >-
    HQC's analytic model computes one number p* by averaging over the key
    (x, y) and the ciphertext randomness (r1, r2, e) JOINTLY - Proposition
    6.1.1 draws x and r together - and therefore assigns EVERY key the same
    decoding failure rate. That is an unstated 24th assumption, absent from the
    23 the BATCH-001 transcription numbered: call it A24, the key-homogeneity
    assumption. It is derivably false. The coordinate (x . r2)_k is the parity
    of the number of pairs (i, j) in supp(x) x supp(r2) with i + j = k, so the
    conditional law of w(x . r2) given x is governed by the ADDITIVE STRUCTURE
    of supp(x) - its difference multiset and its additive energy - and two keys
    of identical weight w with different additive energy give different
    conditional crossover probabilities p*_x and hence different failure rates.
    The model's forced value for the key-to-key dispersion index of the failure
    count is EXACTLY 1 (pure binomial sampling noise, no key effect). Any
    measured excess is a signed falsification: excess dispersion means a
    fraction of keys carries a failure rate strictly above the average delta
    that Theorem 6.3's (q_RO + q_D) . delta term is computed with. THE
    DIRECTION IS THE POINT. DEC-20260802-9664c6 D-6 established that
    second-moment data on the inner-decoder indicators is structurally
    incapable of signing the direction of A17's failure; the dispersion index
    of a per-key failure count has no such defect, because a variance below
    binomial noise is impossible and every deviation is therefore an excess.

  object_first_candidate:
    tracked_object: >-
      The DIFFERENCE MULTISET of the secret support - the multiset
      {i - i' : i, i' in supp(x)} together with its additive-energy statistic
      E(supp x) = #{(i1, i2, i3, i4) in supp(x)^4 : i1 + i2 = i3 + i4} -
      followed through the cyclic convolution into the conditional crossover
      probability p*_x, into the conditional weight law of e', and finally into
      the per-key failure probability Pr_{r1,r2,e}[w(e') > Delta]. The object is
      a property of the KEY ALONE, computable from the public parameters and
      the secret support without any decoding, which is what makes it cheap.
    established_families_off_limits: >-
      Off-limits as the primary lens: (i) information-set decoding in all forms
      (that is IDEA-20260805-baa4da); (ii) the ring-character / CRT lens (that
      is IDEA-20260805-db5afa, and the two objects are deliberately disjoint -
      the character sees exactly one bit and is blind to additive structure,
      additive energy is invisible to the character); (iii) pairwise or
      high-order correlation of INNER-DECODER indicators, which is the queued
      BATCH-004 lane and which this proposal does not duplicate because it
      conditions on the key rather than on the block; (iv) chosen-ciphertext
      decryption-failure attacks in the Guo-Johansson sense - this proposal
      submits no ciphertext to anything and recovers no key; (v) implementation
      side channels. Additive combinatorics is the primary lens and it appears
      nowhere in this corpus applied to any code-based scheme.
    newness_score: >-
      That convolution weights depend on additive structure is elementary and
      old. That HQC's model averages the key away is visible in Proposition
      6.1.1's statement once someone asks the question. What this corpus does
      not contain is either observation, the connection between them, or any
      per-key quantity at all: grep over the three HQC KN-LIT entries, the 23
      numbered assumptions, the three evidence records and all three batch
      directories finds no conditional-on-key statement anywhere. The proposal
      is new WITHIN THIS CORPUS, that is all that is claimed, and the external
      decryption-failure literature very likely contains the weak-key idea in
      some form - Guo-Johansson's attack is relayed at KN-LIT-2141 as recovering
      one specific instance's key, which is a per-key statement. Stage 0 is to
      find out and to record it as a confirmation if so.
    testability_score: >-
      High and cheap, because SPEC section 6.2.2 supplies a decoder-free
      failure criterion: "In HQC-PKE the failure to decrypt a ciphertext c_PKE
      occurs if and only if w(x . r2 - r1 . y + e) > Delta". Under that
      criterion a trial is one sparse cyclic convolution pair and one weight
      comparison - no Reed-Muller decoder, no Reed-Solomon decoder, no
      implementation of HQC at all. Anomaly X9 of the BATCH-001 transcription
      records that this criterion and the two-stage analysis of section 6.1 are
      stated in different terms in the same document; using section 6.2.2's own
      words is defensible and its limitation is declared rather than hidden.
    survival_score: >-
      The object survives to the failure event by an unbroken chain of
      conditional expectations and it survives to cryptographic parameters as a
      STRUCTURE (additive energy is defined at every n), but the MEASUREMENT
      does not: at HQC's own parameters the per-key failure rate is 2^-128 or
      smaller and cannot be estimated at all, which is the same rarity wall
      EV-HQC-0e9116 already established for the campaign. Every measured
      statement here is at reduced parameters and is labelled so.

  mechanism: >-
    DERIVED IN THIS RECORD. Every step is elementary; nothing is recalled from
    literature and no citation is asserted.

    (1) WHERE THE KEY IS AVERAGED AWAY. SPEC Proposition 6.1.1, transcribed
    verbatim in BATCH-001, computes p-tilde = P(z_k = 1) for z = x . r with x
    "chosen uniformly among all binary vectors of weight w" and r "chosen
    uniformly among all vectors of weight w_r and independently of x". The
    probability is over BOTH. Proposition 6.1.2 inherits this and defines p*.
    Consequently p*, and therefore every DFR in the model, is a quantity in
    which the key has already been integrated out. THE MODEL CONTAINS NO
    PER-KEY OBJECT. It cannot be wrong about per-key dispersion; it is silent
    about it, which is worse, because Definition 6.2.1's delta-correctness
    takes an expectation over keys and Theorem 6.3 then multiplies that single
    delta by (q_RO + q_D). Reading the resulting bound as a per-key guarantee
    requires A24 - key homogeneity - and A24 is stated nowhere.

    (2) WHY THE KEY IS NOT AVERAGEABLE: THE CONVOLUTION IS AN ADDITIVE-ENERGY
    STATISTIC. In R = F_2[X]/(X^n - 1),
      (x . r2)_k = sum over (i, j) in supp(x) x supp(r2) with i + j = k (mod n),
    taken mod 2. Write N_k(x, r2) for that count. Then w(x . r2) = #{k : N_k
    odd}, and sum_k N_k = w . w_r always. So the weight of the convolution is
    determined entirely by HOW THE w.w_r pairs distribute across the n
    residues, and that distribution is a joint additive property of the two
    supports. Fixing x and averaging over r2:
      E[w(x . r2) | x] = sum_k Pr[N_k(x, r2) odd | x],
    and the second factorial moment of the N_k involves
      #{(i1, i2, j1, j2) : i1 + j1 = i2 + j2} = the ADDITIVE ENERGY of
      supp(x) against supp(r2),
    whose expectation over r2 is a linear functional of the DIFFERENCE
    MULTISET of supp(x): each repeated difference d = i1 - i2 in supp(x)
    contributes a coincidence whenever r2 contains a matching pair j2 - j1 = d.
    A Sidon-like support (all differences distinct) minimises coincidences and
    maximises the number of odd cells; a support with a heavy difference
    multiset - an arithmetic progression, a union of cosets, anything with
    additive structure - maximises coincidences, produces more even cells, and
    LOWERS w(x . r2). Hence p*_x is a decreasing function of the additive
    energy of supp(x), and the failure probability inherits the monotonicity.
    THE SIGN IS DERIVED, NOT GUESSED, and it is a pre-registered prediction:
    high-energy keys are SAFER, Sidon-like keys are WORSE THAN AVERAGE.

    (3) THE FORCED VALUE, WHICH IS A NULL THAT CANNOT BE SATISFIED BY
    ACCIDENT. Draw K keys; for each, run T independent ciphertext trials and
    count failures F_1..F_K. Under the model as written - one common failure
    probability delta for all keys - the F_k are i.i.d. Binomial(T, delta) and
    the dispersion index
      D = (K - 1)^{-1} sum_k (F_k - Fbar)^2 / (Fbar (1 - Fbar/T))
    has expectation EXACTLY 1 with variance 2/(K-1) + O(1/T). Under
    key-dependence with per-key rates delta_k of variance sigma^2,
      E[D] = 1 + T . sigma^2 / (delta (1 - delta)) approximately,
    so the excess grows LINEARLY IN T. That linear growth is a second,
    independent signature: a genuine key effect must make D grow with the
    number of trials per key at fixed K, while an instrument artifact
    (mis-seeded RNG, correlated trials) generally does not. A ladder in T is
    therefore a free discriminator and is built into the design.

    (4) WHY THE DIRECTION IS SIGNABLE HERE AND WAS NOT THERE. A dispersion
    index is bounded below in expectation by 1 - it cannot be less than
    binomial noise except by chance - so every material deviation is an EXCESS
    and every excess means some keys are worse than delta. Contrast
    DEC-20260802-9664c6 D-6, which established that A17's failure direction
    cannot be signed from second-moment data because two mechanisms of opposite
    sign are present and the distortion depends on the joint moment
    mu_{delta_e+1}. That obstruction is real and this proposal does not
    dispute it; it ROUTES AROUND IT by changing the conditioning variable from
    the block index to the key. The obstruction was about the inner-decoder
    indicators; it says nothing about keys.

    (5) WHAT IT WOULD AND WOULD NOT MEAN. Theorem 6.3 is a statement about the
    IND-CCA2 advantage with the key sampled, so a per-key spread does not make
    the theorem false and this proposal does not claim it does. What it would
    make false is the OPERATIONAL READING - "every HQC key enjoys the claimed
    margin" - and it would put a number on the fraction of keys that do not.
    The security-relevant quantity is the upper tail of the per-key rate
    distribution, not its variance, and the variance is merely the cheapest
    detector of a tail. Any statement about the tail requires extrapolation
    from reduced parameters and is a numbered heuristic, never a measurement.

    (6) THE CHEAPEST DECISIVE GATE, AND IT IS PEN AND PAPER. Before any
    sampling: compute Var_x(p*_x) exactly at a small n by exhaustive
    enumeration over all C(n, w) supports, and compare against zero, which is
    what A24 asserts. At n = 23, w = 4 there are 8855 supports; the exact
    conditional p*_x for each is a finite sum. IF Var_x(p*_x) IS ZERO AT SMALL
    n, the additive-energy mechanism does not exist and the entire proposal is
    dead in seconds. THAT is the stage that can terminate the run, and it costs
    no sampling at all.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - knowledge/literature (all HQC-matching entries)
      - ledger/ (all HQC records: RQ, IDEA, DEC x3, EV x3, CORR)
      - coordination/goals/GOAL-HQC-001 (BATCH-001/002/003, all artifacts)
    grep_results:
      - >-
        No per-key, conditional-on-key, weak-key or key-class quantity appears
        anywhere in this goal's records. All three batches work with
        key-averaged objects.
      - >-
        "additive energy", "difference multiset" and "Sidon" appear nowhere in
        any HQC record. The corpus's only Sidon-adjacent material is on the
        ECDLP side (DEC-20260724-020's red team, Bose-Chowla factor bases) and
        is unconnected.
      - >-
        The 23 numbered assumptions contain no key-homogeneity statement; A24
        is proposed here as a NEW numbered assumption of the transcribed model,
        not as a correction to the transcription, which faithfully recorded
        what the sources say.
    conclusion: >-
      Novel within this corpus. Externally, the weak-key concept is standard in
      the decryption-failure literature for lattice KEMs and Guo-Johansson's
      HQC attack is a per-instance attack, so a prior statement of some form is
      likely; stage 0 looks, and a hit is recorded as confirmation. This screen
      is discounted by KN-OPEN-3f7a21 exactly as the sibling proposals' screens
      are.

  lossy_projection_identifiability_audit:
    projection: >-
      The secret key (x, y), an n-bit pair of weight w each -> the additive
      energy / difference-multiset profile of its support, a short vector of
      counts; and downstream, the single scalar p*_x.
    what_is_discarded: >-
      The positions themselves. Every cyclic rotation of a support, every
      reflection, and in general every support with the same difference
      multiset maps to the same value.
    why_genuinely_lossy: >-
      Strongly lossy: the difference multiset is invariant under rotation, so
      the fibre contains at least n supports for every value, and generically
      far more. Reconstructing a set from its difference multiset is not
      possible in general - the classical non-uniqueness of homometric sets is
      the reason - so this is a genuine quotient and not an encoding.
    why_compatible_with_the_operations: >-
      Compatible with the one operation that matters: the convolution's
      coordinate counts N_k are determined by the joint incidence structure of
      the two supports, and their moments over random r2 are functions of
      supp(x)'s difference multiset alone. The retained data therefore
      propagates deterministically into the conditional weight law, which is
      exactly the requirement.
    is_it_only_a_change_of_coordinates: >-
      NO. Homometric sets - distinct sets with identical difference multisets -
      exist, so the map is provably non-injective, and this is checked rather
      than asserted: at the small n of the exhaustive gate the fibres are
      enumerated directly.
    which_failure_was_checked_and_what_it_returned: >-
      BOTH failures were checked and the answers are different. The
      change-of-coordinates failure returns NEGATIVE for the reason above. The
      MIRROR failure - a projection constant across instances - is the live
      risk here, and the exhaustive gate in mechanism (6) IS its test: if
      Var_x(p*_x) = 0 over all C(n, w) supports at small n, the projection is
      constant, the comparator has zero spread, and the proposal is refuted at
      zero cost. That gate is placed first in the design precisely because this
      is the failure the object is exposed to. Nothing is claimed about which
      way it resolves; the pre-registered expectation is nonzero variance on
      the derived monotonicity in mechanism (2), and a zero would refute the
      derivation.

  assumptions:
    - >-
      That SPEC section 6.2.2's decoder-free failure criterion
      ("occurs if and only if w(x . r2 - r1 . y + e) > Delta") may be used in
      place of implementing the RM/RS decoder. This is the source's own
      sentence, but anomaly X9 records that it is stated in different terms
      from section 6.1's two-stage analysis. The surrogate is declared, its
      divergence from the concatenated decoder is a named limitation, and the
      package reports which criterion produced every number.
    - >-
      That Delta for the reduced parameter sets is computed from the reduced
      code's own minimum distance rather than inherited. Given the corpus's own
      RS-S3 experience - a printed minimum distance of 49 against four
      independent derivations of 59, worth 50.7 bits at NIST-5, resolved in
      CORR-20260802-3ae664 - every d and Delta used here is derived, not read.
    - >-
      That per-key rates at reduced parameters carry information about per-key
      rates at HQC's parameters. THIS IS NOT ASSUMED. It is numbered as
      HEUR-HQC-KEY-2 and is the proposal's weakest link; no extrapolation is
      performed in the decisive stages.

  predictions:
    - metric: >-
        Var_x(p*_x) over all C(n, w) supports at the exhaustive gate cell
        (exact rational arithmetic, no sampling)
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE. The model's forced value is 0 (A24). Any positive
        value refutes A24 as an exact statement; the magnitude is not
        predicted, only the sign, because predicting the magnitude would be a
        fit. If it is exactly 0, the proposal is refuted at stage 1 and the
        record says the additive-energy mechanism does not exist at that cell.
    - metric: >-
        Spearman rank correlation between the additive energy of supp(x) and
        the conditional p*_x, over all supports at the exhaustive cell
      direction: lower
      minimum_effect: >-
        STRICTLY NEGATIVE, magnitude at least 0.3. The sign is derived in
        mechanism (2) - higher energy means more coincidences, more even
        cells, lower convolution weight, lower p*_x - and is pre-registered.
        A positive correlation falsifies the derived mechanism even if the
        variance is nonzero, which would mean key dependence exists for some
        other reason and the record must say it does not know which.
    - metric: >-
        Dispersion index D of per-key failure counts, K = 500 keys x T trials,
        at three reduced parameter cells
      direction: higher
      minimum_effect: >-
        Under A24, E[D] = 1 with standard deviation sqrt(2/(K-1)) = 0.0633 at
        K = 500. Detection threshold pre-registered at D > 1 + 4 . 0.0633 =
        1.253. Below that, the record reports NO DETECTED KEY EFFECT AT THIS
        CELL AND THIS T, with the implied upper bound on sigma^2 stated, and
        does not report an absence of key effect.
    - metric: >-
        Growth of (D - 1) with T at fixed K, over a ladder T in
        {T0, 2T0, 4T0, 8T0}
      direction: higher
      minimum_effect: >-
        LINEAR IN T, slope sigma^2/(delta(1-delta)) > 0, with the four points
        consistent with a straight line through the origin to within their
        error bars. A (D - 1) that is nonzero but FLAT in T is not a key
        effect; it is an artifact of the trial generator, and the ladder exists
        to catch exactly that. This is the inventor protocol section 3 decay
        test run in reverse: the quantity must GROW with the parameter that
        amplifies it, and a quantity that ignores that parameter is an
        artifact.
    - metric: >-
        Dispersion index on the SHUFFLED NULL (key redrawn independently for
        every trial, so no key effect exists by construction)
      direction: different
      minimum_effect: >-
        1.000 +/- 4 sqrt(2/(K-1)). THE NULL CAN FAIL: if the shuffled arm also
        shows excess dispersion, the excess is generated by the trial
        machinery, not by keys, and no per-key conclusion may be drawn from any
        arm.
    - metric: >-
        Dispersion index on the PLANTED POSITIVE CONTROL (a declared fraction
        of keys given a deliberately altered support structure)
      direction: higher
      minimum_effect: >-
        Above the 1.253 threshold at the largest planted magnitude, with a
        MONOTONE detection curve across at least three interior planted
        magnitudes. If the instrument cannot see a planted effect it may not
        report the absence of an unplanted one.

  minimal_test:
    design: >-
      Four stages, cheapest decisive first, pure Python plus numpy (verified
      present; no sympy, no scipy). STAGE 0 (reading, zero compute): resolve
      the SPEC section 4.1 weight ambiguity shared with the sibling proposals;
      search for a prior per-key or weak-key statement about HQC. STAGE 1
      (exhaustive, exact, seconds - THE GATE THAT CAN END THE LINE): at a small
      cell (n = 23, w = 4, say) enumerate all C(n, w) supports, compute the
      exact conditional p*_x for each, and report Var_x(p*_x) and the
      energy-to-p* rank correlation. Zero variance refutes the proposal here.
      STAGE 2 (dispersion, minutes): K = 500 keys x T trials at three reduced
      cells with the section 6.2.2 criterion, with the shuffled null generated
      and committed first. STAGE 3 (ladders, minutes): the T ladder for linear
      growth, and the planted-magnitude ladder for the detection curve.
    controls:
      - >-
        SHUFFLED NULL (matched, same shape, forced value pre-derived, CAN
        FAIL). Identical code path, identical trial count, identical seeds
        structure, with the key redrawn per trial so that no key effect can
        exist. FORCED VALUE D = 1.000 +/- 4 sqrt(2/(K-1)). This is the same
        object as the treatment in every respect except the one being tested,
        which is what "matched" means and what the program-wide controls census
        found 166 of 229 evidence records lacking.
      - >-
        PLANTED POSITIVE CONTROL, GRADED, >= 3 interior points, monotonicity
        reported. A declared fraction of keys is drawn from a deliberately
        structured support family (an arithmetic-progression support, then
        interpolating families between it and uniform), at three or more
        magnitudes. The detection curve must be monotone and must clear the
        threshold at the largest magnitude. If it does not, the instrument is
        broken and NO negative result may be reported from any arm.
      - >-
        T-LADDER as an artifact discriminator: (D - 1) must grow linearly in T
        for a genuine key effect and must not for a trial-machinery artifact.
        Reported before any interpretation of the treatment arm.
      - >-
        EXHAUSTIVE CROSS-CHECK: at the stage-1 cell the per-key rates are
        computable EXACTLY, so the stage-2 sampling estimator can be validated
        against exact values at that one cell before being trusted at larger
        cells. An estimator that does not reproduce known exact values is not
        used.
      - >-
        ORDERING CONTROL: the shuffled null is generated, measured and
        hash-committed before any treatment key is drawn, and the decision rule
        is executed on it first.
    required_metrics:
      - Var_x(p*_x) and the energy rank correlation at the exhaustive cell, exact
      - D per arm per cell with K, T, and the exact seed derivation rule
      - the T ladder with the fitted slope and its error
      - the planted-magnitude detection curve with monotonicity verdict
      - the implied upper bound on sigma^2 whenever D is below threshold
      - which failure criterion (section 6.2.2 surrogate or full decoder) produced each number

  falsification_conditions:
    - >-
      Var_x(p*_x) = 0 at the exhaustive cell. The additive-energy mechanism
      does not exist there; the proposal is refuted at zero sampling cost and
      the record says so with the cell's exact boundary.
    - >-
      The energy-to-p* rank correlation is positive. The derived monotonicity
      in mechanism (2) is wrong; any surviving key dependence has an unknown
      cause and must be reported as unexplained rather than attributed.
    - >-
      The shuffled null shows excess dispersion. No per-key conclusion may be
      drawn from the package at all.
    - >-
      The planted positive control fails to fire at the largest magnitude.
      Instrument broken; no negative reportable.
    - >-
      (D - 1) is nonzero but flat in T. The excess is an artifact of the trial
      generator, not a key effect, and is reported as such.
    - >-
      D is within threshold at all cells with the planted control firing
      correctly. Then no key effect is DETECTED at the tested cells and trial
      counts, an upper bound on sigma^2 follows, and that bounded negative is
      the deliverable - scoped to exactly those cells, with the bound stated,
      and with no claim that HQC's own parameters behave the same way.

  confounders:
    - >-
      THE SURROGATE CRITERION. Section 6.2.2's w(e') > Delta is a
      bounded-distance criterion; the deployed decoder is two-stage ML-then-
      algebraic. A key effect present in one need not be present in the other,
      and anomaly X9 records that the source states both. Declared, and the
      full-decoder arm is named as the successor.
    - >-
      SMALL-n ADDITIVE ARTIFACTS. At small n every support has structure
      relative to the group Z/nZ; the energy spread may be an artifact of the
      cell size rather than a property that persists. The three-cell design and
      the reported cell-to-cell consistency exist for this and it is not
      resolved by them - it is bounded by them.
    - >-
      MULTIPLE TESTING. Three cells x several statistics invites a spurious
      excess. The threshold is pre-registered at 4 standard deviations and the
      primary metric is declared to be the treatment-minus-shuffled difference
      at the largest cell, chosen before any number is seen.
    - >-
      SAMPLER BIAS. HQC's deployed SampleFixedWeightVect is biased by
      construction (A22, tau values in SPEC Table 12). This package uses an
      exact uniform fixed-weight sampler and declares it; the biased sampler
      would ADD a second source of key-conditional structure and is a named
      successor, not a contaminant here.

  interpretation_limits:
    - >-
      THEOREM 6.3 IS NOT CLAIMED TO BE FALSE. It bounds the IND-CCA2 advantage
      with the key sampled, and an average delta is the correct object for
      that bound. What a measured dispersion would falsify is A24, the
      unstated key-homogeneity reading under which the bound is quoted as a
      per-key guarantee. Conflating the two would be an overclaim of exactly
      the kind this program exists to prevent.
    - >-
      NO ATTACK, NO KEY RECOVERY, NO CHOSEN CIPHERTEXT. Nothing here recovers
      anything; the deliverable is a dispersion number and a bound.
    - >-
      CLAIM TIER toy, per RQ-HQC-001. Every measured quantity is at reduced
      parameters, and the rarity wall EV-HQC-0e9116 established (T_req about
      1/DFR: 3.4e41 / 6.8e59 / 8.4e79 trials) applies unchanged to the per-key
      quantity at HQC's own parameters.
    - >-
      A DETECTED DISPERSION AT REDUCED PARAMETERS IS NOT A STATEMENT ABOUT
      DEPLOYED HQC. The extrapolation is HEUR-HQC-KEY-2 and it is not
      performed in this proposal.

  heuristic_assumptions:
    - id: HEUR-HQC-KEY-1
      statement: >-
        FORALL keys x of weight w, the conditional crossover probability p*_x
        is a strictly decreasing function of the additive energy of supp(x),
        uniformly over the declared cells. Quantifier order stated
        deliberately: the monotonicity is claimed uniformly over keys within a
        cell, not merely on average over keys.
      rigorous_support: >-
        Derived in mechanism (2) at the level of the second moment: repeated
        differences in supp(x) create coincidences among the pair counts N_k,
        coincidences produce even counts, and even counts are zeros of the
        convolution. The step from "affects the second moment" to "strictly
        decreasing in the exact conditional probability" is NOT proved and is
        the honest gap; the exhaustive stage-1 cell tests it directly rather
        than assuming it.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A non-negative rank correlation between energy and p*_x at the
        exhaustive cell.
    - id: HEUR-HQC-KEY-2
      statement: >-
        The per-key dispersion measured at reduced parameters transfers in
        direction, though not in magnitude, to HQC's selected parameters.
      rigorous_support: >-
        NONE. This is the standard reduced-parameter transfer assumption and it
        is recorded as unsupported. It is the proposal's weakest link and it is
        NOT used by any decisive stage; it would be needed only by a statement
        about deployed HQC, which this proposal does not make.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Cell-to-cell inconsistency in the sign of the effect across the three
        reduced cells refutes even directional transfer at reachable sizes.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED AND NONE IS CLAIMED. This is a model audit with
      a measurable observable, and saying so plainly is required rather than
      dressing it as a complexity result.
    memory_exponent: n/a
    best_known: >-
      n/a for the audit. The quantity being audited - a per-key HQC failure
      rate - has no published value in this corpus, which is the gap.
    hidden_overhead: >-
