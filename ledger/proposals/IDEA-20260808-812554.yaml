idea:
  id: IDEA-20260808-812554
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-PATH-001
  title: 'The sigma-threshold: prime-field index calculus with an exhaustive decomposition
    solver costs exactly m!*N for every arity and every factor-base size, and beating rho
    requires a solver exponent sigma < 1 - 2/(m-1), hence m >= 4 and T_solve < B at m = 4.'
  class: composition
  claim: 'Write T_solve = B^{(m-1)sigma} for the cost of finding all m-decompositions of one
    target over a size-B = N^beta factor base (sigma = 1 is exhaustive). Then (i) C_rel =
    B * P_dec^{-1} * T_solve = m! * N * B^{(m-1)(sigma-1)}, so at sigma = 1 the B-dependence
    CANCELS IDENTICALLY and the total is m!*N for every m and every beta — strictly worse
    than BSGS and than rho, unconditionally within the model; (ii) beating rho requires beta*(m-1)*(1-sigma)
    > 1/2 together with 2*beta < 1/2, hence beta < 1/4 and sigma < 1 - 2/(m-1). Table: m=3
    admits no sigma >= 0; m=4 needs sigma < 1/3 (T_solve < B); m=5 needs sigma < 1/2 (T_solve
    < B^2); m -> inf needs sigma < 1. (iii) The achieved exponent at the balance point is
    2/(2 + (m-1)(1-sigma)), so sigma = 0 with m free gives L_N(1/2, 2+o(1)) once the m! factor
    is charged. The claim is that sigma is the ONLY free parameter left in prime-field index
    calculus, and that this three-line table is the admission gate every future proposal must
    clear.'
  mechanism: Yield is exactly conserved (KN-FIND-007), linear algebra is already at the sparse
    optimum m*B^2, and relation count is forced to be ~B by the rank requirement. The only
    unpriced quantity is the solve. Writing it as a power of B and substituting exposes the
    cancellation at sigma = 1, which explains in one line why every prime-field index-calculus
    variant measured by this programme has landed at or above rho regardless of arity, factor-base
    geometry, or elimination method.
  why_not_a_renamed_known_approach: 'IDEA-20260727-003 computes the cost FLOOR with the decomposition
    oracle made FREE (sigma = 0) and gets F(beta,m) = max(B, c_LA B^2, ...). That is one point
    of this surface. IDEA-20260727-007 fixes m = 5 and a yield heuristic and reports one number.
    Neither states the sigma = 1 cancellation theorem nor the admission inequality sigma <
    1 - 2/(m-1). FINDING-PF-IC-001 asserts the cost "is dominated by the |F|-size linear algebra
    over the membership-quotient ring": this record makes that assertion a measurable exponent
    and shows it is exactly the sigma = 1 boundary.'
  predictions:
  - observable: measured total cost of any implemented prime-field index calculus
    metric: log_N(total charged operations) at matched N across beta and m
    predicted: '>= 1 - o(1) whenever the implemented solver is exhaustive, INDEPENDENT of
      beta and m; a measured exponent below 1 with an exhaustive solver indicates a charging
      error, not an algorithmic gain'
  - observable: the crossover behaviour that H-IC-001 reported (T_desc/sqrt(N) decreasing)
    metric: same quantity recomputed with every stage charged
    predicted: the decrease is a beta-sweep artifact, not an exponent, and vanishes when the
      sigma = 1 cancellation is applied
  - observable: admission screening of the 453 filed proposals
    metric: count of ECDLP proposals that name a sigma and clear sigma < 1 - 2/(m-1)
    predicted: zero
  minimal_test: 'Zero compute for the derivation. One cheap empirical check: instrument the
    existing harness to report the measured exponent of C_rel in B at fixed m and N over at
    least four B values; the predicted slope is (m-1)(sigma-1) and, for the shipped exhaustive
    solver, exactly -(m-1)+(m-1) = 0 in the product C_rel, i.e. C_rel flat in B.'
  controls:
  - Charge every stage in the single unit of IDEA-20260802-007; an uncharged solve is the
    standard way this cancellation gets hidden.
  - Compare against multi-target Kuhn-Struik sqrt(T*N), not T*sqrt(N) (see E1-12).
  confounders:
  - Small-B regimes where B^m << N make P_dec^{-1} enormous and the constant m! dominates,
    which can masquerade as a slope.
  - 'Rank deficiency: fewer than B independent relations silently changes the relation count
    from B to B/(1-defect) and shifts the measured slope.'
  falsification_conditions:
  - An implemented exhaustive-solver index calculus measured, with all stages charged, at
    total exponent < 1 - 0.05 => the cancellation theorem is wrong or the model omits a real
    stage, and the model must be repaired before any proposal uses it.
  - A solver exhibited with sigma < 1 - 2/(m-1) at any m => the gate is cleared and the record
    becomes the cost frame for an exponent claim.
  interpretation_limits: The model assumes relation count ~B, sparse Wiedemann linear algebra,
    uniform targets, and a solver cost that is a pure power of B. Large-prime variations,
    structured Gaussian elimination and rank defects change constants and can change beta,
    but none of them changes the sigma = 1 cancellation, which is the load-bearing part.
  assumptions:
  - Prime-order subgroup, cofactor O(1), uniform targets by re-randomisation R = aP + bQ.
  - No structured linear-algebra speedup assumed (H-STR-002 weakened; none claimed).
  heuristic_assumptions:
  - id: HA-1
    statement: The B x B relation matrix over Z/N has corank 1 with probability 1 - o(1) when
      B+O(1) relations are collected from independent uniform targets.
    rigorous_ingredient: Random sparse matrices over a field of prime order have full rank
      with probability 1 - O(1/N) per missing dimension; the relation supports are m-subsets.
    distribution_imitated: The standard index-calculus rank heuristic used in every published
      analysis.
    validation_route: 'Toy N in [2^16, 2^26]: collect B + 10 relations, measure exact rank
      over Z/N, report the corank histogram against the prediction. Label toy.'
    tail_checks: Corank > 1 in more than 1% of trials indicates factor-base collisions or
      a structured base and invalidates the relation-count = B assumption.
  target_complexity:
    time_exponent: 'Master formula: total = max(m! N^{1 - beta(m-1)(1-sigma)}, m N^{2 beta});
      optimum exponent 2/(2 + (m-1)(1-sigma)). sigma = 1 gives exponent 1 for all m, beta.'
    memory_exponent: '"N^{beta}, beta < 1/4 in any admissible cell."'
    best_known_baseline: '"rho/vOW N^{1/2} memory O(1); BSGS N^{1/2}/N^{1/2}."'
    hidden_overhead_disclosure: m! is superpolynomial once m grows with N and is charged explicitly.
      poly(log N) factors in the solve and in Wiedemann are not tracked and would matter concretely.
    time_memory_tradeoff: beta is exactly the memory exponent; the surface total(beta, sigma,
      m) is the time-memory tradeoff for this whole family and shows memory < time in every
      admissible cell, unlike claw-based attacks.
  sota_delta: "Zero as an attack. As a comparator it is strictly negative for the programme's\
    \ own history: >-\n  it predicts that every measured prime-field index-calculus exponent\
    \ at\nsigma = 1 must be >= 1, which is worse than rho, and it converts \"index calculus\
    \ does not beat rho over prime fields\" from an empirical impression into a one-line identity\
    \ with a named escape condition."
  dominated_by: 'n/a (no result claimed). Frontier rows checked for the comparator''s own
    correctness: rho/vOW, BSGS, Kuhn-Struik multi-target sqrt(TN), preprocessing frontier
    S T^2 = N, and the special-curve attacks (out of scope).'
  estimated_cost: '"Implementation low (a 60-line cost module); compute low."'
  recommended_priority: high
  honest_prior_of_survival: ~0.9 that the identity is correct as stated (it is algebra). ~0.6
    that it changes how the programme screens proposals, which is where its value is.
  novelty_status: screened
  novelty_screen: Screened against EXISTING_PROPOSALS.txt (all RQ-ECDLP-002 / RQ-ICEX / RQ-RELN
    / RQ-SDEG rows), REJECTED_TITLES.txt, EXISTING_HYPOTHESES.txt, KNOWLEDGE_BARRIERS.txt,
