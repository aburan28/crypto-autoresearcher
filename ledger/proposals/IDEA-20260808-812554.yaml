  proof_search_map:
    bottleneck: '"sigma, the solver exponent."'
    baseline_embedding:
      parameter_slice: '"sigma = 1 must reproduce the known ''IC does not beat rho over F_p''."'
      reproduction_check: '"Symbolic cancellation check, frozen as a unit test."'
    observation_collision:
      observable: '"total cost exponent."'
      distinct_preimage_search: 'Distinct (beta, m) pairs give the same total at sigma = 1
        — an intended, and diagnostic, collision: it means beta and m sweeps carry no information
        about the exponent, so any reported trend in beta or m is measuring something else.'
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: '"The (beta, sigma, m) surface with the two budget inequalities."'
      predicted_gain: '"Reduces an open-ended design space to one scalar admission test."'
    quantifier_order: FOR ALL m >= 2, FOR ALL beta in (0, 1/2), IF sigma = 1 THEN total =
      Theta(m! N). EXISTS m, beta, sigma with sigma < 1 - 2/(m-1) and beta < 1/4 IFF total
      = o(N^{1/2}).
    method_ceiling:
      strongest_certifiable_claim: '"A cost identity inside a stated model; not a lower bound
        on ECDLP."'
      nearby_object_control: 'Extension fields F_{q^n}, where sigma is effectively 0 because
        the solve is a fixed-degree system: the same formula then predicts subexponential
        behaviour, which matches Gaudry-Diem. That the formula reproduces the known positive
        case is the control that it is not vacuously negative.'
    proof_obligations:
    - claim: '"C_rel = m! N B^{(m-1)(sigma-1)}"'
      responsibility: runtime
    - claim: '"relation count ~B suffices"'
      responsibility: correctness
    - claim: '"C_LA = m B^2"'
      responsibility: baseline
    - claim: '"admission inequality sigma < 1 - 2/(m-1)"'
      responsibility: strictness
