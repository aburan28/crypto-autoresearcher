  novelty_screen:
    method: >-
      Screened all 24 current RQ-SQISIGN-001 proposal records by identifier and
      mechanism, and compared the candidate with the stale read-only knowledge-index
      results supplied in the frozen task context.
    results: >-
      Nearest prior work covers generic transcript tests, abort conditioning,
      retry latency, signature length, commitment collisions, canonicalization,
      simulator audits, and conversion fibres. None of those records, as screened,
      specifies checkpoint restoration as an explicit oracle and tests conditional
      pair exchangeability while excluding timing and length. The knowledge results
      were low-specificity and the corpus snapshot is stale.
    verdict: >-
      Unverified. Distinctness from the screened local proposals is not a literature
      novelty result, and absence from the stale index is not evidence of absence.
  object_first_candidate:
    tracked_object: >-
      The conditional joint law of two labelled public transcripts under shared
      versus independently refreshed signer state.
    lossiness: >-
      Public-field feature maps discard secret state and may merge different reuse
      events; a null result closes only the chosen oracle, fields, and statistics.
    propagation: >-
      A duplicated internal sampler branch can propagate to equality or dependence
      among public commitments and verifier-derived public strata.
    survival_score: >-
      Pre-register conditional HSIC, collision excess, and classifier AUC; survival
      requires family-wise corrected rejection on an untouched message set and the
      same direction in a second deterministic seed block.
  predictions:
    - metric: conditional pair-classifier AUC for reused-state versus fresh-state transcripts
      direction: increase above chance
      minimum_effect: AUC at least 0.60 with a 95% bootstrap lower bound above 0.55
    - metric: excess repeated-public-field collision probability after public-input matching
      direction: positive
      minimum_effect: at least 0.02 absolute excess with corrected p-value below 0.01
    - metric: true-simulator null classifier AUC
      direction: remain at chance
      minimum_effect: AUC between 0.47 and 0.53 and no corrected rejection
  minimal_test:
    design: >-
      At a toy parameter set, generate balanced pairs from the declared
      O_state-reuse oracle, an otherwise identical fresh-state signer, a true
      simulator, and a planted-positive generator that copies one designated public
      field with known probability 0.20. Freeze the feature map and thresholds before
      opening the held-out message and seed blocks.
    controls:
      - Matched no-fault true-simulator null with identical public inputs and sample count.
      - Fresh-state real-signer control with state checkpointing disabled.
      - Planted positive that copies a labelled public field in 20 percent of pairs.
      - Message permutation and public-key permutation controls.
      - Signature byte length removed from every feature vector.
      - Wall-clock time, retry counts, and all other timing observations unavailable to the test.
    required_metrics:
      - Conditional classifier AUC with bootstrap confidence interval.
      - Collision excess with exact permutation p-value.
      - Conditional HSIC with family-wise error correction.
      - Acceptance rate and public-field parse-failure rate reported separately.
  controls:
    - True simulator with fresh independent state for every transcript pair.
    - Real signer with fresh independent state for every transcript pair.
    - Planted public-field reuse positive of calibrated strength.
    - Same-state oracle with messages relabelled after transcript production.
    - Negative control feature made from fresh independent public randomness of equal dimension.
  falsification_conditions:
    - >-
      Reject the mechanism for the tested oracle if the reused-state arm remains
      inside the pre-registered null bands for all primary metrics while the planted
      positive is detected with at least 0.90 power.
    - >-
      Reject the claimed state-specific interpretation if the same effect appears in
      the matched true-simulator null or survives after replacing the reuse oracle by
      a semantically inert checkpoint operation.
    - >-
      Treat the test as invalid, not negative evidence, if the planted positive is
      missed, parsing differs across arms, or any timing or signature-length feature
      reaches the classifier.
  confounders:
    - Deterministic message hashing can create benign public-field dependence.
    - Rejection sampling can change pair counts unless acceptance is conditioned identically.
    - Parser normalization can create apparent equality after distinct byte encodings.
    - Checkpoint instrumentation itself can perturb the sampler or random stream.
  interpretation_limits:
    - This is a toy distributional audit, not a production exploit.
    - A distinguisher does not imply secret-key recovery or forgery.
    - A null result does not cover other state objects, checkpoint locations, or implementations.
    - The proposal is separate from retry-latency and signature-length channels.
    - The proposal does not alter or test GOAL-SSI-001 hard-problem assumptions.
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Conditional on fixed public inputs, fresh signer state makes two no-fault
        transcript draws exchangeable under pair permutation.
      rigorous_support: >-
        Exchangeability follows exactly if the implementation draws independent state
        from the same distribution and the public conditioning variables are fixed.
      distribution_imitated: Independent conditional transcript draws from the true simulator.
      validation_plan: >-
        Test pair permutations separately for the true simulator and fresh-state signer
        before comparing either with the reuse oracle.
      falsification_condition: >-
        The assumption fails for the tested implementation if the fresh-state arm has
        a stable pair-order effect after public-input matching.
    - id: H2
      formal_statement: >-
        The chosen public-field features retain at least one dependence introduced by
        O_state-reuse at the tested checkpoint.
      rigorous_support: >-
        No general guarantee is claimed; exact copied-field collisions are a rigorous
        positive only for the planted generator.
      distribution_imitated: A sparse shared-latent-variable perturbation of the null pair law.
      validation_plan: >-
        Calibrate power over planted copy probabilities from 0.02 through 0.20, then
        freeze the minimum detectable effect.
      falsification_condition: >-
        Planted dependence at the registered minimum is not detected with 0.90 power.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: >-
      This is not an isogeny-solving algorithm. KN-TECH-058 remains the relevant
      hard-problem baseline: unconditional Fp2 time p^(1/2)(log p)^O(1) with
      polynomial memory, and conditional p^(1/3+o(1)) time and memory only under
      Heuristic 1.
    hidden_overhead: >-
      Audit cost is O(N^2) for the naïve pair kernel or O(N log N) with registered
      random features. KN-TECH-058's conditional baseline has superpolynomial hidden
      overhead and no concrete-performance claim.
    tradeoff_note: >-
      Random-feature dimension trades memory and detection power; it does not change
      the cryptanalytic time exponent. Reductions and the GRH boundary remain unverified.
  cost_model:
    time: O(N log N) registered-feature audit after N transcript generations per arm
    memory: O(Nd) stored public features, reducible to O(d) streaming moments
    data_or_queries: 4N signing or simulation queries across reuse, fresh, simulator, and planted arms
    preprocessing: Freeze parser, public-field map, conditioning strata, and thresholds on calibration data
    oracle: >-
      O_state-reuse permits restoration of a declared mutable-state checkpoint before
      signing; it reveals no clock, retry counter, internal state value, or secret.
    verification: O(N) transcript verification plus independent recomputation of all registered statistics
  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce equality of the no-fault true-simulator and fresh-state pair metrics
      within registered confidence bands before inspecting the fault arm.
    observation_collision_search: >-
      Search for distinct null mechanisms, including message hashing and parser
      normalization, that yield the same collision or HSIC observation.
    quantifier_order: >-
      For each fixed toy parameter set, implementation, checkpoint, public-input
      sampler, feature map, and state-reuse probability, probability is taken over
      precommitted fresh seeds and messages; no universal implementation claim follows.
    method_ceiling: >-
      The method can establish a distributional mismatch for the tested oracle, but
      cannot identify the reused secret state or prove a forgery advantage.
    nearby_object_control: >-
      Apply a semantically inert checkpoint/restore to a separate diagnostic PRNG not
      consumed by signing; an effect there diagnoses instrumentation artifacts.
  nearest_neighbors:
