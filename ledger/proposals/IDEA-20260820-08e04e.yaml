idea:
  id: IDEA-20260820-08e04e
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Reused-state exchangeability defect in pairs of public SQIsign transcripts
  class: distributional implementation-fault audit
  claim: >-
    A signer whose per-signature mutable state is restored, duplicated, or reused
    can induce a cross-signature exchangeability defect in otherwise valid public
    transcripts. The proposal claims only that this defect is testable under a
    declared state-reuse oracle; it does not claim key recovery, a timing channel,
    a signature-size channel, or a change to the supersingular-isogeny baseline.
  mechanism: >-
    Define O_state-reuse(k, j) to restore the signing implementation's mutable
    randomness/sampler state to checkpoint k before producing transcript j, while
    all message and public-domain inputs remain freshly sampled. Partition each
    published transcript into protocol-labelled public fields and compute
    permutation-invariant pair features: repeated public commitments, equality of
    verifier-derived strata, coordinate-wise rank coincidences, and a kernel
    two-sample statistic on ordered pairs. Independent fresh-state transcripts are
    exchangeable after conditioning on public inputs. Reusing a checkpoint can
    couple two signatures through the same hidden sampling branch and violate that
    conditional exchangeability even when each marginal transcript appears valid.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-bdae64
