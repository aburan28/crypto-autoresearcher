idea:
  id: IDEA-20261007-b64ffb
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSIQ-9702af
  title: >-
    Max trace-multiplicity of codomain j-invariants of prime-degree
    isogenies from y^2 = x^3 + x + 1 over F_41
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 + x + 1 over F_41, base-changed to
    F_1681 = F_41[z]/(z^2 - 3). Let L be the set of separable
    isogenies of prime degree l in {3, 5, 7} with cyclic kernel,
    from E to a codomain defined over F_1681, up to post-composition
    by an isomorphism. For each, let t be the trace of the codomain
    j-invariant from F_1681 down to F_41. Let M be the largest number
    of elements of L that share one value of t. Prediction: M is at
    least 3. M at most 2, including an empty L, is a negative. This
    claim does not say that the list-cardinality exponent moves. The
    rho exponent stays 1/2 and the conditional isogeny exponent stays
    1/3.
  mechanism: >-
    Lever F3 of RQ-SSIQ-9702af is list cardinality. Keying a
    meet-in-the-middle table by the trace of j instead of by j
    collides codomains that the full j-invariant would keep apart.
    The measured number is the heaviest trace bucket on one curve at
    one prime, not a new list. Representation class R1: the trace of
    j in the basis {1, z}. Operation set Sigma is the set of cyclic
    l-isogenies for l in {3, 5, 7}, not translation. Trichotomy class:
    partial-action, because the trace is constant on an isogeny only
    after the codomain is chosen and does not propagate under the
    full translation group. Families F1, F2, F4, F5, F6, and F7 are
    not the lens.
  novelty_status: unverified
  citations:
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry decomposition for fixed n is heuristic time
        O(q^{2-2/n}). That is not a trace bucket of three isogenies.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(N)) group
        operations.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      3 is not a square modulo 41, so z^2 - 3 is irreducible. This
      session checked the Legendre symbol and did not enumerate
      isogenies.
    - >-
      4*(1^3)+27*(1^2) = 31 is not 0 modulo 41, so E is nonsingular.
    - >-
      Two isogenies that differ by post-composition with an
      isomorphism are one element of L.
  proof_search_map:
    not_applicable_reason: >-
      This is one pre-registered bucket count, not a proof that list
      cardinality moves.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: maximum trace multiplicity M of codomain j
      direction: higher
      minimum_effect: at least 3
  minimal_test:
    design: >-
      For each l in {3, 5, 7}, compute the cyclic kernels via the
      l-division polynomial, apply Vélu, and record the trace of each
      codomain j-invariant. Take the maximum bucket. Do not replace
      the count by a modular-polynomial degree bound.
    controls:
      - >-
        The same count on the null curve y^2 = x^3 + 2x + 3 over
        F_41, same degrees, same basis. The null is recorded and is
        not the success gate.
      - >-
        A kernel whose codomain j is not in F_1681 is an instrument
        failure, not a positive.
    required_metrics:
      - M
      - the size of L
      - the null curve's M, recorded and not predicted
  falsification_conditions:
    - M is at most 2, including an empty list.
    - A timeout or an incomplete kernel enumeration is infrastructure, not a falsification and not support.
  confounders:
    - >-
      Counting isogenies twice, once for each direction, inflates M.
      The test counts outgoing isogenies from E only.
  interpretation_limits:
    - >-
      M at least 3 at p = 41 does not shrink the Wesolowski list at
      cryptographic size and does not change the exponent 1/3.
    - A negative closes only this equation, these three degrees, and this basis.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Codomain j-invariants of the short prime-degree isogenies
        from this curve behave like random elements of F_1681 for the
        purpose of their traces, so the heaviest trace bucket has
        size at least 3.
      rigorous_support: >-
        The number of cyclic subgroups of order l is at most l+1.
        That bound does not force a trace collision. The collision is
        the unproved imitation.
      validation_plan: >-
        The minimal test enumerates L in full at p = 41. Compare M
        with 3 and record the null curve. No second prime is in this
        proposal.
  target_complexity:
    time_exponent: p^{1/3+o(1)} conditional, unchanged
    memory_exponent: p^{1/3+o(1)} conditional, unchanged
    best_known: >-
      p^{1/2} times (log p) to a constant power, and p^{1/3+o(1)}
      time and memory conditional on the archived smoothness heuristic
    hidden_overhead: >-
      No new o(1) is claimed. The incumbent o(1) still hides the
      smoothness overhead named in the target profile.
    tradeoff_note: >-
      A trace key is one field trace per list entry. Exponent delta
      is 0. This does not sit on a new van Oorschot-Wiener curve.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-13bf67 and KR-IC-46d822. Neither states this trace
    bucket. KR-RHO-13bf67 dominates any exponent reading:
    Omega(sqrt(N)) group operations against exponent delta 0.
  sota_delta: >-
    Exponent difference 0 against both p^{1/2} and p^{1/3+o(1)}. The
    counted delta is a trace-bucket size of at least 3 at p = 41,
    against KR-IC-46d822's exponent 2-2/n, which is a different
    algorithm.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-46d822
      - KR-IC-b0fcda
      - KR-RHO-13bf67
      - KR-RHO-5b1c0a
      - KR-RHO-037e22
    nearest:
      - ref: KR-IC-46d822
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a decomposition runtime for fixed n. This
          proposal measures one trace bucket of size at least 3 and
          claims no change to 2-2/n.
      - ref: KR-RHO-5b1c0a
        provenance: internal
        relation: orthogonal
        delta: >-
          That row prices a subset-sum representation at p^{1.314}.
          This proposal prices a bucket of size 3 and leaves the
          exponent unchanged.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for F_41 and for x^3 + x + 1 over F_41
        - PR 1960 and PR 1959 idea claims
      web: []
      blocked: []
