idea:
  id: IDEA-20261005-3a18d1
  question_id: RQ-PAIR-21313f
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Cost and failure locus of the constructor PAIR and ECTD assume:
    Hilbert or ring class polynomial in, short-Weierstrass curve of
    prescribed trace out
  class: measurement
  claim: >-
    No discrete-logarithm algorithm is proposed, and F4 (pairing transfer
    into an extension field) is not used. RQ-PAIR-21313f and RQ-ECTD-001
    treat as available a curve over F_p whose Frobenius trace is a
    prescribed integer t. The constructor that produces it is the map
    (discriminant D, order O of discriminant D) -> class polynomial H_O
    -> an F_p-root j -> a short-Weierstrass equation E_j -> a
    point-counted trace t_obs. KN-TECH-061 classifies the isogeny class
    by the Weil polynomial and states that efficient construction is a
    separate problem; it gives no degree, no coefficient bit length, and
    no failure rate. This record measures those three. The cost is the
    size of H_O: degree equal to the class number h(O), times the bit
    length of the largest coefficient. The failure locus, checked by an
    independent point count of both twists, is: (i) a split prime, meaning
    4p = t^2 - v^2 D for integers t, v with p not dividing D, where the
    exact polynomial's roots must realise traces {t, -t}; (ii) an inert
    prime, Kronecker symbol (D/p) = -1 and p > |D|, where no F_p-root may
    satisfy that norm equation; (iii) a truncated polynomial, half the
    coefficient bits removed or a CRT modulus shorter than the largest
    coefficient, which must differ from H_O and must spoil at least one
    split-bin trace verdict; (iv) the Hilbert polynomial of the maximal
    order and the ring class polynomial of a conductor-f>1 order, whose
    F_p-root sets must be disjoint on at least one prime while the
    absolute traces agree. The ECDLP time exponent on whatever curve
    comes out stays the generic-group baseline, Pollard rho at about
    p^{1/2} group operations (KR-RHO-13bf67, KN-TECH-005). Grumpy giants
    (KR-RHO-fbd7b1) and the automorphism factor (KR-RHO-0528e7) stay
    inside that same square-root count. None of those baselines moves.
  mechanism: >-
    F4 (pairing transfer) is not the lens, and this is not a new ECDLP
    projection of a prime-order subgroup. No point is tracked under
    translation or under any other group operation. The constructed
    object is the tuple (discriminant D, class polynomial H_O, F_p-root
    j, short-Weierstrass equation E_j, point-counted trace t_obs). What
    the constructor can discard, and what the metrics read back, is the
    low-order bits of the coefficients and the choice of order inside
    one isogeny class. Dropping coefficient bits changes the integer
    polynomial, so a root mod p of the truncation need not be a root of
    H_O. Choosing the Hilbert polynomial of the fundamental discriminant
    rather than the ring class polynomial of conductor f > 1 can change
    which j appears while the point-counted trace stays the same;
    KN-TECH-061 already separates the isogeny class from the
    endomorphism ring inside it. Naming that second gap "the volcano
    surface versus the floor" is a recalled complex-multiplication
    reading and is not support; the checkable statement is that the two
    root sets differ and the absolute traces agree. A projection that
    kept every coefficient bit and named the order would be the identity
    on this tuple. IDEA-20260904-cc1b0d builds battery curves by CM and
    then measures a census ratio. IDEA-20260902-701458 defines a factor
    base by an auxiliary trace and states that no class polynomial is
    evaluated. IDEA-20260901-22428d uses class polynomials as the
    F_{p^2}-part of a supersingular detection polynomial. None of those
    is this tuple or this failure rate.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-061
      provenance: internal
      claim: >-
        Honda–Tate puts simple abelian varieties over a finite field, up
        to isogeny, in bijection with conjugacy classes of Weil numbers.
        Waterhouse refines endomorphism rings inside an isogeny class.
        Efficient construction of a curve with a prescribed Weil
        polynomial is stated to be a separate problem and not to move
        the discrete-log exponent.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/techniques/KN-TECH-061.md)
    - ref: KN-LIT-276
      provenance: internal
      claim: >-
        The corpus note relays Sutherland's abstract: the CM method
        builds E/F_q from a root of H_D modulo q, and a CRT decomposition
        of the ring class field can return a root without every
        coefficient, with a GRH space bound stated as O(|D|^{1/4} log q)
        in the balanced case. The note says the PDF was not independently
        verified. That space bound is not improved here.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/literature/KN-LIT-276.md only; PDF not opened)
    - ref: KN-LIT-986
      provenance: internal
      claim: >-
        The corpus note relays that the roots of the Hilbert class
        polynomial are the j-invariants of curves with CM by a given
        imaginary quadratic order, that this builds a curve with a
        prescribed number of points, and that coefficients are typically
        large. The note says the PDF was not independently verified.
        Those shrinkage factors are not tested here.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/literature/KN-LIT-986.md only; PDF not opened)
    - ref: KN-LIT-1009
      provenance: internal
      claim: >-
        The corpus note relays that for p inert in the imaginary
        quadratic field and p larger than |disc(O)|, the number of
        F_p-roots of H_O modulo p is either 0 or the order of Pic(O)[2].
        Used only as a pointer that an inert prime can still have
        F_p-roots. This record does not assert those roots are supersingular.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/literature/KN-LIT-1009.md only; PDF not opened)
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        In the generic group model a discrete log in a prime-order group
        of order p needs Omega(sqrt(p)) group operations, and Pollard rho
        meets that bound up to a constant.
      verified_by: idea-generator session 2026-10-05 (opened the KR row)
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: An automorphism group of order m multiplies expected rho iterations by 1/sqrt(m). The exponent stays 1/2.
      verified_by: idea-generator session 2026-10-05 (opened the KR row)
    - ref: KR-RHO-fbd7b1
      provenance: internal
      claim: >-
        Grumpy giants raises average-case generic success probability
        inside a square-root operation count, at square-root-sized
        memory. Exponent unchanged.
      verified_by: idea-generator session 2026-10-05 (opened the KR row)
    - ref: KN-TECH-005
      provenance: internal
      claim: >-
        Generic discrete log needs Omega(sqrt(p)) group operations. Rho
        matches that bound among generic algorithms. A sub-square-root
        algorithm has to use the representation.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/techniques/KN-TECH-005.md)
    - ref: KN-TECH-018
      provenance: internal
      claim: Automorphism-discounted rho is a constant-factor baseline calibration. It does not change the exponent 1/2.
      verified_by: idea-generator session 2026-10-05 (opened knowledge/techniques/KN-TECH-018.md)
    - ref: Deuring / Cox complex-multiplication root-to-trace correspondence
      provenance: recalled
      claim: >-
        Recalled and not opened: when 4p = t^2 - v^2 D, the F_p-roots of
        the class polynomial of the order of discriminant D are
        j-invariants of ordinary curves of trace plus or minus t with that
        endomorphism ring. The split-bin arm tests this on a toy window.
        It is not support for any attack.
      verified_by: null
    - ref: Hilbert class polynomial logarithmic height
      provenance: recalled
      claim: >-
        Recalled and not opened: the bit length of the largest
        coefficient of H_D grows on the order of sqrt(|D|), which is the
        precision a complex-analytic computation must carry. The ladder
        measures the bit length. The constant is not taken from an
        opened source.
      verified_by: null
  assumptions:
    - Ground truth for the trace is an independent point count of both the curve and its quadratic twist. The constructor's own label is not ground truth.
    - p > 3. The j-to-Weierstrass step skips j = 1728 in the generic denominator and records j = 0 and j = 1728 as their own rows.
    - The exact polynomial is the monic polynomial in Z[X] reproduced by two CRT runs whose prime sets are disjoint. One implementation is not ground truth.
    - Degree is checked against an independent class-number computation. A mismatch voids every trace cell from that polynomial.
    - Toy window only. Failure-locus primes at most 28 bits, class polynomials of degree at most 8 in the trace arms and at most 16 in the height regression, fundamental |D| at most 2000 in the regression. No cryptographic discriminant is claimed.
    - F4 is not evaluated. No pairing value, embedding degree, or MOV cost is an output of this test.
  predictions:
    - metric: abs(deg(H_D) - h(D))
      direction: lower
      minimum_effect: The difference is 0 on every fundamental discriminant in the ladder. One mismatch falsifies that the computed polynomial is the class polynomial.
    - metric: ordinary_trace_match_rate_split_bin
      direction: higher
      minimum_effect: Match rate 1.0 on at least 20 split cells with h(D) at most 8. A single certified mismatch falsifies the constructor on that cell.
    - metric: ordinary_norm_equation_pass_rate_inert_bin
      direction: lower
      minimum_effect: Pass rate 0 when (D/p) = -1 and p > |D|, including the vacuous case of no root.
    - metric: truncated_polynomial_trace_spoil_count
      direction: higher
      minimum_effect: At least one fundamental D with h(D) at least 3 where a half-bit truncation and a short CRT modulus each differ from exact H_D and spoil at least one split-bin trace verdict.
    - metric: hilbert_versus_ring_class_root_intersection
      direction: lower
      minimum_effect: At least one triple (fundamental D_K, conductor f = 2, prime p at most 2^20) where both polynomials have an F_p-root, the root sets are disjoint, and the absolute point-counted traces agree.
    - metric: construction_output_bits
      direction: higher
      minimum_effect: h(D) times the bit length of the largest coefficient. On fundamental discriminants with |D| at most 2000 and h(D) at most 16, Spearman correlation with sqrt(|D|) is at least 0.5.
  minimal_test:
    design: >-
      In a computer-algebra system with a class polynomial routine and a
      point counter, take fundamental discriminants through every
      fundamental D with h(D) at most 8 and |D| at most 2000, capped at
      degree 8 for the trace arms. Compute H_D twice by CRT with disjoint
      prime sets and require equality. Record degree, h(D), and
      construction_output_bits. Bin primes of 16, 20, 24, and 28 bits into
      split, inert, and ramified. Reduce the exact polynomial, build the
      curve and its twist, point-count both. Repeat with the half-bit
      truncation and the short CRT modulus. Conductor arm: the smallest
      computed fundamental D_K of class number 1, the order of conductor 2,
      both class polynomials, primes p at most 2^20 until both have an
      F_p-root or the prime bound is exhausted.
    controls:
      - Class-number-1 rows are the cheap control. A trace mismatch there is a pipeline bug rather than coefficient swell.
      - Null polynomial: a random monic polynomial in F_p[X] of the same degree. The exact class polynomial must beat its ordinary norm-equation pass rate.
      - Both twists are counted on every cell.
      - On at least five split cells, a second point counter must agree. Disagreement voids the cell as infrastructure.
      - j = 0 and j = 1728 are separate rows.
      - Ramified primes are logged and are not used to pass or fail the four pre-registered rates.
    required_metrics:
      - abs(deg(H_D) - h(D))
      - ordinary_trace_match_rate_split_bin
      - ordinary_norm_equation_pass_rate_inert_bin
      - truncated_polynomial_trace_spoil_count
      - hilbert_versus_ring_class_root_intersection
      - construction_output_bits
      - null_polynomial_pass_rate
  falsification_conditions:
    - One split cell with a certified point count where neither twist has trace plus or minus t falsifies the split-bin prediction on the tested window.
    - One inert-bin F_p-root whose point-counted trace satisfies the norm equation for that D falsifies the inert failure mode.
    - If every half-bit truncation and every short-CRT polynomial with h(D) at most 8 agrees with exact H_D, or disagrees but never changes a split-bin trace verdict, the precision failure mode is not established inside this degree cap.
    - If every conductor-f=2 prime found up to 2^20 has intersecting root sets, or the root sets are disjoint but the absolute traces differ, the same-trace different-j-set prediction is false in that bound.
    - Spearman correlation of construction_output_bits with sqrt(|D|) at most 0 on the regression sample falsifies the cost shape inside |D| at most 2000.
    - A timeout or a crash is infrastructure. It does not falsify the norm-equation predictions.
  confounders:
    - Checking one Weierstrass model and not its twist turns a correct plus-or-minus t pair into an apparent wrong trace.
    - Trace 0 meets a naive equality for reasons that need not be the prescribed order. The pass predicate is the norm equation, and prescribed t = 0 is excluded from the ordinary success rows.
    - j = 0 and j = 1728 carry extra automorphisms. Mixing them into the generic Spearman sample can fake a slope.
    - A shared bug in two CRT implementations can make them agree on a polynomial that is not H_D. The independent class-number check and the null polynomial are the guards.
    - p in {2, 3} is out of the bins.
    - Disjoint j-sets plus equal absolute trace do not by themselves output a conductor integer.
  interpretation_limits:
    - The window is toy. No transfer to cryptographic |D| or to cryptographic p is claimed.
    - A split-bin match rate of 1 certifies the constructor inside the sampled cells. It does not answer embedding degree and it does not build a trapdoor.
    - Weber shrinkage factors relayed by KN-LIT-986 are not measured.
    - KN-LIT-276's relayed GRH space bound for computing a root without the coefficients is a different cost. This test writes the polynomial down on purpose.
    - The inert arm does not claim the roots are supersingular.
    - Nothing here changes Pollard rho, grumpy giants, or the automorphism discount.
  heuristic_assumptions:
    - id: HEUR-CM-SPLIT-1
      statement: >-
        If 4p = t^2 - v^2 D for integers t, v and a prime p not dividing
        D, then every F_p-root of the exact class polynomial of
        discriminant D gives a twist pair of traces {t, -t}. The inert
        counterpart is the same statement with the hypothesis removed.
      rigorous_support: >-
        No opened file proves the correspondence. KN-TECH-061 gives the
        Weil-polynomial side and withholds the construction. The
        Deuring/Cox form is recalled and is the statement under test.
      validation_plan: >-
        At least 20 split pairs and every inert root in the same
        discriminant ladder, h(D) at most 8, p at most 2^28, both twists
        counted, five split cells repeated with a second point counter.
        No extrapolation past that range.
    - id: HEUR-CM-HEIGHT-1
      statement: >-
        For fundamental D, the bit length of the largest coefficient of
        H_D divided by sqrt(|D|) stays inside a factor-of-two band between
        the lower and upper quartiles of |D| on the regression sample.
        Degree is measured from h(D), not extrapolated.
      rigorous_support: None opened. KN-LIT-986 relays that the coefficients are typically large and does not give a height formula. The trace-match predictions do not use this heuristic.
      validation_plan: >-
        Exact H_D for every fundamental discriminant with |D| at most 2000
        and h(D) at most 16. Pre-register slope greater than 0 and a
        quartile ratio of bit length over sqrt(|D|) at most 2. The sample
        stops at |D| = 2000.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: >-
      Unchanged from the walk that is actually used. This record selects
      neither distinguished-point rho nor grumpy giants.
    best_known: >-
      Pollard rho meets the generic-group lower bound of Omega(sqrt(p))
      group operations up to a constant (KR-RHO-13bf67, KN-TECH-005).
      The constructor's own cost is a different quantity: h(D) times the
      largest-coefficient bit length of H_O, paid before any walk.
    hidden_overhead: None inside the discrete-log exponent. The coefficient bit length is construction_output_bits and is not an o(1) term of rho.
    tradeoff_note: No time-memory tradeoff is claimed for the discrete log. Paying the class-polynomial cost does not shorten the later walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-0528e7
      - KR-RHO-fbd7b1
    nearest:
      - ref: KN-TECH-061
        provenance: internal
        relation: adjacent
        delta: >-
          KN-TECH-061 gives the isogeny class from the Weil polynomial
          and leaves construction uncosted. This record's minimum effects
          are a split-bin match rate of 1, an inert-bin pass rate of 0,
          and at least one truncated polynomial that changes a trace verdict.
      - ref: KN-LIT-276
        provenance: internal
        relation: adjacent
        delta: >-
          The note relays a GRH space bound for computing one root without
          the coefficients. This record does not lower it. The new numbers
          are the inert pass rate (target 0) and the Hilbert-versus-ring-class
          root intersection (target 0).
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: Time-exponent delta is 0. The walk stays Omega(sqrt(p)) group operations.
  dominated_by: >-
    n/a (no attack result claimed). Baselines opened and not improved:
    Pollard rho at about p^{1/2} group operations (KR-RHO-13bf67,
    KN-TECH-005), grumpy giants inside the same square-root count
    (KR-RHO-fbd7b1), the automorphism factor with exponent still 1/2
    (KR-RHO-0528e7, KN-TECH-018), and Honda-Tate with construction left
    uncosted (KN-TECH-061). IDEA-20260904-cc1b0d, IDEA-20260902-701458,
    and IDEA-20260901-22428d were opened and do not measure this failure rate.
  sota_delta: >-
    Not an attack claim. Discrete-log time-exponent delta versus Pollard
    rho is 0 (stays about p^{1/2} group operations). The constructor's
    separate cost, which is not an ECDLP exponent, is h(D) times the
    largest-coefficient bit length.
