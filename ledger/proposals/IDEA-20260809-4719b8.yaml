idea:
  id: IDEA-20260809-4719b8
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    A commitment test harness: point it at an AEAD implementation and it returns
    a certificate or a derivation, not an opinion
  class: tooling
  claim: >-
    The commitment properties studied here are decidable for a large class of
    constructions by a mechanical procedure: identify the authenticator's algebra,
    set up the collision conditions, attempt a solve, and either emit a
    certificate or report the structural reason the system is unsatisfiable. The
    claim is that this procedure can be packaged as a harness with a declared
    interface, that it covers the constructions implemented in this goal, and that
    its output is always one of {certificate, derivation of infeasibility, out of
    scope} — never a bare "no problem found".
  mechanism: >-
    The harness takes an implementation plus a declaration of its authenticator
    structure, constructs the constraint system, and dispatches to a solver. The
    three-valued output is enforced by construction: absence of a certificate must
    be accompanied by either a derivation or an explicit out-of-scope marker.
  why_not_a_renamed_known_approach: >-
    Cryptographic test harnesses generally check conformance against vectors.
    This one checks a SECURITY PROPERTY and is constrained to never report a
    silent pass, which is the design decision that makes its output admissible as
    evidence under this program's rules.
  predictions:
  - observable: harness output on the constructions implemented in this goal
    metric: one of three values per construction
    predicted: Certificates for the fielded AEADs, derivations for the repairs, no bare passes anywhere.
  - observable: agreement with manually produced certificates
    metric: exact match on the objects produced in IDEA-20260809-313546 and 3a39bc
    predicted: Agreement; disagreement indicates a harness bug and blocks its use.
  minimal_test: >-
    Run the harness over every construction in the goal and compare its outputs
    against the manually produced certificates and derivations.
  controls:
  - 'REGRESSION CONTROL: manually produced certificates form a fixture set the harness must reproduce on every run.'
  - 'OUT-OF-SCOPE HONESTY: a construction whose algebra the harness cannot express must be marked out of scope rather than passed, and the run package includes the list.'
  falsification_conditions:
  - The harness reports a pass where a manual certificate exists.
  - The three-valued output cannot be maintained without a catch-all, in which case the harness is not admissible as evidence and is recorded as tooling only.
  interpretation_limits: >-
    A derivation of infeasibility is relative to the declared constraint system,
    not a proof of commitment. The harness's scope is exactly the constructions
    whose algebra it can express.
  sota_delta: 'No attack. Delta: reusable, honest-by-construction tooling for a property that is currently assessed by reading.'
  dominated_by: Downstream of the certificate records; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for property-checking harness: no records for AEAD commitment. WEB NOT CHECKED.'
