idea:
  id: IDEA-20260808-bba3dc
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-CRYPTO-001
  title: 'Torsion-rationality budget for the higher-dimensional isogeny toolbox on ordinary
    prime-field curves: Kani / Clapoti / PEGASIS need an M-torsion basis, and for ordinary
    E/F_p that basis lives in an extension of degree ~ord(pi mod M), which is the exact, nameable
    obstruction — and the only place a family could escape it is measurable.'
  class: mechanism
  claim: 'The 2022-2026 higher-dimensional isogeny toolbox (Kani''s lemma, the SIDH-attack
    machinery, Clapoti, and PEGASIS which the corpus records as running the class-group action
    in polynomial time with a Frobenius orientation, KN-LIT-1449) is entirely absent from
    this programme''s ECDLP lane: every Kani record sits in the supersingular lane (H-ALISO-*,
    KN-TECH-026). The claim has two halves. (A) OBSTRUCTION, stated as a theorem to be checked:
    for ordinary E/F_p with Frobenius pi satisfying pi^2 - t pi + p = 0, the full M-torsion
    E[M] is rational over F_{p^k} with k = ord of pi in (O/M O)^*, which for generic M is
    of size ~M, so any construction requiring an M-torsion basis with M > deg costs field
    arithmetic of size p^{Theta(M)}. Since every Kani-style representation needs M exceeding
    the degree of the isogeny being represented, and the ECDLP''s natural endomorphism [k]
    has degree k^2 ~ p^2, the toolbox is blocked by an exponential torsion-rationality cost,
    NOT by the quaternion obstruction of KN-FIND-7e4b90 (which is about a 4-dimensional endomorphism
    algebra and is a different blocker). Recording the correct blocker matters because it
    names a different escape. (B) ESCAPE CONDITION, the part that is open and cheap to test:
    the cost is small exactly when pi has small multiplicative order modulo M. That is a computable
    condition on (t, p, M). The claim is that the set of (curve, level) pairs with k = ord(pi
    mod M) below any fixed polynomial bound has density zero but is nonempty and enumerable,
    and that enumerating it decides whether any ordinary prime-field family admits the toolbox
    at all.'
  mechanism: Kani's lemma builds an (M,M)-isogeny of abelian surfaces from an isogeny diamond,
    and the SIDH-attack machinery evaluates an unknown isogeny from its action on an M-torsion
    BASIS with M > degree. Supersingular curves over F_{p^2} have all (p^2-1)-torsion rational,
    which is why the toolbox is practical there; supersingular curves over F_p oriented by
    Frobenius (the PEGASIS setting) have all (p+1)-torsion rational. Ordinary curves over
    F_p have only the eigenvalue-1 part of E[M] rational, so the second basis vector requires
    the splitting field of the other Frobenius eigenvalue. The relevant quantity is exactly
    ord(pi mod M), and the whole applicability question reduces to it.
  why_not_a_renamed_known_approach: 'Not KN-FIND-7e4b90: that blocks the transport of Wesolowski''s
    minimal-degree bound because ordinary End is rank 2, not rank 4. This record concerns
    a different toolbox with a different requirement (torsion rationality, not a quaternion
    algebra) and therefore a different escape condition; conflating them would leave a live
    question closed by the wrong reason. Not the MOV/embedding-degree line (KN-TECH-032, RQ-PAIR-21313f):
    the embedding degree is ord(p mod N) for the single prime N, whereas the quantity here
    is ord(pi mod M) in the quadratic order, over levels M we are free to choose — a different
    object with a different search space.'
  predictions:
  - observable: extension degree needed for a full M-torsion basis
    metric: k(M) = ord(pi mod M) for random ordinary toy curves, M over the first 200 primes
    predicted: k(M) is of size M/gcd-type factors for almost all M; the fraction of M with
      k(M) <= (log p)^2 is below 1% at every tested curve
  - observable: existence of curves with many small-order levels
    metric: 'max over toy curves of #{M <= X : k(M) <= (log p)^2}'
    predicted: O(1) and not growing with X; if it grows, a special family exists and the toolbox
      becomes applicable for it, which would be a genuinely new attack surface
  - observable: whether PEGASIS-style class-group evaluation applies at all for ordinary F_p
    metric: a written applicability check against KN-LIT-1449's stated hypotheses
    predicted: applicable only where the required torsion is rational, i.e. the same condition;
      the polynomial-time claim does not transfer for free
  minimal_test: 'Pure computation on curve data, no isogenies: for 10^3 random ordinary curves
    over toy primes p in [2^20, 2^40], compute t, D = t^2 - 4p, and for each prime M <= 500
    compute ord(pi mod M) in the order Z[pi]/M. Report the distribution of k(M) and the count
    of (curve, M) pairs with k(M) <= (log p)^2. This is minutes of CPU and decides (B).'
  controls:
  - 'Supersingular arm over F_p with pi^2 = -p as a positive control: k(M) must come out small
    in the regimes where PEGASIS is reported to work, or the instrument is wrong.'
  - 'Random-integer null: replace pi by a random element of the same order ring and confirm
    the k(M) distribution is indistinguishable, i.e. the ordinary case has no hidden structure
    making it easier.'
  confounders:
  - k(M) small for M in a set of primes does not give a small extension for the PRODUCT M,
    since the required degree is the lcm; the aggregation must be done in lcm, not per prime.
  - Curves with small |D_0| (CM by a small discriminant) may behave atypically and must be
    reported separately rather than pooled.
  falsification_conditions:
  - A nonempty, enumerable family of ordinary prime-field curves with polynomially bounded
    lcm-torsion degree at a useful level => the obstruction has an escape and the toolbox
    must be costed properly for that family (a positive, and surprising, outcome).
  - k(M) distribution matches the random-element null everywhere => the obstruction is generic
    and the family is closed with a named, measured obstruction plus the forward guidance
    that only supersingular-over-F_p and oriented settings retain the toolbox.
  interpretation_limits: This decides APPLICABILITY of the toolbox, not whether the toolbox
    would help the ECDLP even if applicable. Even with free M-torsion, no reduction from ECDLP
    to an isogeny representation problem is claimed here; that is a separate and unsolved
    step, and this record should not be read as asserting one.
  assumptions:
  - End_{F_p}(E) = O an imaginary quadratic order containing Z[pi]; E ordinary.
  - 'KN-LIT-1449''s reported claims are relayed and are marked "confidence: reported" in the
    corpus itself; they are used as a pointer, not as a verified theorem.'
  heuristic_assumptions:
  - id: HA-1
    statement: For a fixed ordinary curve, ord(pi mod M) behaves like the order of a random
      element of (O/M O)^*, so P(ord <= y) ~ y^2/|(O/MO)^*| for y small.
    rigorous_ingredient: pi generates an order in O and its reduction lies in (O/MO)^*; the
      group order is exactly computable from the splitting behaviour of M in O.
    distribution_imitated: The classical distribution of multiplicative orders of random residues
      (Erdos-Pomerance-type statistics for ord of a fixed element mod varying modulus).
    validation_route: Direct computation on 10^3 curves x 200 levels as above; compare the
      empirical P(ord <= y) against the random-element prediction. Label toy but note that
      this statistic is field-size-insensitive and extrapolates better than cost statistics.
    tail_checks: The smallest observed ord over the whole sweep must be consistent with the
      predicted minimum over the number of trials; an outlier is exactly the escape family
      sought.
  target_complexity:
    time_exponent: No exponent claimed. If the escape family were nonempty and a reduction
      existed, the toolbox evaluates isogenies in polynomial time, so the exponent would be
      set by the surrounding search and not by the isogeny evaluation; that surrounding search
      is unspecified and this record does not supply it.
    memory_exponent: '"n/a for the measurement; the toolbox itself is polynomial-space."'
    best_known_baseline: '"rho N^{1/2}; and for the isogeny-side comparison, KN-TECH-050 memory-charged
      path-finding."'
    hidden_overhead_disclosure: The field-extension cost p^{Theta(k)} is the entire content;
      any record that quotes 'polynomial time' for higher-dimensional isogenies without charging
      k is wrong for ordinary prime-field curves.
    time_memory_tradeoff: '"n/a."'
  sota_delta: Zero as an attack. The delta is that the ECDLP lane currently has no record
    of the 2022-2026 higher-dimensional toolbox at all, and this puts a correctly-costed applicability
    boundary in the corpus, distinguishing it from the quaternion blocker it would otherwise
    be silently merged with.
  dominated_by: n/a (no algorithm claimed). For the applicability question there is no competing
    instrument in the corpus.
  estimated_cost: '"Implementation low (order computations in a quadratic order); compute
    low (minutes)."'
  recommended_priority: medium
  honest_prior_of_survival: ~0.9 that the obstruction is confirmed as stated. ~0.03 that a
    useful escape family exists. The value is almost entirely in recording the right blocker
    with the right escape condition, per the inventor-protocol closure standard.
