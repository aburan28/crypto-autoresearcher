  minimal_test:
    design: |-
      Paired fixed-budget comparison, ABBA order, one solver thread, frozen targets (planted with phases, planted phase-0, uniform), per-attempt CPU budget fixed in advance; every failed search, timeout and build charged; every relation checked on the curve and as sum coeff_j log V_j = log R mod r with +-lambda^k coefficients. Cumulative rank against cumulative seconds. n=13 first, n=19 if budget remains. Ladder m in {51, 53, 83, 131} is requirement-only (circuit sizes, timeouts), never a projection; m=51 is composite, not comparable to prime-degree cells.
    controls:
    - representatives-only encoding on the same targets
    - uniform odd-subgroup targets
    - brute-force decomposability of every UNSAT
    required_metrics:
    - wall and CPU seconds per newly independent relation
    - verified relations per attempt
    - timeouts, rejected tuples
    - rank ceiling (#reps) stated in advance
