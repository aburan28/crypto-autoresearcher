  title: Phase-aware Frobenius summation - paired fixed-budget seconds per independent verified relation, phase unknown inside the decomposition system versus representatives only
  class: representation
  claim: |-
    On identical frozen targets of toy Koblitz cells (E0: y^2+xy=x^3+1 over F_{2^n}, n in {13, 19}, odd prime-order subgroup, base = signed-Frobenius orbit representatives of a seeded subspace of ker Tr), a decomposition system carrying each summand's Frobenius phase as a solver unknown (x_i = v_i^(2^k_i), relation coefficient +-lambda^k_i mod r) spends fewer wall AND CPU seconds per newly independent verified relation than the representatives-only system, every attempt, failed search, circuit build, lifting and verification charged to its arm. H0: equal or higher.
  mechanism: |-
    OBJECT FRAME. R1 (x-coordinates); orbit-quotient base, one column per signed Frobenius orbit. Sigma = <pi, -1> on the base (pi^2+pi+2=0, pi = scalar lambda on the order-r subgroup) plus translation by base elements. Class I partial-action (IDEA-20260806-c5d183). The quotient forgets phase and sign (a block system of <Sigma>, IDEA-20260901-863e36): lossy at the column index, recovered exactly in the Z/r coefficient. Phase-aware: every summand may sit at any of n phases, so matrix width stays #reps while the effective base is n times wider. Priced number: per-attempt circuit and solve cost of one-hot phases. Stage: decomposition. Off-limits lens F6 is a component; added: phase as a solver unknown with exact lambda^k bookkeeping, timed against the phase-blind system on shared targets.
