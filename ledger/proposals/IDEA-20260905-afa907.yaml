idea:
  id: IDEA-20260905-afa907
  title: Approximate public quotients through a defect of lumpability
  class: mechanism
  claim: 'For a fixed public feature map v on a prime-order group, the total-variation defect of its transition
    kernels can bound the error of a feature-only simulator over a finite transcript. Conjecture: an efficiently
    represented, genuinely lossy coordinate feature can have a smaller defect than matched random balanced partitions
    for a restricted operation set, while its defect rises when independent translations are added.'
  mechanism: Track the conditional distribution of the next feature given the current feature, rather than demand
    exact deterministic propagation. Two representatives of one fiber define competing transition laws; their maximal
    total-variation distance is delta. A coupling argument would give transcript error at most t*delta only if the
    bound holds conditionally on every allowed history. This converts the obstruction to exact prime-order quotients
    into an approximate-intertwining question. The missing object is a compact history-stable kernel, not a hidden
    scalar predictor. An apparent average-case kernel can fail after one conditioned transition.
