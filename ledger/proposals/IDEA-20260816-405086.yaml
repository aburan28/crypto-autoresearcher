idea:
  id: IDEA-20260816-405086
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Replace the raw coverage ratio with a scale-free currency - the fraction of the exact combinatorial
    ceiling a geometry actually attains - and run the growth arm on THAT, asking whether any constructible
    geometry's attainment fraction rises with group size rather than merely its ratio against a random
    base
  class: measurement
  claim: '(A) WHY THE RAW RATIO IS THE WRONG CURRENCY FOR A GROWTH QUESTION. This program''s central
    factor-base question asks whether any structured geometry''s advantage GROWS with group size,
    and it was answered on the yield channel, where the counting identity forces the mean and the
    ratio is pinned at exactly 1.000000 for every base of a given size. The surviving channel is coverage,
    and there the raw ratio against a matched random base moves with N for a reason having nothing
    to do with geometry: a random base''s coverage itself depends on N through the mean, so the denominator
    is a moving target and the ratio conflates geometry with the regime the mean happens to sit in.
    (B) THE CURRENCY. Coverage obeys an exact upper bound: it cannot exceed the smaller of 1 and the
    mean multiset count per target. Define the ATTAINMENT FRACTION as measured coverage divided by
    that exact ceiling. A random base attains a computable fraction below 1, given approximately by
    one minus the exponential of minus the mean, all over the ceiling - a closed form with no free
    parameters. A ceiling-attaining construction attains exactly 1. Every geometry therefore has a
    position in the interval between those two, and that position is scale-free in the sense that
    both endpoints are known in closed form at every N. (C) THE CLAIM. The claim is that attainment
    fraction, not raw ratio, is the quantity on which the growth question should be posed, and that
    posing it there changes the answer''s meaning: a geometry whose raw ratio is flat can have a rising
    attainment fraction if the random baseline is falling faster, and a geometry whose raw ratio rises
    can be attaining a shrinking share of an expanding ceiling. The measurable claim is that at least
    one constructible geometry shows an attainment fraction whose slope against the logarithm of N
    has an interval excluding zero, in either direction - and that a negative slope is as reportable
    as a positive one, because it is a measured obstruction stated in a currency that composes across
    sizes. (D) WHAT IS NOT CLAIMED. No attack, no break, no speedup, no security consequence. It is
    NOT claimed that a rising attainment fraction would constitute an exponent-relevant advantage;
    coverage is not relation yield and attainment is not cost, and the contract''s ceiling says so
    explicitly. It is NOT claimed that any previously recorded growth verdict is wrong - those were
    posed on the yield channel where the mean is forced, and re-posing a question in a new currency
    does not overturn an answer to the old one. It is NOT claimed that the ceiling is attainable by
    any base whose membership can be decided without a discrete logarithm.'
  mechanism: 'STAGE 1. Derive and freeze the exact ceiling and the closed-form random-base attainment
    at each tested size, before any measurement, so both endpoints of the currency are fixed independently
    of the run. STAGE 2. Build a panel of geometries at matched realised size across a ladder of group
    sizes spanning at least four points, including at least three x-line-defined constructible geometries,
    one exponent-side ceiling-attaining construction as the upper anchor, and the matched random base
    as the lower anchor. STAGE 3. Measure exact coverage over the complete target space for every
    geometry at every size, with the closed-form total check and the matched null drawn in the same
    invocation. STAGE 4. Convert every coverage to an attainment fraction by dividing by the frozen
    exact ceiling, and verify the two anchors: the random base must land on its closed-form attainment
    within its interval, and the ceiling-attaining construction must land at 1.000 within its interval.
    If either anchor misses, the currency is not calibrated and nothing else can be read. STAGE 5.
    Fit attainment fraction against the logarithm of N per geometry and report the slope with its
    interval, under a family-wise correction across the panel. STAGE 6. Refutation route. If every
    constructible geometry''s slope interval contains zero, the growth question is answered negatively
    on the attainment channel over the tested panel and range, which is a measured obstruction with
    a number attached rather than a verdict. If a slope excludes zero, the contract reports it and
    stops, since converting a coverage trend into any statement about cost would exceed the claim
    ceiling by a wide margin.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FBG-001 and H-FBG-001 in full, noting that the growth clause is stated on yield
      ratio and that H-FBG-001 records the family as rejected_scoped on it. Read EV-FBG-001 in full,
      noting the exact identity that sum over targets of multiset counts equals binomial(B+m-1, m),
      the corollary coverage at most min(1, mean) confirmed over 336 cells with 0 violations, the
      greedy_optimized negative slope of minus 1.18 times ten to the minus three, and the red-team
      objection reporting a Bose-Chowla base attaining coverage equal to min(1, mean) exactly with
      a headroom ceiling of plus 54 percent. Greps over ledger/proposals and ledger/hypotheses for
      'ceiling', 'attainment', 'headroom', 'growth', 'coverage'.
    results: 'The exact ceiling is already established in this program: EV-FBG-001 records the corollary
      coverage at most min(1, mean) as a pre-registered analytic consequence confirmed against measurement
      over 336 cells with zero violations, and the red-team objection explicitly frames a headroom
      of plus 54 percent against it. So the ceiling exists as a bound and as a headroom figure. What
      I did not find is any record that normalises measured coverage BY that ceiling to form a scale-free
      fraction, or that runs the growth arm on the normalised quantity. The recorded growth analyses
      - including the greedy slope of minus 1.18 times ten to the minus three - are run on raw ratios.
      EXP-RELN-0a979f derives ceilings and floors for the deficit at m equal to 2 and 3 but grades
      arms by additive energy rather than normalising a growth arm.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; normalising a measurement
      by its combinatorial bound is ordinary practice and no publication claim is made. What is claimed
      new here is the specific move of re-posing this bucket''s growth question in the attainment
      currency, with both endpoints of the currency fixed in closed form before the run and used as
      calibration anchors. Assembled from known parts: the exact ceiling and its confirmation over
      336 cells, already recorded; the ceiling-attaining construction and its headroom figure, already
      recorded; the exact counting pipeline and matched null from the frozen battery; the growth-arm
      discipline from the question itself.'
  object_first_candidate:
    tracked_object: THE ATTAINMENT FRACTION - measured coverage divided by the exact combinatorial
      ceiling min(1, mean) - carried across a ladder of group sizes as a single number per geometry
      per size, bracketed by two closed-form anchors.
    lossiness: Lossy. The fraction discards the count vector, which targets were hit, the base elements,
      the curve and the field, and even the absolute coverage, retaining only a position between two
      computable endpoints. That is discarded compatibly with the target operation - increasing the
      group size while holding the base size at the same functional relation to it - because both
      endpoints are known in closed form at every size, so the retained position means the same thing
      at every rung of the ladder in a way the raw ratio does not. Many distinct configurations share
      an attainment fraction. What the projection genuinely loses is the distinction between attaining
      a large ceiling poorly and a small ceiling well, and the contract keeps the ceiling itself as
      a reported covariate precisely so that a reader can undo the normalisation.
    propagation: 'One step of the target operation - moving up one rung of the size ladder while rescaling
      the base size by the same rule - acts on the retained object by moving both endpoints deterministically:
      the ceiling moves as min(1, binomial(B+m-1, m) over N), computable exactly, and the random anchor
      moves as one minus the exponential of minus the mean, over that ceiling. The geometry''s own
      fraction moves by whatever the measurement says. So the propagation of the two anchors is exact
      and known in advance, and the entire empirical content is the propagation of the third number
      relative to them - which is exactly the structure that makes a growth question answerable rather
      than confounded.'
    survival_score: 'The currency is informative while the ceiling is strictly below 1, that is while
      the mean multiset count per target is below 1, since above that the ceiling saturates at 1 and
      every geometry''s attainment collapses toward its raw coverage. At the frozen battery''s convention
      B equal to ceiling of (6N) to the one-third power the mean sits near 1 by design, so the currency
      is informative only in a band around that convention and the contract must sweep the base-size
      rule to locate the band. Concretely: informative across the four-point size ladder provided
      the mean stays within roughly a factor of 3 of 1, and dissolving into the raw coverage outside
      that band.'
  null_object_control: 'Two anchors serve as the mandatory controls and both are closed-form, which
    is what makes this currency auditable. LOWER ANCHOR: the matched random base of identical realised
    size, drawn in the same invocation, whose attainment fraction must match one minus the exponential
    of minus the mean, all divided by the ceiling, within its interval at every size. UPPER ANCHOR:
    a ceiling-attaining construction, whose attainment fraction must be 1.000 within its interval
    at every size. For any geometry''s attainment to mean anything, BOTH anchors must land on their
    predicted values; a run in which the random base misses its closed form has a miscalibrated denominator
    and every fraction in it is wrong, and a run in which the ceiling-attaining construction fails
    to reach 1 has either a broken construction or a wrong ceiling. A third control is required: a
    deliberately degenerate base concentrated in a small subgroup coset, whose attainment must be
    far below the random anchor; an apparatus that cannot see that has no dynamic range.'
  discriminated_from:
  - 'H-FBG-001 and EV-FBG-001: the growth arm there is posed on yield ratio, which the counting identity
    forces to exactly 1.000000, and on raw coverage ratio against a moving denominator. This contract
    re-poses growth on a normalised fraction with two closed-form anchors and does not re-run or revisit
    those cells.'
  - 'EXP-RELN-0a979f: derives ceilings and floors for the collision deficit and grades arms by additive
    energy at fixed parameters. This contract grades nothing by energy, uses the ceiling as a normaliser
    rather than as a bound to be tested, and its independent variable is group size.'
  - 'The planted-structure detection-floor calibration and the three-null sensitivity audit in this
    same bucket: those measure properties of the apparatus at fixed size. This measures a geometry
    property across sizes and would consume their outputs rather than duplicate them.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases at matched size with no growth arm and no
    normalisation.'
  - 'IDEA-20260807-e57607: derives which factor of an index-calculus cost expression can move an exponent.
    That is a cost-expression argument about solving degree; this is a measured coverage normalisation
    and makes no cost claim at all.'
  assumptions:
  - The exact ceiling coverage at most min(1, mean) holds, which this program has already confirmed
    over 336 cells with zero violations and which is re-checked per cell here.
  - A ceiling-attaining construction exists at every tested size to serve as the upper anchor; if
    it cannot be built at a size, that rung has no upper anchor and its fractions are reported as
    unbracketed.
  - The closed-form random attainment is accurate enough at these sizes to serve as a calibration
    target; deviations are reported rather than absorbed.
  - Base size scales with group size under a single declared rule across the whole ladder, since changing
    the rule mid-ladder would change the currency's meaning between rungs.
  predictions:
  - metric: matched random base's attainment fraction against its closed-form prediction
    direction: different
    minimum_effect: 'forced value: agreement within the interval half-width at every size; a miss
      means the denominator is miscalibrated and voids every fraction in the run'
  - metric: ceiling-attaining construction's attainment fraction
    direction: different
    minimum_effect: 'forced value: 1.000 within the interval half-width at every size'
  - metric: degenerate small-coset base's attainment fraction relative to the random anchor
    direction: lower
    minimum_effect: 0.5
  - metric: slope of attainment fraction against the logarithm of N, for the best constructible x-line
      geometry
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a sign or magnitude: the whole point of re-posing
      the growth question in this currency is that I do not know which way it moves once the moving
      denominator is removed, and pre-committing would prejudge exactly the quantity being measured;
      the slope is reported with its interval under a family-wise correction'
  minimal_test:
    design: 'Four sizes, five bases, one invocation per size. Declare the base-size rule and freeze
      the closed-form ceiling and random-attainment predictions for N near 2^12, 2^14, 2^16 and 2^18
      before any run. At each size build five bases at matched realised size: three constructible
      x-line geometries, one exponent-side ceiling-attaining construction as the upper anchor, and
      the matched random base as the lower anchor, plus the degenerate small-coset control. Measure
      exact coverage over the complete target space for all of them, check the closed-form total per
      cell, and convert to attainment fractions. First verify both anchors at every size; if either
      misses, stop. Then fit each constructible geometry''s attainment against the logarithm of N
      and report the slope with its interval under a family-wise correction across the panel. The
      discriminating output is one plot: attainment against the logarithm of N, five lines, two of
      them anchors whose positions were predicted before the run. Cost is dominated by the 2^18 exact
      count.'
    controls:
    - Matched random base as the lower anchor with a closed-form predicted attainment, drawn in the
      same invocation at every size.
    - Ceiling-attaining construction as the upper anchor, which must reach 1.000.
    - Degenerate small-subgroup-coset base, which must fall far below the random anchor, establishing
      dynamic range.
    - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
    - 'Ceiling re-check per cell: measured coverage must not exceed min(1, mean), reproducing the
      zero-violation record.'
    - Permutation-null band on base labellings at each size, and a family-wise correction across the
      panel.
    required_metrics:
    - exact coverage per base per size
    - exact ceiling min(1, mean) per cell
    - attainment fraction per base per size with bootstrap interval
    - 'anchor residuals: random against closed form, ceiling-attaining against 1.000'
    - fitted slope of attainment against the logarithm of N per geometry, with interval and family-wise
      correction
    - mean multiset count per target per cell, to locate the informative band
    - closed-form total residual and ceiling-violation count per cell, both of which must be zero
  falsification_conditions:
  - 'The matched random base''s attainment misses its closed-form prediction at any size: the denominator
    is miscalibrated.'
  - 'The ceiling-attaining construction fails to reach 1.000 at any size: the upper anchor or the
    ceiling is wrong.'
  - 'Any measured coverage exceeds min(1, mean): the ceiling identity fails and the whole currency
    is void.'
  - 'The degenerate small-coset control does not fall well below the random anchor: the apparatus
    lacks dynamic range.'
  - 'Every constructible geometry''s slope interval contains zero after correction: the growth question
    is answered negatively on the attainment channel over the tested panel and range, which is the
    expected and reportable outcome.'
  - The mean multiset count leaves the informative band at one or more rungs, making the currency
    degenerate there and the slope uninterpretable across the full ladder.
  confounders:
  - The base-size rule couples B to N, so a slope in attainment reflects the joint movement of both
    and not geometry alone; the contract holds one declared rule across the ladder and reports the
    mean per cell so a reader can see where the ceiling saturates.
  - Ceiling saturation at mean above 1 collapses the currency into raw coverage, silently at first.
  - Negation closure changes effective size and therefore both the mean and the ceiling; effective
    size must be used throughout and is easy to get wrong.
  - Only four rungs, so a fitted slope has wide intervals and a family-wise correction across a panel
    widens them further.
  - The ceiling-attaining upper anchor is exponent-side and has known discrete logarithms, so it anchors
    the scale without being a comparable geometry, which must be stated wherever the plot is reproduced.
  interpretation_limits:
  - A rising attainment fraction is not an exponent-relevant advantage and is not a cost statement;
    coverage is not relation yield and the contract makes no bridge between them.
  - Re-posing the growth question in a new currency does not overturn any answer given in the old
    one; the yield-channel verdict stands on its own terms and is not revisited.
  - Toy sizes and four rungs; slopes are fitted trends with intervals, not asymptotic rates.
  - The upper anchor is not a usable factor base and its attainment of 1.000 supports nothing operational.
  target_complexity:
    time_exponent: No attack exponent is claimed, and specifically no exponent-relevance is claimed
      for any measured slope. The measurement costs one exact coverage computation per base per size,
      order N times B squared at arity 3, with the largest rung dominating.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N at the largest rung plus a discrete-logarithm table where the upper anchor needs one, both
      linear in N.
    best_known: The incumbent is the raw coverage ratio against a matched random base, as used throughout
      this bucket, with recorded values of 1.0012, 1.0269 and 1.1071 and a recorded greedy slope of
      minus 1.18 times ten to the minus three. The incumbent bound is the exact ceiling coverage at
      most min(1, mean), already confirmed in this program over 336 cells with zero violations, and
      the recorded headroom of plus 54 percent against it. There is no incumbent attainment-normalised
      growth measurement in this repository.
    hidden_overhead: 'The lower-order terms hide the ceiling''s own dependence on the base-size rule:
      attainment is scale-free only relative to a fixed rule coupling B to N, and changing that rule
      silently changes what the currency measures - a fact that will be omitted every time the plot
      is reproduced without its caption. A second hidden cost is that the upper anchor requires a
      discrete-logarithm table, so the scale is calibrated by an object that cannot exist at any interesting
      size. The human overhead is the family-wise correction bookkeeping across a panel and a ladder,
      which is where the frozen battery''s own validation found an undocumented aggregation rule.'
  dominated_by: 'n/a (no result claimed) on attack axes; the contract produces no algorithm and no
    attack cost point, so no attack frontier row is displaced, and I checked the rows this repository
    records including the generic square-root baseline of KN-OPEN-001 and the m equal to 3 index-calculus
    cost expression of IDEA-20260807-e57607. On the coverage frontier the check is real: the ceiling-attaining
    construction dominates every constructible geometry on attainment by definition, reaching 1.000
    where an x-line geometry is expected near the random anchor, and it is dominated in turn on realisability
    since its discrete logarithms are known; the raw-ratio currency dominates this one on simplicity
    and is dominated on cross-size comparability, which is the only axis this contract claims.'
  sota_delta: 'No attack; measurement-currency contribution only. Quantitatively: this bucket currently
    reports growth as a slope of a raw ratio whose denominator itself moves with N, with a recorded
    greedy slope of minus 1.18 times ten to the minus three on that channel. A completed run would
    report, for each panel geometry, a slope of attainment fraction against the logarithm of N with
    an interval under a family-wise correction, bracketed at every rung by two anchors whose values
    were predicted in closed form before the run. No attack cost, relation rate, solve time or exponent
    changes, and no claim of exponent relevance is made for any slope.'
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: high
  honest_prior_of_survival: 'The ceiling identity holding per cell: about 0.97, since this program
    has already confirmed it over 336 cells with zero violations and I re-derived it. Lower anchor
    landing on its closed form: about 0.7 - the Poisson-style approximation for random-base coverage
    is only asymptotic and at B near 29 the correction terms may be visible, which would be a calibration
    failure rather than a mathematical one and would force a finite-size correction I have not derived.
    Upper anchor reaching 1.000 at every size: about 0.6, since a ceiling-attaining construction exists
    comfortably at some sizes and is tight at others. Degenerate control falling well below the random
    anchor: about 0.9. At least one constructible geometry showing a slope interval excluding zero:
    about 0.3, and I lean toward all intervals containing zero, which is the outcome I expect and
    which the contract is built to report as a measured obstruction rather than as a disappointment.
    The mean staying inside the informative band across all four rungs under one declared base-size
    rule: about 0.55, the single most likely thing to go wrong. Overall probability of a defensible
    attainment ladder with both anchors verified: about 0.45.'
