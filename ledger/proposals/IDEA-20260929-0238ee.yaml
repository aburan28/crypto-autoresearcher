  title: >-
    An exhibited invertible recombination M over F_2 for which the reduced
    (Boolean-ring) first fall degree of a Weil-descended Semaev S_3 system
    RISES from 2 to 3 -- the cheap half of KN-OPEN-7f0511 item (A), found
    exploratorily on 2026-09-27 and here frozen for confirmatory replication
    from committed, hash-pinned code.
  class: measurement
  claim: >-
    On the 2-decomposition Semaev system S_3(x1, x2, x_R) over F_{2^6}
    (curve y^2 + xy = x^3 + x^2 + 1, a2 = a6 = 1; field modulus x^6 + x + 1;
    x1, x2 restricted to the F_2-span of {1, a, a^2}; x_R a fixed real
    x-coordinate drawn by random.Random(603)), Weil-descended to F_2 in the
    Boolean ring (u^2 = u, N = 6 variables) and reduced to its maximal
    F_2-linearly-independent subset of 5 generators, the reduced first fall
    degree d'_ff (definition #4 of KN-OPEN-7f0511, NOT #3 and NOT Nagao's
    #1/#2 as literally defined) is 2 for the identity and 3 for the
    recombination M = [1, 2, 4, 8, 26] (rows as generator bitmasks). An
    exhaustive sweep of GL_5(F_2) found 1,612,800 of 9,999,360 elements that
    raise it to 3 and none that raise it further, so the reduced analogue of
    Nagao's D_ff^max is 3 > 2 at this cell. The same instrument finds NO
    upward separation exhaustively on the Semaev n = 4, n' = 2 cell (GL_4(F_2),
    20,160 elements) and 5,424 upward separations on a degree-matched random
    null at n = 4, n' = 2. The separation is therefore real on this Semaev
    cell, not specific to Weil descent, and not automatic.
  mechanism: >-
    Recombination preserves the F_2-span of the generators but changes WHICH
    elements of that span are generators, and therefore which products m * g
    enter the degree-D Macaulay space V_D (a product enters when its reduced
    degree is <= D). At the witness, the recombined set has degrees
    [2, 2, 2, 2, 1]: one generator dropped to degree 1. The exploratory
    reading (nullcontrol.py docstring) was that a low-degree F_2-combination
    that produces the identity's fall at D = 2 is absorbed into the basis and
    the fall disappears. That reading is NOT established: the degree-matched
    null at n = 4, n' = 2 separates with no linear degree drop recorded
    (nullcontrol_results.json, drop = 0), and four of the five Semaev cells
    with a recorded drop do not separate. The mechanism is left open; this
    record claims only the counts.
