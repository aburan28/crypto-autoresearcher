idea:
  id: IDEA-20260809-9b01f9
  question_id: RQ-MLKEM-001
  added: '2026-08-09'
  title: The class-group / S-unit / log-unit route was audited for ML-KEM only, the audit's own
    finding enumerates what it did NOT close, no successor exists -- and the program holds the
    perfect null object for the whole family and has never paired it
  class: control
  claim: 'KN-FIND-860118 records that the ML-KEM instantiation of the KN-LIT-1743 pipeline is
    closed on the paper''s own structure, because Phase 1 returns the determinant ideal, which
    is (q^d) independent of A. Its confidence_note then states verbatim what remains: ''What is
    closed is the ML-KEM instantiation of the pipeline as written in v2; Parts I-III''s mathematics,
    the tower-PIP algorithm, the principal-ideal family, and the Falcon/Hawk/NTRU extensions are
    explicitly NOT closed.'' That named remainder has no successor record -- no question, hypothesis
    or proposal takes up the tower-PIP algorithm, the principal-ideal family, or the Falcon/HAWK/NTRU
    extensions. The supporting corpus is present and unread: KN-LIT-4775 (log-S-unit lattices
    via explicit Stickelberger), KN-LIT-5227 (non-randomness of S-unit lattices), KN-LIT-3053
    (computing generators in cyclotomic integer rings), KN-LIT-5981 (provably weak instances of
    Ring-LWE), KN-LIT-1169 (degree of field extension in lattice attacks on Ring-LWE) -- all cited
    by nothing outside generated index files. Structurally the program holds BOTH HALVES OF THE
    DECISIVE CONTROL and has never paired them: FrodoKEM (RQ-FRODO-3260cc, GOAL-FRODO-001) is
    UNSTRUCTURED LWE and is the natural null object for ''what does the cyclotomic ring structure
    buy an attacker'', and that comparison is framed nowhere. Note also that KN-LIT-115 and KN-LIT-116
    (Cramer-Ducas-Peikert-Regev; Stickelberger class relations) ARE cited here, but only from
    the ISOGENY side (KN-OPEN-024, KN-OPEN-026, KN-TECH-046, KN-TECH-081, EXP-SSI-7c41d9): the
    program reads the class-group literature for quaternion orders and not for its own lattice
    schemes.'
  mechanism: 'Two moves, both cheap, both with useful negatives. (1) DISCHARGE THE SUCCESSOR THE
    FINDING NAMES: apply the same determinant-ideal / forced-value audit to the Falcon-HAWK-NTRU
    instantiations KN-FIND-860118 lists as not closed -- the discriminating computation is again
    a derivation on the module''s Steinitz invariant, not a measurement, so the cost is a reading
    task plus algebra. (2) FRAME THE DIFFERENTIAL QUESTION THE PROGRAM IS UNIQUELY EQUIPPED FOR:
    state, as a single table with an explicit numbered heuristic list, every published attack
    whose advantage depends on the ring being cyclotomic (subfield/overstretched KN-LIT-112/113/114,
    short-generator KN-LIT-115, Stickelberger KN-LIT-116/4775/5227, weak Ring-LWE instances KN-LIT-5981),
    with a column for whether it applies at ML-KEM / ML-DSA / FN-DSA parameters and a FRODOKEM
    COLUMN THAT MUST READ ''not applicable, unstructured'' -- the null object, supplied free by
    a goal the program already owns. If the FrodoKEM column is empty for every row and the structured
    columns are too, that is the honest answer and it is worth recording.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'IDEA-20260805-e805b6 is scoped as an audit of ONE external claim at ONE scheme -- the determinant
      ideal of the ML-KEM module lattice with R = Z[X]/(X^256+1), q = 3329 -- and states that
      it ''does not propose a new attack in that family, it audits an external claim inside it''.
      Its outcome closes a pipeline, not a family, and KN-FIND-860118 says so in its own confidence_note.
      IDEA-20260807-abacec maps the DCP/Regev-BKSW reduction reach to Module-LWE: the hidden-shift
      route, a different mechanism, not the Stickelberger/S-unit line. The one other Stickelberger-adjacent
      proposal, IDEA-20260807-8cdc79, transfers KN-TECH-081''s two-stage discipline to IMAGINARY
      QUADRATIC ORDERS for the ECDLP class-group lane, where Dirichlet rank is zero and the log-unit
      lattice is trivial -- the opposite regime from cyclotomic fields, and under RQ-CLGP-b99df5
      rather than any lattice question. RQ-FNDSA-001 mentions overstretched-NTRU only as background
      to a sampler-leakage question. Verified: ''Stickelberger'' and ''S-unit'' appear in exactly
      two proposals, both accounted for above.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: proposing a new attack on
      any ring. The object is the DEPENDENCE OF PUBLISHED ATTACKS ON THE RING BEING CYCLOTOMIC.'
    tracked_object: Per published attack, the bit (does its advantage depend on the ring being
      cyclotomic?) together with whether it applies at ML-KEM / ML-DSA / FN-DSA parameters.
    one_step_propagation_rule: Attacks compose by union over the schemes they reach; the table's
      rows are independent and each is decidable from its own source.
    newness_score: Nil as mathematics -- every row is published. The content is that the audit
      was run for ML-KEM only, its own finding enumerates what it did NOT close, and no successor
      exists.
  lossy_projection_identifiability_audit:
    projection: the attack literature -> a per-attack applicability table with a cyclotomic-dependence
      column.
    what_is_discarded: The attacks' internals; only dependence and reach are retained.
    is_it_only_a_change_of_coordinates: 'NO -- the table does not exist. Honest caveat: a WEAK
      object producing applicability bits, and a row marked not-applicable is a statement about
      known attacks only.'
    mirror_failure_check: 'CHECKED. The table must be able to mark rows applicable: the subfield/overstretched
      family is known to apply in some regimes, so both verdicts are available.'
  null_object_control:
    primary_null: 'THE PERFECT NULL OBJECT IS ALREADY IN THE PORTFOLIO: FrodoKEM uses no ring
      at all. Every attack whose advantage depends on cyclotomic structure MUST be marked not-applicable
      to FrodoKEM. A table that marks any such row applicable there is wrong.'
    secondary_nulls:
    - 'Discharge the successor KN-FIND-860118 itself names: apply the same determinant-ideal /
      forced-value audit to the Falcon-HAWK-NTRU instantiations it lists as NOT closed -- a derivation
      on the module''s Steinitz invariant, so a reading task plus algebra.'
    - Each row carries an explicit numbered heuristic list, per the target-result-profile discipline.
  assumptions: []
  predictions:
  - metric: published attacks whose advantage depends on cyclotomic structure AND which apply
      at ML-KEM/ML-DSA/FN-DSA parameters
    direction: different
    minimum_effect: Any nonzero count is a live dependence the lattice goals do not currently
      track; zero is a durable and citable negative.
  minimal_test:
    design: Build the table across the subfield/overstretched, short-generator, Stickelberger
      and weak-instance families, with a per-scheme applicability column and numbered heuristics;
      run the FrodoKEM null; then discharge the Falcon-HAWK-NTRU audit KN-FIND-860118 names.
    controls:
    - FrodoKEM ring-free null
    - numbered heuristic list per row
    - KN-FIND-860118's own named successor set
    required_metrics:
    - per-attack dependence bit and applicability per scheme
    - FrodoKEM null verdicts
    - Steinitz-invariant audit outcome for the NTRU-family instantiations
  falsification_conditions:
  - 'No published attack''s advantage both depends on cyclotomic structure and reaches deployed
    parameters: a durable negative that closes the question for this program.'
  - 'The FrodoKEM null marks a cyclotomic-dependent attack applicable: the table is wrong.'
  - 'The Falcon-HAWK-NTRU audit closes them too: KN-FIND-860118''s residue is empty and the finding
    should be superseded to say so.'
  confounders:
  - '''Depends on cyclotomic structure'' admits degrees; a binary column will oversimplify some
    rows and the heuristics list is where that must be recorded.'
  - Applicability is parameter-dependent, so a row's verdict can flip with parameters.
  - Relayed figures until each source is filed.
  interpretation_limits:
  - A table of known attacks. It bounds nothing about attacks not yet published.
  - No security claim about any scheme follows from a not-applicable row.
  heuristic_assumptions:
  - id: HEUR-CYCST-1
    statement: Cyclotomic dependence is decidable per attack from its published statement.
    rigorous_support: None; some papers do not say which structural feature carries the advantage.
    validation_plan: Mark undecidable rows explicitly; an undecidable row is a finding about the
      literature.
  target_complexity:
    time_exponent: n/a -- applicability audit
    memory_exponent: n/a
    best_known: Published lattice attacks at the tabulated parameters
    hidden_overhead: n/a
    tradeoff_note: No attack proposed.
  dominated_by: n/a (no attack claimed; applicability audit over published attacks)
  sota_delta: ZERO on every attack axis; no attack is proposed. Discharges a successor that a
    committed finding named and nobody opened, and gives seven lattice goals a single stated position
    on the one question every lattice scheme's parameter choice implicitly answers -- with the
    program's own unstructured-LWE goal supplying the control, which is exactly the null-object-before-belief
    discipline docs/inventor-protocol.md requires and which no lattice record currently instantiates.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the table is buildable from the cited entries. 0.75 that
    the count of cyclotomic-dependent-and-deployed-reaching attacks is zero, which is the expected
    durable negative. 0.3 that the Falcon-HAWK-NTRU audit closes cleanly.
