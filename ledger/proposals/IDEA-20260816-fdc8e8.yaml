idea:
  id: IDEA-20260816-fdc8e8
  question_id: RQ-MLKEM-003
  added: '2026-08-16'
  title: 'Pose KN-OPEN-026''s growth question as a trend across technique quality rather than across
    dimension: measure the structured/unstructured blocksize ratio under three techniques of increasing
    strength on identical matched pairs, and report whether the discount is monotone in technique'
  class: composition
  claim: '(A) KN-OPEN-026''s Q1 asks whether the reported 2-15 bit range is the true size of the module-structure
    discount or merely the first thing anyone found. That question has no direct measurement, because
    the true size is not observable. It has an indirect one: if the discount is the first thing found
    rather than the whole of it, the discount should be larger under a stronger technique, because
    a stronger technique has more preprocessing to amortise across symmetry-derived instances. The
    object tracked is therefore the function T -> D(T), the discount ratio as a function of technique
    index, on one fixed matched-pair population. (B) The claim is that D(T) is measurable with three
    techniques this program can implement in pure Python and order unambiguously on the unstructured
    arm alone: T1, LLL followed by Babai decoding; T2, progressive BKZ to blocksize beta followed
    by Babai; T3, progressive BKZ to blocksize beta with one round of rotation amortisation, in which
    the reduced basis obtained for one instance is reused as the starting basis for the other rotations
    of the same structured instance and the best decode over all rotations is taken. The ordering
    T1 < T2 < T3 is established empirically on the unstructured arm, where T3 degenerates to T2 because
    no rotations exist. (C) The discriminating prediction is a shape, not a level: if D(T1) approximately
    equals D(T2) approximately equals D(T3), the discount is a fixed property of the instance and
    Q1''s first-thing-found reading is not supported by this measurement; if D rises with T, it is
    supported at these parameters. (D) NOT CLAIMED: no attack, no speedup, no bit figure, no claim
    about deployed parameters, no assertion that T3 is a new or good technique, and no claim that
    three techniques constitute a trend in any sense stronger than three ordered points with intervals.
    Monotonicity over three points is weak evidence and is reported as such.'
  mechanism: 'STAGE 1. Generate one population of matched pairs (structured, unstructured) with retained
    s and e. STAGE 2. Establish the technique ordering empirically on the unstructured arm: measure
    success rate of T1, T2, T3 there and confirm rate(T1) < rate(T2) and rate(T3) = rate(T2) within
    interval, since T3''s rotation reuse has nothing to act on without a ring. If the ordering fails,
    the technique axis is not ordered and the run reports that instead. STAGE 3. Run all three techniques
    on both arms of every pair in the same invocation, recording exact-recovery flags and, where defined,
    beta*. STAGE 4. Compute D(T) per technique as the paired ratio of blocksizes or, for T1 where
    no blocksize exists, as the ratio of success odds. STAGE 5. Report the three-point profile with
    intervals and an explicit monotonicity statistic. STAGE 6. Run the ring-deleted null through all
    three techniques; D(T) must be flat at 1 there. STAGE 7. Run the budget-matched control giving
    T2 compute equal to T3''s rotation-multiplied cost. Refutation: a flat D(T) with tight intervals
    is a measured obstruction against the amortisation reading at these parameters.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rilE 'module.structure|structure discount|ring structure|coefficient isometr' ledger/proposals/;
      grep -rilE 'crossover|enumeration' ledger/proposals/. Read KN-OPEN-026 in full, especially Q1
      and Q2. Read title and claim head of IDEA-20260805-530869, IDEA-20260814-137f68, IDEA-20260805-f7c912,
      IDEA-20260808-baf8bc.
    results: No record found in ledger/proposals/ poses a discount as a function of technique index.
      IDEA-20260814-137f68 is the closest in method, a covariate design asking whether departure from
      a Beta law correlates with a prediction's fidelity, and it is about basis profiles rather than
      structure discounts. IDEA-20260805-530869 owns the matched-null construction this entry reuses.
      IDEA-20260808-baf8bc varies a memory budget and asks whether variant optima collapse onto a
      baseline below a threshold, the same shape of question, does an advantage survive when a resource
      axis is varied, applied to ISD rather than to structure. KN-OPEN-026 itself states Q1 and Q2
      but proposes reading papers and consulting authors' analyses, not a measurement.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: the independent variable. The corpus varies dimension, memory, blocksize and cost
      model; it does not vary technique strength and read a discount off the resulting profile. Assembled
      from known parts: the matched-pair generator of IDEA-20260805-530869, progressive BKZ and Babai
      decoding, the rotation-reuse construction as this program''s own realisation of the amortisation
      idea KN-OPEN-026 relays, and ordinary paired statistics with a monotonicity test.'
  object_first_candidate:
    tracked_object: The profile D(T) = (D(T1), D(T2), D(T3)), a three-vector of paired discount ratios
      indexed by technique, measured on one fixed population of matched pairs with retained ground
      truth.
    lossiness: 'Genuinely lossy, and lossy twice over. Each D(T) already discards every basis and
      every reduction trajectory, retaining one integer per instance. The profile then discards the
      identity of the techniques, retaining only their order and the ratio each produces. What is
      discarded is discarded compatibly with the operation of interest because the question, does
      the advantage grow as the method improves, depends on the technique only through its strength
      ordering and its measured ratio, both retained. The blind spot is explicit: a technique that
      helps the structured arm through a mechanism unrelated to amortisation would be indistinguishable
      here from one that helps through amortisation, so a monotone profile localises a trend and does
      not identify a mechanism.'
    propagation: One step of the target operation is moving one rung up the technique ladder. Under
      that step the unstructured arm's success odds increase by a measured amount and the structured
      arm's success odds increase by a measured amount that includes, at T3 only, the rotation reuse.
      D propagates as the ratio of two odds increments, and the amortisation hypothesis is exactly
      the statement that the structured increment at T2 to T3 strictly exceeds the unstructured increment
      at the same step. That comparison is the observable.
    survival_score: The ladder survives three rungs as implemented. T1 is affordable at every grid
      point; T2 to blocksize about 30 at n <= 64; T3 costs d times T2 per instance and therefore dissolves
      at d = 32, n = 64 within a reasonable budget, so the full three-rung profile survives only at
      d in {8, 16} and n <= 48. A fourth rung, a genuine sieve or a hybrid with guessing, is not reachable
      in pure Python at these dimensions and is named as the boundary rather than claimed.
  null_object_control: 'Two nulls in the same invocation. NULL A, the matched unstructured arm, is
    the denominator of every D(T) and is itself run through all three techniques, which makes T3''s
    degeneracy checkable: with no rotations, T3 must reduce to T2 exactly and its success rate must
    match T2''s within interval. NULL B, the ring-deleted structured instance with entry multiset
    preserved by a seeded within-block permutation, is run through all three techniques; its D(T)
    profile must be flat at 1 across all three rungs. If NULL B shows a rising profile, the rotation
    reuse is exploiting the block layout rather than the ring and the signal profile is an artifact.
    If T3 does not degenerate to T2 on NULL A, the technique ladder is not implemented as specified
    and nothing is interpretable.'
  discriminated_from:
  - 'The matched-discount entry in this same batch: that fixes one technique and varies dimension,
    answering KN-OPEN-026''s Q2. This fixes the population and varies technique, answering Q1. They
    share a generator and answer different sub-questions.'
  - 'IDEA-20260805-530869: an instrument and precondition built on forced algebraic values, with no
    technique axis and no recovery.'
  - 'IDEA-20260814-137f68: a covariate design over basis-profile fidelity, not over technique strength,
    and with no structured/unstructured contrast.'
  - 'IDEA-20260808-baf8bc: varies a memory budget to ask whether variant advantages collapse; same
    question shape, different resource axis, different domain.'
  - 'KN-TECH-046 and the class-group line: operates at exp(Otilde(sqrt(n))) approximation factors
    and is not on this ladder at all; KN-OPEN-026 warns against conflation and this entry does not
    conflate.'
  assumptions:
  - The technique ordering T1 < T2 < T3 can be established empirically on the unstructured arm and
    is not assumed.
  - T3's rotation reuse is this program's own construction and a stand-in for the amortisation mechanism
    KN-OPEN-026 relays; it is not claimed to be any published technique.
  - Three rungs suffice to distinguish a flat profile from a monotone one at the achievable intervals;
    if they do not, the entry reports the profile and declines the monotonicity verdict.
  - Exact recovery against retained ground truth is the success event at every rung.
  - A profile measured at n <= 48 carries no implication for deployed dimensions, and none is drawn.
  predictions:
  - metric: success rate of T2 minus success rate of T1 on the unstructured arm
    direction: higher
    minimum_effect: 0.1
  - metric: success rate of T3 minus success rate of T2 on the unstructured arm
    direction: different
    minimum_effect: 'forced value: 0.00, interval must contain zero, because T3 degenerates to T2
      without a ring. A nonzero value indicts the implementation.'
  - metric: D(T3) minus D(T1) on the structured arm
    direction: higher
    minimum_effect: 0.1
  - metric: D(T3) minus D(T1) on NULL B (ring-deleted)
    direction: different
    minimum_effect: 'forced value: 0.00, interval must contain zero; otherwise the profile tracks
      block layout rather than the ring.'
  - metric: width of the interval on each D(T)
    direction: lower
    minimum_effect: 0.15
  minimal_test:
    design: 'One grid point, three techniques, three arms. Fix q = 3329, d = 16, k = 2, n = 32, m
      = 2n, eta = 2, blocksize ceiling 24. Draw 80 seeds; from each emit the structured instance,
      the matched unstructured NULL A and the ring-deleted NULL B, all sharing s and e. Run T1, T2
      and T3 on all three arms in the same invocation, nine runs per seed and 720 total. Record exact-recovery
      flags and beta* where defined. Report the three-point D(T) profile with paired bootstrap intervals
      for the structured arm and for NULL B, and report the T3-degenerates-to-T2 check on NULL A.
      This is the cheapest design that discriminates because the entire claim is a shape over three
      points, and the two nulls are what convert a rising shape from a suggestive number into a licensed
      one: NULL A validates the ladder''s implementation and NULL B validates that the rise is about
      the ring.'
    controls:
    - NULL A, matched unstructured arm run through all three techniques, including the forced T3-equals-T2
      degeneracy check.
    - NULL B, ring-deleted structured arm with preserved entry multiset, run through all three techniques.
    - Zero-error positive control at every rung, where recovery must succeed at the lowest blocksize
      in all arms.
    - 'Rotation-count control: run T3 with one rotation reused, which must reproduce T2, and with
      all rotations, establishing that any effect scales with rotation count rather than appearing
      at any reuse.'
    - 'Budget-matched control: give T2 a compute budget equal to T3''s rotation-multiplied cost by
      raising its blocksize ceiling, so a rising D(T3) cannot be explained by spending more compute.'
    required_metrics:
    - exact-recovery flag per (seed, arm, technique)
    - beta* per (seed, arm, technique) where defined
    - D(T) with paired bootstrap interval per technique per arm
    - success-rate differences establishing the technique ordering on NULL A
    - T3-versus-T2 degeneracy statistic on NULL A
    - budget-matched T2 success rate
    - wall clock per (seed, arm, technique)
  falsification_conditions:
  - 'T3 does not degenerate to T2 on the unstructured arm: the ladder is misimplemented and no profile
    is interpretable.'
  - 'NULL B shows a rising profile: the effect tracks block layout, not the ring, and the signal profile
    is an artifact.'
  - 'The budget-matched T2 arm matches T3''s structured success rate: the rise is explained by compute
    rather than amortisation.'
  - 'The technique ordering fails on NULL A, with T2 no better than T1: there is no ordered axis and
    the design''s premise is void.'
  - 'The structured profile is flat within tight intervals: no growth with technique quality is measurable
    at these parameters, refuting the entry''s motivating expectation and supplying the reported obstruction.'
  - 'The rotation-count control shows the full effect already at one reused rotation: the effect is
    not amortisation across the orbit and the mechanism named in the claim is wrong.'
  confounders:
  - T3 spends d times the compute of T2, so any rise could be compute rather than structure; the budget-matched
    control is the defence and it is imperfect because compute is converted into blocksize by a chosen
    rather than derived rule.
  - T1's success-odds scale and T2/T3's blocksize scale are different response scales, so a profile
    spanning them is not a single curve.
  - Rotation reuse warm-starts the reduction, which changes the reducer's trajectory in ways unrelated
    to the ring's information content.
  - Censoring differs by rung, with T1 censoring most, so the profile mixes rungs with different effective
    sample sizes.
  - Instance-hardness variance across seeds exceeds the expected rung-to-rung effect, so an underpowered
    design would read noise as a shape.
  interpretation_limits:
  - Three ordered points are three ordered points; a monotone profile is weak evidence and must not
    be described as a trend law.
  - The design detects a shape, not a mechanism, and cannot attribute a rise to amortisation rather
    than to another property of the stronger technique.
  - T3 is this program's own construction and must not be described at review as an implementation
    of any relayed mechanism.
  - Nothing here bears on ML-KEM, FHE parameter selection, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The design's own cost is O(seeds * arms * (T1 +
      T2 + d*T2)) counted operations.
    memory_exponent: No attack memory exponent is claimed. One basis of O(n^2) integers per instance,
      plus the reused basis carried across rotations at T3.
    best_known: No incumbent attack is challenged. The incumbent for the question itself is KN-OPEN-026's
      Q1 as posed there, which proposes to answer it by reading the sources and extracting each mechanism's
      regime; this entry proposes a measurement that does not depend on that reading and does not
      substitute for it.
    hidden_overhead: 'Hidden in the lower-order terms: the compute-to-blocksize conversion used by
      the budget-matched control silently sets whether a rise is attributable to structure, and it
      is a chosen rule. Hidden in human cost: implementing rotation reuse so that the warm start is
      genuinely the same preprocessing rather than a differently conditioned basis is subtle, and
      getting it wrong produces a rise for the wrong reason.'
  dominated_by: 'n/a (no result claimed). Frontier rows checked and found not to be frontiers this
    entry occupies: KN-OPEN-026''s relayed bit figures, KN-TECH-046''s class-group approximation-factor
    regime, IDEA-20260808-baf8bc''s memory-constrained ISD frontier, and IDEA-20260805-530869''s instrument.
    The deliverable is a three-point profile of a dimensionless ratio, which is on no cost frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a three-point
    discount profile with intervals, a degeneracy check, a ring-deleted null forced flat, a rotation-count
    control and a budget-matched control.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: 'Four separable parts. (i) That the ladder is implemented so T3 degenerates
    to T2 on the unstructured arm: about 0.7, and it is checkable directly. (ii) That the technique
    ordering holds empirically, T2 beating T1: about 0.9, this is nearly certain. (iii) That NULL
    B stays flat: about 0.65, since warm-starting on permuted blocks may still help for reasons unrelated
    to the ring. (iv) That the structured profile rises and survives the budget-matched control: about
    0.15, and I decline to raise it, because the most likely honest outcome is that T3''s rise is
    explained by the d-fold compute it spends.'
