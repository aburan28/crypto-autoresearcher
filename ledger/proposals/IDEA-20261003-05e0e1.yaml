# IDEA-20261003-05e0e1
# Projective storage count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-05e0e1
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A projective point stores 3 coordinates and an x-only state stores 1
  class: representation
  claim: >-
    A projective point stores 3 coordinates. An x-only state stores
    1 coordinate. Three exceeds one by 2. The product of the two
    counts is 3. Their sum is 4. The gap is a storage count, not
    an ECDLP exponent and not an affine coordinate count.
  mechanism: >-
    OBJECT FRAME. The object is the stored state. The operation
    set is reading one coordinate, which is coordinate-dependent
    and is not a translation of a group element. Two x-only states
    both store 1, so that gap is 0. No ladder is run.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries that speed decomposition are a different object
        from these two storage counts.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two storage counts are frozen before they are subtracted.
    - No ladder is run.
  proof_search_map:
    bottleneck: The storage gap 2.
    baseline_embedding:
      parameter_slice: The counts 3 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 3 exceeds 1 by 2.
    observation_collision:
      observable: The storage gap and the product.
      distinct_preimage_search: >-
        Reporting both states as size 1 drops the gap. Two x-only
        states make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The x-only state.
        predicted_gain: Two fewer stored coordinates. No exponent.
    quantifier_order: >-
      The counts are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The storage counts 3 and 1. Not an affine coordinate count.
      nearby_object_control: >-
        Two x-only states. Both store 1, and the gap is 0.
    proof_obligations:
      - claim: The projective point stores 3 coordinates.
        responsibility: size
      - claim: The x-only state stores 1 coordinate.
        responsibility: size
      - claim: The gap is not an affine coordinate count.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: storage_gap
      direction: different
      minimum_effect: Three exceeds one by 2.
  minimal_test:
    design: >-
      Subtract 1 from 3 and multiply 3 by 1. Do not run a ladder.
    controls:
      - Two x-only states, whose storage gap is 0.
      - An independent count.
    required_metrics:
      - both storage counts
      - the gap
      - the product
  falsification_conditions:
    - The projective storage count is not 3.
    - The product of the two counts is not 3.
  confounders:
    - A Jacobian triple is a different stored state from a projective triple.
  interpretation_limits:
    - A storage count is not a walk length.
    - No transfer to a cryptographic ladder.
    - This is not a comparison of affine storage 2 against x-only storage 1.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen projective point stores 3 coordinates, and the
        frozen x-only state stores 1.
      rigorous_support: >-
        No ladder theorem is claimed. The count is a reading of
        two stored states.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Three stored coordinates versus one, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
