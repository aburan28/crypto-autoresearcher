idea:
  id: IDEA-20260829-c7472b
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  goal_id_note: >-
    Named as the paused goal bound to this question. Naming is not dispatch and
    authorizes nothing; only a Coordinator decision does. This proposal also
    audits a record committed under GOAL-ECQ-001, which is a read, not a write -
    no record of that goal is edited by anything proposed here.
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    The trust surface as the tracked object: classify every rung of the ladder by
    what a from-scratch verifier must ACCEPT rather than recompute, and price the
    one cell where this program's own "exactly 12" may already be
    GRH-conditional

  class: control

  claim: >-
    RQ-ECRANK-27dcc5 asks for "a checkable witness rather than a conditional
    argument", and the program has never measured which of its own rungs are
    which. THE CLAIM HAS THREE PARTS, EACH FALSIFIABLE SEPARATELY.
    (A) THE OBJECT. For any rank statement, define its TRUST SURFACE as the set
    of facts a second implementation, given only the witness, must accept without
    recomputing. Four kinds populate it: EXHIBITED ARITHMETIC (recomputable in
    exact integers), a CITED THEOREM (accepted as mathematics - Mazur, Kummer,
    the multiquadratic decomposition), a FLOATING COMPUTATION (accepted without a
    rigorous error bound), and a CONDITIONAL SUBROUTINE (accepted only under an
    unproven hypothesis). A witness is "checkable" exactly when its trust surface
    contains only the first two kinds. This is a computable classification, not a
    judgement, and it produces the certificate-strength column that
    RQ-ECRANK-27dcc5's decision target explicitly asks for and that no committed
    record contains.
    (B) THE SUSPECTED CELL. EV-ECQ-0d142e states that rank E(Q) is EXACTLY 12 for
    its best curve because "PARI ellrank returned r_high = 12" and "r_high = 12
    is an unconditional upper bound". That is the program's single strongest
    claim about rank over Q and the only place it asserts an EQUALITY. But
    Klagsbrun, Sherman and Weigandt needed GRH to pin the Elkies curve at rank
    exactly 28, and the reason they give is class-group computations of the
    associated cubic fields; and PARI's own documentation describes the bnf
    family as sub-exponential algorithms for class and unit groups UNDER GRH.
    THE CLAIM IS THAT THE WORD "UNCONDITIONAL" IN EV-ECQ-0d142e IS UNAUDITED AND
    MAY BE WRONG. Which it is can be settled by naming the code path and running
    bnfcertify, and either answer changes what every rung of this question's
    ladder is allowed to say.
    (C) THE PRICE. Removing GRH from a class-group computation means searching to
    the Minkowski bound, of order sqrt|d_A|, instead of Bach's 12 log^2 |d_A|.
    For the rank-12 curve's cubic field that is roughly 10^30 against roughly
    2.3e5 - an exponent, not a constant. So there is a CERTIFIABILITY HORIZON in
    curve coefficient size beyond which no exact-rank statement over Q can ever
    be made unconditionally by this route, and locating it tells this question
    exactly where "checkable" stops and "conditional" begins.

  mechanism: >-
    The classification is mechanical. Take a committed rank statement and its
    witness. Walk the verification path a from-scratch implementation would have
    to execute and label every step: recomputable in exact integer or rational
    arithmetic (EXHIBITED); a named theorem applied to exhibited data (THEOREM);
    a numerical computation with no rigorous error bound (FLOAT); a call to a
    subroutine whose correctness rests on an unproven hypothesis (CONDITIONAL);
    or a call to the producer's own engine (NON-INDEPENDENT, which
    docs/claims-and-verification.md forbids for a verifier). The trust surface is
    the multiset of labels. Composition is the reason this is an object and not a
    checklist: the trust surface of a composed certificate is the UNION of the
    surfaces of its parts, so a single FLOAT or CONDITIONAL anywhere in a
    2^k-class ladder contaminates the whole rung, and the rung must be reported
    at the weakest label it contains.
    The GRH cell is then a measurement rather than an argument. For a curve E,
    2-descent works in the algebra A = Q[x]/f(x); the Selmer group is cut out of
    the S-unit group A(S,2) by local conditions, and computing A(S,2) requires
    the class group and unit group of A. Under GRH those are obtained by
    searching relations over prime ideals of norm below Bach's bound
    12 log^2|d_A|; unconditionally the same search must reach the Minkowski
    bound, which is of order sqrt|d_A| up to a bounded constant. PARI exposes
    exactly this distinction as bnfcertify. So: for a ladder of curves of
    increasing coefficient size, compute the 2-descent field, attempt bnfcertify
    under a fixed budget, and record where it stops. THAT boundary is the
    certifiability horizon, and it is measured, not asserted.
    THE TRACKED OBJECT is the TRUST SURFACE - the label multiset of a
    verification path.

  lossy_projection_test: >-
    The projection sends a verification path to the multiset of labels of its
    steps. It discards the mathematics entirely: which curve, which points, which
    primes, which rank - all gone. Two rungs of completely different content and
    completely different rank have the same trust surface, which is the whole
    point. What it discards is discarded COMPATIBLY with the operation the target
    performs, because the target operation is COMPOSITION of certificates and the
    label multiset composes by union - the trust surface of a composite is
    determined by the trust surfaces of the parts and by nothing else. That is a
    genuine deterministic propagation rule on the projected state. It is not a
    change of coordinates: no witness can be reconstructed from its label
    multiset, and the projection is many-to-one on every nonempty fibre. PASSES.
    NULL-OBJECT NOTE, since this object is unusually cheap to fool: a
    classification scheme that labels everything EXHIBITED has a trivial trust
    surface and is useless, so the design's first control is a rung KNOWN to
    contain a float (the degree-16 multiplicity certificate) on which the
    classifier must report FLOAT, and a rung known to be float-free (the
    degree-32 eigenspace certificate) on which it must report none.

  novelty_status: unverified

  novelty_note: >-
    Corpus and ledger grepped this session for prior art: no committed record
    classifies witnesses by trust surface, no record audits the GRH status of
    ellrank's upper bound, and no record contains a certifiability horizon.
    EV-ECQ-0d142e itself records proof_status "mixed by claim, stated per claim
    rather than averaged", which is the same instinct applied once by hand to one
    record - this generalises it into a computed column across the ladder. The
    EXTERNAL observation that exact rank of record curves is GRH-conditional
    through class groups is KNOWN and published (Klagsbrun-Sherman-Weigandt,
    retrieved this session), so part (B) claims no mathematical novelty
    whatsoever - it claims that this program has not applied a known fact to its
    own record. Filed `unverified` because PARI's ellrank source was not read
    this session and the doc statement relied on is a search-tool summary.

  citations:
  - ref: arXiv:1606.07178
    provenance: retrieved
    claim: >-
      "The Elkies Curve has Rank 28 Subject only to GRH", Klagsbrun, Sherman,
      Weigandt. Abstract states that subject to GRH the curve has Mordell-Weil
      rank equal to 28 and analytic rank at most 28; the method involves
      computing the 2-ranks of class groups of cubic fields associated to these
      elliptic curves, and includes proving, subject to GRH, that the class group
      of a particular cubic field has 2-rank equal to 22. This is the published
      precedent that an EXACT rank statement for a record curve is
      GRH-conditional through class-group computation.
    verified_by: >-
      idea-generator session 2026-08-29, WebFetch of https://arxiv.org/abs/1606.07178.
      CAVEAT RECORDED: the fetch returned a summarised rendering of the abstract
      page, not the full paper; the quoted content is the title, authors and
      abstract-level statements only, and no theorem numbering or proof detail
      was read. A full-text read is a pre-registered step before this citation is
      load-bearing for anything beyond motivation.
  - ref: >-
      PARI/GP documentation, "General number fields" catalogue page
      (pari.math.u-bordeaux.fr)
    provenance: retrieved
    claim: >-
      Functions whose names begin with bnf are implementations of sub-exponential
      algorithms for finding class and unit groups UNDER GRH (Hafner-McCurley,
      Buchmann, Cohen-Diaz-Olivier); bnfcertify is the function that removes the
      hypothesis. Also, that descent-based rank determinations are described as
      unconditional while analytic upper bounds are GRH-conditional - which is
      exactly the ambiguity this proposal resolves, since a descent that INTERNALLY
      calls bnf machinery is not obviously in the first category.
    verified_by: >-
      idea-generator session 2026-08-29, WebSearch. CAVEAT RECORDED AND MATERIAL:
      this is a search-tool summary of documentation pages, NOT a direct read of
      the PARI documentation or of the ellrank source. The entire point of
      prediction P1 is that this must be settled by reading the source and running
      the function, and until that is done nothing here may be quoted as
      establishing that ellrank is or is not GRH-conditional.
  - ref: ledger/evidence/EV-ECQ-0d142e.yaml
    provenance: internal
    claim: >-
      OBS-3 - "Because r_high = 12 is an unconditional upper bound, rank E(Q) is
      EXACTLY 12" for t = -65/22 with a-invariants [0, 0, 0,
      -518228207838672723, 141005837549331272675978478], with PARI ellrank
      returning [12,12] at efforts 1 and 2 in a blind re-derivation. Also
      proof_status_detail item (ii) making the same statement, boundary B-7
      declaring that no Selmer bound contributes anywhere "except where an
      ellrank r_high is explicitly cited as an unconditional upper bound", and
      UC-1, the unexplained 17-significant-digit regulator divergence.
    verified_by: >-
      idea-generator session 2026-08-29, FULL READ of the committed record
    verification_tool: Read
  - ref: docs/claims-and-verification.md
    provenance: internal
    claim: >-
      The independence rule ("the verifier recomputes from scratch using the
      curve arithmetic module, not by trusting the solver's internal state"); the
      distinction between a failed certificate (`invalid_measurement`) and a
      negative observation; the two-record rule requiring a heuristic-conditional
      result to be split into a conditional claim record and separate
      heuristic-support evidence; and the rule that dropping a conditional
      qualifier in any summary is a claim-tier violation.
    verified_by: >-
      idea-generator session 2026-08-29, FULL READ of the document
    verification_tool: Read
  - ref: ledger/goals/GOAL-ECQ-e72c0b/goal.yaml
    provenance: internal
    claim: >-
      The exact-certificate specification this program has already written down -
      an acceptable Cremona-Brumer-style certificate must publish the complete
      exact character basis or basis bindings, good primes and preconditions,
      point and torsion rows, exact F2 matrix, matrix rank, torsion-row rank, any
      halving witnesses, and the proof that matrixRank minus torsionRank = 32
      implies independence; plus the prohibition on BSD, GRH, analytic rank, a
      floating regulator or determinant, distinctness of points, a timeout, or an
      infrastructure failure as proof of a rank lower bound. This is the closest
      thing to a frozen witness schema in the repository and it is written for a
      goal, not as a reusable format.
    verified_by: >-
      idea-generator session 2026-08-29, FULL READ of the committed goal record
    verification_tool: Read
  - ref: >-
      Minkowski's bound; Bach's GRH bound 12 log^2 |d_K|; Cohen-Lenstra
      heuristics; Hardy-Ramanujan and Erdos-Kac on the number of prime factors
    provenance: recalled
    claim: >-
      The proven and classical inputs to the cost model of part (C) and to HA-1
      and HA-2. Pointers for a reviewer, never support; each is to be read at a
      primary source before it is load-bearing.
    verified_by: null

  assumptions:
  - >-
    THIS PROPOSAL CHANGES NO STATUS AND EDITS NO RECORD. If the audit finds that
    EV-ECQ-0d142e's exactness claim is conditional, the remedy is a NEW record
    superseding the statement, authored by the Coordinator, never an edit. The
    Idea Generator has no authority to move a hypothesis or amend evidence and
    claims none here.
  - >-
    The trust-surface classification is applied to WITNESSES AS COMMITTED. Where
    a committed certificate does not contain enough information to walk the
    verification path, that is recorded as an incomplete witness - which is
    itself a finding about checkability - and never filled in by inference about
    what the producer probably did.
  - >-
    bnfcertify's success is taken as evidence that the class and unit group data
    are unconditional; its failure or timeout is taken as an INFRASTRUCTURE
    outcome and never as evidence that the data are wrong. This follows AGENTS.md
    rule 3 and is stated because the temptation to read a timeout as a negative
    is highest exactly here.

  proof_search_map:
    bottleneck: >-
      The single step in the whole ladder whose removal would change what may be
      CLAIMED, as opposed to what may be computed: the source of the upper bound
      in any exactness statement. Lower bounds are exhibited and cheap; upper
      bounds require descent, descent requires S-units, S-units require a class
      group, and a class group is where GRH enters. Everything else in this
      question is already unconditional.
    baseline_embedding:
      parameter_slice: >-
        A curve small enough that the 2-descent field's class group can be
        certified outright - a conductor-53 or conductor-37 curve. There the
        conditional and unconditional answers coincide, bnfcertify returns in
        milliseconds, and the exactness claim is genuinely unconditional. That is
        the old-method boundary and the regime where "unconditional upper bound"
        is simply true.
      reproduction_check: >-
        Run the full audit on the conductor-37 rank-1 curve that EV-ECQ-0d142e
        already used as a control (OBS-8: 18 supplied points, certified rank
        exactly 1). The pipeline must classify its exactness claim as
        UNCONDITIONAL, with bnfcertify succeeding, before any curve is classified
        as conditional. A classifier that calls everything conditional is as
        useless as one that calls everything exhibited.
    observation_collision:
      observable: >-
        The trust-surface label multiset of a rung.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE MAIN LIMITATION, stated rather than hidden.
        Two rungs with identical label multisets can differ enormously in
        mathematical content - a rank-64 statement and a rank-2 statement can both
        be {EXHIBITED, THEOREM}. So the trust surface is a strength coordinate
        and NEVER a rank coordinate, and the deliverable is a COLUMN beside the
        rank, never a substitute for it. A second collision, more dangerous: a
        rung can be labelled {EXHIBITED, THEOREM} while resting on a theorem that
        is FALSE AS APPLIED - the multiquadratic decomposition applied to a V
        that is not a subgroup, for instance. Label THEOREM therefore requires
        the theorem's hypotheses to be exhibited and checked, and the conformance
        suite's seeded faults include exactly this case.
    quantifier_order: >-
      FOR EACH committed rung r, THERE EXISTS a verification path P(r) such that
      FOR ALL steps s in P(r), label(s) is in {EXHIBITED, THEOREM}. The
      existential over paths is essential and is the honest weak point: a rung
      may admit a clean path that nobody has written down, so a rung labelled
      FLOAT means "the committed witness's path contains a float", never "no
      float-free path exists". The strong statement - FOR ALL paths - is not
      claimed anywhere and would require a lower-bound argument this proposal
      does not have.
    method_ceiling:
      strongest_certifiable_claim: >-
        A per-rung strength label and a measured certifiability horizon in
        log|d_A|. The method can never prove a rung UNCERTIFIABLE (that is a
        for-all over methods), never raise any rank, never remove GRH from
        anything, and never establish that any class group computed under GRH is
        wrong. Its strongest negative is "the committed witness for this rung
        contains a step of kind X", which is a statement about an artifact.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must fail is a rung
        this program already knows to be float-free and descent-free: the
        degree-32 eigenspace certificate and RUN-ECQ-f5af06-v2-A-certify's
        31-point independence certificate. The classifier must return a clean
        surface on both. If it flags either, it is measuring its own conservatism
        rather than the ladder. Symmetrically it must flag the degree-16
        multiplicity certificate, which is known to contain a 64-digit regulator.
        A classifier that cannot separate that pair has identified nothing.
    proof_obligations:
    - claim: each label is justified by a named step in a named committed artifact
      responsibility: correctness
    - claim: >-
        a rung is reported at the WEAKEST label anywhere in its path, never at an
        average
      responsibility: strictness
    - claim: a bnfcertify timeout is reported as an infrastructure outcome
      responsibility: scope
    - claim: >-
        any adverse finding about a committed record is routed to the Coordinator
        as a proposed supersession and never applied as an edit
      responsibility: interface

  predictions:
  - id: P1
    metric: >-
      the GRH status of the upper bound r_high = 12 that EV-ECQ-0d142e cites as
      "unconditional", determined by naming the code path PARI ellrank takes on
      that exact curve and by running bnfcertify on whatever number field it
      constructs
    direction: >-
      the bound is found to depend on a GRH-conditional class or unit group
      computation unless bnfcertify succeeds on the relevant field
    minimum_effect: >-
      a binary determination with the code path named and the field's
      discriminant recorded. Either answer is a result: "unconditional,
      certified" restores the claim with a basis it currently lacks;
      "GRH-conditional" means the program's only exact-rank claim over Q must be
      restated under the two-record rule.
  - id: P2
    metric: >-
      the certifiability horizon - the largest log_10 |d_A| of a 2-descent field
      for which bnfcertify returns success within a frozen budget of 3600 s and
      8 GB
    direction: >-
      finite and small relative to record curves
    minimum_effect: >-
      the horizon lies at log_10 |d_A| between 10 and 45, and the rank-12 curve's
      own field (whose discriminant is expected near log_10 |d_A| of 50 or more,
      given a6 of order 1.4e26) lies ABOVE it. If the horizon exceeds
      log_10 |d_A| = 60 the exactness claim is cheaply rescuable and the whole
      part-(C) concern is smaller than stated - a falsification in the direction
      that helps the programme.
  - id: P3
    metric: >-
      number of the 9 enumerated frontier rungs whose trust surface contains only
      EXHIBITED and THEOREM labels
    direction: >-
      small; most rungs carry a FLOAT or a CONDITIONAL
    minimum_effect: >-
      at most 4 of 9 clean, with each label traced to a named step in a named
      committed artifact. More than 6 clean means the classifier is too permissive
      and must be re-tested against the seeded-fault suite before its column is
      published.
  - id: P4
    metric: >-
      detection rate of a frozen conformance suite of at least 12 seeded faults -
      off-curve point, torsion point counted as independent, duplicated point,
      dependent triple, wrong twist model after a coset cancellation, non-subgroup
      V, subproduct that is a square, prime of bad reduction used, torsion row
      omitted, l dividing the lattice index, regulator nonsingular for dependent
      points, and a producer-state read instead of a recompute
    direction: increase toward 1
    minimum_effect: >-
      at least 11 of 12 detected by an independent verifier given only the
      witness. Below that, the witness FORMAT is underspecified - some faults are
      invisible in the artifact - and the missing fields are the deliverable.

  minimal_test:
    design: >-
      ARM 1, the audit, hours. Enumerate the 9 frontier rungs (EV-ECRANK-b6c9b6's
      six, EV-ECQ-0d142e's rank-12-exact and its rank-13 pool lower bound, and
      RUN-ECQ-f5af06-v2-A-certify's 31). For each, open the committed witness and
      walk the verification path, labelling every step and citing the artifact
      and field that justifies the label. Publish the table.
      ARM 2, the GRH cell, the load-bearing measurement. Read the PARI ellrank
      documentation and source to determine which number fields it constructs and
      whether it calls bnf machinery; run it on the rank-12 curve with output of
      the intermediate fields; for each field compute the discriminant and run
      bnfcertify under a frozen 3600 s / 8 GB budget. Then build a ladder of at
      least 20 curves of increasing coefficient size drawn from the 137 certified
      fibres and the 1,206-curve pool, repeat, and fit the horizon.
      ARM 3, the format and its conformance suite. Write down a single frozen
      witness schema covering both certificate kinds this question uses - the
      eigenspace/character certificate and the F_l reduction certificate -
      including every field GOAL-ECQ-e72c0b's completion criterion already
      enumerates plus the fields Arms 1 and 2 show to be missing. Implement a
      verifier from the schema alone, without reading any producer code. Seed the
      12 faults into valid witnesses and measure detection.
    controls:
    - >-
      CLASSIFIER SEPARATION (the nearby-object control). The degree-32 eigenspace
      certificate and the 31-point F_l certificate must classify clean; the
      degree-16 multiplicity certificate must be flagged FLOAT. A classifier that
      fails this pair reports nothing.
    - >-
      GRH BASELINE. The conductor-37 rank-1 control curve of EV-ECQ-0d142e OBS-8
      must classify UNCONDITIONAL with bnfcertify succeeding. Otherwise the
      pipeline calls everything conditional and its horizon is meaningless.
    - >-
      SEEDED-FAULT SUITE (Arm 3), which is the null-object control for the whole
      idea: a verifier that accepts a witness with a torsion point counted as
      independent, or with V not a subgroup, is not a verifier, and the
      historically observed fault - 16 points landing on an isomorphic but
      different model through coset cancellation, recorded in EV-ECRANK-b6c9b6 -
      is included as a REAL positive control alongside the synthetic ones.
    - >-
      PRODUCER-STATE TRAP. One seeded fault is a witness whose claimed rank is
      correct but whose supporting matrix is copied from the producer rather than
      recomputed. An independent verifier must reject it; one that passes is
      trusting producer state, which docs/claims-and-verification.md forbids
      explicitly.
    - >-
      BUDGET SYMMETRY. bnfcertify is run at two budgets a factor of 8 apart so
      the horizon is measured rather than set by the smaller budget.
    required_metrics:
    - the 9-row trust-surface table with per-step labels and artifact citations
    - the named ellrank code path and every number field it constructs on the rank-12 curve
    - bnfcertify outcome, wall clock and log_10 |d_A| for every field in the ladder
    - the fitted certifiability horizon with its budget
    - seeded-fault detection count out of 12, and the list of undetected faults
    - the list of schema fields that Arms 1 and 2 show to be missing from committed witnesses

  falsification_conditions:
  - >-
    The classifier fails the separation control - it flags the degree-32
    eigenspace certificate, or fails to flag the degree-16 multiplicity
    certificate. The whole table is then uninterpretable.
  - >-
    P1 resolves as "unconditional, and bnfcertify succeeds on every field ellrank
    constructs for that curve". EV-ECQ-0d142e's exactness claim is then VINDICATED
    with a basis it currently lacks, and part (C) of this proposal is a smaller
    concern than stated. This is a real possible negative for the proposal and it
    is the outcome the design would most like to be wrong about.
  - >-
    P2 fails upward: the horizon exceeds log_10 |d_A| = 60, so record-scale
    exactness is cheaply certifiable. The certifiability concern collapses and the
    question's ladder may carry EXACT labels much further up than predicted.
  - >-
    P4 fails: fewer than 11 of 12 faults are detected. The witness format is
    underspecified and the deliverable becomes the missing fields rather than the
    detection rate.
  - >-
    Every bnfcertify call times out at both budgets, including on the conductor-37
    control. That is an infrastructure outcome, invalidates Arm 2 entirely, and is
    reported as `invalid_measurement`, never as evidence that anything is
    conditional.

  confounders:
  - >-
    PARI VERSION AND DEFAULTS. Whether ellrank calls bnf machinery, and whether a
    bnf is built with a certified or a GRH bound, can depend on version and on
    the value of the relevant defaults. The exact version, build and default
    values are recorded with every run, and the audit's conclusion is scoped to
    them. EV-ECQ-0d142e's numbers came from PARI/GP 2.15.4 with cypari under
    Python 3.11.15, and the audit must run there before anywhere else.
  - >-
    DISCRIMINANT VERSUS COEFFICIENT SIZE. The horizon is fitted against
    log|d_A| but the programme cares about curve coefficient size. The map
    between them is measured (HA-2), not assumed, because a curve with huge
    coefficients can have a small 2-descent field if f factors favourably - and
    the rank-12 curve's f may well factor, which would make its field small and
    its exactness claim cheap to certify. That possibility is the single most
    likely way P1 resolves in the reassuring direction.
  - >-
    CLASSIFIER SUBJECTIVITY. Deciding whether a step is THEOREM or EXHIBITED can
    be argued. Mitigation: the label is decided by a written rule fixed before the
    audit (a step is THEOREM only if a named theorem is cited AND its hypotheses
    are exhibited and checked in the witness), the rule is published with the
    table, and two reviewers label the 9 rungs independently with disagreements
    reported rather than resolved silently.
  - >-
    SEEDED FAULTS ARE NOT REAL FAULTS. Detection of synthetic mutants is only a
    proxy for detection of unseen implementation errors. Mitigated but not removed
    by including the one historically observed real fault as a positive control,
    and declared as a limitation in HA-3.

  interpretation_limits:
  - >-
    NOTHING HERE CERTIFIES OR REFUTES ANY RANK. No rank is computed, none is
    changed, and no hypothesis status moves. The deliverable is a strength column,
    a horizon, and a format.
  - >-
    A rung labelled FLOAT or CONDITIONAL is a statement about its COMMITTED
    WITNESS, not about the mathematics. The underlying rank may be perfectly
    correct and may admit a clean witness nobody has written; the label says only
    that the artifact on disk does not exhibit one.
  - >-
    An adverse finding about EV-ECQ-0d142e's exactness claim is a proposed
    supersession routed to the Coordinator. It does not edit that record, does not
    reduce its certified LOWER bound of 12 (which rests on exhibited points and is
    untouched by any of this), and bears only on the word EXACTLY.
  - >-
    The certifiability horizon is scoped to the tested PARI build, the frozen
    budget, and the tested fields. It is not a theorem about what is certifiable
    and does not preclude a better algorithm.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For a number field A of degree 3 and discriminant d_A, the cost of
      verifying the class and unit group WITHOUT GRH is modelled as proportional
      to the number of prime ideals of norm below the Minkowski bound
      M(A) = (4/pi)^{r_2} (n!/n^n) sqrt|d_A|, i.e. as |d_A|^{1/2 + o(1)}, while
      the cost under GRH is proportional to the number below Bach's bound
      12 log^2 |d_A|, i.e. (log|d_A|)^{2 + o(1)}. The ratio at fixed |d_A| is
      therefore superpolynomial in log|d_A|.
    rigorous_support: >-
      PROVEN BOUNDS FIXING THE QUANTITIES: Minkowski's bound is unconditional and
      exact as stated; Bach's 12 log^2|d_K| generating bound is proven under GRH.
      Both are theorems, and the modelling is only in converting a search bound
      into a cost. CLASSICAL DISTRIBUTION THEOREM IMITATED: Landau's prime ideal
      theorem, under which the number of prime ideals of norm below X is
      X/log X (1 + o(1)), applied to each bound; and Cohen-Lenstra for the
      structure of the class group that the relations must generate.
      OBSTRUCTION DECLARED: real implementations are cleverer than a naive
      norm-bounded enumeration, so the |d_A|^{1/2} figure is an upper bound on the
      unconditional cost of the naive route and not a lower bound on any
      algorithm. The measurement in Arm 2 is what makes the claim empirical rather
      than rhetorical, and no lower bound is claimed anywhere.
    validation_plan: >-
      SAMPLE: at least 20 cubic fields arising as 2-descent fields of curves drawn
      from the 137 certified fibres of certified_curves.json and the 1,206-curve
      pool, chosen to span log_10 |d_A| as widely as the pools allow, plus the
      conductor-37 and conductor-53 control fields at the small end and the
      rank-12 curve's field at the large end. SCALE: 20 to 40 bnfcertify calls at
      two budgets, at most about 40 CPU-hours in the worst case and far less if
      the horizon is low. PREDICTED DISTRIBUTION: log wall clock against
      log_10 |d_A|, fitted against a slope of 1/2 in |d_A| (i.e. a slope of
      (1/2)ln(10) per unit of log_10) for the unconditional arm and against a
      flat-in-|d_A| curve for the GRH arm. TAIL CHECKS: the single largest
      |d_A| certified, and the single smallest |d_A| that timed out - if these
      overlap, the horizon is not sharp and must be reported as an interval rather
      than a number.
  - id: HA-2
    statement: >-
      For an elliptic curve E/Q of naive height H, the discriminant of the cubic
      field A = Q[x]/f(x) attached to its 2-descent satisfies log|d_A| =
      c * log H (1 + o(1)) for a constant c of order 1, and the number of prime
      factors omega(d_A) behaves like that of a random integer of the same size,
      namely log log |d_A| with Erdos-Kac normal fluctuations.
    rigorous_support: >-
      PROVEN BOUND FIXING THE QUANTITY: d_A divides the discriminant of f up to
      square factors, and disc(f) = -(4A^3 + 27B^2) is an explicit polynomial in
      the coefficients, so log|d_A| <= log|disc f| + O(1) = O(log H)
      unconditionally - the upper direction is a theorem and only the constant and
      the lower direction are modelled. CLASSICAL DISTRIBUTION THEOREM IMITATED:
      Hardy-Ramanujan and Erdos-Kac for the number of prime factors of a random
      integer, applied to d_A modelled as a random integer of its size.
    validation_plan: >-
      SAMPLE: all 137 certified fibres plus a 200-curve sample of the 1,206-curve
      pool, for which a-invariants are committed; compute f, disc(f), the maximal
      order and d_A where feasible, and factor d_A where feasible. SCALE: about
      340 curves, minutes for the discriminants, longer for factorisations, which
      are attempted under a frozen budget and reported as incomplete when they
      fail. PREDICTED DISTRIBUTION: the fitted constant c in log|d_A| = c log H,
      with residuals; and the empirical distribution of
      (omega(d_A) - log log|d_A|)/sqrt(log log|d_A|) against the standard normal
      of Erdos-Kac. TAIL CHECKS: the curves with the SMALLEST d_A relative to H -
      these are exactly the curves whose exactness is cheapest to certify, and if
      the rank-12 curve is among them the audit's conclusion is benign; that
      possibility is checked directly rather than left to the fit.
  - id: HA-3
    statement: >-
      The detection rate of a conformance suite against SEEDED faults estimates
      its detection rate against unseen implementation faults (the mutation-testing
      coupling assumption).
    rigorous_support: >-
      PROVEN HALF, and it is the important one: the soundness lemmas of the two
      certificate kinds are theorems - an F_l rank equal to m implies independence,
      and distinct Galois characters imply distinct isotypic components - so a
      correct verifier CANNOT accept a false witness on the mathematics. Every
      residual risk is implementation-level, which is what the suite targets.
      CLASSICAL DISTRIBUTION THEOREM IMITATED: NONE, AND THIS IS DECLARED AS A
      MISSING HALF. Mutation testing has no number-theoretic distribution law
      behind it; this heuristic is justified only by software-engineering practice
      and the gap is recorded here rather than dressed up.
    validation_plan: >-
      SAMPLE: 12 pre-declared seeded faults plus the one historically observed
      real fault (16 points on an isomorphic but different model). SCALE: 13
      mutants times 2 verifier implementations. PREDICTED DISTRIBUTION: none is
      claimed; the reported quantity is a raw detection count with its
      denominator and the explicit list of undetected faults. TAIL CHECK: the real
      historical fault must be detected; failure there invalidates the suite
      regardless of the synthetic score.

  target_complexity:
    time_exponent: >-
      THE CLAIM IS ABOUT VERIFICATION COST, WHICH IS THIS QUESTION'S CURRENCY.
      Rank LOWER bound, exhibited-point route: polynomial - O(r^2 |S| M(log p))
      plus O(r (log H)^2), measured at 1.831 s for r = 31. Rank EXACTNESS via
      2-descent, GRH-conditional: dominated by class and unit group computation at
      (log|d_A|)^{2+o(1)} generating bound, sub-exponential overall in log|d_A| by
      the Hafner-McCurley/Buchmann family. Rank EXACTNESS, UNCONDITIONAL: the
      naive certified route searches to Minkowski, |d_A|^{1/2+o(1)}. CONCRETE
      ARITHMETIC AT THIS PROGRAM'S OWN CURVE: for the rank-12 curve with a6 of
      order 1.4e26, log_10|d_A| is expected near 50 or above, so Minkowski is of
      order 10^25 and Bach's bound is 12 (ln 10^50)^2 which is about 1.6e5 - the
      gap is roughly 20 orders of magnitude, and it is an EXPONENT (|d_A|^{1/2}
      against log^2|d_A|), not a constant.
    memory_exponent: >-
      Audit and classification: negligible, kilobytes. bnfcertify: the relation
      matrix over the factor base, so memory grows with the factor base and is the
      binding resource in practice; the frozen budget is 8 GB and any run that
      breaches it is an infrastructure outcome, not a result. Conformance suite:
      negligible. Stated beside time as the asymptotic-form-honesty rule requires.
    best_known: >-
      For the same job - certify a rank EQUALITY over Q unconditionally with a
      checkable witness - there is no known route in this repository or, so far as
      this session established, in the literature at record coefficient size:
      Klagsbrun-Sherman-Weigandt state their rank-28 determination as subject to
      GRH. For rank LOWER bounds the best known is the exhibited-point route this
      program already implements, and it is unconditional. The honest summary is
      that the two directions have completely different complexity, and this
      question's ladder should say so at every rung.
    hidden_overhead: >-
      DISCLOSED. (i) The o(1) in |d_A|^{1/2+o(1)} hides constants that real
      implementations reduce substantially, so the measured horizon may sit well
      above the naive estimate - which is why Arm 2 measures rather than computes
      it. (ii) The classification depends on an EXISTENTIAL over verification
      paths, so every FLOAT or CONDITIONAL label is an upper bound on the trust
      surface, never a lower bound: a cleaner path may exist. (iii) The
      conformance-suite detection rate has no rigorous distributional backing at
      all (HA-3), so P4 is the weakest-supported prediction in this record.
    tradeoff_note: >-
      THE TRADEOFF IS STRENGTH AGAINST REACH AND IT IS THE ANSWER TO THE
      QUESTION'S TITLE. Lower bounds are unconditional and cheap at every
      coefficient size this program can reach; equalities are cheap only under
      GRH, and unconditional only below a measured horizon. So the ladder
      RQ-ECRANK-27dcc5 asks for has a strength column that must CHANGE VALUE as
      one climbs it, and pretending otherwise is the specific dishonesty this
      question exists to prevent. PARALLELIZATION: the audit and the conformance
      suite are trivially parallel; bnfcertify is not usefully parallel in the
      available implementation and its budget is therefore wall clock, not
      CPU-hours.

  dominated_by: >-
    AS A RANK RESULT - n/a (no rank is claimed, computed or improved by this
    record). AS A DELIVERABLE, every frontier row was checked individually for
    whether it already contains what this proposes. ROWS 1-6 (EV-ECRANK-b6c9b6's
    six rungs): each records a proof_status and boundaries, and the degree-16/32/64
    multiplicity rungs are explicitly labelled "strictly weaker artifacts" - so
    the FLOAT distinction already exists in prose for those rows and this
    proposal's contribution there is to make it a computed column rather than a
    sentence. It does NOT dominate those records; it composes with them. ROW 7
    (EV-ECQ-0d142e): contains a per-claim proof_status breakdown that is the
    closest existing thing to a trust surface and is strictly better than a naive
    label for that one record - so on the classification axis this proposal is
    DOMINATED by that record's own hand-written breakdown for row 7 alone, and
    adds value only by extending the same discipline to the other eight rows and
    by auditing the one thing that breakdown asserts without checking. ROW 8
    (RUN-ECQ-f5af06-v2-A-certify): already carries a named re-verification command
    and independent controls, so it is already close to conformance-suite quality
    and this proposal adds the seeded faults it does not have. ROW 9 (GOAL-ECQ-e72c0b's
    completion criterion 3): DOMINATES the schema half of Arm 3 outright for the
    Cremona-Brumer certificate kind - it already enumerates character basis, good
    primes, point and torsion rows, exact F2 matrix, matrix rank, torsion-row
    rank and halving witnesses - so Arm 3 must be written as an EXTENSION of that
    list to the eigenspace certificate kind, not as a fresh format, and claiming
    otherwise would duplicate committed work. THE ONE THING NO ROW CONTAINS is the
    GRH audit and the certifiability horizon.
  sota_delta: >-
    QUANTITATIVELY. (i) Number of rungs in this question's ladder carrying a
    COMPUTED strength label: 0 today (one record carries a hand-written per-claim
    breakdown, eight do not); target 9. (ii) GRH status of the program's only
    exact-rank claim over Q: UNAUDITED today; target - determined, with the code
    path named and bnfcertify run. (iii) Certifiability horizon in log_10|d_A|:
    does not exist as a number anywhere in the repository; target - a fitted value
    with a stated budget and an interval. (iv) Verification cost gap between a
    rank lower bound and a rank equality: currently unstated; target - the
    explicit pair (polynomial in log H) against (|d_A|^{1/2+o(1)} unconditional,
    (log|d_A|)^{2+o(1)} under GRH), with concrete arithmetic at this program's own
    rank-12 curve. (v) Seeded-fault detection rate of an independent verifier: no
    measurement exists; the only data point is one real fault caught once. ZERO
    delta on certified rank at every field degree, and zero on the world record.

  estimated_cost:
    compute: >-
      Arm 1: minutes, all reading. Arm 2: up to about 40 CPU-hours worst case for
      20 to 40 bnfcertify calls at two budgets, very likely far less because the
      large fields will time out fast at the small budget. Arm 3: about 2
      CPU-hours. Memory capped at 8 GB for Arm 2 and negligible elsewhere.
    wall_clock_seconds_estimate: 160000
    human_or_agent_effort: >-
      One Executor task for Arms 2 and 3; the labelling in Arm 1 is a reviewer
      task and should be done by TWO reviewers independently, with disagreements
      reported, because the label rule is the part most exposed to judgement. Arm
      1 alone is a few hours and already produces the strength column.
    inputs_required: >-
      Committed artifacts for all nine rungs; PARI/GP 2.15.4 with cypari matching
      the environment EV-ECQ-0d142e's numbers came from; the PARI documentation
      and ellrank source, which require either a local installation or a network
      read - and the network read is the only external dependency in this
      proposal, recorded rather than assumed.
    risk_of_zero_information: >-
      Low. The weakest branch is P1 resolving as "unconditional and certified",
      which vindicates a committed claim and still produces the horizon and the
      strength column. The only genuinely empty outcome is total bnfcertify
      failure including on the small controls, which would be an environment
      problem reported as such.

  recommended_priority: medium
