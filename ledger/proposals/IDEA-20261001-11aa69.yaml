  title: >-
    IS usable_dimensions=∅ THE RIGHT STRUCTURAL GATE WHEN ord_n(2)=n-1?
    On primes n with ord_n(2)=n-1 the Part-1 census reports empty usable
    sets; pre-register a gate that refuses any non-empty usable readout
    and test it on a locked list of n (including forced-negative primes
    with ord_n(2)=n-1) before any factor-base construction.

  class: heuristic_validation

  claim: >-
    EXP-BINSTD-178742 Part-1 reports usable_dimensions=[] at n=131 and
    n=163 where ord_n(2)=n-1, matching the forced-negative design
    expectation (IR-3 / usable empty). CLAIM: for a Stage-0-frozen list of
    ≥10 odd primes with ord_n(2)=n-1, the derived usable set is empty in
    both routes, AND injecting a synthetic non-empty usable set is
    rejected by a preregistered gate with failure_signature logged —
    while at least one control prime with ord_n(2)<n-1 yields a non-empty
    usable set. CLAIM TIER: observational / instrument. NO exponent.
    NO break. NO FB construction at deployed size.

  mechanism: >-
    OBJECT FRAME. Representation R1: F_2-subspace dimensions stable under
    x↦x^2 on F_{2^n}, derived from d=ord_n(2). Operation set: the Part-1
    census routes already frozen. Trichotomy: Class I structural gate.
    Lossy-projection test: a null that forces a fake usable dimension
    must be caught. OFF-LIMITS: building deployed factor bases; Semaev;
    Part-2 ranks. WHAT IS NEW: turns the empty-usable observation at
    n=131/163 into a preregistered gate with forced-negative and positive
    controls, rather than a one-off census footnote.

