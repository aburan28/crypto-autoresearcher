idea:
  id: IDEA-20261017-845d35
  question_id: RQ-SBRG-f31cb2
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Certificate sharing: how many targets does ONE degree-D refutation certificate
    refute? An exact pairwise decision by linear algebra on the target-affine
    pencil, with a planted positive and a random-pencil null
  class: measurement
  claim: >-
    (A) For a refuted target r (1 in the degree-D Macaulay row space) a
    certificate is (mu,lambda) with mu*S + lambda*T(r) = e_1, S the structural
    rows, T(r) = T_0 + sum_i r_i T_i affine in r (IDEA-20261017-5f29b6). (B) EXACT
    SHARING LAW. The same certificate refutes r' = r+delta iff
    lambda*(sum_i delta_i T_i) = 0. The targets one certificate refutes form the
    coset r + ker L_lambda, L_lambda = [lambda T_1; ...; lambda T_n], of dimension
    n - rank L_lambda: a rank, no search. (C) PAIR TEST. Refuted r and r' share a
    certificate iff the linear system in (mu,lambda), mu*S + lambda*T(r) = e_1 and
    lambda*(T(r)+T(r')) = 0, is solvable. Observable pi_share = fraction of
    refuted pairs sharing. (D) PREDICTION E-point: pi_share = 0 at chained t=3 and
    balanced t=4, n in {9,11}, D in {3,4}. Support, not proof: at m = 2, n = 17
    K_rank = n, so a fixed schedule survives on one target (derivation note
    Lemma 2); for the constant-multiplier trace certificate lambda = r^{-2} the n
    columns lambda*T_i are independent (notes). E-share: pi_share >= 1e-3 or a
    certificate with n - rank L >= 1 means refutations compress into a library of
    affine subspaces, priced in target_complexity.
  mechanism: >-
    PAIR. R1 (F_2 bit coordinates of x), Sigma = additive translations of the
    target bit vector (not group translation). Trichotomy: coordinate-dependent.
    LOSSY-PROJECTION TEST. The tracked object is the coset Omega_lambda of targets
    refuted by lambda; it discards mu, the rows and the pivots, and is exact under
    Sigma: translation by ker L_lambda fixes Omega_lambda by construction. Many
    certificates share one Omega, so it is lossy. Differs from replay
    (KR-IC-f3da82, EXP-CERTBIN-4e92d7): replay asks whether pivots repeat, this
    asks whether ANY certificate does. Factor base: explicit subspace, inside the
    scoped-out class of KN-OPEN-020. Stage: relation decomposition (filter). Probes
    the compressed class left open by IDEA-20260829-66a876 and -57b1eb, for the
    operational refutation set rather than the exact reachable set.
  novelty_status: unverified
  citations:
    - ref: EXP-CERTBIN-4e92d7
      provenance: internal
      claim: analysis.md, m=2 n=17 D=4, 84 percent of unsat targets carry a degree-4 refutation (0 in same-support nulls), K_rank = 17; chained m>=3 rate unmeasured.
      verified_by: Read analysis.md in full 2026-10-17.
  predictions:
    - metric: pi_share, exact pair test on 20000 refuted pairs per cell plus all Hamming-1 refuted neighbors
      direction: different
      minimum_effect: "E-point 0/20000 (CP95 upper 1.5e-4); E-share >= 1e-3"
    - metric: d_star = best n - rank L_lambda over lambda + left kernel (greedy, 200 restarts)
      direction: higher
      minimum_effect: "d_star >= 1 in some cell, else certificate reuse is closed there"
    - metric: planted positive, pencil with a universal component of dimension d_p
      direction: different
      minimum_effect: d_star = d_p exactly, blocking
  minimal_test:
    design: >-
      Stage 0 zero compute: rank lemma for the trace certificate. Stage 1 planted
      positive and random-pencil null. Stage 2 n=9, D in {3,4}; Stage 3 n=11.
      Refuted set from exhaustive targets (512 and 2048); factor base dimension
      chosen so the satisfiable fraction is 0.3 to 0.7.
    controls:
      - Random pencil, same support histogram (generic sharing rate).
      - Fresh random target block per target, no affine structure.
      - Planted universal component.
    required_metrics: [refuted fraction, left-kernel dimension, pi_share, d_star, library size, peak RSS]
  falsification_conditions:
    - Planted positive not recovered exactly (instrument defect, halt).
    - pi_share in the real system not above the random-pencil null in any cell (generic, nothing Semaev-specific).
    - pi_share = 0 and d_star = 0 everywhere: named obstruction, certificates are target-specific at the tested cells.
  confounders:
    - Greedy d_star is a lower bound (MinRank); a zero is scoped to the procedure.
    - Refutation rate depends on the class of x_R in E/2E; report per class.
  interpretation_limits:
    - Toy cells, Macaulay closure not F4. No exponent. A positive needs closed-form derivation before it is an algorithm.
  heuristic_assumptions:
    - id: H1
      statement: For a refuted pair in a random pencil of this shape the sharing system is solvable with probability at most 2^{-(c - s)} (c columns, s left-kernel dimension).
      rigorous_support: Solvability count of a random affine system over F_2; Schwartz-Zippel style union bound.
      validation_plan: 20000 pairs per cell on random pencils of the same shape; report observed rate against the bound, worst cell separate.
  target_complexity:
    time_exponent: "None claimed. A library of L affine subspaces of dimension d costs L*(n-d)*n/64 word operations per target; an exponent moves only if L = poly(n) and d = Theta(n)."
    memory_exponent: "L*n*(n-d) bits for the library; build cost at least L refutation eliminations."
    best_known: Pollard rho 0.886*sqrt(N), O(1) memory (KR-RHO-13bf67); per-target elimination (KR-IC-f3da82).
    hidden_overhead: Library build is L fresh eliminations; finding low-rank lambda is MinRank, hard in general.
  dominated_by: Pollard rho on every axis; no attack claimed.
  sota_delta: None. Deliverable is pi_share, d_star, or a measured obstruction.
