      Nothing here depends on any paper.

  lossy_projection_identifiability_audit:
    projection: >-
      A candidate ladder cell (a full system, its support, its Macaulay matrix,
      its exact rank, its seeds) projected to the GAP VECTOR
      (|C1-C2|, |C1-C3|, |C2-C3|) computed from (n, D, u_D, |V|) alone.
    what_is_discarded: >-
      The measured rank itself, and everything that produces it: the equations,
      the seeds, the pivoting order, the chunking. Also discarded: which
      candidate is correct - the gap vector is symmetric and says nothing about
      truth.
    why_genuinely_lossy: >-
      Genuinely lossy: infinitely many distinct systems share a gap vector,
      because the gap vector depends on the support only through the single
      integer u_D and on the variety only through |V|. Nothing about the actual
      equations survives.
    why_compatible_with_the_operations: >-
      Compatible with the operation that matters, which is CELL SELECTION: the
      gap vector is computable from the parameters that define a cell BEFORE the
      cell is built, and it propagates deterministically under the operations
      cell design allows (changing n, changing D, changing how much support is
      deleted). It is NOT compatible with inference about which candidate is
      right, and the record must never be cited that way.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR BOTH NAMED FAILURES, AND THE MIRROR FAILURE IS THE ONE THAT
      NEARLY BITES. Change of coordinates: NO - the measured rank cannot be
      recovered from the gap vector, so information is genuinely destroyed
      (contrast the (Delta, Pi) = (x XOR y, x*y) char-2 case where the pair is
      recoverable from the roots of t^2 + Delta t + Pi and nothing is gained).
      Constant across instances: NEARLY, AND THE NEAR-MISS IS THE FINDING.
      Over Region I at D = 6 and n = 10..13 the gap vector is CONSTANT - it is
      identically (0,0,0) - which is exactly the mirror failure of zero
      comparator spread, and it is the reason those cells are worthless. Over
      the full declared cell space it is NOT constant: it ranges from (0,0,0) to
      gaps of order 10^5 in Region II. So the projection passes the test on the
      space it is defined over, and the sub-region where it FAILS the test is
      precisely the deliverable. I checked for the constancy failure explicitly
      and it returned a nonzero spread globally with an identified constant
      sub-region.

  assumptions:
    - >-
      That every relevant cell has u_k = 0 for k < D with the whole deficiency
      in degree exactly D. This is the shape of every committed cell
      (H-SDEG-0dd021 records it as VERIFIED PER CELL, never assumed), but it is
      a property of the constructions used so far, not a theorem. A support that
      violates it changes the phase analysis, and the audit must therefore
      report u_k for all k < D at every cell it maps rather than assuming zeros.
    - >-
      That |V| stays in the 0-to-6 range observed. The C2 = C3 collapse in
      Region I needs only |V| below the partial sum, which has ~10^4 of slack,
      so this is robust; but the audit computes the exact |V| threshold at which
      the collapse would break and reports it rather than waving at it.
    - >-
      That the three frozen candidates are the family of interest. If the SDEG
      gate refutes all three, the map's forward use changes from "choose a cell"
      to "here is what a fourth candidate would have to be distinguished on",
      and the record says so in advance rather than being repurposed after.

  predictions:
    - metric: >-
        exact reproduction of the nine committed structural anchors by the
        independent skeleton implementation
      direction: different
      minimum_effect: >-
        9 of 9 EXACT integer matches, zero tolerance: sr_pred(9,3..6) =
        180/1,674/9,504/28,068, sr_pred(12,3..6) = 312/3,834/29,418/156,520,
        N(24,6) = 190,051, nrows(9,6) = 45,324, nrows(12,6) = 183,312,
        nrows(12,5) = 31,512, HF(9) = [1,18,144,645,1566,738,0], phi_full(9) = 6,
        and A = 174,033 at u_6 = 16,018. Any miss means the skeleton is misread
        and NOTHING downstream may be reported. This has been computed once
        already this session and returned 9 of 9; the contract re-runs it
        in-harness because a scratch computation outside the harness is not a
        result.
    - metric: >-
        Region-I separation constant Sep_I(n, D=6) for n in {10, 11, 12, 13}
      direction: different
      minimum_effect: >-
        EXACTLY 0 at all four, for the structural reason phi_full(n) = 7 = D+1.
        A nonzero value at any of the four falsifies the phase analysis and this
        proposal's headline.
    - metric: >-
        Region-II threshold u*(13, 6) = h_6(13)
      direction: higher
      minimum_effect: >-
        EXACTLY 106,743, i.e. 21.38 per cent of N(28,6) = 499,178. If the
        realised u_6 of a naturally constructed n = 13 support falls below this,
        the cell is predicted uninformative BEFORE it is built - the single most
        actionable output of the map.
    - metric: >-
        smallest nonzero pairwise gap at each mapped cell, divided by the
        measured seed-to-seed spread of extra_D at that cell
      direction: higher
      minimum_effect: >-
        A cell is declared INFORMATIVE only at ratio > 3. This threshold is
        registered before any cell is mapped. Cells whose ratio falls below 3
        are reported as noise-limited rather than as failures, which localises
        the limitation to measurement rather than to model.
    - metric: >-
        number of cells in the declared space {n in 9..15} x {D in 5,6} whose gap
        vector is identically zero over the whole feasible u_D range
      direction: different
      minimum_effect: >-
        PREDICTED 1: only (n=9, D=5), where phi_full = 6 = D+1 makes Sep_I = 0
        AND the Region-II branch is reachable, so the honest prediction is that
        the count of cells with zero separation over the ENTIRE u range is 1 or
        0 and the count with zero separation over Region I is 5. The audit must
        report both counts separately, because conflating them would overstate
        the finding.

  minimal_test:
    design: >-
      Two stages, both cheap; the whole thing runs in under a minute of pure
      Python and can be checked by hand.
      STAGE 0 (the gate that can end the line): re-implement the five-line
      skeleton in-harness and reproduce the nine committed anchors. If any
      anchor misses, STOP - the reading of the frozen closed form is wrong and
      no map may be produced.
      STAGE 1: sweep (n, D, u_D) over n in 9..15, D in {5,6}, and u_D over its
      feasible range in 200 steps; evaluate C1, C2, C3; emit the gap vector, the
      phase label, u*, Sep_I, and the informative/noise-limited verdict per cell.
      Emit the cheapest-first ordering of cells that separate all three
      candidates, with each cell's column count N(nb,D) as its cost proxy.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL): the
        FULL-SUPPORT cell, u_D = 0, at every (n, D). FORCED VALUE derived before
        the run: the gap vector must be exactly (Sep_I, Sep_I, 0) - i.e. C2 and
        C3 must coincide exactly and C1 must differ by exactly
        sum_{D<k<phi_full} h_k - and in particular EXACTLY (0,0,0) at
        (n, D) = (10..13, 6). THIS NULL CAN FAIL: if the implemented candidates
        do not coincide at u_D = 0 where the algebra says they must, the
        implementation of C1/C2/C3 is wrong and every mapped cell is void.
      - >-
        POSITIVE CONTROL (the effect MUST appear): the committed n = 12, D = 6,
        u_6 = 16,018 cell. All three candidates MUST separate there, with
        pairwise gaps of order 10^4, because it is the anchor the whole gate is
        built on. If the map reports that cell as uninformative, the map is
        broken and NO conclusion about any other cell may be drawn.
      - >-
        SECOND POSITIVE CONTROL, ZERO COMPUTE, ON MY OWN ARITHMETIC: the derived
        column count A = N(nb,D) - u_D must equal the committed ncols 174,033 at
        the anchor cell and 174,035 at the seed-2026 cell with u_6 = 16,016.
        These are exact integer identities against committed values, not
        similarity of curves.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: sweep u_D
        across the phase boundary at fixed (n, D) = (12, 6) through
        u_6 in {0, 2000, 5000, 7494, 10000, 16018, 25000} and report each
        pairwise gap. PREDICTED: all gaps identically 0 below 7,494; a
        discontinuity exactly at 7,494; then C2's gap growing linearly in u_6
        while C1's and C3's are flat. A gap that moves BELOW the threshold
        localises an error in the phi_F determination rather than leaving "the
        map is wrong".
      - >-
        SECOND GRADED CONTROL on the parameter meant to destroy the effect:
        sweep n at fixed D = 6 through n = 9..15 and report Sep_I(n). PREDICTED
        NON-MONOTONE: empty region at n = 9, then 0, 0, 0, 0 at n = 10..13, then
        14,277 and 53,610 at n = 14, 15. A monotone answer would mean phi_full
        was computed wrongly.
      - >-
        ARCHIVE CHECK (zero compute): searched this session for a prior
        pre-dispatch power calculation over the DREG/SDEG cell space.
        EXP-SDEG-f7faa8 publishes all three candidates' predictions at four
        already-measured cells and at five reported cells; no record was found
        that computes separation over unbuilt cells. Recorded as a negative
        search result, not as proof none exists.
    required_metrics:
      - the nine anchor reproductions, exact, with the implementation attached
      - h_k and phi_full for n = 9..15, with the generating function stated
      - u*(n,D) and Sep_I(n,D) tables for D = 5 and D = 6
      - the full gap vector as a function of u_D at each (n,D), with the phase boundary marked
      - the seed-spread comparison and the informative/noise-limited verdict per cell
      - the cheapest-first ordering of separating cells with N(nb,D) as the cost proxy

  falsification_conditions:
    - >-
      Any of the nine committed anchors fails to reproduce. The skeleton is
      misread; nothing may be reported.
    - >-
      Sep_I(n, 6) is nonzero for any n in {10,11,12,13}. The phase analysis is
      wrong and the headline is withdrawn as a superseding record.
    - >-
      The null control fails: C2 and C3 do not coincide at u_D = 0. The
      candidate implementation is wrong.
    - >-
      The positive control fails: the anchor cell is reported uninformative.
      The map is broken.
    - >-
      Committed cells are found whose u_k is nonzero for some k < D. The
      two-phase derivation's antecedent does not hold generally and the map must
      be recomputed over the true (u_0, ..., u_D) vector rather than over u_D
      alone.

  confounders:
    - >-
      SEED SPREAD VERSUS SEPARATION. A nonzero gap is useless if it is smaller
      than the seed-to-seed movement of the measured quantity. The committed
      record already shows movements of order 1-3 in ranks and column counts;
      the audit reports the ratio rather than the gap alone, and declares
      noise-limited cells as such.
    - >-
      u_D IS SEED-DEPENDENT. H-SDEG-0dd021 records that "the support data itself
      is seed-dependent", so a cell's phase is not fully determined by (n, D)
      and a construction targeting Region II can miss. The map must therefore
      report, for each proposed construction, the MARGIN u_D - u* rather than
      only the phase label.
    - >-
      SCOUT-COMPUTED, NOT IN-HARNESS. Every number in this record was computed
      by me in this session in a scratch interpreter, outside the harness and
      outside any run manifest. It reproduces nine committed anchors, which is
      strong, but it is NOT a run and must be re-derived in-harness before any
      record cites it. This label travels with every figure above.
    - >-
      THE MAP IS FOR THREE FROZEN CANDIDATES ONLY. It says nothing about a
      fourth rule, and if the gate refutes all three the map's use changes -
      which is stated in advance so it cannot be repurposed after the fact.
    - >-
      IT IS EASY TO READ "CELL X CANNOT SEPARATE" AS "DO NOT RUN CELL X". A
      cell can be worth running for reasons outside this map - to measure the
      seed spread, to extend the anchor set, to test HEUR-BF-1. The map bounds
      one specific kind of information and no other.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ECDLP CLAIM. This is a design calculation about
      a BOOLEAN GF(2) rank instrument. Boolean is not prime-field, the gap is
      carried on every citation exactly as H-SDEG-0dd021 requires, and nothing
      here bears on any prime-field cost, any d_reg growth law, or KN-OPEN-002.
      Pollard rho remains the ECDLP baseline and sota_delta is zero on every
      attack axis.
    - >-
      NO POSITION IS TAKEN on whether C1, C2 or C3 is correct, on whether the
      SDEG Stage-1 gate passes, or on the residual mechanism of the 7,110
      arm-R defect, which remains open.
    - >-
      NO STATUS CHANGE and NO next_action rewrite is proposed or implied
      (AGENTS.md rule 1), and nothing here recommends against expanding the DREG
      ladder - it says which rungs are worth the money and, notably, that the
      cheapest separating rungs are BELOW n = 12, not above it.
    - >-
      A cell declared uninformative for the collapse rule may still be
      informative for something else, and the record must not be cited as
      closing a cell.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NOT LOAD-BEARING. The two-phase structure follows from the frozen
        definitions by case analysis on the sign of s_D = h_D - u_D, and the
        Region-I collapse C2 = C3 follows from |V| being far below the partial
        sum. Both are arithmetic given the definitions.
      rigorous_support: >-
        Case analysis on sign(s_D) plus the observed |V| in {0,1,6} against
        partial sums of order 10^4.
      validation_plan: >-
        The graded control sweeps u_D across the phase boundary and must show
        the discontinuity at exactly u_D = h_D.
    - id: H2
      statement: >-
        FORALL cells (n, D) in the declared space and FORALL admissible supports,
        u_k = 0 for every k < D.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL CLAIM AND NOT JUSTIFIED BY ONE. It is an empirical
        regularity of the constructions used so far, recorded as VERIFIED PER
        CELL in H-SDEG-0dd021, and it is this proposal's weakest link: the whole
        two-phase reduction to a single parameter u_D depends on it.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Any committed or newly built cell with u_k > 0 for some k < D. The map
        must then be recomputed over the full deficiency vector, and the
        single-parameter phase picture is void.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED OR CLAIMED, and this proposal is explicitly not
      exponent-first work. The exponent it stands at a distance from is the
      solving-degree growth question KN-OPEN-002 asks over PRIME fields, which a
      boolean ladder at n <= 15 does not reach and which nothing here advances.
    memory_exponent: >-
      n/a as a claim, but memory is the operative cost here and is stated: a
      cell's Macaulay matrix has N(nb,D) columns - 190,051 at n = 12 D6 and
      499,178 at n = 13 D6 - and the committed n = 12 cell peaked at 7.16 GB.
      The map's cost proxy is that column count, so a cell's information is
      weighed against its memory rather than against wall clock.
    best_known: Pollard rho / BSGS at N^{1/2}. Untouched.
    hidden_overhead: >-
      The overhead this proposal makes visible is the cost of a cell that could
      not have distinguished anything - which at n = 13 D6 is a 499,178-column
      exact GF(2) rank.
    tradeoff_note: >-
      The map's central trade: separation power rises with u_D only after the
      threshold u* = h_D, while cost rises with N(nb,D) regardless. Since h_D
      grows quickly in n (7,494 at n = 12, 106,743 at n = 13 for D = 6) while
      N(nb,D) also grows, the information-per-column is MAXIMISED at the SMALL
      end of the ladder, which inverts the natural instinct to extend upward.

  dominated_by: >-
    n/a (no algorithm, no attack, no cost claim against any ECDLP baseline, so
    no Pareto point). Rows checked before writing that: nothing here offers
    time, memory, or data/query cost against Pollard rho, BSGS, van
    Oorschot-Wiener, or any index-calculus variant, because no algorithm is
    proposed. On the QUESTION it serves - which ladder cell to build next - the
    incumbent artefacts are GOAL-DREG-001's next_action (which names CTRL-B and
    n = 21 without a power argument) and EXP-SDEG-f7faa8 (which evaluates fixed
    cells), and this record supersedes neither. Checked for a prior power
    calculation: EXP-SDEG-f7faa8, H-SDEG-0dd021, GOAL-DREG-001, GOAL-SDEG-001,
    and the 30 prior ideas in this goal's brief. None computes separation over
    unbuilt cells. Absence of a search result is not evidence none exists.
  sota_delta: >-
    Zero on every attack axis. Quantitatively the delta is a design table the
    corpus does not have: five (n, D) cells at D = 6, n = 10..13 plus n = 9 at
    D = 5, whose Region-I separation among all three frozen candidates is
    EXACTLY 0; a Region-II threshold of 106,743 deleted columns (21.4 per cent
    of 499,178) for the n = 13 D6 rung against 16,018 (8.4 per cent of 190,051)
    at the committed n = 12 rung; and a cheapest-first ordering that places the
    separating rungs at n = 10 and n = 11 (thresholds 803 and 3,322 on matrices
    of N(22,6) and N(23,6) columns) rather than at n = 13 or above.

  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.75 that the two-phase map survives review as computed, and 0.90 that the
    nine-anchor reproduction survives (it has already been performed once this
    session and returned 9 of 9). 0.75 is not higher because the reduction to a
    single parameter u_D rests on H2 - that u_k = 0 for k < D at every cell -
    which is an empirical regularity of past constructions rather than a
    theorem, and because I may have misread the exact bracketing of C1's sum
    (sum_{k<phi_F} versus sum_{k<=phi_F}), a one-index question that changes
    Sep_I and that a reviewer should check first. It is not lower because the
    Region-I collapse C2 = C3 needs only |V| to be far below a partial sum of
    order 10^4, which is not close, and because the D = 6 zeroes come from an
    EMPTY index set rather than from a numerical cancellation, so they cannot be
    slightly wrong - they are either exactly right or the phi_full values are
    wrong, and those reproduce a committed anchor at n = 9.
