idea:
  id: IDEA-20260805-61f7f4
  question_id: RQ-DREG-001
  added: '2026-08-05'
  goal_id: GOAL-PATH-001
  title: >-
    Before choosing "expand DREG ladder" from this goal's own next_action,
    compute which ladder cells can distinguish anything: a zero-compute
    discriminating-power map over (n, D, u_D) whose forced value is that at
    D = 6 and n in {10,11,12,13} every cell with u_6 below h_6 makes ALL THREE
    frozen collapse candidates predict the IDENTICAL rank
  class: control

  claim: >-
    GOAL-PATH-001's next_action offers "expand DREG ladder under CTRL-B" as one
    of three options for its single next batch. A ladder cell costs hours of
    exact GF(2) rank on a matrix with up to 5x10^5 columns - EV-DREG-004 records
    a destroyed checkpoint at 194,000/778,394 columns and a measured
    carrier-codec bottleneck, and TASK-20260731-016's n=12 D6 cell took 1,623.8 s
    at 7.16 GB peak RSS. NOBODY HAS ASKED, BEFORE PAYING THAT, WHAT A NEW CELL
    COULD POSSIBLY SEPARATE.
    The question is answerable at zero compute, because the three frozen
    collapse candidates C1/C2/C3 (H-SDEG-0dd021 assumptions clause 8) are
    closed-form functions of quantities that need no rank computation. Working
    from the frozen closed form's own skeleton -
      H_n(z) = (1+z)^{nb(n)} (1+z^2)^{-n} (1+z^3)^{-n},  h_k = [z^k] H_n,
      s_k = h_k for k < D,  s_D = h_D - u_D,  phi_F = min{k : s_k <= 0},
      C1: Q = sum_{k<phi_F} s_k;  C2: Q = max(|V|, sum_{k<=D} s_k);
      C3: Q = |V| if D >= phi_F else sum_{k<=D} s_k
    - the candidates' predictions separate into TWO PHASES in the single
    parameter u_D, with the phase boundary at u_D = h_D:
      REGION I (u_D < h_D): phi_F = phi_full > D, so C1's Q exceeds C3's by
        exactly sum_{D<k<phi_full} h_k, and C2 EQUALS C3 whenever that partial
        sum exceeds |V| - which it does at every cell in the ladder, since |V|
        is measured at 0, 1 or 6.
      REGION II (u_D >= h_D): phi_F = D, C1's Q collapses to sum_{k<D} h_k and
        becomes INDEPENDENT of u_D, C3's Q collapses to |V|, and all three
        separate.
    THE FORCED VALUE IS THE REGION-I SEPARATION CONSTANT sum_{D<k<phi_full} h_k,
    AND AT D = 6 IT IS ZERO. Computed in this session by an independent
    pure-Python implementation of the skeleton (SCOUT-COMPUTED, re-run
    in-harness before citing): phi_full(n) = 6, 7, 7, 7, 7, 8, 8 at
    n = 9..15, so at D = 6 the sum over D < k < phi_full is EMPTY for
    n in {10,11,12,13} and the Region-I separation is exactly 0. In plain terms:
    AT D = 6, FOR n = 10, 11, 12 AND 13, ANY CELL WHOSE SUPPORT LEAVES
    u_6 < h_6 MAKES C1, C2 AND C3 PREDICT THE SAME RANK, SO THAT CELL CANNOT
    DISTINGUISH THEM NO MATTER HOW WELL IT IS MEASURED. The thresholds are
    h_6(n) = 803, 3,322, 7,494 and 106,743 at n = 10, 11, 12, 13. The committed
    n = 12 arm-R cell sits at u_6 = 16,018 > 7,494 - comfortably in Region II,
    which is exactly why it is informative. Extending the same construction to
    n = 13 requires a support with u_6 >= 106,743 out of N(28,6) = 499,178
    columns, i.e. deleting 21.4 per cent of the column space against the 8.4 per
    cent the n = 12 cell deletes. THAT IS A CONSTRUCTION CONSTRAINT ON THE NEXT
    BATCH, DERIVED BEFORE THE BATCH IS DISPATCHED, AND IT DOES NOT EXIST
    ANYWHERE IN THE COMMITTED RECORD.
    THE SKELETON IS NOT ASSUMED - IT IS VALIDATED FIRST. The same independent
    implementation reproduces, exactly, every committed structural anchor of the
    lineage: sr_pred(9, 3..6) = 180 / 1,674 / 9,504 / 28,068;
    sr_pred(12, 3..6) = 312 / 3,834 / 29,418 / 156,520; HF(9) = [1, 18, 144,
    645, 1,566, 738, 0]; N(24,6) = 190,051; nrows(9,6) = 45,324;
    nrows(12,6) = 183,312; nrows(12,5) = 31,512. Nine committed integers, nine
    exact matches, from a from-scratch implementation.
    THIS PROPOSAL CLAIMS NOTHING ABOUT WHICH CANDIDATE IS RIGHT and takes no
    position on the SDEG gate. It supplies the power calculation that decides
    WHERE to spend the next ladder cell, and it is worth having whichever way
    that gate resolves.

  object_first_candidate:
    tracked_object: >-
      THE SEPARATION BETWEEN COMPETING MODELS, as a function of the cell
      parameters, followed before any measurement exists: (n, D, u_D) ->
      Hilbert coefficients h_k -> restricted series s_k -> effective freeze
      degree phi_F -> the three predicted ranks -> their pairwise gaps. The
      tracked object is the GAP VECTOR (|C1-C2|, |C1-C3|, |C2-C3|), not any
      individual prediction and not any measured rank. A cell whose gap vector
      is zero is a cell that cannot inform, and the map of where that happens is
      the deliverable.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: index calculus and point decomposition;
      prime-field Semaev cost modelling; isogeny and endomorphism transfer;
      lattice methods; generic-group bounds; factor-base geometry; relation
      supply. None is the lens. This proposal proposes no attack, no new
      solving-degree model, and no new collapse rule. It computes the a-priori
      resolving power of an already-frozen candidate family over an already-
      declared cell space - a design calculation, not a mechanism.
    newness_score: >-
      The algebra is elementary and the candidate family is not mine: C1/C2/C3
      are frozen verbatim in H-SDEG-0dd021 and the skeleton is the lineage's
      own. What is new in this corpus is the DIRECTION of the computation.
      EXP-SDEG-f7faa8 evaluates the three candidates at four FIXED, ALREADY
      MEASURED cells and requires that all three predictions be published there.
      It does NOT, and does not claim to, compute for CANDIDATE FUTURE cells the
      region of u_D in which the candidates are provably indistinguishable. That
      inversion - power map before dispatch, rather than prediction table after
      measurement - is the whole content, and it is the calculation PATH's own
      next_action needs and does not have.
    testability_score: >-
      Total and free. Every number is an integer coefficient of a rational
      generating function, computable exactly in pure Python in milliseconds,
      and the skeleton is validated against nine committed integers before any
      new number is trusted. Measured this session: numpy 2.4.6 imports (not
      needed); Sage does not (not needed).
    survival_score: >-
      The object survives exactly as far as the frozen candidate family and
      stops there, and the record says so before anything is run: a power map
      over C1/C2/C3 says nothing about a fourth candidate nobody has written,
      and if the gate refutes all three the map's value is that it tells the
      next model-builder which cells could have distinguished them.

  mechanism: >-
    COMPUTED IN THIS SESSION FROM THE FROZEN DEFINITIONS. Every formula below is
    quoted from H-SDEG-0dd021 assumptions clauses (1)-(9), which were READ IN
    FULL; nothing is imported from outside the repository, and the
    semi-regularity literature is NOT cited because it was not read.

    (1) SKELETON AND ITS VALIDATION. nb(n) = n + 3*ceil(n/3); the system has n
    equations of degree 2 and n of degree 3; the untruncated boolean/Koszul
    series is H_n(z) = (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n} with h_k = [z^k] H_n
    and phi_full(n) = min{k : h_k <= 0}; N(nb,D) = sum_{j<=D} C(nb,j);
    sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+ under positive truncation;
    nrows(n,D) = n*N(nb,D-2) + n*N(nb,D-3). An independent from-scratch
    implementation of exactly these five lines reproduces nine committed
    integers with zero discrepancy (listed in `claim`). THAT REPRODUCTION IS THE
    PRECONDITION FOR EVERYTHING ELSE and is reported first; a power map computed
    from a skeleton that did not reproduce the anchors would be worthless.
    Measured coefficients, SCOUT-COMPUTED this session:
      n=9  nb=18 h = [1, 18, 144, 645, 1566, 738, -8097, ...]   phi_full=6
      n=10 nb=22 h = [1, 22, 221, 1310, 4840, 9934, 803, ...]   phi_full=7
      n=11 nb=23 h = [1, 23, 242, 1507, 5885, 13024, 3322, ...] phi_full=7
      n=12 nb=24 h = [1, 24, 264, 1724, 7104, 16920, 7494, ...] phi_full=7
      n=13 nb=28 h = [1, 28, 365, 2899, 15288, 53495, 106743, ...] phi_full=7
      n=14 nb=29 h = [1, 29, 392, 3234, 17766, 65156, 139209, 14277, ...] phi_full=8
      n=15 nb=30 h = [1, 30, 420, 3595, 20550, 78906, 180190, 53610, ...] phi_full=8

    (2) THE TWO-PHASE STRUCTURE, DERIVED. At a cell with u_k = 0 for k < D and
    u_D = u (the shape every committed cell exhibits), s_k = h_k for k < D and
    s_D = h_D - u. Since h_k > 0 for all k < D in the whole ladder, phi_F is
    determined by the sign of s_D alone:
      u <  h_D  =>  s_D > 0  =>  phi_F = phi_full  (REGION I)
      u >= h_D  =>  s_D <= 0 =>  phi_F = D         (REGION II)
    In REGION I, D < phi_F, so C3 takes its else-branch Q = sum_{k<=D} s_k, and
    C2 takes max(|V|, the same sum). The measured |V| in this lineage is 0, 1 or
    6, and the sum is of order 10^4, so C2 = C3 IDENTICALLY. Meanwhile C1's
    Q = sum_{k<phi_F} s_k = sum_{k<=D} s_k + sum_{D<k<phi_full} h_k, so
      SEPARATION(C1, C2=C3) in REGION I = sum_{D<k<phi_full} h_k,
    a constant of (n, D) alone, independent of u and of any measurement.
    In REGION II, phi_F = D: C1's Q = sum_{k<D} h_k, which does not involve u at
    all; C3's Q = |V|; C2's Q = max(|V|, sum_{k<D}h_k + h_D - u), which is the
    only one that still moves with u. All three separate, and the C1-C3 gap is
    sum_{k<D} h_k - |V|, of order 10^4 to 10^5.

    (3) THE POWER MAP, COMPUTED. Threshold u*(n,D) = h_D(n) and Region-I
    separation constant Sep_I(n,D) = sum_{D<k<phi_full} h_k, SCOUT-COMPUTED:
      D = 5:  u* = 738 / 9,934 / 13,024 / 16,920 / 53,495 / 65,156 / 78,906
              Sep_I = 0 / 803 / 3,322 / 7,494 / 106,743 / 153,486 / 233,800
              at n = 9 / 10 / 11 / 12 / 13 / 14 / 15
      D = 6:  n = 9 has h_6 = -8,097 < 0, so REGION I IS EMPTY and every cell is
              automatically Region II;
              u* = 803 / 3,322 / 7,494 / 106,743 / 139,209 / 180,190 and
              Sep_I = 0 / 0 / 0 / 0 / 14,277 / 53,610 at n = 10..15.
    THE FOUR ZEROES AT D = 6, n = 10..13 ARE THE HEADLINE. They are zero for a
    structural reason, not numerically: phi_full = 7 = D + 1 at those n, so the
    sum sum_{D<k<phi_full} h_k is over an EMPTY index set. Any n = 10..13 cell at
    D = 6 with u_6 below its threshold has a gap vector of exactly (0, 0, 0) and
    is provably uninformative about the collapse rule.

    (4) WHAT THIS SAYS ABOUT THE COMMITTED CELL AND ABOUT THE NEXT ONE. The
    committed n = 12 D6 arm-R cell has u_6 = 16,018 against u* = 7,494, so it is
    in Region II by a factor of 2.1 and all three candidates separate there -
    which is why it is the gate's anchor. Its column count follows:
    A = N(24,6) - u_6 = 190,051 - 16,018 = 174,033, reproducing the committed
    ncols exactly, a further independent check on the reading. The natural next
    rungs behave very differently:
      * n = 13, D = 6 needs u_6 >= 106,743 of N(28,6) = 499,178 columns
        (21.4 per cent deleted) to reach Region II, against 8.4 per cent at
        n = 12. A support built "the same way" will very likely land in Region I
        and produce a cell with zero resolving power at a cost dominated by
        499,178 columns.
      * n = 10 and n = 11 at D = 6 have thresholds of only 803 and 3,322, so
        they are CHEAP to push into Region II and are far smaller matrices
        (N(22,6) and N(23,6) against N(28,6)). If the goal is to separate the
        candidates, the ladder should go DOWN before it goes UP.
      * D = 5 has nonzero Region-I separation at every n >= 10, so a D5 cell is
        never totally uninformative - but its Region-I separation at n = 10 is
        only 803, which must then be compared against the seed-to-seed spread of
        extra_D that HEUR-BF-1's falsification condition requires be reported
        first.
    THE LAST POINT IS THE ONE THAT MAKES THIS A POWER CALCULATION RATHER THAN A
    TABLE: a nonzero separation is useful only if it exceeds the measurement's
    own noise. The committed record already shows seed-to-seed movement of the
    same order as small separations (rank_sem 138,570 at seed 2 versus 138,573
    at seed 2026; ncols 174,033 versus 174,035; u_6 16,018 versus 16,016). The
    deliverable therefore reports Sep(n,D,u) SIDE BY SIDE with the measured seed
    spread, and declares a cell INFORMATIVE only when the smallest nonzero
    pairwise gap exceeds that spread.

    (5) WHY THIS IS NOT A REASON TO STOP EXPANDING THE LADDER. AGENTS.md's
    research-direction integrity clause forbids using an analysis to steer work
    away from a lead. This map does the opposite of closing the option: it says
    the DREG ladder CAN separate the candidates and names exactly which cells do
    it, cheapest first. Its revisit condition is explicit: the map is computed
    for the three FROZEN candidates only, and a fourth collapse rule - which the
    lineage may well need, since the residual mechanism of the 7,110 arm-R
    defect is open by H-SDEG-0dd021's own forward guidance - would have its own
    map, recomputed by the same five lines.

  novelty_status: unverified

