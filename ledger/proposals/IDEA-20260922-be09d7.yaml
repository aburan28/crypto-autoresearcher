idea:
  id: IDEA-20260922-be09d7
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Transported factor base versus a fresh factor base, charged against random enrichment
  class: representation
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate membership
    polynomials), attack stage relation decomposition only. A factor base
    cut out by x in a fixed set V is not preserved by a degree-ell isogeny:
    the image is cut out by a degree-ell equation. On one toy edge, in the
    growing-degree regime Semaev m >= 4, compare three systems under one
    monomial order and one degree cap. This is not the closed prime-field
    m=3 screen, and the observable is not m=3 d_reg. (N) is the native
    factor base on the codomain, a fresh V' of the same cardinality as V.
    (T) is the transported base, membership equations given by the cleared
    pullback of V. (R) is (N) plus a random enrichment with the same number
    of extra generators, each of degree at most ell. The named degree is
    d_lf_obs from new_falls (IDEA-20260916-4b7c1e). On finished matrices,
    the drop of (T) from (N) exceeds the drop of (R) from (N) by at least
    1, or it does not. A larger drop for (T) is a factor-base presentation
    effect. An equal drop is generic enrichment. Agreement of (T) with (N)
    means transporting the base did not move the degree. The isogeny is
    used only to move the membership equations. No new factor base is
    proposed. V is an already-scoped base, used as a fixed input.
  mechanism: >-
    Object frame. Representation: R1, the membership polynomials in the
    summation variables. Attack stage: relation decomposition only.
    Operation set Sigma: Macaulay multiplication by monomials up to one
    frozen cap, on whichever membership polynomials the arm wrote down.
    Sigma is not the translation action. Trichotomy class of
    IDEA-20260806-c5d183: coordinate-dependent, because d_lf_obs is a
    function of the written membership equations, not of a group element.
    The projection discards V, the pullback polynomials, and the relation
    vectors, and retains one integer per arm. Many membership presentations
    share an integer, so the projection is lossy. The integer is not
    claimed to propagate under factor-base translation. The summation
    generators are the native m >= 4 system on the codomain in all three
    arms. Only the membership equations change. For (T), if the isogeny
    acts on x-coordinates by a degree-ell rational map f/g, each domain
    condition x in V is replaced by the cleared polynomial obtained from
    f(X) - v g(X) as v runs through V. The degree of that map is recalled
    and was not opened; the polynomials actually built are what the meter
    sees. (R) adds that many extra generators, degree at most ell,
    coefficients drawn from a frozen seed, and is not labeled as a factor
    base. A larger drop is drop(T) >= drop(R) + 1, where drop(X) is
    d_lf_obs(N) minus d_lf_obs(X). An unfinished arm makes the triple
    unmeasured. No graph of the isogeny is formed.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        Defines new_falls and d_lf_obs. The named degree is d_lf_obs.
        The definition is not restated.
      verified_by: idea-generator, lines 1-100 read 2026-09-22
    - ref: IDEA-20260922-469f79
      provenance: internal
      claim: >-
        Compares the graph ideal of a Vélu isogeny with the native ideal,
        against a random enrichment. This record does not form that graph.
        The isogeny only rewrites membership equations.
      verified_by: idea-generator, claim and mechanism opening read 2026-09-22
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The universal algebraic-factor-base no-go is an open problem in
        the corpus. This proposal does not state a new factor base and
        does not claim to settle that problem. V is a fixed input.
      verified_by: idea-generator, statement section read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Asks whether a presentation, including the rational map an
        isogeny induces on x-coordinates, changes a degree proxy.
        Unfinished matrices are unmeasured.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Forbids the prime-field m=3 screen and asks that a walk be
        charged if an attack is claimed. No attack is claimed here.
        The system is Semaev m >= 4.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Coordinate-dependent trichotomy class. Class I partial-action is
        the relation vector under factor-base translation, which this
        record does not track.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation. Stage is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: degree-ell rational map on x-coordinates under a separable isogeny
      provenance: recalled
      claim: >-
        A separable isogeny of degree ell induces a degree-ell rational
        map on x-coordinates, given by Vélu's formulas. Not opened. The
        cleared pullback is whatever polynomial the implementation
        builds from that map.
      verified_by: null
  assumptions:
    - V is fixed before the run and is not redesigned.
    - (N), (T), and (R) share the native m >= 4 summation generators on the codomain.
    - One monomial order, one cap. ell is coprime to the group order.
  proof_search_map:
    bottleneck: >-
      Whether replacing fresh membership equations by the cleared
      pullback moves d_lf_obs by more than adding the same number of
      random polynomials of degree at most ell.
    baseline_embedding:
      parameter_slice: >-
        Arm (N), the native codomain system with a fresh V' of
        cardinality |V|, which is the zero of both drops.
      reproduction_check: >-
        The rank identity of IDEA-20260916-4b7c1e on the finished (N)
        matrix. Failure voids all three arms.
    observation_collision:
      observable: the triple (d_lf_obs(N), d_lf_obs(T), d_lf_obs(R))
      distinct_preimage_search: >-
        Distinct membership presentations can share a d_lf_obs value.
        Agreement of (T) and (N) is that collision. A drop shared with
        (R) is the generic-enrichment collision.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The cleared pullback of the fixed set V, used as the
          membership equations of (T), with (R) the same-count random
          enrichment.
        predicted_gain: >-
          A partition into a larger drop for (T), an equal drop, or no
          movement. No ECDLP exponent gain and no new factor base.
    quantifier_order: >-
      For this one edge, if all three matrices finish: agreement means
      d_lf_obs(T) = d_lf_obs(N); equal enrichment means the two drops
      are equal and nonzero; presentation effect means drop(T) >=
      drop(R) + 1. Otherwise the triple is unmeasured. There is no
      universal quantifier over factor bases.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this edge, this V, this ell, and this cap, transporting the
        membership equations either moves d_lf_obs by more than the
        random enrichment, or by the same amount, or not at all.
      nearby_object_control: >-
        At least three independent draws of (R). If those draws differ
        from each other by at least 1, a single-draw comparison is
        unstable and no presentation-effect label is issued. The gauge
        orbit of the codomain j, with V' transformed by the gauge, is
        the coordinate null for (N).
    proof_obligations:
      - claim: >-
          V is not replaced by a new factor-base construction, and
          KN-OPEN-020 is not claimed settled.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: transport_drop_minus_random_drop
      direction: different
      minimum_effect: >-
        On finished matrices, one of three readings, split by a gap of
        at least 1. Presentation effect: drop(T) >= drop(R) + 1. Equal
        enrichment: the drops are equal. No movement: d_lf_obs(T) equals
        d_lf_obs(N). A fourth finished pattern, where (R) drops more than
        (T), is recorded as a weaker perturbation and is not a
        presentation effect.
  minimal_test:
    design: >-
      Take one toy F_q-rational ell-isogeny, ell coprime to the group
      order, and one already-scoped V on the domain. On the codomain
      build the native Semaev m=4 system three ways, same order and same
      cap: (N) with a fresh V' of equal cardinality; (T) with the cleared
      pullback of V as the membership equations; (R) equal to (N) plus
      that many random generators of degree at most ell, repeated for
      three seeds. Compute d_lf_obs on every finished arm. If any arm
      fails to finish, issue unmeasured. Otherwise issue one of the
      pre-registered readings, or unstable if the three seeds differ by
      at least 1.
    controls:
      - Three independent random enrichments.
      - The rank identity on finished (N).
      - One gauge model of the codomain, V' transformed with the model, as a coordinate null for (N).
      - No graph equations in any arm.
    required_metrics:
      - d_lf_obs of (N), (T), and each (R) seed, finished arms only
      - drop(T) and drop(R)
      - the spread of drop(R) across seeds
      - which reading was assigned
  falsification_conditions:
    - >-
      The rank identity fails on (N). All readings are void.
    - >-
      d_lf_obs(T) equals d_lf_obs(N) on finished matrices. Transporting
      the base did not move the degree.
    - >-
      The finished drops are equal and nonzero. The shift is generic
      enrichment.
    - >-
      The three random seeds differ by at least 1. The comparison is
      unstable and no presentation-effect label is issued.
    - >-
      A reading is issued while any arm is unfinished. That reading is
      withdrawn.
  confounders:
    - Putting the graph of the isogeny into (T), which is IDEA-20260922-469f79.
    - Using a fresh V' whose cardinality differs from |V|.
    - Random generators of degree above ell.
    - Changing the summation system between arms.
    - Designing a new factor base and calling it V.
    - Scoring an unfinished matrix as a high degree.
  interpretation_limits:
    - >-
      A presentation effect is a fact about membership equations on this
      edge. It is not a new factor base, and it does not address
      KN-OPEN-020.
    - >-
      d_lf_obs is not the solving degree and not the degree of
      regularity. A drop inside the cap does not prove the degree stays
      small above the cap, and it is not the Petit-Quisquater first-fall
      assumption.
    - Toy tier only.
    - >-
      ECDLP time exponent stays N^{1/2} and rho memory stays O(1). The
      isogeny is uncharged because no attack is claimed and no outlier
      is accepted.
    - >-
      Agreement and equal-drop are complete readings. They are not
      failed attacks.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed count of extra generators of degree at most ell, the
        drop in d_lf_obs under a uniform random choice of those
        generators is stable across draws, up to a spread of 0 on this
        toy edge. A cleared pullback whose drop exceeds that stable value
        by at least 1 is not the same perturbation. This does not assume
        the pullback or the random system is semi-regular, and it does
        not equate d_lf_obs with the solving degree above the cap.
      rigorous_support: >-
        none. It imitates the model that random polynomials of bounded
        degree form a semi-regular sequence whose degree of regularity
        depends on the degree list and not on the particular coefficients.
        That model is recalled (Bardet-Faugère-Salvy) and was not opened.
        The quantity actually compared is d_lf_obs, not that degree.
      validation_plan: >-
        Draw three independent enrichments at the frozen count and degree
        bound, on one toy codomain, m=4, one cap. Record the field order,
        ell, |V|, and the three drops. A spread of at least 1 falsifies
        stability on this edge and blocks the presentation-effect label.
        Tail check: a seed whose matrix does not finish is a missing draw,
        not a drop of 0. No cryptographic transfer.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, Pollard rho. No improvement is claimed.
    memory_exponent: O(1) for rho. Each arm stores one capped matrix.
    best_known: Pollard rho, time N^{1/2}, memory O(1), for the ECDLP.
    hidden_overhead: >-
      No attack exponent is claimed. The degree-ell membership equations
      can raise the generator degree; that cost is inside the capped
      meter and is not an o(1) attack term. The walk is uncharged.
    tradeoff_note: >-
      Three arms, one cap. Not a van Oorschot-Wiener tradeoff and it
      does not change rho.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
    (O(1)), and queries (one instance). No attack is claimed. As a
    representation comparison, the opened rows were checked.
    IDEA-20260922-469f79 dominates the comparison of a Vélu graph ideal
    against random enrichment; this record is a different ideal. No
    opened row compares a cleared membership pullback with a fresh factor
    base of equal cardinality under one cap. Not checked against every
    published algorithm. KN-OPEN-020 was read and is not a dominating
    algorithm; it is an open problem this record does not touch.
  sota_delta: >-
    ECDLP time-exponent delta 0 (remains 1/2). ECDLP memory-exponent
    delta 0. Query delta 0. The comparison adds three capped profiles on
    one edge and no attack cost.
  discriminated_from:
    - >-
      IDEA-20260922-805a59 uses one frozen factor-base rule on every
      curve. This record changes only the membership equations across
      three arms of one codomain.
    - >-
      IDEA-20260922-221a70 pulls the whole summation system back along
      the isogeny. Here the summation generators stay native, and only
      membership is transported.
    - >-
      IDEA-20260922-fac3e7 compares a special-model locus with a generic
      classmate under one factor-base rule. This record does not vary
      the locus.
    - >-
      IDEA-20260922-f7de2a certifies a fall that unmodified neighbors do
      not share. A drop of (T) against (N) is a presentation comparison,
      not a candidate for that gate.
    - >-
      IDEA-20260922-f1e5b7 holds the factor base fixed and censuses
      degree growth. This record holds the curve fixed and changes the
      membership equations.
    - >-
      IDEA-20260922-9d808c asks whether a Vélu step changes the rank
      profile by more than a linear substitution. The change here is
      the membership ideal, not a linear change of variables.
    - >-
      IDEA-20260922-881df9 attributes a gap among curves and non-elliptic
      supports. The three arms here are three membership presentations
      of one codomain.
    - >-
      IDEA-20260922-469f79 compares the graph ideal of the isogeny with
      the native ideal, against random enrichment. This record uses the
      isogeny only to move membership equations and builds no graph ideal.
    - >-
      IDEA-20260807-f6137c says there is no true d_reg meter. The named
      degree is d_lf_obs.
    - >-
      IDEA-20260916-4b7c1e defines new_falls. This record uses d_lf_obs
      and does not redefine it.
    - >-
      IDEA-20260731-016 screens curves for a rare algebraic endpoint.
      A presentation gap between (T) and (N) is not a rare curve.
