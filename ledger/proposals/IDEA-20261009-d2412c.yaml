  id: IDEA-20261009-d2412c
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  source: User request 2026-10-09 ('these all sound great') on the follow-on angles after BATCH-2e44f7; filed by
    the coordinator under the standing authorization.
  title: Discrete-log spectrum of every p-adic digit of the torsion section on the canonical curve lift
  class: measurement
  claim: 'For E/F_p with a prime-order subgroup <P>, n != p, let s_tor be the torsion section (the unique n-torsion
    lift) on the Serre-Tate canonical lift of E (CM model) or on an arbitrary integer lift. Every p-adic digit a_i(k)
    of x(s_tor([k]P)) and y(s_tor([k]P)), i = 1..4, is a canonical function of the discrete logarithm k. The claim
    is that none correlates with any character of Z/n: over the half-range k <= (n-1)/2 the maximum over nontrivial
    additive characters psi of F_p and all chi of Z/n of |sum_k psi(a_i(k)) chi(k)|^2 / n_half stays below ln((p-1)n)
    + 12, the same bound the shuffled and uniform controls obey.'
  mechanism: EXP-CZLIFT-ae0a13 showed the linear functional (formal logarithm) vanishes on s_tor. But any function
    of s_tor(R) is canonical, so the user's 'canonical section = full break' clause survives at the level of nonlinear
    digit functions until their DL spectrum is measured. H-ECDLP-f1e714 measured the Teichmuller defect digit white
    at precision 2-3; this idea measures the torsion section itself, at precision 5, on the canonical CURVE lift
    where CM endomorphisms act, and on an arbitrary lift as the control. A spike at a digit would be the first canonical
    p-adic DL-correlated quantity; its absence closes the clause at the nonlinear level.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-cd159a
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Known-negative row: xedni calculus and lifting to characteristic zero fail (Jacobson-Koblitz-Silverman-Stein-Teske);
      forecloses ''canonical lift for ECDLP'' and ''rank of lifted curve''.'
  - ref: KR-RHO-53c89f
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Textbook row: Semaev/Satoh-Araki/Smart solve trace-one curves in polynomial time; forecloses ''p-adic
      lifting for trace one'' as a generic algorithm.'
  - ref: KN-TECH-73630e
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: The canonical prime-to-p torsion lift exists and is closed for every group-theoretic invariant; the formal
      logarithm route degenerates to O = mO.
  predictions:
  - metric: spikes_higher_digits
    direction: different
    minimum_effect: 'spikes_higher_digits = 0 on both seeds (null: expected count ~ N e^{-12} per digit); a reproducible
      spike above threshold on both seeds at the same digit is the positive outcome and triggers a scaled follow-up'
  minimal_test:
    design: harness.czlift torsion_section for all k in Z/n on 24 CM-canonical and 12 random-lift curves, 50 <=
      p <= 600; FFT over Z/n for every psi; max |S|^2/n_half and the count above ln N + 12 per digit; shuffled-digit
      and uniform-digit controls on the same curves.
    required_metrics:
    - spikes_higher_digits
    - max_excess_over_threshold_higher_digits
    - shuffled_spikes_total
    - uniform_spikes_total
  falsification_conditions:
  - a digit with above-threshold pairs on both seeds and not on the shuffled control
  - the uniform control itself spiking (instrument defect)
  interpretation_limits:
  - p <= 600, n <= 600, precision 5; additive characters of F_p only (multiplicative structure of digits is not
    probed)
  - a white spectrum closes only linear correlation with characters; it is not a proof that no efficient function
    of s_tor computes k
