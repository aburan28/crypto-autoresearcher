idea:
  id: IDEA-20260807-326442
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE LANE'S ONE CONSTRUCTIVE SHOT, AND THE TRADEOFF THAT KILLS IT: the
    isogeny class supplies h ~ p^{1/2} DIFFERENT x-coordinate views of the same
    abstract group, which is exactly the resource the CAGG closure cannot
    cover -- but the number of curves reachable by an isogeny of degree at most
    X is at most O(X), so M views force isogeny degree >= cM, a cross-view
    relation's summation polynomial inherits that degree, and the algebraic
    cost multiplies by M^m against a factor-base benefit of only M; the
    same-view alternative is block-diagonal and is pure parallelism
  class: algorithm

  claim: >-
    (A) THE RESOURCE, AND WHY IT IS THE RIGHT PLACE TO LOOK. The CAGG closure
    of IDEA-20260807-1b7241 shows the class-group action is worthless to an
    adversary that sees points only as group handles, and names the residual
    open class precisely: constructions using x(Q) as a FIELD ELEMENT
    (resource R1) composed with the class structure (R4). This record is a
    concrete member of that class, filed deliberately so the closure is not
    self-serving.
    The resource is real and is worth stating carefully. By transport (T1), an
    F_p-isogeny phi : E -> E' of degree coprime to N restricts to a group
    ISOMORPHISM G -> G' with phi([k]P) = [k] phi(P). So the same abstract
    group Z/N is realised on every one of the ~h = O(sqrt(p) log p) curves of
    the class, and each realisation gives every point a DIFFERENT
    x-coordinate. A point of G therefore has h distinct field-element views,
    all computable in polynomial time once the connecting isogeny is known.
    Nothing in the generic group model can express this.

    (B) THE HOPED-FOR GAIN, STATED PRECISELY SO IT CAN BE PRICED. In
    Gaudry/Semaev point-decomposition index calculus the factor base is
    F_V = {points whose x-coordinate lies in V} for V subset F_p, and the
    binding costs are: |F| relations to collect, each requiring a Groebner
    solve of the arity-m summation system; and |F|^2-ish sparse linear
    algebra. With M views the factor base can be enlarged to
        F = {P in G : EXISTS i <= M with x_{E_i}(phi_i P) in V},
    of expected size ~ M |V| N / p, i.e. M times larger at the same |V|. If
    that enlargement were free it would let the same decomposition probability
    be reached with |V| smaller by a factor M.

    (C) THE FIRST OBSTRUCTION, AND IT IS RIGOROUS: THE VIEWS-DEGREE TRADEOFF.
    Every curve in the class is [a] * E for an integral ideal a of O, and the
    connecting isogeny has degree N(a). The number of integral ideals of norm
    at most X is O(X). Therefore
        #{curves reachable from E by an isogeny of degree <= X} = O(X),
    so obtaining M distinct views forces the largest connecting isogeny degree
    to be at least c M. This is a counting theorem, not a heuristic, and it is
    the exact quantitative form of the T5 reachability gate for this lane:
    cheap reachability and low degree are the same resource and you cannot
    have both.

    (D) THE SECOND OBSTRUCTION: A CROSS-VIEW RELATION INHERITS THE DEGREE. A
    relation that mixes views asserts
        sum_i phi_{j(i)}^{-1}( point with x-coordinate u_i ) = R  in G,
    and expressing it algebraically requires pulling each point back along its
    isogeny. The pullback is the dual isogeny, a rational map of degree
    N(a_{j(i)}) = deg phi_{j(i)}. Composing the arity-m summation polynomial
    S_{m+1} -- whose degree in each variable is 2^{m-1} -- with rational maps
    of degree D multiplies the degree in each affected variable by D. So the
    cross-view system has degree ~ 2^{m-1} D in each of m variables, and its
    Bezout number rises from ~2^{(m-1)m} to ~(2^{m-1} D)^m: a factor D^m.
    Combining with (C), D >= cM gives
        BENEFIT: factor-base size multiplied by M.
        COST:    algebraic system Bezout number multiplied by M^m.
    For every m >= 2 this is a strict loss, and the m >= 3 needed for index
    calculus to have any chance against rho makes it catastrophic. THE
    TRADEOFF IS THE RESULT and it is stated as an inequality between two
    explicit powers of M, not as an impression.

    (E) THE THIRD OBSTRUCTION, WHICH CLOSES THE OBVIOUS WORKAROUND: SAME-VIEW
    RELATIONS ARE BLOCK-DIAGONAL. The workaround is to forbid mixing: collect
    relations whose m points all come from one curve's sub-factor-base, and
    combine them in the linear algebra, which is legitimate because transport
    is a group isomorphism and every relation pulls back to a relation in G.
    But then every relation's support lies inside ONE of the M sub-bases, so
    the relation matrix is BLOCK DIAGONAL with M blocks. Block-diagonal
    relations cannot link blocks, so the system decomposes into M independent
    index calculi, each on a factor base of size |V| N/p -- exactly the
    standard attack run M times in parallel. NO EXPONENT CHANGE, only
    parallelism, and parallelism is already available for free by running M
    independent rho walks. Linking two blocks requires at least one cross-view
    relation, which reinstates (D).

    (F) THE FOURTH OBSTRUCTION, WHICH IS THE DEEPEST AND IS ALREADY IN THE
    CORPUS. Even granting cross-view relations for FREE, the views change |V|
    but not m, and the binding constraint in the prime-field case is m
    together with the non-algebraic factor base: to hold the decomposition
    probability constant one needs |F| ~ N^{1/m} regardless of how |F| is
    assembled, and on a prime field V cannot be cut out by an algebraic
    condition (the Bezout obstruction recorded in KN-FIND-5c1a03). Enlarging
    the factor base by a factor M lets |V| shrink by M but does not reduce m
    and does not make V algebraic. So the best-case gain is not an exponent at
    all. This must be said first and loudly, because it means (C)-(E) are
    belt-and-braces: the route fails even in its own fantasy.

    (G) WHERE A GAIN COULD STILL HIDE -- THE FORWARD GUIDANCE, AND IT IS
    NON-EMPTY. The one thing M views could buy that (F) does not kill is a
    view in which the factor base becomes ALGEBRAIC -- a curve E_i in the class
    admitting a low-degree map to a curve or variety over which V is cut out by
    equations. Whether any such curve exists in an ordinary prime-field class
    is exactly lane L1's isogeny-class-invariance question (RQ-ICINV-475b5e),
    and this record hands it a precise criterion to test rather than a vague
    hope: does the factor-base defining condition remain non-algebraic on
    EVERY curve of the class? A YES is a strong class-invariance closure; a NO
    is an attack. That is the one branch of this lane that is genuinely live,
    and this record's job is to isolate it.

  resource_label: >-
    R1 (x-coordinates as field elements: the factor base and the summation
    polynomials) combined with R4 (the isogeny graph / class-group action,
    supplying the M views). This is the only proposal in the L10 batch that
    consumes R1, and it is filed precisely because R1 is the residual class the
    lane's closure cannot reach.
  admissibility: admissible
  admissibility_argument: >-
    Admissible, and admissible for the strongest available reason: the
    mechanism reads x-coordinates as FIELD ELEMENTS, which is exactly the
    resource that Shoup's model cannot express and that KN-FIND-b7e091's
    simulability arguments do not cover -- both closed oracles there return
    group elements. It also uses the isogeny graph to move between curves,
    which the generic model cannot express either. H-ENDO-001's scalar
    collapse is irrelevant because no endomorphism is applied to a point of G;
    isogenies here map G to a DIFFERENT group on a different curve. The
    proposal therefore clears the admissibility filter cleanly and is then
    obstructed by the four quantitative arguments (C)-(F), which is the
    honest and useful outcome.

  discriminated_from:
    - >-
      IDEA-20260807-1b7241, whose CAGG closure explicitly cannot cover this
      construction. This record is the named member of that residual class,
      and filing both in one batch is what makes the closure honest rather
      than convenient.
    - >-
      Lane L4 (phi-equivariant relation collection, RQ-EQIC-8cb959), which
      uses phi-ORBIT factor bases on ONE curve and must not re-assert
      H-STR-002 (weakened, DEC-20260727-009). This record uses M DIFFERENT
      CURVES and a union factor base; it asserts nothing about equivariance on
      a single curve and does not touch H-STR-002. The distinguishing control
      is different too: L4's is a size-matched random factor base on the same
      curve, this record's is a size-matched single-curve factor base of the
      same total size.
    - >-
      Lane L5 (phi-equivariant sparse linear algebra, RQ-EQLA-0d3f40), which
      studies the relation matrix as a Z[phi]-module. This record predicts a
      BLOCK-DIAGONAL matrix for a completely different reason -- relation
      support confined to one curve -- and the two block structures should not
      be conflated. EV-STR-001's recorded failure of the earlier
      arithmetic-progression variant is not evidence about this one, and the
      null control here is mandatory and blocking for the same reason it was
      there.
    - >-
      Lane L13 (multi-target/preprocessing, RQ-MTGT-2cabee), which asks
      whether a table built on E retains value on E' after transport. This
      record is single-target and builds no table; it uses the class to widen a
      factor base, not to amortise across targets.
    - >-
      Classical multi-curve index calculus over extension fields (the
      Gaudry-Diem line), where the gain comes from a Weil restriction and an
      ALGEBRAIC factor base. Point (F) is precisely that the prime-field case
      has neither, and the record says so rather than borrowing the extension
      -field intuition.

  object_first_candidate:
    tracked_object: >-
      THE VIEW VECTOR of a point: the tuple
      (x_{E_1}(phi_1 P), ..., x_{E_M}(phi_M P)) in F_p^M, one field element per
      curve in a chosen subset of the class. Followed under the group law on G
      and under enlargement of M.
    lossiness: >-
      GENUINELY LOSSY at every fixed M < h and compatibly so: it forgets the
      y-coordinates (hence the sign of the point on each curve) and forgets all
      curves outside the chosen subset. The discarding is compatible with the
      target's operations because the summation polynomial is precisely the
      relation the x-coordinates satisfy under addition WITH the signs
      forgotten -- that is what S_m is for -- so the retained part propagates
      deterministically under the group law, one component at a time. It is not
      a change of coordinates: at M = 1 it is the standard object, and at
      M > 1 it is a genuinely larger, redundant encoding whose components do
      NOT determine one another by any low-degree relation, which is the whole
      question.
    propagation: >-
      One-step propagation IS DEFINABLE AND MEASURABLE, and its cost is the
      crux. Within a component, the propagation of x under addition is the
      arity-3 summation polynomial S_3(x_1, x_2, x_3) = 0, degree 2 in each
      variable -- cheap. ACROSS components, the propagation from component i to
      component j is the rational map phi_j phi_i^{-1}, of degree
      deg(phi_i) deg(phi_j), which by (C) is at least c^2 M^2 for a
      well-spread subset. So the object propagates, and the cross-component
      propagation cost is exactly the quantity (D) prices. Measuring that cost
      is the experiment.
    survival_score: >-
      Survives arbitrary M up to h. Survives every choice of V. What kills it
      is not a change of structure but a COST: the cross-component propagation
      degree grows linearly in M, so the object becomes algebraically useless
      well before it becomes structurally invalid. That is an unusual and
      informative survival profile -- the object never dissolves, it just
      becomes unaffordable -- and it is why the record is a tradeoff rather
      than a no-go theorem.

  mechanism: >-
    STEP 1 (zero compute, HARD GATE). Establish (F) first, because it is the
    cheapest and it bounds everything else: write the decomposition-probability
    accounting and confirm that |F| ~ N^{1/m} is required regardless of how |F|
    is assembled, so M changes |V| and not m. If (F) is right, the best-case
    gain is not an exponent and the rest of the proposal is a measurement of
    how much worse than best-case it actually is.

    STEP 2 (zero compute). Prove (C) by the ideal-counting bound and state the
    constant. Then derive (D)'s Bezout accounting explicitly for m = 3 and
    m = 4, producing the two competing powers M and M^m as concrete numbers at
    the toy parameters to be used.

    STEP 3 (toy compute). Build the instrument: enumerate a toy isogeny class;
    for a chosen subset of M curves compute the connecting isogenies and their
    degrees by walking with small split primes; verify the views-degree bound
    (C) empirically by plotting the M-th smallest reachable degree against M.
    PREDICTED: linear in M with the ideal-counting constant.

    STEP 4 (toy compute, THE DISCRIMINATING MEASUREMENT). Three arms on
    identical instances, identical |F| and identical m:
      ARM 1 SINGLE-VIEW: standard index calculus on E with |V| chosen so that
        |F| = target.
      ARM 2 MULTI-VIEW, SAME-CURVE RELATIONS ONLY: M curves, |V| reduced by M
        so that the union factor base has the same |F|; relations restricted to
        one curve each.
      ARM 3 MULTI-VIEW, CROSS-VIEW RELATIONS ALLOWED: same as arm 2 but the
        solver is given the composed system with the pullback maps.
    Metrics per arm: relations per unit time; measured solving degree and
    Groebner runtime per decomposition attempt; the RELATION MATRIX BLOCK
    STRUCTURE (number of connected components of the support hypergraph); and
    total time to |F| independent relations.
    PREDICTED: arm 2 matches arm 1 per block and its matrix has exactly M
    connected components, i.e. it is M parallel copies and its total is no
    better; arm 3 fails to produce ANY cross-view relation within budget once
    M exceeds a small threshold, and its measured solving degree grows with M
    as (D) predicts.

    STEP 5 (toy compute, THE CONNECTIVITY METRIC -- this is the sharpest
    number in the design). Report the fraction of relations that are
    cross-view, as a function of M and of the algebraic budget. The union
    factor base is only useful if the relation hypergraph is CONNECTED; the
    number of cross-view relations needed to connect M blocks is at least
    M - 1. So the decisive question is a single measurable number: can the
    solver produce M - 1 cross-view relations within the budget that arm 1
    would spend on the entire attack? PREDICTED: no, by orders of magnitude,
    and the gap grows like M^m.

    STEP 6 (zero compute). Hand (G) to lane L1 with the precise criterion:
    is the factor-base defining condition non-algebraic on EVERY curve of the
    class?

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "factor base"; "summation polynomial|Semaev"; "multi-curve|
      multiple curves|isogeny class"; "block diagonal|connected component";
      "Bezout". Full reads: KN-FIND-5c1a03, KN-FIND-b7e091, DECOMPOSITION.md
      lanes L1/L4/L5/L13, RQ-ICINV-475b5e, RQ-EQIC-8cb959, RQ-EQLA-0d3f40.
    results: >-
      The corpus has extensive Semaev/index-calculus material (KN-TECH-003,
      KN-TECH-004, KN-TECH-011, KN-FIND-f8c290 and the DREG lane) and extensive
      isogeny material, but NO record combines them: no proposal uses multiple
      curves of one isogeny class as multiple views of one factor base.
      KN-FIND-5c1a03 states the Bezout/non-algebraic-factor-base obstruction
      that point (F) invokes, and states it as the SHARED missing ingredient
      across three independent analyses -- which is direct corpus support for
      (F) being the binding constraint. Lane L4's phi-orbit factor bases are on
      one curve; lane L13's transport question is about tables, not factor
      bases.
    verdict: >-
      ADAPTATION. Multi-curve index calculus is a known idea in the
      EXTENSION-FIELD setting (Gaudry-Diem-style, where a Weil restriction
      supplies an algebraic factor base); the ideal-counting bound is textbook;
      Bezout is textbook. New to this corpus: the transport-based multi-view
      factor base for PRIME fields, the views-degree tradeoff (C) as the
      quantitative form of T5 for R1, the M-versus-M^m accounting, the
      block-diagonal characterisation of the same-view workaround, and the
      connectivity metric of Step 5. No external novelty is claimed and a
      citation showing this was tried in the prime-field case would be a
      valuable ingredient.

  null_object_control: >-
    MANDATORY AND BLOCKING. MATCHED NULL OF THE SAME SHAPE: a
    SIZE-MATCHED SINGLE-CURVE factor base -- arm 1 -- with exactly the same
    |F|, the same m, the same target and the same solver. This is the only
    comparison that isolates "M views" from "a bigger factor base", and it is
    the same discipline lane L4 requires for its orbit bases. A second matched
    null: M RANDOM DISJOINT SUBSETS of a single curve's factor base, of the
    same sizes as the M sub-bases, with relations restricted to one subset
    each. That null has the identical block structure with NO isogenies
    involved, so any block-structure effect it reproduces is a property of the
    partition and not of the class.
    DECAY PARAMETER: M. The claimed benefit (factor-base enlargement) must
    grow with M while the measured cross-view relation yield must FALL with M
    like M^{-m}. A cross-view yield that does NOT fall as M grows contradicts
    (C)+(D) and is the one outcome worth escalating; a measured "benefit" that
    fails to decay when the isogenies are replaced by the random-partition null
    is the canonical artifact tell and means the effect is partition
    bookkeeping, not isogeny structure.
    POSITIVE CONTROL: M = 1, where all three arms must coincide exactly with
    the standard single-curve attack and reproduce the DREG lane's recorded
    solving degrees on a frozen fixture.

  assumptions:
    - >-
      All isogenies used have degree coprime to N, so T1 transport applies and
      G maps isomorphically. Enforced by choosing walk primes different from N,
      which is automatic since N ~ p and walk primes are small.
    - >-
      The connecting isogeny to each chosen curve is KNOWN because the walker
      chose it. This is essential and is the reason the construction is
      admissible at all: the adversary never has to solve a vectorization. It
      also caps the usable M at the number of curves the walker can afford to
      visit.
    - >-
      Toy scale: p up to ~24 bits so a whole class can be enumerated, m in
      {3, 4}, and Groebner solving is feasible in pure Python. Arm 3's systems
      will be infeasible beyond very small M and that infeasibility is a
      MEASURED OUTCOME of the design, not an infrastructure failure -- but the
      distinction must be recorded per cell, and a solver timeout is reported
      under AGENTS.md rule 5 as infrastructure unless the predicted degree
      growth is independently confirmed.
    - >-
      Point (F)'s accounting uses the standard decomposition-probability model
      (a random point decomposes into m factor-base elements with probability
      ~|F|^m/(m! N)). This is the model the program's own index-calculus
      records use and it is cited rather than re-derived.
    - >-
      Ideal counting: #{integral ideals of O of norm <= X} = O(X) with an
      explicit constant depending on the Dedekind zeta residue. Used for (C).

  proof_search_map:
    bottleneck: >-
      Arm 3's cross-view relation search. If cross-view relations could be
      produced at a cost sub-polynomial in M, the tradeoff in (D) would not
      bind and the route would be live. Everything else in the record either
      counts ideals or reproduces known index-calculus accounting.
    baseline_embedding:
      parameter_slice: >-
        M = 1. Every arm must then reduce EXACTLY to standard single-curve
        point-decomposition index calculus, with the solving degree and
        relation yield matching the program's existing DREG-lane records on
        the same instance.
      reproduction_check: >-
        Frozen regression fixture: an existing DREG-lane run record's instance,
        seed, factor base and target, re-run through this pipeline at M = 1.
        Exact integer comparison of the measured solving degree and a
        within-20-percent comparison of relation yield. A mismatch means the
        pipeline is not the program's index calculus and no arm comparison is
        interpretable.
    observation_collision:
      observable: >-
        The number of connected components of the relation hypergraph over the
        union factor base -- the block count.
      distinct_preimage_search: >-
        REQUIRED. Find two configurations with the same block count but
        different mechanisms: specifically, the M-view configuration and the
        random-partition null, which are predicted to give the SAME block count
        M for entirely different reasons. That collision is expected and it is
        exactly why the random-partition null is mandatory: without it, a block
        count of M would be misattributed to the isogeny structure. Reporting
        the block count without having run the partition null is prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace one curve's x-coordinate by the view vector across M curves,
          i.e. change the representation of a point from one field element to
          M redundant ones, hoping the redundancy makes membership in a small
          set more likely.
        predicted_gain: >-
          Factor-base size times M. Predicted NET gain: none, because the
          transform's cost is the cross-view propagation degree, which grows
          like M by (C) and enters the Bezout number as M^m by (D).
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the view map: which points share a view vector. Since
          each phi_i is injective on G, the view map is injective, so the fibre
          is trivial -- which is the honest statement that the representation
          loses nothing about the POINT while gaining nothing algebraically.
        predicted_gain: >-
          A clean negative diagnostic: an injective, cheap-to-evaluate,
          algebraically expensive representation. Recording that combination is
          useful because it is the generic shape of a failed representation
          change and future proposals can test for it cheaply.
    quantifier_order: >-
      WHAT (C) ASSERTS UNCONDITIONALLY: FORALL X > 0, THERE ARE AT MOST O(X)
      curves in the class reachable from E by an F_p-isogeny of degree at most
      X. Equivalently: FORALL subsets S of the class with |S| = M, THERE
      EXISTS a curve in S whose minimal connecting degree from E is at least
      cM. Note the order -- the existential is on the WORST curve in the
      subset, which is the right one, because a single high-degree pullback is
      enough to blow up a relation that touches it.
      WHAT THE ROUTE WOULD NEED: FORALL M, THERE EXISTS a subset of M curves
      such that FORALL cross-view relations the composed system stays
      low-degree. (C) contradicts the inner FORALL.
      NOT CLAIMED: that no multi-curve index calculus can ever work (the
      extension-field case demonstrably does); that (F) is a theorem rather
      than the standard decomposition-probability accounting.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime-field point-decomposition index calculus with a
        non-algebraic factor base, using M curves of the isogeny class as
        multiple views multiplies the factor base by M and the algebraic system
        Bezout number by at least M^m, and the same-view alternative is
        block-diagonal, so neither changes the exponent." It can NEVER certify
        anything about extension fields, about an algebraic factor base on some
        curve of the class (which is (G), explicitly left open), or about the
        ECDLP itself.
      nearby_object_control: >-
        THE EXTENSION-FIELD CASE, where multi-curve/Weil-restriction index
        calculus DOES beat rho. The argument must not "prove" that impossible.
        If a version of (D) also kills the extension-field case, it has
        mis-identified the load-bearing structure -- which is the ALGEBRAICITY
        of the factor base, not the multiplicity of views.
    proof_obligations:
      - claim: >-
          #{curves reachable by degree <= X} = O(X).
        responsibility: size
      - claim: >-
          A cross-view relation's system has degree multiplied by the pullback
          degree in each affected variable.
        responsibility: correctness
      - claim: >-
          Same-view relations give a relation matrix with exactly M connected
          components.
        responsibility: correctness
      - claim: >-
          Connecting M blocks requires at least M - 1 cross-view relations.
        responsibility: correctness
      - claim: >-
          Holding decomposition probability constant requires |F| ~ N^{1/m}
          regardless of how |F| is assembled.
        responsibility: success_probability
      - claim: >-
          M = 1 reproduces the DREG-lane fixture exactly.
        responsibility: baseline
      - claim: >-
          The random-partition null reproduces the block count without any
          isogenies.
        responsibility: soundness

  predictions:
    - metric: >-
        M-th smallest connecting isogeny degree from E, as a function of M
      direction: higher
      minimum_effect: >-
        Linear in M with fitted slope within a factor 3 of the ideal-counting
        constant, over the whole toy class. A sublinear fit would refute (C)
        empirically and would be a genuine surprise worth escalating.
    - metric: >-
        number of connected components of the relation hypergraph in arm 2
      direction: higher
      minimum_effect: >-
        Exactly M, on 100 percent of cells. Fewer means cross-view relations
        are being produced by accident and the arm separation is broken.
    - metric: >-
        measured solving degree of the cross-view system in arm 3, versus M
      direction: higher
      minimum_effect: >-
        Increasing in M, and by M = 4 at least double the arm-1 solving degree
        at the same m. A solving degree that does NOT grow with M refutes (D)
        and reopens the route; this is the single most valuable falsification
        available here.
    - metric: >-
        fraction of cross-view relations found in arm 3 within the arm-1 total
        budget
      direction: lower
      minimum_effect: >-
        Below the M - 1 needed for connectivity, at every M >= 3. Producing
        M - 1 cross-view relations within budget would make the union factor
        base usable and is the outcome that would justify continuing.
    - metric: >-
        total time to |F| independent relations, arm 2 divided by arm 1, at
        equal |F| and m
      direction: higher
      minimum_effect: >-
        At least 1.0, i.e. no gain, and the ratio should equal the isogeny
        overhead. A ratio below 0.8 would mean the union base helps even
        block-diagonally, which contradicts (E) and is escalated.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): establish (F). If the best case is
      not an exponent, the record's priority is capped and Stages 3-5 are run
      only as a measurement of a predicted dead end -- which is still worth
      doing because it produces the views-degree curve and the connectivity
      metric that lane L1 needs.
      STAGE 1 (zero compute): prove (C); derive (D)'s M-versus-M^m accounting
      at m = 3 and m = 4 with concrete toy numbers.
      STAGE 2 (minutes, BASELINE GATE): M = 1 reproduction of the DREG-lane
      fixture. Halt if it does not reproduce.
      STAGE 3 (hours): enumerate a toy class; compute connecting degrees;
      measure the views-degree curve against (C).
      STAGE 4 (hours to days): the three arms at M in {1, 2, 4, 8}, m in
      {3, 4}, with the random-partition null run alongside arm 2.
      STAGE 5 (hours): the connectivity metric -- cross-view relations found
      versus M - 1 needed, within the arm-1 budget.
      STAGE 6 (zero compute): hand (G) to lane L1 with the stated criterion.
    controls:
      - >-
        arm 1, size-matched single-curve factor base -- the only comparison
        that isolates views from size
      - >-
        random-partition null with the identical block structure and no
        isogenies -- mandatory before any block-count claim
      - >-
        M = 1 degeneracy reproducing the DREG-lane fixture exactly
      - >-
        matched m, matched |F|, matched target and matched solver across arms
      - >-
        rho baseline at 0.886 sqrt(N) on the same instances, so all totals are
        charged against the real incumbent
    required_metrics:
      - connecting isogeny degree per curve, and the views-degree curve
      - relations per unit time, per arm, per (M, m)
      - measured solving degree and Groebner runtime per decomposition attempt
      - connected-component count of the relation hypergraph, per arm, with the
        partition null alongside
      - cross-view relation count against the M - 1 connectivity requirement
      - total time to |F| relations per arm, and against rho
      - per-cell record of whether a cell ended in a solver timeout
        (infrastructure) or a completed measurement

  falsification_conditions:
    - >-
      Arm 3's measured solving degree does not grow with M. (D) is wrong; the
      cross-view systems are cheaper than the Bezout accounting predicts; the
      route is live and this becomes an attack proposal. Escalate for
      independent review.
    - >-
      The views-degree curve is sublinear in M. (C) is wrong as applied;
      recheck the ideal counting and the walk construction.
    - >-
      Arm 2 beats arm 1 at equal |F| and m. (E) is wrong; the union factor base
      helps even block-diagonally; escalate, and check first that |F| really
      was matched, since an unmatched |F| is the overwhelmingly likely cause.
    - >-
      The random-partition null reproduces any claimed multi-view effect. The
      effect is partition bookkeeping, not isogeny structure, and no
      class-based claim may be made.
    - >-
      M = 1 fails to reproduce the DREG-lane fixture. The pipeline is not the
      program's index calculus; no arm comparison is interpretable and the run
      set is invalid.
    - >-
      Arm 3 cells end in solver timeouts without the predicted degree growth
      being independently confirmed. That is an INFRASTRUCTURE outcome under
      AGENTS.md rule 5, is recorded as such, and is NOT evidence for (D).

  confounders:
    - >-
      FACTOR-BASE SIZE VERSUS VIEW COUNT. The single largest confounder: a
      multi-view base is bigger, and bigger bases help for reasons unrelated to
      views. |F| must be matched exactly across arms, and the record's whole
      comparison is void if it is not.
    - >-
      ISOGENY EVALUATION COST. Computing x_{E_i}(phi_i P) for M curves costs M
      isogeny evaluations per point, which is pure overhead charged to arms 2
      and 3 and to nothing else. It must be measured and included in totals, or
      arms 2 and 3 will look artificially competitive.
    - >-
      SOLVER TIMEOUTS MASQUERADING AS DEGREE GROWTH. Arm 3 will time out. A
      timeout is an infrastructure outcome and is not evidence for (D) unless
      the degree growth is independently confirmed on the cells that DID
      complete. This distinction is the most likely place for the write-up to
      overclaim.
    - >-
      SMALL-CLASS ARTIFACTS. At toy p the class may contain fewer than 8
      curves, capping M below the interesting range and making the
      views-degree fit meaningless. Require h >= 32 before interpreting any
      M-sweep, and report h per instance.
    - >-
      m = 3 IS NOT THE INTERESTING ARITY. Prime-field index calculus needs
      larger m to have any chance, and larger m is exactly where the toy budget
      dies. The record must state that its measurements are at the arities it
      can reach and that (D)'s M^m penalty is WORSE at the arities that matter,
      not better -- so the toy measurement is conservative in the direction of
      the conclusion, which is the honest direction.
    - >-
      TWIST AND SIGN. x-coordinates forget the sign of a point, so a view
      vector is really a vector of point-pairs. Relations must track signs
      consistently across views or spurious relation failures will be recorded
      as algebraic difficulty.

  interpretation_limits:
    - >-
      This closes a route by COST, not by impossibility. The construction is
      valid, computable and admissible; it is simply dominated, and the record
      says by how much (M benefit versus M^m cost).
    - >-
      Point (F) means the route fails even granting cross-view relations for
      free. Anyone quoting only (C)-(E) would be understating the negative.
    - >-
      Branch (G) is LEFT OPEN and is the one live thread: if some curve of the
      class admits an algebraic factor base, the whole analysis changes. That
      is lane L1's question and this record does not answer it.
    - >-
      Toy scale, m in {3, 4}, h >= 32. Nothing here is crypto-scale, and the
      infeasibility of arm 3 at toy scale is not by itself evidence about
      crypto scale.
    - >-
      QUANTUM: nothing here is quantum. Subexponential quantum vectorization
      (KN-TECH-027, KN-TECH-051) would not help, because the construction never
      needs to vectorize -- it walks and therefore knows its own ideals. The
      campaign is classical.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The M view coordinates of a uniformly random point of G behave like M
        independent uniform elements of F_p, so the probability that a point
        has at least one view in a set V of size |V| is
        1 - (1 - |V|/p)^M ~ M|V|/p for M|V| << p, giving a union factor base of
        expected size ~ M |V| N / p.
      rigorous_support: >-
        Each individual view is exactly uniform on the x-coordinates of the
        image group, which is rigorous. The INDEPENDENCE across views is the
        heuristic, and it imitates the classical expectation that the
        x-coordinates of a point and of its image under a high-degree isogeny
        are statistically unrelated -- the same style of assumption as the
        standard "a random point decomposes with the expected probability" in
        index calculus. It is genuinely a heuristic and could fail for
        low-degree isogenies, where the maps are algebraically close.
      validation_plan: >-
        Sample 10^5 points of G at toy scale; measure the empirical joint
        distribution of view pairs; test independence by a chi-squared test on
        binned coordinates for pairs of curves at connecting degrees spanning
        the full range; compare the measured union-base size against the
        predicted M|V|N/p. TAIL CHECK: the largest observed pairwise
        dependence, and specifically whether dependence DECAYS with connecting
        degree as expected -- if low-degree pairs are dependent and high-degree
        pairs are not, that is itself a finding about how far a view must
        travel to be independent, and it interacts directly with (C).
        LABELLED TOY SCALE.
    - id: H2
      statement: >-
        The Groebner solving cost of the cross-view system grows at least like
        the Bezout number (2^{m-1} D)^m in the pullback degree D, so with
        D >= cM the cost grows at least like M^m.
      rigorous_support: >-
        Bezout's theorem gives the root count rigorously; the heuristic is the
        standard expectation that solving cost tracks the Bezout number for
        generic systems, which is the same assumption the program's DREG lane
        relies on when it uses the degree of regularity as a cost proxy
        (KN-TECH-004, KN-TECH-011). Composed summation systems are NOT generic,
        so the assumption is genuinely at risk and its failure is the
        record's main falsifier.
      validation_plan: >-
        Measure the actual solving degree and runtime of the composed system
        at D in a ladder of connecting degrees, at fixed m; fit against the
        predicted Bezout growth; compare the measured degree of regularity
        against the program's recorded values for the uncomposed system at the
        same m. TAIL CHECK: the single cheapest observed composed solve versus
        the predicted floor, since a surprisingly cheap solve is the outcome
        that would reopen the route. LABELLED TOY SCALE, m in {3, 4} only.

  reachability_gate: >-
    T5 IS THE BINDING CONSTRAINT AND THIS RECORD GIVES IT ITS SHARPEST
    QUANTITATIVE FORM IN THE CAMPAIGN. The proposal never needs to reach a
    SPECIFIED curve -- it walks and therefore knows every ideal it used, so
    the expensive p^{1/4} side of the dichotomy is never paid. But the cheap
    side is not free either, and (C) is exactly the price: the curves
    reachable at degree <= X number only O(X), so cheap reachability and low
    isogeny degree are THE SAME RESOURCE and buying M views costs degree M.
    This converts T5 from a dichotomy into a continuous tradeoff for R1-flavoured
    lanes, which is a reusable statement: any future proposal that wants many
    curves cheaply must pay degree linearly in the number of curves, and any
    algebraic method whose cost depends on isogeny degree inherits that
    payment. That statement, and the measured views-degree curve behind it,
    are worth having even if every arm of the experiment comes out negative.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED AND NONE PREDICTED. Best case under (F), granting
      free cross-view relations: the exponent is unchanged, because |F| ~
      N^{1/m} is forced regardless of how |F| is assembled and M changes only
      |V|. Actual case under (C)+(D): a factor M benefit against an M^m cost,
      i.e. a strict loss for every m >= 2. Same-view case under (E): exactly M
      parallel copies of the incumbent, i.e. parallelism with no exponent
      change and with an isogeny-evaluation overhead of M per point.
    memory_exponent: >-
      The union factor base and its relation matrix are M times larger in the
      number of columns for arm 2, though the matrix is block diagonal so the
      linear algebra decomposes and peak memory per block is unchanged. Arm 3's
      Macaulay matrices grow like the Bezout number and are the binding memory
      constraint; peak memory is measured and reported per cell.
    best_known: >-
      Prime-field ECDLP: 0.886 sqrt(N) parallel rho with O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS sqrt(N)/sqrt(N). Prime-field
      point-decomposition index calculus: the program's own recorded position
      is that it is tight at toy scale and does not beat rho
      (KN-FIND-f8c290), with the structural reason recorded in KN-FIND-5c1a03
      (non-algebraic factor base forced by Bezout). This record changes none of
      that and predicts a strict loss against all of it.
    hidden_overhead: >-
      Three disclosures. First, arm 2 and arm 3 pay M isogeny evaluations per
      point, which is invisible in an asymptotic statement and dominates at toy
      scale. Second, (C)'s constant is the Dedekind zeta residue for O and is
      not 1, so "degree >= cM" has a constant that matters at the M values a
      toy experiment can reach. Third, and largest: (F)'s conclusion that the
      best case is not an exponent means the entire M-versus-M^m analysis is
      about how much worse than a non-improvement the route is -- and stating
      the tradeoff without stating (F) would make the route sound closer to
      viable than it is.
    tradeoff_note: >-
      The genuine tradeoff this record produces is not time-memory but
      VIEWS-DEGREE: M distinct views cost isogeny degree at least cM, and any
      algebraic cost that scales with degree inherits it. That curve is
      measured in Stage 3 and is the reusable artifact of the proposal,
      independent of whether the index-calculus arms succeed or fail.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier. Predicted position: dominated on TIME by parallel
    Pollard rho with distinguished points (0.886 sqrt(N), KN-TECH-001,
    KN-TECH-006) -- arm 2 by a factor equal to the isogeny overhead, arm 3 by
    the M^m algebraic penalty; dominated on MEMORY by rho (O(1) versus a
    relation matrix of M|V|N/p columns and, for arm 3, Macaulay matrices);
    dominated on DATA by rho (which needs one instance); tied at best with
    single-curve index calculus, which is itself already dominated by rho per
    KN-FIND-f8c290; and dominated by BSGS (sqrt(N)/sqrt(N)) and by
    automorphism-discounted rho on CM curves (KN-TECH-018). Every row was
    checked and none is beaten. dominated_by is NOT null.
  sota_delta: >-
    Predicted zero or negative against every baseline, stated quantitatively:
    benefit is a factor M in factor-base size; cost is a factor M^m in the
    algebraic system's Bezout number plus M isogeny evaluations per point;
    net is a loss for every m >= 2 and the same-view alternative is exactly M
    parallel copies of an attack already dominated by rho. The positive
    deliverables are two reusable numbers rather than a speedup: the measured
    views-degree curve (rigorously bounded by the ideal count, O(X) curves at
    degree <= X) and the connectivity metric (M - 1 cross-view relations
    needed, measured against the number obtainable within the incumbent's
    budget).

  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that (C) holds as measured -- it is ideal counting. 0.85 that (D)'s
    degree growth is observed in the cells that complete; the risk is that
    composed summation systems are non-generic and cheaper than Bezout
    suggests, which is precisely the interesting branch. 0.9 that (E)'s block
    structure is exactly M. 0.9 that (F)'s accounting stands. Overall, below
    0.1 that this route shows any gain -- but it is the only proposal in the
    L10 batch that could produce one, it is the named member of the residual
    class the lane's own closure cannot cover, and its views-degree curve is
    worth having regardless. Priority MEDIUM rather than low for exactly that
    reason, and not HIGH because the implementation cost is the largest in the
    batch and (F) caps the best case before any of it is spent.

