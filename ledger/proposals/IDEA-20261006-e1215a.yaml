idea:
  id: IDEA-20261006-e1215a
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Hit and miss S_3 instances on one toy base either share a solving
    degree or differ by at least one
  class: control
  claim: >-
    For one ordinary short-Weierstrass curve over F_61, m = 3, and one
    recorded factor base of B = 8 x-coordinates, the mean grevlex solving
    degree on targets that decompose over the base and the mean on targets
    that do not either agree to within less than 1, or the miss mean
    exceeds the hit mean by at least 1. Agreement means one degree law
    covers the charged mixture. A gap of at least 1 means a law fitted on
    successful decompositions understates the degree of the misses, which
    are the bulk of the attempts under a 1/6 success rate at m = 3.
    Representation class R1; attack stage relation decomposition. Labels
    come from exhaustive enumeration of base combinations, which at B = 8
    is a few hundred sums. No exponent improvement is claimed.
  mechanism: >-
    The tracked object is the pair of conditional means of d_solve given
    the branch "the target decomposes" and the branch "it does not".
    Representation: R1 x-coordinates of the target and of the base.
    Operation set Sigma: the decomposition check, a sum of three base
    points compared with the target. Sigma is a partial action on base
    translates, the Class I pattern of index calculus, and it is not the
    full translation action of the subgroup. Trichotomy class: branching.
    Existence of a decomposition is the branch; the degree is measured
    separately on each branch. Lossy projection against Sigma: each branch
    mean discards the witness tuple and the Groebner basis and keeps one
    integer. The discard is compatible with Sigma only as a branching
    observable: the check's yes/no outcome selects the sample, and the
    degree is not a deterministic function of a block system of
    translation. The priced open number is the difference of the two
    means. F2 is the named component. The equal-work reading and the
    two-population reading are the two explanations. Exhaustive labels at
    B = 8 are the instrument; a Nullstellensatz witness is not proposed.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials cut out factor-base decompositions. They do
        not, in that row, split solving degree by whether a decomposition
        exists.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus is recorded there as not
        beating generic methods under stated assumptions. Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Growth of prime-field solving degree is open. A hit/miss split is
        a possible confounder of any single growth curve.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
  assumptions:
    - >-
      A target is a hit if and only if some ordered triple of distinct base
      points sums to it or its negative, checked by point addition. The
      solver is not the labeler.
    - >-
      Hits and misses are solved with the same grevlex parameters, the same
      membership polynomial, and the same omission of degree-p field
      equations.
    - >-
      At least four hits and four misses occur in the recorded target list.
      If either class has fewer than four, the cell is enlarged by further
      recorded targets until both counts reach four, or the test stops as
      inconclusive for lack of one class.
    - >-
      F2 is the component under measurement. No new base and no new
      relation shape are introduced.
  predictions:
    - metric: >-
        mean d_solve on misses minus mean d_solve on hits, on the F_61,
        B = 8 cell
      direction: different
      minimum_effect: >-
        absolute difference strictly less than 1 supports one shared
        degree; difference at least 1 supports two populations. The sign
        required by the two-population reading is miss mean minus hit mean
        at least 1.
  minimal_test:
    design: >-
      Fix p = 61, one ordinary short-Weierstrass curve from a declared
      search, and one seed-recorded set of B = 8 point x-coordinates.
      Draw targets uniformly from the subgroup until at least four hits
      and four misses are labeled by exhaustive addition (at most 8^3
      signed combinations per target). Solve each labeled system under the
      same grevlex solver. Report the two means, the two sample sizes, and
      the difference.
    controls:
      - >-
        A support-matched random system with the same degrees, labeled
        "hit" when the variety over F_61 is nonempty and "miss" when it is
        empty, using the same solver. If that arm shows a difference of at
        least 1 as well, the gap is a property of empty versus nonempty
        varieties, not of the summation polynomial.
      - >-
        A second recorded base of size 8 on the same curve. The difference
        must keep the same side of the threshold 1 on both bases. A sign
        change between bases falsifies a stable population gap.
      - >-
        The same twelve-or-more targets solved again with a second build of
        the same algorithm. The hit/miss means must match exactly.
    required_metrics:
      - hit count and miss count
      - mean, minimum, and maximum d_solve in each class
      - miss mean minus hit mean
      - the same difference on the random-system arm
      - the same difference on the second base
  falsification_conditions:
    - >-
      The absolute difference of means is at least 1 on one base and
      strictly less than 1 on the other base. The population gap is then
      base-dependent and is not a law for the curve.
    - >-
      The random-system arm matches the S_3 difference to within less than
      1, and that difference is at least 1. The gap is then the empty
      variety, and the summation polynomial is not the cause.
    - >-
      After the enlargement rule, one class still has fewer than four
      targets. The comparison is inconclusive, not a confirmation of either
      explanation.
  confounders:
    - >-
      Hits can be easier because a linear factor is present, which changes
      the ideal before elimination starts. The random arm with an empty
      versus nonempty label carries the same phenomenon.
    - >-
      The exhaustive label uses signed sums. A solver convention that
      ignores negation will disagree with the label. The convention is
      frozen and written next to the counts.
    - >-
      Small sample means move by a fraction of a degree. The threshold is
      a full degree, and the minima and maxima are reported so a one-point
      outlier is visible.
  interpretation_limits:
    - >-
      One prime, one arity, B = 8. A shared degree here does not imply a
      shared degree at larger B or at m = 4.
    - >-
      Exhaustive labels are available only while B^3 is small. The result
      does not supply a certificate format for misses at large B.
    - >-
      A gap of at least 1 is a statement about degrees on this cell. It is
      not a statement about wall-clock cost and not a bit-security claim.
    - >-
      The set-theoretic base remains in the scoped-out class of KN-OPEN-020.
      No escape from that class is claimed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on the generator degrees and the monomial order, the
        grevlex solving degree of an empty S_3 fiber and of a nonempty S_3
        fiber are equal in mean, for targets drawn uniformly, at p = 61 and
        B = 8.
      rigorous_support: >-
        No identity forces the two conditional means to agree. The
        assumption imitates the model in which a random consistent
        zero-dimensional system and a random inconsistent system of the
        same degrees share a Macaulay degree, with emptiness decided only
        by coefficient specialisation. That model is classical for random
        polynomials and is not a theorem for summation polynomials.
        KR-IC-5a43e5 fixes the degree pattern and does not fix these
        conditional means.
      validation_plan: >-
        The minimal test is the validation: at least four hits and four
        misses, difference of means compared with the threshold 1, repeated
        on a second base and on 20 support-matched random systems at the
        same (p, B, degrees). Tail check: the maximum d_solve in each class
        on the random arm. Parameters are p = 61, B = 8, m = 3 only. No
        extrapolation.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. Rho memory and the van Oorschot-Wiener interpolation
      stay as they are.
    best_known: >-
      Pollard rho at Theta(N^{1/2}), with KR-IC-5931ee the prime-field
      Semaev negative under its stated assumptions.
    hidden_overhead: >-
      None. No attack formula is stated, so no o(1) term is concealed.
    tradeoff_note: >-
      No tradeoff is proposed. The output is a difference of two toy means.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-955fd6
      - KR-IC-8b9daa
      - KR-IC-fbdb61
      - KR-IC-f3da82
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          The row defines summation-polynomial decomposition. The separator
          added here is a difference of conditional solving-degree means,
          threshold 1, on one (p, B) = (61, 8) cell.
      - ref: KN-OPEN-002
        provenance: internal
        relation: adjacent
        delta: >-
          The open problem asks for one growth law in bit size and m. This
          control asks whether that law has two branches on hits and misses.
    searched:
      corpus_grep:
        - question_id RQ-SDEG-001 in ledger/proposals
        - IDEA-20260805-2afd22 claim, which covers certificate fraction
      web:
        - not performed this session
      blocked:
        - Nullstellensatz certificate for failed decompositions
        - symmetrized summation polynomials
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, checked against
    KR-IC-5931ee. No attack result is claimed.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}). The separator is a
    hit-versus-miss mean solving-degree gap of strictly less than 1 versus
    at least 1, at p = 61, B = 8, m = 3, with at least four samples in
    each class.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        One shared degree for hits and misses is the equal-work slice under
        test.
      reproduction_check: >-
        Second solver build must reproduce both conditional means exactly.
    observation_collision:
      observable: conditional mean of d_solve
      distinct_preimage_search: >-
        Several targets in one class may share a degree. The search records
        that collision and does not treat it as a relation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the set of targets with a given d_solve inside one branch
        predicted_gain: none as an attack
    quantifier_order: >-
      The claim is an empirical statement about two sample means on one
      declared cell, not a quantified security theorem.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell, the two conditional means lie on one side of the
        threshold 1.
      nearby_object_control: >-
        support-matched random systems labeled by empty versus nonempty
        variety
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Control experiment for a mixture of two instance classes. The nearby
      object is the random arm, not a proof obligation.
