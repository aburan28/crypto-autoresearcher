idea:
  id: IDEA-20260816-746055
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'The ALPF survival verdict is an instrument with an unmeasured false-positive rate: run the
    identical first-fall meter and survival labeller over an ensemble of null polynomial systems drawn
    to match each surviving cell''s leading-form degree profile, and report the fraction that survive
    by chance.'
  class: measurement
  claim: '(A) The ALPF campaign''s central output is a per-cell binary label -- fires / quiet, SURVIVED
    / SCOPED_NEGATIVE / INCONCLUSIVE -- produced by comparing a measured first-fall degree d_ff against
    a predicted degree of regularity D_reg_pred. EV-ALPF-001 reports 32 such packages and at least
    three positive-ish labels (EXP-ALPF-010 POTENTIAL SURVIVOR, EXP-ALPF-011 POSITIVE SURVIVED, EXP-ALPF-012
    survived). No record in this repository reports how often that label fires on an object with no
    structure in it. (B) The claim is that this rate is measurable cheaply and is a property of the
    instrument, not of elliptic curves: for each surviving cell in EXP-ALPF-011 the analysis records
    the exact leading-form degree profile fed to the meter (for example [2,2,2,4] for the e-ring representation
    at |FB|=4 and [3,4,5,12] for power-sum at |FB|=5). Sampling random homogeneous systems with the
    identical profile over the identical prime field, and running the identical d_ff < D_reg_pred
    comparison, yields an empirical false-positive rate p_hat with a binomial confidence interval,
    per profile. (C) The claim is further that this rate is profile-dependent rather than global:
    profiles with a large degree gap between the Semaev-like top form and the factor-base forms (for
    example [2,2,2,4]) are predicted to fire on null systems far more often than balanced profiles
    ([4,4,4,12]), because D_reg_pred for a strongly unbalanced profile is dominated by the single
    high-degree generator while d_ff is driven by the low-degree block. (D) NOT CLAIMED: that any
    ALPF survivor is a false positive; that the meter is invalid; that the campaign''s conclusions
    are wrong; that any decomposition method is fast or slow. A high measured p_hat would mean the
    label carries less information than assumed and needs a per-profile threshold, not that the underlying
    algebra is absent. A low p_hat would strengthen every existing ALPF positive without changing
    its claim tier from toy.'
  mechanism: 'STAGE 1: extract, from experiments/EXP-ALPF-011/analysis.md and experiments/EXP-ALPF-010/analysis.md,
    the exact list of leading-form degree profiles and the D_reg_pred each received. This is reading
    committed artifacts, zero compute. STAGE 2: implement a null sampler that, given a profile [d1,...,dk]
    and a prime p, draws k dense random homogeneous forms of those degrees in the same number of variables,
    using a seeded RNG. STAGE 3: implement the first-fall meter in pure Python as a Macaulay-matrix
    rank computation over F_p: build the degree-D Macaulay matrix of the system, compute its rank,
    compare the observed Hilbert-function value against the positive-truncated semiregular series
    that defines D_reg_pred, and report the smallest D at which the observed value falls strictly
    below the prediction. STAGE 4: for each profile, draw N=200 null systems and record the fired/quiet
    indicator, giving p_hat per profile with a Clopper-Pearson interval. STAGE 5: in the SAME invocation,
    run the meter on the three published control systems (a planted shared-quadratic-factor triple
    of cubics, a regular quadric complete intersection, a regular cubic triple) to confirm the re-implementation
    reproduces the published rows d_ff=4/D_reg=7/fires, 4/4/quiet, 7/7/quiet. STAGE 6: report p_hat
    per profile and the profile-vs-p_hat regression, and mark every ALPF cell whose profile has p_hat
    above a pre-registered 0.05 as label-ambiguous. Refutation: if p_hat is at or below 0.01 for every
    surviving profile, the instrument''s specificity is established at that ensemble and part (C)
    is falsified.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'false.positive' ledger/proposals/ ; grep -ril 'first-fall|first_fall|d_ff'
      ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; read ledger/questions/RQ-ALPF-001.yaml,
      ledger/evidence/EV-ALPF-001.yaml, ledger/hypotheses/H-ALPF-001.yaml, H-ALPF-017.yaml, experiments/EXP-ALPF-011/{specification.yaml,analysis.md},
      experiments/EXP-ALPF-010/analysis.md, experiments/EXP-ALPF-007/analysis.md, experiments/EXP-ALPF-006/analysis.md,
      knowledge/open-problems/KN-OPEN-003.md, KN-OPEN-005.md, docs/inventor-protocol.md sections 1-8.
    results: 'grep -ril ALPF over all 920 proposal files returned NOTHING: the ALPF lane has 32 hypotheses,
      32 experiment directories and one evidence record, and zero proposals. ''false positive'' appears
      in IDEA-20260808-e7ba81 (FN-DSA sampler spiked-covariance detection, RQ-FNDSA-001) and IDEA-20260807-61049d
      (j=0 free relations, RQ-EQLA-0d3f40) -- neither concerns a first-fall screening instrument.
      First-fall / d_ff appears in IDEA-20260807-c36472, IDEA-20260805-bb4488, IDEA-20260731-005 and
      IDEA-20260731-014, which are DREG-lane and index-calculus-lane content about the degree ladder
      itself, not about the meter''s specificity. IDEA-20260807-1354d8 (RQ-MODEL-e61cb2) is the nearest
      relative found anywhere: it reports that the meter behind EV-REP-001/EV-REP-002 had NO DYNAMIC
      RANGE, d_reg = 2 flat in every arm. That is an instrument-sensitivity complaint about a different
      meter on a different question; it establishes the genre exists in this program and does not
      measure a false-positive rate for the ALPF first-fall meter. IDEA-20260815-bc26a3 concerns the
      PROGRAM''s false-positive rate across campaigns, not one instrument''s specificity on shape-matched
      nulls.'
    verdict: 'UNVERIFIED. Novelty cannot be adjudicated against external literature from this environment
      and none is asserted. Assembled from known parts: null-ensemble controls (inventor-protocol
      section 3), the published three-row meter self-validation table already inside EXP-ALPF-011,
      and standard binomial specificity estimation. Claimed new here relative to this repository''s
      committed state: (i) treating the ALPF survival LABEL, rather than the algebra it labels, as
      the measured object; (ii) conditioning the false-positive rate on the leading-form degree PROFILE
      rather than reporting one global rate; (iii) supplying, for the first time in this lane, a null
      arm that runs in the same invocation as the signal arm. The instrument-sensitivity genre itself
      is not new (IDEA-20260807-1354d8).'
  object_first_candidate:
    tracked_object: 'The verdict vector of one screening cell: the triple (d_ff, D_reg_pred, fired)
      that the meter emits for a system, considered as a function of the leading-form degree profile
      alone rather than of the elliptic curve that produced it.'
    lossiness: 'Genuinely lossy, and the loss is the point. The projection sends a Semaev-derived
      polynomial system to (its leading-form degree profile, its meter verdict), discarding every
      coefficient, the curve equation, the factor base, the target point, and all lower-order terms.
      Only the top-form degrees and the rank pattern of the Macaulay matrix survive. This is compatible
      with the operation of interest -- the meter itself reads only Macaulay ranks at successive degrees,
      so anything the meter can see is retained by construction, and everything the meter cannot see
      is deliberately discarded. The discarded part is exactly what distinguishes a curve-derived
      system from a random one, which is why a null with the same retained part is the correct control.
      The projection is NOT injective: many distinct systems share a profile, which is what makes
      the null ensemble well defined.'
    propagation: One step of the target operation is one increment of the Macaulay degree D -> D+1.
      Acting on the tracked object, this appends one entry to the observed Hilbert-function sequence
      and one entry to the predicted semiregular sequence, and updates 'fired' to the OR of its previous
      value with the indicator that observed < predicted at the new degree. The profile itself is
      invariant under this step; only the verdict component moves, and it moves monotonically -- once
      fired, always fired -- which makes the survival label a first-passage time of a rank deficit.
    survival_score: 'The structure survives exactly as far as the meter is run: it is defined at every
      degree D up to the computational ceiling, which for the profiles in EXP-ALPF-011 (max total
      degree 24 in 4 to 6 variables) is roughly D<=12 to 14 before the Macaulay matrix exceeds a few
      million columns. It dissolves as an informative object when the null and signal arms become
      indistinguishable -- which is precisely the quantity this proposal measures rather than assumes.'
  null_object_control: 'The null object is a k-tuple of dense random homogeneous forms over F_p with
    the identical degree profile and identical variable count as the signal cell, drawn from a seeded
    RNG, carrying no elliptic curve behind it. The IDENTICAL meter code path, at the identical maximum
    degree, with the identical D_reg_pred formula, is run on it in the same process. For the signal
    arm to mean anything the null must be QUIET at a rate consistent with the published controls:
    specifically, the null fire rate for a balanced profile must be below 0.05, and the three published
    control rows (planted shared-quadratic-factor cubics fire at d_ff=4 vs D_reg=7; generic quadrics
    quiet at 4/4; generic cubics quiet at 7/7) must be reproduced exactly by the re-implementation.
    If the null fires at a rate comparable to the signal cells, the correct record is a controlled
    null under inventor-protocol section 3, and no ALPF survivor may be cited as evidence of algebraic
    structure at that profile.'
  discriminated_from:
  - IDEA-20260807-1354d8 (RQ-MODEL-e61cb2) reports a meter with no dynamic range -- d_reg flat at
    2 across all arms. That is a SENSITIVITY failure of a different meter on the representation question;
    this proposal measures SPECIFICITY (fire rate on nulls) of the ALPF first-fall meter, and specificity
    and sensitivity are separately measurable and separately actionable.
  - The meter self-validation table already inside EXP-ALPF-011 and EXP-ALPF-010 uses THREE control
    systems (one positive, two negatives) and reports a binary METER_VALIDATED flag. Three points
    cannot bound a rate; this proposal replaces a binary gate with N=200 draws per profile and a confidence
    interval, and conditions on profile rather than aggregating.
  - IDEA-20260815-bc26a3 concerns the research program's own false-positive rate across campaigns
    and lanes. This is one instrument's operating characteristic on shape-matched algebraic nulls,
    computed from Macaulay ranks, and produces a number a future ALPF cell can be compared against.
  - The DREG lane (IDEA-20260815-ad4b55, IDEA-20260815-b751cf) studies how the degree of regularity
    itself behaves for Semaev systems. This proposal does not sweep the ladder, does not vary m, and
    never touches a monomial order; it holds the profile fixed and randomises the coefficients.
  - IDEA-20260815-f9e978 treats P(decomp) as a distribution rather than a scalar. That is the decomposition
    probability of a point; this is the fire probability of a meter on a null system, which has no
    point in it at all.
  assumptions:
  - The leading-form degree profiles printed in experiments/EXP-ALPF-011/analysis.md and EXP-ALPF-010/analysis.md
    are the profiles actually fed to the Autolab meter, as the artifacts state.
  - A pure-Python Macaulay-rank first-fall meter can reproduce the three published control rows exactly;
    if it cannot, the whole measurement is reported as instrument-mismatch and no rate is claimed.
  - D_reg_pred is computable from the profile alone via the positive-truncated semiregular Hilbert
    series, as the EXP-ALPF-006 analysis describes.
  - Dense random homogeneous forms of a given profile are an acceptable null for Semaev-derived forms
    at the level the meter reads; sparsity-matched nulls are a stated confounder and are run as a
    second null arm.
  - N=200 draws per profile at these sizes fits in the compute budget over F_p with p of 13 to 17
    bits.
  predictions:
  - metric: null_fire_rate for balanced profile [4,4,4,12]
    direction: lower
    minimum_effect: 0.05
  - metric: null_fire_rate for unbalanced profile [2,2,2,4]
    direction: higher
    minimum_effect: 0.15
  - metric: difference in null_fire_rate between most and least balanced surviving profile
    direction: different
    minimum_effect: 0.1
  - metric: reproduction of the three published control rows (d_ff, D_reg_pred, fires) by the re-implementation
    direction: different
    minimum_effect: 'forced: all three rows must match exactly, else the run is reported as instrument-mismatch
      and no rate is claimed'
  minimal_test:
    design: 'Pick the two extreme profiles from the EXP-ALPF-011 table: the balanced x-ring baseline
      [4,4,4,12] which is recorded quiet, and the e-ring profile [2,2,2,4] which is recorded firing.
      Over F_p with p a 13-bit prime, draw 200 dense random homogeneous systems of each profile in
      the same variable count, and run one shared meter function over all of them plus the three published
      control systems, in one process, with one seed list. Record for each draw (d_ff, D_reg_pred,
      fired) and aggregate to two rates with Clopper-Pearson intervals. The discriminating comparison
      is a single two-proportion test between the two profiles plus the absolute level of each. This
      is the cheapest measurement that separates ''the meter detects curve-derived structure'' from
      ''the meter detects degree imbalance'', because degree imbalance is the only thing the two null
      ensembles differ in and neither contains a curve.'
    controls:
    - The three published meter controls (planted shared-quadratic-factor cubics; regular quadric
      complete intersection; regular cubic triple) re-run in the same invocation as every null draw.
    - 'A sparsity-matched null arm: random forms whose monomial supports match the observed support
      density of the Semaev-derived forms, run alongside the dense null arm.'
    - 'A seed-permutation control: the same profile drawn under 5 disjoint seed blocks, to show the
      rate is not a seed artifact.'
    - 'A field-size control: the identical null ensemble at a 13-bit and a 17-bit prime, to show the
      rate is not a small-field artifact.'
    - 'A degenerate-draw filter recorded rather than discarded: draws producing a positive-dimensional
      ideal are counted and reported separately, since EXP-ALPF-006 shows pos_dim is a distinct failure
      mode.'
    required_metrics:
    - null_fire_rate per profile with Clopper-Pearson 95 percent interval
    - d_ff distribution per profile (mean, min, max)
    - D_reg_pred per profile
    - gap statistic D_reg_pred minus d_ff per draw
    - control-row reproduction indicator (exact match yes/no per published row)
    - positive-dimensional draw fraction per profile
    - wall-clock seconds and peak Macaulay matrix dimensions per draw
  falsification_conditions:
  - The re-implementation fails to reproduce any one of the three published control rows, in which
    case no false-positive rate is reported at all.
  - Null fire rate is below 0.01 for every surviving profile, falsifying the profile-dependence claim
    (C) and strengthening the existing positives.
  - Null fire rate is statistically indistinguishable across balanced and unbalanced profiles, falsifying
    claim (C) while leaving claim (B) intact.
  - The measured rate is unstable across seed blocks by more than its own confidence interval, in
    which case the ensemble is reported as ill-defined and no rate is claimed.
  - More than 20 percent of null draws are positive-dimensional, making the ensemble unrepresentative
    of the zero-dimensional systems the meter was built for.
  confounders:
  - Dense random forms may be a harder null than Semaev forms in a way unrelated to curves; the sparsity-matched
    arm exists to bound this and may itself be mis-specified.
  - Small primes (13 to 17 bits) mean random forms may share roots by chance, inflating rank deficits
    independently of syzygy structure.
  - The pure-Python re-implementation may differ from the Autolab Sage meter in tie-breaking at the
    first-fall degree, which would shift every rate by a constant.
  - D_reg_pred computed from the profile may not equal the value Autolab used if Autolab applied an
    undocumented truncation, which would move the comparison threshold.
  - The maximum degree ceiling truncates the search; a cell that would fire at D beyond the ceiling
    is recorded quiet, biasing the rate downward for high-degree profiles.
  interpretation_limits:
  - A measured false-positive rate is a property of this null ensemble and this meter implementation;
    it does not transfer to a different meter or a different null family without re-measurement.
  - Nothing here evaluates whether any ALPF representation actually decomposes points, and no decomposition,
    solve or speedup is claimed or refuted.
  - The rate is measured at 13 to 17 bit primes only and says nothing about behaviour at cryptographic
    scale.
  - A high null rate does not retract EXP-ALPF-011; it bounds how much a single firing cell licenses,
    which is a scoping statement, not a reversal.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement itself costs O(N * M(D)^omega) field
      operations where M(D) is the Macaulay matrix dimension at degree D and omega the linear-algebra
      exponent of the rank routine used.
    memory_exponent: No attack memory exponent is claimed. Peak memory is the largest Macaulay matrix
      held, empirically bounded below 4 GB for the profiles in the EXP-ALPF-011 table at the stated
      degree ceiling.
    best_known: The incumbent screening instrument is the Autolab validated first-fall meter as archived
      in EXP-ALPF-010 and EXP-ALPF-011, whose reported operating characteristic is a three-row self-validation
      table and a binary METER_VALIDATED flag. The incumbent for the underlying ECDLP problem is Pollard
      rho at roughly sqrt(n) group operations, which this proposal does not touch.
    hidden_overhead: 'The human cost is in reconciling a fresh pure-Python meter against a Sage meter
      whose exact first-fall tie-breaking is only implicitly documented in the archived analysis text;
      a one-degree convention difference silently shifts every reported rate. Lower-order term: the
      null sampler''s notion of ''dense'' is a modelling choice that no measurement inside the experiment
      can validate.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed against the axes that apply:
    this proposal produces no time, memory or data/query point on any ECDLP attack frontier, so there
    is no frontier row for it to sit on or be dominated by. Against the instrument frontier it strictly
    extends the incumbent three-row self-validation table (more draws, per-profile conditioning, confidence
    intervals) at strictly higher compute cost, so it is dominated by the incumbent on cost and dominates
    it on information.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively: the incumbent reports 1 positive
    and 2 negative control systems per campaign round (n=3, no interval); this reports n=200 per profile
    across at least 2 profiles at 2 field sizes with 95 percent Clopper-Pearson intervals, i.e. a
    false-positive rate resolvable to roughly plus or minus 0.03 rather than not resolvable at all.
    Zero change to any ECDLP time or memory exponent.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that a per-profile false-positive rate is measurable and reproducible
    at all: 0.85 -- the profiles are printed in committed artifacts and Macaulay rank over a small
    prime field is routine, so the main risk is meter-convention mismatch. Part of (B) requiring exact
    reproduction of the three published control rows: 0.5 -- the Autolab meter used a validated nontrivial-syzygy
    criterion on homogeneous leading forms whose exact truncation convention is described in prose,
    not code, in the archived analysis. Part (C), profile-dependence of the rate with an effect above
    0.1: 0.55 -- mechanically plausible because D_reg_pred for an unbalanced profile is driven by
    one high-degree generator, but the semiregular series may already absorb this, in which case (C)
    fails cleanly and is still a usable measured obstruction. Probability that any ALPF survivor is
    thereby shown label-ambiguous: 0.3, and this is deliberately NOT the deliverable.'
