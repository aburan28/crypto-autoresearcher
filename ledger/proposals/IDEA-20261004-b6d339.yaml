# IDEA-20261004-b6d339
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-b6d339
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-13 window table stores 4096 entries and a width-12 table stores 2048
  class: representation
  claim: >-
    A window of width 13 stores 4096 precomputed entries. A window of
    width 12 stores 2048. Four thousand ninety-six exceeds two thousand
    forty-eight by 2048. The product of the two table sizes is 8388608.
    Their sum is 6144. The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    12 is 4096. Two to the power 11 is 2048. Two width-12 tables both
    store 2048, so that gap is 0 and their product is 4194304. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 2048.
    baseline_embedding:
      parameter_slice: The widths 13 and 12 and the sizes 4096 and 2048.
      reproduction_check: >-
        Two readers must agree that 2 to the power 12 is 4096 and that
        2 to the power 11 is 2048.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 2048 drops the gap. Two width-12
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-12 table.
        predicted_gain: Two thousand forty-eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 4096 and 2048. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-12 tables. Both store 2048, and the gap is 0.
    proof_obligations:
      - claim: The width-13 table stores 4096 entries.
        responsibility: size
      - claim: The width-12 table stores 2048 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Four thousand ninety-six exceeds two thousand forty-eight by 2048.
  minimal_test:
    design: >-
      Compute 2 to the power 12 and 2 to the power 11. Do not add a
      curve point.
    controls:
      - Two width-12 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-13 table size is not 4096.
    - The product of the two sizes is not 8388608.
  confounders:
    - A width-12 table of size 2048 is a different window from a width-11 table of size 1024.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 2048 and 1024.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-13 table has size 2 to the power 12, and the
        frozen width-12 table has size 2 to the power 11.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Four thousand ninety-six stored entries versus two thousand forty-eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
      - KR-RHO-cb1c58
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 4096 and 2048 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 4096 versus 2048
    data_queries: Two frozen widths.
