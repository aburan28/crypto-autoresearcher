        The census (Z_D, signature multiset, #G*_D) per degree.
      distinct_preimage_search: >-
        The null and the Semaev arm are predicted to COLLIDE on the direct
        presentation (both Z_D = 0); that collision is the known answer. The
        collision that would matter is the digit arm's Semaev census
