  minimal_test:
    design: >-
      STAGE 0 (zero compute, blocking): obtain the paper (DOI 10.1515/jmc-
      2019-0029) and transcribe its definitions of semi-normality, NS(Syz),
      Phi(s) and #G*; reconcile with claim (A); record every divergence.
      If the paper's object is not the census, the census is still filed as
      the F5-criterion witness and the Yokoyama name is dropped from it.
      STAGE 1 (hours): field-generic port of macaulay.py with signatures
      and the F5 discard test; p = 2 calibration against KN-FIND-006 at
      k = 4, 5, 6. STAGE 2 (hours): positive control at k in {1, 2, 4, 8}
      on both presentations. STAGE 3 (hours): direct arm m in {2, 3}, B in
      {4, 6, 8, 12}, p in {2^12, 2^16}, 5 seeds, null at every cell.
      STAGE 4 (hours): digit arm m = 2, d = 2, s in {2..5}, 84cdb7's
      memory contract, null at every cell. STAGE 5 (zero compute): tables,
      scaling of any excess in B and s, interface check against 093497 /
      84cdb7 deficits. The cheapest valid discriminator is Stages 1-2: an
      instrument that reproduces the committed binary numbers and recovers
      planted syzygies exactly is the deliverable even before any
      prime-field cell runs.
    controls:
      - 'p = 2 known-answer calibration against KN-FIND-006 (blocking)'
      - 'planted redundant generators, k dialled, exact recovery (blocking)'
      - 'random same-support null, forced Z_D = 0 below d_reg (blocking)'
      - 'direct presentation at B^m / p near 1 as a mechanism-known positive control'
      - 'frozen generator order and monomial order, recorded per cell'
      - 'summed census equals the 093497 / 84cdb7 deficit on shared cells (interface)'
    required_metrics:
      - 'Z_D, signature multiset, #G*_D per degree, per arm, per cell'
      - 'recovery count on the positive control per k'
      - 'null-arm Z_D per cell'
      - 'ratio #G* / (m B^{m-1}) on the direct arm'
      - 'scaling of any digit-arm excess in s'
      - 'column counts, peak RSS, wall time per cell'

  falsification_conditions:
    - >-
      The p = 2 calibration misses KN-FIND-006's integers. Instrument
      failure; nothing reported.
    - >-
      The positive control does not recover k exactly. Instrument blind;
      no negative reportable.
    - >-
      The null shows Z_D > 0 at p >= 2^12. The cell is void; if it
      persists across seeds the null construction is wrong.
    - >-
      Direct arm Z_D > 0 below d_reg at B^m / p < 0.1. The mechanism's
      interpolation argument is wrong as stated and is restated with the
      observed signatures.
    - >-
      #G* / (m B^{m-1}) decreasing in B on the direct arm. The generic count
      is not tracked; routed to independent review before any reading
      against the Yokoyama bound.
    - >-
      Digit arm Z_D = 0 throughout. Controlled null for the digit
      presentation; the binary 8 dim V family does not appear over F_p in
      this presentation at the tested scale.

  confounders:
    - >-
      GENERATOR ORDER. The criterion's discard set depends on the order;
      a different order redistributes Z_D across degrees without changing
      the sum. Frozen and recorded.
    - >-
      TINY p. Accidental rank drops of density O(binom(n+D,D)/p) produce
      spurious unpredicted zero-reductions; p >= 2^12 and 5 seeds bound
      this and the null measures it directly.
    - >-
      PLANTED TARGETS fix |Z| by construction; the direct-arm mechanism
      depends on |Z| being small relative to B^m, which planting keeps true
      only if accidental decompositions are few (checked by enumeration).
    - >-
      THE RECONSTRUCTION IS RECALLED. If the paper's #G* is defined on a
      different basis (e.g. after interreduction), the measured #G* is a
      different number; Stage 0 exists for this.

  interpretation_limits:
    - >-
      A census, not a cost: any excess is read through 7ea402 and d38a8c
      before it is called anything.
    - >-
      Generating-set-level and order-dependent; never an ideal invariant.
    - >-
      Toy scale; no statement about the Yokoyama lower bound beyond the
      tested cells; no ECDLP claim.
    - >-
      No status change to H-SIG-001 or RQ-SIG-001 is proposed; the
      observation that their planned object was on the wrong field is a
      pointer for the Coordinator.

  heuristic_assumptions:
    - id: H1
      statement: >-
        F5-SEMI-REGULARITY OF THE NULL. For the random same-support system
        over F_p at the tested shapes, Z_D = 0 for every D < d_reg with
        probability at least 1 - c binom(n+D, D)/p for an absolute c.
      rigorous_support: >-
        RIGOROUS: for a regular sequence the Koszul syzygies generate the
        syzygy module, so every zero-reduction is predicted (the F5
        theorem for regular sequences, KN-LIT-028 corpus note). CLASSICAL
        DISTRIBUTION IMITATED: Froberg's conjecture / Bardet-Faugere-Salvy
        semi-regularity for the overdetermined case, plus Schwartz-Zippel
        for the rank-drop probability over F_p.
      validation_plan: >-
        SAMPLE: the null at every cell, 5 seeds, both primes. COMPARISON:
        zero. TAIL CHECK: the maximum null Z_D across all cells and its
        dependence on p (must fall as 1/p). SAMPLED PARAMETERS RECORDED:
        p, m, B or (d, s), seed, order.
    - id: H2
      statement: >-
        GENERIC #G* COUNT. On the direct presentation #G* = m B^{m-1}
        (1 + o(1)) in the non-reduced basis, uniformly in B on the ladder.
      rigorous_support: >-
        RIGOROUS ingredient: NS(J) is exactly the box of side B (CRT). The
        count is RECALLED from the Yokoyama et al. analysis under their
        statistical assumptions and is imitated by the one-variable
        Euclidean algorithm, where the number of remainders is deg f_V.
        Stage 0 checks the exact statement.
      validation_plan: >-
        SAMPLE: direct arm at B in {4, 6, 8, 12}, m in {2, 3}. COMPARISON:
        ratio to m B^{m-1} in [0.5, 2] and constant in B. TAIL CHECK: the
        cell with the smallest ratio.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. The instrument costs one echelon form per
      degree per cell on binom(n+D, D) columns, the same envelope as
      84cdb7. Under the recalled Yokoyama bound the direct-presentation
      oracle costs at least about m B^{2m-1} field operations, which is
      consistent with 093497's B^{m omega} at omega = 2 and is dominated by
      enumeration; nothing here changes that.
    memory_exponent: >-
      Instrument: as 84cdb7. No attack memory.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) and O(1) memory; BSGS; kangaroo;
      automorphism-discounted rho; Pohlig-Hellman; S T^2 = N preprocessing;
      algebra-free MITM index calculus at N^{1/2+1/m}. For the census, the
      incumbent instruments are the graded-rank deficit meters of
      093497 / 84cdb7 / macaulay.py.
    hidden_overhead: >-
      The F5 discard test needs leading-term sets of the earlier generators
      at every degree, which is a second reduction per degree; the
      signature bookkeeping is a constant factor. Nothing asymptotic is
      hidden because nothing asymptotic is claimed.
    tradeoff_note: >-
      None.

  dominated_by: >-
    n/a (no result claimed). ROWS CHECKED: parallel rho with negation
    dominates on every axis; BSGS on time; kangaroo not comparable;
    automorphism-discounted rho on special curves; Pohlig-Hellman not
    comparable; generic preprocessing S T^2 = N on online time;
    algebra-free MITM index calculus not approached. No queries. As an
    instrument it dominates the corpus's deficit meters on localization
    (signatures) and is dominated by them on maturity.
  sota_delta: >-
