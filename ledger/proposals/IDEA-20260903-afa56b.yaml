idea:
  id: IDEA-20260903-afa56b
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-dc126c
  added: '2026-09-03'
  title: >-
    THE YOKOYAMA SEMI-NORMALITY OBJECT IS A PRIME-FIELD OBJECT AND WAS
    APPLIED TO THE WRONG FIELD: reconstruct it from the literature (the
    D5_YOKOYAMA_OBJECT.md the honest ledger cites is NOT in this repository)
    as the F5-criterion reduction census - the count Z_D of reductions to
    zero at degree D that the Koszul/principal syzygies do NOT predict,
    localized by signature, together with the non-reduced basis size #G*
    against its generic value m B^{m-1} - and implement it as an instrument
    with a planted-redundant-generator positive control of dialled size k
    (exactly k unpredicted zero-reductions at chosen degrees) and a random-
    same-support null whose forced value is Z_D = 0 below d_reg, on the
    direct and digit presentations over F_p; an excess is a localized
    syzygy witness and NOT a cost statement
  class: measurement

  claim: >-
    (A) THE MISSING FILE, AND THE RECONSTRUCTION WITH PROVENANCE. The
    honest ledger (inputs/h100_session/EC_SIEVE_HONEST_LEDGER.md, item D5)
    reclassified the old "KILL (proxy)" to OPEN / wrong-object because the
    proxy measured normality (normalization charts), whereas Yokoyama's
    semi-normality is a signature / F5 / S-polynomial condition on NS(Syz)
    and Phi(s) with #G* counting nonzero S-polynomial remainders in the
    non-reduced Groebner basis, and says the exact object is recovered in
    D5_YOKOYAMA_OBJECT.md. THAT FILE IS ABSENT from this repository
    (repository-wide glob for D5_YOKOYAMA* returns nothing; the
    orchestrator independently verified the absence). What survives of it
    in committed records is one line of H-SIG-001: "Syz = (J : S), NS(Syz),
    sig(f) = LM(RSC(f)), Phi(s), #G* counted on the non-reduced GB" with
    generic value "m d^{m-1}" (d there being the factor-base size, written
    B here). The primary source is Yokoyama, Yasuda, Takahashi, Kogure,
    "Complexity bounds on Semaev's naive index calculus method for ECDLP",
    J. Math. Cryptol. 14 (2020) 460-485, DOI 10.1515/jmc-2019-0029 (corpus
    note KN-LIT-4558, whose abstract says the PDP ideal has a special
    structure, that its Groebner computation is an extension of the extended
    Euclidean algorithm with the help of signatures, and that this yields a
    LOWER bound under simple statistical assumptions on summation
    polynomials; the note's local PDF path does not exist in this checkout
    and the publisher page returned HTTP 405 to WebFetch). Everything
    beyond those two internal sentences below is RECALLED and marked.
    RECONSTRUCTION (recalled, to be checked against the paper at Stage 0):
    for the direct presentation I = (S_{m+1}(x_1..x_m, x_R), f_V(x_1), ...,
    f_V(x_m)) with J = (f_V(x_1), ..., f_V(x_m)) the membership ideal, the
    normal set NS(J) is the box of monomials x^alpha with alpha_i < B, of
    size B^m; the S-polynomials of S with the f_V(x_i), reduced in NS(J),
    are the multivariate analogue of the remainders of the Euclidean
    algorithm for gcd(S, f_V) in one variable; "semi-normal" is the
    condition that the colon/syzygy module Syz = (J : S) and the signatures
    of the successive remainders behave generically, so that the non-
    reduced basis G* has about m B^{m-1} elements (one per boundary face of
    the box in each variable direction), each of size up to B^m, giving a
    cost lower bound of order m B^{2m-1} field operations per solve -
    consistent in order of magnitude with IDEA-20260808-093497's ratio
    B^{m(omega-1)+1} at omega = 2 - and hence the conclusion that the naive
    method cannot beat generic algorithms.
    (B) THE OBJECT IS PRIME-FIELD AND DIRECT-PRESENTATION. The membership
    ideal J with deg f_V = B is exactly the prime-field direct presentation
    of RQ-SDEG-001 / 093497 / afe4ce. H-SIG-001 and RQ-SIG-001 planned to
    measure #G* on the BINARY CHAINED Weil-descent system, where membership
    degree is 2 and the normal set is not a box of side B; that is a second
    wrong-object error on top of the normality proxy, and it is why no
    implementation ever happened. This record returns the object to the
    field and presentation it was defined on and adds the digit
    presentation of IDEA-20260830-84cdb7, where J is the complete
    intersection of the ms digit equations and NS(J) is the multilinear
    box of side d.
    (C) THE INSTRUMENT: THE F5-CRITERION REDUCTION CENSUS. Order the
    generators f_1 = S, f_2 = f_V(x_1), ..., f_{m+1} = f_V(x_m) (and the ms
    digit equations after S in the digit arm). At Macaulay degree D the rows
    are the products t f_i with t a monomial of degree D - deg f_i; the
    SIGNATURE of the row is (t, i). The F5 criterion (Faugere 2002, KN-LIT-
    028, corpus note) discards a row (t, i) when t is a leading term of the
    ideal generated by f_1, ..., f_{i-1} in the appropriate degree, because
    such rows are exactly the ones the Koszul (principal) syzygies
    f_j e_i - f_i e_j make redundant. For a SEMI-REGULAR sequence every
    remaining row is independent: the number of reductions to zero among
    the F5-surviving rows is ZERO at every D below the degree of regularity.
    Define, per degree, Z_D = (number of F5-surviving rows) minus
    rank(surviving rows) = the number of reductions to zero the F5 criterion
    does NOT predict, and record the signatures (t, i) of a basis of the
    corresponding left kernel. Define #G*_D = the number of new leading
    monomials contributed at degree D by the surviving rows (the size of the
    non-reduced basis truncated at D). Summed over D below d_reg, Z_D is the
    Macaulay deficit of 093497 / 84cdb7 recomputed by a different route
    (rows minus trivial syzygies minus rank, instead of prediction minus
    rank); what the census ADDS is the signature localization - WHICH
    products of WHICH generators reduce to zero unexpectedly - and #G*,
    which is the object the lower bound is stated on.
    (D) THE TWO CONTROLS, WITH FORCED VALUES. NULL: the same generator
    shape with S replaced by a uniformly random polynomial of the same
    multidegree support (093497's null, 84cdb7's null in the digit arm);
    forced value Z_D = 0 for all D < d_reg_null with probability at least
    1 - O(binom(n+D, D)/p) (a random system over a large prime field is
    semi-regular in the F5 sense except on a rank-drop set of that density,
    the classical statement imitated being Froberg's conjecture), and #G*_D
    tracking the generic count. POSITIVE CONTROL OF DIALLED SIZE: append k
    redundant generators g_j = u_j S + v_j f_V(x_{i_j}) with random u_j, v_j
    of chosen degrees so that deg g_j = D_j; the syzygy e_{g_j} - u_j e_S -
    v_j e_{f} is NOT a Koszul syzygy of the sequence and is not predicted by
    the criterion, so the census must return EXACTLY k unpredicted
    zero-reductions, one at each D_j, with the recovered signatures naming
    g_j. Dial k in {1, 2, 4, 8} and D_j across the range; recovery must be
    exact or the instrument is blind and no negative may be reported.
    (E) WHAT AN EXCESS WOULD AND WOULD NOT MEAN. Z_D > 0 on the Semaev arm
    with Z_D = 0 on the null and exact recovery on the positive control
    means the presentation's first syzygy module has generators outside the
    Koszul span at degree D, localized by signature: a structural,
    generating-set-level fact (IDEA-20260830-ad0be4) about the presentation.
    It does NOT mean lower solving cost (IDEA-20260806-7ea402: a deficit
    costs nothing unless it moves the first solve degree; IDEA-20260805-
    d38a8c: leverage vanishes as n^{1-D}); it does NOT refute the Yokoyama
    lower bound unless #G* falls below m B^{m-1} by a factor that GROWS in
    B; and it is NOT an ideal invariant (the ideal is I(Z), IDEA-20260830-
    cb8e46). The pre-registered expectation for the DIRECT presentation is
    Z_D = 0 throughout (see mechanism), so the informative arm is the DIGIT
    presentation.

  mechanism: >-
    WHY THE DIRECT PRESENTATION IS EXPECTED TO BE F5-SEMI-REGULAR, DERIVED.
    A non-Koszul syzygy at degree below B + deg S involving S has the form
    u S + v_1 f_V(x_1) + ... + v_m f_V(x_m) = 0 with deg u < B, i.e. u S lies
    in J, i.e. u S vanishes on the grid V^m (J is radical, the CRT theorem
    of bdca13/cb8e46). Since S is nonzero on all of V^m except the
    decomposition set Z of expected size 2^m B^m / p, u must vanish on
    V^m minus Z, a set of about B^m grid points, which forces deg_{x_i} u
    >= B - 1 in every variable unless |Z| is a positive fraction of B^m.
    So no unpredicted syzygy exists below degree about m(B-1) + deg S, which
    is above d_reg = ceil((m(B-1) + D_S)/2); the direct presentation is
    predicted F5-semi-regular below d_reg, #G* is predicted at the generic
    count, and this arm is a KNOWN-ANSWER control for the census rather
    than a discovery arm. The prediction fails exactly when |Z| is large,
    i.e. when B^m is comparable to p, which is the toy regime cb8e46 warns
    about; the ladder keeps B^m / p below 0.1 so that this is not what is
    measured.
    WHY THE DIGIT PRESENTATION IS THE DISCOVERY ARM. There J is generated by
    ms equations of degree d, NS(J) is the multilinear box of side d, and
    the substituted S has low degree per digit block; low-degree u with
    u S in J now only needs u S to vanish on the digit box, and u can be a
    product of few digit factors. Whether such u exist below d_reg =
    ceil((ms(d-1) + 2m)/2) is the question KN-FIND-006 answered
    affirmatively for the BINARY chained system (8 dim V structural
    syzygies, exhibited as P(1 + P) = 0 degenerations); the census here
    asks it for the prime-field direct-substitution digit system and, if the
    answer is yes, reports the signatures, which is the datum KN-FIND-006
    lacks ("a direct count of the degeneracy subspace ... the favoured open
    route").
    IMPLEMENTATION. A field-generic port of experiments/EXP-SBRG-60c55e/
    driver/macaulay.py (boolean, F_2) to F_p with the digit reduction rule,
    plus a signature index on rows and the F5 discard test implemented as
    membership of t in the leading-term set of the previously processed
    generators at degree D - deg f_i (computed incrementally from the same
    reductions). Z_D and the kernel signatures come from the left kernel of
    the surviving row block, which the same echelon form yields. No F5
    implementation is required, because the census measures the criterion,
    not the algorithm. At p = 2 with the boolean chained system the port
    must reproduce KN-FIND-006's deficit(D = 3) = 1 and deficit(D = 4) =
    8k - 1 as sum_{D'<=D} Z_{D'} - this is the known-answer calibration and
    it is blocking.

