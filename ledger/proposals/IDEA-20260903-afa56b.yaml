      the F5 criterion and Z_D depend on it, and the census is reported per
      order with degrevlex as the frozen monomial order.
    - >-
      Toy scale: direct arm m in {2, 3}, B in {4, 6, 8, 12}, p in {2^12,
      2^16} with B^m / p < 0.1; digit arm as 84cdb7's ladder m = 2, d = 2,
      s in {2..5}; planted targets.
    - >-
      Exact arithmetic over F_p; no CAS termination events; the p = 2 mode
      is a calibration mode only.

