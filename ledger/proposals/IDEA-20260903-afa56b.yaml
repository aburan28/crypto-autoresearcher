    degrees; forced recovery exactly k with the planted signatures. SECOND
    POSITIVE CONTROL with a known mechanism: the direct presentation at
    B^m / p near 1. KNOWN-ANSWER (blocking): p = 2 boolean chained system
    against KN-FIND-006. STRUCTURAL TELL: a Semaev-arm excess that is the
    same integer at every B (direct arm) or every s (digit arm) is the
    artifact signature; a genuine syzygy family must scale with the
    presentation (KN-FIND-006's did, as 8 dim V).

