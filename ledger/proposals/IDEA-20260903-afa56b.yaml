  object_first_candidate:
    tracked_object: >-
      The F5-criterion reduction census: per degree, the number of
      unpredicted reductions to zero and the multiset of their signatures,
      plus the non-reduced basis size #G*_D.
    lossiness: >-
      GENUINELY LOSSY: the full left kernel of the Macaulay matrix (a
      vector space) is projected to its dimension outside the Koszul span
      and to the leading signatures of a basis; the kernel vectors
      themselves are discarded. Not a change of coordinates: two systems
      with the same deficit and different signature multisets are
      distinguished, two with the same signatures and different kernel
      vectors are not.
    propagation: >-
      Deterministic under degree increment: the surviving-row set at D + 1
      is computed from the leading terms found at D, and an unpredicted
      zero-reduction at D generates predicted ones at higher degree (its
      monomial multiples), which the criterion then discards; so the census
      counts each non-Koszul syzygy once, at its birth degree, exactly the
      "born at D" quantity d38a8c calls residual_D.
    survival_score: >-
      Survives across presentations and characteristic (the same code
      path at p = 2 reproduces the committed binary numbers); dies at a
      change of generator order, which is disclosed and frozen.

  null_object_control: >-
    NULL (blocking): random polynomial of the same multidegree support in
    place of S, memberships unchanged; forced Z_D = 0 for D < d_reg with
    probability at least 1 - O(binom(n+D,D)/p), and #G*_D at the generic
    count; a nonzero null Z_D at p >= 2^12 voids the cell. POSITIVE CONTROL
