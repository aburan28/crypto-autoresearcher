idea:
  id: IDEA-20260816-684f4a
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: Compute at zero compute the three exact regions of the dimension-by-leakage plane - information-theoretically
    impossible, guaranteed under an exact shortest-vector oracle, and undecided between them - and
    report what fraction of the plane theory leaves undecided at concrete modulus sizes.
  class: theory
  claim: '(A) At any concrete modulus size n, lattice dimension D and leaked fraction u, three exact
    statements can be made with no compute at all. First, an information-theoretic impossibility region
    I: cells where the leak leaves more unknown bits than the modulus constrains, so that a positive
    number of distinct candidate primes remain consistent and NO method can single one out; this is
    a counting statement, exact and unconditional. Second, a guarantee region G: cells where the Howgrave-Graham
    condition holds for the exact shortest vector of the constructed lattice, so that an exact shortest-vector
    oracle would certainly produce an integer identity. Third, the undecided band U, everything else,
    where the sufficient condition fails but nothing forbids success. (B) The claim is that U is LARGE
    at concrete sizes - that it occupies a substantial fraction of the reachable dimension-by-leakage
    plane - and that the practically observed reach of any implementation sits inside U rather than
    at the edge of G, so that the operative frontier is one that no exact condition currently locates.
    The fraction of the plane occupied by U, computed exactly as a rational area on a declared grid,
    is the deliverable. (C) The claim is that I, G and U are cheap enough to compute that they should
    precede every measurement in this bucket: every other entry''s grid can be pre-screened, cells
    in I dropped as uninformative, and cells in G used as positive controls where success is guaranteed
    if the implementation is correct. (D) WHAT IS NOT CLAIMED: no attack; no assertion that any published
    bound is wrong, since a sufficient condition is not required to be tight and a large U is exactly
    what a sufficient condition permits; no claim that success is IMPOSSIBLE in U, which is the opposite
    of what U means; and no claim that I is the only impossibility argument, only that it is exact
    and unconditional. Region G is stated relative to an exact shortest-vector oracle, which no implementation
    here has, and is therefore not a prediction about any run.'
  mechanism: 'Stage 1, exact and symbolic: for the reproduced construction, write the lattice basis
    as a function of (n, D, u), and compute its determinant exactly as an integer expression. Stage
    2: derive the Howgrave-Graham norm requirement at each cell as an exact rational inequality, and
    evaluate G by comparing it against the Minkowski or Hermite-type guarantee for the EXACT shortest
    vector, which is a closed-form function of D and the determinant; every comparison is exact rational
    arithmetic. Stage 3: evaluate I by counting: with k leaked bits of a prime of n/2 bits and a modulus
    of n bits, compute exactly the expected number of consistent candidates and mark cells where it
    exceeds one by a declared margin. Stage 4: report I, G and U as exact regions on a declared grid,
    with the area of U as a rational fraction of the reachable plane. Stage 5, reusing runs rather
    than commissioning them: overlay the measured success region from other entries in this bucket
    and report where it sits. Refutation route: if G is empty at every reachable dimension, the guarantee
    region is vacuous here and the entry reports that; if measured success is ever found inside I,
    the counting is wrong or the instance generator is broken, and either is a serious finding about
    the bucket''s foundations.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -rih for ''Minkowski'', ''Hermite'', ''feasibility'',
      ''certified'' across ledger/proposals/ and reading matching lines; re-read KN-TECH-015''s applicability-limits
      section, which states the bound is a hard archimedean window outside which the method says nothing;
      re-read RQ-RSA-d46f02''s constraints on inheriting numbers.'
    results: The corpus uses Hermite factors extensively in lattice cost models, especially in the
      ML-KEM and TNFS lanes, always as an input to a predicted attack cost. Certified and complete
      language appears in KN-TECH-015, which records that the small-root method is complete within
      its bound, and in xedni coefficient-bound controls elsewhere. No record in the corpus partitions
      a parameter plane into an exact impossibility region, an exact guarantee region and an undecided
      band, and none reports the area of the undecided band as a quantity. IDEA-20260808-e2315e reasons
      about reach as a limit rather than as a region.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the three-region partition of the concrete parameter plane with exact rational boundaries,
      and the AREA of the undecided band as the reported quantity and as a pre-screen for every measurement
      grid in this bucket. Assembled from known parts: the Howgrave-Graham condition and the completeness-within-bound
      language of KN-TECH-015, elementary counting for the impossibility region, and closed-form shortest-vector
      bounds already used elsewhere in this repository as cost-model inputs.'
  object_first_candidate:
    tracked_object: The cell (n, D, u) labelled by which of the three regions it lies in, carried
      across the declared grid; equivalently the indicator function of I, G and U as exact rational-boundary
      sets.
    lossiness: 'Genuinely lossy. The full state at a cell is the entire lattice basis, its full successive
      minima and the whole distribution of consistent candidate primes. The tracked object retains
      a single label from a three-element set, discarding the basis, the minima beyond the first,
      and everything about which candidates are consistent. The discard is compatible with the target
      operation - moving across the grid - because the label is defined by exact inequalities that
      are functions of (n, D, u) alone, so it propagates deterministically without needing anything
      discarded. The cost of the discard is stated: two cells with the same label can be very differently
      placed relative to their boundaries, so the SIGNED MARGIN to each boundary is retained alongside
      the label rather than dropped, which is what makes the band''s interior structure visible.'
    propagation: One step of the target operation is one grid step in D at fixed (n, u), or one step
      in u at fixed (n, D). Increasing D increases the determinant and the dimension together, moving
      the guarantee boundary in a direction that is computable exactly rather than argued; increasing
      u shrinks the box and moves the Howgrave-Graham requirement. The object propagates as a label
      that changes only when an exact rational inequality changes sign, so the boundaries are locatable
      to machine-exact precision rather than being sampled.
    survival_score: 'The partition survives everywhere the construction is defined, since it is symbolic;
      what can dissolve is its usefulness. It stops being informative if G is empty over the whole
      reachable grid, or if I covers so little that the screen removes nothing. Concretely: expected
      to be informative for D from 8 to 64 and n from 64 to 1024, and expected to become uninformative
      in the large-D limit where G grows to fill the plane and the whole exercise reduces to the asymptotic
      statement.'
  null_object_control: 'The identical symbolic computation runs against a null construction: a lattice
    of the same dimension and the same determinant built from a random unimodular transform of a generic
    basis with NO planted polynomial structure. The null must show that region I is unchanged, since
    counting depends only on the leak and not on the lattice, while region G is essentially unchanged
    as well, since the shortest-vector guarantee depends only on dimension and determinant. That is
    the point of the null: it demonstrates that G and I carry no information about the CONSTRUCTION,
    only about its coarse invariants, and therefore that any predictive content about a particular
    construction must live in U. A second, executable null is required before the overlay in Stage
    5: measured success from any other entry, when re-run on the null lattice, must vanish, confirming
    that success in U is a property of the planted structure.'
  discriminated_from:
  - 'Entry three of this bucket (equal-determinant sufficiency): that entry measures whether reach
    depends on more than dimension and determinant. This entry computes, symbolically and with no
    measurement, where dimension and determinant alone already decide the question, and the two are
    complementary - entry three works inside U, which this entry delimits.'
  - 'Entry one of this bucket: measures a reach curve. This entry computes regions with no runs at
    all and then overlays existing measurements, commissioning none.'
  - 'KN-TECH-015: records the method as complete within its bound. This entry makes bound an explicit
    region on a concrete parameter grid with exact rational boundaries, and adds the impossibility
    region that KN-TECH-015 does not mention.'
  - 'Hermite-factor cost models used in the ML-KEM and TNFS lanes: those predict the cost of achieving
    a reduction quality. This entry uses an exact shortest-vector bound to delimit a guarantee region
    and explicitly disclaims any cost prediction.'
  - 'Asymptotic reach arguments such as IDEA-20260808-e2315e: those take a limit; this entry refuses
    the limit and reports areas on a finite grid, which is the whole content.'
  assumptions:
  - The construction's determinant is expressible exactly as a function of (n, D, u), which requires
    the construction to be filed exactly rather than approximately.
  - The counting argument for I uses a declared model of how many primes are consistent with a leak;
    that model is elementary but is a model, and its margin is declared rather than assumed exact.
  - The closed-form shortest-vector bound used for G is applied only as a guarantee about the exact
    shortest vector and never as a prediction about a reduction algorithm's output.
  - The declared grid is fine enough that region areas computed on it approximate the continuous areas
    within a stated error, which is checked by refining the grid once.
  predictions:
  - metric: area of the undecided band U as a fraction of the reachable plane at n = 256 over D from
      8 to 64
    direction: higher
    minimum_effect: 0.25
  - metric: location of the measured success frontier from other entries relative to G
    direction: different
    minimum_effect: 'Forced value: the measured frontier lies strictly inside U and not on the boundary
      of G. No numeric distance is pre-committed.'
  - metric: any measured success inside region I
    direction: lower
    minimum_effect: 0.0
  - metric: area of U as D grows toward the largest tested dimension
    direction: lower
    minimum_effect: No pre-committed rate. Whether U contracts appreciably over a reachable range
      of D is exactly the finite-size question and pre-committing to a rate would presuppose it.
  minimal_test:
    design: This entry's core is zero compute and can be delivered in full without any run. Fix n
      = 256, sweep D from 8 to 64 in steps of 4 and u on a grid of 0.005, and evaluate the three exact
      predicates at every cell using exact rational arithmetic, recording the signed margin to each
      boundary. Report I, G and U as regions, the area of U as a rational fraction, and a refined-grid
      check that the areas are stable. Then, using ONLY run records that other entries in this bucket
      have already produced, overlay the measured success frontier and report which region it falls
      in and its signed margin. The only executable arm required is the null-lattice arm, which must
      be run in the same invocation as any overlay it is used to interpret. This discriminates because
      a small U would collapse the whole motivation for measurement in this bucket, and a measured
      success inside I would invalidate the bucket's instance generator, and both answers are obtained
      for the price of symbolic arithmetic.
    controls:
    - Null lattice of matched dimension and determinant with no planted structure, showing that I
      and G carry no construction-specific information.
    - Executable null arm confirming that measured success vanishes on the null lattice, run in the
      same invocation as any overlay.
    - 'Grid-refinement control: all three region areas recomputed at half the grid step.'
    - 'Degenerate-case control: at u = 1 the leak determines the prime entirely and I must be empty
      and G must contain the cell, which is a self-test of the predicates.'
    - 'Exact-arithmetic control: every predicate evaluated in exact rationals, with a parallel floating-point
      evaluation reported only to confirm no boundary is decided by rounding.'
    required_metrics:
    - exact rational area of region U as a fraction of the reachable plane, per n
    - exact rational areas of I and G
    - signed margin to each boundary, per cell
    - region label of the measured success frontier taken from existing run records, with its signed
      margin
    - grid-refinement stability of all three areas
    - count of cells where the floating-point and exact evaluations disagree, which must be zero
  falsification_conditions:
  - 'Region G is empty over the whole reachable grid: the guarantee region is vacuous at these sizes
    and the entry reports that rather than an area comparison.'
  - 'Region U occupies less than a quarter of the reachable plane: the central claim that theory leaves
    the operative frontier undecided is refuted at these sizes.'
  - 'A measured success from any existing run record falls inside region I: either the counting model
    or the instance generator is wrong, and the bucket''s foundations must be re-examined before any
    other result is read.'
  - 'Grid refinement changes any area by more than its declared error: the reported areas are grid
    artifacts.'
  - 'Floating-point and exact evaluations disagree on any cell: a boundary was decided by rounding
    and the affected cells must be recomputed.'
  confounders:
  - The counting model for I embeds an assumption about prime density and about how a leak constrains
    candidates; a sloppy model would shrink or inflate I without any signal that it had.
  - The shortest-vector bound used for G may be a loose one, which enlarges U for reasons of technique
    rather than of substance; the bound used is declared and the area is reported as conditional on
    it.
  - Grid discretisation converts thin regions into zero area; the refinement control detects this
    only for regions above one refined cell in width.
  - Overlaying measured frontiers imports every confounder of the runs that produced them, including
    the reducer configuration, which is why the overlay is reported with those runs' manifests attached.
  - The reachable plane is itself a choice - which D and u ranges count as reachable - and the areas
    are fractions of that choice, so the choice is declared in advance and the areas are also reported
    as absolute cell counts.
  interpretation_limits:
  - A large U is not a criticism of any bound; it is the expected consequence of a sufficient condition
    being sufficient rather than necessary.
  - Region G is defined against an exact shortest-vector oracle that no implementation here has, so
    it is not a prediction about any run.
  - Region I depends on the declared counting model and is exact only relative to it.
  - 'Nothing here concerns deployed RSA, any attack, or any security consequence, and no direction
    is declared impossible: U is precisely the region where nothing is decided.'
  target_complexity:
    time_exponent: No attack exponent is claimed. The computation is symbolic and its cost is exact
      rational arithmetic over a few thousand grid cells, which is seconds; that cost is reported
      for completeness and is not a complexity claim about anything.
    memory_exponent: No attack memory exponent is claimed. Memory use is negligible and is recorded
      anyway, so that the zero-compute character of the entry is documented rather than asserted.
    best_known: 'The incumbent is the asymptotic statement itself, as recorded in KN-TECH-015 and
      as the anchor question RQ-RSA-d46f02 describes it: a bound with an unquantified sufficiently-large-dimension
      clause. The incumbent partition of a concrete parameter plane into decided and undecided regions
      is that none exists in this repository.'
    hidden_overhead: The human cost is entirely in writing the determinant and the counting model
      down exactly rather than approximately; an approximate determinant makes every boundary wrong
      by an unknown amount while looking identical. There is no machine-side hidden cost, which is
      the point.
  dominated_by: n/a (no result claimed). No solver, attack or cost point is proposed, so no time,
    memory or query frontier row applies. I did not check frontier rows because there is no claimed
    result that belongs on one, and writing null here would be a fabrication.
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is an exact
    three-region partition and the area of the undecided band, in a repository whose only current
    statement about where the method works is an asymptotic clause.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'The three predicates being computable exactly once the construction is
    filed: 0.85, the residual risk being an intractable exact determinant. Region U exceeding a quarter
    of the reachable plane: 0.75, since a sufficient condition and an information-theoretic bound
    rarely meet. The measured frontier from other entries lying strictly inside U: 0.8. Region G being
    non-empty at reachable dimension: 0.55, and an empty G would itself be a sharp and reportable
    statement about how far the guarantee is from the machine. No measured success inside I: 0.95,
    and a violation would be a foundations-level problem rather than a result.'
