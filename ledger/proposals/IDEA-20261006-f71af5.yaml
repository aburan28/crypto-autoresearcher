      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-6239aa
      provenance: internal
      claim: >-
        Parallel rho with distinguished points splits about
        sqrt(pi n / 2) iterations across processors. This record does
        not store distinguished points.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on negation classes changes the iteration count by a
        factor near sqrt(2). This count is constant on {P, -P} because
        x is, and it does not walk those classes.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
  assumptions:
    - p=157 is prime. The run recomputes this by trial division. This session checked that no prime at most 13 divides 157.
    - >-
      For E0 the quantity 4 A^3 + 27 B^2 is 27, which is not 0 in
      F_157. For E1 it is 436, which is 122 in F_157, not 0. The run
      recomputes both. A zero leaves the cell unmeasured.
    - The integer representative of a field element is its residue in 0 through 156. No other lift is used.
    - A point with y=0 has 2P at infinity and is not eligible. Infinity is not eligible.
  predictions:
    - metric: C(E0) minus C(E1)
      direction: higher
      minimum_effect: C(E0) is strictly greater than C(E1)
  minimal_test:
    design: >-
      Confirm 157 is prime. Recompute both discriminants and both
      point counts. For every affine point with nonzero y, compute
      2P by the chord-and-tangent double and again by P+P, require
      agreement, and increment C when the lifted x decreases. Compare
      the two counts.
    controls:
      - >-
        Nonsingularity and ordinary controls. A zero discriminant or
        a point count equal to 158 leaves the cell unmeasured. That
        outcome is not the negative.
      - >-
        Two addition methods. The doubling formula and P+P agree on
        every eligible point. One disagreement voids the instrument.
      - >-
        Label control. Shuffle the eligible x-lifts with
        s_0 = 16194293, s_{k+1} = (1103515245 * s_k + 12345) mod 2^31,
        Fisher-Yates. Report the shuffled comparison beside the true
        counts. Do not write the shuffled counts into C.
    required_metrics:
      - C(E0) and C(E1)
      - both point counts
      - the shuffled comparison, reported beside the true one
  falsification_conditions:
    - C(E0) is less than or equal to C(E1) after the instrument checks pass. That comparison is the negative.
    - Either model is singular, or either point count equals 158. The comparison is then unmeasured.
    - The two addition methods disagree. The instrument is void.
  confounders:
    - Group order differs between the two curves. The claim compares raw eligible counts, not rates. A later rate comparison is a different record.
    - j=0 has extra automorphisms. A gap at j=0 is still a gap of this predicate, not an automorphism discount on rho.
  interpretation_limits:
    - A strict inequality does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - KR-RHO-0528e7 still prices the j=0 automorphism factor as sqrt(6). This record does not measure that factor.
    - No factor base is defined.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If the lifted x of 2P were independent of the lifted x of P
        and uniform among eligible points, the decrease bit would have
        mean near 1/2 and the two counts would typically differ. The
        pre-registered prediction is only the sign C(E0) > C(E1). The
        random-map mean is the distribution being imitated. It is not
        a theorem about these two cubics.
      rigorous_support: >-
        Doubling is a rational map of degree 4. The fiber of a point
        under doubling is bounded by the 2-torsion. That fiber bound
        is the proved piece. It does not fix the sign of C(E0)-C(E1).
      validation_plan: >-
        Compute both counts exactly at p=157. Report the shuffled-label
        comparison beside them. If the true sign and the shuffled sign
        disagree, the cubic equations are doing something the labels
        do not. If C(E0) <= C(E1), the directional prediction fails on
        this cell. No transfer to a larger prime is claimed.
  target_complexity:
    time_exponent: >-
      The census is linear in p=157. The discrete-log exponent stays
      1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) beyond the current point and two counters.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) on either curve (KR-RHO-13bf67).
      Parallel distinguished points do not change the exponent
      (KR-RHO-6239aa).
    hidden_overhead: No o(1) discrete-log term. The census is not an attack.
    tradeoff_note: No collision-search tradeoff. The output is two integers and one comparison.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As an ECDLP method, reading this bit is dominated by Pollard rho
    on a single curve. The rows read were KR-RHO-13bf67, KR-RHO-6239aa,
    KR-RHO-0528e7, KR-RHO-fb88e6, and KR-RHO-755e35. Generic square-root
    bound, distinguished-point parallelism, an automorphism factor of
    at most sqrt(6), a negation-map factor near sqrt(2), and shared
    point counts across isogenies. None of those rows defines C(E).
    They dominate any claim that the inequality moves an exponent.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    integer added here is C(E0) - C(E1) at p=157. A positive value is
    not a speedup factor.
