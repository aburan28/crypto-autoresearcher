idea:
  id: IDEA-20261006-f71af5
  question_id: RQ-JINV-8fc13a
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Integer doubling order of x differs between the j=0 cubic and one
    generic cubic over F_157
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The tracked label is the integer
    representative in 0 through 156 of an affine x-coordinate. The
    stage is a coordinate comparison, not a collision search. The
    discrete-log exponent versus Pollard rho stays 1/2. Let p=157.
    Let E0 be y^2 = x^3 + 1 and E1 be y^2 = x^3 + x + 4 over F_p.
    Let C(E) be the number of affine points P with 2P affine such
    that the representative of x(2P) is strictly less than the
    representative of x(P). The claim is C(E0) > C(E1), after both
    models have been checked nonsingular and both point counts have
    been checked different from p+1. The concrete negative is
    C(E0) <= C(E1) under those same checks. A singular model or a
    point count equal to p+1 leaves the comparison unmeasured. This
    is not a cross product of a hit count with a group order, not a
    least-bit agreement, not a Legendre symbol of a chord slope, not
    a root count of Phi_7, and not a degree-4 root count.
  mechanism: >-
    OBJECT FRAME. The representation is the affine x-coordinate lifted
    to an integer in 0 through p-1. The operation set Sigma is doubling
    on affine points whose double is affine, a partial action. It is
    not the full translation action. Trichotomy: coordinate-dependent.
    The comparison uses the integer lift, so two field elements that
    are equal as x-coordinates produce the same bit of the comparison,
    and the bit is not a homomorphism of the group. LOSSY PROJECTION.
    The projection keeps one bit, whether the lifted x decreases under
    doubling, and discards y and the discrete log. Negation preserves
    x, so P and -P share the bit. What is priced is the difference of
    two counts, C(E0) - C(E1). No factor base is proposed. F1 through
    F7 are not the lens. F6, the automorphism orbit, is a fence. The
    j=0 curve carries extra automorphisms, and this count is not an
    orbit size.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an ECDLP
        advantage beyond the sqrt of the automorphism order.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-JINV-8fc13a.yaml
    - ref: KR-RHO-0528e7
