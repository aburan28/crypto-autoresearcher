idea:
  id: IDEA-20260805-2afd22
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  added: '2026-08-05'
  title: >-
    A certificate-backed cost model that certifies 1/m! of its own cost: the
    decomposition certificate as tracked object, the forced coverage value, and
    the Nullstellensatz certificate for the failed attempts that the solver's own
    linear algebra already contains
  class: mechanism

  claim: >-
    GOAL-SDEG-001's title and objective are "certificate-backed", and its single
    completion criterion is a "committed scoped cost-model package with
    certificates and matched rho/BSGS controls suitable as ICEX numerator". Both
    words are load-bearing and this proposal audits the join between them, which
    no record in this lane has done.
    A Semaev decomposition certificate exists ONLY FOR A SUCCESS. Given a target
    point R and m factor-base indices, a third party recomputes the sum of m
    points and checks equality: O(m) group operations, independently verifiable,
    exactly the shape docs/claims-and-verification.md asks for. A FAILED
    attempt -- "this R does not decompose over this factor base at this arity" --
    has no certificate at all in the present contract. It has a solver
    transcript and a wall-clock number.
    The cost being modelled is dominated by the failures. At the standard
    operating point for arity m the per-attempt success probability is
    P_dec = 1/m!, so under the equal-work model (the honest default for a
    Groebner backend that must complete the basis either way)
      certificate-covered fraction of charged C_decomp = P_dec = 1/m!,
    which is 16.7 per cent at m = 3, 4.17 per cent at m = 4, and 0.83 per cent at
    m = 5. A "certificate-backed cost model" at m = 4 certifies about one
    twenty-fourth of the quantity it reports, and the remainder is unverified
    solver wall time. That is not a defect of anyone's work; it is a structural
    property of the certificate the contract chose, it has never been written
    down, and writing it down changes what the ICEX numerator is allowed to
    claim.
    THE PROPOSAL IS NOT MERELY THE CRITIQUE. The failed attempts ARE certifiable,
    at essentially no extra verification cost, by an object the solver already
    computes: a degree-bounded Nullstellensatz representation
    1 = sum_i g_i f_i, whose verification is one polynomial multiply-and-add and
    whose production is a by-product of the Macaulay linear algebra that the
    solving-degree instrumentation in this goal is built to measure. That makes
    coverage a design variable rather than a fixed 1/m!, and it is the one
    concrete route by which "certificate-backed" could become true of the whole
    cost rather than of 4 per cent of it.

  object_first_candidate:
    tracked_object: >-
      THE CERTIFICATE, followed through the cost model. Not the point, not the
      polynomial system, not the solving degree. The object is the verifiable
      artifact attached to one unit of charged work, followed from a single
      decomposition attempt, through the per-relation cost
      C_decomp x (attempts per relation), through the relation-collection stage,
      into the ICEX numerator, and finally into the comparison against Pollard
      rho -- asking at every step what fraction of the number being reported is
      backed by something a third party can check.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: index calculus as an attack architecture,
      summation-polynomial algebra, Groebner and solving-degree instrumentation
      as a source of speedup, claw and meet-in-the-middle rewrites, factor-base
      geometry and Sidon/Bose-Chowla constructions, negation and endomorphism
      quotients, lattice/isogeny/code transfer. This proposal proposes no attack
      and no speedup. Its lens is verifiability accounting, which is why it
      cannot regress into a variant of any of those.
    newness_score: >-
      The elementary facts -- a sum is cheap to check, a non-existence is not --
      are known to anyone. What is new to this corpus is the JOIN: no record in
      GOAL-SDEG-001, GOAL-ICEX-001 or RQ-SDEG-001 states what fraction of a
      charged C_decomp is certificate-backed, and none derives 1/m!. The
      constructive half -- that the Macaulay linear algebra already contains a
      cheaply verifiable negative certificate -- is, as far as a HEAD-time search
      of this repository shows, unstated here. Measured absence, not proof of
      novelty.
    testability_score: >-
      The coverage derivation is pen and paper and decides itself. The
      constructive half is testable at toy scale immediately: at p of a few
      thousand and m = 3 the Macaulay matrix is small enough to extract an
      explicit certificate and time its verification against the solve.
    survival_score: >-
      The coverage statement survives to every scale, because it is a statement
      about the certificate's DEFINITION rather than about any parameter. The
      constructive half survives only as far as the certificate stays small, and
      the point at which its size overtakes the solve is exactly what the toy
      measurement is for.

  mechanism: >-
    DERIVED HERE. No literature is cited as support; the standard index-calculus
    cost decomposition (Gaudry, Diem) is NOT READ and is named only as the place
    a reviewer would look.

    1. THE COUNTING. Let E(F_p) have prime-order subgroup of size N, let the
    factor base F have size B, let arity be m. The number of unordered m-element
    multisets over F is C(B + m - 1, m), which is B^m/m! (1 + O(m^2/B)). If the
    sums of these multisets were spread over the N group elements without
    preference, a uniformly random target R decomposes with probability
      P_dec = C(B + m - 1, m) / N  ~  B^m / (m! N).
    Relation collection needs about B relations, hence about B/P_dec attempts,
    hence a collection cost
      C_collect = B * C_decomp / P_dec = m! * N * B^{1-m} * C_decomp.
    The standard operating point balances the factor-base size against the
    decomposition yield by taking B^m/m! ~ N, i.e. B ~ (m! N)^{1/m}, at which
      P_dec ~ 1 / m!   EXACTLY, independent of N.
    THAT INDEPENDENCE IS THE WHOLE POINT: the certificate-covered fraction is a
    function of the ARITY ALONE, not of the curve, the prime, or the scale, so a
    toy measurement of it is not a toy claim.

    2. THE COVERAGE IDENTITY. Write C_succ and C_fail for the charged cost of an
    attempt that does and does not yield a relation. The certificate-covered
    share of the total charged decomposition cost is
      chi = P_dec C_succ / ( P_dec C_succ + (1 - P_dec) C_fail ).
    FORCED VALUES, DERIVED BEFORE ANY RUN.
      (a) Equal-work model, C_fail = C_succ -- the honest default for a Groebner
          backend that computes the full basis and only then reads off whether a
          solution exists: chi = P_dec = 1/m!. At m = 3, 4, 5 that is
          0.1667, 0.041667, 0.008333.
      (b) If C_fail > C_succ (a solve that can stop early on success but not on
          failure), chi < 1/m!. This is the pessimistic direction and it is the
          one a naive reading would assume.
      (c) IF EARLY ABORT WORKS, C_fail < C_succ AND chi RISES. This is the
          direction nobody in this lane has noted, and it inverts the standard
          framing of HEUR-DS-1: a validated early-abort smoothness test does not
          only cut cost, it RAISES THE VERIFIED FRACTION OF THE COST THAT
          REMAINS. Concretely, at m = 4 with C_fail = C_succ/10, chi rises from
          4.17 to 30.0 per cent. That is a reason to care about HEUR-DS-1 that
          appears in no record and that survives whatever the smoothness verdict
          turns out to be.

    3. WHAT THIS SAYS ABOUT THE ICEX NUMERATOR, AND WHAT IT DOES NOT. GOAL-SDEG-001
    exists to supply a numerator to GOAL-ICEX-001's comparison against Pollard
    rho. The numerator that comparison needs is
      T_IC = m! N B^{1-m} C_decomp  +  C_linalg,
    with C_linalg the sparse-system solve over F_N on a B x B matrix carrying
    about m nonzeros per row -- of order m B^2 field multiplications by
    Wiedemann/Lanczos. C_decomp is a factor inside the FIRST term only. Two
    consequences follow at once and neither is recorded in this lane:
      (i) TIME. At any cost-balanced choice of B the two terms are equal by
          construction, so the collection share is s = 1/2 EXACTLY, and a
          numerator built from C_decomp alone understates the total by a factor
          of 2 at the optimum and by more away from it. The general Amdahl bound
          1/(1-s) on end-to-end gain from improving collection alone is the same
          statement; that bound is developed independently, for the BKK speedup
          trichotomy under RQ-ECDLP-002, in IDEA-20260805-1f4a11 of the same
          date, and NO PRIORITY IS CLAIMED FOR IT HERE. What is specific to this
          goal is that its completion criterion names C_decomp as THE numerator,
          which is the place the omission becomes structural rather than
          incidental.
      (ii) MEMORY, AND THIS IS THE PART NOBODY CHARGED. Relation collection plus
          linear algebra needs Omega(B) = Omega(N^{1/m}) storage for the factor
          base and Omega(m B) for the relation matrix. Pollard rho with negation
          and distinguished points runs in O(1) memory (O(w) for the parallel van
          Oorschot-Wiener variant, chosen freely). A comparison that reports only
          time is therefore comparing an Omega(N^{1/m})-memory algorithm against
          an O(1)-memory one and calling the result a scalar. GOAL-SDEG-001's
          completion criterion mentions certificates and matched rho/BSGS
          controls and DOES NOT MENTION MEMORY ANYWHERE. Under any area-time
          charging the two sides are Pareto-incomparable rather than ordered, and
          a numerator package that does not carry a memory column cannot answer
          the question ICEX asks. Stating that is not an objection to ICEX; it is
          a specification of what its numerator has to contain.

    4. THE CONSTRUCTIVE HALF: CERTIFYING THE FAILURES. A failed attempt asserts
    that a polynomial system has no solution with all variables in the factor-base
    set. For a system that the solver has already reduced at Macaulay degree D,
    the assertion "1 lies in the ideal generated by the f_i at degree D" has an
    explicit witness: polynomials g_i with deg(g_i f_i) <= D and
      1 = sum_i g_i f_i.
    Such a witness is a vector in the row space of the degree-D Macaulay matrix
    expressing the constant monomial, i.e. exactly the object a rank computation
    produces as a by-product when it reduces the system to a basis containing 1.
    VERIFICATION IS CHEAP AND UNCONDITIONAL: multiply out and compare
    coefficients, one polynomial multiply-and-add, no solver and no trust in the
    prover's implementation. PRODUCTION IS NOT FREE, and the honest question --
    the one the toy measurement answers -- is the SIZE of the witness, which is
    at most sum_i (number of monomials of degree <= D - deg f_i) field elements.
    NO NUMBER IS ASSERTED HERE for that size; it depends on the Semaev system's
    degrees at the arity in question and it is a measurement, not a derivation.
    THE STRUCTURAL POINT THAT IS DERIVED: the goal's OTHER instrument -- Macaulay
    rank at a stated degree, which is what H-SDEG-0dd021 and the SIG/DREG lineage
    already measure -- is the same computation that produces this certificate.
    The lane already owns the machine; it has never asked it for the receipt.

    5. WHY THE m! IS NOT A TECHNICALITY. 1/m! decays factorially in the one
    parameter this goal varies. The lane's own scope is S_3 and S_4, i.e.
    m = 2 and m = 3 in the summation-polynomial indexing and m = 4, 5 in the
    EXP-DS-001 arity indexing; ACROSS THAT RANGE COVERAGE FALLS FROM ABOUT A HALF
    TO UNDER ONE PER CENT. Any statement of the form "our cost model is
    certificate-backed" therefore means something quantitatively different at
    each arity, and the package must say which.

  novelty_status: unverified

  literature_context:
    - >-
      Gaudry and Diem on index calculus for elliptic curves over extension and
      prime fields, and the C(B+m-1,m)/N decomposition-probability heuristic.
      NOT READ. The counting above is re-derived from first principles and does
      not depend on them; they are named as the place a reviewer would check
      attribution, not as support.
    - >-
      Wiedemann and Lanczos for sparse linear algebra over a finite field, and
      the m B^2 operation count. NOT READ; RECALLED-UNVERIFIED as the standard
      complexity. The audit's conclusions depend only on the linear-algebra term
      being non-negligible, not on its exact exponent, and the contract makes
      pinning the exponent a stage rather than an assumption.
    - >-
      Hilbert's Nullstellensatz and its effective/degree-bounded forms, and
      Positivstellensatz-style refutation certificates. NOT READ. What is used
      here is only the trivial direction: a claimed identity 1 = sum g_i f_i is
      verifiable by multiplying it out. No degree bound is asserted.
    - >-
      IN-REPOSITORY, READ: ledger/goals/GOAL-SDEG-001.yaml (objective,
      completion_criteria), ledger/questions/RQ-SDEG-001.yaml (constraints,
      "matched rho/BSGS controls and certificates are mandatory"),
      ledger/goals/GOAL-ICEX-001.yaml (completion criterion naming a charged toy
      IC exponent alpha versus rho), ledger/hypotheses/H-SDEG-0dd021.yaml (the
      Macaulay-rank instrument this proposal proposes to ask for a receipt).
    - >-
      IN-REPOSITORY, READ IN PART: ledger/proposals/IDEA-20260805-1f4a11.yaml of
      the same date, which develops the collection-share Amdahl ceiling
      independently for RQ-ECDLP-002. Cited to disclaim priority on that half and
      to prevent two records asserting the same bound as separate discoveries.

  lossy_projection_identifiability_audit:
    projection: >-
      (a full decomposition attempt: target point, factor base, polynomial
      system, solver trace, verdict, resource measurements)
      --> (one certificate, or nothing).
    what_is_discarded: >-
      Everything except, in the success case, the m factor-base indices. The
      solver's entire trace, the cost, the intermediate algebra, and -- in the
      failure case -- ALL of it.
    why_genuinely_lossy: >-
      Extremely lossy, and correctly so: that is what makes a certificate cheap
      to check. The audit's finding is about WHERE the loss falls. The projection
      is not merely lossy, it is UNDEFINED on a 1 - 1/m! fraction of its domain,
      and the cost model integrates over the whole domain.
    why_compatible_with_the_operations: >-
      Compatible in the success case: the retained m indices propagate
      deterministically to a group-law check that reproduces R. Not compatible in
      the failure case, because there is nothing retained to propagate. The
      constructive half of the proposal is precisely an attempt to make the
      projection total by supplying a witness on the other fibre.
    is_it_only_a_change_of_coordinates: >-
      WHICH FAILURE WAS CHECKED AND WHAT IT RETURNED. Checked for the
      (Delta, Pi) = (x XOR y, x y) change-of-coordinates failure -- is the
      certificate merely a re-encoding of the attempt, from which the attempt is
      recoverable? IT IS NOT: from m factor-base indices one cannot recover the
      solver trace, the cost, or even which of the many decompositions of R was
      found, so information is genuinely destroyed and the check returns "not a
      change of coordinates". Checked ALSO for the mirror failure -- is the
      certificate constant across instances, with zero comparator spread? IT IS
      NOT: the m indices are instance-determined and a verifier that recomputes
      the sum can distinguish every target point. So the certificate passes both
      halves of the lossy-projection test as an object. The defect found is a
      THIRD one, which the test as written does not screen for: the projection is
      PARTIAL, and its domain of definition is a 1/m! fraction of the cost.

  assumptions:
    - >-
      That P_dec ~ C(B+m-1,m)/N, i.e. that multiset sums are spread over the
      group without strong preference. This is the standard heuristic of the
      whole field and it is NOT proved here. It is load-bearing only for the
      NUMBER 1/m!; the qualitative statement (coverage equals the success
      probability under equal work, and the success probability is far below 1)
      needs no such assumption. The contract measures P_dec directly at toy scale
      rather than assuming it.
    - >-
      That the standard operating point is B ~ (m! N)^{1/m}. If the lane's
      package uses a different B, chi = P_dec = B^m/(m! N) is still exact and
      simply takes a different value; the derivation is stated in both forms so
      the conclusion does not depend on the choice.
    - >-
      That a "certificate" in the GOAL-ECDLP-001 certificate contract means an
      independently re-verifiable artifact for a claimed relation. Read from
      RQ-SDEG-001's constraints and docs/claims-and-verification.md; if the
      contract in fact certifies something else, the coverage number changes and
      the audit's first stage is to read the contract and say so.

  predictions:
    - metric: >-
        chi, the certificate-covered fraction of charged decomposition cost, at
        arities m = 3, 4, 5 under the equal-work model, derived symbolically
      direction: lower
      minimum_effect: >-
        FORCED VALUES, STATED BEFORE ANY RUN: 1/6 = 0.16667, 1/24 = 0.041667,
        1/120 = 0.0083333, at the operating point B = (m! N)^{1/m}. If a
        symbolic re-derivation returns anything else, this proposal's arithmetic
        is wrong and it is withdrawn at zero cost.
    - metric: >-
        Measured per-attempt success rate P_dec at toy scale (p in the lane's
        existing 16-24 bit range, the lane's own factor base, m = 3 and m = 4),
        against the counting prediction C(B+m-1,m)/N
      direction: different
      minimum_effect: >-
        FORCED: measured P_dec within a factor of 2 of C(B+m-1,m)/N. A
        discrepancy larger than that falsifies the spreading heuristic AT TOY
        SCALE and is a more interesting result than the coverage number -- it
        would mean the decomposition probability this whole family's cost model
        rests on is measurably wrong where it can be measured.
    - metric: >-
        Measured ratio C_fail / C_succ on the lane's own backend, at m = 3 and
        m = 4, with early abort DISABLED
      direction: different
      minimum_effect: >-
        FORCED PREDICTION: 1.00 +/- 0.20, because a Groebner solve that must
        complete the basis does the same work either way. IF THE MEASURED RATIO
        IS FAR FROM 1 THE EQUAL-WORK MODEL IS WRONG AND chi MUST BE RESTATED --
        and the direction of the deviation immediately tells the lane whether
        early abort is already happening implicitly.
    - metric: >-
        Collection share s = C_collect / (C_collect + C_linalg) at the lane's own
        toy parameters, computed from measured wall time on both stages
      direction: different
      minimum_effect: >-
        NO FORCED VALUE IS AVAILABLE AT TOY SCALE and inventing one would be a
        fabrication: at 16-24 bits B is small and the linear algebra is
        negligible, so s near 1 is expected and would say nothing about the
        asymptotic balance. THE FORCED STATEMENT IS THE CONDITIONAL ONE: at any
        cost-balanced B, s = 1/2 exactly and the Amdahl ceiling on
        collection-only improvement is 2. The deliverable is the measured toy s
        REPORTED ALONGSIDE the statement that it is not the asymptotic s, which
        is the honesty the ICEX numerator needs.
    - metric: >-
        Memory column of the numerator package: peak resident bytes for factor
        base plus relation matrix, against the matched Pollard rho arm on the
        same instance
      direction: higher
      minimum_effect: >-
        FORCED IN ORDER OF MAGNITUDE, NOT IN VALUE: the IC arm must exceed the
        rho arm by a factor growing at least like B, because rho stores O(1)
        points and IC stores Omega(B). If the measured IC memory does NOT grow
        with B, the implementation is not storing what the cost model assumes and
        the measurement is invalid rather than favourable.
    - metric: >-
        Size and verification time of an explicit degree-D Nullstellensatz
        witness 1 = sum g_i f_i for a FAILED decomposition attempt, at the
        smallest toy cell where the Macaulay matrix is fully enumerable
      direction: lower
      minimum_effect: >-
        NO SIZE IS PREDICTED -- it depends on the Semaev degrees and asserting a
        number would be fabrication. The FORCED, FALSIFIABLE claim is the
        verification asymmetry: verifying the witness must cost strictly less
        than re-running the solve on the same cell, by at least a factor of 10.
        IF IT DOES NOT, THE CONSTRUCTIVE HALF IS DEAD AT TOY SCALE and the
        proposal reduces to the coverage accounting alone.

  minimal_test:
    design: >-
      Four stages, cheapest decisive first, each able to terminate. STAGE 0
      (reading, zero compute): read the GOAL-ECDLP-001 certificate contract and
      docs/claims-and-verification.md and record verbatim what a decomposition
      certificate is required to contain and whether a negative certificate is
      contemplated. IF A NEGATIVE CERTIFICATE IS ALREADY SPECIFIED, the audit's
      headline is void and it stops here. STAGE 1 (pen and paper, zero compute):
      derive chi at m = 3, 4, 5 in both the operating-point and general-B forms,
      and derive the s = 1/2 and memory statements. STAGE 1 IS THE STAGE THAT CAN
      END THE PROPOSAL. STAGE 2 (minutes on existing toy cells): measure P_dec,
      C_fail/C_succ, toy s, and the memory column. STAGE 3 (only if stages 0-2
      pass, bounded): extract one explicit Nullstellensatz witness at the
      smallest enumerable cell and time its verification against the solve.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, ABLE TO FAIL:
        run the identical P_dec measurement against a RANDOM SET of B group
        elements that is not a factor base in any structured sense -- same size,
        same target distribution, same solver interface. FORCED VALUE: P_dec_null
        = C(B+m-1,m)/N, IDENTICAL to the treatment prediction, because the
        counting argument uses nothing about the factor base except its size.
        THIS NULL CAN FAIL AND FAILING IS INFORMATIVE: if the real factor base
        yields measurably more relations per attempt than a matched random set,
        the spreading heuristic is wrong in a structured direction and that is a
        finding about index calculus, not about certificates.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: a PLANTED
        decomposition. Construct R as an explicit sum of m factor-base points,
        then hand it to the attempt path. The attempt MUST succeed and MUST emit
        a certificate that verifies. Threshold declared before the run: 20/20
        successes and 20/20 verifications. IF THE PLANTED CASE FAILS, THE
        INSTRUMENT IS BROKEN AND NO NEGATIVE OR COVERAGE NUMBER MAY BE REPORTED
        FROM ANY STAGE.
      - >-
        GRADED CONTROL, THREE INTERIOR POINTS, MONOTONICITY REPORTED: measure
        P_dec at m = 2, 3, 4 on the same curve and factor base. FORCED SHAPE:
        P_dec must RISE with m like B^m/(m! N) at fixed B, hence chi must fall
        like 1/m! only when B is re-optimised at each m. Reporting the two
        regimes separately is what prevents a reader from conflating "more arity
        is better" with "coverage collapses"; both are true and they are
        different statements about different held-fixed variables.
      - >-
        SECOND GRADED CONTROL FOR THE EARLY-ABORT DIRECTION: measure
        C_fail/C_succ with the abort threshold set to four levels from
        "never abort" to "abort aggressively", and report chi at each. This
        localises whether early abort raises coverage as derived, instead of
        leaving a one-line claim.
      - >-
        ORDERING CONTROL: the coverage derivation and its forced values are
        committed BEFORE any of the toy measurements are looked at, so chi cannot
        be back-fitted to whatever C_fail/C_succ turns out to be.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE: search the corpus for any existing statement
        of certificate coverage, negative certificates, or an ICEX memory column.
        NOT YET PERFORMED beyond reading the four records named in
        literature_context, and recorded here as not performed rather than
        claimed as a passed check.
    required_metrics:
      - verbatim quotation of what the certificate contract requires, or a record that it could not be located
      - chi at m = 3, 4, 5 in both forms, derived symbolically
      - measured P_dec versus C(B+m-1,m)/N, treatment and matched-random null, with seeds
      - measured C_fail/C_succ at four abort settings
      - toy collection share s, reported with the explicit statement that it is not the asymptotic s
      - peak memory of the IC arm and of the matched rho arm on the same instance
      - planted-decomposition control: successes and certificate verifications out of 20
      - witness size in field elements and verification time versus solve time, or an explicit record that stage 3 was not reached

  falsification_conditions:
    - >-
      The certificate contract already specifies a negative certificate. The
      headline is void; report that and stop.
    - >-
      chi does not evaluate to 1/m! at the operating point under symbolic
      re-derivation. The arithmetic is wrong and the proposal is withdrawn.
    - >-
      The planted-decomposition positive control fails. Nothing may be reported
      from any stage.
    - >-
      Measured C_fail/C_succ is far from 1 with abort disabled. The equal-work
      model is refuted and every chi number must be restated against the measured
      ratio rather than the model.
    - >-
      Measured P_dec departs from C(B+m-1,m)/N by more than a factor of 2 on the
      real factor base while the matched random null agrees. The counting
      heuristic is structured-dependent and the coverage derivation must be
      rebuilt on the measured probability.
    - >-
      Verifying a Nullstellensatz witness costs at least a tenth of re-solving.
      The constructive half is dead at the tested scale and must be reported dead
      THERE, with the scale stated, not declared impossible.

  confounders:
    - >-
      DEFINITIONAL. "Certificate coverage" could reasonably mean the fraction of
      ATTEMPTS certified, the fraction of CHARGED COST certified, or the fraction
      of RELATIONS certified (which is 1 by construction and is the trivially
      flattering reading). All three must be reported. Reporting only the third
      is the failure mode this proposal exists to prevent.
    - >-
      TOY SCALE CANNOT SEE THE LINEAR ALGEBRA. At 16-24 bits the matrix stage is
      negligible, so a measured s near 1 is guaranteed and means nothing about
      the balance the ICEX numerator needs. The contract must state this before
      measuring, or the measurement will be read as reassurance.
    - >-
      THE MEMORY POINT IS ABOUT MODELS, NOT ABOUT THIS IMPLEMENTATION. A toy
      implementation's resident set is dominated by the interpreter. The
      deliverable is the SCALING of stored objects with B, not a byte count, and
      conflating the two would be dishonest in the flattering direction.
    - >-
      DOUBLE COUNTING WITH IDEA-20260805-1f4a11. The Amdahl ceiling appears in
      both records on the same date. Neither may cite the other as independent
      corroboration; they are one derivation reached twice, and any downstream
      synthesis must treat them as a single source.
    - >-
      ADVERSE-DIRECTION BIAS. A result that says "your cost model certifies 4 per
      cent of itself" is easy to produce and reads as rigour. The positive
      control and the falsification conditions above are what make a negative
      cost something to reach, and the constructive half is included so the
      proposal has an obligation beyond criticism.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, CLAIM TIER toy. Nothing here makes any
      instance easier to solve. sota_delta on every attack axis is exactly zero.
    - >-
      NO STATUS CHANGE is proposed or implied for GOAL-SDEG-001,
      GOAL-ICEX-001, RQ-SDEG-001, H-SDEG-0dd021 or any evidence record. In
      particular this proposal does NOT claim any completion criterion is unmet;
      it claims the criterion, as written, does not name memory, and that the
      certificate it does name covers a derivable fraction of the cost. What
      follows from that is the Coordinator's call.
    - >-
      chi = 1/m! is a statement about the CHOSEN certificate, not about index
      calculus. A different certificate design changes it, which is the entire
      point of the constructive half. Reading it as a limitation of index
      calculus would be a category error.
    - >-
      The memory statement is a Pareto observation, not a claim that index
      calculus loses. Pareto-incomparable means incomparable; asserting a winner
      in either direction from this proposal would be exactly the overreach it
      objects to.
    - >-
      FORWARD GUIDANCE, MANDATORY UNDER inventor-protocol section 4. Open
      regardless of outcome: the degree bound at which a Nullstellensatz witness
      for a Semaev non-decomposition exists and its size as a function of (m, D);
      whether a batched certificate can amortise over many failed attempts
      sharing a factor base; and whether the same accounting applies to the
      matched rho/BSGS control arms, whose own certificate coverage -- a rho
      collision is trivially checkable, a rho NON-collision is not -- has also
      never been stated.

  heuristic_assumptions:
    - id: HEUR-CERT-1
      formal_statement: >-
        For a uniformly random target R in the prime-order subgroup of size N,
        and a factor base F of size B, the probability that R is expressible as a
        sum of m elements of F is P_dec = C(B + m - 1, m) / N * (1 + o(1)) in the
        range B^m/m! = o(N).
      rigorous_support: >-
        A counting upper bound is UNCONDITIONAL: at most C(B+m-1,m) of the N
        group elements are such sums, so P_dec <= C(B+m-1,m)/N always. The
        matching lower bound needs the sums to be nearly distinct, which is a
        genuine heuristic and is not proved here. Note that the unconditional
        HALF is the one this proposal needs for its pessimistic direction:
        coverage cannot EXCEED the counting bound.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Measured P_dec on the real factor base exceeds C(B+m-1,m)/N by more than
        a factor of 2 at any toy cell, or falls below it by more than a factor of
        4. Either outcome refutes the heuristic at that cell and the coverage
        numbers must be restated against the measurement.
    - id: HEUR-CERT-2
      formal_statement: >-
        With early abort disabled, a Groebner-backend decomposition attempt costs
        the same whether or not a solution exists: C_fail = C_succ (1 + o(1)).
      rigorous_support: >-
        Structural rather than proved: the basis must be completed before
        solutions are read off, so the dominant work is the same. This fails for
        backends that detect infeasibility early, which is exactly why it is
        stated as a heuristic and measured at four abort settings.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Measured C_fail/C_succ outside [0.8, 1.2] with abort disabled.
    - id: HEUR-CERT-3
      formal_statement: >-
        Sparse linear algebra on the B x B relation matrix with about m nonzeros
        per row costs Theta(m B^2) field operations and Omega(m B) storage.
      rigorous_support: >-
        RECALLED-UNVERIFIED as the standard Wiedemann/Lanczos count. The audit's
        conclusions require only that this term be non-negligible at the balanced
        B, not its exact constant, and the contract records the exponent used
        rather than assuming it.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A committed source or measurement giving a materially lower exponent for
        the same matrix shape. The s = 1/2 statement is then restated at the
        corrected balance point.

  target_complexity:
    time_exponent: >-
      MOVES NO EXPONENT, AND THIS IS STATED RATHER THAN DODGED. The exponent in
      play in this family is the index-calculus alpha against Pollard rho's 1/2,
      and this proposal produces no algorithm and no improvement to one. What it
      does is constrain what a C_decomp measurement is allowed to say about that
      exponent: a numerator missing the linear-algebra term and the memory column
      cannot support an alpha claim in either direction, and the Amdahl ceiling
      bounds what any collection-side improvement can deliver end to end.
    memory_exponent: >-
      The proposal's substantive content is a memory statement about the OBJECT
      BEING COSTED: index calculus needs Omega(B) = Omega(N^{1/m}) storage while
      Pollard rho needs O(1). No memory exponent is claimed for the proposal
      itself, which stores nothing.
    best_known: >-
      Pollard rho at about sqrt(pi N / 4) group operations, reduced by sqrt(2)
      with negation, at negligible memory. This is the incumbent the ICEX
      numerator must be compared against and it is unchanged by anything here.
    hidden_overhead: >-
      For the index-calculus side, the attempts-per-relation factor m! N B^{1-m}
      and the linear-algebra term are precisely what a C_decomp-only numerator
      hides, which is the audit's subject.
    tradeoff_note: >-
      Index calculus versus rho is a time-memory TRADE and not an ordering until
      a memory model is fixed. Any scalar alpha comparison implicitly fixes one;
      the package should state which.

  dominated_by: >-
    n/a (no result claimed, no algorithm proposed). ROWS OF THE FRONTIER ACTUALLY
    CHECKED before writing n/a: TIME -- Pollard rho sqrt(pi N/4) with negation,
    parallel van Oorschot-Wiener sqrt(pi N/4)/w, BSGS 2 sqrt(N), and toy index
    calculus itself; MEMORY -- rho O(1), parallel VW O(w) distinguished points,
    BSGS Omega(sqrt N), index calculus Omega(N^{1/m}); DATA/QUERIES -- none of
    these consumes oracle queries or data, so that axis is empty for every row
    and is recorded as empty rather than as checked-and-favourable. No row
    dominates this proposal because no row is an accounting statement. Within the
    corpus, the nearest overlapping record is IDEA-20260805-1f4a11 on the Amdahl
    half, disclosed above; nothing found on certificate coverage or on an ICEX
    memory column, which is a measured absence and not proof of novelty.
  sota_delta: >-
    Zero on time, memory, data, queries and advice -- no attack is proposed.
    Quantitative delta on the accounting axis, which is what is offered:
    certificate coverage of a charged C_decomp is 1/m!, i.e. 16.7 / 4.17 / 0.83
    per cent at m = 3 / 4 / 5, against an implicit 100 per cent that the phrase
    "certificate-backed cost model" invites; the ICEX numerator understates total
    time by a factor of exactly 2 at the cost-balanced B and reports a memory
    column of zero against an Omega(N^{1/m}) requirement; and early abort, if
    validated, raises coverage from 4.17 to about 30 per cent at m = 4 with
    C_fail = C_succ/10. Cost of establishing all of it: one page of algebra plus
    a bounded toy measurement on instruments the lane already owns.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.88 that the coverage accounting survives review as stated. That high
    because the derivation is elementary and its pessimistic direction rests on
    an UNCONDITIONAL counting bound rather than on the spreading heuristic; not
    higher because the exact number 1/m! depends on the operating-point choice
    and on the equal-work model, either of which a reviewer may reasonably
    contest, and because the certificate contract was inferred from
    RQ-SDEG-001's constraints rather than read in full at the time of writing.
    SEPARATELY: 0.95 that the memory observation survives -- it is a statement
    about what index calculus must store and it is hard to see how it fails;
    0.35 that the constructive half (a cheaply verifiable Nullstellensatz witness
    for failed attempts at the lane's own arities) survives the toy measurement,
    because witness size is the obvious failure mode and no bound on it is known
    here. The proposal is worth running at 0.35 on that half because the
    accounting half is nearly free and is delivered either way, and because a
    negative on the witness, with its size measured and its scale stated, is
    itself the first quantitative statement about negative certificates this
    program would own.
