idea:
  id: IDEA-20260905-18f6c5
  title: Branch-stratum localization of exceptional relation multiplicity
  class: mechanism
  claim: Equal generic geometric monodromy does not force equal finite rational-fiber or sampled relation rates.
    The proposed stratified accounting decomposes named branch/collision contributions and a separately retained
    open-locus arithmetic/sampling residual; conjecturally the named strata explain the excess only in a declared
    family with a proved or tested bound on that residual.
  mechanism: Let X be partitioned into disjoint named exceptional strata S_i and an open stratum U. For a fixed
    sampler mu and rational-fiber multiplicity z, total mass is sum_i mu(S_i) E_mu[z|S_i]+mu(U) E_mu[z|U]. Against
    a frozen open reference m_U, write open contribution mu(U)m_U+R_U with R_U=mu(U)(E_mu[z|U]-m_U). Generic geometric
    monodromy alone supplies no zero or negligible bound for R_U. Compare two probability laws on the same cover
    that agree on every named-stratum mass but reweight two open points u,v with z(u)!=z(v); monodromy and named
    counts are identical while R_U changes. This formal sampler control must be admitted unless explicit uniformity/point-count
    hypotheses quantitatively bound its effect. Count branch intersections and repeated-summand loci disjointly
    with automorphism and rational 2-torsion weights. The useful mechanism is the decomposition and identification
    of residual sources, not an only-if localization theorem.
