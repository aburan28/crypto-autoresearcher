      external source opened.
    results: >-
      No record in the corpus proposes dropping smoothness in favour of a
      divisor condition, cites Ford's divisor-density theorem, or costs the
      large-ell listing. EV-PEC-857664 (GOAL-P13-001) mentions 'batched/
      quasi-linear evaluation, UNIMPLEMENTED' as a lever L4 in its per-entry
      cost model -- that is the same external ingredient, seen from the
      concrete-cost side; it is cited here as a pointer, not read in full.
      Externally the idea is elementary enough that it may well exist or be
      folklore; absence from this corpus is not evidence of novelty.
    verdict: >-
      UNVERIFIED. Lemma 3.4' is claimed as a reading of the frozen source,
      not as new mathematics; the contribution is the cost equation C4 and
      the two heuristics with their validation routes.

