idea:
  id: IDEA-20260901-1f5a62
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-09-01'
  title: >-
    SMOOTHNESS IS USED FOR ONE THING ONLY -- to guarantee a balanced divisor
    -- so replace the smooth split (F2) by a DIVISOR split: list ALL cyclic
    isogenies of degree at most X = K*(p/2)^{1/6} regardless of the arithmetic
    of their degree, succeed whenever delta_{E'} has a divisor in
    [delta/X, X], and the inverse success probability F4 falls from the
    disclosed superpolynomial u^{u(1+o(1))} to a fixed power of log p (Ford's
    divisor-density exponent 0.086) -- conditional on two named heuristics,
    one of which (quasi-linear listing of ell-neighbourhoods for ell up to
    p^{1/6}) is an external ingredient this record scouts and does not own.
    THE EXPONENT DOES NOT MOVE; this is a building block and is filed as one.
  class: composition

  claim: >-
    STATED FIRST: this record moves NO exponent. Its time exponent is the
    incumbent's 1/3 exactly and its memory exponent is the incumbent's 1/3
    exactly. It is filed under agents/idea-generator.md search heuristic 1
    ('say so explicitly when it is a required building block'): every lever
    on RQ-SSIQ-9702af pays the factor P0^{-1} of Lemma 3.5 (frozen source
    line 187), the frozen source itself names the resulting superpolynomial
    overhead as the reason its practical impact is unclear (line 39), and
    IDEA-20260808-71c2b2's entire deliverable is a coefficient inside that
    overhead. This record removes the sqrt(log p log log p) term rather than
    shrinking its coefficient.

    (C1) THE SPLIT LEMMA NEEDS ONLY A DIVISOR. Lemma 3.4 (lines 160,
    177-185) proves: if the minimal phi: E -> E^{(p)} is B-smooth then phi =
    eta o psi with deg psi, deg eta <= X = B^{1/2}(p/2)^{1/6}. Reading the
    proof, smoothness is used solely to produce an index k with
    prod_{i<=k} ell_i <= X and prod_{i<=k} ell_i * ell_{k+1} > X, i.e. a
    DIVISOR d_1 = deg psi of d = deg phi lying in [d/X, X]. Any such divisor
    works: the cyclic kernel of phi has a unique subgroup of order d_1, psi
    is the quotient by it, eta is the rest, deg eta = d/d_1 <= X, both
    kernels cyclic. REPLACEMENT LEMMA 3.4': if delta_{E'} has a divisor in
    [delta_{E'}/X, X] then Algorithm 2 run on the list L(E', X) := {all
    cyclic isogenies from E' of degree <= X} returns a separable
    E' -> E'^{(p)}. Proof: the argument of lines 177-185 with k chosen by the
    divisor. Degrees <= X need no divisor at all (d_1 = d).

    (C2) THE LIST IS NO LARGER. #L(E', X) <= sum_{x<=X} x(log x + 2) <=
    X^2 (log X + 2) by the same count as Lemma 3.2 (line 133-135) with
    Psi(X, B) replaced by X. With X = K (p/2)^{1/6}, K a constant >= sqrt 2,
    the table has K^2 (p/2)^{1/3} (log p)^{O(1)} entries: memory exponent 1/3,
    exactly the incumbent's, now WITHOUT the factor B^{1/2} in X.

    (C3) THE SUCCESS PROBABILITY IS A POWER OF log p. Under H-DIV below --
    delta_{E'} behaves, for the divisor-in-an-interval statistic, like a
    uniformly random integer of its size -- Ford's theorem (recalled, see
    citations) gives: the proportion of integers n <= x having a divisor in
    [y, 2y] is of order (log y)^{-delta}(log log y)^{-3/2} uniformly for
    3 <= y <= sqrt x, with delta = 1 - (1 + log log 2)/log 2 = 0.08607...
    For d <= (p/2)^{1/3} = X^2/K^2 the interval [d/X, X] has multiplicative
    width X^2/d >= K^2 >= 2, so it contains an interval of the form [y, 2y]
    with y <= sqrt d, and P0 >= (log X)^{-0.0861 - o(1)} = (log p)^{-O(1)}.
    THE INVERSE SUCCESS PROBABILITY IS POLYNOMIAL IN log p. Compare the
    incumbent's P0^{-1} = u^{u(1+o(1))} with u = sqrt(log(p/2)) (line 212),
    which IDEA-20260808-71c2b2 (read) evaluates as exp(0.8165 sqrt(L log L)),
    L = log p, at the optimised B.

    (C4) THE PRICE, WHICH IS THE WHOLE RECORD. Algorithm 1 (lines 137-152)
    lists L(E', X, B) by extending entries one prime ell <= B at a time, at
    cost (B + log p)^{O(1)} per neighbourhood (line 156) because the
    modular polynomial Phi_ell has size ell^2 and B = p^{o(1)}. The divisor
    split needs neighbourhoods for EVERY prime ell <= X = p^{1/6}. Let C(ell)
    be the cost of listing the ell + 1 ell-isogenous j-invariants of a given
    supersingular j over F_{p^2}. Entries of degree <= X/ell number about
    (X/ell)^2, so the list costs sum_{ell <= X} (X/ell)^2 C(ell). With
    C(ell) = ell^{1+o(1)} (log p)^{O(1)} this is X^{2+o(1)} (log p)^{O(1)}
    -- quasi-linear in the table, exponent 1/3. With C(ell) = ell^{c} for
    c > 1 it is X^{1+c+o(1)}: time exponent (1 + c)/6, which is 1/2 at the
    classical c = 2 and STRICTLY WORSE than the incumbent for every c > 1.
    So the record lives exactly on c = 1 + o(1): H-MODEVAL below.

    (C5) TOTAL, CONDITIONAL ON H-DIV AND H-MODEVAL: expected time
    K^2 (p/2)^{1/3} (log p)^{O(1)} and memory K^2 (p/2)^{1/3} (log p)^{O(1)},
    for OneEnd, with Heuristic 1 of the frozen source REPLACED (not added to)
    by H-DIV, and the same re-randomisation walk (Algorithm 3, line 193)
    with the same mixing citation. The claim tier is exactly the incumbent's:
    conditional, asymptotic, and silent on concrete parameters (SC-3;
    RQ constraint 5). NUMERIC CONDITION FOR AN EXPONENT BELOW 1/3 THROUGH
    THIS LEVER: NONE EXISTS. By the alpha/3 identity of IDEA-20260821-e99afd
    (read), the detection exponent stays alpha = 1 and no change to P0 or to
    the split moves the exponent. This record says so and claims the
    cofactor only.

  mechanism: >-
    TRACKED OBJECT: the DIVISOR STRUCTURE of delta_{E'} (does it have a
    factor in a window of multiplicative width K^2 around X) in place of its
    SMOOTHNESS (are all its prime factors below B). Both are lossy
    projections of the integer delta: the first keeps O(1) bits, the second
    keeps the largest-prime-factor scale. Both propagate compatibly with the
    only operation the algorithm applies to the degree -- factoring it as
    d_1 * d_2 across the middle curve -- and neither can be inverted to phi.
    The divisor projection is strictly coarser than the smoothness
    projection (smooth implies balanced-divisible, Lemma 3.4; not
    conversely), and the incumbent pays for information it does not use.

    WHY THE INCUMBENT USES SMOOTHNESS ANYWAY, AND WHY THAT REASON IS
    EXTERNAL. Line 147 of Algorithm 1 restricts to ell <= B so that every
    neighbourhood is computed from a modular polynomial of size B^{O(1)} =
    p^{o(1)}. That is a statement about the cost of ell-neighbourhoods, not
    about the split. The frozen source's own footnote (line 156) says the
    best exponent for populating the list was not investigated and names
    batched modular-polynomial evaluation (Damien Robert) as the likely
    route. The ingredient this record needs is therefore the one the source
    points at: neighbourhoods for large prime ell at cost quasi-linear in
    ell. The record's honest expected outcome depends on whether that
    ingredient exists in the literature at c = 1 + o(1) (see H-MODEVAL) --
    the record CLOSES ITSELF at Stage 1 if it does not.

    STAGE 0 (zero compute): write Lemma 3.4' and the count C2; check the
    baseline embedding (restrict L(E', X) to B-smooth degrees and set
    X = B^{1/2}(p/2)^{1/6}: Lemma 3.4' must reduce to Lemma 3.4 verbatim,
    because smoothness supplies the divisor).

    STAGE 1 (literature, blocking): retrieve and read the sources named
    under H-MODEVAL; record the best PROVEN exponent c for computing the
    ell-neighbourhood of a supersingular j over F_{p^2}; if c > 1, record
    the derived exponent (1 + c)/6 and close the record as dominated with
    that number as the obstruction.

    STAGE 2 (H-DIV at zero new search): on the exhaustive minimal-degree
    data the campaign already holds (the AOV/WISDE release used by
    EXP-SSIQ-4de240 and H-SSIQ-6e0748, p <= 265207), compute for each prime
    the fraction of delta values with a divisor in [delta/X, X] at
    X = K (p/2)^{1/6}, K in {sqrt 2, 2}; compare against the same statistic
    on a NULL sample of random integers drawn with the density d^{1/2} on
    [1, (p/2)^{1/3}] (the D1 law), and against Ford's order-of-magnitude
    prediction; report the ratio real/null per prime and its trend.

    STAGE 3 (H-DIV at cryptographic scale, the frozen source's own method):
    the Deuring-side sampler of Section 4.2 (lines 244-248) already factors
    each sampled minimal norm to record its largest prime factor; the divisor
    statistic is one extra test per sample on the same factorisation.
    At p = 5*2^248 - 1 and 27*2^500 - 1 report the divisor-success fraction
    with a binomial interval, the smoothness-success fraction at the
    incumbent's B for comparison, and the tail check below.

