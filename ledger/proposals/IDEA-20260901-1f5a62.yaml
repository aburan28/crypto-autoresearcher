  assumptions:
    - >-
      The re-randomised curve E' is indistinguishable from uniform (the
      frozen source's own assumption, inherited unchanged).
    - >-
      K >= sqrt 2 so that the divisor window has multiplicative width >= 2
      for every d <= (p/2)^{1/3}. K = 2 is used for margin; the table grows by
      exactly K^2.
    - >-
      Cyclic-kernel bookkeeping: the minimal phi has cyclic kernel (line 177),
      so every divisor of its degree gives a cyclic sub-kernel.
    - >-
      Every measured number is scoped to the data sets named; no concrete
      parameter figure is derived (SC-3, RQ constraint 5).

  proof_search_map:
    bottleneck: >-
      C(ell) for ell up to p^{1/6}: the cost of listing one ell-neighbourhood
      of a supersingular j over F_{p^2}. The exponent of the whole record is
      (1 + c)/6 where C(ell) = ell^{c+o(1)}; c = 1 is the only value at
      which the record is not dominated.
    baseline_embedding:
      parameter_slice: >-
        Restrict L(E', X) to B-smooth degrees and set X = B^{1/2}(p/2)^{1/6}.
        Then Lemma 3.4' is Lemma 3.4 (smoothness supplies the divisor), the
        list is L(E', X, B), C(ell) = (B + log p)^{O(1)} for ell <= B, and the
        cost is Lemma 3.3's Psi(X, B) X^{1+o(1)} B^{O(1)} verbatim.
      reproduction_check: >-
        Symbolic: with B-smoothness imposed, the divisor condition holds with
        probability 1 given smoothness (the prefix-product argument), so
        P0 reduces to Lemma 3.5's u^{-u(1+o(1))}; and X reduces to line 167's
        value character for character. Any discrepancy kills the record at
        zero compute.
    observation_collision:
      observable: >-
        The success indicator [delta has a divisor in [delta/X, X]].
      distinct_preimage_search: >-
        Two integers with the same indicator and different smoothness: d =
        ell_1 ell_2 with two primes near X (indicator 1, not smooth -- the
        gain) and d = a large prime near X^2 (indicator 0, not smooth -- the
        loss both methods share). Two CURVES with the same delta and
        different rings collide on the observable and are irrelevant to it:
        the algorithm never needs to tell them apart. No collision threatens
        correctness; the only one that threatens the claim is an arithmetic
        BIAS of delta away from random integers, which is H-DIV's own
        falsifier.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from 'B-smooth degrees' to 'degrees
          with a balanced divisor'; the old family is the boundary case
          (smooth implies balanced). STRICTNESS obligation: the gain must be
          shown not to be eaten by C(ell) -- which is exactly C4.
        predicted_gain: >-
          P0^{-1} from superpolynomial to (log p)^{O(1)}, iff c = 1 + o(1).
    quantifier_order: >-
      FOR ALL p, FOR E' uniformly random supersingular over F_{p^2},
      Pr[delta_{E'} has a divisor in [delta_{E'}/X, X]] >= (log p)^{-0.0861-o(1)}
      (H-DIV), the SAME shape as Heuristic 1 with Ford in place of
      Canfield-Erdos-Pomerance. The listing cost bound is FOR ALL supersingular
      j and ALL primes ell <= X (H-MODEVAL), a worst-case statement about an
      algorithm, not a distributional one.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: p^{1/3}(log p)^{O(1)} time and memory for OneEnd conditional
        on H-DIV and H-MODEVAL, with the exponent of the polynomial cofactor
        left as O(1) until C(ell)'s polylog is read off a source. It can NEVER
        move the exponent (alpha = 1 throughout) and never certifies a
        concrete figure.
      nearby_object_control: >-
        The generic two-curve Isogeny problem (E, E_0 unrelated): the minimal
        connecting degree is about p^{1/2} (rank-4 cell of e7ee4a) and a
        divisor split with X = p^{1/4} gives p^{1/2}(log p)^{O(1)} -- no gain
        over the classical 2-power meet-in-the-middle, which already has
        polynomial overhead because it CHOOSES the degree. The divisor trick
        helps only where the target degree is forced small by structure
        (Theorem 1.5) and its arithmetic is not chosen; on the nearby object
        the conclusion 'removes a superpolynomial overhead' is vacuous.
        Second control: C(ell) = ell^2 -- the record must then report
        exponent 1/2 and close.
    proof_obligations:
      - claim: Lemma 3.4' (correctness under the divisor condition).
        responsibility: correctness
      - claim: The list count X^2 (log X + 2) without smoothness.
        responsibility: size
      - claim: sum_{ell <= X} (X/ell)^2 C(ell) = X^{2+o(1)} iff c = 1 + o(1).
        responsibility: runtime
      - claim: Memory K^2 (p/2)^{1/3} (log p)^{O(1)}.
        responsibility: memory
      - claim: P0 >= (log p)^{-0.0861-o(1)} under H-DIV via Ford.
        responsibility: success_probability
      - claim: The smooth slice reproduces the incumbent exactly.
        responsibility: baseline
      - claim: The gain survives the listing price (C4).
        responsibility: strictness
      - claim: >-
          The output isogeny has log deg = O(log p) (SC-2 satisfied: degree
          <= X^2 * 2^{2n} with n = O(log p)).
        responsibility: interface
    not_applicable_reason: null

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: the smoothness parameter B and its
      tail (ee8f82), the threshold T (250e50, 71c2b2), the list restriction
      (7424a9), descent (L4). The object here is the ARITHMETIC CONDITION
      that the split imposes on the degree, which every prior record took to
      be smoothness.
    tracked_object: >-
      The indicator [delta has a divisor in a window of width K^2 around X].
    lossiness: >-
      One bit retained from delta; compatible with the only operation used
      (the factorisation across the middle curve); not invertible.
    propagation: >-
      Trivial along the algorithm (checked once per attempt); the record is
      about cost, not propagation depth.
    survival_score: >-
      Survives as long as C(ell) is quasi-linear; dies entirely otherwise.

  null_object_control: >-
    NULL-1 (blocking): random integers drawn with density proportional to
    d^{1/2} on [1, (p/2)^{1/3}] (the D1 law), the divisor statistic computed
    identically; the real delta sample must match it within binomial noise
    -- a mismatch is an arithmetic bias of delta and refutes H-DIV in one
    direction or the other. NULL-2: the same statistic with the window
    width set to K^2 = 1 (a single point), where the probability must
    collapse toward 1/X; an instrument that reports a large probability
    there is broken. POSITIVE CONTROL (blocking): the incumbent's smoothness
    fraction at the paper's B, on the same samples, must reproduce the
    paper's own tail facts at p = 5*2^248 - 1 and 27*2^500 - 1 (lines 250,
    252: smoothest of 100,000 is 12589-smooth against rho(u) about 1/69232;
    smoothest of 10,000 is e^23-smooth against about 1/3312). DECAY CHECK:
    the divisor probability is predicted to fall SLOWLY (like (log X)^{-0.086})
    across the AOV primes and the two crypto primes; a probability that is
    flat or rising with p is an artifact of the window construction.

  discriminated_from:
