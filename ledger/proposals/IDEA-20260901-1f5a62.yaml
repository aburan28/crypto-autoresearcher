      IDEA-20260808-71c2b2 (NEAREST). Keeps smoothness and overshoots the
      radius T to buy multiplicity; deliverable is the coefficient 0.8165 ->
      0.6667 inside exp(c sqrt(L log L)). EXACT DELTA: this record keeps T
      at the structural bound, drops smoothness, and removes the sqrt(L log L)
      term entirely, at the price of large-ell listing which 71c2b2 never
      needs. The two compose: overshoot plus divisor split is a legitimate
      successor if both survive.
    - >-
      IDEA-20260805-250e50. Prices a degree threshold theta and a curve
      screen s with smooth lists throughout. DELTA: no threshold and no
      screen here; the split condition itself is changed.
    - >-
      IDEA-20260815-ee8f82. Resamples the TAIL of Heuristic 1. DELTA: this
      record replaces Heuristic 1 by H-DIV and its validation is a different
      statistic on the same samples.
    - >-
      IDEA-20260815-45aa63 and IDEA-20260815-854159. Recompute the concrete
      table with optimisms removed and ask which factor binds. DELTA: this
      record changes an INPUT to that table (P0 and the listing cost) rather
      than auditing the table; it derives no concrete figure.
    - >-
      IDEA-20260901-2fc431 (RQ-SSI-001, read at its A7 passage only). Buys
      P0^{-1} by enlarging the table to cover k conjugate targets. DELTA:
      this record shrinks P0^{-1} without enlarging the table beyond a
      constant K^2, by weakening the condition rather than multiplying the
      targets; the two fail differently (2fc431 on per-index smoothness,
      this on C(ell)).
    - >-
      IDEA-20260821-e99afd / H-SSIQ-545e66. The alpha/3 identity. DELTA:
      this record is an explicit instance of 'alpha = 1, exponent 1/3', filed
      for the cofactor; it agrees with the identity and cites it as the
      reason it cannot claim more.

  predictions:
    - metric: >-
        M1 -- symbolic reproduction: Lemma 3.4' restricted to B-smooth degrees
        with X = B^{1/2}(p/2)^{1/6}
      direction: different
      minimum_effect: >-
        Must coincide with Lemma 3.4 and line 167 exactly; any deviation
        stops the record.
    - metric: >-
        M2 -- best proven exponent c in C(ell) = ell^{c+o(1)} for listing an
        ell-neighbourhood over F_{p^2}, read from the Stage-1 sources
      direction: lower
      minimum_effect: >-
        c = 1 + o(1) records LIVE; any c > 1 records the derived exponent
        (1 + c)/6 and CLOSED-DOMINATED. This is a literature reading, not a
        measurement, and is reported with provenance retrieved.
    - metric: >-
        M3 -- divisor-success fraction on the AOV exhaustive data per prime
        at K in {sqrt 2, 2}, and its ratio to NULL-1
      direction: different
      minimum_effect: >-
        Ratio real/null within the binomial envelope of 1 at every prime
        records H-DIV CONSISTENT at toy scale; a ratio below 0.5 or above 2
        at two or more primes records an arithmetic bias and H-DIV REFUTED
        in the stated direction.
    - metric: >-
        M4 -- divisor-success fraction at p = 5*2^248 - 1 (100,000 samples)
        and 27*2^500 - 1 (10,000 samples) by the frozen source's sampler,
        against the smoothness fraction at the incumbent's optimised B on the
        same samples
      direction: higher
      minimum_effect: >-
        Divisor fraction exceeding the smoothness fraction by a factor
        growing with p between the two primes; pre-registered: at least 10x
        at both primes. A divisor fraction NOT exceeding the smoothness
        fraction refutes C3 outright.

  minimal_test:
    design: >-
      STAGE 0 (hours, zero compute): M1. STAGE 1 (hours, retrieval): M2 --
      read the two named sources and record c with locators. STOP here if
      c > 1. STAGE 2 (minutes): M3 on the archived AOV data, zero new search.
      STAGE 3 (the frozen source's own experiment plus one test per sample):
      M4 -- requires a quaternion-order sampler; if unavailable in this
      environment, record the gap as infrastructure and stop at Stage 2. No
      list is built, no attack is run.
    controls:
      - NULL-1 random-integer sample with the D1 density (blocking)
      - NULL-2 unit-width window (instrument check)
      - positive control reproducing the paper's two tail facts (blocking at Stage 3)
      - K reported at both sqrt 2 and 2
    required_metrics:
      - the symbolic reproduction verdict
      - c with source locator and provenance
      - divisor and smoothness fractions per prime with binomial intervals, real and null
      - the trend of the divisor fraction in p

  falsification_conditions:
    - F1. M1 fails. Record stops.
    - F2. Best proven c > 1. Record closes as dominated with exponent (1 + c)/6 as the named obstruction.
    - F3. M3 ratio outside [0.5, 2] at two or more primes. H-DIV refuted at toy scale.
    - F4. M4 divisor fraction not above the smoothness fraction. C3 refuted.
    - F5. Positive control fails to reproduce lines 250/252. Sampler is not the paper's; nothing is compared.
    - F6. Sampler unavailable. Infrastructure outcome under AGENTS.md rule 5.

  confounders:
    - >-
      Ford's constant is unknown here; only the order of magnitude is
      predicted, and M3/M4 report fractions, not fits to the theorem.
    - >-
      The polylog inside C(ell) may be large (field extension degrees,
