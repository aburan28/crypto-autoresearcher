idea:
  id: IDEA-20260815-b751cf
  question_id: RQ-SDEG-001
  added: '2026-08-15'
  title: >-
    IS THE SOLVING DEGREE A CURVE-MODEL INVARIANT? Run the identical Semaev
    decomposition through short-Weierstrass, Edwards, Montgomery and Hessian
    models of the SAME curve, because if the degree moves with the model
    then C_decomp is a property of a coordinate choice and the cheapest
    possible speedup in the lane has been sitting unclaimed
  class: control

  claim: >-
    A curve has many models -- short Weierstrass, Edwards, Montgomery,
    Hessian, Jacobi quartic -- related by birational maps, and the summation
    polynomials differ between them because the addition law differs. THE
    ECDLP IS IDENTICAL ACROSS ALL OF THEM; only the algebraic presentation
    changes. This yields a sharp, cheap, and entirely unasked question: IS
    THE SOLVING DEGREE OF THE DECOMPOSITION SYSTEM A MODEL INVARIANT? Two
    outcomes, both valuable and neither currently known in this program. IF
    INVARIANT, the lane gains a genuine robustness result -- C_decomp is a
    property of the curve rather than of a presentation choice, which is
    exactly what a cost model needs to be before it can be extrapolated, and
    it removes a whole class of 'you measured the wrong model' objections to
    the ICEX numerator. IF NOT INVARIANT, then some model is cheaper than
    the one the lane has been using, THE LANE HAS BEEN OVERSTATING C_decomp
    BY WHATEVER THE RATIO IS, and choosing the best model is a free
    improvement to the numerator that costs one change of coordinates. The
    second outcome is the kind of thing that is embarrassing to have missed
    and cheap to check, which is the strongest possible reason to check it.

  mechanism: >-
    STAGE 1: fix a curve ladder where every model is available -- Edwards
    requires a rational point of order 4, Montgomery a point of order 4,
    Hessian a point of order 3, so the ladder must be constructed to admit
    all of them simultaneously, and curves admitting only some are recorded
    separately rather than dropped. STAGE 2: generate the summation
    polynomial and the decomposition system in each model, with an EXPLICIT
    VERIFICATION that the systems describe the same decomposition problem --
    solve both at tiny size and check the solution sets correspond under the
    birational map. WITHOUT THAT CHECK THE COMPARISON IS MEANINGLESS and it
    is the stage most likely to be skipped. STAGE 3: measure solving degree,
    wall clock, and relation yield per model, paired per curve. STAGE 4:
    report the paired ratios and, if any model dominates, quantify the
    effect on the lane's existing C_decomp.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for 'Edwards' (60), 'Montgomery
      form' (6), 'Hessian' (31), 'coordinate change' (17), 'model
      invariant' (2), and for co-occurrence of a curve model with 'solving
      degree' or 'summation polynomial'.
    results: >-
      Curve models are well represented in the corpus, overwhelmingly in
      the context of fast arithmetic and side-channel behaviour rather
      than decomposition cost. No record measures the solving degree of a
      Semaev system across models of the same curve, and 'model invariant'
      returns 2 hits, neither about decomposition.
    verdict: >-
      UNVERIFIED. That summation polynomials differ by model is elementary
      and known; that their SOLVING DEGREES might differ is the question,
      and this program has not asked it. The likeliest prior art is in the
      fast-arithmetic literature, which cares about the addition law's
      cost rather than about Groebner behaviour, so the screen may simply
      be looking in the wrong field -- Stage 1 must include a literature
      check.

  object_first_candidate:
    tracked_object: >-
      THE DECOMPOSITION SYSTEM'S SOLVING DEGREE, with the CURVE MODEL
      promoted from a fixed background choice to the indexed variable. The
      lane has held the model fixed at short Weierstrass throughout
      without recording that as a choice.
    lossiness: >-
      Not a propagation object. The relevant projection is model-to-
      degree, and the record's question is precisely whether that
      projection factors through the curve or remembers the model.
    propagation: >-
      Not applicable; this is a cost-model robustness control.
    survival_score: >-
      Survives exactly as far as the models are birationally equivalent
      over F_p and the ladder admits them. Curves without the required
      torsion admit fewer models and are the boundary case.

  null_object_control: >-
    NULL 1 -- THE SAME MODEL TWICE under different random variable
    orderings, which bounds the run-to-run and ordering-induced variance.
    Any cross-model difference smaller than this null's spread is noise, and
    reporting it as a model effect would be the record's central error. NULL
    2 -- two DIFFERENT short-Weierstrass models of the same curve related by
    an admissible change of variables (u^4, u^6 scaling), which SHOULD be
    indistinguishable; a difference there means the pipeline is sensitive to
    something other than the model. NULL 3 -- correspondence check between
    solution sets under the birational map at tiny size, which must pass
    before any timing is admitted.

  discriminated_from:
    - >-
        The fast-arithmetic literature on curve models. NOT THAT: that
        work compares the COST OF A GROUP OPERATION across models. This
        compares the SOLVING DEGREE OF A POLYNOMIAL SYSTEM, which is a
        different quantity that does not follow from operation counts in
        either direction.
    - >-
        KN-OPEN-003 (do curve representations/symmetries reduce
        decomposition cost). CLOSEST NEIGHBOUR AND THE OVERLAP IS REAL:
        that open problem asks about representations and symmetries
        generally, with the recorded work centring on automorphism-induced
        factor-base reduction. This record asks the narrower, sharper
        question of whether the solving degree itself moves with the
        birational model, holding symmetry fixed. Stage 1 must check KN-
        OPEN-003's existing evidence first, and if it already answers this
        the record should be withdrawn to a control inside that lane
        rather than filed separately.
    - >-
        The side-channel model literature. Different failure surface
        entirely; nothing here concerns implementations.

  assumptions:
    - >-
        A curve ladder admitting all four models simultaneously is
        constructible at toy size. This constrains the torsion structure
        (order divisible by 12 for the full set) and therefore BIASES THE
        LADDER AWAY FROM GENERIC CURVES, which is a real confounder and
        must be reported rather than absorbed.
    - >-
        The birational maps are computable and their correspondence
        verifiable at tiny size. Standard, and Stage 2 checks it rather
        than assuming it.
    - >-
        The solver's behaviour is stable enough that a genuine model
        effect exceeds run-to-run variance. NULL 1 measures this and the
        record is uninterpretable without it.

  predictions:
    - metric: >-
        solution-set correspondence under the birational map at tiny
        size
      direction: different
      minimum_effect: >-
        FORCED TO CORRESPOND EXACTLY. Failure means the systems are not
        the same problem and every subsequent comparison is void.
    - metric: >-
        solving degree across models, paired per curve
      direction: different
      minimum_effect: >-
        No direction pre-committed. The pre-committed part is the
        comparison basis: any claimed model effect must exceed the NULL
        1 ordering-variance spread on the same curves.
    - metric: >-
        two admissible short-Weierstrass models of the same curve
      direction: different
      minimum_effect: >-
        FORCED INDISTINGUISHABLE within null spread. A difference means
        the pipeline responds to something other than the model and
        voids the cross-model comparison.
    - metric: >-
        effect on the lane's existing C_decomp if a dominant model
        exists
      direction: lower
      minimum_effect: >-
        Quantified as a ratio, not described as 'faster'. If no model
        dominates, the reported deliverable is the invariance result and
        its confidence interval.

  minimal_test:
    design: >-
      Three curves admitting all four models, S_3 only, one p, with NULL 1
      ordering variance measured first and the Stage 2 correspondence
      check as a hard gate. If the ordering variance swamps any cross-
      model difference at this size, the record reports that the
      experiment is underpowered and specifies the size at which it would
      not be, rather than reporting a null result.
    controls:
      - >-
          Same-model ordering-variance null, measured before any cross-
          model claim.
      - >-
          Two admissible Weierstrass models, which must be
          indistinguishable.
      - >-
          Solution-set correspondence check under the birational map,
          blocking.
      - >-
          Curves admitting only some models recorded separately, never
          dropped.
      - >-
          Torsion-structure bias of the ladder reported explicitly.
    required_metrics:
      - >-
          Solving degree, wall clock and relation yield per (curve,
          model), paired.
      - >-
          Ordering-variance spread per curve.
      - >-
          Correspondence check pass/fail per curve.
      - >-
          Torsion structure of every ladder curve.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Solution sets do not correspond under the birational map. The
        systems are not the same problem; halt.
    - >-
        Two admissible Weierstrass models differ beyond null spread.
        Pipeline artifact; comparison void.
    - >-
        Cross-model differences are within ordering variance. Underpowered
        at this size; report the required size rather than a null.
    - >-
        A model dominates reproducibly across the ladder. The lane's
        C_decomp is overstated and must be refitted -- the record's
        positive outcome.

  confounders:
    - >-
        LADDER TORSION BIAS, WHICH IS UNAVOIDABLE AND MUST BE STATED.
        Requiring all four models forces the group order to be divisible
        by 12, so the ladder is not generic. Any invariance result is
        scoped to that non-generic family, and generalising it to generic
        curves would be exactly the extrapolation the program's rule 4
        forbids.
    - >-
        MONOMIAL ORDER INTERACTION. A model change alters the variables,
        and the monomial order interacts with variable naming. The order
        must be specified model-independently or the comparison measures
        the order, not the model.
    - >-
        IMPLEMENTATION MATURITY. Short-Weierstrass summation polynomials
        are well trodden here and the other models are not; a degree
        difference could reflect an unoptimised generator rather than the
        mathematics. Generator code must be reviewed for parity before
        results are admitted.

  interpretation_limits:
    - >-
        Scoped to the tested models, arities, ladder and solver. No
        statement about generic curves follows from a torsion-constrained
        ladder.
    - >-
        Produces no attack and no exponent; at most it improves or
        validates a cost-model input.
    - >-
        An invariance result is evidence of robustness within the tested
        range, not a theorem of model-independence.

  heuristic_assumptions:
    - id: HEUR-SDEG-MODEL-1
      statement: >-
        For a fixed curve and fixed arity, the solving degree of the
        Semaev decomposition system is the same across birationally
        equivalent models, up to the solver's ordering-induced variance.
      rigorous_support: >-
        The rigorous ingredient is that the models are birationally
        equivalent over F_p, so the decomposition VARIETIES correspond
        and the solution counts agree. The gap, and the reason this is a
        heuristic rather than a corollary: SOLVING DEGREE IS A PROPERTY
        OF THE IDEAL'S PRESENTATION AND OF THE ALGORITHM, NOT OF THE
        VARIETY, and birational equivalence of varieties does not imply
        equal solving degree of the corresponding presentations. That is
        precisely the gap the measurement probes.
      falsification_condition: >-
        A reproducible cross-model solving-degree difference exceeding
        ordering variance on three or more curves.
      validation_plan: >-
        SAMPLE: >= 10 curves admitting all four models, S_3, >= 5
        orderings per (curve, model) to estimate variance. COMPARISON:
        paired per-curve differences against the within-model variance
        spread. TAIL CHECK: the three curves with the largest cross-
        model spread, reported with their torsion structure, since a
        correlation with torsion would indicate the ladder bias rather
        than a model effect. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that invariance on a 12-divisible-order ladder
        transfers to generic curves. It does not follow and is recorded
        as open.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. If a model dominates, the gain is a
      constant factor in the C_decomp numerator, which per docs/target-
      result-profile.md A1 is explicitly NOT a target-class result and
      must not be presented as one.
    memory_exponent: >-
      Same profile as the lane's existing Groebner runs, multiplied by the
      number of models tested.
    best_known: >-
      The lane's existing short-Weierstrass measurements are the incumbent
      and are what this record would improve or validate. No cross-model
      decomposition-cost comparison is known to this program.
    hidden_overhead: >-
      Generating correct summation polynomials in four models is more
      implementation work than it appears, and an error in the less-
      trodden models produces a spurious model effect in the direction the
      record is looking for -- the worst possible failure mode.
    tradeoff_note: >-
      Constraining the ladder to admit all models buys a clean paired
      comparison and costs genericity. Relaxing it restores genericity and
      destroys the pairing. The record takes the first option and reports
      the cost.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed). As a
    cost-model input: potentially IMPROVES the lane's C_decomp by a constant
    factor, which is dominated by nothing in this program because nobody has
    measured it -- but a constant factor is dominated in the Pareto sense by
    every asymptotic result on the ECDLP frontier and this record claims no
    position there. As curve-model knowledge: entirely dominated by the
    fast-arithmetic literature, which is far more developed and answers a
    different question. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the first paired cross-model
    measurement of Semaev solving degree in this program; either a
    robustness result making C_decomp a curve property rather than a
    presentation artifact, or a quantified ratio by which the lane's current
    numerator is overstated; and an ordering-variance null that the lane
    currently lacks and needs for any degree comparison at all.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that a ladder admitting all four models is constructible at toy
    size. 0.55 that ordering variance is small enough for the comparison to
    be powered at the smallest sizes -- this is the main experimental risk
    and it is measured first for exactly that reason. 0.65 that the solving
    degree turns out INVARIANT across models, since the varieties correspond
    and I expect presentation effects to be second order. 0.2 that some
    model dominates reproducibly, which would be the surprising and more
    useful outcome. 0.4 that a literature check finds the question already
    settled in the fast-arithmetic or Groebner literature, in which case the
    record reduces to a citation.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
