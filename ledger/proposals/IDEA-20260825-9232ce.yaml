  batch: EC-STRUCTURE-20260825
  cluster: 'C5-lifting: why the anomalous attack is isolated'
  title: WHICH SUBGROUP OF (Z/N)^* CAN AN ECDLP SOLVER ACTUALLY ACT WITH? every operation available on
    an instance is AFFINE in k, so the only nonlinear resource is Aut(E) and its order is at most 6 --
    prove this or exhibit a counterexample, and with it the exact reason Cheon's auxiliary-input attack
    has no plain-ECDLP analogue
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The GLV endomorphism speedup and Cheon's auxiliary-input attack are published and recalled.
    The proposed contribution is the intermediate object -- the subgroup of the exponent group realizable
    by a computable instance map -- and the claim that it is exactly Aut(E), which turns two separate
    known facts into one bound.
  claim:
    semantic_part: Define R(E) as the set of efficiently computable maps sending an instance (P, kP) to
      an instance (P', f(k) P'); every map built from group operations and known scalars gives f affine,
      and the only source of a non-affine f available from the curve's own structure is Aut(E), whose
      order is at most 6.
    evaluator_part: 'Unestablished: that no non-affine f exists outside Aut(E). This is stated as the
      target of a proof attempt, and a counterexample would be far more valuable than the proof.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Formalize R(E) with an explicit computation model, so that 'efficiently computable' is not doing hidden
    work.
  - Show that composing group operations and known scalars yields only affine f, which is the same rank-one
    observation as in IDEA-20260825-7260b2 seen on the exponent side.
  - Show that Aut(E) contributes f(k) = lambda k with lambda of multiplicative order dividing 6, and compute
    ord(lambda) for the deployed curves as free exact data.
  - 'Connect to Cheon: the auxiliary-input attack consumes k^d P for d dividing N - 1 with d large; the
    bound says the largest available d is at most 6, which is why the attack does not port.'
  - 'State the escape explicitly: a non-affine f would have to come from outside the curve, that is from
    an oracle or from auxiliary published data -- which is exactly the protocol-level setting where Cheon''s
    attack does apply.'
  lossy_projection_test:
    tracked_object: the function f induced on the exponent by an instance map
    what_is_discarded: the map itself, keeping only its action on the exponent
    propagation: composition of instance maps composes the f's, so the object is a group-theoretic invariant
    verdict: 'PASSES: the object is a genuine quotient of the map and it composes, which is what makes
      the bound a statement about a group rather than about a list of maps.'
  predictions:
  - id: P1
    status: established_formula
    statement: Maps built from group operations and known scalars induce affine f.
  - id: P2
    status: established_formula
    statement: '|Aut(E)| is 2 for generic j, 4 for j = 1728, 6 for j = 0.'
  - id: P3
    status: unestablished
    statement: R(E) contains no non-affine f beyond those induced by Aut(E).
  minimal_discriminating_test:
    status: specified_not_run
    test: Enumerate ord(lambda) mod N for the deployed curves; then attempt, and document the failure
      of, a construction of a non-affine f at toy scale by exhaustive search over short straight-line
      programs in the group operations.
    pass: Exhaustive short-program search finds only affine f, consistent with P3 at the searched depth.
    fail: Any non-affine f found at toy scale refutes P3 and is a significant positive.
  controls:
  - F_p^* as a control where the same question has a known answer and where Cheon's attack does apply
    given the auxiliary inputs.
  - A protocol setting where k^d P is genuinely published, as the positive control that the attack machinery
    works when its input exists.
  - j = 0 and j = 1728 curves as the boundary cases with the largest Aut.
  confounders:
  - '''Efficiently computable'' must be pinned to a model or the claim is unfalsifiable.'
  - Exhaustive search over short programs bounds only that depth; the bound must be reported with its
    depth.
  - Pairing-based maps move the problem to a different group rather than producing a non-affine f, and
    must not be miscounted as one.
  falsification:
    semantic: A non-affine efficiently computable f falsifies P3.
    evaluator: A search implementation bug scopes out that depth.
    not_falsification: Failure to complete the search at greater depth.
  why_this_is_not_a_variant: IDEA-20260802-006 asks whether multiplicative structure survives in the index
    set; that is a distributional question about the map k -> x(kP). This record asks the algebraic question
    of which exponent-group operations are REALIZABLE, which is upstream and bounds the whole family at
    once.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No improvement. The bound would confirm the known constant-factor ceiling of the endomorphism
      speedup and explain it in one line.
    dominated_by:
