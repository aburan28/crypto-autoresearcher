idea:
  id: IDEA-20260905-c3ae38
  title: A coupling envelope for uncertainty in leakage assumptions
  class: mechanism
  claim: If each conditional synthetic leakage channel is within total variation epsilon_i of a reference channel
    uniformly over labels and prior histories, every event on m observations differs in probability by at most min(1,sum
    epsilon_i). This yields a defensible uncertainty envelope for comparisons based on idealized leakage models.
  mechanism: Track a coupling failure budget through a sequential experiment. Couple each pair of channel outputs
    so they agree except with the certified per-step discrepancy; until disagreement, both histories are identical
    and the uniform conditional bound applies. A union bound supplies a compositional envelope without assuming
    independent errors. Exact finite-channel distance certificates provide the per-step inputs. The proposal asks
    whether published threshold comparisons remain informative once an independently specified channel uncertainty
    is propagated; it never evaluates a recovery algorithm. The bound can become vacuous as m grows, and that is
    an explicit sensitivity limit on inference from the model, not evidence that a key is recoverable or protected.
