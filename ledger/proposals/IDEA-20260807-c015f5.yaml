idea:
  id: IDEA-20260807-c015f5
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-07'
  title: >-
    A DECAY-PARAMETER TABLE FOR ALL FOURTEEN LANES, ANCHORED BY A CLOSED-FORM NULL
    FOR THE ONE DECAY TEST THE CAMPAIGN HAS ALREADY RUN: the windowed liftable-count
    within-class variance should be W(1 - W/p)/4, a pinned-character-sum
    (Brownian-bridge) law with no free parameter, and the committed run's own six
    windows match it to within 7.7 percent while the run's printed verdict says
    "NOT explained by the trace identity -- investigate" because its pass criterion
    demands zero variance where the archived derivation predicts Var(z)/4
  class: control

  claim: >-
    (A) THE CAMPAIGN HAS EXACTLY ONE DECAY TEST AND ITS PASS CRITERION CONTRADICTS
    ITS OWN DERIVATION. harness/run_icinv.py::window_decay sweeps the window W and
    reports the mean within-class variance of the liftable-x count. The verdict line
    reads: decay_verdict = "consistent with the trace identity ..." if
    full["mean_within_class_count_variance"] < 1e-9, else "NOT explained by the
    trace identity -- investigate". But the identity the same run VERIFIES on every
    row (harness/exp_icinv.py::liftable_count_identity,
    _liftable_identity_holds: identity_verified) is
      #{x in F_p : x^3+ax+b is a square} = (#E(F_p) - 1 + z)/2,  z = #2-torsion x's.
    Within a class #E is constant, so the identity predicts within-class variance
    EXACTLY Var(z)/4 -- not zero. Zero would require z to be class-invariant, which
    the same module's two_torsion_x_count docstring explicitly denies.

    (B) THE ARITHMETIC, FROM THE COMMITTED RUN, EXACT TO 13 SIGNIFICANT FIGURES.
    RUN-ICINV-p4001-a (EXP-ICINV-180a0d, commit
    e34afdd0c3137c038042cae7c68495c700977afd) records, in raw-result.json,
    Var(two_torsion_x) = 1.0053951126626468 for the classes of trace 30 and -30
    (n = 138 each) and 0.9896907216494846 for the classes of trace 18 and -18
    (n = 98 each). The mean over the four classes of Var(z)/4 is
      (1.0053951126626468 + 0.9896907216494846) / 8 = 0.24938572928901642,
    against the reported
      full_field_liftable_within_class_count_variance = 0.24938572928898783.
    The two agree to 2.9e-14. The quantity the run flags as "NOT explained" is
    explained, exactly, by the derivation the run itself verified. The verdict is a
    threshold mis-specification, not a finding, and it currently stands in the
    campaign's gating-lane run record.

    (C) THE MISSING PIECE: THE SIGNAL DOES NOT DECAY, BUT THE STATISTIC BEING
    WATCHED CANNOT DECAY. The same block reports permutation_p_value = 0.0 at five
    of six windows (W = 125, 500, 1000, 2000, 4001) and 0.003 at W = 250. A p-value
    of 0.0 from 1000 permutations is not a valid estimate, and more importantly the
    p-value is FLAT while the effect size collapses: observed/null within-variance
    ratio is 0.9566, 0.9631, 0.9456, 0.9441, 0.8574, 0.0015 across
    W = 125, 250, 500, 1000, 2000, 4001. A three-order-of-magnitude collapse in the
    effect size is invisible in the reported significance. Under
    docs/inventor-protocol.md section 3 the decay test must watch the quantity that
    is supposed to decay; watching a p-value that saturates at the resolution floor
    is the canonical way to make an artifact look stable.

    (D) THE CLOSED-FORM NULL THIS PROPOSES, WITH NO FREE PARAMETER. Write
    S_W = sum_{x < W} chi(x^3+ax+b). Then the liftable count in [0,W) is
    (W + S_W)/2 up to the 2-torsion correction. Over the FULL field S_p = -t
    EXACTLY, so S_W is a partial sum pinned at both ends: a discrete bridge. Model
    the chi values as a fair +-1 walk conditioned on its endpoint, giving
      Var(S_W) = W(1 - W/p)   and hence   Var(liftable count in [0,W)) = W(1-W/p)/4,
    with the residual at W = p being exactly the 2-torsion term Var(z)/4. THIS MODEL
    HAS NO FITTED PARAMETER. Against RUN-ICINV-p4001-a's six windows -- and this
    comparison is POST-HOC and is labelled so, since I computed it after reading the
    committed numbers:
      W = 125:  predicted 30.2737, measured 30.0435, ratio 0.9924
      W = 250:  predicted 58.5947, measured 63.0785, ratio 1.0765
      W = 500:  predicted 109.3789, measured 110.1848, ratio 1.0074
      W = 1000: predicted 187.5156, measured 196.3660, ratio 1.0472
      W = 2000: predicted 250.0625, measured 242.6782, ratio 0.9705
      W = 4001: predicted 0 plus Var(z)/4 = 0.2493857, measured 0.2493857
    Five windows within 7.7 percent from a parameter-free model, and the sixth
    exact. If this holds prospectively at other p and other classes, the campaign's
    most significant reported signal (liftable_density, permutation p = 0.0005) is
    fully accounted for by a character-sum fluctuation and a 2-torsion count, both
    computable in negligible time from the curve equation, and it carries no ECDLP
    attack content of any kind. That is a clean, citable negative with a named
    mechanism, which is exactly the deliverable
    analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 5 item 5
    predicts the campaign is most likely to produce.

    (E) THE GENERAL DELIVERABLE: ONE DECAY PARAMETER PER LANE, DECLARED BEFORE
    MEASUREMENT, WITH THE MEANING OF NON-DECAY STATED IN ADVANCE.
      L1  isogeny-class invariance. PARAMETER: the isogeny-walk length r from a base
          curve. Under T5's GRH-conditional rapid mixing, the correlation between
          C(E) and C(E_r) must decay toward the class mean as r grows past the
          mixing time. NON-DECAY MEANS: either C is class-constant (zero variance,
          so nothing to decay -- distinguishable because the variance itself is
          zero) or the walk is not mixing (a walk-implementation fault). Secondary
          parameter: the permutation blocking depth of IDEA-20260807-34754f.
      L2  volcano level. PARAMETER: ell taken outside the set of primes dividing the
          conductor f. For such ell the volcano is flat, every curve is at the
          crater, and the level stratification is degenerate. NON-DECAY MEANS: the
          measured "level effect" is not a level effect, since there are no levels.
          This is a free and decisive control.
      L3  j-invariant and CM discriminant. PARAMETER: |D_0|. Past |D_0| = 4 the
          automorphism group is {+-1} and the rho discount is exactly sqrt(2)
          (KN-TECH-018). NON-DECAY MEANS: a claimed CM effect that persists at large
          |D_0| is not CM structure; it is something correlated with the sampling of
          discriminants and must be named.
      L4  phi-equivariant relation collection. PARAMETER: the orbit-closure
          convention -- progressively remove the appended phi-shifted rows. This is
          not a new idea: DEC-20260727-009 rationale R2 measured exactly this
          one-variable comparison and found the factor base moved the metric by
          0, 0, 2, 1 while the appended rows moved it by order B. NON-DECAY MEANS
          the effect is in the factor base rather than the closure convention, which
          would be the interesting direction. This record proposes only the decay
          instrument and asserts nothing about H-STR-002 in either direction; the
          instrument question there is UNADJUDICATED per DEC-20260727-009 and stays
          so.
      L5  phi-equivariant linear algebra. PARAMETER: the fraction of rows randomly
          permuted before the displacement rank is measured. NON-DECAY MEANS the
          quantity is a row-order-independent algebraic invariant; FULL DECAY at a
          small permuted fraction means it is an emission-order bookkeeping
          quantity. Both readings are named here in advance and NEITHER is asserted,
          per DEC-20260727-009's instrument_question_disposition, which forbids any
          downstream record calling phi_alpha an artifact or calling it validated.
      L6  endomorphism-accelerated walks. PARAMETER: |Aut(E)|. On |Aut| = 2 curves
          the measured speedup over negation-only rho must be exactly 1. NON-DECAY
          MEANS an accounting error, since no endomorphism speedup can exist where
          there is no endomorphism.
      L7  ell-torsion correlated with k. PARAMETER: k resampled with the curve
          fixed. Any curve-only statistic's correlation with k must vanish under
          resampling. NON-DECAY MEANS k has leaked into the statistic's computation.
      L8  pairings. PARAMETER: the embedding degree k_emb. Transfer cost must grow
          with k_emb. NON-DECAY MEANS the cost model is not charging the extension
          field.
      L9  canonical lifts. PARAMETER: p-adic precision. Lifted-point height must
          grow toward the Jacobson-Koblitz-Silverman-Stein-Teske regime. NON-DECAY
          (a height that stops growing) MEANS the lift has collapsed onto a
          degenerate or torsion solution, which is an implementation outcome.
      L10 class-group action. PARAMETER: h(O). Any claimed reduction's cost must
          scale with h. NON-DECAY MEANS the reduction is not solving vectorization
          and the quantifier order should be re-examined.
      L11 curve models. PARAMETER: whether the factor base is defined invariantly or
          by a model-specific x-coordinate rule. A model effect that survives an
          invariantly defined factor base is a genuine model effect; one that
          vanishes was a reindexing. This is the same test as
          IDEA-20260807-efc8de's Family 2, applied at the model level.
      L12 the GGM boundary. NO DECAY PARAMETER EXISTS AND THAT IS RECORDED RATHER
          THAN OMITTED: the lane's output is a simulator or a proof that none
          exists, both of which are discrete and neither of which is a measured
          signal. Its control is a nearby-object control, not a decay test.
      L13 multi-target preprocessing. PARAMETER: the transport degree d. A
          preprocessing table's residual value on the transported curve must decay
          with d. NON-DECAY MEANS either a genuinely degree-independent transfer --
          which would be a real result and routes straight into T1's cost model --
          or that the measured "value" is not specific to the table, which the
          shuffled-table null distinguishes.
      L14 this lane. PARAMETER: the number of planted-signal families a null
          survives. See IDEA-20260807-efc8de.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    No oracle, no attack, no resource. The record instruments every other lane's
    signals; the closed-form null of (D) is a statement about a character sum, which
    is R1-flavoured data but is consumed here as a NULL rather than as an attack
    ingredient. Neither KN-FIND-b7e091 nor H-ENDO-001 applies, since nothing here
    proposes an algorithm on G.

  discriminated_from:
    - >-
      harness/run_icinv.py::window_decay as committed. Same sweep; this changes the
      pass criterion from "variance < 1e-9" to "variance equals the closed-form
      prediction within a declared tolerance", changes the watched statistic from a
      saturating p-value to an effect-size ratio, and generalises the design to the
      other thirteen lanes.
    - >-
      IDEA-20260807-34754f, which fixes the NULL (what the observed value is
      compared against). This fixes the DECAY (how the observed value must behave as
      the structure-destroying parameter moves). A signal can pass a correct null and
      still fail a decay test, and vice versa; both are required by
      docs/inventor-protocol.md section 3.
    - >-
      IDEA-20260807-efc8de, which fixes the POSITIVE direction. Three different
      obligations, three records, one lane.
    - >-
      DEC-20260727-009's instrument_question_disposition. This record names L4's and
      L5's decay parameters and their two readings; it asserts NEITHER reading, and
      it does not restate OBS-1 or RT-OBJ-1's comparative limb in any form.

  object_first_candidate:
    tracked_object: >-
      THE DECAY EXPONENT of a measured signal in its declared structure-destroying
      parameter: the fitted slope of log(effect size) against log(parameter), plus
      the residual at the parameter's extreme value.
    lossiness: >-
      GENUINELY LOSSY. It forgets the signal's magnitude, its sign, the curves and
      the classes, retaining a slope and a residual. What it discards is discarded
      compatibly with the campaign's operations: rescaling the functional changes
      the magnitude and not the slope, and relabelling curves within a class changes
      neither. So the retained part propagates deterministically under exactly the
      transformations the lanes apply.
    propagation: >-
      Under composing two structure-destroying operations the slopes add if the
      operations act independently, which is itself a testable prediction. Under a
      change of functional it does not propagate. Under a change of p it should be
      invariant for a genuine mechanism and should drift for an implementation
      artifact, which is the second-order decay test.
    survival_score: >-
      Survives change of magnitude, of units, of curve labels and of p. Dies when
      the parameter is not actually structure-destroying -- which is why each lane's
      parameter must be argued, not merely named, and why L12's entry is "none".

  mechanism: >-
    STEP 1 -- FIX THE COMMITTED DECAY VERDICT. Change the pass criterion from
    variance < 1e-9 to |measured - Var(z)/4| < tol, with tol declared. Re-run the
    frozen slice; the verdict must flip to "consistent". Record the flip as a
    correction to the instrument, not as new evidence about isogeny classes.

    STEP 2 -- PRE-REGISTER THE BRIDGE LAW AND TEST IT PROSPECTIVELY. The post-hoc
    match in (D) is not evidence. Declare Var(count in [0,W)) = W(1-W/p)/4 +
    [W = p] Var(z)/4 in the contract, with a tolerance of 10 percent, and test it at
    NEW p (at least three values) and NEW classes not used in
    RUN-ICINV-p4001-a. Report the ratio measured/predicted per (p, class, W).

    STEP 3 -- REPLACE THE WATCHED STATISTIC EVERYWHERE. Every decay table reports
    the EFFECT SIZE (observed/null variance ratio, or observed/predicted for a
    closed-form null) as the primary column and the p-value as secondary, with the
    p-value's resolution floor 1/(B+1) printed beside it so a floored value cannot
    be read as strong.

    STEP 4 -- WRITE THE FOURTEEN-ROW TABLE AND MAKE IT A CONTRACT FIELD. Each lane's
    experiment contract gains a required decay_parameter block: the parameter, the
    argument that increasing it destroys the structure, the predicted decay law
    where one exists, the tolerance, and the pre-declared meaning of non-decay. A
    lane contract without it is not approvable. This is the enforcement mechanism
    that makes the table binding rather than advisory.

    STEP 5 -- THE NEGATIVE CONTROL FOR THE DECAY TEST ITSELF. Apply the whole
    apparatus to a quantity KNOWN to be class-invariant with certainty: the group
    order N. Its within-class variance is identically zero at every value of every
    parameter, so its decay curve is flat at zero. A decay test that reports a
    nonzero slope for N is broken.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07: full reads of harness/run_icinv.py (window_decay and
      the decay_verdict logic at the end of main), harness/exp_icinv.py
      (liftable_count_identity, two_torsion_x_count, permutation_null), the manifest
      and raw-result.json of RUN-ICINV-p4001-a; read of docs/inventor-protocol.md
      section 3; read of ledger/decisions/DEC-20260727-009.yaml in full; rg -i
      "decay" over ledger/ and analysis/.
    results: >-
      A decay test EXISTS for exactly one quantity (window_decay for liftable
      density) and its docstring is explicit and correct about why the test is the
      right one. Its PASS CRITERION is variance < 1e-9. NO record in this repository
      states the closed-form W(1-W/p)/4 law, notes that the committed verdict
      contradicts the archived identity, notes that the reported p-value saturates
      while the effect size collapses by three orders of magnitude, or gives a decay
      parameter for any lane other than L1. DECOMPOSITION.md names the k-resampling
      control for L7 and the random-permutation null for L5; those two rows of the
      table are restatements and are marked as such.
    verdict: adaptation
  novelty_status_note: >-
    ADAPTATION with one new derivation. The decay-test discipline is
    docs/inventor-protocol.md's, the k-resampling and row-permutation controls are
    DECOMPOSITION.md's, and the bridge variance of a pinned random walk is
    elementary probability. What is new to this program is the parameter-free law
    for this specific functional, the observation that the committed verdict
    contradicts its own archived identity, and the fourteen-row table as a contract
    field. The post-hoc numerical match is labelled post-hoc throughout.

  null_object_control: >-
    MANDATORY, and here it is layered.
    NULL FOR THE BRIDGE LAW: a matched random FUNCTION null. Replace chi(f(x)) by an
    i.i.d. fair +-1 sequence conditioned to sum to -t, and measure the same windowed
    variance. If the curve data matches the random-bridge null within tolerance,
    then the windowed liftable count carries no curve-specific information beyond
    (N, z) and the campaign must say so. If it deviates systematically, the
    deviation is the residual worth naming and is bounded by Weil.
    NULL FOR THE DECAY APPARATUS: the group order N, which is exactly class-constant,
    giving a flat-at-zero decay curve; and a quantity known to be pure noise (a
    hash of the curve coefficients), giving a flat-at-null curve. The apparatus must
    produce the correct flat line for both.
    DECAY PARAMETER OF THE DECAY TEST: the number of permutation draws B and the
    tolerance tol. As B grows the p-value floor 1/(B+1) must fall and any conclusion
    that flips when it does was resting on the floor.

  assumptions:
    - >-
      HEURISTIC D1 (the bridge law). For a fixed ordinary curve over F_p, the partial
      character sums S_W = sum_{x<W} chi(x^3+ax+b) behave, as W varies, like a fair
      +-1 random walk conditioned on S_p = -t, so Var(S_W) over the curves of a
      fixed isogeny class is W(1 - W/p) to leading order.
      RIGOROUS SUPPORT: Weil bounds |S_W| by 2 sqrt(p) log p up to constants for any
      W, which fixes the SIZE of the quantity but not its distribution; the pinning
      S_p = -t is exact and elementary. The distribution half is the classical
      expectation that quadratic-character values along a cubic behave like
      independent signs, which is the same modelling step that underlies standard
      heuristics for character sums; it is NOT a theorem and is not presented as
      one. FALSIFICATION: a persistent deviation of the measured variance from
      W(1-W/p)/4 beyond the declared tolerance, replicated at three or more p.
      VALIDATION ROUTE: Step 2's prospective test at new p and new classes, against
      the matched random-bridge null, with the largest single-cell deviation
      reported as the tail check. TOY SCALE ONLY, and labelled so: nothing here is
      validated at cryptographic p and nothing licenses assuming it there.
    - >-
      The archived identity #liftable = (#E - 1 + z)/2 is correct. It is a
      derivation in harness/exp_icinv.py and is verified on every row of
      RUN-ICINV-p4001-a; this record re-derives it independently in Stage 0 rather
      than trusting the verification.
    - >-
      Within a class #E is constant. Elementary.
    - >-
      Toy scale throughout. p of order 2^12; complete class enumeration is O(p^2).

  proof_search_map:
    bottleneck: >-
      Heuristic D1. Everything else in this record is bookkeeping and threshold
      repair; the only mathematical content is the variance law, and it is the only
      thing that can be wrong in an interesting way.
    baseline_embedding:
      parameter_slice: >-
        p = 4001, traces {30, -30, 18, -18}, the six windows
        {125, 250, 500, 1000, 2000, 4001} -- exactly RUN-ICINV-p4001-a's
        window_decay grid.
      reproduction_check: >-
        Recompute mean over the four classes of Var(z)/4 from the committed
        raw-result.json and require it to equal
        full_field_liftable_within_class_count_variance to 12 significant figures.
        The check is exact integer-and-float arithmetic on committed numbers, not a
        plot comparison, and it is the whole basis of claim (B).
    observation_collision:
      observable: >-
        The within-class variance of the windowed liftable count.
      distinct_preimage_search: >-
        REQUIRED. Two distinct ground-truth objects with the same observable: a real
        isogeny class, and a synthetic family of "curves" whose chi-sequences are
        i.i.d. signs pinned to the same -t. If they collide -- which is what D1
        predicts -- the observable does not identify the curve family, and the
        liftable-density signal cannot be read as isogeny structure. The collision
        is the RESULT here, not a falsifier.
    quantifier_order: >-
      Intended: FOR ALL p in the tested set, FOR ALL ordinary classes at that p,
      FOR ALL W, the within-class variance of the windowed liftable count is
      W(1-W/p)/4 within tolerance tol. The dangerous weaker reading, NOT claimed:
      FOR ALL p THERE EXISTS a class where it holds -- which would let the fit pick
      its class after seeing the data. Step 2 forbids it by declaring the classes
      before measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these p, on these classes, the windowed liftable-count variance is
        within tol of a parameter-free bridge law, and the residual at W = p is
        exactly the 2-torsion term." It can NEVER certify that no isogeny-class
        information exists in the liftable density -- only that none is visible
        above tol at these parameters -- and it certifies nothing at any p not
        tested.
      nearby_object_control: >-
        The matched random-bridge null. A method that cannot distinguish a real
        class from a pinned i.i.d. sign family has not identified curve structure;
        that indistinguishability IS the expected finding and is what makes the
        negative citable.
    proof_obligations:
      - claim: Within a class, #E is constant, so Var(liftable at W=p) = Var(z)/4.
        responsibility: correctness
      - claim: Mean over classes of Var(z)/4 equals the committed reported value.
        responsibility: baseline
      - claim: Var(S_W) = W(1-W/p) for a fair walk pinned at S_p.
        responsibility: correctness
      - claim: Heuristic D1 transfers that law to character sums along a cubic.
        responsibility: success probability
      - claim: The p-value floor is 1/(B+1) and is printed beside every p-value.
        responsibility: scope

  predictions:
    - metric: >-
        measured within-class variance of the windowed liftable count divided by
        W(1-W/p)/4, at three new p and at least four classes each
      direction: different
      minimum_effect: >-
        Ratio in [0.9, 1.1] at every cell with W <= p/2. Pre-registered failure: any
        cell outside [0.75, 1.33] falsifies Heuristic D1 at that p and the record is
        superseded rather than amended. The post-hoc ratios from
        RUN-ICINV-p4001-a -- 0.9924, 1.0765, 1.0074, 1.0472, 0.9705 -- are the
        reason for the 10 percent tolerance and are NOT counted as confirming
        evidence.
    - metric: >-
        the committed decay_verdict on the frozen slice after the criterion is
        repaired
      direction: different
      minimum_effect: >-
        It must flip from "NOT explained by the trace identity -- investigate" to
        "consistent". If it does not flip, the diagnosis in (B) is wrong and this
        record's central claim fails.
    - metric: >-
        observed/null effect-size ratio versus permutation p-value across the six
        windows
      direction: different
      minimum_effect: >-
        The effect size must span at least two orders of magnitude while the
        p-value spans less than one. The committed run already shows 0.9566 down to
        0.0015 in effect size against p-values 0.0 to 0.003; reproducing that
        contrast is the demonstration that the p-value is the wrong watched
        statistic.
    - metric: >-
        number of the fourteen lanes whose contract carries a decay_parameter block
      direction: higher
      minimum_effect: >-
        Fourteen of fourteen, with L12's entry being an explicit "no decay parameter
        exists, and here is why" rather than an omission.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is the cheapest discriminator in the entire
      lane): recompute (1.0053951126626468 + 0.9896907216494846)/8 and compare with
      0.24938572928898783. Agreement to 12 significant figures settles claim (B)
      with no execution whatsoever. Disagreement supersedes this record.
      STAGE 1 (minutes): repair the pass criterion; re-run the frozen slice; confirm
      the verdict flips.
      STAGE 2 (an hour): the matched random-bridge null at p = 4001, same class
      sizes, same windows.
      STAGE 3 (hours): the prospective test at three new p and four new classes each.
      STAGE 4 (zero compute): write the fourteen-row table; propose the
      decay_parameter contract field to the Coordinator.
      STAGE 5 (minutes): the negative controls -- the group order N and a coefficient
      hash -- through the identical apparatus.
    controls:
      - matched random-bridge null (i.i.d. signs pinned to -t)
      - the group order N, which must give a flat-at-zero decay curve
      - a hash of (a,b), which must give a flat-at-null decay curve
      - the p-value floor 1/(B+1) printed beside every p-value
      - the frozen RUN-ICINV-p4001-a slice, reproduced before anything new is run
    required_metrics:
      - measured and predicted within-class variance per (p, class, W), with ratio
      - Var(z) per class and the derived Var(z)/4
      - observed/null effect-size ratio and permutation p-value per cell, with floor
      - the repaired decay_verdict on the frozen slice
      - the fourteen-row table, with the meaning of non-decay per lane

  falsification_conditions:
    - >-
      Stage 0's arithmetic does not agree to 12 significant figures. Claim (B) is
      withdrawn and the "NOT explained" verdict stands as a genuine open question.
    - >-
      The prospective bridge-law test puts any cell outside [0.75, 1.33] at
      W <= p/2. Heuristic D1 is falsified at that p; the closed-form null is
      withdrawn and the campaign returns to a permutation null for this functional.
    - >-
      The repaired verdict does not flip on the frozen slice. The diagnosis is wrong.
    - >-
      The group-order negative control produces a nonzero decay slope. The apparatus
      is broken and nothing from it is reported.
    - >-
      The matched random-bridge null differs materially from the curve data. Then the
      liftable density DOES carry curve-specific information beyond (N, z), which
      would be the interesting outcome and would move the campaign's centre of
      gravity to characterising it.

  confounders:
    - >-
      THE BRIDGE MODEL IGNORES WEIL CORRELATION. chi values along a cubic are not
      independent; Weil bounds the deviation but does not give the distribution. The
      matched random-bridge null is what quantifies the residual, and any systematic
      excess is the residual worth naming.
    - >-
      WINDOW ENDPOINT EFFECTS. The window starts at 0, which is not a random point;
      x = 0 and small x are special (f(0) = b). Rotating the window start is a cheap
      robustness check and must be run.
    - >-
      SMALL z SUPPORT. z takes values in {0, 1, 3}, so Var(z) is estimated from a
      three-point distribution and is noisy at small class sizes. Report Var(z) with
      its own standard error.
    - >-
      THE p-VALUE FLOOR. At B = 1000, five of six committed cells report exactly 0.0.
      Any decay conclusion drawn from p-values alone at this B is drawn from the
      floor.
    - >-
      MIXING TIME IS UNMEASURED FOR L1's WALK PARAMETER. T5's rapid mixing is
      GRH-conditional and cited, not proved, in DECOMPOSITION.md. L1's decay
      parameter therefore needs an empirically measured mixing time at toy p before
      "r past the mixing time" means anything, and that measurement is part of L1's
      contract, not an assumption this record may make.

  interpretation_limits:
    - >-
      Toy tier. Everything is at p of order 2^12 to 2^14 with completely enumerated
      classes. No statement about medium or cryptographic scale is made or licensed.
    - >-
      A decay test that passes does not establish that a quantity is uninformative;
      it establishes that its behaviour matches a stated null law within a stated
      tolerance at the tested parameters.
    - >-
      The fourteen-row table is a DESIGN artifact. Naming L9's or L10's decay
      parameter asserts nothing about those lanes' outcomes.
    - >-
      L4 and L5 rows assert nothing about H-STR-002 in either direction; the
      instrument question there is UNADJUDICATED under DEC-20260727-009 and this
      record does not disturb it.

  reachability_gate: >-
    REQUIRED FOR ONE ROW AND ANSWERED THERE. L1's decay parameter is the
    isogeny-walk length r, which does move between curves. At toy p the walk is
    cheap -- each step is a Velu isogeny of small degree plus a certificate
    (IDEA-20260807-257001) -- and a RANDOM neighbour is what the decay test needs,
    which is exactly the cheap side of T5. No specified curve is targeted anywhere,
    so the vectorization side of T5 is never invoked. The rest of the table involves
    no movement between curves at all.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Instrument cost: the window sweep is
      O(p) per curve per window and is already paid; the bridge-law comparison is
      arithmetic; the prospective test multiplies the existing enumeration cost by
      the number of new p, and the enumeration is O(p^2), which dominates everything.
    memory_exponent: >-
      O(class size) floats per window. Negligible beside the O(p) character tables
      harness/isogeny_class.py already caches.
    best_known: >-
      Attack frontier unchanged: parallel rho at 0.886*sqrt(N) time and O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted rho on CM curves
      (KN-TECH-018), BSGS at sqrt(N) time and sqrt(N) memory. For the DECAY TEST the
      incumbent is harness/run_icinv.py::window_decay with its variance < 1e-9
      criterion.
    hidden_overhead: >-
      The prospective validation at three new p costs three full O(p^2) enumerations,
      which is the real budget item and is the reason this record stages the
      zero-compute check first. Heuristic D1's o(1) is the Weil correlation term:
      it is bounded in size by 2 sqrt(p) log p but its distributional effect is
      exactly what is unquantified, and that is disclosed rather than absorbed.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. The statistical tradeoff is B versus
      p-value resolution, floor 1/(B+1), declared per contract.

  dominated_by: >-
    AS AN ATTACK: mounts none; dominated on every axis by every row of the
    prime-field frontier -- parallel rho at 0.886*sqrt(N) time and O(1) memory
    (KN-TECH-001, KN-TECH-006), the automorphism-discounted variant on CM curves
    (KN-TECH-018), BSGS at sqrt(N) time and sqrt(N) memory. Checked across time,
    memory and data/queries; nothing contested, because the record's whole content is
