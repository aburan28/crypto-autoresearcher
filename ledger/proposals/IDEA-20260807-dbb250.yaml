idea:
  id: IDEA-20260807-dbb250
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE TARGET-MODULE GATE, PROVED IN TWO LINES AND COVERING EVERY p-ADIC
    HEIGHT AT ONCE: any quadratic form q on the prime-order group G with values
    in a torsion-free Z_p-module is IDENTICALLY ZERO when N != p, because
    q(N x) = N^2 q(x) and N x = 0 -- so no cyclotomic, anticyclotomic or
    CM p-adic height on the canonical lift can carry scalar information, and
    the anomalous attack's success is exactly the failure of the hypothesis
    N != p; the surviving use is instrumental, as a cheap estimator of the
    regulator that IDEA-20260807-6533fd's exponent identity consumes
  class: mechanism

  claim: >-
    (A) WHY THIS ROUTE IS TEMPTING AND MUST BE ADDRESSED. The Serre-Tate
    canonical lift of an ORDINARY curve is exactly the setting in which p-adic
    height pairings are best behaved: ordinary good reduction is the standing
    hypothesis for the Mazur-Tate and Schneider p-adic heights, and CM supplies
    a second, anticyclotomic height with its own p-adic Gross-Zagier theory.
    A lane that lifts an ordinary curve p-adically and then declines to ask
    about p-adic heights has not searched its own neighbourhood. Moreover the
    program already knows that a p-adic invariant CAN solve a discrete log:
    the anomalous (N = p) attack reads the scalar off the formal-group
    logarithm in linear time. So the question "why does the p-adic route work
    at N = p and not otherwise" deserves an answer sharper than "N != p".

    (B) THE ANSWER, AS A COMPLETE PROOF. Let M be any torsion-free Z_p-module
    (Z_p itself, Q_p, a pro-p group written additively, the target of any
    p-adic height). Let q: G -> M be any QUADRATIC map, i.e.
    q(n x) = n^2 q(x) for all n in Z. Since G has order N, N x = 0 for every
    x, so
        0 = q(0) = q(N x) = N^2 q(x).
    If N != p then N is a unit in Z_p, hence N^2 acts invertibly on M, hence
    q(x) = 0 for every x. QED.
    THE SAME ARGUMENT WITH n^2 REPLACED BY n COVERS HOMOMORPHISMS, which is
    the pro-p gate ECFG-P1543-R1 already records ("the formal kernel is pro-p
    and has no nontrivial N-torsion; a homomorphism from the prime order-N
    group into it is zero"). THIS RECORD'S INCREMENT IS THE QUADRATIC CASE,
    which is what a HEIGHT is, and which the linear statement does not cover.
    It applies uniformly to: the cyclotomic p-adic height, the anticyclotomic
    p-adic height, the CM/Katz height, any p-adic regulator entry, and any
    p-adic pairing landing in a torsion-free Z_p-module. ONE ARGUMENT, ALL OF
    THEM.

    (C) WHY THE ANOMALOUS ATTACK IS NOT A COUNTEREXAMPLE BUT A CONFIRMATION.
    At N = p the hypothesis "N is a unit in Z_p" fails, N^2 is not invertible,
    and the argument gives nothing -- which is exactly where the Smart /
    Satoh-Araki / Semaev attack lives. The gate therefore explains the
    boundary rather than merely asserting it, and it predicts that ANY future
    p-adic scalar-recovery method must either (i) target N = p or a small
    p-part, or (ii) land in a module with N-torsion, or (iii) fail to be
    polynomial (degree 1 or 2) in the group variable. Those three are the
    forward guidance, and (ii) and (iii) are not closed here.

    (D) WHAT SURVIVES, AND IT IS NOT NOTHING. The gate kills p-adic heights as
    SCALAR-RECOVERY instruments. It does not kill them as MEASUREMENT
    instruments. IDEA-20260807-6533fd's exponent identity
    B ~ (N sqrt(Reg)/V_r)^{2/r} consumes the REGULATOR, and the regulator is
    the single most expensive input in that identity: computing it
    archimedeanly needs generators and high-precision canonical heights. The
    p-adic regulator of an ordinary curve is computable from p-adic data at
    the canonical lift and, for CM curves, is tied to a p-adic L-value. SO THE
    PROPOSAL'S SURVIVING CONTENT IS: use the p-adic height as a CHEAP PROXY
    for Reg in the lane's own cost model, and measure how good a proxy it is.
    That is a genuine instrument contribution with a measurable quality metric
    and it is the only thing this record asks to be run.

    (E) THE TWO OUTCOMES. OUTCOME 1: the gate verifies constructively (every
    computed p-adic height of a lifted G-point is 0 to the working precision,
    and the anomalous control is nonzero), and the p-adic regulator proxy
    tracks the archimedean regulator to within a stated factor. Then L9 gains
    a cheap Reg estimator and a clean closure of the p-adic-scalar route.
    OUTCOME 2: a computed p-adic height on a lifted G-point is nonzero beyond
    precision error. Then either the implementation is wrong (most likely) or
    the height is not quadratic on the object being fed to it (which would
    mean the lifted "points" are not what the pipeline thinks), and either way
    the diagnosis is valuable.

  resource_label: >-
    R6 (the p-adic lift and its p-adic height theory) with R3 entering through
    the CM/anticyclotomic height, which exists only because End is an order in
    an imaginary quadratic field.
  admissibility: admissible
  admissibility_argument: >-
    The p-adic height is defined on characteristic-zero (or Z_p-) points, not
    on the finite group, so nothing here is a generic-group oracle output and
    the DECOMPOSITION.md section 2 filter does not close it. THE RECORD IS
    CLOSED BY A DIFFERENT OBSTRUCTION, and distinguishing the two is worth
    stating: H-ENDO-001 says every endomorphism acts on G as a scalar, so
    endomorphism structure adds no congruence; the target-module gate says
    every quadratic Z_p-valued function on G is zero, so p-adic analytic
    structure adds no VALUE. They are different theorems with the same moral
    -- G is too rigid to receive structure from outside -- and their
    consilience is worth recording, not conflating. Note also that the gate is
    NOT a generic-group argument: it uses the specific target module, and a
    target module WITH N-torsion (open class (ii)) would evade it entirely
    while remaining just as non-generic.

  discriminated_from:
    - >-
      ECFG-P1543-R0/R1 (ledger/FINDING-PF-IC-001.md): records the LINEAR
      version (pro-p homomorphism gate) and the first-jet statement that [N]
      acts invertibly on E_1/E_2 for N != p. This record supplies the
      QUADRATIC version, which covers heights and pairings that the linear
      statement does not, and it states the gate for an arbitrary torsion-free
      Z_p-module rather than for the formal kernel specifically. Overlap
      declared; the increment is the degree-2 case and the module-level
      generality.
    - >-
      The anomalous-curve attack (N = p, Smart / Satoh-Araki / Semaev): this
      record does not propose it, does not extend it, and uses it only as the
      boundary case that confirms the gate's hypothesis is load-bearing. It is
      also the mandatory POSITIVE CONTROL.
    - >-
      L8 / RQ-PAIR-21313f (pairings and embedding degree): that lane transfers
      to F_{p^k} and does index calculus there; the target is a multiplicative
      group of characteristic p, not a Z_p-module, and the gate does not apply
      to it. Disjoint.
    - >-
      IDEA-20260807-cfe576: that closes canonical POINT-LIFTING routes by
      target-independence. This closes p-adic VALUE-EXTRACTION routes by the
      target module. Different obstruction, different objects; both are needed
      and neither implies the other.
    - >-
      ideas/rejected/ECDLP-IDEA-109_serre_tate_torsion_section_jet_coordinate_hypothesis.md,
      a previously REJECTED idea in this repository's archive whose title
      names Serre-Tate torsion sections and jet coordinates. Not read in
      detail in this session; flagged here so a reviewer can check the overlap
      rather than have it discovered later. [open]

  object_first_candidate:
    tracked_object: >-
      THE TARGET MODULE of a proposed invariant: the Z_p-module in which the
      invariant takes values, together with the polynomial degree of the
      invariant in the group variable. The pair (module, degree) is what is
      followed.
    lossiness: >-
      EXTREMELY LOSSY AND THAT IS ITS POWER: it discards the entire analytic
      construction -- sigma functions, Coleman integration, splitting of the
      Hodge filtration, L-values -- and keeps only where the answer lives and
      how it scales. The discard is compatible with the operation that matters
      (evaluating the invariant on multiples of a point) because the scaling
      law q(nx) = n^d q(x) is precisely what survives that operation, by
      definition of homogeneity. It is NOT a change of coordinates: the
      cyclotomic and anticyclotomic heights are different constructions with
      the same object value, and the gate correctly gives them the same
      verdict without needing to know either.
    propagation: >-
      One step = multiplying the point by n. The object propagates by
      q -> n^d q, exactly and by definition. That is the cleanest possible
      one-step propagation rule in this campaign, and it is what makes the
      gate a two-line argument.
    survival_score: >-
      SURVIVES: every p-adic construction of homogeneous degree in a
      torsion-free target. DIES: at a target module with N-torsion (open class
      ii), at a non-homogeneous invariant (open class iii), and at N = p (the
      anomalous case). Three named death points, all of which are the forward
      guidance.

  mechanism: >-
    STEP 1 -- STATE AND CHECK THE GATE (zero compute). Write the two-line
    argument; check the hypotheses explicitly (G of prime order N; M
    torsion-free over Z_p; q homogeneous of degree d >= 1); note the two
    corollaries (d = 1 recovers the pro-p homomorphism gate; d = 2 covers
    heights).
    STEP 2 -- CONSTRUCT THE OBJECT THE GATE FORBIDS, AND WATCH IT VANISH. On a
    toy ordinary E/F_p with N != p: build the finite-etale (Teichmuller) lift
    of a point of G to Ẽ(Z/p^n) as in IDEA-20260807-cfe576 Step 3; feed it to
    a p-adic height implemented via the formal-group logarithm and the
    standard sigma-function or Coleman recipe at working precision n; confirm
    the output is 0 to precision. THE POINT OF RUNNING A COMPUTATION WHOSE
    ANSWER IS PROVED IS THAT THE IMPLEMENTATION CAN BE WRONG, and a nonzero
    answer here diagnoses the implementation before any other L9 p-adic number
    is trusted.
    STEP 3 -- THE ANOMALOUS POSITIVE CONTROL. Construct a toy anomalous curve
    (N = p, trace 1) and repeat. The height/logarithm MUST be nonzero and MUST
    recover the scalar, reproducing the classical linear-time attack at toy
    scale. An instrument that returns 0 there is broken and no negative may be
    reported from any arm.
    STEP 4 -- THE SURVIVING INSTRUMENT ARM. On toy CM curves with h(D_E) = 1
    and exhibited rank 1 or 2, compute (a) the archimedean regulator from
    canonical heights and (b) a p-adic regulator from p-adic heights of the
    same exhibited generators. Measure the correlation and the ratio's spread
    across curves and precisions. Report whether (b) is a usable proxy for (a)
    in the exponent identity, and at what cost ratio.
    STEP 5 -- ENUMERATE THE THREE ESCAPES. Write down, as forward guidance,
    what an invariant would have to look like to evade the gate: a target with
    N-torsion, a non-homogeneous invariant, or N = p. For each, state whether
    any known construction realises it. This is the closure's forward-guidance
    obligation and it is zero compute.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07 shared L9 screen plus greps for "p-adic height|Mazur-Tate|
      Schneider|Coleman|anomalous|Smart|Satoh-Araki" across ledger/,
      knowledge/, docs/, analysis/, and a read of ECFG-P1543-R0/R1 and
      KN-TECH-059 (elliptic formal group).
    results: >-
      The formal-group and anomalous material is present (KN-TECH-059 cites
      Silverman Ch. IV; ECFG-P1543-R1 states the pro-p homomorphism gate and
      the first-jet statement). "p-adic height", "Mazur-Tate", "Schneider" and
      "Coleman" return no substantive technique record. The QUADRATIC form of
      the gate, stated for an arbitrary torsion-free Z_p-module, appears
      nowhere. One archived REJECTED idea file names Serre-Tate jets
      (ECDLP-IDEA-109) and is flagged for reviewer comparison.
    verdict: >-
      ADAPTATION with declared overlap. The linear case is already in the
      corpus and is cited. The quadratic case and the module-level statement
      are the increment; both are elementary and neither is claimed as new
      mathematics, only as new to this program's ledger.

  null_object_control: >-
    MANDATORY AND BLOCKING, IN BOTH DIRECTIONS.
    NEGATIVE DIRECTION (the gate): on a non-anomalous toy curve the computed
    p-adic height of every lifted G-point must be 0 to working precision.
    DECAY PARAMETER: the p-adic precision n. The residual must DECREASE like
    p^{-n} as n grows; a residual that FAILS TO DECAY with n is not a signal,
    it is a precision artifact, and that is the canonical artifact tell for
    this record.
    POSITIVE DIRECTION (the instrument is alive): the anomalous curve must
    return a NONZERO height that recovers the scalar. A pipeline passing only
    the negative direction has demonstrated nothing but its own silence.
    SECOND NULL: a random element of Z/p^n substituted for the computed
    height; the scalar-recovery step must fail on it, confirming that success
    in the anomalous arm comes from the height and not from the decoder.
    THIRD NULL (for Step 4): shuffle the pairing between curves and their
    p-adic regulators; the correlation with the archimedean regulator must
    collapse.

  assumptions:
    - >-
      A p-adic height is quadratic: h_p(n P) = n^2 h_p(P). STANDARD for the
      Mazur-Tate and Schneider heights on curves with good ordinary reduction;
      RECALLED, NOT READ. THIS IS THE LOAD-BEARING HYPOTHESIS OF THE GATE and
      Stage 0 must verify it; if some p-adic height in use is only quadratic
      up to a linear term, the gate covers the quadratic part and the linear
      part is covered by the d = 1 case, so the conclusion survives -- but the
      record must say which decomposition it is using.
    - >-
      The target of the p-adic height is a torsion-free Z_p-module (Q_p, or
      Z_p, or a K-vector space). Standard; if a construction lands in a module
      with N-torsion the gate does not apply and that is open class (ii).
    - >-
      G has prime order N and N != p. Both are hypotheses of the campaign's
      setting (DECOMPOSITION.md section 1) and the second is exactly the one
      the anomalous case violates.
    - >-
      Serre-Tate canonical lift exists and is ordinary. Standard; recalled.
    - >-
      The archived rejected idea ECDLP-IDEA-109 may overlap. NOT READ IN THIS
      SESSION; flagged [open] for a reviewer.

  proof_search_map:
    bottleneck: >-
      The homogeneity hypothesis q(n x) = n^d q(x). It is the only property of
      the p-adic height the argument uses, and every escape from the gate is
      an escape from it. Removing it -- exhibiting a useful p-adic invariant
      that is not homogeneous of bounded degree in the group variable -- is
      the single thing that would reopen this route, and it is named as open
      class (iii) rather than dismissed.
    baseline_embedding:
      parameter_slice: >-
        The anomalous curve at toy scale: a named p, a named curve with trace
        1 so N = p, a named point pair (P, Q = [k]P), and the recovered k. The
        pipeline must reproduce the classical linear-time recovery exactly.
      reproduction_check: >-
        Frozen fixture: exact p, exact curve coefficients, exact P and Q,
        exact k. Integer equality on the recovered k. A failure means the
        p-adic machinery is not working at all and no statement about the
        non-anomalous case may be made from it.
    observation_collision:
      observable: "The computed p-adic height of a lifted G-point."
      distinct_preimage_search: >-
        SUCCEEDS TRIVIALLY AND IS THE ARGUMENT: every non-anomalous curve,
        every point, every k, every CM structure gives the SAME observable,
        namely 0. The observable is maximally collided -- it is constant on
        the entire class of objects the lane cares about. A constant
        observable carries zero bits about k, which is the closure. THE
        COLLISION CAN FAIL only in the anomalous arm, where the observable is
        not constant, and the record's design makes that the positive control
        rather than an embarrassment.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does this p-adic invariant recover the scalar" by "what is
          its target module and its homogeneity degree". Encoding: the
          invariant's type signature. Completeness: every homogeneous
          invariant has one. Soundness: the two-line argument. Transfer:
          exact. Cost loss: total -- the reduction says nothing about
          non-homogeneous invariants, which is stated as the escape.
        predicted_gain: >-
          A zero-compute audit disposing of an entire construction family,
          which is what the inventor protocol asks a closure to be.
      - transform: stronger_invariant
        proposed_object: >-
          Track the p-adic REGULATOR (a determinant of heights of independent
          generators) rather than a single height. The regulator is not a
          function on G at all -- it is a function of the global lattice -- so
          the gate does not kill it, and it is the quantity
          IDEA-20260807-6533fd actually consumes.
        predicted_gain: >-
          The record's only surviving positive: a potentially cheaper
          estimator for the most expensive input of the lane's cost model.
    quantifier_order: >-
      THE CLAIM: FOR ALL torsion-free Z_p-modules M, FOR ALL homogeneous
      q: G -> M of degree d >= 1, and FOR ALL x in G with N != p, q(x) = 0.
      THE TRAP: the inverted "for all x there exists an invariant separating
      it", which is true and vacuous (take the invariant that computes the
      discrete log). The gate's content is that the invariant is fixed BEFORE
      the point and must be homogeneous, which is what every actual p-adic
      height is.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "no homogeneous p-adic invariant with torsion-free
        Z_p-module values is nonzero on G when N != p; hence no p-adic height,
        cyclotomic, anticyclotomic or CM, is a scalar-recovery instrument in
        that regime." It CANNOT certify anything about non-homogeneous
        invariants, about targets with N-torsion, about N = p, or about
        invariants of the LATTICE rather than of points (the regulator). It is
        not an ECDLP lower bound.
      nearby_object_control: >-
        The nearby object where the conclusion fails is the anomalous curve,
        where the identical machinery succeeds. Running both with identical
        code is the control that proves the method identifies the load-bearing
        hypothesis (N != p) rather than merely failing everywhere.
    proof_obligations:
      - claim: "q(Nx) = N^2 q(x), Nx = 0, N invertible in Z_p implies q = 0."
        responsibility: correctness
      - claim: "p-adic heights are quadratic on good ordinary reduction."
        responsibility: baseline
      - claim: "The d = 1 case recovers ECFG-P1543-R1's pro-p homomorphism gate."
        responsibility: correctness
      - claim: "The anomalous arm recovers k exactly at toy scale."
        responsibility: baseline
      - claim: "The p-adic regulator is a lattice invariant and is not covered by the gate."
        responsibility: scope
      - claim: "Three escapes are named and none is closed here."
        responsibility: scope

  predictions:
    - metric: >-
        computed p-adic height of Teichmuller-lifted G-points on
        non-anomalous toy curves, at precisions n = 2..8
      direction: lower
      minimum_effect: >-
        FORCED VALUE 0, with residual below p^{-(n-1)} at every n and
        DECREASING in n. A residual flat in n is a precision artifact; a
        residual growing in n means the implementation diverges.
    - metric: >-
        anomalous-arm scalar recovery
      direction: different
      minimum_effect: >-
        FORCED: exact recovery of k, 100% of trials. Failure halts the line.
    - metric: >-
        correlation between the p-adic regulator and the archimedean
        regulator across toy CM curves of exhibited rank 1-2
      direction: higher
      minimum_effect: >-
        Predicted a monotone relationship with rank correlation above 0.7
        across at least 12 curves, against a shuffled null near 0. NO
        PROPORTIONALITY IS PREDICTED -- the two regulators are genuinely
        different quantities and only their usefulness as a proxy is at issue.
        A correlation indistinguishable from the shuffle closes the surviving
        instrument arm too, and the record would then be a pure negative.
    - metric: >-
        cost ratio: wall clock of the p-adic regulator versus the archimedean
        regulator on the same curves at matched accuracy
      direction: lower
      minimum_effect: >-
        Predicted below 1 (p-adic cheaper) for rank >= 2 at the precisions
        needed. A ratio above 1 removes the instrument's only reason to exist
        and the arm is closed.
    - metric: >-
        the three escapes: number of known constructions realising each
      direction: different
      minimum_effect: >-
        Reported as a table with citations and verification status. "None
        found" is an acceptable and honest entry and must be labelled as a
        search outcome, not as a theorem.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify the quadraticity of the p-adic
      height against a source; if it verifies only up to a linear correction,
      restate the gate as covering both degrees and proceed.
      STAGE 1 (HARD GATE, hours): the anomalous positive control; exact
      recovery of k required before anything else runs.
      STAGE 2 (hours): the forbidden computation on non-anomalous curves at a
      precision ladder; confirm 0 with decaying residual.
      STAGE 3 (hours): the regulator proxy arm on 12+ toy CM curves, with the
      shuffled null.
      STAGE 4 (zero compute): the escape table and the closure statement to
      the inventor-protocol section-4 standard.
    controls:
      - Anomalous curve (positive control; must succeed).
      - Precision ladder (residual must decay in n).
      - Random-value substitution for the height (decoder must fail).
      - Shuffled curve/regulator pairing (correlation must collapse).
      - Torsion-lift versus arbitrary-section comparison, reused from
        IDEA-20260807-cfe576 Step 4.
    required_metrics:
      - p-adic height residual per (curve, point, n)
      - Anomalous recovery rate and recovered k
      - p-adic and archimedean regulators per curve, with accuracies
      - Rank correlation and its shuffled null
      - Wall clock for both regulator computations at matched accuracy
      - Escape table with citations and verification status

  falsification_conditions:
    - >-
      The anomalous control fails to recover k. The p-adic machinery does not
      work; nothing may be reported (AGENTS.md rule 5).
    - >-
      A non-anomalous height is nonzero with a residual that does NOT decay in
      n. Either the implementation is wrong or the object fed to the height is
      not a lifted G-point; diagnose before reporting.
    - >-
      Stage 0 finds that the p-adic height in use is not homogeneous. The gate
      as stated does not cover it, and the record is superseded by one that
      handles the non-homogeneous case -- which is open class (iii) and would
      be a genuinely interesting reopening.
    - >-
      The regulator correlation is indistinguishable from its shuffle. The
      surviving instrument arm closes and the record becomes a pure negative.
    - >-
      The p-adic regulator is slower than the archimedean one. Same
      disposition.

  confounders:
    - >-
      Precision. Every p-adic quantity here is computed to finite precision
      and "0" means "below p^{-(n-1)}". The decay control is what distinguishes
      a proved zero from an under-resolved nonzero.
    - >-
      Which p-adic height. Mazur-Tate, Schneider, and the anticyclotomic/CM
      heights differ in normalisation and in the choice of splitting; every
      number must name its construction, and the gate covers all of them only
      because it uses nothing but homogeneity.
    - >-
      Regulator normalisation. p-adic and archimedean regulators differ by
      construction-dependent factors; only monotone correlation is claimed,
      never proportionality.
    - >-
      Overlap with ECFG-P1543 and with the archived ECDLP-IDEA-109. Declared;
      re-verification in this harness is a check on this implementation, not
      independent confirmation.

  interpretation_limits:
    - >-
      Toy scale for every computation; the gate itself is an algebraic
      statement and is scale-free, which must be stated carefully rather than
      used to imply a crypto-scale result about ECDLP.
    - >-
      This closes ONE construction family (homogeneous p-adic invariants with
      torsion-free targets) and names three escapes it does not close. It is
      not a closure of the p-adic route, of lifting, or of L9.
    - >-
      The anomalous arm is a reproduction of a classical published attack at
      toy scale, used as a control. It is not a new result and must never be
      reported as one.
    - >-
      The surviving instrument arm, if it works, changes a cost-model input
      and produces no attack.

  heuristic_assumptions:
    - id: HEUR-CANL-P1
      statement: >-
        FOR ALL p-adic height constructions used in this lane, the height is
        homogeneous of degree 2 in the group variable on the relevant domain.
      rigorous_support: >-
        Quadraticity is part of the definition of a height pairing in the
        Mazur-Tate and Schneider theories, so under the standard definitions
        this is not a heuristic at all but a definitional fact -- RECALLED,
        NOT READ, and Stage 0 exists to convert it. It is filed as a numbered
        heuristic because the entire record rests on it and because a
        normalisation that adds a linear term would change the statement's
        form (though not, as noted, its conclusion).
      falsification_condition: A source showing the height in use is not homogeneous.
      validation_plan: >-
        Empirical: compute h_p(nP)/n^2 for n = 1..10 on the anomalous curve
        (where h_p is nonzero) and confirm it is constant to precision. That
        is a direct, cheap test of the load-bearing property on the one arm
        where the value is nonzero, and it can fail. TOY SCALE ONLY.
    - id: HEUR-CANL-P2
      statement: >-
        The p-adic regulator is a usable proxy for the archimedean regulator
        in the sense that ordering curves by one orders them by the other, up
        to a bounded number of inversions.
      rigorous_support: >-
        None. There is no general theorem relating the two regulators'
        magnitudes; the p-adic BSD conjectures relate each to its own
        L-value, not to each other. This is a genuinely speculative
        instrumental hypothesis and is labelled so. The classical analogue
        being imitated is the empirical practice of using one regulator as a
        rough size indicator for another in numerical experiments -- which is
        practice, not theory.
      falsification_condition: >-
        Rank correlation indistinguishable from the shuffled null across 12+
        curves.
      validation_plan: >-
        Sample: at least 12 toy CM curves of exhibited rank 1-2, both
        regulators at matched accuracy, three primes each. Predicted
        distribution: monotone relationship with rank correlation above 0.7.
        Tail check: report the largest inversion (the pair most out of order)
        explicitly. TOY SCALE ONLY, and the proxy is not proposed for use at
        any other scale.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT. The route the record closes would, if it worked,
      have been polynomial-time (as the anomalous case is); the gate shows it
      returns 0 instead, which is not a complexity statement but a value
      statement. For the surviving instrument: the p-adic regulator costs
      O(poly(n, log p, r)) against the archimedean regulator's
      high-precision series, and the measured ratio is the record's number.
