idea:
  id: IDEA-20260830-c5c614
  question_id: RQ-FBG-001
  added: '2026-08-30'
  title: >-
    THE ONE DOOR CONSERVATION LEAVES OPEN. KN-FIND-007 forces the mean only when
    the average runs over the WHOLE group; relation collection is free to attempt
    only targets in a set decidable from the target's REPRESENTATION x(R), at the
    cost of one point addition and no discrete logarithm. Measure the yield lift
    and the decomposability precision of a frozen grammar of cheap x-line
    predicates against every geometry, with a random-partition selection null and
    a growth arm, and read off whether the lift decays like N^{-1/2} or survives.
  class: mechanism

  claim: >-
    (A) WHAT IS ALREADY CLOSED, SO THAT THIS IS NOT MISTAKEN FOR IT.
    KN-FIND-007 fixes the mean per-target decomposition yield at
    binom(B+m-1,m)/N for EVERY base of size B, so "structured geometry raises
    mean yield at matched size" is refuted before any experiment. The coverage
    channel is bounded too - the maximum coverage advantage of any base over a
    matched random base is min(1,mu)/coverage_random, at most 1.582 at any N, any
    B, any m and any convention, attained only at mu = 1. Neither channel can
    grow with N. This record proposes NOTHING on either.
    (B) THE ESCAPE, WHICH IS A THEOREM ABOUT THE THEOREM. The conservation double
    count is a statement about the sum over ALL r in G. It says nothing whatever
    about the average of c_D over a proper subset S of G. The red-team probe on
    the frozen battery measured that escape explicitly - on a 1/8-of-group window
    in LOG space the mean ratio is 8.01 while the whole-group ratio is exactly
    1.000000000 - and dismissed it as unusable because selecting r with log(r) in
    S requires knowing log(r), recording that the route becomes live only if the
    target restriction is decidable from the target's REPRESENTATION. That
    conditional has never been tested. This record tests it.
    (C) THE CLAIM, WITH ITS TWO METRICS. Let pi be a predicate computable from
    x(R) in O(1) field operations with no discrete logarithm, let S = pi^{-1}(1)
    have density sigma, and define
    LIFT rho(D, pi, N) = E_{r in S}[c_D(r)] / E_{r in G}[c_D(r)], and
    PRECISION lambda(D, pi, N) = Pr[c_D(r) >= 1 | r in S] / Pr[c_D(r) >= 1].
    Both are unconstrained by conservation; both are computable exactly at toy
    scale; both are directly monetisable, rho as relations per solve attempt and
    lambda as the fraction of doomed solve attempts avoided. The claim is NOT
    that a lift exists - a maximum over a grammar is positive by selection alone,
    which is why the record's primary control is a random-partition null. The
    claim is about SCALING - that for x-line-defined geometries the excess of
    max_pi(rho) over its selection null obeys a power law in N whose exponent is
    the deliverable, and that the pre-registered competing values are -1/2
    (square-root cancellation, the channel is closed with a number attached) and
    0 (the channel survives and RQ-FBG-001 is ALIVE on a realizable channel).
    (D) WHY THIS IS EXPONENT-SHAPED RATHER THAN A CONSTANT. With the target count
    fixed at m!N/B^{m-1} by conservation, relation collection costs
    (m!N/B^{m-1})*(t_solve/rho + t_gen/sigma) and linear algebra costs L(B). At
    m = 3 with L(B) = Theta(B^2) and t_solve = Theta(1) the ledger is
    6N/(rho*B^2) + B^2, minimised at B^4 = 6N/rho, i.e. B = (6N/rho)^{1/4}, with
    total 2*(6N/rho)^{1/2} = Theta((N/rho)^{1/2}). So a SUSTAINED lift
    rho ~ N^delta moves the relation-collection exponent from 1/2 to
    (1 - delta)/2, and a constant lift moves nothing. This is precisely the
    growth clause RQ-FBG-001 asks for, transplanted to the only channel where the
    conservation identity does not pin it.
    (E) NOT CLAIMED. No attack, no break, no speedup, no security consequence. It
    is NOT claimed that a positive lift exists; the expected outcome is decay. It
    is NOT claimed that any recorded yield or coverage verdict is wrong - this
    record measures a quantity those verdicts do not constrain. It is NOT claimed
    that the frozen predicate grammar is exhaustive; a null closes the existential
    over that grammar and over the tested panel and range, and nothing wider.

  mechanism: >-
    WHY A LIFT COULD EXIST AT ALL, STATED AS A CAUSAL ROUTE AND NOT AS A HOPE.
    The map from a factor base to its m-fold sumset is mediated, on the curve, by
    Semaev's (m+1)-th summation polynomial S_{m+1}(x(R), x_1, ..., x_m) = 0,
    which is an ALGEBRAIC relation between the REPRESENTATION of the target and
    the REPRESENTATIONS of the summands. It is not a relation in the exponent
    coordinate. A base defined by an x-line condition - an interval in x, a
    quadratic-residue class, the image of a fixed low-degree map - therefore
    constrains x(R) algebraically, because Sigma_m(D) is the projection of an
    algebraic correspondence applied to a structured box. If that projection is
    biased with respect to any cheap x-line predicate, the bias is BY
    CONSTRUCTION visible from x(R) alone, with no discrete logarithm anywhere.
    For a base sampled uniformly on the x-line the same construction produces no
    bias by symmetry, which is the null. Conservation is blind to all of this
    because the double count is indifferent to WHICH target receives the mass.
    THE LOSSY-PROJECTION TEST, RUN BEFORE ANY EXPERIMENT IS PROPOSED. The tracked
    object is the PUSHFORWARD OF THE COUNT VECTOR ALONG A REPRESENTATION-DECIDABLE
    PARTITION - the k-vector whose j-th entry is the sum of c_D(r) over all
    targets whose representation falls in cell j. It is violently lossy - N
    integers collapse to k - discarding which target was hit, the multiplicity
    profile inside a cell, the base, the curve and the field. It is lossy
    COMPATIBLY with the operation relation collection actually performs, because
    that operation is "generate a fresh R = aP + bQ, evaluate pi(x(R)), and spend
    a solve only if pi holds", which acts on the retained object by selecting a
    cell; the retained cell totals then determine the expected relations per
    solve exactly. The test's sharp edge is that the projection is NON-TRIVIAL
    only for k >= 2 - at k = 1 the single cell is the whole group and the vector
    is pinned to binom(B+m-1,m) by the conservation identity. So k = 1 is exactly
    the "loses nothing, therefore is a change of coordinates" degenerate case,
    and it doubles as the baseline reproduction check.
    WHY THE TWO METRICS ARE NOT THE SAME MEASUREMENT. rho moves with total mass
    and lambda moves with support. A predicate can raise rho while lowering
    lambda by selecting the cells where multiplicity concentrates - which is
    exactly what the H017 small-multiples geometry does globally (coverage ratio
    0.0021 with concentration 1224x). Under a harvest-all solve the payoff is rho;
    under one-relation-per-target it is lambda. Reporting them together is what
    makes the cost consequence readable rather than assertable, and their
    DISAGREEMENT is itself a finding about where a geometry puts its mass.

  novelty_status: unverified

