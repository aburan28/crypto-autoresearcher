  assumptions:
    - >-
      Targets are generated by the attacker as R = aP + bQ with a, b uniform, so
      x(R) is available for free and a rejected target costs one point addition
      plus one predicate evaluation. This is the standard relation-collection
      convention and is what makes a representation-side filter admissible at all.
    - >-
      The counting convention is frozen before the run and identical across arms -
      arity m, whether the base is D or the symmetric D u (-D), and whether
      effective size is nominal or negation-collapsed. Effective size is used
      throughout, since the frozen battery observed a real B' = 92 versus 94
      x-collision at 2^14.
    - >-
      c_D is computed on the group, and a predicate is evaluated on the
      representation x(r). Under the symmetric convention c_D(r) = c_D(-r), so
      c_D descends to the x-line and the pushforward is well defined. Under a
      non-symmetric convention it does not, and the record uses the symmetric one
      for that reason.
    - >-
      Panel arms are constructed by code whose geometry is verified against its
      label before any cell runs, because IDEA-20260829-c6e7a4 shows a live
      harness path whose label and geometry disagree.
    - >-
      Toy scale binds. N <= 2^18, m = 3, generated curves. Nothing is claimed at
      cryptographic scale and the fitted exponent is a trend over four rungs.

  proof_search_map:
    bottleneck: >-
      The WHOLE-GROUP AVERAGING STEP inside the conservation double count. It is
      the single place where geometry independence is forced, and restricting the
      average to a proper, cheaply decidable subset of targets is the only
      identified way to remove it without needing a discrete logarithm.
    baseline_embedding:
      parameter_slice: >-
        k = 1, the trivial one-cell partition. The pushforward is then the single
        number sum_r c_D(r), rho is identically 1 and lambda is identically 1,
        which reproduces KN-FIND-007 exactly. Any k >= 2 partition strictly
        refines it.
      reproduction_check: >-
        Per cell, the sum of the k cell totals must equal binom(B_eff + m - 1, m)
        exactly, with integer-exact counters and deviation required to be exactly
        0 - the same control the frozen battery passed 67784/67784 times. A
        nonzero deviation halts the run as an implementation error and nothing is
        reported.
    observation_collision:
      observable: >-
        The k-vector of cell totals under the frozen representation grammar, and
        the derived pair (rho, lambda).
      distinct_preimage_search: >-
        A collision is exhibited by construction rather than hunted - two bases
        with identical cell-total vectors and different coverage exist whenever
        multiplicity is redistributed WITHIN a cell, so the observable does not
        determine coverage, rank or solve cost, and this record may not be cited
        for any of them. The designed collision on the other side is the pair
        (small-multiples base, matched random base) evaluated under a
        REPRESENTATION grammar - predicted to be indistinguishable - against the
        same pair evaluated under the LOG-SPACE anchor, where RT-4 measured a
        ratio of 8.01. A run in which those two evaluations agree has an
        instrument that cannot see a lift, and its null means nothing.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pushforward of the decomposition-count vector along a partition of
          the x-line that is decidable in O(1) field operations without a
          discrete logarithm.
        predicted_gain: >-
          At m = 3, relation-collection exponent 1/2 -> (1 - delta)/2 if a lift
          rho ~ N^delta is sustained. Predicted delta = 0 with (rho - 1) decaying
          like N^{-1/2}, in which case the gain is zero and the deliverable is
          the measured decay exponent.
    quantifier_order: >-
      THERE EXISTS an x-line-constructible geometry D and a family of
      representation-decidable predicates {pi_N}, with densities sigma_N bounded
      below by a fixed power of N, such that FOR ALL N in the tested range
      rho(D, pi_N, N) >= 1 + c for a fixed c > 0. The witness predicate is
      explicitly ALLOWED to depend on N - that is the honest order and it is
      strictly weaker than a uniform predicate, which is why a positive result
      here would still not be an algorithm. The negative result closes only the
      existential over the frozen grammar, the tested panel and the tested range.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured power-law exponent for max_pi(rho) - 1 over one frozen
        grammar, one six-arm panel and four group sizes at toy scale, with a
        selection null. It can NEVER certify that no predicate outside the
        grammar works, and it can never certify anything about solve cost or
        rank.
      nearby_object_control: >-
        The LOG-SPACE predicate anchor, for which the lift is already known to be
        large (8.01 measured by RT-4) and which is UNREALIZABLE because
        evaluating it needs a discrete logarithm. A method that cannot separate
        the log-space anchor from a representation predicate is measuring the
        wrong coordinate, and the anchor is run at every rung for exactly that
        reason.
    proof_obligations:
      - claim: k = 1 reproduces the conservation identity exactly.
        responsibility: baseline
      - claim: >-
          Cell totals sum to binom(B_eff+m-1,m) with deviation exactly 0 in every
          cell.
        responsibility: correctness
      - claim: >-
          max over a grammar is positively biased and the random-partition null
          measures that bias at the same cell-size profile.
        responsibility: success_probability
      - claim: >-
          The cost ledger total = (m!N/B^{m-1})*(t_solve/rho + t_gen/sigma) + L(B)
          has, at m = 3 with t_solve = Theta(1) and L(B) = Theta(B^2), the
          optimum B^4 = 6N/rho and total 2*(6N/rho)^{1/2}.
        responsibility: runtime
      - claim: >-
          rho <= 1/sigma exactly, by conservation applied to the cell, so an
          arbitrarily large lift requires an arbitrarily selective filter and the
          net gain is capped by the affordable filter density.
        responsibility: strictness
      - claim: >-
          Nothing here is a statement about coverage, rank, solve cost or ECDLP
          hardness, and the record carries that boundary into every citation.
        responsibility: scope

  predictions:
    - metric: >-
        closed-form total check per cell - sum of the k cell totals against
        binom(B_eff + m - 1, m)
      direction: different
      minimum_effect: >-
        FORCED EXACT, deviation exactly 0 with integer counters. Any nonzero
        deviation is an implementation error and halts the battery.
    - metric: >-
        max over the frozen grammar of the yield lift rho for the MATCHED RANDOM
        base, against the random-partition selection null at the same cell-size
        profile
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within the null band at every rung. If the random base's
        max-lift sits above its own selection null, the grammar or the null is
        broken and no other number in the run is readable.
    - metric: >-
        excess of max_pi(rho) over the random-partition null, for the x-line
        geometries, at the smallest rung
      direction: higher
      minimum_effect: >-
        0.02 in the ratio, i.e. a 2% lift above the selection null. Below that it
        is inside the frozen battery's own recorded per-cell resolution of about
        +-0.5% multiplied by the grammar size, and is reported as unresolved
        rather than as an effect.
    - metric: >-
        fitted slope of log(max_pi(rho) - 1 - null) against log N, per geometry
      direction: different
      minimum_effect: >-
        The comparison is pre-registered against TWO named values and no sign is
        pre-committed, because pre-committing would prejudge the exact quantity
        being measured. A fitted interval containing -1/2 and excluding 0 reads
        as square-root cancellation - the channel is closed with an exponent
        attached. An interval containing 0 and excluding -1/2 reads as survival -
        the channel is ALIVE and RQ-FBG-001 is not killed. An interval containing
        both is underpowered and is reported as such, with the required number of
        additional rungs computed and stated.
    - metric: >-
        decomposability precision lambda and the net solve-skipping gain
        lambda / (1 + t_predicate*sigma^{-1}/t_solve)
      direction: higher
      minimum_effect: >-
        1.05 net of the measured predicate and regeneration cost at any rung. A
        net gain below 1.0 means the filter costs more than it saves and the
        recognizability channel is closed at these parameters.
    - metric: >-
        LOG-SPACE anchor lift on the small-multiples base at a 1/8 window
      direction: higher
      minimum_effect: >-
        4.0, against the value 8.01 recorded by RT-4 at N = 1009 and B = 19. This
        is an instrument check, not a finding; falling below 4.0 means the
        apparatus cannot see a lift that is known to be there.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE. Freeze the predicate grammar and the
      panel in the contract before any cell runs. Grammar - (g1) the top k bits
      of x(r) for k = 1,2,3, giving 2,4,8 cells; (g2) the quadratic-residue class
      of x(r); (g3) the bottom k bits of x(r) for k = 1,2,3; (g4) x(r) in a
      declared high-bit interval matching the high_bit_interval geometry's own
      interval; and (a5) the ANCHOR, the top 3 bits of log(r), which is
      unrealizable and exists only for calibration. Panel - matched random
      (null), high_bit_interval, small_height, coset_union, multiplicative coset,
      and the H017 small-multiples base (log-space, the anchor's positive
      control). Verify each arm's constructed geometry against its label from the
      source, per IDEA-20260829-c6e7a4.
      STAGE 1. At N ~ 2^12, 2^14, 2^16, 2^18 with B = ceil((6N)^(1/3)) and m = 3
      under the symmetric convention, compute the COMPLETE count vector c_D over
      the group by exact enumeration for each arm - the same O(B^3/6 + N)
      computation the frozen battery ran at about 5e5 operations per cell.
      STAGE 2. For each arm and each grammar member, form the cell totals and the
      cell supports, and compute rho and lambda per cell class. Run the
      closed-form total check per cell and halt on any nonzero deviation.
      STAGE 3, THE CONTROL THAT MAKES OR BREAKS THE RUN. For each arm and each
      cell-size profile, draw 1000 RANDOM partitions of the target set with the
      identical cell sizes and recompute max rho and max lambda, giving the
      selection-null distribution of a maximum over a grammar of that shape.
      Report every effect as an excess over that null with its band, never as a
      raw maximum.
      STAGE 4. Fit log(excess) against log N per geometry, report the slope with
      its interval under one Holm correction across the panel, and compare
      against the two pre-registered values -1/2 and 0.
      STAGE 5. Instrument t_predicate, t_gen and t_solve in the same process and
      recompute the admissible filter density floor from the MEASURED ratio,
      replacing the second-hand EV-R6-001 figures.
      ENVELOPE. Exact enumeration at 2^18 with B = 117 is about 5e5 operations
      per cell; six arms times four rungs times four curves times four seeds plus
      1000 random partitions per cell is dominated by the partition null at
      O(N * partitions) per cell, a few core-hours in total. Peak memory is one
      length-N count vector per arm, under 500 MB at 2^18, and is reported. No
      Groebner basis is built anywhere in Stages 1-4, so this cannot meet the
      GOAL-DREG-001 memory wall; Stage 5 runs solves only for timing, under a
      declared wall-clock cap, and a cap hit is an infrastructure stop under
      AGENTS.md rule 3 and never negative evidence.
    controls:
      - >-
        MATCHED RANDOM BASE at identical negation-collapsed effective size, drawn
        in the same invocation at every rung. The null geometry.
      - >-
        RANDOM-PARTITION SELECTION NULL at the identical cell-size profile,
        1000 draws per cell. BLOCKING - without it a maximum over a grammar is
        uninterpretable and every reported effect is selection bias.
      - >-
        LOG-SPACE ANCHOR on the small-multiples base, which must reproduce a
        large lift against the RT-4 reference of 8.01. An instrument that cannot
        see a known lift cannot report its absence.
      - >-
        CLOSED-FORM TOTAL CHECK per cell, deviation required to be exactly 0,
        reproducing the frozen battery's 67784/67784 standard on a new axis.
      - >-
        k = 1 BASELINE SLICE per cell, which must return rho = lambda = 1
        identically, reproducing KN-FIND-007.
      - >-
        THREE MATCHED-NULL DEFINITIONS reported per IDEA-20260816-5ea9b4 - nominal
        size, negation-collapsed effective size, and matched total multiset count -
        so a lift cannot be manufactured by the null's definition.
    required_metrics:
      - exact count vector and cell totals per arm, per rung, per grammar member
      - rho and lambda per cell class, with bootstrap intervals
      - random-partition null distribution of max rho and max lambda per profile
      - excess of max rho over the selection null, with band, per arm per rung
      - fitted slope of log(excess) vs log N per arm, with Holm-corrected interval
      - closed-form total residual per cell, required 0
      - k = 1 baseline slice values, required 1
      - log-space anchor lift on the small-multiples base per rung
      - measured t_predicate, t_gen, t_solve and the derived admissible sigma floor
      - negation-collapse fraction and effective size per arm
      - peak RSS and wall time per rung

  falsification_conditions:
    - >-
      Any cell's totals fail to sum to binom(B_eff+m-1,m). Implementation error;
      the battery halts and nothing is reported.
    - >-
      The k = 1 slice returns anything other than rho = lambda = 1. The pipeline
      contradicts a committed identity and is wrong.
    - >-
      The matched random base's max lift exceeds its own random-partition null
      band at any rung. The selection null is miscalibrated and no effect in the
      run is readable.
    - >-
      The log-space anchor fails to show a large lift on the small-multiples
      base. The instrument is blind and its nulls mean nothing.
    - >-
      Every x-line geometry's max-lift excess lies inside the selection null band
      at every rung. THE REPRESENTATION-SIDE CHANNEL IS CLOSED over the frozen
      grammar, the tested panel and the tested range - the expected outcome, and
      the deliverable is the measured band with its scaling, a bounded obstruction
      with a number, not a verdict.
    - >-
      The fitted slope interval contains 0 and excludes -1/2 for any x-line
      geometry. The channel SURVIVES with N and RQ-FBG-001's growth clause is met
      on a realizable channel - the alive branch of the decision target.
    - >-
      The net solve-skipping gain is below 1.0 at every rung once predicate and
      regeneration costs are charged. The recognizability half is closed at these
      parameters even if lambda exceeds 1.

  confounders:
    - >-
      SELECTION BIAS OF A MAXIMUM OVER A GRAMMAR. The dominant confounder by a
      wide margin - with 10 grammar members and 8 cells, a maximum over roughly
      30 statistics is biased upward by an amount comparable to every excess this
      program has ever recorded on the coverage channel. The random-partition
      null is the only control that removes it and it is therefore blocking.
    - >-
      SMALL-CELL VARIANCE. A cell with expected total below 30 has a relative
      standard deviation that swamps a 2% effect; cells below that threshold are
      pooled by a rule frozen in Stage 0, never after seeing results.
    - >-
      PREDICATE COST IS NOT FREE. A predicate needing a y-coordinate, a square
      root or a Legendre symbol costs more than a point addition, and charging it
      is what turns lambda into a gain or a loss. Every predicate carries an
      instrumented cost in field operations.
    - >-
      THE x-LINE IS SMALL AT TOY SCALE. At N ~ 2^12 an 8-cell partition of x has
      about 500 targets per cell, so the grammar's resolution and the group size
      move together across the ladder and a fitted slope confounds them. The
      contract holds the grammar fixed in BIT DEPTH rather than in absolute cell
      count and reports both.
    - >-
      GEOMETRY-PREDICATE ALIGNMENT BY CONSTRUCTION. Grammar member g4 uses the
      same interval as the high_bit_interval geometry, which is deliberate and is
      the most likely place to see a lift - and also the place where a lift is
      least surprising and least transferable. It is reported separately from the
      geometry-agnostic members.
    - >-
      ARM CONSTRUCTION MAY NOT MATCH ITS LABEL. IDEA-20260829-c6e7a4 documents a
      live harness path whose label and geometry disagree. Stage 0's source-level
      verification exists for this and is a hard gate.

  interpretation_limits:
    - >-
      A measured lift is NOT a speedup and NOT an attack. No solve is
      accelerated, no relation is collected, no discrete logarithm is computed.
      The cost ledger in the claim is arithmetic over a cost model, not a
      measurement of a running algorithm.
    - >-
      A null closes the existential over ONE frozen grammar, ONE panel and ONE
      range. It says nothing about predicates outside the grammar, and the
      grammar is small and hand-chosen.
    - >-
      Toy scale, four rungs, N <= 2^18. A fitted exponent over four points with a
      Holm correction is a trend with a wide interval, not an asymptotic rate,
      and may not be quoted as one.
    - >-
      This record measures neither coverage nor rank nor solve cost, and may not
      be cited about any of them. Its observable provably fails to determine them.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the nearest records
      read; one WebSearch was run and NOTHING was fetched or read. Honest status
      is unverified, and the specific open question a reviewer should chase is
      whether any published ECDLP index-calculus analysis already restricts the
      target set by a condition on the target's representation.

  heuristic_assumptions:
    - id: H1
      statement: >-
        X-LINE ADDITIVE PSEUDORANDOMNESS. For a factor base D of size B defined
        by an x-line condition on E/F_p with a point P of prime order N, for
        arity m fixed, and for any cell C of a representation-decidable partition
        with density sigma bounded below by N^{-1/4}, the cell total satisfies
        sum_{r in C} c_D(r) = sigma * binom(B+m-1, m) * (1 + O(N^{-1/2+eps}))
        for every eps > 0, uniformly over the cells of the frozen grammar.
        Equivalently, max_pi(rho) - 1 decays like N^{-1/2+o(1)} once the
        selection null is removed.
      rigorous_support: >-
        The RIGOROUS half is the conservation identity itself - the sum of the
        cell totals is binom(B+m-1,m) exactly, with no error term, so the only
        free quantity is how that fixed mass distributes and the deviations are
        constrained to cancel. The CLASSICAL DISTRIBUTION STATEMENT IMITATED is
        Weil-type square-root cancellation for character sums along a curve over
        F_p (the Weil bound and its Bombieri generalisation to curves), applied to
        the correspondence cut out by Semaev's summation polynomial. The gap,
        stated plainly - the Weil bound applies to complete character sums over
        the full curve, whereas the object here is an incomplete sum over the
        image of a structured box, so the citation gives the SHAPE of the
        expected cancellation and not a theorem covering this case. That gap is
        exactly why the assumption is a heuristic and is the thing being measured.
      validation_plan: >-
        SAMPLE - the complete cell-total vector for every arm at N ~ 2^12, 2^14,
        2^16, 2^18, by exhaustive enumeration over the whole group, so there is
        NO sampling error at all and the only uncertainty is across curves and
        seeds (four curves times four seeds per rung, matching the frozen
        battery's design). COMPARISON DISTRIBUTION - the normalised deviations
        (cell total - sigma * total) / sqrt(sigma * total) against a standard
        normal, per rung and per grammar member, by Kolmogorov-Smirnov at the 1%
        level, and the maximum absolute deviation against the N^{-1/2} envelope.
        TAIL CHECKS - (a) the single most deviant cell at each rung against the
        max-of-k Gaussian order statistic for that grammar size; (b) the
        variance-to-mean ratio of cell totals, whose departure from 1 measures
        the algebraic dependence the assumption ignores, reported alongside every
        lift rather than smoothed; (c) the fitted decay exponent with its interval
        against the predicted -1/2. TRANSFER ASSUMPTIONS - none. Nothing above
        2^18 is claimed, the four generated curves per rung are not standardised
        curves, and the fitted exponent is reported as a toy-scale trend.
    - id: H2
      statement: >-
        FILTER AFFORDABILITY. At the harness's own m = 3 parameters, the cost of
        generating and testing one candidate target - one point addition plus one
        predicate evaluation - is at most 10^{-3} of the cost of one decomposition
        solve attempt, so a filter of density sigma >= 10^{-3} adds at most 100%
        to relation-collection cost and a filter of density sigma >= 10^{-2} adds
        at most 10%.
      rigorous_support: >-
        NO rigorous bound and no classical distribution theorem - this is an
        ENGINEERING RATIO and is labelled as one rather than dressed up. Its only
        support is the second-hand EV-R6-001 figure that a chained-Semaev m = 3
        solve runs 2.0e4..1.5e5 times slower than a Pollard rho solve on the same
        instance, which places one solve many orders of magnitude above one point
        addition. Recording it as a numbered assumption rather than as prose is
        the point, because the entire monetisation of rho and lambda rests on it
        and it is the cheapest thing in the design to measure directly.
      validation_plan: >-
        SAMPLE - instrument t_gen, t_predicate and t_solve in the SAME process on
        the SAME machine at every rung, over at least 200 solve attempts per rung
        including failures, since a failed solve is the one being skipped and may
        cost differently from a successful one. COMPARISON - report the ratio
        distribution rather than a point estimate, with its inter-quartile range
        across cells and curves. TAIL CHECK - the fastest observed solve against
        the slowest observed generate-and-test, because the affordability claim is
        governed by the worst case of that pair, not by the medians. TRANSFER -
        none; the ratio is machine-, implementation- and parameter-specific, and
        the admissible sigma floor is recomputed from the measurement rather than
        assumed. If the measured ratio is below 10^3 the grammar's low-density
        members are dropped before any gain is quoted.

  target_complexity:
    time_exponent: >-
      NO WORKING ALGORITHM AND NO EXPONENT IS CLAIMED. The exponent arithmetic is
      stated so the measurement can be read as a cost rather than as a curiosity.
      Relation collection costs (m! N / B^{m-1}) * (t_solve/rho + t_gen/sigma) and
      linear algebra L(B); the target count m!N/B^{m-1} is EXACTLY
      geometry-invariant by KN-FIND-007. At m = 3 with L(B) = Theta(B^2) and
      t_solve = Theta(1), the ledger 6N/(rho*B^2) + B^2 is minimised at
      B^4 = 6N/rho with total 2*(6N/rho)^{1/2} = Theta((N/rho)^{1/2}). Hence a
      sustained lift rho ~ N^delta moves the exponent 1/2 -> (1 - delta)/2, and a
      constant lift moves nothing. THE PREDICTED OUTCOME IS delta = 0. The
      measurement's job is to produce delta with an interval, not to produce an
      algorithm.
    memory_exponent: >-
      For the measurement - O(N) counters, one length-N count vector per arm,
      under 500 MB at 2^18, reported per run. For the hypothetical algorithm the
      filter itself is O(1) memory, which is its one attractive property - it
      trades time for time and adds no table.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) group operations with O(1) memory is the
      frontier for prime-field ECDLP and this record proposes nothing that
      approaches it. Within index calculus the corpus's own measured position is
      EV-R6-001's m = 3 chained-Semaev solve at 2.0e4..1.5e5x SLOWER than rho, so
      even delta = 1/2 would leave the method far behind the frontier. On the
      quantity actually measured - the lift of a representation-decidable target
      filter - there is no incumbent measurement anywhere in this repository.
    hidden_overhead: >-
      Three disclosures. FIRST, the ledger charges t_solve = Theta(1); at real
      parameters the Semaev solve is superpolynomial in B and that, not yield, is
      where the method dies - so delta > 0 would be necessary and nowhere near
      sufficient. SECOND, rho <= 1/sigma exactly by conservation applied to the
      cell, and 1/sigma is capped by the affordable filter density from H2, which
      is a MACHINE CONSTANT, not an asymptotic quantity - so a sustained N^delta
      lift additionally requires sigma to shrink with N and the affordability
      assumption to survive that shrinkage, which H2 does not currently cover.
      THIRD, the fitted delta is an exponent estimated from four toy rungs and
      its interval will be wide; quoting it without the interval would be the
      single most likely way this record gets misused.
    tradeoff_note: >-
      The filter is a pure time-time trade with no memory cost - 1/sigma extra
      point additions bought against 1/rho of the solves - and target generation
      is embarrassingly parallel, so it composes with van Oorschot-Wiener style
      parallelisation without interaction and without a table. That is its one
      structural advantage over every coverage-side idea in this bucket, which is
      why it is worth measuring even with a predicted null.

  dominated_by: >-
    CHECKED ROW BY ROW, NOT ASSERTED. AS AN ATTACK - dominated by every row on
    every axis, since none is mounted. Pollard rho (0.886*sqrt(N) time, O(1)
    memory), BSGS, van Oorschot-Wiener parallel rho, and the corpus's own m = 3
    chained-Semaev index calculus at 2.0e4..1.5e5x rho all dominate it on time,
    memory and data. AS A YIELD STATEMENT - strictly dominated by KN-FIND-007,
    which settles the whole-group case exactly and which this record does not
    contest. AS A COVERAGE STATEMENT - dominated by the min(1,mu)/coverage_random
    envelope and its 1.582 maximum, which this record does not contest either. AS
    A MEASUREMENT OF THE RESTRICTED-TARGET CHANNEL - RT-4 measured one LOG-SPACE
    window at one (N, B) and explicitly left the representation-decidable case
    untested, and RT-11 names sumset recognizability as open; there is no prior
    row on this axis, so nothing dominates it there and it displaces nothing.
    Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis - no attack, no algorithm, no exponent moved.
    QUANTIFIED DELIVERABLE - converts one sentence in an uncommitted red-team
    objection ("a real, untested, open channel") into (i) a measured decay
    exponent for max_pi(rho) - 1 over a frozen 10-member grammar, a six-arm
    panel and four group sizes, with a 1000-draw random-partition selection null,
    (ii) a measured net solve-skipping gain for the recognizability half with the
    predicate and regeneration costs charged, and (iii) the exponent arithmetic
    total = 2*(6N/rho)^{1/2} at m = 3, which states exactly how large a lift
    would have to be before it mattered. Prior state on this axis - zero measured
    values.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Exact enumeration is the frozen battery's own O(B^3/6 + N), about 5e5
      operations per cell at 2^18. The dominant term is the random-partition
      selection null at 1000 partitions times O(N) per cell, giving a few
      core-hours across six arms, four rungs, four curves and four seeds.
      Implementation is medium because the grammar, the pushforward accounting
      and the selection null are new code, though they sit on the existing exact
      counter.
  recommended_priority: high

  status: proposed
  proposed_by: idea-generator
