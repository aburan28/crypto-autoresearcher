idea:
  id: IDEA-20260807-3c6bd8
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    THE PRICE OF KNOWING YOUR LEVEL, AUDITED IN THREE PARTS: v_ell(c) is
    computable in O(log^2 p) bit operations WITHOUT ANY FACTORIZATION for every
    odd ell; the discriminant t^2-4p is only about as large as p by Hasse, so
    even its full factorization is routine at 256-bit crypto scale rather than
    a barrier; and the actual bottleneck in endomorphism-ring computation is
    WALKING THE VOLCANO AT LARGE ell -- which relocates the obstruction and
    removes "level determination is too expensive" as a reason to dismiss this
    lane
  class: measurement

  claim: >-
    (A) PART ONE -- THE HEIGHT IS FREE, PER ell, WITH NO FACTORING. Let
    D = t^2 - 4p = c^2 D_K with D_K fundamental. For every ODD prime ell,
    v_ell(D_K) is 0 or 1, because a fundamental discriminant is squarefree or
    four times a squarefree number and the factor of four is invisible at odd
    ell. Hence
      v_ell(D) = 2 v_ell(c) + v_ell(D_K)  =>  v_ell(c) = floor(v_ell(D) / 2).
    So THE HEIGHT OF THE ell-VOLCANO IS OBTAINED BY REPEATED DIVISION BY ell
    ALONE, in O(log_ell(D)) divisions, i.e. O(log^2 p) bit operations, WITHOUT
    factoring D and without knowing D_K. At ell = 2 the same method works with a
    case split, since v_2(D_K) is in {0, 2, 3}: v_2(D) odd forces v_2(D_K) = 3;
    v_2(D) even leaves {0, 2}, resolved in O(1) by testing D / 4^k mod 4. The
    2-adic case is stated explicitly rather than swept into the odd-ell formula,
    because getting it wrong silently mislabels every 2-volcano.

    (B) PART TWO -- THE DISCRIMINANT IS SMALL, AND THIS CORRECTS A STANDING
    FRAMING IN THIS PROGRAM. By Hasse, t^2 <= 4p, so
      |D| = |t^2 - 4p| = 4p - t^2 <= 4p.
    D IS ABOUT THE SAME BIT LENGTH AS p, NOT TWICE IT. For a 256-bit p, D is at
    most about 258 bits. Factoring a 258-bit integer is routine by any modern
    method and is far below the sizes in the public factoring record (RECALLED,
    PUBLIC RECORD, CITATION NOT VERIFIED IN THIS CORPUS: RSA-155 at 512 bits was
    factored in 1999 and RSA-250 at 829 bits in 2020; verifying these against a
    primary source is Stage 0 of the minimal test, and the conclusion does not
    depend on the exact figures, only on 258 << 512). CONSEQUENCE:
    IDEA-20260726-010 asserts that detecting a large square part of t^2 - 4p
    "requires extracting the square part of a p-sized integer, which is
    factoring-hard, so such curves are not excluded by standard curve-generation
    hygiene". The premise that the integer is p-sized is correct; the inference
    that this is hard AT DEPLOYED SIZES is what this audit disputes, because
    p-sized means 258 bits for a 256-bit curve, not 2^258 work. If this audit is
    right, hidden-CM curves ARE detectable by anyone willing to run a
    factorization, and the curve-generation-hygiene argument in that record needs
    restating. Either outcome is a deliverable and the record is cited, not
    contradicted from memory.

    (C) PART THREE -- WHERE THE COST ACTUALLY IS. Knowing the HEIGHT v_ell(c) is
    not knowing the LEVEL v_ell(f_E). The level requires locating E in the
    volcano, which needs rational ell-isogeny counting and Fouquet-Morain
    descent: O(ell * h) isogeny computations per level identification and
    O(ell * h^2) in total, where each isogeny computation needs either the
    ell-division polynomial (degree (ell^2-1)/2) or the modular polynomial
    Phi_ell (size O(ell^3) coefficients). This is POLYNOMIAL IN ell BUT
    EXPONENTIAL IN log ell, so:
      - ell small (say ell <= 10^4): the level is CHEAP, polynomial in log p.
      - >-
        ell large (up to c ~ sqrt(p), so ell can have 100+ bits): the level is
        INFEASIBLE by this route, because Phi_ell cannot be built.
    THE OBSTRUCTION IS THEREFORE RELOCATED. It is not the factorization of D and
    it is not the height; it is the LARGE-ell WALK. That is exactly why the
    published endomorphism-ring algorithms are subexponential rather than
    polynomial (KN-LIT-251 Bisson-Sutherland 2009, KN-LIT-309 Bisson 2011 --
    both in this corpus with abstracts read and FULL TEXTS NOT READ; the second
    reports a subexponential runtime under GRH alone, and the first reports a
    bound depending primarily on log|D_E|).

    (D) THE DISCRIMINATION, STATED BEFORE MEASURING. Two competing accounts of
    why lane L2 might be a dead end:
      (C1) COST: "any attack needing the volcano level must pay subexponential
        endomorphism-ring computation, so the lane is dead on cost even if depth
        matters."
      (C2) INVISIBILITY: "the level is cheap to obtain but carries no usable
        information, because on G every endomorphism is a scalar (H-ENDO-001) and
        every vertical isogeny is an isomorphism (IDEA-20260807-5cabfc)."
    These are different closures with different forward guidance, and the field
    would treat them very differently. This audit decides between them for the
    SMALL-ell regime, and the argument above already predicts C2: small-ell
    levels are cheap, so cost is not the obstruction there and any negative in
    this lane must be attributed to invisibility. For the LARGE-ell regime the
    audit predicts C1 and quantifies where the crossover lies.

  resource_label: 'audit: consumes no resource (cost accounting for R3/R4 acquisition)'
  admissibility: admissible
  admissibility_argument: >-
    An audit consumes no resource. Its output is a price list for the R3 and R4
    resources other proposals want to consume, so that no proposal in the batch
    may quote the volcano level as if it were free. Nothing here touches G, so
    the admissibility filter is passed trivially; the audit's value is precisely
    that it prevents an inadmissible cost model from being smuggled into an
    admissible mechanism.

  discriminated_from:
    - >-
      IDEA-20260726-010 (hidden-CM density and floor hardness). That record uses
      the factoring-hardness of extracting the square part of t^2 - 4p as an
      argument that hidden-CM curves could be deployed unknowingly. This record
      AUDITS that argument quantitatively via the Hasse bound and predicts it
      does not hold at 256-bit scale. It shares the object and disputes the cost
      model, which is the discrimination.
    - >-
      IDEA-20260807-bb03d3 (B-rough ascent). That record uses the small-ell
      cheapness established here to build a normal-form ALGORITHM. This record
      establishes the price and the crossover; bb03d3 spends it. They are
      deliberately separated so that the cost claim can be falsified without
      taking the algorithm down with it.
    - >-
      IDEA-20260807-4f43ac (certificate asymmetry and amortization). That record
      concerns the FULL endomorphism ring, verification versus computation, and
      multi-instance amortization. This record concerns per-ell acquisition cost
      and the location of the bottleneck. Together they give the complete price
      list; neither implies the other, since a cheap computation can still have
      an expensive certificate and vice versa.
    - >-
      KN-LIT-251 and KN-LIT-309. Those are the published subexponential
      algorithms for the FULL ring. This audit does not improve them, does not
      claim to, and explicitly attributes the subexponentiality to the large-ell
      walk rather than to any step this audit could remove.

  object_first_candidate:
    tracked_object: >-
      THE COST TRIPLE (cost of the height v_ell(c), cost of the level
      v_ell(f_E), cost of the full conductor f_E), tracked as a function of
      (log p, ell) rather than as a single number.
    lossiness: >-
      LOSSY in the sense that matters for an audit: the triple discards every
      mathematical property of the curve and retains only three cost functions.
      It is not a change of coordinates -- from the triple one cannot recover
      the level, let alone the curve. COMPATIBILITY: the three components compose
      additively along an algorithm's execution, so the retained quantity
      propagates deterministically under "run one more step", which is the only
      operation a cost model needs to respect.
    propagation: >-
      Additive along algorithm steps, and separable in ell: the total cost of
      learning the level vector below B is the sum over ell <= B of the per-ell
      costs, with no cross terms. That separability is the audit's structural
      claim and is what makes the crossover in ell well defined.
    survival_score: >-
      Survives until ell grows past the point where Phi_ell or psi_ell can be
      constructed. That death point IS the deliverable: the audit's job is to
      locate it, in bits, rather than to survive it.

  mechanism: >-
    STEP 1 -- PROVE PART ONE AND CHECK IT EXHAUSTIVELY AT TOY SCALE. Implement
    v_ell(c) = floor(v_ell(D)/2) for odd ell and the 2-adic case split. For
    >= 10^5 random (p, t) pairs at toy sizes, compute v_ell(c) BOTH ways -- by
    the formula and by fully factoring D and extracting D_K -- and require exact
    agreement on 100 percent of cells. Disagreement falsifies Part One.
    STEP 2 -- MEASURE THE FACTORING COST HONESTLY. For a ladder of p from 2^16 to
    the largest feasible in pure Python, measure the wall time of sympy.factorint
    on D and record the largest prime factor of c. Then state the crypto-scale
    extrapolation as an ARGUMENT from the Hasse bound plus the public factoring
    record, NOT as an extrapolation of the measured Python timings, which would be
    meaningless. The record must say which of its numbers are measured and which
    are argued, in the same sentence.
    STEP 3 -- MEASURE THE WALK COST. For ell in {2, 3, 5, 7, 11, 13}, measure
    isogeny computations and wall time to determine v_ell(f_E) by Fouquet-Morain
    descent, as a function of ell and h. Fit against the predicted O(ell * h^2)
    and report the fitted exponent in ell rather than assuming it.
    STEP 4 -- LOCATE THE CROSSOVER. Combine: for each ell, the total cost of
    learning v_ell(f_E) is (height cost, negligible) + (walk cost, ~ell*h^2
    isogenies) + (isogeny construction cost, dominated by psi_ell of degree
    (ell^2-1)/2 or by Phi_ell of size O(ell^3)). Report the largest ell for which
    the level is obtainable within a stated budget, and compare with the largest
    ell that can divide c, which is bounded by c <= 2 sqrt(p)/sqrt(|D_K|).
    STEP 5 -- THE C1/C2 VERDICT. State, per ell regime, whether the lane's
    obstruction is cost or invisibility, and record it so that no later closure in
    this lane may name the wrong obstruction.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "factoring", "factoring-hard", "conductor", "subexponential",
      "Bisson", "Sutherland", "endomorphism ring". Read in full: KN-LIT-251,
      KN-LIT-309 (both abstract-level entries), KN-LIT-360, IDEA-20260726-010,
      IDEA-20260805-38aebb, DECOMPOSITION.md, H-ECTD-19017a.
    results: >-
      "Bisson": 2 literature records (KN-LIT-251, KN-LIT-309), both flagged
      "Entry generated during the 2026-07-24 bulk seeding pass ... claims are
      relayed from the paper's abstract without independent verification".
      "factoring-hard" in ledger/: the single substantive hit is
      IDEA-20260726-010. NO record in this repository states the Hasse bound on
      |t^2 - 4p| in a cost context, states the v_ell(c) = floor(v_ell(D)/2)
      shortcut, or locates the endomorphism-ring bottleneck at large ell.
      H-ECTD-19017a's assumptions list "Kohel-style volcano identification (trace
      t, discriminant D_pi = t^2 - 4p, its square-free/conductor factorization)"
      as an assumption with no cost attached, which is precisely the gap this
      audit fills for the experiment that record already has approved.
    verdict: >-
      ADAPTATION. Every ingredient is elementary: the Hasse bound, the
      squarefree-part argument, the cost of modular polynomials. The adaptation is
      the assembly into a three-part price list, the correction it proposes to a
      standing record's cost framing, and the C1/C2 discrimination. No external
      novelty is claimed and none was checked; a published version of the same
      accounting would be an ingredient, not a loss.

  null_object_control: >-
    (N1) THE BRUTE-FORCE ORACLE NULL, blocking: the formula-based v_ell(c) is
      checked against full factorization of D on every toy instance. The
      "cheap" method must agree with the "expensive" method on 100 percent of
      cells, or the cheapness is illusory.
    (N2) THE RANDOM-INTEGER NULL: run the identical v_ell shortcut on random
      integers of the same bit length that are NOT of the form t^2 - 4p. The
      formula must FAIL there (it has no reason to hold, since a random integer's
      squarefree part is unconstrained), demonstrating that the shortcut uses the
      discriminant structure rather than being a generic identity. An instrument
      that "works" on random integers is not measuring what it claims.
    (N3) THE SUPERSINGULAR NULL: supersingular curves over F_p have t = 0 and
      D = -4p, so c is essentially 1 or 2 and there is no volcano in the ordinary
      sense. The pipeline must report the degenerate structure rather than
      inventing levels.
    DECAY PARAMETER: log p. The claimed cost of the height must grow as O(log^2 p)
    and the claimed cost of the level as O(ell * h^2) with h = O(log p). A
    measured cost that does NOT grow with log p at all is an artifact of caching
    or of a degenerate instance family; a measured cost that grows faster than the
    model is a refutation of the model and must be reported as one.

  assumptions:
    - >-
      A fundamental discriminant is squarefree or four times a squarefree number.
      RECALLED, standard; checked directly on every toy instance in Step 1 by
      factoring, so the audit does not rest on the recollection.
    - >-
      Kohel: the ell-volcano has height v_ell(c). RECALLED, UNVERIFIED
      (KN-LIT-360, not read); verified empirically by isogeny counting.
    - >-
      The public factoring record figures in claim (B) are RECALLED and NOT
      VERIFIED in this corpus. They are used only to support "258 bits is far
      below the record", a conclusion robust to substantial error in the figures.
      Verification is Stage 0.
    - >-
      Modular polynomial size O(ell^3) and division polynomial degree
      (ell^2-1)/2. RECALLED, standard; the audit measures the actual construction
      cost at small ell rather than assuming the asymptotics bind there.
    - >-
      Crypto-scale statements in this record are ARGUED from bit lengths and
      published records, never extrapolated from pure-Python toy timings. Any
      sentence mixing the two is a defect.

  proof_search_map:
    bottleneck: >-
      The construction of an ell-isogeny at large ell -- concretely, building
      psi_ell (degree (ell^2-1)/2) or Phi_ell (size O(ell^3)). Removing that step
      is what would make the full endomorphism ring polynomial, and it is the
      exact reason the published algorithms are subexponential.
    baseline_embedding:
      parameter_slice: >-
        ell = 2 and ell = 3 reproduce the classical hand computation: the
        2-isogeny kernel is a root of x^3 + ax + b and the 3-isogeny kernel a root
        of psi_3 = 3x^4 + 6ax^2 + 12bx - a^2. The audit's cost model must
        reproduce the measured cost at those two values before its extrapolation
        in ell is credited.
      reproduction_check: >-
        Frozen fixture: a curve with known 2- and 3-volcano structure, level
        determined by hand, cost measured. Exact agreement of the level; measured
        cost within a factor 2 of the model.
    observation_collision:
      observable: >-
        The integer v_ell(c) as returned by the shortcut.
      distinct_preimage_search: >-
        REQUIRED: find two discriminants D, D' with the same v_ell(D) but
        different v_ell(c). By the argument in (A) this is IMPOSSIBLE for odd ell
        and POSSIBLE at ell = 2 if the case split is omitted. The search is
        therefore a direct test of whether the 2-adic case split has been done
        correctly, and it is expected to succeed exactly when the implementation
        is wrong.
    constructive_transforms:
      - >-
        transform: specialization_pack
        proposed_object: >-
        Decompose "the cost of knowing End(E)" into per-ell blocks that are
        provably disjoint (the ell-parts of the conductor are independent) and
        charge each separately, rather than charging one aggregate
        subexponential figure.
        predicted_gain: >-
        Converts an aggregate "subexponential, therefore expensive" into a
        per-ell schedule with an explicit crossover, so an attack that needs
        only ell <= B pays polynomial and can say so.
    quantifier_order: >-
      CLAIMED: FORALL ordinary E/F_p and FORALL ODD primes ell, v_ell(c) equals
      floor(v_ell(t^2 - 4p)/2), computable in O(log^2 p) bit operations with no
      factorization. Uniform, unconditional, no exceptions.
      SEPARATELY: FORALL ell, THERE EXISTS an algorithm computing v_ell(f_E) in
      O(ell * h^2) isogeny computations. The dependence on ell is polynomial in
      ell and therefore EXPONENTIAL IN log ell -- stating it as "polynomial"
      without that qualifier is the error this record exists to prevent.
      NOT CLAIMED: that f_E is computable in polynomial time. It is not, by any
      method known to this record.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The height of every small-ell volcano is free, the discriminant is
        p-sized so its factorization is routine at deployed sizes, and the
        endomorphism-ring bottleneck is the large-ell walk." It can NEVER certify
        that End(E) is computable in polynomial time, and it improves no published
        algorithm.
      nearby_object_control: >-
        A CLASS WHERE c IS A SINGLE LARGE PRIME. Then there is no small-ell
        structure at all, every level is at a single huge ell, and the audit's
        cheap route gives nothing. The method must be seen to fail there. A cost
        model that claimed cheapness for that class would have proved too much.
    proof_obligations:
      - >-
        claim: v_ell(D_K) in {0,1} for odd ell.
        responsibility: correctness
      - >-
        claim: v_ell(c) = floor(v_ell(D)/2) for odd ell.
        responsibility: correctness
      - >-
        claim: The ell = 2 case split is complete and correct.
        responsibility: correctness
      - >-
        claim: |t^2 - 4p| <= 4p by Hasse.
        responsibility: size
      - >-
        claim: Level determination costs O(ell * h^2) isogeny computations.
        responsibility: runtime
      - >-
        claim: The bottleneck is large-ell isogeny construction.
        responsibility: feasibility
      - >-
        claim: Crypto-scale statements are argued, not extrapolated from toy timings.
        responsibility: scope

  predictions:
    - >-
      metric: >-
      agreement between formula-based v_ell(c) and factorization-based v_ell(c)
      over >= 10^5 random toy (p, t) pairs, per ell in {2, 3, 5, 7, 11, 13}
      direction: different
      minimum_effect: >-
      100 percent agreement for odd ell. Any disagreement falsifies Part One.
      At ell = 2, 100 percent agreement ONLY AFTER the case split; the
      disagreement rate WITHOUT the case split is also reported, because it
      measures how often the naive formula would silently mislabel a 2-volcano.
    - >-
      metric: >-
      wall time of v_ell(c) by the shortcut versus by full factorization of D,
      as a function of log p
      direction: lower
      minimum_effect: >-
      The shortcut at least 100x faster at the largest tested p, and its time
      growing like O(log^2 p) while factorization grows superpolynomially. A
      ratio that does not widen with p means the shortcut is not asymptotically
      cheaper and the claim is overstated.
    - >-
      metric: >-
      bit length of D = t^2 - 4p relative to bit length of p, over the instance pool
      direction: different
      minimum_effect: >-
      At most log2(4) = 2 bits more than p, on 100 percent of instances. This is
      the Hasse bound and it is checked rather than asserted, because claim (B)'s
      entire correction to IDEA-20260726-010 rests on it.
    - >-
      metric: >-
      isogeny computations to determine v_ell(f_E), fitted against ell and h
      direction: higher
      minimum_effect: >-
      Fitted exponent in ell within [0.7, 1.5] of the predicted 1, and in h
      within [1.5, 2.5] of the predicted 2. A fitted exponent in ell materially
      above 1 means the walk is more expensive than modelled and the crossover
      moves down.
    - >-
      metric: >-
      the C1/C2 verdict per ell regime
      direction: different
      minimum_effect: >-
      A stated crossover ell* with a stated budget, plus the sentence naming
      which obstruction applies below and above it. PREDICTED: C2 (invisibility,
      not cost) for ell below a few thousand; C1 (cost) above. If the measurement
      instead shows small-ell level determination to be expensive, C1 applies
      everywhere and the lane's closure would name a completely different
      obstruction -- which is why this audit runs before the closures are
      written.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): verify the public factoring-record figures against a
      primary source and write a KN-LIT record; read KN-LIT-251 and KN-LIT-309
      beyond their abstracts and record what they actually claim about the
      bottleneck.
      STAGE 1 (minutes): implement and mass-check Part One over >= 10^5 pairs.
      STAGE 2 (minutes): the Hasse bit-length check.
      STAGE 3 (hours): factoring-time ladder, with the honest labelling of
      measured versus argued.
      STAGE 4 (hours): the walk-cost measurement over ell in {2,...,13}.
      STAGE 5 (zero compute): the crossover and the C1/C2 verdict.
      ENTIRE TEST IS PURE INTEGER ARITHMETIC PLUS THE ell in {2,3} ISOGENY CODE.
      No Groebner computation is required, which makes this the cheapest
      substantive item in the batch.
    controls:
      - brute-force factorization oracle on every instance (N1, blocking)
      - random integers of matched bit length, where the formula must fail (N2)
      - supersingular instances, where the pipeline must report degeneracy (N3)
      - the ell = 2 case run both with and without the case split, to measure the
        naive formula's error rate
      - a class with c a single large prime, where the cheap route must give nothing
    required_metrics:
      - agreement rate of the shortcut against factorization, per ell
      - wall time of shortcut and of factorization, per log p
      - bit length of D versus bit length of p
      - isogeny computations and wall time for level determination, per (ell, h)
      - fitted exponents in ell and h with confidence intervals
      - the stated crossover ell* and the budget it assumes
      - EXPLICIT measured-versus-argued label on every crypto-scale number

  falsification_conditions:
    - >-
      Any odd-ell instance where the shortcut disagrees with factorization.
      Part One is false; the record is superseded.
    - >-
      Any instance with |D| > 4p. The Hasse bound is being misapplied and claim
      (B)'s correction to IDEA-20260726-010 collapses.
    - >-
      Measured level-determination cost growing faster than O(ell * h^2). The
      crossover moves down and the "small ell is cheap" conclusion narrows; the
      record reports the narrower range rather than the original claim.
    - >-
      Reading KN-LIT-251/KN-LIT-309 reveals the bottleneck is NOT the large-ell
      walk. Part Three is misattributed and must be rewritten around whatever the
      papers actually say. This is a likely and welcome outcome of Stage 0.
    - >-
      The shortcut also "works" on random integers (N2). The formula is not using
      discriminant structure and something is wrong with the test harness.

  confounders:
    - >-
      SMALL-p DEGENERACY. At p ~ 2^16, c is often 1 or a tiny number, so most
      volcanoes have height 0 and the walk-cost measurement has no signal.
      Instances must be selected for h >= 1 and the selection rate reported.
    - >-
      sympy.factorint's timing is not representative of any serious factoring
      implementation, so Step 2's timings speak only about the toy pipeline.
      Every crypto-scale sentence must be argued from bit lengths instead, and
      mixing the two is the specific error this confounder names.
    - >-
      The largest prime factor of c, not c itself, determines feasibility. A
      265-bit c that is a product of small primes is entirely tractable while a
      265-bit prime c is not. All reporting is by largest prime factor.
    - >-
      CM-constructed curves have artificially small D_K and hence large c, which
      is unrepresentative of random curves. Random and CM instance pools must be
      reported separately.

  interpretation_limits:
    - >-
      This is a COST AUDIT. It produces no attack, improves no published
      algorithm, and asserts nothing about whether depth matters.
    - >-
      The crypto-scale conclusion in claim (B) is an ARGUMENT from bit lengths and
      the public factoring record, not a measurement, and it is labelled as such
      everywhere it appears.
    - >-
      A correction to IDEA-20260726-010's cost framing does not touch that
      record's density measurement or its hardness null, both of which stand
      independently.
    - >-
      Nothing here licenses the claim that End(E) is easy. Part Three says the
      opposite for large ell and cites the published subexponential algorithms as
      the state of the art.

  reachability_gate: >-
    THIS RECORD IS THE PRICE SIDE OF THE REACHABILITY GATE and it is what makes
    IDEA-20260807-bb03d3's gate quotable. Reaching a target LEVEL requires first
    KNOWING the current level, and this audit prices that: free for the height,
    O(ell * h^2) isogeny computations for the level, infeasible for large ell. So
    the reachability statement "any small-ell level is reachable in polynomial
    time" is complete only when paired with "and its current value is knowable in
    polynomial time", which is established here. For LARGE ell dividing c, neither
    knowing nor reaching the level is feasible by these methods, and any proposal
    depending on a large-ell level must either cite a subexponential
    endomorphism-ring computation and charge it, or be closed on cost.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT. Component costs, stated as the audit's actual output:
      height v_ell(c): O(log^2 p) bit operations, no factorization.
      level v_ell(f_E): O(ell * h^2) isogeny computations with h = O(log p), each
        costing at least O(ell^2) field operations via psi_ell -- so O(ell^3 log^2 p)
        field operations, polynomial in ell and exponential in log ell.
      full conductor f_E: requires factoring D (a p-sized integer -- routine at
        256 bits) AND the level at every ell | c, the latter being the
        subexponential part per KN-LIT-251/KN-LIT-309.
    memory_exponent: >-
      Negligible for the height. For the level, O(ell^2) field elements to hold
      psi_ell, which is the binding constraint for large ell and is what makes the
      large-ell route infeasible in memory before it becomes infeasible in time.
    best_known: >-
      Endomorphism-ring computation: subexponential (KN-LIT-251 Bisson-Sutherland
      2009, heuristic, bound depending primarily on log|D_E|; KN-LIT-309 Bisson
      2011, subexponential under GRH alone). Both abstracts read, full texts NOT
      READ. This audit does not improve either and says so.
    hidden_overhead: >-
      Disclosed: (i) "polynomial in ell" is exponential in log ell and the record
      never writes the first without the second; (ii) the crypto-scale factoring
      claim rests on recalled public records pending Stage 0 verification;
      (iii) point counting to obtain t at all is O(sqrt p) in this harness and
      O(log^5 p)-ish with SEA, which is not implemented here -- so at toy scale the
      DOMINANT cost of the whole audit is obtaining t, and that is charged
      separately rather than hidden.
    tradeoff_note: >-
      The per-ell separability means an attacker can buy exactly the level
      information they need and no more, at a cost that is a sum over the primes
      they care about. That is a genuine and previously unstated tradeoff in this
      program's cost model.

  dominated_by: >-
    AS AN ATTACK: mounts none, dominated on every axis by parallel rho at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006), by
    automorphism-discounted rho (KN-TECH-018), by BSGS at 2 sqrt(N) time and
    sqrt(N) memory (KN-TECH-031), and by toy Semaev index calculus
    (KN-FIND-f8c290). Checked across time, memory and data/queries.
    AS AN ENDOMORPHISM-RING METHOD: strictly dominated by KN-LIT-251 and
    KN-LIT-309 on COMPLETENESS, since they return the whole ring and this returns
    only heights and small-ell levels. NOT dominated on the restricted problem of
    computing a single small-ell height, where O(log^2 p) with no factorization is
    as cheap as the problem can be. The domination is honest and the non-domination
    is narrow.
  sota_delta: >-
    Zero against every attack baseline. Cost-model delta, quantitative: replaces
    an aggregate "subexponential endomorphism-ring computation" charge with a
    per-component schedule -- O(log^2 p) for a height, O(ell^3 log^2 p) field
    operations for a small-ell level, subexponential only for the large-ell part
    -- and reduces the claimed hardness of extracting the square part of t^2 - 4p
    at a 256-bit p from "factoring-hard" to "a 258-bit factorization", which is a
    change of several orders of magnitude in the assumed cost of one step this
    program has already reasoned from.

