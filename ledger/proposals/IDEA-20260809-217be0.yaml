idea:
  id: IDEA-20260809-217be0
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    The descent phase is asymptotically negligible and concretely expensive —
    measure it, because a per-target cost changes what an attacker is buying
  class: measurement
  claim: >-
    Published estimates are dominated by the precomputation phases, with the
    individual-logarithm descent treated as lower order. The claim is that at
    reachable sizes the descent's measured cost is a substantial fraction of the
    total and, more importantly, that it is a PER-TARGET cost while the
    precomputation is amortized — so the attacker's economics depend on the
    ratio, and that ratio is never reported.
  mechanism: >-
    Run descents for many targets against one completed precomputation from
    IDEA-20260809-15e1cd, measure the per-target cost distribution, and compute
    the break-even number of targets at which precomputation dominates.
  why_not_a_renamed_known_approach: >-
    Amortized precomputation attacks are a known idea in finite-field discrete
    logarithms. What is proposed is the measured per-target cost distribution
    and break-even count for a TOWER field of the deployed shape, which converts
    a qualitative asymptotic statement into two numbers an implementer can use.
  predictions:
  - observable: per-target descent cost distribution
    metric: operations per target, with spread
    predicted: Wide spread, since descent difficulty depends on the target's smoothness luck. The spread, not the mean, is the operationally relevant statistic.
  - observable: break-even target count where amortized precomputation equals total descent cost
    metric: integer
    predicted: Small enough to matter for any setting with many logarithms in one field; if it is astronomically large, the amortization concern is void and that is recorded.
  minimal_test: >-
    One hundred random targets against one precomputation at the largest
    calibration size, with per-target cost recorded and the distribution
    reported, plus the computed break-even count.
  controls:
  - 'TARGET-SAMPLING CONTROL: targets drawn uniformly with a declared seed; a biased target set would distort the distribution in exactly the direction that makes descent look cheap.'
  - 'RESTART CONTROL: descents that fail and restart are counted at full cost, since ignoring restarts is the standard way this cost gets understated.'
  falsification_conditions:
  - Per-target descent cost is negligible relative to precomputation at every calibration size, matching the asymptotic treatment.
  - The distribution is so heavy-tailed that no stable break-even count can be computed, which must be reported rather than papered over with a mean.
  interpretation_limits: >-
    Measured at calibration sizes. Extrapolation of the ratio to deployment
    parameters carries its own interval and is not a security statement.
  sota_delta: 'No attack. Delta: a per-target distribution and a break-even count where the literature has an asymptotic dismissal.'
  dominated_by: Downstream of IDEA-20260809-15e1cd; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the calibration; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for descent/individual logarithm: no records. WEB NOT CHECKED.'
  source_refs:
  - exTNFS descent references -- RECALLED, REQUIRED READS.
