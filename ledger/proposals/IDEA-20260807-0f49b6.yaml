idea:
  id: IDEA-20260807-0f49b6
  question_id: RQ-ECDLP-002
  added: '2026-08-07'
  title: KN-OPEN-018 names its own cheapest closure route -- run a lattice-embedding oracle through
    the GGM simulability screen -- and records that it 'has not been attempted here'; the screen
    exists, works, and has closed four oracle families already, so point it at Oracle L
  class: control
  claim: 'KN-OPEN-018 states the lattice/ECDLP boundary precisely: lattice reduction enters ECDLP
    work only via the Hidden Number Problem under nonce leakage and as a Coppersmith subroutine
    inside index-calculus descent, both auxiliary; there is no known embedding of a prime-order
    ECDLP instance into a short-vector instance, and no theorem forbidding one. Its ''What would
    close it'' section names the cheaper of two decisive routes verbatim -- a scoped impossibility
    showing that any such embedding respecting the group action is simulable in the generic group
    model with constant overhead, ''in the style of the program''s existing GGM-simulability screens''
    -- and then says of both routes: ''Neither has been attempted here.'' Those screens exist
    and work: EXP-GGM-001 and its simulability_test.py produced KN-FIND-002 and KN-FIND-b7e091,
    closing jet, endomorphism, elliptic-net and incidence oracle classes. The enumeration stops
    at four families. A lattice-embedding oracle has never been defined as an oracle class, let
    alone screened.'
  mechanism: 'Define Oracle L: on input (G, Q) for a prime-order prime-field curve, return a basis
    of a lattice whose shortest vector encodes k = log_G Q, subject to the constraint that the
    construction is definable from group operations and equality tests on its inputs -- i.e. it
    commutes with the group action, which is what ''respecting the group action'' means and what
    makes the Shoup argument applicable. Feed it to the existing simulability harness. If a simulator
    reproduces the oracle''s answers with constant overhead using only generic operations, then
    Shoup''s bound applies unchanged and the lattice-ECDLP bridge is closed at exponent 1/2 for
    the whole class, exactly as KN-FIND-b7e091 closed incidence and endomorphism oracles. If simulation
    fails, the failure NAMES the non-generic ingredient any embedding must use, which is the forward
    guidance KN-OPEN-018 asks for and the inventor protocol''s section 4 requires.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - experiments
    grep_results:
    - The oracle-class enumeration screened by EXP-GGM-001 covers jet, endomorphism, elliptic-net
      and incidence oracles and stops there.
    - KN-OPEN-011 and KN-OPEN-018 are cited only by ECDSA/leakage records (H-ECDSA-7ccd4b, H-BPR-965f0b,
      RQ-ECDSA-87625f) -- inside the partial-information model KN-OPEN-018 explicitly excludes.
    - DEC-20260804-139a86 asserts 'None of KN-OPEN-001..020 remain unaddressed' but itemises only
      001-010; KN-OPEN-018 is never named.
    conclusion: No record frames a lattice oracle as an oracle class. External novelty unverified.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: HNP and every leakage-model
      technique (KN-OPEN-018 excludes them by definition), index-calculus descent, and Coppersmith
      as a subroutine. The object of study is the EMBEDDING, in the no-leakage model.'
    tracked_object: The oracle's answer as a function of the transcript of generic group operations
      that produced its inputs.
    one_step_propagation_rule: A simulator maintains the same transcript and must produce an answer
      distributed identically. Each additional group operation extends the transcript by one entry;
      simulability is the property that the answer is determined by it.
    newness_score: Nil as mathematics -- this is Shoup's argument applied to one more oracle class.
      Its value is that KN-OPEN-018 asked for exactly this and nobody did it.
  lossy_projection_identifiability_audit:
    projection: the lattice basis -> the transcript-determined part of it.
    what_is_discarded: Any part of the basis that depends on the concrete representation of group
      elements rather than on the group structure.
    is_it_only_a_change_of_coordinates: 'NO. If nothing were discarded the oracle would be trivially
      simulable and the screen would be vacuous. The screen''s whole content is whether the discarded
      part is empty. The honest caveat: a NEGATIVE result here (not simulable) is not a lattice
      attack; it identifies a non-generic ingredient and nothing more.'
    mirror_failure_check: 'CHECKED, and this is the screen''s known hazard. A simulability test
      that returns ''simulable'' for every oracle is a control that cannot fail. It does not:
      KN-FIND-002 records elliptic-net and incidence oracles as simulable at NON-CONSTANT overhead,
      a different verdict from the jet and endomorphism oracles'' O(1). The screen has already
      produced at least two distinct outcomes, so its comparator spread is non-zero.'
  null_object_control:
    primary_null: A DELIBERATELY NON-GENERIC oracle -- one that reads the x-coordinate's integer
      value and returns a basis depending on it -- MUST fail simulation. If the screen reports
      it simulable, the screen is a control that cannot fail and must be repaired before any verdict
      on Oracle L is recorded.
    secondary_nulls:
    - 'TRIVIAL-ORACLE GATE: an oracle returning a fixed basis independent of its inputs must be
      reported simulable at zero overhead.'
    - 'REGRESSION: re-run the four already-screened oracle families and reproduce KN-FIND-002''s
      verdicts before screening a fifth.'
  assumptions:
  - simulability_test.py accepts a new oracle definition without redesign.
  - '''Respecting the group action'' can be made precise as definability from group operations
    and equality tests -- this record adopts that definition explicitly and any conclusion is
    scoped to it.'
  predictions:
  - metric: simulation overhead for Oracle L
    direction: different
    minimum_effect: A verdict of O(1), non-constant, or not-simulable, each of which is a different
      and citable outcome.
  minimal_test:
    design: Define Oracle L as above with two or three concrete instantiations (a CVP-style embedding
      of the DL relation, an HNP-shaped embedding with the leakage parameter set to zero, and
      one embedding built from group operations only). Run each through simulability_test.py with
      the non-generic null and the trivial-oracle gate, and the four-family regression.
    controls:
    - non-generic oracle that must fail
    - trivial oracle that must pass
    - four-family regression against KN-FIND-002
    required_metrics:
    - simulation verdict and overhead per instantiation
    - the specific non-generic ingredient named, where simulation fails
  falsification_conditions:
  - 'Every group-action-respecting instantiation is simulable at O(1): the lattice-ECDLP bridge
    is closed at exponent 1/2 for this class, which is the scoped impossibility KN-OPEN-018 asks
    for.'
  - 'The non-generic null is reported simulable: the screen cannot fail and no verdict is admissible.'
  - 'No instantiation can be written that both respects the group action and encodes k: the record''s
    object does not exist and that is itself the answer, recorded as such.'
  confounders:
  - The definition of 'respects the group action' does real work; a different definition gives
    a different theorem, and the scope must be stated in any conclusion.
  - An HNP-shaped embedding with zero leakage may degenerate trivially, which is a property of
    that instantiation and not of the class.
  interpretation_limits:
  - A simulability closure is a statement about ONE oracle class in the generic group model. It
    does not say lattices are irrelevant to ECDSA under leakage, which KN-OPEN-011 owns and which
    is out of scope here.
  - Non-simulability is not an attack and not a cost claim.
  heuristic_assumptions:
  - id: HEUR-GGML-1
    statement: The three chosen instantiations are representative of group-action-respecting lattice
      embeddings.
    rigorous_support: None. This is the standard weakness of oracle-class screens and the reason
      the conclusion is scoped to the tested class.
    validation_plan: State the class boundary in the evidence record and invite a counterexample
      instantiation as the falsifier.
  target_complexity:
    time_exponent: n/a -- screen
    memory_exponent: n/a
    best_known: Pollard rho at exponent 1/2
    hidden_overhead: n/a
    tradeoff_note: No cost claim.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2} time, O(1) memory); BSGS (p^{1/2} time, p^{1/2} memory);
    van Oorschot-Wiener parallel rho (p^{1/2}/w); Semaev index calculus as costed in FINDING-PF-IC-001
    (total exponent ~2.05 per target at toy scale, i.e. worse than rho). Queries are 0 on every
    row.'
  sota_delta: ZERO. Deliverable is a scoped GGM verdict on a fifth oracle class, which either
    retires a speculative lane or names the non-generic ingredient any lattice embedding of plain
    ECDLP must use.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.75 that every instantiation screens as simulable at O(1), closing
    the lane -- the group action is very restrictive and Shoup's bound is robust. 0.20 that at
    least one instantiation cannot be written at all under the stated definition, which is a definitional
    answer rather than a mathematical one. 0.05 that something fails to simulate, which would
    be the rarest object the program hunts and would immediately need adversarial review.
