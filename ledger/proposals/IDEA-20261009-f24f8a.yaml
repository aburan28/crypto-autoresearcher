  lanes:
  - ecdlp
  title: |-
    Point-decomposition cost scaling vs factor-base size for size-based factor bases (SAT / Groebner / enumeration)
  class: measurement
  claim: |-
    T_decomp(p, beta, m) is proportional to |F_beta|^(1 +/- 0.05) for m in {2, 3} across all solvers, i.e. nothing beats brute force. Falsified if any solver sustains a fitted exponent <= 0.9 over >= 3 sizes.
  mechanism: |-
    Index calculus with F_beta beats rho only if one decomposition costs o(|F_beta|) while |F_beta| stays sub-sqrt(p). Petit-Kosters-Messeng (2016) found Groebner cost proportional to |F| for the Semaev-2015 prime-field proposal because the first-fall-degree assumption fails.
  novelty_status: unverified
  citations:
  - ref: KN-LIT-009
    source_text: Semaev ePrint 2015/310
    provenance: kb
    claim: |-
      prime-field decomposition proposal with heuristic cost under a first-fall-degree assumption
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-009
  - ref: KN-LIT-025
    source_text: Petit-Kosters-Messeng PKC 2016
    provenance: kb
    claim: |-
      prime-field decomposition bases; Groebner cost observed proportional to |F|, first-fall-degree assumption fails
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-025
  - ref: Galbraith-Gebregiyorgis 2014
    source_text: Galbraith-Gebregiyorgis 2014
    provenance: recalled
    claim: |-
      SAT/Groebner comparison for summation-polynomial decomposition in characteristic two
    verified_by: null
  assumptions:
  - bit-level encodings are comparable across solvers; exponent fits use >= 3 sizes
  - |-
    Batch claim boundary: Every experiment is a bounded mathematical measurement on synthetic or known-answer instances at small p. No private-key recovery, no attack on deployed curves or keys. A working toy-p prototype is "finite control", never "subexponential ECDLP". Theorem-closed items can produce receipts, never results.
  proof_search_map:
    not_applicable_reason: null
    bottleneck: |-
      the cost of one point decomposition relative to |F_beta|; index calculus wins only if it is o(|F_beta|) with |F_beta| sub-sqrt(p)
    baseline_embedding:
      parameter_slice: |-
        beta = 1/2, m = 2 (enumeration) is the brute-force boundary; KN-LIT-025 is the Groebner boundary
      reproduction_check: enumeration baseline must reproduce p^{m beta - 1}/m! decomposition fraction
    observation_collision:
      observable: fitted exponent in |F_beta|
      distinct_preimage_search: |-
        the same exponent on random p and 2^n - c (SNFS-A1 control) rules out prime-form artefacts
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: bit-level SAT encoding of S_{m+1} with x_i < p^beta as digit constraints
      predicted_gain: none in exponent predicted; the measurement decides
    quantifier_order: |-
      for all solvers tested and all beta in {0.3, 0.4, 0.5}, the fitted exponent is >= 0.95; exists none below 0.9
    method_ceiling:
      strongest_certifiable_claim: a scaling exponent over the tested p range; no asymptotic statement
      nearby_object_control: random prime of the same size and a planted-decomposition instance
    proof_obligations:
    - claim: decomposition fraction matches p^{m beta - 1}/m!
      responsibility: baseline
    - claim: exponent fit uses >= 3 sizes with intervals
      responsibility: scope
  predictions:
  - metric: fitted_exponent_T_decomp_vs_factor_base_size
    direction: different
    minimum_effect: |-
      within 1 +/- 0.05 for every solver and m in {2, 3}; an exponent <= 0.9 sustained over >= 3 sizes falsifies
  - metric: first_fall_degree_minus_degree_of_regularity_gap
    direction: different
    minimum_effect: |-
      the gap is reported for every Groebner run; a systematic gap of 0 across sizes would be the structural surprise
  minimal_test:
    design: |-
      1. p in 2^20 .. 2^44 step 4; beta in {0.3, 0.4, 0.5}; m in {2, 3}; both pseudo-Mersenne and random p.
      2. Solvers: (i) enumeration baseline; (ii) CryptoMiniSat / WDSat on a bit-level encoding of S_{m+1} with x_i < p^beta as bit constraints; (iii) F4/F5 (Magma, msolve) with the bound encoded via auxiliary digit variables; (iv) Coppersmith from A2 where applicable.
      3. Record first-fall degree and degree of regularity for every Groebner run; archive the gap (the PKM observation).
    controls:
    - |-
      planted decompositions (known answer); random p vs 2^n - c (ties to A1); solver-stage-only numbers are not reported without the full decomposition cost (research-standards: completed-operation measurements).
    required_metrics:
    - median T_decomp per (p, beta, m, solver)
    - fitted exponent vs |F_beta|
    - first-fall degree vs degree of regularity
    - peak memory
    - fraction of targets R that decompose (expect about p^(m*beta - 1) / m!)
    stopping_rule: |-
      >= 7 p-sizes with >= 20 instances per (beta, m, solver); abort a solver line when median time > 6 h at a size
    replication:
      seed_policy: |-
        campaign-unique; derivation in coordination/intakes/20261009-snfs-ecdlp-ledger/manifest.yaml
      seed_base: 2419843146
      seeds:
      - 2419843146
