      - 2419843148
  falsification_conditions:
  - |-
    Any solver sustains a fitted exponent <= 0.9 in |F_beta| over >= 3 sizes with planted known-answer instances and full decomposition cost counted.
  - |-
    Solver-stage-only timings are not admissible; a line without the full decomposition cost is unreported, not evidence.
  confounders:
  - |-
    Encoding size differs across solvers; cross-solver comparison is by exponent, never by absolute time.
  - |-
    Memory, not time, may abort Groebner lines first; peak memory is a primary metric.
