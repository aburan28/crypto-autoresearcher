  heuristic_assumptions:
  - id: H1
    statement: |-
      For size-constrained factor bases over F_p the decomposition system behaves like a random system of its shape: degree of regularity exceeds first-fall degree and cost scales linearly with |F_beta|.
    rigorous_support: |-
      KN-LIT-d8e1b9 proves naive Semaev IC over F_p cannot beat generic methods under statistical assumptions; KN-LIT-025 observes cost proportional to |F|.
    validation_plan: |-
      >= 7 sizes, >= 20 instances per (beta, m, solver); log-log fit of median T_decomp against |F_beta| with bootstrap interval; d_reg and first-fall degree recorded per Groebner run.
  target_complexity:
