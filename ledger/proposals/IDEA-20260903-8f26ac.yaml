  preregistered_decision_rule: >-
    Committed in S0-1 before any arm. ORDERING (BINDING): S0-5 dead anchor is run and
    ANALYZED BEFORE any alive reading; S0-6 ramp-zero anchor before any interior point; S1
    runs only after S0 PASS, with S1-1 (k=2 seed2) before S1-2 (k=8 seed2) and the CC
    composition after both; S2a runs only after S1 composition under the stage gate, with the
    extended-build dead anchor analyzed first among extended alive readings; S2b runs only
    after S2a PASS, with the CC3 composition after both k=3 arms. The batch's additive
    content is composed only after ALL executed arms are read, under the cascades below.
    TOP-LEVEL CC CASCADE - exhaustive, evaluated in this FIXED ORDER: (1) CC-GATE-FAIL: any
    integrity gate fails (S0-2 build identity or its Gate-0x fallback, S0-3 KAT, S0-4 freeze
    re-verification, S1-3 post-arm digest/source-diff, or counter INCONSISTENCY on any
    analysis-bearing receipt). The counter-inconsistency conjunct is AMEND-1 VERBATIM as in
    integrity_gate_amend1, with the saturation-aware evaluation rule (strictest reading). ->
    invalid_measurement; HALT; repair (rule 5); never evidence about shape. (2) CC-F6: dead
    anchor reads hits >= 9 -> boundary falsifier of the sealed verdict; HALT in-batch flow;
    escalate to claim-changing review (rule 12); no reading admitted. (3) CC-ANCHOR-FAIL: k=0
    re-seat fails (hits != 2^30, or any nontrivial trial with W != 3, or excess ratio != 1.0)
    -> F3 ramp-anchor indictment; HALT; no interior reading admitted; never evidence about
    shape (rule 5). (4) CC-SEED-DISAGREE: branches 1-3 not fired AND band(h(2)_531002) !=
    THRESHOLD -> NO count-level sentence at k=2; instrument-level alarm flag (a ~386-sd
    departure at the realized magnitude); Stage S2 BLOCKED; named successors (third seed,
    instrument review, 2^32 arm under a new decision); Coordinator re-rank. (5)
    CC-COUNT-DISAGREE: branch 4 not fired AND (the count CIs are disjoint OR the per-seed
    ratio CIs are disjoint, per count_completion_decision_rule) -> determinate seed-variance
    finding at k=2; no replicated count sentence; Stage S2 still executes; named successors.
    (6) CC-AGREE: branch 4 not fired AND count CIs overlap AND ratio CIs overlap ->
    COUNT-REPLICATED: SH2-MONOTONE-DECAY extended to count level for pairs (1,2) and (2,4)
    under the scoped sentence and NARROW-1/2/3 discipline; Stage S2 executes. (7)
    CC8-FLOOR-DEPART: h(8)_531002 <= 5 -> floor-instability finding at k=8 (RT-J8 sensitivity
    realized), recorded beside the k=2 verdict, never gating it; the BATCH-e5d753 verdict
    remains immutable. (8) CC8-AGREE: h(8)_531002 in RESIDUAL [6,40] -> floor seed-stable at
    band level at k=8 (second independent draw). BRANCHES 7/8 are evaluated for BOTH k=2
    outcomes (5)/(6) and are orthogonal findings. STAGE S2, if the gate admits it, runs the
    CC3 cascade of family_extension_design.sub_localization_decision_rule (CC3-GATE-FAIL >
    CC3-F6 > CC3-SEED-DISAGREE > CC3-NONMONO-EXT > CC3-SUBLOCALIZE-LATE >
    CC3-SUBLOCALIZE-EARLY > CC3-AMBIGUOUS > CC3-RESIDUAL-COMPLEMENT), committed in the same
    S0-1 file. Budget halts are resource_exhaustion, NEVER readings (rule 5). Per-point
    tuples, the SCOPE-1 scoping rule, the paraphrase discipline, and the no-reopen clause
    apply in EVERY branch.

  branch_precedence_clause: >-
    RESTATED STANDALONE (mandatory clause, f8294e/9e84ac precedent carried): this record's
    decision rule is an EXHAUSTIVE ORDERED CASCADE (CC-GATE-FAIL > CC-F6 > CC-ANCHOR-FAIL >
    CC-SEED-DISAGREE > CC-COUNT-DISAGREE > CC-AGREE, with the orthogonal CC8-FLOOR-DEPART /
    CC8-AGREE finding axis evaluated beside branches 4-6, and the CC3 sub-cascade gated to
    Stage S2) committed in S0-1 before any arm runs. By construction no two branches can be
    assigned the same outcome: branches 1-3 are halt conditions preceding all verdict
    composition; branch 4 consumes any k=2 band-departure outcome before any count branch
    composes; branches 5 and 6 are disjoint by conjunct (CI disjointness vs overlap);
    branches 7/8 are disjoint by conjunct (h <= 5 vs 6 <= h <= 40) and orthogonal to 4-6;
    the CC3 branches are disjoint by the band-partition of the two k=3 readings with the
    NULLBAND case ordered before SUBLOCALIZE-EARLY (whose 6 <= h conjunct excludes it). This
    cascade is RE-AUTHORED for the post-verdict replication question, not an amendment of the
    9e84ac SH2 cascade (which remains bound to BATCH-e5d753, immutable, and whose verdict
    this record never recomposes). The clause binds this record's own rule and is carried
    verbatim into the S0-1 preregistration file.

  replication_determinism_plan: >-
    REPLICATION: new independent draws only - seed 531002 at k=2 (armid 3, seat-fixed
    convention), seed 531002 at k=8 (armid 6), and seeds 531001 then 531002 at the NEW k=3
    seat (armid 11). Per-seed readings, never pooled; band agreement plus count agreement is
    the pre-registered replication condition at k=2 (count_completion_decision_rule); the
    committed k=1 and k=4 second seeds of BATCH-e5d753 supply the other endpoints of pairs
    (1,2) and (2,4) without re-measurement. k=16 stays single-seed (beyond scope; RANK-2
    input). DETERMINISM: the frozen build needs no new determinism double (the
    overflow-positive double passed on this byte-identical build in BATCH-e5d753; inherited
    transitively, not re-spent); the EXTENDED build re-runs the overflow-positive double at
    k=1 log2N=20 (predicted ~12,128 hits -> overflow ~11,104), exercising the truncation path
    on the new binary, with the k=0 log2N=20 fallback overflow-positive by construction if
    the realized overflow = 0 (rule-8 recorded). NARROW-3 binding everywhere: identical
    seed/seat/build reproduces identical counts by construction; no such reproduction in this
    batch is recorded as replication, and the BATCH-7b798d observations remain unvalidated
    under AMEND-1's no-post-hoc-rescue clause.

  test_boundary: >-
    Toy tier; r=5 for all ramp arms (one r=6 known-dead reference anchor per build); the
    frozen nested position family S_k, subset {0,1,2,4,8,16} plus the extension point k=3
    only if Stage S2 runs - not the space of all S-boxes and not even all family points
    (k=5/6 declined with priced rationale; k=12 reserved; sub-sub-intervals need further
    extension, named successor); one probe cell (amask=1, smask=1); bijective tables only by
    construction; one key per seed family under PIN-T0 (the reading is about the
    cipher-with-pinned-schedule, stated; schedule-separated statements out of scope until the
    PINCTRL-1 successor); the modified ciphers actually run, never AES beyond its own seat;
    2^30 per arm, no 2^32 exposure. The strongest licensed sentences AFTER this batch, per
    outcome: 'within the tested nested position family at the pinned probe cell, the r=5
    hit-count excess count decay from k=1 to k=2 is replicated across two independent seed
    environments within declared resolution' (if CC-AGREE, extended to the (2,4) pair under
    the same rule); '...the residual floor is seed-stable at band level at k=8' (if
    CC8-AGREE); '...the THRESHOLD->RESIDUAL transition is localized to (2,3] or (3,4] at band
    level' (if CC3-SUBLOCALIZE-EARLY/LATE) - NEVER 'any S-box', never a carrier sentence
    about e, never a rho-exclusion sentence, never a dilution-only attribution of h(1), never
    an extinction sentence of any kind (the floor is alive, NARROW-1), never a count sentence
    about (4,8)/(8,16), never anything about full-round or deployed AES; no
    published-frontier comparison in either direction.

  falsification_conditions:
    - >-
      FY1 (COUNT-REPLICATION FALSIFIER - falsifies the seed-stable dose law MH1 for the
      k1->k2 step). CC-COUNT-DISAGREE fires: the k=2 second seed agrees in band but its count
      or the per-seed decay-ratio CIs are disjoint. Then the 84.90 decay ratio is NOT
      seed-stable at the declared ~1% resolution; the seed variance of the ratio is the
      scoped finding, measured with both tuples; no replicated count sentence. Complete
      result.
    - >-
      FY2 (SUB-LOCALIZATION FALSIFIER - falsifies the late-transition reading of MH2).
      CC3-SUBLOCALIZE-EARLY fires (k=3 RESIDUAL on both seeds): the transition does NOT sit
      in (3,4]; it sits in (2,3] - the decay completes one dose step earlier than the
      multiplicative prior predicted. Complete result (the flagged prior is falsified as a
      prediction; it was never evidence).
    - >-
      FY3 (MONOTONE-EXTENSION FALSIFIER). CC3-NONMONO-EXT fires (k=3 NULLBAND on either seed,
      k=4 RESIDUAL): the band trajectory does NOT extend monotonically to the extended grid;
      the floor dips at k=3 below the k=4 floor. The BATCH-e5d753 verdict on grid
      {1,2,4,8,16} stands immutable; the non-monotone finding is scoped to the extended
      family with named successors. Complete result.
    - >-
      FY4 (FLOOR-STABILITY FALSIFIER). CC8-FLOOR-DEPART fires (k=8 second seed NULLBAND): the
      floor is NOT seed-stable at band level at k=8; the RT-J8 sensitivity is realized. The
      composed verdict is qualified in its seed extension, not rewritten. Complete result.
    - >-
      FY5 (BLOCKING - ramp anchor). F3: k=0 re-seat fails -> invalid_measurement; halt;
      repair (rule 5). Cross-field: indicts the frozen build's identity path against the
      committed affine anchor.
    - >-
      FY6 (BLOCKING - gate/instrument, AMEND-1 form). Build identity fails (and the Gate-0x
      fallback fails), KAT pins fail, freeze re-verification fails, the declared-diff audit
      fails, the surface-diff battery fails, the extended-build determinism double fails, a
      post-arm audit fails, or COUNTER INCONSISTENCY on any analysis-bearing receipt (AMEND-1
      verbatim conjunct) -> invalid_measurement; repair (rule 5); never evidence about shape.
      Repair routes named: instrument repair under the frozen lineage, or - if the extension
      itself is indicted - revert to the frozen build and treat the family extension as a new
      proposal (lineage change = new frozen spec).
    - >-
      FY7 (ESCALATION TRIPWIRE, not a defect). F6: dead anchor >= 9 hits on either build -
      boundary falsifier of the sealed verdict; halt, record, escalate to claim-changing
      review (rule 12).
    - >-
      FY8 (REPLICATION FALSIFIER). CC-SEED-DISAGREE or CC3-SEED-DISAGREE fires: the band
      structure at a load-bearing point is seed-unstable; no count/sub-localization sentence
      composes for that point; the instability itself is the scoped finding with named
      successors (and an instrument alarm at k=2, where the departure is a ~386-sd event).
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); an ambiguity-band k=3 reading on both
      seeds (determinate CC3-AMBIGUOUS with named successor, never a defect); within-band
      inversions (below declared tier-1 resolution); timeouts/crashes (rule 5); a
      COUNT-DISAGREE at k=8-vs-k=4 style within-RESIDUAL comparison (below declared
      resolution, never tested beyond the band rule); the flagged multiplicative prior being
      wrong (priors are not claims).

  controls:
    - >-
      DEAD-ARM ANCHOR AT MATCHED EXPOSURE, ANALYZED FIRST ON EACH BUILD (inherited, re-seated
      at seed 531004 on both the frozen and the extended build): the proves-too-much control
      for the COUNT observable - a table path or instrument that manufactures hits where the
      campaign sealed death is caught before it can manufacture a replication or a
      localization. Anchor power limit disclosed (committed r=6 rates 2-4 per 2^30; a 0-hit
      re-seat passes direction-safe at reduced assurance, inherited precedent).
    - >-
      RAMP-ZERO BLOCKING ANCHOR (inherited): the k=0 identity re-seat (probability 1 per
      trial, W = 3, excess ratio 1.0 exact) in the same instrument as the interior points: an
      instrument that cannot reproduce its own zero measures nothing. On the EXTENDED build
      the ramp-zero is covered by the freeze selfcheck_identity_k0 mini-arm plus the declared
      diff leaving the identity path untouched (priced decline of the redundant 2^30 re-seat;
      family_extension_design).
    - >-
      AMEND-1 PROVES-TOO-MUCH ON THE RAMP-ZERO RECEIPT (inherited): the rescoped gate must
      PASS the saturated ramp-zero receipt (overflow 2^30 - 1024, identities exact) - if it
      fails that receipt, the gate itself is indicted before any interior reading.
    - >-
      BUILD IDENTITY RE-VERIFICATION WITH PRICED GATE-0X FALLBACK: the frozen build must be
      byte-identical (sha256) to the BATCH-e5d753 snapshot-certified build before any S0/S1
      reading arm; behavioral re-proof (Gate-0x field-exact rebuild) is the priced fallback -
      together they police that ZERO instrument change enters the seed-replication stage.
    - >-
      DECLARED-DIFF AUDIT + SURFACE-DIFF BATTERY (new, extension-specific): the extended
      build's source must differ from the frozen build by EXACTLY the pre-registered allowed
      diff (S2a-1, re-audited post-arm in S2b-4), and the extended freeze must reproduce all
      seven committed R3 digests byte-exactly while committing the k=3 digest PRE-ARM - the
      two controls together police that the extension adds one point and nothing else, and
      that no data-dependent table choice enters.
    - >-
      AMEND-1 COUNTER-IDENTITY SUITE ON EVERY ANALYSIS-BEARING RECEIPT (inherited, extended
      to extended-build receipts): ewhist_hit, an entirely uncapped second counter,
      corroborates h on every receipt; the full identity list (DEV-S0-1-corrected) is checked
      per receipt.
    - >-
      OVERFLOW-POSITIVE DETERMINISM DOUBLE ON THE EXTENDED BUILD: the truncation path is
      determinism-tested where it actually fires on the new binary (predicted overflow
      ~11,104 at k=1 log2N=20; k=0 fallback overflow-positive by construction). The frozen
      build's double is inherited transitively from BATCH-e5d753, not re-spent.
    - >-
      PRE-REGISTERED REPLICATION CRITERIA AS THE SEED CONTROL: the count sentence extends
      only under the committed band+count+ratio rule; disagreement is a declared branch,
      never absorbed; a new family point enters with two seeds from the start.
    - >-
      SCOPE-1 JOINT-EFFECT SCOPING AS THE SCHEDULE CONTROL (inherited): every comparison in
      this design is interior-to-interior at fixed AES schedule (constant across k >= 1 under
      PIN-T0, extended to k=3 by the same structural fact); the single confounded step
      (k=0->k=1) enters only as the anchor's zero; the separated control arm survives as the
      priced PINCTRL-1 successor (RANK 3, untouched).
    - >-
      FROZEN TABLE-FREEZE RE-VERIFICATION, PRE-ARM AND POST-ARM, ON BOTH BUILD SURFACES:
      R3 for the frozen build; R4 (committed pre-arm) for the extended build - no
      data-dependent table choice anywhere.
    - >-
      NO-REOPEN CLAUSE FOR THE CLOSED LANE (inherited): the X statistic is not tested,
      decided, or reported as a reading at any point; the instrument's e fields ride as
      enabling artifacts only. The t=1 frontier rho_80 = 0.1183 is carried as the standing
      sensitivity-floor control reading of the closed lane, reported beside, never merged.
    - >-
      SEED-DISCIPLINE (inherited + extended): readings per seed, never pooled; second seeds
      at 531002 everywhere (same-pair comparability); dead anchor at 531004; armid 11
      introduced for the new seat; the committed 531001/531002/531003 data enter only as
      inputs and endpoint references, never as new confirmatory evidence.
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST (inherited + extended): AMEND-1 verbatim, the CC
      decision rule with the count-agreement window, the CC8 criterion, the CC3 cascade with
      the declared-diff list and surface-diff battery, anchor order, seat tuples, admissible/
      inadmissible lists, scoping rule, resolution rule, floors, NARROW-1/2/3 verbatim, and
      the no-reopen clause committed write-once in S0-1 with mtime BEFORE the first arm,
      re-verified post-arm.

  confounders:
    - >-
      SCHEDULE CONFOUND AT k=1 (inherited, handled by SCOPE-1): every k=1 statement is
      joint-effect-scoped; interior-to-interior comparisons (including all new k=2/k=3/k=8
      readings) are schedule-clean. Stated, not absorbed.
    - >-
      SINGLE-DRAW INPUTS: the committed k=2/k=8/k=16 readings this design consumes are
      single-draw; their CIs carry that uncertainty into every derived quantity (the
      count-agreement window, the ratio CIs). The design addresses exactly this at k=2 and
      k=8 and declares it untouched at k=16.
    - >-
      SEED-PAIR SPECIFICITY: all replication content uses the single seed pair
      531001/531002; a COUNT-REPLICATED verdict is a statement about THESE two seed
      environments, not a population-level claim (n=2, priced non-detection 7).
    - >-
      PRIOR-AS-PREDICTION RISK: the k=3 multiplicative prior (lambda ~ 1759) is built on a
      decay chain whose authority is BROKEN (it predicted ~4e-7 at k=8 vs observed 13); the
      CC3 cascade is prior-free (branches defined on realized readings) and every prior usage
      is flagged in-line.
    - >-
      EXTENSION-SPECIFIC INSTRUMENT RISK: the extended build is a source modification; a
      perturbation hiding in the token/freeze diff would bias the k=3 reading. Mitigated
      in-record by the declared-diff audit (exact-diff requirement), the surface-diff
      battery (seven digests byte-equal), Gate-0x (aes seat field-exact), KAT byte-identity,
      and the extended-build dead anchor + determinism double; the cross-lineage battery
      (IDEA-20260901-02f7c4 B3) remains the programme-level mitigation, not discharged here.
    - >-
      PER-POINT RESOLUTION CEILING (inherited, re-applied): within-RESIDUAL trends are below
      the 2^30 per-point resolution; the tier-2 disjoint-CI rule declares exactly which
      consecutive comparisons are count-resolved; anything finer is priced in the obstruction
      block. Any claim finer than the declared tiers from this design's data is out of scope.
    - >-
      ANCHOR POWER LIMIT (inherited, requantified): the dead anchors at ~0-4 expected hits
      catch systematic hit manufacture, not subtle rate miscalibration; disclosed; the
      surface-diff battery is the second guard for the extension.
    - >-
      POSITION-FAMILY SPECIFICITY (inherited): one frozen nested family; the dose label k
      does not isolate WHICH positions matter (P_3 = {0,4,8} is the row-major first three;
      the layer autopsy IDEA-20260901-69912d consumes the located sub-interval).
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE TABLE PATH (inherited): all ramp arms share the
      widened table-driven path; build identity + KAT pins + source-diff audits + freeze
      re-verification are the in-record mitigation.
    - >-
      NULL-RATE DRIFT AT INTERIOR POINTS (inherited): the analytic null lambda_0 = 1.0 is
      pinned at the endpoints; at interior points the accidental-hit rate is recomputed
      run-internally from the arm's own class counters and reported beside the design-rate
      value; the bands are stated at the design rate and the executor reports any
      realized-null shift (disclosed, never smoothed).
    - >-
      DETERMINISM-AS-REPLICATION RISK (NARROW-3): the exact seed-531001 reproduction of any
      committed count that a diagnostic re-invocation might produce is determinism, never
      replication, and never validation of the BATCH-7b798d observations (AMEND-1 bars
      post-hoc rescue); the only replication content is the four new (seed, seat) draws.

  interpretation_limits:
    - >-
      claim_tier toy. A count-replication verdict licenses a sentence about the REPLICATED
      count decay for the pairs (1,2) and (2,4) within the tested nested position family at
      the pinned probe cell and PIN-T0 - never 'any S-box', never a carrier sentence about e,
      never a rho-exclusion, never a dilution-only attribution of h(1), never an extinction
      sentence, never anything about full-round or deployed AES.
    - >-
      A COUNT-REPLICATED verdict does NOT make the whole curve replicated: k=8 keeps one
      single-draw endpoint for the (4,8)/(8,16) pairs, k=16 stays single-seed, and the floor
      magnitude stays COUNT-UNRESOLVED. The replication sentence names its pairs.
    - >-
      A sub-localization verdict (C3Y) is a BAND-level refinement of the (2,4] localization;
      it does NOT locate the transition to a sub-point, does NOT resolve the count profile
      inside the located sub-interval (tier-2 content is report-only), and does NOT explain
      the MAGNITUDE of any reading.
    - >-
      The BATCH-e5d753 verdict is immutable: this batch's findings EXTEND or QUALIFY it with
      new scoped sentences; no outcome of this batch rewrites, rescopes, or re-composes
      SH2-MONOTONE-DECAY itself.
    - >-
      The BATCH-7b798d readings remain unvalidated observations under AMEND-1's
      no-post-hoc-rescue clause even where reproduced; they are never consumed by any branch
      conjunct of this record.
    - >-
      No published-frontier comparison in either direction; recalled references are pointers,
      never support. Timeouts, crashes, infrastructure failures are never negative
      mathematical evidence (rule 5).

  paraphrase_discipline:
    status: >-
      BINDING on this record and every downstream citation of this batch - NARROW-1/2/3 of
      DEC-20260902-7ad3d9 carried verbatim as the dispatch brief requires, plus the
      record-specific bars below.
    narrow_discipline_carried:
      - >-
        NARROW-1 (floor alive): every verdict sentence in and downstream of this batch carries
        the floor-is-alive statement - the residual floor (17/13/12 at k=4/8/16) is a
        decidable excess over the analytic null (P(h>=12 | lambda=1) = 8.3e-10; floor-vs-null
        power 0.989 at lambda=13); MONOTONE-DECAY and every extension of it are
        band-trajectory statements, never extinction.
      - >-
        NARROW-2 (count sentences need seeds): no count-level decay sentence without second
        seeds at the named k; after this batch the pairs (1,2) and (2,4) may carry count
        sentences ONLY if CC-AGREE fired (and then naming both per-seed ratios and CIs); the
        pairs (4,8) and (8,16) carry no count sentence in any outcome; the magnitudes 84.90
        and 8786.5 remain 'primary-seed-only until replicated' in every sentence drawn before
        S1 composes.
      - >-
        NARROW-3 (determinism is not replication): exact re-runs under identical seeds are
        instrument determinism, never independent replication; the only independent draws of
        this batch are the four new (seed, seat) combinations (531002 at k=2, 531002 at k=8,
        531001 and 531002 at k=3); no downstream citation may spend any exact reproduction as
        replication or as validation of the BATCH-7b798d readings.
    never_say:
      - never 'ramp closed' or any closure sentence about the ramp-shape question beyond the scoped branch verdicts
      - never 'extinction by k=4', 'decay completes to null', or any extinction sentence at any k (NARROW-1)
      - never 'count completion' as decay-to-zero completion - the batch name means replication-completion of the count sentence, stated wherever the name appears
      - never a carrier sentence about e; never 'zeros again'; never report X-lane fields as readings
      - never a count-decay sentence citing the BATCH-7b798d readings as validated evidence
      - never an attribution of h(1) or the k=0->k=1 drop to dilution per se (SCOPE-1 joint-effect scoping)
      - never 'the curve is seed-stable' as a whole-curve sentence (replication is named per pair)
      - never a sub-interval localization finer than the CC3 branch states (no (2,2.5] style sentence)
      - never present the exact-diff source change as an instrument improvement (it is a one-point surface extension, certified by the battery)
      - never present AMEND-1 as a retroactive validation of the BATCH-7b798d readings (no post-hoc rescue; prospective only)
    always_carry_scope: >-
      cell (amask=1, smask=1), r=5, PIN-T0, 2^30 per arm, frozen family subset
      {0,1,2,4,8,16} plus k=3 only if Stage S2 ran, seeds as run (531001 grid/k=3-primary,
      531002 second seeds, 531004 dead anchor), SCOPE-1 attribution, toy tier.

  heuristic_assumptions:
    - id: H1-Y
      statement: >-
        COUNT-COMPLETION DECIDABILITY: the batch lands in a determinate branch of the CC
        cascade at 2^30 per arm - the gates hold (AMEND-1 identities intact under
        truncation), the anchors pass, and the k=2 second seed lands in one of CC-AGREE /
        CC-COUNT-DISAGREE / CC-SEED-DISAGREE rather than halting; and if Stage S2 runs, the
        extended build certifies and k=3 lands in a determinate CC3 branch.
      rigorous_support: >-
        RIGOROUS PART - branch separation, the count-agreement window, scenario
        probabilities, and the floor-hook arithmetic are Poisson/Garwood computations (fresh
        code this session); the cascades are exhaustive and ordered by construction; the
        cap-independence of the admissible counters is source-verified
        (TASK-20260901-87a39b check_7, re-confirmed this session); the extension's
        no-perturbation argument is structural and battery-proven. WHAT IS HEURISTIC is the
        seed behavior at k=2/k=8/k=3: the replication priors assume the decay is a property
        of the table dose rather than the seed environment (MH1), which is exactly what S1
        tests; the k=3 band prior is flagged with a broken-authority extrapolation.
        DISTRIBUTION IMITATED - none named; the new arms ARE the validation.
      validation_plan: >-
        Stage S0 (build identity + anchors), Stage S1 (k=2 and k=8 second seeds + CC
        composition), Stage S2a (extension battery + freeze commitment), Stage S2b (k=3 both
        seeds + CC3 composition); additive content composed only after all executed readings.
      falsification_condition: >-
        FY1-FY8 (each outcome branch falsifies one mechanism family or records a determinate
        non-shape finding; CC3-RESIDUAL-COMPLEMENT and CC8 findings record undecided or
        orthogonal structure without falsification; gate/anchor/seed branches are determinate
        non-shape outcomes).

  obstruction:
    quantity: >-
      What this design does NOT resolve, stated as measured quantities: (a) floor-magnitude
      resolution (17 vs 13 vs 12 vs comparator 1.0); (b) count-level resolution of the (4,8)
      and (8,16) pairs; (c) schedule-vs-dilution decomposition at k=1; (d) k=16 seed
      variance; (e) sub-sub-interval localization inside (2,3] or (3,4]; (f) everything at
      k=3 if Stage S2 is gated out (CC-SEED-DISAGREE at k=2 or any halt).
    measured_value: >-
      Design-time (fresh computation this session; exact Poisson, Garwood Wilson-Hilferty;
      inputs are the COMMITTED BATCH-e5d753 readings): (a) Garwood 95% CIs at 2^30: h=12
      [6.2, 21.0], h=13 [6.9, 22.2], h=17 [9.9, 27.2] - pairwise overlap; the cheap pooled
      hook (25 hits on 2x2^30) gives per-2^30 CI [8.09, 18.45], still containing all
      candidates; 2^32 per point narrows relative half-widths only to ~30%; 4-seed pooling
      per point (~1.8 h baseline per point) is the robust route (RANK 2). (b) k=8 second
      seed adds one draw; CIs at lambda ~ 13 keep ~59-62% relative half-widths - (4,8)/(8,16)
      stay COUNT-UNRESOLVED in every outcome of this batch. (c) no committed arm separates
      schedule from dilution at k=1; cost = PINCTRL pin decision + full battery + >= 1 arm
      (RANK 3). (d) k=16 stays single-seed here; cost of seeding it = one ~27 min arm,
      deferred to the RANK-2 pooled design where it earns its exposure. (e) the extended
      family surface {0,1,2,3,4,8,12,16} caps localization at (2,3] vs (3,4]; sub-sub-
      intervals need further extension (no k=2.5 exists; cost = new decision + battery +
      arms, priced only if a decidable question survives). (f) if S2 is gated out, k=3
      contributes nothing and remains priced-open. Error bars: exact Poisson at stated
      lambda; Garwood approximate (relative ~1e-4 at small counts vs exact chi-squared per
      TASK-20260902-8074d8). Compare the standing closed-lane frontier consumed as control
      reading: rho_80 = 0.1183 at t=1 (EV-AES-896ef2) - a DIFFERENT observable's floor,
      reported beside, never merged.
    runs_read_from: >-
      Design-time computation from the committed BATCH-e5d753 receipts (EV-AES-868db1
      OBS-2/OBS-3 values) and fresh Poisson/Garwood computation this session; to be replaced
      by this batch's realized readings.
    scope_claimed: >-
      Toy tier, one probe cell (amask=1, smask=1), r=5 alive / r=6 dead anchor, frozen
      family subset {0,1,2,4,8,16} plus k=3 only if Stage S2 runs, 2^30 per arm, PIN-T0,
      seeds 531001/531002/531004. No claim beyond.
    resource_check:
      examined: true
      reading: >-
        Each unreadability is another lane's asset. (i) The floor-magnitude unreadability is
        the RANK-2 pooled-exposure design's reason to exist, repriced here with the declined
        cheap hook so RANK 2 starts from the arithmetic rather than the intuition. (ii) The
        (4,8)/(8,16) count unreadability is the same RANK-2 route's second input (same-point
        pooling resolves what cross-seed 2^30 arms cannot). (iii) The schedule confound is
        the PINCTRL-1 lane's asset (RANK 3): a validated, replicated decay curve makes the
        separated k=1 control a newly informative measurement of the schedule's own
        contribution. (iv) The k=3 sub-interval - once located by this batch - is the
        IDEA-20260901-69912d layer autopsy's input coordinate (which of positions {0,4,8}
        carries the sensitive dose). (v) The seed-variance measurement at k=2 (whatever its
        outcome) is the first data point for any future pooled or multi-seed design's
        variance budget. All five readings named in advance; none found unexamined.
      spawned_ids: []

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Four producer batches at demonstrated rates: ~4.2 h expected
      under the binding baseline (6 x ~27 min 2^30 arms + Gate-0x ~54 min + gates); declared
      cap 19800 s including the priced S0 Gate-0x fallback. Measured campaign hardware
      ~20-35 min total (optimistic-relative, disclosed).
    memory_exponent: >-
      O(1) per trial (table-driven direct evaluation; fixed histograms; per-hit detail capped
      at 256 records, already certified). No new per-trial storage.
    best_known: >-
      The committed BATCH-e5d753 curve is the baseline (band-level verdict, single-draw at
      k=2/k=8/k=16). No improvement claimed on any cost axis; the only delta is evidential
      (first replicated count-decay segment, first floor second-draw at k=8, first k=3
      measurement, first frozen-family extension under the AMEND-1 battery).
    hidden_overhead: >-
      Disclosed: implementation is a DECLARED two-line-class source change in Stage S2 only
      (one arm token, one freeze point; Stages S0/S1 are zero source change); the binding
      baseline hides the machine difference vs measured campaign rates (flagged
      optimistic-relative, binding as stated); the power tables hide the design-rate null
      approximation (run-internal recomputation reported) and the k=3 prior rests on a
      flagged broken-authority extrapolation; the extension battery's Gate-0x cost (~54 min)
      is charged in full, not amortized.
    tradeoff_note: >-
      Evidential tradeoff stated: 4 new 2^30 arms + battery buy count replication of the
      (1,2)/(2,4) segments, one floor second-draw, and sub-interval localization to (2,3] vs
      (3,4]; finer structure (k=5/6, k=12, third seeds, 2^32 per point, separated-schedule
      arm) costs ~27-108 min baseline each plus batteries and is named, not spent. No
      time-memory tradeoff in content.

  dominated_by: >-
    CHECKED ROW BY ROW against the DEC-20260902-7ad3d9 next_action frontier and the design
    alternatives named by the dispatch brief, across time, memory, and data/queries. ROW 1 -
