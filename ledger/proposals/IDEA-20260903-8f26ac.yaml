      single-draw readings among them carry their committed CIs and the single-draw flag).
      Executor re-derives all floors at each arm's run-internal null rate.
    q1_k2_second_seed_pricing: >-
      THE k=2 SECOND SEED IS NEARLY FREE AT BAND LEVEL AND INFORMATIVE AT COUNT LEVEL -
      priced honestly, stated before any reading (the RANK 1 power requirement). h(2)_531001
      = 149,371 sits deep in THRESHOLD: sd = sqrt(149,371) = 386.5, so a band departure
      (reading <= 99) is a 386.2-sd event under the realized rate, and even a -16% seed swing
      (the committed k=16 seed-variance scale, 14 vs 19) leaves 125,472 hits, 353.9 sd above
      the boundary. WHAT THE ARM CAN ESTABLISH: (i) the seed variance of the k1->k2 decay
      ratio - the count-agreement window (seed ratio in [0.9899, 1.0102], computed this
      session) means a replication verdict at ~1%-scale resolution, ~16x tighter than the
      committed k=16 variance scale; (ii) instrument rate stability across seeds on a NEW
      saturated mid-magnitude receipt (~148k overflow, the AMEND-1 saturated identity
      re-exercised at a new (seed, seat)); (iii) seed replication of the (2,4) count decay
      jointly with the committed k=4 seeds. WHAT THE ARM CANNOT ESTABLISH: it CANNOT move the
      band verdict (SH2-MONOTONE-DECAY is composed, committed, and immutable; the
      localization conjunct h(2) >= 100 is robust to a 353-sd swing); it cannot establish
      count-level AGREEMENT beyond the 1%-scale window (a true seed variance larger than ~1%
      reads as COUNT-DISAGREE - a determinate finding, not a failure); it cannot touch floor
      magnitude, sub-interval localization, or schedule decomposition. The red team's k=1
      observation ('band agreement is nearly free; it measures seed variance, not shape
      stability') applies verbatim to k=2 at band level; the count level is where the arm
      earns its ~27 minutes.
    q2_k8_second_seed_pricing: >-
      h(8)_531001 = 13 (CI [6.9, 22.2]), RESIDUAL. Under lambda=13: P(second seed reads
      NULLBAND <= 5) = 0.0107, P(AMBIGUITY 41-99) < 1e-6, P(THRESHOLD) ~ 0 - band-disagreement
      probability ~0.011, NOT free but low. The honest exposure: the true rate may sit near
      the CI's lower edge (lambda=6 is inside the committed CI), where P(NULLBAND) = 0.446 -
      so a NULLBAND second reading is a LIVE, PRICED possibility and a determinate finding
      (CC8-FLOOR-DEPART, the RT-J8 sensitivity realized), never an instrument alarm. The
      arm's information content: the first independent draw of the residual floor at k=8
      (floor seed-stability at band level), the only cheap test of the sensitivity the red
      team named (the band verdict implicitly depends on the floor never dipping below
      RESIDUAL), and one more within-point draw as input to the RANK-2 pooled design. It
      CANNOT resolve floor magnitude (13 vs 12 vs 17 stays overlapping-CI at 2^30 whatever
      the reading).
    q3_k3_pricing: >-
      FIRST-EVER k=3 measurement; the true lambda(3) is unknown and all four bands are live.
      Scenario table (exact Poisson this session): lambda=1759.4 (multiplicative
      extrapolation h(2)/84.90, FLAGGED - the same chain predicted ~4e-7 at k=8 vs observed
      13, so the chain's authority is broken and this is one prior among several) ->
      THRESHOLD ~1.0; lambda=1000 -> THRESHOLD ~1.0; lambda=300 -> THRESHOLD ~1.0;
      lambda=100 -> AMBIGUITY 0.487 / THRESHOLD 0.513; lambda=50 -> AMBIGUITY 0.914 /
      RESIDUAL 0.086; lambda=40 -> RESIDUAL 0.542 / AMBIGUITY 0.458; lambda=20.7 -> RESIDUAL
      0.9999; lambda=13 -> RESIDUAL 0.989 / NULLBAND 0.011. Design-time belief: P(THRESHOLD)
      ~ 0.55 (the decay has not completed by k=3), P(RESIDUAL) ~ 0.25, P(AMBIGUITY) ~ 0.12,
      P(NULLBAND) ~ 0.05, P(seed band disagreement) ~ 0.03 - flagged as prior, never bet on;
      the arm decides. SECOND SEED at k=3: under a RESIDUAL landing the disagreement mass
      concentrates where the true value sits on a band boundary (lambda=40: P(AMBIGUITY) =
      0.458 on each seed; lambda=100: ~0.50 split AMBIGUITY/THRESHOLD) - exactly the case the
      branch is designed to catch and record; under a THRESHOLD landing (lambda >= 300) band
      agreement is near-certain and the second seed measures seed variance at the new point.
      Either way the two-seed entry is information-bearing, and it keeps the NEW point from
      inheriting the single-draw gap this batch exists to cure.
    floor_hook_pricing_and_decline: >-
      The dispatch brief's cheap-hook candidate - pooled k=8+k=16 exposure at 2x2^30 (NOT a
      2^32 scale-up) - is COMPUTED AND DECLINED this session. Pooling the two floor points
      assumes the cross-point homogeneity that is ITSELF the unresolved question (17 vs 13
      vs 12), and the arithmetic shows zero sharpening: 25 hits on 2^31 gives per-2^30
      lambda_hat = 12.5 with Garwood CI [8.09, 18.45] - containing 12, 13, and 17
      simultaneously. Floor-vs-null needs no sharpening (already decisive single-arm:
      P(h>=12 | lambda=1) = 8.3e-10; P(h>=25 | lambda=2) ~ 1e-16; power 0.989 at lambda=13).
      The magnitude question (17 vs 13 vs comparator) requires same-point exposure pooling
      (4-seed per point, ~1.8 h baseline per point) or 2^32 per point (~108 min baseline) -
      both are the RANK-2 floor-magnitude adjudication design's route, repriced there, not
      here. No floor-hook arm is budgeted in this record; the k=8 second seed contributes one
      within-point draw to the RANK-2 input as report-only content, and the floor-magnitude
      question is explicitly DEFERRED to RANK 2.
    inherited_per_point_detection_floor: >-
      Unchanged from the lineage (re-derived this session): one-sided rejection toward excess
      at h >= 6; size P(h >= 6 | lambda=1) = 5.94e-4; power 0.084 at lambda=3, 0.384 at 5,
      0.554 at 6, 0.699 at 7, 0.809 at 8, 0.933 at 10, 0.950 at 10.5, 0.989 at 13, 0.9998 at
      19. DECLARED PER-POINT SENSITIVITY FLOORS: lambda_80 ~= 8.0, lambda_95 ~= 10.5 hits per
      2^30 - a NULLBAND reading excludes a per-point excess >= ~8-10.5 at 80-95% power and
      excludes NOTHING below that. Applied to k=3: a NULLBAND k=3 reading excludes lambda(3)
      >= ~8-10.5, and nothing finer.
    priced_non_detections: >-
      DECLARED BEFORE ANY READING, never smoothed: (1) floor magnitude (17 vs 13 vs 12 vs
      comparator 1.0) at 2^30 - overlapping Garwood CIs; the cheap pooled hook is computed
      and declined (CI [8.09, 18.45]); the RANK-2 route owns it. (2) Count-level resolution
      of the (4,8) and (8,16) pairs - the k=8 second seed adds one draw but CIs remain
      overlapping at 2^30; declared COUNT-UNRESOLVED in every outcome. (3) k=16 seed
      variance - NOT seeded in this design (beyond-scope re-measurement; the RANK-2 pooled
      design seeds it). (4) Schedule-vs-dilution decomposition at k=1 - PINCTRL-1, RANK 3,
      untouched. (5) Sub-sub-interval localization inside (2,3] or (3,4] - the extended
      family has no k=2.5; priced successor (further extension under a new decision, only if
      the located sub-interval carries a decidable question). (6) Anything below the
      per-point floors lambda_80/95 at NULLBAND points. (7) Seed variance of the k1->k2
      ratio beyond two seed environments - two draws MEASURE the variance at 1%-scale
      resolution; they do not ESTIMATE a population variance (n=2); third seeds are the
      priced successor if the two draws disagree.

