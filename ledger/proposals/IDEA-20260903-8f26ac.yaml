  integrity_gate_amend1:
    status: BINDING - committed verbatim in the S0-1 preregistration file before any arm
    verbatim_conjunct: >-
      Per DEC-20260901-6f9de3 AMEND-1 (ratified by RAT-2 of DEC-20260902-7ad3d9), the
      branch-1 conjunct 'hit_overflow > 0 on any analysis-bearing receipt ->
      invalid_measurement' is rescoped to 'counter INCONSISTENCY on an analysis-bearing
      receipt -> invalid_measurement', where counter inconsistency means (a) overflow !=
      hits - threads*HIT_LOG_CAP, or (b) any cap-independent counter (hits, W, ewhist_hit)
      disagrees with its internal identities, or (c) any analysis-bearing quantity is derived
      from the capped detail log rather than the counters. Pure cap truncation of the detail
      log with all counter identities intact is NOT a gate failure.
    evaluation_rule: >-
      Saturation-aware evaluation of conjunct (a), pre-registered as the STRICTEST reading,
      not a relaxation (inherited from 9e84ac): on every analysis-bearing receipt, overflow ==
      hits - logged_detail_records EXACTLY, where logged_detail_records == threads*HIT_LOG_CAP
      when hits > threads*HIT_LOG_CAP (saturated) and logged_detail_records == hits with
      overflow == 0 otherwise (unsaturated). Predicted saturation status: k=0 anchor saturated
      by construction (overflow 2^30 - 1024); k=2 seed2 saturated (predicted overflow ~148k);
      k=8 seed2 predicted unsaturated; k=3 seed1 saturated under the multiplicative prior
      (~1759 hits -> overflow ~735) but unsaturated if the realized reading is <= 1024 - both
      paths legal under AMEND-1 with the admissible set unchanged; k=3 seed2 likewise.
    counter_identities_checked_per_receipt:
      - sum(whist) == nontrivial_trials
      - h == sum(whist[1:]) where h = W_ge1_nontrivial
      - moment identity sum(W_ge1_by_word) == sum(W * whist[W])
      - sum(zhist) == nontrivial_trials (DEV-S0-1 CORRECTED form, source-verified; the literal '== trials' shorthand of 9e84ac is NOT carried - OBS-VAL-1 discharge)
      - sum(ewhist_all) == nontrivial_trials
      - sum(ewhist_hit) == h
      - sum(ewhist_miss) == nontrivial_trials - h
      - overflow == hits - logged_detail_records (saturation-aware form above)
    admissible_quantities_counter_derived: >-
      h(k), whist, W_ge1_by_word, zhist, all ewhist_*/ewbithist_*/ezdiag_*/ezoff_* class
      counters, hit_overflow, excess ratio h/excess_E under the frozen excess_E = 2^30
      convention, excess over the run-internal accidental-hit rate, Garwood 95% CIs (count and
      exposure only), band assignment, all identity checks, arm_table_concat_sha256 table
      digests. These survive cap truncation (source-verified, TASK-20260901-87a39b check_7,
      re-confirmed at source level this session).
    inadmissible_quantities_detail_log_derived: >-
      hit_e_detail records, hit_trials as a SAMPLE of hit structure, any distributional
      statement over hits derived from detail records, any X-lane computation. On saturated
      receipts the logged records are the FIRST 256 hits per thread - biased toward early
      trials, not a random sample. Retained as report-only enabling data under the no-reopen
      clause; NO branch conjunct consumes them, so AMEND-1(c) is satisfied by construction.
    extended_build_gate_scope: >-
      AMEND-1 governs receipts from the EXTENDED build identically: the declared source diff
      touches only the arm-token whitelist and the freeze emission, never the counter
      increment sites (affarm046ex.c:459-499) or the cap branch (:489-495); the source-diff
      audit (S2a-1) proves this pre-arm, and the identity suite runs on every extended-build
      receipt regardless.

  count_completion_decision_rule:
    status: >-
      BINDING - committed in the S0-1 preregistration file BEFORE any arm runs (the RANK 1
      decision-rule requirement; pre-registered, never post-hoc). Applies to Stage S1.
    inputs_frozen: >-
      Committed BATCH-e5d753 readings, consumed as inputs and NOT re-measured: h(1)_531001 =
      12,681,109 (CI [12,674,130.4, 12,688,090.5]); h(1)_531002 = 12,679,968; h(2)_531001 =
      149,371 (CI [148,614.5, 150,130.4]); h(4)_531001 = 17 (CI [9.9, 27.2]); h(4)_531002 = 21
      (CI [13.0, 32.1]); h(8)_531001 = 13 (CI [6.9, 22.2]). New readings this batch:
      h(2)_531002 (S1-1), h(8)_531002 (S1-2).
    band_criterion_k2: >-
      BAND-AGREE at k=2 iff band(h(2)_531002) == band(h(2)_531001) == THRESHOLD (evaluated on
      realized readings; the committed primary band is THRESHOLD, stated so the criterion has
      determinate content, but the rule itself compares realized bands).
    count_criterion_k2_garwood_overlap: >-
      COUNT-AGREE at k=2 iff the Garwood 95% CIs (campaign Wilson-Hilferty convention) of
      h(2)_531001 and h(2)_531002 OVERLAP: with CI_a = [148,614.5, 150,130.4] and CI_b =
      [L_b, U_b], overlap iff 148,614.5 <= U_b AND L_b <= 150,130.4. COMPUTED THIS SESSION at
      the realized magnitude: overlap holds exactly when the seed ratio
      h(2)_531002/h(2)_531001 lies in [0.9899, 1.0102] (disjoint-above threshold count
      150,891, ratio 1.01018; disjoint-below threshold count 147,858, ratio 0.98987) - the
      COUNT-AGREEMENT WINDOW, committed pre-arm.
    ratio_criterion_k2_per_seed_decay_ratio: >-
      Per-seed decay ratios r_s = h(1)_s / h(2)_s, evaluated WITHIN each seed environment
      (cross-seed mixed ratios are report-only, never decay statements - the schedule-derived
      key co-varies with the seed). r_531001 = 84.8967 with propagated CI [L(1)_531001/
      U(2)_531001, U(1)_531001/L(2)_531001] = [84.4208, 85.3759] (corner propagation from
      Garwood count CIs, the campaign convention of BATCH-e5d753 check_6); r_531002 =
      12,679,968/h(2)_531002 with CI [L(1)_531002/U(2)_531002, U(1)_531002/L(2)_531002].
      RATIO-AGREE iff CI(r_531001) and CI(r_531002) overlap. CHECKED IMPLICATION committed
      pre-arm: at the committed magnitudes the ratio criterion and the count criterion
      coincide to < 1e-4 in the ratio thresholds (the k=1 CIs are 0.055%-scale and shared
      across the comparison); if the realized readings ever separate the two criteria, the
      STRICTER reading wins (any disjointness -> COUNT-DISAGREE) and the separation is
      recorded per rule 8.
    verdicts_and_routing:
      - id: CC-AGREE
        condition: BAND-AGREE AND COUNT-AGREE AND RATIO-AGREE
        verdict: >-
          COUNT-REPLICATED. SH2-MONOTONE-DECAY is EXTENDED TO COUNT LEVEL for the pairs (1,2)
          and (2,4): the k1->k2 count-decay ratio is replicated across two independent seed
          environments within the declared resolution (both per-seed ratios reported with
          CIs); and since k=4 already carries two committed seeds, the (2,4) pair's count
          decay (primary-seed ratio 8786.5) acquires the same per-seed evaluation, reported
          under the identical disjoint-CI rule. NARROW-2's caveat is discharged for exactly
          these two pairs and NO others - (4,8) and (8,16) remain COUNT-UNRESOLVED in every
          outcome of this batch.
        routes_to: extend SH2-MONOTONE-DECAY to count level (scoped sentence, floor-alive statement carried per NARROW-1)
      - id: CC-COUNT-DISAGREE
        condition: BAND-AGREE AND (count CIs disjoint OR ratio CIs disjoint)
        verdict: >-
          COUNT-DISAGREE: a determinate seed-variance finding at k=2 at count level. The band
          verdict is unaffected (band agreement holds); the count-decay replication FAILS at
          the declared resolution; both per-seed tuples recorded, never pooled, never
          smoothed; the magnitude of the disagreement becomes the input to the successor
          design.
        routes_to: seed-disagreement branch at count level (inconclusive for replication); named successors (third seed at k=2 at 2^30 and/or a 2^32 k=2 arm under a new decision, Coordinator re-rank); Stage S2 still executes (a count-level disagreement is a finding, not an instrument indictment)
      - id: CC-SEED-DISAGREE
        condition: band(h(2)_531002) != THRESHOLD
        verdict: >-
          SEED-DISAGREE: no count-level sentence at k=2 of any kind. A band departure at the
          realized magnitude is a ~386-sd event (~354 sd under a -16% swing), so this outcome
          additionally carries an INSTRUMENT-LEVEL ALARM flag (the 9e84ac branch-5 k=1
          precedent applied to k=2): the table path, the stream derivation, and the seat
          digests are re-examined before any successor.
        routes_to: seed-disagreement branch at band level; Stage S2 BLOCKED (no family extension on a suspect instrument); named successors (third seed at k=2, instrument review, 2^32 arm under a new decision); Coordinator re-rank
    k8_criterion: >-
      ORTHOGONAL FINDING AXIS (evaluated after the k=2 verdict, never gates it): CC8-AGREE
      iff band(h(8)_531002) == band(h(8)_531001) == RESIDUAL - the floor is seed-stable at
      band level at k=8 (second independent draw of the live floor; the RT-J8-named
      sensitivity stands tested and untriggered; per-seed counts reported, CI overlap
      declared, never smoothed). CC8-FLOOR-DEPART iff h(8)_531002 <= 5 (NULLBAND; the only
      live departure direction - AMBIGUITY/THRESHOLD departures have probability < 1e-6 under
      any lambda consistent with the committed reading): a determinate FLOOR-INSTABILITY
      finding at k=8 that realizes the RT-J8 sensitivity (the band verdict implicitly depends
      on the floor never dipping below RESIDUAL; a dip on an independent draw qualifies the
      verdict's extension to the seed population, recorded with both tuples; the BATCH-e5d753
      verdict on grid {1,2,4,8,16} remains IMMUTABLE either way). P(departure) ~ 0.011 under
      lambda=13, but ~0.45 if the true rate sits near the committed CI's lower edge
      (lambda=6) - both are priced, neither is an instrument alarm (a ~2.2-sd reading is a
      finding, not a defect). Stage S2 executes under either k=8 outcome.
    determinism_clause: >-
      NARROW-3 binding: no seed-531001 re-run in Stage S1 contributes anything to this rule.
      The only replication content is the two NEW (seed, seat) combinations (531002 at armid
      3, 531002 at armid 6). Any diagnostic seed-531001 re-invocation anywhere in this batch
      (the S2a-6 determinism double is the only planned one, at log2N=20) is instrument
      determinism verification, never replication, and is recorded as such.

  family_extension_design:
    status: >-
      OPTIONAL STAGE S2 - included as COMPLEMENTARY (not dominant): it answers Q3
      (sub-interval localization), which the core seed-replication stage cannot answer, while
      the core stage answers Q1 (count replication), which no family extension can answer.
      The two stages are disjoint in information content and share the instrument lineage; S2
      is a separate stage from the seed replication with its own gates, battery, freeze
      commitment, and budget, gated on S1 (below).
    why_k3_only: >-
      k=3 is the UNIQUE point that splits the located half-interval (2,4] into (2,3] vs
      (3,4] - the dispatch brief marks it mandatory for sub-interval localization. k=5 and
      k=6 were considered and DECLINED with priced rationale: they sit POST-transition (both
      predicted RESIDUAL, within the floor regime); at lambda ~ 13-17 their 2^30 Garwood
      relative half-widths are ~59-62%, so they can move no band conjunct, cannot resolve the
      floor magnitude (17 vs 13 vs 12 stays overlapping-CI - that is the RANK-2 pooled
      route's question), and would cost two arm tokens + two freeze points + 2-4 arms
      (~1.4-2.8 h baseline) for no decidable question. If the (4,8] count-continuation
      question becomes decidable after RANK-2 exposure pooling, a successor extension prices
      k=5/6 with pooled exposure; this record does not. k=12 (frozen, armid 7 reserved)
      remains unspent for the reason it was unspent in 9e84ac: no load-bearing band question
      sits between the two floor points.
    declared_source_diff:
      status: BINDING allowed-diff list, committed in the S0-1 preregistration, audited in S2a-1
      items:
        - >-
          (i) arm-mode sbox-token whitelist: ADD token s3 mapping to ksel=3 (one else-if
          branch, mirroring the existing s1/s2/s4/s8/s12 lines at affarm046ex.c:843-847 of
          the snapshot-bound copy); the refusal message updated to name the admitted set.
        - >-
          (ii) FREEZE_KS: {0,1,2,4,8,12,16} -> {0,1,2,3,4,8,12,16} (one array entry; loop
          bounds 7 -> 8 in the point-emission loop at affarm046ex.c:744 and the cross-k-
          nesting loop at :776 of the snapshot-bound copy).
        - >-
          (iii) usage string and the freeze-mode header comment, naming the extended point.
        - >-
          NOTHING ELSE: no change to counter increment sites (:459-499), cap logic
          (:489-495), the schedule-pin block, stream derivation, receipt emission,
          pin/pinidentity/geom modes, or any table-construction function. The S2a-1
          source-diff audit must show EXACTLY this diff against the snapshot-bound source;
          any additional diff is CC3-GATE-FAIL.
    structural_argument_no_perturbation: >-
      set_diluted_tables(k) is a pure function of (k, POS_ORDER, global SBOX): adding k=3 to
      the freeze list and admitting token s3 cannot change the tables at any existing point
      (each point's 16 per-position tables are byte-determined), cannot change the
      POS_ORDER[0] schedule pin (k=3 >= 1, so the schedule is the AES table exactly as at
      every interior point - SCOPE-1 extends to k=3 by the same structural fact), and cannot
      change the endpoint seats (k=0 identity, k=16 AES). The battery below PROVES this
      rather than assuming it: the surface-diff battery requires all seven existing freeze
      digests to byte-match the committed R3 file, Gate-0x requires field-exact reproduction
      of the lineage aes receipt, and KAT pins are expected byte-identical.
    extended_freeze_commitment: >-
      S2a-4 runs the extended freeze mode and digests its output via the committed
      freeze_digest.py convention into a NEW write-once freeze file
      (R4_table_freeze_ext.json, task-scoped). SURFACE-DIFF BATTERY (pre-registered): (a) for
      every k in {0,1,2,4,8,12,16}, all per-position table sha256 digests, position lists,
      per_position_is_aes flags, bijection and nestedness checks MUST equal the committed
      R3_table_freeze.json values exactly - any mismatch is CC3-GATE-FAIL (the extension
      perturbed the frozen surface); (b) the k=3 entry (positions [0,4,8], per-position
      digests, bijection true, nestedness true) is committed in the same file with mtime
      BEFORE any k=3 arm (S2a-4 precedes S2b-2/S2b-3); (c) cross_k_nesting true over all
      eight points (P_3 subset P_4 structural); (d) the folded selfcheck mini-arms
      (selfcheck_identity_k0, selfcheck_aes_k16 at log2N=10) pass the committed assertions -
      the selfcheck_identity_k0 arm doubles as the extended build's identity-seat behavioral
      check (the declared diff provably leaves the identity path untouched; a 2^30 ramp-zero
      re-seat on the extended build is therefore DECLINED as redundant - the diff audit +
      selfcheck + Gate-0x cover every code path the extension touches). Post-arm (S2b-4) the
      freeze re-runs and re-verifies against R4 exactly.
    new_kat_pins: >-
      pin + pinidentity re-run on the extended build (S2a-3): EXPECTED byte-identical to the
      lineage KAT receipts (9ba9a3bf.../ff06c0c0...) since pin modes do not touch the
      dilution surface; pre-registered expectation with a divergence rule: any
      non-byte-identity is a field-level comparison under the allowed-diff list, and any
      semantic divergence is CC3-GATE-FAIL. The committed pins remain the reference; no new
      pin values are created.
    battery_on_extended_build:
      - {id: S2a-1, content: 'apply declared source diff, compile, source-diff audit vs the snapshot-bound source: diff must equal the declared list EXACTLY', cost: 'minutes'}
      - {id: S2a-2, content: 'GATE-0X EXTENDED REBUILD - (aes, r5, 1, 1, 2^30, seed 531001, armid 1, threads 2) field-by-field vs L1-AES-R5-P30 under the extended allowed-diff list (the interior-surface + token fields are the only additions)', cost: '~54 min baseline'}
      - {id: S2a-3, content: 'KAT pin + pinidentity on the extended build (byte-identity expected vs lineage KAT receipts; divergence rule pre-registered)', cost: 'seconds'}
      - {id: S2a-4, content: 'extended freeze run + freeze_digest.py -> R4_table_freeze_ext.json write-once commitment (surface-diff battery (a) vs R3; k=3 digest committed pre-arm (b); cross_k_nesting over eight points (c); selfchecks (d))', cost: 'seconds-minutes'}
      - {id: S2a-5, content: 'DEAD ANCHOR on the extended build - (aes, r6, 1, 1, 2^30, seed 531004, armid 1, threads 4): ANALYZED FIRST among extended-build alive readings; gate hits <= 8; tripwire >= 9 is CC3-F6', cost: '~27 min baseline'}
      - {id: S2a-6, content: 'DETERMINISM DOUBLE on the extended build, overflow-positive receipt - (S_1, r5, 1, 1, log2N=20, seed 531001, armid 2, threads 4) identical command twice; byte-identical modulo the preregistered timing strip set; predicted hits ~12,128, overflow ~11,104 (realized overflow must be > 0; k=0 log2N=20 fallback pre-registered if realized overflow = 0). NARROW-3 recorded: determinism check on the new binary, never replication', cost: 'seconds-minutes, 2 invocations'}
      - {id: S2b-2, content: 'k=3 SUB-LOCATOR primary - (S_3, r5, 1, 1, 2^30, seed 531001, armid 11, threads 4): FIRST-EVER k=3 measurement; overflow predicted saturated under the multiplicative prior (~1759 hits -> overflow ~735), unsaturated legal under AMEND-1 if realized <= 1024', cost: '~27 min baseline'}
      - {id: S2b-3, content: 'k=3 SECOND SEED - (S_3, r5, 1, 1, 2^30, seed 531002, armid 11, threads 4): UNCONDITIONAL within the stage - a new point enters this campaign with two independent draws, because this batch exists to cure single-draw count readings (NARROW-2/3 applied prospectively)', cost: '~27 min baseline'}
      - {id: S2b-4, content: 'post-arm freeze re-verification vs R4 (0 mismatches) + post-arm source-diff audit (diff vs snapshot-bound source must still equal the declared list) + CC3 sub-localization composition', cost: 'seconds-minutes'}
    sub_localization_decision_rule: >-
      CC3 cascade, committed pre-arm in S0-1, evaluated in FIXED ORDER after the S2b
      readings: (1) CC3-GATE-FAIL: any S2 integrity gate fails (declared-diff audit, Gate-0x
      extended, KAT, surface-diff battery, dead-anchor counter identities, determinism
      double, post-arm audits, or counter inconsistency on any extended-build receipt) ->
      invalid_measurement, HALT, repair (rule 5), never evidence about shape. (2) CC3-F6:
      extended-build dead anchor hits >= 9 -> boundary falsifier of the sealed verdict; HALT,
      escalate to claim-changing review (rule 12). (3) CC3-SEED-DISAGREE: band(h(3)_531001)
      != band(h(3)_531002) -> no sub-localization sentence; seed instability at k=3 recorded
      with both tuples; named successors (third seed at k=3, instrument review if the
      departure is >= 2 bands). (4) CC3-NONMONO-EXT: h(3) <= 5 (NULLBAND) on EITHER seed
      while the committed k=4 readings stay RESIDUAL -> the bandrank sequence on the EXTENDED
      grid {1,2,3,4,8,16} rises at 3->4 (rank 0 -> 1): a determinate non-monotone finding
      scoped to the extended family (the floor dips below the k=4 floor at k=3); the
      BATCH-e5d753 verdict on grid {1,2,4,8,16} stands unchanged and immutable; named
      successors (third seed at k=3, instrument review of the k=3 table path, re-rank).
      Evaluated before the sub-localize branches (the h <= 5 case is a subset of h <= 40;
      ordering plus the 6 <= h conjunct below make the branches disjoint - the
      DEAD-before-NONMONO resolution form of the 9e84ac cascade, inherited deliberately).
      (5) CC3-SUBLOCALIZE-LATE: h(3) >= 100 (THRESHOLD) on BOTH seeds -> transition localized
      to (3,4] at band level (refinement of (2,4]); count-level tier-2 content for pairs
      (2,3) and (3,4) reported per seed under the disjoint-CI rule, never consumed by the
      band sentence. (6) CC3-SUBLOCALIZE-EARLY: 6 <= h(3) <= 40 (RESIDUAL) on BOTH seeds ->
      transition localized to (2,3] at band level; the extended-grid bandrank sequence
      [3,3,1,1,1,1] is non-rising. (7) CC3-AMBIGUOUS: 41 <= h(3) <= 99 (AMBIGUITY) on BOTH
      seeds -> transition stays in (2,4] with ambiguity declared at k=3; named successor
      (third seed at k=3 at 2^30 and/or one 2^32 k=3 arm under a new decision, Coordinator
      re-rank). (8) CC3-RESIDUAL-COMPLEMENT: declared complement - any outcome matching none
      of the above (including mixed near-boundary readings not caught by branch 3), never
      force-binned, recorded as measured with named successors. EVERY CC3 outcome carries the
      floor-is-alive statement (NARROW-1) and the SCOPE-1 attribution rule; budget halts are
      resource_exhaustion, never readings (rule 5).

  design_time_power:
    computation_provenance: >-
      DESIGN-TIME COMPUTATION THIS SESSION (fresh python3, exact Poisson by direct summation,
      Garwood CIs by the campaign's Wilson-Hilferty chi-squared quantile convention; values
      overlapping TASK-20260902-8074d8's blind re-derivation reproduce it to all displayed
