  title: >-
    COUNT-COMPLETION DESIGN UNDER NARROW-1/2/3 - a second seed at k=2 converts the single-draw
    k1->k2 count decay (ratio 84.90) into a replicated one under a pre-registered
    band+count+ratio decision rule, a k=8 second seed guards the RT-J8 floor sensitivity, and a
    frozen-family extension to k=3 (fresh freeze digests committed pre-arm, full AMEND-1
    battery on the extended build) sub-localizes the (2,4] transition. BATCH-e5d753 composed
    SH2-MONOTONE-DECAY at BAND level (EV-AES-868db1): the hit-count excess decays monotonically
    with table dilution across the interior grid {1,2,4,8,16} at fixed AES schedule (SCOPE-1),
    the THRESHOLD->RESIDUAL transition localized to (2,4] at the maximal resolution of the
    frozen family, second seeds agreeing at k=1 and k=4. That verdict is immutable and is NOT
    recomposed here; its obstruction block names what stays open - the count-level decay is
    single-draw at k=2/k=8/k=16 (the 84.90 and 8786.5 ratios are primary-seed-only), the floor
    magnitude (17 vs 13 vs comparator 1.0) is COUNT-UNRESOLVED, and k=3 is absent from the
    frozen family so (2,4] cannot be sub-localized. DEC-20260902-7ad3d9 RANK 1 dispatches THIS
    record. The design: (D1, MANDATORY CORE) a second seed at k=2 (seed 531002, seat-fixed
    armid 3) under a pre-registered COUNT-COMPLETION decision rule - band agreement +
    Garwood-CI overlap + per-seed decay-ratio CI agreement, committed BEFORE any arm runs,
    routing to COUNT-REPLICATED / COUNT-DISAGREE / SEED-DISAGREE verdicts; (D2) a second seed
    at k=8 (optional under RANK 1, included: it is the only cheap test of the red-team-named
    sensitivity that the band verdict implicitly depends on the floor never dipping below
    RESIDUAL); (D3) a family-extension stage adding the single new point k=3 - the sub-interval
    locator that splits (2,4] into (2,3] vs (3,4] - with a declared minimal source diff (one
    arm token + one freeze point), a Gate-0x extended rebuild, KAT re-pins, an extended freeze
    commitment whose seven existing digests must byte-match the committed R3 file exactly
    (surface-diff battery) and whose k=3 digest is committed write-once PRE-ARM, a fresh dead
    anchor and overflow-positive determinism double on the extended build, and k=3 measured
    with BOTH seeds from the start (a new point enters this campaign with two independent
    draws, exactly because this batch exists to cure single-draw count readings); k=5/6 are
    considered and declined with priced rationale. POWER IS PRICED AT THE REALIZED REGIME: the
    k=2 second seed's band agreement is nearly free (~386 sd to the THRESHOLD boundary, ~354 sd
    under a -16% swing - the same near-freeness the red team noted at k=1); its information
    content is the seed variance of the 84.90 decay ratio (count-agreement window: seed ratio
    in [0.9899, 1.0102]) and it CANNOT move the band verdict - stated, not smoothed. The
    floor-magnitude hook is priced and DECLINED: pooled k=8+k=16 at 2x2^30 gives per-2^30 CI
    [8.09, 18.45], containing every candidate magnitude (12/13/17) - zero sharpening; floor
    magnitude is deferred to the RANK-2 pooled-exposure route. Every sentence in this record
    obeys NARROW-1 (floor alive, no extinction), NARROW-2 (no count-decay sentence without
    second seeds at the named k), NARROW-3 (determinism is not replication). NOTE ON THE BATCH
    NAME: COUNT-COMPLETION means replication-completion of the count sentence (seeds added at
    the named k), NEVER completion of the decay to null - the floor is alive (NARROW-1). Toy
    tier; no deployed-AES claim; no published-cryptanalysis comparison in either direction; NO
    X statistic, no carrier, no rho-exclusion; PINCTRL-1 untouched (RANK 3); no 2^32 arms
    (RANK 2's route); k=1/k=4 band agreements NOT re-measured (already replicated). Budget:
    four producer batches, 6 analysis-bearing 2^30 arms + the extension battery, ~4.2 h
    expected under the binding baseline (~27 min per 2^30 4-thread arm, ~54 min Gate-0x),
    declared cap 19800 s.

  object: >-
    TRACKED OBJECT - THE SEED-REPLICATION STATUS OF THE r=5 HIT-COUNT DECAY CURVE COMPOSED BY
    BATCH-e5d753, AND THE SUB-INTERVAL POSITION OF ITS TRANSITION. The tracked curve is
    unchanged in kind: k -> h(k) = number of W>=1 hit trials at fixed (r=5, amask=1, smask=1,
    2^30, seed family, PIN-T0) over the frozen nested position family S_k, grid
    {0,1,2,4,8,16}, with the committed BATCH-e5d753 readings as INPUTS (k=1 = 12,681,109 /
    seed2 12,679,968; k=2 = 149,371 single draw; k=4 = 17 / seed2 21; k=8 = 13 single draw;
    k=16 = 12 single draw; comparator lambda_0 = 1.0 per 2^30). This record asks three
    decidable questions of that curve, none of which BATCH-e5d753 could answer: (Q1) is the
    k1->k2 count decay (ratio 84.8967, primary-seed-only) seed-replicated? - decided by ONE
    new arm (k=2, seed 531002) under a pre-registered band+count+ratio rule. (Q2) is the
    residual floor seed-stable at band level at k=8, or does an independent draw dip below
    RESIDUAL (the RT-J8-named sensitivity the band verdict implicitly depends on)? - decided
    by ONE new arm (k=8, seed 531002). (Q3) where inside (2,4] does the THRESHOLD->RESIDUAL
    transition sit - (2,3] or (3,4]? - decided by the FIRST-EVER k=3 measurement, which
    requires a frozen-family extension (k=3 is well-defined as the first-3-position subset of
    the frozen order but carries no committed freeze digest and is not surfaced by the build's
    arm-token whitelist). WHAT IS DELIBERATELY NOT THE OBJECT: re-measurement of the
    already-replicated k=1/k=4 band agreements (barred by the dispatch brief); the floor's
    MAGNITUDE (17 vs 13 vs 12 vs comparator - priced and deferred to the RANK-2 pooled route;
    the cheap hook is computed and declined here); schedule-vs-dilution decomposition at k=1
    (PINCTRL-1, RANK 3, untouched); the zero-byte content of e on hits (X lane closed at t=1
    by EV-AES-896ef2, no-reopen clause); the hit-vs-miss wt(e) carrier split (363851 C1/C2
    unspent, not revived); any re-composition of SH2-MONOTONE-DECAY itself (immutable; this
    batch extends or qualifies it with new scoped findings, never rewrites it); finer points
    k=5/6 (declined with priced rationale); k=12; other cells, other round counts, deployed
    AES, 2^32 exposures.

  lossy_projection_test: >-
    Same projection as the committed lineage: (S_k, key, seed, stream) -> h(k) discards
    everything about each trial beyond its W>=1 outcome; the fibres are enormous; the loss is
    the point. TWO SHARP EDGES THIS RECORD OWNS. (1) REPLICATION RESOLUTION IS DECLARED, NOT
    ASSUMED: a count sentence about a pair (k_a, k_b) may be drawn only when BOTH endpoints
    have at least two independent seed draws AND the pre-registered agreement criteria hold;
    after this batch the pair (1,2) has two draws at both endpoints (k=1 from BATCH-e5d753,
    k=2 from this batch) and the pair (2,4) likewise (k=4 from BATCH-e5d753, k=2 from this
    batch); the pairs (4,8) and (8,16) keep at least one single-draw endpoint and stay
    COUNT-UNRESOLVED whatever this batch reads. Determinism re-runs of seed-531001 seats
    contribute ZERO to replication resolution (NARROW-3): identical seed/seat/build reproduces
    identical counts by construction, as BATCH-e5d753 demonstrated cross-batch; the only
    replication content is new (seed, seat) combinations. (2) THE FAMILY-EXTENSION EDGE: k=3
    is a deterministic function of the frozen order (P_3 = {0,4,8}, the first three positions)
    and its tables are byte-determined by the committed construction pin; what is NEW is the
    commitment - freeze digests that no batch has ever pinned - and the surface-diff battery
    proving the extended build perturbs nothing that was already frozen. The extension adds a
    point, not a degree of freedom: every existing digest must match the committed R3 file
    exactly, and the k=3 digest is committed before any k=3 arm runs, so no data-dependent
    table choice enters anywhere. A third owned loss, inherited: even with k=3 the transition
    localizes to a half-of-a-half interval ((2,3] or (3,4]) and never to a sub-point; the
    family has no k=2.5, and sub-sub-intervals are priced, not smoothed.

  claim: >-
    Three statements C1Y-C3Y, each with a determinate reading under the preregistered CC
    (COUNT-COMPLETION) cascade, NO carrier clause anywhere, and NO extinction clause anywhere
    (NARROW-1 binding).

    (C1Y) THE COUNT-REPLICATION VERDICT FOR THE k1->k2 DECAY (whichever CC branch fires).
    COUNT-REPLICATED (CC-AGREE): the k=2 second seed (531002, armid 3) lands in the same band
    as the committed primary reading (THRESHOLD), its Garwood 95% CI overlaps the committed
    CI [148,614.5, 150,130.4], and the per-seed decay ratios r_531001 = 84.8967 and r_531002 =
    12,679,968/h(2)_531002 have overlapping propagated CIs - then SH2-MONOTONE-DECAY is
    EXTENDED TO COUNT LEVEL for the pairs (1,2) and (2,4): the count decay is replicated
    across two independent seed environments within declared resolution, and NARROW-2's caveat
    is discharged for exactly those pairs (not for (4,8)/(8,16), which stay COUNT-UNRESOLVED).
    COUNT-DISAGREE (CC-COUNT-DISAGREE): band agreement but disjoint count or ratio CIs - a
    determinate seed-variance finding at k=2; no replicated count sentence; named successors.
    SEED-DISAGREE (CC-SEED-DISAGREE): band departure at k=2 (a ~386-sd event at the realized
    magnitude) - no count sentence of any kind at k=2; instrument-level alarm flag; named
    successors. Every outcome is a complete scoped result.

    (C2Y) THE FLOOR-STABILITY FINDING AT k=8 (reported beside C1Y, orthogonal axis). The k=8
    second seed either agrees in band (RESIDUAL, a second independent draw of the live floor -
    the RT-J8 sensitivity stands tested and untriggered) or departs (a NULLBAND dip is the
    live possibility, P ~ 0.011 under lambda=13 but P ~ 0.45 if the true rate sits near the
    CI's lower edge lambda=6): a determinate floor-instability finding that realizes the
    sensitivity the red team named, recorded with both per-seed tuples and named successors.
    Either outcome leaves the BATCH-e5d753 verdict on grid {1,2,4,8,16} IMMUTABLE - a k=8 dip
    would qualify the verdict's extension to the seed population, not rewrite the composed
    branch.

    (C3Y) THE SUB-INTERVAL LOCALIZATION (only if Stage S2 runs, whichever CC3 branch fires).
    k=3 measured with both seeds under the extended freeze commitment: CC3-SUBLOCALIZE-LATE
    (h(3) >= 100 on both seeds) localizes the transition to (3,4]; CC3-SUBLOCALIZE-EARLY
    (6 <= h(3) <= 40 on both seeds) localizes it to (2,3]; CC3-AMBIGUOUS (41-99 on both seeds)
    leaves it in (2,4] with ambiguity declared at k=3; CC3-NONMONO-EXT (h(3) <= 5 on either
    seed while k=4 stays RESIDUAL) is a band rise on the extended grid - a determinate
    non-monotone finding scoped to the extended family; CC3-SEED-DISAGREE records seed
    instability at k=3 with no sub-localization sentence. All statements scoped to the
    extended family {0,1,2,3,4,8,12,16}, one probe cell, toy tier, PIN-T0, at declared
    per-point floors, and ALWAYS carrying the floor-is-alive statement: the residual floor is
    a decidable excess over the analytic null (P(h>=12 | lambda=1) = 8.3e-10; floor-vs-null
    power 0.989 at lambda=13), NEVER extinction.

    (WHAT IS NOT CLAIMED) No re-composition or amendment of SH2-MONOTONE-DECAY (immutable);
    no count-level sentence about (4,8) or (8,16) in any outcome; no floor-magnitude sentence
    (17 vs 13 vs 12 vs comparator stays COUNT-UNRESOLVED; priced, deferred to RANK 2); no
    dilution-only attribution of h(1) or of the k=0->k=1 step (SCOPE-1 joint-effect scoping
    binds); no statement beyond grid+{3}, cell (1,1), r=5, 2^30, PIN-T0, seeds
    531001/531002/531004; no carrier/X-lane/rho-exclusion/deployed-AES sentence; no
    published-frontier comparison in either direction; no spending of any exact seed-531001
    re-run as replication (NARROW-3).

  mechanism: >-
    Inherited from the committed lineage with the post-verdict regime stated up front. The
    sealed verdict's single-factor contrast says death-vs-life at r=6 tracks the S-box within
    the tested subclass; BATCH-e5d753 established (at band level, SCOPE-1 attribution) that
    the surviving r=5 hit-count excess decays monotonically with the nonlinearity DOSE k
    across {1,2,4,8,16}: THRESHOLD at k=1 (joint-effect-scoped) and k=2, RESIDUAL by k=4,
    RESIDUAL through k=8 and k=16, with a live floor 17/13/12 that is a decisive excess over
    the analytic null. The mechanism candidates M1 (global fragility), M2 (tunable dose), M3
    (full-table collectivity) were re-read against that verdict in IDEA-20260902-9e84ac and
    are not re-litigated here. THIS record's mechanism question is finer: the decay CURVE that
    MONOTONE-DECAY describes is known only as a single-draw trajectory at three of its five
    interior points, and its located transition half-interval (2,4] is the coarsest the frozen
    family can produce. Two structural hypotheses ride on the new arms: (MH1) SEED-STABLE DOSE
    LAW - the per-step decay factor (84.90 at k1->k2) is a property of the table dose at fixed
    schedule, not of the seed-derived key/stream environment; predicts the k=2 second seed
    inside the count-agreement window (seed ratio in [0.9899, 1.0102]). (MH2) LOCATED
    SENSITIVE DOSE - the THRESHOLD->RESIDUAL transition sits at a specific dose step inside
    (2,4]; the multiplicative extrapolation h(3) ~ h(2)/84.9 ~ 1759 predicts the transition in
    (3,4] (k=3 still THRESHOLD), while a decay that completes earlier puts k=3 at or below
    RESIDUAL - both are live, all four k=3 bands are priced, and the arm decides between them
    at band level. A NULLBAND k=3 between a THRESHOLD k=2 and a RESIDUAL k=4 is the
    floor-dip/non-monotone reading (MH3-flavored), pre-registered as CC3-NONMONO-EXT. The
    mask-14 word-counter structure observed at k=1 rides as report-only enabling data exactly
    as in the predecessor; no branch conjunct consumes it and no carrier sentence is drawn
    from it.

