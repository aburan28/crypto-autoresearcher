  batch: EC-STRUCTURE-20260825
  cluster: 'C2-noncommutativity: where the quaternion analogy dies'
  title: 'THE NON-COMMUTATIVITY E^2 SUPPLIES IS SPLIT, AND SPLIT IS EXACTLY THE WRONG KIND: End^0(E x
    E) = M_2(K) IS a quaternion algebra over K, so the ledger''s ''ordinary curves have only a 2D commutative
    endomorphism ring'' framing is false above dimension one -- but its reduced norm is the determinant,
    an ISOTROPIC form, so KLPT-style small-norm search returns zero divisors and the Wesolowski route
    dies at a nameable point rather than at an absence'
  class: barrier
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'That End^0(E^2) = M_2(K) and that M_2 is the split quaternion algebra are standard and
    recalled. The proposed contribution is the diagnosis: this ledger''s structural characterization is
    stated as an ABSENCE of non-commutativity, and the correct statement is a presence with an isotropic
    norm form. Absence and isotropy have different escapes, which is why the distinction is worth a record.'
  claim:
    semantic_part: For ordinary E/F_p with End(E) = O in an imaginary quadratic K, End(E x E) = M_2(O)
      is non-commutative and End^0(E x E) = M_2(K) is a quaternion algebra over K; it is the SPLIT algebra,
      its reduced norm is the determinant, that form is isotropic, and the minima of any lattice reduction
      under it are rank-one matrices -- the projections onto the two factors -- which carry no isogeny
      information.
    evaluator_part: 'Unestablished: that isotropy is the BINDING obstruction rather than one of several.
      A complete argument must also show no other invariant of M_2(O) substitutes for the definite norm
      form in the KLPT/Wesolowski pipeline.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Record the correct structural statement: non-commutative endomorphism algebras are available to ordinary
    prime-field curves as soon as one leaves dimension one, at zero cost, by passing to E x E or E x E''.'
  - Locate the failure precisely. The definite quaternion algebra B_(p, infinity) of a supersingular curve
    has a POSITIVE-DEFINITE reduced norm of rank 4 over Q; that definiteness is what makes lattice reduction
    find genuinely small nonzero elements and what makes KLPT terminate.
  - 'M_2(K) is split: det(A) = 0 has nonzero solutions, so the norm form is isotropic and the ''shortest
    vectors'' are exactly the zero divisors -- rank-one idempotents, which are the projections E x E ->
    E already known for free.'
  - 'Draw the escape: what is needed is a SIMPLE abelian surface with definite quaternionic multiplication
    whose reduction relates to E. Over F_p such surfaces are supersingular, which routes to the unreachability
    pricing question rather than to a free resource.'
  - Verify computationally at toy scale that LLL on M_2(O) under the determinant form returns zero divisors,
    so the barrier is measured and not merely argued.
  lossy_projection_test:
    tracked_object: an element of the endomorphism order, tracked by its reduced norm
    what_is_discarded: everything about the element except its norm
    propagation: 'multiplicative: norms compose, which is what makes the object useful'
    verdict: 'PASSES the lossy-projection test but fails on a different axis: the object propagates, but
      on a split algebra its minima are degenerate. This is a useful demonstration that passing section
      2 is necessary and not sufficient.'
  predictions:
  - id: P1
    status: established_formula
    statement: End^0(E x E) = M_2(K) for ordinary E with End^0(E) = K.
  - id: P2
    status: established_formula
    statement: The reduced norm on M_2(K) is the determinant and is isotropic.
  - id: P3
    status: unestablished
    statement: Lattice reduction on M_2(O) under the determinant form returns zero divisors for every
      tested O, so the KLPT analogue produces no isogeny information.
  minimal_discriminating_test:
    status: specified_not_run
    test: For small discriminants D, build M_2(O) as a rank-8 Z-lattice, run LLL and BKZ under the determinant
      form, and classify the minima returned.
    pass: All minima are zero divisors (rank-one or nilpotent), for every tested D.
    fail: A non-zero-divisor minimum with small determinant that yields a nontrivial isogeny would refute
      the barrier and would be the interesting outcome.
  controls:
  - 'The same reduction on a maximal order in a DEFINITE quaternion algebra (supersingular case), where
    minima are known to be useful: the positive control that the instrument can find a good minimum when
    one exists.'
  - A random rank-8 lattice with an isotropic quartic form as a shape-matched null.
  - The commutative order O itself as the degenerate baseline.
  confounders:
  - The determinant is a quadratic form over K but a quartic form over Z; running LLL under the wrong
    form measures nothing.
  - Small D may be unrepresentative; D must be swept.
  - Zero divisors are trivially short, so a reduction that returns them is working correctly -- the finding
    is about the algebra, not the implementation.
  falsification:
    semantic: An ordinary prime-field curve whose E x E endomorphism order carries a definite reduced
      norm falsifies the claim outright.
    evaluator: A reduction bug scopes out that run only.
    not_falsification: Failure to run the reduction, or a timeout.
  why_this_is_not_a_variant: KN-FIND-7e4b90 records that the Wesolowski degree bound requires a 4D quaternion
    algebra and is therefore blocked. That is an absence claim. This record says the 4D quaternion algebra
    is PRESENT one dimension up and is the wrong one, which is a strictly sharper statement with a different
    escape (find definiteness, not find non-commutativity).
