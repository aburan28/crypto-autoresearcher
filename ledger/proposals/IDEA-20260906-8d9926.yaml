    "claim": "After all forced automorphism redundancy is removed, a folded relation system M=M0+UV^T with a cheaply invertible block core M0 and low-rank exceptional coupling r may reduce the linear-algebra stage from generic sparse iteration to r core solves plus a small Schur system. R3 module representation targets linear algebra only.",
    "mechanism": "The object is the informative relation module together with a certified decomposition into block core and exceptional coupling, paired with Sigma={row insertion respecting orbit labels, Schur elimination}. Partial-action: dependent orbit rows and solved interior coordinates are discarded; the Schur boundary and reconstruction maps retain exactly the constraints on remaining unknowns. The loss is of redundant relations, not unknown scalar information.\n\nFold known phi-orbits first and delete an independently selected gauge column so any claimed inverse has a specified nonsingular domain. Search for a partition making M0 block diagonal with bounded-size or independently certified fast-solve blocks, and certify M-M0=UV^T exactly. Solve Mx=b by core solves and the r-by-r matrix I+V^T M0^{-1}U; singular cases go through rank-revealing bordered systems and cannot be discarded. The new resource is low-rank coupling between already informative orbit blocks. Neither a visually circulant raw matrix nor a small minimal polynomial proves this decomposition exists cheaply.",
