idea:
  id: IDEA-20260828-55a0de
  question_id: RQ-MLKEM-003
  added: '2026-08-28'
  title: >-
    RQ-MLKEM-003 target #3 names "dual-attack AND HYBRID VARIANTS at these exact parameters, with
    all costs charged" — every "dual" proposal in this RQ's 25-record corpus concerns the
    FFT/statistical distinguisher, and none evaluates the combinatorial hybrid lattice-reduction
    plus meet-in-the-middle attack family at all: memory-charge the meet-in-the-middle table at this
    program's own per-entry convention and test whether any nonzero guessing split k*>0 beats the
    committed primal_bdd/RC.MATZOV baseline against ML-KEM's actual (dense, non-sparse) CBD secret
  class: algorithm
  claim: >-
    (A) THE GAP. Of the 25 filed RQ-MLKEM-003 proposals, every "dual"-attack record (5a4409, 0eb075,
    ba5bd8, 725f05, 58dfe7, 08eda1) concerns the statistical FFT DISTINGUISHER's score geometry.
    None evaluates the COMBINATORIAL hybrid lattice-reduction-plus-meet-in-the-middle attack family
    (Howgrave-Graham 2007; Wunderer's refined analysis, ePrint 2016/733; and the 2026 "enhanced
    hybrid decoding" line, Hou-Jiang ePrint 2026/366 — already present in this program via
    IDEA-20260821-bd7b6c under RQ-FRODO-3260cc, but there it is applied only to FHE parameter sets
    and FrodoKEM, to answer a DIFFERENT question: whether a claimed gain is ring-attributable,
    sparsity-attributable, or generic. bd7b6c never touches ML-KEM's own parameters or margins, and
    explicitly hands off to GOAL-MLKEM-003/004 if it strays into a core-SVP convention question.)
    (B) WHY ML-KEM'S SECRET MATTERS. ML-KEM's secret/error coordinates are drawn from a centered
    binomial distribution CBD_eta (eta=3 for ML-KEM-512, eta=2 for ML-KEM-768/1024), not a sparse
    ternary distribution. The zero-coordinate probability is 0.3125 (eta=3) or 0.375 (eta=2) — far
    denser than the sparse (mostly-zero) secrets for which hybrid attacks and the 2026
    enhanced-hybrid-decoding line report their largest reported gains (stated by Hou-Jiang, per
    bd7b6c's own transcription, specifically "for the sparse-secret setting"). Whether the classical
    hybrid attack gains ANYTHING over the committed pure-lattice baseline once its meet-in-the-middle
    table's memory is charged, AT ML-KEM's actual (dense) secret, is unexamined anywhere in this
    program.
    (C) THE CLAIM, FALSIFIABLE. For each FIPS 203 parameter set there exists a cost-minimizing
    combinatorial-guess dimension k* (possibly k*=0) for the hybrid attack against ML-KEM's actual
    CBD_eta secret, under a memory charge of 1 unit per stored meet-in-the-middle table entry (the
    same per-entry convention this program already applies to sieve memory, e.g. via EV-MLKEM-020's
    T*M^c framework or IDEA-20260821-46c09f's hard-budget reading), such that the resulting
    memory-charged cost EITHER (i) is dominated by the committed primal_bdd/RC.MATZOV cost at k*=0
    for all three parameter sets — closing target #3's hybrid flank as a clean negative rather than
    an unexamined one — OR (ii) undercuts it by a margin exceeding the smallest committed category
    margin (+1.276377 bits, ML-KEM-1024), meaning this program's matched baseline has been
    incomplete.
  mechanism: >-
    STAGE 0 (symbolic, zero compute). Transcribe the hybrid attack's cost formula from a primary
    source: Wunderer (ePrint 2016/733) is the standard reference for a fully-charged hybrid
    MITM-lattice attack parameterized by an ARBITRARY secret distribution's entropy (not only
    sparse-ternary), so the correct substitution for ML-KEM is CBD_eta's exact closed-form PMF, not
    a generic approximation. Separately, if IDEA-20260821-bd7b6c's own Stage-1 baseline-reproduction
    gate has by then succeeded on at least one Hou-Jiang parameter set, import that enhanced
    decoder's improved formula with credit, cross-checked against bd7b6c's own Stage-0 symbolic
    audit of whether the ring-degree factor N enters only through total dimension (in which case a
    module-LWE, non-power-of-2-cyclotomic instantiation collapses correctly) or through a genuine
    ring-specific acceleration ML-KEM cannot claim.
    STAGE 1 (baseline gate). Evaluate the formula at k=0; it MUST reproduce EV-MLKEM-020's committed
    primal_bdd/RC.MATZOV numbers (140.199 / 200.959 / 270.724 bits) to a declared tolerance before
    any k>0 cell is trusted.
    STAGE 2 (sweep). Sweep k over a declared grid from 0 to min(n, 64), computing (time, memory) at
    each k under the SAME memory-charging convention as k=0's baseline: time = max(T_BKZ(reduced
    dimension n-k), T_MITM(k)), memory = the meet-in-the-middle table size (sqrt of the number of
    Wunderer-style representative guesses over k CBD_eta coordinates), charged per entry.
    STAGE 3 (decision). Report the cost-minimizing k* and its total charged cost per parameter set,
    against the pre-declared threshold (the smallest committed margin, +1.276377 bits).
    STAGE 4 (price/budget separation, imported not re-derived). Report BOTH the price-optimal and
    the budget-optimal k*, per IDEA-20260821-46c09f's own price-vs-budget framework, to avoid
    reporting a memory-price-parameterization artifact as a genuine hybrid-attack advantage.
    STAGE 5 (conditional, may be skipped). If Stage-0's Hou-Jiang import succeeded, re-run Stages
    2-4 substituting the enhanced decoder's improved decoding-radius formula for the classical
    meet-in-the-middle step, and report whether the 2026 line changes the k*=0 verdict; if the
    import did not succeed, this stage is explicitly skipped and reported as skipped, not silently
    dropped.
  novelty_status: unverified
  citations:
    - ref: 'Howgrave-Graham, "A Hybrid Lattice-Reduction and Meet-in-the-Middle Attack Against NTRU", CRYPTO 2007'
      provenance: recalled
      claim: Original formulation combining lattice reduction on part of the secret with meet-in-the-middle guessing on the rest, against NTRU.
      verified_by: null
    - ref: 'Wunderer, "A detailed analysis of the hybrid lattice-reduction and meet-in-the-middle attack", J. Math. Cryptol. / ePrint 2016/733'
      provenance: recalled
      claim: >-
        Refined, corrected analysis of the hybrid attack parameterized by a general secret
        distribution (via a representation technique for counting matching partial guesses), giving
        a fully-costed time and success-probability accounting; existence and title confirmed via
        WebSearch, content not fetched this session.
      verified_by: null
    - ref: 'Hou, Jiang, "Careful with the Ring: Enhanced Hybrid Decoding Attacks against Module/Ring-LWE", ePrint 2026/366'
      provenance: internal
      claim: >-
        Reports complexity improvement by factor O(N), 17x-114x speedups on known broken instances,
        and up to 13-bit improvements in the sparse-secret setting on FHE parameter sets (JM22,
        CCKS23, BCKS24, CHKS25, AKP25); abstract fetched by IDEA-20260821-bd7b6c on 2026-08-21, paper
        body not read by either record.
      verified_by: "idea-generator subagent (read in full, ledger/proposals/IDEA-20260821-bd7b6c.yaml)"
    - ref: IDEA-20260821-bd7b6c (this repository, RQ-FRODO-3260cc)
      provenance: internal
      claim: >-
        Declares GOAL-FRODO-001's non-duplication rule reserving core-SVP conventions and
        memory-charged sieve cost for GOAL-MLKEM-003/004, and its own Stage-0 symbolic audit
        classifying every occurrence of the ring-degree factor N by whether it enters only through
        total dimension, through a genuine ring acceleration, or is a naming artifact — a
        classification this record explicitly imports rather than re-derives.
      verified_by: "idea-generator subagent (read in full)"
    - ref: EV-MLKEM-020 (committed evidence record, this repository)
      provenance: internal
      claim: 'Committed primal_bdd/RC.MATZOV cost: 140.199 / 200.959 / 270.724 bits at the three FIPS 203 sets; margins +2.800527 / +6.041285 / +1.276377 bits.'
      verified_by: >-
        Not independently opened this session; transcribed from verbatim quotations inside
        IDEA-20260821-374af4 and IDEA-20260821-46c09f, both read in full this session.
    - ref: IDEA-20260821-46c09f (this repository, RQ-MLKEM-003)
      provenance: internal
      claim: >-
        Formalizes the price-vs-budget distinction for memory-charged SVP-family cost comparisons: a
        linear price sweep can only ever select lower-convex-hull vertices, while a hard memory
        budget can select an off-hull point; this record's Stage 4 imports that framework directly.
      verified_by: "idea-generator subagent (read in full, first 661 of 1208 lines due to size cap)"
  assumptions:
    - "Wunderer's general-secret-distribution formula transfers correctly to CBD_eta's exact PMF without a separate re-derivation; if it does not, H1's toy-scale validation is expected to catch the mismatch."
    - "The meet-in-the-middle table's memory can legitimately be charged at the same per-entry convention this program applies to sieve memory; if the table's entries are a materially different data structure (e.g. requiring auxiliary indices), the charge may understate true memory and must be flagged."
  proof_search_map:
    bottleneck: >-
      Whether the marginal cost REDUCTION in the (n-k)-dimensional BKZ/sieve step, per unit increase
      in k, exceeds the marginal MEMORY-CHARGED COST INCREASE of the meet-in-the-middle table, per
      unit increase in k, at ML-KEM's actual CBD_eta secret and q=3329 — this crossover, if it exists
      at k*>0, is what this record locates.
    baseline_embedding:
      parameter_slice: "k=0 exactly reproduces the committed primal_bdd/RC.MATZOV baseline; this is the exact old-method boundary."
      reproduction_check: 'Numeric reproduction of 140.199 / 200.959 / 270.724 bits at k=0 to the same tolerance EV-MLKEM-020''s own validator used, before any k>0 cell is trusted.'
    observation_collision:
      observable: "The memory-charged total cost at the optimal k*, per parameter set."
      distinct_preimage_search: >-
        A k*>0 hybrid attack and the k=0 pure-lattice attack can produce IDENTICAL total charged cost
        by coincidence at a specific memory-price convention while differing completely in
        mechanism — exactly the price-vs-budget distinction IDEA-20260821-46c09f formalizes. Stage 4
        reports BOTH the price-optimal and budget-optimal k* to avoid reporting a
        price-parameterization artifact as a genuine attack advantage.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: "Wunderer's general-secret-distribution representation-technique count, specialized to CBD_eta exactly via its closed-form PMF."
        predicted_gain: "Either a confirmed k*=0 (closing the flank) or a computed, named bit-undercut at k*>0 — reported, not assumed."
    quantifier_order: >-
      FOR EACH FIPS 203 parameter set, THERE EXISTS a cost-minimizing k* in the declared grid such
      that no other k in the grid gives lower memory-charged total cost under the declared
      convention; the claim is existence-and-value of k*, not a statement uniform over all possible
      memory-charging conventions (46c09f's price/budget distinction is inherited, not resolved).
    method_ceiling:
      strongest_certifiable_claim: >-
        "At FIPS 203 parameters, under memory convention C, the cost-minimizing hybrid-attack split
        is k*, with charged cost Z bits, versus the committed k=0 baseline of W bits" — never a claim
        about non-hybrid attack families, and never under a convention other than the ones evaluated.
      nearby_object_control: >-
        A secret distribution with LOWER entropy than CBD_eta (e.g. an artificially sparsified
        ternary secret matching Hou-Jiang's stated target regime) is the nearby object where the
        hybrid attack is KNOWN from the cited literature to gain the most; the identical pipeline
        must reproduce a materially larger k* and gain there, or it is not sensitive to secret
        distribution and is broken.
    proof_obligations:
      - claim: "k=0 reproduces EV-MLKEM-020's committed cost to declared tolerance."
        responsibility: baseline
      - claim: "The representative-guess success probability is charged explicitly, not assumed to be 1 per attempt."
        responsibility: success_probability
      - claim: "Both price-optimal and budget-optimal k* are reported, per 46c09f's framework."
        responsibility: interface
      - claim: "No claim is made about non-hybrid, non-lattice attack families."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "memory-charged total cost (bits) at k=0 minus EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost, per parameter set"
      direction: different
      minimum_effect: 0.01
    - metric: "memory-charged total cost (bits) at the cost-minimizing k* minus the k=0 baseline, per parameter set"
      direction: higher
      minimum_effect: >-
        0 (i.e. we predict, but do not assume without computing, that k*=0 or that any k*>0 gain is
        small; a negative value — a genuine undercut — exceeding 1.276377 bits at any parameter set
        is the decision-relevant threshold per part (C))
    - metric: "cost-minimizing k* itself (dimension of the meet-in-the-middle guess), at ML-KEM's actual CBD_eta secret versus at a sparsified nearby-object control secret of matched total entropy"
      direction: higher
      minimum_effect: 5
  minimal_test:
    design: >-
      Stage 0-1 (reading plus low-compute scripting): transcribe and code Wunderer's formula with
      CBD_eta substituted exactly; reproduce k=0 against EV-MLKEM-020. Stage 2-4 (low compute, closed
      form evaluation over a k-grid, no lattice reduction actually run): sweep k, compute cost, report
      price- and budget-optimal k*. Stage 5 conditional and separately budgeted.
    controls:
      - "k=0 baseline reproduction gate, run before any k>0 cell is trusted."
      - "Nearby-object control (proof_search_map) confirming the pipeline is sensitive to secret distribution by reproducing a larger k*/gain on a sparsified secret."
      - "Cross-check against the existing bencrts/hybrid_attacks implementation surfaced this session (not yet read) as an independent formula source, if its license and interface permit reuse within budget."
    required_metrics:
      - "cost-minimizing k* per parameter set, price-optimal and budget-optimal separately"
      - "total memory-charged cost at k* versus at k=0"
      - "the signed gap against EV-MLKEM-020's committed margins"
  falsification_conditions:
    - "If k=0 cannot be reproduced within tolerance against EV-MLKEM-020, the formula transcription is wrong and no k>0 result is reportable."
    - "If the nearby-object (sparsified secret) control does NOT show a larger k*/gain than ML-KEM's actual CBD_eta secret, the pipeline is not sensitive to secret distribution and no ML-KEM-specific conclusion is trustworthy."
    - "If price-optimal and budget-optimal k* disagree at any parameter set, that disagreement itself is reported as a finding for IDEA-20260821-46c09f rather than resolved unilaterally here."
  confounders:
    - "Wunderer's representation-technique success probability is itself a heuristic quantity (H1); silently assuming probability 1 per meet-in-the-middle attempt would understate true cost."
    - "The meet-in-the-middle table's true implementation memory (indices, collision-resolution structures) may exceed the naive \"one entry per candidate\" charge; Stage 2 must state which convention it uses."
    - "If Hou-Jiang's enhanced decoder (Stage 5) cannot be imported within budget, Stage 5 is skipped and the record must not silently substitute the classical Wunderer formula while implying the 2026 line was tested."
  interpretation_limits:
    - "This evaluates one specific attack family (lattice-reduction-plus-meet-in-the-middle) against ML-KEM's exact parameters and secret distribution; no claim is made about other combinatorial-lattice hybrids not of this form."
    - "A finding of k*=0 for all three parameter sets is a clean, useful closure of target #3's hybrid flank, not a defect of the design; it should not be reframed as a negative outcome."
    - "No attack is implemented against a real key; all costs are closed-form estimates under a stated formula and memory convention."
  heuristic_assumptions:
    - id: H1
      statement: >-
        The representation-technique success probability per meet-in-the-middle attempt at
        guess-dimension k, against a CBD_eta-distributed secret restricted to those k coordinates,
        behaves like the corresponding probability for a distribution of the same per-coordinate
        entropy H(CBD_eta) that Wunderer's general derivation assumes, with H(CBD_eta) substituted
        exactly via CBD_eta's closed-form PMF.
      rigorous_support: >-
        Wunderer's combinatorial derivation of the representation count is stated for a general
        (not only uniform or ternary) secret distribution parameterized by its entropy/weight
        profile; the classical distribution being imitated is CBD_eta's own exact PMF (a scaled
        binomial difference, available in closed form), substituted rather than approximated.
      validation_plan: >-
        At toy scale (k up to 20-30 CBD_eta-distributed coordinates, small enough for exhaustive or
        Monte-Carlo verification), directly count achievable representative-partition matches by
        brute force and compare against Wunderer's closed-form prediction. Report the empirical-vs-
        predicted ratio and its trend as k grows, as the stated extrapolation basis to the FIPS
        203-scale k* — never claimed as a cryptographic-scale measurement.
  target_complexity:
    time_exponent: >-
      For split k, time = max(T_BKZ at core-SVP convention 2^{0.292*beta(n-k)} for the reduced
      (n-k)-dimensional lattice, T_MITM(k) ~ sqrt(N_reps(k)) where N_reps(k) is Wunderer's
      representation count over k CBD_eta-distributed coordinates) — a meet-in-the-middle/claw-
      finding decomposition of the bottleneck search, matching this program's own exponent-first
      search bias.
    memory_exponent: >-
      M_MITM(k) ~ sqrt(N_reps(k)) table entries, charged at 1 unit per entry, matching EV-MLKEM-020's
      memory accounting convention — the exact quantity RQ-MLKEM-003 target #3's "with all costs
      charged" requires and no filed proposal computes.
    best_known: >-
      EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost at k=0: 140.199 / 200.959 / 270.724 bits,
      which this record's k=0 evaluation must reproduce as its baseline gate.
    hidden_overhead: >-
      Wunderer's N_reps(k) hides its own success-probability bookkeeping per attempt (H1); the
      record must not silently assume probability 1 per guess, which would understate true cost.
    tradeoff_note: >-
      The hybrid attack is a time-memory tradeoff by construction along k: k=0 is the polynomial-
      memory (pure lattice) endpoint, larger k trades increasing MitM memory for a smaller reduced-
      dimension lattice problem — a DIFFERENT curve from IDEA-20260816-70e41d's enumeration/sieving
      memory-price curve and from IDEA-20260821-46c09f's assembled SVP-algorithm point cloud S. If
      this record's k* sweep produces an off-hull point relative to 46c09f's S, that hand-off is
      explicit, not absorbed here.
  dominated_by: >-
    EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost, unless Stage 3 finds k*>0 with a decisive
    undercut, in which case this record's computed hybrid cost becomes a new frontier point that
    IDEA-20260821-46c09f's hull would need to absorb — an explicit hand-off, not a silent one.
  sota_delta: >-
    0 bits if k*=0 for all three parameter sets; otherwise the exact bit-undercut computed at Stage
    3, reported per parameter set, never assumed in advance.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
