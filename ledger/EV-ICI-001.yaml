    determinism: {instance_hashes_identical: "216/216", kfix_argmin_flips: "45/216", slope_delta: 0.0085}
  gate_arithmetic:
    promotion_criterion: "any path fitted total exponent with bootstrap-90%-CI upper < 0.5 on >=4 ladder points"
    promotion_result: "NOT MET — crossbred upper 0.9138; MITM best family value 0.583 (t=12), t6 0.667, wall-fit t4 0.8234"
    falsification_criterion: "both paths CI-separated above 0.5, or CIs overlapping 0.5 with point estimates stable across the extension"
    falsification_result: "MET NUMERICALLY — crossbred CI [0.8692, 0.9138] entirely > 0.5; MITM family 0.583..0.75 all > 0.5; full-ladder point 0.8914 inside legacy-ladder CI [0.8210, 0.9323] (stable across extension)"
    stacked_constants_check: "MITM t=6 at n=256: gap 42.7 = the 'loses by 2^43' statement, now CI-backed; crossbred at n=256: loses by 2^100 (CI90 gap [94.5, 105.7])"
  observations:
    - "Crossbred total 0.8914 [0.8692, 0.9138] on the extended ladder (n<=26, 216 targets, 3 curves x 8 per n); legacy ladder reproduces the corpus 0.863 (0.8644)."
    - "MITM per-PDP work slope exactly 0.5; family 1/2+1/t swept gives 0.75/0.667/0.625/0.6/0.583 for t=4/6/8/10/12; honest wall-clock fit is worse (0.8234 at t=4) due to superlinear list/memory effects."
    - "Rho control on the same curves fits 0.498 [0.471, 0.522] — the baseline sits at 0.5 as required."
    - "T11-style matched null (certified shape-matched, hash-identical instances) is >= 2^13.2x harder than the Semaev system at n=12: structure yields a large constant win, not an exponent win."
    - "Same-seed re-run: instance generation bit-identical (216/216 hashes); metric noise within CIs (slope 0.5581 vs 0.5666)."
    - "Unexpected (analysis.md O1-O6): x-collision degeneracy in 2/216 (t=3) and 9/120 (t=4) planted targets (chain-inconsistent, fits unchanged when excluded); non-monotone cell medians across the k=ceil(n/3) plateau (n=24 < n=22); exponent drift is UPWARD with the extension (0.864 -> 0.891), opposite the bend-down hope."
  inference: >-
    Over the tested toy binary ladders, neither solver path's fitted total
    exponent approaches 0.5: crossbred 0.891 [0.869, 0.914], MITM family
    0.583..0.75 (wall-fit 0.823 at t=4), both CI-separated above rho's 0.5 with
    stable estimates past the legacy ceiling. The measured numbers satisfy the
    experiment's frozen falsification arithmetic; the stacked-constants
    'loses by 2^43' statement now carries bootstrap CIs. The status transition
    (supported/weakened/rejected_scoped) belongs to the Coordinator.
  boundaries:
    - "Toy binary-field curves F_{2^n}, n <= 26 measured (crossbred) / <= 24 (MITM); NOT crypto-scale (AGENTS rule 7)."
    - "Closes only the tested scope: t=3 crossbred and t=4-measured MITM 1/2+1/t family, this cost model, these implementations, seeds 1-3, 8 targets per cell, this budget (AGENTS rule 6)."
    - "n=28 MITM and the n=16 null are infrastructure-censored, not evidence; crossbred n=28/30 arm not executed (consolidation directive) — extension requirement met at n=22/24/26."
    - "Memory recorded (peak RSS <= 1.03 GB) but not priced into GB-seconds (legacy convention); MITM L1 list sizes recorded."
    - "The RQ's 'generic E/F_p' framing inherits the corpus convention: these binary-PDP exponents are the best-IC numbers being pinned; nothing here is a prime-field measurement."
  unresolved_confounds:
    - "Per-PDP cost in GB-seconds mixes algorithm and constant-factor machine effects; the work-unit and wall-clock fits (MITM) diverge (0.500 vs 0.573), so cost-model choice moves the MITM family by up to 0.07."
    - "k_fix sweep trimmed at fraction 0.15 with 6 s per-GB timeout (legacy: 0.1, 20 s); conservative direction, 0 bias-check fires, but unprobed splits at k >= 7 on the null leave its global optimum only bounded (>= ~7), not exact."
    - "2/192 rho walks unverified k (gcd fallback); ops counted."
  reviewed_by: coordinator
