    crossbred_total_exponent_t3: {point: 0.8914, ci90: [0.8692, 0.9138]}
    crossbred_total_legacy_ladder_nle20: {point: 0.8644, ci90: [0.8210, 0.9323]}
    crossbred_total_extension_arm_nge18: {point: 0.9250, ci90: [0.8654, 0.9619]}
    crossbred_ladder_points_measured: 9   # n = 10..26 step 2; legacy ceiling was 20
    crossbred_cells_measured: "27/27 (216/216 targets)"
    mitm_per_pdp_work_slope: {point: 0.5, ci90: [0.5, 0.5]}   # degenerate CI: exact combinatorial counts
    mitm_family_total_exponents: {t4: 0.75, t6: 0.667, t8: 0.625, t10: 0.6, t12: 0.583}
    mitm_wall_slope: {point: 0.5734, ci90: [0.5665, 0.5788]}
    mitm_wall_total_t4: {point: 0.8234, ci90: [0.8165, 0.8288]}
    mitm_ladder_points_measured: 5        # n = 8..24; n=28 partial (2/8) then censored
