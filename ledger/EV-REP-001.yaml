evidence:
  id: EV-REP-001
  hypothesis_id: H-REP-001
  experiment_ids: [EXP-REP-001]
  run_ids: [RUN-REP-001-c]
  type: empirical
  direction: weakens
  strength: preliminary
  observations:
    - "W_semaev (fair Weierstrass baseline, y-eliminated Semaev, x-membership): d_reg=2 flat across d in {4,6,8,12,16}, vdim=2, planted decomposition is a root."
    - "ED_x and ED_y (Edwards native): d_reg=2 flat, vdim=2, planted root verified — identical to the Weierstrass baseline at every d."
    - "W_native_x (Weierstrass collinearity, y explicit): d_reg grows 4->12 and vdim grows 10->34; this is a suboptimal formulation whose extra solutions are +-y sign branches, NOT a model property."
    - "Result identical across 3 seeds; Edwards->Weierstrass birational map verified on-curve."
  inference: >-
    The model-native solving degree of the m=2 membership-constrained point-
    decomposition problem is INVARIANT (d_reg=2) between the best formulation of
    the Weierstrass model (Semaev) and the twisted-Edwards model. The apparent
    Edwards advantage over the naive Weierstrass collinearity system is a
    formulation artifact (explicit-y sign branches), removed by the standard
    y-elimination. No sub-birthday exponent advantage from the curve model.
  boundaries:
    - "Toy: p=2^16, m=2, d<=16; NOT crypto-scale (AGENTS rule 7)."
    - "Curves admitting a twisted-Edwards model only; not generic Weierstrass."
    - "d_reg metric only; wall-time sub-ms, not exponent-informative here."
    - "m>=3 untested; the tie could in principle differ at higher arity (open)."
  unresolved_confounds:
    - "Whether d_reg=2 persists at m>=3 for both models (not measured)."
    - "Whether a different Edwards factor-base coordinate or a symmetrized
       (FHJRV) Edwards system changes total solve COST at fixed d_reg=2 by a
       constant factor (IC-5 says constant only; not re-measured here)."
  reviewed_by: coordinator
