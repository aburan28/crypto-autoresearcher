research_question:
  id: RQ-INC-001
  title: Can an output-sensitive incidence-reporting primitive over F_p^2 (duality + partition/range searching) list the s-rich lines of an EC factor-base chord arrangement with setup o(B^2) and output-proportional marginal cost, beating Theta(B^2) enumeration for relation harvesting?
  scope: {curve_families: [ordinary prime-field short-Weierstrass, prime-order subgroup], field_types: [F_p], bit_sizes: ["toy p in {211,1009,4099}"], methods: [m=3 chord incidence reporting, dual grid-bucketing, algebraic partition, exact enumeration baseline]}
  motivation: "Candidate A2 (research_directions_20260717.md). The ledger's measured floors (RT-1472 2LP exponent floor 2/3; NR-1471 explicit deck; NR-1434 B^4 explicit witnesses) all assumed enumeration or explicit materialization. RT-1472 names the loophole verbatim: implicit deck with setup o(L), query o(sqrt(L)). A2 proposes the first concrete primitive for that loophole; frontier A39 requires pair-output exponent alpha2 < 3/2 at B ~ q^{1/5}."
  decision_target: Whether a dual range-searching reporter shows measured output sensitivity (alpha2 < 3/2, setup o(B^2), complete-cost trend < 0.49) sufficient to promote A2 toward an m=4/5 scaling study.
  status: active
  owner: coordinator
