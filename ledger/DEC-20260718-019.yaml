coordinator_decision:
  id: DEC-20260718-019
  context: "EXP-SIG-003 link test: do EXP-SIG-002's non-rewritable syzygies generate the EXP-DREG Macaulay rank deficit?"
  decision: supported_scoped
  target_ids: [H-SIG-001]
  rationale:
    - "Exact decomposition identity measured on all sem cells: deficit_5 = A4 + residual_5 - 1, where A4 is the multiplication-closure rank of all lower-degree non-model syzygies (444/444/705) and residual_5 is a D5-born non-rewritable component (878/879/1,158); the -1 is the rankK5 shortfall vs null, replicated on an independent seed."
    - "The ENTIRE DREG rank deficit is thereby accounted for by non-rewritable syzygy structure — but NOT by the D4 family alone: closure covers only 33.6-37.9% and a full merge is arithmetically impossible (pre-registered bound 800/1,240 < deficit 1,321/1,862). The deficit has degree-born components at each degree."
    - "The closure amplifies ~14x/~18x per D4 extra syzygy; A4_id = 1 on every cell (D4 extras' identity embeddings absorbed by K5 — extras act through multiplies only); closure seed-stable while O(1) D5 seed variance localizes entirely in residual_5."
    - "Controls all pass: continuity anchors bit-exact (incl. seed-2026 reproducing the EXP-DREG-001 anchor 28,096/1,322); nulls show zero everywhere; determinism identical; the EV-SIG-002 1,321-vs-1,322 discrepancy confirmed as genuine instance variance, not instrument drift."
    - "Consequence: the Semaev systems deviate from semi-regularity through a growing, degree-born non-rewritable syzygy cascade — the structural-deviation branch of H-SIG-001 is strengthened, and the DREG deficit now has a mechanism (it is syzygy-born), though its n-asymptotics remain the open DREG question."
  evidence_refs: [EV-SIG-003, RUN-EXP-SIG-003-b, RUN-EXP-SIG-003-c, RUN-EXP-SIG-003-d, RUN-EXP-SIG-003-e, RUN-EXP-SIG-003-f, RUN-EXP-SIG-003-g, RUN-EXP-SIG-003-h, RUN-EXP-SIG-003-i]
  limitations:
    - "n in {12, 15}, D = 5 only; the decomposition identity is measured, not proved."
    - "Instrument caveat flagged by the executor: the pinned instrument's early-break reduce_against overestimates quotient ranks, so the true D4 residual series may EXCEED the anchored 9/10/13/14 (a lower bound) — affects EV-SIG-002's exact counts, not the existence or monotonicity claim at fixed instrument."
    - "No exploitability claim: whether this cascade lowers d_reg enough to beat rho remains the DREG/ICI question; ICI's CI-backed totals say no at measured sizes."
  next_actions:
    - "Dispatch EXP-SIG-004: re-measure the D4 residual series (n = 9..21, multi-seed) with the canonical-reduction fix; re-anchor the counts and confirm monotonicity with the corrected instrument."
    - "H-DREG-001 unchanged (inconclusive): the n-asymptotic question (deficit growth vs stall) still requires the n = 21 cell owned by the concurrent session; the mechanism link is now documented for its analysis."
    - "Theory note candidate: prove the degree-born non-rewritable cascade (the A4_id = 1 absorption and the residual_D birth process) for the boolean chained Semaev family."
  decided_by: coordinator
  decided_at: "2026-07-18"
