research_question:
  id: RQ-ICI-001
  title: >-
    What is the best achievable total index-calculus exponent on generic E/F_p
    — crossbred (~0.863) vs MITM (1/2 + 1/t ~ 0.667) — with bootstrap CIs at the
    largest feasible system sizes?
  scope:
    curve_families: [generic prime-field curves E/F_p (toy)]
    field_types: [prime field F_p]
    bit_sizes: [largest n feasible per solver path, pushed past the current ceiling]
    methods: [crossbred solver path, MITM solver path, full-cost accounting]
  motivation: >-
    The compat-aware stacked-constants KILL rests on point-estimate exponents
    (0.863 vs 0.667) without CIs; every "loses by 2^k at n=256" statement and
    the H096 gate inherit that uncertainty. AUTOLAB_TASKS T12 asks for the CI
    backing. (Source: HYPOTHESES_100 H014.)
  decision_target: >-
    Whether either solver path's fitted total exponent has bootstrap CI lower
    bound < 0.5 (alive) or both are CI-separated above 0.5 (quantified KILL).
  constraints:
    - Total-cost accounting (relation x solve), not solve-only.
    - Toy scale; AGENTS rule 7 applies.
  status: active
  owner: coordinator
