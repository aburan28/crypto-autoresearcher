evidence:
  id: EV-DREG-003
  hypothesis_id: H-DREG-001
  experiment_ids: [EXP-DREG-001]
  run_ids:
    - RUN-DREG-001-MEASURE-N17-SEM-A
    - RUN-DREG-001-MEASURE-N17-SEM-B
    - RUN-DREG-001-MEASURE-N17-NULL-A
    - RUN-DREG-001-MEASURE-N17-NULL-B
    - RUN-DREG-001-MEASURE-N17-NULL-B-CONT-1
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  observations:
    - >-
      Observation: both Semaev partitions processed all 314472 columns and
      returned exact rank 125099 against semi-regular prediction 126922,
      hence deficit 1823 (RUN-DREG-001-MEASURE-N17-SEM-A,
      RUN-DREG-001-MEASURE-N17-SEM-B,
      experiments/EXP-DREG-001/n17-sem-partition-comparison-v1.json).
    - >-
      Observation: the support-matched NULL-A run and logical NULL-B endpoint
      processed all 384168 columns and returned exact rank 126922, equal to
      the semi-regular prediction and hence deficit 0
      (RUN-DREG-001-MEASURE-N17-NULL-A,
      RUN-DREG-001-MEASURE-N17-NULL-B-CONT-1,
      experiments/EXP-DREG-001/n17-null-partition-comparison-v1.json,
      VAL-20260718-DREG-NULLB-CONT-001).
    - >-
      Observation: the original NULL-B parent stopped at 360000 of 384168
      columns and remains cancelled_by_budget, invalid as mathematical
      evidence, and retained only as checkpoint-lineage telemetry
      (RUN-DREG-001-MEASURE-N17-NULL-B).
    - >-
      Comparison: on this frozen n=17, D=5 instance, the Semaev deficit
      exceeds the support-matched null deficit by 1823. The Semaev n=17
      deficit is 39 below the n=15 value and 176 below the n=18 value, so the
      added point does not exhibit monotone or super-linear growth
      (EV-DREG-002).
  inference: >-
    Inference: the admissible data support only that this toy n=17 Semaev D=5
    Macaulay matrix has a partition-independent exact rank deficit relative
    to its support-matched null control. They do not satisfy H-DREG-001's
    scaling criterion and do not determine d_reg, d_ff, a complete ECDLP cost
    exponent, or a breakthrough.
  boundaries:
    - >-
      Limitation: one target, one seed, one toy boolean chained Semaev m=3
      system at n=17, D=5; the partition runs change chunk boundaries, not the
      curve instance, target, seed, or implementation.
    - >-
      Limitation: AMD-20260718-003 excludes timing and resource comparisons
      involving the checkpoint continuation.
    - >-
      Limitation: prelaunch checks completed before launch but their receipt
      was serialized afterward; a during-validation interpretation-label
      correction contributes no evidence; and no separate full launch-time
      dirty-tree snapshot was retained. Deterministic payload and lineage
      hashes independently pass (validation-report-n17-four-cell-v1.yaml).
    - >-
      Limitation: exact D=5 rank separation is not evidence that the solving
      degree differs from the null, that the observed deficit scales, or that
      any factor-base relation, factor log, masked-target descent, scalar, or
      discrete-log solution exists.
  unresolved_confounds:
    - >-
      Whether the Semaev/null deficit separation persists across independent
      curve instances, targets, seeds, and larger n.
    - >-
      Whether the low-degree syzygy mechanism affects d_reg or d_ff rather
      than only the measured D=5 rank.
    - >-
      Whether the non-monotone deficit sequence 1322, 1862, 1823, 1999 at
      n=12,15,17,18 is bounded, transitional, or resumes growth.
  reviewed_by: coordinator

