research_question:
  id: RQ-STR-001
  title: Can relation harvesting constrained to arithmetic-progression supports produce a low-displacement-rank (Toeplitz/Hankel-like) relation matrix whose structured solve beats generic sparse Wiedemann, after paying the AP relation-probability penalty?
  scope: {curve_families: [ordinary prime-field short-Weierstrass, prime-order subgroup], field_types: [F_p], bit_sizes: ["toy p in {211, 1009, 4099}"], methods: [AP-constrained relation harvesting, displacement-rank measurement, Wiedemann vs structured-solve cost model]}
  motivation: "Candidate A3 (research_directions_20260717.md): the ledger's closed linear-algebra territory is solver-side or post-hoc; no entry measures DESIGNED support geometry. If AP supports force O(1) displacement rank, superfast structured solvers O(alpha^2 * B * polylog B) beat sparse Wiedemann O(B * w) in the linear-algebra stage, B = rho 1/2."
  decision_target: Whether AP-constrained supports yield (a) measured displacement rank alpha = O(1) (vs growing like sqrt(B) or B) and (b) a relation-stage penalty < 1.5x at equal toy size, sufficient to cross the promotion gate (LA share of fully charged total cost < 10%).
  constraints: ["toy primes only; conclusions scoped to tested distribution", "B = ceil(sqrt(n))", "D = {1..64}", "m in {3,4}", "seeds 20260717..20260722"]
  status: active
  owner: coordinator
