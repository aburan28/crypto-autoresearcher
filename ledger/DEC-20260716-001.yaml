coordinator_decision:
  id: DEC-20260716-001
  context: >-
    EXP-REP-001 (RUN-REP-001-c) tested whether the twisted-Edwards curve model
    lowers the point-decomposition solving-degree SCALING below the matched
    Weierstrass Semaev baseline. Evidence EV-REP-001 shows the fair baseline
    (W_semaev) and Edwards native both sit at d_reg=2 flat, verified non-degenerate.
  decision: weaken
  target_ids: [H-REP-001]
  rationale:
    - "The frozen falsification criterion was met: Edwards d_reg equals the fair
       Weierstrass Semaev baseline (d_reg=2) at every tested d — no scaling advantage."
    - "The only Weierstrass arm that grew (W_native_x) is a suboptimal y-explicit
       formulation whose surplus solutions are sign branches; it is not the model's
       best formulation and does not represent the Weierstrass PDP."
    - "All d_reg=2 arms verified 0-dimensional with the correct planted decomposition
       as a root (dim=0, vdim=2, planted_root=True) — the low degree is a genuine
       solve, not a degeneracy."
    - "Consistent with the program-wide result: no in-bar (generic prime-field
       exponent-changing) signal; this is one more scoped negative."
  evidence_refs: [EV-REP-001, RUN-REP-001-c]
  limitations:
    - "Toy scale (p=2^16, m=2); scoped to Edwards-admitting curves; d_reg metric only."
    - "Negative closes ONLY this scope (AGENTS rule 6): does not prove all
       representations, all m, all factor-base choices, or all curves behave identically."
  next_actions:
    - "Set H-REP-001 status = weakened (model-native d_reg invariant at m=2, toy)."
    - "OPTIONAL follow-up (low prior): repeat at m=3 (chained), where the tie is
       untested; if both models stay d_reg-flat there too, close the representation
       program for solving-degree. Do NOT escalate to a scaling study on this evidence."
    - "Record the reusable finding: 'best formulation of each curve model reaches the
       same PDP solving degree; model choice is a constant-factor, not an exponent,
       lever' — reinforcing IC-5."
  decided_by: coordinator
  decided_at: "2026-07-16"
