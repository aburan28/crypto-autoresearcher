hypothesis:
  id: H-BKK-001
  question_id: RQ-BKK-001
  statement: Support-aware sparse elimination (mixed volume / polyhedral homotopy over the Newton polytopes of the target-sectioned Semaev family) makes the m-summation membership solver's complexity driver the mixed volume MV rather than the dense Bezout bound, with log MV / log Bezout < 1 strictly and persisting as m grows, reducing point-decomposition solving cost below dense-resultant growth (MX-1478 fit 1.979).
  mechanism: The monomial support of S_m(x_1..x_{m-1}; x_R) discards zero-coefficient monomials that dense methods pay for; if the Newton polytopes are proper subpolytopes of the degree box [0,2^(m-2)]^(m-1), the BKK bound MV = n!*Vol(Delta) is strictly below the multigraded Bezout count n!*D^n and sparse elimination inherits the smaller driver.
  assumptions: [target-sectioned Semaev system is the solver object, "dense baseline = multigraded Bezout n!*D^n (box root count)", "MV(Delta,...,Delta) = n!*Vol(Delta)", "relation probability unchanged (solver replacement only)"]
  predictions:
    - metric: "rho_m = MV/(n!*D^n)"
      direction: lower
      minimum_effect: "<= 0.85 at m = 5 and persisting/trending down in m"
    - metric: "solve-exponent ratio e_sparse/e_dense"
      direction: lower
      minimum_effect: "< 0.9 across sizes, trending down in m; combined charged exponent (RT-1476 supply) trending below 0.49"
  test_boundary:
    instances: ["E/F_p seeded random ordinary short-Weierstrass", "p in {101,431,1009}", "m in {3,4,5}", "seeds 20260717..20260719", "two targets per config (random + witness)"]
    parameters: {D: "2^(m-2)", n: "m-1", factor_base: "d_3=12, d_4=10, d_5=8"}
    implementation: experiments/EXP-BKK-001/bkk1_newton_mv.sage (exact evaluation-interpolation Semaev recursion, instrumented F_p-op counting, exact pulling-triangulation MV cross-checked with Sage volume)
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per_invocation_kill_seconds: 600}
  falsification_conditions:
    - "measured rho_5 >= 0.95 (Newton saturation: MV = Bezout; candidate's own disproof track)"
    - "solve-exponent ratio >= 0.9 or no sparse advantage in measured op counts"
  interpretation_limits:
    - "toy primes (p <= 1009, m <= 5, D <= 8); toy-curve evidence is not crypto-scale validation (rule 7)"
    - "sparse route implemented = support-aware evaluation/interpolation; polyhedral homotopy not implemented, but MV arithmetic caps all BKK-based algorithms"
    - "a valid negative closes only the tested scope (rule 6); a saturation proof for all m remains the candidate's disproof-track theorem"
  status: rejected_scoped
  proposed_by: coordinator-research-director
  alias: BKK-H-001
