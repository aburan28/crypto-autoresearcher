  gate_arithmetic: "Predeclared promotion gate: z > 3 at ALL three sizes p. Outcome: p=211 z=0.611; p=1009 cells z=4.079 (B=10) and 0.441 (B=16); p=4099 z not computable (B=8, no fittable exponent in either family), not computable as predeclared (B=16, se_ec=0; surrogate 0.52), z=0.954 (B=28). all_sizes_gt3 = FALSE. The single crossing cell (1009, B=10) has identical EC and random mean c_3 (1.0 vs 1.0, ratio 1.0) and k=3 vs k=5 fittable seeds; the z=4.08 there is a fit-conditioning/low-count artifact (3 near-identical EC tau values, se=0.09), recorded as an unexpected observation, not an excess signal."
  observations:
    - "No >3 SE exponent separation at p=211 (0.611) or p=4099 (<=0.954 / not computable); the all-three-sizes gate is not crossed."
    - "Mean 3-rich-line counts: EC at or below random in every cell (excess ratio 0.75-1.0); EC also 15-35% below its own uniform-x first-moment prediction at all fittable cells (within ~2 SE, systematic in sign; recorded, not explained)."
