    - "Grid controls are detected as massively richer at every cell (tau 2.5-3.3 vs 9.5-14.0; c3 4-80 vs 0-6.8; max richness up to 8) - the measurement resolves excess when present."
    - "Tau is un-fittable wherever no r>=3 line occurs (e.g. (4099,8): 0 such lines in 12/12 EC+random instances); richness mass sits at r in {2,3} at toy scale."
    - "p=1009 seed 20260721 x-set contains a 2-torsion x (M=19/31); handled by per-instance M matching."
  inference: "Over the tested toy instances, EC factor-base chord arrangements are statistically indistinguishable from the random null in richness profile: no exponent separation beyond noise at two of three sizes and no first-moment excess of 3-rich lines in any cell (ratios <= 1.0). This is consistent with the generic-ceiling (barrier) reading of candidate D3 at the tested scale and provides no measured opening for A2-class harvesting; the Coordinator decides status."
  boundaries: ["Toy ordinary prime-field curves, p in {211,1009,4099} (~2^8..2^12), one seeded curve per prime; x-set FB, B <= 28 (M <= 56); 6 seeds; exponent fit is effectively a two-point fit dominated by c3 noise at these sizes; negative result closes only this tested scope (rule 6) and is not a proved bound - the candidate's proof-track gate path remains open."]
