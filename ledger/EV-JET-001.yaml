  controls_outcome:
    POS-1: "PASS: 0/3133 S3-chain-vs-EC relation-set mismatches; 3133/3133 relations EC-witness-verified; branch-hit counts within [0.5, 2] of the combinatorial law (ratio 0.876-0.973 per size) - standard S3 harvester reproduces ledger relation counts."
    NEG-1: "PASS: 1200 EC-verified random non-relation tuples; screen survival 1.0000 = measured sigma; 0 relations claimed on non-relations; 0 true relations killed (no false negatives, no leakage)."
  gate_arithmetic:
    exponent_prong: "three-gate-size log-log fit (18 pts): classical 1.0616, 95% CI [0.9984, 1.1249]; tangent 1.0240, 95% CI [0.9615, 1.0865]. Gate needs <= 0.49 with 1/2 excluded at 95%. Measured ~1.0; 0.49 and 0.5 far below both CIs - crossing excluded in the direction opposite to promotion. Stress-inclusive 24-pt fits: 1.1197 [1.0750, 1.1644] / 1.0837 [1.0389, 1.1284]."
    ratio_prong: "gate needs >= 4x per-relation cost ratio at equal hit rate sustained across all sizes; measured 0.7733 / 0.7931 / 0.8151 (gate sizes), 0.8402 (stress) - tangent-split is 16-23% MORE expensive per relation at every size (C_lin/C_nonlin overhead 29.3% / 26.1% / 22.7% / 19.0%)."
    prongs_crossed: none
  observations:
    - "sigma = 1 exactly: the eps-block (2 equations, 4 jet unknowns, triangular Cramer determinant duF0*dx3F1) is a nonzero polynomial for every candidate; its coefficients depend on the unknown zeroth-order solution, so its only a-priori-executable form is formal consistency analysis, which never rejects. The epsilon-system is implied by the zeroth-order data - the candidate's anticipated fatal obstruction #1, measured."
    - "sigma_w = 0/3133: no relation solution is jet-degenerate, so the genuine-tangent-witness reading collapses the relation probability - obstruction #2, measured."
    - "C_lin + sigma*C_nonlin > C_nonlin at every size (screen is pure additive overhead); trade dead in both regimes."
    - "Unexpected: measured p_m falls below the cost-model estimate B^2/(2n) by 1.18-3.66x, growing with size."
    - "Unexpected/context: EC-arithmetic membership costs ~116 op-equiv/pair vs 388-599 for the polynomial S3-chain (different operation types; context only)."
    - "Classical-route charged-cost toy exponent ~1.06 (cost ~ n at fixed B per size; LA/descent degenerate at toy scale)."
  inference: "No improvement meeting the predefined threshold was observed over the tested instances, parameters, solver, and resource budget. Over the tested toy distribution the first-jet tangent screen carries no information beyond the zeroth-order summation equation and adds measured overhead; both screen regimes fail the promotion gate by large margins."
  boundaries:
    - "Toy prime fields p <= 1009 (~2^10), m = 3, x-interval factor bases B <= 40, 6 seeds (24 instances), op-counted schoolbook cost model with stated LA/descent toy proxies."
    - "Scoped negative (rule 6): closes only candidate A1 as specified - the m=3 prime-field tangent-split at the tested sizes. Does not address higher m, Weil-restriction/descent settings where EC addition is unavailable locally, other jet orders, or crypto-scale fields (rule 7)."
    - "The measured toy exponent ~1.0 is a fixed-B toy-regime artifact, not the crypto-scale 1/2 bar; the gate comparison stands on its own terms."
  unresolved_confounds:
    - "Op-count convention (schoolbook, inv = 10 mul-equiv) favors neither route but constant-factor choices could shift C_lin/C_nonlin at the tens-of-percent level; the 4x gate margin makes this immaterial to the outcome."
    - "Whether a fundamentally different (non-summation-variety) jet formulation could yield sigma < 1 is outside the tested scope; see candidate D1's model question."
  reviewed_by: coordinator
