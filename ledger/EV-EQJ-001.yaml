  observations:
    - "Per-block relation masses w_lambda (exact, Parseval-verified 9/9 cells): exactly 4 of 10 isotypes carry nonzero mass at every cell — trivial, sign_prod, irrep_7_dim3, irrep_9_dim3; the other 6 are exactly zero. Zeros are structurally forced: the fiber relation indicator is S_3-invariant (sum is permutation-invariant), and exactly these 4 B_3-irreps have S_3-fixed vectors."
    - "Negative control: EC per-block profile lies outside the 8-draw random-subset null envelope for all 10 blocks at all 9 (p, seed) cells (|z| = 7.5..152). The candidate's not-EC-specific kill condition is NOT triggered."
    - "Ranks (mod n, Sage-audited, QQ-confirmed): r_full = 12/12/12 (p=211), 12/10/10 (p=1009), 11/11/14 (p=4099). Every surviving block has r_lambda = r_full exactly (rank does NOT split); sum r_lambda^3 = 4*r_full^3 at all 9 cells."
    - "Distinct-row collapse (audit): fiber relations collapse to 64-67 (p=211), 12 (p=1009), 11-15 (p=4099) distinct coefficient rows; rank_full ~ #distinct rows; small-integer kernel vectors recorded where distinct_rows > rank."
    - "Storage: orbit compression N/orbits_hit = 7.61/8.81/6.69 (p=211), 5.41/6.74/4.95 (p=1009), 5.85/6.00/5.56 (p=4099) — >= 4x at every cell, and EC-specific vs null (null: 4.3-4.5x at p=211, 1.30-1.41x at larger p), driven by near-full-orbit arrival of relations."
    - "Blind descent: full-column-rank flags TRUE for each surviving block whenever r_full = k (p=211 all seeds; p=1009 seed 20260717); elsewhere r_full < k due to the distinct-row collapse. DLP recovery: baseline and orbit-scan modes both recovered the exact seeded secret in 9/9 instances (equal recovered targets: YES)."
    - "Gate arithmetic: LA factor (all-blocks) = 0.25 exactly at all cells (4x loss); LA factor (single-sufficient-block) = 1.0 (no gain); storage reduction 4.95-8.81x; combined all-blocks 1.24-2.20 (< 4x); combined single-block 4.95-8.81x (>= 4x) but with LA component = 1.0 and the storage component being the pre-existing FHJRV symmetrization factor. Charged-cost exponent proxies (toy, unit charges): baseline slopes -0.341/-0.412/-0.080, B3 slopes -0.148/-0.177/+0.096 vs log p — non-monotone toy artifact (N falls ~ (2k)^4/p at fixed k); no crypto-scale exponent claim supported."
    - "Controls: Parseval, block-matrix conservation mod n, relation spotchecks, character orthogonality, numpy-vs-Sage rank crosscheck, independent audit script — all pass. No timeouts, no deviations from frozen protocol."
  inference: "The isotypic block structure of the m=4 fiber relation space is strongly EC-specific (null kill condition not met), but its measured content is forced S_3-permutation invariance: 6 blocks are exactly empty, and the 4 surviving blocks each carry the FULL column rank, so block-restricted LA costs 4x the baseline (sum r^3 = 4 r_full^3) with no rank-arrival saving. The only measured reduction is orbit-compressed storage (5-8.8x), which is precisely the symmetrization factor FHJRV already exploits — consistent with the candidate's red-team line (B3 = FHJRV symmetrization with bookkeeping). Under the all-blocks accounting the >= 4x LA+storage promotion gate is not crossed (1.24-2.20x); under the most favorable single-block accounting it is crossed only via the pre-existing storage factor with zero LA gain. Executor reports numbers; the Coordinator assigns the hypothesis state."
