research_question:
  id: NET-RQ-001
  title: "Does the elliptic-net (EDS) representation supply k-dependent relations below the birthday bound?"
  scope:
    curve_families: ["ordinary prime-field, prime-order subgroup, char >= 5", "exclude singular curves and small embedding degree (pairing channel)"]
    field_types: ["prime fields F_p"]
    bit_sizes: ["toy: p in {101, 431, 1601} (7-11 bits)"]
    methods: ["elliptic divisibility nets (Shipsey/Stange)", "Somos-collision relation sieve", "index-calculus-style relation supply measurement"]
  motivation: >
    Candidate B1 (research_directions_20260717.md): Somos-type quadratic identities give a
    two-parameter family of exact multiplicative relations among net terms -- relation
    supply without per-relation search. If this supply arrives sub-birthday, the net
    domain could beat the generic rho bound; if it is birthday-equivalent, the net is a
    relabeling inside the generic model and Shoup's bound closes it.
  decision_target: "promote B1 to a scaling study, or close it as a scoped negative (generic representation)"
  constraints: ["toy evidence closes only tested scope", "equal op-budget accounting vs BSGS baseline", "mandatory positive/negative controls"]
  status: active
  owner: coordinator
