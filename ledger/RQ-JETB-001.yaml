research_question:
  id: RQ-JETB-001
  title: Does first-order jet (dual-number) data of the EC addition law give relation-generation algorithms any power beyond the generic group model, or is the augmented jet oracle simulable with O(1) overhead — closing all dual-number candidates (A1 family) at exponent 1/2?
  scope: {curve_families: ["ordinary prime-field short-Weierstrass, non-anomalous, prime-order subgroup"], field_types: [F_p], bit_sizes: ["toy p in {101,211,431} for certification; target claim is model-level"], methods: ["augmented Shoup generic model with tangent oracle", "x-only Semaev summation varieties m=2,3", "dual-number arithmetic over F_p[eps]/eps^2", "formal-group linearization"]}
  motivation: Candidate D1 (research_directions_20260717.md). If jet algorithms are simulable generically with O(1) overhead, Shoup's Omega(sqrt(n)) lower bound extends to the whole jet family and A1 is closed at exponent 1/2; if simulation fails, the exact non-simulable operation is the loophole A1 must exploit. Candidate ledger ref JETB-TH-001.
  decision_target: Whether the toy certification matches the simulable-model prediction (barrier evidence) or exhibits an explicit non-simulable operation (candidate loophole), as numbers for the Coordinator's proof-track decision.
  constraints: ["self-contained measurement (no dependence on EXP-JET-001 outputs)", "toy scale only", "exact primes/seeds from the frozen specification"]
  status: active
  owner: coordinator
