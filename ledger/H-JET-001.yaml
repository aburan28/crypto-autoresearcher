hypothesis:
  id: H-JET-001
  question_id: RQ-JET-001
  statement: Over F_p[eps]/eps^2, the eps-block of the EC addition law is F_p-linear in the jet coordinates, so m-point relation generation can be split into a cheap exactly-linear tangent screen (cost C_lin, survival sigma) plus a nonlinear residual, with C_lin < (1-sigma)*C_nonlin at equal hit probability p_m - reducing per-relation cost below the serial-S3 harvester at identical factor base.
  mechanism: First jet J^1 of the summation variety; formal-group linearization makes the eps-block exactly linear; jets of order >= 2 discarded; zeroth-order equation plus first-order variational equation retained; relation generation = linear eps-consistency screen then exact residual test; more low-degree equations per candidate.
  assumptions: [ordinary prime-field curves, prime-order subgroup, anomalous (#E = p) excluded, singular/supersingular/char 2,3 excluded, standard x-interval factor base of size B, m = 3]
  predictions:
    - {metric: "charged-cost exponent (relations + LA + descent) across p in {101, 211, 431}", direction: lower, minimum_effect: "<= 0.49 with the 1/2 crossing excluded at 95% confidence"}
    - {metric: "per-relation cost ratio (classical / tangent-split) at equal hit rate", direction: higher, minimum_effect: ">= 4x sustained across all sizes (necessary-not-sufficient)"}
  test_boundary:
    instances: ["freshly generated ordinary prime-order curves over F_p, p in {101, 211, 431} plus 1009 stress, seeds 20260717..20260722"]
    parameters: {m: 3, B: {101: 14, 211: 20, 431: 28, 1009: 40}, factor_base: standard x-interval}
    implementation: experiments/EXP-JET-001/jet1_tangent_split.sage
    budget: {wall_clock_seconds: 2400, wall_clock_seconds_per_run: 600, maximum_runs: 8}
  falsification_conditions:
    - "C_lin + sigma*C_nonlin >= C_nonlin across all sizes (screen implied by zeroth order, sigma ~ 1: pure additive overhead)."
    - "Or eps-consistency generically stronger than the base relation (sigma_w ~ 0: relation probability collapses)."
  interpretation_limits: [Toy prime fields <= 2^10; m = 3 only; op-counted schoolbook cost model with stated LA/descent toy proxies; a scoped negative closes only the tested distribution (rule 6); toy evidence is not crypto-scale validation (rule 7).]
  status: rejected_scoped
  proposed_by: coordinator-research-director
