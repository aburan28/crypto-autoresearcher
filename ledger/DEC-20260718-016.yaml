coordinator_decision:
  id: DEC-20260718-016
  context: "EXP-R6-001 explicit-membership PDP on an arbitrary explicit birthday factor base"
  decision: reject_scoped
  target_ids: [H-R6-001]
  rationale:
    - "Falsification condition (i) met: total-cost exponent alpha = 2.074, bootstrap CI90 (1.565, 2.621) — entirely above 0.5 and above the same-instance rho control 0.4988 (0.4813, 0.5161); cost above rho by 2.0e4–1.5e5x at every measured scale."
    - "No-win signature recurs (condition ii): d_reg median flat at 2.0 while cost scales ~l^2.1; nulls cost MORE than real systems (1.3–1.5x) — real systems track the support-matched null."
    - "No bookkeeping leak (condition iii): even solve-only, GB-only/rho = 5.1e3–2.7e4x."
    - "All four mandatory controls present and passing (rho 152/152 exact; curve spread 1.04–1.25; isogenous same-order identical; support-matched null harder)."
    - "Sharp solve wall observed between F=18 (28 s) and F=20 (>460 s) — the approach hits its own complexity wall far below the spec ladder."
  evidence_refs: [EV-R6-001, RUN-EXP-R6-001-a, RUN-EXP-R6-001-b, RUN-EXP-R6-001-c, RUN-EXP-R6-001-d]
  limitations:
    - "valid_reduced_scope: m=3 only (m=4 arm fully censored — even F=6 > 300 s), F <= 16 vs spec's l = 2^20..2^30 ladder; censored cells are infrastructure (rule 5), but the measured exponent CI is entirely above 0.5 with the no-win signature, so the scoped closure stands (rule 6)."
  next_actions:
    - "H-R6-001 = rejected_scoped. Closes the explicit-membership arbitrary-base direction (AUTOLAB_TASKS T1) at all reachable scales; combined with ICI's CI-backed totals, no explicit-base membership-solve route to sub-rho remains open in the tested regime."
  decided_by: coordinator
  decided_at: "2026-07-18"
