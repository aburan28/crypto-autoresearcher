evidence:
  id: EV-SIG-003
  hypothesis_id: H-SIG-001
  experiment_ids: [EXP-SIG-003]
  run_ids: [RUN-EXP-SIG-003-a, RUN-EXP-SIG-003-b, RUN-EXP-SIG-003-c, RUN-EXP-SIG-003-d,
    RUN-EXP-SIG-003-e, RUN-EXP-SIG-003-f, RUN-EXP-SIG-003-g, RUN-EXP-SIG-003-h, RUN-EXP-SIG-003-i]
  type: empirical
  direction: neutral
  strength: replicated
  observations:
    - "LINK TEST COMPLETE at n=12 (seeds 2, 2026) and n=15 (seed 1), D=5, all
       controls PASS. Dimension table (sem cells): extra_5 = 1,322/1,323/1,863;
       deficit_5 = 1,321/1,322/1,862; lower-degree closure rank mod K5 A4 =
       444/444/705; residual_5 = extra_5 - A4 = 878/879/1,158. Exact identity
       per cell: deficit_5 = A4 + residual_5 - 1 (the -1 = rankK5 shortfall
       vs the matched null; identity deficit = extra + rankK5_sem -
       rankK5_null verified on all three sem/null pairs)."
    - "Merge vs independence (numbers only, no verdict): the multiplication
       closure of ALL lower-degree non-model syzygies spans 33.6%/33.6%/37.9%
       of the deficit rank-wise (444/444/705 of 1,321/1,322/1,862); the
       remaining 878/879/1,158 dimensions are NEW non-rewritable directions
       born at D5 with no lower-degree source (residual_5 > 0 on every sem
       cell). Full merge is arithmetically impossible at these sizes
       (pre-registered bound: closure <= extra_4*(nb+1) = 800/1,240 <
       1,321/1,862); the strict residual family alone is count-bounded at
       225/310. The closure amplifies: 13.9 (n=12) / 17.6 (n=15) independent
       D5 directions per D4 extra syzygy (55.5%/56.9% of its count bound)."
    - "Closure decomposition: the single D3 non-Koszul syzygy's multiplies
       account for A3 = 242 (n=12) / 392 (n=15) of the closure (80.4%/84.1%
       of its 301/466 multiplier images); the D4 extra family adds
       A4_beyond_A3 = 202/313; A3 + A4_beyond_A3 == A4 exactly on every cell
       (D3 closure inside D4 closure)."
    - "Unexpected (rule 8): A4_id = 1 exactly on every sem cell - the D4
       kernel's identity embeddings at D5 are almost entirely absorbed by the
       K5 model family (span(K5) has >= 109/110 and >= 159/160 D4-supported
       dims vs rankK4 = 78/120; the surplus over K4 is exactly extra_4 - 1 =
       31/39 on all three sem cells). The D4 extra syzygies do NOT persist as
       non-model syzygies at D5; only their multiplied images contribute
       (A4 - A4_id = 443/443/704). Whether the one surviving dimension is the
       D3 syzygy's identity embedding is undetermined."
    - "Unexpected (rule 8): the closure is seed-stable (identical
       A3/A4/A4_beyond_A3/A4_id = 242/444/202/1 at n=12 seeds 2 and 2026)
       while extra_5 differs by 1 (1,322 vs 1,323): the O(1) D5 seed variance
       from EV-SIG-002 localizes entirely in residual_5 (878 vs 879)."
    - "Cross-instrument continuity: the SIG instrument's n=12 seed-2026 build
       reproduces the EXP-DREG-001 anchor EXACTLY (rank 28,096, deficit
       1,322) - EV-SIG-002's 1,321-vs-1,322 is genuine instance variance, not
       instrument drift. n=15 seed 1 reproduces 69,073/1,862 (EXP-SIG-002 and
       EXP-DREG-001 N15 anchors); n=12 seed 2 reproduces 28,097/1,321
       (EXP-SIG-002)."
    - "Controls all PASS: C1 continuity (D3 def 1; D4 def 8n/3 = 32/32/40;
       residual_4 = 9/9/10 verbatim pinned semantics); C2 D5 anchors
       bit-exact; C3 support-matched nulls show extra=0, rank==sr_pred,
       residual_4=0, A3=A4=A4_id=0, residual_5=0 on all three null arms (zero
       deficit AND zero residual, as required); C4 determinism (RUN-b vs
       RUN-f identical modulo timing, formal compare RUN-g); C5 input-side
       filter (all 6 measured cells standard); C6 dimension sanity (all
       canonical-semantics cells)."
    - "Pilot run RUN-EXP-SIG-003-a INVALID and preserved: the first driver
       used the instrument's early-break reduce_against for quotient ranks
       (exact for membership, not for ranks); it gave A3+A4_beyond_A3 = 618 <
       671 = A4, arithmetically impossible - the pre-registered C6 gate
       caught it before any further cells. Driver fixed to canonical
       full_reduce (rank-exact); all measurement cells re-run. FLAG to the
       Coordinator: the pinned instrument's residual measure uses the same
       early-break construction, so the true D4 residual could be larger than
       the anchored 9/10/13/14; re-measurement under canonical semantics is a
       possible follow-up, not done here."
    - "Budget: 9 runs of 10 (10th deliberately unspent - residual-only
       closure isolation unnecessary given the count bound 225/310 and the
       measured larger-family closure 444/705); ~342 s compute wall of 3,300;
       peak RSS 2.22 GB of 24; no censoring, kill rule never engaged (longest
       invocation 158.5 s)."
  inference: >-
    On the shared boolean chained Semaev systems at n=12 and n=15, the EXP-SIG-002
    non-rewritable low-degree syzygy family and the EXP-DREG Macaulay rank deficit
    are NOT the same object rank-wise: the entire lower-degree non-model syzygy
    closure spans only 444 of 1,321/1,322 (33.6%) and 705 of 1,862 (37.9%) missing
    pivots, while 878/879/1,158 missing-pivot directions are new non-rewritable
    syzygies born at D5 (residual_5 > 0 on every standard cell, zero on every
    null). The D4 extra syzygies themselves are absorbed by the D5 model family
    (A4_id = 1; surplus over K4 exactly extra_4 - 1); only their multiplies
    contribute to the closure. Numbers only - the merge/independence status
    decision on H-SIG-001 and the DREG program belongs to the Coordinator.
  boundaries:
    - "Toy scale: boolean chained Semaev m=3, t=3, n in {12, 15}, D=5 link at
       three standard instances (n=12 seeds 2, 2026; n=15 seed 1) plus matched
       nulls; rank arguments only - no causality claim, no solver-impact claim."
    - "The closure measured is of ALL lower-degree non-model syzygies (D3
       syzygy + D4 extra space); the strict residual-only closure is bounded
       by count (225/310), not separately isolated (deliberate, deviation D2)."
    - "residual_4 anchors (9/10) use the pinned instrument's early-break
       semantics verbatim (continuity); all LINK ranks (A3, A4, A4_beyond_A3,
       A4_id, residual_5) use canonical exact reduction. See EV-SIG-003
       observation 8 for the semantics flag on the pinned residual measure."
    - "One pilot run invalid (driver semantics bug, caught by pre-registered
       gate, preserved); no other deviations; no censoring."
  unresolved_confounds:
    - "Whether the single D4-kernel identity dimension surviving mod K5
       (A4_id = 1) is the D3 syzygy's identity embedding."
    - "The surplus dim(span(K5) cap V4) - rankK4 = extra_4 - 1 exactly at both
       sizes (31/39) - mechanism unexplained."
    - "Whether the pinned early-break residual measure overestimates
       rank_v3mod at D4 (true D4 residual possibly larger than 9/10/13/14) -
       flagged for a coordinator-dispatched follow-up."
    - "What generates the D5-born residual_5 component (878/879/1,158 dims);
       its growth with n (only two sizes measured; coverage ratio 0.336 ->
       0.379 is two points, no law fit)."
  reviewed_by: coordinator
