      None for anything else and the ceiling is skipped entirely.
    note: '`toy_measurement` and `theoretical` look like near-misses for real tiers; `laboratory_implementation_conformance`
      is a conformance claim that may not belong on a scale axis at all. Resolving this is
      a taxonomy question, and migrating a value edits committed evidence, so it is supersession
      by correction rather than an in-place edit.'
