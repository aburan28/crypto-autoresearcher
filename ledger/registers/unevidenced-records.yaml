schema: unevidenced-records-v1
recorded_at: "2026-08-02"
authorizing_decision: DEC-20260802-008
amended_by: DEC-20260802-009

purpose: >-
  Names every record whose validator errors are grandfathered under the
  2026-08-02 re-anchoring BECAUSE the missing content is a judgement nobody has
  made, not a defect anybody can repair. A record that states nothing gets
  cited later as though it stated something; this register is the standing
  answer to that, and admitting these lines to the baseline is conditional on
  it existing.

prohibition: >-
  No record listed here may be cited in support of a hypothesis status
  transition, a synthesis, a knowledge promotion, or any claim of evidential
  weight, until the missing field is assigned by a Coordinator evidence review.
  Citing one for background or for its observations is permitted and unchanged.
  This is a restriction on what may be INFERRED from these records, not a
  statement that their observations are wrong.

why_not_simply_filled: >-
  `direction` and `strength` are the evidential judgement itself -- whether a
  record supports or weakens its hypothesis, and how strongly -- and
  `confidence` and `proof_status` are the same kind of claim about a knowledge
  entry. Assigning them without reviewing the underlying run sets would be
  fabrication under AGENTS.md rule 5. Being the only role permitted to assign
  them does not make a session able to. They are left empty deliberately and
  the emptiness is disclosed here.

evidence_records:
  missing_fields: [run_ids, direction, strength, proof_status, proof_refs]
  note: >-
    All five carry claim_tier `toy_measurement` and status `filed`. Each names
    a hypothesis, so the absent `direction` is exactly the field a reader would
    use to decide whether that hypothesis moved.
  records:
    - id: EV-XEDN-002
      path: ledger/evidence/EV-XEDN-002.yaml
      hypothesis_id: H-XEDN-002
    - id: EV-XEDN-003
      path: ledger/evidence/EV-XEDN-003.yaml
      hypothesis_id: H-XEDN-003
    - id: EV-XEDN-004
      path: ledger/evidence/EV-XEDN-004.yaml
      hypothesis_id: H-XEDN-004
    - id: EV-XEDN-005
      path: ledger/evidence/EV-XEDN-005.yaml
      hypothesis_id: H-XEDN-005
    - id: EV-XEDN-006
      path: ledger/evidence/EV-XEDN-006.yaml
      hypothesis_id: H-XEDN-005

knowledge_entries:
  note: >-
    Seven KN-FIND entries, not the eleven estimated before the class was
    measured. KN-FIND-002's `type` was mechanically repairable and WAS repaired
    (it is listed here only for its remaining judgement fields). KN-FIND-009 is
    a different defect: its internal_refs name review records that do not exist
    in this repository, which is a missing-artifact problem rather than a
    missing judgement.
  records:
    - id: KN-FIND-002
      path: knowledge/findings/KN-FIND-002.md
      missing: [internal_refs, proof_status, proof_refs]
      repaired_here: "type: finding -> internal_finding"
    - id: KN-FIND-003
      path: knowledge/findings/KN-FIND-003.md
      missing: [confidence, added, internal_refs, proof_status, proof_refs]
    - id: KN-FIND-004
      path: knowledge/findings/KN-FIND-004.md
      missing: [confidence, added, internal_refs, proof_status, proof_refs]
    - id: KN-FIND-005
      path: knowledge/findings/KN-FIND-005.md
      missing: [confidence, added, internal_refs, proof_status, proof_refs]
    - id: KN-FIND-009
      path: knowledge/findings/KN-FIND-009.md
      missing: []
      defect: >-
        internal_refs name REF-20260728-002, VAL-20260728-001 and
        RT-20260728-002, none of which exists as a record in this repository.
    - id: KN-FIND-010
      path: knowledge/findings/KN-FIND-010.md
      missing: [confidence, added, internal_refs, proof_status, proof_refs]
    - id: KN-FIND-011
      path: knowledge/findings/KN-FIND-011.md
      missing: [confidence, added, internal_refs, proof_status, proof_refs]

lifting_conditions:
  - >-
    A Coordinator evidence review of EV-XEDN-002..006 that assigns direction
    and strength from the XEDN run sets removes those five from this register.
  - >-
    A bounded /curate-knowledge task, scoped per DEC-20260802-008 next_action
    8, that derives each knowledge entry's fields from its own body -- and
    reports back rather than guessing where the body does not determine them --
    removes the knowledge entries.
  - >-
    Locating or superseding KN-FIND-009's three named review records removes
    it.
  - >-
    Entries are removed from this register only by that work, never by
    regenerating the file.

claim_boundary:
  - This register records what is NOT established. It establishes nothing itself.
  - >-
    It makes no statement about whether the listed records' observations are
    correct, only that the repository does not currently say what they weigh.

claim_tier_ceiling_not_evaluated:
  recorded_at: '2026-08-02'
  authorizing_decision: DEC-20260802-010
  why_this_is_here: These records produce NO validator error line, so the baseline cannot
    disclose them and no error list would ever surface them. They were found by sweeping,
    not by reading output. The claim-tier ceiling (declared > max(run_tiers)) is the check
    that stops toy-scale evidence being presented at cryptographic scale -- AGENTS.md rule
    4 and rule 7 -- and on every record below it silently does nothing.
  prohibition: No record listed here may have its claim_tier treated as machine-verified.
    A record declaring a tier above `toy` may not support a hypothesis transition on the strength
    of that tier until the ceiling is repaired and re-run against it.
  scale_of_the_gap:
    records_whose_ceiling_actually_evaluates: 8
    records_with_an_unrecognised_tier: 29
    records_whose_cited_runs_carry_no_field_size: 26
