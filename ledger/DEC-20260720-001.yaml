coordinator_decision:
  id: DEC-20260720-001
  context: >-
    EXP-SIG-005 cascade-law falsifiable checks (P1 the 2n/3+1 D4-residual law at
    n=24; P2 the residual_D birth law at D=6) plus a residual_5 n-growth
    extension to n=18. Thread: SIG asymptotics + DREG audit (2026-07-20).
  decision: supported_scoped
  target_ids: [H-SIG-001]
  rationale:
    - "P1 CONFIRMED: the canonical D4 non-rewritable residual law residual=2n/3+1
       (and deficit_4=8n/3, D3 count=1) holds at n=24 -- residual=17, deficit=64,
       count=1, zero seed variance over seeds 1-3, null arm all-zero, determinism
       identical (EV-SIG-005; RUN-EXP-SIG-005-a..e). The law now stands on six
       on-lattice sizes n=12..24 (9/11/13/15/17). Growth in n is LINEAR."
    - "residual_5 (D5-born component) EXTENDED to n=18 and found NON-MONOTONE:
       344/878/1158/974 at n=9/12/15/18 (increments +534/+280/-184). The n=18
       drop to 974 is REPLICATED on two seeds (zero variance), so it is not
       instance noise. The cascade does NOT grow monotonically in n at D=5."
    - "D6 BIRTH-LAW MEASUREMENT RETRACTED AS INVALID. The support-matched null
       fails its pre-registered C5 control at D6 (RUN-k, n=9 null): the null D6
       Macaulay has different column count than the sem (31180 vs 29332), rank
       overshoots the shared sr_pred (31179 vs 28068 -> negative deficit), and
       null extra/residual_6 = 4986 != 0. The null is exactly semi-regular only
       through D=5. Therefore the sem residual_6=2615 / deficit_6=776 (RUN-h) are
       NOT admissible; the 'miscalibrated D6 null' pre-excluded in H-SIG-001/
       H-DREG-001 is now directly demonstrated. The cascade characterization is
       valid ONLY for D<=5."
    - "Cross-instrument continuity holds: SIG D5 deficit == DREG block-m4ri D5
       deficit at n=12/15/18 (1321-1322/1862/1999); residual_4/residual_5
       reproduce the EV-SIG-002/003/004 anchors exactly."
  evidence_refs: [EV-SIG-005, RUN-EXP-SIG-005-a, RUN-EXP-SIG-005-b, RUN-EXP-SIG-005-c,
    RUN-EXP-SIG-005-d, RUN-EXP-SIG-005-e, RUN-EXP-SIG-005-h, RUN-EXP-SIG-005-j,
    RUN-EXP-SIG-005-k, RUN-EXP-SIG-005-m]
  limitations:
    - "Toy scale (n<=24, D<=5 valid); no d_reg or solver-impact claim. The
       cascade's existence and its (linear-D4, non-monotone-D5) growth do not by
       themselves lower d_reg into sub-rho territory."
    - "n=9 is the anomalous size and is the only (invalid) D6 column; n=21
       residual_5 and the n=12 null-D6 replication are ENOSPC-censored (rule 5)."
    - "The D6 stage requires an instrument repair (recalibrated null support +
       sr_pred) before any degree-axis claim beyond D=5 is admissible."
  next_actions:
    - "H-SIG-001 remains supported_scoped; evidence sharpened (2n/3+1 confirmed at
       n=24) AND scope-bounded (cascade valid D<=5; D6 birth-law claim retracted)."
    - "New instrument-repair task: re-derive the D6 semi-regular null so its
       support/ncols match the sem arm and sr_pred is recalibrated; only then is
       the residual_D birth law testable at D=6."
    - "Falsifiable checks still open: residual_5 at n=21/24 (does the n=18 drop
       continue?); on-lattice D5 deficit at n=21 (does the +137 deceleration
       continue?). Both blocked here by host ENOSPC."
  decided_by: coordinator
  decided_at: "2026-07-20"
