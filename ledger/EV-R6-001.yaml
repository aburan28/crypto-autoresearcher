evidence:
  id: EV-R6-001
  hypothesis_id: H-R6-001
  question_id: RQ-R6-001
  experiment_ids: [EXP-R6-001]
  run_ids: [RUN-EXP-R6-001-a, RUN-EXP-R6-001-b, RUN-EXP-R6-001-c, RUN-EXP-R6-001-d,
    RUN-EXP-R6-001-e, RUN-EXP-R6-001-e2, RUN-EXP-R6-001-e3, RUN-EXP-R6-001-f,
    RUN-EXP-R6-001-g, RUN-EXP-R6-001-h]
  type: empirical
  direction: contradicts
  strength: preliminary   # valid controlled experiment at reduced scope vs the frozen ladder
  validity_status: valid_reduced_scope
  validity_reason: >-
    All four mandatory controls present and passing on the measured cells (rho on same
    instances, matched random curves, same-order isogenous curves, support-matched nulls);
    every recovered decomposition verified, every rho recovery exact (k == k_true), dim=0
    for every non-empty system. Scope reduced from the frozen ladder l=2^20..2^30 to
    l~2^10.7..2^12.2 (F=12,14,16, |F|=l^{1/3} preserved): the spec-scale solve cells are
    censored infrastructure state (m=3 F=20 > 460 s; F=101 at l~2^20 killed at 240 s; m=4
    F=6 killed at 300 s), recorded per AGENTS rule 5, never counted as evidence.
  metrics:
    total_cost_exponent_alpha_per_target: {value: 2.074, ci90: [1.565, 2.621], n_targets: 110, note: "bootstrap 2000 resamples within cells, cost ~ l^alpha, l=q"}
    total_cost_exponent_alpha_cell_means: {value: 2.217, n_cells: 6}
    gb_only_exponent: {value: 2.144, ci90: [2.086, 2.209]}
    rho_exponent: {value: 0.4988, ci90: [0.4813, 0.5161], n: 152}
    rho_constant: {measured_mean: 1.356, measured_median: 1.306, theory_H040: 1.2533141373155001}
    cost_ratio_vs_rho_same_instances: {total: "2.0e4..1.5e5 x", gb_only: "5.1e3..2.7e4 x"}
    d_reg_median_per_cell: 2.0
    d_reg_max_observed: 10
    decomposition_yield: "67/110 random targets had >=1 verified decomposition (vdim 0..61)"
    relation_build_cost_per_target_s: [0.002, 0.008]
  per_cell:
    - {m: 3, F: 12, arm: random,   n: 24, empty: 5, q_med: 1811, gb_median_s: 1.41, total_mean_goe: 1.07e6, d_reg_med: 2, vdim_med: 6}
    - {m: 3, F: 12, arm: interval, n: 24, empty: 7, q_med: 1823, gb_median_s: 1.45, total_mean_goe: 1.32e6, d_reg_med: 2, vdim_med: 4.5}
    - {m: 3, F: 14, arm: random,   n: 24, empty: 4, q_med: 2861, gb_median_s: 4.15, total_mean_goe: 2.74e6, d_reg_med: 2, vdim_med: 6}
    - {m: 3, F: 14, arm: interval, n: 18, empty: 7, q_med: 2797, gb_median_s: 4.17, total_mean_goe: 1.69e6, d_reg_med: 2, vdim_med: 4.5}
    - {m: 3, F: 16, arm: random,   n: 12, empty: 4, q_med: 4397, gb_median_s: 8.66, total_mean_goe: 7.25e6, d_reg_med: 2, vdim_med: 4.5}
    - {m: 3, F: 16, arm: interval, n: 8,  empty: 2, q_med: 4703, gb_median_s: 11.75, total_mean_goe: 1.27e7, d_reg_med: 2.5, vdim_med: 9}
  control_outcomes:
    rho_same_instances: "PASS as control: 56 in-cell + 96 ladder recoveries, all exact; exponent 0.4988 CI90 (0.4813,0.5161) sits at l^0.5; solve arm above it by 2.0e4..1.5e5x at every measured scale"
    matched_random_curves: "PASS: curve-mean GB max/min ratio 1.04..1.25 across all six cells (window-matched independent curves; exact same-l match infeasible within budget — deviation)"
    same_order_isogenous: "PASS: explicit isogenies deg 3,5,7,11,13 (order verified); mean GB equal within noise at all cells (1.38 vs 1.43; 4.25 vs 4.16; 10.37 vs ~9.9 s)"
    support_matched_null: "PASS: 4 nulls per cell; null GB 1.80/5.91/14.49 s vs real 1.43/4.16/~9.9 s at F=12/14/16 — same ~F^6-7 scaling, ~1.3-1.5x real, no curve-structure shortcut"
  gate_arithmetic:
    success_criterion: "NOT MET on the numbers: alpha CI entirely below 0.5 required on >=4 ladder points AND below all four controls; measured 3 F-values, alpha=2.074 CI90 (1.565,2.621) entirely ABOVE 0.5, cost above rho control by 2.0e4..1.5e5x"
    falsification_condition_i: "MET numerically: alpha CI (1.565,2.621) sits entirely above 0.5 and above the rho control's measured 0.4988 (0.4813,0.5161)"
    falsification_condition_ii: "MET numerically: no-win signature recurs — d_reg median flat at 2.0 across all cells while cost scales ~ l^2.1"
    falsification_condition_iii: "no bookkeeping leak: no gain even solve-only (GB-only alpha 2.144 CI (2.086,2.209); GB-only/rho 5.1e3..2.7e4x); relation build cost 0.002..0.008 s/target"
    prediction_2_dreg_vs_null: "not observed in the predicted direction: nulls are harder than real systems at these sizes (unit ideals; 1.3-1.5x GB cost), real d_reg median 2"
  observations:
    - "m=3 total-cost exponent alpha = 2.074, bootstrap 90% CI (1.565, 2.621), n=110 targets over F=12/14/16 (l~2^10.7..2^12.2), both base arms, 3 curves, seeds 1-3"
    - "rho control on the same instances: exponent 0.4988 CI90 (0.4813,0.5161), constant 1.356 vs 1.2533 theory (H040/T24 anchor confirmed)"
    - "solve/rho cost ratio 2.0e4..1.5e5x (total) and 5.1e3..2.7e4x (GB-only) at every measured cell"
    - "no-win signature present: d_reg median 2.0 flat, time ~ l^2.1"
    - "sharp solve wall: m=3 F=18 GB 28.0 s vs F=20 > 460 s unfinished (censored)"
    - "m=4 (6-variable) arm fully censored: even F=6 (l~2^10.5) GB > 300 s; F=8 > 200 s (dev smoke)"
    - "support-matched nulls cost ~1.3-1.5x the real membership systems with the same scaling — real systems track the null, no curve-structure exploitation"
    - "spec-scale design points censored: m=3 F=101 at l~2^20 (build 0.0083 s measured; GB killed at 240 s); l=2^24..2^30 not attempted per stopping rule"
  inference: >-
    Over the tested instances, parameters, solver (Singular degrevlex GB with FGLM
    extraction), and resource budget, the arbitrary explicit-membership m=3 chained
    Semaev solve has a measured total-cost exponent ~2.1 in l with CI entirely above
    the birthday barrier, tracks the support-matched random null, and loses to Pollard
    rho by 4-5 orders of magnitude at every scale reached; the degree-flat/time-exponential
    no-win signature is present. Both numerical falsification conditions of H-R6-001 are
    met within the tested scope. (Verdict and hypothesis status belong to the Coordinator.)
  boundaries:
    - "Toy scale: measured cells l ~ 2^10.7..2^12.2 only; spec ladder l=2^20..2^30 censored (infrastructure), not extrapolated (AGENTS rules 5-7)"
    - "A negative here closes only the tested scope: arbitrary explicit membership, m=3, this GB implementation, this budget — not other solvers, not non-membership R6 formulations"
    - "Replication reduced at F=14/F=16 (18/24, 12/24, 8/18 targets); F=12 complete (24/24 per arm)"
    - "Control 2 is l-window-matched, not exact same-l; control 3 isogenies explicit (deg <= 13)"
    - "d_reg via GB max degree; d_ff not instrumented (instrument/system mismatch)"
    - "m=4 arm censored entirely; no m=4 measurement exists in this evidence"
  unresolved_confounds:
    - "20/110 solves used the slow Singular variety() fallback for extraction (method recorded per target); F=16 total means inflated accordingly — GB-only fit (alpha 2.144) is robust to this"
    - "machine shared with another experiment agent during parts of the session (wall-time noise; op-count metrics unaffected)"
  reviewed_by: coordinator
