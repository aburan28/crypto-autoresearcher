  inference: "No improvement meeting the predefined threshold was observed over the tested instances, parameters, solver, and resource budget. The target-sectioned Semaev family is Newton-saturated at m in {3,4,5} over the tested distribution: MV = multigraded Bezout exactly, so support-aware elimination has a strictly smaller root-count driver nowhere, and measured support-aware solve costs exceed dense composed resultants at every measured size. This is consistent with (but does not prove) the candidate's disproof-track saturation theorem for all m."
