    - "rho_m = MV/(n!*D^n) = 1 exactly in all 54 instances (27 configs x 2 targets): m=3 MV=8=2!*2^2; m=4 MV=384=3!*4^3; m=5 MV=98304=4!*8^4"
    - "Newton polytope of the target-sectioned S_m is the full degree box [0,2^(m-2)]^(m-1) at m in {3,4,5}: exact pulling-triangulation volumes 4 / 64 / 4096, agreeing with Sage Polyhedron.volume() in all 36 hull-path computations"
    - "per-instance support fill 1.0 (m=3), 0.952-1.0 (m=4), 0.9781-1.0 (m=5); union (generic family) support = full box at every (p,m); monomial losses are instance-specific cancellations that never touch box corners"
    - "log MV / log Bezout at m=5 = 1.0 exactly (candidate's cost-model invariant; win required < 1 strictly)"
    - "support-aware (sparse) route strictly more expensive than dense where measured: total op ratios sparse/dense = 1.384 (m=3), 5.537 (m=4); FB-evaluation ratios 1.04x / 1.40x / 2.02x (m=3/4/5); sparse generic construction at m=5 infeasible (K^3/3 ~ 9.4e10 analytic estimate, predeclared fallback, charged = dense)"
    - "solve-cost exponents vs log(D^n): e_dense = 1.404, e_sparse = 1.328 (fallback-charged); ratio 0.946 is an artifact of the m=5 fallback charge, not a sparse win"
    - "relation supply unchanged: algebraic solution sets identical to the harvester in all 54 instances, so relation probability is solver-independent as the candidate states"
    - "unsectioned T_4 support is 439/625 (70.2%): the unsectioned family polynomial is materially sparser; target-sectioning fills support"
  gate_arithmetic:
    g1_rho5: "98304/98304 = 1 (exact) >= 0.95 -> candidate disproof-track arithmetic triggered (promotion required <= 0.85)"
    g2_exponent_ratio: "0.946 under predeclared m=5 fallback charge; per-m op ratios against sparse (1.38/5.54/1.00); log MV/log Bezout = 1.0 exactly -> sparse driver MV^O(1) shares the dense exponential driver for any BKK-based algorithm"
