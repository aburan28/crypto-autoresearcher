  validity_status: valid
  observations:
    - "Bond ranks (exact F_p, balanced recursion-tree splits) are 3, 6, 15 at d = 2, 4, 8 (m = 3,4,5), identical in all 27 cells (3 primes x 3 seeds x 3 m); m=5 child bond {x1,x2,x3}|{x4,x5} also 15. Full rank would be 3, 25, 81. The named likely-fatal obstruction (generically full bond rank) does NOT hold on the tested range."
    - "chi_full is field-size independent: beta = slope of chi_full vs log2(p) = 0.000000 at every m."
    - "chi_needed(recall >= 0.99) = chi_full in every cell: max recall at any chi < chi_full is 0.111 (m=3), 0.282 (m=4), 0.197 (m=5); recall at chi_full - 1 is 0.0000 (m=4, all cells) and <= 0.016 (m=5); recall(chi_full) = 1.0 exactly with 0 false positives."
    - "Gate arithmetic: alpha_full = alpha_needed = 1.160964 (3-point LS slope log2 chi vs log2 d, per p, identical at p = 101/431/1009); alpha_root2 (m=4->m=5 root bond only) = 1.321928. Promotion gate alpha < 1: NOT crossed. Disproof trigger alpha >= 1.9: NOT triggered in-window. Margin vs dense 1.979 (MX-1478, cited): 0.818 (3-point) / 0.657 (root-only)."
    - "Measured ranks match the Sylvester multiset count C(2^{m-3}+2, 2) exactly (3, 6, 15); if the law persists, asymptotic exponent -> 2 (disproof region); m >= 6 untested here (recorded as falsifiable extrapolation, not evidence)."
    - "Dense baseline (local MX-1478 analog): S_m terms 13 -> 439 -> ~54.5k (near-dense 9^5 tensor), symbolic resultant time ~0.003 s (m=4) -> ~4.7 s (m=5)."
    - "Controls all pass: P1 S3 baseline 20/20 per curve; P2 S4 = per-point Sylvester 200/200 per cell; P3 CUR exact at full rank (Semaev and random tensors); P4 contraction == direct definition at every grid tuple, 0 mismatches in 27/27 cells; N1 random tensors full rank 27/27; N2 random recall at matched chi 0-0.017 (m=3 trivial full-rank match reproduces 1.0)."
    - "Truncated tensors emit false positives (up to 4288 at m=5 chi=1), filterable by the candidate's exact-verification witness; the loss is recall-only, as constructed."
    - "RUN-TTN-001-a retained (valid_with_defect: derived-summary timing field int-truncated by a serialization bug; cell-level data intact, measurements verified identical to canonical RUN-TTN-001-b)."
  inference: "On the tested window the Semaev recursion bonds are exactly and stably low-rank (killing the full-rank obstruction), but recall-0.99 counting needs the FULL bond rank over F_p (no negligible directions), and that rank grows with window exponent 1.16-1.32: above the promotion gate (< 1), below the in-window disproof trigger (>= 1.9), with an exact combinatorial fit pointing to asymptotic 2. No improvement meeting the predefined threshold was observed over the tested instances, parameters, solver, and resource budget. State transition left to the Coordinator."
  boundaries:
    - "toy primes p in {101, 431, 1009} (<= 2^10), m <= 5, 3 seeds; ordinary prime-field short-Weierstrass curves"
    - "one truncation rule (deterministic prefix-CUR over F_p); other truncation schemes and norm-bearing settings untested"
    - "recall measured on EC x-coord factor-base grids (|FB| = 24/14/9); counting only, not enumeration"
    - "window slopes from 2-3 points; C(2^{m-3}+2, 2) law is an exact in-range fit, untested beyond"
    - "MX-1478's 1.979 cited from the candidate text, not re-measured; local dense times are toy constant factors"
  unresolved_confounds:
    - "whether alternative truncation rules (different pivot choices, randomized CUR, border-rank relaxations) can hold recall >= 0.99 below chi_full"
    - "whether the combinatorial rank law persists to m >= 6 (predicts chi(6) = 45, exponent -> 2)"
  reviewed_by: coordinator
