coordinator_decision:
  id: DEC-20260718-002
  context: "EXP-INC-001 output-sensitive finite-field incidence reporting for chord harvesting (m=3)"
  decision: reject_scoped
  target_ids: [H-INC-001]
  rationale:
    - "Zero output sensitivity measured: candidate-test exponent 2.078 for enumerator and both reporters (exactly Theta(B^2), zero pairs avoided); marginal cost 341.2 ops/incidence is candidate-proportional, not output-proportional."
    - "Positive control PASS (reporter == enumerator multisets, 36/36); negative control PASS (random non-EC lines not cheaper)."
    - "Complete-cost trends 0.551–0.736 per row, none below 0.49; total/(0.886*sqrt(n)) grows 4.71 -> 8.12 along the n^2/5 row."
    - "EC chord richness equals the random-line prediction (I_EC=13 vs I_rand=12) — consistent with the INCB ceiling measurement."
  evidence_refs: [EV-INC-001, RUN-INC-001-c]
  limitations:
    - "Toy p <= 2^12, m=3 only, B <= 28; the candidate itself stated it lives in the m=4/5 regime or dies — m=4/5 supply arithmetic remains adverse per RT-1476 and no reporting primitive was found even at m=3; closes the tested scope (rule 6)."
  next_actions:
    - "H-INC-001 = rejected_scoped. The RT-1472 'implicit deck with o(L) setup' loophole is narrowed: grid-bucketing + algebraic partition variants both failed to achieve output sensitivity; a fundamentally different primitive would be required."
  decided_by: coordinator
  decided_at: "2026-07-18"
