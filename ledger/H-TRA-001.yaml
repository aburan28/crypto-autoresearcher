hypothesis:
  id: TRA-H-001
  question_id: TRA-RQ-001
  statement: Coarse-graining the translation-by-P map on E(F_p) into a C-cell Markov operator and estimating its leading spectrum from sub-birthday trajectory samples yields spectral phase information that localizes k into an interval shrinkable below sqrt(n) total cost.
  mechanism: At full resolution the translation operator's eigenvalues are characters chi(P) whose phases encode position; a coarse-grained empirical operator might retain enough leading-eigenpair phase to pin k to an arithmetic progression of step ~1/phi, giving localization factor L super-constant in n at S = o(sqrt(n)).
  assumptions: [x-interval cell partition, empirical operator from S i.i.d. transitions, leading-eigenpair matched-filter readout, BSGS finish inside the localized set]
  predictions:
    - metric: localization factor L vs n
      direction: higher
      minimum_effect: "L >= n^0.05 at S <= n^0.3 sustained across three sizes (promotion gate; far below break-even but directional)"
  test_boundary:
    instances: [prime-order curves over F_211, F_1009, F_4099, seeds 20260717..20260722]
    parameters: {C: [8,32,128], S: ["n^1/4","n^3/8"]}
    implementation: experiments/EXP-TRA-001/tra1_koopman.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per-invocation cap: 600}
  falsification_conditions: [L_eff consistent with the chance floor (hit rate ~= sum 1/L) with growth exponent ~0 across the three sizes -> archive as barrier measurement with fitted L(S,C) law]
  interpretation_limits: [toy scale only; at these sizes the literal n^0.05 gate sits at/below the chance floor, so gate arithmetic must be read against the chance baseline; a negative closes only the tested estimator, partition family, and budgets]
  status: rejected_scoped
  proposed_by: coordinator-research-director
