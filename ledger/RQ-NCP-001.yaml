research_question:
  id: RQ-NCP-001
  title: Does a noncommutative path-algebra (correspondence-quiver) truncated NC-GB word search find word-level Q-reaching relations that the commutative subset-sum quotient misses, at lower cost per relation or with sub-birthday charged exponent?
  scope:
    curve_families: [prime-field short-Weierstrass]
    field_types: [F_p]
    bit_sizes: ["toy p in {101, 431}, subgroup orders 13..439"]
    methods: ["truncated NC word search degree<=6 on quiver {T_Pi}+{neg}", "commutative signed-subset-sum baseline at equal op budget", "Bergman/NC-GB framing"]
  motivation: >
    Candidate C3 (research_directions_20260717.md). Path-algebra Groebner/syzygy methods
    (Bergman overlaps) have never been pointed at ECDLP; the commutator-collapse obstruction
    predicts NC relations descend to commutative subset-sum relations (bookkeeping).
    The falsification is cheap and sharp.
  decision_target: Whether any NC relation class beats the commutative harvest cost at equal size with charged exponent trend < 0.49 (promotion gate), or is bookkeeping (scoped negative).
  constraints: [toy primes only, no isogeny arrows (base experiment), word degree <= 6]
  status: active
  owner: coordinator
