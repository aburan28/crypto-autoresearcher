research_question:
  id: RQ-INCB-001
  title: "Do factor-base chord arrangements on E(F_p) attain the generic Szemeredi-Trotter-type richness ceiling, or do they show a curve-specific excess of rich lines?"
  scope: {curve_families: [ordinary prime-field short-Weierstrass toy curves], field_types: [F_p], bit_sizes: ["toy p in {211, 1009, 4099} (~2^8..2^12)"], methods: [exact enumeration of chord-line richness profiles, log-log exponent fit, matched random-null and grid controls]}
  motivation: "Candidate D3 (research_directions_20260717.md). Supplies ground truth for frontier A39 (pair-output exponent) and for sibling candidate A2 (output-sensitive chord harvesting): if EC chords are at the generic richness ceiling, A2-class relation supply is capped at exponent >= 1/2; a measured excess would be a quantified opening. Converts the folklore 'chords are generic' into a measured statement; no ledger entry measures richness profiles."
  decision_target: "Whether the fitted richness exponent of EC factor-base chord arrangements is separated from a matched random null by > 3 standard errors at all three toy sizes (opening), or is statistically indistinguishable (barrier reading)."
  constraints: [toy prime fields only, model-level measurement, no crypto-scale claim, FB-agnostic arrangement-level object]
  status: active
  owner: coordinator
