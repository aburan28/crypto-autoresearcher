coordinator_decision:
  id: DEC-20260718-021
  context: >-
    Independently validated completion of the EXP-DREG-001 n=17, D=5 Semaev
    and support-matched-null two-partition exact-rank gate
  decision: expand
  target_ids: [H-DREG-001]
  rationale:
    - >-
      The four admissible endpoints pass independent hash, checkpoint,
      carrier, full-column, and comparison validation: Semaev rank 125099,
      prediction 126922, deficit 1823 in partitions A and B; null rank 126922,
      prediction 126922, deficit 0 in partition A and logical partition B
      (EV-DREG-003, VAL-20260718-DREG-NULLB-CONT-001).
    - >-
      The original incomplete NULL-B run remains excluded; its approved,
      hash-pinned continuation supplies only the exact rank/deficit endpoint.
      Timing and resource comparisons are excluded and all receipt deviations
      remain disclosed (AMD-20260718-003, AMD-20260718-004).
    - >-
      This establishes a toy, presentation-specific structural separation at
      one D=5 cell but neither a scaling law nor d_reg/d_ff separation. The
      n=17 value is non-monotone relative to n=15 and n=18, so H-DREG-001
      remains inconclusive rather than supported or rejected.
    - >-
      Partition replication on the same instance is preliminary evidence; it
      is not eligible for knowledge promotion and carries no ECDLP complexity
      or breakthrough implication.
  evidence_refs:
    - EV-DREG-003
    - experiments/EXP-DREG-001/validation-report-n17-four-cell-v1.yaml
    - experiments/EXP-DREG-001/n17-sem-partition-comparison-v1.json
    - experiments/EXP-DREG-001/n17-null-partition-comparison-v1.json
  limitations:
    - >-
      Toy n=17, D=5, one target and seed; no independent curve or target
      replication; no measured d_reg or d_ff; no factor-base-to-target descent.
    - >-
      Late prelaunch-receipt serialization, a label-only manifest correction,
      and the absent separate launch-time dirty-tree snapshot are provenance
      limitations but not payload mismatches.
  next_actions:
    - >-
      Freeze a review-required, two-partition n=21, D=5 Semaev full-column
      exact-rank contract with an independent Validator dependency before any
      compute.
  decided_by: coordinator
  decided_at: "2026-07-18"
