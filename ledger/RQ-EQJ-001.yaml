research_question:
  id: RQ-EQJ-001
  title: Does exact group-algebra (Maschke) decomposition of the m=4 Semaev fiber-product relation space under G = S_3 ⋉ (Z/2)^3 yield block-rank arrival or orbit-compressed storage beyond the FHJRV-style symmetrized baseline?
  scope: {curve_families: [ordinary prime-field short-Weierstrass, prime-order group], field_types: [F_p], bit_sizes: ["toy p in {211, 1009, 4099} (~2^8..2^12)"], methods: [m=4 point enumeration of summation fibers, exact isotypic idempotents of B_3, mod-n block ranks, index-calculus DLP]}
  motivation: Candidate B3 (research_directions_20260717.md). Symmetrization exploits orbit structure statistically; B3 asks whether the exact isotypic splitting of the relation operator/module gives a charged-cost reduction below the rho 1/2 baseline — the measured question is per-block rank arrival, which no ledger entry records.
  decision_target: Whether per-isotype block structure is EC-specific (vs random-hypergraph/random-action null) and whether it yields >= 4x LA+storage reduction at equal recovered targets, or a charged exponent trend < 0.49, across three toy sizes.
  status: active
  owner: coordinator
