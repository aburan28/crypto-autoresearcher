  the_RT1_VP5_adjudication:
    statement_of_the_disagreement: >-
      RED TEAM RT-1 holds that the refusal is a property of the evaluation route and
      exhibits alternative routes that admit X_null. VALIDATOR V-P5 holds that
      X_null computed from slogdet on the ACTUAL matrix is bit-identical over 8
      bases at 38 of 38 too, so the matrix-free choice is disclosed but NOT
      load-bearing. The Validator did not read the Red Team's probes, so the
      disagreement is genuine rather than an artifact of shared inputs.
    ruling: >-
      ADJUDICATED, AND THE EVIDENCE DISCRIMINATES. THEY ARE NOT IN CONFLICT. The
      Validator's V-P5 route IS the Red Team's R1 row and both report the identical
      result for it -- 38 of 38 bit-identical. There is NO route on which both
      measured and disagreed; the union of their measurements is one consistent
      table (R0, R1, R3 refuse; R2, R4, R5 admit). What differs is the question each
      answered, and BOTH ANSWERS STAND.
      (1) R-OUT-1 IS NOT AN ARTIFACT OF THE PRODUCER'S ROUTE CHOICE -- UPHELD ON THE
      VALIDATOR'S GROUND and on the Red Team's own explicit concession. The
      producer's matrix-free choice is a DISCLOSURE GAP and nothing more.
      (2) THE GENERALITY CLAIMED FOR THE REFUSAL FALLS -- UPHELD FOR THE RED TEAM
      AND UNREBUTTED. Nothing the Validator measured bears on routes R2, R4 or R5,
      and it does not claim otherwise. The Red Team exhibited a BUILT counterexample
      that reproduces the notarized table at 304 of 304 entries and is admitted.
      (3) THE NARROW POINT. "Not load-bearing" is TRUE OF THE VERDICT and FALSE OF
      THE JUSTIFICATION: R-OUT-1 does not depend on the choice, while the claim that
      bit identity operationalizes AM-11's quantification over FUNCTIONS does, and
      that claim is false. Neither reviewer is corrected.
    what_remains_unresolved_with_its_named_successor_test: >-
      NEITHER REVIEW TESTED WHETHER A SCALED DISPERSION CRITERION ACTUALLY
      SEPARATES. Named successor test, specified in AM-16 and carried into the
      goal's single next_action: implement G-VAR2 and validate it against the six
      routes already built and committed in probe_nullroute.py, whose committed
      output declares the required behaviour in advance -- all six routes to X_null
      and to rdet REFUSED, lam1n / hkz / rawtail ADMITTED. Cost seconds to low
      minutes at d <= 40 with no new reduction.

  the_AM13_scope_ruling_for_P_R6:
    assigned_to_me_by: Validator finding F-4, which expressly declined to adjudicate it.
    ruling: >-
      AM-13'S FINAL CLAUSE IS GENERAL AND REACHES SECTION R. P-R6 IS RECORDED AS A
      CONSISTENCY CHECK, NOT A PREDICTION, and it does not count toward Section R's
      empirical content. Grounds: the clause is stated without restriction and is
      introduced by "Additionally", separating it from the count-specific
      requirement before it; DEC-20260808-05b684's own next_actions carry AM-10
      through AM-14 into EVERY successor pre-registration without section
      qualification; and its purpose -- that a prediction with an empty falsifier is
      not counted as evidential content -- is identical wherever the prediction sits.
    what_this_ruling_is_not: >-
      IT IS NOT A FINDING OF PRODUCER NON-COMPLIANCE. The clause's surrounding text
      is about Section B and the ambiguity is the amendment's, not the producer's;
      ruling otherwise would change a success criterion after observing the outcome,
      which my own contract forbids. IT IS NOT A RE-LITIGATION OF AM-13: its merits
      are untouched and this is a scope reading, which is what was asked for and
      what only the Coordinator may give.
    consequence: >-
      With P-R7 removed by BOTH reviews on the same evidence and P-R6 ruled a
      consistency check, Section R's genuinely open predictions number ONE: P-R1.
      This is why the official count is one rather than the Red Team's two, and the
      divergence and its reason are both on the record.

  the_F7_ruling_on_the_immutable_notarized_text:
    ruling: >-
      THE NON-CITATION CARRY IS RESTATED AS A CITATION RULE, NOT AN OCCURRENCE RULE.
      It binds what an artifact QUOTES, never what an already-frozen text contains.
      The four bare occurrences of the committed real count are DECLARED AND NOT
      REPAIRED: editing prereg.md would destroy the notarization property that is
      this batch's strongest verified property, and editing the three producer
      artifacts would edit committed run records and invalidate their own declared
      hashes. Binding forward: no successor quotes prereg.md line 576,
      report_nullfam.md line 37 or 89, or results_nullfam.json line 4382 in
      isolation; every citation of the committed real count of 29 of 48 carries the
      exact-null benchmark of 47 of 48 in the same sentence. The carry's purpose is
      met at DOCUMENT level in all four cases and the Validator says so.

  amendment_disposition:
    preamble: >-
      AM-10 THROUGH AM-14 OF DEC-20260808-05b684 AND THEIR BINDING CARRIES ARE IN
      FORCE AND ARE NOT RE-LITIGATED HERE. Producer compliance with them was
      checked; their merits were not reopened. AM-1 through AM-9 are likewise
      undisturbed. What follows are two NEW amendments and one PROSPECTIVE protocol
      amendment.
    AM-15:
      title: >-
        AM-13's final clause is general, and a non-citation carry binds at the point
        of quotation.
      requirement: >-
        (a) A prediction whose falsifier is empty conditional on a bit-exact
        reproduction check is a CONSISTENCY CHECK and must be labelled one IN THE
        PRE-REGISTRATION ITSELF, before the run, in EVERY section of EVERY successor
        pre-registration in this goal -- not only in count-style sections. A
        consistency check is reported and is valuable; it is not counted as a
        prediction and does not enter any tally of empirical content. (b) Any
        binding non-citation carry created in this goal must be WRITTEN as a rule
        about QUOTATION, not about occurrence, because a carry expressed as an
        occurrence rule becomes unsatisfiable the moment it touches an immutable
        text -- as it did here, four times, once irreparably inside a notarized
        pre-registration. (c) A section reporting an N-of-M prediction record must
        state, in the same table, how many of the M were open at the moment of
        notarization.
      grounds: Validator F-3, F-4, F-7; Red Team RT-8. Scope reading assigned to the Coordinator by F-4.
      prospective_only: >-
        (a) and (b) bind SUCCESSOR pre-registrations. Applied to BATCH-9e3584 only
        as a CITATION ruling on this decision's own records, never as a finding of
        non-compliance against a producer that read the clause defensibly.
    AM-16:
      title: >-
        A dispersion criterion must be SCALED and must be evaluated over at least
        two declared arithmetic routes.
      requirement: >-
        (a) G-VAR is REPLACED for all successor work by G-VAR2: an admissible
        observable must have between-basis dispersion at fixed (d, k, beta, q) that
        is non-negligible RELATIVE TO THE CANDIDATE'S OWN BETWEEN-CELL RANGE at
        fixed (d, k), reported as a per-cell PROFILE over all scored cells rather
        than as an all-cells Boolean. Bit identity at exactly zero is withdrawn as
        the operationalization: it cannot distinguish "no information" from
        "information at 1e-16", and the escaping routes sit at 1e-13 against a
        between-cell range of order 1 while hkz sits at 2.4e-2. (b) EVERY candidate
        observable must be scored through AT LEAST TWO DECLARED ARITHMETIC ROUTES,
        with the route recorded beside each value, BEFORE any dispersion verdict is
        reported. The route is currently an undeclared free parameter of the gate.
        (c) The all-cells reduction is withdrawn: a candidate parameter-determined
        at 37 of 38 cells and basis-dependent at 1 must be reported as such, with
        the profile, and not silently admitted. (d) G-VAR2 must be VALIDATED before
        it governs anything, against the six routes already built and committed in
        probe_nullroute.py, whose committed output declares the target behaviour in
        advance: all six routes to X_null and to rdet REFUSED, lam1n / hkz /
        rawtail ADMITTED. (e) Any count-style or amplitude-style guard must be
        GRADED (lambda-scaled) rather than binary, reporting the crossing amplitude,
        so that it measures resolution and not merely non-deadness. (f) Any
        SE-validation control must include at least one NON-CONSTANT injection,
        because a constant offset is an exact symmetry of the estimator under test.
        (g) Any count-style headline must report its sampling dispersion under the
        declared null and the probability of its own falsifier under that null,
        beside the count.
      grounds: >-
