  rationale:
  - >-
    VALIDITY WAS VERIFIED BEFORE ANY INTERPRETATION AND THE RUN SET IS ADMISSIBLE.
    4 of 4 producers at 1 of 1 run each, VALID, no selection applied, no run
    discarded; 4 of 4 schema-complete manifests declaring their artifacts under
    their committed names; seeds recorded or correctly declared absent where a
    section takes no draw, with C1's committed input pinned by sha256; raw-summary
    agreement at zero mismatches over roughly ten thousand recomputations from the
    rawest retained quantity, plus a bitwise from-scratch re-execution of the lead;
    controls comparable with two declared limits; and the artifact policy passing
    for every producer, which CLOSES THE BATCH-cbe023 SECTION C EVIDENCE-INTEGRITY
    GAP. All 28 NOT COMPUTED cells are genuinely structural and enter no count as a
    zero, a pass or a fail. Nothing goes back to a producer. Detail:
    EV-MLKEM-9346bb.validity_verification.
  - >-
    R-OUT-1 STANDS, AND IT DOES NOT REST ON THE PRODUCER'S EVIDENCE. On the
    criterion as frozen at 1aa7db53 -- tau_var exactly 0, decided by bit identity
    of 8 IEEE-754 doubles and not by a tolerance -- G-VAR fires and the AM-4/AM-8
    gate is INADMISSIBLE. The Validator built TWO parameter-determined observables
    the producer never saw and pushed them through the producer's own imported gate
    code: both walk G-REL while bit-identical across all 8 bases at 38 of 38 cells,
    and one of them does so with a magnitude of at most 0.5322, INSIDE the failing
    candidate's own realized range and below its own scale floor -- which kills the
    strongest available objection, that the refusal is about size rather than
    blindness. A third observable of its own correctly FAILS, so the demonstration
    is not that its probes pass everything. NO ADMISSIBILITY CLAIM IS REPORTABLE
    FROM THAT GATE IN EITHER DIRECTION AND NONE IS MADE.
  - >-
    THE HEADLINE IS REPLICATED AND EXTENDED, NEVER NEW, AND THIS DECISION RECORDS
    IT THAT WAY. X_null, its definition, its scale floor s_X = 1.0 and BOTH headline
    figures (G-REL1 3.1035, G-REL2 0.6000) were already built, measured and
    committed as BATCH-cbe023 RT-A1 in probe_A1_null_observable.py and quoted
    verbatim in DEC-20260808-05b684 rationale (iii); the Validator re-derived both
    in closed form and they are digit-identical. RT-A1 is cited NOWHERE in this
    batch. Against the producer, the headline is not this batch's discovery. For the
    producer, this makes it REPLICATED rather than single-source at a far larger
    scope -- 8 bases at 38 cells under a frozen bit-identity refusal criterion
    against a single-pass probe -- which is evidentially STRONGER. What IS new is
    stated separately and is smaller: G-VAR itself, OBS-R1 (rdet, from the ORIGINAL
    frozen candidate list rather than planted), the X_mp guard, the 8-basis hkz
    replication at L9/L10 and L11/L12, and the artifact-policy compliance.
  - >-
    THE REFUSAL'S GENERALITY FALLS, AND THAT IS THE BATCH'S MOST TRANSPORTABLE
    RESULT. AM-11 quantifies over closed-form FUNCTIONS of (d, k, beta, q); bit
    identity is a property of the EVALUATION PATH, and measure_relvar.py:260 chose
    the matrix-free one in a docstring asserting the opposite. The same closed form
    evaluated by QR of B^T or on an ambient-isometry presentation BH is 0 of 38
    cells bit-identical, agrees with the closed form to 5.07e-14 and 3.11e-14,
    reproduces the notarized prereg 2.6 table at 304 of 304 cell-by-basis entries to
    every printed digit, walks G-REL2 at 19 of 19 -- and is ADMITTED. The producer's
    own committed forced_arithmetic.rdet_T1_ambient_isometry_residual = 3.865e-12
    carries the same point, which I verified myself against the committed JSON.
    THEREFORE ADDING G-VAR DOES NOT REPAIR THE GATE, and report_relvar.md section
    5(iii)'s "it cannot be tuned into or out of firing" is FALSE AS STATED.
  - >-
    THREE COULD-NOT-FAIL FINDINGS THAT THE REVIEWS ESTABLISHED AND THE PRODUCERS DID
    NOT, each recorded because suppressing it would be worse. (i) Exactly ONE of
    Section R's seven predictions was an open empirical question at notarization,
    not three. (ii) Section B-prime's pre-registered falsifier had probability
    0.00175 under the null AM-13 itself mandates, the second conjunct of its PASS
    clause is a tautology true of any family, and its count SATURATES UPWARD toward
    48 of 48 with more draws rather than decaying -- which is the artifact tell
    stated as a property of the statistic rather than of one realization. (iii)
    Section C2's P-C2e could not have failed: a constant offset is an EXACT
    SYMMETRY of se_decomposition, so injecting into the raw table is the same
    operation as shifting Delta_bar afterwards, which prereg 5.4 names as the
    could-not-FIRE arrangement it claims to have averted. SE inflation of the kind
    AM-14(b) names therefore remains UNTESTED.
  - >-
    FOUR THINGS THE REVIEWS TRIED TO BREAK AND COULD NOT, recorded at the same
    weight as the objections because that symmetry is why adverse findings in this
    goal are credited. The MUST-PASS guard fires under the pinned normalization
    (19 of 19 pinned REL2 entries; hkz passes 47 of 48 pinned REL1 entries),
    refuting the Red Team's own predicted regime-mismatch objection. The Section
    B-prime direction survives two independently seeded null families the Validator
    built (35 and 39 of 48, against a committed real count of 29 of 48 and an
    exact-null benchmark of 47 of 48). The N-C exclusion mechanism is CONFIRMED --
    denominator collapses 117.9x while the numerator moves 1.08x -- and the
    exclusion moves the instrument TOWARD falsifiability. The producer's own
    diagnosis of P-C2c is CONFIRMED by the centered control it correctly declined to
    run, at 0 of 10 targets firing. And the predicted unimodular escape from G-VAR
    DID NOT ESCAPE.
  - >-
    THE COMPOSITIONAL STATEMENT, which is what a successor must carry. Deleting
    G-VAR leaves the gate admitting X_null; adding G-VAR in its present form leaves
    it admitting X_null-by-QR. The strengthened invariant still does not imply the
    target property -- that an admitted observable carries information about the
    lattice -- and the first step that fails is the OPERATIONALIZATION of dispersion,
    not its motivation. A criterion drawing its line at exactly zero cannot
    distinguish "no information" from "information at 1e-16", and those are thirteen
    orders of magnitude apart in a quantity (float_sd) the artifact already records
    and then discards in favour of a Boolean.
  - >-
    THE TWO COORDINATOR SNAPSHOT ARCHIVES ARE SUPERSEDED, AND BOTH REVIEWS VERIFIED
    THE ACCOUNT OF IT INDEPENDENTLY. See archive_task_supersession below. The bytes
    are intact and the coordination record's binding is not; AGENTS.md itself
    distinguishes the dispatch queue as a coordination record from evidence, which
    is why the reviews proceeded and why this decision is admissible.

