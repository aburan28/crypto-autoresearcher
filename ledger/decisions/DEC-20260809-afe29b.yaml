coordinator_decision:
  id: DEC-20260809-afe29b

  context: >-
    BATCH-9e3584 of GOAL-MLKEM-005 ran four pre-registered producers against a
    notarized contract and both independent reviews have returned. VALIDATOR
    TASK-20260809-3f1dc4 verdict `passed`: all four producer packages are
    ADMISSIBLE RESEARCH RECEIPTS, with seven corrections required before anything
    is cited. RED TEAM TASK-20260809-444fe7: ten objections and twenty probe files,
    its primary finding being that G-VAR as implemented decides on the ARITHMETIC
    ROUTE rather than on the observable, plus six measurements reported against its
    own thesis. The batch's lead outcome R-OUT-1 -- the AM-4/AM-8 admissibility
    gate is INADMISSIBLE under G-VAR -- STANDS, and its headline observable is
    REPLICATED AND EXTENDED from BATCH-cbe023 RT-A1 rather than discovered here.
    Separately, the batch's two Coordinator snapshot archives are terminally
    defective (COORDINATOR-ADJUDICATION-20260811.md) and this decision records their
    supersession. CLAIM TIER TOY: nothing here bears on ML-KEM security, on any FIPS
    203 parameter set, on any attack cost or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the frozen instrument specification is amended by
    AM-15 and AM-16 below and the successor batch is specified -- and it is NOT a
    verdict on any proposition. THE BATCH IS INCONCLUSIVE ON EVERY PROPOSITION
    ABOUT LATTICES IT COULD HAVE ADDRESSED, and I say so plainly rather than
    converting an instrument outcome into a finding. Nothing is `support`ed,
    `weaken`ed or `reject_scoped` here; no hypothesis status moves, because no
    hypothesis is named and no evidence bears on one. `approve` would endorse
    headline sentences that independent review has shown to be false as written,
    unsupported, or already committed elsewhere. `pause` is not available: none of
    this goal's pause_conditions is met, and every candidate ground for pausing --
    an instrument outcome, an exhausted batch, a defective archive whose CONTENT
    verifies -- is listed in this goal's own non_terminal_conditions and may not be
    cited in a decision that closes, pauses or completes it. `reject_scoped` is
    forbidden here on its own terms and is not sought: no theory is being called
    wrong.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-9e3584
  - EV-MLKEM-9346bb
  - TASK-20260809-cda2f6
  - TASK-20260809-311784
