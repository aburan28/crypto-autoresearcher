  program_defects:
    PD_NEW_RECEIPT_COMMIT_BINDING_TENSION:
      id: PD-d49e35
      id_status: >-
        MINTED AND CONFIRMED FREE. A RANDOM 6-HEX TOKEN IS USED RATHER THAN THE
        SEQUENTIAL "PD-5", AND THE REASON IS ITSELF A FINDING: the PD-N label space
        is program-wide, has no allocator, and is ALREADY AMBIGUOUS -- PD-5 already
        denotes different defects in ledger/evidence/EV-DS-003.yaml and in
        ledger/evidence/EV-MLKEM-c47a1e.yaml. Minting PD-5 here would be a third
        meaning. tools/allocate_id.py exposes no `--next` type for PD (its choices
        are batch, coordinator_decision, evidence, experiment, handoff, hypothesis,
        idea, research_question), so the token was generated directly:
        `python3 -c "import secrets; print('PD-' + secrets.token_hex(3))"`, then
        confirmed free with `python3 tools/allocate_id.py --check PD-d49e35` and
        `rg -n "PD-d49e35"` returning zero pre-existing occurrences.
      title: >-
        An archive receipt cannot state the sha of the commit it must ride inside,
        and the frozen dispatcher requires it to ride inside.
      statement: >-
        tools/research_dispatch.py requires an archive commit's change set to equal
        artifact_paths UNION source_paths EXACTLY (:564, :1073-1089), and an archive
        task's artifact_paths must be non-empty (:502) and uniquely owned
        (:511-517). Its own receipt is therefore inside its own commit -- and a
        receipt cannot state that commit's sha. THE TWO REQUIREMENTS ARE JOINTLY
        UNSATISFIABLE IF THE RECEIPT MUST CARRY A TRUE SHA. BATCH-9e3584's session
        chose the strictly-checkable binding (true sha in the receipt) at the cost
        of committing the receipt separately, and the tool refused both archives.
        BATCH-cbe023 made the opposite trade and its plan rendered.
      the_resolution_this_batch_adopts_and_which_must_become_the_standard: >-
        THE RECEIPT BODY CARRIES commit_sha: null AND RIDES INSIDE ITS OWN ARCHIVE
        COMMIT. The real sha and parent go into the queue's `archive` block AFTER
        the commit, together with path_sha256 over every declared path INCLUDING the
        receipt. templates/research-records.md already states this ("Do not put a
        commit's own SHA into an artifact within that same commit"); what was
        missing is that it is a CONSTRAINT rather than a convention, and that the
        alternative is not merely discouraged but refused by the tool.
      cost_recorded: >-
        TWO ARCHIVES IN THIS BATCH, both terminally defective and unrepairable, plus
        the drafting and review of three defect records and a continuation queue.
        This is the fourth instance in this goal of a mechanical check run too late.
      forward_fix_offered_not_enacted: >-
        Either (i) make the receipt's declared `commit_sha` optional-by-contract in
        the schema and document the queue block as the sole binding site, or (ii)
        let a reachable commit whose declared CONTENT verifies degrade to
        content-verified rather than fail, which is what CLAUDE.md's "receipts bind
        to CONTENT first" already says and what the tool does NOT do for a reachable
        commit with a wrong change set. (ii) is a SHARED-CONTRACT CHANGE affecting
        every campaign, needs its own independent review, and MUST BE PROSPECTIVE
        ONLY -- it must never be used to retro-validate these two archives, because
        relaxing an enforcement rule after observing that it failed, in order to pass
        the thing that failed it, is changing a success criterion after the outcome.
    PD_4_STILL_OPEN_AND_THIS_BATCH_IS_A_FRESH_INSTANCE: >-
      Both review reports and all twenty red-team probe files sat UNCOMMITTED across
      a dispatch window and were the sole carriers of their own evidence until this
      archive. The Red Team declared every probe path explicitly in its report
      section 12 precisely because an undeclared probe cannot be committed and its
      evidence is lost; this decision's archive declares all twenty-one. ONE
      CORRECTION TO THE RECORD, offered by the Red Team against its own task card:
      the card asserted that its predecessor's probes "were lost to exactly this"
      and THEY WERE NOT -- all six BATCH-cbe023 probe files are present in the HEAD
      tree at b33158fc and this review depends on two of them. "The predecessor's
      evidence was lost" must not become a citable fact about this goal.
    MY_OWN_DEFECTS_THIS_BATCH:
    - >-
      The reserved identifiers EV-MLKEM-9346bb and DEC-20260809-afe29b were minted
      at batch-open, before any outcome existed, because the dispatcher refuses a
      ledger archive owning no path under ledger/evidence and ledger/decisions. They
