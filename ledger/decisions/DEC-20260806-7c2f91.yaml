coordinator_decision:
  id: DEC-20260806-7c2f91
  goal_id: GOAL-HQC-001
  batch_id: BATCH-4b8ad3
  recorded_at: '2026-08-06'
  decision: expand
  decision_label: campaign_batch_cap_removed_by_user_authorization_goal_resumed

  context: >-
    GOAL-HQC-001 was moved to `paused` by DEC-20260806-2947ba after BATCH-0a65c0,
    its sixth and declared-final batch under `campaign_budget.maximum_batches: 6`.
    That decision was explicit that the stop was a batch-count cap, not a
    wall-clock budget or a scientific stopping point: roughly 7,000 of the
    declared 10,800 wall-clock seconds remained unspent, and DEC-20260806-2947ba
    itself named "THE CAMPAIGN BUDGET CAP IS THE ONLY THING STOPPING THIS WORK"
    while stating plainly that raising `maximum_batches` is the user's call and
    is not self-granted by the Coordinator (AGENTS.md; CLAUDE.md "Non-negotiable
    rules" item 8 precedent).

  user_authorization: >-
    RECORDED BY THE COORDINATOR, NOT A SELF-GRANT, exactly the pattern already
    used on this same goal record for its 2026-08-02 activation (see
    ledger/goals/GOAL-HQC-001.yaml status_value_history[0]). In this session the
    user was asked directly how to proceed, with the paused status and the
    option to raise the batch cap or leave it paused named explicitly, and chose
    to raise the cap. Asked a second, separate question -- how much: +3, +6, or
    remove the cap entirely -- the user explicitly chose "remove the cap for
    this goal -- let the campaign run until it hits a real completion or pause
    condition (e.g. wall-clock budget or an unresolved defect), not a batch
    count." Both prompts and both answers are recorded here as the sole
    authorizing basis; no other statement is read as authorization.

  scope_of_the_authorization: >-
    NARROWER than the GOAL-MLKEM-003 precedent (DEC-20260802-0c6eb4), which
    removed all budget limits on that goal. Here the user's own words scope the
    removal to the BATCH COUNT specifically and name wall-clock budget as a
    still-legitimate stopping condition ("e.g. wall-clock budget"). This
    decision therefore removes only `campaign_budget.maximum_batches`.
    `total_wall_clock_seconds` is left at its previously declared value and
    remains a real, binding pause condition; so do the goal's other declared
    `pause_conditions` (unobtainable primary sources, a decisive computation
    exceeding budget after cheaper gates are exhausted, and an infrastructure
    or dependency blocker). `max_concurrent` is unchanged at 3: it is a
    coordination-integrity limit (AGENTS.md "Dynamic dispatch"), not a cost
    control, and no budget authorization touches it.

  budget_change:
    from_maximum_batches: 6
    to_maximum_batches: null
    to_maximum_batches_note: >-
      null is the schema's own unbounded representation
      (templates/research-records.md "Persistent research goal";
      campaign_budget.maximum_batches: null is the documented default/placeholder,
      not an invented convention).
    total_wall_clock_seconds: 10800
    total_wall_clock_seconds_note: >-
      UNCHANGED. Approximately 7,000 of 10,800 seconds remain unspent as of
      BATCH-0a65c0's close; this figure is not re-derived here and the campaign
      must account for actual spend batch by batch. When it is exhausted, that
      is still a real pause condition under this decision.
    max_concurrent: 3
    max_concurrent_note: coordination-integrity limit, not negotiable by budget.
    authorization: >-
      Direct user instruction, this session, 2026-08-06, in response to two
      sequential explicit questions (raise-or-leave-paused, then how-much).
      Verbatim basis quoted in `user_authorization` above.

  goal_status_transition:
    from: paused
    to: active
    reason: batch_cap_removed_by_user_authorization_resume_condition_addressed_first

  why_resume_now_and_not_a_different_next_action: >-
    DEC-20260806-2947ba's next_actions are ordered, and the first is a hard
    dependency for the rest: "CLOSE OPEN-6" (build a planted-correlation control
    arm whose log2_A_k is derivable in advance, run through the identical
    pipeline as PS-R3). Until OPEN-6 is closed, the PS-R3 -244-to--32 SD
    departure cannot be told apart from a subtly wrong sampler, and the
    validator said so explicitly: its exact recomputation certifies arithmetic
    "FROM THE HISTOGRAM FORWARD AND NOTHING BEHIND IT". Attempting the
    extrapolation (next_action item 2), the second reviewer (item 3), or the
    harness repairs (item 4) before OPEN-6 closes would let the campaign spend
    the newly-restored budget interpreting a number that might be an artifact.
    BATCH-4b8ad3 therefore dispatches ONLY the planted-correlation control arm,
    tightly bounded exactly as every prior HQC batch has been.

  what_this_decision_does_not_do:
    - >-
      It does not decide OPEN-6, the extrapolation, the second reviewer
      requirement, or any harness repair. Those remain open and are the
      objective of BATCH-4b8ad3 and its successors.
    - >-
      It does not touch H-HQC-18d1b4's status (remains `proposed`) or any claim
      tier. Claim tier stays TOY.
    - >-
      It does not assert anything about HQC IND-CCA security, its
      decoding-failure rate, or any standardized parameter set.
    - >-
      It does not reopen or touch EV-HQC-b71230's content; that evidence record
      stands exactly as archived, including OPEN-6 as its largest unresolved
      confound.
    - >-
      It creates no new evidence record and moves no hypothesis. This is a
      goal-state and budget authorization only.

  non_claims:
    - HQC's decoding-failure-rate model is neither confirmed nor refuted by this decision.
    - No asymptotic-complexity claim is advanced. No promotion gate is engaged.
    - >-
      A longer campaign is not a stronger result. Removing the batch cap
      removes a reason to stop early; it supplies no reason to keep going
      absent a ranked, justified next task (coordinate-research-goal skill,
      "When a batch has nothing ready").

  rationale:
  - THE STOP WAS A COUNT, NOT THE SCIENCE. DEC-20260806-2947ba records this
    explicitly, and this decision changes only the count.
  - THE USER AUTHORIZATION IS EXPLICIT, DIRECT, AND RECORDED, obtained through
    two sequential interactive questions in this session, not inferred from
    context and not a Coordinator self-grant.
  - THE FIRST NEXT ACTION IS THE BLOCKING ONE. OPEN-6 gates interpretation of
    the campaign's only measurement; every other queued item depends on it.
  - "THE AUTHORIZATION IS READ NARROWLY, as the user's own words scope it: batch
    count only, with wall-clock budget explicitly preserved as a real
    stopping condition."

  evidence_refs:
  - EV-HQC-b71230
  target_ids:
  - GOAL-HQC-001
  limitations:
  - This is a coordination decision about how long the campaign may run and
    what it may attempt next. It establishes nothing about HQC.
  - The wall-clock budget (10,800 s total, ~7,000 s remaining) is not increased
    by this decision and remains a live pause condition.

  next_actions:
  - >-
    Open and dispatch BATCH-4b8ad3, scoped to exactly one thing: build the
    planted-correlation control arm for EXP-HQC-982268 (log2_A_k derivable in
    advance) and push it through the identical PS-R3 pipeline, to close OPEN-6.
  - >-
    Do not schedule the extrapolation, the second reviewer on the PS-R3 package,
    or the named harness repairs until OPEN-6's outcome is in hand and reviewed;
    they are next_actions 2-4 of DEC-20260806-2947ba and remain queued behind
    this one.

  knowledge_promotion:
