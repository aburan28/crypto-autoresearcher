coordinator_decision:
  id: DEC-20260803-3bba92
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-012
  evidence_id: EV-MLKEM-553b83
  recorded_by_task: TASK-20260803-b1f24c
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: refine
  decision_label: three_batches_of_misfit_were_the_surrogate_the_survivor_is_now_characterised

  context: >-
    BATCH-012 ran the red team's C3 check after a resume from an infrastructure
    pause. TASK-20260803-36f572 instantiated the exact region measure from
    (4.10), (4.11) and (4.24) -- the first time this program has tested the
    object it has been naming since BATCH-009 -- and was snapshot-archived at
    d274699a. TASK-20260803-bddfa7 returned ADMISSIBLE_WITH_DEFECTS after
    re-deriving the model by a structurally different implementation and the
    counting floor from scratch.

  central_adjudication: >-
    THE PROGRAM'S OWN INSTRUMENT WAS THE PROBLEM, AND SAYING SO IS THE RESULT.
    For three batches this goal reported that Approximation 4.9's family misfits
    the archived whole-band data. It does not. A Gaussian-Phi surrogate does. The
    exact region measure, with ONE FEWER free parameter and its exponent frozen
    by the source equations, fits the whole band at about 1.06 to 1.13 times the
    counting-noise floor, and two structurally different second parameters each
    select their null value exactly and buy nothing. That is a positive finding
    about the source, produced by a lane that had returned four consecutive
    adverse readings, and it is recorded with the same prominence any adverse one
    would get. What survives is narrower and better understood: a systematic
    S-shaped shape error in the well-measured count>=1000 sub-band, lag-1
    autocorrelation 0.99907, at 13x to 26x the floor. `refine` is the
    disposition -- the object of study has been corrected and the residual is now
    characterised rather than merely measured.

  what_is_established:
    - >-
      The exact region measure fits the whole band far better than the surrogate
      with one fewer parameter, reproduced by an independent implementation to
      five decimals across all eight M2 cells.
    - >-
      The whole-band misfit recorded across BATCH-009, BATCH-010 and BATCH-011
      was a property of the surrogate, not of Approximation 4.9's region measure.
    - >-
      The count>=1000 misfit survives the substitution and is strengthened: both
      attacks on the comparison failed, with the surrogate's optimum genuinely
      interior at p about 20 and an alternative embedding giving 13.57x against
      13.23x.
    - >-
      The counting-noise floor is correct, on three independent computations, and
      the plug-in lambda is defensible to within 0.44 percent in the conservative
      direction.

  what_is_struck_or_corrected:
    - >-
      The word CLOSED. Survival counts are cumulative, so the residual is
      Brownian in 1/lambda and profiling a normalisation removes 6 to 11 percent
      of it. Protocol-correct floors put the exact model at 1.13x and 1.06x, not
      1.04x and 0.97x. No comparison changes, but nothing is "at the floor" --
      and ANOM-4 dissolves entirely, since nothing sits below its floor.
    - >-
      report.md section 3.2's "the rms value at the edge is not scan-limited":
      false. The count>=1e5 rms falls by a factor of 2.66 off the edge, so table
      3.4's "177x -> 61.4x" is a tie and is struck.
    - >-
      The envelope_dominates_last_lobe truncation control, which is false for
      both Upsilon_a and Upsilon_b in both files while its numbers were stated as
      bounds. The conclusion survives on the validator's enlarged grids.
    - >-
      The Coordinator's dispatch premise that PDF page 20 was among the archived
      extracts. It is not; the handoff body was correct. Third
      Coordinator-authored premise falsified downstream in this goal.

  weighing_of_the_review: >-
    Accepted in full.
    (1) D-1 IS THE MOST IMPORTANT CORRECTION AND IT CUTS AGAINST THE HEADLINE I
    WOULD OTHERWISE HAVE WRITTEN. I flagged in the snapshot receipt that a
    sub-floor rms must not be read as beating perfection; the validator supplied
    the actual reason, which is better than mine -- it is not that the floor is
    noisy, it is that the residual is Brownian and the fit absorbs part of it.
    That both explains ANOM-4 and removes it.
    (2) THE VALIDATOR'S REFUSAL TO USE ITS OWN POLYNOMIAL-BASELINE CHECK IS
    RECORDED AS CORRECT CONDUCT. It computed an achievability baseline, saw that
    Brownian noise puts about 99.6 percent of its energy in its first twelve
    KL modes, concluded the baseline was not an achievability argument, and threw
    it away rather than report a number that would have looked decisive.
    (3) P-8 SETTLES A LIVE RISK. Had ANOM-1's node-ordering defect been shared by
    BATCH-010's script, BATCH-010's numbers would have moved and two decisions
    would have needed correction. The validator established structurally that
    BATCH-010 cannot express the defect, and corroborated its 0.705494 at
    0.705502.
    (4) THE COUNTING FLOOR NOW HAS THREE INDEPENDENT DERIVATIONS. Every surviving
    conclusion in this goal rests on it; requiring the third was worth the budget.
    (5) FOUR CLAIMS WENT UNCHECKED FOR BUDGET REASONS and are recorded as such,
    not as passed.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. A one-parameter shape fit at 1.06-1.13x the counting
    floor on two toy curves, with a fitted normalisation and no absolute-level
    test, does not carry a hypothesis transition in either direction --
    especially not toward `supported`, which needs `replicated` first and which
    a single execution with one validator and no red team cannot reach.

  rule_12_status: >-
    UNMET AND UNWAIVED. Nothing here changes EV-MLKEM-011, EV-MLKEM-013 or
    EV-MLKEM-017, and KN-FIND-031 stays withdrawn.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the gate, which needs `support` or
      `reject_scoped` at `replicated` or `strong`. The genuinely transferable
      candidate here -- that a surrogate substituted for a source model can
      manufacture a misfit finding that survives four batches of increasingly
      careful adversarial review, and that the tell is a free parameter the
      source does not have -- is worth promoting eventually and is NOT promotable
      on one execution with one validator and no red-team pass. It is named here
      so the next batch inherits it as a candidate rather than rediscovering it.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is NOT validated. A one-parameter shape fit near the
      counting floor on two toy curves is compatible with it being right and does
      not establish it, and the count>=1000 residual is unexplained.
    - >-
      Carrier et al.'s Kyber cost figures, headline shortfalls and Table 5.1 are
      untouched by this batch.
    - No asymptotic claim advanced. No closure quorum asserted.

  next_actions:
    - >-
      BATCH-013, zero new sampling: red-team this batch, which had none. The
      target is P-1/P-2 specifically -- the strongest case that the exact
      measure's whole-band fit is an artifact of the fitted normalisation or of
      the D-1 floor protocol rather than evidence that the source model is
      right -- and the four claims the validator could not check for budget
      (n=50's M1 whole-band argmin, n=50's M3 s-curve, n=50's slope row, the
      ANOM-7 sensitivity variant). A positive finding in this lane deserves at
      least the adversarial scrutiny the adverse ones received, and it has had
      strictly less.

