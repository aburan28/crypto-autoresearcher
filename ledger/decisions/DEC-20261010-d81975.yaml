  rationale:
    - >-
      The proposed one-edge test supplies a finite structural control
      for distinguishing a coordinate model change from movement to
      a nonisomorphic curve in the same isogeny class.
    - >-
      A translated-source null, kernel rejection check, explicit
      quotient-map verification, and independently computed counts
      prevent a vacuous or self-consistent positive.
    - >-
      The launcher and checker are bound to the frozen least-prime
      rule by trial-plan source hashes; only one deterministic trial
      slot is authorized.
    - >-
      The executor handoff remains written but undispatched until
      the snapshot archive and lane admission preconditions pass.
