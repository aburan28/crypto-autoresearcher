  context: >-
    /design-experiment, one contract. IDEA-20261005-9f4777 was the
    head of the remaining queue. On origin/main at
    58d7b589fd24fa548d6886852b6f31697ea8a7c4 no hypothesis and no
    experiment specification cites it. The branch
    design/qlwe-9f4777-logunit was created from that commit. git merge
    origin/main was already up to date. No conflict inside an
    immutable record.

    The contract scores a classical log-unit certificate at dimension
    128. The pre-registered prediction is certificate 1 only on a
    planted principal ideal in Z[x]/(x^128+1), and certificate 0 on
    ternary NTRU at q=32 and q=1024, on plain LWE, and on a rank-2
    module lattice with only the map x |-> x^5. The label
    exp(O~(sqrt(n))) is attached only with the certificate. Three
    assignment rows keep the cyclotomic ideal, NTRU, and plain LWE
    apart. Success fails if the certificate is missing on the ideal
    or present on a control. No lattice was built while writing this
    decision.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, seeds, replication, budget,
    stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    The proof_search_map required by RQ-QLWE-9108dc is filled. No
    field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to one mechanism are fixed before any run.
    - Plain LWE, both NTRU moduli, and the coefficient isometry give the certificate a way to come back as not specific.
    - Certificate 0 on the planted ideal is a reachable negative result, so the success criterion can fail.
    - Ring-LWE, Module-LWE, and NTRU attacks stay unclaimed, and the published approximation factor stays unmoved.

  evidence_refs: []
  limitations:
    - Dimension 128 only. No transfer to a deployed parameter set.
    - The quantum class-group step and the Stickelberger step are not in the protocol. KN-TECH-046 was read and was not re-derived.
    - This decision authorizes a later run. It does not start one.

