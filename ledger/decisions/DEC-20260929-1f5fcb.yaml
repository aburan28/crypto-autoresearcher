    cites: REVIEW-BINSTD-A-20260929-361e02 coordinator_prior; PD-R1 (an informed, not blind, prior); PD-R5 (reviewer concurrence on items DEC-20260928-cec92e quotes is informed)
    table:
      - {joint: J1, prior: 'holds about 0.75; break, if any, on the m = 4 closing g, coarse-grid contiguity or a zero-by-construction L = 1 print', outcome: 'holds; the L = 1 print can fail; one low attribution defect in the stated L = 1 residuals', site_predicted: 'held'}
      - {joint: J2, prior: 'holds about 0.6; break, if any, on the code pin or on the self-test curve and I1/I2 placement', outcome: 'holds; pin reproduces; the moderate gap J2-D1 sits beside the second named site', site_predicted: 'held'}
      - {joint: J3, prior: 'holds about 0.45; expected break on an admission-confined observable, an unreachable outcome, or a null separated only through an unmeasured constant', outcome: 'breaks on an unreachable-outcome artifact through an invalidation rule contradicting an observable definition; no observable confined; null separated with no unmeasured constant; unpredicted control-band false-fail (J3-D2)', site_predicted: 'joint yes; mechanism no'}
      - {joint: J4, prior: 'holds about 0.75; break, if any, on an R-J4-4-kind sentence', outcome: 'holds; moderate c-dependence gap J4-D1', site_predicted: 'held'}
      - {joint: J5, prior: 'column, identity, rho about 0.95; m = 5 window about 0.9; m = 4 envelope within tolerance about 0.7', outcome: 'all three hold (6e-7 bit; 0.0046 bit; 0.0035 bit and closing g 1.3e-4)', site_predicted: 'held'}
      - {joint: overall, prior: 'approve about 0.35; most likely revise on J3, a cheap remedy', outcome: 'revise on J3; one-clause breaking remedy plus moderate items, all zero-compute', site_predicted: 'class and joint yes; mechanism no'}
      - {joint: estimator prior, prior: 'the slope over all L cannot separate reuse from the null; the flat-level ratio can, near 1 against an order of magnitude or more', outcome: 'consistent in a sharper form in the reviewer''s abstract-model Monte Carlo (not an observation): AM3 is a function of KR and cannot fail alone; FR separates (null medians 85 and 354) but equals a_bar / a_pred, the attempts law, in the reuse arm', site_predicted: 'direction yes'}
      - {joint: overturn conditions, prior: 'J5 off the m = 5 window by more than 1 bit; null inseparable on every observable; a published algorithm below the S T^2 = N line', outcome: 'none occurred', site_predicted: n/a}
    reading: >-
      The prior located the break on the right joint and predicted the outcome
      class. It named the right lesson family (a rule that confines or
      forecloses its own falsifying outcome), but at the wrong layer: the
      admission and fit rules held, and an invalidation rule failed. The
      blind joint held on every sub-item, more tightly than the prior expected
      on the m = 4 envelope. Carried to the next plan: a J3 attack item that
      applies every invalidation, stopping and admission rule to the
      contract's own declared metrics and modal data pattern, and computes
      each gate's false-fail rate per cell regime.

