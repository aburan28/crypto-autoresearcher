      - {id: R2-J1-3, source: 45204f J1-D3, requirement: 'List the LA iteration constant (LA = k m B^2) as a hidden cofactor with its sensitivity. The pointer is recalled; no comparator or model change is required, and the D3 pin uses the same k = 1.'}
      - {id: R2-J2-2, source: 45204f J2-D2, requirement: 'Print the comparator memory at the m = 4 cap-slice and envelope upper ends (stage0_code computes the envelope value; add the cap slice), or reword "both memories are stated".'}
