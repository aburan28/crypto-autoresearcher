  decision: revise
  decision_label: >-
    Revise under composition key K-revise-defect. J3, the joint on the decision
    table itself, breaks on the plan's listed artifact "a declared outcome no
    data can reach". Invalidation rule IR-5 invalidates the whole run whenever
    shared and per-target units are summed into one figure. The gated
    observable AM3, and the reported FR_by_L, are defined on exactly such a
    figure, per_target_cost(L) = (shared_units + sum of per-target units) / L.
    Read as written, every run is RUN-ARTIFACT: POSITIVE, NEGATIVE and
    NOT-VALIDATED are unreachable, and so is the falsification criterion, which
    routes through NEGATIVE. The composer verified each cited clause against
    the frozen bytes (specification lines 344 to 347, 596, 720, 730, 781;
    hypothesis line 404). The same defect leaves two breaking revision
    requirements of DEC-20260928-cec92e undischarged (R-J2-1, R-J3-1). J1, J2
    and J4 hold. J5, the blind re-derivation, agrees with the frozen figures on
    every compared quantity, including the m = 4 envelope on the committed
    range. All four proves-too-much controls meet their signatures. No
    tripwire fired, and no objection is on the bus. The contract is not
    approved. Every defect below is a protocol-design, pre-registration or
    wording defect of an unapproved contract; none is a mathematical result
    about any curve, oracle, algorithm or heuristic (CA-10).

