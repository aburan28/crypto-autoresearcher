      - id: R2-J3-1
        source: 594e8d J3-D1
        requirement: >-
          Scope IR-5 so it cannot fire on the contract's own declared figures.
          Restore the carve-out: reporting a figure that sums shared and
          per-target units IN PLACE OF their separate columns invalidates that
          figure, and the declared per_target_cost(L) of AM3 and FR_by_L is
          the defined exception. Decide and state whether IR-5 remains in the
          run-wide list of success_criterion and contract_label.RUN-ARTIFACT.
          Align H-BINSTD-7951d2 proof_obligations ("never summed into one
          figure"). State which committed program evaluates IR-5; binstd_core
          stage2_outcome currently takes run_valid as an input. The audit
          sheet then records one check per invalidation and stopping rule:
          applied to the contract's own declared metrics and to its modal
          pattern P1, which outcome results.
    required_moderate:
      - id: R2-J3-2
        source: 594e8d J3-D2 and required_controls item 1
        requirement: >-
          Make G1's false-fail rate under the contract's own model small and
          stated. Either scale the KR and FR bands per cell to the model's
          sampling sd at that cell's mu and B, or add a same-regime Z/NZ
          control (B = 512, N the least prime above 2^19, mu about 1).
          Correct derivation_notes D-4 for the control. Restate most_likely
          with the model probability that G1 fails when H1 and H2 hold.
      - id: R2-J3-3
        source: 594e8d J3-D3 and J4-O5
        requirement: >-
          State in admissible_ranges, and in statement (D)'s gloss of "the FORM
          of the amortisation law", that in the reuse arm AM1 to AM3 reduce to
          (rho_rel, a_bar), that AM3 is dominated by AM1, and that
          FR = a_bar / a_pred. Either replace AM3 by an observable with its own
          failure region, or say that the L-dimension is not tested by the
          reuse arm as designed.
      - id: R2-J3-4
        source: 594e8d J3-D4 and J4-D4
        requirement: >-
          Pre-register the LOW-RETRY instrument audit: what it checks, and
          which declared outcome it assigns either way. State which per-cell
          class a KN-FIND-007-direction yield deficit maps to. Quote the
          finding's own quantity (target coverage) in H1's
          random_model_justification.
      - id: R2-J2-1
        source: 45204f J2-D1
        requirement: >-
          Wire every procedure step 2 self-test (the I1 seeded system; the I4
          point, table and schoolbook checks; oracle A against brute force)
          to a declared consequence: CTL-7 with S3, or an invalidation rule,
          so that an instrument defect cannot reach a declared NEGATIVE
          through LOW-COV. State how the I3 to I5 code is bound, either
          committed and digest-pinned under IR-6 before Stage 2, or pinned in
          the execution batch's snapshot before any run.
      - id: R2-J4-1
        source: 594e8d J4-D1
        requirement: >-
          State the TW-01 containment clause (outcome_table.tw01_caution; audit
          tripwire_preregistration) as a c = 1 statement with the range of c
          on which it holds. Add the critical-g shift (+log2 c) to the
          column_conventions sensitivity. The c-independent routing rule
          stays as written.
    required_minor:
      - {id: R2-J3-5, source: 594e8d J3-D5, requirement: 'Fix the relation kept at mu about 1: a seeded uniform choice among the returned decompositions, or a fixed and modelled order. A2 says which.'}
      - {id: R2-J3-6, source: 594e8d J3-D6, requirement: 'Derive the outcome_reachability patterns from generative quantities through the reuse-arm identities; P5, P6 and P8 are not producible data.'}
      - {id: R2-J3-7, source: 594e8d J3-D7, requirement: 'State CTL-6 as the delta_hat test plus an integrity assertion; two of its conjuncts cannot fail under the committed control code.'}
      - {id: R2-J4-2, source: 594e8d J4-D2, requirement: 'Word Stage 3 as a proposed column note for a Coordinator decision, consistent with statement (D).'}
      - {id: R2-J4-3, source: '594e8d J4-D3; 45204f O-J2-3', requirement: 'Replace "any prime-field object at all" with "no prime-field curve and no prime-field engine cell".'}
      - {id: R2-J1-1, source: '45204f J1-D1; 594e8d J4-O6', requirement: 'Correct the L = 1 residuals to their values at the frozen inputs, and state that the tie rule is load-bearing at the frozen m = 4 input.'}
