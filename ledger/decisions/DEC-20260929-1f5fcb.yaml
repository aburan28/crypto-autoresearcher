  # ---------------------------------------------------------------------------
  composition:
    rule: >-
      CA-3 and CA-8. Each joint is read against the plan's own
      breaking_artifact list and given one composed disposition naming the key
      applied. Verdicts are not counted. Keys are applied as written, and none
      is relaxed or tightened after reading.
    joints:
      - joint: J1
        owner: TASK-20260929-45204f
        attested: true
        disposition: holds
        key_applied: none triggered (the K-approve J1 condition is met)
        basis: >-
          All 116 comparisons with the frozen figures fall within the plan's
          tolerances: column within 8e-7 bit; window bounds within 0.0050 bit;
          critical g within 3.1e-4; m = 4 envelope edges within 0.0035 bit and
          closing g within 1e-4 on the exact committed grid, with contiguity
          identical. One m = 4 range is byte-identical in text and code. The
          L = 1 print is evaluated from the model terms and can fail. D1 is
          nowhere a budget, and D3 is recomputed by two routes. No listed
          breaking artifact is present. Low defects J1-D1 (residual
          attribution; the tie rule is load-bearing at the frozen m = 4
          input), J1-D2 (envelope figures quoted, not producer-recomputed,
          though correct on the committed grid) and J1-D3 (LA iteration
          constant not listed as a hidden cofactor) are carried as R2-J1-1 to
          R2-J1-3.
      - joint: J2
        owner: TASK-20260929-45204f
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          Code blocks extract and hash by two routes. stage0 passes its own S0.
          Coded G1 equals the rule text. I1 and I2 are the classes G1 exercises
          and Stage 2 imports under IR-6. AR-MU is binary-only. Reseed, seeds
          and generator are consistent. No instrument extends the shared
          package. Every approval field is present, approved_by is null and
          supersedes is present. Version 1 is unedited. Zero runs. The
          moderate gap J2-D1 is not scored as breaking, because the plan's
          item "a Stage 2 instrument ungated" is tied in the joint text to I1
          and I2, and the composer does not widen a key after reading. J2-D1:
          the step 2 self-tests of I1, I4 and oracle A carry no stop or
          invalidation consequence, and the I3 to I5 code is uncommitted and
          outside IR-6, so an instrument defect could reach a declared NEGATIVE
          through LOW-COV. It is mandatory in the revision (R2-J2-1).
      - joint: J3
        owner: TASK-20260929-594e8d
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: >-
          J3-D1 matches the plan's J3 artifact "a declared outcome no data can
          reach" (see decision_label). The red team offers a purposive reading
          of IR-5 ("invalidates that figure", with the version-1 carve-out),
          under which every outcome is reachable. The composer does not adopt
          it. The frozen text is unambiguous and run-wide. IR-5 is not coded,
          so an executor or a person would have to decide it. Adopting the
          rescuing reading after reading the reports would change an
          invalidation rule of a frozen protocol without a protocol_amendment,
          which a composition cannot do. What holds under that reading, as the
          reviewer's text-versus-code check and Monte Carlo of the contract's
          abstract model show (review computations, not observations): the
          coded classifiers equal the written rules; every declared outcome is
          reached by internally consistent patterns; no gated observable is
          confined inside its band; the no-reuse null fails every amortisation
          gate in every simulated run with no unmeasured constant; the usable
          tests are two-sided; CTL-6 is wired; A2 and A3 are restated at
          m = 2; and the modal label is POSITIVE (about 0.84). Further
          defects: J3-D2 (material; G1 false-fails about 9 percent under the
          true model through the control's KR band), J3-D3 and J3-D4
          (moderate), and J3-D5 to J3-D7 (minor).
      - joint: J4
        owner: TASK-20260929-594e8d
        attested: true
        disposition: holds
        key_applied: none triggered
        basis: >-
          No frontier, first-below-the-line or below-T_gen sentence is an
          outcome (TA-1 not fired). R-J4-1 and R-J4-4 are reworded as
          prescribed, and the TW-01 routing caution is in the outcome table.
          Every R-J3-2 convention travels with the column. The per-orbit
          pointer is conditional and marked not independently reviewed. The
          R-SRC citations carry URL, sha256, provenance retrieved and
          verified_by; the red team's own retrieval reproduces all three
          digests, and the composer found them in the version-1 red-team
          computations. No prime-field or deployed cell is designed. Moderate
          J4-D1 (the TW-01 containment clause is a c = 1 statement; the
          routing rule is c-independent and no outcome moves) and minor J4-D2
          to J4-D4 are carried.
      - joint: J5
        owner: TASK-20260929-739a0c
        attested: true
        disposition: agrees within tolerance on every compared quantity
        key_applied: K-indeterminate not triggered; the K-approve J5 condition is met
        basis: >-
          See j5_versus_contract. The attested verdict "inconclusive" is the
          card's designed verdict, and every Q0 to Q7 output was delivered, so
          K-infra does not apply.
    unowned_or_unattested_joints: none
    k_infra: not applied to any joint
    composite_reading: >-
      What stands: the deployed Stage 0 arithmetic (column, identity, LA term,
      m = 5 window at B_cap(5) in both conventions, both m = 4 slices, the
      m = 4 envelope on one committed range, the L = 1 ties and the rho
      reference), now on two independent routes, one of them blind. Also
      standing: the code binding and custody; the scope wording and
      conventions; the tripwire discipline; the exclusions; all four
      proves-too-much controls; and, under a scoped IR-5, a decision table
      whose outcomes are all reachable and whose null separates. What fails:
      one invalidation rule that, as written, voids every run, and with it the
      falsifiability of the validation arm that DEC-20260928-63addc C5
      requires. A contract whose every run is RUN-ARTIFACT is not a complete
      protocol. The remedy is one clause plus enumerated moderate items, all
      zero-compute.

