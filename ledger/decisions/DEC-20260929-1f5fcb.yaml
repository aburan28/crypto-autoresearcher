  j5_versus_contract:
    rule: >-
      CA-5, done before any key was applied. Frozen values come from the
      audit sheet's design_figures and constants, at bytes the reviewers hash
      to path_sha256. Tolerances are the plan's. The full row table is in the
      worksheet.
    constants_delta_adjustment: >-
      The audit sheet's constants_delta CD-1 states the deployed constants and
      the unrounded comparator inputs (33.075936, 32.414212, 11.010251) are
      unchanged. CD-2 to CD-6 do not enter Q1 to Q7. Adjustment applied: 0 bit
      on every quantity.
    range_mapping: >-
      The contract's committed range [29.036035, 35.996035] (697 points) is
      J5's range_b. J5's one extra grid point at log2 B_cap(4) moves no range_b
      figure (J5 Q0-07). The cap slice is compared at J5's B_cap(4) point, and
      the sub-cap slice at J5's per-B row k = 0.
    quantity_by_quantity:
      - {quantity: Q1 log2 B_cap at five m, largest_difference: 'below 1e-6 bit', within: true}
      - {quantity: Q2 log2 T_gen and P_gen at five m, largest_difference: '6e-7 bit', within: true}
      - {quantity: Q3a identity, largest_difference: 'none; exact on both sides', within: true}
      - {quantity: Q3b LA term and sign, largest_difference: '1e-6 bit; below P_gen at every m on both sides', within: true}
      - {quantity: Q5 log2 rho, largest_difference: '4e-5 bit (contract four-decimal rendering)', within: true}
      - {quantity: 'Q4 m = 5 bounds, D3 convention, g = 0, 2, 6, 10, 12', largest_difference: '0.0045 bit', within: true}
      - {quantity: 'Q4 m = 5 bounds, proposal convention, g = 0, 2, 6, 10, 12', largest_difference: '0.0046 bit', within: true}
      - {quantity: 'Q4 status at g = 13, 13.2, 14', largest_difference: 'none; empty on both sides in both conventions', within: true}
      - {quantity: Q4 critical g, largest_difference: '4.8e-5 (D3 convention), 3.2e-4 (proposal convention)', within: true}
      - {quantity: 'Q6 m = 4 envelope lower and upper edges, g = 0, 6, 10, 13, 14, 20, 30', largest_difference: '0.0035 bit', within: true}
      - {quantity: Q6 contiguity per g, largest_difference: 'none; single interval at every g under three readings', within: true}
      - {quantity: Q6 closing g on the committed range, largest_difference: '1.3e-4 (31.517 against 31.516871)', within: true}
      - {quantity: 'm = 4 cap slice, g = 0 upper end and critical point', largest_difference: '0.0046 bit; 3.1e-4', within: true}
      - {quantity: 'm = 4 sub-cap slice, g = 0, 6, 10, 13, 14, and critical g', largest_difference: '0.0047 bit; 2.4e-5', within: true}
      - {quantity: Q7 L = 1 tie budgets at m = 4 and m = 5, largest_difference: '4e-5 bit', within: true}
    q0_choices: >-
      Thirteen entries. None changes a reported value by more than 0.01, or
      otherwise by more than 0.0021 bit. The two frozen-input knife edges J5
      names are the residuals J1-D1 found, and the contract's tie rule
      classifies both.
    result: agreement within tolerance on every compared quantity; K-indeterminate not triggered

  j1_versus_j5: >-
    On every quantity both computed, J1 (independent code, not blind) and J5
    (blind, two disjoint paths) agree: column, identity, LA margins, m = 5
    windows and critical g, the m = 4 envelope edges, argmin abscissae,
    contiguity and closing g, the sub-cap critical g, and the m = 4 L = 1 tie.
    Under PD-R1 and PD-R5, J1's concurrence is weak corroboration. J5 is the
    structurally blind check, and it holds, now including the m = 4 envelope
    that version 1 left outside the blind joint.

  tripwires:
    applied_by: composer, reading each report's block and reading J5 directly (CA-7)
    TA-1: not fired (45204f and 594e8d readings; J5 asserts nothing about any contract)
    TA-2: not fired (no contradiction of KN-FIND-aa2efc as scoped by CORR-20260928-4cb669, EV-ICPERF-10c5fc as relabelled by CORR-20260928-5d81df, or KN-FIND-007; J4-D4 is an inexact paraphrase, not a contradiction)
    TA-3: not fired (no prime-field engine cell, no deployed run, no D1 budget, fixture as code, version-1 files unedited)
    TA-4: not fired (every card served at effort max through its breakthrough binding; no review-adversarial substitute)
    effect_applied: none required

  proves_too_much:
    PTM-A: meets failure signature (identity exact; above the frontier on both axes at matched advice; model window at B_cap empty for every c tested; residual J4-D1 at the Bernstein-Lange constants over the m = 4 range)
    PTM-B: meets failure signature (evaluated from the model terms and moves with C; ties reproduce the named single-target laws; at the frozen m = 4 input "no advantage" rests on the tie rule)
    PTM-C: meets failure signature (m = 5 window empty at g = 13, 13.2, 14 in both conventions; one prediction of every gated observable on all three cells; unequal test power by mu regime, J3-D2)
    PTM-D: meets failure signature (the null fails every amortisation gate in every simulated arm and lands in a declared non-POSITIVE outcome)

  discharge_check:
    rule: >-
      Plan composition.discharge_check. Every item of DEC-20260928-cec92e
      defects_for_revision maps to a named clause in the audit sheet's
      revision_discharge_table. The check is whether the owning joint's report
      contradicts that clause. The full table is in the worksheet.
    undischarged:
      - {item: R-J2-1, owner_joint: J3, reason: 'J3-D1: the restated NEGATIVE outcome and falsification criterion are unreachable as written'}
      - {item: R-J3-1, owner_joint: J3, reason: 'J3-D1: the outcome table''s assignment of every reachable result (P1 to POSITIVE) is contradicted as written; the null arm, the two-sided test and the CTL-6 wiring hold'}
    discharged: R-J1-1, R-J1-2, R-J1-3, R-J1-4, R-J1-5, R-J1-6, R-J2-2, R-J2-3, R-J2-4, R-J2-5, R-J2-6, R-J2-7 (in substance), R-J2-8, R-J3-2, R-J3-3, R-J3-4, R-J4-1, R-J4-2, R-J4-3, R-J4-4, R-SRC
    ruling_on_R_J4_2: >-
      The validator referred whether removing the prime-field self-test curve
      discharges "define" it. Ruled discharged: removal leaves no undefined
      object and keeps the R2 boundary clean, which was the requirement's
      purpose. The remaining step 2 self-tests are a separate gap (R2-J2-1).

