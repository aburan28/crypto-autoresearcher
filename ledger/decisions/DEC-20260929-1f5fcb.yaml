  rationale:
    - >-
      The plan's keys decide this outcome as written. K-approve needs J3 to
      hold and every revision requirement discharged. J3 breaks on an artifact
      the plan listed before the object existed, and two breaking requirements
      are undischarged through it. Rescuing approval with a purposive reading
      of a frozen invalidation rule would be a relaxation after reading, which
      needs a protocol_amendment and cannot be made in a composition.
    - >-
      The break is real and not a technicality. An executor applying IR-5 as
      frozen would invalidate every run, and a validation arm that can end
      only in RUN-ARTIFACT does not meet DEC-20260928-63addc C5 or the
      dispatch bias's demand for a heuristic validation that can fail.
    - >-
      Proportion. The same review shows the rest of the protocol sound: the
      deployed arithmetic now stands on two independent routes including the
      blind one; the code binding, custody, wording, conventions and
      exclusions hold; all four proves-too-much controls hold; and under a
      scoped IR-5 every outcome is reachable and the null separates. The
      remedy is local and zero-compute, so the decision is revise, not a
      return to ideation, and not approval.
    - >-
      Revise before run, not run then invalidate. Running the frozen contract
      would, by its own rule, produce RUN-ARTIFACT and read nothing, which
      spends a run to learn what the reviewers showed at zero compute.

