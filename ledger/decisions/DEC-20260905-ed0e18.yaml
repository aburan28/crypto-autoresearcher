coordinator_decision:
  id: DEC-20260905-ed0e18
  recorded_at: '2026-09-05'
  context: >-
    A standing-harness session (OpenCode runtime, branch
    satic-integrity-review-20260905, lane BATCH-2cca27, bus address
    coordinator-satic-2) takes over GOAL-SATIC-c49b77 per its recorded
    next_action as of frozen head
    8f80aec5d6b75a71e7de473cd8943503286b9931: "Obtain separate committed
    approval for a fresh bounded independent integrity review of existing
    launch archives using an early startup receipt and a durable final
    report; consider resource handling only after its disposition." This
    decision is that separate committed approval. Both prior independent
    review attempts (TASK-20260905-a05748 in BATCH-1a527c and
    TASK-20260905-b6c926 in BATCH-971dc7) ended as parent control-plane
    interruptions at a 240-second cap before the Validator wrote any
    report; both terminal receipts are administrative, not Validator
    reports, so IMP-1 (missing durable independent review) remains open.
  decision: approve
  decided_by: coordinator
  target_ids:
    - GOAL-SATIC-c49b77
    - BATCH-2cca27
    - TASK-20260905-5681fc
  rationale:
    - >-
      Rank this review first: it is the goal's own recorded next action,
      it directly discharges (or refutes) IMP-1, and it is cheaper and
      more grounded than any solver or resource-gate work. IMP-2
      (resource-limit gate) remains out of scope, per the recorded
      ordering "consider resource handling only after its disposition".
    - >-
      Authorize a single fresh independent Validator session at
      review-adversarial with xhigh requested effort, independent session
      required, no fallback, no degradation. If the serving session cannot
      honour the requested policy it must refuse to produce a report; a
      lower-effort or same-session stand-in is a silent downgrade this
      approval does not grant.
    - >-
      Root-cause correction to the two prior failures: both prior reviews
      were interrupted by the parent at a 240-second wall cap while the
      xhigh reviewer had not yet written its report. A budget that
      structurally cannot complete the assigned review is a gate in name
      only. This approval therefore sets a 1800-second wall budget,
      requires an early startup receipt (start.json) within the first 120
      seconds of work, requires a durable final report (report.json)
      before the deadline, and directs the parent NOT to interrupt at an
      arbitrary fixed deadline: a session that does not return is an
      infrastructure outcome to be recorded per core rule 3, never a
      review verdict.
    - >-
      Scope is administrative receipt integrity only, at frozen source
      head 8f80aec5d6b75a71e7de473cd8943503286b9931: (1) the five committed
      archive receipts of this campaign (TASK-20260905-79a686 at
      9a79547b63efbd538197d4399619b4daedd755ac; TASK-20260905-2b52a7 at
      d445fdbe8e549576e5cfbf4daf311c1f70b807b0; TASK-20260905-e2c12f at
      0136779b850cd243c53b46335902e1864868eb99; TASK-20260905-86ea49 at
      51e193bb1d93706ac6e1c61edb5074bf53579cc9; TASK-20260905-5dd82d at
      b384ae3cb724e2054456d2671f69720740915d6a, bound also at
      8f80aec5d6b75a71e7de473cd8943503286b9931) -- reachability from the
      frozen head, declared parent, exact changed-path set, independently
      recomputed blob hashes, and commit-message bindings; (2) the
      branch-side BATCH-1a527c queue archive blocks; (3) claim/release
      side files versus recorded queue task states; (4) confirmation that
      the two failed review receipts are parent administrative receipts,
      not Validator reports; (5) a known-bad control in which the same
      verification procedure is run against a deliberately corrupted
      receipt copy in scratch space and must flag it. No solver calls, no
      installations, no network, no Bedrock, no research runs, no
      scientific conclusion, no hypothesis or goal status change.
  evidence_refs:
    - ledger/goals/GOAL-SATIC-c49b77.yaml
    - ledger/decisions/DEC-20260905-8574d7.yaml
    - ledger/decisions/DEC-20260905-fd6675.yaml
    - ledger/decisions/DEC-20260905-293536.yaml
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/tasks/TASK-20260905-a05748/report.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-971dc7/tasks/TASK-20260905-b6c926/report.json
  limitations:
    - >-
      Provenance: internal. This session verified the cited commits and
      records against local git after `git fetch origin` and merged
      origin/main into the lane branch before authoring this decision
      (merge commit recorded in the opening archive); pre-merge
      codex-branch history was not re-derived beyond the cited bindings.
    - >-
      The exact resolved model of the review session is recorded by the
      reviewer in its own report; this approval records the requested
      policy only. No model attestation is claimed here.
    - >-
      The verdict scope is receipt integrity only. This approval does not
      authorize a claim-changing review round: the review cannot move a
      hypothesis status, close a lane, or support a headline claim, so per
      the DEC-20260905-fd6675 precedent the handoff carries review_plan
      null. The Coordinator's prior for this round (what it expects the
      review to find, recorded before any reviewer runs) is: the five
      bindings verify cleanly against their commits -- the dispatcher
      verified them at commit time and the portfolio sweep does not list
      GOAL-SATIC-c49b77 in needs_repair -- and the known-bad control
      fires. A mismatch, if found, is a recorded finding requiring a
      later scoped Coordinator decision and a superseding record; it is
      not repaired by editing a bound receipt.
  next_actions:
    - >-
      TASK-20260905-84e7b4 commits this decision, the frozen contract,
      the batch queue, the four handoffs, the launch note, the preflight
      record, and the lane registration, then verifies the opening
      archive bindings before any worker runs.
    - >-
      TASK-20260905-5681fc (Validator, review-adversarial/xhigh, fresh
      independent session) may start only after the opening archive is
      verified. It writes start.json within 120 seconds of starting work
      and report.json before its 1800-second deadline; the parent does
      not interrupt at an arbitrary deadline.
    - >-
      TASK-20260905-46f38c snapshot-archives the review artifacts;
      TASK-20260905-2fadfb records the disposition (DEC-20260905-29416d
      reserved), updates the goal head additively, and clears IMP-1 only
      if the report is durable, archived, verified, and published;
      otherwise IMP-1 stays open with the recorded outcome.
  knowledge_promotion:
    promoted: []
    not_warranted: An approval decision for an integrity review establishes no scientific finding.
