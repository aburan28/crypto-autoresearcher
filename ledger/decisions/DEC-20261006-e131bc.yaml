  context: >-
    /design-experiment, one contract. The named file
    IDEA-20261005-934aa5 is not on origin/main and is not on
    origin/design/ntru-bd02d9-fatigue. The same token is
    IDEA-20261006-934aa5 on that branch, question RQ-EWALK-8fa147.
    No hypothesis or experiment on origin/main cites that full id.
    The branch design/ewalk-934aa5 was created from origin/main at
    9c2bc35e93f0c2f83026c8e351c621f623bdfb90 and git merge origin/main
    reported already up to date.

    The contract freezes p=751, r=16, 20 walks of 5000 steps, and 30
    planted scalars 1..30. The pre-registered prediction is a
    length-3-or-6 fraction gap of at least 0.01 and a plain-over-orbit
    step ratio at most (23/20)*sqrt(6). A finished gap strictly below
    0.01, including a gap of 0, with the detector-null fractions
    strictly below 0.01 and the logs found, is a negative. No walk
    was run in this session. The session counted #E0 = 804, #E2 = 727,
    six sixth roots, and the generators (651, 302) and (0, 1).

    This session opened KR-RHO-0528e7, KR-RHO-fb88e6, KR-RHO-13bf67,
    and KN-TECH-018. Those rows are constant-factor and generic-floor
    controls. They are not the 0.01 gap.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success is
    both inequalities together, and it fails when the finished gap is
    below 0.01 against quiet detector nulls. No field required for
    approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any executor run.
    - A finished gap of 0 is reachable as a recorded outcome, so success is not automatic.
    - The |Aut|=2 curve and the negation-only arm on the j=0 curve are the same-shape detector controls.
    - A ratio above (23/20)*sqrt(6) is a second finished negative.
    - This session did not run a walk and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one pin at p=751. It does not transfer to cryptographic primes or to Koblitz curves.
    - KR-RHO-0528e7 already prices the sqrt(6) constant. This decision does not improve it.
    - A detector-null fraction of at least 0.01 is an instrument failure and is not a cycle-gap result.
    - An unfound logarithm is incomplete and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

  next_actions:
