  # ------------------------------------------------------ identifier substitution
  identifier_substitution:
    performed_before_staging: true
    placeholders_were_not_identifiers: >-
      ledger/evidence/EV-JINV-PENDING-ALLOCATION.yaml and
      ledger/decisions/DEC-20260815-PENDING-ALLOCATION.yaml CARRIED PLACEHOLDER
      TOKENS, NOT IDENTIFIERS. 'PENDING-ALLOCATION' is not a 6-hex token and can
      never collide with a real one, which is exactly why the scaffolding session
      - which had no shell with which to mint or --check an id - refused to guess
      one. That refusal was correct and is preserved here as the record of why
      the mechanism was used.
    minted_with: 'python3 tools/allocate_id.py --next evidence --area JINV and --next decision --date <today>'
    confirmed_free_with: 'python3 tools/allocate_id.py --check, across the identifier union, for both ids'
    substituted:
      - placeholder: EV-JINV-PENDING-ALLOCATION
        minted_identifier: EV-JINV-d080c6
      - placeholder: DEC-20260815-PENDING-ALLOCATION
        minted_identifier: DEC-20260818-c52d54
    substituted_in:
      - 'dispatch_queue.json tasks[TASK-20260815-48d541].write_scope'
      - 'dispatch_queue.json tasks[TASK-20260815-48d541].artifact_paths'
      - 'dispatch_queue.json tasks[TASK-20260815-48d541].handoff.deliverables'
      - 'dispatch_queue.json tasks[TASK-20260815-48d541].handoff.artifact_paths'
      - 'dispatch_queue.json tasks[TASK-20260815-48d541].archive.record_ids'
    one_control_plane_edit: true
    prose_reconciled_rather_than_substituted: >-
      THIS IS THE PART A BLANKET REPLACE GETS WRONG, AND IT WAS DONE
      DELIBERATELY. Each placeholder token occurred SEVEN times in the queue, and
      not every occurrence was an identifier slot. Four occurrences sat inside
      PROSE DESCRIBING THE PLACEHOLDER MECHANISM ITSELF - the ledger-archive
      constraint beginning 'MINT THE LEDGER IDENTIFIERS FIRST', the
      archive.ledger_record_id_provenance block, and DEC-20260815-f7e2d4's own
      limitation naming the two declared paths. Substituting the real ids into
      those sentences would have produced a self-contradicting record: a
      statement that EV-JINV-d080c6 and DEC-20260818-c52d54 'are placeholder
      tokens, not identifiers, and no identifier was invented here'. The
      structural slots were substituted; the explanatory prose was RECONCILED
      into the past tense and now states what is true - that the tokens were
      placeholders, that the real identifiers were minted with
      tools/allocate_id.py, --checked free, and substituted, and which
      identifiers they are. The explanation of why placeholders were used is
      PRESERVED, not deleted; it is the record of a correct refusal and is worth
      keeping.
    queue_path_remains_control_plane_only: true
    queue_path_not_committed_as_a_task_artifact: true
    ids_guessed_or_scanned_for: 0
    what_this_decision_does_not_do_to_the_producer_package: >-
      NOTHING. planning-gate.yaml lists the prospective paths
      ledger/evidence/EV-JINV-PENDING-ALLOCATION.yaml and
      ledger/decisions/DEC-20260815-PENDING-ALLOCATION.yaml in its artifacts
      section, and seven further BATCH-/TASK-PENDING-ALLOCATION prospective
      paths. That file is IMMUTABLE, is outside this task's write scope, and was
      not touched. The binding recorded here - that the batch's two placeholders
      resolved to EV-JINV-d080c6 and DEC-20260818-c52d54 - is stated in this
      record, never by editing the snapshot.

  # ------------------------------------------------------------------- rulings
  rulings:
    - id: R-1
      subject: 'MF-2, the producer''s own material finding on obligation 8''s provenance'
      ruling: RETIRED_AS_NOT_REPRODUCIBLE
      raised_by: producer TASK-20260815-f04b54
      contested_by: 'validator TASK-20260815-fa8f06, objection OBJ-1, severity MATERIAL'
      endorsed_by: 'red team TASK-20260815-3ec919, under the same narrow search'
      finding: >-
        MF-2 asserted that the frozen contract's obligation-8 provenance
        attribution 'does not reproduce', on the basis that a search of the
        committed BATCH-d7e255 v6 dispatch_queue.json for the literal 441350
        found no occurrence. THE ATTRIBUTION DOES REPRODUCE. The value is present
        in that exact file, in the exact completion note the contract cites,
        WRITTEN WITH A THOUSANDS SEPARATOR: the completion_note of tasks[0],
        which is TASK-20260813-5b8a62, reads in part 'all six inherited positive
        hashes, 441,350 recursively typed nodes, and all three stored-object
        bindings', and the same note carries '45/45 bool/int aliases ... and both
        latent dict/list container probes'; the completion_note of tasks[2],
        TASK-20260813-1851d0, carries '2/2 latent container probes' and
        'recursive census and manifests'. Both cited sources carry what the
        contract says they carry.
      the_check_and_its_result: >-
        In that file, a search for the separator-free literal 441350 returns 0
        and a search for 441,350 returns 1. The second search returning 0 would
        falsify this ruling. It returns 1.
      verified_independently_by_this_coordinator_session: >-
        YES, AND NOT TAKEN ON THE VALIDATOR'S WORD. This session ran its own
        read-only content search over the working tree of branch
        claude/endo-001-gate-reviews-20260818 and obtained 0 matches for 441350
        and 1 matching line for 441,350 in that file, and confirmed the matched
        line lies inside the tasks[0] object whose id is TASK-20260813-5b8a62 -
        the exact task the contract's provenance line names. This session
        computed no hash and asserts nothing about that file's bytes beyond these
        counts.
      why_this_is_the_batch_s_most_consequential_finding: >-
        A NEGATIVE CLAIM RESTED ON A SEARCH NARROWER THAN THE CONCLUSION DRAWN
        FROM IT, and that conclusion is now carried in TWO IMMUTABLE COMMITTED
        RECORDS (preservation-manifest.yaml and snapshot-receipt.json) AND TWO
        COMMIT MESSAGES (7ee825ff and 23c66739a). The bound value is not affected
        - 441350 is correct and was independently reproduced twice, once by
        executing the committed validator and once by reimplementing its census
        algorithm from source with zero runs. What is affected is the record: the
        program has recorded, durably, that a committed artifact says something it
        does not say, in the direction of MANUFACTURING A DEFECT THAT DOES NOT
        EXIST.
      effect_on_obligation_8: >-
        NONE. Obligation 8's binding stands unchanged and fully verified: 441350
        recursively typed nodes with the census dict 40313 / list 20036 / string
        180689 / integer 100276 / boolean 31 / null 100005, manifest hash
        20ab60e1af5ca31f3c66586efbd3317dfcd81f7c90609129ebed19986769281f, two
        latent container probes LT-001 and LT-002, both rejected. Only the
        attribution claim is retired.
      effect_on_the_frozen_contract: >-
        The frozen contract's obligation-8 provenance line is ACCURATE and needs
        no change. It was the finding against it that was wrong.
      how_it_is_retired: >-
        BY THIS SUPERSEDING RECORD AND BY NOTHING ELSE. No committed artifact, no
        commit message, no producer file, no receipt and no frozen contract is
        edited, corrected, normalized or rewritten. The immutable records
        continue to carry MF-2 as authored; this decision is the record that a
        later reader must read alongside them.
      what_would_reopen_it: >-
        A demonstration that the comma-formatted occurrence is not in the cited
        file, or is not in the cited completion note, or that the frozen
        contract's provenance line cites some other file. None of the three
        holds.
      residual_and_recorded: >-
        This ruling does NOT create a ledger/corrections/CORR-* record, because
        ledger/corrections/ is outside this task's write scope. Whether campaign
        convention additionally requires a CORR-* entry for a retired material
        finding is carried into the single next action rather than assumed
        settled.

    - id: R-2
      subject: 'the fifteen asserted budget magnitudes in PB-1..PB-5'
      ruling: SUSTAINED
      found_independently_by: ['validator OBJ-3', 'red team RT-O3']
      finding: >-
        The fifteen magnitudes - wall_clock_seconds, memory_gb and disk_bytes for
        each of PB-1 through PB-5 (600/1/1048576, 3600/2/1073741824,
        5400/4/8388608, 5400/4/4194304, 1800/2/4194304) - ARE ASSERTED. Both
        reviewers enumerated every field of all five items independently and
        found that none carries a source, provenance, derivation, basis or
        citation for those magnitudes, and none is disclosed as UNDERIVED. The
        per-item `assumption` field names a methodological assumption about the
        nature of the work, never a basis for the number. PB-1's single
        citation-bearing field cites a recording requirement, not its 600-second
        figure.
      what_is_falsified: >-
        The document's own two UNIVERSAL claims about itself -
        what_this_document_is_not ('Every number in it was read from a committed
        artifact and is cited to that artifact, or is disclosed as UNDERIVED with
        its reason') and nonclaims[3] ('No number in this document was invented,
        interpolated, or back-filled. Every one is cited to a committed artifact
        or disclosed as underived with a reason'). Fifteen numbers satisfy
        neither disjunct. The universal claims are hereby recorded as FALSE AS
        STATED and true only of the estimates section.
      the_contrast_that_must_not_be_lost: >-
        THE BUDGETS ARE THE ASYMMETRY; THE ESTIMATES ARE NOT. E4-E7 are GENUINELY
        DERIVED and were traced three levels by the validator - eight
        retained-byte subtotals as exact cardinality x declared per-item byte
        bound, thirteen cross-binding resolutions from their exact formulas, and
        those formulas' inputs to the worksheet's frozen_dimensions block -
        terminating in nine per-item serialization byte constants inside an
        approved committed artifact that labels itself honestly as a static
        source bound rather than a measurement. That is an HONEST TERMINUS. And
        E1, E2, E3 and E8's current-host half are CORRECTLY DISCLOSED AS
        UNDERIVED rather than filled with a plausible number, which the validator
        calls THE STRONGEST THING IN THE PACKAGE. A successor must not read this
        ruling as a finding against the estimates. It is not.
      severity_recorded_at_both_readings: >-
        The validator kept it MINOR because PB-1..PB-5 are explicitly proposals
        that are not grants, each carrying experiment_runs_authorized 0, none
        authorized, each requiring its own separately authorized decision,
        handoff and review before existing as work - so an asserted ceiling on
        unauthorized future work misleads nobody about anything measured. The red
        team kept it MATERIAL because an unsourced precise number whose only
        possible use is to justify a budget nobody granted is 'the residue of
        authorization even when the authorization words are all correct'. BOTH
        READINGS ARE RECORDED AND NEITHER IS COLLAPSED INTO THE OTHER.
      binding_effect_on_successors: >-
        NO LATER DECISION MAY CITE ANY OF THE FIFTEEN MAGNITUDES AS A DERIVED
        BUDGET. Each must first be given a committed antecedent - for PB-3, PB-4
        and PB-5 this batch's own declared task budgets would serve, if stated -
        or be marked UNDERIVED_DISCLOSED as E1-E3 are, or be removed. PB-1's 600
        and PB-2's 3600 have no visible antecedent at all.
      secondary_precision_item_carried: >-
        budgets.proposed_budget_envelope_totals.relation_to_frozen_caps says
        'Every figure above is below every corresponding frozen cap' without
        saying which cap corresponds to which figure. Under one natural
        correspondence it is false - PB-2's disk_bytes 1073741824 and the
        1091567616-byte envelope both exceed individual_artifact_bytes_max
        536870912 - and under the correspondence the field's next sentence
        implies, the comparison does not apply at all. Either way it is
        reassurance rather than a check. No grant, no measurement, no consequence.

    - id: R-3
      subject: 'OBD-1 / MF-1, the third alias-suite manifest bound by no obligation'
      ruling: CARRIED_OPEN_NOT_RESOLVED
      authority_statement: >-
        I DO NOT HAVE THE AUTHORITY TO RESOLVE IT IN THIS ARCHIVE, AND I SAY SO
        RATHER THAN RESOLVING IT QUIETLY. Resolving OBD-1 means choosing which
        reading of the GOAL HEAD's own next_action clause 'the 45-case alias
        suite and both manifests' governs - reading A, the frozen contract's
        (type_alias_universe + legacy mutation), or reading B, the literal one
        (type_alias_suite + one other). That is an INTERPRETATION OF THE MUTABLE
        GOAL HEAD. ledger/goals/GOAL-ENDO-001/goal.yaml is in NO task's write
        scope in BATCH-25e27c, by explicit queue constraint and by
        DEC-20260815-f7e2d4 (goal_head_in_any_task_write_scope: false,
        goal_head_edit_authorized: false), and this batch's admission boundary
        sets research_status_change_authorized false. This campaign's own
        established practice is that the head moves only under a separately
        authorized goal-head reconciliation - it has done so twice,
        TASK-20260813-e1a236 and TASK-20260813-6ca706. A superseding decision
        under its own authorization is therefore the correct instrument, and it
        does not exist. Adopting a reading here would be exactly the quiet
        resolution the batch forbids.
      what_is_now_established_and_was_not_before: >-
        BOTH REVIEWS STRENGTHENED THE DEFECT INDEPENDENTLY, and reading B gained
        computational support. The validator recomputed
        7415d195d5c7c2cd099b566a5c123f4adb3f45fb19c2ccc7077b37cf23da9c43 as
        sha256(canonical_bytes(type_alias_suite)) over the 45-entry list and found
        it in NINE committed places - INCLUDING THE CONTROLLING DECISION
        DEC-20260813-d14d6b AND THE NEUTRAL EVIDENCE RECORD EV-JINV-55ff88 - and
        ZERO times in the committed BATCH-d7e255 v6 dispatch_queue.json, where
        595ccde1... occurs 4 times and e96a9359... occurs 5 times. That asymmetry
        independently EXPLAINS how the frozen contract's reading arose (the
        scaffolding session read the queue, where the third manifest does not
        appear) and CONFIRMS that under that reading an approved,
        decision-cited manifest is bound by no obligation at all. The red team,
        independently and by direct computation, established that 7415d195 hashes
        the list LITERALLY NAMED `type_alias_suite` (suite_name: type_alias_suite,
        exact_count: 45) while 595ccde1 hashes type_alias_universe.positions -
        'which makes OBD-1 MATERIAL rather than cosmetic'.
      producer_handling: >-
        CORRECT AND EXPLICITLY ENDORSED. It bound ALL THREE manifests, stated both
        candidate readings, selected neither, and disclosed the defect as open. The
        frozen contract itself instructed exactly this. Neither review resolved it
        and neither claimed the authority to; the validator said in terms that
        resolution 'is a goal-head interpretation reserved to a separately
        authorized superseding Coordinator decision'.
      what_is_NOT_at_risk: >-
        No approved byte, no bound value and no terminal record. All three
        manifest hashes reproduce exactly under both reviews. OBD-1 is a defect in
        the OBLIGATION COVERAGE, not in the artifact.
      carried_to: 'the single next action below, as the item requiring its own authorization'

    - id: R-4
      subject: 'RT-O1 and RT-O2, the cost-model findings'
      ruling: SUSTAINED_AND_BOTH_CUT_CONSERVATIVELY
      RT_O1: >-
        The gate's 'four gates fail by roughly 1e2 to 1e5' framing PRESENTS ONE
        FACT AS FOUR. All four reduce to all_replacement_pairs_upper: E7 = 3 x E4
        exactly (the committed formula for total_logical_io_bytes_upper is
        literally '3*retained_artifact_bytes_upper'), E5 = 99.5658 percent of E4
        (its committed formula is 'all_replacement_pairs_upper*256'), and
        E6 = ceil(E4 / 536870912). The gate demonstrably knew the worksheet
        carries formula fields, because it reproduced E6's formula as ARITH-2 and
        did not reproduce E7's - a SELECTIVE failure to carry provenance, not an
        absence of it.
      RT_O2: >-
        The 3x logical-I/O model is UNSHARDED, while E6 makes at least 93969
        shards mandatory under the frozen individual-artifact cap. A 93969-way
        shard-and-merge design necessarily re-reads and re-writes across the merge
        boundary, and that I/O is not in a flat multiplier. E5's uncertainty field
        flags the sharding conditionality; E7's never propagates it. CONSEQUENCE:
        E7 = 151347407533824 IS NOT AN UPPER BOUND FOR ANY RUNNABLE DESIGN under
        the frozen caps; for admissible sharded designs it behaves as a LOWER
        bound. This is the single place in the estimates section where the stated
        direction of uncertainty is wrong.
      direction_ruling: >-
        BOTH CUT CONSERVATIVELY AND NEITHER MAY BE USED TO CLEAR THE GATE. The
        single underlying quantity still exceeds the retained cap by ~1.17e4 on
        its own, and the true admissible-design I/O is HIGHER than the figure the
        gate states. Recording them makes the fail-closed disposition MORE firmly
        grounded, not less. Any successor that cites RT-O1 or RT-O2 as headroom
        is misreading this decision.
      forward_value_recorded_as_the_batch_s_most_useful_output: >-
        ONE LEVER CONTROLS ALL FOUR GATES: all_replacement_pairs_upper,
        196211340000 pairs at a declared 256 bytes each. A design author reading
        the gate as written would believe four separate cap problems must be
        solved; there is one, with a single scalar target of roughly a 1.2e4-fold
        reduction. The red team's method-ceiling attack reaches the same place
        from the other side: even granting perfect implementation, zero overhead
        and full parallelism, that one term must fall by ~1.2e4 before ANY of
        E4-E7 can pass, so the declared Phase B workload fails against the frozen
        caps BEFORE implementation, on the committed numbers alone.
      omitted_costs_ruling: >-
        RT-O12 SUSTAINED AS A NARROW GAP. Sharding-induced I/O and communication
        are charged nowhere and the single-host assumption that makes that
        legitimate is never stated. The program's standing concern - that cost
        claims omit exactly what dominates at scale - is CHECKED AND LARGELY
        CLEAR here: peak memory, retained bytes, largest single artifact, shard
        count, logical I/O and free disk are all charged, not merely time. The
        gap is RT-O2's conditionality plus this one, not an across-the-board
        omission.

    - id: R-5
      subject: 'RT-O4, the twice-dropped E14 C1 clause'
      ruling: SUSTAINED
      flagged_hardest_by: red team
      finding: >-
        The gate cites the goal head's E14 C1 load precondition TWICE - at
        PB-1.precedent_read and at CT-4.source_read - and BOTH TIMES DROPS the
        committed clause that the host has RECENTLY RUN BETWEEN LOAD 18 AND 116
        ON 14 CORES and that the whole cost model is A LINEAR EXTRAPOLATION FROM
        ONE 128.234 s RUN, rendering it instead as declining to start above 'a
        DECLARED LOAD THRESHOLD'.
      why_it_is_the_sharpest_citation_finding: >-
        The omitted clause is THE STRONGEST COMMITTED EVIDENCE AGAINST PB-2's
        linear-extrapolation assumption - the assumption the gate itself names in
        three separate places as THE WEAKEST LINK IN THE WHOLE PLAN. The gate
        cites the sentence for the part that supports proposing PB-1 and omits
        the part that impeaches PB-2. It is also the exact inverse of R-2: there,
        numbers appear without sources; here, a source's committed number
        (threshold 28 on 14 cores) is replaced by prose, in a document whose
        stated rule is that every number is cited to a committed artifact. A ~6x
        load spread on the intended host is a ~6x wall-time spread, which
        silently threatens PB-2's uncited 3600 s figure.
      verified_by_string_count: >-
        goal.yaml contains '128.234' 4 times, 'load average 28' once, 'between 18
        and 116' once and '14 cores' 3 times; planning-gate.yaml contains
        '128.234' ZERO times, '116' ZERO times and '14 cores' ZERO times.
      verified_independently_by_this_coordinator_session: >-
        YES. A read-only content search of planning-gate.yaml for '128.234',
        '14 cores' and 'load average 28' returned ZERO matches for all three.
      binding_effect_on_successors: >-
        Any successor that carries PB-2 forward must reproduce the committed
        clause VERBATIM, including the 128.234 s single-run basis, the 18-116
        load range and the 14-core count, in the same field as the citation.

    - id: R-6
      subject: 'RT-O5, RT-O6, RT-O7, RT-O8, RT-O9 - stopping rules, controls, and precondition scope'
      ruling: ALL_SUSTAINED
      RT_O5_stopping_rules: >-
        NO STOPPING RULE CAN REFUSE PB-3, the plan's central deliverable. The
        concrete counterexample stands and is not answerable by argument: a PB-3
        design reducing retained bytes tenfold to 5.0e12 using NONE of the five
        prohibited credits is still ~1164x over the 4294967296-byte retained cap
        and still needs ~9313 shards against a cap of 24, and fires none of SR-1
        through SR-9. The general clause promises each rule 'can fire against the
        interest of whoever is running the work'; for the item most likely to be
        argued about, none can.
      RT_O6_CT_3: >-
        CT-3 CANNOT FAIL. Its matched null is a NUISANCE POPULATION whose
        cardinality is DEFINITIONALLY COPIED from the intended arm - the committed
        formula for p_rank_nuisance_total_map_contexts is literally
        'd0_intended_total_map_contexts' - so cardinality equality is evidence of
        nothing about shape; and its destroying parameter, k = 0, makes both arms
        unplanted, so indistinguishability is satisfied by construction. It
        measures a false-positive rate and never tests whether the null is matched
        ON P-RANK, the only property it exists to control. A control that could
        never have failed is decoration.
      RT_O7_CT_4: >-
        CT-4 WOULD REJECT CORRECT MEASUREMENTS. Host load destroys the WALL rate;
        CPU-seconds is substantially load-invariant BY CONSTRUCTION and peak
        resident set size is essentially load-invariant, so a reviewer applying
        CT-4's own sentence to a correct CPU-seconds measurement would reject it.
        A false-positive control is the exact mirror of a control that cannot
        fire, and both are failures of the same discipline. The fix requires no
        new measurement: bind load-dependence to the wall rate only and bind
        CT-4's already-correct second destroying parameter - cardinality doubling
        must approximately double CPU-seconds - to all three quantities.
      RT_O8_EV_PRE_1: >-
        EV-PRE-1 makes a CURRENT host free-disk observation a precondition on
        EVERY forward path, while EV-PRE-3 itself names the two honest remaining
        routes as a separately authorized cap change or CLOSURE OF THIS LANE WITH
        ITS OBSTRUCTION NAMED, NEITHER of which needs a host. A planning document
        cannot make a run automatic by authorizing it - this one does not - but it
        can make a run unavoidable by writing the precondition list so that every
        exit runs through it. THIS IS NOT AN AUTHORIZATION and is not recorded as
        one; it is scheduling pressure inside a boundary description, fixable in
        one clause.
      RT_O9_SR_1: >-
        SUSTAINED AS MINOR. SR-1 cannot fire today because the refreshed preflight
        it observes does not exist, and the only committed observation already
        fails its threshold by exactly 1310720/88369 = 14.832351x. PB-1's purpose
        describes this as routine hygiene. It is a re-test of a check that
        currently fails by more than an order of magnitude. EXPLICITLY NOT AN
        ARGUMENT TO SKIP PB-1 - a cheap measurement expected to fail is still
        worth taking; what is objectionable is budgeting it in language that hides
        the prior.

    - id: R-7
      subject: 'the two under-claims: OBJ-2 and RT-O10'
      ruling: SUSTAINED_AS_UNDER_CLAIMS_AND_RECORDED_UNDER_THE_SYMMETRY_OBLIGATION
      why_recorded_at_all: >-
        Premature closure and overclaiming are symmetric failures. A package that
        understates its own evidence is recorded with the same care as one that
        overstates it, and the direction of error is stated.
      OBJ_2: >-
        Obligation 3's note calls `equality_included` 'not a literal field name in
        the committed source'. IT IS ONE: it occurs in
        experiments/EXP-JINV-bd141d/amendments/v5-derivation-fixtures.json (the
        validator counts 4 occurrences), it is A KEY OF THE STORED
        p_value_numerator OBJECT the validator re-derived independently in both
        orders, and it also appears in DEC-20260813-d14d6b. The producer
        DOWNGRADED AN EXACT FIELD MATCH TO A PARAPHRASE, against its own interest.
        This session independently confirmed the literal string is present in that
        fixture file; it did not recount the figure of 4.
      RT_O10: >-
        The preservation manifest declares its own 441350-node census unverifiable
        without a validator run. THE RED TEAM DISPROVED THAT WITH ZERO RUNS,
        obtaining exact agreement in all six categories by parsing the committed
        fixture and traversing it with exact type() tests, and reproducing the
        manifest hash by reimplementing the algorithm from the read source. The
        effect of the under-claim was to leave obligation 8's central number
        carried as unverified when it was cheaply checkable.
      direction_of_error_in_both_cases: CONSERVATIVE - nothing was overclaimed

    - id: R-8
      subject: 'RT-O11, the archive-custody defect'
      ruling: RECORDED_AS_INFRASTRUCTURE_SIGNAL_AND_CARRIED_NOT_REPAIRED_HERE
      finding: >-
        snapshot-receipt.json declares nine post-commit verification requirements
        of the dispatching session, among them 'path_sha256 filled for all four
        keys' and 'actual first parent recorded, not assumed'. In the durable
        record all four path hashes and both commit fields are null, and exactly
        one commit has ever touched the receipt, so nothing filled them and
        nothing can without superseding.
      it_is_infrastructure_signal_not_evidence: >-
        A custody-bookkeeping defect is NEVER a negative mathematical result about
        JINV, transport, isogeny classes, an instrument, a curve, a prime, or
        ECDLP, in either direction, at any scale. Leaving the fields null rather
        than fabricating them was the CORRECT call under the no-fabrication rule;
        the defect is that the filling step never happened.
      how_far_it_is_already_answered: >-
        SUBSTANTIALLY. The validator established that the content binding for this
        archive EXISTS - in the BATCH-25e27c queue archive block, filled at commit
        23c66739aa192e52fcb2007bae647d106bc46bed - and recomputed all four values
        there, all matching. The red team independently computed all four artifact
        hashes and confirmed snapshot == HEAD == working tree for each. THE
        CONTENT IS VERIFIED; IT IS SIMPLY NOT VERIFIED BY THE RECEIPT.
      why_not_repaired_by_this_task: >-
        The snapshot receipt is immutable and outside this task's write scope, and
        this session has no shell with which to compute a hash - writing one would
        be fabrication. The red team's suggested fix (a superseding receipt
        carrying the hashes) is a separate authorized act, not a silent
        back-fill.
      what_this_task_does_instead: >-
        The TASK-20260815-48d541 ledger receipt is written and post-commit
        verified BY THE DISPATCHING SESSION, which holds a shell. Its eight-path
        path_sha256 map is where this archive's content binding must actually
        land, and the completion gate requires paths_verified 8 and
        generated_paths_skipped empty.
      structural_item_carried: >-
        A reader holding only a snapshot receipt cannot content-verify an archive,
        because the binding lives in dispatch_queue.json - which this batch's own
        constraint declares control-plane only and not a task artifact. That is a
        convention-level tension, not a defect of this package, and it is recorded
        for whoever revisits archive-receipt shape.

    - id: R-9
      subject: 'the authorization surface'
      ruling: NO_AUTHORIZATION_WAS_SMUGGLED_AND_THIS_IS_RECORDED_AS_A_POSITIVE_FINDING
      finding: >-
        BOTH REVIEWS LOOKED AND BOTH FOUND NONE. The red team attacked the surface
        first and hardest, examining every field, sentence, default and omission
        for language that authorizes, presumes, schedules or makes automatic any
        of the fourteen forbidden items, and found NO SENTENCE GRANTING ANY OF
        THEM. The validator did not read for tone: it PARSED all four artifacts
        and enumerated every key ending in _authorized, _allowed or _preapproved
        plus automatic_execution and automatic_continuation, and found the ONLY
        non-false, non-zero values in the whole package are the sessions' own
        compute budgets in their runtime receipts.
      why_it_is_recorded_as_positive: >-
        BECAUSE IT IS WHAT THE GATE WAS REQUIRED TO BE. The goal head's next_action
        is NONAUTOMATIC. A gate that plans work without authorizing it is the
        entire content of that mandate, and under two independent adversarial
        attacks it held. Recording only the defects and not this would misdescribe
        the batch.
      resource_incomplete: >-
        STILL FAIL-CLOSED, UNCHANGED, with 0 gates cleared and 0 prohibited
        credits taken. Verified three ways by the validator (the snapshot commit
        touches nothing under experiments/ or ledger/; v6.yaml's
        unchanged_resource_gates still reads controlling_disposition
        resource_incomplete with the same nine check results; the package says so
        in terms) and by a five-route attack by the red team on compression,
        deduplication, hash-only substitution, omitted cells and budget widening,
        which found NO ROUTE. All eleven frozen caps are restated at their
        committed values; none is widened.
      the_failure_mode_that_is_absent: >-
        A package that produced estimates and then treated having estimated as
        having passed. This one states 'PRODUCING AN ESTIMATE IS NOT PASSING A
        CHECK, AND PASSING A CHECK IS NOT CLEARING THE DISPOSITION' and records
        gates_cleared 0 in four separate artifacts.

    - id: R-10
      subject: 'the transferable pattern both failures share'
      ruling: ADOPTED_AS_A_STANDING_REVIEW_REQUIREMENT_FOR_THIS_CAMPAIGN
      the_pattern: >-
        BOTH OF THE PRODUCER'S FAILURES ARE NEGATIVE CLAIMS ABOUT ABSENCE. The
        validator re-performed all eighteen of the manifest's cited reads and
        EVERY POSITIVE READ-CLAIM REPRODUCED - not one failed. The only two
        statements in the package that do not survive re-verification are its two
        assertions that something is ABSENT from a committed artifact (MF-2: the
        literal 441350 in the v6 queue; OBJ-2: equality_included as a literal
        field name), and both failed for the same reason: A SEARCH NARROWER THAN
        THE CONCLUSION DRAWN FROM IT.
      the_requirement_this_creates: >-
        THIS PRODUCER'S POSITIVE BINDINGS ARE TRUSTWORTHY AND ITS ABSENCE CLAIMS
        ARE NOT, AND THE SAME IS NOW ASSUMED OF ANY SESSION IN THIS CAMPAIGN. From
        this decision forward, any record in GOAL-ENDO-001 asserting that a value,
        field or string is ABSENT from a committed artifact must record THE EXACT
        SEARCH THAT PRODUCED THE ABSENCE - the literal pattern, the exact paths
        searched, and the count returned - alongside the claim, so a reader can
        see whether the search was as wide as the conclusion. An absence claim
        without its search is not a finding.
      it_is_not_a_knowledge_promotion: >-
        This is a campaign review discipline, not a durable research finding about
        any mathematical object. See knowledge_promotion below.

  # ------------------------------------------------------------------ rationale
  rationale:
    - >-
      DUAL REVISE IS RECORDED AS DUAL REVISE. Both independent reviews returned
      REVISE and neither is softened, reweighted, or read as a qualified pass. The
      handoff bar was 'PASS only if every check holds with ZERO MATERIAL
      OBJECTION'; there are ten material objections across the two reports (one
      validator, nine red team). The planning-gate package is therefore NOT
      approved as a final gate and the goal head's next_action sentence is not
      discharged by it. Nothing is overruled: material_blockers_overruled is 0.
    - >-
      THE FACTUAL LAYER SURVIVED AND THAT IS STATED AS PLAINLY AS THE DEFECTS.
      Neither review found a single wrong value. Between them they recomputed 17
      SHA-256 values, 11 sizes, 12 commits, 33 arithmetic and cost values, 3 suite
      manifest hashes derived from an independently reconstructed canonical
      encoding, one recursive type-manifest hash, a 441350-node census in all six
      categories, 26 committed formula fields, an eight-component byte sum and two
      budget totals - with ZERO MISMATCHES on either side. All 18 preservation
      obligations verified, 0 dropped, 0 reworded, 0 silently resolved, 0 bound to
      a value that does not match the tree, and all 18 obligation_verbatim strings
      occur verbatim in the committed goal head, with DEC-20260813-d14d6b's action
      character-identical at 1222 characters. A REVISE on this record is a REVISE
      about how things are said and how controls are built, not about whether the
      numbers are right.
    - >-
      THE MOST CONSEQUENTIAL FINDING IS A RECORD-INTEGRITY FAILURE, NOT A
      SCIENTIFIC ONE. MF-2's negative claim rests on a search narrower than its
      conclusion, and that conclusion now sits in two immutable records and two
      commit messages. R-1 retires it by superseding record, verified
      independently by this session, and R-10 turns the pattern into a standing
      requirement so the next absence claim carries its search.
    - >-
      THE BUDGETS ARE THE ASYMMETRY, AND THE ESTIMATES ARE THE MODEL. Fifteen
      magnitudes are asserted with neither citation nor underived disclosure,
      falsifying two universal self-claims; meanwhile E4-E7 are derived through
      three traceable levels to an honest terminus, and E1-E3 and E8's current-host
      half are correctly disclosed as underived rather than filled with a
      plausible number. The right correction is to hold the budgets to the
      standard the estimates already meet - not to weaken the estimates.
    - >-
      THE COST FINDINGS ALL CUT TOWARD FAIL-CLOSED. RT-O1 collapses four apparent
      failures into one, and that one still exceeds its cap by ~1.17e4. RT-O2
      shows the logical-I/O figure is not an upper bound for any runnable design,
      so the true figure is higher. RT-O12's omitted communication cost, if ever
      charged, only adds. NOTHING IN EITHER REVIEW CREATES HEADROOM, and a
      successor citing them as headroom is misreading this decision.
    - >-
      THE GATE HELD THE LINE THE MANDATE ACTUALLY DREW. Two adversarial sessions
      looked for smuggled authorization by two different methods - prose attack
      and exhaustive key enumeration - and found none; resource_incomplete is
      unchanged and fail-closed with zero gates cleared and zero prohibited
      credits; every frozen cap is restated at its committed value; zero runs
      occurred; no v6-or-earlier byte changed; the goal head is untouched. The
      package's defects are real and named, and they are defects of a document
      that respected its boundary.
    - >-
      INDEPENDENCE IS RECORDED AT ITS TRUE STRENGTH AND NO HIGHER. Both reviewers
      and the producer resolve to the same model family, both reviewers disclosed
      it unprompted, and their agreement is CORRELATED SAME-MODEL JUDGEMENT - one
      opinion sampled twice, not distinct-model corroboration. What is genuinely
      uncorrelated is their CONSTRUCTIONS: one executed the committed self-test in
      an audited scratch copy and re-derived the same values without it; the other
      never executed the pinned module at all, deriving the canonical encoding
      itself and reimplementing the census. Two different routes reached the same
      values, and - separately and without contact - both landed on the same
      fifteen asserted budget figures. That is the part worth relying on. And the
      correlated failure mode is not hypothetical here: on MF-2 the red team ran
      the producer's own too-narrow search and endorsed its conclusion, while the
      validator varied the search and found the truth. Two of three same-family
      sessions made the identical mistake.
    - >-
      THE OBSTRUCTION IS A MEASUREMENT, NOT A FATIGUE REPORT, AND ITS REVERSAL WAS
      CHECKED. EV-JINV-d080c6 records it as an exact integer accounting over a
      stated scope with a stated basis and an explicit statement that it is not a
      measurement of a running system or of any mathematical object. Its
      resource_check found a real reading - one controlling lever and a single
      scalar target - and that reading is carried into the next action rather than
      admired and dropped. The second candidate reading, that the overshoot says
      something about the JINV mechanism, was considered and REFUSED: it is a fact
      about a declared serialization budget.
    - >-
      THE LANE IS NOT CLOSED AND MUST NOT BE. Declining to search because a target
      looks saturated is a failure symmetric with overclaiming. The package
      explicitly refuses to close - EV-PRE-3 names lane closure as one of two
      honest routes and recommends neither - and the red team confirmed the
      obstruction is MEASURED rather than narrated. This decision closes nothing,
      recommends closing nothing, and leaves both routes open.

