  context: >-
    /design-experiment, one contract, for the first undesigned idea in the
    2026-10-05 batch. IDEA-20261005-ddbf31 was read from branch
    ideas/domain-bridges-20261005. No hypothesis and no experiment on
    origin/main cites it. The branch design/mono-ddbf31-wreath was created
    from origin/main at 92a3d5047cbbc343439c84fdb23db6ad3d79ae8a and
    git merge origin/main reported already up to date. The checkout that
    was already on another design branch was not used.

    The contract measures the signed-sum fibre Psi over the symmetric base
    at p = 101. It is not a heuristic validation of an asymptotic theorem
    and not a concrete-cost table. The pre-registered prediction is group
    order 8 (the wreath W) versus a proper subgroup (order dividing 4), or
    a permutation outside W. The four ordinary curves are the idea's
    minimal panel. j = 0 at this prime is supersingular (101 ≡ 2 mod 3);
    that fact is disclosed and the curve stays on the artifact panel only.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is the full-wreath row and
    fails when the panel shows a proper subgroup or a partition-breaking
    permutation. No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any run.
    - The input-fibre control, the null quartic, and the inertia agreement check give the order reading a way to come back inconclusive instead of fabricating a group from a broken sampler.
    - A partition-breaking permutation falsifies containment in W without the inertia check, so a negative result is reachable.
    - No monodromy permutation was computed while writing this decision.

  evidence_refs: []
  limitations:
