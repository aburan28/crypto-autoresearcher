  id: DEC-20260828-f65ce9
  recorded_at: '2026-08-28'

  target_ids:
    - DEC-20260828-f65ce9
    - GOAL-ECDLP-001
    - BUDGET-AMEND-20260828-f65ce9

  decision: expand
  decision_label: ecdlp_standing_always_run_and_batch_cap_removed_by_user_authorization

  context: >-
    This session (2026-08-28, driving opencode coordinator session
    opencode-launch-harness-20260828, vllm/qwen3.8-27b), the user gave the
    direct instruction: "please make ecdlp always run and no batch limits".
    At the time of the instruction, origin/main carried GOAL-ECDLP-001 as
    `active` with campaign_budget.maximum_batches = 128 (the last finite
    value projected by BUDGET-AMEND-20260823-010, raised from 65), 58 of
    the 128 slots unused, current_batch_id BATCH-4e7dcf, and a next_action
    holding terminal B70 as the current scientific batch under a frozen
    pre-admission candidate gate. DEC-20260814-404d63 had previously
    projected a program-wide uncap (null) on 2026-08-14; the ECDLP head on
    main subsequently carries the finite 128 state projected by later
    amendments. This decision re-projects null on GOAL-ECDLP-001 and adds a
    standing always-run directive. No prior record is rewritten; the finite
    history (BUDGET-AMEND-20260727-002 through BUDGET-AMEND-20260823-010 and
    every status note) stands immutable.

  user_authorization: >-
    RECORDED BY THE COORDINATOR, NOT A SELF-GRANT. Verbatim user
    instruction, 2026-08-28: "please make ecdlp always run and no batch
    limits". Two operative parts: (1) NO BATCH LIMIT --
    campaign_budget.maximum_batches is set to null, the schema's own
    unbounded representation; (2) ALWAYS RUN -- GOAL-ECDLP-001 is a
    standing goal: perpetually active, selected first among servable goals
    on each harness wake, and never stopped on budget grounds. The
    Coordinator only records this authorization; it is the user's.

  decision_scope: >-
    STRICTLY, on ledger/goals/GOAL-ECDLP-001/goal.yaml:
    campaign_budget.maximum_batches (128 -> null); a new
    maximum_batches_status_at_20260828_amendment note; one new
    budget_amendments entry (BUDGET-AMEND-20260828-f65ce9); one new
    maximum_batches_history entry for the superseded value 128; a new
    standing_directive_always_run_20260828 field; and next_action
    superseded (prior text preserved VERBATIM under
    next_action_superseded_20260828_standing_directive, exactly one live
    next action retained). NOTHING ELSE MOVES: total_wall_clock_seconds
    (28800, already UNTRACKED and UNEVALUABLE per its own notes),
    max_concurrent (2), pause_conditions text, completion_criteria,
    objective_and_scope, active_hypothesis_ids, every hypothesis status,
    claim tiers, current_batch_id (BATCH-4e7dcf custody), the status value
    (stays `active`, so no status_value_history entry is added), every
    checkpoint, and every prior BUDGET-AMEND record. No other goal record
    is touched by this decision.

  standing_directive: >-
    (1) NO BATCH LIMIT: maximum_batches is null; the batch-budget clause of
    pause condition 1 ("campaign_budget.total_wall_clock_seconds or
    campaign_budget.maximum_batches budget is exhausted") can no longer
    fire on the batch budget, and no further budget amendment is ever
    required to admit a batch. (2) ALWAYS RUN: on each harness wake
    GOAL-ECDLP-001 is selected first among servable goals and is kept
    `active`; it is never paused, closed_at_budget, or retired on budget
    grounds. (3) SCIENTIFIC GATES ARE UNCHANGED: the pre-admission
    candidate gate in next_action (a typed public P1553 target-local
    remainder transducer for r_R mod g_I or the exact dyadic subinterval
    unit-product interface; an actual recurrence, circuit identity, or
    retrieved theorem instantiated to the frozen elliptic setting; frozen
    rings, bases, CRT components, interval geometry and construction; the
    full state/update/degree/rank/nonzero/coefficient-growth/storage/
    traffic/amortization accounting within the inherited B^(5/4) interface
    budget and strict end-to-end o(ell^(1/2)) time, memory, and data;
    lineage and multiplicity; Q versus -Q; invertible Q coefficient;
    output-sensitive source unranking; and the already-costed-route
    exclusion) remains in force in full. "Always run" removes budget as a
    stop condition; it does not remove the admission gate. A batch is
    admitted only when the gate is met; a candidate's absence of a gate
    item is recorded as not-intake-ready and never treated as
    mathematical evidence. (4) POLICY-RESOLUTION BLOCKS DO NOT PAUSE THE
    GOAL: where a required exact model policy cannot be resolved and the
    handoff forbids fallback (pause condition 2), only the specific
    claim-level work requiring that policy is blocked (on this runtime,
    review-breakthrough-tier work, since no max-floor backend resolves);
    the campaign continues on resolvable work, per the GOAL-DREG-001
    handling on this runtime (DEC-20260822-badc59 dissolved the DREG
    review-tier block the same way). (5) DURATION: the directive stands
    until the user withdraws it, a completion criterion is met, or the
    goal is closed by a fresh Coordinator decision on its own evidence.

  what_this_decision_does_not_do:
    - It does not admit B71, open any batch, authorize any run, or dispatch any task.
    - It does not move any hypothesis status, claim tier, completion criterion, or result, and it reframes no quarantined or confounded finding.
    - It does not extend, waive, or reclassify total_wall_clock_seconds; that field remains UNTRACKED and UNEVALUABLE per its recorded notes, and nothing here may be read as evidence that the wall-clock budget is satisfied.
    - It does not retract or edit the 128-ceiling history: BUDGET-AMEND-20260823-010 and every prior amendment and status note stand immutable; the value 128 is SUPERSEDED (with 58 of 128 slots unused at supersession) and its history entry is added on the list's stated convention.
    - It does not touch the unmerged branch ecdlp-advice-bank-correction-20260827 (PR #580) or its pause decision DEC-20260828-64f908, which is not in origin/main's history. If that branch is ever merged, this standing directive governs the goal's operative state, and any merge conflict on the head is resolved by supersession per AGENTS.md, never by picking a side.

  non_claims:
    - A longer or un-batched campaign is not a stronger result.
    - No asymptotic-complexity claim is advanced and no promotion gate is engaged.
    - Removing a batch cap supplies no reason to admit a candidate that fails the frozen pre-admission gate.
    - The always-run part of the instruction is an authorization and selection directive, not a claim that the remaining work is more tractable, more likely to succeed, or closer to a completion criterion.

  evidence_refs: []

  limitations:
    - This decision authorizes no research, experiment, run, or batch opening. It changes the named fields on exactly one goal record and nothing else.
    - The standing directive binds Coordinator selection and pause behaviour only; it confers no authority on any subagent and cannot be cited to waive a review requirement, an admission gate, or a falsification criterion.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An administrative budget-ceiling uncap and standing selection directive
      for one goal; no empirical or theoretical evidence is produced or
      reviewed by this decision.

  next_actions:
