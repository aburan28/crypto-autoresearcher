    - id: A-2
      what: >-
        DEFERRED REPAIR B — minted knowledge/techniques/KN-TECH-bb7e9f.md, the
        deferred technique entry naming ANOM-1's obstruction as a reusable
        splice-and-cut / MITM design pitfall
        (DEC-20260821-1215e5 knowledge_promotion, first `not_warranted` entry,
