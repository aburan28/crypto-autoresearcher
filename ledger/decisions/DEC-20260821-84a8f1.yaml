      TASK-20260821-e2ffe4 (isolated content_first snapshot) ALONE ->
      TASK-20260821-2de43d (red team) || TASK-20260821-26ba34 (validator),
      CONCURRENT and SIBLING-BLIND under
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml
      -> TASK-20260821-6ce8a8 (isolated commit-mode ledger archive; closing
      evidence EV-MDFIVE-24e077, its own minted closing DEC, goal checkpoint)
      ALONE.
    reserved_ids_named_for_downstream_tasks:
      IDEA-20260821-ea35d1: TASK-20260821-6b78d4
      H-MDFIVE-0ca596: TASK-20260821-fad775
      EXP-MDFIVE-a8e71e: TASK-20260821-fad775
      EV-MDFIVE-24e077: TASK-20260821-6ce8a8
    ids_downstream_tasks_must_mint_themselves:
      - >-
        TASK-20260821-fad775's gate decision DEC-* — mint with
        `python3 tools/allocate_id.py --next decision --date 20260821 --check`.
      - >-
        TASK-20260821-6ce8a8's closing decision DEC-* — mint the same way.
      - >-
        Any KN-FIND-* promoted at close — mint with
        `--next knowledge` per the /curate-knowledge conventions.
    no_other_ids_authorized: >-
      No other new record id is authorized by this decision. A task that finds
      it needs one mints it with tools/allocate_id.py and `--check`s it before
      use; it never greps committed state for a maximum.
    two_gates_not_one: >-
      This batch carries TWO independent stop points by design, and that is the
      structural lesson of batch 4. The FIRST is the Coordinator gate
      (TASK-20260821-fad775), which may refuse the construction on paper before
      any implementation compute. The SECOND is the executor's own
      two-way-dependence gate (HR-2), which may refuse the declared-scale run
      after implementation but before any measurement that could be
      misinterpreted. Batch 4 had only the first, and the first cannot catch a
      false algebraic assumption that nobody computed.

  rationale:
    - >-
      The corrected-construction question is decision-changing and cheap. Batch
      4 did not fail to measure; it measured the wrong quantity, and it proved
      exactly why. The repair is a 256-pair computation. Declining to run it
      would be premature closure on a lane whose obstruction is already
      diagnosed (docs/inventor-protocol.md; CLAUDE.md rule 9).
    - >-
      The pairing rule is satisfied inside this batch rather than deferred:
      HEUR-H1's genuine validation run is dispatched in the SAME batch as the
      construction it is conditional on (agents/coordinator.md, "Dispatch
      bias"), and the proof-of-concept implementation IS the executor task.
    - >-
      The proof-oriented dispatch gate (KN-TECH-080; agents/coordinator.md item
      13) is honored by requiring the idea-generator to RE-RUN all four audits
      against the NEW construction rather than carry IDEA-20260821-e46061's
      audit text forward. Audit 1's bottleneck claim and proof_obligation #2 are
      exactly what rested on the false assumption ANOM-1 falsified (red-team
      D1); copying them forward is the single most likely way to repeat the
      batch.
    - >-
      The two independent reviews are routed to `review-adversarial` at xhigh,
      NOT `review-breakthrough`. This is an ordinary claim-changing round at
      bounded toy scale: it proposes no breakthrough, no goal closure, and no
      contradiction between validated evidence records. The routing judgement
      and its one escalation trigger are stated in the review plan and are
      binding there.
    - >-
      The goal's method-ceiling completion criterion stays OPEN and is not
      quietly reframed. Batch 5 is one concrete step toward it (a genuinely
      two-free-word instrument, measured), not a delivery of it.
    - >-
      Exponent-targeting bias (docs/target-result-profile.md) is honored in the
      only way a calibration lane can honor it: this batch does not polish a
      cofactor, it decides whether the instrument this goal exists to calibrate
      can measure the quantity five other goals intend to cite. That is a
      precondition for any exponent claim downstream, and it is explicitly not
      itself one.

  evidence_refs:
    - DEC-20260821-1215e5 (F-2 ANOM-1/weaken ruling; F-3 H1 open; F-4 caveat carry-forward; F-5 claim ceiling; F-6 method-ceiling still open; F-8 cost question unanswered; F-9 budget account)
    - EV-MDFIVE-ab007d (obstruction block, resource_check, promotion_gate_assessment, boundaries)
