  context: >-
    BATCH-af29f6 (batch 4 of 7) closed at DEC-20260821-1215e5 with a `weaken`
    ruling on H-MDFIVE-bf7767. The frozen splice-and-cut MITM instrument at
    split point S=9 was built, run to a literal independently-reverified
    certificate against MD4, paired with an H1 sampling run and an authorized
    identically-bounded MD5 arm — but two independent sibling-blind reviews
    surfaced ANOM-1: the declared matching quantity (register A immediately
    after step 9, read from backward_step's tuple position 1) is PROVEN
    mathematically independent of free word9 at that split point, because
    word9 is first consumed at step 10. The instrument therefore measured a
    one-effective-free-word locator while reporting a two-free-word joint
    MITM. HEUR-H1's test this batch is INVALIDATED, not falsified, and H1
    remains OPEN (F-3). The goal's own method-ceiling completion criterion
    remains OPEN pending a genuinely two-free-word instrument (F-6), and the
    instrument-class ~2^64-block cost question is unanswered at either the
    modeled or the measured level (F-8).
    THIS DECISION OPENS BATCH-7215fa (batch 5 of 7) on the single next action
    GOAL-MD5-001.next_action names: a CORRECTED split-point / matching-quantity
    design, MD4 FIRST (the control), gated by a mandatory small-scale
    two-way-dependence spot-check that must run and PASS before any
    declared-scale run. It also records the two deferred pre-batch-5 ledger
    repairs (H-MDFIVE-bf7767 status; the deferred KN-TECH entry) and resolves
    the PENDING_POST_COMMIT sentinel in the goal head.

