        wall-clock through batch 5 exceeds 10800 s, OR (b) batch 5's actual
        spend exceeds 25% of its own 4510 s declared ceiling, the Coordinator
        must request explicit user authorization for a total_wall_clock_seconds
        amendment before opening batch 6, rather than declare a sixth budget.
        Neither condition is met today.
    no_amendment_taken: >-
      No campaign_budget field, completion_criteria, pause_condition,
      claim_tier_ceiling, or hypothesis status other than those named in
      actions_taken_under_this_decision is touched by this decision.

  claim_ceiling:
    tier: analyzed
    statement: >-
      `analyzed` AT BEST, NEVER `supported`, for every record this batch
      produces — restated as a hard constraint on the closing task, not as an
      expectation. Basis: DEC-20260821-1215e5 F-5 and EV-MDFIVE-ab007d's
      promotion_gate_assessment. Three of CLAUDE.md's four supported-promotion
      gates are structurally unmet by any single bounded-scale batch of this
      kind, and batch 5 does not change that:
      GATE 1 (proof decomposition into single-responsibility lemmas with
      per-attempt-cost x inverse-success-probability bookkeeping): NOT MET and
      not attempted — this is a bounded computational demonstration, not a
      proof-architecture submission.
      GATE 2 (numbered heuristics validated): HEUR-H1 is OPEN and this batch is
      its FIRST genuine test; a pass would move it from untested to
      once-tested-at-toy-scale, which is not "validated". HEUR-H3 remains
      untested by design.
      GATE 3 (concrete-cost table at standardized parameter sets addressing the
      instrument-class ~2^64-block gap): NOT MET; explicitly out of scope this
      batch per F-8, and PROHIBITED from being computed from batch 4's
      degenerate throughput.
      GATE 4 (independent review-adversarial + red-team pass): planned and
      budgeted; satisfying gate 4 alone clears nothing.
    ceiling_is_not_a_prediction_of_success: >-
      A successful corrected instrument would be a real result and is still
      capped at `analyzed`. A FAILED two-way-dependence gate is ALSO a real
      result — it is a second, sharper measurement of the same obstruction,
      recorded as such under docs/inventor-protocol.md's closure standard, and
      it is not a batch failure.

  hard_rules_for_this_batch:
    - id: HR-1
      text: >-
        MD4 FIRST. MD4 is the control where the method is reported (unverified
        provenance) to break through. No MD5 computation occurs unless the
        frozen EXP-MDFIVE-a8e71e contract from TASK-20260821-fad775 explicitly
        NAMES and IDENTICALLY BOUNDS an MD5 arm — never larger than the MD4 arm,
        never "for completeness".
    - id: HR-2
      text: >-
        THE TWO-WAY-DEPENDENCE GATE IS A HARD STOP, NOT A CHECK. The new
        hypothesis's proof_obligations MUST carry a mandatory small-scale
        (k1=k2=4) two-directional dependence spot-check on the SAME declared
        matching observable, through the SAME code path the declared-scale run
        uses, run and PASSED BEFORE any declared-scale run. Both directions
        separately (vary A holding B; vary B holding A); a simultaneous
        both-words sweep does not discharge it. IF IT FAILS, THE EXECUTOR STOPS,
        REPORTS, AND NO DECLARED-SCALE RUN HAPPENS. Red-team recommendation D1,
        BATCH-af29f6; KN-TECH-bb7e9f.
    - id: HR-3
      text: >-
        DO NOT PROJECT INSTRUMENT-CLASS COST TOWARD THE ~2^64-BLOCK GAP from
        batch 4's degenerate throughput figures (DEC-20260821-1215e5 F-8). That
        projection becomes admissible only once a non-degenerate instrument's
        measured throughput and k1/k2 scaling behavior exist, and is not
        authorized by this decision even then — it needs its own dispatch.
    - id: HR-4
      text: >-
        ANOM-1 CAVEAT CARRIES FORWARD (DEC-20260821-1215e5 F-4;
        EV-MDFIVE-ab007d O-7). Any record, report, table, or knowledge action in
        this batch citing RUN-MDFIVE-primary-md4-v2, RUN-MDFIVE-h1-md4, or
        RUN-MDFIVE-md5-conditional raw metrics must carry the ANOM-1 caveat
        (KN-TECH-bb7e9f) with it, or it is itself an overclaim regardless of
        what any decision says.
    - id: HR-5
      text: >-
        IF harness/run_md4_ceiling.py IS TOUCHED, ADD A `caveat_refs` MANIFEST
        FIELD at that time (DEC-20260821-1215e5 F-4, red-team required_controls
        D2). This applies equally to any new sibling module the frozen contract
        names: its manifest output carries `caveat_refs` from the start. Already
        committed run artifacts are NOT retrofitted — they are immutable.
    - id: HR-6
      text: >-
        NO BATCH TASK READS THE QUARANTINED PAYLOAD
        (coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml).
        Hash-only gate access is the standing mechanic carried from BCP-1/BCP-2
        through BATCH-1f30fe and BATCH-af29f6. Any CONSUMPTION finding is
        recorded invalid.
    - id: HR-7
      text: >-
        NO SUCCESS CRITERION MOVES AFTER OUTCOMES ARE OBSERVED without a
        versioned protocol_amendment record. HEUR-H1's falsification_condition
        in particular is inherited as frozen text; if the corrected instrument
        needs a different H1 statement, that is a NEW numbered heuristic in the
        NEW hypothesis, declared before the run, not a reinterpretation of the
        old one.
    - id: HR-8
      text: >-
        A TIMEOUT, CRASH, CEILING HALT, OR IMPLEMENTATION FAILURE IS
        INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md
        rule 5). A FAILED two-way-dependence gate is NOT in this category — it
        is a genuine, derivable finding about the construction and is recorded
        as evidence.

  dispatch_chain_authorized:
    max_concurrent: 2
    order: >-
      TASK-20260821-bc91f0 (this opening control plane, coordinator) ->
      TASK-20260821-6b78d4 (idea-generator: corrected construction +
      proof_search_map re-run) ALONE ->
      TASK-20260821-fad775 (coordinator gate; MAY STOP THE BATCH HERE) ALONE ->
