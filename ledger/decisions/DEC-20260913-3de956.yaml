coordinator_decision:
  id: DEC-20260913-3de956
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-9d649f-land-c94e52
  archived_by: TASK-20260913-8c9d86
  goal_id: GOAL-SEMBIN-cbf422
  batch_id: BATCH-SEMBIN-20260913-9d649f

  decision: land_idea_and_rank_without_designing
  decision_label: >-
    Land IDEA-20260913-c94e52 into the proposal ledger. It refutes a premise this
    goal's own record asserts, so it is accepted and ranked -- and it is NOT designed
    into an experiment today, because no route it opens can be ranked ahead of the three
    tasks already queued. Its originating handoff was never filed; that gap is recorded
    rather than back-dated.

  context: >-
    A duplicate ideation dispatch produced this proposal under a task id,
    TASK-20260913-6519c9, for which NO HANDOFF RECORD EXISTS in ledger/handoffs/. It is
    the third instance in this batch of one task being dispatched more than once without
    a lane claim (see CORR-20260913-bb05b0 correction_4 and DEC-20260913-74e208 PD-3).
    Here the dispatch defect cost no evidence: the proposal is well formed, its six
    citations all carry provenance and a named verifying agent, its Pareto block is
    filled with checked rows, and its computational claims were executed inside the
    ideation task by exhaustive enumeration.

  target_ids:
    - IDEA-20260913-c94e52
    - GOAL-SEMBIN-cbf422
    - RQ-SEMBIN-9fa4ba

  official_transitions:
    IDEA-20260913-c94e52:
      from: null
      to: proposed
      basis: >-
        Landed in ledger/proposals/ unedited. Validates clean. Its self-reported
        task_id is preserved exactly as the producer wrote it, including the reference to
        a handoff that was never filed -- an immutable record is not tidied to make its
        provenance look better than it was.

  rationale:
    - >-
      IT REFUTES A PREMISE THIS GOAL'S OWN RECORD ASSERTS, WHICH IS THE MOST USEFUL THING
      AN IDEA CAN DO. GOAL-SEMBIN-cbf422 sub-objective 3 states that a balanced merge tree
      is "another presentation of the same decomposition, with a different
      auxiliary-variable count and a different first-fall-degree analysis". The proposal
      shows both halves are false: over every full binary merge tree with t leaves the
      equation count is t-1, the auxiliary-variable count is t-2, the Boolean variable
      count is N = (t-2)n + tk, and the count of three-variable blocks is t-2 -- four
      invariants, not four degrees of freedom. Checked by exhaustive enumeration over all
      labelled trees at t = 3..8 (3, 15, 105, 945, 10395, 135135 trees). A goal whose
      sub-objective rests on a false premise is worth more corrected than pursued, and
      this is a case where the correction was cheap and the pursuit would not have been.
    - >-
      THE CONSEQUENCE IS A CLOSURE, AND ITS OWN PARETO BLOCK SAYS SO. Because the four
      counts are topology-blind, Semaev's n^{4 omega} charge cannot distinguish tree
      shapes by construction, so the topology axis carries no exponent movement -- the
      whole axis spans a factor 4.0 at the FIPS parameters and the path is 17% off a finer
      proxy. The record's dominated_by field states plainly that it IS dominated and that
      "there is nothing on the topology axis to be non-dominated about; the record's value
      is the closure, not a position." That is the Pareto honesty the inventor protocol
      asks for, volunteered rather than extracted, and it is why this lands as a closure
      rather than as a lead.
    - >-
      RANKED, AND NOT DESIGNED TODAY, WHICH IS THE HONEST APPLICATION OF THE ECC RULE.
      AGENTS.md "ECC comes first" instruction 3 makes an open ECC idea ranked work to be
      designed into an experiment. It also says, twice, that an unlimited budget removes
      the batch ceiling and NOT the duty to rank, and that no task may be dispatched that
      cannot be ranked ahead of doing nothing. The one measurement this proposal wants --
      converting its sigma_top proxy into a cost -- needs a Groebner engine, which
      IMP-SEMBIN-ENGINE records as unavailable. Its engine-free content is already
      EXECUTED inside the ideation task. So designing a contract now would produce either
      a blocked experiment or one whose results already exist, and neither ranks ahead of
      the three tasks in flight: EXP-SEMBIN-92724f and EXP-SEMBIN-354a75 running,
      EXP-SEMBIN-2c40bb approved. Designing is not approving, and ranking is not
      dispatching; this is ranked fifth on the mechanism lane and revisited when the
      engine impediment clears.
    - >-
      THE PROVENANCE GAP IS RECORDED, NOT REPAIRED. Filing a handoff now for
      TASK-20260913-6519c9 would assert that the Coordinator dispatched it with a declared
      objective, write scope, budget and completion gate at a time when it did not, which
      is a fabrication of exactly the kind AGENTS.md core rule 9 names -- the same reason
      the Coordinator declined to retro-fit a missing reviewer attestation in PD-4 and the
      same reason a validator session declined to take a lane claim after the fact. The
      proposal's own citations carry named verifying agents, so what is missing is the
      dispatch envelope and not the work's traceability.

  dispatch_ranking:
    - rank: 1
      task: 'in flight: TASK-20260913-80bae1 (EXP-SEMBIN-92724f) and TASK-20260913-4df669
        (EXP-SEMBIN-354a75)'
      why: >-
        Unchanged from DEC-20260913-74e208. Both can overturn conclusions rather than
        refine them.
    - rank: 2
      task: 'approved, awaiting dispatch: TASK-20260913-39f7a4 (EXP-SEMBIN-2c40bb)'
      why: >-
        Unchanged, and CORR-20260913-bb05b0 lowered rather than raised its urgency by
        settling its direction in advance.
    - rank: 3
      task: 'not designed: IDEA-20260913-c94e52 topology closure'
      why: >-
        Its measurable claim needs the engine that IMP-SEMBIN-ENGINE blocks; its
        engine-free claims are already computed. Revisit when the impediment clears, or
        promote the four invariants to the corpus if a later session needs them as a
        standing constraint on the mechanism lane. The invariants are a genuine standing
        constraint -- any future proposal that varies chaining topology to change a
        variable count is claiming against them and should be made to say so.

  evidence_refs: []
  evidence_note: >-
    None. A proposal is speculation and cites no evidence record; the enumeration it
    reports was run inside the ideation task and is not an archived run. Its
    novelty_status is `speculative` and its computational claims have had no independent
    review, so nothing here is evidence for or against anything.

  citations:
    - ref: ledger/proposals/IDEA-20260913-c94e52.yaml
      provenance: internal
      claim: >-
        The four topology invariants, their exhaustive verification at t = 3..8, the
        factor-4.0 span of the topology axis at FIPS parameters, the 17% gap between the
        path and the best shape under the sigma_top proxy, and the record's own statement
        that it is dominated.
      verified_by: >-
        coordinator, 2026-09-13; read the record's claim, minimal_test, dominated_by and
        citation blocks. The Coordinator did NOT re-run the tree enumeration; the counts
        t-1 internal and t-2 non-root internal nodes in a full binary tree with t leaves
        are elementary and were checked by inspection rather than by execution.
    - ref: ledger/goals/GOAL-SEMBIN-cbf422.yaml
      provenance: internal
      claim: >-
        Sub-objective 3's premise, which this proposal refutes: that a balanced tree has a
        different auxiliary-variable count and a different first-fall-degree analysis.
      verified_by: coordinator, 2026-09-13; read the goal record

  limitations:
    - >-
      LANDING A PROPOSAL ASSERTS NOTHING ABOUT ITS TRUTH. novelty_status is `speculative`,
      no hypothesis is specified, no experiment is approved, and no independent agent has
      checked the enumeration. Its own dominated_by block declares it dominated.
    - >-
      NO STATEMENT ABOUT ANY CURVE'S SECURITY, IN EITHER DIRECTION, and no degree is
      measured or asserted. The sigma_top quantity is an explicit PROXY, not a cost, and
      the proposal says so; converting it to a cost is the step that needs the unavailable
      engine.
    - >-
      The refutation of the goal's sub-objective 3 premise is recorded here and in the
      proposal. The goal record itself is NOT edited to remove the premise: sub-objectives
      are part of a committed campaign record, and a later reader should see both what the
      campaign assumed and where that assumption was corrected.
    - >-
      This decision does not resolve the dispatch defect that produced an unfiled handoff.
      That is a coordination finding, recorded three times in this batch now, and the fix
      is procedural: tools/goal_lanes.py claim before each subagent launch.

  next_actions:
    - >-
      Nothing is required of a downstream agent. The three ranked experiments continue
      unchanged.
    - >-
      IF A LATER PROPOSAL VARIES CHAINING TOPOLOGY to change an equation count, a variable
      count or a block count, it is claiming against these four invariants and must state
      which one it believes fails. Promote them to a KN-TECH entry at that point rather
      than now.
    - >-
      When IMP-SEMBIN-ENGINE clears, revisit whether sigma_top can be converted into a
      measured cost. Until then this proposal's measurable claim is not designable.

  knowledge_promotion:
    warranted: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED YET, AND THE REASON IS NOT THAT THE CONTENT IS WEAK. The four
      invariants are elementary, checked, and a genuine standing constraint on the
      mechanism lane -- exactly the shape of thing the corpus exists to hold. But they sit
      in a `speculative` proposal that no independent agent has reviewed, and the corpus
      ranks agent hypothesis lowest for a reason. Promoting an unreviewed proposal's
      combinatorics would put an internal claim into the corpus at the authority of a
      technique reference. The trigger for promotion is recorded in next_actions: the
      first later proposal that varies chaining topology to change one of these counts.

  standing_user_authorization:
    cited: '2026-09-06: "all is approved. ideas/experiments should be always approved"'
    applied_to: [IDEA-20260913-c94e52]
    note: >-
      Applied to INTAKE only: the proposal is accepted without asking the user to select
      it, which is what the standing authorization directs. It approves no experiment,
      because none is designed. The authorization removes the need for user confirmation;
      it does not remove the duty to rank, and the ranking above is why nothing is
      dispatched from this proposal today.
