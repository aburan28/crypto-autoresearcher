coordinator_decision:
  id: DEC-20261011-45a3ee
  recorded_at: '2026-10-11'
  decided_at: '2026-10-11'
  decided_by: coordinator
  question_ids: [RQ-GFPN-c01af8]
  goal_id: GOAL-GFPN-380702
  archived_by: TASK-20261011-f555a8
  mode: dispatch_queue_custody_repair
  decision: approve
  target_ids:
    - CORR-20261010-db44b4
    - DEC-20261010-fb6792
    - TASK-20260925-480d02
    - TASK-20260925-0ed1be
    - TASK-20261010-0fda2f
    - TASK-20261011-f555a8
  context: >-
    The published correction packet on PR #2076 authorizes a separate
    content-first custody task for 771 files already present in five
    producer commits. The open BATCH-e409ca lane points to the
    historical dispatch_queue.json, whose only Ready Task is the old
    Phase-B archive TASK-20260925-0ed1be. Its one-commit method is
    impossible on those immutable producer files. The successor card
    TASK-20261010-0fda2f is committed and pushed, but it is absent
    from the 90-row queue and cannot be claimed there.
  ruling:
    - >-
      Authorize a write-once 91-row queue at
      coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.custody-20261011.json.
      Preserve the existing dispatch_queue.json and all committed cards.
      The new queue is the operative dispatch entrypoint for the
      successor custody task after this four-file revision packet is
      committed, verified, and pushed.
    - >-
      Project TASK-20260925-480d02 as completed solely because its
      producer release records completion. Give its queue row the
      exact 771 existing source file paths as artifact_paths and
      assign it to TASK-20261010-0fda2f as its one archive owner.
      This projection does not validate G3, admit G4, or complete
      the old Phase-B archive.
    - >-
      Keep TASK-20260925-0ed1be noncompleted and blocked. In the
      successor queue only, retain its Phase-A ownership of
      TASK-20260925-a16f78 and remove R2-r5 producer ownership from
      archive.source_task_ids to avoid two archive owners. Its old
      card, Phase-A receipt, missing Phase-B receipt, and historical
      queue row stay unchanged.
    - >-
      Add TASK-20261010-0fda2f as a queued snapshot archive directly
      depending on the completed producer. Its own artifact_paths
      contains only content-first-receipt.json; read_scope covers the
      four returned run directories and execution report, and
      write_scope contains only its new receipt directory. It binds
      existing source bytes without claiming they were newly written
      by the receipt commit.
    - >-
      Add TASK-20261010-0fda2f to the direct dependencies of the
      three blocked independent review rows for R2-r5. Retain their
      old dependency and blocked state. No reviewer, R2b-r5 task,
      scientific trial, or claim-changing decision becomes Ready
      from this queue revision; a later Coordinator ruling must
      address G3 and G4 and revise those dependencies before review.
    - >-
      Add a write-once same-batch lane-path addendum at
      coordination/goals/GOAL-GFPN-380702/lanes/BATCH-e409ca.queue-revision-20261011.json.
      It binds the old lane and queue hashes and the frozen new queue
      hash. The original .lane.json pointer remains historical;
      `goal_lanes.py lanes` does not parse addenda. A dispatching
      session must explicitly use the new queue path for
      research_dispatch.py --ready-only and goal_lanes.py claim,
      and must verify this addendum first. Claims share the batch's
      existing claims/ directory. No second lane is opened.
    - >-
      After the packet archive verifies and is pushed, refresh the
      ready PR and stop. Successor custody is a separate Coordinator
      act under its committed handoff and claim preconditions. The
      old Phase B remains incomplete. A verified custody receipt
      then permits only a separate G3/G4 ruling, not promotion.
  rationale:
    - >-
      The queue must expose the already authorized successor while
      preserving the failed historical archival method and its
      producer provenance. One archive owner per nonarchive row is
      required by research_dispatch.py.
    - >-
      A same-batch side file avoids rewriting the archived queue or
      opening a competing lane. The addendum makes the path change
      explicit even though the lane display still shows the old path.
  evidence_refs:
    - CORR-20261010-db44b4
    - DEC-20261010-fb6792
    - ledger/handoffs/TASK-20261010-0fda2f.yaml
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/claims/TASK-20260925-480d02.2.release.json
    - coordination/goals/GOAL-GFPN-380702/lanes/BATCH-e409ca.lane.json
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.json
  limitations:
    - This is a dispatch representation and custody protocol change, not scientific evidence.
    - G3 remains an infrastructure failure and G4 remains a disclosed sequencing deviation.
    - The new receipt must pass every exact-content and applicable Phase-B check before any later ruling.
  next_actions:
    - Archive and publish exactly the new queue, lane-path addendum, this decision, and TASK-20261011-f555a8.
    - In a later coordination session, verify the addendum and claim TASK-20261010-0fda2f from the new queue path.
  knowledge_promotion:
    promoted: []
    not_warranted: Queue admission and custody repair contain no scientific interpretation.
