    why_phase_1_is_this_measurement: >-
      Carried from DEC-20260822-40bf14 next_actions item 2 without
      re-litigation: it costs seconds of compute; it converts batch 5's
      single-seed negative observation into a distribution under contract; it
      is the ONLY measurement that tells the next Coordinator whether the
      successor batch should change the SEED (cheap), the CRITERION (cheap,
      RC-3) or the CONSTRUCTION (expensive). RC-4 is paired because a static
      per-F-application (y XOR z) mask check predicts the collapse with NO
      SEARCH AT ALL, generalises to every MD4-family construction this goal
      will consider, and is the measurement that discriminates the two
      competing mechanisms held pending at DEC-20260822-40bf14 F-10.
    binding_terms: >-
      The eight items at DEC-20260822-40bf14 next_actions item 3 bind the
      batch-6 contract AS CONTRACT TERMS AND NOT AS ADVICE: (a) replace or
      supplement `distinct >= 2` with an injectivity criterion
      `distinct >= (1 - eps) * 2^k` at BOTH 32-bit and window resolution for a
      declared eps (RC-3); (b) require an explicit recorded adjudication
      whenever an observed integer departs from its own pre-registered
      predicted integer beyond a declared tolerance, even when the pass
      criterion is met (RC-2, zero compute); (c) label every threshold
      measured or modeled, including the CONTROLS and not only the claims;
      (d) number the uniformity premise as a heuristic and test it; (e) apply
      the held-fixed value inside gate_direction_A so CTL-PO3 can fail
      (F-8); (f) emit `code_path_fingerprint` into the manifest and arm an
      explicit deadline; (g) qualify the primitive on EVERY listed control,
      not only on CTL-PO6 (F-2); (h) run a null-object control on every
      distinct-count measurement (RC-5).
