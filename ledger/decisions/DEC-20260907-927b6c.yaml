    - >-
      The miss and the next-tightest hold share a tight
      rebuilt CS bound and land on opposite sides of it.
      Aligned ratio is G_exact / M_delta_exact. A
      consume-only pairwise swap of G and of M_delta
      between those two archived rows is cheaper than a
      new label rebuild and is ranked ahead of doing
      nothing. It records the two counterfactual
      aligned ratios and whether each would hold against
      the miss cs_bound. This decision does not
      pre-record those counterfactuals.
    - >-
      Re-partitioning the 168-row S2CS table, another
      four-cell uniqueness restatement, another slack
      restatement, Stage 5, a subset fit of a, the
      S2FIT W-ratio gate, CAND-D2-A, D2 closure, and
      designing an unrelated open ECC idea remain
      dominated or forbidden.

  ranking:
    selected: >-
      Consume-only tight-pair decomposition of
      RUN-ECDLP-5cad48-S2BD on the miss and
      next-tightest cells. Swap G_exact and swap
      M_delta_exact. Record whether each counterfactual
      aligned_ratio would hold against the miss
      cs_bound. No new label rebuild.
    dominated:
      - consume-only re-partition of the 168 S2CS rows
      - four-cell uniqueness restatement of S2BD
      - slack restatement of S2DX
      - off-slice restatement of S2OS
      - empty-bucket restatement of S2OC
      - new eight-prime exact-G or aligned-CS measurement
      - re-audit of Stage 0, Stage 1, or Stage 2 aligned CS
      - any proper-subset fit of a
