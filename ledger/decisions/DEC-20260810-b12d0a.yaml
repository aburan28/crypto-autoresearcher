coordinator_decision:
  id: DEC-20260810-b12d0a
  context: >-
    GOAL-DREG-001 BATCH-005 CLOSING DECISION, issued under a freshly minted id
    because the id this batch's own ledger receipt declared -- DEC-20260731-014
    -- is an identifier collision that was resolved, in a later merge, in favour
    of a different campaign. This record closes BATCH-005 on the admitted CTRL-B
    run RUN-DREG-001-CTRLB-N12-D6-BATCH005 (TASK-20260731-016) at the frozen
    cell n=12, t=3, ti=0, seed=2026, D=6, under producer snapshot 2f7771fa0124
    (TASK-20260731-025) and independent red team RT-20260731-013
    (TASK-20260731-026, verdict PASS). It asserts nothing that EV-DREG-008 does
    not already carry, and it does not move H-DREG-001.
  decision: expand
  supersedes:
    - >-
      The reference to `DEC-20260731-014` in
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      (field record_ids). That receipt is IMMUTABLE and is NOT edited by this
      record; this decision supersedes the reference by naming it, which is the
      correction mechanism AGENTS.md core rule 4 requires.
    - >-
      NOT superseded, and explicitly left untouched: the committed
      ledger/decisions/DEC-20260731-014.yaml, which is a GOAL-ECDLP-001 /
      BATCH-021 `approve` decision belonging to another campaign. Per AGENTS.md
      core rule 15 an identifier remap is a last resort, not a repair; that
      record keeps its id and its content, and GOAL-DREG-001 takes a fresh one.
  target_ids:
    - GOAL-DREG-001
    - H-DREG-001
    - RQ-DREG-001
    - TASK-20260731-016
    - TASK-20260731-026
    - TASK-20260731-027
    - BATCH-005
    - EV-DREG-008
  provenance_of_this_records_content:
    restated_not_reinvented: >-
      The substantive closure recorded here is NOT newly authored judgement. The
      original GOAL-DREG-001 BATCH-005 closing decision was written on
      2026-07-31 and committed; it survives in git history as the content of
      ledger/decisions/DEC-20260731-014.yaml at commit
      4692de41f95176d5ca619e79ea50cd7cf041f63a, which IS reachable from
      origin/main. Its sha256 is
      6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b, which is
      exactly the digest the BATCH-005 ledger receipt declared for that path --
      so the receipt was authored against the DREG decision, not against the
      ECDLP record that occupies the path today. This record restates that
      closure verbatim in substance (same `decision: expand`, same rationale,
      limitations and next_actions) under an uncollided id.
    what_this_session_verified_independently: >-
      Rather than trusting the recovered text, the closing Coordinator re-checked
      each underlying fact against committed artifacts: (a) the BATCH-005 queue
      carries four entries, all at state "completed"; (b) ledger/evidence/
      EV-DREG-008.yaml is committed and its sha256 MATCHES the digest the
      BATCH-005 receipt declares for it, so the evidence this closure rests on
      is byte-identical to the evidence the original archive bound; (c) the red
      team artifact at .../TASK-20260731-026/red_team_report.yaml records
      id RT-20260731-013, task_id TASK-20260731-026, verdict PASS. The PASS is
      read from the artifact itself, not from a summary of it.
    what_could_not_be_verified: >-
      See `limitations`. Two of the receipt's five declared digests match no
      committed content at their own paths, and the receipt was never
      post-commit verified. Those facts are recorded, not repaired, and the
      integrity finding is carried in CORR-20260810-929c01.
  rationale:
    - >-
      Independent red-team PASS (RT-20260731-013) accepts the support-aligned
      admission, the set-hash rebuild match, and the quarantine-coherent
      citation of deficit_genuine=17947 at the frozen cell.
    - >-
      GOAL-DREG-001 completion still requires the on-lattice n-ladder
      measurements named in its completion_criteria (n in {12,15,18}, >=3 seeds,
      with the semi-regular null control). This single cell pin alone neither
      supports nor rejects H-DREG-001 at ladder scope, and this decision claims
      neither.
    - >-
      Expand next to additional ladder cells / seeds under the same CTRL-B
      instrument, or pause if GOAL-PATH-001 capacity prioritizes elsewhere. The
      choice is PATH's, not this record's.
    - >-
      Independence is weakened by the authorized model fallback recorded in
      EV-DREG-008 (AMEND-PATH-001-001, cursor-grok-4.5-high-fast) and by the
      sibling-pickle residual. EV-DREG-008 states in its own words that
      equivalence to review-xhigh / executor-terra is NOT claimed, and this
      decision does not claim it either. No d_reg theorem is claimed.
    - >-
      BATCH-005 has been sitting on committed evidence and a committed PASS with
      no committed decision of its own since 2026-07-31. Closing it under a
      fresh id is the minimum act that makes the batch's own state readable;
      leaving it open would understate work that was actually done, which the
      research-direction integrity clause treats as a failure mode in its own
      right.
  evidence_refs:
    - EV-DREG-008
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-025/snapshot-receipt.json
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/falsification_review.md
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/results.json
    - CORR-20260810-929c01
  limitations:
    - >-
      Single-cell toy scope only: n=12, t=3, ti=0, seed=2026, D=6.
      claim_tier=toy, evidence strength=preliminary. Not an n-ladder law, not a
      d_reg theorem, not a crypto-scale ECDLP statement.
    - >-
      The raw 17947 headline REMAINS quarantined_confounded as a label. The
      numerical equality with deficit_genuine is the upper-interval case
      rank(null|sem_support)=sr_pred, and is not a re-citation of the confounded
      label. This decision does not lift the quarantine.
    - >-
      H-DREG-001 official status is UNCHANGED by this decision.
    - >-
      ARCHIVE-INTEGRITY LIMITATION, stated because it bounds what this closure
      can be said to rest on: the BATCH-005 ledger receipt
      (archives/TASK-20260731-027/ledger-receipt.json) has commit_sha null and
      verification status "pending_post_commit", and it was never post-commit
      verified. Of its five declared digests, one (EV-DREG-008) matches the live
      tree, one (DEC-20260731-014) matches only a historical blob at
      4692de41f951, and three -- the red_team_report.yaml, the
      falsification_review.md, and GOAL-DREG-001.yaml itself -- match no
      committed content at their own paths in any revision. The red team and
      falsification artifacts ARE present and committed and DO record verdict
      PASS; what cannot be established is that their committed bytes are the
      bytes the receipt hashed. This closure therefore rests on the artifacts as
      committed today, which were read directly, and NOT on a verified archive
      receipt.
    - >-
      Because that receipt is immutable and cannot be repaired, BATCH-005 will
      never have a post-commit-verified ledger archive. This decision and
      CORR-20260810-929c01 are the durable substitute, and they are weaker than
      a verified archive would have been. That is recorded rather than papered
      over.
  next_actions:
    - >-
      Under GOAL-PATH-001, either admit CTRL-B expansion to the next ladder
      cell/seed under a fresh write_scope, or keep DREG paused while other Tier
      work runs. Do not promote crypto-scale or d_reg-law claims from
      EV-DREG-008 alone.
    - >-
      Chain C2 remains UNARCHIVED and its absence is not evidence about d_reg:
      BATCH-003 carries archives/ for TASK-20260727-N21-SNAP-C1 and reviews/ for
      TASK-20260727-N21-VAL-C1 only, and PREREG-20260727-N21-C2.md stands
      unmatched by any receipt. Re-dispatch C2 or supersede it; treat it as
      unarchived work.
    - >-
      NOT DIRECTED BY THIS RECORD, and named so no later session reads silence
      as prohibition: no executor batch is opened here, and no new measurement is
      authorized.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-DREG-008 is strength `preliminary` and claim_tier `toy`, from a single
      admitted cell. That is below the bar for a durable KN-FIND entry, and the
      original 2026-07-31 closure reached the same conclusion for the same
      reason. Promotion stays deferred to a dedicated curation task after
      GOAL-PATH-001 prioritizes the ladder; a single-cell structural pin is not
      a finding the corpus should carry as established.
  decided_by: coordinator
  decided_at: '2026-08-10'
