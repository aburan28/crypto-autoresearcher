  ruling_by_item:
    CC-1_relation_unit:
      touched: false
      reasoning: >-
        CC-1 counts distinct monic (projective) relations, reconstructed from
        star rows that share their first element. The round confirms the
        premise CC-1 relies on: every SS x-group has exactly one centre, which
        carries the group's oldest attempt, and there is no duplicated star row
        and no element that is both centre and other (F5, 220,637 SS rows on 256
        instances; VR checks/out/f5-groups-summary.json). The round's corrected
        relation counts (r_rank, formal r_distinct) point to the same unit
        CC-1 already uses. Nothing in the round defines a different relation
        unit for a census. Corroborates; does not touch.
    CC-2_nonformal:
      touched: false
      reasoning: >-
        The round confirms that known_log's formal basis has rank B - 1 on 70 of
        70 rows (red team F3 premise table). It also observes, as a point of
        indexing, that a 0-based base index i carries log i + 1 (validator
        sealed section r_distinct_checks: known_log_index0_log_i_plus_1 true,
        known_log_index_log_i false). CC-2 writes the basis as {e_j - j e_1},
        i.e. 1-based with F_j = jP, which is exactly that, and G6 gates "formal
        basis rank == |F| - 1 and F_j == j P on every PC-1 instance". A
        0-based misreading would give rank |F| and fail G6, so the gate already
        catches it. No change is needed. The j0 automorphism finding concerns no
        arm of this contract (no j = 0 panel, DS-3).
    CC-3_scope:
      touched: false
      reasoning: >-
        CC-3 fixes SS exposure at X_fix = 20*isqrt(N) formally distinct
        encodings, and TT/TB at the whole table. The round's F4 confirms that
        the recorder records exactly the charged range and that G5
        (encodings_recorded == 2*(s3_solves - table_s3_solves) -
        degenerate_roots) holds on 3480 of 3480 harvest rows. That is the
        identity this contract gates as G5 and on which X_fix's
        encoding sequence rests. Corroborates; does not touch.
    EC-1_ss_counter_repair:
      touched: false
      reasoning: >-
        EC-1 changes only which runs the SS group rebuild reads, and states that
        nothing else changes. The round's F5 code trace and data are exactly
        the supporting fact. The defect loses only pair counts (pairs_raw,
        pairs_formal, pairs_nonformal and the at_A_fix snapshot). It cannot drop,
        duplicate or mis-centre a star row, and it does not change rows_fed.SS,
        solver_rank_increments.SS, k_determined_by or the stop. The recomputed
        IC-5 pair count is never below the recorded pairs_raw and exceeds it on
        74 of 256 instances. This matches G-FIX's expectation "new >= old" and its
        requirement that every solver column, TT/TB block, informative rank and
        staircase stay equal. T-OBJ5's precondition (the pre-fix code undercounts
        on a straddling fixture) is reproduced on real instances. Corroborates;
        does not touch.
    EC-2_to_EC-9:
      touched: false
      reasoning: >-
        EC-2 (relation counter), EC-3 (search-only mode), EC-4 (table-only
        mode), EC-5 (solve-certs flag), EC-6 (arms), EC-7 (CLI), EC-8 (tests)
        and EC-9 (scripts) add code paths or flags. The round examined none of
        them and found no defect in any engine file they extend. F4 traced the
        charged-range rule, the depth-3 table, the SS store, certificates and
        the recorder, and found no uncharged x-key entering a group or a match.
        F1 found the archived engine deterministic: every row, harvest row and
        staircase reproduces. The four modified engine files' build base
        (a32e70808 bytes) equals what the round reviewed at 66d6eab71 (BI-1 pins
        equal, VR checks/out/hash-bindings.json); the build-base equality at
        dispatch remains the card's own precondition.
    solve_certification_NA8:
      touched: false
      reasoning: >-
        The round re-verified k for 221 solved instances with code disjoint from
        the solver (k*P = Q, k = k_rule mod N, an independent baby-step
        giant-step) and found no failure. This contract's own certificate path
        (EC-5, verify_solves.py, G4-D) is separate and unchanged. One fact is
        recorded for the executor's expectations, not as a change. Census-mode
        known_log instances stop at the attempt cap without k (35 of 35), while
        on-mode known_log instances solve. This contract writes a certificate
        only for an instance that determines and verifies k, so a capped
        known_log census instance in R10 writes none and is not a G4-D failure,
        as written.
    harvest_on_readings:
      touched: false
      reasoning: >-
        The contract runs no harvest-on mode in its census panels, computes no
        floor ratio (TW-FLOOR-INDEPENDENCE), and carries the generic readings
        (1a), (1b), (2) and (5) "as recorded", explicitly WITHOUT the
        floor-relative framing of (2) (H-PFDR-2765d2 generic_predictions_carried).
        The round leaves the recorded S_3 statement of (2) unchanged: the
        validator reproduces the exponent 0.6076 bit for bit. F7 bears only on
        the floor-relative framing, which stays withheld (DEC-20261001-494663
        RD-7). The only harvest-on rows this contract produces are R10's
        fix-check re-runs of EXP-PFDR-1b78f7 jobs (modes census and on), read
        through G-FIX as equality with the archive. The round's F1 shows exactly
        that the archived on-mode rows are what the engine deterministically
        produces, and F5 shows that the EC-1 repair cannot alter on-mode
        rows_fed or the stop. G-FIX's premise is corroborated. The withheld
        floor-relative comparisons (H-PFDR-2765d2 time_exponent; specification
        pareto_honesty.dominated_by) are not inputs to any computation of this
        contract and stay withheld (DEC-20261001-3fbaff NA-4).
  ruling: >-
    DOES NOT TOUCH. No finding of the TW-FLOOR round touches CC-1..CC-3,
