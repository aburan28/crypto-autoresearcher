coordinator_decision:
  id: DEC-20260823-51726e
  context: >-
    Ledger archive and state-transition gate for BATCH-f2341e of GOAL-ECQ-002,
    the campaign that set out to take a record cell on the ICARM rank
    leaderboard (axis A2 / criterion C1) and to close the base-rank gap left
    open when GOAL-ECQ-001 hit the rational-elliptic-surface ceiling of 8
    (axis A1 / criterion C2). Two producers ran concurrently on disjoint write
    scopes: TASK-20260823-d1cb76 (idea-generator) to obtain an explicit Q(t)
    family of generic rank > 8 with exact coefficients, and
    TASK-20260823-01d3d9 (executor) to build the family-agnostic specialise ->
    Mestre-Nagao score -> exact descent -> height/conductor -> ICARM-record
    pipeline. Their output was frozen at snapshot commit ab0aa5404 by
    TASK-20260823-744c38 (127 declared paths, content-bound), then attacked by
    two independent sessions at review-adversarial / xhigh, blind to each
    other, on disjoint owned joints: the validator TASK-20260823-6040d1
    (joints 1 and 2) and the red team TASK-20260823-07a54b (joints 3 and 4).
    BOTH REVIEWS WENT AGAINST THE CAMPAIGN. The validator returned verdict
    FAILED; the red team broke all three joints it owned, including the joint
    that was the Coordinator's own framing. This decision composes the round,
    judges C1 and C2 separately and explicitly, addresses every one of the red
    team's fourteen objections, records the corrections owed against a producer
    and against the orchestration layer, and sets exactly one next action.
  decision: weaken
  decision_scope: >-
    `weaken`, NOT `reject_scoped`, and the distinction is enforced rather than
    stylistic. The adverse finding rests on ONE implementation, run ONCE, in
    ONE session, over a program classification nobody has re-derived
    (EV-ECQ-d9ffe6 UC-1), so its evidence strength is `preliminary`.
    AGENTS.md and docs/claims-and-verification.md forbid `reject_scoped` on an
    unreplicated empirical-only adverse result and require `weaken` plus
    replication. The replication is a named component of N1. What is weakened
    is H-ECQ-d60d07's TARGETING clause and the goal record's AXIS A2 narrative
    -- both of which are the Coordinator's framing, not a producer's finding.
  target_ids:
  - H-ECQ-d60d07
  - GOAL-ECQ-002
  - RQ-ECQ-80f23c

  headline:
    statement: >-
      NO RECORD CELL WAS TAKEN. C1 IS NOT MET. The best certified rank produced
      by this program in this batch was 7, at naive height 91.2628997682137,
      against a frozen r>=7 cell of 35.77903133765187. The validator's
      independently certified Mestre rank-11 curve sits at naive height 107.614
      against a frozen r>=11 cell of 61.50685055014001. Neither is close. A
      NEAR-MISS IS NOT A RECORD, and neither of these is even a near-miss.
      Nothing was submitted to the ICARM endpoint and the live board was not
      re-read.
    no_record_may_soften_this: true

  rationale:

  - id: R1
    label: >-
      J1-F1 IS THE MOST IMPORTANT THING IN THIS BATCH. The highest
      exactly-known Q(t) rank available to this campaign was discarded on a
      FALSE NEGATIVE, and the orchestration layer amplified the error instead
      of testing it.
    text: >-
      TASK-20260823-d1cb76 had no code-execution tool and ran exactly one
      computational check in its whole session. It reported that the check
      FAILED, and filed the failure under `verified_here`. The arithmetic is
      exactly right and the validator confirmed both hand-computed
      coefficients symbolically: at t^6, left 451584 against right
      703343886336 = 14017536 - 6307891200 + 709637760000; at t^5, left
      3403008 against right 5300198572032. THE CONCLUSION IS FALSE. Computing
      all seven coefficients, right/left = 1557504 at EVERY ONE of t^0..t^6,
      and 1557504 = 1248^2. A constant PERFECT-SQUARE ratio is absorbed exactly
      by the rescaling y -> 1248*y, so the point ((t+703)/15, 1248*N(t)/75)
      LIES EXACTLY ON THE TRANSCRIBED QUARTIC. The producer's written
      justification -- "by factors that are not squares and so are not absorbed
      by any rescaling" -- is false, and it was DECIDABLE FROM THE TWO NUMBERS
      IT HAD ALREADY PRINTED, with one division, with no tool. The validator
      verified the identity exactly, not numerically, and the orchestrating
      session independently reproduced it.
      CONSEQUENCE. NAGAO-1994 -- rank EXACTLY 12 over Q(t) by Scholten
      Corollary 1, peer-proved, the highest exactly-known Q(t) rank on the
      candidate list -- was marked "NOT USABLE AS TRANSCRIBED" /
      "UNRELIABLE -- DO NOT USE" and set aside, and the recommendation moved to
      MESTRE-1991-QT11 (>= 11, sourced from Mestre's paper TITLES; the CRAS
      notes were never opened) partly because of it. The producer's own honest
      accounting records "sota_delta vs Nagao 12 -> -1" without recording that
      the -1 WAS SELF-INFLICTED. NAGAO-1994 IS REINSTATED AS A CANDIDATE by
      this decision, pending source retrieval.
      THE CORRECTION IS RECORDED AGAINST TWO LAYERS. Against the producer: a
      false conclusion under `verified_here`. Against the ORCHESTRATION LAYER:
      it relayed the false negative onward to the user as an example of a
      producer honestly reporting its own method failure. Self-reported failure
      IS the behaviour this program wants and the producer deserves the credit
      -- but a self-reported failure is a CLAIM UNDER TEST like any other, and
      the layer that repeated it did not test it. That error is the
      Coordinator's, it is the second time in two campaigns that an
      orchestration-layer habit has had to be corrected by a reviewer, and it
      is recorded here rather than absorbed.
      THE LIMIT THE VALIDATOR ITSELF STATES, AND THIS DECISION DOES NOT EXCEED
      IT: J1-F1 shows the EVIDENCE OFFERED for "transcription corrupted" fails.
      It does NOT establish that the transcribed coefficients are Nagao's
      equation. Equation and point are internally consistent up to y -> 1248*y,
      which is the ordinary difference between y^2 = Q(x) and y^2 = lambda^2
      Q(x) models. SOURCE RETRIEVAL IS STILL REQUIRED before the family is
      used, and the producer's artifact is immutable and is not edited: the
      correction lives in EV-ECQ-d9ffe6 OBS-1 and here.

  - id: R2
    label: C1 IS NOT MET. Judged alone, on its own terms, and not by implication
      from anything.
    text: >-
      C1 asks for a curve PRODUCED BY THIS PROGRAM, accepted by the ICARM
      verifier, taking at least one record cell against the pre-registered
      frontier, with the live board re-read at submission time. Every clause
      fails. No curve of rank above 7 was produced at all. The best certified
      rank was 7 at h = 91.2628997682137 against a r>=7 cell of 35.779 --
      a deficit of 55.48 -- and across ranks 2-7 the demo curves sit 7 to 56
      height units above their cells. The best rank obtained anywhere in the
      batch from the recommended base was the validator's certified 11 at
      h = 107.614 against a r>=11 cell of 61.507 -- a deficit of 46.11.
      Nothing was submitted; no ICARM endpoint was contacted by any task; the
      live board was not re-read, so this decision makes no statement about
      third-party movement since the 2026-08-23T00:43Z freeze.
      THE ONE CELL BEATEN ANYWHERE IS A HOLLOW ONE AND IS REFUSED. The t = 0
      specialisation of DEMO-SEC5-r5 minimalises to 53a1, certified rank 1,
      naive height 11.3875 against the frozen r>=1 cell of 11.6136. The
      executor described it correctly and without inflation: "a textbook curve
      that the board simply does not contain, not a discovery". THIS DECISION
      WILL NOT CLOSE C1 ON IT, NOR ON 43a1 (11.269579), NOR ON 83a1
      (11.550443), and records the prohibition so no successor can reach for
      it. See R3.

  - id: R3
    label: >-
      C1 AS WRITTEN PERMITS A HOLLOW CLOSURE. It is tightened to C1' NOW,
      BEFORE any candidate curve exists -- which is the only moment at which
      tightening a criterion is not moving a goalpost.
    text: >-
      The red team did not argue this; it ran the exhaustive control. Over all
      minimal Weierstrass models with a1 in {0,1}, a2 in {-1,0,1}, a3 in {0,1},
      a4, a6 in [-12,12] -- a range that provably contains every model under
      the target height, since |c4| <= 44 forces |b4| <= 2 and |c6| <= 296
      forces |b6| <= 3 -- keeping those below the frozen r>=1 cell
      11.613603032723672 and certifying an infinite-order rational point in
      exact Fraction arithmetic with non-torsion proved against Mazur's
      theorem, THREE CURVES IN CREMONA'S TABLES BEAT THE FROZEN CELL: 43a1
      [0,1,1,0,0] at h = 11.269579 with generator (-1,0); 53a1 [1,-1,1,0,0] at
      11.387464 with generator (0,0); 83a1 [1,1,1,1,0] at 11.550443 with
      generator (0,0). Each discriminant is a squarefree prime so each model is
      minimal and the heights are the board's own quantity; the convention was
      re-derived independently and reproduces board ids 42, 244 and 276 to
      0.0e0. A criterion satisfiable by a 1980s table entry measures the
      leaderboard's coverage of small conductors, not this program's
      contribution.
      C1' IS ADOPTED, in the red team's own words because they are the right
      ones: a curve FIRST EXHIBITED BY THIS PROGRAM -- absent from the frozen
      snapshot, not obtainable by lookup from Cremona / LMFDB / Dujella, with
      provenance traced to a specific family, parameter and run id -- accepted
      by the ICARM verifier, taking the PRE-DECLARED target cell (rank
      threshold and metric both named in advance) against BOTH the frozen
      frontier AND the live board re-read at submission time. Any other cell
      taken is a secondary outcome, recorded as such, and NEVER C1 satisfaction.
      TWO CONSEQUENCES ARE PART OF THE ADOPTION. First, C1' requires the rank
      threshold and metric to be pre-declared, which C1 never did (OBJ-7): the
      goal's AXIS A2 names r>=15 but C1 names no threshold, and the frozen
      frontier is 30 thresholds x 3 metrics = 90 cells of which a single
      rank-15 curve enters 45 (OBJ-8). Second, C1' makes the live-board re-read
      a condition of SATISFACTION and not only of reporting, which closes the
      gap in which a curve could satisfy C1 against a stale frontier while
      being beaten on the live board.
      PROCEDURAL FORM. C1 is in the committed goal record and is immutable;
      C1' does not overwrite it. C1' is adopted by this decision and enters the
      goal record by a SUPERSEDING criterion in the next ledger archive, whose
      declared path set must include ledger/goals/GOAL-ECQ-002/goal.yaml. Until
      that lands, C1' binds through this decision and the BATCH-f2341e
      checkpoint, and C1's `met` flag stays false either way.

  - id: R4
    label: >-
      C2 IS MET. Judged alone, on the standard C2 actually sets, and NOT by
      implication from C1's failure or from anything else.
    text: >-
      C2 reads: "a family of generic Mordell-Weil rank > 8 over Q(t) is
      obtained, its rank independently re-certified in this repo (not merely
      cited), and its exact Shioda-Tate ceiling stated". Three conjuncts,
      taken one at a time.
      OBTAINED -- YES. Mestre's family was REGENERATED IN THIS REPOSITORY from
      the published construction rather than transcribed from anyone's printed
      equation, for both published 6-tuples (-17,-16,10,11,14,17) and
      (399,380,352,47,4,0): p(x,T) = q(x-T)q(x+T), g the polynomial part of
      sqrt(p), r = g^2 - p, with p = g^2 - r holding IDENTICALLY, deg_x r = 4
      for both, and all TWELVE sections (+-T + a_i, g(+-T+a_i,T)) lying on
      y^2 = r(x,T) IDENTICALLY IN T, 12/12. The producer's own stated
      withdrawal falsifier -- "if deg_x r is 5 for both published 6-tuples,
      MESTRE-1991-QT11 must be withdrawn" -- was run and PASSED.
      INDEPENDENTLY RE-CERTIFIED HERE, NOT MERELY CITED -- YES. Specialisation
      E(Q(T)) -> E_{T0}(Q) is a group homomorphism, so independence of the
      images implies independence of the sections and yields an UNCONDITIONAL
      lower bound on the rank over Q(T) with no Silverman exceptional-set
      caveat. The 12 sections were mapped to 11 Jacobian classes, every image
      verified on the Weierstrass model in exact arithmetic, and independence
      certified by an exact stdlib certifier: rank >= 11 at T0 = 11 for the
      first tuple and rank >= 11 at T0 = 1 for the second, 11 exhibited
      independent points each, l = 2, torsion bound 1. Before this batch the
      sole source for "rank >= 11 over Q(T)" was Mestre's paper TITLES, which
      the producer disclosed it never opened. 11 > 8. THE BASE-RANK CEILING
      THAT CLOSED GOAL-ECQ-001 IS BROKEN, IN-REPO.
      EXACT SHIODA-TATE CEILING STATED -- YES, AND IT CORRECTS THE PRODUCER.
      deg_T A = 12 and deg_T B = 18, non-minimal at T = 0 (v = 4, v = 6);
      after reduction deg A' = 8, deg B' = 12, gcd(A',B') = 1 with no further
      non-minimal place, deg Delta' = 20, so
      d = max(ceil(8/4), ceil(12/6)) = 2 EXACTLY -- an elliptic K3 -- with
      ceiling 10d - 2 = 18 over C-bar and 17 over Q(T). Cross-checked:
      deg Delta' = 20 on the affine line plus Euler contribution 4 at
      T = infinity gives 24 = 12d at d = 2.
      FOUR QUALIFICATIONS BIND THIS VERDICT AND NONE IS OPTIONAL. (i) It was
      delivered by the REVIEWER, not by the producer commissioned for it: that
      session had no code-execution tool and obtained no family, and said so in
      its first paragraph. (ii) rank >= 11 is a LOWER BOUND on the span of the
      12 exhibited sections and is also THE CEILING OF THAT METHOD -- 12 affine
      sections, one spent as the origin, and r_4(T) is not a square in Q[T] for
      either tuple so there is no rational point at infinity to add a twelfth
      class. The EXACT generic rank is not determined. (iii) It is
      UNREPLICATED, and the 11 exhibited points are NOT ARCHIVED, so it is
      DERIVATION-TIER, not certificate-tier, and no downstream record may cite
      it as certificate-tier or as replicated (EV-ECQ-d9ffe6 B-3). (iv) C2
      being met CLOSES NOTHING ABOUT C1 and does not close the goal.

  - id: R5
    label: >-
      THE PRODUCER'S method_ceiling GUARD WAS FAILING OPEN BY 20, and that is
      a defect in the exact place the protocol puts a guard.
    text: >-
      TASK-20260823-d1cb76 filed predicted T-degrees (6,7,8,9,10) for
      (r_4,...,r_0) under `verified_here` as a hand weighted-degree argument.
      The true degrees are (4,4,6,6,8). As an upper bound the claim is safe,
      but the ceiling derived from it -- deg A <= 16, deg B <= 24, d <= 4,
      ceiling up to 38 -- is TWENTY ABOVE the true 18. H-ECQ-d60d07's
      proof_search_map says method_ceiling exists so "an over-claim is visible
      immediately"; a ceiling loose by 20 would have admitted a claimed rank of
      30 without complaint. The producer did mark it "must be confirmed by the
      executor", which is why this is a defect and not a fabrication -- and it
      was confirmed, by the validator, not by the executor. The corrected value
      d = 2 EXACTLY, ceiling 18 over C-bar / 17 over Q(T), now holds for BOTH
      MESTRE-1991-QT11 and, from the same coefficients J1-F1 rehabilitated, for
      the transcribed NAGAO-1994.

  - id: R6
    label: >-
      THE SOFT-CELL FRAMING WAS THE COORDINATOR'S AND IT DOES NOT SURVIVE. The
      campaign targeted the one cell where its own method has already done its
      best work.
    text: >-
      Three findings, in the order they bear on the claim, and the middle one
      is in the framing's favour.
      (a) THE COORDINATOR'S OWN STATED ALTERNATIVE IS ARITHMETICALLY
      UNAVAILABLE AND IS RETIRED, not carried forward as unresolved
      uncertainty. The task card offered "an artifact of how few rank-15 curves
      anyone has submitted". The r>=15 cell is a minimum over 115 curves and
      r>=14 over 125, and there are MORE curves of rank exactly 15 (15) than of
      rank exactly 14 (10). The counting story predicts the opposite of what is
      observed.
      (b) THE JUMP IS REAL UNDER EXCHANGEABILITY. Medians 141.8 / 144.3 / 145.3
      across ranks 13/14/15, so no trend model is needed; over 200000
      relabelings, P(step >= 33.58) = 0.01465, P(min of rank-15 >= 118.77) =
      0.01622, P(min of rank-14 <= 85.19) = 0.62376. Trend-corrected and
      look-elsewhere-corrected over thresholds 11..20, p < 3.3e-5 both ways.
      The Coordinator's binary question therefore has a clean answer under this
      null: #244 is UNREMARKABLE, #276 is THE HIGH ONE.
      (c) IT DOES NOT SURVIVE THE ONE CONTROL THAT MATTERS. Permuting height
      residuals WITHIN GENERATIVE SEARCH PROGRAM -- a covariate the board ships
      in its own `commentary` field and the campaign never read -- raises p
      from < 3.3e-5 to 0.21747. The incidence explains it: ELKIES_JMM23 stops
      at 14, KLAGSBRUN skips 15, MESTRE_SPEC runs through the whole window. The
      step is the SEAM BETWEEN SEARCH PROGRAMS.
      (d) AND THE DECISIVE ONE, WHICH IS NOT STATISTICAL AT ALL. Restricted to
      Mestre-family specialisation -- precisely the mechanism H-ECQ-d60d07
      proposes -- the minimum naive height by exact rank is 206.81 (12),
      136.69 (13), 134.43 (14), 118.77 (15), 141.59 (16), 136.79 (17),
      159.97 (18), 166.83 (19), 200.28 (20). 118.77 AT RANK 15 IS THAT METHOD'S
      GLOBAL BEST OVER EVERY RANK ON THIS BOARD. The deficits that follow are
      the campaign's re-aiming instruction: 0.00 at r = 15, because the class
      already holds the cell, and 49.24 at r = 14, where the cell is held by a
      different program. THE CAMPAIGN COMPARED CELLS WHEN IT SHOULD HAVE
      COMPARED METHODS. Two hazards the framing also hid: the r>=15 margin to
      the runner-up is 1.872, i.e. 1.58% -- second-thinnest in its rank window
      -- and the cell fell 214.16 -> 118.77 between 2026-05-27 and
      2026-08-21T08:28Z, i.e. 41 HOURS BEFORE THE PRE-REGISTERED FREEZE.
      WHAT THIS IS NOT. It is not an impossibility result and this decision
      does not let it read as one. A rank-15 curve below 118.770 very probably
      exists and is reachable: the Klagsbrun batch covers 12, 13, 14 and 16 and
      skips 15, and interpolating its own 14 -> 16 entries lands near 106.6.
      That is a SUBMISSION gap in a third party's dataset and is evidence FOR
      attainability.

  - id: R7
    label: >-
      THE INCUMBENTS ALREADY DO EXACTLY THIS. The expected edge is NEGATIVE,
      not near zero, and that is the finding the task card asked for.
    text: >-
      Curve 276's own commentary on the frozen board: "Mestre rank-12 quartic
      family on the integer sextuple {-114,-112,44,55,57,70} at T = 176 ...
      enumerating the Mestre locus 12*p5 = 5*p2*p3 exhaustively ... all 59479
      primitive centered sextuples with |a_i| <= 500 come out of 4.21e10
      subsets in 87 s on 24 threads ... gating on exact naive height or log|D|
      already under the standing record BEFORE any Mestre-Nagao scoring: record
      fibres are downward height fluctuations at fixed T-scale, not top Nagao
      scorers ... the gain is exhaustive coverage at this scale, not a new
      family ... ellrank returns [15,15,0]". Line for line that is
      H-ECQ-d60d07's mechanism, at family rank 12 rather than the recommended
      >= 11, already executed. It is not one submitter: 106 of 158 curves at
      ranks 12-20 are Mestre-family specialisations and every naive-height cell
      from r>=15 to r>=20 is held by one. Itemised, the edge is negative on
      FAMILY RANK (their 12, exhaustively enumerated, against a >= 11 family
      whose exact coefficients this batch's producer did not compute and whose
      one transcribed rank-12 competitor it discarded on a false negative), on
      COMPUTE (4.21e10 subsets on 24 threads against 21600 s at
      max_concurrent 2 on 4 cores), on SELECTION CRITERION (they gate on exact
      height before MN; this pipeline orders by MN and measures height after),
      and on ADVERSARY CLASS. THIS DOES NOT CLOSE THE LANE; IT RELOCATES IT.
      The honest open questions it leaves are "can a Mestre-family search beat
      its own class best of 134.43 at rank 14, where the cell is 85.19?" and
      "what does the Elkies JMM23 program do at rank 15?", neither of which
      this campaign has asked.

  - id: R8
    label: >-
      THE MESTRE-NAGAO ORDERING STEP: the Coordinator's comparison was ITSELF
      an error, the correction favours the statistic, and the step still does
      not earn its place AS PLACED. It is described as neither validated nor
      refuted.
    text: >-
      THE COMPARISON ERROR, and it is the Coordinator's. GOAL-ECQ-001's
      p = 6.1e-8 is a TOP-vs-BOTTOM contrast (28/29 vs 0/9 reaching rank >= 9).
      The contrast comparable to this batch's is TOP-vs-RANDOM, 28/29 vs 16/25,
      which recomputes by Fisher exact to p = 3.4e-3 two-sided. The five orders
      of magnitude live entirely in the bottom arm, WHICH THIS BATCH NEVER RAN.
      Presenting +0.633 at p = 0.067 as a conflict with 6.1e-8 was comparing
      two different experiments.
      THE OVERLAP RUNS THE SAME WAY. With 47 box points and 15 per arm,
      E[shared] = 15^2/47 = 4.79, so the observed difference is
      (47-15)/47 = 0.681 of the disjoint-arm contrast: the honestly disclosed
      arm overlap UNDERSTATES the effect, implying +0.930 rather than +0.633.
      At |z| = 1.83 and SE ~ 0.346, n = 32 per arm suffices at the corrected
      effect. THIS IS AN UNDER-POWERED DESIGN, NOT A NEGATIVE RESULT, and
      H-ECQ-d60d07 assumption 2's licence for MN as an ORDERING prefilter is
      not disturbed by it.
      AND YET IT IS PLACED WRONGLY. The campaign's target is a JOINT condition
      (rank >= 15 AND height < 118.770); Mestre-Nagao is a marginal RANK proxy.
      The batch measured height directly: difference -2.59 at p = 0.76, with
      the smallest curve of each family coming as often from the random arm
      (15.72 ordered against 11.39 random). The r>=15 incumbent's published
      design rationale says the same thing independently. TWO INDEPENDENT
      MEASUREMENTS AGREE. The remedy is to REORDER, not to drop: gate on exact
      naive height first, which falsifier_height.py already does in seconds,
      then use MN to order WITHIN the height-admissible set. Standing
      instruction for every downstream record: DO NOT DESCRIBE THE MESTRE-NAGAO
      STEP AS VALIDATED, AND DO NOT DESCRIBE IT AS REFUTED. Its licence covers
      RANK ordering and does not cover HEIGHT; its stated scope in the
      hypothesis is wider than what supports it and is narrowed, not withdrawn.

  - id: R9
    label: >-
      WHAT SURVIVES AS POSITIVE, recorded with the same weight as the adverse
      findings because it is the batch's durable output.
    text: >-
      THE PIPELINE IS SOUND AND INDEPENDENTLY CORROBORATED. Joint 2 holds and
      holds well. The validator wrote its own invariant computation and its own
      exact certifier from the mathematical statements, without reading the
      producer's implementations first: 127/127 declared paths content-verified
      at ab0aa5404, recomputed rather than read from the receipt; all 289 board
      curves agreeing on naive height to a maximum absolute difference of
      2.842170943040401e-14 and on Faltings height to 1.7763568394002505e-15,
      and agreeing with the PRODUCER to ZERO ULP on both; 289/289 exact on
      minimal discriminant and curve_key; conductor confirmed on a
      validator-chosen 30-curve sample (seed random.Random(6040)), 29/29, the
      30th being #288 where the board stores null. The conventions were PINNED
      BY MEASUREMENT against four rival Faltings definitions, not accepted. The
      independent certifier reproduces all five negative controls and
      re-certifies #276 at >= 15, #244 at >= 14 and #273, the rank-30 record
      curve, at >= 30, with board rank sum 3480 equal to certified rank sum
      3480. Run quarantine and the -011..-014 supersession of -006..-009 are
      CONFIRMED IN THE ARTIFACTS BY RECURSIVE DIFF AND BY HASH, not by prose:
      the only changed leaves are regulator, numerical_regulator, the new
      numerical_regulator_over flag and timings; no certified rank or height
      moved anywhere. Budget respected throughout (1.66 GB of 4 GB; 1880.2 s of
      3600 s; 16 runs of 80).
      AND THE C2 RESULT OF R4 IS REAL PROGRESS ON THE AXIS THAT CARRIES THIS
      CAMPAIGN'S RESEARCH CONTENT, even though the A2 target was not reached:
      rank >= 11 over Q(T) is now certified IN-REPO rather than cited, on a
      surface whose degree is d = 2 EXACTLY with ceiling 18/17 -- replacing a
      producer guard that was failing open by 20.

  - id: R10
    label: >-
      ORCHESTRATION-LAYER FAILURES, ALL FOUND BY REVIEWERS OR PRODUCERS AND
      NONE BY THE LAYER THAT CAUSED THEM. Recorded against the Coordinator.
    text: >-
      (a) THIS REVIEW ROUND RAN WITH NO DECLARED review_plan. Verified directly
      against dispatch_queue.json: none of its five handoffs carries the key.
      AGENTS.md "Review architecture" requires one written BEFORE any reviewer
      runs, carrying the Coordinator's recorded prior, enumerated owned joints,
      declared blindness, a proves_too_much block and any blind re-derivation.
      Joints were assigned in launch messages only, so
      tools/check_review_independence.py has no plan to compose this round
      against and "the Coordinator's prior was recorded first" CANNOT BE
      ESTABLISHED AFTER THE FACT. GOAL-ECQ-001 had a plan; this round
      regressed, and the cost is paid in this very decision -- both reviews
      went against the campaign and there is no committed prior to say whether
      that was expected. This is a Coordinator failure and it is not repeatable:
      no further batch of this campaign dispatches a reviewer without a
      committed review_plan.
      (b) A PARTIAL BLINDNESS EXPOSURE, CAUSED BY THE ORCHESTRATION LAYER AND
      DISCLOSED BY THE VALIDATOR. While diagnosing why its own deliverable
      appeared already tracked, the validator ran `git log --oneline` and
      `git show --stat` and saw the sibling commit's SUBJECT LINE and three
      FILE NAMES (redteam_report.md, objections.yaml,
      analysis/redteam_controls.py). NO CONTENT WAS READ. It disclosed the
      encounter per its role contract rather than proceeding quietly, and its
      conclusions were already fixed. THE MITIGATION WORKED AND IS WORTH
      NAMING: the commit message said only THAT the artifacts landed -- the
