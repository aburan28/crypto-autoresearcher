  reassessment_by_clause:
    statement_i_and_prediction_min_ratio: >-
      "At least 1.0 on every row". On the hypothesis's own test boundary (the
      committed harvest-off sweep rows) it HELD: minimum 1.483 over 955 IC rows
      (EV-PFDR-cf6ee5 OBS-8), and 0 of 1157 Stage 0 floor rows below 0.9 when
      recomputed by the TW-FLOOR red team (EV-PFDR-d90ccd PTM-3). But it is NOT
      a consequence of the mechanism. The lemma bounds an expectation; at fixed
      S Markov allows P(ratio <= t) up to t^2, and for a count that is not the
      stopping count no per-instance bound follows (derivation note
      DN-575e80-F6 D2, D4, D5). So holding per row is not evidence for the
      mechanism at the margin the clause states. RESTATE (R1).
    falsification_condition_1: >-
      "Any committed row with ratio < 0.9 means the lemma, its constants or the
      charging convention is wrong". Read through the mechanism, it fired 73
      times on EXP-PFDR-1b78f7 harvest-on rows. The TW-FLOOR round shows that
      as a test it PROVES TOO MUCH: the same predicate fires on rho at the
      generic rate (38 of 145), on an exactly generic replica (2.0-2.3%) and on
      random arms (1.41%), and 52 of the 73 firings are on premise-violating
      arms (EV-PFDR-d90ccd INF-1, INF-3). "The constants or the charging
      convention" are faithful (c = 2, table in S, X_cmp <= 2*S_3). The
      condition's intent, "a below-floor result means the lemma is wrong", is
      kept; its per-row form is replaced by the aggregate test (R1). It did NOT
      fire in its corrected form: aggregate T >= 1 on every premise-holding
      cell (lowest calibrated 99% lower end 1.373).
    statement_ii_iii_and_falsification_conditions_2_3: >-
      Odd-m flatness and the even-m N^{1/(2m)} gap. UNCHANGED from Stage 0:
      inconclusive. The F-3 event at m = 6 does not discriminate 1/12 from an
      excess of 0.02-0.03 (EV-PFDR-cf6ee5). The paired m = 6 / m = 7
      replication (DEC-20260929-1b779a NA-3) remains the route. Not re-read here.
    statement_iv_base_overlap: Overlap holds at m = 3 on matched |F| (EV-PFDR-cf6ee5 OBS-8). Recorded as an observation, not support (Stage 0's success criterion was not met).
    HEUR-0cc7e8-H1: >-
      The Poisson SHAPE is refuted for pair counts at the tested scale (A6;
      EV-PFDR-1faf10 INF-4), while the first moment matches within 2% for TT|3,
      TT|5 and SS|3-5 and is 9-20% low for TB|3 and TT|4. In the exactly generic
      replica the SS pair first moment is 1.005-1.051 of C(X',2)*2/N
      (EV-PFDR-d90ccd; synthetic, 12..24 bits). The mechanism is the bundle
      dependence of pairs within one relation. RESTATE (R3) as a first-moment
      statement plus a compound law, aligned with H-PFDR-2765d2 Lemma L1. L1 is
      unreviewed, and the restatement does not rely on it for any adverse
      reading.
    HEUR-0cc7e8-H2: >-
      Holds at the tested scale. All eight r/|F| slopes over 20..32 lie in
      [-0.007, -0.001] (EV-PFDR-cf6ee5 OBS-9). At m = 4 small_x harvest-on,
      r_rank/|F| has slope +0.0030 [+0.0001, +0.0061] over 12..32 (EV-PFDR-d90ccd
      OBS-8; the r_frozen version rises at +0.041, but that is a pair count,
      not H2's object). Carried unchanged.
    mechanism_and_proof_obligations: >-
      The lemma's expectation form for an ADAPTIVE engine that truncates at the
      first hit and stops at a data-dependent time is not derived by the source
      record (IDEA-20260928-ce3ab0) or by the round (DN-575e80-F6 D3). Shoup's
      technique, as relayed in the corpus, bounds the first collision. The
      aggregate test supports it numerically on this engine only (T >= 1 on
      every premise-holding cell; per-rung r_frozen lower ends >= 1.070 at m =
      4; replica T >= 1.30 at every rung over 12..24 bits). RESTATE (R2) as an
      explicit numbered heuristic, with a derivation-note commission
      (DEC-20261001-494663 NA-4). Proof obligations 1-5 are undischarged, as
      before.
    exponent_statement_L6: >-
      The floor exponent N^((1+beta)/2) is read on harvest-off rows at its own
      test boundary. The TW-FLOOR round adds an open finite-range observation
      for a harvest-on engine. At m = 4 the S_3 exponent (0.6076) lies below
      the design-evaluated floor-model exponent beyond calibrated error, and
      the ratio to the r_rank floor declines (-0.0149 per log2 N) while staying
      >= 2.10. By an exact identity this is the harvested pair count
      approaching the X^2/N budget plus multiplicity growth (EV-PFDR-d90ccd
      cross_joint_reading and INF-5). It is not a contradiction; whether it
      flattens is the D3 question. CARRY (R5) as an explicit open question
      with its validation plan.
    asymptotic_claim_and_gates: >-
      An asymptotic lower-bound statement. Promotion gates: (1) no proof
      decomposition reviewed (D3 open); (2) H1 restated, H2 holding at toy
      scale, D3 not yet numbered; (3) no concrete-cost table (not applicable
      as an attack, but required for promotion); (4) independent
      review-breakthrough review of the per-row reading exists (this round),
      while no review of the derivation itself exists. Ceiling: analyzed, never
      supported.

  refinement_content:
    note: >-
      What the superseding hypothesis record must carry. It is written in a
      later design act (id minted then with tools/allocate_id.py); the
      committed H-PFDR-0cc7e8 file is never edited. Mechanism, source proposal,
      clauses (ii)-(iv), H2 and the predictions_not_adopted note carry over
      unchanged.
    R1: >-
      Prediction (i) and falsification condition 1 become: on premise-holding
      arms (premise audit first: formal_basis_rank and formal rows fed per arm;
      known_log and j0-type automorphism bases are positive controls, never
      test rows), the aggregate T = sum w S_3^2 / sum w r N/4 (deterministic
      weights, e.g. w = 1/(N B)) is >= 1. A violation is T below 1 beyond its
      interval, calibrated by simulation at the design's n. r_frozen (colliding
      pairs, lemma step ii) and r_rank (independent relations, step iii) are
      both reported. A per-instance predicate is allowed only against a null
      calibrated on an exactly generic engine at the instance's own count
      structure. Basis: DN-575e80-F6 D2, D4, D5, D6 (derivation, archived at
      92f503cb9) and the TW-FLOOR proves-too-much results (EV-PFDR-d90ccd OBS-6).
    R2: >-
      A new numbered heuristic (HEUR-<new id>-H3): for the mitm engine
      (adaptive truncation, data-dependent stop) the expected number of
      colliding compared pairs after S units is at most (2S)^2/N (1 + o(1)), so
      aggregate T >= 1. random_model_justification: non-adaptive linearity of
      expectation (DN D1); the adaptive step is open (DN D3).
      validation_experiment_ids: the F7/D3 follow-up of DEC-20261001-494663
      NA-3. falsification_condition: aggregate T < 1 beyond calibrated error on
      premise-holding arms at any tested N.
    R3: >-
      HEUR-0cc7e8-H1 becomes a first-moment statement (pair coincidences have
      mean X'(X'-1)/N times the engine's ordering constant) plus a compound law
      with the measured multiplicity, with its own falsification condition. The
      Poisson-shape clause, refuted as stated for pairs (EV-PFDR-1faf10 INF-4),
      is dropped.
    R4: Test boundary may name harvest-on rows explicitly, with the premise audit, so that no reading depends on an implicit transfer.
    R5: >-
      Open question carried: the m = 4 harvest-on approach to the floor (F7). It
      is resolved by the aggregate T at larger N (DEC-20261001-494663 NA-3),
      with a decision rule fixed before data.
    R6: The ceiling and promotion_gates_note carry unchanged (analyzed at most until the four gates are met).

