  rationale:
    - >-
      Why refine. The pre-registered routing (RD-1) prescribes it, and its
      conditions hold (DEC-20261001-494663). The defect found is in how two
      clauses of the hypothesis are STATED (per-row readings of an expectation
      bound, a Poisson shape for dependent pairs), not in the mechanism those
      clauses were meant to test. The honest transition restates them in the
      form the mechanism licenses, as DEC-20260929-bbb3a9 did for the pair-unit
      clauses of H-PFDR-4765e4.
    - >-
      Why not weaken or reject_scoped. No archived evidence contradicts the
      mechanism. The firings that met falsification condition 1 as worded are
      premise violations and calibration artifacts. The aggregate the lemma
      bounds holds everywhere it applies. The A6 refutation concerns H1's
      SHAPE, with its first moment largely intact. F7 is a finite-range trend
      above the floor. Any adverse reading would need a refutation artifact
      against the mechanism, and none exists. A single, empirical-only run set
      could in any case support no reject_scoped.
    - >-
      Why not support. Asymptotic claim; the four promotion gates are unmet
      (D3 is an open obligation; no reviewed proof decomposition; no concrete
      cost table). Stage 0's success criterion was not met. Ceiling: analyzed.
    - >-
      Why not wait. Every record the reassessment rests on is archived (or is
      archived in the same commit as this decision, by precedent). The F7/D3
      follow-up is a question for the REFINED record to carry as a numbered
      heuristic and an open question. Leaving H-PFDR-0cc7e8 unassessed until
      then would keep a falsification condition that the round showed proves
      too much as the standing test of an admission gate other work relies on.
    - >-
      Refutation-artifact discipline. This is not an adverse transition, but
      the restatement of prediction (i) and falsification condition 1 rests on
      a checkable argument. That argument is DN-575e80-F6, a derivation note
      archived at 92f503cb9 before this decision. This Coordinator checked D2
      and the D5 value (1 - 13*exp(-3) = 0.3528), and the rest has not been
      checked by an independent reader. Its tier is derivation, never
      "proved". An independent check is commissioned (DEC-20261001-494663
      NA-4).
    - >-
      Exponent bias (docs/target-result-profile.md). H-PFDR-0cc7e8 is a
      calibration of a generic lower bound, not an exponent lever. Its value
      to the program is as the admission gate structured proposals must beat.
      The refinement makes that gate usable (aggregate, premise-audited) rather
      than one that fires on rho.

  scoped_claim: >-
    For H-PFDR-0cc7e8 on the crypto_autoresearcher.index_calculus mitm engine
    at 12..32 bits on generated prime-order curves, the archived evidence
    (EV-PFDR-cf6ee5, EV-PFDR-1faf10, EV-PFDR-d90ccd) shows no row of its test
    boundary below the floor. It shows no aggregate violation of the floor on
    any premise-holding cell of EXP-PFDR-1b78f7, harvest-on included. Its
    per-row prediction (i) and falsification condition 1 are not entailed by
    its mechanism and prove too much on known-false objects. HEUR-0cc7e8-H1's
    Poisson shape is refuted for pair counts, with its first moment largely
    intact; HEUR-0cc7e8-H2 holds at the tested scale. The adaptive-engine
    expectation form of its lemma is unproven. Clauses (ii) and (iii) are
    unresolved. Toy scale; no deployed-curve implication, no universal
    impossibility, no exponent below rho's.

