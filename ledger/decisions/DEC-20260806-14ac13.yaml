  criteria_state:
    C1: UNTOUCHED by this batch. No numeric dbeta and no core-SVP bit value under a named cost
      model was produced or attempted.
    C2: MET at BATCH-a51f91 and unchanged here. Nothing in this batch bears on the census.
    C3: >-
      STILL UNMET, and the reason has changed. After BATCH-436ddd, C3 was blocked because the
      sensitivity demonstration manipulated the wrong arm. After BATCH-f19c37 it is blocked
      because the demonstration's monotonicity gate fails a correct instrument nine times in
      ten, and because no admissible adjudication predicate exists -- the one constructed was
      refused on a null object. C3 remains MEETABLE. Both blockers are instrument defects with
      named, cheap, pre-registrable repairs, and neither is a statement about the Beta tail law.
    C4: MET. Both reviews ran in independent sessions after the snapshot, neither committed its
      own artifacts, and both checked the forced-value derivations rather than the arithmetic
      alone -- the validator re-derived mu_0 from scratch, the red team built two null objects
      and a matched-V control that the frozen design did not contain.
    C5: MET by this archive.

  amendment_disposition:
    AM-1:
      grid: RETAINED. The 13-point grid brackets the range-midpoint in all four cells, the
        crossing falls inside the sampled range, and the 24 shared points are bitwise identical
        to the superseded run. No successor re-litigates the grid.
      G3: >-
        WITHDRAWN AS FROZEN. The tie-tolerant form denominated in SE_step_paired is defective
        and may not be re-used. Its "record the more severe of the two readings" clause is
        additionally a ONE-SIDED safeguard rather than the two-sided one it claims, since
        SE_paired < SE_unpaired in 47 of 48 steps. A replacement is required by AM-3 below.
    AM-2:
      acceptance_test: RETAINED AND SHOWN INSUFFICIENT. Demonstrated separation on committed
        data was necessary and is not sufficient -- P3 satisfies AM-2 in full and is still
        refused. AM-2 required a predicate to SEPARATE; it did not require the separation to be
        a function of the object under study. AM-4 below adds that requirement.
      predicate: REFUSED. P3 is not adopted as this goal's adjudicator. It is admitted as a
        free exact diagnostic of coordinate alignment and nothing more.

  amendments:
  - id: AM-3
    supersedes: AM-1's G3 tolerance
    requirement: >-
      A monotonicity criterion in this goal is admissible only if its false-failure rate on a
      flawless instrument is COMPUTED AND DECLARED IN THE PRE-REGISTRATION, before any data is
      seen, together with an explicit multiplicity policy naming the number of comparisons. AM-1
      declared neither, and the validator attributes most of the 0.9902 to multiplicity alone.
      A criterion whose declared false-failure rate exceeds 0.10 is refused at pre-registration.
    permitted_repairs: >-
      Any of the three the validator costed, or another with the same property. (a) Denominate
      the tolerance in the gate's own units (K x SE_diff), so G3 and the detectability gate speak
      one language. (b) Restrict G3 to steps where at least one endpoint clears the gate, so the
      criterion is never evaluated on frames the design itself calls uninformative. (c) State G3
      as an equivalence test (TOST) against a pre-registered practically-negligible increase,
      which is what "tie-tolerant" was reaching for and failed to express.
    prohibition: >-
      The validator's counterfactual -- PARTIAL in all four cells under both readings -- MUST NOT
      be cited as a result, as a verdict, or as grounds for preferring any particular repair. It
      was computed after seeing which steps violated. Its only legitimate use is to establish that
      the denominator rather than the data decides the verdict, which is why this amendment exists.
  - id: AM-4
    supersedes: nothing; extends AM-2
    requirement: >-
      A predicate is admissible as an ADJUDICATOR only if, in addition to AM-2's demonstrated
      separation and declared detection floor, it is shown INVARIANT UNDER THE TRANSFORMATIONS THAT
      PRESERVE THE OBJECT IT CLAIMS TO ADJUDICATE. For a statistic about a lattice that means, at
      minimum: invariance under ambient isometry B -> BH, under row permutation of the basis, and
      under change of basis B -> UB for unimodular U. The demonstration reports the statistic's
      value on Z^d in its identity basis and on at least one non-trivial isometric presentation
      of a test lattice, and a predicate whose verdict changes across those presentations is
      REFUSED regardless of how well it separates.
    rationale_in_one_line: >-
      P3 passed every test AM-2 asked for and was still measuring the coordinate frame; a separation
      that survives no symmetry of the object is a separation about the presentation.
    note: >-
      This is a real cost and it is worth paying. It may turn out that no cheap exactly-computable
      statistic satisfies AM-4 for this question. "NO ADMISSIBLE PREDICATE EXISTS, HERE IS THE
      OBSTRUCTION" remains a legitimate and preferred outcome over a plausible predicate that
      cannot be demonstrated, per docs/inventor-protocol.md section 4.
  - id: AM-5
    supersedes: F-B's observable
    requirement: >-
      D_A(beta_2)/D_A(beta_1) at fixed reduction is NOT an admissible observable for a decay law in
      this goal and may not be frozen about again. Any beta-trend falsifier states, before the run,
      whether its beta range crosses k, and refuses to score a ratio across that fold. The
      replacement the red team supplies is the matched-V cross-family comparison, which tests the
      mechanism directly and requires no lattice reduction beyond what is already committed.
    also: >-
      The 0.90 artifact tell is unbound from beta. It is re-bound to the parameters that are meant
      to destroy the departure -- t and reduction strength -- against which the quantity is measured
      to decay monotonically. Carrying a tell verbatim from a superseded pre-registration together
      with the wrong binding is itself the defect recorded here.

  limitations:
  - Claim tier TOY, unconditionally. NOTHING in this decision or its evidence bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any hypothesis status.
  - No hypothesis status moves and none is proposed. The demonstration returned INVALID, so
    prereg section 7.5(3) forbids interpreting the real arms, and that prohibition is honoured.
  - The notarization closure is FOR THIS BATCH ONLY. It is not retroactive to BATCH-436ddd, to
    BATCH-a51f91, or to any GOAL-HQC-001 batch, and git ancestry cannot exclude off-repo
    pre-computation in any case.
  - The matched-V control is a red-team probe on the red team's own frames, at d = 100 and
    beta = 30 only, not pre-registered, with fpylll unavailable so its D values are not
    absolutely comparable to the run's. It is recorded at that strength and no higher.
  - Both reviews resolved to the same model as the producers, as every batch in this goal has.
    Independence here is procedural, never model-level. Recorded rather than left to pass.
  - This decision creates no evidence of its own. It records adjudications of the two review
    reports and amends an instrument specification.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No durable claim about lattices was established, so nothing is promoted from the measurements.
      The generalizable candidate is the six-instance pattern in the rationale -- a control demonstrated
      only where its own defect is invisible -- which now has enough instances to be worth a KN-TECH.
      It is NOT promoted here for two reasons: rule 12 is unmet and unwaived in this goal, inherited
      from GOAL-MLKEM-003, so a promotion cannot get a second backend's review; and all six instances
      are internal to this program, which is exactly the sampling that would make the pattern look
      characteristic whether or not it is. A successor confirming it outside this goal discharges both.

  next_actions:
  - >-
    RUN k != d/2. IT IS A FIRST-CLASS TASK IN THE NEXT BATCH, NOT A CARRIAGE NOTE. It is now named
    as unevaluated in FIVE records -- EV-MLKEM-94f036, the AM-1 could_not_evaluate block,
    DEC-20260806-00deff next_actions, the AM-2 report section 8.5, and validator finding V-8 -- across
    four batches, and it has never been run. Both d tested have k = d/2. It is the cheapest
    discriminating test outstanding in this goal, it separates L2's beta <= k spill boundary from the
    superseded beta <= d-k mechanism, and it is the largest single hole in L2's support. Carrying it
    a sixth time without running it would be the clearest possible instance of the failure this
    decision is about.
  - >-
    Re-run the AM-1 demonstration under AM-3, on this batch's split-producer pattern, with the
    false-failure rate and multiplicity policy computed and notarized BEFORE the measurement. The
    graded arms need no lattice reduction at all -- they are pure numpy, and the seeds are the cache
    (32/32 verified at max deviation 0.0). This is seconds of compute.
  - >-
    Reproduce the matched-V control against the COMMITTED bases rather than the red team's own, so its
    D values become absolutely comparable to the run's, and pre-register it as F-A1's replacement.
    Cheap: it needs no new reduction.
  - >-
    Treat the search for an AM-4-admissible statistic as research, not as adjudication housekeeping.
    The red team notes a degree-1 alternative W = sum_{a<=k} P_aa - beta*k/d that is not a function of
    V and does fire, so the space is not empty -- but it is not demonstrated, and it must clear AM-4's
    isometry and permutation checks before it is anything. Whether an exactly-computable statistic
    exists for the left-tail quantile C3 actually names is the open question worth asking next.
  - >-
    Fix the "4 SE" gate's calibration with the named sd_0(d,beta)/sqrt(n) exact-SE correction. The
    nominal 3e-5 test is measured at 0.0015-0.0025, a factor of about 60. Producer-disclosed,
    independently confirmed by both reviews, and the fix costs no lattice work.
  - >-
    Bind every archive block in the successor queue at completion time and RUN THE VERIFIER before the
    batch is called closed, rather than at the next batch's ledger archive. Keep the durability commit
    out, or give it its own archive task.
  - >-
    THE GOAL REMAINS ACTIVE. Every outcome in this batch is on the non_terminal_conditions list of
    GOAL-MLKEM-005: candidate mechanisms refuted, a measurement returning INVALID, an instrument
    defect found. C1 and C3 are open and C3 is meetable. Nothing here closes, pauses, or completes
    this goal, and this decision may not be cited in a decision that does.
