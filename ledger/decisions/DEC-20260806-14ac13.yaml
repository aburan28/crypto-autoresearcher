coordinator_decision:
  id: DEC-20260806-14ac13
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-MLKEM-005
  - EV-MLKEM-94c773
  - DEC-20260806-00deff
  context: >-
    BATCH-f19c37 executed DEC-20260806-00deff. It carried two amendments -- AM-1, a
    replacement t grid and a tie-tolerant G3; and AM-2, an acceptance test for a
    replacement adjudication predicate -- plus a split producer designed to close
    the snapshot-notarization gap that BATCH-436ddd could not. The validator ADMITTED
    both producers and called both self-objections "correct and understated". The
    red team returned two SEVERE objections and one new falsifying result. This
    decision records what survived, what did not, and what the next batch must run.
    It moves no hypothesis status and discharges no completion criterion.

  rationale:
  - >-
    THE G3 DEFECT IS MINE, AND I RECORD IT AS MINE. AM-1 is my amendment. It replaced
    a grid whose first interior point sat five to seven times past the family's
    range-midpoint -- that half of the fix WORKED, and the crossing now lands inside
    the sampled range in all four cells. But it also replaced G3's adjacency rule with
    a tolerance denominated in SE_step_paired, and that denominator collapses exactly
    where the effect it is meant to police vanishes. The validator upheld the executor's
    section 7.5 objection and strengthened it: 24 of 48 steps have NEITHER endpoint
    clearing the gate, and on a true-zero step Delta/SE_paired follows t_7, so
    P(|t_7| > 1) = 0.175309 and P(at least one FAIL) = 0.9902. The red team counted
    differently -- 3 guaranteed plateau steps per cell, from the run's own exact V
    values -- and obtained P(4-cell FAIL) = 0.9014 against P(PASS) = 0.00025. A FLAWLESS
    INSTRUMENT FAILS THIS GATE ROUGHLY NINE TIMES IN TEN. AM-1 moved construction-driven
    P(INVALID) from about 0.9986 to about 0.99. IT RELOCATED THE DEFECT RATHER THAN
    REMOVING IT. I approved that gate and the executor implemented it as written, which
    was correct; the error is at the desk that froze it, not at the bench that ran it.
  - >-
    AND THEREFORE THE INVALID VERDICT STANDS EXACTLY AS RECORDED. The validator computed
    that a gate-commensurable tolerance would return TIE in all four cells and hence
    PARTIAL, and stated in its own report that this is POST-HOC -- computed after seeing
    which steps violated, which is the move prereg section 7.5 forbids and which the
    executor correctly declined to make. It is not adopted, not cited as a result, and
    not carried into the evidence record as one. The frozen rule was run and INVALID is
    its output. What changes is the NEXT gate, declared in advance, not this one's verdict.
  - >-
    THE RED TEAM KILLED P3 AND WAS RIGHT TO. The "mu_0 is a theorem" defence is true --
    the validator re-derived it independently from P_aa ~ Beta(beta/2, (d-beta)/2) by
    linearity alone and confirmed it bit-exactly in four cells plus a 20,000-frame Monte
    Carlo -- and it is the WRONG DEFENCE. A correct null does not make a statistic a valid
    adjudicator; it makes it a correctly-calibrated detector of whatever it detects. What
    P3 detects is the orientation of the tail GSO frame relative to the standard coordinate
    axes, and THAT IS NOT A FUNCTION OF THE LATTICE. P3 returns its maximum possible
    DEPARTURE on Z^d, because V <= beta(1 - beta/d) for every rank-beta projector and the
    identity basis attains that bound -- and the producer's own out-of-sample anchor,
    V = 21.000000, IS that object. An ambient isometry, which preserves every invariant any
    lattice problem depends on, assigns the same lattice DEPARTURE (z = +465.48), the spec's
    own instrument-fault verdict ANOMALY_BELOW_NULL (z = -17.98), and AGREEMENT (z = -0.50).
    P3 IS REFUSED AS AN ADJUDICATOR. It remains a legitimate, free, exact DIAGNOSTIC of
    coordinate alignment, strictly better than T2 at that job, and it may be used as one.
  - >-
    A THIRD FAILURE THE BATCH DID NOT ASK FOR. The red team built the arm F-A1 was missing:
    a second frame family exactly matched in V with a different third diagonal moment. At
    exactly equal V, D differs by 7 percent and 20 percent, the second at 3.45 SE. D is NOT
    a function of V alone. The pre-registration called F-A1 "the falsifier that counts",
    immune to the magnitude map's known 1.0-1.7x defect; it is not immune, because an
    ordering test is blind to a level offset that preserves order. The recorded CONSISTENT
    verdict stands -- the control was not pre-registered and does not rescore a frozen
    falsifier -- but the frozen F-A1 tested a weaker proposition than the one it named.
    The boundary is now measured: Var(e^T P e) = 2 beta + (mu4 - 3)(V + beta^2/d) IS a
    function of V alone, so L2's derivation is right at second order, while the 2^-10 tail
    quantile the design measures at has a third cumulant involving sum_a P_aa^3 independently
    of V. A variance-level derivation is not licence for a tail-level prediction.
  - >-
    THE PATTERN IS THE FINDING, AND IT IS NOW SIX INSTANCES. G3 was denominated in a noise
    scale that collapses where the effect vanishes. P3's out-of-sample anchor was the one
    object on which it attains its maximum -- its strongest verification and its worst
    null-object failure are the same computation. F-A1 was scored on a subset whose own
    construction forces the co-monotonicity it tested for, since the prereg defines the NOVEL
    subset as graded-path points only and V(t) and D(t) are both monotone in t there. In
    every case the check was real, the arithmetic was right, and the ARRANGEMENT made the
    check incapable of failing for the reason it existed to catch. Joined to CTRL-BS,
    CTRL-POSHOM and CTRL-IDXMAP, this is the same failure mode six times. It is no longer a
    recurring annoyance; it is this program's characteristic error, and it warrants a
    knowledge entry once a successor confirms it outside this goal.
  - >-
    F-B's BOOKKEEPING WAS CORRECT AND ITS READING WAS NOT, and the two falsifications do not
    carry equal weight. L1 FALSIFIED is robust: genuinely pre-registered, predicts decay, and
    growth was measured at both d including the fold-free d = 140 row. L2 FALSIFIED is not.
    At d = 100, k = 50 and the trend runs to beta = 60 > k, so D(60)/D(30) is a ratio across a
    phase change in the object -- the unreduced V itself falls, 24.995 to 16.269, as the tail
    window is forced out of the k-block -- and no decay law of either kind is defined across
    that fold. lll_only and real_bkz40 are NOT APPLICABLE at both d, so F-B has exactly one
    scorable arm per d and it is `unreduced`, whose V the red team reproduced from its own
    q-ary bases to within 0.12-0.73 percent: F-B's discriminating measurement is a measurement
    of the q-ary construction, not of any reduction phenomenon. D_A(60)/D_A(30) at fixed
    reduction IS NOT AN ADMISSIBLE OBSERVABLE for a decay law and must not be frozen about
    again. Relatedly, the 0.90 artifact tell is bound to the wrong parameter: beta is the width
    of the probe window, not a randomization strength, and against the parameters that ARE meant
    to destroy the departure -- t and reduction strength -- the quantity decays monotonically.
  - >-
    WHAT SURVIVED, STATED WITHOUT DISCOUNT. The notarization gap is CLOSED BY CONSTRUCTION for
    this batch: six carriers agree on sha256 cc7f3e19...d731b302; `git merge-base --is-ancestor`
    returns TRUE; `git log --follow` on prereg.md returns EXACTLY ONE commit; and no measurement
    artifact exists in the git record before the pre-registration does. The split producer did
    the job it was designed to do, and it is the pattern every claim-relevant producer in this
    goal now uses. The grid fix worked and is, in the red team's words, the batch's soundest
    claim -- it was the one headline it tried and failed to falsify. Reproduction is exact:
    32 of 32 reductions at max deviation 0.0 against both prior batches, and all 24 shared grid
    points bitwise identical. And V-7 is a real catch that cuts against the producer: the
    executor's ancestry check asserted the notarizing commit's PARENT, so its own check would
    have passed had the notarization never happened. The validator ran the stronger check.

  - >-
    A COORDINATOR DEFECT IN THE ARCHIVE ITSELF, FOUND BY RUNNING THE VERIFIER RATHER THAN BY ASSUMING IT.
    I ran tools.research_dispatch.GitRepositoryVerifier against both BATCH-f19c37 snapshots. The
    notarization archive TASK-20260806-53ad5c at 17203307 PASSES STRICTLY, 3/3 declared paths against
    parent a2d0eba6. The producer archive TASK-20260806-2e602d at a517e013 IS REJECTED: "commit must
    change exactly declared archive and source artifacts (missing [the three TASK-20260806-0617ed
    paths])". The cause is the durability commit d3e66a19, which I made and disclosed at the time, and
    which pinned the AM-2 artifacts BEFORE the snapshot instead of in it. Content is clean -- 7/7 declared
    hashes match the tree at a517e013, and the three AM-2 files are bit-identical between d3e66a19 and
    a517e013 -- and the rule's PURPOSE, artifacts committed before any reviewer reads them, is satisfied
    with room to spare. Its LETTER is not. This is recorded as a rejection and not narrated into a pass.
    THE PROCESS FIX, binding on successors in this goal: an early durability commit is either declared
    as its own archive task with its own receipt, or it is not made. A snapshot receipt may not re-hash
    artifacts that a previous commit already introduced and call the archive contract discharged.
  - >-
    AND A SECOND ONE UNDERNEATH IT: THE QUEUE WAS NEVER CLOSED OUT. All eight BATCH-f19c37 task cards
    still read `state: queued` after six had completed, and neither snapshot receipt carried a resolvable
    `commit_sha` -- both were written as `null`, in an `archive.path_sha256` shape the verifier cannot
    consume, so NO archive in this batch had ever actually been through verify_archive before now. The
    BATCH-a51f91 cards were bound correctly and BATCH-436ddd's were not, so this is drift rather than a
    missing convention. Both are repaired in this archive: states recorded, archive blocks bound to real
    commits and parents with per-path hashes, and the verifier run with its verdicts recorded above.
    The lesson generalizes past this goal -- an unverified archive and a verified one look identical from
    the working tree, which is exactly why step 7 of the dispatch loop exists.

