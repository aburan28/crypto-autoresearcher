      as written cannot be satisfied on this host by any change.
    - >-
      STOPPING THE SNAPSHOT WOULD LEAVE THE OUTPUT UNOWNED. Under AGENTS.md
      "Durable research commits", the producer's output is working-tree state
      until a snapshot commits it. Holding it uncommitted protects nothing and
      risks losing it. The snapshot is not a merge and is not a state
      transition.
    - >-
