      who_caught_it: >-
        The orchestrating session's own scoping task, which recorded it against its own prior
        recommendation at coordination/goals/GOAL-ECQ-2298dc/inputs/SCOPING-recomputation-lane.md
        under the heading "A theorem that closes my own 'reachable adjacent record'
