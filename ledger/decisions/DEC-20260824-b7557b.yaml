      cleaner history than it earned.
    items:

    - id: E1
      error: >-
        TASK-20260824-261bb4 WAS DISPATCHED WITH NO FROZEN APPROVED CONTRACT, NO GOAL RECORD, NO
        RESEARCH-QUESTION RECORD AND NO HANDOFF ENVELOPE.
      who_caught_it: >-
        The executor refused it as `specification_error` and started nothing. THE REFUSAL WAS
        CORRECT ON EVERY COUNT and is recorded as correct on the handoff's procedure_deviation and
        in the goal's procedure_deviation_reference.
      why_it_matters: >-
        DEC-20260823-ee9162 next action N1 component (h) reads, verbatim, "AN EXP-* CONTRACT
        BEFORE ANY PRODUCER IS DISPATCHED. Fourth consecutive batch owing it; a fifth instance
        should block dispatch rather than be recorded." It had already made this a DISPATCH
        BLOCKER one batch earlier. This is the SECOND recorded instance against N1(h) in this
        campaign's lineage, on top of the four consecutive prior batches N1(h) itself counts. A
        contract authored after execution is a receipt, not a protocol.
      remedy_taken: >-
        The four records were authored and committed before any run existed, and the run was
        re-dispatched against the frozen contract. N1(h) IS NOT CLOSED BY THIS DECISION and stands
        as written.

    - id: E2
      error: >-
        THE PART-C TRIAGE GATE APPROVED IN THE v1 FROZEN CONTRACT WAS SIGN-INVERTED. It selected
        "the top 20 candidates by S" where S = sum over p <= 500 of (a_p log p) / p, but S
        DECREASES with rank, so the gate selected the LOWEST-rank candidates in each arm -- the
        exact opposite of the triage's stated purpose.
      who_caught_it: >-
        v1's executor caught it mid-run, APPLIED THE FROZEN RULE EXACTLY AS WRITTEN, REFUSED TO
        SELF-AUTHORISE A CHANGE, reported the inversion as its most consequential finding, and
        preserved every per-candidate score so the re-gate needed no new scoring run. ALL FOUR OF
        THOSE WERE CORRECT.
      why_it_matters: >-
        v1's C-NULL is real as recorded and UNINFORMATIVE about the twist neighbourhood, and may
        never be cited as evidence that the neighbourhood is barren. A pre-registered prior was
        met FOR THE WRONG REASON, which is the failure mode a pre-registration exists to prevent.
      remedy_taken: >-
        PA-ECQ-f5af06-v2-triage-gate-sign, approved by DEC-20260824-5246b7, corrected the
        direction and made it falsifiable INSIDE the v2 run set via the blocking control
        CTL-GATE-DIRECTION with a pass condition stated before the run. That control passed. The
        correction changed a selection rule after scores were seen, which remains true after every
        argument for it, and DEC-20260824-5246b7 records that limitation rather than claiming
        exemption from it.

    - id: E3
      error: >-
        A FLAT MINIMALITY REQUIREMENT WAS WRITTEN INTO THE INSTRUCTION FOR v2 -- "require
        minimality for any candidate that reaches the exact gate" -- WHICH IS UNSATISFIABLE.
        Laska-Kraus-Connell minimalisation needs the factorisation of discriminants of roughly 450
        to 900 decimal digits. Writing an unsatisfiable clause into a frozen contract is worse
        than writing none.
      who_caught_it: >-
        The Coordinator authoring PA-ECQ-f5af06-v2-triage-gate-sign, which recorded the amendment
        openly at DEC-20260824-5246b7 J5 with the amended instruction NAMED, and the orchestrating
