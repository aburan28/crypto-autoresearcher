coordinator_decision:
  id: DEC-20260824-b7557b
  decided_by: coordinator
  decided_at: '2026-08-24'
  goal_id: GOAL-ECQ-2298dc
  question_id: RQ-ECQ-e9b361
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, AS IN DEC-20260824-5246b7. No hypothesis record was ever minted under this
    goal. GOAL-ECQ-2298dc active_hypothesis_ids_note says so explicitly and gives the reason: the
    only dispatched experiment, EXP-ECQ-f5af06, certifies and falsifies an EXTERNAL claim and
    triages neighbouring objects, advancing no mechanism of this program's own. This decision moves
    no hypothesis, names none, and must not be read as having weakened or rejected one.
  batch_id: null
  batch_id_note: >-
    NULL AND IT STAYED NULL FOR THE WHOLE CAMPAIGN. No BATCH-* identifier was ever minted under
    GOAL-ECQ-2298dc. Both dispatches ran as single tasks directly under
    coordination/goals/GOAL-ECQ-2298dc/tasks/. The three-batch cap in campaign_budget was therefore
    never approached, which is one of the two reasons `closed_at_budget` would be a false status
    here (see status_choice).

  decision: pause
  decision_verb_note: >-
    THE TEMPLATE'S DECISION ENUM (templates/research-records.md, "Coordinator decision") HAS NO
    `block` VERB, so the verb recorded above is `pause`, which is the enum's terminal-hold value.
    THE DISTINCTION THIS RECORD ACTUALLY MAKES IS CARRIED BY THE GOAL STATUS, WHICH DOES HAVE ONE:
    `goal_status_set` below is `blocked`, not `paused`, and tools/validate_ledger.py GOAL_STATUSES
    admits both. A reader must take the status, not the verb, as the classification. This is
    recorded rather than papered over so that nobody later reconciles the two by softening the
    status to match the verb.
  goal_status_set: blocked

  target_ids:
  - GOAL-ECQ-2298dc
  - RQ-ECQ-e9b361
  - EXP-ECQ-f5af06
  target_ids_note: >-
    GOAL-ECQ-2298dc is the record this decision transitions. RQ-ECQ-e9b361 and EXP-ECQ-f5af06 are
    named because their state is reported on here, NOT because it is changed: the research question
    is not closed, and the experiment record is not moved, superseded or reinterpreted. No
    TASK-*, IDEA-*, PA-* or RUN-* identifier is a target -- each of those is cited, and citation is
    not transition.

  headline: >-
    THE OBJECTIVE WAS NOT MET. GOAL-ECQ-2298dc set out to exhibit an elliptic curve over Q of
    Mordell-Weil rank at least 32. NO SUCH CURVE WAS FOUND, and no curve exhibited or examined by
    this program in this campaign certified a Mordell-Weil rank lower bound over Q above 0. RANK
    >= 32 OVER Q REMAINS AN OPEN PROBLEM; the live record is 31 (ICARM curve no. 302, posted
    2026-08-23, attributed on the board to Claude, Levent Alpoge and Ava Howell) and nobody has
    exhibited 32. NOTHING IN THIS CAMPAIGN IS PARTIAL CREDIT TOWARD 32. The one rank this program
    certified, 31 on no. 302, is a CONFIRMATION OF SOMEONE ELSE'S RESULT on someone else's curve
    and is not this program's rank result in any sense; it was used as an external positive
    control on an instrument. C1 is UNMET. C2 is UNMET, and its stated route is additionally
    closed by a proven ceiling that a prior Coordinator framing got wrong (see E4).

  decision_scope: >-
    THIS DECISION DOES EXACTLY THREE THINGS. (1) It records the TERMINAL STATE of GOAL-ECQ-2298dc
    as `blocked` and replaces the goal's dangling `next_action`, which instructed a dispatch that
    has already been performed twice and reviewed once. (2) It records, for each of the six lanes
    this campaign opened or scoped, a NAMED OBSTRUCTION with a quantity rather than a budget
    complaint. (3) It records the orchestrating session's own errors, attributed to the
    orchestrating session. IT APPROVES NO EXPERIMENT, WRITES NO EVIDENCE RECORD, MOVES NO
    HYPOTHESIS, CLOSES NO MATHEMATICS, AND PROMOTES NOTHING INTO knowledge/ (see
    knowledge_promotion, which requests three entries it cannot itself mint). It asserts no
    ECDLP, speedup or asymptotic-complexity claim, so the four asymptotic promotion gates of
    agents/coordinator.md are not engaged.

  context: >-
    GOAL-ECQ-2298dc has been `active` since 2026-08-24 carrying a `next_action` that was completed
    before this decision was written: it instructed the commit of four records and then the
    dispatch of TASK-20260824-261bb4, both of which happened, after which TASK-20260824-02c3e4
    re-ran the experiment under an approved amendment. That is dangling state, and leaving an
    `active` goal pointing at a finished instruction is how a campaign silently accumulates a
    fictitious forward edge. WHAT THE CAMPAIGN ACTUALLY PRODUCED, ALL COMMITTED: EXP-ECQ-f5af06 v1
    (TASK-20260824-261bb4) and v2 (TASK-20260824-02c3e4, governed by the amendment
    PA-ECQ-f5af06-v2-triage-gate-sign and approved by DEC-20260824-5246b7); eight
    IDEA-20260824-* proposals against RQ-ECQ-e9b361 carrying the retrieved state of the art; and
    three committed input documents under coordination/goals/GOAL-ECQ-2298dc/inputs/. WHAT IT DID
    NOT PRODUCE: a curve, a family, a model, an evidence record, a validator report, a red-team
    report, or one unit of rank belonging to this program. The campaign consumed roughly 864.9 s
    of producer wall clock against a declared 10800 s (v1 23.8 s plus v2 841.1 s, both as reported
    by their producers under a convention the goal record itself discloses as UNDERSTATING true
    consumption because validator, red-team and archival sessions are unmeasured). Budget is not
    what stopped this campaign.

  status_choice:
    definitions_used: >-
      RECORDED BEFORE THE CHOICE SO THE CLASSIFICATION CAN BE CHECKED RATHER THAN TRUSTED.
      tools/validate_ledger.py GOAL_STATUSES admits draft, active, paused, blocked, completed,
      cancelled and closed_at_budget, and AGENTS.md states that `paused`, `blocked` and
      `closed_at_budget` all assert NO SUCCESS; beyond that the repository does not define
      `blocked` against `paused`, so this decision states the reading it applies. `paused` = the
      program chose to stop and can resume by choosing to; the binding constraint is internal
      (priority, budget, sequencing) and clears when the program decides it clears. `blocked` =
      the binding constraint is an EXTERNAL dependency that does not clear by spending this
      program's own budget, however much of it is spent; resumption waits on an event or an actor
      outside the program.
    chosen: blocked
    why: >-
      EVERY LANE THAT COULD STILL MOVE C1 IS GATED ON SOMETHING THIS PROGRAM CANNOT BUY WITH
      COMPUTE. The rank-17 elliptic K3 fibration that carries the published record ladder
      (28 = 17 + 11, 29 = 17 + 12) HAS NEVER BEEN PUBLISHED; its author offered the formulas on
      NMBRTHRY in May 2006 and did not post them, and they are absent from five named sources
      (L4). The best remaining explicit substitute, Kihara's rank-14 family over Q(t), is behind a
      paywall as an encrypted PDF and this program declined to circumvent the access control (see
      declined_action). No published model of generic rank >= 18 over Q(t) exists to substitute
      for either. The two lanes that need nothing external were both run to 100 percent coverage
      of their frozen regions and returned 0 (L1, L2). That is the shape of `blocked`, not of
      `paused`: there is no amount of this program's own budget whose expenditure changes the
      constraint.
    counter_consideration_recorded_because_it_cuts_the_other_way: >-
      ONE RESUME CONDITION IS INTERNAL AND IT IS RECORDED HERE RATHER THAN OMITTED.
      RESUME CONDITION R3 below -- funding the OSCAR step-0 lattice measurement -- is a decision
      this program can take on its own, which is an argument for `paused`. IT DOES NOT CARRY, FOR
      A REASON THAT IS NOT ABOUT
      COST: step 0 does not reach 32, and neither does the lane it belongs to, which tops out at
      generic rank 17 over Q(t) on COMPLETE SUCCESS (L6). Funding it would convert an unbounded
      cost into a number for a lane whose ceiling is already 15 below the objective. An internally
      available action that cannot move C1 does not make the constraint on C1 internal.
    why_not_paused: >-
      `paused` would assert that this program can resume C1 by choosing to. It cannot. Recording
      `paused` here would misdescribe an external dependency as a scheduling choice and would
      invite a later session to "un-pause" by dispatching another batch, which is precisely the
      action the six lane closures say is unavailable.
    why_not_closed_at_budget: >-
      FALSE ON THE NUMBERS AND IT MATTERS. `closed_at_budget` asserts the campaign budget ran out.
      It did not: roughly 864.9 s of 10800 s of producer wall clock was consumed, v2's own task
      spent 841.1 s of a 3600 s cap with no region truncated and no cap bound anywhere, and no
      BATCH-* identifier was ever minted against a cap of three. Every frozen region in both
      experiments was EXHAUSTED, not truncated. Using a budget status here would blame the wrong
      constraint and would let a later reader infer that more compute was the missing ingredient.
      It was not.
    why_not_completed_or_cancelled: >-
      `completed` is excluded by the goal's own closure_rule, which admits only C1, and C1 is
      unmet; recording it would be the single worst act available to this record. `cancelled`
      would assert the goal should not have been pursued, which this Coordinator does not find:
      the objective is legitimate, the search was run in good faith under AGENTS.md rule 9, and
      the campaign produced real negative measurements and a working certifier. The user's
      instruction also excluded both.
    pause_conditions_that_fired: >-
      NONE. THIS IS RECORDED EXPLICITLY BECAUSE IT IS A DEPARTURE. P1 (budget) did not fire; P2
      (archive verification) did not fire; P3 (model policy) did not fire; P4 (the instrument
      cannot certify independence at record scale) did not fire and in fact resolved in the
      AFFIRMATIVE -- part A certified 31 of 31, so the instrument is capable and 32 is not
      un-claimable for instrument reasons; P5 is declared not to be a pause at all. The terminal
      status therefore rests on grounds the goal's own pause_conditions did not enumerate, namely
      that every remaining lane is measured dead, gated on an external dependency, or has a
      deliverable ceiling below the objective. THAT IS A COORDINATOR JUDGEMENT AND IS RECORDED AS
      ONE rather than dressed as a pre-registered trigger that fired.

  what_this_campaign_did_not_achieve:
    stated_without_hedging: >-
      NO ELLIPTIC CURVE OVER Q OF MORDELL-WEIL RANK >= 32 WAS FOUND, EXHIBITED, CONSTRUCTED, OR
      APPROACHED. No curve first exhibited or newly examined by this program certified a rank
      lower bound over Q above 0. No family over Q(t) of any generic rank was obtained in verified
      explicit form. No evidence record was written under this goal and no independent validator
      or red-team review of either run set exists.
    the_one_number_that_must_not_be_misread: >-
      Part A certified rank >= 31 for ICARM curve no. 302, 31 of 31 witness points, F_2-rank 31
      over 45 good primes, re-verified by a checker that does not import the solver. THAT IS A
      CONFIRMATION OF AN EXTERNAL PARTY'S RESULT ON AN EXTERNAL PARTY'S CURVE. It is an external
      positive control on this program's instrument. It is not this program's rank result, it is
      not a step toward 32, and rank >= 31 over Q is CLAIMED, not unclaimed. Any artifact that
      reports it must say all of that in its own text.
    c1_status: >-
      UNMET. Not partially met. The goal's completion_criteria C1 remains `met: false` and this
      decision does not change it.
    c2_status: >-
      UNMET, AND ADDITIONALLY MIS-SPECIFIED IN ITS ROUTE. C2 asked for generic rank >= 19 over
      Q(t) as "the nearest genuinely reachable record". It was not reachable by the route the goal
      record named; see E4. C2 remains `met: false`, and meeting it would in any case not have
      been progress toward C1, as the goal's own is_not_a_substitute_for_c1 clause states.

  rationale:

  - id: R1-THE-DECISIVE-CLOSURE-DEPENDS-ON-NO-COST-ESTIMATE-AND-ON-NO-RUN
    statement: >-
      THE SINGLE FINDING THAT SETTLES THE CAMPAIGN IS L6: a successful recomputation of the
      unpublished rank-17 elliptic K3 fibration delivers GENERIC RANK 17 OVER Q(t), which is
      Elkies' 2006 starting line. Reaching 32 from there is 17 + 15, by exactly the specialisation
      sieve this campaign recorded as not plausible with its resources BEFORE any work, in the
      goal's own odds_assessment items (3) and (4). THE LANE DOES NOT REACH THE OBJECTIVE EVEN ON
      COMPLETE SUCCESS. That is a cleaner closure than "too expensive", it does not depend on any
      cost figure being right, and it does not depend on either run set being valid -- which
      matters, because neither run set has been validated by an independent agent or by this
      Coordinator (see limitations).
  - id: R2-THE-TWO-SELF-CONTAINED-LANES-WERE-RUN-TO-EXHAUSTION-AND-RETURNED-ZERO
    statement: >-
      L1 and L2 needed nothing external and were run to 100 percent coverage of their frozen
      regions: 95 899 629 / 95 899 629 candidates for a 32nd point on no. 302 with 0 hits, and
      1 167 027 / 1 167 027 reduced-box coverage on each of 400 gated neighbours at 100 percent
      triage coverage of 12 165 twist and 12 000 null candidates, maximum certified rank lower
      bound 0 in both arms. NO CAP BOUND ANYWHERE AND NOTHING TRUNCATED. These are exhausted
      measurements, not stopped ones, and their obstruction is a HEIGHT MISMATCH rather than a
      budget shortfall: the 31 known witness points of no. 302 have x-numerators of about 33
      decimal digits and the exhausted box reaches 8.
  - id: R3-THE-STRUCTURAL-ROUTE-IS-BLOCKED-BY-AVAILABILITY-NOT-BY-MATHEMATICS
    statement: >-
      The only structural route the idea set identifies to rank 32 over Q is a Q(t) family of
      generic rank >= 32, by specialisation. This program holds NO verified explicit high-rank
      family over Q(t) at all: the record-carrying rank-17 fibration is unpublished (L4); Kihara's
      rank 14 is paywalled and unread; Mestre's rank 14 citation was never retrieved; Nagao's rank
      13 has contradictory access status and is the paper whose exponents this program's retrieval
      tooling has already mangled twice; and Kloosterman's geometric rank 15 was MEASURED at
      arithmetic rank 0 over Q(t) and is dead as a vehicle (L5). The blocking quantity is
      availability of an object, and no amount of this program's compute produces it.
  - id: R4-THE-MATHEMATICS-IS-NOT-CLOSED-AND-THIS-RECORD-DOES-NOT-CLOSE-IT
    statement: >-
      THIS IS A STATEMENT ABOUT WHAT THIS PROGRAM CAN REACH, NOT ABOUT WHAT EXISTS. Nothing here
      is evidence that no elliptic curve over Q of rank >= 32 exists, that none is findable, or
      that the target is saturated. The record ladder moved +2 in three days on 2026-08-20 and
      2026-08-23 after moving +1 in eighteen years, which is the signature of an active effort
      holding the frontier, and the goal record says so. Premature closure is a failure mode
      symmetric with overclaiming (docs/inventor-protocol.md), so each lane below carries a NAMED
      OBSTRUCTION with a quantity and each carries forward guidance; none carries a fatigue count.
      `blocked` is not `reject_scoped` and asserts nothing about the mathematics.
  - id: R5-THE-CAMPAIGN-PRODUCED-ONE-DURABLE-CAPABILITY-AND-IT-IS-NOT-A-RANK
    statement: >-
      RECORDED SO IT IS NOT LOST AND EQUALLY SO IT IS NOT INFLATED. This program certified the
      joint independence of 31 points, in exact integer and Fraction arithmetic with no floating
      point anywhere in the decision, on a curve of naive height 468.2771 and log|disc| 453.0469,
      in 4.2 s, and re-verified the certificate in 1.9 s with a checker that re-derives the group
      law, the point counts, the torsion bound, the mod-l coordinatisation and the F_l-rank
      WITHOUT IMPORTING THE SOLVER. That resolves pause condition P4 in the affirmative: the
      instrument is not the limiting factor. AN INSTRUMENT THAT COULD CERTIFY 32 POINTS IS NOT A
      CURVE OF RANK 32, and this paragraph is not progress toward C1.
  - id: R6-THE-ONE-HUMAN-ACTION-IS-NOT-A-ROUTE-TO-32-EITHER-AND-MUST-NOT-BE-SOLD-AS-ONE
    statement: >-
      The highest-value remaining action, obtaining the rank-17 model from its author, is a human
      action this program cannot take, and a draft request is committed and unsent at
      coordination/goals/GOAL-ECQ-2298dc/inputs/DRAFT-elkies-request.md. STATED PLAINLY SO THAT
      `blocked` CANNOT BE READ AS "ONE EMAIL AWAY FROM 32": obtaining that model yields generic
      rank 17 over Q(t). It REOPENS A LANE. It does not reach C1, and the 15 remaining units of
      rank would still have to come from the specialisation sieve this campaign already recorded
      as not plausible with its resources.

  lane_closures:
    preamble: >-
      SIX LANES, EACH WITH A NAMED OBSTRUCTION EXPRESSED AS A QUANTITY. None of these is
      "insufficient budget"; where budget was the proximate limit it is stated as such and marked
      NOT the closure ground. Each records the basis of its number, including where that basis is
      an orchestrating-session computation with NO COMMITTED RUN RECORD, which is a real weakness
      and is not hidden.
    items:

    - id: L1
      lane: A 32nd independent point on ICARM curve no. 302
      obstruction: >-
        HEIGHT MISMATCH BETWEEN THE SEARCHABLE BOX AND THE CURVE'S OWN GENERATORS. The 31 known
        witness points have x-numerators of about 33 decimal digits. The frozen v2 box reaches 8
        (v1 reached 7). Closing roughly 25 decimal orders of magnitude in the x-numerator by
        enumeration is not a budget question at any budget this class of enumeration admits.
      quantity: >-
        Rank-increasing hits found, over the exhausted frozen box, together with the decimal-digit
        gap between the box's x-numerator bound and the known generators' x-numerators.
      value: >-
        0 hits at 95 899 629 / 95 899 629 = 100 percent coverage (v2), and 0 hits at
        2 347 563 / 2 347 563 (v1, over a box the v2 box strictly contains). Digit gap: 8 searched
        against about 33 exhibited, a shortfall of about 25 decimal digits. Counts are exact
        integers; there are no error bars on an exhausted enumeration.
      scope: >-
        One curve, ICARM no. 302, in its cited model; one frozen box, x = u / w^2 in lowest terms
        with w in [1, 100], gcd(u, w) = 1, |u| <= 30 000 000 for w = 1 and |u| <= 300 000
        otherwise; exact stdlib integer and Fraction arithmetic; one machine, one worker.
      basis: >-
        Committed run records RUN-ECQ-f5af06-v2-B-extension and RUN-ECQ-f5af06-B-extension under
        experiments/EXP-ECQ-f5af06/runs/, as reported in
        coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4/report.md section 4.
      what_a_miss_licenses_and_nothing_more: >-
        No point of E(Q) was found within the frozen box. A miss is consistent with the board's
        "rank exactly 31" reading AND EQUALLY CONSISTENT WITH THE BOX BEING FAR TOO SMALL, and
        cannot distinguish the two.
      remaining_open: >-
        Whether no. 302 has rank exactly 31 is untouched by this campaign and is not claimed
        either way.

    - id: L2
      lane: The quadratic-twist and near-neighbour neighbourhood of no. 302, |D| <= 10000
      obstruction: >-
        THE SAME HEIGHT MISMATCH ONE LEVEL DOWN, PLUS THE FACT THAT RANK IS NOT TWIST-INVARIANT SO
        NOTHING IS INHERITED. The reduced gate box reaches 6-digit numerators while the gated
        curves carry naive heights (of the stated model) of 508.5 to 531.8 in the twist arm and
        476.6 in the null arm.
      quantity: >-
        Maximum certified Mordell-Weil rank lower bound over Q attained by any gated candidate,
        at stated triage and box coverage.
      value: >-
        0 in BOTH arms, at 12 165 / 12 165 and 12 000 / 12 000 triage coverage, 200 / 200 gated
        per arm, and 1 167 027 / 1 167 027 reduced-box coverage on every one of the 400 gated
        curves. Exact integer; no error bars. Certificate kind `none` on every row -- part C
        produced no certificate because there was nothing to certify.
      scope: >-
        Squarefree twisting discriminants 2 <= |D| <= 10000 plus D = -1, and additive
        perturbations a6 -> a6 + v with 1 <= |v| <= 6000, of one curve; Mestre-Nagao triage to
        p <= 500 under the CORRECTED (v2) gate direction; one frozen reduced box; exact integer
        and Fraction arithmetic; one machine.
      basis: >-
        Committed run record RUN-ECQ-f5af06-v2-C-twists, report.md section 5, under the amendment
        PA-ECQ-f5af06-v2-triage-gate-sign approved by DEC-20260824-5246b7.
      v1_result_is_re_scoped_not_repaired: >-
        v1's C-NULL stands as recorded and is UNINFORMATIVE ABOUT THE NEIGHBOURHOOD, because v1's
        gate was sign-inverted and examined the twenty candidates each arm's own score ranked as
        LEAST promising. It may never be cited as evidence that the neighbourhood is barren.
        DEC-20260824-5246b7 already recorded this and this decision does not weaken it.
      unexpected_observation_recorded_not_discarded: >-
        The pre-registered between-arm test on the disjoint v2-only subset returned z = -2.4868
        and common-language effect size 0.4907, failing BOTH frozen conditions (|z| >= 3.0 and
        effect size outside [0.45, 0.55]) and therefore NOT NOTABLE. The descriptive v1 subset
        carries the OPPOSITE SIGN, z = +3.2447 and effect size 0.5895. The reversal is reported as
        measured; no conclusion is drawn from it here, and the score certifies nothing in either
        direction. AGENTS.md rule 8 requires it be recorded rather than dropped.
      remaining_open: >-
        The neighbourhood beyond |D| = 10000, and any gate at a box depth matching the gated
        curves' actual heights, are untested. This lane is closed on its measured obstruction over
        its stated scope and nowhere wider.

    - id: L3
      lane: Identify the base family from the record curves themselves (forensics)
      obstruction: >-
        THE DISCRIMINATING STATISTIC REQUIRES THE OBJECT THAT IS MISSING. Deciding whether the
        ladder rungs are specialisations of one fibration is decidable only against that
        fibration's j-map, and the j-map is unpublished (L4). The two statistics computable
        without it do not separate the hypotheses: DISTINCT j-INVARIANTS ARE EXPECTED for distinct
        specialisations of one fibration, so a negative pairwise quadratic-twist test refutes only
        the degenerate case and MUST NOT be reported as refuting a common family; and shared
        small-prime divisibility in the discriminants is produced equally by a common fibration
        (bad fibres over fixed t) and by sieve selection bias (a sieve selects curves with many
        points modulo small primes).
      quantity: >-
        Number of statistics computable from the record curves alone that separate "common
        fibration" from "search bias".
      value: >-
        0 of the 2 attempted. Measured inputs: log|disc| 381.2024 / 432.1249 / 453.0469 and naive
        heights 393.6297 / 442.0854 / 468.2771 for rank-28, no. 273 and no. 302 respectively, j
        non-integral in all three; pairwise quadratic-twist test NEGATIVE on all three pairs;
        shared small-prime multiplicities (rank28 / 273 / 302) p=2 -> 15/16/15, p=3 -> 6/12/4,
        p=5 -> 6/8/4, p=7 -> 4/5/6, p=13 -> 4/5/5.
      scope: >-
        Three curves: the verified rank-28 curve, ICARM no. 273 (rank >= 30) and ICARM no. 302
        (rank >= 31). No. 273's a-invariants were retrieved through the same summarising fetch
        tool and its listed conductor was NOT independently checked.
      basis: >-
        coordination/goals/GOAL-ECQ-2298dc/inputs/RETRIEVAL-elkies-rank17.md, addendum
        "forensics attempted WITHOUT the fibration".
      basis_limitation: >-
        AN ORCHESTRATING-SESSION COMPUTATION WITH NO COMMITTED RUN RECORD. It is not an evidence
        record, no run manifest backs it, and it has not been independently reproduced. Cited with
        that limitation.
      remaining_open: >-
        The inverted problem -- reconstructing the fibration from several known specialisations --
        is over-determined in principle and remains open. It was worth trying and the discriminating
        statistic still requires the object this program does not have.

    - id: L4
      lane: Retrieve the base family from the literature
      obstruction: >-
        IT WAS NEVER PUBLISHED. On NMBRTHRY in May 2006, in "Z^28 in E(Q), etc.", Elkies wrote
        that he would post formulas for E, its 18 independent points and a 19th point on
        infinitely many specialisations "after I have streamlined the formulas, which as I have
        them look needlessly complicated". He deferred them and, on two independent signs, never
        followed through: his own 2007 lecture notes still print no model, and Dujella -- the
        field's record-keeper -- cites G(0) >= 18, Elkies (2006) only to the listserv post plus
        "Personal communication, 2006, 2009". THIS IS AN AVAILABILITY OBSTRUCTION AND IT IS
        EXACTLY THE KIND THIS PROGRAM'S BUDGET CANNOT CLEAR.
      quantity: >-
        Number of published or archived sources, among those checked, carrying an explicit
        Weierstrass model of the rank-17 elliptic K3 fibration over Q(t).
      value: >-
        0 of 5 named sources checked. (i) arXiv:0709.2908 treats the surface in a single paragraph
        and prints no model; what it does print is the genus-2 Shimura curve
        u^2 = 16t^6 - 19t^4 + 88t^2 - 48 for N = 6*79, which is the moduli parametrisation, not
        the elliptic surface, and will not specialise. (ii) Not on Elkies' Harvard pages
        (/~elkies/, math.html, compnt.html enumerated; rk28_1.html returns HTTP 404 and the
        Wayback availability API returns no snapshot at either hostname). (iii) Not in
        Elkies-Klagsbrun ANTS-XIV, arXiv:2003.00077, which is about torsion records and contains
        no K3 surface. (iv) Dujella's tables cite only the listserv post and personal
        communication. (v) LMFDB cannot hold it -- it carries curves over Q, not surfaces over
        Q(t).
      scope: >-
        The five sources above, checked 2026-08-24 by a retrieval task of the orchestrating
        session. Absence of a search result is not evidence that something does not exist
        (AGENTS.md, knowledge retrieval policy); this is a bounded negative over a named set.
      basis: >-
        coordination/goals/GOAL-ECQ-2298dc/inputs/RETRIEVAL-elkies-rank17.md.
      basis_limitation: >-
        Retrieval was performed through a tool documented IN THAT SAME FILE as silently dropping
        exponents (two reads of one Nagao paper gave 9T + 211950 against 9T^6 + 211950, and
        396150T against 396150T^2). The absence findings are robust to that hazard in a way
        coefficient strings are not, but the file is an input document, not an evidence record,
        and no run record backs it.
      remaining_open: >-
        The formulas existed in 2006 and Dujella's "personal communication" citations are direct
        evidence that their author shares them on request. Asking is the open action; see R1 of
        resume_conditions.

    - id: L5
      lane: Substitute a published surface of high GEOMETRIC rank
      obstruction: >-
        GALOIS DESCENT, MEASURED. Geometric Mordell-Weil rank over Qbar(t) does not descend to
        Q(t), and the gap is not small -- it is total on the one explicit high-rank model this
        program successfully retrieved. Shioda's rank-68 surface is the same phenomenon at the
        extreme: its Mordell-Weil group is defined over a field of degree 829 440. THIS IS WHY
        "FIND A SURFACE OF HIGH GEOMETRIC RANK" IS NOT A ROUTE TO 32.
      quantity: >-
        Arithmetic Mordell-Weil rank over Q(t), bounded ABOVE by the minimum specialisation rank
        (Silverman gives rank E_t(Q) >= rank E(Q(t)) for all but finitely many t), against the
        stated geometric rank.
      value: >-
        Geometric 15, arithmetic 0. Over 31 specialisations (t integral 1..25 plus 1/2, 3/2, 1/3,
        2/3, 5/2, 1/5, denominators cleared by (x,y) -> (u^2 x, u^3 y)) the certified rank lower
        bounds ranged 0 to 2 with MINIMUM 0, several t giving exactly 0 (t = 8, 11, 13). Units:
        Mordell-Weil rank. The 0 is an upper bound on the generic rank read off a 31-point sample,
        not a proof of generic rank 0.
      scope: >-
        One surface, Kloosterman arXiv:math/0502439 Thm 1.2,
        y^2 = x^3 + 2(t^8 + 14t^4 + 1)x + 4t^2(t^8 + 6t^4 + 1), as transcribed; 31 specialisations
        as listed.
      basis: >-
        coordination/goals/GOAL-ECQ-2298dc/inputs/RETRIEVAL-elkies-rank17.md, addendum 2.
      basis_limitation: >-
        TWO DECLARED WEAKNESSES, BOTH LOAD-BEARING. (i) The model was transcribed through the
        exponent-dropping retrieval tool and the file itself states the measurement is conditional
        on the model being as transcribed and SHOULD BE RE-RUN AGAINST A VERIFIED PDF BEFORE IT IS
        CITED. (ii) There is NO COMMITTED RUN RECORD for the 31 specialisations. This lane is
        therefore closed on a measurement of declared limited basis, and that is stated rather
        than smoothed over.
      remaining_open: >-
        Whether the descent gap is generic or particular to this surface is not established by one
        family. The obstruction's reversal is the live item; see obstruction.resource_check.

    - id: L6
      lane: Recompute the K3 from the public Shimura-curve datum
      decisive: true
      obstruction: >-
        THE LANE'S CEILING IS BELOW THE OBJECTIVE. A COMPLETE SUCCESS DELIVERS GENERIC RANK 17
        OVER Q(t) -- Elkies' 2006 starting line -- AND 17 IS NOT 32. Reaching 32 from there is
        17 + 15 by specialisation sieve, which this campaign recorded as not plausible with its
        resources before any work began. This closure DOES NOT DEPEND ON ANY COST ESTIMATE BEING
        RIGHT, which is why it is the decisive one. Three further independent obstructions sit on
        the same lane: (a) the published construction runs FAMILY -> SHIMURA CURVE, not point ->
        family (arXiv:0802.1301 is titled "Shimura curve computations via K3 surfaces of
        Neron-Severi rank at least 19": the K3s are the INSTRUMENT and the curve equations are the
        PRODUCT), so there is no published map in the proposed direction; (b) every published D=6
        family (Besser-Livne, Baba-Granath) is LEVEL 1 while the target needs level 79, and
        X_0^6(79) has genus 13 with its degree-80 cover of X(6), its universal family and the map
        all unpublished; (c) nothing public implements step 1, "lattice data -> explicit
        Weierstrass family over a one-dimensional moduli curve" (Elkies' p-adic-Newton plus LLL
        moduli deformation), whose cost is p^d in an UNMEASURED free-parameter count d and which
        would have to be written from a 2007 lecture-note sketch.
      quantity: >-
        Generic Mordell-Weil rank over Q(t) delivered by the lane on COMPLETE SUCCESS, against the
        objective's threshold of 32.
      value: >-
        17, a deficit of 15 units of Mordell-Weil rank. The 17 is not a measurement with error
        bars; it is the rank of the surface the lane reconstructs, read from the published ladder
        arithmetic 28 = 17 + 11 and 29 = 17 + 12 as recorded in the retrieval and scoping inputs.
        Its uncertainty is entirely in that input, and a reader who doubts the 17 should doubt the
        deficit by the same amount.
      scope: >-
        The recomputation lane as scoped on 2026-08-24 against the public datum: the non-CM orbit
        at |t| = 14/13 on u^2 = 16t^6 - 19t^4 + 88t^2 - 48, via 2-neighbour methods, with OSCAR
        supplying steps 0, 2 and 3.
      basis: >-
        coordination/goals/GOAL-ECQ-2298dc/inputs/SCOPING-recomputation-lane.md.
      basis_limitation: >-
        An orchestrating-session scoping document, not an evidence record; no run record backs it.
        The one arithmetic check it does carry was performed exactly and is reproducible: at
        t = 14/13 the right-hand side is 258052096 / 4826809 with 258052096 = 16064^2 exactly and
        16064 = 2^6 * 251, so u = 2^6 * 251 / 13^3, matching the paper's stated orbit; at t = 2
        the right-hand side is 1024 = 32^2. A dropped exponent would destroy the perfect-square
        property and the stated factorisation simultaneously.
      tooling_finding_recorded_because_it_is_reusable: >-
        OSCAR (Julia, open source, no licence) ships elliptic_surface, kodaira_neron_model,
        trivial_lattice, mordell_weil_sublattice, two_neighbor_step and elliptic_parameter, plus
        Hecke's primitive_embeddings for Kneser-Nishiyama enumeration, so steps 0, 2 and 3 fit on
        this hardware in hours to days. THE GAP IS THAT OSCAR REQUIRES THE GENERIC FIBRE AND THE
        MORDELL-WEIL GENERATORS AS INPUT: it is a verification and transformation tool, not a
        discovery tool.
      remaining_open: >-
        The mathematics of the recomputation is not declared closed. What is closed is its
        RELEVANCE TO C1, by the ceiling above.

  declined_action:
    what: >-
      Kihara, "On an elliptic curve over Q(t) of rank >= 14", Proc. Japan Acad. Ser. A 77 (2001)
      50-51, DOI 10.3792/pjaa.77.50 -- the best remaining explicit substitute family -- is
      PAYWALLED. The Project Euclid .full page shows title, author and abstract then login and
      subscription prompts, verbatim that access "requires either an institutional subscription or
      individual purchase". The direct download endpoint returns a PDF encrypted with the Standard
      security handler (/Encrypt present, /Filter /Standard); its 32 FlateDecode streams
      decompress to nothing without the decryption key.
    decision_taken: >-
      THIS PROGRAM DID NOT ATTEMPT TO DECRYPT IT AND DELETED THE CACHED COPY. The paper is
      paywalled copyrighted work and circumventing an access control to read it is not something
      this program will do to complete a task; whether an empty-password trick would have
      succeeded technically is beside the point.
    recorded_as: >-
      A DELIBERATE CHOICE, NOT A FAILURE, AND NOT A CAPABILITY GAP. It is recorded here so that no
      later reader treats it as an unexplored option or as an error to be corrected. The
      consequence -- the substitute lane is blocked BY ACCESS, NOT BY MATHEMATICS -- is real and
      is carried in the resume conditions: a library subscription clears it, and that is a human
      action too.
    and_it_would_not_have_been_enough_anyway: >-
      A clean rank-14 family sits 18 rungs below rank 32 and four below the Q(t) record. Reading
      Kihara would have exercised the pipeline; it would not have moved C1.

  orchestrating_session_errors:
