        `not_established_with_reason` with only p = 2 implicated, which is expected from the
        standard integral model, and NO ARTIFACT MAY SAY THE PARTIAL SCREEN DISCHARGES CLAUSE (1).

    - id: E4
      error: >-
        THE GOAL RECORD CLAIMED GENERIC RANK >= 19 OVER Q(t) WAS "THE NEAREST GENUINELY REACHABLE
        RECORD" AND MADE IT CRITERION C2. IT IS UNREACHABLE VIA ELLIPTIC K3 SURFACES BY A PROVEN
