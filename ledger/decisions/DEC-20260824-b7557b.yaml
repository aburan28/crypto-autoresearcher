  obstruction:
    statement: >-
      No route available to this program reaches Mordell-Weil rank 32 over Q, and the shortfall is
      a property of the ROUTES' CEILINGS AND AVAILABILITY, not of how long they were run. The two
      routes that need nothing external were exhausted and returned certified rank 0; the routes
      that could in principle carry 32 all pass through an explicit high-rank family over Q(t)
      that is either unpublished, paywalled, or measured dead on descent.
    quantity: >-
      Rank deficit against the objective of the best route available to this program, defined as
      the maximum over the six enumerated lanes of (Mordell-Weil rank the lane delivers on
      COMPLETE SUCCESS) minus 32.
    value: >-
      -15 units of Mordell-Weil rank. The maximum over the six lanes is L6, which delivers generic
      rank 17 over Q(t) on complete success: 17 - 32 = -15. Every other lane is worse: L1 and L2
      delivered a certified rank lower bound of 0 over Q at 100 percent coverage of every frozen
      region (deficit -32, exact, no error bars on an exhausted enumeration); L5 measured
      arithmetic rank 0 over Q(t) against geometric 15 (deficit -32, bounded above by the minimum
      of a 31-point specialisation sample); L3 and L4 deliver no model at all and so no rank. NO
      LANE DELIVERS A NON-NEGATIVE DEFICIT. Error bars: the -32 entries are exact integers; the
      -15 entry carries no statistical error and inherits its uncertainty entirely from the value
      17, which is read from the committed retrieval and scoping inputs rather than measured here.
    measured_by:
    - EXP-ECQ-f5af06
    - RUN-ECQ-f5af06-v2-B-extension
    - RUN-ECQ-f5af06-v2-C-twists
    - RUN-ECQ-f5af06-B-extension
    - RUN-ECQ-f5af06-C-twists
    measured_by_limitation: >-
      THE RUN IDS ABOVE MEASURE THE L1 AND L2 COMPONENTS ONLY. The L5 component is read from an
      orchestrating-session computation with NO COMMITTED RUN RECORD, on a model transcribed
      through a tool documented to drop exponents. The L3, L4 and L6 components are read from the
      two committed input documents at coordination/goals/GOAL-ECQ-2298dc/inputs/, which are
      inputs and not evidence records and which no run backs. Additionally, NO RUN SET UNDER THIS
      GOAL HAS BEEN VALIDATED -- not by an independent validator, not by a red team, and not by
      this Coordinator, which has not performed the run-validity verification (expected run count,
      schema-complete manifests, seed integrity, raw-versus-summary agreement, control
      comparability). Every run figure here is the producer's reported value. THE DECISIVE
      COMPONENT, L6's ceiling of 17, DEPENDS ON NO RUN AT ALL, which is why the terminal status
      does not rest on the unvalidated figures.
    scope: >-
      The six lanes enumerated in lane_closures, as available to this program on 2026-08-24, at
      the parameters each lane's own entry states: one curve (ICARM no. 302) and one frozen
      x-coordinate box reaching 8-digit numerators; squarefree |D| <= 10000 and |v| <= 6000
      neighbourhoods with a reduced box reaching 6-digit numerators on 400 gated curves; three
      record curves for the forensics; five named literature sources; one transcribed surface at
      31 specialisations; and one recomputation lane scoped against the public Shimura-curve
      datum. CLAIMED NOWHERE ELSE. This is not a statement about what other programs, other
      budgets, or other methods can reach, and it is not a statement that a rank-32 curve does not
      exist.
    resource_check:
      examined: true
      reading: >-
        ONE OF THE SIX OBSTRUCTIONS REVERSES INTO A HYPOTHESIS AND IT IS L5's. Geometric rank 15
        with arithmetic rank 0 is not a nuisance result: it identifies that THE WRONG OBJECT WAS
        BEING TRACKED. NS(X_Qbar) as an ABSTRACT LATTICE discards the Galois action, which is
        exactly the datum arithmetic rank depends on; the correct object is NS(X_Qbar) AS A GALOIS
        MODULE. Under that reading the Shimura curve stops looking incidental: with R = 0,
        NS = U + MWL, and rank 17 over Q(t) requires Galois to act trivially on the whole rank-19
        lattice, and a rational non-CM point on X(6,79)/<w_474> is what buys that triviality. THE
        SHIMURA CURVE IS THE DESCENT BOOKKEEPING. That is the theory which takes this measurement
        as its hypothesis rather than its refutation, and it is a reusable statement rather than a
        rationalisation. The other five obstructions were examined and none reverses: an
        availability gap (L4), a missing discriminating statistic (L3), two height mismatches on
        exhausted boxes (L1, L2) and a lane ceiling (L6) are assets to no theory this Coordinator
        can name.
      spawned_ids: []
      spawned_ids_note: >-
        EMPTY, AND THE REASON IS RECORDED RATHER THAN LEFT TO INFERENCE. No IDEA-* or H-* record
        was minted from the reversal, because minting a proposal record under a goal that is going
        terminal would create a live lane with no batch, no budget and no dispatch behind it, and
        because this Coordinator holds no shell and cannot allocate an identifier with
        tools/allocate_id.py. The reversal is instead routed to the corpus as a REQUESTED KN-OPEN
        entry under knowledge_promotion.requested_entries, where it stays visible to
        tools/obstruction_registry.py and to every campaign rather than to this one alone. If the
        entry is not created, the reversal is recorded only here and that is a weaker outcome.

  resume_conditions:
    preamble: >-
      CONCRETE AND CHECKABLE. Each names an event or action a later reader can verify happened,
      not an aspiration. EACH ALSO STATES WHAT IT DOES AND DOES NOT REACH, because a resume
      condition that quietly implies C1 becomes reachable would reintroduce the partial credit
      this record refuses.
    items:
    - id: R1
      condition: >-
        THE EXPLICIT WEIERSTRASS MODEL OF THE RANK-17 ELLIPTIC K3 FIBRATION OVER Q(t) IS OBTAINED
        FROM ITS AUTHOR, together with the Mordell-Weil generators if they exist in usable form.
      how_it_is_checked: >-
        A reply exists, and the model satisfies the transcription-identity protocol: the author's
        own generators must satisfy the transcribed model IDENTICALLY in exact arithmetic. A model
        arriving without generators is transcribable only at the risk this program has already
        measured twice.
      what_must_happen_first: >-
        A HUMAN MUST REVIEW AND SEND coordination/goals/GOAL-ECQ-2298dc/inputs/DRAFT-elkies-request.md
        FROM A REAL ADDRESS. It is drafted and UNSENT. Its own notes bind whoever sends it: replace
        the signature block with a real person, keep the disclosure that an AI system drafted it,
        and do not overstate what this program has done -- the rank >= 31 certification confirms
        his community's result and is not this program's.
      what_it_reaches: >-
        GENERIC RANK 17 OVER Q(t). IT REOPENS A LANE AND DOES NOT REACH C1. The remaining 15 units
        would still have to come from the specialisation sieve this campaign recorded as not
        plausible with its resources.
      what_a_refusal_means: >-
        A decline or no reply is a COMPLETE ANSWER and closes the lane cleanly. It is explicitly
        NOT a reason to attempt the model's reconstruction, which L6 establishes would yield only
        rank 17 and so would not reach the objective even on complete success.
    - id: R2
      condition: >-
        A PUBLISHED MODEL OF GENERIC RANK >= 18 OVER Q(t) APPEARS, in explicit Weierstrass form
        with generators, from any author.
      how_it_is_checked: >-
        The model and its generators are obtained and pass the transcription-identity protocol in
        this repository, and its Shioda-Tate ceiling and fibre census are reproduced from the
        family's own discriminant. Note the standing state: the publicly available ceiling for an
        EXPLICIT family is 14 (Mestre or Kihara); every rung from 15 to 18 is Elkies' and none of
        those models is published.
      what_it_reaches: >-
        It reopens the structural route and would let this program hold a verified high-rank
        family for the first time. IT DOES NOT REACH C1 EITHER: 18 is fourteen short of 32.
      a_note_on_access: >-
        The same condition is met, weakly, by institutional access to Kihara 2001 -- which would
        deliver rank 14, four below the Q(t) record and eighteen below the objective. Recorded
        because it is the cheapest of the three and the clearest about how little it buys.
    - id: R3
      condition: >-
        A DECISION IS TAKEN TO FUND THE OSCAR STEP-0 LATTICE MEASUREMENT.
      how_it_is_checked: >-
        A committed Coordinator decision approves it with a budget, and the run REPORTS THE
        FREE-PARAMETER COUNT d, which converts step 1's cost of p^d from an unbounded quantity
        into a number. That number is the thing this program does not currently have and it is
        the only one of the three conditions that is internal to the program.
      what_it_reaches: >-
        NOTHING ON C1. STEP 0 DOES NOT REACH 32 AND NEITHER DOES THE LANE IT BELONGS TO, WHICH
        TOPS OUT AT 17. Its entire value is turning an unbounded cost into a measured one, which
        would let a future decision be taken on a number rather than on an estimate. It is
        recorded as a resume condition for the LANE, not for the objective, and it must never be
        cited as progress toward C1.

