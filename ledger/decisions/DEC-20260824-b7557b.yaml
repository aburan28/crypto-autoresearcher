      validated evidence record is written for EXP-ECQ-f5af06.
    requested_entries:
      instruction: >-
        THREE ENTRIES ARE WARRANTED. Mint each id with `python3 tools/allocate_id.py --next
        <type>` and confirm with `--check` before authoring, write the entry under the
        /curate-knowledge conventions, regenerate knowledge/INDEX.md, and include all of it in ONE
        ledger archive commit together with a SUPERSEDING coordinator_decision that fills its own
        knowledge_promotion.promoted with the minted ids. DO NOT EDIT THIS RECORD -- it is
        immutable once committed, and a correction supersedes rather than overwrites.
      items:
      - requested_type: KN-TECH
        working_title: >-
          Transcription-identity protocol: require a paper's own generators to satisfy the
          transcribed model identically
      - requested_type: KN-TECH
        working_title: >-
          Exact-arithmetic certification of joint independence of high-rank point sets at record
          scale, with solver-independent re-verification
      - requested_type: KN-OPEN
        working_title: >-
          The Neron-Severi lattice as a GALOIS MODULE is the object arithmetic Mordell-Weil rank
          depends on; is the Shimura-curve rational point the general descent bookkeeping?
      details:
      - id: REQ-1
        requested_type: KN-TECH
        content: >-
          THE PROTOCOL, VERBATIM AS IT WAS STATED: "Require that the paper's own generators
          satisfy the transcribed model identically. A single dropped exponent breaks the identity
          with probability essentially 1." THE HAZARD IT ANSWERS IS REAL AND MEASURED IN THIS
          PROGRAM: the retrieval tooling silently drops exponents, demonstrated on two reads of
          one Nagao paper giving 9T + 211950 against 9T^6 + 211950 and 396150T against 396150T^2.
          THE PROTOCOL ALSO YIELDS A SELECTION CRITERION THIS PROGRAM DID NOT HAVE: a paper
          printing model AND generators is safely transcribable; a paper printing model only is
          not.
        why_promotable: >-
          It is a method, not a result; it is this program's own; it is cheap, general, and it
          converts a fabrication hazard under core rule 5 into a mechanical check. It generalises
          well beyond elliptic curves to any transcribed algebraic object with published
          witnesses.
        evidential_basis_stated_honestly: >-
          THREE INSTANCES, OF WHICH ONE IS RUN-BACKED AND TWO ARE NOT. Run-backed: ICARM no. 302
          via all 31 witness points, CTL-CITED-INPUT-AGREEMENT PASS with on_curve_failures empty,
          in RUN-ECQ-f5af06-v2-A-certify. Not run-backed, orchestrating-session checks with no
          committed run record: the rank-28 curve via its listed point P1, and the Shimura curve
          via its listed orbit at t = 14/13 and t = 2. The entry must state that split; a
          technique note claiming three run-backed instances would be false.
      - id: REQ-2
        requested_type: KN-TECH
        content: >-
          A certifier that decides joint independence of a large exhibited point set on an
          elliptic curve over Q in EXACT integer and Fraction arithmetic with NO FLOATING POINT
          ANYWHERE IN THE DECISION, via the F_l-rank of the reduction map over many good primes
          with a torsion bound, together with a SEPARATE re-verifier that re-derives the group
          law, the point counts, the torsion bound, the mod-l coordinatisation and the F_l-rank
          FROM SCRATCH WITHOUT IMPORTING THE SOLVER. Measured at record scale: 31 points on a
          curve of naive height 468.2771 and log|disc| 453.0469, F_2-rank 31 over 45 good primes,
          torsion bound 1, in 4.2 s, re-verified in 1.9 s. Recorded search bounds: max_prime 1500,
          torsion_primes 8, l in (2,3,5,7,11,13), max_good_primes 250; the binding bound is
          max_good_primes, since the certifier's default of 60 returned only 27 of 31 in 1.8 s.
        why_promotable: >-
          It is this program's own, it is backed by committed runs in TWO independent run sets
          (v1 and v2), the solver-independent re-verification is the part that makes it worth
          recording rather than reimplementing, and it resolves goal pause condition P4 in the
          affirmative: the instrument is not the limiting factor at record scale.
        what_the_entry_must_not_say: >-
          IT MUST NOT PRESENT THE RANK 31 AS THIS PROGRAM'S RESULT, AND MUST NOT PRESENT THE
          CAPABILITY AS PROGRESS TOWARD RANK 32. An instrument that can certify 32 points is not
          a curve of rank 32. It must also state that the run sets behind it are UNVALIDATED --
          no validator or red-team pass exists -- so the entry is a capability note pending
          independent verification, not a verified benchmark.
      - id: REQ-3
        requested_type: KN-OPEN
        content: >-
          THE CRYSTALLIZED UNKNOWN, WHICH IS THE resource_check READING OF THE L5 OBSTRUCTION.
          Geometric Mordell-Weil rank 15 with arithmetic rank over Q(t) measured at 0 says the
          wrong object was being tracked: NS(X_Qbar) as an ABSTRACT LATTICE discards the Galois
          action, and the correct object is NS(X_Qbar) AS A GALOIS MODULE. The open question is
          whether the Shimura curve is the GENERAL descent bookkeeping rather than an incidental
          feature of one construction: with R = 0 and NS = U + MWL, generic rank 17 over Q(t)
          requires Galois to act trivially on the whole rank-19 lattice, and a rational non-CM
          point on X(6,79)/<w_474> is what buys that triviality. Does that pattern -- rational
          point on a moduli curve as the mechanism forcing trivial Galois action on the full
          Neron-Severi lattice -- generalise, and does it identify which surface classes admit
          high ARITHMETIC rank rather than merely high geometric rank?
        why_kn_open_and_not_kn_find: >-
          BECAUSE IT IS NOT A FINDING. It is a reframing whose only supporting measurement is
          doubly caveated -- a model transcribed through the exponent-dropping tool, and 31
          specialisations with NO COMMITTED RUN RECORD. Promoting it as an internal finding would
          put an unverified claim into the corpus under the authority of a finding. As a
          KN-OPEN it is exactly what it is: a crystallized unknown with a stated basis and a
          stated weakness, routed per agents/coordinator.md responsibility 11.
        what_the_entry_must_carry: >-
          The re-run against a verified PDF as a precondition for citing the Kloosterman
          measurement; the Euler-characteristic >= 3 object class from E4 as the place the
          question next bites; and a pointer back to this decision's obstruction block so
          tools/obstruction_registry.py keeps re-posing it at every rerank.

