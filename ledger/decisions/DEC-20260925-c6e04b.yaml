  # --------------------------------------------------------------------------
  # JOB 1: THE DV-10 DISCLOSURE'S DISPOSITION
  # --------------------------------------------------------------------------
  dv10_disclosure_ruling:
    question: >-
      Does the DV-10 shortfall stand as a permanently-disclosed record-keeping
      exception that does NOT block the stage's substantive result, or does it
      require remediation before anything downstream proceeds?
    ruling: >-
      IT STANDS AS A PERMANENT, DISCLOSED, NON-BLOCKING EXCEPTION. No
      remediation is required before Phase A or R2-r5 proceed. This is a
      substantive ruling, not a formality: it is what makes R2-r5 dispatchable
      at all, since no clean cure exists (section 0.3) and none is invented
      here.
    reasoning:
      R1_what_is_actually_missing: >-
        DV-10's own implementation (r5_devchecks_more.py::dv10(), per section
        0.3's re-reading of it) requires two things: (a) the 42 ids used equal
        the allocator's own minted order, and (b) a literal,
        delimiter-matching mint-time transcript proving each id was --checked
        BEFORE it was used. (a) is TRUE and independently re-confirmed
        (section 0.3's own python3 cross-check: the union of both plans'
        id_map values equals minted-run-ids.txt exactly, 42/42). (b) is what
        fails: the SURVIVING transcript format does not match, because the
        underlying mint-time record was fragmented by the concurrency
        incident and the compaction/restart it triggered (section 0, "Plan-
        write anomaly"; section 0.1, "the supervising harness session was
        restarted"). The underlying EVENT the transcript would prove (each id
        checked with --check before use) is independently corroborated to
        have occurred as described in section 0's own contemporaneous log
        ("each BARE id confirmed with `--check` (rc 0, 0 occurrences, all 42)
        BEFORE any file named it") and is, separately, re-confirmed true
        RIGHT NOW by fresh `--check` calls this continuation ran itself. What
        is missing is the surviving PROOF ARTIFACT in the one literal format
        the checker parses, not the underlying fact.
      R2_this_is_procedural_not_substantive: >-
        Every fact DV-10 exists to protect against -- an id collision, a
        malformed id, an id already in use, an id drawn from a retired or
        forbidden set -- is independently, redundantly checked and found
        false by OTHER, PASSING mechanisms this stage ran: the allocator's own
        zero-scan `--check` (42/42, rc=0, 0 occurrences, run twice: at mint
        time per section 0 and again by this continuation per section 0.2/9);
        a cross-check of the 42 new ids against 2531 prior RUN-GFPN-* mentions
        across every v1/v2/v2-a1/r1/r2/r3/r4 plan, every implementation* tree
        and the three retiring decisions (0/2531 intersections); and DV-6's
        own exhaustive R-2 sweep of all 204 retired ids plus every prior live
        id (section 8, DV-6 PASS). DV-10's own gap is specifically about HOW
        the mint was DOCUMENTED at the moment it happened, not about whether
        the ids are valid, distinct, or fit for use -- that question is asked
        and answered, repeatedly and independently, by checks that DO pass.
      R3_the_cause_is_infrastructure_not_defect: >-
        The gap traces to a disclosed dispatcher-level concurrency incident
        (two executor subagents briefly writing this write_scope
        concurrently, ~20 minutes) and a harness-session restart that lost
        one continuation's reasoning while preserving its filesystem state
        and one orphaned background process (section 0.1). Neither is a
        defect in the r5 layer's own runtime behaviour, an inadequacy of any
        executor's substantive work, or a falsified or fabricated claim. This
        is squarely the category AGENTS.md core rule 5 and
        agents/coordinator.md's Prohibitions name for mathematical results
        (a timeout, crash or infrastructure failure is not evidence against
        the work it interrupted); this decision applies the identical
        reasoning to an evidentiary-transcript casualty of the same class of
        incident: a process fault that destroys a RECORD of an event does not
        retroactively negate the event, when other evidence independently
        re-confirms it.
      R4_remediation_was_investigated_and_correctly_declined: >-
        The fourth continuation (section 0.3) is exactly the "concrete
        successor or revisit condition" AGENTS.md rule 9 requires before any
        deprioritization: it did not merely assert the gap was irresolvable,
        it TRIED the one candidate cure (re-minting a fresh 42 ids) and
        TRACED its consequence precisely -- the current 42 ids are load-
        bearing in DV-7, DV-11, DV-12, DV-15, DV-16 and, decisively, in DV-18
        item (3)'s own PASS record, which names RUN-GFPN-1bc116 (the F-4
        image of the AD-1 (d1) discriminant, the stage's one substantive
        new-logic requirement) as the literal package id the discriminant is
        keyed to. Re-minting would either orphan that already-genuine
        evidence (forcing every one of those DV items to be re-run against
        new ids to remain evidence at all) or leave the plans' id_map
        disagreeing with the bundle's actual package-id content -- itself a
        NEW, self-inflicted DV-10-class defect. Both outcomes are strictly
        worse than the disclosed status quo: they would either destroy real,
        hard-won verification work or manufacture a second procedural defect
        to paper over the first. This ruling adopts that finding: forcing a
        "clean" resolution is not available at any acceptable cost, and this
        record does not invent one.
      R5_no_fabrication_is_authorized_or_needed: >-
        Section 0.2 records, in terms, that this continuation "deliberately
        did NOT reformat check-log.txt's real text into the expected
        delimiter shape to force a PASS" because doing so "would misrepresent
        an audit as the temporal-ordering evidence R5S-5 actually requires."
        That restraint is exactly what AGENTS.md rules 5 (never fabricate)
        and 9 (pursue promising paths in good faith, without suppressing or
        mischaracterizing a defect) require, and this decision ratifies it as
        the correct conduct rather than as an unresolved defect the
        Coordinator must now cure by other means. Accepting the disclosed gap
        as a standing exception is the alternative to fabrication, not a
        weaker substitute for a fix that exists; no fix exists that does not
        either fabricate a transcript or destroy other genuine evidence.
      R6_agents_md_rules_4_and_6_are_satisfied_by_disclosure: >-
        Rule 6 (every conclusion cites the experiment/run/evidence IDs
        supporting it) is met: this decision, and implementation-v2-r5.md
        itself, cite the exact ids, the exact re-check commands and their
        exact outputs (rc=0, occurrences=0, all 42), and the exact bundle
        member (dv/dv10/dv10.json) carrying DV-10's own FAIL verdict
        unmodified. Rule 4 (scope every conclusion to the tested parameters,
        stating any transfer assumption) is met: this decision states plainly
        that DV-10's own computed verdict remains pass: false, permanently,
        and that what is accepted is a disclosed PROCEDURAL gap in the
        temporal-ordering record, not a finding that the 42 ids are fit for
        use by fiat -- that fitness is independently established by other,
        passing checks, cited above. The honest disclosure IS the discharge
        of both rules; no record here claims DV-10 "passed."
      R7_precedent_within_this_lineage: >-
        DEC-20260925-fc8dbb's own ADR-4 ruling (this same lineage, the
        immediately preceding approval act) accepted an analogous disclosed
        SCOPE LIMIT -- the 204-id pairwise duplicate-freedom check was
        count-verified only, not independently re-derived by extracting and
        pairwise-comparing the full id lists -- for three convergent reasons:
        the minting process itself draws without scanning state and is
        independently --checked; a second, independent mechanical sweep
        (there, DV-6; here, the same DV-6 plus the 2531-mention cross-check)
        catches a collision by a different route; and the CONSEQUENCE of an
        undetected defect is a bounded, self-revealing FALSE REFUSAL (a
        spurious block caught immediately and loudly at mint or wrapper-
        dry-run time), never a silent collision. All three reasons transfer
        directly to DV-10's gap: a real duplicate or malformed id among the
        current 42 would still be caught, loudly, the moment R2-r5's own
        wrapper runs its own R-1..R-13 checks (R5S-6) -- DV-10's shortfall
        cannot silently admit a bad id into a run package; it can only leave
        one honest procedural line unchecked in a transcript that already
        disagrees with itself for a disclosed, non-substantive reason.
    what_this_ruling_is_not: >-
      Not a finding that the R5S-5 requirement is unsatisfiable by
      construction (contrast DEC-20260925-8b2bf7's RB-5 (d) ruling): R5S-5 IS
      satisfiable, and section 0's own contemporaneous log shows it WAS
      satisfied at the time of minting, for these facts, by this session. Not
      a retroactive narrowing of what "confirmed with --check before use"
      means, and not a reading that DV-10's checker should treat a later
      audit transcript as literal mint-time evidence -- the checker's own
      verdict stays pass: false, unedited, forever. Not a waiver applied to
      any FUTURE stage's DV-10 obligation: a future stage that suffers no
      comparable dispatcher-level incident is held to the literal requirement
      exactly as written, with no benefit from this ruling. Not evidence
      about D, the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT.
    disposition: >-
      ACCEPTABLE AS A DISCLOSED EXCEPTION. The ids' present-tense validity was
      independently re-confirmed (R2, R6 above); AGENTS.md rule 6 (cite the
      ids) and rule 4 (scope) are satisfied by the honest disclosure itself,
      exactly as this act's brief anticipated. No remediation is required of
      any agent before Phase A or R2-r5 proceed. The gap is carried forward,
      permanently and explicitly, in every downstream record that depends on
      the 42 ids' validity (Phase A's receipt, R2-r5's own card and manifests,
      and any future review of the r5 lineage), never silently dropped.

  # --------------------------------------------------------------------------
  # PHASE A: CLEARED TO RUN, UNMODIFIED SPEC
  # --------------------------------------------------------------------------
  phase_a_disposition:
    ruling: >-
      TASK-20260925-0ed1be's phase A is CLEARED TO RUN, under its own
      already-written spec (bound_paths, verification_steps (1)-(8),
      receipt_contents, commit_message_must_name, completion_gate), UNCHANGED
      by this decision. Precondition R5A-6 is met: TASK-20260925-a16f78 has
      returned with outcome completed and released its claim
      (coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/claims/TASK-20260925-a16f78.1.release.json),
      per the context above; no repaired run package exists (section 1 of
      implementation-v2-r5.md; DV-9/DV-10's own present-tense facts confirm no
      run directory exists for any of the 42 ids).
    why_dv10_does_not_gate_phase_a: >-
      Phase A's own verification step (6) requires implementation-v2-r5.md to
      record "every DV-1..DV-18 outcome, including DV-18 (f) (xiv) and (xv)
      FIRST and passed" and states "A missing item STOPS the archive." DV-10's
      outcome (FAIL, with full reasoning) IS RECORDED, in section 0.2, section
      8, section 9 and section 0.3 -- it is not missing. Phase A binds bytes
      and records what genuinely happened; it asserts no completion verdict
      of its own (constraint R5A-4: "AN ARCHIVE IS NOT EVIDENCE AND NOT
      APPROVAL"). A recorded FAIL is exactly what a snapshot archive exists to
      preserve, not a condition that blocks it.
    the_one_deviation_from_the_cards_own_after_phase_a_text: >-
      TASK-20260925-0ed1be's after_phase_a field, written by Act 23 before
      DV-10's shortfall was known, says Phase A's verification should
      automatically "set TASK-20260925-480d02 from `blocked` to `queued`."
      THIS DOES NOT FIRE AUTOMATICALLY. This decision's
      r2_r5_queuing_ruling and queue_revision_authorized below supply the
      reasoned authorization for that exact same state change, replacing the
      card's own automatic text for this one step, exercised only once BOTH
      phase A and this decision's own ledger archive (TASK-20260925-c4f402)
      verify. Every other consequence of phase A's after_phase_a text
      (appending the bound implementation-v2-r5/ files to
      TASK-20260925-a16f78's artifact_paths; recording the phase-A commit in
      TASK-20260925-0ed1be's archive.phases) is UNCHANGED and fires exactly as
      the card already specifies.

  # --------------------------------------------------------------------------
  # JOB 2: R2-r5 QUEUING RULING
  # --------------------------------------------------------------------------
  r2_r5_queuing_ruling:
    question: >-
      Whether TASK-20260925-480d02 (R2-r5, the production solver run against
      the 42 ids) may be set from `blocked` to `queued` once phase A verifies.
    ruling: >-
      YES. TASK-20260925-480d02 MAY BE QUEUED, because dv10_disclosure_ruling
      above finds the DV-10 gap an acceptable disclosed exception rather than
      a blocking defect, and every OTHER phase-A-gated precondition of R2-r5
      (R5S-6's R-1..R-13 checks, run live by R2-r5's own wrapper against the
      committed bytes) remains fully in force and unrelaxed. This is an
      EXPLICIT, REASONED decision, not the card's original automatic text
      applied unread.
    what_changes_for_r2_r5: >-
      NOTHING in R2-r5's own card (TASK-20260925-480d02), completion_gate, or
      RDL-1 residual is altered. R2-r5's own wrapper independently
      --re-checks every one of the 42 ids at admission time (R5S-6, R-1..R-13)
      before any package is created; a genuine collision or malformed id,
      were one somehow present despite every check above, would be caught and
      refused THERE, live, before any solver child launches -- exactly the
      "bounded, self-revealing false-refusal risk, never a silent collision"
      profile DEC-20260925-fc8dbb's ADR-4 already accepted for an analogous
      gap in this same lineage (dv10_disclosure_ruling R7).
    what_r2_r5_must_carry_forward: >-
      R2-r5's own manifests and any downstream review of the r5 lineage MUST
      cite DEC-20260925-c6e04b when referencing the 42 ids' provenance: the
      mint-time ordering transcript for these ids does not survive in the
      R5S-5 literal format, and every id's present-tense validity rests on
      the re-checks this decision and implementation-v2-r5.md section 0.2/0.3
      record, not on an unbroken mint-time chain. This is a standing
      disclosure obligation, not a one-time note.
    ordering: >-
      (1) Phase A of TASK-20260925-0ed1be commits, is accepted by the
      post-commit verifier, and is pushed. (2) This decision's own ledger
      archive, TASK-20260925-c4f402, commits (DEC-20260925-c6e04b, this act's
      card TASK-20260925-a02390, TASK-20260925-c4f402 itself, and the goal-
      head edit), is accepted, and is pushed. (3) Only then does the
      dispatching session apply queue_revision_authorized below, as its own,
      separate, later commit.

  queue_revision_authorized:
    queue: coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.json
    when: >-
