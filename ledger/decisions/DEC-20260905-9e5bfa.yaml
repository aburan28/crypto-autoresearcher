coordinator_decision:
  id: DEC-20260905-9e5bfa
  recorded_at: '2026-09-05'
  goal_id: GOAL-ECRANK-002
  question_id: RQ-ECRANK-27dcc5
  batch_id: BATCH-52b70c
  decision: open_batch
  decision_rationale_for_verb: >-
    Batch-opening decision dispatching N1 of DEC-20260822-7d356e - the
    action its own goal head names as RANK 1, "ahead of every other
    queued expense on this goal", and "the only action in view that can
    SETTLE this goal rather than refine it". BATCH-e0caa5 is closed
    (DEC-20260822-7d356e on EV-ECRANK-6695dc; checkpoint
    checkpoints/BATCH-e0caa5.yaml); C1 is OPEN and C2 is NOT MET. N1
    fetches the exhibited points of the externally reported rank >= 31
    curve over Q and runs this program's OWN committed verifiers on them
    as a k = 0 configuration (V trivial, degree 1). The batch that
    produced the decision was FORBIDDEN network access; this decision
    GRANTS the network/retrieval permission the N1 dispatch_note
    requires, and records the grant on every handoff, with the fetched
    bytes archived under content hash so the verification is replayable.
    This opening changes NO official status: C1 stays OPEN until a
    closing decision rules it, and NO RANK OVER Q IS ASSERTED by this
    record.

  context: >-
    C1 reads "a committed certificate of rank >= 31 over a number field
    of degree <= 8, accepted with zero errors by
    source/verify_certificate.py (exact) and with no singular regulator
    by regulator_check.py". Degree 1 satisfies "degree <= 8", and the
    reduction runs one way only: a curve of rank r over Q has rank >= r
    over any extension, so a degree-1 witness settles the degree-<=8
    question and not conversely. Two external sources are recorded in the
    committed BATCH-e0caa5 red-team report (TASK-20260822-de2fa2,
    control C-02), provenance: committed record, not recalled: Dujella's
    rank-history table lists rank 30 and rank 31, both 2026,
    Alpoge-Howell; the ICARM leaderboard entry for curve #302 records
    rank >= 31, credited to Claude, Levent Alpoge and Ava Howell,
    submitted 2026-08-23 20:02:58 UTC. CAVEAT CARRIED VERBATIM FROM THE
    RED TEAM AND NOT SOFTENED: "This review did NOT verify the 31 points
    and asserts no rank." THE EXTERNAL RECORD IS A POINTER, NOT EVIDENCE,
    until this program's own verifier accepts the bytes. The leaderboard
    page also mentions BSD+GRH in connection with rank 31, which plausibly
    concerns the UPPER bound; a lower bound from exhibited independent
    points should be unconditional, and checking that is part of this
    action. If the points cannot be obtained or do not verify, the
    outcome is recorded as such and is NOT a statement about anyone's
    rank.

  target_ids:
    - DEC-20260822-7d356e
    - EV-ECRANK-6695dc
    - TASK-20260822-de2fa2
    - GOAL-ECRANK-002
    - RQ-ECRANK-27dcc5

  network_permission_grant: >-
    GRANTED, as the N1 dispatch_note requires. The executor task
    TASK-20260905-cfce83 may make network requests to locate and fetch
    the external record and its exhibited point list (ICARM leaderboard
    curve #302; Dujella rank-history table; Alpoge-Howell record and any
    page those point to). Every fetched byte is archived under sha256 in
    the task's write_scope with fetch metadata (URL, timestamp, method,
    status). The grant covers RETRIEVAL ONLY: no posting, no writes
    outside this repository, no credential use beyond ordinary public
    fetches, and Amazon Bedrock remains prohibited for any inference or
    probe (AGENTS.md rule 16). A fetch failure is an infrastructure
    outcome, recorded as such - never evidence about anyone's rank
    (core rule 5).

  ecc_priority_note: >-
    GOAL-ECRANK-002 is ECC (tools/ecc_priority.py --classify: area
    ECRANK, ECC). ECC priority was considered FIRST at this selection
    point (sweep of 2026-09-05, second of this session: 51 active goals,
    37 ECC; Ready bucket EMPTY; Batch-complete 30, mostly ECC; Blocked 9;
    Needs-repair 12 unchanged). Every other ECC offer examined:
    GOAL-ECTD-001 next_action is an explicit pause pending a separate
    scope decision and its lane is held by coordinator-ectd-rl-1;
    GOAL-MONO-001 is blocked precisely on an unservable review-breakthrough
    tier (DEC-20260904-67cde4); GOAL-PATH-001's chosen direction expands
    the GOAL-DREG-001 ladder and DREG sits in needs_repair (not silently
    hand-repaired per the sweep rule); GOAL-RELN-001 records "no runs
    now" until PATH prioritizes it; the SCURVE fleet is coordinator-aes-1's
    active x20 successor line (bus MSG-20260904-95f34f); GOAL-ECDLP-001
    is held mid-adjudication by coordinator-harness-ecdlp-2 with
    do-not-redispatch messages standing. GOAL-ECRANK-002's N1 is the ONLY
    ranked, unheld, dispatchable ECC task in the portfolio, and this
    batch takes it. The deferred non-ECC work is named so the deferral is
    auditable: GOAL-AES-003 RANK 1 (compose the execution-authorization
    decision for D-2 under the repaired design, DEC-20260905-ace928) is
    next in order after this batch closes; nothing about it is abandoned
    or deprioritized on the merits.

  review_tier_note_conditional_breakthrough: >-
    Pre-declared BEFORE any worker runs, because the outcome branch
    determines the review tier. BRANCH (a): if the committed verifiers
    ACCEPT the archived bytes, the natural composition proposes "C1
    CLOSES on an external witness at degree 1" - a PROPOSED CLOSURE,
    which model-policies.yaml routing_rules send to review-breakthrough
    (max effort, degradable: false, independent session). That tier is
    NOT CURRENTLY SERVABLE: this session's adapter probe
    (python3 -m orchestration.adapter doctor --probe, 2026-09-05) shows
    anthropic unusable ($ANTHROPIC_API_KEY unset) and review-breakthrough
    bound there (claude-opus-5); zai/zai-anthropic bind
    review-breakthrough to glm-5.2 with max_reasoning_effort high, below
    the max floor, and REFUSE by design; openai's binding is likewise at
    the high ceiling. If branch (a) occurs and the tier is still
    unservable when the ledger archive runs (re-probe first), the ledger
    records the run evidence and the closure candidate as UNPROMOTED,
    records an impediment on the goal head (clears_when: the doctor probe
    shows review-breakthrough servable; recheck: python3 -m
    orchestration.adapter doctor --probe), the goal stays ACTIVE, and C1
    stays OPEN. NEVER downgrade: substituting validator for
    validator-breakthrough to get the closure moving is the exact silent
    downgrade the policy layer forbids. BRANCH (b): if the fetch fails,
    the points are unobtainable or incomplete, or the verifiers REJECT,
    no closure is proposed; the outcome is recorded as scoped negative or
    infrastructure impediment under the ordinary review-adversarial round
    this queue carries, and C1 stays OPEN with the record saying exactly
    what was tried.

  coordinator_prior: >-
    Recorded BEFORE any worker runs. What I expect this round to find:
    (1) MOST LIKELY OUTCOME IS AN OBTAINABILITY FINDING, NOT A
    VERIFICATION: the external pages may name the curve without
    exhibiting all 31 points, or the points may be enormous and only
    partially listed, or the record may sit behind a search. I expect the
    executor to record EXACTLY what it fetched (or failed to fetch) under
    hash, with every URL, timestamp and error - and the round's value is
    that record either way.
    (2) IF POINTS ARE OBTAINED, the committed verifiers are
    deterministic: expect either clean acceptance or explicit error
    output. Any temptation to repair, complete, or reconstruct fetched
    bytes is a BREAKS-level fabrication; a verifier crash on legitimate
    input is a finding to record, not a bug to fix in flight.
    (3) THE UNCONDITIONALITY QUESTION resolves mechanically: on-curve +
    non-torsion + non-singular regulator on 31 exhibited points is an
    unconditional rank >= 31 lower bound; BSD+GRH, if it appears in the
    record, plausibly bounds the UPPER side. I expect the red team to
    confirm the license does not rest on BSD/GRH anywhere - and to say so
    explicitly if it does.
    (4) IDENTITY/PROVENANCE is the load-bearing attack: the archived
    bytes must be the curve the external record POINTS AT (ICARM curve
    #302). I expect the red team to hunt any gap between "the page we
    fetched" and "the curve the leaderboard credits" - a mismatch or an
    ambiguity about which curve the points belong to is a finding that
    blocks the closure branch.
    (5) NO RANK OVER Q IS ASSERTED ANYWHERE BY THIS GOAL, whatever the
    outcome. Even clean verifier acceptance licenses only: "this
    program's committed verifiers accepted these archived bytes as a
    k = 0, degree-1 configuration" plus a C1-closure CANDIDATE held for
    review-breakthrough. It never licenses "we confirmed the Alpoge-
    Howell rank claim" as a statement about their curve beyond what the
    archived bytes mechanically establish.
    A round that confirms all five points is the expected outcome; a
    round that overturns any is more informative; the prior exists so the
    difference is measurable.

  review_plan:
    prior_recorded_at: '2026-09-05'
    prior_recorded_in: this decision, before any worker ran
    joints:
      - id: J-N1a
        owner: validator (TASK-20260905-b439f9)
        joint: >-
          RUN INTEGRITY. (i) Fetch provenance: manifest URLs/timestamps/
          hashes match the archived bytes on disk, byte for byte;
          (ii) REPLAY: re-run the committed verifiers on the archived
          bytes in fresh sealed code and reproduce the executor's exact
          outputs; (iii) NEGATIVE CONTROL: perturb one coordinate of one
          archived point and confirm the committed verifier REJECTS - a
          verifier that accepts perturbed points proves nothing;
          (iv) VERIFIER INTEGRITY: the scripts run are byte-identical to
          experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py and
          regulator_check.py (hash comparison); (v) no fabrication
          signals: no reconstructed, completed, or repaired bytes
          anywhere in the package.
        coordinator_expectation: >-
          Passes on (i)(ii)(iv) if the fetch succeeded at all; (iii) is
          the control that makes acceptance meaningful; (v) is where a
          desperate round would fail.
      - id: J-N1b
        owner: red-team (TASK-20260905-0728c3)
        joint: >-
          INTERPRETATION AND LICENSE. (i) Identity/provenance attack:
          are the archived bytes the curve the external record points at
          (ICARM curve #302), and is any gap between fetched page and
          credited curve a named finding? (ii) Unconditionality: does any
          part of the acceptance license rest on BSD or GRH? Rule
          explicitly. (iii) Sentence enumeration: for each outcome
          (accept / reject / partial fetch / fetch failure), the EXACT
          sentence it licenses and the sentence it does NOT; accept
          licenses a closure CANDIDATE held for review-breakthrough,
          never a self-confirmed rank; failure licenses nothing about
          anyone's rank. (iv) Proves-too-much control on the ARGUMENT:
          does "verifiers accepted 31 points => rank >= 31" go through
          for objects where the conclusion is known false (torsion-only
          lists, singular models, duplicate points)? Coordinate with the
          mechanical negative control by DECLARING which argument-side
          holes it checks, without reading J-N1a's report (mutual
          blindness). (v) Pointer-provenance discipline: the external
          record stays provenance pointer (retrieved, with URLs and
          hashes) in every draft sentence; no recalled citations.
        coordinator_expectation: >-
          (i) is where a surprise would live; (ii) expected clean;
          (iii) is the deliverable the ledger composes from.
    blindness:
      mode: mutual
      detail: >-
        J-N1a and J-N1b are mutually blind fresh sessions; neither reads
        the other's directory; each attests to what it read.
      lifted_for: null
    proves_too_much_control: >-
      Argument-side (J-N1b iv): the acceptance argument is run against
      objects for which "rank >= 31" is KNOWN FALSE. Mechanical side
      (J-N1a iii): the committed verifier is run against perturbed
      bytes. Together they detect an artifactual acceptance.
    blind_rederivation:
      quantity: the verifier verdicts on the archived bytes
      blind_from: >-
        J-N1a re-runs the committed verifiers on the archived bytes in
        fresh sealed code WITHOUT reading the executor's run scripts,
        notes, or report before sealing its own outputs; agreement is
        then evidence about the bytes, and disagreement localises to one
        of two named runs.
      note: >-
        Not replication: recomputing from the executor's own harness
        would reproduce a wrong-but-self-consistent run faithfully.
    conditional_second_round: >-
      Declared in review_tier_note_conditional_breakthrough: a C1-closure
      composition requires review-breakthrough (max, degradable: false)
      BEFORE the closure is recorded; if unservable, the closure stays
      UNPROMOTED with an impediment and C1 stays OPEN. This queue's
      review round is review-adversarial and governs run integrity and
      license only; it never substitutes for the breakthrough round.

