coordinator_decision:
  id: DEC-20260916-3c0cf5
  batch_id: BATCH-94168f
  context: >-
    Opening and working BATCH-94168f, a DESIGN lane on GOAL-ICPERF-e6b6a4
    (ECC area ICPERF; campaign budget unlimited by policy; ECC first),
    disjoint from BATCH-a33cda, which another session drives on the
    point-decomposition instrument repair (DEC-20260915-428a17). The user's
    instruction is to keep converting this line's open ideas into experiment
    contracts. `tools/ecc_priority.py --open-ideas` lists 15 open ECC ideas of
    which 8 are ICPERF; AGENTS.md "ECC comes first" instruction 3 makes every
    one of them RANKED WORK to be designed, not shelved. This decision ranks
    all 8, selects three, and designs each into a hypothesis and a frozen
    experiment contract. It approves ONE of the three -- the only one whose
    protocol is complete and whose inputs exist -- and records enumerated
    approval preconditions and one concrete impediment for the other two. It
    performs ZERO runs, launches no trial, writes no experiment implementation
    code, and changes no hypothesis status on evidence.
  decision: approve
  decision_scope_note: >-
    `approve` names the operative act: EXP-ICPERF-2f2e40 is approved. The same
    record also ranks, designs, and DECLINES to approve two contracts. A
    reader who takes `approve` to cover all three has read the verdict and not
    the record; target_ids and the approval block below are explicit about
    which is which.
  target_ids:
    - BATCH-94168f
    - H-ICPERF-afe62e
    - EXP-ICPERF-2f2e40
    - H-ICPERF-81de5c
    - EXP-ICPERF-61c136
    - H-ICPERF-f08b1e
    - EXP-ICPERF-42ef30
    - TASK-20260916-ec9948

  # -------------------------------------------------------------------
  # THE RANKING: ALL EIGHT OPEN ICPERF IDEAS
  # -------------------------------------------------------------------
  ranking:
    method: >-
      Ranked by expected information gain per unit of work that THIS LANE can
      actually do, with four tie-breakers in this order: (1) how much other
      ranked work the item UNBLOCKS; (2) how close the item is to the
      exponent-first bias of docs/target-result-profile.md -- a measured
      exponent of a central hard problem outranks a constant; (3) whether a
      VALID result is obtainable given what exists (an item whose decisive
      component depends on software nobody has written, or on a phase of the
      goal that does not exist, is ranked on that fact and not on its
      ambition); (4) disjointness from BATCH-a33cda, which owns the
      instrument, the Groebner column and the quiet host. Every deferred item
      carries its evidence, its test boundary, its remaining uncertainty and
      a revisit condition, per AGENTS.md "Research-direction integrity". None
      is closed, none is diminished, and the two lower-ranked items I judged
      most tempting to bury (3476de and 8fe0ef) get the longest entries for
      that reason.
    novelty_caveat: >-
      ALL EIGHT IDEAS ARE `proposed` AND NONE IS NOVELTY-CHECKED. Three carry
      `novelty_status: unverified` by their own authors' declaration
      (3119c9, eee7e4, 3476de, 8fe0ef, 9191ed, 69941f -- six, in fact) and two
      carry `adaptation` (0d8e90, 3f1964) on the strength of retrieved
      sources this Coordinator did NOT re-open. Ranking an idea asserts
      nothing about whether it is new. A novelty screen is owed before any
      finding from these lines is promoted into knowledge/.

    selected:
      - rank: 1
        idea: IDEA-20260915-3f1964
        paired_ids: {hypothesis: H-ICPERF-afe62e, experiment: EXP-ICPERF-2f2e40}
        one_line: >-
          The exhaustive side-classified V^3 table is the instrument four of
          the other seven ideas silently depend on, it is the only one that
          needs neither the repaired instrument nor a quiet host, and the
          previous batch's closing review already ranked it second and told
          the next batch to take it.
        why_first: >-
          THREE INDEPENDENT REASONS, ANY ONE OF WHICH WOULD PUT IT FIRST IN
          THIS LANE. (a) UNBLOCKING: IDEA-20260915-0d8e90, -3119c9, -eee7e4
          and -8fe0ef all name its sampler or its table as the source of
          their certified-U/S targets or their yield ground truth; nothing
          else in the list unblocks anything. (b) DISPATCHABILITY: it uses no
          Groebner engine (the table IS the UNSAT certificate the Groebner
          column would have supplied) and makes no timing claim (every
          primary metric is a count), so it is disjoint from BATCH-a33cda on
          both software and machine headroom -- which is what a second lane
          on this goal has to be. (c) STANDING INSTRUCTION: DEC-20260915-428a17
          next_actions says in terms "Rank IDEA-20260915-3f1964 ... for the
          next batch or a second lane; it shares no write scope with this
          batch and is blocked only on machine headroom." This lane needs no
          machine headroom.
        what_it_costs_the_program_if_wrong: >-
          It becomes the certificate basis for every later ICPERF PDP
          measurement, so a counting defect here would propagate into evidence
          that looks sound. That is why the contract's C-RECON runs before any
          new cell and why C-CERT-EMIT is the one hard stop.
      - rank: 2
        idea: IDEA-20260915-0d8e90
        paired_ids: {hypothesis: H-ICPERF-81de5c, experiment: EXP-ICPERF-61c136}
        one_line: >-
          The only item of the eight that makes an EXPONENT a fitted number
          rather than an assumption, and it names in advance the single
          quantity -- c(l) decaying -- whose movement would be the first
          sub-exhaustive signal this line has ever had.
        why_second: >-
          It is the closest of the eight to docs/target-result-profile.md's
          exponent-first bias: it converts "SAT beats Groebner on these
          instances" into a closed-form relation-search cost
          T_rel ~ 3 c 2^{n+l} whose n-exponent is MEASURED, against rho's
          1/2, and it states the falsifier (c below 0.5 at l = 7 or 8) before
          the measurement. It is second rather than first only because its
          instances do not exist: it consumes rank 1's sampler. Second, not
          deferred -- the two are designed together and the dependency is a
          declared approval precondition, not a reason to wait a batch.
        the_guard_this_required: >-
          Because L4 is the outcome the line most wants, it is the outcome
          most at risk of over-reading, and two guards are written BEFORE the
          measurement: H-ICPERF-81de5c `promotion_gate_position` declares that
          L4 is NOT promotable from its own experiment and would need all four
          promotion gates under its own hypothesis; and the contract's
          C-CERT-IN exists because a wrongly labelled U instance returns few
          conflicts and MANUFACTURES the L4 signal.
      - rank: 3
        idea: IDEA-20260915-3119c9
        paired_ids: {hypothesis: H-ICPERF-f08b1e, experiment: EXP-ICPERF-42ef30}
        one_line: >-
          Supplies the one factor of rank 2's cost law that rank 2 takes as
          input -- the yield -- as a closed form predictable from (F1, F0, r)
          before any solver runs, and its core measurement needs no solver and
          no new generator at all.
        why_third: >-
          The three selected items compose into ONE complete statement of the
          relation-search column, with each factor separately measured: the
          instrument (rank 1) gives the exact per-target count, the
          per-instance cost law (rank 2) gives C_U and C_S, and the yield law
          (rank 3) gives p -- and T_rel = (N_rel/p)[(1-p)C_U + p C_S] is then
          arithmetic on three measured quantities rather than on one measured
          and two assumed. Ranked third rather than second because its
          headline is an explicitly CAPPED constant (8x) while rank 2's is an
          exponent. Ranked ABOVE eee7e4 -- the closest call in this list -- on
          two grounds: its core (counts, Lambda, the slice search, the
          predicted-vs-measured yield, the known-false and null objects) is
          PURE ARITHMETIC, so it yields a valid, interpretable result even if
          every solver lane on this host stays impeded; and it would have
          explained, before any solver ran, the 3.7x yield difference between
          (17,6) and (19,6) at the SAME l that RUN-ICPERF-305ca3's per-instance
          S/U labels cannot see.

    deferred_with_reasons:
      - rank: 4
        idea: IDEA-20260915-eee7e4
        one_line: >-
          Side-constrained core: adding the E-membership constraint per block
          shrinks the DPLL leaf count from |V|^m to |V_E|^m, a predicted 8x,
          with the sharpest null/known-false pair in the whole list.
        why_behind: >-
          Its own claim is a CONSTANT capped at 8, and its most interesting
          clause -- constrained c below 0.5, the sub-exhaustive signal -- is
          the same clause rank 2 tests directly and more cheaply, with its own
          known-false order control. Its marginal information over rank 2 on
          that question is therefore smaller than it looks. It also carries an
          unresolved implementation risk its own author flagged: WDSat's XOR
          module may not accept appended CNF clauses, in which case the only
          sound variant is a REGENERATED instance with each block re-encoded
          on l - 1 bits, which needs the same generalised descent generator
          that is this batch's recorded impediment IMP-1.
        what_is_genuinely_good_in_it_and_not_lost: >-
          Its random-subset control -- an alphabet of size |V_E| drawn at
          random, which is KNOWN-FALSE for the side semantics and TRUE for the
          counting -- is the cleanest separation of "alphabet size" from
          "side structure" anyone has proposed on this goal, and it should be
          carried into whatever contract eventually tests the constraint.
        revisit_condition: >-
          Design it in the batch that follows this one, or as soon as IMP-1
          clears. If rank 2 measures c(l) FLAT, eee7e4 becomes the cheapest
          next probe for pruning; if rank 2 measures c(l) DECAYING, eee7e4 is
          superseded by whatever hypothesis explains the decay.
        remaining_uncertainty: >-
          Whether the side constraint prunes MORE than the alphabet shrink
          predicts, which is the only outcome of it that would matter.
      - rank: 5
        idea: IDEA-20260915-3476de
        one_line: >-
          Make the Groebner column measurable (RSS watchdog in place of
          RLIMIT_AS, a Boolean-native engine, a hardware-independent Groebner
          cost unit) and then decide whether the SAT-over-Groebner gap is
          structural or an engine-availability artifact.
        why_behind: >-
          THIS IS THE ITEM I AM LEAST COMFORTABLE RANKING FIFTH, because its
          C3 -- if a Boolean-native engine lands within 10x of WDSat at l = 6,
          the reported SAT advantage is substantially an engine-availability
          effect on this host -- is the single most decision-changing clause
          in the whole list. Three things put it here anyway, and the first
          two are independent of any lane politics. (i) ITS C1 IS ALREADY
          PRE-EMPTED: the RLIMIT_AS-versus-RSS question was settled by
          EV-ICPERF-390707 joint V2 (RLIMIT_AS 6 GB aborted Groebner rows at
          2.575 GiB resident; unconstrained peak RSS is 6.71-6.82 GiB) and the
          watchdog is already in EXP-ICPERF-e21835 and in EXP-ICPERF-13f001
          CH-2. The record itself says its Stage 1 was already assigned to
          TASK-20260913-6c5729. (ii) ITS DECISIVE COMPONENT HAS AN UNTESTED
          BINARY INFRASTRUCTURE PRECONDITION: C3 requires BRiAl, which is not
          installed here (`import brial` raises ModuleNotFoundError, per the
          record's own availability check), and whose failure mode the record
          states as "then no Boolean-native Groebner column exists here". A
          design whose headline rests on an uninstalled package is a design
          whose headline may be unreachable, and nothing in this lane can test
          that. (iii) IT IS NOT DISJOINT FROM BATCH-a33cda: its remaining
          stages are protocol additions to the Groebner column and to
          EXP-ICPERF-13f001's AP-2 and AP-4, which that lane owns. Designing
          it here would produce a contract whose every approval precondition
          belongs to another session.
        revisit_condition: >-
          When BATCH-a33cda closes. Its stages 2, 3 and 4 (install and freeze
          BRiAl; parse d_solv and per-degree Macaulay matrix dimensions; run
          the matched nulls through the same arms) are the natural content of
          the batch that approves EXP-ICPERF-13f001, and C4 in particular --
          a hardware-independent Groebner unit -- is owed by
          RQ-ICPERF-94c86e's own decision target, which asks for "Groebner
          matrix operations" and not wall seconds.
        remaining_uncertainty: >-
          Whether the reported SAT-over-Groebner gap survives a Boolean-native
          engine. Unresolved, and this decision resolves nothing about it.
      - rank: 6
        idea: IDEA-20260915-8fe0ef
        one_line: >-
          Frobenius-invariant factor bases on Koblitz cells: the tau-stable
          subspaces are ker g(tau) for g | x^n - 1, lane existence is decided
          by ord_n(2), every linear stable V not containing F_2 is
          trace-parity-confined and so forces even m, and the matched rho
          baseline must be corrected by sqrt(2n).
        why_behind: >-
          Its mechanism's factors (n on relation collection, n^2 on linear
          algebra) are, by its OWN sota_delta, ZERO delta against
          Galbraith-Granger-Merz-Petit 2020/1315 -- it re-derives a published
          result, and whether item (1) of its `what_is_new` is also in that
          paper is UNCHECKED because the full text was not opened. Its most
          immediately valuable half -- that this goal's rho baseline is
          5.5-6.2x too generous to index calculus on a curve that IS Koblitz
          -- is already recorded as EV-ICPERF-390707 joint V6 and is ranked
          item (5) of the goal head's own next_action, i.e. it belongs to the
          rho-column batch. And it needs the same generalised generator that
          is IMP-1. What survives as genuinely new relative to this corpus is
          the EVEN-m CONSTRAINT on linear stable lanes at Tr(a) = 1, with the
          affine slice 1 + ker g(tau) as the unconfined alternative; that is a
          cheap theorem with a sharp known-false control (m = 3 on ker f1 must
          give exactly zero G-target decompositions) and it is NOT lost.
        revisit_condition: >-
          Design it as soon as IMP-1 clears, or immediately as a zero-compute
          lane-table item (its step (1) is pure arithmetic in ord_n(2) and
          needs nothing). Its even-m constraint should be checked against
          H-ICPERF-f08b1e's design rule, which pulls in the opposite
          direction: this record's rank 3 maximises F1 and 8fe0ef's stable
          lanes have F1 = 0.
        remaining_uncertainty: >-
          Whether eprint 2020/1315 already states the confinement constraint.
          That is a full-text read, not an experiment, and it is the first
          thing a reviewer should do.
      - rank: 7
        idea: IDEA-20260915-9191ed
        one_line: >-
          Treat the relation set as a weighted hypergraph and import the NFS
          filtering stack, measured against a degree-matched
          configuration-model null.
        why_behind: >-
          ITS CHEAP ARMS ARE BLOCKED ON A PHASE THAT DOES NOT EXIST. Its arms
          0 and 2 are described as reusing "relation sets the ICPERF batch
          already produces". No such relation set exists: RUN-ICPERF-305ca3
          produced per-instance point-decomposition answers, not a collected
          relation set, and GOAL-ICPERF-e6b6a4 objective (3) puts relation
          search in its own future batch. Its own honest prior is also that
          classical filtering DEGENERATES on a uniform-arity, subspace-defined
          factor base and buys close to nothing, and its sota_delta against
          index calculus is zero by construction.
        what_is_genuinely_good_in_it_and_not_lost: >-
          It is the ONLY one of the eight that proposes a new object at the
          relation layer -- the stratified factor base with two out-of-base
          points and large-prime cycle recovery -- which is the kind of
          structural ingredient docs/target-result-profile.md asks for. Its
          configuration-model null (rewiring the measured hypergraph so
          degrees match EXACTLY, not approximately) is also the strongest
          null-object design in the list and should be reused wherever a
          relation hypergraph is eventually measured.
        revisit_condition: >-
          When the relation-search column exists, i.e. after the batch that
          builds a relation collector. Its arms 0 and 2 then cost nothing
          extra, because they reuse that batch's output.
        remaining_uncertainty: >-
          Whether the ECDLP relation hypergraph is distinguishable from a
          degree-matched random one. Genuinely open and cheap to settle once
          there is a hypergraph to look at.
      - rank: 8
        idea: IDEA-20260915-69941f
        one_line: >-
          Method-ceiling audit: sweep every scheduling knob each installed
          engine exposes and bound once and for all what reordering can buy,
          expecting a constant while d_reg sets the exponent.
        why_behind: >-
          Lowest expected delta of the eight by its own declaration ("ZERO
          delta against SOTA, by construction and by intent"), and highest
          collision: it is a cost sweep over the same instances, the same
          engines and the same host that BATCH-a33cda is repairing, and its
          Groebner half cannot be run until that repair lands. Its
          deliverable is an error bar.
        the_honest_tension_in_ranking_it_last: >-
          It is the CHEAPEST of the eight (no new instances, no new engine, no
          new mathematics) and its P3 -- scheduling spread swamping a
          previously reported engine-to-engine effect -- would be a defect
          finding about this program's own measurements and would require a
          correction record against the affected lane. A reader could
          reasonably swap it with rank 7 on near-term obtainability. I rank it
          last because 9191ed at least proposes a new object whose blocker is
          a scheduling fact the goal's own roadmap will clear, whereas
          69941f's low delta is permanent by design. That is a judgement, it
          is close, and it is recorded as close.
        revisit_condition: >-
          Immediately after BATCH-a33cda's acceptance, as an error-bar task on
          the repaired instrument. Its SAT half (branching heuristic, restart
          policy, phase saving, XOR handling) needs no Groebner engine and
          could be split out earlier if a lane wants a cheap, honest audit.
        remaining_uncertainty: >-
          The size of the scheduling spread on these instances, which is
          currently unknown and is an unquantified error bar on every
          single-configuration number this program has recorded in the
          SATIC / DREG / SDEG lanes.

    id_pairing_declaration: >-
      The pre-minted identifiers were paired to ranks BEFORE the contracts
      were written, in the order the ranking gives, and the pairing is stated
      here explicitly as instructed:
        rank 1 = IDEA-20260915-3f1964 -> H-ICPERF-afe62e / EXP-ICPERF-2f2e40
        rank 2 = IDEA-20260915-0d8e90 -> H-ICPERF-81de5c / EXP-ICPERF-61c136
        rank 3 = IDEA-20260915-3119c9 -> H-ICPERF-f08b1e / EXP-ICPERF-42ef30
      No identifier was hand-picked, minted, or reused by this session; every
      one was supplied pre-allocated and `--check`-verified.

  # -------------------------------------------------------------------
  # APPROVAL: ONE OF THREE
  # -------------------------------------------------------------------
  approval:
    approved:
      - id: EXP-ICPERF-2f2e40
        approved_by: DEC-20260916-3c0cf5
        why: >-
          PROTOCOL COMPLETENESS, which the standing user authorization
          explicitly does not cure and which is the Coordinator's own
          responsibility. It has controls (seven, each with a recorded
          self-defeat verdict), admission rules at (cell, side) granularity
          with a cheap pre-pass that makes each cell REACHABLE-checkable
          before it is entered, metrics, budgets, per-invocation timeouts,
          stopping rules, invalidation rules, artifact paths, named and
          versioned engines, an inference policy, and a pre-registered
          prediction whose reference values were produced by another agent on
          2026-09-15 and cannot be fitted to its output. Its inputs all exist
          and are committed. It can COMPLETE on the three shipped cells alone
          if every candidate new cell is refused admission, so no unverified
          assumption about the host can invalidate it.
        approval_does_not_assert: >-
          That H-ICPERF-afe62e is true; that D2's per-family split will
          reproduce; that any new cell will be admitted; or that the result,
          when it exists, is validated. Approval is permission to do the work.
    not_approved:
      - id: EXP-ICPERF-61c136
        approved_by: null
        gaps: [AP-1, AP-2, AP-3]
        substantive_gap: >-
          AP-1. Its instances do not exist: every primary metric is computed
          on certified-U side-0 targets that are EXP-ICPERF-2f2e40's
          deliverable, and the gate is on INDEPENDENT ACCEPTANCE rather than
          on delivery because the failure mode is asymmetric -- a wrongly
          labelled U instance is satisfiable, returns few conflicts, drags the
          cell median down, and thereby FAKES the L4 sub-exhaustive signal
          this experiment exists to look for.
      - id: EXP-ICPERF-42ef30
        approved_by: null
        gaps: [AP-1, AP-2, AP-3]
        substantive_gap: >-
          AP-2, which is this batch's recorded impediment IMP-1: the
          generalised Weil-descent generator does not exist and I cannot
          supply it from a design lane. Without it the contract can report a
          yield law and cannot report a cost gain, because the clause "the
          gain is yield-only" needs descended instances over a designed slice.
          Its Stage 1 is separable and is the recommended first successor; the
          contract says so and says what a Stage-1-only run may and may not
          claim.
    what_i_did_not_do_to_make_approval_easier: >-
      I did not weaken any contract to reach `approved`. In particular I did
      not split EXP-ICPERF-42ef30 into an approvable Stage 1 record and a
      blocked Stage 2 record, because that would have let a yield measurement
      be reported as a relation-search cost result -- the conversion between
      them is H-ICPERF-81de5c's L2 and is itself unmeasured.

  # -------------------------------------------------------------------
  # RATIONALE
  # -------------------------------------------------------------------
  rationale:
    - id: R-COMPOSE
      claim: >-
        The three selected items were chosen to COMPOSE into one complete,
        separately-measured statement of the relation-search column, not as
        three independently good ideas.
      reasons: >-
        T_rel = (N_rel / p) * [(1 - p) C_U + p C_S] has three factors. Rank 1
        supplies p exactly, per target, by enumeration rather than by
        distributional assumption. Rank 2 supplies C_U and C_S and fits the
        n-exponent. Rank 3 supplies the closed form that PREDICTS p from
        (F1, F0, r) so the measured value has something to be checked against.
        Selecting any two of the three leaves a factor assumed. This is also
        why rank 2 is `draft` rather than deferred: designing it now, with its
        dependency written as an approval precondition, is what makes the
        composition visible; deferring it would have hidden the dependency in
        a future batch's ranking.
    - id: R-DISJOINT
      claim: >-
        All three contracts are disjoint from BATCH-a33cda on write scope,
        on software, AND on machine headroom -- and the third of those was a
        design constraint, not a discovery.
      reasons: >-
        GOAL-ICPERF-e6b6a4's `max_concurrent_basis` says its timing benchmarks
        "must run with the machine otherwise quiet", and BATCH-a33cda holds
        that. A second lane whose contracts needed a quiet host would be a
        lane that cannot run. So every primary metric in all three contracts
        is a COUNT -- table entries, root classes, agreement counts, conflicts,
        decisions -- and counts are invariant under load (KN-LIT-6e036d: conf[0]
        is WDSat's hardware-independent primary counter). No contract makes a
        timing claim and no wall-clock number from any of them may enter a
        boundary-table cell or any ratio.
      cost_accepted: >-
        These three contracts contribute NOTHING to the seconds-valued columns
        of RQ-ICPERF-94c86e. Those stay owed to batches that can hold the
        machine quiet, and the goal's first completion criterion still
        requires a measured rho column on the same host, which is ranked item
        (5) of the goal head's next_action and is not touched here.
    - id: R-CONTROLS
      claim: >-
        Every control in all three contracts was audited against
        DEC-20260915-d8d413's DEFECT-C-MEMO-OFF standard, each contract
        carries a `control_self_defeat_audit` block recording the audit, and
        THREE SELF-DEFEATING FORMULATIONS WERE FOUND AND REJECTED BEFORE
        FREEZING.
      the_three: >-
        (1) EXP-ICPERF-2f2e40, C-KF-CONVENTION: the natural wording -- "the
        target read under the opposite bit-order convention must have table
        count zero" -- fails on a CORRECT table about 5.6 times in 30, because
        the flipped reading is just another field element and the decomposable
        fraction of a random target is 0.19 / 0.29 / 0.08 at the three shipped
        cells. Replaced by a test on whether THE SHIPPED TRIPLE is a preimage
        of the flipped target, chance rate 30 * 2^{-n} < 1e-3.
        (2) EXP-ICPERF-42ef30, the F0 = 0 control: tautological. The
        class-aligned slice is CONSTRUCTED by filtering on Tr(x) = Tr(a), so
        re-checking F0 = 0 with the same predicate cannot fail on a working
        constructor and tests nothing about criterion (F2). Replaced by
        C-2E-INDEP, an independent 2E-membership test, gated on AP-3.
        (3) EXP-ICPERF-42ef30, the twist control: "a slice tuned for E must
        not also be tuned for E'" fires on an ordinary large-F1' draw, which
        the source idea itself concedes. Replaced by a COUNT check on E' with
        no pass/fail attached to the transfer.
      one_further_bar_rather_than_a_rejection: >-
        EXP-ICPERF-61c136's C-NULL is retained but explicitly BARRED from
        licensing any attribution to "the descended structure", because
        EV-ICPERF-390707's proves_too_much object 2 FAILED -- relabelling a
        structured instance's variable indices reproduces the
        structured-versus-null gap. EXP-ICPERF-13f001 CH-7 removed that
        attribution from its row and this decision does not let a new contract
        reinstate it by inheritance.
    - id: R-GRANULARITY
      claim: >-
        Every grid in all three contracts has admission rules stated at the
        granularity the binding quantity actually varies at, each with a cheap
        pre-pass that runs BEFORE the cell is entered, and each with a
        declared on-refusal record.
      reasons: >-
        DEC-20260915-d8d413's OBJ-5 finding is the standard: "the feasibility
        rule is declared PER CELL while acceptance probability is a function
        of NODE DEGREE, so every cell passes at its root and dies four to six
        levels down". The three instances found here, each with the number
        that makes it concrete: EXP-ICPERF-2f2e40 binds at (cell, side)
        because |Fb_s| is not predictable from (n, l) -- the (15,5) cell's
        |Fb_E| = 21 where a balanced V gives 31, a 2-sigma low draw.
        EXP-ICPERF-61c136 binds at (cell, config) because the noncore_first
        known-false arm costs at least 50x the default arm's, so a per-cell
        rule would admit (25,8) and then lose that cell's most important
        control. EXP-ICPERF-42ef30 binds at (cell, V, side) because the
        DESIGNED slice is chosen to MAXIMISE F1 and its table is therefore
        LARGER than the shipped V's: at l = 8 the class-aligned slice gives
        about 2.8e6 entries and the enriched best-of-K slice about 5.7e6,
        crossing a 4e6 bound -- so a rule sized on the shipped V would admit
        the cell and watch the designed table, the one the experiment is
        about, overflow.
      one_reachability_gap_found_at_design_time_and_declared: >-
        EXP-ICPERF-61c136's l-cancellation prediction needs two cells sharing
        n and differing in l, and NO cell in the candidate list does. The
        contract therefore declares (23,6) and (23,8) as required for that
        prediction only, and reports it NOT EVALUABLE with the reason if
        either is refused. Finding this while writing the grid is the point of
        writing the grid down.
    - id: R-D2
      claim: >-
        H-ICPERF-afe62e REPLACES a quantitative sub-claim of the idea it is
        designed from, because that sub-claim is already contradicted by
        committed evidence, and the replacement is sharper.
      reasons: >-
        IDEA-20260915-3f1964 predicts "zero mixed roots on the 60 instances
        (expected mixed count about 2^{l-n} per triple, under 1e-3 total)".
        EV-ICPERF-390707 joint V1 MEASURED 21 mixed roots of 67, all in one
        instance, as "cancelling-pair configurations". Carrying the idea's
        rate estimate forward as a prediction would be designing an experiment
        whose headline clause is known false before it runs. D2 instead
        enumerates the only two nonempty proper side-1 sub-sums that can lie
        in E[2] -- Q = -P (x_Q = x_P, forcing x_3 = x_R) and Q = T - P
        (x_Q = b/x_P, forcing x_3 = b/x_R) -- and gives a closed count:
        mixed roots exist only when x_R or b/x_R lies inside V, which on the
        shipped set is true of exactly one instance. That is the observed
        shape (EXP-ICPERF-13f001 CH-6 records n15l5-8-S as the degenerate
        instance whose "target x_R = 0x12 lies inside the subspace V itself",
        with 32 roots against a handful elsewhere), and the arithmetic
        reproduces the observed number: 31 nonzero x in V of which 10 lie on E
        gives 21 side-1 x, hence 21 mixed, plus 10 side-0 cancelling pairs and
        1 genuine decomposition = 32.
      what_this_arithmetic_is_and_is_not: >-
        IT IS A DERIVATION OVER AN UNREVIEWED INPUT AND IT IS NOT EVIDENCE.
        The "10 of 31" comes from IDEA-20260915-3f1964's proposal-time /tmp
        script, which its own author marks as not evidence. C-RECON is what
        converts it, and the per-family split M1/M2 is written as its own
        prediction precisely because a total of 21 reached with M2 > 0 would
        match the recorded number while falsifying D2. D2 is this
        Coordinator's derivation, compared against exactly one observed
        number, and both contracts say so.
      the_idea_record_is_not_edited: >-
        AGENTS.md rule 2 and rule 15. IDEA-20260915-3f1964 stays exactly as
        written; the divergence is declared at the top of H-ICPERF-afe62e.
    - id: R-EXPONENT-DISCIPLINE
      claim: >-
        H-ICPERF-81de5c makes an asymptotic statement, so the four promotion
        gates bind, and its position against them is recorded BEFORE its
        experiment runs rather than argued afterwards.
      reasons: >-
        agents/coordinator.md gates any asymptotic-complexity claim moving
        toward `supported`. L1-L3 assert an exponent (1 in n, for the
        INCUMBENT, which is worse than both rho and exhaustive search), and
        EXP-ICPERF-61c136 cannot satisfy the gates: three to five toy cells
        spanning at most 10 bits of n are not gate 3's concrete-cost table,
        and gate 1's lemma decomposition of the T_rel bookkeeping is not
        written. The hypothesis therefore carries
        `promotion_gate_position: engages_the_four_gates:
        false_for_this_hypothesis_as_stated`, may reach `analyzed` on its
        experiment and no further, and routes L4 -- the sub-exhaustive outcome
        it most wants to find -- to a successor hypothesis that must pass all
        four gates. Recording that at the moment it costs nothing is the
        cheapest insurance against the moment it would cost a great deal.
      the_conditional_pairing_duty: >-
        agents/coordinator.md requires a dispatched conditional result to be
        paired with a heuristic-validation experiment in the same or the
        following batch. Both heuristic-carrying hypotheses here satisfy it
        INSIDE their own contracts rather than by promise: HEUR-1 and HEUR-2
        of H-ICPERF-81de5c are validated by EXP-ICPERF-61c136 itself (per-k
        Beta(1,6k) comparison with a tail check; rank profile to
        1.5 * |Fb_E|/2), and HEUR-1 and HEUR-2 of H-ICPERF-f08b1e by
        EXP-ICPERF-42ef30 itself (the |V_E| histogram over K = 10^4 slices
        with its upper-tail fraction; c on designed versus shipped V). Each
        heuristic carries its own falsification condition and each is refuted
        only through it -- never by a timeout.
    - id: R-RECALLED
      claim: >-
        Recalled citations are carried, marked, and excluded from support,
        including where that leaves a heuristic with no discharged support at
        all.
      reasons: >-
        H-ICPERF-f08b1e's HEUR-1 rests on the Weil bound for Kloosterman sums
        and on the Gumbel law, and BOTH are `recalled` -- no agent in this
        program has opened either. The record says so in a
        `supporting_results_status` field rather than letting two pointers
        read as two citations, and notes that the experiment can validate the
        distribution DIRECTLY by measuring the histogram, which costs nothing
        and needs neither source. H-ICPERF-81de5c's HEUR-2 similarly marks the
        random-matrix rank result as recalled. Two `retrieved` sources
        inherited from the idea records (Yokoyama et al. 2020;
        Galbraith-Gebregiyorgis 2014/806) were NOT re-opened by this session
        and are carried as context that supports nothing.

