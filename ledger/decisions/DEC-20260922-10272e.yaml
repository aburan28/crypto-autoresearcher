coordinator_decision:
  id: DEC-20260922-10272e
  decided_by: coordinator
  decided_at: '2026-09-22'
  decision: rank_and_decline_to_open_campaign
  decision_note: >-
    The value is descriptive rather than one of the template's enum words, following
    the house precedent of DEC-20260809-57b240, DEC-20260916-c81d20 and
    DEC-20260805-b42d5c. It is deliberately NOT `reject_scoped`: nothing here rejects
    a mathematical claim, no hypothesis moves, no lane closes, and the closure gate in
    agents/coordinator.md therefore does not apply and is not being evaded. What is
    declined is INTAKE -- the opening of a goal, question or hypothesis for engineering
    performed in a different repository. A reader who takes this as a scientific
    rejection has misread it.

  context: >-
    An external, already-merged body of work was offered to this program for ranking:
    aburan28/crypto PR #594, merged 2026-09-22, checked out locally at /home/user/crypto
    at head 108cc64. It adds a three-tier algebra cache (local in-process, Redis,
    formerly S3) over Semaev point-decomposition preprocessing and symbolic summation
    polynomials, plus benchmark examples and a CI workflow. Files:
    src/cryptanalysis/algebra_cache.rs, src/cryptanalysis/polynomial_reuse.rs,
    src/cryptanalysis/semaev_leading_form.rs, examples/preprocessing_cost.rs,
    examples/gb_probe.rs, examples/semaev_symbolic_cost.rs,
    .github/workflows/polynomial-reuse.yml.

    Three items were left open by that work and offered for ranking: (1) semaev_cached
    has no caller on the relation-search path; (2) the genericity check and full-solve
    fallback are missing, so a cached generic Groebner shape applied to a degenerate
    specialization would yield a WRONG solve rather than a slow one; (3) no end-to-end
    measurement exists.

    This decision ranks that work against the open portfolio, declines to open any
    campaign for it, disposes the three items individually with revisit conditions,
    and dispatches no scientific trial. No batch is opened on any research goal.

  target_ids:
    - GOAL-ICPERF-e6b6a4
    - RQ-ICPERF-94c86e

  external_provenance:
    kind: external_code_provenance
    provenance: retrieved
    verified_by: coordinator (read the source tree at /home/user/crypto directly)
    repository: aburan28/crypto
    head: 108cc64
    pull_request: '594'
    merged: '2026-09-22'
    local_checkout: /home/user/crypto
    status_in_this_program: >-
      NOT evidence. These are measurements taken in another repository with no run
      manifest, no seed record, no solution certificate, no resolved-model/inference
      block, no validity status, and -- as reported with the intake -- "no
      repetition-count discipline of the kind this program requires". AGENTS.md
      "Artifact policy" and core rule 9 make them citable as code provenance and
      nothing more. No figure below is admitted to any boundary table, any evidence
      record, or any ratio.
    verified_by_reading:
      - >-
        src/cryptanalysis/semaev_leading_form.rs:1224 defines semaev_cached; the only
        caller in the tree is the test at semaev_leading_form.rs:1321. Item (1) as
        stated is confirmed by reading.
      - >-
        src/cryptanalysis/algebra_cache.rs contains no genericity, degeneracy or
        specialization check; its only occurrences of "fallback" are the two
        local-cache messages at lines 191 and 203. Item (2) as stated is confirmed by
        reading.
      - >-
        src/cryptanalysis/polynomial_reuse.rs:117-118 already records the governing
        mathematical fact in a doc comment -- "Specialization preserves ideal equality
        when the input generates the original ideal. It need not preserve the Groebner
        property: re-reduce." The gap in item (2) is therefore an UNIMPLEMENTED KNOWN
        REQUIREMENT, not an open mathematical question.
      - >-
        src/cryptanalysis/polynomial_reuse.rs:178-196, parameter_basis_cached, is
        capped at 16 total variables and its doc comment reads "Offline experiment
        only." It is not reachable from build_decomposition_system_reusing, which is
        the relation-search entry point.
    not_reproduced: >-
      This program did not build or run aburan28/crypto. Every timing quoted below is
      taken from the intake statement as reported, not measured here. They are single-host
      wall clock on 4-core x86_64, rustc 1.90.0, release build, loopback Redis.

  no_claim_made: >-
    NO SPEEDUP CLAIM IS MADE, SUPPORTED, OR IMPLIED BY THIS DECISION. Nothing here
    asserts that any index-calculus pipeline is faster than any other pipeline or than
    Pollard rho, at any size, on any curve family. The intake itself made no such claim
    and correctly said none should be made until an end-to-end measurement exists. This
    record asserts only a RANKING and an intake refusal.

  ranking:
    ranked_against: >-
      GOAL-ICPERF-e6b6a4's own next_action as recorded 2026-09-16 (NA-1..NA-9 plus five
      ranked-behind items, all carried forward from DEC-20260915-927eaa and
      DEC-20260915-428a17), and the 4 open ICPERF ideas reported by
      `tools/ecc_priority.py --open-ideas`.
    tiers:
      - tier: A
        label: >-
          Instrument-validity work that gates every comparative claim the ICPERF
          campaign intends to make. Seconds to minutes of compute each; each one
          currently blocks a measurement channel.
        items:
          - >-
            NA-1, accept or reject amendment D6 on a measurement (the Runner's 0.25 s
            poll boundary). TOP OF THE PORTFOLIO. Until it is settled, every fast-child
            wall RATIO is driven toward 1 regardless of engine, which would return "no
            engine is faster than any other" AS A MEASUREMENT, and no acceptance
            criterion could see it.
          - >-
            NA-3, shared-page double counting in pgid_rss_kb: the memory watchdog is
            validated only for NON-FORKING children, so every forking engine the
            campaign might add inherits an unvalidated limit.
          - >-
            NA-5, a tooling check refusing a commit that modifies an already-committed
            artifact under experiments/ or another task's coordination directory. Three
            in-place edits landed in one batch; that is a mechanism defect.
          - >-
            NA-6, teach check_review_independence.py to parse a review_plan_joint file
            and to flag a plan quoting a value its own blind_rederivation protects.
      - tier: B
        label: Contract and record repairs, each with an already-named defect.
        items:
          - NA-2, restate the byte-attribution criterion at LINE granularity.
          - NA-4, supersede the contract's two defective statements (A5 and A6).
          - NA-7, author the AP-6 amendment and fill AP-4 from measured behaviour.
          - NA-8, consider R6's order-independence lemma for the corpus.
          - NA-9, carry the n15l5 `S` family's degenerate solution structure as a scope caveat.
      - tier: C
        label: Measurement a declared completion criterion cannot be met without.
        items:
          - >-
            Ranked-behind (5): build the generic-baseline column by MEASURING rho and
            BSGS on these groups and this host. Completion criterion C1 requires matched
            rho in the same row, so this cannot be dropped.
      - tier: D
        label: Ranked-behind items with recorded revisit conditions.
        items:
          - >-
            Ranked-behind (2), the exhaustive side-classified V^3 table, largely absorbed
            by BATCH-94168f's EXP-ICPERF-2f2e40.
          - >-
            Ranked-behind (3), settle with no solver why the 30 shipped U targets contain
            one decomposable target where the measured fractions predict 5.57.
          - >-
            Ranked-behind (4), separate structure from variable order (the
            2x2-plus-planted-core null).
      - tier: E
        label: >-
          The 4 open ICPERF ideas. AGENTS.md ECC instruction 3 makes an open ECC idea
          ranked work to be DESIGNED, not shelved. Placed here by class; this decision
          does not rank them individually and a design act should.
      - tier: 'not ranked'
        label: >-
          THE EXTERNAL CACHE WORK. It does not appear on the list above, and the four
          reasons below are independent -- any one of them is sufficient on its own.
    reasons_it_does_not_rank:
      - id: R1
        label: It moves the wrong term in the bookkeeping.
        argument: >-
          docs/target-result-profile.md and agents/coordinator.md require per-attempt
          cost multiplied by inverse success probability, and bias the roadmap toward
          mechanisms that move an exponent over ones confined to logarithmic or constant
          cofactors. DecompositionTemplate is BY CONSTRUCTION the target-independent part
          of the descended system -- polynomial_reuse.rs stores coefficient polynomials
          and instantiate() performs a linear substitution of the target bits. Reuse
          across relation-search attempts therefore lowers a CONSTANT inside per-attempt
          cost and changes neither the success probability nor the attempt count. It
          cannot move an exponent, by the shape of the object, before any measurement.
        magnitude: >-
          DecompositionTemplate::build is 69 us to 9.4 ms across the whole feasible space
          (m=3, n<=61, ell bounded by MAX_VARS=64 and ell<=n). This campaign's own
          measured comparison point is AP-4 in GOAL-ICPERF-e6b6a4's next_action: a
          Macaulay2 F4 row on n15l5-1-S costs 46.5-48.0 engine CPU seconds. Taking the
          WORST build (9.4 ms) against the CHEAPEST of those solves gives roughly 2e-4 of
          a single attempt. Deleting the term entirely could not move any ratio this
          program tracks.
        magnitude_caveat: >-
          This is an ORDER-OF-MAGNITUDE DOMINANCE ARGUMENT, not a matched measurement. It
          compares an external build time on one host against this program's AP-4 figure
          on a different cell and a different host. It is labelled as such and is not
          evidence.
      - id: R2
        label: The originating repository's own taxonomy already classifies it, and not as a finding.
        argument: >-
          /home/user/crypto/AGENTS.md section 3 defines "engineering" as "S fell, ratio
          to the floor flat" and says in terms that it is "legitimate, bounded, and not a
          finding". Nothing here has measured S at all, so this work has not yet earned
          even that label. Section 2 of the same file: "End-to-end speed is the measure
          of speed... a number that prices only one phase -- the relation search, the
          decomposition oracle, a single solver call, the linear algebra -- is a stage
          diagnostic, never a speed." Every figure offered is a phase number, and most
          are sub-phase numbers.
      - id: R3
        label: None of the numbers can enter RQ-ICPERF-94c86e's boundary table.
        argument: >-
          The research question's own constraints exclude them on three independent
          counts. (a) The primary unit is a hardware-independent count with wall time and
          peak memory SECONDARY; single-host wall clock with no repetition discipline is
          not admissible as a primary figure. (b) "Engines are named and versioned in
          every cell. 'Groebner' is not an engine; Macaulay2 1.22 F4 over ZZ/2 with field
          equations is." The parameterized layer runs an in-repo Buchberger
          implementation, which is not a named, versioned engine in that sense. (c) The
          parameterized layer's cells are 7, 9 and 11 Boolean variables and it is capped
          at 16; the question's executable range is n<=41 binary at l<=8. No cell of the
          boundary table gains a value from this work.
      - id: R4
        label: Artifact policy.
        argument: >-
          See external_provenance.status_in_this_program above. Admitting these figures
          as evidence would violate AGENTS.md "Artifact policy" and core rule 9. They are
          external code provenance.

  informative_content_recorded_not_suppressed: >-
    AGENTS.md "Research-direction integrity and auditability" and the inventor protocol's
    premature-closure symmetry require that declining work does not discard what it
    taught. Four things in this intake are genuinely informative and are recorded here so
    a later reader does not have to rediscover them, and so that none of them can later
    be quoted as a speedup.
  informative_content:
    - id: I1
      finding: >-
        The Redis tier is a real NEGATIVE engineering datum with a direction. A held-
        connection hit versus rebuild is 1.1-1.4x at n=9/ell=9 -- the hit COSTS MORE --
        roughly break-even at n=31/ell=11, and only 0.43-0.47x at n=61/ell=1. That is
        measured over LOOPBACK, which is a lower bound on cross-AZ. Together with the
        69 us - 9.4 ms build range and the deletion of the S3 tier (an S3 GET being tens
        of ms), the finding is that template construction is TOO CHEAP TO BE WORTH ANY
        NETWORK CACHE.
      consequence_for_this_program: >-
        This argues AGAINST giving template construction its own phase column in
        RQ-ICPERF-94c86e's boundary table. It is a "the cost is not here" pointer, which
        is the opposite of a speedup and is the most useful thing the intake produced
        about cost structure.
    - id: I2
      finding: >-
        The local in-process hit is 3.7-167 us and 54-91x cheaper than rebuilding ONLY
        once the layer holds DECODED values rather than bytes; it was 1-3x when the layer
        stored bytes.
      consequence_for_this_program: >-
        The measured effect is therefore DESERIALIZATION COST, not algebraic reuse.
        Naming that here is what prevents "54-91x" from being quoted later as an
        algorithmic gain. It is a property of the storage representation.
    - id: I3
      finding: >-
        Symbolic summation polynomials: S_3 and S_4 at 0.01 ms, S_5 at 0.96 ms, S_6 at
        503-870 ms over 190,252 monomials. S_6 is curve-INDEPENDENT (symbolic over
        F_2[a6]) and is keyed on m, not on the curve. semaev_cached(5) is 896 ms cold
        versus 49 ms in a separate process via Redis.
      consequence_for_this_program: >-
        S_6 is the one genuinely reusable object in the intake, and it is reusable
        PRECISELY BECAUSE it is curve-independent -- which is also exactly why caching it
        saves a ONE-TIME cost rather than a per-attempt one. The whole available saving
        is a one-off of about 0.85 s. Nothing in this program's per-attempt accounting
        notices that. The existence of a computed S_6 is nonetheless a pointer worth
        keeping: this program's SEMBIN and ICPERF lanes work with S_3 and S_4 and have
        never had S_5 or S_6 available. Importing it would require its own certificate
        and is not proposed here.
    - id: I4
      finding: >-
        The parameterized (Groebner) layer costs 49 ms at 7 variables, 5.34 s at 9, and
        did not finish in 45 s at 11.
      consequence_for_this_program: >-
        A steep blowup, but on an in-repo Buchberger implementation at variable counts
        below every ICPERF cell, behind a 16-variable cap and marked offline-experiment-
        only. It corroborates nothing the DREG and SDEG lanes have not already measured
        on named, versioned engines, and by R3(b) and R3(c) it cannot enter a table cell.

  disposition_of_the_three_open_items:
    - item: 1
      statement: semaev_cached has no caller on the relation-search path.
      disposition: declined_as_research_here
      rationale: >-
        This is engineering in aburan28/crypto and belongs to that repository's own
        section 8 discipline. By R1 and I3 the entire available saving is a one-time cost
        of roughly 0.85 s, because S_6 is curve-independent and computed once per m. It
        is not research-shaped: it carries no falsifiable prediction about ECDLP cost, and
        completing it would not change any decision this program faces.
      revisit_condition: >-
        If aburan28/crypto's frozen regression suite ever produces an S column in which
        the summation-polynomial or preprocessing term is a non-negligible fraction of
        total S, at a size where the pipeline is otherwise within an order of magnitude of
        matched rho, then that term earns a phase column in RQ-ICPERF-94c86e and this
        disposition is reconsidered on that measurement.
      remaining_uncertainty: >-
        The fraction of total pipeline cost attributable to preprocessing and summation-
        polynomial construction is UNMEASURED in both repositories. The dominance argument
        in R1 rests on a cross-host comparison and would be overturned by a matched
        measurement showing otherwise. That measurement is item 3's job, not this
        program's.
    - item: 2
      statement: >-
        The genericity check and the full-solve fallback are missing; using a cached
        generic shape on a degenerate specialization yields a WRONG solve, not a slow one.
      disposition: >-
        declined_as_a_campaign_here, recorded as a correctness BLOCKER on the external
        work with a concrete revisit condition
      is_this_the_research_shaped_part: >-
        It is the closest of the three to research shape, and it is the only one of the
        three whose failure mode is a wrong answer rather than a slow one. It is still
        declined, and the reason is specific rather than a matter of taste.
      rationale: >-
        Nothing on any relation-search path, in EITHER repository, currently depends on a
        cached generic Groebner shape. In aburan28/crypto the relation-search entry point
        is build_decomposition_system_reusing, which memoizes the TEMPLATE -- coefficient
        polynomials, with the file header stating "We store coefficient polynomials, not
        target answers. No specialization denominators" -- and then calls instantiate(),
        a linear substitution of target bits, not a reuse of a Groebner basis. The
        wrong-solve hazard lives in parameter_basis_cached, which is capped at 16 total
        variables and documented "Offline experiment only", and is not reachable from the
        relation search. In THIS program no pipeline contains a cached generic Groebner
        shape at all. A correctness gate on an unreachable code path is a code-review
        finding in the owning repository, not an uncertainty this program can reduce by
        experiment. The governing mathematical fact is moreover already written down at
        polynomial_reuse.rs:117-118, so what is missing is an implementation of a known
        requirement, not an answer to an open question.
      revisit_condition: >-
        CONCRETE AND CHECKABLE. If any ICPERF or SEMBIN experiment contract proposes
        reusing a Groebner basis, or any generic solution shape, ACROSS SPECIALIZATIONS of
        the target, then the frequency and cheap detectability of degenerate
        specializations becomes a REQUIRED CONTROL inside that contract -- not a separate
        campaign. At that point the nearest in-repo measurement to build the control on
        already exists and is already recorded: GOAL-ICPERF-e6b6a4 next_action NA-9, the
        n15l5 `S` family's degenerate solution structure, in which all three solutions
        have two equal x-coordinates with the third the 2-torsion point, so x(P_2) = 0 and
        P_1 = +/- P_3. That is a measured degenerate specialization inside this program's
        own benchmark family and is the natural first test case for any such control.
      value_produced: >-
        That pointer -- item 2's hazard meeting NA-9's already-measured degeneracy -- is
        the real research value this intake produced, and it is recorded rather than
        dispatched because no contract currently proposes the reuse that would make it
        live.
      remaining_uncertainty: >-
        The frequency of degenerate specializations in Semaev/Weil-descent PDP systems is
        unmeasured here, and NA-9 itself records that whether planted instances with this
        structure represent point decomposition is UNANSWERED. Declining a campaign does
        not answer it; it says no open contract needs the answer yet.
    - item: 3
      statement: >-
        No end-to-end measurement exists; aburan28/crypto AGENTS.md section 8 requires the
        frozen regression suite plus matched full-DLP runs before any speedup claim.
      disposition: declined_as_research_here
      rationale: >-
        This is not research; it is the other repository's own standing requirement,
        unmet. Opening a program goal for it would import another repository's engineering
        debt as a research campaign. It would also be redundant: this program ALREADY owns
        the end-to-end cost question as RQ-ICPERF-94c86e, under a stricter unit, with
        matched rho on the same machine in the same row as a declared completion
        criterion. The correct reading of item 3 is that no speedup claim may be made over
        there -- which the intake itself already says, and this decision agrees with.
      pointer_worth_carrying: >-
        NOT the task, the POINTER. /home/user/crypto carries
        research/index_calculus_baseline_20260914/ (a frozen 60-input regression suite with
        an accounting contract at ec_index_calculus_contract.json) and the unit
        S = total operations / sqrt(n), in which Pollard rho is flat at S approximately
        1.3 at every size. It also carries a worked NEGATIVE result in that unit: on
        E(F_p^3) every index-calculus variant built costs between 528x and 4,000x rho,
        with the asymptotically better variant crossing rho only past 2^230, and a
        recorded correction in which a relation-phase crossover quoted at 2^96 was
        withdrawn once the linear algebra was priced. That is an independently authored
        instance of exactly the boundary-table discipline RQ-ICPERF-94c86e is building,
        including the failure mode this program calls phase-versus-method confusion.
      why_not_carried_now: >-
        Carrying it is a knowledge-curation act requiring a KN-LIT or KN-TECH identifier
        this act does not hold, and it ranks behind NA-1 through NA-9 in any case. It is
        recorded here so the identifier can be drawn when a curation act is next ranked.
        Note for whoever does: those figures are external and would enter the corpus with
        provenance `retrieved`, never as measured in-repo values, and the RQ's own
        constraint forbids them appearing in a boundary table as measured.

  what_was_not_opened: >-
    Stated explicitly so the absence reads as a decision rather than an omission. NO goal,
    NO research question, NO idea and NO hypothesis was created for this work, and no
    batch was opened on any research goal. The pre-allocated identifiers GOAL-ICPERF-39248b,
    RQ-ICPERF-04399b and IDEA-20260922-30e9ec were deliberately LEFT UNUSED and remain free.
    Minting them to give this work a home is the specific failure this decision refuses:
    a record created to house engineering that did not rank would make the portfolio read
    as though the work had been admitted on its merits.

  relationship_to_GOAL_ICPERF_e6b6a4: >-
    This decision does NOT edit, checkpoint, supersede or rewrite GOAL-ICPERF-e6b6a4's
    goal head or its next_action. It CONCURS with the ranking recorded there on 2026-09-16
    and adds nothing to that goal: no batch, no lane, no checkpoint shard, no task. The
    goal's own next_action (NA-1) remains its single next action and remains accurate.
    BATCH-94168f stays the only open lane on that goal, held by another session on branch
    claude/index-calculus-graph-dag-3linyk; the free slot under campaign max_concurrent 2
    is left free rather than filled, because AGENTS.md is explicit that idle parallel
    capacity does not justify admitting a lane and that an unlimited ECC budget removes
    the batch ceiling but not the duty to rank.

  rationale:
    - >-
      The work is a constant-cofactor engineering change to the target-INDEPENDENT part of
      point-decomposition preprocessing. By the shape of the object it cannot move an
      exponent, and the measured magnitude places it at roughly 2e-4 of one relation-search
      attempt against this campaign's own AP-4 figure (R1).
    - >-
      Its own originating repository's rules already classify this class of change as
      "engineering ... not a finding", and require end-to-end S before any speed claim.
      The work has not measured S, so it has not yet reached even that classification (R2).
    - >-
      No figure in it can enter RQ-ICPERF-94c86e's boundary table: wrong primary unit,
      unnamed engine, and variable counts below every declared cell (R3).
    - >-
      The figures are not admissible as evidence under AGENTS.md "Artifact policy" -- no
      manifest, no seed, no certificate, no validity status, no repetition discipline (R4).
    - >-
      Every item on GOAL-ICPERF-e6b6a4's own ranked list beats it on information per unit
      cost. NA-1 in particular is seconds of compute and currently gates every comparative
      wall claim the campaign intends to make, including the boundary table's per-phase
      timings.
    - >-
      Declining is not premature closure. Premature closure is declining to SEARCH because
      a target looks saturated. This declines to open a campaign for a finished
      engineering change whose ceiling is arithmetically bounded and whose own authors made
      no claim for it -- and it records four informative items, three revisit conditions,
      and a concrete pointer (item 2 meeting NA-9) rather than discarding them.
    - >-
      Opening a goal, question or hypothesis here would be make-work against an unlimited
      ECC budget, which AGENTS.md names as the single strongest invitation to make-work
      this program has and forbids by name.

  evidence_refs:
    - >-
      GOAL-ICPERF-e6b6a4 goal head, next_action as recorded 2026-09-16
      (ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml), for NA-1..NA-9, the five ranked-behind
      items, the AP-4 Macaulay2 F4 figures, and NA-9's n15l5 degenerate solution structure.
    - RQ-ICPERF-94c86e (ledger/questions/RQ-ICPERF-94c86e.yaml), for scope, unit and constraints.
    - DEC-20260915-927eaa, cited via the goal head as the source of the current ranking.
    - DEC-20260915-428a17, cited via the goal head as the source of the ranked-behind revisit conditions.
    - >-
      EXTERNAL, non-evidence: /home/user/crypto at 108cc64 --
      src/cryptanalysis/polynomial_reuse.rs, src/cryptanalysis/algebra_cache.rs,
      src/cryptanalysis/semaev_leading_form.rs, AGENTS.md. Read directly by the
      coordinator; see external_provenance.
  evidence_refs_note: >-
    This decision composes NO evidence record and cites none, because it interprets no run.
    A ranking decision rests on the records it ranked, which is what this list is.

  limitations:
    - >-
      The ranking was performed from GOAL-ICPERF-e6b6a4's own goal-head text and the
      external source tree. Nothing was re-run. EXP-ICPERF-e21835's accepted
      CODE_SHA256.json bytes were not opened, and BATCH-94168f's dispatch queue was read
      only in part (first 378 of 930 lines) -- enough to confirm the lane's objective,
      disjointness axes and max_concurrent basis, not its full task set.
    - >-
      If NA-1 has been dispatched on another branch since 2026-09-16, the top item of this
      ranking is already in flight. That is a scheduling fact discoverable with
      `git fetch` plus `tools/research_dispatch.py --claims refs`; it does not change the
      ranking.
    - >-
      The 4 open ICPERF ideas were taken as a COUNT from the top-level session's
      `tools/ecc_priority.py --open-ideas` output and placed in tier E by class. They were
      not read individually and are NOT ranked against each other here. Declining the
      external work does not rank them; a design act should, and AGENTS.md ECC instruction 3
      makes that ranked work.
    - >-
      Items 1 and 2 were verified by READING the external source; the measured timings were
      NOT reproduced. Every figure attributed to /home/user/crypto is as reported with the
      intake.
    - >-
      R1's arithmetic compares an external build time on one host against this program's
      AP-4 F4 figure on a different cell and a different host. It is an order-of-magnitude
      dominance argument and is labelled as such, not a matched measurement. A matched
      end-to-end measurement could overturn it; producing one is item 3's job in the owning
      repository.
    - >-
      This decision scopes to the tested objects it discusses: the aburan28/crypto cache
      tiers at head 108cc64 on one 4-core x86_64 host with loopback Redis, and
      GOAL-ICPERF-e6b6a4's portfolio as of 2026-09-22. It asserts nothing about caching,
      preprocessing reuse, or summation-polynomial precomputation in general, at other
      parameters, on other hardware, or inside other pipelines.

  knowledge_promotion:
    promoted: []
