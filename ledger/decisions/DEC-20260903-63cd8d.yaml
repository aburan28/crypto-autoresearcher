coordinator_decision:
  id: DEC-20260903-63cd8d

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-03). DEC-20260902-7ad3d9
    closed BATCH-e5d753 with the first composed shape verdict
    SH2-MONOTONE-DECAY (band-level, SCOPE-1 attribution, transition
    localized to (2,4], floor alive, count-level decay single-draw
    at k=2/k=8/k=16) and set RANK 1 = a count-completion design
    proposal. IDEA-20260903-8f26ac was authored and filed on main
    (PR #708): mandatory second seed at k=2 (seed 531002, armid 3)
    under a preregistered band+count+ratio decision rule
    (count-agreement window [0.9899, 1.0102] at the realized
    149,371), second seed at k=8 (armid 6) guarding the RT-J8 floor
    sensitivity, and a complementary frozen-family extension to k=3
    with BOTH seeds (armid 11; new freeze digests committed pre-arm)
    for sub-localization of (2,4]; k=5/6 declined with priced
    rationale; the floor-magnitude hook declined on arithmetic and
    deferred to RANK 2.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-060cb4, CARRIES SCOPE-1 AS THE BINDING
    ATTRIBUTION RULE AND NARROW-1/2/3 AS BINDING PARAPHRASE
    DISCIPLINE FOR THIS BATCH, AND DISPATCHES ITS QUEUE. It does NOT
    move current_batch_id (that happens in the closing ledger
    archive), does NOT adopt PINCTRL-1 (RANK 3; any
    schedule-separated control arm requires a new pin decision),
    does NOT re-measure the already-replicated k=1/k=4 band
    agreements, does NOT budget k=5/6 extension points, k=12, third
    seeds, 2^32 arms, a k=16 second seed, the pooled floor-magnitude
    route (RANK 2), or any schedule-separated control, and does NOT
    assert any outcome. The BATCH-e5d753 verdict SH2-MONOTONE-DECAY
    is immutable; this batch's content is strictly additive
    (replication-completion of the count sentence and
    sub-localization), never a re-composition.

  rules_carried:
    - id: AMEND-1
      source: DEC-20260901-6f9de3
      statement: >-
        Standing gate for the frozen instrument lineage: counter
        INCONSISTENCY on an analysis-bearing receipt is
        invalid_measurement — (a) overflow != hits − threads×
        HIT_LOG_CAP, (b) any cap-independent counter disagrees with
        its internal identities, or (c) any analysis-bearing
        quantity is derived from the capped detail log. Pure cap
        truncation with intact identities is NOT a gate failure
        (ratified on first application by RAT-2 of
        DEC-20260902-7ad3d9).
    - id: SCOPE-1
      source: DEC-20260902-38227b
      statement: >-
        Under PIN-T0 the key schedule is the AES schedule at every
        interior point k >= 1 and constant across interior k;
        interior-to-interior comparisons are schedule-clean; any
        interior decay is attributed to table dilution at fixed
        schedule; no dilution-only language. Extended here to
        grid+{3}: k=3 is interior under PIN-T0 and joins the
        schedule-clean comparisons.
    - id: NARROW-1
      source: DEC-20260902-7ad3d9
      statement: >-
        Floor-is-alive: every downstream sentence carries the live
        residual floor (h(4..16) = 17/13/12, decidable excess over
        the analytic null) and the bar on extinction-by-k=4
        sentences. Sub-localization sentences must not invite
        'the decay finishes early' readings.
    - id: NARROW-2
      source: DEC-20260902-7ad3d9
      statement: >-
        No count-level decay sentence without second seeds at the
        named k. This batch's CC rule is the mechanism: pairs
        (1,2)/(2,4) may reach count level only if CC-AGREE fires;
        k=3 enters with two draws from the start.
    - id: NARROW-3
      source: DEC-20260902-7ad3d9
      statement: >-
        Determinism is not replication: exact re-runs under
        identical seed/seat/build are instrument determinism and
        never count as independent draws. The determinism double on
        the extended build (S2a-6) is a certification of the new
        binary, not a replication arm.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-060cb4
    - IDEA-20260903-8f26ac
    - TASK-20260903-695ebe
    - TASK-20260903-d7c324
    - TASK-20260903-5fbdfc
    - TASK-20260903-c8118e
    - TASK-20260903-7893b2
    - TASK-20260903-0aa1bd
    - TASK-20260903-ac03af
    - TASK-20260903-b3dd1a
    - TASK-20260903-d81052
    - TASK-20260903-12a09f
    - TASK-20260903-8dc46d
    - EV-AES-868db1
    - DEC-20260902-7ad3d9

  outcome: >-
    Batch opened. Producer TASK-20260903-695ebe executes S0
    (preregistration, build identity re-verification with priced
    Gate-0x fallback, KAT pins, freeze re-verification, r=6 dead
    anchor analyzed first, k=0 ramp-zero anchor as the AMEND-1
    proves-too-much control) and halts the in-batch flow on
    CC-GATE-FAIL/CC-F6/CC-ANCHOR-FAIL; snapshot TASK-20260903-d7c324
    binds the S0 package. Producer TASK-20260903-5fbdfc gates on S0,
    executes S1 (second seed k=2 armid 3, second seed k=8 armid 6,
    CC composition under the preregistered rule, post-arm audit) and
    gates S2 on the CC outcome (CC-SEED-DISAGREE at k=2 blocks S2);
    snapshot TASK-20260903-c8118e binds S1. Producer
    TASK-20260903-7893b2 executes S2a (declared source diff, Gate-0x
    extended rebuild, KAT re-pins, extended freeze commitment R4
    with surface-diff battery, extended-build dead anchor,
    overflow-positive determinism double); snapshot
    TASK-20260903-0aa1bd binds S2a. Producer TASK-20260903-ac03af
    gates on S2a, executes S2b (k=3 with both seeds armid 11, post-
    arm freeze re-verification, CC3 cascade composition); snapshot
    TASK-20260903-b3dd1a binds S2b. Validator TASK-20260903-d81052
    and red-team TASK-20260903-12a09f run blind to each other after
    all snapshots; ledger TASK-20260903-8dc46d is the sole archiver
    of both review packages and records EV-AES-ac5c12 and the
    closing decision.

  rationale:
    - >-
      RANK 1 of DEC-20260902-7ad3d9 is exactly this design: the k=2
      second seed is mandated there and priced honestly here (band
      agreement at k=2 is nearly free — the replication content is
      seed variance of the 84.90 ratio and the count-decay sentence
      for pairs (1,2)/(2,4)); k=8 discharges the red team's RT-J8
      floor-sensitivity concern; k=3 sub-localizes the transition at
      the maximal resolution of the extended family.
    - >-
      The family extension is the first source modification of this
      lineage; the proposal prices it as a separate gated stage
      (S2a/S2b) with a declared-diff audit, surface-diff battery,
      pre-arm freeze commitment, and extended-build anchors —
      certified as frozen-build-plus-declared-extension before any
      k=3 reading.
    - >-
      The batch is bounded by the proposal's binding baseline
      (expected ~4.2 h; cap 19800 s total; per-stage caps S0 5400 /
      S1 3600 / S2a+S2b 10800 s; max_runs 7/4/8/5); every stage
      boundary is a stopping point with a committed reading
      (rule 5).
    - >-
      A claim-changing outcome (CC-AGREE count-level extension,
      CC-COUNT-DISAGREE seed-variance finding, CC-SEED-DISAGREE
      instrument alarm, any CC3 routing, or any gate indictment)
      gets both validator and red-team before ledger recording; the
      coordinator prior is recorded below before any reviewer runs.

  review_plan:
    prior: >-
      I expect S0 to pass (byte-identical build; anchors passed
      twice on it) and the k=2 second seed to land THRESHOLD inside
      the count-agreement window (the k=1 precedent is 0.009% seed
      variance, but k=2 seed variance is unmeasured). The uncertain
      joints: (1) COUNT agreement at k=2 — a 1-5% seed effect reads
      as COUNT-DISAGREE and is a finding, not a failure; (2) the k=8
      floor draw — a NULLBAND dip is priced at up to 0.45 if the
      true rate sits near lambda=6; (3) the k=3 landing — all four
      bands live, the multiplicative prior is flagged
      broken-authority; (4) the extension battery — first source
      modification of this lineage, so the declared-diff audit and
      surface-diff battery are new territory. WHERE I THINK IT CAN
      BREAK: over-strong count-completion language if CC-AGREE fires
      (reading it as 'the whole curve is replicated' when only pairs
      (1,2)/(2,4) are); extinction creep into sub-localization
      sentences (a (2,3] localization invites 'the decay finishes
      early' readings the floor-alive statement bars); quiet
      spending of the k=3 second seed's band agreement as shape
      stability when the landing is THRESHOLD (nearly-free
      agreement, the k=1 lesson).
    joints:
      - id: J-V
        owner: validator (TASK-20260903-d81052)
        attack_plan: >-
          Arithmetic/gates/AMEND-1 bookkeeping on the four new
          receipts plus the extended-build battery. Blind
          re-derivation of h(2)_531002, h(8)_531002, and both k=3
          readings with Garwood CIs from raw receipts BEFORE reading
          producer analysis. Verify the count-agreement window
          evaluation, ratio-CI propagation, declared-diff audit,
          surface-diff battery digest equality, R4 pre-arm mtime
          discipline, and every snapshot hash.
      - id: J-R
        owner: red-team (TASK-20260903-12a09f)
        attack_plan: >-
          Interpretation/scope/power/attribution. Attack whether
          every sentence stays within grid+{3}, cell (1,1), r=5,
          2^30, PIN-T0, tested seeds; whether NARROW-1/2/3 bind in
          every downstream sentence; whether the replication verdict
          names its pairs and no others; whether CC3 routing is
          honest at the realized k=3 bands (counterfactual routing
          checks at h(3)=5/6/40/41/99/100); whether any language
          spends determinism as replication.
    blindness: >-
      Reviewers are blind to each other within the round; each
      attests what it read. No sibling reads unless lifted
      deliberately in a later hardening round.
    proves_too_much: >-
      The ramp-zero AMEND-1 control (S0-6), the extended freeze
      selfchecks (S2a-4), and a routing check of the CC cascade
      against known-false inputs (a fabricated h(2)_531002 = 50
      must route CC-SEED-DISAGREE, never CC-AGREE).
    blind_rederivation: >-
      Required for all four new readings, blind from producer
      implementation and run report (blind_from: producer analysis
      scripts, RESULTS.json, run reports).

