  - >-
    This pass checked the first-ranked lane of each plan by text search. It did
    not re-adjudicate any plan's internal ranking.
  - >-
    The ranking of rank 1 above rank 4 is the main judgement call here and the
    least certain. It rests on rank 1 having a cleared dependency and a fixed,
    seconds-scale cost, while the open-idea set has not been ranked internally.
