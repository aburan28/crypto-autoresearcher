    observed_by: this Coordinator session, directly, on 2026-10-01 between about 18:40 and 18:55 PT
    machine: macOS (darwin 25.6.0) arm64, checkout /Volumes/SSD990/tmp/coord-portfolio-20261001
    observations:
    - 'shell: available (this session ran every command below).'
