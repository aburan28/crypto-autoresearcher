    - 'sage: /Users/adamburan/.local/bin/sage, "SageMath version 10.10.rc0, Release Date: 2026-09-17".
      Smoke test: sage -c "print(EllipticCurve(GF(101),[1,1]).order())" printed 105.'
    - 'PARI/GP: /opt/homebrew/bin/gp. Cross-check of the Sage smoke test: ellcard(ellinit([1,1],101))
      printed 105, agreeing with Sage.'
    - 'magma: not found on PATH.'
    - 'curl 8.7.1 present. https://github.com returned HTTP 200. web.archive.org responded (HTTP 302,
      redirect not followed).'
    - 'safecurves.cr.yp.to and www.rfc-editor.org: host name did not resolve ("curl: (6) Could not resolve
      host: www.rfc-editor.org"; dscacheutil returned no address for either name). cr.yp.to resolved
      (131.193.32.109).'
    verdict:
      arithmetic_and_certificate_capability: >-
        AVAILABLE. The thing these plans' producers lacked ("no shell and
        performed no arithmetic") is present on this machine: exact
        arbitrary-precision integer arithmetic (Python), elliptic-curve
        arithmetic, point counting and primality proving (Sage 10.10,
        PARI/GP). Every Tier-1 / priority-1 lane named below that is
        arithmetic on stated parameters is executable here.
      primary_source_retrieval_capability: >-
        NOT AVAILABLE AT CHECK TIME for the two primary hosts these plans cite
        most (safecurves.cr.yp.to, www.rfc-editor.org): DNS resolution
        failed. This is an infrastructure observation, very possibly
        transient, and asserts nothing mathematical. Other source hosts (SECG,
        NIST, Brainpool mirrors) were not tested and no claim is made about
        them.
      scope_of_this_determination: >-
        One machine, one moment. It does not certify the environment of
        whichever session later executes a lane; every successor task
        re-runs the recheck before relying on it.
  ranking:
    method: >-
      Candidates were ranked by expected information per unit cost, whether a
      dependency was cleared or blocked as of today, and fit to
      docs/target-result-profile.md. All candidates are ECC (tools/ecc_priority.py).
      tools/obstruction_registry.py --unexamined lists one unexamined
      obstruction, EV-AES-abf3dc, which is non-ECC and bears on no candidate
      here; it is noted and not acted on.
    ranked:
    - rank: 1
      act: Open successor batch BATCH-aa389e on GOAL-SCURVE-48e06c executing lane L5 (transfer).
      justification: >-
        Positive control for the whole SafeCurves family. The Anomalous row is the
        only row whose transfer cell is expected to come out false, and L5's
        certificate C4 (p prime + G on curve + p*G = O + Hasse interval => #E = p)
        is the documented precondition for the additive transfer that collapses the
        ECDLP from exponent 1/2 to polylog. If the identical code path does not
        produce C4 on this curve and refuses it on the quadratic twist and on
        random curves at the same p, then every other goal's transfer lane is
        unreadable ("controls before belief", docs/inventor-protocol.md). Its
        dependency (arithmetic capability) cleared today; budget about 60 s for the
        certificate; precedent shape GOAL-SCURVE-15e805 / BATCH-0aef14 produced a
        validated result. Does not need the unreachable primary host to run (see
        handoff constraints), only to be source-bound.
    - rank: 2
      act: Successor lanes on the other seventeen SCURVE goals, one batch at a time.
      justification: >-
        Admissible now (capability determined) but sequenced behind rank 1: the
        audit instrument should be shown to fire and stay silent on a known
        positive before it adjudicates seventeen more curves. Three of the
        first-ranked lanes (GOAL-SCURVE-3d5b30 L0, GOAL-SCURVE-85bad5 L0,
        GOAL-SCURVE-334012 L00) are source-retrieval lanes that the DNS failure
        blocks today. First candidate after rank 1 is GOAL-SCURVE-e33f7d (BN(2,254),
        the family's other positive-control row; first lane L-FIELD step F2, a
        sub-second polynomial evaluation).
    - rank: 3
      act: GOAL-ECQ-e72c0b recheck of IMP-1 (rank-32 curve over Q, Stage-A feasibility probe).
      justification: >-
        IMP-1's recheck asks whether a class-number/unit-group-capable environment
        is available. Sage 10.10 and PARI/GP were observed today, so the recheck
        condition may now be satisfiable. Clearing it still needs a goal-mode
        Coordinator environment-gate amendment, which this pass does not make.
        Ranked below the SCURVE family because it is not ECDLP-exponent work and
        its probe is costlier.
    - rank: 4
      act: /design-experiment on open ECC ideas (94 open; BINSTD 27, ECDLP 14, DREG 11, CERTBIN 10, ...).
      justification: >-
        Higher fit to the target profile than any SafeCurves audit (for example
        IDEA-20260913-11d3cb, a capped model-lever argument on the Hesse cubic, and
        IDEA-20260922-8278db, which claims a naive trace-zero extrapolation appears
        to break five ANSI binary curves and so needs a falsification design).
        Not done in this pass because the 94 ideas have not been ranked against
        each other here and the lane state of their owning goals was not checked;
        designing one unranked would be make-work. See the revisit condition.
    - rank: 5
      act: Goal-mode refresh of stale next_actions on GOAL-CRYPTO-001, GOAL-ECTD-001, GOAL-PATH-001, GOAL-SDEG-001,
        GOAL-MONO-001, GOAL-ENDO-001, GOAL-ECRANK-002, GOAL-ECQ-e72c0b, and GOAL-SCURVE-137bd9 (whose head
        next_action does not reflect its in-flight BATCH-a40709).
      justification: >-
        Their next_actions date from August or early September and several use
        language now forbidden or superseded (GOAL-ECQ-e72c0b "goal paused",
        GOAL-ECTD-001 "Pause this ... lane", GOAL-CRYPTO-001 "budget amendment
        beyond maximum_batches=13", GOAL-PATH-001 citing GOAL-MONO-001 as paused).
        Each needs its own goal-mode pass with that goal's evidence; rewriting
        them in bulk here would change next actions without reading their
        evidence. GOAL-ENDO-001's next_action (refresh EXP-JINV-bd141d) is a
        concrete Coordinator act and is the first of these to take up.
  rationale:
  - >-
    The eighteen SCURVE next_actions all ask the same question, so they get one
    portfolio decision. But the plans do not share a shape: they use different
    schemas and different first lanes (L02 T1, LANE-BASE, L00, L0, PRE-1, L5,
    L-RIGID C-R1, L4-ORDER-RECONCILE, A0, L-EQ/L-COMPLETE, a control-suite-first
    rule, A8, L-RIGID, L-FIELD F2, AD6, Stage 0 control registry). So each
    successor batch is opened separately, executing that plan's own lane, never
    a lane copied from another plan.
  - >-
    Only one batch is opened. That is the brief's bound, and it also follows the
    focus discipline in agents/coordinator.md: free capacity does not justify
    admitting another lane, and a completed experiment triggers reranking.
  - >-
    Within the L5 lane, the plan contradicts itself, and this decision settles it
    in advance. L5 lists CTRL-DECAY among its controls, but CTRL-DECAY measures
    how much of the discrete log the additive transfer recovers on toy curves.
    That means implementing the transfer, which L5's own stopping rule and
    capsule conflict C-4 forbid until one of the three source papers has been
    read in full. Resolution: CTRL-DECAY is deferred and recorded as not run.
    CTRL-NEG-2 (needs a CM construction) is optional within budget. The L5
    output is read only as "the documented precondition #E = p holds, or does
    not, for the stated tuple", which is the claim ceiling the plan itself sets.
  - >-
    The primary host for this curve's parameters is unreachable today, so the
    handoff orders the source routes in advance. First, raw primary-host fetch.
    Failing that, a raw archived capture with its URL, timestamp and sha256.
    Failing that, the capsule's proxy-transcribed digits, used only after the
    on-curve self-check passes and labelled as not primary-host-confirmed.
    Capsule conflict C-1 stays open until a primary-host fetch succeeds.
