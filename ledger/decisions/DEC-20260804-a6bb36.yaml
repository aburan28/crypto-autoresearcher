coordinator_decision:
  id: DEC-20260804-a6bb36
  goal_id: GOAL-SSI-001
  batch_id: BATCH-043
  recorded_by_task: TASK-20260803-fe7f69
  archived_by: TASK-20260803-fe7f69
  context: >-
    BATCH-043 experiment design and validation review for GOAL-SSI-001.
    TASK-20260803-ffda95 (idea-generator) designed EXP-SSI-S1 contract for
    SQIsign transcript leakage test satisfying RT-CTRL-001. TASK-20260803-b5ce08
    (validator) rendered REVISE with 2 required and 2 recommended corrections.
    All corrections applied (REV-1..4); contract now has honest power analysis.
  decision: approve
  decision_scope: >-
    Approve EXP-SSI-S1 for execution. The corrected contract satisfies
    RT-CTRL-001, is falsifiable, properly controlled, and honestly scoped.
    Power guarantee is conditional (≥0.95 concentrated, ~0.73 diffuse) and
    transparently stated. Advance to execution in BATCH-044.
  target_ids:
    - GOAL-SSI-001
    - EXP-SSI-S1
    - EV-SSI-fcda7e
    - TASK-20260803-ffda95
    - TASK-20260803-b5ce08
  evidence_ids:
    - EV-SSI-fcda7e
    - EV-SSI-0eb0b1
  rationale:
    - >-
      The validator confirmed 9/10 experimental soundness criteria PASS. The
      single FAIL (power analysis math) has been corrected with honest,
      pattern-conditional guarantees.
    - >-
      RT-CTRL-001 is now satisfied: exact statistic (chi2_7 on kernel-scalar
      residues mod 7), simulator (SIM-UNIFORM-KERNEL with 4 calibration
      criteria), parameters (p=6143, D=2^17, n=400/key, K=5, 3 runs),
      threshold (TV >= 0.05, alpha = 0.001 Bonferroni-corrected).
    - >-
      The experiment is honestly designed to expect a NEGATIVE result. The
      primary value is methodological validation and closure of the specific
      statistic/modulus/prime combination. A positive result would be
      surprising and motivate mid-scale follow-up.
    - >-
      Scope honesty is confirmed: toy_or_derivation_only evidence class; no
      claims about deployed SQIsign, key recovery, or cryptographic-scale.
  next_actions:
    - action: execute_experiment
      description: >-
        Execute EXP-SSI-S1 per the frozen contract: implement toy SQIsign
        (KLPT over quaternion algebra at p=6143), implement SIM-UNIFORM-KERNEL,
        run calibration, generate transcripts, compute chi2_7, report results.
        Three replicate runs with preregistered seeds.
      blocking: true
      condition: Contract frozen (preregistration manifest hashed before execution)
    - action: snapshot_and_review
      description: >-
        After execution, snapshot the run records and dispatch independent
        review. The review checks: run validity, calibration acceptance,
        statistical correctness, control consistency, and scope of any
        positive or negative finding.
      blocking: false
      condition: Execution completes (any outcome including infrastructure failure)
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Experiment design approval is not evidence; no result to promote. The
      approval records that the contract meets methodological standards, not
      that any cryptanalytic finding has been made. Knowledge promotion is
      warranted only after execution produces validated results.
  pareto_integrity:
    dominated_by: not_applicable
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      note: >-
        Experiment design approval; no algorithmic claim. The experiment tests
        whether a specific toy-scale statistic detects KLPT bias; it does not
        propose an attack or an improvement.
  claim_ceiling: theory
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition: "EXP-SSI-S1: specified -> approved"
  asymptotic_promotion_gates:
    proof_decomposition: not_applicable
    numbered_heuristics_validated: not_applicable
    concrete_cost_table: not_applicable
    independent_review_xhigh_and_red_team: not_applicable
    note: No asymptotic-complexity claim; gates do not apply.
  decided_by: coordinator
  decided_at: '2026-08-04'
