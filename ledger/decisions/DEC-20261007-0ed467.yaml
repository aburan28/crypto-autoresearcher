coordinator_decision:
  id: DEC-20261007-0ed467
  context: >-
    Pre-execution adversarial review of the committed P-192 weighted-CM v1
    design found feasibility, byte-contract, independence, checkpoint,
    producer/map/consumer ordering, and claim-boundary defects.  No scientific
    run exists.  Repository immutability requires an additive v2 amendment,
    never a rewrite of the committed v1 records.
  decision: approve
  execution_authorized: false
  amendment_path: experiments/EXP-SCURVE-1a8daf/amendments/protocol-amendment.v2.yaml
  protocol_version: 2
  target_ids:
    - RQ-SCURVE-42f1a3
    - IDEA-20261006-767793
    - H-SCURVE-ec34c4
    - EXP-SCURVE-1a8daf
  rationale:
    - >-
      The planned maximum eligible target bound is 113, not 4093.  The prior
      kernel/codomain artifact frontier through 43 is narrowly cited and does
      not satisfy this protocol's point-map, dual, subgroup, terminal, or cost
      gates; strict admitted map support is empty.
    - >-
      Exact stream/disposition roots, retained certificates, factor-base and
      coordinate manifests, saturated-kernel witnesses, and crash-safe
      checkpoints make producer output independently replayable.
    - >-
      A cost-blind structural panel followed by canonical exhaustive panel map
      attempts removes v1's circular dependency on costs that did not yet
      exist.  Raw HOT, COLD_TOTAL, and joint Pareto layers precede Q32 display
      ranking.
    - >-
      Pre-holdout map evidence uses the generic subgroup proof and G only.
      Planted-Q replay, the exact DLP consumer, the scalar cost estimand, and
      both isolated replication instances remain blocked behind another
      versioned amendment.
    - >-
      Approval freezes prospective v2 design bytes only.  It creates no run,
      observation, relation, map, timing, recovery, statistical estimate, or
      curve-weakness result.
  evidence_refs:
    - experiments/EXP-SCURVE-1a8daf/specification.yaml
    - experiments/EXP-SCURVE-1a8daf/amendments/protocol-amendment.v2.yaml
    - experiments/EXP-SCURVE-1a8daf/amendments/specification.v2.yaml
    - research/p192-weighted-cm-20261007-v2/run-family.yaml
    - research/p192-weighted-cm-20261007-v2/REPORT.md
    - https://github.com/aburan28/crypto/blob/aea4dbb0983a37f6463fdbde96e6884871586357/research/isogeny_walk_p192_20261004/runs/p192-ell61-radius2/isogeny_routes.json
    - https://github.com/aburan28/crypto/pull/1507
    - https://github.com/aburan28/crypto-autoresearcher/pull/1942
  limitations:
    - Version 1 remains immutable and nondispatchable; v2 supersedes only future protocol use.
    - The native producer, isolated verifier, explicit map evaluator, optimizer panel, supervised wrapper, and consumer amendment do not yet exist in admitted form.
    - Roles 7 and 8 have null argv; the entire family has dispatch_status blocked_pending_implementation_and_fresh_decision.
    - No scientific search, map census, timing, ECDLP recovery, or replication has run.
    - Missing implementation or resource exhaustion is INCOMPLETE, never evidence that P-192 is strong.
    - No knowledge finding or weak-curve assertion is warranted.
  next_actions:
    - Implement a new native weighted-CM producer without modifying the prior frozen experiment implementation; exercise REF-0 and synthetic controls only in the implementation PR.
    - Implement a separately built verifier sharing no factorization, ideal, HNF/SNF, or certificate-replay code with the producer.
    - Admit exact point evaluators, duals, subgroup/terminal certificates, and cost records degree-by-degree; the protocol-freeze map manifest remains empty.
    - Freeze a versioned exact-consumer amendment and two distinct replication environments before roles 7 or 8 receive argv.
    - Commit a fresh dispatch decision naming exact clean protocol and implementation commits before allocating any RUN id.
  knowledge_promotion:
    promoted: []
    not_warranted: Protocol amendment only; all result fields are empty.
  decided_by: coordinator
  decided_at: '2026-10-07'
