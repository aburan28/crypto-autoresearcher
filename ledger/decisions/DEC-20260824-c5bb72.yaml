      SINGLE READY ACTION, AND IT IS THE ONE PRESERVED ON THE GOAL HEAD: OPEN BATCH 3
      WITH ONE EXECUTOR TASK THAT COMPUTES THE MEMBERSHIP KEY'S FUNCTIONAL-DEPENDENCY
      GRAPH AND USES IT TO RE-READ EVERY VERDICT THIS BATCH REPORTS, THEN -- GATED ON
      THAT OUTPUT AND INSIDE THE SAME TASK -- ADJUDICATES ONLY THE OFF-DIAGONAL CELLS
      OF THE FAMILY-BY-ROW MATRIX AGAINST THE HONEST INSTRUMENT AND AGAINST ONE
      KNOWN-FALSE INSTRUMENT.
      CONCRETELY. (1) A static, zero-charged-run analysis of the committed serialiser
      per primitive that outputs, for each ordered pair of key components, whether one
      is a function of the other, and re-partitions every depth-1 verdict into
      PROVABLY UNDETECTABLE BY ANY FAMILY, NOT PROBED BY A DECLARED FAMILY, PROBED AND
      GENUINELY NOT DETECTED, and, for the DETECTED rows, ENTAILED BY THE PERTURBING
      FAMILY'S DECLARATION versus CONTINGENT ON THE INSTRUMENT. THIS BATCH'S ANSWERS
      OVER THE SIX DEPTH-1 ROWS ARE: provably undetectable 1 (in_linearized_code), not
      probed 3 (primitive, length, block_index), probed and genuinely not detected 0,
      entailed by construction 1 (message_difference), and contingent on the instrument
      1 (step_delta) -- which sums to the six rows and is stated as a PARTITION rather
      than as a fraction. Reproducing or refuting that partition FROM THE GRAPH ALONE
      is the task's first deliverable and its own falsification test.
      (2) It then names the depth-2 subsets that BREAK a
      dependency -- measured here to be exactly one, which is already row 5 -- so the
      fifteen-subset lattice is bought by argument rather than by compute. (3) Only
      then, and only on the OFF-DIAGONAL cells the graph marks as capable of carrying
      information, the family-by-row matrix is run twice, once against the honest
      instrument and once against the per-primitive-blind instrument, and the COUNT OF
      DIFFERING CELLS is reported as the honest scalar version of what the
      strengthening bought. TWO OUTCOMES ARE PRE-DISTINGUISHABLE: identical matrices
      mean the profile is a function of the families' construction and of the
      dependency graph and carries no information about the instrument; any differing
      cell is a place where a verdict is contingent on the instrument.
      WHY THIS AND NOT THE RED TEAM'S OWN FIRST CHOICE IS ARGUED IN
      `next_action_ranking`, AND THE CHOICE IS THIS COORDINATOR'S AND NOT AN ADOPTION.
      IT NEEDS NO ACQUISITION, NO SEARCH, NO NEW SEED SET AND NO INSTRUMENT REPAIR, and
      its first stage consumes no charged run at all.

