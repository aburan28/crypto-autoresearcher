coordinator_decision:
  id: DEC-20260824-c5bb72
  id_provenance: >-
    PRE-ALLOCATED AND VERIFIED FREE BY THE DRIVING SESSION with tools/allocate_id.py
    and transmitted to this coordinator subagent, WHICH HAS NO SHELL AND MINTED
    NOTHING. It was reserved for this close at the BATCH-efcae7 opening and is
    distinct from DEC-20260824-ad098e (the opening decision) and from
    DEC-20260824-e238c1 (the snapshot and review-opening decision). This session holds
    exactly two ids, EV-DIFFP-b16b01 and DEC-20260824-c5bb72, and mints no other.
  title: >-
    Close BATCH-efcae7: the strengthened control suite reproduces under run
    discipline and its artifact and control integrity is independently confirmed,
    and its per-component power profile is almost entirely entailed by the control
    families' own construction and by the membership key's functional-dependency
    graph. Every integer reproduces; the reading of those integers does not survive.
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  batch_id: BATCH-efcae7
  experiment_id: EXP-DIFFP-4b165f
  round: 2
  filed_at: '2026-08-24'
  filed_by: TASK-20260824-b3e02b (isolated content_first ledger archive, runs alone)

  context: >-
    TASK-20260824-9a489e is terminal with five of five runs completed_valid against
    the five-run plan of the frozen contract EXP-DIFFP-4b165f, approved by the
    committed decision DEC-20260824-ad098e before the producer ran.
    TASK-20260824-7175d9 archived that package under a content_first snapshot,
    ALONE, and wrote the round-2 review plan; DEC-20260824-e238c1 recorded that
    binding and opened the round. Two sibling-blind independent reviewers then ran
    concurrently on thirteen owned joints: TASK-20260824-b61d11 (validator, J1 to J7)
    and TASK-20260824-e9d21a (red team, J8 to J13). BOTH ARE TERMINAL. This decision
    composes them into one ruling at the exact tested scope, files EV-DIFFP-b16b01,
    checkpoints the goal head, and closes the batch.

  decision: weaken

  decision_label_reasoning: >-
    `weaken` IS THE HONEST LABEL AND EVERY ALTERNATIVE IS NAMED WITH THE REASON IT
    LOSES. THE FIRST QUESTION IS WHETHER A SECOND CONSECUTIVE `weaken` IS HONEST OR
    IS A HABIT, AND IT IS ANSWERED FIRST BECAUSE IT IS THE ONE A LATER READER WILL
    ASK.
    IT IS A DIFFERENT PROPOSITION, ONE LEVEL UP, AND THAT IS EXACTLY WHY IT MATTERS.
    DEC-20260824-af6d5c weakened "the declared control suite validates the
    adjudicator as an instrument". THIS DECISION WEAKENS "AN ABLATION BATTERY OVER
    THE SERIALISED MEMBERSHIP KEY MEASURES THE CONTROL SUITE'S POWER PER COMPONENT"
    -- which is the `resource_check` reading EV-DIFFP-b878aa called the most useful
    thing in that record, which DEC-20260824-af6d5c ranked FIRST against four
    alternatives, and which this batch exists to execute. The second weaken is
    therefore the deflation of the FIX, not a repetition of the diagnosis, and it is
    a strictly more informative result than the first: round 1 replaced a pass with a
    fraction, and round 2 measures that the fraction is very largely a property of
    the ablation lattice and of the perturbing families rather than of the instrument.
    A Coordinator who took the same label twice for the same reason would be running
    in place; taking it twice for reasons one level apart is what a search that is
    working looks like.
    `support` IS UNAVAILABLE ON TWO INDEPENDENT GROUNDS AND WOULD BE WRONG ON THE
    MERITS EVEN IF IT WERE AVAILABLE. The claim ceiling is `analyzed` for structural
    reasons; and nothing this round produced is a result to support. A control suite
    that responds to a deletion it did not respond to before is a better instrument,
    A PASSING CONTROL IS NOT A CRYPTANALYTIC IMPROVEMENT, and three of the six joints
    that bear on the reading broke.
    `reject_scoped` IS REFUSED FOR TWO SEPARATE REASONS, EITHER OF WHICH SUFFICES,
    AND THE TEMPTATION WAS REAL. (i) THERE IS NO STANDING CLAIM TO REJECT. The
    producer explicitly composed no verdict on whether the instrument is validated,
    on whether the strengthened suite is sufficient, or on either primitive's
    difference space, and the Red Team states in its own words that "THE BREAK IS
    THEREFORE AGAINST A READING THE CLOSE COULD ADOPT, NOT AGAINST THE PACKAGE'S OWN
    STATEMENTS". Manufacturing a claim in order to reject it would be the mirror image
    of overclaiming and is refused as such. (ii) THE SCOPED REJECTION THAT IS
    ARGUABLY AVAILABLE -- that the strengthened suite has NO measured power over the
    message-difference component on either primitive -- RESTS ON UNREPLICATED
    ADVERSARIAL CONSTRUCTIONS. The five surviving known-false instruments were built
    once, by one session, and no second session re-ran them (EV-DIFFP-b16b01 UC-2).
    docs/claims-and-verification.md and this role's contract forbid `reject_scoped`
    on an unreplicated empirical basis and name the route as `weaken` plus
    replication. The integers are replicated three ways; the counterexamples are not,
    and the difference is exactly what the next action buys.
    `inconclusive` IS REFUSED AND SAYING SO PLAINLY MATTERS. The evidence
    discriminates sharply and in a stated direction: it distinguishes verdicts
    entailed by construction from verdicts that are theorems of the key's dependency
    graph from verdicts that record that nobody looked, and it locates the one
    contingent row. Calling that inconclusive would understate a result, which is the
    failure symmetric with overclaiming.
    `revise` WAS CONSIDERED SERIOUSLY, because the instrument does need a named
    repair. It is refused as a MISLABEL: `revise` disposes of a proposal or a
    contract, and what is before this decision is a reviewed evidence package. The
    revision is real and travels in `next_actions` and in the successor gates, where
    a reader will find it.
    `replicate` WAS CONSIDERED AND IS REFUSED because it would assert that the
    round's findings are in doubt pending a re-run. They are not: three
    implementations produced the load-bearing integers and every comparable one
    agrees. What is unreplicated is the ADVERSARIAL CONSTRUCTION, and that is named
    in the next action rather than promoted to the decision's label.
    `supersede` WAS CONSIDERED AND IS THE CLOSEST RIVAL, because this batch's
    measurement does supersede EV-DIFFP-b878aa's obstruction block. It is refused as
    the decision LABEL because supersession is a RELATION BETWEEN RECORDS and is
    discharged inside EV-DIFFP-b16b01, whose `obstruction.supersedes` field states it
    by reference and edits nothing. Using it as the disposition would hide the
    substantive finding behind a bookkeeping relation.
    `pause` IS NOT TAKEN. No pause_condition of GOAL-DIFFP-84d641 is met: the
    campaign budget is not exhausted, the acquisition lane is blocked and not
    unpopulatable, the equivalence has a verified generating set, no infrastructure
    blocker exists, and -- stated affirmatively rather than by silence -- THE
    SOLVER-VALIDATION HANDOFF DOES NOT FIRE. See `cross_goal_handoff`.
    `approve` and `expand` are procedural and do not dispose of a reviewed package.

