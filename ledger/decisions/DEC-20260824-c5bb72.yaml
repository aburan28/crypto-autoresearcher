  # ======================================================================
  # 1. THE VALIDITY CHECK, RECORDED BEFORE ANY INTERPRETATION
  # ======================================================================
  validity_check_before_interpretation:
    where_it_lives_in_full: ledger/evidence/EV-DIFFP-b16b01.yaml `validity_check_before_interpretation`
    ordering_statement: >-
      IT WAS RUN AND RECORDED BEFORE THIS DECISION INTERPRETED ANYTHING, AND ITS
      OUTCOME COULD HAVE ENDED THE CLOSE. Had any item failed, the disposition would
      have been to return the run set to the Executor with the concrete defects
      listed, as INFRASTRUCTURE SIGNAL and never as a mathematical result.
    items:
      expected_run_count: FIVE DECLARED, FIVE EXIST, NO UNDECLARED SIXTH. 35 files, 35 run-index keys, key set equal to tree set. PASS.
      manifest_schema_completeness: >-
        PASS, with one INHERITED artifact-policy gap located rather than asserted:
        each manifest's own inference block is wrong because harness/runner.py defines
        it twice, and the AGENTS.md fields live complete in each run's
        manifest-supplement.yaml. Satisfied by the pair of files, not by the manifest
        alone. IR-2 forbids this batch from repairing it.
      seed_integrity: EIGHT DECLARED, EXACTLY EIGHT PRESENT IN EVERY MANIFEST, NO NINTH ANYWHERE IN ANY INPUTS SUBTREE. PASS.
      raw_versus_summary_agreement: >-
        PASS ON EVERY VALUE COMPARED -- twenty metrics independently recomputed from
        the raw construction, all agreeing -- AND THE CLASS OF SWEEP THAT FOUND ROUND
        1's TWO DEFECTIVE INTEGERS WAS NOT RUN. Recorded as a gap in this round's
        checking, not as a defect in the package. Two DESCRIPTION defects were found
        by reading and neither changes an integer or a verdict.
      ctl_frozen_before_after_identity: 13 OF 13 IDENTICAL, 0 CHANGED, RECOMPUTED IN ALL FOUR TREE-AND-COMMIT COMBINATIONS. PASS.
      control_comparability: >-
        PASS FOR THE ABLATION ROWS -- drop_set is the only thing that varies, verified
        from source, with a 22880-call self-check at 0 mismatches -- AND REFUTED FOR
        THE DETECTION RULE'S ARM COVERAGE, which reads the family-(d) primary arm
        only. That is a scope defect in the rule and not a validity defect in the runs,
        and it is where the round's load-bearing break lives.
    ruling: >-
      THE RUN SET IS VALID AND IS EVIDENCE. It is not returned to the Executor. The
      producer stated its own limits unprompted, declared four deviations, and
      composed no verdict, which is the correct behaviour and is recorded as such.

  # ======================================================================
  # 2. THE COMPOSED RULING
  # ======================================================================
  composed_ruling:
    composition_rule: >-
      COMPOSE, DO NOT COUNT. Each reviewer's scalar `verdict` is a lossy rollup the
      independence checker's schema requires, and both reviewers said so in their own
      words and asked that the per-joint maps govern. THEY DO. The Validator's
      `passed` and the Red Team's `breaks` ARE NOT WEIGHED AGAINST EACH OTHER: the two
      were asked different questions and their answers do not conflict. The full
      per-joint map with each joint's scope is EV-DIFFP-b16b01
      `composed_joint_disposition`.
    per_joint:
      J1: holds -- reproduction to exact integers, 32 of 32 in a fresh process; seeds inside the declared eight; no undeclared run directory; the pre-run probe ruled not to damage the pre-registration on a stated reason
      J2: holds, with a named coverage gap -- the ablations are genuine and the fast membership path cannot diverge from full adjudication on any object class; the contract-required inside-versus-outside comparison ran only where it cannot fire
      J3: holds, with its own epistemic value narrowed by its owner -- all six rows reproduce against round 1's own record, and the six rows cannot distinguish the two ablation mechanisms
      J4: holds -- attribution recomputed for all 5200 primary-arm draws, every cell agreeing set-for-set; the SHA-1 per-k answer given explicitly at every k including k equal to 1
      J5: holds -- T1 to T5 met on both sides, capacity to fail demonstrated by construction, the k equal to 0 arm genuinely adjudicated and honestly labelled a weak positive, and D-VD3-PROFILE's missed pre-registration kept separate from its confirmed mechanism
      J6: holds -- no units mismatch in the artifact the pre-registration is scored against, all three pre-registered generator claims verified from source and from measurement, action kept distinct from verification status
      J7: holds, with two first-class findings inside it -- the undeclared fifth deviation on the CTL-FROZEN criterion set, and one overstated emitted field
      J8: breaks -- five known-false instruments pass every arm the detection rule reads, localised to one line of committed code
      J9: holds -- the obstruction reversal succeeded and produced a statically computable object, the key's functional-dependency graph
      J10: holds, with two narrow objections -- no sentence in any batch artifact closes more than its measurement supports, established by search rather than by absence of effort
      J11: breaks -- family (d)'s primary arm never moves the SHA-1 message difference without also moving the flag, and the isolating sub-arm is never carried into the battery
      J12: holds -- a named budgetable distinguishing control with two integer-distinguishable outcomes, plus an object outside the contract's expressible class
      J13: breaks -- the headline is a restatement on MD5 and a silence on SHA-1, failing to be a power result for two different reasons
      proves_too_much: >-
        THE ARGUMENT PROVES TOO MUCH. Correctly refused on O-A, O-A-prime and O-B;
        SURVIVES on O-E, O-D, O-C, O-C-prime and O-C-double-prime. AND THE PLAN'S
        CANDIDATE LIST DID NOT BOUND THE PASS -- O-RT2, O-RT2-prime and O-RT3 were not
        on it, and O-RT2 lies outside the class the contract's lattice can express.
      blind_rederivation: >-
        DECLARED UNSATISFIABLE AND REPLACED BEFORE THE ROUND RAN, AND THE REPLACEMENT
        WORKED. Both reviewers produced a written pre-read value and both matched the
        producer exactly, by different routes. Corroboration, not proof of
        independence: it rests on an honest report of read order that no tool here can
        check.
    the_one_finding_neither_reviewer_could_have_made_alone: >-
      BOTH REVIEWERS, MUTUALLY BLIND, LOCATED THE SAME ONE LINE OF COMMITTED CODE AND
      READ IT IN OPPOSITE DIRECTIONS, AND BOTH READINGS ARE CORRECT. The battery's
      detection rule reads a store written only by family (d)'s PRIMARY arm. The
      Validator verified that this satisfies a contract requirement, because it keeps
      the D-VD3-PROFILE defect-profiling arm out of every pass/fail verdict. The Red
      Team verified that the SAME line also excludes D-SHA1-INCODE, which no contract
      term required to be excluded and which is the only construction in the package
      that isolates the SHA-1 message difference from the flag. ONE DESIGN CHOICE, ONE
      INTENDED CONSEQUENCE AND ONE UNINTENDED ONE, and the unintended one is the step
      at which a known-false instrument survives the suite. THIS IS WHAT COMPOSITION
      IS FOR, and it is the strongest argument in this program's record for paying for
      two blinded reviewers rather than one.
    the_headline_at_the_exact_tested_scope: >-
      AT THE EIGHT DECLARED SEEDS, OVER THE 16-ENTRY SYNTHETIC SHADOW CENSUS (8 MD5
      ALL CARRYING A WEIGHT-1 MESSAGE DIFFERENCE THAT NO REAL MD5 COLLISION
      CHARACTERISTIC HAS, 8 SHA-1 ALL IN THE LINEARIZED CODE), WITH A READABLE CENSUS
      OF ZERO ENTRIES, IN STRICT MODE, AGAINST FOUR DECLARED NULL FAMILIES AND THE
      COMPLETE DEPTH-1 ABLATION LATTICE PLUS TWO DECLARED MULTI-DELETIONS: adding
      CTL-NULL-D changes the battery's verdict from NOT DETECTED to DETECTED on
      exactly two rows, both of which delete precisely the set of key components that
      family (d)'s own perturbation moves, and on both of which the change is entailed
      by the perturbation's declaration rather than contingent on the adjudicator. The
      MD5 half of that change is a restatement of the family's construction; the SHA-1
      half of the primary arm contributes zero members and shows instead that the arm
      never moves the SHA-1 message difference without also moving a deterministic
      function of it. An instrument blind to block_index, or to any of three named
      components simultaneously, or to the message difference on SHA-1 alone, passes
      every arm the detection rule reads. THEREFORE: THE STRENGTHENED SUITE IS A
      BETTER INSTRUMENT THAN THE OLD ONE IN THE NARROW AND HONEST SENSE THAT ITS
      OUTCOME RESPONDS TO A DELETION THE OLD ONE DID NOT RESPOND TO, AND NO STATEMENT
      OF THE FORM "THE NULL NOW HAS POWER OVER THE PRIMARY DATUM OF A DIFFERENTIAL
      CHARACTERISTIC" IS SUPPORTED BY THESE MEASUREMENTS ON EITHER PRIMITIVE. Nothing
      here bears on MD5's or SHA-1's difference space, on any published
      characteristic, on novelty, or on the security of any deployed system.
    what_is_NOT_broken_and_is_stated_first_so_it_is_not_lost: >-
      NOT ONE INTEGER. Every value two independent sessions could compare reproduced
      exactly under a second and a third implementation. The package is artifact-sound
      under run discipline for the first time in this goal; the adjudicator is still
      not shown to be wrong on any object for which a known answer exists; its
      two-sidedness is now demonstrated by construction rather than asserted; and the
      producer's own row-2 prose already states the MD5-only split in capitals. THE
      BREAK IS AGAINST A READING, NOT AGAINST A MEASUREMENT AND NOT AGAINST THE
      PRODUCER.

  # ======================================================================
  # 3. THE PER-COMPONENT POWER TABLE, OLD AND STRENGTHENED SEPARATELY
  # ======================================================================
  per_component_power_table:
    reporting_rule: >-
      IR-10. A TABLE, NEVER A PASS AND NEVER A BARE FRACTION. GROUP 1 (the six
      declared replication rows) IS NEVER CONFLATED WITH GROUP 2 (the depth-1 lattice
      extension). Census completeness stated beside every verdict: readable 0,
      quarantined_not_read 1, acquisition_gap 8, NEVER SUMMED, with shadow_planted 16
      carried separately. WITH A READABLE CENSUS OF ZERO, NO VERDICT BELOW CARRIES ANY
      INFORMATION ABOUT THE LITERATURE AND NONE IS NOVELTY.
    full_table_with_every_integer: ledger/evidence/EV-DIFFP-b16b01.yaml `per_component_power_profile`
    group_1_summary_old_suite: >-
      DETECTED on row 3 (step_delta deleted, 6 strict false positives of 3000) and row
      6 (everything but primitive and length deleted, 3000 of 3000). NOT DETECTED on
      rows 1, 2, 4 and 5. This reproduces EV-DIFFP-b878aa O-7 exactly, on all six rows
      and all twelve integers, under a DIFFERENT ablation mechanism.
    group_1_summary_strengthened_suite: >-
      DETECTED on rows 2, 3, 5 and 6. The two rows that CHANGED are row 2
      (message_difference, at 2600 of 2600 MD5 draws and 0 of 2600 SHA-1 draws) and
      row 5 (message_difference with in_linearized_code, at 2600 of 2600 on each
      primitive). Row 4 (in_linearized_code alone) remains NOT DETECTED.
    group_2_summary_old_suite: >-
      DETECTED on step_delta alone. NOT DETECTED on primitive, length,
      message_difference, block_index and in_linearized_code.
    group_2_summary_strengthened_suite: >-
      DETECTED on message_difference and step_delta. NOT DETECTED on primitive,
      length, block_index and in_linearized_code.
    the_column_that_is_new_this_round_and_is_the_point: >-
      A DETECTED OR NOT DETECTED VERDICT IS NOT SELF-INTERPRETING, AND THIS ROUND
      MEASURED WHAT EACH ONE IS DUE TO. Of the six depth-1 components:
      CONTINGENT ON THE INSTRUMENT -- 1: step_delta, and the OLD suite already had it.
      ENTAILED BY A FAMILY'S OWN PERTURBATION DECLARATION -- 1: message_difference,
      DETECTED on MD5 by construction and not a deletion at all on SHA-1.
      A THEOREM OF THE KEY'S FUNCTIONAL-DEPENDENCY GRAPH -- 1: in_linearized_code,
      provably undetectable while message_difference is in the key, confirmed on 960
      objects with zero exceptions.
      NOT PROBED BY ANY DECLARED FAMILY -- 3: primitive, length, block_index. For
      these three, NOT DETECTED MEANS THE SUITE DID NOT LOOK, and for block_index it
      is now measured to be a real blind spot rather than merely unprobed.
      PROBED AND GENUINELY NOT DETECTED -- 0.
    what_the_strengthening_bought_stated_without_a_fraction: >-
      TWO ROWS CHANGED VERDICT AND ZERO CONTINGENT ROWS WERE ADDED. A better
      instrument in the narrow and honest sense that its outcome responds to a
      deletion the old one did not respond to. NOT A CRYPTANALYTIC IMPROVEMENT, NOT A
      RESULT ABOUT MD5 OR SHA-1, AND NOT NOVELTY. A PASSING CONTROL IS NOT AN
      IMPROVEMENT.
    components_that_remain_unprobed_by_name: >-
      primitive, length and block_index at depth 1; every depth-2 subset except the
      one declared multi-deletion, of which fifteen exist and three further blind
      instruments are measured to pass; every depth-3 subset, of which one is measured
      to pass; permissive mode for the family-(d) column, recorded as NOT MEASURED
      rather than as zero; and every seed set other than the eight declared.

  # ======================================================================
  # 4. THE PRIOR, SCORED ITEM BY ITEM
  # ======================================================================
  prior_scoring:
    sources: >-
      Part 1 (P-1 to P-5 and the one-sentence review-round prior) from
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml `prior`,
      carried forward verbatim into the sealed prior and NOT EDITED. Part 2 (A-1 to
      A-6) from
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/sealed-prior/coordinator-prior-round-2.yaml,
      written after the package existed and before either reviewer was dispatched.
    the_seal_and_its_measured_residual: >-
      WIDER THAN THE ROUND'S OWN DISCLOSURE, AND THIS CORRECTS IT RATHER THAN
      REPEATING IT. PDV-3 and the sealed prior both disclosed that P-1 to P-5 sit
      inside batch.yaml, which is in both reviewers' read scope, and asked the close to
      discount the VALIDATOR's concurrence accordingly. MEASURED FROM THE
      ATTESTATIONS: NEITHER REVIEWER READ batch.yaml. The Validator lists it under
      sources it was entitled to read and did not, buying back independence the
      embedding would have spent; the Red Team declined it deliberately so that its
      J11 and J13 rulings could not be a confirmation of P-2. BUT THE ONE-SENTENCE
      PRIOR IS INSIDE review-plan.yaml, WHICH THE CHECKER REQUIRES TO BE NON-EMPTY AND
      WHICH BOTH REVIEWERS LIST IN sources_read, AND IT NAMES THE in_linearized_code
      MECHANISM. SO THE DISCOUNT APPLIES TO BOTH REVIEWERS AND NOT ONLY TO ONE.
      WHAT SURVIVES THE DISCOUNT, WHICH IS MOST OF THE VALUE: the DERIVATIONS and the
      INTEGERS are independent of the prior. One reviewer re-implemented the
      projection and measured 0 of 2600 perturbed vectors remaining in the code; the
      other derived GF(2)-linearity, predicted the breadth in advance, and committed
      the derivation with a timestamp sixteen minutes before its first read of the
      producer's directory. And every finding bearing on the SEALED addendum -- the
      breadth at k equal to 1, the per-primitive split, O-RT2 -- is independent of it,
      because neither reviewer read it.
      THE ASYMMETRY IS THEREFORE REAL BUT NARROWER THAN INTENDED: the Red Team is
      independent of the item-by-item prior and of the addendum, and is NOT independent
      of the plan's one-sentence version. Its J11 and J13 are weighted accordingly:
      J11's DIRECTION is discounted, J11's BREADTH and J13's SHAPE are not, and J13's
      shape is the item the prior got wrong.
    part_1:
      P_1:
        held: STRONG
        outcome: MET IN FULL
        measurement: >-
          CTL-REPRO exact agreement 32 of 32 with zero disagreements, reproduced
          independently in a fresh reviewer process; E6 step_range (0,0)
          conditions_satisfied at 2089 of 4096, EQUAL TO THE PRE-REGISTERED CORRECTED
          VALUE and not the 2094 that BATCH-f8bf86's execution report states in three
          places. First confirmation of CORR-20260824-e0088c under a charged run AND
          independently.
        one_wording_correction_recorded_rather_than_absorbed: >-
          P-1 says "the seven declared seeds". The contract declares EIGHT (PD-B added
          84064107). The reproduction set is the seven-seed subset and the eighth seed
          drives family (d); the prediction is met as intended and its wording
          undercounts the envelope by one.
      P_2:
        held: STRONG ON THE HEADLINE, and recorded at the time as the prediction trusted least as evidence
        outcome: SPLIT -- TWO CLAUSES MET AND EXCEEDED, ONE CLAUSE MATERIALLY OVERTURNED
        clause_a_two_sidedness: >-
          MET. Family (d) returns MEMBER on 16 of 16 k equal to 0 draws and NON-MEMBER
          on 0 of 5200 k greater than or equal to 1 draws against the honest
          adjudicator, on both primitives, independently reproduced.
        clause_b_the_sharpest_new_prediction: >-
          MET AND EXCEEDED IN BREADTH. P-2 scoped the flag confound to large k. It
          holds at EVERY k INCLUDING k equal to 1: the flag moves on 2600 of 2600
          SHA-1 primary-arm draws and the attribution is `message_difference` alone on
          0 of 2600 at every k. Both reviewers measured it and one derived it in
          advance from GF(2)-linearity. This is a statement about the CONSTRUCTION, not
          about how far a perturbation travels: THE SHA-1 PRIMARY ARM NEVER HAD AN
          ISOLATING DRAW.
        clause_c_the_honest_headline_P_2_proposed: >-
          MATERIALLY OVERTURNED, AND THIS IS A FIRST-CLASS FINDING. P-2 proposed that
          the honest headline is "family (d) probes the message difference on MD5 at
          every k and on SHA-1 only in the in-code sub-arm". The first half is now
          measured to be a RESTATEMENT of the family's own construction rather than a
          probe of anything (J13), and the second half is measured to bind NOTHING,
          because the sub-arm never enters the battery's detection rule (J8, J11). P-2
          got the LOCATION right and was wrong about what the location buys.
      P_3:
        held: MODERATE, DELIBERATELY NOT STRONG
        outcome: MET EXACTLY, AND ITS STATED EPISTEMIC VALUE OVERTURNED
        measurement: >-
          All six rows reproduce their pre-registered values: 96/96 CTL-PLANT on six of
          six, and strict false positives 0, 0, 6, 0, 0 and 3000 of 3000. Checked
          against EV-DIFFP-b878aa O-7 ITSELF and not only against the contract's
          transcription, which is faithful on all six rows and all twelve integers.
        why_the_epistemic_value_is_overturned: >-
          P-3 was held only moderately because a disagreement would have localised to
          the MECHANISM. The Validator establishes that no disagreement was possible:
          projecting inside the minimisation over the identical variant list with an
          order-preserving name filter IS THE SAME FUNCTION as deleting the pair from
          the serialiser and minimising. The rows are jointly insensitive to the
          mechanism difference the contract declared them to be a check on, so the
          equivalence is established BY READING THE CODE and the rows add nothing to
          it. The reason for holding P-3 moderately was itself unfalsifiable.
      P_4:
        held: STRONG ON DIRECTION, WEAK ON THE INTEGER
        outcome: VERDICTS MET, MECHANISM OVERTURNED, AND THE FREE SUCCESSOR IT NAMED IS UNSAFE AS SPECIFIED
        verdicts: >-
          MET. The strengthened suite DETECTS the message_difference deletion and does
          NOT detect the in_linearized_code deletion.
        mechanism_overturned: >-
          P-4 gave the reason for row 4 as "no declared family perturbs the flag on an
          otherwise-matching object". THE REAL REASON IS FUNCTIONAL DEPENDENCE, and it
          is stronger and different: `in_linearized_code` is by definition a function
          of the disturbance vector, measured on 960 objects with zero exceptions, so
          row 4's NOT DETECTED IS A THEOREM AND CANNOT BE MOVED BY ANY FAMILY WHILE
          message_difference IS IN THE KEY. A coverage gap and a provable impossibility
          are different findings and a close that composed them would lose the round's
          most reusable output.
        P_4s_refusal_to_report_a_fraction_was_right: >-
          RECORDED AS MET. P-4 declined "3 of 5" as the wrong shape and demanded a
          per-component report. That instinct is vindicated more strongly than it
          anticipated: the honest replacement is not a different fraction but a
          PARTITION of the six rows by what each verdict is due to.
        the_free_successor_is_unsafe_as_specified: >-
          P-4 named null family (e) -- a planted SHA-1 entry with the flag flipped and
          everything else held fixed -- as something that "would detect that ablation on
          its first draw". It would, and THE DETECTION WOULD MEAN NOTHING: by the same
          functional dependence, such an object's redundant fields contradict each
          other, which is round 1's own malformed-object failure recurring at the
          family level. THE DIRECTION IS NOT CLOSED. Its revisit condition is amended to
          require a well-formedness gate, which is the already-open OBJ-10.
      P_5:
        held: STRONG
        outcome: MET IN FULL, INCLUDING THE PART IT EXPLICITLY DECLINED TO PREDICT
        measurement: >-
          Per object: E4 0 images on all 16 entries, E5 0 on all 16, E4 with E5 0 on
          all 16, E3 1 on all 16, E1 8 on each SHA-1 entry and 0 on each MD5 entry --
          verified from source as well as measured, since the committed orbit-image
          function has no branch for E4 or E5. E5 changes no serialised key and no
          verdict, and its only read site is unreachable from the serialiser or the
          canonicaliser. E4's only key effect is a REMOVAL.
        the_question_P_5_wanted_measured: >-
          ANSWERED, AND THE ANSWER IS NO. Over 165 objects E4 changes exactly 1 verdict
          in each mode and that object is the T3 boundary decoy; E5 changes 0. For
          contrast on the same set: E1 64, E3 16, E2 4, E6 2, the strict set 81. The
          group doing observable work is E1 with E3 plus exactly one boundary object,
          reported as a measurement over 165 objects at these seeds and NOT as a
          statement about the equivalence in general.
      review_round_prior_one_sentence:
        text_scored: >-
          Expected the review to CONFIRM the reproduction (P-1, P-3, P-5) and to BREAK
          the reading that family (d) measures the message difference ON SHA-1 (P-2),
          composing to `analyzed` with the null's power measured per component.
        outcome: >-
          MET IN SUBSTANCE AND UNDERSHOT IN SEVERITY, WHICH IS THE MOST INFORMATIVE
          THING THIS ITEM COULD HAVE DONE. The reproduction was confirmed and the SHA-1
          reading was broken, both as predicted. WHAT THE PRIOR DID NOT ANTICIPATE AT
          ALL IS THAT THE MD5 READING BREAKS TOO, and for a different reason. The prior
          expected a ONE-SIDED break and the round returned a TWO-SIDED one. The
          composed verdict is `analyzed` as predicted, and the per-component power it
          predicted would be measured is measured to be very largely not about the
          instrument.
    part_2_the_sealed_addendum:
      A_1:
        expectation: The flag confound confirmed as arithmetic and holding MORE WIDELY than P-2 scoped it, at every k including k equal to 1.
        outcome: >-
          MET EXACTLY, IN DIRECTION AND IN BREADTH, AND MEASURED INDEPENDENTLY BY BOTH
          REVIEWERS NEITHER OF WHOM READ THIS ADDENDUM. Its falsifier -- any SHA-1
          primary-arm rejection at any k attributed to the message difference alone --
          did not occur: 0 of 2600. A-1's own distinction between "a confound at large
          k" and "a confound at k equal to 1" is confirmed to be the material one.
      A_2:
        expectation: >-
          Expected the proves-too-much joint to SUCCEED, expected the cheapest such
          instrument to be a lossy function of the message difference or a
          per-primitive-blind one, and recorded the fear that the pass would be BOUNDED
          BY THE PLAN'S IMAGINATION.
        outcome: SPLIT THREE WAYS, AND THE FEAR IS OVERTURNED IN THE GOOD DIRECTION.
        detail: >-
          (i) The joint DID succeed: five known-false instruments pass every arm the
          detection rule reads. MET.
          (ii) The per-primitive-blind guess was RIGHT and is the strongest surviving
          object, and it was on the plan's own list, so its value is discounted exactly
          as A-2 required.
          (iii) The LOSSY guess was WRONG AND WAS REFUTED BY MEASUREMENT: an
          adjudicator keyed on the set of differing word indices is refused by 29 of
          2600 MD5 draws and one keyed on the Hamming weight alone by 2 of 2600. The
          control fires -- narrowly, on MD5 only, and entirely because of the weight-1
          census structure.
          (iv) THE FEAR IS OVERTURNED. The Red Team returned three objects the plan did
          not supply, and one of them, O-RT2, is not a deletion at all and therefore
          lies outside the class the contract's lattice can express. THE ADVERSARIAL
          PASS WAS NOT BOUNDED BY THIS COORDINATOR'S IMAGINATION, and the close records
          that rather than treating the floor list's exhaustion as coverage.
      A_3:
        expectation: >-
          Expected the honest composed statement to be NARROWER than "the strengthened
          suite detects the message_difference deletion", to require a primitive scope
          and an isolation caveat in the same sentence, and expected five NOT DETECTED
          verdicts to mean the suite did not look. Recorded a fear of accidentally
          writing "N of M components".
        outcome: MET IN DIRECTION AND EXCEEDED IN SEVERITY, AND ONE OF ITS PREMISES IS OVERTURNED.
        detail: >-
          The required narrowing is GREATER than A-3 anticipated: not merely scoped but
          a RESTATEMENT. And A-3's premise that all five NOT DETECTED verdicts mean the
          same thing is overturned by J9: they split into ONE provable impossibility,
          THREE not-probed, and ZERO probed-and-not-detected. The feared sentence does
          not appear in this close and is forbidden by the reporting rule above.
      A_4:
        expectation: >-
          Suspected the tautology bite and expected it AT LEAST PARTIALLY, with the
          partial looking like "the row measures something on one primitive and restates
          the construction on the other", and guessed that the SHA-1 half was the
          measuring half.
        outcome: >-
          CONFIRMED IN DIRECTION, OVERTURNED IN SHAPE, AND EXACTLY BACKWARDS ON WHICH
          HALF CARRIES CONTENT. THIS IS THE SINGLE MOST VALUABLE OVERTURN OF THE ROUND
          AND IT IS RECORDED AS A FIRST-CLASS FINDING RATHER THAN ABSORBED. The answer
          is NOT the symmetric mixture A-4 imagined. It is A RESTATEMENT ON MD5 AND A
          SILENCE ON SHA-1: the two halves fail to be a power result FOR TWO DIFFERENT
          REASONS. A-4 wrote that an adjudicator can drop a component and still reject
          a draw through a correlated component, "which is precisely what the SHA-1 half
          is reported to do", and read that as the CONTENT-BEARING half. It is the
          opposite: the SHA-1 arm's rejection through a correlated component is exactly
          why that arm contributes ZERO members and shows a negative about the family
          rather than a positive about the suite. The author of the construction was
          the reader least able to judge it, which is why the joint was assigned to the
          adversary, and the assignment paid for itself here.
      A_5:
        expectation: >-
          Expected at least one part-1 prediction to be overturned in an unanticipated
          direction, and named P-5's normalisation and P-4's flag claim as the most
          likely candidates.
        outcome: MET AS A META-PREDICTION AND WRONG ON BOTH NAMED CANDIDATES.
        detail: >-
          P-5's predicted normalisation disagreement DID NOT MATERIALISE: the primary
          artifact carries per-object vectors beside the aggregate and there is no units
          mismatch in the artifact the pre-registration is scored against. The residual
          is a labelling gap in a summary index with a stated conversion. P-4's flag
          claim WAS complicated, but not by the D-SHA1-INCODE sub-arm as A-5 guessed --
          by functional dependence, which A-5 did not name. And the overturn that
          actually occurred is A-4's shape, which A-5 did not list.
      A_6:
        status: >-
          HONOURED. The prior is not used as evidence anywhere in this close. Where a
          reviewer's finding agrees with it, the agreement is discounted to the extent
          the reviewer could have read it and the discount is stated; where a finding
          contradicts it, the finding wins and the prior is recorded as overturned in
          the direction it was overturned.
    prior_scoring_summary: >-
      MET IN FULL: P-1, P-5, A-1. MET AND EXCEEDED: P-2 clause b, A-3. MET WITH ITS
      STATED VALUE OVERTURNED: P-3. VERDICTS MET AND MECHANISM OVERTURNED: P-4.
      MATERIALLY OVERTURNED: P-2 clause c, A-4 (in shape and in which half carries
      content), A-2's lossy guess and A-2's bounded-imagination fear (in the good
      direction), A-5's two named candidates. UNDERSHOT IN SEVERITY: the one-sentence
      review-round prior, which expected a one-sided break and got a two-sided one.
      THE PRIOR WAS RIGHT ABOUT WHERE TO LOOK AND WRONG ABOUT WHAT WOULD BE FOUND
      THERE, IN BOTH DIRECTIONS, WHICH IS THE SAME SHAPE ROUND 1's PRIOR HAD AND IS THE
      MOST INFORMATIVE SHAPE AVAILABLE.

  # ======================================================================
  # 5. INDEPENDENCE
  # ======================================================================
  independence_ruling:
    ruling: >-
      MUTUAL BLINDNESS HELD THIS ROUND. This is a change of state from round 1, where
      it was broken in one direction by a commit message body, and the change is
      attributable to specific mechanisms rather than to good fortune: declared
      read_scopes that exclude the batch root, literal-path blind_from prefixes that a
      checker can actually match, a subject-line-only commit rule, and a sealed-prior
      path outside both read scopes.
    from_the_attestations_rather_than_from_the_plans_intent:
      validator: >-
        read_sibling_reports false; blind_from_respected true with the list checked
        entry by entry; derived_before_reading true with an explicit statement of what
        that rests on; read no commit body, no pull-request description, no merge
        digest, no bus message and no coordination/events/main record, using only
        `git log --format=%H`, an ancestry test, a name-only diff and byte reads at a
        commit.
      red_team: >-
        read_sibling_reports false; read_sealed_prior false; blind_from_respected true
        and set true because it is true rather than because it was required;
        derived_before_reading true with a committed, timestamped derivation written
        sixteen minutes before its first read of the producer's directory; ran
        `git log --format=%H -3` once and read three hashes, and did not look at either
        of the two commits above the snapshot commit by any means including their file
        lists.
    disclosed_exposures_composed_rather_than_absorbed:
      E_1:
        what: >-
          The Validator ran a directory listing on the reviews/ parent while creating
          its own write scope and saw that a directory named for its sibling exists. It
          saw a name and a timestamp and nothing else, did not descend, and disclosed it
          unprompted because the rule asks for disclosure in full rather than a judgement
          about materiality.
        composed: >-
          IMMATERIAL AND RECORDED AS A CREDIT. It conveys only that the sibling is
          running, which the plan already stated. No finding is discounted for it.
      E_2:
        what: >-
          The Red Team disclosed a NEAR MISS the plan's blindness block does not cover:
          the producer's own committed execution report QUOTES THREE COMMIT SHAS AND
          DESCRIBES WHAT TWO OF THEM CONTAIN, inside both reviewers' read scope.
        composed: >-
          A CREDIT TO THE REVIEWER AND A FINDING AGAINST THE ROUND'S DESIGN, WHICH IS
          THIS COORDINATOR'S. Forbidding `git show` does not forbid a committed artifact
          from quoting history, and round 1's leak arrived through exactly this channel
          in its git form. Nothing of a reviewer's findings is in that text, so nothing
          is discounted; the channel is named for batch 3.
      E_3:
        what: >-
          THE ROUND'S OWN PARTIAL-SEAL RESIDUAL IS WIDER THAN IT DISCLOSED. The
          one-sentence Coordinator prior naming the in_linearized_code mechanism is
          inside review-plan.yaml, which the independence checker requires to be
          non-empty and which BOTH reviewers list in sources_read.
        composed: >-
          A FINDING AGAINST THE PLAN, WHICH IS THIS COORDINATOR'S, AND NOT AGAINST
          EITHER REVIEWER. Both reviewers went further than the plan asked -- neither
          read batch.yaml, one deliberately -- and the residual is one the plan created
          and mis-scoped. Its consequence is applied in `prior_scoring`: the DIRECTION
          of concurrence on the SHA-1 confound is discounted for both, while the
          derivations, the integers and every finding bearing on the sealed addendum
          stand undiscounted.
    what_is_composed_as_one_observation_and_what_as_two: >-
      THE RULE APPLIED, STATED SO IT CAN BE CHECKED. Where mutual blindness
      demonstrably held for an item, two agreeing reports are TWO observations; where
      it did not, or where a common dependence exists, they are ONE.
      TWO OBSERVATIONS: the md5 2600 of 2600 and sha1 0 of 2600 integers, and the
      per-cell attribution structure. Blindness held, the derivations were written
      before reading, and the two reviewers used different mechanisms.
      QUALIFIED, AND THE QUALIFICATION IS THE REVIEWERS' OWN: both re-implementations
      read the SAME committed serialiser, so the agreement is evidence about the
      PROJECTION and is NOT an independent check that the serialiser implements the
      contract. The Red Team states this against its own finding and the composition
      adopts it.
      ONE OBSERVATION: the DIRECTION of the SHA-1 flag confound, per E-3.
      ONE OBSERVATION, AND IT IS THE ROUND'S BEST: the two opposite readings of the
      same line of code are not agreement at all. They are two different questions
      answered about one object, and the composition of them is a finding neither
      reviewer reported and neither could have.
    checker_result:
      tool: tools/check_review_independence.py
      invocation_reported: >-
        run with the batch directory
        coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7
      status: PERFORMED BY THE DRIVING SESSION, NOT BY THIS SESSION, WHICH HAS NO SHELL
      reported_result: >-
        PASS -- 2 reports, every joint owned and attested, blindness respected,
        controls declared.
      verbatim_output_available_here: false
      verbatim_note: >-
        THE TEXT ABOVE IS RECORDED AS THE DRIVING SESSION'S REPORT OF THE RESULT. This
        session cannot confirm it is the literal stdout and does not present it as
        such; the driving session pastes the verbatim output into the ledger receipt.
        The exit code was not transmitted and is left null rather than inferred from
        the word PASS.
      adjudication_at_read_level: >-
        A PASS IS ADJUDICATED AS CAREFULLY AS A FAILURE WOULD BE, BECAUSE A GREEN TOOL
        IS THE EASIEST THING IN THIS PROGRAM TO OVER-READ. WHAT IT CONFIRMS: every one
        of the thirteen joints is claimed by exactly one reviewer's `joints_owned`;
        both attestations exist and are well formed; no reviewer declares a sibling
        read; no declared source intersects a blind_from prefix; and the
        proves-too-much control is declared. WHAT IT CANNOT CONFIRM, STATED SO THE PASS
        IS NOT READ WIDER THAN IT IS: it cannot check read ORDER, so
        `derived_before_reading` is outside its reach entirely; it cannot see the
        one-sentence prior embedded in the plan it validates (E-3); it cannot know that
        the producer's own artifact quotes commit history (E-2); and it says nothing
        about whether the composition is correct.
      why_this_pass_is_nonetheless_a_real_result: >-
        ROUND 1 COULD NOT HAVE REACHED IT. That round exited nonzero on nine problems,
        seven of which were the checker deriving a joint's name from an entire
        paragraph, and its leak detector could not fire at all because every blind_from
        entry was a glob or a prose phrase no real path can match. The short joint ids
        (BR-2) and the literal-path prefixes (BR-3) are what made the checker
        functional; this is the first round of this goal in which the tool was in a
        position to say anything.

  # ======================================================================
  # 6. COMPLETION CRITERION 4
  # ======================================================================
  completion_criterion_4_adjudication:
    criterion_text_paraphrased: >-
      Independent Validator and Red Team sessions ADMIT each claim-relevant run
      package, verifying controls, certificates, census provenance, the equivalence
      generators' verification status, and the absence of uncharged preprocessing,
      memory, oracle or randomness assumptions.
    ruling: NOT SATISFIED.
    from_the_reports_actually_received_and_never_from_the_batch_shape: >-
      THE VALIDATOR ADMITS ON THE SEVEN JOINTS IT OWNS AND ON NOTHING WIDER. Its
      verdict is `passed`, and it states in its own words that this means
      "ADMISSIBILITY, AND NOTHING ABOVE IT" -- that the artifacts exist, are bound to
      the cited runs, are byte-identical to the reviewed instrument, and that the
      reported integers are what the committed code produces -- and that it "DOES NOT
      ESTABLISH THAT THE STRENGTHENED SUITE IS SUFFICIENT" and does not authorize
      promotion. That is an admission on artifact and control integrity for J1 to J7.
      THE RED TEAM DOES NOT ADMIT. Three of the six joints it owns are `breaks`: J8
      (proves-too-much), J11 (the family-(d) mutation and the flag confound) and J13
      (whether the headline is a power result). It states explicitly that the criterion
      is "NOT STATED AS MET BY ME AND NOT MINE TO STATE".
      A `breaks` ON A JOINT A REVIEWER OWNS IS NOT AN ADMISSION ON THAT JOINT, and the
      three that broke are precisely the claim-relevant ones. THE CRITERION IS
      THEREFORE NOT MET, AND IT IS NOT READ OFF THE PRESENCE OF TWO TASK IDS IN A
      QUEUE.
    what_did_change_and_why_it_is_worth_recording: >-
      THE CRITERION MOVED FROM UNREACHABLE TO REACHABLE-AND-REFUSED, WHICH IS A MORE
      INFORMATIVE STATE THAN REACHABLE-AND-UNTESTED. For the first time this goal ran
      two independent sessions in the required roles, mutually blind in fact and not
      only in intent, on disjoint owned joints, with an independence check that could
      execute and did. The criterion was tested and the answer is no.
    what_would_be_required_to_meet_it: >-
      An admission from a Red Team session on the joints that broke, which means the
      breaks must be ANSWERED and not out-waited: an instrument whose detection rule
      cannot be passed by O-E, and a power statement whose verdicts are not entailed by
      the perturbing families' own construction. Both are named in `next_action` and in
      `next_action_ranking`. A later round in which the same joints are simply not
      assigned would NOT meet the criterion and any close that read it that way would
      be manufacturing an admission.
    what_is_NOT_claimed_here: >-
      No other completion criterion is asserted as met. Criterion 1 remains unmet for
      the reason DEC-20260824-af6d5c recorded and this batch re-measured: two of the
      four verified generators emit no orbit image at all, so the recall clause is not
      satisfied as its own words state it. Criteria 2 and 3 are untouched -- no
      covering statement and no search. Criterion 5's knowledge entry is DEFERRED A
      SECOND TIME, see `knowledge_promotion`.

  # ======================================================================
  # 7. WHAT THIS BATCH DID NOT DO
  # ======================================================================
  what_this_batch_did_not_do:
    - >-
      IT REPAIRED NOTHING. VD-3, VD-4, the zero-image result for two verified
      generators, OBJ-3, OBJ-4 and OBJ-10 stand open and were MEASURED here, not fixed.
      CTL-FROZEN makes "we did not repair the instrument" a MEASUREMENT at 13 of 13
      identical digests rather than an attestation.
    - IT ACQUIRED NOTHING, AT ANY TIER, BY ANY ROUTE. No task of this batch held web search and no acquisition was authorised; both reviewers report zero network requests.
    - IT SEARCHED NOTHING. No search over the difference space was run, attempted or configured, and no solver was invoked.
    - IT MINTED NO IDEA-* IDENTIFIER FROM THE UNREVIEWED PROPOSAL SET, which remains gated behind a Pareto-honesty and novelty-status review.
    - >-
      IT CLAIMED NO PATH NEW, FOR EITHER PRIMITIVE, AT ANY TIER, and no NON-MEMBER
      verdict anywhere is written or implied as novelty. With a readable census of
      ZERO, NON-MEMBER means "not in an empty census".
    - IT PROJECTED NO COST, stated no attack complexity, and made no cryptanalytic improvement claim of any kind. A PASSING CONTROL IS NOT AN IMPROVEMENT.
    - >-
      IT DID NOT CLOSE THE MD5 LANE. AMD-20260824-DIFFP-ACQ-1 stands unchanged and in
      force: Tier A refused by every route, TIER B BLOCKED PENDING A GOAL-MD5-001
      DECISION -- BLOCKED, NOT CLOSED, with its named unblocking route intact -- Tier C
      permitted. An adversary specifically tasked with finding a sentence that lets
      "blocked" drift into "closed" looked and found none.
    - IT PROMOTED NOTHING TO `supported` AND MOVED NO HYPOTHESIS STATUS, because this goal carries no active hypothesis.

  # ======================================================================
  rationale:
    - >-
      THE RUN SET IS VALID AND WAS CHECKED BEFORE IT WAS INTERPRETED, AND THAT
      ORDERING IS THE PART THAT COULD HAVE ENDED THE CLOSE. Five of five runs
      completed_valid; eight seeds and no ninth; five run directories and no
      undeclared sixth; 35 of 35 run-file digests; 68 of 68 manifest module digests; 13
      of 13 CTL-FROZEN files identical before and after in all four combinations; and
      the executed source is byte-identical to the archived module, which discharges by
      MEASUREMENT the one disclosed risk that would have made every number in the
      package uninterpretable.
    - >-
      THE ARITHMETIC IS REPLICATED FOR THE FIRST TIME IN THIS GOAL, AND THE
      REPLICATION IS THREE-WAY. The producer's charged runs, the Validator's own
      re-implementation of the declared projection, and the Red Team's own
      re-implementation of the projection, the index, the ablated canonical form, the
      verdict and the suite driver all produce the same integers. EV-DIFFP-b878aa
      carried `preliminary` precisely because its load-bearing measurement was
      single-session and had no run record; that defect is repaired, and repairing it
      is a real achievement of this batch that the breaks do not cancel.
    - >-
      AND THE MEASUREMENT THE REPLICATION SECURES IS LARGELY NOT ABOUT THE INSTRUMENT.
      Of six depth-1 rows, ONE verdict is contingent on the instrument and the OLD
      suite already had it. Two rows changed from NOT DETECTED to DETECTED and both
      delete precisely the set of components family (d)'s own perturbation moves. That
      is the deflation, it is measured rather than argued, and it is the content of
      this decision.
    - >-
      THE PROVES-TOO-MUCH CONTROL FIRED, AND IT FIRED HARDER THAN ROUND 1's. Round 1's
      O5 passed the OLD suite; the strengthened suite CATCHES O5 and does not catch the
      per-primitive weakening of it. Five known-false instruments pass every arm the
      detection rule reads and three of the six key components can be deleted
      simultaneously unnoticed. THE STRENGTHENING GENUINELY CLOSED SOMETHING AND
      GENUINELY DID NOT CLOSE THE NEXT THING, and both halves are stated.
    - >-
      THE SURVIVAL LOCALISES TO ONE LINE, WHICH IS THE MOST ACTIONABLE FORM AN
      ADVERSE FINDING CAN TAKE. The detection rule reads the family-(d) primary arm
      only, so the package's own isolating sub-arm -- the single construction that
      separates the SHA-1 message difference from the flag, and the one arm on which
      the strongest surviving instrument fails 520 of 520 -- bounds nothing any verdict
      depends on. A finding that names a line is a finding that can be answered.
    - >-
      THE OBSTRUCTION IS RE-MEASURED AND RE-READ RATHER THAN RESTATED. EV-DIFFP-b878aa
      recorded "2 of 5 ablations detected" and its resource_check proposed that control
      power is a measurable per-component quantity. This round measures that the
      per-component profile of an exact-key adjudicator reports, in order, the
      perturbing families' construction, the key's functional-dependency graph, and
      only then the instrument -- and the reversal of THAT obstruction is itself the
      round's most reusable output, because the dependency graph is STATICALLY
      COMPUTABLE and turns an unaffordable depth-2 lattice into a two-row question.
    - >-
      THE ADJUDICATOR IS STILL NOT SHOWN TO BE WRONG, AND ITS ONE GENUINELY STRONG
      STRUCTURAL PROPERTY IS NOW DEMONSTRATED BY CONSTRUCTION RATHER THAN ASSERTED.
      T1 through T5 are met on both sides and two degenerate adjudicators were BUILT
      and measured to fail different declared arms. That is a positive finding and the
      composition does not lose it under the breaks.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT MD5 OR SHA-1. The claim ceiling is `analyzed`,
      the readable census is zero, every MD5 planted entry carries a weight-1 message
      difference no real characteristic has, and adjudicator correctness against a
      published characteristic remains UNTESTED. The MD5 lane is BLOCKED, NOT CLOSED.

  # ======================================================================
  limitations:
    - >-
      THIS DECISION'S AUTHOR HAS NO SHELL. It ran no command, computed no hash,
      executed no code, minted no identifier and made no commit. Neither
      tools/validate_ledger.py nor tools/check_review_independence.py nor
      tools/research_dispatch.py nor any git command was run by it, and no output of
      theirs is recorded anywhere as if it were. Every scalar it binds is either a
      structural fact established by reading a committed artifact, or a value measured
      by another session and attributed to that session by name. NO COMMIT SHA IS
      INVENTED AND NO TRANSMITTED SHA IS RESTATED AS THIS SESSION'S OBSERVATION.
    - >-
      THE ADVERSARIAL CONSTRUCTIONS THAT CARRY THE THREE BREAKS ARE UNREPLICATED AND
      HAVE NO RUN RECORD. One session built them, no second session re-ran them, and
