    "rationale": [
      "All nine original finite cells are retained with officially allocated/check-confirmed RUN IDs. Equal source weights, ordinary addition/no overflow, carry/run strata and exact count/unrank boundaries are explicit.",
      "The actual target-blind joint sampler defines normalized q and expected charged draw cost. Held-out lower1%/no-zero claims use the same reference population and cost convention; the unnormalized proposal expression is not mistaken for a success probability.",
