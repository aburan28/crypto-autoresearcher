      "Exact literal/oracle/normalization controls, structured and known-false targets, source-model correspondence, integer/subset-sum control and endpoint-factorization checks distinguish procedure defects from scoped mathematical observations.",
      "The proof-search map includes a concrete frozen carry-telescoping Lean task, complete public-source size/access and cost obligations, a statement-only blind packet, joint owners and separate semantic review.",
      "The experiment-local YAML adapter contract preserves raw frozen bytes, canonical IDs, approval v1 fields and external lock trust. Separate implementation, snapshots, synthetic QA and two real launch activations prevent inherited models/incidence authority from launching carry science.",
      "No mathematical uncertainty has been converted to an administrative blocker or a claimed result. Future source formula reconciliation, tail comparison and solver interface are explicitly bounded tests and obligations.",
      "The even-w pure no-carry source supplies a uniform-output pair-witness comparator with independently charged single-stratum setup/draw costs. A2x contrast against only the finite fitted grid is insufficient; the declared normalization ceiling and required cost condition must be reconciled before any finite lead.",
      "Parent rejected the initial full-chain completion after official dispatch validation found empty activation archive source ownership. The same unpublished protocol now assigns each activation producer to a distinct source-bound snapshot; scientific fields, review bindings and all existing IDs are preserved."
    ],
