  decision: revise
  decision_scope: >-
    Specify H-ICPERF-3982eb and its prospective successor
    EXP-ICPERF-554db4 for the certified ordinary-binary GF(2^61) m=8
    fixture. Keep the experiment review_required, approved_by null and
    execution_authorized false. The current design binds gamma and names
    a sorted-summand feasibility mechanism, but the independent blind
    schedule, transformed inputs, launcher, complete trial plan, archive
    coverage and preapproval packet are missing. This decision approves
    no scientific solver call or ECDLP advantage claim.
  target_ids:
    - GOAL-ICPERF-e6b6a4
    - RQ-ICPERF-94c86e
    - IDEA-20261017-3f46a5
    - H-ICPERF-3982eb
    - EXP-ICPERF-554db4
    - BATCH-f08d22
    - TASK-20261018-65e22c
    - TASK-20261018-da71bd
    - TASK-20261018-925eb3
    - TASK-20261018-38b01f
  ranking:
    selected: >-
      Resolve ordinary-binary m8 input identity and the positive solver
      bottleneck before another natural-target call. The v1 planted
      controls each reached the 300-second wall cap, and all 64 natural
      calls were gated. A sorted presentation addresses the 8! maximum
      order symmetry of eight summands while charging comparator work.
    comparison: >-
      The open prime63 lane tests a different arithmetic/backend failure;
      it is preserved. The ready EXP-ICPERF-e467a5 is a deterministic
      price-ratio instrument and does not resolve the full-width binary
      solver bottleneck. The new batch contains design/implementation
      tasks only; a scientific lane must be opened and ranked separately
      before any future solver run.
    expected_information_gain: >-
      A blind schedule derivation can resolve the exact gamma
      identifiability problem; transformed positive controls can
      discriminate encoding correctness from bounded solver feasibility.
    cost_and_dependency_risk: >-
      Six eventual one-thread calls have 1200-second per-call guards and
      7200-second cumulative call admission, plus fully charged setup and
      checking. None is authorized here. The principal dependency is a
      complete sorted encoder and independent finite controls.
  rationale:
    - >-
      EV-ICPERF-54ac6b and DEC-20261017-3b87bf establish only two
      300-second wall-censored planted calls and no attempted natural
      solver call; they do not support a zero-yield or performance verdict.
    - >-
      The prior allowed specification did not bind gamma. The successor
      states gamma=b^(1/4)=x([r]P_source)=70364449406991 in the declared
      field and freezes the exact pole predicate and blind controls. The
      old frozen records remain unchanged.
    - >-
      Stable sorting of complete signed summand points preserves a group
      sum by commutativity, subject to re-chaining and finite encoding
      checks. It does not prove any SAT runtime gain, algebraic degree of
      regularity reduction or sparse linear algebra benefit.
    - >-
      The proposed U/S/U schedule gives two identical unsorted A/A calls
      per base for a timing spread and one sorted call per base. The
      planted targets differ between bases, so only within-base solver
      diagnostics are interpretable.
    - >-
      No `experiment_preapproval` packet has reported approvable true,
      no runbook lints, and the ordinary selector cannot report ready.
      Standing user authorization applies only after the contract is
      complete and approvable. Review_required is therefore the only
      accurate current experiment state.
  official_transitions:
    hypothesis_id: H-ICPERF-3982eb
    hypothesis_from: proposed
    hypothesis_to: specified
    experiment_id: EXP-ICPERF-554db4
    experiment_from: draft
    experiment_to: review_required
    goal_status_changed: false
    idea_status_changed: false
    condition: >-
      The status fields and this transition become official only after
      TASK-20261018-925eb3 archives the exact design and decision bytes,
      verifies its Git receipt and pushes the branch.
  procedure_deviations:
    - >-
      TASK-20261018-65e22c was written after this Coordinator subagent
      received the in-session assignment. It is a retrospective exact-scope
      record, not a compliant pre-dispatch committed handoff. The earlier
      dispatch cannot be made prospectively compliant by this decision.
      TASK-20261018-da71bd is prospective and must not be dispatched until
      the design archive is committed, pushed and its queue dependency
      verifies.
    - >-
      The first Conductor exact-path claim T-3998 was inadvertently cancelled
      during coordination. The same paths were rechecked and reclaimed as
      T-4003 before further edits; no file changed during the claim gap.
    - >-
      The v1 source data and censored solver receipts were visible during
      this design. Prediction provenance marks the sorted feasibility
      prediction partially in sample and restricts any criterion to the
      previously unrun sorted cells.
  limitations:
    - One curve, one subgroup, two B=316 bases, m=8 and separate planted targets only.
    - No transformed sorted source or verified transformed positive formula yet exists.
    - No natural relation, useful rank, linear algebra, target phase, degree of regularity or complete E2E comparison is measured by this design.
    - A no-solver blind replay is still required to clear problems/icperf-k11-gamma-admission-unbound.md for the successor.
  knowledge_promotion:
    promoted: []
    not_warranted: A prospective review_required design and old censored receipts provide no new reviewed ECDLP finding.
  next_actions:
    - Archive the completed design report, diagram and inspected PDF exact bytes with H, EXP, TASK, queue and this DEC under TASK-20261018-925eb3.
    - After the design archive is verified and pushed, dispatch TASK-20261018-da71bd through the queue for zero-scientific-run sorted-input and launcher implementation, then archive its exact outputs under TASK-20261018-38b01f.
    - Freeze a blind review plan and independent gamma schedule derivation before opening predecessor manifests to that reviewer; compare only after the blind record is sealed.
    - Complete an exact prospective preapproval packet and require approvable true, a new approval decision and execution_state ready before any scientific run through /run.
