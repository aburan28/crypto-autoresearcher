  disposition_ref: coordination/ideation/direct-six-review-20260818/tasks/TASK-20260818-d4775f/disposition.yaml
  rationale: >-
    The six independent lane reviews support an overall literal REVISE. MQOM
    passes proposal admissibility only; FNDSA, SDITH, SLHDSA, SQISIGN, and UOV
    require blocking additive corrections followed by fresh independent review.
    All 30 original proposals remain proposed with novelty unverified. This is a
    neutral administrative disposition, not a scientific conclusion.
  lane_boundaries:
    FNDSA:
      outcome: REVISE
      repairs:
        - Correct IDEA-20260813-76dcbd's exact-null confidence-interval gate so it rejects only demonstrated crossing above alpha or MGF failure and reports conservatism.
        - Require verified sign symmetry for symmetric plus/minus delta alternatives or preregister separate targets.
      bounded_pass: The other four FNDSA proposals pass bounded proposal admissibility.
    MQOM:
      outcome: PASS
      pass_scope: proposal_admissibility_only
      limitations:
        - Novelty remains unverified.
        - No primary-literature or live search_knowledge coverage supports novelty or implementation.
    SDITH:
      outcome: REVISE
      repairs:
        - Correct four proposals' mis-scoping of IDEA-20260808-632866 full-cost asymmetry and augmented-transcript interface.
        - Add structured citation verified_by provenance.
        - Replace unsupported dominated_by null with n/a or a complete current frontier audit.
    SLHDSA:
      outcome: REVISE
      repairs:
        - Use canonical proof_search_map shapes for all five proposals.
        - Add structured inventor deliverable fields.
        - Replace dominated_by.overall null with n/a or a current bounded frontier including the 11 post-snapshot proposals.
        - Add structured citation provenance for KN-LIT-748 and KN-LIT-3858.
        - Resolve or retire nonresolving IDEA-20260808-e41559.
        - Restore goal ordering with the conventional constants-tracked bound first and the fault lane separate and nonblocking.
      bounded_pass: Textual fault-versus-conventional separation passes.
    SQISIGN:
      outcome: REVISE
      repairs:
        - Replace the malformed 48-hex purported SHA-256 for IDEA-20260808-287361 with a verified full binding or explicit unavailable provenance.
        - Replace unsupported dominated_by null with n/a or a full frontier audit.
        - Add KN-TECH-058 current Fp2 baseline tiers and caveats.
        - Correct EXP-SSI-7c41d9 to the three-replicate unarchived direct-tree limitation.
      bounded_pass: The SQISIGN-versus-SSI boundary and corrected source typo pass.
    UOV:
      outcome: REVISE
      repairs:
        - Replace IDEA-20260813-16d752's equation-permutation null with a proved certificate-destroying same-shape null.
        - Preregister IDEA-20260813-1c423c's false-map class, challenge distribution, soundness-bound formula, and repetition rule.
      bounded_pass: The other three UOV proposals pass ideation-stage checks with primary-source and shared-cost blockers preserved.
