coordinator_decision:
  id: DEC-20260727-010
  context: >-
    BATCH-008 of GOAL-ECDLP-001 is a bounded LEDGER-INTEGRITY repair and nothing
    else. Two committed experiment specifications each carried one unquoted `|`
    opening a plain scalar - experiments/EXP-STR-003/specification.yaml line 407
    and experiments/EXP-IC-002/specification.yaml line 213 - so both failed
    yaml.safe_load, tools/validate_ledger.py never registered either id, and
    three CORRECT immutable records (EV-STR-003, DEC-20260727-009,
    DEC-20260727-008) were reported as referencing unknown targets. The mechanism
    chosen and frozen in a plan committed at 14deee8a was REPAIR IN PLACE, which
    changes the EXP-STR-003 contract blob 1c6f10b7 that TASK-20260727-023
    attested and that underwrites the F1 falsification behind DEC-20260727-009.
    The Executor applied exactly the two declared quoting changes at a935f207.
    Two independent, non-originating reviews then reported: TASK-20260727-030
    (VAL-20260727-003) PASS, and TASK-20260727-031 (RT-20260727-004). This
    decision records the official disposition. NO MEASUREMENT WAS TAKEN AND
    NOTHING HERE IS A RESEARCH RESULT.
  decision: supersede
  decision_verb_note: >-
    `supersede` is chosen from the template's list because the operative act is
    the creation of CORR-20260727-004, which supersedes the byte-identity of two
    frozen contracts at HEAD and pins EV-STR-003's unpinned specification
    proof_ref. It is expressly NOT `support` and NOT `reject_scoped`: no
    hypothesis is in play.
  target_ids:
    - EV-SPEC-001
    - CORR-20260727-004
    - EXP-STR-003
    - EXP-IC-002
    - BATCH-008
    - GOAL-ECDLP-001

  scope_of_this_decision:
    files: 2 (experiments/EXP-STR-003/specification.yaml, experiments/EXP-IC-002/specification.yaml)
    lines: 2 (one per file - EXP-STR-003:407, EXP-IC-002:213)
    characters_added: "4 (two U+0027 per file); characters_removed: 0"
    instrument: tools/validate_ledger.py at tree c80b4e4f9a51a905558e690e842744c1de9cbf18
    branch: claude/ecdlp-batch006
    machine: one (Darwin 25.6.0, python 3.13.1, pyyaml 6.0.3)
    runs_executed: 0
    hypotheses_moved: 0

  rationale:
    - id: R1
      title: The repair is valid and the reviews are admissible evidence of that
      text: >-
        VAL-20260727-003 returned PASS with all seven claims recomputed
        independently from Git and from its own re-run of the validator, not from
        the producer's artifacts. The diff is exactly two lines, quoting only;
        line counts 511 -> 511 and 923 -> 923; the SHA-256 of each file WITH THE
        CHANGED LINE DELETED is identical before and after; the parsed values equal
        the original raw text character for character; and placeholder
        neutralisation proves the quoting perturbed the parse of no other node in
        either document. 990 -> 985 with `comm -13` EMPTY, so the post-repair
        error set is a STRICT SUBSET and the two newly-registering experiments
        introduced no error of their own. The baseline blob a818e2ee is unchanged
        since 2026-07-22 and contains none of the five cleared records, so nothing
        was laundered into the grandfathered set; and the tools/ tree hash is
        identical across the repair, so the same validator binary measured both
        sides. RT-20260727-004 independently re-derived the load-bearing facts and
        found no sixth consequence: no duplicate mapping keys, no YAML type
        coercion, approval fields intact, `frozen` correctly NOT added to
        EXP-IC-002. There is no ground on which to return the repair as defective
        and neither review asked for that.
    - id: R2
      title: THE MECHANISM CHOICE, AND ITS COST, STATED NOT GLOSSED
      text: >-
        Repair-in-place was the only one of the three mechanisms the plan
        considered that clears the reported errors under the identifiers the 20
        committed runs and three immutable records already name. Reissue under a
        new EXP id clears 0 of 5, because EV-STR-003, DEC-20260727-009 and
        DEC-20260727-008 are immutable and name the existing ids, and the
        unparseable file stays in the validator's glob. A repaired sidecar at a
        non-globbed filename registers nothing; a repaired copy at another
        `experiments/<dir>/specification.yaml` registers the id but becomes a
        `duplicate ID` the moment the original is repaired. THE PRICE PAID IS
        REAL: HEAD no longer resolves to the blob attested at the freeze, the
        property that the frozen contract had never been edited after freezing is
        gone, and it cannot be restored. That price is recorded in
        CORR-20260727-004 and is not described as costless.
    - id: R3
      title: THE DISANALOGY WITH 5de2db97 HOLDS - ON ONE GROUND ONLY, AND NOT THE ONE THE BATCH LED WITH
      text: >-
        LOAD-BEARING: the pre-edit blobs had NO VALID PARSE, so no assertion could
        change, and this is mechanically provable by a stranger from the commit
        alone. The decisive control is one command -
        `git cat-file blob <pre-edit> | python3 -c "import sys,yaml; yaml.safe_load(sys.stdin)"`
        - which SUCCEEDS on 5de2db97's pre-edit blobs and RAISES ScannerError on
        1c6f10b7 and 8987eb01. 5de2db97 moved parseable records from one assertion
        to its opposite; a935f207 moved two files from NOT A RECORD to A RECORD
        while adding and removing zero characters of content. Different in kind.
    - id: R4
      title: THREE ELEMENTS THE BATCH LED WITH ARE NOT LOAD-BEARING AND MUST NEVER BE CLAIMED AS SUCH
      text: >-
        (a) THE PRE-COMMITTED PLAN. It is SELF-AUTHORED - the Coordinator wrote,
        approved and dispatched it - and no AGENTS.md rule lets a Coordinator
        pre-authorize an immutability breach; rule 4 is not addressed to any role.
        5de2db97 would have satisfied this element in full with a one-line plan
        commit. PROCESS-AS-AUTHORITY IS ITSELF THE LAUNDERING MECHANISM. (b) THE
        TWO-LINE SIZE. Rule 4 has no de minimis clause, and a rule that yields to
        smallness yields to any patient sequence of small edits. (c) "SNAPSHOT
        BEFORE REVIEW". It is UNEARNED as stated: all eight BATCH-008 cards carry
        `commit_sha: null` under INT-BATCH007-T / INT-BATCH008-C, so no dispatcher
        post-commit receipt exists. Both reviews verified a935f207 by hand against
        every property the verifier would check - reachable from HEAD, expected
        parent, exactly the declared paths, hashes preserved, task and record ids
        named - AND THAT IS THEIR CHECK, NOT THE DISPATCHER'S. No receipt hash is
        fabricated anywhere in this batch.
    - id: R5
      title: PROPORTIONALITY - 0.5 PERCENT, AND THE LEDGER DOES NOT NOW VALIDATE
      text: >-
        The repair cleared 5 of 990 non-grandfathered validator errors. THE
        VALIDATOR STILL EXITS 1 AT 985. No gate was unblocked, because no gate
        could be gated on a validator failing at 990. Eleven other specifications
        remain unparseable and grandfathered - EXP-DREG-001, EXP-DREG-002,
        EXP-EQJ-001, EXP-FB-001, EXP-FB3-001, EXP-ICI-001, EXP-REP-001,
        EXP-REP-002, EXP-SIG-001, EXP-SIG-004, EXP-SIG-005 - and are out of scope
        (DEFER-BATCH008-001). THE TRUE CLAIM IS "THESE TWO EXPERIMENTS NOW
        REGISTER". "The ledger now validates" IS FALSE AND MUST APPEAR IN NO
        RECORD. Reporting -5 without the denominator would be the same class of
        error as quoting per-attempt cost without the inverse success probability:
        a true number that overstates what was bought.
    - id: R6
      title: THE BATCH OVER-CONCEDED ON PROVABILITY, AND THAT IS CORRECTED
      text: >-
        repair_plan.md section 5 and goal note INT-BATCH008-004 say semantic
        preservation "cannot be proved mechanically here". That is wrong in the
        safe direction. A PARSED-TREE DIFF is unavailable - undefined, in fact,
        since the originals have no parse tree - but an INVERSE-TRANSFORM
        BYTE-IDENTITY argument is available and is strictly stronger for a
        pure-delimiter change, and the Validator independently established the
        equivalent (identical SHA-256 of each file with the changed line deleted,
        plus index-wise byte comparison and a +2 byte delta). Presenting a
        provable thing as unprovable invites the next batch to skip the proof.
        EV-SPEC-001 records the correction and keeps `proof_status: derivation`;
        no certificate is claimed.
    - id: R7
      title: F1 IS NOT DAMAGED
      text: >-
        Every clause of EV-STR-003's `provenance.freeze_evidence` is a statement
        about NAMED COMMITS, not about HEAD, and RT-20260727-004 re-derived every
        one independently. experiments/EXP-STR-003/runs does not exist at
        92268c9e at all and first appears at c79e3a8d; 92268c9e added exactly one
        path; all 20 manifests are bit-identical and record `commit: 92268c9e`,
        `dirty: false`; lines 1-406 and 408-923 are byte-identical, so F1, the
        fixed-in-advance consequence block, the verdict definitions and every
        control, budget and stopping rule are untouched. The changed line is the
        description text of a SECONDARY diagnostic. DEC-20260727-009 quotes no
        HEAD blob and depends on no HEAD byte-identity, and no part of it is
        retracted.
    - id: R8
      title: OBJ-2 IS A REAL RESIDUAL HARM AND NOBODY IN THIS BATCH HAD NAMED IT
      text: >-
        EV-STR-003 line 134 lists `experiments/EXP-STR-003/specification.yaml`
        under `proof_refs` as a BARE PATH with no commit pin, so a reader
        resolving it at HEAD now gets blob 5e0dadf7. EV-STR-003 is immutable, so
        the pin belongs in a new record: CORR-20260727-004 states the rule -
        RESOLVE AT 92268c9e, BLOB 1c6f10b7, NOT AT HEAD. This is the only residual
        harm to the F1 result either review could identify.
    - id: R9
      title: DEF-VAL003-3 IS RECORDED - THE RECEIPT CHAIN CANNOT SEE A CONTRACT EDIT
      text: >-
        Run manifests bind a specification only by `code.commit`, never by the
        specification blob hash. Nothing in the receipt chain detected this
        divergence, and nothing would detect a NON-BENIGN one. Pre-existing schema
        property; first time it bit. Recorded in EV-SPEC-001
        `unresolved_confounds` and in CORR-20260727-004; not repaired here, and a
        harness change is out of this batch's authorization.
    - id: R10
      title: EXP-IC-002'S OPERATIVE PROTOCOL IS v1 AS AMENDED (OBJ-6)
      text: >-
        The repaired EXP-IC-002 specification parses to `version: 1` while
        experiments/EXP-IC-002/amendments/v1_to_v2.yaml declares
        `version_from: 1, version_to: 2`. That is by design - the amendment states
        that specification.yaml v1 is preserved unchanged and governs where the two
        disagree - and the validator does not check it, so it is not an error and
        this batch did not cause it. But now that the document REGISTERS, a
        consumer reading `experiment.version` will read 1 and silently miss the
        amendment. EXP-IC-002'S OPERATIVE PROTOCOL IS SPECIFICATION v1 AS AMENDED
        BY amendments/v1_to_v2.yaml; THE REGISTERED DOCUMENT ALONE IS NOT THE
        OPERATIVE PROTOCOL. EXP-IC-002 also carries a materially lighter
        obligation throughout: zero runs, never executed, and no run, attestation
        or evidence record binds to its blob.
    - id: R11
      title: RC-3 - THE RED TEAM'S PROBES ARE UNARCHIVED AND ARE NOT EVIDENCE
      text: >-
        RT-20260727-004's computational probes (inverse transform, duplicate-key
        scan, type-coercion scan, parse checks on the extracted blobs) ran in a
        SESSION SCRATCHPAD OUTSIDE THE REPOSITORY and the report labels them NOT
        EVIDENCE. THIS SESSION HAS NO SHELL AND COULD NOT RE-DERIVE THEM, so the
        honest disposition is stated rather than routed around: the inverse-
        transform SCRIPT and its captured output remain UNARCHIVED, and so do the
        duplicate-key and type-coercion scans. No conclusion in EV-SPEC-001,
        CORR-20260727-004 or this decision rests on an unarchived probe - each
        cites either a committed artifact or VAL-20260727-003, which performed and
        recorded its own equivalent checks. The two conclusions that would
        otherwise have rested only on the Red Team's probes are the whole-file
        inverse-transform identity (equivalent proposition archived by
        VAL-20260727-003 claim C1 by a different route) and the duplicate-key /
        type-coercion scans (NOT independently archived - they are believed but
        unverified in this repository, and are recorded as such). Archiving all of
        it is the single next action. This is stated because an earlier session in
        this campaign drove a decision from an unarchived probe that then failed to
        reproduce, and CORR-20260727-007 exists to correct it.
    - id: R12
      title: TWO COORDINATOR DEFECTS, BOTH MINE, RECORDED NOT HIDDEN
      text: >-
        DEF-VAL003-1: no snapshot receipt existed for TASK-20260727-027 or
        TASK-20260727-029 when the Validator looked, so it verified both commits
        directly against Git in lieu of receipts and fabricated nothing. Both
        receipts have since been written FROM GIT FACTS ONLY, each carrying a
        `written_late` disclosure, and both archive tasks REMAIN `queued` per
        INT-BATCH007-T; neither can be marked completed and pass verify_archive,
        and no hash was invented to route around that. DEF-VAL003-2: the
        TASK-20260727-030 card declares two artifact_paths
        (validation_report.yaml and independent_verification.md) while the session
        was directed to write exactly one; the Validator folded the commands,
        verbatim outputs and character-level comparisons into
        validation_report.yaml and every completion-gate item is satisfied within
        it. THE CARD IS RECONCILED TO WHAT EXISTS - independent_verification.md is
        struck from that card's artifact_paths by queue amendment - and the second
        file IS NOT FABRICATED. No review artifact is renamed or dropped.

  # ==================================================================
  # DECISION ON M4 - the fourth mechanism the batch never considered
  # ==================================================================
  m4_decision:
    mechanism: >-
      M4 - repair in place PLUS preservation of each frozen original as a LIVE,
      NON-GLOBBED COMPANION FILE in HEAD.
    verdict: ADOPTED
    companion_paths:
      - experiments/EXP-STR-003/specification.v1-frozen-1c6f10b7.yaml
      - experiments/EXP-IC-002/specification.v1-frozen-8987eb01.yaml
    content_requirement: >-
      Each companion must be BYTE-IDENTICAL to its pre-edit blob, produced by
      `git cat-file blob 1c6f10b7ba4db293126504c19b4fe9c931b257f3 > <path>` and
      `git cat-file blob 8987eb01978ab82538b17e35358c389c23a9b7f1 > <path>`
      respectively, with `git hash-object` re-confirming each id after writing. It
      may not be transcribed, reconstructed or hand-edited.
    reasons_to_adopt:
      - >-
        IT IS SAFE, CHECKED NOT ASSUMED. tools/validate_ledger.py lines 461-462
        glob `experiments/*/specification.yaml` EXACTLY, and the validator is the
        only program in the repository that reads specifications (grep over
        tools/, harness/ and orchestration/ returns the validator plus two
        fixtures in tools/test_research_dispatch.py). A companion under any other
        filename is never opened, never parsed and registers no id, so it CANNOT
        produce the `duplicate ID` instability the plan correctly feared for a
        REGISTERING sidecar. Blast radius: zero.
      - >-
        THE PLAN'S REJECTION DOES NOT COVER IT. repair_plan.md section 2.3
        evaluated SIDECAR-AS-REGISTRATION - a repaired copy the validator would
        read - and rejected it on three correct grounds. It never evaluated
        SIDECAR-AS-PRESERVATION. The very property that makes a sidecar useless as
        a repair (the validator ignores it) makes it ideal as a preservation.
      - >-
        IT IS PURELY ADDITIVE. It modifies no committed file, deletes nothing,
        needs no revert and no re-edit. Adding bytes that are already permanently
        attested is not an immutability breach; it is the discharge of one.
      - >-
        IT SATISFIES GATE CLAUSE L3 AND REPAIRS OBJ-2. A reader standing at HEAD
        can see and hash the exact frozen bytes without git archaeology and
        without trusting a narrative, and the repair becomes
        supersede-BY-ARTIFACT rather than supersede-by-narrative.
      - >-
        IT RESTORES THE REPOSITORY'S OWN PRECEDENT for changing a frozen
        specification, used on this same experiment family a day earlier:
        experiments/EXP-IC-002/amendments/v1_to_v2.yaml states that
        "specification.yaml version 1 is PRESERVED UNCHANGED. This amendment
        supersedes the named fields; it does not overwrite them." Repair-in-place
        alone inverts that practice; M4 restores it.
    why_it_is_NOT_executed_in_TASK-20260727-032: >-
      STATED PLAINLY RATHER THAN QUIETLY DEFERRED. This session has NO SHELL and
      NO Git access. It cannot run `git cat-file`, cannot hash a file, and
      therefore cannot produce a companion it could honestly attest to be
      byte-identical to blob 1c6f10b7 or 8987eb01. Hand-transcribing a 923-line
      and a 511-line file through an editor and then asserting byte-identity
      inside the very record whose subject is attestation integrity would be
      precisely the fabrication this batch exists to prevent. Adoption is
      therefore a decision here and an execution in TASK-20260727-033, which is
      the single next action.
    write_scope_consequence: >-
      HAD M4 been executed under TASK-20260727-032, that card's `write_scope`
      would have had to widen by EXACTLY the two companion paths above and by
      nothing else. Because it is executed under TASK-20260727-033 instead, that
      widening attaches to the new card: TASK-20260727-033's `write_scope` is
      exactly those two experiment paths plus its own task and archive
      directories. Recorded as required queue amendment QUEUE-AMEND-20260727-003.
    rejected_alternatives_recorded_for_completeness:
      - id: M5
        name: Relax check_experiment to tolerate the parse failure
        rejected_because: >-
          It changes the INSTRUMENT to clear a defect in the OBJECT and would
          simultaneously mask the eleven other unparseable specifications.
          Strictly worse than every other option.
      - id: M6
        name: Add the five errors to tools/validate_ledger_baseline.txt
        rejected_because: >-
          Expressly forbidden. The baseline is prune-only by construction
          (validate_ledger.py:472-477) and its header states lines may only ever
          be REMOVED. It is outside every BATCH-008 write scope (INT-BATCH008-F)
          and the Executor did not touch it - verified byte-unchanged.
      - id: M7
        name: Do nothing; record the five errors as a known integrity note
        rejected_because: >-
          Defensible on proportionality grounds and NOT absurd - it was the option
          with zero rule-4 exposure, and the batch never weighed it, which is a
          real omission. It is rejected because three of the five errors are
          charged against EV-STR-003, DEC-20260727-009 and DEC-20260727-008, which
          are CORRECT immutable records made to look defective by a defect
          elsewhere. Leaving correct immutable records permanently flagged as
          broken is its own integrity cost.

