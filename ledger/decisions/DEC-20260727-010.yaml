  limitations:
    - >-
      NO HYPOTHESIS MOVES. H-STR-002 remains `weakened` per DEC-20260727-009 and
      H-IC-001 remains `weakened` per DEC-20260727-008. ledger/hypotheses/ is
      absent from this task's write scope and no hypothesis record is written.
    - >-
      NOT A RESEARCH RESULT. No measurement, no run, no certificate, no solve, no
      relation, no attack, no attack improvement, no closure, no impossibility
      claim, no result at any tier. No asymptotic exponent moves in any
