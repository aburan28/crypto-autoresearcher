    - >-
      THE LEDGER DOES NOT NOW VALIDATE: 985 errors remain, exit code 1, and
      eleven specifications remain unparseable and grandfathered.
    - >-
      THE DISANALOGY WITH 5de2db97 IS NARROW. It rests on L1 - no valid parse -
      and on nothing else. Three of the five gate clauses in CORR-20260727-004 are
      satisfied as of today (L1, L2-in-substance, L5); L3 is scheduled and L4 is
      permanently unmet for this repair. THIS REPAIR IS NOT A CLEAN INSTANCE OF
      THE PRECEDENT IT DEFINES AND MUST NOT BE CITED AS ONE.
    - >-
      AUTHORIAL INTENT IS UNPROVABLE. Source-text preservation is established;
      recovery of an intended parse is not, and for EXP-STR-003:407 the repair
      makes a conservative choice that is judged correct from context but is
      inference, not proof.
    - >-
      THE SNAPSHOT ELEMENT IS HAND-VERIFIED, NOT DISPATCHER-VERIFIED
      (INT-BATCH007-T / INT-BATCH008-C). All BATCH-008 archive tasks stay `queued`
      with null commit_sha while producing real, git-checkable commits, and no
      receipt hash is fabricated.
    - >-
      RC-3 IS NOT DISCHARGED IN THIS COMMIT. The Red Team's probes ran outside the
      repository and remain unarchived; the duplicate-mapping-key and
      type-coercion scans in particular have no independent archived
      corroboration and are recorded as believed-but-unverified here.
    - >-
      MODEL POLICY UNVERIFIED. Both reviews resolved to claude-opus-5 with
      `model_verified: false` (orchestration/adapter is absent on this branch, so
      `doctor --probe` cannot run) and RT-20260727-004 records
      `fallback_used: true`. Neither claims equivalence to the requested policy.
      NO CLOSURE QUORUM IS CLAIMED OR CLAIMABLE: this tree's AGENTS.md has no rule
      13, and three pairwise-distinct resolved model identifiers are not
      available. Nothing in BATCH-008 closes anything, so none is needed.
    - >-
      THIS DECISION IS NOT DURABLE UNTIL THE TASK-20260727-032 LEDGER COMMIT IS
      MADE AND THE POST-COMMIT VERIFIER ACCEPTS IT. commit_sha, parent_sha and
      path_sha256 are null throughout this batch by construction.

