    - TASK-20260802-006
    - TASK-20260802-007
  rationale:
    - >-
      Snapshot provenance and frozen parameter binding are exact, so the
      invalid receipt is durable and must be preserved rather than discarded.
    - >-
      The mandatory live plant failed, which makes the package inadmissible
      under its preregistered control contract.
    - >-
      The gate failure has a named dynamic-range obstruction: R_null/4 is
      27.8874, far above the 0.9 threshold. Repeating the same gate cannot
      discriminate the competing explanations.
    - >-
      The R interval targets the wrong estimand, excludes its point estimate,
      and lacks source samples; the R_null interval is not a bootstrap.
    - >-
      A count of one invalid control is not closure. Packaging-versus-structure
      remains open with concrete forward guidance under the inventor protocol.
  limitations:
    - Toy point-sum proxy only; not a Groebner/Semaev end-to-end attack.
    - No sparse relation-yield, rank, linear algebra, descent, or solve evidence.
    - No admissible speedup or exponent delta; all promotion gates remain open.
    - A successor control requires a new specification and independent review.
  evidence_refs:
    - ledger/evidence/EV-DS-002.yaml
    - ledger/evidence/EV-DS-005.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/archives/TASK-20260802-004/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260802-005/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260802-006/red_team_report.yaml
  knowledge_promotion:
