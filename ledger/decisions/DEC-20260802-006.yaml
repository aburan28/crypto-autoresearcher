  context: >-
    BATCH-020 executed exactly one frozen CTRL-RT025-UNPLANTED toy cell after
    repaired pre-execution provenance approval. The run self-classified
    invalid_measurement when the mandatory live /4 plant was not detected.
    Independent Validator TASK-20260802-005 returned INADMISSIBLE and Red Team
    TASK-20260802-006 returned NOT_DISCRIMINATING_INVALID_CONTROL.
  decision: inconclusive
  decision_scope: >-
    Archive the invalid control and its named instrument obstruction. Do not
    admit its ratios as evidence for or against H-DS-001. EV-DS-002 remains
    operative; H-DS-001 remains analyzed. This decision neither authorizes a
    rerun nor changes H-IC-001 or H-STR-002.
  target_ids:
