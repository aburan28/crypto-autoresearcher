  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KN-FIND IS WARRANTED BY THIS DECISION, ON THE MERITS AND NOT FOR CONVENIENCE. The
      promotion gate requires a support or reject_scoped decision backed by evidence of
      strength replicated or strong. This decision is supersede, and EV-GGM-002 carries
      direction neutral at strength inconclusive with proof_status not_applicable, because
      the run set it describes is one computation serialized nine times and measures
      nothing. There is no durable claim about ECDLP, about generic-group simulability, or
      about any augmented oracle to promote: the finding here is that an artifact does not
      support its claim, which is a fact about that artifact and will be obsolete the
      moment a version 2 supersedes it. Two candidate promotions were considered and
      rejected. (1) "The endomorphism oracle is GGM-simulable via [lambda]-multiplication
      and exponent 1/2 is preserved at Theta(log N) overhead" is true and useful, but it is
      REV-20260727-002's unreviewed hand derivation and it restates Wiener-Zuccherato, GLV
      and Duursma-Gaudry-Morain, already covered by KN-TECH-005; promoting it would claim a
      stronger basis than its evidence record earns, which docs/claims-and-verification.md
      forbids. (2) "A control gate whose operands are two literals in the same source file
      cannot establish soundness" is a methodological lesson about this harness, not a
      finding about ECDLP, and belongs in the review artifacts and in this decision.
