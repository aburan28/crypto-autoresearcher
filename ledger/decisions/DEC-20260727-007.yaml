  evidence_note: >-
    EV-GGM-002 is the superseding evidence record for the same run set and is installed in
    the same ledger archive as this decision. EV-GGM-001, EV-ECDLP-007, REV-20260726-005,
    RT-20260726-001, DEC-20260726-007, DEC-20260726-008, DEC-20260727-001 and
    ESC-20260727-001 are the subject matter and the context; the escalation ruling is
    Coordinator direction living in coordination/ and is expressly NOT relied on as
    authority for this transition.
  limitations:
    - >-
      NOTHING IN THIS DECISION IS EVIDENCE FOR OR AGAINST ECDLP HARDNESS. Not about
      prime-field ECDLP, index calculus, any attack stage, any curve, or any candidate
      family. KN-OPEN-001 is untouched. No solve, no relation, no certificate and no cost
      comparison is claimed or implied.
    - >-
      WHETHER THE FOUR AUGMENTED ORACLES ARE GGM-SIMULABLE IS INCONCLUSIVE AND IS NOT
      DECIDED HERE. The evidence in this record cannot discriminate between "the closure
      argument stands" and "the protocol cannot decide the question" AS TO THE ORACLES; it
      decides only that the artifact does not support its claim. Neither this decision nor
      the review establishes that any oracle is non-simulable in fact.
    - >-
      RULE 12 UNDISCHARGED AND RULE 13 UNMET. Both BATCH-009 producers ran fallback_used
      true below their requested policy floors on the same resolved model, claude-opus-5,
      which is also the model that produced REV-20260726-005 and RT-20260726-001. Agreement
      across those four sessions is corroboration by non-communicating sessions, not by
      independent model families, and it is weaker than four opinions. This decision is
      itself subject to later review on a conforming backend.
    - >-
      THE REVIEWER'S EIGHT-SUBJECT HAND DERIVATION IS NOT ADOPTED. Its jet and elliptic-net
      NON_SIMULABLE verdicts, its Theta(B^m) incidence bound and its [lambda] endomorphism
      simulator are derivation-level, unreviewed, and expressly "offered for independent
      checking, not a theorem". They are attributed to REV-20260727-002, are the basis of
      nothing here, and are assigned their own review.
    - >-
      NO COUNTEREXAMPLE CERTIFICATE EXISTS. The Weierstrass-twist test that would produce
      one has never been run and is not authorized by this decision.
    - >-
      TOY CEILING. claim_tier toy is mechanical from the tested parameters, 8, 12 and 16
      bits, and is unreachable above by this protocol at any verdict. No record discussed
      here supports any claim above toy.
    - >-
      THE RUN RECORDS ARE IMMUTABLE AND WERE NOT EDITED. Every defect in them is recorded,
      never filled. EV-GGM-001, DEC-20260726-007, every knowledge entry and
      experiments/EXP-GGM-001/specification.yaml were not overwritten by this decision;
      corrections supersede, never overwrite.
    - >-
      THE TASK-20260727-004 SNAPSHOT RECEIPT IS ABSENT AT ITS DECLARED PATH. The producer
      artifacts this decision rests on are present in a clean worktree but are not bound by
      any committed receipt at authoring time. The archive task must establish and record
      that binding, or stop.
    - >-
      THE AUTHORING SESSION HAS NO SHELL AND NO CLOCK. It ran no git command, computed no
      SHA-256, made no commit and staged nothing, and asserts that no commit happened.
      Every hash it quotes was computed by REV-20260727-002 from Git object content. Commit
      identity, parentage and every binding must be computed and verified by the executing
      session; until the post-commit verifier accepts the commit, nothing here is durable
      or official. The installing session, TASK-20260727-006, likewise has no shell: it
      declared the paths, the message and the expected parent, and the calling session
      computes and verifies every SHA-256 and the commit identity.
