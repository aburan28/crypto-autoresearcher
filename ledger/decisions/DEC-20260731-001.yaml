coordinator_decision:
  id: DEC-20260731-001
  context: >-
    CLOSING EVIDENCE-REVIEW DECISION FOR BATCH-002 OF GOAL-P13-001, on control
    NC-2 of DEC-20260724-016 - the recorded highest-priority next control and the
    recorded deciding measurement for the one position this campaign cannot state
    honestly. Executed as TASK-20260731-001 under the frozen contract
    experiments/EXP-SSI-002/specification.yaml (committed at 35701d8f BEFORE any
    measurement existed), snapshot-archived ALONE as TASK-20260731-002 at commit
    7c2bd6f7155fcf7dafb4bd26075173061877e96b (parent
    f88bd1dd9efbd3960ad45495486cd3e951038edd), then independently validated
    (TASK-20260731-003, verdict passed / VALID-WITH-OBSERVATIONS) and
    independently red-teamed (TASK-20260731-004) before this ledger archive
    (TASK-20260731-005). The pre-registered reading READING-NOT-IDENTIFIED fired
    on GOF-3 and CTRL-CAL-GATE. Evidence record EV-SSI-006.
  decision: refine_and_expand
  target_ids:
    - GOAL-P13-001
    - H-P13-001
    - EXP-SSI-002
    - EV-SSI-006
    - DEC-20260724-016
  status_transitions: []
  status_transitions_basis: >-
    NONE, AND THE ABSENCE IS DELIBERATE RATHER THAN AN OMISSION. H-P13-001 STAYS
    AT `analyzed`. It may not move toward `supported`: all four asymptotic-claim
    promotion gates of agents/coordinator.md remain OPEN and this batch attempted
    none of them. It does not move toward `weakened` or `rejected` either: the
    fired reading identifies no exponent, carries no c, and moves no adjudicated
    position in either direction. EXP-SSI-002 completed a valid run whose
    pre-registered identification gates did not clear; that is a legitimate
    pre-registered outcome and not an invalidity, and it is not a status change to
    the hypothesis.

  # =====================================================================
  # 1. WHY THIS LABEL AND NOT ANOTHER
  # =====================================================================
  label_adjudication:
    chosen: refine_and_expand
    basis: >-
      The run is valid, the arithmetic reproduces independently and
      byte-identically, the controls are clean, three null objects returned three
      zeros, the claim ceiling was respected in every artifact, and the reading is
      mechanically correct under rules frozen before execution. THE DEFECT IS IN
      THE FROZEN CONTRACT'S CHOICE OF MEASURED RANGE, NOT IN THE EXECUTION - and a
      repairable design defect with a named repair is precisely what
      `refine_and_expand` is for. The same label as DEC-20260724-016 is used, and
      the queue's own enumeration of available dispositions names it.
    rejected_alternatives:
      - >-
        `support` - REJECTED. No completion criterion of GOAL-P13-001 is met. No
        exponent was identified, no c was carried, no margin figure was carried as
        a result, and the NIST-I margin was not decided in either direction. There
        is nothing to support.
      - >-
        `weaken` - REJECTED. Nothing was weakened. No adjudicated position of
        H-P13-001 moves; the mathematical validity position, the Heuristic 1
        position and the NIST-III/V position are all untouched, and the NIST-I
        position remains exactly INCONCLUSIVE. A `weaken` would additionally
        require the strongest checkable refutation artifact the result admits, and
        the result admits none, because it refutes nothing.
      - >-
        `reject_scoped` - FORBIDDEN AND NOT SOUGHT. agents/coordinator.md forbids
        `reject_scoped` on a single unreplicated empirical-only run set outright,
        and this is one execution on one host. The red team explicitly did not seek
        it either.
      - >-
        `replicate` ALONE - REJECTED ON THE MERITS. Replicating this design would
        repeat the same blind spot at the same measured range and would re-derive
        the same null inside the same window. The red team said so; the Validator's
        structural finding proves it, since GOF-3 compares residual standard errors
        and is therefore scale-free in n, so ADDING PRIMES INSIDE [20, 40] MAKES THE
        GATE VERY SLIGHTLY HARDER TO CLEAR (n = 8 gives 1.53, n = 16 gives 1.47, n =
        32 gives 1.44). Only widening the range or reducing the noise moves it.
        Replication of the measurement is worth having, but it is worth having AS
        PART OF the expanded design, not instead of it.
      - >-
        `inconclusive` - REJECTED, AND THE REASON MATTERS. `inconclusive` is the
        honest label when the evidence cannot discriminate between explanations.
        HERE IT CAN. The Validator's and the red team's independently computed power
        analyses discriminate decisively between "the effect is genuinely small in
        this window" and "the instrument had no resolution": at the observed noise a
        true c = c_star would have produced a 3.561-bit rise (a factor 11.8), R^2
        0.9971 and a GOF-3 reduction factor of 17.283 against a threshold of 2, and
        CTRL-CAL-GATE would have missed by about a factor of twelve. Calling that
        inconclusive would understate what is known.
      - >-
        `pause` and `supersede` - REJECTED. Two of four batches remain, a decisive
        and cheap next control exists, and no pause condition of GOAL-P13-001 has
        fired. Nothing is superseded wholesale; three specific false statements of
        record are superseded individually in EV-SSI-006, which is a correction, not
        a supersession of the run.
      - >-
        `approve`, `revise`, `expand` - SUBSUMED. `refine_and_expand` carries the
        refinement (the successor contract's corrected design) and the expansion
        (the corrected range) in one label consistent with the campaign's prior
        decision record.

  # =====================================================================
  # 2. THE FINDING
  # =====================================================================
  the_finding_both_reviewers_converged_on: >-
    THE MEASURED AXIS IS THE SMALLER ONE. At log2 p = 256 the committed
    EXP-P13VOW-001 model selects log2 B* = 14.200 (B* about 18820); this sweep
    measured B <= 32 and ell <= 31 - a factor 588, 9.2 bits, ENTIRELY OUTSIDE THE
    MEASURED RANGE, against a per-entry cost that Lemma 3.3 gives only as (B + log
    p)^{O(1)}. The NIST-I question needs c_star*sqrt(256) = 30.76 overhead bits at
    w = 2^30; the measured c = 0.13880213854255802 supplies 2.22. THE REMAINING
    ABOUT 28.5 BITS, IF THEY EXIST, LIVE IN A B-DEPENDENCE THIS DESIGN CANNOT SEE.
    The Validator reached this from the design side and the Red Team from the
    cost-model side, independently. THE RED TEAM CONCEDED IT AGAINST ITS OWN
    RECOMMENDATION - its self-falsifier SF-2 dissents from its own RC-1 on exactly
    this ground ("the B axis is the larger gap ... my probes do nothing for it",
    CC-2) - AND THAT CONCESSION IS THE STRONGEST SINGLE SIGNAL IN THIS BATCH,
    because a reviewer conceding the other reviewer's point on the merits, against
    its own interest, is worth more than either assertion standing alone.

  rationale:
    - >-
      R-1 THE READING FIRED CORRECTLY AND STANDS. READING-NOT-IDENTIFIED fired on
      GOF-3 (reduction factor 1.5523308866750112 against a pre-registered threshold
      of 2) and CTRL-CAL-GATE (the t_mul interval overlaps the primary carried
      interval), under rules frozen at 35701d8f, which the Validator established
      from the commit graph to precede the run commit with both contract files
      byte-identical at both commits. The reading is recorded AS IT FIRED, without
      reframing, in whichever direction it fell.
    - >-
      R-2 THE RUN IS ADMISSIBLE EVIDENCE AND THE VERIFICATION IS EXCEPTIONAL. 656
      independently recomputed quantities, ZERO disagreements, largest absolute
      difference 3.3306690738754696e-16, from a reimplementation that never
      imported, copied or called fit_analysis.py and derived OLS, both intervals
      and the bootstrap by its own route; byte-identical reproduction of
      fit_report.json, summary.json and controls.json from raw-timings.json alone
      in a fresh directory; 13 of 13 digest bindings against git object content; 34
      of 34 mandatory cells executed with zero under-sampled and zero cancelled;
      every cap respected. THE VALIDATOR ALSO DISCLOSED AND CORRECTED ITS OWN ERROR
      - a double log of the M-B regressor that produced 48 spurious disagreements -
      and concluded on re-derivation that THE PRODUCER WAS RIGHT. A review that
      publishes its own mistake is worth more than one that reports none.
    - >-
      R-3 THE NULL IS REAL AND IS NOT A POWER FAILURE, AND BOTH HALVES OF THAT
      SENTENCE ARE CARRIED. The design's minimum detectable c is 0.1975 and the
      truth in this window is about 0.1388, just under it; c_star = 1.9224 sits 9.7x
      above the floor and would have been detected at seventeen times the GOF-3
      threshold, with CTRL-CAL-GATE missing by about twelvefold. THE ACCURATE
      SENTENCE IS "in the measured window the p-dependence of the host-normalised
      per-entry cost is below the pre-registered detection threshold of c = 0.1975,
      and a c of order c_star would have been detected at 17x the threshold" - NOT
      "the experiment could not see a p-dependence". Three null objects returning
      three zeros (NULL-1, NULL-2 and the ungated t_noop) confirm the harness is not
      manufacturing a p-dependence out of nothing.
    - >-
      R-4 THE EXCLUSION IS REAL INFORMATION AND THIS DECISION DOES NOT STATE IT AS
      A BOUND. In the measured regime the data exclude c ~ 1.9 by a factor of about
      8. THE RUN CORRECTLY DECLINED TO CALL THAT A FINDING, because every gate
      EXP-SSI-002 pre-registered is an IDENTIFICATION gate and none is an EXCLUSION
      bound, and converting a null into a bound after seeing it is the post-hoc
      criterion movement S-10 forbids. If the program wants that exclusion stated as
      a bound - and it should - THAT IS A FUTURE CONTRACT CARRYING AN EXPLICIT
      EXCLUSION GATE FROZEN BEFORE EXECUTION, NOT A REINTERPRETATION OF THIS ONE.
      Recorded as a required design element of the successor contract.
    - >-
      R-5 THE MEASURED WINDOW MAY ITSELF BE A FLOOR, AND THAT QUESTION IS OPEN
      RATHER THAN ANSWERED. The red team, following CTRL-RT039-A's
      adversarial-mutation-selection rule, perturbed the DESIGN rather than the fit
      and extended the same timed-window shape past the contract's frozen ceiling;
      qualitatively the flatness did not survive, with the modular-polynomial
      specialisation component barely growing while the root-finding component came
      to dominate the timed window. THESE ARE PROBES AND ARE NOT MEASUREMENTS OF
      RECORD - 30 steps per cell against a 300-entry admissibility floor, no
      controls, no intervals, no pre-registration - AND NO NUMBER OR FITTED EXPONENT
      FROM THEM IS CITED AS EVIDENCE ANYWHERE IN EV-SSI-006 OR IN THIS DECISION, NOR
      MAY ANY OF THEM SET A THRESHOLD IN THE SUCCESSOR CONTRACT. They inform the
      successor's design and nothing else.
    - >-
      R-6 THE FROZEN CEILING WAS A DESIGN CHOICE, NOT A CONSTRAINT OF THE PROBLEM,
      AND THAT IS THIS COORDINATOR'S DEFECT TO OWN. The run consumed 178.666 s of
      5400 s, leaving 5221 s unspent, and no cell hit any cap; eight
      OPTIONAL-IF-BUDGET cells were skipped by a scheduling decision expressly not
      forced by budget, weakening the only evidence base ST-V has. Table
      construction at cryptographic p is infeasible, but the PER-ENTRY cost of one
      neighbour expansion at log2 p = 256 is measurable in minutes, and per-entry
      cost is exactly what NC-2 asked for. EA-1, declared as unavoidable, was
      avoidable inside the batch's own authorization. THE APPROVED CONTRACT FROZE
      exponents_log2p AT {20..40} WITHOUT A REASON TIED TO THE MEASURED QUANTITY,
      AND THAT IS AN ERROR OF THE OPENING DECISION, NOT OF THE EXECUTOR.
    - >-
      R-7 THE PROFILE STANDARD IS NOT MET AND IS RECORDED AS NOT MET.
      docs/target-result-profile.md requires validation at cryptographic scale, and
      AGENTS.md rule 7 forbids presenting toy-curve evidence as crypto-scale
      validation. This batch validated at log2 p <= 40 and B <= 32 against a target
      of log2 p = 256 and B* about 2^14.2. The cost half of the conditional result
      is therefore NOT validated at scale, and the heuristic half (NC-3) is
      untouched and remains outstanding as OBL-BATCH002-01 against BATCH-003.
    - >-
      R-8 PREMATURE CLOSURE IS REFUSED. docs/inventor-protocol.md treats declining
      to search as a failure mode symmetric with overclaiming, and its closure
      standard requires a NAMED OBSTRUCTION plus forward guidance. THERE IS NO
      OBSTRUCTION HERE - there is an unspent budget and a frozen parameter that
      should not have been frozen where it was. The NC-2 lane is NOT closed. A null
      obtained inside a possible measurement floor is a report about the instrument,
      not a statement about Algorithm 1.

  # =====================================================================
  # 3. FALLBACK ADJUDICATION - RULED ON EXPLICITLY, NOT RESOLVED BY SILENCE
  # =====================================================================
  inference_amendment:
    id: INF-AMEND-20260731-001
    approved_by: coordinator
    approved_at: '2026-07-31'
    scope: TASK-20260731-001 (executor), TASK-20260731-003 (validator), TASK-20260731-004 (red team), TASK-20260731-002 and TASK-20260731-005 (coordinator archives) of BATCH-002 of GOAL-P13-001.
    the_facts: >-
      Every handoff of BATCH-002 set inference.fallback_allowed false and
      inference.degraded_allowed false. Every card ran with fallback_used true on
      resolved model claude-opus-5 with model_verified false, because no
      GPT-5.6-family model named by orchestration/model-policies.yaml is resolvable
      under this harness. AGENTS.md: a substitution REQUIRES fallback_allowed in
      the handoff, and accepting a model that misses a stated requirement
      ADDITIONALLY requires degraded_allowed and a Coordinator-approved
      inference_amendment with the gaps recorded in degraded_requirements. Neither
      permission was present. THIS IS A POLICY VIOLATION AND IT IS NAMED AS ONE.
    ruling_on_admissibility: >-
      THE RUN IS ADMISSIBLE. The violation is real, but it is a DISPATCH-LEVEL
      DEFECT OF AN UNSATISFIABLE CONSTRAINT, not a producer's silent substitution,
      and it does not touch the evidentiary content of the measurement.
    basis:
      - >-
        A-1 NOTHING WAS SILENT. AGENTS.md rule 11 forbids an agent silently
        altering its own model or reasoning level. Every one of the three roles
        recorded requested_policy, the actually resolved model, model_verified
        false with its reason, fallback_used true AND fallback_allowed_by_handoff
        false, with an explicit disclosure. The Executor disclosed it, the Validator
        recorded the same conflict against itself and expressly referred it here
        rather than resolving it, and the Red Team assessed it and expressly
        declined to adjudicate. That is exactly the behaviour the rule exists to
        produce.
      - >-
        A-2 THE CONSTRAINT WAS UNSATISFIABLE WHEN IT WAS EMITTED. Claude Code
        cannot resolve GPT-5.6-family policy aliases at all; CLAUDE.md's own model
        policy note records that subagent frontmatter supports only Claude models
        and that all subagents therefore run `model: inherit`. `fallback_allowed:
        false` could not have been honoured by ANY actor on ANY card. THE DEFECT
        BELONGS TO THE DISPATCH STEP THAT EMITTED IT - which includes this
        Coordinator's own opening - AND NOT TO THE EXECUTOR OR EITHER REVIEWER.
      - >-
        A-3 THE MEASUREMENT DOES NOT DEPEND ON WHICH MODEL WROTE THE SCRIPT. The
        arithmetic is independently recomputable from the archived raw data: the
        Validator recomputed 656 quantities with zero disagreements using its own
        code, reproduced three derived artifacts byte-identically, and the Red Team
        independently reproduced the primary fit to six digits. Discarding a
        measurement that survives that on a permissions technicality would be a
        worse error than recording the violation and admitting the run.
      - >-
        A-4 THE SYMMETRY OF AGENTS.md CORE RULE 3. A harness-level impossibility is
        infrastructure signal. Infrastructure signal is never a negative
        mathematical result; symmetrically, it is not grounds to void a verified
        measurement. What it IS grounds for is a recorded governance defect and a
        change to the dispatch template, which this amendment makes.
    what_was_actually_degraded_degraded_requirements:
      - >-
        DR-1 REVIEW-POLICY REASONING TIER UNVERIFIED. TASK-20260731-003 and
        TASK-20260731-004 requested `review-xhigh` (the pre-2.0 alias of
        `review-adversarial`), which requires xhigh reasoning and an independent
        session. The independent-session half WAS honoured. The reasoning-tier half
        is UNVERIFIABLE: model_verified is false on both cards and no
        `python3 -m orchestration.adapter doctor --probe` confirmation exists, so
        the served capability is unverified configuration.
      - >-
        DR-2 MODEL-LEVEL INDEPENDENCE ABSENT - THE MOST IMPORTANT GAP. Producer,
        Validator and Red Team all resolved to claude-opus-5. Independent review is
        the specific capability the review policy exists to buy, and correlated
        blind spots across the three roles are NOT excluded by this design. The Red
        Team's own diagnosis is that the shared model protected the MECHANICAL
        execution layer, which worked, but not the SELECTION layer where the prime
        range was chosen, and that it broke the shared prior only because
        CTRL-RT039-A forced it to select its own perturbations. THE MITIGATION
        WORKED AND IT IS NOT A SUBSTITUTE FOR THE MISSING INDEPENDENCE, AND NO
        RECORD OF THIS BATCH ASSERTS MODEL-LEVEL INDEPENDENT CONFIRMATION.
      - >-
        DR-3 EXECUTOR POLICY UNRESOLVED. TASK-20260731-001 requested
        `executor-implementation` and resolved to the same shared model, likewise
        unverified.
      - >-
        DR-4 THE AMENDMENT IS RETROSPECTIVE, AND THAT IS ITSELF AN IRREGULARITY
        RECORDED RATHER THAN GLOSSED. AGENTS.md contemplates a Coordinator-approved
        inference_amendment BEFORE a degraded model is accepted. This one is written
        at the close because no amendment was written at the opening. Admitting a
        verified measurement under a retrospective amendment is the lesser error
        than voiding it; A RETROSPECTIVE INFERENCE AMENDMENT MUST NOT BECOME THIS
        CAMPAIGN'S PATTERN, and the standing repair below is what prevents it.
    the_standing_question_decided_rather_than_inherited: >-
      THIS HARNESS CANNOT HONOUR `fallback_allowed: false` AT ALL. Writing that
      field into a future handoff under this harness is therefore either a no-op or
      a standing violation, and it is NOT left to be inherited: I RULE THAT IT IS A
      STANDING VIOLATION AND THAT IT MUST STOP. A constraint that is known to be
      unsatisfiable when it is written manufactures a violation on every card and
      devalues the field for the cases where it would bite. THIS IS THE SECOND
      CAMPAIGN IN WHICH EVERY ROLE RESOLVED TO ONE MODEL, so it is a pattern and not
      an incident.
    binding_ruling_for_the_remainder_of_GOAL_P13_001:
      - >-
        F-1 Every future handoff of this goal under this harness MUST set
        inference.fallback_allowed true WITH the declared fallback named
        (claude-opus-5) and inference.degraded_allowed true WITH
        degraded_requirements PRE-LISTED (at minimum DR-1, DR-2, DR-3 above), under
        this amendment - OR the dispatcher MUST resolve a genuinely distinct
        backend for the review roles. Emitting `false` while knowing it cannot hold
        is not permitted.
      - >-
        F-2 model_verified stays FALSE and is reported as false until
        `python3 -m orchestration.adapter doctor --probe` confirms a backend serves
        the identifier. No record may treat an unverified identifier as verified.
      - >-
        F-3 A CONSEQUENCE THAT MUST BE STATED PLAINLY. AGENTS.md core rule 12
        requires independent `review-breakthrough` review at `max` for any claimed
        breakthrough, closure result or contradiction of established evidence, and
        that policy MAY NEVER BE DEGRADED on any backend that cannot reach `max`.
        Under this harness that policy cannot be served at all. THEREFORE NO CLAIMED
        BREAKTHROUGH, CLOSURE RESULT OR CONTRADICTION MAY BE ISSUED UNDER THIS
        HARNESS, INDEPENDENTLY OF ANY BUDGET OR SCHEDULE. This reinforces, on a
        second and independent ground, that GOAL-P13-001 cannot be closed here.
      - >-
        F-4 The dispatch template that emitted the unsatisfiable constraint is to be
        fixed before BATCH-003 is opened, so the next batch does not reproduce the
        violation. Recorded as a component of the single next action.

  # =====================================================================
  # 4. THE THREE FALSE STATEMENTS OF RECORD
  # =====================================================================
  false_statements_of_record_superseded_not_repaired:
    method: >-
      ALL THREE ARE CORRECTED BY SUPERSESSION IN EV-SSI-006
      (superseding_corrections SUP-1, SUP-2, SUP-3). NO ORIGINAL ARTIFACT IS EDITED:
      run records, ledger records and archive receipts are immutable and corrections
      create new records (AGENTS.md core rule 4). Each correction quotes the
      inaccurate text, names its exact location, and states the accurate position.
    items:
    - id: FSR-1
      statement: >-
        SUP-1. READING-NOT-IDENTIFIED's frozen text, quoted in fit_report.json, says
        "NO MARGIN FIGURE IS PRODUCED" and SIXTY ARE PRODUCED, under
        extrapolation_for_all_series, each labelled EXTRAPOLATION. The dispatching
        session's snapshot receipt repeated and strengthened the claim ("NO NIST-I
        margin figure produced") and is likewise inaccurate about the file's
        contents. THE ACCURATE POSITION: no margin figure is CARRIED as a result -
        the primary extrapolation key is null and no c was carried - while 60
        labelled extrapolation figures are RETAINED as non-claim arithmetic on a fit
        the run itself declares not adequate, for a legitimate stated purpose the
        Validator independently confirmed. NOTHING IS ASSERTED AS THE NIST-I MARGIN,
        NO c ENTERS A HEADLINE, AND DEC-20260724-016'S INCONCLUSIVE POSITION STANDS.
        Source: Validator DEF-2 / HC-2.
    - id: FSR-2
      statement: >-
        SUP-2. execution_report.yaml line 374 asserts "EA-1..EA-6 attached", and
        EA-1, EA-2, EA-4, EA-5 and EA-6 APPEAR ZERO TIMES in fit_report.json - only
        EA-3 is attached, four times, to the 60 figures. The overstatement is
        recorded. EA-3 is the assumption that most needed to be beside the numbers
        and it correctly is; the other five are not, contrary to honesty_constraints
        bullet 3, and they are present in full in the frozen specification. The
        defect touches no carried number and does not affect the reading. Source:
        Validator DEF-1 / CM-5 (recorded FAIL).
    - id: FSR-3
      statement: >-
        SUP-3. fit_report.json asserts "all_memory_budgets_also_reported": true and
        execution_report.yaml D-6 says margins at w in {2^30..2^80} "are reported
        alongside" - and NO MARGIN AT ANY w OTHER THAN 2^30 EXISTS IN ANY ARTIFACT.
        The red team searched every artifact and found none. It does not change which
        reading fires, since c_star exceeds 1.61 at every feasible w while the largest
        c_hi anywhere is 0.7745, but it matters for any quoted margin, which moves
        from 32.05 bits at w = 2^30 to 57.05 bits at w = 2^80. Source: Red team OBJ-5.
    note_on_a_fourth_latent_trap: >-
      READING-SMALL-C's PROSE HAS ITS INEQUALITY BACKWARDS relative to its own
      condition and the committed model's sign convention (red team OBJ-8). It had
      NO effect on this run, because readings were evaluated mechanically on
      conditions and READING-NOT-IDENTIFIED took precedence. THIS DECISION QUOTES NO
      READING-SMALL-C PROSE, deliberately. It is carried in EV-SSI-006 as
      OBJ-8-CARRIED and its repair is superseding text in a successor contract,
      never an edit to the frozen EXP-SSI-002.

  # =====================================================================
  # 5. WHAT THIS DECISION EXPLICITLY DOES NOT DO
  # =====================================================================
  explicitly_not_concluded:
    - No completion criterion of GOAL-P13-001 is met. Neither of the two recorded criteria is satisfied by this batch.
    - H-P13-001 REMAINS AT `analyzed` and no asymptotic-claim promotion gate is asserted as met. All four remain open.
    - >-
      THE NIST-I CONCRETE MARGIN REMAINS INCONCLUSIVE, EXACTLY AS DEC-20260724-016
      LEFT IT AND FOR EXACTLY THE REASON IT GAVE - the 2.3-bit margin sits inside
      the model's own 3.51-bit irreproducibility band. This batch did not decide it
      in either direction and does not claim to have narrowed it.
    - GAP-1 AND GAP-2 REMAIN OPEN AND UNREPAIRED. Supplying SEED-A made execution possible and discharged nothing; a failed red-team attack on that choice is not a repair of the defect.
    - Section 4.1 REMAINS UNVERIFIABLE-AS-WRITTEN, its stated lower bound overestimating the provable bound by about 2.2 bits.
    - >-
      HEURISTIC 1 IS NOT VALIDATED, SUPPORTED, WEAKENED OR REFUTED, and its tail at
      the operating point u ~ 13 retains ZERO experimental resolution. Nothing in
      this batch samples it. H-P13-001's heuristic_1_status is carried unchanged.
    - NC-1 AND NC-3 OF DEC-20260724-016 ARE NEITHER OPENED NOR ADDRESSED and remain at their recorded priorities. NC-3 remains outstanding as OBL-BATCH002-01.
    - NO CLOSURE QUORUM IS CLAIMED OR CLAIMABLE. Three pairwise-distinct resolved models are not available under this harness, and no attestation was obtained or recorded. GOAL-P13-001 is not set to `completed`.
    - NO ATTACK WAS EXECUTED OR AUTHORIZED AT ANY SIZE, no parameter change is recommended, and nothing here bears on CSIDH, (qt-)PEGASIS or torsion-based schemes.
    - A PASSING VALIDATOR IS NOT A CRYPTANALYTIC RESULT, and a snapshot or ledger commit makes work durable without upgrading its strength or its scope.

