      together with the paired power-analysis pattern that distinguishes "small
      effect here" from "no resolution". It is proven arithmetic rather than a
      measurement, it generalises beyond this campaign, and it is scheduled for
      promotion as a KN-FIND at the BATCH-003 close if the successor design
