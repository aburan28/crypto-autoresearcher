      same ledger archive commit. IT IS NOT PROMOTED NOW BECAUSE PROMOTING A
      DESIGN LESSON DRAWN FROM A SINGLE UNREPLICATED BATCH IS THE SAME ERROR IN A
      SMALLER COAT.

