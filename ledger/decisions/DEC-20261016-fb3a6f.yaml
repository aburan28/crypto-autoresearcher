    safecurves_comparison_cell_changed: false
  synthesis_statement: >-
    Verified provenance, not an attack. Each of the ten X9.62 / FIPS 186-2
    prime-curve seeds is a 20-byte block of (int)(drand48()*256) output after
    srand48(t), with t a UNIX time between May 1997 and April 1998. Four of the
    five binary-curve seeds are lrand48 words after srand48(t/2) on 1998-04-17.
    The base points of P-192, prime192v2/v3 and prime239v1-3 come from FreeLIP
    zrandom. This much is reported by two primary sources (KN-LIT-d2f917) and
    reproduced internally (research/nist_seed_provenance_20261016/), and the
    internal reproduction is not yet independently validated. Four things
    remain unexplained: the B-163 seed; the base points of P-224, P-256, P-384
    and P-521; why about half of the fully qualifying candidates in each run
    were skipped (10 published, 11 skipped; a preregistered screen found no
    rule); and therefore the exact selection. Freedom left to the generator:
    about 30 bits per curve (Valsorda, reported, under stated assumptions).
    Unchanged: ECDLP hardness on every one of these curves, twist and
    invalid-curve analyses, Shor, and every attack cost. The expected
    SafeCurves rigid = false for P-224, P-256 and P-384 still holds.
  rulings:
    - ruling: correction
      record: CORR-20261016-0bf0b2
      statement: >-
        The rigidity closures in the three NIST SafeCurves planning dossiers
        rest on the premise that the seed's provenance cannot be recovered by
        computation, and that premise is false for these curves. The correction
        is a new record. The five archived artifacts it names are left
        unedited. The closures' narrower content, that checking b = F(S) alone
        does not bound how S was chosen, stands. The successor lanes L-RIGID
        and D8 must read the correction before they report.
    - ruling: literature
      record: KN-LIT-d2f917
      statement: >-
        The two primary sources become one literature entry with provenance
        retrieved and confidence reported. verified_by names the top-level
        session that read them.
    - ruling: knowledge_addenda
      records: [KN-TECH-031027, KN-LIT-b58682, KN-TECH-6ead00, KN-TECH-0f24d0, KN-OPEN-cc1988, KN-OPEN-ed922d, KN-OPEN-cbbd97]
      statement: >-
        Each entry gets a dated addendum, labelled as a disclosure and not a
        retraction, appended after the existing text. knowledge/README.md says
        corrections supersede and substance is never rewritten silently. None
        of these seven passages is withdrawn: each is accurate about its
        source or its general mechanism, and the new fact narrows only its
        application to the historical NIST curves. So the repository's
        addendum precedent applies (KN-TECH-7745e6 and KN-TECH-95a42b,
        "Addendum ... disclosed per AGENTS.md immutability rules - not a
        retraction"), not supersession. If a reviewer judges any of these
        passages a substantive error, it must be superseded under a new KN id.
    - ruling: problem_history
      record: problems/nist-seed-selection-rule-unexplained.md
      statement: >-
        One additive, dated history entry records that the preregistered
        screen in the bundle was a predeclared attempt at the second exit
        condition and was negative. No existing text is rewritten and the
        status stays open. problems/README.md needs no change, because the
        row's status and exit condition are unchanged.
  rationale:
    - >-
      AGENTS.md core rules 4 and 6: results are immutable, and negative
      evidence closes only the exact tested scope. The correction narrows an
      overbroad closure. It neither opens nor closes a lane, and it leaves
      every criterion cell to the lanes that would adjudicate it.
    - >-
      Proportionality: every record says this is provenance, scoped to the
      historical curves and the six recovered runs, with no ECDLP consequence.
      The 30-bit freedom figure is always attributed to Valsorda together with
      its assumptions.
