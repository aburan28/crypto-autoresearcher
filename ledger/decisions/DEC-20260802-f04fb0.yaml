coordinator_decision:
  id: DEC-20260802-f04fb0
  context: >-
    GOAL-AES-003 BATCH-003 close. Rank 1 independently re-executed the segment-3
    zero-entry arms; rank 2 ran the cross-instrument anchor and completed
    single-slot hint corruption. Both were bound by a dispatcher-verified snapshot
    before an independent validator and an independent red team read them.
  decision: support
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-96257a]
  rationale:
    - >-
      THE CROSS-BATCH CONFOUND IS SUBSTANTIALLY RESOLVED. Three independent
      implementations now agree EXACTLY on the r=4 M0 arm, and the two campaign
      engines agree exactly on an identical configuration including all thirteen
      histogram bins. The producer's own read was NARROWED NOT CLOSED; the red team
      corrected that as too conservative, because rank 1's independently written
      engine supplied the software-path coverage at a different window
      partitioning and counter width. I adopt the red team's more favourable
      reading ONLY because it rests on a measurement rank 1 actually made, not on
      an argument.
    - >-
      THE r=5 HALF OF THE ROUND-SPLIT RULE SURVIVED ITS DECISIVE TEST, at the
      adversarial index, on an independently generated key, with an independently
      written engine, and M1's non-singularity was confirmed twice by independent
      methods and again by the validator.
    - >-
      AND IT IS NOT PROMOTED, BECAUSE THE RED TEAM FOUND WHAT WOULD VOID IT.
      OBS-B3-4: there is NO decay control and NO null arm for the zero-entry
      matrices anywhere in this campaign. Every arm at r >= 6 uses AES MixColumns.
      Under M0 and M1 every fiber size is a multiple of 256 while under AES
      MixColumns the histogram is Poisson-shaped with max_occ 12, so the zero-entry
      matrices carry a fiber degeneracy that may force n mod 8 = 0 INDEPENDENTLY OF
      ROUND COUNT. If so, the r=5 survival says nothing about round structure. The
      BATCH-001 validator recorded this gap three batches ago and it was never
      filled. A result that survives a test which may not discriminate has not been
      tested.
    - >-
      A COUNTING ERROR OF MINE IS CORRECTED IN CORR-20260803-b4e663. M1 makes fact 2 false at
      j0 = 0 but NOT at j0 = 1, where all four critical entries are nonzero. I
      repeated the producer's "false for every j0" into the snapshot receipt and
      the dispatch card without checking four entries I had the matrix to check.
      The decisive arm was still run at the adversarial index, so the rule is not
      falsified; the coverage claim was overstated.
    - >-
      TWO PROCESS DEFECTS OF MINE ARE IN THE ARCHIVE NOTE. I marked the validator
      FAILED on the strength of a status message without opening its directory,
      where a complete 57KB report was already written, and I was about to cap the
      batch's evidence on that basis. And I reported a check_merge_hygiene PASS
      from a pipeline whose output I never read; it has in fact been failing since
      BATCH-002 landed, on five zero-byte artifacts of killed runs.
  evidence_refs: [EV-AES-96257a, CORR-20260803-b4e663, EV-AES-d8a13e]

  limitations:
    - Toy tier. r in {4,5,6}, one 2^32 coset, few keys, one machine.
    - Session and implementation independence only; NOT model independence, so nothing counts toward a closure quorum.
    - The software counting kernel is anchored at count level by a single arm.
    - Rank 4 has no positive control; the backward-compatibility check compares two false-hint results.
    - The validation report is archived unedited and does not parse as YAML.

  next_actions:
    - >-
      SINGLE NEXT ACTION: open GOAL-AES-003 BATCH-004 with THE ZERO-ENTRY DECAY
      CONTROL as rank 1, in the nibble form the red team specified -- a verified
      non-singular zero-entry matrix over GF(2^4) on the existing 4x4-nibble SPN,
      r = 4/5/6, 40 trials each. Seconds of compute, within an instrument this
      campaign already has, and IT IS THE ONLY QUEUED MEASUREMENT THAT CAN FALSIFY
      THE r=5 HALF RATHER THAN ACCUMULATE AGREEMENT WITH IT. It also fills a
      not_executed item three batches old.
      Rank 2: a true-hint positive control through the modified sq_slot binary.
      Rank 3: the random-bijective-S-box arm on the r=5 YOYO signal -- the one
      campaign result whose S-box dependence has never been measured, and the
      single cheapest test of whether ANY result here is specific to AES.
      Rank 4: a second anchor configuration.
      BATCH-004 IS THE LAST BATCH UNDER GOAL-AES-003's COMMITTED CEILING of
      maximum_batches: 4. Any further batch requires a recorded protocol amendment
      raising that ceiling, with its reason; the ceiling is a committed record and
      is not to be exceeded silently.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, AND THE REASON IS OBS-B3-4 RATHER THAN CAUTION. The candidate
      durable finding is the round-split scoping rule. Its r=5 half now has an
      adversarial-index arm on a fresh key from an independent engine, which is
      what DEC-20260802-b226fb asked for. But the red team then showed the test may
      not discriminate at all: without a decay control, a zero-entry matrix that
      forces n mod 8 = 0 by fiber degeneracy would produce exactly this result at
      every round count. Promoting now would enter a general claim into the
      knowledge corpus on the strength of a test whose discriminating power is
      unmeasured. Revisit immediately after BATCH-004 rank 1, which settles it
      either way in seconds of compute.

  decided_by: coordinator
  decided_at: 2026-08-03
