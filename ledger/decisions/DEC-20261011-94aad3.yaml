      The original execution report recorded its checker as PASS, but even
      that historical verdict cannot satisfy G3's status and gate fields.
    - >-
      DP-4 is also unmet: no write-once BATCH-e409ca revision has set this
      R2b-r5 task queued with its exact eleven run directories or passed
      research_dispatch.py for that revision. A future queue revision alone
      cannot waive DP-2 or DP-3. Keep the current queue and cards unchanged.
    - >-
      Record the nine ordinary R2b-r5 slots as not_attempted because the
      DP-2 and DP-3 admission gates failed: RUN-GFPN-ba6fbe,
      RUN-GFPN-2f652c, RUN-GFPN-460cbc, RUN-GFPN-b0461a,
      RUN-GFPN-588be4, RUN-GFPN-d68f02, RUN-GFPN-4da222,
      RUN-GFPN-027369 and RUN-GFPN-8eaa60. This is a procedural
      classification of absent future packages, not an observation from
      an R2b-r5 trial.
    - >-
      Record the two frozen contingency slots RUN-GFPN-ad9594 and
      RUN-GFPN-ce0dfe as not_attempted. Their R-12 trigger was not reached,
      and the admission gates failed. No replacement run ID is authorized
      by this decision.
    - >-
      Preserve G3's infrastructure classification and the discrepancy
      between its historical checker PASS and fresh isolated checker FAIL.
      A scratch copy of the thirteen tracked G3 files, all hash-equal to
      their source, returned FAIL without certificates/ and PASS after
      adding only an empty certificates/ directory under the same Python
      and python-flint 0.9.0. This shows sufficiency in that scratch replay;
      it does not establish whether the directory existed in the original
      production run or change G3 raw gate_pass false.
    - >-
      Preserve G4's bytes and original classification, while recording its
      disclosed launch after failed G3 as a sequencing deviation. It cannot
      satisfy the frozen RB-4 post-gate admission condition. This decision
      makes no wider scientific admissibility or validity finding for G4.
    - >-
      No evidence, hypothesis, heuristic, experiment or goal status changes.
      No scientific run, independent review, R2b-r5 launch or claim promotion
      is authorized here. A later claim-changing review needs a committed
      review_plan before any reviewer starts.
  rationale:
    - >-
      The R2b card expressly says that if DP-3 fails, this stage is not
      launched and a Coordinator decision rules under RDL-1, recording all
      eleven packages not_attempted with a reason.
    - >-
      Content-first custody verifies the existing files but does not edit
      historical handoffs, revive a failed gate or cure a missing Phase-B
