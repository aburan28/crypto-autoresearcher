  context: >-
    /design-experiment, one contract, for IDEA-20261005-0e9abf. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/mlkem-0e9abf-isometry was created from origin/main at
    868ae268ecb73447ff161d98207af77de4932640 and git merge origin/main
    reported already up to date.

    The contract measures one gap in model ISO-CTRL-1 at n = 64, weight 8,
    q = 3329. The observation that assigns the gap to coefficient isometry
    is a median of at least 2 bits on the ring cell and a median under 1
    bit on plain LWE, with no bit gap on the ideal cell. The observation
    that shows the same gap on plain LWE is a median of at least 2 bits on
    the plain LWE cell, and that observation means the gap is not an
    isometry discount. Success is the first of those and fails on the
    second. No attack and no exponent improvement is claimed. The NTRU
    fatigue ratio is not evaluated. The class-group approximation factor
    is not converted into bits.

    This session opened knowledge/open-problems/KN-OPEN-026.md,
    knowledge/techniques/KN-TECH-045.md, and
    knowledge/techniques/KN-TECH-046.md. It did not open KN-LIT-7663.
    The reported bit figures stay reports. They are not evidence for this
    approval. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. No field required for approval
    was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A gap that remains on plain LWE is not an isometry discount.
    - The plain-LWE cell, the unfolded ring charge, the group-count check, and the refusal to score the ideal cell in bits give the attribution a way to come back negative or invalid.
    - Success is only the first assignment row, so success can fail.
    - No sample was drawn while writing this decision. The 15-bit and 2–3-bit reports were not treated as verified.

  evidence_refs: []
  limitations:
    - Toy scope only: n = 64, weight 8, q = 3329, eight seeds. No transfer to FIPS 203.
    - ISO-CTRL-1 is this protocol's expression. It is not the unread paper's model. The constant lattice term cancels and is not a BKZ output.
    - This decision does not answer RQ-MLKEM-003's sieve question and does not file KN-LIT-7663.
    - This decision authorizes a later run. It does not start one.
    - KN-TECH-045 and EXP-NTRU-fe4ae9 stay out of the cost. KN-TECH-046 stays an approximation factor.

  next_actions:
