  rationale:
    - >-
      PROTOCOL COMPLETE: every required field is non-null and every
      criterion is decidable from the predefined metrics; the contract has
      outcomes that count as negative (F1-F4) and separates instrument
      failure from measurement.
    - >-
      DEPENDENCIES IN COMMITTED STATE: the algorithm, the ~q/2 query count,
      the degree-5 complexity statement, the 4-variable system shape and the
      130-bit estimate are read from inputs/JOUX-VITSE-2010-157/
      paper_fulltext.md (lines 150-160, 678-716, 718-799); curve parameters
      from the frozen Pornin and Hermez packages; the m = 4 symmetrization
      action from the vendored FHJRV HAL text as used by H-GFPN-9a29be. No
      recalled source supports the design. Granger 2010 is not frozen and is
      not needed by this design; its absence is recorded as an impediment on
      the goal head against C2's "JV/Granger" wording, which C2 itself allows
      to close by naming the missing freeze.
    - >-
      HONEST TIER (dispatching card C-8): claim_kind constant_factor -- the
      contract measures the constants of a published algorithm in a declared
      oracle model; the p^{1+o(1)} work shape is Joux-Vitse's and no ECDLP
      exponent claim is made. The proposal's "/16 more with the 2-torsion"
      at m = 4 is not adopted; the (Z/2)^{m-1} factor is 8 and the orbit size
      is measured, not assumed.
    - >-
      FOCUS DISCIPLINE: this is the third critical experiment on the goal,
      at the ceiling. It is admitted because nothing else resolves C2, it
      shares EXP-GFPN-05ff43's driver, and its dispatch is sequenced after
      that implementation commit and after both pending /run invocations, so
      no third solver-running lane is concurrent on a machine that must be
      otherwise quiet for PDP cells.
    - >-
      IDEA-20260920-9e672a is folded in: the contract's HEUR-GFPN-RATE4
      measurement is the one input that record needs, and the (n-1) full-DLP
      attempts lower bound is emitted as a modeled row so C5's JV closure can
      be filed at this experiment's evidence review without a separate
      contract.
    - >-
      ECC area GFPN has unlimited batch/wall budgets; memory caps remain
      machine protection.

