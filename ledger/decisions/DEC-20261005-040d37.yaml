# =============================================================================
# DEC-20261005-040d37 -- GOAL-ECDLP2M-001 PORTFOLIO CHECKPOINT, and the REPAIR
# SPECIFICATION for the BINSTD / CERTBIN evidence stranded on draft PR branches.
#
# THE ONE THING TO TAKE AWAY: the health tool's "all 4 tasks completed; needs the
# next batch" reading of this goal is a head-pointer artifact. The goal has
# eight unclosed lane files on main and two stacks of evidence reviews that exist
# only on PR branches, blocked by schema defects. Opening a new batch now would
# rank against an incomplete evidence picture. So no batch is opened. The next
# act is to make the stranded evidence durable by the legitimate superseding
# mechanisms (S1-S8) and reconcile the lanes (L1-L3), then re-rank.
#
# Nothing here reviews, endorses or changes any evidence record, hypothesis
# status or claim. NOT EFFECTIVE until TASK-20261005-8d4da1 commits it.
# =============================================================================
coordinator_decision:
  id: DEC-20261005-040d37
  id_provenance: >-
    Pre-minted and collision-checked by the dispatching session, relayed.
    Re-checked on the merged tree by TASK-20261005-8d4da1.
  recorded_at: '2026-10-05'
  decided_at: '2026-10-05'
  decided_by: coordinator
  archived_by: TASK-20261005-8d4da1
  goal_id: GOAL-ECDLP2M-001
  question_ids:
    - RQ-BINSTD-b6f698
    - RQ-CERTBIN-836ce2
    - RQ-QSP-f9bbdb
    - RQ-NISTBIN-06157b
  base_checked: >-
    Reported by the dispatching session: origin/main at ad0722d7b5. The PR
    list (40 most recently updated of 95 open PRs) and the CI blocker list are
    the dispatching session's measurements, read here from its scratch files.
    This session read no PR branch.
  standing_authorization: >-
    AGENTS.md standing user authorization (2026-09-06) covers the repair and
    archive work carded here. It approves no experiment and is not used to
    approve one.

  decision: revise
  decision_label: >-
    CHECKPOINT, NO NEW BATCH, REPAIR FIRST. (C1) The "batch complete" health
    reading is diagnosed as a head-pointer artifact. (C2) The stranded
    BINSTD/CERTBIN stacks are repaired by superseding records only, per S1 to
    S8, under TASK-20261005-b73fd8. (C3) Lanes are reconciled per L1 to L3.
    (C4) The goal head is not edited now, and the change owed after repair is
    specified exactly. (C5) A re-rank follows repair.

  context: >-
    tools/goal_portfolio_health.py --no-deepen (dispatching session, ad0722d7b5)
    lists GOAL-ECDLP2M-001 as "all 4 task(s) completed; needs a Coordinator
    checkpoint and the next batch". The head's current_batch_id is
    BATCH-075541, and its open_batches entry reads status closed, closed
    2026-09-30, outcome completed (lanes/BATCH-075541.closed.json present). The
    four tasks are that batch's. But coordination/goals/GOAL-ECDLP2M-001/lanes/
    on this tree holds EIGHT lane files with no .closed counterpart:
    BATCH-1faf6f (2026-09-20, QSP implement), BATCH-ed05f2, BATCH-9dbda3,
    BATCH-ee209c and BATCH-2c4a9c (2026-09-21, EXP-QSP-70b731 execution lanes,
    session wt-qsp-run, branch exec/qsp-70b731-run-20260921), and BATCH-d08b44,
    BATCH-bc5bd5 and BATCH-521e9d (2026-10-02, coordinator-portfolio-rm3mrv:
    LANE-B-V4, NISTBIN-V4 and QSP-SUCC-R). EXP-QSP-70b731 has 14 run manifests
    on main. The head's next_action (amended 2026-10-02 under
    DEC-20261002-c01bb7 and DEC-20261002-3ba55f) names those three 2026-10-02
    lanes and says their archives were "on open PR #1578". The dispatching
    session reports about 40 draft PRs for EXP-BINSTD-* and EXP-CERTBIN-*
    (design, run and review stacks; #1680 to #1733), several carrying composed
    evidence reviews named in their titles (EV-BINSTD-c45564, -1a0c8d,
    -f1d8e2, -b4e120, -53bc6d, -602614, -78ca0d, -71eabe, -d3a6be, -90c856,
    -cd47a8; EV-CERTBIN-5c2947, -db7f15, -383c07). It also reports the CI
    blockers listed in S1 to S6. The 79a02d design receipt
    (TASK-20261002-8480bf) records that "Portfolio PR #1515 merge with main
    blocked by GOAL-ECDLP2M-001.yaml conflict", which is direct evidence that
    the flat head is a conflict point across branches.

  # ---------------------------------------------------------------------------
  # C1. Diagnosis
  # ---------------------------------------------------------------------------
  C1_health_reading:
    ruling: >-
      ARTIFACT, NOT STATE. The classification follows current_batch_id, which
      names the most recently opened lane, not the goal's open work
      (templates/research-records.md: "NOT a lock"). The goal has unclosed
      lanes on main and unmerged evidence on PR branches. "Needs the next
      batch" is therefore not established, and no batch is opened here.
    why_no_new_batch: >-
      A new batch would (a) be ranked against an evidence set missing the
      stranded review decisions, which are this goal's most recent results on
      two of its five questions, (b) add another stacked branch that edits the
      same flat head, and (c) compete for max_concurrent 3 with lanes whose
      liveness is unknown. Unstranding first is cheaper than any of these and
      changes the ranking input.

  # ---------------------------------------------------------------------------
  # C2. Repair specification. EVERY remedy is a superseding record. No pushed
  #     record is edited, no history is rewritten, nothing is rebased.
  # ---------------------------------------------------------------------------
  C2_repair_specification:
    general_rules:
      - >-
        G-1 INVENTORY FIRST. Before any write, record per PR: number, head sha,
        base branch, draft flag, CI check names and conclusions, the exact
        validator error lines, and changed paths. Map every error line to one
        of S1 to S6. An error that maps to none is NOT improvised; the task
        stops on that PR and reports it to the Coordinator.
      - >-
        G-2 FIX AT THE LOWEST BRANCH. A superseding record is added on the
        lowest PR branch of its stack that contains the defective record, then
        that branch is merged (merge commit, never rebase) into each PR branch
        above it. The superseded file must be present on the branch that holds
        the registry entry, because the validator errors on a missing
        superseded file (check_schema_supersessions).
      - >-
        G-3 NEVER EDIT A PUSHED RECORD, even on a draft branch. Pushed run,
        ledger and handoff records may already be bound by an archive receipt's
        path_sha256. Editing them would break that binding (AGENTS.md rule 15
        and "Durable research commits").
      - >-
        G-4 SHARED APPEND-ONLY FILES. tools/run_supersession_registry.yaml and
        tools/schema_supersession_registry.yaml are lists. A textual conflict
        between two branches that each APPEND an entry is resolved by keeping
        both entries, which is additive and loses nothing. A conflict that
        would change or drop an existing entry stops the merge.
      - >-
        G-5 GOAL HEAD CONFLICTS. ledger/goals/GOAL-ECDLP2M-001.yaml is edited
        additively by lanes (prepended next_action blocks, appended
        open_batches entries and notes). A conflict where both sides only add
        text is resolved by keeping both blocks verbatim, newest decision
        first, as the head's own convention does. A conflict that would alter
        or delete existing head text stops the merge and is returned to the
        Coordinator.
      - >-
        G-6 MERGING IS NOT ENDORSING. Making a branch's records durable on main
        does not review them. Each evidence or decision record keeps exactly
        the official standing that its own verified ledger archive gives it.
        Records whose archive receipt is missing or fails remain unofficial
        after the merge and are listed as such.
      - >-
        G-7 IDs. Any new identifier (a control TASK under S3, a KN-FIND under
        S2) is minted by the dispatcher with tools/allocate_id.py and checked
        with --check. The repair task never invents one.
    items:
      - id: S1
        prs: "CERTBIN group as reported (#1733, #1715, #1720, #1713, #1716); the lowest branch carrying RUN-CERTBIN-0dc7c4 is located by G-1"
        blocker: >-
          RUN-CERTBIN-0dc7c4's manifest.yaml is a flat mapping with no `run:`
          envelope, and a manifest_v2 on the branch carries a certificate.kind
          outside the validator vocabulary and/or a run id that does not match
          (as reported).
        mechanism: run_supersession_registry entry
        specification: >-
          Leave manifest.yaml and the existing manifest_v2.yaml byte-identical.
          Add manifest_v3.yaml beside them, built only from archived bytes: the
          canonical nested `run:` envelope; run.id exactly RUN-CERTBIN-0dc7c4,
          equal to the registry run_id and to the id the flat manifest carries;
          certificate.kind one of discrete_log, decomposition, key_recovery or
          none (tools/validate_ledger.py CERTIFICATE_KINDS plus none). Use
          `none` unless the run package already contains a solve or relation
          certificate that the wrapper re-verified. Do not upgrade a claim tier
          to make a field validate. Add run.supersedes with both prior
          sha256s and the precedence rule that the flat manifest governs every
          field it carries. Register one entry: run_id RUN-CERTBIN-0dc7c4;
          superseded_path the canonical .../runs/RUN-CERTBIN-0dc7c4/manifest.yaml;
          superseding_path manifest_v3.yaml; intermediate_record pinning
          manifest_v2.yaml by sha256 with its role stated (precedent
          RUN-ICPERF-a4a24b); supersession_kind additive_schema_completion;
          defect text naming both defects; registered 2026-10-05; notes "No
          rerun; no measurement, label or verdict changed."
        precedents: [RUN-WESOVOW-201692-001, RUN-ECDLP-122c4e-002, RUN-ECDLP-288336-002, RUN-ICPERF-a4a24b]
      - id: S2
        prs: "CERTBIN group as reported (#1733, #1715, #1720, #1713, #1716); the branch that first adds each decision is located by G-1, not assumed here"
        blocker: DEC-20261003-a6c85a and DEC-20261003-ed98c2 lack knowledge_promotion.
        mechanism: schema_supersession_registry entry (kind ledger) with a v2 record
        specification: >-
          Write ledger/corrections/schema-supersessions/20261005/ledger__decisions__<ID>.v2.yaml
          for each. Copy every original field verbatim, keep the same id (no
          replacement_id), and add only knowledge_promotion plus a
          schema_supersession_note naming DEC-20261005-040d37 and
          TASK-20261005-b73fd8. Fill knowledge_promotion by the rule in
          templates/research-records.md. If the decision is support or
          reject_scoped AND its cited evidence strength is replicated or strong,
          promotion is REQUIRED: either a KN-FIND (id minted by the dispatcher,
          written per /curate-knowledge, in the same archive) or a concrete
          not_warranted reason. Otherwise give a one-line not_warranted reason
          that cites the decision label and the evidence strength as recorded.
          Register each: kind ledger; superseded_path ledger/decisions/<ID>.yaml;
          the two sha256s; defect "archived decision omits required
          knowledge_promotion"; registered 2026-10-05. The repair session
          composes the knowledge_promotion content in the Coordinator role. It
          does not re-review the evidence.
        precedents: [DEC-20260809-cf5022, DEC-20260815-6b806c, DEC-20260807-e0cf50]
      - id: S3
        prs: "CERTBIN stack (TASK-20261003-acd96c) and BINSTD stack (TASK-20261003-46fb77, TASK-20261003-478a3c)"
        blocker: review_plan.proves_too_much.objects missing on three review-opening handoffs.
        mechanism: schema_supersession_registry entry (kind ledger) with a v2 handoff, plus a disclosed procedure deviation
        specification: >-
          The control must not be written as if it had been planned before the
          round. Read the round's reviewer reports first. (a) If a report
          actually ran an argument or measurement against an object for which
          the conclusion is known false, the v2 lists exactly those objects,
          cites report path and section, and uses the failure signature the
          report states. (b) If no report did, the v2 lists the control that is
          OWED (objects and failure signature chosen by the repair Coordinator
          from the claim under review), sets assigned_to to a new control TASK
          (id from the dispatcher; card written by the repair Coordinator), and
          adds a review_plan.procedure_deviations entry: "proves-too-much
          control absent before the round; added post hoc on 2026-10-05 under
          DEC-20261005-040d37; the round's verdicts were formed without it."
          In both cases every other field is copied verbatim and the handoff is
          registered as in S2 (defect "review_plan omits required
          proves_too_much control"). CONSEQUENCE, recorded in the repair
          receipt: decisions composed from a case-(b) round stand as recorded.
          But any later transition, closure or KN promotion that relies on them
          waits until the control task returns.
      - id: S4
        prs: "BINSTD stack #1688, #1693, #1703, #1710, #1718, #1722, #1729"
        blocker: RUN-BINSTD-31cc54 and RUN-BINSTD-aead63 manifests are flat (no `run:` envelope).
        mechanism: run_supersession_registry entries
        specification: >-
          As S1, with manifest_v2.yaml as the superseding record (no prior v2
          exists, as reported; if one exists, use v3 and pin v2 as
          intermediate_record). Companion files required by the run schema
          (stdout.log, stderr.log, command.txt, environment.json) are added
          only as byte-identical copies or explicit transcriptions of archived
          bytes, with sources named (precedent RUN-SSIQ-4de240-a,
          RUN-MLKEM-980909-a).
        precedents: [RUN-WESOVOW-201692-001, RUN-ECRANK-76a70d-armA-n6, RUN-SSIQ-4de240-a]
      - id: S5
        prs: "#1717"
        blocker: merge conflict with main
        mechanism: merge origin/main into the branch; G-4 and G-5 rules
        specification: >-
          Merge, never rebase. If the conflict lies inside an immutable record
          (decision, evidence, hypothesis, handoff, run file, knowledge entry),
          STOP. The resolution is a superseding record under a new id that the
          Coordinator authors. It is never a pick of one side.
      - id: S6
        prs: "#1663"
        blocker: reported redundant with merged #1667
        mechanism: verify, then close with a comment (a git operation, not a research transition)
        specification: >-
          Diff #1663's head against main. Close it only if every path it
          changes is byte-identical on main or is a record that #1667's merged
          records supersede by name. The close comment cites #1667 and this
          decision. If any path is unique, do not close; report the path.
      - id: S7
        prs: "every PR in both stacks after S1 to S6"
        blocker: none of the above
        mechanism: CI-gated merge
        specification: >-
          Mark ready for review, merge bottom-up with MERGE COMMITS only (never
          squash or rebase), and only on a head whose CI checks have all
          concluded success or skipped, with no conflict and no blocking review
          thread (CLAUDE.md "Auto-merge a PR once its CI passes"). Never re-run
          or skip a check to make it green.
      - id: S8
        prs: "#1680 to #1733 not named in S1 to S6"
        blocker: unknown until inventory
        mechanism: G-1
        specification: >-
          A PR with a validator error not mapped to S1 to S6 stops and is
          reported. A PR with none proceeds under S7.

  # ---------------------------------------------------------------------------
  # C3. Lane reconciliation (after the stacks are merged or stopped)
  # ---------------------------------------------------------------------------
  C3_lane_reconciliation:
    - id: L1
      act: >-
        git fetch; python3 tools/goal_lanes.py lanes GOAL-ECDLP2M-001, plus
        research_dispatch.py --claims refs for each of the eight unclosed
        lanes. Record each lane's queue terminal state, its branch, the last
        commit date on that branch, and whether its archives verify on main.
    - id: L2
      act: >-
        Close (tools/goal_lanes.py close-lane, outcome completed or archived as
        the queue shows) ONLY a lane whose every queued task is terminal and
        whose archive receipts verify on main. Never close a lane on age alone;
        a stale lane is not evidence of anything. A lane with non-terminal
        tasks is listed as live, with its next card.
    - id: L3
      act: >-
        Report the live-lane count against max_concurrent 3. The slot order
        recorded by DEC-20261002-c01bb7 R-ORDER-6 governs freed slots unless
        the re-rank (C5) records a new reason.

  # ---------------------------------------------------------------------------
  # C4. Goal head: NOT edited now; the owed change, exactly
  # ---------------------------------------------------------------------------
  C4_goal_head:
    ruling: >-
      NOT EDITED IN THIS ARCHIVE, AND NOT SHARDED NOW. The flat head is changed
      by many open PR branches (PR #1515's blocked merge on this file is
      recorded in the TASK-20261002-8480bf receipt). Converting it with
      tools/shard_goal.py on main now would turn every such branch's additive
      head edit into a path conflict. That is the exact failure sharding
      exists to prevent, triggered in reverse.
    owed_change:
      when: >-
        In TASK-20261005-b73fd8's final ledger archive, after S7 and L1 to L3.
      if_no_open_pr_touches_the_head: >-
        Run `python3 tools/shard_goal.py ledger/goals/GOAL-ECDLP2M-001.yaml`
        as its own commit (verify first: `gh pr list --state open` and, for
        each open PR, whether its diff touches that path). Then write
        write-once shard
        ledger/goals/GOAL-ECDLP2M-001/checkpoints/PORTFOLIO-DEC-20261005-040d37.yaml
        (batch_checkpoint; batch_id BATCH-075541 with a note that it closes
        and opens nothing; decision_id DEC-20261005-040d37; the merged-PR list;
        the L1 to L3 lane table; next_action as below). Then prepend the
        next_action text below to goal.yaml's next_action, with updated_at and
        updated_by.
      if_an_open_pr_still_touches_the_head: >-
        Do not shard. Prepend the same text additively to the flat head's
        next_action in that archive (G-5 convention), and set updated_at and
        updated_by. No other head field changes, except that current_batch_id
        and dispatch_queue_path are left as they are (a pointer, not a lock).
      next_action_text_to_prepend: >-
        AMENDED ADDITIVELY 2026-10-05 UNDER DEC-20261005-040d37 (PORTFOLIO
        CHECKPOINT). Earlier texts below are retained verbatim and remain the
        operative actions of any lane that L1 found still live. GOAL-LEVEL
        NEXT ACTION: one Coordinator ranking pass over this goal's evidence as
        merged by TASK-20261005-b73fd8 and its lanes as reconciled there. It
        assigns freed slots under max_concurrent 3 by DEC-20261002-c01bb7
        R-ORDER-6 unless it records a new reason, and it ranks
        exponent-relevant BINSTD, CERTBIN, QSP and NISTBIN successors ahead of
        cost-constant work. No batch was opened by DEC-20261005-040d37.

  C5_rerank:
    ruling: >-
      After repair, the Coordinator ranks this goal's successors from the
      merged evidence. Inputs: the S2 and S3 outcomes (including any owed
      proves-too-much control), the L3 live-lane count, and the standing order.
      This decision makes no ranking among BINSTD, CERTBIN, QSP and NISTBIN
      successors, because the evidence that would rank them is not yet on main.

  target_ids:
    - GOAL-ECDLP2M-001
    - BATCH-075541
    - TASK-20261005-b73fd8
    - RQ-BINSTD-b6f698
    - RQ-CERTBIN-836ce2

  rationale:
    - >-
      EVIDENCE THAT IS NOT ON MAIN DOES NOT EXIST FOR THE PROGRAM. A record
      that exists only on a branch is "unpublished, not durable evidence"
      (agents/coordinator.md). This goal's most recent binary-curve
      index-calculus results are in that state, behind schema defects that
      have standard, precedented superseding remedies. Unblocking them has the
      highest information value per unit cost of any act on this goal.
    - >-
      EVERY REMEDY IS ADDITIVE. Registries and v2 or v3 records leave every
      pushed byte in place, and so preserve any archive receipt that already
      binds them.
    - >-
      THE PROVES-TOO-MUCH GAP IS DISCLOSED, NOT BACKFILLED. Writing a control
      into a plan after its round, as if pre-registered, would turn a missing
      control into a fabricated one. S3 records the deviation and schedules
      the control.
    - >-
      NO SHARDING YET, because sharding a file that open branches edit
      manufactures conflicts. The head change is specified so that the
      session that completes the repair can apply it with no further
      judgement.

  evidence_refs:
    - ledger/goals/GOAL-ECDLP2M-001.yaml
    - coordination/goals/GOAL-ECDLP2M-001/lanes/
    - coordination/goals/GOAL-ECDLP2M-001/lanes/BATCH-075541.closed.json
    - coordination/goals/GOAL-ECDLP2M-001/lanes/BATCH-d08b44.lane.json
    - coordination/goals/GOAL-ECDLP2M-001/lanes/BATCH-ee209c.lane.json
    - coordination/goals/GOAL-ECDLP2M-001/lanes/BATCH-2c4a9c.lane.json
    - coordination/goals/GOAL-SEMBIN-5078bc/design/TASK-20261002-8480bf/snapshot-receipt.json
    - tools/run_supersession_registry.yaml
    - tools/schema_supersession_registry.yaml
    - tools/validate_ledger.py
    - ledger/corrections/schema-supersessions/20260809/ledger__decisions__DEC-20260809-cf5022.v2.yaml
    - templates/research-records.md
    - "/tmp/claude-0/-home-user/adcb8edd-f307-5072-91b7-66508b35dba1/scratchpad/portfolio_health.md (dispatching session's measurement; not a repository artifact)"
    - "/tmp/claude-0/-home-user/adcb8edd-f307-5072-91b7-66508b35dba1/scratchpad/open_prs.txt (dispatching session's measurement; not a repository artifact)"

  limitations:
    - >-
      This session read no PR branch. The blocker list, the PR-to-record
      mapping and the claim that the listed EV-* records are composed reviews
      are the dispatching session's report and the PR titles. S1 to S6 are
      conditional on G-1's inventory confirming them.
    - >-
      Whether each stranded decision is support, weaken, replicate,
      inconclusive or expand is read from PR titles only. Nothing here relies
      on those labels except to say that S2's promotion rule may apply.
    - >-
      Lane liveness is unknown from main alone. L1 is required before any slot
      is assigned.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. It reads no run and composes no review.
      S2 delegates the promotion question for the two stranded decisions to the
      repair session under the standard rule.

  next_actions:
    - >-
      DISPATCHER, ALONE: TASK-20261005-8d4da1 (ledger archive). Then
      TASK-20261005-b73fd8 in a fresh Coordinator session (repair, lane
      reconciliation, owed head change). Ids for any S2 KN-FIND or S3 control
      task are minted by the dispatcher on request.
  goal_checkpoint:
    shard: none in this archive (C4)
    head_edit: none in this archive (C4); owed change specified in C4.owed_change
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
