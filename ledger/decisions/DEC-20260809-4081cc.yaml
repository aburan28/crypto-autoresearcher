coordinator_decision:
  id: DEC-20260809-4081cc
  context: >-
    Discharges DEC-20260808-3312cc next action N12: adjudicate
    H-INSTR-fffbfb's actual replacement question (can NULL-C be replaced by a
    blocked permutation) from EXP-INSTR-85b102's already-validated v1
    execution report, independently of the non-monotonicity investigation
    that consumed BATCH-aa267f's attention and never returned to this
    question. No new run is executed by this decision; it reads
    already-committed artifacts and, where those artifacts had not yet been
    independently checked, checks them directly.
  decision: support
  target_ids:
  - GOAL-ENDO-001
  - BATCH-aa267f
  - EXP-INSTR-85b102
  - H-INSTR-fffbfb
  - RQ-INSTR-f8faa0
  - EV-INSTR-ffbb5a
  rationale:
  - >-
    H-INSTR-fffbfb STATES FOUR SEPARATELY FALSIFIABLE CLAIMS (C1-C4), AND NONE
    OF THEIR NAMED FALSIFIERS (F1-F7; F8 is an open-anomaly report, not a
    falsifier of any Ci) FIRED ON ANY OPERATIVE RUN. C1 (diagnosis): the
    closed-form free-permutation null mean reproduces the committed 664x ratio
    as exactly the group order plus the 2-torsion term, to 2.86e-14 absolute
    and 2.284e-05 relative -- F1 did not fire. C2 (design): the blocked
    permutation on class-partition-coarsening blocks is a valid conditional
    test with a closed-form null mean -- F3's falsifier (the synthetic
    trace-independent labelling firing outside its exact binomial band) did
    not fire at any of 28 (Executor) / 17 corrected (Validator,
    CORR-20260807-0f5d56) non-degenerate CTRL-NULLOBJ/CTRL-SIZE0 cells. C3
    (utility, "the clause that can say the fix is worse than the disease"):
    the blocked test retains at least 90% power to detect a planted 0.8
    within-class-sd effect at the finest non-degenerate rung -- F4's falsifier
    (power below 0.90) did not fire; measured power is 1.000 (200/200) at
    every one of the four pools' finest non-degenerate rungs, at both primes.
    C4 (consequence, predicted FALSE for the calibration functional ON
    PURPOSE): `order` and `full_liftable` sit at the resolution floor at every
    non-degenerate rung, exactly as predicted, because N is injective in the
    trace and no blocking removes that. This is a CONFIRMATION of the
    mechanism, not a null result.
  - >-
    THE EXPERIMENT CONTRACT'S OWN SC8 -- "THE CLAUSE THAT CAN RETURN A
    NEGATIVE" -- IS SATISFIED WITH LARGE MARGINS AT ALL FOUR POOLS AND BOTH
    TESTED PRIMES. SC8 requires, at the finest non-degenerate rung, a nuisance
    budget reduction of at least 10x AND power at 0.8 sd of at least 0.90.
    Measured: POOL_A (p=4001) 37.7x / power 1.000; POOL_B (p=4001) 130.4x /
    1.000; POOL_C (p=4001) 3207.5x / 1.000; POOL_D (p=6007) 118.0x / 1.000.
    Had no rung at either prime cleared both bars, SC8's own text specifies
    the recorded conclusion would be "THE STRATIFIED NULL IS NOT BETTER THAN
    THE FREE ONE AT THESE POOLS" and the design NOT recommended for adoption
    -- that branch is the one this decision determines did NOT fire.
  - >-
    THIS COORDINATOR INDEPENDENTLY RECOMPUTED SC8'S TABLE FROM RAW COMMITTED
    DATA BEFORE CITING IT, RATHER THAN TRUSTING THE EXECUTION REPORT'S OWN
    SUMMARY. `controls.json` in each operative pool run stores, per rung, the
    raw `rejections`/`replicates` pair at the 0.8-within-class-sd planted
    effect and the raw `nuisance_budget_weighted` at every rung. Recomputing
    reduction = nuisance[R0_FREE] / nuisance[finest non-degenerate rung] and
    power = rejections/replicates directly from those four files reproduces
    the execution report's SC8 table EXACTLY: 37.7x / 200 of 200; 130.4x / 200
    of 200; 3207.5x / 200 of 200; 118.0x / 200 of 200. This Coordinator has
    already been caught once this batch (CORR-20260807-911ef7) repeating a
    reviewer's count unchecked; this number was not repeated unchecked.
  - >-
    A GENUINE WORDING AMBIGUITY IN THE FROZEN EXPERIMENT CONTRACT IS NAMED,
    NOT SILENTLY RESOLVED IN THE DIRECTION THAT FLATTERS THE RESULT. SC8's
    text reads "for at least one primary functional other than `order` and
    `full_liftable`, the nuisance budget is reduced ... AND the power ...
    remains ..." as if nuisance budget and power were per-functional
    quantities. They are not, by the contract's OWN construction: nuisance
    budget is defined as E[T_pi | rung], a property of the block partition
    alone (computed via `order`'s exactly-zero within-class variance), and the
    power curve is measured on a SYNTHETIC planted effect added to the SAME
    partition, independent of any specific functional's real values. The
    Executor flagged this itself rather than resolving it and evaluated SC8
    per pool, "the only coherent reading available." THIS DECISION ADOPTS
    THAT READING FOR A REASON STATED HERE, NOT BY DEFAULT: H-INSTR-fffbfb's
    OWN C3 text -- the underlying scientific claim, as opposed to the
    experiment contract's operationalization of it -- says only that "the
    blocked test still detects a planted between-class effect... at the
    finest non-degenerate blocking", describing a property of the TEST/DESIGN
    exactly as measured, with no per-functional quantifier at all. The
    ambiguity is therefore in SC8's added operational wording, not in the
    hypothesis being adjudicated, and it does not weaken this decision's
    reading of C3.
  - >-
    `decision: support` rather than `expand` or `replicate` because this batch
    discharges an existing hypothesis's stated claims rather than opening new
    experimental ground or reproducing a prior finding; `support` matches the
    hypothesis status this decision sets (`supported_scoped`, following the
    campaign's own precedent at H-SMON-db677d for a result that held on every
    measured instance without a fully independent adversarial pass on every
    claim).
  evidence_refs:
  - EV-INSTR-ffbb5a
  - CORR-20260807-0f5d56
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/validator-instr/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  - experiments/EXP-INSTR-85b102/runs/RUN-INSTR-85b102-poolA-c/controls.json
  - experiments/EXP-INSTR-85b102/runs/RUN-INSTR-85b102-poolB-b/controls.json
  - experiments/EXP-INSTR-85b102/runs/RUN-INSTR-85b102-poolC/controls.json
  - experiments/EXP-INSTR-85b102/runs/RUN-INSTR-85b102-poolD/controls.json
  limitations:
  - >-
    C1 and C2 (and the twist-blocking contradiction bearing on HEUR-INSTR-2)
    are INDEPENDENTLY VALIDATED by a separate reviewing session
    (validator-instr, `passed_with_findings`), which recomputed the S1 gate at
    full precision and confirmed size calibration (with a corrected count,
    17/17 non-degenerate CTRL-SIZE0 cells rather than the Executor's reported
    16/16, per CORR-20260807-0f5d56). C3 (the power claim, which is SC8's
    deciding clause) is verified ONLY by this Coordinator's direct
    recomputation from raw committed data, NOT by a separate reviewing
    session -- validator-instr's dispatch scope was S1, the frozen-function
    receipt, size calibration, the twist contradiction, and the D6 stopping
    rule; it did not include power. This is the reason `H-INSTR-fffbfb`'s
    status is set to `supported_scoped` rather than a plain `supported`.
  - >-
    Every review in this batch's chain, including this Coordinator's own
    session, resolves to the same model on the same backend (CLAUDE.md model
    policy note). "Independent" means independent context and a fresh
    reading, not independent judgement from a genuinely different model.
  - >-
    Scoped to the four declared pools at p in {4001, 6007}, toy scale,
    `claim_tier: toy`. `sota_delta` is zero -- nothing here is an attack cost
    at any scale, and nothing here bears on `RQ-ICINV-475b5e`'s isogeny-class
    invariance question, `H-STR-002`, `H-ENDO-001`, or the N8 within-class
    over-dispersion, which is a different object entirely
    (`EXP-INSTR-85b102`'s own scope statement makes this explicit and this
    decision does not extend past it).
  - >-
    This decision does not retire, replace, or deprecate
    `harness/exp_icinv.py::permutation_null`. The committed free permutation
    is retained and reported at rung R0_FREE as the contamination diagnostic,
    exactly as the frozen contract's `authorization_note` requires; "NULL-C
    can be replaced" is a demonstrated CAPABILITY at these pools, not an
    executed retirement of the existing code path.
  - >-
    This decision does not touch or depend on `EV-INSTR-03fdcf` (the
    non-monotonicity finding) or the voided `CTRL-VALUESHUFFLE` control in
    either direction. Those concern which individual functionals' own R
    sequences decay along the N ladder -- explicitly a REPORTABLE OUTCOME
    under SC5, "not a failure of this clause" -- which is a different
    question from whether the design as a whole retains calibrated size and
    power, which is what SC1-SC8 and C1-C4 test. The two lines of inquiry are
    compatible: N-coupling explaining individual functionals' non-monotone
    decay is consistent with, not contrary to, blocking on N achieving a
    large, real nuisance-variance reduction.
  next_actions:
  - >-
    OPTIONAL, NOT BLOCKING, GIVEN THE MARGINS. A narrow independent review
    dispatch (five minutes of scope) re-deriving power@0.8 and the
    nuisance-budget reduction factor at the four pools' finest non-degenerate
    rungs directly from `controls.json`'s raw `rejections`/`replicates` and
    `nuisance_budget_weighted` fields would let a future record upgrade
    `H-INSTR-fffbfb` from `supported_scoped` to `supported`. Given the
    measured margins (10x required vs 37.7x-3207.5x actual; 0.90 required vs
    1.000 actual), this is unlikely to reverse and is not treated as urgent.
  - >-
    `/curate-knowledge` PROMOTION WARRANTED, DEFERRED. The blocking design
    itself -- coarsen the permutation to blocks that are unions of whole
    classes under a class invariant (N-band or twist pair), which makes the
    null block-separable and its mean closed-form, removing group-order
    contamination from a label-permutation null while retaining full power --
    is a reusable instrument technique, not specific to this campaign's
    functionals. A `KN-TECH-*` entry is recommended as a follow-up but is not
    performed by this decision, which adjudicates evidence rather than
    curating the corpus.
  - >-
    N10 remains the campaign's next dispatched action: re-execute
    `EXP-ICINV-4d33aa` under its approved amendment v2.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not performed by this decision (see next_actions); `/curate-knowledge`
      is a separate lifecycle stage from evidence adjudication and a KN-TECH
      entry should be written by that skill, citing this decision and
      `EV-INSTR-ffbb5a`, once undertaken.
  decided_by: coordinator
  decided_at: '2026-08-09'
