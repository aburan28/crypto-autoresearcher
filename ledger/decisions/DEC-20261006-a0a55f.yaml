  context: >-
    /design-experiment, one contract, for IDEA-20261005-e7ad98. No
    hypothesis and no experiment on origin/main cites it. A search of
    origin/design/pair-3a18d1-hcp, where the idea file lives, finds the
    idea in a proposal and in an archive handoff, not in a hypothesis or
    an experiment specification. The branch design/ectd-e7ad98-conductor
    was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The contract measures the conductor of Z[pi] and the full rational
    5-torsion bit for y^2 = x^3 + x + 1 at p = 13. The prediction is
    conductor 3 together with torsion bit 0. A different conductor is a
    negative. The presence of that torsion is a negative, so success can
    fail. The agreed count 18 and the j-residue 7 are part of the same
    pre-registered package. No trapdoor and no ECDLP algorithm are claimed.

    This session opened ledger/questions/RQ-ECTD-001.yaml and the frontier
    rows KR-RHO-755e35, KR-RHO-13bf67, KR-RHO-53c89f, KR-RHO-0528e7, and
    KR-RHO-fbd7b1. It read IDEA-20261005-e7ad98 from
    origin/design/pair-3a18d1-hcp and did not copy that file. The
    Silverman sentence on CM j-invariants stays provenance recalled. It
    is not evidence for this approval. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, the two enumeration seeds, replication, budget,
    stopping rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. No field required
    for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A conductor other than 3, or torsion bit 1, is a negative.
    - The nonsingular check, the two enumeration orders, the twist label, the extractor fixtures, and the j-denominator give the measurement a way to come back invalid rather than as a false conductor.
    - Success is only the first assignment row, so success can fail.
    - No point enumeration was archived as a run while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: one curve at p = 13. No transfer to a cryptographic prime.
    - The conductor is public isogeny-class data. This decision does not claim a trapdoor or an ECDLP algorithm.
    - A failed control does not falsify the curve prediction. It rejects the instrument.
    - This decision authorizes a later run. It does not start one.
    - The recalled Silverman sentence is not support.
    - RQ-ECTD-001 still withholds a trapdoor experiment until the Teske primary source is filed. This decision does not file that source.

