  target_result_profile_check:
    required: false
    reason: Opening of a zero-run design; no claim, approval or transition. Answered briefly for the record.
    answers:
      exponent_bias: >-
        Part C is the only route on this line that can bear on an exponent:
        growth of kappa_rel with N, which would move the exponent by
        delta/2. A constant kappa_rel cannot. The design is therefore ranked
        above Part B, a constant-level replication.
      heuristics_explicit_numbered: the draft names each numbered heuristic of H-PFDR-2765d2 the ladder validates, with its falsification condition (DS-12)
      validation_scale_and_transfer: toy for C-1; C-2 tier set by the mechanical rule; no transfer or extrapolation (DS-13)
      affected_vs_safe_scope: none claimed

