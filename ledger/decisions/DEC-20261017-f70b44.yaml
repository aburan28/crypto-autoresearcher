  rulings:
    - id: OD-1
      title: the design task is opened
      text: >-
        TASK-20261017-51d87d is opened as NA-3 directs. It is a zero-run
        design of the C-1 ladder (at least four rungs inside p < 2^32 for
        TT3, SS3 and SS5) with a pre-registered growth test and a
        planted-growth control, and the C-2 pilot preconditions. It carries,
        as binding constraints:
        - RCT-1, RCT-2 and RCT-3 (DS-5 to DS-7);
        - the DEF-2 finalize fix (DS-8);
        - the launch-prompt rule (DS-9).
        This act adopts as binding on the draft these further lessons of the
        round (DS-10, DS-11):
        - one attestation per report directory, so that the directory-mode
          checker passes;
        - checkpointing of long executor and reviewer computations, with
          adopted values written before any supplementary work;
        - field-level completeness of required artifacts in the validity
          checklist (this Coordinator's own omission of F-2,
          DEC-20261010-b662c7 R-4);
        - an engine-identity check against the Part A build, because main
          has moved;
        - runnable-gate readiness: the packet paths and execution route are
          named, and the goal-lane gap is recorded as an approval-time
          blocker.
        The draft is approved, frozen or dispatched for execution only by a
        later decision, after its snapshot archive verifies.
    - id: OD-2
      title: 'custody after the squash merge of PR #2008 (CF-1 of TASK-20261017-51d87d)'
      text: >-
        FACTS (the top-level session's mechanical checks):
        - PR #2008 was merged by the repository owner on 2026-10-11 as squash
          commit 0b0d513b6a (single parent).
        - All 1531 paths the branch changed relative to its merge base have
          the same git blob at fdbe201359 and at 0b0d513b6a. The one
          exception is tools/run_supersession_registry.yaml, a shared file
          whose 12 EXP-PFDR-0b3699 entries are present at fdbe201359,
          0b0d513b6a and 86e5c77081.
        - The receipt commits of this line (fdbe201359 and earlier) are not
          ancestors of main. They stay reachable from fa230eae82 and the
          PR #2008 head ref.
        RULING:
        - The squash departs from AGENTS.md "main takes merge commits only".
          It is the defect class of CORR-20260802-a1f151 defect_2.
        - Under "Archive receipts bind to content first", no receipt on this
          line is invalidated, and no record changes. No repair or correction
          record is made by this act.
        - Later cards on this line MUST cite 0b0d513b6a beside any receipt
          commit at or before fdbe201359 that they name as the commit holding
          an archived file. Custody is checked by content (path sha256 on the
          current tree against the receipt's path_sha256). Ancestry is
          recorded as advisory.
        - Receipt re-verification still runs against the receipt commit. If
          its objects become unavailable, the content check on main binds,
          and the loss is a custody finding, never a result.
        - tools/run_supersession_registry.yaml is read by entry and never
          bound by whole-file hash.
        - Every later PR from this branch is merged with a merge commit.
        TASK-20261017-0576ba rows PC-11 to PC-14 check the content binding
        for the c026a9 records, and its ORDER (5) records ancestry.
    - id: OD-3
      title: id bindings
      text: >-
        TASK-20261010-893a99, the spare that DEC-20261010-b662c7 left
        reserved_unused, is bound as archived_by of TASK-20261017-51d87d:
        the snapshot archive of the draft. A dispatch precondition requires
        the draft to have exactly one archival owner before launch. Its card
        is written when the design returns, on the pattern of
        TASK-20261002-1dc2ba.
        EXP-PFDR-969aae is pre-named on the design card. The draft then
        states exact prospective paths and run ids, which the runnable gate
        needs. The id names no record until an approval freezes a
        specification. If the design is declined, the approval act records
        the id reserved_unused. A second experiment, if the design splits
        C-2 off, gets an id minted at approval.
        AMD-20261008-1d902d stays reserved and unused.
    - id: OD-4
      title: what does not change
      text: >-
        The standing restriction of DEC-20261002-c3f49b NA-5 (as continued in
        DEC-20261002-e7f8c9 na5_lift.continues_for) is unchanged. The design
        may request a lift for the C-2 engine change EC-C1, and only a later
        decision can grant it. Part B stays conditional (DEC-20261010-b662c7
        NA-4). The KN-TECH candidates (DEC-20261010-b662c7 NA-5) are
        unchanged. The lifecycle ceiling of H-PFDR-2765d2 stays "analyzed",
        and its status field stays "specified" (HU-1, held). No experiment,
        evidence, hypothesis or goal status changes.

