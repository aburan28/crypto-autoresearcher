    YIELD BOUND AT CRYPTO SCALE (recalculated):
    At p=2^256, m=7, N=2^256, C=2^{20.2}:
    yield error = O(C^{m-2} * sqrt(m!) / sqrt(N)) = O(2^{20.2*5} * 2^{6.3} / 2^{128})
    = O(2^{101+6.3-128}) = O(2^{-20.7}) ≈ 10^{-6} — still negligible!
    H-PSEUDO holds at crypto scale even with C ~ p^{0.079}.

    GOAL-ECDLP-001 stays active.

