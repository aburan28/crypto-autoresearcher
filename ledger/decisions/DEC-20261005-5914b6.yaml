coordinator_decision:
  id: DEC-20261005-5914b6
  context: >-
    Design tick on 2026-10-05. origin/main was fetched at
    db353642facdf4ac9a5d94410d29b84c99a90315. The signed-sum
    fibres on the symmetric base and the ordered base already
    have contracts. IDEA-20261005-3a18d1 is the next uncited
    open ECC proposal that names a curve. It asks for the cost
    and failure locus of the class-polynomial constructor.
    The arithmetic statements declined by DEC-20261005-138b51
    stay declined.
  decision: approve
  target_ids:
    - IDEA-20261005-3a18d1
    - H-PAIR-6236da
    - EXP-PAIR-ef9af7
  rationale:
    - >-
      PAIR is an ECC area. The contract point-counts both
      twists of the curves cut out by named class polynomials.
    - >-
      A design-session count, not a run, gave twist traces
      {t, -t} on all 24 split cells and zero norm-equation hits
      on 12 inert cells that each still have one root.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      The height regression and the larger prime bins stay
      outside this contract. They are named, not dropped silently.
  evidence_refs: []
  limitations:
    - The largest prime is 1811 and the largest class number is 5.
    - Twenty-four matches do not certify any unnamed discriminant.
    - Approval authorizes five deterministic runs. It does not assert the traces.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-a12f5b until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
