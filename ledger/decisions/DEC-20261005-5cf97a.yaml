      It does not establish that P1-P3 satisfy those conditions.
    - >-
      J2 holds as a reduction-direction audit. An EndRing solver that recovers
      a secret or decrypts gives an attack upper bound; it is not a semantic-
      security reduction. EndRing-based security wording requires an
      adversary-to-EndRing reduction or a separately named and reduced
      intermediate assumption.
    - >-
      J3 breaks for the exact P1-P3 definitions. P1 and P2 have public sender
      syntax but only true-preimage inclusion, not a proof that every
      compatible coefficient has the same message residue. P3 is a constant-
      observation collision and always decodes to bottom. This is not a
      universal P1/P2 collision or an impossibility result.
    - >-
      J4 breaks for the exact packet. P1 and P2 offer only public exponential
      enumeration, P3 offers public nondecoding validation, and no polynomial
      End(E)-only recipient SecretLift or adversary-to-EndRing reduction is
      supplied. A successor must distinguish P1 Complete_2 from P2
      EndpointLift and must freeze the L-dependent KeyGen distribution so the
      admitted short-walk public-recovery boundary can be analyzed.
    - >-
      J5 holds narrowly for the named primary-source comparisons and exact
      P1-P3 scope. It is not a complete literature search or a novelty,
      security, equivalence, practicality, or deployment conclusion.
    - >-
      J3 and J4 break every submitted definition, so implementation design is
      ineligible. Standing user authority supports one further zero-run
      mathematical design obligation without a new approval cycle, but not a
      successor launch within this archive task.
