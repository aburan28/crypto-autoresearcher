coordinator_decision:
  id: DEC-20260921-4516a0
  context: >-
    Evidence round TASK-20260921-915847 on RUN-ECDLP-8e13c2 (EXP-ECDLP-fac9ea
    v3, executed under TASK-20260921-4888d4, PR #1339 merged), reviewing the
    lambda-registry census of H-ECDLP-4e1880 (from IDEA-20260921-6a29df,
    filed and approved today). The review plan with the pre-committed prior
    was committed before the analysis; this round is a declared SELF-REVIEW
    under the role-runtime outage (AWS DescribeInstances AuthFailure at
    bootstrap for every role agent attempted today, recorded in
    DEC-20260921-4d1b40), with independence not claimed and the independent
    adversarial review owed. Analysis at
    experiments/EXP-ECDLP-fac9ea/analysis.md; evidence EV-ECDLP-81f4d4.

  decision: weaken

  decided_by: coordinator

  target_ids:
    - H-ECDLP-4e1880
    - EXP-ECDLP-fac9ea
    - EV-ECDLP-81f4d4
    - IDEA-20260921-6a29df

  rationale:
    - >-
      VALIDITY FIRST, PASSED: run count 1 of 1 frozen; every required
      artifact present; raw/summary agreement re-verified (fits recomputed
      from registry.json); all frozen controls pass; checker ALL PASSED
      with three independent verification routes; no tail-prime
      resource_exhaustion value enters any fit; no certificate failure.
    - >-
      The hypothesis's operational claim (lambda per statistic is exactly
      measurable and the gates decidable) HELD; its pre-registered
      predictions did not: 'interval/AP lambda <= 0.05' falsified (0.0806
      at the measured ladder), 'coset/QR lambda near 0' flatly falsified
      (0.50 -- the prior confused per-coefficient square-root cancellation
      with summed L1 level). Two of four pre-registered predictions
      falsified, one marginal (R03 0.4191 at the 0.42 band edge), one
      passed (random-sign 0.4996/0.5001). Weaken is the honest transition
      for the hypothesis record.
    - >-
      The durable, normalisation-invariant findings (PGL_2 stability
      split; cosets at the Gauss-flat random-set level, R08 derived
      exactly; R07 the only unresolved above-level candidate) weaken the
      lane's implicit prior that the frozen registry contains a usable
      bias-rich natural key, and they nuance IDEA-20260920-dd041a's
      'exactly one corpus inhabitant' statement: the digit family
      reproduces marginally but is representation-unstable, and the
      above-1/4 cosets sit at the random level where no bias structure
      exists to key on.
    - >-
      CONSERVATISM UNDER SELF-REVIEW: the scoped negative is
      single-census (deterministic and checker-verified, but not
      independently reviewed). Per the review rules, reject_scoped
      requires a checkable refutation artifact or replicated evidence
      beyond a self-reviewed single run; weaken with the obstruction block
      (EV-ECDLP-81f4d4) and the named replication path is the transition
      that does not overstate.
    - >-
      The refutation artifact on file is a derivation note (proof_status
      derivation_note): the Gauss-sum proof that R08's level is exactly
      1/2, re-derived blind from the quantity's definition (review plan
      blind_rederivation), which converts the central 'cosets at random
      level' reading from empirical-only to derived for R08 and anchors
      R06's within-2SE reading.
  evidence_refs:
    - EV-ECDLP-81f4d4
    - RUN-ECDLP-8e13c2
    - experiments/EXP-ECDLP-fac9ea/analysis.md
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/checker-report.json
    - IDEA-20260904-f68c7f
    - IDEA-20260920-b6ad24
    - IDEA-20260920-dd041a
    - knowledge/findings/KN-FIND-ffe1df.md
  limitations:
    - Self-review under the runtime outage; the independent adversarial
      review of this evidence is owed and queued behind the repair.
    - Toy/medium scale (p <= 16777259 ok cells); the 2^26-class tail point
      is checkpointed resource_exhaustion with values preserved.
    - Gate verdicts and the R03 reproduction are convention-bound to the
      executed normalisation; the concurrent in-place spec edit
      (4785243985) is unadjudicated.
    - R07's above-level reading rests on 4 primes.
  next_actions:
    - >-
      H-ECDLP-4e1880 status: proposed-then-approved -> analyzed ->
      WEAKENED, this decision cited; the hypothesis's surviving content
      (measurability, the invariant findings) stays on record with the
      falsified predictions.
    - >-
      OWED: independent adversarial review (review-adversarial tier) of
      EV-ECDLP-81f4d4 and this decision, queued behind the role-runtime
      repair; not a promotion gate only -- the census's durable findings
      should not carry a self-review as their only review.
    - >-
      R07 successor measurement: index-5 coset lambda on a dedicated prime
      set with p = 1 mod 5 (the frozen ladder wastes 6 of 10 points on
      unavailable cells); decides the only above-random stable candidate.
    - >-
      Normalisation adjudication: a Coordinator ruling (or review-tier
      adjudication) on which normalisation is canonical for the
      lambda-registry (executed amendments vs the concurrent in-place
      edit), recorded as a supersession; the in-place edit's bypass of the
      amendments path is flagged for the harness ledger.
    - >-
      Chunked-convolution protocol amendment to re-measure the 2^26-class
      tail point within the 8 GiB cap and complete the jackknife tail
      check.
    - >-
      The resource_check reading is handed to IDEA-20260921-ffd330 (coset
      factor base, high-degree KN-OPEN-020 class): the census measured
      multiplicative cosets as PGL_2-stable with O(1)-membership tests --
      exactly the ingredient its cover-lift mechanism posits.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Single self-reviewed census under the runtime outage: the durable
      findings (Gauss-flat coset level, PGL_2 stability split) are exactly
      what /curate-knowledge should carry, but promoting them before the
      owed independent adversarial review confirms them would overstate a
      self-review as established knowledge. Revisit promotion immediately
      after that review; the draft finding is already stated in
      EV-ECDLP-81f4d4's inference and analysis.md so nothing is lost to
      ideation meanwhile.
