  rationale:
    - >-
      The explicit user request authorizes a new persistent goal. The area is
      SSI because the mathematical foundation is the supersingular
      endomorphism-ring problem; tools/ecc_priority.py classifies the resulting
      goal as ECC, so campaign totals are null under the unlimited ECC budget
      rule while concurrency remains bounded at two.
    - >-
      PKE is distinct from GOAL-KEX-001: Encrypt uses a recipient public key
      without an interactive agreement protocol, and Decrypt uses the
      recipient secret. KEX, NIKE, AKE, KEM combiners, and signatures are
      explicitly excluded rather than treated as interchangeable public-key
      primitives.
    - >-
      Existing corpus pointers KN-LIT-6572, KN-LIT-6628, KN-LIT-827, and
      KN-LIT-1260 make immediate mechanism generation unsafe: without reading
      their primary specifications, a new-looking candidate could be a renamed
      Seta, SiGamal, key-updatable PKE, or LIT-SiGamal variant. Their summaries
      are pointers, not support for a novelty or security claim.
    - >-
      No batch or handoff is opened. The goal has no hypothesis, frozen
      protocol, review plan, or mechanism that could yet be ranked ahead of
      doing nothing. Its single next action is a zero-run Coordinator
      prior-art-and-definition intake; dispatch begins only after a later
      decision records a sufficiently specified, non-duplicative mechanism.
    - >-
      Completion is falsifiable: the goal requires complete PKE syntax,
      independently checked correctness, an explicit reduction chain or named
      assumption gap, matched non-duplication review, honest toy costing, and
      durable independent review. Survival of attacks and absence of a known
      break satisfy none of these criteria.
