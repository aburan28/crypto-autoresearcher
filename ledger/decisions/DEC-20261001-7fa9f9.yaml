coordinator_decision:
  id: DEC-20261001-7fa9f9
  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-RELN-001]
  archived_by: TASK-20261001-01188b
  prior_decisions:
    - DEC-20260929-74b866 (execution admission of EXP-RELN-c5a377 v4)
    - DEC-20261001-ba1026 (inference amendment for this review round)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: inconclusive
  decision_label: >-
    RECORD EV-RELN-3c9a24: RUN-RELN-a695fe is valid and its frozen verdict is
    inconclusive, reproduced independently. RULE that the verdict was forced by
    the protocol design and says nothing about enrichment either way. LEAVE
    H-RELN-4d092c at approved. DIRECT the successor: a short-cycle statistic
    measured against the rewire null across a budget sweep, by additive
    amendment or successor experiment. Do not re-run v4 unchanged.

  target_ids:
    - EV-RELN-3c9a24
    - H-RELN-4d092c
    - EXP-RELN-c5a377
    - RUN-RELN-a695fe
    - TASK-20261001-25c0f3
    - TASK-20261001-ece593
    - TASK-20261001-4aefce
    - TASK-20261001-01188b

  evidence_refs: [EV-RELN-3c9a24]

  review_composition:
    review_plan: coordination/goals/GOAL-RELN-001/batches/BATCH-229ce4/review_plan_RUN-RELN-a695fe.yaml
    plan_commit: 96421fe8df
    joints:
      J1: holds (VAL-20261001-25c0f3); proves-too-much control passes
      J2: holds; the frozen verdict follows, but it is protocol-forced (TASK-20261001-ece593)
      J3: holds on every reading-invariant fact (RD-20261001-4aefce; the Coordinator made the comparison, recorded in EV-RELN-3c9a24)
    coordinator_prior: >-
      Recorded in the plan before any result was seen: supercritical 0.15,
      certified subcritical 0.45, inconclusive 0.40; J1 expected to pass.
    prior_versus_outcome: >-
      Outcome inconclusive, which I gave 0.40, below certified-subcritical at
      0.45. The prior is not overturned, but what I underweighted is that the
      design made certified-subcritical unreachable at 16 bits (F-1) and
      supercritical unreachable at A1. The probability of inconclusive was
      closer to 1 than to 0.40 before any data, and I did not see that when
      writing the plan.

  rulings:
    - id: R-1
      topic: F-1 (VAL-20261001-25c0f3), certified-subcritical unreachable at 16 bits
      ruling: >-
        Accepted as a must-fix scope statement. EV-RELN-3c9a24 states that the
        subcritical branch was testable only at 20 and 24 bits. The verdict is
        unchanged because the rule also fails on measured structure at 20 and
        24 bits.
    - id: R-2
      topic: PD-1 (RD-20261001-4aefce), deterministic evaluation of the frozen-label stream
      ruling: >-
        Acceptable. The re-deriver hashed frozen labels to reproduce what the
        run should have drawn. It performed no scientific run, introduced no new
        randomness and wrote nothing under experiments/. The blinding concern in
        AMD-20260929-cc7226 was about the Coordinator pre-reading treatment
        values, which this does not touch. The card constraint "no frozen-label
        draws" is read as forbidding new protocol-labelled draws, not a
        deterministic recomputation of the run's own stream.
    - id: R-3
      topic: J1 validator saw sibling filenames through git status
      ruling: >-
        Not a sibling read. A git status listing printed filenames in
        TASK-20261001-4aefce after the validator's verdicts were written; no
        contents were opened. Disclosed in VAL-20261001-25c0f3.

  procedure_deviations:
    - id: PDV-1
      what: >-
        The review plan's J3 wording gave L as ceil(q^{1/5}) (= 9 at b16-s13).
        The protocol's C-2 defines L as the count of liftable x-classes below B
        (= 6 at b16-s13), which is what the run uses. That was my error in the
        plan. It matters because the L choice alone decides whether A2
        delta_proof can exceed 1/4 on that fixture (RD-20261001-4aefce U-9).
        The run's verdict is unaffected.
    - id: PDV-2
      what: >-
        The committed review plan has a YAML syntax error on line 68: an
        unquoted scalar beginning "|V|", which YAML reads as a block-scalar
        indicator. tools/check_review_independence.py therefore reports "no
        review_plan block". The plan is committed (96421fe8df) and is not
        edited.
      remedy: Quote every scalar beginning with "|" in future plans; validate a plan with check_review_independence.py --plan before dispatching reviewers.
    - id: PDV-3
      what: >-
        The three reviewers filed their attestations under report-specific keys
        (attestation.files_read or attestation.declared_sources, nested under
        the report's top-level key) rather than the canonical
        review_attestation block with sources_read. The mechanical checker
        cannot read them. The Coordinator checked the substance from those
        blocks instead. Every report declares independent_session true and no
        sibling reports read. The only sibling-directory paths cited are
        Coordinator-written snapshot receipts. The blind re-deriver's declared
        sources do not intersect its blind_from
        (experiments/EXP-RELN-c5a377/implementation/ and runs/). The reports are
        not rewritten.
      remedy: Future reviewer cards name the canonical review_attestation schema in their deliverables.
    - id: PDV-4
      what: >-
        The executor card TASK-20261001-f2f8ba was written into the dispatch
        queue after RUN-RELN-a695fe had completed. The run was launched by the
        driver under admission decision DEC-20260929-74b866 when C-7 cleared.
        The card records the run rather than having dispatched it.
    - id: PDV-5
      what: >-
        The reviewer cards' top-level artifact_paths were extended to cover each
        reviewer's scripts and outputs in its task directory, so the ledger
        archive commits them in scope. Handoff blocks were not edited.
    - id: PDV-6
      what: >-
        Reviewer sessions ran under inference amendment DEC-20261001-ba1026: the
        review-adversarial policy's xhigh effort cannot be verified under the
        Cursor runtime, and resolved model identifiers are unknown.

  transitions_not_made:
    - record: H-RELN-4d092c
      note: >-
        Stays approved. The run could not test its enrichment claim with a
        statistic the null does not determine, so neither weakened nor
        inconclusive-terminal is supported. Revisit when the successor named
        below reports.
    - record: EXP-RELN-c5a377
      note: >-
        Its status record is not edited in this archive (outside the declared
        write scope). The run is completed and reviewed; a later archive may
        move the experiment to analyzed.

  rationale: >-
    J1 and J3 hold, so the run's numbers are trustworthy. J2 shows the C-5
    verdict could hardly have come out any other way: A1 sits below the
    percolation threshold, and 16-bit graphs are too small for the subcritical
    certificate. The informative quantity is the red team's cycle-rank excess
    over the rewire null, 0.033 +- 0.028 against 0.25. On these fixtures it
    shows the graph is as random as its degree sequence, but cycle rank cannot
    reveal enrichment once the edge count is fixed. So the lane is not closed.
    The statistic was the wrong instrument, and the obstruction block records
    the measurement for reuse.

  next_actions:
    - id: NA-1
      action: >-
        Design an additive amendment (v5) or successor experiment. Keep the
        generator, B and B2. Measure a statistic that (|E|, |V|, c) does not
        determine: the count of cycles of length <= 4, or the Horton minimum
        cycle-basis length distribution. Compare it against matched-degree
        rewire replicates at budgets attempts = kappa (n_lp + 1)/yield for kappa
        in {0.25, 0.5, 1, 2}, spanning the percolation window.
      owner: coordinator (design-experiment)
    - id: NA-2
      action: >-
        In the same design, fix the L used by delta_proof explicitly. Restrict
        the subcritical certificate to sizes with |V| > 40. Inline the 18
        open-question rulings from implementation_report.yaml so the protocol is
        self-contained for blind re-derivation.
      owner: coordinator
    - id: NA-3
      action: Update GOAL-RELN-001's next_action to NA-1 in the next goal-head archive.
      owner: coordinator
    - id: not_recommended
      action: Re-running v4 unchanged at larger q. O-1 and O-2 predict inconclusive again for honest graphs, independent of enrichment.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Toy-tier, verdict inconclusive, nothing proven. The reusable content is
      the cycle-rank-versus-rewire obstruction measurement, already in
      EV-RELN-3c9a24's obstruction block where tools/obstruction_registry.py
      surfaces it. Revisit for a KN-FIND entry if the NA-1 successor
      reproduces the null match with a statistic not fixed by (|E|, |V|, c).
