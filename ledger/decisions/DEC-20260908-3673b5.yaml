    "context": "Post-review disposition of the immutable version1 h-torsion solver-transform protocol for IDEA-20260906-6b84ec under RQ-DREG-9f2106, after actual independent review TASK-20260908-56d4e0 and its published snapshot3f99ff0e1cb80cedcd2df072e728be541acc4924. The review returns revise on T2-T5, with T1 holding only for its declared definition/certificate scope.",
