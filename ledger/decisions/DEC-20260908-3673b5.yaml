    "rationale": [
      "R1 remains unresolved in version1. The literal source says “Same support and solution count with coefficients randomized; treat fields separately.” It does not specify realized F2 support or nontriviality. Fixed nonzero realized F2 support permits only the original coefficient vector; the separate pre-descent K12 support-matched control can change descended F2 supports and degree patterns. A source/field/count clarification changes the scientific interpretation and must be additive before approval.",
      "R2 requires a precise corruption discriminator. Removing an existing O-chart tag need not lose a signed decomposition after core projection and complete lift enumeration. Preserve the full tagged root domain and require its independent exact equality; do not rely solely on lost signed recovery as the control signature.",
      "R3 requires a literal primary SAT predicate and denominator. Original polynomial roots, individual chart roots, projected core tuples and recovered subgroup decompositions are distinct objects; the current field/phase/SAT-status slicing does not choose one precisely enough. Freeze the target predicate before data while preserving0.75/0.8 thresholds, ceil(N/2), all target slots and complete costs.",
      "R4 requires safe delivery of the exact container/manifest rules to the future blind reviewer. Its handoff references a specification that its own blind read exclusions prohibit. An answer-free administrative copy must be published within a separately authorized safe handoff or packet; read scope must not widen to the forbidden specification or answers.",
      "All four review conditions are retained. The independently reviewed polynomial/class/localization/W_D distinction for the infinity control is retained as a scoped protocol-definition resolution, not an executed control, formal proof or scientific result. T1 and the remaining passing definitions do not overcome the unresolved approval gate.",
      "Preserve all342 ordinary targets,360 charts,324 prime nulls, all18+18+18 Boolean control/interpretation slots,104 synthetic and96 group-edge controls, eight run units, three cold repetitions, E<=8 original-generator witness discovery and unrestricted fully charged later solving/checking. Do not discard a source arm or reclassify an unavailable control as a mathematical negative."
    ],
