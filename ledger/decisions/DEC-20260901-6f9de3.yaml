coordinator_decision:
  id: DEC-20260901-6f9de3

  context: >-
    BATCH-7b798d executed IDEA-20260901-582ea9 (shape-only reduced-
    Stage-1 design; PIN-T0 adopted by DEC-20260901-fb6f11). S0 passed
    (PASS-S0: Gate-0x field-exact vs sealed lineage, freeze re-verify
    clean, dead anchor 0 hits, ramp-zero hits=2^30/W=3 exact). S1 made
    the first interior hit-count measurements (k=16 re-seat 12 in band;
    k=1 = 12,681,109; k=2 = 149,371; k=8 = 13) and then fired
    SH-GATE-FAIL: branch 1's literal conjunct 'hit_overflow > 0 on any
    analysis-bearing receipt' fired at k=1/k=2 (HIT_LOG_CAP=256/thread
    truncation; overflow == hits − threads×256 exact). The validator
    (TASK-20260901-87a39b, PASS with one minor bookkeeping discrepancy)
    adjudicated the overflow as a preregistered-wording vs
    unanticipated-signal-magnitude collision: hits/W/excess are
    cap-independent counters, verified at source and by exact blind
    re-derivation. The red team (TASK-20260901-6b1a7f,
    stands-with-narrowing) barred any post-hoc rescue of the readings,
    confirmed the cascade is self-inconsistent (the same conjunct fires
    on the k=0 anchor), voided the power table at the realized regime
    (h(1) 5.1 orders above the GRADUAL threshold), and named the k=1
    schedule-vs-dilution confound. The coordinator prior recorded in
    DEC-20260901-fb6f11 was OVERTURNED on gate survival.

  decision: close_batch

  decision_scope: >-
    THIS DECISION CLOSES BATCH-7b798d, records SH-GATE-FAIL as its
    official ordered outcome, ratifies the preregistration §5 note for
    the k=0 anchor with disclosed scope, amends the branch-1 overflow
    conjunct PROSPECTIVELY for successor batches only, and sets the
    next_action ranking. It does NOT compose a shape verdict, does NOT
    validate this batch's k=1/k=2 readings as shape evidence, does NOT
    close or narrow the ramp-shape question beyond what EV-AES-f2da41
    states, and does NOT spend Stage 1a/1b of IDEA-20260901-363851.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-7b798d
    - IDEA-20260901-582ea9
    - DEC-20260901-fb6f11
    - EV-AES-f2da41
    - TASK-20260901-87a39b
    - TASK-20260901-6b1a7f

  outcome: >-
    Batch closed. Official ordered outcome: SH-GATE-FAIL, no shape
    verdict composed. Ratified content: S0 instrument validity and
    both anchors under the §5 note (ratified below); S1 re-seat band
    pass, determinism/digest/source-diff gates; per-point hit counts
    and Garwood CIs as rule-8 observations; cap-independence counter
    identities (validator-adjudicated). Barred content: any shape
    verdict, decay/survival sentence, dilution-only attribution at
    k=1, extinction from 13-vs-12, or closure of the ramp-shape
    question.

  ratifications:
    - id: RAT-1
      statement: >-
        The preregistration §5 note (k=0 ramp-zero anchor overflow is
        cap truncation by construction; counts are cap-independent) is
        RATIFIED for the k=0 anchor of this batch. It was authored
        pre-arm (mtime-verified by the validator) but was
        Coordinator-unauthorized at write time; PASS-S0 rested on it
        (red-team RT3-B). Ratification scope: the k=0 anchor only. It
        is NOT extended to the k=1/k=2 readings of this batch; any
        such extension must be prospective and is governed by AMEND-1.
    - id: AMEND-1
      statement: >-
        PROSPECTIVE amendment for successor batches under the frozen
        582ea9 instrument lineage: the branch-1 conjunct 'hit_overflow
        > 0 on any analysis-bearing receipt -> invalid_measurement' is
        rescoped to 'counter INCONSISTENCY on an analysis-bearing
        receipt -> invalid_measurement', where counter inconsistency
        means (a) overflow != hits − threads×HIT_LOG_CAP, or (b) any
        cap-independent counter (hits, W, ewhist_hit) disagrees with
        its internal identities, or (c) any analysis-bearing quantity
        is derived from the capped detail log rather than the
        counters. Pure cap truncation of the detail log with all
        counter identities intact is NOT a gate failure. This amendment
        applies to batches opened AFTER this decision; it does not
        re-adjudicate BATCH-7b798d, whose readings remain unvalidated
        as shape evidence (red-team RT3-A: no post-hoc rescue).

  rationale:
    - >-
      Rule 5: the gate fired per preregistered wording; it is not
      evidence about shape. The producer was right to halt verdict
      composition; the reviews were right to bar post-hoc rescue.
    - >-
      Rule 8: the first interior hit-count readings are recorded as
      observations (EV-AES-f2da41 OBS-3), including the unanticipated
      5-order excess at k=1 and the step-curve localization of the
      transition to k in (2,8).
    - >-
      Inventor protocol: the obstruction is measured (EV-AES-f2da41
      obstruction block: h(1)=12,681,109 vs priced lambda_80 ~ 8.0,
      with Garwood error bars) and re-read as a resource: k=4 and
      finer interior points become load-bearing transition locators,
      and the schedule-vs-dilution separation at k=1 becomes a newly
      informative cheap measurement.
    - >-
      Review architecture: the coordinator prior was recorded before
      the round (DEC-20260901-fb6f11 review_plan.prior) and is
      recorded here as overturned on gate survival; the break was a
      sparsity-conditioned integrity conjunct firing ~5 orders beyond
      the priced regime.

  next_action: >-
    RANK 1: A SUCCESSOR DESIGN PROPOSAL via idea-generator for the
    ramp-shape question under AMEND-1, incorporating the red-team
    repair requirements of TASK-20260901-6b1a7f: (R1) prospective
    branch-1 rescoping per AMEND-1 and re-run under it; (R3)
    determinism double on an overflow-positive receipt; (R4)
    schedule-separated control or joint-effect scoping at k=1 (the
    PIN-T0 confound); (R5) k=4 (and optionally finer points in (2,8))
    promoted to load-bearing transition locators; (R6) second seed at
    k=1; (R7) re-priced power table for the realized regime
    (h(1) ~ 1.3e7 at 2^30); (R8) paraphrase discipline from
    EV-AES-f2da41 OBS-7. The proposal must NOT spend this batch's
    readings as validated shape evidence. Inputs: EV-AES-f2da41,
    DEC-20260901-fb6f11, TASK-20260901-6b1a7f red_team_report.yaml,
    TASK-20260901-87a39b validation_report.yaml,
    IDEA-20260901-582ea9. RANK 2: IDEA-20260901-69912d (layer
    autopsy). RANK 3: IDEA-20260901-02f7c4 battery arms B1-B3.
    RANK 4: the 256-byte random-bijection control (EV-AES-b2910a
    confound 1). RANK 5: decay-specific design if needed
    (EV-AES-5478a0 confound). RANK 6: higher-exposure/pooled
