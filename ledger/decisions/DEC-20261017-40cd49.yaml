  context: >-
    The 63-bit prime fixture has three equal-realized-size 475-point bases
    and 21 independently replayed common-target systems over arities 2–8.
    The current msolve integration refuses p at or above 2^16 by default,
    documents incorrect results above that guard, and says its own limit is
    2^31. The selected p is 9223372021248595841. There is no validated
    63-bit polynomial/root backend or runnable full-width prime experiment.
    The ordinary-binary k11 full review remains in progress; its raw
    wall-censored controls are provisional observations only.
  ranking:
    - rank: 1
      work: Implement and unit-validate a 63-bit prime polynomial/root backend for the frozen 475-point inputs.
      reason: >-
        It is the smallest necessary interface gate for the already archived
        21-cell matched prime grid. Exact arithmetic and independently checked
        root-to-point certificate plumbing distinguishes a plausible backend
        from sparse input alone. The task is bounded to deterministic
        engineering controls, with no full-width index-calculus solver call
        or speed claim.
    - rank: 2
      work: Revise the ordinary-binary k11 solver formulation after its independent review.
      reason: >-
        The sealed planted calls reached their wall caps; review must first
        classify the instrument and certificates. A change now would use
        provisional observations to alter a frozen trial.
    - rank: 3
      work: Port target-blind projected-orbit bases to certified Koblitz n71/73 subgroups.
      reason: >-
        Fixtures and an open idea exist, but a full-width relation and
        certificate runner and a same-subgroup complete baseline are missing.
    - rank: 4
      work: Profile the existing N53 own-process query path.
      reason: >-
        This is a valid attribution task for its reviewed 45-bit prime
        subgroup, but its size does not cover the requested 50–63-bit
        subgroup range and it cannot itself establish an elite-base gain.
  implementation_impediment:
    problem: problems/full-width-ic-arity-grid-unmeasured.md
    blocked_work: >-
      An approved bounded 63-bit prime solver-to-certificate comparison of
      the coset, random and small-x bases at m=2..8, followed by complete
      relation/rank/linear-algebra/target accounting.
    observed_basis:
      - src/crypto_autoresearcher/index_calculus/msolve.py
      - research/icperf_prime_475_target_systems_20261017/systems.json.gz
      - research/icperf_prime_475_target_systems_20261017/sage_replay.json
    missing_implementation: >-
      An exact 63-bit GF(p) polynomial solver and complete finite-field root
      extractor with bounded process control, raw output retention and an
      independent root-to-signed-point certificate checker. Raising the
      existing msolve guard is not a correctness repair.
    exit_check: >-
      TASK-20261017-6b60b8 produces the exact source, independent vectors,
      deterministic tests and raw validation record named in its handoff;
      arithmetic, synthetic 63-bit root and altered-root controls, and a
      small-cell complete regression pass, or failures are recorded without
      declaring readiness. A later approved experiment must first gate on
      planted m=2 positives before the 21-system natural target panel.
    inference_limit: >-
      A validated backend would establish an execution interface, not
      relation yield, observed degree of regularity, useful rank, complete
      end-to-end cost or improvement over a matched baseline.
