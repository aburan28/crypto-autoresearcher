coordinator_decision:
  id: DEC-20260802-a51c82
  decided_at: '2026-08-02'
  decided_by: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-003
  decision: support
  decision_note: >-
    support in the template vocabulary. What is supported is the m=3 derivation
    and its scoped readings, at claim tier toy. NOTHING IS CLOSED - see
    rule_12_status below.
  target_ids: [RQ-MONO-001, EXP-MONO-4b50b6, EV-MONO-a0a89c]
  evidence_refs: [EV-MONO-a0a89c, EV-MONO-002]
  corrections: [CORR-20260802-1d8384]

  rationale:
    - id: D-1
      text: >-
        ADMIT THE RUN PACKAGE. Both independent reviews admit it -
        ADMIT_WITH_QUALIFICATIONS (validator) and ADMIT_WITH_CORRECTION (red
        team) - and both re-derived the mathematics rather than accepting it. No
        number RUN-MONO-4b50b6-001 reported is false. The eleven defects both
        reviews found are labelling, provenance, control power, propagation and
        one latent logic inversion, all recorded in CORR-20260802-1d8384 by
        supersession, and the checks RUN-001 asserted without performing are now
        performed with archived commands in RUN-MONO-4b50b6-002.
    - id: D-2
      text: >-
        THE EVIDENCE IS THE DERIVATION, NOT THE OUTCOME_ID. The emitted
        FULL_MONODROMY_BARRIER_TOY required a 52-143 sigma excursion to have gone
        the other way, so the census could not have failed. Its content is
        instrument integrity. This is recorded so no downstream reader treats a
        foregone gate table as a measurement.
    - id: D-3
      text: >-
        THE m=3 SLICE OF KN-OPEN-009 IS ANSWERED, AND IT IS THE DEGENERATE SLICE.
        Geometric monodromy is S_2 for every non-singular curve; no exceptional
        locus exists; the density deviates from 1/2 by under 4/p. But deg_T S_3 =
        2 and a transitive degree-2 group is primitive, so the imprimitivity and
        block-system mechanism KN-OPEN-009 actually hunts CANNOT EXIST AT m=3 FOR
        DEGREE REASONS. Recording the answer without recording that the question
        was degenerate there would inflate it by omission.
    - id: D-4
      text: >-
        THE MOST CONSEQUENTIAL FINDING IS THE ONE THE RED TEAM SUPPLIED, AND IT IS
        AN UNDERCLAIM CORRECTION, NOT AN OVERCLAIM ONE. On the factor-base locus
        the summation fibre splits completely AT EVERY m, by the group law, not
        just at m=3. So a generic-fibre Frobenius census measures a quantity that
        is identically trivial where index-calculus relation search operates. That
        bears directly on whether GOAL-MONO-001 should spend batches on an m >= 4
        census, and it is forward guidance the batch owes under
        docs/inventor-protocol.md section 4.

  the_icex_feed_supersession:
    status: BLOCKING_DEFECT_RESOLVED_HERE
    raised_by: TASK-20260802-1b4130 objection O-10, flagged also by validator V-19
    superseded_artifact: >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-705/monodromy_protocol.yaml
      field icex_feed.outcome_packages[FULL_MONODROMY_BARRIER_TOY].relation_rate_input
    superseded_text: >-
      "Use quasirandom m=3 relation-rate proxy chebotarev_S2_split * (W_eff/p)^2
      with additive protocol-pinned envelope +/- 3*(2/sqrt(p)) on the split factor."
    why_superseded: >-
      THE RUN THAT EMITTED THE OUTCOME_ID ACTIVATING THIS PACKAGE IS THE RUN THAT
      REFUTES ITS PRESCRIBED INPUT. The split factor is not chebotarev_S2_split on
      the locus where relations are sought; it is 1. The protocol is immutable, so
      the only available fix is a superseding record the consuming driver is forced
      to see.
    replacement_relation_rate_input: >-
      On the factor-base locus the m=3 summation fibre splits with probability
      EXACTLY 1, not freq_split. The joint proxy over ordered pairs from a window
      of W_eff distinct x-coordinates is (W_eff^2 - W_eff)/p^2, and the correction
      factor against the quasirandom product form is
      (1 - 1/W_eff)/freq_split -> 2*(1 - 1/W_eff). HAND ICEX THE FORMULA, NOT A
      NUMBER: the value 1.5 measured here is the W_eff = 4 case and the limit is 2.
    scope_that_must_travel_with_it:
      - >-
        The factor is CONSTANT at fixed m and fixed W_eff, so it moves no exponent
        in this program's m=3 setting.
      - >-
        IT IS NOT UNCONDITIONALLY CONSTANT. Applied once per summation fibre in a
        Gaudry/Diem-style decomposition over F_{q^n} with n growing, a per-fibre
        factor of 2 compounds as 2^{n-1} = q^{Theta(1)} and DOES move an exponent.
        Any ICEX statement quoting "moves no exponent" must carry this scope.
      - >-
        The complete-splitting statement holds at every m (EV-MONO-a0a89c OBS-5),
        so this is not an m=3 patch - it is a general correction to any
        relation-rate model that applies an independent Chebotarev split factor.
    attack_content_label_also_corrected: >-
      The frozen package labels attack_content
      closed_at_toy_scope_for_exceptional_rate_sieves. That is simultaneously too
      weak and too strong. TOO WEAK: at m=3 the closure is unconditional and
      prime-independent, not toy-scoped, because it follows from the identity.
      TOO STRONG: the census showed nothing, so no closure derives from it.
      Corrected reading - the m=3 exceptional-rate content is closed BY DERIVATION,
      at every prime; nothing about m >= 4 is closed by anything here.
    binding: >-
      GOAL-ICEX-001.next_action is amended in this same ledger archive to name this
      decision, so a driver resuming that goal cannot consume the superseded input
      without seeing the replacement.

  rule_12_status:
    finding: AGENTS.md rule 12 IS NOT SATISFIED, and no closure is recorded.
    detail: >-
      Rule 12 requires that any claim proposed as a breakthrough, CLOSURE RESULT,
      or contradiction of established evidence receive independent
      review-breakthrough review at max effort, on a backend that can reach it.
      Both reviews in this batch requested review-adversarial and resolved to
      claude-opus-5 - not in either task's authorized_fallback_models, and THE SAME
      RESOLVED MODEL THE PRODUCER RECORDED. The batch therefore has session
      independence and no model independence.
    consequence: >-
      The wording is downgraded rather than the review being fabricated. Nothing in
      this batch says "settles" or "closes" KN-OPEN-009. What is recorded is an
      elementary derivation, at claim tier toy, that answers the m=3 case - and the
      note that m=3 is the degenerate case. NO RULE-12 REVIEW IS RECORDED, BECAUSE
      NONE WAS OBTAINED.
    what_would_change_it: >-
      Three genuinely distinct backends are needed, which this harness cannot
      resolve (CLAUDE.md model policy note). Until then the m=3 result travels as
      a derivation with two same-model reviews, and the corpus says so.

  limitations:
    - Toy primes 211-1601 only. No extrapolation to 256-bit ECDLP.
    - >-
      OBS-1/2/3/6 are m=3 only; KN-OPEN-009's imprimitivity question remains fully
      open at m >= 4 and is DEGENERATE, not answered, at m=3.
    - >-
      Two of the eleven controls must be read as "not evaluated": they pass for an
      empty window at every pinned prime.
    - >-
      The per-curve sampled census is underpowered for the O(1/p) effect; only the
      pooled null-object comparison (2.4M draws, ratio of ratios 2.0962) carries
      the empirical arm.
    - >-
      "Moves no exponent" is true at fixed m and must never be quoted without that
      scope.
    - No hypothesis status changes. Nothing is admissible toward the rule 13 quorum.

  knowledge_promotion:
    promoted: [KN-FIND-c41ea9]
    not_warranted: null
    rationale: >-
      A durable, checkable, reusable result exists and it is not about this
      program's plumbing: the m=3 Semaev cover's cycle type is a quadratic
      character product, with an exact density law and a complete-splitting
      statement on the factor-base locus that holds at every m. It is promoted
      with its novelty stated honestly as an elementary consequence of the
      addition law, with the m=3 degeneracy stated, and with the general-m
      instrument-relevance caveat that is its most useful content.
    deliberately_not_promoted: >-
      No KN-OPEN-009 supersession. The entry asks about the m-th cover; only the
      m=3 slice is answered and it is the degenerate slice. Superseding it would
      record m=3 as evidence about m >= 4, which EV-MONO-a0a89c explicitly forbids.

  next_actions:
    - id: N-1
      text: >-
        EXACTLY ONE NEXT ACTION FOR GOAL-MONO-001, and it is a re-scoping question
        rather than a measurement: decide whether an m >= 4 census is worth its
        budget GIVEN OBS-5. The census instrument measures the generic-fibre
        cycle type; relation search lives on the factor-base sublocus where that
        type is identically trivial at every m. Either identify a statistic that
        discriminates ON that sublocus, or record a scoped no-go for the
        relation-rate half of KN-OPEN-009 and leave only the imprimitivity half -
        which at m >= 4 has deg_T = 2^{m-2} >= 4 and IS non-degenerate. DO NOT
        commission an m >= 4 census before that question is answered.
    - id: N-2
      text: >-
        The campaign budget is exhausted: maximum_batches is 3 and BATCH-003 is
        the third. GOAL-MONO-001 moves to paused, not completed - no completion
        criterion is met, since criterion (a) required a census deciding
        full-versus-exceptional and the census was shown non-discriminating, and
        the derivation that did answer m=3 is not the committed decision the
        criterion asks for at m >= 4. Resuming requires a fresh budget grant.
    - id: N-3
      text: >-
        The successor harness must carry the five repairs in CORR-20260802-1d8384
        OI-1 before any further census: reverification-disposition rule, 2-torsion
        generator guard, relative tolerances on the two window controls,
        FAMILY_RATE_ALERT, and a uniform (A,B) draw.

  admissible_toward_closure_quorum: false
  is_not_a_cryptanalytic_result: true
  changes_no_hypothesis_status: true
