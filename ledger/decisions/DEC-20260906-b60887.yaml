coordinator_decision:
  id: DEC-20260906-b60887
  recorded_at: '2026-09-06'
  goal_id: GOAL-QALG-001
  question_id: RQ-QALG-457b41
  context: >-
    DEC-20260814-1445a1 (decision: revise) held both
    ledger/handoffs/TASK-20260814-807901.yaml (EXP-MLKEM-12d9b8) and
    ledger/handoffs/TASK-20260814-a82a19.yaml (EXP-CSIDH-c65945) at DO NOT
    DISPATCH pending a versioned protocol_amendment for each, and stated
    explicitly: "each becomes dispatchable only after its own
    protocol_amendment is committed and a Coordinator decision records that
    the amendment resolves the named objection(s)." This session dispatched
    a coordinator subagent to draft both amendments against
    RT-20260814-41d4cc's full objection set (not only the two objections
    DEC-20260814-1445a1's own next_actions named explicitly, per that
    decision's own limitations note that CSIDH-OBJ-2/OBJ-3 remained to be
    addressed). This session then independently re-verified, by direct grep
    against the frozen specification.yaml files, that every
    old_text_superseded_verbatim quotation in both amendments is a
    byte-faithful excerpt of the actual frozen contract text (not a
    paraphrase), and cross-checked DEC-20260814-1445a1's next_actions and
    RT-20260814-41d4cc's objection list against the amendments' own citations
    before writing this decision.
  decision: revise
  decision_rationale_for_verb: >-
    Using `revise` (not `approve`) because this decision does not approve a
    new experiment or change any hypothesis status -- both H-MLKEM-36f511
    and H-CSIDH-3eaede remain `proposed`, unaffected by protocol-level
    repair. It records that a previously-held contract's revision (the
    protocol_amendment) discharges the hold that decision itself imposed,
    per the schema's `revise` verb and consistent with this program's other
    amendment-clearance decisions.
  target_ids:
    - EXP-MLKEM-12d9b8
    - EXP-CSIDH-c65945
    - H-MLKEM-36f511
    - H-CSIDH-3eaede
    - TASK-20260814-807901
    - TASK-20260814-a82a19
    - DEC-20260814-1445a1
  rationale:
    - >-
      MLKEM-OBJ-1 (moderate, the sole objection DEC-20260814-1445a1 required
      to be resolved for EXP-MLKEM-12d9b8) is RESOLVED by
      experiments/EXP-MLKEM-12d9b8/amendments/v1.yaml under
      DEC-20260814-1445a1's option (a-i): the amendment appends a
      disclosure addendum to preregistered_prediction.formula stating the
      independently-computed ~20-order-of-magnitude gap (Q ~ 3x10^35 at
      ML-KEM-512's Simon-minimal c=12 vs. combinatorial ceiling ~2x10^15 at
      the most generous ring-compatible bound B=q=3329, k_mlkem=4) verbatim,
      and replaces the unbounded "extreme-B check" tail-check instruction
      with an operative, named ceiling (B capped at ML-KEM's own modulus q,
      justified because coefficients beyond q induce no new distinct
      residue class) that gives the check a decidable stopping rule. This
      session verified both `old_text_superseded_verbatim` quotations
      (preregistered_prediction.formula clause (iii); the "Extreme-B check"
      tail_checks item) against experiments/EXP-MLKEM-12d9b8/specification.yaml
      by direct grep and confirmed byte-exact matches. MLKEM-OBJ-2 (minor)
      and MLKEM-OBJ-3 (informational) required no action per the red-team's
      own findings and are correctly left untouched by the amendment.
    - >-
      CSIDH-OBJ-1 (major), CSIDH-OBJ-2 (moderate), and CSIDH-OBJ-3 (minor)
      -- all three objections RT-20260814-41d4cc raised against
      EXP-CSIDH-c65945 -- are RESOLVED by
      experiments/EXP-CSIDH-c65945/amendments/v1.yaml under
      DEC-20260814-1445a1's option (b-ii): the amendment adds three new
      symmetric BLOCKED/NOT-COMPUTED stopping-rule escape valves (Kuperberg
      2005, Regev 2004, Ettinger-Hoyer, the last also covering the more
      basic gap that no citation identifying which Ettinger-Hoyer
      publication exists in this program's knowledge base at all) alongside
      the existing CSI-FiSh valve, plus a composability rule requiring each
      triggered valve to be reported individually rather than collapsed;
      revises the budget note to disclose the literature-access risk
      explicitly and require an Executor preflight step (closing CSIDH-OBJ-1
      in full, both its escape-valve gap and its budget-note silence);
      pins the outcome-A/B "citable reduction" boundary toward the
      stricter reading (an explicit, page/section/lemma-citable statement
      located in one of the four audited primary sources' own text, with
      independently checked preconditions -- not the Executor's own
      background field knowledge) with a stated, checkable justification
      (closing CSIDH-OBJ-2); and renames "Cross-source agreement control"
      to "Cross-citation consistency control" with an added scope
      disclosure that it verifies citation-transcription consistency, not
      independent mathematical re-derivation, matching the contract's own
      already-careful body language (closing CSIDH-OBJ-3). This session
      verified all `old_text_superseded_verbatim` quotations (stopping_rules
      CSI-FiSh clause, budget.note, metrics.primary.applicability_outcome,
      controls[0], inputs.second_independent_citation) against
      experiments/EXP-CSIDH-c65945/specification.yaml by direct grep and
      confirmed byte-exact matches.
    - >-
      The amendment's own live_retrieval_tool_test finding is recorded here,
      not resolved: this Coordinator's own tool surface
      (.claude/agents/coordinator.md) has no WebSearch, WebFetch, or
      crypto-kb MCP tool, so whether an Executor session's retrieval tools
      actually work for the four CSIDH primary sources remains genuinely
      untested. This is precisely why CSIDH-CHG-1's escape valves are
      unconditional (triggered by inaccessibility regardless of cause) --
      the contract is now decidable whichever way live retrieval behaves at
      dispatch time, which is what DEC-20260814-1445a1's option (b-ii)
      required, not a guarantee that retrieval will succeed.
    - >-
      Neither amendment flips execution_authorized in its own text (both
      state execution_authorized_by_this_amendment: false in their
      authority_boundary block) and neither edits specification.yaml. This
      decision is the separate Coordinator act DEC-20260814-1445a1 named as
      required before execution_authorized may be set true and the dispatch
      holds cleared; see ruling below.
  evidence_refs:
    - experiments/EXP-MLKEM-12d9b8/amendments/v1.yaml
    - experiments/EXP-CSIDH-c65945/amendments/v1.yaml
    - coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml
    - ledger/decisions/DEC-20260814-1445a1.yaml
  limitations:
    - >-
      This decision clears the PROTOCOL-LEVEL hold DEC-20260814-1445a1
      imposed; it does not independently re-verify the red team's own
      ~20-order-of-magnitude MLKEM arithmetic or the CSI-FiSh/Kuperberg/
      Regev/Ettinger-Hoyer corpus-staging survey beyond re-checking that the
      amendments' quoted figures match RT-20260814-41d4cc's own report
      text; a third session has not independently re-derived that
      arithmetic from scratch.
    - >-
      CSIDH-OBJ-2's operative test and CSIDH-CHG-1's escape valves are
      decision PROCEDURES for the Executor, not pre-judged results: this
      Coordinator has not read Simon 2026, Kuperberg 2005, Regev 2004, or
      Ettinger-Hoyer and asserts no view on which outcome (A or B) the
      actual text supports, nor on whether any of the four sources are
      reachable from an Executor session. Per CLAUDE.md's conditional-result
      pairing rule (also carried in DEC-20260814-1445a1's own rationale),
      any dispatch of EXP-CSIDH-c65945 remains paired with the
      heuristic-validation work H-CSIDH-3eaede's own heuristic_assumptions
      name (HEUR-CSIDH-3eaede-1 / H1, not tested by this experiment and
      awaiting a not-yet-designed toy-simulation experiment) -- unaffected
      by and not resolved by this decision.
    - >-
      This decision does not assert that EXP-MLKEM-12d9b8's realizability
      verdict or EXP-CSIDH-c65945's applicability verdict is known; both
      remain undetermined until run. What is resolved is that both
      contracts are now decidable and honestly disclosed regardless of
      which verdict the arithmetic/literature search produces.
  ruling:
    - >-
      EXECUTION_AUTHORIZED IS SET TRUE for EXP-MLKEM-12d9b8 under
      amendments/v1.yaml (resulting_version: 2) and for EXP-CSIDH-c65945
      under amendments/v1.yaml (resulting_version: 2). This is recorded
      here, in this ledger decision, per AGENTS.md rule 2 / docs/task-
      lifecycle.md's protocol_amendment discipline: the frozen
      specification.yaml files are NOT edited (their execution_authorized:
      false field stays exactly as originally frozen); this decision, read
      together with the cited amendment, is what an Executor or future
      Coordinator must check before dispatch, exactly as
      ledger/handoffs/TASK-20260814-807901.yaml's own constraint states
      ("execution_authorized in the frozen specification is false at
      filing time and must be independently confirmed true by the
      Coordinator record clearing the dispatch hold").
    - >-
      The DO NOT DISPATCH hold on ledger/handoffs/TASK-20260814-807901.yaml
      and ledger/handoffs/TASK-20260814-a82a19.yaml is CLEARED. Both
      handoffs are now dispatchable to the Executor, subject to their own
      unchanged constraints (budget, scope discipline, unverified-preprint
      carry-forward, and -- for CSIDH -- the conditional-result pairing
      note above).
    - >-
      This ruling does not narrow, widen, or pre-judge either contract's
      declared outcomes; the amendments add disclosure and decidability,
      not a predicted result.
  next_actions:
    - >-
      Dispatch ledger/handoffs/TASK-20260814-807901.yaml (EXP-MLKEM-12d9b8)
      and ledger/handoffs/TASK-20260814-a82a19.yaml (EXP-CSIDH-c65945) to
      the Executor, each citing amendments/v1.yaml and this decision as the
      dispatch authorization. A Coordinator snapshot archive of each run
      package, followed by independent review, is required before either
      result is treated as evidence, per this program's standard lifecycle.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol-amendment clearance decision, not a research
      result: neither hypothesis moves from `proposed`, no run has
      occurred, and no realizability or applicability verdict exists to
      promote.
  decided_by: coordinator
  decided_at: '2026-09-06'
  inference:
