  storage_resolution:
    mode: digest_only
    tracked: >-
      Every file of experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-9bb990/ except the 92 below (977 files, relayed; the card recomputes it from git ls-files).
    excluded: >-
      Every file under an instances/ directory of the run larger than 1 MiB (1048576 bytes): msolve .ms inputs and generator JSON of the eq. (4) control and chained cells. The package's
      excluded-large-instances.json states count 92 and total_bytes 1164460095 and lists each file's path, bytes and sha256 (this Coordinator read the file's header and its first entries only and did
      not sum the entries; the card does). artifact-digests.json lists the same files too (sha256 only), so the tracked set and the digest set differ by these paths plus post-digest files, which the card
      classifies.
    availability: >-
      The 92 files are HASH-LISTED BUT UNAVAILABLE in git. They may be present on the producer's host and absent from any other checkout. Independent reviewers and every later reader must treat them as
      unavailable here and must not assume a reviewer's checkout holds them.
    regeneration_route: >-
      Declared by the executor in the package, not verified by this decision: each file is regenerable from the generator code in experiments/EXP-SEMBIN-7e1371/code (boolsys.py and eq4sys.py hashed in the
      manifest code_sha256 as 55d0063a0bb6ad7faa96952d7aa5d04aaae123fe61e2712a81a725a1c7853bb6 and d066299e3f95fc3e8e487b35cfacadbfeb3ee92805b2b70eac5146a2d446fcc9) and the seed and cell parameters in the file name
      and in the result records, and every result record carries the system_sha256 of the bytes it ran on. A regenerated file must be byte-checked against the sha256 in excluded-large-instances.json; a regeneration
      with generator files whose sha256 differs from those manifest hashes is not a check of the listed file. Regeneration was NOT performed by this archive. It is joint W10 of the review plan.
    cost: >-
      Claims about the instances in the 92 files cannot be re-checked from git alone. The tracked package plus the hash list supports "these were the bytes that ran" (by system_sha256) and nothing stronger until a regeneration
      is byte-checked. This is a recorded limitation, not an impediment: it does not block review.

  validity_precheck:
    summary: >-
      The Coordinator's gate before interpretation. It admits the 9bb990 package to the record and to review as a subset of its own digest set. It does NOT admit any record of it to interpretation and does NOT ratify or reject the executor's label.
    executor_label: >-
      manifest.yaml run status and validity.status read completed_invalid, with the executor's reason in validity.reason, and task-report.md opens with a validity notice. Both are the executor's labels for the closure and single-level
