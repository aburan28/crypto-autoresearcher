  rationale:
    - >-
      WHY BIND RATHER THAN WAIT. The impediment's stated clearing condition is met in substance by the user's decision and the committed package; what remains is the content binding, which only a Coordinator archive supplies. Leaving
      the package committed but unbound would make it a published-but-unowned working-tree artifact, the failure the archive policy exists to prevent.
    - >-
      WHY DIGEST-ONLY IS ACCEPTABLE FOR REVIEW. The exclusion rule is mechanical (instances over 1 MiB), the list carries each file's size and sha256, each result record carries the system_sha256 of the bytes it ran on, and
      regeneration is declared. That supports "these were the bytes that ran" and is enough to review the instrument-validity claim, whose objects are the closure code, the eliminations and the 5ed13e window; it is not enough to
      re-check a claim about an excluded instance without regenerating it, which is why the limitation is carried as W10 and not hidden.
    - >-
      WHY NOT INTERPRET NOW. The two runs are complementary and are reviewed together (DEC-20261004-df2986). Interpreting either alone, or before the plan owns the joints, is the failure mode the review architecture exists to prevent.
    - >-
      TARGET-PROFILE HONESTY. The window is toy tier (specification scale_relevance). Nothing here transfers to n = 409 or 571.

