    - >-
      NA-4 (refine successor; idea-generator, then /design-experiment; approval at a later /coordinate under
      the capacity and runnable conditions). Mint a refined hypothesis that replaces the title claim with the
      measurable one: the growth exponent of Phi_i(n) = max over t != 0 and j of the normalised full-range
      Fourier mass of psi_t o a_i o s_tor, against n^(-1/2) (random model) and n^(-1/4) (Fourier-learning
      breakeven), for i = 1..4. Pair it with a successor contract. EXP-CZLIFT-1a3453 stays frozen as is. The
      contract must:
      (1) count only power-bearing records and publish per-record rho_min;
      (2) use a symmetry-matched null (permute within the half range or within +- classes, use mu_6 orbits on
          D = -3, never sample from the full range), and drop j = 0 from the spike count, testing digit-value
          uniformity separately;
      (3) compare real against control per curve-row and per (psi, chi) pair, with one frozen reading of the
          falsification rule;
      (4) report planted-leak power curves per record (50%-power tau and sparsity m);
      (5) achieve generator covariance through the full range (cosine transform for even x-digits) or several
          generators per record;
      (6) scale n to about 10^4-10^5 (still toy tier) so that Phi can be fitted against n;
      (7) state the random-model null as a numbered HEUR with its validation rows at the same scale;
      (8) include a Legendre (multiplicative-character) arm and a digit-0 nearby-object control whose Weil-type
          bound is known;
      (9) include at least two lifts per random curve.
      Positive next decision: a fitted exponent above -1/2 on any digit, beyond the null band, opens
      replication and a red team before anything else on this goal. Negative next decision: an exponent
      consistent with -1/2 on all digits at the tested n, recorded as a scoped boundary.
