    prior_vs_outcome: >-
      Prior confirmed on R1 and PTM-1 (scope and linear class). Prior extended on R2: the shuffled control is
      contaminated by the same non-DL structure as the signal, biased toward the hypothesis, and its recorded
      zero had probability about 0.47. The plan did not anticipate this. It changes the successor design
      (symmetry-matched null), not this decision's direction.
  rationale:
    - >-
      Validity first. Both planned trials ran. The manifests are schema-complete, seeds and hashes bind to the
      frozen contract, every metric was recomputed from raw rows, and an independent implementation replays
      all 72 records to 8e-14 (VAL-20261022-55676f). The uniform control is clean, so no invalidation rule
      fires. The run set is evidence. No certificate is owed, since no solve is claimed.
    - >-
      What the data show. The frozen success criterion is met on both seeds. On the 42 power-bearing records
      the instrument has demonstrated power: PTM-1 spikes on 42/42 and LSB is seen on 29/42. So the absence
      of any above-threshold pair excludes the single-pair class stated in scoped_claim, at a per-record floor
      that the evidence record publishes. This is a real but narrow result, replicated across two seeds with
      disjoint curve sets.
    - >-
      Why not support. (a) The hypothesis title and mechanism claim that no digit correlates with the discrete
      log, and the statistic cannot test this: digit 0 determines k up to sign and is white, and CHIRP, INV and
      LEGMSB pass the frozen rule on 72/72 (RT R1). (b) H, the specification and DEC-20261009-6aef7a count all
      72 records, but 30 of them are blind by the trivial bound (PTM-1). (c) The clause "exactly as for the
      same digits re-indexed by a random permutation" held with probability about 0.47 under a control biased
      toward the hypothesis (RT R2). (d) decision_impact.on_positive would close an H2 clause on evidence about
      50 bits of correlation from attack relevance. A support transition would launder a narrow instrument
      result into the title claim.
    - >-
      Why not weaken or reject_scoped. No observation contradicts H-CZLIFT-fba874's formal bound: every
      recorded maximum is below T, and the real spectra match uniform and symmetry-matched nulls within
      resolution. The red team's breaks are breaks in the inference and the controls, not in the hypothesis.
      There is no refutation artifact, and none is available, because nothing was refuted.
    - >-
      Why not inconclusive. For the single-character class the experiment does discriminate: a planted gross
      leak is detected on every power-bearing record. Stated plainly, it is inconclusive on the title claim and
      weakly supportive on the narrow class. refine records both by restating the claim at the instrument's
      scope.
    - >-
      Why not replicate. Rerunning the frozen v1 contract on new seeds would reproduce the same contaminated
      control, the same blind zone, the same floor and the same reading ambiguity. More seeds do not buy
      information. A corrected design does.
    - >-
      Exponent bias (docs/target-result-profile.md). The decision-changing quantity for this lane is not
      whether a gross leak exists at n <= 613. It is how max_j tau scales with n for digit predicates of s_tor:
      a random model predicts about n^(-1/2) up to logs, and Fourier learning with exact shift queries beats
      rho only above about n^(-1/4) up to polylog. That scaling exponent is what the successor must measure,
      and it is posed as KN-OPEN-d3a6f0.
