  scoped_claim: >-
    On the 42 power-bearing records of RUN-CZLIFT-037e5f and RUN-CZLIFT-d37ca4, no single-digit function
    a_i(x(s_tor([k]P))) or a_i(y(s_tor([k]P))), i = 0..4, has half-range normalised correlation
    tau >= rho_min(p,n) = sqrt((ln((p-1)n) + 12)/h), h = (n-1)/2, with any single pair (nontrivial additive
    character of F_p, character of Z/n). The records are 33 CM-canonical class-number-one integer models and
    9 random curves with one naive integer lift, 53 <= p <= 571, 47 <= n <= 613, one random generator per
    record and precision 5. rho_min is 0.28-0.98 (median 0.50), about 1.44x higher for generator-covariant
    even x-digit leaks at n < 109. No improvement meeting the predefined threshold was observed over these
    instances, parameters, solver and budget. The 30 records with n <= 41 carry no information. Nothing
    follows for nonlinear or pseudorandom encodings, multiplicative characters, weaker or sparser leaks,
    other models, lifts or generators, or larger n.
