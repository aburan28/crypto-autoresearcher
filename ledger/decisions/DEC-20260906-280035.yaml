coordinator_decision:
  id: DEC-20260906-280035
  context: >-
    Administrative disposition of the bounded definition audit EXP-PFDR-845d33
    after independent instrument-integrity review TASK-20260906-46c863. The
    approval predecessor was EXP-PFDR-f32e6c. The review reports an incomplete
    audit: one launch failed before fixture evaluation and three groups were
    not launched. All eight fixtures remain unmeasured.
  decision: revise
  target_ids: [EXP-PFDR-845d33, BATCH-ff2730]
  rationale: >-
    Archive integrity holds, but no mathematical certificates or evaluated
    controls exist. Preserve the operational failure and the unresolved native
    definition interface. Accept the report as an administrative account of an
    incomplete attempt; do not treat it as successful instrument validation,
    negative mathematical evidence, or authorization to repeat execution.
  evidence_refs:
    - source: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ff2730/validation-report.yaml
      provenance: internal
      sha256: fba0a5fbab0903a2f704e346d24fe746d0f78e59aa204ed083d5f0d81bef84d2
      access_note: Independent report findings and binding supplied by the parent coordinator; no independent re-execution by this decision's author.
    - source: experiments/EXP-PFDR-845d33/execution-report.yaml
      provenance: internal
      access_note: Producer record cited by the independent report; no new validation asserted here.
  limitations:
    - J1 holds for the reported 35-file snapshot 196a84f14 with parent 4eee1d943 and matching artifact hashes.
    - J2 and J3 are inconclusive because the native interface is unresolved and no mathematical certificates were produced.
    - J4 breaks because the RLIMIT_AS setup failed before capture and fixture evaluation; the control checker did not execute.
    - CPU and RSS metrics are null; no actual measurement is inferred from receipt metadata.
    - The reported 437.712962 seconds covers setup and reporting; the 0.127063208-second wrapper value is not an independently established process duration.
    - finished_at records receipt assembly and must not be interpreted as a measured fixture completion time.
    - Actual model provenance was not probe-verified; the independence checker pass does not establish model verification.
    - Additive certificate-none views discharge only the canonical ledger missing-certificate-kind errors.
    - JSON-schema compatibility remains unresolved for null resources and certificate fields; the review found no identifier error in that schema check.
    - All hypothesis and goal statuses remain unchanged; no mathematical closure, source bug, or disproof is claimed.
  next_actions:
    - Archive the independent report and this administrative disposition with exact commit, parent and artifact hashes.
    - Preserve all four original run manifests; register additive normalized views containing only the missing none-certificate declaration.
    - Before any future execution proposal, design a portable memory guard and failure-capture preflight that records launch failure before fixture work.
    - Resolve the native grading and zero-top-form interface explicitly against the source before authorizing mathematical computation.
    - Reconcile the canonical ledger and JSON-schema interfaces without altering historical receipt values.
    - Require a separately frozen and committed future contract and authorization before any rerun; neither later panel is approved here.
  knowledge_promotion:
    promoted: []
    not_warranted: No fixtures were evaluated and no mathematical certificates or executed controls exist.
  decided_by: coordinator
  decided_at: '2026-09-06'
  administrative_outcome:
    independent_review_verdict: incomplete
    evaluated_fixtures: 0
    unmeasured_fixtures: 8
    failed_launches: 1
    groups_not_launched: 3
    rerun_authorized: false
    survival_panel_authorized: false
    growth_ladder_authorized: false
  correction_boundary:
    original_manifests_immutable: true
    sole_added_field:
      run.result.certificate:
        kind: none
        verified: null
        verifier: null
    meaning: No certificate exists; this is a schema-presence correction, not evidence.
  publication_gate: Exact archive and ledger gates must pass; publication must retain the incomplete verdict and all disclosed limitations.
