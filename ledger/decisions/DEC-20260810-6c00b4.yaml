    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/reviews/TASK-20260810-1166f2/red-team-report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/reviews/TASK-20260810-9fc65d/validation-report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-f7bc82/snapshot-receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-1a81be/snapshot-receipt.json

  hypothesis_status_transition:
    hypothesis_id: null
    changed: false
    reason: >-
      GOAL-AES-002 has no active hypothesis and this decision creates none.
      Object-first ideation and infrastructure measurement are not
      hypothesis-testing acts.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      This decision closes BATCH-2b0fd1's evidence-review step, not
      GOAL-AES-002. `completed` remains unreachable for this goal under
      inference-amendment 0137a051 (GOAL-AES-002 completion_reachability); no
      completion_quorum block is created and no attestation is recorded. A
      scoped repair-and-carry-forward next action, not a goal-status change,
      is the correct disposition of a batch that produced protocol,
      screening, and measurement work with named, concrete repairs
      outstanding.

  batch_disposition: >-
    BATCH-2b0fd1's RANK 1-3 WORK IS COMPLETE, REVIEWED, AND ARCHIVED FOR THE
    RANKED SHAPE IT WAS OPENED TO EXECUTE. It is not re-opened and no further
    task is dispatched under its own dispatch_queue_path by this decision.
    The concrete repairs and the C2 carry-forward named in next_actions below
    belong to a FOLLOW-UP BATCH under GOAL-AES-002, scoped explicitly to (i)
    the CM-1 superseding amendment, (ii) the BLK-1 edit application, (iii)
    the F1 arithmetic repair, and (iv) C2's measurement — not a repeat of
    BATCH-2b0fd1's own RANK 1-3 acts.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal. CM-1 is an
      accounting instrument, not a claim; the object enumeration states no
      cost figure for any candidate (`sota_delta: "DEFINITIONAL-REFERENCE
      DELTA: 0 bits"`). This decision moves none of the four promotion gates
      and creates no claim that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO SUPPORT OR REJECT_SCOPED DECISION ON REPLICATED OR STRONG EVIDENCE
      IS AVAILABLE. This decision is `revise`, not `support` or
      `reject_scoped`, and EV-AES-abf3dc's own strength is `anecdotal`
      (single batch, unreplicated, over campaign-authored instruments): CM-1
      carries three outstanding specification defects and is explicitly not
      yet safe to rely on for a cost claim; C2, the sole surviving
      enumeration candidate, is a SCREENED, UNTESTED prediction with zero
      measurement behind it; the envelope receipt's one valid measurement
      (1-core pure-Python throughput) is a single-session figure, not an
      independently replicated one. None of this clears the replicated/
      strong bar KN-FIND promotion requires. A KN-OPEN entry for the object
      enumeration MAY be warranted under GOAL-AES-002 non_completion_criteria
      (i), but per TASK-20260810-9f661a's own binding constraint that is "a
      separate dispatched act with its own card" and is NOT created by this
      archive task.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It creates
      no hypothesis, promotes no knowledge, satisfies no asymptotic promotion
      gate, records no attestation, and supports no claim at any tier.
    - >-
      CM-1's THREE READING AMBIGUITIES (elements a; c/f jointly; d) AND ONE
      DISTINGUISHER-CLASS GAP (b/c) MEAN NO REAL COST CLAIM MAY BE FILED
      UNDER CM-1 AS CURRENTLY COMMITTED UNTIL A SUPERSEDING AMENDMENT CLOSES
      THEM. Any record that files one anyway is filing an unadjudicated
      number, per RQ-AES-002 R2's own closing sentence.
    - >-
      BLK-1 REMAINS OPEN. No `key_recovery` certificate can be emitted by a
      conforming run until protocol-amendment-GOAL-AES-002-001's specified
      edits are actually applied to tools/validate_ledger.py and
      docs/claims-and-verification.md, which has NOT happened as of this
      decision.
    - >-
      C2 IS AN UNTESTED, SCREENED CANDIDATE, NOT A RESULT. Its predicted
      null survival carries below-default confidence by its own author's
      disclosure and must not be transcribed as a finding, a negative
      result, or a barrier statement anywhere.
    - >-
      envelope-receipt.json's 14-core DECIMAL figure (F1) IS WRONG AND MUST
      NOT BE CITED for any budget or ceiling calculation until a repair
      record corrects it; only the log2 figures and the validated 1-core
      pure-Python throughput may be relied upon as committed.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE campaign-wide under
      inference-amendment 0137a051; the red-team and validator verdicts
      supply session independence only and are one draw from a correlated
      pair. No attestation is recorded on their combined strength.

  next_actions:
    - >-
      FILE A SUPERSEDING VERSIONED PROTOCOL AMENDMENT UNDER GOAL-AES-002,
      before any card that could produce a cryptanalytic solve or cost claim
      is dispatched, resolving: (1) element (a)'s materiality threshold or a
      third admissible conversion route for AddRoundKey-only auxiliary XORs;
      (2) the single clarifying sentence that resolves elements (c) and (f)
      jointly (whether a residual search's own AEU-k units bundle
      verification); (3) element (d)'s data kind/count domination-order
      rule; and (4) a stated bridge (or an explicit ruling that none exists)
      from a distinguisher's measured false-positive rate to a comparable
      AEU-k figure for elements (b)/(c).
    - >-
      APPLY protocol-amendment-GOAL-AES-002-001's SPECIFIED EDITS to
      tools/validate_ledger.py's `check_run` and to
      docs/claims-and-verification.md's certificate-kind vocabulary, as a
      separate declared act. BLK-1 remains a live pre-dispatch gate,
      independent of this decision, until that act lands and is verified.
    - >-
      REPAIR envelope-receipt.json's F1 arithmetic (the 14-core decimal
      field) via a follow-on task or a superseding correction record before
      that field is cited in any later budget or ceiling calculation. The
      validated log2 figures (24.077 / 26.077 / 27.884) and the 1-core
      pure-Python 11061.1924 evals/s/core KAT-verified figure need no repair
      and stand as committed.
    - >-
      RECORD F2 (TASK-20260810-1a81be's 542 s stamp-duty overrun) under the
      adopted C5 `on_record_not_charged` mechanism in the next batch-opening
      act touching this goal's budget accounting, rather than leaving
      `halted_on_budget: false` standing uncorrected next to a disclosed
      overrun.
    - >-
      CARRY CANDIDATE C2 FORWARD as the lead — and currently only — surviving
      candidate for a follow-up batch's RANK activity under GOAL-AES-002. Any
      future dispatch of C2 must PAIR it, in the same or the following batch,
      with the heuristic-validation measurement its own predicted-null claim
      requires: the round-by-round Hamming-distance histogram against a
      Binomial(128,1/2) null, a matched-null control (independent uniformly
      random round-key sequences), and the round-count decay check, per
      CLAUDE.md's conditional-result pairing rule. This decision does not
      itself approve or dispatch that measurement.
    - >-
      DISPATCH THE FOLLOW-UP BATCH scoped exactly to the five items above;
      it is not a re-run of BATCH-2b0fd1's own RANK 1-3 acts. This
      Coordinator decision preserves this as GOAL-AES-002's single next
      action, to be set on the goal-record checkpoint that follows this
      archive.

