coordinator_decision:
  id: DEC-20260810-6c00b4
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  recorded_by_task: TASK-20260810-9f661a

  context: >-
    BATCH-2b0fd1's ranked shape (RANK 1 — freeze CM-1, resolve BLK-1 by a
    versioned protocol amendment, record the amendment-005 Part B / amendment-
    004-005 adoption; RANK 2 — object-first ideation on full-round AES; RANK 3
    — a measured toolchain-and-throughput envelope receipt) has now been
    committed in full, snapshotted in two isolated Coordinator archives
    (TASK-20260810-f7bc82 for RANK 1, TASK-20260810-1a81be for RANK 2 + RANK
    3), independently red-teamed against CM-1 itself (TASK-20260810-1166f2)
    and independently validated as a whole package (TASK-20260810-9fc65d).
    Both independent reports return PASS_WITH_LIMITATIONS. This decision
    disposes of that package: it accepts what the reviews support, requires
    concrete repairs before certain figures may be relied upon, and sets the
    batch's next action. Evidence record EV-AES-abf3dc is committed alongside
    this decision in the same isolated ledger archive.

  decision_scope: >-
    DISPOSES OF BATCH-2b0fd1's RANK 1-3 WORK AND ITS TWO INDEPENDENT REVIEWS.
    NOTHING MORE. This decision creates no hypothesis, approves no
    cryptanalytic measurement, changes no hypothesis status, changes no
    GOAL-AES-002 status (the goal stays `active`), records no attestation and
    no completion_quorum block, and asserts nothing about AES at any round
    count. It does not touch GOAL-AES-001, GOAL-AES-003, or any record
    produced under RQ-AES-001 or RQ-AES-003.

  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-2b0fd1
    - EV-AES-abf3dc
    - TASK-20260810-4a478d
    - TASK-20260810-f7bc82
    - TASK-20260810-d8835b
    - TASK-20260810-2a0a37
    - TASK-20260810-1a81be
    - TASK-20260810-1166f2
    - TASK-20260810-9fc65d
    - TASK-20260810-9f661a
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml
    - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-001.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/adoption-amendment-005-partB.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-d8835b/object-enumeration.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-2a0a37/envelope-receipt.json

  decision: revise
  decision_note: >-
    `revise` targets CM-1 and the batch's downstream reliance on it, not the
    batch's other artifacts. The object enumeration and the (KAT-verified
    core of the) envelope receipt are ACCEPTED as committed, tier-compliant
    deliverables; CM-1 is ACCEPTED as a committed, frozen-on-commit artifact
    but is NOT YET SAFE to charge a real cryptanalytic cost claim against, and
    a superseding versioned protocol amendment is required before it is
    relied upon for one. No approve/support/reject_scoped/pause label in the
    template fits a mixed disposition this precisely; `revise` is the closest
    single word and the itemized rationale and next_actions below carry the
    actual content.

  rationale:
    - >-
      CM-1 IS COMMITTED, CONTENT-VERIFIED, AND NUMERICALLY CORRECT WHERE
      CHECKED, BUT NOT YET SAFE TO CHARGE A REAL COST CLAIM AGAINST. Both
      independent reviewers re-derived CM-1's S-box-application counts,
      AddRoundKey byte-XOR counts, and data-pair unicity figures from
      FIPS-197's structure directly (not from CM-1's own derivation text) and
      confirmed every one correct for all three key sizes, including the
      AES-256 double-SubWord clause CM-1 names as its own weakest line. The
      RED TEAM nonetheless located THREE genuine reading ambiguities under
      which two conforming parties applying CM-1's stated text to the
      IDENTICAL future attack compute DIFFERENT AEU-k costs for it: element
      (a)'s S-box-conversion route has no materiality boundary against the
      accompanying non-S-box work every real attack performs; elements (c)
      and (f) interact ambiguously at the partial-key-recovery / candidate-
      verification boundary, with the two readings diverging by close to a
      FACTOR OF 2 — precisely the size CM-1's own R2(b) ruling calls
      claim-relevant; and element (d)'s data coordinate never states how
      count and kind combine into the single order its domination rule
      needs. A fourth, lower-severity gap leaves distinguisher claims (kept
      explicitly in scope by RQ-AES-002 R7) with no stated bridge to an
      AEU-k figure at all. The independent validator independently
      re-confirmed all four findings as textually accurate. A cost figure
      computed under CM-1 as currently committed is therefore not yet an
      adjudicable number for at least the ordinary case of a real attack,
      and CM-1's own text names the remedy: "changed only by a superseding
      versioned protocol amendment under GOAL-AES-002... NEVER by an edit to
      this file after it is committed."
    - >-
      BLK-1 REMAINS OPEN IN SUBSTANCE, NOT MERELY IN NAME.
      protocol-amendment-GOAL-AES-002-001's mechanism argument and its exact
      specified `key_recovery` certificate vocabulary and `check_run` text
      change are both independently confirmed sound and backward-compatible
      by both reviewers — including a third normative site
      (tools/cairn_bridge.py) the amendment's own search missed but which
      both reviewers traced to a confirmed-BENIGN runtime effect. But both
      reviewers also independently confirmed, by reading the live files at
      HEAD, that the specified edits to tools/validate_ledger.py and
      docs/claims-and-verification.md have NOT been applied. No conforming
      run can currently emit a `key_recovery` certificate, and RQ-AES-002's
      hard rule stands: no card that could produce a solve is dispatched
      until BLK-1 is actually resolved by the edit landing, not merely
      specified.
    - >-
      RANK 2 PRODUCED EXACTLY ONE SURVIVING CANDIDATE, C2, WORTH CARRYING
      FORWARD AS AN UNTESTED LEAD. Seven candidates were screened at zero
      compute, fully tier-compliant per both reviewers (correct
      `dominated_by` string on every deliverable, no margin, no
      distinguisher claim, no barrier statement, no universal-impossibility
      claim, status `unverified` throughout, lossy-projection applied before
      any compute). Four (C1, C3, C5, C6) deduplicate to REDISCOVERIES of a
      named established family; C7 FAILS the lossy-projection test on a
      correct algebraic argument independently checked by both reviewers;
      C4 passes lossy-projection and deduplication but fails testability. C2
      — a paired-independent-key data-path Hamming-distance histogram,
      tracked round-by-round at the full round count, with NO assumed
      algebraic relation between the two keys — is the ONLY candidate to pass
      every screen (lossy-projection PASSES, deduplication
      `not_a_rediscovery`, testability `high`). Its `survival` score is
      `predicted_null_but_untested`, at BELOW default confidence by its own
      author's disclosure, because this campaign's own prior key-schedule
      measurement found a structurally adjacent diffusion assumption WRONG.
      C2 is therefore a screened, named, UNTESTED candidate — worth a
      follow-up batch's compute, not a finding of any kind about AES, and not
      approved for dispatch by this decision.
    - >-
      RANK 3's VALIDATED MEASUREMENT STANDS; ITS ONE ARITHMETIC DEFECT DOES
      NOT. The 1-core pure-Python throughput figure (11061.1924 evals/s/core,
      fresh-key, KAT-verified 4/4 against the openssl CLI) and its log2
      derivations were independently recomputed by both reviewers directly
      from the receipt's own preserved raw elapsed-time data and MATCHED
      exactly; the AES-NI and ARM64-crypto accelerated paths both correctly
      FAILED their own KAT check and were correctly excluded from budgeting
      throughout, never silently used. The receipt's 14-core DECIMAL ceiling
      figure (finding F1, validator, MEDIUM severity) is arithmetically wrong
      by a factor of approximately 1972 against its own correctly-stated
      log2 value and must not be cited for any later budget or ceiling
      calculation until repaired; the log2 figures themselves need no
      repair.
    - >-
      FINDING F2 IS AN HONEST INFRASTRUCTURE DISCLOSURE ABOUT THIS BATCH'S
      OWN ARCHIVE ACT, NOT ABOUT AES, AND IS RECORDED RATHER THAN HIDDEN.
      TASK-20260810-1a81be's own committed C2 stamps show it continuing 280 s
      and then 542 s past its self-declared binding_stop_utc without halting
      or naming the overrun. Per AGENTS.md rule 5 this is INFRASTRUCTURE
      SIGNAL, never a negative mathematical result, and per both reviewers'
      independent archive checks the CONTENT that task committed (hashes,
      parent, changed-path set, record_ids) verifies cleanly regardless. It
      is reconciled here under the adopted C5 `on_record_not_charged`
      mechanism (protocol-amendment-GOAL-AES-001-005 Part B, adopted by this
      goal's adoption-amendment-005-partB.yaml) rather than left silently
      standing next to a self-evident overrun.
    - >-
      FINDINGS F3, F4, AND F5 ARE LOW-SEVERITY OR COSMETIC AND REQUIRE NO
      BLOCKING ACTION. F3 (the envelope manifest's 24 uncommitted raw-run
      provenance entries) is a disclosed, deliberate scope decision — only
      the three officially declared artifacts were committed — that limits
      but does not defeat future re-derivation. F4 (the red-team report
      uncommitted at validation time) is expected by this batch's own
      designed shape and is cured by this very archive task committing it
      unchanged. F5 (a cosmetic cross-reference in the red-team report
      naming a non-existent section) affects no finding's substance.
    - >-
      BOTH INDEPENDENT REVIEWS ARE SCOPED EXACTLY AS THIS BATCH REQUIRED AND
      NEITHER AUTHORIZES ANYTHING BEYOND IT. Both reach PASS_WITH_LIMITATIONS,
      explicitly scoped to protocol-freeze / object-first-ideation /
      measured-envelope purposes only, state no security claim, state no
      margin, make no comparison against the published state of the art in
      either direction, and state explicitly that neither authorizes
      dispatch of a cryptanalytic card. This decision does not exceed that
      scope in any direction.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE, so no attestation is
      recorded and none is claimed. Under standing inference-amendment/basis
      0137a051, the red-team and validator verdicts (both self-reporting
      resolved_model_id claude-sonnet-5) are ONE DRAW FROM A CORRELATED PAIR,
      supplying session independence only.

