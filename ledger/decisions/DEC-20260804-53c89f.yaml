coordinator_decision:
  id: DEC-20260804-53c89f
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-081
  recorded_by_task: TASK-20260804-102
  archived_by: TASK-20260804-103
  context: >-
    BATCH-081: Weil bound approach for H-PSEUDO is CLOSED. DL circularity recurs.
    Empirically: |hat{1_F}(k)| ~ sqrt(B)*p^{0.079} (not sqrt(N)).

  decision: close_weil_advance_weyl
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    Weil / étale cohomology route: CLOSED. Three independent blockages established
    across BATCH-067, 081:
    1. DL circularity (recurs in every reformulation)
    2. Wrong functional form (Weil gives sqrt(N), data shows sqrt(B) behavior)
    3. Even for CM curves: only works for non-generic structure inapplicable to
       standard cryptographic curves

    CORRECTED EMPIRICAL DESCRIPTION: |hat{1_F}(k)| ~ sqrt(B) * p^{0.079}
    (not sqrt(N) * constant as previously hypothesized in BATCH-080).
    This means C = max|hat|/sqrt(B) ~ p^{0.079} is genuine p-growth, not a
    B_frac normalization artifact.

    TWO REMAINING CANDIDATE APPROACHES (not yet tried):
    (A) Weyl differencing: applied to the sequence x([j]G) to bound correlations
        of the indicator 1_{x([j]G)<t}. May give a non-circular bound if the
        sequence has good equidistribution without requiring algebraic structure.
    (B) Hecke characters for CM curves: conditional on non-generic CM structure;
        gives O(sqrt(N)) but only for specially constructed curves, inapplicable
        to generic ECDLP instances.

    GOAL-ECDLP-001 stays active.

  proof_approaches_status:
    DDH_conditional: CLOSED (categorical gap)
    BGS_spectral: CLOSED (abelian group, no spectral gap)
    Weil_etale_cohomology: CLOSED (DL circularity, wrong functional form)
    Michel_Venkatesh: CLOSED (algebraic characters only)
    DL_random_permutation: CLOSED (not standard assumption, empirically refuted)
    Weyl_differencing: OPEN (not yet attempted)
    Hecke_characters_CM: OPEN (conditional on CM structure)

  exact_next_action: >-
    BATCH-082: Attempt Weyl differencing bound on Σ_j 1_{x([j]G)<t} * e^{2πi kj/N}.
    Weyl's method bounds Σ_{j<N} f(j) * e^{2πi kj/N} by iteratively differencing f
    until the derivative is "uniformly distributed." Does f(j) = 1_{x([j]G)<t} have
    "good" differencing behavior? If the 1st difference f(j+1)-f(j) has bounded correlation
    with e^{2πi kj/N}, Weyl gives a useful bound.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
