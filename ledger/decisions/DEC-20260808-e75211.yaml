coordinator_decision:
  id: DEC-20260808-e75211
  context: >-
    Correction and re-approval for EXP-ICINV-fcb497 after adverse independent
    review. Two independent reviews of the 13-run version-1 execution are
    archived and unedited:
    experiments/EXP-ICINV-fcb497/validation-report.md
    (VAL-20260807-ICINV-fcb497, terminal verdict `incomplete`, plain-English
    "validated with defects") and
    experiments/EXP-ICINV-fcb497/red-team-report.md (RT-20260807-257239, two
    CRITICAL objections). This decision does three things and no more:
    (1) it adopts ledger/corrections/CORR-20260808-ba8792.yaml, which supersedes
    the defective characterisations and the defective next action found by those
    reviews; (2) it APPROVES the versioned protocol amendment
    experiments/EXP-ICINV-fcb497/amendments/v2.yaml and RE-APPROVES the amended
    STAGE 0 for a single re-execution under a new run id; (3) it dispatches that
    re-execution as TASK-20260808-7865e0. It does NOT re-open the measurement, it
    does NOT move any hypothesis status, and it does NOT authorise the
    replication that replaces withdrawn next action N3.
  decision: approve
  decision_note: >-
    EXACTLY ONE APPROVAL AND IT IS NARROW: the amended STAGE 0, one re-execution,
    new run id, retrieval list repaired and everything else frozen. NOT `revise`
    of the experiment: the measurement is validated without reservation and needs
    no revision -- the Validator recomputed all 42 primary statistics bit-exactly
    from raw, regenerated both seeded streams over 21000 instances with 0
    mismatches, passed every blocking control on independent recomputation, and
    reproduced the frozen decision rule from a clean-room reimplementation
    including the dissenting seed. NOT `weaken` and NOT `reject_scoped`: no
    measured quantity moved, no falsification condition fired, and an adverse
    call would in any case require a refutation artifact this result does not
    admit; the strongest checkable refutation artifacts the reviews DO produce
    are the curve-free mutation of RT-2 and the small-integer computation of
    RT-1, and both are exploratory red-team probes rather than run records, so
    they are archived and cited as the basis for WITHDRAWING a next action, never
    as the basis for an adverse status call. NOT `supersede` of
    EV-ICINV-c68f13: nothing in it is unsalvageable, and a correction that names
    the wrong fields is more useful to the next reader than a wholesale reissue
    that hides which parts survived. The `replicate` transition of
    DEC-20260807-4261e3 STANDS -- both reviewers endorse the transition and the
    strength; what the Red Team rejects is the SPECIFIED replication, and that is
    withdrawn here rather than dispatched.
