  rationale:
    - >-
      THE REVIEWS ARE ACCEPTED IN FULL AND THEY DO NOT INVALIDATE THE RUN SET.
      Validity was re-established before anything was interpreted, and this time
      by someone with a Bash tool: 13 run directories against the reported tally,
      schema-complete manifests, `check_run_source_provenance.py --strict` exit 0
      at 13 pinned / 0 unpinned, prime ladder and both seeded streams regenerated
      from the contract text with 0 mismatches over 21000 instances, all 42
      primary statistics recomputed at 0 ULP from per-instance-measurements.json,
      31/31 STAGE-0 quotations re-verified as exact BYTE substrings at recorded
      offsets in both runs, 177/177 barrier-table quoted cells byte-verified, both
      blocking controls independently reproduced with a mutation-tested checker,
      and the frozen decision rule reproduced clean-room including the dissenting
      seed. THE RUN SET IS EVIDENCE. The terminal verdict `incomplete` was driven
      by V-1 (an archival gap, now closed) and by V-2/V-3 (two records needing
      superseding corrections, now written).
    - >-
      THE ONE ARCHIVAL DEFECT IS CLOSED, NOT ARGUED AWAY. V-1: ten pinned raw
      byte streams -- including BOTH HTTP 403 bodies, the only artifacts
      evidencing the retrieval failure -- were matched by `.gitignore:26` and
      uncommitted, so a BLOCKING contract-required artifact class was not a
      durable receipt. They were force-added in commit 7b40f93fd. Amendment v2
      change A6 makes the force-add a standing obligation of any successor STAGE-0
      run, so the gap is structurally non-recurring rather than fixed once.
    - >-
      V-2 IS THE SUBSTANTIVE CORRECTION AND IT IS ABOUT A DELIVERABLE, NOT A
      NUMBER. OBS-8 named a small-m family as "exactly characterised" and handed
      it forward. It is not exactly characterised: nine m = 1 instances have
      |t| = 3, and 54 instances -- 21% of the 256-instance small-m set -- form a
      SECOND family (v = -1, u = t/2 exactly, lambda = u, p == 1 mod d, m = 2,
      |t| up to 2042, at k12/k14/k16/k20, 54/54 matching with 0 exceptions) that
      OBS-8 does not mention and whose members are defined by a CONGRUENCE, not by
      a trace bound -- so OBS-8's O(1/sqrt p) trace-density argument does not
      cover them. RT-7 adds a third population in the same tail: a large-conductor
      branch where d << sqrt p and it is d, not m, that is small (p = 4093,
      t = 127, u = 63, d = 61, lambda == 2, m = 60). Whether family B is
      density-zero WAS NOT MEASURED and is not asserted here in either direction.
      RT-7 also has the argument order right: mechanism STEP 4 carries the
      dismissal unconditionally at any density, and the density argument -- an
      asymptotic claim seven decades below 2^24 cannot see -- should never have
      led.
    - >-
      V-3 IS A TRACEABILITY DEFECT THAT RUNS IN THE DIRECTION FAVOURING THIS
      LANE, AND PART OF IT IS THE DISPATCHING SESSION'S OWN ERROR. No quotation in
      either stage0-verdict.json has byte_start 1160; the recorded offsets are
      {474, 542, 785, 799, 944, 986, 987, 1001, 1015, 1445}. The five passages
      whose window covers the square-root count are labelled `base_field` by the
      windowed classifier and `kernel_field` only by the document-aware one, and
      the two double-`kernel_field` passages sit on the CLASSICAL Velu Otilde(ell)
      sentence. The overstatement keeps cost corollary CC alive. Separately and
      recorded plainly in CORR-20260808-ba8792 item C2b: THE DISPATCHING SESSION
      REPORTED THE OFFSET-1160 SUBSTRING AS INDEPENDENT CORROBORATION, IN THE PR
      BODY FOR #231 AND TO THE USER, AND THAT WAS A WEAKER CHECK THAN PRESENTED --
      it confirmed a string quoted in the execution report exists in the artifact,
      not that it was a pinned recorded quotation. The error is the dispatching
      session's, not the Executor's, and the Executor's refusal to promote the
      passage to a verdict was correct and remains endorsed. The verdict is
      unaffected: AMBIGUOUS under both classifiers, in both runs, because it is
      gated on full-text retrieval and not on labels.
    - >-
      RT-1 AND RT-2 ARE THE TWO FINDINGS THAT CHANGE WHAT HAPPENS NEXT, AND THEY
      INVALIDATE A PRE-REGISTERED NEXT ACTION RATHER THAN A MEASUREMENT. RT-1: the
      "integer reading" of CONFOUND-1 is computable from the archived tables and
      is FALSE at every tested decade -- KS(small-int, uniform-unit) in
      [0.015, 0.045], all sub-critical; KS(curve, small-int) in [0.066, 0.142], all
      super-critical. So N3 AS PRE-REGISTERED would have returned "curve sits
      below the small-integer null too" and, by its own frozen rule, recorded
      "CM reading; that is the interesting signal" -- A FALSE POSITIVE, laundered
      through SR7's no-re-scoring protection. A pre-registered rule guaranteed to
      fire the wrong branch is worse than no rule, and N3 is WITHDRAWN. RT-2 says
      what the true explanation is: from T3 and the frozen lambda-rule,
      d = p - lambda^2 - eps*lambda exactly, with eps in {0, +/-1}, hence
      lambda^2 == p (mod d) -- the curve-derived lambda is a SQUARE ROOT OF p
      MODULO d and d is a deterministic function of (p, lambda). Deleting the
      elliptic curve entirely (lambda' uniform in [2, sqrt p], d' = p - lambda'^2)
      reproduces the deficit at 0.107, 0.162, 0.113, 0.035, 0.086, 0.088, 0.035
      across k12..k24: same sign, comparable or larger, same non-monotone failure
      to decay. UNDER THE INVENTOR PROTOCOL THAT IS A CONTROLLED NULL, NOT A
      FINDING. The replacement design is three-arm -- curve / curve-free /
      uniform-unit -- pre-registered on KS(curve, curve-free), with the
      small-integer arm demoted to an answered control and the "other square root
      of lambda^2 mod d" arm EXCLUDED AS DEGENERATE (square roots differ from
      lambda by 2-torsion, so orders differ by at most a factor 2 and the arm
      returns KS ~ 0.01 by construction -- named because it is the arm a reader of
      lambda^2 == p reaches for first).
    - >-
      THE RT FIGURES ARE PROBES AND ARE TREATED AS PROBES. Every number RT-1,
      RT-2, RT-5 and RT-7 report was computed by the red-team session from the
      archived per-instance tables with no run record, no pre-registration, no
      manifest and no certificate. They are sufficient to WITHDRAW a next action
      -- a next action is a plan, and a cheap computation showing the plan
      guaranteed to misfire is exactly the right basis for scrapping it -- and
      they are NOT sufficient to move a hypothesis, to write an evidence record,
      or to be cited as measurements. They must be re-derived inside a
      pre-registered successor contract before any record cites them. That
      boundary is stated in the correction and repeated here so no later reader
      has to reconstruct it.
    - >-
      RT-5 CUTS IN THE RECORD'S FAVOUR AND IS CORRECTED ALONGSIDE THE ADVERSE
      ITEMS, WHICH IS THE POINT. CONFOUND-2 said the direction of the
      replicated-atom effect on the nominal threshold was "NOT settled by these
      data". It is settleable from the committed data: same-population KS (seed A
      curve sample vs seed B curve sample) runs 0.021-0.070, so the nominal 0.0607
      is approximately calibrated at k12-k18 and mildly ANTI-conservative at
      k20-k22, where identical populations reach 0.070-0.089. That SUPPORTS the
      record's own discounting of the dissenting seed 20260807 (k20 0.081, k22
      0.061, both inside the same-population spread) on a measured rather than an
      assumed basis, and it does NOT touch k14, where same-population KS is
      <= 0.038 against an observed 0.104-0.121. The k14 deficit is a genuine
      population difference; RT-2 then says which population.
    - >-
      V-5 IS RECORDED BECAUSE THE RECORD ERRED CONSERVATIVELY AND SAID SO TOO
      QUIETLY. The `preliminary` cap turns on ks_D 0.0610 against
      ks_crit 0.060731606268894296 at k22 / seed 20260807 -- a margin of 0.00027,
      where D is quantised in steps of 0.001. 0.061 is the smallest attainable
      value strictly above the critical value, so ONE instance's worth of ECDF
      would have given a 3/3 vote and permitted `replicated`. THE CAP IS NOT
      LOOSENED. Loosening a threshold after watching it bind is precisely the move
      the campaign's rules exist to forbid, and the direction of the error is the
      safe one. But any successor citing the cap must cite this fragility with it,
      and the correction now makes that unavoidable.
    - >-
      RT-4 AND RT-6 ARE PRESENTATION DEFECTS AND BOTH ARE CORRECTED. RT-4: the
      PS-P256 and PS-P384 rows use m_exponent_used 1.0 against measured medians of
      0.615-0.802 with no trend toward 1, in a table whose PS-TOY-24 row correctly
      uses the measured value; at the measured exponent PS-P256 is 2^330, not
      2^384 -- a 54-bit swing taken by substituting an asymptotic assumption for
      the very quantity the experiment measured. That is AGENTS rule 7 applied to
      an exponent. The run artifact is immutable and is not edited; until a
      successor carries a sensitivity row at the measured exponent and a
      `not_an_attack_cost` flag, no citation may quote the figure without the
      exponent assumption beside it -- and both rows remain conditional on a
      KERNEL_FIELD verdict that was not obtained, so neither is citable as a cost
      claim at all. RT-6: "127 of 177 undetermined" reads as an instrument that
      could not decide on 127 separate grounds; all 127 carry ONE identical reason
      keyed to a SINGLE gate, and the 48 determined rows are determined by a
      STAGE-0-INDEPENDENT argument and hold in BOTH branches. AUDIT-Z REMAINS NOT
      CONFIRMED; what is corrected is an understatement of how close it is to
      being dischargeable, which under this program's own symmetry between
      premature closure and overclaiming is the mirror-image error to the one the
      record was carefully avoiding.
    - >-
      RT-3 IS THE REOPENED GATE, AND WHAT IS APPROVED IS A RETRIEVAL FIX, NOT A
      RESEARCH TASK. STAGE 0 returned AMBIGUOUS because the frozen urls_in_order
      pins all four URLs to eprint.iacr.org, whose PDFs are Cloudflare-walled at
      403. The 403s remain an infrastructure outcome and are never negative
      mathematical evidence -- that is unchanged and restated in the amendment.
      What changes is the diagnosis: the paper is not unavailable, THE CONTRACT
      PINNED ONE PUBLISHER DOMAIN. Confirmed by the Red Team and RE-CONFIRMED
      independently by the dispatching session: https://arxiv.org/pdf/2003.10118
      returns HTTP 200, 371582 bytes, sha256 058162905a84b39fc6e23f12341b02899
      cce9328e9b45ac20750fa86cdfedd11; https://msp.org/obs/2020/4-1/
      obs-v4-n1-p05-s.pdf also returns 200. Amendment v2 adds both to
      urls_in_order with the ANTS XIV / MSP version named authoritative where the
      versions differ, requires the version used to be recorded per quotation, and
      changes NOTHING ELSE -- the byte-verification path, the four branch
      definitions and every pre-registered prediction and threshold are frozen
      word for word, and the amendment says so in terms.
    - >-
      THE STANDING PROHIBITION MATTERS MORE ON THIS RUN THAN ON THE LAST ONE, AND
      THAT IS WHY IT IS CARRIED VERBATIM. RT-3 reports that sec. 4.14 "Irrational
      generators" states the Frobenius eigenvalue is "of order e" -- which IS this
      experiment's m = ord_d(lambda) -- and that "typically e is in O(ell)", i.e.
      the source's own statement of HEUR-ORD-1 alongside its own negative
      conclusion. THE EXPECTED ANSWER IS NOW IN CIRCULATION. The re-run must
      establish any such passage from a PINNED artifact at recorded byte offsets,
      or return UNRETRIEVED_INFRA; reproducing RT-3's quotations, offsets or
      hashes from the report rather than from a freshly retrieved artifact is a
      rule-9 fabrication and makes the run INVALID. RT-3's sha256 is recorded in
      the amendment as a CHECKABLE PREDICTION the run may falsify, never as a
      value to copy.
    - >-
      DIRECTION AND TASTE, UNCHANGED AND HONEST. This lane is a
      cofactor-and-accounting question, not an exponent-moving mechanism, and
      docs/target-result-profile.md classifies it as explicitly NOT target-class.
      sota_delta is 0.0 against 0.886 sqrt(N); no attack and no speedup is claimed
      in any direction. What is being bought here is minutes of network-bound
      compute that discharges the single gate holding 127 of 177 barrier rows
      undetermined and that can fire a record-INVERTING branch against this lane's
      own interest. That is a good price. It is also the last cheap thing in this
      lane: if the re-run leaves CC undetermined, the correct next move is to stop
      spending on retrieval and let the three-arm replication decide whether an
      elliptic curve enters the deficit at all.

