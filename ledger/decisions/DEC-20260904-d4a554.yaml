  context: >-
    Evidence review of EXP-PFDR-cbdefb (the (d_ff, d_lf) slope ladder for
    H-PFDR-c88f14, twenty-three runs: fifteen m = 2 ladder cells at
    s in {1..5} x p in {4099, 16411, 65537}, three equal-d^s cells, two m = 3
    cells and three Stage-1 controls), composing the two committed blinded
    reports of review plan TASK-20260904-42b33a: the validator
    TASK-20260904-42b33a (joints V1-V4, with a BLIND re-derivation) and the red
    team TASK-20260904-3a2ff5 (joints R0-R5 and the proves-too-much control).
    THIS IS THE ONE EXPERIMENT WHERE BOTH REVIEWERS BREAK, on two independent
    defects: an unrepairable receipt gap on all three blocking instrument
    controls (V2) and pseudoreplication invalidating the reported falsifier
    statistic (R1). Independence is recorded at
    coordination/reviews/pfdr-battery-20260904/composition/independence-check.md.
    The evidence record is EV-PFDR-99c699. Approved under DEC-20260903-93862f,
    executed under TASK-20260903-6745ea.
  decision: weaken
  decision_label: >-
    weaken_HEUR_002_of_H_PFDR_c88f14_on_an_archived_derivation_rather_than_on_the_artifactual_interval_withdraw_the_reported_falsifier_statistic_as_pseudoreplicated_and_require_replication_of_the_three_unrepairable_instrument_controls
  target_ids:
    - EXP-PFDR-cbdefb
    - H-PFDR-c88f14
    - EV-PFDR-99c699
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      THE FIRST BREAK - THE REPORTED FALSIFIER STATISTIC DOES NOT FIRE, and it
      is withdrawn here rather than softened. Joint R1 BREAKS on
      PSEUDOREPLICATION. Within-cell range of d_lf is exactly 0 at ALL TWELVE
      cells and the between-prime range at fixed s is exactly 0, so the 480
      observations are FOUR INTEGERS EACH REPEATED 120 TIMES, the residual sum
      of squares is pure lack of fit, and the standard error shrinks as
      1/sqrt(n) with no statistical content. At the only independent unit -
      the four s-levels, n = 4, 2 degrees of freedom - the 95 percent
      t-interval is [-0.2085, 1.0085], which CONTAINS 0. The pre-registered
      "excludes 0" falsifier therefore DOES NOT FIRE, and the execution report's
      statement that it does is withdrawn. Both reviewers computed the
      four-point interval independently and agree to four decimal places; the
      producer's own bootstrap over draws within cells returns the degenerate
      [0.4, 0.4], which is the same tell. Five draws per s-level already buy
      "excludes 0.5".
    - >-
      AND THE FROZEN RULE COULD NOT HAVE RETURNED ANYTHING ELSE. Outcome II's
      clause "the d_ff interval lies strictly below the d_lf point estimate"
      asks an interval to lie strictly below its own centre whenever
      d_ff = d_lf on every draw, which is the case here: it is unsatisfiable on
      any single-fall system. With n = 480 the half-width is 0.018, so Outcome I
      reduces to "d_lf = s + const exactly" and Outcome III to "d_lf constant on
      s = 2..5", and every integer step between them - INCLUDING the contract's
      own frozen prediction 5, 5, 6, 6 - lands in "unresolved" by construction.
      The "unresolved" label is a fact about the RULE, not about the last fall
      degree. Relatedly, 0.400 is a property of the WINDOW: the finite-window
      OLS slope of the step 4 + floor(s/2) is 0.4 on [2,5], 0.5 on [2,6] and
      tends to 1/2, so the reported interval [0.382, 0.418] EXCLUDES the true
      growth rate of the law the data reproduce with residual 0.
    - >-
      THE SECOND BREAK - AN UNREPAIRABLE RECEIPT GAP ON ALL THREE BLOCKING
      INSTRUMENT CONTROLS. Joint V2 BREAKS on a fact the plan did not
      anticipate. closure.py 74e659bb - the version that produced
      RUN-PFDR-cbdefb-fixture, -s1-slice and -dff-agreement, i.e. the
      known-answer fixture, the s = 1 baseline slice and the d_ff-agreement
      control, ALL THREE blocking instrument controls in their Stage-1 form -
      exists in NO reachable commit and not in the working tree. closure.py
      enters git history exactly once, in a3a81e33, with content 63475db5, which
      is what the other twenty runs pin and what the tree copy hashes to. A pin
      to a blob nobody has is not retention: those three runs cannot be re-run,
      and the plan's own disposition for this joint - "a disclosed change whose
      metric-neutrality only the red team, who may read the file, can judge" -
      is not executable by anyone. THE ORCHESTRATING COORDINATOR SESSION
      VERIFIED THIS DIRECTLY IN GIT HISTORY, independently of the reports, and
      confirmed it.
    - >-
      THE VALIDITY DISPOSITION, stated precisely so the break is neither
      inflated nor absorbed. The run set is ADMISSIBLE FOR THE LADDER
      MEASUREMENT and INCOMPLETE FOR ITS INSTRUMENT CONTROLS. The twenty runs
      producing every number in the ladder, the equal-d^s cells and the m = 3
      cells are pinned to the retained, tree-identical version; 138 of 138
      sidecar hashes recompute; the convention hash binds; the seeds are the
      contract's; the exactness bound holds with a 2164x margin; and the
      load-bearing quantity was BLIND re-derived on all 48 systems of the
      declared subsample by an implementation sharing no code with the
      producer's. Per docs/evidence-and-reproducibility.md a missing
      reproduction-package element is INCOMPLETE evidence, not INVALID evidence,
      and NO WRONG NUMBER was found anywhere by either reviewer. The three
      Stage-1 control runs are cited NOWHERE in EV-PFDR-99c699, which lists only
      the twenty. Their function is partly mitigated (the s = 1 floor was
      re-measured under the retained version in the three m2-s1 ladder cells,
      P1 is recomputed inside all 15 ladder cells, and the validator's own blind
      closure reproduces the agreement instance) and unmitigated in one place:
      the recorded comparison against EXP-PFDR-5726af exists only under the lost
      version. That is a reason to RE-RUN them, which this decision requires.
    - >-
      THE ADVERSE TRANSITION ON HEUR-002 RESTS ON A DERIVATION, NOT ON THE
      ARTIFACTUAL INTERVAL, and that distinction is the whole point. What
      replaces the withdrawn statistic is stronger than it was. Joint R3 HOLDS
      and supplies Theorem A: if V_{F,D0} = I cap B_{<=D0} for some
      D0 >= e(Z) + 1 then no fall occurs above D0 at any degree, because
      I cap B_{<=D} = (I cap B_{<=D-1}) + sum_i a_i (I cap B_{<=D-1}) for every
      D >= e(Z) + 2. Its one condition is verified PER DRAW from the raw
      records: V_complete_at_D is TRUE at the first fall on all 3752 fallen
      systems and the degree condition holds on 3660. So d_lf = d_ff is DERIVED,
      NOT FITTED, on those 3660 systems, and the closure SOLVES the digit system
      at d_ff = 4 + floor(s/2). HEUR-002 (a bounded last fall degree) is then
      contradicted in substance by the integers - d_lf rises from 5 to 6 between
      s = 3 and s = 4 on 480 of 480 draws at three primes with certified
      histories - and its failure for ALL s follows from d_lf >= d_ff together
      with H-PFDR-4148b8's derived d_ff law, inheriting that law's conditions.
      This is exactly what the recorded coordinator_prior made its weaken
      CONDITIONAL on, and the condition was met.
    - >-
      WHY NOT reject_scoped. docs/claims-and-verification.md forbids
      reject_scoped on a single unreplicated empirical-only run, and this
      decision additionally declines it for a reason of its own: the derivation
      that carries the adverse transition INHERITS the conditions of
      H-PFDR-4148b8's d_ff law - H-TOP at m = 2, Wilson's rank theorem, and the
      status of a hypothesis that this same round moved to analyzed and one of
      whose clauses this same round refuted by counterexample. A rejection
      resting on a conditional law whose own record was just corrected would
      overclaim. Weaken plus a required replication is the honest verb.
    - >-
      CLAIM (A) HOLDS AS A DERIVATION AND ITS STATED GROUNDS ARE INCOMPLETE.
      Joint R5 HOLDS. Theorem 2.6 of arXiv:2103.07282 as displayed carries TWO
      hypotheses - F a finite set of k'-LINEARIZED polynomials of maximum degree
      d = q^c, AND F reducible for k - and the package names only the second.
      The missing linearized hypothesis is a THIRD and CHEAPER non-transferring
      step: S~ has degree 4 and is not additive, it needs no proof-body reading,
      it carries claim (A)'s conclusion on its own, and it shows that the
      package's "formal analogue constant 4m = 8" is a substitution into a
      formula whose variable ranges over linearized generators - a category
      error rather than merely a theorem-less number. The package's step from
      "Lemma 2.1 has no F_p analogue" to "no version transfers" is an inference
      about a proof body the retrieved material does not license, and it is not
      needed.
    - >-
      THE INSTRUMENT WAS ATTACKED AND HELD. Joint R2 HOLDS: on a planted
      late-fall object (n = 10, p = 4099, g of degree 8 with a true fall at
      D = 8) the completeness certificate REFUSED at D_max = 7 - dim V_7 = 112
      against dim(I cap B_{<=7}) = 582, C1 false, right_censored true - which is
      the mutation that would have exposed a certificate biased toward flatness,
      and it did not fire. Recorded honestly alongside it: C2(D) is a THEOREM
      for every D >= e(Z) + 2 and all 480 recorded Semaev C2 checks are at
      D >= 8 with e(Z) <= 3, so NONE COULD HAVE FAILED - the censoring decision
      rests on C1 alone and the certificate must not be read as two independent
      checks. And certification is equivalent to a LOW last fall, so the fitted
      SAMPLE is selected by an ideal-level predicate although each d_lf value is
      generator-level; no bias was realised at s <= 5, but a future cell with
      d_lf > D_max would be dropped and the fit biased toward Outcome III.
    - >-
      SCOPE, AND IT IS A HARD LIMIT RATHER THAN A CAVEAT. Joint R4 HOLDS and
      establishes that the non-curve (singular, nodal) cubic reproduces the
      Semaev (d_ff, d_lf) pair AND the censoring status at ALL 15 CELLS on 600
      draws, and that NULL-3, the block-factored null, matches the full pair at
      s = 3, 4, 5 with difference 0 in BOTH coordinates. By the contract's own
      pre-registered F5 reading this is a controlled null: NOTHING IN THIS
      PACKAGE IS A STATEMENT ABOUT SUMMATION POLYNOMIALS, ELLIPTIC CURVES OR THE
      ECDLP. It is a statement about a single degree-4 multilinear generator in
      2s squarefree digit variables whose top form is the tensor square of the
      digit linear forms.
    - >-
      THE ONE COST-BEARING STATEMENT IN THIS LANE IS NEGATIVE AND IS RECORDED
      WITH ITS FACTOR. At the measured solving degree the reduced column count
      gives log_B N_D = 1.99, 1.95, 1.95 at s = 3, 4, 5, tending to
      2H(1/4) = 1.6226, so the linear-algebra cost is about B^{3.9} at s = 4, 5
      and tends to B^{3.245} at omega = 2, against B^1 for exhaustive
      enumeration of one digit block and O(sqrt(N)) for Pollard rho. SIGMA > 1
      BY A WIDE MARGIN AT EVERY s: the algebraic route at its own measured
      solving degree is dominated by brute-force enumeration of the digit cube,
      let alone by rho on both time and memory. This CONFIRMS
      IDEA-20260903-e1e38b (D7) with a concrete factor and shows its optimistic
      assumption d_solve = d_ff is the measured truth, so it cannot be improved.
      Separately and consequentially for the sibling lane: D_0 in
      EXP-PFDR-c04716's table is a CONSTANT parameter, and the measurement shows
      it is a GROWING FUNCTION of s at m = 2, exceeding that table's D_0 <= 6
      requirement at 256 bits with omega = 2 from s = 6 on.
    - >-
      HEUR-001 IS SUPPORTED WHERE TESTABLE AND NOT TESTED WHERE IT MATTERS MOST.
      The offset c = d_lf - (s + 2) is exactly 1 on every uncensored NULL-1 and
      NULL-2 draw at s = 2, 3, 4, and at s = 5 EVERY ONE of the 615 null objects
      is right-censored by D_max = 7 - the top cell, where a widening band would
      first show, was NOT MEASURED. The contract's "band offset grows with s"
      flag fires on an s = 1 ring-size boundary artifact, not on a trend.
    - >-
      THE PRIOR WAS CONFIRMED IN NEAR-VERBATIM DETAIL, including the four-point
      interval to four decimal places, the unsatisfiability of Outcome II, the
      window-dependence of 0.400, the closure-solves observation, the censored
      null at s = 5, the F5 controlled-null reading and all three named
      instrument risks. Two items it did not anticipate: the V2 retention gap,
      which is adverse and is why this decision carries a mandatory replication,
      and R5's third non-transferring step, which is favourable. The prior's
      conditional - weaken IF the red team can argue d_lf = d_ff from the closed
      form and the closure's saturation - RESOLVED IN FAVOUR OF THE DERIVATION.
