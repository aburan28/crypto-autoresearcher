      produced is already promoted and would be duplicated here: the measured
      D_0(s) = d_lf = d_ff = 4 + floor(s/2) at m = 2 and the single-fall /
      closure-solves derivation are carried by KN-FIND-0618ab under
      DEC-20260904-d47cd2, which cites this experiment's runs and this evidence
      record; the planted-defect instrument-adequacy pattern demonstrated here
      by the planted late-fall object is carried by KN-TECH-1cd4bb under
      DEC-20260904-63a809. (3) THE RECEIPT IS INCOMPLETE on all three blocking
      instrument controls, and a knowledge entry minted from a lane whose
      instrument controls cannot be re-run would harden a gap the corpus cannot
      later see. No further entry is warranted until the replication in
      next_actions returns; at that point the two candidates are the corrected
      falsifier note and, if the s = 6 cell is ever measured, the growth
      direction of the law.
