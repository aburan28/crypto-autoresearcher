    not_warranted: >-
      No new knowledge entry is promoted FROM THIS DECISION, for three concrete
      reasons rather than as a default. (1) The gate binds a KN-FIND on support
      or reject_scoped at replicated or strong strength; this is a WEAKEN, so no
