  limitations:
    - >-
      THE RECEIPT IS INCOMPLETE. All three blocking instrument controls in their
      Stage-1 form pin a closure.py version retained nowhere; they are cited as
      evidence in no record of this round, and their metric-neutrality cannot be
      established by anyone. This caps the strength of everything in this lane
      until the replication returns.
    - >-
      THE RESULT IS NOT ABOUT ELLIPTIC CURVES. The singular non-curve cubic
      reproduces the pair AND the censoring status at every one of the 15 cells.
    - >-
      The fitted slope is not a supported statement about growth, in any
      direction. On the four independent s-points the interval contains 0, 0.25,
      0.5 and 1. The measurement is genuinely unresolved at resolution 0.25 with
      four points, and the contract's rule could not have said so for the right
      reason.
    - >-
      HEUR-002's failure for ALL s is CONDITIONAL: it follows from d_lf >= d_ff
      plus H-PFDR-4148b8's derived d_ff law, and therefore inherits H-TOP at
      m = 2, Wilson's rank theorem, and the analyzed status of a hypothesis one
      of whose clauses this same round refuted by counterexample.
    - >-
      THE LADDER CANNOT BE LENGTHENED under the frozen instrument: at m = 2,
      s = 6 the ring has 4096 monomials against CERTIFICATE_COLUMN_LIMIT = 1024,
      so certify_history returns "certificate not attempted" and every draw is
      right-censored BY DECLARATION. Outcome III's "four consecutive uncensored
      cells" clause can never be satisfied on more than the four already
      measured.
    - >-
      The quantity is CONVENTION-DEPENDENT and the frozen convention document
      was hashed, not opened, by the blind reviewer. A defensible third reading
      moves the ladder from 5, 5, 6, 6 to 4, 5, 5, 6 and the slope from 0.4 to
      0.6. The manifests' convention_id describes the designated reading, so the
      agreement is on the intended object.
    - >-
      117 of the 120 s = 5 Semaev draws rest on the dense float64 engine ALONE.
      That engine is not the validated meter (VALIDATION.md states "no floating
      point anywhere in a rank"); its correctness rests on the declared
      exactness bound, which holds with a 2164x margin, and on the reviewer's
      own independent EXACT computation agreeing at s = 5 on all 12 instances.
    - >-
      The presentational artifact budget is UNMEASURED, not zero: all 45
      CTRL-EQUAL-DS-SPREAD instances at B = 64 are censored because D_max = 6
      sits below the derived first fall 7 of the matched arm, so
      IDEA-20260830-84cdb7's factor-2 rule has no denominator in this lane and
      must not be cited until it has one.
    - >-
      The definition of the measured invariant V_{F,i} REMAINS UNVERIFIED
      AGAINST ITS SOURCE: it is `recalled` in the hypothesis record, and the
      eprint page the reviewer retrieved does not contain it. Internal validity
      is unaffected because the convention is frozen, explicit and pinned, but
      no outward-facing statement may imply the source was checked. KN-LIT-7605
      separately overstates its paper's scope in exactly the direction that
      makes a bounded last fall for Semaev systems look like established prior
      art.
    - >-
      Three of the twelve declared instances carry a DOUBLING (ell_1 = ell_2)
      rather than a two-summand decomposition, with solution-set size 1. The
      pair is unaffected; recorded as an unexpected observation.
    - >-
      The m >= 3 extension is not measured here: one cell at s = 2 below the
      closed form's range and one not computable at D_max = 7.
    - >-
      Correlated judgement: producer and both reviewers report the same model
      family with model_verified false.
    - >-
      This decision was composed by a Coordinator subagent with no shell and no
      interpreter; it ran no code and executed neither
      tools/check_review_independence.py nor tools/validate_ledger.py. The
      closure.py retention finding was verified by the ORCHESTRATING session
      directly in git history.
  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE, AND IT IS A REPLICATION. Re-run the
      three Stage-1 controls - the known-answer fixture, the s = 1 baseline
      slice and CTRL-DFF-AGREEMENT - under the RETAINED closure.py 63475db5,
      under a new executor handoff and a new run-id set, with the results
      recorded as new immutable runs beside the originals rather than replacing
      them. It costs about 13 minutes (dff-agreement was 762 s, the other two
      under 25 s each). Until it returns, the three original control runs stay
      inadmissible as instrument controls and no record of this lane may cite
      them, the cross-contract comparison against EXP-PFDR-5726af stays
      unavailable, and the strength of this lane stays capped. Pair the re-run
      with the standing readout of V_complete_at_D, fall_dim(d_ff),
      dim(I cap B_{<=d_ff - 1}) and |Z| as FIRST-CLASS metrics rather than as
      diagnostics added after the first two runs, since those are exactly what
      make the single-fall statement derivable.
    - >-
      RECORDS THE ORCHESTRATING SESSION MUST ALLOCATE IDENTIFIERS FOR - each a
      SUPERSEDING record, never an edit. (a) A correction note recording that
      the execution report's "the HEUR-002 falsifier statistic fires" DOES NOT
      SURVIVE an honest unit of replication, that the four-point interval is
      [-0.2085, 1.0085], and that any interval computed on per-draw replicates
      of a zero-within-cell-variance response must be labelled lack of fit and
      not sampling uncertainty. (b) An annotation of claim (A) of H-PFDR-c88f14
      recording the MISSING LINEARIZED HYPOTHESIS of Theorem 2.6 as the third
      and cheapest non-transferring step, and withdrawing the inference from
      "Lemma 2.1 has no F_p analogue" to "no version transfers". (c) An
      annotation of KN-LIT-7605 recording its authors (Ming-Deh Huang), its year
      (2021), and that its stated key claim about summation-polynomial systems
      over F_2 is not supported by the retrieved abstract or theorems, which
      name LINEARIZED polynomials. (d) A correction note re-wording
      CTRL-ITERATION-COUNT as "iteration_count = 1 AND W0_saturated = false" and
      re-reporting the s = 1 rows under the corrected rule, so the analysis does
      not read "no valid fall" where the correct answer is (3, 3). None is
      created by this decision, and this agent allocated no identifiers.
    - >-
      BEFORE THE THREE-OUTCOME RULE IS USED AGAIN ANYWHERE, restate it for a
      LATTICE-VALUED response. It currently tests exact linearity with slope 0
      or 1, has no branch for an integer step, and its Outcome II clause is
      unsatisfiable whenever d_ff = d_lf. Report the d_lf slope with the s-level
      as the unit of replication (n = 4, 2 degrees of freedom), or drop the
      slope statistic entirely and report the integers.
    - >-
      SUBSTITUTE THE FUNCTION, NOT THE CONSTANT, wherever this lane's D_0 feeds
      a cost model. D_0(s) = 4 + floor(s/2) at m = 2 is the measured law and it
      GROWS; EXP-PFDR-c04716's D_0 <= 6 requirement at 256 bits with omega = 2
      is exceeded from s = 6 on. The degree column is recorded in
      KN-FIND-0618ab, promoted under DEC-20260904-d47cd2.
  knowledge_promotion:
