  context: >-
    BATCH-101: ECCG → H-PSEUDO reduction analysis. Blocked by precision mismatch:
    normalized bias C/sqrt(p) ~ 2^{-128} at crypto scale is undetectable by any PPT.

  decision: close_eccg_route_advance
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    ECCG security → H-PSEUDO: BLOCKED.

    Precise obstruction: H-PSEUDO failure at N~p~2^256 produces normalized bias
    δ = C/sqrt(p) ~ C·2^{-128}. Detecting δ requires Ω(δ^{-2}) = Ω(2^{256}) samples —
    super-polynomial in the security parameter. No PPT algorithm can detect it.
    Computing the full DFT from all N ECCG outputs is equivalent to solving ECDLP.

    ADDED TO THE CLOSED LIST:
    9. ECCG security conditional reduction: blocked by precision mismatch (A/N << 1/poly(λ))

    STATUS AFTER 101 BATCHES:
    All 9 H-PSEUDO proof approaches are now closed for generic cryptographic curves.
    H-PSEUDO is a genuine new mathematical open problem that:
    1. Cannot be proved by any known analytic technique (Weil, Weyl, BGS, MV, DDH, Shparlinski, MAGCS, LC, ECCG)
    2. Is empirically supported (C ~ p^{0.079}, yield error negligible at crypto scale)
    3. Is the UNIQUE unblocked path to sub-rho classical prime-field ECDLP
    4. Has a partial result: proved for k=2 MOV curves via Katz-Sarnak

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-102: Given all 9 H-PSEUDO approaches are closed, investigate whether the
    LINEAR COMPLEXITY connection (IDEA-24b025) gives any path. Specifically:
    measure the correlation between the F_p linear complexity of x([j]G) and the
    DFT coefficients of 1_{x([j]G)<t} at p=1009. If LC ≈ N/2 and max DFT ≈ C*sqrt(B)
    for random sequences with LC ≈ N/2: H-PSEUDO is a GENERIC property of high-LC
    sequences. If EC sequences have lower DFT than generic high-LC sequences: EC
    structure specifically helps.

  knowledge_promotion:
