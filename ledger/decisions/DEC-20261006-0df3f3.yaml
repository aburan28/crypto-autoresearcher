  context: >-
    /design-experiment plus /propose-ideas, one cycle. IDEA-20261006-7300c0
    is on origin/design/hyper-79cb0a-prym and is not on origin/main.
    The question is RQ-FROB-7d8dd4. No hypothesis or experiment on
    origin/main cites that full id. The branch design/frob-7300c0 was
    created from origin/main at
    cd2471e93113e228f3daabaee4bc2d3044bb8c98 and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob 43db777291b1ebd0bba6757b18ca67935cb38371.

    The contract freezes q = 3, n = 5, the field polynomial
    a^5 + 2 a + 1, base size 5, 40 targets, and the closed interval
    [1/2, 2]. Success is the source idea's prediction that both
    ratios lie in that interval with every hit count at least 1.
    The concrete negative is that both object hit counts are at
    least 1 and the object ratio lies strictly outside [1/2, 2],
    while the null ratio lies inside the interval. A ratio equal
    to 1/2 or equal to 2 meets the closed interval. No hit was
    scored in this session.

    This session opened KR-IC-b0fcda, KR-IC-5a43e5, KR-IC-46d822,
    KR-IC-f5c584, and KR-RHO-037e22. Those rows are not a measurement
    of this ratio.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when the object ratio lies strictly outside the interval under
    the stated instrument conditions, and it is also not confirmed
    when the curve search is unmeasured.

    The same pass files three proposals and does not design them:
    IDEA-20261006-ffe333, IDEA-20261006-89e226, and
    IDEA-20261006-706e9c.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - An object ratio strictly outside [1/2, 2], with the null ratio inside the interval, is reachable as a recorded outcome, so success is not automatic.
    - The Jacobian recomputation, the null ratio, the cardinality check, and the freeze order are the instrument controls.
    - An instrument failure is not relabeled as a yield gap, and a zero hit count is not relabeled as a confirmation.
    - This session did not score a hit and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers q = 3 and n = 5 only. It does not transfer to n = 131.
    - A ratio inside [1/2, 2] does not lower Gaudry's exponent 8/5 and does not run linear algebra.
    - A missing ordinary curve, a missing null, and a zero hit count are not the yield-gap negative.
    - An instrument failure is not a ratio.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

