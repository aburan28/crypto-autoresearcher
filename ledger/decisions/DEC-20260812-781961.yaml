coordinator_decision:
  id: DEC-20260812-781961

  context: >-
    BATCH-4ed139 of GOAL-MLKEM-005 ran one lead producer and three gated riders against
    PREREG-1, the frozen pre-registration notarized at commit
    8d72f2c038a577e216ab9d6d0e5995f65d5ff819 by TASK-20260812-1ed548 in a commit containing
    ZERO producer artifacts. The lead implemented G-VAR2 -- the replacement dispersion
    criterion AM-16(a) specifies, extended by AM-17(b), (c) and (d) -- and validated it
    against the two committed fixtures AM-17(b) requires. Both independent reviews have
    returned: TASK-20260812-55056b (Validator, verdict `passed`) and TASK-20260812-696cd4
    (Red Team, sixteen probes, three built counterexamples). THE FROZEN THREE-WAY
    TERMINATION CLAUSE OF PREREG-1 SECTION 7 FIRED T-F0FAIL, REPORTED WITH THE SECTION 7.4
    SUFFIX AS T-F0FAIL-PARTIAL, AND BOTH REVIEWS CONFIRM IT INDEPENDENTLY. This decision
    is that batch's official close. CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on
    ML-KEM security, on any FIPS 203 parameter set, on any attack cost, or on any cost
    model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the frozen instrument specification is amended by AM-18
    below, four citation rulings are made, and the successor's single next action is
    specified -- and it is NOT a verdict on any proposition about a lattice. NOTHING IS
    `support`ed, `weaken`ed OR `reject_scoped` HERE, no hypothesis status moves and none is
    named, and no refutation artifact is owed for a transition that is not made. `approve`
    would endorse an instrument that failed its own reference fixture. `pause` is
    unavailable: GOAL-MLKEM-005's pause_conditions are INFRASTRUCTURE-ONLY plus a user
    request, and an instrument outcome, an exhausted batch and a scoped negative are all
    listed in its non_terminal_conditions and may not be cited in a decision that closes,
    pauses or completes it. THIS BATCH CLOSES, PAUSES AND COMPLETES NOTHING. T-F0FAIL
    CLOSES NO LANE -- that was T-F1FAIL, which did not fire -- so no closure standard is
    triggered and no obstruction needs naming under docs/inventor-protocol.md section 4.
    THE LIVE RISK IS THE OPPOSITE ONE, and AM-18(a) addresses it.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-4ed139
  - EV-MLKEM-aa39ad
  - TASK-20260812-34b86c
  - TASK-20260812-56b9da
  - TASK-20260812-78a6e3
  - TASK-20260812-4b8ede
  - TASK-20260812-0e930c
  - TASK-20260812-55056b
  - TASK-20260812-696cd4
  - TASK-20260812-1ed548
  - TASK-20260812-b581a8
  - TASK-20260812-b53c2f

  # ==================================================================
  # 0. PROVENANCE OF EVERY STATEMENT BELOW
  # ==================================================================
  provenance:
    read_by_me_in_this_worktree_and_therefore_mine_to_assert:
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-34b86c/prereg.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-56b9da/report_gvar2.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-78a6e3/report_c1res.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-4b8ede/report_falserefusal.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-0e930c/report_l7l8.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/reviews/TASK-20260812-55056b/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/reviews/TASK-20260812-696cd4/red_team_report.md
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-4ed139/tasks/TASK-20260812-655fe9/task_card.md
    - ledger/decisions/DEC-20260812-7c4a1e.yaml
    - ledger/decisions/DEC-20260809-afe29b.yaml
    - knowledge/findings/KN-FIND-4b8d73.md
    - ledger/goals/GOAL-MLKEM-005.yaml
