      the 25 most-recently-updated remote branches (0 hits) and confirmation that it is not
      tracked under knowledge/findings/ on origin/main. RECORDED AS TWO-SCOPE CONFIRMED AND
      NEVER AS `--check` ALONE: `--check` answers from the working tree only, which is
      exactly defect (b) of DEC-20260812-15d3b2 and is how EV-MLKEM-9346bb and
      DEC-20260809-afe29b were reported FREE while already occupied on a pushed branch.

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND IS ADMISSIBLE AS EVIDENCE, with one recorded prose defect
      that changes nothing. Checked before any interpretation, and attributed rather than
      claimed.
    expected_run_count: >-
      FOUR producer packages, seven artifacts each, one declared measurement run each. The
      lead ran once (development dry-runs executed OUTSIDE the repository under a scratch
      path, disclosed as such). Riders (ii) and (iii) ran their measurement exactly once.
      RIDER (i) IS THE EXCEPTION AND IT IS RULED SEPARATELY BELOW (F-4).
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR, NOT BY ME (AC-11, RC-2). For each of the four producers
      the declared artifact set EQUALS the committed set at 7 = 7 with 0 undeclared and 0
      missing; durable command.txt, stdout.log and stderr.log exist in every task
      directory; 0 paths appear inside a folded YAML scalar; the exact runnable command
      including its resource caps is recorded; git revision and dirty-tree state are
      recorded with an itemized reason (in every case ONLY untracked task-output
      directories, with NO tracked file modified, added or deleted); environment is
      recorded as MEASURED, the lead recording all five BLAS thread settings as unset and
      saying so rather than claiming a pinning it did not do. All four stderr.log files are
      0 bytes BY MEASUREMENT (exit code 0 in every case), not by omission.
    seed_integrity: >-
      CONFIRMED BY THE VALIDATOR. Seeds are recorded exhaustively with their generators --
      default_rng([prefix, d, k, i]) at prefixes 1 (F0/F1), 2, 3 and 4 (the three fibre
      families), U at [424242, d], H at [313131, d] -- and the Validator rebuilt every
      basis FROM THOSE SEEDS rather than from any producer artifact, obtaining agreement at
