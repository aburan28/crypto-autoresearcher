      block against PREREG-1 2.3 before any reduction, and all 16 pass.
    raw_summary_agreement: >-
      CONFIRMED FOR THE MACHINE-READABLE RECORD (MR-2, MR-7): 1368 of 1368 per-cell s_c
      values bit-identical, 1368 of 1368 VAR-S verdicts and 1368 of 1368 G-VAR2 verdicts
      agreeing, and the lead's global counters recount exactly from its own committed
      per_cell_profiles (G-VAR2 REFUSE 1142, ADMIT 302, UNCOVERED 74; VAR-S REFUSE 915,
      scale_degenerate 474, ADMIT 129; VAR-F FAIL 1142, PASS 302). ONE DISAGREEMENT EXISTS
      AND IT IS IN PROSE ONLY: Validator F-1, carried at EV-MLKEM-aa39ad OBS-14. It does
      not invalidate the run set, because every verdict in this batch derives from the
      committed JSON and the JSON is correct.
    control_comparability: >-
      CONFIRMED. F1 differs from F0 in EXACTLY ONE declared respect; the fibre families are
      NEW DRAWS at seed prefixes 2, 3 and 4 so that a fibre family is never a relabelling of
      a scored family; the PREREG-1 6.4 fibre guard holds at every fibre family and every
      lattice (|det B_i| bit-identical across all 8 bases by exact integer comparison on a
      verified block structure), so the run is not an instrument failure on that count; and
      both could-not-fail arrangements were measured rather than asserted in both directions
      (1142 REFUSE verdicts against 302 ADMIT verdicts and 129 VAR-S ADMIT cells). THE ONE
      COMPARABILITY DEFECT IS IN THE FROZEN TEXT AND NOT IN ANY PRODUCER: the guard ranges
      over |det B| alone and never over A[0,0], which PREREG-1 2.4 also declares a fibre
      nuisance argument. Both reviews found it independently; both measured that it changes
      no outcome row of this batch; AM-18(c) repairs it prospectively.
    infrastructure_separation: >-
      fpylll is ABSENT on the lead's host and on both reviewers' hosts, and /usr/bin/time is
      absent on all of them. Every consequence is recorded as COVERAGE or as INFRASTRUCTURE
      SIGNAL and never as a result: no peak-RSS value is estimated anywhere, three records
      state NOT MEASURED and state no number, the one that states a number took it from
      getrusage and says so, and the one that carries another task's number labels it as
      carried in the same sentence. NO BRANCH OF PREREG-1 SECTION 7 WAS REACHED THROUGH A
      MISSING DEPENDENCY, A TIMEOUT OR A CRASH, and both reviews established that
      independently rather than accepting it.

  # ==================================================================
  # 2. THE BRANCH THAT FIRED, AND WHAT IT MEANS
  #    This is the hardest call in the batch and it is made explicitly.
  # ==================================================================
  termination_branch:
    branch: T-F0FAIL, reported with the PREREG-1 7.4 suffix as T-F0FAIL-PARTIAL.
    read_off: >-
      R2-OUT-1 and R2-OUT-2 under R2-OUT-V's precedence, AND NOWHERE ELSE (PREREG-1 10).
      Step 1, precedence: R2-OUT-V (VOID) dominates everything and DOES NOT FIRE, the graded
      guard crossing within the frozen grid at 38 of 38 cells on every one of the six routes.
      Step 2, order: F0's verdict is evaluated before F1's. R2-OUT-1 = FAIL. Step 3: "If F0
      fails, T-F0FAIL fires whatever F1 does." Step 4: the -PARTIAL suffix is owed because
      declared coverage is missing (route RD for lam1n and hkz, 74 UNCOVERED cells).
      THE VALIDATOR RE-DERIVED ALL FOUR STEPS FROM ARTIFACTS RATHER THAN FROM THE PRODUCER'S
      SUMMARY AND REPORTS THE SAME BRANCH; the Red Team checked the branch clause by clause
      and states "THE BRANCH IS CORRECT AND I DO NOT CONTEST IT." I adopt it unamended.
    the_clause_quoted_verbatim_from_prereg_1_7_3: >-
      "FIRES WHEN: F0 FAILS at one or more covered cells or routes -- whatever F1 does."
    what_it_licenses_quoted_verbatim: >-
      "a decision recording that the AM-16(a) operationalization does not reproduce its own
      declared target behaviour on the fixture it was written against. Specifying a
      replacement is a Coordinator act in the successor decision, not a producer act here."
    what_it_forbids_quoted_verbatim_and_honoured_in_full:
    - proceeding to C3 behind G-VAR2
    - >-
      treating the F1 result as informative -- "if the instrument fails at its own reference
      point, its behaviour elsewhere is uninterpretable". F1's numbers are recorded in
      EV-MLKEM-aa39ad OBS-4 because the completion gate requires them to be recorded, and NO
      INFERENCE IN EITHER DIRECTION IS DRAWN FROM THEM ANYWHERE IN THIS DECISION.
    - >-
      presenting this F0 failure as evidence about any lattice, any observable's
      admissibility, or any proposition in this goal -- IT IS AN INSTRUMENT OUTCOME
    - >-
      reading a failure caused by a missing dependency, a timeout or a crash as an F0 failure
      at all. NONE WAS, and both reviews verified that independently.
    - closing, pausing or completing GOAL-MLKEM-005
    one_interpretive_latitude_recorded_rather_than_used: >-
      PREREG-1 7.4's parenthetical names only T-PASS-PARTIAL and T-F1FAIL-PARTIAL as
      examples and does not spell out T-F0FAIL-PARTIAL, while its RULE is general ("the
      branch that fires is reported with the suffix -PARTIAL"). The producer applied the
      general rule, which DISCLOSES missing coverage rather than suppressing it and does not
      change which branch fired. The Validator records it as a latitude and not a defect and
      I adopt that reading; a successor tightening 7.4 should enumerate all three.

  # ==================================================================
  # 3. THE MEANS CLAUSE -- WRITTEN ABOUT THE CONJUNCTION, WITH BOTH
  #    READINGS VISIBLE AND THE FROZEN TEXT UNEDITED
  # ==================================================================
  the_means_clause:
    the_frozen_text_quoted_verbatim: >-
      PREREG-1 7.3, MEANS: "AM-16(a) itself needs replacing, and that is reported as such."
    what_was_measured: >-
      AM-16(a) IS VAR-S. VAR-S DECIDED NO FAILING CELL: `rdet` is `scale_degenerate` at 38
      of 38 cells under ALL SIX declared routes, so by PREREG-1 3.2's own frozen reading --
      not a pass and not a fail -- every one of those cells was routed to VAR-F alone, and
      PREREG-1 3.3's BIT-IDENTITY FALLBACK decided all of them. The Red Team reaches this
      from the lead's own R2-OUT-5 disclosure; the Validator reaches it from its own
      re-derivation of the mechanism, and its blind null N2 -- an observable no producer
      scored -- reproduces the admission exactly, which shows the defect belongs to the
      CLAUSE and not to `rdet`. AM-16(a) has exactly ONE independent miss in this batch,
      `rawtail` through the reduction-free raw-GSO route at L4 beta 95 (D_c = 4.876e-4
      against tau_var = 1e-3) -- and the lead itself records that a reviewer who reads route
      RD as strictly requiring fpylll must read that whole row as UNCOVERED, in which case
      AM-16(a) HAS ZERO MISSES IN THIS BATCH. The Validator further measured that this
      single miss is an artifact of the calibration (rawtail's admission count is 38 at
      tau_var = 1e-4, 37 at the frozen 1e-3, 17 at 1e-2, 0 at 1e-1) while `rdet`'s 114
      admissions are INVARIANT across sixteen decades of tau_var, because bit-identity at a
      scale_degenerate cell has no threshold at all.
    ruling: >-
      THE MEANS CLAUSE OF THIS DECISION IS WRITTEN ABOUT THE CONJUNCTION G-VAR2 AS FROZEN BY
      PREREG-1 SECTION 3, AND ITS MEASURED LOCUS IS SECTION 3.3's BIT-IDENTITY FALLBACK AT
      SCALE-DEGENERATE FIBRE CELLS, COMPOSED WITH SECTION 3.2's DEGENERATE-SCALE RULE THAT
      ROUTES EVERY BETA-FREE CANDIDATE'S VERDICT TO VAR-F ALONE. Stated in the form the
      branch licenses: THE G-VAR2 OPERATIONALIZATION AS FROZEN BY PREREG-1 SECTION 3 DOES
      NOT REPRODUCE ITS OWN DECLARED TARGET BEHAVIOUR ON THE FIXTURE IT WAS WRITTEN AGAINST.
      That sentence is true of the conjunction and, under the strict RD reading, FALSE of
      AM-16(a) alone.
    what_is_superseded_and_what_is_not: >-
      SUPERSEDED ON THE EVIDENCE, BY REFERENCE AND NOT BY EDIT: the CAUSAL ATTRIBUTION in
      PREREG-1 7.3's MEANS sentence. NOT SUPERSEDED AND NOT TOUCHED: which branch fired,
      what that branch licenses, and every item on its FORBIDS list, all of which are adopted
      in full above. THE FROZEN TEXT IS NOT EDITED, NOT AMENDED AND NOT RE-READ FOR WHICH
      BRANCH FIRES. This is not a post-hoc change of a success criterion and no
      `protocol_amendment` is owed for it: the fixture verdicts, the prediction register and
      the branch are exactly as frozen, and what is corrected is an editorial statement of
      CAUSE that the measurement contradicts. PREREG-1 0 forbids re-reading section 7 to
      reach a more convenient BRANCH; it does not require a Coordinator to repeat an
      attribution its own producers and both its reviews measured to be wrong.
    both_readings_left_visible_for_a_successor:
      reading_A_the_frozen_text: >-
        "AM-16(a) itself needs replacing." Its defensible basis is that AM-16(a) is the
        clause the batch was convened to validate, that under the lead's reduction-free
        reading of route RD it does carry one independent miss (rawtail at L4 beta 95), and
        that a criterion which degenerates to VAR-F alone for every beta-free candidate is
        arguably defective AS A SCALE.
      reading_B_the_measurement: >-
        AM-16(a)'s statistic decided none of the failing cells; PREREG-1 3.2 and 3.3, both
        frozen in THIS batch and neither part of AM-16(a), decided all of them; and with the
        float representation of the determinant removed and nothing else changed (route
        R6_exact), G-VAR2 REFUSES `rdet` at 38/38 and F0's declared target for `rdet` IS MET.
      why_B_is_adopted: >-
        Reading B is the one the measurements support, it was reached independently by the
        producer (objections I.1 and I.2), by the Validator (CC-6, CC-8, F-7) and by the Red
        Team (O-2, O-3), and it is the reading that determines what a successor should
        repair. A decision that inherited reading A verbatim would license a seventh
        scaled-dispersion statistic to repair a clause that decided nothing while leaving the
        deciding clause in place. BOTH READINGS ARE RECORDED SO A SUCCESSOR CAN RE-DECIDE
        AGAINST THE NUMBERS RATHER THAN AGAINST THIS PARAGRAPH -- which is the same
        discipline PREREG-1 3.2 itself applied to its own degenerate-scale rule.
    what_this_does_not_license: >-
      NOTHING BEYOND THE ABOVE. It does not make an admissibility claim about `rdet`, about
      `X_gso_k`, about V_evade or about any other observable in either direction; it does not
      make F1 informative; it does not close the admissibility-gate lane; and it does not
      bear on any lattice. PREREG-1 3.5 stands: passing G-VAR2 carries no claim that an
      observable carries lattice information, and neither does failing it.

  # ==================================================================
  # 4. THE C-1 RULING
  # ==================================================================
  c1_ruling:
    what_was_asked: >-
      DEC-20260812-7c4a1e conflict C-1: two validators re-derived the same quantity from the
      same immutable file and reported incompatible counts of G-REL2 cells below 6x --
      fifteen of nineteen (wave 1) against two of twenty-nine entries (wave 2). Rider (i)
      was pre-registered as the resolving tabulation and PREREG-1 8.1 made the ruling mine.
    P_C1_is_evaluated_and_HOLDS: >-
      The frozen prediction was "at least one declared reading reproduces exactly one of the
      two conflicting counts", falsifier "no reading reproduces either". THE FALSIFIER DID
      NOT FIRE: wave 1's "15 of the 19 G-REL2 cells below 6x" reproduces exactly under the
      maxfloor normalization with the 1e-12 boundary rule, identically under ALL THREE
      declared readings, with 13 entries at 5.7143x within 1e-12, one at 4.9656x and minimum
      4.8663x. P-C1 HOLDS. Rider (i) correctly declined to evaluate its own prediction and
      the Validator correctly declined too; the evaluation is a Coordinator act and this is it.
    what_is_now_established_and_is_citable:
    - >-
      THE READING AXIS CANNOT EXPLAIN THE CONTRADICTION, AND IT IS CLOSED BY ALGEBRA. At
      every one of the 29 entries, under BOTH committed normalizations, the 8 per-basis
      values collapse to exactly ONE distinct IEEE-754 double, so the three declared readings
      -- legacy i = 0, count of passing bases, and the mean over 8 -- return the same double
      BITWISE. THIS IS TWO-SESSION REPLICATED AND STRENGTHENED: the Validator re-derived it
      from the sha-pinned source with standard-library code that never read the rider's
      script or output (58 checks, zero entries with more than one distinct value, zero
      entries where the readings disagree), and the Red Team tested SEVEN reductions rather
      than three -- i0, n-pass, fsum mean, min, max, median and i7 -- all agreeing bitwise.
      The two waves DID NOT differ because they read the 8 bases differently.
    - >-
      THE CITABLE RANGE 4.87x TO 31.03x IS RE-CONFIRMED over all 29 entries under maxfloor,
      identical under all three readings, min 0.48662563425450145 at G-REL2 L1/L2 beta 15 and
      max 3.1034798102965655 at G-REL1 L4, by THREE independent implementations on one pinned
      file. "A FACTOR OF 6 TO 31" REMAINS FALSE AND UNCITABLE. Any future quotation of a span
      must name its normalization: the same 29 entries span 5.71x to 37.50x under absX.
    - >-
      ZERO of the 10 G-REL1 entries fall below 6x under any reading, normalization or boundary
      rule, so the 19-denominator and the 29-denominator agree there by construction.
    the_ruling_on_the_two_counts: >-
      NEITHER SUB-6x COUNT BECOMES CITABLE. THE CITATION BLOCK OF C-1 STANDS UNCHANGED, and
      what has changed is that its REASON is now measured rather than unknown. A count of
      "entries below 6x" is a joint function of FOUR axes -- reading, normalization, boundary
      rule at 0.6, and the threshold value itself -- of which the tabulation closes exactly
      ONE. RIDER (i)'s ACCOUNT OF WAVE 2's COUNT IS NOT UNIQUE, and that is the fact that
      decides this ruling: rider (i) keeps the normalization and moves the threshold to
      5.71x, which wave 2 never stated, while Red Team O-5 supplies a fourth account that
      KEEPS WAVE 2's OWN STATED 6x THRESHOLD and removes the normalization -- the unnormalized
      criterion value |X_a - X_b|, formed from the same committed fields, is below
      6*tau_rel = 0.6 at EXACTLY 2 of 29 entries and EXACTLY 2 of the 19 G-REL2 cells, under
      BOTH boundary rules, naming precisely the same two entries (0.486626 at G-REL2 L1/L2
      beta 15 and 0.496557 at G-REL2 L4/L5 beta 20). Two mutually incompatible accounts
      reproduce the same count and name the same entries; NEITHER TABULATION CAN SEE WHAT A
      VALIDATOR ACTUALLY DID, and both say so. A ruling resting on rider (i)'s uniqueness
      would rest on something the numbers do not support. A FURTHER FRAGILITY, MEASURED AND
      RECORDED: a naive left-to-right sum moves the mean-over-8 by one ulp at 25 of 58
      entry-field pairs, and at the 5.71x threshold under the strict boundary rule the
      naive-mean reading gives 12 (maxfloor) and 11 (absX) where i0 and fsum give 2 and 0,
      because the 4/7 plateau sits exactly on that boundary -- so even the reading axis
      re-opens once the SUMMATION ALGORITHM is treated as free.
    consequences_binding_on_every_successor:
    - 'NEITHER "15 of the 19 G-REL2 cells fall below 6x" NOR "two of 29 entries fall below
      6x" IS CITABLE. Both remain on the non-citable list of this goal.'
    - '"WAVE 2''s COUNT CORRESPONDS TO A 5.71x THRESHOLD" IS NOT CITABLE AS THE EXPLANATION.
      It is ONE of at least two accounts that reproduce the count and name the same entries.
      Rider (i) did not claim more than this, and neither review did.'
    - 'ANY FUTURE SUB-THRESHOLD COUNT IN THIS GOAL MUST NAME ALL FOUR AXES IN THE SAME
      SENTENCE -- reading, normalization, boundary rule, and threshold -- and must state its
      summation algorithm when a plateau sits on the boundary. A count that names fewer is
      under-determined and is not citable.'
    - 'NEITHER VALIDATOR IS DECLARED WRONG BEYOND THE COUNT AS WRITTEN, AND NEITHER RECORD IS
      EDITED. EV-MLKEM-9346bb, DEC-20260809-afe29b, EV-MLKEM-e45478, DEC-20260812-15d3b2,
      KN-FIND-2a35aa and the current goal checkpoint all stand unedited and are narrowed BY
      REFERENCE, exactly as wave 1 narrowed KN-FIND-f38a89 and as DEC-20260812-7c4a1e
      narrowed both.'
    what_would_settle_it_and_it_is_not_dispatched: >-
      Extending the tabulation to the UNNORMALIZED criterion value and to the summation
      algorithm as declared axes (Red Team RC-5, parts A3 and D, cost 0.1 s) would enumerate
      the accounts; it would still not establish which one a validator used, because that is
      not recoverable from a committed results file. I DO NOT DISPATCH IT: it cannot lift the
      citation block, and this decision carries exactly one next action. The block costs a
      clause per citation; lifting it wrongly would put an under-determined count into the
      corpus.

  # ==================================================================
  # 5. THE OTHER RULINGS THE REVIEWS RECORDED AS OWED
  # ==================================================================
  rulings_owed_and_made:
    R1_rider_ii_under_prereg_1_7_3:
      question: >-
        Rider (ii)'s G-VAR2 half is scored on an instrument the lead records as FAILING its
        own F0 fixture, and PREREG-1 7.3 says behaviour elsewhere is then uninterpretable.
        Does that invalidate its P-FR1 verdict, its G-REL1 half, both, or neither? The
        Validator flagged the ruling as owed rather than making it, correctly.
      ruling: >-
        NEITHER HALF IS INVALIDATED, AND THE TWO DO NOT CARRY EQUAL WEIGHT.
        (a) THE G-REL1 HALF IS UNAFFECTED AND IS CITABLE. It does not go through G-VAR2 at
        all: it goes through the committed G-REL1 clause of measure_relvar.py and is decided
        by an EXACT ALGEBRAIC ZERO, `X_gso_k` taking no beta argument so rho = 0 identically.
        The Validator re-derived it independently -- max rho over 10 lattices x 8 bases =
        0.0 exactly, 0 of 80 passing bases at tau_rel = 0.10. An exact algebraic zero cannot
        be invalidated by a defect in a different instrument and 7.3 does not reach it.
        (b) THE G-VAR2 HALF IS A VALID MEASUREMENT OF WHAT A FAILING INSTRUMENT DID AND IS
        NOT CITABLE AS EVIDENCE ABOUT THE WORLD. PREREG-1 7.3 suspends its interpretive
        weight, and two further facts make the suspension right on the merits rather than
        merely procedural: its VAR-F PASS is obtained through the SAME scale-free bit-identity
        test that a 4.18e-11 float wobble passes (9.33 orders apart, same verdict, at the same
        cell on the same fibre family), and Red Team O-8 measures that it does NOT survive the
        repair the rider's own F.1 names -- a relative-dispersion fallback at the same tau_var
        would refuse `X_gso_k` at 15 of the 38 cells.
        (c) CONSEQUENCE FOR C-2(b), STATED EXACTLY. The gate's refusal side moves from
        "UNTESTED IN EITHER DIRECTION" to "ONE CONSTRUCTED INSTANCE OF A FALSE REFUSAL, n = 1,
        ON THE G-REL1 CLAUSE" -- and NO FURTHER. NO FALSE-REFUSAL RATE IS MEASURED, REPORTED,
        ESTIMATED OR IMPLIED, and none may be derived from this batch: a rate needs a
        population and a sampling scheme and this batch has neither. Both reviews verified
        that no rate appears anywhere in the rider's artifacts.
        (d) The rider's SECTION B informativeness measurement is made OUTSIDE the instrument
        and is untouched by 7.3; it shows A-DEPENDENCE on the tested families and lattices and
        NOT lattice information, which the rider states itself in F.5.
    R2_rider_iii_framing_and_coverage:
      ruling: >-
        THE MANDATORY FRAMING WAS HONOURED AND IS ADOPTED. P-L1 HOLDS at 96 of 96 bitwise with
        max absolute deviation 0.0. IT RESTORES THE COVERAGE WAVE 2 LOST AND RESOLVES NO
        DOUBT, THERE BEING NONE TO RESOLVE: fpylll's absence in both wave-2 sessions was
        INFRASTRUCTURE SIGNAL and was never evidence against lam1n, hkz, the 48 reductions or
        their reported max hkz_violation of 0.0. IT REFUSED A CROSS-PLATFORM CLAIM IT COULD
        HAVE MADE, and the Validator recomputed ENVIRONMENTS_DIFFER = FALSE field by field (11
        fields, 11 identical, 0 differing) and rules the refusal WARRANTED MORE STRONGLY THAN
        THE RIDER ITSELF CLAIMED, since bit-identity on an identical stack is exactly what an
        identical stack predicts. PREREG-1 11.1 STANDS: the "genuinely cross-platform" reading
        is NOT CITABLE and the citable form is a PORTABILITY result across three textually
        distinct implementations with fpylll pinned at 0.6.4; what this run adds is the THIRD
        TEXTUALLY DISTINCT IMPLEMENTATION, NOT A SECOND PLATFORM. Red Team O-11 is adopted as a
        refinement: the honest boolean is RECORDED_FIELDS_DIFFER = False, the vendored
        libfplll 5.5.0 versus the producer's unrecorded fplll version being an UNKNOWN that
        cuts in the conservative direction. THE COVERAGE STILL MISSING IS RECORDED RATHER THAN
        ROUNDED AWAY: L1/L2, L4/L5 and L9-L12 have NO re-implementation of the reduction, and
        above d = 40 ROUTE RD DOES NOT EXIST at all.
    R3_budget_accounting_F_4:
      ruling: >-
        I ADOPT THE VALIDATOR'S RULING AND NOT THE PRODUCER'S FRAMING. Rider (i) executed
        THREE COMPLETED MEASUREMENT INVOCATIONS against a declared maximum_runs of 1, and the
        budget was exceeded in the count-of-runs sense. n=1 (never started) and n=2 (crashed)
        are properly excluded; n=3 and n=4 are NOT non-measurement invocations, both having
        run the tabulation to completion and produced numbers. IT IS A BUDGET-ACCOUNTING ITEM
        AND NOT AN EVIDENCE-INTEGRITY FAILURE, AND IT DOES NOT AFFECT ADMISSIBILITY: the
        computation is deterministic on a sha-pinned file so no re-roll could search for a
        favourable number; n=3's defect was a PRECISION defect whose fix (math.fsum) makes the
        mean agree BITWISE with the committed mean, verified independently at all 29 entries
        under both normalizations; n=4 differs from n=5 only by printing the boundary constant;
        and the Validator re-derived every reported number from the pinned source without using
        the rider's code at all. NO SELECTION COULD HAVE OCCURRED AND NONE DID. THE PRODUCER
        DISCLOSED IT ITSELF, in its report section 9 item 6 and in its manifest's
        budget_accounting_flag, which is the conduct the rule exists to produce. The other
        three producers are ruled RESPECTED. Prospective fix: AM-18(f).
    R4_the_must_pass_guard_O_6_and_O_7:
      ruling: >-
        P-G1 PASSED AND REMAINS A PASS; a must-pass guard is meant to pass and this retires
        nothing. WHAT IS BOUNDED IS THE CITABLE CONTENT. "The guard crossed, so VAR-S is alive
        at this scale" MAY NOT BE CITED AS A LIVE CONTROL: R2-OUT-V was UNREACHABLE BY A FACTOR
        OF 71.3 before the run, the smallest D_c at lambda = 1 over the ten lattices being
        7.1316e-02 against tau_var = 1e-3, so the row PREREG-1 6.1 calls "live and not a straw
        man" could have fired only at tau_var >= 7.13e-2. ITS NON-FIRING IS THEREFORE NOT
        EVIDENCE. The informative content of section 6.1 is lambda*, which IS a measurement --
        and the reported grid lambda* in {1e-2, 1e-1} is citable ONLY AS AN UPPER BOUND, the
        continuous crossing being 3.1102e-03 to 1.4153e-02 (median 6.5960e-03, sd 3.3672e-03
        over four independent A draws x ten lattices), with the eleven cells reported at 1e-1
        actually crossing at about 1.4e-2. The grid-level statistic itself replicates across the
        four draws at {1e-2: 30, 1e-1: 10}. Prospective fix: AM-18(d).
    R5_the_argument_set_gap_F_2_and_O_1:
      ruling: >-
        A GUARD THAT DOES NOT GUARD, IN THE FROZEN TEXT AND NOT IN ANY PRODUCER, AND IT CHANGES
        NO OUTCOME ROW OF THIS BATCH. Both reviews found it independently and both measured
        that V_evade -- the only such candidate the batch actually scores -- does not flip,
        VAR-S refusing it at 38/38 either way. The measured flip of X_lambda at lambda >= 1e-2
        under a repaired fibre is POST-HOC, was computed under a rule the producer did not
        freeze, and IS NOT CITABLE AS A RESULT OF THIS BATCH; that label is the Red Team's and
        the Validator's own and is adopted. It binds the moment any candidate whose declared
        nuisance set contains a non-determinant argument reaches VAR-S ADMIT or
        scale_degenerate. Prospective fix: AM-18(c).
    R6_provenance_non_uniformity_F_5:
      ruling: >-
        NOT A POLICY VIOLATION BY ANY PRODUCER AND NOT A FALLBACK. The adapter recorded nothing
        because the sessions were launched without the resolved environment, so
        `resolved_model_id` is legitimately null, `fallback_used` is false because no
        substitution was requested or accepted, and rider (ii)'s disclosure -- the only one of
        the four to record its adapter binding beside the model that answered -- is exemplary
        and was reproduced independently by the Validator. THE DEFECT IS THE NON-UNIFORMITY and
        the remedy is a manifest field, not a finding against a producer. Prospective fix:
        AM-18(f). NO ADAPTER PROBE RECEIPT EXISTS FOR ANY SESSION IN THIS BATCH, which is why
        every record carries `model_verified: false`, and that is recorded as a verification
        gap and never as satisfied.

  # ==================================================================
  # 6. AMENDMENT AM-18
  # ==================================================================
  amendments:
    scope_note: >-
      AM-10 through AM-14 (DEC-20260808-05b684), AM-15 and AM-16 (DEC-20260809-afe29b) and
      AM-17 (DEC-20260812-7c4a1e) ARE IN FORCE AND ARE NOT RE-LITIGATED. AM-16 IS NOT
      WITHDRAWN: its (a) through (g) stand. What follows is ONE new amendment, and its first
      clause is a STOPPING CONDITION rather than a repair.
    AM-18:
      title: >-
        Before any further dispersion criterion is specified in this goal, "non-constant on
        the fibre" must be a numbered assumption with a falsification condition at finite
        precision.
      requirement: >-
        (a) THE STOPPING CONDITION. NO FURTHER DISPERSION CRITERION MAY BE SPECIFIED IN THIS
        GOAL until the successor pre-registration states, AS A NUMBERED ASSUMPTION WITH AN
        EXPLICIT FALSIFICATION CONDITION, what "non-constant on the fibre" means at finite
        precision. The implicit assumption in force until now -- "non-constant on the fibre in
        IEEE-754 float64 == non-constant on the fibre" -- is measured FALSE here at 38 of 38
        cells for `rdet` under three of six routes. PREREG-1 7.2's FORBIDS list bars a seventh
        consecutive gate repair and 7.3's does not, and 7.3 is the branch that fired; this
        clause supplies the missing bar in the narrowest form that does not prejudge the
        science. IT IS A SPECIFICATION REQUIREMENT AND NOT A LANE CLOSURE. IT RETIRES NOTHING,
        CLOSES NOTHING, AND FORBIDS NO DIRECTION OF INQUIRY.
        (b) PRECISION AS A DECLARED AXIS. Any VAR-F-like constancy or non-constancy clause
        must be evaluated at TWO WORKING PRECISIONS and must report the ratio. A clause whose
        verdict changes with precision is reading a REPRESENTATION rather than an observable,
        and must be reported as such. For any determinant-only candidate, an EXACT-ARITHMETIC
        route must be among the declared routes, since one exists, costs 0.4 s at this scale
        and is already built and archived (route R6_exact).
        (c) THE FIBRE FAMILY IS PER CANDIDATE, AND THE GUARD RANGES OVER THE WHOLE DECLARED
        NUISANCE SET. A fibre family must be constructed per candidate from that candidate's
        OWN declared nuisance set -- which is what PREREG-1 3.3 quantifies and what its
        implementation did not do -- and the could-not-PASS guard must assert and PRINT, per
        candidate and per fibre family, WHICH DECLARED ARGUMENTS WERE VERIFIED CONSTANT across
        the basis index, not |det B| alone.
        (d) A MUST-PASS GUARD MUST PUBLISH ITS OWN REACHABILITY BEFORE THE RUN: the largest
        value of its statistic reachable at the top of its frozen grid, against its threshold,
        stated in the pre-registration. A guard whose VOID row is unreachable by construction
        may still be run, and its binary pass may NOT then be cited as a control. A graded
        guard's grid crossing amplitude is reported as an UPPER BOUND unless the crossing is
        solved continuously or sampled off-grid.
        (e) A NULL-OBJECT CALIBRATION AT DECLARED AMPLITUDES accompanies any future admission
        reported by any gate in this goal: an object that reads every entry of the instance and
        carries no lattice information whatever, scored through the identical code path at a
        declared amplitude grid, so that the distance between "depends on the presentation bits
        at relative amplitude >= tau" and "carries lattice information" is measured rather than
        assumed. One is already built and archived (X_hash), and it is n = 1.
        (f) RUN ACCOUNTING AND INFERENCE PROVENANCE. "Run" means ANY INVOCATION THAT EXECUTES
        THE DECLARED MEASUREMENT TO COMPLETION; a producer may not classify a completed
        measurement invocation as a non-measurement invocation, and a superseded completed run
        is enumerated against the budget with its reason. Every producer manifest records the
        ADAPTER BINDING FOR ITS ROLE beside the model that actually answered, as exactly one of
        four producers did here.
      grounds: >-
        Red Team O-2, O-3, O-6, O-7, O-8 and required_controls RC-1 through RC-6; Validator
        F-2, F-4, F-5, CC-6, CC-8, CC-10, CC-11 and HV-4; the lead producer's own objections
        I.1 and I.2; rider (ii)'s F.1.
      prospective_only: >-
        AM-18 BINDS SUCCESSOR PRE-REGISTRATIONS. It is applied to BATCH-4ed139 only as the
        citation rulings stated above, NEVER as a finding of non-compliance against a producer
        that implemented a frozen clause exactly as written -- which all four did, and both
        reviews verified that they did.
      consequence_for_the_record: >-
        THE G-VAR2 OPERATIONALIZATION AS FROZEN BY PREREG-1 SECTION 3 DOES NOT GOVERN ANYTHING
        IN THIS GOAL, C3 MAY NOT PROCEED BEHIND IT, AND NO ADMISSIBILITY CLAIM IS REPORTABLE
        FROM IT IN EITHER DIRECTION -- which is where AM-16's own consequence_for_the_record
        already stood and is not a new closure. The admissibility-gate LANE IS NOT CLOSED, and
        this decision closes nothing.

  # ==================================================================
  # 7. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DID EXACTLY WHAT A PRE-REGISTERED INSTRUMENT BATCH IS FOR, AND THE ANSWER IS
    NEGATIVE. The three-way termination clause was frozen and notarized before any measurement
    existed, in a commit containing zero producer artifacts and verified in both directions by
    four sessions; the branch that fired is the branch the frozen text fires; and the producers
    reported it against the interest of the criterion they had just built. A seventh
    consecutive gate would have been reachable by narrating this differently, and it was not
    narrated differently by anyone.
  - >-
    THE HARD CALL IS THE MEANS CLAUSE AND IT IS MADE ON THE MEASUREMENT. AM-16(a)'s statistic
    decided none of the failing cells, and both reviews established that independently from the
    committed record. Writing this decision's MEANS clause about AM-16(a) because the frozen
    text says so would repair a clause that decided nothing and leave the deciding clause in
    place -- which is the failure mode symmetric with premature closure, in its other direction.
    THE BRANCH, ITS LICENCE AND ITS FORBIDS LIST ARE ADOPTED UNAMENDED; only the causal
    attribution is superseded, by reference, with both readings visible, and the frozen text is
    not edited.
  - >-
    THE CONVERGENCE IS WHAT MAKES THIS ACTIONABLE RATHER THAN SUGGESTIVE. Three findings were
    reached independently and agree: the failure is a FLOAT-REPRESENTATION effect that tracks
    machine epsilon over seven to nine orders and vanishes exactly under exact-integer
    arithmetic, where F0's target for `rdet` is MET; the defect belongs to the CLAUSE rather
    than to `rdet`, shown by a blind null the producer never scored; and the declared argument
    set is decorative in the implementation, found by both reviewers separately. The Red Team
    additionally ran the two cheapest falsifiers of its own thesis -- the ULP analysis showing
    the effect is FORCED rather than accidental, and a BLAS thread-cap control leaving every
    bit_identical flag unchanged -- so the F0 failure is robust and is not a fluke of one
    machine.
  - >-
    THE ADVERSE ITEMS ARE CARRIED RATHER THAN BURIED, AND ONE OF THEM IS A PRODUCER CLAIM
    CONTRADICTED BY THAT PRODUCER'S OWN COMMITTED DATA. Validator F-1 is exactly the kind of
    claim that survives when a reader trusts the narrative and does not open the JSON, and it
    is recorded at full weight even though nothing depends on it. So are F-4's run-count
    overrun (ruled, and ruled against the producer's framing), F-5's provenance
    non-uniformity, F-6's non-portable R5 magnitudes, O-6's unreachable VOID row and O-3's
    missing bar. A batch whose reviews found seven items and eleven objections and whose
    headline survives all of them is in better condition than one whose reviews found none.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER IT. It buys
    no admissibility claim in either direction, no statement about any lattice, no lane
    closure, no rescoring of any prior batch, no retirement of AM-3, and nothing whatever about
    ML-KEM, any FIPS 203 parameter set, any attack cost or any cost model. Six consecutive
    instrument batches is a real cost and is recorded as one in the next action's ranking.

