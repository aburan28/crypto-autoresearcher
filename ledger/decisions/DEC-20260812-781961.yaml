  # ==================================================================
  # 10. LIMITATIONS
  # ==================================================================
  limitations:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. Scope: q = 3329; d in {20, 30, 40, 100, 140}; the frozen k
    and beta grids; 8 bases per lattice per family; four declared families plus three fibre seed
    prefixes; six declared arithmetic routes for determinant-only candidates and two otherwise;
    numpy 2.4.6 float64 on one 4-core Linux host, with float32 and 60-digit decimal used only in
    a reviewer's precision control; no reduction beyond the frozen HKZ pipeline and none above
    d = 40. EVERY CONCLUSION IS SCOPED TO EXACTLY THAT AND TRANSPORTS NOWHERE.
  - >-
    INDEPENDENCE IS PROCEDURAL, NEVER MODEL-LEVEL, AND ALSO NOT ENVIRONMENTAL. AGENTS.md RULE 12
    IS UNMET AND UNWAIVED IN THIS GOAL AND IS NOT WAIVED HERE. Two reviews are TWO SESSIONS ON
    ONE MODEL AND ONE HOST -- not two models and not two platforms -- and this decision does not
    present them as model-level or environmental corroboration anywhere. Every producer and both
    reviewers record `model_verified: false` with its reason and no adapter probe receipt exists
    for any session in this batch. Two knowledge promotions remain owed from GOAL-MLKEM-003 and
    cannot be executed without a second backend.
  - >-
    I RAN NO SHELL. No git command, no producer code, no probe, no verifier, no allocate_id, no
    ledger validator. I resolved nothing by measurement and say so at each place.
  - >-
    THE F0 FAILURE IS A STATEMENT ABOUT FLOATING-POINT EVALUATION AND ITS GENERALITY IS BOUNDED
    BY THAT. On an exact-arithmetic or uniformly-rounded stack the F0 refusal half would pass,
    which route R6_exact demonstrates directly. That is a real caveat on the finding and it is
    recorded here, in the evidence record and in the promoted knowledge entry rather than left
    for a reader to notice.
  - >-
    ONE REVIEW PASS OF THIS KIND HAS SUBSTANTIALLY LESS THAN FULL RECALL (RI-3 of
    DEC-20260812-7c4a1e). A passed validation is evidence that the checks that ran passed, NOT
    evidence that no defect exists, and the Validator says so about itself. Findings F-1, F-2,
    F-3 and F-6 and objections O-5 through O-8 are each SINGLE-SOURCE and neither list should be
    assumed complete.
  - >-
    THE REDUCTION-DEPENDENT QUANTITIES REMAIN THINLY COVERED. Rider (iii) adds ONE independent
    re-implementation on the L7/L8 arm only; L1/L2, L4/L5 and L9-L12 have none, route RD does not
