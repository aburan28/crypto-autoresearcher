coordinator_decision:
  id: DEC-20260810-ba50dc
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  recorded_by_task: TASK-20260810-095c67
  decision: approve
  decision_scope: >-
    OPENS THE FIRST BATCH OF GOAL-AES-002 AND APPROVES ITS RANKED SHAPE. NOTHING
    MORE. This decision reviews no evidence, creates no hypothesis, approves no
    cryptanalytic measurement, and asserts nothing about AES at any round count.
    It does not touch GOAL-AES-001, GOAL-AES-003 or any record produced under
    RQ-AES-001 or RQ-AES-003.

  context: >-
    GOAL-AES-002 has been `active` since 2026-08-01 and has never opened a batch;
    its head carries current_batch_id null, dispatch_queue_path null,
    latest_verified_commit null, charged_to_date 0, and a single next_action
    instructing this Coordinator to draft, commit and dispatch its first queue in
    an exactly specified ranked shape. Nine days of that goal's life produced no
    dispatched task. This act opens BATCH-2b0fd1 in that ranked shape, against
    the campaign's 22500 s / three-batch ceiling, under the amendment-005 Part B
    clock convention that the goal record adopts by explicit reference, and it
    binds the goal head to the new batch and queue path with exactly one
    concrete next action.

  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-2b0fd1
    - TASK-20260810-095c67
    - TASK-20260810-c1cfd5
    - TASK-20260810-4a478d
    - TASK-20260810-f7bc82
    - TASK-20260810-d8835b
    - TASK-20260810-2a0a37
    - TASK-20260810-1a81be
    - TASK-20260810-1166f2
    - TASK-20260810-9fc65d
    - TASK-20260810-9f661a

  target_ids_note: >-
    EV-AES-abf3dc and DEC-20260810-6c00b4 are DELIBERATELY ABSENT from
    target_ids. Both identifiers are allocated and verified free, and both are
    named throughout this decision and on the TASK-20260810-9f661a card as the
    records that batch's ledger archive will write. Neither record EXISTS yet,
    and target_ids is a reference to committed records: listing an unwritten
    record there is a dangling reference that tools/validate_ledger.py rejects,
    and rightly so. They are reserved, not targeted.

  what_is_approved:
    - >-
      RANK 1, first in time because it gates everything else and costs no producer
      slot: TASK-20260810-4a478d authors the frozen cost model CM-1 fixing all six
      elements (a)-(f) of RQ-AES-002 claim_tier_ceiling R2 for AES-128/192/256;
      protocol-amendment-GOAL-AES-002-001 resolving BLK-1 by extending the
      certificate vocabulary with a `key_recovery` kind together with the exact
      `check_run` change; and the adoption record binding the amendment-005 Part B
      clock convention and the amendment-004/005 provenance gate from this batch.
      All three are committed by TASK-20260810-f7bc82 BEFORE any producer runs.
    - >-
      RANK 2: TASK-20260810-d8835b, object-first ideation on FULL-ROUND AES under
      docs/inventor-protocol.md section 1, with the established families declared
      off-limits as the primary lens, the lossy-projection test applied to every
      candidate before any compute is requested, three-axis scoring with the full
      round count as the survival target, and a section-5 honest-accounting block
      whose `dominated_by` is the unresolvable-in-this-environment string and
      never null.
    - >-
      RANK 3: TASK-20260810-2a0a37, the measured toolchain-and-throughput envelope
      receipt, resolving BY MEASUREMENT the named contradiction between two
      committed records about the C toolchain and producing the per-task and
      per-campaign ceiling in AES evaluations that every later throughput-dependent
      budget must wait for.
    - >-
      The standard chain: three isolated snapshot archives, an independent
      red-team pass whose primary target is CM-1 itself, an independent validation
      pass, and exactly one isolated ledger archive carrying EV-AES-abf3dc and the
      batch decision DEC-20260810-6c00b4.

  # ===================================================================
  # THE SCOPED CORRECTION THIS DECISION EXISTS TO RECORD.
  # ===================================================================
  scoped_correction_to_the_goal_head_planning_text:
    id: CORR-BATCH-2b0fd1-EVIDENCE-ID
    what_the_goal_head_says_verbatim_in_substance: >-
      GOAL-AES-002 next_action directs, as the last step of the batch it
      specifies, "an isolated ledger archive carrying EV-AES-005 and the batch
      decision, pushed with the PR refreshed."
    why_that_identifier_cannot_be_used: >-
      IT IS ALREADY TAKEN, AND BY ANOTHER LANE. ledger/evidence/EV-AES-005.yaml
      exists as a committed record and binds `hypothesis_id: RQ-AES-003` — the
      GOAL-AES-003 lane — with its own task list (TASK-20260802-902 through
      TASK-20260802-908), its own strength (`replicated`), its own claim tier
      (`toy`) and its own certificate references. Under AGENTS.md rule 14 record
      identifiers are immutable and are NEVER reused, and under rule 15 an
      identifier remap is a last resort rather than a repair. Writing this
      batch's evidence to that path would either overwrite an immutable record or
      create two records with one identifier; both are worse than any drafting
      inconvenience.
    resolution: >-
      THIS BATCH'S EVIDENCE RECORD IS EV-AES-abf3dc, allocated and verified free,
      and it is named as such in the BATCH-2b0fd1 queue, in the
      TASK-20260810-9f661a handoff and card, and in that task's
      archive.record_ids. The goal head's planning string is corrected here, in a
      new record, and the head's next_action is replaced by this act with one
      that names EV-AES-abf3dc.
    what_this_correction_does_not_do: >-
      STATED EXPLICITLY BECAUSE THE FAILURE MODE IS CROSS-LANE CONTAMINATION.
      EV-AES-005 IS NOT EDITED, NOT SUPERSEDED, NOT RE-SCORED, NOT REINTERPRETED
      AND NOT CITED AS EVIDENCE HERE. NO GOAL-AES-003 RECORD IS ALTERED,
      RE-SCORED OR REINTERPRETED BY THIS DECISION — not GOAL-AES-003 itself, not
      RQ-AES-003, not any evidence, decision, run or knowledge record produced
      under them. Nothing about that lane's strength, tier, scope or standing
      changes. The only thing this correction touches is a planning STRING in the
      GOAL-AES-002 head that named an occupied identifier.

  further_observations_recorded_rather_than_acted_on:
    - id: CORR-BATCH-2b0fd1-BATCH-ID-FORM
      observation: >-
        The goal head names the batch "BATCH-001". AGENTS.md rule 14 forbids any
        NEW record using the legacy three-digit form, and a directory
        coordination/goals/GOAL-AES-002/batches/BATCH-001/ already exists
        carrying undispatched 2026-08-01 artifacts. This batch is therefore
        BATCH-2b0fd1, minted under the current convention. The existing BATCH-001
        directory is not renamed, not reused and not touched.
    - id: OBS-BATCH-2b0fd1-PRIOR-WORKING-TREE-ARTIFACTS
      observation: >-
        MATERIAL, AND NAMED RATHER THAN DISCOVERED MID-TASK. The directory
        coordination/goals/GOAL-AES-002/ already contains artifacts dated
        2026-08-01 produced OUTSIDE any dispatched queue: two ideation passes
        (batches/BATCH-001/tasks/ideation and /ideation2), a gates directory, a
        red-team report under redteam/, and four receipts at the goal root
        including throughput_receipt.json (id MEAS-GOAL-AES-002-001) and
        throughput_bench.c. No queue, card, handoff, budget, archive receipt,
        evidence record or decision binds any of them, and their own text says so
        — the first ideation report states it "is NOT bound into the ledger and
        changes no official state", and the red-team report records that it
        reviewed working-tree artifacts and that "nothing here is durable
        evidence and nothing here is a ledger record".
      how_this_batch_treats_them: >-
        AS INPUTS, NOT EVIDENCE, AND NOT ADOPTED. RANK 2 and RANK 3 read them,
        deduplicate against them and cite them by path with that status attached.
        Neither may re-present their content as new work. RANK 3 additionally
        re-measures the throughput independently and states agreement or
        disagreement with MEAS-GOAL-AES-002-001 field by field rather than
        copying it. Nothing in them may be transcribed as tried, screened or
        negative on this goal's behalf, and no object they name is recorded as
        closed on their authority. This batch neither validates nor invalidates
        them, deletes nothing, edits nothing, and leaves open the route by which
        a later batch could promote any of them through a proper dispatched
        producer task.
    - id: OBS-BATCH-2b0fd1-DEC-20260731-031-COLLISION
      observation: >-
        NOTHING IS REMAPPED AND NO REPAIR IS ATTEMPTED. GOAL-AES-002 and
        GOAL-AES-003 both cite "DEC-20260731-031" for AES-lane rulings — its
        "ruling 3", "ruling 6(iii)" and "ruling 8", and as the decision that
        opened RQ-AES-002. The file at ledger/decisions/DEC-20260731-031.yaml
        binds goal_id GOAL-ECDLP-001 and batch_id BATCH-026 and contains no such
        rulings. This is the known legacy three-digit collision across lanes. The
        only consequence taken here: NO record written by this act cites
        DEC-20260731-031 as this batch's authority. Authority is taken directly
        from the committed GOAL-AES-002 and RQ-AES-002 records, which are
        unambiguous. Nothing is renamed, edited, superseded or reinterpreted, and
        no claim is made about which record the goal heads intended. The one
        place the goal head's RANK 3 text relies on it — "the order-of-magnitude
        figures in DEC-20260731-031 limitations are UNMEASURED SIZINGS" — is
        carried onto the TASK-20260810-2a0a37 card as written, as an instruction
        never to cite those figures as measurements, which is sound whichever
        record the identifier resolves to.

  rationale:
    - >-
      THE GOAL WAS STALLED, AND A STALLED ACTIVE GOAL IS NOT A NEUTRAL STATE. Nine
      days `active` with no batch means its declared work was neither done nor
      honestly closed. Opening the batch in the exact ranked shape the committed
      head specifies is the action that head asks for, and it is taken without
      re-scoping, re-budgeting or re-ranking anything.
    - >-
      RANK 1 IS FIRST IN TIME ON THE MERITS, NOT ONLY BY INSTRUCTION. RQ-AES-002
      makes CM-1 a hard pre-dispatch gate for any cost claim, and BLK-1 makes the
      certificate vocabulary incapable of expressing an AES key recovery. Both are
      Coordinator-authored, both cost no producer slot, and both must be COMMITTED
      before a card is issued that relies on them — a gate uncommitted when the
      card is issued is the retroactive enforcement this program refuses.
    - >-
      RANKS 2 AND 3 ARE DISPATCHED CONCURRENTLY BECAUSE THEY ARE INDEPENDENT AND
      THE BATCH BUDGET SIZES TWO PRODUCERS. The enumeration needs the measured
      envelope only to score its second axis, which it does at write-up time, so
      the two do not serialize.
    - >-
      THE RED TEAM IS POINTED AT CM-1 ITSELF, per the goal head. GOAL-AES-001's
      first red-team pass destroyed that campaign's only cost model. A cost model
      that fails before a margin is computed under it is a cheap result; one that
      fails afterwards invalidates everything charged against it.
    - >-
      THE BUDGET IS THE HEAD'S OWN ITEMISATION AND NOT A NEW SIZING. 8600 s
      exactly, mapped line for line onto the ten tasks, with the single 500 s
      snapshot line split 150/150/200 across three archives and that split
      declared as a declaration rather than presented as a measurement.
    - >-
      NOTHING IN THIS BATCH CAN PRODUCE AN OVERCLAIM ABOUT AES, BY CONSTRUCTION.
      Its claim ceiling is protocol, enumeration and envelope only; the
      enumeration is declared not-a-completion in advance; the receipt is declared
      not-a-completion in advance; and the R5 anti-laundering clause is quoted
      verbatim as a completion gate on every deliverable of every task.
    - >-
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING, and this
      goal's own saturation_stance says the honest prior is that the campaign
      finds no break. That prior is held by procedure here — hard novelty
      screening, the lossy-projection test before compute, a frozen cost model,
      certificates re-verified under two implementations — and not by declining to
      look.

  evidence_refs:
    - ledger/goals/GOAL-AES-002.yaml
    - ledger/questions/RQ-AES-002.yaml
    - ledger/evidence/EV-AES-005.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/batch.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/dispatch_queue.json
    - coordination/goals/GOAL-AES-002/throughput_receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation/candidate_report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation2/candidate_report2.yaml
    - coordination/goals/GOAL-AES-002/redteam/findings.yaml
  evidence_refs_note: >-
    EVERY ENTRY IS CITED FOR WHAT IT IS. The four coordination paths under
    GOAL-AES-002 dated 2026-08-01 are cited as EXISTING WORKING-TREE ARTIFACTS
    produced outside any dispatched queue, never as evidence for any claim.
    EV-AES-005 is cited ONLY to establish that its identifier is occupied and by
    which lane; nothing in its content is relied on and nothing about it is
    changed. No run record, evidence record or knowledge entry supports any
    conclusion here, because this decision draws none.

  hypothesis_status_transition:
    hypothesis_id: null
    changed: false
    reason: >-
      GOAL-AES-002 has no active hypothesis and this act creates none. An
      object-first enumeration is not a hypothesis and does not become one by
      being dispatched.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      Opening a batch is not a status change. `completed` is unreachable for this
      goal under inference-amendment 0137a051 (GOAL-AES-002
      completion_reachability); no completion_quorum block is created and NO
      ATTESTATION IS RECORDED.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal, so all four
      gates of agents/coordinator.md are open and untouched. This decision moves
      none of them and creates no claim that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO EVIDENCE WAS REVIEWED. This is a batch-opening decision, not an
      evidence-review decision: no EV-* record exists for this goal, no producer
      has run, no independent report exists, and no `support` or `reject_scoped`
      determination on `replicated` or `strong` evidence is available. Creating a
      KN-FIND here would promote a plan. The batch's own closing decision
      DEC-20260810-6c00b4 fills this field again on what its two independent
      reports actually support.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It creates no
      hypothesis, promotes no knowledge, satisfies no promotion gate, records no
      attestation, and supports no claim at any tier.
    - >-
      THE BUDGET FIGURES ARE DECLARATIONS BORROWED FROM GOAL-AES-001 ACTUALS, NOT
      MEASUREMENTS OF THIS GOAL, which has none. The goal's own
      what_a_red_team_should_attack_here names this as attack surface (2): the
      snapshot, ledger and coordination lines rest on numbers that were charged at
      declaration and never measured even in the campaign they came from. The
      three-way split of the single 500 s snapshot line is likewise a declaration;
      the only measured snapshot datum in either AES campaign is 378 s, larger
      than any of the three shares, so all three archival declarations are tight
      and may halt on budget.
    - >-
      THE COORDINATOR ACT THAT PERFORMED THIS OPENING IS ITSELF CHARGED AS QUEUE
      TASK TASK-20260810-095c67 at its declared 700 s, per the goal's
      coordination_acts_are_charged_from_batch_001 rule. Its actual duration is
      not instrumented in this repository; under C6 an unmeasured completed task
      is charged at its declaration and never at zero.
    - >-
      NO KNOWLEDGE RETRIEVAL WAS PERFORMED BY THIS ACT. The session had no Bash
      and no retrieval MCP tool. NO absence, novelty, prior-non-testing or
      saturation inference follows (AGENTS.md knowledge retrieval policy). The
      RANK 1 and RANK 2 tasks are required to attempt retrieval themselves and
      record the outcome.
    - >-
      NO GIT OPERATION WAS PERFORMED BY THIS ACT and no commit exists for it yet.
      Every archive block in the queue carries commit_sha null, parent_sha null
      and an empty path_sha256; those are backfilled only after the real commits
      exist. Until TASK-20260810-c1cfd5 commits and pushes, this decision and the
      batch it opens are UNPUBLISHED and are not durable evidence.
    - >-
      THE THREE-BATCH CAMPAIGN MAY BE TOO FEW TO REACH ANY CRYPTANALYSIS AT ALL,
      as the goal's own red-team note (1) says: BATCH-2b0fd1 is largely protocol
      and instrument work. That is intended. If the campaign produces only
      protocol and an enumeration, the correct outcome is `paused` with that
      recorded, not a fourth batch taken on momentum.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE CAMPAIGN-WIDE under
      inference-amendment 0137a051. The validator and red-team tasks in this batch
      supply SESSION independence only; their two verdicts are ONE DRAW FROM A
      CORRELATED PAIR and neither may be recorded as an attestation.
    - >-
      THE max_concurrent OF 3 IS A CAP ACROSS BOTH AES GOALS. If GOAL-AES-001
      BATCH-005 is in flight and admitting this batch's tasks would exceed it,
      this batch WAITS rather than running degraded. That is a real scheduling
      risk to this batch's completion and is recorded as one.

  next_actions:
    - >-
      Dispatch TASK-20260810-4a478d, the RANK 1 protocol act, as the first act of
      BATCH-2b0fd1 — after TASK-20260810-c1cfd5 has committed and pushed this
      opening control plane — then snapshot it under TASK-20260810-f7bc82, then
      dispatch TASK-20260810-d8835b and TASK-20260810-2a0a37 CONCURRENTLY under
      the cross-goal max_concurrent cap of 3.

  decided_by: coordinator
  decided_at: '2026-08-10'
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_verified: null
    model_verification_basis: >-
      No probe was run; this session has no shell. The identifier is reported
      from the session environment and is unverified configuration until a
      doctor probe confirms it.
    fallback_used: false
    degraded_requirements: []
    amazon_bedrock_selected_configured_probed_contacted_or_used: false
