coordinator_decision:
  id: DEC-20260904-973746
  context: >-
    EXP-ECDLP-a1c262 was routed to an independent pre-approval review by ruling 4
    of DEC-20260904-726129 rather than approved off DEC-20260904-3bb7fc's
    recommendation. That review (VAL-20260904-821aee,
    coordination/reviews/approval-a1c262-20260904/validation_report.yaml) returned
    verdict `failed`, bottom line REVISE BEFORE APPROVAL, with fifteen enumerated
    required changes: eight blocking (C1-C8), six named (C9-C14), one minor (C15).
    CORR-20260904-f3aa7a had already discharged the ledger half of C8. This
    decision records the CONTRACT revision to version 2. IT IS NOT AN APPROVAL:
    status stays review_required, approved_by null, frozen false,
    execution_authorized false, and no handoff exists.
  decision: revise
  target_ids:
    - EXP-ECDLP-a1c262
  rationale:
    - >-
      ITEM 1 (blocking, structural) -- THE NULL POINTED AWAY FROM THE COLLISION.
      v1's REF-SHIFT = rho(1.15*u_D) applies its knob upward while the correction
      under test is downward (u_X = 0.9694*u_D at bits 16). rho is strictly
      decreasing, so REF-SHIFT < REF-ASY-D pointwise, and the incumbent already
      under-estimates the exact density at every bits-16 rung; the null's loss was
      therefore entailed, not measured. H-ECDLP-d2aa2c's own observation_collision
      names c < 1 as the colliding family and the contract implemented c = 1.15.
      v2 declares REF-SHIFT-DOWN = rho(c_null*u_D) with c_null = 20/23 = 1/1.15
      exactly, frozen, plus REF-FIT-CEILING, the argmin over c in [0.5, 1.5] of
      worst-rung log disagreement with REF-EXACT, reported with bracket, step and
      achieved width and NEVER selected (an invalidation rule forbids selecting it).
    - >-
      ITEM 2 (blocking, structural) -- THE ARBITRATION STATISTIC SATURATED. For any
      reference below the exact density, |ref-exact|/exact = 1 - ref/exact is
      bounded by 1, so a factor-2 criterion is arithmetically unreachable against
      any comparator whose own disagreement exceeds 0.5. v2 makes
      L = |ln(ref/exact)| THE statistic, W = max over arbitrated rungs, and states
      every criterion on L; the relative form is reported in every row with the
      conversion rel = 1 - exp(-L) (ref below) / exp(L) - 1 (ref above) so nothing
      is lost. Worked on the review's own priors, the same two references give
      0.9947/0.8501 = 1.170 on the relative form (fails a factor-2 test) and
      5.2494/1.8980 = 2.766 on the log form (passes it) -- same data, opposite
      verdict, which is the whole of the item.
    - >-
      ITEM 3 -- the null's comparator is now defined on the "none selected" branch:
      W_best_principled = min of W over principled references AVAILABLE at that
      cell, taken whether or not any is selected, with REF-SP dropping out where
      its solve fails, an explicit NOT_DECIDABLE token, and a requirement that the
      verdict name the carrying reference.
    - >-
      ITEM 4 -- F5 fired on the success case. v1 tested the sign pattern with no
      significance qualifier; a perfect correction leaves pure noise, whose sign
      pattern is non-monotone with probability near 1, so v1's declared branch (a)
      auto-reported as branch (c). v2 requires a significant decrease AND a
      significant increase, each exceeding k*sqrt(se_i^2 + se_j^2) with k = 3
      frozen, se the delta-method error of ln R.
    - >-
      ITEM 5 -- REF-SP is written down in full (f, f', f'', the saddle equation,
      Psi_SP = x^alpha*zeta(alpha,y)/(alpha*sqrt(2*pi*f''(alpha))), its log
      evaluation, bracketing/Newton/tolerance/UNAVAILABLE outcome), with existence
      and uniqueness of alpha argued from monotonicity of the stated sum rather
      than from a citation, and provenance declared as two independent
      RECOLLECTIONS with the explicit statement that two recollections are not a
      reading and no error term is asserted.
    - >-
      ITEM 6 -- OBJ-NULL-SYNTH removed from independent_variables (its rates are
      archived nowhere and its only execution path is forbidden by two of the
      contract's own rules), the control withdrawn, replaced by a non-blocking
      rejection-count readback with a real failing input.
    - >-
      ITEM 7 -- N_rep is read back per arm per cell (product arm 20, not 200) and
      every se_rel uses it; the R(product)/R(uniform) clause is stated ONCE with
      the identity showing the reference cancels; entailed rungs are defined
      structurally as Bsm >= p, labelled, excluded from the discriminating set, and
      carry no se-normalised statistic since se_rel is exactly zero there.
    - >-
      ITEM 8 (contract half) -- "IT IS ALREADY HALF-FAILING" is deleted and
      withdrawn. The control now records that the five quoted figures reproduce and
      are literals in the archive, that 4.49543/11.15351 was correct arithmetic on
      the wrong denominator, and that it is a DRIFT CHECK ON THE READER that cannot
      void the source figures. Its named failing input is the integer-u evaluation.
      F0 splits into tier 1 (archive literal, 1e-5) and tier 2 (proposal quotation,
      1 per cent). The ledger half is already discharged by CORR-20260904-f3aa7a
      and is not repeated.
    - >-
      ITEMS 9-15 -- false Simpson witness withdrawn and replaced by three witnesses
      (one OBSERVED by the reviewer, two constructible) with the check extended to
      the archived non-integer u; REF-EXACT cost-ordered onto count-proportional
      Method A, materialised Method B, the one-large-prime identity Method C with
      its derivation written out and Bsm**2 > X verified in exact integer
      arithmetic, and the O(X) sieve demoted to a separate-run fallback; the
      bits-20 u_target = 2 rung enabled CONDITIONALLY on Bsm > p; budget reconciled
      (total_cpu_hours 9 = 6*5400/3600, declared an arithmetic ceiling, with
      per-stage caps summing to 5160 s named as binding) and the memory sub-floor
      justification moved into the objective; new blocking control
      C-A-SUMMARY-RECOMPUTE recomputing mean/sd from the per-replicate arrays with
      the n-1 convention pinned; read-only control widened to a recursive tree hash
      naming __pycache__; pareto_position and an inference block added.
    - >-
      EVERY CONTROL WAS RE-CHECKED FOR A REAL, REACHABLE FAILING INPUT ON A REAL
      ANCHOR, and every check whose outcome is entailed if the pipeline is correct
      was moved OUT of `controls` into a new `declared_non_controls` section --
      REF-SHIFT-UP's direction readback, the synth rejection-count readback, and
      the binomial dispersion diagnostic. Five of the fifteen review items are
      instances of one failure mode (a decorative item counted as a control);
      separating the two kinds structurally is what stops it recurring in a new
      place.
    - >-
      DISAGREEMENTS RECORDED RATHER THAN SILENTLY DECLINED, because a reviewer can
      be wrong but an undisclosed departure cannot be audited. (C1) v1's
      rho(1.15*u_D) is NOT deleted; it is retained as REF-SHIFT-UP, a DECLARED
      NON-CONTROL instrument check -- worthless as a null precisely because it is
      entailed, useful as plumbing, and placed outside `controls` so no reader
      counts it as a second null. (C5) EXPLICIT DISAGREEMENT WITH THE REVIEWER'S
      REASONING: C5 states that C1 and C2 "remove REF-SP's accidental role as the
      only reference able to reject the null". They do not. On the reviewer's own
      figures a c < 1 knob reaches worst-rung L about 0.5235 against REF-ASY-X's
      1.8980, so both asymptotic references are beaten by the knob and
      W_best_principled is still carried by REF-SP alone -- the arm whose source is
      unread. That is a fact about the data, not an artifact of the metric; C1 and
      C2 EXPOSE it. v2 declares the dependence in arbitration_rules and in
      limitations and forces the verdict to name the carrying reference, instead of
      asserting a removal that does not occur. (C4) the gated sign-pattern form is
      used rather than the offered trend test, which would introduce a fitted slope
      and a distributional assumption where a pairwise comparison needs neither.
      (C6) both halves of the offered either/or are done. (C7) generalised from the
      named rung to the structural rule Bsm >= p, because the coordinator has not
      read the bits-20 p and will not assert it. (C8) two-tier split added, so a
      rho-solver defect stays distinguishable from a misquote. (C9) THE GATE IS
      TIGHTENED FROM 1e-3 TO 1e-6, WHICH WAS NOT ASKED FOR; cost stated plainly, a
      solver that would have passed at 1e-3 now stops the run. (C11) enabled
      conditionally on the executor verifying Bsm > p, not asserted reachable.
      (C12) the budget contradiction is resolved UPWARD (3 -> 9 CPU-hours), since 3
      was never a computed quantity and lowering maximum_runs would remove re-run
      headroom an eight-blocking-control contract will plausibly need; 9 is an
      arithmetic ceiling, not a spending plan. (C10) no runtime is asserted
      anywhere; the reviewer's timings are used only as ordering rationale and
      labelled uncommitted priors.
    - >-
      A COST THE REVIEWER DID NOT WEIGH, RAISED BY THE REVISING COORDINATOR AND
      KEPT: THE PRE-REGISTRATION IS COMPROMISED. C1 asks for a new null declared
      AFTER the review measured how that null performs, and the review published
      exact counts, R_exact, deviations in standard errors and worst-rung
      disagreements in a COMMITTED report. The new null is therefore not a blind
      test. v2 adds a `pre_computation_disclosure` block: v1's
      preregistered_prediction and coordinator_prior are carried VERBATIM (they
      predate the figures, which is the only reason they survive), NO new
      prediction is added, the v2 prior addendum is labelled post-exposure and not
      a prior, c_null is declared as the reviewer's own suggested value chosen
      after measurement, k = 3 is declared conventional but not blind, and the
      executor must record whether it read the review's numeric tables before
      implementing. Disclosure, not a pretence of blindness.
    - >-
      RE-DERIVED BY THE COMMITTING SESSION BEFORE FILING, because the revising
      session had no shell. All fourteen expressions the revision collected under
      `revision_record.arithmetic_stated_in_v2_that_a_committing_session_should_re_derive`
      were recomputed and every one holds: c_null = 20/23 = 0.8695652173913043;
      6*5400/3600 = 9; the per-stage caps sum to 5160 <= 5400;
      1-exp(-5.2494) = 0.99475, 1-exp(-1.8980) = 0.85013, 1-exp(-2.4488) = 0.91360;
      the relative ratio 1.1701 and the log ratio 2.7658 (confirming the same data
      fails a factor-2 test on one statistic and passes on the other);
      ln(1.05) = 0.048790; 46663**2 = 2177435569 and 1/2177435569 = 4.59e-10;
      sqrt(199/200) = 0.997497; sqrt(10) = 3.16228; 65536 > 46663 and
      65536**2 = 4294967296 > 2177435569 in exact integer arithmetic;
      46663*sqrt(46663) = 1.008e7; 1e7*8 bytes = 80 MB. Two further claims the
      revision makes ABOUT the review were checked against the review file rather
      than taken on report: VAL-20260904-821aee's limitations do state that its own
      counts, rho values, saddle estimates and ratios are session-local,
      uncommitted and not evidence; and its `review_plan` is null, so
      tools/check_review_independence.py could not run and that round's
      independence gate was indeed unexercised.
  evidence_refs:
    - coordination/reviews/approval-a1c262-20260904/validation_report.yaml
    - ledger/corrections/CORR-20260904-f3aa7a.yaml
    - ledger/decisions/DEC-20260904-726129.yaml
    - ledger/decisions/DEC-20260904-3bb7fc.yaml
    - ledger/hypotheses/H-ECDLP-d2aa2c.yaml
    - experiments/EXP-ECDLP-a1c262/specification.yaml
  limitations:
    - >-
      NONE OF THE evidence_refs IS EMPIRICAL EVIDENCE. No run exists and none may.
      VAL-20260904-821aee's numeric tables were produced in an uncommitted
      session-local scratchpad and its own author declared them not evidence and
      not citable until reproduced by an approved run; v2 treats every one of them
      as a prior, and so does this record.
    - >-
      THIS IS A REVISION, NOT AN APPROVAL, AND ANSWERING A FAILED REVIEW IS NOT
      PASSING ONE. status review_required, approved_by null, frozen false,
      execution_authorized false; no handoff, no dispatch, no compute.
    - >-
      NOTHING HERE IS EVIDENCE ABOUT ANYTHING MATHEMATICAL. No run exists. No
      hypothesis status moves, no evidence record is created, no band is corrected,
      no goal status changes.
    - >-
      v2 CANNOT MAKE THE NULL A BLIND TEST AGAIN; the answer is already published.
    - >-
      v2 CANNOT REMOVE THE REF-SP DEPENDENCE; the owed KN-LIT entry from an agent
      that actually opened Hildebrand-Tenenbaum is still owed.
    - >-
      v2 CANNOT ARBITRATE OBJ-NULL-SYNTH from committed state, at all, ever; and
      HEUR-SPREF-2's supporting_results bullet in H-ECDLP-d2aa2c consequently rests
      on rejection counts rather than rates, which is weaker than its wording
      implies. The hypothesis is NOT edited -- that would be a superseding record
      and a separate decision.
    - >-
      v2 CANNOT establish that the demoted Method D fits any cap on this host; that
      question is removed from the critical path, not answered.
    - >-
      SCOPE UNCHANGED AND EXEMPLARY PARTS PRESERVED: toy tier, X = p^2 at 16 and 20
      bits, no transfer, no exponent, no Semaev-map statement, real arm untouched,
      certificate.kind none. The review called the scope discipline the strongest
      part of the contract and it survives the revision.
  next_actions:
    - >-
      WHAT MUST BE TRUE BEFORE ANY APPROVAL, part 1: an INDEPENDENT re-review of v2
      under review-adversarial in its own session, answering the same joints the
      failed round owned, plus the two joints v2 creates -- (a) does every one of
      the eight blocking controls still have a real reachable failing input, with
      the new ones (C-A-SUMMARY-RECOMPUTE, the C-A-EXACT-COUNT-CROSS-METHOD
      identity legs, the widened read-only control) checked the same way; (b) is
      the declared_non_controls section complete, i.e. does anything left in
      `controls` have an entailed outcome. That round must carry a review_plan: the
      failed round had none, so tools/check_review_independence.py could not run
      and its joints were self-declared.
    - >-
      WHAT MUST BE TRUE BEFORE ANY APPROVAL, part 2: a judgement on the ONE THING
      V2 ADMITS IT CANNOT FIX -- the null-rejection verdict may rest entirely on
      REF-SP. The reviewer should say whether a blocking control carried by an arm
      with an unread primary source is acceptable when that arm is written down in
      full and measured against an exact count, or whether the null criterion must
      instead be stated against REF-ASY-X alone with the expected NOT_REJECTED
      outcome accepted in advance as the honest one.
    - >-
      WHAT MUST BE TRUE BEFORE ANY APPROVAL, part 3: a judgement on the COMPROMISED
      PRE-REGISTRATION. If a reviewer concludes that a contract whose answers are
      already published cannot serve its original epistemic purpose, the right move
      is to re-scope it as a REPRODUCTION contract -- producing the first citable
      record of quantities that currently exist only in an uncommitted scratchpad
      -- rather than to approve it as a discovery contract. That is a Coordinator
      decision on a superseding record, not an edit.
    - >-
      DO NOT approve, DO NOT write a handoff, and DO NOT dispatch an Executor on
      this contract until that re-review returns and an approval decision is
      separately committed. Only then do status, approved_by, frozen and
      execution_authorized move, and only with a TASK-* handoff whose budget fields
      are all non-null.
    - >-
      SEPARATELY AND NOT BLOCKING THIS CONTRACT: the KN-LIT entry for Hildebrand
      and Hildebrand-Tenenbaum, written by an agent that actually opens the
      sources, remains owed and is now on the critical path for any use of REF-SP
      outside this contract.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a contract revision, not an evidence review. No run, no evidence
      record, no strength rating, no durable claim. The general lesson -- that a
      saturating disagreement metric can make a stated rejection criterion
      arithmetically unreachable, and that a null object must be aimed at the
      collision its own hypothesis names -- is a candidate KN-TECH once an approved
      run has exercised it; promoting it from an unexecuted contract would promote
      an assertion about a design rather than a finding.
  decided_by: coordinator
  decided_at: '2026-09-04'
