coordinator_decision:
  id: DEC-20260801-009
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-024
  question_id: RQ-ECDLP-002
  decided_by: coordinator
  decided_at: '2026-08-01'
  decision: approve
  decision_scope: >-
    `approve` HERE MEANS EXACTLY ONE THING - the BATCH-024 dispatch plan, the frozen contract
    EXP-DEP-001, the hypothesis H-DEP-001 at `specified` and the fourteen handoffs are approved
    as a PLAN. IT AUTHORIZES NO RUN. The two run authorizations of this batch are
    CALIBRATION_AUTHORIZATION in the TASK-20260801-034 snapshot receipt and
    APPROVAL_DETERMINATION in the TASK-20260801-041 snapshot receipt, and neither is granted by
    this record. No experimental support of any kind is asserted anywhere below.
  target_ids:
  - GOAL-ECDLP-001
  - BATCH-024
  - EXP-DEP-001
  - H-DEP-001
  - RQ-ECDLP-002

  # ==================================================================
  # 1. CONTEXT - THE SINGLE NEXT ACTION BEING EXECUTED
  # ==================================================================
  context: >-
    BATCH-024 IS OPENED ON THE SINGLE next_action RECORDED IN ledger/goals/GOAL-ECDLP-001.yaml AT
    THE BATCH-023 CLOSE (DEC-20260801-008), WHICH DIRECTS RT049-CTRL-1, THE DEPENDENCE-ONLY
    PLANT, BEFORE ANY REPLICATION, UNDER A NEW EXPERIMENT ID AND A NEW FROZEN CONTRACT AND NEVER
    AS AN EDIT OF THE IMMUTABLE HASH-BOUND EXP-EQD-001 ARTIFACTS. That action is executed as
    written. BATCH-023 measured no detectable departure of the deterministic factor base's fibre
    invariants from a random base's, six of six failing to reject at a family-wise level of
    0.0582 - and the independent red team then showed the result bounds far less than it appears
    to. THE ONLY ALTERNATIVE CLASS AGAINST WHICH ANY POWER WAS EVER MEASURED IS AN e_1-MARGINAL
    PLANT. The frozen plant replaces out1[idx] and returns e2.copy(); no rung of that ladder
    moves DEPENDENCE at fixed marginals. The certified power is therefore against the WRONG
    ALTERNATIVE CLASS, and a copula-type deviation of ARBITRARY MAGNITUDE remains entirely
    unexcluded. Since the real base is a SMALL-x WINDOW - max x = 1052 against p = 46663 - that
    is exactly the shape a structured base would produce.
  why_this_and_not_the_replication: >-
    ADOPTED FROM RT-20260801-049 ON THE MERITS AND RESTATED HERE RATHER THAN CITED. Running the
    mandatory second-seed replication first would REPLICATE A MEASUREMENT WHOSE POWER AGAINST THE
    RELEVANT ALTERNATIVE CLASS IS UNKNOWN, producing a second number of the same unknown
    informativeness and telling us nothing about what either number means. BATCH-024 is the one
    measurement that decides whether EV-EQD-001's non-rejection is a meaningful bound on the
    JOINT law of the fibre invariants or only a bound on their e_1 marginal, and that answer
    determines what the replication should even be testing. COST IS NOT A REASON TO DEFER IT -
    the entire archived BATCH-023 calibration ran in 59.19 s at a peak RSS of 176 MB against a
    4 GiB budget, so this is minutes of compute.
  the_cost_of_this_ordering_stated_and_not_hidden: >-
    RANKING THIS AHEAD OF OPEN-BATCH023-A DEFERS THE PROGRAM'S OLDEST DEBT BY ONE MORE BATCH, AND
    THAT IS A REAL COST. The owed direct smoothness measurement of HEUR-DS-1 is the higher-value
    object - it is the heuristic-validation experiment HEUR-DS-1 actually needs. It is ranked
    IMMEDIATELY BEHIND this action, not dropped and not lowered in priority relative to anything
    else, for one reason - it requires a fresh frozen contract with its two named repairs, which
    is a full design-and-review cycle, whereas RT049-CTRL-1 is a bounded calibration arm over an
    existing validated apparatus.

  # ==================================================================
  # 2. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE DESIGN IS RT049-CTRL-1 AS SPECIFIED. OBJ-PLANT-DEP takes a CORRECT null arm and permutes
    e_2 so that BOTH MARGINALS ARE BIT-IDENTICAL to the source, and that bit-identity is a
    MANDATORY INTEGRITY CHECK (CTRL-DEP-MARG) whose failure is INSTRUMENT FAILURE and NEVER a
    result. The primary construction is the Gaussian-copula reordering over a frozen rho ladder,
    re-running the calibration-style power measurement at R_REPS = 200 - not 20, because the
    coarseness of the 20-of-20 bar was a real limitation last batch - with exact binomial
    confidence intervals for all four statistics at both cells.
  - >-
    THREE PLANT SHAPES AND NOT ONE, BECAUSE CERTIFYING AGAINST A SINGLE CONSTRUCTIBLE SHAPE AND
    THEN SPEAKING OF THE WHOLE CLASS IS THE EXACT DEFECT THIS BATCH EXISTS TO REPAIR. C1 is the
    global copula reordering, C2 is a cross-bin cell-mass transfer measured in the SAME UNITS as
    the BATCH-023 e_1 floor so the two floors are comparable as a ratio rather than an
    impression, and C3 is a coarse two-stratum block reordering as a shape check. The uncertified
    classes U1 through U6 are declared beside them and travel with every statement.
  - >-
    A DESIGN TRAP WAS IDENTIFIED AND AVOIDED IN THE CONTRACT RATHER THAN DISCOVERED IN REVIEW.
    Permuting e_2 WITHIN strata that coincide with the chi-square bins leaves the K x K
    contingency table EXACTLY invariant, so such a measurement would return the nominal
    false-rejection rate at every rung BY CONSTRUCTION and would look like a finding of zero
    power while measuring nothing. DESIGN-TRAP-1 records this; the copula construction moves mass
    ACROSS bins and DIAG-DEP-RHO measures the induced dependence separately as the
    decision-variable variation check.
  - >-
    THE THRESHOLDS ARE THE ARCHIVED EXP-EQD-001 ONES, USED UNCHANGED, AND THE MAP AND STATISTICS
    ARE IMPORTED READ-ONLY FROM THE HASH-BOUND EXP-EQD-001 DRIVER. This is a power measurement of
    the test EV-EQD-001 ACTUALLY PERFORMED; a re-implementation or a fresh threshold would
    characterize a different test and the result would not transfer. No EXP-EQD-001 file is
    written, edited, renamed or staged.
  - >-
    THE READING IS DECLARED IN ADVANCE IN BOTH DIRECTIONS AND THE BRANCH STRUCTURE IS FROZEN ONE
    STEP EARLIER THAN THE READING RULE. D-2 amends EV-EQD-001 UPWARD, D-3 amends it DOWNWARD to
    "the two marginals are not distinguishable and the joint was not effectively tested", D-4
    records the measured floors as numbers. Either way EV-EQD-001 is SUPERSEDED BY ADDITION via
    EV-EQD-002 and never edited, because it is immutable.
  - >-
    ALL THREE ESTABLISHED PROCESS DISCIPLINES ARE CARRIED. ATTAINABILITY - the reading rule
    freezes with an argument in MEASURED numbers showing some achievable measurement lands in
    every branch, checked as a NAMED reviewer duty whose rejection is a REVISE.
    CALIBRATION-FIRST - the calibration arm runs before the reading rule is frozen, ATS-DEP-1
    keeps that from becoming tuning, and the driver is authored complete and hash-bound at
    calibration time so the measurement arm must run the identical file. DECISION-VARIABLE
    VARIATION - every decision variable is checked to vary with what it measures, AND, new and
    most important this batch, THE POWER CERTIFICATE MUST BE AGAINST THE RIGHT ALTERNATIVE CLASS,
    which ALT-CLASS-DEP-1 states and a third named reviewer duty checks against source.
  - >-
    ONE DECLARED PRE-DISCLOSURE IS RECORDED RATHER THAN CONCEALED. The DEP-CAL-D attainability
    anchor - the comonotone object at maximal dependence - is measured in the calibration stage
    and its outcome partially foreshadows the substantive result. That is admissible only because
    the entire branch structure, the cuts, the ladders, the detection bar and the statistic family
    are hash-bound in the specification BEFORE any datum, so the calibration can supply numbers
    and can never supply a choice. Concealing the anchor would have been the dishonest option and
    running it after the freeze would have left attainability unverifiable.

  # ==================================================================
  # 3. EVIDENCE REFERENCES
  # ==================================================================
  evidence_refs:
  - ledger/goals/GOAL-ECDLP-001.yaml next_action at the BATCH-023 close
  - ledger/decisions/DEC-20260801-008.yaml
  - ledger/evidence/EV-EQD-001.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-029/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-DEP-001/specification.yaml
  - ledger/hypotheses/H-DEP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/dispatch_queue.json
  evidence_refs_note: >-
    NO NEW EMPIRICAL EVIDENCE IS CITED OR CREATED BY THIS DECISION. No run exists for EXP-DEP-001
    and no evidence record is filed. Every citation above is to an already-committed artifact.

  # ==================================================================
  # 4. THE ALTERNATIVE-CLASS DECLARATION, CARRIED VERBATIM
  # ==================================================================
  alternative_class_declaration:
    id: ALT-CLASS-DEP-1
    carried_verbatim_from: experiments/EXP-DEP-001/specification.yaml, alternative_class_declaration.text
    text: >-
      CERTIFIED AGAINST, AFTER THIS EXPERIMENT AND CONDITIONAL ON A VALID RUN - (C1) global
      monotone rank dependence at exactly preserved marginals, as generated by the
      Gaussian-copula reordering OBJ-PLANT-DEP-rho, at the ladder rungs measured and only at
      those rungs; (C2) local joint-cell mass transfer at exactly preserved marginals, as
      generated by the paired e_2 exchange OBJ-PLANT-DEP-CELL-eps between records lying in
      DIFFERENT e_1 bins, at the ladder fractions measured; (C3) coarse two-stratum block
      reordering at exactly preserved marginals, OBJ-PLANT-DEP-BLOCK-q, at the fractions
      measured. CARRIED FORWARD FROM BATCH-023 AND NOT RE-MEASURED HERE - (C0) uniform
      re-randomization of the e_1 coordinate on a delta fraction of half-tuples,
      OBJ-PLANT-delta, certified at delta = 0.05 by the frozen CERT-EQD-1 predicate with a
      measured branch-level floor of delta = 0.02, per EV-EQD-001. UNCERTIFIED AFTER THIS
      EXPERIMENT, AND THIS LIST IS PART OF THE RESULT - (U1) any dependence deviation that BOTH
      ARMS SHARE, to which a two-sample design is blind by construction because the deviation
      cancels identically; (U2) any dependence deviation supported on a set of joint cells too
      sparse for the K = 16 and K = 64 grids to resolve, or of magnitude below the smallest rung
      of the CELL ladder; (U3) any dependence structure invisible to a rank correlation AND not
      expressible as cell-mass transfer, including higher-order or conditional dependence with
      zero rank correlation and balanced cell margins; (U4) any deviation of the e_2 marginal
      alone at a resolution finer than 1/64 of the field, which EV-EQD-001 already declared a
      blind spot and which this experiment does not close; (U5) any object other than the two
      frozen toy curve instances, any other Bfb, arity, intermediate, enumeration or field size;
      (U6) the separation of "deterministic selection rule" from "small-x window" (RT049-B6),
      which this experiment does not attack and against which the L1 cancellation argument does
      NOT protect. NO STATEMENT IN ANY DELIVERABLE MAY DESCRIBE THIS APPARATUS AS HAVING POWER
      AGAINST "DEPENDENCE" WITHOUT NAMING WHICH OF C1, C2 OR C3 THE CLAIM RESTS ON AND WITHOUT
      CARRYING U1 THROUGH U6.

  # ==================================================================
  # 5. LIMITATIONS
  # ==================================================================
  limitations:
  - >-
    THIS BATCH CHARACTERIZES AN INSTRUMENT. It is not a second measurement of the deterministic
    factor base, and no statistic of OBJ-REAL against any null is computed anywhere in it. The
    only OBJ-REAL quantity is the non-decisional duplicate decomposition.
  - >-
    IT IS DELIBERATELY NOT A REPLICATION. The same two curve instances are used because
    comparability with the test being characterized requires it, so nothing here can move
    H-EQD-001 toward `replicated`. RT049-CTRL-5 remains owed.
  - >-
    NO SMOOTHNESS, NO FACTORIZATION, NO LARGEST PRIME FACTOR, NO DICKMAN MODEL, NO SEARCH, NO
    TIMING DECISION VARIABLE, NO COST IDENTITY AND NO R. HEUR-DS-1 is neither validated nor
    refuted at any tier under any branch, and this batch is one step further removed from it than
    BATCH-023 was.
  - >-
    TOY TIER ONLY - field sizes 16 and 20 bits. AGENTS.md rule 7 applies with full force. No
    crypto-scale, medium-scale, asymptotic or affected-scheme claim under any branch, no scheme
    is affected and none is declared safe, and all four promotion gates G1 through G4 remain
    OPEN.
  - >-
    FORBIDDEN THROUGHOUT - S1_met, F1_met, F2_met, structure_gate_passed, `support` for any
    hypothesis in this lane, asymptotic promotion, reject_scoped and in particular
    reject_scoped-as-impossibility, dominated_by null, and equally any characterization of
    BATCH-023 or of this batch as vacuous or worthless, which would be premature closure under
    docs/inventor-protocol.md section 4.
  - >-
    THE STANDING MODEL-INDEPENDENCE CAVEAT APPLIES UNCHANGED - author, reviewer, validator, red
    team and coordinator all resolve to claude-opus-5, independence is PROCEDURAL and not
    model-level, model_verified is false everywhere, and NOTHING IN BATCH-024 IS ADMISSIBLE
    TOWARD THE AGENTS.md RULE 13 THREE-MODEL CLOSURE QUORUM.
  - >-
    RT049-B6 IS CARRIED FORWARD UNADDRESSED. The determinism versus small-x window confound is
    not attacked by this batch and the L1 cancellation argument does not protect against it.

  # ==================================================================
  # 6. OPEN ITEMS - WHAT THIS BATCH DISCHARGES AND WHAT IT DOES NOT
  # ==================================================================
  declared_open_items:
  - id: OPEN-BATCH023-A
    title: the direct smoothness measurement of HEUR-DS-1 is still owed
    status: 'FILED AND OPEN; RANKED FIRST BEHIND THE SINGLE NEXT ACTION; NOT DISCHARGED'
    statement: >-
      Unperformed across twenty-three batches and now twenty-four. NO EXPERIMENT IN THIS CAMPAIGN
      HAS YET FACTORED AN INTEGER AND THIS ONE WILL NOT EITHER. Equidistribution of the fibre
      invariants is a load-bearing INPUT to HEUR-DS-1 and is not identical to it. Its two named
      repairs stand - calibrate the KS, rate-band and tail rules against a MEASURED null at the
      actual X instead of against the asymptotic rho, and enumerate i < j so the diagonal is
      excluded by construction.
  - id: OPEN-BATCH023-B
    title: status transitions recorded away from the gate that effects them, and a rule keying on a status the ledger never held
    status: 'PARTIALLY DISCHARGED - the halves are named separately rather than averaged'
    second_half_repaired: >-
      REPAIRED OUTRIGHT. No RR-DEP-1 branch may key on any hypothesis status, the specification
      forbids it, and TASK-20260801-040's attainability duty must verify that clause at freeze
      time and return REVISE otherwise.
    first_half_mitigated_only: >-
      MITIGATED, NOT REPAIRED, WITH THE STRUCTURAL BLOCKER NAMED. research_dispatch.py enforces
      exactly one owning task per artifact path, so H-DEP-001.yaml cannot be staged both by the
      approval snapshot and by the ledger archive; the transition cannot be committed at the
      instant its gate effects it. The mitigation is to PRE-DECLARE at the opening that the
      `approved` and `running` entries will be written at TASK-20260801-046 with
      recorded_retrospectively true and their effecting artifacts named, and to require the two
      gate receipts to record the determination in a named field. The item stays OPEN on this
      half.
  - id: OPEN-BATCH022-A
    title: validator run indexing misses manifest.json run packages
    status: 'FILED AND OPEN; MITIGATED, NOT REPAIRED'
    statement: >-
      Both EXP-DEP-001 runs specify manifest.yaml with the five required companion filenames so
      this experiment does not inherit the defect. The underlying indexing defect in
      tools/validate_ledger.py stands untouched, and no frozen EXP-DS-001 contract or archived run
      artifact may be edited to hide it.
  - id: OPEN-BATCH022-B
    title: recurring same-date DEC-id collision between this branch and origin/main
    status: 'FILED AND OPEN; MITIGATED, NOT FIXED'
    statement: >-
      Four recorded occurrences. DEC-20260801-009 and every handoff id in this batch were
      re-checked free against the current tree immediately before being written. The close ids
      DEC-20260801-010, EV-DEP-001 and EV-EQD-002 are declared in the queue's close_id_policy with
      a MANDATORY freshness re-check at TASK-20260801-046, renumbering OUR record and never the
      other party's.
  - id: RT049-B6
    title: the determinism versus small-x window confound
    status: 'FILED AND OPEN; CARRIED FORWARD EXPLICITLY; NOT ATTACKED'
    statement: >-
      Its discriminating arm is RT049-CTRL-2, the windowed null, which is not run here. Cancellation
      does NOT protect against this confound.
  - id: KN-CAND-BATCH023-A
    title: the RT049-B2 duplicate-model finding, banked and not promoted
    status: 'PROMOTION TRIGGER ADDRESSED BY DESIGN, NOT FIRED BY THIS OPENING'
    statement: >-
      The trigger recorded in DEC-20260801-008 is EITHER an archived machine-readable
      decomposition on a successor experiment OR an archived derivation note. This contract
      specifies route (a) cheaply as the non-decisional diagnostic DIAG-DEP-DUP writing
      duplicate_decomposition.json with dup_translate_explained and dup_residual as
      machine-readable fields and the residual pre-registered at zero as an integrity tell.
      RUNNING IT CREATES THE ARTIFACT; IT DOES NOT PERFORM THE PROMOTION. The promotion decision,
      if warranted, is taken at TASK-20260801-046 on a valid run under /curate-knowledge, and any
      promoted KN-FIND plus the regenerated knowledge/INDEX.md requires a queue amendment
      enlarging the ledger declared set first. NO KN-FIND ID IS RESERVED HERE and
      knowledge/INDEX.md is untouched.
  - id: OPEN-BATCH024-A
    title: supersession is discoverable only forward
    status: 'NEW; FILED AND OPEN; NOT REPAIRED'
    statement: >-
      EV-EQD-002 will name EV-EQD-001 in its supersedes field, but EV-EQD-001 is immutable and
      gains no forward pointer, so a reader who opens EV-EQD-001 alone sees no indication that its
      reading was amended, and no back-pointer index exists. Repairing this by editing EV-EQD-001
      is forbidden. Candidate repairs for a future batch are a generated superseded-by index or a
      validator warning; neither is attempted here.
