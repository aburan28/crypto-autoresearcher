      IDEA-20260904-e12b5a, and IDEA-20260904-96c4f3.
    - >-
      Snapshot producer artifacts through TASK-20260905-2b52a7, verify the
      archive and publish its PR update, then obtain a fresh independent
      review-adversarial session at xhigh through TASK-20260905-a05748.
      Preserve any procedure deviations and do not imply that this review has
