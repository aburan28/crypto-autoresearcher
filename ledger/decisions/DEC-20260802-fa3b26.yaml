coordinator_decision:
  id: DEC-20260802-fa3b26
  context: >-
    A HARNESS CHANGE, NOT A RESEARCH RESULT. Commit 3834d84f retired the
    budgeting mechanism repo-wide: no campaign carries `maximum_batches` or
    `total_wall_clock_seconds`, no task carries a `budget` block, AGENTS.md
    rule 3 now states that budgets are not among an experiment's required
    elements, the handoff envelope has no `budget:` field, and the goal template
    in templates/research-records.md carries no `campaign_budget`. The goal
    status `closed_at_budget` is retired and grandfathered to exactly one holder
    (tools/validate_ledger.py CLOSED_AT_BUDGET_GOAL_IDS = {"GOAL-MLKEM-001"});
    GOAL-P13-001 is NOT in that set, so the status is unavailable to it.
    `max_concurrent` survives as a write-scope concurrency guard on the shared
    worktree and is not a budget.
    GOAL-P13-001's live record still carried `campaign_budget`
    (maximum_batches 4, total_wall_clock_seconds 21600, batches_consumed 3,
    batches_remaining 1), and DEC-20260802-48c72c pre-committed a terminal
    disposition phrased in terms of that cap and of `closed_at_budget`. Those
    clauses now name mechanisms that do not exist. This decision supersedes
    exactly those clauses, clears the budget from the live goal record, and -
    because removing a cap removes a stopping point - installs an explicit
    campaign-end standard in its place. It adjudicates NO new evidence, moves NO
    hypothesis status, and lifts NO standing prohibition.
  decision: supersede
  decision_note: >-
    `supersede` is the operative value because the correction is to a prior
    Coordinator decision's forward-looking clauses, not to any finding.
    AGENTS.md rule 4 forbids editing DEC-20260802-48c72c, so its terminal
    pre-commitment is superseded here by a new record and its file is left
    byte-unchanged; every other clause of that decision stands.
    WHY NOT `revise`: nothing in the adjudicated content of H-P13-001,
    EV-PEC-857664 or EV-PEC-2e67ff is touched.
    WHY NOT `pause`: pausing GOAL-P13-001 today would be premature closure in
    the sense of docs/inventor-protocol.md, for the reasons DEC-20260802-48c72c
    recorded and this decision reaffirms - reasons that were never budget-shaped.
    WHY NOT `support`/`reject_scoped`: no evidence is adjudicated here, and the
    governing evidence record EV-PEC-857664 is strength `preliminary` on a
    single unreplicated run, on which a scoped rejection is forbidden.
  target_ids:
    - GOAL-P13-001
    - DEC-20260802-48c72c
    - H-P13-001
    - EV-PEC-857664
    - EV-PEC-2e67ff
    - DEC-20260802-8227b9

  # ------------------------------------------------------------------
  # (A) WHAT IS SUPERSEDED
  # ------------------------------------------------------------------
  supersession:
    superseded_record: DEC-20260802-48c72c
    superseded_scope: >-
      NARROW AND NAMED. Only the forward-looking clauses whose operative terms
      the harness has removed. Everything else in DEC-20260802-48c72c - its
      outcome-classification adjudication, adjudications A through H, the
      citability_ruling and its eight mandatory attachments, standing
      prohibitions SP-1..SP-12, official_positions_after_this_decision, its
      limitations, and its knowledge_promotion schedule - STANDS UNCHANGED AND
      UNEDITED. The file is not modified (AGENTS.md rule 4).
    superseded_clauses:
      - locus: "completion_criteria_assessment.goal_status, final paragraph (PRE-COMMITMENT)"
        text_superseded: >-
          "BATCH-004 is NOT an attempt to meet criterion 1 ... After BATCH-004
          the goal moves to `paused` or `closed_at_budget` with the narrowest
          supported result recorded, never to `completed`, absent a genuine
          three-model quorum."
        what_survives_verbatim: >-
          The first half survives on its merits and is REAFFIRMED: BATCH-004 is
          not an attempt to meet criterion 1, and the goal may never move to
          `completed` absent a genuine three-model quorum. What is superseded is
          the terminal disposition attached to a batch number.
      - locus: "completion_criteria_assessment.budget"
        text_superseded: >-
          "Three of four budgeted batches are spent (BATCH-001, BATCH-002,
          BATCH-003). ONE remains. A remaining batch is a permission, not an
          obligation."
        what_survives_verbatim: >-
          "A remaining batch is a permission, not an obligation" survives as a
          general principle and is generalised by campaign_end_standard below:
          capacity, of any kind, is never a reason to open a batch. The count
          has no referent.
      - locus: "next_actions[0].action, the phrase 'THE FINAL BUDGETED BATCH'"
        text_superseded: "BATCH-004 as 'the final budgeted batch'."
        what_survives_verbatim: >-
          The five ordered items themselves survive as research content and are
          re-ranked on their merits in batch_004_ranking below.
      - locus: "next_actions[0].what_would_change_this_ordering (the rerank trigger)"
        text_superseded: >-
          "...the batch's remaining capacity should go to characterising it
          rather than to NC-3/NC-6."
        what_survives_verbatim: >-
          The TRIGGER survives in full - if NC2d-PROPER fires FC-4 again on
          ell >= 47, L5 is contradicted at the ell where it is actually applied
          and alpha ceases to be the smallest term in the corrected law. Its
          CONSEQUENCE changes: it was a SUBSTITUTION trigger because one slot
          had to be allocated; it is now an ADDITION trigger. See
          batch_004_ranking.rerank_trigger_converted.
      - locus: "GOAL-P13-001 live record: campaign_budget, status_note, closure_requirements[0], pause_conditions[1], pause_condition_watch (PRE-COMMITMENT paragraph), next_action"
        text_superseded: "The budget block and every clause phrased in terms of it."
        what_survives_verbatim: >-
          pause_conditions[0] and [2] are kept verbatim; closure_requirements[1]
          and [2] are kept verbatim; the substantive content of
          pause_condition_watch (the c-lane method ceiling, and the three
          concrete reasons the goal is not paused today) is kept and re-stated
          without the budget frame.
    two_independent_grounds:
      ground_1_status_unavailable: >-
        `closed_at_budget` is no longer an available status for this goal.
        AGENTS.md "Goal closure quorum" retires it with the budgeting mechanism;
        tools/validate_ledger.py rejects it on any goal outside
        CLOSED_AT_BUDGET_GOAL_IDS = {"GOAL-MLKEM-001"}; GOAL-P13-001 is not in
        that set. A pre-commitment to a status that the validator now rejects
        cannot bind.
      ground_2_cap_removed: >-
        The four-batch cap that made "one batch remains" meaningful no longer
        exists. `maximum_batches` and `total_wall_clock_seconds` are not fields
        of a research_goal. "The final budgeted batch", "the remaining budget"
        and "the batch's remaining capacity" have no referent, and a decision
        clause whose operative term has no referent is not a rule anyone can
        apply. Each ground is independently sufficient.
    what_supersession_does_not_mean: >-
      IT DOES NOT REOPEN A SETTLED ASSESSMENT. DEC-20260802-48c72c's judgement
      that completion criterion 1 is UNREACHABLE BY THIS METHOD is not among the
      superseded clauses and is reaffirmed in full below on grounds that never
      referred to a budget.

  # ------------------------------------------------------------------
  # (B) WHAT DOES NOT CHANGE
  # ------------------------------------------------------------------
  what_emphatically_does_not_change:
    preamble: >-
      REMOVING A BUDGET REMOVES AN ARBITRARY STOPPING POINT, NOT A STANDARD.
      Every position below is restated because a governance change is exactly
      the moment a scoped position is most likely to be quietly loosened, and
      none of them rested on a budget in the first place.
    criterion_1_still_not_met_and_still_unreachable_by_this_method: >-
      UNCHANGED AND REAFFIRMED. Completion criterion 1 is NOT MET on the
      numbers, and DEC-20260802-48c72c's assessment that it is UNREACHABLE BY
      THIS METHOD STANDS ON ITS MERITS. The assessment's two supports are
      budget-free and are restated here in full.
      (i) THE RESIDUAL WIDTH IS AN UNIMPLEMENTED SUBROUTINE. The defensible
      modelled margin span at w = 2^30 is [8.3498, 22.2927] bits at alpha = 1
      throughout (width 13.9429) or [8.3498, 24.9708] allowing alpha in
      {0, 1, alpha_hat} (width 16.6210), against irreproducibility bands of
      2.2309 bits (NIST-I time) and 3.5133 bits (largest absolute deviation
      anywhere in RUN-P13VOW-001's C1 control) - four to seven times the band.
      That width is dominated by assumption L4, worth 11.50 to 13.25 bits and
      48 to 59 per cent of the corrected overhead, which is a batched
      Sutherland-type modular-polynomial evaluation THAT NOBODY HAS WRITTEN.
      Narrowing it requires building that implementation, which is a research
      project and not a control. No amount of uncapped time makes an
      unimplemented subroutine into a measurement.
      (ii) THE METHOD CEILING IS EXACT, NOT A FATIGUE REPORT. RT3-P3's ceiling
      is gamma = exponent(M) - 1 and M is at most schoolbook, so gamma <= 1:
      this method can only narrow the overhead FROM ABOVE within [0, 1] in the
      exponent, and it has already done so to a 4.805-bit span on the
      measured-gamma axis. A ceiling is a property of the method, not of the
      calendar. REMOVING THE CAP DOES NOT MAKE CRITERION 1 REACHABLE, and no
      record may read the retirement of budgeting as having changed this.
    goal_may_not_be_marked_completed: >-
      UNCHANGED. GOAL-P13-001 may NOT be marked `completed`. Two independent
      bars. (i) Criterion 1 is unmet. (ii) AGENTS.md rule 13 requires three
      CONCUR attestations in completion_quorum.attestations whose
      resolved_model_id values are PAIRWISE DISTINCT, each in an independent
      session, with any single DISSENT blocking closure. This harness cannot
      supply that: every subagent resolves to the same inherited model under
      INFAMEND-20260802-P13-002, so three policy aliases fall back to one
      backend - the exact failure mode the rule exists to prevent. No
      attestation has been obtained, none is recorded, and the
      `completion_quorum` block stays omitted rather than stubbed. A fabricated
      attestation would be worse than an open goal.
      PRE_QUORUM_GOAL_IDS IS NOT A ROUTE AROUND IT. GOAL-P13-001's presence in
      tools/validate_ledger.py's PRE_QUORUM_GOAL_IDS is an artifact of the rule
      being prospective for goals closed before it existed. Using it to close
      this goal without a quorum would be a contract violation, and so would
      retiring a goal that DID meet a criterion under `paused` or `blocked` to
      avoid the quorum. Neither is attempted: criterion 1 is genuinely unmet on
      the numbers.
    every_standing_prohibition_stays: >-
      UNCHANGED. No standing prohibition of DEC-20260802-8227b9 or
      DEC-20260802-48c72c is lifted, narrowed, or made conditional by this
      decision, and this decision has no authority derived from the budget
      retirement to lift any of them. Explicitly restated, in the dispositions
      DEC-20260802-48c72c gave them:
      SP-1 (PERMANENT): no record may cite c = 0.864, nor 0.771 / 0.868 /
      1.0389 / the c_kappa values, as an overhead estimate. The defect is in the
      ESTIMATOR, so no future measurement can rehabilitate them; they may appear
      only in a column explicitly labelled "superseded input being corrected".
      SP-2 (PERMANENT, companion set EXTENDED and never narrowed): gamma =
      0.9739, c_quad = 0.0488 and gamma_local_top = 1.1706 may not be quoted
      without the seam statement and the seam-free companions.
      SP-3 (STANDS): modelled margins are quoted at w = 2^30 ONLY; larger-w rows
      are not read as improvements.
      SP-4 (STANDS; condition NOT met): nothing moves concrete_threat_nist1 off
      INCONCLUSIVE without evidence clearing the irreproducibility band.
      SP-5 (PERMANENT, extended to BATCH-003's review-side work): no reviewer's
      supplementary analysis is citable as run evidence.
      SP-6 (PERMANENT): RUN-PEC-6be870-a's completion gate remains UNMET and no
      record may describe it otherwise; RUN-PEC-49c773-a's own gate is MET. Two
      runs, two facts.
      SP-7 through SP-12 (STAND): the per-row bootstrap endpoints are never the
      uncertainty on c; "all five predictions MET" is not "no top-of-range
      steepening"; C-NULL's per-step cost is never a Delfs-Galbraith
      measurement; alpha = 1 is DERIVED and MECHANISM-INCONSISTENT and never
      "measured-consistent"; no W-TOP-derived c is an estimate or a bracket
      endpoint; the NC2b-G1 PASS is level retention only.
      THE BRACKET-WITH-ATTACHMENTS RULE ALSO STANDS IN FULL: c is citable at
      NIST-I only as the bracket [1.327077, 1.576444] across two declared
      modelling choices, labelled a modelling-choice span and never a confidence
      interval, never as a single number, with all eight mandatory attachments
      MA-1..MA-8 travelling with it.
    concrete_threat_nist1_stays_inconclusive: >-
      UNCHANGED. concrete_threat_nist1 is INCONCLUSIVE. The SIGN is robust - all
      eighteen measured-gamma readings put the modelled margin at w = 2^30 in
      [8.3498, 13.1544], clearing the 2.2309-bit band by 6.1 bits and the
      3.5133-bit band by 4.8 - and the MAGNITUDE is not, at four to seven times
      the band and still set almost entirely by an unwritten subroutine.
      Additionally a pre-registered falsifier (FC-4) has fired and has not been
      retired by measurement, and a fired falsifier is not a state in which a
      concrete-threat verdict moves. concrete_threat_nist3_nist5 likewise
      UNCHANGED (not threatened under any tested overhead scenario), and
      mathematical_validity_conditional UNCHANGED.
    hypothesis_status: >-
      H-P13-001 stays `analyzed`. All four promotion gates for an
      asymptotic-complexity claim remain as DEC-20260802-48c72c found them, and
      gate 4 (independent review-breakthrough at `max`) is not satisfiable in
      this harness at all. A claim missing any gate may reach `analyzed` and
      never `supported`. Budget retirement bears on none of the four gates.
    evidence_strength: >-
      EV-PEC-857664 stays `preliminary` (one authorized run; C-REPRO is
      instrument replication, not inference replication). EV-PEC-2e67ff stays as
      DEC-20260802-48c72c left it: current as the evidence record of
      RUN-PEC-6be870-a, with its ANALYSIS layer superseded by EV-PEC-857664.
      Claim tiers are unchanged and AGENTS.md rule 7 applies in full - nothing
      measured at p = 1099511627563 over 2 <= ell <= 211 is a cryptographic-scale
      result.

  # ------------------------------------------------------------------
  # (C) THE NEW FAILURE MODE AND THE GUARD AGAINST IT
  # ------------------------------------------------------------------
  campaign_end_standard:
    why_this_field_exists: >-
      THIS IS THE IMPORTANT PART OF THIS DECISION. A capped campaign had a
      built-in end: whatever else was true, the fourth batch was the last one.
      That end was arbitrary - it was a number, not a scientific statement - and
      retiring it is right. But it was doing real work, and removing it without
      replacement leaves TWO failure modes sitting on either side of the
      campaign with nothing between them. docs/inventor-protocol.md treats them
      as SYMMETRIC and this standard treats them the same way.
      FAILURE MODE 1, PREMATURE CLOSURE: declining to search because a target
      looks saturated. It is cheap to produce, it reads as rigour, and it is
      almost never challenged because a rejection needs no evidence. Under
      docs/inventor-protocol.md section 4, "we screened N mechanisms and all
      were rejected" is a FATIGUE REPORT whose honest status is `unverified`; a
      closure needs a named obstruction, an argument, and forward guidance.
      FAILURE MODE 2, UNBOUNDED DRIFT: continuing because nothing stops you.
      This is the mode the retirement creates. With a cap, "continue" had to fit
      inside a declared number; without one, "continue" becomes the default and
      a default is not a decision. The remedy is not to reinstate a number. It
      is to require that CONTINUING be justified in a record, in exactly the way
      STOPPING already has to be.
    the_standard: >-
      GOAL-P13-001 ENDS IN EXACTLY ONE OF THREE WAYS, AND IN NO OTHER WAY.
    routes:
      - id: END-1
        name: completion
        condition: >-
          A completion criterion is met AND the AGENTS.md rule 13 quorum
          concurs: three CONCUR attestations with pairwise-distinct
          resolved_model_id values, each in an independent session, no DISSENT.
          Distinctness is judged on the resolved model, never on the requested
          policy alias.
        currently_available: >-
          NO. Criterion 1 is not met and is assessed unreachable by this method;
          and this harness resolves every subagent to one model, so the quorum
          would require deliberately routing three different backends. This
          route is recorded as closed, not as pending.
      - id: END-2
        name: exhaustion_on_the_merits
        condition: >-
          A Coordinator decision, committed through a VERIFIED ledger archive,
          records that NO RANKED NEXT ACTION OF MATERIAL VALUE REMAINS. Per
          AGENTS.md "Research-direction integrity and auditability" that
          decision must name: the evidence, the scope actually reached, the test
          boundary, the remaining uncertainty, and a CONCRETE SUCCESSOR OR
          REVIVAL CONDITION - i.e. what would revive this goal, stated
          specifically enough that a later agent can check whether it has
          happened. The resulting status is `paused` with a concrete resume
          action. It is NEVER `completed` and NEVER `closed_at_budget`.
        why_paused_is_the_stricter_record: >-
          The retired status asserted only that a number had been reached, which
          required no scientific content at all - AGENTS.md now records that
          "we ran out of budget" was the one closure rationale needing none, and
          that it is gone. `paused` must say what would restart the work. The
          bar went up, not down.
      - id: END-3
        name: user_instruction_or_a_triggered_pause_condition
        condition: >-
          The user instructs the campaign to stop, or a declared pause condition
          of GOAL-P13-001 fires (external resolution of Heuristic 1; a
          definitive infrastructure or dependency blocker). A pause condition
          that fires for ONE LANE pauses that lane and is recorded as such; it
          does not automatically pause the goal, and the difference must be
          stated explicitly wherever it is invoked.
    binding_guards:
      - id: G-1
        rule: >-
          CAPACITY EXISTING IS NEVER A REASON TO OPEN A BATCH, ADD A TASK, OR
          CONTINUE. This rule predates budgeting - AGENTS.md "Dynamic dispatch"
          has always said "Do not fill capacity merely because a slot is free" -
          and it survives budgeting unchanged. It now also runs in the other
          direction: THE ABSENCE OF A CAP IS NEVER A REASON TO CONTINUE.
      - id: G-2
        rule: >-
          EVERY BATCH IS OPENED BY A DECISION THAT NAMES WHAT IT BUYS, against
          the standing ranked list, before it is dispatched. "Continue" is a
          decision with a rationale and a ranking, or it does not happen. A
          batch that closes without producing a ranked item of material value
          for its successor triggers END-2 rather than a default reopen.
      - id: G-3
        rule: >-
          A TARGET LOOKING SATURATED IS NOT, BY ITSELF, AN END. "This space is
          mined" is a hypothesis about the search, not a result about the
          problem. END-2 requires the closure standard of
          docs/inventor-protocol.md section 4 - obstruction, argument, forward
          guidance - and a count of screened-and-rejected items does not meet
          it.
      - id: G-4
        rule: >-
          A LANE AT ITS METHOD CEILING IS CLOSED AS A LANE, NAMED AS SUCH, AND
          IS NOT GENERALISED TO THE GOAL. The c-calibration lane is at its
          ceiling (RT3-P3); the goal is not, because Heuristic 1's tail has
          never been tested. Declining to test a load-bearing term on the
          grounds that a DIFFERENT term is saturated is exactly the move
          docs/inventor-protocol.md forbids.
      - id: G-5
        rule: >-
          NOTHING IN THIS STANDARD LOOSENS AN EVIDENCE RULE. Removing a stopping
          point cannot promote a claim, widen a scope, lift a prohibition, or
          convert `preliminary` evidence into anything else. AGENTS.md rules 4,
          5, 6, 7, 9 and 10 apply exactly as before.

  # ------------------------------------------------------------------
  # (D) THE BATCH-004 RANKING, RE-DONE WITHOUT SCARCITY
  # ------------------------------------------------------------------
  batch_004_ranking:
    question_asked: >-
      DEC-20260802-48c72c ranked five items for what it believed was a single
      final batch. Does that ranking still hold now that the items are not
      competing for a scarce final slot? The honest answer is that it PARTLY
      DOES NOT, and the reason is legible in the earlier decision's own text.
    what_the_earlier_ranking_was_shaped_by: >-
      Its ordering rule is stated in DEC-20260802-48c72c's own words: "with the
      cheap falsifier-closing items first SO THAT A TRUNCATION DEGRADES
      GRACEFULLY". That is an ordering optimised for being cut off, not for
      value. With a declared cap, being cut off was a scheduled certainty. It is
      now merely a contingency (a session ending, an infrastructure blocker), so
      graceful degradation stops being the dominant ordering criterion and value
      takes over. Two consequences follow, plus one conversion.
    change_1_the_substantive_item_moves_to_the_top:
      what: >-
        NC-3 / NC-6 - Heuristic 1's tail validation at the operating point -
        moves from FOURTH to FIRST IN PRIORITY. It becomes the reason BATCH-004
        exists rather than the item BATCH-004 gets to if it survives.
      why: >-
        It was ranked fourth for a scarcity reason and for no other. Its merits
        were never in doubt in the earlier decision, which called it "the
        substantive item of the batch" and recorded heuristic_1_status as "the
        BINDING UNCERTAINTY IN THE PROGRAMME": P0 sits inside every one of the
        eighteen margin rows and a constant-factor error in it moves them all
        identically, and RT-H1..RT-H4 remain open with NC-3 and NC-6 unrun since
        BATCH-001. It also discharges a STANDING OBLIGATION, not a preference:
        agents/coordinator.md and docs/target-result-profile.md require a
        conditional result to be PAIRED with a heuristic-validation experiment
        that samples the relevant distribution at target scale, compares against
        the predicted distribution, and checks tail consistency - and this
        programme has now run three batches downstream of a
        Heuristic-1-conditional theorem without that pairing. An obligation that
        has gone unmet for three batches is not a fourth-ranked item.
      unchanged_gate: >-
        Its feasibility gate is carried VERBATIM and is not softened by the
        absence of a cap: if the sampler required to reach the relevant
        distribution cannot itself be validated, that is reported as an
        infrastructure/feasibility outcome and NEVER as evidence about
        Heuristic 1 (AGENTS.md rule 5). Note precisely what changed and what did
        not: the gate no longer says "within budget", because there is no budget
        - it now fires on the SCIENCE (the sampler cannot be validated), which
        is the stricter reading, and the outcome is recorded in `scope_reached`.
    change_2_one_carried_item_is_promoted:
      what: "L2-WEIGHT is PROMOTED from carried-not-scheduled into BATCH-004."
      why: >-
        Its deprioritization was PURELY a scarce-slot call. Its recorded
        revisit_condition was "fold into any successor analysis record that
        reports a c table; until then MA-4 carries it as an attachment" - i.e.
        it was deferred because a slot was needed elsewhere, not because it
        lacked value. It costs ZERO NEW COMPUTE, reusing RUN-P13VOW-001's
        committed cross-validated Dickman implementation, and it converts MA-4
        from a permanent qualification attached to every citation into a priced
        correction, with a discriminating check fixed in advance (reproduce the
        exact-enumeration values 0.598 at (10^7, 100) and 0.625 at (10^8, 215);
        predicted Delta in [0.55, 1.05] bits at every field size). When the only
        reason for exclusion was scarcity and scarcity is gone, the honest
        response is to include it and say why.
    change_3_what_is_deliberately_still_not_promoted:
      preamble: >-
        THIS IS WHERE THE GUARD IS TESTED. Guard G-1 says capacity is never a
        reason to add work. Three carried controls are therefore examined
        individually and DECLINED ON THEIR MERITS, not carried by inertia and
        not swept in because there is now room.
      items:
        - id: NC2c
          declined_because: >-
            Its deprioritization rationale was SUBSTANTIVE and is unaffected by
            the retirement. DEC-20260802-48c72c stated the case for it fairly -
            it is the only control addressing L4, the largest residual term, and
            it is the separator for RT3-P1's open identifiability collision -
            and then found that its BEST OUTCOME RE-SCOPES the c-programme
            rather than answering the concrete question, because L4 cannot be
            closed without building the batched implementation, which is a
            research project and not a control. None of that reasoning mentioned
            a budget. It therefore still loses.
          revisit_condition_restated_without_scarcity: >-
            It becomes the highest-priority item the moment a batched or
            quasi-linear implementation is actually built, OR if NC-3/NC-6 is
            reported infeasible under its gate - in which case NC2c is the
            successor rather than a competitor.
        - id: NC2a-BAND
          declined_because: >-
            Its revisit condition is "required before gamma_B = 0.810 is ever
            treated as anything but a transient", and gamma_B IS currently
            treated as a transient - MA-5 makes the label mandatory on every
            citation. Nothing is blocked, so nothing is unblocked by running it
            now.
          revisit_condition_restated: >-
            Required before any record treats gamma_B = 0.810 as an asymptotic
            exponent, or reports a multi-octave extrapolation of the Karatsuba
            gain as undiminished.
        - id: NC2f
          declined_because: >-
            Its revisit condition is "required before any margin is ever
            reported as a difference of two MEASURED per-step costs rather than
            measured-minus-nominal". No margin is currently reported that way,
            so the condition has not fired. It is genuinely cheap (~50 lines
            reusing the C-NULL harness) and it addresses the largest UNMEASURED
            term after L4, plausibly worth 5-7 bits back to the attack - which
            is precisely why it must be declined on the condition rather than
            waved in on cheapness. It is recorded as the leading candidate for
            the batch after this one.
    rerank_trigger_converted:
      was: >-
        "If NC2d-PROPER fires FC-4 again on ell >= 47 ... the batch's remaining
        capacity should go to characterising it rather than to NC-3/NC-6."
      now: >-
        AN ADDITION TRIGGER, NOT A SUBSTITUTION TRIGGER. The scientific content
        is unchanged and is reaffirmed: if FC-4 fires again on ell >= 47, L5 is
        contradicted at the ell where it is actually applied, alpha ceases to be
        the smallest term in the corrected law, and characterising it becomes
        high priority - and L5 must be replaced by the MEASURED exponent rather
        than retained. What changes is that this no longer displaces NC-3/NC-6,
        because there is no single slot the two must contest. Both proceed, and
        the alpha-characterisation work is added under a successor contract.
        This is recorded BEFORE the measurement, as the earlier trigger was.
    final_ranking:
      - rank: 1
        id: NC-3 / NC-6
        item: "Heuristic 1 tail validation at the operating point"
        cost: "the substantive item; a sampler must be designed and itself validated"
        moved: "4 -> 1 (promoted; the demotion was scarcity-shaped)"
        why_it_leads: >-
          It tests P0, the only term that multiplies all eighteen margin rows
          identically, untested in three of three batches; and it discharges the
          coordinator-contract pairing obligation for a heuristic-conditional
          result.
      - rank: 2
        id: NC2d-PROPER
        item: >-
          Re-run C-PSCALE at the SAME three primes at ell in {47, 101, 151, 211}
          - the range where the p-scaling is actually applied - at 4 j.
          PRE-REGISTER, unchanged from DEC-20260802-48c72c: alpha_primary in
          [0.85, 1.15]; |alpha_primary - alpha_null| <= 0.15; no residual trend
          of alpha_hat in ell.
        cost: "minutes; Phi_ell already acquired for all four degrees, two of the three primes already measured, the p3 arm free"
        moved: "1 -> 2 in priority; FIRST in dispatch order, see dispatch_note"
        why: >-
          It is the ONLY LEGITIMATE WAY to retire the FIRED FC-4 /
          MECHANISM-INCONSISTENT designation - BY MEASUREMENT. A post-hoc
          restriction of the ell-grid cannot lift a pre-registered falsifier,
          however good the diagnosis, and DEC-20260802-48c72c adopted that
          reasoning against its own convenience. Its rank fell only because
          something with more at stake rose above it; nothing about it weakened.
      - rank: 3
        id: BIBLIO
        item: >-
          Retrieve Sutherland (ANTS X, 2013) and the frozen bibliography's [15]
          (Santos-Costello-Shi) and [3] (Adj et al.).
        cost: "zero compute"
        moved: "3 -> 3 (unchanged)"
        why: >-
          Named as necessary in THREE CONSECUTIVE red-team reports and executed
          in none. It is the only route to quantifying the baseline constant k,
          which sits under every margin row and is unquantified after three
          batches - in the attack's disfavour if k > 1. It addresses an
          UNQUANTIFIED term, which is why it stays above L2-WEIGHT's already
          quantified one. It is binding, not optional.
      - rank: 4
        id: NC2b-SLOPE
        item: >-
          Synthetic slope null: multiply the committed null series pointwise by
          ell^s for declared s in {0.4, 0.8} and require the corrected estimator
          to recover s*log2(B_opt) + REF_null to within the same 0.75 bits at
          every field size.
        cost: "zero compute; arithmetic on 47 committed numbers"
        moved: "2 -> 4 in priority; unchanged in substance and still binding"
        why: >-
          It is the ONLY proposed gate with power against L1. The NC2b-G1 PASS
          validates LEVEL RETENTION only, on a series flat by construction, at
          about 1.4 noise half-widths (MA-7) - a flat null extrapolates
          trivially. A synthetic object with a KNOWN NON-ZERO exponent tests the
          part of the estimator the flat null cannot reach.
      - rank: 5
        id: L2-WEIGHT
        item: >-
          Evaluate the entry-weighted mean of ell^gamma using RUN-P13VOW-001's
          committed cross-validated Dickman implementation. Predicted Delta in
          [0.55, 1.05] bits at every field size; discriminating check: reproduce
          the exact-enumeration values 0.598 at (10^7, 100) and 0.625 at
          (10^8, 215).
        cost: "zero new compute"
        moved: "PROMOTED from carried-not-scheduled (change_2)"
        why: "Its only reason for exclusion was a scarce slot, and that reason is void."
    dispatch_note: >-
      PRIORITY ORDER IS NOT DISPATCH ORDER, AND THE TWO ARE DISTINGUISHED HERE
      DELIBERATELY. NC2d-PROPER, NC2b-SLOPE, L2-WEIGHT and BIBLIO hold disjoint
      write scopes and cost minutes or nothing; they may be dispatched first and
      concurrently, subject to max_concurrent: 3, while NC-3/NC-6's contract is
      being specified and frozen. That is a scheduling fact about wall-clock
      availability. It is NOT a re-ranking, and no record may cite dispatch
      order as priority. NC-3/NC-6 is what this batch is FOR.
    contract_freezing_requirement: >-
      NC-3/NC-6 and NC2d-PROPER each require a frozen contract with
      pre-registered predictions, tolerances, windows, estimators and failure
      consequences fixed BEFORE any datum exists, under a NEW EXP id -
      EXP-PEC-49c773 is not edited. NC2d-PROPER's pre-registered values are
      already fixed above and in DEC-20260802-48c72c and may not be adjusted
      after seeing data without a versioned protocol_amendment.
    honest_note_on_this_rerank: >-
      This rerank moves two items and adds one; it does not discover new
      science, and it should not be read as one. It is recorded because the
      earlier ordering carried a stated rationale ("so that a truncation
      degrades gracefully") that the harness change invalidated, and leaving an
      invalidated rationale in force would be the quiet kind of drift this
      decision exists to guard against.

  # ------------------------------------------------------------------
  # (E) BINDING REMEDIES CARRIED FORWARD
  # ------------------------------------------------------------------
  binding_remedies_carried_forward:
    - id: REM-1
      name: "The BATCH-004 ledger archive write_scope must include the knowledge corpus"
      binding_text: >-
        THE BATCH-004 LEDGER ARCHIVE TASK MUST CARRY knowledge/findings/ AND
        knowledge/INDEX.md IN ITS write_scope, and MUST name the promoted
        KN-FIND in its archive.record_ids, shipping the entry and the
        regenerated index IN THE SAME COMMIT per the /curate-knowledge
        convention.
      why_it_is_restated_here: >-
        THE PROMOTION HAS NOW BEEN DEFERRED TWICE FOR THE SAME TASK-CARD SCOPING
        OMISSION, and both times the reason was a scoping omission rather than a
        research judgement. DEC-20260802-8227b9 scheduled it into the BATCH-003
        archive; DEC-20260802-48c72c found knowledge/findings/ and
        knowledge/INDEX.md outside TASK-20260802-c1f7c8's declared write scope,
        which is dispositive - writing outside a declared scope is a
        scope-expanding commit and an evidence-integrity failure, not a shortcut
        available under pressure. The revisit condition has FIRED (NC2b is on
        the record with its gate passed; NC2a confirmed the composition
        explanation) and the content is stable. A third deferral for the same
        reason would be a process failure and is pre-emptively refused here.
      content_fixed_in_advance_and_not_reopened: >-
        The promotable object is the ESTIMATOR LEMMA AND THE PAIRING RULE, NOT
        ANY c VALUE: "an intercept is only meaningful paired with the slope of
        the same fit of the same series over the same window; a slope-only
        calibration law reports ZERO overhead for an object carrying a large
        constant one", with its two instances (the C-NULL counterexample, where
        the slope-only law returns c ~ 0 for an object measured at
        2^12.26-2^12.32 and misses by up to 12.605090 bits; and this batch's
        A-3 absorption, converting a 2.4-bit unpaired excursion outside the
        published bracket into a 1.007-bit correctly-paired one inside it),
        proof_status `derivation`, proof_refs as EV-PEC-857664.proof_refs. NO c
        VALUE ENTERS THE CORPUS - a caveated figure in the corpus will be quoted
        without its caveats. The KN-TECH candidate (null-object control on an
        EXPLANATION rather than on a signal) remains a candidate to be judged in
        BATCH-004, not pre-approved.
    - id: REM-2
      name: "INCIDENT-20260802-P13-03: a dispatch prompt may not amend a frozen contract"
      binding_text: >-
        NO BATCH-004 HANDOFF MAY DIRECT AN EXECUTION ORDER, TOLERANCE, WINDOW,
        ESTIMATOR OR PREDICTION THAT DIFFERS FROM THE FROZEN CONTRACT IT
        DISPATCHES. If an order or parameter must change, the instrument is a
        versioned protocol_amendment recorded BEFORE execution, or a superseding
        contract - never a dispatch message.
      why_it_is_restated_here: >-
        It is a COORDINATOR DEFECT, recorded against this role. In
        RUN-PEC-49c773-a, C-PSCALE's measurement arms ran immediately after
        acquisition rather than at the frozen execution_order step 11, on the
        authority of the dispatching Coordinator's handoff message. The Executor
        handled it correctly - it recorded the deviation openly with its
        authority NAMED rather than silently complying - and the deviation was
        independently verified materially harmless (each p-arm runs in a forked
        child so the process-global prime cannot leak, and C-REPRO, independently
        reconstructed by the Validator, shows the parent's 884 overlapping
        samples bit-for-bit identical to the superseded run). Harmless once is
        not a licence. The remedy binds BATCH-004 unchanged.
      note_on_the_original_incident_text: >-
        The incident record observes that "the >= 900 s budget gate was moot
        (791.751 s of 5400)". That is an immutable account of a past run's
        contract gate and is left exactly as written; it is history, not a live
        budget, and the retirement neither edits nor invalidates it.

