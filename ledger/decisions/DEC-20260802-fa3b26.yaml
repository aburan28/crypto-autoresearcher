  rationale:
    - >-
      A decision clause whose operative term has been deleted from the schema is
      not a rule anyone can apply. `closed_at_budget` is rejected by
      tools/validate_ledger.py for this goal and `maximum_batches` is not a
      field of a research_goal, so DEC-20260802-48c72c's terminal
      pre-commitment could not be executed as written. Superseding it explicitly
      is the only correction AGENTS.md rule 4 permits; editing it is forbidden
      and leaving it in force would put an unexecutable instruction at the head
      of the goal.
    - >-
      The supersession is kept as narrow as the defect. Two grounds are named,
      each independently sufficient, and every clause of DEC-20260802-48c72c
      that does not depend on them is left standing and is listed as standing.
      A governance correction that quietly widened into a re-adjudication of
      evidence would be the worse failure.
    - >-
      The unreachability of criterion 1 is reaffirmed rather than reopened
      because its two supports never referred to a budget: an unimplemented
      subroutine worth 11.50-13.25 bits cannot be measured by any amount of
      uncapped time, and gamma = exponent(M) - 1 <= 1 is a property of the
      method. Removing a cap changes what is permitted, not what is possible,
      and a record that let the retirement soften that assessment would be
      manufacturing progress out of a schema change.
    - >-
      The campaign-end standard is the substantive content of this decision. A
      cap is a bad stopping rule but it is a stopping rule; removing it without
      replacement would make "continue" the default, and a default is not a
      decision. The standard makes continuing and stopping symmetrically
      accountable: stopping needs an obstruction, an argument and a revival
      condition (END-2, docs/inventor-protocol.md section 4); continuing needs a
      ranked item of material value named in a decision before dispatch (G-2).
      Neither may rest on capacity (G-1).
    - >-
      The BATCH-004 ranking is genuinely re-done rather than rubber-stamped,
      because the earlier ordering carried an explicit rationale - cheap items
      first "so that a truncation degrades gracefully" - that the harness change
      invalidated. Re-ranking on value promotes the item that discharges a
      standing pairing obligation and tests the only term that multiplies every
      margin row, and admits the one carried control whose sole reason for
      exclusion was a scarce slot.
    - >-
      Three carried controls are examined and DECLINED ON THEIR MERITS in the
      same breath. That is the load-bearing half of the rerank: if removing the
      cap simply enlarged the batch, the guard against unbounded drift would be
      decorative on the day it was written. NC2c loses on the reasoning
      DEC-20260802-48c72c already gave, which never mentioned a budget;
      NC2a-BAND and NC2f lose because their own revisit conditions have not
      fired.
    - >-
      The two remedies are restated because both are failures of THIS role, not
      of the Executor: a task-card scoping omission that has now deferred a
      scheduled knowledge promotion twice, and a dispatch message that amended a
      frozen protocol. Carrying a Coordinator defect forward in the record that
      dispatches the next batch is the only mechanism that makes it binding.

