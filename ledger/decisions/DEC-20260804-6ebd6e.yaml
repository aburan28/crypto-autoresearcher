coordinator_decision:
  id: DEC-20260804-6ebd6e
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-68471b
  batch_number: 3
  recorded_at: '2026-08-04'

  decision: refine
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.
  decision_label: >-
    Batch 3 produced a statistically significant variance ratio (1.39, p=0.001)
    that cannot be attributed to sampling noise (n=150) but cannot be attributed
    to genuine inter-vector correlation either, because the red team identified
    a blocking QEMU emulation confound. Batch 4 refines the measurement design
    by adding native x86_64 hardware as a control.

  context: >-
    GOAL-MLKEM-004 BATCH-68471b (batch 3 of 6). 150 bgj1_sieve runs in Docker
    linux/amd64 via QEMU on ARM64 host. Validator: accept (all 5 checks pass;
    empirical_var_TN=8492.31 confirmed). Red Team: blocking_objections on
    OBJ-QEMU (environment shift of -107 T_N units confirmed across batches 2
    and 3) and OBJ-OUTLIER (3 runs with z≈2.60 drive p from 0.034 to 0.001).
    Snapshot a54fe74d.

  evidence_refs:
    - EV-MLKEM-d8f627

  rationale: >-
    The statistical result is genuine within the QEMU environment: chi2(149)=207.3,
    p=0.001, 95% CI [1.12, 1.77]. The Shapiro-Wilk test confirms T_N values are
    approximately Normal (W=0.9907, p=0.43). The 150 seeds are distinct with no
    seed-index correlation. These properties are verified and not disputed.
    The blocking objection is not about the arithmetic but about the platform:
    QEMU demonstrably shifts the sieve distribution, and the variance inflation
    could be an emulation artifact rather than genuine inter-vector correlation.
    The cheapest decisive test is to run the 3 outlier seeds plus run-0 on native
    x86_64. This is not a new experiment — it reuses the same seeds and same code
    on different hardware. If the result persists natively, it is a genuine signal
    about bgj1_sieve vector correlation at these parameters.

  what_survives:
    - >-
      variance_ratio = 1.3916 in the QEMU/Docker linux/amd64 environment is a
      confirmed, validated observation with p=0.001 and 95% CI [1.12, 1.77].
    - >-
      The systematic mean-score shortfall (-107 T_N units vs batch-1 native Linux)
      is confirmed as a stable property of the QEMU environment across batches 2
      and 3 (batch-2 delta=-103.9; batch-3 delta=-107.1).
    - >-
      The chi-squared test is arithmetically correct; the question is whether its
      inputs (sieve vectors from QEMU) are representative of what the mathematical
      question asks about.

  what_is_blocked:
    - >-
      Any conclusion about whether the independence assumption Var[T_N]=N*Var[s_i]
      holds in the actual sieve (not QEMU-emulated sieve) at these parameters.
      OBJ-QEMU blocks that conclusion until native hardware control is run.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The result is statistically significant within the QEMU environment but
      blocked by OBJ-QEMU as a native-hardware conclusion. No finding is ripe
      for promotion. The QEMU environment characterisation (systematic -107 T_N
      shift) is an instrument observation, not a mathematical finding.
      Rule 12 UNMET and UNWAIVED throughout.

  next_actions:
    - >-
      Open BATCH-6ec7a4 (batch 4 of 6). DECISIVE: run outlier seeds
      {2941775225, 26883012, 2418421570} plus run-0 seed {first seed from
      default_rng(20260804001)} on NATIVE x86_64 Linux (not QEMU emulated).
      Options: AWS EC2 or GCP with Linux x86_64, or any bare-metal Linux x86_64
      available to the harness. If native x86_64 is unavailable, record
      infrastructure_blocked and the harness assesses the QEMU result on its own
      terms. Also run null control (score wrong secret s*≠s) in the QEMU
      environment to test OBJ-OUTLIER hypothesis (environmental variance inflation
      should show ratio>1 for null too; genuine correlation should show ratio≈1
      for null). Budget: maximum_runs 20 (4 native seeds + 4 null control seeds
      + 12 spare).

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
