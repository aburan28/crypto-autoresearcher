# DEC-20261016-cc8e56 — approve the timed isogenous-model scalar
# multiplication EXP-ENDO-33a1ee. The standing authorization of 2026-09-06 is
# the user-approval basis.
coordinator_decision:
  id: DEC-20261016-cc8e56
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  question_ids:
    - RQ-ENDO-476761
  goal_id: GOAL-ENDO-001
  goal_binding: >-
    RQ-ENDO-476761 was bound to GOAL-ENDO-001 by DEC-20261016-5cd7e2, and
    this decision keeps that binding. The bound functional is known-scalar
    multiplication cost, not an attack cost. No result of EXP-ENDO-33a1ee
    changes an ECDLP claim of that goal.
  archived_by: TASK-20261016-8a9451
  mode: design_experiment_approved
  standing_authorization: >-
    The standing user authorization in AGENTS.md (user instruction,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved") is the user-approval basis. The Coordinator checked the
    controls, the gates and their resolution, the metrics, the stopping and
    invalidation rules, the artifact paths, the budget, and that the
    success, falsification and inconclusive criteria are distinct.
  decision: approve
  decision_label: >-
    Approve H-ENDO-c9f324 (specified -> approved) and the frozen runnable
    contract EXP-ENDO-33a1ee for one measured wall-clock run,
    RUN-ENDO-bc1b14.
  target_ids:
    - RQ-ENDO-476761
    - IDEA-20261016-15a6fc
    - H-ENDO-c9f324
    - EXP-ENDO-33a1ee
    - TASK-20261016-1aa07a
    - TASK-20261016-8a9451
    - RUN-ENDO-bc1b14
  context: >-
    RUN-ENDO-d7cb69 (EXP-ENDO-25ad84) recorded modelled model-change gains
    only. other/BADA55-VPR-224 is the only population curve with a positive
    gain and no small D_K (|D_K| > 2e6), so no 2-GLV on E competes with it.
    Its modelled gains over the 5*5 route to an a = -3-equivalent neighbour
    are persistent +15.205 % and one-shot +11.441 %. IDEA-20261016-15a6fc
    requires a wall-clock measurement before any speed statement. The
    launcher (harness/endosweep/isobench/, run.py, check.py) is implemented
    and smoke-tested. Development smoke runs at 8 points and 5 to 6
    repetitions found and fixed an inversion bug, then gave A1/A0 about
    0.90, A2/A0 about 0.93 and A3/A0 0.98 to 1.00 on both curves. They are
    disclosed in the specification and are not evidence. Neither
    RUN-ENDO-d7cb69 nor RUN-ENDO-795989 (EXP-ENDO-7494e7) has an evidence
    review yet.
  rationale:
    - >-
      The contract reduces one decision-changing uncertainty: whether the
      only GLV-free model-change gain of EXP-ENDO-25ad84 survives in
      wall-clock once the route, the scalar adjustment, the additions, the
      inversion and the field overhead are paid. A positive result makes the
      curve a candidate for the independent-runner replication. A negative
      or unresolved result keeps the gain at the modelled tier.
    - >-
      There are three gates, each fixed before data. Correctness of every
      arm against a Python reference voids the run on any mismatch. An A/A
      arm (A3/A0 CI containing 1, within [0.95, 1.05]) runs on each curve.
      A positive control on the P-256 neighbour, where the a = -3 saving is
      known, requires A1/A0 upper bound < 1. The specification's
      gate_resolution says which gate releases which inference, and that a
      failed gate withholds labels without relaxation or rerun.
    - >-
      The arms run on identical (P, k) pairs, interleaved and rotated per
      repetition, in one implementation. This removes the
      implementation-quality confound between arms. It does not remove the
      host confound, which is disclosed with the named replication.
    - >-
      The falsification branch maps to weaken plus replication, never
      reject_scoped, because this is a single unreplicated empirical-only
      run.
    - >-
      This is a constant-factor, known-scalar question, not an
      exponent-targeting one. It is admitted because it is cheap (two
      curves, 1 h watchdog, 1 GB) and closes the modelled-versus-measured
      gap on the one positive result of EXP-ENDO-25ad84 that no GLV
      dominates. It does not displace exponent-targeting work.
    - The approval covers the driver, the checker, the instrument, the trial plan and the executor card.
  evidence_refs:
    - ledger/proposals/IDEA-20261016-15a6fc.yaml
    - ledger/questions/RQ-ENDO-476761.yaml
    - ledger/hypotheses/H-ENDO-c9f324.yaml
    - experiments/EXP-ENDO-33a1ee/specification.yaml
    - experiments/EXP-ENDO-25ad84/specification.yaml
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
    - research/endosweep_curves_20261006/curves.md
    - harness/endosweep/isobench/isobench.py
    - harness/endosweep/isobench/bench.c
    - harness/endosweep/isobench/maps.py
    - experiments/EXP-ENDO-33a1ee/implementation/run.py
    - experiments/EXP-ENDO-33a1ee/implementation/check.py
  runnable_condition: >-
    Approval requires tools/newest_experiments.py --experiment
    EXP-ENDO-33a1ee to report execution_state ready, with trial-plan.json
    present and the trial_plan_sha256 of TASK-20261016-1aa07a filled in
    (it is TO_BE_FILLED when this record is written). The source rows
    experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json must be
    committed with sha256
    0576225d496168485a8c30d5d460edab1ab969e7cd3a4d7850e43406a65282da. A C
    compiler must be available as $CC or cc. The dispatching session
    confirms all three before committing this record.
  limitations:
    - >-
      The claim tier is measured wall-clock on one shared cloud host with no
      pinning or isolation. A positive result is scoped to this curve, host,
      compiler, flags and bench.c, and does not transfer.
    - >-
      Both arms use a generic CIOS implementation with S = M. Nothing
      transfers to an optimised library or a tuned A0.
    - >-
      The prediction and the A/A margin were written with the development
      smoke values in view. The criteria are interval-sign criteria and do
      not use those values.
    - >-
      The modelled comparison figures and the curve selection come from
      RUN-ENDO-d7cb69, which has had no evidence review. A defect found
      there propagates here.
    - Heuristics H1-H3 of the idea are not validated here.
    - Wall time is never a measured bound (AGENTS.md). No ECDLP, rho or exponent figure moves.
    - This decision does not launch the executor and does not edit the idea, the question, H-ENDO-5a33ae or H-ENDO-f58749.
  next_actions:
    - The executor runs experiments/EXP-ENDO-33a1ee/trial-plan.json once under TASK-20261016-1aa07a and records observations only.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of a protocol is not a result. No evidence record is created
      here.
