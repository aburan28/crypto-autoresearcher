coordinator_decision:
  id: DEC-20261005-1f5fae
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at 7ab85b985a. IDEA-20261004-edbd24 already
    has an E[2] contract, H-SSI-d4f424. That contract excludes
    every torsion module other than E[2]. The same eight
    endomorphisms have not been read on E[4].
  decision: approve
  target_ids:
    - IDEA-20261004-edbd24
    - H-SSI-cb227f
    - EXP-SSI-494592
  rationale:
    - >-
      SSI is an ECC area. The contract partitions eight
      endomorphisms of y^2 = x^3 + x by their fixed points in
      E[4] at primes 7, 11, and 19.
    - >-
      A design-session count, not a run, gave fiber counts
      7, 5, 5. Both Frobenius routes must recompute the
      membership.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-SSI-d4f424 and EXP-SSI-f08a63 are not edited.
  evidence_refs: []
  limitations:
    - The module has sixteen points. The interface is equality bits only.
    - iota and iota^3 fix the same points for an algebraic reason that is not special to E[4].
    - Approval authorizes six deterministic runs. It does not assert the fibers.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-727122 until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
