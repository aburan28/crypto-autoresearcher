  rulings:
    - id: R-1
      concerns: Reuse the n = 19 curve of RUN-CERTBIN-0b8f3a, or draw a new one?
      ruling: >-
        REUSE, as literal parameters: modulus t^19 + t^5 + t^2 + t + 1, A = 46693,
        B = 306147, #E = 523646 = 2 x 261823, P, Q, k_Q (read from
        experiments/EXP-CERTBIN-a58c63/runs/RUN-CERTBIN-0b8f3a/cells.json block
        n19-l6 and selftest.json block n19_modulus).
      basis:
        - >-
          It was chosen by frozen rules (the lexicographically smallest
          irreducible pentanomial; the Stage-1 curve rule from
          S_curve19 = 2026092420001; the Stage-1 point rule from
          S_pts19 = 2026092420002), before any l = 10 measurement existed
          anywhere in the program. Reuse therefore carries no selection on this
          contract's outcome. Drawing again would need a rule invented now.
        - >-
          It makes the n = 19 cell one object across lanes: the same field and
          curve carry EXP-CERTBIN-a58c63's trace cells at l in {5, 6}.
        - >-
          With h = 2 the order-q subgroup is exactly 2E, so the primary arm is
          exactly the x(2E) stratum of the split, and the recorded C-TR check
          of RUN-CERTBIN-0b8f3a (x in x(2E) iff Tr(x) = Tr(A) on x(E), 0
          violations over n_xE = 261823) matches the classification this
          contract re-checks per draw (C-TR19).
        - >-
          No evidentiary dependence: RUN-CERTBIN-0b8f3a's review status is not
          established by any file read here, so the values are frozen as
          literals in the specification and C-SELF / C-CURVE re-derive every
          property used (irreducibility and the rule's rejections, the exact
          point count, primality of q, P, Q, k_Q, Tr(A)).
      cost_disclosed: >-
        The n = 17 cell has h = 4 (subgroup targets in x(4E)); this curve has
        h = 2 (x(2E)). n, cofactor and target class change together, so an
        n = 19 versus n = 17 difference is quoted as "the n = 19 cell (h = 2)
        against the n = 17 cell (h = 4)", never as the effect of n.
        EXP-CERTBIN-3f06d1's h = 2 cell at n = 17 calibrates the M_4 side.
        REVISIT CONDITION: if that review finds its h = 2 M_4 rate's CP95
        disjoint from [0.799, 0.875], or if N19-DR-1 returns PARTIAL, the
        successor is a second n = 19 curve with h = 4.
    - id: R-2
      concerns: Is a new hypothesis warranted?
      ruling: YES, H-CERTBIN-e3ac93.
      basis: >-
        Persistence in n is a claim of no existing hypothesis:
        H-CERTBIN-5e71c9's C1-C3 are at n = 17 and its test_boundary excludes
        "any n other than 17"; H-CERTBIN-be6cbd is n = 17 only;
        H-CERTBIN-b20d4e's n = 19 prediction concerns regime-B trace breaks.
        Stretching H-CERTBIN-5e71c9 would edit an immutable, analyzed record.
    - id: R-3
      concerns: Does IDEA-20260923-5d0b8e already cover the n = 19 cell?
      ruling: NO. IDEA-20260924-132822 is used, and is Coordinator-authored with its provenance stated.
      basis: >-
        IDEA-20260923-5d0b8e lists n = 19 in its Stage 3 for trace retention
        at D in {3, 4}. It defines no W_4, no refutation-rate comparison in n,
        no substituted profile and no N-ELL / N-CONV control. The cell's
        actual sources are KN-OPEN-3c8f51 criterion 2 and DEC-20260924-e61f3b
        NA-3.
    - id: R-4
      concerns: What "about 400 subgroup targets" counts
      ruling: >-
        400 UNSATISFIABLE non-degenerate subgroup-target attempts, the rate's
        denominator (n = 17: 386 of 1000 targets were unsatisfiable,
        KN-OPEN-3c8f51). 100 satisfiable ones are kept as soundness controls.
        Fixed by draw order, unconditioned on any closure outcome.
    - id: R-5
      concerns: N-CONV-type arm at n = 19 (NA-3 third bullet)
      ruling: >-
        CARRIED (N-CONV19: S_3's exact quadratic part at 200 primary x_R,
        random lower-degree bits on S_3's support, C-TOP19). Approval is
        therefore NOT gated on EXP-CERTBIN-ddfe75's result. The arm is
        secondary (N19-DR-5); the n = 17 reading of N-CONV stays ddfe75's.
        Its construction is defined self-contained in EXP-CERTBIN-060020
        (ddfe75 was uncommitted when read; the wdag-v1 format is restated with
        (nv, neq) = (20, 19), and this contract's text governs).
    - id: R-6
      concerns: D >= 5 closures
      ruling: >-
        NONE. D <= 5 cleanliness is not a discriminating statistic at n = 19
        (OBJ-4, RC-C; the semi-regular D_reg is 5 there, RT-20260924-d95e70
        J8), and the M_5-null reading is an unnumbered heuristic (OBJ-8).
        Nothing is priced at m = 3 (N19-DR-9 only flags eligibility).
    - id: R-7
      concerns: Engine pin and authorship (user instruction)
      ruling: >-
        crypto_autoresearcher.gf2 pinned at 934bee5 with _kernels.c sha256
        c8f79d5961fffaf80428cdd29d0a53bfcc1e6d32ab07022931e3aacd926ca745,
        CRYPTO_AR_GF2_BACKEND=native with build_info in the manifest, and a
        pre-draw provenance control (C-ENGINE: tree rule, hashes,
        tests/test_gf2_kernels.py, tools/gf2_replay_rc1.py --limit 1062, i.e.
        all RC-1 records) recorded before the first frozen draw. Because the
        replay covers nv = 18 only, C-SELF (ix) adds native-versus-reference at
        nv = 20. impl/ holds only n = 19-specific code. The engine's author is
        the dispatching session, so the review's certificate verification must
        be author-independent (a session that is neither the dispatching
        session nor the executor, reading none of impl/, verifier/ or the
        package).
    - id: R-8
      concerns: Evidence for the adverse direction (E-DECAY)
      ruling: >-
        Every primary-arm non-refutation carries an ann-v1 certificate (a
        closed superspace of M_4 without 1; soundness derived in the
        specification), plus C-BACKEND, C-LIT and C-T4 on those systems. This
        is the strongest checkable refutation artifact for a later adverse
        transition on C-P, archived with the run, before any such decision
        (docs/claims-and-verification.md, "Refutation artifacts").
    - id: R-9
      concerns: Focus and concurrency
      ruling: >-
        tools/autoresearch_focus.py was not run (no shell). DEC-20260924-e61f3b
        permits this design concurrently with N-CONV. Dispatch of
        TASK-20260924-a50c5b requires that at most three CERTBIN executors run
        at once on the 4-core, 15 GB machine within their memory caps
        (DEC-20260924-8e2f47 concurrency); otherwise it waits in order.

