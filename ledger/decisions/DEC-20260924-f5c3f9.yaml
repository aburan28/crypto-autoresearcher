  rationale:
    - >-
      WHY NOW. The na5_ruling decided GO on the D = 4 signal, and the design
      needs nothing that is still open: the N-CONV-type arm is carried at
      n = 19 itself, so NA-3's alternative gate (wait for NA-2's review) does
      not apply.
    - >-
      WHY THIS DESIGN. It reads item (B) on the statistic that carried S_3
      content at n = 17 (W_4, beside M_4), computes the substituted profile
      before any semi-regular expectation is scored (the failure mode of
      prior (a)), and puts beside it exactly the objects that can prove too
      much: N-ELL19 and same-support nulls at W_4, and N-CONV19 to locate the
      tensor. The adverse direction is made certifiable (ann-v1).
    - >-
      TARGET-PROFILE HONESTY. Toy tier; sota_delta zero; oracle A per attempt
      and parallel rho (about 450 group operations at q = 261823, Coordinator
      arithmetic) dominate. Refutation degree along the diagonal is
      exponent-adjacent only; the lane stays ranked within CERTBIN, not above
      exponent-targeting ECC work. Two values of n are not a trend.

