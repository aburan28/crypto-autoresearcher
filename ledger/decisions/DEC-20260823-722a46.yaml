coordinator_decision:
  id: DEC-20260823-722a46
  context: >-
    BATCH-8b08ef is the fourth and final batch of GOAL-ECQ-002 under the declared campaign
    budget (maximum 4 batches, 21600 s). The producer TASK-20260823-827765 ran the pre-
    registered job (EXP-ECQ-0e0cbb): squarefree-discriminant pre-filtered enumeration of the
    high-ceiling low-content stratum, full-T-box rank search, and the owed null objects. It
    returned BRANCH C: coverage 138/146 (SET A) and 38/5549 (SET B), a stratum population
    count of 2, and no certified rank-12 fibre below the benchmark. Two blind reviewers
    (validator TASK-20260823-cb510c, red team TASK-20260823-d03635) reviewed the snapshot
    archive TASK-20260823-8ea188. The validator PASSed the measurement (heights, ranks,
    ceilings, provenance, coverage; 103/103 hashes). The red team sustained three objections,
    the critical one (OBJ-001) being that the RT-CONTROL-2 null object is defective: 12 of 13
    rung fibres were alarm-interrupted, not measured, and the report misreports them as
    "13 measured, 0 refused."
  decision: >-
    ACCEPT THE VALIDATED BRANCH-C RESULT; WITHDRAW THE RT-CONTROL-2 RANK-DISTRIBUTION
    CONTRAST; RECORD C1' NOT MET, C2 MET (UNCHANGED); PERFORM THE PRE-DECLARED BUDGET
    TRANSITION. Pause condition P1 fires when this batch closes (the campaign budget is
    exhausted at 4 batches), and GOAL-ECQ-002 moves to closed_at_budget because BATCH-8b08ef
    does not meet C1'. That status asserts no success and is not used to understate any
    criterion that was met: C2 was met earlier (DEC-20260823-51726e) and is recorded as met;
    C1' was not met and is recorded as not met. No extension past this batch is granted or
    implied; a batch 5 requires a new Coordinator decision with a recorded rationale and is
    never a silent bump.
  decision_verb_scope: >-
    This decision closes the goal at budget and disposes of the batch's reviewed result. It
    does not close the tuple lever (branch B was not reached), does not reject H-ECQ-0ed5c8,
    and does not adjudicate the RT-CONTROL-2 re-run (that is a next action, not a finding of
    this batch).
  target_ids:
  - GOAL-ECQ-002
  - H-ECQ-0ed5c8
  - BATCH-8b08ef
  - EV-ECQ-5c2c0a
  hypothesis_status_change:
    from: proposed
    to: inconclusive
    note: >-
      The hypothesis file's status field is `proposed` and is NOT edited by this
      archive, matching the campaign's standing convention (H-ECQ-8b600d was left
      `proposed` in its file while its ledger archive recorded the transition). The
      authoritative transition is this record plus the checkpoint shard. The
      hypothesis passed through running and analyzed in substance -- the producer
      ran against it and two blind reviewers analyzed it -- but the Coordinator had
      not yet recorded an intermediate status, so the recorded `from` is the file's
      value.
    rationale: >-
      Branch C of H-ECQ-0ed5c8 fired: neither the positive branch (a certified rank->=12
      fibre below the benchmark) nor the closure branch (full coverage returning none) was
      reached, because coverage is 0.9452 / 0.0068, not 1.00. Under branch C no negative is
      claimed and the coverage fraction plus the population count are the result. The
      Coordinator's pre-registered density prior (P1, >= 200 families) is contradicted (2
      found), which weakens the expectation that the stratum is a rich vein, but the lever is
      neither supported nor closed. Inconclusive is the honest status: the tested corner is
      measured sparse at this coverage, and full coverage was not reached.
  goal_status_change:
    from: active
    to: closed_at_budget
    rationale: >-
      P1 (campaign budget exhausted: 4 batches) fires when this batch closes. C1' is not met
      (no cell taken; condition 1 fails because the best curve is on Mestre's published
      tuple A). The pre-declared transition of DEC-20260823-ee9162 N2 is performed: the goal
      moves to closed_at_budget. This status asserts no success.
  rationale: >-
    The measurement is validated by two blind, independent reviewers who share no code with
    the producer: the best candidate's height re-derives exactly (118.22777364040874), its
    rank re-certifies (r_low = r_high = 12), 15/15 family ceilings re-derive (with the
    additive-fibre correction), the pre-filter has 0 false negatives over 16754 families, the
    provenance is PROVABLY ABSENT from the frozen snapshot and Cremona's tables, and the
    coverage fractions reconstruct from the row-level data. The red team's critical objection
    (OBJ-001) concerns a CONTROL (RT-CONTROL-2), not the branch-C result: the rank-
    distribution contrast is withdrawn because 12 of 13 rung fibres are infrastructure
    outcomes, not certified rank 0. The branch-C result (coverage, population count, no cell)
    does not depend on that control and stands. The goal closes at budget with the lever
    inconclusive and the stratum measured sparse.
  evidence_refs:
  - EV-ECQ-5c2c0a
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c/verdict.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-d03635/objections.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/archives/TASK-20260823-8ea188/receipt.yaml
  citations:
  - ref: DEC-20260823-ee9162
    provenance: internal
    claim: The pre-declared budget transition (N2) and the branch semantics (N1) this decision performs.
    verified_by: TASK-20260823-3eedf3
  - ref: DEC-20260823-51726e
    provenance: internal
    claim: C2 is met, with four recorded qualifications. Relied on here and neither re-litigated nor strengthened.
    verified_by: TASK-20260823-3eedf3
  citations_note: >-
    The two citations above are both provenance `internal` with a named
    verified_by. The standing scope guard that RANK >= 31 OVER Q REMAINS AN OPEN
    WORLD RECORD (30, Alpoge-Howell 2026) is NOT carried as a citation entry
    because its provenance is `recalled` and unverified (red-team OBJ-003), and a
    `recalled` reference may not back a decision (AGENTS.md rule 9). It is stated
    in the limitations and in the evidence record's B-3 and the checkpoint's
    scope_statement as a recalled, unverified guard that RESTRICTS what may be
    claimed -- conservative in the direction that matters whether or not the
    figure 30 is exact -- and it is flagged for verification through the
    knowledge base in next_actions. No rationale in this decision rests on it.
  limitations:
  - >-
    The RT-CONTROL-2 null object is defective (OBJ-001, OBJ-002). The rank-vs-size contrast
    is withdrawn, not corrected, in this record; correcting it requires re-running the 12
    alarm-interrupted fibres and constructing the trace map, which is a next action outside
    this batch's budget.
  - >-
    The Cremona check (C1' condition 4) was not performed (offline; PARI elldata not
    installed). The conductor bound (all >= 500000) is decisive only in the absent direction
    and is labelled as such.
  next_actions:
  - >-
    IF GOAL-ECQ-002 IS REVISITED (a new Coordinator decision with a recorded rationale, never
    a silent bump), the first actions are the red team's: (1) correct the RT-CONTROL-2
    summary fields (n_rungs_measured: 1, not 13; rung_certified_rank_distribution {"1": 1},
    not {"0": 12, "1": 1}); (2) re-run the 12 alarm-interrupted rung fibres at a 90 s+ alarm
    to either certify rank 0 or find rational points; (3) construct the trace map P + P^sigma
    for at least one rung family at its envelope argmin; (4) verify the Alpoge-Howell 2026
    citation through the knowledge base.
  revisit_condition: >-
    Resume or re-scope GOAL-ECQ-002 if any of these changes a number it has published: (i) a
    certified rank->=12 fibre with naive height below 79.32867457792244 is found in a larger
    box or at full coverage of the declared stratum; (ii) the 12 alarm-interrupted RT-
    CONTROL-2 fibres, re-run at a longer alarm, certify rank 0 (validating the null) or find
    rational points (invalidating it); (iii) the trace map P + P^sigma is shown to be a
    rational point of infinite order for a rung family (which would mean the rung is not the
    null object it was argued to be); or (iv) a third party takes a relevant cell on the live
    board. None of these is a licence to re-baseline the frozen frontier.
  knowledge_promotion:
    promoted:
    - KN-FIND-e1b836
    - KN-FIND-91f871
    status: LANDED AT ADOPTION, NOT OWED.
    note: >-
      The two mandatory promotions owed since batch 3 (the Mestre cap-of-15 / density-
      obstruction finding from DEC-20260823-ee9162, and the rank-by-measured-envelope finding
      from DEC-20260823-839fc6) were landed in the adoption commit ffa72a628 as
      knowledge/findings/KN-FIND-e1b836.md and KN-FIND-91f871.md, with their scope lines
      verbatim from the pre-declared findings. They are content-bound by this archive's
      path_sha256. No further promotion is owed by this batch's decision; the branch-C result
      does not warrant a new standing finding beyond what those two entries already carry.
  supersedes_claims: []
  supersession_note: >-
    This decision supersedes no prior claim. It performs the pre-declared budget transition
    and disposes of the batch's reviewed result.
  procedure_deviations:
  - >-
    The batch was ADOPTED, not run in this worktree: two coordinator sessions independently
    opened this goal's batch 4, and the committed BATCH-8b08ef opening and producer run were
    cherry-picked from claude/elliptic-curve-high-rank-h0y9j2 onto current main on the user's
    direction. The run manifests cite the original commit d077b4c41, which is not reachable
    from this branch after the cherry-pick; its content is reachable here as ec5184e9c and the
    original sha remains on the source branch. The binding is content (path_sha256) per this
    campaign's content-first receipts. Recorded so the provenance is not read as a broken
    link.
  decided_by: coordinator
  decided_at: '2026-08-24T20:30:00+00:00'
