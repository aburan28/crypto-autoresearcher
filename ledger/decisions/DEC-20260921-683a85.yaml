# =============================================================================
# DEC-20260921-683a85 -- PRIORITIZATION of the open GFPN ideas under
# GOAL-GFPN-380702 (TASK-20260921-1fb8ef). Every open idea named on the
# dispatching card receives exactly one disposition and a revisit condition.
# Ranks; designs nothing by itself; approves nothing; launches nothing.
# =============================================================================
coordinator_decision:
  id: DEC-20260921-683a85
  recorded_at: '2026-09-21'
  goal_id: GOAL-GFPN-380702
  question_id: RQ-GFPN-c01af8
  kind: prioritization
  mode: goal
  opened_by_task: TASK-20260921-1fb8ef

  context: >-
    GOAL-GFPN-380702 is active with completion criteria C1-C5 all OPEN. Two
    approved experiments are pending /run (EXP-GFPN-726eb2, certificate
    audit, C4; EXP-GFPN-05ff43, symmetrization-aware PDP ladder, C1), both
    approved by DEC-20260920-fe73de and both un-dispatched. Since that
    approval, six rho-lane proposals were filed under RQ-GFPN-c01af8
    (TASK-20260920-0eace8, archived by TASK-20260920-24f051). The open ideas
    in the goal's scope are: IDEA-20260920-73dc35 (OA-SDH, C2),
    IDEA-20260920-10547b (odd-char cover audit, C3), IDEA-20260920-9e672a
    (JV (n-1) full-DLP bound, C5), IDEA-20260920-0490f5 (ECDLP area, degree-2
    quotient descent lemma, C5), IDEA-20260920-18dc28 (SATIC area, WDSat +
    torsion + coset combined arm), and the rho lane IDEA-20260920-68b279
    (instrument), -0d218c (per-step cost floor), -204828 (norm-path inversion),
    -2e37b3 (pooled rho / precomputation economics), -5b1f84 (walk-mixing
    control), -a05ca7 (scalar-width audit + kangaroo ruler). The kb MCP index
    is unavailable in this session; novelty stays as each record states it.

  decision: prioritize

  decision_scope: >-
    Ranks the eleven open ideas above for GOAL-GFPN-380702 and assigns each one
    disposition: design_now (exactly one), design_next, zero_run_task,
    fold_into <record>, or hold <revisit condition>. Changes no proposal's
    status (proposals are immutable), approves no contract (approval, if any,
    is DEC-20260921-b5c2da), launches no trial. A hold is not a rejection: it
    names the evidence that reranks the idea (AGENTS.md rule 9).

  target_ids:
    - IDEA-20260920-73dc35
    - IDEA-20260920-10547b
    - IDEA-20260920-9e672a
    - IDEA-20260920-0490f5
    - IDEA-20260920-18dc28
    - IDEA-20260920-68b279
    - IDEA-20260920-0d218c
    - IDEA-20260920-204828
    - IDEA-20260920-2e37b3
    - IDEA-20260920-5b1f84
    - IDEA-20260920-a05ca7
    - GOAL-GFPN-380702
    - RQ-GFPN-c01af8

  ranking_basis:
    - >-
      RQ-GFPN-c01af8 decision target: per-curve, per-arm numbers for (a) D and
      per-PDP cost, (b) the full-ECDLP band next to the design note's 2^142
      and next to the rho ruler, (c) the oracle-assisted SDHP (queries, work)
      pair, (d) a yes/no on odd-characteristic cover applicability, (e)
      whether each curve's 128-bit claim stands. Goal criteria: C1 (a,b) is
      served by EXP-GFPN-05ff43; C4 by EXP-GFPN-726eb2; C2 (c) only by
      IDEA-20260920-73dc35; C3 (d) only by IDEA-20260920-10547b; C5 by
      IDEA-20260920-9e672a and IDEA-20260920-0490f5.
    - >-
      docs/target-result-profile.md rule A1 (exponent-first): none of the
      eleven ideas moves the exponent of the ECDLP; the six rho-lane records
      declare claim_kind constant_factor / instance_economics /
      protocol_conditional and say so. Among the rest, IDEA-20260920-10547b
      is the only one whose positive outcome is exponent-class (a transfer of
      the DLP to a genus-5 Jacobian at O~(p^{4/3})), with a small prior;
      IDEA-20260920-73dc35 is a cost-model measurement of a KNOWN algorithm
      (Joux-Vitse, frozen KN-LIT-673219) under a declared oracle model, whose
      number bears directly on decision target (e).
    - >-
      Focus discipline (agents/coordinator.md): at most three critical
      experiments active, two by default; two are active on this goal. A
      third is admitted only if it resolves a decision-changing uncertainty
      nothing else resolves, shares its instrument with an active lane, and
      is sequenced rather than concurrent. Tooling and zero-run tasks are not
      scientific trials but compete for the same executor capacity
      (max_concurrent 2; PDP cells need the machine otherwise quiet).
    - >-
      Instrument dependency: every rho-side measurement (0d218c, 204828,
      2e37b3 measurement leg, 5b1f84, a05ca7 measurement leg) needs the
      F_{p^5} rho backend of IDEA-20260920-68b279, which exists nowhere
      (card fact V5; 2,000-4,000 lines). IDEA-20260920-73dc35's instrument is
      the m=4 (4-variable) Joux-Vitse descended-system driver, which is
      EXP-GFPN-05ff43's fallback observable and is therefore already on an
      approved lane. IDEA-20260920-10547b needs a cover-genus instrument that
      does not exist and two unfrozen sources (Diem 2003, Galbraith-Hess-
      Smart 2002).

  dispositions:
    - idea_id: IDEA-20260920-73dc35
      disposition: design_now
      rank: 1
      lane: scientific_trial (third critical experiment; sequenced after EXP-GFPN-05ff43's implementation commit, not concurrent)
      rationale: >-
        The only open idea addressing C2 / decision target (c), which the RQ
        requires as a separate line from full ECDLP. Its dependencies are
        satisfied by committed state: the Joux-Vitse text is frozen
        (inputs/JOUX-VITSE-2010-157/paper_fulltext.md, KN-LIT-673219) and its
        section 5 states the oracle-assisted SDHP algorithm, the ~q/2 query
        count, the O(2^{b/5}) oracle calls plus 4!*2^{b/5}*c~(5,2^{b/5})
        decomposition cost at degree 5, the 5-equation degree-8 4-variable
        system shape, and the ~2^25 query 130-bit estimate; the curve
        parameters are frozen (KN-LIT-8aff72, KN-LIT-47d541). The instrument
        is the m=4 descended-system driver already required by EXP-GFPN-05ff43
        (fallback observable), named in the contract with any missing piece
        charged to the new contract's implementation. Compute is low: D_4 and
        per-attempt cost are measured on the same toy ladder as EXP-GFPN-05ff43,
        and the decomposition rate is measured end-to-end only at small p'
        where 24*p' attempts per challenge is affordable. It is a cost-model
        deliverable (claim_kind constant_factor: JV's exponent is not
        improved) and is ranked on what it decides for C2 and (e), not on
        novelty: a queries term near 2^63 per curve is far below 128 bits in
        a model neither design note discusses. Admitting it as the third
        critical experiment is justified because nothing else resolves C2, it
        shares EXP-GFPN-05ff43's driver, and it is sequenced after that
        implementation commit rather than run concurrently.
      revisit_condition: >-
        Reranked below IDEA-20260920-10547b if EXP-GFPN-05ff43 reports that the
        m=4 system at n=5 cannot be solved on any ladder cell (infrastructure
        outcome, not evidence); reranked to hold if the C2 clause is closed by
        another committed record first.
      designed_as: [H-GFPN-3366ea, EXP-GFPN-659e34, TASK-20260921-838c4a]
    - idea_id: IDEA-20260920-10547b
      disposition: design_next
      rank: 2
      lane: scientific_trial (gated on a source freeze and an instrument)
      rationale: >-
        The only open idea addressing C3 / decision target (d), and the only
        one whose positive outcome is exponent-class (transfer to a genus-5
        Jacobian at O~(p^{4/3}); Gorla-Massierer remark, frozen KN-LIT-edd7ba),
        so the exponent-first bias places it ahead of every rho-lane record.
        Not design_now because its two load-bearing sources (Diem 2003 odd-
        characteristic GHS with the genus formula; Galbraith-Hess-Smart 2002
        isogeny-class extension) are recalled, not frozen, and the cover-genus
        instrument (Magma or a Sage/PARI function-field implementation with a
        constructed-vulnerable-toy control) does not exist; a design against a
        recalled genus formula would violate C-3 of the dispatching card. The
        first act on this idea is a zero-run freeze of both sources, minted at
        the next coordination act (the freeze id reserved on the dispatching
        card is bound to the design_now idea's prerequisite, which is not a
        freeze).
      revisit_condition: >-
        Designed at the coordination act that follows the archived freeze of
        Diem 2003 and Galbraith-Hess-Smart 2002 (KN-LIT entries with frozen
        text); reranked to design_now immediately if EXP-GFPN-726eb2's audit
        reports a 2-torsion field structure for either curve that differs from
        the design-note reading (that would change the expected genus).
    - idea_id: IDEA-20260920-9e672a
      disposition: fold_into EXP-GFPN-659e34
      rank: 3
      lane: bookkeeping (no separate contract)
      rationale: >-
        The record is an arithmetic bound whose one measurable input is the
        m=4 decomposition rate at n=5. That rate is EXP-GFPN-659e34's primary
        heuristic (HEUR-GFPN-RATE4), measured end-to-end on the rate ladder,
        so the contract emits the (n-1) full-DLP attempts lower bound
        (full_dlp_n_minus_1_attempts_lower_bound_bits, modeled, labeled as
        this idea's closure input). The C5 closure for the JV (n-1) full-DLP
        variant is then filed in the evidence-review decision of
        EXP-GFPN-659e34, citing the measured rate; no experimental budget is
        spent on the variant beyond that shared measurement.
      revisit_condition: >-
        Opened as its own contract only if EXP-GFPN-659e34 measures a rate
        exceeding 4/(24 p') on two completed rate cells (the heuristic
        undercounts decompositions by more than 4x), which would void the
        bound as stated.
    - idea_id: IDEA-20260920-0490f5
      disposition: zero_run_task
      rank: 4
      lane: theory / formal target (ECDLP area, RQ-ECDLP-002; named in C5)
      rationale: >-
        A three-line lemma with a drafted proof note already in the repository
        (research/THM_QUOTIENT_DESCENT1.md) and a Sage check on two named
        baseline examples; zero compute; closes a slide question as a scoped
        theorem and bounds the acting group for degree-2 quotients, which the
        goal's symmetrization arms rely on. Its next gate is a formal target
        (Lean statement and proof) plus the Sage check. No handoff identifier
        for it was pre-minted on the dispatching card, so the card is minted
        at the next coordination act; ranking it here is what makes that act
        justified. Kohel INDOCRYPT 2012 and FGHR 2014 are not frozen: the
        task's claim is "formalized here", novelty_status stays unverified.
      revisit_condition: >-
        Card minted at the next coordination act after the two /run
        invocations are dispatched; reranked above IDEA-20260920-10547b's
        freeze if a reviewer of EXP-GFPN-05ff43 questions which translations
        act on the m=5 symmetrized system (the lemma answers exactly that).
    - idea_id: IDEA-20260920-a05ca7
      disposition: zero_run_task
      rank: 5
      lane: audit (zero-compute leg only; measurement leg held)
      rationale: >-
        The audit leg (freeze the two reference implementations, read the
        scalar-sampling code paths, produce the (curve, implementation, use)
        -> (k, method, citation) table with a known-uniform control) is zero
        compute and is the one generic rho-family mechanism that could move
        decision target (e) for a deployment without any property of the
        curve. It is ranked below the C2/C3/C5 items because its expected
        outcome (uniform full-width sampling) closes the arm rather than
        changing a number, and it is protocol_conditional (not target-class,
        as the record says). It is not folded into EXP-GFPN-726eb2: that
        contract is frozen and approved, and adding a row would require an
        amendment to a protocol that has not run. The measurement leg
        (kangaroo constant on the deployed field) needs the 68b279 instrument
        and is held with it, gated on the audit reporting at least one
        non-uniform or non-determinable row.
      revisit_condition: >-
        Audit card minted at the next coordination act (two implementation-
        source freezes plus the reading). Measurement leg reranked to
        design_next if the audit reports any non-uniform or non-determinable
        row; closed for the audited implementations if every row is uniform
        mod n with citation.
    - idea_id: IDEA-20260920-68b279
      disposition: hold
      rank: 6
      lane: tooling (rho instrument; shared by five records)
      rationale: >-
        Constant-factor lane instrument, not target-class (rule A1, as the
        record says). It decides nothing by itself; its consumers price the
        rho ruler in the unit the index-calculus band is reported in, which
        decision target (b) needs only once a band exists. Neither approved
        experiment has run, so no band exists to compare, and the unit
        conversion can be filled provisionally by arithmetic on the card's
        verified V3 counts (5M+1S per step; 25/15/15 word products per
        multiplication) as a MODELED row in the EXP-GFPN-05ff43 evidence
        review, clearly labeled, until the instrument measures it. A
        2,000-4,000-line backend would compete with the two pending trials
        for the same executor capacity (max_concurrent 2; PDP cells need the
        machine quiet), so admitting it now is idle-capacity make-work under
        the focus discipline. Held, not shelved: it is the goal's next tooling
        task once the reranking evidence below exists.
      revisit_condition: >-
        Reranked to design_next (as a tooling task with its acceptance-suite
        expected-value file frozen before the build) when EXP-GFPN-05ff43
        records heur_dflat_pass for any arm (a band then exists to compare),
        or earlier if EXP-GFPN-726eb2's figure-provenance table reads the
        design note's 2^142 unit as something the V3 arithmetic cannot convert
        (then the measured exchange rate is on the critical path of (b)).
    - idea_id: IDEA-20260920-0d218c
      disposition: hold
      rank: 7
      lane: measurement (first consumer of the 68b279 instrument)
      rationale: >-
        Constant-factor per-step cost floor and the exchange rate between
        word products and group operations on this field; not target-class
        (rule A1). Its whole measurement leg depends on IDEA-20260920-68b279,
        so it cannot rank ahead of that instrument. Its zero-compute content
        (the V3-derived exchange-rate prediction of 166.3-166.9 bits for the
        ruler in word products, against 168.2 for a matched prime field) is
        carried as a modeled, labeled row into the EXP-GFPN-05ff43 evidence
        review so that decision target (b) is not blocked on the instrument.
      revisit_condition: >-
        Designed together with, and contracted immediately after,
        IDEA-20260920-68b279 under that record's revisit condition; the design
        note's unit is read from inputs/PORNIN-2022-274-ECGFP5 at that time.
    - idea_id: IDEA-20260920-204828
      disposition: hold
      rank: 9
      lane: measurement (inversion-path arm of 0d218c)
      rationale: >-
        Constant-factor arm of IDEA-20260920-0d218c (word products tie within
        15%; scratch 5x lower; the deliverable is a kernel-regime
        classification). Low priority by the record's own statement: its best
        outcome is a single-digit-percent step change or a throughput lever
        on hardware the goal does not run. It shares 0d218c's instrument and
        cannot be measured before it.
      revisit_condition: >-
        Attached as an arm of the 0d218c contract when that contract is
        written, or held further until 0d218c reports whether the tested
        kernel is multiplier-bound or state-bound (the record's own next gate).
    - idea_id: IDEA-20260920-2e37b3
      disposition: hold
      rank: 8
      lane: derivation note (zero-compute half) + measurement leg (instrument-gated)
      rationale: >-
        Instance-economics record, not target-class (rule A1). Its
        zero-compute arithmetic table (per-key rho cost under pooling at
        L keys and under (S, T) precomputation, both curves, with the IC
        crossover row conditional on HEUR-GFPN-DFLAT) rests on the pooled-rho
        law and the general precomputation form, both recalled and unread here
        (Kuhn-Struik SAC 2001 behind an authentication wall; only the
        Bernstein-Lange 2012/458 abstract retrieved), so the note cannot be
        filed as more than a derivation over recalled laws until those
        sources are frozen. Its crossover row is conditional on the
        EXP-GFPN-05ff43 band, which does not yet exist. The measurement leg
        needs the 68b279 backend's multi-target bookkeeping, or the
        EXP-ICEX-c32447 multi-target arm if that is ever built (the record's
        own re-scope recommendation).
      revisit_condition: >-
        Zero-run freeze of Kuhn-Struik SAC 2001 and ePrint 2012/458 minted
        when EXP-GFPN-05ff43 records a band (the crossover row then has a
        measured input); the derivation note follows the freeze; the
        measurement leg follows 68b279's revisit condition or an ICEX
        decision to build the multi-target arm.
    - idea_id: IDEA-20260920-5b1f84
      disposition: fold_into IDEA-20260920-68b279
      rank: 10
      lane: control (calibration suite of the rho instrument)
      rationale: >-
        A control on the ruler's walk (one-coefficient partition versus hashed
        versus Z/n), not a speedup; its own priority_rationale says it should
        run inside the instrument's calibration rather than as its own
        contract, and the generator recommended exactly that. Folded into
        IDEA-20260920-68b279's acceptance/calibration suite (Z/n transport,
        positive control with Pollard's three-way partition, r-ladder), so it
        inherits that record's hold and revisit condition.
      revisit_condition: >-
        Written into the 68b279 tooling contract's calibration items when that
        contract is designed; opened separately only if the instrument's
        calibration finds an H1 signal (one-coefficient ratio >= 1.05 on two
        seeds, absent on Z/n), which would make the walk-mixing question a
        result rather than a control.
    - idea_id: IDEA-20260920-18dc28
      disposition: hold
      rank: 11
      lane: outside GFPN (SATIC area, RQ-SATIC-1ae57a; binary curves)
      rationale: >-
        The goal's objective already scores this record as constant-factor-
        only unless measurement falsifies that prior; it concerns binary-field
        WDSat cells, not either F_{p^5} curve, and the SATIC lane's conclusion
        (search exponent m*l - log2|G|, solver engineering cannot move it) is
        its null. Under this goal it draws no budget before C1-C4 have
        numbers. It is not closed here as dominated: closure of a lane needs
        an obstruction block measured over the scope closed
        (agents/coordinator.md closure gate), and none exists for the
        three-trick combination; it also belongs to a SATIC coordination act.
      revisit_condition: >-
        Reranked if a SATIC-lane evidence record reports a fitted-exponent
        change from torsion or coset symmetrization on the Trimoska cells, or
        if a SATIC coordination act adopts the four-arm run; otherwise
        revisited under this goal only after C1-C4 report.

  rationale:
    - >-
      Exactly one idea is design_now: IDEA-20260920-73dc35, because it is the
      only open item that resolves a decision-target clause (c) with
      dependencies already in committed state, and because its number is the
      one most likely to change the (e) verdict for a deployment that exposes
      a static-DH oracle. Its claim tier is a cost-model measurement of a
      known algorithm (claim_kind constant_factor; the p^{1+o(1)} work
      exponent is Joux-Vitse's, not a new one); the decision ranks it on what
      it decides for C2, not on novelty (dispatching card C-8).
    - >-
      Focus discipline is respected by sequencing, not by refusal: the third
      critical experiment is dispatched only after EXP-GFPN-05ff43's
      implementation.md is committed (its m=4 driver is the shared
      instrument), so no third solver-running lane is concurrent with the
      PDP ladder on a machine that must be otherwise quiet.
    - >-
      The rho lane is held as a block behind its instrument, with the
      instrument's revisit condition tied to the first band from
      EXP-GFPN-05ff43. This is the exponent-first bias applied honestly: the
      lane's own records say it moves no exponent; what it decides (the unit
      of the ruler) is decision-relevant only once there is a band to put
      beside the ruler, and until then a labeled modeled row from the card's
      verified arithmetic serves decision target (b).
    - >-
      Two zero-run items (IDEA-20260920-0490f5 formal target;
      IDEA-20260920-a05ca7 audit leg) and two source freezes (Diem 2003 +
      Galbraith-Hess-Smart 2002 for IDEA-20260920-10547b; Granger 2010 for the
      C2 "JV/Granger" clause) are scheduled for the next coordination act
      because no handoff identifiers for them were pre-minted on the
      dispatching card and this act mints nothing. The Granger freeze is not
      a gate on the OA-SDH design (the frozen JV text carries the algorithm,
      the query count and the 130-bit estimate); it is recorded as an
      impediment against C2's wording on the goal head so that C2 can close
      either by the freeze or by naming the missing freeze, as the criterion
      itself allows.
    - >-
      No idea is closed. Every hold names the reranking evidence; every fold
      names the record that carries it. IDEA-20260920-18dc28 is not scored
      dominated because no obstruction block exists for the combination and
      the record belongs to a different area's coordination.

