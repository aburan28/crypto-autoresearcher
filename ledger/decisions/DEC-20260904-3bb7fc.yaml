coordinator_decision:
  id: DEC-20260904-3bb7fc
  context: >-
    Design decision over three open, high-priority, undesigned ECC proposals
    under RQ-ECDLP-002 (tools/ecc_priority.py --open-ideas --area ECDLP),
    dispatched as ONE tranche because each attacks a REFERENCE POINT that the
    campaign's exponent claims are measured against: the absolute smoothness
    reference (IDEA-20260802-001), the rho baseline's position on its own
    tradeoff frontier (IDEA-20260806-3b91c7), and the one-instance-per-cell
    calibration of every yield, smoothness and equidistribution band
    (IDEA-20260807-347a83). Designed by the coordinator subagent under
    CLAUDE.md rule 11 (ECC comes first; open ECC ideas are ranked work).
    Duplication check clean before writing: no live H-* or EXP-* referenced any
    of the three, and all six pre-allocated identifiers were unreferenced under
    ledger/.
  decision: revise
  target_ids:
    - IDEA-20260802-001
    - IDEA-20260806-3b91c7
    - IDEA-20260807-347a83
    - H-ECDLP-d2aa2c
    - H-ECDLP-6c52c0
    - H-ECDLP-fe99ef
    - EXP-ECDLP-a1c262
    - EXP-ECDLP-96b5d3
    - EXP-ECDLP-7edfd3
  rationale:
    - >-
      DESIGNED, NOT APPROVED. All three contracts are status review_required,
      approved_by null, frozen false, execution not authorized. No handoff was
      written, no executor dispatched, no compute spent. Approval is a separate
      committed decision and the maintainer's gate.
    - >-
      Source proposals are UNEDITED and remain `proposed` (AGENTS.md rule 4).
    - >-
      A DEFECT IN COMMITTED CODE, read out rather than assumed, and independently
      re-verified by the orchestrating session before this record was written.
      experiments/EXP-LPF-001/implementation/lpf001_driver.py:627 states
      "range_matching_note: samples are drawn on [1, p**2], NOT on [1, D]", while
      :482 computes u = lnD / math.log(bsm) from D = 2**32; the archived
      X_over_D is 0.5069737250450999. Since the Dickman function is steeply
      decreasing, an overstated u understates the reference and INFLATES the
      ratio R(u), in the direction and with the u-growth actually observed. This
      added a fourth reference arm (REF-ASY-X) to EXP-ECDLP-a1c262, made it the
      cheapest arm and the FIRST stage (five rho evaluations, zero other cost),
      and forced REF-EXACT to count over [1, X] rather than [1, D].
    - >-
      A BLOCKING ZERO-COMPUTE CONTROL was added because two of
      IDEA-20260802-001's five quoted bits-16 departure figures do not reproduce
      from the archived arrays at integer u: coordinator hand arithmetic gives
      4.49543 and 11.15351 against the quoted 4.5709 and 11.5937, reconciling
      only at the archived non-integer u. THAT ARITHMETIC IS A PRIOR, NOT
      EVIDENCE, and C-A-ARCHIVED-REDERIVATION can void the tranche's motivating
      figures before any expensive stage runs.
    - >-
      EXP-ECDLP-96b5d3 adopts DEC-20260806-8f7e4f as binding input: its novelty
      framing is refuted (KN-LIT-013 already records a construction achieving
      S*T**2 ~ N) and its sigma = 0 calibration is NON-DISCRIMINATING, since
      Shoup's rival law passes it identically. The source proposal ranked itself
      first on exactly that calibration, so sigma = 0 is demoted to an
      implementation check stripped of any discriminating or ranking role, and
      sigma = 1/3 is the decision cell with both rival laws pre-registered
      numerically.
    - >-
      EVERY CONTRACT CARRIES A NULL OBJECT WITH A NAMED, REACHABLE FAILING
      INPUT. This was required at design time because the review round that
      closed immediately before (DEC-20260904-166ab5) REFUTED a control on
      precisely this ground: its cap arm was algebraically entailed and so
      passed on every possible input. REF-SHIFT is a theory-free knob that may
      survive arbitration and thereby withhold the reference verdict; the Z/N
      agreement-null separates because a curve's x-coordinate step index is
      non-uniform where a relabelled Z/N is uniform; ARM-FROZEN fails with a
      between/i.i.d. ratio below 1 when per-instance streams collide under the
      driver's MASTER_SEED + STREAM_OFFSETS + bits rule.
    - >-
      Budgets are sized to THIS host, not to the proposals: no bits-20 full
      sieve, no full-corpus enumeration before the cheap audit, per-cell
      wall-clock caps whose breach is recorded as resource_exhaustion. A related
      lane already burned 11.73 and 12.22 GiB and returned zero ranks, so
      approving a budget this host cannot serve would authorise a run returning
      failed_infrastructure -- an infrastructure stop, never evidence
      (AGENTS.md rule 3 / CLAUDE.md rule 3).
    - >-
      Overlap resolved rather than duplicated: a1c262 holds the sample fixed and
      varies the reference; 7edfd3 holds the reference fixed and varies the
      instance; each is declared the other's control, and 7edfd3's exact
      seed-2301 regression IS a1c262's pipeline-drift control.
  evidence_refs:
    - experiments/EXP-LPF-001/implementation/lpf001_driver.py
    - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
    - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
    - knowledge/techniques/KN-TECH-005.md
    - knowledge/literature/KN-LIT-013.md
    - ledger/decisions/DEC-20260806-8f7e4f.yaml
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
  limitations:
    - >-
      NO EXPONENT MOVES AND NO ATTACK IS MOUNTED BY ANY OF THE THREE. Repairing
      a reference is not an attack; correcting a comparator raises a bar rather
      than lowering one; a variance control measures the instrument. Claim tier
      is `toy` for all three, and no toy result may become a crypto-scale claim.
    - >-
      Both Hildebrand citations in H-ECDLP-d2aa2c are `provenance: recalled`
      with verified_by null. A KN-LIT entry written by an agent that actually
      opened the source is owed before REF-SP is relied on outside
      EXP-ECDLP-a1c262; a recalled citation may not back a decision
      (AGENTS.md rule 9).
    - >-
      KN-LIT-013's own "Not verified here" section records that the full
      Corrigan-Gibbs/Kogan paper was not read by this program; EXP-ECDLP-96b5d3
      forbids any assertion about its contents beyond that record.
    - >-
      EXP-ECDLP-7edfd3 IS NARROWER THAN ITS SOURCE PROPOSAL. EV-EQD-001's
      STAT-CHI/STAT-KS1 and the EV-YIELD-* ratios are excluded because their
      pipelines were not read at design time, and naming their metrics unread
      would be inventing them. The gap is converted into a zero-compute
      deliverable (successor_scope_report) so the successor contract is written
      from a run artifact rather than from a guess.
    - >-
      At bits 20 EXP-ECDLP-a1c262 may have no exact reference at all. That cell
      is then reported UNARBITRATED rather than decided by two approximations
      agreeing with each other.
    - >-
      The DEC-20260801-014/-015 quotations motivating EXP-ECDLP-7edfd3 were NOT
      re-opened by the designing coordinator; they are carried at the source
      proposal's provenance and re-verified by C-C-DECISION-READBACK as a run
      artifact.
    - >-
      No promotion gate is engaged by any of the three, and none moves an
      asymptotic-complexity claim toward `supported`.
  next_actions:
    - >-
      APPROVAL IS A SEPARATE ROUND AND THE MAINTAINER'S GATE. Route the three
      contracts to independent review before any approval decision.
    - >-
      Recommended ranking if only one is approved first: EXP-ECDLP-a1c262. Its
      first two stages are zero compute, its C-A-ARCHIVED-REDERIVATION control
      can void the tranche's motivating figures before anything expensive runs,
      and EXP-ECDLP-7edfd3 reads the same archived arrays.
    - >-
      EXP-ECDLP-7edfd3's C-C-SEED-2301-REGRESSION must be scheduled BEFORE any
      interpretation of EXP-ECDLP-a1c262: a drift failure there invalidates the
      archived arrays a1c262 reads.
    - >-
      Owed regardless of approval: a KN-LIT entry for the Hildebrand result by
      an agent that opened the source, so REF-SP rests on a read citation.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a design decision, not an evidence-review decision. No run exists,
      no evidence record is created, and no hypothesis status changes. A KN-FIND
      requires a support or reject_scoped decision on replicated or strong
      evidence; there is no evidence here at all. The one transferable item --
      the EXP-LPF-001 range/argument mismatch -- is a defect to be measured by
      EXP-ECDLP-a1c262, not a finding to promote ahead of it.
  decided_by: coordinator
  decided_at: '2026-09-04'
