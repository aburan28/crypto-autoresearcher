  rulings:
    - id: R-1
      title: comparison_rule applied to the blind re-derivation (J-BLIND)
      text: >-
        The plan's rule, fixed before dispatch, applied item by item:
        - C_A 2561 = 2561; 3 x C_R 7695 = 3 x 2565.0; C_M 2666 = 2666, all
          integer-equal (NR-02, NR-04, NR-05);
        - V, z_A, z_M and z_Delta agree within 1e-15 relative (NR-02, NR-04,
          NR-06), and the re-deriver's readings are reading-invariant on
          these data (a92ff3 AD-3);
        - signed bound: 1.035907 against 1.036024, a difference of 1.2e-4;
          |dev| bound: 1.043353 against 1.043360, a difference of 7.2e-6
          (NR-03, NR-07). Both are inside the tolerance max(0.005, 3
          combined SE);
        - governing choice: |dev| in both computations. The producer's
          signed coverage is below 0.945 at kappa 1.10 and the re-deriver's
          at 1.15, both within 3 Monte Carlo SE. This is "choice at Monte
          Carlo resolution", not a disagreement (NR-08);
        - re-applied outcome table: z_A -0.068 <= t_dec, governing bound
          1.043 <= 1.15, X_rel 1.06 <= 1.15, which gives O-A3.
        J-BLIND: holds, and agreement is established. A deterministic
        quantity that is reproduced exactly from rows by code that never saw
        the producer's implementation is evidence about the quantity itself.
    - id: R-2
      title: composition, one verdict per joint
      text: >-
        Twelve joints hold and one breaks. The break, J-PCNULLR, matches its
        planned breaking artifact: PC-NULL-R criterion (i) fails with
        probability below 0.001 under every assessed single-arm departure at
        the realised n. It can fail only at K >= 2, because P(K_null >= 1) is
        0.038 (NR-12). This was disclosed pre-data in AMD-20261008-9c080d A-8
        (NR-25), which kept the rule.
        Classification: a defect in the INFORMATIVENESS of one criterion of
        a control. It is not a validity defect and not a change to any
        reading:
        - PC-NULL-R passed as frozen (K 0; mean z inside its interval);
        - criterion (ii) is informative against single-arm departures (0.69
          at kappa 1.10, 0.985 at 1.15, 0.86 against a 2 x D arm; null
          rejection 0.0103);
        - the red team's calibrated replacement for (i), the family-wise
          maximum of the four null z, has null rejection 0.0114 and power
          0.93 at a single arm at 1.10, and passes on the observed cells
          (maximum z 1.094, P 0.51);
        - the joint's common-mode clause HOLDS. The factor needed to cross
          z_A = t_dec is 1.0575, against an admitted pooled 99% upper end of
          1.0297 (NR-15);
        - J-CAL's fit tests and the permutation null independently show
          that the calibrated null is not lighter than the data (NR-14).
        The function PC-NULL-R serves in the outcome conditions (a null that
        is not anomalous) is therefore established by other means. O-A3
        stands as composed. The break is carried as a design requirement
        (R-6) and as a limitation of EV-PFDR-f6b76c.
    - id: R-3
      title: items 1 and 2 of the top-level session's NA-7 report (attestation placement and checker invocation)
      text: >-
        ITEM 1 (TASK-20261009-0ffc37 (d)). For TASK-20261009-a92ff3 the
        governing attestation is rederivation.review_attestation, inside the
        deliverable the card names (rederivation.yaml). The checker reads a
        nested attestation, and the card asked for "a closing
        review_attestation", not a top-level one (NR-21).
        attacks/narrative.yaml is a source fragment that the task's
        assemble_report.py merges. Its top-level review_attestation carries
        the same task_id, joint, verdict, blind_from_respected and
        read_sibling_reports. Its sources list is a subset: the assembler
        appends the per-job row files (NR-22). It is a build input, not a
        second report, and it is not counted.
        ITEM 2. The governing invocation is --plan
        ledger/handoffs/TASK-20261009-33b5cf.yaml --reports with the three
        deliverable files. Each card names exactly one report file carrying
        its attestation, and this invocation gives "PASS: 3 report(s), every
        joint owned and attested, blindness respected, controls declared".
        The directory invocation's single problem (duplicate attestation for
        TASK-20261009-a92ff3) comes from the item 1 fragment. It is recorded,
        not overridden.
        TASK-20261010-c026a9 re-runs both invocations on the archived tree
        and records their output verbatim and their exit codes in its
        receipt, so the governing result is committed.
        --blind-history: no batch declares protected literals, so it is
        UNCHECKABLE, not passed. Compensating facts:
        - the re-deriver's attested git commands include no log, show or
          blame;
        - the top-level session reports that no outcome or value entered a
          commit message, PR text or prompt before the seal (PD-73-4).
        A departure from agents/coordinator.md ("--batch <dir>"): this round
        has no batch directory. It is recorded as PD-B6-1.
    - id: R-4
      title: validator findings and observations
      text: >-
        F-1: the TW-ALIVE "fired" line. It confirms DEC-20261009-7317a2 RE-1
        independently. The report is immutable, and RE-1 governs. No further
        record is needed.
        F-2: the RA-05 and RA-06 raw-result.json files have null metrics and
        no outcome id. required_artifacts.per_run requires them (NR-20,
        NR-31). The pinned finalize supports --metrics-from, but neither
        finalize argv passed it.
        RULING: a disclosed provenance-content defect, named DEF-2. It is
        not an I-A6 "missing required artifact": the artifact exists, and
        the absent values sit in calibration.json declared_metrics and
        analysis.json declared_metrics and outcome_id, which raw-result
        binds by sha256 (NR-32).
        DISCLOSURE: this reading is made after the outcome is known. It is
        outcome-independent: the defect comes from the finalize argv,
        recorded before any outcome existed, and would have arisen for every
        outcome. It changes no success or falsification criterion, so no
        protocol amendment is written.
        This Coordinator's validity check (DEC-20261009-7317a2 W-3) missed
        F-2. Recorded as an omission of that check.
        F-3: raw-result gates entry with nulls for analysis.json. Harmless;
        the gates RA-06 read are in analysis.json gates_read. Disclosed.
        F-4: row-verify.json carries exit_code and stderr_tail. Neither is a
        count, so there is no I-A7 consequence. Disclosed.
        O-1: the TB reading. PDI-3 governs (A-7), and TB is never
        decision-bearing.
        O-2: no TB tail list is reported, although metrics.secondary names
        one. A secondary omission, disclosed; the validator's supplementary
        screen lists only planted_sub curves.
        O-3: A-5's recording is partially unmet. The implementation-notes
        continuation omits TASK-20261008-398fce. The execution report and
        the superseding manifests carry it. Disclosed, no effect.
        O-4: the execution report misplaces the 6-minute gap (it lies
        between the calibrate step end and fin_cal). Report error RE-2;
        immutable; no ordering requirement is affected.
        O-5: the validator's reading of "finalize time outside its run's
        timing" is ACCEPTED.
        O-6: nine msolve tests skipped, as RA-01 recorded. G-T passes.
    - id: R-5
      title: procedure deviations and incidents of the round
      text: >-
        ACCEPTED, none touching a blind_from path, a sibling report or the
        prior:
        - The launch prompts of TASK-20261009-a92ff3 and -33b5cf did not
          state that the receipts had verified. Both refused to begin until
          the top-level session supplied the statement, and checked commit
          ancestry themselves. This is a top-level process defect, and the
          card gate worked as written.
        - Two container restarts killed TASK-20261009-a92ff3's supplementary
          processes. The same session resumed, re-hashed all inputs, and
          reproduced the logged families exactly. The adopted values were
          complete before the first restart.
        - a92ff3 DV-2: a single syntax-only edit of readings.yaml, 25 s
          after writing and before any count. The original is kept.
        - a92ff3 AD-7: a supplementary coverage extension decided after the
          adopted coverages were seen. It is reported beside them, never
          replaces them, and changes no reading.
        - bfdc5b: a process listing showed a sibling script's name; nothing
          was opened. Three processes ran for under two seconds (PD-7).
        - 33b5cf D-2: a grep displayed DEC-20261009-ff58fe header lines.
          They do not contain the prior.
        - The supplementary reads (33b5cf D-7) were each tied to a named
          check.
    - id: R-6
      title: red-team objections and required controls
      text: >-
        OBJ-RT-1 and OBJ-RT-2: ruled under R-2.
        OBJ-RT-3: the AR-3 governing choice is at Monte Carlo resolution in
        all three computations (producer, re-deriver, red team). It is
        immaterial here, because both bounds are 1.036 to 1.044. It is a
        latent coin flip for any reading near 1.15.
        OBJ-RT-4: the t_dec source is at Monte Carlo resolution. Immaterial.
        OBJ-RT-5: planted_target tests a single point. The boundary behaviour
        rests on the coverage and X_rel simulations, which hold.
        ADOPTED as binding design requirements for any later contract that
        reuses PC-NULL-R or AR-3 (Part B, Part C or a re-review):
        - RCT-1: replace criterion (i) by the family-wise max-z test.
        - RCT-2: report a common-mode yardstick (null-arm rho1 against U and
          against the previous experiment's rate, with 99% intervals and the
          factor needed to cross the boundary).
        - RCT-3: pre-register an AR-3 rule that Monte Carlo noise cannot
          decide (for example, the larger bound governs, or a 3-SE margin).
        Also: the pinned finalize must pass --metrics-from (DEF-2), and
        launch prompts must state the receipt verification.

