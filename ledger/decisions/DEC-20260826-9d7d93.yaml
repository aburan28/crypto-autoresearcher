  rationale: >-
    THE CONDITION IS MET IN FORM AND THE RESIDUALS BITE AT THE NEXT RUN'S EXACT
    CONFIGURATION, AND BOTH HALVES OF THAT SENTENCE ARE LOAD-BEARING.
    Met in form: a successor instrument exists as a NEW file, the pinned
    predecessor was read and never edited (hash unchanged before and after,
    single commit in its history, the completed archive that binds it intact),
    six named defects were repaired, and each repair was DEMONSTRATED TO FIRE
    rather than read off the code -- 39 assertions, zero failures, zero
    NOT_REACHED, adjudicated separately and accepted by both reviewers at the
    scope the board itself states. Artifact integrity is 23/23 from disk AND
    23/23 from the commit blob, verified twice at two different commits after the
    repository head moved mid-review. 44 report figures were walked, 43 exact.
    Condition (v) is discharged with the LITERAL `failed_infrastructure` label.
    The blind re-derivation SUCCEEDED at a cell the producer never ran.
    And yet: BOTH REVIEWERS RULED ADMIT WITH A NAMED RESIDUAL AND NEITHER GAVE A
    BARE ADMIT, on DIFFERENT residuals, and every residual that matters is
    invisible at d=64 by construction and lands at d=512, beta=55,
    mpfr_bits=100. (i) The strategies file is resolved by a module-relative path,
    its sha256 is computed in two places, written into the record, and compared
    to nothing -- divergent bytes are accepted silently, and the measured cost on
    one cell is 13 tours against 26 with two different b0 values at the same
    seed. That is the failure class BATCH-f9780d died of. (ii) Nothing is
    journalled between the STARTED stub and the first `tour_start`; at d=64 that
    window is 0.000378 s, and at d=512 the same construction's outer LLL ALONE is
    committed at 498.9597418308258 s, so a cell killed there flushes `tours: 0`
    with elapsed frozen near zero -- a confidently wrong machine-readable number,
    which is a worse outcome than the empty record this whole repair exists to
    prevent. (iii) The AUTO_ABORT stopping criterion cannot be reconstructed from
    two GSO summaries that are a first value and a sum, so the SIZING the next
    run exists to produce is still not computable. (iv) `_H_PAYLOAD` is never
    reset and the handlers are never disarmed, so a signal after a completed cell
    writes KILLED_PARTIAL with `failed_infrastructure: true` for a cell that
    COMPLETED -- on the two-cell path the next run uses.
    AND ONE FINDING REACHES FURTHER THAN ANY TEST THIS BATCH COULD HAVE RUN:
    v2's stated warrant for its tour count is FALSE from block size 46 up, and
    beta=55 -- the pinned d=512 cell -- selects the strategy entry with
    `preprocessing_block_sizes: [36]`. The COUNT is unaffected; the WARRANT is
    what a successor inherits. At beta=20 and beta=25 the two candidate readings
    are numerically identical, so neither the producer's whole board nor the
    Coordinator's blinded cell could have distinguished them. This was found by
    MEASUREMENT at acceptance dimension (13 loop iterations against 260 tour
    calls at d=64, beta=46) and not by projection.
    Each of these has a remedy costing minutes and no lattice compute, and each
    is acceptance-testable at d=64 exactly as D1..D6 were. Against that, the
    100-bit cell's own predecessor burned 21538 s cumulative to learn one bit and
    its target arm ran at least 14448 s and wrote nothing. Spending that again on
    a run whose records could be silently wrong at exactly beta=55 would repeat
    DEC-20260824-5e222e's own finding a second time. THE CHEAP PASS COMES FIRST.

  what_the_reviews_established_against_this_coordinator: >-
    RECORDED AT FULL STRENGTH AND IN THE DECISION ITSELF, as DEC-20260824-5e222e
    did, because the findings are against the dispatch and the dispatch was mine.
    NONE OF THE FIVE IS SOFTENED HERE AND NONE IS PRESENTED AS ALREADY REPAIRED.
    (1) PTM-5 FIRES AGAINST MY OWN REVIEW PLAN, AND THE RED TEAM IS RIGHT.
    review_plan.yaml `claim_under_review` (line 43) states that the instrument
    "flushes a partial record on a real signal" WITH NO INLINE CARVE-OUT, inside a
    self-contained block explicitly built to be quoted verbatim by this decision.
    Sixty lines away, `already_disclosed_items` (1) and (2) state both carve-outs
    in terms -- so the plan is qualified at DOCUMENT level and unqualified at
    SENTENCE level in the one paragraph designed to travel alone. GIVEN RED TEAM
    F1 THAT SENTENCE IS FALSE DURING THE ~500 s OUTER-LLL WINDOW AT d=512, where
    a real signal produces a flush that is not a partial record of anything but a
    `tours: 0` record with a near-zero elapsed. THE CORRECTED STATEMENT, WHICH
    SUPERSEDES THE PLAN'S SENTENCE FOR EVERY LATER READER AND IS THE ONLY FORM
    THIS DECISION USES: the instrument flushes a partial record on a real
    SIGTERM/SIGINT/SIGALRM, SUBJECT TO -- (a) SIGKILL runs nothing at all;
    (b) at d=512 a mid-tour signal is deferred by the GIL until the in-flight C
    call returns, and the flushed elapsed is stale by up to one whole tour;
    (c) a signal delivered before the first `tour_start` flushes a record whose
    `tours` is 0 and whose elapsed is frozen at the last inter-C-call boundary,
    which at d=512 may be approximately zero for a cell that has run for minutes.
    THE CATCH IS THE RED TEAM'S, under a control I commissioned against myself,
    and I do not restate the unqualified form anywhere.
    (2) THE SIBLING-BLINDNESS LEAK IN THIS ROUND WAS MINE, AND IT COSTS THE ROUND
    ITS MUTUAL BLINDNESS. Commit d73558cb4 carried the subject
    "review(TASK-20260826-5ee48b): Red Team on BATCH-762807 -- J4, J5 and J6 all
    BREAK" while the Validator was still writing. The Validator ran `git reflog`
    for the one reason it had to -- to check its own committed constraint
    "nothing staged, committed or pushed", which another session had already
    made false of the tree by committing its probe evidence mid-review -- and the
    subject printed. It disclosed this itself, in both its report and its
    attestation, rather than concealing it, and named the mechanism: A ROUND THAT
    ENFORCES SIBLING BLINDNESS BY READ SCOPE AND THEN COMMITS BOTH REVIEWERS'
    WORK TO ONE SHARED HISTORY WHILE BOTH ARE RUNNING LEAKS THROUGH COMMIT
    SUBJECTS AND PATHNAMES -- which a reviewer must read to verify its own
    compliance, so the blindness rule and the compliance rule are in direct
    tension. WHAT I VERIFIED AND WHAT IT DOES AND DOES NOT BUY: all 80 of the
    Validator's probe and derivation files were written BEFORE that commit and
    none after, and its own timestamps show its last probe at 21:15:14 against
    the sibling commit at 21:19:58, so its EVIDENCE BASE was complete before the
    exposure; ITS WRITE-UP WAS NOT. THEREFORE THE TWO `ADMIT WITH NAMED RESIDUAL`
    RULINGS ARE NOT RECORDED ANYWHERE AS INDEPENDENT CORROBORATION OF EACH
    OTHER, in this decision or in EV-MLKEM-09d715. THE RED TEAM SHARPENED THIS
    CORRECTLY AND I ADOPT ITS SHARPENING: what leaked was a three-word summary
    that OVERSTATES its position -- it adjudicates all six acceptance PASSes as
    correctly reported and rules ADMIT WITH NAMED RESIDUAL -- travelling without
    the polarity warning written to prevent exactly that misreading. So the
    exposure ran toward harshness, and the Validator ruled all three of its own
    joints `holds` and did not follow it. THAT IS AN OBSERVATION ABOUT THE
    OUTCOME AND NOT A DEFENCE OF THE MECHANISM. RULE 12 IS ALREADY UNMET ON TOP
    OF IT, so the correlated-judgement discount applies regardless.
    (3) PD-G'S COST, CHARGED BY THE VALIDATOR AND ACCEPTED IN FULL. Moving the
    blinded cell to beta=25 made the blind a property of the artifacts rather
    than of a reviewer's discipline, and both reviewers uphold the substitution.
    Its price is that NO REVIEWER IN THIS ROUND INDEPENDENTLY REPRODUCED THE
    PRODUCER'S OWN beta=20 FIGURES. The Validator's objection is that the round
    was NARROWER THAN NECESSARY: the beta=20 reproduction costs about 2 s, needs
    no blind at all, and a future round can have BOTH. That objection is correct
    and I accept it. I also accept the Red Team's narrower point that PD-A's
    phrase "met MORE STRONGLY than the gate's TEXT asks" is the one self-
    flattering clause in the trail and contradicts PD-G's own `what_it_costs`
    two hundred lines later; THE HONEST WORD IS DIFFERENTLY, and it is the word
    used from here on.
    (4) I HANDED THE REVIEW-PLAN AUTHOR A WRONG GATE INDEX. I referred to the
    blind-rederivation item as completion_gate item 7 of
    ledger/handoffs/TASK-20260826-9e9d53.yaml; reading the committed list, the
    `blindness.mutual` item is 7th and this is the 8TH. The plan's author
    VERIFIED rather than adopted it and recorded the discrepancy in PD-A instead
    of silently correcting it in either direction. That is the correct handling
    and the error was mine.
    (5) TWO SCHEMA AND PROCESS DEVIATIONS, BOTH MINE TO OWN. (a) The Red Team's
    attestation `verdict` was a MAPPING where tools/check_review_independence.py
    requires a scalar at its line 157, which crashed the tool with a `TypeError`
    rather than a message; at my request its author conformed it, keeping the
    scalar `breaks` as an honest roll-up and preserving the per-joint mapping
    under `verdict_by_joint`, and disclosed the edit inside the file under
    `verdict_shape_note`. That is an EDIT TO A COMMITTED ARTIFACT and sits in
    tension with AGENTS.md rule 4; the honest form would have been a superseding
    sibling file, and what makes it auditable rather than invisible is that the
    artifact says so in its own bytes. (b) The driving session COMMITTED BOTH
    REVIEWERS' PROBE EVIDENCE MID-REVIEW (2a36fe06f for the Validator's 79 probe
    files and blind-rederivation.yaml, with the commit message saying so), which
    is what forced (2) above. tools/check_review_independence.py is reported by
    the driving session as returning PASS after the conformance; this session
    holds no shell and records that as attributed, not as verified by itself.

  process_corrections_binding_on_successors:
    stated_as_corrections_rather_than_regrets: >-
      Each is concrete, each is checkable, and each binds the next session that
      opens a review round on this goal. None competes for the single
      `next_actions` slot below, because none of them is research work.
    corrections:
      - >-
        ARCHIVE COMMIT SUBJECTS MUST NOT CARRY A REVIEWER'S VERDICTS WHILE A
        SIBLING ROUND IS LIVE. Name the task and the artifact class and nothing
        else -- "review(TASK-XXXX): report and attestation landed" -- and put the
        verdicts in the file, where read scope governs. The alternative fix,
        holding all reviewer commits until both reviewers return, is rejected for
        this container: it was the ephemerality risk that motivated committing
        mid-review in the first place, and losing a finished review is worse than
        leaking a subject. THE SUBJECT DISCIPLINE COSTS NOTHING AND CLOSES THE
        CHANNEL.
      - >-
        A ROUND THAT CAN AFFORD BOTH SHOULD BUY BOTH: an artifact-level blind on
        a quantity no artifact carries, AND an ordinary independent reproduction
        of the batch's own reported figures. The second is not a blind and needs
        no embargo. At about 2 s it is not a budget question.
      - >-
        A REVIEWER'S UNDECLARED ARTIFACTS ARE DECIDED AT THE ARCHIVE, EXPLICITLY,
        IN THE RECEIPT. Both reviewers demanded this by name and both are right:
        an undeclared file silently left unstaged is a lost record. The exact
        paths are enumerated in EV-MLKEM-09d715
        `archival_requirements_for_the_ledger_archive`, and the raw kill-matrix
        journals are the item that exists nowhere else.
      - >-
        A REVIEWER-FACING SCHEMA CONSTRAINT IS PART OF THE ASSIGNMENT, NOT A
        SURPRISE AT VALIDATION. `check_review_independence.py` requires a scalar
        `verdict`; say so in the assignment document so no reviewer has to choose
        between an honest per-joint answer and a tool that runs.

  the_sealed_prior_and_the_sealed_blind_answer:
    why_both_are_here: >-
      PUBLISHED VERBATIM AT THIS CLOSE, WHICH IS WHAT "SEALED UNTIL CLOSE" MEANS.
      The prior was written by the driving session BEFORE the executor
      (TASK-20260826-602395) ran; the blind answer was computed and sealed BEFORE
      the Validator ran, together with what each possible mismatch would mean.
      Both were held OUTSIDE the repository for the duration of the round so
      neither reviewer could anchor on either. A PRIOR RECORDED AFTER THE
      VERDICTS IS NOT A PRIOR, and an answer revealed after the derivation is not
      a blind. The Validator held this Coordinator to publishing the prior
      verbatim and warned that a paraphrase would make the seal decoration; it is
      reproduced below unedited, including the paragraph in which it is wrong.
    digests_and_their_provenance: >-
      Prior: sha256 ab97332282caa48480e786a0b4a57f12c164cfce508d3778e7683d962e52ee00,
      quoted from the COMMITTED review_plan.yaml `coordinator_prior`, which
      recorded it before either reviewer ran. Blind answer: sha256
      ef3e291d4f486cda6e325e4f8ebdd0ecd056ab971d821d936e547b061c8fb9ef, quoted
      from the dispatch brief of TASK-20260826-70d800 and NOT from a committed
      artifact, and attributed that way rather than dressed up. THIS SESSION HELD
      NO SHELL AND COMPUTED NEITHER HASH; a later session with a shell can verify
      both against the text below.
    sealed_coordinator_prior_verbatim: |
      # SEALED COORDINATOR PRIOR — GOAL-MLKEM-005 BATCH-762807

      Written **before the executor (TASK-20260826-602395) ran**, held OUTSIDE the
      repository for the duration of the blind review round so neither reviewer can
      read it, and published verbatim in the ledger archive at close
      (TASK-20260826-70d800). The review plan carries only this file's sha256 and a
      sealed marker.

      A prior recorded after the verdicts is not a prior. This is the prior.

      ---

      ## P1 — D6 (root-Hermite) will PASS, and it is the least interesting fix.

      I verified the correction myself in closed form before dispatching: the ratio
      `correct/written = q^(1/2 - 1/(2d))` is b0-independent and equals
      57.24230824954366 at q=3329, d=512, matching the "wrong by 57.242" finding in
      DEC-20260824-5e222e. There is no room for the executor to get this wrong, so a
      PASS here evidences almost nothing. **If a reviewer reports D6 PASS as a
      meaningful result, that is a coverage failure, not a finding.**

      ## P2 — D1, D3, D4 will PASS, and each is nearly free.

      A STARTED stub, per-tour prints and a psutil polling loop are ordinary
      engineering against an environment I confirmed supports all of them
      (`cpu_times()`, `memory_info().rss`, `os.getloadavg()`,
      `resource.getrusage`, all present in the venv). I expect PASS on all three.

      ## P3 — D5 will PASS, but ONLY because I handed over the trap.

      `bkz.trace` is `None` unless `__call__` is invoked with `tracer=True`; the
      decision's own wording ("`tours` obtained from `bkz.trace`") reproduces the
      identical always-`None` defect if followed literally. I measured this and put it
      in the executor's addendum. **Absent that addendum I predict the executor would
      have shipped `bkz.trace` reading `None` and reported D5 PASS.** That is worth
      recording because it says something about the decision text, not about the
      executor.

      ## P4 — D2 IS THE ONE THAT WILL BE WEAK, AND I EXPECT IT TO PASS ITS TEST ANYWAY.

      This is my sharpest prediction and the one I most want attacked.

      Writing JSON from a signal handler is not async-signal-safe. The natural
      implementation sets a flag and flushes **between tours**. At d=64 a tour takes
      ~0.1 s, so a surrogate SIGTERM test passes trivially. At d=512, beta=55,
      mpfr=100 a single tour may take hours — the batch that motivated this repair ran
      **at least 14448 s** and never completed a recordable unit. So a
      between-tours-only flush **reduces the loss window from "the whole run" to "one
      tour", and at d=512 one tour may be the whole run.**

      Concretely, I predict:
       (a) the executor ships between-tour flushing;
       (b) its d=64 surrogate test PASSES;
       (c) the residual window at d=512 is NOT closed;
       (d) the executor states (c) only if pushed, and the addendum pushes it.

      **If the executor ships mid-tour flushing that genuinely closes the window, I am
      wrong and that is the batch's real result.**

      ## P5 — THE BATCH'S HONEST OVERALL OUTCOME: six PASSes and an instrument still not demonstrably fit for d=512.

      Every acceptance test is a **d=64 surrogate**. The failure being repaired
      manifests only at d=512. Therefore a green `acceptance_results.json` establishes
      that the fixes *fire*, and establishes **nothing** about whether they fire at the
      scale that matters. I expect the batch to close with:

      - `acceptance_results.json` PASS on D1–D6;
      - the loop-equivalence control reproducing 26 tours at d=64;
      - and an `admissibility_ruling` that should honestly be **ADMIT WITH A NAMED
        RESIDUAL**, not a clean ADMIT.

      **I pre-commit to disbelieving a clean unqualified ADMIT from either reviewer.**
      If both reviewers return ADMIT with no residual named, I will treat the round as
      having under-covered rather than as having cleared the instrument.

      ## P6 — What would change my mind, stated in advance

      - A mid-tour flush mechanism that demonstrably records partial state from inside
        a long tour → P4 refuted, and the batch is stronger than I expect.
      - A tour-count or b0 mismatch against upstream `__call__` at d=64 → the
        instrumentation changed the algorithm; that is a FAIL and a good one, and the
        batch's result becomes "the pinned construction cannot be instrumented this
        way".
      - Any acceptance test that cannot run → NOT_REACHED is a legitimate outcome and
        must not be converted into a PASS.

      ## P7 — What this batch cannot conclude, whatever happens

      Nothing here is evidence about ML-KEM at any standardized parameter set, about
      lattice hardness, or about the RT-CTRL-1 obstruction. Claim ceiling
      `instrument_repair`, `analyzed` at best, never `supported`. Claim tier stays
      **toy**. No hypothesis moves; H-MLKEM-7d9bcc stays `proposed` and
      EXP-MLKEM-42ea04 stays `review_required` / `approved_by: null`.

      Rule 12 status, stated in advance so it is not discovered at close: producer,
      Coordinator, Validator and Red Team on this batch all resolve to one model.
      Agreement among them is correlated same-model judgement and is **not**
      independent corroboration.
    sealed_blind_answer_verbatim: |
      # SEALED — the blinded quantity's true value, BATCH-762807

      Held OUTSIDE the repository. Not in the review plan, not in either assignment,
      not in any message to any reviewer. Published by TASK-20260826-70d800 at close,
      beside the Validator's independently derived value, so the comparison is on the
      record rather than on my say-so.

      Computed by the driving session from the pinned predecessor's construction,
      transcribed from the upstream fpylll source, NOT from the producer's v2.

      CELL: d=64, beta=25, mpfr_bits=53, q=3329
      SEED: 613149553, from int(np.random.default_rng([715923,0,64,25,0,0]).integers(0,2**31-1))
      STRATEGIES: fplll_strategies_default.json,
                  sha256 f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18

        upstream BKZReduction.__call__(par, tracer=True)  -> 13 tours, b0 = 130.15375522819156
        transcribed instrumented loop                     -> 13 tours, b0 = 130.15375522819156
        MATCH: True (bit-identical)                          wall clock ~2.1-2.3 s each

      ## Why this cell

      The producer ran ONLY beta=20 (105 occurrences) and ONLY d=64 (106). It never
      ran beta=25. Grepping the whole batch for 130.153, 613149553, and beta=25:
      ZERO hits in tasks/, batch.yaml and dispatch_queue.json. So there is nothing to
      leak and the blind is a property of the artifacts rather than of an attested
      read order.

      ## What a mismatch would mean, decided in advance

      - Validator reports 13 / 130.15375522819156  -> the transcription is faithful at
        a block size the producer never fitted to. This is the outcome I expect.
      - Validator reports 13 tours but a different b0 -> a GSO-vs-integer-row reading
        difference, which is why the plan demands b0 under both readings.
      - Validator reports a DIFFERENT TOUR COUNT, most likely a larger one, AND does
        not name its strategies bytes -> almost certainly the strategies-omitted
        failure. The driving session hit exactly this at beta=20 (13 vs 9) and traced
        it to its own probe. PTM-1 exists to force the separation.
      - Validator reports a different count AND names the correct strategies sha256
        -> a real finding against the instrument, and the batch's headline result.

      Recording these in advance so that whichever occurs, it is not re-interpreted
      afterwards to suit the instrument.

  the_blind_adjudicated:
    outcome: >-
      THE BLIND SUCCEEDED. The Validator, working from a construction it
      transcribed from the pinned predecessor and never from v2, and having
      written its own definition of "number of tours" before opening any producer
      file, reported 13 TOURS and b0 = 130.15375522819156 at d=64, beta=25,
      mpfr_bits=53, seed 613149553 -- ITS OWN evaluation of the pinned formula,
      whose VALUE was withheld from it. THE SEALED VALUE IS THE SAME, TO THE
      LAST DIGIT, AND WAS FIXED BEFORE THE REVIEWER RAN. Both b0 readings agree
      bit-for-bit; three separate processes give [13, 13, 13]; a second
      independent route via upstream's own tracer gives 13; and the v2 instrument
      run afterwards on the same cell under strategies bytes named on both sides
      gives 13 and 130.15375522819156.
    which_branch_of_the_sealed_forecast_occurred: >-
      THE FIRST -- "the transcription is faithful at a block size the producer
      never fitted to", which the sealed file names as the expected outcome. The
      other three branches DID NOT occur: there was no b0 reading difference, no
      differing tour count with unnamed strategies bytes, and NO FINDING AGAINST
      THE INSTRUMENT'S COUNT. Recording which branch fired matters because the
      alternatives were written down first and cannot now be re-interpreted to
      suit the instrument.
    what_the_blind_does_and_does_not_establish: >-
      It establishes that ONE quantity at ONE cell agrees exactly with an
      independent construction, and that the producer's loop transcription works
      at a block size it was never fitted to. IT IS NOT REPLICATION, it does not
      transfer to beta=20, to d=512 or to ML-KEM, and it does not make the
      instrument fit for the next run -- both reviewers said so, and so does
      EV-MLKEM-09d715.
    the_control_that_made_it_mean_something: >-
      PTM-1 did not pass vacuously. The strategies-omitted construction, on the
      identical cell at the identical seed, returns 26 tours and b0
      130.28046668629952. Had either side of any comparison been built without
      `strategies=`, a "mismatch" would have been reported that measured nothing.
      The Validator drew no comparison between 13 and 26 and none is drawn here.

  the_prior_scored_against_the_outcome:
    why_this_block_exists: >-
      A SEAL IS ONLY WORTH WHAT IS DONE WITH IT AT CLOSE. Scoring the prior
      against the verdicts is the entire purpose of writing it early, and a score
      that records only the hits would be worse than no seal at all.
    P1_D6: >-
      HELD, INCLUDING ITS WARNING. D6 passed and neither reviewer treated it as a
      meaningful result: the Validator labelled its own re-derivation NON-BLIND
      and lesser, attached the PTM-3 known-false control, and the Red Team found
      no scale-only failure mode and declined to manufacture one. The coverage
      failure P1 warned about did not occur.
    P2_D1_D3_D4: 'HELD. All three PASS, and the Red Team finds D1 the one fix that transfers to d=512 unconditionally.'
    P3_D5: >-
      SPLIT, AND THE UNTESTABLE HALF IS MARKED AS UNTESTABLE. The claim about the
      DECISION TEXT is corroborated: the Validator verified independently against
      the installed source that `bkz.trace` is None after a default `bkz(par)`,
      so DEC-20260824-5e222e's own wording ("`tours` obtained from bkz.trace")
      would reproduce the always-None defect if followed literally, and it judged
      the producer's refusal to read `bkz.trace` on the driving path "the right
      call". The counterfactual half -- that absent the addendum the executor
      would have shipped a `None` -- IS NOT CHECKABLE FROM ANY ARTIFACT AND IS
      NOT CLAIMED AS CONFIRMED. It remains an unverified prediction about a
      counterfactual, and a self-serving one, since the addendum was mine.
    P4_D2: >-
      LARGELY HELD, WITH ONE CLAUSE I WILL NOT CLAIM. (a) HELD -- the refresh is
      at tour start, tour end and heartbeat, and the flush is deferred by the GIL
      inside a long C call. (b) HELD -- the d=64 surrogate passes, in ten kill
      scenarios. (c) HELD -- the residual window at d=512 is NOT closed, and both
      reviewers name it independently. (d) NOT SUSTAINED AS WRITTEN: the executor
      stated the residual PROMINENTLY AND AGAINST ITS OWN INTEREST in section 8
      item 2, and both reviewers record its disclosure list as more
      against-interest than this program usually sees. Whether the addendum was
      what produced that is not recoverable from the artifacts; the disclosure is
      the producer's and is credited to it. P4's own refutation condition -- a
      mid-tour flush that genuinely closes the window -- did NOT occur, so I am
      not wrong in the way I said I might be.
    P5_the_overall_outcome: >-
      TWO HITS AND ONE OUTRIGHT MISS, AND THE MISS IS RECORDED FIRST. THE MISS:
      the prior predicted "the loop-equivalence control reproducing 26 TOURS at
      d=64". IT IS 9. The producer's equivalence control reproduces 9 tours on
      BOTH arms at d=64/beta=20, with b0 140.93615575855614 bit-identical on both
      sides and trace child labels [lll, tour x9], and the Validator recomputed
      all of that from the raw JSON. The 26 I expected belongs to the addendum's
      differently-constructed probe (a bare matrix, ROW_EXPO double GSO, no
      strategies file) -- exactly the construction difference the producer's own
      report explains -- and, coincidentally, to the Validator's strategies-free
      PTM-1 control at beta=25. I ANCHORED ON A NUMBER FROM THE WRONG
      CONSTRUCTION, WHICH IS THE SAME CLASS OF ERROR AS THE ONE THIS BATCH KEEPS
      FINDING IN THE INSTRUMENT, AND THE SEAL IS WHY IT IS ON THE RECORD RATHER
      THAN QUIETLY ABSENT. THE HITS: six PASSes, and both reviewers ruling ADMIT
      WITH A NAMED RESIDUAL rather than a clean ADMIT.
    P6_what_would_have_changed_my_mind: 'NONE OF THE THREE FIRED. No mid-tour flush mechanism; no tour-count or b0 mismatch at d=64 (the opposite -- exact agreement); no NOT_REACHED anywhere on the board, and none was converted into a PASS.'
    P7_what_cannot_be_concluded: >-
      HELD, AND INDEPENDENTLY AUDITED. Both reviewers searched every record of
      this batch they read for a sentence reading as though a green board were a
      result or as though anything here authorised the 100-bit re-run, AND
      FOUND NONE. The Red Team calls it the batch's most consistent property.
      The ceiling is unchanged by this decision.
    the_pre_commitment_P1_and_its_cost_owned: >-
      P1 pre-committed me to disbelieving a clean unqualified ADMIT. Both
      reviewers returned ADMIT WITH NAMED RESIDUAL, so the under-coverage clause
      did not fire. THE VALIDATOR HELD ME TO THE SECOND HALF OF THAT AND IS
      RIGHT TO: I MAY NOT TREAT ITS RESIDUAL AS VINDICATION OF MY OWN
      PRE-COMMITMENT WITHOUT ENGAGING THE MEASUREMENT BEHIND IT. So, engaging it:
      the residual is not a mood, it is 13 tours against 26 and two different b0
      values on the SAME cell at the SAME seed under two NAMED strategies states,
      with PTM-1 establishing why the wrong state is entered silently -- a
      strategies-free `BKZ.Param` does not raise, it degrades to one pruning
      parameter set where the pinned file has 21. That measurement would carry
      the same weight if P1 had never been written. THE RED TEAM'S CHARGE AGAINST
      P1 IS ALSO ACCEPTED: telling both reviewers in advance that a bare ADMIT
      will be read as under-coverage puts a thumb on the scale toward naming a
      residual, and `what_this_is_not` cannot fully remove an incentive it
      acknowledges. Both reviewers stated that their residuals were reached from
      source and probe BEFORE they weighed P1 and invited the close to verify the
      ordering from their reports rather than credit their word; the Validator's
      probe timestamps and the Red Team's own probe output support that ordering,
      and it is checkable by anyone. THE MITIGATION FOR NEXT TIME IS NOT TO DROP
      THE PRE-COMMITMENT BUT TO RECORD IT SEALED, AS THE PRIOR WAS, RATHER THAN
      PUBLISH IT TO THE REVIEWERS.

  admissibility_adjudication:
    the_two_rulings: >-
      BOTH REVIEWERS: ADMIT WITH NAMED RESIDUAL. Validator (J1, J2, J3 all
      `holds`), residual = the strategies file is not bound by content at run
      time. Red Team (J4, J5, J6 all `breaks`, with a polarity warning that
      `breaks` attacks the INFERENCE and not the board), residuals R1-R5.
      NEITHER GAVE A BARE ADMIT AND THE TWO NAMED DIFFERENT RESIDUALS.
    they_are_not_corroboration_of_each_other: >-
      Recorded twice on purpose, here and in EV-MLKEM-09d715. Rule 12 is unmet --
      one model throughout -- and the round's mutual blindness was breached in
      one direction by this Coordinator's own commit subject. Each ruling stands
      on the evidence it measured; their agreement adds nothing and is used for
      nothing.
    the_composite_ruling_this_decision_adopts: >-
      THE INSTRUMENT IS ADMITTED AS THE INSTRUMENT OF RECORD FOR THIS LANE,
      SUPERSEDING THE PREDECESSOR, AND THE NEXT CAPPED RUN IS STILL NOT
      AUTHORISED. Refusing admission would leave the lane with an instrument that
      could not have recorded a success even if it had got one, which is strictly
      worse and would be premature closure -- a failure mode symmetric with
      overclaiming. Authorising the run today would spend a 14448 s-plus budget
      on records that can be silently wrong at exactly beta=55. Both reviewers
      say in terms that an ADMIT IS NOT AN APPROVAL: approval is a frozen
      contract at a declared path plus a committed Coordinator decision, and
      neither exists for the 100-bit cell. THIS DECISION IS NOT THAT DECISION.
    what_this_close_does_not_do: >-
      It freezes no experiment contract, approves no run, moves no hypothesis
      status, lifts no refusal, raises no cap, extends no budget, and asserts
      nothing about ML-KEM at any FIPS 203 parameter set.

  limitations:
    - >-
      NOTHING IN THIS BATCH IS EVIDENCE ABOUT ML-KEM AT ANY STANDARDIZED
      PARAMETER SET, about lattice hardness, or about the obstruction RT-CTRL-1
