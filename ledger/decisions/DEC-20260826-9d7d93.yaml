      about whether they fire at the scale that matters. That gap was declared at
      opening, not discovered at review.
    - >-
      No reviewer independently reproduced the producer's own beta=20 figures.
      The disclosed price of PD-G.
    - >-
      The producer's D5 equivalence control passes `tracer=True` while the
      instrument uses the dummy tracer; the Validator controlled for that
      difference at beta=25 only. It is closed by nobody at beta=20.
    - >-
      Rule 12 is UNMET AND UNWAIVED throughout, and the round's mutual sibling
      blindness held in one direction only.
    - >-
      This decision was composed by a Coordinator subagent with no shell. It ran
      no validator, computed no hash, made no commit and verified no commit sha.
      Whether the ledger archive that carries it is accepted by the post-commit
