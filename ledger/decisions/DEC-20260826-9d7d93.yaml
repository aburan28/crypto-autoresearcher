  next_actions:
    - >-
      ONE ACTION, AND IT IS NOT THE 100-BIT CELL: RUN ONE MORE ZERO-LATTICE-COMPUTE
      INSTRUMENT PASS ON rt_ctrl_1_matched_pair_v2.py, AS A SUCCESSOR FILE IN A
      NEW BATCH, CLOSING THE RESIDUALS BOTH REVIEWERS NAMED, AND ACCEPTANCE-TEST
      EACH ONE AT d=64 EXACTLY AS D1..D6 WERE. Five items, each with its remedy
      already named by a reviewer and none costing lattice compute:
      (a) BIND THE STRATEGIES FILE BY CONTENT AT RUN TIME -- assert its expected
      sha256 before constructing `BKZ.Param` and REFUSE the run on mismatch, and
      emit the strategies provenance unconditionally including an explicit null
      when none was passed. This is the Validator's admission residual and the
      failure class BATCH-f9780d died of;
      (b) JOURNAL THE PROLOGUE -- one `phase_start`/`phase_done` record after the
      outer LLL and after the pre-loop LLL, using the pattern already implemented
      for `tour_start`, so the window that is 0.000378 s at d=64 and at least
      498.9597418308258 s at d=512 is not blind and a kill inside it cannot flush
      `tours: 0` with a near-zero elapsed;
      (c) MAKE THE SIZING COMPUTABLE -- journal the per-tour GSO log-norm slope,
      or the `BKZ.AutoAbort` statistic itself, as one more key in the existing
      per-tour row, at a cost of O(d) mpfr reads against a tour of minutes. This
      is the half of DEC-20260824-5e222e's sizing requirement that is currently
      missing; it makes N an EXTRAPOLATION FROM A RECORDED SERIES WITH A VISIBLE
      FIT rather than a measurement, and that difference must be stated wherever
      the number is used;
      (d) RESET `_H_PAYLOAD` AND RESTORE `SIG_DFL` in `run_cell`'s existing
      `finally`, guarded by `arm_signals`, so a signal after a completed cell
      cannot write `KILLED_PARTIAL` with `failed_infrastructure: true` for a cell
      that COMPLETED; and make the handler's fd-1 notice CONDITIONAL on the
      journal write having succeeded;
      (e) CORRECT THE `tours_definition` WARRANT -- the code needs no change and
      only the stated reason is wrong, and it is wrong precisely from block size
      46 up, which is where the next run lives.
      ALSO NAMED AND EXPLICITLY NOT REQUIRED, so that a later reader sees they
      were weighed rather than missed: the per-tour `ru_maxrss` key (R2), the
      per-tour load-average key (M4), and an in-loop deadline test at the top of
      the driving loop (R5). Each is one line and each may be taken in the same
      pass at the executor's discretion; none of them is a condition of the
      100-bit cell, and (c) is preferred over all three if effort must be
      rationed. THE 100-BIT CELL IS CONTRACTED ONLY AFTER THAT PASS IS ARCHIVED
      AND REVIEWED, AND ITS AUTHORISATION REQUIRES A FROZEN CONTRACT PLUS ITS OWN
      COMMITTED DECISION, WHICH THIS DECISION IS NOT.
  next_action_singularity_note: >-
    EXACTLY ONE ACTION, AS THE GOAL HEAD REQUIRES, AND IT IS CARRIED VERBATIM
    INTO ledger/goals/GOAL-MLKEM-005.yaml `next_action` at this checkpoint. Items
    (a)-(e) are the content of one instrument pass in one successor batch, not
    five competing actions; this goal's own prior next_actions carry lettered
    sub-items in the same way. The process corrections above are recorded
    separately and deliberately do not compete for the slot.
  why_not_the_alternatives:
    straight_to_the_100_bit_cell: >-
      CONSIDERED AND REJECTED ON THE MERITS, NOT ON CAUTION. The argument for it
      is real: both reviewers ADMIT, the instrument is unambiguously better than
      the predecessor on the axis that failed, a capped d=512 cell can no longer
      produce literally nothing, and premature closure is a failure mode
      symmetric with overclaiming. It is rejected because the run's PURPOSE is
      sizing, and without item (c) the record it returns is a cost prefix with an
      unknown N -- which is to say it would not discharge the thing it is for.
      Add item (a) and the arithmetic is decisive: a run that costs at least
      14448 s can, today, be launched against silently divergent strategy bytes
      at a block size no run in this goal has ever exercised, and every hash
      would be dutifully written down beside the wrong answer. The pass costs
      minutes.
    pausing_the_goal: >-
      REJECTED. No declared pause condition fired -- checked against the goal's
      own `pause_conditions` -- and the campaign budget is deliberately
      unbounded, so `closed_at_budget` cannot fire for this goal. There is a
      concrete, cheap, well-specified next step with two independent reviews
      naming its content. Pausing here would be exactly the premature closure
      docs/inventor-protocol.md names.
    doing_nothing_further_to_the_instrument_and_re_scoping_the_lane: >-
      REJECTED AND RECORDED SO IT IS NOT REDISCOVERED AS A NEW IDEA. The lane's
      ceiling is already known and already recorded in the goal head
      (`ceiling_known_in_advance`); nothing in this batch bears on it, and this
      batch is not the place to re-litigate it.

  budget_sizing_rule_carried_forward: >-
    UNCHANGED AND RESTATED BECAUSE IT SURVIVES WHICHEVER NEXT ACTION IS TAKEN.
    WHEN THE 100-BIT CELL IS EVENTUALLY RE-ATTEMPTED, ITS BUDGET IS SIZED FROM
    THE 14448 s LOWER BOUND BATCH-f9780d MEASURED, NEVER FROM THE PREDECESSOR'S
    2502.74 s, WHICH IS A FAILURE TIME AND NOT A COST -- DEC-20260815-3e8e9c says
    so in terms and DEC-20260824-5e222e repeats it. Two further facts now bear on
    that sizing and are recorded here rather than left to be rediscovered: the
    14448 s is a LOWER BOUND ON AN UNFINISHED COMPUTATION and the fraction
    complete is unknown; and the prologue alone at d=512 is committed at
    498.9597418308258 s for the outer LLL at 75 bits, unknown at 100 bits, so a
    budget that does not carry the prologue separately is already wrong. NO
    NUMBER IS AUTHORISED BY THIS DECISION AND NONE IS NAMED; the Red Team
    declined to name one for the same reason.

  finding_against_a_committed_prior_decision:
    what: >-
      DEC-20260815-3e8e9c condition (i) calls the tours-per-hour cost curve from
      a killed cell "EXACTLY the quantity a Stage-1 sizing decision needs and does
      not have". THE QUANTITY IS NECESSARY AND IT IS NOT SUFFICIENT, and
      "exactly" is the overstatement. Total cost = prologue + sum over N tours; a
      tours-per-hour figure is a THROUGHPUT and constrains only the per-tour
      terms. Under `flags=BKZ.AUTO_ABORT` with `max_loops == 0`, N is set by a
      basis-quality criterion the record cannot reconstruct from a first value
      and a sum.
    what_it_does_not_license: >-
      IT DOES NOT RE-OPEN OR RE-LITIGATE DEC-20260815-3e8e9c, it moves no status,
      and it is not a claim that no sizing is possible -- only that sizing from
      the prescribed quantity ALONE is not. The remedy is item (c) of the next
      action and is cheap.
    where_the_fault_is_not: >-
      NOT WITH THE PRODUCER. It implemented what was prescribed, implemented it
      well, and gave a per-tour SEQUENCE where a rate was asked for, which is more
      than the prescription demanded. Said plainly because a finding against a
      prescription is easy to read as a finding against the implementer.

  knowledge_promotion:
    promoted: []
    warranted: false
    not_warranted: >-
      NOT WARRANTED NOW, AND THE REASON IS THE GATE RATHER THAN THE VALUE OF THE
      LESSON. The promotion rule fires on a `support` or `reject_scoped` decision
      backed by `replicated` or `strong` evidence; this decision is neither and
      EV-MLKEM-09d715 is `preliminary`. Promoting on two same-model reviewers of
      a d=64 surrogate board would be exactly the overclaim the rule exists to
      prevent.
      THE CANDIDATE IS NAMED EXPLICITLY, BECAUSE THE CLOSE WAS ASKED TO SAY
      EITHER WAY AND BECAUSE A SILENT DEFERRAL IS INDISTINGUISHABLE FROM A
      DROPPED LEAD. The candidate is: A PRODUCER INPUT BOUND BY PATH RATHER THAN
      BY CONTENT AT RUN TIME DEGRADES SILENTLY, WHILE A MISSING PATH FAILS
      LOUDLY -- so a recorded-but-unchecked hash is provenance, not binding, and
      the loud failure mode is the safe one. DEC-20260824-5e222e already named
      this as a candidate and deferred it with the condition "revisit when the
      successor batch produces a terminal result under a fixed instrument".
      WHAT THIS BATCH ADDS: a MEASURED cost on one cell (13 tours against 26, two
      different b0 values, same seed, same construction); a MECHANISM for the
      silence (a strategies-free `BKZ.Param` does not raise -- it yields a trivial
      set with one pruning parameter set where the pinned file has 21 at block
      size 25, and `BKZ.DEFAULT_STRATEGY` in this build points at a path that does
      not exist in this container); the ASYMMETRY stated crisply (explicit bad
      path raises `RuntimeError: Cannot open strategies file.`, omission does
      not); and two further instances -- the producer's own DEV-1
      `FileNotFoundError` and the recurrence during this round's preparation
      recorded in review_plan.yaml. THAT IS ENOUGH INSTANCES TO BE A GENUINE
      KN-FIND CANDIDATE AND I SAY SO RATHER THAN LEAVING IT IMPLICIT.
      WHY IT STILL WAITS, AND FOR EXACTLY WHAT: (1) the gate above; (2) the
      successor batch's item (a) turns the lesson from an observed hazard into a
      lesson with a checked remedy, which is the form a KN-FIND should carry;
      (3) no KN identifier was pre-allocated for this batch and this session holds
      no shell to mint one -- batch.yaml `reserved_identifiers_note` named that
      constraint AT OPENING rather than leaving it to be discovered here.
      REVISIT CONDITION, CONCRETE AND BINDING ON THE NEXT CLOSE: at the close of
      the successor batch that implements run-time content binding, promote this
      as a KN-FIND under the /curate-knowledge conventions, with its identifier
      minted and `--check`ed by the driving session BEFORE that close, and with
      `knowledge/INDEX.md` regenerated in the same ledger archive commit. Two
      knowledge promotions already remain owed on this goal from GOAL-MLKEM-003;
      this one is not to join them by drift.

