        - id: RT-2
          item: Record completeness of the QSP custody lineage
          text: >-
            The in-scope QSP decisions were written without naming the
            epoch-2 claim, its release, or RUN-QSP-ef2490 (F-7).
            DEC-20261002-a63f13 records the session's report that
            TASK-20260921-9f84a3 had no release, and the epoch-2 release now
