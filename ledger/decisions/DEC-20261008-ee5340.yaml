        authority with epoch and owner, and host paths, and each of these
        matches a committed coordination record (F-4, F-5). They are not a run
        record set with outputs, because the trial's declared artifacts
        manifest.yaml and raw-result.json are absent (F-2). WHO AND WHERE. The
        launch was made under claim epoch 2 of TASK-20260921-9f84a3, by owner
        run-qsp-cont-20261001 (session opencode-run-20261001), from worktree
        /Volumes/SSD990/crypto-autoresearcher on branch
        exec/aes-14352a-stage1, on 2026-10-01 (F-1, F-5). The files were
        committed by e294b34ac8, whose message names "the failed QSP stage-3
        launch". That commit was the head of aburan28/exec/aes-14352a-stage1
        when PR 1498 merged it into main at 64447e7331 on 2026-10-02 (G-1,
        G-2). The commit's author identity, Dispatch Test, does not identify a
        session (DEC-20261008-89d673 R-BEARING). The match of branch names
        between the epoch-2 claim and PR 1498 ties the publication to that
        branch, but not provably to session opencode-run-20261001. WHAT THEY
        NAME. Plan experiments/EXP-QSP-70b731/trial-plan-cont.json, by the
        digest TASK-20260921-9f84a3 declares for it (F-1, F-4). Task
        TASK-20260921-9f84a3 (BATCH-2c4a9c), by the claim owner and epoch
        (F-5). Trial stage3-bridge-n22. Run id RUN-QSP-ef2490. Source and
        specification digests equal to trial-plan-cont.json's (F-3). Authority
        commit 96d226e2e4 and dispatch plan digest 5dcfa47359 (F-1). Platform
        darwin (F-3).
      not_answerable: >-
        Two points cannot be answered from git metadata and committed records.
        (a) Whether session opencode-run-20261001 made commit e294b34ac8
        itself. (b) Whether authority commit 96d226e2e4 is reachable from
        origin/main. This reader ran no git command. Neither changes FR-2 to
        FR-4.

    - id: FR-2
      subject: Protocol standing
      answer: >-
        BOUND TO trial-plan-cont.json THROUGH TASK-20260921-9f84a3, UNDER AN
        EXECUTION APPROVAL NOW SUPERSEDED, AND TO NOTHING OF THIS LANE. The
        launch was authorised when it happened. DEC-20260921-f0e100 had
        approved TASK-20260921-9f84a3 for trial-plan-cont.json (F-4), and the
        claim was published and not forced (F-5). DEC-20261002-5e691c
        R-CONTINUATION, decided on 2026-10-02, then superseded that approval
        for execution. No trial of trial-plan-cont.json may be launched under
        it (F-7). The launch on 2026-10-01 preceded that ruling. Today no
        approval or execution card authorises any further act on these files
        or on that plan. The files bind to no BATCH-521e9d object, to no
        amendment, and to neither CI-2 path. The record also notes that the
        launch platform was darwin, while trial-plan-cont.json's
        supersession_reason and DEC-20261002-e0aa2b CC-3 call for Linux, and
        the runner refused the launch (F-2, F-3, F-5). That is an execution
        infrastructure fact. It is not a validity reading beyond FR-2, and it
        is not a negative result (AGENTS.md core rule 5).
      conflict_with_this_lane: >-
        None. The approval is superseded. The one execution ended, with its
        claim released as failed, before BATCH-521e9d opened. No QSP claim is
        live (stop-facts SF-5). The lane writes only implementation/r1/,
        trial-plan-r1.json, the amendment path and its own coordination
        paths, and uses fresh run ids (R-IDS), none of which the files touch.

    - id: FR-3
      subject: Round-2 custody
      answer: >-
        AVOID RUN-QSP-ef2490. That is the one run id the files name, and the
        name of the directory experiments/EXP-QSP-70b731/runs/RUN-QSP-ef2490/,
        which is now a bound directory on origin/main. It was already a run id
        of an earlier EXP-QSP-70b731 plan (trial-plan-cont.json), so
        DEC-20261002-c01bb7 R-IDS already excludes it. Under
        DEC-20261008-89d673 R-ROUND2-GATE it is added expressly to the avoid
        list. The id has also been used by two launch attempts, epoch 1 and
        epoch 2 (F-6, F-5), which makes it doubly unsafe to reuse. The files
        name no other run id. The R-IDS check stays the operative rule. It
        runs over every run id of every earlier EXP-QSP-70b731 plan and every
        bound directory name, and this list does not replace it.
      bearing_on_CC-2: >-
        None. The files add a directory for one trial only. It holds no output
        artifact and no trial outcome (F-2), and no composing decision has
        classified it (F-7). CC-2 requires the re-run of the trials it names
        under fresh ids in the successor plan. Nothing here adds to or removes
        from that set, and nothing here can be carried as a measurement.
      bearing_on_CI-2: >-
        None. All eight added paths are under runs/RUN-QSP-ef2490/ (G-1).
        Nothing is added under experiments/EXP-QSP-70b731/implementation/r1/ or
        at experiments/EXP-QSP-70b731/trial-plan-r1.json, and stop-facts SF-2
        shows no commit outside runs/ since 32ffef4661. The session's
        pre-executor check that neither CI-2 path exists stands as written.

    - id: FR-4
      subject: Duplication or mootness
      answer: >-
        NOT DUPLICATED, NOT MOOT. (1) The activity the files record is
        execution of the unrepaired implementation closure that
        trial-plan-cont.json binds. It is not a repair. This lane designs and
        later implements a repaired closure under implementation/r1/ with a
        successor plan. (2) The activity ended on 2026-10-01, with the claim
        released as failed (F-5), before this lane opened. It has no later
        trace on origin/main or on origin/exec/qsp-70b731-run-20260921
        (stop-facts SF-2 to SF-4), no live QSP claim (SF-5), and no owner
        message (SF-8). (3) The release's own note says a retry needs a new
        run id, additive authorization and Linux. No such authorization
        exists, and DEC-20261002-5e691c forbids launching that plan. (4) A
        refused launch produces no observation. Nothing in the files answers
        the question the lane exists to make answerable, so the lane is not
        moot.
      remaining_uncertainty: >-
        Whether epoch 1's attempt under the same run id (F-6) left output
        anywhere outside origin/main. Whether session opencode-run-20261001,
        or any other party, intends a further launch. Neither is evidence of
        current duplication. A new commit or a live QSP claim is already a new
        stop under DEC-20261008-89d673 T-4.

