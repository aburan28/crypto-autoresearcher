        - id: RT-3
          item: The epoch-1 attempt under RUN-QSP-ef2490
          text: >-
            Bus messages from coordinator-qsp-run-20260921 report execution
            under epoch 1 with the run directory created (F-6). That claim has
            no release, and nothing from epoch 1 is among the eight files,
