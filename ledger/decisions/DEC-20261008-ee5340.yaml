  rulings:
    - id: FR-1
      subject: Provenance
      answer: >-
        WHAT THE FILES ARE. The eight files are the launch record of ONE
        REFUSED LAUNCH, written by the experiment-execution supervisor:
        launch.json, command.txt, environment.json, an execution receipt with
        status infrastructure_error, and four empty logs (F-1, F-2). They are
