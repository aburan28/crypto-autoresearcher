coordinator_decision:
  id: DEC-20260803-6b526a
  context: >-
    GOAL-AES-003 BATCH-005 close, recorded OUT OF ORDER and after BATCH-006,
    BATCH-007 and BATCH-008. The delay is itself part of the record and is
    explained below. BATCH-005 was a control-and-close batch: the GF(2^8)
    zero-entry arm at r=6, and a deconfounding of the apparent S-box effect. It
    was bound by a dispatcher-verified snapshot archive and reviewed by an
    independent validator and an independent red team.
  decision: support_with_reduced_standing
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-752cf1]

  why_this_decision_is_late_and_what_that_cost:
    what_happened: >-
      BOTH REVIEW REPORTS WERE INVISIBLE TO VERSION CONTROL FOR THREE BATCHES.
      Six directory-form .gitignore entries, added to keep the BATCH-005 snapshot
      commit pure and never lifted, suppressed the reviewer directories. The
      reports -- 42 KB and 66 KB -- were written into them and never appeared in
      `git status`, which reported a clean tree throughout. The Coordinator
      believed this batch had no completed reviews and moved on.
    what_it_cost: >-
      THREE BATCHES WERE RANKED WITHOUT A COMPLETED RED TEAM READING THAT ALREADY
      EXISTED. The red team's OBJ-1 refuted this campaign's headline PRP-null gap
      claim, and its RC-9 and RC-10 became BATCH-008's entire agenda -- a batch
      that would have been opened three batches earlier had the report been
      visible. Nothing was lost mathematically; sequencing was.
    disposition: >-
      Recorded as CORR-20260803-ba2eb7, with the .gitignore class of bug removed
      rather than the two instances. A seventh directory-form entry was found
      live over a running BATCH-007 validator and removed before that report
      existed.

  rationale:
    - >-
      THE BATCH ANSWERED ITS RANK 2 QUESTION AND THE ANSWER IS THE REASSURING
      ONE. At GF(2^8), r=6, four-zero matrix, the fiber-divisibility signature is
      ABSENT, so the mechanism dies between r=5 and r=6 at byte width exactly as
      it did in the GF(2^4) nibble instrument. The BATCH-004 validator had ruled
      that the nibble analogue could not establish the byte-width round count --
      the mod-8 margin is 2x the modulus at nibble width against 32x at byte
      width -- so a contradiction here would have meant a central campaign
      conclusion rested on an analogue that misled. It does not.
    - >-
      THE APPARENT S-BOX EFFECT DID NOT SURVIVE DECONFOUNDING, AND THE REVERSAL
      IS CLEAN. T1 p = 0.458 and T4 p = 0.834 WITH THE SIGN REVERSED against
      BATCH-004's p = 0.023; the exact interval on the rate ratio is
      [0.606, 1.443] and BATCH-004's 1.86 lies outside it. The red team
      recomputed all four statistics from the nine counts in its own code. A
      campaign retiring its own p = 0.023 is working correctly.
    - >-
      THE RED TEAM REFUTED THIS BATCH'S OWN HEADLINE, AND THAT WAS THE FIRST OF
      FOUR SUCH FAILURES. The snapshot receipt claimed no arm had ever measured
      the PRP null; the producer had written only that it was "analytic and
      unverified by measurement", and the Coordinator compressed that into a
      stronger claim. Eleven prior null arms exist. This is the origin of the
      absence-claim pattern now governed by the mechanical rule in
      DEC-20260803-f6f113.
    - >-
      SUPPORT IS AT REDUCED STANDING BECAUSE THE VALIDATION NEVER CONCLUDED. The
      validation report's arithmetic matches everywhere it was checked, but its
      verdict field reads PLACEHOLDER: the session ended before it ruled. A
      review with matching arithmetic and no ruling is not a passed review, and
      EV-AES-752cf1 is weak for that reason rather than for any defect in the
      measurements. Supplying a verdict on the validator's behalf was available
      and is declined.

  evidence_refs:
    - EV-AES-752cf1
    - CORR-20260803-ba2eb7
    - CORR-20260803-c92db5
    - CORR-20260803-9a67de

  the_red_team_ruling_this_batch_was_built_to_reach:
    what_it_ruled: >-
      PAUSE GOAL-AES-003 on a stated resume condition, after discharging one
      correction and two one-minute controls (RC-9 and RC-10). It explicitly
      declined to recommend closure or a terminal barrier statement, noting that
      a barrier at the inventor-protocol section 4 standard needs a named
      obstruction with an argument, and that its own PA-4 was an obstruction
      about THIS INSTRUMENT at r=6 rather than about RQ-AES-003.
    its_binding_precondition: >-
      "RUN RC-9 BEFORE ANY LEDGER RECORD IS WRITTEN... a pause with an unrun
      one-minute falsifier is not a pause on the evidence."
    is_it_discharged: >-
      YES. BATCH-008 ran RC-9 and RC-10 (TASK-20260803-05e072, snapshot 8f463492,
      ledger 6a40411b). This decision is written after that, which is why
      BATCH-005 is being closed now rather than earlier.
    is_the_pause_adopted: >-
      NO, AND THE REASON IS THAT THE EVIDENCE MOVED. The red team's central worry
      was that every yoyo claim rested on a monotone r-profile measured on one
      side of its peak. That worry is now resolved in a way it could not have
      anticipated: BATCH-007 PROVED that the r <= 4 reading is 1.0 by theorem
      (Proposition 1), so there is no peak to be on one side of -- r=5 is simply
      the last round count with a sub-saturated above-null reading. And BATCH-008
      excluded a byte-local mechanism for that reading while BATCH-006's own
      27 random-S-box arms show it is not S-box-specific. The campaign has a
      NARROWER AND BETTER-DEFINED live question than it had when the pause was
      recommended, and its first real control for that question is running as
      BATCH-009 rank 1. Pausing now would be premature closure on a lead that
      just became sharper, which the inventor protocol treats as a failure mode
      symmetric with overclaiming.
    what_would_reinstate_the_pause: >-
      A CONCRETE, PRE-COMMITTED CONDITION rather than a vague one: if the
      BATCH-009 section 3 null object reads AT the null AND no mechanism for the
      r=5 excess is identified in the batch that follows it, the campaign has a
      confirmed but unexplained instrument-level effect and no live direction,
      and the red team's pause should be adopted on that record.

  what_this_decision_does_not_do:
    - It does not treat the byte-width arm as validated; its validation carries no verdict.
    - It does not claim the r=5-to-r=6 separator is identified. The red team's fiber attack showed preimages on both sides and the campaign has no candidate.
    - It advances no closure criterion; no model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. The candidate is the byte-width confirmation that the
      zero-entry mechanism dies between r=5 and r=6, which would retire the worry
      that a nibble analogue misled. It is held back because its validation never
      rendered a verdict and because it rests on one matrix and one j0, with both
      unmeasured directions named and unrun. Promote after either a completed
      validation of that arm or an independent-key arm under the same matrix.

  next_actions:
    - >-
      NO NEW BATCH IS OPENED BY THIS DECISION. BATCH-009 is already open with the
      r=5 section 3 null object as rank 1, which is the correct successor to this
      batch as well: the red team's pause recommendation turns on whether a live
      direction exists, and BATCH-009 rank 1 is the measurement that settles it.
      This decision's own successor obligations are folded there.

  budget_accounting:
    note: >-
      RC-8's cost was mispriced by about 28x in this batch's model
      (CORR-20260803-9a67de), which blocked the one upgrade-capable control at
      the time. It was subsequently run in BATCH-007 and replicated
      field-by-field with zero mismatches.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier; one key, one base, one j0, one machine.
    - One complete review and one incomplete one.
    - Session and implementation independence only; no model independence.
    - The red team's implementation independence is partial by its own statement: it recomputed statistics from recorded counts and re-ran no engine.

  decided_by: coordinator
  decided_at: 2026-08-03

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
