coordinator_decision:
  id: DEC-20260904-ffaebb
  context: >-
    Composes the independent Validator (J1/J2, both `holds`, exact-match
    blind rederivation) and Red Team (J3/J4, both break the Coordinator's
    own recorded pre-review prior) review of EXP-MONO-005b49's second-cell
    replication, per review-plan TASK-20260904-904394. This Coordinator's
    own prior -- that a non-significant second cell in the same direction
    would support reading the first cell's own corrected result as noise
    -- is REJECTED by the Red Team's own power analysis (the second cell
    had only ~14% power to detect an effect the size of the first cell's)
    and by a properly inverse-variance-weighted pooled estimate across
    both cells (z=2.3139, p=0.0207), both independently re-verified by
    this Coordinator to full precision directly from the raw counts.
  decision: escalate
  decision_label: >-
    pooled_two_cell_estimate_nominally_significant_second_cell_severely_underpowered_not_a_clean_null_review_breakthrough_escalation_required_before_further_advancement
  target_ids:
    - H-MONO-1d50ac
    - H-MONO-45183a
    - EXP-MONO-005b49
    - EXP-MONO-cb905d
    - RQ-MONO-001
    - EV-MONO-afcb01
    - EV-MONO-c0bf6d

  hypothesis_status_before: proposed_borderline_significant_after_correction_unreplicated_single_cell_inconclusive
  hypothesis_status_after: proposed_pooled_two_cell_signal_pending_review_breakthrough_escalation
  hypothesis_status_after_note: >-
    NOT ADVANCED TO SUPPORTED. This record does not itself render a
    scientific verdict on H-MONO-1d50ac; it records that the evidence
    picture has changed enough (a methodologically sound, nominally
    significant pooled cross-cell estimate, arrived at via an unbroken
    chain of post-hoc but individually well-justified corrections, bearing
    directly on H-MONO-45183a Part B's own already-validated (N,tau)-only
    completeness claim) to trigger this program's own binding rule: a
    result contradicting prior independently validated evidence routes to
    the review-breakthrough tier BEFORE further status advancement in
    either direction. The status change here reflects escalation, not a
    scientific conclusion.

  experiment_status_before: completed
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-1d50ac
        from: proposed_borderline_significant_after_correction_unreplicated_single_cell_inconclusive
        to: proposed_pooled_two_cell_signal_pending_review_breakthrough_escalation
    experiment_status_changes: []
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: false
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped exactly to two matched cells (p=617 and p=3541, both m=4, both
    toy scale). No ECDLP, relation-rate, exponent, or cryptographic-scale
    claim. Does not close KN-OPEN-009. Does not itself establish or refute
    H-MONO-45183a Part B's (N,tau)-only completeness -- that determination
    is explicitly reserved for the review-breakthrough round this decision
    authorizes.

  rationale:
    - >-
      THE COORDINATOR'S OWN PRE-REVIEW PRIOR IS REJECTED, ON THE MERITS,
      BY BOTH THE RED TEAM'S ANALYSIS AND THIS COORDINATOR'S OWN
      INDEPENDENT RE-VERIFICATION: "non-significant at the second cell,
      same direction" was read, before review, as evidence against the
      endomorphism-ring-linked reading. The Red Team's power calculation
      (power=0.1395 to detect cell 1's own effect size, independently
      re-verified by this Coordinator to full precision, with its own
      passed sensitivity controls -- correctly collapsing to ~alpha at
      tiny synthetic counts and rising to ~97% at 20x-scaled counts) shows
      this prior was premature: an underpowered null is not informative
      evidence against a real effect of that size. This is exactly the
      kind of prior a reviewer should scrutinize hardest, per this lane's
      own standing discipline, and it worked as intended here.
    - >-
      THE POOLED CROSS-CELL ESTIMATE IS ACCEPTED AS METHODOLOGICALLY
      SOUND, NOT AS AN AD HOC RE-TEST: inverse-variance weighting of two
      independent log-ratio estimates is the ordinary, standard way to
      combine effect-size estimates from independent measurements of the
      same quantity -- not equivalent to trying many different tests until
      one succeeds. This Coordinator independently re-derived the pooled
      estimate directly from all eight raw counts (four per cell) rather
      than merely restating the Red Team's own reported number, per this
      lane's own established discipline, and obtained an exact match
      (z=2.3139, p=0.020673).
    - >-
      THE DIVERGENCE BETWEEN THE POOLED ESTIMATE (p=0.0207, significant)
      AND FISHER'S COMBINED TEST (p=0.0713, not significant) IS ACCEPTED
      AS EXPECTED AND INSTRUCTIVE, NOT AS GROUNDS TO PREFER THE MORE
      CONSERVATIVE FIGURE BY DEFAULT: Fisher's test discards effect-size
      and precision information the direct pooled estimate retains. This
      is the documented, known asymmetry of Fisher's combined-probability
      test (weak against a diffuse-but-concordant multi-instance signal),
      here manifesting in the direction of Fisher UNDERSTATING a real
      signal rather than overstating a spurious one -- the opposite
      failure mode from this test's usual documented weakness, worth
      flagging precisely because it cuts against the naive "always trust
      the more conservative number" heuristic.
    - >-
      THE UNBROKEN CHAIN OF POST-HOC CORRECTIONS IS WHY THIS DECISION
      STOPS AT ESCALATION, NOT AT SUPPORTED: cell 1's own significant
      reading required discovering and fixing a test-specification defect
      after the fact (CORR-20260904-d0205d); cell 2's own null reading
      required discovering it was severely underpowered after the fact
      (this round); the pooled estimate is a brand-new synthesis method
      invented after seeing both results. Each individual step is
      independently well-justified and has been independently re-verified
      -- but a sequence of true, honest, well-justified after-the-fact
      corrections that each happens to move the result toward significance
      is exactly the pattern a genuinely rigorous research program must
      treat with more suspicion than a single clean pre-registered test,
      even when (as here) there is no evidence of any dishonesty at any
      individual step.
    - >-
      THE ESCALATION TO REVIEW-BREAKTHROUGH IS REQUIRED, NOT OPTIONAL, PER
      AGENTS.md/CLAUDE.md: this result, taken at face value, contradicts
      H-MONO-45183a Part B's own prior, independently validated
      (N,tau)-only completeness claim -- one of the three named triggers
      for review-breakthrough tier (validator-breakthrough,
      red-team-breakthrough, effort max, `degradable: false`). This
      Coordinator does not have the authority to resolve that contradiction
      at ordinary review tier regardless of how convincing the pooled
      estimate looks; the breakthrough tier exists precisely for this
      situation.
    - >-
      THE CM-VARIANT CONFOUND (j=1728 at cell 1, j=0 at cell 2) IS ACCEPTED
      AS A GENUINE, UNRESOLVED SCOPE LIMITATION: any pooled statistic
      involving the CM curve's own value conflates prime-to-prime and
      CM-variant variation. This does not invalidate the pooled estimate
      (both cells' own P1 values, from generic-automorphism ordinary
      curves, are directly comparable to each other) but means the pooled
      P3 itself should be read as "combining two independent but not
      identically-constructed comparisons," a caveat the review-breakthrough
      round should examine explicitly.
    - >-
      THE P1-STABILITY OBSERVATION IS ACCEPTED AS NOT STATISTICALLY
      SUPPORTED: formally tested by the Red Team (P1 cross-cell p=0.947,
      P2 cross-cell p=0.789) and spot-checked by this Coordinator as
      directionally consistent. The earlier informal note that P1 values
      "look" more stable across cells than P2 values does not survive
      formal testing at n=2 and is not carried forward as a finding.

  next_action: >-
    HIGH PRIORITY: dispatch validator-breakthrough and red-team-breakthrough
    (effort max, per AGENTS.md's `review-breakthrough` policy,
    `degradable: false`) to independently assess whether this two-cell
    pooled result should be read as genuine evidence against H-MONO-45183a
    Part B's own (N,tau)-only completeness claim, or as an artifact of the
    unbroken post-hoc-correction chain described above. Specifically ask
    the breakthrough reviewers to: (1) independently re-derive the pooled
    estimate from the raw counts of both cells, exactly as this decision
    and EV-MONO-afcb01 did; (2) assess whether the sequence of corrections
    (test-mismatch fix, power-deficit discovery, pooling-method invention)
    constitutes a legitimate cumulative refinement or an inflated-
    significance artifact, drawing on formal multiple-testing/sequential-
    analysis theory rather than intuition; (3) recommend whether a THIRD,
    properly pre-registered cell -- with its own significance test AND
    pooling plan fixed before any draw, and with n_tuples scaled to the
    searched N range to avoid EXP-MONO-005b49's own disclosed power
    deficit -- is warranted before any further status change, or whether
    the review-breakthrough round can itself render a verdict on the
    existing two-cell data. SECONDARY (unchanged from DEC-20260904-8c17d5):
    audit whether Part B's own 100 cross-prime cells share the same
    test-specification concern found at cell 1; still not resolved.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The lessons here (an inverse-variance-weighted pooled estimate can
      diverge materially from Fisher's combined test in either direction
      depending on whether the underlying signal is diffuse-but-concordant
      or concentrated-in-one-outlier; a non-significant result from an
      underpowered test is not informative evidence of a null; an unbroken
      chain of individually-justified post-hoc corrections still warrants
      elevated scrutiny even absent any single dishonest step) are valuable
      but are folded into this decision's own rationale and the
      review-breakthrough dispatch rather than promoted standalone: they
      are specific applications of ordinary statistical-inference practice
      to this lane's own recurring evidence-discipline themes (already
      partially covered by KN-TECH-95a42b and KN-TECH-a810e4), not a novel
      category of lesson in their own right.

  procedure_deviations:
    - >-
      SELF-DISCLOSED COORDINATOR PRIOR REJECTED BY REVIEW: this
      Coordinator's own pre-review prior (recorded in
      TASK-20260904-904394's own `coordinator_prior` field, per this
      lane's own discipline of recording priors before dispatch so
      concurrence can be told apart from agreement) was substantively
      wrong, per the Red Team's own power analysis. Recorded here as a
      genuine instance of the review architecture doing its job -- the
      prior was disclosed honestly, scrutinized as instructed, and
      overturned on the merits, exactly as intended.

  limitations:
    - >-
      This decision does not itself resolve whether H-MONO-1d50ac's
      endomorphism-ring-linked reading is correct; it specifies the
      required review-breakthrough escalation only.
    - >-
      Does not treat the pooled p=0.0207 as a confirmed finding; treats it
      as the specific, well-verified quantity the breakthrough review must
      assess for legitimacy given its post-hoc construction history.
    - >-
      Does not resolve the CM-variant confound (j=1728 vs j=0) between the
      two cells; flagged for the breakthrough round's own attention.
    - >-
      Does not audit or reinterpret EXP-MONO-cb905d's own Part B
      100-cell exploratory results; the secondary open question from
      DEC-20260904-8c17d5 remains open, unaddressed here.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator. The Red Team's own
      rejection of this Coordinator's own recorded prior, on independently
      verified statistical grounds, is evidence against rubber-stamping;
      the confound is not eliminated, and is precisely why the next
      review round is escalated to a higher, `degradable: false` tier
      rather than repeated at the same tier.

  reviewed_by: [validator, red-team]
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
