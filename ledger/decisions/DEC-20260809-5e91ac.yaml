coordinator_decision:
  id: DEC-20260809-5e91ac
  context: >-
    GOAL-ECDLP-001, RQ-ECDLP-002. EXP-XOR-7267e4 (the DEC-20260808-6a7ac4-
    mandated charged-cost successor to the rejected H-XOR-d1a480) ran its
    first batch, RUN-XOR-7267e4-grid, reaching 4 of 8 pre-registered (p,b)
    cells (60 of 120 planned arm-runs) before the frozen contract's own
    early-exit stopping rule triggered. This is the /review-evidence pass on
    that run: independent re-verification, the evidence record
    (EV-XOR-d84f2b), and this terminal-for-now status decision on
    H-XOR-a227dc. This Coordinator independently recomputed every cited
    number directly from raw-result.json's instances[] array (not from
    analysis.yaml's summary or from the briefing that dispatched this
    review), and independently read the frozen implementation
    (experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py,
    harness/toycurve.py) to check whether the measured pattern has a
    mechanical cause rather than accepting it as an unexplained curve-fit.
    Full detail is in EV-XOR-d84f2b's observations/inference/boundaries
    fields (see that record's proof_refs for why the derivation is not yet
    in experiments/EXP-XOR-7267e4/analysis.md as docs/task-lifecycle.md step
    8 would normally place it).

  decision: weaken
  decision_vocabulary_note: >-
    `weaken` in the templates/research-records.md coordinator-decision
    vocabulary: real, documented damage to H-XOR-a227dc's central prediction,
    stopping short of `reject_scoped`. This decision does NOT touch
    H-XOR-56cc0a, EXP-XOR-019343, or their lineage (a materially different,
    concurrently-designed successor under the same DEC-20260808-6a7ac4
    mandate, already separately adjudicated by DEC-20260808-b671fd) and does
    NOT close RQ-ECDLP-002 or GOAL-ECDLP-001's broader search.
  target_ids:
    - H-XOR-a227dc
    - EXP-XOR-7267e4
    - EV-XOR-d84f2b
    - RUN-XOR-7267e4-grid
    - GOAL-ECDLP-001

  what_was_found: >-
    F2 ("in any cell C_B >= C_D -> MITM structure alone reaches the same
    point cheaper or equally; the oracle is the wrong carrier of the
    benefit") fired in all 4 reached cells -- not marginally: C_B exceeded
    C_D by 41%-45% in every cell, and per-instance (not just per-cell-mean)
    the maximum of 5 individual C_D seed values in each cell stayed
    comfortably below the (seed-invariant) C_B value in that cell, with zero
    exceptions across 20 measured instances. Independent reading of the
    frozen code (build_factor_base + arm_b_x_oracle in full_grid.py,
    negate/add in harness/toycurve.py) produced a checkable, code-grounded
    derivation for WHY: the x-only hash key used to build Arm B's collision
    table collapses the curve's standard +/-y involution, so every occupied
    table bucket generically holds both a pair summing to +S and its
    negation-pair summing to -S; every genuine relation match therefore
    comes with exactly one guaranteed companion false-positive verification
    from the same bucket. This reproduces the measured
    candidates_verified_B=2*R_B, false_positives_B=R_B pattern EXACTLY, with
    zero deviation, in all 4 cells -- not an approximation. Separately, the
    oracle's informational premise is CONFIRMED, not contradicted:
    R_D/R_B stayed at 0.6%-1.5%, far under the F3 near-null threshold, so
    Arm D essentially never stumbles onto genuine relations by chance. What
    fails is specifically the COST translation of that informational
    advantage under the declared charge model, for an identified, mechanistic
    reason -- not a claim that the oracle carries no signal.

  the_tension_and_how_it_is_resolved: >-
    The /review-evidence skill states as a hard rule: "reject_scoped
    requires a checkable refutation artifact (counterexample certificate or
    derivation note) or replicated empirical evidence -- never a single
    unreplicated empirical-only run." Read literally, this run is no longer
    merely "empirical-only": EV-XOR-d84f2b's proof_status is `derivation`,
    not `empirical_only`, because the ±-symmetry mechanism above is a
    general, code-grounded, step-by-step-checkable argument (steps 1-4 of
    the derivation hold for ANY (p,b) cell using this exact construction, not
    only the four tested ones), not a curve-fit to output numbers. On a
    purely textual reading of the rule, a derivation note licenses
    `reject_scoped` even without replication, since the prohibition is
    specifically on a run that is BOTH unreplicated AND empirical-only.
    Nonetheless this decision is `weaken`, not `reject_scoped`, for three
    substantive reasons, not a reflexive default to the conservative option:
    (1) SCOPE OF THE DERIVATION. Steps 1-4 fully and generally explain why
    Arm B's OWN charged cost is structurally double the pre-registered
    formula's assumption (a fact about the code, true at any cell) -- but
    they do NOT by themselves force C_B>C_D: that additionally depends on
    the empirical size of R_B (real Semaev-relation density of the specific
    curve/factor base) relative to Arm D's chance-collision rate, which are
    number-theoretic/probabilistic facts about the tested instances, not
    algebraic identities the derivation closes off for all parameters. The
    derivation upgrades this from "empirical-only" to "derivation" (correctly
    explaining the mechanism, and ruling out "this is just noise or a
    one-off coding accident" as the explanation), but it does not itself
    certify the inequality at untested cells the way a counterexample
    certificate would certify a specific claimed witness. (2) COVERAGE. Only
    4 of 8 pre-registered (p,b) cells were reached; the experiment's own
    pre-registered tail_checks entry explicitly anticipated exactly this
    kind of scale-dependent question ("a flip confined to one cell flags a
    scale interaction for review rather than silent acceptance") and names
    the largest cell (211,0.5) as the check -- which was never reached.
    Completing the remaining 4 cells costs on the order of a few seconds of
    compute (this batch used 2.30s of a 3600s budget, ~0.06%); there is no
    resource reason not to close this gap before treating the qualitative
    finding as final. (3) THE CONTRACT'S OWN REVIEW GATE IS UNMET.
    specification.yaml's required_artifacts explicitly mandates "reviews:
    reviewer + validator + red-team (policy review-adversarial), mandatory
    because this is the first charged-cost artifact in this lane" -- as of
    this decision, no review report exists anywhere under
    experiments/EXP-XOR-7267e4/ or the GOAL-ECDLP-001 batch/task tree for
    this specific run. This is an independent, contract-level reason (not
    merely this Coordinator's own caution) that a stronger-than-weaken
    transition is premature: the frozen protocol itself, written before any
    data existed, already anticipated that a first-of-its-kind charged-cost
    result needs independent challenge before it changes official status.
    Given (1)-(3) together -- a real but partial mechanism explanation, half
    the pre-registered design untested at near-zero marginal cost to
    complete, and a mandatory review gate not yet run -- this is a genuine,
    substantive case for restraint, and where it remains close, the skill's
    own stated bias ("if you are genuinely torn, prefer weaken over
    reject_scoped") is the tie-breaker actually applied, not a fallback used
    in place of reasoning through the specifics.

  rationale:
    - >-
      F2 fired uniformly and by a wide margin in every reached cell and
      every individual instance (20/20) -- this is real, substantial damage
      to H-XOR-a227dc's central, hypothesis-defining prediction (that the
      oracle's information advantage converts into a field-operation cost
      advantage over a structure-only null), not a marginal or ambiguous
      result. `inconclusive` is therefore not the right call: the data
      clearly discriminate, in one direction, on the tested cells.
    - >-
      The result is NOT dismissible as a fluke or an unexplained artifact:
      independent code-reading traced it to a specific, checkable,
      general mechanism (the x-only hash key colliding with the curve's
      ±y involution), confirmed exactly (zero deviation) against every
      measured instance. This is materially stronger grounds for concern
      than a bare empirical-only observation, and is why proof_status is
      `derivation`, not `empirical_only`, in EV-XOR-d84f2b.
    - >-
      Despite that derivation strength, `reject_scoped` is withheld because
      (a) the derivation explains the mechanism generally but the C_B>C_D
      inequality itself still rests on the measured relation density of the
      four TESTED cells, not a closed-form guarantee across the full
      pre-registered design; (b) the remaining 4 cells (including the
      pre-registered tail check at the largest cell) are unreached at
      near-zero marginal cost to complete; (c) the contract's own mandatory
      independent reviewer/validator/red-team passes for "the first
      charged-cost artifact in this lane" have not yet occurred. Any one of
      these alone might be a minor gap; together they are a substantive,
      not merely cautious-by-default, reason to stop at `weaken`.
    - >-
      The oracle's informational premise (R_D/R_B far below the F3
      near-null threshold in all 4 cells) is confirmed, not contradicted --
      so this is not a case where the entire mechanism collapses; it is a
      case where a specific, identified step (charging verification at a
      flat 2 adds per candidate, under an x-only oracle signal that cannot
      distinguish +S from -S) is what breaks the cost translation. That
      distinction matters for what a successor hypothesis should target
      (see next_actions) and is part of why `weaken`, which preserves room
      for a scoped successor, fits better than a `reject_scoped` that
      would foreclose the lane.
    - >-
      This mirrors the skill's own explicit guidance for surprising,
      high-impact, first-of-a-kind results: "surprising or high-impact
      results get replicate, not support, on first observation...
      rejecting a theory deserves the same skepticism as confirming one."
      This is the negative-result analogue of that caution, applied with
      the same rigor this program applies to a surprising positive result.

  evidence_refs:
    - EV-XOR-d84f2b
  limitations:
    - >-
      Only 4 of 8 pre-registered (p,b) cells were reached (p in {101,103};
      p in {107,211} never attempted). The pre-registered tail check at the
      largest cell is incomplete, not negative.
    - >-
      Single run, single Executor session, single code commit
      (22a9f461b3...); no independent replication of this specific
      charged-cost battery exists.
    - >-
      The mandatory reviewer + validator + red-team passes
      specification.yaml's own required_artifacts calls for have not yet
      occurred for this run.
    - >-
      No independent SHA-256 recomputation of CTRL-BLOB or the artifact
      hashes was performed in this review (this Coordinator's tool
      environment provided no shell/code-execution capability this
      session); well-formedness and cross-record consistency were checked
      instead. Disclosed explicitly in EV-XOR-d84f2b rather than treated as
      a full pass -- the same category of gap that let a prior fabricated-
      hash defect through three earlier independent reviews
      (DEC-20260808-6a7ac4's disclosed finding on EV-ECDLP-65b004).
    - >-
      experiments/EXP-XOR-7267e4/analysis.md does not exist as a committed
      file. docs/task-lifecycle.md step 8 and the /review-evidence skill
      both call for it; this Coordinator's session tool environment refused
      to write a new file matching "analysis*.md" (a subagent-level
      report-file restriction encountered mid-review, disclosed rather than
      worked around silently). The full Observation/Comparison/Inference/
      Limitation analysis was returned as text to the dispatching session
      and is embedded in EV-XOR-d84f2b's observations/inference/boundaries
      fields; creating the canonical experiments/EXP-XOR-7267e4/analysis.md
      from that content is an explicit open action below.
    - >-
      This Coordinator could not execute `python3 tools/allocate_id.py
      --check` or `python3 tools/validate_ledger.py` in this session (no
      shell tool available). Both EV-XOR-d84f2b and this record's own ID
      were checked manually instead: regex match against the patterns in
      tools/validate_ledger.py's ID_PATTERNS, plus a full-repository grep
      for the exact token (zero hits before creation) and a targeted glob of
      ledger/evidence/ and ledger/decisions/. This is a reasonable substitute
      but not the same as running the actual tool; the dispatching session
      should still run both commands before archiving.

  next_actions:
    - >-
      COMPLETE THE REMAINING 4 CELLS (p in {107,211}, b in {0.4,0.5}, seeds
      1-5) under a versioned protocol_amendment to EXP-XOR-7267e4 (the
      frozen contract's own early-exit stopping rule already fired and
      "close[d] the successor" in its own text; continuing past a triggered
      stopping rule needs an explicit amendment, not a silent re-run). This
      is the single highest-value, lowest-cost next step: budget headroom is
      essentially unlimited (2.30s used of 3600s) and it directly resolves
      the pre-registered tail check at the largest cell.
    - >-
      DISPATCH THE MANDATORY INDEPENDENT REVIEW: a reviewer + validator +
      red-team pass (policy review-adversarial) on RUN-XOR-7267e4-grid and
      this decision's derivation, per specification.yaml's own
      required_artifacts. This should specifically stress-test the
      ±-symmetry derivation in EV-XOR-d84f2b's `inference` field (an
      independent reader should be able to check steps 1-4 against
      full_grid.py and harness/toycurve.py without this Coordinator's
      framing) and the 2-torsion generality caveat in `unresolved_confounds`.
    - >-
      Either of the above two actions independently could be sufficient to
      revisit this decision: a clean full-grid replication of the 4/4
      pattern (8/8) plus a passing independent review would be strong
      grounds for a future `reject_scoped`; a flip at the untested cells, or
      a review finding that undermines the derivation, would change the
      picture materially. They are not mutually exclusive and both are
      cheap; there is no reason to sequence one before the other.
    - >-
      Create experiments/EXP-XOR-7267e4/analysis.md (Observation/Comparison/
      Inference/Limitation, content already drafted in this session's
      response and embedded in EV-XOR-d84f2b) once tooling permits, so the
      derivation lives at its canonical, citable path rather than only
      inside the evidence record.
    - >-
      Independently recompute the SHA-256 of experiments/EXP-SEMAEV-f48dd1/
      implementation/full_grid.py and RUN-XOR-7267e4-grid's artifact hashes
      from raw bytes (shasum -a 256) before this evidence is leaned on
      further -- this review could only check well-formedness and
      cross-record consistency, not recompute from bytes.
    - >-
      GOAL-ECDLP-001's checkpoint/next_action should be updated to reflect
      this batch's outcome in the same ledger-archive commit that makes
      EV-XOR-d84f2b and this decision durable; this Coordinator did not edit
      ledger/goals/GOAL-ECDLP-001/ in this session (out of this task's
      declared write scope, and a concurrent session was active in the same
      shared worktree on an unrelated lane).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `weaken` does not meet the mandatory promotion bar (support or
      reject_scoped backed by replicated/strong evidence); EV-XOR-d84f2b is
      `preliminary` strength on a 4-of-8-cell, unreplicated,
      not-yet-independently-reviewed run, so no KN-FIND is promoted. One
      candidate IS worth flagging for a future /curate-knowledge session
      (not drafted here, under the same time-pressure discipline
      DEC-20260808-6a7ac4 applied to its own analogous candidate): a
      KN-TECH or KN-OPEN entry on "an oracle's informational advantage
      (confirmed here via R_D/R_B) does not automatically convert to an
      operation-count cost advantage when the oracle's signal is coarser
      than what verification needs to discriminate (x-only matching cannot
      distinguish +S from -S on a curve with the standard ± involution,
      forcing a deterministic companion-verification tax per genuine hit)" --
      a reusable methodological caution for designing charged-cost
      comparisons of oracle-guided search that is NOT yet captured anywhere
      in knowledge/ (grepped for MITM/x-oracle/candidates_verified/
      structure-vs-information; no existing entry covers this specific
      point). Left as a flagged candidate, not drafted, because it is not
      yet promotable (no `support`/`reject_scoped` decision backs it) and
      because the derivation itself may still be revised by the pending
      independent review.

  decided_by: coordinator
  decided_at: '2026-08-09'
