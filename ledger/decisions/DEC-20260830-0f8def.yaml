coordinator_decision:
  id: DEC-20260830-0f8def
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    `holds_with_finding`) and Red Team (J2, `holds_with_finding`) reviews
    of EXP-MONO-12ce1c's execution: a toy-scale determination of the
    m-th Semaev summation cover's Galois/monodromy group, testing
    H-MONO-45183a's claim that it is the elementary abelian group
    (Z/2)^(m-2) rather than full symmetric — a claim that, if supported,
    contradicts a stated premise of the open problem KN-OPEN-009. This
    contract is 25 days old, discovered as an unexecuted backlog item
    during this session's sixth research cycle and approved under this
    session's standing standalone-experiment precedent
    (DEC record: design commit 55f260628). This is potentially the most
    consequential single result of this session's RQ-MONO-001 work, and
    both independent reviews are unusually deep; this decision reflects
    that depth rather than compressing it.
  decision: support
  decision_label: >-
    semaev_cover_monodromy_containment_in_z2_m2_strongly_supported_multiply_independently_confirmed_headline_framing_corrected_extensive_control_design_and_reporting_limitations_named
  target_ids:
    - H-MONO-45183a
    - EXP-MONO-12ce1c
    - RQ-MONO-001
    - EV-MONO-efbd1c
    - KN-OPEN-009
    - IDEA-20260805-cf2d5a
    - IDEA-20260805-90df50
  rationale:
    - >-
      PART A'S CONTAINMENT CLAIM IS STRONGLY, MULTIPLY-INDEPENDENTLY
      SUPPORTED — THE CENTRAL, MOST CONSEQUENTIAL FINDING. The m-th
      Semaev summation cover's monodromy embeds in the elementary abelian
      (Z/2)^(m-2), NOT the full symmetric group, at m in {4,5}, on 8
      toy-scale curves. This rests most decisively on the dual-path
      cross-check (two independently-coded classifiers, zero
      disagreements over 64,000 total comparisons, and — critically —
      the Red Team independently MEASURED this cross-check's real
      discriminating power via coefficient-corruption mutation testing
      and found ~89% sensitivity, ruling out vacuity) and on the Red
      Team's own third, wholly independent classifier, which found ZERO
      exceptions on an EXHAUSTIVE census of all 2,915,514 admissible
      triples at p=103 — no sampling involved at all. Both reviewers
      independently re-derived the underlying Kummer/sign-torsor argument
      from the actual code, not the hypothesis's prose.
    - >-
      THE RECORD'S OWN HEADLINE FRAMING ("960,000 SPECIALIZATIONS, ZERO
      VIOLATIONS") OVERSTATES WHAT THAT SPECIFIC METRIC ESTABLISHES, AND
      THIS DECISION CORRECTS IT RATHER THAN REPEATING IT. Both reviewers,
      independently, discovered that M1/M2 (computed exclusively via the
      direct signed-sum construction) are close to a NECESSARY consequence
      of a fact already independently verified (roots are signed sums,
      confirmed by the dual-path cross-check) combined with the
      elementary fact that F_p has a unique quadratic extension — meaning
      the construction can never produce a root of degree >2 over F_p,
      regardless of the cover's true abstract monodromy. This is not a
      defect in the Executor's work (the classification code itself was
      independently confirmed to be sensitive to a genuine violation when
      one is fed to it); it is a limitation of what the RAW SPECIALIZATION
      COUNT, by itself, can be read to establish. The genuine evidential
      weight for the containment claim is named above (dual-path
      cross-check with measured power; independent exhaustive census),
      not the raw 960,000 figure.
    - >-
      THE MANDATORY CROSS-CURVE NULL CONTROL FAILED AS LITERALLY
      SPECIFIED, AND BOTH REVIEWERS INDEPENDENTLY PROVED WHY: IT WAS
      UNSATISFIABLE BY DESIGN, A FLAW INHERITED FROM THE 25-DAY-OLD
      ORIGINAL HYPOTHESIS, NOT INTRODUCED BY THIS EXECUTION. The Red Team
      went beyond confirming the Executor's own algebraic explanation
      (Finding 1) to PROVE the null is unsatisfiable for literally ANY
      companion object — a different curve, a singular cubic, an
      unrelated quartic, even a curve-free constant. The frozen contract's
      own stated premise ("the sign-torsor argument does not apply across
      two curves") is mathematically false. PER THE CONTRACT'S OWN
      LITERAL TEXT, THIS RENDERS STAGE 2 FORMALLY VOID, AND THIS DECISION
      DOES NOT LIFT THAT TRIGGER BY FIAT — it is disclosed and explained
      precisely, and the disposition above rests instead on evidence
      (the dual-path cross-check, the independent exhaustive census) that
      does not depend on Stage 2's own flawed control design at all.
    - >-
      A GENUINE STRUCTURAL FINDING NEITHER THE CONTRACT NOR THE EXECUTOR
      ANTICIPATED: PARTS A AND B ARE NOT INDEPENDENT. The Red Team
      falsified the Executor's stated mechanism for Part A's M3 frequency
      deviations (a generic "birthday paradox," which has no tau-
      dependence) while corroborating the underlying causal claim via a
      more precise mechanism: Part B's own root-multiplicity (2-torsion
      collision) structure is literally the filter responsible for Part
      A's exclusion-stratum bias. This is a real, disclosed coupling
      between the hypothesis's two supposedly-separate parts, named as a
      genuine finding rather than absorbed silently.
    - >-
      PART B'S OWN SIGN-CONVENTION CONTROL WAS EMPTY, AND ITS FORCED
      VALUES ARE RESCOPED ACCORDINGLY. Both arms of the fixed-sign/
      random-sign control drew literally identical index sequences from
      the same seeded stream — never independently informative, beyond
      the (correct) algebraic argument that the two conventions must
      agree. The Red Team identified and directly measured the control
      that WOULD have been informative (transversal vs. group-uniform
      sampling), finding a real 1.84-2.08x effect. Part B's forced values
      are therefore understood as scoped to the transversal convention
      this record actually used, not as convention-independent — a
      correction to H-MONO-45183a's own HEUR-COIN-1 framing, named
      explicitly rather than silently inherited.
    - >-
      THREE MANDATORY GRADED CONTROLS WERE NEVER COMPUTED BY THE
      EXECUTOR — A GENUINE COMPLETENESS DEFECT — BUT THE RED TEAM'S OWN
      RECONSTRUCTION OF THEM IS FAVORABLE, NOT DISQUALIFYING. The
      tau-ladder (graded_control_2) and the scale ladder
      (graded_control_3, the contract's own named "canonical artifact
      tell") were both omitted from the Executor's deliverable. The Red
      Team reconstructed both directly from the archived raw data: the
      tau-slope (6.23) closely matches the forced value (6), and the
      artifact-tell does NOT fire (the sublocus rate genuinely decays as
      1/N). This is disclosed as an Executor completeness gap, remedied
      post hoc, with a result that strengthens rather than weakens Part
      B's disposition.
    - >-
      TWO NUMERICAL DISCREPANCIES IN THE EXECUTOR'S OWN REPORTING,
      DISCLOSED, INCONSEQUENTIAL TO THE FINDING. The Executor's stated
      trial counts and split-rate percentages for measured_null_1 do not
      match the committed raw data; the Red Team's corrected numbers
      support Finding 1 more strongly than the Executor's own (incorrect)
      figures did. A reporting-accuracy defect, named for the record, not
      a substantive one.
    - >-
      HEUR-KUM-2 (THE EQUALITY CLAIM) IS EMPIRICALLY CORROBORATED, NOT
      MERELY ASSUMED. G8 (realized distinct Frobenius permutation count)
      genuinely reaches 2^(m-2) at both m=4 and m=5, confirmed
      independently by the Red Team — supporting, though not proving,
      that the full (Z/2)^(m-2) is actually realized rather than a proper
      subgroup.
    - >-
      MODEL-CORRELATION CONFOUND, DISCLOSED PRECISELY. The Validator
      resolved to a different model family (claude-sonnet-5) than
      H-MONO-45183a's original producer and this round's Red Team (both
      claude-opus-5) — genuine, partial mitigation of the confound
      H-MONO-45183a's own text names as standing, recorded exactly as
      measured rather than rounded in either direction.
    - >-
      DISPOSITION. H-MONO-45183a's status moves to `supported_scoped`,
      scoped exactly to: Part A's containment claim (monodromy embeds in
      (Z/2)^(m-2)) at m in {4,5} on the tested 8-curve panel, primes in
      [100,3000]; Part A's equality claim (HEUR-KUM-2) as corroborated,
      not proven; Part B's sublocus claim scoped to the transversal
      sampling convention. This does not close KN-OPEN-009 (only the
      full-symmetric-monodromy half of its premise is addressed; the
      imprimitivity half and the relation-rate half, carried by
      H-MONO-663fb4, are untouched) and does not touch H-MONO-0b3def,
      H-MONO-0f9170, or H-MONO-59f6a6.
  evidence_refs:
    - EV-MONO-efbd1c
    - experiments/EXP-MONO-12ce1c/execution_report.yaml
    - experiments/EXP-MONO-12ce1c/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-12ce1c/reviews/red-team/red-team-report.yaml
    - coordination/tasks/TASK-20260830-c468bd/snapshot-receipt.json
  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-45183a
        prior_status: proposed
        new_status: supported_scoped
        scope: >-
          Part A containment (monodromy embeds in (Z/2)^(m-2)) strongly
          supported at m in {4,5} on the tested panel, primes in
          [100,3000] — multiply-independently confirmed via the dual-path
          cross-check and an exhaustive third-path census, NOT primarily
          via the raw Path-1 specialization count, which is corrected
          here as near-tautological by construction. Part A equality
          (HEUR-KUM-2) corroborated via G8, not proven. Part B sublocus
          claim supported, scoped to the transversal sampling convention.
          KN-OPEN-009 is not closed; only its full-symmetric-monodromy
          premise is addressed.
    experiment_status_changes:
      - experiment_id: EXP-MONO-12ce1c
        prior_status: approved
        new_status: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    completion_criteria_note: >-
      RQ-MONO-001 and GOAL-MONO-001 are not closed or advanced by this
      decision. KN-OPEN-009 is not closed by this decision either; its
      imprimitivity and relation-rate halves remain open.
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped support stated above; no ECDLP, relation-rate,
      cryptographic-scale, or exponent claim; no closure of KN-OPEN-009.
    closure_authorized: false
    breakthrough_authorized: false
  disclosed_open_items:
    - id: PATH2-M1-M2-RECOMPUTATION-FOLLOWUP
      description: >-
        The Red Team's named next concrete action: recompute M1/M2 from
        the Path-2 (explicit polynomial construction and factorization)
        classifier alone, over the full 20,000-specialization/cell budget
        (the archived runs used only 98% of their wall-clock budget on
        Path 1's own metrics). This would convert the headline M1/M2
        result from a construction-forced identity into a genuine,
        independently-powered measurement against the full-symmetric
        alternative, and would moot the Stage-2-void question entirely.
        Cheap (~17 minutes per the Red Team's own estimate).
      carried_forward_to: >-
        A versioned protocol_amendment to EXP-MONO-12ce1c (reusing
        already-archived panel/seed data) or a small superseding run
        record; either is future work, not performed by this decision.
      does_not_block: H-MONO-45183a's supported_scoped disposition at its current scope
    - id: CROSS-CURVE-NULL-REDESIGN-FOLLOWUP
      description: >-
        The mandatory cross-curve null control should be redesigned for
        any successor record: a genuinely discriminating null would need
        to break the shared-field-degree structure entirely (e.g. a
        construction whose roots are NOT chord-formula rational functions
        of individually-square-rooted x-coordinates), not merely swap the
        companion curve.
      carried_forward_to: any successor experiment in this sub-lane
      does_not_block: this decision's disposition
    - id: TRANSVERSAL-VS-GROUP-UNIFORM-SAMPLING-FOLLOWUP
      description: >-
        The Red Team's identified and measured discriminating control
        (transversal vs. group-uniform sampling of factor-base points,
        showing a real 1.84-2.08x effect) should be adopted as HEUR-COIN-1's
        actual falsification test in any successor record; the current
        fixed-sign/random-sign control should be retired as uninformative.
      carried_forward_to: any successor experiment exercising HEUR-COIN-1
      does_not_block: this decision's disposition
  procedure_deviations: []
  knowledge_promotion:
    promoted: [KN-FIND-6edecd]
    not_warranted: null
    promotion_note: >-
      CRITICAL PRE-PROMOTION CHECK, DISCLOSED: this Coordinator initially
      drafted a promotion for a NEW theorem-statement KN-FIND before
      discovering that `KN-FIND-a8990a` (added 2026-08-07) already proves
      the identical containment-and-equality claim unconditionally, in
      every characteristic — that draft would have been a duplicate and
      was discarded before any commit. The correct, and different,
      promotion is `KN-FIND-6edecd`: a narrowly-scoped entry that does
      NOT restate `a8990a`'s theorem, and instead records two things
      `a8990a` does not contain: (1) that its own disclosed largest risk
      ("no independent review... derivation and code share an author")
      is now substantially addressed by a separately-derived hypothesis
      (H-MONO-45183a, whose source proposal predates a8990a by two days)
      receiving full independent Validator+Red Team review; (2) a
      genuinely new control-design corollary neither record states — the
      standard cross-curve nearby-object null is unsatisfiable by
      construction for this cover family, for any companion object,
      because F_p has a unique quadratic extension. `KN-FIND-a8990a` is
      NOT superseded (its content is not wrong; `superseded_by` on it is
      left `null`) — it is cross-referenced via `related_entries` only,
      per this program's immutability discipline (knowledge/README.md:
      corrections supersede via a new entry, never a silent rewrite of
      substance).
  limitations:
    - >-
      Toy scale only: primes in [100,3000], 8 curves (effectively 4
      independent sampling streams), m in {4,5} for the categorical
      claim. No claim about cryptographic scale, F_{q^n}, or any exponent.
    - >-
      The mandatory cross-curve null control is unsatisfiable by design
      (inherited from the original 25-day-old hypothesis); Stage 2 is
      formally void per the frozen contract's own text, addressed above
      rather than silently lifted.
    - >-
      HEUR-KUM-2 (equality) remains formally unproven at m>=4; empirically
      corroborated via G8, not proven.
    - >-
      Part B's forced values are scoped to the transversal sampling
      convention actually used; the fixed/random-sign control that was
      meant to test this was empty by implementation.
    - >-
      The Red Team's own review resolved to the same model family
      (claude-opus-5) as H-MONO-45183a's original producer; only the
      Validator's joint adds genuine model independence this round.
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
    amazon_bedrock_selected_configured_probed_contacted_or_used: false
  decided_by: coordinator
  decided_at: '2026-08-30'
