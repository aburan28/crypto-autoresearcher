coordinator_decision:
  id: DEC-20260802-010
  amends: DEC-20260802-008
  context: >-
    The Q1 compensating controls landed (a867f05b) and step 3's pre-write
    verification blocked the re-anchoring on one line:
    "ledger/decisions/DEC-20260727-012.yaml: decision references unknown target
    'EXP-SIG-008'". It names a DEC-20260802-001 relocation record and is not
    covered by CORR-20260802-014's itemization, so exclusion 3 forbids it, but it
    is pre-existing debt whose path moved rather than anything the relocation
    introduced. The executing session stopped and escalated instead of reading
    past the exclusion. This decision resolves that, records the claim_tier sweep
    ordered by DEC-20260802-009, and corrects one mechanism claim I made in
    DEC-20260802-008. Repository hygiene and disclosure policy; no research
    question, no evidence.
  decision: revise
  target_ids:
    - DEC-20260802-008
    - DEC-20260802-009
    - CORR-20260802-015
    - CORR-20260802-016
    - VALIDATOR-BASELINE-PR87
    - CLAIM-TIER-VOCABULARY-GAP
  rationale:
    - >-
      THE ESCALATION WAS CORRECT AND THE BLOCKED LINE IS MY ERROR. When I wrote
      CORR-20260802-014 I verified that experiments/EXP-SIG-008/specification.yaml
      exists and concluded the target would register. I never checked that it
      parses. It does not — it is Markdown with a .yaml extension — so
      check_experiment never registers EXP-SIG-008 and every reference to it
      dangles, including this decision target. My itemization was class-based and
      derived from reading; the verification that caught it was line-based and
      derived from measurement. That difference is the whole finding, and it is
      why the ~32-line prediction came in at a measured 36.
    - >-
      RULING ON EXCLUSION 3 — NEITHER OFFERED OPTION. Option 2 (read exclusion 3
      by content rather than by path) is rejected: it restores exactly the
      intent-reading the exclusion existed to remove, and the session was right to
      refuse to apply it unilaterally. Option 1 (a superseding hand-itemization)
      is rejected too, for a subtler reason — it would unblock this commit while
      preserving the method that produced the omission. The defect was that the
      list came from prediction; appending one more predicted entry does not fix
      prediction. Instead, exclusion 3 is restated as a mechanical test:
      a line naming a relocated record is admissible IF AND ONLY IF the identical
      message appears in a committed pre-relocation error snapshot under that
      record's pre-relocation path. That admits carried-forward debt by
      construction, still blocks anything the relocation introduced, and is
      checkable by set membership rather than by judgement. Recorded in
      CORR-20260802-016.
    - >-
      THE SNAPSHOT IS A PREREQUISITE, NOT A CONVENIENCE.
      tools/prerelocation_error_snapshot.txt — the verbatim `--no-baseline` error
      set at the commit immediately preceding the relocation — must be committed
      before the rule is applied. A membership test against an artifact nobody can
      regenerate is an appeal to memory wearing a mechanism's clothes.
    - >-
      C3 COUNT. Category C3 is widened to cover decision target_ids as well as
      evidence run_ids/experiment_ids; the cause is identical — the referenced
      experiment or run does not register. Fill <C3> with the measured count of
      that widened category in the final regenerated file, which includes this
      line. Do not compute it from the earlier itemization. Note that <M> is one
      HIGHER than a count taken with this line excluded: the line was always in
      the candidate set, and the block was on proceeding, not on counting. Report
      <N>, and <M> as the count of lines in the new file absent from the old file
      — a set difference, not a subtraction.
    - >-
      CORRECTION TO MY OWN MECHANISM CLAIM. DEC-20260802-008 stated that
      register() keeps the first manifest globbed and that the ceiling therefore
      evaluates against that one. CORR-20260802-015 establishes the sharper truth:
      ctx.run_params[rec_id] is assigned UNCONDITIONALLY while ctx.register keeps
      the FIRST, so ctx.ids points at the first manifest and ctx.run_params — which
      is what the ceiling reads — holds the LAST. My substance stands (the ceiling
      reads an arbitrary manifest, not the intended one) but my mechanism was
      wrong in detail, and the corrected version is the one to cite.
    - >-
      THE MEASURED EXPOSURE NARROWS THE Q1 BOUNDARY AND THAT NARROWING MUST NOT BE
      LOST. CORR-20260802-015 measured all 221 collisions: zero are tier-divergent,
      and all 47 existing citations already name exactly one owning experiment. So
      no evidence record's ceiling is currently mis-evaluated. The boundary I
      required is therefore about LATENT risk, not a realised misbinding, and
      stating it as though a claim had already been corrupted would itself be an
      overstatement. The record states this correctly and the enforcing controls
      are right to be enforcing anyway: the measurement is of the current tree and
      says the defect has not yet caused a wrong claim, not that it cannot.
    - >-
      THE CLAIM_TIER SWEEP IS A LARGER FINDING THAN THE ONE RECORD THAT PROMPTED
      IT. 29 evidence records carry a claim_tier absent from TIER_ORDER — `theory`
      (17), `laboratory_implementation_conformance` (6), `toy_measurement` (5),
      `theoretical` (1) — so TIER_ORDER.get() returns None and the ceiling check
      silently no-ops on every one. None produces a validator line, so none would
      have appeared in any error list or baseline; they were found by sweeping, not
      by reading output. Seven have run_ids attached (EV-MLKEM-005..010 and
      EV-P13-001), which are the cases where the check had something to evaluate
      and did not. The remaining 22 have no run_ids, so the check would have been
      vacuous regardless.
    - >-
      (Sweep, ruling) NOT ADDING THE UNKNOWN-TIER ERROR NOW WAS THE RIGHT CALL, and
      the reason generalizes: adding it before the taxonomy is settled would
      manufacture 29 new lines into the very baseline being written, which is
      circular. The error check and the taxonomy resolution land together, in their
      own decision, so that the 29 either become valid values or are migrated and
      few or no lines result.
    - >-
      (Sweep, ruling) BUT 29 SILENTLY-UNCHECKED RECORDS MAY NOT RIDE THROUGH A
      RE-ANCHORING UNDISCLOSED. The whole architecture of this re-baseline is that
      nothing is absorbed unless it is disclosed somewhere durable. These produce no
      lines, so the baseline cannot disclose them — which makes the case for a
      register stronger, not weaker, because nothing will ever surface them
      otherwise. Extend ledger/registers/unevidenced-records.yaml, in the same
      commit as the baseline, with all 29: record, declared claim_tier, whether
      run_ids are attached, and for the seven with run_ids the standing rule that
      their claim tier is UNVERIFIED and they may not support a hypothesis
      transition until the taxonomy decision lands.
    - >-
      (Sweep) THE SESSION'S TAXONOMY OBSERVATION IS ACCEPTED AND SHARPENS THE
      FOLLOW-UP. `toy_measurement` and `theoretical` do look like variants of `toy`
      and of a theory tier, and `laboratory_implementation_conformance` plausibly
      does not belong on the toy/medium/crypto scale axis at all — a conformance
      claim about an implementation is not a scale claim about a hard problem. That
      makes the fix a taxonomy question, not a code question: whether claim_tier is
      one axis or several, and whether off-axis claims need an explicit marker
      rather than an arbitrary string silently disabling the ceiling.
    - >-
      (Sweep) MIGRATION IS SUPERSESSION, NOT EDITING. If the follow-up decides to
      migrate `toy_measurement` -> `toy` or similar, that changes committed evidence
      records and therefore requires correction records, not in-place edits. Five of
      those records (EV-XEDN-002..006) are already in the C4 unevidenced register
      for missing direction/strength, so their migration should be folded into the
      same evidence review rather than done twice.
    - >-
      (Sweep) THERE IS A SECOND SILENT PATH THROUGH THE SAME CHECK, AND IT MUST BE
      SWEPT TOO. tier_of_run returns None when a run's inputs.parameters carries
      neither field_bits nor field_bit_size; those None values are filtered out, and
      if every cited run is filtered the ceiling is skipped even for a perfectly
      valid claim_tier. So a record can declare `crypto` and face no ceiling at all
      because its runs lack a field-size parameter. Sweep for evidence records with
      a recognised claim_tier whose cited runs all lack field_bits/field_bit_size,
      and report the count even if it is zero.
    - >-
      WHAT THIS DECISION DOES NOT CLAIM. It does not claim any evidence record
      overstated its tier; CORR-20260802-015 measured that none currently does. It
      does not claim the 29 records are wrongly tiered — it claims the check that
      would have told us was not running. It does not repair EXP-SIG-008's
      specification or make DEC-20260727-012's reference resolve. It changes no
      hypothesis status, promotes nothing, and asserts nothing about ECDLP or at
      cryptographic scale.
  evidence_refs:
    - tools/validate_ledger.py
    - tools/duplicate_run_ids.yaml
    - tools/test_duplicate_run_ids.py
    - ledger/corrections/CORR-20260802-014.yaml
    - ledger/corrections/CORR-20260802-015.yaml
    - ledger/corrections/CORR-20260802-016.yaml
    - ledger/decisions/DEC-20260802-008.yaml
    - ledger/decisions/DEC-20260802-009.yaml
    - ledger/evidence/EV-P13-001.yaml
  limitations:
    - >-
      This Coordinator executes no commands. The 36-line figure, the 2248/1110/1138
      reconciliation, the 221-collision measurements and the 29-record sweep are all
      second-hand and are accepted on the strength of reported output that has so
      far reconciled on every challenge.
    - >-
      The exclusion-3 rule is only as good as the snapshot it tests against. If the
      snapshot is regenerated from a different commit than the one immediately
      preceding the relocation, the rule silently admits or blocks the wrong lines.
    - >-
      The claim_tier register discloses the gap; it does not close it. Until the
      taxonomy decision lands, 29 evidence records have no enforced ceiling and
      seven of them cite runs.
    - >-
      A green CI after this work certifies that declared debt is declared. It
      certifies nothing about the runs, the evidence records, or any claim built on
      them.
  next_actions:
    - >-
      1. Commit tools/prerelocation_error_snapshot.txt — the verbatim `--no-baseline`
      error set at the commit immediately preceding the DEC-20260802-001 relocation.
      State which commit it was taken at, in the file and in the report back.
    - >-
      2. Apply the CORR-20260802-016 rule: verify each of the 36 lines naming a
      relocated record against the snapshot under its pre-relocation path. Any line
      without a counterpart stays BLOCKED and is escalated, not admitted. Report the
      verified old-path -> new-path mapping.
    - >-
      3. Proceed with DEC-20260802-008 steps 3 through 7 as amended by
      DEC-20260802-009 and by this record. Widen the C3 header line to "evidence and
      decision records citing runs or experiments that do not register in this
      repository", fill <C3> from the measured widened category, and report <N> and
      <M> as specified above.
    - >-
      4. In the same commit as the baseline, extend
      ledger/registers/unevidenced-records.yaml with the 29 unrecognised-claim_tier
      records: id, declared tier, run_ids attached yes/no, and for EV-MLKEM-005..010
      and EV-P13-001 the standing prohibition on supporting a hypothesis transition
      until the taxonomy decision lands.
    - >-
      5. Run the second sweep before that commit: evidence records with a RECOGNISED
      claim_tier whose cited runs all lack field_bits and field_bit_size, so the
      ceiling is vacuous for them too. Report the count even if zero. If it is not
      zero, those records join the register in the same commit.
    - >-
      6. Open the taxonomy decision separately, with this scope: whether claim_tier
      is one axis or several; whether conformance claims belong off the
      toy/medium/crypto axis and need their own field; migration of `toy_measurement`
      and `theoretical` by correction record rather than edit, folded into the
      EV-XEDN evidence review where they overlap; and only then the explicit
      unknown-tier and vacuous-ceiling errors, so the check can never silently
      no-op again.
    - >-
      7. Report the final table, the added-line count, the C3 figure, the two sweep
      results and the test state. I will record them in a closing DEC-* so the
      header is checkable against a committed record rather than a commit message.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. It reviews no run set, changes no hypothesis
      status, and produces no durable research claim. Ruling on a baseline exclusion
      rule and on a silently-inert schema check is repository hygiene and disclosure
      policy, not a finding about ECDLP or any hypothesis in this ledger.
  decided_by: coordinator
  decided_at: "2026-08-02"
