      enactment and may be satisfied by citing statuses already recorded in a
      committed coordination artifact.

  # =======================================================================
  f_j2_1_naming:
    effects_enacted_named: >-
      clause_4's LICENCE and its FORECLOSURE limb are named EXPLICITLY among the
      effects this decision enacts, because the record's own declared effect set
      (amendment.what_this_changes, nine items) omits both. The LICENCE is the
      statement of what an `off_curve` and a `reachable` status license; the
      FORECLOSURE is the statement that an `off_curve` status forecloses
      treating the anchor as an admissible (T_full, M) input at that field size
      and forecloses citing any row derived from it as a cost, a speedup or a
      crossover of this model.
    internal_disclosure_cited: >-
      I cite amendment.constraint_compliance.constraint_iii as the record's own
      internal disclosure of both limbs, as DEC-20260906-f709b2 expressly
      permits.
    what_this_naming_does_not_do: >-
      It does NOT settle RT-4's licensing question (that is na_2_v, resolved by
      adoption), and it does NOT read clause_4 as lifting, narrowing or widening
      the standing citation prohibition, which clause_4's own
      relation_to_the_standing_citation_prohibition denies.

  # =======================================================================
  w_1_merits_attack:
    preamble: >-
      A SUBSTANTIVE attack on the adopted RT-4 ruling, performed as the enacting
      batch's producer is required to do. One real counterfactual, and where it
      bites. This is not ceremony: a ruling that cannot name what would have
      changed it is a restatement wearing a ruling's header.
    the_counterfactual: >-
      The ruling's load-bearing anchor R2 turns on the DISJUNCTION in
      DEC-20260905-3b8e94's RT-4 disposition - "Two lines of redraft, OR an
      explicit ruling in the enacting decision that the provisos travel." Had
      that sentence instead named ONE sufficient disposition and named a
      relocation - for example "the provisos must be carried AND the analysis
      relocated out of the coordination directory before the contract may point
      at it" - then two lines of carrying would not have answered RT-4, the
      redraft's repair would be incomplete on the routing decision's own terms,
      and POSITION 2 (RT-4 not discharged; no pointer into a coordination
      directory survives in contract text) would follow directly.
    where_it_bites: >-
      It bites at R1 and R2. R1 reads RT-4's scope off its SUGGESTED REPAIR
      ("carry the two provisos into clause_4's own text; it is about two lines")
      rather than off its FINDING SENTENCE, which has two clauses joined by
      "and" and closes by calling the structure "the identical structural
      weakness the draft itself flags for clause_2's incorporation by
      reference, unflagged here" - a structural objection to pointer-borne
      contract content that survives moving the provisos. R2 turns on the word
      "or"; change the disjunction to a conjunction-plus-relocation and the
      ruling changes.
    honest_assessment: >-
      ON THE COMMITTED BYTES the disjunction is present, and R4's check (I
      opened analysis.licensing and found no condition on the licence that
      clause_4's own text does not carry) supports the discharge, so the ruling
      STANDS. The attack does not land on the committed bytes. It is recorded
      here as the STANDING MERITS ATTACK SURFACE: a successor that finds the
      finding-sentence reading is the centre of gravity, or that locates a
      condition in the pointed-to analysis that clause_4 does not carry, has a
      named route to POSITION 2 without re-deriving the question.

  # =======================================================================
