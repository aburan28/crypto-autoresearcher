  af_4_interval_ruling:
    ruling: >-
      TWO SENTENCES, CLOSING THE INTERVAL QUESTION WITHOUT TOUCHING A CLAUSE.
      FIRST: clause_4's raw-output status requirement is PROSPECTIVE on
      implementations, and the one existing implementation is non-conforming
      from the instant of enactment, and this is accepted knowingly. SECOND:
