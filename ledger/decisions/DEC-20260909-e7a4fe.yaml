  # =======================================================================
  af_3_pre_enactment_check:
    pointer: coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
    opened: true
    key_paths_exist: >-
      CONFIRMED BY OPENING THE RECORD: all three key paths clause_2 names exist
      - amendment.corrected_model.log2_law (the law log2(T(w)) = log2(T_full) +
      0.5*max(0, log2(M) - log2(w)) + overhead_bits), amendment.corrected_model.
      endpoint_behavior (the w=1, w=M and w>M rows), and amendment.corrected_
      model.crossover (the closed form log2(w_star) = log2(M) + 2*(log2(T_full)
      + overhead_bits - log2(T_DG))).
    record_status_and_in_force: >-
      RECORDED FROM THE POINTED-TO RECORD: status is `prospective_and_frozen`;
      the record carries NO in_force field (absent, not false). This decision
      records both exactly as the record states them and does not re-assert them
      beyond the read.
    law_satisfies_invariants: >-
      CHECKED AGAINST THE LAW AS STATED. (1) C3: the law is non-increasing in w
      (the term 0.5*max(0, log2(M)-log2(w)) falls as w rises) and, before the
      overhead multiplier, T(w) = T_full for w >= M (the endpoint_behavior block
      states w=M and w>M both give T_full before overhead). (2) C4: T(M) = T_full
      exactly before the declared overhead multiplier (endpoint_behavior.
      w_equals_M). (3) The crossover closed form is the crossover of that same
      law: solving log2 T(w*) + overhead_bits = log2 T_DG under the law for w* <
      M gives log2(w*) = log2(M) + 2*(log2(T_full) + overhead_bits - log2(T_DG)),
      which is exactly the record's crossover equation. All three invariants hold.
    scope_note: >-
      The pointed-to record is not in this task's declared read_scope; it was
      opened to perform the AF-3 precondition check that DEC-20260906-f709b2
      names as P-2 of the enacting batch. This read is disclosed here and in the
      runtime receipt, and it is a read of a committed coordination record, not
      of any frozen target or of inputs/.

