    na_2_iii_f_2_f_3_warrant_defects:
      item: >-
        The F-2 and F-3 warrant defects, by a SUCCESSOR RECORD and never by
        superseding an immutable artifact - to which RT-2 adds CF-22.
      resolution: >-
        RESOLVED BY ROUTING TO A SUCCESSOR RECORD. The F-2 and F-3 warrant
        defects are NOT repaired here and NOT by any edit to an immutable
        artifact; they travel by a successor record in the NA-3/NA-4 stream,
