coordinator_decision:
  id: DEC-20260807-f360f9
  goal_id: GOAL-SSI-001
  batch_id: BATCH-284f63
  recorded_by_task: null
  archived_by: coordinator

  context: >-
    GOAL-SSI-001's next_action listed, among four queued corrections, one
    described as a documentation fix: replace the "NIST-III/V retain
    comfortable margins" sentence in
    analysis/SSI-ECDLP-SYNTHESIS-20260803.md with the correct finding that
    the gap GROWS with level (9.5387/21.9537/38.8387 bits at NIST-I/III/V).
    Attempting this fix as a bounded batch, the target sentence was located
    and verified NOT to describe the claim the correction assumes.

  decision: revise

  decision_scope: >-
    This decision RE-SCOPES an unexecuted, queued correction. It does not
    touch any committed evidence, run, or hypothesis. No prior claim in the
    ledger is weakened or strengthened -- the 9.5387/21.9537/38.8387 figures
    were already independently verified twice before this decision
    (TASK-20260806-10980e, TASK-20260806-9536f4) and are re-confirmed here
    a third time by direct arithmetic; what changes is only the
    understanding of WHERE the documentation fix belongs.

  target_ids:
    - analysis/SSI-ECDLP-SYNTHESIS-20260803.md

  evidence_ids: []

  rationale:
    target_verification:
      basis: >-
        grep for the exact string "comfortable margin" against
        analysis/SSI-ECDLP-SYNTHESIS-20260803.md returns exactly one match,
        at line 171, inside Section 3 ("GOAL-P13-001 is the strongest
        line..."). That paragraph's own numbers -- a c-bracket
        [1.327077,1.576444] and an eighteen-reading w=2^30 margin bracket
        [8.3498,13.1544] bits -- describe the Delfs-Galbraith-vs-Wesolowski
        crossover for GOAL-P13-001/ECDLP, not SQIsign's T_full(P)
        security-level gap. These are different mathematical objects;
        substituting one's numbers for the other would be a new defect,
        not a repair.
      section_2_check: >-
        Section 2 ("GOAL-SSI-001: 33 consecutive batches...") is this
        document's own dedicated GOAL-SSI-001 section and contains no
        NIST-I/III/V margin claim of any kind -- it discusses only the
        CSIDH collimation-sieve FC0 lane (batches 1-39) and its
        QM-STOPPING blocker. The document's own header states scope
        "GOAL-SSI-001 (40 batches)" and is dated 2026-08-03. BATCH-046
        (2026-08-05, DEC-20260805-596d71, the 2^{120-123} concrete-cost
        finding) and BATCH-284f63 (2026-08-06/07, the Wesolowski crossover
        repair and EXP-SSI-9b542d) both postdate this document. The
        9.5387/21.9537/38.8387 figures could not have existed in any form
        this document might correctly reference, because the work that
        produced them had not happened yet.
      number_reverification: >-
        128-118.461337=9.538663 (rounds 9.5387), 192-170.046299=21.953701
        (rounds 21.9537), 256-217.161337=38.838663 (rounds 38.8387) --
        confirmed by direct computation in this decision, matching both
        prior independent red-team recomputations
        (TASK-20260806-10980e, TASK-20260806-9536f4) exactly.

  limitations:
    - >-
      The documentation fix itself remains UNMADE. Two paths forward are
      named in the updated next_action: add a correctly-scoped SQIsign
      NIST-I/III/V statement to Section 2 (which currently omits the
      finding entirely), or independently verify Section 3's own P13/ECDLP
      margin claim on its own terms and correct it there if it is found
      wrong. Neither has been attempted; this decision only prevents the
      wrong one from being done by accident.
    - >-
      This decision does not evaluate whether Section 3's
      [8.3498,13.1544]-bit margin claim is itself correct or wrong -- that
      is an entirely separate verification task against GOAL-P13-001's own
      evidence, out of scope here.

  next_actions:
    - >-
      GOAL-SSI-001.next_action updated in this same commit to reflect the
      corrected understanding and name both remaining valid paths (add to
      Section 2, or independently verify and correct Section 3 on its own
      terms) rather than the original mis-scoped instruction.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision corrects a queued task's scope, not a scientific
      finding. It re-confirms existing, already-promoted-or-promotable
      figures rather than establishing anything new.

  decided_by: coordinator
  decided_at: '2026-08-07'
