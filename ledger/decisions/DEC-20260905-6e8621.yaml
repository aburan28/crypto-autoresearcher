  # =====================================================================
  # CHECKS THE DELIVERED REVIEW DID NOT PERFORM. Recorded so a later reader
  # does not read `pass` as coverage it never claimed.
  # =====================================================================
  unperformed_checks:
    - check: BATCH-2cca27 known-bad control (planted-defect SENSITIVITY)
      status: never performed by any session
      why_it_matters: >-
        The two contracts specify DIFFERENT controls with opposite purposes.
        BATCH-008925's proves-too-much control is a SPECIFICITY check: run the
        J1 method on the known-good BATCH-cef2eb set and confirm the flags are
        not correlated with batch outcome. It was executed and reports 1 of 17
        flags on the control set against 5 of 58 overall, of the same kind and
        cause, which is a genuine and well-argued specificity result.
        BATCH-2cca27's known-bad control is a SENSITIVITY check: plant a defect
        and confirm the procedure detects it. NEITHER SUBSTITUTES FOR THE
        OTHER. A verification procedure that has never been shown to flag a
        planted corruption is weaker than a `pass` reads, however careful the
        pass is. Note also that AGENTS.md's own "proves-too-much" obligation is
        the KNOWN-FALSE form -- "the argument is run against objects for which
        its conclusion is KNOWN FALSE" -- which matches BATCH-2cca27's control,
        not BATCH-008925's. The delivered control satisfies the contract it was
        frozen under; it does not satisfy the AGENTS.md pattern of the same
        name. That is a defect in BATCH-008925's contract AS FROZEN, not in the
        Validator's execution of it.
      mitigation_present: >-
        Partial and honestly labelled. The report's calibration_reasoning notes
        that the method emitted two false positives from its own instrument
        (an initially-unbound snapshot.md and an initially-non-verbatim
        excerpt), both run down rather than accepted. That is evidence the
        instrument emits flags at all, which is strictly weaker than a
        planted-defect control and is not presented as equivalent.
    - check: BATCH-2cca27 check 3 -- enumerate claim/release side files and compare each release outcome against the queue task state recorded for that task, listing every mismatch without reconciling it in prose
      status: not performed
      note: BATCH-008925's contract has no counterpart clause.
    - check: BATCH-2cca27 check 5 -- the frozen-head goal-head invariant that latest_verified_commit d445fdbe is reachable from 8f80aec5d and introduced exactly the producer storage paths its message and the 2b52a7 receipt declare
      status: not performed
      note: BATCH-008925's contract has no counterpart clause.
    - check: startup-receipt ordering, independently
      status: rests on the reviewer's attestation
      note: >-
        The receipt enumerates what was read before it was written and attests
        that none is an object under review. No independent timestamp evidence
        survives, and this Coordinator did not verify the ordering.

