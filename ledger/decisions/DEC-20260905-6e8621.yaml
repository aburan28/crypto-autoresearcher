  # =====================================================================
  # RATIONALE.
  # =====================================================================
  rationale:
    - >-
      THE POLICY QUESTION, ANSWERED PLAINLY: AN UNPROBED AUTHENTICATED DIRECT
      SESSION DOES NOT SATISFY A RECHECK THAT NAMES "A SERVED XHIGH BINDING
      FROM A CREDENTIALED BACKEND". These are not the same condition and this
      Coordinator declines to treat them as one. A direct Claude-Code-family
      session does not route through the adapter and has no adapter-visible
      credential, so the instrument IMP-3's recheck names is structurally
      unsatisfiable by that runtime class -- not merely unsatisfied on this
      occasion. `adapter resolve` reports a CONFIGURED binding, and AGENTS.md
      "Model policy" is explicit that "a model identifier is unverified
      configuration until doctor --probe confirms the backend serves it".
      This Coordinator re-ran that probe: no backend is credentialed.
      `model_verified: false` is exactly the status AGENTS.md defines for this
      state, and the Validator recorded it correctly rather than dressing
      configuration up as verification.
    - >-
      WHAT FOLLOWS FROM THAT, IN TWO PARTS THAT MUST NOT BE COLLAPSED.
      (a) THE REVIEW IS NEITHER INVALID NOR A DEGRADATION. AGENTS.md rule 16
      permits an authenticated direct Claude Code session whose resolved
      provider is not Bedrock, and nothing in the Model policy section
      conditions a review's validity on model_verified being true. The policy
      forbids SILENT substitution and UNRECORDED degradation; here
      fallback_used is false, degraded_requirements is empty, effort xhigh is
      carried in .claude/agents/validator.md and confirmed by
      check_runtime_bindings.py (both verified by this Coordinator), the
      provider is not Bedrock, and the unverified status is disclosed in both
      the receipt and the report. Under rule 11 no silent alteration of model
      or reasoning level is evidenced. (b) BUT THE POLICY IS NOT VERIFIED
      SERVED EITHER, AND NO AMOUNT OF REPORT QUALITY SUBSTITUTES FOR A PROBE.
      The strongest positive evidence available is a session self-report
      agreeing with a configuration file, which the Validator itself correctly
      refuses to call a probe. The report's evident depth is behavioural
      evidence about the review, never a model-identity probe, and this
      Coordinator will not launder one into the other. So the ATTESTATION that
      review-adversarial at xhigh was served remains UNOBTAINED, and per
      AGENTS.md no attestation may be recorded that was not obtained.
    - >-
      THE THREE IMPEDIMENTS ASK FOR DIFFERENT THINGS, WHICH IS WHY THEY GET
      DIFFERENT ANSWERS. The nested IMP-1
      (research_goal.impediments, condition "a durable independent review
      remains absent") asks for a DELIVERABLE: "a newly approved bounded
      independent review produces a durable report that is archived, verified,
      and published for Coordinator disposition". Every conjunct holds. Newly
      approved: DEC-20260905-36847f. Bounded independent review:
      TASK-20260905-2c383f, whose independence this Coordinator verified from
      the records below. Durable report: report.json at the declared path.
      Archived: snapshot acb081203, an ancestor of HEAD and of origin/main.
      Verified: content-verified, which per CLAUDE.md "Archive receipts bind to
      CONTENT first" is the primary binding -- the release record's
      artifact_sha256 values recompute exactly in the working tree and at the
      snapshot, and this Coordinator recomputed both. Published: acb081203 and
      4172dca7f are both ancestors of origin/main. Published for Coordinator
      disposition: this decision. Its own recheck ("inspect the review dispatch
      queue and the newly assigned review report and archive bindings") is what
      this task performed. THE NESTED IMP-1 IS CLEARED.
    - >-
      THE TOP-LEVEL IMP-1 IS PARTIALLY CLEARED, AND SAYING SO IS THE HONEST
      ANSWER RATHER THAN A HEDGE. Its what_is_blocked -- "dispatch of
      TASK-20260905-2c383f and its dependent ledger stage TASK-20260905-e20317"
      -- is demonstrably no longer blocked: 2c383f dispatched and delivered, and
      e20317 is this task. But NONE of its four clears_when disjuncts is
      satisfied. This Coordinator re-ran `doctor --probe`: ANTHROPIC_API_KEY is
      still unset, no fireworks or zai balance is evidenced, the adapter still
      has no /v1/responses transport path serving gpt-5.6-sol at xhigh, and
      there is no probe-verified native Codex session. The blockage lifted
      through a FIFTH route its author (DEC-20260905-e140ee) did not enumerate:
      an authenticated direct Claude-Code-family session that bypasses the
      adapter entirely. Clearing it outright would assert a credential state
      that does not exist; leaving it fully standing would deny a delivery that
      demonstrably happened. Partially cleared records both facts, and the
      remaining condition is concrete: any ADAPTER-ROUTED dispatch of a policy
      above what `local` serves will fail exactly as DEC-20260905-e140ee
      recorded.
    - >-
      IMP-3 STANDS, ON ONE SENTENCE: its clears_when names execution of
      BATCH-2cca27's frozen contract and its recheck names a served xhigh
      binding from a CREDENTIALED backend, and neither is satisfied. The
      contract executed was BATCH-008925's, and the two are DIFFERENT
      DOCUMENTS -- this Coordinator recomputed both digests:
      BATCH-2cca27/contracts/integrity-review.json is
      8589f1280cfae7891f254851c1297d2cf76a9e7a98df9948f974fa06bc815ab0
      (schema administrative_integrity_review.v1, frozen source head 8f80aec5d,
      task_id TASK-20260905-5681fc) while
      BATCH-008925/contracts/integrity-review.json is
      b5c558c6f324eeca0b70651ec8e2638ab201ee9478ea131ae4b47604085fefe5
      (schema review_contract.v1, authorized_by DEC-20260905-36847f). Their
      check lists differ materially, in a way that matters and is recorded
      under unperformed_checks below. IMP-3's what_is_blocked is NARROWED
      rather than cleared: what remains blocked is (a) the probe-verified
      policy attestation and (b) BATCH-2cca27's mandatory known-bad control.
      Its clause "IMP-1 therefore stays open" was true of its own lane at its
      own writing and is now overtaken on the facts by this decision; that text
      is NAMED here as needing supersession and is not edited.
    - >-
      THE DELIVERED REPORT DOES DISCHARGE THE CONTRACT IT WAS GIVEN. Against
      BATCH-008925's frozen contract: joints J1-J4 present with owner and
      method-consistent verdicts, all `pass`; the proves-too-much control
      executed as that contract words it, with the miscalibration test answered
      in both directions; the startup receipt at the declared path before any
      object under review, recording start time, runtime, model identity as
      exposed, and task id; prohibitions attested; deliverable at the declared
      path. Against the handoff's completion_gate: all three conditions met,
      and J1 cites recomputed digests as required. One disclosed scope
      extension is recorded in the report's own deliberately_not_done rather
      than absorbed silently (hashing the five IDEA-20260904-* proposals and
      comparing eight transcribed excerpts, because sources.json's own
      pending_verification asks a fresh Validator to do exactly that); that is
      the correct handling of a procedure deviation and not a defect.
    - >-
      THE MOST USEFUL OUTPUT HERE IS NOT THE `pass`. A pass with 14
      medium-and-below findings is not a clean bill, and three of the five
      medium findings converge on one thing: this campaign's TELEMETRY CAPTURE
      DISCIPLINE is its weak joint. FINDING-04 -- per-task wall-clock
      compliance is unverifiable for three of four producer tasks, and the one
      measurable envelope (1228 s) exceeds the 600 s cap and cannot be
      attributed, so NEITHER compliance NOR violation is established.
      FINDING-08 -- the resource-limit anomaly at the centre of the readiness
      record rests on Executor-TRANSCRIBED rather than CAPTURED probe output,
      disclosed in transcript.json's capture_provenance but not in report.json,
      so a reader of the report alone sees the ValueError as captured output.
      FINDING-09 -- the transcript's authority_validation asserts a returncode
      it did not capture, its embedded plan is bound to a queue state matching
      no committed revision, and the /tmp plan file is not preserved, so
      sources.json's "both queues pass" cannot be confirmed from the committed
      record. NONE of these is fabrication and none is asserted as such:
      FINDING-08's substance is independently corroborated by the separate
      isolated probe embedded in BATCH-1a527c/archives/TASK-20260905-2b52a7/snapshot.md,
      which carries genuine returncode, stdout and elapsed_seconds. But
      together they mean a benchmark package built on the same recorder pattern
      would inherit the same gap, and completion criterion 1 requires results
      "within declared parameters" -- which needs MEASURED parameters this
      campaign does not yet have. This is forward guidance for criterion 1, not
      an impediment.
    - >-
      FINDING-14 IS THE SHARPEST FINDING ON THE IMPEDIMENT ITSELF. The delivery
      diagnostic that justified re-opening the review (TASK-20260905-1134be,
      accepted by DEC-20260905-293536) had a 2208-byte payload and, by its
      helper's own reported timestamps, about 5.7 seconds of work, and neither
      observer.json nor the accepting decision records that this is
      unrepresentative of a substantive multi-joint review workload. The goal's
      own history bears the gap out: the very next review attempt (BATCH-2cca27,
      TASK-20260905-5681fc) still failed. So "delivery works" never transferred
      to a real review workload; what actually delivered this review was a
      DIFFERENT RUNTIME, not a demonstrated delivery capability. Cause and
      transferability are separate limitations and only the first was on the
      record.
    - >-
      NOTHING SCIENTIFIC IS ESTABLISHED, PROMOTED, OR MOVED. No hypothesis
      status changes; GOAL-SATIC-c49b77's active_hypothesis_ids remains empty.
      RQ-SATIC-1ae57a is untouched. Zero solver invocations occurred in any
      reviewed batch and zero in the review; the only computations reproduced
      are brute-force truth-table enumerations over three 1- and 2-variable
      fixtures, which say nothing about any solver. The blocked ledger stages
      TASK-20260905-e2c12f (BATCH-1a527c) and TASK-20260905-86ea49
      (BATCH-971dc7) REMAIN BLOCKED, per the frozen contract's own prohibition
      and DEC-20260905-36847f's what_is_not_authorized; unblocking them is a
      separate Coordinator decision this one does not make. IMP-2 (resource
      handling) stays out of scope per the goal's recorded ordering.

  # =====================================================================
  # IMPEDIMENT DISPOSITION. An impediment is marked, never deleted.
  # =====================================================================
  impediment_disposition:
    - impediment: IMP-1 (research_goal.impediments[0])
      disambiguated_by: >-
        condition text "The independent review TASK-20260905-a05748 ended
        without a durable Validator report..."; clears_when "A newly approved
        bounded independent review produces a durable report that is archived,
        verified, and published for Coordinator disposition."
      verdict: cleared
      deciding_sentence: >-
        A newly approved (DEC-20260905-36847f) bounded independent review
        (TASK-20260905-2c383f) produced a durable report that is archived
        (acb081203), content-verified (release artifact_sha256 recomputed
        exactly by this Coordinator), published (ancestor of origin/main), and
        is hereby disposed of by a committed Coordinator decision.
      what_this_does_not_clear: >-
        The blocked ledger stages TASK-20260905-e2c12f and TASK-20260905-86ea49
        stay blocked; clearing this impediment removes the MISSING-REVIEW
        obstacle to deciding them, and is not itself that decision.
      disclosed_shortfall_inside_the_clearance: >-
        The snapshot archive task DEC-20260905-36847f authorized,
        TASK-20260905-de286c, WAS NEVER CREATED. There is no archives/
        directory under BATCH-008925 and no queue entry, receipt, or
        path_sha256 block for it; acb081203 is a bare snapshot commit. So
        "verified" rests on content verification (recomputed here) plus the
        dispatcher spot-check recorded in the release note, NOT on a
        dispatcher-verified archive receipt. Under CLAUDE.md's content-first
        rule that is sufficient for durability, and the content was verified
        here; the missing archive TASK is a process defect, recorded and routed
        rather than repaired.
    - impediment: IMP-1 (top-level impediments[0])
      disambiguated_by: >-
        condition text "pause_condition ... review-adversarial @ xhigh
        unservable on every reachable backend (transport-failure evidence in
        DEC-20260905-e140ee)"; clears_when the four credential/transport
        disjuncts.
      verdict: partially_cleared
      deciding_sentence: >-
        What it blocked is demonstrably no longer blocked -- TASK-20260905-2c383f
        delivered and TASK-20260905-e20317 ran -- but none of its four
