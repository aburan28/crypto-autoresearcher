coordinator_decision:
  id: DEC-20260904-031ed2
  recorded_at: '2026-09-04'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-e479db
  decision: revise
  decision_rationale_for_verb: >-
    Neither "approve" (this record authorizes no experiment, arm, or
    execution batch) nor "reject_scoped"/"weaken" (nothing here is evidence
    about AES, and no hypothesis moves) fits. "revise" is used in its
    narrowest sense, matching DEC-20260903-afdd06's usage: the scoped
    successor revision is promoted to the ledger as the reviewed candidate
    IDEA-20260904-06c396, but four REVISE-class fidelity findings from joint
    J-R2 (RT2-SR-1..4) touch the binding preregistration text and the pricing
    tables, and under RAT-3-with-SR-1 that text IS the binding version - so
    they must be closed before any future Coordinator decision may authorize
    execution of D-1, D-2, or any successor design derived from this IDEA.
    The two BLOCKING requirements this round was opened to discharge (SR-2
    and SR-3) ARE discharged to the satisfaction of both independent joints;
    the remaining items are fidelity and adoption-trade items, not a gap in
    the rule's safety.

  context: >-
    BATCH-e479db (opened by DEC-20260904-33843a on branch
    aes003-fm-revision-20260904, PR 729) executed the revised RANK 1 named by
    the goal head after DEC-20260903-afdd06: a zero-arm, design-only SCOPED
    SUCCESSOR REVISION of the FM-cascade design (IDEA-20260903-bd730d).
    Producer TASK-20260904-30f2f7 wrote design-revision.yaml,
    pooled-exposure-pricing.json and preregistration-skeleton.md; snapshot
    TASK-20260904-6d791a bound them at commit 4c9cbfe0d; two independent,
    mutually blind reviewers each owned one joint of the review plan recorded
    in ledger/handoffs/TASK-20260904-30f2f7.yaml: TASK-20260904-f9ad79 owned
    J-R1 (SR-2 heterogeneity-bound arithmetic, SR-3 effect on Branch-4
    admissibility, rule decidability), TASK-20260904-937822 owned J-R2 (SR-3
    remedy adequacy, licensing under NARROW-1..5, proves-too-much on the
    tightened rule, SR-4/5/6/7/8 completeness). This is the closing archive
    that composes both joints, promotes the revision, and checkpoints
    GOAL-AES-003. It runs ALONE, after both reviews returned. This is a
    DESIGN-REVISION REVIEW, not an evidence review: zero arms were run by the
    producer or by either reviewer against the committed instrument.

  target_ids:
    - IDEA-20260904-06c396
    - IDEA-20260903-bd730d
    - TASK-20260904-30f2f7
    - TASK-20260904-f9ad79
