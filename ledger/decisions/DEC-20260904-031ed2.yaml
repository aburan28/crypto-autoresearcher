  rationale:
    - >-
      JOINT J-R1 (TASK-20260904-f9ad79, validator, sealed-first blind
      re-derivation): VERDICT HOLDS. The validator wrote fresh scipy code
      this session, re-derived the SR-2 plateau_heterogeneity_sensitivity
      false-positive rates at the named phi grid, the tightened Branch-4
      conjunct's firing region under the homogeneous null, and the tightened
      rule's routing on the realized readings BEFORE opening the producer's
      pricing file, then compared quantity by quantity: every new SR-2/SR-3
      quantity reproduced to every reported digit (different scipy/numpy
      stack, different enumeration algorithm). Three localized discrepancies
      were found, all in RETAINED BATCH-b38667-lineage content, all disclosed
      or self-corrected by the producer, none load-bearing for SR-2/SR-3.
      Runs used 2 of 2 authorized; zero experiment arms.
    - >-
      JOINT J-R2 (TASK-20260904-937822, red team, what the tightened rule
      licenses): VERDICT HOLDS_WITH_FINDINGS. None of the three
      pre-declared breaking artifacts was found. All five proves-too-much
      objects route correctly under the written cascade (independently
      re-derived; OBJ-5B never reaches PLATEAU, plateau mass <= ~1e-77). The
      SR-3 conjunct is NOT vacuous: Branch-4 fires at 0.171940 under the
      design's own homogeneous truth, reproduced to six digits. No smuggled
      extinction, plateau-as-completion, cliff-at-4, whole-curve,
      k=12-coverage, count-verdict-at-k=8, prior-rehabilitation, or
      plateau-safe-for-all-phi sentence was found. SR-1/4/5/6/7/8 are
      discharged; SR-7's zero-residual-degrees-of-freedom argument is
      confirmed correct. Four REVISE-class findings (wording/tables, not the
      rule) are carried as successor requirements below. One disclosed
      procedure deviation: a third scoped bug-fix run exceeded maximum_runs
      by one; read-only git verification was used (no commits, no ledger
      edits).
    - >-
      PRIOR COMPARISON (coordinator prior recorded in
      ledger/handoffs/TASK-20260904-30f2f7.yaml before any reviewer ran):
      (1) CONFIRMED in direction - the phi-stratified false-positive rate
      rises with phi and the honest bound leaves a disclosed residual (the
      red team quantifies an 11-17% disclosed residual on the OBJ-5A
      calibration family: bounded, not removed). (2) OVERTURNED in the
      valuable direction - I expected the tightened conjunct's small-n
      degrees-of-freedom interaction to make it vacuous or uncheckable; both
      reviewers instead show it satisfiable with room to spare (fires at
      0.171940 under the homogeneous null, six-digit reproduction). (3)
      CONFIRMED-ABSENT - the sentence audit found no smuggled
      plateau-safe-for-all-phi sentence. (4) CONFIRMED - SR-1 and SR-6
      discharged cleanly as textual fixes. (5) CONFIRMED - SR-7's
      zero-residual-df argument is correct and makes n=1 dominated by
      construction.
    - >-
      COMPOSITION: SR-2 and SR-3 - the two requirements DEC-20260903-afdd06
      named as blocking any execution authorization - are discharged: the
      bound exists, is quantified, was independently reproduced, and the
      remedy is adequate and non-vacuous. What remains is (a) four fidelity
      findings that touch binding text/tables (RT2-SR-1..4) and (b) one
      adoption-trade question that is the Coordinator's, not the producer's
      (RT2-SR-5: whether the disclosed 0.171940 range-wide false-plateau
      bound on the OBJ-5A calibration family is an acceptable standing price
      for bound-carrying plateau sentences). Neither (a) nor (b) blocks the
      promotion of the revision as the reviewed candidate; both gate any
      future execution-authorization decision.

  successor_requirements:
    - "RT2-SR-1: Rewrite the SR-3 margin rationale (pricing sr3_remedy.conjunct.margin_rationale_preregistered_from_the_null_law and the design-revision pointer): drop 'the LARGEST threshold defined purely from the null law' (false - chi2_0.975(3) = 9.348404 is a larger null-law level quantile still below the gate), name q = 0.95 as a conventional level choice among {0.90, 0.95, 0.975} below the gate, and disclose that the level was fixed in the revision session with the OBJ-5 calibration arithmetic in view while no realized reading enters the threshold value."
    - "RT2-SR-2: Restate the control-object routing table under the written cascade order (Branch H first, per Section 5.6) or label every entry 'conditional on Branch H not firing': OBJ-4 decay power 0.970869 -> 0.952538 written order (0.018883 to FM-OVERDISPERSED); OBJ-5B comparator 0.9981704 'invariant' -> 0.989349 falling to 0.884236 as phi runs 1.0 -> 2.0 (0.115764 to FM-OVERDISPERSED at phi = 2.0, both-points split reading). Propagate the corrected decay power to sr3_remedy.effect.on_the_decay_branch and the design-ladder power claim. No verdict changes."
    - "RT2-SR-3: Restore byte fidelity in IDEA-20260904-06c396's verbatim_amend1 block (source glyphs U+2212 and U+00D7, not ASCII '-'/'*') and its NARROW-3 quote (em dash, not hyphen), or relabel those blocks 'normalized transcription'; and either quote RAT-5 verbatim under Section 0's preamble or move the paraphrase outside it."
    - "RT2-SR-4: State, in the OBJ-5B object definition, which point or points carry the bimodal per-seed split (the mean constraint is 'at both points'; the split is unnamed). The written-order numbers use the both-points reading; the k=4-only reading would lower the Branch-H capture at phi = 2.0 but changes no verdict."
    - "RT2-SR-5 (COORDINATOR, not producer): at any future execution-gate decision, rule whether the disclosed 0.171940 range-wide false-plateau bound on the OBJ-5A calibration family (with the 11-17% disclosed residual) is an acceptable standing price for bound-carrying plateau sentences. That trade - not any finding in the red-team report - is the revision's real adoption question."

