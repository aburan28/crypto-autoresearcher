coordinator_decision:
  id: DEC-20260805-e46f4f
  context: >-
    GOAL-SSIQ-001 BATCH-006 closes. It executed a frozen v3 amendment
    (specification_v3.yaml, EXP-SSIQ-a85692) that re-analyzed
    RUN-SSIQ-a85692-b's already-collected data under GD-8's corrected
    trapped-vertex exclusion filter and attempted to wire GD-9's missing
    C-NULL-LABEL comparison logic, at zero new search cost. GD-8's fix
    worked and is validated on real data. Terminal branch:
    DATA-UNAVAILABLE-BLOCKED (0 of 4 primes survive the corrected filter
    in either arm), correctly derived and disclosed. But the Red Team
    found the required synthetic self-test -- built specifically because
    real data cannot exercise GD-9's substantive branch -- bypasses the
    actual wrapper function it exists to validate. Recorded as
    EV-SSIQ-028c9f, on TASK-20260805-47be12 ADMIT-WITH-CONDITIONS and
    TASK-20260805-176dab CHALLENGE.
  decision: revise
  decision_note: >-
    revise, not inconclusive. The run itself executed honestly, GD-8 is
    solidly fixed and validated, and DATA-UNAVAILABLE-BLOCKED is the
    mechanically correct, well-disclosed terminal label -- not a repeat of
    any prior batch's confusion about what a label means. The reason for
    revise is a THIRD layer of the same failure pattern this campaign has
    now found four times (GD-4, GD-7, GD-9, and now GD-10): a fix or
    control that LOOKS validated -- a report block exists, a test "ran,"
    numbers match to high precision -- without the thing that actually
    needed checking (here, the wrapper function's own control flow) ever
    being exercised. GD-9's wrapper is fixed in code and consistent with
    the frozen spec's own prose, but the required validation artifact
    tests the wrong function, so GD-9's status is downgraded from "fixed"
    to "fixed in code, runtime-unvalidated." Named GD-10. Fixable at zero
    new search cost, using the same already-collected data schema.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - H-SSIQ-36e970
    - EXP-SSIQ-a85692
    - EV-SSIQ-028c9f
    - TASK-20260805-6f3934
    - TASK-20260805-47be12
    - TASK-20260805-176dab
  evidence_refs:
    - EV-SSIQ-028c9f
  rationale:
    - id: D-1
      statement: >-
        GD-8 IS FIXED AND VALIDATED ON REAL DATA, INDEPENDENTLY CONFIRMED
        BY BOTH REVIEWERS THROUGH HAND RE-DERIVATION FROM RAW DATA, NOT
        BY TRUSTING THE MANIFEST. trapped_exclusion_filter_v3 correctly
        excludes all 4 primes in both the real arm and the null arm,
        matching the frozen contract's own pre-freeze-confirmed worked
        check to full float precision. This is an unambiguous advance:
        the campaign now knows, with confidence, that the trapped-vertex
        exclusion rule v1's own text always required is correctly
        implemented and correctly applied to real data.
      confidence: high
    - id: D-2
      statement: >-
        DATA-UNAVAILABLE-BLOCKED IS THE CORRECT, HONESTLY-DERIVED TERMINAL
        LABEL. It correctly does not reopen the already-passed Phase -1
        gate from RUN-SSIQ-a85692-b (disjoint quantities, no shared code
        path, independently confirmed), and apply_decision_rule's
        non-invocation is correctly disclosed rather than glossed. This
        outcome is itself informative: it shows that ALL 4 previously-
        searched primes are pervasively trapped in BOTH the real-label and
        shuffled-label arms, on the same graphs -- a property of graph
        structure/greedy dynamics at this toy scale, not of delta_E-label
        quality specifically (both arms show the same pattern).
      confidence: high
    - id: D-3
      statement: >-
        A NEW DEFECT IS NAMED, GD-10, ON THE SAME GROUND GD-9'S OWN
        STANDING REPAIR WARNS AGAINST BUT DID NOT ITSELF ANTICIPATE: THE
        VALIDATION ARTIFACT BUILT TO PROVE A FIX WORKS CAN ITSELF FAIL TO
        TEST THE RIGHT THING. The Red Team read run_synthetic_self_test_v3
        directly and found it never calls c_null_label_comparison_v3 (the
        wrapper GD-9's fix adds) -- it calls the underlying
        ols_loglog_fit/bootstrap_gap_ci library functions directly and
        re-implements the comparison rule as a second, hand-written copy,
        bypassing the wrapper's own cross-dict indexing (independently
        confirmed structurally necessary: the null arm's data has no N
        field at all, so pulling N from the real arm is the only correct
        wiring, and is exactly the kind of detail a self-test should
        confirm rather than assume), its min-primes gate, and its
        ordering logic entirely. The Validator independently confirmed
        the self-test's OWN arithmetic is correct (an exact power law
        must recover gamma exactly, hand-derived from first principles) --
        so this is not a computational error, it is a wiring/integration
        gap the self-test's design does not reach. A subtly wrong
        implementation of the wrapper (a swapped dict source, an
        off-by-one, a missing sort) would pass this self-test unchanged.
      severity: high
      standing_repair_adopted: >-
        A validation artifact (a synthetic self-test, a unit test, a
        control's null-object arm) must be verified to actually CALL the
        specific function/branch it is built to validate, not merely to
        exercise library code that function happens to also use. When a
        pre-freeze review requires a self-test BECAUSE a specific new
        wrapper is unreachable on real data (as GD-9's fix required), the
        pre-freeze review's own required_controls should name the exact
        function the self-test must call, not just describe the desired
        behavior in prose -- the same discipline this campaign already
        applies to distinguishing "ran" from "was exercised correctly,"
        now extended to test artifacts built to prove a fix works, not
        only to the production code the fix lives in.
    - id: D-4
      statement: >-
        THE RED TEAM WEIGHED WHETHER RUNNING THIS BATCH'S FULL
        EXECUTOR/VALIDATOR/RED-TEAM CYCLE WAS JUSTIFIED, GIVEN THE
        PRE-FREEZE REVIEW HAD ALREADY PREDICTED THE REAL-ARM OUTCOME WITH
        HIGH CONFIDENCE, AND CONCLUDED YES -- BUT ON A NARROWER BASIS THAN
        THE RUN PACKAGE'S OWN FRAMING CLAIMED. The value delivered was
        concentrated in confirming the ACTUAL IMPLEMENTED CODE (not the
        draft prose) applies GD-8's filter correctly, and in D-3's own
        finding, neither of which required predicting the real-arm outcome
        in advance and neither of which a lighter-weight Coordinator-only
        arithmetic check would have caught (this campaign's own history --
        GD-6, GD-8, GD-9 -- shows plausible-sounding prior beliefs
        surviving until someone reads the actual code). This decision
        adopts the Red Team's own correction: the self-test's claimed
        value ("the ONLY runtime evidence GD-9's fix works") is real for
        the reused library functions but overstated for
        c_null_label_comparison_v3 itself, and any future citation of
        this batch's outcome must carry that correction.
  limitations:
    - >-
      H-SSIQ-36e970's real-arm prediction is UNTESTED. DATA-UNAVAILABLE-BLOCKED
      is informative about pervasive trapping at this toy scale, not about
      whether a delta_E-gradient exists.
    - >-
      "GD-9 is fixed" is NOT licensed by this decision without the
      qualifier: fixed in code, consistent with spec, validated on
      synthetic data for the underlying library functions only, NOT
      runtime-validated for the wrapper function itself (GD-10).
    - >-
      No claim about a p^{1/4} algorithm's existence, likelihood, or
      proximity is made or implied anywhere in this decision or its
      evidence record.
    - >-
      The non-monotonic trapped_fraction observation across the 4 tested
      N values is recorded as a caution against assuming larger N
      resolves trapping, not as a finding -- the sample is too small to
      support a trend claim.
    - >-
      Toy scale throughout (the same 4-5 primes RUN-SSIQ-a85692-b already
      searched, N in [203, 718]).
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch. Evidence strength
      stays capped at preliminary campaign-wide.
  next_actions:
    - >-
      SINGLE NEXT ACTION -- open BATCH-007 as a further versioned
      amendment (v4) to EXP-SSIQ-a85692, implementing the Red Team's
      ranked list, in order, all at zero new search cost against
      already-collected data: (1) fix GD-10 -- build a synthetic self-test
      that constructs real_per_prime/null_per_prime dicts shaped exactly
      like the real data schema (real arm carries N, null arm does not)
      and calls c_null_label_comparison_v3 itself through BOTH its
      NOT-EVALUABLE and fit-and-bootstrap branches, with hand-computable
      expected outputs -- this must land before any future run's
      c_null_label_control_failure value (True, False, or NOT-EVALUABLE)
      is cited as validated machinery; (2) investigate the mechanism
      behind pervasive trapping using already-collected graph/vertex/
      degree-sequence data from RUN-SSIQ-a85692-b (no new search): is
      trapping concentrated on specific low-degree vertices, correlated
      with a graph-structural property independent of N, or an artifact
      of the greedy tie-break rule -- do this BEFORE spending real search
      budget on larger N under the unexamined assumption that bigger
      graphs trap less, since (per this batch's own O-6) trapped_fraction
      does not monotonically decrease across the 4 already-tested N
      values. This amendment goes through its own pre-freeze Red Team
      review, with explicit attention to GD-10's standing repair: any
      required validation artifact names, in its pre-freeze text, the
      exact function/branch it must call.
    - >-
      NOT CHOSEN, WITH REVISIT CONDITIONS (AGENTS.md rule 9). (i) Widening
      to larger primes/N is deferred until item (2) above gives a
      specific, evidence-based reason to expect different trapping
      behavior at larger N -- spending new search budget on an untested
      assumption would repeat the shape of the uncosted-precompute
      decisions GD-4's discipline exists to prevent. (ii) Retiring lever
      L4 as exhausted is explicitly NOT chosen: a coverage gap at toy
      scale (zero survivors at N in [203, 611] across 4-5 primes) is not
      a named obstruction with an argument per docs/inventor-protocol.md
      section 4's closure standard, and goal.yaml still ranks L4 highest-
      priority and open. Revisit only if items (1)-(2) are completed and
      either identify a fixable mechanism, or a larger-N attempt with a
      specific hypothesis is run and also shows pervasive trapping.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength for H-SSIQ-36e970 itself is
      inconclusive, below the replicated bar docs/task-lifecycle.md step 9
      requires. A SEVENTH KNOWLEDGE CANDIDATE IS NOW QUEUED campaign-wide,
      distinct from the prior six: "a validation artifact built to prove
      a fix works must be verified to actually call the specific
      function/branch it exists to validate -- exercising library code
      that function happens to reuse is not the same check, and a
      passing self-test report is not itself evidence the wrapper it was
      built for is correct." All seven promote together when a genuinely
      different model becomes available to re-check them.
  decided_by: coordinator
  decided_at: '2026-08-05'
