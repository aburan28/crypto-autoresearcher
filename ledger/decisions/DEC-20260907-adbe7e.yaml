  rationale:
    - >-
      THE ONE SENTENCE THAT DECIDED IT. The mathematics is right and the
      mechanism is right -- the cap convention, the three-term accounting
      identity, D1, the derivation-packet allowlist and this lane's own leak
      discipline all pass on recomputation this gate performed itself -- but
      the contract's two normative documents give three different accounts of
      how many controls it has and which letters name them, and its
      required-artifact clause demands a firing status for six items it
      elsewhere declares have no firing condition; so the contract is sound in
      what it measures and not yet coherent in what it instructs.
    - >-
      ALL SEVEN DEFECTS OF DEC-20260907-4e34c5 ARE DISCHARGED, including the
      three blocking ones, and this gate says so plainly because a revision
      verdict must not be read as a re-refusal. D1: v3 states T = 64 and
      T_sel = 32 at N = 2^20 from the frozen table at
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223, and a sweep
      of v3, the amendment, this batch's queue, its task cards and its handoffs
      found the stale sidecar values only inside explicit negations, never as
      an operative value. That is the STRONGER of the two discharges the
      predecessor offered -- stating the correct value rather than dropping the
      arm. D2: see the next item. D3: see the item after it.
    - >-
      D2 IS DISCHARGED AND THE FORMULA IS IDENTICAL, NOT MERELY CLOSE. This
      gate re-derived the cap convention FROM THE CODE symbol by symbol rather
      than inheriting DEC-20260907-4e34c5's TF-1, as DEC-20260907-b6bcf4
      `limitations` requires. T = T_OF_NBITS[n_bits] matches instrument.py line
      74; W = sqrt(a*N/T) matches line 75; CAP_MULT = 8 matches line 31;
      cap = ceil(8W) matches line 77, including that the rounding is ceil and
      that the multiplication precedes it (ceil(8W), never 8*ceil(W)) -- both
      checked as separate claims because they are separate ways to be wrong.
      The gate then RECOMPUTED W and cap independently at all eight (N, a)
      cells of v3's grid and matched every tabulated value with zero
      discrepancies. It further confirmed the convention is derivable from v3's
      text ALONE, by computing the table from the contract's own strings before
      opening the source -- which is the precise gap D2 opened, since v1 and v2
      named neither multiplier nor rounding.
    - >-
      THE THREE-TERM ACCOUNTING IDENTITY IS TRUE OF THE IMPLEMENTATION, and the
      gate checked it two ways. STRUCTURALLY, from instrument.py `exact_basins`
      (lines 194-215): np.bincount is taken over the DP-terminating subset
      ONLY, so the two residual classes never enter a basin count; each point
      has exactly one termination state (reached a DP, entered a DP-free cycle,
      hit the cap), so the three classes are disjoint; `walk_to_dp` has no
      fourth exit, so they are exhaustive; and every term is an integer count,
      so "exact, zero tolerance" is genuine integer exactness rather than a
      float comparison in disguise. EMPIRICALLY, by recomputing
      sum_d b(d) + residual = N cell by cell from the committed raw-result.json
      of RUN-ECDLP-6ac801-001..005 at all 20 committed cells: the identity
      closed everywhere, the residual was non-negative everywhere, and no cell
      carried an empty basin. One honest limit is recorded rather than papered
      over -- the v1 runs do not store cycle_mass and capped_mass separately,
      so the SPLIT of the residual is verified from code structure and not from
      committed data; v3 closes exactly that gap prospectively at
      `required_artifacts` line 1752.
    - >-
      D3'S REPAIR IS A MECHANISM CHANGE, NOT A LONGER LIST, AND IT WORKS. The
      denylist is replaced by a CLOSED POSITIVE ALLOWLIST in the packet's
      MANIFEST.yaml. Every listed sha256 was recomputed against the tree and
      cross-checked against the TASK-20260907-6077f2 snapshot receipt: ZERO
      MISMATCHES. The three properties that decide whether an allowlist works
      all hold. SUFFICIENT: reading deliverables.md field by field, every
      demanded output is producible from the allowlisted files alone, and the
      decisive case -- the cap, which is what forced the original re-deriver
      outside -- is now stated inline with its multiplier, rounding and
      charging rule. LEAK-FREE: no allowed file states a prior, expectation,
      verdict, margin, pass-count or numeric value of the quantity under test,
      and the one disclosed inclusion (that a = 1/4 is the known-false object)
      is required by "controls before belief" -- a re-deriver cannot run a
      known-false control without being told which object it is, and
      withholding it would remove the control rather than preserve blindness.
      SELF-DETECTABLE: the packet's own text says the list is closed and
      positive, that opening anything off it is a violation, and that the
      re-deriver must attest to what it read before sealing -- so a blinded
      agent can tell it is under an allowlist and can tell whether it broke it,
      without opening any decision record. That last property is the one the
      predecessor's denylist structurally could not have.
    - >-
      THIS LANE DID NOT REPEAT THE PREDECESSOR'S OWN LEAK. The predecessor's
      D3 failure was in five places in a committed queue and in two immutable
      commit messages. This gate audited BATCH-48ef8b's dispatch_queue.json,
      every task card, every handoff, the opening decision DEC-20260907-52f2a0,
      the snapshot receipt, and the commit messages of 176b7d93e, c94a71b47,
      58d256293 and the lane-open commit b9be2983d. All clean. The commit
      messages in particular describe WHAT was archived and say nothing about
      what it shows -- which matters most of all, because a commit message
      cannot be repaired afterwards. Contract facts that are stated (the
      a-grid, T, T_sel, W, seed counts, task budgets) are inputs a re-deriver
      reads from the contract anyway and are correctly not treated as leaks.
    - >-
      ALL FOUR OF CR-1'S BINDING CONDITIONS PASS ON SUBSTANCE. COND-1: the
      second arm cites the frozen table and leaves every N = 2^24 field
      byte-identical. COND-2: success_criterion S1/S2/S3 and metrics.primary
      are byte-identical to the approved v2 (programmatic comparison, not a
      visual read), approved-S3 still means DISAGREEMENT, and the fresh label
      SU collides with no approved outcome label; the stated S3-over-SU
      precedence rule is COHERENT, tested against the case where it could fail
      -- both readings individually interval-routed AND disagreeing -- which it
      resolves to S3, the right ordering, since a disagreement between readings
      is a stronger finding than either reading's inconclusiveness and routing
      it to SU would let a real disagreement be reported as a shrug. COND-3:
      control (e) is byte-identical and untouched, appended control (g) quotes
      it in full and argues a fortiori from its own stated rationale. COND-4:
      all eight v1 blind_rederivation fields plus v2's own appended sub-key are
      byte-identical, two new sub-keys are appended, `blind_from` is not edited,
      and AO-3's "name ONE authoritative blind list" is satisfied by making the
      allowlist authoritative and demoting every denylist to corroborating --
      which resolves AO-3 without the edit COND-4 forbids. The additivity
      hashes were recomputed here and all three match: v1
      dfd4047f..., v2 a989f8c2..., v1_to_v2 7406c29f...; `git diff HEAD` on the
      approved paths is empty.
    - >-
      EVERY ONE OF THE FIFTEEN CONTROL LABELS IS CORRECT, RE-DERIVED RATHER
      THAN ACCEPTED. This gate constructed a failing world on a correct
      implementation for each of the eleven items v3 calls controls, and
      refused to construct one for each of the four sub-items it calls
      structural self-checks -- agreeing with v3 in every case. It found NO
      item labelled a control that cannot fail, and NO diagnostic whose result
      leaks into a verdict through any criterion, invalidation rule or
      interpretation clause. Two items were examined especially, as the gate
      contract directed. Control (i) NULL-ORACLE-RAND uniform: the structural
      argument for its negativity is SOUND AS AN EXPECTATION and is correctly
      characterised by the contract as structural rather than arithmetic --
      nothing forces a uniform draw's coverage below the weight-selected
      table's at every cell, since the gap depends on the basin-size tail,
      which is empirical; that is exactly what makes (i) a control, and because
      it is shape-matched to the real measurement, failing it indicts the real
      measurement, which is the property D7 asked for. Control (l) DECAY-A:
      the external anchor EXISTS and says substantially what is claimed --
      ledger/evidence/EV-ECDLP-60e266.yaml records a = 1/4 G3-infeasibility on
      exactly enumerated basins with a red-team disjointness derivation note at
      lines 145-164 -- so clause (iii) is genuinely external and not
      self-referential.
    - >-
      WHY NOT APPROVE, FIRST REASON: CF-1 IS OPERATIVE, NOT EDITORIAL.
      `required_artifacts` (specification.v3.yaml line 1754) demands, per cell,
      "for every declared control (a)-(o) ... FIRED or NOT FIRED", and converts
      an absent entry into NOT RUN. But the same contract declares six of those
      fifteen items to have no firing condition in that sense: (c) and
      (o1)-(o3) are structural self-checks that "cannot fail" on a correct
      implementation, and (j) and (n) are diagnostics "explicitly fenced off
      from every verdict". An executor therefore has no correct action for six
      of fifteen items: reporting NOT FIRED asserts a firing status for items
      that gate nothing and pulls the two fenced diagnostics into the control
      report -- the one surface through which a fenced diagnostic can begin
      reading as a control -- while omitting them converts the absence into a
      recorded NOT RUN against items that were never runnable in that sense.
      This binds execution rather than describing it, which is why it blocks.
    - >-
      WHY NOT APPROVE, SECOND REASON: THE CONTRACT'S TWO NORMATIVE DOCUMENTS
      DISAGREE ON THE IDENTITY OF ITS CONTROLS, IN THREE INDEPENDENT WAYS. (1)
      LO-1, the author's self-reported defect: the amendment's falsifiability
      table (v2_to_v3.yaml lines 802-857) enumerates fourteen items and omits
      the specification's (j) size-biased diagnostic, so from that point its
      letters run one behind -- its (l) is DECAY-TSEL where the specification's
      (l) is DECAY-A -- and its summary (lines 858-866) counts fifteen items
      over a table of fourteen and says one diagnostic where the specification
      says two. (2) CF-5: the specification's own
      `controls_falsifiability_summary` (lines 1378-1385), which labels itself
      "REQUIRED READING FOR THE GATE", opens "Of the fifteen declared items"
      and then partitions them 11 + 3 + 2 = 16; the self-check term is two by
      top-level letter and four by sub-item, and three under neither reading.
      (3) CF-1's range, above, treats all fifteen with one semantics. A
      reviewer asked to confirm that "control (l) fired" cannot resolve the
      reference without knowing which of the contract's two documents the
      writer had open -- and the ambiguity lands on the item v3 itself
      designates as carrying most of the artifact-detection load.
    - >-
      THE RULING ON THE AUTHOR'S SELF-REPORTED DEFECT (LO-1), AND WHY. The
      author declined to fix it because the files are snapshot-archived with
      bound hashes. THAT GROUND DOES NOT HOLD, because it conflates two
      different immutabilities. The completed archive IS immutable and this
      gate would refuse any proposal to rewrite TASK-20260907-6077f2's commit
      or receipt. But the v3 documents are NOT YET APPROVED -- they read
      `approved_by: null`, they are not execution-authorized, and no run exists
      under them. A superseding revision at a NEW snapshot leaves the archived
      bytes and hashes exactly as they are, which is the ordinary correction
      path this program uses for every immutable record. THE OPPOSITE RULING IS
      GENUINELY DEFENSIBLE and is recorded rather than dismissed: none of the
      cross-reference defects changes a formula, threshold, definition or
      control substance, and a reader who works through both documents recovers
      the correct reading every time. This gate weighed that and rejected it
      for three reasons. First, LO-1 IS NOT ISOLATED -- had it been the only
      slip, a recorded remedy would have been accepted; it is instead one of
      six independent cross-reference defects in the same two documents (LO-1,
      XR-1, XR-2, XR-3, CF-5, and a stale source line citation), and six is a
      systematic failure of the reconciliation pass, which waiving them one at
      a time approves incrementally. Second, THE DISAGREEMENT IS ABOUT THE
      CONTROLS, which are the batch's entire defence against believing an
      artifact (docs/inventor-protocol.md, "controls before belief"). Third,
      THE COST OF REPAIR IS AT ITS MINIMUM NOW AND RISES MONOTONICALLY: one
      superseding snapshot before approval; an amendment to an approved
      contract after it; and after execution, an amendment to a contract that
      runs already depend on, with `invalidation_rules` item 7 forbidding
      re-scoring what has executed. The recovery the opposite ruling relies on
      requires a reader to work through both documents in full and notice the
      disagreement, and the first reader who did so is this gate, at the last
      checkpoint before execution.
    - >-
      TWO FURTHER BLOCKING FINDINGS, BOTH IN v3-APPENDED TEXT AND BOTH CHEAP TO
      FIX. CF-2, SCOPE HONESTY: v3 calls the external anchor "EV-ECDLP-60e266's
      independently established a = 1/4 G3-infeasibility" (line 1298; similarly
      "ESTABLISHED" at line 1030), while that evidence record carries
      `strength: preliminary` (line 87) and its own `strength_note` states it
      rests on one execution batch and that NO INDEPENDENT IMPLEMENTATION
      EXISTS -- the word "independently" asserts of the anchor the exact
      property its record says it lacks, in the one clause v3 designates as
      carrying most of the detection load. CF-4, CALIBRATION: DECAY-A clause
      (i) (lines 1287-1289) requires the mean margin to be strictly decreasing
      across four a-values with "A SINGLE non-monotone step" firing it, and
      firing it triggers F6 (lines 1737-1741), which falsifies "the batch's
      claim to be measuring stored-advice efficiency at all". No tolerance,
      interval or minimum step is stated -- while clause (ii), the paired
      differences reported WITH intervals and the one construct that could
      bound the false-positive rate, is declared CONTEXT ONLY and to bind
      nothing. Two neighbouring means of 25 finite samples can invert on a
      correct implementation, so the batch's most severe self-falsification
      hangs on a zero-tolerance point comparison while the calibration
      machinery sits declared non-binding beside it. The clause is falsifiable
      -- that is not in question, and a control too easy to fire is a different
      defect from one that cannot fire -- but its power is undeclared, which
      inverts the contract's own careful practice everywhere else.
    - >-
      WHY NOT REJECT. Rejection would misdescribe the state of the work.
      Every blocking defect the predecessor gate raised is genuinely and well
      discharged; the D2 repair is a correct three-term identity verified
      against code AND recomputed on committed data, and the D3 repair changes
      the MECHANISM rather than lengthening a list. Every remaining defect sits
      in v3-appended text or in the amendment, and every one is repairable
      without touching a frozen field, an approved record, or a
      snapshot-archived byte. That is a revision.
    - >-
      ON SCOPE (J7). The wide scope is justified and the smaller change --
      dropping the N = 2^20 arm, which DEC-20260907-4e34c5 offered as a
      complete discharge of D1 -- is NOT preferable, though it was taken
      seriously. The second scale is not decoration: N-dependence of the
      feasibility boundary is a live possibility v3's own `interpretation`
      addresses, and a single-scale batch cannot see it. D1 is now discharged
      by stating the frozen value rather than by avoiding the question, leaving
      the program a cross-checked second scale instead of a deferred one. The
      marginal cost is bounded and disclosed: N = 2^20 needs 16x less memory
      than the binding scale and the control arms read off the same basin
      partition as the primary arms.
    - >-
      ON CT-2. Verified: no committed N = 2^20 cell exists for
      EXP-ECDLP-6ac801, so control (h) genuinely cannot be anchored there and
      DEC-20260907-52f2a0's CT-2 is correct to place the reproduction anchor at
      N = 2^24. But the resulting gap is NARROWER than v3 declares, and v3
      mischaracterises it in both directions at once. Ten of the eleven
      controls apply at N = 2^20; the one that does not is (h). Meanwhile v3
      states "AT N = 2^20 THERE IS NO REFERENCE" (lines 1216-1217) while
      imposing at that scale an externally anchored clause -- DECAY-A clause
      (iii), required "at each N separately" -- whose anchor record,
      EV-ECDLP-60e266, itself carries five N = 2^20 seeds on the pinned
      instrument EXP-ECDLP-612fb1 (lines 150-155) running in the same direction
      as its N = 2^24 seeds. So the arm is ADEQUATELY CONTROLLED for what it is
      asked to do and is not entering with a gap that would block approval;
      what must be corrected is the characterisation, which simultaneously
      overstates the reference vacuum and understates an anchor the contract
      already relies on.
    - >-
      ON THE GATE-FIELD SEPARATION, RECORDED BECAUSE THE TASK ASKED FOR A
      JUDGEMENT ON IT. This gate does NOT judge the separation wrong. Its cost
      -- that an approving decision would coexist with files reading
      `approved_by: null` -- would have been real, and is disclosed in the
      queue's own `gate_field_note`. That cost does not arise here, because
      this decision is `revise`: the v3 documents SHOULD read
      `approved_by: null`, and they do. The separation is what let a fresh
      session rule on documents it did not own without acquiring write access
      to them, which is the property that makes the gate independent in fact
      and not merely by assertion.

