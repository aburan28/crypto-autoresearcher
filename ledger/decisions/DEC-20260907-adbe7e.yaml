    packet at
    experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/.
    WHY A SEPARATE SESSION: a Coordinator does not approve its own amendment
    (AGENTS.md "Roles"; agents/coordinator.md). This session authored none of
    the artifacts above and did not participate in the session that did. Its
    entire contribution to the repository is this decision and the two task
