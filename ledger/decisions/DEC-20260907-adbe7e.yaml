      RANK 2. What the revision must NOT reopen, recorded so effort is not
      spent where none is owed: the cap convention (verified identical), the
      three-term accounting identity (verified true, disjoint, exhaustive and
      exactly integer), the allowlist mechanism (sufficient, leak-free,
      self-detectable, zero hash mismatches), the scope (the second scale is
      justified), and every block CR-1 pins byte-identical. A revision that
      re-derived any of these would be re-doing checked work.
    - >-
      RANK 3. A fresh independent gate re-runs on the superseding revision.
      Because the mathematics is already checked, that gate's scope is
      narrower: confirm the ten remedies landed, confirm the two normative
      documents now agree letter for letter on the identity and count of the
      controls, and confirm the revision touched nothing frozen. It must not
      be this session and must not be the author.
    - >-
      RANK 4. NO RUN MAY BE EXECUTED UNDER v3. specification.v3.yaml remains
      UNAPPROVED and NOT execution-authorized; per its own
      `invalidation_rules`, execution while status is not approved makes no run
      evidence. The approved v2 is unaffected by this decision and retains
      whatever authority it already had.
    - >-
      RANK 5, OUTSIDE THIS CONTRACT AND ADDRESSED TO THE PROGRAM (finding
      CF-3). THE APPROVED v2, WHICH IS EXECUTION-AUTHORIZED TODAY, CONTRADICTS
      ITSELF ABOUT THE a = 1/4 ANCHOR. Its control (b) (line 537) says
      "G3 FAIL 10/10 seeds, EV-ECDLP-60e266", attributing all ten seeds to
      N = 2^24, while its own metrics.primary (line 584) says "5/5 FAIL at
      2^24". EV-ECDLP-60e266 lines 150-155 settle it: the ten seeds span TWO
      SCALES -- five at N = 2^24 (RUN-013..017) and five at N = 2^20
      (RUN-001..005), both on EXP-ECDLP-612fb1. metrics.primary is right and
      control (b) is not. An executor running under the approved v2 today reads
      control (b) as a ten-seed N = 2^24 anchor, overstating the reproduction
      control's external support twofold in seed count while silently
      attributing N = 2^20 seeds to N = 2^24. v3 IS NOT AT FAULT: both blocks
      are reproduced byte-identically under CR-1's conditions, which forbid
      editing them, so reproducing the contradiction faithfully was the correct
      behaviour. THE REMEDY IS A SUPERSEDING RECORD AGAINST THE APPROVED v2,
      raised by the lane that owns it (BATCH-8f3e86). This gate NAMES it and
      deliberately does not perform it: the v2 files are another lane's
      approved, frozen records and are outside this task's write scope.
    - >-
      RANK 6. Carry finding CF-2 forward as a standing check rather than a
      one-off edit: whenever a contract in this lineage leans on
      EV-ECDLP-60e266, it must carry that record's own `strength: preliminary`
      and the reason for it (one execution batch, no independent
      implementation). The anchor is real and useful; describing it as
      "independently established" is the kind of small strength inflation that
      is invisible in one document and load-bearing across five.

