  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT THE ECDLP. It rules on whether a
      document is fit to be frozen. It reviews no evidence, changes no
      hypothesis status, changes no goal status, and produces no measurement.
      No conclusion about G3 feasibility at any a, at either scale, follows
      from it.
    - >-
      WHAT WAS RECOMPUTED VERSUS WHAT WAS READ, stated so a later reader can
      calibrate. RECOMPUTED BY THIS GATE: W and cap at all eight (N, a) cells
      from the stated formulas; the accounting identity
      sum_d b(d) + residual = N at all 20 committed cells of
      RUN-ECDLP-6ac801-001..005, with residual non-negativity and min basin
      size at least 1; the sha256 of the four additivity records and of every
      file on the packet allowlist; byte-identity of every block CR-1 pins;
      the eleven controls' failing worlds and the four self-checks' refusals.
      READ, NOT RECOMPUTED: the split of the residual into cycle_mass and
      capped_mass (verified from code structure -- the v1 runs do not record
      the components separately, so it could not be checked empirically); the
      contents of EV-ECDLP-60e266 (read as a committed record of another
      batch, never re-scored); the packet's SUFFICIENCY, which is this gate's
      judgement from reading deliverables.md against the allowlist and is not
      demonstrated until a re-deriver actually completes without reaching
      outside the packet.
    - >-
      THE RESOLVED MODEL IS NOT PROBE-VERIFIED. Requested policy
      coordinator-orchestration-code; the model that answered is recorded in
      approval_review.yaml `independence_attestation` beside it. No downgrade
      was accepted and no fallback was used, but
      `orchestration.adapter doctor --probe` was not run -- it is a network
      call outside the zero-compute budget (maximum_runs 0) -- so the
      identifier is unverified configuration in the sense of AGENTS.md "Model
      policy" rather than probe-confirmed.
    - >-
      A BLINDNESS DEVIATION IS RECORDED RATHER THAN ABSORBED. One line of the
      sealed prior was displayed incidentally, before the deliberate read, as a
      hit in a repository-wide grep sweeping for stale T values; the prior path
      was not excluded from the recursive command. The D1 finding had already
      been reached and written from the frozen T table before that sweep ran,
      so nothing already written was changed by it. Full disclosure, including
      the remedy for the next gate, is in approval_review.yaml
      `sealed_prior_attestation.procedure_deviations` (PD-G1). AGENTS.md
      "Review architecture" requires departures from a declared review
      procedure to be recorded; a blindness constraint silently deviated from
      is worth less than one never declared, because it still reads as
      rigorous.
    - >-
      THE SEALED PRIOR WAS OPENED ONLY AFTER THIS GATE'S FINDINGS, DEFECT LIST
      AND VERDICT WERE WRITTEN TO DISK IN FULL, as the task card's binding
      read-scope exception requires. The prior comparison is recorded in
      approval_review.yaml and appended after those findings; it changed none
      of them.
    - >-
      THE GATE COULD NOT SET GATE FIELDS ON THE v3 DOCUMENTS, by construction:
      the dispatch queue gives each path one owning task and the author owns
      those. This does not bite for a `revise` verdict, since the documents
      should and do read `approved_by: null`.
    - >-
      SUFFICIENCY AND LEAK-FREEDOM OF THE PACKET WERE JUDGED FROM THE COMMITTED
      BYTES BY ONE READER. A second, adversarial pass over the packet by a role
      that did not perform this gate would strengthen the finding; none was
      dispatched, and none is claimed.
    - >-
      NO ATTESTATION, REVIEW VERDICT OR AGREEMENT FROM ANY OTHER AGENT IS
      RECORDED HERE, because none was obtained. This is one independent
      session's judgement on a document.

