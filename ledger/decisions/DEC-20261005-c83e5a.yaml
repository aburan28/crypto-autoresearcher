    card_field_value_unchanged: "archived_by: TASK-20261002-af3c9f"
    card_field_reading: >-
      Historically accurate for the card FILE, because af3c9f staged and
      hash-bound ledger/handoffs/TASK-20261002-530540.yaml. Defective as the
      owner of the card's OUTPUTS, because af3c9f declares none of them and is
      already complete. The card is immutable and is not edited (AGENTS.md
      "Never edit a card to make a past dispatch look compliant").
    run_output_owner: TASK-20261005-71d2b9
    owned_paths:
      - experiments/EXP-SEMBIN-35bf67/implementation/
      - experiments/EXP-SEMBIN-35bf67/runs/
      - experiments/EXP-SEMBIN-35bf67/stage0/
      - experiments/EXP-SEMBIN-35bf67/stage1/
      - experiments/EXP-SEMBIN-35bf67/stage2/
      - experiments/EXP-SEMBIN-35bf67/stage3/
