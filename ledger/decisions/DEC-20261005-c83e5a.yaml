    why_a_second_card: >-
      The binding must be committed before the executor writes anything
      (AGENTS.md standing precondition 1). If the run-snapshot card itself
      committed this decision, the binding would sit uncommitted for the whole
      run, which is R5's defect again. So TASK-20261005-e40f6c, a small ledger
      archive, commits this decision, both new cards and a goal checkpoint
      shard BEFORE dispatch. TASK-20261005-71d2b9 commits the run AFTER.
    effective_when: TASK-20261005-e40f6c's receipt verifies.

  # ---------------------------------------------------------------------------
  # B2. Dispatch-precondition audit of TASK-20261002-530540
  # ---------------------------------------------------------------------------
  dispatch_precondition_audit:
    - id: P1
      precondition: archived_by bound before dispatch (AGENTS.md standing precondition 1)
      status: owed
      finding: >-
        Bound by B1 to TASK-20261005-71d2b9. Holds only once
        TASK-20261005-e40f6c's receipt verifies and the branch is pushed.
    - id: P2a
      precondition: design-packet archive receipt (af3c9f)
      status: holds_on_presence
      finding: >-
        The receipt is present and is content_at_commit, with path_sha256 for
        the specification (2ae7ee16...b6565ac), the card (f7e4c7d0...42bdca),
        DEC-20261002-99c798, H-SEMBIN-d895d9 and IDEA-20260913-9ba7fc. Not
        recomputed here (no shell). The sha256 recomputation of those five
        paths on origin/main is owed on TASK-20261005-e40f6c (report-only).
    - id: P2b
      precondition: ledger archive of DEC-20261005-b7e3a9 (TASK-20261005-4c1f86)
      status: owed
      finding: >-
        coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261005-4c1f86/ledger-receipt.yaml
        is ABSENT from this working tree, and no other path carries a 4c1f86
        receipt. b7e3a9's header says it is not effective until that receipt
        verifies. This decision does not depend on b7e3a9 being effective. It
        cites R5 as a diagnosis, and the defect stands on the cards
        themselves. The ranking that puts 35bf67 first does depend on it.
        Owed: the dispatcher determines whether 4c1f86 committed without its
        receipt, or has not run, and records which in the e40f6c receipt.
        Run 4c1f86 (alone) first if it has not run.
    - id: P3
      precondition: declared inputs committed and pushed (standing precondition 2)
      status: holds_on_report
      finding: >-
        All 16 inputs of TASK-20261002-530540 exist in this working tree,
        which the dispatching session reports equals origin/main 8d699f64ed.
        Owed: `git ls-tree -r --name-only origin/main` on those 16 paths,
        recorded in the e40f6c receipt.
    - id: P4
      precondition: lane available within max_concurrent (standing precondition 3)
      status: holds_on_tree_owed_across_refs
      finding: >-
        GOAL-SEMBIN-5078bc campaign_budget.max_concurrent is 2. Every claim
        file under batches/BATCH-9d649f/claims/ and batches/BATCH-457504/claims/
        has a matching release. The only lane file
        (lanes/BATCH-457504) is closed. So no live lane or claim is visible on
        this tree. 35bf67 takes lane 1. The second lane is reserved for
        EXP-SEMBIN-79a02d (b7e3a9 R1 rank 2), which is not dispatchable until
        its own run-snapshot card exists. MECHANISM GAP: TASK-20261002-530540
        is in no dispatch queue (BATCH-9d649f's queue does not list it), and
        `tools/goal_lanes.py claim` requires a queue. Owed at dispatch:
        `git fetch`, then `python3 tools/goal_lanes.py lanes
        GOAL-SEMBIN-5078bc` across refs. Proceed only if it shows fewer than 2
        live lanes or claims and none holding 530540. Record the output in
        the e40f6c receipt, and post one agent_bus message to role
        coordinator naming TASK-20261002-530540 as dispatched, with refs to
        this decision. This follows the TASK-20261004-342564 precedent of
        recording why no claim file was taken.
    - id: P5
      precondition: blindness
      status: owed
      finding: >-
        The card declares no blindness and the specification has no
        blind_from. But RUN-SEMBIN-5ed13e (EXP-SEMBIN-7e1371, approved under
        H-SEMBIN-2d7708) is on main. It holds degree-4 closure verdicts for
        the m = t = 2 window n = 40..45, which includes 35bf67's decisive cells
