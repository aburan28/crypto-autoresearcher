        before the Stage-0 freeze contaminates the preregistration. It would
        also turn a potential independent replication at overlapping cells
        into a dependent one. Remedy in B4 N1, carried by the dispatcher.
    - id: P6
      precondition: write_scope collisions
      status: holds_on_tree
      finding: >-
        No other handoff in ledger/handoffs names a path under
        experiments/EXP-SEMBIN-35bf67/. The sibling executor cards
        TASK-20261002-fc71d6 (79a02d) and TASK-20261002-e71399 (d0d73b) own
