  # ---------------------------------------------------------------------------
  # B3. Review plan: not required before dispatch; prior pre-registered now
  # ---------------------------------------------------------------------------
  review_plan: null
  review_plan_ruling: >-
    NOT REQUIRED BEFORE DISPATCH. The card's review_plan is null, and it opens
    no review round. The specification and hypothesis make no pre-dispatch
    review a prerequisite. The run's review IS claim-changing: it can move
    H-SEMBIN-d895d9 past running, and a passing Stage-1 gate is what
    IMP-SEMBIN-ENGINE's clears_when names. So a full review_plan is owed on
    the reviewer handoffs, after TASK-20261005-71d2b9 verifies and before any
    reviewer runs. Owners are assigned there. To make that plan's prior
    pre-committed in the strong sense (before any output exists, not merely
    before any report), the prior and joints are recorded now.
  review_preregistration:
    recorded_before_any_run_output: true
    recorded_without_reading: >-
      RUN-SEMBIN-5ed13e and RUN-SEMBIN-9bb990 result files (closure verdicts,
      summary.json, NOTES). Only DEC-20261004-df2986's procedural text was
      read, by search.
    coordinator_prior: >-
      Subjective, recorded for pre-commitment only. It is not evidence and
      supports no decision. (a) Stage-1 engine gate (DREG anchors plus dual
      rank) passes: about 0.6. The main risk is an instrument built from
      scratch on a host with no Sage (src/h012c_block_m4ri.py imports
      sage.all), with the M4RI defect of B4 N2 as a shared failure mode.
      (b) Given a pass, the Semaev (40,2,2,20) baseline holds (failure rate
      below 0.02 on both arms): about 0.8. (c) Given that (45,2,2,23) is
      reached, O-KOSTERS-NOREPRO versus a SAT-arm failure above 0.10: about
      even. (d) Most likely single primary label: an instrument or censoring
      stop (O-ENGINE-FAIL, O-IMPEDIMENT or O-CENSORED, about 0.4 together),
      then O-SURFACE-K (about 0.2) and O-CEILING (about 0.15). Where I expect
      the review to bite hardest: whether the two GF(2) rank arms are
      genuinely independent, and whether s is computed without touching the
      rank pipeline.
    joints_to_be_owned:
      - id: J1
        joint: >-
          SOLV4 identity as implemented: dim R_4 = M_{<=4} - s with exact
          per-instance s, and degree-4 capped closure to a recorded fixpoint.
        worked_attack: >-
          Build the known-false objects in proves_too_much_proposed below, and
          check that the implementation returns NOT SOLV4 on each. Recompute
          M_{<=4} as the sum of C(N, i) for i <= 4 from N alone.
      - id: J2
        joint: >-
          Independence of the dual GF(2) rank arms, including the library
          (B4 N2).
        worked_attack: >-
          Read per-cell library and version provenance. Inject one known rank
          deficiency into a calibration matrix and confirm that both arms see
          it. Confirm that the arms share no elimination code and no M4RI
          0.0.20200125 build.
      - id: J3
        joint: s from V^t enumeration agrees with point arithmetic on E, and neither reads the rank pipeline.
        worked_attack: >-
          Import-graph check. Re-enumerate s on 5 seeds per decisive cell from
          the builder's instance files only.
      - id: J4
        joint: Stage-0 freeze precedes Stage-1 output, and the Stage-0 sources-read list honours B4 N1.
        worked_attack: >-
          Compare git and file timestamps of stage0/preregistered-predictions.json
          with the first stage1/ write. Read the sources-read list against
          N1.
      - id: J5
        joint: SAT/UNSAT never pooled, null arm present at every decisive cell, off-diagonal gate executed or named.
        worked_attack: >-
          Recount the per-arm denominators from the raw records and recompute
          one failure rate and its bootstrap CI.
      - id: J6
        joint: Single O-* label follows the frozen falsification_criterion mechanically from the census.
        worked_attack: >-
          Re-apply the specification's decision text to stage2/census.json and
          stage3 outputs without reading RESULTS.md prose first.
    proves_too_much_proposed:
      objects: >-
        Proposed, to be confirmed by the plan author's own counting argument
        before use. (i) Truncated instances: drop equations from a
        (30,2,2,15) instance until the exact s exceeds M_{<=4}. SOLV4 is then
        false by counting. (ii) Planted-inconsistent instances (s = 0). SOLV4
        must hold iff 1 lies in R_4, cross-checked by the second rank arm.
      failure_signature: >-
        Any SOLV4 = true on (i) is an implementation defect and voids every
        cell that the same code path certified.
    blind_rederivation_proposed:
      quantity: >-
        SOLV4 verdict, dim R_4 and exact s, for 3 seeds at (30,2,2,15) and 3
        at (40,2,2,20), with instances regenerated from the specification's
        definitions and frozen seeds.
      blind_from:
        - experiments/EXP-SEMBIN-35bf67/implementation/
        - experiments/EXP-SEMBIN-35bf67/runs/
        - experiments/EXP-SEMBIN-35bf67/stage1/
        - experiments/EXP-SEMBIN-35bf67/stage2/
        - experiments/EXP-SEMBIN-35bf67/stage3/
        - experiments/EXP-SEMBIN-35bf67/RESULTS.md
        - experiments/EXP-SEMBIN-7e1371/
    review_tier: >-
      review-adversarial (xhigh): one validator and one red-team, in
      independent sessions. ESCALATION TRIGGER (AGENTS.md rule 12): if the
      35bf67 verdicts contradict RUN-SEMBIN-5ed13e at a shared cell, AND
      5ed13e has by then been composed into validated evidence, the
      contradiction round runs at review-breakthrough (max). It is never
      degraded.
    concordance_note: >-
      Agreement or disagreement with RUN-SEMBIN-5ed13e at shared cells is
      composed by the Coordinator AFTER the joint reports return. It is not a
      joint, because no blinded reviewer should be asked to adjudicate two
      runs at once.

  # ---------------------------------------------------------------------------
  # B4. Pre-run notices (pointers for the executor; not protocol changes)
  # ---------------------------------------------------------------------------
  pre_run_notices:
    - id: N1
      subject: blindness to RUN-SEMBIN-5ed13e and RUN-SEMBIN-9bb990
      text: >-
        The dispatcher passes this to the executor as a pointer to this
        decision. Do not read experiments/EXP-SEMBIN-7e1371/runs/**, or the
        measured-value sections of DEC-20261004-df2986, before
        stage0/preregistered-predictions.json is frozen. Record a
        sources-read list in stage0/. Do not use EXP-SEMBIN-7e1371 code as
        either dual-rank arm. If it is used after the freeze anyway, declare
        that in RESULTS.md.
      status_in_protocol: >-
        NOT an invalidation rule. The frozen specification has none for this,
        and one would need a protocol_amendment. A breach is recorded at J4 as
        a deviation that downgrades the independence reading of any
        concordance with 5ed13e. It does not void the run.
    - id: N2
      subject: M4RI 0.0.20200125 defect
      text: >-
        DEC-20261004-df2986 records (from RUN-SEMBIN-9bb990 NOTES) that apt
        libm4ri 0.0.20200125 "returns eliminations outside the row space of
        their input at this scale". It records release-20240729 as fixed
        upstream. Coordinator reading of the EXISTING dual_gf2_rank control
        ("two independent GF(2) rank routines"): two arms that both link
        0.0.20200125 share a known defect and are not independent. Record the
        library name, version and build provenance per cell in each manifest.
      status_in_protocol: >-
        An interpretation of an existing control, stated before any run, with
        no criterion changed. If the executor reads the control differently,
        it reports back for a Coordinator protocol_amendment, and does not
        self-amend.
    - id: N3
      subject: reusable src/ needs Sage
      text: >-
        src/h012c_block_m4ri.py imports sage.all, and IMP-SEMBIN-ENGINE
        records that Sage is absent on this host. The read-only src/ files are
        references, not a runnable path. The specification's "implement or
        wrap" route under implementation/ is the expected one. Absence of a
        tool is O-IMPEDIMENT, never evidence.

  # ---------------------------------------------------------------------------
  # B5. The next executor act and how it is launched
  # ---------------------------------------------------------------------------
  launch_route:
    ruling: >-
      DISPATCH THE `executor` SUBAGENT UNDER TASK-20261002-530540, NOT /run.
      /run executes existing experiment programs and adds no implementation
      phase (CLAUDE.md "Public execution entry point"; AGENTS.md "Harness
      entry point"). No program exists for EXP-SEMBIN-35bf67. The card's
      objective is "Implement and execute", and DEC-20261002-99c798 sets
      implementation_authorized true. The top-level session launches it. A
      Coordinator subagent cannot launch it, and this one does not.
    subagent: executor
    policy: executor-implementation (effort medium per .claude/agents/executor.md; no fallback)
    launch_prompt_must_name:
      - ledger/handoffs/TASK-20261002-530540.yaml (the card, read in full)
      - ledger/decisions/DEC-20261005-c83e5a.yaml (archival owner TASK-20261005-71d2b9; notices N1 to N3)
      - experiments/EXP-SEMBIN-35bf67/specification.yaml
    launch_order:
      - TASK-20261005-4c1f86 status settled (P2b)
      - TASK-20261005-e40f6c committed, verified and pushed (P1, P3 to P6 recorded in its receipt)
      - lane check and bus message (P4)
      - executor subagent launched under TASK-20261002-530540
      - "on return, and after its write_scope is quiet for a checked interval (DEC-20260914-537000 PD-I): TASK-20261005-71d2b9, alone"
    later_runs_note: >-
      Once implementation/ exists, the executor runs its own stages under the
      same card. /run on EXP-SEMBIN-35bf67 becomes meaningful only for
      re-execution of an existing entry point, for example an
      executor-mechanical re-run. That would need its own card.

  rationale:
    - >-
      R5 is an evidence-integrity defect with a purely additive remedy. A new
      owner bound by a committed decision, cited by a new card, keeps the
      immutable executor card truthful about what was decided on 2026-10-02.
    - >-
      Committing the binding BEFORE dispatch, through a separate small ledger
      archive, is the only ordering that satisfies standing precondition 1.
      Folding the binding into the post-run snapshot would recreate the defect
      for the length of the run.
    - >-
      Blindness to RUN-SEMBIN-5ed13e is cheap to impose now and impossible to
      restore later. Kept blind, 35bf67 is a second, differently built
      instrument at the two cells that decide Assumption 1's n in [40,45]
      dispute. That is the strongest available check on both runs.
    - >-
      Pre-registering the prior before any output exists is strictly stronger
      than the minimum AGENTS.md requires (before any report), and costs
      nothing.

  evidence_refs:
    - ledger/handoffs/TASK-20261002-530540.yaml
    - ledger/handoffs/TASK-20261002-af3c9f.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/design/TASK-20261002-af3c9f/snapshot-receipt.json
    - experiments/EXP-SEMBIN-35bf67/specification.yaml
    - ledger/hypotheses/H-SEMBIN-d895d9.yaml
    - ledger/decisions/DEC-20261002-99c798.yaml
    - ledger/decisions/DEC-20261005-b7e3a9.yaml
    - ledger/decisions/DEC-20261004-df2986.yaml
    - ledger/handoffs/TASK-20261005-4c1f86.yaml
    - ledger/handoffs/TASK-20261003-582b6c.yaml
    - ledger/handoffs/TASK-20261003-934b84.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-342564/snapshot-receipt.yaml
    - ledger/goals/GOAL-SEMBIN-5078bc/goal.yaml
    - ledger/goals/GOAL-SEMBIN-5078bc/checkpoints/BATCH-9d649f-DEC-20261005-b7e3a9.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json
    - tools/goal_lanes.py
    - src/h012c_block_m4ri.py

  limitations:
    - >-
      No shell. No hash, git command, identifier check, validator or parse was
      run here. "Holds" in B2 means "holds on this working tree as read". Every
      cross-ref or origin/main fact is owed on TASK-20261005-e40f6c.
    - >-
      The M4RI defect is cited from DEC-20261004-df2986's account of an
      uncommitted NOTES file. This Coordinator did not read the NOTES. N2 is a
      pointer and a reading of an existing control. It is not a finding.
    - >-
      The prior in B3 is subjective and is recorded for pre-commitment only.
    - >-
      DEC-20261005-b7e3a9's ranking omits EXP-SEMBIN-7e1371 and
      RUN-SEMBIN-5ed13e. This decision does not re-rank. It flags the overlap
      for the next ranking pass (next_actions).

  procedure_deviations:
    - id: PD-1
      severity: minor
      what: >-
        Hand-chosen identifiers DEC-20261005-c83e5a, TASK-20261005-71d2b9 and
        TASK-20261005-e40f6c. The committed-state checks are stopping gates on
        TASK-20261005-e40f6c.
    - id: PD-2
      severity: minor
      what: >-
        The user asked for one archival card plus a decision. This decision
        adds a second card (the pre-dispatch ledger archive e40f6c) and a
