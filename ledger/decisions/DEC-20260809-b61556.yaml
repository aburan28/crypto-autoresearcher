coordinator_decision:
  id: DEC-20260809-b61556
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-ac2e6d
  context: >-
    The archived Arm-A design in BATCH-bd36fe passed the independent v10
    design-admissibility review. Its proposal records are not canonical ledger
    records, and the proposal research-question identifier is not registered.
    This decision materializes the exact proposal scope as a review package.
  decision: revise
  decision_scope: >-
    Admit RQ-ECDLP-165d4b as an active sub-question, H-ECDLP-1853dc as a
    specified hypothesis, and EXP-ECDLP-51921d as a review-required experiment
    contract. This is a specification and provenance transition only: the
    experiment remains unfrozen, unauthorized, and evidence-ineligible.
  target_ids:
    - RQ-ECDLP-165d4b
    - H-ECDLP-1853dc
    - EXP-ECDLP-51921d
    - BATCH-ac2e6d
  rationale:
    - The Arm-A design is the first executable successor because Arm B explicitly depends on it.
    - The official records preserve the proposal's ordinary-curve, toy-only, and matched-control boundary.
    - The current adapter preflight has no usable API backend; this is recorded as infrastructure and does not authorize a run.
    - An independent review must inspect these materialized bytes before any freeze, implementation, or execution authorization.
  evidence_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/reviews/TASK-20260809-f84bf3/freeze_review.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/archives/TASK-20260809-2bb910/snapshot-receipt.json
  limitations:
    - No implementation or experiment run exists in this package.
    - Native Codex may be used only as an explicitly recorded runtime exception; Bedrock is prohibited.
    - Any future positive result is capped at toy/medium finite-size evidence and cannot claim an exponent improvement.
  research_status_transition:
    question_id: RQ-ECDLP-165d4b
    prior_status: proposal_only
    new_status: active
    hypothesis_id: H-ECDLP-1853dc
    hypothesis_prior_status: proposal
    hypothesis_new_status: specified
    experiment_id: EXP-ECDLP-51921d
    experiment_new_status: review_required
    official_execution_authorized: false
  knowledge_promotion:
    promoted: []
    not_warranted: Specification materialization contains no empirical finding or durable literature claim.
  inventor_accounting:
    dominated_by: Pollard rho on the declared prime-field ECDLP scope
    sota_delta:
      generic_time_exponent: 0.0
      memory_exponent: 0.0
      data_query_improvement: 0
      cryptographic_security_bits_reduced: 0
  next_actions:
    - Snapshot-archive the exact materialized records and handoff.
    - Obtain independent review-adversarial review of the committed specification.
    - Freeze and authorize implementation only if that review passes and a Coordinator approval decision is recorded.
  decided_by: coordinator
  decided_at: '2026-08-09'
  inference_provenance:
    runtime: codex_desktop_native
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
