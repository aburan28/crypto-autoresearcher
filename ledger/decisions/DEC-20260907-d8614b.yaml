coordinator_decision:
  id: DEC-20260907-d8614b
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECRANK-002
  question_id: RQ-ECRANK-27dcc5
  batch_id: BATCH-523fe1
  decided_by: coordinator-ecrank-5
  decision: approve_protocol_amendment_v2
  target_ids:
  - EXP-ECRANK-73275e
  - H-ECRANK-36d8d7
  - TASK-20260906-601561
  context: >
    During BATCH-523fe1, before any run of EXP-ECRANK-73275e was executed,
    the executor scaffold (chunk 1 of the claimed task
    TASK-20260906-601561) measured that the v1 sample-size derivation for
    the audit's planted-meet stage is infeasible inside the frozen budget.
    The Coordinator independently re-derived the same measurement before
    deciding (exact mu-sum lattice counts and the committed-run op scale).
    The frozen v1 bytes are untouched; this decision approves the
    versioned additive amendment
    experiments/EXP-ECRANK-73275e/amendments/EXP-ECRANK-73275e-v2.yaml,
    which the v1 spec itself declares to be the only lawful path for a
    later protocol change.
  measured_infeasibility:
    support_of_committed_draw_stage: >
      The snapshot-bound draw stage (draw_rational at
      a20a49b6adbcce51893c1221dbd69cdcd486ad9d) draws sign uniformly from
      {+-1} and (num, den) uniformly from [1,H] x [1,H], reduced by gcd.
      Its per-coordinate image at height H is the set of reduced signed
      fractions with both parts <= H; the exact count is
      |L(H)| = 2 * sum_{d<=H} mu(d) floor(H/d)^2.
    exact_values:
      L_100: 12174
      L_1000: 1216766
      L_10000: 121589942
      S_100: 267403130392225254624   # |L(100)|^5
      v1_floor_N_a_at_H_100: 1337015651961126273120
    feasibility_bound: >
      The committed R3-armB run records 8,683,560 counted ops for 80,000
      draws. Even at a floor of 10 counted ops per redrow, the frozen
      1.0e8 per-run counted-op cap permits at most 1.0e7 redrows; the v1
      floor exceeds that by a factor of 1.3370157e14. The v1 meet stage
      cannot execute under any admissible counting convention.
    ruling_on_the_datum: >
      Per core rule 8 the infeasibility is a first-class recorded
      measurement of this experiment, not a defect to be hidden: it
      quantifies the draw-route full-tuple meet probability (exact
      per-plant lambda_full values pre-registered in the amendment,
      ~1e-16..1e-14 over the redraft scale) and joins the
      EV-ECRANK-8b35bb obstruction family.
  ruling: >
    (1) The amendment EXP-ECRANK-73275e-v2 is APPROVED as the binding
    protocol for runs R1 and R2 of EXP-ECRANK-73275e, together with the
    v1 frozen bytes (pin 43915617d0ffeeeef05413f1b22ad823796993774c7d89bf3dfd347a829f7554),
    which remain the binding protocol for R3-R8 unchanged. (2) The
    amendment's scientific content is accepted on these grounds: it
    replaces an infeasible sampling stage with an exactly equivalent
    decisive test of the SAME claim (M-A's support half, per the
    amendment's scope_statement: surjectivity of the product fixed-
    coordinate map, tested by the exact support derivation T2a plus the
    pre-registered per-coordinate controls T2b with plant totals
    Lambda >= 30 and P(0) <= 7.4e-14), keeps the in-box fraction P1
    intact over the full reconstruction and the redraft, keeps every
    invalidation rule, control, seed, and budget clause of v1 unchanged,
    and records the v1-floor infeasibility and the exact full-tuple
    meet probabilities as first-class measurements. (3) The resolved
    interpretations (AT-i = (stream i, b_index 0); the exact flat-grid
    meet-probability model (1/2)*floor(H/m)/H^2 replacing the v1
    uniform-over-reduced-lattice formula) are approved as the only
    readings under which R1/R2 are decidable, and are binding on the
    executor and the reviewers. (4) The executor task
    TASK-20260906-601561 reads v1 + v2 as its binding protocol; its
    handoff is unchanged and remains the authority for everything v2
    does not change. (5) Archival: this decision and the amendment are
    committed by the Coordinator before the first run of the experiment
    (see refs and the batch queue's amendments entry); the snapshot
    archive TASK-20260906-b0c01a binds the run package and this
    amendment's path in its receipt. (6) The review round under
    REVIEW-PLAN-BATCH-523fe1 proceeds with the declared addendum
    (review-plan-amendment-1.yaml): the red team's blind re-derivation
    covers the v2 pre-registered quantities, and the validity of the v2
    audit design is an explicit load-bearing joint item. (7) Standing
    authorizations are unchanged: the user standing authorization of
    2026-09-06 covers this protocol design act; no user re-confirmation
    is required, and this decision is reviewable and supersedeable as
    any coordinator record is. C1 remains OPEN with its candidate
    UNPROMOTED (IMP-2, review-breakthrough unservable); nothing in this
    decision touches the promotion bar.
  knowledge_promotion:
    promoted: []
    not_warranted: >
      No knowledge promotion. The infeasibility datum and the exact
      support counts become part of the experiment's evidence record
      (EV-ECRANK-591cba) when the execution ledger archive
      TASK-20260906-dfd0f0 composes the disposition; promotion, if
      warranted at all, happens there.
  refs:
  - experiments/EXP-ECRANK-73275e/specification.yaml
  - experiments/EXP-ECRANK-73275e/amendments/EXP-ECRANK-73275e-v2.yaml
  - ledger/handoffs/TASK-20260906-601561.yaml
  - ledger/hypotheses/H-ECRANK-36d8d7.yaml
  - ledger/decisions/DEC-20260906-37d020.yaml
  - ledger/evidence/EV-ECRANK-8b35bb.yaml
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-523fe1/review-plan-amendment-1.yaml
