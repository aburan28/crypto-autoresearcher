  limitations:
    - This zero-experiment design review does not observe campaign behavior.
    - No curve, point set, character matrix, independence certificate, torsion proof, or rank result was produced or validated.
    - Successful controls and path accounting establish only those narrow properties.
    - This decision does not reject the rank-greater-than-30 objective or close the direction; it requires an additive repair.
  next_actions:
    - >-
      After TASK-20260824-323e58 strictly archives this decision and
      composition, open a fresh additive successor specification chain under
      fresh allocated identifiers. It must define the complete u/t/m interface
      and exceptional recovery branches; prove implementation-equivalent
      positive/null evaluation; define model-change transport and immutable
      symbolic/Kummer/prime-ideal/valuation witness schemas and paths;
      reconcile the wall ceiling with 532800 seconds or reduce components;
      impose disjoint terminal precedence; and require B=I or a verified
      published-basis binding. Strictly snapshot and independently review it.
    - >-
      Keep TASK-20260824-e38d5e blocked. TASK-20260824-4d1f2a,
      TASK-20260824-b97619, and TASK-20260824-01f96c remain ineligible.
