coordinator_decision:
  id: DEC-20260824-19b5fb
  context: >-
    Composition of the preregistered independent design review of the
    strict-archived TASK-20260824-793ed0 repair specification. The only
    decision permitted here is whether to authorize bounded
    zero-campaign-input tooling. The independent Reviewer returned canonical
    verdict breaks on every load-bearing joint, so the preregistered rule
    requires revision.
  decision: revise
  semantic_disposition: REVISE_REQUIRED
  target_ids:
    - GOAL-ECQ-bef741
    - TASK-20260824-793ed0
    - TASK-20260824-6d9168
    - TASK-20260824-e38d5e
  rationale:
    - >-
      J-NULL breaks. The additive perturbation algebra, base preservation,
      selector behavior, and signature destruction hold, but the exact u/t/m
      interface and recovery branches are undefined for a-m^2=0, further
      degeneration, a double root, a t=0 base factor, and infinity. Positive
      and null evaluation are not implementation-equivalent.
    - >-
      J-CHAR breaks. On a fixed model alpha=D(N-D theta) and the valuation
      character are sound, but admissible model-change transport is undefined.
      Immutable artifact paths and schemas are missing for the symbolic
      identity, raw Kummer value, prime-ideal witness, and valuation witness.
    - >-
      J-RUNNER breaks. Frozen wall-clock components sum to
      14400+61200+3600+4*93600+64800+14400=532800 seconds, exceeding the
      frozen 526680-second ceiling by 6120. Terminal precedence is ambiguous
      because external_incident overlaps uncaught_exception and invalid_input
      overlaps implementation_error.
    - >-
      J-CERT breaks. Any two full-row-rank 31-by-m matrices are related by some
      right GL_m(F2) action, so an unbound nonidentity B proves only rank
      agreement. Require B=I for identical characters or bind every B column
      to a verified combination of a published character basis.
    - >-
      The blind accounting rederivation holds: 102 run identities times six
      files gives 612 unique artifact paths, with zero retry, replacement, or
      additional attempt identity. This does not cure the four blockers.
    - >-
      Both proves-too-much controls reject correctly: P31=P1+P2 gives
      row31=row1+row2 and rank at most 30; P31=2P1 gives row31=0 and rank at
      most 30. These controls do not discharge the undefined interfaces,
      transport, budget inconsistency, precedence, or matrix witness.
    - >-
      The independence checker passes with one independent report, complete
      ownership and attestation, respected blindness, declared controls, and
      no procedure deviations. Independence supports the breaks verdict.
