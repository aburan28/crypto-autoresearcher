coordinator_decision:
  id: DEC-20260913-8d19e5
  decided_by: coordinator
  decided_at: '2026-09-13'
  decision: expand
  context: >-
    GOAL-SEMBIN-fcb7a2 / BATCH-efea59 / TASK-20260913-0188bf. RQ-SEMBIN-9e8f82
    audits Nagao ePrint 2015/984, which claims ECDLP over F_{2^n} in O(n^{8w+1})
    -- polynomial -- under the first fall degree assumption. That paper is frozen
    and read (inputs/NAGAO-2015-984/, KN-LIT-71b758), and two of its load-bearing
    citations were pointers no agent in this program had opened:
    [11] = ePrint 2013/549, the sole published source of its Lemma 3 (the
    field-equation rewriting lemma, proof declined there: "Proof of this Lemma is
    complicated and not constructive") and of its Lemma 5; and
    [10] = ePrint 2013/548, which its Section 7 credits with the disjoint factor
    base while saying Galbraith-Gebregiyorgis ePrint 2014/806 "recently
    re-discovered" it. IDEA-20260913-352163's `unread_pointers` block names
    exactly these two and states plainly that nothing there bears weight. The
    top-level session froze both packages; this task read both in full and
    curated the result. This decision records what the two readings establish,
    what they do not, and what follows -- it performs no research-state
    transition on any hypothesis or experiment.
  target_ids:
    - RQ-SEMBIN-9e8f82
    - IDEA-20260913-352163
  deliberately_not_targeted:
    - id: H-SEMBIN-c59e50
      reason: >-
        Its novelty language is affected (see recommendations) but this decision
        changes nothing about it. The record is under active review by another
        session in this batch, and a status or field change is a separate
        committed decision by the top-level Coordinator. Naming it as a target
        would invite the reading that something moved.
    - id: EXP-SEMBIN-4fa22c
      reason: >-
        The Proposition-5 instrument is being designed concurrently and NO
        experiment record exists at that identifier in this tree (verified:
        experiments/EXP-SEMBIN-4fa22c is absent; the identifier appears only in
        coordination/bus/messages/MSG-20260913-67d64f.yaml). Its instrument
        assumption is addressed in the rationale and recommendations. Citing a
        record that does not exist as a decision target would be a dangling
        reference, not a decision.
  rationale:
    - >-
      SCOPE AND METHOD, STATED FIRST. This was a READING task by the Coordinator,
      not an independent adversarial review and not a verification of any proof.
      Both papers were read in full; the extraction of 2013/549 is poor (overset
      vector arrows emitted as standalone lines) so every statement quoted in the
      knowledge records was re-read in the PDF. Hashes for both packages were
      recomputed and agree with the .sha256 sidecars AND with provenance.json --
      no recompute-and-differ. Page anchors are PDF pages of the frozen files,
      counted with pdfminer.
    - >-
      A FACTUAL CORRECTION TO BOTH FREEZE RECEIPTS, recorded and not repaired.
      Both provenance.json files record `"pages": 2`. The frozen PDFs have NINE
      pages (2013/549) and SIX pages (2013/548); the extractions are 30,634 and
      18,123 bytes. Two independent packages carrying the same wrong value points
      at a systematic defect in whatever wrote the field rather than a typo. The
      receipts are immutable and were NOT edited; the discrepancy is recorded in
      each new source_record.yaml under
      `provenance.recorded_page_count_disagrees_with_pdf`. The hashes in the same
      files are correct. This also corrects the task brief, which inherited "2
      pages each" from those receipts.
    - >-
      QUESTION 1, LEMMA 3 -- THE STATEMENT IS THERE AND IT IS PROVED. 2015/984's
      Lemma 3 is 2013/549's LEMMA 2, page 4, modulo renaming (its G/D are
      2015/984's f/deg F): "Let G_1, ..., G_N in F_p[X_1, .., X_N] be local
      polynomials and put F := sum G_i . (X_i^p - X_i) and D := deg F. So, there
      are some local polynomials G'_1, ..., G'_N satisfying F := sum_{i=1}^N G'_i
      . (X_i^p - X_i) and deg G'_i <= D - p (i = 1, ..., N)." The proof occupies
      pages 4-5 and is a descent on the leading monomial: fix a degree-compatible
      monomial order, let psi(G) be the largest LM(G_i X_i^p) over the
      representing tuples and NUM(G) the number of indices attaining it; if
      NUM(G) = 1 the bound is immediate from deg psi(G) = D, and if NUM(G) > 1
      with deg psi(G) > D an explicit G^new with psi(G^new) < psi(G) is
      constructed, the lemma following by induction on psi(G) (well-founded,
      monomial orders being well-orders). SAID PLAINLY: 2013/549 does prove the
      statement 2015/984 attributes to it.
    - >-
      QUESTION 1, THE DIRECTION THAT MATTERS -- 2013/549 DOES NOT CONTAIN IT.
      Every inequality in 2013/549 bearing on this points one way and none of
      them is d_F <= d'_F: Lemma 2 bounds the rewritten COEFFICIENTS from above
      (deg G'_i <= D - p; at p = 2, D - 2); Proposition 1 (page 7) bounds the
      first fall degree from above by (p-1)d.alpha + 1; Lemma 1 (page 3) bounds
      the Groebner cost from above by O(N^{D_ff.C+O(1)}). The inequality d_F <=
      d'_F cannot appear there, because 2013/549 predates the true/fake
      distinction and works with ONE notion -- its Definition 1 (page 3,
      Petit-style, no field-equation reduction). The true/fake split is 2015/984's
      Definitions 5 and 6, and the inequality between them is 2015/984's LEMMA 4,
      which that paper states immediately after Lemma 3 with NO PROOF PRINTED. So
      the dependency chain is: 2013/549 Lemma 2 (proved) -> 2015/984 Lemma 3
      (borrowed) -> 2015/984 Lemma 4 d_F <= d'_F (asserted, unproved) -> the
      fake-degree substitution. The fake-degree substitution rests on 2013/549
      for the load-bearing INGREDIENT of the direction that matters -- converting
      "the excess vanishes mod S_fe" into "the excess is a degree-controlled
      combination of field equations" is exactly the step the inequality needs --
      and NOT for the assembled inequality, which exists only as a statement in
      the 2015 paper.
    - >-
      QUESTION 1, "COMPLICATED AND NOT CONSTRUCTIVE" -- RECONCILED, AND IT DOES
      NOT BITE ON THE INSTRUMENT. The proof in 2013/549 is a complete argument
      and constructive in the logical sense: the descent exhibits the rewritten
      tuple. The non-constructivity 2015/984 reports is a DIFFERENT and
      explicitly stated fact, from 2013/549's own remark on page 5 immediately
      after Lemma 2: "when deg f ~ exp(n^{1/3+O(1)}), computation of such G'_i is
      very difficult and its complexity (using direct computation) seems to be
      exponential of n, although computation of wd(f) is subexponential." That is
      about the COST OF PRODUCING THE WITNESSES, not about the existence proof.
      Anything needing only the bound -- which is what a Macaulay-rank instrument
      needs -- is unaffected.
    - >-
      QUESTION 1, TWO BLEMISHES IN THE PROOF, both notational and neither
      structural, recorded because a later reviewer will hit them. (i) The
      remaining case NUM(G) > 1 with deg psi(G) <= D is not spelled out; it is
      immediate (deg(G_i X_i^p) <= D for every i gives the bound directly) but the
      printed case analysis omits it. (ii) Step 1) of the construction is printed
      as "X_{I_1}^p | G_{I_i}", divisibility of the whole polynomial; only
      X_{I_1}^p | LT(G_{I_i}) follows from LM(G_{I_1}X_{I_1}^p) =
      LM(G_{I_i}X_{I_i}^p), and only that is used, so the printed claim is
      stronger than what holds AND stronger than what is needed. Relatedly the
      notation sentence prints LT as LM: "let LM(H) (resp. LM(H)) be the leading
      term (resp. leading monomial)".
    - >-
      QUESTION 2, THE REVISION NOTE -- WHAT THE REPAIR DOES. 2013/549 page 1
      carries TWO unintegrated notes, both already folded into the single frozen
      version. "Revise 6 NOV" states the failure outright -- "the solution of the
      equations system {[m_0 F]#_i = 0} u S_fe must equals to {[F]#_i = 0} u S_fe.
      However, it is not true" -- and repairs it by taking tau in F_{p^n} minus
      the base subspace and replacing the monomial multiplier m_0 = prod
      X_i^{p^alpha-1-E_i} with the POLYNOMIAL prod (X_i - tau)^{p^alpha-1-E_i}
      ("(not monomial but polynomial)"), asserting "we have this property and all
      lemmas still hold". Three findings. (a) The repair IS in the body: page 6
      defines m_0 := prod (X_i - tau)^{p^alpha-1-E_i} and Lemma 6 (page 6) is
      exactly the solution-set equality the monomial version lacked, so the frozen
      text is the repaired version and the note explains a change already made.
      (b) THE REPAIR DOES NOT TOUCH THE LEMMA 2015/984 CITES: Lemma 2 is in
      Section 2, is about the field-equation ideal alone, and mentions neither
      m_0, nor tau, nor Section 3. What the repair touches is Section 3's weight
      bookkeeping, where Lemmas 7-8 must now range over Mon(m_0) rather than a
      single monomial -- which, as printed on page 6, they do. (c) "All lemmas
      still hold" is the AUTHOR'S ASSERTION and was not verified by this task.
    - >-
      QUESTION 2, THE SECOND NOTE, AND A NUMBERING SCAR THAT TOUCHES LEMMA 5.
      "Revise 9/8": "Lemma 9 of the first version of this manuscript is false and
      I delete the content of §4 and related footnote", with the author adding
      that "this revise does not influence our theorems". The frozen text bears a
      matching scar: THERE IS NO LEMMA 10 ANYWHERE -- Lemma 9 (page 7) is followed
      directly by Lemma 11 (page 7). This matters for one specific reason:
      2015/984's LEMMA 5 is this paper's CURRENT Lemma 9 (page 7) -- "[m_1 .
      F_0]#_k = sum_{i=1}^n [w_i . m_1]#_k [F_0]#_i mod S_fe" -- the same NUMBER
      as the statement the author declares false in the first version. The current
      Lemma 9 is proved in two lines by bilinearity and there is no reason to
      doubt it. Whether the retracted first-version Lemma 9 is the SAME statement
      cannot be determined from the frozen bytes, because the first version is not
      frozen and ePrint serves only the latest PDF.
    - >-
      QUESTION 2, WHICH VERSION 2015/984 CITES -- A STRONG INFERENCE, NOT A FACT.
      The landing page records "2013-11-05: last of 2 revisions" and no later
      revision; the served last-modified (Tue, 05 Nov 2013) matches; 2015/984 was
      received 2015-10-12, nearly two years after. So the frozen bytes are the
      only version ePrint was serving when 2015/984 was written, and 2015/984's
      reference [11] gives only a bare URL with no version or date. That is an
      inference about what was AVAILABLE, not about which manuscript the author
      had in hand, and the frozen bytes cannot settle it further. An earlier
      revision is not frozen here and ePrint does not serve it.
    - >-
      QUESTION 3, WHAT IS IN 2013/548 -- THE CONSTRUCTION IS THERE, IN SECTION 7,
      PAGES 4-5. Fix a basis [w_1..w_n] of F_{p^n}/F_p and n_1 + ... + n_d ~ ng;
      put B'_i := {sum_j x_{i,j} w_j | x_{i,j} in F_p}; take r_1, ..., r_d in
      F_{p^n} and set B_i := {P - infinity in Jac(C/F_{p^n}) | P in C(F_{p^n}),
      exists x in B'_i such that x(P) = x + r_i}. FOOTNOTE 3, page 5, gives the
      disjointness recipe: "Take r_{i+1} in F_{p^n} \ union_{j=1}^i B'_j and
      disjoint decomposed factor is constracted." The yield accounting is stated
      in full on page 5: "Note that B_i's are essentially disjoint, |B_i| ~
      p^{n_i}, and the probability that the decomposition success is
      O(p^{n_1+...+n_d-ng}) ~ 1. From the disjointness, it is improved that the
      term of 1/d! in the probability is omitted. (Remark that it is needed to
      compute gaussian elimination of d-times size matrix in the last step.)"
      Both halves of the trade -- the removed 1/d! and the d-times larger linear
      algebra -- are present. This IS a coset-shifted, pairwise-disjoint family of
      factor bases with the factorial removal as its stated point.
    - >-
      QUESTION 3, IS IT THE ELLIPTIC CASE -- BY SPECIALISATION ONLY, AND THE PAPER
      NEVER SPECIALISES IT. Section 2 (page 1) fixes C a plane curve of small
      genus g; Section 7's construction is for Jac(C/F_{p^n}) and written with
      P - infinity throughout, which at g = 1 is the standard identification of an
      elliptic curve with its Jacobian. The words "elliptic curve" appear in
      Section 7 only in its ATTRIBUTION paragraph (Diem's log p = O(n^2) result;
      Matsuo's 120-bit binary elliptic experiment), never in the construction.
      Proposition 5's proof takes d = ng and n_1 = ... = n_d = 1, which at g = 1
      is d = n slots of one F_p-dimension each -- the same many-summands,
      constant-coset shape 2015/984 Section 7 uses at p = 2.
    - >-
      QUESTION 3, THE PAPER DOES NOT CLAIM THE CONSTRUCTION AS ITS OWN, AND SAYS
      SO TWICE. Section 7's opening paragraph (page 4) credits Diem [2] (2009,
      "Diem-variant") and then: "In 2005 or 2006, soon after the Semaev's formula
      is discoverd, Matsuo also found the simmilar and more general way of taking
      decomposed factor (for exapmle distinct or non-equal size decomposed
      factor). Matsuo tries to decompose an element of elliptic curve over around
      120-bit size binary field, but, huge memory workstation does not returns the
      reply and it it not presented and only the researchers around him knows
      this." Page 5 then states this paper's own contribution as a generalisation:
      "Here, we propose the way of taking decomposed factor of Jacobian of the
      curve, which is the generalization of Matsuo's decomposed factor." So on
      this source's own account the disjoint/coset factor base PREDATES it and is
      not Nagao's. The Matsuo attribution is to unpublished, unpresented work and
      is unverifiable from any artifact.
    - >-
      QUESTION 3, THE RETRACTION LANDS ELSEWHERE, AND THREE FURTHER DEFECTS. The
      page-1 note -- "However, Proposition 3 is not true and this thechnique can
      not be used. So, we re-write §4" -- hits the equation-system machinery, NOT
      Section 7: B_i = B'_i + r_i and the 1/d! counting argument do not use
      Proposition 3. It does degrade what Section 7 sits on top of ("however, the
      number of the equations is quite large", the author's own parenthesis).
      Three further defects in the frozen bytes: (i) a statement numbered
      Proposition 3 is STILL PRINTED, page 3 in Section 5, and whether it is the
      retracted statement, a renumbered survivor or a new statement cannot be
      determined without the first version; (ii) the proof of Proposition 5 --
      the paper's ONLY complexity claim -- cites "Proposition ??" TWICE, so the
      two propositions it depends on are not named anywhere in the paper; (iii)
      footnote 2, page 3: "We do not use homogenious polynomial system and
      projective variety. So, there is some gap. However, it seems to negligible
      and continue the discussion."
    - >-
      QUESTION 3, A SCOPE POINT THE PRIORITY QUESTION SHOULD NOT SWALLOW.
      2013/548's own DLP statement built on the coset family, Proposition 5 (page
      5), is restricted to "extension field F_{p^n} satisfying log p = O((ng)^2)"
      -- the LARGE-characteristic Diem regime -- whereas 2015/984's Theorem 1 is
      small-characteristic with F_{2^n} as its headline. The coset construction is
      shared between the two papers; the complexity conclusion drawn from it here
      is not the conclusion 2015/984 draws.
    - >-
      QUESTION 4, WHAT THE PAIR CHANGES FOR THE PROPOSITION-5 INSTRUMENT. Net:
      the instrument's footing is BETTER than the proposal disclosed, and its
      claimable outcomes are asymmetric. (a) The existence half of the Lemma 3
      dependency is discharged: the statement is proved at 2013/549 Lemma 2, page
      4. (b) The non-constructivity is about witness computation and the
      instrument computes no witnesses, so it does not bite. (c) The assembled
      inequality d_F <= d'_F remains resting on 2015/984's unproved Lemma 4. (d)
      CONSEQUENCE FOR CLAIMABLE OUTCOMES, which the contract should state
      explicitly: a measured d'_F > 4 REFUTES 2015/984's Proposition 5 regardless
      of Lemma 4, because Proposition 5 asserts an upper bound and a violated
      upper bound is violated; a measured d'_F <= 4 CONFIRMS Proposition 5 only
      through Lemma 4, which is unproved. The instrument is therefore a
      one-directional refuter until Lemma 4 is either proved or checked at the
      tested parameters, and any success criterion that treats the two directions
      symmetrically is overstating what a rank computation can deliver.
    - >-
      QUESTION 4, WHAT THE PAIR CHANGES FOR H-SEMBIN-c59e50's NOVELTY LANGUAGE.
      That record calls the m!-removing device "a PUBLISHED device:
      Galbraith-Gebregiyorgis 2014/806 section 4.2 coset-typed factor bases" and
      lists 2014/806 as "the published device that removes the m!". As an account
      of where this program READ the device that is accurate and properly
      provenanced (KN-LIT-439, verified under TASK-20260913-6519c9). As a PRIORITY
      statement it is too narrow: the construction and its 1/d! accounting are in
      the frozen 2013/548 bytes, and 2013/548 itself points further back to Diem
      (2009) and Matsuo (2005/2006, unpublished). What the reading does NOT do is
      trigger that record's own novelty-downgrade condition, which requires prior
      work that already composes a typed factor base with an auxiliary-variable
      presentation AND DERIVES THE DEGREE CONSEQUENCE: Section 7 composes the
      coset family with a Weil-descent system in the large-characteristic Diem
      regime and derives a degree bound of the form <= Const_1^d, deriving no
      first-fall-degree consequence and saying nothing about a chained
      presentation. So the indicated change is an ATTRIBUTION correction, not a
      novelty downgrade, and it is the top-level Coordinator's to make.
    - >-
      A SEPARATE TENSION IN THAT RECORD, WHICH THIS READING SHARPENS BUT DID NOT
      CREATE. H-SEMBIN-c59e50's mechanism block states "removal (i) has never been
      composed with a presentation whose solve is CLAIMED polynomial. Semaev's
      chain is the first such presentation and the composition is unexamined. That,
      and nothing else, is what is new here." On the face of 2015/984 -- ALREADY
      READ as KN-LIT-71b758, so this is not a new source -- Nagao composes the
      disjoint coset factor base with a presentation whose solve is claimed
      polynomial under the first fall degree assumption, and KN-LIT-71b758 says so
      in its own "Relevance to this program". The distinction that survives is
      real and narrow: 2015/984's presentation is a single summation polynomial
      Weil-descended (EQS2/EQS4), NOT Semaev's chained-S_3 system with auxiliary
      partial sums, and the two have different variable counts and different
      degree arguments. A reviewer reading the sentence as written will find it
      false against 2015/984, so the language should name the presentation
      explicitly. Recorded as a pointer for the owning session; nothing here
      changes that record.
    - >-
      AN AUTHOR-DECLARED OPEN PROBLEM SITTING UNDER THE POLYNOMIAL-TIME CLAIM, and
      the reason a fifth deliverable was written. 2013/549 page 3: on the
      assumption it then uses, "This assumption has some counter examples and
      Petit et al. assume that the polynomials f_1, ..., f_l are general
      polynomials. However, if f_1, ..., f_l are randomly chosen, the value of
      D_ff seems to be very large. In our situation, we treat only the cases that
      D_ff ~ max_i deg f_i and so, f_1, ..., f_l cannot be randomly chosen." Then,
      having proposed the repaired definition D_ff := max_M D_ff(M) over
      invertible recombinations of the generators and remarked that the assumption
      "seems to be true" for it: "However, by using this new assumption, I can not
      prove that the equations system coming from Weil descent have low first fall
      degree in strict way and it remains a future work." D_ff^max >= D_ff by
      construction (the identity is one M), so the credible version is the HARDER
      condition, it is the one relevant to an algorithm because F4 recombines
      generators, and the author states he cannot establish it for exactly the
      systems at issue. Carried forward as KN-OPEN-7f0511 with two further axes:
      which of the now-four inequivalent definitions a degree-4 GF(2) Macaulay
      rank actually bounds, and the O(1) point below.
    - >-
      AN EXPONENT DISCLOSURE OBLIGATION, cheap and unmet. 2013/549's Assumption 1
      (page 3) reads "Upper bound of the degree of the polynomial for computing
      Groebner basis of f_1, ..., f_l of F4 algorithm is D_ff + O(1)", and its
      Lemma 1 charges O(N^{D_ff.C+O(1)}). 2015/984's Assumption 1 reads "is <=
      d_F" and its Lemma 2 charges O(N^{d_F w}) -- the "+ O(1)" is DROPPED.
      Against 2013/549's own subexponential target the slack is invisible. Against
      a claim that NAMES an exponent it is not: under the assumption as the cited
      predecessor states it, O(n^{8w+1}) becomes O(n^{8w+1+O(1)}) with the O(1)
      unquantified. The claim stays polynomial either way -- that is not in
      question -- but the exponent 2015/984 reports is not determined by the
      assumption 2013/549 states, and every concrete cost this program computes
      from 8w+1 inherits that. This is a disclosure item, not a research result.
    - >-
      WHY THE TWO 2013 PAPERS CORROBORATE NOTHING ABOUT EACH OTHER. They were
      received the same day (2013-09-04), both are self-described joint work with
      Kazuto Matsuo and Tsuyoshi Takagi under a single-author ePrint entry, both
      PDFs are titled "(Draft)", both carry a "6 Nov" note retracting a numbered
      result, and each cites the other (2013/549's [6] is 2013/548). Read together
      they are one author's programme at one moment. The pair also isolates what
      is new in 2015/984: 2013/549 reaches SUBEXPONENTIAL under the first fall
      degree assumption, 2015/984 reaches POLYNOMIAL from the same assumption, and
      the difference is the 2013/548 Section 7 construction -- which makes
      2015/984's unproved Proposition 5 (the affine-invariance step) the only new
      mathematical content between the two conclusions.
