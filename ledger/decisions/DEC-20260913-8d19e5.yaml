  priority_question_status:
    one_sentence: >-
      A disjoint coset-shifted factor base with the 1/d! yield removal stated
      explicitly is present in the frozen last revision of Nagao ePrint 2013/548
      at Section 7 (pages 4-5, footnote 3), covering the elliptic case only by
      specialisation at g = 1, and that paper itself credits the idea to Diem
      (2009) and to Matsuo (2005/2006, unpublished) rather than claiming it -- so
      the construction is older than this program's mechanism lane assumed and is
      not Nagao's either, while WHO re-discovered WHAT remains unsettled here
      because two earlier revisions of 2013/548 are not frozen, ePrint 2014/806
      has not been opened by this task, and the Matsuo attribution is
      unverifiable in principle.
    supported_by_frozen_bytes:
      - the construction, its disjointness recipe, and the 1/d! accounting
      - the paper's own attribution of the idea to earlier work
      - that its retraction does not land on Section 7
      - that its own complexity conclusion is in a different characteristic regime
    not_supported_and_not_to_be_inferred:
      - the date at which Section 7 first appeared
      - the content, date, or independence of ePrint 2014/806
      - whether 2015/984's "recently re-discovered by [5]" is accurate
      - the Matsuo attribution
    what_would_settle_it: >-
      Freeze ePrint 2014/806 and read its construction, its section, and its own
      attributions; that converts "whose device is it" from one author's assertion
      into a comparison of two read texts. If the DATE of Section 7 becomes
      load-bearing, an earlier revision of 2013/548 must be recovered from outside
      ePrint (web archive or the authors) and its unavailability recorded as an
      impediment rather than resolved by inference.
