      reader consults both records.
    converted:
      - pointer: Nagao ePrint 2013/549 (cited by 2015/984 as [11])
        now: >-
          A CITABLE SOURCE, provenance `retrieved`, frozen at
          inputs/NAGAO-2013-549/ (SRC-NAGAO-2013-549), read in full and recorded
          as KN-LIT-c5dceb, verified_by TASK-20260913-0188bf.
        citable_for:
          - >-
            that the field-equation rewriting statement 2015/984 calls its Lemma 3
            is present as 2013/549 Lemma 2 (page 4) and is PROVED there (pages
            4-5), by descent on the leading monomial
          - >-
            that the "not constructive" remark refers to the cost of computing the
            rewritten coefficients (2013/549 page 5), not to the existence proof
          - >-
            that 2013/549 contains NO inequality between a true and a fake first
            fall degree, and no true/fake distinction at all (its Definition 1,
            page 3, is single-notion and Petit-style)
          - >-
            that 2015/984's Lemma 5 is 2013/549's Lemma 9 (page 7), proved there
            in two lines
          - >-
