coordinator_decision:
  id: DEC-20260907-efe01a
  recorded_at: '2026-09-07'
  context: >-
    RQ-RELN-61638a's second of three drafted contracts, EXP-RELN-82f487
    (inductive GNN/tree decomposability predictor panel, hypothesis
    H-RELN-10ad6b), was left review_required pending user confirmation. The
    user's instruction was to run all three RQ-RELN-61638a contracts "in
    dependency order"; EXP-RELN-f202be (the first) has now completed and
    been filed as inconclusive (EV-RELN-335cd2 / DEC-20260907-843464). This
    decision approves the second contract.
  decision: approve
  target_ids:
    - EXP-RELN-82f487
    - H-RELN-10ad6b
  rationale:
    - >-
      The contract is fully specified: objective, inputs (with a primary
      exhaustive-label source citing EXP-RELN-f202be's count vectors and a
      Stage-1 in-contract enumeration fallback for cells it did not
      supply), a 12-control panel (four base-geometry arms, the selection
      null, the analytic exchangeable null, a label-permutation null, a
      planted-leak check, a non-graph tree baseline, an INV-6 theorem-arm
      instrument check, reproduction fixtures, and a determinism re-run),
      independent variables, primary/secondary metrics, a preregistered
      prediction with the two competing decay exponents (-1/2 closed vs 0
      alive) inherited unchanged from IDEA-20260830-c5c614, toy-scale
      scope, replication seeds, an advisory budget, stage budgets,
      stopping/invalidation rules, a decidable success/falsification
      criterion pair in which the predicted (decaying) branch is itself a
      valid result, decision paths, and required artifacts including the
      three symbolic-regression handoff tables produced in EITHER branch.
    - >-
      Existing user authorization satisfies the confirmation gate
      (docs/research-budget-policy.md; the user's explicit "run all three,
      in dependency order"), consistent with the basis already used for
      EXP-RELN-f202be's approval (DEC-20260906-0b4030).
    - >-
      Toy scale only (N <= 2^20 exhaustive, one certified sample at 2^24);
      no claim under any outcome beyond an existence witness for
      representation-decidable structure in the trained class, which
      itself requires independent review before use.
  evidence_refs:
    - ledger/proposals/IDEA-20260906-79ff48.yaml
    - ledger/hypotheses/H-RELN-10ad6b.yaml
    - EV-RELN-335cd2
  limitations:
    - >-
      This decision authorizes execution of EXP-RELN-82f487 only. It
      asserts nothing about the outcome (predicted/decaying or refuting/
      alive branch) and nothing about H-RELN-10ad6b's eventual status.
    - >-
      Promotion of H-RELN-10ad6b in either direction is a separate
      Coordinator decision after the run executes and after the independent
      validator and red-team review named in the contract's
      later_review_requirements.
    - This decision does not approve EXP-RELN-141a86.
    - >-
      The contract's advisory budget (400 CPU-hours, 30 runs) is large
      relative to a single executor session; partial completion, reported
      honestly per the contract's own stopping and invalidation rules, is
      an explicitly anticipated and acceptable outcome, not a defect.
  next_actions:
    - Dispatch the executor per handoff TASK-20260907-2adca3.
    - >-
      After EXP-RELN-141a86 becomes eligible (its own approval is a
      separate decision), dispatch it consuming whichever of
      EXP-RELN-82f487's handoff tables and EXP-RELN-f202be's summaries are
      available by then.
    - >-
      After execution, run an independent validator and red-team pass per
      the contract's later_review_requirements before any claim-changing
      review or hypothesis-status change.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of an experiment contract is not an evidence-review
      decision; no run has executed yet.
  decided_by: coordinator
  decided_at: '2026-09-07'
