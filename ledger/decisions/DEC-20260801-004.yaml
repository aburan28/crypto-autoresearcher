coordinator_decision:
  id: DEC-20260801-004
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-021
  recorded_by_task: TASK-20260801-001
  archive_kind: snapshot
  archived_by_task: TASK-20260801-002

  id_freshness_note: >-
    ledger/decisions was listed immediately before writing this record and
    contained DEC-20260801-001, -002 and -003 and no -004. DEC-20260801-004 was
    the next free id at authoring time. This campaign has hit three same-date
    DEC-ID collisions with origin/main (CORR-20260801-001 renumbered
    DEC-20260731-010 to -019; the BATCH-020 ledger decision was issued as
    DEC-20260731-020 and filed as DEC-20260801-003 after the id was found
    occupied by a published GOAL-FAEST-001 record; DEC-20260731-021..024 and
    DEC-20260801-001..002 are likewise taken). If a merge from origin/main
    reveals a collision on this id, the resolution is to renumber OUR record and
    never the other party's, with a superseding correction record and an
    authoritative mapping - never an edit to the other record.

  context: >-
    BATCH-020 closed at DEC-20260801-003 with `inconclusive` on the H-DS-001
    mechanism and a partial repair confirmed. EV-DS-003 records that
    RUN-DS-001-ctrl-unplanted (snapshot 1d241a878b4f0e74cadbb5e2e0995c0bf6f97cbd)
    was ADMISSIBLE (VAL-20260801-001) and that it FALSIFIED the packaging branch
    of the frozen packaging_falsification_rule WITHOUT ESTABLISHING STRUCTURE -
    the run landed outside both branches of a rule drafted as a dichotomy. Red
    Team RT-20260731-047 returned five blocking objections. The decisive one,
    RT047-B2, derived from the committed code that the real split arm exercises
    NO elliptic-curve or Semaev structure whatsoever - smoothness_abort is false
    so is_B_smooth is never called, encode_intermediate is provably the identity
    map at this cell (D = 2^40 against every x-coordinate below 2^20), and the
    join is exact x-coordinate equality - so what was measured is a generic
    depth-3 to depth-2 hash-join meet-in-the-middle available on any group with
    any factor base. The legacy null NULL-DS-RANDOM-MULTIHOMOGENEOUS cannot
    adjudicate this, because it changes the ALGORITHM and leaves the OBJECT
    question untouched, and by construction admits no join at all. The exact
    single next action recorded in ledger/goals/GOAL-ECDLP-001.yaml at that close
    was RT047-CTRL-1 variant (a), the matched-ALGORITHM null. This decision opens
    BATCH-021 to execute it.

  decision: approve
  decision_label: open_batch021_matched_algorithm_null_control_with_frozen_disposition_map

  decision_scope: >-
    This decision (1) opens BATCH-021 under SG-ECDLP-001 with the nine-task
    lifecycle TASK-20260801-001..009 at max_concurrent 3; (2) approves the
    AUTHORING of the superseding-style control addendum
    PA-DS-001-v2-ctrl-matched-null and controls/CTRL-RT047-MATCHED-NULL.yaml;
    (3) freezes the disposition map for RUN-DS-001-ctrl-matched-null BEFORE the
    run exists; and (4) repoints GOAL-ECDLP-001's current_batch_id,
    dispatch_queue_path and next_action. IT AUTHORIZES NO RUN. The Executor is
    gated on TASK-20260801-004 recording APPROVAL_DETERMINATION APPROVED after an
    independent review PASS at TASK-20260801-003. It changes no hypothesis
    status, files no evidence, discharges no control, and moves no promotion
    gate.

  what_is_being_tested: >-
    Whether the split arm's measured advantage transfers to an object with no
    elliptic-curve or Semaev structure at all. naive_search and split_search run
    UNCHANGED - same code, smoothness_abort false, same charge_backend_units,
    same frozen wall-derived cost identity, 200 relations, seed 101 - against the
    additive group Z/753848Z, whose order matches the BATCH-020 curve group order
    exactly, with a 128-element negation-closed random signed factor base and 200
    uniform random targets. Per inventor-protocol section 3.2 the null object must
    be the identical measurement on a random instance of the SAME SHAPE. This
    control changes ONLY the object.

  why_this_and_not_the_alternatives: >-
    Four RT047 controls were on the table and exactly one is dispatched, per the
    single-next-action discipline. RT047-CTRL-1 attacks the single load-bearing
    inference of the entire lane - "R < 0.5 while R_null >= 0.9 means the win is
    structure-dependent" - at its weakest joint, is decisive in BOTH directions,
    and costs under 60 seconds of compute with no new dependencies and no new
    mathematics. RT047-CTRL-2's B-sweep is the correct follow-on and supplies the
    artifact tell and the memory axis, but its reading is only interpretable once
    the object-level null is known. RT047-CTRL-3 is a contract-drafting item with
    no compute that gates a future plant rerun, not this one. RT047-CTRL-4 matters
    for the per-attempt-cost times inverse-success-probability bookkeeping the
    target profile demands, but it presumes the arm under test is the arm of
    interest, which is precisely what CTRL-1 decides.

  pre_registration_ruling: >-
    THE DISPOSITION MAP IS FROZEN BEFORE THE RUN AND THAT IS THE POINT OF THIS
    BATCH. The map lives in CTRL-RT047-MATCHED-NULL.yaml under disposition_map,
    is hash-bound by the TASK-20260801-002 snapshot before any independent
    session reads it, and partitions the entire two-proxy outcome space into five
    branches with no gap - D-1 LOW/LOW, D-2 HIGH/HIGH, D-3 MID/MID, D-4 all six
    mixed-band combinations, and D-5 pre-empting all four when a pre-registered
    integrity guard fires. The 0.5 and 0.9 thresholds are INHERITED from
    H-DS-001's own prediction clause and R-1's F2 branch; no new threshold is
    invented. The map may not be altered after any number is observed except by a
    versioned protocol_amendment recorded BEFORE the Coordinator sees the result
    and justified on grounds independent of it. TASK-20260801-003 is instructed to
    attack the pre-registration adversarially rather than merely confirm it.

  frozen_disposition_map_summary:
    decision_variable: >-
      W is R_matched_null under the wall proxy and U is R_matched_null under the
      charged-unit proxy. Both required, neither privileged.
    D-1: >-
      W < 0.5 AND U < 0.5 (RT047 anchor about 0.03 wall and 0.015 units) - fires
      H-DS-001's OWN falsification condition and R-1's F2 branch for the first
      time in the entire EXP-DS-001 series. Disposition WEAKEN, with the win
      reattributed to generic meet-in-the-middle, H-DS-001 moving analyzed to
      weakened SCOPED TO THE STRUCTURE ATTRIBUTION ONLY, a refutation artifact
      archived first, and replication plus the B-sweep scheduled. EXPLICITLY NOT
      reject-as-impossibility.
    D-2: >-
      W >= 0.9 AND U >= 0.9 - the first genuine structure evidence this
      experiment has produced. Disposition REPLICATE; H-DS-001 stays analyzed;
      no support and no S1_met, because one bit size cannot meet a two-bit-size
      criterion and the run is unreplicated. RT047-CTRL-2's B-sweep becomes the
      immediate follow-on.
    D-3: >-
      0.5 <= W < 0.9 AND 0.5 <= U < 0.9 - partial attenuation. Disposition
      INCONCLUSIVE; neither the hypothesis's own falsifier nor the structure gate
      fires; next action is the B-sweep plus an object-cost-parity measurement.
    D-4: >-
      W and U in different bands - the choice of proxy determines the SIGN of the
      conclusion. Disposition INCONCLUSIVE on mechanism with a POSITIVE cost-model
      finding establishing RT047-B1 and RT047-H4 as measured defects; next action
      is to repair the cost model before any further reading of R.
    D-5: >-
      Any pre-registered integrity guard fires - INADMISSIBLE, certificates below
      100 percent, a capped attempt on any arm, claw-table amortization mismatch,
      a short arm, an undeclared code change, or a timeout, crash, exhaustion or
      cancellation. The map is SUSPENDED. Infrastructure or instrument signal,
      never a mathematical result.

  declared_parameter_ruling: >-
    PER_TARGET_CAP_SECONDS = 5.0 is DECLARED IN THE CONTRACT, discharging
    Validator defect D-3 from VAL-20260801-001, which found it a hard-coded,
    undeclared per-attempt truncation visible in no contract, manifest,
    raw-result or summary field. Its bias direction is stated on the record - it
    truncates the SLOWER NAIVE ARM FIRST at larger parameters and therefore
    biases R DOWNWARD, in the direction that flatters the split arm - and a
    pre-registered guard SUSPENDS the disposition map if any arm records a capped
    attempt.

  proxy_disclosure_ruling: >-
    RT047-B1's proxy-sensitivity disclosure is carried into the REPORTING
    TEMPLATE, making it a property of the instrument rather than of the write-up.
    Every ratio is an ordered pair of wall proxy and charged-unit proxy with
    neither privileged; the summary must state verbatim that the frozen cost
    identity is wall-derived and that charged units never enter R, superseding
    the BATCH-020 summary's optimistic_assumptions_restated[0] wording; and the
    2.20x and 116.5x BATCH-020 proxy disagreements and the 6-percent-not-12,000-
    percent robustness of the R_null gate must be quoted.

  supersession_semantics: >-
    CTRL-RT047-MATCHED-NULL is a NEW record under a NEW id. It does not
    overwrite, edit, re-score, reopen or invalidate CTRL-RT025-UNPLANTED,
    CTRL-RT025-PLANT-LIVE, the RUN-DS-001-ctrl-unplanted package, EV-DS-001,
    EV-DS-002, EV-DS-003, or any BATCH-020 artifact. What is superseded is the
    FORWARD READING of the null axis only - the legacy null is declared unmatched
    for structure-dependence purposes and NULL-DS-ADDITIVE-Z753848 replaces it in
    that role. Prior R_null figures remain valid as measurements.

  forbidden_in_this_batch:
    - S1_met, F1_met or structure_gate_passed under any branch
    - support for H-DS-001
    - any asymptotic, crypto-scale or affected-scheme claim
    - any movement of asymptotic promotion gates G1-G4
    - HEUR-DS-1 validation or refutation
    - reject_scoped, and in particular reject_scoped-as-impossibility
    - any change to H-IC-001 or H-STR-002
    - running the live plant; CTRL-RT025-PLANT-LIVE stays UNDISCHARGED
    - executing specification v1
    - sweeping B, re-running the 54-cell matrix, or re-running HEUR
    - dominated_by null anywhere downstream
    - touching FAEST or XEDN
    - >-
      editing specification.v2.yaml, specification.v1-frozen-df613af6.yaml,
      CTRL-RT025-UNPLANTED.yaml, v2_ctrl_unplanted.yaml, ds001_driver.py,
      ds001_ctrl_unplanted.py, any BATCH-020 artifact, EV-DS-001/002/003, or any
      DEC record

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-001
    - BATCH-021
    - EXP-DS-001
    - H-DS-001
    - CTRL-RT047-MATCHED-NULL
    - PA-DS-001-v2-ctrl-matched-null
    - RUN-DS-001-ctrl-matched-null
    - RT047-CTRL-1

  evidence_ids: []
  evidence_refs:
    - ledger/decisions/DEC-20260801-003.yaml
    - ledger/evidence/EV-DS-003.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-047/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-046/validation_report.yaml
    - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
    - experiments/EXP-DS-001/amendments/v2_ctrl_matched_null.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/BATCH-021-OPENING.md

  hypothesis_status_transition:
    hypothesis_id: H-DS-001
    from: analyzed
    to: analyzed
    changed: false
    reason: >-
      An opening decision changes no hypothesis status. Any transition happens
      only at TASK-20260801-009, after the run and both independent reviews, and
      only along the branch the frozen disposition map assigns.

  budget_status: >-
    campaign_budget.maximum_batches is 50 and BATCH-021 is the TWENTY-FIRST
    batch, so NO PAUSE CONDITION FIRES. This is stated explicitly rather than
    left implicit. Goal status remains `active`. The batch itself is budgeted at
    1800 wall-clock seconds and 8 GB for the single run, against an estimated
    compute cost under 60 seconds; the generous budget exists so that a slow host
    is not mistaken for a result.

  ledger_commit: null
  ledger_commit_note: >-
    NULL BY CONSTRUCTION. This session has no shell; the TASK-20260801-002
    snapshot commit is made by the dispatching session and its SHA is bound
    afterwards in the queue archive block and the snapshot receipt. Nothing in
    this decision is official until the post-commit verifier accepts that commit,
    and the branch must be pushed to an open PR against main for the record to be
    durable. No hash is fabricated.

  rationale:
    - >-
      The BATCH-020 close recorded exactly one next action and this decision
      executes it unchanged. The next_action is binding and pre-registers most of
      the content of this batch.
    - >-
      The lane's central inference has never been tested. Every real arm in the
      EXP-DS-001 series to date ran with smoothness_abort false, so the mechanism
      H-DS-001 is about has never executed, and the only null ever run destroys
      the algorithm rather than the object. A single sub-minute experiment
      separates the two explanations.
    - >-
      Writing the reading rule before the data exists is the substantive
      contribution of this batch. Every prior batch in this lane produced numbers
      whose interpretation was contested after the fact; a frozen, exhaustive,
      hash-bound disposition map removes that degree of freedom.
    - >-
      The map is deliberately symmetric. A result at the artifact anchor produces
      WEAKEN, not rejection, because an untested mechanism generates no evidence
      that it fails; a result at the structure threshold produces REPLICATE, not
      support, because one bit size cannot meet a two-bit-size criterion. Neither
      direction can be over-read.
    - >-
      Validator defect D-3 is discharged by declaration rather than deferral, and
      its bias direction is recorded as flattering the split arm, so the
      instrument's known asymmetry is on the record before it can matter.

  limitations:
    - >-
      This is an opening decision. It establishes nothing empirical and
      authorizes no run.
    - >-
      Even a maximally favourable matched-null result cannot promote H-DS-001,
      cannot establish S1_met, and cannot move any asymptotic gate. The claim
      ceiling is toy under every branch.
    - >-
      The matched null cannot speak to the mechanism itself. It decides whether
      the MEASURED ADVANTAGE is structure-dependent; it does not exercise the
      smoothness claw, which remains untested with smoothness_abort false.
    - >-
      CTRL-RT025-PLANT-LIVE remains UNDISCHARGED after this batch by design, and
      the plant detector still has no measured specificity (RT047-B3).
    - >-
      The tested cell's prime-order subgroup is 241, about 7.9 bits; the "20 bits"
      label refers to the field p = 752627 (RT047-B5, Executor AN-5). The matched
      null is over the full group order 753848, which is the object the membership
      search actually runs over.
    - >-
      Inference fallback - requested coordinator-orchestration-code, resolved
      claude-opus-5, model_verified false.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. The promotion gate fires on a `support` or `reject_scoped`
      decision backed by `replicated` or `strong` evidence. This is an `approve`
      decision opening a batch; it reviews no evidence record and reaches no
      empirical conclusion, so neither leg is even reachable. The standing KN-FIND
      candidate identified at the BATCH-020 close - that a wall-clock ratio
      against an unmatched, algorithmically different null can manufacture a 111x
      "structure" signal that the same run's deterministic ledger puts at 0.957 -
      remains recorded in EV-DS-003 (N-1, N-2, UC-1) and remains the first
      candidate for promotion once RUN-DS-001-ctrl-matched-null returns, in either
      direction. No KN-FIND id is reserved, knowledge/INDEX.md is untouched, and
      tools/build_knowledge_index.py was not run.

  next_actions:
    - >-
      TASK-20260801-002 - snapshot-archive the three declared TASK-20260801-001
      records alone (CTRL-RT047-MATCHED-NULL.yaml, v2_ctrl_matched_null.yaml,
      this decision) so the frozen disposition map is hash-bound BEFORE any
      independent session reads it. Then TASK-20260801-003 independent review,
      then TASK-20260801-004 APPROVAL_DETERMINATION, and only on APPROVED,
      TASK-20260801-005 RUN-DS-001-ctrl-matched-null. Do not run the live plant.
      Do not execute v1. Do not alter H-IC-001 or H-STR-002. Leave FAEST and XEDN
      alone.

  decided_by: coordinator
  decided_at: '2026-08-01'
