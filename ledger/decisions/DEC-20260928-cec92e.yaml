  # ---------------------------------------------------------------------------
  composition:
    rule: |
      CA-2 and CA-7. Each joint is read against the plan's own breaking_artifact list and
      given one composed disposition naming the key applied. Verdicts are not counted: a
      defect found on two joints is one defect, composed once. Keys are applied as
      written; none is relaxed.
    joints:
      - joint: J1
        owner: TASK-20260928-d5024b
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: |
          The m = 4 window over free B, which the contract names as its m = 4 window, is
          committed on two B ranges (specification stage_0: log2 B 29.036 to 33.896;
          stage0_code and audit step_9: 29.036 to 35.996 or 36.000) and its hand figures
          follow from neither: on the code grid the upper edge is 99.38 - 2g against the
          audit's 98.05 - 2g (1.33 bit, over the 1-bit tolerance); on the specification grid
          the closing g is 31.128 against about 31.5 (0.37, over the 0.2 tolerance). This is
          the plan's J1 artifact "an m = 4 window not stated exactly" and "a window bound
          off by more than 1 bit or a critical g off by more than 0.2"; stopping rule S5
          would halt an approved run at Stage 0 (J1-C9). The closing point on the code grid
          (log2 C 42.527 at log2 B 34.33) is reproduced by the red team's independent PTM-A
          scan. Everything else on the J1 list holds: the column to 0.0048 bit, the
          identity, the LA term, the m = 5 window in both conventions, the rho convention,
          the D3 column, the 4b65e3 section with its residual recorded as a definitional
          difference, and D1 used nowhere as a budget.
      - joint: J2
        owner: TASK-20260928-d5024b
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: |
          The joint requires validation plans for H1 and H2 with sample, comparison and
          tail. The H1 arm cannot falsify and does not compare like with like: (a) the knee
          rule confines exponent_ic to [-1.0805, -0.9195] on the designed knee cells for any
          cost data (exact, E05), so the IC arms of G1, IR-3 and success clause (iii) cannot
          fail and the NEGATIVE outcome, through which the falsification criterion routes,
          is unreachable; (b) usable_fraction is defined on determined columns while the
          prediction 0.748 is the touched-column probability, and under the contract's own
          random model the determined value at m = 2, R = B is about 0.635 (model value, not
          an observation), so clause (iv) fails on most relation graphs for a definitional
          reason; (c) retries are defined in attempts while the prediction and the tail
          check count decompositions. The most likely execution meets neither declared
          outcome and fires no invalidation rule. C4 is met in form: the fixture is
          runnable code, G1 is stated before execution and wired into S1, S2, IR-1 and IR-6,
          and no approval field is missing.
      - joint: J3
        owner: TASK-20260928-a75ba7
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: |
          The plan's J3 artifact "a collision the reporting rules misread". A no-reuse null
          object (fixed setup plus an independent per-target solve) gives exponent_ic -0.970
          on five knee cells and passes both exponent bands; the genuine preimage lands in no
          declared outcome; the binary-versus-control usable test is one-sided; CTL-6 is in
          no invalidation rule; an over-complete binary cell can read POSITIVE once the
          control's band is met. This is the J2 defect family reached by a different route
          and is composed once with it. What holds on J3: TA-1 not fired (85 line hits, no
          OUTCOME), C3 discharged by outcome_table.never_an_outcome, the Kuhn-Struik range
          marked and now confirmed at source, the CGK statement correctly labelled a corpus
          relay (IMP-CGK recorded, SR-NOSUB present: the K-impediment reading, not
          K-revise-defect), and the per-orbit guidance labelled under CORR-20260925-649e25.
      - joint: J4
        owner: TASK-20260928-a75ba7
        attested: true
        disposition: breaks
        key_applied: K-revise-defect
        basis: |
          The plan's J4 artifact "an over-scoped sentence", twice: the hypothesis title says
          the windows are "validated on binary toy cells through heuristics H1 and H2",
          which toy cells at L up to 256 and subgroup orders about 2^17 to 2^20 cannot do for
          window ends many bits beyond them in L, and which J2 and J3 show the H1 arm cannot
          do as specified; statement (D) says "every m >= 4 oracle record is read against
          both", asserting the rule that DEC-20260928-63addc S1 decision_it_changes poses as
          the question. What holds on J4: no prime-field engine cell and no deployed run are
          designed, the 1ddce2 column is cited by id only, the binary cells are heuristic
          validation, the excluded reads are respected, and PTM-A, PTM-B and PTM-C meet their
          failure signatures.
      - joint: J5
        owner: TASK-20260928-95abde
        attested: true
        disposition: agrees within tolerance on every compared quantity
        key_applied: K-indeterminate not triggered; the J5 condition of K-approve is met
        basis: |
          See j5_versus_contract. The attested verdict inconclusive is the card's designed
          verdict (BL-5 forbids the reviewer's own comparison); the joint was run in full, so
          K-infra does not apply.
    unowned_or_unattested_joints: none
    k_infra: not applied; every joint was run and attested; the two usage-limit interruptions were resumed and completed (see blindness_and_procedure)
    composite_reading: |
      What stands: the deployed arithmetic of Stage 0 (the T_gen and P_gen column, the
      identity, the LA term, the m = 5 window in both conventions, the rho convention, the
      pinned D3 comparator and the 4b65e3 section), on two independent routes (J1 with the
      contract's constants and J5 blind with the card's); the tripwire discipline (C3); the
      exclusions and the three proves-too-much controls; the fixture as runnable code (C4
      in form). What fails: the m = 4 window statement (C2); the H1 validation arm, which is
      the heuristic-validation pairing that DEC-20260928-63addc C5 and the dispatch bias
      require and which as specified cannot falsify and measures a different quantity from
      the one it predicts; and two scope sentences. The contract is therefore not a complete
      protocol. Every remedy is a zero-compute specification revision.

  # ---------------------------------------------------------------------------
  j5_versus_contract:
    rule: |
      CA-4, before any key was applied. Frozen values from H-BINSTD-6e4713 statement (B)
      and (C), EXP-BINSTD-532d7f memory_beside_time and preregistered_prediction, and the
      audit sheet stage0_recomputation steps 2 to 8, at the snapshot bytes. Tolerances from
      the plan: Q1, Q2, Q5 within 0.05 bit; Q3 exact on the identity and on the direction;
      Q4 within 1 bit per bound and 0.2 on the critical g. The full row table is in the
      worksheet.
    quantity_by_quantity:
      - {quantity: Q1 log2 B_cap at five m, largest_difference: '< 1e-6 bit', within: true}
      - {quantity: Q2 log2 T_gen at five m, largest_difference: '< 1e-6 bit against the six-decimal audit figures; 0.0048 against the two-decimal design figures', within: true}
      - {quantity: Q2 log2 P_gen at five m, largest_difference: '< 1e-6 bit; 0.0044 against two decimals', within: true}
      - {quantity: Q3a identity, largest_difference: 'none; exact on both sides', within: true}
      - {quantity: Q3b LA term and its direction, largest_difference: 'below P_gen at every m on both sides; values agree to two-decimal rounding', within: true}
      - {quantity: Q5 log2 rho, largest_difference: '< 1e-6 bit (60.8090)', within: true}
      - {quantity: 'Q4 m = 5 bounds, D3 convention, g = 0, 6, 10', largest_difference: '0.06 bit (upper ends); lower ends within 0.01', within: true}
      - {quantity: 'Q4 m = 5 status at g = 13, 13.2, 14', largest_difference: 'none; empty on both sides in both conventions', within: true}
      - {quantity: Q4 critical g D3 convention, largest_difference: '0.013 (contract 12.256, J5 12.2693)', within: true}
      - {quantity: 'Q4 m = 5 bounds, proposal convention, g = 0, 6, 10', largest_difference: '0.10 bit (upper ends); lower ends within 0.03', within: true}
      - {quantity: Q4 critical g proposal convention, largest_difference: '0.031 (contract 12.918, J5 12.9493)', within: true}
    input_differences: |
      The J5 card fixed the per-target constant 1.6, the attempt constant 1.58 and the
      comparator inputs 33.08 and 32.4; the contract uses kappa_5 = 1.637128,
      A1 = 1.581977, 33.075936 and 32.414212. Half of log2((1.637128 x 1.581977)/(1.6 x
      1.58)) is 0.0175 bit, which is exactly the gap between the contract's critical
      log2 C 45.3319 and J5's 45.3493; the upper-end offsets follow from the same ratio and
      the comparator-input rounding. Composer's arithmetic on reported values.
    not_compared: g = 12 (contract only) and g = 2 (J5 only); the m = 4 slices and the m = 4 envelope are not J5 quantities
    q0_choices: |
      The one choice with a material effect (Q0-5, the LA term read as (5 B)^2) is not the
      contract's reading (definitions.model_Mm fixes m B^2), which is also the reading J5
      used, and even the alternative moves one endpoint by 1.0 bit, at and not beyond the
      tolerance. K-indeterminate is not triggered.
    result: agreement within tolerance on every compared quantity

  j1_versus_j5: |
    On every quantity both computed (B_cap, T_gen, P_gen, the identity, the LA term and its
    margins, rho, the m = 5 critical g and bounds) J1 and J5 agree; the only systematic gap
    is 0.017 on the m = 5 critical g at equal comparator input, which is the constants
    difference above. J1's one break, the m = 4 envelope, lies outside the J5 quantities and
    is neither corroborated nor contradicted by the blind joint; its closing point is
    reproduced by the red team's independent (not blind) scan. Under PD-R1 the concurrence
    of J1 with the column values is weak corroboration; J5 is the structurally blind check
    and it holds.

  tripwires:
    applied_by: composer, reading each report block and reading J5 directly (CA-6)
    TA-1: not fired (d5024b and a75ba7 readings; J5 asserts nothing about any contract). The recorded red-team caution is carried into the revision card, see R-J4-1.
    TA-2: not fired (no contradiction of KN-FIND-aa2efc as scoped by CORR-20260928-4cb669, EV-ICPERF-10c5fc as relabelled by CORR-20260928-5d81df, or KN-FIND-007 within any owned joint)
    TA-3: not fired (no prime-field engine cell, no deployed-parameter run, no m >= 4 budget priced against D1, fixture present as code)
    TA-4: not fired (every card served at review-breakthrough, effort max; backend substitutions recorded as fallback_used; no review-adversarial substitute)
    effect_applied: none required

  proves_too_much:
    PTM-A: meets failure signature (identity residual 0; empty model window at C = T_gen at every m and over every base at m = 4; no dominance either way against the retrieved Bernstein-Lange points)
    PTM-B: meets failure signature with a 0.0001-bit rounding caveat (the L = 1 tie budget 11.010251 reproduces the pinned D3 11.01; the literal two-decimal value places L = 1 formally inside the g = 0 window by rounding, removed by the unrounded value, R-J4-3)
    PTM-C: meets failure signature (empty at g = 13, 13.2, 14 in three conventions; one predicted exponent on all three cells, met vacuously for the IC exponent because of the knee rule)

  # ---------------------------------------------------------------------------
  prior_versus_outcome:
    cites: REVIEW-BINSTD-A-20260928-d34db1 coordinator_prior and procedure deviation PD-R1 (the prior is informed, not blind)
    table:
      - {joint: J1, prior: 'holds about 0.7; if broken, on the m = 4 window or the m = 8 residual label', outcome: 'breaks on the m = 4 window; residual label holds', site_predicted: 'yes'}
      - {joint: J2, prior: 'holds about 0.5; expected break on C4 (fixture as prose or plan, or the full-log-vector solve assumed)', outcome: 'breaks on C5 (H1 validation arm); C4 met in form', site_predicted: 'no'}
      - {joint: J3, prior: 'holds about 0.6; expected break on TA-1 leakage or an unmarked Kuhn-Struik upper end', outcome: 'breaks on the observation collision; TA-1 not fired; marking holds', site_predicted: 'no'}
      - {joint: J4, prior: 'holds about 0.75; if broken, on PTM-B', outcome: 'breaks on two over-scoped sentences; PTM-B meets its signature', site_predicted: 'no'}
      - {joint: J5, prior: 'T_gen within 0.1 bit about 0.9; identity about 0.95; m = 5 bounds within 1 bit about 0.7', outcome: 'all three hold (1e-6 bit; exact; within 0.10)', site_predicted: 'held'}
      - {joint: overall, prior: 'approve about 0.3; most likely revise on C4 or C3', outcome: 'revise on C2, C5 and scope wording', site_predicted: 'class yes, site no'}
      - {joint: overturn conditions, prior: 'J5 off by more than 0.5 bit; LA not below P_gen at m = 4; a published algorithm under the S T^2 = N line exhibited', outcome: 'none occurred', site_predicted: n/a}
    reading: |
      The prior predicted the outcome class (revise) and located the break correctly on J1
      only. Treating the recorded per-joint figures as independent, all four of J1 to J4
      breaking had about 0.015 probability: the prior was overconfident that the wording
      and the fixture were the weak points, and it did not anticipate the dominant defect,
      the decision table of the H1 validation arm, found independently on J2 and J3. Per
      PD-R1, J1's concurrence with the column is weak corroboration; J5, blind, held on
      every sub-item. Lesson carried to the next plan: a joint owned on the decision table
      itself (is every declared outcome reachable, does every prediction match the metric
      as defined).

  icperf_objection_check:
    required_by: DEC-20260928-63addc PTR-ICPERF and plan icperf_objection_check
    bus_state: none (2026-09-29T03:43Z, as reported; see session_checks_reported.icperf_bus_state)
    ruling: |
      Recorded with no objection from the GOAL-ICPERF-e6b6a4 owner and none to rule on.
      This check does not decide the outcome, because K-approve fails on J1 to J4. The
      check is repeated before any approval of the revised contract. The revision also
      removes the one R2 edge the red team found with the ICPERF engines: the in-place
      extension of the shared prime-field index_calculus package (R-J4-2).

  approval_ruling:
    experiment_id: EXP-BINSTD-532d7f
    ruling: not approved
    key: |
      K-approve requires J1 to J4 to hold; none does. K-impediment permits approval only if
      every other K-approve condition holds, which is not the case, although its own reading
      is satisfied: the contract records IMP-CGK, keeps H2's supporting result marked as a
      corpus entry and forbids substitution (SR-NOSUB). K-revise-defect applies.
    standing_authorization_used: none; the AGENTS.md standing user authorization of 2026-09-06 is not invoked, because the protocol is not complete
    fields_left_unchanged: specification status review_required, approved_by null, approval.approved_by null, implementation_authorized false, scientific_execution_authorized false; hypothesis status specified, approved_by null (CA-8)

  defects_for_revision:
    note: |
      Every defect below is a specification, protocol-design, pre-registration, provenance
      or wording defect of an unapproved contract. None is a mathematical result about any
      curve, oracle or algorithm, and none is evidence about H1 or H2, neither of which has
      been measured. Breaking items first; the non-breaking items are to be cleared in the
      same revision. Remedies are the reviewers' suggestions, adopted as requirements here.
    breaking:
      - id: R-J1-1
        joint: J1
        breaking_artifact: the m = 4 window not stated exactly; bound off by 1.33 bit and closing g off by 0.37 depending on which committed B range is read
        requirement: One B range for the m = 4 envelope, committed identically in the specification text and in stage0_code, with the envelope design figures (lower edge, upper edge, closing g, contiguity at each g) recomputed on that range and stated beside both named slices.
      - id: R-J2-1
        joint: J2 (with J3)
        breaking_artifact: exponent_ic confined by the knee rule to [-1.0805, -0.9195] for any data; G1, IR-3 and clause (iii) IC arms cannot fail; NEGATIVE unreachable; falsification criterion routed through it
        requirement: Replace exponent_ic as the gated amortisation observable with observables that can fail (the knee location, the flattening ratio beyond the knee against kappa_2 times the attempt cost, a fit over all L) and restate G1, IR-3, the success clauses, the NEGATIVE outcome and the falsification criterion on them.
      - id: R-J2-2
        joint: J2 (with J3)
        breaking_artifact: usable_fraction measured on determined columns against a touched-column prediction (0.748 against a model value near 0.635 at m = 2, R = B)
        requirement: Either predict the determined-column usable probability at the R/B of the run (the giant-component law at m = 2) or choose R so that the touched prediction is the determined one, keeping the touched value as a diagnostic.
      - id: R-J2-3
        joint: J2 (with J3)
        breaking_artifact: retries defined in attempts, predicted and tail-checked in decompositions
        requirement: One unit for retries, the prediction stated per mu regime with multi-decomposition acceptance, and the tail check restated in that unit; either match the Z/NZ control mu to the binary cells (about 1) or predict the retries of the control itself.
      - id: R-J3-1
        joint: J3
        breaking_artifact: the reporting rules misread the observation collision (no-reuse null passes; genuine preimage in no declared outcome; one-sided usable test; CTL-6 in no invalidation rule)
        requirement: A no-reuse null arm with identical accounting on CTRL-ZN and at least one binary cell, differing from the amortisation reading on a gated observable; a two-sided binary-versus-control usable test; CTL-6 wired into an invalidation rule; an outcome table that assigns every reachable result, including the most likely one, to a declared outcome.
      - id: R-J4-1
        joint: J4
        breaking_artifact: 'two over-scoped sentences (hypothesis title: validated on binary toy cells through heuristics H1 and H2; statement (D): every m >= 4 oracle record is read against both)'
        requirement: Reword both as what the contract can certify (toy validation of the form of the law under H1 and H2; the two-row reading as the question S1 decides). Keep the red-team caution explicit in the outcome table - any window reading made with a measured per-attempt cost is a TW-01 reading, routed to its own review-breakthrough round.
    non_breaking:
      - id: R-J1-2
        source: d5024b J1-D1 (moderate)
        requirement: |
          Correct the audit_1 symbolic check and the hypothesis reproduction_check: at
          g = 0 in the D3 convention at m = 5 the lower root is not L = 1 (b = 1.524, log2
          L_lo = 1.2155), because D3 charges one attempt per relation and the model charges
          A(1); state which single-target law the L = 1 slice reproduces in each convention.
      - id: R-J1-3
        source: d5024b J1-D2 (moderate)
        requirement: |
          The stage0_code L = 1 print is identically 0 by construction; evaluate T_shared
          from the model terms so the CTL-4 arithmetic arm and PTM-B can fail.
      - id: R-J1-4
        source: d5024b J1-D3 (low)
        requirement: |
          Either compute the promised m = 5 envelope over B or remove the promise, and label
          statement (B) as a B = B_cap statement.
      - id: R-J1-5
        source: d5024b J1-D4 (low, provenance)
        requirement: |
