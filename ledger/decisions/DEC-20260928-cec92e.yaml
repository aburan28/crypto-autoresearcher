  blindness_and_procedure:
    facts: |
      TASK-20260928-d5024b and TASK-20260928-a75ba7 were each interrupted by an API usage
      limit after reading and before writing anything, and were resumed from their own
      transcripts on claude-opus-5-5 at effort max (claude-fable-5-1 before the
      interruption); each re-ran its custody checks after resuming, relied on no
      pre-interruption output beyond source reads re-verified by content hash, and records
      the event in its attestation. TASK-20260928-95abde was served on claude-fable-5-1 at
      max without interruption. Each reviewer attests read_sibling_reports false and
      runs_launched 0. Disclosed names-only exposures: d5024b saw untracked directory names
      (composition, reviews), the file name of DEC-20260928-9d9c47, two commit subjects
      naming the blind task's completion, the sibling review directory names and the path
      of the red-team report file (not opened); a75ba7 saw four review directory names, two
      commit subjects naming a lane-B task, file names in the shared session scratchpad
      written by other subagents (none opened) and two sibling directory names; 95abde saw
      nothing (no git command, no listing, four-file whitelist).
    ruling: |
      Admitted under the plan's blindness rules; no joint is discounted. (1) The plan forbids
      reading another reviewer's report; every exposure is to a name, a subject line or a
      path, no value, verdict or report text crossed, and each reviewer attests so. (2) The
      structurally blind joint J5 had no exposure, and its artifacts were generated at
      01:03:49Z, before d5024b ran its recorded computations (03:19Z to 03:21Z), so J1's
      recomputation could not have reached J5 before J5 returned. (3) The J2 and J3 breaks
      share a defect family but were reached by different routes and different code
      (exact knee-set enumeration and a Monte Carlo seeded 20260929; null objects and a
      Monte Carlo seeded 11 to 14); d5024b saw only the path of the red-team report and did
      not open it. They are independent findings of one defect and are composed once. (4)
      The interruptions change neither the session, the policy nor the effort; the backend
      substitution is recorded as fallback_used and is not a downgrade under the plan's
      unservable_rule; TA-4 did not fire. Model independence is not claimed.

