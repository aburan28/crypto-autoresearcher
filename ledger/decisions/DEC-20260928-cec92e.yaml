  rationale:
    - |
      The plan's keys decide this outcome as written: K-approve needs J1 to J4 to hold and
      none does; each break matches an item the plan listed before the object existed.
      Relaxing a key after reading would need a protocol_amendment (CA-7); none is made.
    - |
      The breaks are real protocol defects, not taste. The m = 4 statement would stop an
      approved run at Stage 0 by the contract's own rule S5; the H1 validation arm cannot
      reach its own falsifying outcome and would most likely end in no declared outcome at
      all; a heuristic-validation pairing that cannot fail does not meet DEC-20260928-63addc
      C5 or the dispatch bias it serves.
    - |
      The same review shows the valuable part of the design is sound: the deployed column,
      the identity, the LA term and the m = 5 window hold on two independent routes, one of
      them blind; the tripwire discipline holds; the exclusions and the proves-too-much
      controls hold. Revising, not abandoning, keeps the rank-1 selection of
      DEC-20260928-63addc moving at zero compute.
    - |
      The next act is the cheapest valid one: a zero-run revision design batch whose
      contents are fully enumerated here (R-J1-1 to R-SRC), reviewed again at
      review-breakthrough because TW-01 still binds.

