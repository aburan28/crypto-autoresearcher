      owner: later /run session
      blocking: false
    - id: NA-3
      action: >-
        Do not merge commit d33ddeb0a / do not open a PR that rewrites
        specification.yaml, H-QSP-411d8f, or TASK-20260917-66ec2b. If a
        session proposes that rewrite, point it at this decision and
        CORR-20260917-eb2d68.
      owner: coordinator
      blocking: true
    - id: NA-4
      action: >-
        SUCCESSOR DESIGN for the m>=3 Groebner ladder remains
        DEC-20260917-f37ca4 NA-3; this amendment does not add those cells.
      owner: coordinator
      blocking: false

  knowledge_promotion:
