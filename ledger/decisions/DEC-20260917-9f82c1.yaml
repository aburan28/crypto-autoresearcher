coordinator_decision:
  id: DEC-20260917-9f82c1
  recorded_at: '2026-09-17'
  question_id: RQ-QSP-f9bbdb
  experiment_id: EXP-QSP-82a906
  hypothesis_id: H-QSP-411d8f
  evidence_id: null
  supersedes_decision: null
  follows_decision: DEC-20260917-f37ca4
  archived_by: TASK-20260917-294b29
  kind: protocol_amendment_approval

  context: >-
    PR #1272 merged EXP-QSP-82a906 v1 as f9270be7a. Cursor Bugbot then
    filed two medium findings against the frozen contract: (1) stage_2
    treats a single (n,d) all-zero lambda list as G2, while official G2
    is n-scoped; (2) S4 and TASK-20260917-66ec2b's completion_gate demand
    all 20+8 cells while the G1/G2 stop aborts unopened n and still names
    that a successful scoped refutation. Both defects are present in the
    bytes bound by ledger/archives/TASK-20260917-5bb67b.yaml (spec sha256
    f13af6730b8252ca3c3937ad3ff32e301bed676290d0f052f47e98cb02e66ebc).
    No run of this contract has executed. AGENTS.md forbids rewriting a
    frozen specification, hypothesis, or archived handoff in place; the
    required instrument is a versioned protocol_amendment. Bugbot Autofix
    agent bc-f081dbfb (commit d33ddeb0a on cursor/qsp-h-supersede-3d0a)
    rewrote those three files after the merge; that rewrite is
    CORR-20260917-eb2d68 and is refused as the official repair. This
    decision approves experiments/EXP-QSP-82a906/amendments/v2.yaml as
    contract version 2.

  decision: approve

  decision_scope: >-
    APPROVES EXP-QSP-82a906 VERSION 2 (amendments/v2.yaml) ONLY, under the
    standing user authorization of 2026-09-06, as a consistency correction
    to DEC-20260917-f37ca4's already-approved v1 contract. DOES NOT edit
    specification.yaml, H-QSP-411d8f, or TASK-20260917-66ec2b. DOES NOT
    move H-QSP-411d8f or H-QSP-645a07. DOES NOT launch the executor.
    DOES NOT take Autofix commit d33ddeb0a. DOES NOT add cells, change
    thresholds, or re-score any run (none exist). Approval of the
    amendment authorizes the same measurement DEC-20260917-f37ca4
    authorized, with G2 and S4 made internally consistent, and asserts
    nothing about H1.

  target_ids:
    - EXP-QSP-82a906
    - H-QSP-411d8f
    - TASK-20260917-66ec2b
    - TASK-20260917-294b29
    - CORR-20260917-eb2d68
    - DEC-20260917-f37ca4
    - RQ-QSP-f9bbdb

  rationale:
    - >-
      PROTOCOL READINESS OF v1 WAS INCOMPLETE ON TWO GATES. DEC-20260917-f37ca4
      recorded that success and falsification criteria were decidable from
      the listed metrics. They are not, as written: S4 cannot hold on the
      G1/G2 stop the same file orders, and stage_2 can fire G2 on a slice
      that leaves median_rho undefined so S5/G1 cannot be computed. An
      incomplete protocol is completed; it is not executed. Completing it
      by amendment, not by rewriting the frozen file, is AGENTS.md core
      rule 4.
    - >-
      G2 STAYS n-SCOPED. H-QSP-411d8f G2 already requires both medians < 1/4
      or every chain cell at that n identically zero. The defect is only
      stage_2's (n,d)-scoped trigger. A wiped (n,d) is ZERO TAIL / M7;
      median_rho(n,d) is undefined; G1 is inapplicable unless both medians
      are defined; G2's zero-cell clause requires d=2 AND d=3. No threshold
      is moved.
    - >-
      A CERTIFIED G1/G2 STOP IS SUCCESS. The stop exists so the scoped
      claim does not spend a second n once H1 is already refuted at these
      cells. Scoring that stop as an S4 failure would make the valuable
      outcome an unsuccessful experiment. S4/S5 and the executor gate are
      evaluated on opened n; unopened n are unfinished-by-stop, never
      infrastructure (AGENTS.md rule 3: a deliberate stop is not a crash).
    - >-
      AUTOFIX REWRITE IS NOT THE REPAIR. Commit d33ddeb0a changed three
      paths whose sha256 values are binding fields of a completed archive.
      An identifier or byte rewrite of a completed archive's bound paths
      breaks that archive (AGENTS.md rule 15 analogue for content). The
      semantic content of that commit is the same G2/S4 reading this
      amendment records; the process is not. CORR-20260917-eb2d68 names
      the commit so a later session does not merge it.
    - >-
      STANDING AUTHORIZATION. User instruction 2026-09-06 already approves
      experiment design. This amendment does not ask the user to re-approve.
      It does not expand scope.

  evidence_refs: []

  limitations:
    - >-
      No observation. This decision does not assert that H1 holds or fails.
    - >-
      TASK-20260917-66ec2b remains the executor card. Its archived text still
      names version 1 and the all-cells S4 gate; the amendment's binding
      clause is how that card is executed. The card is not rewritten.
    - >-
      Autofix commit d33ddeb0a remains reachable on cursor/qsp-h-supersede-3d0a.
      Refusing it from main does not delete it.

  next_actions:
