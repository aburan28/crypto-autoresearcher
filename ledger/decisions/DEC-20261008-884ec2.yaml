  rationale:
    - >-
      RCF-Bind has T1, T3, T4, and T5 breaks plus an inconclusive T2.
      Supplying its missing public noncentral sampler would not repair
      every-basis inversion, message recovery, smaller-witness factorization,
      complete-ring extraction, or complete-view syntax.
    - >-
      BDEB has T2, T3, T4, and T5 breaks plus an inconclusive T1. Its
      publicly enumerable scalar support is load-bearing for its inverse;
      replacing it requires a new sampler, inverse, reduction, and view rather
      than a bounded correction.
    - >-
      The shared sampler-plus-reconstruction theorem family joins multiple
      missing mechanisms and is therefore a future research objective, not
      the single optional revision allowed by this batch.
    - >-
      Skipping the revision applies methodology step 6 and avoids presenting
      an encoding-only repair as a security-relevant candidate.
