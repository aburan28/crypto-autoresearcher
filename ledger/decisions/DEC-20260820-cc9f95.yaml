  context: 'BATCH-46254b closed (DEC-20260810-1163ec) with the gate package accepted passed_with_defects
    and the red team''s verdict that BCP-1''s blindness guarantee is PARTIAL, recorded as the result.
    Its consequence F-4: no blind calibration run is dispatchable under BCP-1 because the canonical serialization
    of pre_registered_expected_answer_digest is undefined (the INV-7 pre-dispatch gate is undecidable),
    and the md5_collision_pair certificate kind does not exist in harness/runner.py. This decision opens
    BATCH-312472 — batch 2 of the 7-batch campaign budget — whose single purpose is to make the calibration
    dispatchable: author BCP-2, the superseding protocol record under a new id (BCP-1 is immutable), and
    implement the certificate kind and wrapper-measured timing in the runner, each under its own independent
    review. The blind calibration search is STILL NOT IN THIS BATCH: it opens in batch 3 or later, after
    BCP-2 is frozen and its pre-dispatch gate is decidable, and it rides its null-object control. Nothing
    in this batch asserts anything about MD5.'
  scope:
    in_scope:
    - 'Authoring protocol/BCP-2.yaml — a complete superseding protocol carrying the ranked amendments
      of DEC-20260810-1163ec F-4: (a) pin exactly one byte-for-byte canonical serialization for the pre-registered
      digest — the serialization the committed quarantine MANIFEST already declares, pinned verbatim with
      its PyYAML- specificity acknowledged as a declared limitation; (b) specify the md5_collision_pair
      certificate schema and its two-implementation independence rule against the pinned IMPL-1/IMPL-3
      pair; (c) give the null-object comparison a named tolerance and a named baseline with a decidable
      decision table; (d) require the confound caveat in the evidence record for any success; (e) require
      wrapper-measured wall_seconds; (f) correct the staging-rules reference (RULES in kb/src/crypto_kb/ingest/repo_corpus.py).
      BCP-2 must carry forward BCP-1''s firewall (quarantine marker, CONSUMPTION rule, pre-registered
      digest workflow, closed hash-manifested input set), its ordering guarantee (frozen before any calibration
      run), and its declared- not-checked list (the parametric channel remains declared-not-checked, with
      the named obstruction carried forward).'
    - Implementing, in harness/runner.py, the md5_collision_pair certificate kind and wrapper-measured
      wall_seconds, with a logic-level self-test suite (mock implementations for the true path; real known-false
      objects for the false paths). No batch 2 task reads the quarantined payload.
    - An independent red team on the frozen BCP-2 + runner kind under a pre-committed review plan, and
      an independent validator verifying dispatchability (the pre-dispatch gate must be mechanically evaluable
      against the committed quarantine state).
    - The usual archives and the closing ledger record.
    out_of_scope:
    - The blind calibration search itself (batch 3 or later; OPEN AND UNATTEMPTED until then).
    - Any re-run of the calibration, any cost measurement of a search, any comparison against published
      results, any statement about MD5's collision or preimage security.
    - Editing BCP-1 or any committed BATCH-46254b record. Corrections are new records under new ids.
    - 'Re-pinning the quarantined payload''s pre-registered digest. BCP-2 pins the serialization the committed
      MANIFEST already declares, so the existing digest stands. If BCP-2''s author argues for a different
      serialization, the batch HALTS and reports: changing it requires a superseding MANIFEST record,
      which this batch''s ceiling does not cover.'
