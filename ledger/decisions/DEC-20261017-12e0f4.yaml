          No sequenced lift exists in this round. The blind re-derivation is
          its own task (the checker's native separate-owner pattern), blind
          throughout to every blind_from path, and it owns an explicit joint
          (RB). The joint owner is not a re-deriver, so it may read the
          predecessor report, which is the object under review, from the
          start. blindness.lifted_for is empty. A clean
          tools/check_review_independence.py run is therefore attainable
          without a composer ruling (contrast DEC-20261017-435b01
          independence_ruling and T-1).
      - id: LD-1 (from the TASK-20261017-517bbe receipt, deviation 2)
        how: >-
          Every claim release in this batch carries --artifact
          <path>=<64-hex sha256> for every declared artifact, computed by the
