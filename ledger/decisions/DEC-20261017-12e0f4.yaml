          coordinator_prior field is a pointer (the checker needs it
          non-empty). Both cards forbid reading this decision; for the
          re-deriver it is in blind_from. eb9601 LA-7 checks the marker.
          Attack plans name candidate break points to test, never an expected
          verdict or a probability.
      - id: LS-2
