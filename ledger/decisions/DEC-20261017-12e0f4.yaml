  # --------------------------------------------- proof-oriented dispatch gate
  proof_oriented_dispatch_gate:
    note: >-
      agents/coordinator.md "Proof-oriented dispatch gate" and
      docs/inventor-protocol.md section 8 (KN-TECH-080), applied to the object
      S-1 dispatches for review: the CU-9 group derivations and the J4
      adequacy argument. The four cheap audits are written into the joints'
      attack plans of REVIEW-MONO-20261017-8aff64 and into the blind
      re-derivation's parameters. This map is the Coordinator's gate record;
      it is not a claim.
    proof_search_map:
      bottleneck: >-
        The step "no product of a nonempty subset of f(x_1), ..., f(x_{m-1})
        is a square in the base field" (ordered base: K(x_1..x_{m-1});
        symmetric base: K(x_1..x_{m-1}) over K(e_1..e_{m-1})), together with
        generic distinctness of the 2^{m-2} root values x(P_1 + sum eps_i
        P_i). Both groups follow from it; the delta-rule is its
        specialization to F_p-points of the ordered base.
      baseline_embedding:
        parameter_slice: >-
          m = 3: the ordered-base group must be Z/2 = S_2 acting on two roots,
          matching the committed m = 3 S_2 statement (KN-FIND-c41ea9 m = 3
          sections, which stand). m = 4 symmetric base: the group must be S_4,
          matching EXP-MONO-0e6e8f M1 (H-MONO-ebd400; DEC-20260904-dd58c3).
        reproduction_check: >-
          Required of both reviewers (RA-1, RA-2 attack plans; blind
          re-derivation parameters): reproduce both slices before believing
          any m >= 5 statement.
      observation_collision:
        observable: Frobenius cycle types on fibres over F_p-points of the base.
        distinct_preimage_search: >-
          Cycle-type SUPPORT does not identify the group: at m = 4 the
          regular V_4 and the order-2 group generated by one double
          transposition both show only 1^4 and 2^2. Only Chebotarev
          FREQUENCIES (identity class about 1/4 versus 1/2) or the derivation
          separate them. Both review cards require frequencies, not support,
          as the empirical check.
      constructive_transforms:
        - transform: observable_fiber
          proposed_object: >-
            Hold the base fixed and vary the curve over j = 0, j = 1728 and a
            supersingular curve: the claim is uniform in the curve, so any
            curve-dependent invariant that changes the group is the break.
          predicted_gain: A curve-uniformity test at the curves most likely to break it.
      quantifier_order: >-
        For every prime p > 3, for every nonsingular E/F_p, for every m >= 3:
        the GENERIC monodromy group (over the function field of the base) is
        G_m. The witness (the derivation) may depend on m but on no curve,
        prime, specialization or seed. The claim does not quantify over
        specializations: on proper closed subvarieties the group may shrink
        (proves-too-much object PT-2).
      method_ceiling:
        strongest_certifiable_claim: >-
          A sampling census at toy primes can bound the group from below
          (observed cycle types) and test Chebotarev frequencies; it can never
          certify uniformity in the curve or every m. Uniformity rests on the
          derivation alone; measured corroboration covers only the curves,
          primes and m sampled.
        nearby_object_control: >-
          PT-1 (generic points of E^{m-1}: group trivial), PT-2 (the [2]-graph
          subvariety: group shrinks), PT-3 (square-discriminant cover of the
          symmetric base at m = 4: A_4, not S_4).
      proof_obligations:
        - claim: The bottleneck independence statement, for both bases.
          responsibility: correctness
        - claim: Generic distinctness of the root values (faithfulness and regularity of the image).
          responsibility: correctness
        - claim: Image and kernel of Z/2 wr S_{m-1} on sign classes; orders at m = 4..7.
          responsibility: size
        - claim: Delta-rule as the specialization at unramified F_p-points.
          responsibility: interface
        - claim: Arithmetic group equals geometric group (no constant-field extension).
          responsibility: scope
        - claim: Reading of criterion (a) anchored in committed text (RA-4).
          responsibility: scope
      not_applicable_reason: null

