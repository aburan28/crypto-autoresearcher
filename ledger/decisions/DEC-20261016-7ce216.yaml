coordinator_decision:
  id: DEC-20261016-7ce216
  context: >-
    tools/experiment_execution.py refused to launch four approved, frozen
    experiments with "handoff archive coverage missing: .../launch.json". Its
    admission check requires every file the supervisor generates (launch.json,
    execution-receipt.json, command.txt, environment.json, stdout.log,
    stderr.log, check.stdout.log, check.stderr.log) to be listed in the
    executor task's artifact_paths in the experiment's queue.json. Each queue
    listed only manifest.yaml and raw-result.json. The runs had first been
    executed outside the supervisor and lacked provenance (reviews
    DEC-20261016-8d3f61, -5d2fb8, -a3f58d, -6b0e53; return handoffs
    TASK-20261016-b7c94e, -5e81c3, -c8a7f2).
  decision: revise
  decision_label: >-
    ADDITIVE QUEUE REVISION: add the eight supervisor-generated run files to
    the executor task's artifact_paths in four queues, so the frozen trial
    plans can run through the supervisor. User-authorized on 2026-10-16.
  target_ids:
    - EXP-SEMBIN-22a1a2
    - EXP-SEMBIN-7c8e98
    - EXP-ECDLP-6f869c
    - EXP-ECDLP-422afc
    - TASK-20261012-f0ad45
    - TASK-20261012-d17d69
    - TASK-20261012-ec55fb
    - TASK-20261012-f63559
  rationale:
    - >-
      The change is additive and archival only: artifact_paths gained eight
      entries per task under the run directory already listed (2 to 10). No
      trial plan, specification, budget, approval, handoff.execution binding,
      write_scope or state changed, so every trial-plan sha256 binding and
      every approval stands.
    - >-
      Each added path lies inside the task's existing write_scope
      (experiments/<EXP>/runs), is an exact file path, is owned by no other
      task, and is covered by the snapshot task's read_scope, as
      tools/research_dispatch.py requires.
    - >-
      Without the supervisor's launch, receipt, environment and log files a
      run cannot meet the run-record schema, so the amendment is what lets
      these runs become citable evidence at all.
  evidence_refs:
    - experiments/EXP-SEMBIN-22a1a2/queue.json
    - experiments/EXP-SEMBIN-7c8e98/queue.json
    - experiments/EXP-ECDLP-6f869c/queue.json
    - experiments/EXP-ECDLP-422afc/queue.json
    - tools/experiment_execution.py
    - experiments/EXP-SEMBIN-22a1a2/runs/RUN-SEMBIN-a818df/execution-receipt.json
    - experiments/EXP-SEMBIN-7c8e98/runs/RUN-SEMBIN-9ecb77/execution-receipt.json
    - experiments/EXP-ECDLP-6f869c/runs/RUN-ECDLP-3d61b8/execution-receipt.json
    - experiments/EXP-ECDLP-422afc/runs/RUN-ECDLP-06bb83/execution-receipt.json
  limitations:
    - >-
      This record is written after the fact: the three sibling queue edits
      merged in PR #2292 and the EXP-SEMBIN-7c8e98 edit rides PR #2302.
    - >-
      The immutable ledger handoff records for the four executor tasks still
      list only manifest.yaml and raw-result.json; this decision supersedes
      them on the archive set without editing them.
    - >-
      The snapshot archive tasks for these experiments (TASK-20261012-88f496,
      -bb2dfb and -507b46 for the three sibling queues; the EXP-SEMBIN-7c8e98
      queue's archive task was not identified here) must now also stage the
      eight generated files per run.
    - >-
      Other approved queues written by the same generator likely carry the
      same gap; they were not surveyed.
  next_actions:
    - >-
      All four runs were executed through the supervisor, are
      output_validated, and have raw-result.json byte-identical to the
      reviewed unpublished runs, so DEC-20261016-8d3f61, -5d2fb8, -a3f58d and
      -6b0e53 stand. Close return handoffs TASK-20261016-b7c94e, -5e81c3 and
      -c8a7f2 as satisfied.
    - >-
      Run the snapshot archive for each experiment including the generated
      files.
    - >-
      Fix the queue generator so new executor tasks list the supervisor's
      generated files.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Process amendment to coordination artifacts; no research claim changed.
  decided_by: coordinator
  decided_at: '2026-10-16'
