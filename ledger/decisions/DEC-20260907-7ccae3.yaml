  context: >-
    Per DEC-20260907-9f03cf's next_action, a second EXP-RELN-82f487
    measurement cell (curve_seed 102, base_seed 202, training_seed 302,
    handoff TASK-20260907-8b29e0) tested whether the first cell's F1/gnn
