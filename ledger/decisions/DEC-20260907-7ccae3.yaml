    same one twice.
  decision: inconclusive
  target_ids:
    - EXP-RELN-82f487
    - H-RELN-10ad6b
    - EV-RELN-99c688
  rationale:
    - >-
      Neither cell reaches a decidable branch classification (each is a
      single rung, and each trips at least one of the contract's own
      blocking gates); `inconclusive` is the only decision consistent with
      the contract's decision tree for both.
    - >-
      The specific hypothesis this second cell was designed to test (does
      F1/gnn's disagreement replicate) has a clear, negative answer: it
      does not. That is itself a useful, reportable result, distinct from
      "nothing was learned" -- it rules out a genuinely reproducible
      F1/gnn-specific defect as the sole explanation, and redirects
      attention to the pattern across cells (a different near-threshold
      statistic fails each time) rather than one fixed bug.
    - >-
      H-RELN-10ad6b's status remains proposed. No claim is made about GNN
      structure, tree structure, or representation-decidable clustering
      from either cell.
  evidence_refs:
    - EV-RELN-99c688
    - EV-RELN-cc045d
    - experiments/EXP-RELN-82f487/runs/RUN-RELN-82f487-N14-sigma8-seed2/stage4_analysis.json
  limitations:
    - >-
      This decision does not determine whether the cross-cell "some gate
      always fails" pattern is ordinary statistical fluctuation at tight
      tolerances or a systematic pipeline-variance issue; EV-RELN-99c688's
      unresolved_confounds names a third-seed cell as the concrete
      discriminating follow-up, left for a future task.
    - This decision does not touch EXP-RELN-f202be or EXP-RELN-141a86.
  next_actions:
