  # ======================================================================
  rationale:
    - >-
      THE GOAL HEAD'S next_action IS THE CONTRACT AND IT IS EXECUTED, NOT
      RE-LITIGATED. It names family (d) and the ablation battery as a standing
      control under a charged run with a manifest, declared seeds and an armed
      deadline, reporting WHICH ABLATIONS THE SUITE DETECTS rather than that the
      null passed. This batch is exactly that and adds nothing that is not
      instrumental to it.
    - >-
      A CONTROL WITH ONLY ONE ANSWER IS THE O5 FAILURE EXACTLY, so family (d) is
      specified TWO-SIDED: k = 0 is a declared arm whose known answer is MEMBER,
      and k >= 1 is NON-MEMBER. A degenerate always-reject adjudicator fails the
      k = 0 arm, CTL-PLANT, and the permissive side of every two-sided decoy; a
      degenerate always-accept adjudicator fails every k >= 1 draw and the whole of
      CTL-NULL. Neither degenerate can pass this batch.
    - >-
      THE ABLATION MECHANISM IS CHANGED ON PURPOSE AND THE CHANGE IS DECLARED IN
      ADVANCE. The round-1 battery edited serialize(); this contract forbids any
      edit to a committed module and instead applies a declared PROJECTION that
      drops named pairs from the serialised key tuple, INSIDE the orbit
      minimisation. That keeps the measured instrument byte-identical to the
      reviewed one (CTL-FROZEN re-verifies every harness digest after the last
      run), at the cost that a disagreement with round 1 localises to the
      mechanism. The prior records that cost as a MODERATE rather than STRONG
      prediction, in advance.
    - >-
      THE BATTERY IS EXTENDED TO THE COMPLETE DEPTH-1 LATTICE BECAUSE THE
      OBSTRUCTION SAID SO ABOUT ITSELF. EV-DIFFP-b878aa records that "2 of 5" is a
      point estimate over a hand-chosen five-element sample, not a rate with a
      confidence interval, and that the variability that would matter is across
      seeds and across ablation choices. Exhausting depth 1 removes the
      ablation-choice variability at that depth entirely. The six declared rows are
      reported FIRST and SEPARATELY, so the replication the closing decision asked
      for is never conflated with the extension.
    - >-
      MEASURING PRECEDES REPAIRING, AND THE RANKING IS ADOPTED ON ITS ARGUMENT
      RATHER THAN INHERITED. Fixing VD-3, VD-4, OBJ-3, OBJ-4 and OBJ-10 first would
      produce a repaired adjudicator whose repair is ATTESTED rather than MEASURED,
      because the suite that would have to detect a regression is measured to
      detect 2 of 5 ablations. This batch produces the artifact that makes those
      repairs checkable, and it also measures the {E4}/{E5} zero-image result
      (CTL-GEN-ACT) and the VD-3 read path (the D-VD3-PROFILE arm) so that batch
      3's repair has a baseline to regress against.
    - >-
      ACQUISITION IS STILL THE CAMPAIGN'S BINDING CONSTRAINT (round-1 prior P-5,
      corroborated by J7) AND IS STILL NOT THE NEXT ACTION. An instrument whose
      control suite cannot see the primary datum of a differential characteristic
      must not be the first thing a newly acquired published path meets; that
      verdict would be the first artifact in this goal with a downstream consumer
      and would be unfalsifiable in exactly the way P-1's zero would have been
      without a scanner positive control. Acquisition does not become cheaper by
      waiting one batch; the verdict it produces becomes trustworthy.
    - >-
      THE ROUND IS REVIEWED BY A SIBLING-BLIND VALIDATOR AND RED TEAM PAIR, AND
      THE COORDINATOR'S FIRST SHAPE WAS WRONG IN A WAY WORTH RECORDING. This
      decision's first composition specified ONE reviewer, on the argument that
      this batch's adversarial objects are PRE-REGISTERED INSIDE THE CONTRACT --
      the battery is the known-false-instrument control, the delta_m-blind
      adjudicator is a declared row with a pre-registered outcome, family (d) is
      two-sided by construction, and the depth-1 lattice is exhaustive -- so the
      marginal value of an adversary was lower than usual while the marginal value
      of integer-reproduction and attribution checking was high.
      THAT ARGUMENT HAS THE SHAPE OF THE VERY FAILURE THIS BATCH EXISTS TO MEASURE.
      "The adversarial objects are declared, therefore the adversary has nothing to
      add" is "the controls passed, therefore the adjudicator discriminates", one
      level up, applied to a review architecture instead of to an instrument. And
      this goal holds a measured counterexample to it: O5 -- the delta_m-blind
      adjudicator, the finding that defined BATCH-f8bf86 -- was ADDED BY THE
      REVIEWER and was not on the plan's list; it "became constructible only after
      reading the committed source". Every CTL-ABL row in this contract is DERIVED
      FROM that object. Pre-registration did not produce it; an adversary did.
      DECISIVELY: THIS CONTRACT CREATES A NEW CLAIM THAT NO OBJECT IN IT ATTACKS.
      The pre-registered rows measure the OLD suite's power. The STRENGTHENED suite
      (old + family d) is a new instrument, and its proves-too-much object -- is
      there an instrument that PASSES the strengthened suite and is still
      known-false? -- is by construction absent from the contract, because the
      contract's author is the one who would have had to imagine it. Deferring that
      object to batch 3 would have shipped this batch's headline claim un-attacked,
      and a batch-3 pass could not have been blind: EV-DIFFP-b16b01 and
      DEC-20260824-c5bb72 would already be committed, so the adversary would attack
      a claim after reading the Coordinator's own composition of it. A deferred
      adversarial pass is strictly weaker than a concurrent blind one, and that
      degradation was not visible in the first composition.
      THE COST IS PAID NOW RATHER THAN ADDED. Per-reviewer budgets go to 600 s each
      rather than the 720 s a single reviewer carrying both joint sets was given,
      because the joints now split across two sessions; batch 2 declares 3480 s
      instead of 3000 s; and batch 3 no longer carries the deferred pass it would
      have had to fund anyway. The net campaign cost is near zero and the round
      gains mutual blindness, which cannot be bought later at any price.
    - >-
      NO PATH IS CLAIMED NEW, NO CRYPTANALYTIC IMPROVEMENT IS CLAIMED, NO SEARCH IS
      AUTHORISED, NO ACQUISITION IS AUTHORISED, AND THE MD5 LANE IS BLOCKED RATHER
      THAN CLOSED. A passing control is not an improvement, and a control suite that
      detects more ablations is a better instrument and not a result about MD5 or
      SHA-1.

  # ======================================================================
  review_architecture:
    shape: >-
      TWO INDEPENDENT SESSIONS, MUTUALLY BLIND, ON DISJOINT JOINT SETS, both under
      policy review-adversarial at reasoning_effort xhigh with
      independent_session_required true. TASK-20260824-b61d11 (Validator) and
      TASK-20260824-e9d21a (Red Team). Both depend on the snapshot archive
      TASK-20260824-7175d9 and both are sources of the single ledger archive
      TASK-20260824-b3e02b.
    the_boundary_stated_so_no_joint_is_unowned_or_double_owned: >-
      THE VALIDATOR OWNS WHETHER THE REPORTED NUMBERS ARE WHAT THE CODE PRODUCES
      AND WHETHER THEY ARE SCOPED HONESTLY. THE RED TEAM OWNS WHETHER THE
      CONCLUSION DRAWN FROM THEM SURVIVES OBJECTS FOR WHICH IT IS KNOWN FALSE.
      On the one joint where they come closest -- component attribution -- the
      split is explicit: the Validator checks that the producer's attribution is
      CORRECT; the Red Team checks whether correct attribution is SUFFICIENT for
      the power claim the batch wants to make.
    validator_owns:
      - Cold-re-run reproduction to exact integer agreement, including whether E6 step_range (0,0) produces 2089 or 2094.
      - >-
        Ablation genuineness: same committed class, same census, named pairs
        dropped by the declared projection, projection applied INSIDE the orbit
        minimisation, and whether inside and outside differ.
      - The six declared battery rows against their pre-registered values.
      - Whether the producer's per-draw component attribution is correct.
      - Two-sidedness and capacity to fail: T1..T5 on both sides, and whether the k = 0 MEMBER arm is really adjudicated rather than assumed.
      - CTL-GEN-ACT's {E4}/{E5} result, with generator ACTION kept distinct from generator VERIFICATION status.
      - Scope: the obstruction as a measurement, the absence of a bare fraction, of a "the null passed" summary, of a distance read as a margin, of a novelty claim, of a cost projection, of an acquisition, of a modified harness file, and of any statement closing the MD5 lane.
    red_team_owns:
      - >-
        R-a PROVES-TOO-MUCH ON THE STRENGTHENED SUITE, AND IT IS THIS ROUND'S
        LOAD-BEARING JOINT. Construct an instrument that PASSES the strengthened
        suite (CTL-PLANT + CTL-NULL families a,b,c + CTL-NULL-D) and whose
        conclusion is KNOWN FALSE. The plan's candidate list is a FLOOR, NOT A
        CEILING, and a break it did not anticipate is worth more than one it did:
        an adjudicator blind to a depth-2 component subset the lattice does not
        reach; one that reads only `dv_seed_window`, i.e. VD-3's mechanism promoted
        from defect to design; one blind to `block_index`; one keyed on a LOSSY
        FUNCTION of the message difference (the set of differing word indices, or a
        weight) rather than its value, which can pass many family-(d) draws while
        identifying paths with different differences.
      - >-
        R-b THE OBSTRUCTION REVERSAL (agents/red-team.md responsibility 8): which
        theory takes this batch's measurement as its HYPOTHESIS rather than its
        refutation? Round 1's reversal produced family (d) itself; the analogous
        reading here is what a per-component power profile ENABLES that a pass/fail
        suite does not. File any spawned successor as a candidate for the ranking,
        never as evidence.
      - >-
        R-c THE CLOSURE ATTACK, symmetric with overclaiming. Is any lane being
        quietly closed by a fatigue report wearing a number -- the MD5 lane, the
        `in_linearized_code` component declared "unprobed", depth >= 2, the second
        seed set? Is "the strengthened suite detects X" stated more widely than it
        was measured?
      - >-
        R-d THE COMPOSITIONAL-INVARIANT AND NEARBY-OBJECT ATTACK ON FAMILY (d)
        ITSELF. Mutate one component of the perturbation construction and find
        where it stops probing what it claims. INDEPENDENTLY CONSTRUCT the SHA-1
        flag confound rather than accepting the producer's D-SHA1-INCODE framing of
        it -- the Coordinator predicted that confound, which is precisely why an
        adversary rather than the prediction's author should decide whether it
        bites.
      - >-
        R-e THE CHEAPEST DISTINGUISHING CONTROL: name the control that would
        separate an implementation artifact from a real gain in power, and exhibit
        at least one object this contract's author did not imagine.
    blindness: >-
      MUTUAL, BOTH DIRECTIONS, AND THE CHANNEL THAT BROKE ROUND 1 IS NOW CLOSED BY
      RULE. Batch rule BR-1 binds: while the round is open, reviewer artifacts are
      committed with a SUBJECT LINE ONLY and no findings, verdicts, mechanisms or
      integers in any commit body, PR description, bus message or branch name, and
      the plan's `blindness` block names commit messages, the merge digest and
      coordination/events/main/**. Reviewers use `git log --format=%H`. THIS MATTERS
      MORE NOW THAN IT DID WITH ONE REVIEWER: round 1's independence was broken in
      exactly this way, by a commit message body carrying the Validator's findings
      while the Red Team was still running in the same worktree, and adding the
      second concurrent session restores the precise conditions under which that
      happened.
    completion_criterion_4_status_stated_explicitly: >-
      GOAL-DIFFP-84d641 completion criterion 4 requires that INDEPENDENT VALIDATOR
      AND RED TEAM SESSIONS ADMIT each claim-relevant run package. THIS BATCH'S
      SHAPE MAKES THAT CRITERION REACHABLE, AND THIS DECISION DOES NOT ASSERT IT AS
      MET. Whether both reviewers admit the package is determined at the close by
      TASK-20260824-b3e02b on the reports it actually receives, not at the opening
      by the presence of two task ids in a queue. A reviewer that reports `breaks`
      on a joint it owns has not admitted the package on that joint, and the close
      says so plainly rather than reading the criterion off the batch shape.

  # ======================================================================
  limitations:
    - >-
      COMPLETION CRITERION 4 IS REACHABLE BY THIS BATCH'S SHAPE AND IS NOT ASSERTED
      AS MET BY THIS DECISION. Two independent, sibling-blind reviewers are
      dispatched; whether they ADMIT the package is the close's determination on
      the reports it receives. SUPERSEDES, BY REFERENCE ONLY, the first
      composition's limitation "ONE INDEPENDENT REVIEWER, NOT TWO ... completion
      criterion 4 is NOT satisfied by this batch", which was true when composed and
      ceased to be true when the driving session minted TASK-20260824-e9d21a and
      this Coordinator decided on the merits to use it. The superseded text stands
      unedited in batch.yaml `opening_decision_body_pending_mint`.
    - >-
      EVERY NUMBER THIS BATCH WILL PRODUCE IS ABOUT A 16-ENTRY SYNTHETIC SHADOW
      CENSUS at seeds 84064101/84064102, in which every planted MD5 entry carries a
      WEIGHT-1 message difference that no real MD5 collision characteristic has.
      The readable census has ZERO entries. Adjudicator correctness against a
      published characteristic remains UNTESTED and this batch does not approach it.
    - >-
      THE INSTRUMENT IS NOT REPAIRED. VD-3, VD-4, the {E4}/{E5} zero-image result,
      OBJ-3, OBJ-4 and OBJ-10 stand open. Any record of this batch that quotes the
      strict group as {E1,E3,E4,E5} must state alongside it that the group doing
      observable work on a membership decision is {E1,E3} plus one key-component
      deletion.
    - >-
      THE POWER PROFILE WILL BE SCOPED TO THE DECLARED ABLATION SET, THE DECLARED
      FAMILIES AND ONE SEED SET. Depth >= 2 component subsets beyond the two
      declared multi-deletions are unmeasured, and variation across seed sets is
      unmeasured. Exhaustiveness is claimed at depth 1 and nowhere else.
    - >-
      `closest_distance` IS A REPORTED DIAGNOSTIC, NOT A DECISION VARIABLE AND NOT
      A MARGIN, and may never be quoted as evidence about a null's difficulty
      (DEC-20260824-af6d5c successor_gates).
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`. Three of CLAUDE.md's four
      supported-promotion gates are structurally unmet by a batch of this kind and
      the fourth is not attempted. This goal carries no asymptotic-complexity claim.
    - >-
      THIS DECISION'S AUTHOR HAS NO SHELL. It ran no command, computed no hash,
      executed no code, minted no identifier and made no commit. Neither
      tools/validate_ledger.py nor tools/research_dispatch.py was run by it, and no
      output of theirs is recorded here as if it were. The commit 976a3a972, the
      7156-record validate_ledger pass and the clean dispatch render are the
      DRIVING SESSION'S measurements, reported to this session and recorded as its
      report rather than as this session's observation.

  # ======================================================================
  next_actions:
    - >-
      DISPATCH TASK-20260824-9a489e against the committed EXP-DIFFP-4b165f, whose
      approving decision is this record. Everything else is sequenced inside
      BATCH-efcae7 by its dispatch queue -- the snapshot archive alone before
      review, the review plan written after that archive and before either reviewer
      runs, the sibling-blind Validator and Red Team pair, and the ledger close
      alone after review -- and is not a second next action.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED AT A BATCH OPENING AND NOT A QUIET DROP. This is an approval
      decision, not an evidence-review decision: no observation exists yet, no
      evidence record is filed, and nothing is supported, weakened or rejected.
      Promoting anything here would promote a plan.
      THE DEFERRED ENTRY IS NAMED AND STILL OWED. DEC-20260824-af6d5c deferred a
      KN-TECH entry on ADJUDICATION AND CONTROL POWER with its content already
      specified -- the census schema with its three never-summed counts and the
      separate shadow population; the per-generator verification status TOGETHER
      WITH each generator's ORBIT ACTION; the two controls AND the ablation battery
      that measures what they can detect; the two-sided known-answer decoy design;
      and the standing warning that in an exact-key adjudicator a reported distance
      is not a margin. It is to be written at the close of THIS batch if and only
      if the closing decision is `support` or `reject_scoped` on evidence of
      strength `replicated` or `strong`; otherwise the close records a concrete
      not_warranted reason AND the fact that this is a second deferral. This
      session holds no KN-* identifier and may mint none.

