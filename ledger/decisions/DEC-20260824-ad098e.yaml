    why_the_change_was_required_rather_than_optional: >-
      The pre-mint body recorded, as a limitation, "ONE INDEPENDENT REVIEWER, NOT
      TWO ... GOAL-DIFFP-84d641 completion criterion 4 is NOT satisfied by this
