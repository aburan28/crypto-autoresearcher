      a limitation that had ceased to be true, and correcting it afterwards, would
      be exactly the "manufacture a second-hand statement" failure PD-3 records
      against this role. A decision record states what is true when it is filed.
    the_pre_mint_body_is_not_edited: >-
      batch.yaml's `opening_decision_body_pending_mint` is COMMITTED and is left
      BYTE-IDENTICAL. It is superseded ON THESE TWO BLOCKS ONLY, by reference, and
      batch.yaml carries a sibling key `opening_decision_filed` pointing here. A
      reader arriving from either end finds both texts and the reason they differ.

  # ======================================================================
  context: >-
    BATCH-f8bf86 closed `weaken` on a measured control-power obstruction: the
    declared control suite detects 2 of 5 single-component canonical-key ablations,
    and an adjudicator blind to the message difference -- the primary datum of a
    differential characteristic -- scores CTL-PLANT 96/96 and CTL-NULL 0/3000,
    identical to the honest one to the digit. The load-bearing measurements were
    single-session review-side computation with no run directory, no RUN-*
    identifier, no manifest, no armed deadline and no seed envelope
    (EV-DIFFP-b878aa UC-2), so the closing decision was `weaken` rather than
    `reject_scoped` and named replication as its one next action. This decision
    opens the batch that performs it.

  decision: approve
  decision_label_reasoning: >-
    `approve` IS THE CORRECT LABEL AND THE ALTERNATIVES ARE NAMED. This decision
    approves an experiment contract and a batch shape; it changes no hypothesis
    status, promotes nothing, and asserts nothing about MD5 or SHA-1.
    `expand` was considered and rejected: this batch does not widen the goal's
    object, it re-measures an instrument the goal already holds.
    `replicate` is descriptively accurate for the ablation battery and was rejected
    as the label because the batch does strictly more than replicate -- family (d)
    is a NEW control with a two-sided known answer, and the depth-1 lattice is an
    EXHAUSTIVE extension of a hand-chosen sample. Labelling it `replicate` would
    understate what is being approved.
    `pause` is not taken: no pause_condition of GOAL-DIFFP-84d641 is met. The
    campaign budget is not exhausted (1 of 6 batches spent); no primary source has
    been shown unobtainable; the equivalence does have a verified generating set;
    no batch has turned out to be solver validation; and no infrastructure blocker
    exists.

