  # ======================================================================
  relationship_to_the_pre_mint_composition:
    where_the_body_was_composed: >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml, key
      `opening_decision_body_pending_mint`, written by TASK-20260824-b7efbf before
