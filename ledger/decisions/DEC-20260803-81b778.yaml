coordinator_decision:
  id: DEC-20260803-81b778
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-c45baf
  recorded_by_task: TASK-20260803-4c79e7
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-03'

  decision: reject_scoped
  decision_label: >-
    Reject the row-permutation separation as evidence about the independence
    heuristic. It replicates 9 of 9, is far stronger than the producer claimed,
    and is forced by construction. Redirect batch 4 to the deciding surrogate
    and to the null that was already in the code.
  decision_vocabulary_note: >-
    `reject_scoped` and not `weaken`: the inference is removed, not reduced. The
    measurement is sound, reproduces under an independently rebuilt instrument,
    and means nothing about what it was taken to mean.

  context: >-
    Batch 3 of 6 replicated the campaign's only positive separation on all nine
    held instances, with a monotone-increasing decay control -- the
    anti-artifact signature. Its first pair of reviews was destroyed by a
    container replacement before archiving; both were re-dispatched under their
    existing identifiers and both committed their own artifacts.

  coordinator_validity_check: >-
    Both re-run reviews ran in independent sessions with nothing forwarded
    between them and nothing forwarded from the lost pass. The Coordinator
    authored no interpretive note during the review window. Both re-runs
    committed their deliverables on completion, the process change adopted after
    the loss, and both were pushed immediately.

  what_is_rejected:
    - >-
      The inference from the row-permutation separation. The red team derived,
      before measuring, that since Y[i,k] = a_k . x_i mod q the near-miss score
      is one Fourier coefficient F(e - a_k) of the x-database at a frequency
      where the database is coherent BY CONSTRUCTION -- a_k . x_i is small
      exactly because the vector is short. The real arm tends to a nonzero
      N-independent floor; the permuted arm is a product of marginals with
      spread proportional to N^-1/2. Sign and growth were fixed a priori.
    - >-
      That the effect involves sieving, or a lattice at all. Ensemble E1 -- iid
      Gaussian x with y a coordinate slice of x, no lattice, no sieve, no A, no
      modulus -- reproduces the excess (17.08), the monotone decay
      (3.05/6.05/11.21/17.16), the uniform null (0.983) and the graded contrast.
      E2 with independent y gives 1.037 and flat decay, so the instrument works.
      E3, a valid non-sieve BKZ dual family of the real A, separates at 5.43.
    - >-
      That the monotone growth is informative. It is algebraically implied by
      any fixed separation: the validator fits sd_real^2 = k/(2N') + b^2 with
      sqrt(k) equal to the surrogate's own flat value, reproducing all four
      points to under 0.4%; the red team's one-parameter fit lands within 0.2
      sigma and its lattice-free ensemble obeys the same law.
    - >-
      That the graded candidate contrast discriminates structure. It is a
      distance curve, reproduced with no lattice.
    - >-
      That the two headline statistics are two facts. r = -0.9387.

  what_survives_and_is_strengthened:
    - >-
      The measurement is SOUNDER AND STRONGER than the producer claimed. The
      validator rebuilt the instrument from scratch, regenerated instances from
      seed, and reproduced the replication and the decay with its own seeds,
      permutations and error draws. The surrogate is a genuine row permutation
      verified as exact integer multiset identities. The nine instances are
      independent draws.
    - >-
      A stronger statistic the producer did not report: the real pairing is
      strictly extremal among its 11 pairings in 9 of 9 instances, joint
      p = 4.24e-10. The aggregation rule was not chosen to flatter -- every
      alternative scoring agrees in direction.
    - >-
      ONE ALTERNATIVE MECHANISM IS REFUTED IN THE PRODUCER'S FAVOUR. The
      validator found an unreported geometric coupling
      corr(||x||^2, ||y||^2) = -0.886, ran the missing control (permutation
      within ||y||^2 bins), and the separation survived at 1.3445 / 1.2705 /
      1.3705. It is the algebraic pairing, not the norm coupling.
    - >-
      Stage B's arithmetic, re-derived by hand to 13 significant figures,
      including the ML-KEM-512 reference at 2^11.3910634600.
    - >-
      THE PRODUCER'S STAGE B REFUSAL, endorsed by both reviewers on independent
      grounds. The validator shows the Stage B pairing carrier is
      candidate-independent so the null is blind at first order, confirmed by
      SENS-1 landing on the OPPOSITE side from real under maximal removal. The
      red team adds a power argument: a 32% effect would be about 30 sigma at
      n = 3, so this is a sensitivity question, not a power failure. The PD-2
      rule caught from inside what cost batch 2 its headline.

  the_finding_that_should_have_come_first:
    statement: >-
      The heuristic's own null was already computed by the producer's code and
      never reported: BOTH ARMS SIT 7.1x AND 9.4x BELOW THE IID PREDICTION. The
      campaign spent three batches comparing two objects that both fail the test
      to each other, while the quantity that actually tests the independence
      assumption sat unreported in the same results file.
    cost_to_report: Zero compute. It is `sd_ratio_to_iid` against 1.0.
    why_this_is_the_lesson: >-
      Not that the controls were weak -- they were run, named, and passed. The
      failure is that the comparison was chosen before asking what the null
      hypothesis predicts for it. A statistic whose sign is guaranteed a priori
      is not evidence however many instances reproduce it, and replication makes
      it more convincing without making it more informative.

  coordinator_error_corrections:
    - id: CE-1
      title: >-
        I wrote "I draw no conclusion from them here" in an immutable commit
        message and then drew two.
      raised_by: RT-20260803-d2e23e OBJ-9, OBJ-10; VAL-20260803-3fc363 DEF-3, DEF-7
      what_i_wrote: >-
        Snapshot 555a5762 calls the producer's Stage B failure "the most
        encouraging thing in this package" and says "the rule adopted last batch
        worked", uses `REPLICATES` and `provably` as interpretations, drops the
        producer's local disclaimer from the ML-KEM-512 figure, states "flat to
        within 0.001" where the value is 0.001058, and reports "pooled z of
        +50.6" for a one-sample t with 8 degrees of freedom equal to 50.5456.
      why_it_is_wrong: >-
        A message that declares it draws no conclusion and then draws two is
        self-contradicting, and the reader cannot tell which sentences are the
        producer's and which are mine.
      what_the_reviewers_did_NOT_find: >-
        The red team searched for a security claim and found none anywhere in
        the message, and states explicitly that this is NOT an overclaim of the
        e08462ac kind. I record that rather than assuming the worst reading of
        my own record: the defect is self-contradiction and dropped
        qualification, not scope inflation.
      corrective_rule_adopted: >-
        A snapshot commit message either states the producer's numbers with the
        producer's own qualifiers copied verbatim and draws nothing, or it draws
        a clearly labelled Coordinator reading. Not both, and never a disclaimer
        contradicted by its own body.

  process_defect_recorded:
    id: PD-3
    title: Review artifacts were held uncommitted across a dispatch window and were destroyed.
    what_happened: >-
      The container was replaced mid-batch. The producer package survived
      because it had been committed in the snapshot archive; both review reports
      and two unarchived Coordinator drafts did not exist in any commit and were
      lost.
    corrective_rule_adopted: >-
      Reviews commit their own two files on completion and the Coordinator
      pushes immediately. Adopted and exercised in this batch: both re-runs
      committed (5ea4d1aa, cf581e53) and both were pushed on arrival.
    what_was_not_done: >-
      The lost reports were NOT reconstructed. They were two independent agents'
      work products and remembering their conclusions does not make the
      artifacts exist. The retired draft identifiers EV-MLKEM-b22280 and
      DEC-20260803-ee1cda name no archived record and are never reused.

  explicit_non_claims:
    - No ML-KEM break. No attack implemented, run, or claimed. No speedup.
    - No security proof and no security claim in either direction.
    - No FIPS 203 parameter set affected or cleared. Toy scale, rule 4 in full.
    - >-
      The independence heuristic is neither validated nor refuted. Three batches
      in, the actual question is untested; only this program's attempts have
      been refuted.
    - No exponent moved, no cost reduced, no attack improved.

  official_status_changes:
    - record: EV-MLKEM-b43de0
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-MLKEM-004 remains `active` at batch 3 of 6. EV-MLKEM-50901f is not
    superseded: its narrowest_supported_statement already scoped the separation
    to one unreplicated computation and asserted no mechanism. It is corrected
    on the merits by this record.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, and this is the third consecutive batch deferring the same
      candidate, which now needs saying plainly. The technique -- "before
      measuring a contrast, derive what it must be under the null you are not
      testing; a statistic whose sign is guaranteed a priori is not evidence
      however many instances reproduce it" -- is real, transferable, and now
      supported by three distinct failures in this campaign. It is deferred once
      more, and once more only, because the honest entry needs the successor
      observable to exist: an entry that says "we measured the wrong thing three
      times" without exhibiting the right measurement is a confession, not a
      technique. IT IS PROMOTED IN BATCH 4 REGARDLESS OF OUTCOME -- if the
      deciding surrogate settles the lane, the entry documents the whole arc;
      if it does not, the entry documents the method that got there. Deferring
      it a fourth time would be avoidance. The two promotions inherited from
      GOAL-MLKEM-003 remain rule-12 blocked.

  ranking_rationale: >-
    Batch 4 CHANGES rather than continuing or closing. The red team is explicit
    that its objection blocks one comparison, not the question, and closing
    would be premature closure on a lane whose actual question has never been
    tested. Continuing as planned would produce a larger number for a forced
    reason.

  limitations:
    - >-
      The collapse derivation is first order; it identifies the dominant
      mechanism without accounting for every residual.
    - >-
      Seven validator checks are `unable_to_check` -- timings, memory, smoke-run
      counts, stage ordering -- because the container replacement destroyed the
      producer's scratch space. That is a real cost of the incident and is not
      recoverable.
    - >-
      Every participant across batches 1-3 resolves to claude-opus-5.
      Independence is procedural, not model-level.

