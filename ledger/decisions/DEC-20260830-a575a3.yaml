    - TASK-20260830-d85fdf
    - TASK-20260830-df363d
  rationale:
    - >-
      DISPOSITION AND EXACT SCOPE. The disposition is scoped REVISE, applying
      to this package only (the BATCH-820ee8 runtime-harness attachment
      package: receipt-schema-v2.yaml, emit_procedure.md, emit_host_binding.sh,
      demo-receipt.json, stop-control-report.yaml, runtime-session-receipt.json,
      snapshot commit af9b1a5fd4e9b97bc025d28cd6c86bb4920c2534).
      J1-schema-v2-semantics-and-v5-consistency HOLDS (validator
      TASK-20260830-78281a) and J3-stop-control-integrity-and-escape-surface
      HOLDS (red-team TASK-20260830-d85fdf); these two joints are not
      re-litigated by the successor repair batch. J2-emit-procedure-
      verifiability-and-demo-reality BREAKS on RT-J2-O1 (PATH manipulation,
      material, open, undisclosed). The J2 break is not outvoted: it stands and
      drives the REVISE disposition. No downstream implementation or experiment
      authorization follows from this decision.
    - >-
      J1 HOLDS. The validator report (VAL-20260830-78281a,
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-78281a/validation-report.yaml)
      confirms the v2 schema is a faithful, non-weakening extension of v1 and
      the v5 closure's authoritative-binding rule. All three added host_binding
      fields carry declared provenance, verification semantics, and failure
      behavior. The v5 STOP is preserved at the binding-rule layer on
      caller-supplied and missing bindings. The one named weakening (v2
      schema-validity does not imply v5 binding-rule satisfaction) is disclosed,
      not hidden. Backward compatibility claims are accurate against both v1
      corpus receipts on disk. The blind re-derivation AGREED on all three
      host_binding values (host_id: Adams-MacBook-Pro.local, filesystem_id:
      /dev/disk5s1, filesystem_mount: /Volumes/SSD990), which is recorded
      evidence the demo values are real, not hand-written.
    - >-
      J3 HOLDS. The red-team report (RT-20260830-d85fdf,
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-d85fdf/red-team-report.yaml)
      confirms the v5 STOP fires correctly in all three required cases
      (caller-supplied, missing, v1-under-v2), with the named weakening
      disclosed and correct. No new v2-specific escape was found that defeats
      the binding rule when it is actually evaluated. The empty-string/null gap
      (RT-J3-O1) is a non-blocking observation about the missing_receipt_field
      rule's coverage: it fires on absence, not on emptiness or null, but the
      binding rule catches these values via inequality if evaluated.
    - >-
      J2 BREAKS. The red-team report returns BREAKS on
      J2-emit-procedure-verifiability-and-demo-reality. The break is on
      RT-J2-O1 (material, open): emit_host_binding.sh resolves hostname and df
      through PATH, so a caller who prepends fake binaries to PATH makes the
      procedure emit caller-controlled values for all three host_binding fields
      THROUGH the procedure. This was confirmed by execution: a fake hostname in
      PATH made the script emit host_id="caller-controlled-hostname"; a fake df
      in PATH made the script emit filesystem_id="/dev/fakedev" and
      filesystem_mount="/mnt/fake". This contradicts the provenance claim in
      receipt-schema-v2.yaml ("never read from caller input, environment
      variables the caller controls, or repository state") and the claim in
      emit_procedure.md ("a caller can no longer supply arbitrary host_binding
      values THROUGH the emit procedure"). PATH IS an environment variable the
      caller controls, and PATH manipulation IS a way to supply values through
      the procedure. This is within the v5 threat model (caller-supplied
      bindings) and is NOT disclosed in the package. The required repair is
      absolute-path command resolution OR an explicitly narrowed provenance
      claim that PATH is trusted infrastructure.
    - >-
      HOST-BINDING-ENFORCEABILITY is NARROWED but less than the package claimed,
      and NOT closed. Against the v5 threat model (caller-supplied bindings):
      the emit procedure removes the caller's ability to supply values through
      the SCHEMA, but the PATH manipulation finding (RT-J2-O1) shows a caller
      CAN supply values THROUGH the PROCEDURE by controlling PATH. The
      package's claim "a caller can no longer supply arbitrary host_binding
      values THROUGH the emit procedure" is FALSE. Against a malicious-runtime
      threat model: NOT CLOSED. The narrowing is from "specifiable rule, no
      harness" to "emitted rule with runnable harness and declared verification,
      residual self-attestation gap disclosed, PLUS PATH manipulation gap NOT
      disclosed, PLUS CWD-dependence gap PARTIALLY disclosed." The PATH gap
      means the narrowing is incomplete against the v5 threat model.
    - >-
      PRIOR-VS-OUTCOME COMPARISON. The review plan's coordinator_prior
      (recorded before any reviewer ran) predicted the real fight in J2 would
      be self-attestation: the emit procedure captures values from the host's
      identity surfaces, but nothing INDEPENDENTLY cross-checks the capture, so
      the enforceability gap narrows without fully closing. The prior expected
      this to come back as a disclosed limitation rather than a REVISE, because
      the v5 rule's threat model was caller-supplied bindings, not a malicious
      runtime. THAT PART WAS VINDICATED: RT-J2-O2 is exactly the predicted
      self-attestation gap, and it IS disclosed in the package
      (what_this_does_not_attest, limitation_disclosed: true). The prior also
      predicted the schema joint (J1) to be largely sound and the STOP control
      (J3) to fire correctly -- both VINDICATED. THE PRIOR WAS OVERTURNED IN
      THE DIRECTION THE PLAN SAID TO TREAT SKEPTICALLY: the red team found
      RT-J2-O1, a material UNDISCLOSED defect (PATH manipulation) stronger than
      the predicted limitation. The plan's coordinator_prior explicitly said "if
      all three joints come back clean with NO disclosed limitation, that is a
      surprise I would record explicitly and treat skeptically before composing
      a PASS." The actual outcome is not "all clean" -- it is "J2 breaks on an
      undisclosed defect" -- and the plan's decision_if_overturned clause said
      to preserve any defect without outvoting it. The J2 break is preserved,
      and that is why the disposition is REVISE rather than a PASS-with-
      limitation. Both halves are recorded plainly: the self-attestation
      prediction was vindicated (RT-J2-O2), and the stronger undisclosed PATH
      manipulation defect (RT-J2-O1) overturned the prior in the direction the
      plan said to treat skeptically.
    - >-
      INDEPENDENCE CHECKER RESULT. The local command
      python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8 PASSES: 2 reports,
      every joint owned and attested (J1 by TASK-20260830-78281a, J2 and J3 by
      TASK-20260830-d85fdf), blindness respected (both reviewers attest
      read_sibling_reports: false), controls declared (proves-too-much over
      three known-false objects, blind re-derivation with blind_from paths
      respected). This contrasts with the six vocabulary/shape mismatches
      recorded in DEC-20260825-dc7a01 for BATCH-90392b: the BATCH-820ee8 review
      plan was authored in the check_review_independence.py vocabulary (joint:
      keys, string attack_plan: fields, proves_too_much.failure_signature), and
      the vocabulary-compliant plan worked. No procedure deviation arises from
      the checker. The review plan and both reports are archived exactly as
      received; neither was edited.
    - >-
      Therefore the required composition is J1 HOLDS, J3 HOLDS, J2 BREAKS, and
      overall batch scoped REVISE. No downstream implementation or experiment
      authorization follows from this decision.
