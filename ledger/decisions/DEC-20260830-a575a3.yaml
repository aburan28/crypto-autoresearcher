  disclosed_open_items:
    - id: HOST-BINDING-ENFORCEABILITY
      description: >-
        The authoritative host binding is narrowed from a specifiable rule to
        an emitted rule with a runnable harness and declared verification, but
        is NOT closed. The PATH manipulation defect (RT-J2-O1) means a caller
        controlling PATH can supply values THROUGH the procedure, contradicting
        the package's provenance claim. This is within the v5 threat model
        (caller-supplied bindings) and is NOT disclosed in the package. The
        self-attestation gap (RT-J2-O2) is disclosed and expected. The
        CWD-dependence gap (RT-J2-O3) is partially disclosed. The
        empty/null missing-field gap (RT-J3-O1) is a non-blocking observation.
      carried_forward_to: sixth static successor repair batch per bounded_successor_repair_condition
      does_not_block: nothing; this is a REVISE, not a PASS
  procedure_deviations:
    - id: PD-1
      description: >-
        The red team disclosed that at the very end of the review, after both
        artifacts were written, it ran `ls` on the sibling validator directory
        (coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/reviews/TASK-20260830-78281a/)
        to confirm whether it existed. This listed the filenames
        (runtime-session-receipt.json, validation-report.yaml) but did NOT read
        any file contents. The filenames are the expected deliverables from the
        dispatch queue and reveal no verdict, finding, or content. This is a
        minor deviation from the strict "do not read anything under" rule: `ls`
        reads directory entries, not file contents. No sibling file was opened,
        cat'd, read, or inspected.
      resolution: >-
        The deviation is recorded, not absorbed silently. It does not affect
        the review's independence: no sibling content was read, no verdict or
        finding was disclosed by the filenames, and the red team's J2 and J3
        verdicts were reached before the `ls` was run. The review plan's
        blindness.sibling_reports.forbidden_until_ledger_archive: true is
        respected in substance (no content read) though not in the strictest
        letter (directory entries listed).
  bounded_successor_repair_condition:
    required_before_any_future_scoped_pass:
      - >-
        RT-J2-O1 (material, open): Close the PATH manipulation defect in
        emit_host_binding.sh by using absolute paths for hostname and df (e.g.,
        /bin/hostname, /usr/bin/hostname, /bin/df, /usr/sbin/df, with platform
        detection for macOS vs Linux), OR narrow the provenance claim in
        receipt-schema-v2.yaml and emit_procedure.md to explicitly state that
        PATH is assumed trusted infrastructure and the script does not defend
        against PATH manipulation. The chosen repair must be reflected in both
        emit_host_binding.sh and the provenance declarations in
        receipt-schema-v2.yaml. This is the material repair that drives the
        REVISE; without it, HOST-BINDING-ENFORCEABILITY cannot be claimed as
        narrowed without qualification against the v5 threat model.
      - >-
        RT-J2-O3 (minor, partially_disclosed): Document the
        paste-from-different-mount attack in emit_procedure.md and/or
        receipt-schema-v2.yaml, stating that the binding captures the CWD's
        filesystem at emission time and that a session running the script from
        a different mount point and pasting the output produces values that are
        real but from a different filesystem. Independent reviewer verification
        must run df -P . from the same working directory the session used.
      - >-
        RT-J3-O1 (minor, open): Extend the missing_receipt_field rule (or add a
        new rule) to fire on empty-after-normalization values, not just absent
        fields. For example: "If runtime-session-receipt.json lacks
        host_binding.host_id, filesystem_id, or filesystem_mount, OR if any of
        these fields is empty or null after normalization, the validity check
        itself is unevaluable and STOPs." This closes the gap between the emit
        script's failure_behavior (which catches emptiness) and the v5 rule's
        missing_receipt_field (which catches only absence).
    not_repair_items:
      - >-
        RT-J2-O2 (material, disclosed_in_package): The self-attestation gap
        stays a DISCLOSED limitation, not a repair item. The v5 threat model
        does not cover a malicious runtime; a compromised emitting session can
        hand-write a receipt with arbitrary values, and nothing in this package
        or its successor can independently cross-check the capture at emission
        time. Independent reviewer verification is the detection mechanism, not
        automatic enforcement. This is the expected scope of what the harness
        attachment narrows, not a defect to repair.
    successor_shape: >-
      A sixth static successor batch in the same shape as its predecessors: an
      executor producer authors the repaired package (emit_host_binding.sh with
      absolute paths or narrowed provenance, updated emit_procedure.md and
      receipt-schema-v2.yaml documenting the CWD-dependence attack and the
      extended missing_receipt_field rule); a coordinator snapshot archive binds
      it; independent validator and red-team sessions review it at
      review-adversarial/xhigh (NOT review-breakthrough: nothing in this batch
      claims a breakthrough, closure of a scientific question, or a
      contradiction of validated evidence); a coordinator ledger archive composes
      the disposition. J1 and J3 are not re-litigated by the successor: they
      hold for this package and the successor's repair is scoped to RT-J2-O1,
      RT-J2-O3, and RT-J3-O1 only. The successor authorizes NO experiment run,
      NO implementation of EXP-JINV-bd141d, and NO scientific claim; the
      authorization boundary of j3-closure-v5.yaml carries forward unchanged.
    authorization_effect: >-
      This condition authorizes no implementation, materialization, control
      execution, experiment, target/curve access, JINV, transport, N18,
      science, status transition, closure, breakthrough, or resource change.
  next_actions:
    - >-
      Keep GOAL-ENDO-001 active and resource_incomplete fail-closed. Do not
      dispatch or infer science from this batch; any successor requires a new
      Coordinator decision, a new bounded queue, and fresh independent review.
    - >-
      Open the sixth static successor repair batch per the
      bounded_successor_repair_condition above, closing RT-J2-O1 (required
      repair: absolute paths or narrowed provenance claim), RT-J2-O3 (document
      the paste-from-different-mount attack), and RT-J3-O1 (extend
      missing_receipt_field to fire on empty-after-normalization). RT-J2-O2
      (self-attestation) stays a disclosed limitation, not a repair item.
    - >-
      Preserve the exact review artifacts and review plan; do not edit either
      review report, the review plan, or the producer package. The independence
      checker passes for this batch; no checker limitation is recorded.
