  rationale: >-
    The preceding BATCH-74c282 independent Validator returned literal REVISE
    for all twelve frozen proposals, principally because citation provenance
    was incomplete or remembered conditional mathematics was stated too
    strongly. The user's request for more elliptic-curve-related ideas
    authorizes an additive successor: four corrected successors in each of the
    simulator, non-timing-fault, and certified-shrinkage lanes, plus two
    genuinely new mechanisms in each lane. The old records remain immutable.
