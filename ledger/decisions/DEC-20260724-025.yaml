    note: >-
      Canonical copy of a root-level decision whose ID collided with the
      independently numbered canonical record
      ledger/decisions/DEC-20260724-003.yaml (a different GOAL-CRYPTO-001
      decision). Main's canonical ID is retained unchanged; this record moves to
      the next free ID in the same date lane. Body preserved verbatim apart from
      this block, the new id, and the required knowledge_promotion field. See
      CORR-20260802-014 and DEC-20260802-001.
  context: "EXP-SIG-006 D6 null baseline re-derivation: freeze-degree diagnosis"
  decision: supported_scoped
  target_ids: [H-SIG-001]
  rationale:
    - "The D6 null failure is DIAGNOSED as a clean scientific finding, not an instrument bug: it is the semi-regular model's FREEZE-DEGREE break — the Hilbert-series prediction freezes (first HF = 0) at D = n/3 + 3 (n=9 -> D6, 12 -> D7, 15 -> D8, 18 -> D9), while real quotients collapse to |V| (variety enumeration: |V_sem| = 6, |V_null| = 1; null rank = ncols - |V| exactly)."
    - "Column-matched nulls (equal ncols by construction) STILL fail at D6 — equal support does not fix the freeze collapse; no histogram-only sr_pred recalibration exists at n = 9 D6. The residual_6 = 2,615 value remains inadmissible, as EV-SIG-005 held."
    - "Admissible window identified: the baseline is predicted VALID at D6 for n >= 12 (freeze at D7; sr_pred(12,6) = 156,520) — the degree axis is not closed, it was merely measured at an n where the model itself breaks."
    - "New confound recorded (rule 8): column-matching itself induces sem-like syzygies (N1 D5 extra = 369 on two independent constructions) — part of the sem D5 deficit (909 at n = 9) may be support-induced rather than cascade content; on-lattice n >= 12 nulls validate exactly, so the supported cascade at D <= 5 is unaffected."
    - "Controls: determinism/cross-session reproduction PASS (residual_6 = 2,615 and A-chain values reproduced exactly); N1 D5 anchor FAIL recorded as data; n = 12 D6 validation censored (needs chunked echelon)."
  evidence_refs: [EV-SIG-006, RUN-EXP-SIG-006-a, RUN-EXP-SIG-006-b, RUN-EXP-SIG-006-d, RUN-EXP-SIG-006-f]
  limitations:
    - "Diagnosis proved at n = 9 (full 2^18 variety enumeration); the n >= 12 validity prediction is untested (censored); the support-induced-syzygy confound is quantified only at n = 9 D5 (369 of 909)."
  next_actions:
    - "Dispatch EXP-SIG-008: validate the D6 baseline at n = 12 (null rank == sr_pred = 156,520 at D6, chunked echelon, hours-scale, checkpointed); if valid, re-measure sem residual_6 at n = 12 — the first admissible birth-law point. Also quantify the support-induced share of the D5 deficit at n = 12 (disentangles cascade content from support artifact)."
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Field added by the CORR-20260802-014 relocation so this record satisfies the
      current coordinator_decision schema. The 2026-07-24 decision is not
      re-opened and this repository-hygiene action promotes nothing; any KN-FIND
      drawn from H-SIG-001 must come from a fresh evidence review under the
      current promotion gate.
  decided_by: coordinator
  decided_at: "2026-07-24"
