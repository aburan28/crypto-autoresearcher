      EXP-TST-a00001}. For each target, standing = {a00001 .. a00004} minus
      approved_here = {a00002, a00003, a00004}. That is 3 against a cap of 3,
      so two errors are raised, one naming each target. T-5 asserts exactly
      one error, naming a00001 and not b00001. That holds only after the
      change. The test is right; the expected pre-change pattern was wrong.
    test_review: >-
      This Coordinator read the written test. It matches
      validator_change.test case by case: the fixture, the five decisions,
      their assertions, and that no repository file is read or written. It
      is kept exactly as written.

  clause_C1: >-
    Clause C-1 (DEC-20261009-cfa35a), governing TASK-20261009-0f4c0a ORDER
    (4) and DEC-20261009-ff58fe validator_change.acceptance[0]:
    (a) The expected result against the UNMODIFIED validator is: T-1 and T-5
        fail; T-2, T-3 and T-4 pass. Any other pattern is a STOP. After the
        change, all five must pass, unchanged.
    (b) The test file stays exactly as written. Its sha256 must equal
        b521cd1250f77b937ecc8ddd1a34eccc626a7ea963528c292f04f912f3a550ea at
        staging time. A mismatch is a STOP.
    (c) 0f4c0a resumes at step (4). It re-runs the test once against the
        unmodified validator, with the same interpreter and flags, and
        records the result, which must match (a). Then it continues with
        steps (5) to (7) as written. pre.txt from step (3) stays valid,
        because the tree it was taken from is unchanged apart from the
        untracked test file and the two records below.
    (d) Git status. Besides the groups 0f4c0a admits (the validator, the new
        test, the five held drafts), it additionally admits exactly two
        untracked paths: ledger/decisions/DEC-20261009-cfa35a.yaml and
        ledger/handoffs/TASK-20261009-55ff7f.yaml. They are not staged by
        0f4c0a. Their sha256 values are recorded in its receipt under
        ruling_records_uncommitted, and the receipt names clause C-1.
    (e) The step (6) acceptance "validator output differs by exactly the one
        ef482f line" is unchanged. validate_ledger.py also reads the two
        untracked records. They must add no error line; if they do, it is a
        STOP.

