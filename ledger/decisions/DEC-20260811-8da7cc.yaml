coordinator_decision:
  id: DEC-20260811-8da7cc
  context: >-
    BATCH-33b207 of GOAL-ECTD-001. DEC-20260810-4b8bbc ruled the snapshot archive task
    TASK-20260806-a49026 invalid and directed a COORDINATOR REPAIR with two named routes:
    (A) amend BATCH-33b207's queue so that an archive task's declared source-path set is
    realizable against a single commit, or (B) bind the existing package by content under
    an explicit versioned protocol_amendment. That decision recorded plainly of itself:
    "This Coordinator session has no shell and did not run the tool." THIS SESSION HAD A
    SHELL AND RAN IT. It resolved the two commits, counted their changed paths, tested
    ancestry against HEAD, and executed four candidate repairs against the real
    tools/research_dispatch.py. The finding is that the prescribed repair menu is EMPTY:
    route (A) is unreachable and route (B) is not expressible from inside the queue schema.
    THIS DECISION ADJUDICATES ARCHIVE-CHAIN MECHANICS AND NOTHING ELSE. No scientific
    content was reviewed, no run was validated, no evidence record was produced, and no
    experiment or hypothesis is a target of this decision.
  decision: revise
  target_ids:
  - TASK-20260806-a49026
  - GOAL-ECTD-001
  - BATCH-33b207
  rationale: >-
    WHAT THIS DECISION SUPERSEDES, STATED NARROWLY. It supersedes ONLY the next_action /
    repair directive of DEC-20260810-4b8bbc - the instruction that the next act is a
    Coordinator queue repair by route (A) or route (B). EVERYTHING ELSE IN THAT DECISION
    STANDS UNCHANGED AND IS REAFFIRMED HERE: TASK-20260806-a49026 is correctly at state
    invalid; content custody of the 17 producer artifacts is intact; the runs
    RUN-ECTD-9e4248-impl and RUN-ECTD-9e4248-screen are unimpeached and are not a
    research defect; no Executor re-run is authorized; TASK-20260806-8d8d3c and
    TASK-20260806-62a167 stay correctly blocked. Corrections supersede and never
    overwrite: DEC-20260810-4b8bbc is not edited by this act and must not be.

    WHAT THIS SESSION DID THAT THE PRIOR ONE COULD NOT, WHICH IS THE WHOLE MATERIAL
    DIFFERENCE BETWEEN THE TWO RECORDS. DEC-20260810-4b8bbc reasoned from a dispatching
    session's reported outputs and recorded that it had verified none of them itself. This
    session executed git and the dispatcher directly from worktree nervous-cannon-dc9546 at
    HEAD ae065c6c050ca09071d7bed5f5dec4bc93e9d702 and observed the following at first hand.

    CONFIRMED, INDEPENDENTLY. Commit 7cc3c4b59a321127e6623ee97f4ff33b7d36be79 (parent
    6891a2e827cb8d6237344f4cf2a6c0f4187e4d29) changed exactly THREE paths - the two
    run.yaml files and coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/dispatch_queue.json -
    covering 2 of the 17 declared producer artifacts. Commit 53d3fed02, now resolved in
    full as 53d3fed02f568a98ad5c42bac3d3e147ebd141b2 (parent
    1ba846482a7004a55ea54bc2b7639c8b02532aa3), covers 15 of the 17. Both commits ARE
    ancestors of HEAD - git merge-base --is-ancestor returned rc=0 for each - so the
    content-only fallback at research_dispatch.py:961, reachable only from verify_archive
    at :1030-1048, is closed for this package. The prior decision's reasoning on all three
    points is upheld on direct observation rather than on report.

    THE ONE FACTUAL SHARPENING THE PRIOR RECORD DID NOT HAVE. 53d3fed02f568a98ad5c42bac3d3e147ebd141b2
    changes 55 paths in total, 40 of them beyond the 17 declared producer artifacts.
    DEC-20260810-4b8bbc recorded only that it "carries 15 of the 17" and did not know it is
    a SUPERSET commit. This matters and strengthens the prior conclusion rather than
    qualifying it: even if the 17 artifacts had not been split across two commits, that
    single commit could never satisfy the exact-changed-path rule, because it changes 40
    paths the archive does not declare. The defect is therefore not merely a split; it is
    a split AND a superset, and no re-declaration of the source set that keeps the 17
    producer artifacts can repair either half of it.

    ALL FOUR CANDIDATE REPAIRS WERE EXECUTED AND ALL FOUR WERE REJECTED, EXIT=2. Each was
    built as a synthetic queue in the session scratchpad and run as
    "python3 tools/research_dispatch.py <synthetic>.json --output .. --report .. --repo-root ."
    THOSE SYNTHETIC QUEUES WERE NEVER WRITTEN INTO THE REPOSITORY and the committed
    dispatch_queue.json was not touched. Errors are quoted as observed output, with the
    tool's own truncation preserved and not expanded:
    (A) complete TASK-20260806-a49026 with the receipt digest added as an 18th path_sha256
    entry - "archive task TASK-20260806-a49026 commit must change exactly declared archive
    and source artifacts (missing ['coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/archives/TASK-20260806-a49026/snapshot-receipt.json',
    'experiments/EXP-ECTD-9e4248/driver/MANIFEST.md', 'experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-impl/e..."
    This reproduces DEC-20260810-4b8bbc's reported Run 2 at first hand.
    (C) re-point the Validator at the producer instead of the snapshot - "independent review
    TASK-20260806-8d8d3c for TASK-20260806-986054 must depend on snapshot archive
    TASK-20260806-a49026". _validate_review_chains forbids it.
    (D) delete the snapshot archive from the queue - "non-archive task TASK-20260806-986054
    must be assigned exactly once to an archive task".
    (E) remove a49026 and cut a fresh successor snapshot over the same source bound to
    53d3fed02 - the same exact-set rejection, missing 3 declared paths and 40 extra. The
    placeholder identifier used in that scratchpad test was a scratchpad artefact only, was
    never an allocated identifier, and is deliberately not reproduced here.

    BASELINE CONTROL, RUN BECAUSE A NEGATIVE RESULT ABOUT TOOLING NEEDS A NULL COMPARISON
    TOO. The committed queue AS IT STANDS renders cleanly: EXIT=0, all gates passed, zero
    ready tasks, TASK-20260806-8d8d3c deferred on a49026:invalid and TASK-20260806-62a167
    deferred on 8d8d3c:queued. The invalid state is stable and is NOT breaking the queue, so
    there is no operational emergency forcing a hasty repair.

    WHY ROUTE (B) IS NOT MERELY UNMET BUT INEXPRESSIBLE. _verify_content_only is reachable
    from exactly two places (research_dispatch.py:1032 and :1046) and only when the declared
    commit fails to resolve or is not an ancestor of HEAD. Both commits resolve and both are
    ancestors. There is therefore no field a Coordinator can set in the queue - and no
    protocol_amendment text, however explicit or well versioned - that causes the content
    path to be taken, because the queue schema exposes no switch for it. The only way to
    reach that branch would be to declare a commit_sha that does not exist. That is
    fabrication under AGENTS.md core rule 9 and is refused. A protocol_amendment that
    asserts a content-first rule the tool cannot honour would be a record asserting an act
    that did not happen.

    THE CONSEQUENCE, WHICH IS A CHANGE OF OWNER AND NOT A CHANGE OF VERDICT. The repair
    DEC-20260810-4b8bbc directed is not a Coordinator queue act at all. It requires a change
    to tools/research_dispatch.py, which is Executor work. This session is coordinator-only,
    did not perform it, and must not. The handoff TASK-20260811-a3eb96 specifies that work
    and is RECORDED, NOT DISPATCHED: no batch slot has been minted for it.

    A MINOR DISCREPANCY OBSERVED IN A COMMITTED RECORD AND RECORDED RATHER THAN DISCARDED
    (AGENTS.md core rule 8). The queue entry for TASK-20260806-986054 carries a note
    beginning "The 16 declared paths above are a floor", while its artifact_paths list
    contains 17 entries. Nothing in this decision depends on that prose, and the 17-entry
    list is the operative set the dispatcher reads; it is flagged only so a later reader
    does not treat the two numbers as evidence of a missing artifact.
  evidence_refs:
  - ledger/decisions/DEC-20260810-4b8bbc.yaml
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/dispatch_queue.json
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/archives/TASK-20260806-a49026/snapshot-receipt.json
  - tools/research_dispatch.py
  - ledger/handoffs/TASK-20260811-a3eb96.yaml
  - experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-impl/run.yaml
  - experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-screen/run.yaml
  - ledger/goals/GOAL-ECTD-001.yaml
  limitations:
  - >-
    THIS DECISION ADJUDICATES ARCHIVE-CHAIN MECHANICS ONLY. It reviews no scientific
    content, validates nothing, recomputes no statistic, and leaves the interpretation of
    RUN-ECTD-9e4248-impl and RUN-ECTD-9e4248-screen entirely open. No evidence record is
    produced by it.
  - >-
    IT DOES NOT TOUCH H-ECTD-19017a. No hypothesis status moves, and EXP-ECTD-9e4248 is
    deliberately not a target_id. CLAIM CEILING STAYS TOY: no trapdoor, no Galbraith
    path-finding hardness, no isogeny-evaluation hardness, no crypto-scale language.
  - >-
    IT DOES NOT ADJUDICATE THE TWO EXECUTOR OBSERVATIONS, WHICH REMAIN OPEN AND RESERVED
    TO THE INDEPENDENT VALIDATOR TASK-20260806-8d8d3c. (1) Zero instrument dynamic range:
    a meter with no dynamic range cannot discriminate continuity from discontinuity even
    though the pre-registered continuity_scoped branch fired as written. (2) D-2:
    CTRL-HORIZONTAL-BASELINE's mandated conductor recomputation was not executed as
    written. Nothing here settles, softens or pre-empts either.
  - >-
    NO INDEPENDENT REVIEW SUPPORTS THIS DECISION AND NO ATTESTATION IS RECORDED. It is a
    single-session Coordinator adjudication of a tooling outcome. Its load-bearing facts
    are this session's own git and dispatcher observations, logged in the session
    verification transcript; they were not independently re-run by another agent.
  - >-
    THE FOUR REJECTIONS ARE OBSERVATIONS ABOUT tools/research_dispatch.py AS IT STANDS AT
    HEAD ae065c6c050ca09071d7bed5f5dec4bc93e9d702, and about the BATCH-33b207 queue shape
    specifically. They do not enumerate every conceivable queue amendment, and they do not
    claim that no repair exists - only that none exists as a Coordinator queue act under
    the current tool. A tooling change moves this immediately, which is the point of the
    handoff.
  - >-
    DEC-20260810-1e0b6c / PR #315 is cited as convergent prior art from an OPEN, UNMERGED
    branch. Its MD5 particulars were not re-verified here and no claim of this decision
    depends on them.
  next_actions:
  - >-
    THE NEXT ACT IS EXECUTOR TOOLING WORK, NOT A COORDINATOR QUEUE EDIT. It is specified in
    ledger/handoffs/TASK-20260811-a3eb96.yaml: implement a DECLARED content-first archive
    binding mode in tools/research_dispatch.py, with regression tests over exactly the
    BATCH-33b207 shape. That handoff is RECORDED, NOT DISPATCHED - no batch slot has been
    minted for it and its artifact_paths are deliberately empty.
  - >-
    DO NOT RE-ATTEMPT ROUTE (A) OR ROUTE (B) AS A QUEUE EDIT. Both were tested against the
    real dispatcher and rejected at EXIT=2; re-attempting them spends budget to reproduce a
    known rejection. Do not reach the content path by declaring a commit that does not
    exist.
  - >-
    TASK-20260806-8d8d3c (independent Validator, review-adversarial, independent_session
    true) and TASK-20260806-62a167 (ledger archive) STAY BLOCKED until the tooling change
    lands and the archive is re-bound under it. An invalid dependency does not unblock a
    successor, and this decision does not unblock either task.
  - >-
    NO EXECUTOR RE-RUN OF EXP-ECTD-9e4248 IS AUTHORIZED. The runs are committed, complete
    and byte-verified 17 of 17. Re-running them would spend budget, produce no new
    information, and repair no binding defect.
  - >-
    THE RESULTING TOOLING CHANGE REQUIRES INDEPENDENT REVIEW BEFORE ANY ARCHIVE IS RE-BOUND
    WITH IT. A verifier relaxation that no one adversarially reviewed is exactly the kind of
    change that should not first appear underneath a live archive.
  - >-
    GOAL-ECTD-001 status, current_batch_id, dispatch_queue_path and latest_verified_commit
    are UNCHANGED by this decision. Only next_action moves, and it moves to name the
    Executor tooling act.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence review occurred and no evidence record was produced; this adjudicates a
      scaffolding failure in the archive chain, not a research finding about ECDLP, isogeny
      volcanoes, or any measured quantity. DEC-20260810-4b8bbc set the trigger for a durable
      knowledge entry as the pattern RECURRING ACROSS GOALS AND BEING INDEPENDENTLY
      CONFIRMED. THIS IS NOW THE SECOND OBSERVED INSTANCE OF THE CLASS - DEC-20260810-1e0b6c
      / PR #315 on GOAL-MD5-001 / TASK-20260810-fc23ce is the first - and unlike the first
      report this instance is empirically demonstrated rather than argued, since all four
      candidate repairs were run against the real dispatcher. THE TRIGGER IS STILL NOT MET,
      and it is worth being exact about why rather than promoting on a near miss: PR #315
      remains OPEN AND UNMERGED, and this session did not re-verify its MD5 particulars, so
      the "independently confirmed" half rests on an unmerged branch this session did not
      check. WHAT WOULD MEET IT, NAMED CONCRETELY: either PR #315 merging (at which point
      the first instance becomes committed, independently authored evidence of the same
      class), or a second independently-verified instance on any goal. On either event a
      KN-TECH entry on archive-chain binding design - commit-scope versus content binding,
      and the producing-session-commits-first failure mode - or a KN-OPEN entry on the
      unresolved design question becomes warranted and should be minted then, following the
      /curate-knowledge conventions, rather than minted now from one demonstrated case plus
      one unverified report.
  dominated_by: >-
    Not applicable. No attack, no algorithm, no Pareto point and no cost claim is advanced
    by this decision. Written explicitly rather than left null, per the inventor protocol's
    Pareto-honesty requirement.
  sota_delta: >-
    Zero on every axis. No ECDLP cost is improved, no exponent is moved, Pollard rho remains
    the baseline, and nothing here transfers to any cryptographic parameter. This decision
    is about a dispatch verifier, not about mathematics.
  decided_by: coordinator
  decided_at: '2026-08-11'
  supersedes_note: >-
    SUPERSEDES ONLY THE next_action / REPAIR DIRECTIVE OF DEC-20260810-4b8bbc. That
    decision's adjudication - a49026 invalid, content custody intact, runs unimpeached, no
