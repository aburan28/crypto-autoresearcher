coordinator_decision:
  id: DEC-20260810-da7513
  goal_id: GOAL-DREG-001
  batch_id: BATCH-005
  recorded_by_task: TASK-20260810-9dac9a

  context: >-
    GOAL-DREG-001 BATCH-005 closing act, directed by item (1) of this goal's own
    committed next_action in ledger/goals/GOAL-DREG-001.yaml.

    STATE AT THE TIME OF WRITING. BATCH-005 ran and produced evidence but never
    acquired a committed decision. Its four dispatch_queue.json entries
    (TASK-20260731-016 executor, TASK-20260731-025 coordinator snapshot,
    TASK-20260731-026 red-team, TASK-20260731-027 coordinator ledger) all read
    state "completed". Its evidence record ledger/evidence/EV-DREG-008.yaml is
    committed. Its independent red team RT-20260731-013 returned verdict PASS.
    But the decision id that its own ledger receipt declared --
    DEC-20260731-014 -- is occupied on main by an unrelated GOAL-ECDLP-001 /
    BATCH-021 decision (`goal_id: GOAL-ECDLP-001`, `batch_id: BATCH-021`,
    `decision: approve`), and the DREG BATCH-005 decision content that receipt
    declared by digest was never committed at that path or anywhere else. The
    mechanism is on record in ledger/corrections/CORR-20260731-005.yaml: an
    add/add merge ID-remap for PR #82 moved tier-path campaign records onto
    DEC-20260731-013/-014/-015, taking a path this goal's archive had already
    declared. This goal has therefore carried BATCH-005 EVIDENCE and NO
    BATCH-005 DECISION since 2026-07-31.

    THIS RECORD IS THAT MISSING DECISION, MINTED FRESH. It closes BATCH-005 on
    EV-DREG-008 and supersedes the collided reference BY NAMING IT. Neither the
    TASK-20260731-027 receipt nor the committed ledger/decisions/DEC-20260731-014.yaml
    is edited, renamed, or remapped by this act (AGENTS.md rule 15: an identifier
    remap is a last resort, not a repair; a record named in a completed archive's
    binding fields is superseded, never renamed).

  decision: supersede

  decision_note: >-
    `supersede`, chosen from the template enum in templates/research-records.md
    and defended against every other value in it.

    WHY `supersede`. The operative act of this record is a REPLACEMENT OF A
    BROKEN LEDGER REFERENCE, not a verdict about mathematics. Two things are
    superseded and both are named below in `supersedes`: (i) the BATCH-005
    closing-decision reference that TASK-20260731-027's receipt declared and
    that no commit ever satisfied, and (ii) BATCH-002's informal "O(10^3)
    genuine" expectation for this one cell, which the admitted CTRL-B
    measurement replaces with a pinned structural number. That is exactly what
    `supersede` names, and it is the honest description of what changed in the
    ledger today.

    WHY NOT `support`. FORBIDDEN HERE, on two independent grounds that are
    already in committed artifacts. RT-20260731-013's required control
    CTRL-013-SCOPE states "no sub-rho or H-DREG-001 status change from this PASS
    alone", and EV-DREG-008's own `inference` field states "Do not flip
    H-DREG-001 shared-ledger status to supported; completion still requires the
    on-lattice ladder". A `support` decision on a hypothesis-bearing evidence
    record reads as precisely that move, and this Coordinator will not write a
    word that reads as a move the evidence forbids. The evidence is strength
    `preliminary`, one cell, claim_tier `toy`.

    WHY NOT THE OTHERS. `weaken` and `reject_scoped` are adverse verdicts and
    nothing here is adverse: EV-DREG-008's direction is `supports` and the red
    team returned PASS, so there is no refutation artifact to secure and nothing
    to weaken; `reject_scoped` is separately forbidden on a single unreplicated
    empirical-only run by the coordinator contract. `approve` names an
    experiment approval and this decision approves no experiment. `revise` sends
    a producer's work back for rework -- the producer's work passed independent
    review and is not being returned. `replicate` orders a re-run; the one
    re-run that would discriminate further (the full independent re-rank) is
    recorded below as AVAILABLE AND UNEXECUTED rather than ordered, because this
    is a coordinator-only run with no executor. `expand` would widen the
    direction, and nothing is widened. `pause` would assert a stop; the goal
    stays `active` with a concrete next action. `inconclusive` is not in the
    template enum -- and would in any case misdescribe a red-team PASS on an
    admitted measurement whose set hashes independently regenerated.

    WHAT `supersede` DOES NOT MEAN HERE. It does not mean any committed record
    is edited, deleted, renamed, or remapped -- none is. It does not mean
    DEC-20260731-014's content is wrong; that record is a valid GOAL-ECDLP-001
    decision and stays exactly as it is. It asserts nothing about d_reg beyond
    what is scoped below.

  supersedes:
    - id: SUP-1
      what: >-
        The BATCH-005 closing-decision REFERENCE declared in
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json,
        namely the entry "DEC-20260731-014" in that receipt's `record_ids` and
        the entry "ledger/decisions/DEC-20260731-014.yaml" in its
        `artifact_sha256` map.
      superseded_by: DEC-20260810-da7513
      what_is_not_touched: >-
        The receipt file itself is NOT edited and its bytes are unchanged by
        this act. ledger/decisions/DEC-20260731-014.yaml is NOT edited, renamed,
        remapped, or reinterpreted; it remains the GOAL-ECDLP-001 / BATCH-021
        decision it has always been, owned by another campaign. NO REMAP OF ANY
        IDENTIFIER IS PROPOSED BY THIS DECISION (AGENTS.md rule 15).
      effect: >-
        Any future reader of that receipt who follows "DEC-20260731-014" looking
        for GOAL-DREG-001's BATCH-005 decision is redirected here, to
        DEC-20260810-da7513, by this record. The receipt's own broken reference
        stays visible on the record rather than being quietly repaired, which is
        the point of superseding rather than editing.
    - id: SUP-2
      what: >-
        BATCH-002's INFORMAL "O(10^3) genuine" expectation FOR THIS CELL ONLY --
        the narrative, carried in this goal's BATCH-002 checkpoint summary and
        its surrounding language, that the genuine support-independent deficit
        would land near the lower end of the preregistered bracket and that
        ">= ~89% of 17947 is a degree-6 support gap, not syzygies".
      superseded_by: >-
        The admitted CTRL-B measurement in EV-DREG-008: rank_null_restricted =
        rank(null | sem_support) = 156520 = sr_pred, so the 16016 deleted
        degree-6 columns contributed ZERO rank, and deficit_genuine = 156520 -
        138573 = 17947 sits at the UPPER endpoint of the preregistered bracket
        [1931, 17947], not the lower.
      scope_of_the_supersession: >-
        THE SINGLE CELL n=12, t=3, ti=0, seed=2026, D=6 AND NOTHING ELSE. This
        supersedes an informal expectation about one measurement. It does not
        generalise to other n, other D, other seeds, or to any statement about
        how much of a deficit is support-gap in general.
      why_this_is_recorded_here: >-
        Discharge of RT-20260731-013 objection OBJ-013-1, whose disposition
        leaves it "OPEN as Coordinator narrative debt: supersede BATCH-002
        informal O(10^3) expectation in any ledger synthesis". This is that
        synthesis, so the debt is paid here rather than deferred again.
      what_it_does_not_do: >-
        It does NOT lift the quarantine (see `structural_metric_citation`), does
        NOT rehabilitate the sr_pred-minus-rank_sem formula, and does NOT change
        the BATCH-002 checkpoint, which is immutable and stays exactly as
        written.

