  authorization_boundary: >-
    STATED EXPLICITLY SO IT CANNOT BE READ WIDER THAN IT IS. This decision:
    MOVES NO HYPOTHESIS -- H-DREG-001 stays `inconclusive`, H-SIG-001 is
    untouched;
    CLOSES NO GOAL -- GOAL-DREG-001 stays `active`; its completion criterion
    (full-column-rank d_reg or gap(n) across the on-lattice ladder n in
    {12,15,18} with >= 3 seeds and the semi-regular null control) is NOT met by
    one cell at n=12, and nothing here claims it is;
    APPROVES NO EXPERIMENT and AUTHORIZES NO RUN -- RT-20260731-013 itself
    records `experiment_authorized: false` and `measurement_authorized: false`;
    OPENS NO BATCH -- BATCH-006 is not opened here, and this decision consumes
    no campaign batch budget beyond BATCH-005, which was already open;
    PROMOTES NO KNOWLEDGE -- see `knowledge_promotion`;
    EDITS NO COMMITTED RECORD -- not the TASK-20260731-027 receipt, not
    DEC-20260731-014, not EV-DREG-008, not the BATCH-002 checkpoint, not
    ledger/goals/GOAL-DREG-001.yaml (whose checkpoint and
    latest_verified_commit updates are deliberately deferred: see NA-2);
    RECORDS NO ATTESTATION -- none was obtained in this run, none is claimed,
    and none is synthesisable from it. AGENTS.md's "never record an attestation
    you did not obtain" binds regardless of the closure quorum's suspension, and
    this goal is not closing in any case.

  claim_boundary:
    is_d_reg_theorem: false
    is_crypto_scale: false
    is_sub_rho_claim: false
    changes_h_dreg_001_status: false
    cell: "n=12, t=3, ti=0, seed=2026, D=6"
    engine: chunked block-m4ri over GF(2), CTRL-B under protocol TASK-20260725-701 / DEC-20260725-026
    strength: preliminary
    claim_tier: toy
    control_ref: CTRL-013-SCOPE (RT-20260731-013 required_controls)
    statement: >-
      EVERYTHING THIS DECISION CONCLUDES IS SCOPED TO ONE CELL. For the single
      cell n=12, t=3, ti=0, seed=2026, D=6, under chunked block-m4ri CTRL-B with
      admission status `admitted`, the committed receipt's measured
      rank(null | sem_support) = 156520 yields the support-aligned structural
      quantity deficit_genuine = 17947. That is a structural GF(2) Macaulay rank
      number for one frozen cell. It is NOT a degree of regularity, NOT a
      theorem about d_reg, NOT an n-ladder law, NOT crypto-scale evidence, and
      NOT any statement about ECDLP cost. No transfer or extrapolation to other
      n, other D, other seeds, other curves, or other solvers is asserted, and
      none is licensed by this record.

  structural_metric_citation:
    control_ref: CTRL-013-LABEL (RT-20260731-013 required_controls)
    structural_metric_id: deficit_genuine
    value: 17947
    formula_genuine: "rank(null | sem_support) - rank_sem = 156520 - 138573"
    source_receipt: >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/results.json
      (admitted CTRL-B receipt; ctrl_b_admission_status=admitted,
      all_admission_metrics_pass, rebuild_match=true), as recorded in
      EV-DREG-008 and independently checked by RT-20260731-013.
    raw_headline_status: quarantined_confounded
    raw_headline_formula: "sr_pred - rank_sem"
    quarantine_statement: >-
      THE RAW HEADLINE STAYS QUARANTINED. BATCH-005 DID NOT LIFT IT AND THIS
      DECISION DOES NOT LIFT IT. The formula sr_pred - rank_sem remains
      `quarantined_confounded` as a formula, exactly as EV-DREG-008 states in
      its own words and as CTRL-013-LABEL requires. Every citation of 17947 in
      this record is a citation of structural_metric_id `deficit_genuine` from
      the admitted CTRL-B receipt, and of nothing else.
    numerical_equality_explanation: >-
      THE TWO NUMBERS COINCIDE AND THAT COINCIDENCE IS A MEASURED OUTCOME, NOT A
      RE-CITATION OF THE CONFOUNDED LABEL. Equality holds if and only if
      rank(null | sem_support) equals sr_pred (= rank_null_full). The admitted
      receipt and its chunk trail report exactly that case -- the UPPER-INTERVAL
      ENDPOINT of the preregistered bracket [1931, 17947] -- because the 16016
      deleted degree-6 columns contributed zero rank. The two formulas remain
      distinct, the labels remain distinct, and RT-20260731-013's Q-machine
      coherence check records Q1 pass (structural_metric_id is deficit_genuine,
      not raw_deficit), Q2 pass (raw_headline_status quarantined_confounded),
      Q3 not-applicable after admission, Q4 pass (structural D6 equals measured
      deficit_genuine, which explicitly allows equality), with
      `smuggling_of_raw_as_structural: false`.

  rationale:
    - id: D-1
      what: >-
        BATCH-005 is closed in the ledger under a freshly minted id because the
        id its archive declared was taken by another campaign and the content it
        declared was never committed anywhere.
      why: >-
        A goal cannot carry evidence with no decision indefinitely: every
        downstream reader of GOAL-DREG-001 either finds a GOAL-ECDLP-001
