coordinator_decision:
  id: DEC-20260802-56cc4b
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-009
  recorded_at: '2026-08-02'
  decision: expand
  decision_label: resume_from_pause_on_user_budget_extension; rule_12_block_persists_and_is_routed_around

  context: >-
    DEC-20260802-937ba9 paused GOAL-MLKEM-003 for two independent reasons and
    named both as resume conditions: (1) the campaign budget was exhausted at
    batch 8 of 8, the two-batch authorization granted by DEC-20260802-002; and
    (2) the AGENTS.md rule 12 `review-breakthrough` pass at `max`, needed to act
    on BATCH-008's findings, could not be served. The user has directed the
    harness to unpause this goal. That direction is the budget extension
    condition (1) names, and this record is the explicit Coordinator decision
    on how to proceed without rule 12 that condition (2) permits as its
    alternative.

  what_this_decision_does_not_do: >-
    DEC-20260802-937ba9 constrained that alternative: an explicit decision to
    proceed without rule 12 "may not include treating EV-MLKEM-011,
    EV-MLKEM-013, KN-FIND-012 or KN-FIND-014 as corrected". This decision
    honours that constraint exactly. It changes no evidence status, supersedes
    no knowledge entry, and promotes nothing. The rule-12 gate is not waived,
    reinterpreted, or worked around; it is left standing and unmet, and the
    resumed work is deliberately chosen to be work that does not depend on it.
    Note that the recently suspended rule-13 closure quorum is a DIFFERENT gate:
    rule 12 governs `review-breakthrough` for a contradiction between validated
    evidence records, is marked `degradable: false` in
    orchestration/model-policies.yaml, and remains fully in force.

  rule_12_status:
    required_policy: review-breakthrough
    required_effort: max
    degradable: false
    served: false
    evidence: >-
      `python3 -m orchestration.adapter doctor --probe` reports every remote
      backend unusable (ANTHROPIC_API_KEY, FIREWORKS_API_KEY, OPENAI_API_KEY,
      OPENROUTER_API_KEY, ZAI_API_KEY all unset) and the `local` backend's model
      probe failing with connection refused at http://localhost:8000/v1/models.
    consequence: >-
      EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their official status.
      The KN-FIND-012 restatement and the KN-FIND-014 withdrawal remain pending,
      recorded in DEC-20260802-937ba9 and not enacted. These transitions are
      still owed and are not cancelled by this resumption.

  budget_extension:
    from_maximum_batches: 8
    to_maximum_batches: 10
    authorization: >-
      Direct user instruction to unpause GOAL-MLKEM-003. Recorded as a bounded
      extension rather than an unbounded resumption: two batches, after which
      the campaign returns to a pause decision unless extended again. This
      mirrors the form of the DEC-20260802-002 extension.
    unchanged:
      - max_concurrent remains 3
      - total_wall_clock_seconds per batch unchanged

  goal_status_transition:
    from: paused
    to: active
    reason: user_authorized_budget_extension_and_explicit_decision_to_proceed_without_rule_12

  scope: >-
    This decision authorizes BATCH-009 and nothing else. BATCH-009 runs F1, the
    successor experiment DEC-20260802-937ba9 named as first on resumption, using
    only bytes already archived in this repository. It authorizes no G6K run, no
    new cost model, no new sampling, and no ML-KEM security claim.

  why_F1_and_not_the_other_candidates: >-
    The BATCH-008 review left four successors (F1-F4). F1 is ranked first
    because it is the only one that is both decisive about a live question and
    free of the rule-12 gate. F1 recomputes Approximation 4.9's predicted
    survival curve and compares it against the archived measurement over the
    band the instrument actually resolved (Pwrong in [2^-35.70, 2^-1]) -- a
    comparison the program has never run, despite three batches of argument
    about that band. It needs no sampling and no network. F3 (vary nb_iteration
    as the missing decay control) is ranked second and is a natural BATCH-010
    candidate. F4 (rare-event estimator) is the only route to the operating
    threshold and stays genuinely open, but it is a new-compute project rather
    than a batch. F2 depends on KN-FIND-013's lever, which touches records the
    rule-12 gate governs, so it is deferred until that gate is served. The G6K
    threshold measurement stays deprioritized on the evidence recorded in
    DEC-20260802-15cadd: BATCH-008 showed the operating threshold is ~93-117
    bits below the counting floor, so a longer run is not the remedy.

  merge_integrity_finding: >-
    Recorded because it affected this goal's durability and an auditor should
    see it. The BATCH-008 ledger archive commit 4df3c888 -- EV-MLKEM-018,
    DEC-20260802-937ba9, the TASK-20260802-de2957 review package, and the paused
    checkpoint -- did not become an ancestor of main when PR #116 merged. That
    PR merged as a single squashed commit carrying only the batch-OPENING commit
    39749c84, so main briefly showed GOAL-MLKEM-003 as `active` at BATCH-007
    with seven batch entries while the branch held the archived BATCH-008 state.
    Nothing was lost: the remote branch still pointed at 7e84e69b and both
    commits were intact. The repair was a merge, not a rebase (AGENTS.md forbids
    rebasing pushed run records). The three BATCH-008 coordination files
    conflicted add/add purely because the squash erased their ancestry -- main's
    copies were verified byte-identical by sha256 to this branch's own opening
    commit -- so resolving to the branch continuation restored the lineage
    rather than choosing between competing authorships. No ledger record, run
    artifact, or knowledge entry conflicted. The dispatcher re-verified the
    BATCH-008 archive after the merge.

  non_claims:
    - No ML-KEM break is claimed, and no security level is asserted or revised.
    - No FIPS 203 parameter set is affected or cleared by this decision.
    - No evidence record changes status; no knowledge entry is superseded,
      withdrawn, or promoted.
    - Resuming a goal asserts nothing about whether its completion criteria can
      be met. COST-MLKEM-001 remains the conditional envelope and KN-OPEN-016
      remains open.
    - >-
      The rule-13 closure quorum suspension does not apply here. This goal is
      not being closed, and rule 12 is a separate gate that remains in force.

  ranking_rationale: >-
    Recorded per AGENTS.md "Research-direction integrity". Ranked for BATCH-009:
    (1) F1, chosen -- decisive on a never-tested comparison, zero new compute,
    ungated by rule 12; (2) F3, the missing decay control, deferred to BATCH-010
    because F1's result changes how its output should be read; (3) F4, the only
    route to the operating threshold, genuinely open but a new-compute project
    outside a two-batch extension; (4) F2, deferred because it depends on
    rule-12-gated records; (5) G6K, deprioritized on recorded evidence (twice
    blocked in BATCH-003 and BATCH-005; BATCH-008's ~93-117-bit result reframes
    it) with revisit conditions carried forward from DEC-20260802-15cadd. No
    candidate is abandoned; each carries a revisit condition.

  next_actions:
    - >-
      Execute BATCH-009 TASK-20260802-8bae8e (F1) -- recompute Approximation
      4.9's predicted survival curve from the archived Carrier text and compare
      it against the archived measurement over the resolved band -- then the
      independent review TASK-20260802-08f428, then the ledger archive
      TASK-20260802-43e5e4 carrying EV-MLKEM-019 and its decision.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      A resumption decision establishes nothing about the subject matter. The
      two promotions this campaign already owes -- the KN-FIND-012 restatement
      and the KN-FIND-014 withdrawal -- remain blocked on the unserved rule-12
      review and are not unblocked by this decision. Any new promotion belongs
      to the BATCH-009 ledger decision after F1 is reviewed.

  references:
    - DEC-20260802-937ba9
    - DEC-20260802-15cadd
    - DEC-20260802-002
    - EV-MLKEM-018
    - EV-MLKEM-011
    - EV-MLKEM-013
    - KN-OPEN-016
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-008/tasks/TASK-20260802-de2957/contradiction_review.yaml

  target_ids:
    - GOAL-MLKEM-003
  decided_by: coordinator
  decided_at: '2026-08-02'
