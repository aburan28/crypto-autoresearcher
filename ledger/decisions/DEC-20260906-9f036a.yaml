coordinator_decision:
  id: DEC-20260906-9f036a
  recorded_at: '2026-09-06'
  context: >-
    Repair of one of the six administrative blocks DEC-20260807-5adc24 opened
    (decision: pause) on 2026-08-07. That decision found ledger/handoffs/
    TASK-20260727-011.yaml (EXP-PMA-001) carries `authorized_by:
    "DEC-20260727-002"`, a real decision about an entirely different goal and
    batch (GOAL-ECDLP-001's BATCH-009 campaign-budget extension,
    TASK-20260727-002 through -006; TASK-20260727-011's own goal_id field is
    literally "null", never GOAL-ECDLP-001). This session independently
    re-read DEC-20260727-002 in full and confirmed it contains zero
    occurrences of EXP-PMA-001, H-PMA-001, IDEA-20260726-012, or RQ-PMA-001.
    A repository-wide grep of ledger/decisions/ for "EXP-PMA-001" and
    "H-PMA-001" returns only DEC-20260807-5adc24 itself. No other decision,
    under any identifier, approves this experiment. OPTION A applies. This
    decision re-runs the approval act with a genuine, checkable Coordinator
    review, citing itself.
  decision: approve
  target_ids:
    - EXP-PMA-001
    - H-PMA-001
    - RQ-PMA-001
    - TASK-20260727-011
    - DEC-20260807-5adc24
  rationale:
    - >-
      RE-VERIFICATION. DEC-20260727-002 was read in full: it is a
      GOAL-ECDLP-001 BATCH-009 budget amendment with no PMA content of any
      kind. A repository-wide grep for EXP-PMA-001 and H-PMA-001 across
      ledger/decisions/ surfaces only DEC-20260807-5adc24 (the
      administrative-block finding). No real approval exists under any
      identifier.
    - >-
      FRESH SCIENTIFIC REVIEW. H-PMA-001 is a pure toy-scale mechanism
      validation with no attack framing: it tests whether a divisor-parity
      obstruction predicate agrees with independent brute-force matrix
      existence over k(t). Its own interpretation_limits are unusually
      candid about scope gaps -- explicitly noting that the F_211 fixture
      controls named in the source proposal (IDEA-20260726-012) depend on
      records (EV-ECDLP-023, TASK-20260726-756) that do not exist in this
      repository, and disclosing that omission at intake rather than hiding
      it. This is the honest disclosure this program's evidence rules
      require, not a defect that blocks approval, since the experiment's own
      grid and controls do not depend on those missing fixtures.
    - >-
      CONTROLS. Module A (the predicate) and Module B (an independent
      constructive existence decider with witness reverification) are
      separate code paths, exactly the "controls before belief" structure
      the program requires; CTRL-PMA4-CHAR2 and CTRL-PMA4-DEGENERACY test
      the predicate against inputs it MUST refuse or branch away from,
      functioning as null-object controls; CTRL-PMA4-GROEBNER is a third,
      independent cross-check. Every EXISTS verdict requires a 16/16
      reverified witness and every NOT-EXISTS verdict requires a complete
      exhausted branch log -- both directions of disagreement are
      distinguished and neither is silently absorbed as success.
    - >-
      CLAIM-TIER DISCIPLINE. claim_tier is toy; interpretation_limits state
      plainly that no generic-family, all-size PMA, or asymptotic claim is
      established or refuted, that characteristic 2 and several
      representation classes are explicitly out of scope, and that the
      mechanism returns no ECDLP-relevant descent, factor-base log, or
      scalar of any kind (candidate_count 0).
    - >-
      STANDALONE TRACK, NO GOAL-BUDGET CONFLICT. RQ-PMA-001 is `active`,
      owned by the Coordinator, with no goal attachment (EXP-PMA-001's own
      goal_id is null) -- unlike EXP-MLKEM-008, there is no closed or
      budget-exhausted campaign this experiment would be dispatched under.
      Budget (6300s wall-clock total, 1.75 CPU-hours, 4 runs, 4GB memory) is
      modest, bounded, and fully deterministic (no seeds; the instance grid
      is fixed by frozen rules).
    - >-
      EXECUTABILITY. The prescribed-table formulas, field list, grid sizes,
      the single-widening-fallback rule, and stopping/invalidation rules are
      all pinned exactly; no silent substitution is required.
    - >-
      No defect was found in the contract's design, controls, budget, or
      scope beyond the fabricated citation this decision repairs and the
      already-disclosed missing-fixture note above, which the contract
      itself handles correctly by disclosure rather than by silent
      assumption.
  evidence_refs:
    - ledger/decisions/DEC-20260807-5adc24.yaml
    - ledger/decisions/DEC-20260727-002.yaml
    - ledger/hypotheses/H-PMA-001.yaml
    - ledger/questions/RQ-PMA-001.yaml
    - ledger/proposals/IDEA-20260726-012.yaml
    - experiments/EXP-PMA-001/specification.yaml
    - ledger/handoffs/TASK-20260727-011.yaml
  limitations:
    - >-
      This decision approves the SCIENCE and repairs the administrative
      provenance gap only. It does not edit
      experiments/EXP-PMA-001/specification.yaml (status currently `paused`
      per the 2026-08-08 status_enactment_note) and does not flip any
      execution-authorization flag or dispatch an Executor; this session's
      write_scope is ledger/decisions/ and ledger/corrections/ only.
    - >-
      TASK-20260727-011.yaml's `authorized_by: "DEC-20260727-002"` field
      remains exactly as committed and immutable; this decision does not
      edit it. Any future dispatch must cite DEC-20260906-9f036a as the
      operative authorization.
    - >-
      This decision does not resolve the F_211 fixture-control gap disclosed
      in H-PMA-001's own interpretation_limits; it notes that the contract
      already discloses it honestly and does not require those missing
      records for its own frozen grid.
    - >-
      This decision does not re-review or touch EXP-HZM-001, EXP-SEMAEV-002,
      EXP-MLKEM-008, EXP-JMV-001, or EXP-JMV-004, each of which receives its
      own independent decision under this same repair effort.
  next_actions:
    - >-
      A future Coordinator session must enact this approval in
      experiments/EXP-PMA-001/specification.yaml via a dated
      status_enactment_note (mirroring the 2026-08-08 pause note), citing
      DEC-20260906-9f036a, before EXP-PMA-001 is dispatched to
      /run-experiment. This decision does not perform that edit.
    - >-
      The dispatching session should author a corrected/successor handoff
      (or dispatch-queue entry) citing DEC-20260906-9f036a as authorized_by.
    - >-
      Once enacted, EXP-PMA-001 becomes eligible for ordinary
      /run-experiment dispatch under normal process; this decision does not
      itself authorize execution or dispatch an Executor.
