    "technical_design_gates": {
      "torsion": [
        "Use the exact homogeneous ideal J=(F_1^h,...,F_m^h) in a declared positively graded polynomial ring with distinguished h and a bounded candidate submodule of (J:h^infinity)/J. Freeze how f is represented and selected, the identity h^k f=sum_i a_i F_i^h, and the exact independent certificate checker. D=degree of output consequence, k=power of h, and E=max degree of all constructed combinations/certificate terms are distinct quantities; record all three and coefficient bit growth.",
        "The algorithmic question is whether feeding the certified affine consequences f|_(h=1) back to the solver reduces total charged work. IDEA-20260905-d76d38 is the separate earliest-derivation-degree persistence meter, not this adaptive solver transform. IDEA-20260905-3c4579 is a chart-denominator saturation-defect profile, not a proof of cheap h-torsion extraction. Shared meters/checkers are charged comparators only; return revise if the proposed algorithm collapses to an already owned question.",
        "Preserve the initial source panel: prime-field digit systems m in {2,3}, s in {3,4,5}; a separately defined actual Boolean n=12 arm; initial construction E<=8. Freeze all remaining fields, curves, bases, generator/degree schedules, seeds and finite counts. State how any later source scope is retained; Boolean n=12,15,18 with at least three seeds remains a GOAL-DREG completion requirement, not a claim discharged by the initial n=12 arm or an automatic permission to run later n.",
        "Preserve the source quantitative prediction V_new<=0.75 V_plain and total work_new<=0.8 work_plain at identical solutions, as well as H1: within E<=8, nonzero useful surviving consequences save more work than construction on at least half the fixed toy instances. Freeze V (rows, columns, nonzero support, dense volume or other exact source-consistent size measure), primary aggregation and the at-least-half denominator before data; report all raw matrix dimensions so presentation size cannot manufacture a gain.",
        "Preserve k=0/no-additional-generator identity with identical inputs, order, arithmetic and certificate policy; plain homogeneous/affine baselines; same-support and same-solution-count randomized coefficients with fields separate; exact zero invalid certificates and zero missed solutions in exhaustive calibration; and the source known-false infinity control.",
        "Before freezing the infinity control, explicitly reconcile its source wording: an h-torsion element supported entirely at infinity whose dehomogenization is zero must yield no useful pruning. Distinguish a nonzero homogeneous polynomial representative from its class modulo J, localization at h, affine polynomial image, zero/redundant class and low-degree presentation utility. Construct a realizable exact control and expected verdict under the declared object, retaining the source requirement. If the intended literal predicate is inconsistent for that object, return a concrete revise request with the exact mismatch; never silently omit the control, assert it passed, or label this intake an observed mathematical failure.",
        "Freeze an observation-collision pair with equal bounded torsion dimensions but different h=1 images/usable consequences; do not merge them by dimension. Include invalid h-power/coefficient/identity and lossy-root corruption controls with independent rejection. All affine consequences must carry sound membership witnesses and no original solution may be lost; root equality does not by itself certify ideal equality.",
        "Freeze bounded witness discovery/order, unsuccessful candidate accounting, stopping limits and exhaustive toy oracle separately from the solver. A certified k or E upper bound is not a minimum without full-column lower-degree nonexistence certificates. Searching full saturation is not assumed cheap and reuse of S_4 or a favorable chart must charge the common denominator/exceptional defect.",
        "Preserve source-goal residuals: full-column Boolean DREG and n/seed requirements; separately approved prime-field C_decomp verifier/precommit activation under GOAL-SDEG; actual non-rewritable signatures and D>=6 null recalibration under GOAL-SIG; GOAL-PATH is advisory only. No Boolean/prime-field/Yokoyama theorem transfer or adoption of old reported rank counts as validated evidence.",
        "Retain full empirical distributions, worst-decile costs, exceptional branches and held-out seeds as required by source H1."
      ],
      "relative_syzygy": [
        "Use corrected IDEA-20260905-f9df88 with predecessor fbe4a0 hash preserved. Its additive correction fixes the disjoint baseline only; it does not discharge gluing exactness, hidden Tor, literature or cost obligations. Freeze the relative separator syzygy object before proposing an algorithm.",
        "Declare the common separator ring, two side rings, ambient extension ring, their coefficient fields/gradings, ordered generating lists including membership equations, ideal extensions, and every inclusion/base-change map. Define the ambient syzygy module and exact quotient by transported intrinsic side syzygies, membership/principal and cross-Koszul relations. Give maps, kernels/images, presentations and witness identities sufficient to establish both inclusions and completeness; do not replace the quotient with raw nullspace dimension.",
        "If using fiber-product, tensor-product or mapping-cone language, specify an actual complex and comparison maps with hypotheses; audit nonflatness and all relevant Tor terms. State which exactness claim is needed and how an independent certificate or formal stage will establish it. Degree truncation is explicit and not a whole-resolution theorem.",
        "Freeze colon/normal-set/non-rewritable signature conventions, module and term order, rewritable criterion, minimal graded generator counts and their independent minimality certificate. Retrieve the actual Yokoyama primary definition and its field/presentation hypotheses; IDEA-20260903-afa56b contains explicit recalled reconstruction and wrong-object warnings, not a validated replacement theorem. Ordinary algebraic normality and binary streamed-column counts cannot substitute for the intended object.",
        "Retain the complete source finite panel: disjoint R=k[x,y], I1=(x^2), I2=(y^2) with Koszul convention; two quadratic subsystems sharing one variable; two symbolic S_3 equations with public toy coefficients; disjoint versus one-separator comparison; repeated-squaring high-degree elimination chain; and same-incidence, same-generator-degree random-coefficient null in the same field. Freeze actual fields, coefficients, lengths, degree cutoffs, seeds and counts for every family; no collapsing the panel into two RUN slots.",
        "For the corrected baseline, prospectively reproduce that first syzygies of (x^2,y^2) are generated by (y^2,-x^2) and the unexplained quotient vanishes after cross-Koszul removal. The null is separate. The repeated-squaring plant must expose growing elimination degree/certificate complexity at width one; impose field equations only in an explicitly separate object so finite-field identities do not erase the known-false control.",
        "Preregister minimal graded generators, separator elimination degree, non-rewritable signatures, exactness/Tor residuals, full construction and checking work, coefficient/degree growth, maps and witness bytes. Separate a bounded separator certificate from an exponentially expensive side elimination. If the conditional assembly target C1+C2+poly(s_D) is retained, define s_D and the actual polynomial operations/exponents and stored witnesses; no bound on s_D is known from this proposal.",
        "Search for observation collisions with identical proposed separator summary or graded counts and distinct global relation modules/costs; preserve the distinguishing data and known-false behavior. Failures of exactness, hidden Tor explaining apparent savings, or counting rewritable/Koszul copies as new are the source falsifiers; distinguish an invalid instrument from a valid scoped counterexample.",
        "Reconcile H-SIG-3b8631/EXP-SIG-c5d288 as certified acyclic unit-pair cancellation with full Boolean C2->C1->C0 contraction/reconstruction, and H-SATIC-6fdb7a/EXP-SATIC-6951b0 as regular-chain DAGs of exact residual continuations. Their frontier references to f9df88 are not source ownership. They can supply charged comparators only after matching objects. Return revise if the proposed relative gluing contract reduces to either existing mechanism.",
        "State quantifiers: one uniform gluing construction must account for every class at every declared chain length for any eventual uniform theorem; separately selected witnesses on a finite panel do not prove this. The present target is a bounded source-faithful protocol and potential obstruction measurement. Preserve GOAL-SIG actual-object/D>=6 null recalibration and GOAL-PATH advisory-only boundaries, with separate prime-field solving-degree gates if such costs are claimed."
      ],
