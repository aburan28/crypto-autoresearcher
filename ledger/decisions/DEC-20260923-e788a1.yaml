  limitations:
    - >-
      Scope: approval of a protocol for EcGFp5-SHAPED toy curves at ladder
      primes 4111, 262151 and 16777291 (fixtures at 4111 and 16777291), with
      n = 5, msolve 0.6.5 at -t 1, and a 10 GiB child RLIMIT_AS on the
      recorded host. Nothing here is a measurement, and nothing transfers to
      p = 2^64.
    - >-
      The fixture's red-team values rest on one reviewer computation at
      n = m = 3 (reproduced only by re-running its script) and at n = m = 4
      (not reproduced). AC-4 turns the rerun into the first independent
      check at n = m = 3. F-4 at n = m = 4 remains non-blocking.
    - >-
      The exact even-flip invariance of the normalised Laurent relation
      function was not re-derived by this act. It is checked numerically,
      before any n = 5 cell, by the single-flip test and F-2.
    - >-
      The v2 envelope (10 GiB) is smaller than v1's (11 GiB). An m = 5 arm
      that ends not_measured under it says nothing about D, and nothing
