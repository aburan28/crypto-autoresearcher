  proof_search_map_audit:
    location: amendment change.DC-3_K5_replace_arm_iii.proof_search_map (lines 605-773)
    baseline_reproduction: >-
      PRESENT AND BLOCKING. The n = m = 3 square analogue (F-1) is built by
      the rerun's own committed implementation at p' = 4111 and 16777291.
      Expected D = 16 for torsion_S3_rq against 64 for S_3, for S3_rescaled
      and for the old norm arm, plus 384 for both raw forms. The four red-team
      targets are an exact regression. Gate: F-1, F-2 and F-3 at both primes
