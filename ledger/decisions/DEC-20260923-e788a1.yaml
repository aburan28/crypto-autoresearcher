  rationale:
    - >-
      THE DRAFT IS A COMPLETE PROTOCOL. It restates every frozen field it
      touches with an explicit frozen -> amended mapping (supersedes_fields,
      lines 123-230). It keeps the T-1 thresholds (2^6, 2^9), scored only on
      measured like-for-like D. It adds F1', a new falsification branch that
      is not easier to avoid. It declares F3 undecidable before any value
      exists, because K6 showed it could never be scored. It rules on the
      anchor without picking a band because it passes: v1 stays FAILED, and
      the blocking role passes to a stronger system-and-trace identity. It
      repairs every recorded accounting defect (R-1 to R-11). It states an
      envelope and a run count, and it records its transfer assumptions.
      Every change is made before any v2 run. Of the two outcomes seen before
      drafting, the anchor ratio is not re-scored. The red-team degrees are
      adopted as fixture expectations, not as scored outcomes. That is what
      AGENTS.md requires of a versioned protocol_amendment.
    - >-
      IT TESTS THE MECHANISM THE HYPOTHESIS NAMES. Arm (iii') realises the
      (Z/2)^4 x| S_5 group the frozen label names (specification line 117).
      The norm construction is kept only as a labelled negative control. The
      construction is taken from the red team's derivation and says so; it
      does not rest on FHJRV's Prop. 13, which needs b to be a square. Its one
      unproved step, exact G2-invariance of the normalised relation function,
      is gated by the numeric single-flip test and the orbit-by-orbit identity
      control F-2 before any n = 5 cell.
    - >-
      WHY THE CONDITIONS. AC-1: A-2's 12 GiB child cap has no margin on this
      host against the guard kill observed at 13.1 GB. A-4 already delegates
      lowering the cap, so this act fixes the value instead of leaving it to
      judgement at run time. AC-2: the draft would otherwise write v2 over
      snapshot-bound v1 bytes that the ledger cites by line. AC-3: it turns
      R-11 into a verifiable two-commit sequence under one archival task.
      AC-4 makes the fixture an independent derivation instead of a third
      run of the same script. AC-5 keeps a derivation error from being
      misfiled as an implementation defect. AC-6 is machine protection.
    - >-
      WHY THIS IS THE ONE NEXT RUN, AHEAD OF EXP-GFPN-659e34. First, the
      program biases toward the torsion-quotient question that decides goal
      criterion C1 and KN-OPEN-9b4a2b, over the constant-measurement contract
      of H-GFPN-3366ea (claim_kind constant_factor). Second, 05ff43 v2's
      committed implementation is the repaired m = 4 driver that the 659e34
      companion's M-2 names for reuse. Third, its fixtures F-1 to F-3 gate
      the genuine m = 4 quotient arm that the companion's F-4 defers. Fourth,
      EXP-GFPN-659e34 is not runnable until its F-1 is disposed of by a
      further amendment (DEC-20260923-9b0c79). Both are solver-running, and
      the host runs one at a time.
    - >-
      GOAL SCOPE CHECKED. GOAL-GFPN-380702 excludes "Torsion-quotient PDP
      benchmarks (owned by IDEA-20260918-7a11c2)" and asks that torsion
      quotients not be reopened under this goal. Arm (iii') is not a new
      torsion-quotient campaign. It realises the arm (iii) that this goal's
      own approved contract already carries (specification lines 115-118,
      approved by DEC-20260920-fe73de). IDEA-20260920-a639a1 scopes it as
      "the n = 5 extension-field instance of the same 2-torsion mechanism",
      distinct from 7a11c2's prime-field toys (IDEA-20260920-a639a1 lines
      49-52). The exclusion is therefore not triggered.
    - >-
      NO SECURITY READING. The re-anchored band figures are the design note's
      model with explicit conventions. Any v2 figure that lands below 142.4
      uncharged or 149.3 charged is reported next to its own convention's
      constant. Any reading of it as "EcGFp5 below 142 bits", or as "the
      2-torsion quotient does not help", is a break or closure claim that
      routes to review-breakthrough before any promotion (DC-9;
      KN-OPEN-9b4a2b lines 108-117).

