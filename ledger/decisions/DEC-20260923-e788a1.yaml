      jv_anchor_system_trace_identity baseline at (n-1) = 4 on F_{p^5}
      (rulings.DC-5).
    observation_collision: >-
      PRESENT. Three known collisions are named, each with its separator:
      (1) norm arm vs S_m arm (same D, same support): separated by the
          monomial-support count and a numeric single-flip test on every built
          polynomial;
      (2) planted-target D at m < n: excluded from v2 entirely;
      (3) undefined D on overdetermined m = 4 systems: never read as a degree.
    quantifier_order: >-
      PRESENT. For each ladder prime fixed before any run, (beta, lam) is
      fixed per (curve, p') before any target is drawn, and every arm is
      solved on the same R. A per-target (beta, lam) invalidates the cell. No
      witness depends on R.
    method_ceiling_and_nearby_object: >-
      PRESENT. The ceiling is stated: measured D, flatness, R_ref where the
      reference completes, and a modeled band. It excludes security levels,
      F4/FGLM cost at p = 2^64, LA and memory cost, any exponent, and any drop
      above 2^{m-1}. Nearby objects:
      - a curve without rational 2-torsion must refuse, with a recorded
        refusal;
      - a matched b-non-square random_with_2torsion curve at every prime;
      - the norm arm as a labelled negative control, expected D = D_{S_m}.
    separate_obligations: >-
      PRESENT. Interface, three correctness obligations, size (the m = 5
      degree is an extrapolation), success probability (a model input),
      runtime (identical charging) and scope (not_measured is
      envelope-scoped) are listed separately. The strict-improvement claim
      (the 2^{m-1} drop at m = 5) is NOT hidden in a feasibility lemma. It is
      P-3, labelled an extrapolation.
    residual_gap_accepted: >-
      The draft's honest_expectation (lines 337-350) states that F1 and F1'
      are probably not scoreable at m = 5 under any envelope the program has,
      because D_raw and the S5_rescaled reference will probably end
      not_measured. In that case the drop is evidenced only at n = m = 3, and
      D_iii' at m = 5 is reported unscored against 2^16 (T-4). This is
      accepted because it is stated before any run, T-4 is never turned into
      a success condition, and the measurement KN-OPEN-9b4a2b asks for (D of
      the quotient at m = 5, its flatness across three primes, and whether it
      completes within a stated envelope) is still produced.
    verdict: >-
      PASSES the gate. All four audits and separate obligations are present
      before compute.

  conditions:
    - id: AC-1
      name: memory envelope with margin (exercises DC-7 A-4)
      text: >-
        Every msolve child, and every builder or interpolation process, runs
        under RLIMIT_AS = 10737418240 bytes (10 GiB), set in the child and
        read back with getrlimit per DC-6 R-1. This is NOT the 12 GiB of A-2.
        Reason:
        - the host has 16481980 kB (about 15.7 GiB) and no swap;
        - the dispatching session's memory guard killed a v1 probe at 13.1 GB
          (implementation.md lines 224-228);
        - a 12 GiB child (12.88 GB) plus the driver would reach that kill
          point.
        Rules:
        - One memory-heavy process (solver or builder) runs at a time.
        - The driver's RSS is checked before each child launch; if it exceeds
          1 GiB, the driver refuses to launch the child and records why.
        - The task envelope is at most 11 GiB. That leaves about 2 GB below
          the observed kill point and about 4.7 GiB below physical RAM.
        - If the dispatching session's guard threshold is below 12.0 GB, the
          Executor lowers the child cap to 2 GB below that threshold, per A-4,
          and records the value.
        - msolve runs with -t 1 (A-3).
        Every not_measured row carries the cap actually in force in its
        envelope tuple (A-6). Rows are never compared as like-for-like with
        v1's 11 GiB, -t 4 envelope (CORR-20260923-3cbb89). A larger host up to
        the contract's 32 GB (specification line 249) stays permitted under
        A-5, with rows never merged. The cap is machine protection, never a
        research budget. Exhausting it is an infrastructure outcome, never
        evidence about D.
    - id: AC-2
      name: v2 paths are new; v1 bytes stay byte-identical
      text: >-
        The v2 implementation is written to
        experiments/EXP-GFPN-05ff43/implementation-v2/ and
        experiments/EXP-GFPN-05ff43/implementation-v2.md. The v2 trial plan is
        experiments/EXP-GFPN-05ff43/trial-plan-v2.json (R-2). v2 run packages
        go under new RUN-GFPN-* directories listed in that plan.
        experiments/EXP-GFPN-05ff43/implementation/,
        experiments/EXP-GFPN-05ff43/implementation.md and
        experiments/EXP-GFPN-05ff43/trial-plan.json are READ-ONLY. They are
        bound by snapshot TASK-20260921-98561a and cited by line throughout
        the ledger (for example implementation.md lines 251-255 in this
        decision). A content change would break those citations and the
        content-first archive check (CLAUDE.md "Archive receipts bind to
        CONTENT first"). The amendment's DC-6 R-11 phrase "implementation/ and
        implementation.md" is read as the v2 implementation tree at these new
        paths. This is a path clarification, not a protocol change. v2 code
        may import or copy from the v1 tree. The hard-coded loci that DC-2
        lists are replaced in the v2 tree.
    - id: AC-3
      name: implementation committed before any run (DC-6 R-11)
      text: >-
        TASK-20260923-cd932c runs in two stages. Stage 1 writes the AC-2 paths
        and creates no v2 run package. The dispatching Coordinator then
        archives them as phase A of TASK-20260923-0fa03f, the card's one
        archival task, and the post-commit verifier must accept that commit.
        Stage 2 starts only then. Every v2 manifest records the phase-A commit
        and a clean tree for implementation-v2/. Phase B of the same task
        archives the run packages and the execution report before independent
        review. Precedent for one archival task with two receipted commits:
        TASK-20260923-3b12c2 (IMP-2 cleared by DEC-20260923-d86ff2).
    - id: AC-4
      name: fixture independence
      text: >-
        The n = m = 3 arms are built from the amendment's specification (DC-3
        definition and fixture F-1). The Executor does not import, copy or
        execute code from
        coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/.
        It may read square_analogue_n3.json and square_analogue_n4.json only
        for the curves, beta values, target x_R values and expected degrees.
        Result: a passing F-1 becomes the first derivation of the n = m = 3
        degrees that is independent of the red team's script. The only
        earlier check was a re-run of that script (DEC-20260923-d86ff2
        limitations). The validator's
        coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-58953e/scratch/k4a_anchor_system.py
        is RUN as the independent comparator for jv_anchor_system_trace_identity,
        as rulings.DC-5 (2) names it. Its code is not copied into
        implementation-v2/.
    - id: AC-5
      name: how a fixture mismatch is read
      text: >-
        Two expected values of F-1 are Coordinator derivations, not red-team
        observations: raw_u = 384 (P-2 at n = 3) and S3_rescaled = 64 (P-5).
        A mismatch confined to those two values is returned as "implementation
        or derivation", naming both explanations. It is not presumed an
        implementation defect. Any failure of F-1, F-2 or F-3 ends the task at
        the gate. No n = 5 cell of any arm runs. The failure is an
        infrastructure or implementation signal and never a mathematical
        result about the quotient (DC-3 gate). The repair, or a re-derivation,
        is a successor task minted by a new Coordinator decision. It is not a
        silent re-iteration inside this card.
    - id: AC-6
      name: machine quiet and lane
      text: >-
        No other solver-running process runs on the host during stage 2. That
        includes EXP-GFPN-659e34, which is not runnable anyway (IMP-3;
        DEC-20260923-9b0c79), and any other goal's solver (goal
        max_concurrent_basis). The lane is claimed with tools/goal_lanes.py
        before each stage launch and released on return. Any per-target
        wall-clock watchdog is declared in trial-plan-v2.json before phase A,
        uniformly per (arm, m). Its expiry is not_measured (timeout), never
        evidence that D is large.

