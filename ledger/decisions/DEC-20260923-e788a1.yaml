    - The band arithmetic of DC-2 B-2, recomputed:
      - p^{2-2/5} = 2^102.4;
      - charged quotient systems 2^{4 + 6.9 + 102.4 - 1} = 2^112.3, giving
        144.3 / 162.6;
      - S_5 charged 149.3 / 171.6;
      - raw 156.2 / 185.4 uncharged;
      - quotient 134.4 / 152.7 uncharged.
      All agree with the draft.
    - The DC-3 construction's invariant-theory step. Even flips fix
      t'_i = u_i + beta/u_i and w = prod(u_i - beta/u_i). A single flip negates
      w. {1, w} is a basis over F(t'), so an S_m-invariant A + wB has A and B
      symmetric in t'. A per-variable degree bound of K/2 = 8 (A) and 7 (B)
      gives sigma-degree <= 8 and <= 7, so C(13,5) = 1287 and C(12,5) = 792.
      prod(t'_i^2 - 4 beta) has sigma-degree 2. Exact invariance of the
      NORMALISED Laurent form under even flips is not re-derived here. It is
      what the single-flip test and fixture F-2 check, before any n = 5 cell.
    The Coordinator ran nothing; no shell was available.

