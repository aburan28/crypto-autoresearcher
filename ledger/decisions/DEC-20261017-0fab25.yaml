      - {batch: 2, commits: [2682b84e8, 9062b61f5], before: 312, after: 263, what: "4 immutability breaches restored (CORR-20261017-940131, CORR-20261017-b3ef10); manifest_v2 for RUN-SEMBIN-9ecb77 and the three runs published with it; EV-SEMBIN-3e91a7 now resolves its run"}
      - {batch: 3, commits: [699c5450d, 2fd432d27], before: 263, after: 157, what: "46 flat-manifest v2 records; 21 specification, 6 decision and 7 handoff schema supersessions"}
    new_errors_after: 157
    discrepancy_287_vs_319: >-
      The triage note's 287 was measured with the validator-indexing fix, at
      fdcdb905f. It excludes three runs that tools/experiment_execution.py published
      afterwards, at 3c21c2e8f (2026-10-16 22:42, before #2296 merged at 23:03):
      RUN-SEMBIN-a818df, RUN-ECDLP-3d61b8 and RUN-ECDLP-06bb83. Each has 11 errors,
      33 in all. Separately, DEC-20261016-5d2fb8's invalid-YAML error (finding M1)
      was cleared by its own schema supersession, -1. So 287 + 33 - 1 = 319.
      RUN-SEMBIN-9ecb77 (a7da3c419, after #2296) adds 11, giving 330. This was
      checked by diffing the per-file error list against the triage note's
      per-record table: the only records in the current list and not in the
      table are those four run manifests, and the only record in the table and
      not in the list is DEC-20261016-5d2fb8. Root cause, upstream: the driver
      writes a partial run envelope and experiment_execution.py publishes it
      unchanged. That is a tooling defect, not corrected here.

  rulings:
    immutability_breaches: >-
      Git history decides which bytes are authoritative. For EXP-SEMBIN-509d41
      (RUN-SEMBIN-9000a8, -bd538f) and EXP-ECDLP-7d2a86 (RUN-ECDLP-02af0e, -fc4eff),
      two executions were published under the same run ids. The first-archived
      execution is authoritative in both cases: its completed snapshot archive
      (TASK-20261003-caff4e; TASK-20261003-60defb, dispatcher state completed), its
      registry pins and its registered manifest_v2.yaml all name it. The later merge
      that overwrote it (792f5b718 via #1901; 6431c3ccc, #1616) is not bound by any
      completed archive or registry row. The bytes are restored per the
      CORR-20260916-5166fe route, and the registry is not re-pinned. The displaced
      executions stay in history. They are not citable under the reused ids; their
      raw results differ only in wall-clock fields. Details and every hash are in
      CORR-20261017-940131 and CORR-20261017-b3ef10. The registry route cannot
      express "a second execution under the same id", so this ruling is the
      record of that.
    run_sembin_9ecb77: >-
      Its manifest_v2.yaml records result.valid false, with the invalid_reason of
      DEC-20261016-5d2fb8 (an instrument defect in the frozen driver). The schema
      completion makes the run indexable. It does not make it evidence.
      EV-SEMBIN-3e91a7's citation now resolves to an invalid run, which is what
      that evidence record says.
    validity_in_new_v2_records: >-
      Every manifest_v2.yaml written under this decision copies validity from the
      execution receipt and the producer's own label. Where neither says
      anything, it records null. A producer's completed_valid label is the
      producer's claim, not a Coordinator ruling. These records change no
      evidence direction or strength and no hypothesis status.

  dispositions:
    note: >-
      Each record below still fails validation after this triage (157 errors in
      all). Each one could only be completed by writing content that no committed
      file contains. Nothing was fabricated. "Retired" means kept on file and
      not citable for the stated purpose. "Open" means a mechanical completion
      route exists but needs per-record reading beyond this session.
