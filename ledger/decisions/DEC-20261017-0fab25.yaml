          decomposition or key_recovery claim. A v3 relabel to kind none that
          keeps the original label (registry kind
          certificate_schema_label_correction, as precedented) is authorized but
          not performed here. These two also cause one of the pre-existing
          tools/test_run_supersession.py CommittedRegistryTests failures.
      - record: experiments/EXP-ECDLP-daee4d/specification.yaml
        errors: 4
        disposition: >-
