        errors: 10
        disposition: >-
          Open. The nested manifests put the certificate at run.certificate and
          have no environment, inputs, timing or result. The companions
          (environment.json, command.txt, execution-report.yaml,
          resource-samples.json, stage1_*.json) appear to hold these fields, but
          the stage-1 package is bespoke and needs a per-run additive completion
          by a session that reads it. The runs' existing citations are unchanged.
      - record: experiments/EXP-AUXIN-339fb0/specification.yaml
        errors: 1
        disposition: >-
          Retired as a pre-schema draft. It is a generated successor_contract
          (approved_by null) and was never an approved experiment contract. It is
          not citable as one. Decisions naming the id now resolve through the
          validator's indexing.
      - record: experiments/EXP-BINSTD-591d28/runs/RUN-BINSTD-f7ca97/manifest.yaml
        errors: 1
        disposition: >-
          Retired; not citable as evidence. The run directory has no command.txt,
          environment.json or launch.json. Its receipt says invalid_output, check
          exit 2. If it must be indexed, the route is a provenance_quarantine
          supersession (docs/evidence-and-reproducibility.md), not a reconstructed
          command.
      - record: experiments/EXP-BINSTD-fdd2d9/runs/RUN-BINSTD-51ad99/manifest_v2.yaml, experiments/EXP-BINSTD-fdd2d9/runs/RUN-BINSTD-e55dcf/manifest_v2.yaml
        errors: 2
        disposition: >-
