  rationale:
    - >-
      AGENTS.md core rule 4 (results are immutable; corrections are new records)
      and rule 9 (never fabricate). Every completion copies committed bytes and is
      hash-pinned on both sides. Every gap that only invention could fill is ruled
      on instead of filled.
    - >-
      Restoring archived bytes is not editing a record. A completed archive declares
      what those bytes are, and CORR-20260916-5166fe set the precedent.
