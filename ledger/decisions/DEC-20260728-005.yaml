      promote because knowledge/ lay outside every declared write scope there.
      Three deltas from the drafted text were applied by this archive and are
      recorded inside the entry rather than left silent: the AC2 contested-across-
      retrievals marker on the F_p clause of the front-matter complexity field,
      the O10 relabelling of the descent finding as ar5iv's rendering of the
      arXiv version and unverified for the published one, and the AC1 record that
      KN-TECH-029 carries no back-pointer, must not be edited to acquire one, and
      that the regenerated knowledge/INDEX.md is the only place the supersedes
      edge is rendered and must render it in both directions. None of the three
      changes an exponent, a tier or a scope.
    mandatory_promotion_trigger: >-
      DOES NOT FIRE, AND THE REASON IS STATED RATHER THAN FORMULAIC. The trigger
      requires a support or reject_scoped disposition backed by evidence of
      strength replicated or strong. This disposition is revise, and EV-SSI-003
      is strength preliminary, capped by a model-independence failure that is now
      in its fifth consecutive session. KN-TECH-056 is therefore NOT a discharge
      of the trigger: it is a CORPUS-CURRENCY SUPERSESSION SOURCED TO ARCHIVED
      PRIMARY TEXT, reporting what a frozen source in this repository says, and
      it asserts no result of this program's own. The evidence-strength cap bars
      an internal finding from promotion; it does not bar a corpus-currency
      correction, and this archive promotes only the latter.
    not_warranted: >-
      NO KN-FIND IS WARRANTED BY THIS DECISION, for four concrete reasons.
      (1) The mandatory trigger does not fire, as recorded above. (2) The two
      items with durable-finding character - S3's p^{1/3} floor for
      recognizable-subgraph mechanisms, which explains why two unrelated
      mechanisms share the exponent 1/3, and C4's degeneration, which explains
      structurally why the archived source calls group-action constructions safe
      from its attack - are each ONE bounded derivation by one session on one
      model identity, and S3 additionally carries an unpriced evasion (O11, the
      steered depth-first-search alternative) that could move its floor.
      Promoting either now would import an unreplicated single-lineage result
      into the corpus as a finding. (3) The preserved memory-independence
      conclusion rests on an L2 statement absent from the numbered heuristic
      inventory (O6) and concerns a construction this repository itself
      specified, so it is internal-consistency, not a finding about any published
      algorithm. (4) NO KN-OPEN ENTRY IS CREATED EITHER: RC4, RC5, RC7, RC8 and
      RC11 through RC15 are bounded controls with named owners and stated costs,
      not crystallized open problems. The candidate route for a future KN-FIND is
      named rather than left implicit: if RC11's count lands at 1/3, S1 plus that
      count is a BARRIER statement capping the archived architecture at
      p^{1/3+o(1)}, which is exactly the shape a proven negative worth promoting
      takes - but it needs the count completed and an independent check that this
      batch could not supply.
