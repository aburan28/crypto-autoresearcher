    entry_path: knowledge/findings/KN-FIND-009.md
    index_path: knowledge/INDEX.md
    reserved_id_collision: >-
      A FOURTH ID HAZARD, FOUND WHILE WRITING THIS RECORD AND NOT ACTED ON. The
      BATCH-009 queue reserved knowledge/findings/KN-FIND-001.md in
