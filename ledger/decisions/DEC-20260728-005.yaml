coordinator_decision:
  id: DEC-20260728-005
  context: >-
<<<<<<< HEAD
    GOAL-SSI-001 BATCH-003 close-out. The batch ran the bounded
    mechanism-generation gate opened by the committed next_action of
    DEC-20260728-004, with the BATCH-002 review debt attached as one zero-compute
    card. Producer TASK-20260728-010 derived the screening instrument S1 and
    screened four candidates C1 to C4 against the corrected TIME tiers at zero
    curve compute, locating no decisive external ingredient. Producer
    TASK-20260728-011 discharged the four carried debt items, confirming D1 while
    downgrading it to bookkeeping, CONFIRMING the conclusion of Lemma 4-prime(b)
    while REFUTING its published proof and supplying a replacement, raising new
    objections O1, O2 and O5, partially closing RC4 with a finding that
    CONTRADICTS this program's own erratum, failing RC5 outright, and drafting the
    C-beta supersession. Snapshot archive TASK-20260728-012 committed exactly its
    five declared producer paths. Independent red team TASK-20260728-013 verified
    that snapshot itself, verified all thirteen KN-TECH-056 locators rather than
    sampling them, re-derived S1, S2, S3, D1 and the Lemma 4-prime(b) replacement
    including the diagonal case it expected to fail, returned gate R2 ADMIT, and
    raised objections O6 to O12. All four sessions across BATCH-002 and BATCH-003
    independently report new_attack_mechanism_detected false. Model independence
    was unavailable for the fifth consecutive session.
  decision: revise
  target_ids:
    - GOAL-SSI-001
    - RQ-SSI-001
    - EV-SSI-003
    - KN-TECH-056
    - TASK-20260728-010
    - TASK-20260728-011
    - TASK-20260728-012
    - TASK-20260728-013
    - TASK-20260728-014
  rationale:
    - >-
      WHAT THE BATCH ESTABLISHED, AT DERIVATION TIER. S1: in the Wesolowski
      architecture the time exponent EQUALS the structural degree-bound exponent
      beta one for one, with no second channel that an independent re-derivation
      could find. That converts an open-ended search into a single decisive
      question about one external bound. S2 closes the polynomial branch of lead
      L1 for compose-with-a-small-isogeny families by derivation. S3 gives a
      p^{1/3} floor for recognizable-subgraph mechanisms, explaining the
      previously unexplained coincidence that the heuristic-conditional frontier
      and the optimum of an entirely different mechanism are both 1/3, and
      identifying a single existence question in place of a hope. C4's
      degeneration explains STRUCTURALLY why the archived source's own text calls
      group-action constructions safe from its attack. The Lemma 4-prime(b)
      conclusion is preserved on a replaced proof. One corpus-currency correction
      reaches the corpus that BATCH-002 could not write into.
    - >-
      WHY THE DISPOSITION IS revise. The batch's own recommendation does not
      survive its review intact, and revising it is precisely the decision the
      record supports. Objection O8 shows the screen held, unused, a heuristic
      count from its own toolkit that points AGAINST its first-ranked candidate;
      objection O9 shows the demotion of its second-ranked candidate leans on an
      unverified recollection in a greppable field; objection O6 shows a control
      the discharge marked as blocking nothing is in fact a precondition of the
      conclusion the discharge preserved; objection O11 shows a cost-model
      evasion the two concurrent producers could not see between them. None of
      these is fatal, all are cheap to repair, and together they mean the correct
      output of BATCH-003 is a REVISED candidate ordering plus a corrected
      dependency label, not a promotion and not a closure.
    - >-
      WHY NOT support OR approve. No hypothesis record exists to promote,
      IDEA-20260725-001 remains at idea stage, and no experiment is specified to
      approve. Independently of that, all four asymptotic-claim promotion gates
      are unmet by a batch that computes nothing: there is no assembled proof
      decomposition for a new claim, the heuristics C1-H1, C1-H2, C3-H1, C3-H2
      and H1-prime through H4-prime carry no archived validation and no scheduled
      validation experiment, no concrete-cost table at standardized parameter sets
      exists, and while an independent red-team pass DID run, it ran on a fifth
      session of one model identity. A claim in this state may reach analyzed; it
      may never be recorded supported.
    - >-
      WHY NOT reject_scoped, ON EITHER OF THE TWO REJECTED CANDIDATES. The
      derivations behind C2's and C4's rejections are real, are displayed where a
      reader can check them, and were re-derived by a non-originating session -
      so the refutation-artifact requirement is met at proof_status derivation
      rather than empirical_only. What is missing is INDEPENDENCE AND
      REPLICATION, not proof: EV-SSI-003 is strength preliminary, the whole
      lineage resolves to one self-reported model, and both rejections are
      candidate-level screen outcomes inside named families rather than research
      directions carrying an official status to close. Enacting a scoped
      rejection here would convert a bounded screen into a closure the record
      cannot carry. The rejections are recorded as scoped observations on
      EV-SSI-003 instead, with their family scope travelling with them.
    - >-
      WHY NOT weaken. weaken names a hypothesis-status transition and there is no
      hypothesis record to move. The one place the batch genuinely weakens
      something is internal: the erratum's published proof of Lemma 4-prime(b) is
      REFUTED AS WRITTEN, and its preserved conclusion now depends on an
      unnumbered L2 statement (O6). That is recorded on EV-SSI-003 as a corrected
      dependency label and as a live gate RC8, which is the accurate instrument -
      the conclusion did not weaken, its support did.
    - >-
      WHY NOT expand, replicate OR supersede. expand is excluded by the dispatch
      bias and by the record: no exponent moved and no candidate is admissible on
      full cost. replicate was the closest runner-up and would repair the
      single-model concurrence that caps every claim here, but the same
      constraint that caused the cap - the adapter refuses the one distinct model
      at the required effort, and its backend has no credentials - means a
      replication would produce a SIXTH session on the same model and buy
      nothing. supersede describes artifact-level facts already recorded inside
      EV-SSI-003 and inside KN-TECH-056, not a research-state transition.
    - >-
      WHY NOT pause, CHECKED CONDITION BY CONDITION RATHER THAN ASSERTED. Pause
      condition 1 requires the campaign budget exhausted WITHOUT an admissible
      next mechanism; the budget is exhausted on declared figures but C1 and C3
      are undecided rather than closed, so the second half fails. Pause condition
      2 requires all surviving mechanisms to need resources beyond the declared
      budget BEFORE a cheaper decisive gate can be constructed; a cheaper
      decisive gate WAS constructed in this batch - RC11 is one pen-and-paper
      session at zero compute - so it fails. Pause condition 3 requires a
      definitive infrastructure, authentication or dependency blocker; the
      model-independence failure degrades review strength and caps evidence but
      blocks no approved task, exactly as the BATCH-003 opening recorded. No
      declared pause condition holds, so the goal is left active.
    - >-
      BUDGET, STATED EXPLICITLY AND NOT ABSORBED. BATCH-003's five cards declared
      600 plus 480 plus 120 plus 420 plus 180 equals 1800 seconds, exactly the
      nominal headroom that remained. On declared figures the three batches now
      account for 5100 plus 3900 plus 1800 equals 10800, which is the WHOLE of
      campaign_budget.total_wall_clock_seconds. THE DECLARED HEADROOM IS NOW
      ZERO. Every card reports stopping inside its cap and each names what it did
      not reach, so there is no evidence of overrun; equally, no committed
      artifact records what any batch ACTUALLY consumed, so the tally is NOMINAL
      AND NOT AUDITABLE and this decision asserts neither that the budget was
      satisfied nor that it was exceeded. CONSEQUENCE, WHICH IS THE OPERATIVE
      ONE: BATCH-004 CANNOT BE OPENED INSIDE campaign_budget AS IT STANDS. Three
      of a maximum six batches are used, so the batch-count budget is not
      exhausted, but the wall-clock authorization is.
    - >-
      THE BUDGET DECISION IS REQUIRED AND IS NOT MADE HERE, AND THAT IS A
      DECLARED DEVIATION FROM A PRE-REGISTRATION RATHER THAN AN OVERSIGHT. The
      BATCH-003 queue's pre_registered_extension_trigger says this decision must
      either extend campaign_budget with its authorization or record that the
      campaign closes at budget. It does NEITHER, for a stated reason: an
      extension is a resource authorization that would fund a specific next lane,
      and the ranking of that lane is exactly what this batch's review unsettled
      (O8 and O9 push the same direction against the screen's own ordering) while
      the evidence supporting it is capped at preliminary on a fifth consecutive
      single-model session. Granting the extension inside the same record that
      closes the batch it evaluates would decide the next lane on the strength of
      a ranking this record has just declined to accept. Recording closed_at_budget
      would be worse: it asserts the campaign ends while two candidates are
      UNDECIDED and a cheaper decisive gate has just been constructed. The
      shortfall is therefore recorded here in full, as the trigger's first
      obligation requires, and the authorization is routed to its own Coordinator
      decision on its own record. A silent overrun is forbidden and is not taken.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 1: THE COMPLETION FLAG.
      new_attack_mechanism_detected is FALSE, now reached independently in FOUR
      sessions, the BATCH-003 reviewer stating explicitly that it reached the
      verdict on its own reasoning rather than by deferral and that NO BATCH-003
      output could satisfy a GOAL-SSI-001 completion criterion. BATCH-003
      SATISFIES NO COMPLETION CRITERION. Nothing in this decision may be read as
      partial completion, and no mechanism was manufactured to satisfy a
      completion route.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 2: O6 IS A CIRCULARITY AND IT CHANGES
      A FIELD. The Lemma 4-prime(b) replacement argument CONSUMES the L2 bound -
      the exact substitution the same discharge's objection O1 proves is not
      licensed by the numbered heuristic H1-prime. The discharge recorded control
      RC8 with blocks reading Nothing. THAT IS WRONG. RC8 is a PRECONDITION OF
      THE CONCLUSION THE DISCHARGE PRESERVED, and memory independence is
      correctly labelled as standing CONDITIONAL ON THE L2 SPECTRAL BOUND, which
      is proved inside the erratum's own section but is not the numbered
      heuristic three lemmas cite. RC8 is carried forward as a LIVE GATE. The
      repair costs one paragraph and zero compute and was not applied in this
      batch, because the erratum is immutable and no BATCH-003 card owned it.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 3: THE RANKING THIS BATCH RECOMMENDED
      IS NOT SUPPORTED BY ITS OWN RECORD. O8 supplies, at zero compute and from
      the artifact's own Eichler/Hurwitz toolkit, a counting sketch that
      beta = 1/3 is essentially tight - which is C1's own falsification condition
      1 - and the screen applied that toolkit only to C4. O9 shows C3's demotion
      leans twice on an unverified hardness recollection, and that the
      recollection is asserted as fact in the greppable screen_verdict field even
      though the prose disclaims it. Two errors pointing the same way. The
      new_attack_mechanism flag is robust regardless, because C3 can at best TIE
      the conditional tier and a tie is not a detection; the ORDERING is not
      robust, and C3 is the only candidate that escapes the disclosed
      superpolynomial o(1) rather than inheriting it.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 4: THE REVIEW'S OWN CEILING. The
      independent reviewer did NOT read the BATCH-002 artifacts; its checks of
      Lemma 4-prime(b), D1, O1 and O2 ran against the DISCHARGE'S RESTATEMENT, so
      a misquotation of the erratum would not have been caught. It says so
      itself, and names it the most important limitation of its own review. That
      bounds exactly what this review certifies, and it is why the preserved
      memory-independence conclusion is carried at preliminary strength with a
      live gate rather than treated as settled.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 5: REFERENCE [35] HAS NEVER BEEN
      VERIFIED BY ANY SESSION IN THIS PROGRAM, and the two reductions it supplies
      underwrite Corollary 1.2 and hence the claim that a p^{beta} OneEnd
      algorithm cascades to EndRing and Isogeny for free. That cascade is
      INHERITED, NOT CHECKED, and carries that label at every downstream mention,
      including inside KN-TECH-056. Separately, reference [4], the source of the
      degree bound that the whole architecture rests on, was searched for and NOT
      located, so every novelty status in the screen is capped at unverified.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 6: SOURCING. O5 establishes that two
      retrievals under KN-LIT-078's own identifiers returned two DIFFERENT
      abstracts, one containing no p^{1/4} figure at all, while that entry relays
      its figures FROM the abstract. The F_p figure is therefore CONTESTED ACROSS
      RETRIEVALS, not merely relayed - a stronger defect than the one previously
      recorded. NO LABEL IS DROPPED AND NO RANKING MOVES: the direction of the
      discrepancy is unknown, the likeliest explanation is unverified, and
      absence of a stable source is not evidence a figure is wrong. The marker is
      applied beside the existing label in KN-TECH-056 and remains open as RC14
      for KN-LIT-078 and the BATCH-002 v2 record, both of which are immutable and
      would require supersession rather than an edit.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 7: MODEL INDEPENDENCE WAS UNAVAILABLE
      FOR THE FIFTH CONSECUTIVE SESSION, exactly as the BATCH-003 opening
      pre-registered, and no session ran an adapter probe, so every model_verified
      field reads false. EV-SSI-003 is capped at preliminary ON THAT GROUND
      ALONE. No policy equivalence is claimed. No GOAL-SSI-001 closure attestation
      may count any BATCH-003 session as an independently-resolved judgement under
      AGENTS.md rule 13, and BATCH-003 supplies no attestation toward a completion
      quorum. The inference amendment that would trade review effort for model
      independence was NOT granted by the opening and is NOT granted here.
    - >-
      RECORDED RATHER THAN INHERITED, ITEM 8: DECLARED VERSUS COMMITTED. The
      BATCH-003 opening and the queue's declared_commit_sets pre-registered EIGHT
      paths for this archive if review gate R2 returned ADMIT and six otherwise.
      R2 RETURNED ADMIT, and the executing card declares SIX. SIX IS WHAT IS
      COMMITTED. The delta is exactly the two TASK-20260728-013 review paths,
      reported to this session as already committed separately, so that
      re-declaring them would make the declared set differ from what this commit
      changes - the same reduction and the same reason as BATCH-002's ledger
      archive, which declared six and committed four. The deviation REDUCES
      scope, both knowledge/ paths required by the ADMIT branch are present, and
      nothing outside the declared six is staged. TWO THINGS ARE NOT ASSERTED.
      This session has no shell, ran no git command and made no commit, so it did
      NOT verify that the two review paths are committed; and the queue's own
      rule that a path-set reduction be preceded by a recorded QUEUE-AMEND entry
      was not satisfied, since amendment_records is empty and the queue lies
      outside every archive's declared paths. This ledger record is where the
      reduction is recorded instead. It is written down even though the outcome
      is fine, because this campaign already carries one goal permanently
      unrenderable from a declared-versus-committed mismatch.
    - >-
      TARGET-CLASS ASSESSMENT. Under docs/target-result-profile.md rule A1
      NOTHING IN BATCH-003 IS TARGET-CLASS. C1 would be if its ingredient
      existed, and it was not located; C3 would be against the unconditional tier
      only, and it is blocked on an unverified existence question; C2 and C4 land
      above their tiers by derivation. The one preserved conclusion, memory
      independence, is a NEGATIVE result about attacks, and a theorem that a
      resource does not help is not an attack mechanism. Nothing here beats or
      matches a baseline, nothing is broken, and no exponent of any named hard
      problem moves.
    - >-
      DURABILITY. Nothing in BATCH-003 is official until this ledger archive
      commits and the dispatcher's post-commit verifier accepts it. This decision
      asserts no validator pass, no allocator run, no closure quorum, and no
      verification of any commit by this session, which has no shell. The
      BATCH-003 producer snapshot b978f883d5b2f1cbb45e138fb190c166862162ff is
      recorded as verified because an INDEPENDENT session recomputed its parent,
      reachability, exact five-path changed set and all five SHA-256 digests, not
      because this session did.
