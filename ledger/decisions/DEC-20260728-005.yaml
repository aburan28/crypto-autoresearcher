  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260728-009/refutation_claims_v2.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-012/verification_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-012/instantiation.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-013/scope_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-013/adversarial_notes.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-004/review_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260728-004/adversarial_notes.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/tasks/TASK-20260728-010/refutation_claims.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/tasks/TASK-20260728-010/derivation_note.md
  - experiments/EXP-ENDO-001/amendments/v1_withdrawn_before_execution.yaml
  - experiments/EXP-ENDO-001/specification.yaml
  - ledger/proposals/IDEA-20260727-005.yaml
  - ledger/proposals/IDEA-20260727-008.yaml

  limitations:
  - >-
    ZERO RUNS. EXP-ENDO-001 was never executed. This decision interprets no
    measurement, because there is none, and it is not a decision about a run set.
  - >-
    TOY SCALE. The counterexample instance is a 33-bit p with a 30-bit N, plus a
    28-bit secondary instance at j = 1728. Nothing here is crypto-scale or is
    presented as scale-matched.
  - >-
    NOT A CRYPTANALYTIC RESULT. No attack, no attack improvement, no hardness
    result, no lower bound, no closure and no impossibility claim. This is paper
    algebra about a withdrawn instrument, plus the certificate that pins it.
  - >-
    NO EXPONENT MOVES AND ALL FOUR PROMOTION GATES REMAIN OPEN. None is addressed.
    Nine batches have now produced no candidate attack improvement reproduced or
    proved within scope and no independently validated novel technique.
  - >-
    NOTHING IN THIS LANE IS TARGET-CLASS AND NOTHING IN IT COULD HAVE BEEN. The
    largest positive quantity anywhere in it is the classical automorphism-quotient
    constant, at most sqrt(6) = 2.449.
  - >-
    INDEPENDENCE IS SESSION-LEVEL AND IMPLEMENTATION-LEVEL ONLY. Both reviews
    report model_verified false and neither could resolve a model identifier
    through orchestration/adapter, which does not exist on this branch.
    Correlated-model error is not excluded, and the deciding session is the session
    that wrote the superseded claims.
  - >-
    RC-6 IS NOT DISCHARGED. No SVP was run on a curve-backed alternative eigenvalue
    triple, so the positive statement that relation-free genuine r = 3 cells are
    typical is UNMEASURED. The retraction of the two-point cap rests on a
    derivation, which is sufficient to void a universal claim and is not sufficient
    to establish a distribution.
  - >-
    EXPERIMENT-STATUS VOCABULARY GAP, RECORDED RATHER THAN FORCED. AGENTS.md has no
    `withdrawn` experiment state. This decision does NOT map the withdrawal to
    `invalid` by editing the committed specification.yaml, which is immutable and
    was not touched; the withdrawal lives in a versioned amendment file and the
    committed contract still reads `approved`. It is expressly NOT
    `failed_infrastructure`: nothing crashed, nothing timed out and no compute was
    spent. The gap is carried for a batch that can repair the vocabulary.
  - >-
    RECEIPT AND ID DEFECTS, RECORDED WITHOUT ACTING ON THEM. (i) The
    TASK-20260728-011 receipt omits the INT-BATCH009-Q scope-extension declaration
    its own completion gate required. (ii) The archive-receipt ordering defect
    INT-BATCH009-C is unrepaired repository-wide. (iii) A THIRD ID COLLISION: a
    DIFFERENT experiments/EXP-ENDO-001/specification.yaml, blob da04e2c4 and 356
    lines, exists under the same immutable experiment id at commit 9edb8cd9 on the
    non-ancestor co-driver branch codex/main-ecdlp-main-latest-work, which also
    carries an empty runs/.gitkeep - a zero-byte placeholder that is not a run and
    does not disturb the zero-runs finding. Two divergent contracts sharing one
    immutable id is an immutability hazard for a session that can run git; this
    session has no shell and neither verifies nor repairs it, and records the
    collision count as reported to it.
  - >-
    THE BRANCH IS 312 COMMITS BEHIND origin/main AND 24 AHEAD, so every "AGENTS.md
    at this commit has no rule 13 and no closure-quorum clause" disclaimer in this
    lineage is TRUE OF A STALE CONTRACT: origin/main carries the goal-closure
    quorum, rule 13, and docs/target-result-profile.md, which is ABSENT here and is
    applied as governing regardless. Nothing in this batch turns on the difference,
    because nothing closes; but CLAUDE.md requires keeping a branch current by
    MERGING main into it, and BATCH-010 must do so BEFORE freezing anything.
  - >-
    THE LEDGER DOES NOT VALIDATE. 986 error lines with eleven specifications
    unparseable. This decision does not repair that and does not claim it is
    repaired. The deciding session ran no validator and no git command; every
    commit_sha, parent_sha and path_sha256 it wrote is null by construction and no
    hash was fabricated.
  - >-
    NO CLOSURE AND NO CLOSURE QUORUM IS CLAIMED OR CLAIMABLE. Nothing here closes a
    goal or a research direction.
  - >-
    ORDERING DEVIATION, DISCLOSED. docs/claims-and-verification.md requires the
    refutation artifact to be archived BEFORE the decision that relies on it.
    REF-20260728-002 is committed in the SAME ledger archive as this decision. The
    mitigation, which is not a cure, is that it introduces no claim not already
    committed beforehand - REF-20260728-001 at 457d2209 and the two independent
    reports carrying NAR-1 to NAR-4 and the certificate. Carried as
    INT-BATCH009-U.

  next_actions:
  - >-
    Run TASK-20260728-009, the BATCH-009 ledger archive, ALONE, staging exactly the
    declared paths - the TASK-20260728-012 and TASK-20260728-013 review artifacts if
    they are not already committed, refutation_claims_v2.yaml, ledger/evidence/
    EV-ENDO-001.yaml, ledger/decisions/DEC-20260728-005.yaml, knowledge/findings/
    KN-FIND-009.md, knowledge/INDEX.md, the TASK-20260728-009 goal_checkpoint.yaml
    and this archive's receipt - staging NOTHING under experiments/EXP-ENDO-001,
    NOTHING under ledger/hypotheses/, NOTHING under harness/ or tools/, and no
    AppleDouble sidecar; naming TASK-20260728-009 and the record IDs EV-ENDO-001,
    DEC-20260728-005, REF-20260728-002, KN-FIND-009, EXP-ENDO-001, H-ENDO-001,
    GOAL-ECDLP-001 and BATCH-009 in the commit message; regenerating
    knowledge/INDEX.md with tools/build_knowledge_index.py before the commit and
    treating that output as authoritative over the hand-rendered file; and letting
