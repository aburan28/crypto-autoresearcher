  limitations:
    - >-
      Zero runs, zero curve compute, zero experiments. No empirical claim at any
      tier or scale. The batch names no prime, no curve, no field size and no
      parameter set, so nothing here may be quoted as validation at any scale and
      nothing establishes concrete bit security for any deployed system.
    - >-
      Every conditional exponent depends on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which this program has
      neither validated nor challenged, and sits above an o(1) the source's own
      authors disclose as superpolynomial. S1 is conditional on a restated
      smoothness heuristic, S3 on H1-prime, and the preserved memory-independence
      conclusion on an L2 bound that no numbered heuristic states.
    - >-
      S2 and S3 are scoped screens inside named mechanism classes, not
      impossibility claims, and neither may be quoted as a general lower bound.
      Candidates were admitted on the TIME exponent only; no candidate has been
      shown admissible on full cost.
    - >-
      Four lanes were not screened and carry no verdict of any sign:
      higher-dimensional Kani and superspecial-abelian-surface mechanisms,
      quaternion-side and Deuring-correspondence mechanisms, index-calculus
      relation collection for the CSIDH class-group action, and quantum
      mechanisms of any kind.
    - >-
      One independent review, not two; no validator ran; the reviewer did not
      read the BATCH-002 source artifacts; producer, discharge and reviewer share
      one self-reported model identity and none is probe-verified. RC4, RC5, RC7
      and RC8 are open, and RC11 through RC15 are newly opened.
    - >-
      This decision changes no hypothesis status, creates no hypothesis record,
      approves no experiment, authorizes no run, closes no research direction,
      opens no batch, extends no budget and edits no immutable record. It does
      not assert that the ledger validates, and it does not assert that any
      closure quorum exists or is available.
  next_actions:
    - >-
      EXACTLY ONE, AND IT IS A DECISION RATHER THAN A DISPATCH. Obtain a separate
      Coordinator budget decision on its own record that either extends
      GOAL-SSI-001 campaign_budget.total_wall_clock_seconds with its explicit
      authorization and its own scoping, or records the campaign as
      closed_at_budget - and dispatch NO BATCH-004 card, open no batch, and take
      no other GOAL-SSI-001 action until that decision is committed and verified.
      The declared headroom is zero: on declared figures the three batches
      account for the whole of the 10800-second campaign budget, three of a
      maximum six batches are used, and no committed artifact records actual
      consumption. That decision, and not this one, is where the following
      pre-registered scope is priced if it authorizes further work, listed here
      so the shortfall is concrete rather than abstract: (a) RC11, completing the
      Eichler/Hurwitz count for the F_{p^2} case of the smallest isogeny from E
      to its Frobenius conjugate, BEFORE re-attempting the reference [4]
      retrieval that has now failed twice, because it can settle C1's premise
      more cheaply and, if it lands at 1/3, converts S1 from a lever into a
      BARRIER capping the whole architecture at p^{1/3+o(1)}; (b) RC8 and RC12,
      restating H1-prime in L2 or Renyi-2 form and correcting RC8's blocks field,
      one paragraph at zero compute, since memory independence currently rests on
      a statement absent from the numbered heuristic inventory; (c) RC13, RC14
      and RC15, the labelling and scope repairs, each of which must be a
      SUPERSEDING record because every artifact they touch is immutable; (d) a
      revised candidate ordering that does not rest on the two defects O8 and O9
      identified. Model independence remains unavailable and any attempt to buy
      it by degrading review effort requires its own Coordinator inference
      amendment, which is NOT granted here.
  knowledge_promotion:
    promoted:
      - KN-TECH-056
    promoted_basis: >-
      KN-TECH-056 is promoted into knowledge/techniques/ by this archive on the
      ADMIT verdict of gate R2 of the independent review RT-20260728-013, which
      re-extracted ALL THIRTEEN cited line locators from the archived primary
