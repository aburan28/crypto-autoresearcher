coordinator_decision:
  id: DEC-20260728-005
  context: >-
    BATCH-009 of GOAL-ECDLP-001 froze one bounded toy-scale contract, EXP-ENDO-001,
    testing H-ENDO-001. The independent non-originating contract review
    TASK-20260728-004 returned REVISE before execution; the Coordinator held the
    INT-BATCH009-E gate, the Executor card was never dispatched, and ZERO RUNS
    EXIST. The batch's output is therefore paper algebra about a withdrawn
    instrument, recorded as REF-20260728-001 and committed at 457d2209. Both
    independent verifications of that record have now reported and BOTH BLOCKED THE
    LEDGER RECORD WRITTEN AGAINST IT: VAL-20260728-001 (TASK-20260728-012, verdict
    PARTIAL, blocks_ledger_record true, four required narrowings) and
    RT-20260728-002 (TASK-20260728-013, withdrawal ruling survives but four of its
    published grounds are defective and one claim is false as written). This
    decision is written against the superseding record REF-20260728-002, never
    against REF-20260728-001, and it retracts eight claims of this Coordinator's
    own.
  decision: reject_scoped
  decision_vocabulary_note: >-
    `reject_scoped` in the templates/research-records.md coordinator-decision
    vocabulary; `reject` in the agents/coordinator.md required-output vocabulary.
    THE TARGET IS ONE PREDICTION ON ONE FROZEN EIGENVALUE SOURCE. It is not a
    hypothesis-level rejection, not a family-level or rank-level rejection, and not
    a closure of anything.
  target_ids:
  - EXP-ENDO-001
  - H-ENDO-001
  - EV-ENDO-001
  - REF-20260728-002
  - BATCH-009
  - GOAL-ECDLP-001

  the_scoped_rejection:
    what_is_rejected: >-
      EXP-ENDO-001 prediction P2 and H-ENDO-001 prediction 2, on the eigenvalue
      multiset {1, lambda_2, lambda_3} frozen in
      experiments/EXP-ENDO-001/specification.yaml at
      inputs.curve_families[J0].eigenvalue_source - lambda_2 and lambda_3 being the
      two roots of L^2 + L + 1 = 0 mod N - at ranks r at least 3, for prime N at
      least 3. On exactly those cells the infinity-norm first minimum of the
      witness lattice W_r is EXACTLY 1 for every k, against a predicted about
      N^(1/(2r)), because Vieta forces 1 + lambda_2 + lambda_3 = 0 mod N
      identically.
    what_is_NOT_rejected:
    - 'NOT family J0 as such. Other curve-backed eigenvalue choices on the same j = 0 curves do not degenerate.'
    - 'NOT rank as such. Genuine, curve-backed, eigenvalue-checkable r = 3 and r = 4 cells exist.'
    - 'NOT prediction P1, the index and determinant pinning at N, which stands and is correctly derived.'
    - 'NOT prediction P3, cost neutrality, which no artifact in this batch measures or settles.'
    - 'NOT the hypothesis H-ENDO-001, whose status does not move on this decision.'
    - 'NOT the endomorphism lane, which is closed by nothing here.'
    experiment_disposition: >-
      EXP-ENDO-001 version 1 is WITHDRAWN BEFORE EXECUTION, recorded in the
      versioned amendment experiments/EXP-ENDO-001/amendments/
      v1_withdrawn_before_execution.yaml. The withdrawal survives on grounds G6
      (Pareto domination in both time and memory at every rank, reviewer-originated
      and decisive alone) and G3 (the `confirmed` branch unreachable from the
      contract's own ceiling arithmetic, plus S5 calibrating against the wrong
      |Aut|), and NOT on the grounds it was published leading with. See
      retractions_of_this_coordinators_own_reasoning below.

  hypothesis_status_statement: >-
    NO HYPOTHESIS STATUS CHANGES ON THIS DECISION, AND THAT IS AN EXPLICIT CHOICE
    RATHER THAN AN OMISSION. H-ENDO-001 remains `approved`, which carries no
    evidential standing whatever; H-STR-002 remains `weakened` per DEC-20260727-009;
    H-IC-001 remains `weakened` per DEC-20260727-008. JUSTIFICATION: what is refuted
    is prediction 2 on ONE frozen eigenvalue source, by an identity that says
    nothing about the hypothesis's mechanism claim; the instrument that would have
    tested the mechanism was withdrawn before it ran; and RT-20260728-002 states
    that an adverse transition of H-ENDO-001 should be scoped to the prediction and
    not to the hypothesis. ledger/hypotheses/ is deliberately outside the write
    scope of the archiving task. A future transition of H-ENDO-001 requires its own
    decision with its own rationale and may not be inferred from this record.

  int_batch009_r_reading:
    the_pre_registered_rule: >-
      INT-BATCH009-R, pre-registered in the BATCH-009 dispatch queue before either
      verification ran, states - "If either returns REFUTED or PARTIAL on checklist
      items 1 through 7, the disposition is `inconclusive` plus a scoped successor,
      never a claim repaired in prose."
    what_happened: >-
      VAL-20260728-001 returned PARTIAL on checklist item 1 (D1) and item 6 (D3).
      Items 2, 3, 4, 5 and 7 returned CONFIRMED, and item 4 delivered a level-1
      counterexample certificate. RT-20260728-002 independently returned PARTIAL on
      D1 (its objection S8) and FALSE on D3's conclusion clause, and recorded that
      it flags rather than resolves the resulting tension, recommending the narrow
      reading and REQUIRING the Coordinator to adopt or reject it in the record.
    reading_taken: NARROW
    reading_taken_statement: >-
      I TAKE THE NARROW READING, EXPLICITLY AND ON THE RECORD. Under it a PARTIAL
      sinks the claim that the failing item supports - here D1, and with it
      withdrawal ground G7 - while a disposition may rest on the items that
      CONFIRMED. The P2 refutation rests on items 2 and 3, both CONFIRMED, plus the
      item-4 certificate, and does not depend on D1 at any step.
    why: >-
      Three reasons, and one cost. (i) The rule's purpose is to stop a decision
      resting on unchecked self-authored claims repaired in prose; that purpose is
      served here by RETRACTING D1, D3's conclusion and six further published
      claims outright, and by writing the disposition against a superseding record
      that adopts the Validator's narrowings verbatim. Nothing is repaired in
      prose. (ii) Recording `inconclusive` over an algebraic identity that an
      independent session re-derived and certified with a computed counterexample
      would MISSTATE the evidence: `inconclusive` asserts that the evidence cannot
      discriminate, and on those cells it plainly does. (iii) The literal reading
      would make the batch's most strongly checked finding unrecordable because a
      DIFFERENT, now-retracted claim failed, which inverts the rule's direction.
      THE COST, STATED PLAINLY: I am choosing between two readings of my own
      pre-registered rule AFTER seeing which way each points, and an auditor may
      reasonably prefer the literal reading. That is why this choice is recorded as
      a versioned protocol amendment below rather than exercised silently, and why
      the substantive difference is stated: under the literal reading the
      disposition label would be `inconclusive` and the NARROWEST SUPPORTED
      STATEMENT would be identical, because it is the same clause either way.
    protocol_amendment:
      id: PROTOCOL-AMEND-20260728-001
      amends: 'INT-BATCH009-R, BATCH-009 dispatch queue integrity notes'
      amended_on: '2026-07-28'
      amended_after_observing_outcomes: true
      prior_text: >-
        If either returns REFUTED or PARTIAL on checklist items 1 through 7, the
        disposition is `inconclusive` plus a scoped successor, never a claim
        repaired in prose.
      amended_reading: >-
        A REFUTED or PARTIAL verdict on a checklist item sinks the CLAIM that item
        supports and every published ground resting on it, which must be retracted
        by name in the decision record rather than dropped, repaired in prose or
        left standing. It does not, by itself, force `inconclusive` for claims
        supported only by items that CONFIRMED. If any item that a proposed
        disposition's own clause depends on returns REFUTED or PARTIAL, the
        disposition on that clause is `inconclusive`.
      what_this_does_not_relax: >-
        It relaxes nothing about prose repair, which remains forbidden, and nothing
        about evidence strength, scope, tier or the requirement for a superseding
        record. It does not apply retroactively to any other batch, and it is
        recorded here rather than written into the committed BATCH-009 queue, which
        is not edited.
      recorded_because: >-
        agents/coordinator.md forbids changing success criteria after observing
        outcomes without a versioned protocol amendment. This is that amendment,
        with its post-hoc character disclosed in the record rather than concealed.

  retractions_of_this_coordinators_own_reasoning:
    statement: >-
      Eight claims published by this Coordinator are WITHDRAWN, itemised in
      REF-20260728-002 as R1 through R8 and summarised here so that no reader has
      to reconstruct them. They are stated as retractions, not quietly restated.
    items:
    - id: R1
      what: >-
        THE TWO-POINT ARGUMENT IS RETRACTED. Withdrawal ground G7 and rationale
        bullet 3 - that setting genuine_r_bound to 2 for J0 leaves the genuine
        r-sweep with exactly two points, r = 1 and r = 2 - was published under the
        label "the Coordinator's own arithmetic, not the review's", which is the
        strongest evidential label used anywhere in the batch, and it rests on a
        FALSE PREMISE. The governing invariant is not the Z-rank of End(E) but the
        existence of a SHORT relation sum c_i lambda_i = 0 mod N of infinity norm
        at most X = ceil(N^(1/(2r))). Rank deficiency guarantees some relation,
        never a short one. On the same j = 0 curve, phi_3 = a + b phi is a genuine
        endomorphism, evaluable as [a]P + [b]phi(P), passing CTRL-EIGEN, with
        relation vector (a, b, -1); R_3 has determinant N in dimension 3 so its
        generic first minimum is about N^(1/3), the square of X = N^(1/6). GENUINE
        r = 3 AND r = 4 CELLS EXIST AND THE TWO-POINT CAP IS FALSE. The conclusion
        survives on a repaired premise supplied by the red team - any such cell is
        a Z-linear reparametrization of the r <= 2 lattice and adds no endomorphism
        content - and that repaired sentence replaces the retracted one. The
        correct genuine/synthetic criterion is relation-freeness at threshold X,
        which is RT-20260728-001's RC-3 with the missing threshold supplied,
        carried forward as RC-6.
    - id: R2
      what: >-
        D3's conclusion clause - that every vector of W_r an attacker can write
        down without knowing k carries zero information about k - is retracted as
        FALSE, together with the framing that the constructible part is useless.
        R_2 is the GLV decomposition lattice, the basis of the only endomorphism
        speedup this campaign acknowledges; the sublattice D3 called useless is the
        useful one in the published record. The surviving clause carries the
        primality hypothesis inside it.
    - id: R3
      what: >-
        Ground G5's promotion of D4 to "the mechanism the contract offers is not
        the operative one" is retracted as a category error: the specified
        algorithm is a box enumeration that never constructs W_r, so
        non-constructibility can neither explain nor fail to explain a measured
        cost curve.
    - id: R4
      what: >-
        The claim that option (b) lost partly because the 7200-second Executor
        budget was allocated to the withdrawn contract is retracted as BACKWARDS.
        Withdrawal RELEASED that budget. The honest constraints are the consumed
        design and review cards and the consumed maximum_batches value.
    - id: R5
      what: >-
        The roadmap-gating claim is retracted. D3 and D4 do not bear on
        IDEA-20260727-005's classification barrier in the sense the rerank claimed;
        its contested part is C2, the completeness of the exit-map classification,
        and nothing in this batch touches it. THE BATCH-OPENING RERANK WAS WRONG ON
        ITS GATING CLAIM, and it outranked a COMMITTED action on that claim. The
        Pareto-domination ground now used to withdraw the experiment was already
        committed in IDEA-20260727-005's own target_complexity.tradeoff_note before
        the contract was frozen; the batch spent design, freeze, snapshot and
        review cards rediscovering a fact in its own source record.
        DEFER-BATCH009-003 as drafted would not have caught that, which is why RC-7
        is added.
    - id: R6
      what: >-
        D1's normative sentence "the frozen value genuine_r_bound 3 is wrong" and
        its recorded DISAGREEMENT with RT-20260728-001 objection B1 are retracted.
        MY DISAGREEMENT WITH THE REVIEWER IS NOT SUSTAINED and the defect is worse
        than I recorded: the contract counts distinct scalars on one CM family and
        Z-rank on the other without saying so; under its own distinct-scalar rule
        J0's 3 is internally correct and J1728's 2 should be 4, with four distinct
        efficiently computable scalars verified on a real curve.
    - id: R7
      what: >-
        The description of the affected cells as "cells the contract labels
        GENUINE" is retracted for r = 4, which the contract labels SYNTHETIC. Half
        the affected cells are synthetic.
    - id: R8
      what: >-
        D2's consequence 1, that the 40 affected cells enter the S2 regression, is
        retracted as CONVENTION-DEPENDENT and false under the hypothesis record's
        own first_minimum_method rule. The geometric degeneracy is unaffected.

  the_review_versus_execution_signal_corrected:
    prior_reading: >-
      INT-BATCH009-S recorded the Coordinator's read of three-of-four batches
      measuring nothing as "MOSTLY SELECTION BIAS, with one real component". The
      count is verified true. The DIAGNOSIS is corrected here.
    corrections_adopted:
    - >-
      THE DENOMINATOR WAS CONTAMINATED. BATCH-008 declared itself a bounded
      ledger-integrity repair containing "no research work of any kind" and had no
      experiment to execute. The honest research denominator is three - BATCH-006,
      BATCH-007, BATCH-009 - of which one executed.
    - >-
      THE MECHANISM DIFFERS PER CASE AND THE STORY FITS ONE OF THREE, NOT "MOSTLY".
      BATCH-009 fits: Vieta and a ceiling formula are determined quantities.
      BATCH-006 does NOT fit: EXP-IC-002 died of amend-cycle attrition, and the
      defect attributed to it - a stopping rule halting the primary arm at instance
      1 of 34 - is a defect only a RUN could have exhibited. BATCH-008 is not
      applicable.
    - >-
      THE DISCRIMINATING COUNTER-EVIDENCE WAS ALREADY IN THE CAMPAIGN'S RECORD AND
      THE PRIOR READING DID NOT MENTION IT. The one batch in four that executed
      produced a run that FALSIFIED a paper-level adjudication: in BATCH-007 the
      red-team observation OBS-1 was adjudicated YES on unarchived scratchpad
      probes, and the executed EXP-STR-003 package returned F1 FIRES at two of four
      instances, forcing OBS-1's withdrawal. The base rate of executed batches
      overturning a paper-level adjudication is 1 of 1. That is n = 1 and is not
      over-read here, but it is direct evidence against "paper beats a run by
      construction" as a posture, argued from a two-case sample while the record
      held the counterexample.
    what_stands: >-
      The dangerous-misreading paragraph stands and is endorsed by the red team
      without reservation: a program that only critiques cannot produce a result at
      any tier, and no amount of correct paper algebra about withdrawn contracts is
      a candidate attack improvement or a validated novel technique. The identified
      design defect - a threshold pre-registered without being evaluated at the
      cells that would run - is real, and its fix (DEFER-BATCH009-003) is cheap,
      correct and INSUFFICIENT, which is why RC-7 and RC-8 are added.
    empirical_discriminator_adopted: >-
      Every future frozen contract pre-classifies each decisive pre-registered
      quantity as DETERMINED or SAMPLED (RC-8). Selection bias predicts that
      DETERMINED-quantity contracts get pre-empted at review while
      SAMPLED-quantity contracts execute; a stopped harness predicts non-execution
      regardless. EXP-STR-004's arms A-prime and E-prime produce alpha counts
      across DRAWN instances, so BATCH-010 decides this question for free, and it
      is opened with that as a declared second purpose.

  rationale:
  - >-
    THE NARROW CLAUSE IS THE STRONGEST CHECKABLE REFUTATION ARTIFACT THIS RESULT
    ADMITS, AND IT WAS ARCHIVED BEFORE THIS DECISION. Vieta on a monic quadratic
    over the field Z/N is instance-free and two lines long; an independent
    non-originating session re-derived it, showed the existence hypothesis is
    FORCED rather than assumed, and produced a level-1 counterexample certificate
    on a real curve with an embedded re-checker that passed 42 checks with 0
    failures. Under agents/coordinator.md the adverse transition may be taken only
    on the strongest available artifact; this is level 1, the top of that ladder,
    and `reject_scoped` on a single unreplicated empirical-only run - the forbidden
    case - does not arise, because there is no run at all.
  - >-
    `weaken` IS UNAVAILABLE AND SO IS `inconclusive` UNDER THE READING TAKEN.
    `weaken` denotes a shift in evidential weight and would both UNDERSTATE an
    algebraic identity and imply an evidential basis that does not exist, being
    wrong on both sides at once. `inconclusive` is available only under the literal
    reading of INT-BATCH009-R, which is addressed and rejected explicitly above
    with its cost recorded.
  - >-
    THE SCOPE IS THE EIGENVALUE SOURCE, NOT THE FAMILY OR THE RANK, BECAUSE THE
    WIDER PHRASING IS FALSE. This campaign has already written one verdict wider
    than its artifacts - DEC-20260726-006, which DEC-20260727-009 had to weaken - and
    a negative written wider than its algebra is the same error with the sign
    flipped, harder to catch because negatives feel safe.
  - >-
    THE WITHDRAWAL SURVIVES ON G6 AND G3, BOTH REVIEWER-ORIGINATED AND EACH
    SUFFICIENT ALONE, AND NOT ON THE GROUNDS IT LED WITH. The withdrawn algorithm
    costs about 2^(r+1) sqrt(N) with 2^r sqrt(N) memory against BSGS at about
    1.5 to 2 sqrt(N) with sqrt(N) memory and rho at about 0.886 sqrt(N/|Aut|) with
    O(w) memory and linear parallel speedup; shrinking the stored list to w forces
    the join onto the Shanks line N/w, strictly worse than rho's sqrt(N)/m for
    every w below sqrt(N). There is no time-memory point where it wins, so no
    protocol amendment can change what the algorithm is. Separately, G3's
    unreachable `confirmed` branch is derivable from the contract's own arithmetic.
    A DECISION WHOSE PUBLISHED REASONS ARE WRONG IS NOT REPRODUCIBLE EVEN WHEN ITS
    OUTCOME IS RIGHT, which is why R1 to R8 are retracted by name here rather than
    dropped.
  - >-
    THE KNOWLEDGE GATE FIRES AND IS DISCHARGED. A `reject_scoped` on `strong`
    evidence requires a KN-FIND in the same ledger commit. KN-FIND-009 records the
    durable, transferable content - that the degeneracy of an endomorphism-augmented
    witness lattice is governed by SHORT RELATIONS among the eigenvalues rather than
    by the rank of End(E), that the frozen CM triple is exactly the accident, and
    that constructing W_r(k) is polynomial-time equivalent to solving the instance
    by a deterministic LLL-free reduction - together with the boundary that R_r, the
    GLV lattice, is constructible and useful. That is a design lesson a future
    contract in this lane needs and cannot get from the ledger alone.

  evidence_refs:
