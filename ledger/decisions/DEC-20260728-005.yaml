  int_batch009_r_reading:
    the_pre_registered_rule: >-
      INT-BATCH009-R, pre-registered in the BATCH-009 dispatch queue before either
      verification ran, states - "If either returns REFUTED or PARTIAL on checklist
      items 1 through 7, the disposition is `inconclusive` plus a scoped successor,
      never a claim repaired in prose."
    what_happened: >-
      VAL-20260728-001 returned PARTIAL on checklist item 1 (D1) and item 6 (D3).
      Items 2, 3, 4, 5 and 7 returned CONFIRMED, and item 4 delivered a level-1
      counterexample certificate. RT-20260728-002 independently returned PARTIAL on
      D1 (its objection S8) and FALSE on D3's conclusion clause, and recorded that
      it flags rather than resolves the resulting tension, recommending the narrow
      reading and REQUIRING the Coordinator to adopt or reject it in the record.
    reading_taken: NARROW
    reading_taken_statement: >-
      I TAKE THE NARROW READING, EXPLICITLY AND ON THE RECORD. Under it a PARTIAL
      sinks the claim that the failing item supports - here D1, and with it
      withdrawal ground G7 - while a disposition may rest on the items that
      CONFIRMED. The P2 refutation rests on items 2 and 3, both CONFIRMED, plus the
      item-4 certificate, and does not depend on D1 at any step.
    why: >-
      Three reasons, and one cost. (i) The rule's purpose is to stop a decision
      resting on unchecked self-authored claims repaired in prose; that purpose is
      served here by RETRACTING D1, D3's conclusion and six further published
      claims outright, and by writing the disposition against a superseding record
      that adopts the Validator's narrowings verbatim. Nothing is repaired in
      prose. (ii) Recording `inconclusive` over an algebraic identity that an
      independent session re-derived and certified with a computed counterexample
      would MISSTATE the evidence: `inconclusive` asserts that the evidence cannot
      discriminate, and on those cells it plainly does. (iii) The literal reading
      would make the batch's most strongly checked finding unrecordable because a
      DIFFERENT, now-retracted claim failed, which inverts the rule's direction.
      THE COST, STATED PLAINLY: I am choosing between two readings of my own
      pre-registered rule AFTER seeing which way each points, and an auditor may
      reasonably prefer the literal reading. That is why this choice is recorded as
      a versioned protocol amendment below rather than exercised silently, and why
      the substantive difference is stated: under the literal reading the
      disposition label would be `inconclusive` and the NARROWEST SUPPORTED
      STATEMENT would be identical, because it is the same clause either way.
    protocol_amendment:
      id: PROTOCOL-AMEND-20260728-001
      amends: 'INT-BATCH009-R, BATCH-009 dispatch queue integrity notes'
      amended_on: '2026-07-28'
      amended_after_observing_outcomes: true
      prior_text: >-
        If either returns REFUTED or PARTIAL on checklist items 1 through 7, the
        disposition is `inconclusive` plus a scoped successor, never a claim
        repaired in prose.
      amended_reading: >-
        A REFUTED or PARTIAL verdict on a checklist item sinks the CLAIM that item
        supports and every published ground resting on it, which must be retracted
        by name in the decision record rather than dropped, repaired in prose or
        left standing. It does not, by itself, force `inconclusive` for claims
        supported only by items that CONFIRMED. If any item that a proposed
        disposition's own clause depends on returns REFUTED or PARTIAL, the
        disposition on that clause is `inconclusive`.
      what_this_does_not_relax: >-
        It relaxes nothing about prose repair, which remains forbidden, and nothing
        about evidence strength, scope, tier or the requirement for a superseding
        record. It does not apply retroactively to any other batch, and it is
        recorded here rather than written into the committed BATCH-009 queue, which
        is not edited.
      recorded_because: >-
        agents/coordinator.md forbids changing success criteria after observing
        outcomes without a versioned protocol amendment. This is that amendment,
        with its post-hoc character disclosed in the record rather than concealed.

  retractions_of_this_coordinators_own_reasoning:
    statement: >-
      Eight claims published by this Coordinator are WITHDRAWN, itemised in
      REF-20260728-002 as R1 through R8 and summarised here so that no reader has
      to reconstruct them. They are stated as retractions, not quietly restated.
    items:
    - id: R1
      what: >-
        THE TWO-POINT ARGUMENT IS RETRACTED. Withdrawal ground G7 and rationale
        bullet 3 - that setting genuine_r_bound to 2 for J0 leaves the genuine
        r-sweep with exactly two points, r = 1 and r = 2 - was published under the
        label "the Coordinator's own arithmetic, not the review's", which is the
        strongest evidential label used anywhere in the batch, and it rests on a
        FALSE PREMISE. The governing invariant is not the Z-rank of End(E) but the
        existence of a SHORT relation sum c_i lambda_i = 0 mod N of infinity norm
        at most X = ceil(N^(1/(2r))). Rank deficiency guarantees some relation,
        never a short one. On the same j = 0 curve, phi_3 = a + b phi is a genuine
        endomorphism, evaluable as [a]P + [b]phi(P), passing CTRL-EIGEN, with
        relation vector (a, b, -1); R_3 has determinant N in dimension 3 so its
        generic first minimum is about N^(1/3), the square of X = N^(1/6). GENUINE
        r = 3 AND r = 4 CELLS EXIST AND THE TWO-POINT CAP IS FALSE. The conclusion
        survives on a repaired premise supplied by the red team - any such cell is
        a Z-linear reparametrization of the r <= 2 lattice and adds no endomorphism
        content - and that repaired sentence replaces the retracted one. The
        correct genuine/synthetic criterion is relation-freeness at threshold X,
        which is RT-20260728-001's RC-3 with the missing threshold supplied,
        carried forward as RC-6.
    - id: R2
      what: >-
        D3's conclusion clause - that every vector of W_r an attacker can write
        down without knowing k carries zero information about k - is retracted as
        FALSE, together with the framing that the constructible part is useless.
        R_2 is the GLV decomposition lattice, the basis of the only endomorphism
        speedup this campaign acknowledges; the sublattice D3 called useless is the
        useful one in the published record. The surviving clause carries the
        primality hypothesis inside it.
    - id: R3
      what: >-
        Ground G5's promotion of D4 to "the mechanism the contract offers is not
        the operative one" is retracted as a category error: the specified
        algorithm is a box enumeration that never constructs W_r, so
        non-constructibility can neither explain nor fail to explain a measured
        cost curve.
    - id: R4
      what: >-
        The claim that option (b) lost partly because the 7200-second Executor
        budget was allocated to the withdrawn contract is retracted as BACKWARDS.
        Withdrawal RELEASED that budget. The honest constraints are the consumed
        design and review cards and the consumed maximum_batches value.
    - id: R5
      what: >-
        The roadmap-gating claim is retracted. D3 and D4 do not bear on
        IDEA-20260727-005's classification barrier in the sense the rerank claimed;
        its contested part is C2, the completeness of the exit-map classification,
        and nothing in this batch touches it. THE BATCH-OPENING RERANK WAS WRONG ON
        ITS GATING CLAIM, and it outranked a COMMITTED action on that claim. The
        Pareto-domination ground now used to withdraw the experiment was already
        committed in IDEA-20260727-005's own target_complexity.tradeoff_note before
        the contract was frozen; the batch spent design, freeze, snapshot and
        review cards rediscovering a fact in its own source record.
        DEFER-BATCH009-003 as drafted would not have caught that, which is why RC-7
        is added.
    - id: R6
      what: >-
        D1's normative sentence "the frozen value genuine_r_bound 3 is wrong" and
        its recorded DISAGREEMENT with RT-20260728-001 objection B1 are retracted.
        MY DISAGREEMENT WITH THE REVIEWER IS NOT SUSTAINED and the defect is worse
        than I recorded: the contract counts distinct scalars on one CM family and
        Z-rank on the other without saying so; under its own distinct-scalar rule
        J0's 3 is internally correct and J1728's 2 should be 4, with four distinct
        efficiently computable scalars verified on a real curve.
    - id: R7
      what: >-
        The description of the affected cells as "cells the contract labels
        GENUINE" is retracted for r = 4, which the contract labels SYNTHETIC. Half
        the affected cells are synthetic.
    - id: R8
      what: >-
        D2's consequence 1, that the 40 affected cells enter the S2 regression, is
        retracted as CONVENTION-DEPENDENT and false under the hypothesis record's
        own first_minimum_method rule. The geometric degeneracy is unaffected.

  the_review_versus_execution_signal_corrected:
    prior_reading: >-
      INT-BATCH009-S recorded the Coordinator's read of three-of-four batches
      measuring nothing as "MOSTLY SELECTION BIAS, with one real component". The
      count is verified true. The DIAGNOSIS is corrected here.
    corrections_adopted:
    - >-
      THE DENOMINATOR WAS CONTAMINATED. BATCH-008 declared itself a bounded
      ledger-integrity repair containing "no research work of any kind" and had no
      experiment to execute. The honest research denominator is three - BATCH-006,
