coordinator_decision:
  id: DEC-20260804-1a2a1d
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-6f309b
  batch_number: 2
  recorded_by_task: TASK-20260804-2dc49f
  authorized_by: DEC-20260803-d810d0
  recorded_at: '2026-08-04'

  decision: expand
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.
  decision_label: >-
    Batch 2 variance measurement admitted; expand to batch 3 with adequate
    statistical power. The measured ratio 1.2247 is a real observation but is
    not statistically significant at n=50 (p=0.135, 95% CI [0.855, 1.902]).
    Three blocking constraints must be addressed in batch 3.

  context: >-
    GOAL-MLKEM-004 BATCH-6f309b (batch 2 of 6). INFRA_FAIL repair: 50
    bgj1_sieve runs executed on Docker linux/amd64 (Linux-6.12.76-linuxkit
    via QEMU on macOS ARM64). T_N measured per run. Snapshot 3c7032c7.
    Validator TASK-20260804-f18269: accept_with_qualifications (5/5 checks
    pass; QUAL-1 minor task-ID typo in variance_results.json). Red team
    TASK-20260804-d7bdb1: pass_with_constraints (OBJ-5 blocking, OBJ-1/3
    concerns, OBJ-6 note).

  evidence_refs:
    - EV-MLKEM-cca527

  review_summary:
    validator: >-
      All hashes match snapshot receipt exactly. Arithmetic re-derivation
      of variance_ratio = 1.2247 confirmed to floating-point tolerance.
      Scope check passed (states_a_finding=false, no MATZOV/Nf reference).
      Platform Linux x86_64 confirmed. single_score_var=0.332505 cross-
      checked from batch-1 raw_scores.json. One minor qualification (wrong
      task_id in variance_results.json) does not affect any number.
    red_team: >-
      OBJ-2/4 resolved: all 50 runs N=17919 exactly. OBJ-6 note: seed
      lag-1 autocorrelation 0.004 (nil); marginal Spearman -0.247 (p=0.084)
      — motivates randomised seeds in batch 3. OBJ-1/3 concerns: systematic
      mean-score shortfall of ~103.9 T_N units between environments
      (batch-1 Linux-6.18.5-glibc2.39 vs batch-2 linuxkit-QEMU-glibc2.41);
      Var[s_i] denominator from batch-1 is cross-environment. OBJ-5
      BLOCKING: chi2(49)=60.009 < 66.339 critical value; p=0.135; 95% CI
      for ratio [0.855, 1.902] includes independence prediction; 80% power
      requires n≈190-200.

  rationale: >-
    The variance measurement is arithmetically correct and admissible as a
    raw observation. The EXPAND decision is driven by OBJ-5: n=50 has 41%
    power to detect ratio=1.22; p=0.135 does not reject H0; and the 95%
    confidence interval includes values both well below and well above the
    independence prediction. The measurement does not yet answer the
    research question. Batch 3 must use n>=150 with proper power, measure
    Var[s_i] within the same environment, and use randomised seeds.

  what_survives:
    - >-
      variance_ratio = 1.2247 is a real measurement in the Docker linux/amd64
      environment. It is an observation that the ratio exceeds 1.0; it is not
      a statistically significant rejection of independence.
    - >-
      The environment difference between batch-1 (native Linux) and batch-2
      (QEMU-emulated) is documented and must be characterised.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No statistically significant result. The ratio 1.2247 fails to reject
      H0 at n=50. Environment confound is undocumented. Rule 12 UNMET and
      UNWAIVED. Nothing is promotable.

  next_actions:
    - >-
      Open BATCH-68471b (batch 3 of 6). Objective: adequate-power independence
      test. BLOCKING requirements from OBJ-5/OBJ-3: (1) n>=150 independent
      bgj1_sieve runs in the SAME Docker environment as batch-2 (same image,
      same glibc), using RANDOMLY CHOSEN g6k Siever seeds (NOT sequential
      0..N-1); (2) compute Var[s_i] WITHIN this environment by running the
      scoring pipeline on ONE of the batch-3 sieve runs (same Docker instance,
      same vectors) — do NOT import Var[s_i] from batch-1; (3) report chi-
      squared test, p-value, and 95% CI for the ratio alongside the point
      estimate; (4) characterise the ~103.9 mean-score shortfall: confirm
      whether it is systematic across the 150 runs or specific to the prior
      runs. Budget: maximum_runs: 165 (150 variance + 15 spare).

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
