status: approved
made_by: coordinator

context: >-
  BATCH-c58e07 reviewer found a critical discrepancy: the specification defines
  yield as relations_found / |F|^m, but the implementation uses relations_found /
  candidates_verified for MITM arms. This changes Δ from ≈0.49 to ≈0.01.

  Additionally, Δ ≈ 0.5 is a structural artifact of the MITM collision probability
  (50% chance of relation per x-coordinate match), not evidence of oracle advantage.

decision: >-
  Fix the implementation to use |F|^m as the denominator for all arms, matching
  the specification. The specification's definition is correct: yield measures
  "relations found per unit of enumeration space," and MITM is a filtering strategy
  that reduces verification cost but not the enumeration space.

  The corrected metric will show whether the x-oracle helps find more candidates
  in the enumeration space (Δ ≈ 0.01), not whether MITM has a 50/50 relation rate
  (Δ ≈ 0.5, which is a structural artifact).

rationale:
  - The specification explicitly states: "tuples_attempted is defined consistently
    across all arms as |F|^m (the full enumeration space)."
  - The specification anticipates this: "For Arms B and C (MITM), this is the
    theoretical enumeration space |F|^m, treating MITM as a filtering strategy
    that reduces verification cost but not the enumeration space."
  - Using candidates_verified as denominator conflates "precision" (fraction of
    verified candidates that are relations) with "yield" (fraction of enumeration
    space producing relations). These are different quantities.
  - The x-oracle hypothesis (H-XOR-YIELD) is about whether the oracle helps find
    more relations per unit of work, which is correctly measured by yield over
    the enumeration space.

required_corrections:
  - Fix experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py to use |F|^m
    as denominator for all arms.
  - Re-run the full grid with corrected metric.
  - Update analysis.yaml with corrected Δ and confidence intervals.
  - Acknowledge non-independence of seed replicates for Arms A and B in the analysis.
  - Use correct t-value (2.023 for df=39) or document the normal approximation.

next_action: >-
  Dispatch executor to fix implementation and re-run full grid with corrected metric.
  Then dispatch independent reviews for the corrected results.

