coordinator_decision:
  id: DEC-20260929-d75c82
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py --next
    coordinator_decision --date 20260929 and --check verified, 2026-09-29.
    This Coordinator holds no shell and minted nothing.
  recorded_at: '2026-09-29'
  decided_at: '2026-09-29'
  decided_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  question_ids:
    - RQ-SEMBIN-9e8f82

  decision: revise
  decision_label: >-
    Evidence review of RUN-SEMBIN-79996f (EXP-SEMBIN-e76704).
    VAL-20260929-sembine76704 fails the run on the metric definition;
    provenance, scoring and reproducibility pass. EV-SEMBIN-c71cad is
    recorded as neutral / inconclusive: a computation receipt only. The
    instrument defect is recorded in CORR-20260929-616d03. The
    EXP-SEMBIN-e76704 protocol is NOT amended in place. The measurement is
    to be redone with a corrected instrument under a new, versioned
    contract. H-SEMBIN-934774's status is not changed.

  context: >-
    DEC-20260929-79ba35 approved EXP-SEMBIN-e76704 v1 to replicate, from
    hash-pinned code, an exploratory separation of the reduced first fall
    degree under GL_l(F_2) recombination at Semaev (6,3), a negative at
    (4,2), and a separating degree-matched null. RUN-SEMBIN-79996f exited 0
    with every runner check passing. The independent validator
    (VAL-20260929-sembine76704) confirmed provenance, scoring and
    reproducibility, but failed the definitional audit. The instruments form
    m*f as a set-OR of monomials rather than the Boolean-ring product, so
    the counts are values of an OR-row artifact, not of the declared
    Boolean-ring d'_ff. The "definition #4" label is also wrong: literal
    2015/984 Definition 6 gives d'_F = 1 on these unsatisfiable instances.
    The top-level session independently confirmed the core case,
    u0u1 * (u0 + u1) = 0 in the Boolean ring versus u0u1 from the set-OR.

  target_ids:
    - RUN-SEMBIN-79996f
    - EXP-SEMBIN-e76704
    - H-SEMBIN-934774
    - EV-SEMBIN-c71cad
    - CORR-20260929-616d03
    - KN-OPEN-7f0511

  validity_check:
    expected_run_count: 1 expected (maximum_runs 1), 1 present (RUN-SEMBIN-79996f)
    manifest_schema: >-
      Complete enough to register. Gaps per the validator:
      result.exit_code, inputs.parameters.field_bits and
      certificate.verified/verifier are missing.
    seed_integrity: Seeds 100 n + n' as specified. x_R = 15 at both scored cells (rerun_fast.json).
    raw_summary_agreement: raw-result.json is byte-identical to results.json (sha256 24720779ea35...)
    control_comparability: >-
      FAILED as a scientific control. C1 compares two implementations that
      share the OR-row defect, which is exactly the blind spot its own
      "limit" field disclosed. T3 is structurally forced (1 in the generator
      span). T4 is a null measured with the defective product.
    conclusion: >-
      A valid execution of a mis-specified instrument. The run is admissible
      only as a receipt that the frozen code computes what it computes.

  success_criterion_handling: >-
    No success criterion is changed after observing the outcome, and no
    protocol_amendment is written against EXP-SEMBIN-e76704 v1. The
    criterion was met mechanically: exit 0, controls_pass true,
    all_predictions_confirmed true. Its stated meaning was not met: "the
    reduced first fall degree separates ...". This decision is a validity
    ruling that the scored quantity is not the declared observable
    (VAL-20260929-sembine76704 DA-1/DA-2; CORR-20260929-616d03). It is not
    a re-scoring. The runner verdict stays exactly as recorded.

  rationale:
    - >-
      Validation verdict: failed, on the metric definition. The run is not
      invalid: the source hashes, raw/summary agreement and re-execution are
      all clean. But the observable the contract declared was never
      computed. The honest classification is the validator's own
      recommendation, "valid-with-limits, computation receipt only".
    - >-
      Evidence strength is set to inconclusive, with neutral direction. The
      only frozen-protocol measurement measured a different quantity, so it
      cannot discriminate for or against H-SEMBIN-934774. The numbers that
      bear on the declared quantity, true product T2 1,355,520 and T4 4,824
      (recount_T2.json, recount_T4.json), come from the validator's
      non-blind kernel. That kernel sits outside any frozen protocol, reuses
      src system construction, and obtains T2 by symmetry recount. They make
      failure of the T2/T4 predictions under a corrected instrument the
      expected outcome, but they are not yet a protocol measurement. A
      product-convention bug is an implementation failure, and an
      implementation failure is never negative mathematical evidence.
      Moving the hypothesis on it (weaken or reject_scoped) would treat an
      instrument error as a refutation. The replication of the computation
      is itself real, but it concerns the artifact, so it does not raise
      the strength.
    - >-
      The status of H-SEMBIN-934774 is unchanged. Its statement fixes the
      Boolean-ring definition, and no frozen protocol has measured that
      definition. It is not to be re-run under its current wording. Its
      assumptions[0] is shown false by certificate (EV-SEMBIN-c71cad
      proof_refs), and its interpretation_limits on genericity and
      non-automaticity are withdrawn by CORR-20260929-616d03. The successor
      is a NEW hypothesis naming the definition and the field-equation
      convention (NA-2). It supersedes H-SEMBIN-934774 by reference and
      does not edit it.
    - >-
      What survives is scoped exactly as the validator computed it. Under
      Nagao 2013/549 Definition 1 on the bare generators (no field
      equations), the witness M = [1, 2, 4, 8, 26] at (6,3) separates,
      D_ff 2 -> 3, and exactly 1,612,800 matrices in GL_5(F_2) separate.
      That count coincides with PRED T2 for the Definition 1 count, not the
      Boolean count. Four qualifications apply. (a) D_ff(M) = 3 is reached
      only through a trivial (Koszul) syzygy. (b) With the field equations
      as generators, the fall at D = 2 returns and nothing separates. (c)
      Under Definition 1 the random null does not separate (T4 = 0), so
      "generic, not descent-specific" is refuted and "degree-drop absorption
      not supported" is contradicted. (d) Both instances are unsatisfiable
      over F_2. These are non-blind validator computations. They are
      recorded as findings of that report, not promoted as program results.
    - >-
      Bearing on KN-OPEN-7f0511 (A): the separation exists only for
      Definition 1 without field equations, only through a Koszul syzygy,
      and it vanishes in the {f} union S_fe form that is relevant to Weil
      descent. (A) is NOT resolved in either direction. Nagao's
      D_ff^max question for Weil-descent systems stays open, and this
      decision records no bound and no separation for it.
    - >-
      The same defect is in research/verification/ffd_semaev_core.py.
      research/FFD_SEMAEV_MEASUREMENT1.md's "Semaev flat at 2 versus null
      climbs" comparison is therefore unverified until it is re-measured
      (CORR-20260929-616d03 scope_of_effect). Identity-presentation values
      were unchanged at the 10 C1 Semaev cells. Recombined and null systems
      are affected (T4 upward 5,424 -> 4,824), and the MEASUREMENT1 null
      draws were never re-checked.
    - >-
      Target profile (docs/target-result-profile.md): this lane is a
      definition and instrument audit under a published polynomial-time
      claim, not an exponent-moving mechanism. The corrective work (NA-2,
      NA-3) is small, and it is required before this program cites any
      first-fall-degree measurement, including the MEASUREMENT1 table that
      research/gfp5_deployed_curves_20260920.md already leans on.

  evidence_refs:
    - experiments/EXP-SEMBIN-e76704/validation-report-20260929.yaml (VAL-20260929-sembine76704; transcribed from the validator's verbatim summary)
    - experiments/EXP-SEMBIN-e76704/validation/validator-20260929/recount_T2.json
    - experiments/EXP-SEMBIN-e76704/validation/validator-20260929/recount_T3.json
    - experiments/EXP-SEMBIN-e76704/validation/validator-20260929/recount_T4.json
    - experiments/EXP-SEMBIN-e76704/validation/validator-20260929/rerun_fast.json
    - experiments/EXP-SEMBIN-e76704/validation/validator-20260929/{audit_or_xor,certificate,certificate2,nagao_def1,def1_general,def1_all_and_c1,hps_def6,hps_all42}.py (read; outputs not preserved except the JSONs above)
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/manifest.yaml (read in full)
    - experiments/EXP-SEMBIN-e76704/specification.yaml (read in full)
    - experiments/EXP-SEMBIN-e76704/src/{ffd_semaev.py:95, recomb_search.py:31, fastfall.py:25} (defect lines read)
    - research/verification/ffd_semaev_core.py:95 (defect line read)
    - research/FFD_SEMAEV_MEASUREMENT1.md (read in full)
    - ledger/hypotheses/H-SEMBIN-934774.yaml (read in full)
    - knowledge/open-problems/KN-OPEN-7f0511.md (read in full)
    - ledger/evidence/EV-SEMBIN-c71cad.yaml
    - ledger/corrections/CORR-20260929-616d03.yaml

  procedure_deviations:
    - >-
      No review_plan was written, and no TASK-* handoff exists for the
      validation (DEC-20260929-79ba35 NA-3 required both). The validator was
      dispatched directly by the top-level session. No prior was recorded.
    - >-
      The blind re-derivation (DEC-20260929-79ba35 NA-4) was never
      dispatched. It was the one check designed to see a shared
      definitional error, and the error it was meant to find is the one
      that occurred. It is re-issued as NA-5 below.
    - >-
      The post-run snapshot archive record TASK-20260929-e3eed9 is absent
      (validator finding). Snapshot-before-review therefore rests on the
      session's commits, not on an archive receipt.
    - >-
      The run was launched by the orchestrating session rather than an
      executor subagent (disclosed in manifest.yaml).

  limitations:
    - >-
      The validation was not blind, and it reused the src system
      construction. A defect in build_system / cell_systems would be shared
      and invisible to it.
    - >-
      The surviving Definition 1 and field-equation results, the
      Definition 6 result and the C1 true-product identity check have no
      preserved output files. They rest on re-runnable scripts plus the
      validator's summary. The Coordinator did not receive the validator's
      full-length report.
    - "Toy tier only: two cells, one curve, one x_R, unsatisfiable instances."
    - >-
      This Coordinator has no shell. It ran no command, did not parse the
      written YAML, and did not run tools/validate_ledger.py (NA-1). Its one
      direct observation of the scratchpad instrument copies was a
      read-only grep of an unarchived path.
    - One model family serves every role by runtime inheritance. Session independence is real; model independence is not claimed.

  next_actions:
    - id: NA-1
      first_next_action: true
      role: top-level session (dispatcher)
      text: >-
        Parse the four records written here and run
        python3 tools/validate_ledger.py. Fix any error attributable to them
        by editing these still-uncommitted files only; never edit tools or
        existing records. Merge origin/main into
        claude/regularity-growth-ecdlp-31utms (merge, never rebase). Then make
        one ledger-archive commit, staging exactly
        experiments/EXP-SEMBIN-e76704/validation-report-20260929.yaml,
        ledger/evidence/EV-SEMBIN-c71cad.yaml,
        ledger/corrections/CORR-20260929-616d03.yaml and this decision. The
        validator directory is already committed at 918c56c639, per the
        session. Put every record id in the commit message. Verify the
        receipt, push, and refresh PR #1491 naming EV-SEMBIN-c71cad,
        CORR-20260929-616d03, DEC-20260929-d75c82 and
        VAL-20260929-sembine76704. Until that commit verifies, this decision
        is not official. Also confirm whether RUN-SEMBIN-79996f's run
        directory is committed, and report its commit.
    - id: NA-2
      role: coordinator, then idea-generator/designer and executor through minted TASK handoffs
      text: >-
        Build a corrected instrument with the XOR (cancelling) Boolean-ring
        product, under a NEW experiment and a new hypothesis. The
        alternative is a versioned protocol_amendment under
        experiments/EXP-SEMBIN-e76704/amendments/. The Coordinator's
        preference is a new experiment, because v1 has run and its runner
        verdict is part of the record. EXP-SEMBIN-e76704 v1 is not edited.
        Required: a unit test on u0u1 * (u0 + u1) = 0, and the
        M = [1, 2, 4, 13, 26] certificate as a regression fixture (true
        d'_ff = 2). Report every quantity per definition with the
        field-equation convention stated: Boolean-ring true product;
        Definition 1 on bare generators; Definition 1 on {f} union S_fe.
        Report falls that are realised only through trivial (Koszul)
        syzygies separately. Include at least one satisfiable
        (solution-bearing) instance family next to the unsatisfiable (6,3)
        and (4,2) cells. The new hypothesis's predictions must be fixed
        before execution. Where validator values are reused as predictions,
        label them non-independent.
    - id: NA-3
      role: coordinator (dispatch after NA-2's instrument passes its unit test)
      text: >-
        Re-measure research/FFD_SEMAEV_MEASUREMENT1 with the corrected
        instrument: same cells, seeds and draw counts, Semaev and matched
        null, under a frozen contract with a run record. Until then, the
        "Semaev pinned at 2 versus null climbs" comparison is unverified and
        may not be cited. The existing note is not edited; a superseding
        note or evidence record carries the corrected values.
    - id: NA-4
      role: coordinator (standing rule for this lane)
      text: >-
        From now on, every D_ff / D_ff^max / d_F / d'_F claim in any record
        on this lane names (i) the definition by source and number, (ii)
        whether the field equations are generators, reduced modulo, or
        absent, and (iii) the product convention of the instrument. A claim
        missing any of the three is returned for revision.
    - id: NA-5
      role: coordinator (dispatch as a validator review-adversarial task with a review_plan)
      text: >-
        Blind re-derivation, re-issuing DEC-20260929-79ba35 NA-4. Starting
        only from written definition statements and a written statement of
        the system construction (not build_system code), re-derive: the T1
        witness under each definition in NA-2; the Definition 1 count at
        (6,3); the field-equation no-separation; and the null T4 values. The
        product convention must be stated explicitly. blind_from:
        experiments/EXP-SEMBIN-e76704/src/, experiments/EXP-SEMBIN-e76704/runs/,
        experiments/EXP-SEMBIN-e76704/validation/,
        experiments/EXP-SEMBIN-e76704/validation-report-20260929.yaml,
        EV-SEMBIN-c71cad, CORR-20260929-616d03.
    - id: NA-6
      role: coordinator
      text: >-
        After NA-1 verifies, checkpoint GOAL-SEMBIN-fcb7a2 with a new
        write-once shard under ledger/goals/GOAL-SEMBIN-fcb7a2/checkpoints/,
        recording exactly one next action: NA-2, the design of the
        corrected-instrument experiment. KN-OPEN-7f0511 stays open. Any note
        on its item (A) goes through /curate-knowledge as a new record, and
        only after NA-2/NA-5 report.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The decision is revise, not support or reject_scoped, and the evidence
      is inconclusive, below replicated. The only protocol measurement did
      not measure the declared observable. The surviving Definition 1
      separation is a single non-blind validator computation outside any
      frozen protocol, unreplicated and with no preserved output, so it
      does not meet the KN-FIND bar. The instrument lesson (set-OR is not
      the F_2 product; C1-style cross-checks between implementations
      cannot see a shared definitional error) is recorded in
      CORR-20260929-616d03. It is a candidate KN-TECH for /curate-knowledge
      once NA-2's unit-tested instrument exists. KN-OPEN-7f0511 (A) is not
      resolved and is not amended here.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    served_by: claude-opus-5-5
    served_by_note: >-
      Claude Code subagent with model inherit. The identifier is as reported
      by the runtime, not probe-verified.
    fallback_used: true
    fallback_reason: runtime inheritance, backend substitution only
    degraded_allowed: false
    model_verified: false
    amazon_bedrock: not selected, not configured, not probed, not contacted, not used

  runs_launched: 0
  status_transitions: []
