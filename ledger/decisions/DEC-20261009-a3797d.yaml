  context: 'User hypothesis H2 (2026-10-09) on characteristic-zero lifts: Smart''s anomalous attack is
    the one lifting attack that works; for t != 1 the formal-group residue depends on the lift; Serre-Tate
    gives a canonical lift of the curve but not of points; a computable canonical section of E(Q_p) ->
    E(F_p) would be a full break; lifting to E(Q) or E(K) fails because small points are polynomially
    many. Filed as RQ-CZLIFT-b9f765 and split into three measurable hypotheses with one frozen contract
    each. GOAL-ECDLP-001 holds its approval cap (7 approved contracts without a run), so this work opens
    its own goal rather than adding to that backlog.'
  decision: approve_protocols
  decision_scope: APPROVES EXP-CZLIFT-17b7eb, EXP-CZLIFT-ae0a13 and EXP-CZLIFT-a255fc at version 1 and
    moves H-CZLIFT-889c9d, H-CZLIFT-6d4ed1 and H-CZLIFT-9a32e9 to approved (pre-run). Opens GOAL-CZLIFT-1516d5
    and BATCH-2e44f7. Asserts nothing about any hypothesis; in particular it does not assert that the
    user's 'full break' clause is false, which H-CZLIFT-6d4ed1 predicts and EXP-CZLIFT-ae0a13 tests. Authorizes
    no attack on any deployed curve.
