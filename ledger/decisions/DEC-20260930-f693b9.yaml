coordinator_decision:
  id: DEC-20260930-f693b9
  decided_at: '2026-09-30'
  decided_by: coordinator
  context: >-
    IDEA-20260926-197ecf (tau-Horner chain, heuristic H1) was already filed
    on active RQ-FROB-7d8dd4 with numbered predictions P1-P4, falsifiers, and
    controls. Standing user authorization of 2026-09-06 says ideas and
    experiments are approved once the contract is complete. No human
    confirmation was requested. No run has been executed. The executor
    handoff is written and not launched. Snapshot archive task
    TASK-20260930-fa234f is named as archived_by and is not written by this
    decision.
  decision: >-
    approve frozen EXP-FROB-5e15ed version 1 and hypothesis H-FROB-855915
    under standing user authorization 2026-09-06, because every required
    field is non-null and success/falsification are decidable. Scope is the
    toy panel only. Not an ECDLP speedup.
  target_ids:
    - IDEA-20260926-197ecf
    - H-FROB-855915
    - EXP-FROB-5e15ed
    - TASK-20260930-be6bbf
    - RQ-FROB-7d8dd4
  ranking:
    open_ecc_ideas_at_selection: 94
    open_ecc_ideas_source: >-
      python3 tools/ecc_priority.py --open-ideas on this checkout, status
      proposed and cited by no hypothesis or experiment. The count was 94.
      IDEA-20260926-197ecf was the open FROB idea.
    reason: >-
      Among 94 open ECC ideas, this one was selected because it is ECC, on
      active RQ-FROB-7d8dd4, and already carries numbered predictions P1-P4,
      falsifiers, and controls, so it can be frozen without inventing a
      protocol. Other open ideas stay proposed.
  rationale:
    - >-
      The contract transcribes the proposal's four Koblitz cells, both
      ordinary controls, seeds 2026092701 through 2026092704, 200 Stage-1
      targets, 40 Stage-2 targets, and the P1, P2, and P3 bands. No cell
      was added and no band was widened.
    - >-
      Success is the conjunction of order recomputation, RC-1 regression,
      universal verification, Z/NZ P1 in band, every Koblitz P1 in
      [0.8 m!, 1.2 m!], every Stage-2 P2 in [0.83, 1.2], and P3 >= 5
      on both ordinary [2]-Horner links.
      Falsification of H1 is P1 < 0.5 m! or P1 > 2 m! on any Koblitz cell
      with the instrument intact. Instrument failures are invalidation.
    - >-
      Claim (D) is an arithmetic column labeled modeled. A gap above 0.5
      bit is an arithmetic error for a superseding record. The time
      exponent versus Gaudry and versus rho is unchanged. sota_delta time
      exponent is 0. Dominated by Pollard rho at exponent 1/2.
    - >-
      User authorization is the 2026-09-06 standing instruction. Coordinator
      approval is this decision, because the contract is complete. Approval
      is not evidence that H1 is true.
  evidence_refs:
    - ledger/proposals/IDEA-20260926-197ecf.yaml
    - ledger/questions/RQ-FROB-7d8dd4.yaml
    - ledger/hypotheses/H-FROB-855915.yaml
    - experiments/EXP-FROB-5e15ed/specification.yaml
    - ledger/handoffs/TASK-20260930-be6bbf.yaml
  limitations:
    - Toy panel only. n = 17 and n = 19 do not transfer to n = 131.
    - No run exists. Nothing here supports or rejects H1.
    - Novelty versus eprint 2020/1315 is unverified. The full text was not retrieved.
    - A 2 to 2.5 bit constant is not an ECDLP speedup and does not beat rho.
    - >-
      Cell (17, 3, 6) has ml = 18 > 17. It stays in the panel as the
      proposal listed it. The bands are not relaxed for it.
    - >-
      The residual label not_success is the complement of the four primary
      labels when the instrument holds, H1 is not falsified, outcome (ii)
      does not fire, and the success conjunction still fails. It is not a
      pass. It keeps the criterion decidable without widening a band.
  next_actions:
    - >-
      Do not launch TASK-20260930-be6bbf until snapshot archive
      TASK-20260930-fa234f has a verified receipt. This decision does not
      write that task file and does not dispatch the executor.
    - >-
      Leave every other open ECC idea at status proposed. Do not freeze a
      second protocol in this step.
    - >-
      After a valid run, review the outcome label against the frozen
      precedence before any hypothesis transition. No knowledge promotion
      until replicated evidence exists.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No run has executed. The proposal's novelty versus eprint 2020/1315 is unverified. A 2 to 2.5 bit constant is not a knowledge promotion.
  archived_by_named_not_written: TASK-20260930-fa234f
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    resolved_model_id: null
    model_verified: false
    amazon_bedrock: prohibited and not used
