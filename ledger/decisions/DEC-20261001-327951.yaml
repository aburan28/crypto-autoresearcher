# DEC-20261001-327951
# Approves the frozen Part 1 contract. Does not assert the claim.
coordinator_decision:
  id: DEC-20261001-327951
  context: >-
    Design of IDEA-20260922-6cf862, the first high-priority open ECC idea
    returned by tools/ecc_priority.py --open-ideas on 2026-10-01. The proposal
    next_gate asks for a Coordinator choice between an analysis artefact and
    an EXP-BINSTD contract. The choice recorded here is a frozen experiment
    for Part 1 only.
  decision: approve
  target_ids:
    - IDEA-20260922-6cf862
    - H-BINSTD-336b2d
    - EXP-BINSTD-becc4b
  rationale:
    - >-
      Standing user authorization of 2026-09-06 covers idea intake and
      experiment approval. Protocol completeness was checked in this decision:
      the contract names inputs, controls, metrics, a fixed run count, stopping
      and invalidation rules, a success criterion, and a falsification
      criterion that a possible outcome can meet.
    - >-
      Part 1 is exact arithmetic on published parameters and one polynomial per
      k. Part 2's balance heuristic is a different claim and is left
      unspecified so this contract cannot be scored by a relation count.
    - >-
      The five eligible experiments already in the portfolio
      (EXP-CRYPTO-9225d2, EXP-CRYPTO-6505c6, EXP-CRYPTO-5e8beb,
      EXP-CRYPTO-3759c6, EXP-AUXIN-684adf) have no trial plan, and their
      documented entry points refuse scientific execution under zero-run
      preparation. That impediment is why this design was ranked next, not a
      finding about those hypotheses.
    - >-
      Parameter facts used here were read from
      analysis/binstd-curve-audit/README.md, audit-certificate.txt, and the
      c2pnb176v1 block of binary-curve-params.txt. The proposal file was read.
      IDEA-20260906-a77711 and IDEA-20260918-9abf42 were not opened in this
      session; the decision does not treat them as checked sources.
  evidence_refs:
    - ledger/proposals/IDEA-20260922-6cf862.yaml
    - analysis/binstd-curve-audit/README.md
    - analysis/binstd-curve-audit/audit-certificate.txt
  limitations:
    - >-
      Approval authorises the test. It does not support, weaken, or reject
      H-BINSTD-336b2d. No run of EXP-BINSTD-becc4b exists.
    - >-
      The cyclotomic splitting law and the Weil formula are cited in the
      hypothesis as recalled ingredients. The experiment has to exhibit the
      factors and the integer checks.
    - >-
      frontier_check on the source idea remains pending. This decision claims
      no Pareto improvement.
  next_actions:
    - >-
      Dispatch TASK-20261001-1181dd after TASK-20261001-8de567's snapshot
      receipt verifies. The executor implements the two factorisations and
      writes two runs under the frozen budget.
    - >-
      Do not design Part 2 until Part 1 has a retained certificate or a
      recorded instrument failure.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision approves an unrun contract. There is no evidence record
      and no durable finding to promote.
  decided_by: coordinator
  decided_at: '2026-10-01'
