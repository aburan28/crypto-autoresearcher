  d6_ruling:
    gate_text_cited: >-
      specification.yaml gates, id G-FIX: "R10 against the archived
      EXP-PFDR-1b78f7 canonical rows, staircases and harvest rows of the same
      jobs: every solver column, every TT and TB block, every informative
      rank, census_saturated_at_row and every staircase equal; SS pairs_raw,
      pairs_formal and pairs_nonformal new >= old; at <= 24 bits new ==
      C(k', 2) reconstructed from the retained rows. Any other difference
      (rows, dup_formal, poisson_mean) is allowed only where fixcompare
      attributes it, instance by instance, to an x-group straddling unmerged
      runs; an unattributed difference is a stop (R18)."
    facts: >-
      fixcompare compares every key of the archived row and harvest block,
      excluding only timing keys and PAIR_KEYS = (pairs_raw, pairs_formal,
      pairs_nonformal). On all 838 instances it reports no non-pair
      difference, equal staircases, equal harvest rows (fix-diff-rows: 0
      rows), SS pair counts new >= old at at_stop and at_A_fix, and
      pairs_raw == C(k', 2) from the retained rows at <= 24 bits. Its
      unattributed list holds 9 instances: 26-bit m 4 curve 0 (dickson,
      random_dick_r0, random_sub_r0, random_sub_r1, small_x) and 32-bit m 5
      curve 0 (random_dick_r0, random_dick_r2, random_sub_r2, small_x). Each
      has the single reason "pair difference without a straddling x-group",
      the rule the executor added ("a pair difference needs an SS x-group of
      >= 3 members spanning >= 2 attempts").
    ruling: >-
      G-FIX PASSES. R10 is valid and R18 is NOT triggered. The frozen text
      governs SS pair-count changes only by "new >= old" and, at <= 24 bits,
      by C(k', 2) equality. Both hold everywhere. The attribution clause
      applies to "any other difference (rows, dup_formal, poisson_mean)", and
      none exists. The added straddle rule is stricter than the gate and is
      not the gate. It cannot be evaluated above 24 bits because rows after
      census saturation are not retained there. fix-report.json (pass false)
      stays as archived, unedited.
    residual: >-
      For the 9 instances above 24 bits, the increase in harvester pair
      counts is not verified instance by instance as OBJ-5-attributable,
      because the frozen gate did not require it and the retained rows cannot
      show it. No decision statistic of this experiment uses harvester pair
      counts: CC-7 counts relations from rows, and P0's Mbar uses the
      analysis script's own recount from rows. The residual is routed to the
      evidence review's G-FIX joint (NA-5).

  # ---------------------------------------------------------------------------
  p0_ss4_ruling:
    grounds_stated_before_any_number: >-
      The rule was chosen on four protocol grounds, evaluated option by option
      in AMD-20261002-280481 protocol_grounds, before any number was read.
      Fidelity: keep the frozen "archived random arms, complete instances,
      CC-1 recount", and change the pinned interpretation only where it
      cannot execute. Blinding: re-rule no cell whose pinned rule already
      ran, and create no new data. Transfer: use the rungs nearest the target
      band, at which completeness is total so that the filter selects
      nothing. Power honesty: the same two-rung structure as every other cell,
      the frozen conservatism kept, the transfer assumption labelled, and the
      realised X_rel as the decision-bearing limit. No P0 estimate of any
      (class, m) was seen, and the choice does not depend on one.
    ruling: >-
      A narrowed form of the executor's option B, written as an additive
      amendment (AMD-20261002-280481 A-1..A-4). I-8 is ratified for every
      (class, m) except (SS, 4). For (SS, 4), rho1, D_R with its 95% bound,
      and Mbar are estimated from the two highest rungs at which every
      completed_valid archived random-arm instance is complete at A_fix,
      selected by rule. On the executor's report these are 22 and 24 bits;
      any other selection is a stop. The SS m 4 power prediction is
      labelled as conditional on TA-1. Options A (all bits for every cell),
      C (planning values) and D (new pilot) are not taken, for the reasons
      recorded in the amendment.
    amendment_written: AMD-20261002-280481 (experiments/EXP-PFDR-011cd0/amendments/AMD-20261002-280481.yaml), protocol v1 -> v2, approved by this decision
    r11_restarts_as_attempt_3: true
    new_pinned_analysis_file_needed: true
    new_pinned_analysis_file: >-
      experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py, a copy of
      the 96d3b2df bytes changed only as A-3 allows, with its diff, function
      diff and fixture exercise. It is pinned before R11 attempt-3 and is the
      one analysis file for R11 attempt-3, G-REL, R15, R16 and R17. The
      archived analyze_relcensus.py stays byte-identical and is not invoked
      again.

