    - "OR-5: A pinned tool verdict that disagrees with the frozen gate text is a stop-and-return, never an override."
    - "OR-6: experiments/EXP-PFDR-1b78f7/analyze_census.py differing from its TASK-20260928-f15632 hash while equal to its TASK-20260929-599b4b hash (c40ea02f...) is a known condition (PRR-6), not a stop."

  rationale:
    - >-
      Validity first (coordinator.md responsibility 6). Every claim above about
      R01-R10 is read from archived manifests, reports and the archive
      receipt. Nothing is recomputed (no shell) and nothing is interpreted. A
      memory stop and a protocol-gap stop are infrastructure and design
      signal, never negative evidence (AGENTS.md core rule 5).
    - >-
      D-6 is decided on the frozen gate text, not on the pinned tool's
      verdict. The tool encoded a rule stricter than the gate. Treating that
      rule as the gate would trigger R18 attribution of a "mismatch" the
      gate does not define. Treating the tool's fail as noise without a
      ruling would leave an executor override standing. Hence an explicit
      ruling plus PD-1.
    - >-
      P0-SS4 is decided by protocol grounds fixed before any value (fidelity,
      blinding, transfer, power honesty), and the narrowest executable change
      is preferred. The P0 rule can only raise n, so the risk at stake is an
      underpowered SS m 4 cell. That risk is disclosed (TA-1) and is visible
      afterwards in the frozen achieved X_rel. It cannot be hidden, and it
      cannot be repaired by adaptive sampling.
    - >-
      Exponent bias (docs/target-result-profile.md). This census is the
      exponent-targeting branch of the PFDR line: a non-generic kappa_rel
      growing with N would move the exponent. Letting a design-input gap
      stall it would be premature closure by neglect (AGENTS.md
      "Research-direction integrity"). The prior remains the null.
    - >-
      Focus (coordinator.md "Focus discipline"). One critical item stays
      active on this line: EXP-PFDR-011cd0, continuing. The TW-FLOOR round is
      composed (DEC-20261001-494663). DEC-20261001-e9e7e6 NA-3's write-scope
      hold continues while the continuation is live.

