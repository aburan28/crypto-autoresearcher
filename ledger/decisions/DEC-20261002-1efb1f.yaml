  operative_ruling_text:
    - "OR-1: R01-R10 are valid and are not re-run. R11 is invalid and is re-executed as attempt-3 under AMD-20261002-280481 A-4."
    - "OR-2: G-FIX passes on the frozen gate text. R18 is not triggered. RUN-PFDR-011cd0-fix-check/fix-report.json stays unedited."
