  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      subject: review tiers
      ruling: >-
        Lane A at review-breakthrough, max, non-degradable, on the three
        breakthrough sibling bindings; lane B at review-adversarial, xhigh. Both
        exactly as DEC-20260924-99ce20 NA-1 specifies. Every review card sets
        fallback_allowed true for BACKEND substitution only (runtime
        inheritance), with degraded_allowed false. If review-breakthrough cannot
        be served at max, the lane-A card is not dispatched and the contract stays
        unapproved (plan TA-4); it is never replaced by a review-adversarial card.
    - id: R2
      subject: pre-composition seal
      ruling: >-
        NO SEAL CARD in either lane. Composition custody is kept this way: before
        each composer is launched, the top-level session computes sha256 of the
        six declared report files of that lane and pastes them into the launch
        prompt (a dispatch precondition on cards 13 and 14); the composer records
        them verbatim in its composition worksheet before reading any report; and
        the lane's ledger archive (15 or 16) must reproduce those six digests in
        its path_sha256, stopping on any mismatch.
      rationale: >-
        A seal's job is to fix report digests before composition reads them. The
        digests are fixed here at the same moment, by the same session that would
        have run a seal, and are written into a file the composer owns, while the
        composer's write scope excludes every review directory. BATCH-09aadd's
        seal added one card and one custody point for the same guarantee.
      cost: >-
        The digests become durable only with the ledger archive, not in a
        separate earlier commit. A composer session that died after reading the
        reports leaves the digests only in its launch prompt; the session must
        then recompute them before relaunching, and any difference is a custody
        finding.
    - id: R3
      subject: snapshot binding mode
      ruling: >-
        Both producer snapshots (5, 6) use binding_mode content_at_commit, not
        content_first.
      rationale: >-
        Each snapshot binds a hypothesis record and an experiment specification.
        Both have a life after the archive: an approving composing decision is
        followed, in a later batch, by status advances on both files. Under
        content_first the dispatcher reads the bytes from HEAD
        (tools/research_dispatch.py verify_archive), so the first legitimate
        status edit would break this batch's snapshot verification, which is the
        EXP-ICPERF-66fd51 failure the dispatcher's own comment records.
        content_at_commit reads the bytes from the snapshot's own commit, which
        is exactly what reviewers are told to hash. BATCH-09aadd used
        content_first because its object, an amendment, was terminal.
    - id: R4
      subject: approval mechanics and path ownership
      ruling: >-
        Each composer writes ONE composing decision (owned by its lane's ledger
        archive) and ONE composition worksheet (its own artifact). It does not
        edit the hypothesis or the experiment specification, whose paths the
        producer owns in this queue. Each specification carries status
        review_required, approved_by null, and an approval block stating that it
        is approved if and only if its composing decision is official with
        decision approve naming it. The status fields of the hypothesis and
        specification are advanced by the first card of the successor execution
        batch, which declares those paths; that is the first next action K-approve
        names.
    - id: R5
      subject: goal-head custody
      ruling: >-
        ledger/goals/GOAL-ECDLP2M-001.yaml is declared by TASK-20260924-23cefd and
        bound by TASK-20260924-083fd4 (content_at_commit). No later card of this
        queue writes it. The operative next_action names DEC-20260924-124667 and
        DEC-20260924-286589 next_actions item 1 as the authority once the lane
        archives verify, so no unbound pointer edit arises. Not sharded
        (DEC-20260924-4f8a03 R5: the QSP lane records are not closed and this
        checkpoint adds no batch_checkpoints entry).
    - id: R6
      subject: producer independence and read scope
      ruling: >-
        Each producer is a fresh Coordinator-role /design-experiment session that
        did not compose DEC-20260924-99ce20 and did not author this decision or
        either review plan. A producer may read its lane's review plan (it is not
        blind), but no blind-inputs file of either lane is withheld from it,
        because blind-inputs files state no computed value.
    - id: R7
      subject: RQ-FROB-7d8dd4 recheck
      ruling: >-
        Not re-run. The goal head's recheck_20260924 records RQ-FROB-7d8dd4 owned
        by GOAL-FROB-6333a9, and nothing in this batch touches it. Lane B uses
        Frobenius accounting as a BINSTD structural certificate under
        DEC-20260924-4f8a03 R2 and excludes the FROB-owned pipeline cost.
    - id: R8
