    - >-
      REVIEWER BUDGETS AT 300 s ARE BELOW THE MEASURED PER-JOINT AGENT-TIME RATE OF ROUND 2 EVEN
      AFTER THE JOINT CUT. An overrun is expected, must be disclosed, and must not be met by
      reallocating a ceiling.
    - >-
      THIS BATCH RE-RUNS EXACTLY ONE OF THE FIVE SURVIVING KNOWN-FALSE INSTRUMENTS. O-D, O-C,
      O-C-prime and O-C-double-prime REMAIN UNREPLICATED, which is why DEC-20260824-c5bb72 took
      `weaken` rather than `reject_scoped`, and nothing here changes that.
    - >-
      PERMISSIVE MODE IS OUT OF SCOPE AND ITS CELLS ARE EMITTED AS null RATHER THAN 0. This is a
      budget decision recorded as one and is NOT evidence that permissive mode would behave the
      same way.
    - >-
      THE INSTRUMENT IS NOT REPAIRED. VD-3, VD-4, the {E4}/{E5} zero-image result, OBJ-3 and OBJ-4
      stand open. The two in-scope items -- RC-1's fold by re-scoring and the well-formedness gate
      -- are each argued in `what_this_batch_deliberately_does_not_do` rather than slipped in.
    - >-
      THIS SESSION HAS NO SHELL. It ran no command, computed no hash, executed no code, minted no
      identifier and made no commit. Every integer in every artifact it wrote is quoted from a
      named committed artifact and attributed to the session that measured it. NO ATTESTATION,
