    not_warranted: >-
      NOT WARRANTED AT AN OPENING, AND THE REASON IS STRUCTURAL RATHER THAN A JUDGEMENT ABOUT THE
      CONTENT. This program promotes a KN-FIND on a `support` or `reject_scoped` decision backed by
      `replicated` or `strong` evidence. THIS IS AN `approve` ON A CONTRACT AND THERE IS NO EVIDENCE
      BEFORE IT.
      THE TWICE-DEFERRED KN-TECH ENTRY IS NOT DEFERRED AGAIN BY THIS RECORD, AND THE ONE THING
      THAT COULD HAVE FORCED A THIRD DEFERRAL IS NOW REMOVED. Its deferral was bounded by
      DEC-20260824-c5bb72 ON THIS BATCH'S CLOSE, not on its opening. This decision does two
      concrete things to make that binding meetable. FIRST, IT ASKED FOR THE IDENTIFIER AT OPENING
      AND THE REQUEST WAS GRANTED BEFORE FILING: KN-TECH-6785f2 is reserved for
      TASK-20260824-5eafa3. That matters because a completion criterion retired for want of an
      identifier would have been retired for a BOOKKEEPING reason rather than on the merits, which
      is the worse of the two branches and was named as such at opening. THE CLOSE MAY NOW TAKE
      THE FIRST BRANCH, AND IF IT TAKES THE SECOND IT MUST ARGUE THE MERITS. SECOND, it commissions
      in EXP-DIFFP-04082e exactly the content the amended specification is missing: the
      dependency-graph audit, the partition of every verdict into contingent / entailed by
      construction / theorem of the graph / not probed, and the two general rules
      DEC-20260824-c5bb72 named for addition.
      WHAT IS STILL NOT DECIDED BY THIS RECORD, STATED SO THE GRANT IS NOT OVER-READ: whether the
      entry SHOULD be written is the close's judgement on the reviewed package, not this opening's.
      An identifier is a permission to write, never a reason to.
    identifier_provenance_finding: >-
      RECORDED AS A HARNESS FINDING BECAUSE IT IS ONE, AND BECAUSE THE KN-TECH ENTRY MUST CARRY IT.
      KN-TECH-6785f2 WAS NOT EMITTED BY tools/allocate_id.py `--next`, BECAUSE THAT TOOL HAS NO
      `knowledge` TYPE: its `--next` accepts only batch, coordinator_decision, correction, evidence,
      experiment, goal, handoff, hypothesis, idea and research_question. The DRIVING SESSION
      generated a random 6-hex token with `secrets.token_hex(3)` -- drawing no state, which is
      exactly the reasoning CLAUDE.md's ID section gives for `--next` in the first place -- and then
      confirmed it well-formed and FREE with `--check` against the full identifier union. THIS
      SESSION RAN NEITHER COMMAND AND RECORDS BOTH AS THAT SESSION'S.
      THE GAP IS WORTH NAMING RATHER THAN WORKING AROUND SILENTLY: CLAUDE.md's Conventions section
      lists `KN-{LIT,TECH,FIND,OPEN}-<tok>` among the identifiers to mint with
      `tools/allocate_id.py --next <type>`, and for that family the tool cannot do it. The
      workaround is correct and produces an identifier with the same properties `--next` would give
      -- state-free draw, then `--check` -- but a convention that instructs an agent to use a tool
      that will reject the request is a defect in the convention or in the tool, not in the agent
      that hits it. OFFERED TO WHOEVER OWNS tools/allocate_id.py AND CLAUDE.md. It is an
      INFRASTRUCTURE FINDING and says nothing about MD5, SHA-1, the adjudicator or anything
      mathematical, in any direction.

