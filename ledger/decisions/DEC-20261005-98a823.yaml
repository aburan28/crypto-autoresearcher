  standing_authorization: >-
    Not relied on for any approval: this decision approves nothing. The
    standing user authorization of 2026-09-06 (AGENTS.md "Standing user
    authorization for ideas and experiments") removes per-item user
    confirmation. In its own text, "Ranking, resource limits and independent
    evidence review still apply". This decision is a ranking act under that
    sentence.

  decision: pause
  decision_label: >-
    WITHHOLD BY EXPLICIT ID, PER-RECORD READING. (1) The 104 approved, unrun
    contracts listed in withheld_contracts.ids, and the 104 executor cards
    listed in withheld_cards that serve them, are WITHHELD FROM DISPATCH. No
    /run selection, executor launch or snapshot archive of theirs is ranked
    ahead of doing nothing. (2) The 22 template rows in excluded_from_hold are
    NOT held. They stay dispatchable and are not deprioritised by this
    decision. (3) Auditable finding F-2 extends DEC-20261005-138b51's F-1.
    (4) The owed T-1 tooling card is written as TASK-20261005-27ff15 and
    extended with T-2, so that the /run selector honours withheld_contracts
    blocks. "pause" is used in its lane sense only, as in
    DEC-20261005-138b51. No lane is closed (see closure_gate_note).

  context: >-
    DEC-20261005-138b51 withheld 47 RQ-ECDLP-002 contracts by explicit ID and
    stated that "A title or template match does not dispose of any other
    record". The dispatching session then measured, on f2da001b72, that the
    same contract template (controls contain "Two arithmetic routes" and "must
    not import each other") appears in 173 experiment specifications across 19
    areas, designed 2026-10-01 (6), 10-02 (55), 10-03 (71) and 10-04 (41). 126
    of them are outside 138b51's list: BINSTD 44, ECDLP 33, ICPERF 7, DREG 6,
    GFPN 6, CERTBIN 5, FROB 5, AUXIN 3, SATIC 3, LHW 2, NISTBIN 2, SEMBIN 2,
    SSIQ 2, CSIDH 1, GRUMPY 1, OAKLEY 1, PFDR 1, QSP 1, SSI 1. 125 of these
    are approved, frozen, and have no implementation file and no run
    directory. EXP-CERTBIN-ec9d83 is analyzed, with two runs. Each of the 126
    has at least one executor card naming its implementation/ or runs/
    directory (128 cards in all). The /run selector, tools/newest_experiments.py,
    ignores decisions. It drops only superseded specs and specs carrying
    `execution_authorized: false`. So 138b51's hold is invisible to /run. A
    /run pass this session had EXP-GFPN-3d834b, EXP-ECDLP-ffae95 and
    EXP-ECDLP-f33d1f at the top of its worklist. The census is
    coordination/archives/TASK-20261005-2af213/template-census.json, produced
    by template_census.py in the same directory. It is report-only and is
    archived with this decision. This Coordinator read, for each of the 126
    uncovered rows, the census fields preregistered_quantity,
    preregistered_formula, scale_justification, heuristic_under_test,
    out_of_scope, executor_cards, implementation_files and run_dirs. Where the
    quantity names a category instead of a value, or the formula refers to an
    object whose value it does not state, this Coordinator read the
    specification itself (see rule_9_fields.evidence). Membership below was
    decided row by row on that text, never by title, area or signature.

  # ---------------------------------------------------------------------------
  # Ground: the ranking rule (not any question's admission rule)
  # ---------------------------------------------------------------------------
  ground:
    rule: >-
      AGENTS.md "Goals are never paused": "Never dispatch a task you cannot
      rank ahead of doing nothing". AGENTS.md "ECC comes first" instruction 1:
      unlimited budget "removes the batch ceiling, not the duty to rank ... An
      unlimited budget is the single strongest invitation to make-work this
      program has; it is still forbidden." agents/coordinator.md Decision
      checklist item 1: "What exact uncertainty will this reduce?"
    why_not_admission_rule: >-
      Most of these rows belong to questions other than RQ-ECDLP-002, and this
      decision did not read those questions' decision_target texts. It
      therefore makes no claim that any row is outside its question. The
      claim is narrower and rests on each contract's own text: executing it
      reduces no uncertainty, because its outcome is fixed and written before
      execution.
    qualification_test: >-
      A contract is held ONLY if, on its OWN text, both hold. (a) Every
      predicted value is a closed-form evaluation of constants written in the
      record itself, or a check by elementary integer or rational arithmetic
      (sums, products, cross-multiplication, binomials, gcd, residues of small
      integers, series bounds), with the value written in the record. The
      outcome is therefore fixed before execution. (b) The record disclaims,
      in out_of_scope or scale_justification, any measured cryptanalytic
      object, curve, walk, solver run, census, or transfer to one, and its
      check does not construct or compute in such an object. A row is
      EXCLUDED, with a reason, if its check computes in a named elliptic curve
      or group law, a specific finite field or polynomial quotient ring tied
      to a cryptanalytic object, a summation-polynomial ANF, the
      multiplicative order of 2 modulo a binary-field extension degree (which
      fixes Frobenius-orbit or stable-subspace structure), a gate or reading
      rule written to be applied to later measurements, or an unstated route.
      It is also excluded if this reading was unsure, or if it has already
      been executed.
    uncertainty_reduced: >-
      Which approved contracts on the /run worklist would spend an executor
      session, a snapshot archive and a PR on an outcome that is already
      written in the record. For 104 rows the reading answers that by
      inspection. For the 22 excluded rows it does not, or the row has
      already been executed, so those 22 stay ranked work.

  # ---------------------------------------------------------------------------
  # (1) The withheld contracts. Tool-readable; honoured by T-2 once it lands.
  # ---------------------------------------------------------------------------
  withheld_contracts:
    ruling: >-
      DISPATCH WITHHELD, APPROVAL NOT REWRITTEN. Each contract below is
      `status: approved` and frozen, and the census shows no implementation
      file and no run directory for it. Its predicted values are written in
      its own record and are fixed before execution. Its own out_of_scope
      text disclaims any curve, walk, solver, census or transfer. Running it
      therefore informs no decision, and no execution, executor launch or
      archive task for it is ranked ahead of doing nothing. Specification
      files, hypotheses, approval decisions and executor cards are immutable
      and are not edited. No hypothesis or experiment status changes. If one
      is run anyway (for example by an explicit /run naming it), every output
      is retained as written, and none is cited as evidence for its question
      or for any goal.
    membership_basis: >-
      Explicit ID only. Each id was decided by this Coordinator's reading of
      that row's own census fields (preregistered_quantity,
      preregistered_formula, scale_justification, out_of_scope, heuristic_under_test,
      run_dirs) in coordination/archives/TASK-20261005-2af213/template-census.json.
      The specification was also read where the census text did not state the
      values (see rule_9_fields.evidence). A title, area, signature (S1 to S4)
      or template match decided nothing. An id that a later reading cannot
      confirm is released by a superseding decision, never kept by pattern.
      Every id has heuristic_under_test null and goal_id null in the census.
    reading_notes:
      default: >-
        Unless noted below, the row's preregistered_quantity states its
        values, the preregistered_formula is integer or rational arithmetic
        on constants written in the record, and out_of_scope disclaims the
        cryptanalytic object the arithmetic is named after (curve, walk,
        solver, factor base, matrix, census, measured cost, or comparison
        with rho).
      EXP-BINSTD-3c94b7: >-
        Two-variable Boolean substitution. Every step (x0 = y0, x1 = y0 + y1,
        the product and the Boolean rule) is written in the formula. No 131-bit
        basis, normal basis or field construction is used (out_of_scope).
      EXP-BINSTD-c3090b: Primes and composites among the written integers 17 to 41. The counts 7 and 18 are written.
      EXP-BINSTD-d8b9bd: >-
        A 131-bit group order is written as an input. The checks are integer
        comparisons on it and on written hundredths. No group operation is
        performed, and any oracle, graph or large-prime search is out of
        scope. This reading did not identify which curve the order belongs
        to.
      EXP-BINSTD-d90273: The four-element stable sets at 131 and 163 are written. Only their sums are taken. No order is computed.
      EXP-CSIDH-b17aa9: Product and cross gaps of written integers. Any primality claim, sieve or quantum circuit is out of scope.
      EXP-DREG-c1800d: >-
        Specification read (first 60 lines). Every predicted rational is
        written in inputs: ln 2 series bounds, the sqrt(2/ln 2) cutoffs
        16986/10000 and 16987/10000, harmonic sums, and the omega-2 and
        omega-3 step factors. Any Macaulay matrix, rank profile or fall
        measurement is out of scope. This row is not a gate or a reading rule.
      EXP-ECDLP-047c8e: >-
        Specification read in full. It gives the binomial variances (r-1)/r
        for r in {2, 3, 4, 16}, the gaps 1/r, the r = 2 moment, and the
        "stored factor" 16/15. All are written in inputs.predicted. The
        stored factor is the reciprocal of 15/16, not an archived value.
        scale_relevance reads "No group and no transfer to a measured walk".
        Walk simulation and stored-experiment reinterpretation are out of
        scope. One internal inconsistency was noted and NOT edited:
        replication.independent_instances is 4, but maximum_runs is 2 and
        the replication_note refers to "the second run".
      EXP-ECDLP-1ab0e2: >-
        Specification read in full. It computes gcd(n, p - 1) at six written
        cells with p at most 17, and the trace identity p + 1 - (p - 1) = 2.
        The quotients, image sizes and traces are all written in inputs. Any
        pairing ladder, cubical coordinate or biextension is out of scope.
      EXP-ECDLP-fefe69: >-
        The bounds come from one written partition of 12. The F_5 subspace
        statement is a stated fact about indices, not an enumeration. Any
        character sum, Fourier coefficient or walk is out of scope.
      EXP-FROB-cb304d: Set comparison over the 19 residues modulo 19. The mismatch count 19 and the witness sets are written. Any abelian surface or Kummer ideal is out of scope.
      EXP-ICPERF-d02511: Hill index and variance of a written sample of ten costs. Any opening of an archived timing row is out of scope.
      EXP-ICPERF-6dcf75: The cycle count of two written graphs, as edges minus vertices plus components. Any relation matrix or cycle search on a curve is out of scope.
