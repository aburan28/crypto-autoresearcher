# =============================================================================
# DEC-20261005-98a823 -- DISPATCH HOLD, BY EXPLICIT ID, ON 104 MORE APPROVED,
# UNRUN CONTRACTS OF THE TWO-ROUTE LITERAL-ARITHMETIC TEMPLATE, read one record
# at a time. It extends DEC-20261005-138b51's withheld_contracts (47 ids) to the
# template rows outside RQ-ECDLP-002's admission rule. The ground is the RANKING
# RULE, not a question's admission rule. 22 template rows are EXCLUDED from the
# hold with a reason each and stay dispatchable. Revised once before archive
# (see pre_archive_revision): 105 -> 104 held, 21 -> 22 excluded.
# No specification, hypothesis, approval decision or handoff is edited. No status moves. No goal is touched.
# Nothing here says any of the arithmetic is wrong.
#
# NOT EFFECTIVE until TASK-20261005-2af213 commits it and its receipt verifies.
# =============================================================================
