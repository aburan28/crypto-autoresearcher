  # Pre-archive revision (recorded openly; this record was never committed in
  # its earlier form)
  # ---------------------------------------------------------------------------
  pre_archive_revision:
    trigger: >-
      The first attempt at TASK-20261005-2af213 STOPPED before commit. Nothing
      was staged or committed. Base was HEAD = origin/main = f2da001b72, and
      the merge was already up to date. The following passed: DP-1 to DP-3,
      parse, identifiers, validate_ledger (122 errors, the same set as main,
      none naming a staged path), the census re-run (173 / 47 / 126,
      identical row set), and H-a, H-b and H-c. The stop was check H-d. The
      report-only check H-e produced one material fact. All facts are as
      relayed by the dispatching session (MEASURED). This Coordinator did not
      observe them directly.
    ruling_H_d:
      hit: >-
        EXP-LHW-44a6ec is cited by experiments/EXP-LHW-b49bc6/specification.yaml.
        That contract has status failed_infrastructure, hypothesis
        H-LHW-e54b1b and goal_id null, under RQ-LHW-1877bb. The citations are
        predecessor_experiment_id, plus a predecessor_note that b49bc6 "is a
        different idea (79abd9) and does not re-run 44a6ec". There are also an
        excluded item, a control (ctl_not_44a6ec_rerun), a stopping rule and
        an invalidation rule, each forbidding a re-run of 44a6ec under b49bc6.
      ruling: >-
        EXP-LHW-44a6ec STAYS WITHHELD. Revisit condition (a) requires a parent
        that uses one of 44a6ec's values as a load-bearing input, which it
        cannot check by inspection. b49bc6 does the opposite: it names 44a6ec
        only to declare that it neither depends on nor re-runs it. No value of
        44a6ec enters b49bc6. This Coordinator checked that by searching
        experiments/EXP-LHW-b49bc6/specification.yaml for "44a6ec" and for
        44a6ec's predicted values 229824, 20640, 906192 and 775120. The
        search returns only lines 15, 18, 20, 78, 129, 130, 213 and 220, all
        non-dependence statements, and none of the values. The hit is therefore a non-load-bearing
        citation. This ruling covers exactly this (citing spec, cited id)
        pair. It is not a general relaxation of H-d.
      card_amendment: >-
        The stop rule of TASK-20261005-2af213 H-d is NOT loosened. The card
        now carries an explicit amendment, recorded in that card. A hit that
        exactly matches a pair ruled non-load-bearing in this block is
        recorded in the receipt and does not stop the archive. This block
        lists one such pair (EXP-LHW-b49bc6 citing EXP-LHW-44a6ec). Every
        other hit, including a new citation of 44a6ec from any other spec,
        still STOPS the archive.
    ruling_H_e:
      fact: >-
        EXP-BINSTD-fdd2d9 was executed off main. Branch
        cursor/run-binstd-fdd2d9-stages01-ed0c (tip efbbf66232, 2026-10-03,
        "release(TASK-20261003-c9329a): completed by
        executor-binstd-fdd2d9-stages01") adds 36 files under
        experiments/EXP-BINSTD-fdd2d9/: implementation, runs, stage0, stage1,
        trial-plan.json, trial-plan-v1.json and RESULTS.md. Branch
        cursor/review-binstd-fdd2d9-stages01-ed0c (tip 2cae8fc3cc) carries
        EV-BINSTD-1a0c8d and DEC-20261003-a0dec7. Neither is on main. A sweep
        of all origin refs over experiments/EXP-*/{runs,stage*,implementation}/**,
        trial-plan*.json and RESULTS.md found output for no other id of the
        original 105.
      ruling: >-
        EXP-BINSTD-fdd2d9 is REMOVED from withheld_contracts.ids, and its card
        TASK-20261003-aec29f from withheld_cards. It is added to
        excluded_from_hold as executed off main, as EXP-CERTBIN-ec9d83 is for
        execution on main. The hold's premise is "approved, unrun". That
        premise holds on main, but not for this contract as a research
        object, and holding an already-executed contract would disturb an
        evidence stack under repair. The fdd2d9 runs and evidence are left
        entirely to DEC-20261005-040d37 / TASK-20261005-b73fd8, and this
        decision rules nothing on them.
      card_amendment: >-
        TIGHTENED, NOT LOOSENED. TASK-20261005-2af213 gains stopping check
        H-f. For each withheld id, any implementation, runs, stage, trial-plan
        or RESULTS.md output under experiments/<id>/ on any origin ref STOPS
        the archive. This moves the sweep that found fdd2d9 from report-only
        to stopping.
    resulting_counts: >-
      Withheld 104 (BINSTD 39). withheld_cards 104. Excluded 22. Combined
      with DEC-20261005-138b51, 151 ids are held.
    procedure_note: >-
      The dispatching session re-runs every TASK-20261005-2af213 check from
      the top on the revised files before committing. The revision edits only
      this decision and its three cards, none of which had been committed.

