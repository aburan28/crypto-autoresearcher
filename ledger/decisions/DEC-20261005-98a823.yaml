        progress first"; docs/research-budget-policy.md).
      test_boundary: >-
        Nothing was run or re-computed here. This decision did not check that
        any predicted value is correct, and correctness is not its ground. The
        reading covers the record text named in evidence. It does not cover
        the questions' decision_target texts, the hypotheses, the approval
        decisions, or whether any other record cites one of these values.
      remaining_uncertainty: >-
        (i) Whether a parent design, decision or other specification uses one
        of these values as a load-bearing input. TASK-20261005-2af213 runs a
        report-only citation sweep of experiments/*/specification.yaml before
        committing, and a hit stops the archive. Other record families were
        not swept. (ii) Whether this reading missed cryptanalytic content in
        a row. That is the revisit condition (c) below. (iii) Before archive,
        the dispatching session swept every origin ref (MEASURED, see
        pre_archive_revision). Across all refs, none of the 104 ids has any
        implementation, runs, stage, trial-plan or RESULTS.md output. Lane
        claim side files were not swept, so a contract could still be claimed
        but unstarted. Any output that appears later is governed by the
        ruling's last sentence.
      successor_or_revisit: >-
        REVISIT and release an id by a superseding decision if any of the
        following holds. (a) A parent design or decision cites one of these
        values as load-bearing, and the value cannot be checked there by
        inspection. (b) The record's question has its decision_target amended
        to admit arithmetic-only fixtures as decision-changing work. (c) An
        independent Validator finds cryptanalytic content in a listed record
        that this reading missed. (d) A frozen protocol_amendment to a listed
        contract adds a measured object. SUCCESSOR: nothing here withdraws
        any question's ideation route. Each question listed in question_ids
        continues to take ideas through /propose-ideas under
        docs/inventor-protocol.md (object-first, with a proof_search_map
        where proof-oriented) and designs through /design-experiment. A new
        contract on any of these questions that names a measured object is
        ranked on its own merits, and nothing here pre-judges it.

