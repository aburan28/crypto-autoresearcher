  # ---------------------------------------------------------------------------
  # (2) Excluded from the hold. These stay dispatchable and are NOT deprioritised.
  # ---------------------------------------------------------------------------
  excluded_from_hold:
    effect: >-
      None of these rows is withheld, deprioritised or otherwise ruled on by
      this decision. Each is ranked on its own merits by whichever pass next
      considers it. An exclusion means this reading could not establish both
      (a) and (b) of the qualification_test. It does not mean the row is
      informative, and it does not mean the row is not.
    rows:
      - id: EXP-BINSTD-3c1175
        reason: Its formula counts points of the curve y^2 + xy = x^3 + 1 over the field of 4 elements. That is a curve enumeration.
      - id: EXP-BINSTD-8ce79d
        reason: >-
          Values are written in inputs, but the check computes the order of 2
          modulo eight primes including 131, cyclotomic values with cofactors,
          and Weil-number bounds. It is excluded for consistency with
          EXP-NISTBIN-fd4eb9 and EXP-BINSTD-b54ec9, under the conservative rule.
      - id: EXP-BINSTD-92ffc6
        reason: Distinct-point addition and doubling on a four-point group. That is a curve group-law computation.
      - id: EXP-BINSTD-fdd2d9
        reason: >-
          Added by pre_archive_revision. It was executed off main and is
          approved and unrun only on main. Branch
          cursor/run-binstd-fdd2d9-stages01-ed0c (tip efbbf66232, release
          TASK-20261003-c9329a) adds implementation, runs, stage0, stage1,
          trial plans and RESULTS.md. Branch
          cursor/review-binstd-fdd2d9-stages01-ed0c (tip 2cae8fc3cc) carries
          EV-BINSTD-1a0c8d and DEC-20261003-a0dec7, which are not on main. Its
          evidence stack belongs to the stranded BINSTD/CERTBIN repair under
          DEC-20261005-040d37 and TASK-20261005-b73fd8, so it is not a
          withholdable unrun contract. Like EXP-CERTBIN-ec9d83, it is
          excluded. This decision rules nothing on its runs or evidence. A
          fresh re-run under its executor card TASK-20261003-aec29f is not
          ranked by this decision. Whether one is wanted is for the b73fd8
          repair to establish.
      - id: EXP-BINSTD-b54ec9
        reason: >-
          The order of 2 modulo 163 (a binary-field extension degree), which
          fixes Frobenius-orbit structure. It is the same computation class as
          EXP-NISTBIN-fd4eb9 and is excluded under the conservative rule.
      - id: EXP-CERTBIN-ec9d83
        reason: Already executed. Status analyzed, with RUN-CERTBIN-664bda and RUN-CERTBIN-004f53 and a released claim. Not a withholdable contract.
      - id: EXP-DREG-2cfbfc
        reason: Evaluates the j-invariant of the model y^2 = x^3 + x + 1 and reduces it modulo five primes. This is a crater/floor gate on a named curve model, and the residues are not stated in the quantity.
      - id: EXP-DREG-32409e
        reason: Evaluates x^3 + ax + b at every element of F_11 to read 2-torsion roots, which is a curve-object computation. It also carries reading rules for later gauge-model rows.
      - id: EXP-DREG-4e87c0
        reason: A syzygy-gate decision table written to be applied to fall-count rows. This reading did not check whether a measurement lane uses it as its acceptance instrument, so it is unsure.
      - id: EXP-DREG-72a5a9
        reason: Lag-1 gate thresholds written for isogeny-walk degree series. As with 4e87c0, possible instrument use was not checked, so it is unsure.
      - id: EXP-DREG-bf6353
        reason: Transport reading rules written for later measured degrees. As with 4e87c0, possible instrument use was not checked, so it is unsure.
      - id: EXP-ECDLP-c9110e
        reason: Checks which translations commute with an involution on the rational points of one curve over F_11. That is an enumeration over a curve.
      - id: EXP-ECDLP-f7310e
        reason: Evaluates the curve defect and slope expressions at two points modulo 5, so the check operates on curve points.
      - id: EXP-FROB-6b2a00
        reason: Normal-basis construction and squaring in F_2[x]/(x^5 + x^2 + 1). This is computation in a specific field. The values are written in inputs, but the check is a field computation.
      - id: EXP-GFPN-9e09b4
        reason: >-
          A fold by z^5 = 3 at the prime 18446744069414584321, which is
          arithmetic in a specific degree-5 extension structure. The values
          are written in inputs. It is excluded under the conservative rule.
      - id: EXP-ICPERF-047c2d
        reason: >-
          The objective says "Check the group order" (130412, written in
          inputs), but the formula gives no closed-form route to it. A check
          may need a point count on an n = 17 curve, so this reading is unsure.
      - id: EXP-ICPERF-1fbf7d
        reason: x-counts, point counts and full group orders on the curve E over three factor-base cells. This is enumeration over a curve, and the quantity does not state the values.
      - id: EXP-NISTBIN-90a5c3
        reason: An irreducible-modulus census at degree 7, plus the reduction of bilinear monomials modulo that modulus. This is a census in a specific polynomial quotient ring.
      - id: EXP-NISTBIN-fd4eb9
        reason: Orders of 2 modulo five NIST degrees, plus the stable-subspace dimension sets. They fix factor-base structure of real binary fields. The values are in inputs, but the check computes them.
      - id: EXP-OAKLEY-d36694
        reason: Repeated squaring of the Oakley b values in F_2[u] modulo the named trinomials (m = 155 and 185). This is computation in deployed fields.
      - id: EXP-QSP-8bbc0c
        reason: >-
          Seven gcds against 2^131 - 1, the order of the multiplicative group
          of F_2^131. The integer arithmetic is tied to that field's
          structure, so this reading is unsure.
      - id: EXP-SEMBIN-332cd8
        reason: Boolean ANF degrees of the summation polynomial S_3 and of x1 times S_3. This is a computation on a cryptanalytic object, and the degrees are not stated in the quantity.
    count: 22

  # ---------------------------------------------------------------------------
  # (3) Auditable finding (AGENTS.md "Research-direction integrity")
  # ---------------------------------------------------------------------------
  auditable_findings:
    - id: F-2
      extends: DEC-20261005-138b51 F-1
      finding: >-
        F-1's stream is wider than F-1 recorded. The two-route literal-arithmetic
        contract template spans 19 areas and 173 frozen contracts designed
        2026-10-01 to 10-04 (MEASURED, dispatching session). 126 of these are
        outside F-1's 47-id list. On this decision's reading, 104 of the 126
        carry an outcome written in the record and disclaim every measured
        object. Every one of the 126 has an executor card. The /run selector
        ignores decisions, so 138b51's hold did not reach /run. In a /run pass
        on f2da001b72, 172 of the 233 worklist entries matched the template,
        and the top three were template contracts (EXP-GFPN-3d834b,
        EXP-ECDLP-ffae95, EXP-ECDLP-f33d1f) (MEASURED). The effect is the
        same as F-1's, at program scale: unqualified execution capacity is
        drawn first to contracts whose results are already written. This is
        recorded as an effect. No intent is inferred.
      authorship_fact: >-
        Reported by the dispatching session from git log, as an authorship
        fact only: since 2026-10-01, 259 specification commits are by "Cursor
        Agent" and 81 by "cursor[bot]". No intent is inferred from it, and no
        session is named beyond that.
      expected_worklist_effect: >-
        This is an inference, not a measurement. Once T-2 lands, both holds
        (47 + 104 = 151 ids) drop from unqualified /run selection. That leaves
        selectable the 21 excluded template rows that are still approved with
        no run on main, together with every non-template contract. Those 21
        include EXP-BINSTD-fdd2d9, which was executed off main (see
        pre_archive_revision). That 172 of 173 template rows were on the
        worklist fits EXP-CERTBIN-ec9d83 being analyzed. This decision did not
        check it.
      off_main_execution_note: >-
        EXP-BINSTD-fdd2d9 was executed on an unmerged branch on 2026-10-03,
        and its evidence also sits on an unmerged branch (MEASURED by the
        dispatching session). Because the /run selector reads only main, it
        would offer this contract again as unrun. The duplicate-run exposure
        that creates belongs to the stranded-stack repair
        (DEC-20261005-040d37, TASK-20261005-b73fd8). It is noted here, not
        remedied.
      remedy: >-
        This decision (hold by explicit ID), T-1 and T-2 in TASK-20261005-27ff15,
        and ONE bus pointer at archive time (NA-1). Stopping the generating
        loop at its source is an operator act. It is reported to the user and
        is not ordered by any record here.

