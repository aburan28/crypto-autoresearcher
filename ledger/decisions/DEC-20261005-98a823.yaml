  rationale:
    - >-
      THE RANKING DUTY HOLDS ACROSS EVERY AREA. 138b51 could rest on one
      question's admission rule. These rows span 23 questions, so the ground
      is the rule that binds every dispatch: a task must be ranked ahead of
      doing nothing. A contract whose outcome is written in its own record
      reduces no uncertainty by running.
    - >-
      PER RECORD, NOT PER PATTERN. The template signature found the rows, but
      it decided nothing. 22 of 126 rows share the template and are not held.
      Their checks compute in a curve, a specific field, a cryptanalytic
      polynomial or a gate instrument, or this reading was unsure, or the row
      has already been executed (EXP-CERTBIN-ec9d83 on main,
      EXP-BINSTD-fdd2d9 off main). Excluding when unsure costs nothing: an excluded row stays
      ranked work.
    - >-
      APPROVALS ARE NOT REWRITTEN. As in 138b51, withholding dispatch is a
      ranking act within Coordinator authority. Revoking 104 approvals would
      mean superseding 104 contracts for no information gain.
    - >-
      THE HOLD MUST REACH THE SELECTOR, VISIBLY. A decision the /run worklist
      cannot read does not govern /run. T-2 makes the selector read explicit
      IDs from committed decisions. It honours a block only when the rule-9
      fields are present, it lets a later decision release an id, and it
      always reports what it dropped and why.

