coordinator_decision:
  id: DEC-20260822-badc59
  goal_id: GOAL-DREG-001
  batch_id: BATCH-006
  question_id: RQ-DREG-001
  recorded_at: '2026-08-22'
  decided_at: '2026-08-22'
  decided_by: coordinator

  id_provenance: >-
    PRE-ALLOCATED BY THE DRIVING SESSION with `python3 tools/allocate_id.py
    --next coordinator_decision --date 20260822` and verified free with
    `--check`. THE COORDINATOR SUBAGENT THAT WROTE THIS BODY HAS NO SHELL and
    minted no identifier; it ran no git command, no allocator, no validator, no
    renderer and no probe. Every command output cited below is attributed to the
    driving session and is marked as such at the point of use.

  authority: >-
    ledger/goals/GOAL-DREG-001.yaml `next_action` as it stood before this act,
    which commissions exactly this ruling in its own words -- "RESOLVE THE
    BATCH-006 REVIEW-TIER BLOCK ON TASK-20260812-963ec3 -- serve that one
    validator verdict, or record the stop." This record takes the first limb.

  context: >-
    BATCH-006 of GOAL-DREG-001 has one live gate. TASK-20260812-963ec3, an
    independent Validator verdict on the frozen final-batch ranking
    (coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260812-f6df51/ranking.yaml
    and lane-contract.yaml, snapshotted by TASK-20260812-23e086 at commit
    1aa90d9c08d0b0ddb78f84283a6099942dffa85a, receipt verification_status
    content_verified), has been carried as BLOCKED since 2026-08-15 on the stated
    ground that its `inference` block -- policy review-adversarial,
    reasoning_effort xhigh, fallback_allowed false, degraded_allowed false,
    independent_session_required true -- could not be served. That ground is
    recorded in three places, in progressively more general terms - in
    DEC-20260815-6b806c `rationale`/`runtime_provenance`, in
    ledger/goals/GOAL-DREG-001.yaml `next_action` and in the BATCH-006 control
    plane (dispatch_queue.json state_note for 963ec3, batch.yaml
    wave1_status_20260819). The most general form, in the goal head, asserts that
    "a fresh same-model subagent is not a substitute either, because it satisfies
    independent_session_required and NOT the xhigh floor." THIS DECISION RULES ON
    THAT PREMISE.

  decision: supersede

  decision_scope: >-
    SUPERSEDES ONE STATED REASON AND AUTHORIZES ONE ALREADY-COMMISSIONED REVIEW
    TASK. It (1) supersedes, by reference and without editing anything, the
    generalized claim that a fresh subagent cannot serve the xhigh floor of
    review-adversarial on this runtime; (2) finds TASK-20260812-963ec3 SERVABLE
    as written by a fresh `validator` subagent under the `claude_code` runtime,
    in an independent session, at reasoning_effort xhigh, natively; and (3)
    authorizes that dispatch under the conditions in `dispatch_conditions`. The
    verb is `supersede` and NOT `approve` on purpose - THIS DECISION APPROVES NO
    EXPERIMENT AND AUTHORIZES NO RUN. The ranked winner (item B, the
    CTRL-013-OPTIONAL-RERANK one-column deletion mutation) remains NOT AUTHORIZED
    TO RUN, exactly as the goal head and the batch control plane already record.

  ruling: >-
    (b) THE BLOCK RESTS ON A MISTAKEN PREMISE. TASK-20260812-963ec3 IS SERVABLE
    ON THIS RUNTIME by a fresh `validator` subagent at reasoning_effort xhigh in
    an independent session. This is NOT a fallback, NOT a downgrade and NOT a
    degraded acceptance - each of those would require machinery the handoff
    forbids (`fallback_allowed: false`, `degraded_allowed: false`) and a
    Coordinator `inference_amendment`, and NONE IS USED, REQUESTED OR IMPLIED
    HERE. The finding is that the REQUESTED POLICY IS NATIVELY SERVED - the
    binding table that the harness enforces on itself already carries
    review-adversarial at xhigh for the validator role under `claude_code`.

  rationale:
    - >-
      R-1. WHAT THE HANDOFF ACTUALLY DEMANDS. ledger/handoffs/TASK-20260812-963ec3.yaml
      `inference` reads exactly - policy review-adversarial, reasoning_effort
      xhigh, fallback_allowed false, degraded_allowed false,
      independent_session_required true. It demands FOUR things - the named
      policy, an xhigh floor, no substitution of any kind, and an independent
      session. IT DOES NOT DEMAND A DISTINCT RESOLVED MODEL, and no field in it
      can be read that way.
    - >-
      R-2. WHAT THE POLICY DEMANDS. orchestration/model-policies.yaml
      `review-adversarial` requires reasoning_effort xhigh (floor and request
      both), tool_use, structured_output, min_context_tokens 180000,
      min_output_tokens 16000, with independent_session_required true,
      may_change_official_state false, fallback_policy null. It is NOT
      `degradable: false` - only `review-breakthrough` carries that flag, a
      distinction the goal head's own preserved text got right. AGENTS.md "Model
      policy" line 30 states the requirement in one sentence - "Reviewer,
      Validator, and Red Team - `review-adversarial`, which requires `xhigh`
      reasoning and an independent session." xhigh AND an independent session.
      NOT a distinct resolved model.
    - >-
      R-3. WHERE MODEL DISTINCTNESS ACTUALLY LIVES, AND WHY IT DOES NOT REACH
      HERE. Pairwise-distinct `resolved_model_id` values are required by AGENTS.md
      rule 13, the GOAL CLOSURE QUORUM, and by nothing else in the contract. That
      rule is SUSPENDED (AGENTS.md "Goal closure quorum - SUSPENDED"; CLAUDE.md
      non-negotiable rule 8), and even when in force it governs moving a `GOAL-*`
      to `completed` - not ordinary review. TASK-20260812-963ec3 closes no goal,
      records no attestation, and moves no status. Importing the quorum's
      distinctness test into an ordinary validator verdict would make
      review-adversarial unservable on any single-backend deployment, which is
      precisely the unreachability the suspension was written to remove.
    - >-
      R-4. THE MEASURED FACT THAT CONTRADICTS THE RECORDED REASON. THIS IS THE
      DRIVING SESSION'S MEASUREMENT, NOT THIS SUBAGENT'S - `python3
      tools/check_runtime_bindings.py --list` prints, for the validator role -
      policy review-adversarial, effort xhigh, and under runtime `claude_code`
      the binding .claude/agents/validator.md with effort sourced from the AGENT
      FILE and the tool surface Read, Grep, Glob, Write, Edit, Bash, SendMessage.
      THE COORDINATOR SUBAGENT INDEPENDENTLY READ THAT AGENT FILE - its
      frontmatter carries `effort: xhigh` with the comment "Derived from
      roles.yaml -> default_policy: review-adversarial -> reasoning_effort ...
      Change the policy, not this line." So on this runtime a fresh validator
      subagent SERVES the xhigh floor from its own binding, and
      tools/check_runtime_bindings.py FAILS THE BUILD if that ever drifts from
      the policy. THE GOAL HEAD'S STATED REASON - that such a subagent satisfies
      independent_session_required and NOT the xhigh floor - IS FACTUALLY WRONG
      ON THIS RUNTIME.
    - >-
      R-5. HOW THE MISTAKEN PREMISE AROSE, STATED FAIRLY. It is an
      OVER-GENERALIZATION OF A TRUE SESSION-SPECIFIC FACT, not an invention.
      DEC-20260815-6b806c `rationale` and `runtime_provenance` record the actual
      2026-08-15 condition - "the session's subagent layer is pinned to the dead
      openai/qwen3.6:27b llama-cpp endpoint (:8080), and the only live model
      (vllm/qwen3.8-27b at :8787) cannot honestly reach the xhigh floor." THAT
      WAS TRUE OF THAT SESSION AND IS NOT DISPUTED. The frozen artifacts confirm
      the same environment from the producer side - ranking.yaml declares
      `inference.resolved_model_id: qwen3.6:27b (via opencode.json / llama-cpp
      localhost:8080)` and lane-contract.yaml declares "qwen3.6:27b (single local
      model; no distinct backend this session)". What the goal head then wrote
      was the general proposition that a fresh same-model subagent cannot serve
      xhigh. THAT GENERALIZATION IS RUNTIME-DEPENDENT AND FALSE HERE - a
      subagent's effort is not a property of subagents, it is a property of the
      runtime's binding, and CLAUDE.md "Model policy note" plus
      docs/inference-backends.md "Per subagent, where the runtime can express it"
      both state that `claude_code` expresses effort PER SUBAGENT via frontmatter
      while `codex_cli` and `opencode` cannot and take it from `adapter env` at
      launch. The 2026-08-15 session was on the runtime that cannot; this one is
      on the runtime that can.
    - >-
      R-6. THE HARNESS'S OWN A-FORTIORI ARGUMENT. CLAUDE.md "Model policy note"
      records that the sibling bindings `validator-breakthrough` and
      `red-team-breakthrough` exist because "Without them `review-breakthrough` -
      which is `degradable: false` - could not be honoured on this runtime at
      all." The harness therefore treats a subagent binding as THE mechanism by
      which a review policy is honoured on `claude_code`, including for the one
      policy that may never be degraded. If a subagent binding can honour
      review-breakthrough at `max`, it can honour review-adversarial at `xhigh`.
    - >-
      R-7. INDEPENDENT SESSION. Two governance gates, both satisfied.
      docs/inference-backends.md states them - "A policy with
      `independent_session_required: true` resolves only when the caller asserts
      an independent session, and it refuses when the assigned agent is the agent
      that originated the claim." GATE ONE - the campaign already ruled that a
      fresh validator subagent is a genuine independent session for this policy,
      in the goal record's own preserved text at
      `next_action_verbatim_20260815_b006_open` item (a) - "a new subagent
      session is a genuine independent session for the purposes of this policy",
      on the ground that it is a new agent with no producer context and a
      distinct tool surface per orchestration/roles.yaml. THAT FINDING IS NOT
      DISTURBED BY THIS DECISION; it is affirmed, and it was never the part of
      the block that was in dispute. GATE TWO - the originating agent is the
      producer of ranking.yaml and lane-contract.yaml, i.e. the coordinator
      session that executed TASK-20260812-f6df51 on 2026-08-15 under
      resolved_model_id qwen3.6:27b. A validator subagent dispatched now is not
      that agent, holds none of its context, and reviews frozen committed bytes.
    - >-
      R-8. AND THE DISTINCTNESS TEST IS MET ANYWAY, THOUGH NOTHING TURNS ON IT.
      Recorded because it disposes of the strongest form of limb (a) that the
      task framing offers - "the real requirement is model distinctness rather
      than the effort floor." Even under that reading the block dissolves - the
      producer's own frozen artifacts declare resolved_model_id qwen3.6:27b,
      while a validator subagent under this runtime resolves to the model serving
      this Claude Code session, which is a different model. THE REVIEW WOULD BE
      CROSS-MODEL WITH RESPECT TO THE PRODUCER. This is stated as a disposal of
      an alternative ground, NOT as a claim that distinctness was required, and
      NOT as independent corroboration of anything - one review is one review.
    - >-
      R-9. NO ESCAPE ROUTE IS USED. Amazon Bedrock was not selected, configured,
      probed or contacted at any point in this ruling, and no ruling of mine may
      relax AGENTS.md rule 16. The driving session reports that `python3 -m
      orchestration.adapter doctor --probe` resolves NO API-backed backend -
      anthropic, fireworks, fireworks-anthropic, openai, openrouter, zai and
      zai-anthropic all lack credentials, and `local` needs none but FAILED its
      model probe with connection refused at http://localhost:8000/v1/models.
      THAT PROBE RESULT IS ACCEPTED IN FULL AND CHANGES NOTHING HERE, because it
      measures the adapter's API-keyed backend catalog and not the runtime this
      session is executing on. AGENTS.md rule 16 expressly contemplates the
      difference - "authenticated direct Codex and Claude Code sessions whose
      resolved provider is not Bedrock" are allowed. The subagent layer of an
      authenticated Claude Code session is such a runtime; its provider is not
      Bedrock; and its availability is demonstrated by the fact that this
      Coordinator subagent is executing.
    - >-
      R-10. WHAT REMAINS TRUE FROM THE BLOCK, AND IS CARRIED FORWARD UNWEAKENED.
      Every prohibition attached to the block stands exactly as written - do not
      fabricate a PASS; do not record an attestation that was not obtained; do
      not present a single-model review as independent corroboration under any
      name; an unserved review is an INFRASTRUCTURE STOP and never a negative
      result about the ranking, the lane contract, or d_reg (AGENTS.md rule 5,
      CLAUDE.md rule 3). This decision removes a mistaken factual premise. IT
      REMOVES NO SAFEGUARD.

  what_is_superseded:
    superseded_proposition: >-
      That a fresh same-model subagent cannot serve TASK-20260812-963ec3 because
      it satisfies independent_session_required and NOT the xhigh floor, and more
      generally that no reachable backend can serve the review tier of BATCH-006.
    superseded_scope: >-
      SUPERSEDED AS A GENERAL PROPOSITION ABOUT THIS RUNTIME AND AS THE GROUND OF
      THE BLOCK. NOT superseded as a description of the 2026-08-15 session, where
      it was true and remains true.
    records_carrying_it_that_are_NOT_EDITED:
      - record: ledger/decisions/DEC-20260815-6b806c.yaml (rationale item 2, runtime_provenance)
        why_not_edited: >-
          Committed and IMMUTABLE (AGENTS.md rule 4, CLAUDE.md rule 2). It is
          superseded BY REFERENCE by this record and not overwritten. ONLY the
          review-tier infeasibility recital is superseded, and only as a general
          proposition - that decision's OPERATIVE ACT, the supersession of the
          C2 chain by reference on EV-DREG-4500cd, IS UNTOUCHED, as are its
          decision_scope, its `verdicts` of NOT_OBTAINED (which were accurate and
          remain accurate - no verdict was obtained then), its
          knowledge_promotion, its merge_note and its standing.
      - record: coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260812-f6df51/lane-contract.yaml (independence_note)
        why_not_edited: >-
          FROZEN AND BYTE-BOUND - it is one of the two source paths of the
          TASK-20260812-23e086 snapshot receipt at commit
          1aa90d9c08d0b0ddb78f84283a6099942dffa85a, verification_status
          content_verified. Editing it would invalidate an accepted archive and
          would also be the Coordinator tampering with the very artifact the
          validator is about to review. Its independence_note is superseded here
          by reference; the validator reviews the frozen bytes as they stand.
      - record: coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260812-f6df51/ranking.yaml
        why_not_edited: >-
          Same binding, same reason. NOT ONE BYTE OF THE ARTIFACT UNDER REVIEW IS
          TOUCHED BY THIS DECISION.
    records_carrying_it_that_ARE_amended_by_appending:
      - record: ledger/goals/GOAL-DREG-001.yaml
        how: >-
          The `next_action` is the record's MUTABLE head, and it is replaced -
          with the prior text preserved VERBATIM AND UNEDITED under a sibling key
          per this record's own established convention. Nothing is deleted.
      - record: coordination/goals/GOAL-DREG-001/batches/BATCH-006/dispatch_queue.json
        how: >-
          Control-plane state, refreshed by appending - TASK-20260812-963ec3
          moves from state `blocked` to `queued` with its prior state_note
          preserved verbatim under a sibling key, and an objective amendment is
          appended. Precedent - the 2026-08-19 control-plane refresh
          (TASK-20260812-0dead9) did exactly this.
      - record: coordination/goals/GOAL-DREG-001/batches/BATCH-006/batch.yaml
        how: >-
          A `review_tier_ruling_20260822` key is APPENDED. The
          `wave1_status_20260819` entry for TASK-20260812-963ec3 is left exactly
          as written and is superseded by that appended key.

  what_this_decision_is_not:
    - >-
      NOT A FALLBACK. `fallback_used: false`. No `fallback_policy` was consulted;
      review-adversarial declares `fallback_policy: null` and the handoff sets
      `fallback_allowed: false`. Nothing was substituted for anything.
    - >-
      NOT A DOWNGRADE AND NOT A DEGRADED ACCEPTANCE. `degraded_requirements: []`.
      No requirement of review-adversarial is unmet, so there is no gap to record
      and no `inference_amendment` to sign - which is fortunate, because
      `degraded_allowed: false` on this handoff means none could be signed.
    - >-
      NOT A REVIEW. This Coordinator did not, and may not, adjudicate the ranking
      or the lane contract. It read ranking.yaml (rows A and B) and
      lane-contract.yaml in full to establish WHAT IS BEING REVIEWED AND BY WHOM,
      and it reaches no verdict on either. The verdict is the Validator's alone,
      and no part of this record may be cited as one.
    - >-
      NOT AN EXPERIMENT APPROVAL AND NOT A RUN AUTHORIZATION. Item B remains
      unauthorized to run. Wave 2 remains unappended.
    - >-
      NOT A STATUS CHANGE. H-DREG-001 stays `inconclusive` (DEC-20260717-002).
      H-SIG-001 untouched. GOAL-DREG-001 stays `active`.
    - >-
      NOT A CLOSURE, NOT AN ATTESTATION, AND NOT A CHECKPOINT OF A CLOSED BATCH.
      No attestation was obtained and none is recorded. No `checkpoints` entry is
      appended to the goal record, because a `checkpoints` entry records a batch
      CLOSURE and BATCH-006 IS NOT CLOSED.
    - >-
      NOT A BUDGET ACT. campaign_budget is untouched. maximum_batches remains
      null (UNBOUNDED) per DEC-20260814-404d63 as realized on the goal record on
      2026-08-15; nothing here is closed, paused or narrowed on a budget
      rationale, and nothing here raises a budget.
    - >-
      NOT EVIDENCE ABOUT d_reg IN ANY DIRECTION. This is a control-plane and
      review-tier ruling with `scientific_effect: none`.

  dispatch_authorized:
    task_id: TASK-20260812-963ec3
    role: validator
    runtime: claude_code
    binding: .claude/agents/validator.md
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    effort_source: >-
      AGENT FILE (`effort: xhigh` in the frontmatter), reported by the driving
      session's `tools/check_runtime_bindings.py --list` as "effort: agent file"
      and read directly by this Coordinator in the file itself.
    fallback_used: false
    degraded_requirements: []
    independent_session: true
    originating_agent_named: >-
      The coordinator session that executed TASK-20260812-f6df51 on 2026-08-15,
      declaring resolved_model_id qwen3.6:27b in both frozen artifacts. The
      assigned validator is not that agent.
    contract_frozen_at: >-
      ledger/handoffs/TASK-20260812-963ec3.yaml as committed, together with the
      queued handoff copy in
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/dispatch_queue.json.
      NEITHER IS AMENDED BY THIS DECISION - the task is dispatched exactly as
      written, with its five constraints SC-1..SC-5, its budget
      (wall_clock_seconds 3600, memory_gb 2, maximum_runs 1 - no null field), its
      single deliverable and its completion gate unchanged.

  dispatch_conditions:
    - >-
      DC-1 MECHANICAL DEPENDENCY GATE, NOT DISCHARGED BY THIS RULING AND NOT A
      REVIEW-TIER MATTER. TASK-20260812-963ec3 `depends_on` TASK-20260812-23e086
      and TASK-20260812-f6df51. f6df51 is `completed`; 23e086 is `blocked`
      because the completed-archive gate needs a `path_sha256` covering EVERY
      archive AND source artifact path, including the receipt's own digest, and
      the 2026-08-19 session had no hasher. The route is already recorded in that
      task's own state_note - binding_mode `content_first` with a path_sha256
      over all three paths (ranking.yaml, lane-contract.yaml, and the receipt),
      re-hashed AT HEAD by a shell-capable session; the same for
      TASK-20260812-b1241e over its five paths. NEVER by re-running either
      archival task, whose receipts are immutable and already written. THIS
      COORDINATOR HAS NO SHELL, COMPUTED NO DIGEST, AND CHANGED NEITHER TASK'S
      STATE - inventing a digest is forbidden (AGENTS.md rule 9).
    - >-
      DC-2 RENDER GATE. Re-render the queue - `python3 tools/research_dispatch.py
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/dispatch_queue.json
      --output ... --report ... --repo-root <worktree>` - and require exit 0 with
      all ten dispatch gates true AND TASK-20260812-963ec3 appearing under Ready
      Tasks before dispatching it. STATED AS AN OBSERVATION, NOT A CLAIM - a
      generated dispatch plan already exists in the working tree at
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/dispatch_plan.md (a
      gitignored, derived artifact; THIS COORDINATOR READ IT AND DID NOT PRODUCE
      IT). It reports all ten gates passed, no ready tasks, and 963ec3 deferred
      for reason `task_marked_blocked`. After the state change made by this act
      the deferral reason is expected to become
      `dependency_not_completed:TASK-20260812-23e086:blocked` until DC-1 is
      discharged. THAT IS THE HONEST REMAINING GATE and it is mechanical, not
      inferential.
    - >-
      DC-3 NO PRIOR-DISCLOSURE IN THE DISPATCH PROMPT. The dispatch prompt for
      TASK-20260812-963ec3 MUST NOT transmit `review_plan.coordinator_prior` or
      `review_plan.expected_findings`, MUST NOT otherwise state what this
      Coordinator expects the review to find, and MUST NOT add
      ledger/decisions/DEC-20260822-badc59.yaml or the review-plan artifact to
      the task's read_scope. WHAT MAY BE TRANSMITTED - the joint labels J1..J5
      and their statements, which are deliberately written as a one-to-one
      restatement of the committed card's own constraints SC-1..SC-3 and its
      completion gate and add NO obligation the frozen contract does not already
      carry; transmitting the card alone therefore conveys every joint. THIS
      CONDITION IS NOT DECORATIVE - the immediately preceding correction in this
      session, CORR-20260822-6ce623, records at severity HIGH (procedure
      deviation PD-1, via DEC-20260822-40bf14 F-13) a dispatch prompt that
      disclosed a blind re-derivation's expected answer, and records a second
      divergence in which a dispatch prompt narrowed a committed write_scope.
    - >-
      DC-4 THE PROMPT MAY NOT ENLARGE OR NARROW THE COMMITTED SCOPE. The
      validator's write_scope is exactly
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/reviews/TASK-20260812-963ec3/
      and its single artifact is review-report.yaml. SC-4 stands - it NEVER
      modifies ranking.yaml or lane-contract.yaml; corrections go in the report.
      A divergence between the prompt and the committed card is a DEFECT TO BE
      RAISED, not a scope to be obeyed (CORR-20260822-6ce623 correction_1,
      ERROR 2).
    - >-
      DC-5 THE REPORT DECLARES ITS OWN INFERENCE HONESTLY. The review report
      records requested_policy review-adversarial, reasoning_effort xhigh,
      effort_source agent-file binding, fallback_used false,
      degraded_requirements [], independent_session true, the originating agent
      named, and `resolved_model_id` with `model_verified` marked as a SELF-REPORT
      AND NOT A PROBE RESULT. That marking is required because no API-backed
      backend resolves for `adapter doctor --probe` (see R-9) and because
      `probe-codex-session` is Codex-CLI-specific with no `claude_code`
      equivalent. AN UNPROBED IDENTIFIER IS A PROVENANCE FACT TO DISCLOSE, NOT A
      DEGRADED REQUIREMENT - the policy's `requires` block says nothing about
      probes, and every requirement in it is met.
    - >-
      DC-6 SC-2 ABSENCE IS AN OBSERVATION, NOT A FAILURE. The C2 reproduction
      target lives on the NEVER-PUSHED local branch
      coordinator/goal-dreg-001-b3c2-b4, and DEC-20260815-6b806c's own merge_note
      states that "later sessions lacking the branch cannot reproduce the cited
      state". The handoff already anticipates this - "report what you observe,
      including if the branch is absent." If the branch or the blob is
      unreachable from this worktree, the validator RECORDS THAT AS AN
      INFRASTRUCTURE OBSERVATION with the exact command and its exact output, and
      it is NEVER evidence about d_reg, about C2, or about the honesty of the
      producer (AGENTS.md rule 5). It does not by itself force REJECT; the
      validator says what it could and could not check.
    - >-
      DC-7 THE VERDICT IS NOT PRE-JUDGED AND THE DOWNSTREAM PATH IS ALREADY
      WRITTEN. PASS, REVISE and REJECT are all live outcomes. On REVISE or
      REJECT, TASK-20260812-4177ac's own committed constraint governs - "do NOT
      file the decision as-is: record the block and a scoped repair next_action
      instead of the lane dispatch." DEC-20260812-f56a44 MUST NOT BE FILED AS
      REVIEWED unless and until a verdict exists that supports filing it.
    - >-
      DC-8 ONE REVIEW IS ONE REVIEW. Whatever the verdict, it is a single
      validator opinion from a single session and may never be presented, in the
      ranking decision or anywhere else, as independent corroboration by more
      than one reviewer, nor as an attestation, nor as satisfying any part of the
      (suspended) closure quorum.

