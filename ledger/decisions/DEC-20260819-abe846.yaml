    - ledger/decisions/DEC-20260808-7ed316.yaml

  rationale:

    - id: R1
      claim: >-
        The 7606-character next_action directs exactly one thing, and this
        reconciliation does not disturb it.
      basis: >-
        The field was read whole as a folded block scalar, not searched by
        line. Its operative closing sentence is "EXACTLY ONE NEXT ACTION
        REMAINS: select and scope one of the three queued items (or the
        optional fourth) as the next batch's dispatch." The three items are
        (1) EV-SSI-59f7a2's missing SC-1/SC-3 conditionality, (2)
        EXP-WESOVOW-001/cost_model.py's line-236 anchor bug, (3) resolving
        CORR-20260808-c792f8's P=512 anchor ambiguity by rederiving that
        crossover from RUN-WESOVOW-001/raw-result.json's own opt values. The
        optional fourth is verifying Section 3's line-171 GOAL-P13-001 claim.
        The passage the reported excerpt truncated contains the substance a
        line-scoped search would have inverted: it CLOSES the previously
        queued "item 3" as MIS-SCOPED (retracted, formally corrected in
        CORR-20260808-ea85c0, discharged by a concurrent session's
        DEC-20260808-0de8b2 Section 2 addendum), and it declares
        CORR-20260808-c792f8's P=512 crossover and its w=2^80 sign NOT
        CITATION-ELIGIBLE while ruling P=384/576/768 eligible. A search unit
        of one line would have reported "citation-eligible" for P=512 by
        matching the surrounding eligible-list sentence. Read whole, the field
        also states BATCH-5a3d0a CLOSED OUT and that no completion criterion
        is met or approached.

    - id: R2
      claim: current_batch_id BATCH-5a3d0a is correct and was not changed.
      basis: >-
        The committed goal_head_audit rules GOAL-SSI-001 HEAD_CURRENT at
        evidence_strength STRONG, on the ground that BATCH-5a3d0a is the
        topologically newest of 54 batch directories, is deliberately the one
        batch with no checkpoint shard, and is named by next_action itself.
        That ruling was produced by a session that could run git; this session
        could not, and adopts it as cited evidence rather than re-deriving it.

    - id: R3
      claim: >-
        dispatch_queue_path null is the CORRECT value, not an unrepaired
        defect, and it stays null.
      basis: >-
        Four independent grounds. (a) BATCH-5a3d0a has no dispatch_queue.json
        and never had one -- its work was Coordinator direct authorship of two
        corrections per its own closeout.md -- so there is no queue for the
        head to name. (b) The fifty committed queue files under this goal all
        belong to batches closed by a committed write-once checkpoint or
        superseded; naming any of them advertises finished work as
        dispatch-ready, which is the GOAL-AES-001 failure mode. (c) The same
        null convention is carried by GOAL-SSIQ-001, GOAL-ENDO-001 and
        GOAL-AES-002 per the committed queue_state_audit's coverage_per_goal.
        (d) The only correct repair is a NEW batch with a NEW queue, which a
        reconciliation may not open. The cost of null is stated plainly and
        not minimised: while it is null the harness renders nothing for this
        goal, so the goal cannot be worked until a successor batch is opened.

    - id: R4
      claim: >-
        Two distinct defect populations are present and are NOT conflated.
      basis: >-
        POPULATION S, SCHEMA. BATCH-043 tasks[3] (TASK-20260803-fe7f69) and
        BATCH-045 tasks[4] (TASK-20260804-20d15c) declare an empty
        artifact_paths list; BATCH-044 tasks[3] (TASK-20260804-6e1ce4) is also
        empty; BATCH-044 tasks[0] (TASK-20260804-946415) declares two
        trailing-slash directory paths rather than exact files. These three
        queues therefore do not validate and render nothing, so they carry
        ZERO dispatch hazard. POPULATION T, STALE STATE. Twenty-five entries
        across six batches are recorded queued; the committed queue_state_audit
        reports for GOAL-SSI-001 a verdict profile of ARTIFACTS_PRESENT 17,
        ARTIFACTS_ABSENT 5, NO_DECLARED_ARTIFACTS 3. These are different
        defects with different repairs: a schema defect is repaired by a
        superseding queue authored with the dispatcher tooling, never by
        editing a declared artifact_paths list; a stale state is repaired by a
        justified state transition. No count from one population was reported
        as belonging to the other.

    - id: R5
      claim: >-
        A one-entry discrepancy between two phantom counts is recorded, not
        silently averaged.
      basis: >-
        The dispatching session reported 16 phantom entries for GOAL-SSI-001
        (per-batch 2/1/3/4/5/1). The committed queue_state_audit reports 17
        ARTIFACTS_PRESENT (per-batch 2/2/3/4/5/1). The single differing entry
        is BATCH-044 TASK-20260804-946415, whose declared paths include two
        directories rather than exact files; the audit's own method_note says
        it reports a declared directory as committed when at least one
        committed file exists under it, and names
        runs/prime_verification.txt for this entry. The most likely
        explanation is that the two tools differ on directory-valued declared
        paths. This session could run NEITHER tool and does not claim to have
        resolved it. Nothing was transitioned on the basis of either count.

    - id: R6
      claim: >-
        BATCH-d15fe0 is abandoned and superseded, and its three open cards are
        terminated as cancelled, not completed.
      basis: >-
        The committed archive
        coordination/goals/GOAL-SSI-001/batches/BATCH-869a4a/tasks/TASK-20260804-604668/incident_repair.md
        records that this batch's control-plane snapshot commit
        c1679c48539c235364629b53cf4ae334b206d123 was REJECTED by the dispatch
        verifier on a commit-message identifier failure, classifies that as an
        evidence-integrity failure and expressly not any kind of negative
        research evidence, states that "BATCH-d15fe0's planned proposal chain
        remains unexecuted and must not be treated as eligible", and directs
        that a newly-identified fresh ideation control plane be opened and
        BATCH-d15fe0 not be used as authority. BATCH-f91235 is that
        replacement: all four of its cards are recorded completed and
        TASK-20260804-acdc95 produced IDEA-20260804-170692,
        IDEA-20260804-4c9ac0 and IDEA-20260804-84328c. The three proposal IDs
        BATCH-d15fe0's own card declared were never minted. cancelled rather
        than completed is deliberate: TASK-20260804-828d37's snapshot exists
        but was verifier-rejected, so per AGENTS.md rule 7 no accepted archive
        exists; TASK-20260804-1bb7f0 and TASK-20260804-52732e were never
        executed at all. BATCH-d15fe0 now holds no non-terminal card and
        offers the renderer nothing.

    - id: R7
      claim: >-
        BATCH-284f63 and BATCH-b3c87f are phantom and are this goal's only
        live dispatch hazard, and NO state in them was transitioned.
      basis: >-
        Both queues parse and render. All nine of their entries are recorded
        queued while all nine are ARTIFACTS_PRESENT in the committed
        queue_state_audit, and both batches are closed by committed write-once
        checkpoints (BATCH-b3c87f under DEC-20260806-a00a28 / EV-SSI-455241,
        outcome reject_pending_repair; BATCH-284f63 under DEC-20260806-e2a6fa
        / EV-SSI-a42460, outcome accept_with_required_amendment). The hazard
        is concrete: the renderer offers TASK-20260806-55cf1f (write_scope
        experiments/EXP-SSI-9b542d/, ledger/hypotheses/) and
        TASK-20260806-976fd5 (write_scope
        ledger/hypotheses/H-SSI-7fe2bf.yaml, experiments/EXP-SSI-697354/) as
        ready, pointing a fresh producer at a frozen experiment contract and a
        live hypothesis. No transition was nevertheless made, for two reasons
        that are findings rather than caution. FIRST, the four archive cards
        (TASK-20260806-b03b21, TASK-20260806-e80052, TASK-20260806-274d8a,
        TASK-20260806-91f36a) cannot be moved to completed at all without
        archive.commit_sha and a path_sha256 map covering every archive and
        source artifact -- tools/research_dispatch.py raises on a completed
        archive task missing either -- and this session could compute no hash
        and must not invent one. Both BATCH-284f63 receipts carry commit_sha
        null and verification.status "pending_post_commit", so the archive
        chain was never post-commit verified and the missing data is genuinely
        missing, not merely unread. SECOND, completing only the non-archive
        cards would make the archive cards eligible instead, and their
        write_scopes are ledger/decisions/DEC-20260806-a00a28.yaml,
        ledger/evidence/EV-SSI-455241.yaml,
        ledger/decisions/DEC-20260806-e2a6fa.yaml,
        ledger/evidence/EV-SSI-a42460.yaml and ledger/goals/GOAL-SSI-001/ --
        so a partial transition would move the hazard from a frozen contract
        onto immutable ledger records rather than remove it. A partial
        transition this session could not render-check would have been a worse
        outcome than a documented hazard.

    - id: R8
      claim: >-
        BATCH-043, BATCH-044 and BATCH-045 are closed research batches whose
        queues are stale, and no state in them was transitioned either.
      basis: >-
        Each is closed by a committed write-once checkpoint naming a decision
        and evidence record that both exist in the ledger: BATCH-043 /
        DEC-20260804-a6bb36 / EV-SSI-fcda7e (approve); BATCH-044 /
        DEC-20260804-cfe4d0 / EV-SSI-17c854 (confirm_scoped_negative);
        BATCH-045 / DEC-20260804-3677f1 / EV-SSI-8aaad0 (confirm_multi_lane).
        Each also carries a receipt-less snapshot archive card
        (TASK-20260803-fe5ee1, TASK-20260804-adb972, TASK-20260804-a73d98,
        all ARTIFACTS_ABSENT), matching cross-cutting finding F-1 of the
        committed discharge_sweep, which directs that such cards be terminated
        in the queue and never completed with a reconstructed commit_sha or
        path_sha256. Terminating them requires editing a queue that does not
        currently parse, and no edit was made because a state written into an
        unvalidatable file cannot be checked by the session writing it. The
        archive-chain gap each leaves is real and stays visible, as F-1
        requires.

    - id: R9
      claim: >-
        The BATCH-284f63 label carries two legitimate bodies of work and the
        ambiguity is RECORDED, NOT RESOLVED.
      basis: >-
        Cohort A is the four TASK-20260806-* cards the batch's own
        dispatch_queue.json lists, closed by
        ledger/goals/GOAL-SSI-001/checkpoints/BATCH-284f63.yaml under
        DEC-20260806-e2a6fa. Cohort B is TASK-20260807-a76f47, an independent
        Validator review of RUN-SSI-9b542d-001 whose report is filed under the
        same batch directory at
        coordination/goals/GOAL-SSI-001/batches/BATCH-284f63/reviews/TASK-20260807-a76f47/validation_report.md
        and which is closed by DEC-20260807-47db22, a record that stamps
        batch_id BATCH-284f63 and recorded_by_task TASK-20260807-a76f47 and
        cites EV-SSI-0c529c. TASK-20260807-a76f47 appears in no dispatch queue
        under this goal, and the write-once checkpoint filename its close
        would require is already occupied by cohort A's. Both bodies of work
        are committed and legitimate; what does not exist is one batch
        identity able to carry both. Choosing a side would destroy one
        session's provenance, so no side was chosen. Any future record
        speaking about BATCH-284f63 must name the cohort.

  limitations:
    - >-
      NO TOOL WAS RUN BY THIS SESSION. tools/validate_ledger.py,
      tools/research_dispatch.py, tools/allocate_id.py, git, yaml.safe_load
      and every hash computation were unavailable. The YAML and JSON this
      session wrote are unparsed by any parser; the mitigation used was to
      write every prose value as a folded block scalar with uniform four-space
      indentation, to keep each filesystem path on a single line so folding
      cannot insert a space inside it, and to keep every JSON state_note on
      one line with no embedded double quote. That is a mitigation, not a
      check. The dispatching session must parse all four written files before
      treating any of them as durable.
    - >-
      This decision has no allocated identifier. It carries the literal
      placeholder DEC-20260819-abe846 and lives outside ledger/decisions/ so that
      it cannot break ledger validation while unpromoted. It is not an
