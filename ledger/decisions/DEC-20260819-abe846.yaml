    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-043.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-044.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-045.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-284f63.yaml
