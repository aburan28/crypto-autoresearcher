  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No knowledge entry is warranted. This is a control-plane reconciliation:
      it measures no mathematical object, produces no evidence record, and
      makes no claim about supersingular-isogeny cryptanalysis at any claim
      tier. It is also not an evidence-review decision, so the gate that
      requires promotion on support or reject_scoped does not apply. The
      reusable operational
      lesson it contains -- that a closed batch's queue left at "queued" is a
      dispatch hazard, and that the honest repair is bounded by whether the
      repairing session can compute the hashes a completed archive card
      requires -- belongs to the portfolio-wide phantom-task remediation that
      owns all 228 entries, not to GOAL-SSI-001's knowledge corpus.

