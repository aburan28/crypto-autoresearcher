  context: >-
    /design-experiment, one contract, the second CSIDH design of this
    session cycle, selected by ranking under the ECC-first policy after
    EXP-CSIDH-f3c102's sibling EXP-CSIDH-906d0e (IDEA-20261006-fd07db,
    DEC-20261009-3fa819, merged as 1c33fceec7) took the first slot.
    The two high-priority SSI ideas stay deferred by the live
    GOAL-SSI-2fa82a lane's freshest decision; the ECDLP area holds 150
    approved contracts with no run against a cap of three; GOAL-SDEG-001
    is on hold; GOAL-ECTD-001's repair lane is paused. GOAL-CSIDH-001
    now holds one approved contract with no run (EXP-CSIDH-906d0e)
    against the cap of three, so one more approval is admissible. Of the
    two remaining open CSIDH ideas on RQ-CSIDH-64343f,
    IDEA-20261006-3cc090 was ranked over IDEA-20261006-534e34 because
    its outcome is genuinely two-sided (nothing in the recalled theory
    fixes whether a 30-term truncation of L(1, chi) already rounds to
    the form count at discriminant -83), while 534e34's
    Kronecker-versus-rational-kernel comparison is structurally expected
    at trace-zero supersingular curves. The question's own targets
    include a certified class-group order at small CSIDH-like
    discriminants, which this record prices at toy scale.

    The contract freezes p = 83, N = 30, the two-algorithm form
    enumeration certificate (E1 direct reduced listing, E2 box
    enumeration with A_MAX = 40, C_MAX = 400 plus Gauss reduction, h
    scored only on set equality), the exact rational L30 at
    chi(n) = (-83/n), rational sqrt bounds computed by integer square
    root at 10^6 decimals, the classical continued-fraction convergent
    bounds 333/106 < pi < 355/113, and the interval gates. Success is
    the source idea's prediction that the interval-gated nearest integer
    r equals h. The concrete negative is a scored r different from h.

    TWO DESIGN-TIME CORRECTIONS, both recorded in the specification's
    own words and neither editing the proposal: (1) the source idea's
    non-fundamental control names discriminant -84, but -84 = 4*(-21)
    with -21 = 3 mod 4 squarefree IS fundamental, so the control as
    written is unsatisfiable by a correct instrument; the frozen control
    uses -332 = 4*(-83), the conductor-2 non-maximal order of the same
    field, which is non-fundamental, and the launcher additionally
    asserts -84 is fundamental as a discriminator self-check. (2) the
    interval gate scores r as the unique integer NEAREST TO EVERY POINT
    of the interval (the idea's own wording), not an integer contained
    in it; the first draft of the specification used the contained
    reading, which the designing session caught when the machinery
    self-test's gate check failed on between-integer intervals at
    discriminants -59 and -107, and corrected before freezing.

    Pre-freeze observation disclosure: the turn-1 machinery validation
    listed the three reduced forms of discriminant -83 in a classical
    group-table check, so h was known before freezing; the prediction
    r = h is the source idea's own, filed 2026-10-06, before either
    session. The scored quantity r and the comparison |r - h| were
    never computed at (83, 30): the launcher's validation runs used the
    discriminants -59, -107, -84 and -23 only.

    Runnability: the launcher (implementation/qforms.py, run.py,
    check.py) is committed with this decision. run.py --self-test
    passes (E1/E2 agreement, two independent Kronecker implementations
    agree on n = 1..119 for ten discriminants including -83 and -332,
    interval gates pass at -59 and -107, fundamental-discriminant
    discriminator verified on eight positive and negative cases), and
    python3 tools/newest_experiments.py --experiment EXP-CSIDH-f3c102
    reports execution_state ready via the frozen trial plan. Peak
    memory of the whole measurement is a few tens of megabytes against
    the 512 MB machine-protection line; the arithmetic is exact
    rational with no floating point.

    Approval capacity: GOAL-CSIDH-001 holds one approved contract
    with no run (EXP-CSIDH-906d0e, tools/portfolio_kpis.py --capacity
    GOAL-CSIDH-001), standing one below the cap of three, so no
    supersedes_experiments or withdraws_experiments list is needed.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A scored r different from h is reachable as a recorded outcome, so success is not automatic.
    - The chi(1) control, the two-enumeration certificate, the -332 non-fundamental refusal, the -84 discriminator self-check, and the interval length and half-integer gates are the instrument controls.
    - Both design-time corrections are recorded with their reasons; the proposal's bytes are untouched.
    - The launcher is committed and its machinery is validated at other discriminants, so this approval is bounded by execution as AGENTS.md requires.

  evidence_refs: []
  limitations:
    - The measurement covers one discriminant below 200 and one truncation length. It does not transfer to CSIDH-512.
    - A mismatch closes only this discriminant and this truncation length; it does not refute the infinite sum.
    - The count is not a proof of the class-number formula and not a Kuperberg cost.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head and does not dispatch the executor.

