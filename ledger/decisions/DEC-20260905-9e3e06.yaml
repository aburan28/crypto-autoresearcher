  decision: open_batch
  decision_rationale_for_verb: >
    Opens BATCH-05103f to execute N2 of DEC-20260822-7d356e and nothing
    else: file the red team's reversal candidate -- a construction that
    FORCES POINTS ACROSS SEVERAL TWIST CLASSES AT ONCE -- as an ordinary
    IDEA-* proposal (minted identifier IDEA-20260905-d5608c) under
    RQ-ECRANK-27dcc5, and let it enter the ranking on its merits. N1 is
    closed by DEC-20260905-7adca0; the goal's committed RANK 1 (the
    breakthrough-tier round on the UNPROMOTED C1-closure candidate) is
    gated by IMP-2 (review-breakthrough unservable), which blocks ONLY the
    promotion of that candidate and explicitly no other ranked action.
    RANK 2 (N2) therefore proceeds. This batch changes no status, closes
    nothing, and asserts no evidence: an IDEA record is a proposal, and it
    enters the design/approval gates like any other.
  context: >
    N2 mandate quoted from DEC-20260822-7d356e.next_actions (priority 2):
    "Rank the red team's reversal candidate as an ordinary proposal: a
    construction that FORCES POINTS ACROSS SEVERAL TWIST CLASSES AT ONCE.
    Mestre's construction forces s(a_i) to be a square; the same machinery
    can force s(a_i) = d * square for a chosen d, putting prescribed points
    on E^(d) rather than on E, so a construction prescribing points across
    four or five classes of one k = 3 coset attacks the 8-class total
    directly instead of paying for it through one class. File it as an
    IDEA-* under RQ-ECRANK-27dcc5 with a minted identifier and let it enter
    the ranking on its merits." Why, quoted: "It follows from the
    obstruction read forward rather than backward: since separability
    FAILED, the other seven classes are not a fixed tax but engineerable
    headroom (11 units of variation at fixed maximum). It is also the only
    route in view NOT blocked by the descent-infeasibility obstacle,
    because it produces the twist points BY CONSTRUCTION rather than by
    descent." Status carried verbatim: "A CANDIDATE FOR RANKING, NOT
    EVIDENCE. It changes no status by existing." Owner per that decision:
    idea-generator, on a coordinator handoff -- this batch is that handoff.
  target_ids:
    - BATCH-05103f
    - IDEA-20260905-d5608c
    - GOAL-ECRANK-002
  coordinator_prior: >
    Recorded BEFORE the producer runs, per the review architecture. What I
    expect the filed IDEA to contain: (1) a mechanism section that goes
    materially beyond the red-team paragraph -- the algebraic machinery
    that forces s(a_i) = d * square for several chosen d at once, with a
    parameter count; (2) numbered predictions; (3) an explicit test
    boundary; (4) falsification criteria. Where I think it breaks, and
    where the producer must engage or honestly record domination: (a) THE
    DOMINATION OBJECTION -- running the ordinary single-class Mestre
    construction once per twist class (4-5 separate runs) may DOMINATE the
    joint multi-class construction, because the simultaneous conditions
    multiply the degrees of the polynomial identities required; the
    producer must either give a cost model showing joint forcing wins
    (asymptotics or concrete counts at the certified parameters) or set
    dominated_by to the per-class baseline with the row checked; (b) the
    degrees of freedom in Mestre's parameter space at the prescribed point
    count may not survive forcing 4-5 square-classes at once -- engage the
    count explicitly; (c) dominated_by may be null ONLY after checking
    every row of the frontier across time, memory, and data/queries -- an
    unchecked null is a fabrication under rule 5; sota_delta must be
    quantitative; (d) if the construction needs a descent to FIND the
    points it forces, it inherits the descent-infeasibility obstacle and
    the why-clause of N2 fails -- the record must show the points are
    produced BY CONSTRUCTION; (e) the predicted failure mode of the record
    itself: a restatement of the red-team paragraph with no mechanism,
    predictions, boundary, or falsification -- that is a fatigue report,
    not an idea, and the ledger will record it as such rather than file it.
    Comparison rule: I will compare the filed record against these five
    points in the closing decision, and a prior the producer overturns is
    recorded as overturned.
  review_plan: null
  review_plan_note: >
    No claim-changing review round: filing a proposal moves no hypothesis
    status, closes no lane, and supports no headline claim. The proposal
    meets independent review at the design/approval gates
