coordinator_decision:
  id: DEC-20261003-d35016
  context: >-
    GOAL-ENDO-001 (ECC area ENDO, ECC-first priority) lane RQ-VOLC-f6253b.
    KN-OPEN-f2f6dc records Problem B (descend from a crater curve across a
    large prime conductor gap N) as the open step behind the KKM crater/floor
    asymmetry, with baselines ~N^2 (construct the N-isogeny) and ~q^{1/2}
    (guess a floor curve) per KN-LIT-ca35e0, and names a certified toy-scale
    run of both baselines as its first discriminating test. No program record
    had executed it. IDEA-20261003-e3ce5b proposes that test with a
    stratification by k = ord_N(t/2), the degree of the field of definition of
    E0[N]; H-VOLC-5f03b6 specifies it; EXP-VOLC-3fee23 v1 is the frozen
    contract. This decision approves that contract.
  decision: approve
  target_ids:
    - IDEA-20261003-e3ce5b
    - H-VOLC-5f03b6
    - EXP-VOLC-3fee23
    - TASK-20261003-582b6c
  rationale:
    - >-
      RANKING. ECC goals are selected first (AGENTS.md "ECC comes first") and
      GOAL-ENDO-001 is ECC. This task ranks ahead of doing nothing because it
      fixes, with certificates, the baseline every later Problem-B candidate
      must beat, and its K-census quantifies how rare the cheap direct case is
      -- the quantity that decides whether the lane should pursue structured
      (small-k) descents or biased guessing next. It needs no new library and
      no Sage.
    - >-
      DECISION-CHANGING OUTCOMES. O-SUPPORT-TOY: Problem B's direct cost is
      k-governed and guessing is ~p/#S2; next work moves to sqrt-Velu, larger p,
      and richer X_1(m) biasing, with the k-census setting the expected payoff.
      O-FALSIFIED-*: one of the cost laws is wrong at toy scale, which
      redirects the lane to locating the error (instrument or Lemma) before any
      Problem-B candidate is costed. O-INCONCLUSIVE or O-INSTRUMENT-INVALID:
      repair or replicate under an amendment; no science moves.
    - >-
      PROOF-ORIENTED GATE (KN-TECH-080, agents/coordinator.md). The
      proof_search_map is present in both the proposal and the hypothesis:
      baseline slices (S1 k = 240 cell for the ~N^2 method; S3 for ~q^{1/2}),
      observation collisions searched before compute (same group order; F_p
      structure blind to N when k != 1; v crater curves when v > 1; Lemma-5
      certificate unsound outside its precondition, tested by C1b), explicit
      quantifier order (k is instance-dependent; no uniform O~(N) claim),
      method ceiling (classic Velu Omega(N); typical k ~ N), and nearby-object
      controls C1, C1b, C2.
    - >-
      DESIGN CORRECTIONS RECORDED BEFORE APPROVAL, not after data
      (EXP-VOLC-3fee23 design_corrections_to_brief DC-1 to DC-7): the guessing
      law is p^2/((p-1) #S2), a factor 2 above the brief's p/(2H floor
      fraction); the brief's pi-not-scalar test on E1(F_{p^k})[N] cannot
      succeed and is replaced by the Lemma-5 cyclic-Sylow certificate;
      D0 = -7 forces v even; the dual's evaluation is realised as a unique
      rational preimage at k = 2; A3 is compared one-sided, and the even m
      run at D0 = -7 because m in {2, 4} cannot divide #E with gcd(m, f) = 1
      when h(D0) = 1; the basis routine
      must handle non-homocyclic Sylow subgroups; N-independence is a partial
      slope. Each tightens the brief; none loosens a criterion.
    - >-
      COMPLETENESS CHECK (all non-null in the frozen contract): controls
      (C1, C1b, C2, C3, C3b, C4, C5, PLANT, blocking flags declared), metrics
      (primary and secondary, measured and modeled columns separated), seeds
      and seed derivation, fixed sample counts per cell, pre-registered
      predictions with formulas and decision rule, success and falsification
      criteria with exhaustive outcome labels, stopping and invalidation
      rules, required artifact paths, budget (advisory estimates plus memory
      cap) and runtime watchdogs, inference policy and handoff. A0 is declared
      excluded with reason.
    - >-
      CLAIM DISCIPLINE. Claim tier toy; no asymptotic-complexity claim
      (H-VOLC-5f03b6 asymptotic_claim is null with a note), so the four
      promotion gates are not engaged by this experiment; any later asymptotic
      restatement must pass them. The k-dependence is plausibly folklore and
      no novelty is asserted; the literature check of Galbraith 1999/2024 for
      it is recorded as not verified.
  evidence_refs:
