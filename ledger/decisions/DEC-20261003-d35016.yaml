      claim: Problem B is open and its minimal discriminating test 1 is a certified toy run of both baselines.
      verified_by: coordinator, this session, read knowledge/open-problems/KN-OPEN-f2f6dc.md
  limitations:
    - Not evidence. Does not answer KN-OPEN-f2f6dc (b) and claims no o(q^{1/2}) Problem-B algorithm.
    - Toy scale only (p <= 2^40); no transfer to cryptographic p is asserted.
    - >-
      The solver and the C4 verifier are written by the same executor session;
      independence is enforced by an import-graph check, not by authorship.
