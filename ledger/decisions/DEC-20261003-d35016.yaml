    - Galbraith 1999 (KN-LIT-7630, vendored PDF) and the full ePrint 2024/924 were not read in this session; the folklore/novelty question stays open.
    - The handoff's archived_by is left unbound because no archival task identifier was minted in this session; dispatch is forbidden until it is bound (AGENTS.md standing dispatch precondition 1).
  next_actions:
