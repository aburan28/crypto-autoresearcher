  limitations:
    - Measured clauses are toy only (p <= 600, n <= 613, k = 4, 36 curves per seed); nothing about cryptographic sizes or deployed curves.
    - One readout (identity); planted discrete-log oracles pass it. No claim that the non-torsion sections carry no information about d.
    - The arm comparison is confounded and powerless and carries no weight; the canonical j = 0 lift does add Aut(E^)-equivariance to the Teichmuller section.
    - Detection floor 4.2x to 5.2x of 1/p per arm and seed.
    - 36 of 1152 samples excluded by a rule the specification does not state (outcome-independent); per-row d, d2, base point and residue are not recorded.
    - The derivation is a checkable argument, not machine-verified; D1 uses a standard formal-group fact cited as a recalled pointer and recorded internally at derivation tier (KN-TECH-73630e).
    - The cm-arm canonical label is checked directly only for D = -3; the hypothesis's Katz citation is recalled with no verifier (the red team verified Deuring/Lubin-Serre-Tate in Chambert-Loir 2006 instead).
    - Reviewer model identities are not probe-verified; independence is by session and role.
