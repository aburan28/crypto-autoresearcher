  review_composition:
    prior: >-
      Recorded before the red team ran (TASK-20261023-1d45b5 review_plan
      coordinator_prior): every identity holds because each is a theorem; open
      whether the result refutes the H2 "full break" clause or only one reading
      of it.
    outcome_against_prior: >-
      Concordant on the identities and on the H2 clause (false under every
      constraining reading, circular under the remaining one). Not in the
      prior and adopted: the arm comparison has no power and is confounded
      (R2b), the readout is single-functional (R2c), and the canonical j = 0
      lift adds Aut(E^)-equivariance to the Teichmuller section.
    joint_rulings:
      - joint: R1 (the torsion section is the canonical section H2 asked for)
        reviewer: holds
        ruling: >-
          Adopted. The Coordinator re-derived the argument as lemmas D1 to D6
          (analysis.md I-A), adding the Frobenius-fixed characterization on the
          canonical lift (D5), which rt_probe C matches on 16/16 j = 0 curves.
          Recorded at proof_status derivation, not "proved" and not "at toy
          scope".
      - joint: R2a (per-section null for the identity readout)
        reviewer: holds
        ruling: Adopted with its floor (4.2x to 5.2x per arm and seed).
      - joint: R2b (arm comparison)
        reviewer: breaks
        ruling: >-
          Adopted. The arm-difference test is excluded from the basis; the
          "alike" clause rests on the per-arm tests and the matched-lift
          control. The structural lift effect (Aut-equivariance) is recorded as
          a boundary of the hypothesis mechanism, not as evidence against its
          rate prediction, which concerns the success event only.
      - joint: R2c (readout breadth)
        reviewer: breaks
        ruling: >-
          Adopted as a boundary on what is claimed (no "no information about d"
          claim). It does not touch the hypothesis's predictions, which are
          stated for the identity readout and three named sections; it breaks
          the wording of RQ-CZLIFT-b9f765 decision_target (a) and
          DEC-20261009-9f9254 (next_actions N-2, N-3).
      - joint: PTM-1
        reviewer: holds (validator and red team)
        ruling: >-
          Adopted. The supported statement relies on homomorphy, which s_leak
          lacks; it draws no no-leak conclusion from identity_rate = 1.0.
    weighed_not_adopted:
      - >-
        Red-team next_concrete_action asks that a correction record precede any
        EV-CZLIFT record. Not adopted as an ordering: this evidence record
        itself carries the scoped wording and excludes the false statements
        (EV-CZLIFT-ad28f5 B-2, B-3, B-6, B-7, inference), so no decision here
        rests on the uncorrected wording. The corrections are still required
        before RQ-CZLIFT-b9f765 is closed or cited through decision_target (a)
        (N-2), and are dispatched as the next synthesis task as the session
        directed.
  rationale:
    - >-
      Validity holds (validity_check). The two seeds are a clean replication
      with distinct curve samples; the validator's sealed blind re-derivation
      and the red team's independent arithmetic reproduce every load-bearing
      quantity.
    - >-
      The theorem-grade clauses are established by a checkable derivation
      uniform in p (analysis.md I-A; red-team R1), and the runs confirm the
      instruments against it with 0 exceptions in 1116 pairs, at k = 2..8 in the
      red-team sweep, and against a positive control (s_leak) that the
      instrument detects at rate 1.
    - >-
      The measured clauses held as preregistered: every per-arm |z| <= 1.88
      against a 4-sigma rule, consistent with 1/p, and the red-team exhaustive
      matched-lift control is within 0.97x to 1.06x of a same-shape null.
    - >-
      Support rather than replicate: the result is the predicted, unsurprising
      outcome, its force comes from the derivation, and it is already replicated
      across two seeds and two independent reviewer implementations. Support
      rather than refine: no prediction of the hypothesis failed; the two
      defective sentences are in its mechanism and are excluded from the
      support by boundary, with a correction record as a next action.
    - >-
      Strength replicated, not strong: the arm control is confounded and
      powerless, the readout is single-functional and the detection floor is
      4.2x to 5.2x of 1/p.
    - >-
      Promotion gates (agents/coordinator.md). H-CZLIFT-6d4ed1 has
      asymptotic_claim null; its only complexity statement is the polynomial
      construction cost of s_tor, not a cost to break. For that statement:
      (1) single-responsibility lemmas D1 to D6 with the theorem as assembly
      (analysis.md I-A); (2) no heuristic enters the derivation, and the one
      heuristic under the 1/p reference is numbered H-1 with toy validation
      (rt_probe B); (3) the red-team cost table charges per-attempt cost times
      inverse success probability (about p x 60 additions against
      sqrt(pi n/4) for rho; 2^264 against 2^128 at 256 bits; memory O(1) for
      both), so any attack reading is dominated and no deployed system is
      affected; (4) independent review-adversarial (xhigh) validation and red
      team, the red team covering the cost model and the heuristic. No
      progress-fidelity claim arises (no speedup is claimed).
