coordinator_decision:
  id: DEC-20260915-674299
  goal_id: GOAL-ICPERF-e6b6a4
  context: >-
    Portfolio coordination pass on 2026-09-15 (branch
    claude/index-calculus-graph-dag-3linyk, at origin/main e2a2bd35b; merge digest
    0beefd5b1..e2a2bd35b read). Portfolio state as reported by the driving
    session's tool runs: 57 active goals, 42 ECC; one Ready task (GOAL-AUXIN-a93442
    BATCH-cae584 TASK-20260913-e347cb); 32 batch-complete goals awaiting a
    checkpoint; 18 blocked, including ECC GOAL-ICPERF-e6b6a4's BATCH-51e2aa; 6
    needing repair, two of them ECC (GOAL-ICEX-001, GOAL-SIG-001, both
    archive-task declared-artifact mismatches); 10 open ECC ideas (SEMBIN 5,
    ICPERF 3, ECDLP 2). This decision ranks that portfolio and takes exactly one
    act: it designs the highest-ranked open ECC idea, IDEA-20260915-5c407a, into a
    hypothesis and a frozen experiment contract. IT APPROVES NOTHING, launches
    nothing, opens no batch, and changes no goal.
  decision: expand
  decision_note: >-
    `expand` in the sense of agents/coordinator.md: a research direction gains a
    specified hypothesis and a written contract. It is explicitly NOT `approve`.
    EXP-ICPERF-025a52 stands at approved_by: null with its approval preconditions
    enumerated in the contract, and H-ICPERF-5f038b stands at `specified`, not
    `approved`. Designing is not approving (AGENTS.md "ECC comes first",
    instruction 3).
  target_ids:
    - RQ-ICPERF-94c86e
    - H-ICPERF-5f038b
    - EXP-ICPERF-025a52
    - IDEA-20260915-5c407a
    - GOAL-ICPERF-e6b6a4
    - TASK-20260915-532164
    - TASK-20260915-60dc73
  ranking:
    method: >-
      Expected information gain per unit cost, dependency risk, and the
      exponent-first bias of docs/target-result-profile.md, with ECC considered
      before all else per orchestration/research-priority.yaml. Machine state is a
      ranking input: EXP-ICPERF-66fd51 is a solver benchmark whose contract
      requires the machine otherwise quiet, so a zero-compute act ranks above any
      act that would put a second producer on the box.
    candidates:
      - rank: 1
        act: >-
          Design IDEA-20260915-5c407a (descent DAG, priority high) into
          H-ICPERF-5f038b + EXP-ICPERF-025a52.
        why: >-
          Ranked work by rule (an open ECC idea under an active ECC goal), the only
          one of the three ICPERF ideas with exponent content, zero compute, no
          lane collision, and its cheapest falsification (the Stage A analytic
          crossover audit) can kill or rescope the line before any implementation
          budget is spent.
      - rank: 2
        act: >-
          Design IDEA-20260915-9191ed (relation hypergraph filtering,
          priority medium-high).
        why: >-
          Also ranked ECC work and cheap in principle, but its own cheap arms
          "reuse relation sets the ICPERF batch already produces", and BATCH-51e2aa
          measures POINT DECOMPOSITION on shipped instances -- it produces no
          relation sets. Its cheapness is contingent on a relation-search batch
          that does not exist, so designing it now would freeze a contract whose
          inputs are unavailable. It also disclaims exponent content by
          construction ("ZERO asymptotic delta").
      - rank: 3
        act: >-
          Coordinator checkpoint + next batch on one of the 32 batch-complete ECC
          goals.
        why: >-
          Real backlog and eventually the largest block of work, but a next batch
          means dispatching producers, and the one live ECC benchmark on this
          machine is explicitly conditioned on the machine being quiet
          (GOAL-ICPERF-e6b6a4 max_concurrent_basis). Ranked below an act that costs
          no CPU. Choosing WHICH of the 32 also needs the portfolio tool's own
          output per goal, which this session could not re-derive (see
          provenance_limits).
      - rank: 4
        act: >-
          Design IDEA-20260915-69941f (solver scheduling ceiling audit, priority
          medium).
        why: >-
          Cheapest of the three and genuinely useful (it would put an error bar on
          the DREG/SDEG/SATIC lanes' single-configuration numbers), but it sweeps
          the SAME engines and instances that BATCH-51e2aa is benchmarking right
          now, so it is both the most likely to collide with that lane and the one
          whose value depends on that lane's results landing first. Its expected
          outcome is a negative by its author's own statement.
      - rank: 5
        act: Integrity repair on GOAL-ICEX-001's archive-task artifact mismatch.
        why: >-
          A genuine evidence-integrity defect (BATCH-001's ledger receipt binds
          DEC-20260731-015 at a hash that the file now standing at that id does not
          carry; BATCH-1104d5's recovery FAILED independent review, and a corrective
          custody task is owed per DEC-20260907-582b27). It is ranked below design
          because it unblocks nothing live: ICEX measurement is unauthorized on an
          unmet SDEG/MONO/RELN conjunction regardless of the custody question, so
          the repair buys record hygiene, not forward motion. It stays ranked, not
          dropped, and it needs shell/git forensics this session could not perform.
      - rank: 6
        act: Integrity repair on GOAL-SIG-001's archive-task declared-artifact mismatch.
        why: >-
          Same class as rank 5 and same reasoning; not read in detail this pass, so
          it is ranked on the portfolio tool's classification alone and is recorded
          as such rather than assessed.
    top_beats_runner_up: >-
      Rank 1 beats rank 2 on input availability, not on taste. Both are ranked ECC
      work under the same goal and both are cheap to design. But 9191ed's two cheap
      arms consume relation sets that no batch in this program has produced -- batch
      1 of GOAL-ICPERF-e6b6a4 measures point decomposition on the authors' shipped
      instances and stops there -- so freezing its contract today would pin a
      protocol to inputs that do not exist, which is exactly the incomplete protocol
      the standing authorization tells the Coordinator to complete or to hold with a
      named impediment. 5c407a's contract, by contrast, needs no prior run, no
      solver, no engine and no external input: pure F_2[x] arithmetic, with an
      analytic Stage A that can falsify the premise before Stage B costs anything.
      It is also the only one of the three that could move a charged exponent
      rather than a constant, which is the bias docs/target-result-profile.md asks
      the roadmap to carry.
    not_ranked_and_why: >-
      The other 7 open ECC ideas (SEMBIN 5, ECDLP 2) were NOT individually ranked.
      The driving session's `ecc_priority.py --open-ideas` run reported their counts
      but not their identifiers, and this session could not re-run the tool (see
      provenance_limits), so openness could not be established per record. What was
      checked: GOAL-SEMBIN-5078bc is being actively worked by another session right
      now (the merge digest for this window adds EV-SEMBIN-4125ec and
      DEC-20260915-fad1c1 and modifies H-SEMBIN-97ea23 and EXP-SEMBIN-2c40bb), so a
      design act there risks colliding with a live lane this session cannot see.
      That is a scheduling reason, not a merit judgement, and it is recorded as the
      concrete remaining uncertainty in this ranking rather than glossed.
  rationale:
    - >-
      AGENTS.md "ECC comes first" instruction 3 makes an open ECC idea ranked work,
      not backlog, and names /design-experiment as its disposition. ICPERF is a
      declared ECC area in orchestration/research-priority.yaml. GOAL-ICPERF-e6b6a4
      is active with an unlimited campaign budget, and unlimited removes the batch
      ceiling, not the duty to rank -- so this act is justified by its rank above,
      not by the absence of a cap.
    - >-
      Of the three ICPERF ideas filed today, only IDEA-20260915-5c407a carries
      possible exponent content (its regime R3 would mean every cost model in this
      program that charges descent by tree size over-charges the attacker by a
      factor growing with depth). agents/coordinator.md responsibility 3 and
      docs/target-result-profile.md both bias the roadmap toward exponent-targeting
      mechanisms over constant-cofactor polishing; the sibling records disclaim
      exponent content by construction.
    - >-
      The design does NOT take the idea at its word about cost. The idea's arm 1
      presumes an FFS-style descent this repository does not have (a filename-level
      check of tools/ and experiments/*/code/ found none; cheap, not exhaustive).
      The contract therefore replaces "build an FFS descent" with a declared,
      simplified, per-relation-certifiable degree-decreasing descent over F_2[x],
      and puts the cheapest falsification first: Stage A computes the pigeonhole
      crossover j* and the per-node acceptance probability analytically from exact
      irreducible counts and may declare grid cells infeasible before any descent
      runs. Freezing j* before Stage B is also what makes prediction P3 a
      pre-registered test of the mechanism rather than a post-hoc coincidence.
    - >-
      The idea's ECDLP arm is deliberately excluded from this contract. Its own
      author predicts it negative at executable scale (depth 1-2, pigeonhole
      condition nowhere near met) and it needs a Diem-recursion implementation that
      does not exist. Excluding it keeps the contract honest about what it is: a
      measurement on the descent COLUMN of a cost model, not an elliptic-curve
      result. The successor contract is named in the hypothesis rather than
      silently dropped.
    - >-
      Approval is withheld, and not for want of user authorization. The standing
      authorization of 2026-09-06 already covers approval; what is missing is
      protocol readiness, which is the Coordinator's responsibility:
      IDEA-20260915-5c407a is novelty_status: unverified with every literature
      citation `recalled`, no agent in this program has opened any of those sources,
      and the screen's second question -- whether published descent analyses are
      already stated on the DAG -- can empty regime R3 of exponent content by
      argument alone. Spending an implementation budget before that screen would be
      the expensive mistake. TASK-20260915-532164 owns the screen.
    - >-
      This act consumes no CPU, launches no subagent, opens no batch, and writes no
      field of any existing record. That matters concretely: BATCH-51e2aa is held by
      another session (claims exist for TASK-20260913-6c5729 and
      TASK-20260915-5ba08b), its benchmark contract requires the machine otherwise
      quiet, and GOAL-ICPERF-e6b6a4's max_concurrent is 2 on machine-headroom
      grounds. A design act is the one act that is ranked first AND cannot disturb
      that lane.
  evidence_refs:
    - >-
      NONE. This decision reviews no experimental evidence and cites none. The
      records read are inputs to a ranking, not support for a claim:
      ledger/ideas/IDEA-20260915-{5c407a,9191ed,69941f}.yaml,
      ledger/questions/RQ-ICPERF-94c86e.yaml,
      ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml, ledger/goals/GOAL-ICEX-001.yaml,
      ledger/hypotheses/H-ICPERF-cc4847.yaml,
      experiments/EXP-ICPERF-66fd51/specification.yaml,
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-51e2aa/dispatch_queue.json,
      orchestration/research-priority.yaml.
  limitations:
    - >-
      No hypothesis moves toward supported, no experiment is approved, no goal
      changes status, no batch is opened, and no evidence is interpreted. The only
      state change is the existence of two new design records and two task cards.
    - >-
      H-ICPERF-5f038b's status `specified` asserts that its predictions, controls,
      budgets, stopping rules and artifacts are pinned -- nothing about whether the
      hypothesis is true, and nothing about whether it is novel.
    - >-
      The designed contract measures a DECLARED simplified descent over F_2[x]. It
      is not FFS, Joux, GKZ or Diem descent, and it is not an elliptic-curve
      measurement. Any reader taking a future rho_j from it as an ECDLP number is
      misreading the record; the contract's interpretation_limits say so in terms.
    - >-
      The ranking above is honest about what it could not compare: 7 of the 10 open
      ECC ideas were not individually assessed, and 31 of the 32 batch-complete
      goals were not opened. Both gaps are named with their reason in `ranking`.
  provenance_limits: >-
    This Coordinator session had no shell. `goal_portfolio_health.py`,
    `ecc_priority.py`, `merge_digest.py`, `agent_bus.py inbox`, `goal_lanes.py` and
    `validate_ledger.py` were run by the driving session and their outputs were
    supplied to it verbatim; they were not re-derived here. The five identifiers in
    this decision were minted by the driving session with
    `python3 tools/allocate_id.py --next {hypothesis,experiment,coordinator_decision,handoff,handoff}`
    and each was reported `--check` clean ("well-formed and free across the union",
    0 occurrences across 25192 identifier-bearing paths). No identifier was invented
    and no tool output was reconstructed from memory. The declared paths in this
    decision were written by this session and are UNCOMMITTED until
    TASK-20260915-60dc73 runs; nothing here is durable program state before that.
  impediments_observed:
    - id: IMP-DESIGN-1
      what_is_blocked: >-
        Approval of EXP-ICPERF-025a52 for execution (the CONTRACT, not the campaign
        and not GOAL-ICPERF-e6b6a4, which stays active and is untouched by this
        decision).
      condition: >-
        IDEA-20260915-5c407a is novelty_status: unverified and every literature
        citation in it and in H-ICPERF-5f038b is `recalled`; under AGENTS.md rule 9
        a recalled reference may not establish that the measurement is unpublished
        or that its interpretation is open.
      clears_when: >-
        TASK-20260915-532164 returns a verdict with provenance-tagged sources, and
        a Coordinator decision records it -- including the case where the verdict is
        `screen_incomplete`, which clears nothing and is reported as such.
      recheck: >-
        Read coordination/goals/GOAL-ICPERF-e6b6a4/tasks/TASK-20260915-532164/screen-report.md
        once committed.
      asserts_nothing_about: the science; an unverified novelty status is not a fact about descent.
    - id: IMP-DESIGN-2
      what_is_blocked: >-
        Execution of TASK-20260915-532164 itself, if the knowledge index is not
        serving.
      condition: >-
        kb/ is a DERIVED index that starts empty; with `:memory:` configured the MCP
        server answers every query with nothing and says so only in its startup log.
      clears_when: >-
        `make -C kb qdrant-up` plus `crypto-kb stage-repo . && crypto-kb ingest`
        have run, or the screen is reported as `screen_incomplete` with the index
        state named.
      recheck: query search_knowledge for a known identifier (e.g. KN-LIT-102cdb) and confirm an exact-lookup hit.
      asserts_nothing_about: >-
        novelty. Absence of a search result is never evidence that something was not
        tried (AGENTS.md retrieval policy).
    - id: IMP-DESIGN-3
      what_is_blocked: >-
        Dispatch of any task into GOAL-ICPERF-e6b6a4 from this session.
      condition: >-
        BATCH-51e2aa is held by another session (claims present for
        TASK-20260913-6c5729 and TASK-20260915-5ba08b), the goal's max_concurrent is
        2 on machine-headroom grounds, and this session cannot run
        `tools/goal_lanes.py claim`.
      clears_when: >-
        A session with a shell claims the task or opens a disjoint lane with
        `tools/goal_lanes.py`, respecting max_concurrent 2 and the machine-quiet
        requirement of EXP-ICPERF-66fd51.
      recheck: "python3 tools/goal_lanes.py lanes GOAL-ICPERF-e6b6a4 after git fetch"
      asserts_nothing_about: the merit of either lane's work.
  deliberately_not_done:
    - >-
      No edit to ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml. Its next_action belongs
      to the BATCH-51e2aa lane; a design act that has opened no batch has no
      business rewriting a live lane's head, and editing it would manufacture a
      merge conflict in the one file many campaigns write.
    - >-
      No edit to IDEA-20260915-5c407a. Idea records are write-once; an open ECC idea
      stops being open by being REFERENCED by a hypothesis and an experiment, which
      H-ICPERF-5f038b and EXP-ICPERF-025a52 now do via proposal_id.
    - >-
      No batch opened, no lane registered, no subagent launched, no dispatch queue
      written or touched.
    - >-
      No approval of EXP-ICPERF-025a52, and no partial approval of its Stage A
      alone: a partial approval before the novelty screen would be the same gate
      failure in a smaller package.
    - >-
      No scientific trial. Nothing in this decision is a /run invocation, and the
      contract it designs cannot be executed until an implementation task exists,
      is reviewed, and a separate approval decision is committed.
  next_actions:
    - >-
      EXECUTE TASK-20260915-60dc73 (owner: coordinator / the driving session,
      because it requires git): merge origin/main into
      claude/index-calculus-graph-dag-3linyk, re-run tools/validate_ledger.py and
      branch-scoped check_merge_hygiene.py, commit ONLY the five declared paths in
      one isolated snapshot commit naming this task and the five record IDs, push,
      and open or refresh a PR against main naming H-ICPERF-5f038b,
      EXP-ICPERF-025a52, DEC-20260915-674299, TASK-20260915-532164 and
      TASK-20260915-60dc73. This is NOT a /run invocation and launches no
      experiment. Everything else -- the novelty screen, the implementation task,
      the approval decision -- waits behind it, because approval may not rest on
      uncommitted records.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence was reviewed and no run exists. This is a ranking and design
      decision; there is no durable claim to promote, and a KN-FIND minted from a
      designed-but-unapproved contract would be a claim about work nobody has done.
      The promotion gate re-opens when EXP-ICPERF-025a52 produces reviewed evidence.
  decided_by: coordinator
  decided_at: '2026-09-15'
  authorization_basis: >-
    Standing user authorization for idea intake and experiment design (AGENTS.md,
    2026-09-06) covers this design act; no user confirmation was sought or is
    required. That authorization is permission to do the work, never evidence about
    it, and it is not used here to approve an incomplete protocol.
  archived_by: TASK-20260915-60dc73
