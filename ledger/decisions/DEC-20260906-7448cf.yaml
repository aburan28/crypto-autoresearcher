  ruling_iv1_j3b1: 'The frozen contract keys the IV-1 void to ONE trigger in three
    separate operative sentences: controls C1 (''A pipeline reporting total = n at
    d = 1 is broken and ALL runs are void''), the IV-1 antecedent (''the pipeline
    reports certified total = n at d = (1..1) ... => ... ALL runs ... VOID''), and
    tail_checks KNOWN-FALSE TAILS (''either reporting total = n voids everything (IV-1)'').
    The driver''s own recorded binding agrees (runs/RUN-ECRANK-76a70d-R7-known-false/raw-result.json
    parameters.iv1_binding: ''total == n at d=(1..1) voids ALL runs''). That trigger
    occurred ZERO times: any_total_equals_n is false at n=8 and n=10 over all 40 seeded
    instances, and the committed fixture anchors reproduced exactly (7 at n=8, 9 at
    n=10, matches_expected true). The raw flag IV1_fired: true is therefore a DRIVER
    ARTIFACT of the disjunction in source/run_known_false.py:123-127, which ORs the
    frozen void trigger with a strict-expectation clause (''total 7/9 on EVERY seeded
    b-tuple'') that appears nowhere in the frozen contract as an invalidation trigger.
    The flag is immutable raw data and is NOT edited, re-scored, or explained away;
    this decision is the adjudication the red team''s BLOCK item J3-B1 required. RULING:
    IV-1''s void condition is UNMET; no run of EXP-ECRANK-76a70d is void; the below-ceiling
    certified totals at random seeded b (5-7 at n=8, 7-9 at n=10) are a MEASURED MATHEMATICAL
    FACT — true-rank variation of the forced-point span at random b — and not broken
    relation bookkeeping. Two independent grounds: (i) the red team''s exact recomputation
    from the committed certificates (exact Fraction group law on the recorded images
    under the recorded a_invariants, plus an exhaustive {-1,0,1}-box relation search)
    found the certified total EQUAL to the exact true rank of the forced-point span
    in 16/16 below-ceiling cases and never exceeding n-1 anywhere — the pipeline under-counts
    relative to the ceiling only where extra true relations exist and NEVER overcounts,
    which is the failure mode the guard names; (ii) the contract''s own cited authority
    EV-ECRANK-6695dc records ceiling attainment as always a fraction (7 attained on
    1,751 of 2,985 curves at n=8 and 8 on NONE; 9 on 32,805 of 39,876 at n=10 and
    10 on NONE), so ''attained exactly'' means saturated-and-never-exceeded, and a
    universal per-b ceiling was never established. Consequently the success criterion''s
    ''ALL controls passing (IV-1 through IV-7 untriggered)'' clause is recorded as
    SATISFIED, with this adjudication cited wherever that phrase is used: IV-1 untriggered
    under the frozen void trigger (the driver flag adjudicated as an artifact); IV-2
    not fired (1161/1161 plants recovered, slope 0.9048 inside the frozen window [0.699,1.301],
    per-decade ratios 11.9 and 5.43 inside [5,20]); IV-3 untriggered (validator J2,
    27/27 exact matches, re-derivation written before any blind_from source was opened);
    IV-4 not fired (vacuous in the arms — zero candidates ever reached the filter;
    the rejection path was exercised by smoke S4 on the contract''s named 4096 degenerate,
    reason degenerate_deg_s_2); IV-5 not fired (all 58 certificates verdict PASS with
    errors_strict empty; no exhibited witness rejected; the Fl_certifier ''errors''
    strings are WITHHOLD notices bounding the certifier''s own claim, not rejections);
    IV-6 not fired (no r_low / PARI ellrank / 2-descent / root-number call anywhere
    in source/, cypari absent, pari_in_pipeline false, network none, all 58 certificates
    exact_arithmetic_only and no_descent_no_root_numbers_no_floats true, exact_certify.py
    pin 1bc7c05954fdf9531c41eb942e91f918e401098971b2211501a9628ae011ea8e verified
    at import and at run time); IV-7 not fired (bit-for-bit match — but INFORMATIONALLY
    EMPTY at the instance level, since both compared lists are empty and sha256 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
    is exactly sha256(''[]''), so no record may cite IV-7 as evidence of instance-producing
    determinism; the load-bearing reproducibility evidence is the R3/R4 raw-result
    and 19-checkpoint identity plus the validator''s independent scratch replay from
    the snapshot bytes and seed 760708, which reproduced every shared field and the
    identical ops total 8,683,560). FALSIFICATION ROUTES FOR THIS RULING (recorded,
    machine-checkable): the adjudication is overturned and every run voided if (i)
    a textual argument establishes that IV-1''s em-dash expectation clause is the
    operative trigger rather than the antecedent — it must explain why three separate
    operative sentences, including the driver''s own recorded iv1_binding, key the
    void to total = n — or (ii) any single R7 case is exhibited where the certified
    total EXCEEDS the true rank of the forced-point span.'
  ruling_slot8_accounting: 'The frozen enumeration lists 8 runs, the 8th being ''one
    repair/restart margin within the counted-ops caps'', while the completion gate
    and required_artifacts REQUIRE the planted control (C5/IV-2) with raw outputs
    and name no slot for it. The literal crash-finalization reading of stopping_rules
    (a crash finalizes the affected run as failed_infrastructure and the margin restarts
    it) makes the frozen contract INTERNALLY INCONSISTENT: one margin cannot cover
    both a crash-restart and a gate-required control, and under it this execution
    would exceed maximum_runs (8 finalized records + 5 preserved failed attempts =
    13 run events). RULING: the executor''s reading is ADOPTED — a ''run'' is a FINALIZED
    RUN RECORD; a crashed or defective attempt is an implementation iteration inside
    one enumerated run''s execution, preserved as an attempt record and never a result
    (core rules 3 and 5); the planted control occupies enumerated slot (8). 8 finalized
    run records == maximum_runs 8; total counted ops 38,791,749 and total reported
    wall 99.559 s against the 57,600 s envelope; every finalized run and every preserved
    attempt finalized inside the frozen caps (max ops utilization 13.94%, max internal
    wall 36.288 s of 7200 s, max peak RSS 0.049 GB of 8 GB). No envelope breach. The
    defect is the frozen enumeration''s, not the execution''s, and is recorded as
    a contract defect for successor contracts. RESIDUAL RISK RECORDED (red team J4):
    the adopted reading places no bound on the NUMBER of in-run attempts, so a future
    executor could iterate indefinitely inside one run id; any successor contract
    must declare a per-run attempt ceiling with every attempt preserved, and must
    name the ledger run schema (nested `run:` record plus the command.txt and environment.json
    companions) in required_artifacts — the omission that caused the pre-archive repair
    TASK-20260906-546d17. RETRY-INTEGRITY CHECKS (red team, verified from the preserved
    attempts): no finalized run exceeded a cap; no retry re-rolled the science (seeds
    and parameters identical across attempts); no outcome-selected retry (R8 attempt-3
    versus the run of record is byte-identical in measurement content, the fix being
    per-instance keying only; attempt-1 replaced a construction that violated the
    contract''s own in-box plant requirement); no parameter or seed drift between
    attempts.'
  ruling_f_label_mapping:
    F1: 'FIRES on its declared scope. Arm B (n=8, seed 760708) executed its FULL pre-registered
      sample — 10,000 seeded b-tuples, b_done == b_total in all three streams (3334/3333/3333),
      80,000 draws, 80,000 solves_ok, 0 square_ok, 0 constructed instances — inside
      every frozen cap (8,683,560 counted ops of 1.0e8; 22.527 s of 7200 s; 0.049
      GB of 8 GB). No exhaustion occurred (exhaustion: null; exhaustion_events: none),
      so this is the F1 event and NOT budget exhaustion reported as F1: HEUR-1''s
      small-height density is FALSIFIED ON THE DECLARED SAMPLE SCOPE, where P(zero
      | per-b rate >= q = 10^-3) ~ 4.5e-5. Scope of the closure (rule 6): the declared
      sample only — ~10^4 of ~1.7e9 affine normal-form b-tuples (~6e-6 of b-space),
      n=8, r-height <= 10^4, b_1=0, b_2=1, b_3..b_8 distinct integers in [-20,20],
      toy tier, no transfer assumption. Full-box exhaustion (~2e13 ops) was never
      promised and was not performed.'
    F1_additional_scopes: 'Two further measured negatives are recorded at THEIR OWN
      scopes and are NOT folded into F1: arm A (n=6, exponent +2, 1,000 seeded b-tuples,
      531,610 counted ops) found 0 instances, and arm C (n=10, exponent 0, 10,000
      b-tuples, 13,940,808 counted ops) found 0. The arm-A zero is the SHARPER anomaly
      and is recorded as such: at n=6 the design expected ~C*10^8 in u-height, only
      n-5 = 1 ellipticity condition binds, and the arm-A local-solvability diagnostic
      measured 0 obstructions with 1000/1000 real-place solvable — so a zero there
      is either a constant C(b,d) far below the random-model assumption or a defect
      in the draw stage''s support. Each closes only its own declared scope.'
    F2: 'NOT FIRED, and no F2-kind obstruction was measured: no local obstruction
      (a prime p <= 100 or the real place) was measured for any sampled b at n=6 —
      0 obstructions in 1000/1000 sampled b, all real-place solvable, and 927 b carry
