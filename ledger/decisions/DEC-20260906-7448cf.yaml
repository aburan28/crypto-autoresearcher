    was needed and none was made, and no executed run was re-scored.'
  prior_overturn: 'The pre-recorded prior in DEC-20260906-69749a.review_plan expected
    IV-1 to PASS with ''total = n exactly (7 at n=8, 9 at n=10)''. That sentence conflated
    total = n with the committed ceiling n-1 and is PARTIALLY OVERTURNED by the raw
    data: at the committed fixtures the expectation holds exactly; at random seeded
    b the totals are not all 7/9; ''total = n'' in its frozen sense never occurred.
    The overturn is informative and is recorded rather than absorbed — the below-ceiling
    phenomenon at random b was unanticipated by the plan and is now measured, exactly
    corroborated (16/16 certified totals equal true ranks), and bounded. The prior''s
    worry (i), that twist-class distinctness bookkeeping might inflate certified totals,
    can be NEITHER confirmed nor refuted from this record set, because no multi-class
    certificate exists (J3-F3).'
  correction_by_reference_j4f1: 'execution-report.yaml''s final observation bullet
    states that counted-ops throughput ran far below the conservative design estimate.
    That sentence conflates CONSUMPTION with THROUGHPUT and is superseded BY REFERENCE:
    measured throughput was 3.85e5 counted ops/s (arm B, 8,683,560 ops in 22.527 s)
    and 3.84e5 (arm C, 13,940,808 in 36.288 s), about 19x ABOVE the design''s declared
    >= 2e4 exact-ops/s floor; CONSUMPTION ran ~11.5x (arm B) and ~7.2x (arm C) BELOW
    the design''s ~1e8-per-arm prediction, because the measured per-draw cost is ~40
    counted ops rather than the design''s ~824 estimate. No work was skipped: each
    draw executes the frozen solver description in full — the (n-5)x(n-5) exact Fraction
    Gauss-Jordan solve for y = r^2 plus ALL n-5 rational_square tests with no early
    exit — and the per-b delta interpolation is correctly deferred to a build path
    that was never reached because no instance exists. The design''s 824/draw figure
    was an over-estimate, not a work floor the run dodged, and no cap was approached.'
