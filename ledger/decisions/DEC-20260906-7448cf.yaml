  ruling_hypothesis_status: 'H-ECRANK-ee6e0e: specified -> approved (DEC-20260905-2d466e)
    -> running -> analyzed -> WEAKENED, scoped. WEAKENED, not rejected and not inconclusive.
    The hypothesis has two separable halves and the run bears on them differently.
    (1) The DENSITY/YIELD half — HEUR-1''s law ~ C(b,d)*H^(5-n/2) with abundance at
    n=8 — is falsified at the tested scope: F1 fires on the declared sample, and the
    arm-A (n=6) and arm-C (n=10) zeros are recorded negatives at their own scopes.
    (2) The EXISTENCE/CONSTRUCTION half — that such quartic models exist with 8 forced
    points across 4 distinct twist classes of one k=3 coset, certified descent-free
    with a total >= 8 — is NOT refuted: a null over ~6e-6 of b-space at toy scale
    does not refute an existence claim (rule 6), and the hypothesis''s own quantifier-order
    audit carried exactly this point (a produced instance certifies regardless of
    HEUR-1''s truth). It is however UNEXHIBITED: this program has produced no such
    instance, and the multi-class certificate path (4 distinct twist classes, per-class
    certification, cross-class eigenspace summation) was exercised by NO certified
    instance anywhere in this experiment — all 58 certificates are single-class (red-team
    finding J3-F3). The ALGEBRA half (the M0-M3 forcing identity, the W(b)/W''(b)
    subspace form, exact eigenspace and F_l certification, the descent-free stack)
    is CORROBORATED: F5 did not fire, IV-5 and IV-6 are untriggered, and IV-3/C3 discharged
    with 27/27 exact blind re-derivation matches on the left kernel of W(b) and the
    delta interpolant. `inconclusive` would understate a pre-registered measurement
    with P ~ 4.5e-5; `rejected` would overstate a null at ~6e-6 of b-space against
    an existence claim. WEAKENED is the honest label and it closes only the tested
    scope. The hypothesis record itself is write-once and is NOT edited; this decision
    is the transition record.'
