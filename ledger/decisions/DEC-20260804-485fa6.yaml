coordinator_decision:
  id: DEC-20260804-485fa6
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-a2bb63
  recorded_by_task: TASK-20260804-53e6bd
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-04'

  decision: weaken
  decision_label: >-
    Weaken the across-candidate departure from a factor of 2 to 1.10 -- most of
    it is forced by candidate-offset shortness, not by the dual family -- and
    carry the surviving 4-9% residual into batch 6 as the campaign's one open
    quantity.
  decision_vocabulary_note: >-
    `weaken` and not `reject_scoped`, which is what the four preceding batches
    earned. A residual survived both reviewers' ablations. That is a real
    difference and the record should not flatten it.

  context: >-
    Batch 5 of 6 measured across-candidate score dependence -- the quantity
    MATZOV.Nf's advantage law assumes and the only one four prior batches had
    not touched. It reported a downward departure of roughly a factor 2 on the
    secret-distribution group. Both reviews then ablated it.

  coordinator_validity_check: >-
    Both reviews ran concurrently in independent sessions with nothing
    forwarded, and each ablated the result by a different construction. Neither
    committed its own artifacts; the standing no-commit rule held.

  what_is_weakened:
    - >-
      THE HEADLINE. 66% (near-miss K=8), 71% (near-miss K=25) and 92%
      (secret-distribution K=25) of the deficit is reproduced by an object with
      NO lattice, NO sieve and NO dual family at matched norms and offset scale.
      The factor of 2 becomes 1.10. The red team's independent ablation puts
      85-90% of the headline surviving deletion of the lattice, A, the modulus,
      the sieve and the coupling.
    - >-
      THE NULL. NULL-IIDPHASE removes candidate-offset SHORTNESS and the X-Y
      pairing at once, and shortness carries nearly all of it. Offset shortness
      is a property of the candidate set, not of the database, so the null did
      not test the object the batch was about.
    - >-
      THE CONTRAST THAT CARRIED THE FORCE. The uniform arm sits at
      0.919 +/- 0.005 across seven of eight arms and moves only with rank(X),
      held fixed everywhere. It discriminates nothing.
    - >-
      THE DIRECTION AS A FINDING. ST-6 <= K-1 by Cauchy-Schwarz, 0 of 2000
      violations, so "DOWNWARD" is a theorem. The D3 branch is unreachable via
      z1 at K=8.
    - >-
      THE 0.44x-AGAINST-0.22x SPREAD. A denominator artifact: numerators 13.306
      against 13.532, so the sums family is LESS departed; against nominal K the
      values are 0.541 and 0.532, indistinguishable.
    - >-
      LIM-T2. `adjacent_bins_10` at K=10 exists for every p in the producer's
      own archive, and the three matched-K departures are -3.95%, -1.98% and
      +2.41% -- sign-inconsistent on the only candidate family a dual attack
      enumerates.

  what_survives:
    - >-
      A 4-9% OBJECT-SPECIFIC RESIDUAL, found independently by both reviewers
      (validator DEF-1; red team, the real family 3-11% below every ablated
      control). Both looked for a way to ablate it and neither found one. IT IS
      THE ONLY QUANTITY IN FIVE BATCHES TO SURVIVE ITS OWN REVIEWERS' ABLATIONS,
      and it is unresolved at n = 2 against a comparator interval
      (0.450-0.504) that spans the real 0.4149.
    - >-
      The mechanism, now understood: with short offsets the cosine channel is a
      pure common mode (variance share 0.9999-1.0000 in every short-offset arm),
      forcing all discrimination into a sin channel of rank at most m = 35 --
      the same m=35 effect the producer found, acting at MATCHED K through
      channel composition rather than only at K > 512 through rank truncation.
    - >-
      Pre-registration ordering, verified by log timing, with DEV-2 as its
      proof: the producer's own band was missed and recorded as missed.
    - >-
      No quiet re-scoring: the frozen rule replayed on archived z-scores across
      33 cells with ZERO mismatches, post-hoc labelling correct and complete.
    - >-
      T0, closing the prior observable at 12.9603, reproduced by the red team
      with its own seed and scorer.
    - >-
      The first archive in this campaign whose certificate is checkable from the
      snapshot alone: 0 of 959,745 violating, certified from vectors.json by the
      validator with stock numpy.
    - >-
      The decay test, which the validator ran and the producer had not: monotone
      0.8646 -> 0.9919 as offset length grows. The destroying parameter is
      offset length, not lattice membership.

  knowledge_entry_assessment:
    entry: KN-TECH-6c0e15
    verdict: >-
      ADMISSIBLE AND MATERIALLY BETTER than the entry it supersedes. Criteria,
      not advice: four of five obligations are mechanically checkable, and the
      fifth ships `verdict_on_the_null_arm: RUN IT FIRST` as a one-comparison
      proxy. Mode 4 encodes DEV-3 accurately, with the right diagnosis, and both
      reviewers agree it would have caught it prospectively in one line.
    the_strongest_thing_said_for_it: >-
      The validator's: "the entry is checkable enough that I used it to convict
      the batch that wrote it." The obligation-4 control the validator ran --
      the one that reduced the factor of 2 to 1.10 -- is the entry's own move 2,
      which the producer did not run.
    corrections_owed: >-
      Two, by SUPERSESSION and not overwrite: the DEV-3 cell count is 33 of 33
      (21 T1 of which 7 null, plus 12 T2), not "18 including six"; and the
      forcing is scoped to K > m, which is vacuous at the K = 8 and K = 25 where
      every headline cell sits. The red team adds that mode 4 case B misattributes
      the all-D2 result to rank(Cov) <= m "for any K > m" for the same reason.

  coordinator_error_corrections:
    - id: CE-1
      title: >-
        I fabricated attribution in an immutable commit message, while following
        a quotes-or-nothing rule I had adopted one batch earlier.
      raised_by: RT-20260804-0ff29a OBJ-7
      what_i_wrote: >-
        Snapshot commit 82bcbbe4 attributes at least seven strings to the
        producer, twice under the word "verbatim". Those strings appear in NO
        producer artifact; their only occurrence is my own snapshot_receipt.json.
        The producer's third-person "it says exactly which part" is rendered
        first-person as "I can say exactly which part".
      why_it_is_wrong: >-
        The strings came from the producing agent's transient response message,
        not from any archived path. A quotation the archive cannot support is
        not a quotation. Rendering a third-person paraphrase in the first person
        additionally misstates who said it.
      why_this_is_the_worst_one_yet: >-
        The six prior commit-message defects in this program were dropped scope
        or unqualified conclusions -- errors of framing. This is fabricated
        attribution, and it was committed IN THE ACT of following a rule adopted
        to prevent framing errors. The rule made the output look MORE rigorous
        while making one property of it false.
      what_the_reviewers_confirmed_instead: >-
        Both searched and found NO security claim anywhere in the message, and
        no surviving present-indicative Coordinator conclusion. The rule held
        for what it was adopted for and broke in its mechanism.
      corrective_rule_adopted: >-
        Quote only from a path that appears in the declared artifact set, and
        CITE THE PATH inline. A subagent's response message is not an archived
        source and may be summarised in my own words, attributed to the task id,
        never quoted.

    - id: CE-2
      title: I propagated a ratio without checking its denominator.
      raised_by: VAL-20260804-264ab9 DEF-2
      what_i_wrote: >-
        "0.44x nominal", in the snapshot message and again in the review card I
        wrote.
      why_it_is_wrong: >-
        It is 0.44x CAL-PERM and 0.53x nominal. Against nominal K the two
        families are 0.541 and 0.532 -- indistinguishable, not 2:1.
      corrective_rule_adopted: >-
        A ratio is not restated without naming its denominator in the same
        sentence.

  explicit_non_claims:
    - No ML-KEM break. No attack implemented, run, or claimed. No speedup.
    - No security proof and no security claim in either direction.
    - No FIPS 203 parameter set affected or cleared. Toy scale, rule 4 in full.
    - >-
      The independence heuristic is NOT shown to fail. The headline is weakened
      to 1.10 and what remains is a residual unresolved at n = 2.
    - >-
      No operational sign, in either direction. The correct candidate is
      excluded from every candidate group.
    - No exponent moved, no cost reduced, no attack improved.

  official_status_changes:
    - record: EV-MLKEM-d777f0
      from: null
      to: recorded
  official_status_changes_note: >-
    GOAL-MLKEM-004 remains `active` at batch 5 of 6. No other record changes
    status.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED THIS BATCH. KN-TECH-6c0e15 was already created and
      superseded KN-TECH-9d21c4 under DEC-20260804-5c9fe1 NA-3, so there is
      nothing new to promote here -- and it now carries two corrections owed
      (INT-3), which must be issued as a further supersession rather than an
      edit. Promoting the surviving 4-9% residual would be promotion of an n = 2
      result whose own comparator interval spans it, which is precisely the
      failure the entry exists to prevent. The two promotions inherited from
      GOAL-MLKEM-003 remain rule-12 blocked.

  ranking_rationale: >-
    Batch 6, the last under the current budget, spends its first minutes on the
    one open quantity rather than on a new observable. Both reviewers converge
    on the same check and it costs under three minutes. Closing now would be
    premature: the red team is explicit that five rejected observables is a
    fatigue report, not a closure, and the residual, the correlation with the
    correct candidate, and the m-dependence are all open.

  limitations:
    - One instance, one database, n = 2 on the surviving residual.
    - >-
      The correct candidate is excluded from every group, so no operational sign
      is available.
    - >-
      Every participant across batches 1-5 resolves to claude-opus-5.
      Independence is procedural, not model-level.

