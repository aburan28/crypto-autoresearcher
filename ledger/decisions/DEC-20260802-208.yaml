  rationale:
    - >-
      RT-215-C1 is the cheapest decisive mutation: producer R=G can incur no
      informative producer collision while a sound verifier performs the DLP
      work. Therefore producer correctness and verifier or certificate work
      must be separated before any lower bound is stated.
    - >-
      A fixed symbolic transcript independent of alpha, with raw-encoding
      branches and the exact collision/output-agreement root union, is the
      narrow remaining route to a producer-output lemma.
    - >-
      One bounded proof attempt and one independent adversarial review are
      sufficient to decide whether this exact repair is retained as an
      unverified theorem candidate or paused with a named obstruction.
    - >-
      Cheon auxiliary-input DLP and generalized nonlinear-target generic
      hardness are prior art, so repairing this package cannot establish
      novelty or a breakthrough.
