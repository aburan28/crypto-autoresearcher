      Set producer output R=G and use a perfectly sound ordinary generic-DLP
      verifier. Record that producer correctness cannot be inferred from a
      producer-only certificate/collision event; verifier work is separate.
    symbolic_game:
      - Fix a symbolic transcript and its coins independently of alpha.
      - Enumerate equality and raw-encoding-dependent branches.
      - Form the exact union of collision roots and output-agreement roots.
      - Require an oracle-issued output handle or add an encoding-guess term.
    cost_boundary:
      - Retain the q_g+1 online-label boundary in preprocessing cross terms.
      - Charge preprocessing construction, accesses, comparisons, and amortization.
      - State per-attempt cost times inverse success for expected work.
      - Record peak memory and data/query movement separately.
      - Recompute Pareto dominance piecewise and use not_applicable where an ordinary row is inadmissible.
