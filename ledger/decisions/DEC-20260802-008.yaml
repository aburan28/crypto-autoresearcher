coordinator_decision:
  id: DEC-20260802-008
  supersedes_scope_of: DEC-20260802-001
  context: >-
    Successor to DEC-20260802-001, which authorized a re-baseline only
    conditionally and only for the immutable-run-manifest class, on the
    assumption that a ~470-line remainder was repairable. The executing session
    measured that remainder and reported that the assumption is false: repairing
    the pre-current-schema run manifests and the cross-experiment duplicate run
    IDs both require editing committed run artifacts, which
    tools/check_run_immutability.py correctly blocks; the dangling evidence
    references are largely downstream of those unregistered run packages rather
    than independent broken pointers; and most of what remains is evidential or
    curatorial judgement, not mechanics. "Repair the rest first, then baseline
    the irreducible" is therefore not an available plan, and DEC-20260802-001
    step 4 cannot be executed as written. This decision replaces that step. It is
    repository hygiene and disclosure policy. It resolves no research question,
    reviews no run set, and creates no evidence.
  decision: approve
  target_ids:
    - DEC-20260802-001
    - CORR-20260802-014
    - VALIDATOR-BASELINE-PR87
    - RUN-ID-COLLISION-FCP-IC
    - UNEVIDENCED-RECORDS-XEDN
  rationale:
    - >-
      GATE 0 — TWO RECONCILIATIONS BEFORE ANYTHING ELSE. (i) The executing
      session reports "applied your remapped_ids edit, added the 9 new remap keys
      to records with their sha256". DEC-20260802-001 and TASK-20260802-901
      forbade any edit to tools/legacy_ledger_inventory.yaml, and the working
      tree readable by this Coordinator shows that file unmodified: `records`
      ends at ledger/DEC-20260722-006.yaml and `remapped_ids` holds exactly the
      five pre-existing DEC-20260722-* entries. Under
      test_legacy_inventory_covers_and_freezes_every_root_record, which asserts
      set(records) == the observed root-level ledger files, adding keys for the
      fourteen deleted root paths would make that test FAIL, so the report and
      the reported test result cannot both be true. The likeliest reading is that
      the report is inaccurate and the correct thing was done. That must be
      confirmed, not assumed: a misdescribed integrity artifact is exactly the
      class of report this program does not accept silently, and if some other
      worktree does carry those nine keys, that tree is broken. (ii) The two
      reported breakdowns sum to 1106 (915 blocked + 191 itemized), not the
      reported 1111. A re-baseline is a counting operation; an unreconciled
      five-line gap is precisely where absorption hides. Neither the repair nor
      the re-baseline proceeds until both reconcile.
    - >-
      RULING ON QUESTION 1 — THE 235 DUPLICATE RUN IDs MAY BE BASELINED, BUT ONLY
      WITH A COMPENSATING CONTROL IN THE SAME COMMIT. The finding is accepted:
      RUN-FCP-fixed-b16-s1-t0 under EXP-FCP-001, EXP-FCP-002 and EXP-IC-001 with
      three distinct sha256 values is not a duplicated record, it is three
      distinct runs sharing a parameter-descriptive name. That is a consequence
      of the run naming scheme, not of ID reuse in the AGENTS.md sense: every
      other record type carries a typed, serialized ID pattern, while RUN_ID is
      the open pattern ^RUN-[A-Za-z0-9._-]+$ and runs are physically namespaced
      under experiments/<EXP>/runs/. Renumbering would mean rewriting committed
      run artifacts, and the immutability gate is right to refuse that.
    - >-
      (Q1, continued) BUT THESE ARE TRUE POSITIVES WITH A LIVE CONSEQUENCE, so
      they may not simply vanish. validate_ledger.py registers only the FIRST
      manifest globbed under a colliding ID and drops the rest, which means
      (a) an evidence record citing a colliding run ID resolves to an
      arbitrarily selected manifest, and (b) the claim-tier ceiling check
      evaluates tier_of_run against that arbitrary manifest's parameters. If two
      same-named runs differ in field_bits, a `crypto` or `medium` claim_tier can
      be validated against the wrong run. That is a live route to the exact rule-7
      failure — toy evidence passing as crypto-scale — that this program exists to
      prevent. Baselining the symptom while leaving that route open is not
      acceptable; baselining it while closing the route is.
    - >-
      (Q1, ruling) The 235 lines enter the baseline only in a commit that also
      lands, together: (C1) tools/duplicate_run_ids.yaml, schema
      duplicate-run-id-inventory-v1, mapping each colliding run ID to the list of
      {path, experiment_id, sha256} it occurs under, generated by reading the
      tree with no manifest touched; (C2) a test asserting the observed
      duplicate-run-ID set equals that frozen set EXACTLY and that each listed
      path still exists at its recorded hash — a must-not-grow set on the pattern
      already used for PRE_QUORUM_GOAL_IDS, so a NEW collision still fails CI;
      (C3) a validator check that any evidence record whose run_ids cite an ID in
      the frozen set must qualify it with its experiment (EXP-XXX-NNN/RUN-... or
      an explicit run_refs mapping), an unqualified citation being an error that
      is NOT baselined; and (C4) a CORR-* record stating the collision, the claim
      boundary below, and that no run artifact was modified.
    - >-
      (Q1, claim boundary — this is the load-bearing sentence) For every evidence
      record citing a colliding run ID, provenance is ambiguous and its declared
      claim_tier was validated against an arbitrarily selected manifest. Until
      C3 qualification lands for that record, its claim tier is UNVERIFIED and it
      may not be cited in support of any hypothesis status transition. This
      boundary is recorded, not estimated: it says nothing about whether the
      underlying runs are sound, only that the repository cannot currently tell
      which run a citation means.
    - >-
      (Q1, escape hatch) If C1-C4 cannot be built in this pass, the answer to
      question 1 is NO — the 235 lines stay out of the baseline, the test stays
      red, and that is reported as the outcome. The executing session's offer to
      report rather than launder is the correct instinct and is endorsed.
    - >-
      RULING ON QUESTION 2 — BASELINE THE LARGER SET, WITH FIVE NAMED CATEGORIES,
      TWO MECHANICAL REPAIRS FIRST, AND TWO DISCLOSURE REGISTERS. The binary was
      posed fairly and I choose the former, for one reason that survives scrutiny:
      the baseline matches error lines EXACTLY, including the path. A new
      violation at a new path produces a line that is not in the baseline and
      still fails CI. So this re-baseline does not weaken the gate against future
      violations at all — it only removes existing, disclosed debt from the
      default output. Set against that, a permanently red gate is not a gate: at
      1111 lines nobody reads it and the next real violation lands invisibly.
      That is the worse integrity outcome. The full debt remains inspectable at
      any time with --no-baseline, so nothing is destroyed, only moved out of the
      default path.
    - >-
      (Q2) MUST BE REPAIRED, NOT BASELINED — two lines, no judgement required:
      KN-FIND-002's `type: finding` must read `internal_finding` (the file sits in
      knowledge/findings/ and the schema admits exactly one value there), and the
      malformed EXP-PMA4-001 experiment ID, which is the digits-in-area-code
      defect CORR-20260728-001 already has a precedent and remedy for. Both are
      content-preserving. Repairing anything mechanical and then baselining it
      anyway is the one move that would make this decision dishonest.
    - >-
      (Q2) THE EVIDENTIAL JUDGEMENTS ARE CORRECTLY REFUSED AND I DO NOT TAKE THEM
      EITHER. EV-XEDN-002 through -006 lack run_ids, direction, strength,
      proof_status and proof_refs. `direction` and `strength` ARE the evidential
      finding; assigning them without reviewing the XEDN run sets would be
      fabrication under rule 9, and the fact that I am the only role permitted to
      assign them does not mean I am able to. The same holds for the 11 KN-FIND
      entries' confidence and proof_status. The executing session was right to
      stop. But an evidence record with no direction and no strength states
      nothing, and the danger of baselining that is that a later reader cites it
      as though it did. Hence (C5): ledger/registers/unevidenced-records.yaml, a
      committed register naming EV-XEDN-002..006 and the 11 KN-FIND entries as
      evidentially incomplete, with the standing rule that NONE of them may be
      cited in support of a hypothesis transition, a synthesis statement, or a
      knowledge promotion until a Coordinator evidence review assigns the missing
      fields. That converts a hidden gap into a disclosed and enforced one.
    - >-
      (Q2) THE DANGLING EVIDENCE REFERENCES ARE DISCLOSED ON THE RECORD, NOT JUST
      IN THE BASELINE. The finding that 39 of 46 name a run whose directory exists
      but carries no manifest.yaml, 7 name no directory at all, and 22 belong to
      EV-SIG-008 alone, is accepted and is consistent with what the EV-SIG-008
      record itself says about its artifacts being destroyed. These lines may be
      baselined only where the affected evidence record carries an explicit
      committed statement that the cited artifact is absent from this repository —
      the same treatment already applied to EV-GPS-001, EV-SIG-008 and EV-DREG-004
      in CORR-20260802-014. Where a reference resolves by lookup, it is repaired,
      not baselined.
    - >-
      (Q2) EXP-SIG-008's specification.yaml stays as it is. Authoring a structured
      contract for a frozen experiment after the fact would manufacture a
      protocol that never governed the runs, which is worse than an unparseable
      file. It is baselined with the scope limit recorded: EXP-SIG-008 has no
      machine-readable contract, so nothing built on it can claim a
      pre-registered protocol, and EV-SIG-008's experiment reference will not
      resolve.
    - >-
      RULING ON QUESTION 3 — THE AMENDMENT GOES IN THE CODE CONSTANT, NOT THE
      FILE. This is load-bearing and easy to get wrong: write_baseline() emits the
      hardcoded BASELINE_HEADER string from tools/validate_ledger.py and then the
      sorted entries. An amendment appended to tools/validate_ledger_baseline.txt
      after regeneration would be silently erased by the next --update-baseline
      prune, leaving a re-baselined file wearing the old only-ever-removed header.
      The amendment must therefore replace the BASELINE_HEADER constant in
      tools/validate_ledger.py in the same commit, so every future regeneration
      carries it forward. load_baseline() skips lines beginning with '#', so
      additional header lines are safe. Exact text in next_actions step 4.
    - >-
      RULING ON QUESTION 4 — YES, `rm` PLUS --update-baseline IS THE SANCTIONED
      MECHANISM, NAMED HERE AS REQUIRED. --update-baseline is prune-only by
      design: it computes (old & current) when the file exists and bootstraps to
      `current` only when it does not, so it cannot grow an existing baseline.
      Regeneration therefore requires deleting tools/validate_ledger_baseline.txt
      first. That deletion is authorized, once, for this operation only, under the
      conditions in next_actions. The pre-image is preserved by git history, which
      is what makes the deletion recoverable rather than destructive. Note that
      --update-baseline exits 0 and prints only the entry count; it does not
      report which lines were added, so the diff must be reviewed by hand.
    - >-
      WHAT THIS DECISION DOES NOT CLAIM. It does not claim the underlying runs are
      sound, reproducible, or correct — it claims the opposite is disclosed. It
      does not claim any evidence record is now adequate. It does not claim the
      duplicate-ID collisions are harmless; it records a specific claim boundary
      they impose. It changes no hypothesis status and promotes nothing. It
      asserts nothing about ECDLP and nothing at cryptographic scale. A green
      pytest after this work means the declared debt is declared, not that the
      repository's evidence is in good standing.
    - >-
      METHOD LIMITATION, RESTATED. This Coordinator cannot execute git,
      validate_ledger.py, or pytest. Every count in this decision is second-hand
      from the executing session and at least one reported fact (the inventory
      edit) is inconsistent with the tree I can read. The baseline set is
      therefore specified as a PREDICATE, not a number, so that it is checkable
      against a later run without relying on any figure I could not verify.
  protocol_amendment:
    invariant: >-
      tools/validate_ledger_baseline.txt lines may only ever be REMOVED; never
      add a line to absorb a new violation.
    prior_form: >-
      Stated in the file header and in the validate_ledger.py module docstring;
      enforced in practice by --update-baseline being prune-only.
    amended_form: >-
      The invariant is unchanged in force but is re-anchored once, on 2026-08-02,
      to a regenerated baseline. Exactly one re-anchoring is authorized, by this
      decision, for the five categories named below. The invariant resumes
      immediately from that point: a later addition is a contract violation, not
      a second re-anchoring.
    authorized_categories:
      - >-
        C1 run manifests on the pre-current schema — run missing required field,
        run directory missing artifact, run.code.commit missing, run.code.command
        missing, run.result.certificate.kind invalid. Repair blocked by
        tools/check_run_immutability.py.
      - >-
        C2 run IDs shared across EXP-FCP-001 / EXP-FCP-002 / EXP-IC-001. Same
        immutability block. Admitted ONLY with controls C1-C4 of the Q1 ruling.
      - >-
        C3 evidence records citing runs or experiments whose artifacts are absent
        from this repository, including EXP-SIG-008's unparseable specification.
        Admitted ONLY where the affected record carries a committed statement of
        the absence.
      - >-
        C4 evidence records missing direction/strength/run_ids/proof fields.
        Admitted ONLY with the unevidenced-records register and its citation
        prohibition.
      - >-
        C5 knowledge frontmatter pending curation — literature tags, KN-FIND
        confidence/added/internal_refs/proof_status/proof_refs, internal-finding
        schema. Admitted with a scheduled curation task.
    excluded_from_amendment:
      - KN-FIND-002 `type` value (mechanical repair)
      - EXP-PMA4-001 malformed experiment id (mechanical repair)
      - >-
        Any line naming a record created by the DEC-20260802-001 relocation,
        except the lines itemized in CORR-20260802-014
        unrepaired_defects_carried_forward.
      - Any unqualified evidence citation of a colliding run ID (control C3).
    recorded_by: DEC-20260802-008
  evidence_refs:
    - tools/validate_ledger.py
    - tools/validate_ledger_baseline.txt
    - tools/test_validate_ledger.py
    - tools/legacy_ledger_inventory.yaml
    - tools/check_run_immutability.py
    - ledger/decisions/DEC-20260802-001.yaml
    - ledger/corrections/CORR-20260802-014.yaml
    - ledger/corrections/CORR-20260728-001.yaml
  limitations:
    - >-
      No command was executed by this Coordinator. Every count originates with
      the executing session and one reported fact contradicts the tree I can
      read; gate 0 exists for that reason.
    - >-
      The reported category totals do not reconcile with the reported total
      (1106 vs 1111). No re-baseline may proceed on an unreconciled count.
    - >-
      A green CI after this work certifies only that declared debt is declared.
      It certifies nothing about the runs, the evidence records, or any claim
      built on them.
    - >-
      The claim boundary on colliding run IDs is a statement about repository
      resolvability, not about the runs. It does not assert that any specific
      evidence record overstated its tier; it asserts that the check which would
      have caught that was operating on an ambiguous binding.
    - >-
      EV-XEDN-002..006 and the 11 KN-FIND entries remain evidentially incomplete
      after this decision. Nothing here supplies the missing judgement; it only
      prevents the gap from being cited as though it were filled.
  next_actions:
    - >-
      0. GATE 0, before any other step. Report: `git show --stat 27e38a09` and
      `git show --stat 6ad3f00a`; the current `records` tail and full
      `remapped_ids` block of tools/legacy_ledger_inventory.yaml; confirmation
      that the fourteen root paths are absent from disk; confirmation that
      tools/test_validate_ledger.py and tools/check_run_immutability.py were not
      modified in either commit; and a reconciliation of 1106 vs 1111 naming the
      five unaccounted lines. If either test file or the immutability gate was
      modified, STOP — changing the gate is a separate decision, not part of this
      one.
    - >-
      1. Repair the two mechanical items in one commit: KN-FIND-002 `type:
      finding` -> `internal_finding`; EXP-PMA4-001 malformed experiment id
      following the CORR-20260728-001 precedent, with a CORR-* record. Do not
      baseline either.
    - >-
      2. Land the disclosure controls in one commit: tools/duplicate_run_ids.yaml
      (C1) and its must-not-grow test (C2); the validator check requiring
      experiment-qualified citation of a colliding run ID (C3); the CORR-* record
      carrying the claim boundary (C4); ledger/registers/unevidenced-records.yaml
      naming EV-XEDN-002..006 and the 11 KN-FIND entries with the citation
      prohibition (C5); and the explicit absence statements on the evidence
      records whose dangling references are to be baselined. If C1-C4 cannot be
      built, STOP and report — question 1's answer becomes NO and the test stays
      red.
    - >-
      3. Define the baseline set by PREDICATE, not by a number: every error line
      reported by `python3 tools/validate_ledger.py --no-baseline` on the tree
      produced by steps 1-2, EXCEPT any line in the excluded_from_amendment list
      above. Verify by inspection that no excluded line appears before writing
      anything.
    - >-
      4. Replace the BASELINE_HEADER constant in tools/validate_ledger.py with
      the text below, filling <N>, <M> and each <Cn> count from the actual run.
      Do NOT append it to the .txt file; write_baseline() would erase it on the
      next prune.

      # Grandfathered validation errors — legacy records that predate the
      # validator, plus one documented re-anchoring. Each line matches one error
      # exactly as validate_ledger.py reports it.
      #
      # INVARIANT: lines may only ever be REMOVED (as records are repaired or
      # superseded); never add a line to absorb a new violation. Prune stale
      # lines with: python3 tools/validate_ledger.py --update-baseline
      #
      # RE-ANCHOR 2026-08-02, authorized by DEC-20260802-008 and recorded as a
      # protocol_amendment there. This file was regenerated once, growing from
      # 1138 to <N> lines. The <M> added lines are pre-existing debt in these
      # categories only:
      #   <C1> pre-current-schema run manifests (missing required field, missing
      #        companion artifact, missing code.commit/code.command, invalid
      #        certificate.kind) — repair blocked by tools/check_run_immutability.py
      #   <C2> run IDs shared across EXP-FCP-001/EXP-FCP-002/EXP-IC-001 — same
      #        block; disclosed in tools/duplicate_run_ids.yaml, which must not grow
      #   <C3> evidence citing runs/experiments absent from this repository —
      #        disclosed on each affected record
      #   <C4> evidence records missing direction/strength — disclosed in
      #        ledger/registers/unevidenced-records.yaml; none may support a
      #        hypothesis transition until reviewed
      #   <C5> knowledge frontmatter pending /curate-knowledge
      # No mechanically repairable line was absorbed. The full debt stays
      # inspectable with --no-baseline. The only-ever-removed invariant resumes
      # from this point: a later addition is a contract violation, not a second
      # re-anchoring.
    - >-
      5. In the SAME commit as step 4: `rm tools/validate_ledger_baseline.txt`,
      then `python3 tools/validate_ledger.py --update-baseline`. Then review the
      diff line by line against the step-3 predicate. The deletion is authorized
      once, for this operation only; the pre-image lives in git history.
    - >-
      6. Verify before pushing: `pytest -q` green; a second immediate
      `--update-baseline` is a no-op (proves the set is stable); `--no-baseline`
      still reports the full debt; and the added-line count equals <M>. Push and
      refresh the PR naming DEC-20260802-008, the new CORR-* records, and the
      control artifacts.
    - >-
      7. Report the final counts, the added-line category table, and the test
      state back to the Coordinator. I will record them in a closing DEC-* so the
      header is checkable against a committed record, not only against a commit
      message.
    - >-
      8. Dispatch a bounded /curate-knowledge task for category C5: literature
      tags derived from each entry's own body and title only; `added` taken from
      the file's introducing commit, never invented; `confidence` from the
      entry's own stated basis, and left EMPTY with a report back if the body
      does not determine it; `proof_status` limited to the declared values with a
      written reason. An assigned confidence that cannot be justified from the
      entry is worse than an empty field.
    - >-
      9. Open as tracked, non-blocking follow-ups: experiment-qualifying every
      evidence citation of a colliding run ID (lifts the Q1 claim boundary
      record by record), and a Coordinator evidence review of EV-XEDN-002..006 to
      assign direction and strength (lifts their citation prohibition).
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. It reviews no run set, changes no
      hypothesis status, and produces no durable research claim. Deciding how a
      validator baseline accounts for pre-gate debt, and what disclosure must
      accompany it, is repository hygiene and disclosure policy — not a finding
      about ECDLP or about any hypothesis in this ledger. Nothing here approaches
      the replicated/strong threshold a KN-FIND requires.
  decided_by: coordinator
  decided_at: "2026-08-02"
