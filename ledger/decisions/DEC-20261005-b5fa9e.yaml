  context: >-
    /design-experiment, one contract. IDEA-20261005-ddbf31 already has
    H-MONO-9df9c0 and EXP-MONO-220932 from pull request 1841
    (branch design/mono-ddbf31-wreath), so it was skipped. The next
    ranked idea, IDEA-20261005-70b25b, had no hypothesis and no
    experiment citing it on origin/main or in open pull requests.
    The branch design/cycle-20261005-domain was created from origin/main
    at 0b8c5f815b10085586deb70f73e257eb49cb79c3. A later merge fast-forwarded
    to f5b5a0efae5331bac173f05f5bf70c2b32f82225 before this snapshot. No
    conflict. Pull request 1841 merged in that fast-forward, so
    IDEA-20261005-ddbf31 already has EXP-MONO-220932 and was not redesigned.

    The contract measures the signed-sum fibre Psi over the ordered base
    at p = 101. It is not a heuristic validation of an asymptotic theorem
    and not a concrete-cost table. The pre-registered prediction is group
    order exactly 4 with exponent 2, versus order dividing 2, versus an
    escape from the degree-at-most-4 closure. The four ordinary curves are
    the idea's minimal panel. j = 0 at this prime is supersingular
    (101 ≡ 2 mod 3); that fact is disclosed and the curve stays on the
    artifact panel only.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is the order-4 row and
    fails when the panel shows a proper subgroup, a mixed locus, an
    escape, a partition break, or a 3-cycle. No field required for
    approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading are fixed before any run.
    - The character-product control, the null quartic, and the inertia agreement check give the order reading a way to come back inconclusive instead of fabricating a group from a broken sampler.
    - A partition-breaking permutation and an order-8 image are reachable negative results, so the success criterion can fail.
    - No monodromy permutation was computed while writing this decision.

