        V2_logdens (G-REL1 10 of 10, G-REL2 19 of 19, best mean 0.6000, bit-identical
        38 of 38) and V3_nullscaled (10 of 10, 16 of 19, bit-identical 38 of 38, max |X|
        0.5322 -- INSIDE hkz's own realized magnitude range and below hkz's own scale
