      status: ONE probe, ONE run, ONE reviewer (probe_nullroute.py, 0.31 s). WAVE 2 DID
        NOT TEST ROUTES R2, R4 OR R5 AND DID NOT RE-RUN THE PROBE. Its Red Team's
        matrix path is route R1, on which both waves agree (38 of 38, refused).
        Re-running probe_nullroute.py costs 0.31 s and a successor still should.
    S1-2_OBS-3_the_producers_own_committed_number_carrying_the_same_fact:
      what: >-
        results_relvar.json records forced_arithmetic.rdet_T1_ambient_isometry_residual
        = 3.865352482534945e-12 while rdet_T2_permutation_residual and
        rdet_T3_unimodular_residual are exactly 0.0 and X_null_all_transforms is exactly
