  # ==================================================================
  # 5. THE ONE SYNTHESIS AVAILABLE ONLY BY READING BOTH CHAINS
  # ==================================================================
  synthesis_that_neither_wave_could_reach_alone:
    the_finding: >-
      AM-16 OF DEC-20260809-afe29b REPLACES G-VAR WITH G-VAR2 -- a SCALED dispersion
      criterion, between-basis sd measured against the candidate's own between-cell
      range at fixed (d, k), reported as a per-cell profile -- and AM-16(d) requires
      G-VAR2 to be VALIDATED, before it governs anything, against the six routes already
      built and committed in probe_nullroute.py, whose recorded output declares the
      target behaviour in advance. THAT VALIDATION FIXTURE LIVES ENTIRELY INSIDE FAMILY
      F0. Wave 2's RT-R1 shows that in F1 -- one line different -- both rdet and X_null
      acquire genuinely large between-basis dispersion (8 distinct doubles strictly
      increasing in the basis index) while still reading zero entries of A. A SCALED
      CRITERION WOULD ADMIT THEM THERE. So G-VAR2, AS SPECIFIED AND AS VALIDATED BY
      AM-16(d), INHERITS THE EXACT DEFECT RT-R1 NAMES, AND THE AM-16 FIXTURE CANNOT
      DETECT IT. Neither wave could see this: wave 1 wrote AM-16 without F1, and wave 2
      built F1 without ever reading AM-16.
    the_consequence_recorded_as_amendment_AM-17: >-
      AM-17 (a) AM-16 IS NOT WITHDRAWN. Its (a) through (g) stand and are not
      re-litigated; the scaled criterion, the two-declared-routes requirement, the
      withdrawal of the all-cells reduction, the graded-guard requirement, the
      non-constant-injection requirement and the sampling-dispersion requirement are all
      retained. (b) AM-16(d)'s VALIDATION FIXTURE IS EXTENDED AND IS NOT SUFFICIENT AS
      WRITTEN. G-VAR2 must be validated against BOTH fixtures before it governs
      anything: the six arithmetic routes of probe_nullroute.py IN F0 (all six routes to
      X_null and to rdet REFUSED; lam1n, hkz and rawtail ADMITTED), AND the nearby
      family F1 of probe_gvar_family.py (X_null and rdet REFUSED THERE TOO). (c) THE
      SEPARATOR THAT BOTH FIXTURES TOGETHER POINT AT is the one wave 2 names and neither
      wave scored: dispersion ON THE FIBRE OF THE FAMILY OVER THE OBSERVABLE'S OWN
      DECLARED ARGUMENTS -- a clause requiring X to be non-constant on the fibre,
      evaluated on a family constructed to hold that argument fixed. A candidate that is
      a function of |det B| alone must be scored on a family that holds |det B| fixed,
      whatever else varies. (d) EVERY DISPERSION CRITERION IN THIS GOAL MUST DECLARE THE
      FAMILY IT IS EVALUATED ON AS PART OF THE CRITERION, because RT-R1 establishes that
      the verdict is a joint property of (observable, family) and the family has been an
      undeclared free parameter exactly as the arithmetic route was.
    a_PREDICTION_and_not_a_result: >-
      DECLARED HERE, BEFORE THE RUN, SO THAT IT IS A PRE-REGISTERED PREDICTION AND NOT A
      POST-HOC READING. On the committed numbers, wave 2's V_evade carries a
      between-basis float sd of 3.91e-10 against a between-cell range of order 1, so I
      PREDICT that G-VAR2 as specified by AM-16(a) REFUSES V_evade -- i.e. that O-2
      defeats G-VAR but does NOT defeat its replacement, while RT-R1's F1 defeats both.
      ITS FALSIFICATION CONDITION: if the successor's scaled criterion ADMITS V_evade,
      then the scaled operationalization is defeated by a 1e-10 perturbation too and
      AM-16(a) needs its own replacement, not merely the fibre extension. I DID NOT
      MEASURE THIS. It is a derivation from two committed numbers and it must be
      CHECKED by the successor batch, which is why it is written down before that batch
      is specified rather than after it runs.

  # ==================================================================
  # 6. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE DUPLICATE EXECUTION IS A COORDINATION FAILURE AND AN EVIDENTIAL WINDFALL, AND
    BOTH READINGS ARE TRUE AT ONCE. Its mechanism is already correctly diagnosed in
    DEC-20260812-15d3b2 and I adopt that diagnosis without re-litigating it: a reserved
    identifier written into a shared mutable coordination record is a single-writer
    resource handed to every worker that reads it, and `tools/allocate_id.py --check`
    answers from the working tree only, so the one mechanical guard confirmed the wrong
    answer. Random tokens stop two workers minting the same id; they do nothing about
    two workers correctly executing the same reservation. NEITHER WAVE-2 REVIEWER DID
    ANYTHING WRONG AND NEITHER DID THE CONCURRENT BRANCH, whose ledger archive wave 2
    reports conforming on its own terms at 27 declared paths equalling its commit's
    change set exactly.
  - >-
    NEITHER WAVE IS MORE AUTHORITATIVE BY MERGE ORDER, BRANCH NAME OR RECENCY, AND THIS
    RECORD IS WRITTEN SO THAT NO LATER READER CAN INFER OTHERWISE. Wave 2 reached main
    first; that is a fact about branch scheduling and carries no evidential weight. Wave
    1 was written first; that carries none either. Every ruling in section 3 is decided
    on what was measured and by whom, and where nothing decides it (C-1) nothing is
    decided.
  - >-
    THE REPLICATIONS IN SECTION 1 ARE WORTH MORE THAN EITHER WAVE'S HEADLINE, AND THE
    CONFLICTS IN SECTION 3 ARE WORTH MORE THAN THE REPLICATIONS. A batch that produced
    four admissible research receipts and no statement about a lattice has, by accident,
    produced a measurement of its own review process. That measurement (RI-3) is
    recorded at its true strength and no further.
  - >-
    THE ADVERSE READINGS IN THIS RECORD ARE ADVERSE TO STATEMENTS, NOT TO A THEORY, SO
    NO REFUTATION ARTIFACT IS OWED. Nothing here is `weaken`, `reject_scoped`, or a
    hypothesis-status move; my contract requires the strongest checkable refutation
    artifact before an adverse TRANSITION, and none is made. Where an adverse reading
    does rest on an artifact -- C-2 on an argument, C-3 on probe_gvar_family.py, C-4 on
    a Validator's recorded search -- the artifact is named and is already archived or is
    archived by this batch's commits, ahead of this decision, so a successor can check it
    rather than take it.
  - >-
    THE GOAL RECORD IS UPDATED BY SUPERSESSION AND NOTHING IN IT IS DELETED. Its
    current_batch_state carried ONLY the wave-1 narrative, written before wave 2 existed
    and asserting the batch "IS RUN, REVIEWED AND CLOSED"; that text is retained verbatim
    under a superseded_* key exactly as the wave-1 session retained its predecessor's,
    and the replacement names both chains. DEC-20260812-15d3b2's branch_disposition
    refused to touch that file for good reasons that no longer apply: the two branches
    are now in one tree, so the conflict it was avoiding cannot occur, and the cost it
    declared -- that the committed goal record would not name wave 2 -- is what this
    record pays off.
  - >-
    ONE batch_log ENTRY FOR BATCH-9e3584, NOT TWO, naming both decisions, both evidence
    records, both review waves and both snapshot commits. Two entries for one batch would
    misrepresent one batch as two, and the producers ran once.

