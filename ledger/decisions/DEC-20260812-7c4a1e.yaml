    R-11_there_is_no_cost_model_and_no_cryptographic_baseline_anywhere_in_the_batch:
      status: BOTH WAVES CHECKED IT RATHER THAN ASSUMING IT.
      agreeing_values: >-
        No algorithm, no attack, no operation count, no bit-security figure, no FIPS 203
