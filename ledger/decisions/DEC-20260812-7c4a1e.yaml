      status: NOTHING IN WAVE 2 TOUCHES ANY OF IT. See C-4 for the conflict this creates
        with a phrase in EV-MLKEM-e45478.
    S1-6_V-P6_the_G-NUM_measurement_the_batch_never_made:
      what: max rho_T0 = 0.000e+00 exactly for X_null and for both of the wave-1
        Validator's own passing observables, against tau_num = 1e-6, closing the gap
        left by report_relvar.md's assertion of a five-clause universal from four
