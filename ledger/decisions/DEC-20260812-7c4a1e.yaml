  single_source_wave_2_only:
    S2-1_O-2_G-VAR_as_frozen_is_EVADABLE:
      what: >-
        The wave-2 Validator built V_evade(B, beta) = X_null(B, beta) + 1e-9 * A[0,0]/q
        -- the producer's own blind null plus a basis-dependent term of relative size
        about 1e-10, carrying no usable information about the basis -- and pushed it
        through the producer's OWN committed measure_relvar.py, calling the producer's
        own rho_both(), summarize() and bit_identical(). It is NOT bit-identical at ANY
        of the 38 cells (max between-basis float sd 3.91e-10), so G-VAR ADMITS it, and
        it passes G-REL1 at 10 of 10 and G-REL2 at 19 of 19 under every aggregation rule
        including the strictest. G-VAR AS FROZEN IS NECESSARY BUT NOT SUFFICIENT.
      status: ONE construction, ONE run, ONE session. Reproduced by nobody.
      relation_to_wave_1: >-
        NOT the same claim as S1-1, and it must not be recorded as its replication. Wave
        1 perturbs the ARITHMETIC ROUTE and leaves the function untouched; wave 2
        perturbs the FUNCTION and leaves the route untouched. They are independent
        attacks on the same operationalization. What wave 2 DOES do is exhibit as a
        built object the hazard wave 1 stated as an argument in EV-MLKEM-9346bb OBS-14
        and in KN-FIND-2a35aa section 3 -- "a criterion that draws its line at exactly
        zero cannot distinguish 'no information' from 'information at 1e-16'". An
        argument in wave 1 and a construction in wave 2 is a genuine strengthening of
        that specific proposition, and it is recorded as that and not as a replication.
    S2-2_RT-R1_the_refusal_is_conditional_on_the_family:
      what: >-
        G-VAR's firing is a joint property of (observable, family), not a property of the
        observable. The frozen family B_i = [[I_k, A_i],[0, q I_{d-k}]] holds |det B| =
        q^(d-k) CONSTANT across the basis index BY CONSTRUCTION, so every
        determinant-only functional is bit-identical there and G-VAR could not have
        failed to fire on one. The wave-2 Red Team built the nearest family differing in
        EXACTLY ONE respect -- F1: B_i = [[I_k, A_i],[0, diag(m_i)]] with m_i[0] = q + i,
        the same A_i draw, the same d, k, beta grid, mirrored pairs, tau_rel = 0.10,
        s_X = 1.0 and the identical code path -- and scored it. G-VAR fires 38 OF 38 ON
        BOTH rdet AND X_null IN F0 AND 0 OF 38 ON BOTH IN F1, while X_null still passes
        G-REL1 10/10 and G-REL2 19/19 and still reads ZERO ENTRIES OF A_i in either
        family. A separate witness probe reports F1's X_null taking 8 distinct IEEE-754
        values strictly increasing in the basis index at 6 of 6 cells tested, against 1
        distinct value at 6 of 6 in F0, so its entire between-basis variation is a
        monotone relabelling of the index. Cost 0.24 s per candidate at d <= 140, no
        reduction.
      the_concession_the_red_team_records_at_the_same_weight_and_i_carry: >-
        F0 is the family in which G-VAR has the MOST power against a determinant-only
        functional, precisely because it holds |det| fixed, so the producer's family
        choice is not wrong; and in F1 the lattices genuinely differ, so admitting a
        determinant functional there is not obviously an error. THE OBJECTION THAT
        SURVIVES BOTH CONCESSIONS: G-VAR cannot distinguish "this observable reads the
        instance" from "this observable reads a nuisance parameter that happens to vary
        across the family", and nothing in the batch tests it against a family where
        those differ.
      status: >-
        ONE probe, ONE run, ONE session. Reproduced by nobody. THE MOST
        CONSEQUENTIAL SINGLE-SOURCE ITEM IN EITHER WAVE, and the cheapest to check:
        run probe_gvar_family.py and show either that F1 does not differ from F0 in
        exactly one respect, or that its 0-of-38 result does not reproduce.
    S2-3_F-2_the_undeclared_ACROSS_CELL_aggregation_rule:
      what: >-
        Beyond the declared per-basis completion (R-4), there is a SECOND, UNDECLARED
        aggregation: G_REL_PASS at measure_relvar.py lines 816-819 collapses ACROSS
        lattices and cells with an ANY rule -- REL1 passes if at least one scored lattice
        passes, REL2 if at least one scored cell passes. That rule is not in the frozen
        text and is not listed among the implementation completions, and it is what
        selects R-OUT-4 over R-OUT-5 and produces the reported "2 of 5" count. THE
        DEFECT IS THE NON-DISCLOSURE, NOT THE VERDICT: R-OUT-4 is correct under the
        frozen text's own "majority" language, since REL1 10 of 10 and REL2 14 of 19 are
        both majorities. LABELLED POST-HOC AND UNCITABLE AS A RESULT OF THIS BATCH:
        under an ALL-cells rule rawtail would fail G-REL, R-OUT-5 would fire, and prereg
        2.10 would then suppress every G-REL verdict on every other candidate in either
        direction. X_null passes under all three rules (10 of 10 and 19 of 19), so
        R-OUT-1 is INVARIANT to the choice.
      status: WAVE 1 EXAMINED THE PER-BASIS COMPLETION IN DEPTH AND DID NOT FIND THIS
        ONE. See the recall measurement at RI-1.
    S2-4_RT-C1a_and_RT-C1b_the_missing_nulls_for_section_C:
      what: >-
        (a) AM-14(e)'s "four of ten targets have SE_2way/SE_naive < 1" reduces to a
        CONTROLLED NULL: on 200,000 effect-free iid-normal 8x4 tables through the
        identical carried se_decomposition, P(ratio < 1) = 0.3982, so the expected count
        is 3.98 OF 10 AGAINST 4 OBSERVED, with null median 1.0896, p05 0.3871 and p01
        0.1785; a permutation null agrees target by target within 0.03 in percentile;
        the extreme value 0.3635 sits at the 4.4th percentile of the iid null and the
        4.1st of its own permutation null, and across 10 targets the chance at least one
        falls that low is about 36%. IT IS A CONTROLLED NULL IN BOTH DIRECTIONS -- it is
        equally NOT evidence that the instrument is sound. (b) The "degenerate regime" is
        a property of the S = 8, E = 4 DESIGN: on 100,000 draws, an unstructured
        iid-normal 8x4 table gives P(nu_eff <= 1.5) = 0.357 and P(|t|crit >= 8) = 0.527
        (expected 5.27 of 10) with P(negative variance component) = 0.143, while a table
        WITH support and pool structure gives 0.006, 0.014 and 0.0003. The committed
        profile is 4 of 10 degenerate and 1 of 10 negative-variance-component. SO THE C2
        POSITIVE CONTROL TESTED 6 OF 10 TARGETS AND FOUR WERE STRUCTURALLY UNTESTABLE AT
        ANY RUNG. The forward guidance: THE BINDING CONSTRAINT ON SECTION C IS E = 4, not
        the relative floor.
      what_it_does_not_say_and_the_red_team_keeps_apart: >-
        A degeneracy profile matching an unstructured null does NOT prove the targets
        carry no structure; the four non-firing targets are UNINFORMATIVE, not null. No
        Section C label is asserted or negated in either direction.
      status: Single-source. Wave 1 records the C1 dispersion gap (RT-10, tau_rel = 0.025
        as the maximum of four numbers spanning a factor 2.32) but builds no null for
        either quantity.
    S2-5_RT-R2_R-OUT-3_is_unreachable_by_construction:
      what: >-
        measure_relvar.py's x_null_of implements the CLOSED FORM and never touches the
        matrix, so R-OUT-3 -- the outcome row for "passes the gate but dispersion is
        non-zero -> DEFECT IN THE INSTRUMENT" -- is UNREACHABLE BY CONSTRUCTION, and the
        promised "recomputation through the identical code path" of the prereg 2.6 table
        is a tautology that cannot detect a code-path defect. P-R3 is forced by the
        SOURCE CODE, which is strictly stronger than the report's already-honest "forced
        by algebra". The remedy was supplied in the same probe: the matrix path
        reproduces the notarized table at 38 of 38 cells, so the instrument check
        R-OUT-3 promised now exists and passes.
      status: Single-source as a statement about R-OUT-3's reachability. Wave 1 records
        the same implementation choice as a DISCLOSURE GAP (F-9) and measured the same
        matrix-path agreement (V-P5 = route R1), so the MEASUREMENT replicates and the
        READING of it does not.
    S2-6_RT-R3_the_over_closure: See C-2. It is a wave-2-only reading and it CONFLICTS
      with wave 1 rather than merely extending it.
    S2-7_the_archive_refinement_and_the_closed_UNKNOWN: See RI-2.

  # ==================================================================
  # 3. WHERE THE TWO WAVES CONFLICT
  #    Reported rather than adjudicated by preference. A conflict between two
  #    independent reviews of IDENTICAL BYTES is a finding about the review
  #    instrument, and is the most important thing in this batch after the
  #    replications.
  # ==================================================================
  conflicts:
    C-1_A_DIRECT_NUMERIC_CONTRADICTION_ON_THE_G-REL2_SUB-6x_COUNT:
      severity: MATERIAL. Two validators re-derived the same quantity from the same
        immutable file and reported incompatible answers. Exactly one is right, or
        they answered different questions and neither said so.
      wave_1_states: >-
        TASK-20260809-3f1dc4 F-1, verbatim: "The minimum over all scored cells is 4.87x,
        at L1/L2 beta 15. Thirteen further G-REL2 cells sit at exactly 5.71x and one at
        4.97x, so 15 of the 19 G-REL2 cells fall BELOW the stated lower bound of 6x. The
        G-REL1 range is 12.17x to 31.03x; the G-REL2 range is 4.87x to 6.00x."
      wave_2_states: >-
        TASK-20260812-da8c3b F-1, verbatim: "Over all 29 X_null G-REL entries (10 REL1
        lattices + 19 REL2 cells) at the mean-over-8 reading the range is 0.486626 to
        3.103480, i.e. a factor of 4.87 to 31.03. TWO entries fall below 6x: 0.486626
        (REL2, L1/L2, beta 15) = 4.87x and 0.496557 (REL2, L4/L5, beta 20) = 4.97x."
      what_agrees: >-
        The corrected range (4.87x to 31.03x), the minimum and its location, the
        existence of an entry at 4.97x, the fact that "6 to 31" is false, and that no
        verdict changes. All of that is two-wave replicated and binding (R-5).
      what_conflicts: >-
        THE COUNT OF G-REL2 CELLS BELOW 6x: fifteen of nineteen (wave 1) against two of
        twenty-nine entries in total (wave 2). Wave 1's account requires thirteen G-REL2
        cells at exactly 5.71x; wave 2's account leaves room for none, since it places
        only two entries anywhere below 0.6. The two are not reconcilable as stated.
      i_do_not_pick_a_side_and_here_is_why: >-
        I ran nothing. Wave 2 states its reading explicitly ("at the mean-over-8
        reading") and wave 1 does not state which of the three declared readings it
        used, which is the most likely explanation and is a hypothesis rather than a
        finding -- and if it IS the explanation, then the count is reading-dependent,
        which would itself be a fact about the aggregation completion that R-4 declares
        non-load-bearing for VERDICTS but says nothing about for MARGINS. Note also that
        1 - k/(d-k) = 0.5714... for (d, k) = (100, 30), so a value of exactly 5.71x is
        structurally available in this family and wave 1's figure is not obviously a
        typo. THAT IS AS FAR AS READING THE RECORDS CAN TAKE THIS.
      binding_until_resolved: >-
        (i) "A FACTOR OF 6 TO 31" REMAINS UNCITABLE and "4.87x to 31.03x" REMAINS THE
        CITABLE RANGE -- the conflict does not touch that. (ii) NEITHER "15 OF THE 19
        G-REL2 CELLS FALL BELOW 6x" NOR "TWO ENTRIES FALL BELOW 6x" IS CITABLE until the
        resolving test below has run. This narrows a phrase that appears in
        EV-MLKEM-9346bb C-F1, in DEC-20260809-afe29b and in the current
        GOAL-MLKEM-005 checkpoint; those records are IMMUTABLE and are NOT edited, and
        the narrowing is by reference, exactly as wave 1 narrowed KN-FIND-f38a89.
      resolving_test_named_and_priced: >-
        Tabulate the 19 G-REL2 X_null criterion values (and the 10 G-REL1 values) out of
        the committed results_relvar.json under ALL THREE declared readings -- legacy
        i = 0, count of passing bases, mean over 8 -- and publish the multiset with the
        reading beside each. Seconds of Python on a committed file. No reduction, no
        fpylll, no basis rebuild. It is the cheapest open item in this batch and it
        should be dispatched inside the successor batch's lead as a bookkeeping rider.

    C-2_THE_CLOSURE_WORDING_no_admissibility_claim_in_either_direction:
      severity: MATERIAL, and it is a disagreement about SCOPE rather than about a
        measurement. No measurement conflicts.
      wave_1_states: >-
        EV-MLKEM-9346bb OBS-1 and KN-FIND-2a35aa: "NO ADMISSIBILITY CLAIM IS REPORTABLE
        FROM THAT GATE IN EITHER DIRECTION AND NONE IS MADE HERE." Wave 1 treats this as
        the conservative refusal it reads as, and rests it on P-R2 and P-R3, both forced
        by algebra.
      wave_2_states: >-
        RT-R3: that sentence is a CLOSURE, and docs/inventor-protocol.md section 4 holds
        a closure to a named obstruction, an argument, and forward guidance naming what
        remains open. What was demonstrated is that PASSING the gate carries no
        information, since a blind closed form clears every clause. NOTHING WAS SHOWN
        ABOUT THE REFUSAL SIDE: a candidate the gate rejects is rejected by a criterion
        whose FALSE-REFUSAL RATE HAS NEVER BEEN MEASURED. So the batch closes MORE than
        it showed, and preserving the narrowest valid conclusion means stating a WIDER
        result on the PASS side and being SILENT on the refusal side.
      my_ruling_which_is_a_scope_reading_and_not_a_new_measurement: >-
        WAVE 2 IS RIGHT ON THE LOGIC AND WAVE 1 IS RIGHT ON THE INTENT, AND THE FIX IS
        TO STOP USING THE COMPRESSED PHRASE. Wave 1 meant "we assert nothing about
        admissibility", which is unobjectionable; the words it chose assert something
        about the refusal side that nobody measured. Premature closure is a failure mode
        symmetric with overclaiming, and a conservative-sounding sentence is not exempt.
        THE CITABLE DECOMPOSITION, BINDING ON EVERY SUCCESSOR: (a) THE GATE'S PASS SIDE
        IS UNINFORMATIVE ON THE FROZEN FAMILY F0 -- a parameter-determined closed form
        and an unplanted member of the frozen candidate list both clear every clause
        evaluated; (b) THE GATE'S REFUSAL SIDE IS UNTESTED IN EITHER DIRECTION and its
        false-refusal rate is unmeasured; (c) NO ADMISSIBILITY CLAIM ABOUT ANY CANDIDATE
        IS MADE BY EITHER WAVE. THE PHRASE "in either direction" IS NOT CITABLE as a
        result. Neither record is edited; KN-FIND-2a35aa's opening paragraph carries the
        phrase and is narrowed by reference in the promotion below.
      what_this_does_not_disturb: >-
        R-OUT-1's measured core (R-2) is untouched, and so is wave 1's observation that a
        conclusion reachable by algebra is not at the mercy of a measurement.

    C-3_IS_R-OUT-1_FAMILY_CONDITIONAL:
      severity: MATERIAL, and it is an ADDED BOUNDARY rather than a contradiction --
        recorded here because reading it as a contradiction, or as nothing, are both
        wrong.
      wave_1_states: >-
        R-OUT-1 STANDS, scoped to d in {20, 30, 40, 100, 140}, the listed k and beta
        grids, q = 3329, 8 frozen bases. The frozen FAMILY is implicit in that scope and
        is nowhere named as a condition; neither EV-MLKEM-9346bb nor KN-FIND-2a35aa
        states that the refusal would dissolve under a different family of the same
        q-ary shape.
      wave_2_states: >-
        RT-R1 (S2-2): in F1, differing in exactly one respect, G-VAR fires 0 of 38 on
        both observables while they still read zero entries of A. "R-OUT-1 IS CORRECT
        WITHIN THE FROZEN FAMILY F0 AND IS NOT A PORTABLE ADMISSIBILITY CLAUSE."
      my_ruling: >-
        NO MEASUREMENT CONFLICTS: wave 1 measured F0 and wave 2 measured F0 and F1, and
        they agree on every F0 number. WAVE 2 ADDS A BOUNDARY WAVE 1 DID NOT STATE, and
        the boundary is real and is adopted. EVERY CITATION OF THE G-VAR REFUSAL MUST
        CITE IT AS CONDITIONAL ON THE FAMILY, and no "repaired gate" may be built on
        G-VAR until the fibre condition is restated and re-scored. This is SINGLE-SOURCE
        (one probe, one session) and the citation duty stands anyway, because the cost
        of honouring it is a clause and the cost of not honouring it is a successor
        building an instrument on a clause that dissolves under a one-line change of
        family.

    C-4_THE_CROSS_PLATFORM_CHARACTERIZATION_OF_THE_L7_L8_AGREEMENT:
      severity: MINOR IN CONSEQUENCE, MATERIAL IN DISCIPLINE.
      wave_1_measured: >-
        C-F5 / TASK-20260809-3f1dc4 F-5: the BATCH-cbe023 Red Team's environment is
        recorded NOWHERE. The Validator searched that report and all six files of its
        probes directory and found no platform, Python, numpy, host or environment block
        of any kind, and separately verified that what the producer's manifest correctly
        contrasts against is BATCH-cbe023's SECTION A PRODUCER environment
        (macOS-26.6-arm64, Python 3.13.1, numpy 2.4.0, scipy 1.15.3, fpylll 0.6.4). The
        agreement is REAL and verified twice (24 of 24 pairs at six decimals, max
        absolute deviation 4.84e-07); the PLATFORM INFERENCE is not supported, and the
        citable form is a PORTABILITY result across three textually distinct
        implementations with fpylll pinned at 0.6.4 in both runs and the reduction input
        bit-identical across platforms BY CONSTRUCTION.
      wave_2_asserts: >-
        EV-MLKEM-e45478 (coordinator_verification_performed): "The genuinely
        cross-platform datum in this batch remains the producer's agreement with the
        BATCH-cbe023 Red Team's L7/L8 figures."
      my_ruling: >-
        WAVE 1'S IS A MEASUREMENT AND WAVE 2'S IS AN INHERITED CHARACTERIZATION SUPPORTED
        BY NO MEASUREMENT IN EITHER WAVE. The asymmetry decides it without my preferring
        a chain: C-F5 STANDS and the "genuinely cross-platform" phrase in EV-MLKEM-e45478
        IS NOT CITABLE. Both records stand unedited; this is a citation ruling. Wave 2's
        own point in the same sentence -- that ITS bit-exact agreements are not
        cross-platform evidence, both reviewers printing the producer's own
        python 3.11.15 / numpy 2.4.6 / scipy 1.17.1 stack -- is correct and is adopted.

    C-5_HOW_MUCH_EMPIRICAL_CONTENT_SECTION_R_HAS:
      severity: MATERIAL FOR CITATION, and its cause is knowable.
      the_four_answers: >-
        The producer said THREE (P-R1, P-R6, P-R7). Wave-1 Validator: ONE (P-R1).
        Wave-1 Red Team: TWO (P-R1, P-R6), both waves' reviewers removing P-R7 for the
        same reason in wave 1. Wave-1 Coordinator ruled ONE, by ruling that AM-13's
        final clause is general and reaches Section R so P-R6 is a CONSISTENCY CHECK
        (carried forward as AM-15). WAVE 2 SAYS THREE: its Validator names P-R1, P-R6
        and P-R7, and its Red Team independently names X_mp's pass, the L7/L8
        replication and the normalization disagreement.
      why_they_differ_and_it_is_not_a_measurement_dispute: >-
        The wave-1 count depends on a COORDINATOR SCOPE RULING (AM-15) that existed only
        in DEC-20260809-afe29b on an unmerged branch. The wave-2 reviewers were not
        bound by it and could not have read it. This is a clean demonstration that a
        count of "predictions with empirical content" is a function of the governing
        amendment set and not of the artifacts alone -- which is itself worth knowing.
      my_ruling: >-
        AM-15 STANDS AS THE GOVERNING SCOPE READING and is not re-litigated: it was made
        by the only role that may make it, on grounds recorded at the time, and wave 2
        raises no argument against it because it never saw it. THE OFFICIAL COUNT
        REMAINS ONE, and "three predictions of actual empirical content" remains
        UNCITABLE. What is added by wave 2 is that P-R6 and P-R7, while not counting as
        predictions, are the only two items in Section R that COULD have disagreed with
        an external measurement -- wave 2's Red Team's phrasing, which is compatible with
        AM-15 and is worth carrying. AM-15(c) already requires successors to state, in
        the same table, how many of M predictions were open at notarization; that
        requirement is now demonstrably load-bearing.

    no_other_conflict_found: >-
      I looked for conflicts specifically at every point where the two waves measured
      the same quantity, and outside C-1 the two waves' NUMBERS agree everywhere they
      overlap -- including at the level of individual doubles (0.486626; 8.527e-16;
      38 of 38; 10 of 10; 19 of 19; 14 of 19; 30 of 30; 9 and 9 in the D3 table).
      C-2, C-3, C-4 and C-5 are disagreements of READING, SCOPE or COVERAGE, and each
      is recorded as such rather than dressed as a measurement dispute.

  # ==================================================================
  # 4. WHAT THIS MEASURES ABOUT THE REVIEW INSTRUMENT ITSELF
  #    The batch's most transportable output, and it exists only because of
  #    an accident. Recorded symmetrically, in both directions.
  # ==================================================================
  review_instrument_findings:
    RI-0_what_the_experiment_was: >-
      Two review waves, four sessions, one model, identical frozen cards, identical
      immutable input bytes (c034ef38, 30 declared paths, 30 of 30 hashes matching in
      both waves), neither wave reading the other. This is an uncontrolled but genuine
      test-retest of the review instrument. n = 2. Everything below is at that n.
    RI-1_defects_wave_2_found_that_wave_1_missed:
    - >-
      THE UNDECLARED ACROSS-CELL ANY-RULE AGGREGATION (S2-3, measure_relvar.py:816-819),
      which selects the reported outcome row. Wave 1 examined the aggregation question in
      depth, verified the DECLARED per-basis completion at all 117 cells under four
      readings, and pronounced it honest and non-load-bearing -- and did not find the
      second, undeclared one. This is the clearest single miss in either direction: the
      wave-1 check was in the right file, on the right topic, and stopped one level up.
    - >-
      THE FAMILY-CONDITIONALITY OF THE G-VAR REFUSAL (S2-2 / C-3). Wave 1 attacked the
      arithmetic route and the observable; neither wave-1 reviewer varied the FAMILY.
    - >-
