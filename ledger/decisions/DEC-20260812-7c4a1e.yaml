        R3 slogdet(UB), U unimodular: rel dev 9.8e-16, 38 of 38, REFUSED. R4
        0.5 slogdet(BB^T): rel dev 2.35e-09, 0 of 38, ADMITTED. R5 slogdet(BH), H an
        ambient isometry: rel dev 3.11e-14, 0 of 38, ADMITTED. ALL SIX reproduce the
