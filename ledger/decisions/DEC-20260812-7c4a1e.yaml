    bought is the thing this program almost never gets: TWO INDEPENDENT REVIEWS OF
    IDENTICAL BYTES UNDER IDENTICAL FROZEN CARDS, i.e. a reproducibility experiment on
    the REVIEW INSTRUMENT ITSELF. That is what is mined here.

  decision: synthesize

  decision_note: >-
    `synthesize` is the ACTION -- two review chains over one producer snapshot are
    reconciled into one citation regime, one batch_log entry and one next action -- and
