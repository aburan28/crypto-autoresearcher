        That sentence is true of X_null and of rdet under T2 and T3 and FALSE of rdet
        under T1, IN THE PRODUCER'S OWN ARTIFACT. The wave-1 Coordinator verified this
        one by reading the files itself.
      status: >-
        WAVE 2 DOES NOT MENTION IT. Binding citation rule from wave 1 stands: cite
        the residual per transform, never as a blanket zero.
    S1-3_RT-4_RT-5_RT-6_the_structure_of_the_n_fire_statistic:
      what: >-
        (a) P-B1's falsifier had probability 0.00175 under the null AM-13 itself
        mandates. (b) The second conjunct of prereg 3.3's PASS clause -- "n_fire(c)
        decays as c decreases" -- is a TAUTOLOGY, since n_fire(c) = #{i : c_min(i) <= c}
        is monotone non-decreasing in c by definition, so the criterion is effectively
        single-clause. (c) DERIVATION-BACKED: for a null with SE ratio 1 the expected
        c_min is 1 + t_{n-1,0.998}, which FALLS with more draws (5.207 at n = 8 to 3.878
        as n grows) while the carried headline c = 6 lies above it at every n, so the
        null count SATURATES UPWARD toward 48 of 48 with more data rather than decaying.
        (d) The null is not of the same shape for this statistic: the null family's
        median SE_step/SE_diff is 1.0370 against the real arm's recovered 0.4730, a
        factor 2.19, so the signed magnitude -6 is not interpretable (1.4 Monte-Carlo sd
        of the null count). (e) Only c < 1 + t_crit = 5.207 at n_draw = 8 can separate a
        real arm from a null at all; at c = 4 the null family gives 10 of 48, the
        committed real count is 16 of 48 and the exact-null benchmark is 42 of 48, and
        whether that separation is an effect is UNTESTED by anything in this batch.
      status: WAVE 2 MEASURED THE DISPERSION BUT NOT THIS STRUCTURE. Single-source.
    S1-4_RT-3_the_guards_amplitude:
      what: >-
        The MUST-PASS guard clears tau_rel at amplitude multiplier mu median 0.224 while
        hkz misses at mu median 16.3 and lam1n at 2.30, and at identical cells the
        guard's mirrored gap is 79x to 266x the candidate's -- rawtail and hkz being THE
        SAME FUNCTIONAL FORM on the raw and the HKZ-reduced basis. A binary guard firing
        two orders of magnitude above where the candidates sit certifies that the
        criterion is not identically dead; it reports NOTHING about resolution at the
        candidates' amplitude.
      status: WAVE 2 CONFIRMS THE GUARD PASSED AND SAYS NOTHING ABOUT ITS AMPLITUDE.
        Single-source, and it is the reason AM-16(e) requires graded rather than binary
        guards.
    S1-5_the_replication_and_provenance_measurements:
      what: >-
        The 24-of-24 six-decimal comparison of committed per-basis hkz values against
        the BATCH-cbe023 Red Team's, max absolute deviation 4.84e-07; the AST-distinctness
        measurement showing no function is AST-identical between the predecessor's probe,
        measure_relvar.py and the declared common ancestor measure_am4.py
