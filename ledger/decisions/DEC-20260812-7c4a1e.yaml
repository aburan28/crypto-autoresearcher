    EVIDENCE AGAINST ANY OF THOSE QUANTITIES (AGENTS.md rule 5). In WAVE 1 fpylll 0.6.4
    IS RECORDED IN THE VALIDATOR'S OWN ENVIRONMENT BLOCK and that Validator re-executed
    the lead end to end from source into a scratch path outside the repository,
    reporting the result BITWISE IDENTICAL on every key except wall-clock timings (49
    differences, all `secs` fields), with the 48 HKZ reductions, max hkz_violation 0.0,
    every G-VAR bit test, every G-REL entry and every outcome row reproducing exactly.
    THE CORRECT STATEMENT IS THEREFORE: the reduction-dependent quantities have ONE
    re-execution (wave 1, through the producer's own code, on the producer's own
    machine, which cannot catch a specification error) and ZERO independent
    re-implementations in either wave. Both waves' bit-exact agreements are
