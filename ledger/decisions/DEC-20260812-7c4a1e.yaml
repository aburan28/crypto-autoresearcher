    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this decision bears on ML-KEM security,
    on any FIPS 203 parameter set, on any attack cost, or on any cost model. The scope
    of everything reconciled here is q <= 3329, d in {20, 30, 40, 100, 140}, the frozen
    k and beta grids, 8 frozen bases per lattice, S = 8 supports and E = 4 error pools,
    N = 2^20 CBD draws, the 2^-10 quantile only, and no reduction beyond the frozen HKZ
    pipeline at d <= 40.
  - >-
    INDEPENDENCE IS PROCEDURAL AND NEVER MODEL-LEVEL. AGENTS.md RULE 12 IS UNMET AND
    UNWAIVED IN THIS GOAL AND IS NOT WAIVED HERE. All four reviewer sessions across both
    waves, all four producers, both prior Coordinators and this one resolve to the same
    model; every review records model_verified: false with its reason and no adapter
    probe receipt exists for any of them. TWO REVIEW WAVES IS TWO INDEPENDENT SESSIONS
    ON ONE MODEL WITH IDENTICAL FROZEN CARDS AND IDENTICAL INPUTS -- exactly that, and
    not two models. Two knowledge promotions remain owed from GOAL-MLKEM-003 and cannot
    be executed without a second backend.
  - >-
    I RAN NO SHELL. No git command, no producer code, no probe, no verifier, no
    allocate_id. Every git fact and every number here is attributed to a review that
    measured it. I resolved no conflict by measurement and I say so at each place.
  - >-
    THE fpylll POSITION IS NOT SYMMETRIC ACROSS THE TWO WAVES, AND I CORRECT THE
    PREMISE I WAS GIVEN RATHER THAN REPEATING IT. fpylll was ABSENT IN BOTH WAVE-2
