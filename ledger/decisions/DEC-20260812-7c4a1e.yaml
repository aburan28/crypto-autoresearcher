      NEITHER WAVE DOMINATES. Each found material defects the other missed, in both
      directions, at comparable count and comparable severity, on identical bytes under
      identical cards. THE HONEST READING IS THAT ONE REVIEW PASS OF THIS KIND HAS
      SUBSTANTIALLY LESS THAN FULL RECALL, and that the recall gap is not concentrated
