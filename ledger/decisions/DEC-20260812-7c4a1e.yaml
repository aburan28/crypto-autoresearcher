  replicated_across_both_waves:
    what_this_label_means_and_does_not: >-
      TWO INDEPENDENT SESSIONS, SAME MODEL, SAME FROZEN CARDS, IDENTICAL INPUT BYTES,
      NEITHER READING THE OTHER. That is exactly what it is. It is NOT model-level
      independence: AGENTS.md rule 12 is UNMET AND UNWAIVED in this goal, all four
      reviewer sessions across both waves resolve to the same model, and all four
      record model_verified: false. Two waves is two PROCEDURAL samples of one model's
      judgement over one artifact set, and every agreement below must be discounted for
      correlation of an unknown and unmeasured degree. This record does not present the
      duplication as corroboration by a second model, because it is not one.

    R-1_the_archive_and_notarization_record:
      status: FOUR INDEPENDENT SESSIONS, each running git plumbing in its own session,
        each stating it did not accept the Coordinator's account. The strongest
        replicated block in the batch.
      agreeing_values: >-
        Three-way commit split: 1aa7db53 changes exactly 2 paths (prereg.md,
        prereg_sha256.txt, both additions, parent 3d5dd80a); c034ef38 changes exactly
        28 producer files, all additions, 7 in each of 4 task directories, parent
        1aa7db53; 502d15a0 changes exactly 3 paths (two receipts as additions plus
        dispatch_queue.json as a modification) and no source artifact. 30 of 30 declared
        path_sha256 match with 0 mismatches -- and BOTH waves report the STRONGER test,
        against the blobs AT THE DECLARED COMMITS as well as the working tree. The
        notarization chain holds in both directions: both frozen-text files ABSENT at
        3d5dd80a, ZERO producer files at 1aa7db53, each of the 28 producer artifacts
        first appearing at c034ef38, ancestry asserted against the NOTARIZING COMMIT
        ITSELF, `git log --all` returning exactly one commit per frozen-text path, and
        the prereg sha256 agreeing across every carrier at
        190cf4740b0ecefdbe7d1da0868a6258352b044ae5e99da470060f94049c70ea. The D3 table
        reproduces row for row in both waves: exactly 9 declared producer artifact names
        dangle and exactly 9 committed files are undeclared, intersection 19 of 28. Both
        archive commit messages carry their task id and GOAL-MLKEM-005.
      consequence: >-
        THE BYTES ARE INTACT AND THE COORDINATION RECORD'S BINDING IS NOT, established
        twice over. The nine dangling names remain UNCITABLE; both waves report citing
        producer artifacts exclusively by their committed names.

    R-2_the_zero_dispersion_facts_within_the_frozen_family:
      status: FIVE INDEPENDENT IMPLEMENTATIONS ACROSS BOTH WAVES.
      agreeing_values: >-
        X_null, a closed form in (d, k, beta, q), is BIT-IDENTICAL across all 8 frozen
        bases at all 38 scored cells with float_sd exactly 0.0, while walking G-REL1 at
        10 of 10 lattices and G-REL2 at 19 of 19 cells. X8 = rdet = q^((d-k)/d), which
        was on the ORIGINAL FROZEN TEN-CANDIDATE LIST rather than planted, is likewise
        bit-identical at 38 of 38. G-VAR therefore fires 38 of 38 on both. Wave 1: the
        producer's run, the Validator's rebuild of all 8 bases at all 10 lattices
        through slogdet on the actual matrix (V-P5) plus a 40-digit closed-form
        re-derivation of the entire 38-cell prereg 2.6 table, and the Red Team's R0/R1/R3
        rows. Wave 2: the Validator's own basis construction reproducing 646 stored
        per-basis values BIT-EXACTLY (304 rdet, 304 rawtail, 38 X_null) plus a
        50-digit closed form, and the Red Team's MATRIX-PATH implementation, which
        computes X_null definitionally as (beta/d)(1/d)log|det B| from slogdet of the
        actual integer matrix and reproduces the notarized 2.6 table at 38 of 38 cells.
      what_it_licenses: >-
        This is the measured core of R-OUT-1 and it is not in doubt AT THE FROZEN
        FAMILY. It licenses no admissibility claim about any candidate. See C-3 for the
        family-conditionality bound wave 2 adds to it, and C-2 for the closure-wording
        conflict.

    R-3_the_MUST_PASS_guard:
      status: BOTH WAVES, identical figures.
      agreeing_values: >-
        X_mp = rawtail was frozen as a MUST-PASS could-not-PASS guard in the notarized
        text before any datum, with R-OUT-5 a live branch that would have voided every
        G-REL verdict in the section. It passes G-REL1 at 10 of 10 and G-REL2 at 14 of
        19. Both waves independently verify that all five failing cells sit at
        beta = d/2 exactly -- wave 2 names them: L1/L2 b50, L4/L5 b70, L7/L8 b10,
        L9/L10 b15, L11/L12 b20 -- where the mirror k -> d-k is self-symmetric and the
        true gap is zero by symmetry, and that all five mean gaps fall below their own
        paired-test detection floors.
      wave_1_only_qualification_carried_forward: See S1-4 (RT-3, the guard's amplitude).

    R-4_the_per_basis_aggregation_completion_is_not_load_bearing:
      status: THREE INDEPENDENT SESSIONS (wave-1 Validator, wave-2 Validator, wave-2 Red Team).
      agreeing_values: >-
        The pre-registration froze NO rule for collapsing 8 per-basis criterion values
        into one pass/fail; the producer declared the completion and reported three
        readings side by side. The legacy i = 0 draw, the count of passing bases, the
        mean over 8 and a majority-of-8 reading AGREE ON THE VERDICT AT ALL 117 SCORED
        CELLS, 0 disagreements, in every session that checked. Wave 2's Red Team adds a
        fourth reading nobody had tested, unanimity, under which hkz's G-REL1 at L8
        would flip at 7 of 8 bases; no headline moves.
      residual_caution_carried_from_wave_1: >-
        That agreement is a fact about THIS run's numbers, not a property of the
        readings. A successor re-checks it rather than inheriting it.

    R-5_the_lead_reports_stated_relevance_margin_is_false_at_its_lower_end:
      status: BOTH VALIDATORS INDEPENDENTLY, IDENTICAL ENDPOINTS. The headline
        correction replicates; a sub-count inside it does NOT -- see C-1.
      agreeing_values: >-
        report_relvar.md section 2's "X_null clears a 0.10 relevance threshold by a
        factor of 6 to 31, in both clauses, at every cell" IS FALSE AS WRITTEN. Both
        validators measure the same corrected range, 4.87x to 31.03x, and the same
        minimum, 0.486626 at G-REL2 L1/L2 beta 15 -- which is the exact value the FROZEN
        pre-registration works out at section 2.6 as its own REL-2 worked example, so
        the report contradicts its own governing frozen text in the same paragraph as
        its headline. Both record that NO VERDICT CHANGES: every scored entry still
        clears tau_rel = 0.10.
      binding: >-
        "A FACTOR OF 6 TO 31" IS NOT CITABLE ANYWHERE. THE CITABLE RANGE IS 4.87x TO
        31.03x. This was already binding from wave 1 and is now two-wave replicated.

    R-6_the_section_B_prime_decay_check_FAIL_survives_replication:
      status: ELEVEN INDEPENDENTLY SEEDED NULL FAMILIES ACROSS BOTH WAVES. The
        strongest quantitative replication in the batch.
      agreeing_values: >-
        Producer: n_fire(c = 6) = 35 of 48. Wave-1 Validator: two families built with
        different seed constructions, 35 of 48 and 39 of 48. Wave-2 Validator: 34 of 48
        from a reimplementation written from the frozen text without importing the
        producer's script, changing exactly the seed formula. Wave-2 Red Team: 8
        replicates importing the producer's own module verbatim and varying only the
        13-frame family's seeds through a disjoint offset -- 28, 37, 36, 32, 32, 29, 28,
        35, mean 32.12, sd 3.60 (ddof 1), min 28, max 37. THE PRE-REGISTERED PASS
        FALSIFIER IS n_fire(c = 6) <= 21 OF 48. Not one of the eleven families across
        both waves comes within seven steps of it. The count does not decay when the
        parameter meant to destroy the effect is applied, so it is an ARTIFACT, and both
        waves say so as loudly as they say anything adverse. Every citation of the
        committed real count of 29 of 48 carries the exact-null benchmark of 47 of 48
        in the same sentence, as every occurrence in this record does.
      binding_carry_restated: >-
        THIS DOES NOT RETIRE AM-3. Its power remains UNDEMONSTRATED rather than
        disproved and its 0.096 family-wise false-failure bound stands. Both waves say
        so unprompted. BATCH-a44d08 IS NOT RESCORED IN ANY RESPECT.

    R-7_n_fire_is_reported_without_dispersion_and_the_single_value_is_not_a_point_measurement:
      status: BOTH WAVES, BY TWO DIFFERENT METHODS, WITH AGREEING MAGNITUDES. This is
        the most interesting methodological replication in the batch, because the two
        routes share no code and no model.
      agreeing_values: >-
        Wave-1 Red Team (RT-4): a 20000-rep Monte Carlo of the FROZEN STATISTIC under
        the exchangeability the mandated construction realizes gives mean 34.0, sd 4.2,
        min 16, max 48, and P(n_fire <= 21) = 0.00175 -- so the pre-registered falsifier
        was all but unreachable and "P-B1 HOLDS" carries essentially no evidential
        weight. It records the sampling sd of about 4.2 of 48 as an AM-11 dispersion gap
        in the producer's own headline statistic. Wave-2 Red Team (RT-B1): the same gap
        found independently, and closed by DIRECT REPLICATION of the pipeline rather
        than by a model -- sd 3.60, stated by its author as a LOWER BOUND because the
        error sample and the carried Haar arm were frozen across the replicates. A
        model-derived 4.2 and a measured lower bound of 3.60 are consistent, and the two
        methods are independent.
      what_replicates: >-
        (a) THE DEFECT: a newly proposed statistic computed on a random object was
        reported from one draw with no dispersion anywhere, against a fixed decision
        boundary; AM-10 requires replication and AM-11 requires dispersion, and Section
        B' applied neither. (b) THE MAGNITUDE, to within the stated uncertainty.
      what_is_wave_2_only: >-
        The specific readings "35 is a 0.80 sd high draw", "the honest report is
        32.1 +/- 3.6", "2 of 8 replicates fire LESS often than the committed real count
        of 29 of 48 (exact-null benchmark 47 of 48)", and "c = 6 is the least stable
        point of the c grid (sd 1.20 at c = 4, 3.60 at c = 6, 1.19 at c = 8, 0.00 at
        every c >= 12)". SINGLE-SOURCE. Note in particular that wave 1's two families
        both landed at or above the real count and wave 1 generalized from them; wave 2
        with eight families shows that generalization is realization-dependent. See
        the recall measurement at RI-2.

    R-8_section_C2s_positive_control_could_not_have_failed:
      status: BOTH RED TEAMS, INDEPENDENTLY, WITH BIT-LEVEL AGREEMENT ON THE MEASURED
        RESIDUAL, and both give the same exact-algebra argument.
      agreeing_values: >-
        se_decomposition computes MS_S, MS_P and MS_res from CENTRED deviations only, so
        adding a constant to every entry of the raw 8x4 table adds the same constant to
        the grand mean, to every row mean and to every column mean and leaves all three
        algebraically unchanged: SE, nu_eff and the NEGATIVE-VARIANCE-COMPONENT flag are
        invariants of the constant-offset group action, so "recovered SE = committed SE"
        is FORCED in exact arithmetic and P-C2e is a floating-point IMPLEMENTATION CHECK
        rather than a test that could have failed mathematically. Both waves measure the
        SAME residual over the frozen ladder: max SE relative deviation 8.527e-16,
        reproducing the producer's own reported 8.53e-16. Wave 1 extends it to offsets
        of 1e6 * SE (8.938e-11, 0 of 10 flags ever changing) and exhibits a structured
        one-column injection moving the recovered SE by up to 11.68 relative.
      consequence_both_waves_reach: >-
        The check is real and valuable -- it would catch an uncentred sum of squares --
        and it is NOT the SE inflation AM-14(b) names, which REMAINS UNTESTED. Wave 1
        additionally rules that report_c2.md section 2's "which is what AM-14(b) asked
        to be shown rather than assumed" OVERSTATES and is NOT CITABLE; nothing in wave
        2 disturbs that ruling and its own RT-C2b supports it.

    R-9_the_centered_C2_control_the_producer_declined_to_run:
      status: BUILT INDEPENDENTLY IN BOTH WAVES, SAME RESULT, AND BOTH RED TEAMS RAN IT
        AGAINST THEIR OWN PRIOR. Together with R-6 this is the batch's cleanest
        science-side replication.
      agreeing_values: >-
        report_c2.md recorded P-C2c FALSIFIED (one target fired at delta/SE = 1.0), then
        REFUSED the consequence its own pre-registration declared ("the instrument is
        over-sensitive"), diagnosing instead that the target's committed |Delta_bar| was
        already 4.5295 SE -- 88.5% of its own |t|crit -- and DECLINED to run the centered
        variant it proposed, because adding an unregistered analysis to rescue a
        falsified prediction is the failure mode the batch exists to close. Both waves
        judge that refusal to be CORRECT CONDUCT and both then built the control the
        producer would not: on D - mean(D) through the identical scoring path with the
        frozen ladder, frozen alpha_pair and frozen tau_rel, 0 OF 10 TARGETS FIRE AT
        delta/SE <= 1. THE PRODUCER'S DIAGNOSIS IS CORROBORATED BY MEASUREMENT IN BOTH
        WAVES and the "over-sensitive" reading is NOT supported. Wave 2 adds that the
        uncentered firing reproduces at exactly the same target, SE recovery is
        8.527e-16, and 6 of 6 targets with |t|crit < 8 fire at 12 SE; it also discloses,
        in the probe docstring before running, that after centering the minimum |t|crit
        over the ten targets is 2.78, so the t-clause cannot fire at rungs 0.5 and 1.0
        by arithmetic and the probe is in a could-not-FIRE arrangement on that clause.

    R-10_section_C1s_re_score_changed_no_verdict:
      status: BOTH WAVES, reproduced from the committed raw 8x4 tables with each
        reviewer's own variance decomposition.
      agreeing_values: >-
        All ten targets INVARIANT to the repair, exactly as prereg 4.5 declared the most
        likely outcome BEFORE the run; 0 FALSIFYING pairs at 0.15 and 0 at 0.025; four
        targets with SE_2way/SE_naive below 1. Wave 2's Red Team reproduces all ten
        ratios to four decimals -- 1.0416, 1.2196, 0.3635, 1.0736, 1.2299, 0.8495,
        1.3686, 0.9651, 1.1810, 0.8397 -- with SE_Delta_bar at relative deviation
        exactly 0.0 at all ten targets, and both wave-2 reviewers reach the same rows
        independently. P-C1a is FALSIFIED, with the producer reporting it against its
        own interest, and both waves agree it was a could-not-PASS prediction
        DETERMINISTICALLY (lowering tau_rel can only make "floor >= tau_rel" more
