    producer outcome row is adjudicated beyond the citation rulings stated below.
    NEITHER WAVE IS OVERTURNED AND NEITHER RECORD IS EDITED: EV-MLKEM-9346bb,
    DEC-20260809-afe29b, KN-FIND-2a35aa, EV-MLKEM-e45478 and DEC-20260812-15d3b2 are
    immutable and all five stand. Where the two chains conflict, this record SAYS SO
    AND NAMES THE CHEAP TEST THAT RESOLVES IT, rather than picking a side; where they
    agree, it records the agreement at exactly the strength two procedural samples of
    ONE MODEL can carry, which is not model-level corroboration. `approve` would
    endorse statements one wave measured to be narrower than the other stated.
    `pause` is unavailable: no pause_condition of GOAL-MLKEM-005 is met, and a
    duplicate execution is not one.

