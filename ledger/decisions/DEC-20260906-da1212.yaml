coordinator_decision:
  id: DEC-20260906-da1212
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-001
  context: >-
    Independent red-team review of amendment v3
    (experiments/EXP-ECDLP-56ee42/amendments/v3_comparator_and_t3_repair.yaml,
    committed 7805b2c26), dispatched per v3's own review_round_note
    recommending independent review before reliance (since v2, the
    Coordinator-drafted control design it replaces, broke under round-1
    review). The review is complete
    (experiments/EXP-ECDLP-56ee42/reviews/amendment-v3-review/report.yaml,
    verdict REVISE) and independently re-verified, by direct computation,
    the amendment's two most consequential unverified claims.
  decision: revise
  target_ids:
    - EXP-ECDLP-56ee42
    - H-ECDLP-a4be60
    - experiments/EXP-ECDLP-56ee42/amendments/v3_comparator_and_t3_repair.yaml
    - DEC-20260906-030aad
  rationale:
    - >-
      V3-RA-1 IS NOW DISCHARGED, TRUE. The review independently computed the
      exact curve-point counts in C2a's two fibers at all six frozen rungs
      via Legendre-symbol classification (public p, b only, no discrete log,
      no cache) and found minority-fiber fractions of 0.4989-0.5000 at every
      rung -- 3 to 6 orders of magnitude better balanced than the retired
      top-bit comparator's 8-50 points, with the deviation from exact 1/2
      shrinking monotonically as p grows, exactly as v3 claimed. This is the
      single most consequential unverified claim in v3 and it is now
      independently confirmed true by direct measurement, not merely bounded.
    - >-
      THE T3 VECTORIZED FIX IS INDEPENDENTLY CONFIRMED CORRECT, INCLUDING
      ITS OEIS GROUND TRUTH. The review re-verified u(x) = popcount(x &
      (x>>1)) over 5,000,000+ values with zero mismatches, confirmed the
      SWAR mod-2 reduction is a faithful specialization of the
      already-tested popcount_mod4_array reduction, and -- notably --
      caught its OWN first, memory-recalled transcription of OEIS A020985
      as wrong at two positions before it entered the report, replacing it
      with a WebSearch-retrieved transcription that was then independently
      verified against the standard recursive definition and against the
      block-count definition over 2,000,000 values. This self-correction is
      exactly the "recalled is not a citation" discipline this program
      requires and is recorded as a positive process finding, not merely a
      passed check.
    - >-
      NEITHER REPAIR'S CORE MATHEMATICAL OR LOGICAL CONTENT WAS FOUND WRONG.
      The review's own verdict_detail states this explicitly: this is REVISE
      for completeness gaps, not BROKEN for a defect in the repair's
      direction. Five concrete, verified gaps require closing before the
      Stage 0-2 re-run, the synthetic power check, or the C2 calibration run
      may be dispatched:
      (1) selftest.py -- a real, currently-passing, executable artifact not
      named anywhere in v3 -- hard-codes the CURRENT BROKEN recursion as
      ground truth (asserting an exact "135/256 mismatches... frozen audit
      fact") and will raise AttributeError or assert a now-false fact once
      v3's required rename is applied; it falls through the gap between
      "pipeline file" and "numbered stage" that v3's own scope language uses.
      (2) The required synthetic power check (V3-RA-2), which decides
      whether C2a becomes blocking, specifies neither a seed nor a
      replication count -- the regime decision is not itself reproducible or
      pinned as v3 intends, even though its inputs are genuinely public and
      fixable in advance.
      (3) No concrete, checkable mechanism enforces that the power check is
      committed before the calibration run's task card is opened; v3 states
      this discipline in prose but (unlike change_4's own manifest-before-
      next-stage stopping rule in the same document) does not enforce it as
      an invariant.
      (4) If the power check finds C2a's power inconclusive, C2's entire
      evidentiary weight for validating NULL-2 against the actual,
      irregular, natural x-based statistics the experiment cares about
      would rest on C2b (POS-A) alone -- a maximally regular, exactly
      period-2 alternator. This is a REGULARITY gap distinct from the
      MAGNITUDE gap C2b was designed to close, and v3 does not address it:
      a bare "C2: PASS" in that regime would overstate what was actually
      shown.
      (5) v3 (following DEC-20260906-030aad and J1) overstates which
      archived runs have T3 fields to reclassify: RUN-ECDLP-56ee42-S2's
      raw-result.json contains no measured T3 statistic at all (only a
      source-scan label unaffected by which recursion the function
      implements) -- only S0's r.L1/r.Linf fields are T3-attributable
      numbers. This does not smuggle any wrong evidence into use (there is
      no wrong S2 number to misuse), but the citation should be corrected
      wherever this finding is restated.
    - >-
      A minor wording overclaim (attack 1) is also noted: v3's "regardless
      of what c turns out to be" sentence oversells what the RECALLED
      Weil-bound argument alone establishes (a sufficiently large O(1)
      constant would make the bound vacuous); the qualitative claim is true,
      but on the strength of the review's own measurement (now on record),
      not the bound's shape alone.
  evidence_refs:
    - experiments/EXP-ECDLP-56ee42/reviews/amendment-v3-review/report.yaml
    - experiments/EXP-ECDLP-56ee42/amendments/v3_comparator_and_t3_repair.yaml
    - experiments/EXP-ECDLP-56ee42/reviews/round-1/validator/report.yaml
    - experiments/EXP-ECDLP-56ee42/reviews/round-1/red-team/report.yaml
  limitations:
    - >-
      This decision does not itself patch v3; per this program's versioned-
      amendment discipline, a v4 (never an edit of v3 in place, since v3 is
      already a committed record even though unapproved/undispatched)
      carries the five required_controls forward as a follow-up drafting
      task.
    - >-
      Does not authorize execution_authorized, the Stage 0-2 re-run, the
      synthetic power check, the C2 calibration run, or Stage 3 -- all
      still require a separate, later Coordinator decision citing a
      version of this amendment that closes the five gaps above, mirroring
      DEC-20260906-b60887's precedent for the sibling QALG-001 amendments.
    - >-
      Does not re-verify the Weil-bound argument's shape from first
      principles (the review's own attack 1 notes this is standard and not
      obviously misapplied, but was not independently re-derived); this is
      moot regardless, since the practical question (are the fibers
      actually balanced at these six rungs) is now settled by direct
      computation.
  next_actions:
    - >-
      Open a follow-up protocol-amendment task producing v4 (superseding
      v3, base_version 3 -> resulting_version 4) that: (a) extends the T3
      repair's scope to selftest.py, updating test_digit_statistics to test
      rudin_shapiro_sign_true/_array against _rudin_shapiro_u (0 mismatches
      expected) and retaining the old recursion's self-check only under its
      new _rudin_shapiro_signflip_variant name; (b) pins an explicit seed
      (or requires N>=20 independent repetitions with a stated pass
      fraction) for the required_synthetic_power_check, committed alongside
      the regime decision; (c) adds a concrete, checkable ordering
      requirement (e.g. the calibration run's task card must cite the
      power-check artifact's commit sha as an ancestor) mirroring change_4's
      own manifest-before-next-stage stopping rule; (d) requires the
      calibration run record and any Stage-3-dispatch decision to state
      explicitly, if C2a is downgraded to diagnostic-only, that C2's PASS
      reflects NULL-2's power on an exactly-periodic k-based sequence only,
      not on irregular natural x-based statistics; (e) corrects the
      S0-and-S2 T3-fields citation to name only S0; (f) softens the
      "regardless of what c turns out to be" sentence to cite the
      now-available V3-RA-1 measurement (this review's own
      attack1_output.txt) rather than asserting it follows from the bound's
      shape alone.
    - >-
      v4 may cite this review's own attack1_output.txt and
      attack4_verify_oeis_cross.py results directly as V3-RA-1's and part
      of V3-RA-3's required verification, rather than re-deriving them from
      scratch, per the review's own next_concrete_action.
    - >-
      Once v4 is drafted, a Coordinator decision must record that it closes
      all five gaps before the Stage 0-2 re-run, the power check, or the C2
      calibration run may be dispatched.
  knowledge_promotion:
