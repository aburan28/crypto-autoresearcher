  decision: revise
  decision_label: rcrep_definition_partially_discharges_rt103_c1_construction_cost_gap_obj5_surfaced

  context: >-
    Closes TASK-20260830-379668's composition of independent validator
    (TASK-20260830-495939) and red-team (TASK-20260830-031380) review of the
    r_R candidate-definition draft (TASK-20260830-351be7:
    rcrep-candidate-definition.yaml, rt103-c1-discharge-map.yaml,
    decision-record-among-alternatives.yaml), per the review_plan
    pre-recorded on that draft task's own handoff. Full composed verdict
    recorded in rcrep_definition_review_close_terminal_note_20260830 on
    ledger/goals/GOAL-ECDLP-001/goal.yaml. check_review_independence.py
    reports PASS.

  decision_scope: >-
    ACCEPTS as genuine, independently re-verified mathematical content (not
    restatement): g_I's definition, z_R's definition and squarefree-support
    argument, source occurrence-map semantics, the multiplicity/SET-claim
    narrowing, and the UNCONDITIONAL forward direction of the support
    biconditional (main_theorem Part 1). REVISES the draft's own discharge
    map on two points: (1) the exceptional-strata item (RT103-C1-08)
    overclaims that the worked example exercises "the tangent stratum";
    independently confirmed (validator) it exercises a distinct 2-torsion
    self-negation degeneracy, not the literal TANGENT marker (P_i=P_j) the
    draft itself defines -- honest count is zero of six named strata
    literally exercised, not one. (2) The decision-record-among-alternatives'
    own framing of "three independent textual facts" favoring the
    two-pairs/Theta(B^4) reading is REVISED to two: red-team's
    sentence-by-sentence swap test and proves-too-much Object 3 found the
    third ("robustness under re-derivation") figure-independent but
    non-discriminating (it produces an equally clean derivation for the
    REJECTED one-pair/Theta(B^2) reading unchanged), and found a further,
    secondary circular-by-import citation of DEC-20260830-69bbf7's own
    un-rederived "less literal fit" line. REJECTS treating RT103-C1 as
    discharged: the converse direction of the biconditional (main_theorem
    Part 2) remains a proof sketch conditional on unformalized heuristic
    H-RCREP-1, verified on only one fiber, now completed to both fibers of
    one B=1 instance by red-team's independent computation (root set of r_R
    in F_11 confirmed exactly {4} by two methods) but not generalized; the
    one-pair/two-pairs choice remains unadjudicated, with the rejected
    reading equally textually coherent; and a NEW major gap (OBJ-5,
    red-team) is recorded: neither candidate reading supplies a
    construction of r_R meeting H-CREP-001's own declared
    fresh_target_online_exponent_cap_in_B (1.25) or
    preprocessing_exponent_cap_in_B (2.25) -- direct materialization costs
    at least B^2 (one-pair) or B^4 (two-pairs) field elements online, far
    over cap under either reading, with no compact/implicit representation
    proposed.

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains approved).
    - It does not change EXP-CREP-001's specification (remains frozen, unmodified).
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not declare either the one-pair or two-pairs reading mathematically wrong.
    - It does not itself supply a compact construction for r_R or z_R meeting H-CREP-001's caps; that is named as the next concrete action, not performed here.

  non_claims:
    - This is not evidence that H-CREP-001's construction obligation is unmeetable in principle; OBJ-5 shows only that this draft's two candidate constructions, materialized directly, do not meet it.
    - The validator's and red-team's named divergences from the producer's own discharge map (the tangent-stratum overclaim, the "three facts" overclaim) are not evidence of bad faith; the producer's draft itself discloses named_residual_gaps and hedges the tangent language correctly in its own prose -- the overclaim is confined to the discharge map's summary framing.
    - Finding the reading ambiguity plausibly textually underdetermined is not a claim that no further specification could ever resolve it; it is a claim that further inference from the same fixed two-sentence fragment, by this analytical chain, is unlikely to.

  rationale:
    - "Both reviewers independently re-derived every load-bearing arithmetic claim in the worked example by hand, via routes differing from the draft's own presentation in at least one case (validator's and red-team's independent R_1(6,T) derivations via the double-root resultant identity), and found them correct -- genuine corroboration, not restatement."
    - "Red-team's proves-too-much Object 3 is dispositive on the strength of the choice justification: applying the draft's own point-3 method unchanged to the rejected reading reproduces that reading's own Theta(B^2) figure with equal cleanliness, which is the textbook proves-too-much failure signature and directly undercuts the claim that the choice rests on three independent facts."
    - "OBJ-5 is judged decisive and prior to the reading question: since both candidate constructions fail H-CREP-001's own numeric caps by a wide margin when materialized directly, resolving which reading is textually correct would not, by itself, produce a hypothesis-compliant construction -- the exponent-cap gap is the more consequential and more tractable next question."

