coordinator_decision:
  id: DEC-20260805-ae4a96
  goal_id: GOAL-MLDSA-001
  batch_id: BATCH-214d98
  recorded_at: '2026-08-05'

  decision: refine
  decision_label: >-
    BATCH-214d98 corpus analysis produces three partial observations.
    Lane B coverage questions are access_blocked on KN-LIT-3907 (wrong ePrint ID).
    Lane A confirms SelfTargetMSIS ≥ MSIS from KN-LIT-056 §4.2 but the formula in
    IDEA-3f7ab2 is unverified and parameter sets differ from FIPS 204. Refine:
    resolve ANO-1 (KN-LIT-3907 access) and recalibrate Lane A with correct FIPS 204
    or Round-3 Dilithium parameters before drawing conclusions.

  evidence_refs: [EV-MLDSA-56e35b]

  rationale: >-
    The decisive obstacle is ANO-1: the correct ePrint for KN-LIT-3907 was not
    located, its local PDF is absent, and this blocks both Lane B experiments from
    completing their coverage determination. Lane A produced a genuine observation
    (SelfTargetMSIS ≥ MSIS hardness from KN-LIT-056 §4.2) but the re-derivation
    formula was unverified and the TCHES 2018 Dilithium parameters differ from ML-DSA.
    A repair batch should: (1) locate the correct KN-LIT-3907 ePrint (try 2022 or 2023
    by Barbosa-Barthe-Doczkal-Don via arXiv or CRYPTO proceedings), (2) recalibrate
    Lane A arithmetic using the TCHES 2018 Table 2 values verified in this batch with
    a VERIFIED formula from the paper, not from the idea-generator.

  what_is_established:
    - >-
      From KN-LIT-056 §4.2: SelfTargetMSIS reduces from MSIS non-tightly in the ROM.
      This means SelfTargetMSIS is at least as hard as MSIS at all parameter sets
      tested. Classical BKZ hardness at TCHES 2018 sets: 68/103/138/176 bits (from
      Table 2 with ADPS16 cost model). All verified.
    - >-
      KN-LIT-8ce0b5 is out of scope for both the Shin DFA and Jendral glitch (NTT
      twiddle only). This is a negative placement — confirmed from abstract.

  what_is_NOT_established:
    - Whether Shin DFA or Jendral glitch fall inside or outside KN-LIT-3907's formal model.
    - The tightness factor for the CMA-to-NMA correction in KN-LIT-3907.
    - Any SelfTargetMSIS estimate at ML-DSA/FIPS 204 parameter sets.

  hypothesis_status_changes:
    H-MLDSA-f3a291: indeterminate  # access_blocked on KN-LIT-3907
    H-MLDSA-c7b4e8: indeterminate  # access_blocked on KN-LIT-3907
    H-MLDSA-d1e509: inconclusive   # formula unverified, parameter mismatch

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      ANO-1/2/3 block promotion. SelfTargetMSIS ≥ MSIS is a KN-LIT-056 statement
      already in the corpus; promoting it would duplicate KN-LIT-056. The TCHES 2018
      Table 2 re-derivation result is admissible as a controlled arithmetic confirmation
      but not as a new finding. The formula provenance anomaly (ANO-3) prevents any
      cost claim.

  next_actions:
    - >-
      Open BATCH-004: repair ANO-1. Fetch the correct Barbosa-Barthe-Doczkal-Don paper
      via arXiv (try arXiv:2309.XXXXX or CRYPTO 2023 proceedings). Also try
      https://eprint.iacr.org/2023/522 (a candidate based on authors/title pattern).
      Once the paper is located: (a) update KN-LIT-3907 with the correct identifier;
      (b) re-run EXP-MLDSA-a8d531 and EXP-MLDSA-2b6f17 with the full text;
      (c) extract the tightness factor for IDEA-3f7ab2.
    - >-
      In BATCH-004: verify the formula cost_SelfTargetMSIS from the paper or from a
      cited source before using it. If KN-LIT-056 does not state this formula,
      identify the correct formula from its SelfTargetMSIS analysis section.

  decided_by: coordinator
  decided_at: '2026-08-05'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
