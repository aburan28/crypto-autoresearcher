  open_items:
    - id: OI-1
      subject: L-2, task-card read_scope pointer error for the J2 cost figure.
      detail: >-
        The task that dispatched TASK-20260827-be6fc9 pointed the reviewer at
        `experiments/EXP-DREG-004/` for the n=12/D6 cell's
        `resource_measurements.wall_seconds_aggregate`; that figure actually
        lives under
        `coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/run_manifest.yaml`
        (EXP-DREG-001's cell, not EXP-DREG-004's). The reviewer located the
        correct source itself before reading either producer artifact and the
        cited figure (13,789.26 s) matched exactly; this is a defect in a task
        card, not in the reviewed artifacts, and did not block the PASS. A
        future dispatching session for the C1 Executor task should correct
        this pointer in its own read_scope rather than repeat it.
    - id: OI-2
      subject: L-3, RR-7's quantitative instruction only partially discharged on row B.
      detail: >-
        Row B's `sota_delta` states its cost delta as a genuine number
        (~2400 s) but its evidence_value delta in ordinal words ("drops from
        high to low") rather than as a number. Non-blocking per the reviewer
        (the decision-relevant, load-bearing figure is quantified and the
        qualitative language carries a specific, citable mechanism -- loss of
        OBJ-013-4 discrimination credit). Carried forward as a documentation
        gap for a future re-rank that revisits item B, not repaired by this
        decision.
    - id: OI-3
      subject: L-5, independence-clause wording imprecision.
      detail: >-
        lane-contract.yaml `independence_note` requires "a verdict that
        supports dispatch" rather than the literal token PASS. No exploit of
        this wording gap was found (a categorical backstop clause and the
        explicit `execution_authorized: false` boolean both independently
        foreclose an unreviewed run), but a future lane contract in this
        program should pin the literal verdict token rather than rely on
        institutional precedent to resolve the phrase.
    - id: OI-4
      subject: L-6, D=6-vs-d_reg optimism note on item C1's evidence_value.
      detail: >-
        ranking.yaml row C's `evidence_value: very_high -- directly
        instantiates GOAL-DREG-001's own completion criterion` may be
        optimistic: GOAL-DREG-001's completion criterion is evaluated "at D up
        to and including d_reg where reachable", and C1's own binding
        predicate is satisfied "at the pre-registered degree D" -- a D=6
        default per ranking.yaml `open_items` OI-1, not a confirmed d_reg for
        n=15. The already-admitted n=12 cell carries the identical caveat
        verbatim in DEC-20260810-da7513 ("deficit_genuine IS NOT d_reg ... the
        distance between the two is not quantified anywhere in this record").
        This is a pre-existing, program-wide interpretive gap in what counts
        as a completed "rung", predating and not worsened by this repair
        round. A future Coordinator decision interpreting C1's eventual
        results should read its evidence_value against this caveat, not at
        face value.
    - id: OI-5
      subject: identify the pre-existing single-seed n=15 anchor and its degree D.
      detail: >-
        Carried from ranking.yaml `open_items` OI-1: `experiments/EXP-DREG-004/specification.yaml`
        `title` references a deficit series implying an existing single-seed
        n=15 anchor (deficit=1862) somewhere in this program's records, not
        located by TASK-20260827-765027 and not located by this act either
        (outside this task's read_scope). The future dispatching session for
        item C1 must identify that record, confirm its degree D, and either
        reuse it for continuity of the deficit series or record a deliberate
        deviation with a reason -- not invent a D value. Absent that record,
        D=6 is the pre-registered default.
    - id: OI-6
      subject: a second, independently-coded rank engine (OBJ-013-4's actual resolution).
      detail: >-
        Carried from ranking.yaml `open_items` OI-2 and review-report.yaml
        limitation L-7. No such engine exists anywhere in this repository.
        Named, not minted: a future batch's implementation and validation of
        one is executor-scale work requiring its own handoff, budget, and
        controls.
    - id: OI-7
      subject: host-headroom figure remains unreconciled (RR-10).
      detail: >-
        ranking.yaml `host_headroom_reconciliation` leaves the frozen "load
        ~5.8" (lane-contract.yaml, 2026-08-15) and the commissioning
        handoff's "load-average ~37" (same date) UNRECONCILED, deliberately,
        rather than substituting a current reading. Binding consequence
        carried forward: the future dispatching session for item C1 MUST
        independently re-check current host headroom (cores, load average,
        free disk) at dispatch time, under max_concurrent=1, before launching
        any invocation.

