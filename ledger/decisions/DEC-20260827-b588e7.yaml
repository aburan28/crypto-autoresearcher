  decision: approve

  decision_scope: >-
    THIS RECORD ACCEPTS ONE ARTIFACT PAIR AS THE OFFICIAL BATCH-006
    DISPOSITION AND AUTHORIZES ONE FUTURE DISPATCH, NARROWLY. It (1) accepts
    the superseding ranking and lane contract (TASK-20260827-765027) as the
    operative BATCH-006 ranking, replacing the blocked TASK-20260812-f6df51
    ranking as the batch's live disposition (the v1 artifacts themselves stay
    byte-unmodified and are not edited, deleted, or superseded in their own
    right -- they remain the byte-bound source of the accepted
    TASK-20260812-23e086 archive); (2) names item C1 (the n=15
    completion-criterion ladder rung: >=3 seeds, sem + semi-regular-null-matched
    control, full-column exact rank) as the corrected frontier's sole ranked
    winner, superseding item B, which is RETAINED on the record in restated,
    downgraded form (pivot-accounting-bookkeeping-only, per
    `item_b_retained_downgraded` below) rather than deleted; (3) accepts that
    RR-1..RR-10 of DEC-20260812-f56a44 are discharged, on the review's
    `rr_discharge_audit`; and (4) AUTHORIZES ITEM C1's EXECUTION AS THE NEXT
    WAVE OF THIS REPAIR TRACK -- a future Executor dispatch under a task not
    yet minted, bound to lane-contract.yaml's exact budget, seeds, and failure
    modes -- WITHOUT ITSELF EXECUTING, DISPATCHING, OR RUNNING ANYTHING. See
    `execution_authorization` below for the precise scope of that
    authorization. This record changes no hypothesis status, closes no batch,
    closes no goal, files no evidence, and promotes no knowledge entry.

  execution_authorization:
    execution_authorized_by_this_decision: true
    what_is_authorized: >-
      ONLY THE FUTURE DISPATCH OF ITEM C1 AS THE NEXT WAVE, and only in the
      sense that this decision discharges the one remaining precondition
      lane-contract.yaml's own `independence_note` names -- "(a) this
      superseding ranking and lane contract have themselves cleared their own
      required independent review ... with a verdict that supports dispatch,
      AND (b) a Coordinator ledger decision has been filed on that verdict
      authorizing wave 3." Condition (a) is satisfied by TASK-20260827-be6fc9's
      PASS; THIS RECORD IS CONDITION (b). Once this record is committed, a
      future session may mint a fresh TASK-* handoff for an Executor to run
      item C1 under lane-contract.yaml's exact `exact_budget`,
      `deterministic_seeds`, and `failure_modes` blocks, followed by its own
      snapshot, independent review, and ledger archive -- the SAME lifecycle
      this repair round itself just completed.
    run_performed: false
    no_run_happens_in_this_act: >-
      STATED EXPLICITLY. This record is a Coordinator ledger act on a review
      verdict of two control-plane artifacts (a ranking and a lane contract).
      No experiment ran, no run was executed, no measurement was made, no
      Executor was dispatched, and no `RUN-*` or `EV-*` record is created or
      cited as new evidence by this act. `scientific_effect: none`.
    what_is_NOT_authorized_by_this_record: >-
      TODAY'S EXECUTION OF ANYTHING. This record does not itself dispatch item
      C1, does not itself commission the Executor handoff, does not itself
      verify current host headroom (lane-contract.yaml `host_headroom_check`
      names that as the dispatching session's own obligation, unresolved
      between the 2026-08-15 figures "load ~5.8" vs "load-average ~37" --
      ranking.yaml `host_headroom_reconciliation`), and does not waive
      lane-contract.yaml's own `execution_authorized: false` field AS WRITTEN
      IN THAT FROZEN ARTIFACT -- that field remains true to the artifact's own
      byte-identical text and is not edited by this decision. A reader who
      treats this record as authorizing a run TODAY, rather than as the
      precondition that lets a FUTURE dispatch mint its own task and proceed,
      has misread it. Item B (CTRL-013-OPTIONAL-RERANK), item A2 (the C2
      archive-binding repair), and every other row on the frontier remain
      exactly as unauthorized to run as they were before this record.

  item_b_retained_downgraded: >-
    Item B (CTRL-013-OPTIONAL-RERANK) is NOT deleted, NOT ignored, and NOT
