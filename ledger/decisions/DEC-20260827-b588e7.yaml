    restated, for a later batch's consideration (ranking.yaml
    `ctrl013_rerank.status_note`), NOT dispatched by this act or by
    TASK-20260827-765027. It retains value only as a harness/bookkeeping
    smoke test and does NOT address OBJ-013-4, which remains open.

