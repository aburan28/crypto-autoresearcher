coordinator_decision:
  id: DEC-20260904-0f525b
  context: >-
    Resume decision for GOAL-MONO-001 under the standing-launch harness
    (step 9.1: resume a paused goal whose recorded pause reason is now
    demonstrably cleared; the clearing is recorded HERE, not by silently
    flipping status). This decision opens NO measurement batch, authorizes NO
    run, census, or experiment, and dispatches exactly one review task.
  decision: approve
  target_ids: [GOAL-MONO-001, DEC-20260810-2f86db, EV-MONO-a0a89c]
  rationale:
    - id: R-1
      text: >-
        THE RECORDED PAUSE REASON IS CLEARED BY DIRECT MEASUREMENT TODAY.
        DEC-20260810-2f86db D-8 records the blocker as infrastructure: "every
        API backend unusable for want of credentials - anthropic, fireworks,
        fireworks-anthropic, openai, openrouter, zai and zai-anthropic each
        reporting $..._API_KEY unset (backend unusable) - with only local
        reporting OK", so "a genuinely model-independent review-breakthrough
        at max effort is NOT OBTAINABLE on this harness as currently
        credentialed". Re-run today (2026-09-04, worktree
        mono-closure-review-20260904 at commit 5158ec993):
        `PYTHONPATH=. python3 -m orchestration.adapter doctor --probe` reports
        OK credentials AND verified serving for fireworks
        (accounts/fireworks/models/glm-5p3) and openai (gpt-5.6-luna,
        gpt-5.6-sol, gpt-5.6-terra); openrouter and anthropic remain
        uncredentialed.
    - id: R-2
      text: >-
        THE POLICY RESOLVES UNDEGRADED, AS D-8's what_would_change_it REQUIRES.
        `python3 -m orchestration.adapter resolve --policy review-breakthrough
        --backend openai --independent-session ...` returns backend=openai,
        resolved_model_id=gpt-5.6-sol, verified_model=true,
        model_provenance=operator-supplied, fallback_used=false,
        degraded_requirements=[], reasoning_effort=max (uncapped, matching
        policy_reasoning_effort=max). The default (no --backend) resolution
        prefers anthropic/claude-opus-5, which doctor reports uncredentialed
        today, so the review is dispatched with --backend openai explicitly.
        This satisfies DEC-20260810-2f86db rule_12_status
        .what_would_change_it verbatim: "One additional genuinely resolvable
        backend, credentialed, plus a dispatched review-breakthrough task at
        max effort in an independent session."
    - id: R-3
      text: >-
        THE REVIEW IS GENUINELY MODEL-INDEPENDENT OF THE PRODUCERS THIS TIME.
        CORR-20260802-1d8384 OI-2 records the standing confound: the producer,
        its reverification pass, the Validator and the Red Team of BATCH-003
        all resolved to the same model. The reviewer dispatched under this
        decision runs on gpt-5.6-sol via the openai backend - a different
        family from the GLM/qwen backends that produced the underlying
        observations on this harness - so the MODEL CORRELATION confound
        EV-MONO-a0a89c records is materially reduced for this round.
    - id: R-4
      text: >-
        SCOPE OF RESUMPTION: REVIEW-ONLY. The goal record gates "any new
        batch" on the five CORR-20260802-1d8384 OI-1 successor-harness
        repairs AND on a fresh budget grant from GOAL-PATH-001
        (campaign_budget.maximum_batches is 3 and BATCH-003 was the third).
        This decision opens BATCH-5abf72 as a REVIEW-ONLY batch - one
        reviewer task, no harness execution, no run, no census, no experiment
        - so the OI-1 harness-repair gate is not engaged (OI-1 binds the
        successor measurement harness, which this batch does not touch), and
        the campaign batch accounting is NOT raised: maximum_batches stays 3;
        BATCH-5abf72 spends no run budget and no wall-clock beyond one
        reviewer session. This reading follows DEC-20260810-2f86db D-6/D-7/D-9,
        which identify the rule-12 review as the ONLY remaining gate for
        criterion (c) and name it "the immediate next step". If a reviewer or
        later reader judges the batch/budget gate to bind review rounds too,
        the fallback is exactly the pre-2026-08-10 state: goal returns to
        paused blocked-on-review, and this decision stands as the recorded
        attempt. That judgement call is recorded here for audit.
    - id: R-5
      text: >-
        WHAT THIS DECISION DOES NOT DO. It does not adopt the no-go as official
        closure (that is the reviewer's round and the follow-on decision); it
        does not change any hypothesis status (GOAL-MONO-001 has none);
        it does not record any attestation or verdict (none obtained yet); it
        does not touch the D-4/D-5 successor proposal (still untested, still
        gated on its own m=3 collapse check); it does not authorize any
        measurement under the rejected instrument form.
  evidence_refs: [DEC-20260810-2f86db, EV-MONO-a0a89c, CORR-20260802-1d8384]
  limitations:
    - >-
        This is a process decision, not a cryptanalytic one. Claim-tier ceiling
        stays toy; nothing here bears on ECDLP hardness at any scale.
    - >-
        The adapter state is a credential fact of 2026-09-04 and is
        re-checkable from the recorded commands; it is not a research finding.
  next_actions:
    - >-
        Dispatch TASK-20260904-91ab5b (reviewer, review-breakthrough, max,
        independent session) under BATCH-5abf72 after the snapshot archive,
        via the api_direct runtime with --backend openai. The handoff carries
        the full review_plan with the Coordinator prior recorded before the
        reviewer runs.
    - >-
        On the reviewer's return: snapshot-archive its report; then a ledger
        archive with the evidence record for the review and, if the verdict is
        CONCUR on all joints, the closure decision adopting DEC-20260810-2f86db
        D-1 as the criterion-(c) no-go and moving GOAL-MONO-001 to completed.
        A DISSENT on any joint leaves the goal paused with the dissent's
        grounds as the recorded reason.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Process/resumption decision; no research finding is produced by it. Any
      knowledge promotion belongs to the closure decision that follows the
      rule-12 review, not to this record.
  decided_by: coordinator
  decided_at: '2026-09-04'
