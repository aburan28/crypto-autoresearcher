      only outcome the evidence supports, exactly as audit-report.md itself
      states -- this decision does not re-score a frozen protocol after
      seeing its data; it independently corroborates the two facts the
      audit's own OPEN classification rests on.
    - >-
      CLAIM TIER AND CERTIFICATE. This is a zero-run symbolic proof audit
