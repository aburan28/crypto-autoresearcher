  rationale:
    - >-
      BOTH REVIEW-PLAN JOINTS ARE STRONGLY CORROBORATED BY A GENUINELY BLIND
      INDEPENDENT CHECK. TASK-20260928-b9a4de fetched arXiv:2511.09459v1
