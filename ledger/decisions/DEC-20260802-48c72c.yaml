    new_prohibitions_from_this_batch:
      - id: SP-7
        text: "The per-row bootstrap c_low/c_high (about 0.005 wide in c) may NEVER be cited as the uncertainty on c. Quote c_point only, with MA-3 attached; where a spread is wanted, quote the spread across the six (series, window) fits at that alpha, which is 0.084 in c at NIST-I alpha = 1 - seventeen times the bootstrap width."
      - id: SP-8
