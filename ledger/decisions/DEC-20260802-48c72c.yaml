    conclusion: >-
      The run set is valid and admissible and is NOT returned to the Executor. No
      defect found by either reviewer is an execution defect. Two of the material
      findings are defects of the FROZEN CONTRACT, which this Coordinator wrote
      (the tolerance's missing variance term; the retained non-independence),
