  official_positions_after_this_decision:
    concrete_threat_nist1: >-
      INCONCLUSIVE - verdict unchanged, content materially revised. Both
      reviewers reach this independently and the Coordinator concurs. THE SIGN IS
      ROBUST: all eighteen measured-gamma readings (6 fits x 3 alphas) put the
      modelled margin at w = 2^30 in [8.3498, 13.1544], whose worst member clears
      the 2.2309-bit band by 6.1 bits and the 3.5133-bit band by 4.8. THE
      MAGNITUDE IS NOT: adding L4 the defensible span is [8.3498, 22.2927], width
      13.9429, at alpha = 1 throughout, or [8.3498, 24.9708], width 16.6210,
      allowing alpha in {0, 1, alpha_hat} - four to seven times the
      irreproducibility band, and still set almost entirely by a subroutine
      nobody has written. The surviving question is no longer "5 bits or 23 bits"
      but "8 bits or 22 bits", on a homogeneous, complete-grid, fully
      null-controlled measurement whose estimator passed a real self-validation
      gate against a real defect. Two scenario families are now dead (near-zero
      margin, retired in BATCH-002 and killed here by a method ceiling; and
      c = 0, refuted by the measurement). A 14-to-17-bit interval is not a
      concrete threat assessment, and AGENTS.md rule 7 forbids presenting an
      80-bit-field measurement over ell <= 211 as validation at NIST-I.
      Additionally: a pre-registered falsifier fired (FC-4), and a fired falsifier
      is not a state in which a concrete-threat verdict moves.
    concrete_threat_nist3_nist5: >-
      UNCHANGED (not threatened under any tested overhead scenario). The corrected
      law RAISES the modelled overhead at those levels too (NIST-III c in
      [1.232366, 1.488390], NIST-V [1.178237, 1.435130]), and those margins
      survive even the overstated scenarios, so the position is not in doubt from
      that direction. It inherits every limitation of the c-model, including the
      untested Heuristic 1 tail that sets P0.
    mathematical_validity_conditional: "UNCHANGED. Untouched by this batch."
    heuristic_1_status: >-
      UNCHANGED AS A VERDICT AND NOW THE BINDING UNCERTAINTY IN THE PROGRAMME.
      Nothing in this batch bears on Heuristic 1; the run says so itself.
      RT-H1..RT-H4 remain open and NC-3 and NC-6 remain unrun since BATCH-001.
      This is elevated from a background caveat to the binding item because the
      c-programme has now resolved the measured-gamma contribution to a 4.805-bit
      span and, on the Red Team's method-ceiling argument (RT3-P3), is AT ITS
      CEILING - while P0 multiplies every margin row identically and has never
      been tested in three of four budgeted batches.
    per_entry_cost_calibration: >-
      REVISED AND STRENGTHENED. Section 4.1's one-F_{p^2}-operation-per-entry
      convention remains REFUTED AT THE TESTED SCALE in the attack's DISFAVOUR,
      now on a homogeneous complete 47-ell grid with 100 per cent null coverage.
      Seam-free exponents over W-MID: gamma_A = 0.9328644281 (schoolbook),
      gamma_B = gamma_S-MIN = 0.8100336227 (Karatsuba), with fitted levels at
      ell = 1 of 2^9.298 and 2^9.731. The refutation does not depend on the
      exponent, the law, or the seam: the null object, flat in ell by
      construction, still costs 4914.45 to 5118.83 multiplications per entry,
      i.e. REF_null = 12.2595 MEASURED bits above the assumed 1. NEW: the
      Karatsuba series carries a phase-locked recursion-band structure of -0.0749
      bits per level which the schoolbook series does not (+0.0066), so
      gamma_B = 0.810 is a transient of the unimproved shared reduction and is
      NOT an asymptotic exponent.
    extrapolation_law_status: >-
      REPAIRED AND CITABLE IN A BOUNDED FORM. The corrected law
      c = [log2 A + alpha*log2(log2 p_level / log2 p_meas) + gamma*log2 B_opt] /
      sqrt(log2 p_level) passes its pre-registered null gate at 0.271670 of a
      0.75-bit tolerance where the superseded law fails by up to 12.605090. Its
      binding pairing_rule - an intercept always with the slope of the same fit of
      the same series over the same window - is a structural fix that closes the
      whole defect family adjudication A found one instance of, and it is what
      makes A-3 cost 1.007 bits instead of 2.4. Its LIMITS are equally official:
      the gate tests level retention only, at about 1.4 noise units (MA-7); the
      charging point overstates by 0.60-1.00 bits (adjudication D); and alpha
      carries the MECHANISM-INCONSISTENT label (adjudication E).

  rationale:
    - >-
      The run set passed every validity pre-check before any interpretation, and
      the checks were not taken on the producer's word: supersession integrity was
      verified by comparing GIT TREE OBJECTS at three commits rather than by
      inspection, the null coverage fraction was verified by reconstructing the
      sample index rather than by reading the coverage field, and the membership
      rule was verified by rebuilding the response from 752 per-sample records
      rather than by reading the producer's membership code.
    - >-
      The repair is upheld because it is falsifiable and was actually tested
      against the defect it targets: the superseded law fails the same gate by a
      factor of about seventeen. That is the correct standard for accepting a
      repair, and it is the standard the contract pre-registered - including the
      failure consequence, which was binding and which the Executor would have had
      to report had the gate missed.
    - >-
      The gate's weakness is recorded WITH its power rather than instead of it,
      because a record that carries only one of those facts misleads in one
      direction or the other. The missing variance term is a defect of the
      contract this Coordinator froze, and it is attributed accordingly.
    - >-
      A-3 is adjudicated as an identified implementation artifact rather than as
      an exponent revision because two independent reviewers reached the same
      mechanism from different evidence - one from a residual sawtooth
      phase-locked to a threshold read out of the committed instrument, the other
      from reading that the reduction routine is schoolbook and shared - and
      because the discriminating control is a NULL ON THE EXPLANATION that costs
      nothing and passes: the same regressor does 72 per cent of the residual
      variance on the recursive routine and nothing on the non-recursive one.
    - >-
      RT3-C1 is given full weight precisely because it cuts against the Red
      Team's own prior direction and moves the number toward the attack. An
      objection that a reviewer raises against its own position, quantifies by
      exact enumeration, and cross-checks against an asymptotic, is stronger
      evidence than one that flatters it. The same applies to the two
      self-retractions (CORR-3, CORR-4) and to the candidate objection the Red
      Team checked and DISCARDED (the Theta(ell) instantiation floor), which is
      recorded as a failed objection rather than pressed.
    - >-
      A pre-registered falsifier that fires is not lifted by a post-hoc
      restriction of the grid it fired on, however good the diagnosis. This
      decision adopts that reasoning explicitly and against the convenience of
      every alpha = 1 row it would otherwise be free to cite, because the
      alternative - retiring a falsifier by argument - would make
      pre-registration decorative.
    - >-
      Citability is granted in a bounded form rather than withheld, because
      withholding it would leave the programme with no way to state what three
      batches measured, and granted as a BRACKET rather than a number because the
      window and alpha choices move c by 13 to 21 times the sampling band. The
      two reviewers' conflicting treatments of W-TOP are reconciled by
      distinguishing the ESTIMATE from the SENSITIVITY rather than by averaging
      them.
    - >-
      A calibration whose defensible span is 13.94 to 16.62 bits against a
      2.23-to-3.51-bit band has not decided the NIST-I margin, however much it
      narrowed it. The completion criterion is assessed as NOT MET on the
      numbers, with no adjustment to the criterion after seeing the outcome, and
      no protocol_amendment was made or is sought.

  completion_criteria_assessment:
    criterion_1: >-
      NOT MET, on both halves, and now assessed as UNREACHABLE BY THIS METHOD
      WITHIN THE REMAINING BUDGET. (a) ERROR: the defensible modelled margin span
      at w = 2^30 is [8.3498, 22.2927] bits at alpha = 1 throughout, width
      13.9429, or [8.3498, 24.9708], width 16.6210, allowing alpha in
      {0, 1, alpha_hat}, against irreproducibility bands of 2.2309 bits (NIST-I
      time) and 3.5133 bits (largest absolute deviation anywhere in
      RUN-WESOVOW-001's C1 control) - four to seven times the band. (b) SURVIVAL:
      the calibration DID survive independent review this time, which is a real
      change from BATCH-002 - the Validator's verdict is admissible with 12 of 12
      gating controls passing on its own recomputation, and the Red Team broke it
      on none of six fronts - but both reviewers still decline to move the NIST-I
      question, and a pre-registered falsifier fired.
      WHY UNREACHABLE, STATED AS A METHOD CEILING RATHER THAN AS FATIGUE: the
      residual width is dominated by L4, an UNIMPLEMENTED subroutine worth 11.50
      to 13.25 bits, which the frozen paper itself names as the expected
      implementation route. Narrowing it requires building a batched
      implementation, which is a research project and not a control. RT3-P3 states
      the ceiling exactly: this method can narrow the overhead FROM ABOVE within
      [0, 1] in the exponent, and it has now done that to a 4.805-bit span on the
      measured-gamma axis.
    criterion_2: >-
      MET ONLY ON VERIFICATION of the TASK-20260802-c1f7c8 ledger archive by the
      dispatcher's post-commit verifier. NOT asserted as met here: a record in a
      working tree is not durable evidence, and an official transition may not
      rest on an unverified commit.
    criteria_unchanged: >-
      The criteria themselves are UNCHANGED. Success criteria are never adjusted
      after observing an outcome without a versioned protocol_amendment, and none
      was made.
    contract_completion_gate: >-
      MET for RUN-PEC-49c773-a. RUN-PEC-6be870-a's gate remains UNMET and is a
      separate fact (SP-6).
    goal_status: >-
      GOAL-P13-001 REMAINS `active` FOR EXACTLY ONE MORE BATCH, with exactly one
      next action. It may NOT be marked `completed`: criterion 1 is not met, and
      closure independently requires the three-model quorum of AGENTS.md rule 13
      - three CONCUR attestations with pairwise-distinct RESOLVED model ids in
      independent sessions - which this harness cannot supply, since every
      subagent resolves to the same inherited model under
      INFAMEND-20260802-P13-002. No attestation has been obtained and none is
      recorded. GOAL-P13-001's presence in tools/validate_ledger.py's
      PRE_QUORUM_GOAL_IDS exemption is a prospective-rule artifact and MUST NOT
      be used as a route to close this goal without a quorum; retiring a goal
      that DID meet a criterion under `paused`, `blocked` or `closed_at_budget`
      to avoid the quorum would likewise be a contract violation, and no such
      manoeuvre is attempted here because criterion 1 is genuinely unmet.
      WHY `active` AND NOT `paused` NOW: pause condition 2 ("the empirical
      calibration cannot be brought below the irreproducibility band within the
      campaign budget") is now TRIGGERED FOR CRITERION 1 SPECIFICALLY, and this
      decision says so plainly. Pausing the whole goal today would nevertheless
      be premature closure in the sense of docs/inventor-protocol.md - a failure
      mode symmetric with overclaiming - because two of the three items that
      currently qualify every citation cost minutes and zero compute
      respectively, and because the term that multiplies every margin row (P0,
      via Heuristic 1's tail) has never been tested in three batches. Declining
      to spend a remaining batch on the untested load-bearing term, on the
      grounds that a DIFFERENT term is saturated, is exactly the move the
      protocol forbids.
      PRE-COMMITMENT, RECORDED NOW SO IT IS NOT A LATER JUDGEMENT CALL: BATCH-004
      is NOT an attempt to meet criterion 1, which this decision has already
      assessed as unreachable by this method. After BATCH-004 the goal moves to
      `paused` or `closed_at_budget` with the narrowest supported result
      recorded, never to `completed`, absent a genuine three-model quorum.
    budget: "Three of four budgeted batches are spent (BATCH-001, BATCH-002, BATCH-003). ONE remains. A remaining batch is a permission, not an obligation."

  what_the_batch_established_recorded_so_it_is_not_lost_among_the_caveats:
    the_repair: >-
      A defective estimator was replaced under a superseding contract frozen
      before any datum, and the replacement was validated against an object whose
      answer was known - passing at 0.271670 of a 0.75-bit tolerance where its
      predecessor misses by up to 12.605090 and fails everywhere. The seam that
      made the BATCH-002 headline uninterpretable is measurably gone
      (0.395971 -> 0.017345 bits at 101/103), null coverage is 1.0000 in every
      fitted window BY CONSTRUCTION rather than by luck, and the ell = 97
      infrastructure gap is closed.
    the_structural_contribution: >-
      The pairing rule. Stated before the data, it converts an anomaly that would
      otherwise cost 2.4 bits and fall outside the published bracket into one
      costing 1.007 bits inside it, and it closes a defect FAMILY where
      adjudication A closed an instance. The Red Team names it "the part of this
      repair most worth promoting to the knowledge corpus", and the Coordinator
      agrees.
    the_diagnostic_contribution: >-
      A-3 is named, not merely bounded: the Karatsuba recursion staircase, with a
      free null-object control on the EXPLANATION (a depth regressor that
      explains 72 per cent of the residual variance on the recursive routine and
      nothing on the non-recursive one). That converts an unexplained anomaly
      into an identified implementation artifact AND yields a
      counter-consideration against the programme's own convenient reading.
    the_process_result: >-
      Both reviewers reproduced every gating number from raw data with their own
      code; the Red Team was assigned to attack its own repair and retracted two
      of its own prior sentences in doing so, priced an objection that cuts
      against its own position, and recorded a candidate objection it checked and
      discarded. A pre-registered falsifier fired and was neither tuned away by
      the Executor nor lifted by post-hoc analysis. That is the machinery
      working, and it is recorded as an outcome rather than as an embarrassment.
    what_the_narrowing_is_worth: >-
      The defensible NIST-I margin interval at w = 2^30 went from [5.40, 22.67]
      (width 17.27) to [8.3498, 22.2927] (width 13.9429) on the like-for-like
      alpha = 1 convention - a 19.3 per cent narrowing with the LOW END UP 2.95
      BITS - and the old 5.40 low end NO LONGER EXISTS, because it came from a
      quadratic on a compositionally mixed response. It is a real contribution
      and it is not a determination.

