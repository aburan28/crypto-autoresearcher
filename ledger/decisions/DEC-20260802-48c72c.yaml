  promotion_gate_check:
    applies_because: "H-WESO-001 carries an asymptotic-complexity claim (p^{1/3+o(1)}), so agents/coordinator.md's four promotion gates bind any move toward `supported`."
    gate_1_proof_decomposition: "NOT SATISFIED by committed artifacts. No archived single-responsibility lemma decomposition of the frozen paper's theorem exists in this repository."
    gate_2_numbered_heuristics_with_validation: >-
      PARTIALLY SATISFIED AND MATERIALLY IMPROVED, AND THE GAP IS THE BINDING
      ONE. The run's own modelling assumptions L1-L6 are now numbered, each with
      a status and a DIRECTION, and L5 and L6 carry falsifiers that actually
      fired or were actually evaluated - the Red Team records this as a material
      improvement on its predecessor rather than manufacturing an objection. But
      L1, the load-bearing one, has a status (UNTESTED) and a magnitude (6.48 to
      18 octaves) and NEITHER a falsification condition NOR a random-model
      justification. And Heuristic 1 itself - the heuristic the paper's theorem
      is conditional on - has had NO validation experiment run in three batches
      (NC-3 and NC-6 unrun since BATCH-001). Gate 2 is what next_actions
      addresses.
    gate_3_concrete_cost_honesty: >-
      SUBSTANTIALLY SATISFIED FOR THIS PROGRAMME'S OWN COST MODEL and not for the
      claim. The Validator's cost-model checks CM-1..CM-4 pass: declared unit,
      optimistic assumptions flagged with both directions reported and NOT
      netted, memory recorded beside time for the run and located in
      EXP-WESOVOW-001 for the modelled table (2^93.28 entries at NIST-I), and the
      per-attempt-cost x inverse-success-probability bookkeeping verified correct
      again by the Red Team in RUN-WESOVOW-001's chain. The affected-vs-safe scope
      statement exists (CSIDH, (qt-)Pegasis and torsion-based constructions
      explicitly disclaimed). What is missing is the o(1) characterization for
      the paper's own asymptotic, which this programme has not produced.
    gate_4_independent_review: >-
      NOT SATISFIABLE IN THIS HARNESS. AGENTS.md rule 12 requires an independent
      `review-breakthrough` review at `max`, which is the one policy that may
      never be degraded. INFAMEND-20260802-P13-002 records that this harness
      cannot resolve the policy aliases or set or verify a reasoning-effort tier.
      A red-team pass on the cost model and the heuristics DOES exist and is of
      high quality; the breakthrough tier does not and may not be claimed.
    conclusion: "A claim missing any gate may reach `analyzed` and never `supported`. H-WESO-001 stays `analyzed`."

  adjudications:

    - id: A
      title: "THE REPAIR HOLDS. Both defects of DEC-20260802-8227b9 are repaired, one fully and one structurally."
      finding: >-
        UPHELD ON INDEPENDENT VERIFICATION, not on the producer's word. NC2b-G1
        PASSES at the pre-registered 0.75-bit tolerance with a worst miss of
        0.271670 bits at (W-MID, log2 p = 768), while the SUPERSEDED law applied
        to the same null object misses by 12.176314 to 12.605090 bits and fails
        at every point - a factor of about seventeen above tolerance. The
        Validator recomputed the gate from the committed superseded null with its
        own implementation of the frozen law and agrees to every digit reported,
        confirming the tolerance, the evaluation level (alpha = 0) and the
        reference statistic are the frozen ones and not relaxed ones. c_null at
        NIST-I is 0.759087 against the ~0.77 that DEC-20260802-8227b9's repair
        clause pre-registered.
        THE SEAM IS GONE AND ITS SIZE IS CONFIRMED BY DIRECT MEASUREMENT: 47
        acquired ell, 47 admitted, 0 excluded; both implementations at every
        admitted ell at the identical j-set {0..7}; the 101 -> 103 step falls
        from 0.395971 bits in the superseded mixed response to 0.017345 bits,
        against 0.027440 expected from a smooth ~0.97 exponent; and the
        superseded-comparison table's 21 non-zero differences are ALL on the
        extension and ALL negative, i.e. the seam, measured. ell = 97 was
        re-acquired at exactly the byte length and SHA-256 the Validator obtained
        when it fetched that URL itself in BATCH-002, so the BATCH-002
        obstruction is confirmed transient. C-NULL coverage is 47/47, 43/43, 8/8
        = 1.0000 in every fitted window, and coverage is now a PRECONDITION OF
        MEMBERSHIP rather than a verdict recorded afterwards, so F-3 cannot recur
        under any truncation - which is the right kind of fix. C-REPRO reproduces
        all 884 overlapping samples bit-for-bit, independently reconstructed by
        the Validator, so the seam-free refit is genuinely comparable to the fit
        it supersedes.
      dispositions: "Validator F-1 RESOLVED; F-3 RESOLVED; F-4 PARTIALLY RESOLVED (see adjudication G)."
      what_it_is_not: >-
        NC2b CHANGED AN ESTIMATOR, NOT A MEASUREMENT. A corrected c is a
        corrected MODEL SUBSTITUTION. Nothing in adjudication A moves any claim
        about the attack, and the contract said so in advance.

    - id: B
      title: "THE GATE IS WEAKER THAN ITS MARGIN SUGGESTS. Both facts are recorded, not one."
      finding: >-
        UPHELD (Validator V-1, corroborated by Red Team RT3-C6). The frozen
        contract derived its 0.75-bit tolerance from the committed null's
        REALISED flatness (0.202 bits) plus its realised slope drift
        (|gamma_null| * log2 B_opt = 0.346 bits), summed to ~0.55 and rounded up.
        THAT DERIVATION CONTAINS NO TERM FOR THE SAMPLING ERROR OF THE NULL
        SLOPE, which is the dominant term once the slope is multiplied by a lever
        arm of up to 26.1. Analytic 95 per cent prediction intervals on the
        extrapolated level: +/- 0.1506 and +/- 0.3523 bits on the committed
        null's 21-point W-MID window at log2 B_opt = 14.2 and 26.1, and
        +/- 0.4875 and +/- 1.3626 on the new 8-point W-TOP arm.
      the_two_facts_that_must_travel_together: >-
        (1) THE PASS IS REAL at the pre-registered tolerance - the observed
        0.271670 sits inside its own +/- 0.3523 band and the Validator confirms
        the verdict - but the remaining 0.478330 bits is ABOUT 1.4 NOISE
        HALF-WIDTHS, not a 0.478-bit cushion. (2) THE GATE STILL DISCRIMINATES
        AGAINST THE DEFECT IT WAS BUILT FOR, by 12.605090 bits against 0.75. A
        record that carries only (1) understates the repair; a record that
        carries only (2) overstates it.
      the_failing_confirmatory_arm_has_no_resolving_power: >-
        A-1 - NC2b-G1-prime failing at 1 of 15 points (W-TOP, log2 p = 768,
        0.920520 bits) - is NOT evidence that the corrected estimator is biased
        at the top field size, and a pass there would NOT have been evidence that
        it is unbiased, because on that 8-point window the fixed 0.75-bit
        tolerance is roughly half the 95 per cent half-width of the quantity it
        constrains. The contract designated NC2b-G1 the gate of record and
        NC2b-G1-prime confirmatory, and declared in advance that a disagreement
        is a finding and is reported. It was reported, with the failing point
        named and nothing adjusted. No contract deviation.
      attribution: >-
        A DEFECT IN THE FROZEN CONTRACT'S TOLERANCE DERIVATION - written by this
        Coordinator - AND NOT AN EXECUTOR DEVIATION. The Executor applied the
        frozen number and reported the disagreement, which is the correct
        handling.
      binding_consequence: >-
        NO RECORD MAY RESTATE THE NC2b-G1 PASS AS "the corrected law passed its
        self-validation". It validates LEVEL RETENTION on a series that is flat
        by construction, and it has NO power against L1 (a flat series
        extrapolates trivially), L2 (it is evaluated at ell = B_opt on an object
        whose cost does not depend on ell), L5 (it is evaluated at alpha = 0 by
        design) or the pairing rule (for a flat series any intercept passes).
      repair: "NC2b-SLOPE, zero compute: multiply the committed null pointwise by ell^s for declared s in {0.4, 0.8} and require the estimator to recover s*log2(B_opt) + REF_null to within the same tolerance. That is a synthetic object with a KNOWN non-zero exponent and it tests the part of the estimator a flat null cannot reach."

    - id: C
      title: "A-3 IS THE KARATSUBA RECURSION STAIRCASE. This is the batch's real structural contribution, and the contract's own pairing rule is what absorbs it."
      finding: >-
        UPHELD, and reached INDEPENDENTLY BY BOTH REVIEWERS FROM DIFFERENT
        DIRECTIONS, which is why it is adjudicated as established rather than as
        one reviewer's reading. The Red Team (RT3-C2) found the residual sawtooth
        phase-locked to KARATSUBA_THRESHOLD = 16: residuals DROP at ell = 17, 37,
        67 and 131 - exactly the recursion band boundaries - and rise
        monotonically within each band, with a period of exactly one octave, on
        IMPL-B and not on IMPL-A. The Validator reached the same mechanism from
        the instrument: per_entry_cost.py substitutes ONLY poly_mul, while
        poly_rem_monic - the modular reduction every poly_powmod iteration
        performs after every multiplication - is SCHOOLBOOK Theta(ell^2) and
        SHARED by both implementations, so as Karatsuba drives IMPL-B's
        multiplication term below the shared reduction, IMPL-B becomes
        REDUCTION-DOMINATED and its measured exponent must rise toward IMPL-A's.
      the_discriminating_control_is_free_and_it_is_a_null_on_the_explanation: >-
        Adding an integer `depth` regressor, defined identically for both series,
        gives IMPL-B gamma_within 0.8919 with delta = -0.0749 bits per recursion
        level (R^2 0.999158 -> 0.999758; max |residual| 0.0537 -> 0.0293) and
        IMPL-A gamma_within 0.9329 with delta = +0.0066. The regressor does 72
        per cent of the residual variance on the recursive routine and NOTHING on
        the non-recursive one. That is docs/inventor-protocol.md section 3
        applied to an EXPLANATION rather than to a signal, it costs nothing, and
        it was already lying in the run. The decomposition closes:
        0.8919 - 0.0749 = 0.8170 against the measured W-MID slope 0.8100.
        Confirming signatures in the same data: the A/B cost ratio saturates
        (1.000 at ell 13, 1.295 at 101, 1.396 at 151, 1.4055 at 199, 1.4049 at
        211); the exponent gap collapses on W-TOP to 0.012692 against 0.122831 on
        W-MID; and on the identical ell >= 101 window S-B's quadratic is 0.167076
        with a CI clear of zero while S-A's is 0.016042 with CI
        [-0.000697, +0.039126] INCLUDING zero. A curvature significant for the
        recursive routine and absent for the non-recursive one, on the same 22
        points, is a property of the routine.
      magnitude_correctly_paired: >-
        A-3 IS WORTH 1.007 BITS OF NIST-I MARGIN, NOT AN EXPONENT REVISION. Under
        the contract's binding pairing_rule, W-TOP's higher slope comes with a
        LOWER intercept (8.6296 against 9.7308) and the two nearly cancel:
        S-B W-MID alpha = 1 gives margin 10.3578, S-B W-TOP alpha = 1 gives
        9.3508 (2.774 bits at log2 p = 768). Both are inside the modelling-choice
        bracket already published. THE PAIRING RULE IS LOAD-BEARING AND SURVIVES
        DELETION TESTING: pairing gamma_B(W-TOP) = 0.9585 with the W-MID
        intercept - which the rule forbids - gives overhead 26.29 bits and margin
        7.98, i.e. 2.4 bits worse than any correctly-paired reading and OUTSIDE
        the bracket. That rule was stated before the data and closes the whole
        defect family of which adjudication A's defect was one instance.
      the_counter_consideration_recorded_at_the_red_teams_own_insistence: >-
        THE SAME BAND STRUCTURE CUTS AGAINST THE ATTACK AND THE RED TEAM RECORDED
        IT AGAINST ITS OWN SIDE. Because IMPL-B leaves the shared reduction
        schoolbook, the Karatsuba-improved half shrinks as (3/4)^d while the
        reduction half stays Theta(n^2), so gamma_B = 0.810 IS A TRANSIENT whose
        per-octave gain must saturate. The onset is already in the committed
        data: per-band increments of log2(A/B) are +0.1118, +0.1178, +0.1163,
        +0.0921 - a 21 per cent fall at the last step, with a within-band
        positioning bias below 0.003 bits. ON FOUR INCREMENTS THIS IS SUGGESTIVE,
        NOT ESTABLISHED. CONSEQUENCE, WHICH IS BINDING: THE BRACKET'S LOW END IS
        THE OPTIMISTIC ONE. It assumes an undiminished 0.075-bit-per-octave gain
        across 6.48 unmeasured octaves; if the gain saturates and
        gamma_B -> gamma_A = 0.9329, the low end rises to c = 1.436129 and the
        margin falls from 13.036 to 11.291 bits, i.e. -1.75 bits. The high end is
        the defensible reading for THIS implementation family. The Validator
        reaches the same conclusion by a different route.
      what_it_does_not_establish: >-
        The band model is a REGRESSOR FITTED TO COMMITTED DATA, not a proof.
        NC2a-BAND - extending the grid past the 255/257 and 511/521 boundaries,
        and separately moving KARATSUBA_THRESHOLD to 8 so the boundaries must
        MOVE with it - is what would prove the mechanism rather than fit it. And
        A-3 says nothing about the exponent at ell ~ 2^14.2: the mechanism
        predicts a ceiling near the schoolbook exponent, but that is an argument
        about committed code, not a measurement.

    - id: D
      title: "RT3-C1: an objection that cuts against the Red Team's own prior direction. Given full weight."
      finding: >-
        UPHELD AS A QUANTIFIED CORRECTION IN THE ATTACK'S FAVOUR, and recorded as
        such precisely because it is inconvenient for the objection that forced
        this batch. Charging the full per-entry cost at ell = B_opt OVERSTATES
        the table-build overhead: Algorithm 1's outer loop is `for ell <= B`, an
        entry of degree d receives its final extension at ell = P(d) (its largest
        prime factor), and Lemma 3.3 charges each batch of (<=) ell+1 new entries
        at the cost of the ell-neighbours - so the correct multiplier is the
        ENTRY-WEIGHTED MEAN of ell^gamma, not B_opt^gamma. QUANTIFIED BY EXACT
        ENUMERATION at matched w: Delta = 0.598 bits at (X, B) = (10^7, 100) and
        0.625 at (10^8, 215) for gamma 0.810 (0.676 / 0.704 for gamma 0.933),
        with a psi(d) weighting changing it by less than 0.001; and by a DICKMAN
        ASYMPTOTIC with a marching rho validated at rho(2) = 0.3068528,
        rho(4) = 0.00491093, rho(8) = 3.2321e-8: 0.868 at NIST-I and 0.899 at
        768 for gamma 0.810. THE HONEST RANGE IS 0.60 TO 1.00 BITS AT EVERY FIELD
        SIZE: c at NIST-I is overstated by 0.038 to 0.063 and every modelled
        margin is understated by 0.6 to 1.0 bits.
      why_it_is_upheld_rather_than_deferred: >-
        Assumption L2 DECLARED this and got its sign right; nobody priced it in
        three batches. An eliminated modelling dimension is not free until its
        own cost is charged. The correction also passes its own artifact check:
        Delta should be nearly flat across the five field sizes because w moves
        only from 3.49 to 5.40, and it is (0.87-0.90); strong variation would
        have been the tell.
      how_it_is_carried: >-
        NOT APPLIED to any archived row. It is a Red-Team-side derivation over
        committed constants, it shifts the whole table uniformly and changes no
        ordering, and applying it would blur the line between run evidence and
        review analysis (SP-5 as extended). Instead it is a MANDATORY ATTACHMENT:
        every citation of a c or a margin from this batch states that the figure
        is 0.60 to 1.00 bits pessimistic for this reason.
      repair: "L2-WEIGHT, zero new compute: evaluate the entry-weighted mean using the cross-validated Dickman implementation already committed in RUN-WESOVOW-001, reproducing the exact-enumeration values 0.598 and 0.625 as the discriminating check that the machinery is right."

    - id: E
      title: "A PRE-REGISTERED FALSIFIER FIRED (FC-4). It is localised, it is diagnosed, and it is NOT lifted."
      finding: >-
        FC-4 FIRED AND THE MECHANISM-INCONSISTENT DESIGNATION STANDS.
        |alpha_primary - alpha_null| = |1.1596976732 - 0.9935080487| =
        0.1661896244 > 0.15. The contract's derivation argued the p-scaling is a
        property of the SHARED poly_powmod loop and must therefore be common to
        both objects; the run's own null arm contradicts that argument.
        Assumption L5 is now DERIVED-AND-CONTRADICTED-IN-MECHANISM.
      the_diagnosis_which_is_real_and_is_not_a_lifting: >-
        The firing is driven by ell = 3 and ell = 5 and nothing else. Same
        estimator, same committed medians, only the ell set restricted:
        {3,5,7,11,13} gives gap 0.1662 (FIRES, band OUT); {7,11,13} gives 0.0178
        (no fire, band IN); {11,13} gives 0.0015 (no fire, band IN). Three
        reasons the small-ell end is the wrong place to measure alpha, all read
        off committed artifacts: all five ell lie BELOW KARATSUBA_THRESHOLD = 16,
        so the IMPL-A and IMPL-B cost multisets are BIT-IDENTICAL there and the
        "primary arm" is a schoolbook-only measurement saying nothing about the
        series supplying the bracket's low end; anomaly A-4 puts the two largest
        W-MID residuals at ell = 11 and 13, so alpha is estimated where the fit is
        at its worst; and only ell = 11 and 13 lie inside W-MID at all.
      the_governance_ruling_adopted_as_this_decisions_own: >-
        A POST-HOC RESTRICTION OF THE ell-GRID CANNOT LIFT A PRE-REGISTERED
        FALSIFIER. The Red Team stated this against its own analysis and this
        decision ADOPTS THAT REASONING EXPLICITLY: FC-4 fired as written, the
        designation stands, and the Executor was right not to touch it. What the
        analysis buys is a DIAGNOSIS and a SUCCESSOR DESIGN, not a lifting. That
        distinction is the whole difference between a diagnosis and an excuse,
        and it is the reason the label may be retired only by NC2d-PROPER
        measuring alpha at ell in {47, 101, 151, 211} - i.e. by measurement
        rather than by argument.
      fc_2_correctly_did_not_fire: >-
        The jackknife interval [1.1342844597, 1.1778020727] OVERLAPS the
        pre-registered [0.85, 1.15] band WITHOUT containment, because
        1.1342844597 < 1.15 and FC-2 requires DISJOINT. "Overlapping" is the
        correct classification; the alternative per-ell reading
        [1.0872800752, 1.2613505271] gives the same answer and the Validator
        verified both. A NEAR-MISS THAT IS ON THE RECORD: the point estimate
        would have had to be 1.1754 rather than 1.1597 - a 1.35 per cent move -
        for FC-2 to fire. alpha = 1 is alive by a hair, not comfortably.
      proportion: >-
        The whole alpha question is worth log2(256/40) * 0.1597 = 0.4277 bits at
        NIST-I and 0.6809 at log2 p = 768. The falsifier fired on the SMALLEST
        term in the corrected law, and it rests on three primes at 40-, 60- and
        80-bit fields, i.e. a `toy`-ceilinged three-point basis.
      binding_consequence: >-
        NO RECORD MAY DESCRIBE alpha = 1 AS "MEASURED-CONSISTENT". The correct
        words are DERIVED, MECHANISM-INCONSISTENT, with a toy-scale three-point
        basis, and every alpha = 1 row of the c table - INCLUDING THE BRACKET'S
        HIGH END - inherits that label.

    - id: F
      title: "CORRECTIONS TO THE RECORD, INCLUDING THIS PROGRAMME'S OWN."
      finding: >-
        Seven corrections are recorded in EV-PEC-857664.corrections_to_this_-
        programmes_own_record and are officially adopted here. Each is stated
        plainly rather than absorbed. In summary:
        CORR-1: NC2b-G1 has TEN evaluation points (2 null windows x 5 field
        sizes), not fifteen. Both reviewers caught it independently. The wrong
        count appears in the run manifest, the execution report AND in the
        orchestrating session's snapshot commit message for 84356221 - which is
        immutable, so the correction must live here. The value 0.271670, its
        locus (W-MID, log2 p = 768), the verdict and the margin are all correct.
        CORR-2: gamma(S-MIN, W-MID) = 0.8100336226739335 is what the archive
        contains; the variant digit string 0.8100343886 was relayed in session
        prose and appears nowhere in the package. Immaterial at reported
        precision; recorded so the archive remains the authority over prose.
        CORR-3: "the run measured A directly" is WITHDRAWN. A is the fit's
        extrapolation to ell = 1, 3.46 octaves below the nearest W-MID
        observation. THIS CORRECTS THIS PROGRAMME'S OWN RECORD: DEC-20260802-
        8227b9 adjudication A and EV-PEC-2e67ff OBS-E both carry the phrasing.
        The substance survives intact because the law never uses A alone - it
        uses log2 A + gamma*log2(B_opt), the fitted level AT ell = B_opt, priced
        by a JOINT bootstrap of that combination. The correct phrasing is "the
        fitted per-entry cost curve, evaluated at ell = B_opt, is 21.2 to 25.2
        bits above Section 4.1's convention", and the ell-independent floor is
        better evidenced by REF_null = 12.2595 bits, which IS a measurement.
        CORR-4: the Red Team WITHDRAWS its BATCH-002 sentence "flat at 0.93-0.97
        with no acceleration whatever". Per-band IMPL-A slopes rise 0.8871 ->
        0.9420 -> 0.9452 -> 0.9647. The correct statement is a BOUNDED APPROACH
        TO THE SCHOOLBOOK CEILING, and that ceiling - gamma = exponent(M) - 1 <= 1
        for this pipeline - kills the c = 2 scenario by METHOD CEILING rather
        than by a flat measurement, confirming adjudication D of
        DEC-20260802-8227b9 on a stronger basis than it was made on.
        CORR-5: the Red Team ACCEPTS the BATCH-002 adjudication C IN FULL. The
        Validator's 0.0225 (CI [0.0194, 0.0366]) reproduces at 0.022425 (CI
        [0.019176, 0.036395]) on the seam-free series, and the small-ell ruling is
        confirmed by the homogeneous nested windows 0.022425 -> 0.011169 ->
        0.006708 -> 0.007982 -> 0.016042, the last with a CI INCLUDING ZERO. The
        Red Team attaches the honest qualification and this decision carries it:
        484 of 752 primary samples are bit-identical to the superseded run, so
        the agreement is 36 per cent new data plus a re-derivation.
        CORR-6: the dispatch prose describing C-PSCALE's jackknife interval as
        "entirely above 1.15" is WRONG; 1.134284 < 1.15 and the run's OVERLAPPING
        classification is correct.
        CORR-7: the Red Team's own summary line says "13.5-to-16.6 bits" while
        its RT3-S2 arithmetic gives 13.9429 and 16.6210. This decision uses the
        precise figures.
      does_CORR_4_undermine_the_batch_002_adjudication_C: >-
        NO, AND THE REASONING IS STATED RATHER THAN ASSUMED. Adjudication C(3)
        cited the now-corrected "flat" profile, so one of its inputs is wrong.
        The ruling survives for two reasons independent of that input. FIRST, the
        discriminating control adjudication C ITSELF NAMED - a homogeneous
        nested-window curvature with bootstrap CIs on a seam-free series - now
        exists and rules the same way. SECOND, the Coordinator's own consistency
        arithmetic in adjudication C(2) PREDICTED a slope rise of 0.207 bits
        against the observed 0.203, so that arithmetic was already inconsistent
        with "no acceleration whatever"; the correction brings the prose into line
        with a number the record already contained. That arithmetic was labelled
        arithmetic and not a test then, and it is not promoted to one now.
      record_integrity_defects_adopted: >-
        V-2 (raw-result.json describes the superseded response as "the MINIMUM
        over implementations at ell", which is exactly what F-1 falsified - on
        ell 103..211 the superseded response was IMPL-A ALONE - plus a dangling
        "see the seam statement" pointer to a statement absent from the file);
        V-3 (SP-2 BREACHED by the run package: gamma = 0.9739199260 quoted in
        execution_report.yaml without the seam statement or any of the four
        required companions); V-4 (the binding non-independence label absent from
        execution_report.yaml, the file most likely to be quoted into a decision
        record - so this decision carries it explicitly in adjudication G);
        V-6 ("cheaper at EVERY ell" is imprecise: at 6 of 47 ell the two are
        BYTE-IDENTICAL below the Karatsuba threshold, and the correct statement
        is "nowhere more expensive"; no number moves, since min(a,a) = a);
        RT3-C10a (raw-result.json carries `anomalies: []` while the execution
        report carries seven, inverting the intended hierarchy - the full
        seven-anomaly, three-deviation inventory is published in EV-PEC-857664).
        None changes a gating number. All are correctable ONLY by superseding
        note; no archived file is edited (AGENTS.md rule 4).

    - id: G
      title: "F-4's independence limb is NOT restored, by design, and the binding label is carried here."
      finding: >-
        The contract RETAINED the paired Cantor-Zassenhaus stream and bought back
        the CORRECTNESS half through C-SEED, stating the trade in both directions
        and making the loss binding. The correctness purchase is real and
        checkable: the Validator confirmed the alternative stream genuinely
        differs (cz_attempts differ at 23 of 24 pairs) while root-set identity
        holds at all 24, so a shared-pipeline defect that survives a change of
        SPLIT STRUCTURE is now excluded on those samples - something C-ALT.2
        alone could never show. But C-SEED covers 6 of 47 ell, 4 of 8 j and one
        implementation, and computes no gamma_B', so it does not bound the effect
        on the FITTED EXPONENT, which is the quantity F-4 was about.
      binding_label_carried_here_because_the_run_package_omits_it: >-
        gamma_A AND gamma_B REMAIN NON-INDEPENDENT ESTIMATES. No record may
        present their agreement, or their difference, as agreement between two
        independent implementations. Their difference 0.1228308054 is a
        measurement of the MULTIPLICATION-ROUTINE effect under a FIXED SPLIT
        STRUCTURE and nothing more.
      note: >-
        The Validator's own supplementary probe over the 6 C-SEED ell bounds the
        split-structure contribution to the fitted exponent at 0.007962 against a
        0.122831 implementation gap - about 6.5 per cent - which SUPPORTS the
        contract's choice. That is VALIDATOR-SIDE analysis, is not run evidence,
        and is cited only as a review finding under SP-5 as extended.

    - id: H
      title: "A GOVERNANCE DEFECT OF THIS COORDINATOR'S OWN DISPATCH (deviation D-1)."
      finding: >-
        UPHELD AGAINST THE COORDINATOR. C-PSCALE's measurement arms were executed
        immediately after acquisition rather than at the frozen execution_order
        step 11, on the authority of the DISPATCHING COORDINATOR'S HANDOFF
        MESSAGE. A dispatch message cannot amend a frozen protocol. The frozen
        contract says editing it after the snapshot is a violation and that an
        underspecification is reported rather than resolved by the Executor; the
        correct instrument for a needed order change was a versioned
        protocol_amendment or a superseding contract.
      the_executor_handled_it_correctly: >-
        It recorded the deviation openly with its authority NAMED rather than
        silently complying. That is the required behaviour and it is credited.
      materially_harmless_and_independently_verified_as_such: >-
        Each p-arm runs in a FORKED CHILD, so the instrument's process-global
        prime cannot leak into the parent, and C-REPRO - independently
        reconstructed by the Validator - shows the parent's 884 overlapping
        samples are bit-for-bit identical to the superseded run. That is an
        empirical refutation of the contamination route, not a promise. The
        >= 900 s budget gate was moot: the run finished in 791.751 s of 5400.
      remedy_binding_on_batch_004: >-
        No BATCH-004 handoff may direct an execution order, tolerance, window,
        estimator or prediction that differs from the frozen contract it
        dispatches. If an order must change, the instrument is a versioned
        protocol_amendment recorded before execution, or a superseding contract.

  citability_ruling:
    the_specific_question: "May a downstream record cite the corrected overhead parameter c, and in what form?"
    verdict: >-
      YES, IN A BOUNDED FORM: as the BRACKET, with mandatory attachments, NEVER
      as a single number. The Coordinator concurs with the Red Team's position
      and extends its attachment list by two items of the Coordinator's own.
    what_may_be_cited: >-
      "Under the corrected extrapolation law of EXP-PEC-49c773, evaluated on the
      seam-free W-MID fits of RUN-PEC-49c773-a, the modelled per-entry overhead
      exponent at SQIsign NIST-I is c in [1.327077, 1.576444] across two declared
      modelling choices (implementation: S-B or S-A; p-scaling: alpha = 0 or 1),
      corresponding to a modelled advantage over Delfs-Galbraith of 9.05 to 13.04
      bits at w = 2^30. MODEL SUBSTITUTION; NO CLAIM TIER."
      Per field size: NIST-I [1.327077, 1.576444]; NIST-III [1.232366, 1.488390];
      NIST-V [1.178237, 1.435130]; log2 p = 576 [1.158104, 1.414551];
      log2 p = 768 [1.114020, 1.367929]. The bracket is NOT a confidence
      interval; it is a span across two declared modelling choices and must be
      labelled as such wherever it appears.
    mandatory_attachments:
      - id: MA-1
        source: red-team
        text: "L1-L6 verbatim, with L1's 6.48 unmeasured octaves at NIST-I (about 18 at 768) and L4's 11.50-13.25 bits stated NUMERICALLY rather than named."
      - id: MA-2
        source: red-team
        text: >-
          The FC-4 / MECHANISM-INCONSISTENT label, together with its localisation
          (the gap collapses to 0.0015 on the ell inside the fit window) so the
          label is neither ignored nor over-read, AND the statement that a
          post-hoc restriction does not lift it.
      - id: MA-3
        source: red-team
        text: >-
          The archived per-row c_low/c_high are a j-resampling interval on a
          DETERMINISTIC COUNTER and are NOT the uncertainty on c. At NIST-I,
          S-B W-MID alpha = 1, they are 0.005 wide in c against a modelling-choice
          bracket of 0.249, an L2 bias of 0.60-1.00 bits, an L4 term of
          11.50-13.25 bits and an inherited L3 band of up to 3.51 bits.
      - id: MA-4
        source: red-team
        text: "RT3-C1's entry-weighting bias: the bracket is 0.60 to 1.00 bits PESSIMISTIC because the law charges every entry at ell = B_opt while Algorithm 1 creates most of them at smaller ell."
      - id: MA-5
        source: red-team
        text: "RT3-C2's counter-consideration: the LOW end assumes an undiminished Karatsuba gain over 6.48 octaves and is the OPTIMISTIC reading; the HIGH end is the defensible one for this implementation family."
      - id: MA-6
        source: red-team
        text: "AGENTS.md rule 7: measured at p = 1099511627563 over 2 <= ell <= 211, in pure Python, for one implementation pair sharing every line but poly_mul. Not a cryptographic-scale measurement."
      - id: MA-7
        source: coordinator (from Validator V-1 and Red Team RT3-C6)
        text: >-
          The NC2b-G1 PASS validates LEVEL RETENTION only. Its tolerance
          derivation contains NO VARIANCE TERM, so the 0.478330-bit residual
          margin is about 1.4 noise half-widths and not a cushion; the gate has
          no power against L1, L2, L5 or the pairing rule; and the run's own
          confirmatory arm A-1 fails at (W-TOP, 768) on a window where the
          tolerance is roughly half the noise half-width, so that failure
          discriminates nothing either.
      - id: MA-8
        source: coordinator (from Validator V-4 and Red Team RT3-C7)
        text: >-
          gamma_A and gamma_B are NOT independent estimates; their difference
          measures the multiplication routine under a fixed split structure. And
          the level is a FITTED value at an unobserved abscissa: the correct
          phrasing is "the fitted per-entry cost curve, evaluated at ell = B_opt,
          is 21.2 to 25.2 bits above Section 4.1's convention", never "the
          measured prefactor is 2^9.73".
    what_may_not_be_cited:
      - "Any single c value as 'the' overhead. The bracket, always."
      - >-
        Any c derived from a W-TOP fit AS AN ESTIMATE or as a bracket endpoint
        (RT3-C2, RT3-C5). COORDINATOR CARVE-OUT, RECONCILING RT3-C2 WITH
        VALIDATOR V-8: a W-TOP-derived c MUST be cited when reporting the
        WINDOW-CHOICE SENSITIVITY, labelled as a sub-band window of the Karatsuba
        recursion staircase whose 8-point null carries 0.3292 bits of spurious
        extrapolated level at NIST-I. The exclusion is from the ESTIMATE; the
        inclusion is in the SENSITIVITY. The two reviewers were answering
        different questions and are not averaged: the full S-A/S-B x window x
        alpha range is [1.3197, 1.5932] at NIST-I and [1.1031, 1.3941] at
        log2 p = 768, and it is a sensitivity, never an estimate.
      - "The per-row bootstrap endpoints as an uncertainty (MA-3)."
      - "The NC2b-G1 PASS as validation of the corrected law (MA-7)."
      - >-
        "All five pre-registered predictions MET" as evidence of NO TOP-OF-RANGE
        STEEPENING or of a stable multiplication-routine effect. P1b's threshold
        0.9382 is EXCEEDED on W-TOP by BOTH series (gamma_B 0.958496, gamma_A
        0.971187) and P3's gap collapses to 0.012691 there. The contract's own
        if_it_fails text for P3 says failure means RT2-C4's term must be
        re-scoped and NC2c's priority RISES; that consequence is triggered in the
        top window and is recorded here because it is recorded nowhere in the
        package.
      - "C-NULL's 2^12.26-2^12.32 per-step cost as a Delfs-Galbraith baseline measurement (RT3-C9). NC2f, not this batch, measures it."
      - "Any figure in this batch as a cryptographic-scale measurement, or the extrapolated c as carrying a claim tier."

  standing_prohibitions:
    ruling_summary: >-
      NO STANDING PROHIBITION OF DEC-20260802-8227b9 IS LIFTED. Four are MADE
      PERMANENT, two STAND, one has its companion set EXTENDED, and one is
      EXTENDED IN SCOPE. What is superseded is not a prohibition but its
      CONSEQUENCE: the blanket condition that no corrected overhead value was
      citable at all is replaced by the narrower positive permission in
      citability_ruling. Six new prohibitions are added from this batch's
      findings.
    dispositions:
      - id: SP-1
        was: "No record may cite c = 0.864 (nor 0.771 / 0.868 / 1.0389 / the c_kappa values) as an overhead estimate, UNTIL NC2b IS ON THE RECORD."
        disposition: MADE PERMANENT
        reasoning: >-
          The time bound expires by its own terms - NC2b is now on the record -
          but the prohibition CONTINUES ON NEW AND STRONGER GROUNDS. NC2b did not
          rehabilitate those values; it REPLACED THE LAW that produced them, and
          the null gate shows that law missing its own null object by up to
          12.605090 bits and failing at every evaluation point, verified
          independently by both reviewers. The defect is in the ESTIMATOR, not in
          the data, so no future measurement can rehabilitate them. THEY ARE
          PERMANENTLY NON-CITABLE AS ESTIMATES and may appear only in a column
          explicitly labelled "superseded input being corrected", with
          adjudication A of DEC-20260802-8227b9 attached - which is exactly how
          RUN-PEC-49c773-a handled them, as the Validator verified.
      - id: SP-2
        was: "No record may quote gamma = 0.9739, c_quad = 0.0488, or gamma_local_top = 1.1706 without the seam statement and the homogeneous readings."
        disposition: MADE PERMANENT, COMPANION SET EXTENDED (never narrowed)
        reasoning: >-
          The heterogeneity of the superseded response is a permanent fact about
          that run. The required companions now ADDITIONALLY include the
          seam-free readings: gamma_A = 0.9328644281 (log2 A 9.2983509117),
          gamma_B = gamma_S-MIN = 0.8100336227 (log2 A 9.7307533347), the
          seam-free W-ALL quadratic 0.0105853942 for S-MIN with CI
          [0.0073207362, 0.0242839411] and 0.022425 with CI
          [0.019176, 0.036395] for homogeneous S-A, and the statement that the
          superseded response was IMPL-A ALONE over 103..211 (correcting V-2).
        breach_recorded: "SP-2 was BREACHED by the run package itself (V-3). The companions are supplied here; the archived file is not edited."
      - id: SP-3
        was: "Modelled margins are quoted at w = 2^30 only; larger-w rows are not read as improvements."
        disposition: STANDS UNCHANGED
        reasoning: "Nothing in this batch bears on the memory-latency argument that narrowed RT-C2. Every margin figure in this decision is at w = 2^30."
      - id: SP-4
        was: "Nothing may move concrete_threat_nist1 off INCONCLUSIVE without evidence clearing the irreproducibility band."
        disposition: STANDS; the condition is NOT met
        reasoning: >-
          The defensible span is 13.9429 bits (alpha = 1 throughout) to 16.6210
          (alpha in {0, 1, alpha_hat}) against bands of 2.2309 and 3.5133, i.e.
          four to seven times the band. Both independent reviewers decline to
          move it; the Coordinator concurs.
      - id: SP-5
        was: "No record may cite the BATCH-002 Validator's supplementary measurements as run evidence."
        disposition: MADE PERMANENT AND EXTENDED TO THIS BATCH'S REVIEW-SIDE WORK
        reasoning: >-
          The same rule now binds the BATCH-003 reviewers' own supplementary
          analyses, which both reviewers applied to themselves: the Validator's
          analytic prediction intervals, its gamma_B' probe, its rolling-window
          exponents and its count() reimplementation; and the Red Team's RT3
          recomputations - the depth regressor, the per-band local slopes, the
          exact enumeration and the Dickman asymptotic. These are analyses OF
          COMMITTED DATA produced in a review session. They may be cited as
          REVIEW FINDINGS with their report IDs (VAL-20260802-5a24d2,
          RT-20260802-8e00fe) and NEVER as run evidence, and they neither open
          nor close any gate.
      - id: SP-6
        was: "RUN-PEC-6be870-a did not meet its completion gate; the ell = 97 obstruction is never mathematical evidence."
        disposition: MADE PERMANENT, with one fact added
        reasoning: >-
          RUN-PEC-6be870-a's gate remains UNMET as a matter of record and no
          record may describe it otherwise. SEPARATELY AND WITHOUT DISTURBING
          THAT: RUN-PEC-49c773-a's OWN completion gate is MET - 47 of 47 ell
          acquired and admitted, core grid complete at 26 primes including ell =
          97 re-acquired at exactly the hash the Validator obtained itself, both
