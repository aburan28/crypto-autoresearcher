      - id: SP-10
        text: "alpha = 1 is labelled DERIVED and MECHANISM-INCONSISTENT, on a toy-scale three-point basis, and never 'measured-consistent'. Every alpha = 1 row inherits the label, including the bracket's high end."
      - id: SP-11
        text: "No c derived from a W-TOP fit may be cited as an estimate or as a bracket endpoint; it MUST be cited in the window-choice sensitivity with the band-artifact label. See the carve-out in citability_ruling."
