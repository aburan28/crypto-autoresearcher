        omission, not a research judgement. Recording it as a binding requirement
        rather than a hope is the repair.

  next_actions:
    - id: NA-1
      priority: highest
      is_the_goals_single_next_action: true
      action: >-
        OPEN BATCH-004, THE FINAL BUDGETED BATCH, scoped explicitly NOT as an
        attempt to meet completion criterion 1 - which this decision has assessed
        as unreachable by this method within the remaining budget - but as the
        cheapest set of items that retires the qualifications currently attached
        to every citation and tests the one load-bearing term that has never been
        tested. Ordered:
        (1) NC2d-PROPER (minutes; Phi_ell already acquired for all four degrees,
        two of the three primes already measured, the p3 arm free): re-run
        C-PSCALE at the SAME three primes at ell in {47, 101, 151, 211}, the range
        where the p-scaling is actually applied, at 4 j. PRE-REGISTER:
        alpha_primary in [0.85, 1.15]; |alpha_primary - alpha_null| <= 0.15; no
        residual trend of alpha_hat in ell. If FC-4 fires again on ell >= 47 the
        derivation really is contradicted and L5 must be replaced by the measured
        exponent; if it does not, the MECHANISM-INCONSISTENT label is retired BY
        MEASUREMENT, which is the only legitimate way to retire it.
        (2) NC2b-SLOPE (zero compute; arithmetic on 47 committed numbers): a
        synthetic slope null - the committed null series multiplied pointwise by
        ell^s for declared s in {0.4, 0.8} - with the estimator required to
        recover s*log2(B_opt) + REF_null to within the same 0.75 bits at every
        field size. This is the only proposed gate with power against L1.
        (3) THE FREE BIBLIOGRAPHIC SUBTASK, which must ship and is no longer
        optional: retrieve Sutherland (ANTS X, 2013) and the frozen
        bibliography's [15] (Santos-Costello-Shi) and [3] (Adj et al.). It has
        been named as necessary in THREE CONSECUTIVE red-team reports and
        executed in none; it costs no compute; and it is the only route to
        quantifying the baseline constant k, which sits under every margin row.
        (4) NC-3 / NC-6, Heuristic 1's tail validation at the operating point,
        carried from BATCH-001 and unrun since. This is the substantive item of
        the batch. It MUST carry an explicit feasibility gate: if the sampler
        required to reach the relevant distribution cannot itself be validated
        within budget, that is reported as an infrastructure/feasibility outcome
        and NEVER as evidence about Heuristic 1 (AGENTS.md rule 5).
        (5) The BATCH-004 ledger archive task MUST carry knowledge/findings/ and
        knowledge/INDEX.md in its write_scope and ship the scheduled KN-FIND.
      why_this_and_not_NC2c_weighed_rather_than_rubber_stamped: >-
        The Red Team recommends NC-3/NC-6 over NC2c and this decision AGREES, but
        for a reason of the Coordinator's own that is stronger than the one
        offered, and after stating the case for NC2c fairly.
        THE CASE FOR NC2c, WHICH IS REAL: it is the only control that addresses
        L4, the single largest residual term (11.50-13.25 bits, 48-59 per cent of
        the corrected overhead); it is the separator for the identifiability
        collision RT3-P1 shows is still open; and RT3-C8 adds a strictly cheaper
        sub-control (an IMPL-B'' with a non-schoolbook reduction) that would test
        the RT3-C2 saturation reading directly. If gamma_C landed near 0.3-0.5,
        the honest headline would become "the per-entry exponent is an
        IMPLEMENTATION PARAMETER in [0, 1], not a constant of Algorithm 1".
        WHY IT LOSES ANYWAY: that outcome RE-SCOPES the c-programme rather than
        answering the concrete question, and the Red Team is right that the
        programme already knows L4 cannot be closed without building the batched
        implementation, which is a research project and not a control. NC2c would
        buy a sharper statement of a term the programme has already characterised.
        THE COORDINATOR'S OWN AND DECISIVE REASON: agents/coordinator.md and
        docs/target-result-profile.md require that a conditional result be PAIRED,
        in the same or the following batch, with a heuristic-validation experiment
        that samples the relevant distribution at the target scale, compares
        against the predicted distribution, and checks tail consistency. This
        programme has now run THREE batches of work downstream of a
        Heuristic-1-conditional theorem WITHOUT that pairing. P0 sits inside every
        one of the eighteen margin rows and a constant-factor error in it moves
        them all identically. Continuing to refine c while the term that
        multiplies everything is untested is optimising the wrong term, the window
        to correct it closes with BATCH-004, and the pairing obligation is mine
        rather than a reviewer's preference.
      what_would_change_this_ordering: "If NC2d-PROPER fires FC-4 again on ell >= 47, L5 is contradicted at the ell where it is actually applied, alpha ceases to be the smallest term in the law, and the batch's remaining capacity should go to characterising it rather than to NC-3/NC-6. That rerank trigger is recorded before the measurement."
