    official: >-
      valid measurement; ADMISSIBLE; the contract's completion gate MET for
      RUN-PEC-49c773-a (which is a separate fact from RUN-PEC-6be870-a's gate,
      which remains UNMET); the repair holds; the estimator is CITABLE IN A
      BOUNDED FORM (see citability_ruling); the concrete NIST-I question is NOT
      decided.
    validity_pre_checks_performed_by_the_coordinator: >-
      Performed before any interpretation and recorded in full in
      EV-PEC-857664.coordinator_validity_pre_checks: expected run count (1
      authorized, 1 executed, 1 terminal, two rehearsals disclosed and cited
      nowhere), manifest schema (complete but for the carried F-8 model-identifier
      gap), seed integrity (C-REPRO reproducing 884 samples bit-for-bit,
