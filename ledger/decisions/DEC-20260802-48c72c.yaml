        technique: >-
          NULL-OBJECT CONTROL ON AN EXPLANATION RATHER THAN ON A SIGNAL. Given a
          proposed mechanism for a residual, build the regressor the mechanism
          implies and fit it to BOTH the object the mechanism should explain and a
          nearby object it should not. Here: a `depth` regressor at -0.0749
          bits/level on the recursive routine and +0.0066 on the non-recursive
          one, explaining 72 per cent of the residual variance on the first and
          nothing on the second, at zero compute and fully inside a committed
