    scheduled_promotion_for_the_batch_004_ledger_archive:
      primary_entry:
        kind: KN-FIND
        durable_claim: >-
          "An intercept is only meaningful paired with the slope of the same fit
          of the same series over the same window; a slope-only calibration law
          reports ZERO overhead for an object carrying a large constant one." The
          promotable object is the ESTIMATOR LEMMA AND THE PAIRING RULE, NOT ANY
          c VALUE - the number is an extrapolation with no claim tier and under
          eight mandatory attachments, and putting it in the corpus would put a
          caveated figure where it will be quoted without its caveats.
        two_instances: >-
          (i) the C-NULL counterexample, an object whose per-entry cost is O(1) in
          ell by construction and measured at 2^12.26-2^12.32, for which the
          slope-only law returns c ~ 0 and misses by up to 12.605090 bits; and
          (ii) this batch's A-3 absorption, where the rule converts a 2.4-bit
          unpaired excursion outside the published bracket into a 1.007-bit
