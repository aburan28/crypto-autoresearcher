coordinator_decision:
  id: DEC-20260802-48c72c
  context: >-
    GOAL-P13-001 BATCH-003 closes the repair chain that DEC-20260802-8227b9
    ordered. The chain is: a SUPERSEDING contract frozen before any datum
    (EXP-PEC-49c773, approved by TASK-20260802-6d4e69, committed at e9a850f2 -
    EXP-PEC-6be870 was not edited); one bounded Executor run
    (RUN-PEC-49c773-a, TASK-20260802-63145a) snapshot-archived exactly as
    produced at 84356221 (TASK-20260802-18f85d); independent validation in a
    fresh session (VAL-20260802-5a24d2, TASK-20260802-c50ea2); and an
    independent red team in a fresh session (RT-20260802-8e00fe,
    TASK-20260802-8e00fe) explicitly assigned to attack its own prior objection.
    The batch executed NC2b (the zero-compute intercept repair with a
    pre-registered self-validation gate), NC2a (IMPL-B over ell 103..211,
    removing the definitional seam), C-SEED, C-PSCALE, full-range C-NULL, and
    the re-acquisition of ell = 97. This decision adjudicates that record into
    official state through the ledger archive TASK-20260802-c1f7c8. Inference
    ran under INFAMEND-20260802-P13-002 with fallback and recorded degradations;
    no task in this batch may claim a review-breakthrough tier, which is
    non-degradable.
  decision: revise
  decision_note: >-
    `revise` is the operative value, as in DEC-20260802-8227b9. It revises the
    adjudicated content of H-WESO-001 and the analysis carrying the measurement to
    a NIST-I statement, WITHOUT changing any hypothesis status, without promoting
    anything to `supported`, and without a scoped rejection.
    WHY NOT `support`: the four promotion gates for an asymptotic-complexity
    claim are not satisfied by committed artifacts, and the breakthrough review
    tier is non-degradable and unavailable here (see promotion_gate_check).
    WHY NOT `reject_scoped`: nothing in this batch is a rejection, and in any
    case the run is single and unreplicated (EV-PEC-857664 strength
    `preliminary`), so the governing remedy for any adverse call is weaken plus
    replication (docs/claims-and-verification.md, "Refutation artifacts").
    Three adverse sub-calls are recorded and are `weaken`-shaped: the reading
    "A-3 is a genuine rise of the per-entry exponent" is DISPLACED by an
    identified implementation artifact (adjudication C); assumption L5's
    derivation is CONTRADICTED IN MECHANISM by a pre-registered falsifier that
    fired (adjudication E); and the NC2b-G1 tolerance derivation is found to OMIT
    A VARIANCE TERM, which is a defect of the contract this Coordinator froze
    (adjudication B).
  target_ids:
    - H-WESO-001
    - EV-PEC-857664
    - EXP-PEC-49c773
    - GOAL-P13-001
    - DEC-20260802-8227b9
    - EV-PEC-2e67ff

  outcome_classification_adjudication:
    executor_reported: "completed; protocol_complete true; the contract's completion gate MET"
    validator_verdict: "VALID-WITH-OBSERVATIONS (passed); 12 of 12 gating controls pass on independent recomputation; six recorded observations, none changing a gating number"
    red_team_verdict: >-
      "THE REPAIR IS SOUND AND IT DID NOT MOVE THE ERROR. I tried to break it on
      six fronts and broke it on none." Every objection is in the INTERPRETATION
      layer; the data layer and the arithmetic layer are sound on the Red Team's
