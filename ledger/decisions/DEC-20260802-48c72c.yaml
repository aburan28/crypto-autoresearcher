  limitations:
    - >-
      Everything measured here is scoped to p = 1099511627563 (one 80-bit
      F_{p^2}), to 47 prime degrees in 2 <= ell <= 211, to one pure-Python
      implementation pair sharing all but its polynomial multiplication routine,
      and to one 791.751-second run. AGENTS.md rule 7 applies in full.
    - >-
      Every NIST-level number in this decision is a MODEL SUBSTITUTION into
      RUN-WESOVOW-001's already-published scenario grid, conditional on L1-L6.
      None of it is a measured cryptographic-scale margin and none of it carries a
      claim tier. The ~7.5 unmeasured octaves at NIST-I (6.48 from the top of
      W-MID, about 18 at log2 p = 768) remain an assumption whatever the
      estimator does; this experiment does not reduce that gap by a single
      octave.
    - >-
      C-PSCALE's alpha, its FC-4 firing and its band verdict rest on three primes
      at 40-, 60- and 80-bit fields and carry a `toy` ceiling.
    - >-
      The dominant residual uncertainty is still a subroutine that was never
      written: batched Sutherland-type modular-polynomial evaluation, 11.50 to
      13.25 bits at NIST-I, 48 to 59 per cent of the corrected overhead. It is the
      frozen paper's own stated expectation about how the list would be
      populated, so it is not a speculative escape hatch.
    - >-
      The comparison remains asymmetric in the attack's disfavour (RT3-C9),
      plausibly worth 5-7 bits back to the attack, unmeasured and applied to no
      number; and the end-to-end baseline constant k from the frozen
      bibliography's [15] and [3] is still unquantified after three batches, in
      the attack's disfavour if k > 1. Every margin row carries both.
    - >-
      RT-S1 is FURTHER WEAKENED AND NOT WITHDRAWN. Two of its five standing
      reasons are DISCHARGED by this batch: the headline is no longer a
      composition artifact (the seam is gone, 47/47 ell admitted, the exponent of
      record is the homogeneous pair), and the window supplying the interval's
      upper end now has a null-object control (C-NULL coverage 1.0000 in every
      fitted window including W-TOP). THREE STAND: magnitude (the span is still
      13.94 to 16.62 bits against a 2.23-bit band, still set by an unwritten
      subroutine); the unquantified baseline constant k; and Heuristic 1's untested
      tail, which sets P0 and moves every row identically. The frozen paper's own
      hedge - "impact on concrete parameter sets remains to be clarified" -
      remains the correct framing, now for reasons of MAGNITUDE and of the
      BASELINE side rather than of SIGN.
    - >-
      This batch CLOSES NOTHING and is not written as if it did. Per
      docs/inventor-protocol.md section 4 a closure needs a named obstruction, an
      argument and forward guidance; the honest statement is the opposite - the
      lane has named live controls (NC2c, NC2d-PROPER, NC2f, NC2a-BAND,
      NC2b-SLOPE, L2-WEIGHT) each costing minutes to hours, and its method
      ceiling is stated rather than its exhaustion asserted.
    - >-
      Inference ran under INFAMEND-20260802-P13-002 with fallback_used: true. The
      review-adversarial xhigh requirement is recorded as UNVERIFIED, not as met,
      and the manifest cannot name a probe-verified resolved model identifier.
      Independent-session requirements were genuinely satisfied. No
      review-breakthrough tier is claimed anywhere in this batch, and none could
      be.
    - >-
      This decision changes no experiment file, no run artifact, and no review
      report. EXP-PEC-6be870 and EXP-PEC-49c773 stay byte-unchanged; every
      correction is a superseding note.

