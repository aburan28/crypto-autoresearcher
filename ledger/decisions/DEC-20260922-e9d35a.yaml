        why: >-
          Below doing nothing because it inverts the gate. The entry's
          irregularity is that it was published without a promotion decision;
          supplying the decision to regularise the filing would confer
          `replicated`-class standing on a `preliminary`, unreviewed,
          RUN-less measurement. Leaving the gate unmet and saying so costs a
          reader one extra field to read. Promoting costs the gate its meaning.
      - item: >-
          Filing an impediment or correction against H-FROB-a5bf86 or
          GOAL-FROB-6333a9's completion criteria on the strength of
          EV-FROB-b6e1e9.
        why: >-
          Below doing nothing, and this is the precedent's central lesson. That
          record measures a NON-LINEAR orbit union of a random subspace at
          n = 13..23 against a summed-cost baseline; H-FROB-a5bf86 tests LINEAR
          ker g(sigma) at n = 41/43 against 2^{ml}/m!. Different object,
          different cells, different null -- the record says so itself in four
          places and sets `hypothesis_id: null` deliberately for exactly this
          reason. Letting a measurement of one object read as a verdict on
          another is the defect DEC-20260918-4b7e21 blocked propagation for, and
          it would be a self-inflicted repeat.

