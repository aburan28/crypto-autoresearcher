    # -------------------------------------------------------------------------
    # ITEM 5 -- the unowned run package
    # -------------------------------------------------------------------------
    - item: ITEM-5
      subject: TASK-20260920-66a30e -- two dispatch-blocking defects
      verb: supersede_the_merged_card_without_editing_it

      headline_finding: >-
        GOAL-FROB-6333a9 HAS NEVER HAD A DISPATCHABLE EXECUTOR CARD. This is the
        deeper reason the goal sat at `current_batch_id: null` for two days, and
        it is a larger finding than the one this item opened with: the missing
        queue was not the only thing missing. The card that queue would have
        carried could not have been routed either.

      defect_2_found_when_the_queue_was_rendered: >-
        THE MERGED CARD IS UNDISPATCHABLE. `tools/research_dispatch.py` refuses
        it: "artifact_paths must be an exact safe repository-relative file path".
        Its `artifact_paths` and its `write_scope` are the SAME four-entry list
        and two entries are directories.

        THE DEFECT IS A CONFLATION, NOT A TYPO, and the tool's own code says so:
        `validate_scope` (lines 211-216) strips a trailing slash and ALLOWS a
        directory; `validate_artifact_path` (lines 219-227) refuses one. The two
        fields answer different questions -- `write_scope` is a PERMISSION
        BOUNDARY and must be a directory for a producer that creates files whose
        names it chooses, while `artifact_paths` is the COMPLETION-CHECKABLE
        DECLARED SET and must be exact. The merged card gave one answer to both.
        Across every queue in this repository 15876 entries conform and 5 do not;
        two of the five are that card and the other three are on GOAL-DREG-001,
        which is also not dispatching.
      defect_2_basis: >-
        `tools/research_dispatch.py` lines 185-274 were READ DIRECTLY by this
        Coordinator, so the ruling rests on the two validators rather than on an
        inference from an error string. The dispatch error itself and the
        15876-versus-5 count were REPORTED by the driving session, which ran the
        tool; this agent holds no shell and ran nothing.

      ruling:
        - >-
          TASK-20260922-cd6f21 SUPERSEDES TASK-20260920-66a30e and is the card
          BATCH-5286b0 dispatches. The merged card is not edited, not withdrawn,
          not deleted, and is ABSENT from the queue. It remains the
          historically accurate record of what was asked on 2026-09-20,
          including the dispatch precondition CORR-20260922-9e402f shows was
          insufficient.
        - >-
          THE SUPERSEDING CARD'S `artifact_paths` IS THREE EXACT FILES --
          implementation.md, trial-plan.json, RESULTS.json -- while its
          `write_scope` KEEPS the two directories. That asymmetry is the repair.
          A RUN-ID does not exist until the runner mints it, so
          `runs/<RUN-ID>/manifest.yaml` is unnameable in advance AND MUST NOT BE
          GUESSED (rule 5), and the module names under `implementation/` are the
          executor's choice. Those are bound where they CAN be bound honestly: as
          SOURCES of the snapshot archive TASK-20260922-98729f, hashed at archive
          time when their names are facts.
        - >-
          RESULTS.json IS THE PIECE THAT MAKES THAT WORK, and it is a protocol
          addition rather than a clerical one, so it is authorized by amendment
          clause A-5 rather than asserted on a card. It is nameable in advance
          and makes the unnameable set enumerable afterwards. Without it "which
          cells ran" is answerable only by listing a directory, and A DIRECTORY
          LISTING CANNOT DISTINGUISH A CELL THAT REFUTED FROM A CELL THAT WAS
          NEVER ATTEMPTED. Its binding invariant: a planned cell that was not run
          is recorded with its reason and is never silently absent.
        - >-
          NOT ONE SCIENTIFIC PARAMETER CHANGES. The superseding card enumerates
          seven changes -- paths, archival owner, read scope, four added
          constraints, fallback_allowed, preconditions, and a state that did not
          move -- and none is a cell, curve, dimension, seed, control,
          certificate requirement, invalidation rule, stopping rule, budget
          number or threshold. The budget is verbatim. A superseding executor
          card that quietly moved a parameter would be a protocol change wearing
          a clerical disguise; this one is diffable line by line and a reviewer
          should diff it.
        - >-
          ONE CORRECTION, NOT TWO. CORR-20260922-9e402f is AMENDED to carry both
          defects of the one merged card. Splitting them would create a second
          correction whose only distinguishing property is the minute each was
          noticed -- the "one defect, reported twice" double-count
          DEC-20260918-4b7e21 had to unpick for the shared-registry hash.

      the_publication_test_applied_two_sidedly: >-
        ASKED FOR EXPLICITLY, SO STATED IN FULL. The test governs THE RECORD
        WHOSE BYTES CHANGE, not the topic. TASK-20260920-66a30e is committed AND
        merged -- a reader could have relied on it -- so it may only be
        SUPERSEDED, and it is not edited. CORR-20260922-9e402f is committed but
        UNPUSHED -- no reader could have relied on it -- so it may be AMENDED,
        and it is. Those are the same rule reaching opposite conclusions about
        two records in one act, which is what makes it a rule rather than a
        preference.

      the_first_draft_left_a_trap_and_that_is_worth_recording: >-
        The earlier version of this item kept the merged card in the queue with
        an `archived_by_corrected` overlay and a warning in capitals that a
        dispatcher reading only the card's own `archived_by` would repeat the
        defect. That is a live trap DOCUMENTED rather than REMOVED, and
        documenting a trap is what you do when you cannot remove it. Here it
        could be removed. The supersession removes it: the card that will run
        carries the correct owner natively and no dispatcher has to read a side
        binding at all.

      a_generalisable_finding_not_claimed_as_one: >-
        The same conflation accounts for the other three non-conforming entries
        in the repository, all on GOAL-DREG-001, which is also not dispatching.
        Two campaigns stopped by one misreading of two adjacent fields is
        plausibly worth a standing note of the kind ITEM-2 of
        DEC-20260918-4b7e21 made for crossover search floors. IT IS NOT DECLARED
        STANDING HERE: I have read two cards and a relayed statistic, not
        GOAL-DREG-001's queue, and a rule asserted from an unexamined second
        instance is the failure this program keeps correcting. Named so the next
        session can rank it; GOAL-DREG-001 is ECC and is not this lane's to
        repair unasked.

      defect_1_the_archival_ownership: >-
        The card declares four artifact_paths for the EXP-FROB-30006a run
        package and names `archived_by: TASK-20260920-956d12`. That archival
        task COMPLETED on 2026-09-20 at 08:23:48Z at commit 14ef07b83 and its
        receipt's staged_paths contains none of the four -- it staged the design
        package: the specification, two .gitkeep placeholders, the decision, the
        hypothesis, the proposal, the goal head and the two cards. So the run
        package has no owning archival task, and the owner named is an archive
        that closed before any deliverable existed. This is the same defect
        class the portfolio health report flags as needing repair on
        GOAL-ICEX-001 and GOAL-SIG-001.

      defect_1_ruling:
        - >-
          OWNERSHIP OF THE RUN PACKAGE IS TASK-20260922-98729f's, and the
          superseding card CARRIES THAT NATIVELY in its own `archived_by` rather
          than inheriting it through a side binding. CORR-20260922-9e402f
          records the rebinding; TASK-20260922-98729f's declared source is
          TASK-20260922-cd6f21, the card that will actually run.
        - >-
          THE MERGED CARD IS NOT EDITED. TASK-20260920-66a30e stays as written,
          including `archived_by: TASK-20260920-956d12` and `state:
          written_not_dispatched`. AGENTS.md is explicit that a card is never
          edited to make a dispatch look compliant, and the same logic binds
          before a dispatch as after it: the card is historically accurate for
          the moment it was written, and a correction plus a superseding card
          supply what followed.
        - >-
          THIS WAS A PRE-DISPATCH REPAIR AND THAT DISTINCTION IS THE WHOLE VALUE
          OF IT. The standing dispatch precondition -- `archived_by` bound
          before dispatch, an owner for the deliverable from the moment it
          exists -- has not been violated, because nothing has been dispatched.
          It was found by reading the WHOLE CARD before routing it, which is
          precisely the failure AGENTS.md records CORR-20260915-6708e4 for:
          there, a Coordinator read the half addressed to the callee, skipped
