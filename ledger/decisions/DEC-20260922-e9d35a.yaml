        - >-
          TWO CITATION LIMITS, from the entry's own text and made this
          Coordinator's ruling rather than only the author's self-assessment.
          (i) `proof_status: derivation` bounded at dimension 4 by cost may NOT
          be cited as a proof of non-existence; the entry says so and the ruling
