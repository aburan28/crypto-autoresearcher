  item_rulings:
    - item: ITEM-1
      subject: EV-FROB-b6e1e9 and EXP-FROB-9af278
      goal: GOAL-FROB-6333a9
      question: RQ-FROB-7d8dd4
      verb: admit_as_unapproved_unreviewed_with_a_ceiling_and_close_approval

      ruling:
        - >-
          EV-FROB-b6e1e9 IS ADMITTED TO THE ARCHIVE with disposition
          `unapproved_unreviewed_internal`. It stands as filed, is immutable,
          and is not edited. It is a MEASUREMENT WITH ITS PROVENANCE ATTACHED
          and a reproduction target. It is not this program's evidence and does
          not become so by being composed.
        - >-
          ITS `strength: preliminary` IS THE PRODUCER'S GRADE AND IS NOT
          CONFERRED BY THIS PROGRAM. Its `direction: weakens` likewise stands as
          the PRODUCER'S reading, scoped to the six boundaries the record
          declares. This follows DEC-20260918-4b7e21's ITEM-3 exactly. The
          grading question is not whether the numbers are right; on the record's
          own account they are internally cross-checked in five ways, and I have
          no reason to doubt them.
        - >-
          BINDING CEILING, stated so it cannot be read narrowly: no hypothesis
          status may move on EV-FROB-b6e1e9; no completion criterion of
          GOAL-FROB-6333a9 or any other goal may be discharged by it; no KN-*
          entry may be PROMOTED from it (see ITEM-2 for the entry already
          authored); no `EV-*` or `DEC-*` record may cite it as internal ground
          truth or as a settled value; and no figure in it may be quoted in any
          record of this program as a RESULT. It may be quoted as a MEASUREMENT
          WITH ITS PROVENANCE, which is what this decision itself does
          throughout, and as the prior that ITEM-3's amendment acts on.
        - >-
          EXP-FROB-9af278 STAYS `external_completed` AND IS RECORDED
          `approval_closed: true` -- retired in place. No future Coordinator may
          approve it. DEC-20260918-4b7e21's reasoning applies with one addition
          that makes it stronger here: that record's own
          `preregistered_prediction` block is all-null and its
          `success_criterion` states in terms that no criterion was declared
          before the measurement. An approval would therefore have to assert a
          preregistration the contract itself denies, which is not a
          technicality but a false statement.
        - >-
          THE ROUTE TO CITABILITY is the successor at dispatch_ranking rank 2: a
          frozen contract under a NEW EXP-* identifier, approved before
          execution under the standing user authorization, carrying (i) NO
          preregistered predictions restated from this work, (ii) the null
          object RQ-FROB-7d8dd4's decision target (a) requires -- a curve over
          F_{q^n} defined over no proper subfield at matched size -- which these
          instruments do not build and whose absence is why the record's own
          completion_criteria_impact reads NONE, (iii) the m = 3 cell, and (iv)
          independent review before any evidence record is written. THAT
          IDENTIFIER IS NOT MINTED HERE and the contract is not authored here.

      what_the_record_is_right_about_and_is_not_credited_for: >-
        Recorded because a ceiling is not a criticism and reading it as one is
        how good work gets discarded twice. Five things in EV-FROB-b6e1e9 are
        better than most records this program holds at any strength: a
        solver-free exhaustive ground truth; four PLANTED decompositions used
        because every target in the largest cells refutes, so verdict agreement
        alone would also be satisfied by a solver that never finds anything --
        which is `controls before belief` applied correctly and unprompted; a
        second solver and a second search mode, so the negative cannot rest on
        one solver's XOR handling; the arm under test reported in its FAVOURABLE
        branching configuration with the unfavourable figures given too; and an
        arm thrown out for violating its own instance rather than reported. The
        ceiling is about provenance and about what may rest on the record. It is
        not a judgement on the instrument.

      resource_check_readings_filed:
        - id: RR-1
          reading: >-
            THE SHIFT OVERHEAD IS CHEAP, WHICH IS A STATEMENT ABOUT WHAT REMAINS
            OPEN. Deciding the shift costs about n conflicts -- three of four
            WDSat rows within one of n - 1 -- so the shift bits are nearly free
            to the solver. What is expensive is the coordinate BLOCKS, and the
            parameterisation leaves those untouched. A use of orbit structure
            that reduces unknowns per summand, rather than cheapening an index
            over j, is untouched by this measurement.
          disposition: >-
            ENTERS THE RANKING AS AN ORDINARY CANDIDATE AND CHANGES NO STATUS BY
            EXISTING. It needs an IDEA-* identifier this session cannot mint; it
            is named, not filed, and it is the most exponent-relevant thing this
            record leaves behind, because a block-count reduction is the only
            change in this family that could move an exponent rather than a
            system count.
        - id: RR-2
          reading: >-
            THE XG GAP ON THE BASELINE. Under XORGAUSS the single-shift BASELINE
            system sits 12x and 24x BELOW its own orbit-naive enumeration bound
            (2^{2 l'} = 1024 at n = 19 and 16384 at n = 23; measured 83 and
            675), while the same instances in plain mode sit 5.6x and 9.0x
            ABOVE it. The record flags that if an analogous gap holds on the
            linear stable V it is a fact about the null H-FROB-a5bf86 scores
            against, and says it would be worth knowing BEFORE that
            experiment's result is interpreted.
          disposition: >-
            ACTED ON, AND IT IS WHY THIS DECISION HAS TWO HALVES. Not deferred
            to a successor record: it is discharged as ITEM-3's amendment on the
            experiment it bears on, before that experiment runs. This is the
            resource_check doing exactly what docs/inventor-protocol.md section
            4 says it is for -- the same quantity that refutes one arm is the
            hypothesis of a control on another.

      scope_acknowledged: >-
        Restating the record's own boundaries because they bound everything
        above and because ITEM-3 is the only place any of it travels: n in
        {13, 17, 19, 23}, all prime, largest subgroup 23 bits, NOTHING at
        n = 131, 163, 233, 283, 409 or 571; m = 2 only, and the chained system
        at m >= 3 is not built at all; factor base the orbit union of ONE random
        F_2-subspace family and no other; measured quantity solver conflict
        counts, which are a property of a search and not of the algebra; CaDiCaL
        1.5.3 and WDSat 55d55b2 only; 15 to 25 targets per cell with 0 or 1
        satisfiable, so the per-relation figure at n = 23 is a point estimate on
        one decomposable target with no spread. No exponent moves in either
        direction and no lane closes.

