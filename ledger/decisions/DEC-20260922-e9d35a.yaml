    This decision OPENS that batch and is filed inside it. Unlike
    DEC-20260918-4b7e21, which carried batch_id null because it was a portfolio
    disposition with no batch to belong to, the disposition half of this
    decision is inseparable from the batch it opens -- the amendment in ITEM-3
    binds the very contract this batch dispatches.

  decision: revise
  decision_label: >-
    Compose EV-FROB-b6e1e9 as an unapproved, unreviewed, toy-tier measurement
    with a binding ceiling; refuse its `preliminary` grade and `weakens`
    direction as this program's, leaving both as the producer's readings; close
    EXP-FROB-9af278 to approval forever. Rule KN-FIND-47da4e's promotion gate
    NOT MET and leave it not met, admitting the entry as an unpromoted deposit
    with a ceiling rather than quarantining it. Admit KN-OPEN-095df5 as filed
    with its declared derivation bound. Amend EXP-FROB-30006a additively, before
    any run exists, to declare the WDSat search mode and to require a control
    differential on the `pruning` branch. Open BATCH-5286b0 with a three-card
    queue, rebind the run package's archival ownership by correction, and
    checkpoint the goal head with one next action.

  context: >-
    GOAL-FROB-6333a9 was created 2026-09-20 with an approved experiment
    (EXP-FROB-30006a, DEC-20260920-cf8ded), an approved hypothesis
    (H-FROB-a5bf86), a completed design-package snapshot
    (TASK-20260920-956d12, receipt at commit 14ef07b83), and an executor card
    (TASK-20260920-66a30e) in state `written_not_dispatched`. Its head carries
    `current_batch_id: null`, `dispatch_queue_path: null` and
    `latest_verified_commit: null`. So an approved ECC experiment had named next
    actions and no queue through which the dispatcher could route them.

    Separately, four artifacts landed on main on 2026-09-21 (PRs #1335, #1353)
    on the same question and goal: EV-FROB-b6e1e9, EXP-FROB-9af278,
    KN-FIND-47da4e and KN-OPEN-095df5. No decision composed any of them. All
    four state their own defects in their own text -- EXP-FROB-9af278 leads with
    "WHAT A READER MUST NOT CONCLUDE", and KN-FIND-47da4e carries an explicit
    `promotion_gate: NOT MET` field naming the precedent that governs it. That
    candour is why the effort is recoverable rather than a contamination event,
    and it is the second time this program has had to rule on this pattern.

    The question is not whether the measurement is good. It is what may rest on
    it -- and, as it turned out, what it obliges this Coordinator to fix in a
    contract that was already approved.

  # ---------------------------------------------------------------------------
  # RANKING. Recorded first because an unlimited ECC budget is the strongest
  # invitation to make-work this program has, and because the instruction to
  # name what ranked BELOW doing nothing is itself a guard.
  # ---------------------------------------------------------------------------
  ranking:
    basis: >-
      Expected information gain per unit cost, dependency risk, and scientific
      value under docs/target-result-profile.md, with ECC considered before all
      else. The portfolio offered 1 Ready executor card (not this skill's to
      run), 34 batch-complete goals wanting checkpoints (30 ECC), 20 goals with
      a blocked route, 6 needing integrity repair, and 41 open ECC ideas. Two
      tie-breakers did the work. FIRST: a defect that can turn a future
      measurement into an artifact is worth more than a measurement, because its
      value expires the moment the measurement lands and is unrecoverable
      afterwards -- the same asymmetry that put a pre-measurement prior above a
      ruling in BATCH-cbb416. SECOND: an unpromoted-but-published corpus entry
      is an armed trigger, not a dormant field (DEC-20260918-4b7e21's rationale,
      where that trigger had already fired twice before anyone looked).
    ecc_first_compliance: >-
      FROB is a declared ECC area, read at orchestration/research-priority.yaml
      line 85 directly and NOT inferred from the identifier prefix, which
      AGENTS.md forbids. Every ranked item below is ECC. No non-ECC work was
      considered; the one unexamined obstruction in the registry,
      EV-AES-abf3dc, is non-ECC and is therefore ranked behind all of this by
      instruction 2 rather than on its merits.
    ranked:
      - rank: 1
        item: >-
          PERFORMED. Compose EV-FROB-b6e1e9, settle KN-FIND-47da4e's gate, and
          open BATCH-5286b0 with the protocol amendment the composition forced.
        why: >-
          Highest on both tie-breakers at once, which is why it is one act. The
          composition is the only Coordinator-only act on the table that is
          overdue rather than merely available: a merged evidence record with no
          decision and a corpus entry declaring its own gate unmet are both
          states only this role can leave. And the amendment is pure expiring
          value -- EXP-FROB-30006a has zero runs today, so the control can still
          be added additively and honestly; after the first run it could not be
          added at all without changing a success criterion after observing an
          outcome, which is prohibited.
      - rank: 2
        item: >-
          NOT DISPATCHED. The successor frozen contract for the orbit-union arm,
          with the null object RQ-FROB-7d8dd4's decision target (a) requires: a
          curve over F_{q^n} defined over no proper subfield, at matched size.
        why: >-
          This is what would make EV-FROB-b6e1e9's eight cells citable and the
          m = 3 arity reachable -- the arity at which an index calculus at a
          cryptographic degree would actually have to live, which is the only
          exponent-relevant cell in the family. Ranked second because it needs a
          new EXP-* identifier this session cannot mint, and because the m = 2
          result it would replicate is cost-NEUTRAL: replicating a relabelling
          buys citability, not exponent movement.
      - rank: 3
        item: >-
          NOT DISPATCHED, AND NOT MINE TO RULE. The reach of the Nagao 2015/984
          Lemma 4 refutation across records citing d_F <= d'_F as a theorem
          (bus MSG-20260921-b30103, MSG-20260921-e200a6, MSG-20260921-9a6942).
        why: >-
          Genuinely high value -- a withdrawn theorem propagates further than a
          withdrawn figure, and SEMBIN is ECC. Ranked third and left alone for a
          reason that is not priority: two live sessions
          (coordinator-sembin-e0a0c1, -457504) are working it now, the three
          messages are POINTERS AND NOT EVIDENCE, and a second lane ruling on
