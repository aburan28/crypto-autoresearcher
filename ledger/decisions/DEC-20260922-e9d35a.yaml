          needs a new KN-LIT-* identifier this session cannot mint.

      the_process_finding: >-
        BOTH ENTRIES ENTERED THE CORPUS WITHOUT A COORDINATOR PROMOTION
        DECISION, WHICH IS THE ONLY PROMOTION CHANNEL. knowledge/README.md gives
        that authority to this role alone, and both were authored on 2026-09-21
        by the session that produced the measurement. This is the same process
        defect DEC-20260918-4b7e21 recorded for KN-FIND-9cba50 and
        KN-FIND-aa2efc, now observed a second time, and the repetition is the
        finding: the corpus has no mechanical gate, so the only thing standing
        between an unreviewed measurement and a curated internal finding is a
