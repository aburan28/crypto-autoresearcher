        why: >-
          Both ECC, both real, and the class of defect is the same one ITEM-5
          repairs on this goal. Behind rank 1 because ITEM-5 shows the repair is
          cheap when the goal is already open, and doing it on two goals nobody
          is otherwise touching spends a session on bookkeeping that blocks no
          measurement today.
    ranked_below_doing_nothing:
      - item: >-
          Dispatching a card against GOAL-FROB-6333a9 to fill the queue's second
          concurrency slot.
        why: >-
          The goal declares `max_concurrent: 1` on the basis that WDSat cells
          need the machine otherwise quiet. There is no second card whose value
          exceeds the risk of degrading the primary cell's conflict counts --
          and conflict counts are the primary metric, so contention corrupts the
          measurement rather than merely slowing it. This is the make-work
          AGENTS.md names as the honest failure mode of a goal that can never be
          parked.
      - item: >-
          Retroactively approving EXP-FROB-9af278 and re-running its instruments
