    - item: ITEM-2
      subject: KN-FIND-47da4e and KN-OPEN-095df5
      verb: rule_the_gate_not_met_and_admit_both_unpromoted

      ruling_on_KN_FIND_47da4e:
        - >-
          THE PROMOTION GATE IS NOT MET AND STAYS NOT MET. knowledge/README.md
          promotes a finding only from evidence of strength `replicated` or
          `strong` and only on a Coordinator decision. EV-FROB-b6e1e9 is
          `preliminary`, unreviewed, has `run_ids: []` and sits under a contract
          with `approved_by: null`. ITEM-1 additionally rules its grade
          unconferred. Two independent reasons the gate cannot be reached, and
          this decision is not a `support` or `reject_scoped` decision, so the
          gate's mandatory limb does not fire at all.
        - >-
          THE ENTRY IS ADMITTED AS AN UNPROMOTED DEPOSIT, disposition
          `deposit_unpromoted`. Not edited, not withdrawn, `superseded_by` left
          null. Its ceiling is ITEM-1's, restated as the corpus's: it may not
          support a hypothesis status change, may not discharge a completion
          criterion, may not be cited as internal ground truth, and may NOT be
          cited as a promoted or curated finding of this program. It MAY be
          cited for what it measured, on the family it names, with its own
          caveats attached.
        - >-
          IT IS NOT QUARANTINED, AND THE DIVERGENCE FROM KN-FIND-9cba50 IS
          DELIBERATE RATHER THAN LENIENT. Three differences carry it. (i) Its
          headline is a measurement with its own scope, solvers, degrees and
          direction in the title; 9cba50's headline was an ATTRIBUTION about
          another active ECC goal's instruments, which is what a quarantine
