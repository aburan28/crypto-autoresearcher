      - rank: 4
        item: >-
          NOT DISPATCHED. Checkpoint one of the 30 batch-complete ECC goals and
          open its next batch (GOAL-AUXIN-a93442, GOAL-ECQ-e72c0b,
          GOAL-ECRANK-002, GOAL-ENDO-001, GOAL-MONO-001, GOAL-PATH-001,
          GOAL-RELN-001, GOAL-SDEG-001, GOAL-ECTD-001, GOAL-ECDLP2M-001,
          GOAL-CRYPTO-001, and 19 GOAL-SCURVE-*).
        why: >-
          Thirty of these are ECC and every one is real work. Ranked fourth as a
          CLASS because the class's ranking question is not answered by counting
          it: each needs its completed batch read before its next batch can be
          ranked, and reading thirty to pick one is the expensive way to do
          what one merge digest and one goal head answer. The 19 GOAL-SCURVE-*
          goals reporting identical "all 2 tasks completed" are the strongest
          single candidate for a consolidated pass, precisely because 19
          identical states are more likely one pattern than 19 problems.
      - rank: 5
        item: >-
          NOT DISPATCHED. Design work on the 41 open ECC ideas (ECDLP 12,
          CRYPTO 7, SEMBIN 6, GFPN 6, DREG 5, ICPERF 4, SATIC 1).
        why: >-
          Ranked work under CLAUDE.md rule 11 instruction 3 and NOT backlog --
          recorded here so no reader mistakes rank 5 for shelving. Behind the
