          any instrument or goal of this program -- it says four times over what
          it does not claim, including that it must not be read as anticipating
          H-FROB-a5bf86's result. (iii) It carries a dedicated
          `promotion_gate: NOT MET` field naming the governing precedent, so a
          retrieval hit on it arrives already labelled. A quarantine would be
          the right remedy if the entry concealed its status; its status is the
          fourth field a reader sees.
        - >-
          ONE THING IS RULED AGAINST IT ON TOP OF THE GATE. Its TITLE states the
          ratios as a result -- "is cost-neutral ... ratio 1.02, 1.02, 1.47,
          1.15 ... never below 1" -- and a title is what a retrieval index
          serves first. No record of this program may cite that title's
          numbers as this program's finding, and a future curation pass that
          promotes or supersedes this entry must put the toy scope and the m = 2
          arity INSIDE the title, not only in the body. Recorded as a binding
          instruction to the promotion that has not happened rather than as an
          edit to an immutable entry.

      ruling_on_KN_OPEN_095df5:
        - >-
          ADMITTED AS FILED, unquarantined, unedited, with no ceiling beyond its
          own. An open problem asserts an unknown, and this one asserts it
          carefully: `status: open`, `confidence: unverified`, six explicit
          non-claims including "Not a closure of anything" and "Not that no such
          group exists", and the disclosed 211-versus-215 class gap at dimension
