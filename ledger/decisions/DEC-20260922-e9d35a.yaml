  limitations:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE IN EITHER
      DIRECTION. No Certicom challenge curve and no FIPS binary curve is
      asserted safe or attackable. Every figure discussed is `claim_tier: toy`
      at n <= 23, the contract being amended is `claim_tier: toy` at n = 41 and
      43, no ECDLP was solved, no relation computed, and no certificate attaches
      to any number named here. rho on ECC2K-130 is untouched.
    - >-
      THE AMENDMENT RESTS ON A TRANSFER I HAVE NOT ESTABLISHED. The XG
      enumeration-bound gap is measured on a different object, at different
      degrees, at one arity, against a different null. The amendment is
      justified as a CONTROL against a possibility, not as a prediction, and
      transfer_assumptions in ITEM-3 states every difference. A reader who
      believes the transfer fails should still want A-1 and A-2, because an
      undeclared solver mode and a control-free pruning branch are defects
      independent of any transfer.
    - >-
      D1's MAGNITUDE IS SECOND-HAND. That the mode is undeclared is checkable by
      reading the frozen contract. That it is worth 69x to 220x is read from
      EV-FROB-b6e1e9, which this same decision rules is not this program's
      evidence. That is not a contradiction -- the record is admitted as a
      measurement-with-provenance and a control may rest on one -- but a
      hypothesis status may not, and none does.
    - >-
      THE RULING THAT `preliminary` IS NOT CONFERRED IS A GRADING JUDGEMENT AND
      NOT A FINDING THAT THE WORK IS DEFECTIVE. EV-FROB-b6e1e9 may well deserve
      a grade once a reviewer in this program has read its bound artifacts.
      Until then the grade is the producer's.
    - >-
      NO RUN-* RECORD EXISTS FOR THE FROB MEASUREMENT AND NONE IS INVENTED.
      Every figure traced through this decision comes from `python3` invocations
      in one interactive session, bound by content and not by manifest. That is
      a permanent property of those numbers and no later record can repair it;
      only a fresh run under a frozen contract can supply one.
    - >-
      THIS BATCH CANNOT REACH A DECISION AS OPENED. The review round and the
      evidence-and-decision ledger archive need TASK-* identifiers this session
      cannot mint. Recorded as IMP-FROB-6333A9-REVIEWCARDS on the still-active
      goal with a concrete recheck, and as the batch's declared remainder. It
      blocks the CLAIM, never the campaign.
    - >-
      NONE OF THE RECORDS THIS DECISION WRITES IS COMMITTED AT THE TIME OF
      WRITING, SO NONE OF IT IS OFFICIAL YET. Under AGENTS.md "Durable research
      commits" no transition above takes effect until TASK-20260922-0e3b58's
      commit is verified. See procedure_deviations PD-1.
    - >-
      I DID NOT READ THE 34 BATCH-COMPLETE GOALS I RANKED FOURTH, NOR THE 41
      OPEN ECC IDEAS I RANKED FIFTH. Both rankings are made on the portfolio
      health summary and on the structure of the work, not on each record's
      merits. A later session that reads one of them and finds it more valuable
      than rank 1 was should say so; this is a ranking under declared partial
      information and states it.

  procedure_deviations:
    - id: PD-1
      severity: material
      what: >-
        THIS SESSION HAS NO SHELL. Bash is unavailable to this agent. Three
        things the contract requires therefore could not be done here:
        `tools/allocate_id.py --check` was not run by me on any identifier,
        `tools/validate_ledger.py` was not run on anything written, and no git
        command was executed, so nothing is committed or pushed.
      what_was_done_instead: >-
        All four identifiers (DEC-20260922-e9d35a, BATCH-5286b0,
        TASK-20260922-98729f, TASK-20260922-0e3b58, plus CORR-20260922-9e402f)
        were PRE-MINTED AND PRE-CHECKED WITH `--check` BY THE DRIVING SESSION
        before this agent was launched, and are used as supplied. The amendment
        id AMD-EXP-FROB-30006a-20260922-nullcontrol is DERIVED from the
        experiment id, the date and a slug, following the existing committed
        precedent AMD-EXP-AUXIN-7e2e3d-20260916-bands and
        AMD-EXP-SEMBIN-4fa22c-20260916-collision; it is not a minted class and
        `allocate_id.py` has no `amendment` type.
      what_was_NOT_done: >-
        No substitute exists for the validator or the commit and none was
        improvised. Every record written here is a working-tree artifact until
        the driving session commits it.
      consequence: >-
        Every official transition listed above is PENDING, not effective.
        TASK-20260922-0e3b58 carries the validator run, the origin/main merge
        check, the commit and the push as hard completion gates, and carries
        re-running `allocate_id.py --check` on all five identifiers before the
        commit lands.
    - id: PD-2
      severity: material
      severity_note: >-
        RAISED FROM `disclosed` TO `material` BEFORE PUBLICATION. The first draft
        of this deviation recorded that the opening act had NO CARD and called
        the absence tolerable because ownership was preserved. That judgement was
        wrong and was overturned by the dispatcher, not by me.
      what: >-
        THE BATCH-OPENING ACT'S CARD WAS WRITTEN AFTER THE ACT. The opening act
        -- this decision, the amendment, the correction, the checkpoint, the head
        edit, the queue and the two archival cards -- was performed by a
        /coordinate engagement before any card existed for it, because the queue
        that carries its card is one of the things it creates.
      how_it_was_caught: >-
        BY `tools/research_dispatch.py`, WHICH REFUSED THE QUEUE:
        "dispatch error: tasks[0].archive.source_task_ids must be a nonempty text
        list". The first draft declared TASK-20260922-0e3b58 with
        `source_task_ids: []` and a note arguing that an opening archive closes
        no producer. THE SCHEMA WAS RIGHT AND THE NOTE WAS WRONG. Every archive
        follows a producer and this one does too; the producer was the opening
        act, and the empty list was not a property of opening archives but the
        shadow of the missing card.
      what_was_done: >-
        The card was written, as
        coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/dispatch_queue.json
        tasks[0]: role coordinator, `state: completed`, the eight opening
        artifacts as its artifact_paths and write_scope, a full handoff envelope,
        a budget, a completion gate, `archived_by: TASK-20260922-0e3b58`, and an
        outcome that says in terms that it was written after the act. That makes
        TASK-20260922-0e3b58's `source_task_ids` TRUE rather than
        schema-satisfying, and it follows BATCH-cbb416's shape
        (TASK-20260916-141f76 OPEN, TASK-20260916-007117 ARCHIVE) which this
        batch should have copied at the outset. Its identifier is minted by the
        driving session; the authoring agent holds no shell and may not invent
        one.
      what_was_rejected: >-
        NAMING TASK-20260920-956d12 AS THE SOURCE. It would have cleared the
        error and would have been false: that task produced the design package
        and archived it on 2026-09-20 at commit 14ef07b83, and none of the eight
        paths this archive stages appears in its staged_paths. It would have been
        the same declared-set-versus-actual-set mismatch ITEM-5 repairs on this
        goal, committed in the act of repairing it. Also rejected: an archive
        whose source_task_ids names itself (passes the schema, reads as a dodge,
        untestable from a shell-less session, and collapses the producer/archive
        distinction), and dropping the archive card from the queue (which would
        leave `archived_by` pointing at an archive `research_dispatch.py` never
        verifies -- the ICEX/SIG defect wearing the opposite face).
      the_lesson_worth_keeping: >-
        A DISCLOSED DEVIATION IS NOT A SUBSTITUTE FOR CORRECTNESS WHEN
        CORRECTNESS IS CHEAP. The first draft's honesty about the missing card
        was real and was also the weaker remedy: it bought a reader's
        understanding at the price of a queue that could not dispatch, on a
        batch whose entire purpose was to give this goal a queue that could. The
        schema caught what the disclosure had excused. That is the failure mode
        to watch for -- candour used as a stopping point rather than as a step.
      consequence: >-
        None for durability or ownership, which were preserved throughout: all
        eight opening artifacts were and are declared in exactly one archival
        task. What changes is that the act is now auditable against a declared
        write scope and completion gate, and the queue dispatches. The residual
        weakness is real and is recorded on the card itself: a write scope
        written after the work does not constrain the work, it only makes it
        checkable afterwards.
    - id: PD-4
      severity: disclosed
      what: >-
        THE QUEUE WAS REFUSED THREE TIMES BY `tools/research_dispatch.py` BEFORE
        IT DISPATCHED, and no refusal was found by me. First:
        `tasks[0].archive.source_task_ids must be a nonempty text list` (PD-2,
        the missing opening card). Second, one card later:
        `tasks[2].artifact_paths must be an exact safe repository-relative file
        path` (ITEM-5, the merged executor card's conflated path lists). Third:
        `ledger archive TASK-20260922-0e3b58 must own exact artifacts under
        ledger/decisions/`, plus two clerical gaps the driving session repaired
        directly -- an inline `handoff.inputs` the queue card omitted while the
        ledger record carried all seven, and an archive `read_scope` that did not
        cover the new superseding handoff its source now produces. I confirm both
        of those repairs: the first mirrors my seven inputs verbatim, the second
        adds exactly the one path line 927 requires.
      the_third_refusal_overturned_a_choice_i_argued_for: >-
        AND THAT IS THE ONE WORTH RECORDING AS A FINDING RATHER THAN A FIX. I
        narrowed the ledger archive's `artifact_paths` to its receipt alone, on
        the principle that the set a task PRODUCES and the set it STAGES should
        stay disjoint so a commit is checkable against a declared list.
        `_validate_ledger_archive` (lines 735-763) refuses that for a
        `kind: ledger` archive: it must own at least one `ledger/decisions/`
        path, with the record id visible in the filename (line 728). Under
        AGENTS.md rule 7 the dispatcher's verifier is what makes a record
        official, so where its contract and my principle collide THE CONTRACT
        WINS -- and the principle is recorded as having lost rather than quietly
        restated somewhere it still looks correct.

        THE PRINCIPLE WAS NOT WRONG, IT WAS OVER-APPLIED. Line 737 returns before
        that check for a `kind: snapshot` archive, so TASK-20260922-98729f keeps
        the one-path shape and says on its own record why the two differ. And
        most of the separation survives even on the ledger card: line 931 derives
        the commit scope as `archive.artifact_paths | source.artifact_paths`, so
        the other eight sources still reach the commit WITHOUT this archive
        claiming to have written them. What the branch actually demands is
        narrower than "declare everything you stage" -- it demands that a ledger
        archive bind, in its own declared set, the DECISION it makes official.
      what_was_rejected_at_the_third_refusal: >-
        THE NINE-PATH SHAPE that was proposed to me -- the archive's
        artifact_paths listing every source record. It satisfies the ledger
        branch and WOULD HAVE BEEN REFUSED A FOURTH TIME at line 875, which
        requires artifact_paths to sit inside write_scope: that shape forces the
        archive's write_scope to swallow all nine source paths. It also buys
        nothing, because line 931 already unions the source's artifact_paths into
        the commit scope. The chosen shape is two paths -- receipt plus the one
        decision -- with `ledger/decisions/DEC-20260922-e9d35a.yaml` added to
        write_scope for line 875, which is the shape TASK-20260916-9d98ef
        dispatched with in BATCH-cbb416 (two artifact_paths, four path_sha256
        entries). The resulting write_scope overlap with the opening card is real
        and harmless: `scope_overlaps` is checked only between RUNNING and
        concurrently SELECTED tasks, the opening card is `completed`,
        max_concurrent is 1, and an archive must run alone.
      a_hand_list_that_duplicates_a_derived_one_is_debt: >-
        `staged_paths_declared` reproduces by hand what line 931 computes and
        line 944 enforces. It has already drifted once, nine to ten. It is kept
        as documentation with a note saying the tool is authoritative if the two
        ever disagree -- which is the honest disposition for a derived list you
        choose to keep, and is the same reasoning CLAUDE.md applies to generated
        artifacts that are rebuilt rather than committed.
      why_it_is_recorded_as_a_deviation_rather_than_as_tooling_working: >-
        BECAUSE ALL THREE WERE READABLE BEFORE RENDERING AND I DID NOT READ FOR
        THEM.
        The second is the sharper case: I admitted the merged card to the queue
        having read it in full, and I read it for the RIGHT thing -- its
        `archived_by` binding, which I did catch -- while its `artifact_paths`
        sat two lines above with two directory entries in a repository where
        15876 of 15881 such entries are exact files. I checked the half of the
        card I had a hypothesis about. That is the same shape as reading only the
        half of a handoff addressed to the callee, which is the failure AGENTS.md
        records CORR-20260915-6708e4 for.
      what_changed_as_a_result: >-
        The third read was of the TOOL rather than of the card:
        `research_dispatch.py` lines 185-274, where `validate_scope` and
        `validate_artifact_path` differ. That is what turned a symptom into a
        ruling -- the fields answer different questions -- and what let ITEM-5
        keep the directories in `write_scope` with confidence instead of
        narrowing both lists and producing an unexecutable card.
      consequence: >-
        None for the records: nothing was pushed at any refusal, and all three
        repairs are structural rather than cosmetic. The cost was three rounds
        and two lessons, both cheap to state. (1) WHEN ADMITTING A PRE-EXISTING
        CARD TO A QUEUE, VALIDATE IT AGAINST THE DISPATCHER'S SCHEMA, not only
        against the defect you came looking for. (2) WHEN A DESIGN PRINCIPLE AND
        A VERIFIER DISAGREE, READ THE VERIFIER FIRST AND STATE WHICH BRANCH YOU
        ARE UNDER -- two of the three refusals were places where I applied a
        sound principle past the boundary where the tool applies it, and the
        boundary was fifty lines of Python away both times.
      what_the_driving_session_did_right_and_is_recorded_for: >-
        IT HELD THE PUSH. The last two PRs in this repository auto-merged within
        fifteen minutes, so a queue that cannot dispatch would have landed on
        `main` and become another campaign's inherited defect -- which is exactly
        what GOAL-ICEX-001, GOAL-SIG-001 and GOAL-DREG-001 are currently carrying
        for others. Refusing to publish an unverified queue is the dispatcher
        half of rule 7 being honoured by the session that owns it, and it is the
        reason all three refusals cost rounds rather than corrections.
