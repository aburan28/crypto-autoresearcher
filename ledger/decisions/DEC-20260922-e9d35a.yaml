          relayed from LMFDB and was not recomputed; a record leaning on the
          census completeness rather than on the targeted exclusion inherits the
          four-class gap.
        - >-
          KN-LIT-796 IS NOT AMENDED HERE. The entry records that GGMP's full
          text was read while the corpus entry for it remains seeded at ABSTRACT
          level, and that upgrading a literature record is a separate task under
