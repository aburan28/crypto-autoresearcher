      KN-FIND-9cba50; ITEM-2 records why the lighter remedy is right here and
      why using the heavier one would blunt it.
    deferred:
      - target: >-
          KN-FIND, from the orbit-union cost-neutrality result, properly
          promoted
        why_deferred: >-
          Deferred until an independently reviewed record of strength
          `replicated` or `strong` exists -- which means the successor contract
          at dispatch_ranking rank 6, not a re-grading of EV-FROB-b6e1e9. Note
          the deferred act is NOT "author an entry": KN-FIND-47da4e already
          exists, so the act is to supersede it with a promoted entry whose
          title carries the toy scope and the m = 2 arity inside it.
      - target: KN-TECH, on the relabelling-versus-removal distinction
        why_deferred: >-
          The reusable content is real and general and is the most transferable
          thing in EV-FROB-b6e1e9: a reparameterisation that reduces a SYSTEM
          COUNT while leaving total work invariant, detected by an additive
          overhead of about one unit per alternative ruled out rather than a
          multiplicative one. That is a test other campaigns can apply. Deferred
          because a KN-TECH asserting it should be authored from a reviewed
          instrument and from more than one instance, and because the entry
          would otherwise inherit exactly the provenance ITEM-1 ceilings.
      - target: >-
          KN-TECH or a standing control, on enumeration-naive nulls under
          XOR-native solvers
        why_deferred: >-
          The general form of ITEM-3's D1/D2 is that a null derived by counting
          an enumeration is not a valid reference for a solver that reasons
          about the algebra directly, so any contract dividing solver work by
          such a null needs both a mode declaration and a control differential.
          That would be a STANDING CONTROL of the kind DEC-20260918-4b7e21's
          ITEM-2 established for crossover search floors, and it is the right
          eventual home. Not declared standing here: one measurement on one
          object is not enough to bind every contract in the program, and
          binding it prematurely would be a rule asserted on the strength of a
          record this decision has just ruled uncitable. The exposure on the
          only contract at risk today is closed by the amendment.

