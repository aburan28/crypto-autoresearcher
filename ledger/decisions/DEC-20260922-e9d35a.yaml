  rationale:
    - >-
      A CONTROL THAT CAN STILL BE ADDED IS WORTH MORE THAN A MEASUREMENT,
      BECAUSE ITS VALUE EXPIRES AND THE MEASUREMENT'S DOES NOT. EXP-FROB-30006a
      has zero runs today. Today the mode declaration and the control
      differential are an additive amendment that weakens no threshold and
      asserts nothing. After the first run they are a change to a success
      criterion following an observed outcome, which agents/coordinator.md
      prohibits outright -- so the same repair becomes unavailable rather than
      merely late. That asymmetry, not the size of the defect, is what put this
      first.
    - >-
      THE DEFECT WAS ONLY VISIBLE FROM THE ORPHANED RECORD, WHICH IS THE
      ARGUMENT FOR COMPOSING ORPHANED RECORDS AT ALL. Nothing in
      EXP-FROB-30006a's own text reveals that its null is loose or that its
      solver has a 69x-to-220x knob. EV-FROB-b6e1e9 measured both, on a
      neighbouring object, and its own resource_check said in terms that this
      would be worth knowing BEFORE the other experiment's result is
      interpreted. A program that leaves unreviewed measurements uncomposed does
      not merely fail to bank them; it loses the controls they imply.
    - >-
      PERMISSION AND EVIDENCE STAY SEPARATE, AND THIS DECISION SPENDS ITS WORDS
      ON THE SECOND. It grants EV-FROB-b6e1e9 everything its candour and its
      internal cross-checks earn -- archival admission, reproduction-target
      standing, the design of a successor, and a control on a live contract --
      and refuses the one thing that would require a false statement, which is
      to treat a `preliminary` unreviewed measurement with no RUN record as this
      program's evidence. Approving EXP-FROB-9af278 today would not make one
      number in it more or less correct.
    - >-
      AN UNPROMOTED ENTRY ALREADY IN THE CORPUS IS AN ARMED TRIGGER EVEN WHEN IT
      DECLARES ITSELF UNPROMOTED. The corpus is what the retrieval index serves,
      and what it serves first is a title. KN-FIND-47da4e's title states four
      ratios and the words "cost-neutral" and "never below 1". A future agent
      asking about Frobenius orbit unions is handed that sentence. Ruling the
      gate not met, in a committed record, is what makes the entry's own
      `promotion_gate` field an official status rather than an author's
      annotation -- and it is the second time this program has had to do this,
      which is itself the process finding.
    - >-
      QUARANTINE WAS AVAILABLE AND WAS NOT USED, DELIBERATELY. A quarantine is
      the right remedy for an entry whose headline asserts something about this
      program's own instruments or goals on an unverified attribution --
      KN-FIND-9cba50 exactly. It is the wrong remedy for a candid measurement
      whose fourth field says it is not promoted. Using the heavier remedy
      because it is available would make `quarantined` mean `unpromoted`, and
      the program would lose the distinction the next time it needs the strong
      one.
    - >-
      RANKING, STATED BECAUSE AN UNLIMITED ECC BUDGET INVITES MAKE-WORK. Six
      candidate classes were available and four items were ranked BELOW doing
      nothing and named. Exactly one act was performed, in two inseparable
      halves. The four things I declined are recorded with their reasons, their
      revisit conditions, and in one case (rank 3) with the reason that it is
      another lane's to rule and that a pointer is the correct act rather than a
      ruling.
    - >-
      FOCUS DISCIPLINE IS RESPECTED. One batch is opened with one compute
      producer and max_concurrent 1. No scientific trial is launched. The
      campaign keeps one live lane on one primary cell, and the next rerank
      trigger is the executor's return or a mode disagreement, both named on the
      queue.

