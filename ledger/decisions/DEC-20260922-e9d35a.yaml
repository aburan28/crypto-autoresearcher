    # -------------------------------------------------------------------------
    # ITEM 3 -- the protocol defects, and the amendment
    # -------------------------------------------------------------------------
    - item: ITEM-3
      subject: EXP-FROB-30006a version 1, frozen and approved 2026-09-20
      goal: GOAL-FROB-6333a9
      hypothesis: H-FROB-a5bf86
      verb: amend_additively_before_any_run_exists

      why_this_is_in_scope_at_all: >-
        Because composing EV-FROB-b6e1e9 is what surfaced it, and because
        EXP-FROB-30006a has ZERO RUNS. `experiments/EXP-FROB-30006a/runs/`
        contains only a .gitkeep, bound by that name in TASK-20260920-956d12's
        receipt. So no outcome has been observed, and the prohibition on
        changing success criteria after observing outcomes is not engaged. The
        contract's own stopping_rules already say "Any protocol change requires
        an additive amendment before further runs", and this is that, at the
        only moment it can still be done honestly.

      defects:
        - id: D1
          defect: >-
            THE WDSAT SEARCH MODE IS AN UNDECLARED FREE PARAMETER ON THE PRIMARY
            METRIC. The contract's primary metric is conflict_ratio = WDSat
            conflicts / (2^{ml}/m!). It names no search mode, does not list the
            mode among independent_variables, and defers to a sibling
            contract's "discipline" for the build. EV-FROB-b6e1e9 measures the
            mode's effect on comparable Koblitz PDP instances: XG-ext cuts
            conflicts 69x at n = 19 (5747 -> 83) and 220x at n = 23
            (148234 -> 675). A two-orders-of-magnitude knob on the numerator of
            the deciding quantity is not a build detail.
          consequence_if_unrepaired: >-
            Both verdict bins become mode-determined. `basis_blind` requires
            |r - 1| <= 0.01, a window 0.02 wide, against a knob worth a factor
            of 69 to 220; `pruning` requires r <= 0.5, which one mode could
            clear on both arms and the other on neither. The verdict would be a
            fact about which binary was built.
          checkable_basis: >-
            The absence is checkable by reading the specification: no
            occurrence of XORGAUSS, XG, or -x, and independent_variables
            enumerated without the mode. The MAGNITUDE is read from
            EV-FROB-b6e1e9 and therefore carries that record's ceiling -- which
            is why the amendment DECLARES the mode rather than asserting a
            numeric threat.
        - id: D2
          defect: >-
            THE `pruning` BRANCH NEVER CONSULTS THE RANDOM-V CONTROL. The frozen
            decision_rule reads r_r on the basis_blind branch and only r_s on
            the pruning branch. C-RAND is a declared control that the rule does
            not use where it would discriminate, so any effect COMMON TO BOTH
            ARMS -- a loose null, a mode, an instance-size artifact -- returns
            `pruning`, which is a claim specifically about Frobenius stability.
          consequence_if_unrepaired: >-
            The single most consequential positive outcome this campaign can
            produce is reachable without the control that separates it from its
            most likely confound. A `pruning` verdict on GOAL-FROB-6333a9's
            primary cell would be a positive result about Frobenius structure in
            subfield-curve index calculus, would open the branch-order follow-on
            the goal's objective names, and under AGENTS.md rule 12 a promotion
            of it as contradicting prior FROB negatives would need
            `review-breakthrough` at max. It should not be reachable by a
            control-free comparison.
          checkable_basis: >-
            Entirely a reading of the frozen text, quoted in
            verification_performed. No measurement needed and none relied on.
          why_ev_frob_b6e1e9_makes_this_live_rather_than_hypothetical: >-
            Because it measured the confound's magnitude on a factor base with
            NO Frobenius specialness at all. Under XG a plain single-shift
            baseline sat 12x and 24x below its own orbit-naive enumeration
            bound, and in plain mode the same instances sat 5.6x and 9.0x above
            it. 2^{ml}/m! is an enumeration-naive bound of exactly that kind.
            The prediction that follows is concrete: under an XOR-native mode
            both arms of EXP-FROB-30006a may sit well below 1 for reasons that
            have nothing to do with V_kind. Scope limits on that transfer are in
            transfer_assumptions below and are not glossed.

      amendment_authorized:
        id: AMD-EXP-FROB-30006a-20260922-nullcontrol
        path: >-
          experiments/EXP-FROB-30006a/amendments/AMD-20260922-nullcontrol.yaml
        kind: additive_protocol_amendment
        what_it_adds:
          - >-
            A-1 DECLARES THE SEARCH MODE as an independent variable and requires
            BOTH modes at the primary cell for every certified-UNSAT replicate,
            reported per mode. The verdict is computed per mode; a disagreement
            between modes is `inconclusive` and is never resolved by choosing a
            mode.
          - >-
            A-2 ADDS A CONTROL DIFFERENTIAL TO THE `pruning` BRANCH: pruning now
            requires r_s <= 0.5 AND r_r > 0.5 on the same mode and the same
            replicates. If both arms fall at or below 0.5 the verdict is
            `null_loose` -- a finding about the null 2^{ml}/m! and about
            HEUR-FROB-WDSAT-NULL, NOT about Frobenius stability, and not
            support for pruning in any degree.
          - >-
            A-3 ADDS r_s / r_r as a reported primary quantity beside r_s and
            r_r, because an arm-to-arm ratio is invariant to any mode-level
            rescaling of the null and is therefore the basis-sensitive number.
          - >-
            A-4 RECORDS `null_loose` AS A REAL RESULT with a forward
            obligation, not as a failure bin: it would be direct evidence
            against HEUR-FROB-WDSAT-NULL as a reference, and the heuristic is
            the contract's own declared `heuristic_under_test`.
        what_it_does_not_do:
          - >-
            It WEAKENS NO THRESHOLD. Both numeric gates are unchanged; the
            pruning branch is strictly harder to satisfy and the basis_blind
            branch is untouched.
          - >-
            It changes no cell, no seed, no curve, no dimension, no factor base,
            no certificate requirement, and no invalidation rule.
            `null_loose` is a named sub-bin of the frozen rule's existing
            "Otherwise -> inconclusive" branch, which is why it can be added
            without contradicting the rule it refines.
          - >-
            It does not rewrite experiments/EXP-FROB-30006a/specification.yaml,
            which stays frozen at version 1 and is not edited.
          - >-
            It asserts NOTHING about what the run will find, and it is not
            evidence. It is a control.
        cost_stated_plainly: >-
          Requiring both modes at the primary cell roughly doubles the primary
          cell's solver invocations. The card's declared maximum_runs is 20 and
          the primary cell needs 3 certified-UNSAT targets per arm, so the
          budget absorbs it; the ECC campaign budget is unlimited by policy and
          max_concurrent stays 1, so nothing is displaced. If the doubled cell
          exhausts wall clock or memory that is resource_exhaustion and an
          impediment, never a mathematical result and never a verdict.
        transfer_assumptions: >-
          STATED BECAUSE THE AMENDMENT RESTS ON A TRANSFER AND THE TRANSFER IS
          THE WEAK PART. EV-FROB-b6e1e9's XG figures are at n = 19 and 23, on a
          NON-LINEAR orbit union of a random subspace, at m = 2, against a
          2^{2 l'} enumeration bound with two blocks over distinct subspaces and
          no m! summand symmetry. EXP-FROB-30006a is at n = 41 and 43, on the
          LINEAR ker g(sigma) and a size-matched random control, at m = 2 and 3,
          against 2^{ml}/m!. Different object, different cells, DIFFERENT NULL
          -- the same three differences ITEM-1 refuses to let any status move
          across. THE AMENDMENT DOES NOT ASSUME THE TRANSFER HOLDS. It assumes
          only that the transfer is POSSIBLE, which is enough to justify a
          control and is nowhere near enough to justify a prediction. A control
          added against a possibility costs two solver runs; a verdict published
          on an unchecked one costs a claim.

      coordinator_prior_on_the_amended_rule: >-
        RECORDED BEFORE ANY RUN EXISTS, and distinct from the contract's own
        preregistered prior, which stands unaltered. I expect `basis_blind` on
        both modes -- unchanged from DEC-20260920-cf8ded's expectation. My
        second-most-likely outcome is now `null_loose` under the XOR-native
        mode with basis_blind under the default mode, which is a MODE
        DISAGREEMENT and therefore `inconclusive` under A-1 and not a finding in
        either direction. I consider `pruning` under the amended rule -- r_s
        <= 0.5 with r_r > 0.5 on the same mode -- the least likely of the four,
        and it is the outcome that would most change this program's direction.
        Writing that down is the point: if the run returns pruning, this prior
        was overturned and that is a more informative result than any
        concurrence.

