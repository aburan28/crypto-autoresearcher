# =============================================================================
# DEC-20260922-e9d35a -- GOAL-FROB-6333a9: compose the orphaned evidence record,
# settle its corpus entry's promotion gate, repair two pre-execution defects in
# the approved contract it bears on, and give the campaign the batch and queue
# its approved experiment has been waiting for.
#
# WHAT THIS DECISION IS. One act in two halves that are not separable. Half one
# composes EV-FROB-b6e1e9 -- merged to main with no decision behind it -- under
# the precedent DEC-20260918-4b7e21 set for records of exactly this provenance
# class, and rules on the two knowledge entries promoted from it. Half two opens
# BATCH-5286b0 so that EXP-FROB-30006a, approved on 2026-09-20 and never
# dispatchable because its goal has no queue, becomes dispatchable.
#
# WHY THEY ARE ONE ACT AND NOT TWO. Reading the composed record against the
# approved contract found two defects in the contract, both cheap, both fatal to
# its verdict, and both invisible without the record: the contract's primary
# metric divides by an enumeration-naive null whose looseness EV-FROB-b6e1e9
# measures at 12x-24x on a comparable object, and its `pruning` branch never
# consults the random-V control that would separate the two. Opening the queue
# without the amendment would have dispatched a measurement whose most likely
# positive verdict is an artifact of an undeclared solver knob.
#
# WHAT IT IS NOT. It approves no new experiment, moves no hypothesis status,
# discharges no completion criterion, promotes no knowledge entry, closes no
# lane, records no attestation, and launches no scientific trial. Zero runs.
# EV-FROB-b6e1e9 does not become citable and KN-FIND-47da4e does not become
# promoted.
#
# THE ONE THING A HURRIED READER SHOULD TAKE AWAY: EXP-FROB-30006a as frozen
# could have returned `pruning` from a solver mode. AMD-EXP-FROB-30006a-20260922-
# nullcontrol makes that outcome report as `null_loose` instead, additively,
# before any run exists. See ITEM-3.
# =============================================================================
coordinator_decision:
  id: DEC-20260922-e9d35a
  recorded_at: '2026-09-22'
  decided_at: '2026-09-22'
  decided_by: coordinator
  archived_by: TASK-20260922-0e3b58
  goal_id: GOAL-FROB-6333a9
  batch_id: BATCH-5286b0
