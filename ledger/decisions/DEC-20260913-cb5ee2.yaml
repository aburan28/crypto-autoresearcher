  ranking:
    - rank: 1
      id: EXP-SEMBIN-92724f
      authorized: true
      reason: >
        Ranked first among all available SEMBIN work on three independent
        grounds. (a) It is the only available task that bears on the EXPONENT
        rather than on a concrete crossover: every other SEMBIN result so far,
        including both completed derivations, is explicitly a crossover result
        that cannot move 2^{1.6986 sqrt(n ln n)}. docs/target-result-profile.md
        ranks exponent-moving work above logarithmic-cofactor polishing, and this
        is the first SEMBIN item that qualifies. (b) It carries its own cheapest
        refutation and runs it FIRST: arm D enumerates 2^{mk} <= 2^{17} tuples and
        can kill the whole hypothesis in seconds, so the expected cost of being
        wrong is seconds rather than the whole contract. (c) It needs no algebra
        engine, no MAGMA, and no machine headroom this host lacks -- which is now
        a confirmed constraint rather than a guess, and which is precisely what
        blocks the two degree contracts.
    - rank: 2
      id: EXP-SEMBIN-354a75
      authorized: true
      reason: >
        Already authorized under DEC-20260913-1a9c83 and in flight as
        RUN-SEMBIN-1b9afe. Retained at rank 2 rather than re-ranked: it measures
        the realized yield that both completed derivations name as the input that
        would change their reading, and it is independent of this decision.
    - rank: 3
      id: EXP-SEMBIN-c2c312
      authorized: false
      reason: >
