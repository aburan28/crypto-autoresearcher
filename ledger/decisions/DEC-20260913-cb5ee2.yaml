        (RUN-SEMBIN-1b9afe).
      finding: >
        Confirmed absent on this host: magma, sage, singular, Singular, msolve all
        missing from PATH; sympy and galois both unimportable. Additionally
        src/ic_first_fall_fast.py and src/semaev_tree.py, this program's own
        first-fall and chained-system instruments, both import sage.all, so the
        capability is missing at the instrument level and not only at the package
        level.
      clears_when: >
        Either an algebra engine is installed and probe-verified, OR the degree-4
        Macaulay closure predicate is reimplemented over bit-packed GF(2) without
        Sage. The second is genuinely available: ic_first_fall_fast.py's own
        docstring records that its monomial bookkeeping is already pure Python and
        that it uses Sage only for GF, Matrix, i.e. for GF(2) linear algebra. That
        is a scoped implementation task, not a research impediment, and it is the
        cheaper of the two routes.
      recheck: >
        `command -v magma sage singular msolve`, `python3 -c "import sympy"`, and
        `rg -n "from sage" src/` -- then, if still absent, dispatch the GF(2)
        closure-predicate reimplementation as its own contract.
      asserts_nothing_about: >
        The science. An absent engine is an infrastructure fact. It is not evidence
        about d_F4, about Assumption 1, about Assumption 2, or about whether the
        typed system's degree rises with m -- and the run authorized here is
        forbidden by its own invalidation rules from saying otherwise.
