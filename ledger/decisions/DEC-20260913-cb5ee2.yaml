  context: >
    Three things are settled by this decision, and the third is the one that
    changes the batch's shape.

    FIRST, an idea is landed. The mechanism-lane idea-generator task
    TASK-20260913-6519c9 produced IDEA-20260913-8138a0 into a coordination
    scratch directory, where it was neither a ledger record nor visible to any
    ranking. It is now landed at ledger/proposals/IDEA-20260913-8138a0.yaml
    verbatim, with its arithmetic independently checked (see the defect finding
    below). It is the strongest research content in this batch: it answers
    GOAL-SEMBIN-cbf422's central question -- which unrevisited choices carry the
    2^{1.6986 sqrt(n ln n)} exponent -- by derivation rather than by experiment,
    and it answers it in the negative for three of the goal's four
    sub-objectives.

    SECOND, the claim it makes earns a hypothesis and a frozen contract.
    H-SEMBIN-c59e50 states that the exponent constant is carried ENTIRELY by the
    m! symmetry factor of eq. (11), that a published device
    (Galbraith-Gebregiyorgis 2014/806 section 4.2 coset-typed factor bases)
    removes it at zero cost in Semaev's chained presentation specifically because
    that presentation has no symmetric coordinates for the coset shift to
    obstruct, and that the resulting collapse of the optimisation forces a
    quantified lower bound on the solving degree which contradicts Semaev's own
    Assumption 2 by a constant factor. EXP-SEMBIN-92724f freezes the part of that
    which is testable without an algebra engine, and is approved and authorized
    for execution.

    THIRD, DEC-20260913-1a9c83's last next_action was "confirm whether a Groebner
    or Macaulay engine is available in this environment". IT IS NOT. The
    Coordinator checked directly: no magma, sage, singular, Singular or msolve on
    PATH, and no sympy or galois importable. Worse and more specifically, this
    program's OWN first-fall instruments -- src/ic_first_fall_fast.py and
    src/semaev_tree.py -- both begin `from sage.all import ...`, so the
    degree-measuring capability the two withheld contracts assume is absent at
    the instrument level and not merely at the package level. That is recorded
    below as an impediment against GOAL-SEMBIN-5078bc rather than as a status
    change, and it is categorically not evidence about any degree.
