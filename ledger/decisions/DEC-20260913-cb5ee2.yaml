    - ref: KN-LIT-439
      provenance: retrieved
      claim: >
        Galbraith-Gebregiyorgis 2014/806 section 4.2: coset-typed factor bases
        F_i = {P : x(P) in V + v_i}, no 1/m! in the sum count, net speedup
        (m-1)! because m times as many relations are needed, stage-2 linear
        algebra up by m^2, and an obstruction tied explicitly to symmetrised
        coordinates.
      verified_by: >
        coordinator, 2026-09-13; fetched https://eprint.iacr.org/2014/806.pdf,
        extracted its text, froze both under inputs/GG-2014-806/ with sha256
        receipts, and quoted the four load-bearing passages verbatim in
        inputs/GG-2014-806/PROVENANCE.yaml
      provenance_note: >
        This entry was `recalled` when the contract was drafted: KN-LIT-439 has
        carried `confidence: reported` since a 2026-07-24 bulk seeding pass that
        read two pages, and its "Local copies" path does not exist in this
        checkout, so the one paper supplying the device that removes eq. (11)'s
        m! was uncheckable here. The Coordinator therefore fetched and read it
        rather than relay it, and the entry is `retrieved` on that read. Two
        things the read changed: the net speedup is (m-1)! and NOT m! -- quoting
        m! overstates the gain by a factor m -- and GG's own obstruction is tied
        to symmetrised coordinates, which is exactly the property Semaev's
        chained presentation lacks and hence the hinge of H-SEMBIN-c59e50. The
        three GG substitutions are load-bearing, so this is still the citation a
        reviewer should check first, now against a frozen copy.
  limitations:
    - >
      Approving a protocol and authorizing execution asserts protocol completeness
      and ranking. It asserts nothing about whether H-SEMBIN-c59e50 is true, and
      it is not evidence for anything.
    - >
      NO DEGREE IS MEASURED OR CLAIMED anywhere under this decision, and HEUR-A1T
      is carried as an explicitly unvalidated premise. The deciding measurement is
      unreachable on this host and is recorded as impeded.
    - >
      NO EXPONENT IMPROVEMENT IS CLAIMED. The polynomial-time branch is a reductio
      against a premise, not a result. A summary of this decision that reads as
      "ECDLP in n^{14}" is wrong.
    - >
      The Coordinator has NOT read Galbraith-Gebregiyorgis 2014/806 directly. The
      three substitutions the typed arm rests on are taken from the
      idea-generator's retrieved reading of it, which is a stronger provenance than
      recollection but is one session's reading, and it is the first thing an
      independent reviewer of this contract should re-check.
    - >
      Diem's use of different factor bases was NOT chased and is named in the
      proposal as the single most likely place for closer prior art. If it already
      composes a typed factor base with an auxiliary-variable presentation and
      derives the degree consequence, novelty drops to `known` and the
      contribution reduces to the quantitative bound.
    - >
      Nothing here bears on the security of any deployed curve, in either
      direction.
  next_actions:
    - >
      Execute EXP-SEMBIN-92724f under TASK-20260913-80bae1. RUN ARM D FIRST: it is
      the seconds-long refutation and the contract's stopping rules require it
      before the expensive arms.
    - >
      Honour the two matched nulls literally. The degenerate typing
      v_1 = ... = v_m must return image-size ratio EXACTLY 1 and a cost surface
      identical to the untyped arm; anything else means the pipeline is producing
      the typed effect by itself and the whole run stops.
    - >
      Run both proves-too-much nearby objects. An argument that also collapses
      Galbraith-Gebregiyorgis's symmetrised presentation, or Trimoska et al.'s
      search-side setting, to polynomial time has proved too much and is wrong.
    - >
      Re-derive all three typed stage-1 saving figures and report the corrected
      n = 283, m = 8 value. Do not edit IDEA-20260913-8138a0.
    - >
      Snapshot-archive before any independent review reads the run, and write no
      evidence record from the executing session.
    - >
      Then dispatch the GF(2) degree-4 closure-predicate reimplementation as its
      own scoped contract. That is the cheaper of IMP-SEMBIN-ENGINE's two clearing
      routes and it unblocks the entire degree lane, including the deciding
      measurement for this hypothesis.
