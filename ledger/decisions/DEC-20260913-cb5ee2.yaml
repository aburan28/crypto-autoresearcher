  rationale:
    - >
      STANDING USER AUTHORIZATION of 2026-09-06 covers the approval; protocol
      readiness is the Coordinator's responsibility and was checked here.
      EXP-SEMBIN-92724f carries eight controls (a Table 3 baseline requiring
      symbolic recovery of c' and not merely a numeric fit; TWO matched nulls, the
      degenerate typing v_1 = ... = v_m and a shuffled-type arm; two known-false
      objects including the subset-sum corner where the formula MUST return a
      polynomial because that return is the reductio; a representation control
      separating additive cosets from multiplicative translates; four
      invalid-input rejects; and an exhaustiveness control by two independent
      orderings), five seeds, 20 coset draws per cell, declared per-cell budgets,
      invalidation rules that void a non-exhaustive cell rather than downgrade it,
      and a success criterion satisfiable by EITHER answer.
    - >
      THE COORDINATOR RE-DERIVED THE LOAD-BEARING ARITHMETIC BEFORE APPROVING,
      rather than approving a claim it had only read. Confirmed exactly: writing
      m = c' sqrt(n / ln n), the stage-1 coefficient c'/(2 ln 2) + 1/c' and the
      stage-2 coefficient 2/c' are EQUAL at c' = sqrt(2 ln 2) = 1.177410, both
      equalling 1.698644, which is Semaev's c to every printed digit; the
      required-degree floor coefficient (c ln 2)/(2 omega) is 0.19624 at omega = 3
      and 0.24777 at omega = 2.376, matching the proposal's 0.196 and 0.248; the
      floor at n = 571 is 1.861, which the proposal correctly reports as BELOW
      Assumption 1's 4; the floor reaches 4 at n ~ 3400 (4.012 at n = 3400); and
      the n^{4 omega} cofactor at n = 571, omega = 3 is 2^{109.9} against Table
      3's stage-2 2^{94.8}, so the cofactor genuinely exceeds the term it is
      balanced against.
    - >
      ONE ARITHMETIC DEFECT WAS FOUND AND IS RECORDED RATHER THAN FIXED.
      IDEA-20260913-8138a0's sota_delta.conditional_delta quotes the typed stage-1
      saving as "25.25 bits at n = 571, m = 12; 21.8 bits at n = 571, m = 11; 15.3
      bits at n = 283, m = 8". The claim is log2((m-1)!), and the first two figures
      are exactly that (log2(11!) = 25.250, log2(10!) = 21.791). The third is
      log2(8!) = 15.299, i.e. log2(m!); log2((m-1)!) = log2(7!) = 12.299. One of
      three illustrative figures therefore quotes the wrong factorial. This does
      NOT touch the (C1) derivation, which was re-derived independently above and
      is exact, and it does not change any conclusion of the proposal. It is
      recorded because a figure that mixes m! with (m-1)! is precisely the slip
      that propagates into a cost table, and because the proposal is now an
      immutable record: the correction lives in H-SEMBIN-c59e50's interpretation
      limits and in the contract's known_defect_to_resolve, and the contract
      re-derives all three figures from scratch.
    - >
      ECC FIRST. SEMBIN is a declared ECC area in
      orchestration/research-priority.yaml, read through tools/ecc_priority.py
      rather than inferred from the prefix, so both goals carry null batch and
      wall-clock ceilings. Instruction 3 of the ECC policy is the operative one
      here: an open ECC idea -- one whose proposal is `proposed` and which no
      hypothesis or experiment references -- is RANKED WORK to be designed into an
      experiment, not shelved. IDEA-20260913-8138a0 was exactly that, and this
      decision discharges the obligation by designing it. Unlimited budget removes
      the ceiling and not the duty to rank, which the ranking block discharges.
    - >
      WHY THE DEGREE ARM IS SPLIT OFF RATHER THAN WEAKENED. The proposal's own
      minimal_test recommends the split, and the engine check forces it. The
      deciding measurement for this hypothesis is whether the typed solving degree
      rises with m while the untyped one does not -- outcome (A), the m! being
      CONSERVED and exchanged from probability into degree -- versus tracking it,
      outcome (B), which would make the conditional exponent improvement live at
      the tested scale and would require review-breakthrough at max in its own
      independent round. Neither outcome is reachable on this host. The honest
      response is to carry HEUR-A1T as an explicitly unvalidated premise and to
      forbid the contract from asserting any degree, which its invalidation rules
      do by name -- including forbidding a statement that a degree is PLAUSIBLY 4.
      Substituting an unmeasured degree for a measured one to get the claim moving
      is the silent downgrade the policy layer forbids.
    - >
      WHY THIS IS NOT ESCALATED TO review-breakthrough NOW. The hypothesis asserts
      a dichotomy and an inequality, not a breakthrough: its unconditional content
      is a necessary condition on a degree, and its polynomial-time branch is
      offered as a reductio against a premise nobody believes. Escalation becomes
      mandatory the moment a run reports outcome (B) -- typed and untyped degrees
      tracking each other over a reachable range -- because that would be a
      conditional exponent improvement on a central hard problem. This decision
      does not authorize that round, and no run under it can produce that outcome,
      because no degree is measured.
    - >
      SCOPE, RECORDED BEFORE ANY RESULT EXISTS. Arms A and C are derivations and
      carry no scale. Arm D is toy: n <= 17, chosen so the image can be COUNTED
      rather than estimated, because at small mk - n a sampled image size has
      variance comparable to the effect and sampling is the cheapest way to
      manufacture a discrepancy that is not there. The measured magnitude of the
      image-size ratio is claimed only over the enumerated cells. No claim about
      the security of any deployed curve, in either direction, follows from any of
      it.
