coordinator_decision:
  id: DEC-20260806-8f7e4f
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-9c41dd
  recorded_by_task: TASK-20260806-636e61
  archived_by: TASK-20260806-636e61

  context: >-
    BATCH-9c41dd refilled the ECDLP candidate pool under a mandatory
    duplication audit and froze one contract, EXP-ICEX-146ff5, converting
    IDEA-20260803-fa9839 into an executable object intended as the zero-compute
    exit from the ICEX/SDEG/RELN/SIG/MONO deferral deadlock. The independent
    red team (TASK-20260806-7e7ce3, review-adversarial, independent session)
    returned four CRITICAL findings, five MAJOR, six MODERATE and three MINOR.
    Two CRITICALs were reproduced by the dispatcher at source.

  decision: reject_pending_repair

  decision_scope: >-
    This decision governs the admissibility of five proposals and the execution
    authorization of one frozen contract. IT DECIDES NOTHING ABOUT PRIME-FIELD
    ECDLP. No hypothesis status moves; H-STR-002 and every other live
    hypothesis under this goal keep their current status. No measurement was
    taken.

  target_ids:
    - EXP-ICEX-146ff5
    - H-ICEX-9e54c2
    - IDEA-20260806-3b91c7
    - IDEA-20260806-9d47e2
    - IDEA-20260806-7ea402
    - IDEA-20260806-c5d183
    - IDEA-20260806-20f6ab

  evidence_ids:
    - EV-ICEX-2be32e

  rationale:
    execution_authorization:
      granted: false
      reason: >-
        F-1: the contract cannot execute to an output. GATE-A arm A3's second
        clause uses B*^2 where the identity requires B*^omega; these agree only
        at omega = 2 and the arm's own grid spans 1.90 to 2.40. INV-GATE fires,
        the run set is completed_invalid, and ST-2 forbids in-flight repair.
        Dispatching it would spend budget to produce nothing.
      second_reason: >-
        GATE-A performs ZERO external calibration. Reproducing a known
        exponent was the entire justification for selecting this proposal and
        for the batch objective as written. An internal-consistency check
        wearing the name of a calibration gate is the failure mode this batch
        was constructed to avoid, and it recurred inside the artifact meant to
        avoid it.
      third_reason: >-
        The contract is NOT zero-compute: it declares 5 runs and 0.25 CPU-hours
        and CTRL-NULL emits measured means. Both the batch objective and the
        routing argument in favour of running it here rested on it being a pure
        derivation. That premise is false.

    routing_unresolved:
      finding: >-
        DEC-20260805-bb162b already declined IDEA-20260803-fa9839 for
        GOAL-ECDLP-001 and routed it to GOAL-ICEX-001. The reviewer finds the
        ICEX deferral is on MEASUREMENT and would not bar a zero-compute
        derivation -- but that this contract is not one, so the exemption does
        not apply to it. The reviewer further finds revisit condition R-D NOT
        SATISFIED on its own text: four of five items are charged, rank is
        declared-omitted, and no successor IDEA record exists.
      disposition: >-
        The homing question is NOT settled by this decision and must not be
        settled by this goal alone. GOAL-ICEX-001 owns the record that declined
        it. The successor batch must either satisfy R-D and re-present, or
        route the repaired contract to GOAL-ICEX-001 for that goal's
        Coordinator to admit. The dispatcher notes that opening this contract
        under GOAL-ECDLP-001 over a standing decline was its own error of
        sequencing, made before DEC-20260805-bb162b was discovered.
      cheap_discharge_named: >-
        The reviewer names IDEA-20260805-061f97's fixed point x = 1 - e^{-mx}
        as a cheap discharge route, resolving to a constant factor and
        therefore exponent-neutral.

    proposal_admissions:
      - id: IDEA-20260806-9d47e2
        verdict: admitted
        basis: >-
          No duplication or screen finding. Passes screen 2 by using
          KN-FIND-c41ea9's theorem as a premise rather than proposing a
          forbidden measurement; the reviewer agrees with that placement while
          noting the citation is not load-bearing for its headline.
      - id: IDEA-20260806-c5d183
        verdict: admitted_with_qualification
        basis: >-
          Its orbit theorem is correct. Its EXHAUSTIVENESS claim is not: the
          reviewer finds approximate equivariance is an unlisted fourth class.
          The three-class index set may not be cited as complete until that is
          resolved.
      - id: IDEA-20260806-20f6ab
        verdict: admitted_with_qualification
        basis: >-
          Honest about being subpolynomial in its own title, which is correct
          practice. But it books its C(m,m/2) gain on the wrong axis: build
          cost is unchanged and the join is already Theta(m!) at its operating
          point, so the time gain is zero rather than ~1 bit. The gain claim is
          withdrawn; the object is retained.
      - id: IDEA-20260806-3b91c7
        verdict: novelty_framing_refuted_comparator_question_retained
        basis: >-
          knowledge/literature/KN-LIT-013.md, the source_ref of KN-TECH-005,
          already states that a construction achieves S*T^2 ~ N and that with
          advice the online cost can beat the classic sqrt(N) bound. The
          dispatcher confirmed the text at source. The proposal's presentation
          of this as a gap in the corpus is REFUTED. Its underlying comparator
          question is not thereby answered and is retained. Its sigma = 0
          calibration is a genuine known-answer edge but is NOT discriminating,
          since Shoup's rival law passes it identically; sigma = 1/3 is the
          discriminating point.
      - id: IDEA-20260806-7ea402
        verdict: refuted
        basis: >-
          Claim (A) computes the degree jump as C(n,D+1)/C(n,D) = 6/7 < 1 while
          defining cost through the CUMULATIVE ncols(D). The cumulative ratio
          at n=12, D=6 is 3302/2510 = 1.3155, giving a jump of 1.731 at
          omega = 2: cost RISES. The record's own sota_delta field already
          states J(12,6) = 1.731, so the proposal is refuted by a number it
          carries itself. Separately its "4.5% of a gap of 24,621" is 28.9%,
          verified at source in EV-SIG-008.

    audit_debts_were_material:
      - >-
        The producer's audit reached 262/262 and 64/64 coverage and disclosed
        two debts. BOTH were material. The 40-file cap on the knowledge/ grep
        concealed KN-LIT-013 and thereby F-3. Reading EV-SIG-008 via the
        committed synthesis rather than at source produced the
        4.5%-versus-28.9% error. This is recorded because a disclosed limit is
        not a discharged one, and because the batch instruction that mandated
        the audit is what made the disclosure available to check.

    dispatcher_error_recorded: >-
      This batch's task card stated "numpy is present". The dispatcher asserted
      that without checking; numpy and sympy are both absent in this
      environment. The specification's dependency verification is wrong
      downstream of that instruction. Recorded as the dispatcher's error.

  next_actions:
    - >-
      SINGLE NEXT ACTION FOR GOAL-ECDLP-001: open a successor batch that
      repairs EXP-ICEX-146ff5 as a VERSIONED SUCCESSOR CONTRACT, never an edit,
      and that resolves homing BEFORE design. The repair must (a) correct
      GATE-A arm A3 to B*^omega, (b) reconcile the zero-tolerance requirement
      with an arithmetic backend that can meet it at non-integer omega,
      (c) supply GATE-A with a genuine EXTERNAL calibration or stop calling it
      one, (d) apply the d <= omega/(m-1) clause only in the region where it is
      derived and re-derive the window accordingly, (e) couple D_trial to B,
      and (f) either satisfy R-D and re-present to GOAL-ECDLP-001, or route to
      GOAL-ICEX-001 whose committed decision declined it.
    - >-
      The reviewer's corrected window (monotonically increasing, 5/14 .. 5/12
      at m = 7..12) is ONE SESSION'S DERIVATION and is not adopted here. The
      successor must derive it independently rather than inherit it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing was measured and no evidence record rises above claim_tier
      not_applicable. There is nothing to promote. The observation that both
      disclosed audit debts turned out to be material is a candidate
      methodological finding, but one batch is not a pattern; revisit against
      KN-FIND-029 and KN-TECH-1a5b7e if the successor batch reproduces it.

  claim_ceiling: >-
    Nothing in this batch may be cited as evidence about prime-field ECDLP,
    index calculus, the arity threshold, or any solving degree. Five proposals
    and one non-executing contract exist. The strongest true statement is that
    an independent review found the contract unable to reach an output, its
    calibration gate uncalibrated, and two of five proposals refuted -- one by
    a committed record its own audit's capped grep concealed.

  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-ICEX-146ff5
      from: approved
      to: approved_execution_withheld
      note: >-
        The specification remains a committed frozen artifact and its approval
        as a specification is not revoked, which would rewrite an immutable
        record. Execution authorization was never granted and is now formally
        withheld. The successor contract supersedes it.

  asymptotic_promotion_gates:
    gate_1_proof_decomposition: partial
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: >-
      Open, and the reviewer itemizes terms omitted or charged at zero,
      including the D_trial/B decoupling. GOAL-ECDLP-001's objective requires
      all of preprocessing, relation collection, linear algebra, target
      descent, verification, memory and multi-target accounting.
    gate_4_independent_review_and_red_team: >-
      A red-team pass occurred and returned four CRITICAL findings. An adverse
      review is not a satisfied gate.
    note: >-
      No asymptotic-complexity claim is advanced by this batch. Gates recorded
      open, not failed.

  decided_by:
    task: TASK-20260806-636e61
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-06'
