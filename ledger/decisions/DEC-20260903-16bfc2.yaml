coordinator_decision:
  id: DEC-20260903-16bfc2
  context: >-
    User authorization, verbatim, 2026-09-03: "can we please open up the rules
    for this to not require certain models to run each role?" followed by "we
    are spending more time waiting than actually experimenting". Presented
    with the three-layer relaxation menu, the user selected ONE: "Lower effort
    floors" — research-deep and review-adversarial drop their fixed effort
    FLOORS so any resolvable backend may serve them, with the actual effort
    recorded on every receipt. NOT selected (and therefore not done): making
    web tools optional in the idea-generator/red-team role surfaces, and any
    change to the review-breakthrough gate. The fourteen-session background:
    the native opencode subagent runtime has been balance-blocked since
    2026-08-30, and effort ceilings/floors were the second-largest source of
    refused dispatches (after billing), leaving ideation and review rounds
    unrunnable even on backends that were up.
  decision: approve
  semantic_disposition: USER_AUTHORIZED_EFFORT_FLOOR_RELAXATION_RECORDED_NOT_SILENT
  target_ids:
    - orchestration/model-policies.yaml
    - orchestration/model-bindings.yaml
    - tests/test_inference_adapter.py
  what_changed:
    - >-
      model-policies.yaml: research-deep requires.reasoning_effort floor
      high -> low; review-adversarial requires.reasoning_effort floor
      xhigh -> low. The per-call REQUESTED efforts (research-deep: high,
      review-adversarial: xhigh) are UNCHANGED: capable backends still run at
      the calibrated depth; weaker backends serve at their ceiling with the
      cap recorded (reasoning_effort_capped) on every receipt — never silent.
      All other capability requirements (tool_use, structured_output,
      min_context_tokens, min_output_tokens) unchanged.
      review-adversarial's independent_session_required: true UNCHANGED —
      independence, not tier, is the load-bearing part of review integrity.
      review-breakthrough UNTOUCHED: still requires max, still
      degradable: false, still the one gate for claimed breakthroughs,
      closures, and contradictions.
    - >-
      model-bindings.yaml, fireworks backend: bound coordinator-orchestration
      code and review-adversarial to the probe-listed
      accounts/fireworks/models/glm-5p3 (listed by `adapter models --backend
      fireworks`; in live use by dispatching sessions since 2026-08-31), and
      RESTORED the 2026-08-31 executor-implementation binding (commit
      7e63b0f91) which never reached main — PR 648 merged before that commit
      was pushed, so main has been silently missing the config the last two
      executor dispatches actually ran on (TASK-20260810-2a0a37,
      TASK-20260824-c6625a). glm-5p3's declared ceiling is high: an exact
      match for coordinator-orchestration-code (no cap), and a recorded cap
      for review-adversarial's xhigh request. All other fireworks policies
      remain unbound; fireworks-anthropic remains fully unbound.
    - >-
      tests/test_inference_adapter.py: the degradation-permission machinery
      tests now pin their zai fixture at `none` (the one tier below the
      relaxed floor) instead of `high` (which sat below the old xhigh floor)
      — the machinery under test is unchanged, only the fixture moved; the
      fireworks no-invented-ids invariant stays narrowed to what it protects
      (bound ids must be probe-dated and operator-declared; anthropic-wire
      stays fully unbound). 68/68 pass; check_runtime_bindings consistent.
  verification: >-
    Live dispatch probe after the change: TASK-20260824-c40847 (validator,
    DIFFP BATCH-f8bf86) resolves as `review-adversarial ->
    fireworks:accounts/fireworks/models/glm-5p3 (effort=high, CAPPED from
    xhigh)` — the cap is recorded in the resolution line itself, which is the
    design working, not a defect.
  claim_boundaries:
    - >-
      This decision asserts nothing about any research question. It changes
      inference plumbing and its tests only. No hypothesis, goal, experiment,
      or evidence status moves.
    - >-
      What was NOT relaxed stays on record: the web-tool role surfaces for
      idea-generator and red-team (not selected by the user — those roles
      remain native-runtime-only, still balance-blocked for this session);
      review-breakthrough's max floor and degradable: false; the
      recording duties (requested policy, resolved model, every cap and
      fallback) — those are the audit trail and they are why "relaxed" here
      still means "honest".
  next_actions:
    - >-
      Immediately servable by this session's runtime: executor,
      validator, and coordinator-policy tasks on the fireworks binding.
      The DIFFP validator TASK-20260824-c40847 remains gated by its batch's
      own dependency chain (snapshot TASK-20260824-be7bbc waits on
      idea-generator TASK-20260824-873dc9, web-blocked), so the new
      capability applies to the next batch that offers such tasks. If the
      user later selects the web-optional relaxation, idea-generator and
      red-team become servable here too.
  knowledge_promotion:
    promoted: []
    not_warranted:
      - an inference-plumbing change asserts nothing research-relevant
  decided_by: >-
    Coordinator session 2026-09-03 (bus address coordinator-aes2-3, worktree
    .worktrees/aes-002-b2b0fd1-20260831 on branch
    policy-effort-floor-relaxation-20260903), model
    accounts/fireworks/models/glm-5p3 via the session runtime, executing the
    user's verbatim authorization recorded above.
  owner: coordinator
  created_at: "2026-09-03"
