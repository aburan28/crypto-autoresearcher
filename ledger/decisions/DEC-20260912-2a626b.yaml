coordinator_decision:
  id: DEC-20260912-2a626b
  context: >-
    /review-evidence for EXP-ECDLP-e36df2 (TASK-20260912-85eb3e): deciding
    H-ECDLP-09125b, the resolution-matched, degeneracy-screened repair of
    H-ECDLP-6a9479 claim (3), after an independent blind rederivation of the
    pooled k/mu0/rho_hat for s_x, s_y, s_rand from the 24 raw-result.json
    files (before consulting pooled-summary.json, per the handoff's
    blind_from list), an independent hand-check of the exact-Poisson CI
    construction, an independent third spot-check of the chi-square
    periodicity explanation, and direct confirmation of both proves_too_much
    objects from raw artifacts, recorded in
    experiments/EXP-ECDLP-e36df2/analysis.md.
  decision: support
  target_ids: [H-ECDLP-09125b, EXP-ECDLP-e36df2, EV-ECDLP-5b61eb]
  rationale:
    - >-
      A. Instrument validity confirmed first, independent of the claim-3
      verdict: Stage 0's blocking regression gate shows 0/1340 mismatches
      (stage0_regression_transcript.json: total_checked=1340,
      total_mismatch=0, passed=true); the positive-control curve's known,
      certain m=2 coincidence is flagged by the cross-prime x-screen on 4/4
      of its primes (confirmed directly from frozen_positive_control_curve.json's
      4 listed primes against RUN-ECDLP-e36df2-021..024's own
      flagged_x_degenerate_m fields, not merely pooled-summary.json's summary
      field); and s_rand's 95% CI [0.9817,1.1693] contains 1 (the
      method-only null object shows no inflation). Neither proves_too_much
      failure signature (s_rand CI excluding 1; screen blind to the
      engineered coincidence) fired.
    - >-
      B. The repaired statistic is genuinely decidable and independently
      re-derived: a blind hand rederivation of pooled k and mu0 from the 24
      raw-result.json files' n_agree/mu_0_i fields, performed before reading
      pooled-summary.json, exactly reproduces k_x=487, k_y=471, k_rand=514
      and mu0 to displayed precision (479.278/479.279), giving
      rho_hat_x=1.0161 (CI [0.9279,1.1105]), rho_hat_y=0.9827 (CI
      [0.8960,1.0756]), rho_hat_rand=1.0724 (CI [0.9817,1.1693]) -- an exact
      match, not merely a plausible-looking one. The CI construction itself
      was separately hand-verified as a legitimate exact-Poisson (Garwood)
      interval via the chi-square/gamma-quantile relationship (Wilson-Hilferty
      approximation) on s_x's main pool, matching the reported bounds to the
      approximation's own precision.
    - >-
      C. specification.yaml's success_criterion outcome (1) SUPPORTED's four
      named conditions -- Stage 0 passes; positive control 4/4; s_rand CI
      contains 1; both rho_hat_x's and rho_hat_y's CIs contain 1 and exclude
      any value >=3 -- all hold on direct inspection of raw artifacts,
      independent of the executor's or design_note.md's own classification.
      Both s_x and s_y agree in verdict (not a split), and the mu0_target=40
      sensitivity check on curve_idx=1 reproduces the same qualitative
      verdict (all three sections' CIs contain 1, none near 3), satisfying
      this campaign's tail-consistency requirement for a heuristic
      validation (H1, H2).
    - >-
      D. The chi-square diagnostic's large statistic-to-dof ratios are a
      named, mechanistically explained artifact (period-n periodicity of
      d(s_x(mS)), not a defect and not a finding against H1), independently
      re-confirmed by this review on a THIRD instance beyond design_note.md's
      own two spot-checks (curve_idx=2, p=7487, n=413: chi-square/dof ratio
      359.92 vs. N_i/n-predicted 360.66, within 0.21%, well inside the ~15%
      tolerance the review_plan's breaking_artifact allows). This does not
      affect the primary rho_hat statistic, which does not share the short
      period, per design_note.md section 4c's argument (unchanged by this
      review, independently spot-checked here).
    - >-
      E. Strength is `strong`, not `replicate`, per
      docs/evidence-and-reproducibility.md's hierarchy ("Predefined
      protocol, adequate controls, multiple instances, retained artifacts,
      and stable effect"): the protocol (N_i formula, exclusion rule,
      falsification bar) was frozen before any data were examined; two
      distinct instrument-validity controls (s_rand, positive control) both
      pass; 24 (curve,prime) instances plus a full independent re-run
      sensitivity check; all raw artifacts retained; and the null effect is
      stable across two independently coded contrast sections (s_x, s_y)
      agreeing with each other and with the null control, at both
      mu0_target=20 and mu0_target=40. This is a well-controlled null/
      absence-of-effect result matching the theoretical prediction
      (KN-TECH-73630e's uniqueness theorem), triangulated by two independently
      realized sections plus a null control plus a positive control plus a
      sensitivity check all agreeing -- not a surprising positive finding
      that would instead warrant `replicate`.
    - >-
      F. Claim tier and scope discipline: toy throughout (6 curves, 24
      (curve,prime) instances, m ladders to N_i=ceil(20*p_i)); no attack, no
      exponent claim anywhere, consistent with H-ECDLP-09125b's own scope and
      with H-ECDLP-6a9479's "NO ATTACK, NO EXPONENT MOVED". This decision
      does not reopen, modify, or supersede H-ECDLP-6a9479, EV-ECDLP-95ec68,
      or DEC-20260911-74c9dc, all left immutable; it discharges the carve-out
      those records named by deciding the new, repaired H-ECDLP-09125b on its
      own evidence.
  evidence_refs: [EV-ECDLP-5b61eb]
  limitations:
    - "Toy tier; 6 curves, 24 (curve,prime) instances, primes in [2^10,2^14); no transfer to cryptographic scale is claimed or implied."
    - "A null result consistent with, not a new proof of, KN-TECH-73630e's uniqueness theorem; the theorem remains assumed, not re-derived."
    - "Single-reviewer coordinator review (no mutual blindness); mitigated by a genuine blind_rederivation performed before consulting pooled-summary.json, matching it exactly, per the same precedent and mitigation as TASK-20260911-6bf4f9."
    - "The Stage 3 falsification-bar wording ambiguity (point-estimate>=3 vs. CI-lower-bound>=3) is recorded in design_note.md and not resolved here; both readings happen to agree in this run, but a future run closer to the boundary would need a protocol amendment first."
    - "H-ECDLP-6a9479's own status, statement, and status_note remain immutable and unaffected; this decision concerns H-ECDLP-09125b only."
  next_actions:
    - >-
      Administrative: mint a KN-FIND-* id (this dispatch has no
      allocate_id/Bash tool) and wire it into this decision's
      knowledge_promotion.promoted field, and into knowledge/findings/, before
      the ledger archive commit -- per the same pattern as
      DEC-20260911-74c9dc's own next_actions.
    - >-
      Proposed KN-FIND content (for the dispatching session to mint and
      file): TITLE "Repaired Teichmuller non-homomorphic contrast (claim 3)
      reads as chance at toy scale, closing the EXP-ECDLP-a26bde carve-out".
      TAGS [ECDLP, toy-scale, non-homomorphic-section, teichmuller-lift,
      statistical-control, null-result, degeneracy-screen]. CONTENT: After
      removing a mathematical tautology (m=1) and a named, proven
      root-of-unity degeneracy (a cross-prime screen excluding any tested
      multiple whose x- or y-coordinate is universally +-1) from
      H-ECDLP-6a9479 claim (3)'s test design, and matching the per-instance
      sample size to the effect size the test claims to resolve
      (N_i=ceil(20*p_i), power>=0.90 for a 3x-chance effect at alpha=0.01),
      two independently realized non-homomorphic contrast sections (a
      Teichmuller-x/Hensel-y section and a symmetric Teichmuller-y/Hensel-x
      section) both read as chance across 24 toy (curve,prime) instances (5
      original curves + 1 engineered positive control): pooled
      rho_hat_x=1.016 (95% CI [0.928,1.110]), rho_hat_y=0.983 (95% CI
      [0.896,1.076]), both excluding any value >=3. A null-object control
      (seeded pseudorandom digit, zero structure by construction) also reads
      as chance (rho_hat_rand=1.072, CI [0.982,1.169]), ruling out a
      method-level inflation; an engineered curve with a known, certain m=2
      coincidence (doubling slope exactly 1) is caught by the screen on 4/4
      of its primes, confirming the screen excludes only the named
      degeneracy class and is not blind to it. A large chi-square
      goodness-of-fit statistic seen in this design is a mechanistically
      explained, non-load-bearing artifact of point order n being much
      smaller than the per-instance sample size N_i (the tested digit is
      exactly periodic in m with period n, not p), verified on 3 distinct
      instances to track N_i/n within ~15%. TOY SCALE ONLY; consistent with,
      not a proof of, KN-TECH-73630e's uniqueness-of-homomorphic-section
      theorem; no attack, no exponent claim. Cites: H-ECDLP-09125b,
      EXP-ECDLP-e36df2, EV-ECDLP-5b61eb, DEC-20260912-2a626b,
      KN-TECH-73630e, and (as the carve-out this discharges) H-ECDLP-6a9479 /
      EV-ECDLP-95ec68 / DEC-20260911-74c9dc / KN-FIND-85845f.
    - >-
      This experiment's Stage-3 falsification-bar wording ambiguity (noted
      in design_note.md section 5) should be resolved by a versioned
      protocol_amendment before any future re-run of this design is used to
      decide a case closer to the 3x boundary.
  knowledge_promotion:
    promoted: [KN-FIND-e8cfdc]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-09-12'
