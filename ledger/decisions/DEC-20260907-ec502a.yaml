  rationale:
  - >-
    1. VALIDITY BEFORE INTERPRETATION, AND THE VALIDITY DETERMINATION IS SPLIT.
    Against the five checks agents/coordinator.md responsibility 6 requires, the
    package PASSES on expected run count, on schema-complete manifests, on seed
    integrity and on raw-versus-summary agreement, and FAILS on control
    comparability. Concretely, the snapshot verifies 60 of 60 path hashes with
    the working tree byte-identical to the snapshot commit; all eight manifests
    are schema-complete with all five companions and matching source digests; no
    seed anywhere is derived; there are ZERO numeric disagreements between the
    execution report and the raw records; the exact op boolean matches
    recomputation in 8 of 8 runs. THE PACKAGE IS RECEIPT-VALID AND
    CONTROL-INVALID. That is a real result and it is recorded as one, since it
    is the standard the predecessor needed a repair run to reach.
  - >-
    2. THE FROZEN RULES DECIDE THE DISPOSITION, AND THEY DECIDE IT IN FOUR STEPS.
    (i) invalidation_rules, IV-1 failure voids ALL runs of this experiment, and
    IV-1 is not satisfied against its frozen text, since at n equals 8 three of
    eight aggregate totals are 5, 6 and 6 against a required 7 under the only
    reading with operational content, and at n equals 6 no certified total was
    produced at all. (ii) falsification_criterion F4_controls, a control failure
    closes NOTHING about the mathematics and the affected runs are VOID, per core
    rule 3. (iii) success_criterion applied mechanically, G2 is not met because
    IV-8 fails on both branches, its untested statement living only in the
    execution report while IV-8 requires the RUN RECORD to carry it; G4 fails
    because R6 is vacuous, R7 is not satisfied and R8 never ran; G3 is reported
    but is not the contracted quantity; and G1 clauses are literally met by the
    recorded R2 numbers, in-box fraction 1.0 over 24 of 24 draws and planted
    meets of 3, 3 and 4 each at least 1 against expected 5.0, which is RECORDED
    RATHER THAN DROPPED per core rule 8 and is NOT read as satisfied because
    IV-1 voids R1 and R2 with the rest. (iv) Therefore the recorded numbers
    cannot separate the hypothesis that the prescribed-square construction
    genuinely exhibits certified n equals 6 instances above the draw-route rate
    from the hypothesis that the recorded 28 are an artifact of an uncontrolled
    path. That is the definition of inconclusive.
  - >-
    3. WHY EACH OTHER DISPOSITION IS UNAVAILABLE, STATED SO THE CHOICE IS
    AUDITABLE. SUPPORT is unavailable on the frozen text, since G2 and G4 fail
    and IV-1 voids, and unavailable on the review architecture, since the plan
    own proves_too_much failure signature clauses (b) and (c) both trigger and
    the plan says that means the round fails AS A REVIEW OF THE COUNTED RESULT.
    WEAKEN and REJECT_SCOPED are FORBIDDEN, not merely unsupported. The only
    adverse-looking facts are the zeros of R6, R7 and R8 and the zero of R5;
    two of those are theorems about the control objects and the third is a
    declared counted-op exhaustion at b_index 666 of 10000 which the frozen
    stopping rules make inert in both directions. Core rule 3 and F4_controls
    both forbid reading any of them as negative mathematical evidence, so THERE
    IS NO ADVERSE CALL TO MAKE and the obstruction and resource_check gate that
    would govern one is filled on EV-ECRANK-6aa7b9 as not-applicable with a
    stated reason rather than manufactured. In any case reject_scoped on a
    single unreplicated empirical-only run set is independently forbidden.
    REPLICATE would buy nothing, because a faithful re-run of this frozen
    contract is guaranteed by the archived derivations to reproduce the identical
    vacuous controls under any seed and any sample size; replication is the right
    instrument for a surprising result and the wrong one for a contract defect.
    EXPAND would be make-work, since enlarging the sample, the box or n on an
    uncontrolled counted path multiplies uncontrolled numbers, and the ECC
    unlimited budget removes the batch ceiling and explicitly not the duty to
    rank. PAUSE is not needed and is not used; the goal stays active, no
    impediment is raised by this batch, and IMP-2 is untouched.
  - >-
    4. THE ROUND OVERTURNED THE PRIOR THE PLAN MOST WANTED OVERTURNED, AND THAT
    IS THE MOST VALUABLE THING IT PRODUCED. coordinator_prior item 8 expected the
    blind re-derivation to reproduce 15, 22, 28 and 0.002 from the contract
    statement alone. It is OVERTURNED. The primary metric is not derivable from
    the frozen contract, because seven of the objects it depends on are undefined
    in the contract and in the hypothesis and the RNG call order among the four
    declared consumers of the run seed is unfixed, and a bounded search over 375
    sampling conventions fails to reproduce even the recorded b-tuple at b_index
    579. The re-deriver did NOT show 28 to be wrong; it showed 28 HAS NO
    INDEPENDENT CHECK BEHIND IT. Held together with the Red Team successful
    independent recomputation of the 28, which passed 10 of 10 checks on each of
    28 instances with 28 distinct base-class j-invariants and reproduced
    counts_per_H of 15, 22 and 28 from the recorded r-heights, THESE VERIFY
    DIFFERENT THINGS AND NEITHER SUBSTITUTES FOR THE OTHER. The Red Team check is
    a FORWARD check on persisted objects, asking whether the recorded instances
    meet the certifier own criteria and are pairwise distinct; the answer is yes,
    exactly. The Validator check is a BACKWARD check on the procedure, asking
    whether an independent party can reproduce the declared sample and hence the
    count from the frozen contract; the answer is no. The objects are checkable
    and were checked; the count is not checkable and was not checked.
  - >-
    5. THE ONE FRAMING DIFFERENCE, RESOLVED FROM THE FROZEN TEXT AND NOT
    AVERAGED. The Red Team frames the R7 n equals 6 degeneration as the object
    behaving correctly and IV-1 n equals 6 as unsatisfiable as frozen. The
    Validator refutes the reading that degeneration is the control passing,
    citing three frozen passages that name 5 as the expected n equals 6 certified
    total, and classifies the branch NOT EVALUATED rather than failed. THE FROZEN
    TEXT SUPPORTS THE VALIDATOR on the question actually asked, because the
    contract names 5 in three places and nowhere licenses built-nothing as a
    pass, and reading a null build as a pass would re-interpret a frozen control
    after seeing its result, which the protocol forbids and which is the
    convenient reading rather than the textual one. The two are nevertheless not
    in conflict, because the Red Team derivation does not make the clause pass,
    it explains why the clause can NEVER pass, which is strictly stronger and
    checkable. COMPOSED VERDICT, IV-1 at n equals 6 is NOT EVALUATED AND
    UNSATISFIABLE AS FROZEN, a defect in the contract rather than in the
    mathematics or in the Executor conduct. Both reviewers AGREE ON THE OPERATIVE
    FACT, that the control did not discriminate, and that is what carries this
    disposition. At n equals 8 the frozen equality is likewise not met and every
    deviation is DOWNWARD, so the proves_too_much failure signature (a) is not
    triggered and the certifier fails in the conservative direction of a
    documented rank lower bound.
  - >-
    6. THREE DEFECTS IN THE FROZEN CONTRACT, TWO FOUND INDEPENDENTLY BY BOTH
    REVIEWERS AND ONE ADDED BY THE COMPOSITION. CD-1, invalidation_rules branch
    on control FAILURE and carry NO BRANCH for a control that never evaluated, so
    IV-3 status and the second conjunct of IV-4 have no defined effect and the
    contract cannot decide its own outcome. CD-2, IV-1 n equals 6 clause fixes a
    certified total on a family that at n equals 6 is not an elliptic object at
    all, and the predecessor never ran this control at n equals 6, so the clause
    is new in this contract and was never exercised. CD-3, added here, IV-8
    fallback branch and its downgrade consequence are both written for
    single-class output, matching the predecessor where all 58 certificates were
    single-class, while here 28 of 28 are three-class; the required fallback
    statement therefore has no coherent value to report, the producer duly
    recorded an incoherent one, and the frozen downgrade to single-class
    downgrades nothing this run produced. Beyond these, the primary metric is not
    implementable from the contract, metrics.secondary mislabels the
    EV-ECRANK-8b35bb bound as per draw when that record states it per b-tuple at
    n equals 8, and the 1.0e8 per-run cap and the declared 10^4 n equals 8 sample
    are mutually inconsistent by a factor of 15.0, determinable at design time.
  - >-
    7. THE REPAIR IS A DESIGN ACT AND NOT A RE-RUN, AND OWNERSHIP SPLITS. The
    Executor implemented what was frozen, disclosed PD-1, PD-2 and PD-3, quoted
    the two awkward fields verbatim into its report rather than hiding them, and
    interpreted nothing. The contract defects above are owned by the Coordinator
    design step and, where a new control OBJECT must be invented, by the Idea
    Generator. A separate list of nine artifact defects is owned by the Executor
    in the successor run and is enumerated in next action N2; it is a list for
    the successor handoff and NOT grounds to return this immutable package, which
    is never re-scored.
  - >-
    8. RANKING, AND WHY THIS BATCH WAS WORTH ITS BUDGET. GOAL-ECRANK-002 is an
    ECC goal, so it is selected before all others and its campaign budget is
    unlimited; unlimited removes the batch ceiling and not the duty to rank.
    RANK 1 of the goal head is UNCHANGED AND STILL GATED, the breakthrough-tier
    review of the UNPROMOTED C1-closure candidate of DEC-20260905-7adca0 waits on
    review-breakthrough becoming servable at max and is never downgraded; IMP-2
    stands and blocks that promotion only, not this campaign. This batch was
    RANK 2 and converted an uninterpretable executed package into a specified
    repair with two archived derivations, a nine-row control table, an overturned
    Coordinator prior and an independently re-verified instance ledger. That is
    the cheapest action that could change what the program knows about this lane,
    and the next ranked action is N1 below rather than any further run of the
    present contract.

