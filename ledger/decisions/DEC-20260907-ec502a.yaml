    on the values, and in particular the at-least-8-tuples instantiation of the
    blind at-most-two-roots ceiling uses the leaked 28 and 20, so its exact
    landing at 8 is an internal-coherence check rather than a blind reproduction.
    It does NOT contaminate the negative finding, since knowing the target makes
    reverse-engineering a convention easier rather than harder and 375
    conventions still failed. PDR-3, experiments/EXP-ECRANK-76a70d/ was outside
    the Red Team read scope, so the predecessor non-transfer argument rests on
    EV-ECRANK-8b35bb alone; it contaminates nothing the Red Team computed and
    leaves the stated conditional untested, which is next action N5. PDR-4, the
    frozen plan own designated strongest refutation artifact, J7 item (i), was
    NOT COMPUTABLE from committed bytes because no a-invariants and no curve
