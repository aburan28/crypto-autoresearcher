    2 reports, every joint owned and attested, blindness respected, controls
    declared. Plan-copy equivalence was verified by one of the reviewers on its
    own binding and by no independent agent for the other. The tool checks the
    shape of the round and cannot see whether a verdict was revised after a
    disclosure.
  - >-
    WHAT NEITHER REVIEWER COULD SEE. Determinism was exercised only on the R3 and
    R4 pair and the R2 audit reconstruction, so IV-7 is NOT EVALUATED for R1, R5,
    R6, R7 and R8. IV-6 every-attempt-preserved is not evaluable from a record.
    model_verified false has no probe receipt in the package and is NOT
