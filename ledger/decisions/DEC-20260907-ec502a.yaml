  limitations:
  - >-
    SCOPE, EXACTLY. n in the set 6 and 8; nested coefficient boxes H at most 10^4
    at n equals 6 and at most 10^3 at n equals 8; the seeded 10^4 b-tuple sample
    per construction arm, of which R5 completed 667; b-tuples in affine normal
    form with b_1 equal 0, b_2 equal 1 and b_3 through b_n distinct integers in
    the interval from -20 to 20 excluding 0 and 1; support -1, 2, 3, 5, 7, 11,
    13; the square pattern prescribed on the carrier coordinate r_n; exact stdlib
    fractions.Fraction arithmetic with no descent, no PARI and no network; a
    counted exact-op cap of 1.0e8 per run; TOY claim tier. TRANSFER ASSUMPTIONS,
    NONE ARE ASSERTED. Nothing here reaches larger n, cryptographic parameters,
    rank over the rationals in general, or C1.
  - >-
    THIS ROUND IS TWO REVIEWS WITH THREE DISCLOSED BLINDNESS DEVIATIONS ON A
    TOY-SCALE RUN SET WHOSE PRIMARY POSITIVE CONTROL NEVER EVALUATED, AND IT IS
    NOT MORE THAN THAT. It is not a replication, not an independent second
    execution of the mechanism, and not a review-breakthrough round. The
    strongest positive statement it supports is object-level and rests on a
    single review computation whose script was not archived as a run record.
  - >-
    PROCEDURE DEVIATIONS OF THE ROUND, PRESERVED AND NAMED rather than smoothed,
    with the frozen plan procedure_deviations list having been empty at freeze.
    PDR-1, each reviewer final repository-wide git status incidentally surfaced
    the sibling FILENAMES, two for the Validator and one for the Red Team, run as
    a completion-gate obligation; neither report was opened and every verdict was
    already fixed, and read_sibling_reports is honestly false in both
    attestations. What it could not contaminate is any content. What it could in
    principle contaminate is knowledge that the sibling had finished, and the
    limit stated plainly is that revision between writing and committing is not
    independently detectable from the tree, so the no-revision claim rests on the
    attestations alone. PDR-2, the J4 re-derivation was IMPLEMENTATION-BLIND BUT
    NOT VALUE-BLIND, because the mandatory handoff embeds the frozen plan which
    quotes 15, 22, 28, feasible_tuples 20 and feasibility_fraction 0.002, and the
    earlier prior repeats them; the Validator flagged this itself before opening
