    this is why proof_status on EV-ECRANK-6aa7b9 is derivation and not
    certificate. NO BLINDNESS WAS LIFTED; blindness.lifted_for stays empty and
    nothing in this round is treated as jointly reviewed.
  - >-
    THE INDEPENDENCE CHECK WAS RUN BY THE ORCHESTRATING SESSION AND NOT BY THE
    COORDINATOR SUBAGENT, which holds no command-execution tool under this
    runtime, and it was invoked with --plan pointing at
    ledger/handoffs/TASK-20260907-46731e.yaml, a BINDING COPY of the plan rather
