    not pinned by the contract text and neither reviewer resolved it.
  - >-
    NOTHING IN THIS DECISION IS DURABLE UNTIL THE ARCHIVE VERIFIES. The ledger
    archive TASK-20260907-f5e45b must merge origin/main first, merge and never
