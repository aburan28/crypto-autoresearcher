coordinator_decision:
  id: DEC-20260726-002
  context: >-
    EXP-FCP-002 (fixed-curve preprocessing at 16-28 bit toy primes, K=5, B=14,
    m=2, 144 runs) was executed under a frozen, approved protocol with clean
    code (dirty: false). The success criterion (amortized_cost_ratio < 0.95 at
    bits >= 20 for >= 2/3 seeds) is not met: all ratios are > 0.95, and 10/12
    are > 1.0. The falsification criterion requires both no advantage AND no
    increasing precomp/groeb trend; the trend does increase (0.4% → 1.5%),
    so the combined falsification is not triggered.
  decision: inconclusive
  target_ids:
    - H-FCP-001
    - EXP-FCP-002
  rationale:
    - >-
      The pre-registered success criterion is not met: 0/9 runs at bits >= 20
      have amortized_cost_ratio < 0.95. The mean ratio at 28 bits is 1.061,
      meaning fixed preprocessing is 6% more expensive than naive on average.
    - >-
      The falsification criterion is partially met: the ratio is >= 0.95 at all
      tested sizes (condition 1), but the precomp/groebner ratio does increase
      monotonically (condition 2 fails). The combined AND condition is not
      triggered, so the direction is not closed.
    - >-
      inconclusive is chosen over reject_scoped because the precomp/groeb trend
      leaves open the possibility that larger field sizes (32-40 bits) or
      different parameters (larger B, larger K) could produce a measurable
      advantage. The evidence does not discriminate between "the hypothesis is
      wrong" and "the advantage exists but is below the noise floor at this
      scale."
    - >-
      inconclusive is chosen over weaken because there is no prior evidence to
      weaken — this is the first formal test of H-FCP-001. The prior experiment
      (EXP-FCP-001) was informal and did not test this hypothesis.
  evidence_refs:
    - EV-FCP-002
  limitations:
    - Toy scale only (max 28 bits); precomp/groeb trend may not extrapolate.
    - No decompositions found; Groebner cost on trivial ideals only.
    - B=14, m=2, K=5 only; other parameters may behave differently.
    - The precomp/groeb ratio (~1.5% at 28 bits) is below the noise floor of
      Groebner solve time variance (~10%).
  next_actions:
    - >-
      If pursuing: test at 32-40 bit primes where the precomp/groeb ratio may
      reach ~3-6%, potentially crossing the 5% savings threshold at K=5.
      Requires verifying sympy Groebner feasibility at these sizes (coefficient
      arithmetic cost grows, though polynomial operation count is fixed).
    - >-
      Alternatively: test with larger K (20-50 targets) to improve amortization,
      though the bottleneck is the precomp/groeb ratio, not K.
    - >-
      Alternatively: test with larger factor base B=50-100 where construction
      cost is higher, though Groebner cost also increases with B.
    - >-
      If not pursuing: H-FCP-001 remains inconclusive; the 144 runs contribute a
      preliminary data point on preprocessing cost behavior at 16-28 bits.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-FCP-002 is preliminary empirical evidence with an inconclusive
      direction. The precomp/groeb trend is a descriptive observation, not a
      proven result, and the absence of a cost advantage at 16-28 bits is
      scoped to the tested parameters. No durable finding is established.
  decided_by: coordinator
  decided_at: "2026-07-26T23:30:00-07:00"
