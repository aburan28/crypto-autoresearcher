coordinator_decision:
  id: DEC-20260726-002
  context: >-
    Companion to DEC-20260726-001, which approved EXP-JMV-001 and EXP-JMV-004 branch (a)
    under RQ-JMV-001. This record disposes of the remaining four drafts of the JMV-2005
    suite (research/JMV2005_experiment_suite_20260726.md). None of them is approved. Each
    carries a named design defect, not merely a budget objection, and each verdict names the
    concrete change required before re-submission. Nothing has been executed and no evidence
    record exists for any of them.
  decision: revise
  target_ids:
    - EXP-JMV-002
    - EXP-JMV-003
    - EXP-JMV-005
    - EXP-JMV-006
  rationale:
    - >-
      EXP-JMV-002 (c_pi as the square part of a random integer) - REVISE, budget withheld
      behind a literature gate. Defect 1, and it is disqualifying as drafted: the sampling
      measure is not the model's measure. Drawing random (a,b) over a fixed p samples curves
      uniformly, which weights each Frobenius trace t in proportion to the Kronecker/Hurwitz
      class number H(4q - t^2); and h(f^2 * d_K) grows roughly like f * h(d_K) times a local
      correction, so uniform curve sampling over-weights large conductors roughly linearly in
      c_pi. The experiment as drafted therefore cannot distinguish "the random-integer model
      is wrong" from "our sampling measure is not the one the model describes" - and the
      declared falsification criterion (odd-prime square density deviates from 1/l^2) would
      very likely fire for the second reason while being written up as the first. Required
      fix: compute BOTH the unweighted and the class-number-weighted null, or sample the
      trace directly rather than the curve, and name this confound in the spec.
    - >-
      EXP-JMV-002 defect 2 (novelty). The local densities of the Frobenius trace and
      discriminant distribution over prime fields are computed in closed form in the existing
      literature (Gekeler-type Frobenius-distribution results, Cohen-Lenstra heuristics on the
      class-group side, Howe-type density results). The spec's pre-registered deviation covers
      only the coarsest case (the forced d_pi = 0 or 1 mod 4 at l = 2). Before any of the
      8 CPU-hours is spent, a LITERATURE GATE: ingest the relevant local-density results as
      KN-LIT entries and state which parts of the Section 6 heuristic they already settle. If
      they settle the odd-prime densities in closed form, EXP-JMV-002 converts to
      reject_scoped with no further budget. If they leave the P(c_pi) tail constant genuinely
      open, a downscoped confirmation may be re-submitted. Note that the 8-CPU-hour budget is
      generous for the stated work (roughly 1.5e5 factorizations of integers under 80 bits),
      which confirms the objection is to the design, not to the cost.
    - >-
      EXP-JMV-003 (measured spectral gap) - REVISE and downscope to a pilot. The core method
      is sound and is the best idea in Track B's machinery: the graph is an abelian Cayley
      graph on Cl(O), so eigenvalues are character sums and no h x h matrix is needed, with
      the h <= 2000 matrix diagonalization retained as the correctness gate. Three changes
      are required. (i) GRH CIRCULARITY MUST BE DECLARED: Pari's bnfinit returns a
      GRH-conditional class group by default, so as drafted this measures the empirical
      constant in a GRH-conditional bound using GRH-conditional class-group data. That is
      admissible but must be stated in the record, with either bnfcertify on a subsample or an
      explicit declaration that the input data is conditional on the same hypothesis as the
      bound it audits. (ii) The degree/eigenvalue normalization must be the single convention
      fixed under DEC-20260726-001 condition E2, or 003 and 004 cannot be combined at all.
      (iii) Scope and sequencing: 200 discriminants x 6 values of m at |D| up to 10^8 for
      12 CPU-hours is not funded under a program with no active campaign budget for this
      track. Re-submit as a pilot - at least 40 fundamental discriminants x m in {64, 256,
      1024}, matrix cross-check mandatory, under 2 CPU-hours.
    - >-
      EXP-JMV-003 sequencing, stated as a decision rule rather than a preference. Run
      EXP-JMV-004 branch (a) FIRST. Branch (a) determines how much the measured constant C can
      possibly matter: if log(k/c) at q = 2^256 is negative by orders of magnitude for every
      C above some small value, then measuring C precisely changes no conclusion and the full
      200-discriminant pass must not be funded. Only if branch (a) puts the vacuity boundary
      inside the plausible range of C does the pilot, and then possibly the full pass, earn
      its budget.
    - >-
      EXP-JMV-005 (tightness of Proposition 3.1) - REVISE; the standalone 6-CPU-hour Monte
      Carlo scope is CLOSED. The walk is on an ABELIAN group, so its r-step distribution is
      determined exactly by the character-sum spectrum EXP-JMV-003 already computes: the
      Fourier coefficient of the r-fold convolution at chi is (lambda_chi / k)^r, the
      total-variation distance to uniform follows by Fourier inversion, and the
      Diaconis-Shahshahani bound 4 * ||P^{*r} - U||_TV^2 <= sum over nontrivial chi of
      |lambda_chi / k|^{2r} is immediate. The hitting metric is likewise exact - Proposition
      3.1's guarantee concerns the endpoint landing in S, and P(endpoint in S) is a finite
      character sum. Spending 6 CPU-hours on a Monte Carlo estimate of a quantity computable
      exactly from data already in hand is strictly dominated: noisier, more expensive, and it
      adds an estimator-bias failure mode that the exact computation does not have. The
      scientific question (how much slack separates the proven bound from true mixing) is
      legitimate and survives; the standalone experiment does not.
    - >-
      EXP-JMV-005 disposition. Fold the question into EXP-JMV-003 as an ANALYSIS step on the
      spectra, and retain simulation only as a small correctness cross-check on two or three
      discriminants with h <= 2000, where it functions as a validity control on 003 rather
      than as an experiment. Additional duplication note the suite's Section 7 audit missed:
      the drafted backtracking-vs-non-backtracking control duplicates the design of ISOWALK-C1
      (proposal G30-019 in research_goals_20260723.md), an unscheduled measurement in the same
      lane; running it here would fragment that lane and pre-empt its held-out fitting rule.
    - >-
      EXP-JMV-006 (full-level cost census) - REVISE and DEFER; not scheduled. Defect 1 is
      disqualifying as drafted, and it is the mirror image of the invalidation rule the spec
      is proudest of. Requiring a single FIXED, curve-independent rho partition rule prevents
      one confound (a rule that encodes the curve) and creates a worse one: one fixed
      partition rule interacts idiosyncratically with each curve's point set, so the per-curve
      differences in iteration count are a property of the walk function on that curve, not of
      that curve's dlog difficulty. Control (i), same-curve seed-to-seed variance, cannot
      estimate it, because the walk-function effect is CONSTANT within a curve across seeds -
      it is precisely the between-curve term the experiment would attribute to a
      "level-internal cost spread". As specified, a significant permutation-test p-value would
      be uninterpretable, and that is the only outcome the experiment exists to produce.
    - >-
      EXP-JMV-006 required fix for defect 1. Cross the partition rule WITH the curve: draw the
      rule from a curve-independent family indexed by a rule seed (at least 8 independent hash
      keys), run every curve under every rule seed, and estimate a three-way variance
      decomposition over curve x rule x sampling. The permutation test then targets the curve
      main effect after the rule effect is removed. This preserves the invalidation rule's
      intent - no rule may depend on curve coefficients - while making the confound estimable
      instead of silently absorbed into the headline.
    - >-
      EXP-JMV-006 defect 2 (level identification has no correctness control). "Every curve in
      one level" requires separating the levels of the volcano, and the spec names no method
      (Kohel's algorithm, CM construction via the Hilbert class polynomial, or brute
      enumeration plus endomorphism-ring determination) and no check that the enumerated set is
      exactly one level. "Incomplete level enumeration invalidates the census" is asserted but
      nothing tests it; the natural check is that the enumerated count equals h(O) computed
      independently, and that must be a stated control.
    - >-
      EXP-JMV-006 defect 3 (unstated power). Pollard-rho iteration counts have relative
      standard deviation near 0.52 per seed, so with 8 seeds the per-curve standard error is
      near 18%. The spec must pre-register the smallest true between-curve standard deviation
      its design can detect at a declared power, and report that number whether or not an
      effect is found. A null result with unstated power is not informative and cannot close
      even the toy scope it claims to close.
    - >-
      EXP-JMV-006 defect 4 (priority, and it is decisive at present). 16 CPU-hours is the
      largest item in the suite; the prior from Corollary 1.2 and from EV-ISO-001 favours a
      null; and the spec's own claim boundary concedes that BOTH outcomes are compatible with
      Theorem 1.1 - a null closes toy scope only, and a positive result is explicitly not a
      counterexample to JMV. That information-per-hour ratio does not clear the bar for a
      track with no campaign budget. Deferred: re-submit only after EXP-JMV-001 and
      EXP-JMV-004 branch (a) report, and only with the three-way design of defect 1, the
      completeness control of defect 2, and the pre-registered power of defect 3.
    - >-
      EXP-JMV-007 remains design-only and is not before me; it is not approved by omission,
      and it stays deferred behind a revised EXP-JMV-006 as the suite doc itself states.
  evidence_refs:
    - "NONE. Nothing in this suite has been executed and no EV-* record exists. Inputs are design documents only: research/JMV2005_experiment_suite_20260726.md and experiments/EXP-JMV-002/, -003/, -005/, -006/specification.yaml."
    - "Prior records consulted: EV-ISO-001 and H-ISO-001 (rejected_scoped) for the EXP-JMV-006 prior and non-duplication; research_goals_20260723.md G30-019 (ISOWALK-C1) for the EXP-JMV-005 duplication note."
  limitations:
    - "These are verdicts on experiment DESIGNS, not on any mathematical claim. No hypothesis status is changed by this record, no theory is weakened or rejected, and no refutation artifact is required or implied. In particular, closing EXP-JMV-005's standalone Monte Carlo scope is a methodological and resource judgement about a strictly dominated estimator, not a finding about mixing on class groups."
    - "The EXP-JMV-002 and EXP-JMV-006 confounds identified here are arguments from standard facts (class-number weighting of uniform curve sampling; rho walk-function idiosyncrasy). They are stated in this record so they are checkable step by step by an independent reader, and they should be challenged by whoever re-submits the specs. They are not experimental results and are not cited as such."
    - No experiment in this suite may be framed as an attack, an attack-cost improvement, or as bearing on GRH, whether approved, revised, or deferred.
    - "A revise verdict is not a soft approval. EXP-JMV-002, 003, 005 and 006 are UNAPPROVED and no run of any of them may be started, at any budget, until a version-2 specification addressing the named defects is submitted and separately approved."
  next_actions:
    - "Executor and Idea Generator: do not start EXP-JMV-002, EXP-JMV-003, EXP-JMV-005, or EXP-JMV-006. No run, no partial run, no pilot without a new approval."
    - "After EXP-JMV-004 branch (a) reports and is reviewed, the Coordinator re-evaluates EXP-JMV-003 against the branch-(a) vacuity boundary and either funds the 2-CPU-hour pilot or issues reject_scoped on the measured-constant lane as decision-irrelevant."
    - "EXP-JMV-002 is blocked behind its literature gate: ingest the relevant Frobenius-distribution / local-density literature as KN-LIT entries first, then decide between a downscoped re-submission and reject_scoped."
    - "EXP-JMV-005 is re-submitted, if at all, as an analysis section of a revised EXP-JMV-003 spec plus a small h <= 2000 simulation cross-check, with the ISOWALK-C1 overlap resolved rather than duplicated."
    - "EXP-JMV-006 is re-submitted, if at all, only after both approved experiments report, with the rule x curve crossed design, the |level| = h(O) completeness control, and a pre-registered minimum detectable effect."
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No evidence record exists and nothing has been executed. This record contains no
      empirical observation of any strength, and design critiques of unapproved experiments
      are not durable findings about ECDLP. The EXP-JMV-002 literature gate may produce
      KN-LIT entries, which is corpus coverage and not promotion of an internal finding.
  decided_by: coordinator
  decided_at: "2026-07-26"
