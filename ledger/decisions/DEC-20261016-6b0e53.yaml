# DEC-20261016-6b0e53 -- evidence review of EXP-ECDLP-422afc (RUN-ECDLP-06bb83).
# Refine: the frozen hypothesis could not hold at any of its primes, and the
# decomposition heuristic it was meant to reproduce remains untested.
coordinator_decision:
  id: DEC-20261016-6b0e53
  id_provenance: >-
    Random 6-hex token chosen by the reviewing Coordinator subagent, which has no
    shell. A repository-wide search found no record id with this token. The
    session must run python3 tools/allocate_id.py --check DEC-20261016-6b0e53
    before the ledger archive.
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  mode: evidence_review
  goal_id: GOAL-ECDLP-001
  question_ids: [RQ-ECDLP-002]
  archived_by: null
  decision: refine
  decision_label: >-
    EXP-ECDLP-422afc v1 cannot reproduce the decomposition fraction of
    IDEA-20261009-f24f8a. Its hypothesis H-ECDLP-a1fc69 compares the wrong
    quantity with 1/2, and the derivation shows it is false at 101, 211 and 307
    whatever the run returned. Send the run back to the executor for
    publication (TASK-20261016-c8a7f2), keep the reproduction check open, and
    design a successor contract with the corrected normalization.
  target_ids:
    - H-ECDLP-a1fc69
    - EXP-ECDLP-422afc
    - EV-ECDLP-9d41e7
    - RUN-ECDLP-06bb83
    - IDEA-20261009-f24f8a
    - TASK-20261016-c8a7f2
  context: >-
    DEC-20261012-a0ba67 approved the frozen contract EXP-ECDLP-422afc. It
    enumerates unordered factor-base pairs (x < floor(sqrt p), square right-hand
    side) on y^2 = x^3 + x + 1 at p = 101, 211 and 307, counts the x in F_p
    that satisfy Semaev S3 with some pair, and compares count/p with
    p^{m beta - 1}/m! = 1/2 using a 0.25 band. The session ran run.py and
    check.py and both exited 0. The run directory holds only a two-metric
    producer manifest and raw-result.json and is uncommitted. Working-tree
    values: fractions 0.168, 0.133 and 0.199, every abs_error above 0.25, and
    the planted S3 identity true at every prime.
  rationale:
    - >-
      Validity comes first. The run count (1 of 1), seeds (none, deterministic
      by contract), frozen inputs, raw/summary agreement and tail checks
      (pairs = C(|F|, 2)) all check out. The reviewer re-derived the planted
      S3 identity at p = 101 and the factor bases at all three primes by hand
      (|F| = 5, 6, 9). The run record is still incomplete: the manifest is not
      schema-complete (V-1), the companion artifacts are missing (V-2) and the
      record is unpublished (V-3). An incomplete run set goes back to the
      executor and is not evidence, so EV-ECDLP-9d41e7 does not cite it in
      run_ids.
    - >-
      The derivation does not depend on the run (EV-ECDLP-9d41e7 D1-D3). S3 is
      quadratic in x3 with nonzero leading coefficient, so at most |F|(|F|-1)
      targets decompose. That caps the fraction at 0.198, 0.142 and 0.235, all
      below the 0.25 band edge. The success criterion was impossible at every
      prime before execution, and the falsification criterion was certain
      given the planted identity. The run could not have changed the outcome.
    - >-
      What the contradiction covers. The literal statement of H-ECDLP-a1fc69 is
      false (direction contradicts, strength preliminary, proof_status
      derivation). D4-D5 show why: the contract divides by all p values of x,
      when only about p/2 are x-coordinates of points, and it reads an expected
      decomposition count of 1/2 per point as a probability. The
      reproduction check required by IDEA-20261009-f24f8a has not been
      performed, so the idea's heuristic is neither supported nor weakened.
    - >-
      Why refine and not reject_scoped. (a) Rejecting a mis-normalized
      statement closes nothing and would read as a rejection of the idea's
      heuristic, which was not tested. (b) The closure gate needs an
      obstruction read from cited runs, and the run is unpublished. (c) The
      derivation has not been independently re-derived. Why refine and not
      inconclusive: the data do discriminate, since the literal statement is
      settled. The missing piece is a correctly posed hypothesis, which a
      refine supplies.
    - >-
      The post-hoc Poisson agreement (0.164, 0.124, 0.187 predicted against
      0.168, 0.133, 0.199 recorded) is NOT evidence. The model was chosen
      after the values were seen. It is used only to motivate the successor's
      preregistered prediction.
    - >-
      Success criterion (AGENTS.md "Every improvement is a success"): no ECDLP
      cost is measured, so there is no improvement over the index-calculus
      baseline to record. The distance remaining to the matched rho is not
      measured by this experiment.
  hypothesis_status_transition:
    hypothesis_id: H-ECDLP-a1fc69
    from: specified
    to: specified
    note: >-
      No transition is made here. The hypothesis file is immutable and this
      review writes only new records. The successor hypothesis written by
      /design-experiment should supersede H-ECDLP-a1fc69. Once the run is
      published and D1-D3 have been independently re-derived, a later review
      may move H-ECDLP-a1fc69 to rejected, scoped to its literal statement, on
      the derivation.
  evidence_refs:
    - EV-ECDLP-9d41e7
    - experiments/EXP-ECDLP-422afc/specification.yaml
    - experiments/EXP-ECDLP-422afc/implementation/run.py
    - experiments/EXP-ECDLP-422afc/implementation/check.py
    - experiments/EXP-ECDLP-422afc/runs/RUN-ECDLP-06bb83/raw-result.json (working tree, unpublished; consistency check only)
  limitations:
    - >-
      Toy tier: one curve, p = 101, 211 and 307, m = 2, beta = 1/2,
      enumeration only. No transfer to larger p, to m >= 3, to SAT or
      Groebner solvers, or to any deployed curve.
    - >-
      D1-D3 are a hand derivation by the reviewing Coordinator subagent and
      have not been independently re-derived. D4 uses the recalled
      character-sum estimate. D5 is a heuristic reading.
    - >-
      The reviewing subagent had no shell. tools/allocate_id.py --next/--check
      and tools/validate_ledger.py were not run, and the trial-plan
      source_sha256 binding was not re-hashed. Ids were chosen as random 6-hex
      tokens and checked free by search only.
    - >-
      experiments/EXP-ECDLP-422afc/analysis.md was not written by the
      subagent, which is barred from writing Markdown report files. Its
      content (validity, Observation/Comparison/Inference/Limitation and the
      derivation) is in EV-ECDLP-9d41e7, and the session must write
      analysis.md from it before the ledger archive.
    - >-
      No review_plan, validator or red team was dispatched. No claim status
      changes.
    - >-
      report.pdf has not been rendered because the subagent has no shell. The
      Typst source, the SVG graph and the graph data are written for the
      session to render and inspect.
    - >-
      No run report (reports/run-*) exists for RUN-ECDLP-06bb83 yet.
      TASK-20261016-c8a7f2 owes one.
  next_actions:
    - >-
      Session, before the ledger archive: run python3 tools/allocate_id.py
      --check on EV-ECDLP-9d41e7, DEC-20261016-6b0e53 and TASK-20261016-c8a7f2.
      Run tools/validate_ledger.py. Write experiments/EXP-ECDLP-422afc/analysis.md
      from EV-ECDLP-9d41e7. Render
      experiments/EXP-ECDLP-422afc/reports/review-DEC-20261016-6b0e53/report.pdf
      from report.typ and inspect it.
    - >-
      Executor: TASK-20261016-c8a7f2 publishes RUN-ECDLP-06bb83 as a
      schema-complete record, or names its provenance gaps, and writes the run
      report. No new trial.
    - >-
      Coordinator ledger archive, run as one task on its own: stage
      EV-ECDLP-9d41e7, DEC-20261016-6b0e53, TASK-20261016-c8a7f2, analysis.md and
      the review report directory by exact path. Do not stage
      implementation/__pycache__/. Push, then open or refresh the PR naming
      these ids. Then checkpoint GOAL-ECDLP-001.
    - >-
      GOAL-ECDLP-001 single next action for this lane: /design-experiment a v2
      stage-0 contract for IDEA-20261009-f24f8a under a new EXP id and a
      successor H. Requirements: (1) targets are the x-coordinates of points
      of E(F_p), with that denominator computed exactly, or targets are
      points; (2) a preregistered prediction that either accounts for
      saturation (for example 1 - exp(-lambda) with lambda computed from the
      actual |F|) or uses a beta small enough that p^{m beta - 1}/m! is much
      smaller than 1; (3) the exact ceiling |F|(|F|-1) stated in advance as a
      method ceiling, with the band checked as reachable before freezing;
      (4) at least one prime larger than 307 per the v1 on_negative clause;
      (5) a checker that recomputes counts without importing run.py; (6) the
      driver writing a schema-complete manifest envelope, or the contract
      naming the runner that does.
    - >-
      Do not schedule the SAT, Groebner or Coppersmith arms of
      IDEA-20261009-f24f8a on the basis of EXP-ECDLP-422afc. Its
      decision_impact bars it, and the reproduction check is still open.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The decision is refine on preliminary evidence, below the replicated or
      strong strength that promotion requires. The reusable content, the exact
      bound c(p) <= |F|(|F|-1) and the normalization pitfall when instantiating
      p^{m beta - 1}/m!, is a single-review derivation. It should become a
      KN-TECH after an independent re-derivation and after the v2 contract
      shows the corrected normalization tracking the formula.
  archive:
    kind: ledger
    commit_sha: null
    record_ids: [EV-ECDLP-9d41e7, DEC-20261016-6b0e53, TASK-20261016-c8a7f2]
    note: Uncommitted when written. Not official until the ledger archive is verified.
