coordinator_decision:
  id: DEC-20260807-7d9e36
  goal_id: GOAL-ECDLP-001
  context: >-
    Evidence review for EXP-ECDLP-1ed445 (character-sum ladder). This experiment
    measured the additive-character statistic C = max_k |sum_{P in F} e(2 pi i k
    DL(P)/N)| / sqrt(B) on three arms (EC factor base, matched random null, planted
    AP) at four rungs (bits 20, 22, 24, 26), reporting the RATIO R = C_EC/C_null
    rather than C itself. RUN-ECDLP-1ed445-001 completed in 3290s, all gates pass
    within falsification bounds. Primary finding: alpha_resid = -0.001 (CI contains
    zero), R approximately constant at 1.28-1.34. This is the first null-normalized
    measurement of the H-PSEUDO character-sum constant.
  decision: accept
  decision_scope: >-
    RUN-ECDLP-1ed445-001 ACCEPTED AS VALID EVIDENCE at strength PRELIMINARY and
    claim_tier TOY. The run produces the first null-normalized character-sum
    measurement, demonstrates instrument correctness (G1/G2/G3 all pass to high
    accuracy), and establishes that the EC-specific growth exponent after
    normalization is indistinguishable from zero across 2^20 to 2^26. Direction is
    SUPPORTS for H-ECDLP-feb405 because the preregistered prediction (alpha < 0.020)
    is confirmed. However, this does NOT establish H-PSEUDO at crypto scale, and a
    divergence beginning above 2^26 is fully consistent with every measurement.
  target_ids:
    - EXP-ECDLP-1ed445
    - RUN-ECDLP-1ed445-001
    - H-ECDLP-feb405
    - GOAL-ECDLP-001
    - EV-ECDLP-f83a17
  rationale:
    - >-
      INSTRUMENT CORRECTNESS IS ESTABLISHED TO HIGH PRECISION. G1 (null calibrates
      to Gumbel within 0.5%), G2 (CTRL-AP matches sqrt(B) to machine precision), and
      G3 (theta sweep monotone, artifact tell does not fire) demonstrate that the DFT
      machinery, normalization, and control arms all function correctly. This is the
      strongest instrument validation in any character-sum measurement in this program.
    - >-
      THE PRIMARY METRIC IS DECISIVE WITHIN ITS SCOPE. alpha_resid(mean) = -0.001
      with 95% CI [-0.048, +0.046] decisively rejects alpha > 0.048 at this scale.
      The preregistered threshold was 0.020; the point estimate is fifty-fold below it.
      alpha_resid(max) = -0.013 (CI [-0.085, +0.059]) confirms this even for the
      adversarial maximum. Neither shows any evidence of growth.
    - >-
      R IS APPROXIMATELY CONSTANT. R_mean = 1.334, 1.280, 1.275, 1.342 across the
      four rungs. There is no trend. The EC factor base carries approximately 28-34%
      more character-sum signal than a random subset of the same size, but this excess
      does not grow with p in the tested range. This is consistent with a FIXED
      additive offset (delta ~ 1.0-1.4) rather than a growing one.
    - >-
      THE k*-IN-F QUESTION IS ANSWERED. In 0/80 curves, the maximizing frequency k*
      falls in the factor base. This was the exact_next_action from
      DEC-20260804-7af513. The answer is negative, but trivially so: the factor base
      is B/N ~ 10^{-5} of the group, so hitting it by chance is improbable. The
      mechanism behind the 28-34% excess does not operate through k*-in-F.
    - >-
      THE COMPETING MODELS DO NOT SEPARATE. Three growth models (power law, sqrt(log),
      log-log-log) all achieve R^2 > 0.95 over the four rungs. The range is too narrow
      to distinguish them. The specification itself predicts separation requires
      p > 2^34, outside the memory budget for full DL enumeration.
    - >-
      STRENGTH IS PRELIMINARY, NOT MODERATE. Three factors cap the strength:
      (a) toy scale (bits <= 26), with a factor of 2^198 between the largest tested
      and the smallest deployed prime; (b) no correspondence trick to extend to crypto
      scale; (c) a divergence beginning above 2^26 is fully consistent with flat
      readings below it.
  evidence_refs:
    - EV-ECDLP-f83a17
    - experiments/EXP-ECDLP-1ed445/runs/RUN-ECDLP-1ed445-001/execution-report.yaml
    - experiments/EXP-ECDLP-1ed445/runs/RUN-ECDLP-1ed445-001/raw-result.json
  limitations:
    - >-
      No independent post-execution review. The instrument validation is strong (G1-G3
      all pass to high precision) but an independent party has not checked the raw
      output against the reported statistics.
    - >-
      The N-mismatch at bits=26 (ANOM-002) introduces a ~7% systematic upward bias in
      R at the largest rung. The per-curve calibration fix is straightforward but was
      not implemented.
    - >-
      Only 8 EC curves per rung at 20 mean-statistic curves. The sampling uncertainty
      on R is ~5% per rung. A replication with more curves would tighten the CI.
    - >-
      No path to crypto scale exists without a correspondence trick or an algorithm
      that avoids full DL enumeration. The current measurement terminates at 2^26 by
      fundamental resource limits, not by design choice.
  next_actions:
    - >-
      THE PRIMARY QUESTION IS ANSWERED FOR [2^20, 2^26]: alpha_resid is zero in this
      range. The REMAINING UNCERTAINTY is what happens above 2^26.
    - >-
      SEEK A CORRESPONDENCE TRICK. The single most valuable next step for this line
      is identifying whether there exists an indirect measurement (analogous to the
      Deuring correspondence for SSI) that probes the character-sum ratio at crypto-
      relevant parameters without full DL enumeration. This is an ideation question,
      not an execution question. If no trick exists, the line plateaus at toy scale.
    - >-
      IF A TRICK EXISTS: design the successor experiment at 2^30-2^40. If the flat
      R persists across that range, the evidence would advance to moderate strength.
    - >-
      IF NO TRICK EXISTS: record this as a clean positive preliminary result capped
      at toy scale. The hypothesis remains "supported at toy, untested at crypto" and
      no further execution on this exact line is warranted until the scalability gap
      is resolved.
    - >-
      REPLICATION (LOWER PRIORITY): at different seeds, with per-curve null
      calibration (fixing ANOM-002), and with more curves per rung (20-50 instead of
      8) to tighten the CI on R. This would strengthen the toy-scale claim but does
      not address the scalability gap.
    - >-
      DO NOT PURSUE k*-IN-F FURTHER. The 0/80 result is trivially explained by B/N
      ratio and does not contain information about the mechanism.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Evidence is preliminary, claim tier is toy. The result is the FIRST null-
      normalized measurement and carries genuine novelty within the program's internal
      corpus, but promoting a single-run toy-scale measurement to knowledge would set
      a precedent incompatible with the corpus integrity requirements. The instrument
      design (three-arm with Gumbel calibration) is promotable in principle, but
      should wait for either independent validation or replication. Hold for
      GOAL-ECDLP-001's next checkpoint.
  decided_by: coordinator
  decided_at: '2026-08-07'
