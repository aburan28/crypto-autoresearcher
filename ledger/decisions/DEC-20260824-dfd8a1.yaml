  limitations:
    - >-
      No timeout replay, Mestre frontier cell, positive control, twist-null
      control, benchmark, candidate search, curve construction, point
      verification, rank computation, regulator computation, or certificate
      verification was executed in this review round.
    - >-
      This decision supports no elliptic curve, rational point, Mordell-Weil
      rank, independence certificate, novelty, SOTA achievement, knowledge
      promotion, or goal completion claim.
    - >-
      The exact cardinalities 66, 65, 32, 4, and 102 are validated only as
      protocol-accounting quantities. They do not demonstrate that the planned
      experiment is safe to execute or that it will produce a rank-at-least-31
      candidate.
    - >-
      The statement-level P31=P1+P2 control was rejected by exact F2 reasoning,
      but no executable verifier was run and the stronger control is not part
      of the frozen protocol.
    - >-
      Reviewer model provenance is incomplete at the current artifact level:
      J1 and J3 attest gpt-5.6-sol at xhigh but the model is not separately
      probe-verified in those reports, while J2 records its resolved model as
      unavailable_to_agent. No stronger model-verification claim is made.
    - >-
      The direct independence attestations are immutable and mutually
      consistent, but the automated independence checker did not accept their
      current schema shapes. The successor plan must use checker-recognized
      fields and obtain an actual checker result rather than treating this
      deviation as precedent.
  next_actions:
    - >-
      Keep every Executor task absent or ineligible. Do not run any portion of
      the proposed 102-run batch.
    - >-
      Create an additive successor protocol under fresh random-suffix task and
      archive identifiers. Do not edit TASK-20260824-50f235 or its immutable
      snapshot.
    - >-
      Replace or redesign the two twist-null controls with null objects that
      provably preserve the required rational base point and identical
      measurement path, and publish the exact rational map and null expectation
      before review.
    - >-
      Separate implementation crashes from infrastructure failures. Freeze
      exact invalid, failed_infrastructure, completed, and censored
      classifications, including which classes consume retry or admission
      budget and which classes may not enter scientific metrics.
    - >-
      Freeze aggregate admission, stopping, retry, and replacement limits for
      all run classes. No result-dependent extension, favorable-only retry, or
      optional admission may remain.
    - >-
      Add finite aggregate CPU-seconds and storage-byte ceilings, alongside the
      existing 61,200-second cumulative outer-wall accounting, 18,720-second
      internal-timeout accounting, and 16-GB maximum concurrent-memory bound.
    - >-
      Bind the exact runner source commit and file hashes before execution.
      Define A1 and A2 unambiguously for every affected run. Give every one of
      the 102 planned identities exact stdout, stderr, raw-result, environment,
      resource, and terminal-receipt artifact paths.
    - >-
      Specify an executable exact character and denominator-normalization
      verifier, including domain, codomain, squareclass normalization,
      denominator clearing, homomorphism conditions, malformed-input
      rejection, and torsion preconditions.
    - >-
      Add the compositional P31=P1+P2 control alongside the existing weaker
      repeated-point or 2P1-shaped control, and require the actual exact
      verifier to reject both.
    - >-
      Freeze a checked invertible F2 matrix-equivalence witness for blind
      producer-versus-rederiver comparison. Define exactly which row and column
      operations are permitted and how equivalence is verified.
    - >-
      Set a finite candidate cap K and publish complete per-candidate and
      aggregate CPU, wall, memory, disk, certificate-generation, independent
      rederivation, breakthrough-review, and archival bounds.
    - >-
      Create a new preregistered blind review plan whose ownership,
      proves-too-much, and attestation fields conform to the automated
      independence checker. Snapshot the successor protocol and review plan
      before any reviewer runs.
  knowledge_promotion:
    promoted: []
    not_warranted:
      - bounded execution approval
      - elliptic-curve candidate
      - rational-point result
      - rank-greater-than-30 result
      - independence certificate
      - novelty or SOTA claim
      - goal completion
