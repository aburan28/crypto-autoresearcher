coordinator_decision:
  id: DEC-20260824-dfd8a1
  context: >-
    Coordinator composition of the preregistered, mutually blind
    execution-approval review round for the exact immutable
    TASK-20260824-50f235 protocol snapshot at
    bde679c014bd0750feae058ca67d46a060dee35f. The reviewed protocol proposes
    66 timeout-occurrence replays representing 65 parameter-equivalence
    classes, 32 deterministic frontier cells, four controls, and 102 total
    planned run identities. This decision concerns only whether that exact
    protocol may proceed to bounded execution.
  decision: revise
  target_ids:
    - GOAL-ECQ-bef741
    - BATCH-9fa73f
    - TASK-20260824-50f235
    - TASK-20260824-956566
  rationale:
    - >-
      The semantic disposition is REVISE_REQUIRED. The preregistered decision
      rule requires revision on any blocking finding, Validator failure,
      blind-rederivation disagreement, missing budget or artifact binding, or
      independence-affecting deviation. The immutable review wave contains
      multiple blocking findings on every owned joint and no immutable
      evidence contradicts them.
    - >-
      J1-SCIENTIFIC-DESIGN breaks. J1-B1 shows that the proposed quadratic-twist
      nulls do not preserve the rational base point required by the claimed
      identical measurement map: for the stated nonzero rational e values, the
      null transformation requires v^2 = 2e^2, which has no rational solution.
      The null controls therefore do not yet provide the required shape-matched
      comparison.
    - >-
      J1-B2 shows that the failure taxonomy can classify implementation crashes
      as infrastructure failures, allowing a broken implementation path to
      escape the invalid-run classification. J1-B3 shows that aggregate
      stopping, retry, and admission boundaries are not fully frozen. Either
      defect can alter the tested population or retain favorable observations
      after execution begins.
    - >-
      J2-INTEGRITY-AND-BUDGET fails. The blind Validator independently recovers
      66 replay occurrences, 65 exact parameter classes, one RP-022/RP-062
      repeat class, 32 frontier cells, four controls, and 102 globally unique
      pairwise-disjoint planned identities. Those cardinality checks agree with
      the producer, but they do not discharge the execution gate.
    - >-
      J2-D1-CPU-CEILING and J2-D2-STORAGE-CEILING find no finite aggregate CPU
      or storage ceiling for the 102-run batch. J2-D3-RUNNER-SOURCE finds that
      the future runner commit and hash map are not frozen. J2-D4-A-LABELS
      finds A1 and A2 undefined for 36 affected runs. J2-D5-ARTIFACT-PATHS
      finds that only the raw-result path is exact, leaving the other required
      per-run artifact paths unbound. The preregistered approval rule expressly
      requires no budget, command, seed, environment, or artifact-integrity
      failure.
    - >-
      J3-PROOF-ROUTE-AND-OVERCLAIM breaks. J3-BLOCK-01 finds that character
      soundness and denominator normalization are not specified as an exact
      verifier contract. J3-BLOCK-02 finds that the stronger compositional
      P31=P1+P2 known-false control is absent from the frozen protocol.
      J3-BLOCK-03 finds the independent matrix-equivalence witness
      underspecified. J3-BLOCK-04 finds the end-to-end certificate, storage,
      archive, and independent-review costs incomplete.
    - >-
      The statement-level known-false control behaves correctly in the review:
      P31=P1+P2 induces r31=r1+r2, yielding a nonzero column or row dependency
      over F2 and rank at most 30. That statement-level rejection is useful,
      but the frozen protocol neither includes the stronger control nor
      executes an exact verifier against it. It therefore cannot cure
      J3-BLOCK-02 or establish protocol-level acceptance safety.
    - >-
      The Coordinator prior expected APPROVE_BOUNDED_EXECUTION with confidence
      0.60. The independent evidence overturns that prior. Blocking findings
      are not votes and may not be outvoted by correct cardinalities, a
      statement-level known-false rejection, or the absence of a rank claim.
    - >-
      All three immutable task reports directly attest fresh independent
      sessions, exactly one owned joint, no Coordinator-prior or sibling-report
      reads, no sibling communication, fallback false, degraded false, zero
      mathematical experiments, and no mathematical claims. However,
      PD-REVIEW-INDEPENDENCE-SCHEMA records that the automated independence
      checker did not recognize the owner_task_id, proves_too_much_control, and
      Red-Team attestation shapes and emitted five shape errors. This decision
      does not claim an automated checker PASS. The schema mismatch must be
      corrected before a successor review wave.
  evidence_refs:
