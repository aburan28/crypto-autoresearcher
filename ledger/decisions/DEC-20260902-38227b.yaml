coordinator_decision:
  id: DEC-20260902-38227b

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-02). DEC-20260901-6f9de3
    closed BATCH-7b798d (SH-GATE-FAIL, no shape verdict; first
    interior hit-count observations: h(1)=12,681,109, h(2)=149,371,
    h(8)=13, h(16)=12; power table voided at the realized regime)
    with RANK 1 = a successor design proposal under AMEND-1
    incorporating red-team repairs R1, R3-R8. IDEA-20260902-9e84ac
    was authored and filed on main (PR #691): grid {0,1,2,4,8,16}
    with k=4 as the load-bearing transition locator (first
    measurement), AMEND-1's counter-inconsistency gate adopted
    verbatim, joint-effect scoping for the PIN-T0 schedule confound,
    second seeds at k=1 and k=4, re-priced power for the realized
    regime, a 10-branch SH2 cascade with overlap check, determinism
    double on an overflow-positive receipt, and three producer stages
    (4 + 8 + 2 invocations; cap 19800 s total). The proposal surfaces
    PINCTRL-1 (identity-schedule interior control seats) as a
    DEFERRED Coordinator question; it is not required by this design.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-e5d753, ADOPTS THE JOINT-EFFECT SCOPING
    OF IDEA-20260902-9e84ac AS THE BINDING ATTRIBUTION RULE FOR THIS
    BATCH, AND DISPATCHES ITS QUEUE. It does NOT move
    current_batch_id (that happens in the closing ledger archive),
    does NOT adopt PINCTRL-1 (deferred; any schedule-separated
    control arm requires a new pin decision), does NOT spend BATCH-
    7b798d readings as validated shape evidence (observations only),
    does NOT budget k=3/5/6 family extension, k=12, third seeds,
    2^32 arms, or a k=2 second seed, and does NOT assert any outcome.
    It authorizes execution of IDEA-20260902-9e84ac under its
    preregistered ordered SH2 cascade, with validator and red-team
    review before ledger recording.

  scoping_adopted:
    id: SCOPE-1
    statement: >-
      JOINT-EFFECT SCOPING (IDEA-20260902-9e84ac R4 resolution):
      under PIN-T0 the key schedule is the AES schedule at EVERY
      interior point k >= 1 and is therefore CONSTANT across
      k in {1,2,4,8,16}; all interior-to-interior comparisons in this
      batch are schedule-clean, and any measured decay of h(k) across
      the interior grid is attributed to table dilution at fixed
      schedule. The schedule-vs-dilution confound attaches only to
      comparisons against identity-schedule counterfactuals (k=0
      anchor comparisons and any PINCTRL-1 control), which this batch
      does not make. Adopted for this batch only.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-e5d753
    - IDEA-20260902-9e84ac
    - TASK-20260902-987716
    - TASK-20260902-e19f39
    - TASK-20260902-525d16
    - TASK-20260902-4be096
    - TASK-20260902-c33c1f
    - TASK-20260902-d79cd0
    - TASK-20260902-8074d8
    - TASK-20260902-a1c61c
    - TASK-20260902-0fc348
    - EV-AES-868db1
    - DEC-20260902-7ad3d9
    - DEC-20260901-6f9de3
    - EV-AES-f2da41

  outcome: >-
    Batch opened. Producer TASK-20260902-987716 executes S0 (build
    identity re-verification, KAT pins, freeze re-verification, r=6
    dead anchor analyzed first, k=0 ramp-zero anchor) and halts the
    in-batch flow on SH2-GATE-FAIL/SH2-F6/SH2-ANCHOR-FAIL; snapshot
    TASK-20260902-e19f39 binds the S0 package. Producer
    TASK-20260902-525d16 gates on the S0 outcome, then executes S1
    (k=16 re-seat first, k=1/k=2/k=8 AMEND-1 re-runs, k=4 first
    measurement, overflow-positive determinism double, post-arm
    audit); snapshot TASK-20260902-4be096 binds S1. Producer
    TASK-20260902-c33c1f gates on the S1 outcome, then executes S2
    (second seeds at k=1 and k=4) and composes the SH2 verdict from
    all readings under the ordered cascade; snapshot
    TASK-20260902-d79cd0 binds S2. Validator TASK-20260902-8074d8
    and red-team TASK-20260902-a1c61c run blind to each other after
    all snapshots; ledger TASK-20260902-0fc348 is the sole archiver
    of both review packages and records EV-AES-868db1 /
    DEC-20260902-7ad3d9.

  rationale:
    - >-
      RANK 1 of DEC-20260901-6f9de3 is exactly this design. It adopts
      AMEND-1 verbatim, localizes the transition with k=4 as a
      load-bearing locator, replicates k=1 and k=4 with second seeds,
      satisfies R3 with an overflow-positive determinism double, and
      re-prices power for the realized regime with priced
      non-detections instead of smoothing.
    - >-
      Joint-effect scoping (SCOPE-1) resolves the R4 confound without
      a new pin decision: the schedule is constant across all interior
      points, so the interior decay question is cleanly answerable;
      the schedule-decomposition question is deferred to PINCTRL-1.
    - >-
      The batch is bounded by the proposal's binding baseline
      (expected ~4.1 h; cap 19800 s total with priced Gate-0x
      fallback; per-stage caps 5400/10000/4400 s; max 8/8/4 runs);
      every stage boundary is a stopping point with a committed
      reading (rule 5).
    - >-
      A claim-changing outcome (SH2-MONOTONE-DECAY, SH2-PLATEAU,
      SH2-DEAD-INTERIOR, SH2-NONMONO, or any anchor/gate indictment)
      gets both validator and red-team before ledger recording; the
      coordinator prior is recorded below before any reviewer runs.

  review_plan:
    prior: >-
      I expect S0 gates/anchors to pass (build is byte-identical,
      zero source change) and the k=16 re-seat to land in band
      [6,30]. The uncertain joints: (1) the k=4 locator — prior
      ~20 hits is a guess extrapolated from a step curve; it may land
      THRESHOLD, AMBIGUITY (41-99), or RESIDUAL and each routes
      differently; (2) second-seed agreement at k=1 given the 12.7M
      saturated reading (relative stability should be high but seed
      variance at this magnitude is unmeasured); (3) the AMEND-1 gate
      itself — first batch run under the rescoped conjunct, so
      counter-identity bookkeeping is new territory. Where I think it
      can break: a counter-identity failure hiding in the overflow
      path, a cascade branch misroute if k=4 lands in the ambiguity
      band, or over-strong attribution language if the decay is
      monotone (SCOPE-1 limits attribution to joint effect).
    joints:
      - joint: arithmetic/gates/AMEND-1 counter bookkeeping
        owner: validator
        attack_plan: >-
          Re-derive per-point hits, excess ratios, and Garwood CIs
          blind for all grid points and both second seeds; verify
          AMEND-1 conjuncts on EVERY analysis-bearing receipt
          (overflow identity hits − threads×CAP, counter internal
          identities incl. ewhist_hit == hits, no analysis quantity
          from the capped detail log); build-identity hashes vs the
          BATCH-7b798d snapshot receipts; anchor-first ordering;
          determinism double byte-identity modulo the timing strip;
          digest/source-diff gates; all three snapshot hashes; render
          the ordered SH2 outcome.
      - joint: interpretation/scope/power/attribution language
        owner: red-team
        attack_plan: >-
          Attack whether the SH2 verdict stays within grid
          {0,1,2,4,8,16}, cell (1,1), r=5, 2^30, PIN-T0, and the
          tested seeds; whether joint-effect scoping is respected in
          every sentence (no dilution-only attribution); whether the
          k=4 locator's branch routing is honest for the realized
          band; whether second-seed agreement is priced correctly;
          whether any language spends BATCH-7b798d observations as
          validation or leaks into the closed X lane/carrier claims;
          whether the SH2 cascade still overlaps at the realized
          readings.
    blindness:
      declared: true
      lifted_for: null
    proves_too_much: >-
      The r=6 dead anchor (F6) and the k=0 ramp-zero anchor are the
      built-in proves-too-much controls; the AMEND-1 gate must
      additionally PASS the ramp-zero receipt (overflow 2^30 − 1024,
      identities exact) — if it fails that receipt, the gate itself
      is indicted before any interior reading.
    blind_rederivation:
      required: true
      blind_from: producer implementation and run report; validator derives from proposal, AMEND-1 statement, and committed receipts only.

  next_action: >-
    Execute the queue. On SH2-MONOTONE-DECAY: excess decays jointly
    with dilution across the interior grid at fixed schedule
    (SCOPE-1 attribution); claim-changing review, then decay-rate /
    family-extension successors. On SH2-PLATEAU / SH2-NONMONO /
    SH2-RESIDUAL: named successors, no verdict beyond the branch. On
    SH2-DEAD-INTERIOR: scoped extinction statement inside measured
    floors with obstruction record. On SH2-SEED-DISAGREE: replication
    failure, repair before any verdict. On gate/anchor branches:
    halt/indictment per cascade, never a shape reading. PINCTRL-1
    stays deferred regardless of outcome.

  evidence_refs:
    - ledger/proposals/IDEA-20260902-9e84ac.yaml
    - ledger/decisions/DEC-20260901-6f9de3.yaml
    - ledger/evidence/EV-AES-f2da41.yaml

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Batch-opening, SCOPE-1 adoption, and queue dispatch create no
      scientific result suitable for knowledge promotion.

