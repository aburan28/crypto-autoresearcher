coordinator_decision:
  id: DEC-20260731-027
  context: >-
    Authorization of the GOAL-AES-001 BATCH-003 dispatch queue, and adoption of
    protocol-amendment-GOAL-AES-001-003, which changes the ACCOUNTING BASIS of
    the campaign budget from declared to measured wall clock WITHOUT moving the
    20000 s ceiling. The BATCH-003 queue was written on the committed
    DEC-20260731-013 checkpoint (BATCH-002 closed and verified: snapshot
    ebac9ba8, index 50a0bec7, ledger d4f7a7e0, goal checkpoint 5fcb2269;
    latest_verified_commit d4f7a7e0). Its five tasks were declared at 5000 s
    total, calibrated against measured rather than conservative time — 1.86x
    below BATCH-002's 9300 s declaration for a comparable package — and the
    queue was nonetheless marked NOT DISPATCHABLE by its own budget_note,
    because only 2600 s of DECLARED headroom remained against the standing
    ceiling. The Coordinator refused to shrink the work to fit, named two
    admissible resolutions, and took neither. The dispatching session rendered
    the plan (exit 0, all 10 gates pass, ready tasks TASK-20260801-801 and
    TASK-20260801-802, declared total 5000 s) and ruled for option B under the
    user's standing instruction to continue running the harness, recording the
    ruling as reversible and disclosing it as such. THIS DECISION CONCERNS A
    RESOURCE COUNTER AND A DISPATCH AUTHORIZATION. IT ASSERTS NOTHING ABOUT AES.
  decision: approve
  target_ids:
    - GOAL-AES-001
    - protocol-amendment-GOAL-AES-001-003
    - protocol-amendment-GOAL-AES-001-002
    - TASK-20260801-801
    - TASK-20260801-802
    - TASK-20260801-803
    - TASK-20260801-804
    - TASK-20260801-805

  id_provenance: >-
    DEC-20260731-014 IS RESERVED for the TASK-20260801-805 BATCH-003 ledger
    archive and is NOT consumed here. This decision takes the next free ID after
    that reservation, verified free by directory listing of ledger/decisions at
    authoring time: DEC-20260731-013 is the highest existing record and no
    DEC-20260801-* record exists on this tree. The 20260731 series is continued
    rather than opening a 20260801 series, following the reservation the
    dispatching session had already made for -014; the authoring date is
    2026-08-01 and is recorded in decided_at rather than smoothed into the ID.
    If a concurrent branch has published DEC-20260731-027 by merge time, the
    collision is resolved by a CORR record reallocating this ID forward — never
    by editing a committed record (the CORR-20260731-005 precedent);
    CORR-20260731-006 is the next free correction ID.

  why_this_is_a_decision_record_and_not_only_an_amendment: >-
    A judgement was required here and is recorded rather than assumed. The
    mechanical ID remap of BATCH-002 was correctly handled by CORR-20260731-005
    ALONE, with no decision record, because it changed no content, claim, scope,
    status or authorization: the same records under different identifiers. This
    is different on both counts that matter. First, it CHANGES WHAT THE CAMPAIGN
    IS AUTHORIZED TO DO NEXT — a queue that was NOT DISPATCHABLE becomes
    dispatchable, and three producers and two archives are approved to run.
    Approving work is a Coordinator decision under agents/coordinator.md and
    belongs in the ledger, not only in a coordination/ artifact. Second, the
    campaign's own goal record already binds amendments to decisions:
    protocol-amendment-GOAL-AES-001-001 carries decision_ref DEC-20260731-012,
    and leaving amendment 003 with a null decision_ref would put the ledger's
    account of the binding resource constraint in coordination/ only. By the
    same test, protocol-amendment-GOAL-AES-001-002 (the D-704-1 provenance gate)
    needed NO separate decision of its own: it authorizes nothing new, changes no
    resource, and only tightens a bookkeeping gate prospectively — it is
    approved here as part of the batch rather than given a record it does not
    need.

  rationale:
    - >-
      THE CEILING DOES NOT MOVE, AND THAT IS THE POINT. 20000 s stays 20000 s.
      This decision buys the campaign NO additional research scope, NO additional
      claim tier, and NO additional authority. It changes only which of two
      already-recorded numbers — declared or measured — is charged against a
      ceiling that is unchanged. Anyone reading this record as a second budget
      increase has misread it.
    - >-
      THE DEFECT BEING FIXED IS THE COUNTER, NOT THE ALLOWANCE. The campaign has
      declared 17400 s and actually consumed 9243 s. Charging declarations
      against the ceiling has now blocked two consecutive batches on a number the
      campaign never spent. protocol-amendment-GOAL-AES-001-001 resolved the
      first occurrence by raising the ceiling and warned in its own text that the
      declared-to-measured ratio was a reason to calibrate declarations down, not
      a licence to inflate them; BATCH-002's queue recorded the same standing
      limit; BATCH-003 then did exactly that, declaring 5000 s where BATCH-002
      declared 9300 s for a comparable package, and STILL did not fit. Option A
      would have raised the ceiling a second time and left the defect in place
      for a third occurrence. Option B removes it.
    - >-
      THE CALIBRATION AND THE SCOPE WERE HELD APART, AND BOTH SURVIVED. The
      Coordinator was asked to calibrate declarations down without cutting work,
      and did both things separately: declarations fell 1.86x at comparable
      scope, and the two ranked items DEC-20260731-013 made preconditions were
      left intact. Neither TASK-20260801-801 (the only exponent-relevant item,
      which also repairs the control of the campaign's only closure) nor
      TASK-20260801-802 (without which DEC-20260731-011's condition on
      certifying any reduced-round measurement stays undischarged) was reduced.
      Shrinking either to fit a measurement artefact would have been quiet scope
      reduction, and the refusal to do so is what forced this ruling rather than
      absorbing it.
    - >-
      PER-TASK LIMITS ARE NOT RELAXED, WHICH IS WHAT KEEPS THE NEW BASIS FROM
      BECOMING OPEN-ENDED. Declared per-task budgets remain BINDING STOP
      CONDITIONS: a task that reaches its declared wall_clock_seconds halts, and
      that halt is infrastructure signal, never a negative mathematical result
      (AGENTS.md rule 5). No task gains a second of running time from this
      decision. A completed task whose duration was not reported is charged at
      its DECLARED budget, so the campaign cannot under-charge itself by failing
      to measure.
    - >-
      THE WEAKNESS OF THE NEW BASIS IS RECORDED RATHER THAN HIDDEN. The measured
      figures are task durations REPORTED BY THE DISPATCHING SESSION. There is no
      instrumented timer in this repository and no timing artifact is committed,
      so a later session cannot re-derive them from the tree, and there is no
      independent second measurement. The declared basis being replaced was, on
      this one axis, STRONGER: declarations live in committed queue records and
      are checkable. That is a real cost of this ruling and it is stated in the
      amendment's limitations, in the goal record's accounting note, and here.
    - >-
      THE RE-BASING EDITS NOTHING. Under the new basis BATCH-001 and BATCH-002
      are charged 9243 s rather than 17400 s, but no run record, receipt,
      evidence record, decision, queue or checkpoint is altered. BATCH-001's
      declared 8100 stands as declared and its measured 3231 stands as measured;
      likewise BATCH-002. Records are immutable and none was touched
      (AGENTS.md core rule 4).
    - >-
      THE PROVENANCE AMENDMENT IS APPROVED AS PART OF THIS BATCH.
      protocol-amendment-GOAL-AES-001-002 discharges the third ranked item of
      DEC-20260731-013's next action — the TASK-20260731-705 recommendation on
      D-704-1 — PROSPECTIVELY and never retroactively. It is deliberately not a
      task card: it has no research content and no uncertainty for a producer to
      reduce, and routing it through producer, snapshot, review and ledger would
      have cost more than the rest of the batch. It adopts BOTH forms the
      validator offered rather than choosing between them, because they fail in
      different directions, and it states the requirement in IDENTICAL LANGUAGE
      in the producer cards and the snapshot card — the drafting divergence being
      the actual D-704-1 fault. It is committed with the queue, before any
      producer runs, because a gate that is uncommitted when the card is issued
      is the retroactive enforcement it refuses. No BATCH-001 or BATCH-002
      artifact is failed under it.
    - >-
      NO RESEARCH STATE MOVES ON THIS DECISION. No hypothesis status changes —
      none exists for this campaign. No evidence record is created or
      reinterpreted. No lane is closed and none is reopened. PROP-701-I remains
      RECORDED, NOT PROMOTED, and NOT OFFICIAL, and no reject_scoped of the
      round-independent single-word deterministic class may be considered until
      the redesigned GATE-701-C returns a discriminating result confirmed on the
      independent validator's own re-run. GATE-601-A remains NOT dispatched.
    - >-
      NOTHING IN THIS BATCH MAY BE TREATED AS A CLOSURE ATTESTATION. Under
      inference-amendment 0137a051 cross-model independence remains unavailable
      campaign-wide; TASK-20260801-804 supplies SESSION independence and NOT
      MODEL independence. GOAL-AES-001 stays `active`, `completed` is unreachable
      in this harness regardless of outcome, and NO attestation is recorded.

  budget_accounting_after_this_decision:
    total_wall_clock_seconds: 20000
    basis: measured_wall_clock_of_completed_tasks
    prior_basis: sum_of_declared_per_task_budgets
    charged_to_date: 9243
    batch_001: {declared: 8100, measured: 3231, ratio: "2.51x"}
    batch_002: {declared: 9300, measured: 6012, ratio: "1.55x"}
    batch_003_declared: 5000
    batch_003_declared_breakdown:
      TASK-20260801-801: 1500
      TASK-20260801-802: 900
      TASK-20260801-803: 300
      TASK-20260801-804: 1500
      TASK-20260801-805: 800
    worst_case_total_if_every_task_runs_to_its_full_declaration: 14243
    expected_at_this_campaign_s_historical_ratio: >-
      approximately 12000 of 20000. An expectation from two observed batches,
      with no evidential status.
    standing_limit: >-
      The ceiling is real and still binds. A FURTHER AMENDMENT IS REQUIRED if
      MEASURED consumption approaches 20000. Reaching it without one triggers the
      declared pause condition; it does not authorize silent overrun, and an
      overrun is not a research result. maximum_batches remains 6 and is an
      independent constraint this decision does not touch: BATCH-003 is the
      third of six, and the campaign can still run out of batches while under the
      time ceiling.

  evidence_refs:
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-003.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-001.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/dispatch_queue.json
    - ledger/handoffs/TASK-20260801-801.yaml
    - ledger/handoffs/TASK-20260801-802.yaml
    - ledger/handoffs/TASK-20260801-803.yaml
    - ledger/handoffs/TASK-20260801-804.yaml
    - ledger/handoffs/TASK-20260801-805.yaml
    - ledger/decisions/DEC-20260731-013.yaml
    - ledger/decisions/DEC-20260731-012.yaml
    - ledger/evidence/EV-AES-002.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/validation_report.yaml
      (referred_defect_rulings D-704-1, the basis of amendment 002)
    - >-
      Dispatching session render of the BATCH-003 plan: `python3
      tools/research_dispatch.py` exit 0, all 10 gates pass, ready tasks
      TASK-20260801-801 and TASK-20260801-802, declared total 5000 s.
    - >-
      Measured per-task durations reported by the dispatching session; no timing
      artifact is committed to this repository.
    - "BATCH-002 verified commits: snapshot ebac9ba8, index 50a0bec7, ledger d4f7a7e0, goal checkpoint 5fcb2269"

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES. No distinguisher, no key
      recovery, no speedup, no structural excess, no barrier statement, at any
      round count. It concerns a resource counter, a provenance gate, and a
      dispatch authorization.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security
      of any system that uses AES. The claim-tier ceiling is unchanged at toy /
      reduced-round.
    - >-
      The measured figures underpinning the new accounting basis are REPORTED,
      not instrumented, and are not independently re-derivable from this
      repository. The basis is only as trustworthy as that reporting.
    - >-
      The 2.51x and 1.55x ratios come from two batches. They establish that
      declared-second accounting systematically over-charges THIS campaign; they
      are not a conversion factor and must not be used as one.
    - >-
      Approving a queue authorizes work; it does not predict, and does not in
      any degree support, any outcome of that work. TASK-20260801-801 may
      legitimately conclude that the redesigned gate STILL does not discriminate,
      which is a complete and valuable outcome and is not a failure of this
      batch.
    - >-
      This ruling was taken by the dispatching session under a standing
      instruction to continue running the harness, and is recorded as
      REVERSIBLE. It is not a user approval of anything beyond its own terms.
    - >-
      GOAL-AES-001 is NOT completed and is not proposed for completion. No
      completion criterion is met and NO attestation is recorded; cross-model
      independence is unavailable campaign-wide under inference-amendment
      0137a051.

  next_actions:
    - >-
      Commit protocol-amendment-GOAL-AES-001-002, protocol-amendment-GOAL-AES-001-003,
      this decision, the superseded BATCH-003 dispatch queue, the five BATCH-003
      handoff records and the updated GOAL-AES-001 checkpoint in one isolated
      coordination commit — BEFORE any BATCH-003 task runs, because the producer
      cards cite amendment 002 as a completion gate — then dispatch
      TASK-20260801-801 and TASK-20260801-802 concurrently. The batch then closes
      through the snapshot archive TASK-20260801-803, the independent validation
      TASK-20260801-804 and the ledger archive TASK-20260801-805, which reserves
      EV-AES-003 and DEC-20260731-014. Record each completed task's MEASURED
      wall clock, since that is now the charged quantity; an unreported duration
      is charged at its declaration.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, and not deferred. This is a budget-accounting and dispatch
      decision on which no evidence was reviewed, no evidence record was created,
      and no evidence strength was assigned; there is no durable claim of any
      kind to promote, and the knowledge corpus records mathematical findings,
      not resource bookkeeping. The BATCH-003 promotion question is a separate
      one and belongs to DEC-20260731-014 at the TASK-20260801-805 ledger
      archive, where KN-FIND-018 is RESERVED but deliberately NOT declared as an
      archive artifact — precisely so that no promotion pressure is created for a
      batch whose honest headline may be that the redesigned gate still does not
      discriminate.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim is advanced by this decision or authorized
      by it. The four promotion gates of agents/coordinator.md are NOT ENGAGED
      and are named here so a later batch cannot quietly bypass them: (1) an
      archived proof decomposition into single-responsibility lemmas with the
      main theorem assembling them under explicit per-attempt-cost x
      inverse-success-probability bookkeeping; (2) every conditional dependence
      stated as an explicit numbered heuristic with archived validation evidence
      or a scheduled validation experiment; (3) a concrete-cost table at
      standardized parameter sets with honest accounting of superpolynomial
      overhead hidden in o(1) terms, memory, time-memory tradeoffs and
      parallelization, optimistic assumptions flagged, and an explicit
      affected-vs-safe scope statement; (4) independent review-xhigh review per
      AGENTS.md rule 12 plus a red-team pass on the cost model and heuristics. A
      claim missing any gate may reach `analyzed`, NEVER `supported`. Should
      TASK-20260801-801's OD-1 work be carried toward a bound on branching factor
      as DEC-20260731-013 anticipated, all four engage immediately.

  decided_by: coordinator
  decided_at: '2026-08-01'
