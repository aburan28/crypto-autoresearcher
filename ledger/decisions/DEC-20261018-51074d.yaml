  decision: open_bounded_prime63_m2_diagnostic_integration_batch
  decision_scope: >-
    Assign only a zero-scientific-trial implementation of an admission-bound,
    phase-traced prime63 m=2 diagnostic launcher, raw custody, independent checker,
    and negative tests. The three scientific cells in the archived proposal remain
    unapproved until a new exact experiment packet passes preapproval and the
    archive and ready-selector requirements.
