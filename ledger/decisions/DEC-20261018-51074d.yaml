  rationale:
  - >-
    The monitor-phase driver is synthetic-only; the instrumented backend's
    approved-launch JSON is a prospective self-contained format, not a repository
    authorization. No launcher currently binds the new phase source to an approved
    plan, ready selector, live owner/epoch claim, exact requests and raw archive.
  - >-
    The previous 27-cell checker expects its old schedule and response shape.
    A new checker must independently verify exact equations, full curve points,
    signs, factor-base membership and target sum for the fixed three-cell scope,
    and classify missing responses with phase trace as bounded censor or fault.
  - >-
    All three m=2 positives were time-censored at 300 seconds in the sealed run;
    a phase-traced 600-second diagnostic is the smallest next scientific question.
    The engineering task itself launches no such call.
  prospective_diagnostic: >-
    Fixed coset quadratic-lift, random direct and small_x direct planted m=2
    cells in that order, one synthetic monitor-fault null first; 600 seconds,
    8 GiB sampled tree RSS, 8 GiB scratch and model cap 64 per scientific call;
    2100-second total cap, one worker, 16 GiB initial scratch and stop below
    8 GiB free. A separate exact 475^2=225625 ordered-pair full-point
    enumeration may serve as an independently charged correctness control
    if frozen in the successor protocol. None of these calls is approved here.
  completion_gate: >-
    Exact source and input hashes, repository admission and selector before any
    scratch/output/Sage side effect, trace-aware raw custody, independent
    full-point checker, and synthetic/negative tests are archived. Then the
    Coordinator constructs an exact fresh-ID packet and requires
    experiment_preapproval.py approvable:true before approval or dispatch.
  official_transitions:
