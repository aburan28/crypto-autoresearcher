coordinator_decision:
  id: DEC-20260908-2b80aa
  context: >-
    Review readiness of the pending operation-counter experiment
    EXP-ECDLP-9cd134 under RQ-SDEG-001 and GOAL-SDEG-001. The original
    design lacks executable counting/algorithm/sample/statistical definitions
    and must preserve the governing full S3/S4, baseline, certificate and
    independent-protocol-review interfaces before implementation is permitted.
  decision: revise
  target_ids: [EXP-ECDLP-9cd134, H-ECDLP-c9e189]
  task_id: TASK-20260908-2e3475
  batch_id: BATCH-6b157b
  decided_by: coordinator
  decided_at: '2026-09-08'
  user_authorization: Standing AGENTS.md authorization dated 2026-09-06 is satisfied. The revision concerns technical readiness and governing independent review, not a need for another user approval or funding decision.
  rationale:
    - The governing question explicitly prohibits implementation or experiment before independent protocol review. A design-only conversion and preliminary theoretical design PASS do not establish that review or discharge current verifier/fixture/activation gates.
    - Preserve the full ten-cell S3/S4 ladder and original at-least-four-size/at-least-twenty-instance study, workload multipliers, load levels, primitive types, matched curve-free systems and governing rho/BSGS/certificate/conservation controls. Synthetic counter checks or S3-only work cannot substitute for that scope.
    - The inspected measurement times only the SymPy Gröbner call. Enumeration, lifting, point-sum verification and other preparation/checking work are outside that timer; it is not a full decomposition cost or governing stage vector.
    - The solver method/version/domain and hook boundaries are not pinned. Actual installed-source inspection exposes arithmetic bypass/double-count paths and mutable default method selection, so a simple multiplication wrapper is not established complete instrumentation.
    - Seed/count reconciliation, exact calibrator definitions for M/S/I/A, fixed weights, curve-free generation, load schedule, boundaries and full artifacts remain missing. No actual numerical choices or hook coverage should be fabricated to label the protocol ready.
    - The proposed agreement and disagreement rules overlap. A prospective paired-delta equivalence rule with mutually exclusive outcomes is required, while preserving marginal disjointness as a diagnostic and all original finite measurement targets.
    - Full-scope completion is ranked ahead of doing nothing because portable typed cost accounting can improve this lane's reproducibility. Readiness defects justify repairing that protocol, not rejecting its mechanism or choosing an easier substitute.
  disposition_scope:
    administrative_readiness_revision: true
    scientific_rejection: false
    hypothesis_status_change: false
    experiment_status_change: false
    goal_status_change: false
    implementation_authorized: false
    scientific_execution_authorized: false
    mechanism: Retain the proposed counter/scaling mechanism as speculative and unverified; no experiment, proof or negative scientific result occurred in this review.
    historical_preservation: Original H/EXP/IDEA/goal/protocol/evidence bytes remain unchanged. Later completion uses allocated additive successor/amendment records and an explicit scope/authority decision where required.
  governing_gates:
    - Complete the full scientific contract and a preregistered independent protocol-review plan before implementation, as required by RQ-SDEG-001.
    - Use genuine independent sessions and the required policy; an old authorized fallback or a verifier function name is not equivalent evidence of independence.
    - At later activation, assess current decisions, verifier hashes, sealed fixtures/schedules and all governing residuals from contemporary source-bound artifacts; do not infer their current status from historical notes.
    - After permitted implementation and actual review/admission, a separately locked, claimed and archived execution plan is still required. No zero-run code-preparation shortcut bypasses the question's protocol-review-first gate.
  repair_contract:
    path: coordination/design/BATCH-6b157b/repair-contract.yaml
    required_items: [R1_AUTHORITY_AND_SOURCE, R2_FIXTURES_AND_PANEL, R3_ALGORITHM_AND_DOMAIN_PINS, R4_COUNTER_SEMANTICS, R5_ALL_TYPE_CALIBRATION, R6_CURVE_FREE_MATCH, R7_SEED_AND_COUNT_RECONCILIATION, R8_TIMING_LOAD_AND_BOUNDARY, R9_PAIRED_STATISTICS, R10_FULL_RESOURCE_VECTOR, R11_CERTIFICATES_AND_CONSERVATION, R12_RUNTIME_AND_ARTIFACTS]
    boundary: This is a precise full-scope completion contract, not an already frozen scientific specification or proof that its implementation is feasible/complete. Actual solver/backend, fixture, calibration, weights and job-table bindings must be established before readiness approval.
    sequencing_clarification: Design acceptance for R1-R12 requires fixed algorithms, controls, procedures, source-backed hook semantics, interfaces and acceptance tests, including the independent verifier and runtime contracts. Actual newly written verifier/code hashes, realized fixtures and observed runtime receipts are later implementation/activation evidence; they are not prerequisites for independent protocol review. Future hashes bind outputs of fixed choices and do not defer those choices. The repair contract's stage_gate_mapping governs this distinction.
  source_bindings:
    packet: coordination/design/BATCH-6b157b/source-packet.json
    supplement: coordination/design/BATCH-6b157b/source-supplement.json
    claim_commit: 32a367f3db
    archive_owner: TASK-20260908-2fe267
    access: Parent actually read the transmitted original records, full question/goal/evidence, specified governing scaling blocks, harness/semaev.py and selected toycurve/installed SymPy segments. This Coordinator used those excerpts without executing source commands or scientific code.
    coverage_limit: The scaling-protocol read covered the identified governing blocks, not every line. The successor must bind any additional required source sections before claiming interface completeness. Scoped owner/approval searches are not a global absence audit.
    exact_archive_gate: Parent verifies all source-receipt hashes, archives the exact decision/review/repair files and validates the assembled ledger. No final snapshot hash or independent-review receipt is invented in advance.
  evidence_refs:
    - coordination/design/BATCH-6b157b/source-packet.json
    - coordination/design/BATCH-6b157b/source-supplement.json
    - ledger/proposals/IDEA-20260815-66496a.yaml
