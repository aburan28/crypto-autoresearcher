      provenance: internal
      verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
      scope: Actual parent source reads and hashes supporting the described readiness defects and governing scope; no executed SDEG package or current global gate state inferred.
