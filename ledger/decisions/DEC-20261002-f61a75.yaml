    - id: R-PRODUCER-COMPUTE
      subject: computations the session may run for a producer with no shell (stated in advance; DEC-20260929-4c7ffc R-PRODUCER-COMPUTE form)
      ruling: >-
        Stated on the producer card and limited to: C-1 extract each committed
