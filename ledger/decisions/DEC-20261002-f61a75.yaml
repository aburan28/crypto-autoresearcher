    - id: R-LESSONS
      subject: procedure lessons carried into the cards and the plan (opening brief section 6; 54dcd8 prior_versus_outcome)
      ruling: >-
        (1) Concurrent and serial reviewers: a launch prompt names only the
        card and the private scratch path; the session never paraphrases a
        returned report, or the plan's attack text as modified by a returned
        report, into a later reviewer's prompt. Plan text that names an
        attack is quoted, never summarised from a sibling. (2) Pre-gate
        digests: the snapshot records each producer file's whole-file sha256
        as its first act, before any other step, and re-hashes immediately
        before the commit; any difference is a stop. (3) Git refs: any branch
        head is read from origin/<branch>, never FETCH_HEAD. (4) Arms coded by
        name: J2 checks that every cell (CTRL-ZN, BIN-ORD-19, BIN-KOB-19) and
        arm (reuse, null, rho) is selected in the committed code by name, not
        by an offset that varies with a parameter; J3 checks that each
        declared arm reaches its declared outcome as coded. (5) False PASS as
        well as false FAIL: the J3 attack sweeps both (the 54dcd8 lesson).

