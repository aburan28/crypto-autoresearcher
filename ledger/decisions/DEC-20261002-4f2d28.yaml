      fixtures/exercise-log-after-D7.json), field by field, using the logs
      themselves and the v3 harness output as a cross-check. Equality
      lemma used for the 29 steps v3 already found identical: v3's
      normalisation is H1 + H2 + H4 + H6 with exactly CR-4's patterns, applied
      to all eight fields; CR-4 adds functions applied identically to both
      sides (H3, H5, H7 at 35/38) and coarsenings of list equality (H8
      multisets, H9 suffixes), so a pair equal under v3 is equal under CR-4.
      No CR-4 class can create a failure where v3 found none.
    b3_2_archived_per_step:
      - "step 1 (jobs R10 list): PASS. Identical under v3; label, exit 0/0, check '45 R10 jobs', stdout '45 jobs, 838 expected instance keys' exact."
