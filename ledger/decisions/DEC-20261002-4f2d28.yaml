  amb_b3_2_pid_ruling:
    grounds_stated_before_deciding: >-
      Three grounds, stated before choosing and applied option by option in
      AMD-20261002-f3fa33 ruling_grounds: fidelity to the intent of c7ccde
      B-2/B-3 (exclude host measurements, keep every result; a fresh
      re-verification that a correct unchanged copy passes and a wrong one
      fails); test-harness honesty (the ignored tokens are named in advance
      as a closed list, and the harness proves on planted changes that it
      ignores host tokens and detects result tokens); no weakening of
      scientific identity (every result token stays under exact identity).
      Speed and favourability were not criteria.
    class_diagnosis: >-
      All three stops share one cause. Each identity clause this Coordinator
      wrote (A-3 "except timestamps and paths"; A-4 (3) "except created_at,
      timing and path fields"; B-2 "every other printed or written value")
      named exclusions as an open list read against an unbounded remainder,
      without enumerating which tokens of each recorded field depend on the
      run, and without testing the clause on the archived logs before issue.
      Any run-dependent token the author did not think of then becomes a stop
      that only judgment could clear. The repair is structural: one closed
      specification of host/provenance token classes, with step-restricted
      structural classes, exact identity on everything else, controls, and a
      paper walk-through recorded below before issue.
    ruling: >-
      OPT-A IN GENERALISED FORM, made precise and versioned by the additive
      amendment AMD-20261002-f3fa33 (protocol v3 -> v4), APPROVED HERE. CR-4
      (C-1) is the single comparison rule for c7ccde B-3 (2), (3), (4) and
      AMD-20261002-280481 A-4 (2), (3). Process ids are class H5; the
      calibration digest at steps 35 and 38 only is class H7; cmd stays under
      identity except H2, H3, H4 and H7. Step 31 is judged by C-2, B-1 made
      exact plus identity with the archived a3 record. The harness must pass
      ten positive-and-negative control pairs before any verdict (C-3). The
      copy is pinned AS BUILT (e80f6d6c...) in implementation-notes-f3fa33.yaml
      after C-4 (1)-(4) pass. OPT-B (weakens identity on tail-only results)
      and OPT-C (makes the correct copy unpinnable) are not taken.
    amendment_written: AMD-20261002-f3fa33 (experiments/EXP-PFDR-011cd0/amendments/AMD-20261002-f3fa33.yaml), protocol v3 -> v4, approved by this decision
    unchanged: >-
      AMD-20261002-280481 A-1 (a)-(e) including the code stop, A-2, A-4 (1),
      (4), (5), (7), A-5, A-7; c7ccde B-1's expected result for step 31 and
      B-6; specification.yaml v1; every threshold, prediction, cell, seed,
      gate and machine limit; the A-3 copy's bytes
    pre_data: >-
      Yes. The changed rules are comparison rules on synthetic fixtures and
      equality checks; no census quantity or real-archive P0 input has been
      computed or seen by anyone in this line.

