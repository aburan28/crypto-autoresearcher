coordinator_decision:
  id: DEC-20261007-8373ab
  context: >-
    Design of IDEA-20261006-9d9d22 under RQ-SSI-001 / GOAL-SSI-001.
    Standing authorization of 2026-09-06 would approve a complete
    runnable protocol. This contract is specified and can fail. The
    F_{43^2} self-isogeny lambda census is not in the tree, and the
    goal is already at the approval-capacity cap. The same pass files
    three proposals and does not design them.
  decision: revise
  target_ids:
    - H-SSI-8a695a
    - EXP-SSI-018d89
    - IDEA-20261006-9d9d22
    - IDEA-20261007-c82c8f
    - IDEA-20261007-ccbc3d
    - IDEA-20261007-b1e64d
  rationale:
    - >-
      The prediction is the idea's own: success is
      |lambda(j1) - lambda(j2)| >= 1 with both values in
      {0, 2, 3, 5, 7, 11} and the census defined. The negative outcome
      is lambda(j1) = lambda(j2), including (0, 0). Those criteria
      differ, and decision_impact.on_positive differs from on_negative.
      The question id is RQ-SSI-001.
    - >-
      Approval is not recorded. The missing driver is a program that
      builds F_{43^2} with the smallest positive quadratic nonresidue
      d modulo 43, scans j in order of b then a, and writes lambda_j1
      and lambda_j2 for ell in {2, 3, 5, 7, 11}.
      harness/isogeny_class.py velu_odd refuses even ell, including
      ell = 2. harness/endosweep/explicit.py division_polynomials
      takes one prime-field model and does not scan F_{43^2}.
    - >-
      check_approval_capacity would also reject an approving decision.
      python3 tools/portfolio_kpis.py --capacity GOAL-SSI-001, run in
      this worktree against origin/main, reports approved_unrun=6,
      cap 3, headroom 0, holding EXP-SSI-001, EXP-SSI-697354,
      EXP-SSI-6a2619, EXP-SSI-9b542d, EXP-SSI-db46fa, and
      EXP-SSI-eca132. The contract names goal_id GOAL-SSI-001, so that
      is the capacity key. Status stays review_required. approved_by
      stays null. This decision is revise, not approve.
    - >-
      The copied proposal bytes match git blob
      993eb882b3141dc8ddb3d2566d3f9584d61c06f4 and parsed as YAML with
      no quote change. No run was launched and no executor was
      dispatched.
  limitations:
    - No run was launched. No executor was dispatched.
    - The inequality is untested. This decision is not evidence.
    - The three new proposals are not hypotheses and are not approved experiments.
  next_actions:
    - >-
      After GOAL-SSI-001 is under the approval cap, bind the F_{43^2}
      self-isogeny lambda census named in the missing_driver field,
      then re-check python3 tools/newest_experiments.py --experiment
      EXP-SSI-018d89 before any approval decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No run and no evidence record. A review_required contract does
      not promote a knowledge entry.
  decided_by: coordinator
  decided_at: '2026-10-07'
