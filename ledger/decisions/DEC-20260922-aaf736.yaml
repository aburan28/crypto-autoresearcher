coordinator_decision:
  id: DEC-20260922-aaf736
  context: >-
    Design approval for the one-edge rebuilt-versus-pullback test of
    RQ-DREG-c8ae8d. Standing user authorization of 2026-09-06. This decision
    does not assert that H-DREG-45c58f is true.
  decision: approve
  target_ids:
    - H-DREG-45c58f
    - EXP-DREG-d76c97
    - IDEA-20260922-221a70
    - RQ-DREG-c8ae8d
  rationale:
    - >-
      IDEA-20260922-221a70 is the next justified open DREG control. A class
      census that calls the pullback an explosion cannot be read until this
      edge separates the ell multiplier from a change in the rebuilt system.
      IDEA-20260922-805a59, IDEA-20260922-f7de2a, and IDEA-20260922-fac3e7
      stay proposed and are not approved here.
    - >-
      The contract is not a duplicate of EXP-DREG-c3e8c9. That contract is a
      characteristic-2 boolean graph ideal. This one is an odd-prime
      short-Weierstrass model and the new_falls meter.
    - >-
      The proposal's phrase "ell coprime to the group order" is impossible
      for a rational kernel of order ell. The frozen gate is ell divides the
      point count and gcd(ell, N_E) = 1, where N_E is the largest prime
      factor of that count.
    - >-
      Before approval, the falsification sentence was made decidable. Label
      C, label N, and a recorded degree table whose ratio is not ell are
      falsification. Label U with no accepted degree table is neither success
      nor falsification. Label U unmatched with every ratio equal to ell
      falsifies nothing about the ideals. A later rank failure does not
      erase a degree table that already withdraws HEUR-45c58f-H2.
    - >-
      Success requires label M, every cleared ratio equal to ell, the gauge
      vector equal to E, and every required matrix finished. The search stops
      at the first accepted edge inside primes 101 through 211, or at label
      U with reason no-edge. It does not rerun the screen closed by
      DEC-20260716-003.
    - >-
      Budget fields that are null are advisory under
      docs/research-budget-policy.md. maximum_memory_gb 4 and maximum_runs 1
      are machine protection and the scientific sample count.
  evidence_refs: []
  limitations:
    - Approval is protocol completeness, not evidence.
    - One toy edge. No exponent claim. Not outcome O1, O2, or O3.
  next_actions:
    - >-
      Execute EXP-DREG-d76c97 under TASK-20260922-d74b17 only after
      TASK-20260922-cf67f3 is committed and its receipt verifies. Do not
      launch that executor in the approval commit.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An approval of an unexecuted protocol creates no finding. Nothing is
      promoted.
  decided_by: coordinator
  decided_at: '2026-09-22'
  user_authorization: >-
    AGENTS.md standing authorization, 2026-09-06, that complete idea and
    experiment protocols are approved without a further user confirmation.
