    batch-halting finding, but three specific findings (ANOM-1, and defects
    D2/D3) require an explicit Coordinator ruling rather than a pass-through.
    This decision makes those rulings, closes the batch, and records the
    obstruction ANOM-1 measures as this batch's licensed research result.

  findings:
    - id: F-1
      text: >-
        ROUND VERDICTS. Red team (TASK-20260821-67a1b6, resolved model
        claude-sonnet-5, xhigh, independent session): round_verdict
        holds-with-named-gaps. Joints K2 (gate fidelity / MD5-scope
        compliance), K3 (certificate re-derivation), K5 (cost-model
        honesty), K6 (claim-tier ceiling) all HOLD, independently re-derived
        from primary run artifacts, not narrative. K1 (proof_search_map
        completeness) and K4 (heuristic-validation statistical honesty) HOLD
        WITH NAMED GAPS -- both surfaced ANOM-1 or its consequences as a
        structurally more significant finding than the Coordinator's
        pre-recorded prior anticipated (coordinator_prior_comparison), no
        joint's verdict LABEL was overturned. All three proves-too-much
        objects (unbounded certificate, MD5 scope creep, mislabeled cost
        figure) correctly rejected. Blind re-derivation of the bounded-
        certificate-eligibility predicate agreed with the record's own
        bottom-line eligibility conclusion. Validator (TASK-20260821-1601d6,
        resolved model claude-sonnet-5, xhigh, independent session):
        determination HOLDS-WITH-NAMED-GAPS -- 6 of 7 mechanical checks pass
        cleanly (RFC vectors, certificate re-derivation, wrapper timing,
        heuristic-validation statistics, MD5-scope compliance, cost-scaling
        labeling); check 7 (no-regression suite) carries one named, strongly
        (but not exhaustively-bisected) environmental gap on a pre-existing,
        out-of-scope test failure. ANOM-1 independently CONFIRMED by the
        validator via four separate methods, none resting on the Executor's
        narrative. Both determinations agree; no fabrication, missing
        artifact, or unrecomputable statistic was found by either.
    - id: F-2
      text: >-
        ANOM-1 RULING -- H-MDFIVE-bf7767 IS WEAKENED. The frozen hypothesis's
        mechanism statement asserts that chunk2's backward-computed value of
        the declared matching quantity (register A immediately after step 9)
        "is a function of free word9." This is proven FALSE for the frozen
        construction (split point S=9, matching quantity = register A after
        step 9, read from backward_step's tuple position 1): word9 is first
        used at step 10 by the RFC's own sequential word schedule, so nothing
        computed at or before step 9 can depend on it. This was independently
        re-derived -- not merely re-checked -- by the Executor, the red team
        (via a from-scratch hand algebra of backward_step's return tuple plus
        a stronger 50-sample empirical sweep with a word8 positive control),
        and the validator (via independent from-scratch simulators that never
        reference word9 in this computation by construction, plus a 20-sample
        sweep and a 10-target false-positive spot check) -- four methods,
        three independent sessions, zero disagreement (EV-MDFIVE-ab007d
        strength_note, obstruction block). DECISION: `weaken`, not
        `reject_scoped`. This is not "a single unreplicated empirical-only
        run" (the forbidden basis for reject_scoped) -- it is a derivation-
        level refutation of the mechanism's specific joint-dependency claim,
        independently reconfirmed by two reviewers using different methods
        (proof_status: derivation, EV-MDFIVE-ab007d proof_refs) -- but the
        batch DID measure something real and narrower: the frozen instrument,
        as built, correctly and reproducibly locates the true word8 via a
        genuine, independently-re-verified partial-preimage search (the
        single genuinely_verified_pair reproduces the full 16-step Round-1
        output state Y exactly, under a code path independent of the search).
        The hypothesis's central TWO-free-word joint-dependency claim at
        S=9 does not hold as stated; its narrower, real content (a one-
        effective-free-word locator, correctly measured) survives. `weaken`
        is the decision that carries both facts forward honestly; `reject_
        scoped` would discard the narrower real result along with the
        falsified broader claim, and `refine` alone (with no status change)
        would leave the mechanism's own falsified text standing unchallenged
        in the ledger. THIS DECISION AUTHORIZES H-MDFIVE-bf7767.status ->
        `weakened`; the physical status-field edit to
        ledger/hypotheses/H-MDFIVE-bf7767.yaml is OUT OF THIS TASK'S
        write_scope (ledger/hypotheses/ is not a declared path for
        TASK-20260821-fb3f3c) and must be applied by the next task that
        carries ledger/hypotheses/ in its write_scope -- named explicitly in
        next_actions below and in GOAL-MD5-001.next_action, so it is not lost
        to scope boundaries between tasks.
    - id: F-3
      text: >-
        D3 RULING -- HEUR-H1'S FALSIFICATION_CONDITION. Read literally,
        HEUR-H1's frozen falsification_condition ("a reproducible (>=3
        independent target draws), non-shrinking heavier-than-Poisson tail")
        has fired at this scale: 1000/1000 identical draws, zero variance, is
        trivially reproducible, non-shrinking, and maximally
        heavier-than-Poisson. The red team flagged the Executor's declination
        to call this "H1 falsified" as plausible but not textually licensed
        by the falsification_condition's own wording, and required an
        explicit Coordinator ruling rather than silent absorption either way.
        RULING: this run's test of HEUR-H1 is INVALIDATED by the ANOM-1
        construction defect, and HEUR-H1 remains OPEN -- neither validated
        nor falsified at this scale -- pending a re-test under a corrected
        split point/matching quantity. Reasoning: the matching-window
        observable at S=9 is, per F-2/ANOM-1, a near-deterministic function
        of word8 and the fixed words alone (not a genuinely independent draw
        over BOTH free words, which is what HEUR-H1's random-model claim
        requires and what the birthday-collision mechanism H1 predicts a
        distribution over). A statistic computed from an observable that does
        not vary with a claimed source of randomness cannot test whether that
        source of randomness behaves as predicted -- it tests something else
        (here, a near-affine structural property of the chosen split point,
        per the Executor's disclosed secondary observation). This is a
        construct-validity failure of THIS INSTRUMENT's chosen matching
        quantity, not a finding about F's iterated mixing, which is what H1
        is actually a claim about. This ruling does NOT soften or hide the
        literal trigger: EV-MDFIVE-ab007d O-3 states plainly that the
        falsification_condition's text, read alone, fired, and that HEUR-H1
        is not thereby credited as validated either -- both readings
        ("falsified" and "validated") would overclaim what this run tested;
        "invalidated, remains open" is the only reading consistent with
        ANOM-1's proven root cause. A corrected-instrument re-test of HEUR-H1
        is required before either label may be applied.
    - id: F-4
      text: >-
        D2 RULING -- MACHINE-READABLE ARTIFACTS LACK A CAVEAT POINTER. raw-
        result.json and manifest.yaml for the completed runs carry the
        headline metrics (total_chunk_evaluations, naive_baseline_cost, from
        which "512x" derives) with no field referencing ANOM-1; the caveat
        exists only in execution-report.yaml's prose and snapshot-
        receipt.json's summary. The red team confirmed NO current document in
        this package overclaims (every prose location stating these numbers
        immediately carries the caveat) -- this is a forward-looking hygiene
        gap in how the caveat propagates to machine-readable artifacts, not a
        present overclaim. RULING: adequately disclosed as-is at this claim
        tier (`analyzed`, never `supported`) for every document currently in
        this package; NO corrective TASK-* is spawned this batch to retrofit
        a `caveat_refs` field onto already-committed run artifacts (that
        would be an edit to an immutable run record, which this program does
        not do -- a correction record would be the right mechanism if this
        were ever judged urgent enough to spend a task on, and it is not,
        given the gap is disclosed and non-active). BINDING CONSTRAINT
        instead: this decision and EV-MDFIVE-ab007d's O-7 place an explicit
        forward obligation on any future record, synthesis step, or
        knowledge-promotion action that cites RUN-MDFIVE-primary-md4-v2's,
        RUN-MDFIVE-h1-md4's, or RUN-MDFIVE-md5-conditional's raw metrics: it
        must also carry the ANOM-1 caveat (F-2 above / EV-MDFIVE-ab007d O-1)
        forward, or it is itself an overclaim regardless of what this
        decision says. If harness/run_md4_ceiling.py is next touched (e.g.
        for a batch-5 corrected instrument), add a `caveat_refs` field to its
        manifest output at that time, per the red team's required_controls.
    - id: F-5
      text: >-
        PROMOTION-GATE AND CLAIM-TIER ASSESSMENT. This record and
        H-MDFIVE-bf7767 are capped at `analyzed`, never `supported`
        (H-MDFIVE-bf7767 carries no asymptotic_claim -- it is a bounded
        mechanism-verification instrument, not an asymptotic-complexity
        claim, so the four CLAUDE.md gates are assessed for completeness and
        honesty, not because this batch is near clearing them).
        Gate 1 (proof decomposition into single-responsibility lemmas): NOT
        MET, unlikely to be satisfiable by any single bounded-scale batch of
        this kind. Gate 2 (numbered heuristics validated): PARTIALLY MET AND
        NOW WORSE than at opening -- HEUR-H2 (proved algebraic fact) is
        confirmed; HEUR-H1, intended to be validated this batch, instead has
        its test INVALIDATED by ANOM-1 (F-3) and remains unvalidated; HEUR-H3
        is honestly left untested. Gate 3 (concrete-cost honesty at
        standardized parameter sets): NOT MET -- a measured cost-scaling
        table entry exists for this batch's own degenerate instrument,
        correctly labeled, but no concrete-cost table addressing the
        instrument-class ~2^64-block gap question exists (see F-8). Gate 4
        (independent review-xhigh + red-team pass): MET procedurally -- both
        ran, both independently re-derived the primary results and ANOM-1
        itself -- but satisfying gate 4 alone does not clear gates 1-3. A
        claim missing any gate may reach `analyzed`, never `supported`; three
        of four gates are unmet here.
    - id: F-6
      text: >-
        METHOD-CEILING AUDIT COMPLETION STATUS AGAINST GOAL-MD5-001's
        completion_criteria. This batch produced A NAMED OBSTRUCTION WITH AN
        ARGUMENT (ANOM-1, algebraically proven and independently
        reconfirmed four ways -- see EV-MDFIVE-ab007d's obstruction block),
        not a fatigue report (docs/inventor-protocol.md's closure standard;
        AGENTS.md core rule and closure gate). This IS a legitimate,
        informative result about the METHOD -- it identifies precisely which
        register-position choice in a chained backward MITM composition
        genuinely carries a given free word's dependency versus which is a
        pass-through copy, a reusable design constraint for the whole
        splice-and-cut/MITM technique family. It is NOT YET the goal's
        completion_criteria "METHOD CEILING STATEMENT for MITM/biclique
        preimages against MD5" (strongest certifiable claim, named
        obstruction, argument, what remains open, MD4 control) -- that
        statement requires a GENUINELY two-free-word joint instrument to
        exist and be measured first, which this batch's degenerate
        construction is not. The goal's method-ceiling completion criterion
        therefore remains OPEN, one concrete step closer: the obstruction
        this batch measured is exactly the diagnostic a corrected-instrument
        design needs (resource_check.reading, EV-MDFIVE-ab007d).
    - id: F-7
      text: >-
        REVIEW-CATCH ADDITIONAL DEFECTS (informational, no independent
        ruling required beyond acceptance). DEFECT-1601d6-01 (validator,
        minor): the pre-existing suite failure status-regressed vs.
        BATCH-1f30fe's baseline (35/35 -> 37/1/1), strongly but not
        exhaustively attributed to a CPython 3.11-vs-3.12 build difference in
        a byte-identical, unmodified file (harness/runner.py) outside this
        batch's write_scope. ACCEPTED AS DISCLOSED, not a code regression in
        this batch's scope; the validator's recommended action (run the
        identical test under Python 3.12.8 on this machine, or record the
        CPython-build dependency in the test's own skip/xfail conditions) is
        carried forward as a low-priority hygiene item, not urgent enough to
        spawn a dedicated task. DEFECT-1601d6-02 (validator, informational):
        the MD5 H2 correctness fixture's exact authorization boundary is
        defensible (required_artifacts names it explicitly; no scale
        asymmetry) but not literally named in md5_run_authorization's own
        text. RULING: this reading is CONFIRMED CORRECT by the Coordinator --
        the H2 fixture is a correctness self-test of the substitution mode
        itself, not a search or attack against an MD5 instance, and is
        squarely within md5_run_authorization's intent even though its text
        is written around the search arm. If EXP-MDFIVE-88f7d1 is ever
        versioned again, its next version should name the H2 fixture
        explicitly in md5_run_authorization to close this recurring
        ambiguity for future reviewers.
    - id: F-8
      text: >-
        INSTRUMENT-CLASS COST QUESTION (the ~2^64-block gap) -- NOT ANSWERED
        THIS BATCH, AT EITHER LEVEL. This batch produced only a MEASURED
        throughput table for its own degenerate, toy-scale instrument
        (chunk evaluations, ~10^5-3x10^5 evals/sec), correctly distinguished
        from IDEA-20260821-e46061's separately-labeled MODELED sketch. Per
        F-2/F-6, this batch's measured numbers describe a search that is
        effectively one free word wide, not the genuinely two-free-word
        joint construction the goal's instrument-class cost question needs a
        throughput anchor for. No projection toward closing the ~2^64-block
        gap is computed or should be inferred from either table. What is
        needed: (a) a corrected, non-degenerate instrument (batch 5) whose
        measured chunk-eval throughput and observed k1/k2 scaling behavior
        are trustworthy inputs to a cost projection, and (b) an explicit
        modeled extrapolation combining that throughput with the birthday-
        search asymptotics, which is out of scope for this closing task and
        is named as a batch-5+ follow-up in next_actions.
    - id: F-9
      text: >-
        BUDGET ACCOUNT. Declared batch-4 budget 4370 s (opening decision
        DEC-20260821-5ab6a1). ACTUAL measured search/run wall-clock (all
        five run directories combined, wrapper-timed): under 20 s total
        (max single run 8.06 s), ~0.4% of the declared budget. Both
        independent reviews' own re-derivation sessions (multiple direct
        module invocations, independent simulators, full test-suite reruns)
        stayed within their declared 400 s budgets with no ceiling hit. The
        PROJECTED cumulative-through-batch-4 figure flagged at this batch's
        opening (15270 s, +41.4% over the original 10800 s campaign plan) was
        a declared-budget-SUM projection, not a measurement -- it is NOT
        borne out by actual spend: batches 1-3 stood at ~10900 s actual
        (already recorded, +0.9%), and batch 4's actual measured compute adds
        well under a further 100 s combined across all seven tasks in this
        batch. The projected-overage FLAG IS RESOLVED for actual spend
        through batch 4 (cumulative actual remains close to the +0.9%
        baseline, far below the +41.4% declared-sum projection); it is NOT
        retracted as a planning caution, since declared-budget ceilings
        (rather than actual spend) are what the campaign's stopping rules and
        pause_conditions key off of, and a future batch with genuinely heavy
        compute (e.g. a larger-scale corrected instrument) could still spend
        near its declared ceiling. No total_wall_clock_seconds amendment is
        warranted on this batch's ACTUAL evidence; the Coordinator continues
        tracking actual vs. declared at each batch opening per the standing
        recommendation.

  knowledge_promotion:
    promoted: []
    not_warranted:
      - what: >-
          A KN-TECH entry naming ANOM-1's obstruction as a reusable
          splice-and-cut/MITM design pitfall (choosing a matching quantity
          computed before the chunk's own free word is consumed by the word
          schedule degenerates that word's channel of the joint search,
          regardless of window size).
        why: >-
          NOT a strength-of-evidence gap -- this Coordinator judges
          promotion WARRANTED ON THE MERITS: the finding is algebraically
          proven, independently reconfirmed by four distinct methods across
          three independent sessions/roles (executor, red team, validator),
          and is exactly the kind of reusable technique-level pitfall the
          related goals building similar splice-and-cut/MITM instruments
          against ARX/Merkle-Damgard word schedules (GOAL-SHA2-001,
          GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001, GOAL-SIMSPK-001,
          per GOAL-MD5-001.related_goals) would want to find before spending
          their own compute on an equivalent construction. Listed under
          `not_warranted` only because this Coordinator session has no
          tools/allocate_id.py (Bash) access to mint a KN-TECH-<tok> id under
          the write-once, no-scan minting discipline (CLAUDE.md
          "Conventions"; AGENTS.md rule 14) -- `promoted` cannot legitimately
          carry an ID that was never minted. DEFERRED, not declined: the next
          tool-enabled Coordinator session should mint KN-TECH-<tok> citing
          EV-MDFIVE-ab007d's obstruction block, H-MDFIVE-bf7767, and this
          decision (F-2), before or as part of opening batch 5 -- see
          GOAL-MD5-001.next_action.
      - what: "A KN-FIND entry for the R=1.0 MD4/MD5 conditional-arm result."
        why: >-
          Genuinely not warranted, not deferred. Per F-2/EV-MDFIVE-ab007d
          O-4, R=1.0 is close to mechanically forced by the shared word-
          schedule degeneracy (ANOM-1) rather than a genuine, informative
          measurement of MD4-vs-MD5 divergence at this scale; it is a
          single-seed-stream observation with no independent replication;
          and the underlying hypothesis this observation was meant to test a
          null against (H-MDFIVE-bf7767) is itself weakened this batch. No
          durable claim survives to promote.
      - what: "A KN-FIND entry for the 512x/2048-chunk-evaluation certificate."
        why: >-
          Not warranted at `analyzed` tier from a single, unreplicated,
          toy-scale run whose broader interpretive frame (genuine
          two-free-word MITM speedup) is exactly what this batch weakened.
          The narrower true content (a correctly-verified one-effective-
          free-word partial-preimage locator) is real but not yet a durable,
          reusable finding distinct from the raw run record itself; revisit
          if and when a corrected instrument replicates a comparable
          locate-cost result under a genuinely joint two-free-word
          construction.

