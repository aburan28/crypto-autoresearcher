  review_composition:
    plan: ledger/handoffs/TASK-20260906-bc1cfc.yaml review_plan (mirrored on TASK-20260906-a6b415's handoff), written before either reviewer ran
    independence_check: NOT RUN BY THIS ROLE (see validity_before_interpretation above); owed to the orchestrating session
    prior_recorded: >-
      Not independently re-stated in the two report artifacts read by this
      role; this decision composes the reports' own joint findings against
      the frozen contract rather than re-deriving what the prior was.
    J1:
      owner: TASK-20260906-bc1cfc
      verdict: HOLDS_WITH_FINDINGS
      summary: >-
        Independent re-enumeration (2 seeds) confirms G3 PASS at both
        binding 2^24 cells in sign and magnitude (CONFIRMS_RUN). A synthetic
        negative-injection test against the real, unmodified analysis.py
        proves the G3 FAIL -> UNTESTABLE branch is genuinely reachable,
        correctly wired per-cell, and never silently falls through to a
        default PASS. A second synthetic test surfaces a non-breaking
        finding: the N = 2^30 "informational, non-binding" G3 reading is, in
        the actual code, exactly as gating as the N = 2^24 binding reading
        -- contradicting the executor's own disclosure text, though it did
        not change any reported verdict this batch and fails toward
        UNTESTABLE (conservative), never toward a false PASS. No breaking
        artifact.
    J2:
      owner: TASK-20260906-bc1cfc
      verdict: HOLDS
      summary: >-
        A sealed, from-scratch blind re-derivation of rho_ORACLE(a, r) at
        N = 2^20, sealed before opening any run artifact, agrees with the
        run's own Stage 0 result within seed-to-seed noise at every (a, r)
        cell and independently reproduces the ordering claim
        rho_ORACLE(a=1/4) < rho_ORACLE(a=1/2) at every r in {2, 4, 8} and at
        every individual per-seed pair. One disclosed methodological
        difference (walk-cap handling in basin membership), expected effect
        about 0.03% of points, does not weaken the verdict. No breaking
        artifact.
    J3:
      owner: TASK-20260906-a6b415
      verdict: HOLDS_WITH_FINDINGS
      summary: >-
        Independent code trace, a hand-crafted synthetic reproduction of
        both the v1 defect and the v2 fix using the real production
        Pool/CountedSelector classes, and direct inspection of every raw
        summary.json across all 20 tested CAP(2T,T_sel) cells confirm the
        per-admission cap keeps S_peak exactly at 2T*bits_per_pool_entry
        (never the 2.6-2.8T v1 overshoot) and that the frontier tuple is
        always bundled with rho_T (no bare ratio anywhere). Two non-breaking
        findings: the S_peak_bits headline rests on an unstated (though
        currently verified-true) invariant rather than being computed
        directly from the finer per-target tracker that already exists; the
        CAP(2T) "retention" ratio exceeds 1.0 at 2 of 4 cells with no CI
        reported on the ratio itself. No breaking artifact.
    J4:
      owner: TASK-20260906-a6b415
      verdict: HOLDS_WITH_FINDINGS
      summary: >-
        Part 1 (permanent fixture, item g): independently re-ran the real
        fixture-check function directly against both committed fixtures
        (FAIL, no exception, both kinds) and, as a proves-too-much control on
        the fix itself, reintroduced the pre-fix unguarded code and
        confirmed it genuinely crashes on the same fixtures -- item (g) is
        correctly and non-coincidentally implemented. Part 2 (mechanism
        collapse on a null object): the committed batch did NOT test this
        (item g's fixture is scoped only to the G1 basin-law check); the red
        team built and ran a fresh v2-native permutation-null test against
        the real, unmodified production code, which collapsed to no positive
        gain in every tested cell -- corroborating the claim, but this is
        red-team-supplied evidence filling a real gap in the deliverable
        (no permanent, committed regression fixture for this check exists).
        No breaking artifact.

  disposition_per_contract:
    EXP_ECDLP_612fb1_v2:
      outcome: >-
        G3 PASS 5/5 at all 4 tested cells (2^24 binding, 2^30
        informational); S1_v2 MET at 3 of 4 cells, satisfying the OVERALL
        "S1_v2 met at >= 1 of the two T_sel points, at both N" clause; F1_v2
        fires nowhere; S2_v2 NOT MET at every cell (magnitude, not sign);
        S3, S5, S6 stand on v1's record. OVERALL = supported, per the
        contract's own letter.
      contract_cell: >-
        This is the FIRST batch under either version of this contract that
        lands squarely inside a cell the frozen success_criterion actually
        names ("EFFECT ... AND MECHANISM ... -> supported"), unlike v1's
        outcome (which landed nowhere the frozen v1 contract named) and
        unlike a hypothetical G3-FAIL outcome (which the v2 contract
        explicitly routes to "report as such... no further T_sel is tried
        without a further amendment").
      what_is_established_toy_tier: >-
        At a = 1/4, r = 2, k = 4, on the generic instrument at N in
        {2^24, 2^30}: a re-selected table at T_sel in {0.65T, 0.75T} is
        G3-feasible (unlike T_sel = T/2) and reaches STATIC(T)'s
        steady-state success at 3 of 4 tested (N, T_sel) cells, with S_peak
        charged honestly (881-1029.5 bits/T, i.e. working storage well above
        STATIC(T)'s own 1T advice at every cell -- this is still a tradeoff
        point on the (P, S, L, epsilon, U) frontier per
        RQ-ECDLP-78dbc5's fewer_DP definition, not an unqualified
        improvement). The measurement apparatus itself -- G3's
        UNTESTABLE-branch wiring, the per-admission cap, the permanent
        fixture -- is independently confirmed sound by both reviewers with
        no breaking artifact.
      what_is_NOT_established: >-
        (1) Clause (C1) as originally stated (T_sel = T/2, a = 1/4) is NOT
        rehabilitated; it remains contradicted by disjointness, unchanged
        from EV-ECDLP-60e266, and is not retested this batch. (2) The
        mechanism-vs-artifact attribution of the measured gain is NOT
        settled: S2_v2, the one-sided null-adequacy bar this amendment was
        specifically written to supply, is NOT MET at any cell (NULL-A's own
        perturbation is 2-3x the measured effect). (3) Whether T_sel = T/2
        is feasible at SMALLER a is genuinely OPEN, not closed in either
        direction: this Coordinator's reading of the committed Stage 0 table
        (ci_tables.json stage0_ascan block) against the contract's own G3
        rule found T_sel = T/2 would PASS G3 at a = 1/16 and a = 1/8, r = 2,
        N = 2^20 -- directly contradicting execution_report.yaml's own stated
        conclusion ("no smaller a ... where T_sel = T/2 would be feasible").
        The ORCHESTRATING SESSION INDEPENDENTLY RE-COMPUTED this directly
        from each a-scan run's own raw-result.json (cells['a=0.0625']
        /['a=0.125'].top_share['T/2'] vs static_by_r['2'], all 5 seeds, exact
        arithmetic, not read/estimated): a = 1/16 PASSES 5/5 seeds (margins
        +0.0196, +0.0122, +0.0240, +0.0163, +0.0092); a = 1/8 PASSES 4/5
        seeds (seed 2 fails narrowly at margin -0.0020; the other four are
        +0.0032, +0.0103, +0.0050, +0.0071). The NUMBERS are therefore
        CONFIRMED, not merely apparent. What remains open is adjudication
        under this program's own review architecture: this computation has
        NOT gone through the review_plan process (J2's blind rederivation
        covered only a in {1/4, 1/2}; J3/J4 did not examine Stage 0's
        small-a cells; no proves_too_much control or blind_from discipline
        was applied to this post-hoc check), so it is reported here as a
        confirmed discrepancy pending formal independent review, not as
        evidence for or against clause (C1) at a different a -- promoting it
        further requires the same review_plan discipline every other claim
        in this program gets, not this decision's say-so. (4) No permanent,
        committed regression fixture exists yet
        testing whether the corrected mechanism collapses on a null object
        (red team's J4 coverage-gap finding); the red team's own ad hoc test
        corroborates the collapse but is not part of the deliverable.

  rationale:
    - >-
      The frozen v2 contract is the ONLY criterion applied, exactly as
      written: G3 PASS 5/5 everywhere, S1_v2 MET at >= 1 of 2 T_sel points at
      both N, non-vacuity guard holding, mechanism clauses standing -> the
      contract's own OVERALL text calls this "supported at toy scale on the
      tested grid." No criterion was changed after observing outcomes.
    - >-
      This decision refuses to let the contract's letter be read more
      broadly than it was written: `support` is scoped explicitly to the
      RE-SCOPED T_sel_grid_v2 effect clause and is NOT a re-statement that
      clause (C1) as originally written is supported. Per the task's own
      instruction and per AGENTS.md's premature-closure symmetry with
      overclaiming: a partial S1_v2 pass at a DIFFERENT T_sel than the
      hypothesis's own stated claim is not reported as if it vindicates the
      original claim.
    - >-
      S2_v2's uniform failure (magnitude, not sign) is treated as a real,
      unresolved confound on mechanism attribution, not a technicality:
      it is named in both the evidence record and this decision's
      next_actions as something a v3 amendment must address (either by a
      better-matched null or by an explicit, argued acceptance of the
      one-sided rule-5 test as the operative artifact check) before any
      hypothesis-status movement beyond `analyzed`.
    - >-
      The Stage 0 a-scan discrepancy this Coordinator surfaced (T_sel = T/2
      appearing G3-feasible at a = 1/16, 1/8 per the contract's own rule,
      against the executor's stated "no feasible point found") is exactly
      the kind of plausible high-value lead AGENTS.md forbids steering away
      from. It is NOT adopted as an established finding here -- it was not
      independently reviewed -- but it is named plainly, cited in the
      evidence record's `unresolved_confounds`, and carried into
      `next_actions` as a concrete, cheap, ranked follow-up rather than left
      as an unexamined footnote in an executor report this decision would
      otherwise pass over.
    - >-
      Neither reviewer found a breaking artifact on any of the four owned
      joints; the measurement apparatus (G3 wiring, per-admission cap,
      permanent fixture) is independently validated as behaving as claimed.
      The non-breaking findings (S_peak_bits' unstated invariant, the
      uncharacterized retention-ratio CI, the G3 N=2^30 binding/informational
      disclosure mismatch, the missing null-collapse permanent fixture) are
      each carried forward as concrete next_action items rather than
      absorbed silently.
    - >-
      Under the roadmap bias toward exponent-targeting mechanisms, this
      lane remains a bounded constant-factor measurement under KN-LIT-013:
      the amendment-and-rerun this decision closes was cheap (16 runs, 0.075
      of a 4-CPU-hour advisory budget) and decision-relevant for
      RQ-ECDLP-78dbc5's fewer_DP question; the newly surfaced a-scan lead is
      similarly cheap to chase further (Stage 0 itself ran in seconds per
      cell) and is ranked ahead of it precisely because it could reopen a
      higher-value question (the original T_sel = T/2 claim, at a different
      a) than the grid already measured.
