  decision: support
  decision_rationale_for_verb: >-
    `support` is the letter-correct verb under the FROZEN v2 contract's own
    OVERALL success_criterion, applied exactly as written, no criterion
    changed after observing outcomes: "EFFECT (S1_v2 MET at >= 1 of the two
    T_sel_grid_v2 points, at both N, with the non-vacuity guard holding and
    G3 passing there) AND MECHANISM (S3, S5, S6 from v1 standing) -> the
    effect and mechanism clauses of H-ECDLP-37dc01 are supported at toy
    scale on the tested grid." G3 PASSES 5/5 seeds at all four tested cells
    (unlike v1's T_sel = T/2 cell, FAIL 10/10) -- independently re-enumerated
    by the validator at the two binding 2^24 cells (CONFIRMS_RUN) and its
    UNTESTABLE branch proven live and correctly wired by synthetic negative
    injection against the real analysis code, so this batch produced no
    UNTESTABLE, only-a-negative, or only-inconclusive outcome to report.
    S1_v2 is MET at >= 1 of {0.65T, 0.75T} at BOTH N (2^24: MET at both;
    2^30: MET at 0.75T). The non-vacuity guard holds comfortably at both N.
    S3, S5, S6 stand on v1's own record per the contract's own text ("not
    required to be re-measured to hold"). NOT `weaken` or `reject_scoped`:
    unlike v1's T_sel = T/2 cell, nothing here is contradicted with CI at a
    pre-registered effect size, and no cell is UNTESTABLE. NOT
    `inconclusive`: the CIs do not straddle at the level that would make this
    indeterminate -- G3 cleanly passes everywhere, S1_v2 cleanly resolves
    (met or not met, with tight CIs) at every cell, and S2_v2 cleanly
    resolves NOT MET everywhere; the record clearly discriminates, it does
    not fail to discriminate. `support` is therefore the letter of the
    contract -- BUT this decision scopes it narrowly and explicitly refuses
    to let it be read as more than the letter grants (see `limitations` and
    `rationale`): it supports the RE-SCOPED effect clause at T_sel in
    {0.65T, 0.75T} ONLY, never clause (C1) as originally stated
    (T_sel = T/2), which remains contradicted at a = 1/4 exactly as
    EV-ECDLP-60e266 established and is NOT retested this batch.
