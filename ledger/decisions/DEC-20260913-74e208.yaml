  decision: compose_review_round_and_open_successor
  decision_label: >-
    Compose REVIEW-SEMBIN-20260913-9d649f. CLAIM B holds as the negation of the
    hypothesis that proposed it and its obstruction is promoted. CLAIM A's direction
    survives and is strengthened while its headline framing is refused. Two Coordinator
    priors are recorded as refuted. Open EXP-SEMBIN-2c40bb to compute the surface the
    round showed is owed.

  context: >-
    Six joints, three reviewers, two claims. The round returned J1 holds, J4 holds,
    J5 holds, J2 breaks, J3 breaks, J6 breaks, and J6-BLIND incomplete. Three
    independent implementations now agree on the arithmetic of both runs -- the red
    team's reimplementation reproduces every figure in COST-SEMBIN-8d123b to 4.8e-5
    bits and all four published crossovers exactly, the blind re-derivation reproduces
    the entire dense branch with no substitution, and the validator re-derived the
    variable counts from two different sections of the frozen text. THE ARITHMETIC WAS
    NEVER THE WEAK POINT AND IS NOT IN DISPUTE. What broke is the comparison and the
    interpretation, which is where the Coordinator's prior said the weakness would be
    and is the one thing that prior got right.

    The round is unusually informative because it refuted two of the three priors the
    Coordinator recorded before it ran, and refuted them in the direction that makes the
    record's own headline WEAKER rather than stronger. That is the outcome the
    pre-recorded-prior rule exists to make visible, and it is only visible because the
    prior was written first.

