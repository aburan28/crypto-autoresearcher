  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF B-409, K-409, B-571,
      K-571 OR ANY OTHER CURVE, IN EITHER DIRECTION. Concluding that a memory-charged
      comparison favours parallel rho at n = 409 does not make those curves safe, and the
      reverse would not make them attackable. Both are statements about two heuristic cost
      models, and every figure is bound_kind heuristic_estimate under
      docs/claims-and-verification.md. No curve was instantiated, no relation computed, no
      Groebner basis run, no solve performed, and NO CERTIFICATE ATTACHES TO ANY NUMBER
      composed here.
    - >-
      NO DEGREE WAS MEASURED BY ANYONE IN THIS ROUND and none is asserted. There is no
      Groebner engine on this host (IMP-SEMBIN-ENGINE, recorded under DEC-20260913-cb5ee2).
      Assumption 1 is consumed unchanged and unvalidated on both sides of every comparison.
      Its failure mode is +19.4 bits at n = 409 at degree 5, which is LARGER than the
      29.0-bit baseline correction and larger than the 18-21 bit dense/sparse gap: THE
      SINGLE LARGEST UNCERTAINTY IN THIS ENTIRE FAMILY OF NUMBERS IS UNTOUCHED BY THIS
      DECISION and remains impeded.
    - >-
      Nothing here bears on Semaev's Assumption 2 or on his asymptotic bound (17). J5
      confirms the fitted c converges to 1.6986 at Theta(log log n / log n), which is a
      statement about the fit and not about the bound.
    - >-
      Rejecting H-SEMBIN-b1708c and closing KN-OPEN-94f456 are SCOPED to eq. (11) as
      published, n in [250, 600], m in [2, 30], and the three named solving-cost readings.
      Both stay open under any other yield law. The measurement that could invert them
      (EXP-SEMBIN-354a75) has not returned.
    - >-
      EV-SEMBIN-71e5cd's strength is `preliminary`, not `replicated`, despite three
      independent implementations agreeing: what replicates is the ARITHMETIC, while the
      claim this decision records rests on a corrected comparison computed ONCE, by one
      reviewer, from a tradeoff model whose primary source no one has read. The successor
      experiment exists to change that, and until it returns the corrected crossovers
      (460 / 520) carry exactly the weight of one reviewer's independent recomputation.
    - >-
      The J1 verdict turns on reading the frozen source's Tables 1-2 MB column as a PEAK,
      which tables.yaml's own transcription_limits contradicts by calling it a total over
      100 systems. The validator computed both and picked neither. A Coordinator who
      resolves that the other way should expect EV-SEMBIN-71e5cd O-4 to weaken to
      inconclusive; the Coordinator does not resolve it here and has recorded it as an
      unresolved confound and as control C10 of the successor.
    - >-
      APPROVING H-SEMBIN-97ea23 AND EXP-SEMBIN-2c40bb ASSERTS PROTOCOL COMPLETENESS AND
      RANKING ONLY. It asserts nothing about whether the hypothesis is true, and the
      contract itself carries a falsification criterion that can retire the experiment's
      own reason for existing.
    - >-
      EXP-SEMBIN-2c40bb IS NOT AN INDEPENDENT CHECK OF THE RED TEAM. It consumes that
      report as an input and computes what it argued for. Whether the resulting surface
      supports H-SEMBIN-97ea23 requires a LATER review round staffed by agents who neither
      wrote the red team report nor ran the experiment, and the contract records that
      explicitly.
    - >-
      This composition rests on three reviewer reports the Coordinator READ but did not
      RE-EXECUTE. Their scripts are committed and every figure quoted here is traceable to
      them. Where a report and this decision differ (PD-3) the difference is named rather
      than absorbed.

