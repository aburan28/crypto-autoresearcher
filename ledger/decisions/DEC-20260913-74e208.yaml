  refuted_priors:
    - prior: >-
        "The dense working-set reading (width^2 bits for a degree-4 Macaulay matrix) is
        expected to be the least defensible number in the record ... If that argument
        lands, the 435 crossover goes with it and only the 375 survives -- which would
        REMOVE the n = 409 flip and substantially weaken the record's headline."
      outcome: REFUTED
      by: TASK-20260913-da3982 (validator, J1)
      finding: >-
        The paper gives NO memory model at all, so neither reading has a basis in it and
        both have one in the recorded ellipticnews dispute: width^2 is Galbraith's count
        and the sparse (nm)^4/24 x n^3/m is Semaev's own answer. Retiring width^2 would
        leave the record reporting only the defendant's estimate. Further, the validator
        found the frozen source carries 34 unused MAGMA memory measurements of this exact
        object; under the peak reading of that column, measured peak lies BETWEEN the
        record's two readings in 21 of 27 non-trivial rows, width^2 upper-bounds all but
        one, and the rows x cols accounting the prior implicitly favoured fails as an
        upper bound on all 27. The validator stated plainly that this is the opposite of
        the outcome the Coordinator expected.
    - prior: >-
        "The baseline is charged at its memory endpoint with NO time penalty for a small
        distinguished-point store ... this is a real asymmetry favouring the baseline ...
        i.e. the record may be UNDERSTATING Semaev's advantage, not overstating it."
      outcome: REFUTED, AND THE SIGN WAS BACKWARDS
      by: TASK-20260913-cf9d98 (red team, J2)
      finding: >-
        Charged as a TIME penalty at the record's own operating point M = 1, the
        distinguished-point tail costs log2(1 + 1/w) = 0.0000 bits for every store from
        2^20 to 2^60 at n = 409 and n = 571, first reaching 1.0 bit at M = w = 2^20. The
        tradeoff bites through MEMORY and it bites the other way: the record charges vOW
        the memory of a 2^30-point store and the time of one processor, which are
        different points on its curve, and the combination sits 29.0 bits above the
        minimum of vOW's own T x Mem. Charging it coherently moves the crossover +85 in n
        and turns the n = 409 sparse margin from +11.52 to -17.48. The red team recorded
        this as the strongest objection it could NOT make land, which is exactly the
        right way to report a refuted prior.
    - prior: >-
        "The Coordinator does NOT expect a reviewer to overturn the 302 baseline
        reproduction, the matched-null attribution, or the ceiling-discrepancy table."
      outcome: THE MATCHED-NULL ATTRIBUTION IS OVERTURNED
      by: TASK-20260913-cf9d98 (red team, J2(e))
      finding: >-
        "share = 0" rests on a control that returns 0 under the two metrics where memory
        is INERT and returns null -- degenerate, no crossover, log2(0) = -inf -- under
        the two metrics the claim is actually about. The record's prose converted "0
        where inert and undefined where it is not" into "the share is zero". Against the
        informative null (a baseline charged the 3n bits it needs) the shift decomposes as
        +159 sparse from Semaev's memory and -87 from the baseline's store: the reported
        +72 is a near-cancellation, the baseline's charge is 55% of the magnitude of
        Semaev's, and it works in Semaev's favour. The 302 reproduction and the
        ceiling-discrepancy table were NOT overturned, so this prior was two-thirds right.
    - prior: >-
        ON CLAIM B: "the Coordinator expects the result to HOLD ... a reviewer will and
        should insist the closure be scoped to 'under the published yield law' ... The
        Coordinator expects this claim to survive review in that narrowed form."
      outcome: CONFIRMED
      by: TASK-20260913-da3982 (validator, J4)
      finding: >-
        Held on every load-bearing step, and the narrowing is recorded. This is the one
        prior the round confirmed, and it is recorded here so the tally is not read as
        four failures.
    - prior: >-
        ON THE DECLINED STOPPING RULE: recorded as "uncomfortable".
      outcome: THE DECISION WAS RIGHT AND THE DISCOMFORT WAS ALSO RIGHT
      by: TASK-20260913-cf9d98 (red team, J5)
      finding: >-
        c IS converging, at Theta(log log n / log n): over 43 decades the raw gap falls
        from 0.2172 to 0.0101 while gap x log n / log log n stays in [1.068, 1.326] --
        7.7% scatter against 62% for a constant offset, an eight-fold better fit -- and an
        analytic continuation gives 1.6986436 at n = 10^10^9. Declining the stopping rule
        was correct. AND the record's evidence was inadequate to its conclusion: a 7-point
        monotone rise over 6 decades does not distinguish an asymptote at 1.6986 from one
        at 1.60, and both settling tests were cheap and absent. Shipping a correct
        conclusion on evidence that does not reach it is a real defect even when the
        conclusion survives.

  procedure_deviations:
    - id: PD-1
      severity: material
      what: >-
        THE REVIEW PLAN'S blind_rederivation.parameters BLOCK DID NOT STATE THE RECORD'S
        MODEL, so the blind check of the load-bearing quantity DID NOT HAPPEN. The plan
        stated the variable count as N = m*k + 2n, which is the relation ROW WIDTH, not
        the variable count N = n(t-2) + kt (1236 against 4099 at n = 409, about 7 bits in
        Macaulay width). It also described the sparse reading as "one field element per
        nonzero", where the record's sparse reading is (nm)^4/24 columns at n^3/m nonzeros
        per row and does not involve N at all -- the plan's wording drops the n^3/m ~ 2^22.6
        nonzeros PER ROW.
      consequence: >-
        The re-derivation returned 306 and +29.77 against the record's 375 and +11.52, a
        69-in-n disagreement that localises EXACTLY to that one term: the memory gap
        equals the margin gap at 18.2535 bits to four decimal places. The plan's model is
        MORE favourable to the attack than the record's, so a reviewer working from the
        plan alone would over-credit the attack. Both the validator (J1(c)) and the red
        team, independently and without reading each other, predicted this signature in
        advance and warned it would be misread as evidence about the implementations.
      coordinator_finding: >-
        The plan's own promise was that "every one of them is stated here so that you
        never need the producer's code to obtain them." It failed that promise. THE FAULT
        IS THE PLAN'S AND THEREFORE THE COORDINATOR'S, not the re-deriver's and not the
        producer's -- the producer implemented a sourced model from KN-LIT-e77232, which
        re-checks its own arithmetic at n = 571. Consequence carried forward: the sparse
        working set is now computed in exactly ONE implementation in this repository, is
        corroborated at exactly ONE parameter point, and is the one term this round could
        not check. ARM I of EXP-SEMBIN-2c40bb exists to discharge that.
    - id: PD-2
      severity: material
      what: >-
        THE BLIND BRIEF DISCLOSED THE ANSWER IT WAS ASKING FOR. The plan's
        blind_rederivation.quantity field itself reads "The record asserts 375 and +11.52
        respectively; do not read those figures before you have your own", and the task
        brief repeated them.
      consequence: >-
        The blindness obtained was to the IMPLEMENTATIONS and the run record -- which is
        the failure mode the joint exists to catch -- and was never blindness to the
        target values.
      coordinator_finding: >-
        A defect in the blind protocol, and mine. The evidence that the derivation was
        not steered is the disagreement itself, together with the re-deriver's disclosure
        that its own sensitivity grid contained a variant landing at 373 / +14.62 which
        could have been presented as agreement and was not. Future blind briefs state the
        quantity and the parameters and NOT the expected value.
    - id: PD-3
      severity: disclosed, no action
      what: >-
        TWO INSTANCES OF TASK-20260913-ec11c4 RAN CONCURRENTLY in this worktree and
        reached different verdict WORDS on the same facts: the first recorded `breaks`
        scoped to "the joint as specified rather than the record's arithmetic", the second
        recorded `incomplete`.
      consequence: >-
        One task directory contains two reports and two attestations. The second instance
        declined to overwrite the first's attestation on the grounds that an attestation
        is a personal statement about what one agent read and when, and that replacing
        another agent's would be recording an attestation it did not obtain. It snapshotted
        both instead.
      coordinator_finding: >-
        The second instance was right on both counts, and its refusal to overwrite is
        exactly the behaviour AGENTS.md requires. THE COORDINATOR ADOPTS `incomplete` as
        the composed verdict for J6-BLIND. `breaks` reads downstream as "the load-bearing
        step does not hold", and that is not what happened: the quantity was not refuted,
        it was NOT TESTED, because the statement handed to the re-derivation specified a
        different memory model (PD-1). The record survived everything that could be checked
        against it. Both reports are committed unedited and both verdicts stand in the
        archive; the composition names which one it adopts and why.
    - id: PD-4
      severity: minor
      what: >-
        THE RED TEAM DIRECTORY CARRIES NO attestation.yaml, although its report contains an
        explicit blindness statement ("I read nothing under validator-da3982/ or
        blind-rederivation-ec11c4/. Neither directory existed in the tree when I worked")
        and refers to a read list "in attestation.yaml".
      consequence: >-
        tools/check_review_independence.py cannot verify the red team's declared reads
        mechanically for this round.
      coordinator_finding: >-
        Recorded rather than papered over, and NOT retro-fitted: the Coordinator will not
        author an attestation on a reviewer's behalf, which would be recording an
        attestation it did not obtain. The in-report blindness statement is accepted as the
        reviewer's own words, with the limitation that it is unverifiable by the checker.
        The independence claim is additionally supported by ordering: the red team's report
        states the sibling directories did not exist when it worked, and the two sibling
        reports independently converge on findings the red team also made, without any of
        the three citing another.
    - id: PD-5
      severity: minor
      what: >-
        THE REVIEW PLAN REPEATED THE RECORD'S INVERTED FIPS-COFACTOR DIRECTION, stating
        that taking q = 2^n "flatters the baseline".
      consequence: >-
        Had the red team not checked it independently, the error would have propagated from
        the record into the review that was supposed to catch it.
      coordinator_finding: >-
        The plan should not restate a record's own disclosures as though they were
        established; doing so spends the review's independence on the point where it is
        most needed. Corrected in EV-SEMBIN-71e5cd O-14 and preregistered as a metric in
        EXP-SEMBIN-2c40bb.
    - id: PD-6
      severity: disclosed
      what: >-
        The knowledge-retrieval MCP server was NOT AVAILABLE in the red team's session, so
        its search for a prime-field cost model was a filesystem search of the corpus and
        ledger rather than an index query.
      consequence: >-
        Under AGENTS.md, absence of a result would not have been evidence of absence. What
        it FOUND is unaffected, and what it found is what matters: EXP-ICEX-c32447,
        EXP-ICEX-349205, DEC-20260804-14b457 and KN-OPEN-001 all exist.
      coordinator_finding: >-
        Accepted. The finding is a positive existence result, which a filesystem search
        establishes as well as an index query would.

  dispatch_ranking:
    - rank: 1
      task: TASK-20260913-80bae1
      what: EXP-SEMBIN-92724f, exponent localisation and exact typed image-size enumeration
      why: >-
        ECC-first (SEMBIN is a declared ECC area, AGENTS.md "ECC comes first"). Already
        authorized under DEC-20260913-cb5ee2 and DISPATCHED before this decision was
        recorded. Its arm D is a seconds-long exhaustive refutation of the mechanism lane's
        central claim, and EV-SEMBIN-1d36a3's resource_check gives it a second use: the
        obstruction's per-link yield charge fixes what the typed/untyped ratio must be if
        the symmetry factor is genuinely removed, so arm D is now also a calibrated check
        rather than only a count.
    - rank: 2
      task: TASK-20260913-4df669
      what: EXP-SEMBIN-354a75, exhaustive realized-yield enumeration
      why: >-
        THE ONE CONFOUND THAT INVERTS EV-SEMBIN-1d36a3. Every quantity in the CLAIM B
        closure consumes eq. (11) unmeasured; if realized yield falls short of it more at
        t = m than at t < m, the closure inverts. It also underwrites the scope caveat on
        EV-SEMBIN-71e5cd. Ranked above the surface recomputation because it can overturn a
        closure this decision has just recorded, whereas the surface refines a comparison.
    - rank: 3
      task: TASK-20260913-39f7a4
      what: EXP-SEMBIN-2c40bb, the two-parameter surface with a coherently charged baseline
      why: >-
        Discharges an unmet PREREGISTERED deliverable, decides the only question CLAIM A's
        headline turns on, carries all four corrections, supplies the second implementation
        of the sparse working set that the round could not check, and instantiates the
        prime-field control the parent substituted away from. The red team estimated the
        core at under ten minutes of compute. Ranked third only because the two ahead of it
        can change conclusions rather than refine them.
    - rank: 4
      task: 'not yet dispatched: GF(2) degree-4 closure-predicate reimplementation'
      what: unblock the degree lane without a Groebner engine
      why: >-
        IMP-SEMBIN-ENGINE blocks EXP-SEMBIN-c2c312 and EXP-SEMBIN-7e1371, and the
        degree-bound sensitivity (+19.4 bits at n = 409 at degree 5) is LARGER than every
        effect this entire review round discussed. It is the largest uncertainty in the
        whole SEMBIN cost family. Ranked fourth because it is the most expensive to build
        and the least certain to succeed, not because it matters least -- on magnitude it
        matters most.
    - rank: 5
      task: 'not yet dispatched: retrieve van Oorschot-Wiener 1999 primary source'
      what: convert HEUR-VOW-CURVE from two internal records to a read source
      why: >-
        The baseline's tradeoff curve is now load-bearing for the largest correction in
        this round (+85 in n), and NO agent in this program has opened the primary paper;
        KN-LIT-012 records that its own full text was not re-read. Cheap, and it is the
        first thing a reviewer of H-SEMBIN-97ea23 should attack. Ranked last only because
        the structural consequence -- product invariance along the curve -- follows from the
        shape rather than from any constant, so a wrong constant cannot move it.

  rationale:
    - >-
      WHAT SURVIVES IN CLAIM A IS WHAT THE HYPOTHESIS ACTUALLY PREDICTED, AND IT SURVIVES
      MORE CLEANLY THAN THE RUN LEFT IT. H-SEMBIN-83999d predicted that under a metric
      charging memory at the same rate as time the crossover would land above 409, so the
      n = 409 curves leave the affected scope. The run returned a mixed answer -- 435 dense
      above, 375 sparse below -- and led with the mixture. Charging the baseline at any
      single coherent point on its own curve gives 520 and 460, BOTH above 409. The
      prediction is met unambiguously. That is why this transition is `analyzed` and not
      `weakened`: the direction is not in trouble, the framing is.
    - >-
      WHAT IS REFUSED IS THE SENTENCE THE RUN LED WITH. "A 46.6-bit swing straddling zero
      between two defensible storage readings of the same algorithm" attributes to the
      storage reading an indeterminacy that belongs to the charging of the baseline. Under
      a coherent baseline, under any hard memory budget below four exabytes, or under
      T x M^alpha for any alpha < 0.811, THE TWO READINGS AGREE that n = 409 favours
      parallel rho. Of eight charging configurations the red team examined, only two
      straddle zero and one of them is the record's own. The honest restatement is the red
      team's and the Coordinator adopts it verbatim in EV-SEMBIN-71e5cd: at n = 409 the
      verdict is undetermined by cost models that charge memory multiplicatively and leave
      the memory scale free, and is determined -- against Semaev -- by any model that fixes
      a physical memory budget or charges the baseline at a point it could actually occupy.
    - >-
      THE CONTRACT PREDICTED ITS OWN FAILURE MODE AND THE PREDICTION FIRED. The
      falsification_criterion said that if the crossover depends more strongly on the vOW
      store than on the metric, "the deliverable is a two-parameter surface and the
      hypothesis's framing is wrong even where its direction is right". That is precisely
      the finding. A contract that names the way it can be wrong, and is then held to it,
      is the mechanism working; the defect is that the run had the store in its declared
      independent variables, tabulated vOW across it in cost_table(), and never passed it
      to compare_at or crossover_curve, which took the default 30 in every call.
    - >-
      CLAIM B HOLDS AS THE NEGATION OF THE HYPOTHESIS THAT PROPOSED IT, and the useful
      output is the obstruction rather than the verdict. Yield loss under eq. (11) costs
      k - log2 t bits per link -- linear in n in the exponent -- while every solving-cost
      saving in the frozen text has DECREASING per-unit increments (42.4, 11.3, 6.8, 4.9,
      3.8, ... at n = 409, m = 20) and so grows only like log(m - t). An exponential charge
      cannot be paid by a logarithmic credit. The premise that makes this meaningful is
      verified rather than assumed: zero saturated cells over n in [250,600] x m in [2,20]
      x t in [2,m], with max log2 A = -1.0 exactly at a corner where m is never optimal.
    - >-
      THE OBSTRUCTION IS RE-READ AS A RESOURCE AND THE READING IS NOT FLATTERING, WHICH IS
      WHY IT IS WORTH RECORDING. The blocking quantity is the t! symmetry factor inside
      eq. (11) -- the same object H-SEMBIN-c59e50 claims coset-typed factor bases remove.
      Remove it and A(t) = 2^{tk-n}, so the per-link charge RISES from k - log2 t to k
      (33.72 to 37.18 bits at n = 409, m = 11). The typed construction therefore closes the
      short-chain lane HARDER, not looser. Anyone reaching for typing to open an interior
      optimum in t should expect the opposite. The genuinely useful reading is the second
      one: the per-link charge is a calibrated ruler for whether the typing works at all,
      because the yield law fixes what arm D's typed/untyped ratio must be if the symmetry
      factor is gone. An obstruction measured under the optimization question becomes the
      control for the mechanism question.
    - >-
      FOUR PUBLISHED QUANTIFICATIONS NEED CORRECTION AND NONE OF THEM IS A MECHANISM. The
      yield-loss range is 27.7-44.0 and not 25-28 (exponential_vs_polynomial_argument()
      hardcodes m = 10 regardless of m*, and the quoted range covers a subset of its rows);
      best_t_by_net is sign-inverted, reporting the t at which shortening is WORST as best,
      so raw-result.json carries best_t_by_net: 2 directly beside
      consequence: t = m is optimal; "2-3 bits per unit of t" is the derivative at t = m
      rather than a bound, the true maximum being 31-32 bits; and the m* law error is
      5-11%, not the 4-15% quoted, with neither endpoint appearing in the record's own
      c_fit_ladder. Per AGENTS.md an implementation defect is never a mathematical
      conclusion. The validator checked propagation explicitly: optimize(), crossover() and
      stage_costs() do not consume the defective function, its own from-scratch optimizer
      agrees with jb.optimize everywhere, and the crossovers and t* table do not flow
      through it. The mechanism is sound and its published quantification is not.
    - >-
      THE CONTROL COUNT IS REDUCED FROM SIX TO FIVE AND THE STATED REASON FOR THE
      SUBSTITUTION WAS FALSE. The eq. (4) nearby-object control passes by 1957 to 5977
      bits, which is 54 to 147 times the largest uncertainty the record's own sensitivity
      analysis contemplates; for it to fail, the effective degree bound would have to be
      wrong by a factor of roughly 500. It is a typo detector for one line of the degree
      argument. Worse, the run asserted a prime-field index-calculus cost model is in
      neither the frozen source nor this repository, and the red team located
      EXP-ICEX-c32447 -- a fully specified model with three separated counters and a
      multi-target rho arm with a shared distinguished-point table, i.e. the exact
      comparison shape this run needed -- plus EXP-ICEX-349205, DEC-20260804-14b457, and
      KN-OPEN-001, which the contract itself names as the reference answer. The correct
      disclosure is that such models exist as specified but unexecuted contracts and
      instantiating one was out of scope. ARM N of EXP-SEMBIN-2c40bb instantiates it.
    - >-
      THE RECORD'S CROSSOVERS ARE CONVENTION-DEPENDENT UNDER A RULE THIS PROGRAM HAD
      ALREADY WRITTEN DOWN. EXP-ICEX-c32447 states that field-operation work converts to
      group operations at kappa in {1, 10, 100} and that a conclusion flipping across that
      range may not be quoted without kappa. COST-SEMBIN-8d123b declines any conversion,
      calls the mismatch the largest single source of imprecision in its table, and quotes
      its crossovers without kappa. Across the grid the crossover moves 20 in n. No FIPS
      verdict flips on kappa alone so the verdict map survives, but the figures carry a
      label they were not given, and one campaign not knowing another campaign's discipline
      is a coordination failure this program has the tooling to prevent.
    - >-
      NEITHER RUN CONCEALED ANYTHING, AND THIS IS THE PART A HARSH READING OF THE ABOVE
      WOULD MISS. Every input the red team used to break the comparison is stated somewhere
      in the record: the store value, the absent tradeoff, the M = 1 charging, the
      neglected cofactor, the metric coincidence, the substituted control, the declined
      unit conversion. The failure is in the SIGN, the MAGNITUDE and the CORROBORATION
      COUNT the record attached to its own disclosures. A record that discloses everything
      and mis-signs two of its disclosures is a much better starting point than one that
      discloses less, and the review round was able to be this productive because the
      record was this transparent.
    - >-
      THE SPARSE WORKING SET IS THE ROUND'S CARRIED-FORWARD DEBT AND IT IS THE
      COORDINATOR'S FAULT. It is the term that moves the n = 409 verdict from -8.8 to
      +11.5; it is now computed in exactly one implementation in this repository;
      independent_arith.py never evaluates it and its own docstring says its independence
      is method independence, not agent independence; it is corroborated at exactly one
      parameter point by the knowledge record it came from; and it is the one term the
      blind joint could not check BECAUSE THE PLAN MISSTATED IT (PD-1). The single most
      valuable thing a blind re-derivation could have done in this round was the one thing
      the plan made impossible.
    - >-
      RANKING, STATED BECAUSE AN UNLIMITED BUDGET IS AN INVITATION TO MAKE-WORK. Three
      tasks are dispatched and two are named but not dispatched. The two ahead of the
      surface recomputation can OVERTURN conclusions this decision records -- the yield
      enumeration can invert EV-SEMBIN-1d36a3's closure, and the typed enumeration can
      refute the mechanism lane outright in seconds -- whereas the surface refines a
      comparison whose direction is already settled. The degree lane is ranked fourth on
      tractability and not on importance: at +19.4 bits it is the largest uncertainty in
      this whole family of numbers and it dwarfs everything the round argued about. Saying
      so is the honest way to leave it impeded.

