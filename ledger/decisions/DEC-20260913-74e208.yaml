  official_transitions:
    H-SEMBIN-83999d:
      from: approved
      to: analyzed
      basis: >-
        NOT to `supported`, and not to `weakened`. The contract's own
        falsification_criterion fired: "If the crossover depends more strongly on the vOW
        store parameter than on the metric choice, the deliverable is a two-parameter
        surface and the hypothesis's framing is wrong even where its direction is right."
        The crossover moves 180 in n across store_log2 against 132 for metric choice
        (dense), and 183 against 72 (sparse) -- and 96 against 72 even restricted to the
        four store values the contract itself declared. The store was never swept in any
        crossover, though the contract declared it an independent variable and a primary
        metric. That is an UNMET PREREGISTERED DELIVERABLE, so the hypothesis is analyzed
        and awaits EXP-SEMBIN-2c40bb before any promotion. Its DIRECTION is confirmed and
        strengthened (see rationale), which is why this is not `weakened`.
    H-SEMBIN-b1708c:
      from: approved
      to: rejected
      basis: >-
        Its preregistered prediction was t* < m* STRICTLY at every integer n in
        [250, 600]. There is no interior optimum at any n, under any of the three
        solving-cost readings, and the refutation replicates across two implementations
        sharing no code. Rejection is SCOPED, per core rule 6, to the exact tested scope:
        n in [250, 600], m in [2, 30], k = ceil(n/m), eq. (11) as published, and the
        three solving-cost readings named in the contract. It says nothing about chain
        length under any other yield law -- which matters, because the mechanism lane is
        about to change that yield law.
    KN-OPEN-94f456:
      from: open
      to: closed_scoped
      basis: >-
        Closed as an OPTIMIZATION question under eq. (11), on the closure standard in
        AGENTS.md "Inventor protocol": a named obstruction, an argument, a MEASURED
        quantity with units and scope, and forward guidance. The obstruction block of
        EV-SEMBIN-1d36a3 supplies all four -- yield loss 27.68 to 44.00 bits per link at
        the FIPS labels against solving-cost savings of 0 to 2.59 bits at t = m, with a
        verified unsaturated-regime margin of a full bit and zero saturated cells over the
        whole sweep. It stays OPEN under any yield law other than eq. (11), and the
        forward guidance is recorded in the resource_check: removing the t! symmetry
        factor RAISES the per-link charge from k - log2 t to k, so the typed construction
        closes this lane harder rather than reopening it.
    COST-SEMBIN-8d123b:
      from: current
      to: superseded_in_scope
      basis: >-
        NOT withdrawn and NOT corrected in place. Its arithmetic is triply reproduced and
        stands; immutable records are superseded, never overwritten (core rule 4). What is
        superseded is its SCOPE: it reports a one-parameter slice of a surface at an
        undeclared store value, and it may no longer be quoted for the straddle at
        n = 409, for "matched-null share = 0", for a four-metric corroboration count, or
        for a crossover without its full cell label. EXP-SEMBIN-2c40bb produces the
        superseding record.
    EXP-SEMBIN-f4a17b:
      from: completed
      to: analyzed
      basis: Reviewed and composed. Its successor is EXP-SEMBIN-2c40bb.
    EXP-SEMBIN-81dc96:
      from: completed
      to: analyzed
      basis: >-
        Reviewed and composed. Four published quantifications need correction and none is
        the mechanism; the corrections travel with EXP-SEMBIN-2c40bb's record rather than
        by editing this one.
    H-SEMBIN-97ea23:
      from: null
      to: approved
      basis: >-
        New hypothesis, authored from the round's breaking artifacts, specified and
        approved in one decision under the standing user authorization of 2026-09-06. It
        is recorded as a NEW hypothesis rather than as an amendment to H-SEMBIN-83999d
        because it makes a different and sharper claim, and because a frozen protocol is
