  # ---------------------------------------------------------------------------
  rulings:
    - id: R-J1
      subject: J1, rank derivation, interface and reproduction fixture (TASK-20260924-a2c79b)
      ruling: >-
        HOLDS. L3 and L4 were re-derived. The planted controls return 1, n' and
        k under two routines. AR-1 excludes the short-orbit leg before any rank
        is read. Every n = 17 fixture value reproduces, and G1 is gated first. The
        ker-g basis is computable, and section B19793 names one saving. The L4
        converse (D-J1-2) is stated but not derived, and it is false. It is not
        load-bearing, because AR-1, the RS-1 targets, the quantifier order and
        IR-9 exclude its witnesses before any rank is read and no criterion uses
        it. It is therefore ruled an erratum, not a break. The declared DC-B1
        departure from S2's literal positive branch (O-J1-5) is accepted: it was
        fixed before any outcome existed and J1 verified it.
    - id: R-J2
      subject: J2, controls, toy-degree screen, row sourcing and completeness (TASK-20260924-a2c79b)
      key: K-revise-defect
      ruling: >-
        BREAKS on B-J2-1. The frozen cell-admission bound E1 cannot be met at two
        positive-arm degrees (n = 17 with a = 0, and n = 41 with a = 1). SR-5
        therefore halts every execution with incomplete_C1 before any rank
        readout, and O-SUPPORT condition (4) is unreachable by construction. The
        red team reached the n = 17 case independently (INC-1), and the composer
        checked both reported factorisation products by hand. This is a
        protocol-completeness defect under C1. It is NOT a mathematical result
        about H-BINSTD-ce4f38, any rank identity or any curve (CB-9). Everything
        else in J2 holds: the toy screen and the arms, both repetition rules in
        the procedure, the six primary-sourced rows, no dump substitution, every
        approval field present, approved_by null, zero runs, and matching hashes.
    - id: R-J3
      subject: J3, observation collision, nearby-object controls and GGMP provenance (TASK-20260924-eaf78a)
      key: K-revise-defect
      ruling: >-
        BREAKS. The plan's short-orbit collision cannot arise at prime k and is
        read correctly. The null and non-stable controls block. Nothing is
        attributed to GGMP. But no rule checks that a quotient row is the true
        equation on the logarithms. A copy-row conjugate builder (M1) is routed
        to O-REFUTE-L3 with no invalidation rule firing. An orientation-flipped
        labeller (M2) passes every gate and reads as consistent with L3 and L4.
        The contract's claimed separators for its own collision (3) do not
        separate either case (O-1, O-2, O-3). An instrument defect being
        classified as a falsification outcome is exactly the failure CB-9
        forbids, so the protocol must be able to tell them apart before approval.
    - id: R-J4
      subject: J4, R2 boundaries, rho convention and scope, with PTM-A to PTM-D (TASK-20260924-eaf78a)
      key: K-revise-defect
      ruling: >-
        BREAKS. The R2 exclusions, the rho convention, the census authored once,
        PTM-B and PTM-C all hold. The joint breaks on over-scoped sentences
        (O-8, O-9). Three sentences assert a correction to an unnamed claimed
        gain, and two state a bit-level movement or ambiguity of the relation
        column, one of them on a k the contract itself records as NOT COMPUTED.
        It also breaks on PTM-A: nothing states the ker-g expectation at k = 1,
        so the rules can report a forbidden basis difference on the null object
        (O-10). And it breaks on PTM-D: the self-test object is inconsistent with
        definitions.k_and_q, and its rejection is overdetermined by E1's size
        bound (O-11).
    - id: R-J5
      subject: J5, blind re-derivation (TASK-20260924-624abf), compared value by value before any key (CB-4)
      ruling: >-
        AGREES on every computed value. Q1: all six ord_n(2) values equal the
        frozen census. Q2: at K-163, K-233, K-283, K-409, K-571 and ECC2K-130, r
        (exact string equality, checked by anchored search in both files), k and
        the verdict all equal the frozen table. The five c2pnb rows are NOT
        COMPUTED in the contract (IMP-X962). J5 reaches the same under the plan's
        own source definition (its Q0-02 reading (b)), so there is no value
        disagreement, and K-impediment holds for them. J5's "inconclusive"
        attestation is by design (BL-5) and is not K-infra. The census remains
        DESIGN FIGURES until Part 1 of an approved run reproduces it.
    - id: RL-C5
      subject: c2pnb source tier (J5 Q0-01 and Q0-02; J2 m-J2-4)
      key: K-indeterminate, applied narrowly on C5
      ruling: >-
        The 1997 ANSI X9.62 working draft that J5 retrieved is not the published
        edition, and it is not a primary standard that reproduces the published
        one verbatim and says so. Under SR-SRC-1 and the blind-inputs source
        rule, the five rows stay NOT COMPUTED and IMP-X962 stands. J5 does report
        an admissible choice that would change those rows if a draft tier were
        admitted, so K-indeterminate ("reports a choice that changes one") is
        applied on C5 for those rows alone. Neither side is preferred, and there
        is no arithmetic disagreement. The revision decides by rule, before
        reading any value, whether a committee working draft is a separately
        labelled source tier, how the standard's curve name is mapped to the
        program label, and how NOT COMPUTED entries are compared. The revision
        must not transcribe any c2pnb value from the J5 report. Any c2pnb value
        it freezes gets its own blind re-derivation.
    - id: RL-GGMP
      subject: IMP-GGMP and condition C4 (O-7)
      ruling: >-
        The impediment recorded the producer's lack of a web tool, not
        unreachability. TASK-20260924-eaf78a retrieved eprint 2020/1315 with
        provenance retrieved and found KN-OPEN-095df5's relay accurate. The C4
        branch of K-impediment is therefore moot for the revision. The revision
        reads the source, or cites the archived retrieval, and amends the
        "unread" wording. The contract's wording was accurate for its session
        and is not a defect by itself.
    - id: RL-O6
      subject: the contract's L3 against GGMP Lemma 3.3 in the raw basis (O-6)
      ruling: >-
        Not a tripwire now. TB-2 names validated evidence records and promoted
        findings, and no record proposes that the lemma fails. The observation
        rests on two toy cells and is a pointer. Pre-declared routing: the
        revision states the basis-dependence explicitly. Any record that proposes
        that GGMP Lemma 3.3 fails as stated is a contradiction claim under
        AGENTS.md core rule 12 and runs at review-breakthrough at max, in the
        first round that states it.
    - id: RL-PROVENANCE
      subject: provenance, custody and disclosure items
      ruling: >-
        (a) The FIPS hash attribution (RI-1): two independent retrievals agree
        with the frozen PDF and its sidecar. The defect is the attribution
        sentence in inputs/FIPS186-4-BINARY-CURVES/source_record.yaml. It is a
        provenance defect, not a mathematical result, and is routed to an
        additive correction (NA-2). (b) The ECC2K-130 row: J2 read the Certicom
        primary in the repository and J5 read Bailey et al.; they agree, and the
        revision names Certicom as the row's primary (m-J2-2). (c) The J5 leak
        assessment is accepted: none of its four near items states an answer.
        (d) The J5 permission denial and egress block, the red team's broken
        cryptography import, and the scratch installs are infrastructure facts
        and are never evidence (CB-9). (e) The disclosed read-scope departures
        of TASK-20260924-a2c79b (custody git history, one lane-A commit subject
        line with no content) and of TASK-20260924-eaf78a (a schema read of
        tools/check_review_independence.py, and lane-A selection text inside
        DEC-20260924-99ce20, which is in its read scope) are accepted. Neither
        breaches lane-B mutual blindness or bears on a joint. (f) Custody: both
        non-blind reviewers matched all three producer files to the
        TASK-20260924-77d46f receipt.
    - id: R-PRIOR
      subject: recorded prior against the outcome (CB-5; plan PD-R1)
      ruling: >-
        The prior set approval at about 0.35 and expected the round to break on
        J2 through C5 row sourcing. The outcome is revise, but for other reasons.
        J2 broke on C1, not C5, and C5 met K-impediment. J3, which the prior
        rated 0.7 to hold and did not list as a likely break, broke on a missing
        quotient-equation certificate. That is the most informative result of
        the round. J4 broke on scope, not on rho. J1 held as expected. J5 agreed,
        as expected, and the gap sat in sourcing as predicted. None of the three
        overturning events the prior named occurred. Under PD-R1 the prior was
        informed, so J2's concurrence with the proposal's values is weak, and
        J5's blind agreement carries the arithmetic.
    - id: R-HOLDS
      subject: HOLD-B, HOLD-C and HOLD-M, which revisit on this lane's outcome (CB-11, lane-B specific)
      ruling: >-
        Lane B is not withdrawn. It composes to revise and continues as a
        revision lane. HOLD-B (IDEA-20260922-1a081a, IDEA-20260922-c07598): its
        trigger fires when this decision is official. The per-orbit unit is not
        yet fixed by an approved contract and nothing is measured, so the C3
        dependence stays open. As a pointer only, the red team read
        IDEA-20260922-1a081a C3 as dividing the Frobenius-aware relation count
        once (O-8). HOLD-C (IDEA-20260922-c48e7d, IDEA-20260922-40003d): its
        trigger was met at TASK-20260924-77d46f. This lane adds blind J5
        agreement on the six ord_n(2) values. IDEA-20260922-c48e7d may cite
        EXP-BINSTD-178742 structural_certificate.census by path and snapshot
        hash, qualified as design figures, and the revision carries the census
        unchanged (C3). HOLD-M (IDEA-20260922-2e2a58): its trigger needs S2 to
        compose and GOAL-ICPERF-e6b6a4's engine decision. S2 composed as revise,
        so the hold stays until the revised contract composes. The ranking
        positions of these holds belong to the NA-7 re-rank in
        DEC-20260924-124667.

  rationale:
    - >-
      Keys applied as written (CB-7), with no relaxation. K-approve needs J1 to
