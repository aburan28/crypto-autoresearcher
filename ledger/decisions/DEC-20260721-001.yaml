coordinator_decision:
  id: DEC-20260721-001
  context: >-
    EXP-SEMAEV-002 independently measured m=2 factor-base decomposition yield
    (structured vs matched random) over toy fields. The predefined 1.5x ratio
    threshold was tripped in 4 of 9 cells, but only in the low-count / high-bit
    regime where the ratio estimate is dominated by sampling noise and the
    effect direction is inconsistent (random beats structured at b14s2). At the
    only well-powered bit size (12) ratios are <= 1.18.
  decision: refine
  target_ids: [H-SEMAEV-002, EXP-SEMAEV-002]
  rationale:
    - the raw threshold trips are not a structural effect; treating them as one
      would be a false positive
    - the v1 protocol lacked a minimum-count / statistical-power gate, so the
      falsification threshold is meaningless in the high-bit low-yield regime
    - a redesign can decide the question in the powered regime
  evidence_refs: [EV-SEMAEV-002]
  limitations:
    - claim tier toy; m=2 only; no crypto-scale or m=3 inference
    - only bits=12 cells carry adequate statistical power in this batch
  next_actions:
    - design EXP-SEMAEV-003 with a minimum-count gate (evaluate ratios only where
      found_random >= 30) and many more targets at higher bits, reporting
      per-cell confidence intervals instead of a bare 1.5x threshold
    - keep H-SEMAEV-002 at status analyzed pending the powered redesign
  decided_by: coordinator
  decided_at: '2026-07-21'
