  the_batch_002_identity_question:
    the_tension_stated_without_smoothing: >-
      THIS RECORD OPENS A DISPATCH QUEUE UNDER A BATCH THE GOAL HEAD RECORDS AS
      CLOSED, AND THAT MUST BE FACED RATHER THAN LEFT FOR A READER TO NOTICE.
      GOAL-PATH-001's BATCH-002 checkpoint says the batch was decided 2026-08-02,
      that its outcome was prioritization_made_and_child_checkpoint_verified, that
      "BATCH-002 has NO PATH-owned coordination directory and no PATH-owned
      dispatch queue", and that "its execution artifacts live under GOAL-MONO-001
      BATCH-003". The head's dispatch_queue_path_note adds "BATCH-002 WAS CREATED
      AND IS CLOSED". Yet DEC-20260810-2f92d8 -- the very decision that WROTE that
      checkpoint, late, on 2026-08-10 -- commissioned TASK-20260810-9e7f4c with
      batch_id BATCH-002 and gave it its own batch-scoped write_scope.
    the_reading_taken: >-
      BATCH-002 HAS TWO HALVES AND ONLY ONE OF THEM CLOSED. The PRIORITIZATION
      half was decided on 2026-08-02 by DEC-20260802-505759 / DEC-20260802-a51c82
      and is closed; the checkpoint records it accurately and IS NOT REOPENED,
      VACATED, AMENDED OR CONTRADICTED by anything here. The EXECUTION half --
      one coordinator-only, zero-run reconciliation, assigned batch_id BATCH-002
      by the same decision that wrote the checkpoint -- was commissioned and never
      dispatched. This queue serves that half and only that half. The checkpoint's
      "no PATH-owned coordination directory" is a true statement of the state on
      2026-08-10 and it remains immutable and unedited; what changes is the state,
      not the record of it.
    the_alternative_considered_and_refused: >-
      MINTING A FRESH BATCH IDENTIFIER FOR THE RECONCILIATION -- BATCH-992800 was
      allocated and available -- WAS CONSIDERED AND REFUSED. TASK-20260810-9e7f4c's
      IMMUTABLE envelope declares `batch_id: BATCH-002` and its write_scope is
      literally coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/;
      the goal head's current_batch_id is BATCH-002. Running the task under any
      other batch identifier would either require editing that immutable record --
      forbidden by AGENTS.md rule 2 -- or knowingly commit a queue whose batch
      disagrees with the envelope it dispatches and with the goal head. A batch
      whose name disagrees with its own handoff is a worse record-integrity defect
      than a batch with two halves, and the second is at least true.
    what_nothing_mechanical_checks: >-
      DISCLOSED SO THE JUDGEMENT IS NOT MISTAKEN FOR A VALIDATED FACT. The driving
      session reports that `batch_id` appears ZERO times in
      tools/research_dispatch.py, so no tool validates this correspondence. THE
      READING ABOVE IS A COORDINATOR RECORD-INTEGRITY CALL, argued from committed
      text, and a later session that reads the checkpoint differently should
      supersede this record rather than quietly re-interpret it.

  obstacle_resolutions:
    numbering_note: >-
      Three obstacles were put to this session. TWO ARE REAL AND ARE RESOLVED
      BELOW AS OB-1 AND OB-3. OB-2 WAS FALSE AND IS RETRACTED -- see
      budget_premise_retracted_not_an_obstacle. The numbering is preserved rather
      than compacted so that a reader comparing this record against the briefing
      chain can see which of the three fell.
    resolved:
    - id: OB-1
      obstacle: >-
        THE QUEUE SCHEMA REQUIRES EVERY NON-ARCHIVE TASK TO BE ASSIGNED TO AN
        IN-QUEUE ARCHIVE TASK. Established empirically by the 2026-09-04 finding
        and INDEPENDENTLY REPRODUCED by the driving session at HEAD 84fbc464c,
        both reporting the identical error: "non-archive task TASK-20260810-9e7f4c
        must be assigned exactly once to an archive task".
      resolution: >-
        RESOLVED BY THE SELECTED SHAPE. TASK-20260906-b44b88 is the in-queue
        archive and TASK-20260810-9e7f4c is its single source_task_id, which is
        the field the dispatcher actually reads: assignment is made SOLELY by
        `archive.source_task_ids`, and the driving session reports that the string
        `archived_by` does not appear in tools/research_dispatch.py at all.
      the_allocated_archival_task_is_named_here_so_the_binding_is_committed: >-
        TASK-20260906-b44b88 IS THE ONE ARCHIVAL TASK THAT OWNS
        TASK-20260810-9e7f4c'S ARTIFACTS. Recorded in this decision, and not only
        in the queue, because the queue is not bound by any receipt of this batch
        (see the batch record's queue_binding_note) while this decision will be.
    - id: OB-3
      obstacle: >-
        THE GOAL HEAD'S dispatch_queue_path NAMES THE COMPLETED BATCH-001 QUEUE
        WHILE current_batch_id IS BATCH-002. Re-verified directly by the driving
        session on 2026-09-06 against the committed head. This is why
        tools/goal_portfolio_health.py files an ECC goal with an outstanding next
        action under "batch complete": the pointer aims at a batch that really is
        finished.
      why_the_repair_is_legitimate_now_and_was_not_before: >-
        BOTH HALVES MATTER AND BOTH ARE STATED. FIRST, THE NOTE'S OWN REASON
        LAPSES BY CONSTRUCTION: the head's dispatch_queue_path_note says the
        pointer is "DELIBERATELY STILL BATCH-001" because "pointing this field at
        a BATCH-002 path would name a file that does not exist", and its
        2026-08-18 re-verification repeats "There is no BATCH-002 directory and no
        BATCH-002 queue to repoint at". The moment
        coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json
        exists, that stated reason ceases to hold -- and the note was always a
        statement of fact, not a policy. SECOND, THE FINDING'S OBJECTION IS
        ANSWERED: it declined the repair because moving a goal-head pointer
        without a committed decision silently changes which batch the portfolio
        tool reports. THIS RECORD IS THAT COMMITTED DECISION, so the change is no
        longer silent.
      the_repair: >-
        Set ledger/goals/GOAL-PATH-001.yaml dispatch_queue_path to
        coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json.
      applied_by: >-
        THE DRIVING SESSION, NOT THIS ONE. ledger/goals/GOAL-PATH-001.yaml is not
        edited by this record's author, so the repair rides one commit with the
        validator run. The immutable BATCH-001 and BATCH-002 checkpoints are not
        touched; BOTH existing dispatch_queue_path notes are PRESERVED rather than
        deleted, because they are the record of why the pointer was stale and for
        how long; and status, campaign_budget, completion_criteria,
        pause_conditions, latest_verified_commit, batch_checkpoints and
        next_action are all unchanged by it.
      what_the_repair_does_not_mean: >-
        IT IS NOT A STATEMENT THAT BATCH-002 IS RUNNING, THAT ANY WORK IS DONE, OR
        THAT ANY RESULT EXISTS. It makes the portfolio tool report the batch that
        current_batch_id already names. A queue that exists is not a task that ran.

  budget_premise_retracted_not_an_obstacle:
    status: >-
      A THIRD PREMISE OF THE INHERITED DIAGNOSIS IS STALE AND IS RETRACTED HERE.
      IT IS RECORDED AS A POSITIVE FINDING, NOT AS AN OBSTACLE, AND IT PRODUCES NO
      PROCEDURE DEVIATION. This session was briefed that
      ledger/handoffs/TASK-20260810-9e7f4c.yaml's budget
      {wall_clock_seconds: null, memory_gb: null, maximum_runs: 0} fails all three
      of tools/research_dispatch.py validate_handoff's checks, and that the queue
      would therefore have to declare a divergent budget. THAT IS FALSE. THE
      COMMITTED BUDGET VALIDATES EXACTLY AS WRITTEN, WITH NOTHING TO WORK AROUND
      AND NO DIVERGENCE TO DECLARE.
    mechanism: >-
      tools/research_dispatch.py `declares_zero_compute` (lines 105-127), called
      from validate_handoff (lines ~404-422). A budget that DECLARES
      experiment_maximum_runs 0 or maximum_runs 0 thereby declares the task runs
      no experiments; wall_clock_seconds and memory_gb may then be null (the
      `continue` at line ~412), and minimum_runs drops from 1 to 0 so
      maximum_runs 0 is accepted. The hatch's docstring names the two goals that
      sat in needs_repair and undispatchable under the old rule -- GOAL-ECDLP-001
      BATCH-e6c1c9 and GOAL-MD5-001 BATCH-ebac02 -- "over a compute ceiling for
      compute that is never spent", and states the principle: "a task claiming
      zero runs may omit the wall-clock and memory ceilings that bound runs".
      tools/test_research_dispatch.py:925
      test_maximum_runs_zero_may_leave_ceilings_null pins exactly this shape. A
      coordinator-only zero-run reconciliation is the intended beneficiary of that
      hatch, not an exception to it.
    the_envelope_had_already_reasoned_it_correctly: >-
      QUOTED BECAUSE IT SETTLES THE QUESTION FROM THE OTHER SIDE. The producer's
      own budget_note reads: "maximum_runs 0 IS THE BINDING BOUND: this task
      authorizes no execution, so there is no run to bound in time or memory.
      wall_clock_seconds and memory_gb are null BECAUSE NO COMMITTED RECORD FIXES
      A BUDGET FOR A COORDINATOR LEDGER-READ TASK, and inventing one would be a
      fabricated number under AGENTS.md rule 9." The nulls were deliberate,
      reasoned and right, and the tool now agrees with them.
    provenance_of_the_retraction: >-
      STATED PRECISELY, BECAUSE A DIVISION OF LABOUR IS NOT A REPLICATION. THE
      DRIVING SESSION RAN THE CHECK: it exercised the real committed functions
      against the real committed budget and reports declares_zero_compute True,
      null wall_clock_seconds ACCEPTED, null memory_gb ACCEPTED, maximum_runs 0
      ACCEPTED, BUDGET ERRORS NONE. THIS SESSION RAN NOTHING -- no dispatcher, no
      test, no shell -- and reached the same conclusion independently but ONLY BY
      READING the committed source and its committed test at the lines named
      above, before the correction arrived. No third party has confirmed either.
    why_the_prior_sessions_believed_otherwise: >-
      REPORTED BY THE DRIVING SESSION AND NOT VERIFIED HERE (no shell, no git).
      The zero-compute hatch was added 2026-09-04 15:55:52 +0000 in commit
      d6c7cf509, "harness: unblock the ECDLP lane and make goal selection
      ECDLP-first". FINDING-20260904 was recorded the same day and its empirical
      work predates or races that commit; CORR-20260905-bbd1a8 inherited the claim
      without retesting it.
    consequence_for_this_batch: >-
      THE QUEUE COPIES THE IMMUTABLE ENVELOPE'S BUDGET THROUGH UNCHANGED, AND
      TASK-20260906-b44b88 IS GIVEN THE SAME HONEST DECLARATION -- maximum_runs 0
      with both ceilings null -- ON THE ENVELOPE'S OWN PRECEDENT, because a
      Coordinator archive task runs no experiment either. NO POSITIVE WALL-CLOCK
      OR MEMORY FIGURE IS INVENTED FOR EITHER TASK, AND `maximum_runs: 1` APPEARS
      NOWHERE IN THIS BATCH. A fabricated ceiling for compute that is never spent
      is precisely what CLAUDE.md rule 5 forbids and what the hatch exists to stop.
    what_is_retired_and_exactly_whose_claim_it_was: >-
      ATTRIBUTED RATHER THAN ROUNDED OFF. The premise reached this session through
      its briefing chain; neither FINDING-20260904 nor CORR-20260905-bbd1a8 states
      it in its own text, and the finding's one empirical rejection is the
      ARCHIVE-ASSIGNMENT error of OB-1, a different check that is NOT retracted.
      What is retired is the budget half of the diagnosis AS RECEIVED, not a
      sentence either committed record wrote.
    the_general_lesson_third_instance: >-
      A TOOL OR POLICY CHANGE ENFORCED GOING FORWARD DOES NOT REACH THE PROSE OF
      RECORDS THAT ALREADY REASONED ABOUT THE OLD REGIME, AND THIS IS THE THIRD
      INSTANCE IN THREE DAYS -- after CORR-20260905-bbd1a8's two (a `paused` goal
      status that is no longer permitted, and an exhausted ECC budget that is now
      unlimited). A validator refuses a forbidden status; nothing refuses a
      sentence asserting that some other rule still binds. The mitigation is the
      one that correction already named: cite the thing you reason about BY
      LOCATOR -- file, function, line -- so the next reader re-checks it in
      seconds instead of inheriting it. Every claim about the dispatcher in this
      record is cited that way for exactly that reason.

  procedure_deviation_recorded_in_this_batch:
    id: PD-1
    where_it_is_also_recorded: coordination/goals/GOAL-PATH-001/batches/BATCH-002/batch.yaml
    what: >-
      AN INSTRUCTION IN A COMMITTED RECORD CANNOT BE LITERALLY OBEYED, AND THE
      REASON IS AN INVARIANT RATHER THAN AN OVERSIGHT.
      ledger/handoffs/TASK-20260810-9e7f4c.yaml orders: "THE DISPATCHING SESSION
      MUST ALLOCATE THAT ARCHIVAL TASK AND SET THIS FIELD BEFORE DISPATCH." The
      allocation is done -- TASK-20260906-b44b88 -- but the field cannot be set,
      because the record is committed and immutable and AGENTS.md rule 2 permits
      supersession, never overwriting. `archived_by` therefore STAYS NULL IN THE
      ENVELOPE FOREVER.
    how_the_substance_is_discharged: >-
      BY THE FIELD THE DISPATCHER ACTUALLY ENFORCES. The queue's
