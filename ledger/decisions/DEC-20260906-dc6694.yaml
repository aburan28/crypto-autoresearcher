coordinator_decision:
  id: DEC-20260906-dc6694
  decided_at: '2026-09-06'
  decided_by: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-002

  decision: supersede
  decision_note: >-
    supersede IS THE TEMPLATE VOCABULARY TOKEN, AND WHAT IS SUPERSEDED IS ONE
    GOAL-HEAD FIELD -- NOT A RESULT, NOT A PRIORITIZATION, AND NOT ANY PRIOR
    DECISION. The same token was used the same way by DEC-20260810-2f92d8
    ("WHAT IS SUPERSEDED IS A GOAL HEAD, NOT A RESULT"). Concretely superseded:
    ledger/goals/GOAL-PATH-001.yaml `dispatch_queue_path`, which still names the
    completed BATCH-001 queue, together with the stated premise of its two
    accompanying notes. Everything else this record does is CONSTRUCTIVE, not
    superseding: it creates the BATCH-002 coordination directory and dispatch
    queue that were never created, and it allocates and names the archival task
    that ledger/handoffs/TASK-20260810-9e7f4c.yaml explicitly ordered the
    dispatching session to allocate. THIS RECORD AUTHORIZES A DISPATCH, NOT A
    RESEARCH CHOICE. No experiment is approved, no protocol frozen or amended, no
    measurement authorized, no DREG batch opened, no claim tier moved, no
    hypothesis status changed, and no goal status changed.

  target_ids:
  - GOAL-PATH-001
  - BATCH-002
  - TASK-20260810-9e7f4c
  - TASK-20260906-b44b88
  - DEC-20260810-2f92d8

  context: >-
    GOAL-PATH-001 has carried exactly one authorized next action since
    2026-08-10 (DEC-20260810-2f92d8 N-1): dispatch TASK-20260810-9e7f4c, a
    coordinator-only, zero-run reconciliation of GOAL-DREG-001's head against its
    committed BATCH-004 and BATCH-005 archives and against defects CD-1 and CD-2.
    IT HAS NEVER RUN, BECAUSE IT COULD NOT BE DISPATCHED: the goal has no
    BATCH-002 coordination directory, no BATCH-002 dispatch queue, and the task
    appears in no queue anywhere in the repository. Two prior sessions diagnosed
    this and both deliberately stopped short of repairing it, each for a stated
    reason, and the reason was the same both times -- no committed authority
    existed to add a task to a batch or to move a goal-head pointer. THIS RECORD
    IS THAT AUTHORITY AND IS NOTHING MORE. It inherits both prior diagnoses rather
    than re-deriving them, and it retires two of their conclusions on evidence
    neither session had.

  inherited_findings:
  - source: coordination/remediation/FINDING-20260904-path-001-batch-002-undispatchable.md
    recorded_by: 'standing coordinator session coordinator-aes-1, 2026-09-04'
    established_and_relied_on: >-
      (i) ledger/handoffs/TASK-20260810-9e7f4c.yaml is present and declares
      batch_id BATCH-002; (ii) the goal head's current_batch_id is BATCH-002 while
      its dispatch_queue_path still names
      coordination/goals/GOAL-PATH-001/batches/BATCH-001/dispatch_queue.json;
      (iii) coordination/goals/GOAL-PATH-001/batches/BATCH-002/ DOES NOT EXIST;
      (iv) the task appears in NO dispatch queue repository-wide; (v)
      EMPIRICALLY, a minimal BATCH-002 carrying only the commissioned task is
      rejected with "non-archive task TASK-20260810-9e7f4c must be assigned
      exactly once to an archive task"; and (vi) CD-1 is real, checked directly
      against DEC-20260731-014's committed content. ALL SIX STAND AND ARE RELIED
      ON BELOW. Its four recorded refusals -- not dispatching outside the
      dispatcher, not inventing an archive task, not moving the goal-head pointer,
      and deleting rather than committing its diagnostic queue -- were correct on
      the information that session had, and none is second-guessed here.
    two_conclusions_retired: >-
      RETIRED ON THE ENVELOPE'S OWN TEXT, WHICH NEITHER PRIOR SESSION QUOTED.
      FIRST, the finding concludes that "the only way to make it dispatchable is
      to invent an archive task the decision never authorized". THAT IS NOT SO:
      ledger/handoffs/TASK-20260810-9e7f4c.yaml's archived_by_note ORDERS the
      allocation in terms -- "Exactly one snapshot archival task must own this
      task's artifacts ... THE DISPATCHING SESSION MUST ALLOCATE THAT ARCHIVAL
      TASK AND SET THIS FIELD BEFORE DISPATCH." TASK-20260906-b44b88 is the
      DISCHARGE OF A STANDING INSTRUCTION, not an invention. SECOND, the finding
      concludes that "the batch shape the decision commissions is not representable
      in the queue schema". Too strong: the commissioned shape -- one producer plus
      exactly one archival task owning its artifacts -- is representable, and the
      driving session has now rendered it. WHAT WAS MISSING WAS NEVER THE SHAPE.
      IT WAS THE BATCH DIRECTORY AND THE QUEUE.
    what_that_does_not_change: >-
      The finding's obstacle is REAL and is independently reproduced below. A
      conclusion drawn one step too far does not retract the measurement under it,
      and the finding's central service -- establishing, empirically, that a
      one-task BATCH-002 cannot dispatch -- is exactly what made this record
      necessary.
  - source: ledger/corrections/CORR-20260905-bbd1a8.yaml
    recorded_by: 'the orchestrating session, 2026-09-05'
    established_and_relied_on: >-
      CD-1 IS CONFIRMED as a verified misattribution rather than an alleged one,
      and TWO PREMISES of GOAL-PATH-001's standing refusal of option (c) are no
      longer true. See cd_1_status and stale_premises_recorded below. That record
      explicitly declined to re-make the three-way choice; this record declines it
      for the same reason and says so again below.

  the_choice_this_record_makes:
    question: >-
      The 2026-09-04 finding named two admissible dispositions and required a
      decision rather than an edit: (A) amend the queue schema's expectation for a
      one-task coordinator batch, or (B) shape the batch with an IN-QUEUE ARCHIVE
      TASK.
    selected: option_B_in_queue_archive_task
    selected_shape: >-
      BATCH-002 is a TWO-TASK, STRICTLY SERIAL batch at max_concurrent 1.
      TASK-20260810-9e7f4c is the commissioned coordinator-only, ZERO-RUN
      reconciliation producer, with its objective, preconditions, inputs,
      constraints, deliverables D1-D6, write_scope, artifact_paths, inference
      block, budget and completion gate copied from its immutable envelope.
      TASK-20260906-b44b88 is a Coordinator SNAPSHOT archive task that RUNS ALONE,
      whose single source_task_id is TASK-20260810-9e7f4c, and whose commit scope
      is therefore that task's two declared artifacts plus its own
      snapshot-receipt.json.
    why_B_and_not_A:
    - id: R-1
      text: >-
        OPTION A CHANGES A SHARED TOOL TO FIT ONE BATCH, AND THE DEFECT WAS NEVER
        IN THE TOOL. The rule it would relax -- every non-archive task is owned by
        exactly one in-queue archive -- is the rule that lets an archive receipt
        say which produced artifacts it binds. Relaxing it repository-wide to
        dispatch one two-file coordinator task would trade a durable custody
        invariant for a scheduling convenience, in a repository whose recorded
        failures are custody failures (CORR-20260802-7787de's unresolvable commit
        on this very goal; CD-1's unmatched receipt hash on GOAL-DREG-001's).
    - id: R-2
      text: >-
        OPTION B INVENTS NOTHING. This is the decisive point and it rests on
        committed text. The producer's own envelope says an archival task MUST own
        its artifacts, that the identifier could not be minted by its authoring
        session, and that the dispatching session must allocate it before
        dispatch. It even states the consequence of failing to: "A task whose
        archive receipt is never written cannot reach completed and must be closed
        invalid instead." Allocating TASK-20260906-b44b88 discharges that
        instruction. The finding's objection to "inventing an archive task the
        decision never authorized" does not bite, because the decision's own
        handoff authorized it explicitly.
    - id: R-3
      text: >-
        THE SHAPE IS THE ONE THIS GOAL ALREADY USES. GOAL-PATH-001 BATCH-001's
        committed queue has exactly this form: one coordinator producer
        (TASK-20260725-670) followed by one coordinator SNAPSHOT archive
        (TASK-20260725-671) owning a snapshot-receipt.json. BATCH-002 is the same
        pattern with one producer instead of one, and no novelty at all.
    shape_verified_by_the_driving_session_not_by_this_one: >-
      MEASURED, AND MEASURED BY THE SESSION THAT HAS A SHELL. The driving session
      ran validate_queue from tools/research_dispatch.py at HEAD 84fbc464c against
      candidate queues and reports: the ONE-TASK queue fails with the exact string
      "non-archive task TASK-20260810-9e7f4c must be assigned exactly once to an
      archive task", independently reproducing the 2026-09-04 finding's rejection;
      and the TWO-TASK queue renders, under either archive kind. THIS SESSION RAN
      NOTHING. It holds Read, Grep, Glob, Write and Edit and no shell, asserts no
      dispatcher output of its own, and reached its own reading of the schema only
      by reading tools/research_dispatch.py. NEITHER READING IS A REPLICATION OF
      THE OTHER.
    why_the_archive_kind_is_snapshot: >-
      THREE COMMITTED SOURCES AGREE AND NONE DISSENTS. (i) The producer's envelope
      names "exactly one SNAPSHOT archival task" in archived_by_note and repeats
      it in its completion_gate: artifacts "are committed by a Coordinator
      snapshot archival task run alone, whose receipt the post-commit verifier
      accepts". (ii) The producer writes NOTHING under ledger/ -- its
      write_scope_note says so in terms -- so there is no ledger record for a
      ledger archive to own, and tools/research_dispatch.py _validate_ledger_archive
      requires a ledger archive to own an exact artifact under ledger/decisions/.
      (iii) BATCH-001's own committed archive on this goal is kind snapshot owning
      a snapshot-receipt.json. A ledger-kind archive was considered and refused:
      it would have had to own THIS decision record, a file the driving session
      commits before the archive task ever runs, which is custody theatre rather
      than custody. The LEDGER archive that dispositions the reconciliation is a
      later, separate act (N-3), because its decision identifier cannot be minted
      here and its content does not exist until the producer returns.
    why_binding_mode_is_content_first: >-
      CHOSEN, NOT DEFAULTED, AND FOR A REASON SPECIFIC TO THIS GOAL.
      binding_mode is optional -- BATCH-001's archive carries none -- and
      `content_first` is declared here because GOAL-PATH-001 ALREADY HAS ONE DEAD
      COMMIT BINDING. CORR-20260802-7787de records that this goal's prior
      latest_verified_commit 9f80eebbef2df9a521a9cce8da66391cfcb63e73 DOES NOT
      RESOLVE while its recorded parent does -- "the signature of a branch tip
      replaced by a squash merge" -- and that no commit in the repository
      reproduces the 61 declared path hashes of the BATCH-001 receipt. CLAUDE.md's
      answer to exactly that failure is that receipts bind to CONTENT first and
      commit reachability is advisory. A content-first binding on this goal's next
      receipt repairs a demonstrated failure mode. A CONTENT MISMATCH REMAINS
      FATAL and nothing here weakens that.
    cost_of_the_choice_stated_plainly: >-
      BATCH-002 gains one task that DEC-20260810-2f92d8's next_actions do not name
      by identifier. It buys nothing scientific: zero compute, no research
      artifact, one receipt file. It is recorded as a real addition rather than
      presented as free.

  what_is_not_superseded:
    dec_20260810_2f92d8_n_2: >-
      NOTHING OF N-2 IS SUPERSEDED, AND AN EARLIER DRAFT OF THIS RECORD SAID
      OTHERWISE. N-2 commissioned one Coordinator LEDGER commit staging exactly
      ledger/decisions/DEC-20260810-2f92d8.yaml,
      ledger/handoffs/TASK-20260810-9e7f4c.yaml and
      ledger/goals/GOAL-PATH-001.yaml, pushed to a branch with an open PR. The
