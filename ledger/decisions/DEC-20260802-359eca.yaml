  # ------------------------------------------------------------------
  # GOAL RECORD HANDLING - a late checkpoint must not regress the goal
  # ------------------------------------------------------------------
  goal_record_handling:
    principle: >-
      BATCH-009 is chronologically earlier than the goal's current state.
      DEC-20260803-c7a1a3 has since moved the goal to `current_batch_id:
