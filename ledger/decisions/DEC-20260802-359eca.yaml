  # ------------------------------------------------------------------
  # KNOWLEDGE PROMOTION
  # ------------------------------------------------------------------
  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED, on four concrete grounds, with the candidates really
      considered rather than waved past.
      CANDIDATE A - a KN-FIND on the CONTROLLED NULL: "over the resolved band of
      Carrier's archived toy-parameter Pwrong files, Approximation 4.9's tail
      form is not distinguishable from a + b*T^(1/3) at equal parameter count,
      and the informative region carries an AR(1) effective sample of about
      three." This is the most corpus-worthy thing in the batch and it is REFUSED
      FOR NOW because it was computed ONCE, by one session, and has never been
      independently re-derived - the first validation died and no red team was
      dispatched. Promoting a single-session null into the corpus would assert a
      stability nobody has checked, which is the same error in the negative
      direction that BATCH-010 declined in the positive one.
      CANDIDATE B - a KN-FIND on the SURVIVING CROSS-FILE CONSISTENCY CHECK (the
      exact 1.50 shift, r = 2.122 against 2.130). REFUSED because it too was
      computed once; because its central object, Phi, is absent from every byte
      in this repository so the finding's own premise is a declared reading; and
      because the two files differ in n, n_lat, beta_0, beta_1, avg_N AND
      nb_iteration, so the check compares two points that differ in more than the
      one variable it reads. A corpus entry would fabricate stability.
      CANDIDATE C - amending KN-OPEN-016 or KN-OPEN-017 with the F1 result.
      REFUSED because the KN-OPEN-016 amendment is one of the three transitions
      the unserved AGENTS.md rule-12 gate governs, and this batch may not touch
      it. Recorded as still OWED.
      STRENGTH GROUND, independent of the above: EV-MLKEM-019 carries
      `strength: preliminary`, below the `replicated`/`strong` threshold at which
      promotion becomes mandatory, and the disposition is `weaken` on a claim
      rather than `support` or `reject_scoped` on replicated evidence. Recorded
      for completeness and explicitly NOT offered as the reason - the reasons are
      the three above.
      PROCEDURAL GROUND, also independent: TASK-20260802-43e5e4's declared
      write_scope is exactly four paths and contains no `knowledge/` path.
      Writing one would expand a declared archival path set and break the archive
      contract (AGENTS.md "Durable research commits"); a knowledge promotion
      belongs to a task that declares it.
    concrete_successor: >-
      ONE promotion task, declaring `knowledge/` in its write_scope, dispatched
      only AFTER an independent session that did not author them has re-derived
      the two validator-originated controls - the null-object fit table and the
      cross-file exponent shift - from the same archived bytes. If both survive,
      the KN-FIND to write is a SINGLE entry pairing them: "the archived Fig 4.1
      Pwrong measurement cannot discriminate Approximation 4.9's tail form from
      generic two-parameter alternatives over its resolved band, at an effective
      sample size of about three; what it DOES support is a between-file exponent
      shift matching the archived integers to 0.4%", with `dominated_by` and
      `sota_delta` filled per docs/inventor-protocol.md section 5. If the
      re-derivation disagrees with either, the successor is a correction record
      and no promotion. That re-derivation task is ranked first below.

  # ------------------------------------------------------------------
  # RANKING RATIONALE
  # ------------------------------------------------------------------
  ranking_rationale:
    basis: >-
      AGENTS.md "Research-direction integrity and auditability" and
      docs/inventor-protocol.md section 4. IMPORTANT SCOPE LIMIT: this ranking
      allocates NOTHING. BATCH-011 is already authorized by DEC-20260803-c7a1a3
      and the goal's single next_action names its producing task; this decision
      does not reprioritise the roadmap, does not add a second next action, and
      does not displace anything. What follows is the ordered successor set for
      the F1 THREAD, recorded so a future dispatcher can pick it up at BATCH-012
      or later without re-deriving the reasoning. No candidate is abandoned and
      each carries a revisit condition.
    the_judgement_that_matters: >-
      I rank REPLICATION of the validator's own novel controls above any new
      measurement, which inverts this campaign's usual bias toward new mechanism.
      The reason is specific rather than general: the three findings that carry
      this decision - and the one favourable finding that survives it - all come
      from ONE session, because the batch's first review died and no red team was
      dispatched. A `weaken` resting on a single unchecked computation is exactly
      the shape of conclusion the Coordinator contract tells me to replicate
      before hardening. It is cheap (no new compute, archived bytes only) and it
      is the gate on the only knowledge promotion this thread could produce.
    candidates:
      - id: F1a
        candidate: >-
          Independent re-derivation, by a session that authored none of them, of
          VAL-20260803-3346d2's five novel computations: the null-object fit
          table (D8), the fine exponent sweep and acceptance sets (D7), the
          residual/clip correlation with the Jensen bound (D6), the lever-arm and
          lag-1 autocorrelation measurement, and the cross-file exponent shift.
          Also resolve D3 - determine which implementation of the
          clipped_fraction column is right, since it indexes the confounded
          region and moves the sub-band boundary.
        rank: 1
        cost: One independent review session; zero new compute; archived bytes only.
        why_first: >-
          Everything this decision concludes, in both directions, currently rests
          on one unchecked session. This is the cheapest available action that
          can change what BATCH-009 is ABLE to support, and it is the declared
          gate on the knowledge promotion refused above.
        test_boundary: >-
          The same two archived toy files, the same resolved bands, the same
          declared reading of Phi. Nothing here reaches Kyber, ML-KEM, or the
          region below the counting floor.
        expected_outcome_stated_in_advance: >-
          Most likely confirmation, since the computations are deterministic over
          immutable bytes. THAT IS STILL WORTH BUYING at this price, because the
          alternative is a corpus entry and a `weaken` resting on n = 1. A task
          that can only confirm is not a test, so the deliverable must also
          report any of the five it CANNOT reproduce, and D3 gives it a real
          open question to answer.
        remaining_uncertainty: Whether an independent implementation reproduces D3's column at all.
      - id: F1b
        candidate: >-
          Widen the null-object family and score it honestly. The validator tested
          five alternatives at two free parameters; a proper family test would add
          the free-exponent form itself, use a model-selection criterion that
          accounts for the AR(1) effective sample of about three rather than the
          nominal 737 / 1242 points, and report what sample size WOULD be needed
          to separate the candidates.
        rank: 2
        cost: One producing run; archived bytes only; minutes of compute.
        why_second: >-
          It converts "the null does not discriminate" from an observation into a
          quantified statement about how much data discrimination would require -
          which is the form a future experiment design can actually use. Ranked
          below F1a only because replicating the existing controls is a
          prerequisite for trusting the window they are computed on.
        revisit_condition: Promote above F1a if F1a returns and any of the five fails to reproduce.
      - id: F3
        candidate: >-
          The missing decay control: vary nb_iteration under otherwise-fixed
          parameters, so that the support endpoint's destroying parameter is
          actually varied. Carried forward unchanged from
          DEC-20260802-56cc4b.ranking_rationale, where it was ranked second for
          BATCH-009.
        rank: 3
        cost: New sampling; a producing run of unestablished size.
        why_third_and_why_it_is_now_better_motivated: >-
          BATCH-009 sharpens rather than replaces it. D8 shows the archived data
          cannot discriminate functional forms, and the effective-DoF measurement
          shows why: one pooled count, three effective observations. A decay
          control is the one design change that adds independent information
          rather than re-reading the same three. Ranked third only because it
          needs new compute and this thread's cheap items are not yet done.
          Still blocked by the same fact EV-MLKEM-018 recorded: the archive has
          never contained a matched-budget control, and the one file with a
          different nb_iteration (beta037_beta144_N200001) is not in the
          repository at all.
        revisit_condition: >-
          Promote it above F1b if F1a confirms the controls, since at that point
          the archived bytes are exhausted and only new data moves the question.
      - id: F4
        candidate: >-
          A rare-event estimator for Pwrong at the operating threshold - the only
          route to the region where Approximation 4.9 is actually used.
        rank: 4
        cost: A new-compute project, not a batch.
        why_fourth: >-
          Unchanged from DEC-20260802-56cc4b: genuinely open and genuinely the
          most valuable thing on this list if it worked, but a counting estimator
          cannot reach 2^-129 and this needs a different instrument, not a longer
          run (EV-MLKEM-018: roughly 93-117 bits below the counting floor,
          approximately 2^105 to 2^129 iterations). NOT abandoned; ranked on cost.
        revisit_condition: >-
          Promote if any retrievable source supplies an importance-sampling or
          large-deviation estimator for this score statistic, or if the missing
          Carrier pages are retrieved and make an analytic route available.
      - id: F5
        candidate: >-
          Retrieve the Carrier pages defining Phi_dlsc (Approximation 4.6), alpha,
          delta(beta_bkz) with Lemma 2.9, and n_lsc - the only route to an
          ABSOLUTE-level test rather than a shape-and-relative one.
        rank: gate, not a rival
        stated_risk: >-
          Blocked on network policy, exactly as EV-MLKEM-017 recorded for the
          primary-source flank. Independently confirmed this batch that all four
          are absent from every repository byte. If retrieval ever succeeds it
          dominates F1b and F3 immediately, because it removes the free
          normalisation that makes every current statement relative.
      - id: F2
        candidate: >-
          The BATCH-008 successor that depends on KN-FIND-013's lever.
        rank: deferred, unchanged
        why: >-
          It touches records the unserved rule-12 gate governs. Deferred until
          that gate is served, exactly as DEC-20260802-56cc4b deferred it. Not
          cancelled.
      - id: F6
        candidate: >-
          The rule-12 `review-breakthrough` pass at `max` over the BATCH-007/008
          contradiction, still gating the KN-FIND-012 restatement, the KN-FIND-014
          withdrawal successor and the KN-OPEN-016 amendment.
        rank: gate, not a rival
        stated_risk: >-
          Still unservable in this environment on the last recorded probe. It is
          not optional and cannot be substituted; recording a degraded review as a
          rule-12 pass remains the one outcome worse than no review. BATCH-009 was
          chosen, like BATCH-010 and BATCH-011, as work that does not depend on
          it.
    dominated_by: >-
      NOT APPLICABLE, and stated in the form docs/inventor-protocol.md section 5
      declares valid rather than as an unchecked null: no attack, no algorithm, no
      speedup, no cost improvement and no security estimate is claimed by
      BATCH-009, so there is no Pareto row on any axis - time, memory, or
      data/queries - for it to be dominated on. An unchecked `null` would be a
      fabrication under AGENTS.md rule 9; this is an explicit statement that the
      frontier does not apply to a measurement-scope finding.
    sota_delta: >-
      ZERO against any external baseline. BATCH-009 produced no time, memory,
      data/query or security-bits improvement against any published result and
      claims none. Its delta is internal and modest: it RUNS the comparison
      EV-MLKEM-018 named as unattempted, and it returns a controlled null plus
      one cross-file consistency check. The honest summary is "no attack;
      measurement-scope and control contribution only".
    named_obstruction: >-
      Stated per the inventor-protocol closure standard, and it closes NO lane.
      The obstruction to testing Approximation 4.9's functional form against this
      archive is that the archived measurement is a single pooled counting
      estimate whose informative region spans a third to a half of one octave in
      the tail variable, with lag-1 residual autocorrelation of 0.992-0.996 -
      about three independent observations. No amount of re-reading those bytes
      can separate two-parameter shapes, and the p=10/p=40 style of control
      cannot fix it because the acceptance basin is 4.5-5.5 exponent units wide.
      Forward guidance is named and concrete: F3 (vary the destroying parameter),
      F1b (quantify the sample size discrimination would need), F5 (retrieve the
      missing pages and remove the free normalisation), F4 (a different
      instrument for the region that matters). That is an instrument limitation
      with successors, not a dead lane.
    premature_closure_check: >-
      This decision closes no lane, closes no goal, pauses nothing and abandons
      no candidate. It keeps KN-OPEN-016 and KN-OPEN-017 open, keeps every
      rule-12-gated transition recorded as OWED rather than cancelled, keeps
      F1a-F6 named and ranked with revisit conditions, and explicitly refuses to
      convert a non-discriminating control into a verdict against Approximation
      4.9. Premature closure is a failure mode symmetric with overclaiming, and
      the temptation here ran toward the negative: a controlled null reads as
      rigour and would have been easy to write up as "Approximation 4.9 does not
      survive its own data". It does not say that and must not be read as saying
      it.

