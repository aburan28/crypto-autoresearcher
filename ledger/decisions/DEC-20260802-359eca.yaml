  rationale:
    - >-
      The required null-object control was absent from the package and, when the
      independent validation supplied it, it did not discriminate: a + b*T^(1/3)
      fits the informative sub-band at rms 0.1051 / 0.1007 bits against the
      Approximation 4.9 tail form's 0.1048 / 0.0987. Under
      docs/inventor-protocol.md section 3 that makes the reported shape agreement
      a controlled null rather than a finding.
    - >-
      The one control the package did run tests a regime the data never made
      plausible: the acceptance basin is [20.5, 26.0] and [20.0, 24.5] with
      optima at 23.0 and 22.0, so the archived exponents 26.0 and 24.5 sit at the
      UPPER ENDPOINT of their own acceptance sets while the probed p = 10 and
      p = 40 sit 13-18 units outside.
    - >-
      The headline divergence profile is confounded with the package's own
      single-K reduction, with the sign fixed by Jensen and at most about 45% of
      the peak attributable - leaving the majority unexplained by anybody.
    - >-
      The advertised dynamic range mixes regimes: 4.61 and 2.91 of the quoted
      34.7 / 35.3 bits are carried by a parameter-free Gaussian term at rms
      0.010 / 0.006, and the informative region carries an AR(1) effective sample
      of about three, not approximately 1800.
    - >-
      Against all that, the arithmetic reproduces to <= 6.6e-04 bits across 4113
      scores, both prohibited failure modes are absent, and ONE item survives a
      test nothing was tuned to pass: the exact-model sub-band optimum shifts
      between the files by exactly the predicted 1.50, giving r = 2.122 against
      2.130. That is real, it was never claimed by its producer, and it is
      elevated here.
    - >-
      The failed first validation is infrastructure signal and never a
      mathematical result (AGENTS.md rule 5); it is named, its artifacts are
      archived exactly once, and nothing in this decision rests on it.

