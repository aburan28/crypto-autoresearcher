coordinator_decision:
  id: DEC-20260802-359eca
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-009
  recorded_by_task: TASK-20260802-43e5e4
  authorized_by: DEC-20260802-56cc4b
  recorded_at: '2026-08-03'

  decision: weaken
  decision_label: >-
    weaken_the_evidential_weight_of_the_F1_headline_and_elevate_the_item_the_producer_left_on_the_table;
    controls_before_belief_unmet_so_a_controlled_null_is_recorded_not_a_finding;
    no_status_change_anywhere;
    no_verdict_on_approximation_4_9_in_either_direction;
    goal_record_receives_a_LATE_ARRIVING_BATCH_009_checkpoint_only
  decision_vocabulary_note: >-
    `weaken` is recorded with respect to THE F1 PACKAGE'S HEADLINE CLAIM - "with
    one fitted scale, the recomputed Approximation 4.9 tracks the measurement
    across the entire resolved band" offered as evidence about the model's
    functional form. It is a claim, not a hypothesis, and no hypothesis or prior
    evidence record moves one millimetre. The accompanying intent for the parts
    that survive is REFINE, in the sense DEC-20260803-c7a1a3 used the word: the
    computation is real, the framing was wrong, and the strongest item in the
    package was never claimed by its author. `revise` was considered as the
    recorded value and REFUSED, because a purely re-recording disposition would
    understate what happened: a control the inventor protocol REQUIRES was
    missing, an independent session supplied it, and it returned a CONTROLLED
    NULL. That is adverse, not merely differently framed, and the ledger should
    say so. `support` was considered and refused - see `why_not_support`.
    `reject_scoped` was considered and refused - see `why_not_reject_scoped`.

  # ------------------------------------------------------------------
  # CONTEXT
  # ------------------------------------------------------------------
  context: >-
    DEC-20260802-56cc4b resumed GOAL-MLKEM-003 on a user-directed budget
    extension and authorized BATCH-009 to run F1 and nothing else: recompute
    Approximation 4.9's predicted Pwrong survival curve from the archived Carrier
    text and compare it pointwise against the archived measurement over the band
    the counting instrument actually resolved. F1 was ranked first because it is
    the one live question the archive can settle with zero new compute and
    because it does not depend on the unserved AGENTS.md rule-12 gate.
    EV-MLKEM-018 had named this comparison explicitly as the program's outstanding
    debt: "NOTHING HERE SHOWS APPROXIMATION 4.9 IS WRONG, NOR THAT IT IS RIGHT.
    The program has still never recomputed Approximation 4.9's predicted survival
    curve and compared it against the archived measurement over the band the
    instrument does resolve. That comparison is the cheapest real test the
    archive supports and it remains unattempted." The producer half ran and was
    snapshot-archived at d0f2bf7f1770 before any reviewer read it. THE FIRST
    INDEPENDENT VALIDATION THEN DIED on a provider session limit before writing
    a verdict, and this ledger archive stayed blocked through BATCH-010 and into
    BATCH-011. A successor validation, TASK-20260803-01f419 (VAL-20260803-3346d2),
    re-derived the package independently against the same snapshot and returned
    ADMISSIBLE_WITH_DEFECTS with twelve defects, three of them major. This
    decision adjudicates that package on the merits.

  # ------------------------------------------------------------------
  # WHAT WAS ESTABLISHED, AND IN WHICH DIRECTION
  # ------------------------------------------------------------------
  what_was_established:
    the_finding: >-
      THE TEST WAS RUN AND IT DOES NOT DISCRIMINATE. Over the resolved bands of
      the two archived toy-parameter files, a recomputation of Approximation 4.9
      under a declared reading of the unarchived Phi, carrying one fitted
      normalisation, does agree with the measurement to rms 0.28 / 0.27 bits on
      the sub-band where its own D component dominates - and a structurally
      unrelated two-parameter form, a + b*T^(1/3), fits that same sub-band at rms
      0.1051 / 0.1007 against the Approximation 4.9 tail form's 0.1048 / 0.0987.
      Under docs/inventor-protocol.md section 3 that is a CONTROLLED NULL, and a
      controlled null is not a finding. Two further major defects point the same
      way: the package's own non-degeneracy control probes exponents 13-18 units
      outside the acceptance basin and leaves the archived exponent at the UPPER
      ENDPOINT of its own acceptance set ([20.5, 26.0] with optimum 23.0;
      [20.0, 24.5] with optimum 22.0), and the headline divergence profile is
      confounded with the package's own K(dlsc) -> Kbar reduction
      (corr(residual, clip fraction) = 0.916 / 0.904, sign fixed by Jensen since
      min(1, K*L^p) is concave in K, at most about 45% of the peak attributable).
    the_thing_that_survives_and_was_never_claimed: >-
      A CROSS-FILE CONSISTENCY CHECK THAT NO TUNED PARAMETER HAD TO PASS. The
      exact-model sub-band optimum shifts between the two files by EXACTLY the
      1.50 the archived integers predict (24.50 -> 23.00 against
      dp = (44-41)/2 = 1.50), so the two files independently return
      r = 52/24.5 = 2.122 and r = 49/23.0 = 2.130, agreeing to 0.4%; and the
      free-slope sub-band fit recovers b = 26.515 against an a-priori 26.0 and
      b = 24.549 against 24.5. A pure fitting artifact would not have to survive
      a between-file check that nothing was tuned to satisfy. THE PRODUCER LEFT
      THIS ON THE TABLE and the validator extracted it. It is the strongest
      single piece of evidence in the package and this decision elevates it to
      the position the producer's headline occupied.
    the_arithmetic: >-
      SOLID AND INDEPENDENTLY REPRODUCED. 20 of 26 metric recomputations
      `reproduced` outright; both counting floors are bit-for-bit IEEE-754 equal
      to 1/(nb_iteration * q^k_fft) at 2^-35.70445229 and 2^-36.28941479; and the
      validator's INDEPENDENT model evaluated at the producer's own K matches the
      per-score prediction column to <= 6.6e-04 bits across all 4113 scores. Both
      failure modes this campaign has already hit are ABSENT: nothing is
      compared, fitted or extrapolated past the counting floor, and no k_fft
      alignment is applied anywhere (raw-scale sigma ratios 0.9996 / 0.9986 and
      1.0020 / 1.0002, against approximately 3.0 for the /k_fft alternative -
      a third independent reproduction of EV-MLKEM-018's finding).
    what_the_package_under_argued: >-
      Two correct conclusions were argued more weakly than the evidence allowed.
      nb_iteration = 6000 for the n=50 file is not merely "the file's own record"
      against the Fig 4.1 caption's 4000 - the caption value is EXCLUDED BY THE
      FILE'S OWN BYTES, since every value is an integer multiple of
      1/(6000*241^3) and none is a multiple of 1/(4000*241^3), the last positive
      value being exactly two thirds of the 4000-quantum. And "the absolute level
      is untestable from archived bytes" is RIGHT, with the four missing
      parameters (Phi_dlsc, delta(beta_bkz) with Lemma 2.9, alpha, n_lsc)
      independently confirmed absent from the entire repository - but it was
      pinned on delta, the weakest of three independently sufficient links.
    the_effective_sample_size: >-
      "AGREEMENT ACROSS APPROXIMATELY 1800 POINTS" IS ROUGHLY THREE INDEPENDENT
      OBSERVATIONS. The lever arm in X = log2 ln(N/T) spans only 0.3080 / 0.4709,
      and residual lag-1 autocorrelation is 0.992 / 0.996, giving an AR(1)
      effective sample of 3.1 out of 737 and 2.6 out of 1242 points - because the
      measurement is one pooled cumulative count and consecutive scores are
      nearly the same statistic. Separately, of the quoted 34.7 / 35.3 bits of
      dynamic range, 4.61 and 2.91 are carried by the PARAMETER-FREE Q(T) term at
      rms 0.010 / 0.006 bits with zero free parameters, which is Model 4.7's
      success rather than Approximation 4.9's.
    direction: >-
      NOT PREDETERMINED, and worth saying because DEC-20260803-c7a1a3 had to
      record the opposite situation for BATCH-010. F1 could have come back three
      ways - agreement that discriminates, disagreement, or agreement that does
      not discriminate - and the task card pre-registered "report where prediction
      and measurement agree and where they diverge". It came back the third way.
      That is an informative outcome and it is reported as one, not padded into
      either of the other two.

  # ------------------------------------------------------------------
  # COORDINATOR VALIDITY CHECK BEFORE INTERPRETATION
  # ------------------------------------------------------------------
  coordinator_validity_check:
    performed_before_interpretation: true
    detail_ref: EV-MLKEM-019.coordinator_validity_check
    summary: >-
      Expected run count: one producer defect found (maximum_runs 1, two
      executions, budget_exceeded recorded false - D5) and disclosed everywhere
      else; validator 1 of 1 within budget; the failed first validation recorded
      as 0 completed runs and NOT as a result. Manifest and seed integrity: met -
      command, commit 5f8bb4eb49b7, an in-scope dirty tree, stdout/stderr,
      resource measurements, and input SHA-256 digests independently recomputed
      and matching; seeds not_applicable and recorded as such for a deterministic
      computation. Raw/summary agreement: two divergences found (D1 in the report
      prose, understating drift by 0.110 / 0.123 bits in the claim-favourable
      direction; D3 in a JSON column that does not reproduce with the sign
      flipping between files). Control comparability: FAILED - the required
      null-object control was absent and does not discriminate when supplied
      (D8), and the one control the package did run is too weak to bear its
      weight (D7). Nothing was returned to the executor as an invalid run set:
      the package IS admissible as a recomputation, and its defects are
      interpretive rather than integrity failures.
    what_i_did_not_do: >-
      Stated so it is not overread: I ran no computation for this decision. Unlike
      BATCH-008 and BATCH-010, where I re-derived key items myself, here I relied
      on a single independent session's arithmetic. That is a real limitation and
      it is carried in `limitations` and in the ranking below, which puts an
      independent re-derivation of the validator's own novel controls first among
      F1 successors.

  # ------------------------------------------------------------------
  # WHY NOT `support`
  # ------------------------------------------------------------------
  why_not_support: >-
    Three independent grounds, any one sufficient.
    (1) CONTROLS BEFORE BELIEF IS UNMET, AND THE CONTROL THAT WAS RUN CAME BACK A
    NULL. docs/inventor-protocol.md section 3 is not advisory: a reported signal
    is an artifact until the identical measurement has been run against a null
    object of the same shape, and if the numbers match the honest record is a
    controlled null. The producer ran no null object; the validator ran one; the
    numbers match to three decimal places in both files. A `support` disposition
    on a controlled null would invert the protocol's central rule.
    (2) THE ONE CONTROL THE PACKAGE DID RUN DISCRIMINATES ALMOST NOTHING (D7).
    p = 10 and p = 40 sit 13-18 units outside an acceptance basin of width
    5.5 / 4.5, and inside that basin the archived exponent is at the upper
    endpoint with the optimum 3.0 and 2.5 units below it. The control establishes
    non-degeneracy in the weakest possible sense and does not establish that the
    data select the archived exponent.
    (3) THE HEADLINE MECHANISM IS CONFOUNDED (D6). The reported divergence
    profile correlates with the package's own single-K reduction at 0.916 / 0.904
    and Jensen fixes the sign of the bias, so up to 45% of the peak belongs to
    the reduction rather than to the model-versus-data comparison - and the
    remaining majority is unexplained by anybody.
    A fourth, procedural: `support` on evidence of strength `replicated` or
    `strong` triggers the mandatory knowledge-promotion path, which would durably
    enshrine in the corpus exactly the framing the independent review rejected.
    That is the last place a rejected framing should land.

  why_not_reject_scoped: >-
    REFUSED, and the refusal is as important as the weakening. `reject_scoped`
    would assert that something was shown false within a tested scope, and
    nothing was. Approximation 4.9 is NOT shown wrong here - a null control that
    fails to discriminate says the TEST lacks power, not that the model is
    incorrect, and confusing the two would be the mirror image of the
    producer's overclaim. The Coordinator contract independently forbids
    `reject_scoped` on a single unreplicated empirical-only run, and this is one
    un-replicated third-party measurement reviewed by one independent session.
    The prescribed route in that situation is `weaken` plus replication, and that
    is exactly what is recorded here and ranked first among successors.

  # ------------------------------------------------------------------
  # THE INFRASTRUCTURE BLOCKAGE, AND WHAT IT COST
  # ------------------------------------------------------------------
  infrastructure_blockage_cost:
    what_happened: >-
      TASK-20260802-08f428, the first independent validation of the F1 package,
      terminated on a provider session limit at approximately 2026-08-03T00:20Z
      before writing validation_report.yaml. Its completion gate was therefore
      unmet, its preserved validation_notes.md is not a verdict, and under
      AGENTS.md rule 5 the failure is infrastructure signal and NEVER a
      mathematical result - it says nothing about Approximation 4.9, nothing
      about the quality of the F1 package, and nothing about ML-KEM.
    how_long_it_blocked: >-
      From 2026-08-02 until this archive. BATCH-010 ran and was archived in full,
      and BATCH-011 was authorized, while BATCH-009's ledger archive
      (TASK-20260802-43e5e4) stayed blocked - two batches.
    what_it_cost_concretely:
      - >-
        A HASH-PINNED SNAPSHOT SAT UN-REVIEWED FOR TWO BATCHES. Commit
        d0f2bf7f1770 carried four artifacts that looked like a result and had no
        evidence record, no claim status and no independent check. That is how a
        program accumulates artifacts a future reader mistakes for findings, and
        the goal record had to carry an explicit "INCOMPLETE - NO LEDGER ARCHIVE,
        NO EVIDENCE RECORD" batch_log entry with null decision_id and evidence_id
        for two batches to prevent exactly that misreading.
      - >-
        THE ANSWER TO THIS PROGRAM'S OWN NAMED OPEN QUESTION STAYED OFF THE
        OFFICIAL RECORD FOR TWO BATCHES. EV-MLKEM-018 had identified this
        comparison as "the cheapest real test the archive supports"; the test had
        in fact been run on 2026-08-02, and no ledger record could say so.
      - >-
        ONE FULL REVIEW SESSION BUDGET PRODUCED NOTHING USABLE. A 2400 s
        independent-review allowance was consumed with no verdict, and the
        successor had to repeat the entire validation from scratch, because the
        preserved notes could not be adopted as evidence and were correctly
        treated as read-only context at most.
      - >-
        A DECLARED ARTIFACT PATH SET HAD TO BE NARROWED AFTER THE FACT. The dead
        task's original declaration named validation_report.yaml, a file that
        does not exist and never will, so a Coordinator amendment narrowed its
        artifact_paths to the failure receipt. Amending a declared archival path
        set is a real cost to the archive contract, and it is recorded in
        dispatch_queue.json rather than performed silently.
      - >-
        THE BATCH GOT ONE INDEPENDENT REVIEW INSTEAD OF TWO, AND NO RED TEAM. So
        every novel finding this decision rests on - D6, D7, D8, the
        effective-degrees-of-freedom measurement and the favourable cross-file
        shift - was computed exactly once and has never been independently
        re-derived. This is the single largest reason EV-MLKEM-019 is capped at
        `preliminary`.
    what_it_did_NOT_cost: >-
      Nothing mathematical. The comparison is deterministic over immutable
      archived bytes, and the successor validator re-verified at the end of its
      session that d0f2bf7f1770 is still an ancestor of HEAD and that
      `git diff d0f2bf7f1770 HEAD -- .../TASK-20260802-8bae8e/` is empty, so it
      reviewed byte-identical artifacts. No data was lost, no run needed
      re-execution, and the delay changed no number.
    handling_assessed: >-
      Correct. The failure was recorded as `failed_infrastructure` with a receipt
      rather than being written up as a negative result; the ledger archive was
      left BLOCKED rather than proceeding on an unreviewed package; a successor
      task was created under a freshly minted id against the same snapshot; and
      the successor's independence was protected by an explicit constraint and
      then verifiably honoured (see EV-MLKEM-019.validation_process_note). The
      one thing the program should have done faster is dispatch the successor:
      DEC-20260803-c7a1a3 ranked it candidate C behind two BATCH-011 candidates,
      which was defensible on merit and is recorded there with its reasoning, but
      it left an owed item outstanding for a batch longer than necessary given
      that the work needed no new compute.

  # ------------------------------------------------------------------
  # A COORDINATOR DEFECT IN MY OWN TASK CARD
  # ------------------------------------------------------------------
  coordinator_task_card_defect:
    what_it_was: >-
      The TASK-20260802-8bae8e handoff I wrote defines a completion gate about
      MECHANICS - the resolved band is stated with its counting floor, every
      parameter is sourced or recorded unavailable, values are reported per score,
      nothing extends past the floor - and names no control at all. All four gate
      items were met exactly. But an observation task whose output is a
      shape-agreement statistic needs a NULL OBJECT named in its own contract, and
      docs/inventor-protocol.md section 3 has bound this harness since 2026-07-28.
      The producer cannot be faulted for not running a control its contract never
      asked for, and the validator had to supply the protocol's requirement
      retroactively.
    accountability: >-
      Mine. The gate was the wrong shape for the claim the deliverable would
      inevitably invite, and I wrote it.
    what_changes_because_of_it: >-
      Every future task card in this campaign whose deliverable is an agreement,
      correlation, or fit statistic must name its null object and its decay
      parameter in the completion gate itself. Recorded here rather than as a
      protocol amendment because it changes no success criterion of any executed
      experiment - BATCH-009's criteria are not being altered after seeing its
      outcome, which would require a versioned protocol_amendment and is
      forbidden without one.

  # ------------------------------------------------------------------
  # EXPLICIT NON-CLAIMS
  # ------------------------------------------------------------------
  explicit_non_claims:
    - >-
      NO ML-KEM OR KYBER BREAK. Nothing in BATCH-009 is a cryptanalytic result.
      No solve, no relation, no certificate, no attack, no speedup. No FIPS 203
      parameter set is affected or cleared; no security level is asserted or
      revised; COST-MLKEM-001's conditional envelope is untouched.
    - >-
      NOTHING IS CLAIMED ABOUT WHETHER APPROXIMATION 4.9 IS CORRECT IN THE
      PAPER'S OWN ANALYSIS, IN EITHER DIRECTION. A control that fails to
      discriminate is a statement about the test's power, not about the model.
      EV-MLKEM-018's boundary stands verbatim: nothing here shows Approximation
      4.9 is wrong, nor that it is right. The comparison is shape-and-relative
      with one free normalisation over two toy files from a verification-model
      directory whose conventions have never been shown to produce Table 5.1 or
      Table C.2.
    - >-
      NO CRYPTO-SCALE CLAIM. Toy parameters only: q=241, m=40, n=43 and n=50,
      n_fft=8, k_fft=3. AGENTS.md rule 7 - toy-scale evidence is never presented
      as crypto-scale validation, and the archived cost tables apply this
      approximation 83.87 / 142.09 / 208.33 bits below the band anyone has
      measured.
    - >-
      NOTHING IS CLAIMED BELOW THE COUNTING FLOOR, which is where Approximation
      4.9 is actually used. The floors are 2^-35.70445229 and 2^-36.28941479 and
      this batch does not narrow the distance to the operating threshold by one
      bit.
    - >-
      NO STATUS CHANGES ANYWHERE. H-MLKEM-011 and H-MLKEM-013 stay `analyzed`.
      EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-015, EV-MLKEM-017, EV-MLKEM-018 and
      EV-MLKEM-020 keep their status and no field of any of them is edited.
      KN-FIND-012, KN-FIND-014, KN-OPEN-016 and KN-OPEN-017 are untouched, and
      the restatement, withdrawal successor and amendment recorded as PENDING in
      DEC-20260802-937ba9 remain OWED, not cancelled. AGENTS.md RULE 12 IS UNMET
      AND UNWAIVED.
    - >-
      THE SURVIVING CROSS-FILE ITEM IS NOT A VALIDATION OF THE DECLARED READING
      OF Phi. It is evidence that the reading is CONSISTENT with two files, from
      one computation, under a decay control that the archive still does not
      contain and across two files that differ in more than the one variable the
      check reads.
    - >-
      THE FAILED FIRST VALIDATION IS NOT EVIDENCE OF ANYTHING, in either
      direction, and its preserved notes are not a verdict and may not be cited
      as one (AGENTS.md rule 5).
    - >-
      NO CLOSURE, NO CLOSURE QUORUM, NO ATTESTATION. GOAL-MLKEM-003 is not closed
      by this decision and no `completion_quorum` block is written; no attestation
      was obtained and none is recorded. The rule-13 suspension is irrelevant
      because nothing is being closed. This decision does not even advance the
      goal's batch counter - see `goal_record_handling`.

  # ------------------------------------------------------------------
  # REFUTATION ARTIFACT ACCOUNTING
  # ------------------------------------------------------------------
  refutation_artifact_accounting:
    applicability: >-
      docs/claims-and-verification.md's "Refutation artifacts" requirement binds
      adverse transitions. This decision is `weaken`, so it is triggered, and it
      is answered rather than waved past. What is being weakened is a CLAIM's
      evidential weight, not a theory's truth, and the artifacts below are
      commensurate with that.
    artifacts_offered:
      - >-
        FOR "THE SHAPE AGREEMENT DOES NOT DISCRIMINATE": the null-object fit
        table in VAL-20260803-3346d2.control_checks, giving on the informative
        sub-band a + b*log2 ln(N/T) at rms 0.1048 / 0.0987, a + b*T^(1/3) at
        0.1051 / 0.1007, a + b*log2 T at 0.1242 / 0.1092, a + b*sqrt(T) at
        0.1110 / 0.1541, a + b*T at 0.1723 / 0.3455, a + b*T^2 at 0.3481 / 0.7204.
        A computed control measurement over immutable archived bytes,
        re-runnable by any reader.
      - >-
        FOR "THE NON-DEGENERACY CONTROL DOES NOT DISCRIMINATE": the fine exponent
        sweep (p from 10 to 40 in steps of 0.5, K refit at each p) yielding
        acceptance sets [20.5, 26.0] and [20.0, 24.5] with optima 23.0 and 22.0
        against archived exponents 26.0 and 24.5. Directly re-runnable from the
        same bytes.
      - >-
        FOR "THE DIVERGENCE PROFILE IS CONFOUNDED": two things, one measured and
        one proved. Measured - corr(residual, clipped fraction) = 0.916 / 0.904,
        with mean residual +0.959 / +1.103 where the clip is active against
        -0.231 / -0.193 where it is negligible. Proved - min(1, K*L^p) is CONCAVE
        in K, so by Jensen the single-Kbar prediction is an upper bound exactly
        where the clip binds, which is the observed sign. The bound on the effect
        (at most 0.682 / 0.685 bits at the residual peak, about 45% of it) is one
        line of arithmetic from the archived columns.
      - >-
        FOR "THE POINT COUNT IS NOT THE CONSTRAINT COUNT": the lever-arm
        measurement (X spans 0.3080 / 0.4709) and the lag-1 autocorrelation
        (0.992 / 0.996) with its AR(1) effective sample of about 3. A diagnostic
        computed from the residual series, labelled as such.
      - >-
        FOR THE PACKAGE'S OWN CORRECT-BUT-UNDER-ARGUED CLAIM: the exclusion of
        nb_iteration = 4000 by the n=50 file's own quantisation - an exact
        arithmetic argument from the bytes, and the strongest artifact in the
        whole batch.
    proof_status_declared: derivation
    where_the_artifacts_live: >-
      All of them are in
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-009/tasks/TASK-20260803-01f419/,
      which THIS ledger archive commits alongside this decision, per the standard
      ledger-archive pattern in which the reviews and the records they support
      are committed together. Stated plainly because the Coordinator contract
      asks for the artifact to be archived before the decision that relies on it:
      the DATA the artifacts derive from has been archived since EXP-MLKEM-011,
      and the producer package was snapshot-archived at d0f2bf7f1770 before any
      reviewer read it - but the refutation computations themselves become
      durable only when the post-commit verifier accepts this commit. Until it
      does, this decision is not official and no downstream record may rest on it
      (AGENTS.md "Durable research commits").
    not_a_certificate_and_why: >-
      There is no certificate family here for a wrapper to re-verify: the objects
      are least-squares fits and correlations over an archived survival column,
      plus one exact arithmetic identity and one convexity argument. `derivation`
      is the honest tier and it is declared. The absence of a proof object is not
      the failure; an undeclared basis would be.

