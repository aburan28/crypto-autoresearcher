      once. That is why the disposition is `weaken` rather than anything
      stronger, why EV-MLKEM-019 is capped at `preliminary`, and why replication
      is ranked first among successors.
    - >-
      I RAN NO COMPUTATION MYSELF for this decision, unlike BATCH-008 and
      BATCH-010 where I re-derived key items independently. I read the package,
      the failure receipt and the validation, and I checked run-set validity
      against the criteria AGENTS.md requires. Every number in this record is the
      producer's or the validator's and is attributed.
    - >-
      The review this decision rests on is `review-adversarial`, not
      `review-breakthrough`. It was an independent session whose author did not
      originate the package, and it recorded `fallback_used: true` with
      `model_verified: false`. The same is true of this Coordinator session: I did
      not run `doctor --probe`, and the resolved model identifier is the
      runtime's self-report.
    - >-
      The twelve defects in EV-MLKEM-019 are RECORDED, NOT REPAIRED. The archived
      artifacts are immutable and this decision edits none of them; correcting
