    named_obstruction: >-
      A fitted-normalisation shape comparison cannot select a model when a
      nearby object of the same family fits at least as well; and the min(1,.)
      collapse biases the residual in the direction of the reported finding.
    forward_guidance: >-
      Run the exponent-neighbourhood control on both files and bound the Jensen
      bias at the peak scores. Both are zero-new-sampling and neither needs
      network or G6K.

