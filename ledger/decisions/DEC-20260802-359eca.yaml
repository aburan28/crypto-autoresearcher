coordinator_decision:
  id: DEC-20260802-359eca
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-009
  evidence_id: EV-MLKEM-019
  recorded_by_task: TASK-20260802-43e5e4
  archive_kind: ledger
  recorded_at: '2026-08-03'
  decision: refine
  decision_label: shape_comparison_admissible_discriminating_question_untouched

  identifier_date_note: >-
    The identifier's date component is 20260802, the date this record was
    declared in the BATCH-009 dispatch queue by DEC-20260802-56cc4b. The
    decision was actually taken on 2026-08-03, which is what decided_at and
    recorded_at carry. The declared identifier is kept because the archive
    contract binds it; per CLAUDE.md identifiers no longer sort into creation
    order and chronology comes from recorded_at, not the suffix.

  context: >-
    BATCH-009 asked one question (F1): recompute Approximation 4.9's predicted
    Pwrong survival curve from the archived Carrier text and compare it point by
    point against the archived measurement, confined to the band the instrument
    actually resolved. The producer TASK-20260802-8bae8e completed and was
    snapshot-archived at d0f2bf7f (TASK-20260802-7c4aee). The first independent
    validation, TASK-20260802-08f428, terminated on a provider session limit
    before writing a verdict and is recorded failed_infrastructure. The
    Coordinator opened the scoped successor TASK-20260803-bc8c1f
    (AMEND-BATCH-009-001/002), which returned ADMISSIBLE_WITH_DEFECTS.

  central_adjudication: >-
    THE INSTRUMENT WORKS AND THE DISCRIMINATING QUESTION IS UNTOUCHED. Both gate
    checks pass, the arithmetic reproduces independently under a different
    implementation, and the comparison honoured its band and its score scale.
    But the agreement it reports is a SHAPE agreement with the normalisation
    fitted to the compared data, and the validator's nearby-object control fits
    the n=43 data BETTER with the neighbouring file's exponent (rms 0.4965) than
    with its own (0.7055). A comparison that a neighbouring model wins does not
    select the model under test. `refine` is the honest disposition: the
    measurement stands, the conclusion it was meant to support does not follow
    yet, and the next step is a discriminating control rather than more of the
    same comparison.

  what_is_established:
    - >-
      The resolved-band and raw-score-scale checks both pass, with the counting
      floor independently confirmed by the Coordinator at
      1/(4000*241^3) = 2^-35.70445229. The comparison extrapolates nowhere past
      the estimator's own resolution limit.
    - >-
      The producer's numbers reproduce: 19 claims reproduced, 1 not reproduced,
      5 unable to check, with an independent re-derivation of Approximation 4.9
      by a different integration method agreeing on every reported extremum and
      every sign-change score.

  what_is_not_established:
    - >-
      That Approximation 4.9 is validated. It is not. The normalisation is
      fitted to the compared data, so this is a shape test and never a level
      test.
    - >-
      That Approximation 4.9 is refuted. It is not. The min(1,.) collapse (O-7)
      biases the model upward with the same sign as the reported
      over-prediction, so the peak deviation cannot yet be attributed to the
      approximation rather than to the implementation shortcut.
    - >-
      Anything about ML-KEM security, in either direction.
    - >-
      Anything that changes EV-MLKEM-011, EV-MLKEM-013 or EV-MLKEM-017.

  weighing_of_the_review: >-
    The validation is accepted in full, including against the producer.
    (1) O-6 IS THE BATCH'S MOST INFORMATIVE RESULT AND IT IS ADVERSE. The
    nearby-object control was absent from the package; the validator ran it and
    it came back one-sided. The producer had disclosed that both files prefer an
    exponent about 2 lower, which is honest, but disclosure is not a control.
    Under docs/inventor-protocol.md "controls before belief" the reported
    agreement is an artifact until measured against a null or nearby object of
    the same shape, and now that it has been, its discriminating power is
    bounded rather than established.
    (2) D5 IS ACCEPTED AND IS A REAL CONFOUND, not a nit. Jensen's inequality on
    a concave min(1,.) makes the collapsed model an upper bound, and both
    headline peaks sit at clip fractions near 0.37 where the effect is live.
    (3) D3 IS ACCEPTED AND CORRECTS THE PACKAGE'S OWN REASONING. delta is
    present in the vendor tree at utilitary.py:16; the report reached the right
    conclusion (level uncheckable) through the wrong cause.
    (4) D4 IS ACCEPTED: the package contradicts itself on whether Phi's form is
    forced or merely declared, and that form is load-bearing.
    (5) D7 IS A RULE 4 PACKAGING VIOLATION. Overwriting the first execution's
    JSON in place rather than superseding it makes the bit-identity claim
    unverifiable from the archive alone. Recorded as a defect against the
    package, not against the numbers, which the validator independently
    reproduced by re-execution into a sandboxed mirror.
    (6) D6 and D8 are budget and timestamp bookkeeping defects, recorded.

  handling_of_the_failed_review: >-
    TASK-20260802-08f428's failure was a provider session limit. Under AGENTS.md
    rule 5 it is an infrastructure fact and is NOT evidence about the F1
    comparison in either direction. Its partial validation_notes.md carries no
    verdict field, its own closing text disclaims being one, and NO CLAIM IN
    EV-MLKEM-019 RESTS ON IT. The successor was instructed to reach its own
    numbers before reading it, and reported doing so. The failed identifier is
    retired and never reused; its status, notes and receipt stay committed at
    08ff4302.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. H-MLKEM-011 is untouched: a shape comparison with a
    fitted normalisation and a one-sided nearby-object control supports and
    weakens nothing. H-MLKEM-010 and H-MLKEM-013 likewise unchanged.

  rule_12_status: >-
    UNMET AND UNWAIVED, and this decision does not waive it. EV-MLKEM-011,
    EV-MLKEM-013 and EV-MLKEM-017 keep their official status. The KN-FIND-012
    restatement and the KN-FIND-014 withdrawal remain owed and pending. The
    withdrawn KN-FIND-031 stays withdrawn pending the same review
    (CORR-20260802-d8ba0e).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `refine` on `preliminary` evidence fails the promotion gate, which
      requires `support` or `reject_scoped` at `replicated` or `strong`. Beyond
      the gate, the one candidate worth promoting -- that a fitted-normalisation
      shape comparison is not discriminating unless a nearby-object control
      loses -- is the very thing this batch has an instance of but not yet a
      replication of. Promoting it on a single one-sided control would repeat the
      error CORR-20260802-d8ba0e recorded against this branch nine commits ago.
    promote: false

  non_claims:
    - ML-KEM is not broken.
    - KN-OPEN-016 remains open.
    - Approximation 4.9 is neither validated nor refuted by this batch.
    - >-
      No asymptotic claim advanced; none of the four promotion gates in
      .claude/skills/coordinate-research-goal/SKILL.md is engaged.
    - No closure quorum is asserted. GOAL-MLKEM-003 stays active.

  next_actions:
    - >-
      BATCH-010, zero-new-sampling: run the discriminating control the shape
      comparison lacks. Scan the exponent p over a neighbourhood of both
      archived files' fitted values and report, for each file, whether its OWN
      Approximation-4.9 exponent minimises rms against its own data or whether a
      neighbour wins -- the validator found the latter for n=43 at p=24.5, and
      one instance is not a result. In the same batch, bound the D5 Jensen bias
      by evaluating the d_lsc integral inside min(1,.) at the two headline peak
      scores, so the reported over-prediction can be attributed or not
      attributed to the approximation. Together these turn "a model of this
      family fits" into a statement about whether THIS model is selected.

