  decision: revise
  decision_rationale_for_verb: >-
    Same narrow usage as DEC-20260903-afdd06, DEC-20260904-031ed2,
    DEC-20260904-5427fa and DEC-20260904-c501b9. This is the
    EXECUTION-DESIGN AUDIT COMPOSITION: it composes the two mutually blind
    review joints over the producer's execution-design package, records the
    design as NOT FIT for authorization as authored, and routes the work to
    a scoped repair lane. It is NOT the authorization decision and it is
    NOT negative evidence about the candidate: the candidate
    IDEA-20260904-6aed0b is untouched, the RT2-SR-5 ruling of
    DEC-20260904-c501b9 stands unchanged, and zero arms were run by anyone
    in this batch. Any authorization of D-1 or D-2 execution remains a
    separate committed Coordinator decision after the repaired design
    passes its own re-review.

  context: >-
    BATCH-a019c8 (opened by DEC-20260905-1ea7a0 on branch
    aes003-exec-auth-prep-20260905 from origin/main 150c02d56, PR 762)
    executed RANK 1 of the goal head set by DEC-20260904-c501b9: the
    execution-authorization PREPARATION round for D-2/D-1 of
    IDEA-20260904-6aed0b. Producer TASK-20260905-5d22e9 (general-fallback
    dispatch carrying the idea-generator contract, resolved model
    fireworks-ai/accounts/fireworks/models/qwen3p8-max, fallback_used
    true, model_verified false) authored a 17-arm D-2-in-full execution
    design (execution-design.yaml, execution-budget.json,
    outcome-sentence-map.md), snapshot-archived at 8616e32c7 before review.
    Two independent, mutually blind fresh-session reviewers ran against
    the snapshot: J-D1 (validator TASK-20260905-0a79ec, arithmetic and
    completeness) and J-D2 (red-team TASK-20260905-fbff7d, licensing and
    stopping rules). The Coordinator prior was recorded in
    DEC-20260905-1ea7a0 before any reviewer ran. This is the closing
    archive; it runs ALONE after both reviews returned.

  target_ids:
    - IDEA-20260904-6aed0b
    - DEC-20260904-c501b9
    - DEC-20260905-1ea7a0
    - TASK-20260905-5d22e9
    - TASK-20260905-0a79ec
    - TASK-20260905-fbff7d
    - GOAL-AES-003
    - RQ-AES-003

  rationale:
    - >-
      JOINT J-D1 (validator): VERDICT HOLDS_WITH_FINDINGS, all seven checks
      PASS. (1) FP BUDGET BLIND RE-DERIVATION: from the bound statements
      alone and the declared arm identification, fresh sealed code
      re-derived per-arm 0.171940 + 0.018883 = 0.190823, 8 plateau-
      composing arms, plateau total 1.375520, decay total 0.151064, grand
      accounting sum 1.526584 -- EXACT MATCH to the producer's arithmetic,
      confirmed priced PER ARM not per family, and confirmed explicitly
      not an event probability. (2) Exposure/arm-count/cost arithmetic
      verified: 17 arms x 2^30 = 18,253,611,008 trials, 17 x 1620 s =
      27,540 s with cap 29,500 s, authoring separate per C4, memory 4 GB;
      no live use of superseded values (arcsine 0.977 absent; 0.970869
      only labelled conditional-on-Branch-H-not-firing). (3) Seeds
      deterministic, declared per arm, PIN-T0 discipline. (4)-(6) R5-1
      priced-semantics carriage, R5-3 non-reliance declaration consistency,
      and budget feasibility against the goal's sizing basis all PASS as
      written, with the findings below. (7) The single occurrence of the
      RAT-5 citation-error figure (29.2), inside the verbatim RAT-5
      quotation at execution-design.yaml:334, is ruled ACCEPTABLE CARRIAGE
      (mentions-not-uses); it never appears as a live value. THREE
      LOAD-BEARING FINDINGS for a future authorization decision: F-1, the
      execution-budget.json arm mirror diverges from the governing
      execution-design.yaml arm_table on 8 of 17 arms; F-2, the declared
      seed derivation rule ("floor block 531100 + j for j = 1..10 in
      committed run order") does NOT reproduce the design's own arm_table
      (applying it to the floor-arm positions yields 531101..531110 while
      the table assigns 531101-104 and 531106-109 to floor arms and
      531105/531110 to the report-only k=8 arms); F-3, two bound-carrying
      sentences carry no priced-semantics statement (arm_plan.why_D2_and_
      not_the_alternatives.vs_D1, and one sentence in the proves_too_much
      section). Non-load-bearing: F-4 pointer-form R5-1 carriage at ~9
      sites versus the design's own stricter "not by pointer" rule
      (substance preserved); F-5 the G4 label "6.5 exact Garwood lower
      bound" is imprecise while the committed threshold 39 is unambiguous;
      F-6 validator procedure disclosures. Runs 2/3; zero arms.
    - >-
      JOINT J-D2 (red-team): VERDICT BREAKS, narrow and precisely located.
      WHAT HOLDS (everything else this joint attacked): the outcome-to-
      sentence map is COMPLETE (23 rows; every branch verdict of every arm
      class has a row) and ZERO licensed sentences exceed what the
      candidate licenses under NARROW-1..5, RAT-3/4/5-with-SR-1 and the R5
      conditions; the stopping-rule architecture DEFEATS EVERY
      discretionary-stopping attack on the declared paths (six early exits
      compose no floor sentence; no interim floor evaluation; deterministic
      G4; reseed null-arms-only and suppressive; pre-arm resource
      exhaustion preserves receipts; no favorable reseed; the G4 monotone
      early-firing clause is not exploitable); all constructed known-false
      objects (OBJ-3, OBJ-5B reproduced exactly; OBJ-4 within seeded MC
      error) route away from FM-PLATEAU-CONSISTENT; absence-of-decay never
      maps to plateau evidence; the prohibited-sentence search is clean
      (mentions only, never uses; the two report-only k=8 arms carry no
      verdict force anywhere); margin-zone outcomes map to FM-UNRESOLVED
      only with both load-bearing conjuncts non-droppable and
      non-movable post-data; AC-1/AC-2 are DORMANT under the design as its
      own binding-text carrier. THE BREAK (RT4-F1): the committed arm plan
      is self-contradictory and cross-artifact contradictory -- the
      machine-readable mirror directs an executor to run 8 of the 10 floor
      arms at (seed, armid) pairs different from the governing YAML -- and
      P5 admissibility, the precondition that decides whether ANY floor
      sentence is ever composed, hangs on which list binds. That choice is
      the ONLY post-data discretionary path found anywhere in the design:
      it swings the outcome between halt-no-sentence and compose-sentence
      and is resolvable only by improvisation once receipts exist, which
      is exactly the NARROW-2 optional-stopping failure mode entering
      through a transcription seam rather than through a declared rule.
      SUCCESSOR REQUIREMENTS: RT4-SR-1 (BLOCK) -- repair the arm plan into
      ONE committed (seed, armid) list, by a pre-arm superseding record,
      before any freeze or authorization; RT4-SR-2 (REVISE) -- remove the
      false "exact Garwood" derivation for the committed G4 = 39;
      RT4-SR-3..RT4-SR-6 (DISCLOSE) -- zero-count aliveness edge,
      halted-batch partial readings, transcription-plus-additions
      provenance, and hygiene items. Runs 2 scripts / 3 executions
      including one disclosed scoped OBJ-4 bug-fix rerun; zero arms;
      wall-clock overrun disclosed.
    - >-
      INDEPENDENT CONVERGENCE (the strongest signal of this round): J-D1
      and J-D2 were mutually blind -- neither read the other's directory,
      and both attested to it -- yet J-D1's F-1/F-2 and J-D2's
      RT4-F1/RT4-SR-1 are the SAME DEFECT, found from opposite directions:
      the arithmetic auditor found it as a table/rule inconsistency, the
      licensing auditor found it as an exploitable post-data seam. Two
      independent audits converging on one defect from different attack
      surfaces is strong evidence the defect is real, completely
      characterized, and the ONLY load-bearing one: no third auditor
      surfaced anything further. The secondary convergence (J-D1 F-5 and
      J-D2 RT4-SR-2 on the G4 derivation label) reinforces this.
    - >-
      PRIOR COMPARISON against the prior recorded in DEC-20260905-1ea7a0
      before any reviewer ran: (1) FP-budget arithmetic correct per-arm --
      CONFIRMED exactly, to the digit. (2) Stopping rules defeat
      discretionary stopping -- PARTIALLY OVERTURNED IN THE INFORMATIVE
      DIRECTION: the declared architecture is stronger than the prior
      expected (every declared-path attack defeated), but neither the
      prior nor the design anticipated that a cross-artifact transcription
      inconsistency could itself create the only post-data discretionary
      seam; the prior's threat model covered declared rules and missed
      undeclared seams between artifacts of one package. (3) R5-3
      non-reliance keeps AC-1/AC-2 dormant -- CONFIRMED. (4) No prohibited
      sentence -- CONFIRMED. NEW, UNANTICIPATED BY THE PRIOR: the
      single-author dual-artifact risk -- one producer writing both a
      governing YAML and a machine-readable JSON mirror produced drift on
      8 of 17 arms that no parse check or self-check caught. This is a
      process finding for all future design batches: machine-readable
      mirrors of committed tables are a licensing surface and belong in
      the review contract explicitly.

  ruling:
    - >-
      THE EXECUTION DESIGN IS NOT FIT FOR AUTHORIZATION AS AUTHORED. This
      is a statement about the DESIGN RECORD, not about the candidate, the
      pricing, the cascade, or any mathematical quantity: every arithmetic
      and licensing quantity the design commits was independently verified
      correct where the two artifacts agree. The defect is that the two
      artifacts do not agree, and that the disagreement sits exactly on
      the seam (P5 admissibility) that decides whether floor sentences are
      composed. Under DEC-20260904-c501b9's R5-2 and this record's own
      composition, no authorization decision may freeze a design whose
      committed arm plan is ambiguous.
    - >-
      REPAIR LANE (next_action RANK 1): a scoped producer repair, by a
      superseding design record under a new id (never an edit of the
      snapshot-archived artifacts, which are immutable): (a) RT4-SR-1 --
      ONE committed (seed, armid) list, identical in the governing record
      and its machine-readable mirror, with the seed derivation rule
      either corrected to reproduce the table exactly or replaced by
      explicit enumeration (J-D1 F-2); (b) F-3 -- priced-semantics
      statements added to the two bound-carrying sentences that lack them;
      (c) RT4-SR-2 -- the false "exact Garwood" derivation for G4 = 39
      removed, threshold kept; (d) J-D1 F-4 -- either inline the ~9
      pointer-form R5-1 sites or relax the design's own "not by pointer"
      rule explicitly, one or the other, no silent inconsistency; (e)
      RT4-SR-3..RT4-SR-6 disclosures carried into the repaired record.
      The repair then receives a focused re-review (validator re-derivation
      of the single committed list and the seed rule; red-team re-attack
      of the P5 seam only), and only after that passes may an
      authorization decision be composed. NO ARM RUNS until then.
    - >-
      NOTHING IN THIS RECORD is negative evidence about AES at any round
      count, about the FM-cascade mechanism, or about the 0.171940 bound;
      zero arms were run; the candidate, the RT2-SR-5 ruling, and the
      execution_gate_statement all stand unchanged. AC-1/AC-2 remain
      dormant under the design's declared non-reliance posture, and the
      repair lane must preserve that posture or explicitly close AC-1/AC-2
      first.

