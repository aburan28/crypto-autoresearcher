      C1 and C3 being met says nothing about it.
    the_ranked_work_left: 'RANK 1 through RANK 5 of `next_actions` below, each with its reason.'
    why_this_close_does_not_reach_for_completed: >-
      Two independent reasons, either sufficient. FIRST, the criterion set is
      not satisfied and the goal head declares no rule under which two of three
      criteria suffice. SECOND and more decisive on the merits: the goal's
      central hypothesis clause is confirmed only at CEILING level, only at
      `preliminary` strength, only at N = 2^24, and ZERO ONLINE RESEL-L ARMS
      HAVE EVER BEEN RUN -- so nothing in this campaign yet bears on whether
