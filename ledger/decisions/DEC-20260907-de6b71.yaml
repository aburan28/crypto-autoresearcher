  # ===================================================================
  # 1. WHAT THE GATE RULED, IN THIS CLOSE'S OWN WORDS
  # ===================================================================
  gate_outcome_as_this_close_reads_it:
    verb: revise
    decision_record: ledger/decisions/DEC-20260907-adbe7e.yaml
    full_report: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/tasks/TASK-20260907-9c0626/approval_review.yaml
    machine_readable: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/tasks/TASK-20260907-9c0626/gate-outcome.yaml
    the_shape_of_the_refusal: >-
      THE MATHEMATICS PASSED AND THE CONTRACT TEXT FAILED. The gate verified by
      recomputation it performed itself, not by reading: the cap convention
      symbol by symbol against the two named source files and then W and cap
      re-derived at all eight (N, a) cells with zero discrepancies; the
      three-term basin-mass accounting identity checked structurally against
      `exact_basins` and then recomputed cell by cell at all 20 committed cells
      of RUN-ECDLP-6ac801-001..005; every sha256 on the derivation packet's
      allowlist; byte-identity of every block CR-1 pins; and a failing world
      constructed or refused for each of the fifteen declared control items. It
      then refused on seven blocking findings about the COHERENCE OF THE
      CONTRACT'S INSTRUCTION -- not one of which is a defect the predecessor
      gate raised.
    all_seven_predecessor_defects_are_discharged: >-
      D1 through D7 of DEC-20260907-4e34c5, including the three blocking ones,
      are recorded DISCHARGED, and this close states it plainly because a
      second `revise` must not be read as a re-refusal. D1 was discharged by
      the STRONGER of the two routes the predecessor offered -- stating the
      frozen T value rather than deleting the arm. D2's repair is a correct
      three-term identity verified against code AND recomputed on committed
      data. D3's repair changes the MECHANISM (a closed positive allowlist
      replacing a denylist) rather than lengthening a list, and the gate
      confirmed all three properties that decide whether an allowlist works:
      sufficient, leak-free, self-detectable.
    the_predecessor_s_own_failure_did_not_recur: >-
      The gate audited this lane's dispatch queue, all six task cards, all six
      handoffs, the opening decision DEC-20260907-52f2a0, the snapshot receipt
      and the commit messages of 176b7d93e, c94a71b47, 58d256293 and
      b9be2983d. All clean. The predecessor's D3 leak was in five places in a
      committed queue and in two immutable commit messages; a commit message
      cannot be repaired afterwards, which is why this matters most of all.
    the_seven_blocking_findings:
      - 'CF-1 (operative): required_artifacts line 1754 demands a FIRED/NOT-FIRED status per cell for all fifteen declared items, six of which the same contract declares to have no firing condition -- (c) and (o1)-(o3) as structural self-checks that cannot fail, (j) and (n) as diagnostics fenced off from every verdict -- and converts an absent entry into NOT RUN. An executor has NO CORRECT ACTION for six of fifteen items. This binds execution rather than describing it, which is why it blocks.'
      - 'CF-2 (scope honesty): v3 calls the external anchor "independently established" at lines 1030 and 1298, while EV-ECDLP-60e266 records `strength: preliminary` and states that no independent implementation exists.'
      - 'CF-4 (calibration): DECAY-A clause (i) routes F6 -- the falsification of the batch''s claim to be measuring stored-advice efficiency at all -- off a zero-tolerance strict-monotonicity comparison of four sample means, while clause (ii), the interval estimator that could bound its false-positive rate, is declared CONTEXT ONLY and to bind nothing.'
      - 'CF-5 (cross-reference): the `controls_falsifiability_summary`, which labels itself REQUIRED READING FOR THE GATE, opens "Of the fifteen declared items" and then partitions them 11 + 3 + 2 = 16.'
      - 'LO-1 (cross-reference, self-reported by the author): the amendment''s falsifiability table omits the specification''s (j) diagnostic, so from that point its letters run one behind -- its (l) is DECAY-TSEL where the specification''s (l) is DECAY-A -- and its summary counts fifteen items over a table of fourteen.'
      - 'XR-1 (cross-reference): the amendment''s four CR-1 conditions are permuted against DEC-20260907-b6bcf4''s numbering; only COND-1 is correct and only COND-1 carries a `condition_quoted_from` pointer.'
      - 'XR-2 (cross-reference): the two normative documents attribute the same quoted phrase to two different CR-1 conditions.'
    three_non_blocking_findings: 'XR-3 (control (h) points at "(o)" for the tie-break key stream); J1-CITE (instrument.py line 84 cited where the assignment is at line 81); CT2-CHAR (the N = 2^20 arm''s control coverage is understated -- ten of eleven controls apply there, and control (l) clause (iii) already relies on an anchor record that itself carries N = 2^20 seeds on the pinned instrument).'
    the_ruling_on_the_author_s_self_reported_defect: >-
      NOT ACCEPTABLE WITH A RECORDED REMEDY, and this close records the ground
      because it is transferable. The author declined to fix LO-1 on the ground
      that the files are snapshot-archived with bound hashes. THE GATE
      SEPARATED TWO DIFFERENT IMMUTABILITIES: the completed archive IS
      immutable and the gate would refuse any proposal to rewrite
      TASK-20260907-6077f2's commit or receipt, but the v3 documents are NOT
      YET APPROVED -- they read `approved_by: null`, they are not
      execution-authorized, and no run exists under them. A superseding
      revision at a NEW snapshot leaves the archived bytes and hashes exactly
      as they are. The gate weighed and rejected the opposite ruling for three
      recorded reasons: LO-1 is one of six independent cross-reference defects
      in the same two documents rather than an isolated slip; the disagreement
      is about the CONTROLS, which are the batch's entire defence against
      believing an artifact; and the cost of repair is at its minimum now and
      rises monotonically -- one superseding snapshot before approval, an
      amendment after it, and after execution an amendment to a contract that
      runs already depend on, with `invalidation_rules` item 7 forbidding
      re-scoring what has executed.
    what_a_revision_must_not_reopen: >-
      The cap convention, the three-term accounting identity, the allowlist
      mechanism, the two-scale scope, and every block CR-1 pins byte-identical.
      The gate checked all of those and they pass; a revision that re-derived
