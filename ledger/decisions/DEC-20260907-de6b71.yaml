        a = 1/4 proves-too-much control. EV-ECDLP-6783b8 records the terminal
        verdict as S1 CONFIRMED FEASIBLE under v2's own S1/S2/S3 taxonomy: the
        two readings AGREE on the categorical verdict, with one opposite-sign
        draw in the blind five-draw sample disclosed and judged within
        seed-to-seed noise at the contract's most borderline cell.
        DEC-20260907-8d8782 records verb `support`, scoped exactly to that
        ceiling-feasibility confirmation, and records its own RANK 1 -- the v2
        amendment and the a = 1/8 re-seal -- as DISCHARGED.
      records: ['EV-ECDLP-6783b8', 'DEC-20260907-8d8782', 'TASK-20260907-2db9aa', 'TASK-20260907-b05db4', 'BATCH-3c7493', 'commit 0dbbbd9a0']
      why_neither_this_lane_nor_the_predecessor_recorded_it: >-
        The predecessor close COULD NOT HAVE: commit 0dbbbd9a0 is NOT an
        ancestor of TASK-20260907-ceb8cf's archive f996864d2 nor of the head
        write 0dbeb3c46, verified with `git merge-base --is-ancestor`. It
        arrived on this branch through the 631c524a7 merge, so it WAS reachable
        at this lane's opening snapshot 176b7d93e -- and this lane's opening
        deliberately writes no head, so this close is the first head write on
        this branch with it reachable. No record is at fault; the mechanism is
