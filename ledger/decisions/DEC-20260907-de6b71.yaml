  # ===================================================================
  # 5. FINDING CF-3 -- CARRIED, WITH ITS OWNER REASSIGNED
  # ===================================================================
  carried_finding_CF_3:
    id: CF-3
    raised_by: 'DEC-20260907-adbe7e (the approval gate), as a program finding OUTSIDE its gated contract'
    target: 'experiments/EXP-ECDLP-6ac801/specification.v2.yaml -- APPROVED, frozen, execution_authorized: true today'
    the_defect: >-
      THE APPROVED CONTRACT CONTRADICTS ITSELF ABOUT THE a = 1/4 ANCHOR. Its
      control (b) at line 537 says "G3 FAIL 10/10 seeds, EV-ECDLP-60e266",
      attributing all ten seeds to N = 2^24, while its own metrics.primary at
      line 584 says "5/5 FAIL at 2^24".
    what_settles_it: >-
      ledger/evidence/EV-ECDLP-60e266.yaml lines 150-155: the ten seeds span
      TWO SCALES -- five at N = 2^24 (RUN-013..017) and five at N = 2^20
      (RUN-001..005), both on EXP-ECDLP-612fb1. metrics.primary is right and
      control (b) is not.
    the_live_consequence: >-
      An executor running under the approved v2 today reads control (b) as a
      ten-seed N = 2^24 anchor, OVERSTATING the reproduction control's external
      support twofold in seed count while silently attributing N = 2^20 seeds
      to N = 2^24.
    v3_is_not_at_fault: >-
      Both blocks are reproduced BYTE-IDENTICALLY in specification.v3.yaml
      under CR-1's COND-2 and COND-3, which forbid editing them. Reproducing
      the contradiction faithfully was the correct behaviour, and the gate says
      so.
    what_is_and_is_not_at_risk_today: >-
      Stated so the finding is neither inflated nor buried. The one run set
      that has executed under the approved v2 -- TASK-20260907-2db9aa's Stage A'
      re-seal, EV-ECDLP-6783b8 -- used the a = 1/4 cell as its proves-too-much
      method control and its result is recorded as matching EV-ECDLP-60e266,
      so there is no evidence that control (b)'s misstatement affected it. THE
      RISK IS PROSPECTIVE: any future run under v2, and any contract that
      inherits control (b)'s text.
    remedy: >-
      A SUPERSEDING RECORD against the approved specification.v2.yaml, correcting
      control (b) to match metrics.primary and EV-ECDLP-60e266's own two-scale
      seed split. Never an edit to the approved file.
    owner_named_by_the_gate: 'BATCH-8f3e86, "the lane that owns it".'
    owner_as_reassigned_by_this_close: >-
      BATCH-8f3e86 HAS CLOSED, so that assignment no longer resolves. This
      close reassigns the remedy to THE NEXT LANE THAT OPENS ON
      EXP-ECDLP-6ac801, which by the ranking below is the RANK 1 v3-repair
      successor, and makes it a required carried item of that lane rather than
      a rank of its own -- it is a documentation correction that reduces no
      research uncertainty, and giving it a lane of its own would be
      make-work while the lane that must open anyway can carry it for
      approximately nothing.
    not_performed_here: >-
      DELIBERATELY NOT PERFORMED. This close writes no byte of any v2 path, no
      byte of any BATCH-8f3e86 record, and no byte of any snapshot-archived
      file. It names the remedy and its new owner; it does not raise it.
    also_carried: >-
      The gate's RANK 6 standing check: whenever a contract in this lineage
      leans on EV-ECDLP-60e266, it must carry that record's own `strength:
      preliminary` and the reason for it (one execution batch, no independent
      implementation). The anchor is real and useful; describing it as
