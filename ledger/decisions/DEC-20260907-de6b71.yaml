  # ===================================================================
  # 8. RATIONALE FOR THE RANKING
  # ===================================================================
  rationale:
    - >-
      THE LANE'S OUTCOME IS A REFUSAL, AND A REFUSAL ENDS THIS TASK, NOT THE
      CAMPAIGN. BATCH-48ef8b authored a contract and had it gated by an
      independent session that returned `revise`. That is the lane's
      disposition. It executed nothing, so no evidence record exists, no
      hypothesis status moves, and nothing in this close asserts anything about
      the ECDLP. What the lane produced that is worth carrying: a discharged
      predecessor defect list, a contract whose mathematics and mechanism are
      now independently verified, a leak discipline that held under audit
      including in four immutable commit messages, an enumerated ten-item
      remedy list, an overturned prior, finding CF-3 against an approved
      contract, and finding TG-1 about how these contracts are being written.
    - >-
      RANK 1 IS THE v3 REPAIR, AND THE REASON IS NOT THAT IT IS THIS LANE'S
      SUCCESSOR. Three things put it first. FIRST, its work is fully specified
      and bounded: the gate wrote ten per-item remedies and an explicit list of
      what must NOT be reopened, so the successor authorship is a closed task
      rather than another open-ended pass, and the gate's own ruling is that
      the repair cost is at its minimum NOW and rises monotonically -- an
      amendment to an approved contract after approval, and after execution an
      amendment to a contract that runs already depend on, with
      `invalidation_rules` item 7 forbidding re-scoring what has executed.
      SECOND, its purpose is now BETTER motivated than when the lane opened,
      not worse: a = 1/8 is confirmed feasible at N = 2^24 by two records from
      two lanes, and what those records jointly show is a borderline cell
      measured twice at five draws with exactly one opposite-sign draw each
      time and a review joint recorded BREAKS on that disagreement -- which is
      the canonical case for v3's 25-seed arm, its interval routing and the SU
      label it introduced for a straddling interval. THIRD, it is the
      cheapest of the five candidates by a wide margin and it unblocks the
      other four rather than competing with them.
    - >-
      WHAT RANK 1 WAS RANKED AGAINST, AND WHY EACH LOST. (i) THE v2
      SELF-CONTRADICTION CF-3 is arguably more URGENT -- v2 is
      execution_authorized today and its owning lane has closed, so the remedy
      is unowned -- but it is a documentation correction that reduces ZERO
      research uncertainty, the one run set already executed under v2 shows no
      sign of having been affected by it, and the lane that must open anyway
      can carry it for approximately nothing. Urgency is not the ranking
      criterion; uncertainty reduced is. It is therefore a REQUIRED CARRIED
      ITEM of RANK 1, not a rank. (ii) COMPLETION CRITERION C2 is the goal's
      ONLY OPEN criterion, which is the strongest argument any candidate here
      has, and it still loses: its blocker is instrumental rather than
      scientific (the O(theta) correction gating `fixture_gate_v2`), its next
      step is ALSO an amendment authorship so it gains nothing in immediacy,
      and closing the criterion tally while the central clause sits at
      `preliminary` on five-draw samples would optimise the wrong quantity. C1
      and C3 being MET makes that more tempting, not more justified. (iii) THE
      ONLINE RESEL-L ARM is the goal's largest genuine gap and moves UP to
      RANK 2 on the new facts, but not to RANK 1: its comparison target is the
      ceiling, and the ceiling's definitional gap is LIVE in the approved v2
      (CR-1a: cap, CAP_MULT, cycle_mass and capped_mass appear zero times in
      it), so an online arm run today would be read against a definition a
      from-scratch re-deriver cannot recover. Fix the definition, then measure
      against it. That ordering is a reason, not a deferral. (iv)
      IDEA-20260906-a3d6ae AND THE CHEAP CLOSURES are last for the reason they
      have always been last: none bears on the borderline cell or on C2, and
      none is blocked, so nothing is lost by their position.
    - >-
      THE RANKING IS WRITTEN AGAINST A MOVED FACT BASE, AND SAYS SO. Two
      premises this lane opened under are false as of the origin/main merge at
      4e737c70e: a = 1/8 is no longer open, and the lane the gate named as
      CF-3's owner has closed. Both are recorded in
      `fact_base_changed_since_this_lane_opened` with the commits that settle
      them. This is the SECOND recorded recurrence of HB-1, and its concrete
      cost this time is that this lane's own RANK 1 was authored against a
      premise that had already been overtaken on main -- which is why the
      successor's objective statement is a binding condition below rather than
      an inheritance.
    - >-
      NOTHING IN THIS CLOSE RE-SCORES, REINTERPRETS OR RETRACTS ANY COMMITTED
      FINDING, and no measurement originates in it. EV-ECDLP-6783b8,
      EV-ECDLP-6a4ebc, EV-ECDLP-2e9680, EV-ECDLP-60e266, EV-ECDLP-f6b3f5,
      DEC-20260907-8d8782, DEC-20260907-6d9427 and DEC-20260907-9b1b02 are
      cited at their own stated scope and are untouched. The gate's
      recomputations are cited as THE GATE'S; this close performed none of
      them.

