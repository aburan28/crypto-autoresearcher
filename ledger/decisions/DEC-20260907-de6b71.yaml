  goal_closure_assessment:
    asked_explicitly: 'DOES A COMPLETION CRITERION CLOSE GOAL-ECDLP-bbc21f? NO. The goal stays open and stays `active`.'
    C1: 'MET (unchanged by this lane; flipped by TASK-20260906-ae5bb4 on EV-ECDLP-60e266 and EV-ECDLP-f6b3f5)'
    C2: 'OPEN (unchanged by this lane; the goal''s only unmet criterion)'
    C3: 'MET (unchanged by this lane; flipped by TASK-20260906-ae5bb4 on EV-ECDLP-60e266''s obstruction block)'
    which_criterion_is_unmet_and_why: >-
      C2. It requires the EXP-ECDLP-869870 instrument committed with its
      basin-law measurements (survival slope, cutoff), its oracle-ceiling
      measurements (exact top-T share against C_max(a)), its published-rule
      measurements (the seven-cell primary-source fixture and C_rule/C_oracle
      as a function of N/T), AND their N-independence verdict across
      2^20..2^30, each with a confidence interval and the model value beside it.
      BATCH-1e7251 delivered the re-keyed 2^24 fixture (16/16 completed_valid,
      blinded J1-J4 all hold or PASS) but its own checkpoint records
      `fixture_gate_v2` NOT SCORED because the O(theta) correction was
