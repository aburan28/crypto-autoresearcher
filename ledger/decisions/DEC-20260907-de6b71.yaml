  # ===================================================================
  # 2. PRIOR VERSUS OUTCOME -- THE MOST INFORMATIVE PART OF THIS CLOSE
  # ===================================================================
  prior_versus_outcome:
    prior_record: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml
    prior_id: PRIOR-BATCH-48ef8b
    written_by: TASK-20260907-058c69 (the authoring session)
    committed_before_the_gate_existed: >-
      YES, and the commit time is the proof: the prior is inside BATCH-48ef8b's
      OPENING snapshot at 176b7d93e, before any gate session of this lane
      existed. It was moved off the reading path of the two roles it could
      contaminate -- absent from the derivation packet's allowlist, named on
      specification.v3.yaml's corroborating denylist -- rather than deleted,
      because THE ANSWER TO A LEAKING PRIOR IS NEVER TO STOP RECORDING IT.
    gate_attested_read_order: >-
      The gate opened it only AFTER its per-joint findings, its full defect
      list and its verdict verb were written to disk
      (`sealed_prior_attestation.read_before_own_findings_were_written:
      false`), and the prior-comparison block was appended to an
      already-written report.

    the_headline_agreement_is_worth_almost_nothing: >-
      The prior predicted "REVISION REQUIRED on at least one item, not clean
      approval" at moderate-high confidence, and the gate returned `revise`.
      BOTH THE AUTHOR AND THE GATE RECORD THAT THIS AGREEMENT DISCRIMINATES
      BETWEEN ALMOST NOTHING, for the reason the prior itself gives: predicting
      clean approval of one's own work would be the least credible prior
      available, so `revise` is the modal prediction any competent author makes
      about any large document. This close does not cite it as corroboration.

    where_the_prior_was_overturned:
      summary: >-
        THE AUTHOR NAMED FOUR PLACES IT EXPECTED THE CONTRACT TO BREAK FIRST.
        THE GATE PASSED ALL FOUR. Not one of the seven blocking findings is at
        a location the prior named, and the prior's explicit prediction about
        what the gate would MISS was overturned in the most direct way
        available.
      the_four_named_break_points_and_their_outcomes:
        - 'EXP-BREAK-1, control (g)''s authority argument for 25 seeds -- the author expected a strict gate could reasonably refuse it. PASSED. The gate verified the authority gap independently (`invalidation_rules` item 7 does not name the seed set) and accepted control (e)''s own stated rationale as the warrant, on the ground that refusing it would require holding that a control''s stated purpose cannot license a change serving that purpose better.'
        - 'EXP-BREAK-2, the cap formula''s fidelity in some subtle detail, with pool-construction crediting or the saturation constant named as the likeliest error. PASSED, and it was the joint that took the LEAST argument of any. The gate checked both specific details the author worried about and found them as stated.'
        - 'EXP-BREAK-3, the packet''s leak-freedom or its completeness -- "both are my own assertions about my own text". PASSED on all three properties with zero hash mismatches. The gate also reached the author''s own conclusion independently about the one disclosed inclusion.'
        - 'EXP-BREAK-4, the second scale as added surface for no required purpose. PASSED. The gate took the smaller change seriously and declined it: N-dependence of the feasibility boundary is a live possibility a single-scale batch cannot see.'
      the_miss_prediction_and_its_reversal:
        what_the_prior_predicted: >-
          Recorded by the author as the most useful thing a prior can contain:
          that the gate would focus on the cap formula because it is legible
          and checkable, and would UNDER-ATTACK the control falsifiability
          table -- whether each item really has a reachable failing world,
          which requires arguing about each rather than reading code -- and the
          question of whether the derivation packet is sufficient. "If the gate
          confirms the cap formula and stops, the review has checked the easy
          joint."
        what_happened: >-
          OVERTURNED. The control falsifiability table is not merely where the
          gate looked hardest; it is where FOUR of the seven blocking findings
          came from -- CF-1, CF-5, LO-1 and CF-4 all come out of working
          through the fifteen items one at a time and constructing or refusing
          a failing world for each. That is exactly the expensive,
          argue-about-each-item work the prior predicted would be skipped. The
          cap formula was checked and was clean.
        the_one_point_where_the_prior_was_right: >-
          Sufficiency of the derivation packet cannot be settled by reading,
          and the gate agrees explicitly rather than by accident: J4 records
          that sufficiency is its own judgement from reading deliverables.md
          against the allowlist, and that a packet is proven sufficient only
          when a re-deriver completes without reaching outside it. That
          limitation was written before the prior was opened and stands
          unchanged.
      net_effect_on_the_verdict: 'Zero blocking findings added, zero withdrawn, zero severities changed after the read. The gate records that the prior constrained nothing because there was nothing to correct, and reports that as an outcome rather than as a virtue.'

    what_this_says_about_where_the_RISK_ACTUALLY_LIES:
      the_finding: >-
        THE RISK IN THIS CONTRACT IS NOT WHERE ITS AUTHOR EXPECTED IT, AND THE
        DIFFERENCE IS SYSTEMATIC RATHER THAN INCIDENTAL. Every location the
        author named is a place where the contract makes an EXTERNAL claim --
        that a formula matches code, that a packet is complete, that a seed
        count has authority, that a second scale is worth its cost. Those are
        the claims an author can audit, because each is checkable against
        something outside the document, and all four survived. Every one of the
        gate's seven blocking findings is instead an INTERNAL claim: that the
        contract's two normative documents agree with each other about how many
        controls it has and which letters name them, that a summary partitions
        its own item set, that a required-artifact quantifier ranges only over
        items whose declared kind admits the demanded field, that a condition
        number resolves to one condition. Those are exactly the claims a
        one-pass author cannot audit, because auditing them requires holding
        two distant blocks of a two-thousand-line document in view at once, and
        no amount of care while writing either block reveals a disagreement
        between them.
      why_it_is_worth_recording_rather_than_noting: >-
        It is a prediction about where the NEXT gate on this lineage will find
        its defects, and it is falsifiable: if the successor revision is
        refused again, this close predicts the findings will again be internal
        cross-reference or calibration defects rather than external ones, and
        that prediction is wrong if the next gate breaks the contract on a
        formula, a packet or a scope. It also names a remedy that is mechanical
        rather than exhortative -- see `contract_authorship_method` below.
      what_it_does_not_claim: >-
        It is one comparison of one prior against one gate on one document. It
        is not a survey, it asserts nothing about the ECDLP, and it does not
        imply the author was careless: five of the ten defects the gate lists
        are single-token cross-references, and one was self-reported by the
        author before the gate ran.

  # ===================================================================
  # 3. TWO GATES, TWO REFUSALS -- RECORDED AS A FINDING IN ITS OWN RIGHT
  # ===================================================================
  two_gates_two_refusals:
    id: TG-1
    the_pattern: >-
      TWO INDEPENDENT COORDINATOR GATES HAVE NOW REFUSED TWO SUCCESSIVE
      AMENDMENTS OF ONE EXPERIMENT BEFORE ANY COMPUTE WAS SPENT, each in a
      fresh session that authored none of what it gated, and IN BOTH ROUNDS THE
      MATHEMATICS PASSED WHILE THE CONTRACT TEXT FAILED.
      ROUND 1: DEC-20260907-4e34c5 on PA-ECDLP-6ac801-v1-to-v2 (lane
      BATCH-e9fd22, gate TASK-20260907-f65c6e) -- three blocking defects (a
      stale T value contradicting a frozen table; a basin partition asserted
      exhaustive with the cap convention absent entirely; the Coordinator's
      directional prior sitting on the blind re-deriver's pre-seal reading path
      in two committed files on no blind list) and four non-blocking.
      ROUND 2: DEC-20260907-adbe7e on PA-ECDLP-6ac801-v2-to-v3 (lane
      BATCH-48ef8b, gate TASK-20260907-9c0626) -- seven blocking defects, all
      of them cross-reference, calibration or scope-honesty defects in the
      contract's own instruction text, and NONE of them a Round 1 item.
      In both rounds the authoring session did not see the defects the gate
      found, and in Round 2 the author self-reported one of them and declined
      to fix it on a ground the gate then ruled does not hold.
    the_concrete_cost:
      - >-
        TWO FULL AUTHORING CYCLES AND TWO GATE SESSIONS, ZERO RUNS. The wide
        measurement the lineage exists to run -- 25 seeds, two scales, interval
        estimation, eleven controls -- is still unexecuted and still
        unapproved, and a third authorship plus a third gate now stand between
        it and execution.
      - >-
        THE OPPORTUNITY COST IS NAMEABLE AND HAS BEEN PAID TWICE. Both the
        online RESEL-L arm (the goal's largest genuine gap, zero arms ever run)
        and completion criterion C2 (the goal's only OPEN criterion) have now
        waited behind an amendment authorship in two consecutive lanes. That
        cost is real and is not smoothed over by the benefit below.
      - >-
        Round 2 additionally spent its budget discharging Round 1's defects,
        all seven of which the gate confirms were genuinely discharged. That
        work was not wasted, but it was work whose only purpose was to make a
        document acceptable, not to reduce any uncertainty about the ECDLP.
    the_concrete_benefit:
      - >-
        FOUR OF THE TEN BLOCKING DEFECTS WOULD HAVE PRODUCED INVALID OR
        UNINTERPRETABLE OUTPUT, DISCOVERED -- IF AT ALL -- AFTER COMPUTE. Round
        1's stale T value would have run a second-scale arm at a table size the
        frozen instrument does not use. Round 1's false exhaustive-partition
        identity would have handed a blind re-deriver a self-check that is
        false of the object both readings compute, actively misleading it.
        Round 1's leaking prior would have contaminated the seal the whole
        design rests on. Round 2's CF-1 leaves an executor with no correct
        action for six of fifteen items, and the two actions available differ
        in whether two fenced diagnostics enter the control report -- which is
        the one surface through which a fenced diagnostic begins reading as a
        control.
      - >-
        ROUND 1'S D2 IS STILL LIVE IN THE APPROVED, EXECUTION-AUTHORIZED v2,
        which is the strongest available evidence that the gate caught
        something real: `cap`, `CAP_MULT`, `cycle_mass` and `capped_mass`
        appear ZERO times in experiments/EXP-ECDLP-6ac801/specification.v2.yaml
        (DEC-20260907-b6bcf4 CR-1a, verified by grep of the committed file), so
        a from-scratch re-deriver working from the approved contract alone must
        invent a cap convention. A run has already executed under that
        contract. The defect was found by a gate reading a DIFFERENT document.
      - >-
        Each refusal is enumerated, per-item and cheap to discharge. Round 2's
        report carries ten named remedies in
        `verdict_block.what_a_revision_must_contain` and an explicit list of
        what the revision must NOT reopen, so the third authorship is bounded
        work rather than another open-ended pass.
    the_verdict_this_close_is_asked_for:
      is_the_gate_working_as_designed: >-
        YES, AND THAT IS NOT THE OPERATIVE ANSWER. The gate is doing exactly
        what an approval gate is for: it refuses operative defects before
        compute, in a session that cannot be flattered by having written the
        document, and it says which are blocking and why. Nothing in the gate's
        conduct needs changing, and the second gate in particular did the
        expensive work its own author predicted it would skip.
      does_contract_authorship_need_a_different_method: >-
        YES, AND THIS IS THE OPERATIVE ANSWER. A process in which two
        successive one-pass authorships of the same contract each fail on the
        SELF-CONSISTENCY OF THEIR OWN TEXT does not have bad luck as its
        failure mode. Both rounds' defects share one shape: they are internal
        disagreements that no single reading of any one block can see -- a
        letter offset between two documents, a summary that does not partition
        its own item set, a quantifier ranging wider than the semantics it
        assumes, a permuted condition numbering, one quoted phrase attributed
        to two conditions, a stale file:line pointer. EVERY ONE IS
        MECHANICALLY CHECKABLE AND NONE REQUIRES JUDGEMENT. Continuing to
        catch them by asking a human-equivalent reader to hold a
        two-thousand-line document in view is a method with a known,
        twice-measured failure rate.

    contract_authorship_method:
      id: AM-1
      name: 'Derive-then-assert: one machine-checkable source for the item and condition tables, plus a mandatory pre-gate self-consistency pass archived as a task artifact.'
      the_rule: >-
        BEFORE A CONTRACT OF THIS LINEAGE IS SUBMITTED TO A GATE, THE AUTHORING
        TASK RUNS A SELF-CONSISTENCY PASS THAT IS A SCRIPT, NOT A READING, AND
        ARCHIVES ITS OUTPUT UNDER THE TASK DIRECTORY. Five checks, each cheap,
        each mechanical, each with zero judgement in it:
      the_five_checks:
        - 'C-1 ITEM-SET IDENTITY: extract the declared item set from the specification and from the amendment, as sets of (letter, name, kind), and assert the two are equal. Would have caught LO-1.'
        - 'C-2 PARTITION ARITHMETIC: assert every summary count equals the size of the partition it claims, and that the partition is disjoint and exhaustive over the extracted set. Would have caught CF-5.'
        - 'C-3 QUANTIFIER RANGE: assert every `required_artifacts` quantifier ranges only over items whose declared kind admits the field it demands. Would have caught CF-1, the round''s one OPERATIVE blocking defect.'
        - 'C-4 CROSS-REFERENCE RESOLUTION: assert every condition, criterion, falsification and control reference (COND-n, S-n, F-n, control letters) resolves to exactly one target, and that any phrase quoted from a source decision carries a `quoted_from` pointer to it. Would have caught XR-1, XR-2 and XR-3.'
        - 'C-5 POINTER FRESHNESS: assert every cited file:line pointer still resolves to the cited token. Would have caught J1-CITE.'
      what_the_script_would_NOT_have_caught_and_why_that_is_the_point: >-
        CF-2 (the anchor described as "independently established" when its own
        record reads `strength: preliminary`) and CF-4 (a zero-tolerance
        monotonicity clause routing the batch's most severe falsification while
        the estimator that could calibrate it is declared to bind nothing).
        THOSE TWO NEED A READER, and they are the two findings of this round
        that a gate's judgement is actually worth paying for. The method's
        purpose is not to replace the gate; it is to stop spending the gate's
        judgement on arithmetic, so that a refusal carries two findings a
        script cannot reach instead of seven of which five it could.
      cost_and_honesty: >-
        The pass is not free: it requires the contract's item and condition
        tables to be extractable, which in practice means authoring them as one
        structured block and deriving the prose statements from it rather than
        writing both. That is a real constraint on how these contracts are
        written and it is the substance of the method. It is also UNTESTED: no
        such pass has been run in this program, this close implements none of
        it, and the claim that it would have caught five of the seven blocking
        findings is derived by inspection of the gate's own defect list, not
        demonstrated by running anything.
      where_it_is_owed: 'RANK 1 of `next_actions` below carries it as a required deliverable of the successor authorship, so the claim gets tested on the next document rather than asserted here.'

  # ===================================================================
  # 4. THE FACT BASE MOVED WHILE THIS LANE RAN
  # ===================================================================
  fact_base_changed_since_this_lane_opened:
    why_this_section_exists: >-
      TWO FACTS THIS LANE WAS OPENED UNDER ARE NO LONGER TRUE, and both bear
      directly on the rerank. Recording them is not optional: the goal head's
      committed next_action and this lane's own queue notes both rest on
      premises that committed records elsewhere have since changed, which is
      the second recorded recurrence of finding HB-1 (DEC-20260907-b6bcf4).
      Neither fact is a defect of the gate, whose contract was a document.

    change_1_a_1_8_is_no_longer_open:
      what_this_lane_was_opened_believing: >-
        The goal head's committed next_action and DEC-20260907-b6bcf4 both
        record the a = 1/8 cell of EXP-ECDLP-6ac801 as GENUINELY OPEN -- its
        blind and production readings disagreed under v1's underspecified
        definitions -- and that premise is the whole reason this lineage of
        amendments exists.
      what_the_committed_record_now_says: >-
        THE STAGE A' RE-SEAL UNDER THE APPROVED v2 HAS RUN AND IS ARCHIVED.
        TASK-20260907-2db9aa performed a freshly sealed, from-scratch blind
        re-derivation of a = 1/8 at N = 2^24, r = 2, T_sel = T/2 under v2's
        now-explicit selection formula, using a wholly independent
        implementation (an independently constructed uniform random self-map
        table, independent Bernoulli marking, and exact binary-lifting
