coordinator_decision:
  id: DEC-20260901-600997

  context: >-
    GOAL-AES-003 batch-closing act by the dispatching Coordinator
    (session coordinator-aes003-1, 2026-09-01), executed as ledger
    archive task TASK-20260901-9ba501 of BATCH-5ed9a3. BATCH-5ed9a3
    was opened by DEC-20260901-4205b2 to execute IDEA-20260901-026d6a
    Stages r0+r1 (the repaired envelope-relative carrier statistic).
    The producer reported RX-DEAD with a disclosed rule-wording
    overlap; the independent validator confirmed all numbers with zero
    discrepancies and upheld RX-DEAD as the more specific branch; the
    independent red team returned verdict-must-narrow, accepting the
    signature death at tested scope but narrowing the carrier clause
    to weakened/non-replicated on power grounds.

  decision: close_batch

  decision_scope: >-
    THIS DECISION CLOSES BATCH-5ed9a3, RECORDS ITS EVIDENCE AS
    EV-AES-241790, AND MOVES THE GOAL HEAD. It moves
    current_batch_id to BATCH-5ed9a3, dispatch_queue_path to the
    BATCH-5ed9a3 queue, appends the batch_checkpoints entry, rewrites
    next_action, and leaves latest_verified_commit to be advanced by
    the verified follow-up commit once this ledger archive is
    post-commit verified. It promotes NO knowledge and asserts NOTHING
    beyond EV-AES-241790: in particular it does NOT declare e dead as
    a carrier in general, does NOT close the ramp-shape question, and
    does NOT spend Stage 1a/1b.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-5ed9a3
    - EV-AES-241790
    - TASK-20260901-ed281d
    - TASK-20260901-6dbb7b
    - TASK-20260901-5174ca
    - TASK-20260901-281b77
    - TASK-20260901-9ba501
    - DEC-20260901-4205b2
    - IDEA-20260901-026d6a
    - IDEA-20260901-363851
    - EV-AES-732f71

  outcome: >-
    NEGATIVE OUTCOME, scope-narrowed: the repaired X statistic's
    anchor controls passed on committed and fresh dead data (p_extra =
    1 exact both times; anchor analyzed first); the confirmatory alive
    arm at seed 531002 read S_obs = 0 / p_extra = 1 exact, so the
    preregistered excess-zero SIGNATURE is falsified at t=1 within the
    tested statistic/probe cell/exposure/seeds (RX-DEAD applied as the
    more specific branch). The seed-531001 residual (S=3, p_extra
    0.0361) is adjudicated UNREPLICATED, not established. Because the
    exposure had power only against relatively strong per-hit effects
    (80% power at rho >= 0.225; weak effects rho <= 0.15 survive) and
    the frozen rule's RX-WEAK-b2 branch also literally matches, the
    carrier clause of e is recorded as WEAKENED / NON-REPLICATED at
    t=1 rather than dead; the ramp-shape question and a powered 2^32
    successor remain open.

  rationale:
    - >-
      The preregistered rule fired RX-DEAD and the validator upheld
      that application; the record is honest about the disclosed
      overlap and adopts RX-DEAD for the signature verdict because it
      is strictly more specific and because the alternative would make
      FX1 unreachable in its own preregistered scenario.
    - >-
      The red team's power analysis is adopted: a 2^30 arm with 19
      hits cannot falsify weak carrier effects; therefore the carrier
      clause is weakened, not dead, and the named 2^32 successor stays
      on the roadmap rather than being preempted by the RX-DEAD
      default.
    - >-
      No knowledge promotion: this is a scoped negative measurement
      with disclosed power limits.

  next_action: >-
    RANK 1: A SCOPED POWERED FOLLOW-UP PROPOSAL via idea-generator
    for one 2^32 t=1 arm under the repaired X statistic (or a
    power-equivalent design), with an explicit branch-precedence
    clause repairing the RX-WEAK-b2/RX-DEAD overlap, a dead-arm anchor
    first, and a stop rule that distinguishes non-replication from
    weak-signal survival. Inputs: EV-AES-241790, TASK-20260901-281b77
    red_team_report.yaml (power table, repair wording),
    IDEA-20260901-026d6a RX-WEAK successor. RANK 2: ramp-shape
    question (IDEA-20260901-363851 C3) only after RANK 1 adjudicates
    weak effects, and only as a shape-only design if no excess-zero
    signature survives. RANK 3: IDEA-20260901-69912d (layer autopsy).
    RANK 4: IDEA-20260901-02f7c4 battery arms B1-B3. RANK 5: the
    256-byte random-bijection control (EV-AES-b2910a confound 1).
    RANK 6: decay-specific design if needed (EV-AES-5478a0 confound).
    RANK 7: BATCH-6fe3c2 ledger-archive debt. Full rationale:
    DEC-20260901-4205b2, EV-AES-241790, TASK-20260901-5174ca,
    TASK-20260901-281b77.

  evidence_refs:
