coordinator_decision:
  id: DEC-20260904-8c17d5
  context: >-
    Composes the independent Validator (J1/J2, both `holds`, with a
    disclosed blindness-process caveat on J2) and Red Team (J3 `holds` on
    the math but flags a scrutiny-sequencing process gap; J4 finds the
    archived P3 headline test itself is misspecified and, correctly
    reconstructed, is nominally significant) review of EXP-MONO-cb905d's
    full run package, per review-plan TASK-20260904-bb2f29. Independently
    re-verified by this Coordinator: (a) the sampler-correctness proofs
    (matches both reviewers' derivations); (b) the test-mismatch defect and
    its corrected p-value via a fourth, independent method (log-ratio delta
    method: p=0.0248, inside the Red Team's own [0.022, 0.038] range).
    Adopts both reviews' findings.
  decision: revise
  decision_label: >-
    sampler_math_verified_correct_headline_test_defect_found_and_corrected_reverses_significance_third_consecutive_borderline_result_replication_required_process_gap_disclosed
  target_ids:
    - H-MONO-1d50ac
    - H-MONO-45183a
    - EXP-MONO-cb905d
    - RQ-MONO-001
    - EV-MONO-c0bf6d
    - CORR-20260831-ba2118
    - CORR-20260904-d0205d

  hypothesis_status_before: proposed_instrument_underexplored_single_cell_inconclusive
  hypothesis_status_after: proposed_borderline_significant_after_correction_unreplicated_single_cell_inconclusive
  hypothesis_status_after_note: >-
    STILL NOT ADVANCED TO SUPPORTED OR REFUTED. The corrected, properly-
    specified test of EXP-MONO-cb905d's own headline comparison (whether
    the CM and ordinary curve's own transversal-vs-group-uniform sampling
    ratios differ at the matched p=617 cell) is nominally significant
    (p approximately 0.025-0.033, two independent derivations agreeing),
    reversing the archived run's own naive "not significant" reading. This
    is a genuine, non-trivial update: taken at face value, it is evidence
    FOR the endomorphism-ring-linked reading -- a real, targeted,
    exceptional-locus candidate, distinct from and more specific than
    anything else this lane has found. It is NOT taken at face value here,
    for three disclosed, unresolved reasons: (1) it is the THIRD
    consecutive borderline headline statistic computed on this SAME single
    cell (EXP-MONO-64aaa4 p=0.066; this corrected result p~0.025-0.033),
    with zero replication at a second independent cell and zero
    multiplicity correction applied -- a 2-test Bonferroni correction alone
    would push it back to the edge of or past alpha=0.05; (2) OBJ-6's own
    reference band was measured on five different curves, never at p=617,
    so "P1 above the band" cannot currently be diagnosed as artifact versus
    ordinary cell-to-cell variation; (3) this Coordinator's own process gap
    (authorizing compute and drafting interpretation before independent
    review touched the corrected sampler) is real, even though the
    underlying math held up, and the review architecture existing
    specifically to catch content errors before compute is spent should not
    be treated as having been fully honored just because it happened to be
    unnecessary this time.

  experiment_status_before: completed
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-1d50ac
        from: proposed_instrument_underexplored_single_cell_inconclusive
        to: proposed_borderline_significant_after_correction_unreplicated_single_cell_inconclusive
    experiment_status_changes: []
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped exactly to the single matched (p=617, N=580, tau=4) cell, m=4,
    transversal and group-uniform sampling as constructed in
    EXP-MONO-cb905d and its amendment. No ECDLP, relation-rate, exponent,
    or cryptographic-scale claim. Does not close KN-OPEN-009. Does not
    establish or rule out any (N,tau)-dependence formula for OBJ-6's own
    sampling-artifact ratio.

  rationale:
    - >-
      SAMPLER CORRECTNESS IS NOW ESTABLISHED TO A HIGH STANDARD: three
      independent parties (the Executor's own disclosed deviation, the
      Validator's toy-curve exact-enumeration-plus-Monte-Carlo proof, and
      the Red Team's independent 4M-trial combinatorial reconstruction,
      including a targeted adversarial mutation matching v1's actual
      defect) all converge on the same conclusion via disjoint methods.
      The out-of-band commit's content (CORR-20260831-ba2118) is therefore
      further corroborated, though this decision maintains that record's
      own disposition: the in-place edit was still a process violation
      regardless of correctness, and the proper amendment path was still
      the right vehicle.
    - >-
      THE HEADLINE TEST DEFECT IS ADOPTED AS A GENUINE, HIGH-SEVERITY
      FINDING, NOT A MINOR ARITHMETIC SLIP: RUN-MONO-cb905d-2's own
      Fisher-exact test compared any-collision-per-tuple counts (a
      different statistic than P1/P2 are built on) while treating both
      curves' transversal baselines as fixed, when they differ by ~11% and
      are themselves noisy measurements. This is exactly the kind of test-
      specification error the Validator's own joint (J2, verify the
      arithmetic is computed correctly from the CHOSEN test) is
      structurally unable to catch, and exactly what the Red Team's
      disjoint joint (J4, challenge whether the chosen test is the right
      one) exists to catch -- a clean demonstration of why this program's
      joint-ownership discipline (one joint, one owner, attacking a
      DIFFERENT failure mode than its sibling) matters in practice, not
      merely in principle.
    - >-
      THE CORRECTED P-VALUE IS ACCEPTED VIA INDEPENDENT CROSS-METHOD
      AGREEMENT: the Red Team's own three-method reconstruction (p in
      [0.022, 0.038]) and this Coordinator's own fourth, different method
      (a log-ratio delta-method Wald test computed directly from the four
      raw counts in raw-result.json, not from either report's prose:
      z=2.2444, p=0.0248) land in close agreement. Per this lane's own
      established discipline (check a cited reviewer's own underlying
      receipt, never just their prose, before enshrining a figure), this
      Coordinator computed its own number from the raw JSON rather than
      merely restating the Red Team's own reported range.
    - >-
      THE THIRD-CONSECUTIVE-BORDERLINE-RESULT AND MISSING-MULTIPLICITY-
      CORRECTION CONCERNS ARE ADOPTED IN FULL AND ARE WHY THIS DECISION
      STOPS SHORT OF "SUPPORTED": a single cell that has now produced three
      borderline results under scrutiny, with the direction of "more
      significant after correction" itself arising from a mid-course fix
      to the researcher's own analysis, is precisely the situation where a
      pre-registered, independent replication is required before the
      result can be trusted -- not a reason to treat the corrected number
      as the final word.
    - >-
      THE SCRUTINY-SEQUENCING PROCESS GAP IS ACCEPTED AS A GENUINE,
      SEPARATE FINDING FROM THE CONTENT QUESTION: this Coordinator
      authorized RUN-MONO-cb905d-2's compute and drafted its own
      interpretive addendum comparing "corrected vs. superseded" results
      before independent review touched the corrected construction. The
      Red Team is right that finding no flaw after the fact does not
      retroactively justify not checking before compute was spent,
      especially given the trivial cost (4.25s) made no efficiency argument
      for skipping a pre-compute check. ESTABLISHED DISCIPLINE GOING
      FORWARD (see EV-MONO-c0bf6d observations): dispatch independent
      review of a corrected construction before authorizing a re-run
      against it, unless compute cost genuinely forces the tradeoff.
    - >-
      THE BLINDNESS-PROCESS FINDING IS ACCEPTED: `blind_from` lists must
      include a run's own manifest.yaml whenever it restates the
      rederivation target in its own `result.metrics` block, not only the
      execution report and implementation code.

  next_action: >-
    HIGH PRIORITY: design and dispatch a PRE-REGISTERED REPLICATION at a
    SECOND, independent matched-(N,tau) cell (same-prime, to avoid the
    field/characteristic confound Part B's cross-prime cells carry),
    applying the CORRECTED test methodology (a proper homogeneity-of-ratios
    test using all four raw counts, e.g. the log-ratio delta method or an
    equivalent exact method, pre-registered BEFORE the run rather than
    substituted post-hoc as happened here) to BOTH curves' own transversal-
    vs-group-uniform ratio comparison. A second independent cell showing
    the same direction of effect would meaningfully upgrade this from
    "third borderline result on one cell" toward a real, replicated
    finding; a second cell showing no effect would support reading the
    current result as sampling noise inflated by post-hoc test selection
    across this cell's own repeated testing. SECONDARY: audit whether
    Part B's own 100 cross-prime cell measurements share the SAME
    any-collision-vs-pairs-per-tuple test-specification ambiguity this
    correction found in Part A -- not yet checked, flagged as an open
    question, not resolved by this decision.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The test-specification lesson (a per-tuple "any collision" proxy
      statistic is not interchangeable with the actual pairs-per-tuple
      rate metric under comparison, and a ratio-of-ratios test must
      propagate variance from BOTH the numerator and the reused denominator
      rather than treating either as a fixed constant) is valuable but is
      folded into CORR-20260904-d0205d and this decision's own rationale
      rather than promoted as a standalone technique: it is a specific
      statistical-hygiene application, not a novel category of lesson
      beyond ordinary careful-test-design practice already implicit in this
      program's evidence-and-reproducibility conventions.

  procedure_deviations:
    - >-
      SELF-DISCLOSED COORDINATOR PROCESS GAP (Red Team J3, adopted in
      full): RUN-MONO-cb905d-2 was authorized and its own interpretive
      addendum drafted before independent review touched the corrected
      sampler construction. See rationale and EV-MONO-c0bf6d observations
      for the established going-forward discipline.
    - >-
      BLINDNESS-PROCESS DEVIATION (Validator, disclosed by the Validator
      itself rather than hidden): the blind_from list on
      TASK-20260904-bb2f29 omitted RUN-MONO-cb905d-2/manifest.yaml, which
      already stated the rederivation target's exact values, compromising
      true blindness for the J2 recomputation even though the Validator's
      own numbers matched exactly. The exact match is read as internally
      consistent, not as independent confirmation that could have
      disagreed and did not.
    - >-
      This Coordinator additionally performed manual, out-of-band git
      object-store operations this cycle (via a pure-Python git
      implementation, since the `git` CLI itself was environmentally
      blocked) to archive prior records in this same chain, including one
      recovered near-miss where a local branch-ref write briefly clobbered
      a concurrent session's own local, unpushed commit. Disclosed in full
      to the user in-session; no data was lost (git objects are content-
      addressed and immutable), and this decision's own archival uses only
      the collision-safe direct-object-push method established after that
      incident. Recorded here for the ledger's own completeness, though it
      is an infrastructure/process incident rather than a research-content
      one.

  limitations:
    - >-
      This decision does not itself execute the named replication; it
      specifies it only.
    - >-
      Does not treat the corrected p~0.025-0.033 as a confirmed
      endomorphism-ring-linked finding; treats it as a genuine but fragile
      signal requiring replication, explicitly per the third-consecutive-
      borderline-result and missing-multiplicity-correction concerns.
    - >-
      Does not audit or reinterpret Part B's own 100-cell exploratory
      results for the same test-specification concern; flagged as an open
      secondary question in next_action, not resolved here.
    - >-
      Does not reopen or adjudicate H-MONO-45183a's own already-decided
      disposition, EXP-MONO-12ce1c's own review, or OBJ-6's own reference
      band measurement; cites all as precedent, not as records under
      re-examination here.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator and the experiment's own
      author. Both reviews explicitly disclose this; their independent
      convergence via disjoint joints and, for J4, a genuinely adversarial
      finding this Coordinator had not itself surfaced, is evidence against
      rubber-stamping, but the confound is not eliminated.

  reviewed_by: [validator, red-team]
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
