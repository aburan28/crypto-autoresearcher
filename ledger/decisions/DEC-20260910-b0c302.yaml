  approved_boundaries:
  - You are a fresh independent Validator. Own only the three exact review outputs. You are not alone; preserve
    all producer, historical and unrelated files. Coordinator alone owns Git, queues, claims, decisions, archives
    and status.
  - Read this handoff and plan first. Complete and immutably retain the blind derivation before inspecting producer/predecessor
    source, tests, reports, receipts or historical reviews. Hashing source bytes without presenting their contents
    is permitted for input integrity. Then review all declared inputs, verifying exact hashes.
  - Use review-adversarial in an independent native Codex session, requested model gpt-5.6-sol at literal xhigh.
    No fallback, degradation, serving probe or prohibited backend. Record actual runtime/model provenance honestly;
    unknown model verification remains unknown.
  - The entire approved cost_contract, baseline_selection, analysis_and_decision, timing and cost-related hard-validity
    interfaces govern. Do not review only the two reported corrections or substitute producer-test reruns for independent
    controls.
  - All computations use artificial serialized cost/context/timing data or hand-derived rational mathematics. No
    curve/map/fixture generation, calibration, key/signature/private material, RUN allocation, launch nonce, scientific
    runtime, Docker/cgroup, mount, privilege, pressure, external network, package installation or fixture child
    process.
  - Use standard Python and already installed PyYAML6.0.3/jsonschema4.26.0 only. Exact bound runtime/public-key
    files are metadata; do not execute their binaries or read private custody paths.
  - Before any checker, registry, compile or diagnostic invocation, reserve an exclusive temporary attempt, copy
    exact source and declare named controls and predicates. Preserve raw commands/streams/launch failures before
    parsing, checker PID, case starts/results, CPU/wall and sampled RSS. Use require_escalated for owned-process
    monitoring/checker commands. One checker,2GiB sampled RSS,nominal<=100ms cadence,60seconds per independent case
    and1800seconds aggregate as process watchdogs; no RLIMIT_AS or hard kernel limit claim.
  - At most512 independent fixed control executions including failures/reruns,each complete suite<=256; reserve
    a final complete suite. Fixed rows within one named control are not independent replications. Preserve interrupted
    cases and conservative accounting if exact counts are unavailable.
  - Decode and hash embedded producer source/stream payloads as data. Do not execute embedded producer controllers
    as review evidence. Confirm both historical source versions and correction boundaries,all785 producer case records,397final
    passes,PID/reaping/source/input/outer-call/CPU/wall/RSS bindings and metadata-only post-test edits. Report missing
    observations rather than inventing them.
  - Write the canonical review receipt once after all intended invocations terminate. Include the blind note,independent
    controls,all-attempt sources/logs and exact commands. Preserve primary and cleanup failures separately. No post-receipt
    hidden checks.
  - Report HOLDs/BREAKS/UNRESOLVED for the assigned complete component joint with exact scope and source evidence.
    No hypothesis status, whole-runtime acceptance, scientific result, measurement admission or historical retrovalidation.
    Return the three exact artifact hashes.
