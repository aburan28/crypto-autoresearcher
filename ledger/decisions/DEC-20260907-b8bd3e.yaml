coordinator_decision:
  id: DEC-20260907-b8bd3e
  context: >-
    Complete the pending full known-reference retrieval evaluation as an
    additive successor of EXP-CRYPTO-79832d and H-CRYPTO-7dd003. Existing
    schema-provenance decisions did not approve the experiment. Current
    offline sparse capability and a historical different-question benchmark
    are retained as context, not mistaken for this study's measured result.
  decision: approve
  target_ids: [H-CRYPTO-1d65d5, EXP-CRYPTO-3759c6, TASK-20260907-da9b67]
  decided_by: coordinator
  decided_at: '2026-09-07'
  task_id: TASK-20260907-b1a59b
  user_authorization: AGENTS.md standing authorization dated 2026-09-06 covers complete prospective designs and governed execution. No renewed user selection, funding veto or protocol-confirmation request is required.
  rationale:
    - This pending control is ranked above doing nothing because an exhaustive known-reference audit can distinguish missing query fidelity, label selection, metadata, return-budget and ranking effects before broader retrieval claims are made.
    - Preserve the entire pinned KN-LIT/proposal corpus, all direct-reference candidates, independent labels, recorded-term replay, at least 50 judged relevant candidate pairs and all fidelity/metadata/failure strata; do not replace the study with a synthetic benchmark.
    - Keep full-body all-match recovery, then match title/abstract view and K20 for a signed sparse-minus-Boolean comparison that can be negative. Existing in-memory sparse source/config is frozen without production index writes or label-based tuning.
    - Retain three exact null seeds, 20 uniform replacement draws per source-reference proposal per seed, accidental relevant/duplicate draws, pair-matched micro weighting and exact set-size null expectation. The factor-three AND 0.20 margin remains descriptive rather than proof of chance.
    - Preserve the original study-level threshold of at least 50 judged relevant candidate pairs. The narrower exact/uncontaminated/representable comparison has separate N/P and is NA if empty; query incompleteness is not silently recoded as a miss or a whole-corpus payload defect.
    - A fixed 2000-resample paired proposal-cluster sensitivity analysis replaces unsupported pair-iid uncertainty claims, with explicit small-cluster/undefined branches and no general-population interval claim.
    - Resolve query execution through an allowlisted program-specific parser and immutable blob views. Unsupported shell/flags/dialects are unreplayable. Actual labels, corpus manifests, queries and runtime hashes remain future admission outputs.
    - The exact scientific plan is three seed invocations and a deterministic summary; the old eight-run/two-hour figures were estimates. Memory/process protection remains binding and a wall watchdog checkpoints rather than exhausting research.
  approval_scope:
    contract: EXP-CRYPTO-3759c6 version 1 as the complete prospective successor.
    immediate_task: TASK-20260907-da9b67 prepares exactly ten source/schema/template/report files with maximum_runs zero, one worker and 8 GiB protection.
    scientific_execution_authorized: false
    deferred_work: Corpus census/extraction, query compilation on actual proposals, null draws, independent labels/adjudication, controls, index construction, recall and bootstrap execution need the genuinely claimed subsequent scientific/admission plan and archive envelopes.
    independent_review: Label authors and adjudicator must be genuinely independent sessions with declared access. Before any claim-changing evidence review, commit a review plan specifying priors, joints, blindness, independent count re-derivation and known-false controls. No such review is claimed here.
  prospective_supersession:
    original_hypothesis: H-CRYPTO-7dd003
    original_experiment: EXP-CRYPTO-79832d
    successor_hypothesis: H-CRYPTO-1d65d5
    successor_experiment: EXP-CRYPTO-3759c6
    historical_effective_hypothesis: ledger/corrections/schema-supersessions/20260905/ledger__hypotheses__H-CRYPTO-7dd003.v2.yaml
    boundary: Original H/EXP, existing effective schema correction, registry and DEC-20260905-cfdc8d/DEC-20260905-487021 remain unchanged. This is scientific protocol lineage through a new decision, not schema-registry replacement.
    status_meaning: New H specified denotes a testable design; no supported/rejected/closed hypothesis, result, novelty or goal status changes.
