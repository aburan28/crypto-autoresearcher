coordinator_decision:
  id: DEC-20260813-5cef9c
  context: >-
    Close GOAL-QRE-001 BATCH-973b49, the arithmetic-layer count. One producer
    (TASK-20260813-c99166), one snapshot (TASK-20260813-884e20, commit
    d931391c2, 17 hashes), and two independent reviews in fresh sessions
    (TASK-20260813-13e948 Validator, verdict passed with five defects;
    TASK-20260813-312e93 Red Team, two of three named targets sustained). The
    batch produced a sound arithmetic-layer package and simultaneously exposed a
    false premise in this goal's own framing.
  decision: refine
  target_ids:
    - GOAL-QRE-001
    - BATCH-973b49
    - EV-QRE-45dfe1
    - CORR-20260813-1a06db
  rationale:
    - >-
      COMPLETION CRITERION 2 IS SUBSTANTIALLY MET AT TOY TIER. Independent
      arithmetic-layer counts exist, were reproduced from scratch by the
      Validator with zero differing leaves, and are validated by simulation with
      a negative control proving the validation can fail. Modexp:
      40n^3 + 50n^2 Toffoli, zero residuals at 17 widths including 6 holdouts.
      Point addition: exact in (n, b, w), zero residuals at 32 pairs.
    - >-
      THE BATCH'S MOST TRANSFERABLE RESULT IS A NEGATIVE CONTROL. Mutating the
      ripple adder's loop order left the gate tally bit-identical while
      simulation caught the defect 16 of 16 times. Tally equality alone is not a
      correctness check. That bounds what the counted-equals-simulated
      correspondence establishes, and it generalises past this goal.
    - >-
      A FALSE PREMISE SHAPED THE BATCH AND IS CORRECTED, NOT REPAIRED QUIETLY.
      KN-LIT-099 was filed before this goal existed and KN-TECH-037 reads its
      table. CORR-20260813-1a06db records the error, its propagation into five
      handoffs, and that the Coordinator rather than the producer owns it. The
      corpus was not searched before dispatch, which AGENTS.md "Knowledge
      retrieval policy" requires.
    - >-
      COMPLETION CRITERION 4 IS NOT REACHABLE FROM THIS ARITHMETIC LAYER, AND
      THE FAILURE IS DIRECTIONAL RATHER THAN NUMERICAL. The Red Team reports the
      constructed point addition is far from the filed published closed form
      with a gap growing in n, that the resulting RSA-versus-ECDLP ratio has the
      OPPOSITE SIGN to the one KN-TECH-037 already records, and that
      counts.json omits peak_qubits from the 256-bit block while including it
      for RSA -- the unfavourable axis being the missing one. A ratio of two
      asymmetrically loose upper bounds bounds nothing. THE SPECIFIC MULTIPLIERS
      AND ELASTICITIES IN THAT REPORT ARE NOT ADOPTED AS MEASUREMENTS: the Red
      Team states its six runs are exploratory, are not evidence, and must be
      re-run under a dispatched task before citation. What is adopted is the
      structural conclusion, which does not depend on the exact figures.
    - >-
      CRITERION 1 NEEDS A WIRING THE GOAL NEVER DECLARED. Reproducing a
      published total requires consuming that paper's own arithmetic input; this
      package's counts belong to criterion 2. The goal's objective sentence
      reads the other way. Criterion 1's "declared tolerance" is also declared
      nowhere. Both are repaired in the next action rather than left implicit.
    - >-
      THE LINEARITY PREMISE IS PARTLY WRONG AND THAT CHANGES THE PRIMARY
      DELIVERABLE. The premise that every headline number is linear in these
      counts holds for the wall-clock axis and fails for the physical-qubit
      axis, where the dependence runs through code distance and is a staircase
      rather than a slope. Criterion 3's declared method -- one-at-a-time
      partial derivatives -- is therefore the wrong instrument and must report
      breakpoints and logical width. The underlying surface-code form is
      ASSUMED BY THE RED TEAM, not filed, and must be rechecked against whatever
      model batch 2 files.
    - >-
      NO PROMOTION TOWARD supported IS REQUESTED. No asymptotic-complexity claim
      is made, so the four promotion gates are not engaged. Claim tier is toy
      and the evidence record says why.
  evidence_refs:
    - EV-QRE-45dfe1
    - CORR-20260813-1a06db
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-13e948/validation_report.yaml
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-312e93/red_team_report.yaml
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/archives/TASK-20260813-884e20/snapshot-receipt.json
  limitations:
    - >-
      Toy tier. Simulation-validated widths are small; the closed forms are
      enumerations of the same construction and the n = 2048 / n = 256 figures
      are arithmetic on those forms, not measurements.
    - >-
      Every number is scoped to the frozen convention and inherits the Fermat
      inversion upper bound on the point-addition side.
    - >-
      D-V5 (moderate) stands: execution_report.yaml lacks the required
      inference/model-provenance block. The artifact is hash-bound, so the
      repair is a superseding artifact and never an edit.
    - >-
      The pre-registration freeze order cannot be verified from git. This is a
      process defect in how the batch was sequenced, owned by the Coordinator,
      and it is fixed for batch 2 by committing the pre-registration before the
      producer runs.
    - >-
      Nothing here is a statement about hardware, a schedule, an arrival
      probability, or migration. The prohibition binds every downstream use.
  next_actions:
    - >-
      ONE ACTION. Repair the goal's framing in a Coordinator act BEFORE batch-2
      acquisition is written: (a) separate criterion 1's arithmetic input (the
      paper's own count) from criterion 2's (this package's), (b) declare the
      missing per-axis, per-layer tolerance criterion 1 requires, (c) reshape
      criterion 3's sensitivity table around logical width and breakpoints
      rather than one-at-a-time partial derivatives, and (d) state that
      criterion 4 is blocked pending a tighter inverter. Then dispatch a single
      producer task deriving a Euclid/Kaliski-type reversible inverter under the
      SAME frozen convention and re-counting with the existing builder, which is
      what unblocks criterion 4 and removes the instrument-induced Hamming-weight
      sensitivity. Acquisition may run in parallel and starts from the
      already-filed KN-LIT-099.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      PROMOTION IS WARRANTED AND IS OWED, WHICH IS WHY IT IS NAMED HERE RATHER
      THAN OMITTED. The negative-control result -- that gate-tally equality
      between a counter and a simulator can hold on a provably broken circuit,
      so tally equality is not a correctness check -- is durable, reusable
      beyond this goal, and independently demonstrated. It is not promoted in
      this archive because knowledge/ is outside this archive task's declared
      write_scope (ledger/evidence, ledger/decisions, ledger/goals only), and
      expanding an archive's scope silently is the defect the dispatch verifier
      exists to catch. It is scheduled as the first act of the next batch via
      /curate-knowledge, citing EV-QRE-45dfe1 and the Validator report.
  decided_by: coordinator
  decided_at: '2026-08-13'
