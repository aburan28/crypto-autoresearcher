coordinator_decision:
  id: DEC-20260831-7b44fe
  context: >-
    This Coordinator decision composes the independent Validator (J1,
    `passed`/`holds_with_finding`) and Red Team (J2,
    `holds_..._but_the_records_own_two_headline_framings...`) reviews of
    EXP-MONO-64aaa4's execution: a test of whether H-MONO-45183a Part B's
    m=4 collision-rate closed form (6(tau-1)/N) holds identically for a
    CM and an ordinary curve at a matched (N,tau). Both reviewers, via
    completely disjoint methods, converged on the same substantive
    disposition (INCONCLUSIVE, not corroborating) and the same concrete
    next action, while each surfacing distinct, complementary findings.
    This decision adopts both in full.
  decision: revise
  decision_label: >-
    inconclusive_single_matched_pair_borderline_two_sided_test_undisclosed_narrow_search_scope_missing_discriminating_control_h1_corrected_next_action_named
  target_ids:
    - H-MONO-1d50ac
    - H-MONO-45183a
    - EXP-MONO-64aaa4
    - RQ-MONO-001
    - EV-MONO-6c49bd
    - experiments/EXP-MONO-12ce1c/reviews/red-team/red-team-report.yaml

  hypothesis_status_before: proposed
  hypothesis_status_after: proposed_instrument_underexplored_single_cell_inconclusive
  hypothesis_status_after_note: >-
    NOT ADVANCED TO SUPPORTED, SCOPED, OR WEAKENED. Both reviewers
    independently establish that this run's own design examined only 1
    of at least 101 available matched-(N,tau) cells in its own declared
    search range (an undisclosed search-scope choice, not a fact about
    scarcity), that the pre-registered two-sided comparison sits just
    outside conventional significance while every alternative standard
    framing of the identical data sits just inside it, and that the one
    control this run applied was already known, before this contract was
    written, to be tautological for this construction, while the
    genuinely discriminating control this lane's own prior review
    identified (EXP-MONO-12ce1c OBJ-6, transversal-vs-group-uniform
    sampling) was never applied. This is a design/coverage limitation of
    the FIRST test of this hypothesis, not a finding about the closed
    form's truth in either direction. Status reflects this precisely:
    still open, with a specific, cheap, well-identified reason it is not
    yet resolved.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: paused
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-1d50ac
        from: proposed
        to: proposed_instrument_underexplored_single_cell_inconclusive
    experiment_status_changes:
      - experiment_id: EXP-MONO-64aaa4
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped exactly to EXP-MONO-64aaa4's tested regime: one matched-(N,tau)
    pair (p=617, N=580, tau=4), m=4 exactly, transversal factor-base
    sampling. No ECDLP, relation-rate, exponent, or cryptographic-scale
    claim. Does not close KN-OPEN-009.

  rationale:
    - >-
      BOTH REVIEWERS INDEPENDENTLY RECONFIRMED EVERY CONSTRUCTION AND
      ARITHMETIC CLAIM VIA WHOLLY DISJOINT METHODS -- a from-scratch
      brute-force reconstruction plus exact-Fraction SE arithmetic and a
      power/Monte-Carlo analysis (Validator), and a fully blind, zero-
      repository-code reimplementation plus alternative statistical
      framings (Red Team). No construction error, fabrication, or
      execution-fidelity gap was found by either.
    - >-
      THE "EXHAUSTIVE SEARCH" AND "NOT SIGNIFICANT" HEADLINES ARE BOTH
      ADOPTED AS MATERIALLY INCOMPLETE, PER BOTH REVIEWERS' CONVERGENT,
      INDEPENDENT FINDINGS. The Stage-0 search covered only same-prime
      coincidences, leaving >=100 already-constructed cross-prime
      matched-(N,tau) cells (several far cheaper than the one tested)
      unexamined and undisclosed as a scoping choice. The pre-registered
      two-sided Fisher-exact test (p=0.066) is correctly reported and
      correctly NOT overridden by a post-hoc one-sided reading -- but
      every standard alternative framing of the identical data (one-sided
      Fisher, two-proportion z-test, a pair-count variant) lands just
      inside the conventional 0.05 threshold (p in [0.029,0.033]),
      information the "not significant, no large deviation" framing does
      not convey.
    - >-
      THIS COORDINATOR'S OWN DESIGN-TIME POWER CLAIM IS ACCEPTED AS WRONG
      FOR THE ACTUAL CELL FOUND, PER THE VALIDATOR'S INDEPENDENT
      RECOMPUTATION: the contract's generic pre-registration ("powered to
      detect ~2x or more") was never revisited against the specific
      (N,tau) cell Stage 0 found, where actual power is ~92-95% at 20%
      and ~42-47% at the observed ~11% difference -- moderate, not
      negligible. p=0.066 is therefore a genuinely informative borderline
      result, not a vacuous underpowered one.
    - >-
      THE DOUBLE-COUNTING RISK THE VALIDATOR IDENTIFIED IS ADOPTED: Stage
      1's CM-curve deviation (independently corrected to 2.427 SE) and
      Stage 2's between-curve comparison (p=0.066) are not independent
      lines of evidence -- both derive from the same four raw counts.
      This decision treats Stage 2's comparison as the primary statistic
      and Stage 1's per-curve figures as diagnostic context only, per
      both reviewers' own recommendation.
    - >-
      THE MOST CONSEQUENTIAL FINDING IS ACCEPTED AS A GENUINE PROCESS
      GAP IN THIS COORDINATOR'S OWN WORK: converting IDEA-20260831-d29a71
      into H-MONO-1d50ac, this Coordinator cited H-MONO-45183a's own
      H1/HEUR-COIN-1 text unmodified without checking that hypothesis's
      OWN status_note for an already-recorded correction
      (EXP-MONO-12ce1c's own Red Team OBJ-6, which both this run's
      reviewers independently rediscovered and confirmed: the "tautological
      dual-convention control" is not new, and the genuinely discriminating
      axis -- transversal vs. group-uniform sampling, a real ~2x effect --
      was never applied to either matched curve here). H-MONO-1d50ac's H1
      is corrected in place (additive note, original retained) as part of
      this decision. THIS ESTABLISHES A NEW PERSONAL DISCIPLINE: when
      converting a proposal into a hypothesis that reuses another
      hypothesis's own structural ingredients or heuristics, check that
      source hypothesis's OWN status_note/superseded content for
      corrections, not only its main derivation body.
    - >-
      TWO MINOR, GENUINELY NEW DOCUMENTATION DEFECTS ARE ACCEPTED,
      NEITHER CHANGING ANY MEASURED VALUE: the 2.424-vs-2.427-SE
      arithmetic discrepancy (Validator), and implementation.md's own
      role-string worked example not matching the actual code
      (Red Team, "cm1728" vs the code's actual "cmj1728"). Both are
      inconsequential to the archived numbers, which both reviewers
      independently reproduced correctly from the raw data regardless.

  next_action: >-
    HIGH PRIORITY, CHEAP, NAMED IDENTICALLY BY BOTH REVIEWERS VIA
    INDEPENDENT REASONING: (1) extend Stage 1-2's measurement to the
    already-constructed >=100 cross-prime matched-(N,tau) cells already
    sitting in EXP-MONO-64aaa4's own archived stage0_transcript.json (no
    new curve construction needed; ~4s of Stage-1/2 compute per cell
    observed in this run, so the full extension is on the order of
    minutes); report the resulting distribution of within-curve residuals
    and pairwise comparison p-values across cells, converting this
    record's n=1 point estimate into a genuine multi-cell test and
    supplying the missing null-object baseline for how often a single
    cell lands this close to significance by chance alone. (2) Apply
    EXP-MONO-12ce1c OBJ-6's own already-validated transversal-vs-group-
    uniform discriminating control to both matched curves at p=617 (and
    to the cross-prime cells, if pursued), testing whether the
    already-known ~2x transversal-sampling artifact itself differs in
    magnitude between CM and ordinary curves -- the actual axis this
    hypothesis's completeness question turns on, distinct from the
    already-tautological sign-convention axis this run tested. Both
    require no new curve construction and are affordable well within a
    single new contract's toy-scale budget.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Both reviewers' core findings (check a search's own operative
      definition against the space its motivating argument actually
      supports before reporting "exhaustive"; recompute a design's power
      claim against the specific cell a search finds, not only the
      generic case; check a cited heuristic's SOURCE hypothesis for its
      own superseding status_note before reuse) are valuable but are
      folded directly into this decision's rationale, H-MONO-1d50ac's own
      corrected H1, and this Coordinator's own stated new discipline,
      rather than promoted as a standalone knowledge-technique entry: they
      are specific applications of this lane's own existing disclosure
      culture (KN-TECH-a810e4's "numeric floor vs. intent" pattern already
      covers the search-scope and power-check gaps at a general level) to
      this one record, not a novel category of lesson.

  procedure_deviations:
    - >-
      None from the review_plan itself: both reviews dispatched
      concurrently, post-snapshot, with disjoint joints (Validator =
      J1-correctness, Red Team = J2-adversarial), both attest
      read_sibling_reports: false (each disclosing they observed only an
      empty or nonexistent sibling directory), and both independently
      reconfirmed every arithmetic claim from raw data/source before
      forming their own headline-framing critiques.
    - >-
      SELF-DISCLOSED COORDINATOR PROCESS GAP, NOT AN EXTERNAL INCIDENT:
      this Coordinator's own conversion of IDEA-20260831-d29a71 into
      H-MONO-1d50ac inherited a stale heuristic characterization from
      H-MONO-45183a without checking that record's own status_note for a
      relevant correction. Disclosed and corrected in H-MONO-1d50ac
      itself (additive note) rather than in a separate CORR record, since
      the affected content is this Coordinator's own not-yet-finalized
      hypothesis text, not an already-decided, closed evidentiary claim.

  limitations:
    - >-
      This decision does not itself execute the named next action; it
      specifies it only.
    - >-
      Does not adopt a one-sided statistical test in place of the
      pre-registered two-sided commitment; the one-sided/z-test figures
      remain informative context, never a substitute official conclusion.
    - >-
      Does not characterize the cross-prime matched cells as evidence of
      any kind -- they are an identified, cheap opportunity, not yet
      measured.
    - >-
      Model-correlation confound: both reviewers this round resolved to
      claude-sonnet-5, matching this Coordinator and the experiment's own
      author. Both reviews explicitly disclose this and their independent
      convergence via disjoint methods as evidence against rubber-
      stamping; this Coordinator concurs but notes the confound is not
      eliminated.
    - >-
      This decision does not reopen or adjudicate H-MONO-45183a's own
      already-decided disposition or EXP-MONO-12ce1c's own review; it
      cites OBJ-6 as precedent, not as a record under re-examination here.

  reviewed_by: [validator-mono-64aaa4, red-team-mono-64aaa4]
  decided_by: coordinator
  decided_at: '2026-08-31'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
