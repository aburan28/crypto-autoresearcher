coordinator_decision:
  id: DEC-20260916-441cd5
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: SEMBIN
  decision_type: batch_opening
  decided_by: coordinator
  target_ids:
    - GOAL-SEMBIN-fcb7a2
    - BATCH-e0a0c1
    - EXP-SEMBIN-4fa22c
    - REVIEW-SEMBIN-20260916-e0a0c1
  title: >-
    Open BATCH-e0a0c1 as a SECOND, zero-compute lane on GOAL-SEMBIN-fcb7a2: read whether the
    lemma the campaign's central inference depends on is actually proved in the source its
    consumer cites, with the Coordinator's prior recorded before either reader runs

  decision: >-
    OPEN BATCH-e0a0c1 as a second, disjoint lane on GOAL-SEMBIN-fcb7a2, concurrent with
    BATCH-cbb416, and dispatch two INDEPENDENT, MUTUALLY BLIND source reads: one of Nagao
    2013/549 for whether it contains and proves the lemma 2015/984 cites as its Lemma 3 and
    whether that lemma supports Lemma 4 in the INSIDE form the campaign depends on, and one
    of Semaev 2015/310 for what its argument delivers as against what its statement claims.
    Record REVIEW-SEMBIN-20260916-e0a0c1 in this same opening, with six numbered Coordinator
    predictions, their confidences and their falsification conditions, and hold both readers
    blind from it. This decision moves no completion criterion, no hypothesis status and no
    experiment status; it takes no measurement and it re-approves nothing.

  why_now:
    ranking: >-
      GOAL-SEMBIN-fcb7a2 is a declared ECC goal (`tools/ecc_priority.py --classify`) and is
      considered before non-ECC work at every selection point. Its head ranks this read as
      item (2) and says of it, in terms, that it "needs no compute and competes with the batch
      for nothing, so it may run concurrently in a separate lane rather than waiting behind
      it". BATCH-cbb416 holds item (3) and is already dispatched; this is the next ranked
      action under the goal and it does not queue behind the first.
    why_it_is_a_separate_lane_rather_than_two_more_cards: >-
      BATCH-cbb416 declares max_concurrent 1 because its executing producer is a
      degree-by-degree GF(2) rank computation with a 10 GB resident-set watchdog, and
      BATCH-51e2aa in the sibling campaign recorded a Macaulay2 phase driving the load average
      to 4.55 and had to split a review joint out to keep a timing clean. Two readers of frozen
      PDF text cost that measurement nothing, but putting them in that queue would either
      stack them behind its executor for no reason or force its concurrency up and put readers
      in the same slot pool as the measurement. A separate lane is the cheap answer and
      docs/concurrent-goal-lanes.md is the mechanism.
    why_it_is_not_make_work: >-
      Stated because an unlimited ECC budget is the strongest invitation to make-work this
      program has, and because "read two papers" is exactly what make-work looks like. The
      concrete ground: EXP-SEMBIN-4fa22c is approved and about to spend compute measuring the
      FAKE first fall degree d'_F, and EVERY route from that quantity to any statement of
      Nagao's runs through 2015/984's Lemma 4 (d_F <= d'_F). That paper ASSERTS Lemma 4 without
      proof, derives it from its Lemma 3, attributes Lemma 3 to [11] = Nagao 2013/549, and
      declines to reproduce the proof: "Proof of this Lemma is complicated and not
      constructive" (inputs/NAGAO-2015-984/paper_fulltext.md :507). The program has separately
      verified by exhaustive two-polynomial search over F_2 that Lemma 4's LITERAL form, with
      the field equations OUTSIDE the fake system, is FALSE. So the campaign is about to
      measure a quantity whose only bridge to its target is a lemma with no proof in the
      consuming paper, no reader in this program, and one form already known false. Learning
      that before the compute is strictly cheaper than after, and the run's own contract
      cannot discover it because the contract consumes Lemma 4 rather than testing it.

  what_the_two_reads_are:
    read_1:
      task: TASK-20260916-9da6e0
      source: inputs/NAGAO-2013-549 (frozen 2026-09-13, sha256 sidecars verify)
      joints: J-1 (which statement), J-2 (is it proved), J-3 (does it give Lemma 4's inside form)
      the_trap_this_read_is_built_around: >-
        2013/549 HAS ITS OWN LEMMA 3, at paper_fulltext.md :1081, and it is an unrelated
        weight-degree statement about monomials. A reader who greps for "Lemma 3" in the
        upstream paper reports on the wrong statement and reports it confidently. The card
        therefore requires matching on CONTENT rather than number, and the Coordinator's
        prediction about which statement is the real match is in the read plan the reader
        cannot see.
    read_2:
      task: TASK-20260916-64a93b
      source: inputs/SEMAEV-2015-310 (frozen 2026-09-13)
      joints: J-4 (statement versus argument)
      why_it_runs_in_parallel: >-
        Its joint is disjoint from read 1's and neither answer is an input to the other. Running
        them in parallel and mutually blind buys two independent sessions for the cost of one
        wall-clock window; running them in series would buy a dependency that does not exist.

  the_prior_is_recorded_first:
    where: coordination/review/sembin-20260916-e0a0c1/read-plan.yaml
    why: >-
      This campaign has a decisive precedent. On 2026-09-16 a blind read of Nagao 2015/984's
      Proposition 5 OVERTURNED the Coordinator's reading of it, and the goal's objective changed
      as a result (CORR-20260916-96f47d, DEC-20260916-88ac73). That was informative precisely
      because the Coordinator's expectation was committed first and the reader could not see it.
      "The reader agreed with us" and "the reader agreed with what we had already written down"
      are different findings and only a pre-recorded prior separates them.
    six_predictions_with_confidences: >-
      P-1 (high): the cited lemma is 2013/549's LEMMA 2, not its Lemma 3. P-2 (moderate): the
      numbering mismatch is explained by the served PDF being the last of two revisions, whose
      own note records a false lemma and a deleted section — and the first revision is NOT
      retrievable here, which the Coordinator expects the reader to report as a limit. P-3
      (moderate): 2015/984 dropped no hypothesis; `local polynomial` names the ambient ring.
      P-4 (low-to-moderate): the upstream lemma does license Lemma 4's INSIDE form and not the
      outside one. P-5 (low): Semaev's statement outruns his argument on quantifier order. P-6
      (high): at least one read will report "cannot determine" on a formula that matters,
      because the 2013/549 extraction is materially worse than the 2015/984 one.
    one_prediction_is_recorded_because_it_was_wrong: >-
      P-3 is in the plan specifically because the Coordinator's FIRST reading was its opposite:
      that 2015/984 had silently dropped a locality hypothesis when restating the lemma, which
      would have been a serious finding. Reading the definition at 2013/549 :180 refuted that
      within minutes. It is recorded because a prior listing only the beliefs that survived the
      Coordinator's own checking overstates how well calibrated the Coordinator was, and the
      ruling has to score calibration honestly.
    where_the_coordinator_wants_to_lose: >-
      P-4, explicitly. A reader who finds the upstream lemma unproved, or insufficient for the
      inside form, produces the most valuable outcome available in this lane, because the
      contract records Lemma 4 as a DEPENDENCY and would have to record it as a weaker one.
      Confirmation leaves the campaign exactly where it stands.

  blindness_and_its_declared_limit: >-
    Neither reader may read the read plan, this decision, the opening report, the checkpoint, or
    its sibling's task directory. The limit is declared rather than hidden: the J-1 answer is a
    LEMMA NUMBER IN A PUBLIC PAPER, derivable in minutes by any reader who greps the source, so
    blindness buys real independence on J-2, J-3 and J-4 and much less on J-1. This campaign has
    already paid once for a protective document that quoted the value it protected
    (CORR-20260916-292e53); the answer here is to state what the blind is worth instead of
    claiming a clean one.

  what_this_decision_does_not_do:
    - >-
      DOES NOT re-approve EXP-SEMBIN-4fa22c or H-SEMBIN-a7e721, and nothing in this lane may
      edit either. A change is an additive amendment under a new id.
    - >-
      DOES NOT touch BATCH-cbb416, its queue, its claims, its review plan or its paths. The two
      lanes share only the goal head, which each edits additively inside its own archive.
    - >-
      DOES NOT move any completion criterion. All four of this goal's criteria require a
      committed decision on run or read evidence, and a reader's report is not a decision; the
      ruling that composes them is a separate card with its own ledger archive. Criterion 4
      remains the only one met, by DEC-20260913-8d19e5.
    - >-
      DOES NOT change DC-1. Neither answer can make a Boolean-ring instrument able to refute
      Proposition 5, and no result of this lane may be presented as refuting it.
    - >-
      DOES NOT pre-authorize a review tier. If a reader finds the upstream lemma unproved or
      insufficient, the resulting claim — that a published subexponential ECDLP bound rests on
      an unsupported lemma — is a contradiction of established evidence under core rule 12 and
      needs `review-breakthrough` at max, which is UNDEGRADABLE and cannot be served in this
      environment. The ruling then records the finding at its narrowest supported scope and
      leaves the CLAIM un-promoted while the campaign stays active. That is a limit on the
      claim, never on the campaign, and never a reason to soften a finding so that a servable
      tier will carry it.

  binding_modes_chosen_per_archive: >-
    The opening archive binds `content_at_commit` and the reader archive binds `content_first`,
    deliberately. The control plane contains the goal head and the queue, which legitimately
    change after their archive — binding those at HEAD reports every later rerank as corruption,
    which is the failure CORR-20260915-654160 records. A reader's filed report never legitimately
    changes, and content_first is the mode that catches an in-place edit to one; the sibling
    campaign has suffered exactly that twice (CORR-20260916-5166fe, CORR-20260916-2e9bc3). Choose
    the mode by asking what the archive protects.

  inference_declared_up_front: >-
    Every card sets `fallback_allowed: true` with a stated reason rather than inheriting `false`
    from AGENTS.md's template, which is right for the contract and wrong for this machine — it
    holds no API credentials for any adapter backend. `model_verified` is false throughout and is
    recorded as NOT OBTAINED rather than as met, because `doctor --probe` has no usable backend
    here. Both reader cards additionally set `independent_session_required: true`, which
    review-adversarial requires and which this round needs for its own reason.

  ranking_of_what_is_not_in_this_lane:
    - candidate: Fetching the FIRST revision of Nagao 2013/549 to check the lemma numbering
      not_ranked_because: >-
        Only the last of two revisions is served by the source, it is what the program froze, and
        this environment cannot retrieve an unserved revision. The readers are told to report the
        limit rather than reason about a version they cannot open. Revisit only if a claim comes
        to depend on the numbering rather than on the content.
    - candidate: A red-team pass on the two reads
      not_ranked_because: >-
        The reads ARE adversarial sessions on disjoint joints, each carrying a proves-too-much
        control, and each blind from the Coordinator's expectation. A red team over them would
        attack reports rather than the sources. Revisit if the ruling has to compose a
        disagreement between the two readers.
    - candidate: Re-reading Nagao 2015/984's Lemma 6 and Proposition 6 for how Lemma 4 propagates
      not_ranked_because: >-
        CORR-20260916-96f47d already traced that path — Lemma 6's statement is in d_F and its
        proof bounds d'_F and converts by Lemma 4 — so the propagation is recorded. What is not
        recorded is whether Lemma 4 itself holds, which is this lane. Revisit once J-3 has an
        answer, because a weakened Lemma 4 changes what Proposition 6's exponent rests on.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision opens a lane and records a prior. It establishes no mathematical result and
      no reusable technique.
    revisit_if: >-
      Either read establishes something about the upstream lemma's status — proved, unproved, or
      insufficient for the form its consumer needs. That is a fact about the literature this
      program would want in knowledge/literature/ regardless of what EXP-SEMBIN-4fa22c measures,
      and the reader's report is where it would come from.

  citations:
    - id: EXP-SEMBIN-4fa22c
      provenance: internal
      what: the contract whose recorded Lemma 4 dependency this lane reads the provenance of
      verified_by: coordinator, this session, which read the contract before opening BATCH-cbb416
    - id: CORR-20260916-96f47d
      provenance: internal
      what: >-
        the precedent — a blind read of this paper family overturned the Coordinator's reading,
        which is why the prior for this round is committed before either reader is dispatched
      verified_by: coordinator, this session, which authored it
    - id: CORR-20260916-292e53
      provenance: internal
      what: >-
        the leaked protective document, which is why this round's blind states what it is worth
        instead of claiming a clean one
      verified_by: coordinator, this session, which authored it
    - id: CORR-20260915-654160
      provenance: internal
      what: the content_first-at-HEAD defect, which is why the two archives here bind differently
      verified_by: coordinator, this session
    - ref: inputs/NAGAO-2013-549/paper_fulltext.md
      provenance: retrieved
      what: >-
        the upstream source. The Coordinator opened it to form the prior: the numbered-statement
        enumeration, Lemma 2 at :685-708 and the opening of its proof, and the definition of
        `local polynomial` at :180-190. It did NOT read Sections 3 or 4, and the extraction is
        known to mangle the Section 2-3 displays, so the Coordinator's reading is itself
        unreliable and is one of the things a reader may overturn.
      verified_by: coordinator, this session, 2026-09-16
    - ref: inputs/NAGAO-2015-984/paper_fulltext.md
      provenance: retrieved
      what: >-
        the consuming paper. Lemma 3 as quoted at :461-507 with its Example 1 and the sentence
        declining the proof at :507, and Lemma 4 at :510-515.
      verified_by: coordinator, this session, 2026-09-16
    - ref: inputs/SEMAEV-2015-310/paper_fulltext.md
      provenance: internal
      what: >-
        frozen and hash-verified, and NOT READ by the Coordinator beyond confirming the file
        exists and its sha256 matches. The P-5 prediction about it is close to a guess about a
        genre of gap and is recorded at that strength.
      verified_by: >-
        nobody in this program has read this source for the purpose of J-4; that is the read
        being dispatched
