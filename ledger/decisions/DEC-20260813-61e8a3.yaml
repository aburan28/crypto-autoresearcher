coordinator_decision:
  id: DEC-20260813-61e8a3
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  batch_id: BATCH-009b1b
  recorded_at: '2026-08-14'
  recorded_by_task: TASK-20260813-8a872d

  decision: revise

  decision_type_rationale: >-
    `revise` because the independent Validator returned REVISE on a run set
    whose two blocking defects are in the CONTRACT AND ITS APPROVAL, not in the
    execution, and only a Coordinator act on the record can cure them. NOT
    `support`: two admissible toy runs against a defective standard do not
    support the three-leg statement of H-ISOU-c5bfea and do not discharge
    obstruction 4 of EV-ECDLP-b3e847. NOT `weaken`: nothing measured here
    points against the hypothesis; the one observable that could have
    (falsification criterion F4 on the contract-literal basis) does not exceed
    its own null-object control. NOT `reject_scoped`: that is forbidden on a
    single unreplicated empirical-only run set by this task's own archive card
    and would be wrong on the merits besides. NOT `replicate` alone: replicating
    a defective contract reproduces the defect. NOT `pause`: the direction is
    not being deprioritized, a repaired contract is authored by this same
    decision. NOT `inconclusive` as a whole: the Q2 mechanism leg IS resolved
    within its scope, and saying otherwise would understate a real measurement.

  context: >-
    BATCH-009b1b executed the approved frozen contract EXP-ISOU-2ac81f -- a
    complete-class ECDLP cost census on a P-256-SHAPED toy curve -- in four runs
    at two prime sizes, then had it independently reviewed by the Validator
    under TASK-20260813-e183e6 in a separate session at xhigh effort. The review
    bound to the immutable snapshot commit 15de2d901, verified all 47 declared
    artifact hashes with zero mismatches, re-derived every summary statistic
    from raw records over 1652 members and 27008 solve records with zero
    mismatches, independently recomputed the class number by form counting, and
    independently re-verified all 1652 member certificates with third
    arithmetic. Its verdict is REVISE (terminal status `incomplete`): nothing is
    fabricated, every required artifact is present, every claimed solve
    verifies -- and two named preconditions of the frozen contract are
    unsatisfied as written, one of which gates a MANDATORY STOP. This decision
    closes BATCH-009b1b on that verdict, records the narrowest evidence the
    verdict admits as EV-ISOU-7c6405, and authorizes the superseding records
    that cure the contract defects.

  target_ids:
    - EXP-ISOU-2ac81f
    - H-ISOU-c5bfea
    - H-ISOU-5748b6
    - EXP-ISOU-bfba73
    - EV-ISOU-7c6405
    - BATCH-009b1b
    - TASK-20260813-8a872d

  evidence_refs:
    - EV-ISOU-7c6405
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/reviews/TASK-20260813-e183e6/review-report.yaml
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/archives/TASK-20260813-619d9c/snapshot-receipt.json
    - RUN-ISOU-2ac81f-20BIT-B
    - RUN-ISOU-2ac81f-24BIT-B
    - DEC-20260813-e0077d
    - DEC-20260813-d61a99
    - EV-ECDLP-b3e847

  # ===================================================================
  # RUN DISPOSITION -- the run-by-run ruling this decision makes official
  # ===================================================================
  run_disposition:
    validity_adjudicated_first: >-
      VALIDITY WAS ADJUDICATED BEFORE ANY INTERPRETATION, as the archive card
      requires, and the run set is VALID: 4 of 4 expected runs terminal and
      completed_valid, schema-complete manifests, all 16 declared seeds present
      per curve with per-seed counts matching the manifest exactly, raw and
      summary in exact agreement on every recomputed statistic, controls run
      under literally identical solver parameters and seed schedules, and class
      completeness independently true. It is therefore NOT returned to the
      Executor as an invalid run set, and the Executor's conduct is not at
      issue: it adjusted no prediction, re-scored nothing, disclosed every item
      that could have been buried, and reported both band verdicts in every run.
    admissible:
      - run_id: RUN-ISOU-2ac81f-20BIT-B
        basis: >-
          Q1 and Q3 admissible. The mandatory different-order null-object stop
          is satisfied under BOTH candidate readings of the frozen band, so
          admissibility does not depend on how the band defect is settled.
      - run_id: RUN-ISOU-2ac81f-24BIT-B
        basis: >-
          Q1 and Q3 admissible under both bands. It is additionally the only
          run of the four satisfying both clauses of the contract's own
          success_criterion under both readings, with zero null-object
          censoring and the largest independently certified class (742).
    held:
      - run_id: RUN-ISOU-2ac81f-20BIT-A
        ruling: >-
          Q1 AND Q3 HELD IN EVERY FORM, including preliminary, partial and
          indicative. This run fails the contract's success_criterion under
          EVERY available reading of the band -- under the raw per-seed band
          the null clause fails, under the median band the reproduction clause
          fails -- so the hold is band-independent. Not rejected, not invalid,
          not deleted: its artifacts stand as valid records of the contract it
          was run under.
      - run_id: RUN-ISOU-2ac81f-24BIT-A
        ruling: >-
          Q1 AND Q3 HELD IN EVERY FORM. Under the raw per-seed band the
          mandatory control does not separate by a 41 percent margin, which is
          a clean failure rather than a boundary case.
    held_runs_partial_use: >-
      The held runs contribute ONLY findings the mandatory stop does not gate
      -- Q2, Montgomery/Edwards reachability, class completeness, certificate
      coverage -- because the contract's stop names Q1 and Q3 and nothing else.
      No pooled or averaged Q1 or Q3 aggregate over all four runs exists, is
      cited, or may be constructed.
    band_ruling: >-
      THE BAND IS NOT RETROACTIVELY SETTLED, AND THAT IS THE POINT. The
      Validator's closed-form analysis that the median-of-16 statistic is the
      correct instrument and the raw per-seed range is not a resolution
      criterion is accepted ON THE MERITS -- at the contract's own declared
      boundary N' = N/16 the raw-band gate is exp(-8c^2) = exp(-ln 2) = 0.5000
      exactly, a fair coin toss statistically independent of the quantity it is
      meant to test, and a band on single draws is not the sampling resolution
      of a statistic on 16 draws. BUT BEING RIGHT IS NOT BEING PRE-REGISTERED.
      The frozen contract left the statistic open, the producer had to supply
      it, and a producer-chosen statistic cannot be the pre-registration that a
      mandatory stop depends on. This Coordinator therefore declines to amend
      EXP-ISOU-2ac81f retroactively to rescue two runs, and instead designates
      the statistic PROSPECTIVELY in the superseding contract EXP-ISOU-bfba73.
      The two runs whose verdict is band-dependent stay held. No run is
      re-scored.

  # ===================================================================
  # CONTRACT DEFECTS AND THEIR CURE
  # ===================================================================
  contract_defects_and_cures:
    - defect: VAL-DEF-01
      severity: blocking_for_any_q1_or_q3_evidence_record
      summary: >-
        The frozen contract names a seed dispersion band but no statistic, no
        interval rule and no percentile, and the field it left open decides a
        MANDATORY STOP.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The resolution statistic is designated IN THE CONTRACT and not in a
        handoff: every between-curve comparison and every gate is evaluated on
        the median over the 16 declared seeds, and the resolution band is the
        declared nonparametric bootstrap 95 percent interval of the base
        curve's median-of-16. The raw per-seed range is recorded for
        transparency and is explicitly NOT a resolution criterion and gates
        nothing.
    - defect: VAL-DEF-02
      severity: blocking_for_the_reproduction_precondition
      summary: >-
        The frozen reproduction fixture 0.886*sqrt(N) is the NEGATION-MAP
        constant sqrt(pi*N/4) while the same contract mandates plain rho with
        NO negation map, and it is stated as a MEAN while the protocol compares
        a MEDIAN. Two stacked errors, both present AT APPROVAL -- in this
        Coordinator's own DEC-20260813-e0077d, in the specification, and in
        H-ISOU-c5bfea's HEUR-ISOU-1.
      cured_in: H-ISOU-5748b6 and EXP-ISOU-bfba73
      cure: >-
        HEUR-ISOU-1 is restated with the constant DERIVED rather than asserted,
        from the random-function survival P(T > t) = exp(-t^2/(2N)) for plain
        rho: MEDIAN sqrt(2*N*ln 2) about 1.1774*sqrt(N), MEAN sqrt(pi*N/2)
        about 1.2533*sqrt(N), and sqrt(pi*N/4) about 0.886*sqrt(N) identified
        explicitly as the NEGATION-MAP mean, which is why the old fixture was
        wrong by a factor sqrt(2). The new statement says WHICH STATISTIC it
        is, because failing to say so was half the defect. A hypothesis record
        is the only place this can be fixed -- an experiment amendment cannot
        reach it -- which is why a superseding hypothesis was required and not
        optional.
    - defect: VAL-DEF-03
      severity: material
      summary: >-
        The completeness gate could not fail as executed: the degree-generation
        condition was applied as a base-curve SELECTION FILTER, conditioning
        the base-curve population 6-to-1 in 20BIT-A and 3-to-1 in 20BIT-B.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The condition is removed from the selection filter and applied as a
        POST-SELECTION CHECK THAT CAN FAIL, with the rejection log required as
        an artifact and its selection ratio reported. A run whose walk closes
        short of h is recorded as an incomplete subgraph and supports no
        complete-class statement, which is the outcome the gate exists to
        expose.
    - defect: VAL-DEF-04
      severity: material
      summary: >-
        The implemented Q3 solve-cost formula diverges from the manifest's own
        declared q3_definition -- own-mix implemented against common-mix
        declared -- so a reader applying the stated rule gets different numbers
        (27 / 76 / 88 / 32 against the recorded 24 / 75 / 90 / 37).
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The Q3 definition states own-mix versus common-mix explicitly, both
        variants are required side by side, and a machine self-check recomputes
        Q3 from the declared formula string and FAILS THE RUN on disagreement,
        so the implemented and declared formulas cannot diverge undetected.
    - defect: VAL-DEF-05_and_COST-03
      severity: material
      summary: >-
        The Q3 basis is unresolved in the contract and the two bases give
        OPPOSITE headline answers. The measured-plus-modelled basis is
        determined by a modelled construction cost 51x to 120x the entire
        measured base solve and 222x to 1421x the measured walk.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The measured-evaluation basis is designated PRIMARY, matching the
        contract's own literal definition of charged_end_to_end_cost; the
        modelled-construction basis is a declared SECONDARY basis; both must be
        reported side by side with the modelled-to-measured ratio and the
        model's pessimistic direction stated, and neither may be reported
        alone.
    - defect: VAL-DEF-06
      severity: material
      summary: >-
        The band-clearing member screen has no multiplicity control and its
        realized coverage runs 0.61x to 1.73x nominal.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        Every per-member flag count must be reported with its nominal
        false-flag expectation in the same field, and the screen carries its
        own null-object control as a required artifact rather than as a
        reviewer's afterthought.
    - defect: VAL-DEF-07
      severity: material
      summary: >-
        summary.json is generated from an unarchived scratch state file, so the
        archived artifact set cannot regenerate it.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The summarize step reads only declared artifacts, the scratch state
        file is eliminated or declared as an artifact, and a regeneration check
        that reproduces summary.json from archived bytes is a required
        artifact.
    - defect: VAL-DEF-09
      severity: material
      summary: >-
        The distinguished-point density is fixed at 1/16 and is therefore not
        scale-invariant, so the null objects ran at 10.2 and 10.9 percent
        censoring against members' 1.4 and 1.9 percent -- a different censoring
        regime for the control than for the thing it controls.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The distinguished-point density is declared as a function of the
        curve's OWN order, theta(N) = kappa/sqrt(N) with kappa frozen in the
        manifest, so members and controls share a censoring regime by
        construction.
    - defect: VAL-DEF-10
      severity: minor
      summary: >-
        Controls are guarded by wall-clock tests, so the control set is
        machine-speed dependent and a control would be silently omitted rather
        than reported missing on a slower host.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        Controls run unconditionally; no control may be guarded by a wall-clock
        test; a control that cannot run ends the run with a budget terminal
        status and is written to the defect log as not_run.
    - defect: VAL-DEF-11
      severity: minor
      summary: >-
        The declared Q2 replay self-check failed for 14 members, was benign
        (perfectly correlated with seed-0 walks shorter than the declared 300
        replay operations), and appears in no defect log.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        The short-walk exception is declared IN ADVANCE, the comparison is over
        the common prefix, a prefix disagreement is a hard failure that gates
        the member's Q2, and every self-check outcome is written to the defect
        log whether it passes or fails.
    - defect: VAL-DEF-08
      severity: material
      summary: >-
        The discarded first execution of RUN-ISOU-2ac81f-20BIT-A and the code
        version that produced it are not in the record, and the changed line is
        the null-object band verdict line.
      cured_in: EXP-ISOU-bfba73
      cure: >-
        Every execution is retained, or the code hash of any discarded
        execution is recorded. NOTHING IS REPAIRED IN THE EXISTING ARTIFACTS:
        no number is in doubt, both bands and both verdicts were recomputed
        from raw with exact agreement, and what cannot be established from
        artifacts is recorded as a boundary of EV-ISOU-7c6405 rather than
        explained away.
    - defect: VAL-DEF-12_and_VAL-DEF-13
      severity: minor
      summary: >-
        A templated terminal_status_reason misstates the run, and summary.json
        asserts the admissibility adjudication that belongs to the review.
      cured_in: EXP-ISOU-bfba73_and_this_decision
      cure: >-
        The successor contract forbids a producer field that asserts
        admissibility, and EV-ISOU-7c6405 takes every per-run disposition from
        the Validator's gate table rather than from summary.q1_admissible.

  # ===================================================================
  # WHAT THIS DECISION AUTHORIZES
  # ===================================================================
  authorizes:
    - >-
      H-ISOU-5748b6 as the SUPERSEDING hypothesis for H-ISOU-c5bfea, carrying
      everything forward faithfully and changing exactly one substantive thing:
      HEUR-ISOU-1's formal_statement, whose corrected constant and named
      statistic are derived in the record.
    - >-
      H-ISOU-c5bfea moved to status `superseded` with `superseded_by:
      H-ISOU-5748b6` and a status_history entry citing this decision. Its text
      stands unedited: SUPERSEDE, NEVER OVERWRITE.
    - >-
      EXP-ISOU-bfba73 as the SUPERSEDING experiment contract for
      EXP-ISOU-2ac81f, at status `review_required` with `approved_by: null`.
    - >-
      EXP-ISOU-2ac81f moved to status `superseded` with `superseded_by:
      EXP-ISOU-bfba73`. NO PROTOCOL FIELD OF IT IS EDITED: its four runs remain
      valid artifacts of the contract they were run under, and re-scoring them
      under the successor is forbidden.

  explicit_non_approval_of_the_successor_contract:
    ruling: >-
      I DO NOT APPROVE EXP-ISOU-bfba73 IN THIS DECISION, AND THE REASON IS THE
      DEFECT ITSELF. This is the Coordinator's call and I am making it
      explicitly rather than leaving the field null by omission.
    reasoning: >-
      Both blocking defects in EXP-ISOU-2ac81f were produced by a single
      Coordinator's un-reviewed arithmetic being frozen into three records at
      approval -- a constant that was wrong by a factor sqrt(2), stated as the
      wrong statistic, and a gate whose sizing was asserted rather than
      computed. The cures I have just authored contain MORE un-reviewed
      Coordinator arithmetic than the contract they replace: a separation-power
      calculation that sets N' <= N/64, a distinguished-point density law
      theta(N) = kappa/sqrt(N), and a pre-registered reproduction tolerance
      whose provenance I disclose as informed by these very measurements.
      Approving my own derivation on the strength of my own reading is exactly
      the failure mode this batch just paid for. EXP-ISOU-bfba73 therefore goes
      to independent review BEFORE approval, with the reviewers directed at the
      arithmetic specifically. No compute is authorized until an approval
      decision exists on a committed record.
    what_is_not_being_said: >-
      This is not a finding that the successor contract is unsound. I believe
      it cures every defect the Validator named and I say so on the record. It
      is a finding that a Coordinator's belief about a Coordinator's own
      arithmetic is not the check this contract needs.

  # ===================================================================
  # WHAT THIS DECISION DOES NOT DO
  # ===================================================================
  what_this_decision_does_not_do:
    - >-
      NO HYPOTHESIS STATUS MOVES TO `supported` OR `rejected`. H-ISOU-c5bfea
      moves to `superseded`, which is a lifecycle transition forced by a
      contract defect and is NOT a scientific verdict -- it is not `supported`,
      not `weakened`, not `rejected_scoped`, and it asserts nothing about
      whether the hypothesis is true. The successor H-ISOU-5748b6 enters at
      `proposed`, not at `specified`, because `specified` was granted to its
      predecessor on the strength of an APPROVED frozen contract and its
      successor contract is not approved.
    - >-
      NO CLAIM TIER MOVES. claim_tier stays toy; dominated_by stays Pollard rho
      at exponent 1/2 with sota_delta not_applicable on every axis;
      asymptotic_claim stays null, so the four asymptotic-claim promotion gates
      are NOT engaged and are not reported as satisfied. No statement about
      P-256, no asymptotic, scaling, speedup or security-impact claim.
    - >-
      OBSTRUCTION 4 OF EV-ECDLP-b3e847 IS NOT DISCHARGED AND ITS STATUS DOES
      NOT CHANGE. It remains EMPIRICAL AND NOT PROVEN exactly as the red team
      recorded it. Two admissible toy runs against a contract with two
      approval-time blocking defects do not convert an asserted obstruction
      into a measured one. EV-ECDLP-b3e847 is cited and NOT edited.
    - >-
      SG-ECDLP-002 IS NOT REOPENED and H-IT-001 does not move. Only an F1
      observation -- a class member solving in materially fewer group
      operations, outside the band, with a verified certificate, surviving
      fresh seeds -- could put that on the table, and F1 was not observed: the
      single cheapest member per run returned INSIDE the band under 16 fresh
      seeds.
    - >-
      NO COMPLETION CRITERION OF GOAL-ECDLP-001 IS MET OR APPROACHED, no
      closure quorum is claimed, and nothing here resolves the campaign's
      unevaluable batch counter or its untracked wall clock.
    - >-
      NO KNOWLEDGE ENTRY IS PROMOTED; see knowledge_promotion.
    - >-
      NO SUCCESSOR BATCH IS OPENED AND NO HANDOFF IS WRITTEN BY THIS DECISION.
      The next actions below are specified, not dispatched.

  # ===================================================================
  # RATIONALE
  # ===================================================================
  rationale:
    - >-
      THE VERDICT IS ACCEPTED AS WRITTEN, INCLUDING THE PART THAT COSTS ME. The
      Validator ruled the median band correct ON THE MERITS and simultaneously
      ruled that the AUTHORITY to designate it was not the producer's, because
      the frozen contract left the field open. It also established
      affirmatively that the producer's choice was NOT self-serving -- the
      primary band hands back a failure of the same contract's reproduction
      clause in two runs where the raw band would have passed it, and there is
      no band under which all four runs satisfy both clauses. The clean thing
      to do with that finding is not to adopt the correct statistic
      retroactively and keep four runs; it is to keep the two runs whose
      verdict never depended on the choice, hold the two that did, and fix the
      designation prospectively. That is what this decision does.
    - >-
      THE EVIDENCE RECORD IS SCOPED TO WHAT SURVIVES THAT RULING AND NOTHING
      ELSE. EV-ISOU-7c6405 relies on Q1 and Q3 from RUN-ISOU-2ac81f-20BIT-B and
      RUN-ISOU-2ac81f-24BIT-B only; the two A runs contribute no Q1 or Q3 in
      any form including preliminary, and no four-run Q1 or Q3 aggregate
      appears in it. Q2, Montgomery/Edwards reachability, certificate coverage
      and class completeness are carried from all four runs because the
      contract's mandatory stop names Q1 and Q3 and nothing else.
    - >-
      THE STRONGEST DEFENSIBLE READING IS RECORDED, AND IT IS NOT A CLEAN NULL.
      Confirmed: the Q2 constant-factor mechanism at 1.0262 to 1.0304, taking
      exactly two values partitioned exactly by the a = -3 fourth-power
      criterion -- the predicted mechanism at the predicted size, far under the
      1.5x falsification threshold -- and zero Montgomery/Edwards reachability
      across 1652 members, confirming the prime-order / no-2-torsion argument.
      Null at the frozen band's resolution on Q1 and Q3, on two runs, at toy
      scale. NOT confirmed and explicitly recorded as such: the Q1 null is
      qualified by an uncalibrated screen whose realized coverage runs 0.61x to
      1.73x nominal, and by the fact that only the single cheapest member per
      run was re-run under fresh seeds.
    - >-
      F4 DOES NOT FIRE, AND A CONTROL SAYS SO RATHER THAN A JUDGEMENT. On the
      contract-literal measured basis, 6 / 7 / 14 / 9 members clear the band --
      the observable F4 names. The Validator's null-object control on that
      screen returns 36 observed against 41.3 expected, pooled, at or BELOW
      chance; restricted to the two admissible runs it is 16 against 22.55. The
      apparent firing is NOISE, and the record says a control established that.
      This is the inventor protocol's own rule applied to a result that would
      have been convenient to report either way.
    - >-
      THE "0 MEMBERS CHEAPER END-TO-END" READING IS NOT LAUNDERED INTO A CLEAN
      NULL. It holds only on a basis whose modelled construction term is 51x to
      120x the entire measured base solve and 222x to 1421x the measured walk,
      computed under a deliberately naive quadratic polynomial model that is
      PESSIMISTIC in exactly the direction of the predicted answer -- and the
      implemented formula diverges from the manifest's own declared
      q3_definition. The evidence record states all of that in the same
      observation as the number, and states the contract-literal counts beside
      it. Neither basis may be cited alone.
    - >-
      THE CURE MATCHES THE DEFECT'S LOCATION. VAL-DEF-02 reaches a HYPOTHESIS
      field -- HEUR-ISOU-1's formal_statement -- which no experiment amendment
      can touch, so a superseding hypothesis is required and not optional; and
      VAL-DEF-01 plus five material defects reach protocol fields of a FROZEN,
      APPROVED contract, which under AGENTS.md rule 2 is superseded, never
      edited. Hence exactly two new records and two status transitions, with
      both predecessors' text left standing.
    - >-
      THE NULL OBJECT IS NOW SIZED BY A CALCULATION INSTEAD OF AN ASSERTION,
      WHICH IS THE STRUCTURAL LESSON OF THIS BATCH. The old contract asserted
      that N' <= N/16 "separates at the resolution of the seed dispersion
      band"; at that exact boundary the raw-band gate is a fair coin toss and
      at the ratio actually used the failure probability is about 0.71 -- two
      of four runs failed, which is what that predicts. The successor derives
      the ratio from a stated separation-power calculation under the designated
      statistic and sets N' from the result. An asserted gate is a gate that
      has not been checked.

  # ===================================================================
  # LIMITATIONS
  # ===================================================================
  limitations:
    - >-
      MODEL INDEPENDENCE IS NOT ACHIEVED UNDER THIS HARNESS (AGENTS.md rule
      12), and I record it as the Validator did rather than claiming it. The
      review ran in a separate session, under the validator role, at xhigh
      effort, authored none of the artifacts it reviewed, and re-derived every
      substantive number with arithmetic written in its own session. But every
      policy alias resolves to one model here, so the resolved model is the
      same model that served the Executor. Session and role independence are
      real; MODEL independence is not, and this decision is not
      independently model-verified.
    - >-
      THIS COORDINATOR APPROVED THE DEFECTIVE CONTRACT. DEC-20260813-e0077d
      froze a fixture that was wrong by a factor sqrt(2) and stated as the
      wrong statistic, and approved a null-object sizing that was asserted
      rather than computed, and it did so citing the fixture as the baseline in
      its own proof_search_map reasoning. That decision stands unedited and is
      cited here as the origin of the defect. The successor contract is
      deliberately NOT approved by the same un-reviewed route.
    - >-
      THE Q1 AND Q3 FINDINGS REST ON TWO RUNS, one at each of two prime sizes,
      so nothing is replicated at a fixed scale. Evidence strength is
      `preliminary` and the contract's replication block (2 independent
      instances) is what would make replication reachable under the successor.
    - >-
      REPRODUCIBILITY IS NOT EXERCISABLE FROM THE ARCHIVE ALONE (VAL-DEF-07),
      and the control set is machine-speed dependent (VAL-DEF-10). Both are
      cured prospectively and neither is repaired in the existing artifacts.
    - >-
      THE SEPARATION-POWER CALCULATION, THE DP-DENSITY LAW AND THE
      REPRODUCTION TOLERANCE IN EXP-ISOU-bfba73 ARE THIS COORDINATOR'S OWN
      ARITHMETIC AND ARE NOT INDEPENDENTLY CHECKED. They use a normal
      approximation to the distribution of a median of 16 draws, which is
      moderately non-normal at that sample size, and the tolerance's provenance
      is disclosed in the contract as informed by the BATCH-009b1b
      measurements. This is precisely why the successor is `review_required`.
    - >-
      NOT YET DURABLE. This decision, EV-ISOU-7c6405, the BATCH-009b1b
      checkpoint and the two superseding records are uncommitted as written.
      Nothing here is official until the ledger archive commits and its
      post-commit verification is accepted.
    - >-
      DECLARED-PATH DIVERGENCE, DISCLOSED RATHER THAN PAPERED OVER. The archive
      card TASK-20260813-8a872d declares four artifact paths --
      ledger/evidence/EV-ISOU-7c6405.yaml,
      ledger/decisions/DEC-20260813-61e8a3.yaml, the BATCH-009b1b checkpoint
      shard, and its own snapshot receipt. The four records the cure requires
      -- ledger/hypotheses/H-ISOU-5748b6.yaml, the H-ISOU-c5bfea status
      transition, experiments/EXP-ISOU-bfba73/specification.yaml and the
      EXP-ISOU-2ac81f status transition -- are NOT among them, because the card
