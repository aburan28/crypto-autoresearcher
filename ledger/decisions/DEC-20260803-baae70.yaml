coordinator_decision:
  id: DEC-20260803-baae70
  context: >-
    GOAL-AES-003 BATCH-004 close. Rank 1 ran the zero-entry decay control that
    the BATCH-003 red team identified as the only queued measurement able to
    falsify rather than accumulate, and which a not_executed item had left unrun
    for three batches. Rank 3 ran the S-box arm on the r=5 yoyo. Rank 2 supplied
    the positive control BATCH-003 lacked.
  decision: support
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-c66a80]
  rationale:
    - >-
      THE FALSIFIER WAS RUN AND THE RESULT SURVIVED IT, IN TWO ENGINES. The
      preregistered bar required >=36 of 40 at r=6 under a zero-entry layer with
      the control collapsed; the producer measured 9 and 7, the validator's
      independent engine 3 and 5. The control discriminates -- 40/40 at r=4 and
      r=5, chance at r=6 and r=7 -- which is what makes the zero-entry arms'
      identical drop informative rather than merely concordant.
    - >-
      THE MECHANISM THAT WOULD HAVE VOIDED THE RESULT IS DEFEATED BY ONE ARM.
      Z1 at r=5 forces the residue with NO fiber degeneracy: gcd 1 on 40/40,
      max_occ 6-9. That was the load-bearing supposition of OBS-B3-4 and the
      validator verified it directly.
    - >-
      AND THE RED TEAM SHOWED THAT ARM WAS NOT NEW. Byte-width M0 arms at r=5
      already had max_occ 12 and no divisibility. My dispatch card asserted the
      contrary and thereby mis-assigned the credit; what the nibble arm genuinely
      contributes is the r=6/r=7 decay direction, which exists nowhere at byte
      width. Corrected in CORR-20260803-791ca7.
    - >-
      THE HEADLINE THIS CAMPAIGN HAS BEEN CARRYING IS OVERSTATED AND IS SCOPED
      DOWN HERE. "Nothing this campaign has found is specific to AES" is not
      supportable from two draws. The supportable claim is about the S-boxes
      actually drawn: 95% lower bound 0.224 on the fraction of preserving
      bijections, 29 draws needed for 0.90. The producers' artifacts stated this
      correctly and my summaries did not.
    - >-
      THE COORDINATOR DEFECT PATTERN IS NOW EXPLICIT. Three of this batch's
      reviewer findings are against MY summary lines, not against any producer's
      measurement, and the validator classified one of them in those words. With
      three earlier instances this session -- a validator marked FAILED without
      opening its directory, a hygiene PASS reported from an unread pipeline, and
      a matrix claim propagated without checking four entries -- the pattern is
      that COMPRESSION is where this Coordinator introduces claims the evidence
      does not carry. CORR-20260803-791ca7 records it and binds future summaries to carry the
      scope or quote the producer.
  evidence_refs: [EV-AES-c66a80, CORR-20260803-791ca7, EV-AES-96257a]

  measured_but_not_reviewed:
    what: >-
      The r=6 yoyo decay arms, run after the reviewers were dispatched, at the
      red team's identification of them as the batch's cheapest falsifier. All
      three DEAD: AES 0.50x, R1 1.00x, R2 0.00x, paired to their r=5 counterparts
      by key and seed so rounds is the only variable changed.
    weight_carried: >-
      NONE. The validator states explicitly that no segment-2 artifact is
      validated in either direction. It supports no observation in EV-AES-c66a80.
      Its own producer refused to upgrade the batch on it, correctly: a named
      defect is closed, and passing a control that was missing removes an
      objection rather than adding evidence.
    disposition: BATCH-005 rank 1.

  limitations:
    - Toy tier. GF(2^4) nibble analogue plus reduced-round AES-128 at r=5 on one machine.
    - OBS-B3-4 remains OPEN at byte width; the mod-8 margin drops from 32x the modulus at 8 bits to 2x at 4 bits.
    - S-box, key and stream are confounded across the yoyo arms.
    - Session and implementation independence only; NOT model independence, so nothing counts toward a closure quorum.
    - RQ-AES-003 outcomes (a), (b) and (c) are all UNMET. Outcome (d) is what this campaign has produced.

  next_actions:
    - >-
      SINGLE NEXT ACTION: open BATCH-005 as a CONTROL-AND-CLOSE batch, not a
      research batch, in this order. Rank 1, independent review of the segment-2
      r=6 decay arms, which are measured and unreviewed. Rank 2, the GF(2^8)
      zero-entry arm at r=6, the one measurement that would close OBS-B3-4 at
      byte width rather than in analogue. Rank 3, the red team's RC-1..RC-7
      control set, roughly one hour, which it explicitly labelled controls rather
      than continuation. Rank 4, deconfound the yoyo arms by running several keys
      per S-box or one key across S-boxes.
      IF THAT SET COMPLETES WITHOUT A LIVE DIRECTION EMERGING, the honest next
      act is to PAUSE this goal on a stated resume condition. Both reviewers were
      asked what is still worth running and neither named a research direction;
      the red team recorded that four batches have produced no candidate
      mechanism for surviving past r=6 and that it has none either. That is a
      fatigue report about the search, not a verdict on the problem, and it is
      the reason BATCH-005 is scoped to controls.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      STILL NOT WARRANTED, AND FOR A NARROWER REASON THAN LAST TIME. The
      round-split scoping rule now has a discriminating decay control behind its
      r=5 half, which is what DEC-20260802-f04fb0 said was missing. What replaces
      that objection is the byte-width gap: the control is a GF(2^4) analogue, the
      mod-8 margin is 2x rather than 32x at nibble width, and the red team showed
      the nibble arm's strongest claim already had a byte-width counterpart. A
      knowledge entry asserting a general scoping rule should rest on the
      byte-width arm, which is BATCH-005 rank 2 and is unrun. Promote after it, or
      record why it changed the picture.

  decided_by: coordinator
  decided_at: 2026-08-03
