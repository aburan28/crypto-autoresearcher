coordinator_decision:
  id: DEC-20260908-c21063
  decision: approve
  decided_by: coordinator
  decided_at: '2026-09-09T03:50:50.675807+00:00'
  target_ids:
  - EXP-ECDLP-1b1b99
  - TASK-20260908-d18d13
  - TASK-20260908-e5fdfd
  context: Complete the standalone pre-run outcome carrier after the archived fifth CM definition review.
  rationale:
  - 'Accept CM5-PRE-RUN-REFUSAL-CARRIER-001: the three-carrier schema cannot represent an early refusal without
    a fabricated RUN context. The other two reviewed joints hold within their disclosed limits.'
  - The review retains380/640fixed executions, six checker-fixture failures and targeted corrections, with no clean
    final full-suite rerun. Do not turn that into an invented whole-contract PASS.
  - A minimal closed operational carrier and explicit initialization boundary resolve the concrete missing representation
    while preserving all scientific and cost definitions. Standing authorization supplies user approval for this
    drafting task.
  approved_correction_boundaries:
  - Copy the complete fifth contract, schema and checker into a new five-file successor. Preserve all24 effective-contract
    sections other than artifact_custody, including the now-reviewed cost relations, all23 scientific sections,
    samples, seeds, arms, reducers, thresholds and public trust binding.
  - Add one closed top-level pre_run_outcome carrier alongside raw_cost, allocation_edge and full manifest. It is
    an operational receipt, never a RUN record. Require record_type, experiment_id, status, reason_code, stage,
    recorded_at_UTC, trusted_handoff and observed_authorization_input; permit optional detail and a conditional
    policy_resolution_failure block only.
  - The trusted_handoff object requires a canonical task_id and exact handoff_sha256 obtained from the trusted invoking
    Coordinator context before reading untrusted authorization bytes. Never copy those binding facts from the malformed
    payload. Missing trusted dispatch context is a harness invocation failure outside the CM run interface; no CM
    scientific entrypoint is admitted without it.
  - For pre_run_outcome, stage is authorize_and_claim_nonce. Derive permitted status/reason pairs exhaustively from
    the existing outcome_relation rows that permit that stage and have status refused_before_run or infrastructure_stopped.
    This includes all seven AUTH_* reasons and POLICY_RESOLUTION_FAILED. Preserve their existing meanings; arbitrary
    strings, completed-valid status and scientific branches are forbidden.
  - Observed authorization input is either a closed available object with the SHA256 and nonnegative integer byte
    length of the complete actually observed raw bytes, or a closed unavailable object with an explicit not_read,not_provided,read_failed
    orcapture_unavailable reason. Do not retain private material or raw authorization bytes. Never label a partial
    capture as a complete digest.
  - For POLICY_RESOLUTION_FAILED, retain the exact authoritative inference-writer failure block in policy_resolution_failure,
    requiring its resolution_error, literal failure note and model_verified:false. Do not strip the writer fields
    or invent a served model. For other reasons that field is absent.
  - Forbid run IDs, run, code/source-hash, scientific input, resource, directory and admission fields in this minimal
    carrier. The full manifest remains available only when all its required facts actually exist. Before advancing
    beyond authorize_and_claim_nonce, the launcher must have allocated the trusted run context and established those
    facts; otherwise use the pre-run carrier and do not invent them.
  - Emit the canonical refusal JSON plus one LF to the invoking control plane/stdout, or a trusted preconfigured
    control-plane spool. Do not use an untrusted requested run path, create a RUN directory, claim a nonce was consumed
    without evidence, or claim durable delivery when output fails. The invoking Coordinator retains the returned
    bytes as operational custody.
  - Extend the schema and actual fixed checker for every permitted early status/reason, missing/forged binding,
    available/unavailable input form, policy-writer failure, and rejected fabricated RUN/science field. Regress
    every previous valid/invalid carrier and prove the fourth alternative does not weaken the first three. Keep
    runtime implementation and actual refusal execution separate from these definitions.
