coordinator_decision:
  id: DEC-20260811-6306cf
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  context: >-
    Adjudicates BATCH-aeeb17, an IDEATION-ONLY batch on GOAL-ENDO-001 opened
    2026-08-11 at the user's request for novel, exotic, publication-grade
    directions. Five idea-generator producers (research-deep) filed 27 proposals
    against 40 pre-allocated identifiers at snapshot c3127ebfd; 13 identifiers
    were returned unused and are NOT to be reissued. Two independent
    review-adversarial sessions, pre-registered at 78c935fc2 BEFORE any producer
    output existed, have returned: VAL-TASK-20260811-845cc4 `passed` /
    PASSED_WITH_FINDINGS with no dissent, and RT-20260811-1b8501
    PASSED_WITH_FINDINGS WITH A NARROW DISSENT.

    THE BATCH TESTED A COVERAGE HYPOTHESIS, NOT A MATHEMATICAL ONE. BATCH-CARD.md
    section 1 pre-registered the claim that GOAL-ENDO-001's fourteen lanes are
    indexed by RESOURCE (R1-R8) applied to a single curve's point group, leaving
    objects that indexing cannot express thinly generated. Five axes were
    assigned by central OBJECT rather than by lane. This decision adjudicates
    that hypothesis per axis, and revises it downward where the reviews require.

    NOTHING IN THIS DECISION IS EVIDENCE. No experiment ran, no run identifier
    was consumed, no measurement was taken. Proposals are proposals.
  decision: support
  decision_scope_note: >-
    `support` is scoped EXACTLY to this: the batch produced admissible,
    disciplined, internally-screened proposals, several of which are worth
    contracts, and its coverage hypothesis is PARTLY confirmed and PARTLY
    revised downward. It supports NO mathematical claim, moves NO hypothesis,
    meets NO completion criterion, and approves NO experiment. Every proposal
    remains `proposed`.
  target_ids:
  - BATCH-aeeb17
  - TASK-20260811-5ff234
  - TASK-20260811-6ca12c
  - TASK-20260811-f58f22
  - TASK-20260811-c439c2
  - TASK-20260811-6d56a7
  - TASK-20260811-845cc4
  - TASK-20260811-029a6c
  rationale:
  - >-
    THE DISSENT IS ACCEPTED IN FULL AND THIS COORDINATOR VERIFIED IT
    INDEPENDENTLY BEFORE ACCEPTING IT. RT-20260811-1b8501 F-01 objects that
    IDEA-20260811-61ecae's claim (C)/(F) language -- the landmark-walk
    inequality "holds at EVERY point of the frontier", the class sitting "AT the
    critical class size, and not by design" -- rests on an unstated assumption
    buried in heuristic HA-2, namely h = |D|^{1/2+o(1)} = N^{1/2+o(1)}, which
    silently requires N = p^{1-o(1)} (bounded cofactor). The record's OWN stated
    assumptions require only N > 4*sqrt(p), permitting N as small as
    p^{1/2+eps}. Writing N = p^{1-delta} with cofactor exponent delta in
    [0, 1/2) and h ~ p^{1/2}, the record's own h = N^{1/2+gamma} forces
    gamma = delta / (2(1-delta)), and the central inequality becomes
    tau <= 1/2 - gamma, NOT tau <= 1/2. THIS COORDINATOR RE-DERIVED THE ALGEBRA
    FROM SCRATCH AND CONFIRMS IT EXACTLY: the identity (1-delta)(1/2+gamma) =
    1/2 holds to 6 decimal places at every delta checked; at delta = 0.30
    (N ~ p^{0.7}, a curve satisfying the record's own admissibility with margin)
    gamma = 0.2143 and the free region contracts from (0, 1/2] to (0, 0.2857];
    at delta = 0.49 it contracts to (0, 0.0196], i.e. essentially collapses. The
    result NARROWS; it is not refuted.
  - >-
    WHAT THE DISSENT DOES NOT TOUCH, AND WHY THAT MATTERS. The dissent is scoped
    to the universality language of 61ecae (C)/(F) and to
    IDEA-20260811-735c6b's Claim 4 insofar as it reuses the same unqualified
    identity. It explicitly does NOT reach 61ecae's achievability construction
    (B), its matching lower bound (D), or its non-separation conclusion (E) --
    the red team attempted to break those and could not. So the batch's
    substantive A3 finding SURVIVES in scoped form: for bounded-cofactor curves
    (delta = o(1)), which is the cryptographically standard regime, the adaptive
    class-structured preprocessing region equals the generic region, and the
    class buys nothing. The overclaim was the word "every", not the mathematics.
  - >-
    THE BATCH DEFLATED ITS OWN HEADLINE, AND THAT IS CREDITED. RT F-05 records
    as a POSITIVE finding that IDEA-20260811-735c6b's Claim 1 -- independently
    re-derived by the red team, and re-derived AGAIN by this Coordinator -- shows
    the entire Corrigan-Gibbs--Kogan frontier S*T^2 = N is, under honest Wiener
    full cost S*T = N/T, strictly decreasing in T and therefore minimised at the
    NO-ADVICE corner T = Theta(sqrt(N)), S = Theta(1), reproducing plain rho at
    sqrt(N) exactly. CONSEQUENCE, STATED PLAINLY: axis A3's headline
    region-equality is a MODEL-THEORETIC result whose practical significance is
    nil, because the frontier it proves things about is itself dominated by rho
    once full cost is charged. That this was found by the batch itself rather
    than by the review is the single strongest piece of evidence against the
    make-work reading, and it is credited as such.
  - >-
    AXIS A4'S COVERAGE CLAIM IS REVISED DOWNWARD BY THIS COORDINATOR, ON RT
    F-04. All six A4 records are internally rigorous and mutually
    cross-referential, but every mechanism is generic-group-model proof
    technique with NO dependence on endomorphisms, isogenies, or CM structure --
    the same theorems apply verbatim to an augmented-GGM DLP on any prime-order
    group. F-04 asks the Coordinator to choose between calling A4 part of the
    endomorphism-specific corpus or a general-purpose toolkit filed under the
    L12 audit lane for want of a better home. THE CHOICE IS THE SECOND. A4 did
    NOT reach a new endomorphism-specific axis; it produced a general GGM
    toolkit. That is a legitimate and valuable placement -- IDEA-20260811-a343de's
    pigeonhole closure of any oracle emitting o(log_2 N) bits reaches oracles the
    campaign's simulator-exhibition technique provably cannot, which is a real
    extension of KN-FIND-b7e091's technique -- but it is a DIFFERENT claim from
    "reached an object the lane index cannot express", and the batch's coverage
    hypothesis is marked down for A4 accordingly.
  - >-
    THE COVERAGE HYPOTHESIS, ADJUDICATED PER AXIS. CONFIRMED for A2 and A3: both
    reached objects the resource-times-one-curve indexing does not express (the
    ray-class torsor of (curve, point) pairs; the isogeny class as a single
    preprocessing object), and both produced results with named mechanisms.
    PARTLY CONFIRMED for A5: its three import channels produced four closures
    with mechanisms, but two of them (e6399d, d8ff09) are closures of channels
    rather than new objects. PARTLY CONFIRMED for A1: its filter-scope audit
    returned an airtight boundary with exactly one named open crack (publicly
    computable partial homomorphisms on a subset of G of density N^{-c}), which
    is a real deliverable, but its twist seed was partly a rediscovery.
    REVISED DOWNWARD for A4, per the preceding item. The batch's own
    pre-registered ranking in BATCH-CARD.md section 6 predicted outcome (a),
    several well-argued closures with named obstructions, as most likely; that
    prediction was CORRECT and is recorded as having been made in advance.
  - >-
    THE COORDINATOR'S OWN SEED WAS PARTLY FALSE AND IS CORRECTED HERE, WITH
    INDEPENDENT CONFIRMATION. The A1 dispatch seed asserted that E and its
    quadratic twist E^d share the x-line literally. That is FALSE in standard
    short Weierstrass form, where the twist's x-coordinates are d*x; the sharing
    is literal only in the model d*y^2 = f(x). A1 caught it and the validator
    RE-DERIVED THE ALGEBRA BY HAND and confirmed both the falsity and A1's
    correction. A measurement written from the seed as the Coordinator stated it
    would have produced a spurious mismatch. Separately, the seed's headline
    (the twist has trace -t, hence a different class, hence T1/T2/T4 are silent)
    was ALREADY FILED as IDEA-20260807-e41559 nine days earlier; A1 credited it
    and claimed nothing. The productive residue -- that in d*y^2 = f(x) the
    twist pair shares the SAME summation polynomial, not merely the same shape
    -- is A1's, not the seed's.
  evidence_refs: []
  evidence_refs_note: >-
    DELIBERATELY EMPTY. This batch produced no evidence record and no run. The
    two review reports are review artifacts, not evidence:
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-845cc4/validation-report.yaml
    and
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-029a6c/red-team-report.yaml
    (RT-20260811-1b8501). Citing a proposal as evidence would be a core rule 5
    violation.
  limitations:
  - >-
    EXTERNAL NOVELTY IS UNESTABLISHED FOR ALL 27 RECORDS, AND THIS IS THE
    BATCH'S LARGEST LIMITATION. WebSearch and WebFetch failed on every call in
    all five producer sessions, in the red-team session, and in this
    Coordinator's own direct test, routed to
    us.anthropic.claude-haiku-4-5-20251001-v1:0 -- an Amazon Bedrock inference
    profile, which this repository forbids outright. No Bedrock inference
    succeeded (access was denied), so the prohibition held BY ACCIDENT rather
    than by design, which is itself worth recording as a harness defect. The
    crypto-kb MCP index is separately configured `:memory:` and is empty. Both
    reviews recorded the external-literature check as NOT COMPLETABLE rather
    than passed. Internal screening against the 146-record corpus DID happen,
    was re-run independently by the validator, and is real. Every record carries
    novelty_status `unverified` or `adaptation`; none claims bare novelty. ANY
    of these 27 records may turn out to be published prior art.
  - >-
    THE REVIEWS WERE SERVED BY A DIFFERENT MODEL THAN THE PRODUCERS. Producers
    resolved research-deep to claude-opus-5; both reviews resolved
    review-adversarial to claude-sonnet-5, because the session model changed
    between dispatches and .claude/agents frontmatter carries `model: inherit`.
    This is NOT a policy violation: review-adversarial declares
    reasoning_effort xhigh and carries no `degradable: false` flag (only
    review-breakthrough does, and nothing in this batch routed there). It is
    recorded rather than passed over silently, per the no-silent-downgrade rule.
    The validator additionally recorded model_verified false, having run no
    adapter-doctor probe.
  - >-
    A `passed` VALIDATION MEANS ADMISSIBLE AND DISCIPLINED, NOT MATHEMATICALLY
    CORRECT. The validator verified schema, identifier discipline, novelty
    screens, claim discipline, write scope, and a sample of elementary [fact]
    claims. It did NOT verify IDEA-20260811-a343de's pigeonhole bound or
    IDEA-20260811-61ecae's exponent arithmetic; the red team attacked the latter
    and found F-01. No deep mathematical claim in this batch has been
    independently verified except where a review says so explicitly.
  - >-
    TOY SCALE AND CLAIM TIER ARE UNCHANGED. claim_tier `toy` and sota_delta zero
    in all 27 records, programmatically confirmed by the validator with zero
    violations, and no prose asserts an exponent movement. As an attack every
    record is dominated by parallel Pollard rho at 0.886*sqrt(N) group
    operations with O(1) memory.
  - >-
    TWO SELF-DISCLOSED RECORD DEFECTS STAND UNCORRECTED, DOCUMENTED RATHER THAN
    OVERWRITTEN. IDEA-20260811-d27383 carries a garbled prose line in its claim
    block (the intended statement, correct in its own title: since D <= p-1 the
    derivable bound is at most log_2(p-1) = O(log N)), and IDEA-20260811-ae0f6f
    carries a constructive_transforms value baseline_as_boundary_lift where the
    informal convention is boundary_lift. Both confirmed cosmetic by the
    validator; neither is schema-enforced and the ledger validator passes. They
    are corrected on first supersession, never by editing a committed record.
  - >-
    A COORDINATOR DOCUMENTATION ERROR IS RECORDED: the A2 handoff prose called
    RQ-CLGP-b99df5 "Lane L11"; DECOMPOSITION.md has it as L10 (L11 is
    RQ-MODEL-e61cb2). The RQ identifier was correct, A2 filed against L10
    correctly, and the validator confirmed the error did NOT propagate into any
    filed record.
  next_actions:
  - >-
    N1. THE DISSENT MUST BE CURED BEFORE ANY PROMOTION OR CITATION OF
    IDEA-20260811-61ecae's UNIVERSALITY LANGUAGE. Per RT-20260811-1b8501's
    what_it_blocks, this Coordinator may not approve or cite the "at EVERY point
    of the frontier" / "not by design" framing in any synthesis, decision or
    successor contract until F-01 is corrected (RC-1, a documentation and
    derivation fix requiring NO recomputation) or shown not to apply. THE
    CORRECTED STATEMENT THIS DECISION AUTHORISES IN THE MEANTIME, and the only
    one: for curves of bounded cofactor (N = p^{1-o(1)}, gamma = o(1)) the
    adaptive class-structured preprocessing region equals the generic region;
    for cofactor exponent delta the free region is tau <= 1/2 - delta/(2(1-delta)).
    RC-1 is authored as a superseding proposal record or an amendment, never by
    editing IDEA-20260811-61ecae, which is committed.
  - >-
    N2. IDEA-20260811-68fa90 IS GATED AND MUST NOT BE PROMOTED WITHOUT
    BREAKTHROUGH-TIER REVIEW. Validator F-02 (high) records that this record
    self-flags a construction appearing to beat the sqrt(h) VECTORIZATION
    baseline at S = h^{2/3}, T = h^{1/3}. Goal pause condition P3 does NOT
    literally fire: P3 is scoped to the automorphism-discounted rho baseline for
    ECDLP, and this is a different problem with a different baseline, correctly
    scoped away from ECDLP by the record and confirmed so by both reviews. The
    record itself requests independent review and declares a high prior of prior
    art. THE GATE: no contract, no experiment and no synthesis may rest on
    68fa90 until an independent review-breakthrough session (validator-breakthrough
    and/or red-team-breakthrough, `degradable: false`) has read it, and until the
    external literature check that is currently NOT COMPLETABLE has been done.
  - >-
    N3. F-03 CROSS-REFERENCE OBLIGATION. IDEA-20260811-e6399d claim (D) ("a
    torsor admits no index calculus -- no monoid") and IDEA-20260811-319a07
    claim (D3) ("computing psi IS the ECDLP") are filed as INDEPENDENT
    obstructions but may be one fact in two vocabularies. The settling test is
    named by the red team and is cheap: determine whether e6399d's argument
    survives the hypothetical in which 319a07's psi is computable by some route
    other than Pohlig-Hellman. If it collapses too, the two are the same fact
    and must be cross-referenced as such rather than counted as two closures.
  - >-
    N4. RQ-RAYCL-3985f4 IS OPEN AND ITS SEED IS NOW REVIEWED. The question was
    opened at f05894024 from IDEA-20260811-319a07 while both reviews were still
    running, and it pre-registered the DEFLATIONARY reading (T1) as its expected
    outcome. RT F-02 independently reached the same deflationary reading and
    explicitly credits that pre-registration as having already made, in
    substance, the correction the finding would otherwise demand. The question
    stands as written. Its first obligation is unchanged: verify the two facts
    the seed RELAYS rather than derives (E(F_p) isomorphic to O/m as an
    O-module; the ray-class exact sequence), both currently unverified recall,
    and then run the hard gate #X_m = #Cl_m(O) by two independent enumerations.
    Any future citation of 319a07's "the folk obstruction is FALSE" headline
    must quote its own D3/D5 qualifiers alongside it.
  - >-
    N5. THE HARNESS DEFECT IS REPORTED TO THE USER AND IS NOT SILENTLY ABSORBED.
    WebSearch/WebFetch resolving to a Bedrock inference profile is a harness-level
    routing defect that this campaign cannot fix from inside a worktree. Until it
    is repaired, EVERY batch in this program inherits "external novelty
    unestablished", and that limitation must be transcribed into every future
    ideation handoff rather than rediscovered each time. Separately, crypto-kb
    needs `make -C kb qdrant-up` plus `crypto-kb stage-repo .` and
    `crypto-kb ingest` before its retrieval policy can be honoured at all.
  - >-
    N6. NO LANE IS UNPAUSED AND NO CONTRACT IS APPROVED BY THIS DECISION. The
    ranked candidates for a FUTURE design-experiment pass, recorded here without
    approving any of them, are: IDEA-20260811-a343de (zero compute, two-sided
    GGM boundary, the most citable object in the batch, but see the A4 markdown
    in rationale); IDEA-20260811-04a75a (exact O(p^2) integer sweep at p = 4001,
    no statistical model, the only A1 record whose corpus grep returned
    nothing); IDEA-20260811-d69ebe (rank computation, milliseconds, null value
    derived before measuring); and IDEA-20260811-61ecae ONLY after RC-1. Each
    needs its own Coordinator approval under /design-experiment.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO KNOWLEDGE PROMOTION IS WARRANTED FROM THIS BATCH. The knowledge corpus
      takes findings promoted from EVIDENCE, and this batch produced none: no
      experiment ran and no measurement was taken. Several results here are
      derivational and would be promotable in principle -- A3's frontier
      equality, A4's o(log_2 N)-bit closure, A5's monoid/torsor obstruction --
      but all three are (a) unverified against external literature because the
      literature check is NOT COMPLETABLE, and (b) in A3's case under an
      accepted dissent. Promoting any of them now would durably record as
      program knowledge a claim that may be published prior art. Revisit when
      the WebSearch routing defect is repaired and RC-1 has cured the dissent.
  decided_by: coordinator
  decided_at: '2026-08-11'
  attestations: []
  attestations_note: >-
    NONE OBTAINED AND NONE CLAIMED. No completion quorum is asserted; rule 13's
