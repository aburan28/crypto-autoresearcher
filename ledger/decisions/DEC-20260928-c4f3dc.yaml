      NOT FIRED (composer ruling). (a) RJ3 finds no older-layer clause whose
      outcome changes without supersession. (c) DF-N1 and DF-N2 are discharged
      per their owners and corroborated by RJ5 QB1/QB3. On (b): RJ1 finds one
      outcome for gate 1 and N4 on every declared and constructed state. RJ5
      finds one outcome under the reading it adopts from a governing clause.
      It records the literal alternative as a residual that is resolved only
      by implication, and that is the trigger for K-indeterminate. The literal
      reading proves too much for the DF-N1 class: it makes N4 met for EVERY
      numerical evaluator on EVERY C-BOUND state, including BND-2, which has
      no NEAR_FLOOR involvement, and equally under the narrow and typed texts.
      So it is a pre-existing gap between N4 and the gate-2 tolerance, not a
      two-outcome case created by the gated spans.
    K-executed-layer: NOT FIRED. No executed-layer field was touched, and all 202 executed rows keep their layer.
    K-provision: NOT ENGAGED.
    K-hypothesis: NOT FIRED. H-AUXIN-6db354 carries the protocol; RI-1 is complete.
    K-route-switch: NOT FIRED. This layer retires or demotes no condition.
    K-infra: NOT FIRED. No joint failed to run; RJ5's inconclusive is by design.

