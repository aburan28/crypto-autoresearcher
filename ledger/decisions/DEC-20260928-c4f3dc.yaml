      fixes". C-BOUND gate 2 accepts bounds within 10^-50. No clause states
      that N4's bound comparison uses that tolerance; it follows only by
      implication from success_criterion.decidability. Under the literal
      reading, every numerical evaluator meets N4 on every state while gate 1
      passes. This choice affects a run-time decision, and the text does not
      declare it immaterial. RJ1 OBS-3 points at the same gap independently
      and records that the draft does not change it. (2) QB4 membership
      differs on run-time cut-offs. (3) Q0-C: the expected status, witness set
      and witness for an undeclared constructed state are named only by
      implication. Per the plan, the composer prefers neither implementation.
    K-revise-defect: NOT FIRED. No joint breaks on a coverage item.
    K-regression: NOT FIRED. Every regression group is reported holding by its owner.
    K-layer: NOT FIRED. RJ3 finds the table total and single-valued, and finds incorporation by hash approvable as constructed.
