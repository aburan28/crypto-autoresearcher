  rationale:
    - >-
      JOINT J-C1 (TASK-20260904-148ed6, validator, fresh independent
      session): VERDICT HOLDS_WITH_FINDINGS. All five checks PASS:
      (a) diff-fidelity - corrected-design.yaml differs from
      IDEA-20260904-06c396 by exactly the four fixes plus identity and
      disclosed additive correction-lineage metadata, every difference
      enumerated and classified, no OTHER difference; (b) quantity
      re-derivation - chi2_0.975(3) = 9.348404, written-order OBJ-4 decay
      power 0.952538 with 0.018883 to FM-OVERDISPERSED, and OBJ-5B
      comparator 0.989349 -> 0.884236 as phi runs 1.0 -> 2.0 (0.115764 to
      FM-OVERDISPERSED at phi = 2.0) all independently reproduced in fresh
      sealed code to every reported digit, and the former values survive
      only as Branches-1-5-only values labelled conditional on Branch H not
      firing or as correction-provenance citations; (c) glyph byte-fidelity
      restored against the DEC source records (the named source
      IDEA-20260903-bd730d.yaml contains zero non-ASCII characters - the
      producer's disclosed substitution is validated against the actual
      sources), RAT-5 quoted verbatim with the paraphrase moved outside the
      verbatim section; (d) RT2-SR-4 split-point naming consistent with the
      both-points mean constraint; (e) no substantive drift - realized
      readings, Garwood CI [9.903, 27.219], AMEND-1/SCOPE-1/NARROW-1..5/
      RAT-3/4/5 logic unchanged, RT2-SR-5 untouched. Runs 2/2; zero arms;
      correction-diff.md read only after findings sealed, corroborating and
      changing nothing.
    - >-
      FINDING-1 (non-load-bearing, check b): two independent written-order
      enumerations of OBJ-4 disagree by ~2e-6 on the UN-named residual
      split between FM-UNRESOLVED and FM-PLATEAU-CONSISTENT (validator
      0.028486/0.000093 vs red-team 0.028488/0.000091) while agreeing
      exactly on every RT2-SR-2-named quantity and on the total. Neither
      discrepant value appears in the corrected package; no verdict or
      routing direction depends on a 2e-6 residual split. Recorded per rule
      8; qualifies the red-team report's residual decomposition, not its
      named values.
    - >-
      FINDING-2 (non-load-bearing for this audit; COORDINATOR ADJUDICATION
      recorded below, check c): RT2-F3b's original locus was
      preregistration-skeleton.md Section 0 (its 'quoted verbatim from
      committed ledger records' preamble still covers a paraphrased RAT-5
      subsection). The skeleton was NOT a deliverable of this pass by
      contract; the surface named by DEC-20260904-031ed2's restatement of
      RT2-SR-3 is the proposal record's blocks, which are fixed.
      COORDINATOR RULING: RT2-SR-3 is CLOSED against the surface named by
      DEC-20260904-031ed2 (the proposal record). The skeleton is a
      not-yet-binding document that becomes binding only if a successor
      batch adopts it verbatim; ADOPTION CONDITION AC-1: any batch adopting
      the skeleton must first apply the same RAT-5 fix there (quote verbatim
      or narrow the preamble).
    - >-
      FINDING-3 (non-load-bearing, check c): pooled-exposure-pricing-v2.json
      retains, unchanged from the pre-correction file, one ASCII-normalized
      quotation of the literal AMEND-1(a) text inside
      amend1_arithmetic_at_the_proposed_exposure.saturation_aware_identity,
      where the DEC source glyphs are U+2212/U+00D7. RT2-SR-3 does not name
      this quotation; the producer disclosed leaving it unchanged as an
      out-of-scope observation. Carried as disclosure; folded into ADOPTION
      CONDITION AC-2: any execution-gate batch that treats the pricing JSON
      as a binding verbatim-standing document must reconcile this quotation
      first.
    - >-
      FINDING-4 (non-load-bearing, procedure): the validator's run-1 audit
      script crashed in its own fresh code (IndexError in the OBJ-4 routing
      block); sections S0-S8 of run 1 are byte-identical to run 2; run 2
      (one-line fix) produced every reported number with all self-checks
      passing. Validator-side disclosure, not a package defect.
    - >-
      COMPOSITION: J-C1 supports closure of RT2-SR-1..4. All findings are
      non-load-bearing for the correction pass itself; FINDING-2 and
      FINDING-3 become the two adoption conditions above; FINDING-1 is
      recorded unexpected-observation per rule 8; FINDING-4 is procedure
      disclosure.

