  ranking:
    priority: >-
      ECC SCURVE L5 is a bounded, decision-changing precondition audit with
      frozen source bytes and a verified custody receipt. Independent
      arithmetic, source and control review can now resolve whether its
      C4 sentence is fit for a scoped evidence record. No new L5 producer run
      is needed or authorized by this decision.
    uncertainty: >-
      The direct-host parameter provenance, the C1-C4 derivation, and whether
      known-false controls are rejected have not received independent
      scientific review. These are distinct load-bearing joints.
    alternative_not_selected: >-
      Editing or retrospectively completing the original validator chain
      would assert custody events that did not occur. Its rows remain blocked.
  ruling:
    - >-
      Freeze the SCURVE L5 review plan at
      coordination/review/scurve-l5-20261011/review-plan.yaml before any
      reviewer starts. The plan records the producer's exact C4 sentence,
      a Coordinator prior, owned joints J1 provenance, J2 blind arithmetic,
      J3 controls/scope, worked attacks, mutual blindness, a known-false
      object and a blind rederivation. Three separate independent sessions
      use review-adversarial at xhigh. J2 goes first, from its handoff's
      blind_inputs alone in a scratch bundle without plan, producer tree or
      repository history; even the producer commit message reveals the
      verdict. Each reviewer attests exact reads and per-joint verdict.
    - >-
      Open a write-once same-batch twelve-row queue at
      coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/dispatch_queue.review-20261011.json.
      Copy the sealed six rows unchanged. Append three reviewer rows, each
      directly depending on completed custody archive 071e47, plus review
      snapshot archive 35c1b4 depending on all three, Coordinator composition
      task 83ded3 depending on that archive, and ledger archive 5583d9
      depending on 83ded3. Keep max_concurrent one. Each nonarchive reviewer
      has exactly one archive owner, 35c1b4; 83ded3 is owned by 5583d9.
      Historical producer, snapshot, validator and ledger rows stay blocked.
    - >-
      Bind the sealed queue and new queue hashes in the write-once addendum
      coordination/goals/GOAL-SCURVE-48e06c/lanes/BATCH-aa389e.review-20261011.json.
      The old lane pointer and all prior addenda remain unchanged; pass the
      new queue path explicitly to dispatch and goal_lanes. Verify official
      research_dispatch.py --ready-only --claims refs before any claim.
    - >-
      TASK-20261011-b8c0e5 owns the exact eleven-path opening packet containing
      this decision, seven handoffs, plan, queue and lane addendum. Fetch and
      inspect origin/main immediately before its commit, verify its first
      parent, exact paths and hashes, then write a separate one-path durable
      opening receipt binding that commit and verify its own commit. Push
      both, refresh the existing ready PR and stop. No reviewer is dispatched
      in the opening act.
    - >-
      After three completed reviewer releases, 35c1b4 snapshots their exact
      reports, replay files, diagrams and PDFs. Nonarchive Coordinator task
      83ded3 then runs check_review_independence.py on the frozen plan and
      three attestations before composing drafts for scoped evidence
      EV-SCURVE-d7611c, decision DEC-20261011-de289e, a fresh checkpoint
      and a visual report. Archive 5583d9 writes and binds the three canonical
      ledger records from those drafts after 83ded3's release. Those
      future IDs reserve output
      paths; their outcome is not prewritten. Keep historical batch
      checkpoint and goal head outside 83ded3 and 5583d9's write ownership;
      any head
      update requires a separate task.
  rationale:
    - >-
      The custody seal makes exact bytes reviewable, while preserving the
      original missing release and snapshot. A new review chain has honest
      dependencies; the old validator card cannot be dispatched as written.
    - >-
      Source binding, mathematical derivation and control discrimination can
      fail independently. One owner for each joint and a blind arithmetic
      session make the later verdict interpretable.
    - >-
      A control whose conclusion is known false tests whether the certificate
      argument proves too much. The positive target and null controls alone
      cannot supply that check.
