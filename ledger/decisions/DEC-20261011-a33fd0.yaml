  context: >-
    The new custody archive TASK-20261011-071e47 is completed in the
    write-once six-row sealed queue. Its generic content-first binding and
    SCURVE receipt verify the existing report and producer bytes. The old
    producer TASK-20261001-762c5f has no completed release, the original
