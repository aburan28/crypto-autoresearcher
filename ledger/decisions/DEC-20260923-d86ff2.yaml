  rationale:
    - >-
      THE EVIDENCE CANNOT DISCRIMINATE. The hypothesis is about the ideal
      degree per arm at m = 5, its p-independence, and a cost band at
      p = 2^64. None of these was measured. The m = 5 absence covers arms (ii)
      and (iii) at p' = 4111 on the EcGFp5-shaped curve under an 11 GiB
      RLIMIT_AS. It is an infrastructure boundary of one construction, one
      solver and one host. Under AGENTS.md core rule 5 it is not evidence that
      D is large. The m = 4 random-target cells measure decomposition-test
      cost, with D undefined. The supplementary D values are planted-orbit
      sizes. This is the plain definition of inconclusive.
    - >-
      EVEN A COMPLETED RUN COULD NOT HAVE DISCRIMINATED UNDER THIS PROTOCOL.
      - K5: arm (iii) as built has arm (ii)'s support and, in the computed
        analogues, arm (ii)'s degree. So F1 would fire by construction if it
        ever completed.
      - K7: the frozen constants (D_raw ~ 2^20, D_torsion ~ 2^20/1920, band
        2^121-2^132) describe the wrong system, so a correct measurement
        scored against them would read as a falsification.
      - K6: F3 cannot be scored with the proxy.
      These are protocol defects, not evidence about the mechanism. A rerun
      needs a versioned protocol_amendment BEFORE it runs. The frozen
      invalidation rule forbids editing the prediction after any run without
      one. Designing that amendment is TASK-20260923-aa277e. This act does not
      approve it.
    - >-
      WHY NOT WEAKEN. The re-anchored design-note arithmetic places a genuine
      torsion quotient at 2^134.4 (D^2) to 2^152.7 (5 D^3), and at 2^144.3 to
      2^162.6 with the inverse success probability charged. The hypothesis's
      band edge "below 2^135" would therefore not hold under the note's own
      model. But that is the design note's model re-anchored, not a
      measurement. The hypothesis exists to replace that model with measured D
      and measured per-PDP cost, and its ratio predictions (D_raw/D_torsion
      >= 2^9) SURVIVE re-anchoring (2^26.9 / 2^16 = 2^10.9). An adverse
      transition on model arithmetic alone would be premature. The strongest
      checkable artifact available is a derivation (K7), and it bears on the
      prediction's ANCHOR, not on the measured quantity. The premise is
      corrected (CORR-20260923-27ce4f), and the restated prediction is owed to
      the amendment.
    - >-
      WHY NOT REFINE. The hypothesis's statement does need restating (K7
      premise, K5 mechanism). But the restatement is inseparable from the
      re-anchored prediction and the new arm (iii), which are the amendment's
      deliverables. Recording `refine` here would pre-empt a design this act
      is not allowed to approve. The transition records what the EVIDENCE
      shows, which is nothing either way. The restatement follows in the
      amendment act, under CORR-20260923-27ce4f and CORR-20260923-064d0d.
    - >-
      THE LANE IS MORE OPEN, NOT LESS. In the red team's square analogues
      (toy, reviewer scratch; n = m = 3 reproduced by the dispatcher; n = m = 4
      not reproduced), a genuine F_p-rational (Z/2)^{m-1} x| S_m quotient
      realised the predicted 2^{m-1} drop exactly: 64 -> 16, and 4096 -> 512.
      At m = 5 that construction is about 10x sparser (at most 1287 + 792
      monomials against 20349) than the system that exhausted the cap. No
      reading of this run set as "the 2-torsion symmetrization does not help"
      or "EcGFp5's 128 bits holds" is admissible. Either would be a closure
      claim routed to review-breakthrough, and neither is made. Conversely,
      the re-anchored 2^134.4 figure is below the design note's 142, and it
      is NOT a finding about EcGFp5's security. Any record that reads it as
      one must be routed to review-breakthrough before promotion.
    - >-
      THE PRIOR, READ HONESTLY. The modal prior (0.70) was: "nothing about D,
      DFLAT or the band established; absence correctly classified; pipeline at
      m <= 4 sound; anchor control failed on its literal band; arm (iii)
      cannot test the 2-torsion symmetrization; the proxy cannot carry
      flatness or F3; the premise needs an amendment". That came back almost
      exactly. Agreement with a recorded, non-blind prior is weak evidence.
      Here each joint's verdict rests on an artifact the reviewer built:
      - an independent anchor derivation with an identical F4 trace;
      - a crash reproduction;
      - committed identical supports and square-analogue degrees;
      - measured CPU and instruction counts;
      - frozen-text quotations with a degree derivation;
      - an exact enumeration against the producer's path.
      Beyond the prior, the round found the 11 GiB cap and the attempt-counter
      defect, the two silent loss paths in the m = 4 driver, and a CONCRETE
      replacement construction for arm (iii). The prior anticipated none of
      them.
    - >-
      EXP-GFPN-659e34 (/run candidate since DEC-20260923-885c52). Its m = 4
      driver is the one object A tested: it is not grossly defective at
      p' = 11 (13 against 11.29), so the precondition failure the plan feared
      did not occur. But the round found two things. First, the driver's two
      silent paths reclassify solver outcomes as non-decompositions; their
      effect is negligible at p' >= 2^10 by extrapolation, but that is
      untested. Second, its planned arm (iii) is the same norm construction
      (CORR-20260923-064d0d; H-GFPN-3366ea), which by K5 costs the same as S4
      and decomposes about 8x less often. Running it as frozen would spend
      the rate-ladder budget on an arm that cannot show what its label says.
      /run EXP-GFPN-659e34 therefore waits for TASK-20260923-aa277e's ruling
      on its arm (iii) and on flagging the two silent paths. Evidence: K5,
      object A, OOS-3 and OOS-6 of TASK-20260923-404bf9. Test boundary: m = 4
      at n = 5, p' = 11 for object A. Revisit: at the archive of the TASK-20260923-aa277e
      deliverable. Successor: the same /run with arms (i) and (ii) unchanged.
      This is a sequencing hold, not a closure.
    - >-
      IDEA-20260920-0490f5 (THM_QUOTIENT_DESCENT1). Its DEC-20260921-683a85
      revisit condition, "reranked above IDEA-20260920-10547b's freeze if a
      reviewer of EXP-GFPN-05ff43 questions which translations act on the m=5
      symmetrized system", is MET by K5. It is reranked above the 10547b
      freeze, and its lemma is an input to TASK-20260923-aa277e. Its card is
      not minted here: the one next act is the amendment design, which reads
      the lemma.
    - >-
      Rho lane (IDEA-20260920-68b279): its revisit condition ("heur_dflat_pass
      recorded for any arm") is NOT met, because every arm is not_applicable.
      The hold is unchanged.

