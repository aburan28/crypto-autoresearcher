coordinator_decision:
  id: DEC-20260806-7839b5
  context: >-
    GOAL-SSIQ-001 BATCH-010 -- the second batch under the extended
    campaign_budget (maximum_batches 8 -> 12, this session, on user
    direction). Executed resume action item (1) from DEC-20260806-498531:
    formally archive the delta_E label-permutation null control (first run
    informally in BATCH-009 by the Red Team, 30 trials/prime, and
    independently reproduced by the Coordinator, 15 trials/prime) as an
    immutable, pre-registered, 1000-trials-per-prime run record, via a
    frozen v7 amendment (specification_v7.yaml, after TWO pre-freeze
    review rounds). Recorded as EV-SSIQ-a64d92, on TASK-20260806-08f905
    ADMIT-WITH-CONDITIONS and TASK-20260806-497010 CHALLENGE (narrow).
  decision: support
  decision_note: >-
    support: the formal 1000-trials-per-prime null control is genuinely,
    non-trivially executed and non-trivially strengthens BATCH-009's
    informal finding on precision and tail-characterization grounds,
    independently confirmed by the Validator (true C-REPRO via two
    from-scratch re-executions) and the Red Team (a from-scratch
    cross-comparison against the informal figures). The Red Team's
    CHALLENGE was narrow and entirely about record-keeping, not execution:
    a confound (PF-6) correctly named in the frozen spec's prose was not
    propagated into the archived result's own machine-readable boundary
    text, and a prior decision's high-confidence language predated that
    same confound. Both gaps are closed in this decision and its evidence
    record, not by editing any immutable artifact.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-a64d92
    - TASK-20260806-fde273
    - TASK-20260806-08f905
    - TASK-20260806-497010
  evidence_refs:
    - EV-SSIQ-a64d92
    - EV-SSIQ-0fc992
  rationale:
    - id: D-1
      statement: >-
        THE FORMALIZED NULL CONTROL IS GENUINE, IMMUTABLE, AND
        INDEPENDENTLY REPRODUCIBLE. The Validator re-executed the archived
        script twice from clean scratch directories, reproducing every
        one of the 4000 permutation trial values byte-for-byte -- true
        C-REPRO, not a self-report. The restored two-part coverage/graph-
        rebuild check (fixed during pre-freeze review after being silently
        weakened in an earlier draft) passes on all four primes, and
        REAL_DEPTH0_FRACTION reproduces RUN-SSIQ-a85692-f's own archived
        ANOM-1 figures exactly.
      confidence: high
    - id: D-2
      statement: >-
        THE FORMAL RESULT STRENGTHENS CONFIDENCE IN THE SIGNAL'S
        EXISTENCE ON TWO SPECIFIC AXES, NOT MERELY BY BEING A BIGGER
        VERSION OF THE SAME CHECK. Precision: means converge to within
        ~1 percentage point across three independently-sized samples (15,
        30, 1000 trials), confirming the informal result was not a lucky
        small-sample draw. Tail characterization: the formal run newly
        establishes PER-PRIME MARGINS between the null distribution's
        observed maximum and the real data's 100% (23.1/45.9/48.7/40.9
        percentage points), the first time this campaign has measured how
        close a random permutation can plausibly approach the real result
        -- information the smaller informal samples were underpowered to
        supply. p=2437's margin (23.1 points) is the tightest and is named
        explicitly, not folded into an undifferentiated "far below 100%"
        claim.
      confidence: high
    - id: D-3
      statement: >-
        THIS STRENGTHENING DOES NOT EXTEND TO MECHANISM, AND THE PRIOR
        RECORD'S LANGUAGE MUST BE QUALIFIED GOING FORWARD. PF-6 (named
        during this batch's own pre-freeze review) is a confound the
        permutation control cannot, by construction, rule out: whether
        the observed spatial clustering of delta_E reflects genuine
        mathematical structure or an artifact of the delta_E search
        procedure's own shared, sequentially-advancing RNG. This confound
        is correctly stated in the frozen contract's prose but was absent
        from the archived result's own machine-readable boundary text --
        a genuine propagation gap the Red Team caught and this decision
        closes. DEC-20260806-498531's own D-2 rationale ("genuine
        structural fact," confidence: high) predates PF-6 and is not
        itself defective, but must not be extended unqualified to this
        batch's result: the accurate framing, adopted here, is "a real,
        control-confirmed clustering signal of undetermined cause."
      confidence: high
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is NOT retired.
    - >-
      PF-6's confound (delta_E-search-procedure artifact vs. genuine
      near-Lipschitz graph-spatial structure) is UNRESOLVED. No run in
      this campaign has performed the discriminating control (a probe
      delta_E re-search with per-vertex-independent, freshly-seeded RNG).
    - >-
      "Genuine spatial autocorrelation... as a new... structural fact"
      (DEC-20260806-498531 D-2's language) is SUPERSEDED, for any future
      citation of this specific control result, by this decision's
      narrower framing: "real, control-confirmed clustering signal of
      undetermined cause." DEC-20260806-498531 itself is not retracted or
      corrected -- it was accurate given what was known at BATCH-009's
      close, before PF-6 existed.
    - >-
      NULL_EXCEEDS_OR_EQUALS_REAL_COUNT == 0/4000 must be cited with its
      per-prime margins, never as an undifferentiated bare zero.
    - >-
      The funnel-structure mechanism question (DEC-20260806-498531's
      next_actions item (2)) remains untouched by this batch.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
      Model independence remains absent and unverifiable. Evidence
      strength stays capped at preliminary campaign-wide.
  next_actions:
    - >-
      RANKED, FOR BATCH-011: (1) [highest value, PF-6's own named
      falsification test] a probe re-run of the delta_E search for a
      SUBSET of vertices using per-vertex-independent, freshly-seeded RNG
      (removing compute_delta_e.py's shared, sequentially-advancing
      rng_search instance and its shrinking per-vertex time budget), then
      re-apply this exact permutation-null procedure against the probe's
      delta_map -- if the graph-edge spatial-autocorrelation signal
      persists, PF-6's confound is ruled out and DEC-20260806-498531 D-2's
      "genuine structural fact" language becomes fully supported for the
      first time; if it weakens substantially, the current signal is at
      least partly a search-procedure artifact. NOTE: unlike every prior
      batch since BATCH-005, this action requires NEW delta_E search
      (even if only a small probe subset) -- it is NOT zero new search
      cost, and its budget must be sized and justified explicitly in its
      own frozen contract, not inherited from this batch's zero-cost
      framing; (2) [second, unchanged from BATCH-009's own deferral]
      the funnel-structure mechanism question (a depth operationalization
      with demonstrated non-degenerate variance) remains the second-
      ranked open question, likely informed by whatever (1) finds about
      delta_E's resolution-dependence; (3) [deferred, unchanged reasoning]
      widening to larger primes/N stays deferred until (1)-(2) give an
      evidence-based reason to expect different behavior.
      L4 remains the only lever whose ceiling meets this goal's target and
      still the top priority, unchanged. Any future amendment goes through
      its own pre-freeze review(s) with GD-11/GD-12's standing repairs
      applied, PLUS: any control-derived empirical finding's stated
      caveats/confounds must be propagated into every artifact a future
      reader might consult first (the archived result's own machine-
      readable fields, not only the frozen contract's prose), and any
      decision record extending a prior batch's high-confidence language
      must explicitly re-check whether a later-discovered confound now
      qualifies it.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is preliminary (session-only
      independence), below this campaign's replicated/strong bar for
      promotion. An ELEVENTH KNOWLEDGE CANDIDATE is now queued
      campaign-wide, distinct from the prior ten: "a control's own named,
      deferred confound (stated correctly in a frozen contract's prose)
      must be propagated into every machine-readable artifact a future
      citation is likely to consult first, not left to a reader who
      happens to open the full specification text -- and a decision
      record's own confidence-qualified language, once a new confound is
      discovered, must be explicitly re-checked and qualified for any
      later citation, not silently carried forward." All eleven promote
      together when a genuinely independent model becomes available to
      re-check them.
  decided_by: coordinator
  decided_at: '2026-08-06'
