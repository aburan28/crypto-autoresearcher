  context: >-
    Design-approval cycle on H-ECDLP-bd1572, filed 2026-10-09 (PR #2023,
    merged) with five review_required contracts. The user asked, in their
    own words, for the next coordinator steps on this battery to be done.

    Capacity accounting. python3 tools/portfolio_kpis.py --capacity
    GOAL-ECDLP-001 reported approved_unrun 7, cap 3, headroom 0, the
    seven being EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
    EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5 and
    EXP-SMTH-9d04ba. Their approvals date from 2026-08-03 to 2026-09-13;
    none has an implementation directory, a trial-plan.json or a run
    directory (each verified by listing experiments/<id>/ and recorded
    under withdrawals above). DEC-20261007-027d70, DEC-20261007-e6a276
    and DEC-20261007-fade50 each declined to retire any of them and left
    their own contracts review_required. This decision withdraws all
    seven under withdraws_experiments (7 standing, 7 withdrawn, 0
    remaining) and approves three (end state 3 approved-unrun, equal to
    the cap). The withdrawals are capacity acts under "Approval is bounded
    by execution"; each keeps its frozen protocol text, its hypothesis
    keeps its status, and each carries a revisit condition.

    Why these three. EXP-ECDLP-2535ec is the L0 positive control against
    which every curve-side contract is interpreted; its own
    decision_impact says a failing cell reclassifies the curve-side
    results on that prime pair as untested, so it must run first or with
    the others. EXP-ECDLP-6dacdb (L1, HEUR-002) and EXP-ECDLP-15534c
    (L3, HEUR-001) are the cheapest fully runnable curve-side limbs
    (2 and 3 advisory CPU hours) and each has a committed launcher.
    Together the three give the battery its control and one limb on each
    side of the hypothesis's "only door" claim.

    Why not the other two. EXP-ECDLP-3e8403 (L3, HEUR-003) is complete
    and its launcher is committed, but it is the 8 CPU-hour contract and
    the goal sits at the cap after three approvals; it is deferred to the
    next slot, not refused. EXP-ECDLP-28ad87 (L2) has launcher.command
    null in its frozen specification and its implementation/run.py is
    being written in parallel by an executor task; a contract not
    runnable when the decision is written stays review_required with the
    reason recorded.

    Protocol-completeness check on each approved contract. Non-null
    fields present in all three specifications: id, hypothesis_id,
    question_id, goal_id, version, designed_at, title, claim_tier, limb,
    objective, inputs, controls, independent_variables, metrics.primary,
    metrics.secondary, preregistered_prediction (quantity, formula,
    source), scale_relevance (tier, justification), tail_checks,
    replication (seeds, independent_instances), budget (enforcement,
    wall_clock_seconds_per_run, total_cpu_hours, maximum_memory_gb,
    maximum_runs), stopping_rules, invalidation_rules, success_criterion,
    falsification_criterion, decision_impact (on_positive, on_negative),
    required_artifacts, launcher.command, launcher.runnable_state_at_design
    and assigned_to; EXP-ECDLP-15534c additionally carries
    heuristic_under_test HEUR-001. The one null field in each is
    scale_relevance.correspondence, declared null by design (no Deuring or
    other correspondence is used). approved_by was null before this
    decision and is set by it.

    Runnability. Each approved contract's runnability rests on a committed
    implementation/run.py, check.py and primeset.py (plus queue.json
    pointing at the executor card) that the design session smoke-tested
    at reduced size with no run record written. The frozen trial plan
    experiments/<id>/trial-plan.json is written by the design session
    after this decision's specification edits; the executor cards carry
    the literal placeholder TRIAL_PLAN_SHA256_PENDING until that plan is
    frozen and hashed. No cell of any frozen contract was executed before
    this approval.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-contract user confirmation was requested; the user's request that the next coordinator steps be done is honoured by acting, not by asking.
    - The capacity condition of "Approval is bounded by execution" is met only by retiring the seven stale contracts; approving past the cap without a withdrawal list would be refused by validate_ledger.py.
    - The runnability condition is met for the three approved contracts by committed launchers; it is not met for EXP-ECDLP-28ad87, and EXP-ECDLP-3e8403 would exceed the cap.
    - Each approved contract names its reachable negative before any run (an interval including 1, a rejecting pre-registered test or an open transfer door, a non-uniform defect with the anomalous control passing), so success is not automatic.
    - The positive control is approved in the same act as the curve-side limbs it conditions, so a null curve-side result cannot be read without the row that says the primes are special.
    - A withdrawal of an approved-but-unrun contract is neither evidence nor a failure of its hypothesis (AGENTS.md, "Approval is bounded by execution", last sentence), so no hypothesis status moves with it.

  evidence_refs: []
  limitations:
    - Toy scale only, 13-40 bit primes and 16-bit curve censuses; no cost at any deployed size is measured or extrapolated, and no attack on any curve is claimed or attempted.
    - The k* transfer thresholds in EXP-ECDLP-6dacdb use recalled L(1/3) constants with the o(1) dropped; they are optimistic and are used only to size a gap, never as a key-size statement.
    - The Joux-Pierrot and Barbulescu-Duquesne structural ingredients of H-ECDLP-bd1572 remain provenance recalled until a reader session upgrades them; this approval does not upgrade them.
    - The seven withdrawals are capacity acts, not scientific verdicts; each withdrawn contract's frozen protocol text and hypothesis status are untouched.
    - A timeout, crash or resource_exhaustion in any approved run is failed_infrastructure and is not a value of any metric.
    - This decision authorizes later executions. It does not start one, and it does not dispatch any executor card.

  next_actions:
    - Dispatch TASK-20261010-2659fd (EXP-ECDLP-2535ec), TASK-20261010-ab5786 (EXP-ECDLP-6dacdb) and TASK-20261010-249c4f (EXP-ECDLP-15534c) via /run only after the TASK-20261010-83f19b snapshot commit is pushed and each card's dispatch_preconditions hold; not from the session that wrote this decision.
    - Approve EXP-ECDLP-3e8403 by a new decision when one of the three approved contracts has run and a capacity slot frees.
    - Approve EXP-ECDLP-28ad87 by a new decision after its implementation/run.py, check.py and primeset.py land in a committed snapshot and tools/newest_experiments.py reports execution_state ready, subject to capacity.
    - The two recalled citations (Joux-Pierrot 2013; Barbulescu-Duquesne 2019) are being filed as KN-LIT-1624b6 and KN-LIT-30605a by a retrieval task in the same packet; a later reader session may upgrade the hypothesis's provenance by a new record naming itself in verified_by.
    - Interpret no curve-side result before the EXP-ECDLP-2535ec row on the same prime pair is read.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Design approval only. No run, no evidence record and no durable
      finding; the withdrawals carry no scientific content to promote.

