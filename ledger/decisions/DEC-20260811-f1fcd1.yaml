  context: >-
    BATCH-080a9c froze EXP-SYC-b11b38 as a zero-run static successor to
    EXP-SYC-12de89 and required fresh independent review of five repair items.
    Validator TASK-20260811-6b1bfb and Red Team TASK-20260811-d42301 used
    distinct verified review-adversarial xhigh sessions and both returned
    REVISE. This decision records the narrow ledger disposition required by
    TASK-20260811-16e5da.

  decision_scope: >-
    Decide only whether EXP-SYC-b11b38 may advance to implementation. No
    experiment ran, and both review reports set implementation_authorized and
    execution_authorized false. This decision changes no hypothesis, research
    question, experiment, or goal status and makes no ECDLP security,
    asymptotic, performance, or cryptographic-scale claim.

  target_ids: [GOAL-ECDLP-001, BATCH-080a9c, H-SYC-b854f4, EXP-SYC-b11b38]
  evidence_ids: [EV-ECDLP-c055e7]

  source_snapshot_commits:
    design: 2ca69be4f08c348ecc4a922e5ec18c1b0a3fa218
    design_parent: 9ad0c3b74708cf6bd21c852ff052de1a5bb2994b
    validator_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/reviews/TASK-20260811-6b1bfb/review-report.yaml
    validator_sha256: 50168e5e2fe5f06afc348f3d9535026e1444058b2507f585d40088497782eeb3
    validator_runtime_receipt_sha256: ed77c5bcee4d4a0cd55642bd1245150b37b9d6d42f6ff435988042136b6c2b18
    red_team_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/red-team/TASK-20260811-d42301/red-team-report.yaml
    red_team_sha256: 5a3e1b4a1731de90c0c0bd7d06cd4ede65a74b5d628073c36eebaadb472e446e
    red_team_runtime_receipt_sha256: ae6e83ac9a41f0271821c98a09346edffb9e5874814b03b9f37477e38db61f33

  rationale:
    passing_design: >-
      The successor honestly and materially repairs the HA-2 mean calibration
      and correspondence, fixes the bits=27 literal, records RT-OBJ3/RT-OBJ4
      as open and deferred, preserves the prior eight-way shard equalization
      and exact deterministic occupancy/overflow rules, and withdraws the
      unjustified peak_live_bytes invariance claim. The immutable snapshot and
      both independent runtime bindings verify cleanly. These are genuine
      static-contract improvements.
    blocking_design: >-
      A mean is not a tail certificate. The Red Team's same-mean two-law
      counterexample shows capacity 32 can overflow while satisfying the
      disclosed HA-2 mean. No valid maximum-over-98304-tuples bound exists,
      and every deterministic bound exceeds 32. The eight-way BSGS
      peak_live_bytes axis still lacks an analytic bound or complete census.
      Archive, communication, and output remain over unchanged hard caps by
      3256009664, 3285369792, and 7132160 bytes. Validator and Red Team both
      return REVISE; under the frozen queue, either verdict alone blocks
      implementation.
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: >-
        Both mandatory independent reviews returned REVISE, and three
        implementation-admission gate classes remain open. No message or
        disclosure can substitute for a frozen passing contract.

  experiment_disposition:
    status: review_required
    action: park_pending_explicit_revisit_conditions
    experiment_runs: 0
    implementation_exists: false

  next_actions:
    - >-
      Do not author or dispatch EXP-SYC-b11b38 implementation. Park this
      lineage until a fresh approved static successor supplies: (1) a finite
      per-tuple tail and simultaneous-capacity certificate or fully propagates
      a widened capacity; (2) an analytic or complete all-eight-shard BSGS
      peak_live_bytes contract; and (3) lossless archive, communication, and
      output fit or a separately justified Coordinator cap amendment. The
      immediate bounded campaign action is a new Coordinator frontier rerank
      from committed records. That rerank may select a different correctness
      gate, but it confers no implementation or execution authority until a
      new batch, frozen handoff, and required review exist.

  restart_condition: >-
    Revisit EXP-SYC-b11b38 only when all three named admission classes have a
    concrete zero-run resolution proposal. Reranking another frontier lane is
    allowed after this archive; silently relaxing caps, tails, or review is not.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No experiment, theorem, implementation, or cryptanalytic result exists.
      EV-ECDLP-c055e7 is neutral, inconclusive, zero-run static-design evidence
      and does not meet the bar for a knowledge finding.

  claim_ceiling: >-
    One more zero-run static repair and two independent REVISE reviews exist in
    the EXP-SYC lineage. No solver, attack, speedup, security impact,
    asymptotic result, cryptographic-scale result, closure, or breakthrough is
    supported.

  official_research_state_changed: true
  official_state_change: >-
    BATCH-080a9c closes with outcome
    revise_pre_implementation_mean_and_disclosure_repairs_with_capacity_residuals.
    GOAL-ECDLP-001 and RQ-ECDLP-002 remain active; H-SYC-b854f4 remains
    specified; EXP-SYC-b11b38 remains review_required.
  hypothesis_status_transition: none
  experiment_status_transition: none

  limitations:
    - No finite-tail model, peak measurement, or cap reconciliation was supplied or inferred by the Coordinator.
    - The differing Validator and Red Team wording on whether disclosure closes the peak specification is preserved; both agree the underlying peak comparison remains unmeasured and both overall verdicts are REVISE.
    - The bits=21 HA-2 final displayed decimal needs an explicit serialization rule in any successor, but it does not affect this REVISE disposition.
    - No affected-versus-safe scheme list or concrete cryptographic cost table is asserted or promoted.

  decided_by:
