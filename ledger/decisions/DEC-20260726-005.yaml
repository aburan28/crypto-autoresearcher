coordinator_decision:
  id: DEC-20260726-005
  context: >-
    EXP-IC-001 v2 (528 runs, 8-36 bit, 3 seeds, B=14, m=2, K=10) executed under
    a frozen, approved protocol with clean code (dirty: false). The calibration
    fix (total_group_operations) and S_rel correction ((N/B)*T_desc) from the
    v1 review were applied. The T_desc/sqrt(N) ratio decreases monotonically
    from 10,055 (8-bit) to 32 (36-bit), confirming the hypothesis direction.
    1/24 instances has finite K* (seed 2 at 36-bit, ratio 0.17). The success
    criterion (>= 2/3 seeds at any bit size) is not met; the falsification
    criterion (all K* = infinity) is also not met.
  decision: inconclusive
  target_ids:
    - H-IC-001
    - EXP-IC-001
  rationale:
    - >-
      The T_desc/sqrt(N) ratio decreases monotonically as predicted, from ~10,000
      at 8-bit to ~32 at 36-bit. This is a 300x decrease, strongly supporting the
      hypothesis direction.
    - >-
      1/24 instances has finite K* (seed 2 at 36-bit, where N is large enough
      that sqrt(N) ~ 184K >> T_desc ~ 32K). This is a proof of concept that the
      crossover can occur at toy scale, but it is not replicated across seeds.
    - >-
      inconclusive is chosen over support because the pre-registered success
      criterion (>= 2/3 seeds at any bit size) is not met. Only 1/3 seeds at
      36-bit cross the threshold, due to Hasse-bound variation in N.
    - >-
      inconclusive is chosen over weaken because the trend is clearly in the
      predicted direction and one instance does achieve finite K*. The hypothesis
      is not wrong — it is under-sampled at the critical boundary.
    - >-
      The result is implementation-bound: T_desc in group-ops depends on the
      relative overheads of sympy Buchberger and Python rho. A faster Groebner
      implementation would lower T_desc_gops, making the crossover easier.
  evidence_refs:
    - EV-IC-001
    - EV-FCP-003
  limitations:
    - Toy scale only (max 36 bits); implementation-bound (sympy vs Python rho)
    - B=14, m=2 only; all Groebner solves on trivial ideals
    - Only 3 seeds at 36-bit; Hasse-bound variation in N is large
    - S_rel heuristic not directly measured at bits >= 16
  next_actions:
    - >-
      Increase the sample at 36-bit: run 10+ seeds to find more instances where
      N is large enough for sqrt(N) > T_desc_gops. Expected: ~30% of 36-bit
      instances should have N > 1.6×10^9 based on Hasse-bound analysis.
    - >-
      Alternatively, test at 40-bit where sqrt(N) ~ 1M >> T_desc ~ 32K for all
      seeds, but instance generation is slow (~262s per instance). A faster
      point-count (SEA algorithm) would be needed for practicality.
    - >-
      Alternatively, test with a faster Groebner implementation (e.g., Sage's F4
      if available) to lower T_desc_gops and shift the crossover to smaller bit
      sizes where more seeds can be run.
    - >-
      If not pursuing further: H-IC-001 remains inconclusive; the 528 runs
      contribute a preliminary finding that the T_desc/sqrt(N) ratio decreases
      ~300x across 8-36 bits and one instance achieves finite K* at 36-bit.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-IC-001 is preliminary empirical evidence (empirical_only, toy scale,
      implementation-bound, 1/24 instances with finite K*). The decreasing ratio
      is a descriptive observation, not a proven result. No durable finding is
      established until the crossover is replicated across >= 2/3 seeds.
  decided_by: coordinator
  decided_at: "2026-07-26T13:00:00-07:00"
