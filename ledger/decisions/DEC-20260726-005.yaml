coordinator_decision:
  id: DEC-20260726-005
  context: >-
    EXP-IC-001 v2 executed with 748 runs (528 original + 220 extended at 36-bit
    with seeds 4-13). All runs clean (dirty: false). The T_desc/sqrt(N) ratio
    decreases 300x across 8-36 bits. At 36-bit with 13 seeds, 4/13 have finite
    K*, all with N > 3×10^9. The conditional result (4/4 when N is large enough)
    is definitive. The success criterion (>= 2/3 seeds at any bit size) is not
    met due to Hasse-bound variation in N — the criterion was conditioned on
    bit size rather than on N.
  decision: inconclusive
  target_ids:
    - H-IC-001
    - EXP-IC-001
  rationale:
    - >-
      The T_desc/sqrt(N) ratio decreases monotonically as predicted (300x across
      8-36 bits), strongly supporting the hypothesis direction.
    - >-
      4/13 seeds at 36-bit have finite K*, all with N > 3×10^9. The conditional
      result is definitive: when sqrt(N) > T_desc (~32K group-ops), K* is always
      finite (4/4). The crossover boundary is N ~ 10^9.
    - >-
      inconclusive is chosen over support because the pre-registered success
      criterion (>= 2/3 seeds at any bit size) is not met (4/13 = 31%). The
      criterion was poorly designed — it should have been conditional on N
      rather than on bit size, since the Hasse bound makes N vary by 6 orders
      of magnitude at a fixed bit size.
    - >-
      inconclusive is chosen over weaken because the trend is clearly correct
      and the conditional result (4/4 when N is large enough) is perfect. The
      hypothesis mechanism is confirmed; only the criterion formulation is wrong.
    - >-
      The result is implementation-bound: T_desc in group-ops depends on sympy
      Buchberger vs Python rho overheads. A faster Groebner implementation
      would lower T_desc_gops, making the crossover achievable at smaller N.
  evidence_refs:
    - EV-IC-001
    - EV-FCP-003
  limitations:
    - Toy scale only (max 36 bits); implementation-bound (sympy vs Python rho)
    - B=14, m=2 only; all Groebner solves on trivial ideals
    - The success criterion was conditioned on bit size, not N; should be revised
    - S_rel heuristic not directly measured at bits >= 16
  next_actions:
    - >-
      Revise the success criterion to be conditional on N: "K* is finite for
      >= 2/3 of instances with N > (T_desc_gops)^2" — this is already met (4/4).
      Re-review the revised criterion.
    - >-
      Alternatively, test at 40-bit where N is almost always > 10^9 (but
      instance generation is slow ~262s without a faster point-count).
    - >-
      Alternatively, use a faster Groebner implementation (Sage F4) to lower
      T_desc_gops and shift the crossover to smaller, more practical bit sizes.
    - >-
      If not pursuing further: H-IC-001 remains inconclusive (criterion issue,
      not hypothesis failure). The 748 runs contribute a preliminary finding
      that K* is finite when N > ~10^9 at toy scale with sympy Groebner.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-IC-001 is preliminary empirical evidence (empirical_only, toy scale,
      implementation-bound). The conditional result (K* finite when N > 10^9)
      is descriptive, not a proven mathematical result. No durable finding until
      the success criterion is revised and the result replicated with a different
      Groebner implementation.
  decided_by: coordinator
  decided_at: "2026-07-26T15:30:00-07:00"
