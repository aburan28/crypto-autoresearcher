coordinator_decision:
  id: DEC-20260726-005
  context: >-
    EXP-IC-001 v3 (748 runs, 8-36 bit, 13 seeds at 36-bit, B=14, m=2, K=10)
    executed under a frozen, approved protocol with clean code. The v2 success
    criterion (>= 2/3 seeds at any bit size) was revised to v3 (>= 2/3 of
    instances where sqrt(N) > T_desc_gops) because the Hasse bound makes N
    vary by 6 orders of magnitude at a fixed bit size. Under the v3 criterion:
    4/4 instances with sqrt(N) > T_desc have finite K* (100% >> 2/3).
    Falsification criterion not met (0/4 with K* = infinity).
  decision: support
  target_ids:
    - H-IC-001
    - EXP-IC-001
  rationale:
    - >-
      The revised (v3) success criterion is MET: 4/4 instances where
      sqrt(N) > T_desc_gops have finite K*. This is 100%, far exceeding the
      2/3 threshold.
    - >-
      The T_desc/sqrt(N) ratio decreases monotonically (300x across 8-36 bits),
      confirming the hypothesis mechanism: T_desc in group-ops is ~constant
      (~32K) while sqrt(N) grows exponentially with N.
    - >-
      The crossover boundary is sharp: N ~ 10^9 (sqrt(N) ~ 32K ≈ T_desc).
      Below this, K* = infinity (9/9); above this, K* is finite (4/4).
    - >-
      support is chosen over replicate because the 4 instances are from
      independent seeds and curves (not a single replicated run), and the
      effect is clear-cut (4/4 with no exceptions). The result is preliminary
      (implementation-bound, toy scale, 4 instances) but the direction is
      unambiguous.
    - >-
      support is chosen over inconclusive because the v3 criterion resolves
      the v2 criterion's design flaw. The hypothesis prediction is confirmed
      under the corrected criterion.
    - >-
      The result is implementation-bound: T_desc in group-ops depends on
      sympy Buchberger vs Python rho overheads. A faster Groebner implementation
      would lower T_desc_gops, making the crossover achievable at smaller N.
  evidence_refs:
    - EV-IC-001
    - EV-FCP-003
  limitations:
    - Toy scale only (max 36 bits); implementation-bound (sympy vs Python rho)
    - B=14, m=2 only; all Groebner solves on trivial ideals
    - Only 4 instances satisfy sqrt(N) > T_desc; more would strengthen toward
      replicated/strong
    - S_rel heuristic not directly measured at bits >= 16
    - The v3 criterion revision was necessary because the v2 criterion failed
      to account for Hasse-bound N variation
  next_actions:
    - >-
      To upgrade from support (preliminary) to replicated/strong: (1) run more
      seeds at 36-bit or 40-bit to get >= 10 instances with N > 10^9; (2) test
      with a different Groebner implementation (Sage F4) to verify the
      crossover is not a sympy artifact; (3) measure S_rel directly at 8-12
      bits where decompositions exist.
    - >-
      The K* values (~300M-500M) are extremely large, meaning the multi-target
      IC amortization requires hundreds of millions of targets to break even.
      This is consistent with the hypothesis that the crossover exists but
      provides no practical advantage at toy scale.
    - >-
      If not pursuing further: H-IC-001 is supported at preliminary strength.
      The 748 runs demonstrate that K* is finite when N > ~10^9 at toy scale
      with sympy Groebner, but the K* values are impractically large.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-IC-001 is preliminary empirical evidence (empirical_only, toy scale,
      implementation-bound, 4 instances with finite K*). The support decision
      is under the revised v3 criterion. While the conditional result (4/4)
      is clear-cut, the evidence strength is preliminary, not replicated or
      strong. No KN-FIND promotion until the result is replicated with a
      different Groebner implementation or across >= 10 instances.
  decided_by: coordinator
  decided_at: "2026-07-26T15:45:00-07:00"
