  context: >-
    /design-experiment plus /propose-ideas, one cycle. IDEA-20261006-688a37
    is on origin/design/ectd-e7ad98-conductor and is not on origin/main.
    The question is RQ-ECDLP-4fcbd3. No hypothesis or experiment on
    origin/main cites that full id. The branch design/ecdlp-688a37 was
    created from origin/main at
    cd2471e93113e228f3daabaee4bc2d3044bb8c98 and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob 51b7c6c2d2c4b08264742473401566e857c5e7cc.

    The contract freezes p = 2053, the cubics y^2 = x^3 + x + 1 and
    y^2 = x^3 + x + 2, and the prefixes {2, 5, 11}. Success is the
    source idea's prediction that Z_1*N_2 and Z_2*N_1 differ by at
    least 1, after both models are nonsingular and ordinary. The
    concrete negative is that the instrument checks pass and the two
    products are equal. No curve was enumerated in this session.

    This session opened KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-cd86f5,
    KR-RHO-6239aa, and KR-RHO-6654ba. Those records are not a
    measurement of this gap.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when the products are equal under the stated instrument
    conditions, and it is also not confirmed when the search is
    unmeasured.

    The same pass files three proposals and does not design them:
    IDEA-20261006-5899d8, IDEA-20261006-64c06d, and
    IDEA-20261006-576825.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - Equal cross products, with the instrument checks passed, are reachable as a recorded outcome, so success is not automatic.
    - The ordinary-pair check, the presence of (0, 1), the two addition chains, the frozen prefix set, and the label permutation kept out of Z_i are the instrument controls.
    - An instrument failure is not relabeled as rate equality, and a count N_i = 2054 is not relabeled as a gap.
    - This session did not enumerate a curve and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one prime and two named cubics. It does not transfer to a larger field.
    - A nonzero gap does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A singular model, a count N_i = 2054, and a missing point (0, 1) are not the negative.
    - An instrument failure is not a rate.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
