coordinator_decision:
  id: DEC-20260908-80895f
  recorded_at: '2026-09-08'
  context: >-
    Under /design-experiment (no proposal named by the user), the Coordinator
    ranked the open proposals under RQ-RELN-61638a: three of the four
    2026-09-06 idea-generator records already have hypotheses and experiments
    (IDEA-20260906-1f6bfe -> H-RELN-427bfd -> EXP-RELN-141a86, currently
    executing Stage 1; IDEA-20260906-d1494b -> H-RELN-41562a ->
    EXP-RELN-f202be, inconclusive; IDEA-20260906-79ff48 -> H-RELN-10ad6b ->
    EXP-RELN-82f487, two of three cells executed). The remaining open
    proposal, IDEA-20260906-b26c06 (a learned search-policy record for the
    ECDLP solve and linear-algebra channels), self-assigns
    recommended_priority: low with an explicit sequencing note ("designed
    only once the two predecessors have reported") and an estimated_cost of
    implementation: high, compute: high ("core-days to core-weeks").
  decision: expand
  target_ids:
    - H-RELN-246a2f
    - EXP-RELN-715aa1
    - IDEA-20260906-b26c06
  rationale:
    - >-
      Approves H-RELN-246a2f (hypothesis) and EXP-RELN-715aa1 (frozen
      experiment contract) under the standing user authorization in
      AGENTS.md for Coordinator-ranked next-candidate selection -- no
      per-idea user approval is required.
    - >-
      Given the idea's own high implementation/compute cost estimate and
      this session's directly-observed environment instability (EXP-RELN-
      141a86's Stage 1 has restarted its container 20+ times), the approved
      scope is deliberately narrow: Stage 0 ONLY -- a zero-compute, pure
      closed-form re-derivation of the existence-channel oracle ratio, the
      planted-control predicted gain, and the da1428 k-ladder table, cross-
      checked against already-committed EXP-FB3-001 data. This is exactly
      the proof_search_map's own "cheap pre-compute falsification check"
      discipline (docs/inventor-protocol.md section 8, KN-TECH-080):
      verifying the record's stated closed-form premises before authorizing
      any instrumented-solver implementation or policy-training compute.
    - >-
      Stages 1-4 of the idea's own minimal_test design (the instrumented
      Buchberger/F4 solver, the MDP wrapper, policy training, and the
      symbolic-regression extraction in the alive branch) are explicitly
      NOT authorized by this decision or by EXP-RELN-715aa1's contract.
      Authorizing them requires a separate, future Coordinator expand
      decision, informed by Stage 0's own results and by whatever the
      environment's demonstrated restart behavior looks like at that time --
      including, at minimum, budgeting for the same checkpoint-resume
      discipline this session had to retrofit into EXP-RELN-141a86's
      Stage 1 (commit 46fe1eca9) after multiple restart cycles wasted
      redundant compute, built in from the start instead.
    - >-
      This does not wait on EXP-RELN-82f487's undelivered third seed cell
      (predictor panel): Stage 0 touches neither the target-selection
      channel that cell would inform (H-RELN-246a2f reduces that channel
      away, per the idea's own reduction argument) nor any live compute
      channel; its cost is negligible regardless of that cell's outcome.
  evidence_refs:
    - IDEA-20260906-b26c06
    - EV-RELN-335cd2
    - EV-RELN-cc045d
    - EV-RELN-99c688
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage1-grammar/manifest.yaml
  limitations:
    - >-
      This decision authorizes design and Stage-0 execution only. It does
      not authorize the instrumented-solver build, any policy training, or
      any claim about the constant-Gamma hypothesis itself, which Stage 0
      alone cannot confirm or refute.
    - >-
      The proposal's own sequencing note (designed after both predecessors
      report) is only partially satisfied -- EXP-RELN-82f487's third cell
      remains undelivered. This decision judges that gap immaterial to
      Stage 0 specifically, not resolved.
    - >-
      This decision does not approve, alter, or bear on EXP-RELN-141a86 or
      any other experiment under RQ-RELN-61638a.
  next_actions:
    - >-
      Dispatch the executor to run EXP-RELN-715aa1's Stage 0 per its own
      contract and handoff TASK-20260908-788e3b.
    - >-
      On Stage 0's return, run the contract's later_review_requirements
      before any claim-changing use, and bring any expand decision on
      Stages 1-4 back to the Coordinator explicitly, not implied by Stage
      0's outcome alone.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a design/approval decision; no evidence has been produced
      yet.
  decided_by: coordinator
  decided_at: '2026-09-08'
