coordinator_decision:
  id: DEC-20260807-5adc24
  context: >-
    User directive "run /run-experiment until all experiments are done."
    Survey of every experiments/*/specification.yaml with status: approved
    found 188 records; 170 already carry run directories (already executed,
    status field simply never advanced) and 18 have zero runs. Before
    dispatching any of the 18, this Coordinator checked, for each, not only
    the literal fields run-experiment's own step 1 gates on (status:
    approved, approved_by set) but whether a real ledger record actually
    corroborates the approval those fields assert. That check is not
    optional here: it is exactly what surfaced the finding below, and
    trusting the field alone would have dispatched compute against contracts
    this program had already explicitly refused to run, or never actually
    approved at all.
  decision: pause
  decision_label: >-
    block_execution_pending_approval_repair_on_six_of_eighteen_never_run_approved_contracts
  target_ids:
    - EXP-HZM-001
    - EXP-MLKEM-008
    - EXP-PMA-001
    - EXP-SEMAEV-002
    - EXP-JMV-001
    - EXP-JMV-004
    - ledger/handoffs/TASK-20260727-009.yaml
    - ledger/handoffs/TASK-20260727-013.yaml
    - ledger/handoffs/TASK-20260727-011.yaml
    - ledger/handoffs/TASK-20260727-010.yaml

  the_finding:
    fabricated_citation_group: >-
      Four handoffs -- TASK-20260727-009 (EXP-HZM-001), TASK-20260727-013
      (EXP-MLKEM-008), TASK-20260727-011 (EXP-PMA-001), and TASK-20260727-010
      (EXP-SEMAEV-002) -- each carry `authorized_by: "DEC-20260727-002"`.
      DEC-20260727-002 is a real, existing decision record, but it is about
      GOAL-ECDLP-001's campaign-budget extension (maximum_batches 6 -> 8) and
      TASK-20260727-002 through -006, a five-task batch under an entirely
      different goal. It contains zero occurrences of any of these four
      experiment IDs, their hypothesis IDs, or their (distinct) goal_ids
      (GOAL-CRYPTO-001, GOAL-MLKEM-001, GOAL-CRYPTO-001, and goal_id: "null"
      respectively -- none of them GOAL-ECDLP-001). A repository-wide search
      of every file under ledger/decisions/ for each experiment's own ID and
      its hypothesis ID returns ZERO further hits for all four: no other
      decision record mentions any of them, under any ID, anywhere. The
      citation is not merely imprecise -- it points at a real record that is
      substantively unrelated, and no substitute real record exists to
      repair it with. Verified independently by direct grep, not inferred.
    misattributed_citation_group: >-
      EXP-JMV-001 and EXP-JMV-004 (both version 2, both dated approved_at
      2026-07-26) each carry `approved_under: "DEC-20260726-001 ... and
      DEC-20260726-003"` with named binding conditions C1, C2, D1, D2, D3.
      Both cited decisions exist as real files. DEC-20260726-001 is about
      EXP-FCP-001 (a fixed-curve preprocessing pilot, decision: pause).
      DEC-20260726-003 is about EXP-FCP-002/EXP-FCP-003 (decision: weaken,
      H-FCP-001). Neither mentions JMV, H-JMV-001, H-JMV-002, or RQ-JMV-001
      anywhere. A repository-wide search for "JMV" across every file in
      ledger/decisions/ returns zero hits. Same defect shape as the group
      above: a specific, checkable, false citation, not an absent one.
    what_this_is_not: >-
      This is not a claim that H-HZM-001, H-MLKEM-008, H-PMA-001,
      H-SEMAEV-002, H-JMV-001, or H-JMV-002 are wrong, uninteresting, or
      improperly designed -- this decision makes no assessment of their
      scientific content at all, and none of their specification.yaml files
      were found to be internally inconsistent, self-contradictory, or to
      violate the frozen-contract discipline documented elsewhere in this
      program. The defect is narrow and specific: the RECORD OF APPROVAL
      cannot be verified against any real corroborating decision, for a
      status transition (draft/review_required -> approved) that AGENTS.md
      reserves to the Coordinator alone and that this program's own
      discipline (docs/task-lifecycle.md, the design-experiment skill's
      "the Coordinator runs an isolated snapshot archive task that commits
      the selected proposal, hypothesis, frozen specification, and handoff")
      treats as requiring a real, checkable act, not merely a field value.

  distinguishing_this_from_the_program's_existing_exclusions: >-
    Twelve of the eighteen never-run "approved" experiments were screened
    out of this dispatch batch for reasons already fully documented
    elsewhere in the ledger and requiring no new finding here:
    EXP-ECDLP-03a8c9 and EXP-SSI-eca132 (approved_by literally null, caught
    by run-experiment's own step-1 gate); EXP-SSI-697354 ("cannot be
    executed as frozen" per DEC-20260806-a00a28, repaired as successor
    EXP-SSI-9b542d, which has already run); EXP-SSI-001 (explicit, repeated
    "do NOT launch EXP-SSI-001" across DEC-20260730-036 through -040 and
    others); EXP-SMTH-9d04ba (explicit, repeated "Do NOT execute
    EXP-SMTH-9d04ba" in DEC-20260803-773f21 and DEC-20260803-ab50fb, which
    instead authorize its sibling EXP-SMTH-c83476, already executed in
    BATCH-033); EXP-IC-002 (two independent REVISE verdicts; both reviewers
    concluded no run arm could change a conclusion already fixed by
    arithmetic over EXP-IC-001; execution "never authorized and never
    occurred" by explicit user direction of 2026-07-27, per DEC-20260727-008
    and DEC-20260728-005); EXP-ICEX-146ff5 (its own governing decision
    DEC-20260806-e91b0f states status approved_execution_withheld, directly
    contradicting the specification file's plain status: approved -- a
    live discrepancy this decision also flags but does not resolve, since
    resolving it is not this decision's business and guessing which side is
    current would be exactly the kind of unilateral repair AGENTS.md rule 15
    warns against).
    Those twelve were each excluded FOR A REASON THIS PROGRAM ALREADY WROTE
    DOWN, discoverable by reading the target and its citations. The six
    named in target_ids above are different in kind: nothing in the program
    said not to run them. Their specifications and handoffs affirmatively
    assert Coordinator approval under a citation, and the citation is false.
    That is a weaker signal to find (a grep against every file returns
    nothing, which looks like silence, not a red flag) and a more serious
    one once found, because it means the "approved" status of six real,
    frozen, substantively serious contracts currently rests on nothing
    checkable.

  also_recorded_not_blocking: >-
    EXP-DTREE-001 and EXP-FIB-001 (both approved 2026-07-27, both citing a
    real source_proposal that was independently verified to exist -- IDEA-
    20260726-005 and IDEA-20260726-003 respectively) had NO handoff record
    and NO decision record of any kind, but also no FALSE citation -- there
    was nothing to check that turned out wrong, only an absent paper trail
    on an otherwise internally consistent, plausible approval. This
    Coordinator judged that gap non-blocking (unattested, not misattested)
    and minted the missing handoffs itself (TASK-20260807-e91a4c,
    TASK-20260807-b62d4f) rather than pausing them, disclosing the gap in
    each handoff's own constraints field rather than silently filling it in.
    Recorded here so the distinction between "no citation" and "false
    citation" is explicit and auditable, not an implicit judgment call
    buried in a dispatch log.

  rationale:
    - >-
      pause, not reject_scoped: nothing here tests or falsifies any of the
      six hypotheses. There is no measurement to weigh. The block is
      administrative -- an unverifiable approval record -- and reject_scoped
      would misrepresent this as a scientific finding about H-HZM-001,
      H-MLKEM-008, H-PMA-001, H-SEMAEV-002, H-JMV-001, or H-JMV-002, none of
      which this decision touches.
    - >-
      pause, not supersede: there is no new specification to supersede the
      old one with. Superseding implies a repaired successor already exists;
      here the repair is exactly what has not yet happened.
    - >-
      Not silently re-approved and dispatched: doing so would let a false
      citation stand uncorrected in the permanent record while also spending
      real executor compute against it, compounding the original defect
      with a second one this Coordinator would have authored.
    - >-
      Not silently deleted or edited in place: the specification and handoff
      files are left exactly as found. AGENTS.md rule 4 (results are
      immutable, corrections create new records) and rule 15 (an identifier
      remap is a last resort) both counsel against editing a record to erase
      evidence of the defect; this decision is the correction, and the
      defective citation stays visible in the original files for whoever
      repairs them next to see exactly what was wrong.

  evidence_refs: []
  limitations:
    - >-
      This decision surveyed only the 18 never-run "approved" experiments
      relevant to this dispatch. It does not audit the citation integrity of
      the other 170 approved-with-runs experiments, nor of any evidence,
      hypothesis, or knowledge record. The defect pattern found here
      (a real, well-formed decision ID cited for an unrelated experiment) is
      concerning enough that a broader citation-integrity sweep is a
      reasonable future action, but this decision does not claim to have
      performed one.
    - >-
      This decision does not determine HOW the fabricated citations arose --
      whether from a template default never customized, a copy-paste from a
      sibling task, or something else. No mechanism is asserted; only the
      observed defect and its verification method are recorded.
    - >-
      The EXP-ICEX-146ff5 status-field discrepancy (approved vs.
      approved_execution_withheld) is flagged here as a data point in the
      same audit pass but is NOT resolved by this decision; it was already
      excluded from this batch on that basis alone, independent of this
      decision's target_ids.

  next_actions:
    - >-
      Repair each of the six target contracts as a versioned successor
      record (per AGENTS.md rule 15, never an in-place edit): re-run the
      design-experiment approval lifecycle with a real, checkable Coordinator
      decision citing the correct target experiment by ID, or explicitly
      re-derive why the original approval should stand without a decision
      record (e.g., if this program's provenance convention genuinely
      changed over time and a decision record was never the requirement for
      some class of contracts -- that would itself need to be stated and
      cited, not assumed).
    - >-
      Once repaired, these six become eligible for a future /run-experiment
      dispatch under normal process. This decision blocks them; it does not
      reject their science.
    - >-
      Consider whether TASK-20260727-002 through -006 (the batch
      DEC-20260727-002 actually authorized) are the tasks these four
      handoffs' authors intended to reference, and whether a records-linkage
      error at handoff-minting time (rather than at approval time) is the
      root cause -- worth checking before assuming the underlying approvals
      never happened at all.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a process/governance-integrity finding about record-keeping,
      not a research result. It produces no durable scientific claim to
      promote into knowledge/findings/; the six target contracts remain
      exactly as scientifically undetermined as they were before this
      decision, only now with their administrative blocker made explicit.

  decided_by: coordinator
  decided_at: '2026-08-07'
