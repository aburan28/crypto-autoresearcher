  context: >-
    BATCH-099: Hybrid MITM-decomposition analysis. AM-GM lower bound: two-table MITM
    requires |A|+|B| ≥ 2*sqrt(N). Index calculus cannot replace one table for prime-order
    curves. Hybrid formally closed.

  decision: close_hybrid_confirm_complete_classical_barrier
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    **HYBRID MITM-DECOMPOSITION: CLOSED** by AM-GM lower bound.

    **COMPLETE CLASSICAL BARRIER** established after 99 batches:
    For generic prime-field ECDLP on prime-order curves with cryptographic parameters:

    | Algorithm class | Status | Obstruction |
    |----------------|--------|-------------|
    | Pollard rho / BSGS | Achieves N^{1/2} (optimal) | AM-GM / GGM lower bound |
    | k-way MITM (k≥3) | Worse than BSGS | Cost O(N^{(k-1)/k}) > N^{1/2} |
    | Hybrid MITM+index calculus | Reduces to BSGS | AM-GM + no prime-order index calculus |
    | Semaev/Gaudry-Diem index calculus | Subexponential, NOT sub-rho | Yield ≤ heuristic (H-PSEUDO empirical) |
    | Anomalous/MOV/Weil-descent | Closed | Excluded by curve selection |
    | GGM oracle classes (C,D) | Closed | Shoup lower bound |
    | Discrete Morse combinatorial | Closed | Betti-Yield duality → H-PSEUDO |
    | Wesolowski transfer | Closed | Quaternion algebra absent |
    | All other families | Closed | Multiple independent analyses |

    **ONE REMAINING DIRECTION**: H-PSEUDO (factor base with super-heuristic density).
    This is the UNIQUE unblocked path to sub-rho classical prime-field ECDLP.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    Push comprehensive PR. Then BATCH-100: look at whether there is any path to proving
    H-PSEUDO that exploits the specific structure of SMALL PRIMES p (where EC multiplication
    sequences have provably better equidistribution than for large p). If H-PSEUDO can be
    proved for SPECIFIC small-prime classes (beyond k=2 MOV curves), it would be a partial
    progress toward the full conjecture.

  knowledge_promotion:
    promoted: []
    not_warranted: Hybrid analysis is a completion of the MITM family analysis.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
