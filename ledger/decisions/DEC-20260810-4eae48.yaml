coordinator_decision:
  id: DEC-20260810-4eae48
  goal_id: GOAL-MCE-001
  batch_id: BATCH-73a1b7
  batch_id_note: >-
    Recorded against the currently-open batch. This decision opens NO new batch
    and consumes none of the campaign's remaining budget beyond the single
    handoff it dispatches; batches_used stays "3 of 6".

  context: >-
    On 2026-08-10 the user surfaced a new IACR ePrint report, 2026/1630,
    "Quasipolynomial Cryptanalysis of the McEliece Cryptosystem (or: PIR Meets
    McEliece)" (Ghoshal, Ishai, Jain, Sun; received 2026-08-07, posted
    2026-08-10). Its relayed abstract claims a simple classical
    quasipolynomial-time distinguisher for Goppa--McEliece in the asymptotic
    "Classic McEliece" regime -- m = Theta(log n), t = Theta(n/log n),
    k = Theta(n), time n^O(log n), advantage 1-o(1) against uniform over
    F_2^{k x n} -- described by the abstract as PROVABLE, extended
    HEURISTICALLY to an n^O(log n) ciphertext-decryption attack recovering the
    message from a noisy codeword, with claimed applicability to all Classic
    McEliece parameter sets considered in the NIST process at "improved (though
    not yet practical)" concrete estimates, and with a stated origin in a FAILED
    attempt to build doubly efficient PIR from algebraic locally decodable
    codes.

    THE ACQUISITION IS WEAK AND IS RECORDED AS WEAK. The abstract above reached
    this program through the orchestrating session's WebFetch tool against the
    landing page, which renders a page and answers a prompt over it USING A
    SMALL SUMMARIZING MODEL. It is a TOOL RELAY, not a byte-exact transcription
    this program can re-verify, and it is materially weaker than the
    transcription-at-recorded-sha256 standard KN-LIT-c41d8b holds itself to. THE
    FULL TEXT WAS NOT OBTAINED: three attempts on the PDF endpoint (curl bare ->
    Cloudflare "Just a moment..." interstitial, 5402 bytes, text/html, no PDF
    bytes; curl with a browser user-agent -> HTTP 403, 5423 bytes, text/html;
    WebFetch -> "The server returned HTTP 403 Forbidden"). No PDF bytes were
    ever received, so NO sha256 of the full text exists and none is recorded
    anywhere in this decision or its artifacts (AGENTS.md rule 5).

    This decision records the ingestion, carries the correction the ingestion
    forces on this goal's scoping premise, and sets the goal's next action. It
    is authored by a Coordinator subagent with no shell; the orchestrating
    session performs the archival commit, and NOTHING HERE IS DURABLE UNTIL
    THAT COMMIT IS MADE, PUSHED, AND ACCEPTED BY THE POST-COMMIT VERIFIER
    (AGENTS.md "Durable research commits").

  decision: expand
  decision_note: >-
    `expand`, chosen against the template's enumerated values and defended
    against each of them.

    WHY `expand`. GOAL-MCE-001's objective closes "A break is not an objective
    and is not expected" and frames the reachable deliverable as
    frontier-reading plus a memory-charged ISD baseline. A third party now
    claims a provable distinguisher IN THIS GOAL'S OWN TARGET REGIME. The
    correct and only supportable response is to widen the research direction's
    scope to include assessing and independently reproducing a distinguisher in
    that regime -- which is what `expand` names: a direction gets larger, and no
    claim about the world is asserted by the act. CORR-20260810-c487ff carries
    the scope change; this decision authorises it and routes the work.

    WHY NOT THE OTHERS. `support` and `weaken` are evidence verdicts and
    presuppose evidence -- there is none: no EV-* record exists for 2026/1630,
    an abstract is not evidence, and this program has not read the paper.
    `reject_scoped` is doubly forbidden here (nothing is being rejected, and the
    coordinator contract forbids reject_scoped on unreplicated empirical-only
    material in any case). `approve` names an experiment approval; this decision
    approves NO experiment. `revise` sends a producer's work back for rework;
    no producer's work is under review. `replicate` orders a re-run of an
    existing internal result; there is none. `pause` would be a
    steering-away-from-a-live-lead failure under AGENTS.md rule 9, at the exact
    moment the lead became most live. `supersede` is close but wrong at the
    record level: nothing here replaces a record wholesale -- one FIELD of one
    goal record is corrected, and corrections are their own record type
    (CORR-20260810-c487ff), which this decision carries rather than duplicates.

    WHAT `expand` DOES NOT MEAN HERE. It does not mean the claim is believed,
    disbelieved, or assessed. It means the door this goal had closed is
    reopened, and the first thing behind it is a retrieval problem.

  target_ids: [GOAL-MCE-001, RQ-MCE-e65b3c]
  also_targets_by_path:
    - knowledge/literature/KN-LIT-7baf07.md
    - ledger/corrections/CORR-20260810-c487ff.yaml
    - ledger/handoffs/TASK-20260810-025f09.yaml
    - ledger/goals/GOAL-MCE-001/goal.yaml (mutable next_action only)
  also_targets_note: >-
    GOAL-MCE-001.objective is NOT edited; CORR-20260810-c487ff is the durable
    gloss on it. Only the goal's mutable next_action field is updated, and it
    ends up carrying BOTH DEC-20260809-769359's required fix AND the new lane,
    with both decision ids cited. No hypothesis, evidence, question, or
    knowledge record other than the new KN-LIT-7baf07 is created or edited.

  authorization_boundary: >-
    STATED EXPLICITLY SO IT CANNOT BE READ WIDER THAN IT IS. This decision:
    APPROVES NO EXPERIMENT -- no experiment contract is frozen, no EXP-* record
    exists, and TASK-20260810-025f09 dispatches a baseline-and-control
    measurement, not an approved experiment against 2026/1630;
    PROMOTES NO EVIDENCE -- no EV-* record is created, touched, or upgraded, and
    EV-MCE-3d6e9a's proof_status stays `empirical_only`;
    MOVES NO HYPOTHESIS -- GOAL-MCE-001.active_hypothesis_ids stays EMPTY, and
    no hypothesis exists for this goal to move;
    CLOSES NOTHING -- no research direction, batch, question, or goal is closed,
    paused, retired, or superseded;
    RELAXES NO CEILING -- RQ-MCE-e65b3c's TOY claim-tier ceiling is untouched
    and binds every deliverable produced under the expanded scope;
    AND IS NOT ADMISSIBLE TOWARD A CLOSURE QUORUM -- it is one Coordinator
    subagent in one session, no attestation is obtained, claimed, or
    synthesisable from it, and AGENTS.md's "never record an attestation you did
    not obtain" binds regardless of the quorum's suspension.

  rationale:
    - id: D-1
      what: >-
        The ingestion is recorded as a literature entry whose CITATION ONLY is
        verified, with the weak acquisition path spelled out rather than
        softened.
      why: >-
        AGENTS.md rule 5 forbids fabricating or estimating what was not
        obtained, and rule 9 (CLAUDE.md summary) forbids letting a live lead go
        unrecorded. Filing the claim at its true provenance discharges both: the
        corpus gains the pointer, and nobody downstream can mistake a
        summarizing model's rendering of a landing page for a transcription.
        KN-LIT-7baf07 states in its own frontmatter that it is materially weaker
        than KN-LIT-c41d8b's standard, lists the three exact fetch failures, and
        records that NO sha256 of the full text exists.
      evidence: >-
        knowledge/literature/KN-LIT-7baf07.md (frontmatter
        citation_verified_note; sections "Key claims (as reported)" and "Not
        verified here").
    - id: D-2
      what: >-
        The claim class is `distinguish-then-recover`, and the recovery half is
        MESSAGE recovery, not key recovery.
      why: >-
        The relayed abstract claims both a distinguisher (called provable) and a
        heuristic ciphertext-decryption attack recovering the message from a
        noisy codeword. TAG-CLAIM-CLASS-v2.md's `distinguisher` token is defined
        as claiming "no key or message recovery", which this paper's second
        result contradicts, and `key-recovery` would be affirmatively false.
        R-CC-2's token is therefore the only admissible one, and R-CC-2's
        mandatory `## Claim class` body section carries the message-vs-key
        distinction the vocabulary itself cannot express -- there is no
        `message-recovery` token, and this decision does not authorise inventing
        one. RQ-MCE-e65b3c's "Distinguisher is not break" constraint binds in
        both directions here.
      evidence: >-
        knowledge/literature/KN-LIT-7baf07.md section "Claim class";
        knowledge/TAG-CLAIM-CLASS.md section 1; knowledge/TAG-CLAIM-CLASS-v2.md
        sections 1-2; RQ-MCE-e65b3c.constraints.
    - id: D-3
      what: >-
        The claimed regime is NOT the regime this program's filed distinguisher
        line addresses, and that is why the filed line does not already cover
        the claim.
      why: >-
        KN-LIT-3c9f21 (superseding KN-LIT-13a01d on tags) records the FGOPT
        distinguisher as "Confined to high rate", with the threshold itself
        never transcribed by this program. The relayed asymptotics here give
        redundancy n-k = m*t = Theta(log n)*Theta(n/log n) = Theta(n), hence
        rate bounded away from 1 -- not the high-rate regime. This is the
        Coordinator's reading of a relayed abstract, is labelled as such in
        KN-LIT-7baf07, fixes no constant, and states no distance; it is a
        qualitative non-coverage finding, not a measurement.
      evidence: >-
        knowledge/literature/KN-LIT-7baf07.md section "Position relative to what
        this program already filed"; KN-LIT-3c9f21; KN-LIT-13a01d; KN-LIT-84b674
        (where Classic McEliece's transcribed parameters live, unused here).
    - id: D-4
      what: >-
        KN-LIT-c41d8b's Goppa exclusion does not rule this claim out, and is
        invoked in KN-LIT-7baf07 only with the qualification RQ-MCE-f8fca0
        requires.
      why: >-
        The 2024 result is generic-alternant and its Goppa exclusion is, by its
        own authors' words quoted at RQ-MCE-f8fca0 Q-2/Q-3/Q-4, phase-scoped to
        the filtration step, present-tense ("right now"), explicitly "not a
        proof", and conjectured to fall. It is a statement by different authors
        about their own attack and transfers to nothing else. The point this
        makes is purely negative -- no filed record rules the new claim out --
        and confirms nothing about it. Invoking the exclusion bare would repeat
        GOAL-MCE-001's fourth-recorded failure mode.
      evidence: >-
        KN-LIT-c41d8b ("What this correction does NOT establish");
        RQ-MCE-f8fca0 Q-2, Q-3, Q-4; GOAL-MCE-001.known_hazards (fourth entry).
    - id: D-5
      what: >-
        The goal's scoping premise is corrected by CORR-20260810-c487ff as a
        REVISIT CONDITION FIRING under AGENTS.md rule 9, not as a finding of bad
        faith.
      why: >-
        The original scoping named its evidence, budget, boundary and remaining
        uncertainty and was a defensible bet on the field as of 2026-08-03. Rule
        9 permits exactly that, on condition that a revisit condition be
        recorded; "a break is not expected" carries the implicit condition
        "unless somebody publishes an attack in this regime", and somebody now
        claims to have. Leaving the dismissal-side sentence standing unqualified
        while a claimed distinguisher in the goal's own target regime sits in
        the corpus would be the steering failure rule 9 exists to prevent.
        GOAL-MCE-001.objective is NOT edited (AGENTS.md rule 4); the correction
        record is the durable gloss.
      evidence: >-
        ledger/corrections/CORR-20260810-c487ff.yaml (prior_value,
        corrected_value, reason); GOAL-MCE-001.objective; AGENTS.md
        "Research-direction integrity and auditability".
    - id: D-6
      what: >-
        The dispatched work is a NULL-OBJECT CONTROL and a baseline, not an
        implementation of anything in 2026/1630.
      why: >-
        docs/inventor-protocol.md's "controls before belief" makes any reported
        signal an artifact until the identical measurement has been run against
        a null object of the same shape. This program currently has NO measured
        distinguishing statistic at Classic McEliece's parameters at all -- only
        unread corpus entries. IDEA-20260808-3d3be9's value therefore went UP,
        not down: running the published polynomial-time square-code statistics
        at the ISO-scoped sets against matched random and alternant nulls builds
        the instrument and the control against which any future claim in this
        regime -- 2026/1630's or anyone's -- must be read. It implements nothing
        from a paper this program has not read.
      evidence: >-
        ledger/proposals/IDEA-20260808-3d3be9.yaml (minimal_test, controls,
        falsification_conditions); ledger/handoffs/TASK-20260810-025f09.yaml;
        docs/inventor-protocol.md ("controls before belief").
    - id: D-7
      what: >-
        The PIR/LDC-to-McEliece link this paper reports as its origin is a lens
        this program's corpus does not contain, and that is recorded as a
        checkable process fact.
      why: >-
        Greps run for KN-LIT-7baf07 over knowledge/ on 2026-08-10: 31 literature
        entries mention PIR (62 occurrences), 180 mention
        McEliece/Goppa/alternant, and the two file sets DO NOT INTERSECT; the
        phrase "private information retrieval" appears outside
        knowledge/literature/ only in the generated corpus manifests.
        KN-TECH-080's mandatory audit 2 (observation-collision test) is the
        cheap pre-compute search that looks for exactly this kind of
        cross-cluster link, and it was never run across these two clusters. This
        is recorded WITHOUT the claim that running it would have produced the
        result -- cheap audits are falsification aids, not generators -- and
        without self-flagellation; it is a true statement about what this corpus
        does and does not contain.
      evidence: >-
        knowledge/literature/KN-LIT-7baf07.md section "The lens this program did
        not cross"; knowledge/techniques/KN-TECH-080.md (Mandatory cheap audits,
        item 2; Epistemic status).

  evidence_refs: []
  evidence_refs_note: >-
    DELIBERATELY EMPTY. No evidence record supports this decision because none
    exists: an abstract relayed through a summarizing tool is not evidence, and
    no run, measurement, or independent check of any claim in 2026/1630 has been
    made by anyone in this program. The decision rests on a literature entry
    whose citation only is verified (KN-LIT-7baf07) and on a correction to a
    goal record (CORR-20260810-c487ff), and it claims nothing that would require
    evidence.

  limitations:
    - >-
      THIS PROGRAM HAS NOT READ THE PAPER. Not one sentence of iacr:2026/1630's
      body has been seen by anyone here. The full text was not obtained; the
      three attempts and their exact outcomes are recorded in KN-LIT-7baf07's
      citation_verified_note, and NO sha256 of any primary text exists.
    - >-
      THE ABSTRACT ITSELF IS A TOOL RELAY. It was produced by WebFetch, which
      renders a page and answers a prompt over it using a SMALL SUMMARIZING
      MODEL. It is not a byte-exact transcription and cannot be re-verified from
      this repository. Every quotation in KN-LIT-7baf07 inherits that weakness,
      and it is materially weaker than the transcription-at-recorded-sha256
      standard KN-LIT-c41d8b holds itself to.
    - >-
      NO INDEPENDENT CHECK OF ANY CLAIM IN THE PAPER HAS BEEN MADE. Not the
      distinguisher, not its advantage, not the regime, not the claimed
      applicability to NIST-process parameter sets, not the heuristic recovery
      extension, not the concrete estimates. This decision neither asserts the
      paper is correct nor asserts it is wrong.
    - >-
      A QUASIPOLYNOMIAL DISTINGUISHER WITH CONCRETE ESTIMATES THE AUTHORS
      THEMSELVES CALL "NOT YET PRACTICAL" IS NOT A PRACTICAL BREAK OF ANY
      DEPLOYED PARAMETER SET, AND NO RECORD OF THIS PROGRAM MAY REPORT IT AS
      ONE. n^O(log n) is superpolynomial. A distinguisher is not a key recovery;
      a message recovery is not a key recovery either; and the recovery half is
      heuristic while only the distinguisher is claimed provable.
    - >-
      The regime comparison in D-3 is arithmetic on Theta-notation in a relayed
      abstract. It fixes no constant, this program has never transcribed the
      filed high-rate line's actual threshold, and no quantitative distance to
      Classic McEliece's parameters is stated anywhere in these records.
    - >-
      This decision is one Coordinator subagent in one session, with no shell.
      It has had NO independent review, and none of these records is durable
      until the orchestrating session's archival commit is made, pushed, and
      accepted by the post-commit verifier.

  observations_recorded_not_acted_on:
    - id: O-1
      what: >-
        `python3 tools/claim_class_audit.py` on the clean tree at origin/main
