  rationale:
    - >-
      APPROVAL BASIS. AGENTS.md "Standing user authorization for ideas and
      experiments" (user instruction of 2026-09-06: "all is approved.
      ideas/experiments should be always approved") is standing authorization
      for experiment design and execution in this program. The Coordinator does
      not ask the user to confirm a frozen protocol and did not ask here. User
      authorization is already satisfied. What remains the Coordinator's
      responsibility, and what this decision records, is PROTOCOL READINESS:
      an incomplete protocol is completed or records its concrete technical
      impediment; it never waits for user approval. Designing is not itself
      the scientific verdict.
    - >-
      PROTOCOL READINESS -- COMPLETENESS CHECK PERFORMED, FIELD BY FIELD.
      Every field of experiments/EXP-QSP-82a906/specification.yaml was read
      and confirmed NON-NULL before this decision was written. Named
      explicitly: `id` (= EXP-QSP-82a906), `hypothesis_id` (= H-QSP-411d8f,
      which exists at ledger/hypotheses/H-QSP-411d8f.yaml with status
      `specified`), `version` (= 1), `archived_by` (= TASK-20260917-5bb67b,
      never null), `title`, `status` (= approved), `status_note` (cites this
      decision and the standing authorization of 2026-09-06 AND the
      protocol-readiness check), `source_proposal` (= IDEA-20260916-b84e2d,
      which exists), `objective`, `class` (heuristic-validation / cost-model
      hybrid), `out_of_scope_successor_note` (m>=3 Groebner ladder, n in
      {29, 41}, Weil-descent Semaev control remain successor cells), `inputs`
      (code_reuse, engine_measured_this_session present/absent, field_models,
      chain_builder with explicit S_3 / xi / S0_expanded_char2 / phi /
      n_prime_formula / degree_gate / both M(E) formulas, lambda_lists with
      counted d2_count=2 and d3_count=8 so the executor cannot silently
      narrow, instruments I1/I2/I3, and stage_0 through stage_4), `controls`
      (C1 null, C2a known-collapse, C2b translation calibration, C3
      agreement matrix, C4 successor-not-run), `independent_variables`
      (six), `metrics.primary` (M1-M4) and `metrics.secondary` (M5-M11),
      `heuristic_under_test` (= H1) with `heuristic_under_test_note` scoping
      wall time out of H1, `preregistered_prediction` with all three
      sub-fields `quantity`, `formula` and `source` filled and never to be
      tuned after a run, `scale_relevance.tier` (= toy) / `.justification` /
      `.correspondence` (NONE / direct sampling, filled rather than left
      null), `tail_checks` (five), `replication` with `seeds` (base_seed
      20260917 on C1 only; Stages 0/1, the 20 chain cells and C2
      seed-free) and `independent_instances`, `budget` with `enforcement:
      advisory` and all five numeric fields plus a note (maximum_memory_gb
      4, maximum_workers 1, maximum_runs 6), `stopping_rules` (seven),
      `invalidation_rules` (eight), `success_criterion`,
      `falsification_criterion`, `required_artifacts` (seven),
      `measured_vs_modeled`, `optimistic_assumption_disclosure`,
      `claim_tier_note`, `drafting_provenance`, `assigned_to` (= executor)
      and `approved_by` (= coordinator). The two approval-gate fields that
      tools/validate_ledger.py checks on an `approved` contract --
      `success_criterion` and `falsification_criterion` -- are both present
      and both decidable from the listed metrics alone.
    - >-
      THE CHAIN BUILDER IS FROZEN, NOT GUESSED. KN-LIT-0a321c Section 3.1
      (paper_fulltext.md lines 422-488) defines S^{(0)} := S_{m+1} specialised
      at a target x-coordinate and S^{(k)} := phi(S^{(k-1)}) with
      phi(f) = F^{n'}(f)(lambda(X_1),...,lambda(X_m)); it states S_r has
      degree 2^{r-2} in each variable and does not print S_3 coefficients.
      IDEA-20260916-b84e2d names the model y^2 + xy = x^3 + 1. Semaev ePrint
      2004/031 Remark 1, retrieved this session at
      coordination/pending-ideas/BATCH-fe6992/admission/primary-sources/semaev-2004-031.txt
      lines 171-178, gives f3 = (x1 x2 + x1 x3 + x2 x3)^2 + x1 x2 x3 + 1
      for Y^2 + XY = X^3 + a X^2 + 1, a in {0, 1}. ECC2K-130 is a=0. The
      primary specialisation is the named field element xi=1 in F_2 subset K
      (algebraic only: 1 is not asserted to be the x-coordinate of a
      constructed point). Expanding in characteristic 2 yields
      S^{(0)} = X1^2 X2^2 + X1^2 + X2^2 + X1 X2 + 1, per-variable degree 2,
      matching 2^{m-1} at m=2. Because S^{(0)} and lambda both have F_2
      coefficients, F^{n'} is the identity and S^{(1)} =
      S^{(0)}(lambda(X1), lambda(X2)), per-variable degree 2d. n' = ceil(n/2)
      is frozen (n=17 -> 9; n=23 -> 12) so phi is fully specified even though
      it does not change these coefficients. The Stage 1 degree gate stops on
      mismatch. No protocol impediment remains on the builder. Had the
      coefficients been unrecoverable, this decision would have left
      `approved_by: null` and `status: review_required` naming the missing
      definition; they were recovered, so the contract is approved.
    - >-
      THE SUCCESS CRITERION ADMITS A NEGATIVE OUTCOME, CHECKED. Success is the
      conjunction S0-S5 (Stage 0 gate, Stage 1 degree/identity gate, C3
      agreement on every reported cell, every cell emits deg_elim from both
      implementations, and the pre-registered rho_paper(d=2) versus
      rho_paper(d=3) comparison is computed at every tested n). Each conjunct
      is a comparison of a metric this contract produces against a number or
      a presence-check fixed before any run. SUCCESS MEANS THE MEASUREMENT
      COMPLETED, NOT THAT H1 HOLDS. A completed measurement that fires G1 or
      G2 is still a successful experiment and a scoped refutation of H1;
      that is the valuable outcome. The falsification criterion of H1 (not
      of experimental "success") is G1 (growing deficit: median rho_paper at
      d=3 less than half the d=2 median at any tested n) and G2 (both
      medians < 1/4, or every chain cell at that n identically zero with
      recorded I3). G3/F5 (instrument disagreement or C2a nonzero) invalidates
      the run, never the hypothesis. G4/F6 (timeout, crash, missing compiler,
      memory cap, budget) is infrastructure under AGENTS.md rule 5, never
      evidence. Scope of G1/G2: m=2, tested n in {17, 23}, tested lambda
      class, xi=1, named engines. Not m>=3, not n=131, not (E').
    - >-
      CONTROLS ARE REAL AND INCLUDE A KNOWN-FALSE OBJECT. C1 is a random
      bivariate pair of the same per-variable degrees that is NOT a phi-chain
      (inventor protocol: controls before belief -- if the null also has
      deg_elim << 4d, the signal is artifactual). C2a (d=1, lambda=X) is the
      known-collapse object: at xi=1 with F_2 coefficients, phi is the
      identity, S^{(1)}=S^{(0)}, the Sylvester resultant is forced identically
      zero; any other value invalidates the instrument. This is why the idea's
      d=1 lambda=X slice is NOT a well-defined M(E)=4 calibration, and is
      recorded as such rather than guessed into one. C2b (d=1, lambda=X+1)
      is the well-defined translation calibration, M(E)_paper=4. C3 is the
      two-implementation agreement matrix over all 28 algebraic cells
      (20 chain + 4 C1 + 2 C2a + 2 C2b). C4 (Weil-descent Semaev via Groebner)
      is named as a successor control and is NOT RUN (no engine). A contract
      whose proves-too-much objects were only symbolic was not accepted: C2a
      runs through the same instrument that produces every other degree.
    - >-
      TWO POINTS CANNOT FIT A GROWTH LAW IN m, PRE-REGISTERED. What two d
      values at m=2 CAN decide is written on H-QSP-411d8f and in the
      contract's preregistered_prediction before any run: CONSISTENT WITH H1
      at m=2 (not a validation at m=3,4, not a promotion of (E')) iff at
      every tested n, median_lambda rho_paper(d=2) >= 1/2 AND median_lambda
      rho_paper(d=3) >= 1/2 AND the d=3 median does not drop by a factor of
      2 or more from the d=2 median. REFUTES H1 at these cells iff a growing
      deficit or both medians < 1/4. Never tune after a run.
    - >-
      THE M(E) ENCODING DISCREPANCY IS REPORTED, NOT ADJUDICATED. Paper
      M(E) = 2^{m(m-1)} d^{m(m-1)/2} = 4d at m=2 (KN-LIT-0a321c Appendix A.1,
      exponent split across paper_fulltext.md lines 1029-1032, retrieved this
      session). Historical analysis-note encoding named by IDEA-20260916-b84e2d
      and recorded as prior_value in CORR-20260916-8d0b81:
      2^{m(m-1)} d^{m(m-1)} = 4 d^2 at m=2. At (2,2): paper 8, note 16. At
      (2,3): paper 12, note 36. BOTH columns are pre-registered. H1 uses the
      PAPER formula. Measured deg_elim is compared to both. This decision does
      not decide which encoding is "correct". (The live script
      analysis/qsp-ecc2k130/qsp_ecc2k130.py now matches the paper after
      CORR-20260916-8d0b81; the note column is the historical encoding the
      idea named.)
    - >-
      H1 NEEDS A LOWER BOUND; APPENDIX A.1 GIVES AN UPPER BOUND. H-QSP-645a07's
      H1 needs the eliminant actually M(E), so solving costs at least that.
      Appendix A.1 only says univariate degree "bounded by M(E)" and
      root-finding "can be neglected"; Lemma 3.1 is a big-O; KN-LIT-4fe9d2
      Proposition 7 currently majors kappa by 4.876 -- all UPPER. H-QSP-411d8f
      heuristic_assumptions.H1.supporting_results is deliberately empty. Any
      BKK / mixed-volume generic-attainment statement, if named, is a
      recalled pointer and supports nothing (AGENTS.md rule 9). This
      decision cites no recalled source. The experiment tests the paper's
      UPPER-bound model in the opposite direction H1 needs, at m=2 only.
    - >-
      THE SPLIT OF VALIDATION_EXPERIMENT_IDS IS DELIBERATE AND IS NOT A
      PATCH. H-QSP-645a07 is immutable. Its H1.validation_experiment_ids
      stays empty on that record. H-QSP-411d8f is the hypothesis that
      carries EXP-QSP-82a906 (heuristic_assumptions.H1.validation_experiment_ids
      = [EXP-QSP-82a906]). Filling the parent by editing it is forbidden
      (NA-4). A later Coordinator act may supersede H-QSP-645a07 to name the
      validation experiment after a valid run; that is a new record, not a
      rewrite.
    - >-
      NARROWING VERSUS THE IDEA IS IN SCOPE, NOT A DEFECT. IDEA-20260916-b84e2d
      asked for the Groebner ladder. v1 freezes the cheapest informative cell
      the container can actually run. n in {17, 23} only (29/41 out of v1
      unless a protocol_amendment follows a cheap Stage 0); m=2 fixed; d in
      {2, 3}; 20 exhaustive seed-free chain cells plus 8 control cells.
      Scale_relevance.tier is toy. No transfer to n=131. No attack exponent.
      Claim tier of any later evidence will be toy. ECC unlimited is not a
      license to add m=3 Groebner cells to this version. The successor is
      NA-3, not a silent expansion of v1.
    - >-
      NO CURVE, NO POINT, NO GROUP, NO KEY. Finite-field polynomial arithmetic
      only. The idea's proof obligation "every reported relation is
      re-verified by curve arithmetic" is OUT OF SCOPE: this contract
      measures eliminant degree of S, not ECDLP relations of T. A run that
      constructs a curve is invalid (invalidation_rules). rho on ECC2K-130
      stays 2^60.9 iterations (KN-LIT-096, retrieved this session from
      knowledge/literature/KN-LIT-096.md). No asymptotic_claim. No
      deployed-curve claim.
    - >-
      BUDGET IS COMPLETE AND NO FIELD IS NULL. enforcement `advisory`,
      wall_clock_seconds_per_run 1800, total_cpu_hours 2, maximum_memory_gb 4
      (machine protection, a real limit), maximum_runs 6 (stage invocations,
      not the 28 algebraic cells), maximum_workers 1, plus a note
      distinguishing the advisory time estimates from the real memory and
      concurrency limits per CLAUDE.md's 2026-09-06 research-budget
      instruction. The executor handoff TASK-20260917-66ec2b copies
      wall_clock_seconds 7200, memory_gb 4, maximum_runs 6, all non-null.
      This Coordinator would have rejected its own handoff had any budget
      field been null.
    - >-
      DISPATCH IS ORDERED, NOT IMMEDIATE, AND THIS SESSION MUST NOT LAUNCH.
      The executor handoff TASK-20260917-66ec2b is written but is NOT
      dispatchable until the snapshot archive TASK-20260917-5bb67b has
      committed this contract, this decision, the hypothesis and the executor
      card and the post-commit verifier has accepted them: an official
      transition from uncommitted artifacts is forbidden (AGENTS.md rule 7),
      and an executor reading a specification that exists only in a dirty
      worktree is reading an unfrozen contract. Execution, when it happens,
      is via /run on TASK-20260917-66ec2b, NOT by /coordinate. This design
      session launches no trial and writes no implementation code.
    - >-
      HYPOTHESIS STATUS. H-QSP-411d8f is created at `specified` (or would
      have been `approved` only if the EXP were already running; it is not).
      proposed_by: coordinator. source_proposal: IDEA-20260916-b84e2d.
      question_id: RQ-QSP-f9bbdb. added: '2026-09-17'. proof_search_map is
      present, narrowed to the m=2 resultant. method_ceiling states it
      cannot certify Rojas' 4.876, cannot reach m>=3, cannot say anything
      about n=131, cannot move H-QSP-645a07 to `supported`. nearby_object_control
      is the C1 null plus the C2 split. asymptotic_claim is null. No
      claim_kind.

