    13.3.0, g++, python3 3.12.3, numpy 2.4.4 and
    analysis/qsp-ecc2k130/explore/gf2rc.c (a GF(2)[X] root counter, not a
    resultant-over-F_{2^n} engine) PRESENT, and sage, sympy, macaulay2/M2,
    singular, msolve, magma, galois, FLINT/NTL headers, libflint and libntl
    ABSENT. DEC-20260917-ea9dd2 NA-2 and EV-QSP-a6aa4b
    obstruction.resource_check name the cheapest informative cell as the
    eliminant degree at (m, d) = (2, 2) or (2, 3), where a RESULTANT
    suffices and no Groebner engine is needed. This session drafted
    H-QSP-411d8f as heuristic H1 of H-QSP-645a07 restated at those
    executable cells -- not the closure reading (E') -- and froze
    EXP-QSP-82a906 at version 1 to measure it. This decision approves that
    contract for execution and nothing else. It does not assert that
    H-QSP-411d8f is true, does not move H-QSP-645a07, does not fill that
    record's H1.validation_experiment_ids (the parent is immutable; the new
    hypothesis carries EXP-QSP-82a906), does not promote H1, does not close
    RQ-QSP-f9bbdb, does not adjudicate the M(E) encoding discrepancy, and
    creates no evidence. It launches no trial.

  decision: approve

  decision_scope: >-
    APPROVES EXP-QSP-82a906 VERSION 1 ONLY, under the standing user
    authorization of 2026-09-06, after a protocol-readiness check recorded
    below. Creates H-QSP-411d8f at status `specified` (mechanism, predictions,
    test boundary and falsification stated; nothing observed). Hypothesis
    status stays `specified` until the experiment runs. DOES NOT move
    H-QSP-645a07 (no status change, no text patch, H1.validation_experiment_ids
    on THAT record stay empty). DOES NOT promote H1 to validated. DOES NOT
    close RQ-QSP-f9bbdb. DOES NOT launch the executor: TASK-20260917-66ec2b
    is written but is not dispatchable until the snapshot archive
    TASK-20260917-5bb67b commits and the post-commit verifier accepts it
    (AGENTS.md rule 7). DOES NOT adjudicate the M(E) encoding discrepancy
    (paper 4d versus historical-note 4 d^2); both columns are pre-registered
    and H1 is scored against the paper formula only. DOES NOT add m>=3
    Groebner cells, n in {29, 41}, or a Weil-descent Semaev control to v1
    (no engine; those remain successor work). Approval authorizes the work
    and asserts nothing about H1 or about (E').

  target_ids:
