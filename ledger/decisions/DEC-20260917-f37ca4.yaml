  context: >-
    Design-experiment stage of the quasi-subfield / ECC2K-130 line
    (RQ-QSP-f9bbdb), branch cursor/qsp-h-supersede-3d0a, 2026-09-17.
    This decision discharges DEC-20260917-ea9dd2 NA-E3 (carried from
    DEC-20260917-793ae2 NA-5): design IDEA-20260916-b84e2d. Official NA-4
    is PR #1275 (H-QSP-645a07 / DEC-20260917-ea9dd2 / KN-FIND-617d78), not
