    not_warranted: >-
      Not an evidence-review decision: this approves a contract before any
      run exists, so there is no evidence of any strength, no durable claim,
      and nothing to promote to knowledge/findings/. A KN-FIND becomes
      possible only after a valid run AND a later Coordinator evidence-review
      decision. Consistency with H1 at toy m=2 would still not warrant
      promoting a finding that H1 holds in general; a G1/G2 scoped refutation
      at replicated/strong strength could warrant a KN-FIND of that scoped
      negative, which this decision cannot pre-author.

