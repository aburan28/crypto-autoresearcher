      flint/ntl absent; z^17+z^3+1 and z^23+z^5+1 irreducible over F_2 by a
      Ben-Or gcd sweep this session. No deg_elim was computed. No scientific
      trial was run.
    - >-
      NO EMPIRICAL EVIDENCE RECORD IS CITED, BECAUSE NONE EXISTS FOR THIS
      CONTRACT. There is no EV-* of EXP-QSP-82a906, no run, and no result.
      This is an approval decision; its evidentiary basis is the completeness
      of the contract, not any measurement. EV-QSP-a6aa4b is cited only as
      the obstruction.resource_check that named the cheapest cell.

  limitations:
    - >-
      TOY TIER, AND ONLY THAT. Even a fully successful run supports at most
      a scoped empirical observation of deg_elim at m=2, n in {17, 23}, the
      tested lambda class, xi=1, named engines. Claim tier of any later
      evidence is toy. It is not a lower bound on kappa, not a certification
      of any recalled mixed-volume statement, not a statement at m>=3, and
      not a statement at n=131.
    - >-
      CONSISTENCY WITH H1 AT m=2 IS NOT VALIDATION OF H1 AT m=3,4 AND IS NOT
      A PROMOTION OF (E'). Two d values cannot fit a growth law in m. A
      matching ratio does not move H-QSP-645a07. A G1/G2 outcome is a scoped
      refutation of H1 at the tested cells and still does not close
      RQ-QSP-f9bbdb.
    - >-
      APPENDIX A.1 REMAINS AN UPPER BOUND EVEN IF deg_elim MATCHES 4d. Treating
      a matching measurement as a lower bound on solving cost still needs
      "solving costs at least linearly in the degree", which this contract
      does not test (M5/M6 are diagnostic, never evidence). Optimistic
      readings are flagged in the contract's optimistic_assumption_disclosure.
    - >-
      NO ATTACK, NO EXPONENT, NO DEPLOYED CURVE. Nothing in this contract runs
      against a curve or a key, and no outcome of it moves any ECDLP cost
      exponent. rho at 2^60.9 on ECC2K-130 (KN-LIT-096) is unaffected either
      way.
    - >-
      THE M(E) DISCREPANCY IS UNRESOLVED BY DESIGN. Reporting both columns
      does not decide which encoding is correct. A later reader who silently
      picks the note formula and scores H1 against 4 d^2 is misreading the
      pre-registration.
    - >-
      APPROVAL IS NOT VALIDATION. Under the standing authorization, approving
      work asserts nothing about the truth of its hypothesis or the validity
      of its future results, and rewrites no historical record.
    - >-
      THIS DECISION CITES NO RECALLED SOURCE. Recalled mixed-volume / BKK
      pointers on H-QSP-411d8f support nothing and are not restated here as
      support (AGENTS.md rule 9).

