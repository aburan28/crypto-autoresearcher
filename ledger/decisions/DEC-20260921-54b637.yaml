  the_decision_stated_plainly: >-
    RUN-FROB-16ecb6's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f and
    RUN-FROB-f3e2a3: a whole-environment/container restart external to any
    script's own control, external to any timeout wrapper (there was none
    this time either), and external to any code defect in
    driver-v2.py/checker-v2.py. This is now an OBSERVED, WORSENING RECURRING
    PATTERN -- three consecutive launch attempts under the corrected source
    (driver-v2.py/checker-v2.py), launched correctly by the dispatching
    session every time, have each been killed by an independent
    whole-environment restart before any execution-receipt.json could be
    written, at shrinking intervals (~20 minutes, then ~11 minutes, then ~9
    minutes). This shrinking-interval pattern is recorded here as a material,
    worsening observation because it is a real fact pattern relevant to
    anyone reading this lane's history later -- but it is, like the three
    interruptions themselves, infrastructure signal, never negative
    mathematical evidence, and does not by itself change this record's
    diagnosis or authorization. All three instances remain non-scientific,
    non-protocol infrastructure signal; none says anything about
    H-FROB-73df22. On that basis, this coordinator (1) preserves
    RUN-FROB-16ecb6's directory exactly as it stands -- its real partial
    roots.jsonl.gz and the three further hashed files, the two confirmed-
    empty log files and confirmed-empty tuples.jsonl.gz, with no
    execution-receipt.json authored for it, because the absence of one IS the
    honest record of what happened, not a gap to be papered over -- and (2)
    authorizes a fresh retry under a fresh, pre-minted run_id,
    RUN-FROB-5490f1, via a fresh trial-plan-stage0-v7.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-02f5f5), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      THIRD, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 5 / CLAUDE.md RULE 3. RUN-FROB-16ecb6 is not a
      new, fifth failure mode; it is a REPEAT of RUN-FROB-39714f's and
      RUN-FROB-f3e2a3's own whole-environment-restart mode -- entire process
      tree destroyed, including the Python supervisor that would have
      written execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the fifth
      interruption overall in this lane's history and the THIRD consecutive
      occurrence of the identical infrastructure failure mode under the
      same, already-corrected source and launch procedure. Three-for-three
      launch attempts under driver-v2.py/checker-v2.py have now been killed
      by whole-environment restarts, all non-scientific, non-protocol
      infrastructure signal. Neither RUN-FROB-16ecb6, RUN-FROB-f3e2a3, nor
      RUN-FROB-39714f says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or
      whether Frobenius structure moves the index-calculus exponent.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-16ecb6, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-16ecb6 is exactly what is on
      disk: real partial output (roots.jsonl.gz, 58522125 bytes), three
      further hashed adapter/launch files (command.txt, environment.json,
      launch.json), three confirmed-empty files (stderr.log, stdout.log,
      tuples.jsonl.gz -- all the well-known empty-file sha256), and a
      documented absence of every downstream adapter/checker artifact,
      because the process that would have produced them was destroyed before
      it could run. RUN-FROB-16ecb6's directory, as it stands right now, is
      preserved as-is by this decision. No file within it is edited,
      completed, or backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its content sha256
      46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v6.json's own already-filled
      runtime_lock_sha256 field (both agree). Nothing about the runtime, its
      guards, or its authorization changes here; a third whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all five interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (three times now) an
      infrastructure restart external to any process's own control -- never
      a hang. 86400 seconds remains sized generously above the only real
      duration signal available and remains a ceiling meant never to bind in
      the normal case, machine protection only per CLAUDE.md "Research
      budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260921-77e8bc chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260921-77e8bc and now this record,
      all within roughly two weeks, including three genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      third, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally covered by the user's own explicit standing
      instruction, relayed by the dispatching session, to keep retrying
      automatically through this exact recurring failure mode; this
      coordinator's role is to execute that instruction faithfully via a
      proper decision record, not to second-guess it. A whole-machine
      restart mid-run is squarely within "watchdog expiry checkpoints a
      task; it does not exhaust the campaign."
    - >-
      OBSERVATION FOR THE DISPATCHING SESSION/USER, NOT A BASIS FOR
      WITHHOLDING AUTHORIZATION. Three consecutive launch attempts under the
      identical corrected source and identical launch procedure have now
      been killed by the identical infrastructure failure mode, at shrinking
      intervals of roughly 20, 11, and now 9 minutes -- a worsening trend on
      a sample of three, still small but no longer a single shortening step
      on a sample of two. This coordinator flags plainly, as it flagged after
      the second instance in DEC-20260921-77e8bc: a pattern this consistent,
      and now worsening in cadence, may eventually warrant a different
      mitigation approach than blind retry -- for example an operational-
      reliability assessment of the underlying platform, or a design change
      to make the trial itself checkpoint/resumable so a whole-environment
      restart does not require discarding all prior partial progress. This
      observation is offered in rationale/limitations only. It does NOT
      block, weaken, condition, or delay this record's own authorization of
      RUN-FROB-5490f1 -- per the user's explicit instruction for this exact
      situation, retrying automatically is exactly what this decision does,
      and second-guessing that standing instruction is not this
      coordinator's role.

