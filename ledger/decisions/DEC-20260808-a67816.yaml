coordinator_decision:
  id: DEC-20260808-a67816
  goal_id: GOAL-MCE-001
  batch_id: BATCH-a68f79
  context: >-
    GOAL-MCE-001 BATCH-a68f79 close. Four producer tasks discharged the three
    deliverables the goal's 2026-08-03 next_action named: correct one defect
    recorded in three places (TASK-20260808-843c87), settle a transcription
    convention (TASK-20260808-a9f648) and transcribe Esser-Bellini SEC Table 1
    under it (TASK-20260808-1985f1), and make the "distinguisher is not break"
    constraint auditable while filing five deferred specification entries
    (TASK-20260808-f9374d). One independent session reviewed the
    snapshot-committed package: validator TASK-20260808-ea7bed
    (VAL-20260808-71bdb1), verdict `failed`, SCOPED TO TWO NAMED CLAIMS.

    The validator states explicitly that `failed` is NOT a finding of
    fabrication, that the affirmative content is largely verified, and that the
    producers' disclosure quality is high. It also proved a Coordinator claim in
    this same batch wrong by direct check. I have re-verified what I can from
    the committed tree without any fetch, and every one of those checks
    reproduced (see D-2). No red-team session reviewed this batch.
  decision: revise
  decision_note: >-
    `revise`, NOT `reject_scoped` and NOT `approve`. `reject_scoped` would be
    wrong twice over: nothing mathematical is being rejected, and the rule
    against scoped rejection on a single unreplicated empirical-only run
    applies with even more force to a single review session. `approve` would
    carry two claims into the record that do not hold. `revise` records what
    stands, withdraws what does not, and binds a completion condition to the
    part that is incomplete.
  target_ids: [GOAL-MCE-001, RQ-MCE-3f7c02, EV-MCE-3d6e9a]
  also_targets_by_path:
    - knowledge/literature/KN-LIT-c41d8b.md
    - knowledge/TAG-CLAIM-CLASS.md
    - coordination/goals/GOAL-MCE-001/batches/BATCH-a68f79/tasks/TASK-20260808-843c87/correction_report.md
  also_targets_note: >-
    Named by path, not in target_ids, because they are corpus and task
    artifacts rather than ledger records. They are the three superseding sites
    of the corrected boundary plus the audit specification, and D-3/D-5 bind
    all four.

  rationale:

    - id: D-1
      what: >-
        THE BATCH'S DELIVERABLES ARE ADMITTED, and one is verified more
        thoroughly than its own gate required.
      why: >-
        SEC Table 1 is transcribed in full and re-verified 150/150 twice, by
        two modalities, from an independent first-hand retrieval at the
        declared sha256 -- the gate asked only for "a sample". The four
        arXiv:2304.14757 quotations the correction rests on are verbatim
        correct, character for character, against a PDF the validator re-fetched
        BYTE-IDENTICAL to the bound hash. Both tag audits ran and printed
        nothing, and a positive control the producers had not run shows the
        pipeline is live rather than dead. The `citation_verified` read/web
        split is honest and conservative, the dropped IR 8545 SIKE assertion
        was correctly dropped, no superseded original was edited, and
        validate_ledger.py exits 0 with zero hits for any identifier this batch
        created. EV-MCE-3d6e9a O-1, O-2, O-3, O-5a, O-9, O-10;
        VAL-20260808-71bdb1 what_is_admissible_notwithstanding.
      admitted_scope: >-
        Admitted as ACCURATE TRANSCRIPTION AND CORPUS BOOKKEEPING. Not admitted
        as evidence about any cryptosystem, because none is offered.

    - id: D-2
      what: >-
        I RE-CHECKED THE VALIDATOR RATHER THAN ACCEPTING IT, to the limit of a
        no-fetch role, and it reproduced every time.
      why: >-
        A `failed` verdict is not privileged over the artifacts it scores.
        Four independent checks in the committed working tree:
          (i) the section 3.2 passage the correction omitted IS already
              transcribed verbatim in this program's own committed record at
              BATCH-001/tasks/TASK-20260803-292b99/heuristics_enumerated.md
              line 332, with line 348 reading "Flagged unproven: yes;
              explicitly 'does not represent a proof'" -- a SIBLING FILE in the
              directory the correction re-quoted from. Confirms S-1(d);
          (ii) knowledge/literature/KN-LIT-4c8135.md line 20 still reads
              `superseded_by: null`. Confirms section 7;
          (iii) a case-insensitive grep of BATCH-001-OPENING.md for
              `RQ-MCE-3f7c02|superseded|correction` returns NO MATCHES -- that
              site has no forward pointer at all. Confirms section 7;
          (iv) KN-LIT-c41d8b lines 81-82 do carry LaTeX (`{\em`, `$q \in
              \{2,3\}$`) inside a block labelled verbatim and bound to the PDF
              sha256. Confirms the repository half of S-1b; the absence of
              `{\em` in the PDF is the VALIDATOR'S finding and I did not and
              could not check it.
          (v) TAG-CLAIM-CLASS.md section 4 lists exactly four limitations and
              none of them covers any of the five evasions; its third bullet
              affirmatively claims "the audit only guarantees the corpus never
              asserts both at once", which is the sentence C-4 falsifies.
      what_i_could_not_check: >-
        Everything requiring execution or network: the PDF re-fetches and
        hashes, the audit runs, the scratch-corpus evasions, git blob identity,
        and validate_ledger.py. Those rest on VAL-20260808-71bdb1, which
        records its commands and outputs. Stated so this decision's basis is
        not overstated.

    - id: D-3
      what: >-
        WITHDRAWN -- "the constraint is machine-enforceable" / "grep-enforceable".
        This was my framing (BATCH-a68f79 dispatch objective and completion
        gate; snapshot-receipt.json `tag_enforceability`), not a producer's
        overreach; the producing role could not execute and said so, and its
        own report wrote that until the commands are run "the enforceability
        claim is a design".
      why: >-
        Falsified by construction, 5 of 5. Five YAML-legal entries parse to
        exactly {'tags': ['distinguisher','key-recovery']} and evade BOTH
        audits: multi-line flow sequences, quoted scalars, a trailing comment,
        quoted block items, and an indented `tags:` key. R-CC-5 mandates the
        single serialisation the audits handle and NOTHING CHECKS R-CC-5, while
        the corpus already holds 56 literature and 23 findings entries in block
        style that R-CC-5 does not reach. The audits enforce a SERIALISATION,
        not the semantic constraint.
      what_replaces_it_verbatim: >-
        "No live corpus entry currently carries both claim-class tokens,
        verified by two audit commands run independently on 2026-08-08 with a
        positive control showing the pipeline is live. The audits enforce one
        tag encoding, not the semantic constraint; five legal YAML encodings
        with identical semantics evade both." No deliverable of this goal may
        state it more strongly until a parsing audit exists.
      evidence: EV-MCE-3d6e9a O-5a, O-5b; VAL-20260808-71bdb1 C-1..C-4.

    - id: D-4
      what: >-
        UPHELD AND STANDING -- the corrected boundary is MORE ACCURATE than
        what it supersedes, on the axis DEC-20260803-a5b9b1 D-2 and D-4
        identified.
      why: >-
        Recorded first, before D-5, because a `failed` verdict must not erase a
        real gain. The rate-scoped framing WAS wrong; the three-conjunct
        reading is right as far as it goes; every affirmative statement the
        correction makes is verbatim correct against the source; and NO
        SUPERSEDING SITE RE-INSTALLS A RATE-SCOPED READING. The defect in the
        correction is an omission, not a substituted mis-scoping. The clause-
        scoped supersession design (RQ-MCE-3f7c02 supersedes ONE clause of
        RQ-MCE-e65b3c rather than replacing the record and dragging two
        known-defective clauses forward) is sound and is preserved.
      evidence: EV-MCE-3d6e9a O-3; VAL-20260808-71bdb1 S-1 three_conjunct_claim, section 7 and_separately.

    - id: D-5
      what: >-
        THE CORRECTION IS INCOMPLETE, AND AN INCOMPLETE CORRECTION OF A
        CITATION MAY NOT BE LEFT STANDING FOR ANYTHING TO CITE. This is the
        decision's operative finding.
      why: >-
        The correction quotes the Goppa-exclusion sentence and stops at the
        full stop. In the source, the exclusion is PHASE-SCOPED (it is the
        FILTRATION part that fails), PRESENT-TENSE ("right now this part of the
        attack does not work at all"), EXPLICITLY NOT A PROOF ("an intuition
        about what hampers it"), and CONJECTURED TO FALL ("it is tempting to
        conjecture that Goppa codes ... should eventually be attacked in
        polynomial"). None of the three superseding sites carries any of it.
        RQ-MCE-3f7c02 instead titles the boundary "STRUCTURAL", calls conjunct
        1 "the decisive one", and states that for the family Classic McEliece
        uses "conjunct 1 settles applicability before any rate arithmetic is
        performed".
      why_it_is_not_a_completeness_quibble: >-
        Three reasons, each checkable. (1) The omission runs in ONE DIRECTION
        on the axis this campaign turns on -- toward dismissal of the
        structural line -- and the correction report's own section 4 names that
        direction as this campaign's failure condition, "symmetric with alarm".
        (2) One of the four omitted passages was ALREADY IN THIS PROGRAM'S OWN
        COMMITTED RECORDS, in a sibling file of the one the correction quoted
        from (D-2(i)); the omission was not caused by the role's inability to
        read the PDF. (3) RQ-MCE-3f7c02's `replacement_constraint` is BINDING
        ON EVERY DELIVERABLE OF THIS GOAL RIGHT NOW, so the defect is not
        historical -- it propagates by design into whatever comes next. This is
        the FOURTH occurrence of the error family the goal's known_hazards
        already records three times: a Coordinator statement about what a prior
        record says, wrong in one direction, caught only by the independent
        check.
      what_is_therefore_decided: >-
        RQ-MCE-3f7c02 and KN-LIT-c41d8b STAY IN FORCE as the corrected reading
        of the rate-vs-family axis -- they are not withdrawn, and withdrawing
        them would restore a worse record. They are QUALIFIED: until the
        completing supersession lands, NO DELIVERABLE OF GOAL-MCE-001 MAY
        INVOKE THE GOPPA EXCLUSION WITHOUT ALSO CARRYING THE SOURCE'S OWN
        QUALIFICATION -- at minimum the page-32 conjecture and section 3.2's
        "does not represent a proof". Any deliverable that cites the exclusion
        bare is defective under this decision.
      evidence: EV-MCE-3d6e9a O-4; VAL-20260808-71bdb1 S-1 material_omission_found.

    - id: D-6
      what: >-
        MY THREE ERRORS ARE RECORDED BY SUPERSESSION AND ARE CITED, NOT
        RESTATED.
      why: >-
        C-1 (the stated cause of the archive-scope failure is wrong: git
        history shows all 18 artifacts in ONE commit, the recommended pattern
        was being followed, and the real error is that the bundle landed one
        commit early under a message naming one of four tasks), C-2 ("this
        receipt binds all 20" is false -- it binds 19, not itself -- and the
        disclosure commit EDITED THE RECEIPT IN PLACE, invalidating its
        declared hash, which is the same in-place edit of an archived record
        this session had just diagnosed on GOAL-ECDLP-001), and C-3 ("zero
        residual references" was broader than the check that produced it) are
        recorded in full at
        coordination/goals/GOAL-MCE-001/batches/BATCH-a68f79/archives/TASK-20260808-2de410/COORDINATOR-CORRECTIONS.md.
        That file is a superseding record; snapshot-receipt.json is NOT edited
        again, because editing it to disclose an editing defect would repeat
        the error while describing it.
      the_transferable_part: >-
        C-1 matters beyond bookkeeping: the generalised lesson was already
        propagated to a sibling goal's snapshot as a rule about not committing
        artifacts incrementally, and that diagnosis names a cause that did not
        occur here. The correct rule is narrower: THE ARTIFACTS MUST BE IN THE
        SNAPSHOT COMMIT, NOT MERELY IN *A* COMMIT.

    - id: D-7
      what: >-
        THE ARCHIVE IS CONTENT-VERIFIED FOR THE PRODUCER ARTIFACTS AND FAILS
        THE DISPATCHER'S EXACT-SCOPE CHECK. The dispatcher's refusal is CORRECT
        and is not to be worked around.
      why: >-
        All 18 producer artifacts recompute and are byte-identical between the
        snapshot tree and HEAD, so every finding in EV-MCE-3d6e9a is about
        frozen bytes and the ordering guarantee HELD AS A FACT. It did not hold
        AS A GUARANTEE THE MECHANISM PROVIDED: the freezing commit is
        c32b4b5dc, which is not the snapshot commit and is named as an archive
        nowhere, and the receipt that carries the hashes was itself edited
        after commit. A reviewer who could only read the receipt would have
        been trusting a hash that no longer matches, pointing at a commit that
        contains 2 of the 20 files. GOAL-MCE-001.latest_verified_commit is set
        to 04c41125a WITH THIS GAP STATED, not silently.

    - id: D-8
      what: NOTHING IS CONCLUDED ABOUT CLASSIC McELIECE, IN EITHER DIRECTION.
      why: >-
        Two batches in, the campaign's primary target is still unopened:
        iacr:2026/1232's body remains unobtained (403, path-scoped,
        reproducible, not circumvented and not re-attempted this batch, per
        AGENTS.md rule 5 a recorded outcome and never negative evidence), its
        complexity claim is still only a conjecture in its abstract, and no
        distance between any attack regime and Classic McEliece's parameters
        has been computed because the left-hand side does not exist. The Goppa
        exclusion of arXiv:2304.14757 DOES NOT TRANSFER to iacr:2026/1232,
        whose abstract names binary Goppa codes explicitly. claim_tier stays
        toy, active_hypothesis_ids stays EMPTY, and no completion criterion of
        GOAL-MCE-001 is met or approached.

    - id: D-9
      what: WHAT THIS DECISION DOES **NOT** DECIDE, stated as explicitly as what it does.
      items:
        - >-
          IT DOES NOT DECIDE whether the four reclassified entries' claim
          classes are CORRECT. Nobody in this program has read any of the four
          papers; the classification rests on titles and relayed descriptions
          at `confidence: reported`; neither producer nor validator certifies
          it. If any of the four is in fact a key-recovery result, the
          supersessions moved the corpus away from correctness while making the
          audit pass, and nothing in this batch could detect that.
        - >-
          IT DOES NOT DECIDE the `superseded_by` policy question -- whether the
          five superseded originals get that field filled, or whether the
          corpus declares it unused. The validator called filling it "the
          single highest-value follow-up in this batch" and it would let
          AUDIT-1 drop its most complex stage. It is a CORPUS-WIDE convention
          question affecting other campaigns, and settling it inside a
          single-goal batch close is exactly the overreach pattern this goal's
          known_hazards records. It is named in the next batch's scope, not
          decided here.
        - >-
          IT DOES NOT DECIDE whether to re-issue snapshot-receipt.json as a new
          receipt. COORDINATOR-CORRECTIONS.md is the superseding record and is
          sufficient for audit; a second receipt for the same snapshot risks a
          second binding object for the same commit. Left open, with the
          defect disclosed.
        - >-
          IT DOES NOT RATIFY the "six extractor configurations, zero
          disagreements" methodology claim (unverified; two modalities were
          used), transcription_convention.md's 879 rules (a sample of citations
          resolved accurately, the rest unscored), or anything about the IEEE
          journal version of arXiv:2304.14757 (unread by anyone here).
        - >-
          IT DOES NOT CLAIM ANY REVIEW QUORUM. One review, one session, the
          same resolved model (claude-opus-5) as the producers and the
          Coordinator; no red team ran. Not admissible toward any AGENTS.md
          rule 13 attestation, none is recorded, and none may be synthesised
          from it later.

  evidence_refs: [EV-MCE-3d6e9a]
  supporting_records:
    - EV-MCE-332f99
    - DEC-20260803-a5b9b1
    - RQ-MCE-3f7c02
    - RQ-MCE-e65b3c

  limitations:
    - >-
      SINGLE REVIEW, NO RED TEAM. The `failed` verdict rests on one independent
      session. Its two findings are constructive rather than judgemental --
      five files whose parses and audit outputs were printed, and four
      quotations located in the source -- and I reproduced the repository-side
      half of both from the committed tree (D-2). But no adversarial pass
      examined the validator's own reasoning.
    - >-
      MY OWN VERIFICATION IS NO-FETCH AND NO-EXECUTE. Every claim in this
      decision that depends on a network retrieval, a hash, a git blob
      comparison, or a command's output rests on VAL-20260808-71bdb1's recorded
      commands and outputs, not on my re-execution.
    - >-
      PROMOTION GATES G1-G4: NONE ADDRESSED, and none is engaged. This program
      advances no asymptotic-complexity claim of its own in this batch. Stated
      explicitly so it cannot be misread as gate progress.
    - >-
      BUDGET: 2 of 6 campaign batches used. runs_authorized was 0 and 0 runs
      were executed; no solver ran and no experiment exists.
    - >-
      The archive backing this decision fails the dispatcher's exact-scope
      check (D-7). The decision is made from COMMITTED artifacts whose bytes
      were independently verified frozen, but the commit-scope mechanism did
      not provide that assurance -- the validator's blob comparison did.

  inference_record: >-
    requested_policy coordinator-orchestration-code; per CLAUDE.md per-role
    model selection is process-level under Claude Code and subagents keep
    model: inherit; fallback_used: false; model_verified: false.

  next_actions:
    - >-
      EXACTLY ONE NEXT ACTION FOR THE GOAL: open the next batch (mint the id
      with `python3 tools/allocate_id.py --next batch`) whose HEAD DELIVERABLE
      is a single Coordinator correction task that COMPLETES the boundary
      correction by supersession -- new records, editing nothing -- carrying
      the source's own qualification of the Goppa exclusion (phase-scoped to
      the FILTRATION step; present-tense "right now"; "an intuition", not a
      proof; and the page-32 conjecture that Goppa codes "should eventually be
      attacked in polynomial"), and installing FORWARD POINTERS from the three
      superseded sites, above all BATCH-001-OPENING.md section 4, which has
      none at all.
      WHY THIS AND NOT THE AUDIT FIX: the incomplete correction is LIVE and
      BINDING -- RQ-MCE-3f7c02's replacement_constraint governs every
      deliverable of this goal today and, unqualified, states the dismissal-side
      conclusion the goal defines as its failure condition; the audit weakness
      is real but LATENT, since the corpus is verified clean today and every
      evasion requires a future writer to use a serialisation R-CC-5 already
      forbids. The completion is also cheap: all four passages are already
      quoted verbatim in committed records (VAL-20260808-71bdb1 S-1, and (d) in
      heuristics_enumerated.md line 332), so it needs no fetch. And the boundary
      defect is the fourth instance of this goal's most-recorded failure family,
      while the audit defect is its first.
    - >-
      IN THE SAME BATCH, subordinate to the above: replace the two regex audits
      with ONE script that parses each knowledge/**/*.md frontmatter and tests
      the tag LIST (print the path when {'distinguisher','key-recovery'} is a
      subset of set(tags)), COMMITTING THE FIVE EVASION FORMS FROM
      VAL-20260808-71bdb1 C-4 AS A REGRESSION FIXTURE -- which also upgrades
      EV-MCE-3d6e9a's proof_status from `empirical_only` to an archived
      counterexample certificate. Supersede TAG-CLAIM-CLASS.md rather than
      editing it.
    - >-
      IN THE SAME BATCH, subordinate: settle the `superseded_by` policy (D-9)
      as a corpus-wide question, and close the two provenance seams -- record
      arXiv v3 (the gap is closed by S-1a) and re-source or re-label the
      abstract block that quotes LaTeX absent from the PDF at the bound sha256.
    - >-
      DO NOT re-attempt iacr:2026/1232's PDF by another route. The 403 is
      path-scoped and reproducible, circumvention is forbidden, and AGENTS.md
      rule 5 makes a blocked route a recorded outcome. Unchanged from
      DEC-20260803-a5b9b1.
    - >-
      DO NOT let the next batch's completion gates be scored only by "did the
      expected thing print". Both of this batch's failures were found by the
      two checks the gate did not ask for: TRY TO BREAK YOUR OWN CHECK, and
      READ PAST THE END OF THE QUOTED SENTENCE. Write both into the next
      batch's gates explicitly.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING PROMOTED, and the rule is not triggered: the mandatory-promotion
      condition is `support` or `reject_scoped` on `replicated`/`strong`
      evidence, and this decision is `revise`. EV-MCE-3d6e9a is `replicated`
      but scoped explicitly to "the transcribed bytes are the source's bytes",
      with `direction: neutral`. Three concrete reasons, one per candidate:

      (1) NO KN-FIND. This program still produced no internal mathematical
      result. It corrected its own citation, transcribed a third party's table,
      and tested its own convention. A finding entry would be promoting someone
      else's numbers.

      (2) THE ONE GENUINE INTERNAL RESULT IS NOT YET PROMOTABLE. "The two-grep
      claim-class audit enforces a serialisation, not the semantic constraint,
      and five legal YAML encodings evade it" IS a real, reusable, negative
      methodological result about this program's own tooling, and it is the
      best candidate here. It is not promoted NOW because its refutation
      artifact is not archived: the five evasion files live in a session
      scratchpad outside the repository, so EV-MCE-3d6e9a records
      `proof_status: empirical_only` rather than `certificate`. PROMOTE IT WHEN
      the parsing audit lands with those five forms committed as a regression
      fixture -- that is the second next_action, and it converts the finding
      and its certificate in one step. Recorded as a scheduled promotion, not a
      declined one.

      (3) NO NEW KN-LIT AND NO KN-TECH FROM THIS DECISION. The batch's literature
      entries (KN-LIT-c41d8b and the nine others) were filed by the producer
      tasks and are already in the corpus; this decision QUALIFIES one of them
      (D-5) rather than adding another. Filing more before the completing
      supersession lands would repeat at scale the exact defect D-5 records --
      which is the same reasoning DEC-20260803-a5b9b1 used to defer these very
      entries one batch, and it was right. Still zero ISD KN-TECH entries,
      still correctly so: a technique entry states applicability conditions,
      and D-5 is a live demonstration that this program's statement of an
      applicability condition in this area was incomplete eight days ago.

      knowledge/INDEX.md is generated and gitignored; it is rebuilt on demand
      and is not part of this promotion decision.

  decided_by: coordinator
  decided_at: '2026-08-08'
