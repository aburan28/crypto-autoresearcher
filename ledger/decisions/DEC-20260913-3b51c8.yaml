coordinator_decision:
  id: DEC-20260913-3b51c8
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-c44484
  archived_by: TASK-20260913-c44484
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: weaken
  decision_label: >-
    Compose the EXP-SEMBIN-354a75 half of REVIEW-SEMBIN-20260913-run2 (J1, J2, J3,
    J6-BLIND). H-SEMBIN-c5b2e0 moves approved -> weakened in its tested scope: the
    mean-level, t-growing overstatement it predicted is absent, while a
    probability-level 18-22% deficit at t = 2 for the paper's own low-degree window
    survives under a mechanism -- over-dispersion of per-target decomposition counts
    -- the hypothesis did not state. Record two Coordinator priors as refuted and one
    confirmed. Name the successor. Promote nothing yet.

  context: >-
    RUN-SEMBIN-1b9afe (EXP-SEMBIN-354a75, 180/180 configurations, nine cells, all
    exhaustive) was archived by TASK-20260913-a10004 in commit 40e1cf727 before any
    reviewer ran, its manifest schema was completed additively under
    CORR-20260913-a99454, and the review plan for this round was written and
    committed with the Coordinator's priors before TASK-20260913-31d530 or
    TASK-20260913-3395e3 was dispatched. The validator owning J1-J3 returned
    breaks / breaks / breaks with no instrumental defect found; the blind re-deriver
    owning J6-BLIND filed a value that agrees with the producer's to 3e-5, which the
    Coordinator composed as holds in review-plan.yaml joint_outcomes. J4 and J5
    belong to EXP-SEMBIN-92724f, whose validator TASK-20260913-7ca970 has not run;
    this decision composes only the joints that are in and says nothing about that
    run. This decision was written by the Coordinator session that also wrote the
    plan; the independence it rests on is the reviewers', and
    tools/check_review_independence.py reports the round's only open items as the
    two unrun J4/J5 attestations and a vocabulary gap on the word `filed` (PD-B).

  target_ids:
    - H-SEMBIN-c5b2e0
    - EXP-SEMBIN-354a75
    - RUN-SEMBIN-1b9afe
    - EV-SEMBIN-d40877
    - REVIEW-SEMBIN-20260913-run2

  official_transitions:
    H-SEMBIN-c5b2e0:
      from: approved
      to: weakened
      basis: >-
        Of six preregistered predictions, P1 (ratio below 1 by >= 20% at t >= 3)
        and P2 (monotone decrease in t, t = 4 below t = 2 by 2x) FAIL in the tested
        scope: every t >= 3 cell returns a ratio above 1, attributed exactly to
        eq. (11)'s class count and the mean-one f_base fluctuation at small |V|,
        and no monotone-in-t quantity exists in the cell set. P3 (multiset
        correction explains the ratio) holds for the class-count part and not for
        the residual, which is not one of the four factors. P4 (realized random
        map returns 1) and P5 (chained = single per target) HOLD. P6 is a recorded
        pointer. The hypothesis's stated mechanism -- the bound-then-assume-
        equality step biasing the MEAN -- is contradicted by a pooled mean ratio
        within 1% of 1 at t = 2 (EV-SEMBIN-d40877 O-2, O-3). `weakened` rather
        than `rejected` because the hypothesis's headline sign holds and is
        reinforced for the construction the paper specifies (O-4), and rather
        than `supported` because it holds for a reason the hypothesis did not
        give and does not hold for the reason it did.
    EXP-SEMBIN-354a75:
      from: completed
      to: analyzed
      basis: Evidence record EV-SEMBIN-d40877 written and archived under this decision.

  refuted_priors:
    - joint: J1
      prior: >-
        "Three numbers between 0.75 and 0.91 for one cell is the shape of a quantity
        whose definition has not been pinned down."
      finding: >-
        Each of the three columns is exactly defined and reproduces to six decimals
        from the raw per-R data; the disagreement is a change of averaging
        population between sections of one file (20 configurations versus one),
        compounded by bimodality on the declared `subspace variant` axis. Nothing
        needs redefining; the headline needs splitting. Partly overturned.
      by: TASK-20260913-31d530
    - joint: J2
      prior: >-
        "The entire ~9% deficit in the cells labelled artifact-free is f_base;
        either those cells are not artifact-free or f_base is not an artifact."
      finding: >-
        False dichotomy. At the headline f_base averages 0.9888 / 0.9998 / 1.0032
        over configurations (the 0.9103 the prior quoted is one -1.44 sigma draw),
        and the 9-10% deficit sits entirely in f_dispersion, which is not one of
        the four factors: over-dispersion present only for the low-degree window.
        The producer's task-report section 11 already stated the f_base fluctuation
        argument the prior thought was missing. Overturned.
      by: TASK-20260913-31d530
  confirmed_priors:
    - joint: J3
      prior: >-
        The decay claim in the diagnosis's section E is stated as a monotone
        limit for a quantity that fluctuates, and the table offered for it is not
        at fixed t.
      finding: >-
        Confirmed with the derivation the plan asked for: f_base =
        (1 + Z |V|^{-1/2})^t, sd ~ t |V|^{-1/2}, sign a fresh coin per
        configuration; f_multiset is O(|V|^{-1}) and monotone. The two are a
        factor of 100 apart in deviation at |V| = 4096 and the table's t runs
        6, 3, 4, 3, 3, 3, 2, 2, 2.
      by: TASK-20260913-31d530
    - joint: J6-BLIND
      prior: >-
        The Coordinator expected the blind value to agree with the producer's
        f_base to within 0.01 and named a 0.01 disagreement as the break.
      finding: >-
        Agreement to 3e-5 on all three cells, on L and on the closed form, from an
        implementation sharing nothing with the producer's. The one material
        underdetermination the re-deriver found (point count versus x-value count
        for L, a ~2^t difference) was a defect of the Coordinator's statement, not
        of either implementation, and both sides used the definition the
        statement made explicit.
      by: TASK-20260913-3395e3

  procedure_deviations:
    - id: PD-A
      what: >-
        A schema-alignment edit to review-plan.yaml landed after TASK-20260913-31d530
        was dispatched (recorded in the plan; no joint, owner, attack plan or
        blindness boundary changed).
    - id: PD-B
      what: >-
        tools/check_review_independence.py rejects the blind re-deriver's verdict
        word `filed`; the attestation was not edited and the Coordinator's
        composition supplies the verdict. A checker vocabulary change is proposed
        as a separate reviewed code change, not made here.
    - id: PD-C
      what: >-
        This composition runs while J4/J5 of the same round are unrun. The plan
        assigned the two runs to disjoint validators precisely so that each half
        could be composed on its own evidence; nothing in J4/J5 bears on
        H-SEMBIN-c5b2e0. Recorded because "the round is composed" would otherwise
        read as "all six joints are in", which is false until TASK-20260913-7ca970
        returns.

  rationale:
    - >-
      WHAT THE MEASUREMENT SETTLES. eq. (11)'s lambda is the right mean at t = 2 to
      1%, its class count is exactly correctable by C(L+t-1, t), and its Poisson
      link P = 1 - exp(-lambda) fails by 18-22% for the low-degree-polynomial window
      and by nothing for a random window of the same dimension. Those three
      sentences are each backed by an exhaustive count, a passing curve-free null,
      and a validator recomputation from raw integers (EV-SEMBIN-d40877 O-1, O-2,
      O-4, O-5).
    - >-
      WHY `weakened`. The hypothesis is a claim about a mechanism -- the paper
      bounds P(solve) above and assumes equality, and the Lemma-2 exclusions make
      the gap real and t-growing. The gap in the mean is at most 0.28% and the
      Lemma-2 fraction is reported and negligible; the t-trend is absent. The
      hypothesis's sign survives at the probability level for a different reason.
      A hypothesis whose conclusion holds for a reason it did not give is weakened,
      not supported: supporting it would put the wrong mechanism in the ledger
      under a passing grade.
    - >-
      WHY NOT `rejected`. Rule 6: negative evidence closes only the exact tested
      scope. P1 was tested at t >= 3 only where |V| <= 128, where class-count
      artifacts swamp any curve effect; the hypothesis's t >= 3 claim is therefore
      untested at any |V| where it could be seen, not refuted. And the sign the
      hypothesis exists to establish -- eq. (11) overstates yield for the paper's
      construction -- is the round's strongest surviving finding.
    - >-
      THE NEW OBSERVATION OUTRANKS THE OLD HYPOTHESIS. The subspace-family
      dependence is a fifth unexpected observation under core rule 8 that the
      producer's own required results table retained and its narrative never
      reported. It gives a candidate mechanism for the producer's recorded
      shape_deficit_not_monotone_in_t (there is no t-trend; there is a
      low-degree effect at the only t where |V| was large enough to see it) and it
      bears directly on any comparator in this program that assumes eq. (11)'s
      Poisson link for a low-degree factor base. That is the successor.

  next_actions:
    - >-
      Design a successor hypothesis on the low-degree window's over-dispersion via
      /design-experiment, with cells where t = 3 and |V| >= 2^10 coexist (n ~ 30,
      k = 10, tk - n = 0; V^3 is 2^30 multisets so the exhaustive pass must be
      per-target sampled with L fixed, which is what gave f_legal meaning here), an
      exhaustive pass on the RANDOM family, and |V| up to 2^16 at t = 2 to test
      decay. Preregister the mechanism candidates in EV-SEMBIN-d40877
      unresolved_confounds as separate arms with nulls. Ranked ECC work under
      AGENTS.md "ECC comes first"; not dispatched by this decision.
    - >-
      Compose the EXP-SEMBIN-92724f half of the round when TASK-20260913-7ca970
      returns (archive TASK-20260913-e9cb45), then decide whether the two halves
      together change KN-FIND-9643e7 / DEC-20260913-74e208's eq. (11)-conditional
      closure. This validator confirmed that the t < m versus t = m comparison
      that question needs is not in this cell set (eight of nine cells have t = m).
    - >-
      Carry the RELN pointer (O-9) to whoever holds RQ-SEMBIN-9e8f82 and the
      EXP-RELN-164ad3 records via the bus, as a pointer and not a finding.
    - >-
      A separate reviewed code change to tools/check_review_independence.py:
      accept `filed` for attestations with kind blind_rederivation and require a
      Coordinator joint_outcomes entry for that joint instead.

  evidence_refs:
    - EV-SEMBIN-d40877
    - RUN-SEMBIN-1b9afe
    - VAL-20260913-31d530
    - coordination/review/sembin-20260913-run2/TASK-20260913-3395e3/rederived-values.json

  citations:
    - claim: >-
        Semaev's own text prefers the low-degree-polynomial subspace for V.
      source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 539-545
      provenance: retrieved
      verified_by: TASK-20260913-31d530
    - claim: >-
        eq. (11) as transcribed reproduces all 33 P_theoretical entries of Table 1
        to four decimals under the paper's truncation convention.
      source: RUN-SEMBIN-1b9afe baseline control; inputs/SEMAEV-2015-310/tables.yaml
      provenance: internal
      verified_by: TASK-20260913-31d530

  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION.
    - >-
      Toy scale: n <= 24, |V| <= 4096. Transfer of the low-degree deficit to any
      cryptographic n is an untested assumption and is not made here.
    - >-
      The low-degree effect is measured at t = 2 only; its existence at t >= 3, its
      decay in |V|, and its mechanism are open (EV-SEMBIN-d40877 boundaries and
      unresolved_confounds).
    - >-
      No degree is measured or asserted anywhere in the round; the trade-off
      against the paper's Groebner-side reason for preferring the low-degree window
      is not assessed.
    - >-
      Evidence strength is `preliminary`: one run, one review round, one
      re-derivation of one quantity. Replication is the successor's job.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Strength is preliminary and the decision is `weaken`, so no promotion is
      required; none is made. The reusable content (O-5) is deferred to the
      successor with the reason recorded in EV-SEMBIN-d40877
      knowledge_promotion_reason.

  standing_user_authorization:
    cited: '2026-09-06: "all is approved. ideas/experiments should be always approved"'
    applied_to: []
    note: >-
      This decision approves nothing; it composes a review and moves a hypothesis
      status, which is Coordinator authority under AGENTS.md and needs no user
      authorization. The successor design named in next_actions will cite the
      standing authorization when its contract is complete.
