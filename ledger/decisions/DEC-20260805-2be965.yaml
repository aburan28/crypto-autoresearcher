coordinator_decision:
  id: DEC-20260805-2be965
  context: >-
    GOAL-SSIQ-001 BATCH-001 closes. The batch turned "reach exponent 1/4 for the
    supersingular isogeny problem" from an aspiration into arithmetic on named
    quantities, then audited the two load-bearing levers before any
    implementation, exactly as docs/inventor-protocol.md section 8 requires.
    Both producer packages were snapshot-frozen before review (commits 50596409
    and 7ec7f730, both independently content-verified), reviewed by an
    independent Validator (ADMIT-WITH-CONDITIONS) and an independent Red Team
    (CONFIRM-SCOPED), and are recorded as EV-SSIQ-e43afd.
    The most useful results of this batch are corrections to the Coordinator's
    own opening framing. That is what a pre-compute falsification batch is for.
  decision: reject_scoped
  decision_note: >-
    reject_scoped applies to LEVER L1 IN ITS TESTED SCOPE — the route that seeks
    a structural degree bound with exponent 1/4 on the target E^{(p)} and its
    small-degree-modified neighbours. It does NOT apply to GOAL-SSIQ-001, which
    stays active with four levers open; it does NOT apply to case N5, which is
    minted as its own open lever; and it asserts NOTHING about the hardness of
    the supersingular isogeny problem or about whether a p^{1/4} algorithm
    exists. A method ceiling is a statement about a method.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EV-SSIQ-e43afd
    - TASK-20260805-85af9d
    - TASK-20260805-87e568
    - TASK-20260805-89a2e7
    - TASK-20260805-fb72f1
  evidence_refs:
    - EV-SSIQ-e43afd
  rationale:
    - id: D-1
      statement: >-
        L1 IS CLOSED IN SCOPE, ON ONE PILLAR, AT DERIVATION TIER. D1 bounds the
        fraction of curves with delta_E <= p^{1/4} by p^{-1/8+o(1)}, and it
        survived independent re-derivation from scratch by the Validator, which
        also resolved the producer's own open question: ingredient (c)
        contributes (np)^{o(1)}, decisively not n^{1/2}, so the pre-committed
        reversion did not fire. AOV Remark 4.3 corroborates unconditionally but
        does NOT carry the closure — the Red Team established (O1, HIGH) that D1
        subsumes it, and that the unconditional pillar closes the disjunct the
        algorithm never needed. The verdict is therefore recorded as
        CLOSED-IN-SCOPE, single-pillar, derivation-tier, with the reversion
        condition carried verbatim. Anyone who later reads this as "closed by
        unconditional primary text" is reading it wrong.
    - id: D-2
      statement: >-
        THE OBSTRUCTION THE COORDINATOR NAMED FOR L1 WAS A CATEGORY ERROR TWICE
        OVER, and the defect is not isolated. Minkowski/Hermite bounds are upper
        bounds and cannot force a floor; on the rank-4 object they give exponent
        1/2, weaker than the known 1/3. The Red Team then checked the other four
        obstruction fields and found four of five defective (L2 uncited and
        optimistic in direction, the generic exchange rate being e = 2*delta
        rather than 1:1; L3 stating a false generality since k-way splits DO
        beat the two-list bound per Wagner, the claim holding only in the
        unique-solution no-group setting, and attached to the wrong symbol; L4
        aiming the expensive work at sourcing when the structural fact sat at
        line 51 of an already-frozen file; L5 carrying no obstruction field at
        all). The same defect sits in RQ-SSIQ-9702af scope.methods. All five are
        corrected in the goal record by this decision. A Coordinator frame that
        misnames its obstructions misdirects every batch that trusts it, and
        this one nearly did.
    - id: D-3
      statement: >-
        THE EXPONENT BUDGET SURVIVED AND NOW SUPPORTS RANKING. The Validator
        derived the composition and the 1/4 conditions independently before
        opening the producer's file and agrees on every value. The target is one
        multiplicative movement of 3/4 on c, q or d, or 4/3 on k. Two of the
        four placements are provably unavailable: c = 3/4 forces memory > time,
        and r has no solution since it would need P0 > 1. The k route is
        refuted by default at its naive baseline (c = k-1 gives T = 4/9 at
        k = 3, worse than the incumbent), found independently by both reviewers.
        This is the first ranking this goal can make on evidence rather than
        taste.
    - id: D-4
      statement: >-
        L4 IS THE OPPOSITE OF WHAT THE COORDINATOR ASSUMED AND IS PROMOTED, NOT
        DEMOTED. The batch established that the F_p route's descent stage costs
        Otilde(p^{1/2}) and that the p^{1/4} phase is asymptotically free —
        which the Coordinator read as killing the lever. The Red Team showed the
        inference runs the other way: if the descent is the whole cost, then
        Delfs-Galbraith's IDEAL ceiling is exactly p^{1/4}, the goal's target,
        making L4 the only lever whose ceiling meets the target at all. Its real
        obstruction is a hitting-time bound for a density-p^{-1/2} set in an
        expander, and it lives if and only if a computable delta_E-gradient
        exists. That is a specific, falsifiable condition and it did not exist
        before this batch.
    - id: D-5
      statement: >-
        THE ENUMERATION WAS NOT EXHAUSTIVE AND THE DISCLAIMER EARNED ITS KEEP.
        The producers and Red Team added routes the Coordinator's L1-L5 missed:
        split arity k (A1, which the arithmetic says is one of only four places
        the target can sit, and which had no lever at all), relation families
        (A2), non-materialised representation (A3), the correlation condition
        for L2 (A4), amortised multi-instance (A5), the exponent-free register
        (A6), and cross-ATTEMPT amortisation under re-randomisation (A7) —
        which the Red Team identified as invisible at the source's parameters
        and load-bearing exactly in the lowered-threshold regime, because both
        packages fix TOTAL = per-attempt x P0^{-1} and no lever acts on the
        multiplication (objection O6, HIGH). A hidden rank axis was also
        surfaced: the real admissibility condition is log_p(det)/rank <= 1/4,
        which permits rank 4, which is where N5's higher-dimensional case lives.
    - id: D-6
      statement: >-
        THREE CITATION AND CORPUS DEFECTS ARE RECORDED, TWO OF THEM THIS
        PROGRAM'S OWN. (a) GOAL-SSIQ-001, RQ-SSIQ-9702af and the BATCH-001
        opening all cite "the proof of Theorem 1.1, lines 177-218". The proof is
        lines 193-220; 177-185 is the proof of Lemma 3.4; and the cited range
        OMITS the sources of two of the four factors entirely (Theorem 1.5 at
        line 81 for F1, Lemmas 3.2/3.3 for F3). Corrected in the goal record
        here. (b) The goal record states its target on the problem reachable
        only through the uninspected [35] reductions while every derived
        condition is about OneEnd; recorded as a defect and scoped in the goal
        record rather than silently rewritten. (c) Outside this goal's scope:
        knowledge/literature/KN-LIT-1732.md declares a local copy at
        downloads/2607.14624v1.pdf that does not exist on the filesystem, and
        records "ITS CONJUGATE" as an author. Routed to /curate-knowledge; NOT
        repaired here, because a knowledge record is corrected by supersession
        under its own procedure and not as a side effect of another goal's
        ledger archive.
    - id: D-7
      statement: >-
        NO STATUS ABOVE preliminary, AND THE REASON IS STRUCTURAL. All four
        sessions resolved to one model identity; policy aliases do not resolve
        under this binding, so review-adversarial's xhigh floor was neither
        applied nor verifiable. Independence is session-level. The Red Team
        states plainly that its concurrence on D1 is not independent
        corroboration of D1. This cap was declared in the goal record and the
        batch opening BEFORE any evidence existed, which is the only way a cap
        like this is credible.
  limitations:
    - >-
      This decision closes a METHOD ROUTE. It establishes nothing about the
      hardness of the supersingular isogeny problem, demonstrates no speedup,
      and does not assert that a p^{1/4} algorithm exists, is likely, or is
      near. The audit's own section 10.3 disclaimer is carried verbatim into
      EV-SSIQ-e43afd (Validator condition V12).
    - >-
      Zero runs, zero compute, zero measurements. Where data appear at all they
      are AOV's exhaustive table at p <= 265207, below this program's declared
      toy band.
    - >-
      The published Delfs-Galbraith body was not obtained (infrastructure
      outcome, AGENTS.md rule 5), so the F_p search's memory profile is still
      unknown — a live gap for L4, whose whole attraction is a memory-heavy
      p^{1/4} ceiling.
    - >-
      Four Validator conditions (V4, V6, V9, V12) and twenty Red Team objections
      travel with EV-SSIQ-e43afd. None was assessed as blocking; none is
      dismissed here.
  next_actions:
    - >-
      SINGLE NEXT ACTION — open BATCH-002 on the Red Team's REC-1: fit
      #{E : delta_E <= T} = c*T^alpha*p^beta on AOV's released exhaustive
      delta_E data (p <= 265207), with a null control of random ternary forms of
      discriminant p/4. D1 predicts alpha = 3/2, beta = 1/2; the ingredient-(c)
      n^{1/2} failure mode predicts alpha = 2, which would REOPEN L1's second
      disjunct at exactly 1/4. It is chosen over every alternative for one
      reason: it fails DIFFERENTLY from any amount of same-model re-derivation,
      which is the only unresolved confound this batch could not touch. It must
      be reported as sub-toy and falsification-only (log2 p <= 18).
    - >-
      NOT CHOSEN, WITH REVISIT CONDITIONS (AGENTS.md rule 9). (i) REC-1b, the
      delta_E-gradient question that decides whether L4 lives — same data, same
      batch if budget allows, otherwise BATCH-003; revisit unconditionally
      before any L4 implementation. (ii) REC-2, one fetch of ePrint 2023/1399 to
      cost the [35] cascade; blocked on installing a PDF extractor (pypdf dies
      with a pyo3_runtime panic in this environment), which is the cheapest
      unblocking action available and should be done opportunistically.
      (iii) N5, the open lever, needs a scoping pass before it can be audited;
      revisit when REC-1 returns. None of these is deprioritised for lack of
      merit and none may be dropped without a superseding decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted, and the reason is the strength cap rather than the
      absence of a durable result. EV-SSIQ-e43afd is preliminary because all
      four sessions resolved to one model (D-7); docs/task-lifecycle.md step 9
      conditions promotion on replicated or strong evidence, and a scoped
      negative is promoted like a positive only at that bar. TWO CANDIDATES ARE
      QUEUED RATHER THAN DISCARDED, both of which are proven scoped negatives of
      the kind this program says are worth keeping: (1) the L1 ceiling itself —
      that the degree-bound route to a lower exponent is closed for E^{(p)} and
      small-degree neighbours, with the rank-3 lattice and the 1/rank
      observation; (2) the general pattern the producer flagged as R4, that an
      upper-bound instrument cannot establish a floor and that naming one as an
      obstruction is a repeatable Coordinator error — this batch found it in
      four of five obstruction fields. Both are promoted when a genuinely
      different model re-checks D1, which is exactly what BATCH-002's REC-1 is
      designed to substitute for. Recording them here so the candidates are not
      lost between batches.
  decided_by: coordinator
  decided_at: '2026-08-05'
