coordinator_decision:
  id: DEC-20260804-928766
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-057
  recorded_by_task: TASK-20260804-041
  archived_by: TASK-20260804-041
  context: >-
    BATCH-057 ran EXP-OIFP-0ca0c9 for H-OIFP-097d1a. Pre-exec PASS. Run:
    partial_valid (bits=20 selection bias; bits=40 resource_exhaustion).
    VAL COMPLETED_VALID_SCOPED; RT PASS_SCOPED with OBJ-1 and OBJ-2.
    Key insight from RT: BFS MITM total cost O(sqrt(p)) = same as L[1/2].

  decision: inconclusive
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-OIFP-097d1a stays `specified`. The run did not test the O(p^{1/4}) claim
    meaningfully due to selection bias (14/20 degenerate class_size=2 instances).
    The 2 large-class reps are preliminary signals consistent with the mechanism
    but statistically insufficient. Critical finding: BFS MITM requires O(h(D))
    class enumeration, making total cost O(sqrt(p)) = same as L[1/2]. The
    advertised O(p^{1/4}) applies only to the COLLISION STEP, not the full algorithm.
    The Pollard-rho distinguished-point random-walk MITM (no enumeration) is the
    correct implementation for a genuinely sub-O(sqrt(p)) algorithm.

  rationale:
    - >-
      Selection bias (OBJ-1): 14/20 reps class_size=2 — trivial 1-step collision
      regardless of algorithm. Success criterion is vacuous for these instances.
    - >-
      BFS total cost (RT OBJ note): O(h(D)) = O(sqrt(p)) enumeration overhead makes
      BFS MITM no better than L[1/2] class group DLP in total complexity.
    - >-
      2 large-class reps are consistent with O(sqrt(class_size)) but n=2 is not
      statistically significant. Does not support H-OIFP-097d1a at any strength.
    - >-
      Bits=40 resource_exhaustion: not negative evidence.

  exact_next_action: >-
    Redesign EXP-OIFP-0ca0c9 with amendment PA-OIFP-0ca0c9-v2:
    (1) Target large-class instances: use CM theory to generate primes p with
        specified class number h(D) >= 100 (e.g., via the CM-class-polynomial method
        or by selecting primes p ≡ 1 mod 4 with known CM discriminant D giving large h(D));
    (2) Replace BFS MITM with Pollard-rho distinguished-point random-walk MITM
        (O(p^{1/4}) collision steps AND O(log p) memory with no class enumeration);
    (3) Include a NEW control: measure the full end-to-end cost including path-finding
        overhead, not just collision step count;
    (4) Increase per-rep budget to 600s for bits=40.
    Open BATCH-058 to draft this amendment and dispatch the revised experiment.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Inconclusive. BFS vs random-walk cost analysis insight (RT OBJ note) is worth
      recording as a knowledge item after the successor experiment confirms it.

  pareto_integrity:
    dominated_by: L[1/2] class group DLP for BFS OIFP MITM; p^{1/4} for random-walk variant
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable, data_or_query_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
