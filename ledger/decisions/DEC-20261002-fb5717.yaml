  pd_a7505b5_1_ruling:
    facts: >-
      The top-level session staged the 32 package files. Its receipt writer
      then built its path list from untracked files, found it empty after
      staging, and failed an assertion. The shell did not stop, and the same
      command block committed the 32 files as ecdbe98c6 (parent a80aec611),
      pushed, and committed and pushed the bus release 02256d5ba, all without
      the receipt. The receipt was then written self-neutral, verified
      content_at_commit against ecdbe98c6 on all 32 paths, and committed
      separately (0eec511ab). History was not rewritten.
    ruling: >-
      ACCEPTED AS DISCLOSED; a procedural deviation, not a custody failure.
      (1) Custody holds: the binding is content_at_commit, the package commit
      changes exactly the 32 declared paths, and every path_sha256 verifies
      at ecdbe98c6 (PR-01, PR-02); no package byte differs from what checks
      (a)-(h) measured. (2) The card's "receipt in the same commit"
      requirement is not met; that is the deviation. (3) No official
      transition rested on the unverified state: the package became durable
      only when the receipt verified, and this decision is the first act that
      relies on it. (4) Not rewriting pushed history was correct (AGENTS.md
      "Durable research commits"). (5) The bus release pushed before the
