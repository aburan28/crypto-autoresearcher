coordinator_decision:
  id: DEC-20261005-8219b8
  context: >-
    Design tick on 2026-10-05. origin/main was fetched at
    92a3d5047cbbc343439c84fdb23db6ad3d79ae8a and this branch was
    created from that commit. Open ECC arithmetic-count ideas are
    declined by DEC-20261005-138b51 and are not designed here.
    IDEA-20261004-e4c461 already has H-SSI-89db95 and EXP-SSI-98cfd7.
    IDEA-20261004-edbd24 had no hypothesis and no experiment.
    The checkout design/frob-9abf42-stable-count held uncommitted
    NGCC drafts and was not used.
  decision: approve
  target_ids:
    - IDEA-20261004-edbd24
    - H-SSI-d4f424
    - EXP-SSI-f08a63
  rationale:
    - >-
      ECC selection. NGCC is outside the ECC area set, and
      GOAL-NGCC-6c8a52 next_action says not to dispatch that goal
      ahead of a ranked ECC task. The arithmetic-count ideas under
      RQ-ECDLP-002 and RQ-JINV-8fc13a state that no curve point is
      added. They are not ranked ahead of doing nothing.
    - >-
      IDEA-20261004-edbd24 is the next open SSI EndRing audit named
      by DEC-20261005-031c2c. This contract keeps the curve, the
      eight endomorphisms, and the E[2] equality bits. It does not
      replace them by a depth integer.
    - >-
      Standing user authorization of 2026-09-06 covers approval of
      a complete protocol. The contract names inputs, controls,
      metrics, seeds, six runs, stopping rules, invalidation rules,
      a success criterion, and a falsification criterion. None of
      those is null.
    - >-
      The fiber membership was derived in this design session from
      the group law and from i^p = -i for p congruent to 3 mod 4.
      That derivation is not a run. The papers named in the proposal
      were not reopened and do not back this approval.
  evidence_refs: []
  limitations:
    - Toy primes 7, 11, and 19 only.
    - No hardness, IND, or published-PKE claim.
    - Approval authorizes six deterministic runs. It does not assert the fiber partition.
  next_actions:
    - >-
      Snapshot-archive H-SSI-d4f424, EXP-SSI-f08a63, this decision,
      and the handoffs. Do not launch the executor until that
      receipt verifies.
    - Leave IDEA-20261004-a09dd4 undesigned for a later tick.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
