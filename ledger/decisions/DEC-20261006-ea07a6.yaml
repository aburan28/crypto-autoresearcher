    The contract freezes y^2 = x^3 + x + 1 over F_5, the extension
    F_5[z]/(z^3 + z + 1), the lexicographic point order, and the null
    model y^2 = x^3 + x + z. Success is the source idea's prediction
    that g_obj is at least 0.15 and g_null is at most 0.05. The
    concrete negative is that the instrument checks pass, both samples
    have size at least 100, the trace map is lossy, and g_obj is below
    0.15 or g_null is above 0.05. No point of either curve was
    enumerated in this session. The field inverses were checked against
    each other on the nonzero field elements, and the relative trace
    was zero on 25 of the 125 field elements. Those checks are not a
    value of either gap.

    python3 tools/portfolio_kpis.py --capacity GOAL-FROB-6333a9 reported
    approved_unrun=1 (EXP-FROB-30006a) against a cap of 3, so headroom
    was 2. The question is one of that goal's question_ids, so the
    contract sets goal_id GOAL-FROB-6333a9.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, decision_impact, and required artifacts are all
    non-null. Success fails when the object gap is below 0.15 or the
    null gap is above 0.05 under the stated instrument conditions. The
    driver and the trial plan are in the experiment directory.
    python3 tools/newest_experiments.py --experiment EXP-FROB-c3bc90
    reported execution_state ready. This decision does not launch the
    named future slot RUN-FROB-671844. The same pass files
    IDEA-20261006-f70ed0, IDEA-20261006-309fdb, and IDEA-20261006-e3debc
    and does not design them.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A smaller object gap or a larger null gap, with the instrument checks passed and the map lossy, is reachable as a recorded outcome, so success is not automatic.
    - The discriminant, the modulus, the 20 Frobenius-trace identities, the dual group law, the uniform trace band, and the sample-size floor are the instrument controls.
    - An instrument failure is not relabeled as an inequality failure, a short sample is a void, and a mean fibre below 2 is a void rather than the negative.
    - The second shift and the half-sample flag do not choose the reading row.
    - This session did not enumerate the curve and did not claim that an exponent moves.
    - GOAL-FROB-6333a9 had approval headroom. The contract names that goal.

  evidence_refs: []
  limitations:
    - The measurement covers one curve over a field of 125 elements and one null model. It does not transfer to a larger field.
    - A gap of 0.15 does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A short sample, a failed identity, a uniform trace outside the band, and a mean fibre below 2 are not the negative.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - The second shift and the half-sample flag are recorded beside the gaps and do not choose the reading row.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

