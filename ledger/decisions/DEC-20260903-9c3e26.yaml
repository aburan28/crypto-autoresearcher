    same-family readers DISAGREE, the text is indeterminate regardless of
    family and the finding is immediate; if they agree, the inference is capped
    and a cross-family draw becomes the next step. THE REFINEMENT IS THAT THE
    ASYMMETRY IS SHARPER THAN THE RED TEAM STATED, ONCE THE INSTRUMENT DEFECT
    IS ACCOUNTED FOR. Run against the CURRENT panel, an agreement between two
    readers who have both read the leaked sentinels has a COMPLETE ALTERNATIVE
