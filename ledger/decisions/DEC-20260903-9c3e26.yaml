  # =====================================================================
  # THE RULINGS. THIS DECISION WAS ASKED TO RULE, NOT MERELY TO RECORD.
  # EACH RULES BY SUPERSEDING RECORD; NO COMMITTED RECORD IS EDITED.
  # =====================================================================
  rulings:

    ruling_1:
      title: DEF-CM1-CLOCK. RULED, AT LAST, INSTEAD OF DISCLOSED AGAIN.
      the_defect: >-
        SC-1's stamp duty requires reading a clock. A Coordinator subagent
        under this harness has no command-execution tool and cannot read one.
        SC-10 forbids inventing the value. THE DUTY IS UNSATISFIABLE BY
        CONSTRUCTION FOR THAT ROLE, and five prior artifacts across four
        batches responded by disclosing the gap again. A sixth disclosure is
        not a ruling.
      a_note_on_the_recurrence_COUNT_before_the_ruling: >-
        THE ORDINAL IS ITSELF INCONSISTENT AND THE RULING DOES NOT DEPEND ON
        IT. EV-AES-5283c8 called its instance the fourth; the amendment-005
        report calls itself the fourth; the snapshot receipt calls itself the
        fifth; the validator repeats the fifth; this task's card calls this
        instance the sixth. At least two records claim the same ordinal for
        different instances. The disagreement is recorded rather than smoothed;
        what is invariant is the capability fact, and that is what is ruled on.
      the_ruling: >-
        SC-1's STAMP DUTY IS CAPABILITY-CONDITIONAL FROM THIS DECISION FORWARD,
        UNDER GOAL-AES-002. A task whose tool surface carries NO
        command-execution tool DISCHARGES SC-1 in full by doing all four of the
        following, and is not in breach: (a) record every clock field as null
        with the capability reason named in the same block, never as an
        estimate, a proxy or an omission; (b) record the task as charged at its
        DECLARED budget under the C6 charged-at-declaration fallback, never at
        zero, and state in the same block that this is not a claim the
        declaration was respected; (c) state the capability fact itself -- that
        no clock, no hashing tool and no parser was available -- so a later
        reader can tell an unsatisfiable duty from a skipped one; (d) name in
        the receipt the party that owes each unfilled value. Where SC-1 and
        SC-10 cannot both be satisfied, SC-10 GOVERNS: a declared null is
        visibly missing while a fabricated stamp is indistinguishable from a
        real one and would corrupt exactly the audit trail SC-1 exists to
        create.
      the_dispatch_side_half_which_is_the_part_that_actually_prevents_recurrence: >-
        A HANDOFF MAY NOT PLACE A MEASURED VALUE IN A COMPLETION GATE FOR A
        ROLE THAT CANNOT MEASURE IT. From this decision forward under
        GOAL-AES-002, any task whose completion gate requires a timestamp, a
        digest, a parse result, a duplicate-key scan or a commit fact must
        EITHER be dispatched to a session holding a command-execution tool, OR
        re-assign those gate items IN THE HANDOFF, by name, to the orchestrating
        session. A gate a role cannot satisfy is a dispatch defect, and from
        the next batch onward a recurrence is charged AGAINST THE DISPATCHER
        and never against the producer.
      what_this_ruling_is_not: >-
        IT IS NOT A PROTOCOL AMENDMENT AND DOES NOT EDIT SC-1's TEXT. SC-1 is
        committed and immutable. This is a Coordinator ruling binding the
        dispatch of this goal, and the record that folds it into the standing
        constraint text is a SEPARATE authoring act under an identifier
        allocated by the dispatching session with `tools/allocate_id.py`. No
        identifier is minted here.
      self_application: >-
        THIS RULING BINDS THIS TASK'S OWN DELIVERABLES AND THEY ARE THE FIRST
        ARTIFACTS WRITTEN UNDER IT. EV-AES-1cd9e1's budget block and the ledger
        receipt's budget_stamps block each discharge SC-1 by (a) to (d) above
        rather than disclosing the gap a seventh time.
      supersedes: >-
        DEC-20260901-d264ea open item OI-3, which named the ruling as owed and
        offered the two options; and the deferrals recorded at
        protocol-amendment-GOAL-AES-002-005 OU-005-9 and at
        snapshot-receipt.json `division_of_labour.no_ruling_made_here`.

    ruling_2:
      title: >-
        THE ARCHIVE-ORDERING CONTRADICTION IN TASK-20260903-bdd0bb. RULED BY
        SUPERSEDING RECORD; NEITHER THE HANDOFF NOR THE QUEUE IS EDITED.
      the_contradiction: >-
        TASK-20260903-bdd0bb's committed objective reads "Commit the exact
        producer artifacts as immutable bytes, ALONE, BEFORE ANY REVIEWER READS
        THEM." Its committed `depends_on` names TASK-20260903-373afa and
        TASK-20260903-9318b5, BOTH OF WHICH ARE READERS. The queue therefore
        scheduled the snapshot archive after two of the reads it was written to
        precede. Both were committed before any task in the batch ran; this is
        a contradiction in the batch DESIGN, not a departure by any agent.
      the_ruling: >-
        THE OBJECTIVE'S "BEFORE ANY REVIEWER READS THEM" CLAUSE IS VOID AS
        APPLIED TO TASK-20260903-bdd0bb, AND WAS NEVER SATISFIABLE. THIS RECORD
        IS THE SUPERSEDING RECORD. Three consequences bind: (a) NO RECORD MAY
        CITE archives/TASK-20260903-bdd0bb/snapshot-receipt.json AS EVIDENCE
        THAT ANY REVIEWER READ POST-SNAPSHOT BYTES -- the receipt says so
        itself and this ruling makes it authoritative; (b) what protected the
        reviewed bytes IS the per-artifact preservation-commit sequence
        (7d895a33b, d6f309ad7, 85383bc7c, 04a2b9d47) plus the -005 reader's
        independent confirmation that its worktree differed from 85383bc7c by
        exactly one file, and that substitute is ACCEPTED as adequate for the
        narrow ordering fact and RECORDED AS WEAKER than a single atomic
        archive commit, exactly as the receipt's own binding_mode block states;
        (c) the receipt's declared `uncertainty_reduced` -- whether the gates
        the reviewer cards cite are committed when issued -- is NOT DISCHARGED
        by that archive, and no later record may treat it as discharged.
      the_forward_rule: >-
        A SNAPSHOT ARCHIVE'S `depends_on` MAY NOT INCLUDE A TASK THAT READS THE
        ARTIFACTS IT ARCHIVES. From this decision forward under GOAL-AES-002 a
        batch takes exactly one of two shapes and declares which: PER-PRODUCER
        SNAPSHOTS, each depending only on its own producer and each preceding
        every reader of that producer; or a BATCH-WIDE CONTENT ARCHIVE whose
        objective drops the before-any-reviewer clause and whose batch record
        declares the preservation-commit discipline as its ordering evidence.
        A task given both jobs is refused at dispatch.
      the_root_cause_the_receipt_asked_this_decision_to_settle: >-
        COMMITTING EACH ARTIFACT ON RETURN IS CORRECT AND IS RETAINED. It is
        what pinned the reviewed bytes and it is what made the -005 reader's
        independent ordering check possible. It is incompatible with an archive
        contract requiring the archive commit itself to introduce the whole
        source package, which is why binding_mode content_first was needed. THE
        HARNESS WANTS PRESERVATION-ON-RETURN PLUS content_first, and this
        decision records that choice so the next batch does not rediscover the
        conflict. CLAUDE.md already states the philosophy: archive receipts bind
        to CONTENT first, and a content mismatch is still fatal.
      one_check_originally_owed_here_is_DISCHARGED_by_a_stronger_route: >-
        The freeze receipt made the panel's ordering claim bind "from the
        archival snapshot commit", and named as owed the check that the
        archived tree contains no -005 text -- a check that could no longer be
        satisfied in that form because -005 now exists in the tree. IT IS
        DISCHARGED, BY A BETTER ROUTE: two independent sessions holding a
        command-execution tool verified FROM GIT, not from any attestation,
        that the amendments directory holds no -005 at 7d895a33b or at
        d6f309ad7, that -005 first appears at 85383bc7c, and that `git log
        --all` for that path returns exactly one commit. That is stronger than
        the tree check originally owed, because it quantifies over every ref
        rather than one tree.

    ruling_3:
      title: >-
        MUST A REVIEW TASK WHOSE PROTOCOL REQUIRES A PRE-READ SEAL DECLARE THAT
        SEAL IN artifact_paths? RULED: YES.
      the_situation: >-
        verdicts-sealed-preread.yaml is the artifact that makes the T-005
        column's blindness claim auditable at all, and verdict-tables-005.yaml
        designates it THE PRIMARY RECORD, omitting the per-cell reasoning from
        the published table on the ground that the seal holds it. It is NOT in
        TASK-20260903-9318b5's declared artifact_paths, which name exactly one
        deliverable. The dispatcher refused to bind a path outside the declared
        union, and the snapshot receipt still lists it among its eight path
        entries, so the receipt and the queue disagree about what the archive
        binds. THE BATCH'S MOST LOAD-BEARING INTEGRITY ARTIFACT IS THE ONE THE
        FORMAL ARCHIVE CANNOT COVER.
      the_ruling: >-
        (a) THE DISPATCHER'S REFUSAL WAS CORRECT AND IS UPHELD. An archive that
        binds an undeclared path is an archive whose scope was decided after
        the fact. (b) RETROACTIVE WIDENING IS FORBIDDEN AND IS NOT PERFORMED:
        this ledger archive does NOT add the seal to any completed task's
        declared set, because fitting a contract to an artifact produced
        outside it is the same failure mode this batch exists to measure. (c)
        FORWARD, UNDER GOAL-AES-002: ANY TASK WHOSE PROTOCOL REQUIRES A PRE-READ
        SEAL MUST DECLARE THE SEAL FILE IN ITS HANDOFF'S artifact_paths AND ITS
        write_scope BEFORE DISPATCH, and the seal must be committed in flight
        by the Coordinator as this batch's was. A seal the archive cannot cover
        is a protocol requirement the contract does not know about. (d) THE
        SEAL MUST CARRY ITS OWN PROVENANCE BLOCK: verdicts-sealed-preread.yaml
        carries no requested policy, no resolved model and no effort
        disclosure, so the record holding an entire column's reasoning has no
        provenance for what produced it and is reachable only through the
        record that does. A declared deliverable carries an inference block;
        this one escaped the completion gate solely because it was not
        declared, which ruling (c) fixes.
      what_this_batch_keeps_anyway: >-
        THE SEAL IS PINNED IN GIT AT 74eec580b AND BOTH REVIEWERS RECOMPUTED
        THE DIGEST INDEPENDENTLY, so the ordering fact the seal exists to
        establish is available and was verified twice. What is genuinely lost
        is that a consumer resolving only the archive's declared set does not
        receive the file the published column calls primary. That is recorded
        as a real cost and not argued away.

    ruling_4:
      title: >-
        A RECEIPT'S OWN commit_binding CAN GO STALE ON SUPERSESSION WHILE THE
        QUEUE STAYS CORRECT. RULED: ONLY THE QUEUE BLOCK IS AUTHORITATIVE.
      the_situation: >-
        The snapshot receipt's `parent_sha` names b70aae863, the parent of the
        SUPERSEDED archive commit 990fc0686. When the archive was re-committed
        as 4f5115ad0 to carry binding_mode content_first and the RQ-AES-002
        identifier, the queue block was updated and the same field inside the
        immutable receipt was not. The receipt therefore names the parent of a
        commit it is no longer part of.
      the_ruling: >-
        (a) FOR EVERY ARCHIVE UNDER GOAL-AES-002, dispatch_queue.json's archive
        block is THE AUTHORITATIVE BINDING for commit_sha, parent_sha and
        path_sha256, recomputed from the committed blobs; a receipt's own
        commit_binding fields are ADVISORY and may be stale after a
        supersession. (b) THE RECEIPT IS NOT EDITED, and correctly so: editing
        it would change its digest, invalidate the binding the queue block just
        established, and require a third archive commit. Records are corrected
        by superseding. (c) FORWARD: when an archive commit is superseded, the
        superseding queue block MUST record the stale value, the correct value
        and the cause -- as this batch's did -- and a receipt authored before
        its own commit exists MUST say which fields are owed and to whom, as
        both receipts in this batch do. (d) This ruling applies to
        TASK-20260903-8ede4c's own ledger receipt, whose parent_sha is null and
        named for exactly this reason.
      the_underlying_hazard_named_so_it_is_not_repeated: >-
        An archive receipt carrying a wrong binding field is the failure class
        CORR-20260802-a1f151 records five goals losing. Under content_first the
        parent is advisory and the content hashes carry the binding, so nothing
        downstream of THIS batch depends on it -- but a later reader of the
        receipt alone would take a stale parent for a live one, which is why
        the queue block, not the receipt, is named authoritative here.

    ruling_5:
      title: >-
        THE SPEC-10 ANCHOR LEAK. IS A BLIND RE-READING DISPATCHED, AND OF WHICH
        CELLS? RULED: YES -- AND OF THE WHOLE COLUMN, NOT OF TWO CELLS, AND NOT
        AS A STANDALONE ACT.
      what_is_ruled_on: >-
        The orchestrating session's card for TASK-20260903-9318b5 restated
        SPEC-10's two prior answers by name, the prior columns' undetermined
        marginals and a prior NOT_ENGAGED count, after instructing that reader
        to hash its verdicts before opening the prior tables. The reader marked
        one cell BROKEN_AND_DISCLOSED. The validator established the true scope
        is wider: SPEC-09 axis B shares that cell's entire decision path and is
        undisclosed, and ALL TWENTY CELLS sit under a column-level marginal
        anchor because the card supplied the marginals in a design whose
        deliverable IS that distribution.
      the_ruling_on_scope: >-
        A BLIND RE-READING IS DISPATCHED, AND ITS SCOPE IS THE ENTIRE T-005
        COLUMN -- ALL TWENTY CELLS -- NOT SPEC-10 AXIS B AND NOT SPEC-10 PLUS
        SPEC-09. The reason is structural rather than cautious: a cell-scoped
        repair can restore the two answer-level cells but cannot restore the
        AGGREGATES, and every aggregate the column publishes is downstream of a
        disclosed prior for those same aggregates. No statistic computed inside
        an anchored column can separate "the anchor did not bind" from "the
        anchor bound loosely". SPEC-09 axis B is inside the blast radius and is
        named as such; whether the anchor in fact propagated to it is UNKNOWABLE
        FROM HERE and no estimate is substituted for it.
      the_ruling_on_form: >-
        THE RE-READING IS NOT DISPATCHED AS A STANDALONE ACT. A standalone
        blind re-read would produce one more single-reader determinacy column
        -- the proxy this campaign already has three of and no measurements of
        the thing itself. It is therefore FOLDED INTO the two-reader control of
        `next_actions`, where the same reading cost buys the measurement that
        has never been made. The card for each reader is frozen and committed
        before launch (ruling_5b), restating NO prior verdict, NO marginal, NO
        count and NO author position.
      ruling_5b_frozen_cards: >-
        NO TASK CARD IN THIS BATCH IS A COMMITTED RECORD. All eight are
        five-line stubs, and the substantive text of the card that broke
        blindness exists in no file in this repository, so the only evidence of
        its content is the affected reader's quotation. THAT IS THE LARGEST
        AUDITABILITY GAP IN THE PACKAGE. FROM THIS DECISION FORWARD UNDER
        GOAL-AES-002: every dispatch card for a blinded reader is written to a
        file, hashed, and committed BEFORE that reader is launched, with the
        prohibition on restating prior results stated in the card itself so the
        reader can check its own card against the freeze. A blindness protocol
        whose breaches can only be scoped by the party affected by them cannot
        be audited.
      whose_defect_this_is: >-
        THE ORCHESTRATING SESSION'S, NOT THE READER'S. The reader could not
        decline to read the card that dispatched it, disclosed both leaks
        unprompted, refused to claim blindness for the affected cell, and
        recorded the remedy in the required words. That is recorded to its
        credit and does not reduce the finding.

    ruling_6:
      title: >-
        THIS TASK'S OWN OBJECTIVE NAMES A DELIVERABLE OUTSIDE ITS OWN WRITE
        SCOPE. RULED: THE NARROWER SCOPE GOVERNS; THE CHECKPOINT IS OWED, NOT
        DROPPED.
      the_contradiction: >-
        TASK-20260903-8ede4c's committed handoff objective says to commit "the
        goal-head batch checkpoint with exactly one next action". The same
        handoff's `artifact_paths`, its `deliverables`, and dispatch_queue.json's
        `write_scope` for this task all name exactly three paths, none of them
        ledger/goals/GOAL-AES-002.yaml. Both were committed before this task
        ran.
      the_ruling: >-
        THE DECLARED WRITE SCOPE GOVERNS AND THE CHECKPOINT WAS CORRECTLY NOT
        WRITTEN BY THIS TASK. Completion gate 4 forbids writing outside
        write_scope, and a subagent that widens its own scope to satisfy a
        prose objective is exactly the failure this batch exists to measure.
        The checkpoint is NOT dropped: it is OWED as a SEPARATE FOLLOWING
        Coordinator act by the orchestrating session, must quote this
        decision's single next action VERBATIM, and must preserve exactly one
        next action for the goal. It is named in EV-AES-1cd9e1's budget block
        as owed rather than as work dropped, and in the ledger receipt's
        open_and_unattempted and next_owed_actions.
      the_forward_rule: >-
        A HANDOFF OBJECTIVE MAY NOT NAME A DELIVERABLE ABSENT FROM THE SAME
        HANDOFF'S artifact_paths AND write_scope. From this decision forward
        under GOAL-AES-002 such a handoff is refused at dispatch and repaired
        before the task is claimed, rather than resolved by the executing agent
        at write time.

    ruling_7:
      title: >-
        THE ON-THE-FLY-TABLE GAP, OPEN SINCE THE BATCH OPENED AND STILL
        UNATTEMPTED. RULED: RECORDED ACCEPTANCE FOR THIS BATCH; REQUIRED ITEM
        FOR THE SUCCESSOR.
      the_situation: >-
        RC-6 and DEC-20260901-d264ea both name ON-THE-FLY TABLES as a shape the
        panel should span. SPEC-08 carries only the STATIC form. NEITHER
        VERDICT TABLE SAYS ANYTHING ABOUT ON-THE-FLY TABLES and no amendment
        clause has been tested against one. The freeze task disclosed this
        itself, the T-004 reader independently confirmed the gap is real, and
        the red team confirmed the producers' language is accurate. The cause
        is precise: the freeze task's handoff permitted further specifications
        to be drawn ONLY from committed CM-1 and amendment texts, which contain
        no on-the-fly construction, while the four red-team counterexamples
        entered by explicit requirement. THE RESTRICTION WAS APPLIED
        INCONSISTENTLY WITH THE HANDOFF'S OWN OTHER CLAUSE, and that is why the
        shape was excluded.
      the_ruling: >-
        (a) FOR BATCH-ae07ce: THE GAP IS ACCEPTED AND RECORDED, not silently
        carried and not described as screened. No conclusion of this batch
        extends to the on-the-fly shape, in either direction; the shape is OPEN
        AND UNATTEMPTED -- not tried, not screened, not negative, and not
        classified by anyone. (b) FOR THE SUCCESSOR INSTRUMENT: THE ON-THE-FLY
        VARIANT IS A REQUIRED ITEM, and the source restriction that excluded it
        is LIFTED for that panel -- its worked specification is authored from
        RT-20260901-3ad5d2's HELD-4 and the committed red-team report, which
        are committed records of this campaign exactly as the four
        counterexamples were. (c) A5-2's origin (gamma) band and B5-3's
        largest-charge maximiser are exercised by NO panel item; these are
        COVERAGE GAPS OF THE INSTRUMENT, NOT DEMONSTRATED DEGENERACIES OF THE
        TEXT, and the successor panel should carry an item exercising each or
        record why it does not.

  # =====================================================================
  # STANDING CAP. RECORDED AS A CAP, NOT AS A LIMITATION FOOTNOTE, BECAUSE
  # IT GOVERNS EVERY AGREEMENT-BASED READING OF THIS BATCH FOREVER.
  # =====================================================================
  standing_cap_model_independence:
    the_cap: >-
      MODEL INDEPENDENCE IS ZERO ACROSS BATCH-ae07ce, ITS TWO INDEPENDENT
      REVIEWS, AND THIS DECISION. NO AGREEMENT BETWEEN ANY TWO ARTIFACTS OF
      THIS BATCH IS CORROBORATION, AND NO LATER RECORD MAY READ ONE AS
      CORROBORATION.
    the_count: >-
      Nine of nine tasks self-report claude-opus-5: the panel freeze and its
      receipt, the T-004/T-003 columns, amendment 005 and its report, the T-005
      column, the snapshot archive, the VALIDATION, the RED TEAM, and this
      closing Coordinator. The same family authored
      protocol-amendment-GOAL-AES-002-003, -004 and RT-20260901-3ad5d2 -- the
      records the panel is built from and built to test.
    what_was_declared_instead: >-
      batch.yaml's `model_independence_note` and DEC-20260903-7548c0 both
      record that this batch's coordinator and validator tasks would run on
      fireworks/glm-5p3, a DIFFERENT family, EXPRESSLY to repair BATCH-241d37's
      recorded MODEL INDEPENDENCE ZERO. The plan was not fanciful: the opening
      decision itself was taken on that model. THE DECLARED REPAIR IS REALISED
      IN ZERO TASKS.
    it_is_not_a_policy_downgrade: >-
      The capability contracts were honoured. The anthropic binding for
      review-adversarial IS claude-opus-5 at ceiling `max`, above the requested
      xhigh; no session requested or accepted a downgrade and both reviewers
      record they would have refused rather than proceed. THE DIVERGENCE IS
      FROM THE BATCH'S STATED CROSS-FAMILY PLAN, NOT FROM THE POLICY LAYER, and
      the distinction is recorded so a later reader does not repair the wrong
      layer.
    the_asymmetry_that_cuts_both_ways: >-
      Where a review AGREES with a producer, that agreement is one further draw
      from a correlated set. Where a review DISAGREES, the disagreement is
      worth MORE precisely because it arose inside the correlated set -- but it
      is still one reader's reading. AND THE ABSENCE OF AN OBJECTION IS NOT
      EVIDENCE THAT NONE EXISTS: a shared blind spot of this family would be
      invisible to every artifact in this batch by construction. The red team
      states this of itself, and this decision states it of itself.
    what_the_cap_does_not_touch: >-
      The deterministic operations over committed bytes -- recomputed digests,
      git ordering checks, excision offsets and substring searches, the
      cell-by-cell copy test, and the metric recomputations -- are regenerable
      by any later reader from the commands recorded beside them, and their
      value does not depend on which model ran them. Every JUDGEMENT in either
      review, and every judgement in this decision, is capped.
    how_it_is_lifted: >-
      ONLY BY A CROSS-FAMILY DRAW. A -005 column, a validation or a red-team
      pass produced by a genuinely different family against the same items,
      dispatched with cards that restate no prior result. OPEN AND
      UNATTEMPTED: not tried, not screened, not negative.

  # =====================================================================
  # SUPERSEDING CORRECTIONS. AUTHORITATIVE VALUES; NO FILE IS EDITED.
  # =====================================================================
  superseding_corrections:
