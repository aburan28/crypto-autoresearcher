  # =====================================================================
  # PER-ITEM DISPOSITION.
  # =====================================================================
  item_dispositions:
    - item: ITEM 1 -- the frozen blind adjudication panel (TASK-20260903-59e9b9)
      disposition: DELIVERED AND NOT BLIND. THE INSTRUMENT IS COMPROMISED FOR ITS DECLARED PURPOSE.
      detail: >-
        The panel was frozen before any -005 text existed and that ordering is
        REAL, verified independently from git by both reviewers and by the -005
        reader rather than accepted on attestation. It quotes its ten items
        verbatim, its declared excisions do remove the verdict spans at exactly
        the offsets it names, and it discloses three residual leaks of its own
        accord. AND ITS EXCISION APPARATUS DISCLOSES THE FACTS THE EXCISION WAS
        PERFORMED TO WITHHOLD: every cut point is a QUOTATION of the removed
        text and every excision reason is drawn from a verdict-describing
        vocabulary, so each item carries its own prior-disagreement status and
        four items carry the governing clause, the deciding extensional fact,
        or the verdict in words. The panel's own `blindness_self_check` found
        two of these hits and dismissed them because they are "NOT AN ITEM'S
        SPECIFICATION" -- A LOCATION ARGUMENT OFFERED AGAINST AN INFORMATION
        QUESTION. A fifth residual leak of another class, found by the
        validator, is not in the panel's disclosure list and is misdescribed in
        the panel's own prose.
      what_this_costs: >-
        THE T-005 COLUMN'S SELF-DECLARED STRONGEST RESULT -- the P/P' pair
        classifying alike -- CAME FROM A READER THAT HAD BEEN TOLD, INSIDE THE
        INSTRUMENT, THAT THE PAIR COMPUTES THE SAME FUNCTION. That contamination
        is at the instrument level and therefore reaches all three columns. The
        validator's sentence naming the pair result "the column's strongest
        genuinely blind content" is SUPERSEDED by this decision; the validator
        owned the card-leak joint and the red team owned the instrument joint,
        and the composition is the Coordinator's to make.
      not_repaired_here: >-
        The panel is immutable and is NOT edited and no edit is proposed. The
        repair is a successor instrument under a new identifier, and it is this
        decision's single next action.
      cited_findings: [OBJ-RT-2, OBJ-RT-3, BL-1, BL-2, BL-3, BL-4, BL-5, LEAK-1, LEAK-2, LEAK-3, F-6, F-10]

    - item: ITEM 2 -- the T-004 and T-003-SUPERSEDED verdict columns (TASK-20260903-373afa)
      disposition: >-
        DELIVERED. THE NULL-OBJECT CONTROL IS GENUINE AND IS THE BEST THING IN
        THE BATCH; ITS PRE-REGISTRATION IS UNVERIFIABLE AND ONE PUBLISHED COUNT
        DOES NOT RECOMPUTE.
      detail: >-
        The 003 control passes a MECHANICAL cell-by-cell copy test rather than
        a summary reading: zero of twenty cells share a one-sentence reason,
        fifteen of twenty cite different clauses, eleven of twenty differ in at
        least one of verdict, determinacy and confidence, and reason similarity
        never reaches 0.71. THE NULL TABLE IS AN INDEPENDENT CLASSIFICATION,
        NOT A COPY, and it is the first control of its kind this campaign has
        run. The column also discharged the verbatim-quotation check the panel
        left owed, found two panel quotation defects and DEF-CM1-A, and
        reported PVF-1 -- a blind disagreement with -004's own author on an
        item RC-6 designated pass-capable -- against its own amendment's
        interest.
      three_defects_recorded_against_it: >-
        (i) ITS PRE-REGISTRATION IS UNVERIFIABLE BY CONSTRUCTION: the ordering
        receipt was written to an ephemeral scratchpad and the preimage is
        destroyed by the producer's own statement, so the digest binds nothing
        a later reader can check and the accompanying "40 of 40 triples
        identical" is self-attested. NO FABRICATION IS ALLEGED AND NONE IS
        SUSPECTED. The defect is that the batch's null-object control rests on
        evidence unfalsifiable in principle -- and the T-005 column solved the
        same problem properly forty minutes later inside the same scope rules,
        so the correct discipline was available and cheap. (ii) A FOURTH
        INFLATION SOURCE IS UNNAMED: the panel MANDATES completing T-004 before
        beginning T-003, so sequential carryover acts directly and only on the
        column carrying the headline contrast. (iii) One published derived
        count does not recompute; see `superseding_corrections`.
      cited_findings: [CC-1, CC-2, AC-3, AC-4, AC-5, PVF-1, PVF-2, PVF-3, DEF-PANEL-1, DEF-PANEL-2, DEF-PANEL-3, DEF-PANEL-4, DEF-CM1-A, DEF-004-1, DEF-004-2, DEF-004-3, INFL-1, INFL-2, INFL-3, OBJ-RT-4, OBJ-RT-5, F-5]

    - item: ITEM 3 -- protocol-amendment-GOAL-AES-002-005 and its report (TASK-20260903-d3bef8)
      disposition: >-
        DELIVERED AND ACCEPTED AS A COMMITTED RECORD. ITS DESIGN CLAIM HOLDS AS
        A DESCRIPTION OF WHAT WAS REMOVED AND FAILS AS A CLAIM THAT NOTHING WAS
        INSTALLED. THE AMENDMENT IS NOT WITHDRAWN, EDITED OR SUPERSEDED.
      detail: >-
        WHAT HOLDS: RC-1, RC-2 and RC-3 are present and non-vacuous, each with
        the requirement quoted and the carrying clause named; RC-3's deviation
        is a declared STRENGTHENING offered for attack rather than absorbed;
        the m=0 proves-too-much check was RE-RUN against the new clauses rather
        than inherited; the operative text carries no worked example, no panel
        item, no attack name and no verdict, which is a real structural
        improvement on -003 and -004 and is what made a blind third column
        possible at all; A5-3's de-testing of the extensional reading is a
        genuine removal that does measurable work; and B5-2's demotion of
        "stage" out of the charge is, in the red team's words, the single
        strongest structural move in the record and exactly the difference
        between redefining a failing term and taking it out. Scope inflation:
        NONE FOUND.
      what_fails: >-
        AT LEAST ONE NEW DECISION-CRITICAL PREDICATE IS INSTALLED, AND ON THE
        OPERATIONS ROUTE 3's BAR EXISTS FOR IT IS THE ENTIRE TEST. Reading
        CM-1's committed conversion routes directly, no route counts a
        ShiftRows permutation, a MixColumns transformation, a RotWord or an
        Rcon XOR, so A5-3's limb (3) cannot be false for A5-4 kinds (2) and
        (3); the three-limb conjunction collapses to "does the attack perform
        it", whose closing sentence turns on what appears in the attack's
        specification-level description -- the intensional half of superseded
        clause A-2 under a different name. Separately B5-3 installs "a set each
        of whose members determines a FULL KEY of the declared key size", a
        predicate the frozen items do not always supply, with a measured
        two-cell price. Two of the six controls do not establish what they are
        read as establishing (PT-2 cannot instantiate the multiplicity its
        guarded reduction removes; PT-A2's object is on the safe side of the
        antecedent by stipulation) and two more are variants of a third; PT-3
        is credited without qualification.
      three_further_live_gaps_recorded: >-
        RC-3's third limb passes under one denominator and fails under the
        other, and the amendment does not say which governs. B5-1's threshold
        makes the total charge NON-MONOTONE in the claimant's own declared
        per-member cost, in the direction that rewards conservative rounding,
        and no control looks in that direction. Every BUNDLED verdict in the
        T-005 column is decided by a tie at exactly one AEU-k per member and
        flips if O-CM1-2 ever closes with a measured r_k below one -- which the
        amendment never mentions.
      the_procedural_defect_that_governs_how_all_of_this_is_read: >-
        THE PANEL IS A TRAINING SET FOR THIS AMENDMENT BEING RE-USED AS ITS
        TEST SET. The -005 text postdates the T-004 column by 35 minutes of
        committed history, cites its blind cells twice by name, and carries a
        block explaining how clause B5-3 makes one named cell come out BUNDLED
        -- in the same file that asserts no clause was worded to make any cell
        come out a particular way. ZERO OF TEN ITEMS WERE HELD OUT. NO INTENT
        IS ESTABLISHED OR ALLEGED; what is checkable is that the record asserts
        both, and that the author disclosed the citation unprompted and named
        its own SPEC-10 resolution as the first thing a reviewer should be
        suspicious of.
      cited_findings: [A5-CHK-1, A5-CHK-2, A5-CHK-3, A5-CHK-4, CC-3, F-3, R1, R2, R3, R4, R5, D1, D2, D3, D4, HOLD-3, HOLD-6, OBJ-RT-1, OBJ-RT-6, OBJ-RT-7, OBJ-RT-8, OBJ-RT-9, OBJ-RT-10, OBJ-RT-12, PT-1, PT-2, PT-3, PT-4, PT-A1, PT-A2]

    - item: ITEM 4 -- the T-005 verdict column and its sealed pre-read (TASK-20260903-9318b5)
      disposition: >-
        DELIVERED, WITH THE STRONGEST PRE-REGISTRATION IN THE BATCH AND THE
        WEAKEST BLINDNESS. ADMISSIBLE AS A RECORD OF WHAT IT DID; NOT A BLIND
        MEASUREMENT OF WHAT IT WAS BUILT TO MEASURE.
      detail: >-
        THE SEAL IS GENUINE AND VERIFIABLE WITHOUT TRUSTING THE READER: both
        reviewers recomputed the sealed file's digest and matched it against
        the bytes committed at 74eec580b, whose committer timestamp follows the
        declared seal time and precedes publication. That establishes the
        verdicts were not rewritten after the outcome was known. It does not
        establish what the reader had read before sealing, and the reading list
        is testimony. The reader also disclosed, unprompted, two leaks from its
        own dispatch card that no external reviewer could have found; refused
        to claim blindness for the affected cell; preserved the checkable route
        so the reasoning survives independently of the anchor; derived its own
        NOT_ENGAGED count rather than inheriting the leaked one; and counted the
        marginal both ways. THAT IS THE CORRECT HANDLING OF A DEFECT IT DID NOT
        CREATE and it is recorded to the producer's credit.
      the_scope_of_the_break_as_established_by_the_validator: >-
        WIDER THAN DISCLOSED, AND THE WIDENING IS NOT RETRACTED. SPEC-09 axis B
        shares SPEC-10 axis B's clause path, verdict, confidence and the
        reader's own joint reasoning and carries no blindness annotation; and
        the card's separate disclosure of the prior columns' MARGINALS caps
        every aggregate the column publishes, in a design whose deliverable IS
        that distribution. No statistic computed inside an anchored column can
        separate "the anchor did not bind" from "the anchor bound loosely".
      one_accounting_point_recorded_against_the_column: >-
        SPEC-06 axis A was decided under a predicate the item never supplies --
        the item states an implementation technique and no specification-level
        operation count, and the reader's own sealed pre-read says the charging
        form is "NOT STATABLE FROM THIS SPECIFICATION" -- yet the cell is
        counted among the twelve informative decided cells while the reader's
        own rule IR-2 produced NOT_ENGAGED on two structurally similar cells.
        On the reader's own rule the column would be slightly WORSE than
        published, not better. Recorded, not adjudicated.
      cited_findings: [F-4, F-7, F-8, AC-5, PR-3, OBJ-RT-7, OBJ-RT-11, OBJ-RT-12, CH-1, CH-2, CH-3, CH-4, IR-4]

    - item: ITEM 5 -- the snapshot archive (TASK-20260903-bdd0bb)
      disposition: >-
        DELIVERED AND HONEST ABOUT ITS OWN FAILURE. THE ORDERING IT WAS GIVEN
        WAS UNSATISFIABLE BY CONSTRUCTION; SEE ruling_2.
      detail: >-
        Its seven declared digests were independently recomputed and matched by
        both reviewers at 4f5115ad0, in the worktree and at the snapshot, so
        the content binding is sound. The receipt disclosed, against its own
        interest, that a snapshot-before-review did NOT occur and that what
        actually protected the bytes was per-artifact preservation commits. Two
        binding fields in it are stale or over-broad -- a `parent_sha` that
        names the parent of a superseded commit, and a `path_sha256` entry for
        the pre-read seal that the archive does not in fact bind -- and BOTH
        ARE CORRECTLY LEFT UNEDITED, with the queue block carrying the
        authoritative values. See ruling_3 and ruling_4.
      cited_findings: [AC-1, AC-2, AC-3, AC-4, F-11, F-12]

    - item: ITEM 6 -- the two independent reviews (TASK-20260903-34d50e, TASK-20260903-2b5dc5)
      disposition: >-
        BOTH DELIVERED, MUTUALLY BLIND AS ATTESTED, AND BOTH INSIDE THE
        CORRELATED SET THEY WERE DISPATCHED TO BREAK.
      detail: >-
        The validator recomputed nine published metrics, all seven-plus
        declared digests, the git freeze ordering, the excision offsets and the
        null-control copy test, and returned `incomplete` with three named,
        closeable gaps rather than a hedge. The red team returned twelve
        objections, five of them new, an independent proves-too-much audit of
        all six of -005's controls, and the single cheapest decisive control in
        the batch -- and it disclosed of ITSELF that it is inside the
        correlated set. Neither read the other's report and neither corroborates
        the other. BOTH SELF-REPORT claude-opus-5.
      cited_findings: [F-13, LIM-1, LIM-2, LIM-3, model_independence_finding]

  # =====================================================================
  # RATIONALE.
  # =====================================================================
  rationale:
    - >-
      THE HEADLINE IS AN INSTRUMENT FAILURE, NOT A NEGATIVE RESULT, AND THE
      DISTINCTION IS THE WHOLE DECISION. This batch was convened because the
      operative claim of the repair line -- that two conforming readers reach
      the same verdict -- had never been measured, and because a null-object
      control was the only act that could say whether -004 bought anything. The
      instrument built to make that measurement carries, in its own excision
      apparatus, the prior-disagreement status of every item and, for four
      items, the governing clause, the deciding extensional fact, or the
      verdict itself. AN INSTRUMENT THAT LEAKS ITS ANSWERS DOES NOT MEASURE
      READER AGREEMENT. That is not a claim that the columns are wrong; it is a
      claim that they cannot discriminate, which is a different and more
      disabling thing, and it is why this decision is `inconclusive` rather
      than adverse.
    - >-
      THE LEAK WAS FINDABLE FROM THE INSTRUMENT'S OWN BYTES AND THE
      INSTRUMENT'S OWN CHECK LOOKED STRAIGHT AT IT. The panel searched itself
      for the verdict-bearing stems, FOUND them in two sentinels, and dismissed
      the hits on the ground that they are not an item's specification. That is
      a LOCATION argument answering an INFORMATION question, and it is the
      generalisable lesson: a blindness check must ask what the reader can
      read, never which field it sits in. The same error is why the panel's own
      LEAK-2 mitigation asserts the derived items are "interleaved by
      construction shape rather than by source" when they are a clean
      two-block partition by source whose boundary coincides with the
      disagreement-status boundary.
    - >-
      THE TIE-BREAKER IS ABSENT BY CONSTRUCTION, AND THE BATCH DECLARED IT
      WOULD BE PRESENT. batch.yaml and DEC-20260903-7548c0 both record that
      this batch's coordinator and validator tasks would run on
      fireworks/glm-5p3, EXPRESSLY to repair BATCH-241d37's recorded model
      independence of zero -- and the opening decision itself was taken on that
      model, so the plan was not fanciful. Every task in the batch self-reports
      claude-opus-5: the family that authored -003, -004, the red-team report
      the panel is built from, the panel, all three columns, amendment 005,
      the snapshot receipt, BOTH REVIEWS and this decision. Nine of nine. The
      red team states of itself that a shared blind spot of this family would
      be invisible here by construction. NO AGREEMENT ANYWHERE IN THIS BATCH IS
      CORROBORATION, and that includes the agreement between the two reviews
      and between either review and this decision.
    - >-
      TWO STRUCTURAL DEFECTS OF THE BATCH DESIGN COMPOUND THE LEAK AND ARE
      REPAIRABLE WHERE THE LEAK IS NOT. The panel is a TRAINING SET for
      amendment 005 re-used as its TEST SET -- zero of ten items held out, the
      text 35 minutes younger than the column it cites, and a block explaining
      how one clause makes one named cell come out one way -- so the -005
      column is an in-sample determinacy report whose power against a -006
      would be lower still. And the -005 reader's dispatch card, written by the
      orchestrating session, restated both prior answers on one cell and the
      prior columns' marginals, in a design whose deliverable is that
      distribution. NEITHER IS A PRODUCER DEFECT. Both are cheap to prevent:
      a held-out reserve, and frozen committed cards.
    - >-
      WHAT SURVIVES IS REAL AND IS NOT DISCARDED, BECAUSE PREMATURE CLOSURE IS
      A FAILURE MODE SYMMETRIC WITH OVERCLAIMING. The freeze ordering is real
      and was recomputed independently from git by both reviewers. The T-005
      seal is genuinely verifiable and its bytes are pinned before the outcome.
      The T-003 null-object control is genuine on a mechanical copy test and is
      the first control of its kind this campaign has run. The excisions did
      remove the verdict spans. RC-1, RC-2 and RC-3 are present and
      non-vacuous. R5 is discharged everywhere. Every producer disclosed
      defects against its own interest, two of which no external reviewer could
      have found. And the standing claim that -003 and -004 each died of
      relocated ambiguity HOLDS on named obstructions and constructed
      counterexamples rather than on a fatigue report -- the red team attacked
      that closure and it survived.
    - >-
      THE ADVERSE READING OF AMENDMENT 005 DOES NOT DEPEND ON THE COMPROMISED
      INSTRUMENT, AND IS THEREFORE STATED AT FULL STRENGTH IN ITS OWN SCOPE.
      OBJ-RT-6 reads CM-1's committed conversion routes and shows that A5-3's
      third limb cannot be false for the two operation kinds Route 3's bar was
      written about, so the whole test collapses onto a newly installed
      predicate that is the intensional half of the superseded clause under a
      different name. That is a derivation over committed rule text and it
      stands whatever the panel does. THE DESIGN CLAIM SURVIVES AS A
      DESCRIPTION OF WHAT WAS REMOVED AND FAILS AS A CLAIM THAT NOTHING WAS
      INSTALLED. Both halves are the finding.
    - >-
      THE METHOD CEILING IS THE REASON THE NEXT ACT IS NOT ANOTHER COLUMN. The
      most a determinacy column can establish is that ONE reader found a text
      decisive; the claim the amendments make is about TWO. No amount of
      column-building reaches it, the batch says so itself in three places, and
      the only two genuine two-reader data points the batch contains -- PVF-1
      and OBJ-RT-11 -- BOTH SPLIT, unremarked as a pattern. Two of two is not a
      rate; it is evidence that the proxy has not been shown to track the
      thing.

