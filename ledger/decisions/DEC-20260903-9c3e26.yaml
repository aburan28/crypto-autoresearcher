coordinator_decision:
  # =====================================================================
  # THE COORDINATOR DECISION CLOSING BATCH-ae07ce, GOAL-AES-002.
  # WRITE-ONCE. CORRECTIONS ARE NEW RECORDS, NEVER EDITS TO THIS ONE.
  # =====================================================================
  id: DEC-20260903-9c3e26
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-ae07ce
  recorded_by_task: TASK-20260903-8ede4c

  context: >-
    BATCH-ae07ce was opened by DEC-20260903-7548c0 to execute, verbatim,
    DEC-20260901-d264ea's single next action: freeze a blind adjudication panel
    of 8-10 hypothetical attack specifications BEFORE any amendment-005 text
    existed; classify it against amendment 004 AND, as the null-object control,
    against amendment 003's superseded text, publishing both tables whatever
    they showed; THEN author protocol-amendment-GOAL-AES-002-005 against the
    frozen panel with RC-1, RC-2, RC-3 and a re-run of the m=0 proves-too-much
    check; then re-run the panel against -005 and publish the third column. All
    four producer tasks ran and returned. Their outputs were snapshot-committed
    at 4f5115ad0 under binding_mode content_first, and then reviewed by two
    mutually blind independent sessions: VAL-20260904-34d50e (validator,
    verdict `incomplete`) and RT-20260904-2b5dc5 (red team, verdict on its
    owned joints: panel_blindness BREAKS). This decision disposes of that
    package. Evidence record EV-AES-1cd9e1 is committed alongside it, together
    with both review reports and this task's ledger receipt, in the same
    isolated ledger archive.

  decision: inconclusive
  decision_vocabulary_note: >-
    `inconclusive` IS NOT IN templates/research-records.md's LISTED ENUM FOR
    THIS FIELD, AND THAT DIVERGENCE IS DECLARED RATHER THAN HIDDEN BEHIND A
    NEARER-FITTING WORD. It is the value agents/coordinator.md names for
    exactly this situation ("If the evidence cannot discriminate between
    explanations, the decision is `inconclusive` -- say so plainly"), it is the
    value this task's card offers, and it is the term
    docs/evidence-and-reproducibility.md defines as "Data do not distinguish
    the relevant explanations". Choosing a listed word that asserted more than
    the evidence carries would be the failure this decision exists to avoid.
    tools/validate_ledger.py does not constrain this field; the divergence is
    recorded so a later schema pass sees it deliberately rather than as drift.
  decision_note: >-
    THE BATCH'S INSTRUMENT LEAKS THE ANSWERS IT WAS BUILT TO WITHHOLD, SO A
    DECISION RESTING ON ITS THREE COLUMNS AS A MEASUREMENT OF READER AGREEMENT
    IS NOT AVAILABLE, IN EITHER DIRECTION. The frozen panel names each excision
    by quoting the removed text and stating a reason, inside the item it
    annotates: all ten items carry their prior-disagreement status, the P/P'
    pair carries the deciding fact that P and P' compute the same function, and
    SPEC-08 carries its verdict in words. All three columns were classified by
    readers who record reading the panel in full. No cell therefore
    discriminates "the text decides this" from "the instrument told the reader
    this" -- and the one measurement that could have broken the tie, agreement
    between two independent readers, does not exist anywhere in the package and
    could not have corroborated anything if it did, because model independence
    is ZERO across nine of nine tasks including both reviews and this decision.
    That is the literal definition of `inconclusive` in
    docs/evidence-and-reproducibility.md, and it is stated plainly rather than
    dressed as a partial result.
  why_not_each_alternative:
    support: >-
      UNAVAILABLE. Nothing in the package supports the repair line's operative
      claim; the claim is measured on zero cells (VAL CC-6, F-1) and the
      instrument that would measure it leaks.
    weaken: >-
      REJECTED AS THE HEADLINE, THOUGH IT IS AVAILABLE FOR TWO SCOPED ITEMS AND
      IS TAKEN THERE. EV-AES-1cd9e1 carries `direction: weakens` for exactly two
      claims about this campaign's own artifacts -- that the panel is a blind
      instrument, and that amendment 005 installed nothing -- each backed by a
      refutation artifact archived before the decision relying on it (the
      panel's own committed sentinels; CM-1's committed conversion routes read
      against A5-3). Taking `weaken` as the DECISION would extend those two
      scoped readings into a verdict on the repair line, which the compromised
      instrument cannot carry and which would be an overclaim in the adverse
      direction. Overclaiming adversely is still overclaiming.
    reject_scoped: >-
      FORBIDDEN HERE ON TWO INDEPENDENT GROUNDS AND NOT TAKEN. First,
      agents/coordinator.md forbids `reject_scoped` on a single unreplicated
      empirical-only run and requires `weaken` plus replication instead. Second
      and decisively, a rejection would rest on the three columns, and the
      columns are not a measurement of what a rejection would be about.
    replicate: >-
      REJECTED, AND THE REASON IS THE POINT. `replicate` would say the
      measurement was valid and needs repeating. IT DOES NOT NEED REPEATING; IT
      NEEDS A NEW INSTRUMENT. Re-running three columns against a panel that
      names what it cut reproduces the leak faithfully.
    expand: >-
      REJECTED. Widening an instrument that leaks widens the leak. The next act
      is narrower and cheaper, not broader.
    refine: >-
      CONSIDERED SERIOUSLY AND REJECTED AS A LABEL, THOUGH THE NEXT ACTION IS A
      REFINEMENT OF THE INSTRUMENT. `refine` would describe what happens next
      while asserting that the evidence discriminated well enough to steer it.
      It did not; what steers the next action is a defect in the instrument,
      not a signal in the data. The refinement is recorded where it belongs, in
      `next_actions`.
    pause: >-
      REJECTED AS PREMATURE CLOSURE, which is a failure mode symmetric with
      overclaiming. NEITHER REVIEW ASSERTS THE REPAIR LINE IS SATURATED and the
      red team expressly declines to; -005 made two structural moves the red
      team credits without qualification (the de-testing of the extensional
      reading, and the demotion of "stage" out of the charge) that its
      predecessors did not, on a line where two prior attempts failed. No pause
      condition of GOAL-AES-002 is met: the campaign budget is not exhausted,
      the admissible object classes are not exhausted, and a concrete,
      zero-compute, decisive-in-one-direction successor exists and is dispatched
      below.

  semantic_disposition: BATCH_CLOSED_INSTRUMENT_COMPROMISED_OPERATIVE_CLAIM_STILL_UNMEASURED

  decision_scope: >-
    DISPOSES OF BATCH-ae07ce's FOUR PRODUCER OUTPUTS AND ITS TWO INDEPENDENT
    REVIEWS, AND NOTHING MORE. It creates no hypothesis, approves no experiment
    and no cryptanalytic measurement, changes no hypothesis status (there is
    none), changes no GOAL-AES-002 status (the goal stays `active`), records no
    completion_quorum block and no attestation -- none was obtained, and
    recording one that was not obtained is forbidden -- promotes no knowledge,
    moves no asymptotic promotion gate, states no margin, and ASSERTS NOTHING
    ABOUT AES AT ANY ROUND COUNT IN EITHER DIRECTION. It does NOT withdraw,
    edit or supersede amendment 005, which stands as a committed record; it
    does NOT adjudicate whether any clause of CM-1 or of any amendment gives
    the right answer for any construction; and it does NOT void the frozen
    panel, both verdict-table records or the snapshot receipt, every one of
    which remains committed, immutable and unedited. Every repair named below
    is a future record under a new identifier minted by the dispatching
    session, never an edit.

