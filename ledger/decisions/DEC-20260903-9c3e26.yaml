      against: >-
        coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-373afa/verdict-tables.yaml,
        field `comparison_of_the_two_tables.informative_subset_counts.T_004.forced`
        and the narrative sentence in `what_the_null_object_control_shows.did_004_buy_anything`.
      published_value: >-
        forced: 5, and "Forced cells rise from 4 to 5 on the informative
        subset".
      authoritative_value: >-
        forced: 7 under the record's OWN rule R-c, which defines
        FORCED_BY_CONSTRUCTION as FORCED with an additional disclosure and
        which the same record applies inclusively everywhere else. The thirteen
        informative T-004 cells carry five strictly-FORCED grades and two
        FORCED_BY_CONSTRUCTION. LIKE FOR LIKE THE INFORMATIVE FORCED COMPARISON
        IS 4 TO 7 INCLUSIVE, OR 3 TO 5 STRICT. The published sentence compares
        T-003 inclusive against T-004 strict.
      direction_of_the_error: >-
        AGAINST THE PRODUCER'S OWN INTEREST -- it UNDERSTATES the determinacy
        gain the record is reporting -- which is why it is recorded as an
        arithmetic slip and not as inflation.
      what_is_unaffected: >-
        The headline discrimination result (7 of 13 informative cells differ
        between the two texts) is untouched, and every other recomputed count
        agrees set-identically.
      not_repaired_in_place: >-
        The producer record is immutable and is NOT edited. This block is the
        authoritative value.
    - id: SC-B
      against: >-
        coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-9318b5/verdict-tables-005.yaml,
        field `seal.reproduced_unchanged_note`.
      published_claim: >-
        The published table cells are "byte-equivalent in verdict, clause list,
        confidence and indeterminacy locus to the sealed file".
      authoritative_statement: >-
        VERDICT-, CONFIDENCE- AND LOCUS-IDENTICAL ON 20 OF 20 CELLS; CLAUSE
        LISTS EQUIVALENT UP TO ORDERING AND PARENTHESISATION, DIFFERING IN FIVE
        CELLS; THREE charging_form FIELDS ABBREVIATED FROM LONGER SEALED TEXT
        WITH THE SAME SYMBOLIC CONTENT.
      material_effect: >-
