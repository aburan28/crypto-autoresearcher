  context: >-
    /design-experiment, one contract, for IDEA-20261005-b4c2bf. No
    hypothesis and no experiment on origin/main cites that idea. The
    question id on the idea is RQ-ECTD-001. The branch
    design/volc-b4c2bf-root was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The prime is p = 41. E_crater is y^2 = x^3 + 12 x + 24. E_floor is
    y^2 = x^3 + 3 x + 40. E_scaled is y^2 = x^3 + 28 x + 19, the image
    of the crater under scaling by u = 2. The prediction is that the
    absolute movement of the least rational order-3 x-coordinate from
    the crater to the floor is at most its movement from the crater to
    the scaled model, and that the scaling movement is at least 1. A
    larger volcano movement is a negative, so success can fail. No
    isogeny-path algorithm is claimed and the generic square-root
    exponent is not changed.

    This session opened ledger/questions/RQ-ECTD-001.yaml,
    knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml,
    knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml, and
    knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml. It read
    IDEA-20261005-b4c2bf from commit efaa5e0b09 and checked out those
    bytes unchanged. A design-time graph walk named the models. The
    root integers and the gaps are not part of the frozen prediction.
    The executor recomputes them. No run of EXP-ECTD-e79910 was started.
    The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, the enumeration seed, replication,
    budget, stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any gap is scored. A larger volcano gap is a negative.
    - Two root methods, the scaling-equation check, and the self-gap check give the comparison a way to come back invalid rather than as a false success.
    - Success is only the first assignment row, so success can fail.
    - The named prime is 41 and the named models are E_crater, E_floor, and E_scaled. The protocol does not claim an isogeny-path algorithm.

  evidence_refs: []
  limitations:
    - Toy scope only: one pair at p = 41. No transfer to a cryptographic prime or to a secret path.
    - The uniform-minimum expectation is a pointer for the heuristic. It is not the counter.
    - This decision authorizes a later run. It does not start one.

