coordinator_decision:
  id: DEC-20260805-0b3e11
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-4bc9bc
  recorded_by_task: TASK-20260805-dc5e1a
  authorized_by: DEC-20260803-4d4528
  recorded_at: '2026-08-05'

  decision: weaken
  decision_label: >-
    The residual replicates and is localised out of the campaign's subject
    matter. Retire GOAL-MLKEM-004 as closed_at_budget: C2, the only criterion
    asserting a result, is not met, and there is no named obstruction.
  decision_vocabulary_note: >-
    `weaken` describes the batch. The goal disposition is separate and is
    recorded below.

  context: >-
    Batch 6 of 6, the last under the campaign budget. It replicated the one
    quantity that had survived batch 5's reviewers, from n = 2 to n = 16, and
    put the correct candidate into every candidate group for the first time in
    the campaign's life.

  coordinator_validity_check: >-
    Both reviews ran concurrently in independent sessions with nothing
    forwarded, and both re-derived from independently written code. Neither
    committed its own artifacts.

  what_is_weakened:
    - >-
      THE INTERPRETATION, not the arithmetic. The departure replicates -- exact
      exchangeability p = 0.0303 over 32 pooled draws on the three headline
      groups -- and the validator's ABL-Y-only arm, holding the real sieve X
      EXACTLY FIXED, reproduces the whole of it. It is therefore not a property
      of sieve geometry, lattice membership, or vector shortness.
    - >-
      The rejected null was known false by construction. The package's own
      membership certificate IS the statement that y is a deterministic function
      of x, so OUTSIDE_LOW licenses only "not the ablated object" -- which
      nobody disputed.
    - >-
      The five groups are three nested families, so "3 of 5" is 2 of 3, and
      uniform_8's INSIDE is a 49.5% coin flip that flips on the validator's own
      draws.
    - >-
      A second certified dual family for the same instance sits ABOVE the sieve
      on all five groups.
    - >-
      Any operational reading. DEV-5 is confirmed and strengthened: the
      sensitivity curve is provably non-monotone with a closed-form minimum at
      t = 0.365 and a crossing at t* = 0.7259, so OP-HARDER is emitted for every
      shared fraction in (0, 0.726), and every real cell sits in an
      uncharacterised region a factor of nine below the grid's smallest point.

  what_is_strengthened:
    - >-
      The object is sharper than the package claimed, in the producer's favour.
      The red team's ROWPERM decomposition is COMPLETE, because closed_form_cov
      depends on X only through X X^T and row norms, and it places the deficit
      entirely in the ALIGNMENT between the pool's Gram matrix and the candidate
      phase matrix.
    - >-
      The red team attacked the axis it was given, FAILED, and reports that
      failure as its most important finding -- its conjectured mechanism
      (pairwise-reduced pools, lighter Gram tails) was refuted by measurement at
      pairwise cosine sd 0.16924 against 0.16890.
    - >-
      Provenance is the campaign's cleanest: a hash-declared narrative
      extraction verified independently by both reviewers, all artifact hashes
      matching, zero unbounded loops, and T2 bit-reproducible to 17 significant
      figures.

  goal_disposition:
    status_set: closed_at_budget
    status_rejected: completed
    budget: batch 6 of 6 under DEC-20260803-4d4528; exhausted.
    criteria_assessment_by_the_coordinator:
      - criterion: C1
        text: >-
          A measured score distribution of sieve-produced dual vectors at a
          stated set of reduced dimensions, fully parameterised and reproducible
          from the archived script.
        met: true
        note: >-
          Met by EV-MLKEM-da9e3b and re-verified this batch. I record the red
          team's reading that "a stated SET of reduced dimensions" has ONE
          element here, and that on a reading requiring two or more C1 fails
          too. I do not adopt that stricter reading, because manufacturing a
          failure is as dishonest as manufacturing a success -- but the
          ambiguity is real and RC-5, the dimension sweep, went unmet for three
          batches.
      - criterion: C2
        text: >-
          An explicit comparison of that measured distribution against the
          independence structure underlying MATZOV.Nf's closed-form advantage
          computation, reporting the direction and size of any departure, or
          reporting agreement, with a null object of the right shape run BEFORE
          any departure is believed.
        met: false
        reason: >-
          THIS IS THE CRITERION CARRYING THE OBJECTIVE AND IT IS NOT MET, on
          every clause independently. (a) No comparison against Nf was ever
          made: batch 2 PROVED no admissible tuple exists for this design, and
          the batch-6 package disclaims it in report.md. (b) DIRECTION is
          structurally unavailable -- DEV-5 shows the sensitivity curve is
          non-monotone and every label sits in an uncharacterised region. (c)
          SIZE is not established: the departure that replicates is not about
          the object, per the validator's ABL-Y-only arm. (d) A NULL OF THE
          RIGHT SHAPE was never run before belief -- batch 1's could not fail,
          batch 2's statistic never read y, batches 3 and 4 measured forced
          quantities, batch 5's removed the wrong object, and batch 6's ablation
          bundle is not minimal.
      - criterion: C3
        text: Independent Validator and Red Team sessions admit the run package.
        met: true
        note: Met for this batch. Procedural.
      - criterion: C4
        text: Coordinator evidence, decision and knowledge entry committed through a verified ledger archive.
        met: true
        note: Satisfied by this archive. Procedural -- any archived batch satisfies it.
    rationale: >-
      C1, C3 and C4 are instrumental and procedural: they describe how a result
      would be produced, reviewed and recorded. C2 is the only criterion that
      asserts a RESULT, and it is the one the objective is written around.
      Reading "a declared completion criterion" as satisfied by C4 alone would
      make every archived batch a completed goal -- the same absurdity I
      identified and rejected when closing GOAL-MLKEM-003 in DEC-20260803-64b55b,
      where I recorded that its criterion 3 "is procedural -- any archived batch
      satisfies it -- and cannot carry a completion on its own". Consistency
      with that precedent requires the same reading here.
    anti_understatement_check: >-
      The closure quorum is suspended, so closed_at_budget avoids nothing and
      costs nothing; the choice rests on the criteria alone. The campaign's real
      products are recorded at full weight below, not diminished by the status.
    difference_from_GOAL_MLKEM_003: >-
      GOAL-MLKEM-003 closed with a NAMED OBSTRUCTION -- its instrument could not
      answer its question, and no further batch of that kind would have helped.
      THIS GOAL HAS NO SUCH OBSTRUCTION. Its instrument works, its measurements
      reproduce, and its question remains answerable. This is budget exhaustion,
      not a method ceiling, and the record must not blur the two.
    completion_quorum: >-
      Not applicable and not sought. closed_at_budget asserts no success, and
      the three-model quorum is suspended. No attestation is recorded because
      none was obtained.
    reviewer_agreement: >-
      The red team read the criteria independently and reached the same
      disposition, closed_at_budget not completed, on the same ground: C2 is the
      only criterion asserting a result and it is unmet. It flagged the
      goal record's "a declared completion criterion" (singular) as "exactly
      that seam". No disagreement to preserve on the disposition; our readings
      differ only on C1's "set", recorded above.

  what_six_batches_actually_produced:
    stated_at_real_weight: >-
      Recorded neither inflated nor dismissed, as the ledger card required.
    products:
      - >-
        SIX OBSERVABLES PROPOSED AND SIX REFUTED, five of them shown forced by
        construction and the sixth localised out of the subject matter. Each
        refutation is archived with the ablation that produced it.
      - >-
        THREE SUCCEEDING TECHNIQUE ENTRIES -- KN-TECH-9d21c4, KN-TECH-6c0e15,
        KN-TECH-1a5b7e -- each superseding rather than editing, each carrying
        its predecessor's corrections. The strongest evidence they are real
        techniques: the batch-5 validator used the entry's own obligation-4 move
        to convict the batch that wrote the entry, and the batch-6 producer's
        own frozen rule was caught by the mode-4 check its predecessor added.
      - >-
        A WORKING INSTRUMENT (KN-TECH-14efa5, from the predecessor campaign),
        rebuilt from scratch and verified before measurement in every batch that
        needed it.
      - >-
        One quantity that replicated under an independent ensemble and was then
        localised to the alignment between a pool's Gram matrix and a candidate
        phase matrix -- a smaller, sharper object than the campaign was aiming
        at, with no operational sign.
    what_it_did_not_produce: >-
      An answer to its own question. Whether the dual-sieve independence
      heuristic holds is exactly as open as it was when GOAL-MLKEM-003 closed.
      No ML-KEM break, no security claim in either direction, no exponent moved.

  coordinator_error_corrections:
    - id: CE-1
      title: Two minor quotation defects in the final snapshot message.
      raised_by: RT-20260805-a98111 OBJ-8, OBJ-9
      what_i_wrote: >-
        Snapshot 0d34dfcb states SENS-T1 "cleared its 0.05 threshold by 0.3952"
        -- 0.3952 is the gap, and the margin over threshold is 0.3452 -- and
        renders the producer's "most important CAVEAT in T2" as "the most
        important thing T2 produced".
      why_it_matters_less_than_the_last_one: >-
        The red team verified the quote-only-from-declared-paths rule adopted
        after CE-1 of DEC-20260804-485fa6 was KEPT: every quoted string traces
        to report.md, every figure to results.json, results_t1.json or
        results_t2.json, and the hash-verified extraction checks exactly. It
        states explicitly this is NOT the fabricated-attribution class. The rule
        worked; these are ordinary paraphrase errors and are corrected here.

  process_defects_carried_forward:
    - id: PD-4
      status: >-
        STILL OPEN and still not worked around. The harness requires review
        artifacts to sit uncommitted across a dispatch window, which destroyed
        both BATCH-c45baf reviews. The fix -- let an archive task verify an
        already-committed source BY HASH rather than requiring it in the commit
        diff -- belongs in its own reviewed PR against tools/research_dispatch.py
        with tools/test_research_dispatch*.py extended, not in a Coordinator
        improvisation. It is recorded here so it does not die with the goal.

  explicit_non_claims:
    - No ML-KEM break. No attack implemented, run, or claimed. No speedup.
    - No security proof and no security claim in either direction.
    - No FIPS 203 parameter set affected or cleared. Toy scale throughout.
    - >-
      The independence heuristic is NEITHER validated NOR refuted, after six
      batches. That is the campaign's honest terminal position.
    - No operational direction, structurally unavailable.
    - No exponent moved, no cost reduced, no attack improved.

  official_status_changes:
    - record: EV-MLKEM-2cd08b
      from: null
      to: recorded
    - record: GOAL-MLKEM-004
      from: active
      to: closed_at_budget
  official_status_changes_note: >-
    No other record changes status. Rule 12 was UNMET and UNWAIVED for the
    entire life of this goal and no EV-MLKEM-* status was changed by any of its
    six batches.

  knowledge_promotion:
    promote: false
    promoted: []
    not_warranted: >-
      NOT WARRANTED. KN-TECH-1a5b7e was created under DEC-20260804-485fa6 NA-3
      and now carries two further curator corrections owed (the 1/n against
      1/(n+1) exchangeability rate, and mode 5 advising "report the interval,
      not the point" while reading its verdict off the interval's endpoint).
      Those are for the successor to issue as a supersession. Promoting the
      residual would be promotion of a one-instance result already localised out
      of the campaign's subject matter. The two promotions inherited from
      GOAL-MLKEM-003 -- the KN-FIND-012 restatement and the KN-FIND-014
      withdrawal -- remain rule-12 blocked and are inherited by the successor
      unchanged.

  ranking_rationale: >-
    Closing at budget rather than extending, because the budget is the budget
    and a seventh batch was not authorised. Closing at budget rather than
    completed, because C2 is unmet. NOT closing the lane, because there is no
    obstruction: the question is still answerable and the successor's first two
    checks are named and cheap.

  limitations:
    - One instance and one database for every measurement in the final batch.
    - >-
      Every participant across all six batches resolves to claude-opus-5.
      Independence is procedural, not model-level, and no batch of this campaign
      achieved model-level independence.

  evidence_refs:
    - EV-MLKEM-2cd08b

  references_unchanged_by_this_decision:
    - EV-MLKEM-d777f0
    - EV-MLKEM-ba6c25
    - EV-MLKEM-b43de0
    - EV-MLKEM-50901f
    - EV-MLKEM-da9e3b
    - EV-MLKEM-015
    - KN-OPEN-016
    - KN-TECH-14efa5

  target_ids:
    - GOAL-MLKEM-004

  next_actions:
    - id: NA-1
      owner: user
      action: >-
        Decide whether to open the successor goal. It is NOT opened here --
        opening a campaign is not within a closing decision's authority.
      successor_first_batch: >-
        RC-5, the m-sweep at fixed (N, K), pre-registered against the producer's
        own falsifiable prediction that the uniform floor tracks 1 - O(K/m);
        plus RC-G (at least four real databases, converting the real arm from
        n = 1) and RC-A (an arbitrary non-dual coupling). The validator adds the
        one cheap un-run control that would settle what the residual is carried
        by: an ablation PRESERVING the coupling y = A^T x mod q while destroying
        the sieve geometry.
      why_it_is_not_this_campaign_renamed: >-
        The red team's reasoning, which I adopt: six batches varied the OBJECT
        at fixed parameters, and every refutation exhibited another object. The
        successor varies the PARAMETER and the REPLICATE, with a stopping rule
        that can produce the program's first named obstruction.
    - id: NA-2
      owner: user
      action: >-
        Rule 12 remains the standing blocker across both campaigns. Two
        knowledge promotions are OWED and unexecutable without a second backend
        or a provisioned model for a `review-breakthrough` at policy `max`.

  decided_by: coordinator
  decided_at: '2026-08-05'

  inference_provenance:
    requested_policy: coordinator-archive
    fallback_used: false
