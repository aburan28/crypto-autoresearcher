      - >-
        2. Replication. A precondition of any closure of regime-A replay
        (NA-6) and of any KN-FIND on Lemmas 1-3; it also decides whether the
        "1 in R_4" rate may be quoted beyond one curve. It reuses the reviewed
        Stage-1 instrument. Estimated 3-5 h of compute.
      - >-
        3. Stage 2. The only remaining P-GPU route (NA-2), but a
        constant-factor lane with sota_delta zero, the most new code (an
        F_{2^n} Macaulay engine, delta, determinant checks) and the heaviest
        compute (tens of hours). Ranked within CERTBIN and not above
        exponent-targeting ECC work elsewhere (DEC-20260923-f25b97 rationale).
    concurrency: >-
      All three may run concurrently. Machine limits (4 cores, 15 GB) bind:
      RC-1 1 worker and 3 GB, replication 1 worker and 4 GB, Stage 2 at most
      2 workers and 4 GB; totals 4 workers and 11 GB of caps, leaving headroom
      for the OS and the dispatching session. Focus discipline
      (agents/coordinator.md) allows at most three critical experiments; this
      is three. If the dispatching session observes memory pressure, it
      launches RC-1 and the replication first and Stage 2 when either
      returns. Idle capacity does not justify a fourth lane.

  rationale:
    - >-
      WHY APPROVE ALL THREE NOW. Each resolves a decision-changing
      uncertainty named in DEC-20260923-f25b97 and states its positive,
      negative and inconclusive next decisions (attention_contract in each
      specification). None duplicates another: RC-1 fixes instances and
