  ranking:
    order: [EXP-CERTBIN-e94b27, EXP-CERTBIN-3f06d1, EXP-CERTBIN-a58c63]
    rationale:
      - >-
        1. RC-1. DEC-20260923-f25b97 adopted it as the FIRST follow-up on
        "1 in R_4" (RC-1), before that rate enters any closure or ranking. It
        is the only one of the three that touches refutation degree on
