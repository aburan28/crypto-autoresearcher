    - id: R-C
      concerns: Stage 2 pre-compute audit (KN-TECH-080; agents/coordinator.md "Proof-oriented dispatch gate").
      finding: >-
        METHOD CEILING AND OBSERVATION COLLISION IN THE PROPOSAL AS WRITTEN.
        Lemma B-S (derived in H-CERTBIN-b20d4e): in regime B, an unsatisfiable
        target has 1 in R_D iff D >= delta(x_R) + 4, where delta is the total
        degree of the reduced interpolant of 1/S_3 on V x V; generically
        delta = 2^{l+1} - 2 (the top coefficient is sum_{V x V} 1/S_3 /
        lambda_0^2). At the requested l = 6, D = 2^l + 2 = 66 therefore
        refutes no unsatisfiable target, the rows are independent for
        satisfiable and unsatisfiable targets alike (rank 2028), and a trace
        match there does not separate a relation from a non-relation. A
        "stable trace" verdict at that cell would be cheap and would not bear
        on P-GPU. Separately, the idea's H2 bound sum_k d_k / 2^n is vacuous at
        every tested cell by degree counting (up to about K_B^2 against 2^n).
      ruling: >-
        REPAIR IN DESIGN, NOT RETURN. The requested cells (n in {17, 19},
        l = 6, D = 66, both regimes, identical targets, rejection-sampled sat
        arm, planted arm, regime-B same-support null) are kept EXACTLY. Added
        before any data: the l = 5 cells, where the same D = 66 = 2^{l+1} + 2
        and the same 2278 columns make the elimination a complete solver; a
        competence gate (DB-2) and a P-GPU rule (DB-7) that reads regime-B
        stability only where the elimination decides the attempt; per-instance
        Lemma B-S checks (C-DELTA, C-RANKB); TS2B in place of H2 as the
        predictive heuristic, with H2's 0.9 threshold unchanged. KN-TECH-080
        permits admitting a ceiling as a bounded task with its own honest
        claim; the repair keeps every requested element and adds only cells
        and controls, so a return would cost a round and buy nothing.
      what_replaces_lemma_2_in_regime_B: >-
        Lemma 2B: under the declared elimination the k-th pivot entry is the
        Schur complement Delta_{k+1}(x_R) / Delta_k(x_R) of leading minors
        along the reference's pivot sequence, each a polynomial in x_R of
        degree <= 2 * (number of S_3 rows among the first k pivot rows). The
        fixed-schedule survival set is the complement of the roots of
        prod_k Delta_k: cofinite, not an affine subspace. Each nonconstant
        condition removes at most deg Delta points; it does not halve the
        survivors. Heuristic TS2B (random-polynomial minors: expected one root
        each) turns this into the testable break-count prediction
        Poisson(N * K_B / 2^n). The regime-B form of RC-2 counts distinct
        breaking targets, not (reference, pivot) pairs.
      flagged_for_user: >-
        The l = 5 cells are a Coordinator addition to the scope the user
        approved. They add cost (two more cells of the same matrix width) and
        no requested element is dropped. If the user objects, strike the two
        l = 5 cells by a superseding decision BEFORE the design snapshot
        commits; the l = 6 cells then stand alone with DB-7 predicted "NOT
        SUPPORTED: DOES NOT DECIDE".
    - id: R-D
      concerns: Stage-1 review lessons carried into every successor (DEC-20260923-f25b97 RC-2, RC-3, OBJ-*, F-*).
      ruling: >-
        Carried as follows.
        - RC-2: TS1R's evaluation set over hull-rank-increasing pivots,
          deduplicated by (form mod W^perp, survivor set)
          (H-CERTBIN-7c3a18; replication M2R; Stage-2 MA2); regime B counts
          distinct breaking targets (Stage-2 MB3).
        - RC-3: exact or log-space tails in every contract's tail_checks.
        - OBJ-3: the target hull (Tr(x) = Tr(A) hyperplane, affine for h = 2)
          measured per family, and K_rank reported over F_2^n and on the hull.
        - OBJ-4: distinct measurements counted.
        - OBJ-6: f_div and K_rank co-primary with retention.
        - OBJ-9: oracle A in every dominated_by.
        - F-J2-1: PS0' certificates in all three contracts; RC-1 certifies
          every counted refutation.
        - F-J2-2: C-UNIF replaced by C-FORMS and C-SURV.
        - F-J2-3: C-REV and C-NULLS given failure conditions.
        - F-J2-4: three independent C-PROPS failure modes.
        - F-J3-1: M3 first-match precedence written out.
        - R-1: fallback_allowed true with the runtime-native reason on every
          new executor card; degraded_allowed false.
    - id: R-E
      concerns: Inference binding of the new cards.
      ruling: >-
        Executor cards request executor-implementation with fallback_allowed:
        true and fallback_reason "runtime inheritance" (DEC-20260923-4d7a19
        R-1 forward rule). Archive cards request
        coordinator-orchestration-code with fallback_allowed: true for the
        same reason. This is not a tier downgrade.

