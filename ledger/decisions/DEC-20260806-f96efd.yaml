coordinator_decision:
  id: DEC-20260806-f96efd
  context: >-
    GOAL-SSIQ-001 BATCH-012 -- the fourth and, under the current extended
    campaign_budget, final batch (maximum_batches: 12, 8 original + 4
    extension, all now used). Executed the highest-ranked resume action
    from DEC-20260806-f7d62d: a truncation-mutation control, rerunning
    v8's per-vertex-independent-RNG delta_E search at p=2437 with the
    per-vertex budget cut to 0.5s, forcing genuine truncation, via a
    frozen v9 amendment (specification_v9.yaml, after TWO pre-freeze
    review rounds). Recorded as EV-SSIQ-c3df82, on TASK-20260806-b8fdf8
    passed and TASK-20260806-30d8d3 CHALLENGE (narrow).
  decision: support
  decision_note: >-
    support: RUN-SSIQ-a85692-i is genuinely, non-trivially executed
    exactly as the frozen v9 contract requires, independently confirmed
    by the Validator (true C-REPRO on every non-timing-dependent result,
    plus a DYNAMIC test of the new PF-5 failure-isolation requirement --
    a real exception forced against the unmodified script, confirming
    the isolation actually works, not merely reads correctly) and the
    Red Team (execution fidelity, cost/budget honesty, and scope
    discipline all clean, no objection). The Red Team's CHALLENGE was
    narrow and entirely about evidentiary weight, not execution: it
    demonstrated, with precise quantification this Coordinator
    independently re-verified, that the run's headline "0/8 value
    differences" result is far too underpowered and selection-biased to
    answer the question this amendment was built to answer. This is
    accepted and adopted into the evidence record (EV-SSIQ-c3df82
    O-3/O-4) rather than treated as a defect requiring re-dispatch --
    the run itself is a genuine, honestly-reported measurement; its
    LIMITS, not its execution, are what this decision records.
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - EXP-SSIQ-a85692
    - EV-SSIQ-c3df82
    - TASK-20260806-5aa2e6
    - TASK-20260806-b8fdf8
    - TASK-20260806-30d8d3
  evidence_refs:
    - EV-SSIQ-c3df82
    - EV-SSIQ-69ba8b
  rationale:
    - id: D-1
      statement: >-
        THIS CAMPAIGN'S SECOND REAL-COMPUTE-SPENDING AMENDMENT (AFTER v8)
        EXECUTED WITHOUT INCIDENT, INCLUDING A GENUINE, NOT MERELY
        STRUCTURAL, TEST OF THE NEWLY-ADDED PF-5 FAILURE-ISOLATION
        DISCIPLINE. The frozen contract's PF-1 fix (correct source-file
        citation and parsing helper for Comparison 2), PF-5 (write-order/
        failure-isolation between PART A and Comparison 2), and every
        other requirement were confirmed, by direct code read AND by the
        Validator's dynamic forced-failure test, to be implemented
        exactly as specified. The run finished in 101.46s of a 600s
        budget, comfortably within bounds.
      confidence: high
    - id: D-2
      statement: >-
        THE RED TEAM'S ADVERSARIAL REVIEW CORRECTLY IDENTIFIED THAT THIS
        RUN'S HEADLINE NULL RESULT CANNOT ANSWER THE QUESTION IT WAS
        BUILT TO ANSWER -- A FINDING THIS COORDINATOR INDEPENDENTLY
        VERIFIED BY DIRECT COMPUTATION, NOT MERELY ACCEPTED. Three
        compounding reasons, all independently re-derived: (1)
        statistical power is weak (a 95% confidence upper bound on the
        true differencing rate of roughly 31-37%, depending on one-sided
        vs. two-sided convention, both independently re-verified by this
        Coordinator); (2) the 8 resolved vertices are 4 exact Frobenius-
        conjugate pairs, not 8 independent trials, independently
        re-confirmed against build_isogeny_graph.py's own frobenius
        formula and every one of the 8 vertex tuples, widening the
        unexcluded range further; (3) all 8 resolved vertices sit at the
        smallest achievable delta_E value (delta_E=2, only 17.5% of the
        true archived population) with zero at the modal value
        (delta_E=3, 36.1%) -- independently reproduced by this
        Coordinator from the archived ground truth -- a mechanism-traced
        selection effect (best-first, lowest-degree-first table
        expansion), not a chance artifact. Together these mean the 186
        vertices whose true answer could plausibly diverge under
        truncation produced no data at all.
      confidence: high
    - id: D-3
      statement: >-
        THIS BATCH THEREFORE LEAVES RT-BATCH-011's TRUNCATION-BOUNDARY
        QUESTION EXACTLY WHERE IT STOOD BEFORE THIS RUN: STILL OPEN, NOT
        NARROWED IN EITHER DIRECTION. BATCH-011's own conclusion (PF-6's
        RNG-sharing channel closed for p=2437 in the NON-truncated
        regime, by a scale-bound determinism argument) is UNCHANGED and
        UNCHALLENGED. What this batch adds is a precise, quantified
        understanding of why a naively-designed truncation probe at too
        severe a budget fails to be informative -- a genuine, if
        negative-shaped, methodological contribution -- and a concrete,
        actionable fix: a follow-up run at an intermediate budget
        (0.8-1.0s, between this run's 0.5s and the observed 1.14993s
        natural-completion floor), which both reviewers independently
        converged on recommending.
      confidence: high
  limitations:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm is made anywhere in this decision or its evidence
      record. Lever L4 is NOT retired.
    - >-
      RUN-SSIQ-a85692-i's n_value_differs=0 MUST NOT be cited as evidence
      that the determinism argument extends into the truncated regime.
      The correct status is inconclusive.
    - >-
      BATCH-011's own p=2437 "genuine structural fact" (non-truncated
      regime) conclusion is unaffected by this batch and remains as
      stated in DEC-20260806-f7d62d.
    - >-
      Any future citation of a resolved-vertex sample from a severely
      truncated search must check for value-extremity bias and
      Frobenius-conjugate-pair correlation before treating it as
      representative or independent, per EV-SSIQ-c3df82's boundaries.
    - >-
      Toy scale throughout; nothing transfers to cryptographic scale.
      Model independence remains absent and unverifiable. Evidence
      strength stays capped at preliminary campaign-wide.
    - >-
      GOAL-SSIQ-001's extended campaign_budget (maximum_batches: 12) is
      now FULLY CONSUMED by this batch (8 original + 4 extension, all
      used). This decision does not itself pause or close the goal --
      see goal_closure_note in the accompanying checkpoint -- but no
      further batch may open without a renewed or further-extended
      budget.
  next_actions:
    - >-
      RANKED, FOR ANY FUTURE BATCH UNDER A RENEWED OR EXTENDED BUDGET:
      (1) [cheapest, most directly informative, per both reviewers'
      converging recommendation] a follow-up truncation-mutation run at
      an intermediate per-vertex budget strictly between 0.5s and the
      observed 1.14993s natural-completion floor (e.g. 0.8s or 0.9s, or
      a 0.6/0.8/1.0s sweep) -- high enough to plausibly pull delta_E>=3
      vertices into the resolved set and test whether the value-
      extremity selection effect (EV-SSIQ-c3df82 O-4) weakens as
      predicted, while staying below every observed natural-completion
      time so genuine truncation is preserved; (2) [unchanged, deferred]
      widening any RNG-independence or truncation probe to the other
      three primes (3889, 5737, 7333) stays deferred until (1) gives an
      evidence-based reason to expect informative behavior at this scale
      before spending compute on a wider sweep; (3) [unchanged, deferred]
      the funnel-structure mechanism question remains open.
      L4 remains the only lever whose ceiling meets this goal's target
      and still the top priority. Any future amendment spending real
      search compute goes through this lineage's now twice-demonstrated
      pre-freeze discipline (three rounds for v8's larger spend, two
      rounds for v9's smaller one), scaled to the compute at risk, PLUS
      (new this batch): any resolved-subsample comparison drawn from a
      time-budget-truncated search must be checked for value-extremity
      and paired-vertex correlation before its "0 differences" (or any
      other null count) is cited as informative.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is preliminary (session-only
      independence), below this campaign's replicated/strong bar for
      promotion. A THIRTEENTH knowledge candidate is now queued
      campaign-wide, distinct from the prior twelve: "a resolved
      subsample from a time-budget-truncated randomized search is not a
      representative sample of the population under test -- check for
      (a) value-extremity selection bias (does the resolved subset skew
      toward the algorithm's own easiest-to-find outputs, via a
      best-first or similarly-ordered search structure) and (b) internal
      correlation from problem symmetry (e.g. a search whose
      source/target roles are exchangeable under a known involution,
      like Frobenius conjugation here, produces paired rather than
      independent outcomes) before citing a null or positive count from
      that subsample as informative about the full population, and size
      any truncation budget to sit strictly between the shortest and
      longest natural completion times in the relevant population, not
      merely well below the shortest, to avoid this same failure mode."
      All thirteen promote together when a genuinely independent model
      becomes available to re-check them.
  goal_closure:
    status_transition: active -> closed_at_budget
    recorded_in: ledger/goals/GOAL-SSIQ-001/goal.yaml (status_value_history)
    reasoning: >-
      GOAL-SSIQ-001's campaign_budget.maximum_batches is 12 (8 original +
      4 on the 2026-08-06 user-authorized extension); BATCH-012, closed
      by this decision, is the 12th and final batch within that declared
      hard limit (verified: batches 001-008 consumed the original 8,
      batches 009-012 consumed the +4 extension exactly). Per goal.yaml's
      own pause_conditions and AGENTS.md's distinction between
      paused/blocked/closed_at_budget (all assert NO success) and
      completed (requires a committed decision showing a declared
      completion criterion was met): NONE of GOAL-SSIQ-001's five
      completion criteria are newly met by this batch. Lever L4 remains
      OPEN and is explicitly NOT retired -- this batch narrowed PF-6's
      RNG-sharing confound for the non-truncated regime at p=2437
      (BATCH-011) and left the truncated-regime question explicitly
      inconclusive (this batch), neither of which constitutes a closed
      ceiling argument or executed falsification for L4 itself.
      closed_at_budget is chosen over a bare paused because the specific,
      stated reason for stopping IS budget exhaustion, matching this
      campaign's own established convention from BATCH-008's identical
      transition (DEC-20260806-357b30) and the same pattern cited there
      across GOAL-MLKEM-001/GOAL-P13-001/GOAL-AES-002/003.
      closed_at_budget asserts NO success and does not retire or
      downgrade lever L4's OPEN status.
    resume_action: >-
      Same as next_actions above: (1) [highest value, cheapest] a
      follow-up truncation-mutation run at an intermediate per-vertex
      budget (0.8-1.0s) to properly power the question this batch left
      inconclusive; (2) widening to the other three primes stays
      deferred until (1) justifies it; (3) the funnel-structure
      mechanism question remains open. Resuming this goal requires
      either a further-extended/renewed campaign_budget or a fresh goal
      record explicitly continuing this one's lever map and ledger
      history, per this campaign's standing practice for a
      budget-exhausted, not-completed goal.
    not_closed_early_reaffirmed: >-
      This transition is NOT a retirement of lever L4 and does NOT
      understate what BATCH-009 through BATCH-012 established beyond
      BATCH-008's own close: GD-12 was genuinely closed (BATCH-009); the
      delta_E label-permutation null control was formally archived,
      immutable, and independently reproducible (BATCH-010); PF-6's
      RNG-sharing confound was closed for p=2437 in the non-truncated
      regime by a scale-bound determinism argument, the strongest
      epistemic basis this campaign has produced for any of ANOM-1's
      four primes (BATCH-011); and a truncation-mutation probe, though
      itself inconclusive, precisely quantified why its own design was
      underpowered and named a concrete, actionable follow-up
      (BATCH-012). None of this is claimed as evidence for or against a
      delta_E-gradient or a p^{1/4} algorithm at any point.
  decided_by: coordinator
  decided_at: '2026-08-06'
