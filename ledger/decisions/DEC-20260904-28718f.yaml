  context: >-
    EXP-PFDR-4bfc6f (the ALPF-011 mechanism separation for H-PFDR-e02f3b) is the
    sixth contract of the RQ-PFDR-ae2fba battery approved under
    DEC-20260903-93862f and dispatched as TASK-20260903-06b269. IT NEVER RAN.
    The executor terminated at PRE-FLIGHT with status failed_infrastructure,
    failure_class infrastructure_error, stage_reached pre-flight: Sage is absent
    from the execution container and cannot be installed from it (no binary
    on PATH, no python package, no PARI/GP, no apt candidate, and the pip sdist
    build of sagemath-standard fails on cypari2 for want of gp). The contract
    requires four archived .sage builders that cannot be executed without it.
    NO RUN DIRECTORY EXISTS (run_directories_created: 0), no manifest exists, no
    raw-result.json exists, no cell was read, no stopping rule could be
    evaluated, and the execution report's observations list is EMPTY by the
    executor's own deliberate choice. This decision records the disposition of
    that contract, and nothing else. The other five contracts of the battery are
    decided separately in DEC-20260904-d47cd2, -36b906, -1e27a2, -63a809 and
    -d4a554.
  decision: pause
  decision_label: >-
    pause_EXP_PFDR_4bfc6f_pending_a_Sage_capable_runtime_or_a_sanctioned_port_recording_the_pre_flight_failure_as_infrastructure_signal_and_never_as_evidence
  target_ids:
    - EXP-PFDR-4bfc6f
    - H-PFDR-e02f3b
    - RQ-PFDR-ae2fba
  rationale:
    - >-
      THIS IS INFRASTRUCTURE SIGNAL AND NEVER A NEGATIVE MATHEMATICAL RESULT.
      AGENTS.md rule 3 and the handoff's own validity constraint are explicit: a
      timeout, crash or absent Sage is infrastructure signal and never evidence
      against a hypothesis. NOTHING about H-PFDR-e02f3b's M1-M4 branches, its
      frozen prediction, its HEUR-001, or the archived EXP-ALPF-011 signal is
      supported, weakened, refined or refuted by this failure, in either
      direction. The archived "POSITIVE (SURVIVED)" verdict that EV-ALPF-001 and
      RQ-PFDR-ae2fba quote stands exactly as it stood before this contract was
      dispatched, and the hypothesis that it is a coordinate-artifact
      shared-factor syzygy stands exactly as it stood: untested.
    - >-
      THE EXECUTOR ACTED CORRECTLY AND ITS RESTRAINT IS RECORDED AS SUCH. The
      contract's invalidation rule 1 and the handoff's constraint 1 prescribe
      failed_infrastructure at dispatch without any cell being read, and that is
      what happened: zero runs attempted, zero run directories created, no
      certificate claimed (kind none, "no planted target was drawn; no solve or
      relation is claimed"), and an EMPTY observations list with the explicit
      note that "nothing here bears on M1-M4, the frozen prediction, HEUR-001,
      or any archived signal". The pre-flight commands are recorded verbatim
      with their exit codes. A report that declines to produce a mathematical
      observation it could not earn is exactly what this program asks for, and
      it is the reason this decision can be made cleanly.
    - >-
      NO EVIDENCE RECORD IS WRITTEN. EV-PFDR-7471cc was pre-allocated for this
      contract and is DELIBERATELY LEFT UNWRITTEN AND UNUSED. An evidence record
      asserts something about a hypothesis; there is nothing here to assert. The
      handoff's own deliverable text says the identifier is RESERVED and is to be
      written "only if an evidence record is warranted, which an infrastructure
      failure alone does not warrant", and it does not. Writing one would put a
      record into the ledger whose direction, strength and claim tier would all
      have to be null or not_applicable, and whose only content would be that a
      tool was missing - which is what this decision and the execution report
      already carry. The identifier remains reserved and unused, and any future
      record for this contract should take a fresh identifier unless the
      orchestrating session prefers to spend the reserved one.
    - >-
      H-PFDR-e02f3b'S STATUS DOES NOT MOVE. It remains `specified`, which is
      where DEC-20260903-93862f left it when its contract was approved. No
      status transition is licensed by an unexecuted experiment, and the
      hypothesis record is NOT edited by this decision - it is not in
      TASK-20260904-e6b4dd's artifact_paths, and there is nothing to change in
      it.
    - >-
      FOUR OPEN PRE-FLIGHT QUESTIONS ARE CARRIED FORWARD RATHER THAN DISCARDED,
      because they are real findings about the archive even though they are not
      mathematical ones. (O1) round005_meter_validation.sage exists NOWHERE under
      experiments/, though EXP-ALPF-011, -013, -010, -012, -014 and -025 sources
      all reference it. (O2) The unmodified EXP-ALPF-011 builder RE-RAISES after
      a failed load(METER_SRC), so run byte-for-byte unmodified it aborts before
      run_sweep() EVEN UNDER SAGE; EXP-ALPF-013 guards with os.path.exists and
      falls back to inline primitives. This needs a Coordinator ruling or a
      protocol_amendment before any re-dispatch, because "run the archived
      builder unmodified" is not currently executable. (O3) All four .sage files
      write to hard-coded absolute paths under /Volumes/Volume/autolab/, so an
      unmodified run needs that path or a wrapper-level arrangement. (O6) The
      contract names p = 4079 as "the archived 13-bit Solinas a = -3 curve",
      while the archived 16-cell sweep's 13-bit cells are p = 4111 (structured,
      a = -3) and p = 7993 (random); 4079 appears only in an UNARCHIVED
      section-8 discriminator probe. Which p the 13-bit ladder column carries is
      a Coordinator question and may need a protocol_amendment. None of these is
      decided here; all four are unblocking conditions listed below.
    - >-
      THE PAUSE IS NOT A DEPRIORITIZATION AND CARRIES ITS REVISIT CONDITION. The
      lane is not closed, not narrowed and not judged. AGENTS.md rule 9 requires
      any deprioritization to record its evidence, budget, test boundary,
      remaining uncertainty and a concrete successor or revisit condition; this
      is not a deprioritization - it is a blocked dispatch - and the revisit
      condition is stated concretely in next_actions rather than left as an
      intention. The scientific question EXP-PFDR-4bfc6f was designed to settle
      (whether the one recorded prime-field early fall is a closed-form
      membership-only shared-factor syzygy rather than a genuine signal) remains
      OPEN and remains worth settling: it is the only contract of the battery
      that touches the archived positive result directly.
    - >-
      A DISCLOSURE ABOUT PROVENANCE, recorded because it bears on any
      re-dispatch. The blocked execution session's adapter-resolved model
      (claude-sonnet-5) DIFFERS from its runtime self-reported model
      (claude-fable-5-1), with model_verified false and no AUTORESEARCH_POLICY
      or AUTORESEARCH_BACKEND set, so fallback_used is recorded as "not
      determinable by this session" rather than claimed false. The same
      disagreement is disclosed by the other executor sessions of this battery.
      It is moot for a run that never happened and must be resolved against the
      launch environment before the re-dispatch.
