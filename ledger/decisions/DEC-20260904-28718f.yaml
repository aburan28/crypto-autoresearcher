  next_actions:
    - >-
      THE ONE NEXT ACTION FOR THIS LANE, AND IT IS A REVISIT CONDITION RATHER
      THAN A TASK. Re-dispatch EXP-PFDR-4bfc6f under a FRESH executor handoff
      with a filled budget, once ALL of the following hold - the contract's own
      unblocking list, adopted here unchanged: (a) a Sage-capable runtime with
      sage on PATH and PARI/GP available, able to run the four archived .sage
      files named under blocked_inputs at their recorded sha256; (b) the
      archived Sage version matched where possible - SageMath 10.9 (release
      2026-05-04) per the EXP-ALPF-010 log, noting that EXP-ALPF-011's own
      builder version is UNRECORDED so 10.9 is the nearest neighbour and not a
      record; (c) harness/macaulay_fp at commit 2d2083e5 or later with its test
      suite passing and the TASK-20260903-ba41aa snapshot receipt VERIFIED; and
      (d) a Coordinator ruling or a versioned protocol_amendment on O2 (how the
      unmodified ALPF-011 builder is to run given its fatal load() of a file
      that exists nowhere and its hard-coded absolute output paths) and on O6
      (which 13-bit prime the archived ladder column carries: the contract says
      4079, the archive says 4111 and 7993). TASK-20260903-06b269 is TERMINATED
      failed_infrastructure with no run record and is not resumed.
    - >-
      THE ALTERNATIVE, if no Sage-capable runtime becomes available. Commission
      a SANCTIONED PORT of the four blocked .sage builders to the exact-F_p
      machinery this battery already has (harness/macaulay_fp at 2d2083e5, whose
      p = 2 known answer and planted-syzygy controls are validated, and whose
      instrument adequacy at a chosen shape is now demonstrable by the ladder
      pattern recorded as KN-TECH-1cd4bb). A port is a DIFFERENT contract with a
      different validity argument - it must carry its own
      archive-reproduction control proving the port reproduces the archived
      16-cell sweep integer for integer before any new cell is read - and it
      therefore needs its own design, its own frozen contract and its own
      approval decision. It is NOT authorized here.
    - >-
      DO NOT LET THE ABSENCE OF THIS CONTRACT BE READ AS A RESULT. EV-ALPF-001's
      "POSITIVE (SURVIVED)" line and RQ-PFDR-ae2fba's quotation of it are
      UNCHANGED and remain the state of the record. No superseding evidence
      record for EV-ALPF-001 may be written on the strength of this battery, and
      the Coordinator alone writes one after a review of an experiment that
      actually ran. The precisely statable open question is unchanged and is
      recorded in the hypothesis: whether the archived e-ring and power-sum
      fires (16/16 cells) are a closed-form membership-only shared-factor syzygy
      at d_ff = |FB| - 1 with kernel dimension 3, present for every curve, prime
      and target, or a genuine curve-dependent signal.
