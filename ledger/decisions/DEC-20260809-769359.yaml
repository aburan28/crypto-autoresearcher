coordinator_decision:
  id: DEC-20260809-769359
  goal_id: GOAL-MCE-001
  batch_id: BATCH-73a1b7
  context: >-
    BATCH-73a1b7's scope item SUB-1 (replace the two regex claim-class audits
    in knowledge/TAG-CLAIM-CLASS.md with a single YAML-frontmatter-parsing
    script, and commit the five VAL-20260808-71bdb1 C-4 evasion forms as a
    permanent regression fixture) has now run its full producer -> snapshot
    -> independent reviewer -> archive chain within this session: Executor
    task TASK-20260809-3e30b8 (snapshot-archived as TASK-20260809-0b6630,
    commit 92d238396), independent reviewer TASK-20260809-076a75 (archived as
    TASK-20260809-c8122d, commit c85bf16a6). This decision records the
    disposition of that chain and the goal's next action; it changes no
    hypothesis (none exists for this goal) and, per the reasoning below,
    upgrades no evidence record.
  decision: approve
  decision_note: >-
    `approve`, SCOPED TO SUB-1's SHIPPED MECHANISM ONLY. The independent
    review returned CONDITIONAL_PASS, not PASS: every directly-checkable
    completion-gate item (the script catches an evasion form the reviewer
    built independently from the specification text, not from the Executor's
    own fixture; knowledge/TAG-CLAIM-CLASS.md is confirmed byte-identical;
    the fixtures live outside knowledge/; TAG-CLAIM-CLASS-v2.md supersedes
    only AUDIT-1/AUDIT-2 with its one non-additive change disclosed) holds
    under independent re-derivation -- by the reviewer, and separately
    re-confirmed by the Coordinator before archiving (see
    TASK-20260809-c8122d's receipt). The gap is traceability, not
    correctness: tools/claim_class_audit.py and its test suite cite "the
    execution report" as the source of the full GATE-A break-attempt log, and
    no such artifact exists anywhere in this repository for
    TASK-20260809-3e30b8. That is why this is `approve` and not `revise`: the
    shipped script, tests, fixtures and superseding document are independently
    confirmed correct, so nothing is being sent back for rework. It is NOT
    `support` or `expand`, because no hypothesis exists to support and no
    evidence record's claim_tier changes. It is deliberately NOT an upgrade of
    EV-MCE-3d6e9a.yaml's proof_status: that upgrade was conditioned on a full
    PASS (see DEC-20260808-a67816's scheduled promotion, and
    TASK-20260809-c8122d's own handoff constraint), and a review that falls
    short of PASS does not meet that bar even though the shortfall is
    small and disclosed.

  target_ids: [GOAL-MCE-001]
  also_targets_by_path:
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/dispatch_queue.json
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/reviews/TASK-20260809-076a75/review_report.yaml
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/archives/TASK-20260809-0b6630/snapshot-receipt.json
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/archives/TASK-20260809-c8122d/ledger-receipt.json
  also_targets_note: >-
    No ledger/evidence/ or ledger/decisions/ record besides this one is
    created or edited by SUB-1's closure. EV-MCE-3d6e9a.yaml is explicitly
    NOT touched -- see decision_note.

  rationale:
    - id: D-1
      what: >-
        SUB-1's shipped mechanism is genuine and independently confirmed, not
        merely asserted by its own producer or a single reviewer pass.
      why: >-
        The reviewer built one of the five required evasion forms (B4)
        directly from validation_report.yaml's control_checks C-4
        specification text -- not copied from the Executor's own fixture
        file -- and confirmed both legacy regex audits miss it while
        tools/claim_class_audit.py catches it. The Coordinator then rebuilt
        that same probe a third time, from scratch, in a throwaway location
        outside the repository, using only the YAML transcribed in the
        review report, and reproduced the identical result. Two independent
        constructions plus one independent re-run is stronger than the
        review-evidence skill's baseline bar of one independent check.
      evidence: >-
        coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/reviews/TASK-20260809-076a75/review_report.yaml
        reconstructed_evasion_case; TASK-20260809-c8122d's receipt
        coordinator_independent_verification_performed_before_archiving.
    - id: D-2
      what: >-
        The residual gap (dangling "execution report" citations) is real,
        was independently confirmed by the Coordinator via grep and a
        repository-wide search, and is correctly scoped as a traceability
        defect rather than a correctness defect.
      why: >-
        Every specific adversarial case the review COULD check (G11 by
        mutation test, G12's disclosed-not-fixed status, G13's safe_load
        behavior) turned out to be genuine, not padding. What is missing is
        the ARTIFACT that would let a future reader confirm the account is
        complete -- comparable in kind to VAL-20260808-71bdb1's own S-1b
        finding earlier in this goal (a citation that does not resolve to
        what it claims), which this goal's own known_hazards already treats
        as a defect worth naming rather than silently carrying forward.
      evidence: >-
        review_report.yaml gate_a_assessment; grep of tools/claim_class_audit.py
        and tools/test_claim_class_audit.py for "execution report" (3 hits,
        no matching file); repository-wide search for execution_report*
        scoped to TASK-20260809-3e30b8 (zero matches; the many
        execution_report.* files that do exist all belong to other goals'
        other tasks).
    - id: D-3
      what: >-
        Two dispatch_queue.json bookkeeping defects, both flagged by the
        review (AC-3) or discovered while archiving it, are corrected in this
        batch rather than carried forward silently.
      why: >-
        TASK-20260809-3e30b8's state was stale at "queued" despite its
        deliverables being archived and completed. TASK-20260809-c8122d's
        declared archive.kind was "ledger" before any review outcome was
        known; since the actual verdict commits no ledger/evidence/ or
        ledger/decisions/ artifact, it is reclassified to "snapshot" --
        exactly the same correction already applied to TASK-20260809-c30f26
        earlier in this same batch, so this is now the second instance of
        that specific defect class in one batch, worth noting for the
        pattern rather than only the individual fix.
      evidence: >-
        dispatch_queue.json coordinator_correction_note on
        TASK-20260809-3e30b8 and TASK-20260809-c8122d; commits 5e0da9943
        and c85bf16a6.

  limitations:
    - >-
      This decision establishes nothing about Classic McEliece, ECDLP, or any
      cryptosystem's security -- SUB-1 is corpus-tooling and bookkeeping work.
      GOAL-MCE-001.active_hypothesis_ids stays EMPTY and claim_tier stays toy.
    - >-
      EV-MCE-3d6e9a.yaml's proof_status remains `empirical_only`. The upgrade
      path DEC-20260808-a67816 scheduled is NOT triggered by this decision;
      it remains conditioned on a future full PASS.
    - >-
      The GATE-A traceability gap this decision approves past is a disclosed,
      named exception, not a resolved one. A future reader of
      tools/claim_class_audit.py or tools/test_claim_class_audit.py will
      still hit the same dangling citations until the required_fixes below
      are actually done.
    - >-
      This review is a single independent session, not a quorum. Per
      AGENTS.md rule 13's suspension noted in the launch-research-harness
      skill, that is not itself a blocker for this batch-item approval, but
      no attestation is claimed or may be synthesised from it.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No knowledge/findings/ or knowledge/TAG-CLAIM-CLASS-v2.md-adjacent entry
      is promoted by this decision. TAG-CLAIM-CLASS-v2.md itself already IS
      the corpus-facing artifact (committed by TASK-20260809-3e30b8, confirmed
      correct by independent review and re-verification); promoting a
      redundant KN-* summary of it would not add information. The one thing
      that WOULD warrant promotion -- an archived counterexample certificate
      upgrading EV-MCE-3d6e9a's proof_status -- is explicitly not reached
      because the review fell short of full PASS (see decision_note).

  next_actions:
    - >-
      SINGLE NEXT ACTION for GOAL-MCE-001, recorded below in the goal head:
      dispatch a small follow-up task that closes required_fix (a) from
      review_report.yaml -- either archive a genuine execution_report for
      TASK-20260809-3e30b8 (reconstructed honestly if the original break-
      attempt log is truly gone, and marked as reconstructed), or amend the
      dangling citations in tools/claim_class_audit.py and
      tools/test_claim_class_audit.py to point at what is actually committed
      -- followed by a second independent reviewer pass scoped ONLY to that
      fix. If it returns PASS, that is when EV-MCE-3d6e9a's proof_status
      upgrade and the KN-FIND promotion DEC-20260808-a67816 scheduled
      actually happen.
    - >-
      STILL QUEUED IN THE SAME BATCH, UNCHANGED FROM DEC-20260809-cb25a0:
      SUB-2 (corpus-wide superseded_by policy) and SUB-3 (the two provenance
      seams), both still in dispatch_queue.json's unallocated_scope_items.

  decided_by: coordinator
  recorded_at: '2026-08-09'
