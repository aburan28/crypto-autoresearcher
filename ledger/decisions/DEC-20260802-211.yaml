coordinator_decision:
  id: DEC-20260802-211
  context: >-
    Post-snapshot integrity review of BATCH-035 control commit
    e37406094678319f38e28c6efcef2b0c698c905f against the authoritative
    BATCH-034 synthesis ledger 63f32893fd308df2427357eb851912645d738b2d,
    DEC-20260802-209, the global task namespace, and the dynamic-dispatch
    schema. CORR-20260802-002 records the exact discrepancies. No BATCH-035
    worker ran and no research artifact was produced.
  decision: supersede
  target_ids:
    - DEC-20260802-210
    - BATCH-035
    - TASK-20260802-229
    - TASK-20260802-230
    - GOAL-ECDLP-001
    - H-IT-001
  decision_scope: >-
    Supersede DEC-20260802-210 and stop BATCH-035 before worker dispatch. Treat
    the batch as a control-plane infrastructure failure only. It supplies no
    mathematical evidence and changes no hypothesis or goal status. Preserve
    the authoritative DEC-20260802-209 successor: one bounded EI-213-04
    certified nonlinear-correspondence lane with affine-action and exact
    description-degree controls first. Open that lane only in a fresh batch
    using globally unused task IDs and a queue accepted by
    tools/research_dispatch.py. First archive the verified OpenAI policy
    bindings needed to honor research-deep and review-adversarial without
    fallback or degradation.
  rationale:
    - >-
      A globally reused task ID makes source ownership and archive attribution
      ambiguous; downstream review cannot tell which TASK-20260802-229 a
      receipt names.
    - >-
      DEC-20260802-210 binds its scope to obsolete or non-existent snapshot
      identities rather than the authoritative BATCH-034 chain.
    - >-
      The committed BATCH-035 artifacts authorize two different scientific
      lanes, so no worker can receive a unique approved objective.
    - >-
      The mutable queue is rejected by the repository dispatcher. A queue
      failure is infrastructure, never evidence against a mathematical lane.
    - >-
      A fresh batch is cheaper and more auditable than mutating already
      committed task cards or guessing which conflicting control artifact was
      intended.
  evidence_refs:
    - ledger/decisions/DEC-20260802-209.yaml
    - ledger/decisions/DEC-20260802-210.yaml
    - ledger/corrections/CORR-20260802-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-034/archives/TASK-20260802-229/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-035/archives/TASK-20260802-230/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-035/SCOPE-DECISION.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-035/INPUT-CAPSULE.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-035/dispatch_queue.json
  official_status_effects:
    goal:
      id: GOAL-ECDLP-001
      before: active
      after: active
      changed: false
    hypothesis:
      id: H-IT-001
      before: specified
      after: specified
      changed: false
    experiments: 0
    implementations: 0
    research_workers_dispatched: 0
  limitations:
    - BATCH-035 contributes no result, obstruction, support, or negative evidence.
    - The correspondence successor remains an unverified research question.
    - The goal ledger's stale current_batch_id and dispatch path are not repaired by this decision.
    - Repository-wide ledger validation retains extensive pre-existing failures outside this correction scope.
  next_actions:
    - >-
      Archive this decision, CORR-20260802-002, and the verified OpenAI binding
      configuration alone under TASK-20260802-236.
    - >-
      Open BATCH-036 from DEC-20260802-209 and this superseding decision using
      fresh task IDs beginning at TASK-20260802-240 and a dispatcher-valid
      queue; snapshot all controls before any Idea Generator runs.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision corrects coordination and model-routing integrity only;
      BATCH-035 produced no research evidence or durable mathematical claim.
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: gpt-5.6-sol
    reasoning_effort: high
    model_verified: true
    fallback_used: false
    degraded_requirements: []
  decided_by: coordinator
  decided_at: '2026-08-02'
