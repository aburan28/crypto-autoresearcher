coordinator_decision:
  id: DEC-20260802-211
  batch_id: BATCH-036
  recorded_by_task: TASK-20260802-240
  archived_by: TASK-20260802-241
  context: >-
    GOAL-ECDLP-001 remains active and its durable next_action requires a second
    gated EXP-IT-001 v3 repair after BATCH-030. BATCH-030 archived
    RUN-IT-001-rerun only as a valid toy density package; its transfer controls
    were void and H-IT-001 remained specified. BATCH-031 through BATCH-034
    created claim-limited analytical records but did not amend or discharge the
    EXP-IT next action. BATCH-035 then froze an internally contradictory
    control plane with a reused durable task id and no valid dispatcher queue.
    CORR-20260802-002 records those coordination defects. No BATCH-035 worker or
    experiment ran.
  decision: supersede
  decision_scope: >-
    Supersede DEC-20260802-210 and make BATCH-035 ineligible for worker
    dispatch. Preserve all BATCH-031 through BATCH-035 artifacts as immutable,
    scope-limited records, but do not treat them as satisfying or replacing the
    exact user-authorized EXP-IT repair. Open BATCH-036 only to design, freeze,
    and independently review a new second-repair amendment. Authorize zero
    experiment runs, zero implementation changes, and no Executor in this
    batch. A later Coordinator decision may admit implementation/execution only
    after the amendment review is archived and adopted.
  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
    - EXP-IT-001
    - BATCH-035
    - BATCH-036
    - DEC-20260802-210
    - CORR-20260802-002
    - RUN-IT-001-rerun
    - EV-IT-002
  rationale:
    - >-
      The goal record and persistent user objective are the binding priority;
      no later durable decision cites user authorization to abandon the named
      second repair, and no later result discharges any of its six defects.
    - >-
      A reused task id and contradictory frozen scope make BATCH-035 unsafe to
      dispatch. A timeout or control-plane failure is not evidence about
      H-IT-001 or ECDLP.
    - >-
      Freezing a replacement amendment before implementation is the cheapest
      way to prevent a third invalid run and preserves separation of design,
      implementation, observation, and conclusion.
  exact_repair_boundary:
    - >-
      Preserve C_special_MOV=ceil(0.886*sqrt(p^k)) unless the new amendment
      explicitly replaces it with a field-DLP-inclusive cost (including the
      roughly 2*sqrt(N*) term at k=1) and re-derives the positive control on an
      actually anomalous trace-1 curve, never merely an embedding-degree-1
      endpoint.
    - >-
      Require a genuine transfer control on a non-special instance whose
      certificate evaluates an isogeny pullback, with the planted walk forced
      to terminate at a non-special j-invariant.
    - >-
      Require one live synthetic certificate-bearing sub-0.7 claim through
      CTRL-NULL-PACKAGING-GATE and a persisted raw per-edge ledger for
      CTRL-NULL-IT-PLANT.
    - >-
      Require dominated_by and quantitative sota_delta fields in every
      deliverable under the inventor protocol.
    - >-
      Require a bits-window density design whose p admits N* dividing p^k-1
      for k at least 2 or an actual trace-1 class, with declared sampling and
      95 percent confidence intervals.
    - >-
      Require all implementation code used by the future run to be included in
      the pre-run immutable snapshot.
  pareto_integrity:
    dominated_by: null
    frontier_check: >-
      The exact repair is mandatory user/goal work and is not dominated as a
      coordination action. It makes no achieved algorithmic frontier claim.
    sota_delta:
      time_exponent: 0.0
      memory_exponent: 0.0
      data_or_query_exponent: 0.0
  official_status_effects:
    goal: {id: GOAL-ECDLP-001, before: active, after: active, changed: false}
    hypothesis: {id: H-IT-001, before: specified, after: specified, changed: false}
    experiment_runs_authorized: 0
    implementation_authorized: false
  evidence_refs:
    - ledger/goals/GOAL-ECDLP-001.yaml
    - ledger/decisions/DEC-20260801-002.yaml
    - ledger/evidence/EV-IT-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-145/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-146/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/reviews/TASK-20260801-146/objections.md
    - experiments/EXP-IT-001/specification.v3.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
    - ledger/corrections/CORR-20260802-002.yaml
  limitations:
    - BATCH-036 does not execute, implement, or empirically validate anything.
    - RUN-IT-001-rerun remains only a toy density package; its void transfer controls are not repaired retroactively.
    - No crypto-scale, status, support, rejection, novelty, SOTA, closure, or breakthrough claim follows.
  next_actions:
    - TASK-20260802-241 archives and post-commit verifies this recovery control plane and the verified OpenAI bindings.
    - TASK-20260802-242 authors exactly one new amendment proposal addressing all six defects.
    - TASK-20260802-243 snapshots that proposal before independent review.
    - TASK-20260802-244 independently reviews the frozen proposal at review-adversarial xhigh.
    - TASK-20260802-245 snapshots the review; TASK-246 synthesizes; TASK-247 ledger-archives the decision.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a control-plane correction and experiment-design checkpoint with
      no new observation or review-complete scientific result.
  decided_by: coordinator
  decided_at: '2026-08-02'
