coordinator_decision:
  id: DEC-20260810-2c7e3c
  context: >-
    Adjudication of lane L9 of GOAL-ENDO-001 (RQ-CANL-63098f, canonical lifts
    and CM lifting), dispatched as TASK-20260810-520f0d in BATCH-de621d. L9 is
    the campaign's longest-standing unadjudicated lane: next action N7 was
    carried open and undischarged across four consecutive batch decisions
    (DEC-20260807-c8aa8b, DEC-20260807-41c173, DEC-20260808-3312cc,
    DEC-20260809-de11f9). State verified by this Coordinator by reading the
    working tree at the snapshot commit named by the dispatching session
    (ed5ac46ed; this role has no Bash and ran no git command, so the commit
    identity is taken from the dispatch and is not independently re-derived
    here): twelve proposals in ledger/proposals/ cite RQ-CANL-63098f; seven
    contracts EXP-CANL-1064e0, EXP-CANL-108f26, EXP-CANL-3c4af4,
    EXP-CANL-50a70f, EXP-CANL-751d2b, EXP-CANL-8687b3 and EXP-CANL-86c465
    exist, every one status draft, each a single specification.yaml with
    approved_by null and no runs/ directory; no RUN-CANL-* record exists
    anywhere under ledger/ or experiments/. The lane therefore satisfies
    neither branch of GOAL-ENDO-001's completion criterion C1. This decision
    delivers outcome B of the task card: the C1-satisfying lane closure. It
    approves no contract.
  decision: reject_scoped
  target_ids:
  - GOAL-ENDO-001
  - BATCH-de621d
  - RQ-CANL-63098f
  - EXP-CANL-1064e0
  - EXP-CANL-108f26
  - EXP-CANL-3c4af4
  - EXP-CANL-50a70f
  - EXP-CANL-751d2b
  - EXP-CANL-8687b3
  - EXP-CANL-86c465
  rationale:
  - |-
    THE OBSTRUCTION, IN ITS OWN PRE-REGISTERED WORDS, AND THE TEST IT SETS.
    analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section L9 and
    RQ-CANL-63098f's own `decision_target` state it identically: Xedni calculus
    fails because the lifted points have canonical height of order N
    (Jacobson-Koblitz-Silverman-Stein-Teske), and "any lane variant must state
    how CM changes that specific quantity or it is closed on arrival". The
    obstruction is quantified, not vague, and the test it sets is narrow: not
    "is CM interesting on the lift", but "what does CM do to the height of the
    lifted points". Every one of the twelve proposals was read against exactly
    that question, and the finding is not that they are silent on it. Four of
    them answer it directly and quantitatively, and all four answers move the
    quantity in the defender's direction or leave it exactly where it was.
  - |-
    ANSWER 1, AND THE LOAD-BEARING ONE: THE NORM-FORM GAP. CM CHANGES THE
    HEIGHT QUANTITY BY EXACTLY NOTHING, AND THERE IS A TWO-LEMMA ARGUMENT FOR
    IT. Source: IDEA-20260807-fd5a24, contract EXP-CANL-86c465 (draft), whose
    `mechanism` STEP 1 carries the proof in full.
      Lemma 1 (norm-form gap; elementary, complete, sharp). Let O be the
      imaginary quadratic order of discriminant D_E < 0, O = Z[w]. For
      alpha = a + b w with b != 0,
          N(alpha) = (a + b D_E/2)^2 + (b^2/4)|D_E| >= |D_E|/4,
      by completing the square; equality iff |b| = 1 and a = -b D_E/2. No
      hypothesis is used.
      Lemma 2 (height scaling; standard, cited and not re-derived here). For
      alpha in End(E~), hhat(alpha P) = deg(alpha) hhat(P) = N(alpha) hhat(P).
    Composing them: the O-module generated by a lifted point P~ is, as a
    Z-lattice, spanned by P~ and omega P~ with hhat(omega P~) >= (|D_E|/4)
    hhat(P~). For a curve at the bottom of its volcano |D_E| = 4p - t^2, so the
    companion direction is longer by a factor >= p - t^2/4. THE O-MODULE
    STRUCTURE INFLATES THE Z-RANK WITHOUT PLACING A SINGLE NEW VECTOR INSIDE
    ANY BALL OF RADIUS o(sqrt(p)) TIMES THE LATTICE MINIMUM. Consequently,
    whenever |D_E| > 4 C_0^2, the set {alpha in O : N(alpha) <= C_0^2} equals
    {a in Z : |a| <= C_0} exactly, so CM contributes no new reachable
    coefficient at all. What CM does change is stated by the same record and is
    real: O-dependence of m points needs only m >= r_Z/2 + 1 instead of
    m >= r_Z + 1, halving the number of points that must be simultaneously
    lifted; and the reachable-k count falls from (2C_0+1)^{r_Z+1} to
    (2C_0+1)^{r_Z/2+1}, so the instance count gets WORSE by the factor
    (2C_0+1)^{r_Z/2}. Both are constants at fixed arity. The exponent of N is 1
    in both cases against rho's 1/2. The Xedni failure quantity survives CM
    intact.
  - |-
    ANSWER 2: THE SMALL-DISCRIMINANT REGIME IS REAL, CONTAINS A DEPLOYED CURVE,
    AND BUYS A CONSTANT. Source: IDEA-20260807-11b93d, contract EXP-CANL-3c4af4
    (draft). Lemma 1's condition |D_E| > 4C_0^2 fails exactly at the crater of a
    volcano of small fundamental discriminant, and that regime is not a
    curiosity: secp256k1 is y^2 = x^3 + 7, a j = 0 curve, |D_E| = 3. Dismissing
    it unexamined would have been the premature closure docs/inventor-protocol.md
    forbids, so it was examined. There, counting lattice points of the norm form
    in a disc of radius C_0 gives 2 pi C_0^2 / sqrt(|D_E|) + O(C_0/|D_E|^{1/4})
    coefficients per slot against the Z-case 2C_0 + 1 -- a genuine enlargement.
    But the norm-one part of that set is precisely the unit group O^*, whose
    relations are the cyclotomic identities: P~ + zeta_3 P~ + zeta_3^2 P~ = O
    reduces mod p to (1 + mu + mu^2) P = O, i.e. 0 = 0 in Z/N, for every P, for
    every curve, and target-independent by construction. This program has
    already recorded the same collapse in an independent setting (KN-FIND-003
    and KN-FIND-008: the isotrivial j = 0 function-field family's counted
    sections form mu_3 orbits whose specialised relation "is a tautology"),
    which is consilience, not confirmation. The surviving non-unit gain is
    Theta(C_0^2) per slot -- an absolute constant at fixed arity -- so the
    instance count remains N^{1 - o(1)}. A constant-cofactor gain in the
    coefficient set is not a change in the height quantity, and by this
    program's standing direction (docs/target-result-profile.md) a constant
    cofactor is not what this lane needed to find.
  - |-
    ANSWER 3: CM MOVES THE HEIGHT BUDGET, AND IT MOVES IT THE WRONG WAY BY A
    FACTOR 2 IN THE EXPONENT. Source: IDEA-20260807-6533fd, contract
    EXP-CANL-8687b3 (draft). Lattice-point counting on the Mordell-Weil lattice
    gives |{P~ : hhat(P~) <= B}| = V_r B^{r/2} Reg^{-1/2} (1 + o(1)), so
    covering a constant fraction of G by reductions forces
        B >= (N sqrt(Reg) / V_r)^{2/r} = Theta(N^{2/r}),
    and since a point of canonical height B has x-coordinate of bit-size
    Theta(B) + O(log|Delta|), THE REPRESENTATION COST OF ONE USABLE LIFT IS
    Theta(N^{2/r}) -- a size bound that holds even for an adversary handed the
    right point for free. Where CM enters is the effective rank: by Lemmas 1
    and 2 the second half of the 2 r_O-dimensional lattice is longer by
    sqrt(|D_E|)/2, so inside a ball of radius sqrt(B) with
    B < (|D_E|/4) hhat_min the effective rank is r_O = r_Z/2, not r_Z. The
    exponent is therefore 2/r_O = 4/r_Z, and the size threshold at which a lift
    stops being dominated by rho on representation cost alone moves from
    r_Z > 4 to r_Z > 8. THIS IS THE ONE PLACE IN THE LANE WHERE THE O-MODULE
    STRUCTURE TOUCHES THE HEIGHT QUANTITY AT THE LEVEL OF AN EXPONENT, and it
    makes the identity worse by a factor 2.
  - |-
    ANSWER 4: CM DOES SUPPLY THE RANK CONTROL XEDNI HAD TO BUY, AND THE FREE
    VALUE IS FATAL. Sources: IDEA-20260807-44ba75 (contract EXP-CANL-50a70f,
    draft) and IDEA-20260807-13c821 (no contract derived). Silverman's
    construction buys small Mordell-Weil rank with Mestre-style conditions --
    exactly the cost centre JKSST charge as prohibitive -- while on a CM lift
    the rank is pinned by an L-value (Coates-Wiles, Rubin): L(E/K, 1) != 0
    implies rank 0, which is generic. A finite Mordell-Weil group is not a
    short lattice, it is no lattice: the liftable fraction
    rho_lift(B) = |{P in E(F_p) : P = red(P~), hhat(P~) <= B}| / N collapses to
    |tors|/N = O(1)/N for every B. CM optimises "the r+1 points are dependent"
    and destroys "the points exist". The one genuine free knob in the lane is
    priced by IDEA-20260807-13c821 and it does not rescue this: for a j = 0
    curve every E~_m : y^2 = x^3 + (b + m p) is a global CM curve reducing to E,
    so rank can be SEARCHED rather than imposed -- but (i) Answer 3's threshold
    demands Z-rank >= 6, and >= 8 with margin; (ii) a rank lower bound needs a
    point search of cost B^{r/2}, which is the same search the attack itself
    needs, so screening saves nothing; and (iii) because j is integral, Lang's
    height conjecture is a theorem for these curves, forcing
    hhat(P~) >= c log|Delta(E~_m)| ~ 2c log(m p) for every non-torsion point --
    SO THE HEIGHT FLOOR GROWS WITH THE SEARCH PARAMETER. The deeper the search,
    the worse the object it finds. That anti-correlation between search depth
    and object quality is the sharpest single statement the lane produced, and
    it is an obstruction to the only free quantifier the lane has.
  - |-
    TWO FURTHER GATES FIRE BEFORE THE HEIGHT QUESTION IS EVEN REACHED, AND CM
    CHANGES NEITHER. (a) REACHABILITY (IDEA-20260807-ee6ef7, contract
    EXP-CANL-108f26, draft): writing the canonical lift down through the
    Hilbert class polynomial costs |D_E|^{1+o(1)} = p^{1+o(1)} time and
    p^{1/2+o(1)} space for the generic curve, so the SETUP for one curve
    exceeds the whole rho attack by p^{1/2} and its space alone matches BSGS;
    the p-adic route via Phi_p(X,X) is worse at p^{2+o(1)}. The evasion
    h(disc End) = O(1) is real and cryptographically populated (j = 0,
    j = 1728), but it is class-invariant: DECOMPOSITION.md T4 fixes t, hence D,
    hence D_0, so a walk inside the isogeny class never changes whether the
    class is good, and ascending the volcano buys at most f^2 off a p^{1+o(1)}
    bill with floor |D_0|. (b) THE POINT DOES NOT LIFT (IDEA-20260807-cfe576,
    contract EXP-CANL-1064e0, draft): Serre-Tate lifts the CURVE canonically
    and does not lift points. Of the five enumerated point-lifting routes, four
    -- the Teichmuller/finite-etale torsion section (canonical, a homomorphism,
    and hhat = 0, so it carries no lattice information at all), O-multiples
    (longer by Lemma 2), Heegner points, and a fixed Mordell-Weil basis
    (circular: computing the coordinates IS the discrete log) -- are functions
    of (E, O, K) and not of the target Q, so their bounded-cost output set S
    satisfies Pr[Q in red(S)] <= |S|/N = p^{-1+o(1)} for a uniform target. The
    fifth, an arbitrary set-section (what Xedni actually does), is
    target-dependent and pays instead with the pro-p homomorphism gate. CM
    changes neither branch of that dichotomy, for a reason that is structural
    rather than quantitative: CM is a property of the CURVE and the branch
    condition is about the POINT.
  - |-
    THE REMAINING FOUR PROPOSALS, EACH AN INDEPENDENT KILL OF AN ADJACENT
    MECHANISM, NONE OF THEM FAVOURABLE TO THE HEIGHT QUANTITY.
      IDEA-20260807-fd2d89 (no contract): any lift whose height data depends on
      k satisfies hhat(Q~) = k^2 hhat(P~), so its coordinates carry about N^2
      bits and writing the object down already costs more than solving the
      instance; and the CM constraint that L9 hoped would bite instead FIXES
      the curve, removing exactly the freedom Xedni used to force small-height
      lifts, so the minimal height of a global point reducing to a prescribed P
      grows like N^{2/r} with an r one no longer gets to choose. This is the
      lane's question answered in its own terms, adversely.
      IDEA-20260807-dbb250 (no contract): the target-module gate, two lines and
      covering every p-adic height at once -- any quadratic form q on the
      prime-order group G with values in a torsion-free Z_p-module is
      identically zero when N != p, because q(N x) = N^2 q(x) and N x = 0. So
      no cyclotomic, anticyclotomic or CM p-adic height on the canonical lift
      can carry scalar information. The surviving use is instrumental, as a
      cheap regulator estimator for Answer 3's identity.
      IDEA-20260807-778375 (no contract): small |D_0| does make the class
      polynomial, the CM ideal factorisation of (pi - 1) and Lenstra's
      E(F_p) = O/(pi - 1) cheaply computable, but their entire publicly usable
      output on a prime-order subgroup is the single GLV eigenvalue lambda,
      whose effectivisation is DLP-equivalent. Cheap description, no
      effectivisation.
      IDEA-20260808-5158fa (no contract): because the ECDLP modulus is
      n = (N, pi - 1) we have pi = 1 mod n, so Frobenius at p is trivial in
      Gal(K_n / H_O), p splits completely in the ray class field, and reduction
      mod p collapses the whole (O/n)^*/{+-1} torsor -- killing the full Artin
      descent and every small-l quotient character, including the k mod l
      partial-information variants.
  - |-
    THE SEVENTH CONTRACT IS NOT AN ATTACK AND CANNOT CLEAR THE OBSTRUCTION,
    AND ITS CONTENT SURVIVES THIS CLOSURE. EXP-CANL-751d2b
    (IDEA-20260807-761a8c, draft) is the blocking instrument control for every
    height measurement in the lane: at p = 101 a rank-2 curve's low-height
    points already cover about 4.5% of E(F_p) purely because small integers are
    abundant, and the covering fraction falls by seven orders of magnitude over
    the range a toy experiment spans, so it pre-registers the decay law
    log rho_lift = (r/2) log H - (1/2) log Reg - log p + const (slope exactly
    -1 against log p, rank-independent), five named nulls, and both directions
    of the planted-signal test. It proposes no mechanism, so it is not a
    candidate for approval under outcome A. It is recorded here as the one
    piece of L9 machinery worth re-dispatching first if the lane reopens: no
    future height measurement in this campaign should be reported without a
    passing calibration of this shape.
  - |-
    WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT. docs/inventor-protocol.md
    is explicit that a count of screened-and-rejected mechanisms is a fatigue
    report whose honest status is `unverified`, and GOAL-ENDO-001's C1 repeats
    it. This record does not say "twelve mechanisms were tried and none
    worked". It names ONE quantified obstruction (lifted-point height of order
    N), gives ONE argument for why the lane's central hope fails against it
    (Lemma 1 plus Lemma 2: canonical height scales by the norm, and the norm
    form of an imaginary quadratic order has no small values off Z, so no
    CM-generated companion lands inside the height budget), states exactly what
    CM DOES change with each quantity named (points-to-lift halved;
    coefficient count enlarged by Theta(C_0^2) per slot only when
    |D_E| <= 4C_0^2, and then partly cancelled by the unit tautology; effective
    rank in the height budget halved, worsening the exponent from 2/r_Z to
    4/r_Z; rank pinned by an L-value at generically 0), and carries concrete
    forward guidance with four surviving open items named below. It is
    reproducible by an independent reader from the cited records alone.
  - |-
    THE LANE'S POSITIVE DELIVERABLE, WHICH IS NOT NOTHING. IDEA-20260807-13c821
    part (D): the internal audit record ECFG-P1543-R1 reconstructs the Xedni
    C_0/p theorem "only under Lang, its discriminant-height comparison, and
    fixed arity 2 <= r <= 9". On a CM lift the j-invariant is integral, so
    Lang's height conjecture is a theorem there rather than a conjecture. THE
    ONE THING CM DEMONSTRABLY CHANGES ABOUT THE XEDNI FAILURE IS ITS LOGICAL
    STATUS, FROM CONDITIONAL TO UNCONDITIONAL, IN THE DEFENDER'S FAVOUR. That
    is a direct answer to RQ-CANL-63098f's question "does CM change the
    specific quantity": it does not change the value, it removes a hypothesis
    from the theorem that bounds it. This inherits the verification status of
    its source citation, flagged in `limitations`.
  - |-
    WHY reject_scoped RATHER THAN pause, AND WHY NOW. N7 has been carried
    undischarged across four batch decisions (DEC-20260807-c8aa8b,
    DEC-20260807-41c173, DEC-20260808-3312cc, DEC-20260809-de11f9) without a
    single run ever being produced, and the drafts converge rather than
    diverge: five independent proposals reach the same exponent-1 verdict from
    five different directions (norm form, height budget, rank pinning,
    target-independence counting, and the k-dependence size bound). A fifth
    pause would leave C1 unsatisfiable for this lane at no informational gain,
    and premature closure and indefinite deferral are symmetric failures.
    `pause` is also unavailable on its own terms here: GOAL-ENDO-001's pause
    conditions P1-P3 are not engaged (no instrument failed a two-directional
    control, nothing bears on H-STR-002, no candidate approaches the
    automorphism-discounted rho baseline). The rejection's scope is stated
    exactly in the next item, and its reopening conditions are concrete and
    cheap to check.
  - |-
    SCOPE OF THE REJECTION, STATED EXACTLY (AGENTS.md rules 4, 6, 7).
    WHAT IS REJECTED: the L9 decision target -- that CM structure on the
    Serre-Tate canonical lift changes the Xedni lifted-point-height quantity in
    the attacker's favour -- over the following boundary and no wider: prime
    fields F_p; ordinary curves E/F_p; the canonical lift and the global CM
    models over Q reducing to it; constant arity 2 <= r <= 9 with C_0 an
    absolute constant, which is the regime the JKSST analysis is stated in; and
    the mechanism families enumerated in the twelve cited proposals.
    WHAT IS NOT REJECTED, AND MUST NOT BE READ INTO THIS RECORD: anything about
    ECDLP hardness in either direction; supersingular curves; non-prime fields;
    anomalous curves with N = p, where IDEA-20260807-dbb250's gate hypothesis
    N != p is exactly what fails and the record says so; the four open items
    G1-G4 below; and any construction outside the enumerated families. sota_delta
    is zero, claim_tier is toy, and no speedup is asserted in either direction.
  - |-
    BUDGET, TEST BOUNDARY AND REMAINING UNCERTAINTY (CLAUDE.md rule 9).
    BUDGET SPENT: the BATCH-cb71b5 ideation batch that produced the twelve
    proposals and the seven machine-derived contracts, plus N7's carry across
    four batch decisions, plus this adjudication at a 3600-second wall-clock
    ceiling and zero executed runs. NO L9 EXPERIMENT COMPUTE HAS EVER BEEN
    SPENT: the lane closes at zero CPU-hours, which is what the cheap
    pre-compute falsification audits of KN-TECH-080 are for.
    TEST BOUNDARY: this closure is DERIVATIONAL, NOT EMPIRICAL. It rests on
    Lemma 1 (elementary, complete, checkable by inspection), Lemma 2 (standard,
    cited, not re-derived), and standard lattice-point counting. Nothing in it
    has been checked by a run, because no run exists.
    REMAINING UNCERTAINTY, NAMED: (i) an error in the derivations that no
    execution has had the chance to catch -- notably, EXP-CANL-86c465's own
    STAGE 0 specifies an exhaustive integer check of Lemma 1 and STAGE 1 a
    numerical check of Lemma 2 at negligible cost, and neither has been run;
    (ii) the four open items G1-G4; (iii) the literature relays flagged in
    `limitations`; (iv) the absence of any independent review of this closure.
  refutation_artifact:
    achieved_level: derivation
    basis: >-
      docs/claims-and-verification.md, "Refutation artifacts". No counterexample
      certificate is available or applicable: the lane's claim is that a
      quantity fails to move, and the artifact that checks it is an argument,
      not an instance. The next-strongest level, a derivation note, IS
      available and -- decisively -- it already existed as an archived,
      committed artifact BEFORE this decision, authored by a different agent in
      a different batch, rather than being written by the deciding Coordinator
      to support its own decision. That independence is why no new note was
      written by this task.
    artifacts:
    - experiments/EXP-CANL-86c465/specification.yaml (mechanism STEP 1, the
      complete elementary proof of Lemma 1; STEP 3, the coefficient-set
      identity; STEP 5, the per-attempt-cost times inverse-success bookkeeping)
    - ledger/proposals/IDEA-20260807-fd5a24.yaml (parent record of the above)
    - experiments/EXP-CANL-8687b3/specification.yaml (objective (A) and (D), the
      height-budget identity and its CM effective-rank correction)
    - experiments/EXP-CANL-3c4af4/specification.yaml (objective (B)-(E), the
      small-discriminant enumeration and the unit tautology)
    - experiments/EXP-CANL-1064e0/specification.yaml (objective (C), the
      target-independence counting bound)
    - ledger/proposals/IDEA-20260807-13c821.yaml (parts (C3) and (D), the Lang
      height floor and the conditional-to-unconditional observation)
    label_note: >-
      Labelled `derivation`, never "proved", per docs/claims-and-verification.md.
      Lemma 1 is a complete elementary proof and is the strongest single element;
      it is nevertheless not machine-verified in this repository, and the
      composite conclusion additionally uses standard results (height scales by
      degree; lattice-point asymptotics) that are cited rather than re-derived.
      A derivation about the tested constructions is not a universal
      impossibility claim.
