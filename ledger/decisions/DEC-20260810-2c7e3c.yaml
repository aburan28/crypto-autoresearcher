  limitations:
  - >-
    ZERO RUNS, ZERO EVIDENCE RECORDS. No RUN-CANL-* record exists anywhere in
    the repository and this decision writes no EV-* record. Nothing here is an
    empirical result, and no measurement in this campaign has confirmed
    hhat(alpha P) = N(alpha) hhat(P), measured rho_lift, or exhaustively checked
    the norm-form gap by machine, even though EXP-CANL-86c465 STAGE 0 and
    STAGE 1 specify exactly those checks at negligible cost. The closure's basis
    is `derivation`, and it is weaker than a machine-checked or independently
    reviewed result would be.
  - >-
    NO INDEPENDENT REVIEW. This closure has had no review-adversarial or
    review-breakthrough pass, and none of the twelve proposals or seven
    contracts it adjudicates has been independently reviewed either. AGENTS.md
    rule 12 and orchestration/model-policies.yaml routing rule
    `unrecoverable-result-review` are written broadly enough to cover a
    "closure result"; whether a scoped LANE closure inside an open goal falls
    under that rule rather than under ordinary Coordinator authority is a
    judgement, and this record states plainly which way it went and why: the
    lane was adjudicated now because four batches of deferral had produced
    nothing, and an independent pass is recorded below as a named follow-up
    rather than skipped silently. Until that pass exists, this decision must not
    be cited as establishing that the lane is dead beyond the scope stated
    above.
  - >-
    LITERATURE RELAYS, FLAGGED IN THEIR OWN SOURCE RECORDS AND NOT VERIFIED
    HERE. Sutherland (arXiv:0903.2785, class-polynomial complexity) and
    Hindry-Silverman (Invent. Math. 93 (1988) 419-450, Lang's conjecture for
    integral j) are recorded in EXP-CANL-108f26 and IDEA-20260807-13c821 as
    read from abstracts only, full papers not read; Coates-Wiles/Rubin and
    Siegel are cited without retrieval. The load-bearing core of this closure --
    Lemma 1, Lemma 2, and the lattice count -- does not depend on any of them.
    The items that DO depend on them are the reachability cost exponents and the
    conditional-to-unconditional observation, and both are labelled as such.
  - >-
    THE RETRIEVAL INDEX WAS NOT QUERIED. AGENTS.md "Knowledge retrieval policy"
    directs an agent to run `search_knowledge` before claiming that an approach
    is known to fail. This session's tool surface does not include the kb MCP
    server, so no such query was made. Absence of a search result would not have
    been evidence either way, but its absence here means this closure rests
    entirely on the repository records cited by path, and a reviewer with
