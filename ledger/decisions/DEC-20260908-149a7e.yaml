  rationale:
    - >-
      S2GX recorded n_holds 3, n_this_G_that_would_make_miss_hold 1,
      n_holds_flipped_by_miss_G 1, and
      miss_G_flips_only_next_tightest true. Restating
      those flags is dominated.
    - >-
      S2TP already recorded that M_delta contrast is
      not sufficient alone on the tight pair. A
      reverse-only comparison of the same two S2TP
      ratios against the next bound (S2RV) remains
      dominated because those two CS bounds are
      adjacent. Same-cell CS bounds are not adjacent
      to the miss bound, so an M_delta-swap of the
      four S2BD cells is not determined by S2GX or
      S2TP flags.
    - >-
      The remaining cheap residual is whether miss
      M_delta flips only the next-tightest among the
      three official S2BD holds, or also a same-cell
      hold. Consume the four S2BD cells, not S2GX or
      S2TP. For each hold H, compute
      miss_would_hold_if_this_M_delta as
      (G_miss / M_delta_H) <= cs_bound_miss and
      this_would_hold_if_miss_M_delta as
      (G_H / M_delta_miss) <= cs_bound_H. Report
      n_holds, per-hold flags,
      n_this_M_delta_that_would_make_miss_hold,
      n_holds_flipped_by_miss_M_delta, and a
      uniqueness flag such as
      miss_M_delta_flips_only_next_tightest. This
      decision does not pre-record those flags. An
      M_delta-swap uniqueness or sharing is not a W
      class.
    - >-
      Re-partitioning the 168-row S2CS table, another
      four-cell uniqueness restatement, another slack
      restatement, Stage 5, a subset fit of a, the
      S2FIT W-ratio gate, CAND-D2-A, D2 closure, and
      designing an unrelated open ECC idea remain
      dominated or forbidden. Open ECC ideas remain
      ranked work under instruction 3, not ahead of
      this live residual on the approved experiment.

  ranking:
