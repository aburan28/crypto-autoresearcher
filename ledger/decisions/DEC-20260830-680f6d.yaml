  decision_label: decks23_interleaved_combination_accepted_with_corrected_evidentiary_weighting

  context: >-
    Closes TASK-20260830-c68075's independent review of TASK-20260830-789280
    (idea-generator), the decks-2/3 interleaved combination-rule derivation
    dispatched by DEC-20260830-6f28e0. The archiving Coordinator independently
    re-derived one of the producer's hand-traces (INST-2-single_hit, B=2)
    directly from experiments/EXP-CREP-001/instances/generate_instances.py
    rather than trusting the report, and re-read
    experiments/EXP-CREP-001/verifier/check_representation.py,
    experiments/EXP-CREP-001/packages/build_packages.py,
    experiments/EXP-CREP-001/specification.yaml, and the original problem
    statement at
    coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/candidate_report.yaml,
    with line-level citations recorded in
    preadmission_decks23_interleaved_combination_terminal_note_20260830 on
    ledger/goals/GOAL-ECDLP-001/goal.yaml.

  decision_scope: >-
    ACCEPTS the outcome-card's obstruction_extended disposition and the
    toy-level construction (G01_local, G23_local, Adm4) as independently
    verified: the archiving Coordinator hand-retraced INST-2-single_hit
    exactly, field for field, confirming the construction is genuine, not
    fabricated. The procedural vocabulary gap is confirmed and found MORE
    fundamental than the producer described: check_representation.py's
    execute_package hard-wires load_pair_product_generators to decks 0/1
    and every online algebra kind to the identical global
    support_of_target() computation -- no online node in this engine ever
    computes a decomposed intermediate at all, so the gap is a property of
    the engine's execution semantics, not a vocabulary-registration
    oversight, and would recur identically for any other deck pair.
    CORRECTS the evidentiary weight assigned to the producer's second,
    substantive argument (a degree-scale mismatch between the local
    construction's implied O(B) and r_R's declared Theta(B^2)): tracing
    the Theta(B^2) figure through every layer of this corpus (package
    docstrings, route notes, specification.yaml's forbidden-payload text,
    back to the original 2026-07-22 problem statement's own
    forbidden_unpriced_payloads field) finds it stated identically and
    verbatim at every layer, DERIVED OR COMPUTED NOWHERE. The toy engine's
    own execution of the corresponding node produces a Theta(B) object,
    decoupled from the declared certificate by the module's own docstring
    disclaiming executable code. Further, the Theta(B^2) figure is exactly
    what BOTH of the producer's own named rival explanations (genuine
    Bezout-type elimination between two independently-varying degree-B
    structures, or naive non-deduplicated counting over B^2 pair-product
    generators) would predict identically, so it cannot discriminate
    between them even in principle. This argument is therefore DOWNGRADED
    from "directly-checkable but not airtight" to a currently uninformative,
    unresolved dependency that adds no evidentiary weight beyond the
    procedural item alone. The procedural item alone -- fully certain,
    independently confirmed, and now shown to be engine-level rather than
    a vocabulary gap -- is sufficient by itself to sustain the
    obstruction_extended label as the honest outcome, rather than
    inconclusive_construction_not_reached (a genuine construction was
    completed and verified, unlike the prior round which found nothing
    had been attempted for any deck pair beyond 0-1).

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains approved).
    - It does not change EXP-CREP-001's specification (remains frozen, unmodified).
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not resolve whether r_R's real degree reflects genuine multi-way elimination or non-deduplicated accounting; that is named explicitly as the new, single largest open bottleneck this decision surfaces, not answered here.
    - It does not claim that decks-2-4 decomposition is impossible in general, nor that no deck pair beyond 0-1 or 2-3 could ever admit a decomposed object under a genuinely different construction (e.g. a joint/Bezout-compatible elimination interleaved with reduction mod g_I, which neither this nor the prior round attempted).

  non_claims:
    - This is not evidence for or against H-CREP-001's underlying problem; it is a verified toy-level construction plus a corrected assessment of how much its transfer argument to the real, non-toy construction should be trusted.
    - The proves-too-much control's improved logical form (no longer resting on the prior round's rejected circular premise about r_R's "freeness") is not the same as its substantive premise being established: it is now "genuinely derived from a stated fact whose truth is itself unverified," not "genuinely derived from an independently-established fact." These are different epistemic categories, and the honest label is the former.
    - Confirming the toy-level construction works does not establish anything about whether an analogous construction could work on the real elliptic-curve object; this is exactly the toy-to-real transfer gap this goal's inventor-protocol discipline requires staying explicit about.

  rationale:
    - "Every mechanical claim load-bearing to the obstruction was independently re-derived or re-checked against cited source, not accepted from the producer's prose; the hand-trace and vocabulary gap both held up exactly, and the engine-semantics gap was found deeper than described (execution-level, not registration-level)."
    - "The degree-mismatch argument was traced to its origin (the 2026-07-22 problem statement, TASK-20260722-101) and found to be an undischarged modeling declaration at every layer, never a derived or computed fact, and the Theta(B^2) figure was shown to be uninformative as between the two rival explanations even taken at face value -- this changes how much weight the argument should carry without rejecting the overall obstruction_extended finding, which the procedural item alone sustains."
    - "Labeling obstruction_extended rather than inconclusive is justified specifically because a real, independently-verified construction was completed this round, in contrast to the prior round which found no construction had been attempted for any deck pair beyond decks 0-1."

