# agrees with NJ1/NJ5 on every compared value, and none of its reported open
# choices changes a value at the pinned source bytes. No regression, no
# tripwire, every proves-too-much object meets its signature, and the
# independence check passes. No ranking switch condition fired. Every break
# is a protocol-text defect. None is a mathematical result and none is
# evidence about any curve.
