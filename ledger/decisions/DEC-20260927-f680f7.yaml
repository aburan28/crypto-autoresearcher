  # NJ1/NJ5 versus NJ6, value by value, BEFORE any key is applied.
  # ---------------------------------------------------------------------------
  nj6_comparison:
    worksheet: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-7b6678/composition/TASK-20260927-c9bf23/composition-worksheet.yaml
    method: >-
      A script outside the repository read the two sealed computations.json
      files (TASK-20260927-10c752 and TASK-20260927-7d51ae) and compared
      every quantity both implementations report, under the plan's
      agreement_tolerance. Integers were compared exactly and recorded as
      sha256 only. No value is restated here.
    Q1: AGREE, exact, on every control integer and every candidate count both sides report.
    Q2: >-
      AGREE, exact. C-FIELD reasons under the corrected FP and under
      C-FIELD-MUTATION, the reasons for every cases_extracted row, and the set
      of rows that fail under M-FP are identical. NJ1's extracted field primes
      for the two C-FIELD rows hash to the NJ6 closed-form values.
    Q3: >-
      AGREE. BND-1, BND-2 and BND-3: witness, witness set, bin, bin_at_least
      and boundary_flag identical; bound gaps and depths agree far inside
      tolerance. Each side's own NEAR_FLOOR BOUND state (different declared
      parts on the same row and branch) gets the same categorical outcome.
    Q4: AGREE at exactly 3/4 + tau, for both EXACT and BOUND; neighbouring probes on each side agree.
    Q5: AGREE. Every gate either side evaluated holds; neither reports a failing gate. Run-observation gates are left to runs under the RI-9 convention.
    exact_branches: AGREE on status, minimiser, bin, bin_at_least, flag and depth for all eight construction-control branches.
    open_choices_reported_by_NJ6:
      - {id: Q0-1, ruling: "does not fire. A reference to specification.yaml, not an alternative; NJ5 confirms the frozen curve list and the D1 rows agree in ids and order."}
      - {id: Q0-2, ruling: "does not fire. Primary sources are outside the whitelist by design; NJ1 extracted them."}
      - {id: Q0-3, ruling: "does not fire. Checked against NJ1's extracted field primes: no construction integer equals one, so both readings give the same outcome on every control. Carried as an erratum."}
      - {id: Q0-4, ruling: "does not fire. NJ1 shows both C-FIELD rows' p are extracted from the hex form and equal CF-1/CF-2, so both readings give the same run-time decision at the pinned, hash-fixed bytes. The phrase is still undeclared; carried as an erratum."}
      - {id: Q0-5, ruling: "does not fire. A reporting unit from blind-inputs, not the text."}
      - {id: Q0-6, ruling: "does not fire. Immaterial to bins and flags at every admissible precision (NJ6)."}
      - {id: Q0-7, ruling: "does not fire. Text-declared immaterial; no implementation found a value change."}
      - {id: Q0-8, ruling: "resolved. NJ1's distinct extracted field primes discharge the premise; NJ6's conditional M-FP result equals NJ1's."}
    NJ6_reading: >-
      NJ6 records its own verdict as inconclusive because, by design (its
      BL-5), the comparison is made by composition, not by the re-deriver.
      Composed here, NJ6 AGREES with NJ1/NJ5 on every value within tolerance,
      and no open choice affects a reported quantity or a run-time decision.
    PD-N2_reading: >-
      NJ5 read the BATCH-2fc87b validator values after recording its build
      (build record 08:55:27Z, as it attests), so it is a weaker independent
      implementation. NJ6 read none of them. The agreement therefore rests
      mainly on NJ6, and it is complete for the third round running on the
      recipe layer.

