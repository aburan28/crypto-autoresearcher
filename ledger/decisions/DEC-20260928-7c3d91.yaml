  verification_performed:
    - check: experiments/EXP-SEMBIN-04ec3c/** contents at approval time
      result: >-
        specification.yaml ALONE. No implementation, no run, no results document.
        The approval genuinely precedes execution.
    - check: >-
        Whether the contract's cost model actually implies P1-P4, by deriving them
        myself from the cost_model block.
      result: >-
        IT DOES, AND THAT IS THE PROBLEM. Under MITM_CAPPED (time |F|^(m-s), store
        |F|^s) the stage-1 total is relations x trials x oracle = 2^d *
        m! 2^(n-dm) * 2^(d(m-s)) = m! * 2^(n + d(1-s)). At s = 1 that is m! * 2^n,
        independent of d -- P1. Balancing the store-free MITM total against the
        linear-algebra term 2^(2d) gives d = n/(floor(m/2)+1) and cost
        2^(2n/(floor(m/2)+1)); 262/(S+1) < 60.809 forces S >= 4, so m = 8 is the
        first row strictly below the published reference and m = 6 sits at 2^65.5,
        above it -- P2. A sub-rho cell needs d(s-1) > n/2 + log2(m!), so the store
        exponent ds exceeds S/(S-1)*(n/2 + log2 m!) > n/2 for every s >= 2 -- P3a,
        which is therefore a one-line theorem of the model and NOT falsifiable by
        this sweep. That expression evaluates to 140.2, 112.5, 107.7, 109.1, 113.2
        bits at m = 4, 6, 8, 10, 12 for n = 131, minimising near 2^107.7 at m = 8
        -- P4.
    - check: P3's second clause, that the bound tightens as m grows.
      result: >-
        FALSE AS WRITTEN AND INCONSISTENT WITH P4 IN THE SAME CONTRACT. The
        minimum-store curve FALLS from 140.2 at m = 4 to 107.7 at m = 8 and only
        then rises, which is exactly the argmin P4 asserts. No run is needed to see
        this. P3's falsified_if covers only the n/2 limb, so the false clause was
        unfalsifiable as authored. Handled by amendment A2b.
    - check: >-
        Whether P5's margin is thin anywhere, since it is the one prediction the
        sweep genuinely searches.
      result: >-
        YES, AT THE SMALLEST DEGREES. At n = 97 the minimum store over m is
        1.333*(48.5 + 15.30) = 85.1 bits at m = 8, against P5's 2^80 budget -- five
        bits of margin, the thinnest number in the sweep. Integrality of s makes
        the realisable cells coarser and so pushes the requirement up rather than
        down, which is why I expect P5 to hold; but n = 97 and n = 109 are where it
        would break, and that is recorded as a prior on
        TASK-20260928-e4f7b2's review plan.
    - check: >-
        Whether the committed free-oracle floor table can be reproduced from the
        records that publish it, since C-FLOOR-REPRO gates on it and aborts.
