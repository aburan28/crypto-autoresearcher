  rationale:
    - >-
      THE ORDERING IS CLEAN AND I VERIFIED IT RATHER THAN ACCEPTING IT. Glob over
      the experiment directory returned specification.yaml alone. Approval
      therefore precedes implementation and execution, which is the one thing
      DEC-20260918-4b7e21 said could not be repaired after the fact. Everything
      else in this decision is ordinary protocol completion, which the standing
      authorization leaves to the Coordinator and which is discharged by
      amendments rather than deferred to the user.
    - >-
      APPROVING WITH AMENDMENTS IS THE HONEST VERB, NOT `revise`. Three of the
      eight amendments repair defects that would have made a control fire wrongly
      (A1), test nothing (A4), or go unguarded (A3); the rest classify, reconcile
      and bind language. All are ADDITIVE, none edits an authored field, all were
      written before any implementation existed, and none changes the cost model, a
      parameter, the success criterion or the budget. Returning the contract for
      revision would have produced the same text a round later with no more
      information, and `approve` plus a published diff is the reading a later
      auditor can check.
    - >-
      THE STRONGEST FINDING IS THAT THE LOAD-BEARING PREDICTION IS NOT A
      PREDICTION. P3a follows from the cost model in one line, so the sweep cannot
      falsify it and its confirmation carries no weight for the hypothesis. That
      relocates the whole result's weight onto HEUR-GENERIC-MSUM -- which is
      exactly where the hypothesis's own falsification_note already put it, and
      which is why an `analyzed` ceiling and a J3 adversarial pass are the
      proportionate response rather than a refusal. A contract that says in terms
      "the conclusion is conditional in exactly the place where a breakthrough
      would live" has earned the run; it has not earned `supported`.
    - >-
      A CONTROL THAT FAILS ON CORRECT CODE IS WORSE THAN NO CONTROL, BECAUSE IT
      STOPS THE RUN AND LOOKS RIGOROUS DOING IT. C-FLOOR-REPRO as authored would
      have aborted on m = 8's 6.50-bit offset. Two agents independently
      reconstructed the table, agreed with each other to within 0.05 bits, and
      agreed with the committed values nowhere. I refused the cheap repair --
      widening the tolerance to 8 bits -- because a tolerance moved to fit what was
      just measured has stopped being a check, and because the authored 5-bit slack
      was ALREADY absorbing a systematic monotone-in-m divergence, which is the
      signature of a wrong oracle exponent rather than of a convention. I also
      refused to make the recovery a precondition: two attempts failed, the
      convention is unpublished, and converting a seconds-long derivation into
      open-ended records archaeology is the wrong trade. The structural gate keeps
      the properties every downstream claim uses; the DECLARED OFFSET SIGNATURE
      restores the failure power the tolerance gave up.
    - >-
      THE REPRODUCIBILITY GAP IS A SEPARATE DEFECT AND IS FILED SEPARATELY. It
      belongs to KN-FIND-aa2efc and EV-ICPERF-10c5fc, not to this contract, and
      folding it into a control would have buried it in an experiment nobody reads
      for that purpose. CORR-20260928-2b8f4e names it, bounds it -- the values
      stand, the inference stands, only the published derivation is withdrawn --
      and carries the close-to-fitting 2n/(m+1) + 2*log2(m) form as an explicitly
      labelled lead so the next session does not repeat two failed reconstructions.
      It was self-reported by the records' own author, against interest, which is
      the kind of finding this program should keep cheap to make; the correction
      nonetheless rests on two reconstructions read from committed records rather
      than on the concession, the same discipline DEC-20260918-4b7e21 applied.
    - >-
      OWNERSHIP MATTERS HERE FOR A MECHANICAL REASON, NOT A BUREAUCRATIC ONE. If
      cbf422 owned this contract, admitting it would have had to displace or
      duplicate that goal's single next_action, which is ranked second behind a
      review round that can void another campaign's measurement base. Ruling
      ownership to 5078bc on four committed facts leaves cbf422's head untouched,
      puts the work under the goal whose criterion 4 is the time-and-memory
      comparison, and lands it next to the HEUR-VOW-CURVE validation already ranked
      first there -- which is how one of this contract's two heuristics gets a
      scheduled validation without any new dispatch.
    - >-
      I STATED IN ADVANCE WHAT THIS EXPERIMENT MAY NOT DISCHARGE. Criterion 4 of
      5078bc is the closest thing in the ledger to this contract's deliverable and
      it is NOT dischargeable by it, because it names the chained-S_3 system whose
      stage-1 cost is the Groebner cofactor this contract deliberately omits. That
      resemblance is close enough that a later session would make the mistake in
      good faith, which is the reason to rule on it before the run rather than
      after the table exists and looks quotable.
    - >-
      FOCUS IS THE ONE GATE I COULD NOT CHECK AND I HAVE NOT DRESSED IT UP. No
      shell, so no autoresearch_focus.py. I argued admission from what is
      checkable -- no machine contention, explicit exemption from
      IMP-SEMBIN-ENGINE, max_concurrent 2, no batch opened, and independence from
      Assumption 1 -- and then carried the tool as a hard precondition on both the
      archive and the run. Cheapness is not a ranking argument and is not used as
      one: if three critical lanes are active, the approval stands and the dispatch
      waits.

