  # ---------------------------------------------------------------------------
  # The five questions this engagement was told to attack.
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: >-
        Can a contract whose predictions the author already believes carry
        preregistration at all, given that provenance_of_these_predictions
        discloses the hand derivation?
      ruling: >-
        YES, IT CAN, AND THE DISCLOSURE IS SUFFICIENT FOR THE RECORD TO BE CALLED
        A PREREGISTRATION -- BUT NOT SUFFICIENT ON ITS OWN, WHICH IS WHY A2 EXISTS.
        Preregistration's function is that the prediction is fixed before the DATA.
        No data exists: no implementation, no run, no outcome observed by anyone.
        What the author holds is a theoretical derivation, and a hand derivation of
        the same arithmetic is not merely a belief -- it is a partial execution of
        the experiment by a second instrument. So a confirmation is a two-instrument
        agreement: weak, as the contract says, but not zero.
      what_the_disclosure_does_not_buy: >-
        BLINDNESS, which is a different property and is absent. The contract
        already says confirmation is weak and refutation strong, and that is
        correct. What it does not do is stop a later reader from counting "5 of 5
        predictions confirmed" as five units of support. That reader is the one the
        record has to be built for.
      what_the_record_must_be_called_instead: >-
        The block keeps its name for schema stability and gains a CLASSIFICATION.
        Under A2 each prediction carries an epistemic class and the derived
        evidence record MAY NOT count the confirmation of a `model_consequence` as
        support for H-SEMBIN-8e7ae3. P1, P3a and P4 are `model_consequence`; P2 is
        `model_consequence_with_sweep_selection`; P5 alone is `sweep_search`. The
        honest headline is therefore "one searched prediction and four fidelity
        checks", not "five predictions".
      why_this_is_not_the_992e73_case: >-
        THE DISTINCTION IS THE WHOLE ENGAGEMENT AND IT IS NOT A TECHNICALITY.
        There, outcomes had been OBSERVED: a run existed, RESULTS.md existed,
        predictions were marked confirmed, and the approving authority had read
        that. Approval would have asserted a provenance that did not exist. Here
        nothing has been observed, and the approving authority's belief is a
        theoretical prior -- which is recorded, in terms, as
        TASK-20260928-e4f7b2's coordinator_prior, before any reviewer or
        implementer runs. Recording an anchored prior is the remedy the review
        architecture prescribes. Concealing it would have been the defect.

    - id: R2
      question: >-
        May a contract rest this much on HEUR-GENERIC-MSUM, which is `unvalidated`
        with `validation_experiment_ids: []` and one supporting datum?
      ruling: >-
        YES, IT MAY BE RUN, AND NO, IT MAY NOT REACH `supported`. The promotion
        gates cap the CLAIM, not the work: agents/coordinator.md gate 2 says an
        unvalidated heuristic caps a claim below `supported`, and that is enforced
        here as a binding `analyzed` ceiling on H-SEMBIN-8e7ae3 and a
        `claim_ceiling` on the contract head. Refusing to run a seconds-long
        derivation because its conditional dependence is unvalidated would be
        premature closure -- the failure mode docs/inventor-protocol.md treats as
        symmetric with overclaiming -- particularly for a contract whose stated
        purpose includes NOT inheriting Semaev's Assumption 1.
      the_pairing_obligation_is_real_and_is_discharged_as_follows: >-
        CLAUDE.md requires a conditional result to be paired with a
        heuristic-validation experiment in the same or the following batch. Two
        heuristics, two answers. HEUR-VOW-CURVE: already discharged by a SCHEDULED
        validation ranked FIRST on the owning goal's next_action -- retrieve and
        read van Oorschot-Wiener 1999 and score the heuristic against it. That
        ranking is preserved, not displaced, by this approval.
        HEUR-GENERIC-MSUM: NOT discharged, and scheduled here. It is the target of
        review joint J3 on TASK-20260928-e4f7b2 -- an adversarial pass asking
        whether a Frobenius-stable F_2-subspace factor base admits a better
        tradeoff than |F|^(m-s) at store |F|^s -- and of a following-batch design
        task ranked below. The joint is not a substitute for the experiment; it is
        the cheap screen that tells us whether the experiment is worth its cost,
        and it runs in the same round.
      what_the_single_datum_is_worth: >-
        NOTHING, AND THE REASON IS SHARPER THAN "ONE POINT IS FEW". The supporting
        measurement is at m = 3, which is precisely the arity where
        meet-in-the-middle confers NO time advantage -- so it is the one arity that
        cannot discriminate the heuristic from its alternatives. The contract's own
        MITM entry says this ("at m = 3 this degenerates to |F|^2 time either
        way"). The anchor is therefore a consistency check on the implementation,
        not evidence for the heuristic, and J3 is told so.
      inventor_protocol_and_gate_requirements: >-
        Section 8's proof_search_map is correctly NULL here: this is not a
        proof-oriented proposal, it prices a family under a stated oracle class,
        and its asymptotic_claim is deliberately null so Part D's gates are not
        invoked for a claim the record does not make. I checked that the null was
        reasoned rather than defaulted and it is. Nothing in the protocol or the
        gates requires more BEFORE approval; what they require is the ceiling,
        which is imposed.

    - id: R3
      question: Are the controls adequate, and are they really controls?
      ruling: >-
        NOT AS AUTHORED. One was unsatisfiable, one was not a null object, and two
        load-bearing steps were unguarded. Five amendments repair this and all are
        free.
      defects_found:
        - >-
          C-FLOOR-REPRO WAS UNSATISFIABLE by a correct implementation (m = 8 offset
          6.50 bits against a 5-bit tolerance), AND its tolerance simultaneously
          absorbed a systematic monotone-in-m divergence, which is the signature of
          a wrong oracle exponent. A gate that cannot fail for the right reason
          while it can fail for the wrong one is not a control. Repaired by A1:
          gate on convention-independent structure (ordering, monotone decrease in
          m, and the SIGN of every margin -- m = 3 above rho, m = 4 below), demote
          the offsets to a diagnostic, and restore failure power by DECLARING THE
          EXPECTED OFFSET SIGNATURE before the run so a departure is detectable.
        - >-
          C-NULL-NO-MEMORY-CHARGE IS NOT A NULL OBJECT. Charging the store at zero
          collapses MITM_CAPPED to MITM, whose feasible cells are a strict superset
          whenever B binds, so "the cells are identical" can only occur where B
          never binds and the test reduces to confirming that a constraint
          constrains. Its refutation branch is unreachable. Repaired by A4:
          relabelled a bindingness diagnostic, with the GENUINE null declared --
          does the family's verdict differ from the verdict already obtainable with
          the store free? It does (P2 puts m = 8 under the reference with store
          free while the required store is ~2^108 entries), so the premise
          survives, and now it survives a test rather than an assertion.
        - >-
          THE ARGMINS WERE UNGUARDED. Every headline figure is an argmin over d or
          a solved margin condition, and nothing gated on whether it sat at a sweep
          bound -- the exact exposure that produced CORR-20260917-02cfe6, where a
          crossover search returned its own floor as a plausible integer. Repaired
          by A3, which applies DEC-20260918-4b7e21 ITEM-2's STANDING CONTROL
          REQUIREMENT to this contract: two materially separated bounds, reported
          per bound, and a bound-tracking figure recorded as bound-tracking.
        - >-
          THE BASELINE WAS UNGUARDED. Two columns are carried and 0.886 * 2^65.5 =
          2^65.33 differs from the published 2^60.8090 by 4.52 bits. A margin that
          mixes them moves by that much. Repaired by A7, which also forbids
          extrapolating the ECC2K-130 reference to any other degree.
        - >-
          STEPS 3 AND 4 COMPUTE DIFFERENT OBJECTS and the contract did not say so.
          Integer s = min(floor(m/2), floor(log2 B / d)) versus a continuous solve:
          at n = 131, m = 8, B = 2^80, d = 27 the continuous store exponent 108 is
          unreachable and floor(80/27) = 2 forces s = 2, giving 2^119.3 -- 54 bits
          above the continuous reading. P3a and P4 are read off step 4; P5 is
          falsified only by step 3. Repaired by A6.
      what_is_adequate_as_authored: >-
        C-M3-ANCHOR's SHAPE is right and is the best idea in the contract -- anchor
        the oracle exponent empirically at one point rather than assuming it
        everywhere. C-DEGENERATE-M is a real control with a real diagnostic. And
        the success_criterion's "SATISFIED EQUALLY BY EITHER OUTCOME" clause is
        exactly right and is preserved untouched.
      the_anchors_own_standing: >-
        A8, and it cuts against the contract's self-description. BOTH external
        anchors rest on EV-ICPERF-10c5fc and KN-FIND-aa2efc, which
        DEC-20260918-4b7e21 ITEM-3 ruled `external_unreviewed` with strength grades
        NOT conferred by this program. So C-M3-ANCHOR is not "the stronger control
        for being measured": it is measured externally by an instrument nobody here
        has opened. Passing either anchor confers nothing on either record and does
        not lift that ceiling. Conversely -- and this is the operative half -- a
        FAILURE of either anchor is AMBIGUOUS between a defect here and a defect
        there, and must be reported as ambiguous rather than resolved against this
        contract's arithmetic.

    - id: R4
      question: >-
        Is P3 falsifiable as written, and could the sweep detect its failure?
      ruling: >-
        NO ON BOTH COUNTS, AND THIS IS THE SHARPEST FINDING OF THE ENGAGEMENT.
        P3a is a one-line theorem of the cost model, not a prediction. From total =
        m! * 2^(n + d(1-s)), a sub-rho cell requires d(s-1) > n/2 + log2(m!), hence
        store exponent ds > S/(S-1)*(n/2 + log2 m!) > n/2 for every s >= 2 -- for
        the trivial reason that S/(S-1) > 1 and log2 m! > 0. P3's stated falsifier,
        "any m admits a sub-rho cell with store exponent below n/2", is therefore
        ALGEBRAICALLY UNREACHABLE within the stated oracle class. The sweep cannot
        detect its failure because it has no failure to detect: its only real
        falsifier is HEUR-GENERIC-MSUM, which the contract states it cannot test.
      consequence: >-
        P3a is reclassified `model_consequence` (A2) and its confirmation may not
        count as support. This does not make P3a worthless -- it is the result, and
        a clean one -- but it relocates where the result's weight sits: entirely on
        HEUR-GENERIC-MSUM, exactly as the hypothesis's own falsification_note says.
        The honest reading of a confirmed P3a is "the model says the family's entry
        price exceeds n/2 bits of store", never "we tested whether it does".
      and_p3b_is_worse: >-
        P3's monotonicity clause is FALSE as written and inconsistent with P4 in
        the same contract, and no run is needed to see it: the minimum-store curve
        falls 140.2 -> 112.5 -> 107.7 over m = 4, 6, 8 and only then rises.
        Withdrawn as a prediction and converted into required reporting by A2b. The
        run must state the inconsistency rather than reconcile it silently.

    - id: R5
      question: Does admitting this lane need another closed, under focus discipline?
      ruling: >-
        I CANNOT ANSWER THIS FROM COMMITTED STATE AND I AM NOT PRETENDING TO.
        tools/autoresearch_focus.py requires a shell I do not have. THE CHECK IS
        DECLARED NOT PERFORMED and is a hard precondition on the archive and on the
        run. SEE R7: on attempt the precondition proved unsatisfiable as I specified
        it, and R7 supersedes it with the substantive check.
      what_a_repository_wide_count_is_worth_here: >-
        NOTHING, AND NO RULING IN THIS DECISION USES ONE. `status: approved` is an
        ARCHIVAL fact in this repository: 1141 records carry it, counted at approval
        time. That number is every experiment the program has ever approved, not
        live lanes, so it cannot bound concurrent critical experiments in either
        direction and is not read as focus state anywhere above or below. The scope
        that matters is LIVE LANES ON THE OWNING GOAL, which is what R7 checks.
      what_i_can_rank_on: >-
        Admission is argued, not assumed, on four checkable facts: it needs no
        machine (900 s wall clock, 2 GB, standard-library integer arithmetic, no
        engine, no quiet host), so it contends with no measurement lane;
        IMP-SEMBIN-ENGINE explicitly exempts cost-model and derivation experiments
        by name; the owning goal's max_concurrent is 2 and this engagement opens no
        batch; and the experiment is independent of Semaev's Assumption 1, which
        every other cost table in this program inherits from a check reaching only
        n <= 21 (EV-ICPERF-a8080e) -- so it is the one row in the SEMBIN cost
        family whose conclusion does not move if Assumption 1 fails.
      ranking_against_doing_nothing: >-
        Required by AGENTS.md, because an unlimited ECC budget is the strongest
        invitation to make-work this program has. It ranks ahead of nothing on
        information per second: it is the only available act that prices the ONE
        escape the committed arithmetic leaves open. Three committed results close
        the others -- the product law is independent of dim V so the m = 3
        free-oracle floor already exceeds rho, the Riemann-Roch oracle realises
        generic 3SUM cost and loses to structureless pair enumeration, and the
        family's measured implicit base matches the generic prediction at n = 131.
        Larger m is what remains, and this prices it. Read against
        docs/target-result-profile.md it is not exponent-moving work and is not
        presented as such; it is the cost-honesty limb of that profile, which is
        the limb that decides whether an exponent claim would have been worth
        anything.
      what_it_does_not_exempt: >-
        Cheapness is not a ranking argument by itself and is not used as one here.
        If the focus tool reports three critical lanes active, this waits for a
        rerank; the approval stands and the dispatch does not.

    - id: R6
      question: >-
        Which goal owns this contract, and does the archive-binding defect block
        opening anything?
      ruling_on_ownership: >-
        GOAL-SEMBIN-5078bc OWNS IT. Four committed facts, none inferred from a
        prefix: 5078bc's objective item (4) COST is the time-AND-memory comparison
        against a rho comparator with negligible memory (KN-OPEN-86e7e1); its
        completion criterion 4 asks for exactly a time-and-memory record against
        vOW parallel rho with a tradeoff curve in m; H-SEMBIN-97ea23 -- the
        supported +85-in-n / -29.0-bit baseline-coherence result this contract
        builds on -- is 5078bc's; and GOAL-SEMBIN-cbf422's own committed identifier
        note says "the memory-charged crossover work is EXP-SEMBIN-f4a17b under
        GOAL-SEMBIN-5078bc".
      ruling_on_the_mis_cited_question: >-
        H-SEMBIN-8e7ae3's `question_id: RQ-SEMBIN-9fa4ba` IS MIS-ATTRIBUTED AND IS
        LEFT UNEDITED. RQ-SEMBIN-9fa4ba is cbf422's question and its four objects
        are chain length, topology, subspace and the absorbed cofactor -- not the
        oracle's store. It is read as a SECONDARY attribution, defensible on its
        cofactor limb and on its constraint that a trade leaving the exponent alone
        is still a result. The field is not edited because that is a content change
        rather than a lifecycle move; a superseding record is the remedy if the
        secondary reading ever proves insufficient. Recorded on the hypothesis
        head as `question_id_attribution_ruling`.
      ruling_on_criteria: >-
        NO COMPLETION CRITERION OF EITHER SEMBIN GOAL IS DISCHARGEABLE BY THIS
        EXPERIMENT, and criterion 4 of 5078bc specifically is NOT. That criterion
        names the CHAINED-S_3 index calculus, whose stage-1 cost carries the
        n^{4 omega} Groebner cofactor; this contract admits no Groebner cost at
        all, by design. Reporting an oracle-family sweep as progress against it is
        the error CORR-20260916-402547 corrects on a sibling campaign and which
        EV-ICPERF-10c5fc warns about in its own completion_criteria_impact block. I
        am stating it in advance precisely because the resemblance is close enough
        that a later session would make the mistake in good faith.
      ruling_on_the_archive_defect: >-
        IT BLOCKS ROUTING, NOT OPENING, AND NOTHING HERE IS ROUTED THROUGH IT. The
        defect is one tooling problem reported twice on two SEMBIN goals:
        TASK-20260913-525e13 bound a shared, append-only, cross-campaign registry
        as a content-bound source artifact, and its queue record and its own
        snapshot receipt declare two DIFFERENT hashes for one path at one commit.
        It blocks BATCH-9d649f's completed-archive gate. This decision carries
        batch_id null and both archival tasks route around it, exactly as
        DEC-20260918-4b7e21 did. The receipt is not edited and the registry is not
        touched; the preferred repair -- bind the depended-on ENTRY, not the file
        -- stands as that decision's rank-3 item and is NOT dispatched here. It is
        also not an excuse: nothing about a stale hash on an unrelated experiment's
        archive bears on whether this contract may be approved.
      goal_checkpoint: >-
        OWED, NOT SKIPPED. A checkpoint on GOAL-SEMBIN-5078bc follows the ledger
        archive, as a NEW write-once shard, recording the approval, the
        `specified` + ceiling on H-SEMBIN-8e7ae3, no criterion discharged,
        criterion 4 explicitly untouched, goal stays `active`, and exactly one
        next_action preserved. Its existing six-item next_action list is NOT
        rewritten and item (1) keeps its rank. GOAL-SEMBIN-cbf422 is not edited at
        all, and its single next_action is undisturbed.

    - id: R7
      question: >-
        The focus precondition declared in R5 proved UNSATISFIABLE on attempt.
        Restate it, waive it, or name a different artifact?
      raised_by: >-
        The executing session, before dispatch, having tried to satisfy it. Reported
        rather than self-cleared, which is the behaviour the precondition contract
        asks for and is why the defect is being fixed before a dispatch instead of
        after one.
      the_defect_is_mine: >-
        I NAMED AN INSTRUMENT WHERE I SHOULD HAVE NAMED A PROPERTY.
        tools/autoresearch_focus.py accepts only a queue of schema
        crypto.autoresearch.focus_queue.v1/v2/v3. GOAL-SEMBIN-5078bc has no focus
        queue; its only queue is
        coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json,
        a DISPATCH queue, which that schema check rejects outright. And because this
        decision carries batch_id null and opens no batch, no focus queue will come
        into existence for it. So the gate I declared hard was unmeetable by any
        action available in this engagement.
      ruling: >-
        RESTATED, NOT WAIVED. Focus discipline is a property of live lanes, not of a
        particular renderer, and the property is checkable here. The precondition is
        superseded -- additively, with the original text preserved -- by DP-2a on
        TASK-20260928-5a6b03 and DP-Fa on TASK-20260928-9e14ac: report the open
        batches on GOAL-SEMBIN-5078bc, the lane states from `goal_lanes.py lanes`
        after `git fetch`, that this contract adds zero lanes and zero batches, and
        that no other goal's live lane is displaced. Pass criterion: fewer than three
        live critical lanes on the owning goal, with two as the default ceiling and
        the goal's own max_concurrent at 2.
      recorded_result: >-
        PASS ON THE SUBSTANCE, on the executing session's check: one open batch
        (BATCH-9d649f), one lane reported (BATCH-457504) and it is CLOSED, and this
        contract opens neither a batch nor a lane. Zero concurrent critical
        experiments added; the limit is not approached. TASK-20260918-7d15e6 is named
        and is undisplaced -- it is a review round on GOAL-DREG-001/ICPERF, not a
        critical experiment, and it keeps its rank ahead of everything under
        GOAL-SEMBIN-cbf422.
      why_not_waive: >-
        A waiver would have dropped the control, and the control had real content:
        the question "does admitting this lane require closing another" needed an
        answer and now has one, on evidence. "The tool cannot run" is an
        infrastructure fact about a renderer, and under core rule 3 an infrastructure
        fact is never permission to stop checking the thing the renderer was checking.
      why_not_author_a_focus_queue_to_satisfy_it: >-
        REFUSED, and for the same reason A1 refused a widened tolerance. Creating an
        artifact whose only purpose is to let a gate go green -- for a contract that
        opens no batch and therefore has no lane for a focus queue to describe -- is
        manufacturing the check's input. The honest version is forward guidance: when
        a batch is next opened on GOAL-SEMBIN-5078bc, author its focus queue then and
        the tool becomes the standing check again.
      what_the_substantive_check_does_not_cover: >-
        STATED BECAUSE IT RELOCATES THE REAL GUARANTEE. Lane visibility is a
        write-once feed and is eventually consistent, so a lane claimed in another
        worktree and not yet pushed is invisible to it. The protection against that
        is the LANE CLAIM on TASK-20260928-9e14ac, which resolves collisions by
        lowest epoch -- not this reading. A stale lane read is a reason to claim, not
        a reason to proceed unclaimed, and the claim precondition is unchanged.
      second_defect_fixed_in_the_same_pass: >-
        The identifier precondition named the wrong instrument too. `allocate_id.py
        --check` scans the WORKING TREE, so it reports each of this engagement's five
        tokens "taken" as soon as its own file exists -- self-reference, not
        collision, and mistaking it for one nearly stopped the previous round. A
        collision can only live in COMMITTED state, so the test is `git grep <token>
        HEAD`, re-run after the merge of origin/main because a concurrent worktree
        could land a token in between. Superseded as DP-1a; all five tokens report
        zero committed occurrences. The original text and both of its defects -- it
        also said "four" while listing five -- are preserved on the card rather than
        edited away.
      generalisation_worth_keeping: >-
        Both defects are the same error in two places: a precondition that names a
        COMMAND instead of the PROPERTY it is standing in for inherits every one of
        that command's incidental requirements -- a queue schema, a scan scope -- and
        becomes unsatisfiable or self-defeating for reasons that have nothing to do
        with the property. Write preconditions as checkable properties and name a
        command only as one way to read them. Candidate for a KN-TECH once a second
        instance is seen outside this engagement; not promoted here, because one
        engagement's pair of instances is an anecdote.

