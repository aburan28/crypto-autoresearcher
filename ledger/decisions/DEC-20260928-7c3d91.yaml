  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE IN
      EITHER DIRECTION. No Certicom challenge curve and no FIPS binary curve is
      asserted safe or attackable. The approved contract carries
      `claim_tier: heuristic_estimate`, instantiates no curve, computes no
      relation, and every one of its eleven degrees is a parameter label in a cost
      formula.
    - >-
      EVERY ROW THE EXPERIMENT WILL PRODUCE IS CONDITIONAL ON HEUR-GENERIC-MSUM,
      WHICH IS UNVALIDATED AND HAS NO VALIDATING EXPERIMENT. Its one supporting
      datum is at m = 3, the single arity where meet-in-the-middle confers no time
      advantage and which therefore cannot discriminate the heuristic. A
      sub-generic m-SUM algorithm exploiting Frobenius, the 2-torsion, or the
      low-degree function field would void every row.
    - >-
      THE BASELINE IS CONDITIONAL ON HEUR-VOW-CURVE, WHICH IS UNVALIDATED AND
      WHOSE SOURCE THIS PROGRAM HAS NOT READ. Its owning goal ranks retrieving van
      Oorschot-Wiener 1999 FIRST for exactly that reason.
    - >-
      THE APPROVAL DOES NOT ASSERT THAT H-SEMBIN-8e7ae3 IS TRUE, and confirmation
      of P1, P2, P3a and P4 will not make it truer. Those are consequences of the
      model; the run checks an implementation against them. P5 is the only
      prediction where a surprise is available.
    - >-
      MY OWN ARITHMETIC IS NOT INDEPENDENT VERIFICATION. I derived P1-P4 after
      reading them, which is anchoring, and I say so in the citation above and in
      the review plan's prior. The blind re-derivation commissioned on
      TASK-20260928-e4f7b2 excludes this decision from what its author may read,
      and that exclusion is the point.
    - >-
      OF THE THREE CHECKS I COULD NOT RUN, TWO ARE NOW CLOSED AND ONE REMAINS OPEN.
      Identifiers: all five tokens confirmed absent from committed state via `git
      grep HEAD`, re-confirmation after the merge still owed (R7, DP-1a). Focus: the
      named instrument was unsatisfiable and is superseded by a substantive
      live-lane check that PASSED (R7, DP-2a). Still open:
      python3 tools/validate_ledger.py, which remains a hard completion gate on
      TASK-20260928-5a6b03 and is NOT reported as passed here. A record that fails it
      returns to the Coordinator for a corrected record, never for an edit that hides
      the failure.
    - >-
      THE SUBSTANTIVE FOCUS READING CANNOT SEE AN UNPUSHED LANE from another
      worktree, because lane visibility is an eventually-consistent write-once feed.
      The guarantee against a concurrent claim is the lane claim on
      TASK-20260928-9e14ac, which resolves collisions by lowest epoch -- not the
      focus reading. This is disclosed rather than glossed because it relocates where
      the concurrency protection actually lives.
    - >-
      NONE OF THE RECORDS THIS DECISION WRITES IS COMMITTED AT THE TIME OF WRITING,
      SO NO TRANSITION ABOVE IS EFFECTIVE AND NO RUN IS YET AUTHORIZED IN FACT.
      Authorization attaches when TASK-20260928-5a6b03's receipt verifies. An
      Executor that cannot find both the frozen contract and this committed
      decision must refuse, whatever any message says.
    - >-
      THE REPRODUCIBILITY GAP IS DIAGNOSED FROM THIS REPOSITORY'S RECORDS ONLY. I
      did not read the external producing artifacts, so I cannot say whether the
      committed constants are right, wrong, or right under a convention nobody
      wrote down. The correction is scoped to the published derivation accordingly.

  procedure_deviations:
    - id: PD-1
      severity: material
      what: >-
        THIS SESSION HAS NO SHELL. Neither allocate_id.py --check,
        validate_ledger.py, autoresearch_focus.py, goal_lanes.py, nor any git
        command could be executed.
      what_was_done_instead: >-
        Five identifiers were drawn as random 6-hex tokens -- the same
        no-state-scanned anti-collision property allocate_id.py provides -- and
        each was checked free by Glob over `**/*<token>*` across the whole
        repository: 7c3d91, 2b8f4e, 9e14ac, 5a6b03, e4f7b2, all with no match.
        Ownership, budgets, impediments and criteria were read from committed goal
        records instead of from a rendered queue.
      what_was_NOT_done: >-
        No substitute exists for the validator, the focus tool, the lane claim or
        the commit, and none was improvised. The records are working-tree artifacts
        until the driving session commits them.
      consequence: >-
        Every transition is PENDING. TASK-20260928-5a6b03 carries the validator
        run, the focus render, the --check sweep and the commit as hard gates or
        preconditions.
    - id: PD-2
      severity: disclosed
      what: >-
        A peer message from the contract's author reported the C-FLOOR-REPRO
        tolerance defect and proposed three remedies while this Coordinator was
        mid-analysis, after this Coordinator had independently reached the same
        reconstruction.
      how_it_was_handled: >-
        AS A POINTER, NEVER AS AUTHORITY OR EVIDENCE. The ruling in A1 rests on the
        arithmetic read from the committed records and on this Coordinator's own
        reconstruction, both of which predate the message; the message's value was
        that it made the agreement of two independent derivations visible, and that
        is recorded as corroboration in `citations` rather than as a finding of its
        own. The choice among the three remedies is made here, in a committed
        record, with the two rejected options and their reasons stated -- not in a
        reply.
      why_recorded: >-
        Messages leave no auditable trace. An amendment shaped in part by an
        in-session exchange must say so, or the record reads as if the Coordinator
        found everything alone.
    - id: PD-4
      severity: material
      what: >-
        THE REVIEW PLAN WAS WRITTEN IN FIELD NAMES OF MY OWN INVENTION AND WAS
        THEREFORE SCHEMA-HOLLOW ON FIRST SUBMISSION -- fifteen validator errors,
        and the SAME FIFTEEN-ERROR SHAPE as the previous round's review plan on
        TASK-20260918-7d15e6. I wrote `claim_step`, `owner`, `worked_attack`,
        `where_i_think_it_breaks`, `known_false_objects`,
        `signature_a_correct_argument_must_show` and a second `blindness:` key of my
        own; the schema names `joint`, `assigned_to`, `attack_plan`,
        `breaking_artifact`, `proves_too_much.objects`, `failure_signature` and one
        `blindness`. The content was present and the fields that carry it were
        empty, so every tool and every schema-following reader saw an unowned,
        unspecified round. The duplicate `blindness:` key would additionally have
        been a YAML error independent of the schema.
      the_mechanism_not_the_lapse: >-
        RECORDED AS A MECHANISM PROBLEM BECAUSE IT RECURRED AFTER BEING FIXED ONCE,
        which is the definition. The cause is that I composed the plan from
        agents/coordinator.md's PROSE description of the review architecture -- which
        names the obligations (record your prior, enumerate and own the joints,
        supply a worked attack, require proves-too-much, require a blind
        re-derivation) but not the FIELDS -- and then never reconciled against
        templates/research-records.md. Prose that describes six obligations reads as
        complete when six obligations are met under any names. CLAUDE.md already says
        "Record schemas live in templates/research-records.md; copy, don't invent
        fields", and the operative word is COPY: open the template and paste the
        skeleton BEFORE writing content, rather than writing content and mapping it
        afterwards. Afterwards never happens.
      what_the_next_coordinator_should_do: >-
        Before authoring any review_plan, open templates/research-records.md at the
        "Review plan" section and paste the block verbatim, then fill it. The tell
        that you have not is a plan whose joints carry a key named for what you were
        thinking about (`claim_step`, `owner`) rather than what the schema calls it
        (`joint`, `assigned_to`). It is the same error as PD-3's preconditions --
        writing down the thought instead of the checkable field -- and PD-3 and PD-4
        together are two instances in one engagement, which is why the
        generalisation in R7 is recorded rather than left implicit.
      what_changed_in_the_fix: >-
        Fields only, plus five new identifiers. No joint, attack, control or
        exclusion was dropped: `claim_under_review` now quotes the PRODUCER'S
        statement from H-SEMBIN-8e7ae3 rather than my restatement, the four joints
        each carry `joint`/`assigned_to`/`attack_plan`/`breaking_artifact`, the
        proves-too-much objects (F_q^* and a high-genus hyperelliptic Jacobian) sit
        in `proves_too_much.objects` with their `failure_signature`, and the blind
        re-derivation carries `quantity`, `parameters`, `blind_from` and
        `assigned_to`.
      new_identifiers_this_forced: >-
        `assigned_to` must name a reviewer TASK-*, so ownership could no longer be
        deferred to "cards minted when the run id exists". Five minted and Glob-
        checked free: TASK-20260928-a1c7e5 (validator, J1), -3f90b8 (red-team, J2
        AND the proves-too-much control, shared owner disclosed on the card),
        -62ad14 (red-team, J3, kept alone as the highest-value joint), -d8b371
        (validator, J4), -4e5c26 (validator, blind re-derivation, which MUST be a
        separate session from J1 because its blind_from excludes the implementation
        J1 must read). `git grep HEAD` confirmation on these five is owed alongside
        the original five. This is a real improvement forced by the schema: naming
        the owner is what makes an unowned joint visible before the round instead of
        after the claim ships.
    - id: PD-3
      severity: material
      what: >-
        TWO OF THIS DECISION'S OWN DISPATCH PRECONDITIONS WERE MISSPECIFIED AND WERE
        SUPERSEDED BEFORE ANY DISPATCH. The focus precondition named
        autoresearch_focus.py, which has no queue to run against here and could not
        be satisfied by any available action; the identifier precondition named
        allocate_id.py --check, which scans the working tree and therefore reports
        this engagement's own five records as collisions with themselves.
      how_it_was_handled: >-
        Superseded ADDITIVELY on the cards -- DP-1 -> DP-1a and DP-2 -> DP-2a on
        TASK-20260928-5a6b03, DP-F -> DP-Fa on TASK-20260928-9e14ac -- with every
        original text and both of its defects preserved in place rather than edited
        out, and the ruling recorded as R7. Neither was waived and neither was marked
        satisfied by a check the Coordinator had not specified.
      why_this_is_not_the_forbidden_card_edit: >-
        AGENTS.md forbids editing a card to make a PAST DISPATCH look compliant. No
        dispatch has occurred, nothing is committed, and the correction runs the other
        way: the preconditions were tightened into checkable properties and the
        original defective text is still readable on the card. What would have been
        the violation is the executing session marking DP-2 satisfied on a substitute
        check, which it explicitly refused to do and reported instead.
      credit_where_it_belongs: >-
        Both defects were found by the session attempting to satisfy them, not by the
        Coordinator that wrote them. That is the precondition contract working as
        designed -- the dispatcher reading the half of the card addressed to it -- and
        it is the mirror image of CORR-20260915-6708e4, where a dispatcher skipped
        that half.

