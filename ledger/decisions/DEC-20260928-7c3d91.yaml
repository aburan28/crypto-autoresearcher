      an evidence-review decision: it is neither `support` nor `reject_scoped`, so
      the gate's mandatory limb does not fire. There is additionally no evidence to
      promote from -- no run exists. The one candidate a hurried reader might
      reach for is the reproducibility gap, and it is deliberately NOT a KN-*
      entry: it is a defect in two existing corpus/ledger records, so its durable
      form is CORR-20260928-2b8f4e, and promoting a finding whose content is "an
      existing finding cannot be rederived" would put the defect and its disclosure
      in the corpus as peers. KN-FIND-aa2efc is flagged a second time and is NOT
      quarantined, because its headline claim does not depend on the unrecovered
      constants.
    deferred:
      - target: KN-FIND, from EXP-SEMBIN-04ec3c's swept minimum-store table
        why_deferred: >-
          Premature in every branch. The hypothesis is ceilinged at `analyzed`
          while HEUR-GENERIC-MSUM is unvalidated, and a `support` decision on
          `replicated`/`strong` evidence is the only thing that would make a
          promotion mandatory -- unreachable from one run. If the sweep returns the
          expected negative, the promotable object is the family's entry price in
          bits of store GIVEN generic m-SUM, and it must be titled without the word
          "charged" (amendment A5) and without any claim about a curve. If J3
          finds a sub-generic route, the promotable object is entirely different
          and escalates to review-breakthrough at max.
      - target: KN-OPEN, sub-generic m-SUM over a Frobenius-stable factor base
        why_deferred: >-
          This is the crystallized unknown the contract points at and it is the
          honest place for the family's remaining budget. Deferred until J3 reports,
          because J3 may find the answer is already known in the k-SUM literature,
          in which case the right record is a KN-LIT with `retrieved` provenance
          rather than an open problem.

