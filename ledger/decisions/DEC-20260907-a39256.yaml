coordinator_decision:
  id: DEC-20260907-a39256
  kind: refiled_user_authorization
  context: >-
    This record re-files, verbatim in substance, the user-authorization
    decision originally filed as DEC-20260906-dd1676. That original was
    written to the main checkout's working tree but never committed; a
    concurrent session switched that checkout's branch and cleaned the tree
    on 2026-09-07, destroying the untracked file before it could be archived.
    The orchestrating Coordinator session read the original in full before its
    loss and re-files it here under this new identifier rather than
    re-asserting the lost identifier (rule 4: corrections create new records;
    an identifier whose record no longer exists is never re-minted in
    substance). The original's stated content is reproduced under
    original_record below; no field was altered except this re-filing
    disclosure.
  original_record:
    id: DEC-20260906-dd1676
    context: >-
      Adding execution_authorized: true to EXP-PFDR-845d33 on explicit user
      instruction. DEC-20260906-126882 already approved the experiment and
      authorized the bounded dispatch (TASK-20260906-9e922c); this record
      adds the missing execution_authorized field so the run-experiment skill
      can proceed.
    decision: authorize_execution
    target_ids: [EXP-PFDR-845d33]
    rationale: >-
      User answered "a" to the specification_error report, confirming
      execution_authorized should be set. The experiment, protocol, eight
      fixtures, four bounded run groups, and budget are unchanged from
      DEC-20260906-126882. This record does not change hypothesis status,
      scientific claims, or goal status.
    evidence_refs:
      - DEC-20260906-126882
    limitations:
      - Only EXP-PFDR-845d33 is authorized.
      - No hypothesis status, scientific claim, or goal status changes.
      - Unresolved definition interfaces are reported as unmeasured, never assumed.
    next_actions:
      - Execute TASK-20260906-9e922c (run-experiment skill).
      - Archive all declared execution artifacts before validator review.
      - Require a separate Coordinator disposition before authorizing the survival panel.
    knowledge_promotion:
      promoted: []
      not_warranted: Authorization provides no experimental or mathematical evidence.
    decided_by: coordinator
    decided_at: '2026-09-06'
    user_authorization:
      quote: a
      interpreted_scope: Add execution_authorized to EXP-PFDR-845d33, then run.
    resources:
      maximum_runs: 4
      wall_clock_seconds_per_run: 900
      total_wall_clock_seconds: 3600
      total_cpu_hours: 1
      memory_gb: 8
      maximum_workers: 1
  refile_disclosure:
    lost_record: DEC-20260906-dd1676
    loss_mechanism: untracked file destroyed by a concurrent branch switch and working-tree cleanup in the main checkout, 2026-09-07
    restoration_basis: the orchestrating Coordinator session holds the original's verbatim content, read from the file before its destruction
    authority_unchanged: The user authorization itself is unchanged and continues to bind; only the record's identifier and this disclosure are new.
  decision: refile_authorization
  target_ids: [EXP-PFDR-a76b91]
  rationale: >-
    The re-filed authorization covers the audit named in the original
    (EXP-PFDR-845d33, protocol unchanged). The original's target can no longer
    be re-executed: its four reserved run IDs are consumed by immutable
    failure receipts and its driver's receipt directories are exclusive.
    DEC-20260906-280035 requires a separately frozen successor before any
    rerun. EXP-PFDR-a76b91 is that successor, with the protocol, fixtures,
    groups, seeds, budget, and prediction unchanged (see its
    predecessor_semantic_equivalence and the DEC-20260907-c9b61c approval).
    This re-filing therefore extends the user's "then run" authorization to
    the successor vehicle and to nothing else.
  limitations:
    - Only EXP-PFDR-a76b91 (the frozen successor) is authorized.
    - The scientific protocol, fixtures, and budget remain exactly as in DEC-20260906-126882.
    - No hypothesis status, scientific claim, or goal status changes.
    - Unresolved definition interfaces are reported as unmeasured, never assumed.
    - The survival panel and any later panel remain unauthorized, as before.
  evidence_refs:
    - DEC-20260906-126882
    - DEC-20260906-280035
    - DEC-20260907-c9b61c
  next_actions:
    - Execute TASK-20260907-808ec2 (run-experiment skill, container backend).
    - Archive all declared execution artifacts before validator review.
    - Require a separate Coordinator disposition before authorizing the survival panel.
  knowledge_promotion:
    promoted: []
    not_warranted: Authorization provides no experimental or mathematical evidence.
  decided_by: coordinator
  decided_at: '2026-09-07'
  user_authorization:
    quote: a
    interpreted_scope: Add execution_authorized to EXP-PFDR-845d33, then run (executed via its frozen successor EXP-PFDR-a76b91, per DEC-20260907-c9b61c).
