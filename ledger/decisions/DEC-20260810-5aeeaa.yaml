      NO KNOWLEDGE PROMOTION IS WARRANTED, FOR A CONCRETE REASON RATHER THAN A
      PROCEDURAL ONE. The promotion gate fires on a `support` or `reject_scoped`
      decision backed by `replicated` or `strong` evidence. This decision is
      `revise`, it creates no evidence record, and its central mechanism question is
      explicitly INCONCLUSIVE on a single unreplicated run at one prime. On the
      substance: the one genuinely general object here -- that a 5% rung-to-rung
      stability rule over thirteen rows is unreachable at 48 seeds because the
      relative noise of a standard-deviation estimate on a nested doubling is about
      1/(2*sqrt(n_prev)) -- is a DERIVED statement of elementary sampling theory,
      not a campaign finding, and promoting it would enter textbook arithmetic into
      the corpus as internal knowledge. The one genuinely empirical candidate -- that
      the per-row variance-ratio distribution may be right-skewed enough to defeat a
      Gaussian tail rule at coverage 259/260 -- rests on two upper-side exceedances
      against 2.4 expected, which is consistent with no skew at all and would be
      promoting noise. REVISIT CONDITION, STATED SO IT IS NOT LOST: if validation V1
      returns a positive, replicated characterisation of the tail behaviour of the
      per-row variance-ratio sampling distribution -- at both primes, or at one prime
      with a second independent seed family -- that is a genuine, cheaply checkable
      instrument finding about a statistic this campaign uses everywhere, and it
      becomes a KN-FIND candidate at the ledger archive that records it, with a
      regenerated knowledge/INDEX.md in the same commit.

