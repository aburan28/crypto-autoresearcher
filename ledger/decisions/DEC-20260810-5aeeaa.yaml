  the_executor_behaved_correctly_on_both_items_and_that_is_affirmed: >-
    AFFIRMED EXPLICITLY, BECAUSE BOTH BEHAVIOURS COST THE RUN ITS EASIER OUTCOME.
    ON ITEM 1 the Executor stopped exactly as E3 requires: no widening, no coverage
    change, no interval accepted, nothing gated, no rung re-run with different
