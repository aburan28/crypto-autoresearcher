  context: >-
    ADJUDICATION DECISION FOR THE VALID PHASE A RE-EXECUTION OF EXP-INSTR-36c8cf
    UNDER CONTRACT VERSION 2 (specification.yaml version 1 as amended by
    amendments/v1.yaml). RUN-INSTR-36c8cf-phaseA-v2-57ca9a terminated
    `completed_valid` in 128.234 s and returned exactly two items that belong to
    the Coordinator and to no one else.

    ITEM 1. Falsification criterion F4 FIRED at p = 4001: the E3 stability rule
    (interval half-width changing by less than 5% relative to the previous rung at
    EVERY one of the thirteen density rows) was NOT MET AT ANY RUNG. Rung 2
    (24 seeds) met it at 1 of 13 rows, worst 0.3932 at fb = 22; rung 3 (48 seeds)
    met it at 5 of 13 rows, worst 0.2354 at fb = 7. The Executor STOPPED exactly as
    E3 requires.

    ITEM 2. CONFLICT-1, declared before any measurement and left OPEN for this
    Coordinator: the dispatching envelope's standing control "targets_B, NEVER
    targets_uniform" against the frozen contract's requirement that the SR3 v3
    characterisation re-measure the named historical reference run AT ITS OWN
    FROZEN PARAMETERS INCLUDING ITS SAMPLER, that reference being
    EXP-ICINV-55c2d8 / RUN-ICINV-p4001-fixed, whose sampler is
    exp_icinv.targets_uniform, identified at run time from its own record.

    THIS DECISION ADJUDICATES BOTH, FILES A VERSIONED PROTOCOL AMENDMENT THAT IT
    DELIBERATELY DOES NOT APPROVE, RESTATES THE STANDING SAMPLER CONTROL SO THE
    NEXT EXECUTOR IS NOT FORCED TO CHOOSE BETWEEN TWO COMMITTED INSTRUCTIONS,
    ADJUDICATES NO HYPOTHESIS, MEETS NO COMPLETION CRITERION AND CREATES NO
    EVIDENCE RECORD.

