  F4_is_a_protocol_outcome_and_never_negative_evidence: >-
    STATED SO IT CANNOT BE MISREAD LATER. F4 FIRING IS A PROTOCOL OUTCOME OF A
    COORDINATOR-SET STOPPING RULE. IT IS NOT NEGATIVE EVIDENCE ABOUT ANY
    INSTRUMENT, ABOUT NULL-B OR NULL-C, ABOUT THE VARIANCE-RATIO STATISTIC, ABOUT
    ANY CURVE, CLASS, ISOGENY, SAMPLER OR PRIME, IN EITHER DIRECTION, AT ANY SCALE.
    It says that two Coordinator-set numbers in the same amendment change -- the
    seed rungs 12/24/48 and the 5% rung-to-rung threshold -- were not jointly
    satisfiable by the data the ladder could produce. It says nothing about whether
    the reference run's per-row sampling distribution is a good reference for the
    SR3 v3 gate; that question is exactly what remains open. Nothing here bears on
    H-ICINV-6c7920, on EV-ENDO-10109d, on endomorphism structure, on |D_0|, or on
    ECDLP difficulty.

  adjudication_item_1:
    verdict: >-
      THE SEED LADDER IS EXTENDED UNDER A VERSIONED AMENDMENT THAT THIS SESSION
      FILES AND DELIBERATELY DOES NOT APPROVE. The 5% rule survives BYTE-UNCHANGED,
      the per-row coverage 259/260 and family-wise 0.05 survive unchanged, the
      mean +- z*sd estimator survives unchanged, and SR4 NO WIDENING survives
      absolutely. What changes is only the length of a precision ladder, and it
      changes under an amendment that cannot authorize a run until two independent
      sessions have checked the attribution the extension rests on.
    the_freeze_question_confronted_head_on_rather_than_asserted: >-
      THE QUESTION IS WHETHER EXTENDING A LADDER AFTER SEEING THAT IT FAILED IS THE
      SAME CLASS OF DEFECT AS WIDENING AN INTERVAL AFTER SEEING DATA. IT IS ARGUED
      BOTH WAYS HERE AND THE ANSWER IS NOT "NO"; IT IS "NOT IF, AND ONLY IF, FOUR
      CONDITIONS HOLD, ALL OF WHICH ARE MADE BINDING BY THE AMENDMENT".

      THE CASE THAT IT IS THE SAME DEFECT, STATED AT ITS STRONGEST AND NOT
      STRAW-MANNED. E3 is not a mere precision knob: it is wired directly into
      FALSIFICATION CRITERION F4. On the letter of the frozen text the
      characterisation was falsified and the prescribed response is that the work
      stops and the gate is redesigned. Responding instead by drawing more seeds
      until the criterion is met is OPTIONAL STOPPING: a rule that always
      eventually passes if you are allowed to keep sampling has no falsifying power
      at all, and a Coordinator who extends once will face the identical decision at
      the next failure with the identical argument available. Worse, this session
      has SEEN the rung-1, rung-2 and rung-3 half-widths and intervals, so it is
      choosing the ladder with data in view -- precisely the condition under which
      the [1.3, 3.6] band became an outward-rounded hull of the rows it gated. That
      is a serious objection and it is why the amendment is not approved on filing.

      THE CASE THAT IT IS A DIFFERENT DEFECT, WHICH THIS COORDINATOR ACCEPTS ON
      FOUR CONDITIONS. (a) THE ACCEPTANCE REGION IS NOT MOVED. Widening changes
      WHICH CANDIDATE VALUES PASS, in the direction that makes an observed failure
      disappear. Adding seeds changes only how precisely the SAME population
      quantity -- the reference run's per-row mean and standard deviation -- is
      estimated, under an unchanged estimator at an unchanged coverage. (b) THERE
      IS NO DATA TO FIT TOWARD. Hull-fitting requires the data to be gated to be
      visible. The data this gate will gate is a successor Arm A0 measurement of
      EXP-ICINV-4d33aa; that experiment is PAUSED, its amendment v3 is unwritten,
      its successor run does not exist, and no candidate arm value has been
      observed by anyone. There is nothing this extension could be fitted to. (c)
      THE AMENDMENT IS FILED BEFORE THE DATA IT GOVERNS EXISTS. The data governed by
      this amendment is rungs 4 and beyond, which do not exist and whose half-widths
      nobody has seen; the freeze standard this campaign actually operates is "filed
      before the affected data is generated", which is satisfied exactly. The rungs
      that HAVE been seen are not re-scored, not re-cut and not re-run. (d) THE
      LADDER IS DETERMINISTIC AND TERMINATES. It is a plain doubling with a declared
      TERMINAL RUNG and a terminal outcome declared NOW in both directions, so it is
      not an open-ended "sample until it passes" loop. WITHOUT (d) THE OBJECTION
      ABOVE WOULD BE CORRECT AND THE EXTENSION WOULD BE FORBIDDEN.
    what_would_have_been_forbidden_and_is_not_done: >-
      RELAXING THE 5% RULE TO FIT THE OBSERVED 23.5% IS EXACTLY THE HULL-FITTING
      THIS WHOLE REDESIGN EXISTS TO PREVENT, AND IT IS NOT DONE. Neither is
      widening the interval, changing the coverage from 259/260, changing the
      family-wise target from 0.05, changing the estimator to a parametric band,
      dropping the noisiest rows from the family, accepting a rung that did not meet
      the rule, or computing a self-consistency verdict against a non-accepted
      interval. Any of those would move the acceptance region after seeing it fail.
      The 5% threshold appears in the amendment only as a quotation of the frozen
      value.
    arithmetic_check_of_the_input_offered_by_the_archiving_session: >-
      CHECKED RATHER THAN ADOPTED, AS INSTRUCTED, AND IT IS PARTLY WRONG WHILE ITS
      CONCLUSION SURVIVES. The offered sequence -- about 25.0% for 12->24, 12.5% for
      24->48, 8.8% for 48->96, 6.3% for 96->192, 4.4% for 192->384, 3.1% for
      384->800 -- is reproduced exactly by the INDEPENDENT-SAMPLE formula
      sqrt(1/(2*n1) + 1/(2*n2)) evaluated one rung late: that formula gives 0.25000
      for (12, 24), 0.17678 for (24, 48), 0.12500 for (48, 96), 0.08839 for
      (96, 192), 0.06250 for (192, 384) and 0.04419 for (384, 768). The first
      offered value is exactly right; every later one is the value belonging to the
      NEXT doubling, so the offered sequence UNDERSTATES the expected change at every
      rung after the first. Separately, the independent-sample formula is the wrong
      model for this ladder: E2's rungs are NESTED (rung 2 ADDS twelve seeds to
      rung 1, rung 3 ADDS twenty-four to rung 2), and for a nested doubling the
      expected relative change is SMALLER by a factor of sqrt(3). DERIVATION,
      recorded so it can be checked and overturned: with s_n^2 = S_A/n and
      s_2n^2 = (S_A + S_B)/(2n) for independent S_A, S_B each carrying about n
      degrees of freedom, log(s_2n / s_n) = 0.5 * log((1 + u)/2) with u = S_B/S_A;
      Var(log u) is about 4/n; the derivative of 0.5*log((1+u)/2) with respect to
      log u at u = 1 is 0.25; hence the standard deviation of the relative change is
      about 1/(2*sqrt(n_prev)). THE CORRECTED NESTED SEQUENCE, WHICH THIS DECISION
      USES: 0.1443 for 12->24, 0.1021 for 24->48, 0.0722 for 48->96, 0.0510 for
      96->192, 0.0361 for 192->384, 0.0255 for 384->768, 0.0180 for 768->1536. THE
      TWO ERRORS PARTLY CANCEL -- the offered 12.5% for 24->48 against a corrected
      10.2% -- so the conclusion the archiving session drew survives, but by
      coincidence rather than by the arithmetic offered, and this decision relies on
      the corrected figures alone.
    what_the_corrected_arithmetic_says_about_the_observed_values: >-
      DERIVED BY EXACT ARITHMETIC FROM THE FROZEN LADDER AND A DECLARED NOISE MODEL,
      NOT MEASURED. The observed worst-of-thirteen values are 0.3932 at rung 1->2
      and 0.2354 at rung 2->3, against corrected per-row noise scales of 0.1443 and
      0.1021: that is 2.72 and 2.31 standard deviations. For a MAXIMUM over thirteen
      rows those are unremarkable -- the median of the maximum of thirteen standard
      normals in absolute value is 1.943, so the predicted median worst rows are
      0.2804 and 0.1983, and the probability of a maximum at or beyond the observed
      value is about 0.08 and about 0.24 under independence. The thirteen rows share
      curves and share seed-independent sum sets, so they are positively correlated
      and those probabilities are floors. REACHABILITY OF THE FROZEN RULE, WHICH IS
      THE DECISIVE COMPUTATION: requiring every one of thirteen rows to move by less
      than 5% has probability about 1.2e-4 at the 24->48 transition, about 0.006 at
      48->96, about 0.095 at 192->384, about 0.51 at 384->768 and about 0.93 at
      768->1536. THE 5% RULE WAS THEREFORE EFFECTIVELY UNREACHABLE AT 48 SEEDS BY
      CONSTRUCTION, and the mismatch is between two COORDINATOR-SET values in the
      same change G3 -- the ladder 12/24/48 and the 5% threshold -- neither of which
      was set against any noise model, exactly as neither was set against any cost
      measurement (DEC-20260810-56db2d limitations). IT IS NOT A DEFECT OF THE
      USER-CHOSEN FAMILY-WISE GATE, NOT A PROPERTY OF ANY INSTRUMENT AND NOT A FACT
      ABOUT ANY CURVE.
    the_competing_explanation_this_run_cannot_exclude_and_the_inconclusive_verdict: >-
      THIS IS WHY THE AMENDMENT IS FILED UNAPPROVED, AND IT IS STATED PLAINLY: THE
      EVIDENCE IN THIS RUN CANNOT DISCRIMINATE BETWEEN TWO EXPLANATIONS OF THE
      INSTABILITY, SO ON THE MECHANISM THIS DECISION IS INCONCLUSIVE. Explanation A
      is ordinary sampling noise in a standard-deviation estimate, under which more
      seeds fix the gate. Explanation B is that the per-row sampling distribution of
      the variance-ratio statistic is right-skewed or heavy-tailed, under which the
      Gaussian tail rule HEUR-INSTR-3 is inadequate at coverage 259/260, the
      mean +- z*sd estimator is the wrong estimator, and NO number of seeds fixes
      the gate because the quantity being stabilised is not the quantity the gate
      needs. THE RUN CONTAINS A LIVE, CHECKABLE SIGNAL BEARING ON THIS, RECORDED
      HERE AS AN OBSERVATION AND EXPLICITLY NOT AS A FINDING: at rung 3 two of the
      thirteen rows have their own extreme per-seed ratio OUTSIDE their own fitted
      interval -- fb = 11, max 3.3358 against an upper endpoint 3.2614, and
      fb = 22, max 4.8231 against an upper endpoint 4.5123 -- and BOTH are on the
      upper side with none on the lower. The expected number of exceedances under
      the Gaussian rule is 13 * 48 / 260 = 2.4, so the COUNT is consistent and
      proves nothing; the one-sided pattern has probability 0.25 under symmetry and
      also proves nothing on its own. But both exceeding rows are among the rows
      that fail the stability rule, fb = 22 carries the largest standard deviation
      (0.4675) and the worst rung-1->2 change (0.3932), and the contract's own
      HEUR-INSTR-3 text says that visibly asymmetric or heavy-tailed extremes are
      reported as an instrument finding and the gate is redesigned under a further
      versioned amendment rather than absorbed silently. DISCRIMINATING A FROM B IS
      THE PRECONDITION FOR APPROVING THE AMENDMENT, AND IT IS NOT THIS SESSION'S TO
      DECIDE ALONE.
    why_this_session_may_FILE_but_may_not_APPROVE: >-
      THE CAMPAIGN HAS ALREADY SET THIS PRECEDENT AND IT IS APPLIED RATHER THAN
      RE-ARGUED. Amendment v1 was approved on filing because its two repaired
      parameters were USER decisions and the defect was the plain absence of two
      numbers from a frozen file, machine-checked inside the run -- not an
      attribution review could overturn (v1 approved_by_note). EXP-ICINV-4d33aa
      amendment v2 was held UNAPPROVED pending two independent validations because
      it repaired defects in a contract the same Coordinator wrote AND its repair
      depended on an attribution a validator might overturn. THIS AMENDMENT IS THE
      SECOND CASE, ON BOTH LIMBS. The rungs and the 5% threshold are
      COORDINATOR-SET (G3, decided_by coordinator), so the Coordinator role is
      repairing its own parameter after its own failure; and the repair depends
      entirely on Explanation A over Explanation B, which is exactly an attribution a
      validator can overturn. A Coordinator that approved its own repair of its own
      parameter, on an attribution the same run cannot establish, would be doing in
      one step what the two-step exists to prevent. SO THE AMENDMENT IS FILED,
      UNAPPROVED, AUTHORIZING NO COMPUTE, AND THE NEXT DISPATCH IS REVIEW, NOT A RUN.
    what_would_clear_it: >-
      NAMED CONCRETELY RATHER THAN LEFT AS A GESTURE. (V1) An independent
      review-adversarial session, in a session that did not originate this claim,
      that re-derives the noise arithmetic above from the run's own per-seed ratios
      and returns a verdict on Explanation A versus Explanation B -- including a
      direct check of skewness and tail weight of the per-row variance-ratio
      distribution at every one of the thirteen rows, and whether the two upper-side
      exceedances at fb = 11 and fb = 22 are consistent with the Gaussian rule at
      coverage 259/260. If it returns B, the extension is the wrong repair and the
      gate's ESTIMATOR must be redesigned instead, which is a user decision because
      the user selected this gate. (V2) A red-team pass on the freeze question
      itself -- whether extending a declared ladder after a stability failure, under
      an unchanged threshold, unchanged coverage, unchanged estimator, a declared
      terminal rung and a terminal outcome declared in advance, is discipline-
      preserving or is optional stopping wearing a uniform. A DISSENT FROM EITHER
      BLOCKS APPROVAL. Only after both return does a successor Coordinator decision
      approve, amend or withdraw amendment v2.
    named_cost_of_this_route: >-
      IT DELAYS EVERYTHING DOWNSTREAM AND THAT IS RECORDED, NOT ARGUED AWAY. Two
      review sessions must complete before a single further seed is drawn; the
      p = 6007 family stays not_measured; the SR3 v3 gate of EXP-ICINV-4d33aa stays
      unevaluable at both primes; and through criterion C4 the arm verdicts of
      EXP-JINV-bd141d and EXP-VOLC-9f5571 stay blocked. The cheaper route -- approve
      on filing and re-run tonight -- was available and is refused. THE COST OF THE
      LADDER ITSELF IS SMALL AND IS ESTIMATED FROM THE RUN'S OWN TIMELINE: the
      load-observation elapsed marks give about 81 s for the fixed sum-set
      measurement phase over 138 curves and about 47 s for scoring 48 seeds across
      all thirteen rows, which is about 1 s per seed at the margin because the m = 3
      sum sets are seed-independent and reused; a ladder to a terminal 1536 seeds is
      therefore of order 1.6e3 s against a 14400 s per-run budget, roughly 11%. THIS
      IS A LINEAR-IN-SEEDS EXTRAPOLATION FROM ONE 128 s RUN ON AN OVERSUBSCRIBED
      HOST, MARKED AS AN ESTIMATE AND NOT A MEASUREMENT. If the budget is reached
      first that is a BUDGET EVENT under AGENTS.md rule 5, the unreached rungs are
      not_measured, and it is never a pass.
    heuristic_status_recorded_precisely_and_the_two_frozen_texts_reconciled: >-
      HEUR-INSTR-2 IS NOT VALIDATED AT 12, 24 OR 48 SEEDS. That is the whole of what
      the measurement supports and it is permanently citable as such. TWO FROZEN
      TEXTS DISAGREE ON THE WORDING AND THE DISAGREEMENT IS RECORDED RATHER THAN
      SILENTLY RESOLVED: specification.yaml falsification_criterion F4 says
      "(HEUR-INSTR-2 refuted)", while amendment v1 change G3 E3 says "HEUR-INSTR-2 is
      not validated at 48 seeds". THE NARROWER READING IS ADOPTED AS THE READING OF
      RECORD -- not validated at the tested seed counts -- because AGENTS.md rule 6
      confines negative evidence to the exact tested scope, and because the two
      readings prescribe the identical action, which is what actually happened: the
      work stops and the Coordinator is told. HEUR-INSTR-2 is a numbered heuristic
      and not a ledger hypothesis, so no hypothesis status moves either way.
    refutation_artifact_basis: >-
      DECLARED RATHER THAN LEFT IMPLICIT (docs/claims-and-verification.md,
      "Refutation artifacts"). The basis for "HEUR-INSTR-2 not validated at the
      tested seed counts" is `empirical_only`: one valid, unreplicated run at one
      prime. A derivation note accompanies it -- the nested-ladder noise arithmetic
      above -- but that note supports the COMPETING reading, that the failure is
      what the ladder had to produce, so it is not a refutation certificate for
      anything. NO `reject_scoped` VERDICT IS RECORDED ON HEUR-INSTR-2, HEUR-INSTR-3
      OR ANY HYPOTHESIS: a scoped rejection on a single unreplicated empirical-only
      run is forbidden, and the correct response is exactly the one taken -- a
      narrow non-validation plus independent review plus, if approved, replication
      at longer rungs.

  adjudication_item_2:
    verdict: >-
      CONFLICT-1 IS CLOSED. THE TWO INSTRUCTIONS ARE NOT IN CONFLICT: THEY GOVERN
      DIFFERENT OBJECTS. The standing control governs NEW MEASUREMENT ARMS. The
      frozen contract's characterisation_procedure governs RE-MEASUREMENT OF A NAMED
      HISTORICAL BASELINE. The Executor's action -- follow the contract, use the
      reference run's own sampler, add no undeclared arm, declare the conflict
      before measuring -- WAS CORRECT and is affirmed. The defect was in the
      Coordinator's own wording of the standing control, which did not distinguish
      the two objects; that defect is repaired below and it is a defect in a
      Coordinator artifact, not in the run.
    reasoning: >-
      A REPRODUCTION CONTROL THAT SUBSTITUTES A DIFFERENT SAMPLER IS NOT A
      REPRODUCTION. The estimand of the SR3 v3 characterisation is definitionally
      "the sampling distribution of the variance-ratio statistic UNDER THE REFERENCE
      RUN'S OWN PROCEDURE at the reference run's own parameters". Swapping
      targets_uniform for targets_B does not measure that quantity more honestly; it
      measures a different quantity and then calls it the reference run's
      distribution. C-SELF-CONSISTENCY -- "a faithful re-measurement of the
      reference run at its own parameters compared against its own interval" --
      would become vacuous, because the re-measurement would no longer be faithful
      to the run it re-measures. The purpose the gate serves is ADMISSIBILITY:
      whether a candidate successor run reproduces the historical baseline. Whatever
      sampler that baseline used, a reproduction check must use it or it is not
      checking reproduction. If the campaign later concludes the targets_uniform
      estimand is worthless, THE CORRECT RESPONSE IS TO RETIRE THE BASELINE AND THE
      GATE, not to re-measure the baseline through a different sampler and present
      the result as the baseline's own distribution.
      The standing control exists for a different purpose and that purpose is
      untouched: DEC-20260810-a4bec4 introduced it so that NEW measurement arms do
      not inherit a disputed estimand -- "the contract must not and does not presume
      that hypothesis true or false, it simply does not reuse the disputed sampler".
      Declining to reuse a disputed sampler for a new measurement, and faithfully
      re-measuring a historical run that did use it, are compatible acts.
    scope_limits_binding_and_narrow: >-
      SCOPED EXPLICITLY AND NARROWLY, AS THE ADJUDICATION REQUIRES.
      (1) NOTHING MEASURED THROUGH targets_uniform MAY SUPPORT ANY WITHIN-CLASS
      CLAIM, in either direction, at any scale. It may support no between-class
      claim, no over-dispersion claim, no curve-side claim and no ECDLP claim
      either. Its only admissible use is admissibility itself.
      (2) THE REPRODUCED BASELINE INHERITS H-ICINV-6c7920's DISPUTE WHOLESALE. That
      hypothesis stays `specified` and is neither presumed true nor false. If it is
      later supported, then the reference run's reported over-dispersion, the per-row
      sampling distribution characterised here, the interval derived from it and the
      entire SR3 v3 gate built on it are artifacts of the sampler, and the gate
      certifies reproduction of a historical artifact and nothing more. THAT SENTENCE
      TRAVELS WITH EVERY CITATION OF THIS GATE, alongside the G2 named cost that a
      pass is not evidence of no regression below the gate's detection floor.
      (3) THIS ADJUDICATION LICENSES targets_uniform ONLY INSIDE A RE-MEASUREMENT OF
      A NAMED HISTORICAL REFERENCE RUN, at that run's own frozen parameters, for the
      sole purpose of characterising that run's own sampling variability or checking
      reproduction of it, AND NOWHERE ELSE IN THIS CAMPAIGN. Every new measurement
      arm in EXP-JINV-bd141d, EXP-VOLC-9f5571, EXP-INSTR-36c8cf Phase B and any
      successor of EXP-ICINV-4d33aa uses targets_B.
      (4) A CONSEQUENCE FOR THE UNWRITTEN EXP-ICINV-4d33aa AMENDMENT v3, STATED HERE
      AS A REQUIREMENT ON THAT FILE AND NOT AS AN EDIT TO A PAUSED CONTRACT: the arm
      whose per-row variance ratio is compared against this baseline interval must
      itself be measured under the reference run's sampler, or the comparison is
      between two different estimands and the gate means nothing. A successor run of
      EXP-ICINV-4d33aa therefore carries a targets_uniform REPRODUCTION arm as an
      admissibility control while its MEASUREMENT arms use targets_B. Whoever
      authors amendments/v3.yaml must state this explicitly. NOTHING HERE UNPAUSES
      THAT LANE.
    what_the_rejection_route_would_have_cost_recorded_because_it_was_considered: >-
      THE ALTERNATIVE WAS EXAMINED AND REJECTED ON ITS CONSEQUENCES, NOT DISMISSED.
      Had this Coordinator ruled the standing control supreme, the SR3 v3 gate would
      have to re-measure something other than the reference run -- a targets_B
      characterisation at the same thirteen rows -- and it would then gate NOTHING
      about the run it was built to gate: a targets_B interval cannot certify that a
      candidate reproduces a targets_uniform baseline, so the entire reproduction
      control would be replaced by an unrelated measurement wearing its name. That
      is a worse outcome than a narrowly-scoped, explicitly-disputed reproduction,
      and it would also void the user's selected gate replacement without the user
      selecting anything.

  standing_control_restatement_v2: >-
    SAMPLER CONTROL, VERSION 2. THIS SUPERSEDES THE WORDING "targets_B
    (harness/exp_icinv_fullgroup.py), NEVER targets_uniform" WHEREVER IT APPEARS IN
    A GOAL-ENDO-001 DISPATCH ENVELOPE, HANDOFF OR TASK CARD FROM THIS DECISION
    ONWARD. IT EDITS NO COMMITTED RECORD: DEC-20260810-a4bec4 and every handoff
    already committed stand exactly as written, and this restatement supersedes them
    by reference in the way every correction in this campaign does. It must be
    transcribed VERBATIM into every future dispatch envelope in this campaign that
    draws a target.

    (a) EVERY NEW MEASUREMENT ARM USES exp_icinv_fullgroup.targets_B. targets_uniform
    is PROHIBITED for any new measurement arm, at any density row, in any contract of
    this campaign.

    (b) EXACTLY ONE EXCEPTION, AND IT IS NOT A LICENCE. A RE-MEASUREMENT OF A NAMED
    HISTORICAL REFERENCE RUN, at that run's own frozen parameters, for the sole
    purpose of characterising that run's own sampling variability or checking
    reproduction of it, USES THE REFERENCE RUN'S OWN SAMPLER, identified at run time
    from that run's own record and never assumed. Substituting a different sampler
    makes the object a different estimand and makes the reproduction check vacuous.

    (c) ANYTHING MEASURED UNDER (b) IS AN ADMISSIBILITY QUANTITY ONLY. It may not
    support any within-class, between-class, over-dispersion, curve-side or ECDLP
    claim in either direction, and it inherits the H-ICINV-6c7920 dispute wholesale:
    if that hypothesis is later supported, every quantity measured under (b) is an
    artifact of the sampler and any gate built on it certifies reproduction of a
    historical artifact and nothing more.

    (d) THE r-STRATIFICATION HALF OF THE CONTROL IS UNCONDITIONAL. Every measurement
    is stratified on r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported
    wherever a target is drawn, under (a) and (b) alike. That reporting gates
    nothing.

    (e) AN EXECUTOR THAT FINDS AN ENVELOPE AND A FROZEN CONTRACT IN CONFLICT
    DECLARES THE CONFLICT BEFORE ANY MEASUREMENT, FOLLOWS THE FROZEN CONTRACT, ADDS
    NO UNDECLARED ARM, AND LEAVES THE ADJUDICATION TO THE COORDINATOR. That is what
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a did and it is correct.

