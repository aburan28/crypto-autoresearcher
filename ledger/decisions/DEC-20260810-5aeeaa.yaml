  rationale:
    - >-
      VALIDITY BEFORE INTERPRETATION, PERFORMED DIRECTLY AGAINST THE RUN ARTIFACTS
      AND NOT DELEGATED TO THE EXECUTION REPORT. See
      validity_check_performed_before_any_interpretation above. The run set is
      complete, schema-complete, seed-faithful, raw/summary-consistent and
      control-comparable, so it is interpreted rather than returned.
    - >-
      THE RUN IS VALID AND ITS F4 FIRING IS A RESULT OF THE PROTOCOL, NOT OF THE
      MATHEMATICS. Two Coordinator-set numbers in change G3 -- the seed ladder
      12/24/48 and the 5% rung-to-rung threshold -- were not jointly satisfiable,
      and the corrected nested-ladder arithmetic puts the probability of meeting the
      rule at the 24->48 transition at about 1.2e-4. The Executor stopped, widened
      nothing, gated nothing and accepted no interval. That is the correct behaviour
      and it is affirmed as correct.
    - >-
      ITEM 1 IS ADJUDICATED BY EXTENDING THE PRECISION LADDER UNDER AN AMENDMENT
      THIS SESSION FILES AND DOES NOT APPROVE. The 5% rule, the coverage 259/260,
      the family-wise target 0.05, the mean +- z*sd estimator and SR4 NO WIDENING
      are all untouched. Relaxing the 5% rule to fit the observed 23.5% would be
      exactly the hull-fitting this redesign exists to prevent and is refused.
    - >-
      THE FREEZE QUESTION IS ANSWERED EXPLICITLY AND CONDITIONALLY, NOT ASSERTED.
      Extending a ladder is not widening an interval PROVIDED the acceptance region
      is untouched, there is no visible candidate datum to fit toward, the amendment
      is filed before the data it governs exists, and the ladder terminates at a
      declared rung with its terminal outcome declared in advance. Without the last
      condition the extension would be optional stopping and would be forbidden;
      amendment v2 makes it binding.
    - >-
      THE ARITHMETIC OFFERED AS INPUT WAS CHECKED AND IS PARTLY WRONG. Its first
      value is exact under an independent-sample model; every later value is
      attached to the next doubling rather than its own, understating the expected
      change; and the independent-sample model itself overstates a NESTED ladder's
      expected change by a factor of sqrt(3). The two errors partly cancel, its
      conclusion survives, and this decision uses the corrected nested figures alone.
    - >-
      ON THE MECHANISM THIS DECISION IS INCONCLUSIVE AND SAYS SO PLAINLY. The run
      cannot discriminate ordinary standard-deviation noise from a right-skewed or
      heavy-tailed per-row sampling distribution, and the two prescribe different
      repairs -- more seeds versus a different estimator. Two rows at rung 3 have
      their own extreme outside their own fitted interval, both on the upper side,
      against 2.4 expected under the Gaussian rule; that is consistent in count,
      one-sided in pattern, proves nothing alone, and is exactly what HEUR-INSTR-3
      was declared to be weakest about.
    - >-
      THIS SESSION MAY FILE THE AMENDMENT AND MAY NOT APPROVE IT, ON THE CAMPAIGN'S
      OWN PRECEDENT. The repaired parameter is COORDINATOR-SET and the repair rests
      on an attribution a validator can overturn -- the same two conditions under
      which EXP-ICINV-4d33aa amendment v2 was held unapproved pending two
      independent validations. The next dispatch is therefore review, not compute.
    - >-
      ITEM 2 IS ADJUDICATED IN FAVOUR OF THE CONTRACT BECAUSE THE TWO INSTRUCTIONS
      GOVERN DIFFERENT OBJECTS. A reproduction control that substitutes a different
      sampler is not a reproduction; it characterises a different estimand and makes
      C-SELF-CONSISTENCY vacuous. The standing control governs new measurement arms
      and its purpose -- not letting a new measurement inherit a disputed estimand --
      is untouched.
    - >-
      THAT LICENCE IS SCOPED AS NARROWLY AS IT CAN BE STATED. Nothing measured
      through targets_uniform may support any within-class or curve-side claim in
      either direction; the reproduced baseline inherits H-ICINV-6c7920's dispute
      wholesale and that sentence travels with every citation of the gate; and
      targets_uniform is licensed ONLY inside a re-measurement of a named historical
      reference run and nowhere else in this campaign.
    - >-
      THE AMBIGUITY WAS A DEFECT IN A COORDINATOR ARTIFACT AND IS REPAIRED AS ONE.
      The standing control is restated in five clauses that separate new measurement
      arms from historical re-measurement, keep r-stratification unconditional, and
      tell the next executor exactly what to do when an envelope and a frozen
      contract disagree. It supersedes by reference and edits no committed record.
    - >-
      CLAIM DISCIPLINE, APPLIED UNIFORMLY. claim_tier toy on every record archived
      by this decision. NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta ZERO on every
      axis; dominated_by parallel Pollard rho with distinguished points at
      0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006) and,
      on CM curves, its automorphism-discounted variant (KN-TECH-018), under which
      any factor at or below sqrt(6), about 2.449, is BASELINE CALIBRATION and never
      an attack. Every figure is scoped to the committed p = 4001 trace-30 class of
      138 curves at about 12 bits, at T = 400, at the thirteen frozen factor-base
      rows, under this solver and this budget, and transfers to no other geometry.
      NO CURVE-SIDE CONCLUSION OF ANY KIND IS MADE.
    - >-
      STANDING CONSTRAINTS, NONE OF THEM MOVED BY THIS DECISION. H-INSTR-444c7b
      stays `specified`. H-ICINV-d5e351 stays `specified`. H-ICINV-6c7920 stays
      `specified` and is NEITHER PRESUMED TRUE NOR PRESUMED FALSE. H-ENDO-001 remains
      `approved` and is used as the admissibility filter, not retested. H-STR-002
      remains `weakened` with DEFER-BATCH009-001 OPEN, and pause condition P2 is
      respected: this contract builds no equivariant factor base and tests no
      phi-stable structure, so nothing here bears on H-STR-002 in either direction.
      KN-FIND-b7e091 remains binding and unrevisited. PAUSE CONDITION P1 IS NOT
      TRIGGERED: no instrument has failed a two-directional control, because no
      (statistic, geometry, density row) cell has been characterised in either
      direction. EXP-ICINV-4d33aa STAYS PAUSED and nothing here unpauses it.
    - >-
      NO COMPLETION CRITERION IS MET AND C4 IS EXPLICITLY NOT DISCHARGED. Not one
      cell has a measured detection floor or a measured matched-null false-positive
      rate; no SR3 v3 interval was accepted at either prime; blockers B1 and B2 stand.
      C1, C2 and C3 are untouched. NO ATTESTATION IS RECORDED AND NO CLOSURE QUORUM
      IS GATHERED OR CLAIMED; none is required, since nothing here closes a goal.

