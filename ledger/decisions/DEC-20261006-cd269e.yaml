  context: >-
    /design-experiment, one contract, for IDEA-20261005-c94831. No
    hypothesis and no experiment on origin/main cites it. The checked
    design pull requests 1898, 1897, and 1896 do not cite it in a
    hypothesis or an experiment. Pull request 1876 carries the proposal
    file and designs a different experiment. The branch
    design/ssi-c94831-f121 was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The contract square-tests y^2 = x^3 + 1 over F_11 and over F_121.
    The prediction is exactly 144 points over F_121, including infinity.
    Any other count is a negative, so success can fail. The control
    equation y^2 = x^3 + x + 2 is pre-registered at 16 and 128. The
    F_11 count 12 is the trace-0 reading the idea calls supersingular.
    That criterion is assumed from the idea and is not re-proved. No
    Cartier-Manin matrix is computed. No isogeny path is walked. No
    exponent improvement is claimed.

    This session opened ledger/questions/RQ-SSI-001.yaml and the
    frontier rows KR-RHO-13bf67, KR-RHO-53c89f, KR-RHO-755e35,
    KR-RHO-0528e7, and KR-RHO-fbd7b1. It read IDEA-20261005-c94831 from
    origin/design/pair-3a18d1-hcp via git show and did not copy that
    file. The squares of F_11 were listed from the residues 0 through 5
    while writing the modulus identity. No point of either curve was
    enumerated. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, the lexicographic seed, replication,
    budget, stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A count of S(F_121) other than 144 is a negative.
    - Two square-test methods, the modulus identity, and the control equation give the count a way to come back invalid rather than as a false 144.
    - Success is only the first assignment row, so success can fail.
    - Supersingularity is not a second measured claim. The count is the measured claim.
    - No point of either curve was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: two equations, q = 11, n = 2. No transfer to CSIDH, CGL path-finding, SQIsign, or a cryptographic prime.
    - The trace recurrence is the source of the integer 144. It is not the counter.
    - The supersingularity label is the idea's name for trace 0. This decision does not re-prove it.
    - This decision authorizes a later run. It does not start one.

