  # =======================================================================
  the_p3_anti_leak_design_which_is_the_most_consequential_thing_in_this_control_plane:
    the_hazard_stated_exactly: >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md LINES 234-238 ARE A PER-FIELD-SIZE
      TABLE, AND ONE OF ITS ROWS IS KEYED TO THE FIELD SIZE THIS CAMPAIGN'S RECORDS CALL
      P=512 AND CARRIES AN OPERATIONS COUNT AND A MEMORY BOUND. The standing citation
      prohibition governs the `P=512` crossover value and its `w=2^80` sign, and its
      predicate extension governs reconciliation rows; that row is the ANCHOR from which
      this campaign's governed crossover at that field size is derived, and the anchor
      disagreement at that field size is the very thing the prohibition exists about.
      THIS BATCH THEREFORE TREATS THE NUMERIC CONTENT OF LINES 234-238 AS GOVERNED.
    how_the_hazard_was_established_and_by_whom: >-
      REPORTED TO THE AUTHORING TASK BY THE DISPATCHING SESSION, WHICH OPENED THE LINES
      ITSELF AND CONFIRMED THE FILE EXISTS AND IS READABLE. THE AUTHORING TASK DID NOT
      OPEN THEM AND DELIBERATELY DID NOT, on the ground that the confirmation is P-3's to
      make and that every additional reader of a governed row is an additional leak
      surface for no gain. THAT IS AN ATTRIBUTED REPORT AND NOT THIS TASK'S OWN
      MEASUREMENT. It is used only to establish the SHAPE of the hazard, which is not a
      governed value.
    the_discriminating_sentence_which_every_relevant_card_carries_verbatim: >-
      CONFIRMING THAT THE LOCATOR RESOLVES, THAT THE BLOCK HAS THE DECLARED SHAPE, AND
      THAT IT IS WHERE clause_3 SAYS IT IS, IS NOT THE SAME AS CITING WHAT IT SAYS AT
      512. The first is a fact about a POINTER. The second is the governed CONTENT. P-3
      buys the first and is absolutely forbidden the second.
    three_permitted_outputs_and_one_absolute_prohibition: >-
      PERMITTED 1, RESOLUTION - the file exists, its total line count, that lines 234-238
      exist and are non-empty, and the block's byte length. A line count and a byte length
      are facts about a file, not values of a table. PERMITTED 2, SHAPE - a CLOSED,
      PRE-DECLARED PREDICATE LIST S1 through S7 answered as BOOLEANS AND COUNTS ONLY, with
      no quotation of any line containing a digit, with S4 a PRESENCE BOOLEAN for the
      P=512 row and never its contents, and with any unanswerable predicate reported
      `WANTED AND NOT ANSWERED` rather than invented. PERMITTED 3, BINDING BY DIGEST - a
      sha256 over the exact five-line block and a sha256 over the whole file, each with the
      exact command that produced it and with the fact that the command EMITS ONLY THE
      DIGEST. A DIGEST BINDS THE BLOCK WITHOUT CARRYING IT, and it lets the enacting
      decision re-confirm the same object without either party restating a value - CF-17's
      rule applied to a governed block. FORBIDDEN ABSOLUTELY - transcribing, paraphrasing,
      rounding, ordering, bucketing, ranging, comparing, unit-converting or partially
      quoting ANY numeric content of those five lines, in any artifact, in any return
      message and in any commit message; no operations count, no memory bound, no exponent,
      no ratio, no relation between two of them, no statement of which row is largest; and
      no digit from the block other than the line numbers themselves and the counts S3 and
      S5 require. Naming the field size 512 is permitted ONLY as the locator label already
      published in committed records and NEVER adjacent to anything read out of the block.
    the_command_shape: >-
      WHERE A SHELL IS HELD, A DIGEST OR A COUNT IS OBTAINED BY A COMMAND THAT PRINTS ONLY
      THE DIGEST OR THE COUNT - piped directly into the hash, or emitted from a predicate
      script written outside the repository - AND NEVER BY PRINTING THE BLOCK AND THEN
      HASHING WHAT WAS PRINTED. The agent will still READ the block, because it must to
      answer S2 through S7, and reading is permitted; what is forbidden is putting the
      content anywhere that persists.
    the_negative_control_that_makes_no_leak_a_CHECKED_RESULT: >-
      A DIGIT SCAN OVER THE PRODUCER'S OWN ARTIFACTS, classifying every digit run as
      exactly one of a line number, an identifier, a date, a version, a count S3 or S5
      requires, or a digest fragment. AN UNCLASSIFIABLE RUN IS A STOP - the task halts,
      reports it, writes nothing further and returns the object to the Coordinator. AND THE
      SCAN ITSELF IS CONTROLLED: it must be exercised on the synthetic string
      `SYNTHETIC-LEAK-PROBE 1234.5678` written outside the repository, and IT MUST FIRE.
      The snapshot archive READS BOTH SCAN VERDICTS BEFORE IT STAGES ANYTHING, because a
      leaking artifact committed is permanent, and the reviewer RE-RUNS the scan
      independently at J4.
    what_this_design_does_not_close_and_it_is_declared: >-
      AN AGENT WILL HOLD THE GOVERNED ROW IN ITS CONTEXT AND NO TOOL CAN CHECK WHAT AN
      AGENT SAW. What is checkable is what it WROTE. THIS DESIGN IS WEAKER THAN NOT LOOKING
      IN EXACTLY THAT ONE RESPECT, and it is stated rather than left for a reader to notice.
      What it replaces is four consecutive rounds of not looking at all - defensible each
      time, and a habit by the fifth.
    p2_carries_the_same_rule_for_its_own_smaller_surface: >-
      Clause_2's THIRD invariant is about a crossover and the record P-2 opens may carry a
      numeric table. P-2 answers all three invariants AS FORM QUESTIONS, evaluates nothing
      at any field size, records only a table's SHAPE and a P=512 presence boolean if one
      exists, transcribes no entry, and files its own leak scan under the same closed
      classification list and the same synthetic positive control. WHERE AN ANSWER WOULD
      REQUIRE A GOVERNED SIGN, THE CORRECT OUTPUT IS THE STATEMENT THAT IT WOULD, NEVER THE
      VALUE - RT-2's antecedent `A > 0` IS the governed sign, and two independent sessions
      reached exactly that point in BATCH-314308 and both output the statement.

  # =======================================================================
  citation_boundary:
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
      This task does not lift that prohibition. Only a committed Coordinator decision on
      independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation is
      NOT citation-eligible when either (a) the two anchors disagree in the SIGN of the
      baseline comparison at that row, or (b) the smaller |margin| across the two anchors
      at that row is below that field size's anchor gap |Delta log2 T_full + Delta log2 M
      / 2|.
    ruling: RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT WIDENED BY THIS DECISION, AND NO TASK OF THIS BATCH MAY LIFT EITHER LIMB.
    this_is_the_seventh_consecutive_retention: >-
      DEC-20260904-166ab5, DEC-20260904-4c81b6, DEC-20260905-5f5592, DEC-20260905-3b8e94,
      DEC-20260906-408595, DEC-20260906-f709b2, and now this decision. AN OPENING DECISION
      DOES NOT LIFT AND DOES NOT PRE-DECIDE: only the closing decision may reason the
      question, and it must reason it AFRESH FOR THAT ROUND rather than inherit an answer.
      THE REPETITION IS ITSELF A REASON TO REASON IT AFRESH.
    why_this_batch_binds_harder_than_any_predecessor: >-
      BECAUSE FOR THE FIRST TIME A TASK OF THIS CAMPAIGN IS REQUIRED TO OPEN THE BLOCK THE
      GOVERNED VALUE SITS ON. Every previous round declined the read on scope grounds and
      the prohibition was never under real load. IT IS NOW. That is new information about
      the prohibition and the closing decision is required to reason about it rather than
      skip it - whether it makes the prohibition more live or less is a question, not an
      answer.
