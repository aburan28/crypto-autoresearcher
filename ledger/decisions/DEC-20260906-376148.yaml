  # =======================================================================
  the_five_design_decisions_this_batch_took_and_records_either_way:
    D-1_p1_is_produced_by_a_dedicated_task_and_reviewed_on_scope_only:
      what_was_decided: >-
        THE RULING IS AUTHORED BY A DEDICATED COORDINATOR TASK, NOT INSIDE THE LEDGER
        ARCHIVE, AND IT IS REVIEWED HERE ON SCOPE AND ANCHORING ONLY. The reviewer
        owns J1 and J2 over it and is FORBIDDEN to attack its merits.
      why_a_dedicated_task: >-
        A ruling composed inside an archive already composing a round, checkpointing a
        goal and writing a receipt is a paragraph, not an object, and P-1's whole
        value is that the enacting producer has an OBJECT to attack. A ruling authored
        by the ledger archive would also be read by NOBODY before it was committed,
        which is the exact defect DEC-20260906-6a620e recorded about enacting
        decisions composed in the task that first reads the material.
      why_the_merits_are_not_attacked_here: >-
        BECAUSE THE MERITS ATTACK IS WHAT P-1 EXISTS TO BUY FOR SOMEBODY ELSE.
        DEC-20260906-f709b2 P-1 requires the ruling committed before the enacting
        batch's producer runs "so that the producer can ATTACK the ruling rather than
        supply its material". A full merits review here would spend that attack in
        advance, in the same session and model family as the author, with blindness
        lifted - buying correlated agreement and handing the enacting producer an
        object that had already absorbed the cheapest objections, so its later
        "nothing found" would carry LESS information. THE ASYMMETRY IS DELIBERATE AND
        IT IS THE POINT.
      what_is_checked_here_instead_and_why_it_is_this_batchs_business: >-
        CONTAINMENT. A ruling that over-reaches would corrupt the checkable set the
        enacting batch is supposed to open against, which IS this batch's business,
        and a ruling that settles LESS than RT-4's licensing question produces no
        object to attack at all. Both directions are checked at J1.
      the_cost_stated_plainly_and_not_argued_away: >-
        NOBODY IN THIS BATCH CHECKS WHETHER THE RULING IS CORRECT. That cost is
        accepted knowingly and a successor must not read the J1 and J2 verdicts as any
        endorsement of the ruling's substance. The reviewer is required to record that
        it withheld a merits objection IF IT HAD ONE, without stating its content, so
        the enacting producer knows a first reader had one.
      the_only_control_the_ruling_can_have: >-
        OBJ-D, THE COUNTERFACTUAL. The ruling must name at least one committed
        artifact that, had it read differently, WOULD HAVE FORCED THE OTHER POSITION,
        and the reviewer must OPEN it and ask whether it bears. A RULING THAT CANNOT
        NAME WHAT WOULD HAVE CHANGED IT HAS RESTATED RATHER THAN RULED, and that is a
        BREAK.
    D-2_p2_and_p3_are_two_tasks_on_a_containment_ground:
      what_was_decided: TWO TASKS, NOT ONE.
      the_reason_that_decided_it: >-
        P-2 HAS ITS OWN LEAK SURFACE AND IT IS NOT THE ONE ANYBODY EXPECTS. Clause_2's
        THIRD invariant is about a CROSSOVER, and the record P-2 opens states a
        corrected model with a `crossover` key. So the split cannot be justified as
        "P-3 has a leak profile and P-2 does not"; BOTH DO. What the split BUYS is that
        the agent which opens the governed anchor block NEVER opens the charging-law
        record, and the agent which reasons about the charging law and its crossover
        form NEVER opens the block. NEITHER ARTIFACT CAN CARRY THE OTHER'S GOVERNED
        CONTENT BECAUSE NEITHER AGENT CAN READ IT. That is a structural property of the
        read scopes, not a promise about behaviour.
      the_cost: >-
        Two agents, two receipts, two leak scans, one more joint for the reviewer. And
        the coupling this batch could not avoid - ONE snapshot archive owns all three
        producers, so a STOP on any one leaves ALL THREE packages unarchived. Six
        identifiers cannot express three separate snapshot archives alongside three
        producers, a reviewer and a ledger archive. THE MITIGATION IS THE ORDERING:
        the highest-hazard producer runs FIRST at `max_concurrent` 1, so the likeliest
        stop is also the cheapest.
    D-3_the_blind_policy_is_NONE_and_cf_15s_first_limb_is_owed_for_a_fourth_batch:
      what_was_decided: >-
        NO BLIND PHASE. No `blind_phase_hygiene` block, no `protected_sha256` map, and
        `blind_rederivation.required` is deliberately false.
      ground_1_the_mechanism_describes_something_this_batch_does_not_have: >-
        `blind_rederivation` NAMES AN AGENT RE-DERIVING A QUANTITY ANOTHER AGENT
        PRODUCED while blind from that agent's implementation - the tool's own guidance
        is to name the producer's implementation, notes and report - and `assigned_to`
        must name an agent that FILES a review_attestation whose declared
        `sources_read` is then compared with `blind_from`. NO AGENT OF THIS BATCH
        RE-DERIVES ANOTHER AGENT'S OUTPUT. The only candidate is the reviewer, which
        does re-derive the P-3 digest and the seven shape predicates - but it MUST READ
        every producer artifact because they are its object, so any `blind_from` naming
        them collides with an honest `sources_read`. THAT IS THE IDENTICAL MECHANICAL
        COLLISION BATCH-314308 RECORDED, and it survives this batch's different shape.
      ground_2_and_it_is_the_one_that_actually_decided_it: >-
        THIS BATCH DOES HAVE A REAL FILE-LEVEL SEPARATION - the mutual containment
        between the P-2 and P-3 readers - AND IT WAS TEMPTING TO DECLARE IT AS
        `blind_rederivation` PURELY TO OBTAIN THE MECHANICAL sources_read CHECK. THAT
        WAS CONSIDERED AND REFUSED. `quantity` would have had to describe a
        re-derivation that does not exist, and PUTTING A FALSE DESCRIPTION INTO A FIELD
        A TOOL READS, SO THE TOOL RETURNS GREEN, IS ONE NOTCH FROM THE
        MISLABELLED-CONTROL DEFECT THIS CAMPAIGN HAS NOW FOUND SIX TIMES - CF-21's
        AC-1, CF-13's AC-4 pattern that can never fire, and the shape-only parse
        control that would have passed on the file it exists to detect the amendment
        of. THE CHECK IS REAL; THAT IS THE WRONG FIELD FOR IT. It is taken at reviewer
        joint J5 instead, and a reviewer joint IS WEAKER THAN A TOOL and is declared as
        weaker.
      ground_3_this_control_plane_could_not_arm_the_hygiene_map: >-
        `blind_phase_hygiene.protected_sha256` declares protected values BY HASH, and
        THE AUTHORING TASK HELD NO SHELL - it cannot compute a sha256 and may not
        invent one. A blind-phase declaration whose hygiene map is empty announces a
        protection that protects nothing, and a declaration that protects nothing
        teaches every later reader to skip the one that does.
      the_consequence_recorded_rather_than_faded: >-
        CF-15's FIRST LIMB - naming the launching prompt as a protected channel INSIDE
        a blind-phase declaration - IS NOW OWED FOR A FOURTH BATCH. `--blind-history`
        is NOT APPLICABLE, MUST NOT be run or recorded, and an UNCHECKABLE from it
        would be CORRECT rather than a defect. THIS BATCH CAME CLOSER THAN ANY
        PREDECESSOR AND FELL SHORT AT A NAMED PLACE, which is worth more to a successor
        than another bare deferral: it HAS a genuine, non-colliding file-level
        separation between two agents, which the previous three batches did not, and
        what it lacks is a QUANTITY one agent re-derives from another and a session
        with a shell to arm the map before dispatch. THE OBJECT THAT WOULD CREATE ONE
        IS NAMED EXACTLY at batch.yaml no_blind_phase and the quantity at
        review_plan.yaml blind_rederivation.quantity_if_it_were_required - the P-3
        block digest and the seven shape predicates, placed in their OWN FILE so
        `blind_from` can name it without colliding with an honest `sources_read`.
      what_replaces_it_and_all_of_it_is_weaker: >-
        THREE THINGS, EACH DECLARED AS WEAKER RATHER THAN DESCRIBED AS EQUIVALENT. (i)
        THE READ-SCOPE CONTAINMENT, armed in dispatch_queue.json and checked at J5 by a
        reviewer reading declared `sources_read`. (ii) THE ATTESTED ORDERING at J5. (iii)
        A PROHIBITION ON SPEAKING ACROSS THE SEPARATION AT LAUNCH, which is closed by NO
        TOOL AT ALL and rests on the dispatching session's own disclosure.
    D-4_cf_28_is_not_supplied_by_this_batch_and_is_carried_with_a_named_object:
      does_this_batch_supply_it: 'NO.'
      why_not_and_it_is_a_reason_rather_than_an_omission: >-
        TWO GROUNDS. (1) THIS BATCH RUNS NO ACT-ANALYSIS PROCEDURE AT ALL. It produces
        one ruling and two confirmations; none is an analysis of what a record would DO
        if enacted, so there is no procedure here whose SPECIFICITY CF-28's object
        would test. Supplying the object into a batch that cannot use it would buy
        nothing and would create the appearance of a discharge. (2) SUPPLYING IT WOULD
        REQUIRE AUTHORING A REAL, APPLICABLE PROPOSED ACT ON A DIFFERENT ARTIFACT
        PURELY AS A CONTROL - a live proposal the campaign does not want, would have to
        dispose of, and would have created for instrumental reasons. THAT IS INVENTING
        WORK, and a proposed act created to be a control is a worse object than no
        control.
      the_cheapest_honest_object_a_successor_can_use_named_so_the_carry_is_not_ceremonial: >-
        THE NA-3 SUCCESSOR RECORD THIS CAMPAIGN ALREADY OWES IS EXACTLY CF-28's OBJECT,
        AT ZERO EXTRA COST. DEC-20260906-f709b2 NA-3 requires one successor record
        carrying AF-5, AF-7, F-J1-1, F-J3-1, F-J3-2, F-J4-1, CF-25's V-1, V-2 and V-3
        and CF-26's V-4 and V-5. When it is written it will be A REAL, APPLICABLE
        PROPOSED ACT ON A DIFFERENT ARTIFACT than the redraft - so "this is a live
        proposed act" is KNOWN TRUE of it - while the redraft's own act-findings are
        KNOWN FALSE of it. THE NEXT BATCH THAT RUNS AN ACT-ANALYSIS PROCEDURE SHOULD USE
        IT AND SHOULD NOT COMMISSION A CONTROL RECORD OF ITS OWN.
      what_this_batch_does_instead: >-
        IT DOES NOT LEAVE THE ENTAILED-CONTROL LESSON UNAPPLIED. A batch of three
        confirmations is the shape MOST exposed to a check whose pass is entailed by its
        own construction, because "confirm that X" invites "confirmed". FIVE CONTROL
        OBJECTS ARE DECLARED IN ADVANCE - OBJ-A known-absent key paths for P-2, OBJ-B a
        wrong-shape line range and OBJ-C a non-resolving locator for P-3, OBJ-D the
        counterfactual for P-1, and OBJ-E a synthetic positive control that the leak scan
        MUST FIRE ON - each with what the procedure MUST DO and each with a BREAK
        condition. A leak scan that never fires is not a scan; a shape predicate true of
        any five lines is vacuous; an existence check that reports a probe present would
        report anything present.
    D-5_maximum_runs_is_zero_on_every_task:
      what_was_decided: >-
        `maximum_runs: 0` ON EVERY TASK, where BATCH-314308 used 4, 1, 4 and 1.
      why: >-
        A TIGHTENING, DELIBERATE, AND NOT AN OVERSIGHT. `declares_zero_compute` in
        tools/research_dispatch.py accepts it, and 0 IS THE HONEST BOUND: nothing in
        this batch executes experiment code, a producer implementation, or anything
        that writes a run record. Reading a committed record, yaml.safe_load, computing
