        held core are unchanged; a new identifier would re-point
        DEC-20260924-124667 NA-5, the HOLD-F and HOLD-G condition and every
        bus pointer that names EXP-NISTBIN-451dfa; and the dispatcher has
        verified the layout through three versions. (b) The cost that matters
        is C8 over a layered hypothesis: C8 broke in the version-2 round on a
        carried v1 or v2 field and in the version-3 round on a version_3
        block field. This decision answers that cost directly with DI-INDEX
        (an in-force index of every earlier field, owned structurally by J7
        and used by J1) rather than by a form change, because a form change
        would not remove any of the version-3 defects, which sit in the
        specification and the audit sheet as much as in the hypothesis.
        Cost, stated plainly: the hypothesis gains a fourth layer, and J1
        must read four layers. The plan's K-revise-defect STRUCTURAL DUTY
        tells the composer to name the superseding form as the remedy if C8
        breaks a third time on the layering.
