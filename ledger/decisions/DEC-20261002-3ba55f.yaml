      why_not_the_superseding_set: >-
        The pre-minted H-NISTBIN-039327 and EXP-NISTBIN-155759 would allow a
        superseding record set. It is not taken now. (a) 353743 NA-1 names
        R-FORM extended as the default, and the reasons of 0983f2 R-FORM (a)
