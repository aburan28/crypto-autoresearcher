  knowledge_promotion:
    promoted:
      - KN-OPEN-2c095b
    promoted_detail: >-
      KN-OPEN-2c095b, "Is the multiplicative-order deficit of a curve-derived
      lambda a fact about CM arithmetic or a fact about small integers?" -- the
      precisely statable unknown this decision exposes. It is warranted because
      the unknown is exact, cheap to test, and load-bearing: HEUR-ORD-1 is stated
      against a uniform-unit null, while T3 pins the curve-derived lambda to a
      window of size O(sqrt d), so the heuristic as written may be comparing the
      wrong two objects. The entry states the statement, the derivation that
      creates it, what the 13 runs can and cannot distinguish, the cheapest
      discriminating test, and what would close it.
    not_warranted: >-
      NO KN-FIND IS PROMOTED, AND THE REASON IS THE GATE, NOT AN OVERSIGHT. The
      gate promotes a finding on `support` or `reject_scoped` backed by
      `replicated` or `strong` evidence; this decision is `replicate` on evidence
      the contract's own frozen calibration fixes at `preliminary` (2 of 3 seeds,
      dissenting seed 20260807), with no independent review and one unresolved
      confound. Two candidates were considered and REFUSED for now rather than
      silently dropped: (i) the closed form lambda = +/- round(t/2), hence m a
      function of (p, t) alone -- genuinely derivational and genuinely useful,
      but it is a corollary of the frozen contract's own T3 and lambda-rule and
      belongs in a finding only once an independent reviewer has checked the
      derivation (N2); and (ii) the |t| <= 2 rational-kernel small-m family --
      exactly characterised but observed at `preliminary` strength and, being
      density-zero, of no consequence to any cost claim. Both are recorded in
      EV-ICINV-c68f13 OBS-8 and in the analysis so nothing is lost, and both
      become KN-FIND candidates if N2 and N3 return.
