  rationale:
    - >-
      VALIDITY FIRST, AND IT WAS SETTLED BEFORE A SINGLE NUMBER WAS INTERPRETED.
      13 run directories present and matching the reported tally; 13/13 manifests
      schema-complete (code.source.all_pinned true with per-file sha256, an
      inference block, resources.memory_reconciliation, result.certificate);
      check_run_source_provenance.py --strict exit 0 at 13 pinned / 0 unpinned;
      the prime ladder and seeds certified at run time with the k = 24 stream
      head reproduced; raw-vs-summary agreement confirmed to full precision
      between two independently written artifacts; the matched null matched on
      the same d, one draw per instance, identical code path, written and re-read
      from disk before the KS statistic with hashes and timestamps recorded; both
      blocking controls PASS; invalidations_fired empty as computed inside the
      run. THE RUN SET IS EVIDENCE.
    - >-
      D1 -- THIRTEEN RUNS AGAINST A FROZEN maximum_runs: 12 -- IS ACCEPTED AS A
      DISCLOSED DEVIATION AND IS NOT RETROACTIVELY AUTHORISED. No protocol
      amendment is filed, because an amendment written now could only pretend to
      have permitted what it did not permit. The root cause is a defect in the
      FROZEN CONTRACT, not in the execution: required_artifacts and stopping rule
      SR7 both demand an aggregate run that computes the terminal state inside
      the run (decision-rule-evaluation.json), while budget_note enumerates only
      10 core runs. The true core is 11; 11 plus the 2 headroom slots is 13, and
      the two superseding re-runs took exactly those slots. The contract's own
      accounting is short by one.
    - >-
      THE ALTERNATIVE TO D1 -- INVALIDATING THE OVER-CAP RUNS -- IS REJECTED, FOR
      TWO CHECKABLE REASONS. (i) Invalidation is the remedy for a defect in a
      MEASUREMENT, and there is none: every invalidation rule was evaluated
      inside the run and none fired. A shortfall in a budget enumeration is not
      evidence that a number is wrong. (ii) The thirteenth run is
      RUN-ICINV-kf-decide, the run that computes the frozen decision rule.
      Discarding it would delete the very artifact SR7 exists to produce and hand
      the choice of terminal state back to a human after the data were seen --
      precisely the outcome-shopping SR7 forbids. Enforcing a run cap by
      destroying the anti-outcome-shopping artifact is a worse breach than the
      overrun it would punish. Recorded as mitigation, not excuse: no RESOURCE
      cap was approached (25.1 s wall against 7200 s per run, 0.007 CPU-hours
      against 6, 99 MB against 4 GB); all 13 runs are retained, none edited or
      deleted; and both superseded runs are evidentially inert, M0 being
      AMBIGUOUS in both STAGE-0 runs and M4 being 177/0/127 in both STAGE-1
      tables, verified by direct read.
    - >-
      D4 -- GATE G9 PARTIAL -- IS ACCEPTED AS AN ARTIFACT-COMPLETENESS DEFECT AND
      NO CORRECTIVE RUN IS ORDERED. Confirmed by direct read: T5 in
      tail-checks.json carries analytic_peak_bytes 93339648, the band [0.25, 4.0]
      and the component breakdown, and does NOT carry the measured value or the
      ratio. The substance is nevertheless present and reviewer-recomputable:
      every one of the 13 manifests carries resources.memory_reconciliation with
      measured_peak_rss_bytes, analytic_peak_bytes, ratio_measured_over_analytic
      and within_band (decide: 63553536 / 93339648 / 0.6809 / true), and all 13
      ratios lie in [0.68, 1.74] inside the declared band. Success criterion
      (S-i) is MET; (S-j)'s "all six tail checks reported" is met only partially,
      at the file level, for T5. A corrective run would consume a further run
      against a cap already exceeded in order to copy verified numbers into a
      second file. G9 stands PARTIAL in the record and the reconciliation is
      restated in EV-ICINV-c68f13 so the chain is complete without it.
    - >-
      D9 AND D10 ARE BOOKKEEPING, NOT MEASUREMENT, AND BOTH ARE ACCEPTED. D9:
      implementation.md fell outside TASK-20260807-f9c69c's declared write_scope;
      it is a documentation artifact inside the experiment directory, mandated by
      the /run-experiment skill and the dispatching message, and it touches no
      other record -- the defect is in the handoff, which declared a write_scope
      narrower than the deliverables it required. D10: the execution report sits
      at experiments/EXP-ICINV-fcb497/execution-report.yaml rather than the
      contract's coordination batch path, because no BATCH id was bound. THE
      EXECUTOR'S REFUSAL IS ENDORSED: minting a BATCH id is Coordinator authority
      exercised inside a dispatch batch, and inventing one inside an execution
      task to satisfy a path would have been the worse error. That path is
      canonical for every citation of the report.
    - >-
      THE STAGE-0 403s ARE INFRASTRUCTURE, NEVER MATHEMATICS. Both landing pages
      returned HTTP 200 and are pinned; both PDFs returned HTTP 403 behind
      Cloudflare and their bodies are pinned as evidence of the failure. Under
      AGENTS.md rule 5 and the contract's own branch rules this is NEVER a
      BASE_FIELD verdict and is not evidence about the operation count in either
      direction. Cost corollary CC is therefore UNDETERMINED -- not refuted, not
      supported -- and no modeled row of the concrete-cost table (PS-P256 2^384,
      PS-P384 2^576, PS-TOY-24 2^31.0, PS-ELL-SMALL 2^1.85) may be cited as a
      cost claim, since every one is conditional on a KERNEL_FIELD verdict that
      was not obtained.
    - >-
      THE EXECUTOR'S REFUSAL TO PROMOTE THE ABSTRACT PASSAGE IS ENDORSED. The one
      passage that mechanically classifies the count as kernel_field sits at byte
      offset 1160 of the 2020/341 LANDING-PAGE text, not a full text; the frozen
      full-text gate caps the verdict at AMBIGUOUS and the KN-LIT-780 fallback at
      AMBIGUOUS-only. The artifact was independently re-verified before archiving
      (hash recomputed, substring re-tested at offset 1160). Promoting an
      abstract to a determinate verdict is exactly what that gate exists to
      prevent.
    - >-
      THE MEASUREMENT RETURNED ITS PRE-REGISTERED PREDICTION, AND THE STRENGTH
      WAS COMPUTED, NOT CHOSEN. OUTCOME_NULL_generic_order fired inside the run
      on a 2-of-3 seed majority: median >= 0.75 at the largest decade at all
      three seeds (0.7924 / 0.7950 / 0.7842), no collapse across the ladder
      (max fall 0.0167 against a 0.05 tolerance), degenerate fraction 0.000
      everywhere, 7 of 7 decades verdict-yielding at n = 1000. The frozen
      calibration then FIXES the strength at `preliminary` with the dissenting
      seed named -- 3 of 3 seeds would have permitted `replicated`, 2 of 3 caps
      at `preliminary`. Seed 20260807 dissents with OUTCOME_FAMILY_small_m, and
      its dissent rests entirely on deficits at k20 (0.081) and k22 (0.061), both
      BELOW the design's own declared resolvable floor of 0.10.
    - >-
      THE DEFICIT ANOMALY IS UNRESOLVED, AND THE DECISION SAYS WHAT THE DATA CAN
      AND CANNOT DISTINGUISH RATHER THAN CHOOSING A STORY. Three candidates.
      (A) A small-d arithmetic artefact, which the contract pre-declared as an
      interpretation limit: SUPPORTED by the monotone rise in distinct (d, m)
      values per 1000 instances -- 167, 275, 435, 596, 762, 852, 923 across the
      ladder -- and by the deficit being significant at exactly the three most
      atomic decades and sub-critical at k24 at 3/3 seeds; but an effect that
      genuinely shrinks with p would look identical, so this is consistency and
      not proof. (B) A MISMATCH BETWEEN THE NULL AND THE OBJECT, which THESE DATA
      CANNOT ADDRESS AT ALL. By T3 the minimal non-scalar alpha has v = +/-1 and
      u = round(-t/2), so the frozen lambda-rule gives lambda = +/- round(t/2)
      and |lambda| <= sqrt(p) + 1 ~ sqrt(d): the curve-derived lambda is a SMALL
      INTEGER in a window of size O(sqrt d), while the matched null draws a
      UNIFORM unit from all of (Z/d)^*. The deficit is therefore ambiguous
      between a fact about CM arithmetic and a fact about the multiplicative
      orders of small integers, and no null over small integers of matched
      magnitude was ever drawn. This is a gap in the PRE-REGISTERED DESIGN, not
      in its execution. (C) Noise at the floor: EXCLUDED as a complete
      explanation, because k14 reaches D in [0.104, 0.121] -- at or above the
      declared floor -- at all three independent seeds. Net: (A) contributes,
      (B) is untested, (C) is insufficient. That is a replication target, not a
      verdict.
    - >-
      A SMALL-m FAMILY WAS FOUND AND IS EXACTLY CHARACTERISED, AND IT DOES NOT
      FALSIFY HEUR-ORD-1. Every m = 1 instance in the small-order tail has
      u = 1, v = -1, lambda = 1 at |t| <= 2, and the m = 2 instances have
      lambda = d - 1: the family is ordinary E/F_p with |t| <= 2, where the
      Z[pi]-minimal non-scalar endomorphism has FULLY RATIONAL kernel and m <= 2.
      F2 did not fire and could not have: the trace-density of |t| <= 2 is
      O(1/sqrt p) -> 0, and a density-zero exceptional set is precisely what H1
      asserts exists. It is named here and handed forward as a deliverable rather
      than left in a tail file. It is not an attack -- mechanism STEP 4 bites
      regardless.
    - >-
      AUDIT-Z IS NOT CONFIRMED AND MUST NOT BE REPORTED AS CONFIRMED. Zero of 177
      rows change their exponent, which is what AUDIT-Z predicted, but 127 are
      undetermined and OUTCOME_AUDIT_PARTIAL fired. What is established is
      narrower and is stated that way: among the 50 rows the audit could
      classify, none changes its exponent. No escalation is triggered, because
      exponent_changed = yes occurs nowhere. IDEA-20260807-c36472's Otilde(p^{1/4})
      transport figure is untouched and its [open] mark is carried forward
      UNDISCHARGED.
    - >-
      NO ADVERSE CALL IS MADE, SO NO REFUTATION ARTIFACT IS OWED -- AND THAT IS
      STATED RATHER THAN LEFT IMPLICIT (docs/claims-and-verification.md). Had one
      been made on this run set it could only have been `weaken` plus
      replication, never reject_scoped, since the basis would have been a single
      unreplicated empirical-only observation.
    - >-
      DIRECTION AND TASTE, HONESTLY. This lane is a cofactor-and-accounting
      question, not an exponent-moving mechanism, and docs/target-result-profile.md
      classifies it as explicitly NOT target-class. sota_delta is 0.0 against
      0.886 sqrt(N) (KN-TECH-001, -006, -018, -031); the only movement the record
      ever claimed was UPWARD, in a cost figure, against its own interest. The
      replication authorised below is priced accordingly: it is cheap (seconds of
      compute), it retires a specific confound, and it does not reopen a lane at
      the expense of exponent-targeting work elsewhere in GOAL-ENDO-001.

