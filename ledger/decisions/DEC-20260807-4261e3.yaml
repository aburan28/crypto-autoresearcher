coordinator_decision:
  id: DEC-20260807-4261e3
  context: >-
    /review-evidence lifecycle steps 8-10 for EXP-ICINV-fcb497 under
    H-ICINV-82ee6a / RQ-ICINV-475b5e / GOAL-ENDO-001, on the 13 runs executed by
    TASK-20260807-f9c69c against the contract frozen by DEC-20260807-1538f8.
    This record settles run-set validity, the four open deviations the Executor
    escalated (D1, D4, D9, D10), the official reading of the frozen decision
    rule's terminal states, the status of H-ICINV-82ee6a, and the knowledge
    promotion gate.
  decision: replicate
  decision_note: >-
    EXACTLY ONE TRANSITION, AND IT IS `replicate`. NOT `support`: the frozen
    evidence calibration caps this run set at `preliminary`, HEUR-ORD-1 is a
    heuristic validated at toy scale only, no independent Validator or Red Team
    review exists, and a surprising observation on first sight gets replicated,
    not promoted. NOT `weaken` and NOT `reject_scoped`: no falsification
    condition F-i..F-vi fired, nothing in this run set is adverse to any part of
    H-ICINV-82ee6a, and an adverse call would in any case require a refutation
    artifact this result does not admit. NOT `inconclusive` as the headline: the
    experiment DID resolve what it was powered to resolve at 2 of 3 seeds, and a
    concrete, cheap, pre-specifiable replication discriminates the one live
    ambiguity -- calling the whole engagement inconclusive would understate a
    valid result and, worse, would leave no next action. The parts that ARE
    inconclusive are named as such below rather than absorbed: cost corollary CC
    is UNDETERMINED, claim AUDIT-Z is NOT CONFIRMED, and the deficit anomaly is
    UNRESOLVED.
