  limitations:
    - >-
      claim_tier is `toy` and no downstream citation may raise it. p < 2^24,
      capped by exact factorisation of d ~ p. Nothing here is a statement about
      P-256, P-384 or any cryptographically sized curve, and the PS-P256 /
      PS-P384 rows are modeled lower bounds conditional on a STAGE-0 verdict that
      was NOT obtained.
    - >-
      Cost corollary CC is UNDETERMINED. No corrected isogeny-evaluation cost
      figure from this experiment may be cited as a cost claim in either
      direction until a full text is retrieved and byte-verified.
    - >-
      HEUR-ORD-1 remains a HEURISTIC. Its support here is `preliminary`, rests on
      a 2-of-3 seed majority with a named dissent, is toy-scale-only, and is
      subject to a confound the design cannot address. No conditional result
      depending on it may be relabelled unconditional.
    - >-
      AUDIT-Z is NOT confirmed: 127 of 177 barrier rows undetermined.
    - >-
      alpha is scoped to Z[pi]. Where the conductor f > 1 the maximal order O may
      contain a non-scalar element of SMALLER degree, so every d reported is a
      Z[pi] statement; the O-minimum for f <= 100 is a declared secondary.
    - >-
      Ordinary prime-field curves only. Nothing transfers to supersingular
      curves, whose endomorphism ring is a non-commutative quaternion order; in
      particular nothing here bears on KN-TECH-055 or on the Wesolowski exemplar
      in docs/target-result-profile.md.
    - >-
      H-ENDO-001 was used as an admissibility filter and was NOT re-tested. No
      conclusion here is evidence about it in either direction and none may be
      cited as such.
    - >-
      HEUR-M2-2's validation coverage is a read-only static audit plus the m = 1
      fixture, WEAKER than the runtime instrumentation the parent proposal
      proposed. Declared in H-ICINV-82ee6a and unchanged.
    - >-
      NO independent Validator and NO Red Team review of EXP-ICINV-fcb497 exists.
      DEC-20260807-1538f8 next action N3 reserved both before any evidence record
      was written and they were not run; this review is Coordinator-only and
      promotion gate (4) is UNMET. This is recorded as a deviation from a prior
      Coordinator decision, not absorbed.
    - >-
      This reviewing session has NO Bash tool. Every verification rests on direct
      reads of artifacts; no statistic was independently recomputed by running
      code, and the raw-vs-summary check is a full-precision comparison between
      two independently written artifacts rather than a recomputation from the
      per-instance table. Declared, not glossed.
    - >-
      Thirteen runs against a frozen cap of twelve, and tail check T5 incomplete
      in its artifact. Both disclosed above; neither retroactively authorised.
    - >-
      (d, m) is NOT an identifying invariant. Collisions are pervasive by
      construction (164-939 distinct pairs per 1000 instances) and m depends on
      the curve only through t. Any downstream use of (d, m) as an invariant is
      forbidden by H-ICINV-82ee6a and falsified by this table.

