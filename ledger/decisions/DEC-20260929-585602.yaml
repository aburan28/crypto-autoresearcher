      n = 23, F3 at offset 0 would be 2E-pure; CELL-O19 p = 4 sits 0.00044
      below an r boundary.
    q1: >-
      Exact on every compared row: the orders and factorisations of CELL-K13,
      K17, K19, K23, K41, O19, RC1 and the three Z/l cells; log2 N to four
      decimals; r and M by R-M at p = 3 and 4; S by R-S with constant 128
      (including 2^26 and 2^27 at M = 548 and 956, the version-2 card-constant
      mismatch gone); field polynomials and normal elements; affine counts.
    q2: >-
      68 rows. Every exhaustive row on CELL-K13, K19 and O19 agrees at the
      contract's six printed decimals, which on these cells implies identical
      pure-point counts (one point moves a purity by at least 1.9e-6). The
      three CELL-K23 F1 rows lie at z = 0.68, 0.43 and -1.34 of the
      contract's sampled standard error. F2 and F3 are 0 everywhere on both
      sides; purity_4 of F1 to F4 is 0 on CELL-K23 on both sides.
    strict_reading_item: >-
      The three CELL-K23 F4 purity_2 rows: J5 exhaustive 2/8383411 (the
      singleton class of x = 1), contract sampled 0.0 with se 0.0. They agree
      at the contract's printed precision. Under the literal
      three-combined-se clause the contract's degenerate binomial se at
      p-hat = 0 admits no difference, so these rows would be outside it by
      2.4e-7. Primary ruling: agreement, K-indeterminate not triggered,
      because the frozen figure is a six-decimal print and both independent
      exhaustive counts (J1 and J5) locate the same two points. Under the
      stricter reading K-indeterminate would add a revise item on the audit's
      sampled-row reporting; the decision is revise regardless, the remedy is
      RV-14, and neither implementation is preferred.
    q3: >-
      All eight rows within 0.01 bit on g*_k and 0.0001 on c_k; the
      unconstrained flags are exactly the complement of the contract's binding
      flags; the k = 16 with-orbit residue of 5.3e-5 bit is the one the sheet
      discloses. Matched rho 2^60.8090 on both sides (reference line only,
      CORR-20260922-81aeab); with-orbit rows are per-orbit framings,
      conditional under CORR-20260925-649e25.
    not_compared: >-
      The version-3 control cells CELL-ZS16, CELL-ZS64, ISO-K13 to ISO-O19
      and PC-6d rows; CELL-Z-2095853 at M = 16; the gate rows at M = 2, 4 and
      the CELL-K17C PC-9 row; sample-table totals and the M-under-#E column;
      every F5 composite row and every CELL-K41 audit row; smallest-class
      sizes and exact_carrying flags (consistent with J5's purities); class
      counts on sampled rows (no tolerance defined; consistent with missed
      rare classes).
    result: J5 agrees with the contract on every compared quantity within the plan's tolerance after matching readings.

