  revision_requirements:
    note: >-
      Numbering is this record's own (RV-*). RV-1 to RV-6 remedy breaking
      artifacts, the contradicted discharge clauses and the fired tripwire;
      RV-7 to RV-15 are non-breaking and are discharged in the same revision.
      Every item is an instrument, decision-rule, labelling, completeness or
      procedure defect; none bears on any curve, filter or k-list cost (CB3-9).
      The remedies are the reviewers' recommendations; the designer may meet
      each by any equivalent route stated with its reason.
    items:
      - id: RV-1
        breaking: true
        joints: [J3, J4]
        artifacts: [D-1, PTM-E-extended, "specification SR-6 and sr6_image_rule (CD-9)", "C-4 row F5xF4 CELL-K13 M 8"]
        remedy: >-
          Make SR-6's image-size clause unable to fire on an arm that carries
          only the certificate's exact component up to a few points: count the
          image only over labels that occur in used conditioning cells, or
          require the clause's own exhaustive combining-rule verification
          before stopping. Audit every declared (arm, cell, M) for degeneracy
          (image size, smallest class, near-exact labels) and record F5xF4 at
          M = 8 as degenerate, dropping or exempting it with the reason. Add a
          near-exact degenerate-label control (h4 plus a few exceptional
          points) that SR-6 must not fire on.
      - id: RV-2
        breaking: true
        joints: [J3]
        artifacts: [D-2, "PC-16c", "IR-23", "z_ladder.passed and issue_clearance"]
        remedy: >-
          Compute PC-16c's false-fail rate in code at design time on
          non-declared primes. Either plant a decay strong enough to push it
          below 0.01, or confine IR-23's PC-16c branch to LEAD and separate
          PC-16c from the clearance that NEG readings need. Replace the hand
          slope with the computed one.
