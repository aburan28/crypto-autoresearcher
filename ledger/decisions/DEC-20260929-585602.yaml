      - id: RV-7
        breaking: false
        joints: [J3]
        artifacts: [D-5, D-8]
        remedy: >-
          In stage3, return ART-DEF, never NEG or LEAD, when any ladder cell or
          lead key is missing or invalidated (IR-2, IR-6, IR-7), as SR-3 says;
          NEG requires at least one estimated (cell, M) per arm.
      - id: RV-8
