          map numeric offsets to roles before stage3 and heur_b2_held_out;
          report one verdict and one L2 interval per declared arm. Commit an
          end-to-end dry call of stage3 over the full declared (cell, M) name
          grid, with a planted excess per arm, showing that every declared arm
          can reach every outcome its table assigns it.
      - id: RV-4
        breaking: true
        joints: [J3, J4]
        artifacts: [D-3, OS-1, OS-2, "RR-5"]
        remedy: >-
          Measure the resolving floor on the path NEG is read on (stratified
          shuffle, exact-saturated null, L3, on groups of the declared shapes)
          for an exact-free and an exact-carrying planted mixture per declared
          (cell, M), and quote it beside NEG; or label the Z/l floor an
          underestimate with the measured ratio. Rewrite the NEG row, the
          mechanism and the method-ceiling sentences to the floor actually
          measured.
      - id: RV-5
        breaking: true
        joints: [J3, J4]
        artifacts: [D-4, OS-3, "RR-3 replacement sentence", "success_criterion LEAD_REACH_SCOPED"]
        remedy: >-
          Scope the LEAD-reach sentence to what the controls show, with their
          rates. Add a curve-path LEAD-reach control (a planted exact-free and
          an exact-carrying filter on groups of the lead shapes) beside PC-16,
          PC-16b and PC-16c. State the effective LEAD floor for exact-free arms
          (L1 against the exact-saturated null).
      - id: RV-6
        breaking: true
        joints: [procedure]
        artifacts: [TB-4, "audit sheet design_computations C-5 and its 'no declared cell' sentence", "DEC-20260929-4c7ffc R-PRODUCER-COMPUTE (5)"]
        remedy: >-
          Run every design-time dry call only on groups that are not declared
          cells of the contract (adjacent non-declared primes, as the red team
          did). Correct the sheet's statement. The next opening decision's
          producer-compute ruling names the excluded groups, and the next plan
