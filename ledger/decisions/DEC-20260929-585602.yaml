  j5_versus_contract:
    rule: CB3-4, performed before any key was applied; full table in the worksheet step 5.
    q0: >-
      Twelve choice points. Every reading J5 adopted coincides with the
      contract's committed reading (F1 mid-CDF floor as in weight_buckets; F4
