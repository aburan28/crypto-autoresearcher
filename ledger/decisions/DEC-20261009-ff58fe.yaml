      - every path bound by the TASK-20261008-5ea531 receipt keeps its path_sha256
    continuation_repair:
      id: PROC-DEF1-C
      pre_authorized: true
      text: >-
        After TASK-20261008-398fce verifies, the same procedure applies to
        each continuation run root that exists and was finalized:
        RUN-PFDR-0b3699-table, -calibrate and -analysis. The run-root
        manifest and command.txt hashes are taken from the 398fce receipt.
        The append text is the template with these changes:
        - the archived_by line reads "archived_by: TASK-20261008-398fce
          (run.protocol.output_archive and run.task_id are the pinned
          launcher's constants, AMD-20261008-9c080d A-5)";
        - task names the new task's id;
        - these lines are inserted before decision:
            executing_task: TASK-20261008-9456e8
            protocol_version: 2
            protocol_amendment: AMD-20261008-9c080d
            finalize_argv_source: experiments/EXP-PFDR-0b3699/execution-report-9456e8.yaml (AMD-20261008-9c080d A-9)
        The registry records follow the same template, with notes naming the
        new task. A run root finalized invalid is repaired the same way, with
        its status unchanged. A run root without a manifest (a stop before
        finalize) is not repaired.
        The Coordinator writes that task's card, with an id minted then, at
