  validator_change:
    task: TASK-20261009-0f4c0a
    authority: the user's clarification answer (user_ruling), item (1)
    file: tools/validate_ledger.py
    function: check_approval_capacity
    exact_change: >-
      In check_approval_capacity, change the set comprehension that defines
      approved_here by adding ONE condition: a targeted experiment that
      already has runs (_experiment_has_runs(t, ctx) is true) is not counted
      as approved here.
      Before (as it stands at origin/main afc072ca1; FF-01):
        approved_here = {t for t in targets
                         if ctx.record_types.get(t) == "experiment"
                         and ctx.records[t].get("status") == "approved"}
      After:
        # A target that already has runs is a continuation of an approved
        # contract, not a new approval; it adds nothing to the unrun backlog
        # (user ruling 2026-10-09; DEC-20261009-ff58fe).
        approved_here = {t for t in targets
                         if ctx.record_types.get(t) == "experiment"
                         and ctx.records[t].get("status") == "approved"
                         and not _experiment_has_runs(t, ctx)}
