  def1_repair:
    procedure_id: PROC-DEF1
    authority: the user's clarification answer, item (2), and HU-4
    where_records_live: >-
      experiments/EXP-PFDR-0b3699/supersessions/<RUN-ID>/manifest_v2.yaml,
      OUTSIDE every run root. Why:
      - No file is added beneath any run root, so every checksums.sha256
        stays exact, and the archive check (c) ("lists every file beneath it,
        and only those") keeps holding.
      - The path does not match the run glob experiments/*/runs/*/manifest.yaml,
        which the validator requires of a superseding record
        (RUN_MANIFEST_PATH; FF-03).
      - check_run looks for companion artifacts in the discovered run root,
        where they already are.
      Later archive checks treat experiments/EXP-PFDR-0b3699/supersessions/
      as committed provenance records outside the run package: never
      re-staged, never edited, and bound by the TASK-20261009-70f831 receipt.
    construction: >-
      For run root R = experiments/EXP-PFDR-0b3699/runs/<RUN-ID>/, with
      ORIG = R/manifest.yaml and CMD = R/command.txt:
      (1) Preconditions; any failure is a STOP.
          - sha256(ORIG) and sha256(CMD) equal the TASK-20261008-5ea531
            path_sha256 values. For the continuation, they equal the
            TASK-20261008-398fce values.
          - ORIG ends with "\n" and contains the substring "\n  code:\n"
            exactly once.
          - CMD ends with "\n", contains no tab, no empty line and no line
            beginning with whitespace, and every character is printable
            ASCII.
      (2) INSERT is the text "    command: |-\n" followed, for each line L of
          CMD (split on "\n" after removing the single final "\n"), by
          "      " + L + "\n".
      (3) APPEND is the supersession block given per run below (append_text).
      (4) V2 = the bytes of ORIG up to and including the first "\n  code:\n",
          then INSERT, then the remaining bytes of ORIG, then APPEND. Write V2
          to the supersessions path. Never write into R.
      (5) Verify, with any failure a STOP:
          - yaml.safe_load(V2) has exactly the top-level keys {run,
            supersession};
          - V2.run.id equals RUN-ID;
          - V2.run.code.command equals CMD without its final "\n";
          - V2.run, with code.command deleted, deep-equals
            yaml.safe_load(ORIG).run;
          - removing INSERT and APPEND from V2 gives the bytes of ORIG
            exactly;
          - ORIG, CMD and R/checksums.sha256 are byte-unchanged.
    append_text_template: |-
      supersession:
        record: run_manifest_supersession
        supersedes_path: <ORIG path>
        supersedes_sha256: <sha256 of ORIG>
        adds: [run.code.command]
        command_source: <CMD path> (verbatim; sha256 <sha256 of CMD>)
        command_not_logged: run_jobs.py finalize invocations are not in command.txt (DEF-1 provenance gap; DEC-20261008-8cb005 FP-7)
        archived_by: TASK-20261008-5ea531 (run.protocol.output_archive names TASK-20261002-33afa9, which DEC-20261008-8cb005 superseded)
        decision: DEC-20261009-ff58fe
        task: TASK-20261009-70f831
        nothing_else_changed: true
    append_text_template_note: >-
      Each line ends with "\n", including the last. The archived_by line is
      exactly as shown for the three runs below. For the continuation runs,
      PROC-DEF1-C replaces it and adds lines (continuation_repair).
    runs_now:
      - run_id: RUN-PFDR-0b3699-tests
        orig: experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-tests/manifest.yaml
        orig_sha256: 95ab87d36f7f7abe599a75d5a22233cf84aeea7a9e642a97f8eb94e8bad228c5
        cmd: experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-tests/command.txt
        cmd_sha256: f9a3b7d0ad13ec820e5ee9b355905b526a523433bf35e314e47460c6c39a7b84
        v2: experiments/EXP-PFDR-0b3699/supersessions/RUN-PFDR-0b3699-tests/manifest_v2.yaml
      - run_id: RUN-PFDR-0b3699-repro
        orig: experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-repro/manifest.yaml
        orig_sha256: 7531ec39b67d795a26997bfc453fad4d2ca2f6c319c7c90d282d718891f4a621
        cmd: experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-repro/command.txt
        cmd_sha256: 14fb5aeb4f7d8ef617bc9a76ca69b7520547b86d040ce1e189c5c226a332c7f0
        v2: experiments/EXP-PFDR-0b3699/supersessions/RUN-PFDR-0b3699-repro/manifest_v2.yaml
      - run_id: RUN-PFDR-0b3699-p0-design
