        v2: experiments/EXP-PFDR-0b3699/supersessions/RUN-PFDR-0b3699-p0-design/manifest_v2.yaml
    registry_entries:
      file: tools/run_supersession_registry.yaml (schema run-supersession-registry-v1)
      write_rule: >-
        APPEND three records to the end of the records list, in the order
        tests, repro, p0-design, in the existing format: "- run_id:" at column
        0, fields at two spaces. The registry's current bytes must remain an
        exact prefix. The file must parse, its schema value must be
        unchanged, and every earlier record must be unchanged.
        validate_ledger.load_run_supersessions() must load it without
        ValueError. No other edit.
      record_template: |-
        - run_id: <RUN-ID>
          superseded_path: <orig>
          superseded_sha256: <orig_sha256>
          superseding_path: <v2>
          superseding_sha256: <sha256 of v2 as written>
          registered: '2026-10-09'
          supersession_kind: provenance_field_addition
          decision_id: DEC-20261009-ff58fe
          defect: 'DEF-1: the pinned run_jobs.py finalize (sha256 31126c1b5da013bc2683958647b43e9596285f04690dbabaf803aae131709cc1) wrote no run.code.command; the commands are recorded in run.code.commands and in the run root''s command.txt.'
          notes: 'The superseding record is the archived manifest byte for byte with run.code.command inserted (the run root''s command.txt, verbatim) and a trailing supersession block; nothing else differs. It lives outside the run root so the run root''s checksums.sha256 stays exact. Authorised by the user on 2026-10-09 (HU-4); ruled by DEC-20261009-ff58fe; performed by TASK-20261009-70f831.'
      record_template_note: >-
        The values are those of runs_now, with only <sha256 of v2 as written>
        computed at run time. For the continuation, PROC-DEF1-C substitutes
        its own task id in notes.
    who_writes_what: >-
