        put tools/ on sys.path, import validate_ledger, build
        validate_ledger.Ctx(legacy_paths=set()), and register synthetic
        records with ctx.register(id, path, body, type). Experiment paths are
        <tmp>/EXP-TST-<tok>/specification.yaml in a temporary directory. A
        "run-bearing" experiment has the directory <tmp>/EXP-TST-<tok>/runs/RUN-TST-000001/.
        Call validate_ledger.check_approval_capacity(ctx) and inspect
        ctx.errors. No repository file is read or written by the test.
      fixture: >-
        Area TST:
        - four approved experiments with no runs: EXP-TST-a00001,
          EXP-TST-a00002, EXP-TST-a00003, EXP-TST-a00004;
        - one approved experiment with runs: EXP-TST-b00001.
        Each body is {id, status: approved}, with no goal_id.
      cases:
        - id: T-1 continuation_not_refused
          decision: "DEC-20261009-c00001, decision approve, target_ids [EXP-TST-b00001]"
          assert: no ctx.errors line contains "approval capacity"
        - id: T-2 new_approval_still_refused
          decision: "DEC-20261009-c00002, decision approve, target_ids [EXP-TST-a00001]"
          assert: >-
            exactly one ctx.errors line contains "approval capacity", and it
            contains "area:TST already holds 3 approved contract(s) with no
            run (cap 3)" and "EXP-TST-a00001"
        - id: T-3 release_keys_still_honoured
          decision: "DEC-20261009-c00003, decision approve, target_ids [EXP-TST-a00001], withdraws_experiments [EXP-TST-a00002]"
          assert: no ctx.errors line contains "approval capacity"
        - id: T-4 enforcement_date_unchanged
          decision: "DEC-20261006-c00004, decision approve, target_ids [EXP-TST-a00001]"
          assert: no ctx.errors line contains "approval capacity"
        - id: T-5 mixed_targets
          decision: "DEC-20261009-c00005, decision approve, target_ids [EXP-TST-b00001, EXP-TST-a00001]"
          assert: exactly one ctx.errors line contains "approval capacity", and it names EXP-TST-a00001 and not EXP-TST-b00001
    acceptance:
      - "pytest tests/test_approval_capacity_continuation.py passes (5 tests); before the change, T-1 fails and T-2 to T-5 pass (run once against the unmodified file and record the result)"
      - "pytest tests/test_obstruction_and_provenance.py tests/test_review_independence.py tests/test_measured_bound.py pass, unchanged"
