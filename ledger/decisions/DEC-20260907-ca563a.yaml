coordinator_decision:
  id: DEC-20260907-ca563a
  type: coordinator_decision
  decision_type: protocol_approval_and_lane_opening
  goal_id: GOAL-SATIC-c49b77
  batch_id: BATCH-127c82
  status: recorded
  recorded_at: '2026-09-07T09:45:00Z'
  recorded_by: coordinator-satic-c49b77-276e
  title: >-
    APPROVE the frozen known-bad-control protocol for BATCH-127c82 and open the lane
    that executes DEC-20260905-6e8621's RANK 1 deliverable alone: plant a well-formed
    but wrong declared hash or declared parent in a scratch copy of one archive receipt,
    outside the repository, and record whether the at-commit verification procedure
    flags it. This decision approves a PROTOCOL. It reports no result, asserts no
    finding, clears no impediment, and moves neither completion criterion.
  context: >-
    DEC-20260905-6e8621 closed BATCH-008925 and ranked exactly one next action first:
    execute BATCH-2cca27's frozen KNOWN-BAD CONTROL alone. That control has never been
    run by any session. DEC-20260905-29416d records it as explicitly unperformed for the
    TASK-20260905-5681fc refusal, and DEC-20260905-6e8621 records under
    unperformed_checks that BATCH-008925's delivered control is a DIFFERENT control with
    an opposite purpose. This lane executes the ranked work and nothing else. It is
    opened by a fresh Coordinator session on branch cursor/satic-c49b77-imp1-recheck-276e,
    the same lane that produced DEC-20260905-6e8621, after merging origin/main.
  decision: approve
  decision_label: known_bad_control_protocol_frozen_and_approved_lane_opened
  decided_by: coordinator
  decided_at: '2026-09-07T09:45:00Z'
  target_ids:
    - GOAL-SATIC-c49b77
    - BATCH-127c82
    - TASK-20260907-9ceaba
    - TASK-20260907-814b9f
    - TASK-20260907-39511d
    - TASK-20260907-e7cc96
    - TASK-20260907-6fbd6d
    - TASK-20260907-c3d2d8
    - TASK-20260907-9b71ea

  # =====================================================================
  # WHAT IS APPROVED, AND ON WHAT AUTHORITY.
  # =====================================================================
  what_is_approved:
    contract: coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/contracts/known-bad-control.json
    contract_status: approved
    approved_by: coordinator-satic-c49b77-276e
    authority: >-
      The campaign's standing authorization (AGENTS.md "Standing authorization", carried
      into agents/coordinator.md) covers Coordinator approval of a COMPLETE FROZEN
      protocol without asking the user to confirm each one. Three further facts make this
      approval narrow rather than expansive: the protocol is a verification-procedure
      control on the control plane; it authorises no scientific claim of any kind; and it
      is a specialisation of a clause that was ALREADY frozen and approved under
      DEC-20260905-ed0e18 as BATCH-2cca27's checks[5], never executed.
    why_the_contract_is_judged_complete: >-
      It fixes, before execution and with no judgement left to the executor: which
      receipt is copied and from which commit (TASK-20260905-79a686's archive block in
      BATCH-1a527c/authority_queue.json at 4c72c94c7, file digest 8e74be15...); the exact
      scratch path outside the repository (/tmp/satic-kbc-BATCH-127c82/, verified outside
      the checkout by git itself); the exact single mutation per trial with its from-value
      and to-value, and a checkable one-mutation rule (JSON diff cardinality 0 for the
      negative arm, 1 for each sensitivity trial); five trials over two declared mutation
      classes, each class with two trials probing a distinct sub-case; the pass/fail
      predicate as a formula over the procedure's output with four named conjuncts; the
      required artifacts; and the stopping rule, including the prohibition on repeating a
      cell to obtain a different outcome.
    why_this_is_not_an_experiment_record: >-
      NO EXP-* RECORD IS CREATED, deliberately. An EXP-* record would frame this as a
      scientific protocol on a mathematical object, and it is not one: it measures an
      instrument on the control plane. The frozen contract lives in the batch directory,
      exactly as BATCH-2cca27's and BATCH-008925's contracts do, which is also the
      precedent this lane's own source clause was frozen under.

  # =====================================================================
  # WHY THIS RANKS FIRST. Restating the distinction the record turns on.
  # =====================================================================
  rationale:
    - >-
      THE TWO CONTROLS ARE NOT INTERCHANGEABLE, AND THE RECORD SAYS SO IN BOTH
      DIRECTIONS. BATCH-008925's frozen contract declares its control kind
      `proves_too_much` with a SPECIFICITY description -- apply the J1 method to the
      small known-good BATCH-cef2eb set as well as the failed batches, because "a method
      that flags everything or nothing is miscalibrated". It was executed well: 1 flag of
      17 on the control set against 5 of 58 overall, of the same kind and cause, and the
      report's own decisive sentence is that the flags are UNCORRELATED WITH BATCH
      OUTCOME. That is a real result and this decision neither restates nor revises it.
      BATCH-2cca27's checks[5] is a SENSITIVITY check: plant a defect and confirm the
      procedure detects it. A procedure can be perfectly specific and completely
      insensitive -- one that never compares anything reports no false positives at all.
      Neither control substitutes for the other.
    - >-
      THE DELIVERED REPORT ITSELF NAMES THE GAP THIS LANE FILLS, which is why the ranking
      is not this Coordinator's editorial preference. Under
      `uninformative_dimensions_reported_as_required` the Validator records: "At-commit
      verification returned 58/58 exact across all three sets, so on that dimension alone
      the method cannot distinguish the control set from the failed sets." A procedure
      that returns the same answer everywhere has not yet been shown to be capable of
      returning a different one. The report's own `calibration_reasoning` offers the
      strongest mitigation available to it -- two false positives from its own instrument,
      run down rather than accepted -- and correctly presents that as evidence the
      instrument emits flags AT ALL, which is strictly weaker than a planted-defect
      control and is not presented as equivalent.
    - >-
      AGENTS.md's OWN proves-too-much obligation is the KNOWN-FALSE form: "the argument is
      run against objects for which its conclusion is KNOWN FALSE." BATCH-2cca27's control
      matches that pattern; BATCH-008925's does not. DEC-20260905-6e8621 records this as a
      defect in BATCH-008925's contract AS FROZEN rather than in the Validator's execution
      of it, and this lane is the remedy for the contract defect, not a re-review of the
      Validator.
    - >-
      IT RANKS AHEAD OF DOING NOTHING ON STATED GROUNDS, which an unlimited ECC budget
      makes obligatory rather than optional. It requires no solver, no benchmark, no
      network and no new protocol; its object is already frozen; it is the cheapest
      available way to learn whether a `pass` from this program's archive-verification
      layer carries the information a reader takes it to carry. And it is aimed at the
      gate on which every archive receipt in this repository depends: AGENTS.md "Durable
      research commits" makes durability conditional on the dispatcher's post-commit
      verifier accepting a receipt, and that verifier's sensitivity to a planted defect
      has never been measured.
    - >-
      IT RANKS AHEAD OF THE TWO ALTERNATIVES FOR THE REASONS DEC-20260905-6e8621 GAVE, and
      this Coordinator re-checked both. Reconciling FINDING-01/FINDING-02 by a superseding
      goal record is real work that reduces no research uncertainty, and its parts inside
      this lane's reach were already discharged. Designing the criterion-1 benchmark
      package cannot be ranked ahead while FINDING-04/08/09 show the campaign's
      telemetry-capture discipline is its weak joint -- a package built on the same
      recorder pattern would inherit an unmeasurable wall clock and transcribed rather
      than captured outputs. That guidance is acted on here at no cost: this lane's
      contract REQUIRES captured stdout, stderr, returncode and elapsed seconds per
      command and forbids transcription, so the lane also exercises the capture discipline
      criterion 1 will need.
    - >-
      THE CONTROL IS ITSELF CONTROLLED, IN BOTH DIRECTIONS, WHICH IS THE PART A SENSITIVITY
      CHECK MOST OFTEN OMITS. A negative arm (T1) runs the identical procedure on an
      UNCORRUPTED copy in the same scratch location and must NOT flag; without it a flag
      could come from the copying, the JSON re-serialisation, the scratch path or the
      instrument's own nondeterminism, and nothing about sensitivity would follow. Beyond
      that the contract carries two known-false objects for the PREDICATE itself -- a null
      instrument that must score `insensitive` and a promiscuous instrument that must score
      `invalid` -- because a protocol that credits an instrument doing nothing, or one
      flagging everything, is measuring the harness rather than the instrument.
    - >-
      THE PREDICATE IS FROZEN BEFORE THE OUTCOME IS SEEN, AND THIS COORDINATOR HAS ALREADY
      PRE-COMMITTED TO THE CASE WHERE THAT COSTS IT SOMETHING. The review_plan on
      TASK-20260907-6fbd6d records the prior that instrument A will likely score
      `partially_sensitive` because its parent-mismatch message may name the ACTUAL first
      parent without echoing the DECLARED value, so the predicate's declared-value conjunct
      would be unmet even where the defect is plainly surfaced. The remedy is NOT to relax
      the predicate afterwards -- that would require a versioned protocol_amendment -- but to
      widen the RECORDING: every non-detecting cell must carry `defect_surfaced_otherwise`
      verbatim, so a question about the predicate's strictness and a question about the
      instrument's blindness stay distinguishable instead of being settled by whoever writes
      the summary.

  # =====================================================================
  # THE GATE FIELDS, SET EXPLICITLY.
  # =====================================================================
  gate:
    protocol_frozen: true
    protocol_complete: true
    approved_by: coordinator-satic-c49b77-276e
    approved_at: '2026-09-07T09:45:00Z'
    executor_gated_by_queue: false
    executor_gate_note: >-
      The executor is NOT gated at the queue, because the contract is judged complete: the
      queue offers TASK-20260907-39511d once its frozen contract is snapshot-archived. Had
      the contract been incomplete, approved_by would read null and the queue would hold
      the executor. It does not.
    controls_declared_before_execution: true
    negative_arm_declared: true
    known_false_objects_declared: true
    stopping_rule_declared: true
    predicate_frozen_before_outcome: true
    review_plan_written_before_any_reviewer_ran: true
    independent_review_reserved: TASK-20260907-6fbd6d
    review_policy: review-adversarial
    review_effort: xhigh
    review_may_not_be_degraded: true
    terminal_archive_representable: true
    max_concurrent: 1

  # =====================================================================
  # WHAT THIS DECISION DOES NOT AUTHORIZE.
  # =====================================================================
  not_authorized_by_this_decision:
    - >-
      ANY scientific claim, at any scale, about SATIC, summation polynomials, Semaev
      polynomials, SAT encodings, solvers, or the ECDLP. This lane measures a verification
      procedure's sensitivity and nothing else, and its contract says so in its own
      what_this_control_does_not_measure block.
    - No hypothesis status change. GOAL-SATIC-c49b77's active_hypothesis_ids stays empty and RQ-SATIC-1ae57a is untouched.
    - >-
      No goal status change. GOAL-SATIC-c49b77 stays `active`; `paused` and `blocked` are
      refused statuses that tools/validate_ledger.py rejects by name.
    - >-
      No impediment clearance. DEC-20260905-6e8621's disposition stands EXACTLY as it gave
      it: nested IMP-1 cleared, top-level IMP-1 partially cleared, IMP-3 standing, IMP-2
      out of scope. This lane addresses only the FIRST of IMP-3's two separable recheck
      conditions; the second (a served xhigh binding from a credentialed backend,
      probe-verified) is untouched, so IMP-3 cannot clear on this lane's completion alone.
    - >-
      No verdict on the integrity of BATCH-2cca27's five archive bindings. That review
      never ran, and measuring an instrument is not a verdict on the objects it was pointed
      at.
    - No completion criterion. Neither of GOAL-SATIC-c49b77's two criteria is met, approached, or moved by this lane.
    - No unblocking of TASK-20260905-e2c12f or TASK-20260905-86ea49, which stay blocked per DEC-20260905-36847f and DEC-20260905-6e8621.
    - >-
      No repair of the two defects DEC-20260905-6e8621 named for supersession. They are
      carried forward below, untouched.
    - No solver execution, no benchmark, no resource-limit change, no network request, no installation, no Bedrock.
    - No edit to the goal head this turn. This is a snapshot archive, not a ledger archive, and no checkpoint is due.

  # =====================================================================
  # CARRIED FORWARD, NOT REPAIRED. Recomputed here so the carry is first-hand.
  # =====================================================================
  carried_forward_defects:
    - defect: >-
        BATCH-008925's release-bound report.json records findings_summary.by_severity low 5
        / informational 4, where the findings array holds low 6 and informational 3.
      recomputed_by_this_coordinator: >-
        Yes, independently this turn: parsing the findings array gives {medium: 5, low: 6,
        informational: 3}, total 14, against a recorded {high: 0, medium: 5, low: 5,
        informational: 4}. This agrees exactly with DEC-20260905-6e8621's recount.
      unaffected: total 14, high 0, medium 5, highest_severity medium, and the medium ID list are all correct.
      remedy: >-
        A SUPERSEDING RECORD, not an edit. The report is immutable and dd8bb7d6f already
        demonstrated the cost of editing it in place -- it broke the release binding and had
        to be restored at 4172dca7f.
      not_this_lane_s_work: true
    - defect: research_goal.updated_at on the goal head still reads '2026-09-05' after the 2026-09-07 disposition.
      recomputed_by_this_coordinator: 'Yes: line 157 of ledger/goals/GOAL-SATIC-c49b77.yaml reads updated_at: ''2026-09-05''.'
      remedy: The same superseding goal record that resolves FINDING-01's duplicate IMP-1 identifier.
      not_this_lane_s_work: true
    - defect: >-
        The goal head's current_batch_id and dispatch_queue_path still name BATCH-1a527c,
        the campaign's FIRST batch -- not BATCH-008925, not BATCH-2cca27, and not this lane.
      recomputed_by_this_coordinator: 'Yes: current_batch_id: BATCH-1a527c at line 18.'
      why_not_advanced_here: >-
        DEC-20260905-6e8621 declined to advance them because they are shared fields another
        session's lane also reads, and editing them from one lane is the exact shared-record
        write the concurrency contract steers away from. This lane follows that precedent and
        registers itself through the write-once lane side file instead. Consequence stated
        plainly: the goal head does not name this lane, and a reader must consult
        `tools/goal_lanes.py lanes GOAL-SATIC-c49b77` to find it.
      not_this_lane_s_work: true

  # =====================================================================
  # WHERE THE COMMITTED RECORD DIVERGES FROM THE DISPATCHING FRAMING.
  # Recorded because the record wins.
  # =====================================================================
  divergences_from_the_dispatching_framing:
    - framing: >-
        "Copy one archive receipt ... corrupt one declared hash or parent value in the copy"
        -- read together with BATCH-2cca27's contract, which names the receipt for
        TASK-20260905-79a686 as
        coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/archives/TASK-20260905-79a686/snapshot.md.
      what_the_record_shows: >-
        THAT FILE CARRIES NO DECLARED HASH AND NO PARENT VALUE. It is a three-line prose
        note, and its own closing sentence says where they live: "Commit, parent and exact
        path hashes are bound after the real commit in the dispatch queue." The declared
        values are in the `archive` block of task TASK-20260905-79a686 inside BATCH-1a527c's
        authority_queue.json -- commit_sha 9a79547b, parent_sha 26d93c7c, and fifteen
        path_sha256 entries.
      how_this_lane_handles_it: >-
        BOTH files are copied so the receipt pair is complete, and the mutation is applied to
        the file that actually carries the declared values. The substitution is stated in the
        contract under receipt_copied.interpretation_note_read_this_first, with the receipt's
        own sentence quoted as the warrant, rather than performed silently.
      materiality: >-
        Material to executing the clause at all. A literal reading would have nothing to
        corrupt.
    - framing: '"HEAD is 1c0b668ad."'
      what_the_record_shows: >-
        True at session start. The required origin/main merge moved HEAD to 4ed696969, a
        clean merge of 0100b949e with no conflict, from merge-base e6059f4de. Recorded here
        because every archive receipt in this lane binds to a parent.
      materiality: Bookkeeping; no conflict arose and no record was touched by the merge.
    - framing: '"BATCH-2cca27 is closed."'
      what_the_record_shows: >-
        Confirmed -- both BATCH-2cca27.lane.json and BATCH-2cca27.closed.json exist. The
        CONTRACT is not closed with it: DEC-20260905-29416d states that "the approval,
        contract, and task design stand for re-use; what must be revised is the serving
        environment, not the review plan." Executing its checks[5] clause under a new lane is
        therefore consistent with the record rather than a reopening of a closed batch.
      materiality: None adverse; it is the authority for authoring from that clause.
    - framing: >-
        The brief's characterisation of BATCH-008925's control as "1 flag of 17, uncorrelated
        with batch outcome -- a real result".
      what_the_record_shows: >-
        Confirmed verbatim from control_outcome.results_by_set: control set BATCH-cef2eb, 17
        bound entries, 17 exact at named commit, 16 exact in working tree, 1 mismatched
        (ledger/goals/GOAL-SATIC-c49b77.yaml). No divergence.
      materiality: None; corroborated.

  evidence_refs:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-2cca27/contracts/integrity-review.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/contracts/integrity-review.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/report.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/authority_queue.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/archives/TASK-20260905-79a686/snapshot.md
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/contracts/known-bad-control.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/dispatch_queue.json
    - ledger/decisions/DEC-20260905-6e8621.yaml
    - ledger/decisions/DEC-20260905-29416d.yaml
    - ledger/decisions/DEC-20260905-36847f.yaml
    - ledger/goals/GOAL-SATIC-c49b77.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/corrections/CORR-20260907-5afd89.yaml

  independently_verified_by_this_coordinator_while_authoring:
    launch_md_digest_at_9a79547b:
      recomputed: 19f7f4c4b99e6eb952c8ec533dbd13b80f53a438477eb810b35bbf20d349f2f8
      agrees_with_the_receipt: true
    first_parent_of_9a79547b:
      recomputed: 26d93c7c857db115beea37ee862f046f6047058c
      agrees_with_the_receipt: true
    authority_queue_provenance:
      method: git log per path, git rev-parse, git merge-base --is-ancestor
      result: >-
        4c72c94c7b78a04fef16aadd455523aeede5bbbd is the ONLY commit that has ever touched
        coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/authority_queue.json; it is
        an ancestor of origin/main; its own first parent is 9a79547b, the commit the receipt
        binds; and the file's digest at that commit equals its working-tree digest,
        8e74be1586a81db4d7978b907c0f281f18dad15fbd768c81421c95df1c18c518.
    scratch_path_is_outside_the_repository:
      method: git check-ignore -v /tmp, and a resolved-path containment check
      result: >-
        git itself answers "fatal: /tmp: '/tmp' is outside repository at '/workspace'", and
        Path('/tmp').resolve().is_relative_to(Path('/workspace').resolve()) is False.
    findings_severity_recount: see carried_forward_defects[0]; recomputed independently this turn
    queue_renders_clean:
      method: tools/research_dispatch.py with --claims refs
      result: >-
        No dispatch error. All eleven dispatch gates pass, including
        archive_artifact_coverage_complete and claim_relevant_tasks_have_independent_review.
        One Ready Task: TASK-20260907-814b9f.
    deliberately_not_run_by_this_coordinator: >-
      THE CONTROL ITSELF, INCLUDING ITS NEGATIVE ARM. Running T1 to see whether
      tools/research_dispatch.py accepts a scratch copy of the receipt would have partially
      executed the control outside the frozen protocol, and would have let this Coordinator
      know an outcome before freezing the predicate that scores it. That uncertainty is
      recorded as a numbered prior in the review_plan (roughly 60% that instrument A's
      negative arm is clean) rather than resolved in advance.

  # =====================================================================
  # LANE STRUCTURE, AND THE HARNESS DEFECT IT IS BUILT AROUND.
  # =====================================================================
  lane_structure:
    tasks:
      - {id: TASK-20260907-9ceaba, role: coordinator, policy: coordinator-orchestration-code, kind: non-archive, objective: author and approve the frozen protocol and open the lane, archived_by: TASK-20260907-814b9f}
      - {id: TASK-20260907-814b9f, role: coordinator, policy: coordinator-orchestration-code, kind: snapshot archive (runs alone), objective: commit the frozen contract, queue, handoffs and this decision, archived_by: self}
      - {id: TASK-20260907-39511d, role: executor, policy: executor-implementation, kind: non-archive producer (review_required), objective: run the five trials against four instruments and record detection either way, archived_by: TASK-20260907-e7cc96}
      - {id: TASK-20260907-e7cc96, role: coordinator, policy: coordinator-orchestration-code, kind: snapshot archive (runs alone), objective: freeze the run package before any reviewer opens it, archived_by: self}
      - {id: TASK-20260907-6fbd6d, role: validator, policy: review-adversarial, kind: non-archive independent review, objective: attack the four owned joints under the pre-written review plan, archived_by: TASK-20260907-9b71ea}
      - {id: TASK-20260907-c3d2d8, role: coordinator, policy: coordinator-orchestration-code, kind: non-archive, objective: compose the closing disposition worksheet and recompute the verdicts, archived_by: TASK-20260907-9b71ea}
      - {id: TASK-20260907-9b71ea, role: coordinator, policy: coordinator-orchestration-code, kind: ledger archive (runs alone), objective: commit DEC-20260907-6c6137 and the additive goal checkpoint, archived_by: self}
    every_artifact_assigned_to_exactly_one_archive: >-
      9ceaba -> 814b9f; 39511d -> e7cc96; 6fbd6d -> 9b71ea; c3d2d8 -> 9b71ea. Four
      non-archive tasks, each assigned exactly once; no archive archives an archive; the
      dispatcher's archive_artifact_coverage_complete gate passes.
    closing_archive_is_representable_by_design: >-
      CORR-20260907-5afd89 records a queue that COULD NOT represent a terminal archival node
      its opening plan had not anticipated: an archive's source_task_ids may not be empty and
      must name non-archive tasks, each non-archive task may be assigned to at most one
      archive, and every artifact path has exactly one owner -- so a lane whose producers are
      all assigned is closed to any new archive, including the one a lane close needs when a
      planned terminal archive is cancelled unrun. On THIS goal that is not hypothetical:
      TASK-20260905-5681fc's review refused before check 1 under BATCH-2cca27, and the
      top-level IMP-1 records review-adversarial at xhigh as unservable through the adapter.
      TASK-20260907-c3d2d8 is therefore planned into the OPENING queue as an
      unconditionally-running non-archive node, so TASK-20260907-9b71ea always has a source and
      the closing checkpoint is always archivable.
    a_refusal_still_writes_its_artifacts: >-
      Both the executor's and the validator's contracts require both declared artifacts to be
      written even on refusal or early stop. This is load-bearing, not ceremonial: a completed
      archive's path_sha256 must cover every source artifact, so a session that returns nothing
      leaves an archive that cannot bind. TASK-20260905-5681fc's refusal under BATCH-2cca27
      remains durable precisely because it wrote both files.
    reserved_identifier_disclosed: >-
      DEC-20260907-6c6137 is minted, checked free, DECLARED in TASK-20260907-9b71ea's
      artifact_paths and record_ids, and NOT YET AUTHORED. The declaration is forced by the
      dispatcher, which refuses a ledger archive owning no artifact under ledger/decisions/
      whose record_ids do not name it. It is recorded as reserved rather than presented as an
      existing record -- the opposite failure is on record in CORR-20260907-5afd89, where a
      cancelled archive's declared record_ids named records that were never authored.

  known_risks_recorded_now:
    - >-
      THE REVIEW TIER MAY NOT BE SERVABLE. `adapter resolve --policy review-adversarial
      --independent-session` reports review-adversarial -> anthropic:claude-opus-5
      (effort=xhigh), run by this Coordinator this turn -- but that is CONFIGURATION, not a
      probe, and DEC-20260905-6e8621 re-ran `doctor --probe` on 2026-09-07 and found every API
      backend uncredentialed. If TASK-20260907-6fbd6d cannot honour the policy it REFUSES and
      writes a durable refusal; it does not degrade. The consequence is that the CLAIM stays
      un-promoted while the campaign stays `active`, per CLAUDE.md rule 10.
    - >-
      INSTRUMENT B IS WRITTEN BY THE AGENT THAT PLANTS THE MUTATIONS. Pre-registering its
      digest in start.json before the first mutation, and forbidding trial-specific logic,
      bound this without eliminating it. J2 attacks it directly, including by requiring the
      reviewer to build an UNDECLARED mutation and check that instrument B flags that too.
      Instrument A does not carry this limitation, which is one reason it is primary.
    - >-
      THE PRODUCER'S WRITE SCOPE PERMITS WRITES INSIDE THE BATCH DIRECTORY, so a corrupted
      trial copy written there would be scope-compliant while violating the contract's central
      prohibition. A `git status` check alone would not find it. J1's attack plan requires
      enumerating the batch tree and grepping the committed tree for the four planted values.
    - >-
