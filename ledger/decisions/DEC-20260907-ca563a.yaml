      difference is stated in the contract rather than blurred.
    - >-
      This Coordinator's inference provenance, held to the standard it applies to others:
      requested policy `coordinator-orchestration-code`; configured binding
      `coordinator-orchestration-code -> anthropic:claude-opus-5 (effort=high)`, resolved by
