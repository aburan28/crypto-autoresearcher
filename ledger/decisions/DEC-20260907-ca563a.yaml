      backend uncredentialed. A configured binding is not verification and this Coordinator does
      not treat its own as such.
    - >-
      The goal head does not name this lane, by deliberate choice and following
      DEC-20260905-6e8621's precedent on shared fields. A reader looking for it from the head
      alone will not find it; `tools/goal_lanes.py lanes GOAL-SATIC-c49b77` will.
