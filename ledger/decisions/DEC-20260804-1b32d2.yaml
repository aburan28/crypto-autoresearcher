coordinator_decision:
  id: DEC-20260804-1b32d2
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-059
  recorded_by_task: TASK-20260804-048
  archived_by: TASK-20260804-049
  context: >-
    BATCH-059 measured the OIFP MITM volcano mixing constant C across bits=19/20/21.
    8 of 9 reps found collisions. C range: 15.8-260.8 (highly variable, no clear trend).

  decision: inconclusive_continue
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-OIFP-097d1a stays `specified`. Whether C = O(1) (consistent with O(p^{1/4}))
    cannot be determined from 3 reps per bit size. The hypothesis requires:
    (1) Larger sample sizes (n >= 20 per bit size);
    (2) Measurement at larger bit sizes (bits >= 28) to see scaling;
    (3) Analysis of whether C depends on the specific volcano structure (discriminant).

    Given the high variance and small n, this direction (OIFP MITM scaling) requires
    more compute budget than available in the current campaign. The BATCH-059 data is
    valid but inconclusive. H-OIFP-097d1a stays at `specified`.

    ASSESSMENT OF REMAINING UNCERTAINTY: The OIFP MITM is a real algorithm with O(sqrt(class_size))
    birthday-paradox collision cost times a structure-dependent constant C. The key open
    question (does C scale with p?) requires dedicated larger experiments. Given the
    broad GOAL-ECDLP-001 context, continuing to narrow this specific constant is a
    second-order priority compared to finding a target-class exponent improvement.

  exact_next_action: >-
    Push the current branch, merge to PR #160, and continue with the broader GOAL-ECDLP-001
    loop. The OIFP MITM direction is noted as "preliminary signal, C unknown, requires
    larger experiments" and is a candidate for a future dedicated sub-campaign.
    For the current session: look at the full GOAL-ECDLP-001 frontier to determine
    which direction has the highest potential for an exponent-moving result and dispatch
    fresh ideation.

  knowledge_promotion:
    promoted: []
    not_warranted: High variance; no clear C(p) scaling established.

  pareto_integrity:
    dominated_by: L[1/2] class group DLP for OIFP at large p
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
