        what: >-
          J1's corrected statement is recorded here as the reviewed wording
          that any future closure, evidence or knowledge text on the route-(c)
          no-go must carry (review_report.md lines 365-376). Setting: p > 3,
          E/F_p nonsingular, P_1..P_{m-1} in E(F_p) affine, x_i = x(P_i).
          Then S_m(x_1..x_{m-1},T) = c * prod over sign classes eps
          (eps_1 = +1) with sum eps_i P_i != O of (T - x(sum eps_i P_i)),
          with c in F_p^*. It splits completely over F_p. Its degree is
          2^{m-2} minus the number of sign classes summing to O, and is
          exactly 2^{m-2} iff S_{m-1}(x_1..x_{m-1}) != 0. In P^1 its roots
          are the 2^{m-2} values x(sum eps_i P_i) with multiplicity, where
          x(O) = infinity. Frobenius fixes every root, so the cycle type is
          1^{2^{m-2}} on every generic fibre over the factor-base locus.
          Recorded only. EV-MONO-a0a89c and DEC-20260810-2f86db are not edited.
