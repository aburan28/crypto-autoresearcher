coordinator_decision:
  id: DEC-20260807-47db22
  goal_id: GOAL-SSI-001
  batch_id: BATCH-284f63
  recorded_by_task: TASK-20260807-a76f47
  archived_by: TASK-20260807-a76f47

  context: >-
    GOAL-SSI-001's committed next_action named exactly one step:
    "dispatch one bounded Executor run of EXP-SSI-9b542d... then independent
    Validator re-derivation of BCG-1/BCG-2 and RG-1..5 from the run's raw
    output, not from the specification's printed tables." The Executor half
    had already completed (commit a21c1976b, RUN-SSI-9b542d-001,
    self-reported "COMPLETED VALID... No interpretation. Ready for
    /review-evidence") with no independent review following it -- a gap
    between the goal record's own next_action and what had actually landed.
    This decision closes that gap: an independent Validator session
    (TASK-20260807-a76f47) re-derived every checkable gate from raw output,
    and the Coordinator separately re-confirmed the two most consequential
    and independently checkable claims (input-hash byte-exactness via a
    second sha256sum pass; the MONO-3 p_star values via a second, independent
    pull from p_star_table.json) before accepting the Validator's report.

  decision: support

  decision_scope: >-
    This decision closes GOAL-SSI-001's outstanding review gap for
    RUN-SSI-9b542d-001 ONLY. It asserts that the run's self-reported gate
    verdicts survive independent re-derivation from raw data. IT DOES NOT
    TOUCH the four items GOAL-SSI-001's own record separately lists as
    "CORRECTIONS STILL OWED, QUEUED NOT MADE" (EV-WESO-001, EV-SSI-59f7a2,
    EXP-WESOVOW-001/cost_model.py, the NIST-III/V synthesis sentence) --
    those remain open, unresolved, and unchanged by this decision. It also
    does not decide anything about SSI, SQIsign, or the supersingular
    isogeny problem beyond what EXP-SSI-9b542d's own scope_statement.json
    already claims.

  target_ids:
    - EXP-SSI-9b542d
    - H-SSI-7fe2bf
    - RUN-SSI-9b542d-001

  evidence_ids:
    - EV-SSI-0c529c

  rationale:
    review_completeness:
      basis: >-
        Every check the frozen specification designates as mandatory
        (RG-1..5, BCG-1, BCG-2, MONO-1/2/4/5) was independently re-derived
        from raw JSON by TASK-20260807-a76f47, an independent session, per
        the goal's own explicit instruction to work from raw output rather
        than printed tables. BCG-2 specifically was attacked adversarially,
        consistent with the specification's own framing of it as "the first
        control... independently confirmed capable of failing" -- the task
        was to find a reason the PASS is wrong, not confirm the self-report.
        No check disagreed with its archived verdict.
    independent_second_check:
      basis: >-
        Rather than accept the Validator's report on its own authority, the
        Coordinator independently re-verified two of its most load-bearing
        claims from the raw files directly: the byte-exact input-hash match
        (a second, separate sha256sum pass against
        cost_measurements.json/paper_fulltext.md/cost_model.py, matching
        input_hashes.json exactly) and the specific MONO-3 p_star values
        (a second, separate pull of p_star_log2 from p_star_table.json's
        main_grid, confirming 295.263566 at log2_w=80 and 370.685590 at
        log2_w=92.5 to six decimal places). Both independently confirmed.
    mono3_disposition:
      basis: >-
        MONO-3's non-monotonicity is real, not an artifact of the review,
        and per the frozen specification's own on_failure clause ("MONO-1,
        MONO-2, MONO-4, MONO-5 failure INVALIDATES the run as a wiring or
        input defect. MONO-3 failure is a finding.") it does not invalidate
        the run. Its shape is now precisely characterized (reversal at
        w=L_mem(256)=92.5, confined to L1/L2 under MC_P13_CORRECTED) rather
        than left as the bare flag the commit message recorded.

  limitations:
    - >-
      MONO-1 and MONO-4 were accepted on internal-consistency plausibility
      grounds rather than full independent cell-by-cell reconstruction, due
      to grid size (stated explicitly in EV-SSI-0c529c and the underlying
      validation_report.md, not silently upgraded to complete).
    - >-
      Two non-blocking provenance defects are recorded but not resolved by
      this decision: the manifest.yaml/execution_report.yaml commit-identity
      inconsistency, and XCHK-2's undisclosed NOT_IMPLEMENTED status despite
      numpy being present. Neither affects this decision's verdict; both
      should be considered by whoever next touches this experiment's
      provenance metadata.
    - >-
      This decision does not close GOAL-SSI-001. No completion criterion is
      met or approached by a single run's review passing. The goal's
      separately-tracked "CORRECTIONS STILL OWED" list is untouched and
      remains the larger blocker to any future closure.

  next_actions:
    - >-
      GOAL-SSI-001's next_action is updated in this same commit to reflect
      that the Validator step is now complete and name the concrete
      remaining work: the four queued corrections (EV-WESO-001 crossover
      re-anchoring, EV-SSI-59f7a2's SC-1/SC-3 carry-forward, the
      EXP-WESOVOW-001/cost_model.py source-level fix, and the NIST-III/V
      synthesis sentence correction) are the actual remaining blockers to
      any further progress on this goal, and at least one should be
      selected and scoped as the next batch's dispatch.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This decision confirms an existing run's self-report rather than
      establishing a new durable cryptanalytic finding; MONO-3's
      characterization is recorded in EV-SSI-0c529c and this decision, which
      is sufficient provenance for a review-completeness record. It does
      not rise to a KN-FIND-* entry on its own -- it is process evidence
      (a review closed a review gap), not a new result about the
      supersingular isogeny problem.

  decided_by: coordinator
  decided_at: '2026-08-07'
