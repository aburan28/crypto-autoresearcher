  # =====================================================================
  # GOAL-HEAD SCOPE ADJUDICATION -- the explicit in/out decision
  # =====================================================================
  goal_head_scope_adjudication:
    question: >-
      This task card's objective says to update the goal record's mutable head
      (next_action, latest_verified_commit, current_batch_id note, status note)
      "in the ledger commit", while its write_scope does NOT list
      ledger/goals/GOAL-ECDLP-001/goal.yaml. The two cannot both be honoured.
    decision: GOAL.YAML IS OUT OF THIS ARCHIVE.
    reasons:
      - >-
        ASYMMETRIC RECOVERABILITY. research_dispatch.py:1244-1260 treats a
        staged-but-undeclared path as a fatal `extra`, and the ledger archive
        block declares no content_first binding_mode, so the strict exact-set
        rule governs. Exceeding scope is an unrecoverable archive failure that
        would strand the entire disposition; understating it is recoverable by
        a later declared act. When one error is terminal and the other is not,
        the non-terminal one is correct.
      - >-
        THE NAMED FIELD CANNOT BE FILLED FROM INSIDE ITS OWN COMMIT.
        latest_verified_commit must become this archive's commit sha, which
        does not exist while the file is being written.
        templates/research-records.md states the rule directly: do not put a
        commit's own SHA into an artifact within that same commit. Writing it
        would require inventing or self-referencing a value -- precisely the
        fabrication class this batch exists to police.
      - >-
        THE SUBSTANTIVE HEAD CHANGE OWED IS A STATUS TRANSITION, WHICH THIS
        CARD FORBIDS. The head's stale content is its next_action (still
        describing the 2026-08-17 stop with both reviews NOT_OBTAINED) and its
        status, which must become `paused` now that the pause condition has
        fired. This task card sets execution_boundary.official_status_change_authorized
        false. Performing the transition here would breach the boundary;
        touching the head without it would leave the head half-updated and
        internally inconsistent.
      - >-
        PRECEDENT RUNS BOTH WAYS AND THE IN-SCOPE SIDE IS THE SAFER READING.
        f64b0841 (BATCH-a723af) stayed in scope and did not touch goal.yaml;
        9ccd8a0b (BATCH-8c58a3) did include it. Neither binds. CLAUDE.md's
        sharding guidance points the same way: the goal record is the one
        ledger file many campaigns write, and the per-batch checkpoint shard is
        the write-once carrier designed to absorb exactly this content.
      - >-
        THIS ARCHIVE ALREADY CARRIES ONE DIRECTED SCOPE AMENDMENT, for the
        control-plane correction, and that one is a BLOCKING NECESSITY -- the
        archive cannot verify without it. The goal head is not: it is fully
        recoverable. Amending scope where it is necessary and declining where
        it is not is the distinction worth preserving.
    consequence: >-
      The checkpoint shard ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-7d9b78.yaml
      carries everything the head cannot: the batch disposition, the recommended
      goal status, the budget position, the committed-value-as-of-this-archive
      for latest_verified_commit, the enumerated head-reconciliation items, and
      exactly ONE next action. The head remains STALE AS OF THIS ARCHIVE and is
      recorded as such rather than left to be discovered.
    head_reconciliation_is_the_single_next_action: true
    what_the_head_currently_says_and_is_wrong_about:
      - 'status: active -- the pause condition has now fired'
      - 'next_action: describes the 2026-08-17 infrastructure stop with both reviews NOT_OBTAINED; both have since been obtained at the required tier'
      - 'latest_verified_commit: 5a0fdb04127f5829397cfba6e540af09a1b0b876 -- predates this archive'
      - 'dispatch_queue_path: points at dispatch_queue.json, superseded by reference by dispatch_queue.v2.json under CORR-20260817-2b5ab1'
      - 'campaign_budget.maximum_batches is correctly 53 in the OPERATIVE field; VAL-7FA865-N7 reports stale 51 figures in narrative fields, which this task did not audit and asserts nothing about'

