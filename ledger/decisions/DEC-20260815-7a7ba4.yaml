  # =====================================================================
  # ADJUDICATION
  # =====================================================================
  adjudication:
    eight_required_repairs: DISCHARGED_IN_THE_FROZEN_CONTRACT_ON_BOTH_REVIEWS
    eight_required_repairs_detail: 'item-by-item, by ID, in ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-7d9b78.yaml'
    arithmetic_core: 'CONFIRMED. 96 values recomputed at 80-digit precision with ZERO mismatches; 66 candidate integers scanned for transposition and single-digit substitution with ZERO alerts.'
    v4_headline_repair: 'CONFIRMED by two independent parsed-YAML structural diffs: EXACTLY TWELVE restorations matching specification.yaml lines 663-675 and the authoritative checkpoint list item for item, including the prioritized entire missing field.'
    preserved_closures: 'ALL SEVEN INTACT AND UNWEAKENED, plus KAT-PEAK-1..7 byte-identical and the RT-OBJ3/RT-OBJ4 deferrals unchanged.'
    zero_run_static_ceiling: 'HONESTLY STATED. No ECDLP result asserted in either direction, by either reviewer''s search.'
    what_fails: >-
      RECORD INTEGRITY, in the one dimension this chain has been repairing for
      four consecutive batches: a record saying something checkably untrue
      about itself. Five convergent blocking findings, none of them arithmetic
      -- BLOCK-1 false self-report in the frozen specification; BLOCK-2 eight
      found_by credits to two reviews that had not run; BLOCK-3 a verification
      method both asserted and denied; BLOCK-4 an audit trail whose eleven of
      twelve paths resolve against nothing; BLOCK-5 a repair that never reaches
      the operative contract, so the package fails its own KAT-PEAK-F under its
      own stated rule. BLOCK-6 (the report's 1-byte KAT-PEAK-F where the
      contract says 4096) is the only numeric drift anywhere and is not in the
      residuals.
    verdict: REVISE
    chain_may_be_treated_as_closed: false

  rationale:
    - >-
      BOTH independent reviews returned REVISE. A REVISE from either blocks
      treating this repair chain as closed, and a disposition on one review
      would be invalid. Two were obtained, both terminal, both at the required
      tier with no fallback and no degradation.
    - >-
      The five blocking findings are RECORD-INTEGRITY defects, not mathematical
      ones, and each is independently checkable by hand from committed bytes:
      parsed-object equality of two provenance blocks; a git ls-tree showing
      two task IDs with no output; a four-site assertion against a three-site
      denial in the same package; eleven field paths resolving to nothing in
      either document; and one line of arithmetic showing the record's own
      frozen rule returns 0 where its own fixture requires 4096. They are
      exactly the class of defect this batch existed to eliminate, and BLOCK-1
      commits the defect that the block containing it cites CORR-20260815-092c9f
      as the precedent it must not repeat.
    - >-
      THE POSITIVE CONTENT IS RECORDED AT FULL WEIGHT, because under-reporting
      a negative-verdict batch distorts as much as overclaiming. All eight
      repairs are genuinely discharged in the frozen contract; the twelve V4
      restorations are byte-for-byte correct against the frozen baseline on two
      independent parsed diffs; 96 recomputed values produce zero mismatches;
      66 large integers show zero transcription drift; all seven preserved
      closures and the three carried-forward residuals are intact; the
      load-bearing external citation was read at source and checks out; the
      null-object controls are genuine and sharp; and no ECDLP result is
      asserted anywhere. The validator's own summary is that NOT ONE NUMBER
      NEEDS TO CHANGE, and the red team's is that the package did not overreach
      its method ceiling, it failed to describe itself.
    - >-
      NO MATHEMATICAL CONCLUSION FOLLOWS IN EITHER DIRECTION. This is a
      zero-run static package review. Per AGENTS.md rule 3, apparatus,
      capacity, provenance, cap, and budget residuals are never evidence
      against a mathematical hypothesis, and a `failed` validation status means
      the receipt is not yet admissible as evidence, not that anything about
      ECDLP or H-SYC-b854f4 has been learned. No refutation artifact is owed at
      the hypothesis level because no hypothesis-level negative is being
      recorded; the derivation-grade artifacts the reviews did produce are
      statements about clauses of the ARTIFACT and are archived with the
      evidence record that cites them.
    - >-
      THE CAMPAIGN BUDGET IS EXHAUSTED. campaign_budget.maximum_batches = 53
      was set by BUDGET-AMEND-20260815-001 on the user's 2026-08-15 explicit
      instruction, in the OPENING act, not by this batch. 52 checkpoint files
      existed before this one; BATCH-7d9b78's checkpoint is the 53rd and last
      authorized. With a dual REVISE and no positive completion criterion met,
      the goal's first declared pause condition fires on its own terms. That is
      a SCOPED, EXPECTED outcome of a bounded campaign, not a conclusion about
      the science and not a reason to raise anything. A 54th batch is not
      authorized, is not self-grantable, and would require its own amendment on
      its own fresh explicit user authorization.
    - >-
      The archive's own declared path set could not verify as frozen, for a
      reason that had nothing to do with either review: the validator's
      declared receipt path is permanently occupied by the byte-immutable
      failed-probe receipt while the real receipt is at the v2 path
      DEC-20260817-f607d2 itself directed. That is a control-plane defect in
      this program's bookkeeping and it is corrected the only admissible way --
      by a superseding correction and an amended queue, on the
      CORR-20260811-88a263 precedent, with the frozen v1 queue never edited and
      the failed receipt never touched.

