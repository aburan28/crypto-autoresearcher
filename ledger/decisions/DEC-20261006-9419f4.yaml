  context: >-
    /design-experiment, one contract, for IDEA-20261005-79cb0a. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/hyper-79cb0a-prym was created from origin/main at
    868ae268ecb73447ff161d98207af77de4932640 and git merge origin/main
    reported already up to date.

    The contract measures the Prym dimension of the double cover cut out
    by the lex-least quadratic factor of the first admissible genus-2
    sextic over F_11. The prediction is dimension 1. Any other dimension
    is a negative. Outcome B, in which dimension 1 is not obtained, is a
    negative, so success can fail. No Richelot (U, V, W) triple is
    computed. EXP-HYPER-d81a41 remains that formula comparison.

    This session opened ledger/questions/RQ-HYPER-7ca025.yaml,
    knowledge/frontiers/ecdlp/index-calculus/KR-IC-a4dd54.yaml,
    knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml, and the
    arithmetic gate in
    inputs/refs/tasks/ecdlp_index_calculus/p1498_simple_prym_quotient_obstruction.py.
    It read IDEA-20261005-79cb0a from origin/design/cycle-20261005-domain
    and did not copy that file. The Riemann-Hurwitz sentence stays
    provenance recalled. It is not evidence for this approval. The
    approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, the lexicographic seed, replication, budget,
    stopping rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. No field required
    for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A dimension other than 1, or outcome B, is a negative.
    - The repeated-factor rejection, the ramified-line valuation, the subtraction on (4, 1), and the genus-agreement check give the measurement a way to come back invalid rather than as a false dimension.
    - Success is only the first assignment row, so success can fail.
    - No function field was built while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: one sextic over F_11. No transfer to a cryptographic prime.
    - The genus is the routine's genus. Riemann-Hurwitz is a recalled pointer and is not the instrument.
    - A failed control does not falsify the sextic prediction. It rejects the instrument.
    - This decision authorizes a later run. It does not start one.
    - The recalled Riemann-Hurwitz sentence is not support.

