# =========================================================================
# DEC-20260801-012
#
# Coordinator decision on HOW the two TASK-20260801-069 preconditions are
# discharged. It decides a repair METHOD and records an integrity finding
# about the gate. IT DECIDES NOTHING ABOUT ANY HYPOTHESIS, APPROVES NO
# EXPERIMENT, AUTHORIZES NO RUN, AND DOES NOT DECIDE WHETHER
# TASK-20260801-069 MAY APPROVE.
# =========================================================================
coordinator_decision:
  id: DEC-20260801-012
  context: >-
    RTB-068 (TASK-20260801-068) returned PASS with recommendation_to_task_069
    APPROVE, conditioned on two preconditions being satisfied BEFORE
    TASK-20260801-069 records anything - (1) DEF-065-1 repaired by a superseding
    RUN-LPF-001-plantz manifest record that makes tools/validate_ledger.py stop
    erroring, because an approval gate that reads an erroring run record is an
    integrity gap and RR-LPF-2 itself says so; and (2) DEF-068-C recorded, so
    RR-LPF-1's wrong row-index parenthetical is superseded on the record rather
    than silently deleted. This decision records how both were discharged and
    what could not be.
  decision: supersede
  target_ids:
  - EXP-LPF-001
  - RUN-LPF-001-plantz
  - DEF-065-1
  - DEF-068-C
  - CORR-20260801-003
  - TASK-20260801-069

  rationale:
  - >-
    REPAIR BY SUPERSESSION, NEVER BY EDIT. The plantz manifest is hash-bound at
    c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4 in the
    TASK-20260801-064 archive receipt at snapshot aaf7672c. Editing it in place
    would invalidate an attested receipt over a pushed run record, which
    AGENTS.md core rule 4 and the durable-commit clause forbid, and which
    RR-LPF-2 and RTB-068 both expressly rule out.
  - >-
    THE SUPERSEDING RECORD IS ADDITIVE AND SOURCED FIELD BY FIELD. Its
    `environment`, `inputs` and `resources` blocks are populated only from
    artifacts that already existed - environment.json, command.txt,
    git_status_prerun.txt, stdout.log, stderr.log, the prior manifest's own
    `parameters` and `timing` blocks, plant_z_regen.py at its hash-bound sha256,
    and the TASK-20260801-063 execution report. Nine fields that no artifact
    records are marked missing rather than invented.
  - >-
    THE PATH FOLLOWS THIS CAMPAIGN'S OWN SUPERSESSION CONVENTION - a `_v2`
    sibling in the same directory, as reading_rule.yaml was superseded by
    reading_rule_v2.yaml - and is deliberately NOT named manifest.yaml, because
    tools/validate_ledger.py globs experiments/*/runs/*/manifest.yaml and two
    files claiming run id RUN-LPF-001-plantz would raise an unsuppressable
    duplicate-ID error.
  - >-
    PRECONDITION 1 IS ONLY HALF SATISFIABLE BY ANY RECORD, AND THAT IS STATED
    RATHER THAN GLOSSED. The validator discovers runs by path glob and has no
    notion of supersession, so it will keep erroring on the prior manifest for
    as long as that file exists unedited. The substance of DEF-065-1 is closed;
    the mechanical half is not. NO ARTIFACT OF THE CLASS THE REVIEWER NAMED CAN
    CLOSE BOTH HALVES.
  - >-
    THE THREE SHORTCUTS THAT WOULD HAVE MADE THE ERROR DISAPPEAR ARE ALL
    REFUSED - editing the frozen manifest; adding the two lines to
    tools/validate_ledger_baseline.txt, whose own header states lines may only
    ever be removed and that adding one to absorb a new violation defeats the
    check; and registering the manifest in tools/legacy_run_inventory.yaml,
    which grandfathers records that PREDATE the validator, which this one does
    not. A clean gate obtained by weakening the gate is not a clean gate.
  - >-
    THE ONLY CLEAN MECHANICAL FIX IS A REVIEWED TOOL CHANGE - a supersession
    registry read by check_run - and it must not be made by the session whose
    record fails the gate. Changing a gate to accommodate a record that fails it
    is otherwise indistinguishable from moving a success criterion after seeing
    the outcome, which is permitted only under a versioned protocol_amendment.
  - >-
    DEF-068-C IS DISCHARGED BY RECORD, NOT EDIT. RR-LPF-1's fragment is quoted
    verbatim - "Re-derived in this session from the archived table (rows 199 and
    206 of 210 in row order) and identical to the validator's numbers" - and the
    correct zero-based indices 201 and 208 (202 and 209 one-based) are recorded
    as RTB-068-1, attributed to the reviewer's recomputation. This session has
    no shell and did not recompute them, and says so. reading_rule_v2.yaml at
    9515f6a1 is not touched.
  - >-
    DEF-068-A, DEF-068-B, DEF-068-D and the unverifiable ninth-bullet removal
    are recorded as CARRIED, not repaired, each owed to a future superseding
    record. The reviewer's ruling that V12 and the AP-3 renumber sit inside
    change (a) is carried as ruled and is not re-argued.
  - >-
    THE ANTI-TUNING EVIDENCE IS PRESERVED IN THE CORRECTION RECORD BECAUSE THAT
    IS WHERE IT WOULD OTHERWISE BE LOST. Of the three moving_rungs differences,
    DIFF-1 (-0.8821222632527359, flag false) and DIFF-2 (-0.9379576220999121,
    flag false) go AGAINST the experiment and DIFF-3 (+1.5724157930250209, flag
    true) goes IN ITS FAVOUR - and DIFF-3 is precisely the one a selective
    repairer would have omitted, since RTB-054-3 had declared it "not a REVISE
    ground on its own". Net direction of the repair - AGAINST the experiment,
    four unfavourable deltas to two.

  evidence_refs:
  - >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/contract_review.yaml
    (RTB-068, verdict PASS, DEF-068-A/B/C/D, def_065_1_recorded_as_owed)
  - >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/supersession_diff_check.md
    (DIFF-1/2/3 table)
  - >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/anti_tuning_check.md
    (net direction, four against two)
  - >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260801-064/snapshot_commit_receipt.json
    (the hash binding of the prior manifest)
  - >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260801-063/execution_report.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest_v2.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
  - experiments/EXP-LPF-001/reading_rule.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - ledger/corrections/CORR-20260801-003.yaml
  - tools/validate_ledger.py

  limitations:
  - >-
    THIS DECISION DOES NOT DECIDE WHETHER TASK-20260801-069 MAY APPROVE. It
    supplies the two artifacts that precondition asked for and states exactly
    which part of precondition 1 remains unmet. The approval determination is
    TASK-20260801-069's, on the reviewer's own terms, which are that if either
    precondition cannot be satisfied then 069 must not approve.
  - >-
    NO HYPOTHESIS MOVES AND NO DISPOSITION IS STATED. H-LPF-001 is untouched.
    No evidence record is created, amended or cited as support or refutation.
  - >-
    NO RUN IS AUTHORIZED. RUN-LPF-001-measure remains unapproved and its gate is
    untouched.
  - >-
    CLAIM TIER TOY. Two toy field cells at p = 46663 and p = 767551, D = 2**32
    and 2**40. Nothing here transfers to cryptographic scale.
  - >-
    THE CORRECTED ROW INDICES 201 AND 208 REST ON RTB-068's RECOMPUTATION AND
    NOT ON THIS SESSION'S. This session had no shell, recomputed no hash, opened
    no archived array and ran no tool. The DEF-068-B row ranges are consistent
    with both the wrong and the right indices and do not independently
    corroborate the correction.
  - >-
    THE SUPERSEDING MANIFEST RESTATES SOME FIELDS OF A FROZEN RECORD AND
    RESTATEMENT CARRIES TRANSCRIPTION RISK. The record declares the prior
    hash-bound manifest as governing on any discrepancy, so the risk is bounded
    and declared rather than eliminated.
  - >-
    INDEPENDENCE IS PROCEDURAL, NOT MODEL-LEVEL. Every review, validation and
    freeze in this campaign resolves to the same model under this harness.
    Nothing here may be presented as independent-model agreement.

  next_actions:
  - >-
    TASK-20260801-069 reads CORR-20260801-003 and manifest_v2.yaml and makes its
    own approval determination, treating precondition 1 as SUBSTANTIVELY met and
    MECHANICALLY unmet. If it holds the reviewer's wording literally, it does not
    approve and instead schedules the validator supersession task first.
  - >-
    Archive this decision, CORR-20260801-003 and
    experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest_v2.yaml in ONE
    ledger archive task that stages exactly those three declared paths, and
    verify the post-commit receipt before either is treated as durable.
  - >-
    Open a separate, independently reviewed task for the validator supersession
    registry in tools/validate_ledger.py. It must not be executed by a session
    whose record fails the gate, and it must handle list-valued
    inputs.parameters.field_bits in tier_of_run, which currently raises
    TypeError rather than emitting an error line.
  - >-
    Run tools/validate_ledger.py against the tree BEFORE staging any archive
    commit, as CORR-20260801-002 already recorded and as the TASK-20260801-063
    completion gate failed to do.
  - >-
    Carry DEF-068-A (register completeness) and DEF-068-B (normalisation
    declaration) into the next superseding reading-rule record, if one is ever
    written.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. This is a record-integrity repair with no measurement, no
      evidence record, no evidence strength and no research claim. It is not an
      evidence-review decision, nothing reaches replicated or strong, and no
      durable finding about ECDLP, smoothness or any hypothesis follows from it.
      Promoting a schema repair into knowledge/findings/ would dilute the corpus
      with process bookkeeping.

  decided_by: coordinator
  decided_at: '2026-08-01'

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
