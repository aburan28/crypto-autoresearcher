coordinator_decision:
  id: DEC-20260904-c4be2f
  context: >-
    Composes independent Validator (J1/J2 hold, full from-scratch
    reproduction, independently proved h_+ != h_- sufficient for
    non-coincidence) and Red Team (J3/J4: correction completeness audit,
    exact coincidence-set characterization, tight fix recommendation)
    review of EXP-MONO-98abb2, per review-plan TASK-20260904-f8c4dd. Both
    reviewers confirm the run's own arithmetic is correct and confirm the
    Coordinator's self-disclosed CORR-20260904-e526e0's core finding, while
    also finding it incomplete -- addressed in the superseding
    CORR-20260904-b9f9c1. See EV-MONO-b967e0 for the full evidentiary
    summary.
  decision: revise
  decision_label: >-
    additive_form_confirmed_but_non_discriminating_at_the_unique_coincidence_point_h_plus_equals_h_minus_equals_1_correction_superseded_severity_upgraded_tight_followup_filter_proven_next_experiment_designed
  target_ids:
    - H-MONO-1297d7
    - IDEA-20260904-4f614a
    - EXP-MONO-98abb2
    - RQ-MONO-001
    - EV-MONO-b967e0
    - CORR-20260904-e526e0
    - CORR-20260904-b9f9c1

  hypothesis_status_before: proposed
  hypothesis_status_after: inconclusive_confirms_additive_form_non_discriminating_at_coincidence_point
  hypothesis_status_after_note: >-
    H-MONO-1297d7's own two-sided prediction does not cleanly resolve to
    either outcome (I) or (II) as originally stated: the additive form
    DID match exactly (the "matches D_sum" half of outcome (I)), but the
    named multiplicative rival was NOT excluded (the "and NOT D_prod"
    half fails) -- not because the additive form is wrong, but because
    the found curve sits at h_+=h_-=1, the UNIQUE point in the admissible
    search domain where D_sum and D_prod are algebraically identical
    (independently proven by both reviewers: D_prod-D_sum =
    h_-(h_+-1)n_+ + h_+(h_--1)n_-, zero iff h_+=h_-=1). This is neither
    "supported" (the rival was not actually excluded, contrary to this
    hypothesis's own falsification design) nor "refuted" (the additive
    form did match, and matched correctly). Recorded as inconclusive with
    an explicit successor (next_action) using a proven-tight corrected
    filter (max(h_+,h_-)>=2) that provably cannot land on a coincidence
    point.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: active
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-1297d7
        from: proposed
        to: inconclusive_confirms_additive_form_non_discriminating_at_coincidence_point
    experiment_status_changes:
      - experiment_id: EXP-MONO-98abb2
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped to the m=4 symmetric-base distinct-split (Z=3) stratum, toy
    scale, one curve with h_+=1, h_-=1. Supports: the additive form
    continues to hold when both terms are nonzero on at least this one
    point. Does NOT support or refute discrimination against the
    multiplicative rival (undetermined by this run specifically). Does
    not test the non-split strata, relation-rate, cost, exponent, or
    cryptographic-scale claims. Does not re-scope H-MONO-93bc4d.

  rationale:
    - >-
      AN INCONCLUSIVE RESULT IS RECORDED AS INCONCLUSIVE, NOT ROUNDED UP
      TO "SUPPORTED" BECAUSE THE HEADLINE NUMBERS MATCHED: per AGENTS.md
      rule 4 and this program's own closure standard, a hypothesis whose
      own falsification design specifically required excluding a named
      rival cannot be called supported when that exclusion did not occur,
      regardless of how clean the raw match looks. This mirrors
      DEC-20260904-46b71e's own earlier discipline (recording
      partially_supported rather than supported when a single h_-=1 point
      could not discriminate functional form) -- the SAME care is applied
      here to a different, newly-surfaced degeneracy.
    - >-
      THE SUPERSEDING CORRECTION UPGRADES SEVERITY BECAUSE THIS IS A
      RECURRENCE, NOT A FIRST INSTANCE: Red Team's own finding that this
      exact class of "search lands on the minimal, most-degenerate
      admissible point" failure already occurred once in this sub-thread
      (EXP-MONO-4e6faa's own h_-=1 curve) and was fixed ONLY for that
      specific dimension (h_->=2), not generalized to the new bivariate
      filter, is accepted in full. This Coordinator's own original
      correction (CORR-20260904-e526e0) under-weighted this because it
      did not explicitly connect the two instances -- corrected now.
    - >-
      THE TIGHT, PROVEN FIX IS ADOPTED OVER THE ORIGINAL, MERELY-SUFFICIENT
      ONE: both reviewers independently derived that "h_+ != h_-" avoids
      the coincidence, but Red Team's own closed-form identity shows the
      coincidence set is the single point (1,1), not the full diagonal --
      so "max(h_+,h_-)>=2" is adopted as the corrected follow-up's own
      Stage-0 filter, since it is proven necessary and sufficient and does
      not needlessly exclude valid discriminating curves like h_+=h_-=2.
    - >-
      A NAMEABLE METHODOLOGICAL LESSON IS RECORDED FOR THE SUB-THREAD, NOT
      JUST THIS ONE EXPERIMENT: "Stage-2 comparator degeneracy at a
      Stage-0 filter's own minimal threshold" is now a NAMED failure mode
      in this program's own vocabulary for this sub-lane, per
      CORR-20260904-b9f9c1's own finding_1. Every future experiment in
      this sub-thread that compares a formula against a named rival should
      check this before freezing its own specification, not merely react
      after a run exposes it a third time.

  next_action: >-
    HIGH PRIORITY: design and dispatch a corrected follow-up (H-MONO-1297d7's
    successor, a new hypothesis ID) testing the additive form against the
    SAME named multiplicative rival, with Stage-0 filter "Z=3 AND
    max(h_+,h_-) >= 2" -- proven, not merely hoped, to guarantee
    discrimination on whatever curve the fixed search order finds. This is
    the genuinely decisive completion of the bivariate test this decision
    leaves open.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This run's own comparison is non-discriminating (see
      hypothesis_status_after_note); promoting anything about the full
      bivariate form to the knowledge corpus now would be premature.
      KN-FIND-edd62c's own existing scope (h_-, h_+=0 slice) is unaffected
      and remains promoted as-is. Promotion of the bivariate extension is
      deferred to the corrected follow-up named in next_action.

  procedure_deviations:
    - >-
      CORR-20260904-e526e0 (this Coordinator's own prior correction) is
      SUPERSEDED, not amended, by CORR-20260904-b9f9c1, per AGENTS.md rule
      4's immutability requirement -- disclosed here as the procedural
      trail this decision itself completes.

  limitations:
    - >-
      One curve (p=103, A=1, B=11), one prime. Does not discriminate the
      additive form from the named rival; see next_action.
    - >-
      Toy scale only. No cryptographic-scale claim.
    - >-
      Does not re-scope H-MONO-93bc4d's own already-closed collision-rate
      formula.

  reviewed_by: [validator, red-team]
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
