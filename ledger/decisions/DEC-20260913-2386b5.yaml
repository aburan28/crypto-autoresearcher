coordinator_decision:
  id: DEC-20260913-2386b5
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-e9cb45
  archived_by: TASK-20260913-e9cb45
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: weaken
  decision_label: >-
    Compose the EXP-SEMBIN-92724f half of REVIEW-SEMBIN-20260913-run2 (J4, J5), which
    closes the round. H-SEMBIN-c59e50 moves approved -> weakened in its tested scope:
    two of its own falsification conditions fired as frozen -- the coset-typed image
    ratio is not m! at any of seven exhaustive cells, and the typed objective has an
    interior minimum -- and the independent validator shows both firings are real and
    both fall outside what the hypothesis is for: m! was the wrong finite-k
    denominator at every tested cell, and the interior minimum is 0.086 bits of
    flatness from an O(log n) term. The exponent localisation to log2(m!) stands
    unrefuted; the yield heuristic HEUR-YT is untested in regime. Record one
    Coordinator prior as confirmed and one as partly overturned. Adjudicate the run's
    halt-and-continue deviation. Leave the KN-FIND-9643e7 closure question open, as
    the plan's unrecorded prior expected. Name the successor. Promote nothing.

  context: >-
    RUN-SEMBIN-cbd770 (EXP-SEMBIN-92724f, 7 cells x 160 draws exhaustive in arm D,
    arms A-C and eight controls in 64 s) was snapshot-archived by TASK-20260913-a10003
    in commit 24f5a574a before any reviewer ran. The review plan for the round was
    written and committed with the Coordinator's priors before either validator was
    dispatched. The EXP-SEMBIN-354a75 half (J1, J2, J3, J6-BLIND) was composed and
    archived first under DEC-20260913-3b51c8 (TASK-20260913-c44484), with that
    ordering recorded as PD-D. TASK-20260913-7ca970 owning J4 and J5 was dispatched
    twice: attempt 1 stopped on the backend usage limit with no artifact
    (DEC-20260913-c224bb), attempt 2 ran on the authorized fallback model and returned
    holds / holds with the qualifications composed in EV-SEMBIN-4614e7. This decision
    is written by the Coordinator session that also wrote the plan; the independence
    it rests on is the validator's, and tools/check_review_independence.py is run on
    the composed round before this record is archived, with its result recorded in the
    J4/J5 addendum.

  target_ids:
    - H-SEMBIN-c59e50
    - EXP-SEMBIN-92724f
    - RUN-SEMBIN-cbd770
    - EV-SEMBIN-4614e7
    - REVIEW-SEMBIN-20260913-run2

  official_transitions:
    H-SEMBIN-c59e50:
      from: approved
      to: weakened
      basis: >-
        Of nine preregistered predictions, exact_image_size_ratio_typed_over_untyped
        (= m! within 10% at every cell; the declared gate) FAILS at 7 of 7 cells under
        every-draw scoring with the m!/2 falsification threshold crossed at every cell
        (EV-SEMBIN-4614e7 O-2, validated J4), and typed_surface_monotonicity_in_m
        (monotone decreasing, no interior optimum) FAILS at every tested n under the
        unceiled reading with the missed term named as log2 m (O-5, validated J5).
        The validator's qualifications are part of the basis: the m! denominator is
        the 2^k >> m^2 limit of the exact counting cap and none of the seven cells is
        inside HEUR-YT's own regime mk <= n-3, with the cap already below m!/2 at
        three cells before any curve is consulted (O-3); and the interior minimum is
        0.086 bits, reading-dependent, and vanishes under ceil(n/m) with capped yield
        at n = 571 (O-6). The remaining predictions -- exponent_carrier_derivation,
        typed_minus_untyped_stage1_saving_bits, builder_identity, affine_invariance,
        required_degree_floor -- are reported met by the producer and were NOT
        assigned review joints (O-7, O-8); fibre_size_distribution and
        lemma2_typed_hypothesis_failure_rate were likewise not reviewed. `weakened`
        rather than `rejected` because the refutation closes only cells outside the
        heuristic's stated regime (rule 6) and the hypothesis's central claim -- that
        log2(m!) is the unique exponent-setting rising term of eqs. (15)-(16) --
        survives J5 and is reinforced by the unreviewed arm-A arithmetic; rather than
        `supported` because two frozen falsification conditions fired exactly as
        written and no reviewer has passed arms A-C. The hypothesis's zero-cost clause
        and HEUR-YT are untested, not established.
    EXP-SEMBIN-92724f:
      from: completed
      to: analyzed
      basis: >-
        Evidence record EV-SEMBIN-4614e7 written and archived under this decision.
        The contract head was left at `approved` when RUN-SEMBIN-cbd770 was archived
        by TASK-20260913-a10003; a `completed` status_history entry is recorded on
        the head under this archive so that this transition is reachable, following
        the pattern DEC-20260913-3b51c8 used for EXP-SEMBIN-354a75.

  confirmed_priors:
    - joint: J5
      prior: >-
        "I EXPECT J5 TO BREAK THE HYPOTHESIS AND NOT THE RUN ... an interior minimum
        that shallow may be real and useless."
      finding: >-
        Confirmed on both halves. The argmin m = n ln 2 reproduces from an independent
        symbolic dT/dm; the depth 0.086 bits is real on the unceiled reading and is
        flatness (6.1% linear, 76 of 99 feasible m within 1 bit of the boundary at
        n = 100); the prediction's wording fails and its research content does not.
        The validator added what the prior did not have: the labelling defect
        between the producer's (1+omega')u closed form (0.258 bits) and the numerical
        total it minimises (0.086), and the disappearance of the gap under
        ceiled+capped at n = 571.
      by: TASK-20260913-7ca970
  refuted_priors:
    - joint: J4
      prior: >-
        "I EXPECT J4 TO HOLD ... My prior is that coset typing recovers substantially
        LESS of the m! symmetry factor than H-SEMBIN-c59e50 predicted. ... the
        denominator convention and that 68.47 outlier are where I think it is most
        likely to be wrong."
      finding: >-
        The hold is confirmed and the reading is partly overturned. The negative
        result survives exhaustiveness, degenerate-draw and outlier attacks exactly
        as expected. But "typing recovers substantially less of m!" was the wrong
        frame: at these cells m! was never on offer. The exact x-coordinate cap
        2^{mk}/C(2^k+m-1, m) is below m!/2 at three of seven cells as an integer
        identity, and against that cap the typed image tracks its domain (cell
        medians 0.38-2.00). The denominator was indeed where the prior said the
        result was most likely to be wrong; what it found there does not reverse the
        scored miss but re-scopes what the miss means, from "typing fails to recover
        the symmetry factor" to "the frozen prediction was unattainable at the
        enumerable cells". The 68.47 draw is a real completed enumeration in the
        starved-untyped corner, not a rule violation. Partly overturned.
      by: TASK-20260913-7ca970

  procedure_deviations:
    - id: PD-D
      what: >-
        Already recorded in review-plan-addendum-PD-D.yaml: the 354a75 half was
        composed and archived before 7ca970 ran, exposing one-word J1-J3/J6 verdicts
        inside 7ca970's read scope. Restated here because this is the composition it
        was recorded for.
    - id: PD-E
      what: >-
        TASK-20260913-7ca970's attestation reports that it read review-plan.yaml in
        full -- including the joint_outcomes and procedure_deviations_addendum blocks
        -- BEFORE reading PD-D's instruction not to, and that a grep of
        dispatch_queue.json for its own handoff returned sibling completion notes
        naming J1/J2/J3/J6-BLIND verdicts. It attests those blocks and notes were not
        used for J4 or J5. The exposed material concerns EXP-SEMBIN-354a75 and eq.
        (11); J4 and J5 concern the coset-typed image ratio and the typed objective
        on a different run. The Coordinator weighs this as a declared, bounded
        blindness break with no path to either verdict, and composes J4/J5 with it
        recorded rather than discarding a review that would otherwise have to be
        re-run on the same exposed files.
    - id: PD-F
      what: >-
        The J4/J5 composition is written to a NEW write-once file,
        review-plan-addendum-J4J5.yaml, and not appended to review-plan.yaml. The plan
        is bound by content hash in TASK-20260913-c44484's completed archive; an
        in-place append would break that binding, which is what the PD-D addendum
        already learned at 20:05Z. The plan's own text says a further change to it is
        a superseding record; this is that record, scoped to J4/J5 outcomes.
    - id: PD-G
      what: >-
        ADJUDICATION of the run's own recorded deviation (raw-result.json
        protocol_deviation_continuation): the run did not halt after arm D's gate
        fired and ran phases 1b-5. Ruling: the halt rule's stated purpose was ORDER and
        COST; arm D ran first and its observation was complete and self-contained
        before any later phase, and the continuation spent 64 s of 3600. Phases 1b-5
        are RETAINED as observations (EV-SEMBIN-4614e7 O-7, O-8, marked unreviewed)
        and are not surplus to be disregarded; they are also not validated evidence,
        because no review joint was assigned to them. The successor contract must fix
        the precedence between stopping_rules[0] and the completion gates explicitly.
    - id: PD-H
      what: >-
        The contract's frozen k-reading clause required Table 3 to reproduce to 0.7%
        under BOTH the unceiled n/m and ceil(n/m) readings; the producer shows the
        second is unsatisfiable because Table 3's arithmetic uses non-integer n/m
        (35/36 vs 20/36). Recorded as a contract-wording defect, not a baseline
        failure; the frozen specification is not edited beyond its status_history.

  rationale:
    - >-
      WHAT THE MEASUREMENT SETTLES. At seven toy cells the exact typed-over-untyped
      image ratio is not m! and is not within a factor of two of it at any cell;
      the enumeration is exhaustive and an independent reconstruction closes every
      conservation identity (EV-SEMBIN-4614e7 O-1, O-2). The typed cost objective
      under GG's three substitutions has an interior critical point at m = n ln 2 of
      depth 0.086 bits on the unceiled reading (O-5). Both are validated J4/J5
      findings.
    - >-
      WHY `weakened`. The hypothesis froze a gate it could not pass at any
      enumerable cell: m! is a limit the cells do not approach, and the run's own
      layer D1 and the validator both say so (O-3). A gate that fails for a reason
      that has nothing to do with the hypothesis's mechanism still fails -- the
      status must move -- but it does not refute the mechanism. Likewise a monotone-
      decrease prediction that fails by 0.086 bits has failed and is recorded as
      failed, and its research content (log2(m!) as the exponent-setting term) is
      intact. A hypothesis whose frozen tests both fire while its central claim
      stands untouched and its supporting arms are unreviewed is weakened, not
      rejected and not supported.
    - >-
      WHY NOT `rejected`. Rule 6: negative evidence closes only the exact tested
      scope. The scope closed is "coset typing recovers the m! factor in distinct
      group sums at (n, k, m) with |F| = 3-25 and mk > n-3", which is outside HEUR-YT
      as the hypothesis stated it. Rejecting the hypothesis on cells where its
      prediction was arithmetically unattainable would put a false closure in the
      ledger with the same confidence as a true one.
    - >-
      WHY NOT `inconclusive`. Two preregistered falsification conditions fired as
      written and were independently validated; the evidence is not ambiguous about
      what happened, only about what it bears on. `inconclusive` would hide a
      contract-design defect the program should record: the Coordinator that approved
      EXP-SEMBIN-92724f (DEC-20260913-cb5ee2) re-derived c', c and the floor
      coefficients and did not check that the frozen m! prediction was reachable at
      the frozen cells. That is the same class of defect as PD-F in
      DEC-20260913-92aa48 (a contract integer counting non-rational solutions) and is
      recorded here so the next design checks the gate's attainability before
      freezing it.
    - >-
      THE CLOSURE QUESTION STAYS OPEN. DEC-20260913-3b51c8 next_actions asked whether
      the two halves of this round together change KN-FIND-9643e7 /
      DEC-20260913-74e208's eq. (11)-conditional closure (t = m optimal). They do not
      and cannot: the 354a75 half measures eq. (11)'s Poisson link at t = m in eight
      of nine cells and has no t < m versus t = m comparison; the 92724f half does not
      touch eq. (11) at all -- it measures group-sum images of typed families and a
      cost-model shape. The plan's "a_prior_i_am_deliberately_not_recording" expected
      exactly this. The finding remains conditional on eq. (11) and the condition is
      now known to fail at the probability level by 18-22% for the low-degree window
      at t = 2 (EV-SEMBIN-d40877 O-5); whether that failure has any t-dependence is
      the successor's question, not this decision's.

  next_actions:
    - >-
      Design the in-regime successor to arm D via /design-experiment: cells with
      2^k >> m^2 and mk <= n-3 (HEUR-YT's own clause), which cannot be enumerated
      exhaustively at 2^{mk} <= 2^{17} and must be estimated by preregistered sampling
      of the typed and untyped image with a stated estimator and interval, scored
      against the exact cap 2^{mk}/C(2^k+m-1, m) rather than m!, with the counting-cap
      attainability of every frozen threshold checked and written into the contract
      before approval. Carry the saturation and starvation corners (O-4) as declared
      degenerate classes. Ranked ECC work under AGENTS.md "ECC comes first"; not
      dispatched by this decision.
    - >-
      Put arms A, B and C under review joints in that successor or in a dedicated
      review round: the coefficient-wise builder clause needs a reviewer to say
      whether count-plus-degree-3-support identity satisfies it (O-8), and the
      required-degree floor and the log2((m-1)!) savings are the hypothesis's
      quantitative deliverables and are currently producer-only figures (O-7).
    - >-
      Fix, in the successor contract, the precedence between stopping_rules[0] and
      the completion gates (PD-G) and the k-reading clause (PD-H).
    - >-
      Carry the validator's Nagao pointer -- arm D measured the coset-typed family,
      not EQS3/EQS4 -- to whoever holds the Nagao lane, via the bus, as a pointer and
      not a finding.
    - >-
      Close REVIEW-SEMBIN-20260913-run2: all six joints are now composed
      (J1-J3, J6-BLIND in EV-SEMBIN-d40877; J4, J5 in EV-SEMBIN-4614e7).

  evidence_refs:
    - EV-SEMBIN-4614e7
    - RUN-SEMBIN-cbd770
    - coordination/review/sembin-20260913-run2/TASK-20260913-7ca970/report.md
    - coordination/review/sembin-20260913-run2/TASK-20260913-7ca970/scratch/j4_j5_out.json

  citations:
    - claim: >-
        m! is the 2^k >> m^2 limit of 2^{mk} / C(2^k+m-1, m) = m! / prod_{j<m}
        (1 + j/2^k).
      source: elementary integer identity, re-derived in TASK-20260913-7ca970 report.md and verified at all seven cells
      provenance: internal
      verified_by: TASK-20260913-7ca970
    - claim: >-
        HEUR-YT as stated carries the clause mk <= n-3.
      source: ledger/hypotheses/H-SEMBIN-c59e50.yaml
      provenance: internal
      verified_by: TASK-20260913-7ca970
  citations_note: >-
    The attribution of the three typed substitutions to Galbraith-Gebregiyorgis
    ePrint 2014/806 section 4.2 is NOT cited here: the validator marks it `recalled`
    (relayed through H-SEMBIN-c59e50 structural_ingredients, not opened in its task)
    and a recalled source may not back a decision (AGENTS.md rule 9). Nothing in the
    status transition depends on it; the transition rests on the run's measurements
    and the validator's re-derivations. Where the substitutions come from is the
    hypothesis record's provenance question, not this decision's.

  limitations:
    - >-
      NOTHING IN THIS DECISION IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION.
    - >-
      Toy scale: n <= 17 and |F| <= 25 in arm D. HEUR-YT's regime is not reached by
      any cell; transfer is not made.
    - >-
      Arms A, B, C and the baseline are unreviewed producer figures. This decision
      cites them as observations only.
    - >-
      No degree is measured or asserted anywhere in the round; HEUR-A1T is untested.
    - >-
      Evidence strength is `preliminary`: one run, one validator on two joints, one
      fallback-model session with model_verified false.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Strength is preliminary and the decision is `weaken`, so no promotion is
      required; none is made. The reusable content (the exact finite-k counting cap
      as the correct denominator; the 0.086-bit flatness) is deferred with the reason
      recorded in EV-SEMBIN-4614e7 knowledge_promotion_reason.

  standing_user_authorization:
    cited: '2026-09-06: "all is approved. ideas/experiments should be always approved"'
    applied_to: []
    note: >-
      This decision approves nothing; it composes a review and moves a hypothesis
      status, which is Coordinator authority under AGENTS.md and needs no user
      authorization. The successor design named in next_actions will cite the
      standing authorization when its contract is complete.
