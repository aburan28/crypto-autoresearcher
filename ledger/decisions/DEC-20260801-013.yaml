  part_4_proportion:
    the_observation_stated_plainly: >-
      THREE CONSECUTIVE BATCHES HAVE CLOSED WITHOUT RUNNING, EACH FOR A CORRECT
      REASON. BATCH-024 on a contract review; BATCH-025 on RTB-054-1, a reading
