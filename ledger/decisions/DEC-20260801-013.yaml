    nothing, and asserts nothing at any tier above toy.

  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  batch_closed: BATCH-026
  batch_opened: BATCH-027
