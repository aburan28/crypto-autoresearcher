        b633eaf1837ec876ffb7a52bdc6450baba8b1bb4d253dce3d8f3e6e13a7de328 and
        RR-LPF-1 must still be
        8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d. A
        mismatch voids the whole reduction and stops the batch.
    - id: ATTAINABILITY-RE-RUN-FROM-SCRATCH
      judged: >-
        REDUNDANT AS A RE-RUN. It was re-run from scratch, not inherited, at
