      caught RTB-054-1 and it is cheap. TASK-20260801-081 re-verifies row by row
      that every gamma in every moving_rungs list carries flag true and every
      flag-true gamma is in its list.
    - >-
      ANTI-TUNING - KEPT in its mechanical form and STRUCTURALLY STRONGER HERE
      THAN IN ANY PRIOR BATCH, because the reading rule is frozen, hash-bound and
      independently reviewed BEFORE the measurement exists. The hash and ancestry
      legs are re-verified at every archive; the source re-derivation is not
      re-run, having been done at TASK-20260801-068 against driver source.
    - >-
      DECISION-VARIABLE VARIATION - KEPT at TASK-20260801-081, which must verify
      that every threshold is the named order statistic of the named archived
      calibration array, recomputed by its own sort, and that the measurement arm
      is what produces the quantity each fired leg reads.
    - >-
      NO SENTENCE ON AN UNARCHIVED ARRAY (PERTURB-TAIL-1) - KEPT and applied to
      EV-LPF-001 and to the close decision. Every quantitative sentence must name
      the archived array it is computable from. An unnamed array is a
      freeze-time refusal.
    gates_judged_REDUNDANT_for_this_batch_and_why:
