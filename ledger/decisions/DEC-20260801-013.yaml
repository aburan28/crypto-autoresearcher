      five review duties and four executed archives - TASK-20260801-062, -064,
      -067 and -069 - were spent in BATCH-026 to produce a PASS on a file that
      then could not be used.
    the_symmetry_that_governs_the_ruling: >-
      Under docs/inventor-protocol.md section 4, premature closure is a failure
      mode SYMMETRIC WITH OVERCLAIMING. A campaign that never runs because a
      procedural item is always outstanding has not been rigorous; it has stopped
      doing science while continuing to look rigorous. That is the failure mode
      being weighed here, against the opposite one the gates exist for.
    the_ruling: >-
      BATCH-027 IS CUT FROM FOURTEEN CARDS TO NINE AND FROM FIVE REVIEW DUTIES TO
      ONE, PLUS THE VALIDATOR AND RED-TEAM PASSES THE MEASUREMENT ITSELF REQUIRES.
      THE FIVE DISCIPLINES ARE KEPT. NO SIXTH DISCIPLINE IS FILED.
