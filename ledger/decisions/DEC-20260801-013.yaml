  decided_by: coordinator
  decided_at: '2026-08-01'
  decision: approve
  decision_scope: >-
    THIS RECORD APPROVES A PLAN AND CLOSES A BATCH. IT APPROVES NO RUN. The
    single measurement run RUN-LPF-001-measure is authorized by ONE artifact and
    one only - APPROVAL_DETERMINATION APPROVED in the TASK-20260801-078 archive
    receipt, which may itself be recorded only after the independent tool-change
    review at TASK-20260801-077 returns PASS. It states no disposition about
