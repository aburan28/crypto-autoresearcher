#       UNCHANGED frozen contract EXP-LPF-001, the ALREADY-REVIEWED
#       superseding reading rule RR-LPF-2, the EXISTING ADMISSIBLE
#       calibration and the UNMODIFIED hash-bound driver. NOTHING IS
#       REBUILT, RE-FROZEN OR RE-REVIEWED.
