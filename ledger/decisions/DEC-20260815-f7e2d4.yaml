  rationale:
    - >-
      NEXT-ACTION FIDELITY, VERIFIED AGAINST THE HEAD. The committed
      GOAL-ENDO-001 next_action requires exactly one separate bounded
      nonautomatic resource-and-implementation-planning gate beginning from the
      fail-closed resource_incomplete disposition. BATCH-25e27c admits that and
      only that. Its queue objective, its batch record, and its
      admission_boundary all state the same restriction, and no lane, control,
      instrument, or experiment work is queued anywhere in the five tasks. The
      queue's first constraint says in terms that any work not required by that
      sentence is out of scope for this batch.
    - >-
      THE PRODUCER IS ZERO-RUN AND STATIC. TASK-20260815-f04b54 authors a
      planning document. It executes no experiment, no control, no instrument,
      no validator-as-experiment, and no runner, and materializes no plant
      bank, no null bank, no curve, and no target. Its six required contents -
      estimates, budgets, stopping rules, controls, artifacts, and a fresh
      authorization boundary - are the goal head next_action's own words,
      carried across unaltered rather than paraphrased or extended.
    - >-
      THE EIGHTEEN PRESERVATION OBLIGATIONS ARE ENUMERATED, NOT GESTURED AT.
      The obligations the next_action lists appear one per entry in the queue's
      frozen_preservation_contract with the bindings the scaffolding session
      read, and the producer plus BOTH reviews are each separately required to
      recheck every one. An obligation that cannot be bound to an exact
      committed artifact is DISCLOSED as an open binding defect - never
      dropped, summarized away, estimated, repaired in prose, or silently
      resolved.
    - >-
      resource_incomplete STAYS FAIL-CLOSED FOR THE WHOLE BATCH. The three
      missing v3 estimates - CPU, wall clock, peak memory - and the five failed
      v3 gates - retained-byte, individual-artifact, shard, logical-I/O, disk -
      are precisely what the gate must ESTIMATE. PRODUCING AN ESTIMATE DOES NOT
      CLEAR A GATE. Clearing one would be a resource change, and this batch
      contains no authorization for that; only a later, separately authorized
      Coordinator decision may act on any estimate the gate proposes. This
      reading is corroborated by DEC-20260813-d14d6b's own
      resource_incomplete_preservation block, whose unchanged_checks record
      retained_artifact_bytes FAIL, individual_artifact_without_sharding FAIL,
      total_logical_io_bytes FAIL, shard_count FAIL, free_disk
      FAIL_INHERITED_READ_ONLY_V3_OBSERVATION, and cpu, wall and peak_memory
      each FAIL_MISSING_ESTIMATE.
    - >-
      CONCURRENCY IS BOUNDED AND ARCHIVES ARE ISOLATED. The only pair permitted
      to run concurrently is the independent validation TASK-20260815-fa8f06
      and the independent red team TASK-20260815-3ec919, both at
      review-adversarial and xhigh, in fresh sessions, with disjoint write
      scopes. Both archive tasks run alone - the snapshot before either review
      reads the bytes, the ledger archive after both return. max_concurrent 2
      sits inside the campaign budget ceiling of max_concurrent 6, and sizing
      to the machine's real headroom remains the dispatching Coordinator's
      responsibility rather than the tooling's.
    - >-
      THE GOAL HEAD IS NOT WRITEABLE BY THIS BATCH. ledger/goals/GOAL-ENDO-001/
      goal.yaml appears in no task's write scope. The batch checkpoints instead
      through the write-once shard
      ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-25e27c.yaml, written by the
      ledger archive at close. This preserves exactly one next action for the
      active goal without a concurrent write to the one file every campaign
      touches.
    - >-
      EVERY TASK NAMES EXACT ARTIFACT PATHS AND EXACTLY ONE ARCHIVAL TASK, AND
      NO BUDGET FIELD IS NULL. All five handoffs were checked individually. The
      snapshot archive declares four paths, the ledger archive eight, and the
      control-plane queue path is excluded from both commit scopes by explicit
      constraint.
    - >-
      WHY NOW. GOAL-ECDLP-001 reached a terminal state and the harness moved to
      the next active goal, GOAL-ENDO-001, whose head carries this next_action
      unserved. That is scheduling context, not a research reason, and it is
      recorded as such below rather than folded into the merits.

