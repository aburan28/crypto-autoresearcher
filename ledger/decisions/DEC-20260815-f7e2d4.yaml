    - >-
      No hypothesis moved. H-JINV-5a0b9e, H-STR-002, H-ENDO-001 and every other
      hypothesis stand exactly where their controlling decisions left them.
    - >-
      No completion criterion is met or advanced. C1, C2, C3 and C4 are all
      untouched: a planning gate is not a lane adjudication, not an
      oracle-class simulability determination, and not an instrument control.
      No attestation was gathered and no quorum is claimed.
    - >-
      P1, P2 and P3 are all unengaged by this batch. It measures nothing and
      takes no instrument reading (P1); it bears on H-STR-002 in neither
      direction and transitions no hypothesis (P2); it states no candidate, no
      excess and no break (P3).
    - >-
      EVERY sha256 AND BYTE SIZE IN THE QUEUE'S FROZEN CONTRACT WAS READ FROM
      COMMITTED RECORDS BY A SESSION WITH NO SHELL, AND NEVER RECOMPUTED. This
      decision's own session recomputed none of them either. Recomputation and
      independent reverification are assigned to the producer and to both
      reviewers. A MISMATCH BETWEEN ANY VALUE IN THAT CONTRACT AND THE
      COMMITTED TREE IS A MATERIAL FINDING TO BE REPORTED - NOT A TYPO TO BE
      CORRECTED QUIETLY.
    - >-
      Both archives in BATCH-25e27c carry commit_sha null, parent_sha null and
      an EMPTY path_sha256 map. THAT IS BY CONSTRUCTION, NOT BY OMISSION: the
      commits those hashes would bind do not exist yet, and the authoring
      session could not compute a hash or read git. NO PLACEHOLDER HASH WAS
      INVENTED AND NONE MAY BE. The dispatching session computes and fills them
      after each commit and post-commit verifies the receipt.
    - >-
      The ledger archive TASK-20260815-48d541 declares the paths
      ledger/evidence/EV-JINV-PENDING-ALLOCATION.yaml and
      ledger/decisions/DEC-20260815-PENDING-ALLOCATION.yaml. THESE ARE
      DELIBERATELY NOT IDENTIFIERS. "PENDING-ALLOCATION" is not a 6-hex token
      and therefore cannot collide with a real one, which is exactly why
      guessing was refused. Minting both with tools/allocate_id.py, confirming
      each with --check, and substituting them into the queue's artifact_paths,
      write_scope and record_ids and into the task card in one control-plane
      edit before staging is a completion-gate item on TASK-20260815-48d541.
    - >-
      Both reviews resolve to models on the same single available backend.
      "INDEPENDENT" HERE MEANS INDEPENDENT SESSION, INDEPENDENT CONTEXT, AND A
      FROM-SCRATCH READING - NOT INDEPENDENT JUDGEMENT FROM A DIFFERENT MODEL
      FAMILY. It must not be presented as stronger than that in any downstream
      record, and a double PASS would approve only the exact static planning
      bytes.
    - >-
      This is a batch-opening decision about a PLAN. It creates no run, no
      observation, no metric, no certificate, no proof, and no mathematical or
      empirical evidence, in either direction, at any scale. claim_tier stays
      toy, sota_delta stays zero, and the one-N N=19507 ceiling stays.
    - >-
      Approval binds to the exact scaffolding paths as read in the working tree
      by a session with no git access. It does not assert that those paths are
      committed, and nothing here is durable until the dispatcher's post-commit
      verifier accepts the commit that carries it.
    - >-
      A timeout, crash, tool failure, or budget exhaustion in any of the five
      tasks is INFRASTRUCTURE SIGNAL that returns to the Coordinator. It is
      never a negative mathematical result about JINV, transport, isogeny
      classes, an instrument, a curve, a prime, or ECDLP, in either direction,
      at any scale.

