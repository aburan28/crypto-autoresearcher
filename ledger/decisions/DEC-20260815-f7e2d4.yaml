  limitations:
    - >-
      AUTHORIZES NOTHING. This decision does not authorize implementation, not
      Phase B, not any control or experiment, not target or curve access, not
      JINV or transport work, not N18, not science, not status change, not
      ECDLP, not closure, not breakthrough, not publication, not network write,
