    - DEC-20261001-f5e83a (opened BATCH-454f85; R-2)
  standing_authorization: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user,
    2026-09-06). Authorization is not the readiness finding; the readiness
    finding below is this decision's own.
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: approve
  decision_label: >-
    APPROVE the frozen contract EXP-ICEX-153c34 and hypothesis H-ICEX-6ca21f
    as designed by TASK-20261001-768475 and snapshotted by TASK-20261001-3bcf4a
    (a5d3a97af7). Approval does not admit execution. NEXT: an executor
    implementation task and the S0 smoke gate, then a separate admission
    decision.

  target_ids:
    - EXP-ICEX-153c34
    - H-ICEX-6ca21f
    - H-ICEX-d8e858
    - EXP-ICEX-fa2b37
    - TASK-20261001-768475
    - TASK-20261001-3bcf4a
    - TASK-20261001-01af92
    - TASK-20261001-d93546
    - CORR-20261001-07df5c

  official_transitions:
    - record: H-ICEX-6ca21f
      to: approved
      via: [specified]
      rationale: >-
        Mechanism, numbered heuristics with falsification conditions,
        predictions with fixed thresholds, test boundary and a proof_search_map
        are present. The recorded prior (obstruction persists, from the
        design-time ceiling audit) is stated before any measurement.
    - record: EXP-ICEX-153c34
      to: approved
      via: [review_required]
      rationale: see readiness

  readiness:
    checked_against: design snapshot TASK-20261001-3bcf4a, content-bound at a5d3a97af7 (12 path hashes verified by tools/research_dispatch.py)
    present:
      - objective, inputs (the six EXP-ICEX-aaccfc v4 fixtures plus the arm-X panel generation rule), controls, arms M/N/X/R
      - cost_accounting charging every C-3 unit including failed attempts and fixed setup, with the exponent fitted on variable cost under component and absolute guards
      - analysis, metrics, stopping and invalidation rules, success and falsification criteria, required artifacts
      - heuristic_under_test and heuristics_also_tested, proof_search_map, dominated_by, sota_delta
      - the matched-rho arm R as baseline (no separate baseline key)
      - power check (design noise SD 0.20 - power 0.956 vs planted 0.40; false favourable 0.022 at 0.50 and 0 at 0.60; at SD 0.78 power 0.167)
    advisory_nulls_accepted:
      - budget.wall_clock_seconds_per_run and total_cpu_hours (advisory by policy)
      - stage_estimates wall-clock and CPU for stages 1-3 (advisory)
      - citations[8..10].verified_by (recalled citations; provenance marked, not used as support)
    impediment_carried: >-
      IMP-1 (lex Buchberger feasibility at L >= 7). It limits completion of two
      arm-M fixtures and arm-X sizes 20-24 bits, not the protocol: arm M still
      reaches a verdict through budget-stop lower bounds, and an incomplete arm
      X reports a labelled reduced-panel slope. Clears on the S0 G0-4 timing
      gate or on completion.

  rulings:
    - id: R-1
      topic: Expected outcome is a closure-type result
      ruling: >-
        The design's prior is that non-enumerative membership on the interval
        factor base hits the same floor as enumeration (1,041-8,438x the
        threshold). A result confirming that would close the matched-L
        index-calculus route at this scale for G1. Its review therefore routes
        to the review-breakthrough tier (validator-breakthrough and
        red-team-breakthrough, effort max), which may not be degraded.
    - id: R-2
      topic: Machine-protection lapses during design
      ruling: >-
        The designer disclosed a non-protocol feasibility probe that reached
        8.56 GB (limit 8 GiB) before being killed, and a 40-second power-check
        rerun at 15-minute load about 27 (limit 14). No scientific output
        depends on either. The executor card must carry an RSS watchdog at
        8 GiB and the C-7 load gate for every computation, including smoke and
        probes.
    - id: R-3
      topic: Snapshot custody
      ruling: See CORR-20261001-07df5c. The design package is bound by content at a5d3a97af7; the receipt committed in 8fb320f8a6 is superseded and left unchanged.

  transitions_not_made:
    - record: H-ICEX-d8e858
      note: Stays approved.
    - record: EXP-ICEX-fa2b37
      note: Stays approved and unedited; its backend design is reused by citation.

  rationale: >-
    The contract is complete enough to run without further design choices:
    every cost is charged, the exponent analysis no longer depends on L
    variance, and its power at the expected noise is adequate. The likely
    result is negative, which is still worth measuring. It would replace a
    design-time ceiling argument with a measured floor for the backend the
    previous decision named as the only open route.

  next_actions:
    - id: NA-1
      action: Write and dispatch an executor implementation card for EXP-ICEX-153c34 (G1 backend with the coefficient-product target build and its check, arms M/N/X/R, run-record contract), including the S0 smoke gate on non-frozen curves, an 8 GiB RSS watchdog and the C-7 load gate. No protocol-labelled run before a separate admission decision.
      owner: coordinator
    - id: NA-2
      action: After implementation snapshot, an independent implementation audit, then an admission decision.
      owner: coordinator

  knowledge_promotion:
    promoted: []
    not_warranted: Approval decision; it records no result.
