coordinator_decision:
  id: DEC-20260802-735e6a
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-007
  evidence_id: EV-MLKEM-017
  recorded_by_task: TASK-20260802-105
  archive_kind: ledger
  recorded_at: '2026-08-02'
  decision: refine
  decision_label: adjudication_admissible_with_defects_one_result_established_two_blocked

  context: >-
    BATCH-007 resumed GOAL-MLKEM-003 under DEC-20260802-002 to ask whether the
    program's four standing Carrier findings hold against the authoritative
    current text and code, now that primary sources are partially reachable.
    TASK-20260802-101 produced the adjudication; TASK-20260802-102 snapshotted
    it at bd184fff (verified: 18 of 18 declared paths, exactly). Validator
    VAL-20260802-001 returned ADMISSIBLE_WITH_DEFECTS with all three verdicts
    reproduced and eight defects; Red Team TASK-20260802-104 returned
    pass_with_constraints with ten objections, three of them high.

  central_adjudication: >-
    THE BATCH'S INTENDED DELIVERABLE LARGELY FAILED, AND ITS MOST VALUABLE
    OUTPUT WAS PRODUCED BY THE REVIEW RATHER THAN BY THE PRODUCER. One question
    resolved (Q1, and only for the HAL-hosted object), two were blocked by
    access, and two of the producer's supporting arguments were shown defective
    by the red team. Against that, the red team's OBJ-8 established an exact
    arithmetic fact that reframes the interpretation of a standing program
    finding. Recording this batch as a success would be false; recording it as a
    failure would discard its one real result and its one genuine discovery.
    `refine` is the honest disposition.

  what_is_established:
    - >-
      E-1/E-2. The KN-FIND-016 transcription error (Table C.2, CN/Kyber-512,
      log2(Tsample) = 143.30) is unfixed in a source whose provenance is now
      pinned by three independent sha256 checks, and the vendored immutable run
      artifact is byte-identical to what HAL serves today. This is the batch's
      one durable positive result and it is small.
    - >-
      E-7. log2(4000 * 241^3) = 35.7045 equals KN-FIND-012's recorded Pwrong
      floor of -35.70 to two decimals, because 1/N is the least nonzero value an
      N-sample empirical survival function can take. The floor is the
      estimator's resolution limit. Promoted as KN-FIND-031.

  what_is_not_established:
    - >-
      That the erratum survives in ePrint-hosted bytes. Those were never
      retrieved (403, path-class-wide per the 2023/302 control). The
      HAL-object/ePrint-rev-3 identity is an inference from metadata. Both the
      validator and the Coordinator hit the same wall independently.
    - >-
      Anything about KN-FIND-014. GitHub was wholly denied to this session and a
      numpy control failed identically. AGENTS.md rule 5 governs: this is an
      infrastructure fact and is not evidence in either direction.
    - >-
      That no prior work measures the quantity KN-OPEN-016 names. The corpus
      null failed its own null-object control (E-6): it searched for Carrier's
      notation and returns False on a paper that reports the quantity under
      different notation. NO NOVELTY CLAIM IS AVAILABLE FROM THIS BATCH, and
      none is made.
    - >-
      Provenance for KN-FIND-012, -013 or -014 (E-8). E-1 reaches KN-FIND-016
      only. KN-FIND-012 additionally carries no commit pin at all.

  weighing_of_the_reviews: >-
    Both reviews are accepted, and on two points the Coordinator re-derived the
    load-bearing item rather than deferring.
    (1) VALIDATOR D-2 IS CONFIRMED. A live re-fetch of the Unpaywall record
    returns oa_locations[0].version = 'submittedVersion'. The producer described
    that field as naming the OA location "for the published CRYPTO 2025
    chapter", which reads as HAL = the version of record. It is not. The
    validator is also right about the direction of effect: 'submittedVersion'
    indicates an author/preprint build, which SUPPORTS the conclusion the field
    was miscited for. Q1 therefore does not fall, and the defect is real.
    (2) RED TEAM OBJ-8 IS CONFIRMED. log2(4000 * 241^3) = 35.7045 against a
    recorded floor of -35.70. This is arithmetic, not argument.
    (3) OBJ-1 IS ACCEPTED AND IS THE MOST IMPORTANT CORRECTION. The producer's
    incommensurability argument is true of Ducas-Pulles Figure 4 and false of
    Figure 3, which is a score survival function structurally like Carrier Fig
    4.1 at 2^45 samples. The Q3 LABEL survives on the narrow reading; the
    supporting claim "it transfers nothing" does not, and the residual is an
    instantiation gap rather than a measurement-type gap.
    (4) OBJ-2 IS ACCEPTED AND IS WHY NO NOVELTY CLAIM APPEARS ANYWHERE IN THIS
    BATCH. A corpus search for one paper's private notation, run over a corpus
    that could not be fully retrieved, cannot establish absence. The
    inventor-protocol control obligation is the operative rule and the control
    failed.
    (5) OBJ-4 IS ACCEPTED IN SUBSTANCE. Q1 is close to vacuous as a research
    result: the last revision predates the finding, the authors were never
    notified, so no counterfactual correction existed to detect. It is recorded
    at its true weight -- a provenance pin, not a discovery.
    (6) OBJ-5 IS ACCEPTED AND CORRECTS THE STANDING NEXT ACTION. The remedy the
    producer named -- one GET of the ePrint PDF -- would misfire, because the
    HAL object carries a cover sheet and /Creator: HAL and cannot be
    byte-identical to ePrint bytes. The check must be content-level, and the
    next action below says so.
    (7) OBJ-9 IS ACCEPTED. Partial source access sharpens the no-novelty rule by
    class; it does not weaken it by fraction. dominated_by and sota_delta are
    recorded explicitly in EV-MLKEM-017 rather than left blank.

  hypothesis_status_changes: []
  hypothesis_status_note: >-
    No hypothesis moves. H-MLKEM-010 is untouched: this batch measured nothing
    about it. H-MLKEM-011/-012/-013/-014 are likewise unchanged.

  knowledge_promotion:
    promoted:
      - KN-FIND-031
    rationale: >-
      KN-FIND-031 records the estimator-resolution identity and its instance.
      It is promoted because it is exact, independently re-derived, transferable
      beyond this campaign, and it qualifies the reading of a standing program
      finding. It supersedes nothing: KN-FIND-012 is immutable, its coverage
      observation stands unchanged, and only the interpretation of its floor
      VALUE is qualified.
    not_promoted:
      - >-
        Q1's erratum confirmation. It is already fully stated in KN-FIND-016 and
        adds a provenance pin, not a transferable finding. Recorded in
        EV-MLKEM-017 E-1/E-2 and left there.
      - >-
        The retitling (E-9) and the 2026 follow-on literature (E-10). These are
        bibliographic and belong in KN-LIT entries built from full texts that
        were not retrieved; promoting abstracts as literature notes would
        overstate what was read.
    promote: true

  defects_carried_forward:
    - >-
      VAL D-1: three load-bearing quotations have no committed locus, including
      the Ducas-Pulles CST22 bibliography entry that serves as Q1 inference fact
      2. The validator independently verified all three are accurate. Repair is
      a vendoring task, not a correction of a false statement.
    - >-
      VAL D-2: the Unpaywall version field is described backwards in
      source_adjudication.md. Producer artifacts are immutable; the correct
      reading is recorded in EV-MLKEM-017 E-3 and in this decision.
    - >-
      VAL D-3/D-4/D-5/D-7/D-8 and RT OBJ-6/OBJ-7/OBJ-10 are open and recorded;
      none changes a verdict label.

  non_claims:
    - ML-KEM is not broken. This batch measured nothing about ML-KEM's security.
    - KN-OPEN-016 remains open.
    - >-
      No novelty claim is made for any quantity, and the batch's own corpus
      null is inadmissible for that purpose (E-6).
    - >-
      No asymptotic claim advanced; none of the four promotion gates in
      .claude/skills/coordinate-research-goal/SKILL.md is engaged, because no
      complexity claim was made.
    - No three-model closure quorum is asserted. GOAL-MLKEM-003 stays active.

  next_actions:
    - >-
      BATCH-008: recount the sample budget directly from the archived .out files
      in experiments/EXP-MLKEM-011/vendor-lock/data/ to convert KN-FIND-031's
      consistency argument into a direct count, and cost the sample budget that
      would resolve Pwrong at the aligned Pgood operating threshold. This is
      zero-network, needs no permission, and turns KN-OPEN-016's residual from
      unmeasured into costed. It is preferred over the G6K route on cost and
      over further source retrieval on availability.

  deferred_actions:
    - >-
      Content-level (NOT byte-level, per OBJ-5) comparison of Table C.2 against
      ePrint-hosted bytes, if a session ever retrieves them.
    - >-
      Read access to kevin-carrier/CodedDualAttack via add_repo, then record
      GET /repos/.../commits/main sha and diff verifyModel against 9c1367f, to
      settle Q2. Requires a permission this session does not hold.
    - >-
      Vendor the Ducas-Pulles Fig. 3 / Fig. 5 loci and the three D-1 quotations.

