      boundary but incomplete for execution, listing eight residual defects.
    independent_red_team: >-
      Red Team TASK-20260809-2ded5b returned DISSENT on execution readiness and
      concurred only with additive provenance, scope, and the no-execution claim
      ceiling. Its objections independently overlap the Validator's blockers.
    execution_authorization:
