    design_progress: >-
      The successor repairs the fixed-advice quantifier boundary, q=0
      semantics, exact source-prime labels, typed A/B/C split, B mapping,
      shared-index-aware fiber union, semantic-path null intent, and declared
      finite controls. Both reviews explicitly confirm these repairs without
