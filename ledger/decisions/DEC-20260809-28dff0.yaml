      reason: >-
        Numeric T_q budget/unit, canonical bytes, branch-specific auxiliary
        schemas, output/access semantics, replay pairing, control ordering, and
        C generator semantics remain underdefined. The next action is another
        additive clarification followed by fresh independent review.
    claim_boundary: >-
      No measurement, run, attack, security, exponent, novelty, hypothesis
      transition, or goal completion follows from either review.
