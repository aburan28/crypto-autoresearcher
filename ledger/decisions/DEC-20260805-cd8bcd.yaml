coordinator_decision:
  id: DEC-20260805-cd8bcd
  context: >-
    GOAL-SSIQ-001 BATCH-003 closes. It ran the direct test of lever L4 (the
    only lever whose ceiling meets this goal's p^{1/4} target), under a
    contract that itself went through a mandatory pre-freeze Red Team review
    (seven findings, all resolved before freeze -- the standing practice
    adopted after BATCH-001/BATCH-002's GD-4/GD-5) and a mandatory Phase 0
    calibration gate that must pass on synthetic data before any real graph is
    touched. Both worked. Phase 0 passed, independently re-derived two ways.
    Graph construction passed every correctness gate for all 12 primes,
    independently re-verified beyond the contractual minimum. The run still
    could not produce its confirmatory metric: a data-availability gap in the
    WISDE release blocks the real-label descent arm entirely. Recorded as
    EV-SSIQ-9a0396, on TASK-20260805-2c086d ADMIT-WITH-CONDITIONS and
    TASK-20260805-5dba23 CONFIRM-SCOPED.
  decision: inconclusive
  decision_note: >-
    inconclusive for H-SSIQ-18dc91's real-arm prediction, which was never
    computed and so is neither supported nor weakened. This is NOT a
    reject_scoped or a weaken: nothing about the hypothesis was tested. It is
    also not a repeat of BATCH-002's revise (that decision targeted a defective
    INSTRUMENT; this instrument -- calibration and graph construction both --
    is independently confirmed to work correctly). The defect this time is a
    DATA-AVAILABILITY gap external to the instrument, compounded by a
    Coordinator process gap (below).
  target_ids:
    - GOAL-SSIQ-001
    - RQ-SSIQ-9702af
    - H-SSIQ-18dc91
    - EXP-SSIQ-58b642
    - EV-SSIQ-9a0396
    - TASK-20260805-eaf51d
    - TASK-20260805-2c086d
    - TASK-20260805-5dba23
  evidence_refs:
    - EV-SSIQ-9a0396
  rationale:
    - id: D-1
      statement: >-
        THE INSTRUMENT WORKED. Phase 0 (C-CAL-GAP) is independently confirmed
        genuine by two routes: a from-scratch re-derivation with a different
        noise model and RNG across 20 seeds per variant (20/20 pass), and a
        direct re-execution of the producer's own code reproducing the
        reported numbers bit-for-bit. Graph construction passed every
        correctness gate for all 12 primes, independently re-verified beyond
        the contractual minimum -- including a third, independent route
        confirming the Phi_2 polynomial coefficients via exact rational
        elliptic-curve arithmetic. Two straight batches (BATCH-001, BATCH-002)
        froze instruments that could not do the work asked of them; this one
        could, and both reviewers checked it rather than took it on trust.
      confidence: high
    - id: D-2
      statement: >-
        THE BLOCKER IS REAL, DOWNSTREAM OF THE INSTRUMENT, AND WAS HANDLED
        CORRECTLY BY THE EXECUTOR. WISDE's per-prime files carry abstract
        maximal-order Z-bases and Gross-lattice minima, indexed by conjugacy-
        class loop position -- no numeric j-invariant, no linkage to a
        computed graph vertex. The Validator went further than the producer's
        own due diligence and read the WISDE authors' OWN GENERATING SCRIPT,
        confirming the dataset's pipeline never constructs a j-invariant at
        any point -- the linkage is not merely unpublished, it is not computed
        by the release at all. The Executor's refusal to fabricate a random
        label assignment onto the real multiset was correct: both reviewers
        confirm it would have destroyed any true correlation and produced a
        number statistically indistinguishable from another instance of
        C-NULL-LABEL. Reporting VOID rather than forcing a result was the
        right call given the information available at run time.
    - id: D-3
      statement: >-
        A NEW CONTRACT DEFECT IS NAMED, GD-6, FROM TWO CONVERGING BUT DISTINCT
        ANGLES, AND BOTH ARE RECORDED UNDER ONE ENTRY RATHER THAN FLATTENED.
        (Root cause, Red Team) THIS WAS CATCHABLE BEFORE FREEZE. EXP-SSIQ-4de240's
        own execution report -- committed over an hour before this contract
        was drafted, and NAMED BY THIS CONTRACT AS ITS OWN
        delta_E_cross_reference SOURCE -- already stated the exact fact that
        blocked this run: WISDE indexes by abstract order type, not
        j-invariant. Neither the drafting Coordinator (this session) nor the
        pre-freeze Red Team re-read what an already-committed document in this
        repository said; the pre-freeze review's own "attacked and held"
        section conflated the WISDE vertex-COUNT check (which the contract
        does need and does get right) with the per-vertex LABEL mechanism
        (which it silently assumed). THIS IS A DIFFERENT SPECIES OF DEFECT
        THAN GD-4 AND GD-5. Those were fresh-calculation failures -- an
        obstruction asserted without deriving it, an estimator frozen without
        testing it. This is a RE-READ FAILURE: the answer was already sitting
        in committed history, cited by this very contract as its own source,
        and nobody reopened it.
        (Downstream, Validator) EVEN GRANTING THE GAP WAS UNDISCOVERABLE, THE
        DECISION-RULE VOCABULARY ITSELF HAS NO OUTCOME FOR THIS CASE. The
        frozen decision_rule_frozen_before_data defines VOID only for a
        C-NULL-LABEL/C-CONNECTIVITY failure. Neither failed here. This run's
        actual outcome -- M-GAP structurally uncomputable, both named controls
        passing -- is a fourth, unforeseen category, absorbed into a generic
        invalidation_rules clause and then reported under a label the decision
        rule reserves for a materially different situation (signal
        contamination versus no-data-existed). execution_report.yaml's own
        internal M_GAP_real_status: BLOCKED field is the precise term and
        existed but was not surfaced to the top-level decision label.
      severity: medium
      standing_repair_adopted: >-
        Two, effective immediately for BATCH-004 and any successor contract in
        this campaign: (1) BEFORE CITING A PRIOR RUN AS A DATA SOURCE, RE-READ
        ITS EXECUTION REPORT IN FULL, not just its headline metric -- this
        applies to a pre-freeze Red Team review as much as to the drafting
        Coordinator, and the pre-freeze review process gains an explicit
        "re-read every cited prior artifact end to end" step. (2) A successor
        contract's decision rule names a DATA-UNAVAILABLE / BLOCKED branch as
        a distinct outcome from a control-failure VOID, wherever an external
        dataset is load-bearing for the confirmatory metric -- so a future
        ledger aggregation filtering by decision_branch cannot conflate the
        two.
    - id: D-4
      statement: >-
        THE RUN LEFT REUSABLE, VALIDATED INFRASTRUCTURE DESPITE THE VOID, AND
        THAT IS RECORDED AS A REAL RESULT, NOT A CONSOLATION. C-CAL-GAP is now
        a validated, reusable calibration harness for any future contract that
        needs to sign-test a difference of exponents. The graph-construction
        pipeline (Phi_2 root-finding, BFS, C-CONNECTIVITY/C-EDGELIST) is now
        validated, reusable tooling for a future L4 attempt via a different
        labelling route. Filing this batch as pure loss would misstate what
        two independent reviews actually confirmed.
    - id: D-5
      statement: >-
        PD-2 (double edges to the Frobenius conjugate at p=1 mod 12,
        independently reproduced and confirmed orthogonal to M-DEGSEQ) NARROWS
        BUT DOES NOT REOPEN PF-5. CGL's "no automorphism implies simple graph"
        argument, which PF-5's resolution used to justify restricting to p=1
        mod 12, is shown to be necessary but not sufficient -- a distinct
        Galois-action-on-E[2] mechanism produces mild multiplicity even in the
        residue class chosen specifically to avoid it. The operative
        conclusion (no j=0/j=1728 degeneracy at this residue, hence no
        blocking multiplicity table needed) still holds; PD-2 is recorded as a
        genuine structural finding about the strength of the underlying
        argument, not as a defect requiring repair.
  limitations:
    - >-
      H-SSIQ-18dc91's real-arm prediction is UNTESTED. No statement about a
      delta_E-gradient existing or not existing is licensed by this batch in
      either direction.
    - >-
      No claim about a p^{1/4} algorithm's existence, likelihood, or proximity
      is made or implied anywhere in this decision or its evidence record.
    - >-
      Toy scale throughout (p up to 21601, graphs up to 1800 vertices).
    - >-
      command.txt's non-reproducible standalone-invocation claim (EV-SSIQ-9a0396
      O-8) is recorded, not repaired in place per AGENTS.md rule 4; a follow-up
      artifact correction is owed.
    - >-
      Model independence remains absent and is now confirmed UNVERIFIABLE in
      this environment (both reviewers' orchestration.adapter doctor --probe
      attempts failed against every backend), a sharper statement of the cap
      than prior batches carried. Evidence strength stays capped at
      preliminary campaign-wide.
  next_actions:
    - >-
      SINGLE NEXT ACTION -- open BATCH-004 on the Red Team's top-ranked
      recommendation: attempt to unblock lever L4's real arm via DIRECT
      IN-SESSION COMPUTATION of delta_E for the same 12 (or a smaller,
      re-pinned) primes using bounded smooth-degree isogeny search -- the
      archived source's own method -- which sidesteps the hard Deuring
      curve-to-ideal direction entirely, rather than requiring full
      endomorphism-ring reconstruction. This reuses the validated
      graph-construction and calibration infrastructure from this batch
      (D-4) and directly answers the question BATCH-002's M-GRAD arm and this
      batch's real arm both could not: whether a computable delta_E-gradient
      exists. Any such contract goes through the pre-freeze Red Team process
      WITH THE STANDING REPAIR FROM D-3 APPLIED: full re-read of every cited
      prior artifact, and a decision rule that names DATA-UNAVAILABLE/BLOCKED
      as its own branch.
    - >-
      NOT CHOSEN, WITH REVISIT CONDITIONS (AGENTS.md rule 9). (i) REC-1b (the
      M-GRAD delta_E-gradient question via WISDE) is now DOUBLY confirmed
      dead by the identical data gap found independently in both BATCH-002 and
      this batch -- retired, not merely deferred; revisit only if a future
      WISDE release version adds per-vertex linkage. (ii) The N5 scoping pass
      (structurally different auxiliary targets) stays open and unscheduled;
      revisit when L4's labelling problem is resolved one way or the other, so
      campaign attention is not split across two open levers at once.
      (iii) The deferred p != 1 (mod 12) successor from PF-5 is now COSTED
      HIGHER given PD-2's finding that even the "easy" residue carries mild
      multiplicity -- revisit only after the direct-computation route for
      p = 1 (mod 12) is exhausted. (iv) A binary-label redesign of the real
      arm (rather than direct computation) is ranked low pending its own null
      control, per the Red Team's explicit caution.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing promoted; evidence strength is inconclusive/preliminary, below
      the replicated bar docs/task-lifecycle.md step 9 requires. FOUR
      CANDIDATES ARE NOW QUEUED across this campaign, one new: (1) the
      BATCH-001 L1 ceiling; (2) the general pattern "an upper-bound instrument
      cannot establish a floor"; (3) the general pattern "an instrument
      asserted to have a capability it was never checked for," observed twice
      in BATCH-001/002; (4) NEW -- "a cited prior artifact's execution report
      must be re-read in full, not sampled by its headline metric, before a
      successor contract relies on it as a data source" -- this batch's own
      GD-6 root cause, which is a DIFFERENT failure mode from (3) and worth
      keeping distinct rather than folding in. All four promote together when
      a genuinely different model becomes available to re-check them.
  decided_by: coordinator
  decided_at: '2026-08-05'
