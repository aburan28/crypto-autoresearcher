  context: >-
    /design-experiment, one contract. IDEA-20261006-e1215a is on
    origin/design/mlkem-0e9abf-isometry and is not on origin/main. The
    question is RQ-SDEG-001. No hypothesis or experiment on origin/main
    cites that full id. The branch design/sdeg-e1215a was created from
    origin/main and git merge origin/main reported already up to date.

    The contract freezes p = 61, one ordinary curve, two factor bases
    of size 8, exhaustive addition labels, grevlex, and the integer
    comparison of the miss mean minus the hit mean with the threshold
    1. Success is the source idea's disjunction, the same side on both
    bases, with a gap of at least 1 not reproduced by the random arm.
    The concrete negative is a finished primary difference at most -1.
    No Groebner basis was computed in this session and no degree was
    recorded.

    This session opened KR-IC-5a43e5, KR-IC-5931ee, KR-IC-0d2021,
    KR-IC-73db3f, KR-IC-f3da82, KN-OPEN-002, and the explicit S_3
    polynomial in
    coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py.
    Those rows are not a measurement of D.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished primary difference is at most -1, when the bases
    split across the threshold, or when the random arm reproduces a
    gap of at least 1. No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished difference at most -1 is reachable as a recorded outcome, so success is not automatic.
    - The support-matched random arm, the second base, and the second solver build are the instrument controls.
    - A short class after the enlargement cap is not scored as a wrong-sign gap.
    - This session did not compute a degree and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one toy prime and one cardinality. It does not transfer to cryptographic primes or to larger B.
    - A pattern in solving degree is not a change in rho cost.
    - An audit mismatch or a missing degree transcript is an instrument failure and is not a difference of -1.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

