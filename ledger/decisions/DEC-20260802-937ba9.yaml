coordinator_decision:
  id: DEC-20260802-937ba9
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-008
  recorded_by_task: TASK-20260802-9abae7
  authorized_by: DEC-20260802-002
  recorded_at: '2026-08-02'

  decision: weaken
  decision_label: >-
    weaken_own_coverage_statistics_and_k_fft_alignment;
    no_official_transition_because_rule_12_unserved;
    pause_goal_at_exhausted_campaign_budget

  # ------------------------------------------------------------------
  # CONTEXT
  # ------------------------------------------------------------------
  context: >-
    DEC-20260802-002 resumed GOAL-MLKEM-003 from a budget pause by extending
    `maximum_batches` from 6 to 8, authorizing "two batches, after which the
    campaign returns to a pause decision unless extended again". BATCH-007
    consumed the first; DEC-20260802-15cadd closed it with disposition `revise`
    after independent review corrected two of three executor verdicts, and it
    left one blocking objection deliberately unadjudicated: the archived Carrier
    Pwrong survival files terminate exactly at their counting-resolution floor
    -log2(nb_iteration * q^k_fft), which would make `fraction_inside = 0` and the
    aligned T-gap properties of the sample budget rather than of the score
    distribution. Because that is a contradiction between validated evidence
    records, AGENTS.md rule 12 routes it to an independent `review-breakthrough`
    pass at `max`, and DEC-20260802-15cadd recorded in advance (ranking_rationale
    candidate B, `stated_risk`) that if the runtime could not serve that policy
    without degradation, the review must not run, the contradiction must stay
    unadjudicated, and EV-MLKEM-011 / EV-MLKEM-013 must keep their status. That
    is exactly what has happened. BATCH-008 - the last batch under
    `maximum_batches: 8` - ran the SUBSTANTIVE review under `review-adversarial`
    in an independent session (TASK-20260802-de2957), explicitly labelled as not
    a rule-12 pass, on already-archived bytes with no new compute. Its findings
    are recorded in EV-MLKEM-018.

  # ------------------------------------------------------------------
  # WHAT THIS BATCH ACTUALLY ESTABLISHED
  # ------------------------------------------------------------------
  what_the_batch_actually_established:
    - >-
      THE CONFOUND IS EXACT, AND EV-MLKEM-011 SURVIVES NARROWED. The reviewer's
      verdict on EV-MLKEM-011 is `claim_survives_narrowed`. The archived
      left-panel Pwrong file is an unsmoothed pooled counting estimate over
      nb_iteration * q^k_fft = 55,990,084,000 = 2^35.704452 scored candidates;
      its last positive value is bit-for-bit 1/(nb_iteration * q^k_fft) =
      1.7860305406935986e-11 = 2^-35.70445229 and every one of its 1804 values is
      an exact integer multiple of that quantum. Its zeros above score 1802 are
      an UPPER BOUND (<= 2^-34.12 under an independence assumption the pooled
      design does not satisfy; <= 2^-10.38 under maximal clustering), not a
      measured zero. Every number EV-MLKEM-011 states nonetheless recomputes
      exactly, and its Kyber-scale dynamic-range statement (83.87 / 142.09 /
      208.33 bits below the toy instrument floor) is sharpened rather than
      weakened by the confound.
    - >-
      THE k_fft ASYMMETRY DOES NOT EXIST, AND EV-MLKEM-013's CLAIM IS VOID ON THE
      MERITS - not merely confounded. The reviewer's verdict is `claim_void`. In
      the archived FFT_sample.py that EV-MLKEM-013 itself cites, `init()`
      contains `for i in range(len(decoded)):` whose index is never used, so each
      dual-vector phase is accumulated k_fft times into a scalar cell, and
      `FFT()`'s `/self.k_fft` CANCELS that duplication instead of rescaling the
      score. Recomputed against the archived file the ratio is 1.000000000000
      (max absolute deviation 1.1e-13 over five settings) and becomes exactly
      1/k_fft only if the duplicated loop is removed. `scale_factor_k_fft`
      recomputes to 1, not 3.
    - >-
      CODE-INDEPENDENT CONFIRMATION, WHICH I COMPUTED MYSELF. sigma =
      sqrt(E[F^2 | F >= 0]) from each archived Pwrong file's own survival
      function gives 113.9051 (n=43) and 114.1781 (n=50) against Model 4.7's
      sqrt(avg_N/2) = 113.9539 and 113.9517 (ratios 0.9996, 1.0020), versus
      2.9987 and 3.0060 against the /k_fft alternative. Both files are on the
      UNDIVIDED RAW cosine-sum scale - the same scale as Pgood - whatever script
      wrote them. Consequently EV-MLKEM-013's aligned figures
      (2222.557872 / 3988.157906 / 5940.937846, T-gap 420.557872) are a wrong
      unit conversion, and EV-MLKEM-011 did NOT overstate its T-gap.
    - >-
      THIS ALSO CORRECTS THE BATCH-007 RED TEAM, AND THE CORRECTION MATTERS MORE
      THAN THE OBJECTION. On the corrected raw scale the gap from the instrument
      limit (score 1802) to the Pgood MEDIAN operating point is 10162.473718
      units, and by the file's own measured tail slope log2(Pwrong) there is
      between -128.7 and -153.0 - roughly 93 to 117 bits below the counting
      floor, needing on the order of 2^105 to 2^129 iterations against the 4000
      run. Objection 2's DIAGNOSIS (confounded with run length) stands; its
      IMPLIED REMEDY ("run longer, as Ducas-Pulles did") is wrong by
      approximately 100 bits. The approximately 4-bit-looking deficit that made
      the objection look decisive was itself an artifact of the void k_fft
      alignment.
    - >-
      THE DATA DISCRIMINATES, AND IT FAVOURS "TOO FEW SAMPLES". The measured
      log-survival FLATTENS toward the floor (slope magnitude 0.0455 falling to
      about 0.010 bits per score unit) rather than steepening as a distribution
      approaching a genuine right endpoint would, and at the floor it exceeds a
      pure N(0, avg_N/2) survival at the same z by 150.51 bits. The archived data
      affirmatively favours "there is mass beyond 1802 this instrument cannot
      count" over "there is no mass there".
    - >-
      EV-MLKEM-017 IS NARROWED, NOT FALSIFIED. Its Q2 RESIDUAL observation stated
      explicitly that EV-MLKEM-013's identity check had not been re-run by anyone
      in BATCH-007, that the k_fft=3 alignment was taken as frozen from a single
      un-replicated run, and that every aligned statistic depended on it; its
      `unresolved_confounds` added "if it is wrong, every aligned Q3 statistic
      moves". This review resolves exactly that stated residual. Sentences in
      EV-MLKEM-017 and DEC-20260802-15cadd quoting the aligned Pgood minimum
      2222.56 or the aligned T-gap 420.56 should be read on the raw scale
      instead; the rest of EV-MLKEM-017 - Q1's sub-findings, Q3's narrowing and
      the Ducas-Pulles counter-evidence, package integrity, its non-claims - is
      untouched.

  # ------------------------------------------------------------------
  # COORDINATOR VALIDITY CHECK BEFORE INTERPRETATION
  # ------------------------------------------------------------------
  coordinator_validity_check:
    performed_before_interpretation: true
    what_i_checked:
      - >-
        Completion gate: the review carries a verdict from the declared enum for
        each of EV-MLKEM-011 and EV-MLKEM-013, shows every recomputed statistic
        with its source bytes, and states in its own first section that it is not
        a rule-12 pass. All three gate conditions are met.
      - >-
        I re-derived the three load-bearing quantities myself from the archived
        bytes rather than accepting them: the exact-float counting-resolution
        identity and integer-multiple structure (max relative deviation
        2.16e-16 on my formulation, 1.360e-16 on the reviewer's); the unused loop
        index in the archived FFT_sample.py, read directly; and the
        code-independent variance consequence by a different estimator than the
        reviewer's. All three reproduced. Details in
        EV-MLKEM-018.coordinator_independent_verification.
      - >-
        Estimator discrepancy recorded rather than smoothed over: my sigma digits
        (113.9051, 114.1781) differ from the reviewer's (113.7914, 113.9783).
        Two estimators of one quantity; the factor-of-three separation the
        conclusion rests on is far larger than the difference between them.
      - >-
        Scope deviation recorded: the task card's read_scope named
        experiments/EXP-MLKEM-013 for .out files that exist only under
        experiments/EXP-MLKEM-011/vendor-lock/data/. The reviewer read them
        read-only, wrote nothing outside its declared write_scope, and recorded
        the deviation itself. This is a task-card defect of mine, not a reviewer
        deviation, and it is accepted.
    verdict: >-
      Admissible as an input to this decision. It is NOT admissible as a rule-12
      adjudication, and nothing here treats it as one.

  # ------------------------------------------------------------------
  # RULE 12: WHY NO TRANSITION HAPPENS
  # ------------------------------------------------------------------
  rule12_non_satisfaction:
    required_policy: review-breakthrough
    required_effort: max
    policy_flags: >-
      `degradable: false`, `fallback_policy: null`, and
      `may_change_official_state: false` in orchestration/model-policies.yaml.
    satisfied: false
    evidence_that_it_cannot_be_served: >-
      `python3 -m orchestration.adapter doctor --probe`, run by the reviewer in
      the TASK-20260802-de2957 session on 2026-08-02, exit code 0, reports:
      configuration loaded; anthropic, fireworks and fireworks-anthropic unusable
      ($ANTHROPIC_API_KEY / $FIREWORKS_API_KEY unset); openai unusable
      ($OPENAI_API_KEY unset); openrouter unusable ($OPENROUTER_API_KEY unset);
      zai and zai-anthropic unusable ($ZAI_API_KEY unset); and `local` reachable
      for credentials but failing its model probe with "network error listing
      models at http://localhost:8000/v1/models: [Errno 111] Connection refused".
      Every backend is therefore unusable. The transcript is reproduced verbatim
      in contradiction_review.yaml:rule12_status.doctor_probe_evidence.
    consequences:
      - >-
        EV-MLKEM-011 keeps `status: accepted_with_qualifications`. Unchanged.
      - >-
        EV-MLKEM-013 keeps `status: draft`. Unchanged. (It was never officially
        accepted, so the `claim_void` verdict changes nothing official even on
        its own terms - but the point stands independently of that.)
      - >-
        EV-MLKEM-017 keeps `status: accepted_with_qualifications`. Unchanged, and
        narrowed only in the sense its own text anticipated.
      - >-
        H-MLKEM-011 and H-MLKEM-013 keep `status: analyzed`. Neither moves toward
        `weakened` or `rejected`. H-MLKEM-013's own first falsification condition
        is met on this re-analysis; that transition is available to the first
        Coordinator decision that follows a served rule-12 review, and is
        refused here.
      - >-
        KN-FIND-012, KN-FIND-014 and KN-OPEN-016 are NOT superseded, amended,
        retired or edited, and no new KN-FIND is promoted. Promoting a finding
        that restated or withdrew them would accomplish through the knowledge
        corpus precisely the status change rule 12 forbids making directly.
      - >-
        No prior batch artifact, run record, experiment contract or hypothesis
        was edited. Corrections supersede rather than overwrite (AGENTS.md
        rule 4).
    why_this_is_the_right_outcome_and_not_an_evasion: >-
      The rule exists for the case where being wrong is unrecoverable, and this
      is that case in an unusually literal form: BATCH-007's red team, its
      validator, its coordinator and now this reviewer all reasoned about the
      same archived files and reached materially different conclusions about what
      those files mean, twice in succession. A fifth pass under a policy that
      cannot reach `max` would produce a signed-off answer either way, which is
      the failure mode the `degradable: false` flag is designed to make
      impossible. An unadjudicated contradiction, loudly recorded, is a better
      state than a cheaply adjudicated one.

  # ------------------------------------------------------------------
  # WHAT `weaken` MEANS HERE, PRECISELY
  # ------------------------------------------------------------------
  what_is_weakened:
    target: >-
      THIS PROGRAM'S OWN STANDING INTERPRETATION of Carrier's archived
      verifyModel outputs - not Carrier's paper, not ML-KEM, and not any
      hypothesis' official status.
    specifically:
      - >-
        The reading of `fraction_inside = 0` and the T-gap statistics as
        properties of the score distributions is weakened to an instrument
        resolution bound. This affects EV-MLKEM-011's observations 1-3,
        KN-FIND-012's table rows and its "does not meet" sentence, and
        KN-OPEN-016's "Pwrong coverage gap" bullet.
      - >-
        The k_fft=3 alignment convention is weakened to the point of having no
        support: recomputation from its own cited artifact returns factor 1, and
        the archived data's variance agrees with the raw scale in two files. This
        affects EV-MLKEM-013 entirely, KN-FIND-014 entirely, KN-OPEN-016's
        score-scale bullet, and every "aligned" figure quoted downstream in
        EV-MLKEM-017 and DEC-20260802-15cadd.
      - >-
        The implied remedy in BATCH-007's blocking objection 2 is weakened: the
        deficit is approximately 93-117 bits, not approximately 4, so no feasible
        increase in nb_iteration closes it.
    explicitly_not_done: >-
      `weaken` here changes the program's confidence and forbids downstream
      reliance; it performs NO record transition. `reject_scoped` was considered
      and REFUSED on two independent grounds: rule 12 is unserved, and the
      coordinator contract forbids `reject_scoped` on a single unreplicated
      empirical-only run - the remedy it prescribes is exactly `weaken` plus
      replication, which is what this decision does and what its next action
      schedules.
    why_not_revise: >-
      `revise` (the BATCH-007 disposition) fits a batch whose artifacts stand and
      whose interpretation is re-recorded on top of them. It understates this
      batch: a load-bearing metric of a standing evidence record recomputes to a
      different value from its own cited artifact. That is a movement of
      confidence against a theory, and the honest disposition names it.

  # ------------------------------------------------------------------
  # REFUTATION ARTIFACT ACCOUNTING
  # ------------------------------------------------------------------
  refutation_artifact_accounting:
    requirement: >-
      docs/claims-and-verification.md, "Refutation artifacts": an adverse
      transition (`weaken`, `reject_scoped`, hypothesis -> `rejected`) must be
      backed by the strongest checkable refutation artifact the result admits -
      counterexample certificate, then derivation note, then declared
      `empirical_only` - archived before the decision that relies on it.
    artifact_offered: >-
      The strongest available basis is a DERIVATION with a counterexample
      character, and it is what EV-MLKEM-018 declares
      (`proof_status: derivation`). Two independent legs. LEG 1, code: the
      archived FFT_sample.py, evaluated as written, returns FFT()/compute_score()
      = 1.000000000000 across five parameter settings, and returns exactly
      1/k_fft when and only when the duplicated accumulation loop is deleted -
      a constructive counterexample to "the factor is k_fft" together with the
      mechanism that produces it, checkable by anyone from the archived file.
      The cancellation is additionally derivable by hand from the source text.
      LEG 2, data, independent of any code: under the paper's own Model 4.7 the
      raw-scale standard deviation is sqrt(avg_N/2), and both archived Pwrong
      survival functions reproduce it to within 0.2 percent while missing the
      /k_fft prediction by a factor of approximately 3. Two estimators, two
      files, two sessions.
    not_a_certificate_and_why: >-
      No formal certificate is available or claimed. The objects here are a
      third-party Python script and two survival-function text files; there is no
      certificate family that a wrapper could re-verify, and the honest tier is
      `derivation`. Declaring that is the requirement; the absence of a proof
      object is not the failure, an undeclared basis would be.
    archival_ordering_caveat: >-
      The refutation artifacts (contradiction_review.yaml, review_notes.md) are
      committed in the SAME ledger archive as this decision, not in a predecessor
      commit, because BATCH-008 carried no separate snapshot task and
      tools/research_dispatch.py verifies a ledger archive against the union of
      its declared archive paths and its source tasks' paths in one commit. The
      same accounting was recorded for DEC-20260802-15cadd. It is flagged rather
      than hidden: a reader checking "was the artifact archived before the
      decision relying on it" will find them in one commit.

  # ------------------------------------------------------------------
  # OFFICIAL STATUS CHANGES
  # ------------------------------------------------------------------
  official_status_changes:
    ev_mlkem_011: unchanged
    ev_mlkem_013: unchanged
    ev_mlkem_017: unchanged
    h_mlkem_011: unchanged
    h_mlkem_013: unchanged
    kn_find_012: unchanged
    kn_find_013: unchanged
    kn_find_014: unchanged
    kn_find_016: unchanged
    kn_lit_111: unchanged
    kn_open_016: unchanged_and_open
    cost_mlkem_001: unchanged
    exp_mlkem_011: unchanged
    exp_mlkem_013: unchanged
    goal_mlkem_003: active -> paused (budget exhausted; see pause_rationale)
    new_records: [EV-MLKEM-018, DEC-20260802-937ba9]
    note: >-
      Every entry above except the goal is `unchanged` for one of two reasons:
      rule 12 is unserved (the evidence, hypothesis and knowledge records), or
      the record is simply out of this batch's scope. No field of any prior
      record was edited by TASK-20260802-9abae7.

  # ------------------------------------------------------------------
  # PENDING RECOMMENDATIONS - RECORDED, NOT EXECUTED
  # ------------------------------------------------------------------
  pending_recommendations:
    binding_status: >-
      These are the TASK-20260802-de2957 reviewer's recommendations, carried
      here so they are durable and auditable. NONE of them is executed by this
      decision. Each is unblocked only by a served rule-12 `review-breakthrough`
      pass at `max` followed by a Coordinator ledger archive.
    KN-FIND-012:
      recommendation: supersede_with_restatement
      status: PENDING_RULE_12
      detail: >-
        The table is numerically correct and reproduces exactly; two rows and one
        sentence need restating. Label the row "fraction of Pgood with T <= 1802
        | 0" a RESOLUTION BOUND. Relabel "bits below toy floor approx 84" as
        "bits below the toy INSTRUMENT FLOOR" and carry 83.87 / 142.09 / 208.33
        for Kyber-512/768/1024. Replace "measures Pwrong only on a T-interval
        that does not meet the Pgood approx 1/2 operating threshold" with
        "measures Pwrong only over the band its counting resolution permits,
        Pwrong in [2^-35.70, 2^-1]; the operating threshold lies approximately
        93-117 bits of survival probability below that band by the file's own
        measured tail slope". Carry the existing Non-claims forward and add: this
        is not evidence that Approximation 4.9 is wrong.
    KN-FIND-014:
      recommendation: supersede_as_withdrawn_on_the_merits
      status: PENDING_RULE_12
      detail: >-
        Its title, both bullets under "What is established", and every row of its
        table rest on a k_fft asymmetry that recomputation from its own cited
        artifact falsifies, corroborated code-independently by the archived data's
        variance. Its `erratum` tag is doubly wrong: the archived code is
        self-consistent, and the cancellation makes the authors' pipeline
        correct rather than inconsistent. The successor finding - a NEW entry
        under a fresh random-suffix id, since KN-FIND-014 is immutable and would
        carry `superseded_by` - should record (a) the cancellation mechanism,
        (b) that no alignment is warranted, and (c) that EV-MLKEM-011's raw
        figures were already on the correct common scale. This is the more
        serious of the two corrections and it is arithmetic, not phrasing.
    KN-OPEN-016:
      recommendation: amend_via_supersession
      status: PENDING_RULE_12
      detail: >-
        Three changes. (i) Restate the "Pwrong coverage gap" bullet as the
        dynamic-range bound rather than as a coverage claim. (ii) Replace the
        "Score-scale audit (KN-FIND-014 / EV-MLKEM-013)" bullet with the
        corrected finding that there is no k_fft asymmetry. (iii) Replace its
        stated residual ("measure Pwrong near the aligned operating threshold"),
        which is not merely unattempted but counting-INFEASIBLE by approximately
        93-117 bits, with the successor experiments F1-F4 below, naming F1 as the
        next action; and extend "What would close it" to acknowledge that direct
        measurement at the operating threshold requires a rare-event estimator or
        a proof, not a bigger run.
      successor_experiments:
        - id: F1
          rank: 1
          cost: zero sampling, arithmetic only
          statement: >-
            Implement Approximation 4.9's integral (equations 4.22-4.24) at both
            Fig 4.1 parameter sets and compare the PREDICTED survival curve
            against the archived measurement pointwise over the band the
            instrument actually resolves - Pwrong in [2^-35.70, 2^-1] left panel,
            [2^-36.29, 2^-1] right. Report the signed discrepancy and, critically,
            its TREND in T. The paper itself says the right panel "suggests our
            analysis may be slightly optimistic"; quantifying that is a real
            measurement the archive supports and the program has never made. This
            converts a coverage complaint into a model test.
        - id: F2
          rank: 2
          statement: >-
            Feed F1's discrepancy trend into the existing lever: KN-FIND-013 /
            EV-MLKEM-012 already quantify that only approximately 9.46 / 14.36 /
            14.76 bits of Pwrong miss erase the CC NIST shortfalls for
            Kyber-512/768/1024. A measured drift over the resolved band plus a
            stated extrapolation assumption yields a BOUNDED SENSITIVITY
            STATEMENT. It does not yield a security claim.
        - id: F3
          rank: 3
          statement: >-
            The missing decay control, cheap: re-run verifyModel at two or three
            values of nb_iteration with all other parameters fixed and confirm
            the support endpoint moves as -log2(nb_iteration * q^k_fft) predicts.
            Emit per-iteration exceedance counts at the same time so the
            effective replicate count - and hence the instrument's true
            resolution rather than a lower bound on it - becomes recoverable.
        - id: F4
          rank: 4
          statement: >-
            The only route to the operating threshold. A counting estimator
            cannot reach 2^-129; that needs a rare-event estimator - importance
            sampling or tilting of the dual-vector or decoding-distance
            distribution, or bucketed enumeration of the kind Ducas-Pulles use
            for the non-polar score. Whether such an estimator admits a
            defensible change of measure for the POLAR-CODED score is genuinely
            open and is the right successor question for KN-OPEN-016.
        - id: F5
          rank: 5
          statement: >-
            Archive Algorithm.py so that "which code path wrote these .out files"
            becomes answerable from repository bytes. Its absence is what let the
            EV-MLKEM-013 error stand for two batches.
    other_records_flagged_for_the_unblocked_decision:
      - record: EV-MLKEM-011 `scale_note`
        detail: >-
          Defers T statistics to EV-MLKEM-013's void alignment. Needs a
          superseding note; the record itself is immutable.
      - record: H-MLKEM-011
        detail: >-
          Its -119.57 framing is correct; the surrounding coverage language
          inherits the confound.
      - record: H-MLKEM-013 / EXP-MLKEM-013 / RUN-MLKEM-013-001
        detail: >-
          H-MLKEM-013's first falsification condition is met on this
          re-analysis. EXP-MLKEM-013's frozen criteria could not catch a scale
          factor of 1; a successor experiment must test the COMPOSITE
          init()+FFT() path against compute_score(), not the two method bodies in
          isolation. RUN-MLKEM-013-001 violates the artifact policy (no command,
          no stdout, empty stderr) and that defect - not the audit's reasoning -
          is the proximate cause of the error's survival.
      - record: EV-MLKEM-017 / DEC-20260802-15cadd
        detail: >-
          Sentences quoting the aligned Pgood minimum 2222.56 or the aligned
          T-gap 420.56 inherit the void alignment and should be read on the raw
          scale. Both records are immutable and are narrowed by EV-MLKEM-018
          rather than edited.
      - record: KN-LIT-111
        detail: >-
          The upgrade DEC-20260802-15cadd scheduled (its "Not verified here"
          section records that only the abstract was read) was NOT performed:
          BATCH-008 was re-scoped entirely to the contradiction review, so the
          Ducas-Pulles mining task planned as candidate A was not dispatched.
          Recorded as an outstanding, unexecuted item rather than as done.

  # ------------------------------------------------------------------
  # EXPLICIT NON-CLAIMS
  # ------------------------------------------------------------------
  explicit_non_claims:
    - >-
      ML-KEM IS NOT BROKEN. Nothing in BATCH-008 is a cryptanalytic result, and
      no ML-KEM break is claimed, implied, or supported.
    - >-
      NO SECURITY LEVEL CHANGES. No FIPS 203 / ML-KEM parameter set is affected
      or cleared by this batch. No cost model was built or revised;
      COST-MLKEM-001's conditional envelope is untouched.
    - >-
      NOTHING HERE SHOWS APPROXIMATION 4.9 IS WRONG, NOR THAT IT IS RIGHT. The
      comparison that would speak to it (F1) has never been run by this program.
    - >-
      NOTHING HERE IS A CRITICISM OF CARRIER'S PUBLISHED ANALYSIS. Both findings
      are corrections to THIS PROGRAM's reading of a verification-model
      directory. If anything, the k_fft cancellation makes the authors' pipeline
      self-consistent, which is the opposite of the "inconsistent normalization"
      finding this program recorded.
    - >-
      NO CRYPTO-SCALE CLAIM. All measured data touched are toy-parameter
      (q=241, m=40, n=43/50). AGENTS.md rule 7 applies without exception.
    - >-
      NO RECORD IS CORRECTED, SUPERSEDED OR WITHDRAWN BY THIS DECISION. The
      recommendations above are pending, not performed.
    - >-
      NO THREE-MODEL CLOSURE QUORUM IS ASSERTED OR SOUGHT. GOAL-MLKEM-003 moves
      to `paused`, which asserts no success and requires no quorum. No
      attestation was obtained and none is recorded.
    - >-
      KN-OPEN-016 REMAINS OPEN. Nothing here resolves whether the dual attack
      beats the primal attack.

  # ------------------------------------------------------------------
  # PAUSE
  # ------------------------------------------------------------------
  pause_rationale:
    condition_met: campaign_budget_maximum_batches_exhausted
    detail: >-
      This is batch 8 of `maximum_batches: 8`. DEC-20260802-002 authorized
      exactly two batches "after which the campaign returns to a pause decision
      unless extended again"; BATCH-007 and BATCH-008 are those two. The goal's
      own first pause condition - "The six-batch campaign budget is exhausted
      without an admissible next mechanism" - is met in its extended form.
    second_independent_reason: >-
      Even with budget, the rule-12 `review-breakthrough` pass needed to ACT on
      this batch's findings cannot be served in this environment (every backend
      unusable per doctor --probe). Dispatching further batches would generate
      more findings that cannot be adjudicated, which is how an unadjudicated
      contradiction becomes a pile of them.
    status_choice: >-
      `paused`, deliberately - not `completed` and not `closed_at_budget`.
      `paused` asserts no success and needs no closure quorum (AGENTS.md rule 13
      and "Goal closure quorum"). The goal's completion criteria are NOT met: no
      independently re-derived FIPS 203 security estimate under a
      memory-charged cost model calibrated by measured sieve behaviour exists,
      and no Validator/Red Team admission of such a package exists. Marking this
      goal `completed` would be a contract violation; recording an attestation
      that was not obtained would be worse.

  # ------------------------------------------------------------------
  # KNOWLEDGE PROMOTION
  # ------------------------------------------------------------------
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      BLOCKED BY AGENTS.md RULE 12, and this is the whole reason. The two durable
      results of this batch - the restatement of KN-FIND-012's coverage
      statistics as an instrument resolution bound, and the withdrawal of
      KN-FIND-014 on the merits - are precisely a contradiction between
      independently validated evidence records. Rule 12 requires an independent
      `review-breakthrough` pass at `max` before that contradiction may change
      any official standing, and `orchestration/model-policies.yaml` marks that
      policy `degradable: false` with `fallback_policy: null`. It cannot be
      served here: `python3 -m orchestration.adapter doctor --probe` reports
      every remote backend unusable (ANTHROPIC_API_KEY, FIREWORKS_API_KEY,
      OPENAI_API_KEY, OPENROUTER_API_KEY, ZAI_API_KEY all unset) and the local
      backend's model probe failing with connection refused. Promoting a KN-FIND
      now - whether a restatement of KN-FIND-012, a withdrawal successor to
      KN-FIND-014, or an amendment of KN-OPEN-016 - would accomplish through the
      knowledge corpus exactly the status change the rule forbids making
      directly, so it is refused. Note also that this decision's disposition is
      `weaken`, which does not itself trigger the mandatory-promotion rule (that
      applies to `support` and `reject_scoped` on `replicated`/`strong`
      evidence); the block above is the binding reason, and the disposition is
      not offered as an excuse.
    concrete_successor: >-
      A single successor decision, gated on a served rule-12
      `review-breakthrough` pass at `max` over EV-MLKEM-018, EV-MLKEM-011,
      EV-MLKEM-013 and the TASK-20260802-de2957 review artifacts. If that review
      concurs, it unblocks in one ledger archive: the KN-FIND-012 restatement,
      the KN-FIND-014 withdrawal successor under a fresh random-suffix id, the
      KN-OPEN-016 amendment carrying F1-F4, the regenerated knowledge/INDEX.md,
      and the corresponding status transitions on EV-MLKEM-011 / EV-MLKEM-013 /
      H-MLKEM-013. If it dissents, the dissent stands on the merits and this
      decision's `weaken` is the ceiling. Either way the promotion is made by a
      Coordinator ledger archive, never by the review itself
      (`may_change_official_state: false`).
    promote: false

  # ------------------------------------------------------------------
  # RANKING RATIONALE
  # ------------------------------------------------------------------
  ranking_rationale:
    basis: >-
      AGENTS.md "Research-direction integrity and auditability" and
      docs/inventor-protocol.md section 4. The campaign budget is exhausted, so
      what is ranked here is not a remaining allocation but the queue a budget
      extension would inherit. Each candidate carries its evidence, cost, test
      boundary, remaining uncertainty and revisit condition.
    candidates:
      - id: A
        candidate: >-
          F1: recompute Approximation 4.9's predicted survival curve and compare
          it pointwise against the archived measurement over the band the
          instrument resolves, reporting the signed discrepancy and its trend
          in T.
        rank: 1
        cost: Arithmetic only. No sampling, no network, no G6K.
        why_first: >-
          It is the only direct test of the model that the archived bytes can
          support, it costs nothing, and this program has never attempted it -
          two batches were spent on coverage statistics that turned out to
          measure the instrument, while the comparison that measures the MODEL
          sat unrun. The paper's own text ("suggests our analysis may be slightly
          optimistic") says where to look.
        test_boundary: >-
          Toy parameters, the resolved band only. It says nothing about the
          threshold regime and nothing about Kyber.
      - id: B
        candidate: >-
          The rule-12 `review-breakthrough` pass at `max` on the contradiction,
          as the gate on every transition and every knowledge promotion listed
          above.
        rank: 1 (tied, and a gate rather than a rival)
        cost: One independent review session; no compute.
        stated_risk: >-
          It is currently unservable and that is why this goal is paused. It is
          not optional and cannot be substituted; recording a degraded review as
          a rule-12 pass is the one outcome worse than no review.
      - id: C
        candidate: >-
          F3: the missing decay control - re-run verifyModel at two or three
          values of nb_iteration with all else fixed, emitting per-iteration
          exceedance counts.
        rank: 2
        why_not_first: >-
          It confirms an identity already established analytically and by two
          files. Its real value is the per-iteration breakdown, which converts
          the instrument's resolution from a lower bound into a measured value.
        revisit_condition: >-
          Promote it above A if any reader disputes that the archived endpoints
          are budget-determined; it is the experiment that settles that
          empirically.
      - id: D
        candidate: >-
          Mine Ducas-Pulles properly (DEC-20260802-15cadd's candidate A) and
          upgrade KN-LIT-111.
        rank: 3
        status: NOT EXECUTED in BATCH-008 and recorded as such
        why_deferred: >-
          BATCH-008 was re-scoped entirely to the contradiction review, which was
          the right call - a program acting on statistics it had reason to
          believe were confounded would compound the error - but it means the
          most transferable paper in the lattice corpus remains mined only at
          n=90. This is an outstanding item, not a closed one.
      - id: E
        candidate: >-
          F4: a rare-event estimator for the polar-coded score, the only route to
          the operating threshold.
        rank: 4
        why_last_and_why_not_dropped: >-
          Genuinely open and genuinely hard - it needs a defensible change of
          measure for a score this program has not modelled. It is ranked last on
          cost, not on interest; it is the successor question KN-OPEN-016 should
          carry, and it is explicitly NOT abandoned.
      - id: F
        candidate: >-
          The standing expensive branch: install G6K and measure Pwrong near the
          operating threshold.
        rank: 5
        deprioritized: true
        evidence_for_deprioritization: >-
          Blocked twice on infrastructure (BATCH-003, BATCH-005) - infrastructure
          signal, never mathematical evidence (AGENTS.md rule 5) - and now
          additionally shown to be the WRONG INSTRUMENT for the stated target:
          at the Fig 4.1 parameters a counting estimator cannot reach the
          operating threshold at all, by approximately 93-117 bits. DEC-20260802
          -15cadd deprioritized it pending exactly this arithmetic; the
          arithmetic has now been done and it argues against the branch more
          strongly than before.
        remaining_uncertainty: >-
          A fresh sieve at DIFFERENT, more favourable parameters (smaller q,
          smaller k_fft, larger nb_iteration) might resolve a band that the Fig
          4.1 parameters cannot. That is a real and unexplored option and this
          decision does not close it.
        revisit_condition: >-
          Reopen if (i) F1 shows the archived survival function is inconsistent
          with Approximation 4.9 over the resolved band, making a direct
          measurement decisive; or (ii) a parameter set is identified where the
          counting floor and the operating threshold are within reach of each
          other; or (iii) a working G6K install is demonstrated independently of
          this goal.
    dominated_by: >-
      For "has measured Pwrong at the Pgood=1/2 threshold been reported for a
      dual-sieve-FFT score?", this program's position remains dominated by
      Ducas-Pulles sections 5.2-5.3 and their published CSVs on every axis that
      matters (tail depth measured, dimensions covered, common score scale) - and
      BATCH-008 did not narrow that gap, because it spent its budget repairing
      the program's own record instead. For the narrower question about Carrier's
      polar-coded score at Carrier's Fig 4.1 parameters, no dominating source is
      known and completeness is NOT asserted: Guo-Johansson (KN-LIT-109) remains
      unretrieved, so that row of the frontier is unchecked.
    sota_delta: >-
      Zero. BATCH-008 produced no time, memory, data/query or security-bits delta
      against any baseline and claims none. Its delta is entirely internal and
      negative-going: one standing evidence record's load-bearing metric
      recomputes to a different value, and a second record's headline statistic
      is reclassified from a measurement to a bound.
    named_obstruction: >-
      At the Fig 4.1 parameters (q=241, k_fft=3, avg_N approximately 25971) the
      experimental Pwrong is a counting estimator with resolution
      1/(nb_iteration * q^k_fft) = 2^-35.7045, while the threshold at which
      Pgood approx 1/2 sits at score approximately 11964, where the file's own
      measured tail slope puts Pwrong at roughly 2^-129 to 2^-153. The
      obstruction is an approximately 93-117 bit DYNAMIC-RANGE DEFICIT, not an
      unattempted measurement, and no feasible increase in nb_iteration removes
      it. Stated with its argument and with forward guidance (F1-F5), per the
      closure standard; the lane is mis-instrumented, not dead, and it is not
      declared closed.
    premature_closure_check: >-
      This decision closes no lane. It pauses a goal on an exhausted budget and
      an unservable gate, keeps KN-OPEN-016 open, keeps F1-F5 named and ranked,
      keeps the G6K branch revisitable under three stated conditions, and records
      the Ducas-Pulles mining task as outstanding rather than done.

  # ------------------------------------------------------------------
  # LIMITATIONS
  # ------------------------------------------------------------------
  limitations:
    - >-
      This decision covers exactly the BATCH-008 contradiction review and the
      resulting pause. It adjudicates nothing about ML-KEM security, about
      Carrier's Kyber cost figures, about whether 143.30 or 134.30 is the
      arithmetically correct Table C.2 value, or about KN-OPEN-016.
    - >-
      The review it rests on is `review-adversarial`, not `review-breakthrough`.
      It is an independent session whose reviewer did not originate either record
      under review, and its findings stand on reproducible artifacts - but it is
      NOT the review AGENTS.md rule 12 requires, and its own document says so
      first.
    - >-
      The reviewer recorded `fallback_used: true` and `model_verified: false`
      (the harness cannot resolve orchestration policy aliases; no reachable
      backend). The same is true of this coordinator session. Inference
      provenance throughout is self-reported.
    - >-
      Three of the review's conclusions are recorded on the reviewer's
      computation and were NOT re-derived by me: the five-setting FFT/compute_score
      ratio, the tail-slope extrapolation and iteration counts, and the
      Gaussian-excess figure. I verified the counting-resolution identity, the
      unused loop index, and the variance consequence by an independent
      estimator.
    - >-
      Five things the review could not determine are recorded in EV-MLKEM-018's
      `could_not_determine` and none is argued away: the third Pwrong file is not
      in the repository so BATCH-007's -23.74 row is unverifiable (only
      -log2(241^3) = -23.738668 was confirmed); Algorithm.py is unarchived so the
      .out producer is not determinable from bytes; the instrument's effective
      resolution is a lower bound, not a demonstrated value; numpy was
      unavailable so fftn was replaced by a direct evaluation of its documented
      definition; and alpha in Approximation 4.8 appears in no archived extract
      and was scanned, so that corroboration is not load-bearing.
    - >-
      The tail-slope extrapolation underlying the approximately 93-117 bit figure
      is a DIAGNOSTIC under a stated functional assumption, not a measurement. It
      is used to size the instrument deficit and to reject the "run longer"
      remedy, and no verdict rests on it as evidence for a distributional claim.

