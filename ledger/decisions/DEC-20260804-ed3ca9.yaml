coordinator_decision:
  id: DEC-20260804-ed3ca9
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-6ec7a4
  batch_number: 4
  recorded_at: '2026-08-04'

  decision: refine
  target_ids: [GOAL-MLKEM-004]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.
  decision_label: >-
    Null control confirms inflation is not secret-specific but cannot resolve
    QEMU vs genuine sieve correlation. Red team identifies a new feasible test:
    paired (correct, null) scoring within the same run to measure
    Corr(T_N_correct, T_N_null). High correlation → environmental inflation.
    Near-zero → genuine secret-specific variance. Batch 5 runs this test.

  context: >-
    GOAL-MLKEM-004 BATCH-6ec7a4 (batch 4 of 6). Test A: null control ratio=1.53
    (p=0.010, n=50). Test B: outlier seeds reproduce exactly (delta=0.000).
    Validator: accept_with_qualifications. Red team: blocking_objections on
    OBJ-QEMU (null cannot distinguish hypotheses) and OBJ-NO-NATIVE-HARDWARE.
    Snapshot 4d5defb2.

  evidence_refs:
    - EV-MLKEM-563ebd

  rationale: >-
    ratio_correct/ratio_null = 0.908 (correct-secret variance is 9% LOWER
    than null-secret variance, normalised by their respective independence
    predictions). The direction is weakly consistent with environmental inflation
    (H1) rather than genuine Ducas-Pulles secret-specific correlation (H2), but
    F(49,149)=1.10 (p=0.32) — the difference is not significant. Neither
    hypothesis is favoured. The decisive test (native hardware) is not available
    in this session. The red team identified a feasible in-QEMU test: the paired
    test measures Corr(T_N_correct, T_N_null) across runs. If the two are
    highly correlated (both track per-run sieve quality), the variance is
    environmental. If near-zero correlation, the variances are independent and
    the correct-secret variance cannot be explained by environmental factors.

  what_survives:
    - >-
      ratio_null = 1.53 in QEMU — the variance inflation exists for BOTH
      correct and null secrets, confirming the inflation is not a signal artifact.
    - >-
      ratio_correct / ratio_null = 0.908 < 1 — direction weakly consistent
      with environmental inflation, not with secret-specific Ducas-Pulles
      violation. The correct-secret variance is NOT larger than the null-secret
      variance after normalization; if anything, it is slightly smaller.
    - >-
      Outlier seeds reproduce to bit precision across re-runs — deterministic
      sieve at fixed seed, as expected.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No finding. OBJ-QEMU remains blocking. The ratio_correct/ratio_null
      direction is informative but not significant. Rule 12 UNMET and UNWAIVED.

  next_actions:
    - >-
      Open BATCH-1be68e (batch 5 of 6). Primary: PAIRED TEST. For each of
      40-50 seeds (from numpy.random.default_rng(20260804003).integers(0,2**32,
      size=50).tolist()), run a single sieve and score BOTH the correct secret
      s AND a fixed wrong secret s* (same as batch-4, from seed 20260804999)
      on the SAME set of sieve vectors. Record T_N_correct_i and T_N_null_i.
      Compute: Corr(T_N_correct, T_N_null) — the Pearson correlation across
      the 50 runs. Also Cov/Var ratio. If Corr ≥ 0.8, the correct and null
      track together → environmental inflation (ratio_correct/ratio_null is the
      signal). If Corr ≤ 0.3, they are independent → correct-secret has extra
      variance beyond what the null explains. Budget: maximum_runs: 55.

  decided_by: coordinator
  decided_at: '2026-08-04'

  inference_provenance:
    requested_policy: coordinator-archive
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
