  rationale:
    - >-
      Validity first. Run count (1 of 1), seeds (none, deterministic),
      raw/summary agreement and frozen inputs all check out. The run record is
      incomplete: the manifest is not schema-complete (V-1), companion artifacts
      are missing (V-2), and the record is unpublished (V-3). Under the
      Coordinator contract an incomplete run set goes back to the executor and is
      not evidence, so EV-SEMBIN-5e2b97 does not cite it in run_ids.
    - >-
      Independent of the run, the derivation in EV-SEMBIN-5e2b97 (D1-D6) shows that
      the frozen driver admits no positive-degree multiplier at cap 4, the
      generator degree. All three labels are therefore properties of the three
      generators alone and are invariant under the shift: def5_true = 5,
      def6_fake = 4 and an absent Macaulay label on BOTH sides. matrix_holds is
      identical to planted_ok. The preregistered compound was fixed by the
      contract's parameters before execution.
    - >-
      The matched unshifted side shows the same Boolean-vs-unreduced split, so the
      shift contributes nothing. The declared null control (V-6) cannot fail, and
      the checker (V-7) imports the driver it checks.
    - >-
      Two explanations therefore predict identical data: (a) the coset shift
      separates the labels, and (b) the separation is a construction artifact
      present without the shift. The decision is inconclusive, not support. The
      literal hypothesis statement holds at stage-0 scope, but vacuously with
      respect to the shift.
    - >-
      Not adverse. No weaken or reject_scoped is warranted, because nothing about
      the shift heuristic was measured. The derivation is recorded as the
      checkable basis (proof_status derivation) for the neutral direction only.
    - >-
      Success criterion (AGENTS.md "Every improvement is a success"): no ECDLP cost
      is measured, so no improvement over the index-calculus baseline exists to
      record. The distance remaining to the matched rho is unmeasured by this
      experiment.
