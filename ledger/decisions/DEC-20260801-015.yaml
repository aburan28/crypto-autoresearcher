  # =====================================================================
  # 1. WHY THIS EXPERIMENT, AND WHY IT IS FIRST
  # =====================================================================
  context: >-
    BATCH-027 measured HEUR-DS-1's object for the first time in twenty-seven
    batches and branch L-4 of RR-LPF-2 fired - one certifying comparison of ten
    outside its archived band, at ONE cell, direction BELOW_BAND, disposition
    `inconclusive`, H-LPF-001 staying `approved` and not advancing
    (DEC-20260801-014, EV-LPF-001). THE REASON THAT OUTCOME CAN BE NEITHER
    STRENGTHENED NOR DISMISSED IS OBJ-RT082-1, AND IT IS THE SINGLE LARGEST
    HOLE THE CAMPAIGN HAS DECLARED. The frozen band is calibrated to a noise
    source the real arm does not have. OBJ-NULL-UNIF is 130,816 iid draws and
    its 200-replicate sd matches sqrt(p(1-p)/n) to within about 8 percent at
    every powered rung - measured ratios 0.928, 0.962, 1.012, 1.033, 1.037,
    1.049, 1.052, 0.999. OBJ-REAL IS NOT A SAMPLE; the frozen specification
    says so in terms - "OBJ-REAL IS EXHAUSTIVE OVER THAT INDEX SET. It carries
    no sampling seed and no sampling noise at all" - and its 130,816 values are
    determined by 512 factor-base x-coordinates each appearing in 511 pairs,
    n = C(512, 2) = 130816 exactly. THE SCALE THAT ACTUALLY FLUCTUATES, ACROSS
    CURVE INSTANCES, WAS NEVER MEASURED, BECAUSE THERE IS ONE INSTANCE PER CELL.
  why_it_is_decisive_and_it_cuts_both_ways: >-
    THIS IS NOT AN ARGUMENT FOR EITHER READING AND THAT IS EXACTLY WHY IT GOES
    FIRST. If the between-instance sd EXCEEDS the iid sd - which the
    C(512,2)-from-512 dependence structure makes entirely possible, since a
    nonzero first-order projection would put the effective sample size nearer
    512 than 130,816 - then the true per-comparison false-fire rate is far above
    4/201, THE ONE REJECT IS NOISE, AND THE NINE NON-REJECTIONS ARE NEARLY
    VACUOUS, because a band too narrow is one a genuinely deviant real arm would
    also have passed at u = 4 and u = 5. If the between-instance sd is BELOW the
    iid sd, both the reject and the non-rejections are stronger than they look.
    NOBODY KNOWS WHICH AND THE BATCH-027 PACKAGE CANNOT TELL. The
    detection-floor table published in EV-LPF-001 - u = 2 plus or minus 1.7
    percent, u = 3 plus or minus 4.5, u = 4 plus or minus 13, u = 5 plus or
    minus 39 - COULD BE RIGHT BY A FACTOR OF ONE OR WRONG BY A FACTOR OF ABOUT
    SIXTEEN, and nothing in the campaign currently distinguishes those two
    worlds. IT IS NOT REPAIRABLE BY ARGUMENT.
  why_it_outranks_everything_including_the_seven_new_proposals: >-
    IT IS THE ONLY ACTION THAT SIMULTANEOUSLY (i) DECIDES WHETHER THE FROZEN
    BAND IS THE CORRECT YARDSTICK FOR A DETERMINISTIC EXHAUSTIVE ARM AT ALL, and
    therefore whether the entire detection-floor table is right by a factor of
    one or a factor of sixteen; (ii) DECIDES WHETHER THE BITS-16 u = 2 SHORTFALL
    REPRODUCES OR EVAPORATES, which is the single question BATCH-027 cannot
    answer, since that statistic has by far the finest resolution in the package
    at plus or minus 0.87 percent and a genuine 0.8 percent offset would reappear
    at a fresh instance while noise would not; and (iii) DISCHARGES THE ARTIFACT
    SIDE OF RT049-CTRL-5, without which H-LPF-001 can never reach `replicated`
    and therefore can never reach `supported`. It is ALSO the
    docs/inventor-protocol.md section 3 control in its CORRECT form - the
    identical measurement against a null object of the SAME SHAPE, which a
    uniform integer sample is not, since it lacks both the C(512,2)-from-512
    dependence and the instance. AND IT IS CHEAP - about ten minutes of compute
    on the measured 18.0 s per-instance timing.

  # =====================================================================
  # 2. THE RULING THAT HAD TO BE MADE FIRST
  # =====================================================================
  new_experiment_id_versus_control_ruling:
    id: RULE-BATCH028-CTRL
    verdict: >-
      A CONTROL ARM UNDER EXP-LPF-001. NO NEW EXPERIMENT ID, NO NEW HYPOTHESIS.
      Run id RUN-LPF-001-ivr; control contract and control reading rule RR-IVR-1
      as NEW FILES AT NEW PATHS under experiments/EXP-LPF-001/control_ivr/.
    grounds_1_it_changes_the_object_not_the_apparatus: >-
      The apparatus is byte-identical. Same INT-1 map, same ENC-B encoding, same
      Bfb = 512 deterministic-base rule, same exhaustive i < j enumeration of
      130816 half-tuples, same factorization and same largest-prime-factor
      statistic, computed by the SAME hash-bound lpf001_driver.py at 786aeb05,
      which this batch IMPORTS and does not edit. What changes is the curve
      instance. EXP-LPF-001 ALREADY CARRIES FOUR OBJECTS UNDER ONE CONTRACT -
      OBJ-REAL, OBJ-NULL-UNIF, OBJ-CTRL-PRODUCT and the OBJ-PLANT-ROUGH /
      OBJ-PLANT-SMOOTH families - so declaring a fifth, OBJ-REAL-FRESH, is the
      same move the contract already makes four times and is not a new
      experiment.
    grounds_2_it_is_this_experiment_s_own_named_control: >-
      RT082-CTRL-1 is a required control of EXP-LPF-001 filed by EXP-LPF-001's
      own red team, and it discharges RT049-CTRL-5, a control debt of
      EXP-LPF-001 recorded at SCOPE-7. RR-LPF-2's L-4 disposition NAMES IT IN
      TERMS - "the replication at a DIFFERENT curve instance per cell named as
      the single next action" - so the frozen rule of EXP-LPF-001 itself
      commissions this arm. A control of an experiment belongs to that
      experiment.
    grounds_3_a_new_exp_id_would_orphan_the_calibration_and_the_driver: >-
      THIS IS THE ARGUMENT THAT DECIDED THE EXP-SMTH VERSUS EXP-LPF QUESTION,
      AND IT DECIDES THIS ONE THE OTHER WAY. Every quantity this batch reports
      is a RATIO whose DENOMINATOR is an EXP-LPF-001 calibration array - the
      200-replicate iid null sds archived at snapshot 104d32fa, bits-16 u = 2
      equal to 0.0012764339776488623. Under a new EXP id those arrays become a
      foreign input; their ADMISSIBLE determination and their anti-tuning
      ancestry chain ba1567ee -> 104d32fa -> 2ff751c5 would attach to a contract
      that is not the one they were approved under; and ATS-LPF-1, the strongest
      anti-tuning fact this campaign has, would no longer bind the arm that
      consumes them. Keeping the control inside EXP-LPF-001 keeps that chain
      intact and mechanically checkable at every archive of this batch.
    grounds_4_immutability_satisfied_and_exactly_how: >-
      JUSTIFIED AGAINST THE RULE RATHER THAN ASSERTED AGAINST IT. AGENTS.md
      rule 4 forbids EDITING a record; it does not forbid ADDING one. NOTHING
      EXISTING IS EDITED BY ANY TASK IN THIS QUEUE. The control specification,
      RR-IVR-1 and the wrapper driver are NEW FILES AT NEW PATHS, each frozen
      and hash-bound before any datum, each appearing in exactly one write_scope,
      and each committed alone at TASK-20260802-004 before any independent
      session reads them and before any instance of the frozen seed family
      exists. THIS IS PRECISELY THE RR-LPF-1 -> RR-LPF-2 PRECEDENT - a
      superseding sibling file at a new path with a new hash, independently
      reviewed, never an edit - which BATCH-026 authored, TASK-20260801-068
      reviewed and BATCH-027 used to adjudicate a real measurement. The four
      upstream hash-bound artifacts must still hash to their bound values at
      EVERY archive, and a mismatch VOIDS the reduced duty set and STOPS the
      batch.
    the_counter_argument_stated_and_answered: >-
      THE STRONGEST CASE FOR A NEW EXP ID IS THAT THE FROZEN SPECIFICATION PINS
      OBJ-REAL TO generate_instance(2301, 16) AND generate_instance(2301, 20),
      SO A RUN AT OTHER INSTANCES IS OUTSIDE THE DECLARED OBJECT; and that the
      free rider - the 512 per-index smooth rates - is a quantity the frozen
      driver does not compute. BOTH ARE ANSWERED WITHOUT WEAKENING ANYTHING.
      The first is answered by the definition of a control: an arm at a
      different object under the same apparatus, which is what OBJ-NULL-UNIF,
      OBJ-CTRL-PRODUCT and the two plant families already are. The second is
      answered by construction - the wrapper IMPORTS the frozen driver and
      recomputes the per-index aggregation outside it, so lpf001_driver.py is
