      the crypto-scale gap (V6). A VR MEASURED FOR THIS BASE AND THIS ENCODING
      IS A VR FOR THIS BASE AND THIS ENCODING.
    what_this_ruling_does_not_do: >-
      IT DOES NOT ADVANCE H-LPF-001 AND NO TASK IN THIS BATCH WRITES
      ledger/hypotheses/H-LPF-001.yaml. RT082-CTRL-1 PRODUCES the artifact
      RT049-CTRL-5 demands - measurements at fresh curve instances - but whether
      that artifact supports `replicated` IS A SEPARATE ADJUDICATION requiring
      the certifying statistics to be re-read under RR-LPF-2 at those instances,
      AND RR-LPF-2'S BANDS ARE THE VERY THING UNDER TEST. Adjudicating
