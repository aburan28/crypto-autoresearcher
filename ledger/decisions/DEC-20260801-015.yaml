    what_the_ruling_costs_and_it_is_stated_rather_than_hidden: >-
      A CONTROL UNDER AN EXISTING EXPERIMENT INHERITS THAT EXPERIMENT'S SCOPE
      LIMITS AND EVERY ONE OF THEM TRAVELS - V1 through V12, ABS-REL-LPF-1,
      LIMBB-DECL-RR066, SCOPE-1 through SCOPE-10, RT049-B6 sharpened. The
      control changes THE INSTANCE AND NOTHING ELSE, so it does not touch the
