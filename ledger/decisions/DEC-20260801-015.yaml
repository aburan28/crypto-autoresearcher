      contract and it is deliberately not done in this batch.

  # =====================================================================
  # 3. THE PRE-REGISTRATION, FIXED HERE AND NOT BY THE CONTRACT AUTHOR
  # =====================================================================
  pre_registration:
    why_the_coordinator_fixes_it_rather_than_the_contract_author: >-
      ANTI-TUNING. If the seed family, k, the rungs, the primary quantity and
      the reading rule are chosen by the session that also builds the
      instrument, every one of them is a free parameter that could in principle
      be set after a glance at an instance. Fixing them in THIS record, which is
      committed alone at TASK-20260802-002 before any contract author is
      engaged and before any instance exists, removes that degree of freedom
      entirely and makes the removal checkable against Git ancestry. THIS IS A
      STRONGER ANTI-TUNING POSTURE THAN BATCH-027 HAD, and BATCH-027's was the
      strongest the campaign had had.
    design_fixed_here:
      run_id: RUN-LPF-001-ivr
      k_per_cell: 20
      cells: 'bits 16 and bits 20, unchanged from EXP-LPF-001'
      master_seed_family: 'the 20 integers 90001 through 90020 inclusive, used as generate_instance(seed, 16) and generate_instance(seed, 20). Disjoint from 2301 and from every archived stream.'
      substitution_rule: >-
        If generate_instance fails for a seed, or if two seeds yield instances
        identical in every varying component, the DETERMINISTIC replacement is
        the next unused integer upward from 90021, applied in increasing order
        until 20 distinct instances exist at that cell. Every substitution and
        its reason is reported. More than 5 substitutions at a cell is an
        anomaly to be investigated in the execution report but does not itself
        suspend the rule; fewer than 20 distinct instances after the rule is
        exhausted DOES suspend it.
      quantities: 'p_hat(u) at u in {2, 3, 4, 5} and STAT-KS-DICK, per instance, per cell - 5 quantities x 2 cells = 10 VR comparisons.'
      primary_quantity: >-
        VR AT bits = 16, u = 2, DECLARED PRIMARY BEFORE ANY DATUM so the
        headline cannot be chosen after the fact. It is primary because that
        rung has by far the finest resolution in the whole apparatus - band
        half-width plus or minus 0.87 percent of the null mean - and because it
        is the rung at which BATCH-027's single reject fired.
      free_rider: 'the 512 per-factor-base-index smooth rates at every instance, cell and powered rung, with BOTH nulls (see free_rider_correction).'
      permutation_replicates: 2000
      n_per_instance: 130816
      reading_rule_id: RR-IVR-1
    the_reading_rule_is_fixed_in_the_queue_and_transcribed_not_authored: >-
      RR-IVR-1 IS WRITTEN IN FULL AT
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/dispatch_queue.json,
      key reading_rule_rr_ivr_1. TASK-20260802-003 TRANSCRIBES IT VERBATIM and
      may add ONLY derived constants and computational detail; it may not add,
      remove or reword a clause. TASK-20260802-005 diffs the transcription
      clause by clause and re-derives every arithmetic statement independently.

  reading_rule_summary_for_this_record:
    structure: >-
      DELIBERATELY SIMPLER THAN A BRANCH STRUCTURE, AND THE SIMPLICITY IS
      ARGUED RATHER THAN ASSUMED. RR-LPF-2 exists to route one measurement into
      exactly one of six mutually exclusive dispositions about a hypothesis.
      THIS CONTROL ASKS A MEASUREMENT QUESTION WITH A CONTINUOUS ANSWER - what
      is the ratio of the between-instance standard deviation to the archived
      iid standard deviation - and the honest instrument for that is an
      INTERVAL, not a branch. Importing branch machinery would manufacture a
      disposition the data does not carry and would let this batch re-adjudicate
      BATCH-027 through the back door. RR-IVR-1 therefore has ONE suspending
      condition, ONE report, THREE reading clauses stated as CONDITIONAL
      LICENCES rather than dispositions, and a declared multiplicity treatment.
    I_0: >-
      THE ONLY SUSPENDING CONDITION - INTEGRITY. A short arm; a hash mismatch on
      any of the four upstream artifacts or the three frozen control artifacts;
      a factorization-verification fraction below 1.0 at any instance; a seed or
      stream collision; a degenerate count outside its declared band; FEWER THAN
      20 DISTINCT INSTANCES PER CELL after the substitution rule; ALL 20
      INSTANCES AT A CELL IDENTICAL IN EVERY VARYING COMPONENT; the
      contract-freeze tripwire real_object_touched TRUE for the 90001-90020
      family; or any timeout, crash, resource exhaustion or budget cancellation.
      ON FIRING, NO RATIO IS REPORTED AS A MEASUREMENT, no clause fires, and the
      outcome is an INSTRUMENT outcome asserting nothing about OBJ-RT082-1 or
      about any hypothesis in any direction.
    C_WIDE: >-
      The yardstick is declared TOO NARROW at rung u ONLY IF the one-sided 95
      percent lower bound on sigma_between exceeds s_iid AT BOTH CELLS at that
      same u - equivalently only if VR(16, u) >= 1.2596 AND VR(20, u) >= 1.2596.
      It LICENSES the statement that the frozen iid band understates the real
      arm's fluctuation scale at that rung by at least the measured factor, and
      that the corresponding EV-LPF-001 detection-floor entry is conditionally
      wrong by that factor. THE REPAIR IS A SUPERSEDING NOTE UNDER A NEW ID AND
      NEVER AN EDIT. It does NOT re-select any RR-LPF-2 branch, does NOT reverse
      the BATCH-027 disposition, and says NOTHING about whether the intermediates
      are uniform, rough or smooth.
    C_TIGHT: >-
      The yardstick is declared CONSERVATIVE at rung u ONLY IF the one-sided 95
      percent upper bound lies below s_iid AT BOTH CELLS - VR(16, u) <= 0.7297
      AND VR(20, u) <= 0.7297. It does NOT strengthen HEUR-DS-1, does NOT convert
      any BATCH-027 non-rejection into a confirmation, and licenses no `support`.
    C_INDET: >-
      If neither fires at a rung, THE RATIO IS NOT RESOLVED AT THAT RUNG AT
      k = 20, AND THAT IS SAID IN THOSE WORDS. It is NOT read as "the band is
      correct", which is the failure mode this batch exists to correct, and it
      is NOT read as "the band is wrong". Increasing k after seeing an
      indeterminate result is OPTIONAL STOPPING and requires a versioned
      protocol_amendment recorded BEFORE any second run.
    multiplicity_declared_in_advance: >-
      TEN VR COMPARISONS. A per-comparison one-sided rate of 0.05 over ten would
      give a family-wise rate of about 1 - 0.95**10 = 0.401, FAR TOO HIGH TO
      REPORT AS A DISCOVERY THRESHOLD, and OBJ-RT082-3 exists because exactly
      this arithmetic was left to the reader at BATCH-027. THE BOTH-CELLS
      REQUIREMENT IS THE ANSWER AND IT IS ADOPTED IN ADVANCE - per-rung
      false-declaration probability at most 0.0025 and family-wise over five
      rungs at most 1 - (1 - 0.0025)**5 = 0.01243. THE INDEPENDENCE OF THE TWO
      CELLS IS AN APPROXIMATION AND IT IS DECLARED HERE RATHER THAN DISCOVERED
      LATER - both cells are generated from the SAME 20 master seeds, so a
      seed-level effect would correlate them and the true rate could exceed
      0.0025. The run must report the per-seed residual correlation so the size
      of the approximation is measurable, and the Red Team must recompute it.
    C_REPRO_1_primary_and_yardstick_free: >-
      z_2301(cell, u) = (p_hat_2301 - mean of the 20 fresh p_hat values) /
      s_between, plus the RANK of the 2301 value among the 21. THE ARCHIVED
      bits-16 u = 2 VALUE IS 0.3562102495107632. IT USES NO CALIBRATION BAND AND
      IS THEREFORE NOT CIRCULAR, and because OBJ-REAL is exhaustive there is NO
      within-instance noise to confound it. Three explanations are separable in
      advance - a property of the CONSTRUCTION gives z near zero with the whole
      fresh family low; an accident OF THE 2301 INSTANCE gives z a low outlier;
      a band too narrow gives z unremarkable AND VR large.
    C_REPRO_2_secondary_with_its_circularity_declared: >-
      The COUNT of the 20 fresh instances whose p_hat(16, u=2) lies strictly
      below the archived lower edge 0.3562408268101761. Under a no-offset null
      the per-instance probability is at most 2/201 = 0.00995, expected count
      0.199, and Binomial(20, 0.00995) gives P(X >= 2) = 0.0167 and
      P(X >= 3) = 0.00097 - A COUNT OF 3 OR MORE IS A ONE-IN-A-THOUSAND EVENT
      UNDER THE NO-OFFSET NULL, DECLARED IN ADVANCE. IT PRESUMES THE VERY BAND
      UNDER TEST, so it may not be quoted without the measured VR beside it, and
      if C-WIDE fires at that cell and rung its arithmetic is VOID and is
      reported as void. The tie caveat travels - the 1st and 2nd ascending order
      statistics at that site are tied, so 2/201 is an UPPER BOUND.
    C_MEAN_reported_and_expressly_not_read: >-
      t(cell, u) = (mean of the 20 fresh p_hat values - the archived uniform
      null mean) / (s_between / sqrt(20)) on 19 df; the bits-16 u = 2 archived
      null mean is 0.35907492202788643. IT IS COMPUTED BECAUSE THE DATA WILL
      EXIST AND REFUSING TO COMPUTE AN OBVIOUS STATISTIC FROM ARCHIVED ARRAYS SO
      THAT NOBODY CAN LOOK AT IT IS NOT RIGOUR. IT IS NOT READ, BY ANYONE,
      INCLUDING THE CLOSING COORDINATOR, because reading it would adjudicate
      H-LPF-001 through a statistic no frozen reading rule covers - exactly the
      move this program forbids. RR-IVR-1 assigns it no licence, no threshold
      and no disposition; EV-IVR-001 reports the numbers as OBSERVATIONS ONLY;
      the successor contract that would read them is ranked and is not this
      batch. CAL-LPF-1 travels with the reference and ABS-REL-LPF-1 with the
      report.

  # =====================================================================
  # 4. THE ATTAINABILITY ARGUMENT - PRE-REGISTERED, DERIVED, NOT MEASURED
  # =====================================================================
  attainability_argument:
    status: >-
      PRE-REGISTERED BEFORE ANY DATUM. Every number below is DERIVED ARITHMETIC
      from the chi-square distribution, computable by anyone from k alone, and
      IS NOT A MEASUREMENT OF ANYTHING. TASK-20260802-005 must RE-DERIVE it with
      its own code and report the numbers it obtains, never these.
    the_sampling_law: >-
      OBJ-REAL IS EXHAUSTIVE AND THEREFORE HAS NO WITHIN-INSTANCE SAMPLING NOISE
      AT ALL. So p_hat(u) at a single instance is a DETERMINISTIC number and
      THERE IS EXACTLY ONE NOISE SOURCE IN THIS DESIGN, THE INSTANCE. That is
      what makes the measurement clean: s_between over k instances estimates the
      only variance component that exists, with (k-1) s**2 / sigma**2 distributed
      as chi-square on nu = k - 1 under the working normal approximation for
      p_hat across instances.
    interval_multipliers: >-
      nu = 19. chi-square(0.95, 19) = 30.1435 and chi-square(0.05, 19) = 10.1170,
      so the two-sided 90 percent interval for sigma is
      [s * sqrt(19/30.1435), s * sqrt(19/10.1170)] = [s * 0.79392, s * 1.37041].
      The relative standard error of s at k = 20 is 1/sqrt(2*(k-1)) = 0.1622,
      i.e. plus or minus about 16 percent at one sd.
    declaration_floors: >-
      Declaring sigma_between > s_iid at one-sided 95 percent requires
      VR >= 1/0.79392 = 1.2596. Declaring sigma_between < s_iid requires
      VR <= 1/1.37041 = 0.7297. SO AT k = 20 THE DESIGN CANNOT RESOLVE A BAND
      INFLATION BELOW ABOUT 26 PERCENT, AND THAT IS DECLARED IN ADVANCE RATHER
      THAN DISCOVERED AFTERWARDS.
    the_argument_that_k_equals_20_is_enough_and_it_is_the_whole_case: >-
      THE ALTERNATIVE THAT MATTERS IS NOT A 26 PERCENT INFLATION. OBJ-RT082-1's
      route (a) is that a nonzero first-order projection puts the EFFECTIVE
      sample size nearer 512 than 130,816, which corresponds to
      VR of order sqrt(130816/512) = 15.98 - THE FACTOR OF SIXTEEN THE GOAL
      RECORD NAMES. The design's declaration floor is 1.2596. THE ALTERNATIVE
      THAT WOULD VACATE THE ENTIRE DETECTION-FLOOR TABLE SITS A FACTOR OF ABOUT
      12.7 ABOVE THE FLOOR, so k = 20 separates VR = 1 from VR = 16 with
      essentially certainty and the experiment is decisive on the question it
      was commissioned to answer.
    power_table_derived:
      method: >-
        Declare-wide at one cell iff s >= 1.2596 * s_iid, i.e. iff
        chi-square(19) >= 19 * (1.2596/VR_true)**2. Both-cells power is the
        square under the independence approximation declared above.
      VR_true_16: 'one cell about 1.000; both cells about 1.000 (threshold 0.1178)'
      VR_true_4: 'one cell about 1.000; both cells about 1.000 (threshold 1.8840)'
      VR_true_2: 'one cell 0.990; both cells 0.980 (threshold 7.5358)'
      VR_true_1_point_5: 'one cell 0.818; both cells 0.669 (threshold 13.397)'
      VR_true_1_point_26: 'one cell about 0.50 by construction; both cells about 0.25'
      VR_true_1_point_1_or_below: 'NO USEFUL POWER. DECLARED, NOT DISCOVERED.'
    what_k_equals_20_does_not_buy_stated_plainly: >-
      IT DOES NOT BUY A RESOLUTION OF THE YARDSTICK TO BETTER THAN ABOUT 26
      PERCENT. If the answer comes back inside [0.73, 1.26] at every rung, THE
      CORRECT REPORT IS THAT THE iid BAND IS NOT SHOWN TO BE WRONG BY MORE THAN
      ABOUT A QUARTER IN EITHER DIRECTION AT k = 20, which is a materially
      different and much weaker statement than "the band is correct", AND
      EV-IVR-001 MUST WRITE THE WEAKER ONE.
    the_free_riders_own_attainability: >-
      SHARPER THAN VR BY A FACTOR OF ABOUT FIVE. The dispersion of 512 per-index
      rates has relative standard error 1/sqrt(2*511) = 0.0313, so the free rider
      resolves a first-order projection at about the 5 to 7 percent level against
      VR's 26 percent floor. IT IS THE MORE SENSITIVE OF THE TWO INSTRUMENTS AND
      IT ANSWERS A NARROWER QUESTION - see W3.

  free_rider_correction:
    what_the_red_team_specified: >-
      "If the dispersion of those 512 rates exceeds sqrt(p(1-p)/511), the
      first-order projection is nonzero, the effective sample size is below
      130816, and the iid band is provably too narrow. This costs nothing beyond
      one extra array."
    the_defect_in_that_as_written_and_it_is_recorded_rather_than_quietly_fixed: >-
      THE 512 RATES ARE NOT INDEPENDENT. Each pair (i, j) enters exactly two of
      them, so the 512-by-511 incidence structure induces dependence that
      sqrt(p(1-p)/511) does not model, and a dispersion ratio read against the
      closed form ALONE would be an UNCONTROLLED statistic - the exact failure
      docs/inventor-protocol.md section 3 names, applied to the control that
      exists to enforce section 3.
    the_repair_and_it_costs_no_factorization_at_all: >-
      A PERMUTATION NULL. Permute the 130,816 smooth indicators across the
      130,816 pair slots R_PERM = 2000 times, holding the incidence structure
      and the total smooth count fixed, and recompute the dispersion each time.
      Under the null of no first-order projection the indicators are EXCHANGEABLE
      ACROSS PAIRS, so this null is EXACT conditionally on the total, and it is
      the identical measurement against a null object of the same shape. It
      requires no new factorization - only a reshuffle of an array the run
      already holds. BOTH the closed-form ratio and the permutation-null position
      must be reported and NEITHER MAY BE REPORTED ALONE.
    W3_the_reason_the_two_instruments_are_not_substitutes: >-
      THE FREE RIDER SEES FIRST-ORDER STRUCTURE ONLY. A purely second-order,
      pair-level dependence would leave the 512 per-index rates at exactly their
      exchangeable dispersion while still inflating the between-instance sd. SO
      A CLEAN FREE RIDER LICENSES NO STATEMENT ABOUT VR, and a large VR with a
      clean free rider is a COHERENT AND INFORMATIVE OUTCOME that must be
      reported as such rather than as a contradiction. They may not be traded
      off against each other in either direction.

  pre_question_the_contract_must_answer_before_freezing:
    id: PRE-Q-1
    question: 'Does generate_instance(seed, bits) vary the prime p, or only the curve coefficients at a p fixed by bits?'
    why_it_must_be_answered_before_the_datum: >-
      BECAUSE IT CHANGES WHAT THE BETWEEN-INSTANCE SD IS THE STANDARD DEVIATION
      OF. The frozen factor base is "the first 512 x-coordinates in F_p in
      increasing integer order", which depends ONLY on p. If p is fixed by bits,
      all 20 instances share ONE factor base and the variation is across CURVES
      at fixed p and fixed base - in which case RT049-B6 BITES HARDER, the
      small-x window is literally identical across all 20, and the free rider is
      a ONE-BASE measurement. If p varies, the variation is across (p, curve)
      pairs and 20 different windows are sampled.
    ruling: >-
      NEITHER ANSWER INVALIDATES THE CONTROL; ONLY AN UNSTATED ANSWER WOULD.
      TASK-20260802-003 answers it FROM SOURCE and quotes the lines;
      TASK-20260802-005 re-determines it independently; the run archives the 20
      primes and 20 factor_base_sha256 values per cell so the answer is checkable
      from the archive; and EV-IVR-001 scopes its free-rider sentence to whichever
      answer is observed.

