      IF THE FREE RIDER CANNOT BE COMPUTED WITHOUT MODIFYING THE DRIVER, THE
      CONTRACT AUTHOR MUST SAY SO AND STOP - that is a finding, and it is never
      a licence to edit. D5's standing refusal to hoist anything into the driver
