  # -------------------------------------------------------------------
  # RATIONALE
  # -------------------------------------------------------------------
  rationale:
    - >-
      IMP-DESIGN-1 IS CLEARED BY THIS RECORD, on its own terms. Its clears_when
      required a verdict with provenance-tagged sources recorded in a Coordinator
      decision. TASK-20260915-532164 returned one: every conclusion in
      sources.yaml carries `provenance` and `verified_by`, the retrieved full
      texts are quoted verbatim, one recalled pointer (Commeine-Semaev) was
      converted to `kb` at KN-LIT-2459, and three pointers (Joux SAC 2013, GKZ
      Trans. AMS 2018, Diem 2011) are reported as STILL `recalled` and therefore
      still barred from discharging supporting_results under AGENTS.md rule 9.
      Clearing IMP-DESIGN-1 removes a precondition to approval; it does not
      approve anything, and the remaining approval_preconditions are untouched.
    - >-
      APPROVAL IS WITHHELD ON PROTOCOL READINESS, WHICH IS THE COORDINATOR'S OWN
      RESPONSIBILITY AND NOT A REQUEST FOR USER CONFIRMATION. The standing
      authorization of 2026-09-06 covers approval of this contract as soon as the
      protocol is complete, and no user confirmation is sought. What is
      outstanding is DEFECT-C-MEMO-OFF (a frozen hard-stop control that fails on a
      correct instrument, derived above from the record text alone), plus the
      screen's OBJ-4 (C-NULL, the DECIDING control, is unmatched on censoring at
      exactly the level where P4 is evaluated, and P4/F3 leave `real < null`
      unassigned, so the prediction set is not fully pre-registered), OBJ-5 (the
      method ceiling on the instrument), OBJ-7 (memory charged as a footnote when
      the whole claim is a time-for-memory trade) and OBJ-8 (censoring direction
      not pre-registered). An incomplete protocol is completed or holds with a
      named impediment; it never waits for a user.
    - >-
      THE LINE'S STATED VALUE PROPOSITION IS GONE, AND THAT IS A RANKING FACT, NOT
      A TRUTH FACT. Q2b removes R3's exponent content for every published family
      checked, and OBJ-2 shows the fallback target does not exist: this goal's own
      record says the descent column is unmeasured and unclaimed (ICPERF-Q1), and
      the one descent cost model in this ledger, IDEA-20260727-002, charges descent
      BY YIELD (T_attempt / P_dec) -- the correct total-expected-cost form, with no
      B^d term for memoisation to attack (YIELD-Q1). So "every internal model
      charging descent by tree size over-charges the attacker" points at an object
      that is not in this ledger. None of this makes any prediction of
      H-ICPERF-5f038b false. It removes the reason to RANK the measurement, which
      is a different and lesser claim, and the hypothesis keeps its `specified`
      status accordingly.
    - >-
      OBJ-5 IS WEIGHED HEAVILY AND IS THE REASON RC-1 IS ADOPTED IN FULL. The v2
      fix (CORR-20260915-3965c1) correctly forces deg(a*t) >= n so that the
      reduction is not a no-op -- but non-emptiness of the multiplier interval is
      not feasibility. Pinning deg w ~ n-1 at every level while the acceptance
      bound max(b, ceil(alpha*d_t)) shrinks makes the smoothness parameter
      u = deg(w)/L grow with depth, and the screen's estimate puts the K_try
      feasibility floor two to six orders of magnitude before T_j reaches M_j in
      ALL NINE cells, with the most likely outcome F4 -- descent failures dominate,
      which under AGENTS.md rule 5 is an infrastructure/parameter outcome and NEVER
      evidence about descent. The named root cause is exactly right and is the part
      the amendment must fix: the feasibility rule is declared PER CELL while
      acceptance probability is a function of NODE DEGREE, so every cell passes at
      its root and dies four to six levels down. RESTATED AS A LIMIT ON ITSELF:
      this is a back-of-envelope estimate using Dickman rho as a proxy for F_2[x]
      smoothness density at q=2, it is not a Stage A computation and not a run, and
      Stage A -- not that table -- is the instrument that settles it.
    - >-
      NO LANE IS CLOSED AND NO STATUS MOVES, and that restraint is required rather
      than cautious. The closure gate in agents/coordinator.md requires any
      lane-closing decision to cite evidence carrying a complete `obstruction`
      block -- a quantity, its measured value with units and error bars, the runs
      it is read from, and the scope claimed -- with a `resource_check`. There are
      no runs, no measurements and no obstruction block here; there is a
      literature reading and a derivation. Rejecting a direction on that basis
      would be exactly the prose-obstruction closure the gate exists to refuse,
      and premature closure is a failure mode symmetric with overclaiming
      (docs/inventor-protocol.md).
    - >-
      THE PRIOR INTERNAL WORK THE SCREEN FLAGGED (OBJ-9) WAS READ AND IS ACCOUNTED
      FOR HERE. EV-DTREE-2e8f6a (H-DTREE-001 / EXP-DTREE-001 / IDEA-20260726-005)
      is this program's own multi-level descent tree for prime-field ECDLP index
      calculus, verdict `inconclusive`, `claim_tier: toy`, 16/20/24-bit, one seed
      per size. Three things follow and none of them was previously recorded on
      this lane. (a) It is a near neighbour on the OBJECT but not on the
      OBSERVABLE: it measures depth-2 cost C_2 against single-level C_1 and never
      measures any sharing or distinct-node ratio, so it neither dominates nor
      supports IDEA-20260915-5c407a and its `inconclusive` verdict is not
      transferable to it. (b) Its unresolved confounds land squarely on arm 2 of
      IDEA-20260915-5c407a: CONF-1 (harness/semaev.py build_factor_base samples the
      WHOLE curve rather than the target's order-n subgroup, with cofactors 2280 /
      196 / 31512 at the three sizes) and CONF-2 (the s4_expr variable-collision
      bug, still live in the shared harness and recorded as KN-OPEN-5b3a08). Any
      future ECDLP-arm contract must cite EV-DTREE-2e8f6a and must state which side
      of KN-OPEN-5b3a08 it stands on. (c) The screen is right that the idea and the
      hypothesis cite none of it; those records are immutable and are NOT edited
      here -- this decision supplies the citation, which is what supersession by
      reference means.
    - >-
      THE DISPATCH VIOLATION IS ALREADY RECORDED AND IS NOT RE-LITIGATED, NOR
      PAPERED OVER. CORR-20260915-6708e4 discloses that TASK-20260915-532164 was
      dispatched with archived_by null against its own dispatch_preconditions[0],
      and AGENTS.md now carries the rule it produced ("Dispatch preconditions bind
      the DISPATCHER, not the agent"), including its closing clause: never edit a
      card to make a past dispatch look compliant. TASK-20260915-532164 is NOT
      edited by this decision and its `written_not_dispatched` status stands as
      historically accurate. The screen's findings are unaffected by the ordering
      defect -- the agent stayed in its declared write scope, created nothing under
      experiments/, and honoured maximum_runs: 0 -- and a reader must not infer
      from that that the ordering did not matter.

  # -------------------------------------------------------------------
  # WHAT THE AMENDMENT MUST CONTAIN
  # -------------------------------------------------------------------
  required_amendment_content:
    binding_note: >-
      These are the conditions under which EXP-ICPERF-025a52 could be approved.
      They are adopted from TASK-20260915-532164's RC-1..RC-7 plus
      DEFECT-C-MEMO-OFF, and they are enumerated HERE, before any outcome is
      observed, so that a later approval cannot be read as a criterion relaxed
      after the fact. The amendment is ADDITIVE (version 2 -> 3, v2's
      status_history entry unchanged); nothing historical is rewritten.
    items:
      - id: AM-1
        from: RC-1 / OBJ-5
        requires: >-
          Stage A must newly report, PER CELL, the deepest level whose predicted
          PER-NODE-DEGREE acceptance probability clears the feasibility floor,
          set beside j*. The feasibility rule changes from per-cell to
          per-(cell, level). Stage B is approvable only for cells where
          j* <= that level; if no cell qualifies, the grid is superseded rather
          than run and that is recorded as a Stage A RESULT, not a failure.
      - id: AM-2
        from: RC-2 / DEFECT-C-MEMO-OFF
        requires: >-
          C-MEMO-OFF is resolved IN WRITING to one of the two readings, before
          implementation. If it is retained as an instrument check it must be
          restated as what it can actually test (that the memo flag changes
          SOLVE COUNT and not the node set) and unwired from F0; if it is
          retained as written it must be justified against the derivation above.
          A control that fails on a correct instrument may not remain wired to a
          hard stop.
      - id: AM-3
        from: RC-3 / OBJ-4
        requires: >-
          C-NULL is matched on CENSORING: apply the measured per-level
          descent-failure rate to the null, or report censored and uncensored
          nulls side by side. The null's "fitted comparator" property (it inherits
          the measured branching distribution and can therefore only test RESIDUAL
          concentration) is stated in the contract as a scope limit, not as a
          defect.
      - id: AM-4
        from: RC-4 / OBJ-6
        requires: >-
          Pre-register the parameter that should DESTROY the signal. The
          contract's own pigeonhole mechanism predicts rho_j at fixed level j must
          FALL as n rises and as alpha rises, because M_j grows; the grid already
          varies both, so this costs nothing and is the cheapest discriminator
          between measuring pigeonhole and measuring the relation-finder. A rho_j
          flat in n at fixed j is the artefact tell (docs/inventor-protocol.md,
          controls before belief).
      - id: AM-5
        from: RC-5 / OBJ-4
        requires: >-
          Assign a verdict to `real < null` in P4/F3. HEUR-1's
          falsification_condition already says departure "in EITHER direction"
          falsifies while P4 scores only two of three outcomes; a prediction set
          with an unassigned outcome is not fully pre-registered.
      - id: AM-6
        from: RC-6 / OBJ-7
        requires: >-
          Report sharing retained as a function of a BOUNDED memo table size w,
          not only w = 0 and w = infinity, and convert sum_j U_j to bytes against
          the declared maximum_memory_gb. The claim is a time-for-memory trade and
          no row of the deliverable currently carries both sides.
      - id: AM-7
        from: RC-7 / OBJ-8
        requires: >-
          Pre-register the DIRECTION of the bias that K_try censoring induces on
          rho_j. Failures concentrate at the deepest levels -- exactly where the
          signal is expected -- and a failed node removes its whole subtree, i.e.
          removes T and U in a ratio nobody has predicted.
      - id: AM-8
        from: this decision (OBJ-2, Q2b)
        requires: >-
          The contract and the hypothesis state, in their own
          interpretation_limits, that regime R3 carries NO EXPONENT CONTENT for
          the published descent families screened in TASK-20260915-532164, with
          the uncovered families named; and that the strongest available claim is
          a scoped toy measurement whose sota_delta at the exponent is 0. The
          record's value proposition is restated honestly rather than left as
          written.
      - id: AM-9
        from: this decision (OBJ-9)
        requires: >-
          Cite EV-DTREE-2e8f6a / EV-DTREE-b47c19 / H-DTREE-001 / EXP-DTREE-001 /
          IDEA-20260726-005 as the internal near neighbour, and state where any
          future ECDLP arm stands relative to the open harness defect
          KN-OPEN-5b3a08.
      - id: AM-10
        from: this decision (cost-model challenge)
        requires: >-
          Address the screen's cost-model objection: T_j and U_j are CALL COUNTS
          and are never multiplied by the per-node inverse success probability,
          which varies by orders of magnitude ACROSS levels. Counting calls per
          level without weighting them by per-level cost is the same error the
          idea attributes to the literature, one level up, and the amendment must
          either weight them or declare explicitly that the deliverable is
          unweighted counts and therefore not a cost statement.
    what_the_amendment_may_not_do: >-
      It may not rewrite the v1 or v2 status_history entries, may not edit
      IDEA-20260915-5c407a or TASK-20260915-532164, and may not weaken any
      existing pre-registered prediction. The quantifier order -- j* fixed in
      Stage A before any Stage B quantity exists, with the Stage A hash bound
      into the Stage B manifest as an invalidation rule -- is the
      best-constructed part of the contract and MUST be preserved intact through
      any amendment.

