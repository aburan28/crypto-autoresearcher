      - rank: 1
        act: >-
          Consume the TASK-20260915-532164 verdict in a committed Coordinator
          decision: clear IMP-DESIGN-1, withhold approval, record the domination
          finding with its scope bound, and return the contract for amendment.
          (THE ACT TAKEN.)
        why: >-
          The only act on this lane with a DECAY COST. IMP-DESIGN-1's clears_when
          is "TASK-20260915-532164 returns a verdict with provenance-tagged
          sources, and a Coordinator decision records it"; the first half has
          happened and the second has not, so the screen currently sits as an
