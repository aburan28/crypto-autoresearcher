  # -------------------------------------------------------------------
  # WHAT THE SCREEN ESTABLISHED, AND WITH WHAT REACH
  # -------------------------------------------------------------------
  screen_disposition:
    verdict_recorded: partially_dominated
    verdict_is_not_evidence: >-
      STATED FIRST BECAUSE IT IS THE EASIEST THING TO MISREAD. A
      `partially_dominated` screen verdict is a statement about the LITERATURE
      and about this program's own records. It is not an experimental result, it
      is not evidence for or against H-ICPERF-5f038b, and it may never be cited
      as such. No hypothesis status moves on it. Q1's "not found" is an ABSENCE
      OF A SEARCH RESULT and is not novelty (AGENTS.md retrieval policy); it is
      recorded here as an absence and nothing is built on it.
    q2a_premise_upheld: >-
      The idea's framing premise is CORRECT and is not dominated on that point.
      The canonical quasi-polynomial analysis is charged on the descent TREE as
      arity^depth (BGJT-Q1, arXiv:1306.4244, full text `retrieved` and quoted
      verbatim in sources.yaml), and the vocabulary is standard (GKZ-Q1,
      arXiv:1402.3668, `retrieved`). The collapse that
      EXP-ICPERF-025a52.approval_preconditions[0] enumerated -- "the published
      descent cost analyses already stated on the DAG" -- DID NOT FIRE. Recorded
      explicitly so that no later reader believes the enumerated trigger was met.
    q2b_exponent_content: >-
      A THIRD ROUTE, NOT ENUMERATED BY THE IDEA'S OWN `dominated_by`, closes
      regime R3's exponent content for the families checked. (1) BGJT section 6.2
      itself publishes the pigeonhole crossover that mechanism M1 proposes as new
      -- "the breadth eventually exceeds the number of polynomials below some
      degree bound" -- prescribes replacing that saturated region by
      precomputation, and states the replacement is complexity-neutral ("without
      changing the complexity") (BGJT-Q2, `retrieved`). So the prescribed
      algorithm already pays at most the DAG cost exactly where sharing is forced,
      and closing the tree bound's looseness there is published as free.
      (2) For NFS/FFS special-q descent the descent step is asymptotically
      subdominant: L_p[1/3,1.21] under a booting step of L_p[1/3,1.23] and an
      overall L_Q[1/3,1.923] (GUI-Q1/GUI-Q2, arXiv:1505.07553, `retrieved`;
      corroborated by KN-LIT-2459 at `kb`). Dividing a subdominant phase's node
      count by any factor moves no exponent. (3) In the largest published
      binary-field record the costed classical descent is a PATH -- one polynomial
      per degree down to degree 35, so rho_j is identically 1 there -- while every
      degree <= 8, where sharing is forced, is charged cost 0 (F2-Q2, F2-Q3,
      arXiv:2008.02717, `retrieved`).
    q2b_scope_bound: >-
      THE BOUND IS PART OF THE FINDING. This holds for the published descent
      families the screen ACTUALLY READ: BGJT quasi-polynomial, NFS/FFS special-q
      via Guillevic, and the 30750-bit binary record. It does NOT hold, and is not
      asserted, for: Joux, SAC 2013 (L(1/4)) -- still `recalled`, unread;
      Granger-Kleinjung-Zumbraegel, Trans. AMS 370 (2018) -- unread; Diem,
      Compositio Math. 147 (2011) -- still `recalled`, unread, and this is the
      ELLIPTIC-CURVE recursion, i.e. the one family this program's own target
      actually concerns; Kleinjung-Wesolowski J. AMS 2022 -- abstract only; the
      FFS GF(2^809) record -- corpus note only. The ECDLP/Diem arm (arm 2 of
      IDEA-20260915-5c407a) was NOT SCREENED AT ALL. No statement in this decision
      reaches those families, and none may be read as reaching them.
    q3_memoisation: >-
      Descent memoisation against a canonical-form-keyed known-log table is
      already implemented in CADO-NFS (CADO-Q1/Q2/Q3, `retrieved`), so mechanism
      M3's engineering claim is settled practice rather than a proposal. The
      SAVING is unquantified in every source the screen could reach, so the
      narrow quantitative measurement is not redundant -- only much less valuable
      than the idea presents it. PROVENANCE LIMITATION CARRIED FORWARD, NOT
      SMOOTHED: CADO-NFS was read from the GitHub mirror sethtroisi/cado-nfs and
      the canonical gitlab.inria.fr revision is NOT PINNED. Q3 may not be used to
      supersede anything until it is re-confirmed against a pinned canonical
      commit.
    what_the_screen_did_not_establish: >-
      That no descent anywhere admits an exponent-relevant sharing effect; that
      rho_j has never been measured; that the toy measurement is worthless; or
      that the contract is unimplementable. OBJ-5 is an order-of-magnitude
      red-team estimate (SRC-SCREEN-RT-CEILING), explicitly not a Stage A
      computation and not a run, and one cell (n=61, b=5, alpha=0.8) sits too
      close to the boundary for it to call. None of this is an impossibility
      result and none may be reported as one.

  # -------------------------------------------------------------------
  # THE COORDINATOR'S OWN GROUND FOR WITHHOLDING APPROVAL
  # -------------------------------------------------------------------
  independent_contract_defect:
    id: DEFECT-C-MEMO-OFF
    basis: derivation_note
    basis_declaration: >-
      DECLARED, NOT DEFAULTED. This is a derivation from the frozen text of
      H-ICPERF-5f038b and EXP-ICPERF-025a52 alone -- no measurement, no
      literature, no retrieval. It was raised as the screen's OBJ-3 and is
      re-derived here independently by the Coordinator, because it is the one
      ground for withholding approval that does not depend on any source anyone
      read.
    derivation: >-
      The contract freezes three facts simultaneously: (i) U_j is the count of
      DISTINCT level-j nodes by canonical form; (ii) T_j is the count of level-j
      OCCURRENCES by path counting; (iii) the relation chosen at a node is a
      DETERMINISTIC function of that node's canonical bytes and a global seed
      (descent_rule.determinism). Under (iii) the descent DAG -- its node set and
      its edge multiset -- is fixed before any cache exists. Therefore both U_j
      (a property of the node SET) and T_j (a property of the path count) are
      invariant under the memo flag; the flag changes only how many times a node
      is RE-SOLVED. Hence rho_j = T_j/U_j is the same with the memo table on and
      off. Control C-MEMO-OFF demands rho_j == 1.0 exactly with the memo off, and
      wires its failure to F0, which declares the whole instrument invalid.
      Consequence: on a CORRECT instrument in any cell where the experiment finds
      its signal (rho_j > 1), C-MEMO-OFF fails and F0 fires. The only reading
      under which the control passes is one where disabling the memo also
      disables de-duplication so that the instrument reports U_j := T_j -- under
      which the control is true by construction and tests only that a flag is
      wired to two counters.
    why_it_is_disqualifying_on_its_own: >-
      A frozen control that fails on a correct instrument, wired to a hard stop,
      converts the most likely successful outcome into a declared invalid run.
      That is a protocol-readiness defect, which agents/coordinator.md makes the
      Coordinator's own responsibility and which the standing user authorization
      of 2026-09-06 explicitly does not cure ("User authorization is already
      satisfied; protocol readiness remains a Coordinator responsibility"). It is
      also the cheapest defect in the contract to fix and the most expensive to
      discover after Stage B.
    asserts_nothing_about: >-
      the science. A broken control says nothing about whether sharing exists in
      this or any descent.

