coordinator_decision:
  id: DEC-20260806-9d8aab
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: refine
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-75c05b
  context: BATCH-6fddee ran Stage A of EXP-HQC-982268 under the Stage-A-only authorization of DEC-20260806-5289fb,
    then had it reviewed by an independent validator (TASK-20260806-43a44f, PASS_WITH_DEFECTS) and red
    team (TASK-20260806-dd901b). Stage A is instrument validation and measures nothing about HQC.
  rationale:
  - THE GATE PAID FOR ITSELF. Stage A cost 1,411 core-seconds and established that the contract's two
    most load-bearing controls are not fit for purpose. Had the batch gone straight to a measurement arm
    it would have spent up to 55,785 core-seconds producing a number whose null distribution is unknown
    and whose primary control cannot fail. Cheapest-decisive-first is vindicated here on the numbers,
    not as a slogan.
  - THE ONE APPARENT SIGNAL DISSOLVED UNDER ITS OWN NULL. The escalated INV-NULL firing at PS-R1/NULL-M/k=11
    (raw |z|=3.15, T_stab-admissible by 6.8 percent) corrects to |z|=2.05 once the decision rule is sized
    correctly. The red team measured that rule's realized size at 7.7-21 percent against a nominal 0.27
    percent. This is docs/inventor-protocol.md section 3 working exactly as intended, and the executor's
    own diagnosis ("is T_stab too loose?") was wrong in a way with the opposite fix.
  - TWO CONTROLS CANNOT FAIL, AND ONE OF THEM IS THE PRIMARY. CTRL-BS re-indexes the (T) arm's own indicator
    matrix with np.roll, a permutation that preserves per-block marginals and the total exactly; it fired
    0 of 108 cells and its q-hat is literally the (T) arm's own. D3 sits 39-70 (M)-sigma above the (M)
    mean, so it cannot detect the (M)-drift it is advertised against. KN-TECH-1a5b7e catalogues this failure
    mode and this program has shipped it before.
  - THE FALSIFICATION CRITERION IS THE MIS-SIZED STATISTIC. INV-NULL at k=m is what the contract would
    falsify on, and its size has never been measured. A contract cannot be executed for a verdict when
    its verdict rule is uncalibrated.
  - THE ALLOCATIONS DO NOT REACH k=m AT THE MEASURED q-HAT. PS-R1 needs 1.452e8 trials against 1e8 allocated
    and PS-R5 needs 2.554e7 against 2e7. Success criterion (iv) is unsatisfiable as written. PS-R3 retains
    a 20x margin, which independently confirms the successor pick recorded in DEC-20260806-5289fb -- that
    pick was made on cost alone and is now correct on measurement.
  - WHAT IS SOUND IS SOUND, AND IS RECORDED AS SUCH. The estimator arithmetic is correct to 1.2e-14 against
    the exact oracle law (a check the red team actually ran, replacing one the package had only claimed);
    the sampler passes D2, D5, the p* match, the Table 10 tails and a 7200/7200 decoder cross-check; D1
    has a real positive control. The repair is to the decision rules and the controls, not to the sampler.
  evidence_refs:
  - EV-HQC-75c05b
  - RUN-HQC-982268-STAGEA-a
  - coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/reviews/TASK-20260806-43a44f/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/reviews/TASK-20260806-dd901b/red_team_report.md
  limitations:
  - This decision makes NO statement about HQC, its decoding-failure rate, assumption A17 or A5, or any
    standardized parameter set. Claim tier stays toy.
  - 'H-HQC-18d1b4 status is UNCHANGED at proposed. No hypothesis moved and none could: Stage A sampled
    no measurement arm.'
  - The defects are properties of this contract's controls as implemented at these reduced parameter sets,
    not claims about the underlying mathematics.
  - The size correction (|z| 3.15 -> 2.05) rests on a 300-draw red-team estimate that has not been replicated,
    and only one of 20 advertised SE widths was checked.
  - 'PROCESS DEVIATION, RECORDED NOT EXCUSED: the snapshot archive was committed after the reviewers began
    reading rather than before. Hashes pin the bytes and the validator recomputed all four and matched,
    so the reviewers read the committed artifacts -- but an argued freeze is weaker than an enforced one,
    and the next batch restores the ordering.'
  - None of the four asymptotic-complexity promotion gates is engaged; this batch advances no asymptotic
    claim and claims none.
  knowledge_promotion:
    promoted: []
    not_warranted: Strength is preliminary and the subject is one contract's apparatus, not a durable
      claim about HQC or about cryptanalysis. The generalizable lesson -- that a permutation-based re-indexing
      control preserves the marginals it is meant to test against, and that a jackknife Wald rule on rare-event
      counts is badly mis-sized at high k -- is a real candidate for KN-TECH once it is confirmed on a
      second instrument rather than one run. Recorded here as the reason, not deferred silently.
  next_actions:
  - 'BATCH-7: REPAIR THE INSTRUMENT, DO NOT RUN A MEASUREMENT ARM. Four scoped repairs, all cheap: (a)
    recalibrate INV-NULL by measuring its realized size and replacing the jackknife Wald rule with a calibrated
    one -- it is the falsification criterion and must be sized before it is used; (b) demote CTRL-BS from
    PRIMARY and add a control that can fail upstream of the indicator matrix; (c) restate D3 as the hard
    invariant it is, not a (T)-vs-(M) discriminator; (d) re-derive the Stage-B allocations at the measured
    q-hat and either fund PS-R1/PS-R5 or restate success criterion (iv) around PS-R3.'
  - Promote the red team's CTRL-ORACLE cross-check (oracle law_of_S through stage_a.log2_A_from_hist,
    max diff 1.2e-14) into the contract as the real oracle gate, replacing the current tautological one.
  - 'Only after (a)-(d): rank B3/PS-R3, the one order-matched set retaining margin at k=m.'
  - Report the remaining campaign budget honestly at that point. If no interpretable measurement arm fits,
    PAUSE on the goal's declared pause condition with the shortfall named -- a budget outcome, never evidence
    about HQC (AGENTS.md rule 5).
