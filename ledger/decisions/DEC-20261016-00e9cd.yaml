# DEC-20261016-00e9cd — approve the combined-route screen EXP-ENDO-7494e7.
# The standing authorization of 2026-09-06 is the user-approval basis.
coordinator_decision:
  id: DEC-20261016-00e9cd
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  question_ids:
    - RQ-ENDO-476761
  goal_id: GOAL-ENDO-001
  goal_binding: >-
    RQ-ENDO-476761 was bound to GOAL-ENDO-001 by DEC-20261016-5cd7e2, and
    this decision keeps that binding. The bound functional is known-scalar
    multiplication cost, not an attack cost. No result of EXP-ENDO-7494e7
    changes an ECDLP claim of that goal.
  archived_by: TASK-20261016-d4363d
  mode: design_experiment_approved
  standing_authorization: >-
    The standing user authorization in AGENTS.md (user instruction,
    2026-09-06: "all is approved. ideas/experiments should be always
    approved") is the user-approval basis. The Coordinator checked the
    controls, the metrics, the stopping and invalidation rules, the artifact
    paths, the budget, and that the success and falsification criteria are
    distinct.
  decision: approve
  decision_label: >-
    Approve H-ENDO-f58749 (specified -> approved) and the frozen runnable
    contract EXP-ENDO-7494e7 for one modelled screen, RUN-ENDO-795989.
  target_ids:
    - RQ-ENDO-476761
    - IDEA-20261016-15a6fc
    - H-ENDO-f58749
    - EXP-ENDO-7494e7
    - TASK-20261016-c886b3
    - TASK-20261016-d4363d
    - RUN-ENDO-795989
  context: >-
    RUN-ENDO-d7cb69 (EXP-ENDO-25ad84) recorded 7 population curves with a
    positive modelled model-change gain, persistent +8.26 % to +15.49 %.
    Six of them have a small D_K, and the committed endosweep table
    (research/endosweep_curves_20261006/curves.md) prices their own chain
    2-GLV on E at ratio 1.4313 to 1.5252, which dominates the model change.
    The open question is whether the two compose on a neighbour that has an
    a = -3 model and still carries the chain element. The launcher
    (harness/endosweep/isoglv.py, run.py, check.py) is implemented and has
    unit tests for both controls. A development smoke run on mnt/mnt3/1, the
    ascent control and mnt/mnt5/1, at reduced build-limit and candidate
    counts, is disclosed in the specification. No criterion was set from it.
    RUN-ENDO-d7cb69 has no evidence review yet.
  rationale:
    - The contract reduces one decision-changing uncertainty. Either a verified model change composes with the GLV and beats the GLV on E one-shot on some curve, which makes that curve a bench candidate, or the model-change gains of RUN-ENDO-d7cb69 are dominated by the GLV within the bound and the arm closes there.
    - There is one positive control (ascent to the j = 0 crater, with the unit GLV priced and the route verified) and one negative control (mnt/mnt5/1, already a = -3-isomorphic, so it must have no candidate). Every combined route is verified on points. Each failure mode maps to an indeterminate arm or an unresolved curve, not to evidence.
    - Chain build failures are declared as observations of the edge type, never as statements about End without a conductor certificate. This keeps a null from overreaching.
    - The success and falsification criteria are distinct and were fixed before the run, together with a recorded Coordinator prior.
    - This is a constant-factor, known-scalar question, not an exponent-targeting one. It is admitted because it is cheap (one run, 3 h watchdog, 2 GB) and settles whether the only positive result of EXP-ENDO-25ad84 has residual value over the GLV already available. It does not displace exponent-targeting work.
    - The approval covers the driver, the checker, the trial plan and the executor card.
  evidence_refs:
    - ledger/proposals/IDEA-20261016-15a6fc.yaml
    - ledger/questions/RQ-ENDO-476761.yaml
    - ledger/hypotheses/H-ENDO-5a33ae.yaml
    - experiments/EXP-ENDO-25ad84/specification.yaml
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
    - experiments/EXP-ENDO-25ad84/reports/run-20261016T1709Z/report.typ
    - research/endosweep_curves_20261006/curves.md
    - harness/endosweep/isoglv.py
    - tests/test_isoglv.py
    - experiments/EXP-ENDO-7494e7/implementation/run.py
    - experiments/EXP-ENDO-7494e7/implementation/check.py
  runnable_condition: >-
    Approval requires tools/newest_experiments.py --experiment
    EXP-ENDO-7494e7 to report execution_state ready, with trial-plan.json
    present and the trial_plan_sha256 of TASK-20261016-c886b3 filled in. The
    source rows experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/raw-result.json
    must be committed with sha256
    0576225d496168485a8c30d5d460edab1ab969e7cd3a4d7850e43406a65282da. The
    dispatching session confirms both before committing this record.
  limitations:
    - All figures are modelled counts in curvesweep's M_eq = M + S model. The claim tier is modelled, and no timing or ECDLP claim is possible from this run.
    - The scope is the nine named curves, ell <= 13, depth 2, at most 64 nodes, at most 12 cheaper-class candidates, build_limit 3 and build_seconds 900. A null result there does not close larger degrees, depths or caps.
    - The model_change arm and the curve selection are taken from RUN-ENDO-d7cb69, which has had no evidence review. A defect found there propagates here.
    - other/BADA55-VPR-224 has |D_K| > 2e6 and gets no GLV arm. Arm G is therefore decided on at most six curves.
    - Heuristics H1-H3 of the idea are not validated here.
    - This decision does not launch the executor and does not edit the idea, the question or H-ENDO-5a33ae.
  next_actions:
    - The executor runs experiments/EXP-ENDO-7494e7/trial-plan.json once under TASK-20261016-c886b3 and records observations only.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of a protocol is not a result. No evidence record is created
      here.
