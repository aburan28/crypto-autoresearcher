coordinator_decision:
  id: DEC-20260806-00deff
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: supersede
  target_ids:
  - GOAL-MLKEM-005
  - DEC-20260805-4823db
  - EV-MLKEM-94f036
  - DEC-20260806-8c33bf
  context: 'DEC-20260806-8c33bf identified two blocking items that no executor can resolve, because both
    live in a committed decision rather than in a task card: the seven frozen t values of the graded sensitivity
    family, and the P1/P2 adjudication predicate. This decision SUPERSEDES DEC-20260805-4823db ON THOSE
    TWO POINTS ONLY. Records are immutable; DEC-20260805-4823db is not edited and everything else it says
    remains in force.'
  rationale:
  - 'SUPERSESSION POINT 1 -- THE t GRID. The graded family Q_t = QR(sqrt(1-t) E_S + sqrt(t) G) has expected
    coordinate overlap A(t) = (1 + (beta-1)t) / (1 + (d-1)t), whose range-midpoint sits at t = 1/(d+1):
    0.009901 at d = 100 and 0.007092 at d = 140. The frozen grid''s first interior point was 0.05, five
    to seven times past it, so 88.5 percent of the alignment excess was already gone at the first interior
    sample and G3 was left demanding a strict ordering among six exchangeable noise arms -- probability
    1/720. The grid, not the instrument, produced the INVALID verdict. This is derivable from the family''s
    own algebra and was derivable before BATCH-436ddd ran; the executor said so and implemented the frozen
    grid anyway, which was correct.'
  - SUPERSESSION POINT 2 -- THE ADJUDICATION PREDICATE. P1 and P2 return IDENTICAL verdicts on the null
    arm and the real arm in all four cells (haar 0.998570 / 0.999141 / 1.001023 / 0.999897; real 0.998295
    / 1.000538 / 0.999538 / 1.000998; between-fraction 0.0000000). A predicate that cannot separate the
    null from the real arm cannot adjudicate anything, so C3 could not have been discharged even by a
    VALID demonstration on a perfect grid. This is the same objection C3 itself raises against reporting
    only E[R], now turned on the goal's own instrument.
  - WHY THE PREDICATE IS SPECIFIED BY ACCEPTANCE TEST RATHER THAN BY CONSTRUCTION. Designing a discriminating
    statistic is research, not adjudication, and a Coordinator inventing one at the desk would be the
    same error this campaign has now made three times -- shipping a control chosen for plausibility rather
    than demonstrated capability. So this decision fixes the ACCEPTANCE REQUIREMENT and leaves the construction
    to a producer under review.
  - THE DETECTION FLOOR IS NOW A REQUIRED FIELD, NOT A COURTESY. EV-MLKEM-94f036 records that this lane
    reported an upper bound as an absence, and that the exact residuals surviving reduction are 0.1863
    / 0.4386 / 0.1400 against an instrument floor of V ~ 2.2. Any future "absent" verdict in this goal
    states its floor or it is not a verdict.
  evidence_refs:
  - EV-MLKEM-94f036
  - DEC-20260806-8c33bf
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-436ddd/reviews/TASK-20260806-06439b/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-436ddd/reviews/TASK-20260806-fc0966/red_team_report.md
  supersedes:
    record: DEC-20260805-4823db
    scope: two points only, enumerated below
    not_superseded: Everything else in DEC-20260805-4823db remains in force, including the four cells,
      the frozen P1/P2 sampling parameters, the Haar null, the null-arm-first discipline, the three added
      arms, and the B2-B / B2-C / B2-D carriage.
  amendments:
  - id: AM-1
    supersedes: the seven frozen t values
    new_grid:
    - 0.0
    - 0.0025
    - 0.005
    - 0.0075
    - 0.01
    - 0.015
    - 0.02
    - 0.03
    - 0.05
    - 0.1
    - 0.25
    - 0.5
    - 1.0
    basis: Brackets t = 1/(d+1) at both d (0.009901 and 0.007092) with at least four points below the
      midpoint and at least four above it, while retaining 0.0, 0.05, 0.1, 0.25, 0.5 and 1.0 from the
      superseded grid so the two runs remain comparable at their shared points.
    G3_replacement: 'G3 becomes TIE-TOLERANT: a step counts as a violation only when it exceeds 1 SE of
      the step difference. Adjacency no longer excludes PARTIAL by itself; PARTIAL is declared when every
      violation is within 1 SE, and INVALID when any violation exceeds it. The superseded reading forced
      INVALID on twelve violations whose largest was 0.765 SE.'
  - id: AM-2
    supersedes: the P1/P2 adjudication as the criterion-discharging predicate
    requirement: A replacement predicate is ADMISSIBLE ONLY IF it is demonstrated, on the ALREADY-COMMITTED
      BATCH-436ddd and BATCH-a51f91 data, to return DIFFERENT verdicts on the Haar null arm and the real
      arm in at least one cell, with the separation stated in SE of the difference. A predicate that cannot
      be shown to separate on data already in hand may not be used to adjudicate new data.
    floor_clause: The predicate declares its DETECTION FLOOR in the same units as its statistic, and every
      negative verdict it emits is reported as an upper bound at that floor.
    prohibition: The Coordinator does NOT specify the statistic. Any construction is a producer deliverable
      and is subject to independent review, and a predicate accepted on plausibility rather than demonstrated
      separation is refused.
  limitations:
  - This decision changes an instrument specification. It creates NO evidence, moves NO hypothesis status,
    and asserts nothing about ML-KEM security or any FIPS 203 parameter set. Claim tier TOY.
  - AM-1 is derived from the family's own closed form and from measurements already committed in EV-MLKEM-94f036.
    It is not itself a measurement.
  - AM-2 states an acceptance test, not a solution. Whether ANY predicate can separate these arms is open,
    and a producer returning "no admissible predicate found, here is the obstruction" is a legitimate
    and useful outcome under docs/inventor-protocol.md section 4.
  - Nothing here discharges C3 or any other completion criterion.
  knowledge_promotion:
    promoted: []
    not_warranted: An instrument amendment establishes no durable claim. The generalizable lesson -- that
      a control must be accepted on DEMONSTRATED separation rather than on plausibility, and that this
      program has now shipped three controls chosen the other way -- is recorded in DEC-20260806-8c33bf
      and belongs to a KN-TECH once a successor confirms it outside this goal.
  next_actions:
  - 'Open the next batch with two producer tasks: implement the AM-1 grid and re-run the graded family;
    and construct a candidate predicate under AM-2, demonstrating separation on committed data BEFORE
    it is used on anything new.'
  - 'Both are cheap: the graded family costs a fraction of B2-A (no new BKZ; the seeds are the cache,
    verified 32/32 at max deviation 0.0), and the AM-2 demonstration runs entirely on committed data.'
  - Split the producer so the pre-registration is snapshot-notarized BEFORE the measurement it governs.
    BATCH-436ddd's freeze was hash-enforced but self-reported, because the snapshot followed the run.
  - Carry the k != d/2 test that separates the refuted q*I story from the measured I_k confinement.
