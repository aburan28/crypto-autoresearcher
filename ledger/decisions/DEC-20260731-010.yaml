coordinator_decision:
  id: DEC-20260731-010
  context: >-
    GOAL-FAEST-001 was paused today (DEC-20260731-009) because its Round-3
    specification is unreachable under this harness's network policy. That
    pause is an acquisition/infrastructure blocker, not a research result,
    and it leaves campaign capacity idle. This decision opens a NEW campaign
    that is executable under the same policy: reduced-round AES. AES needs no
    document acquisition — its specification is FIPS-197 and is fully
    checkable locally against ground-truth known-answer vectors under
    pycryptodome and the openssl CLI — so the campaign's reproducibility
    floor can be built without any network access. The honest prior is that
    no improvement will be found: AES is the most-studied block cipher in
    existence. The campaign proceeds anyway because CLAUDE.md and
    docs/inventor-protocol.md §4 treat premature closure as a failure mode
    symmetric with overclaiming, and the two are held together procedurally
    by mandatory novelty screening, the lossy-projection test, matched
    baselines with end-to-end charging, null-object controls before belief,
    and a reduced-round/toy claim-tier ceiling.
  decision: approve
  target_ids:
    - RQ-AES-001
    - GOAL-AES-001
    - TASK-20260731-601
    - TASK-20260731-602
    - TASK-20260731-603
  rationale:
    - >-
      Executability under the current network policy is the discriminating
      criterion: unlike GOAL-FAEST-001, no primary source must be acquired
      for AES work to proceed, because the specification is pinned by
      locally reproducible FIPS-197 known-answer vectors.
    - >-
      Specification pinning is made a hard gate (TASK-20260731-602) rather
      than an assumption, so that every later reduced-round measurement is
      certified against an implementation whose correctness was independently
      demonstrated against two backends with independent code paths.
    - >-
      Literature baselines are recorded as unverified-from-memory in both
      RQ-AES-001 and GOAL-AES-001. This constrains claim tier and comparison
      language; it does not block work. Citing a recalled number as if read
      would be a fabrication under AGENTS.md rule 9.
    - >-
      Ideation is forced to be object-first: RQ-AES-001 enumerates candidate
      tracked objects (integral/division-property set at a named round count,
      key-schedule differential relation, Demirci-Selcuk matching object,
      partial-sum cost term, impossible-differential contradiction object)
      and TASK-20260731-601's completion gate rejects "attack AES" as a
      candidate.
    - >-
      The claim-tier ceiling is set at reduced-round/toy in the question, the
      goal, and both handoffs, so the campaign is structurally incapable of
      producing a claim about full-round or deployed AES even on success.
    - >-
      Completion criteria are real and achievable and exclude a bare negative:
      either a certified reduced-round result matching or beating a named
      baseline mechanism at a stated round count with charged end-to-end
      cost, or a scoped barrier statement meeting the docs/inventor-protocol.md
      §4 closure standard with an archived derivation.
  evidence_refs:
    - DEC-20260731-009
    - ledger/questions/RQ-AES-001.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/dispatch_queue.json
    - ledger/handoffs/TASK-20260731-601.yaml
    - ledger/handoffs/TASK-20260731-602.yaml
  limitations:
    - >-
      This decision approves a campaign structure and a first bounded batch.
      It is not evidence about AES of any kind, and asserts nothing about the
      security of AES at any round count.
    - >-
      All literature baseline numbers this campaign will compare against are
      recalled from memory and UNVERIFIED under the current network policy.
      No comparison against them may omit that qualifier.
    - >-
      No hypothesis and no experiment is approved by this decision. No
      hypothesis or evidence record was created.
    - >-
      RESOLVED before commit, see amendment_log entry AMD-1. The earlier
      draft of this record listed two open queue defects: (i) BATCH-001
      marked TASK-20260731-601/602 `review_required: true` with no
      independent review task and no ledger archive, which
      `tools/research_dispatch.py::_validate_review_chains` rejects; and
      (ii) every task carried `state: pending`, which is not in
      `research_dispatch.STATES` and fails validation before the review-chain
      check is even reached. Both are fixed in the amended queue: states are
      `queued`, and TASK-20260731-604 (validator) and TASK-20260731-605
      (ledger archive) complete the claim lifecycle.
    - >-
      The environment facts recorded (gcc 13.3.0 with -maes, pycryptodome
      3.23.0, openssl CLI, 4 cores, 15 GB RAM, no GPU, no sage, and the
      blocked-host list) are observations reported to this session, carried
      forward as stated; they were not re-probed by this Coordinator session.
  next_actions:
    - >-
      Commit RQ-AES-001, GOAL-AES-001, the amended BATCH-001 dispatch queue,
      this decision, and the TASK-20260731-601/602 handoffs through a
      Coordinator snapshot archive, then dispatch the two ready tasks
      TASK-20260731-601 and TASK-20260731-602 concurrently. No worker starts
      before that commit verifies.
  amendment_log:
    - id: AMD-1
      amended_at: '2026-07-31'
      status_at_amendment: uncommitted_draft
      immutability_basis: >-
        AGENTS.md "Durable research commits": a ledger record is not official
        until the dispatcher's post-commit verifier accepts it. This record
        had never been committed when the amendment was made, so it was
        edited in place rather than superseded by a new DEC ID. No committed
        record was mutated, and no ID was burned. Had it been committed, the
        correction would have required a new superseding decision record.
      changed_fields: [limitations, next_actions]
      reason: >-
        Two queue defects that this record had listed as open were fixed
        rather than deferred, by extending BATCH-001 (option 1): (i) the
        missing independent review and ledger archive for the two
        `review_required` producers, and (ii) the invalid task state
        `pending`, which is not a member of research_dispatch.STATES. The
        second defect was found by the coordinator, not by this session.
      resulting_queue_shape: >-
        601 (idea-generator) and 602 (executor) are claim-relevant producers;
        603 snapshot-archives both; 604 (validator) reviews the committed
        snapshot; 605 ledger-archives 604 and owns
        ledger/evidence/EV-AES-001.yaml and
        ledger/decisions/DEC-20260731-011.yaml. Every non-archive task is
        claimed by exactly one archive via archive.source_task_ids.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a campaign-opening dispatch decision, not an evidence review.
      No experiment has run, no evidence record exists, and there is no
      durable claim to promote.
  decided_by: coordinator
  decided_at: '2026-07-31'
