        report was read.
      - tools/check_review_independence.py was not run by this composer, which has no shell; see N-1.
  rationale:
    - >-
      Validity holds (validity_check). Two clean seeds, exact recomputation
      and a full blind replay make the counts reliable.
    - >-
      The hypothesis' preregistered prediction "exactly 0 per seed" and its
      statement "no relation in any trial on either seed" are false on seed
      20261009. The refutation artifact is a counterexample certificate: the
      explicit tangent instance on Y^2 = X^3 - 1728 X - 27423, re-found by
      the validator's independent blind search and re-verified exactly by
      the red team and by hand (EV-CZLIFT-ee9b23 proof_status certificate;
      analysis.md I-1). That is a checkable adverse basis, so the weaken does
      not rest on an unreplicated empirical-only reading.
    - >-
      The mechanism is wrong in two sentences. JKSST 2000 does not give
      dependence as negligible at this scale (Theorem 4.1 is conditional and
      vacuous at p <= 12809; dependence is frequent at small discriminants).
      And bound 6 does not reach the attacker's coefficient regime p^(1/r).
      Both points come from a retrieved source or reviewer measurement on
      exactly replayed inputs.
    - >-
      Weaken, not reject_scoped. The frozen falsification criterion (> 0.01
      on both seeds) did not fire. The rarity reading is consistent with the
      data (pooled one-sided upper 0.00148) and with JKSST's empirical law
      (0.855 expected, 1 observed). The failed clause is a point prediction
      that its own source gave a 57 percent prior chance of failing (HC2).
      Rejecting the hypothesis on it would read a miscalibration as a
      refuted mechanism. Treating the met success criterion as support would
      ignore a failed preregistered prediction.
    - >-
      Weaken, not support. Support would require the prediction to hold, and
      a correction that restates the hypothesis to fit the outcome and then
      supports it would be circular. Not inconclusive: the evidence does
      discriminate, because the zero claim is false and the bounded-rate
      reading holds.
    - >-
      Strength preliminary, tier toy. The success reading depends on the
      undeclared sampler, the rate is pigeonhole-dominated, and the
      lift-specific part rests on one event measured outside the frozen
      protocol.
    - >-
      Promotion gates (agents/coordinator.md) do not arise: H-CZLIFT-cb95b8
      has asymptotic_claim null and no heuristic_assumptions, and nothing
      moves toward supported. Red-team HC1 notes that the JKSST mechanism
      rests on Lang's conjecture and Lemma 4.1's assumption, neither
      numbered. That is recorded as a requirement for any successor (N-5),
      not as a gate here.
