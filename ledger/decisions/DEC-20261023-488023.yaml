  limitations:
    - Toy tier only (p <= 12809, r <= 3, bound 6, symmetric lifts, zero-freedom fits, y != 0 sampler); nothing about xedni proper, index calculus on E(Q), cost, or any deployed curve.
    - The literal all-points sampler reading was not tested by the producer runs; only the validator's single blind draw (8/1600, all 2-torsion) bears on it.
    - The lift-survival fraction, the unbounded independence count and the mod-p coefficient medians are reviewer measurements on replayed inputs, not frozen metrics; PARI is unpinned.
    - One relation in 3200 trials; per-cell resolution is coarse (one-sided upper 0.0295 at 0/100).
    - check.py is not independent of run.py; the height metric covers r = 2 cells only; there is no peak-memory record.
    - The JKSST empirical law is applied outside its fitted regime; the 0.855 expectation is a consistency reading.
    - The composing Coordinator has no shell; the only quantities it checked itself are the identities in analysis.md I-1.
    - This decision is not official until the ledger archive commit containing it passes post-commit verification and is pushed to the PR branch.
