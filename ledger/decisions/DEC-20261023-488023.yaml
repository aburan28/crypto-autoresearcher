    and no protocol_amendment is needed. Under decision_impact.on_positive,
    H would move to supported "after review", and the rate would be promoted
    as "the counting form of the xedni obstruction". Review blocks both: the
    hypothesis' own prediction failed, and the count is not that
    obstruction (red-team O8). This is a reading of the review condition the
    clause itself contains; it is not a re-scoring.
  review_composition:
    prior: >-
      Recorded before any reviewer ran (TASK-20261023-62eb31 review_plan
      coordinator_prior): the near-zero rate holds, the p = 101 relation is a
      known small-p coincidence, and the silent y != 0 restriction is the main
      interpretation issue.
    outcome_against_prior: >-
      The review agreed with the prior on all three points. It found four
      things the prior did not anticipate, and this decision adopts them. The
      JKSST attribution is wrong (R1-B3). The rate is pigeonhole-dominated, so
      the lift-specific quantity is f = 1/1261 (R1-S2). The bound sits below
      the attacker's coefficient regime (R2). The bounded search cannot
      certify independence: in-distribution order-7 and order-8 torsion pairs
      pass it (PTM-1).
    joint_rulings:
      - joint: J1, J2, J3, PTM-1 (validation)
        reviewer: holds
        ruling: Adopted. Custody, recomputation, blind replay and the 389a1 null are sound; F1-F5 are weighed below.
      - joint: R1 (support for H and for the xedni-style obstruction)
        reviewer: breaks
        ruling: >-
          Adopted, with one difference of weight. R1-B1 is decisive for the
          status, as the counterexample shows (analysis.md I-1). R1-B2 is
          adopted as a scope correction (CORR-20261023-4ffd7e S1). The
          Coordinator agrees that the y != 0 reading is the attack-relevant
          one, because xedni's points lie in a large prime-order subgroup.
          Under that reading the producer runs are a valid test, so B2 limits
          the wording, not the admissibility. R1-B3 is adopted (retrieved
          source; CORR S3). R1-B4 is adopted as a boundary: the unbounded
          determinant control is a review finding, not frozen evidence.
      - joint: R2 (power to see an attacker's dependences)
        reviewer: breaks
        ruling: >-
          Adopted. It breaks the mechanism sentence "measures the count
          directly where the attack would need it" (CORR S3). It does not
          touch the frozen count, whose scope is bound 6 by contract. The red
          team's empirical mitigation (0/399 in-distribution dependences
          missed at p in {101, 211}) shows the bound-6 count is not
          undercounting in this distribution. It is recorded as a reviewer
          observation only.
      - joint: PTM-1 (red team)
        reviewer: breaks
        ruling: >-
          Adopted as a boundary on what may be inferred ("independent" is not
          read from the bounded search). The torsion objects are
          attack-irrelevant and of negligible sampling probability, so they
          do not impugn the recorded rate.
    weighed_not_adopted:
      - >-
        The red team proposed a follow-up of about 1 CPU-minute: replay both
        seeds' inputs and freeze two preregistered metrics, the
        height-pairing-determinant independence count and the lift-survival
        fraction against the mod-p null. Weighed and not dispatched, for four
        reasons. (1) On these inputs both values have already been observed
        by RT-20261023-d796bb (3199/3200; f = 1/1261). A prediction
        registered now would be in-sample, which is calibration only
        (docs/confound-control.md). Freezing it would upgrade custody, not
        information. (2) No decision changes with f. By the resource reading
        (EV-CZLIFT-ee9b23 obstruction), every f in [0, 1] leaves a linear
        number of rounds dominated by rho, and "independent" for these tuples
        is not decision-relevant once the hypothesis is weakened. (3) The
        roadmap bias toward exponent-targeting mechanisms
        (docs/target-result-profile.md) ranks a toy re-measurement of a
        known-negative literature result below every open CZLIFT item. (4)
        The real value of the proposal is methodological. It is therefore
        adopted as binding contract requirements for any future lifting
        experiment (N-5), on fresh seeds, where the two metrics would be
        out-of-sample.
      - >-
        The red-team "weak" strength is recorded as preliminary, the
        hierarchy level matching it (docs/evidence-and-reproducibility.md).
    procedure_deviations:
      - >-
        Validation: the blind phase and J1/J2 sat in one task with a hash seal
        at 2026-10-22T08:11:07Z, so tools/check_review_independence.py is
