coordinator_decision:
  id: DEC-20260922-925da8
  decided_by: coordinator
  decided_at: '2026-09-22'
  goal_id: GOAL-ICPERF-e6b6a4
  question_id: RQ-ICPERF-94c86e
  task_id: TASK-20260922-bb4080

  identifier_provenance: >-
    All six identifiers minted with `python3 tools/allocate_id.py --next <type>`
    and each confirmed with `--check` before use, 0 occurrences across the
    25869 identifier-bearing paths scanned: EXP-ICPERF-783e9e, H-ICPERF-7d24fd,
    RUN-ICPERF-2f36fd, EV-ICPERF-784b25, TASK-20260922-bb4080, and this record's
    own DEC-20260922-925da8. An earlier ICARITY-prefixed set was discarded
    unused: ICARITY is not a declared area in
    orchestration/research-priority.yaml, and ECDLP2M -- the area whose charter
    this work matches -- cannot carry new identifiers because area tokens are
    letters-only. ICPERF is the declared ECC area whose charter is
    "phase-decomposed costs ... against matched rho".

  decision: >-
    Approve EXP-ICPERF-783e9e, accept its run RUN-ICPERF-2f36fd and the evidence
    EV-ICPERF-784b25, move H-ICPERF-7d24fd from `proposed` to `supported`, and
    REDIRECT the lane's measurement effort: stop adding m = 3 binary
    point-decomposition cells, which the evidence shows cannot beat rho at any
    standardised degree for any solver, and open the m >= 4 solver question at
    n = 409 and n = 571, which is the only cell class left with a positive
    budget and a system small enough to form.
  target_ids:
    - H-ICPERF-7d24fd
    - EXP-ICPERF-783e9e
    - EV-ICPERF-784b25
    - GOAL-ICPERF-e6b6a4

  summary: >-
    The lane asked where an index-calculus speedup could come from. The answer
    this decision records is that below n about 300 it cannot come from anywhere,
    because the Weil-descended decomposition system is larger than the entire
    Pollard rho budget before any solver is invoked; and that at n = 409 and
    n = 571 it can come from exactly one place, a Boolean-system solver with
    exponent below about 0.21 on a degree-12 system in 392 to 556 variables.

  decisions:
    - id: D1
      action: approve_experiment
      subject: EXP-ICPERF-783e9e
      rationale: >-
        Protocol frozen before execution with six preregistered predictions,
        each with an explicit falsification condition; the two inputs the cost
        model depends on are measured rather than assumed; controls recompute
        the model with each charge removed so it is visible which conclusion
        each charge carries; and the solver fit is held to an independent
        instrument's number (EV-ICI-001) rather than to itself.
    - id: D2
      action: accept_evidence
      subject: EV-ICPERF-784b25
      direction: supports
      strength: moderate
      scope: >-
        All four phases of RUN-ICPERF-2f36fd completed and all six preregistered
        predictions held. An earlier version of this decision accepted Q1-Q5 only
        while the ladder was still executing; that scope is now discharged rather
        than rewritten. Q6 held: the m = 2 ladder fits 0.5648 [0.4945, 0.6351],
        containing EV-ICI-001's independent 0.5581 [0.5359, 0.5805]. No clause of
        D1, D3, D4 or D5 ever rested on Q6.
      rationale: >-
        Exact arithmetic on measured inputs, with the degree law corrected by
        its own measurement before any conclusion used it. Capped at `moderate`
        because the verdict is under a declared cost model whose two charges --
        sparse linear algebra at m*D^2 and one operation per ANF monomial -- are
        assumptions a different method could violate, and both are named.
    - id: D3
      action: set_hypothesis_status
      subject: H-ICPERF-7d24fd
      from: proposed
      to: supported
      rationale: >-
        Clauses (i) through (iv) -- the linear-algebra cap, the forced arity, the
        measured degree law and dense ANF, and the located crossover -- all held
        as preregistered. Not `established`: one scoped factor-base family, one
        cost model whose two charges are named assumptions, and a ladder that
        reaches 30 descended variables against the 392 and 556 of the live cells
        with a slope on the m = 2 arm only.
    - id: D4
      action: redirect_measurement_effort
      subject: GOAL-ICPERF-e6b6a4
      rationale: >-
        Every binary point-decomposition measurement in this repository is at
        m = 3: the EXP-ICPERF-66fd51 and e21835 WDSat/Groebner panels at
        n = 15, 17, 19, EXP-ALBIN-004 and -007, and EXP-ICI-001's crossbred and
        MITM ladders at t = 3. IDEA-20260807-32f96d already recorded that arity
        m >= 4 has zero measured cost cells anywhere, and EV-R6-001 censored
        every m = 4 arm on timeouts. EV-ICPERF-784b25 shows m <= 3 has no budget
        at any standardised degree under any solver, so continuing to refine it
        cannot change a verdict. This is a redirection of effort, NOT a
        retirement of the instruments: the WDSat machinery this goal owns is
        exactly what the m >= 4 question needs, pointed at a different arity.
    - id: D5
      action: qualify_open_criteria
      subject: GOAL-FROB-6333a9
      rationale: >-
        That goal's open criteria C1 and C2 measure WDSat conflict pruning at
        n = 41 / m = 2 and n = 43 / m = 3. Those are instrument cells, not attack
        cells, and this decision does NOT close them or call them worthless. But
        m = 2 and m = 3 are the arities EV-ICPERF-784b25 shows can never beat
        rho, so any pruning measured there bears on the attack question only if
        it transfers to m >= 4. That transfer is now a stated condition on the
        inference rather than an unexamined assumption, and it should be
        recorded in the goal's next_action when that goal is next opened. No
        status of GOAL-FROB-6333a9 is changed here.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The result is a cost-model verdict at `moderate` strength that has had no
      independent validator or red-team pass. Promotion to a KN-FIND entry is
      the declared successor action once review has run -- specifically once the
      m*D^2 linear-algebra charge and the per-monomial ANF charge have been
      adversarially examined, since both are load-bearing. Naming the promotion
      gate and declining it is the required behaviour here, not an omission.

  next_actions:
    - >-
      RED TEAM, highest value first: attack the sparse linear-algebra charge
      m*D^2. It is what caps the factor-base dimension near n/4 and therefore
      what forces m >= 4; a method with a materially lower exponent would revive
      m = 3 and overturn D4. Second: attack the per-monomial ANF charge by
      exhibiting a decomposition method that never materialises the descended
      system, which is the only escape below the crossover.
    - >-
      VALIDATOR: re-derive the budget table at n = 131, 233, 409 from the
      declared model without this repository's code, and independently re-measure
      the descended Boolean degree and ANF density on at least three cells.
    - >-
      NEW MEASUREMENT, the one the lane does not have: an m = 4 and m = 5 binary
      point-decomposition ladder on the diagonal l = ceil(n/m), using this goal's
      existing WDSat machinery rather than Groebner, to estimate the solver
      exponent at the arity that matters. EXP-ICPERF-783e9e's own m = 4 ladder is
      the first such data and is Groebner-only and small; it is a starting point,
      not the answer.
    - >-
      Fill the empty Groebner column of the RQ-ICPERF-94c86e table, which
      GOAL-ICPERF-e6b6a4 records as "MEASURABLE and still EMPTY", from this
      experiment's ladder phase, noting that it is PolyBoRi through Sage rather
      than Macaulay2 or Singular and therefore a different engine from the one
      that column was designed around.

  scope_exclusions_respected:
    - No deployed curve is an attack instance; the standardised degrees appear
      only as cost-model parameters.
    - No discrete logarithm is solved; certificate.kind is none.
    - No claim is made about prime fields, GHS Weil descent, Joux-Vitse variants
      or trace-zero varieties, none of which this factor-base family covers.

  cited_records:
