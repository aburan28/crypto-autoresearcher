coordinator_decision:
  id: DEC-20260809-39eb45
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dbfee9
  recorded_by_task: TASK-20260809-aa1a71
  archived_by: TASK-20260809-aa1a71
  context: >-
    BATCH-dbfee9 was opened to correct the immutable EV-WESO-001 anchor and
    crossover interpretation using the snapshot-archived successor package
    RUN-WESOVOW-201692-001. No new experiment was authorized. The producer
    derivation was snapshot-committed before the independent Validator and Red
    Team reviews.
  decision: supersede
  decision_scope: >-
    Supersede only EV-WESO-001's stale claim that c=0 beats the
    Delfs-Galbraith baseline at every tested budget w=2^30..2^80 for all five
    field sizes. The corrected successor gives field-dependent crossovers and
    loses at p=2^256 for w=2^30,2^40,2^50 under c=0. This decision also
    records that DEC-20260806-a00a28's separate ~49.5 value is a paper-pair
    approximation, not the successor's optimized p=2^256 crossover; the old
    decision remains immutable and is not edited here.
  target_ids:
    - EV-WESO-001
    - EXP-WESOVOW-001
    - RUN-WESOVOW-201692-001
    - GOAL-SSI-001
  evidence_ids:
    - EV-SSI-e8cc71
  review_ids:
    - VAL-20260809-b30a85
    - TASK-20260809-e805f6
  review_task_ids:
    - TASK-20260809-b30a85
    - TASK-20260809-e805f6
  snapshot_commit: 3e6118c356a2454f20bbeb52defe38387994b8b4
  rationale:
    corrected_interpretation:
      basis: >-
        The successor raw result and corrected source use the normalized law
        T(w)=T_full*sqrt(M/min(w,M)), which is flat at the high-memory endpoint
        and yields the exact crossover equation recorded in EV-SSI-e8cc71.
        The old all-budgets inference is contradicted at the first three
        p=256 c=0 budgets and by the corresponding five crossover values.
    independent_validation:
      basis: >-
        VAL-20260809-b30a85 independently recomputed the anchor, five c=0
        crossovers, p=256 rows, source hashes, snapshot binding, and predecessor
        immutability. It returned CONCUR within the stated arithmetic and
        claim-boundary scope.
    independent_red_team:
      basis: >-
        TASK-20260809-e805f6 independently attacked the anchor, cap, crossover,
        prior 49.5 approximation, paper-pair scope, provenance, and hidden
        overhead assumptions. It returned CONCUR_WITH_CAVEAT and required that
        the separate 49.5 sentence not be carried forward as the optimized
        successor crossover.
    caveats:
      basis: >-
        C1 remains a joint partial failure with zero of five complete rows
        within 0.75 bits. The successor manifest is dirty-tree, stdout retains
        a legacy heading, raw-result.json lacks a standalone schema field, and
        the review model binding was not probe-verified. These are preserved as
        limitations, not repaired by mutation or treated as cryptanalytic
        evidence.
    claim_boundary:
      basis: >-
        This is a conditional cost-model interpretation correction. It makes no
        attack, security, exponent, deployed-SQIsign, parameter, hypothesis,
        or goal-completion claim.
  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-WESOVOW-001
      from: approved
      to: approved
      note: >-
        The experiment remains observation-only. This decision admits a
        superseding interpretation record and changes no experiment status.
  asymptotic_promotion_gates:
    gate_1_proof_decomposition: open
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Passed for this narrow interpretation correction only; no asymptotic or
      security claim is advanced.
    note: No asymptotic-complexity, breakthrough, or security claim is advanced.
  next_actions:
    - >-
      Open the next bounded qualitative correction batch for EV-SSI-59f7a2:
      supersede its OneEnd/SQIsign labeling so that SC-1 and SC-3 are carried
      explicitly, while preserving its 2^{120-123} number unless new evidence
      directly addresses that value. Use additive records, snapshot before
      review, and independent Validator/Red Team gates; do not infer a
      security conclusion from the label correction.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch corrects a model interpretation. It promotes no technique,
      theorem, exponent, attack, or security conclusion.
  decided_by:
    task: TASK-20260809-aa1a71
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-09'
