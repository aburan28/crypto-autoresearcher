coordinator_decision:
  id: DEC-20260803-db64f6
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-012
  recorded_at: '2026-08-03'
  decision: expand
  decision_label: resume_from_infrastructure_pause_blocker_cleared

  context: >-
    DEC-20260803-f2d3a4 paused GOAL-MLKEM-003 under its declared
    infrastructure-blocker condition after TASK-20260803-b762a1 died on a
    provider session limit stated to reset at 06:10 UTC. It recorded a concrete
    resume action conditional on that reset.

  resume_condition_check: >-
    The recorded blocker was a provider session limit with a stated reset at
    06:10 UTC. The clock now reads 2026-08-03T15:38Z, roughly nine and a half
    hours past it. The blocker has cleared, so the condition the pause named is
    met. This is the whole basis for resuming: no new information about the
    research arrived, and none was needed, because the pause never asserted
    anything about the research.

  goal_status_transition:
    from: paused
    to: active
    reason: declared_infrastructure_blocker_cleared

  merge_state_at_resume: >-
    origin/main was merged before resuming, 547 commits. Main's GOAL-MLKEM-003
    record is still at BATCH-009 with 8 batch_log entries; this branch carries
    12, containing every one of main's plus BATCH-009 through BATCH-012. The
    superset relation was verified entry by entry BEFORE resolving the goal-record
    conflict, not assumed. Unlike BATCH-007, no other session has duplicated this
    work.

  merge_defect_recorded: >-
    That merge committed unresolved conflict markers into the goal record and one
    coordination file, leaving the goal record UNPARSEABLE. Both were restored
    byte-for-byte from the pre-merge commit 8fdbd7b3 and the repair is committed
    separately. Recorded here because a ledger record that does not parse is an
    integrity failure, not a formatting nit, and the harness caught it only
    because tools/validate_ledger.py was re-run after the merge -- which is
    precisely why the skill requires that re-run.

  successor_task: >-
    TASK-20260803-36f572 succeeds the failed TASK-20260803-b762a1 under a NEW
    identifier. The failed identifier is retired and never reused; it keeps its
    failed state and its committed receipt. The objective is unchanged from
    DEC-20260803-2e82d5's C3 action, because nothing about the research changed
    while the goal was paused.

  scope: >-
    Authorizes the C3 check and nothing else: replace the Gaussian-Phi
    surrogate's K*v^p by the exact region measure from (4.10), (4.11) and (4.24)
    at alpha=2, refit, and score against the closed-form counting-noise floor
    from the outset rather than against zero. Carry an independent validation of
    that counting-floor computation in the same batch. No new sampling, no
    network dependence, no G6K run, no cost-model revision.

  why_this_task_matters: >-
    It would be the FIRST time this program tests the object it has been naming
    since BATCH-009. EV-MLKEM-2e668d C-3 established that BATCH-009 through
    BATCH-011 all fitted a Gaussian-Phi surrogate, not Approximation 4.9's
    family, so every exponent statement in the record is about the surrogate. The
    independent validation of the counting floor is not optional padding: every
    surviving conclusion now rests on that floor and it has never been checked by
    anyone but the red team that produced it.

  non_claims:
    - ML-KEM is not broken, and resuming from an infrastructure pause bears on nothing.
    - KN-OPEN-016 remains open.
    - >-
      Approximation 4.9 is neither validated nor refuted; the check that would
      test it has not yet run.
    - >-
      Rule 12 stays UNMET and UNWAIVED. EV-MLKEM-011, EV-MLKEM-013 and
      EV-MLKEM-017 keep their status; KN-FIND-031 stays withdrawn.
    - No closure quorum is asserted or sought.

  next_actions:
    - >-
      Execute TASK-20260803-36f572, then the snapshot TASK-20260803-5b602c, then
      the independent validation TASK-20260803-bddfa7 repointed to the successor,
      then the ledger archive TASK-20260803-b1f24c.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A resume decision establishes nothing about the subject matter. Any
      promotion belongs to the batch's own ledger decision.
    promote: false

  references:
    - DEC-20260803-f2d3a4
    - DEC-20260803-2e82d5
    - EV-MLKEM-2e668d
    - GOAL-MLKEM-003
    - TASK-20260803-b762a1
    - KN-OPEN-016

  target_ids:
    - GOAL-MLKEM-003

  decided_by: coordinator
  decided_at: '2026-08-03'
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      orchestration/model-policies.yaml names GPT-5.6 policy aliases which this
      Claude Code harness cannot resolve (CLAUDE.md, model policy note).
    degraded_requirements: []
