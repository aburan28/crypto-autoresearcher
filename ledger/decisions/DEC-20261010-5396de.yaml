    coordinate census. RUN-ECTD-63f478 is a future run; no scientific
    trial was launched during design.
  standing_authorization: >-
    AGENTS.md records the user's 2026-09-06 authorization for complete,
    approvable protocols. The Coordinator checked goal-specific capacity,
    exact model and pair selection, ordinary and Hasse admission,
    point and pair completeness, group-law round trips, a frozen
    permuted-label null, independent replay, controls, metrics,
    stopping and interpretation rules, resource protection, artifact
