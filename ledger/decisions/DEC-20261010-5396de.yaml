  rationale:
    - >-
      The source idea makes a bounded, falsifiable existence claim:
      W is the exact count of eligible unordered pairs on one public
      F_89 curve satisfying x(P+Q)=x(P)+x(Q). W>=1 supports only that
      bounded claim; W=0 refutes it after all controls pass.
    - >-
      The complete census and independent replay preserve every hit,
      the eligible denominator, exclusive exclusion counts, and a
      deterministic label null. A failed admission or control has
      its own invalid or unmeasured branch.
    - >-
      The executor handoff remains undispatched until this design
      archive is committed and pushed, a lane is claimed, and the
      runner's admission gates accept the frozen plan.
  evidence_refs: []
  limitations:
    - Approval precedes observation and supports no scientific result.
    - A public coordinate equality on one curve provides no secret endpoint or ECDLP cost inference.
    - Failed controls or resource stops cannot be read as W=0.
