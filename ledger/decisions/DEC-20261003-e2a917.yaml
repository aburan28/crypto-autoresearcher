# =============================================================================
# DEC-20261003-e2a917 -- ARCHIVE SUBSTITUTION RULING for TASK-20261003-6d2f84.
#
# TASK-20261003-6d2f84 (the ledger archive of DEC-20261003-4e91b7) may not start
# until TASK-20261002-c13d8e's and TASK-20261002-5f0b2c's snapshot receipts
# verify. Neither task ran, and neither can now run as written: every path they
# declare is already on main, brought in by ordinary PR merges. This decision
# rules that 6d2f84 may CONTENT-VERIFY those paths on the merged tree in place of
# the two receipts, under conditions C1 to C7, for that ordering purpose only. It
# also records what the substitution cannot recover.
#
# It changes no hypothesis status, approves no experiment, adopts no reviewer
# finding and edits no record. Effective only after TASK-20261003-1b8e5d commits
# it and that receipt verifies.
# =============================================================================
coordinator_decision:
  id: DEC-20261003-e2a917
  id_provenance: >-
    Random 6-hex token chosen by hand (this Coordinator session has no shell).
    Greps of ledger/, knowledge/ and coordination/ and a repository-wide
    filename Glob found no occurrence. experiments/ and inputs/ were not
    content-searched (the search timed out). Owed on TASK-20261003-1b8e5d:
    `python3 tools/allocate_id.py --check DEC-20261003-e2a917` and
    `git grep -l e2a917 HEAD`.
  recorded_at: '2026-10-03'
  decided_at: '2026-10-03'
  decided_by: coordinator
  archived_by: TASK-20261003-1b8e5d
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: null
  batch_id_note: >-
    Null for the routing reason DEC-20261001-5c9e7a, DEC-20261002-7a3f19 and
    DEC-20261003-4e91b7 gave. This decision opens no batch.
  standing_authorization: >-
    The standing user authorization of 2026-09-06 (AGENTS.md; CLAUDE.md
    "Research budgets: progress first") covers the archival tasks ruled on
    here. Nothing here is an experiment approval.

  decision: supersede
  decision_label: >-
    SUBSTITUTE CONTENT VERIFICATION FOR TWO SNAPSHOT RECEIPTS THAT CAN NO LONGER
    BE PRODUCED. The ORDER constraint of TASK-20261003-6d2f84 and the
    effectiveness condition of DEC-20261003-4e91b7 R1 are superseded, for
    ordering only, by conditions C1 to C7 below, checked and recorded in
    6d2f84's own receipt. TASK-20261002-c13d8e and TASK-20261002-5f0b2c are
    retired as unexecutable as written. No receipt is written under either id.
    The same mode is ordered for TASK-20261003-6d2f84's own already-merged
    records, and for TASK-20261003-f2b6e0 and TASK-20261003-7a4c19.

  context: >-
    TASK-20261003-6d2f84 constraint ORDER: "Do not start until
    TASK-20261002-c13d8e's snapshot receipt verifies (with
    check_review_independence.py passing) and TASK-20261002-5f0b2c's snapshot
    receipt verifies." DEC-20261003-4e91b7 R1 makes the composition effective
    only after c13d8e "commits exactly the two report directories, its receipt
    verifies, and check_review_independence.py passes", and says a failure
    "returns to the Coordinator before TASK-20261003-6d2f84 may run". The
    dispatching session reports, on 2026-10-03, the following. Branch
    claude/continue-task-v5f6a5 equals origin/main and includes PRs #1771 and
    #1776. Everything 6d2f84 archives is committed and merged (merge commit
    785b14211). The two reviewer report directories reached main via #1661 and
    #1766. The Hhan freeze (TASK-20261003-a19c53) and the EXP-SEMBIN-3d9a71
    version-2 draft (TASK-20261003-e7058d) reached main via #1776 (74dc381f6).
    The dispatching session ran check_review_independence.py on the two
    c7e1d4-round reports with result PASS. c13d8e and 5f0b2c have not run as
    separate tasks. This Coordinator read, in the working tree that the
    dispatching session states equals origin/main, the following: both reports,
    both reviewer cards' dispatch_preconditions, TASK-20261002-a84e65's card and
    DESIGN.md disclosures, the four archive cards (c13d8e, 5f0b2c, 31c9d7,
    d815a6), the f2b6e0 and 7a4c19 cards, the a19c53 receipt, the e7058d
    DESIGN.md dispatch note, GOAL-SEMBIN-5078bc.yaml, tools/shard_goal.py, the
    goal-loading part of tools/validate_ledger.py, tools/allocate_id.py --check,
    and the plan-discovery part of tools/check_review_independence.py. It ran
    no git command and computed no hash.

  rulings:
    - id: R1
      question: >-
        May TASK-20261003-6d2f84 content-verify the c13d8e and 5f0b2c paths on
        the merged tree in place of those two receipts?
      ruling: >-
        YES, CONDITIONALLY, AND FOR THE ORDER CONSTRAINT ONLY. 6d2f84 records
        C1 to C7 in its receipt before it stages anything. If any condition
        fails, 6d2f84 stops, commits nothing, and returns the failing condition
        to the Coordinator. The two receipts are NOT written, now or later,
        under c13d8e's or 5f0b2c's id. A receipt written now would describe an
        isolated snapshot commit that never happened. The paths entered main
        inside PR merges that also carried other paths, so no commit binds
        exactly them.
      why_the_receipts_cannot_be_produced: >-
        Both cards require "one isolated snapshot commit of exactly the
        declared paths". Those paths are already in main's tree. An isolated
        commit of them would be empty, and binding a receipt to the merge commits
        that actually added them would claim an isolation that did not occur.
      what_the_receipts_were_for_and_what_survives: >-
        (i) FIXED BYTES FOR EVERY LATER READER. Content binding recovers this
        in full. It is the program's primary archive binding: CLAUDE.md
        "Archive receipts bind to CONTENT first", and research_dispatch.py
        verifies path_sha256 and treats commit reachability as advisory.
        (ii) FIXED BYTES BEFORE COMPOSITION. This CANNOT be recovered.
        DEC-20261003-4e91b7 was composed from uncommitted working-tree files
        (its PD-2), and nobody hashed the reports when it read them. Content
        verification today proves that the committed bytes are fixed and have
        not changed since they were first committed. It cannot prove that they
        are the bytes the composition read. C5 is a partial mitigation, not a
        proof.
        (iii) AN ISOLATED, VERDICT-FREE COMMIT MESSAGE. This is not recoverable
        and is not repaired. C6 records the subjects of the commits that added
        the files.
      conditions:
        - id: C1
          what: >-
            EXACT FILE SET. On origin/main, the tracked files under each
            directory are exactly the producer's declared set, no more and no
            fewer.
            coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/:
            the 10 paths in validation_report.yaml artifact_paths.
            coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-46ba70/:
            the 7 paths in red_team_report.yaml artifact_paths.
            coordination/tasks/TASK-20261002-a84e65/: DESIGN.md and
            proposed-records/EXP-SEMBIN-3d9a71/specification.yaml (the card's
            deliverables). Every file is non-empty. This also discharges the
            DEC-20261003-4e91b7 PD-5 completeness check for a84e65.
        - id: C2
          what: >-
            PRODUCER-SIDE HASHES. The sha256 of each of the red team's six
            non-report files on origin/main equals the value in
            red_team_report.yaml artifact_sha256. The validator and the designer
            recorded no self-hashes of their own outputs. Their files are bound
            only from this archive forward, and the receipt says so.
        - id: C3
          what: >-
            WRITE-ONCE HISTORY. For every file in C1, `git log --no-merges
            --format=%H origin/main -- <path>` lists exactly ONE commit, and
            `git log --no-merges --diff-filter=A --format=%H origin/main --
            <path>` lists the same commit. A file that was modified after it
            was first committed fails C3. That is the only case in which the
            committed bytes could differ from the bytes first committed.
        - id: C4
          what: >-
            INDEPENDENCE CHECK WITH ITS EXACT COMMAND. Run on the tree 6d2f84
            commits on: `python3 tools/check_review_independence.py --plan
            ledger/handoffs/TASK-20261002-c13d8e.yaml --reports
            coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4
            coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-46ba70`.
            It must exit 0, and its full output is recorded verbatim. The
            dispatching session's earlier PASS is recorded as reported, WITH
            the exact command line it used. A PASS whose command is unknown is
            recorded as "reported, command unknown" and does not satisfy C4.
          why_the_card_command_is_replaced: >-
            c13d8e's card prescribes `--batch
            coordination/goals/GOAL-SEMBIN-5078bc/reviews`. Reading
            tools/check_review_independence.py (_find_in_batch, _plan_of), that
            form looks for a review_plan inside the directory. A Grep found no
            YAML there with a top-level review_plan, read_plan or handoff key.
            The round's plan lives on ledger/handoffs/TASK-20261002-c13d8e.yaml.
            So the card's form should exit 2 ("no review_plan found") rather
            than pass. This is a reading of the code, not a run. The card's
            defect is the Coordinator's (DEC-20261002-7a3f19 wrote it).
          what_c4_cannot_see: >-
            The checker reads attestations. It cannot see content that a
            dispatch message carried. The validator attests
            read_sibling_reports false, which is true of files. The sibling
            content arrived in the dispatch message (DEC-20261003-4e91b7 PD-3;
            CORR-20261003-5d7c3b). A C4 PASS therefore does not cure PD-3, and
            the composition's independence reading stays as DEC-20261003-4e91b7
            recorded it.
        - id: C5
          what: >-
            QUOTATION SPOT-CHECK, ALREADY DONE HERE ON THE WORKING TREE.
            "+0.585" occurs in red_team_report.yaml (20 lines). "5.33" occurs
            in validation_report.yaml. Its dispatch_and_procedure PD-4 carries
            the dispatch-message quotation that DEC-20261003-4e91b7 PD-3 relies
            on, and its snapshot_reviewed.content_binding_sha256 carries the
            three draft hashes that PD-4's byte check compares against. This
            becomes a check on committed bytes only when C1 to C3 hash the same
            files.
        - id: C6
          what: >-
            COMMIT PROVENANCE, RECORDED AND NOT REPAIRED. For each directory in
            C1, record the short sha and subject of the commit C3 finds, and
            whether the subject names TASK-20261002-c13d8e or -5f0b2c and claims
            anything about a verdict or the design. A verdict claim in a subject
            is recorded as a deviation, not amended.
        - id: C7
          what: >-
            NO JR-2 BREAKING ARTIFACT TO ROUTE (c13d8e's bus-notification
            constraint). red_team_report.yaml review_attestation.verdict reads
            "JR-2: holds" and reports no generic harvesting cell below the VOW
            column. Nothing routes to review-breakthrough, and no bus message is
            owed. Already read here; the receipt restates it.

    - id: R2
      question: >-
        6d2f84's own declared records were merged at 785b14211 (PR #1771)
        outside any isolated archive. What does 6d2f84 commit?
      ruling: >-
        It does NOT re-commit them. It binds each of its 13 declared record
        paths by path_sha256 in its receipt, applies C3's write-once test to
        each, and commits only (a) its receipt, (b) the goal conversion
        (removal of ledger/goals/GOAL-SEMBIN-5078bc.yaml and creation of
        ledger/goals/GOAL-SEMBIN-5078bc/goal.yaml by tools/shard_goal.py), and
        (c) the one new checkpoint shard. Its completion gate "changes exactly
        the declared paths" is read as follows. The commit changes only (a) to
        (c), every declared path is hash-bound, and nothing else is touched.
        This is a declared departure from the card, not compliance. The
        receipt path, which is a card deliverable but not in artifact_paths,
        is declared here.
      note_on_the_deletion: >-
        research_dispatch.py refuses an archive commit that deletes a declared
        artifact path ("archives require content"). 6d2f84 is in no dispatch
        queue, so that verifier does not run on it. The removal of the flat
        goal file is declared in the receipt as a conversion deletion and is not
        path_sha256-bound. Its pre-conversion sha256 IS recorded.

    - id: R3
      question: What becomes of TASK-20261002-c13d8e and TASK-20261002-5f0b2c?
      ruling: >-
        RETIRED AS UNEXECUTABLE AS WRITTEN, by read-through. Their files are
        immutable and keep reading written_not_dispatched. They did not run and
        are not recorded as completed. c13d8e's review_plan
        (REVIEW-SEMBIN-20261002-c7e1d4) stays the plan of record for the round.
        5f0b2c's draft-identifier check (`allocate_id.py --check
        EXP-SEMBIN-3d9a71`; `git grep -l 3d9a71 HEAD`) moves into 6d2f84's
        identifier table as an extra row. It is also DEC-20261003-4e91b7 R6 X9.
        A hit there is REPORTED and does not stop 6d2f84, because 3d9a71 is a
        draft id that no ledger record yet carries, and the approval decision
        on version 2 owns it.

    - id: R4
      question: >-
        TASK-20261002-31c9d7 and TASK-20261001-d815a6 have no receipts either.
        Does anything change from the 6d2f84 card?
      ruling: >-
        No change in kind. 6d2f84 records presence and sha256 for their declared
        paths and does not re-commit them or write their receipts, as the card
        says. C3's write-once test is added for each path. Reference hashes
        exist for five paths and are compared. For d815a6, the validator's
        content_binding_sha256 of the three drafts at f4f09fe36 is the
        reference; this is the same comparison as the PD-4 byte check, made at
        origin/main. For 31c9d7, the validator bound
        ledger/handoffs/TASK-20261002-9e27f4.yaml (94a55786...) and
        ledger/corrections/CORR-20261002-e58c3a.yaml (b0ff7a23...) at
        f4f09fe36. The checkpoint 31c9d7 owed (DEC-20261002-7a3f19
        goal_checkpoint) was never written. The goal was never converted, and
        its head next_action still dates from 2026-09-15. 6d2f84's shard
        absorbs the decision list (R5).

    - id: R5
      question: >-
        What does the checkpoint shard list, and is the goal head's
        next_action updated?
      ruling: >-
        The shard lists DEC-20261003-4e91b7, DEC-20261002-7a3f19 and
        DEC-20261001-5c9e7a, as DEC-20261003-4e91b7 goal_checkpoint orders. It
        also lists DEC-20260928-7c3d91, because DEC-20261001-5c9e7a's own
        unwritten checkpoint would have listed it (its
        goal_checkpoint.content.decisions), and this decision. The shard has exactly one next_action:
        DEC-20261003-4e91b7 goal_checkpoint.content.next_action, verbatim. The
        goal head is NOT edited beyond what shard_goal.py itself writes. Both
        DEC-20261003-4e91b7 and the card order shard-only. Overwriting the head
        with this lane's text would also drop the goal's concurrent lanes:
        DEC-20261002-5a576d, DEC-20261002-3b2d41 and DEC-20261002-99c798 approve
        experiments on this goal, and neither the head nor the 4e91b7 text
        names them.
      known_staleness_recorded_not_repaired: >-
        The head next_action (2026-09-15, DEC-20260915-fad1c1) predates at
        least DEC-20260921-2c62d7, DEC-20260928-7c3d91, DEC-20261001-5c9e7a,
        DEC-20261002-7a3f19, DEC-20261003-4e91b7 and the three approvals above.
        tools/goal_head.py reads the head's next_action as the resume field.
        Until a goal-level reconciliation decision lands, the newest checkpoint
        shard is the resume point for the c7e1d4 lane, and the head is not.
        That reconciliation is owed (next_actions).

    - id: R6
      question: >-
        TASK-20261003-a19c53 and TASK-20261003-e7058d ran and were merged
        (#1776) before 6d2f84 verified. What happens to their bound snapshots,
        TASK-20261003-f2b6e0 and TASK-20261003-7a4c19?
      ruling: >-
        Same mode as R1 and R2. Each still runs, alone, after 6d2f84 verifies.
        Each content-verifies its declared directory on the merged tree, with
        C1 (each producer's declared file set), C3 (write-once history) and C6
        (commit provenance). Each also runs its card's own extra checks:
        f2b6e0 re-hashes every PDF and paper_fulltext.md against its sidecar
        and provenance.json, and runs `make sources` and `build_source_index.py
        --check`. 7a4c19 runs the draft-identifier checks. Neither re-commits
        already-merged bytes. Each commits its receipt (and the source index,
        only if it is tracked and changed). The early dispatch itself is
        recorded in CORR-20261003-b62e0d item D3.

    - id: R7
      question: How is the pattern behind PD-3 and PD-4 stopped?
      ruling: >-
        Two binding practices for this lane, beginning with the next dispatch.
        (a) A dispatch message to a reviewer or designer carries the card path
        and nothing from any sibling task's output. Where the dispatcher thinks
        sibling content should reach a reviewer, it asks the Coordinator for a
        blindness.lifted_for entry first. (b) A dispatch the user orders ahead
        of a card's dispatch_preconditions is recorded by the dispatching
        session AT DISPATCH TIME (a bus message via tools/agent_bus.py naming
        the card and each unmet precondition), not reconstructed afterwards.
        User instruction outranks a card's preconditions. Practice (b) does not
        refuse such dispatches. It makes them self-documenting.

