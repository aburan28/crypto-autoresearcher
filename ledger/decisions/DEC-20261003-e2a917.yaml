  rationale:
    - >-
      The receipts are a means. Their purpose is that every later reader sees
      fixed bytes. On this repository that purpose is met by content binding,
      which the dispatch verifier already treats as primary. Insisting on two
      receipts that can no longer be truthfully written would block the
      archive while adding no fixity.
    - >-
      The one property that cannot be recovered is that the bytes were fixed
      before the composition read them. It is named, not glossed. The
      substitution is scoped to ordering, so it cannot be read as having
      restored that property.
    - >-
      C3 is what makes content verification more than a hash of today's tree.
      A file with exactly one commit in its history cannot have been changed
      after it first landed.
    - >-
      Re-checking the independence gate with an explicit --plan, and recording
      the exact command, is cheap. A PASS whose command is unknown cannot be
      told apart from the card's --batch form, which on a reading of the code
      should not find this round's plan.

