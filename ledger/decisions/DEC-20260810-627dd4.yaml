coordinator_decision:
  id: DEC-20260810-627dd4
  goal_id: GOAL-ARGON-001
  batch_id: BATCH-0c7f2f
  recorded_at: '2026-08-10'

  decision: supersede
  decision_type_rationale: >-
    Not support/weaken/reject_scoped: nothing was tested, so there is no
    tested result to score. Not expand: this batch's purpose was consolidating
    existing records, not adding new ones. `supersede` names exactly the
    content-level ruling this batch makes: TASK-20260809-4e04eb's proposal
    supersedes IDEA-20260809-a915ea as the surviving formalization of this
    goal's graph-structure-first work, on the grounds detailed in
    EV-ARGON-e9503a and reconciliation.md.

  context: >-
    GOAL-ARGON-001 BATCH-0c7f2f discharges DEC-20260809-8732e6's next_action:
    reconcile TASK-20260809-4e04eb's proposal against all nine pre-existing
    RQ-ARGON-141710 sibling proposals. TASK-20260810-7e0990 (coordinator)
    performed the reconciliation; this decision formalizes its findings.

  evidence_refs:
    - EV-ARGON-e9503a

  target_ids:
    - GOAL-ARGON-001
    - TASK-20260809-4e04eb
    - IDEA-20260809-a915ea
    - IDEA-20260809-ac5947
    - IDEA-20260809-b9e9cc
    - IDEA-20260809-bcf891

  rulings:
    ruling_1_supersede_a915ea: >-
      TASK-20260809-4e04eb's proposal supersedes IDEA-20260809-a915ea
      content-wise: same tracked object (the Argon2 per-lane memory-access
      DAG topology and depth-reducing-set size), same directional claim made
      specific and falsifiable via an explicit mechanism, a scale-free metric
      (rho), a matched null (G_unif), and two-tier pre-registered
      falsification. a915ea's own fields disclose it as an unworked sketch
      (RFC 9106 not read, web novelty check not done, no null-object control,
      no quantitative metric). a915ea's second observable is subsumed as
      methodology (proposal.md Sec.6 steps 6-7), not dropped. A future
      /design-experiment step on this research direction should read
      TASK-20260809-4e04eb's proposal, not a915ea, as its starting
      formalization.
    ruling_1_limitation: >-
      This is a content ruling, not a ledger status transition. a915ea's
      `status` field remains `proposed`; no task in BATCH-0c7f2f had write
      scope to change it. If this program's proposal schema supports a
      superseded/refined status distinct from a hypothesis-record status,
      that transition is named here as an open item for a future task with
      the appropriate write scope -- it is not performed by this decision.
    ruling_2_ac5947_stands_alone: >-
      IDEA-20260809-ac5947 is not superseded or merged: it answers a
      genuinely different question (measured attack cost vs. measured graph
      structure). Its mechanism field names a915ea's graph object by name;
      going forward that reference should be read as pointing at
      TASK-20260809-4e04eb's proposal (the surviving formalization) rather
      than literally at a915ea's sketch. This is a reference-currency note,
      not a content change to ac5947's own hypothesis, which is independent
      of which sketch supplies the underlying graph construction.
    ruling_3_b9e9cc_reference_currency: >-
      IDEA-20260809-b9e9cc carries the same reference-currency note as
      ac5947: its single-lane anchor control names a915ea by name and should,
      going forward, be read against TASK-20260809-4e04eb's proposal's
      single-lane construction instead.
    ruling_4_bcf891_precondition_confirmed: >-
      IDEA-20260809-bcf891's independent-known-family calibration remains a
      required precondition control -- previously ruled for a915ea's numbers,
      now confirmed to transfer unchanged onto TASK-20260809-4e04eb's
      proposal, since that proposal's own Sec.6 step 6 sketches only a weaker
      self-referential cross-check. This confirms, rather than revises,
      DEC-20260809-8732e6's existing next_actions.
    ruling_5_remaining_seven_unaffected: >-
      IDEA-20260809-ac98b5, b17238, bf5139, c059a7, and c13b8b were read in
      full and found not to overlap this reconciliation's subject matter
      (graph-structure-and-null-comparison content); none is touched by this
      decision.
    ruling_6_a915ea_correction: >-
      IDEA-20260809-a915ea's dominated_by field (falsely asserting no
      memory-hard-function records exist in the corpus, when eight do) and
      its directly-adjacent novelty_screen field (same false-premise root
      cause) are corrected in place, per this Coordinator's authority to edit
      a specifically-defective ledger field with a stated reason. No other
      field of a915ea.yaml is touched.

  rationale:
    - >-
      Consolidating this goal's records into one coherent picture before any
      /design-experiment step prevents the fragmentation this session already
      spent significant effort untangling elsewhere on this branch for an
      unrelated goal's stale head (see the GOAL-MLDSA-001 goal-head
      reconciliation earlier in this branch's history) -- the same failure
      mode, caught here before it compounded rather than after.
    - >-
      TASK-20260809-4e04eb's proposal earns its supersession on independently
      verified merit (all seven of its RECALLED premises confirmed accurate
      against RFC 9106's primary text by the Validator), not merely on being
      newer or more detailed than a915ea.

  limitations:
    - No hypothesis or experiment record is created or changed by this decision.
    - >-
      RFC 9106 remains unfiled as a formal KN-LIT primary source; this
      decision restates but does not discharge that next action.
    - >-
      This reconciliation was not independently reviewed by a fresh
      validator/red-team session; see EV-ARGON-e9503a's reviewed_by_note for
      why that is consistent with this program's independent-review
      requirement, which binds claim-relevant producer results rather than
      administrative record consolidation.

  next_actions:
    - >-
      Acquire RFC 9106 via raw HTTP fetch (curl or equivalent against
      https://www.rfc-editor.org/rfc/rfc9106.txt), which
      TASK-20260809-28c68e demonstrated works in this environment where
      WebFetch/WebSearch fail identically for every agent that has tried
      them on this branch, and file it as a KN-LIT primary source.
    - >-
      When a /design-experiment step is next dispatched for this research
      direction: build on TASK-20260809-4e04eb's proposal (not a915ea);
      substitute or supplement bcf891's independent-known-family calibration
      for the self-referential small-q cross-check currently sketched;
      replace the RECALLED/UNVERIFIED table (proposal.md Sec.3) with the
      filed RFC 9106 citation; and explicitly carry forward the Red Team's
      open "null-vs-theory gap" finding rather than silently assuming it
      away.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No experiment ran and no durable finding about Argon2 exists to
      promote. This decision reconciles proposal records; RFC 9106's KN-LIT
      filing (named as the next action above) is the appropriate promotion
      once the primary text is actually obtained and read, not performed
      unilaterally from this decision alone.

  decided_by: coordinator
  decided_at: '2026-08-10'

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    fallback_used: true
    fallback_note: >-
      Policy aliases do not resolve to distinct models under this Claude Code
      harness; this session runs model: inherit (claude-sonnet-5, the
      resolved session model). Not Bedrock.
    model_verified: false
