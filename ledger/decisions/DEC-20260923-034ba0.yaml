    - >-
      Scope: EcGFp5-shaped and EcGFp5-model TOY curves over
      F_{p'}[z]/(z^5 - c) at p' in {4111, 262151, 16777291, 1073741831},
      known-scalar, msolve 0.6.5. Nothing here is a measurement, and nothing
