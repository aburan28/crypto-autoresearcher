# =============================================================================
# DEC-20260923-034ba0 -- RULINGS on KI-1 (the 25-bit EcGFp5-shaped ladder curve
# is not double-odd) and on DP-3 / AC-6 (no lane can be claimed) for
# EXP-GFPN-05ff43 protocol v2, made BEFORE ANY v2 RUN PACKAGE EXISTS.
# Remedy: a DRAFT additive addendum, AMD-EXP-GFPN-05ff43-20260923-rung31, which
# adds the pre-selected, spec-conformant 31-bit rung p' = 1073741831 and has one
# pre-declared infrastructure fallback.
# THIS IS A DESIGN RULING, NOT AN APPROVAL. It approves nothing, launches
# nothing, moves no hypothesis status and makes no security claim.
# Coordinator act under TASK-20260923-242cd0 (goal mode, Act 1 of 2).
# =============================================================================
coordinator_decision:
  id: DEC-20260923-034ba0
  recorded_at: '2026-09-23'
  decided_at: '2026-09-23'
  decided_by: coordinator
  kind: design_ruling
  task_id: TASK-20260923-242cd0
  archived_by: TASK-20260923-2e741f
  goal_id: GOAL-GFPN-380702
  question_id: RQ-GFPN-c01af8

  decision: revise
  decision_label: >-
    REVISE BY ADDENDUM, NOT APPROVED HERE.
    - Protocol v2 cannot evaluate HEUR-GFPN-DFLAT on its frozen primary shape
      for ANY arm, because one of its three EcGFp5-shaped rungs is not
      double-odd.
    - The remedy is a DRAFT additive addendum that adds the pre-selected
      31-bit rung (R-a). It carries one pre-declared fallback (FB-1),
      triggered only by a named solver-infrastructure condition.
    - Approval is Act 2's separate decision (reserved DEC-20260923-8b2dbf),
      reading the archived bytes.
    - Protocol v2 as approved by DEC-20260923-e788a1 is unchanged and remains
      the authority for stage 2. Stage 2 is SEQUENCED after stage 1b (ruling
      R-5).
    - The lane-claim precondition is met by a batch and queue that Act 2
      opens (ruling R-7).

  target_ids:
    - EXP-GFPN-05ff43
    - H-GFPN-9a29be
    - HEUR-GFPN-DFLAT
    - GOAL-GFPN-380702
    - AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
    - AMD-EXP-GFPN-05ff43-20260923-rung31
    - TASK-20260923-cd932c
    - TASK-20260923-0fa03f
    - CORR-20260923-52e096
    - CORR-20260923-6b3df2
    - CORR-20260923-6d8879

  user_authorization: >-
    The AGENTS.md standing user authorization of 2026-09-06 covers designing
    and running this experiment, recorded under /coordinate
    GOAL-GFPN-380702 (user, 2026-09-23, goal mode). This decision uses it only
    to design. It approves no protocol. Protocol readiness is certified by the
    separate approval act.

  context: >-
    - DEC-20260923-e788a1 approved protocol v2 of EXP-GFPN-05ff43 with
      conditions AC-1 to AC-6.
    - Stage 1 of TASK-20260923-cd932c wrote implementation-v2/ (12 files),
      implementation-v2.md and trial-plan-v2.json. The dispatching session
      committed them in filing commit 689716be5. No run package exists.
    - The stage-1 note raises KI-1 (implementation-v2.md lines 360-377): the
      ecgfp5_shaped curve at p' = 16777291 has b a square in F_q, so arm iii'
      refuses there. It also reports that no lane could be claimed (section
      10).
    - The phase-A archive card TASK-20260923-0fa03f was reserved by
      DEC-20260923-e788a1 but not written.
    - Stage 2 cannot start until these are ruled.

  # --------------------------------------------------------------------------
  # (a) THE DISPATCHING SESSION'S FACTS F1-F8: CONFIRMED OR REFUTED
  # --------------------------------------------------------------------------
  facts_checked:
    F1:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES, from experiments/EXP-GFPN-05ff43/implementation/ladder.json (read
        in full):
        - Five rungs.
        - ecgfp5_shaped c values 63, 84, 223, 59 and 372, with cofactors
          2, 2, 2, 4 and 2.
        - b_is_square_in_Fq false, false, false, TRUE (line 350) and false.
        - 65551 has role anchor_only (line 327). 1073741831 has role
          "ladder" (line 549).
        - Every random_2torsion curve has cofactor 2 and b non-square.
        The anchor: implementation-v2.md line 201 builds it "on the archived
        anchor curve (random_no2torsion)". The v1 anchor RUN-GFPN-61bba9
        manifest records curve_shape random_no2torsion (lines 66 and 112).
        The v2 code body of cmd_anchor_identity past its p = 16777291 line
        (v2_driver.py line 631) was not read.
      addition: >-
        random_no2torsion at 1073741831 has cofactor 3 (ladder.json line
        533). It is still a valid "without rational 2-torsion" control.
    F2:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES, by hand; nothing was run.
        - Order mod 4, from the recorded orders' last two digits: ...626,
          ...166, ...298, ...172 and ...022, giving 2, 2, 2, 0 and 2.
        - The Legendre class of N(cz) = c^5 * cmod, which is that of
          c * cmod, by quadratic reciprocity:
          - 4111: (7|p') = -1 and (2|p') = +1, so NON-square;
          - 262151: (7|p') = -1, so NON-square;
          - 65551: (223|p') = -1 and (2|p') = +1, so NON-square;
          - 16777291: (59|p') = -1 and (2|p') = -1, so SQUARE;
          - 1073741831: (3|p') = +1, (31|p') = -1 and (2|p') = +1, so
            NON-square.
        The 16777291 steps are written out in CORR-20260923-52e096 reason
        (3).
      precision_note: >-
        "b square iff N(b) square" holds for every finite extension, because
        N(b)^{(p'-1)/2} = b^{(q-1)/2} and the norm is onto. Odd degree is what
        DC-3 needs for a DIFFERENT step: a non-square beta in F_{p'} stays a
        non-square in F_q. This does not change F2's conclusion.
    F3:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES:
        - specification.yaml lines 99-103;
        - Pornin paper_fulltext.md lines 871-874 (the double-odd condition)
          and lines 857-869 (EcGFp5's search accepts only "order 2n with n
          prime");
        - implementation.md lines 235-247, where the table lists cofactor 4
          without a flag and line 242 claims the 12-bit floor.
      ruling_on_the_parenthetical: see rulings.R-2
    F4:
      verdict: CONFIRMED, with one nuance
      verified_by_this_act: >-
        YES:
        - 404bf9 review-report.yaml lines 97-100 ("... for all three
          ecgfp5_shaped rungs");
        - CORR-20260923-064d0d lines 69-73;
        - the approved amendment lines 511-522;
        - validator 58953e review-report.yaml lines 858-860, which asserts
          b non-square at 4111 only, correctly.
      nuance: >-
        DEC-20260923-e788a1 does not restate the false premise in its own
        words. It approved the amendment that carries it, and it scoped the
        approval to "EcGFp5-SHAPED toy curves at ladder primes 4111, 262151
        and 16777291" (lines 426-431). Its section-8 audit names no b-square
        primary-shape curve.
      addition: >-
        The same false population statement is in v1's scope records:
        - EV-GFPN-fc5950 boundaries line 352 ("EcGFp5-SHAPED double-odd ... at
          p' in {4111, 262151, 16777291}");
        - DEC-20260923-d86ff2 limitations line 364.
        Both are corrected by CORR-20260923-6b3df2.
    F5:
      verdict: CONFIRMED, AND UNDERSTATED
      verified_by_this_act: >-
        Read, not executed:
        - implementation-v2.md lines 367-372 and DN-7 (line 430);
        - trial-plan-v2.json RUN-GFPN-3be8a4 expected_refusal entries (lines
          1406 and 1415).
      understatement: >-
        KI-1 frames the consequence as arm iii' only. Under ruling R-2 the
        c = 59 curve is not a primary-shape curve for ANY arm. S5 and
        torsion_S5_norm also have only two primary-shape rungs (span 6). So
        under v2 as approved, HEUR-GFPN-DFLAT is not evaluable on the primary
        shape for every arm, not only for arm iii'. Any v2 figure for those
        arms that uses the c = 59 rows would mix two populations.
    F6:
      verdict: CONFIRMED
      verified_by_this_act: >-
        YES:
        - specification lines 90-98 ("2^30 if FGLM completes");
        - implementation.md lines 245-247;
        - DEC-20260923-e788a1 lines 148-156 (F-1 expectations: D(rq) = 16
          against 64 at n = m = 3);
        - implementation-v2.md lines 465-467, which cite v1 D-3 on segfaults
          at about 2^16 to 2^18;
        - ladder.json line 327.
        No v2 measurement exists. There is no run record at a 31-bit
        characteristic. The only evidence is v1 development notes on a
        two-variable toy system at 1073741827, on the v1 host
        (implementation.md lines 155-166). Nothing covers p' = 1073741831 or
        any n = 5 system at 31 bits.
      agreement: >-
        Choosing the rung now is not outcome-dependent, for arm iii' or for
        any other arm. No m = 5 degree has been measured for any arm at any
        prime. v1's only m = 5 attempts, at 4111, exhausted memory
        (EV-GFPN-fc5950).
    F7:
      verdict: CONFIRMED, with one correction of detail
      verified_by_this_act: >-
        YES:
        - trial-plan-v2.json: package_ceiling 48 and package_count 31 (lines
          15-17); 4 contingency ids (lines 1741-1780);
        - v2_run_wrapper.py W-2 (lines 10 and 92-98);
        - v2_make_trial_plan.py PRIMES (line 19);
        - v2_driver.py line 899.
      correction_of_detail: >-
        v2_driver.py line 899 is the known-scalar recheck loop inside
        cmd_controls. It is not the ladder loop.
        - cmd_build (line 935) and cmd_cells (line 1016) take --p from their
          arguments and read their package from the plan through
          v2_common.PLAN_PATH, a module constant (v2_common.py line 32). DN-8
          redirected the plan, ladder and runs to scratch. An additive driver
          may therefore be able to reuse them. Stage 1b establishes this.
        - v2_common.TASK_ID is hard-coded to TASK-20260923-cd932c (line 46).
          Stage 1b must keep it out of addendum manifests (addendum A1-7 (3)).
        F7's conclusion stands: any added rung needs additive code and plan
        in new paths, written by the executor and archived before it runs.
    F8:
      verdict: CONFIRMED WHERE CHECKABLE
      verified_by_this_act: >-
        PARTLY:
        - goal.yaml lines 46-52: current_batch_id null and dispatch_queue_path
          null;
        - the BATCH-ba0b0d queue schema, crypto.autoresearch.dispatch_queue.v1;
        - docs/concurrent-goal-lanes.md: claims only on `queued` tasks, and
          claim files under the queue directory's claims/.
      not_verified: >-
        This act did not run the following (no shell):
        - the output of `goal_lanes.py lanes`;
        - the bus inbox;
        - validate_dispatch_reference.py's exit status on the precedent;
        - CI's behaviour.
        They are the dispatching session's report.

  # --------------------------------------------------------------------------
  # RULINGS
  # --------------------------------------------------------------------------
  rulings:
    R-1_KI-1_is_real:
      text: >-
        KI-1 is a real protocol defect. It was found before any run. The
        approved construction behaves correctly at 16777291: it refuses, as
        R-6 requires. The defect is in the ladder the protocol pairs it with,
        not in the construction. Corrections CORR-20260923-52e096 (the
        propagated premise) and CORR-20260923-6b3df2 (v1 population label and
        scope) record it.

    R-2_reading_of_the_primary_shape:
      text: >-
        specification.yaml lines 100-103 read "EcGFp5-shaped double-odd
        y^2 = x(x^2 + 2x + c z) with c chosen so the group order is 2 · prime
        (or 2 · nearly-prime with recorded cofactor)". The head term
        "double-odd" CONTROLS. The parenthetical relaxes primality of the ODD
        part: a small odd cofactor is allowed if recorded. It does not admit
        an even part.
        Three reasons:
        (1) An even "nearly-prime" would contradict "double-odd", order 2n
            with n odd (Pornin lines 871-874), in the same sentence.
        (2) Pornin's EcGFp5 search accepts only order 2n with n prime (lines
            857-869). "EcGFp5-shaped" means shaped like that selection.
        (3) The DC-3 construction and FHJRV's reason for needing it (b a
            non-square) are stated for double-odd curves. The protocol's own
            mechanism is defined on that population.
        The c = 59 curve (order 4 * prime, b a square) is therefore OUTSIDE
        the primary shape. It is an EcGFp5-MODEL curve and a legitimate
        nearby object.

    R-3_remedy:
      chosen: >-
        R-a, extended to the full per-prime cell set, with pre-declared
        fallback FB-1. It is written as the DRAFT addendum
        experiments/EXP-GFPN-05ff43/amendments/v2_addendum_rung31.yaml
        (AMD-EXP-GFPN-05ff43-20260923-rung31).
        - It ADDS the frozen ladder's 31-bit rung, p' = 1073741831, with its
          three recorded curves (EcGFp5-shaped c = 372: order 2 * prime,
          b non-square, double-odd).
        - At that rung it runs exactly the cell set v2 runs at every ladder
          prime: torsion_S5_rq, S5, S5_rescaled, torsion_S5_norm, raw
          (m = 5 not_attempted, m = 4 run), the matched controls, and the
          m = 4 fallbacks.
        - It adds a blocking controls_a1 package and an aggregate_a1.
        - That is 11 packages, 42 of 48 in total.
        - HEUR-GFPN-DFLAT on the primary shape is evaluated on
          {4111, 262151, 1073741831} (13, 19 and 31 bits; span 18). On the
          controls it is evaluated over every eligible triple of the four
          rungs.
        - The 16777291 c = 59 rows stay recorded and are labelled off-shape.
      why_the_full_cell_set_and_not_arm_iii_prime_alone: >-
        (1) Under R-2 the 25-bit rung is lost for EVERY arm on the primary
            shape (F5 understatement). Adding only arm iii' and S5_rescaled
            would repair one arm and leave S5 and the norm control
            unevaluable.
        (2) R-9 requires the matched controls "at EVERY ladder prime for every
            arm it names". A new rung carries them.
        (3) Like-for-like needs every arm on the same targets at the same
            prime (DC-3 quantifier order; R-7).
        (4) Packages group arms by (p', shape, m), so the package count is
            the same (11) either way. The extra cost is compute time only.
            That is advisory for an ECC goal (CLAUDE.md rule 11).
      options_weighed:
        R-a_31_bit_rung:
          verdict: ADOPTED as the primary branch
          for: >-
            - The rung and curve were selected by v1, deterministically,
              BEFORE ANY MEASUREMENT, and are recorded in the frozen
              ladder.json with role "ladder" (line 549).
            - The curve is inside the primary shape (order 2 * prime,
              b non-square).
            - The frozen toy_ladder rule names this candidate ("2^30 if FGLM
              completes", specification lines 90-98).
            - It adds no new selection degree of freedom.
            - The span rises from 12 to 18 bits.
            - Every v2 package at 4111, 262151 and 16777291 runs unchanged,
              so like-for-like on the controls is preserved at 25 bits.
            - It is purely additive: implementation-v2/ stays frozen.
            - It fits the 48 ceiling.
          against: >-
            - There is no run record at a 31-bit characteristic (F6). The
              only evidence is v1 development notes on a two-variable toy
              system at 1073741827, on the v1 host (implementation.md lines
              155-166). Nothing covers p' = 1073741831 or any n = 5 system at
              31 bits. This is answered by development check A1-7 (b),
              control A1-2 (d) and FB-1.
            - Heavier compute: a fourth S5-sized build.
            - v1 judged the rung not worth using for its arms (implementation.md
              lines 245-247). That was a v1 cost judgement, not a measurement
              at 31 bits. The rq arm is about 10x sparser at m = 5 (at most
              1287 + 792 monomials against 20349; EV-GFPN-fc5950 line 359).
        R-b_new_25_bit_curve:
          verdict: >-
            NOT ADOPTED as the primary branch. KEPT as fallback FB-1, which is
            triggered only by the solver-infrastructure condition of the
            addendum's A1-9.
          for: >-
            msolve is known to run at 25 bits on this pipeline (the anchor,
            v1 m <= 4 cells). The curve-selection rule can be made
            deterministic.
          against: >-
            - It needs a new curve selection outside the frozen ladder.
            - It puts two EcGFp5-model curves at one prime: v2's c = 59 rows
              still run.
            - The primary-shape span stays at exactly the 12-bit floor, with
              no margin.
            - The v2 plan's own 25-bit primary-shape rows cannot be replaced
              without editing frozen v2 bytes.
        R-c_accept_as_is:
          verdict: REJECTED
          why: >-
            It would knowingly run a 48-package protocol that cannot evaluate,
            on its primary shape and for any arm, the heuristic that decides
            goal criterion C1's measured side and KN-OPEN-9b4a2b's flatness
            question. The defect is known and fixable before any run.
            Accepting it would steer away from a decidable question for no
            recorded reason (AGENTS.md "Research-direction integrity").
        R-d_edit_the_v2_ladder_or_plan:
          verdict: REJECTED
          why: >-
            It edits frozen, soon-to-be-archived bytes (AC-2, AC-3), and would
            need v2 to be re-approved. Dropping the c = 59 cells from
            trial-plan-v2.json is rejected for the same reason. Their rows are
            also useful nearby-object data.
      implementation_v2_itself_unchanged: >-
        The remedy is ADDITIVE. Nothing under implementation-v2/, and neither
        implementation-v2.md nor trial-plan-v2.json, needs to change.
        TASK-20260923-0fa03f is therefore written by this act, and phase A may
        proceed. If stage 1b finds that the addendum cannot be built without
        editing a v2 file, it stops and returns (addendum A1-7 (1)). That
        would be a new decision, and phase A's binding would stand.

    R-4_labelling_of_the_c59_rows:
      text: >-
        As in the addendum's A1-4. Every v2 row on (16777291, ecgfp5_shaped)
        is read as `off_shape_non_double_odd`. That covers RUN-GFPN-3db273's
        ecgfp5_shaped rows, all of RUN-GFPN-3be8a4 and RUN-GFPN-36cad2, the
        (16777291, ecgfp5_shaped) known-scalar row of RUN-GFPN-b231c1 (still
        a valid gate check), and every RUN-GFPN-8f86cc figure that uses them.
        They run as planned and stay recorded. They are never primary-shape
        rows. They enter no primary-shape HEUR-GFPN-DFLAT set, T-1, T-2, T-3,
        F1, F1', F4 comparison or B-3 band. The b-square refusals there are
        construction-precondition refusals, never evidence about D. The rows
        may be reported in a separately headed descriptive section.
        v1 rows are labelled the same way by CORR-20260923-6b3df2.
        THIS RULING BINDS READING WHETHER OR NOT THE ADDENDUM IS APPROVED.
        It follows from R-2 and the frozen specification, not from the
        addendum. If the addendum is not approved, the primary-shape verdicts
        of v2 are not_applicable for every arm, and the evidence review says
        so.

    R-5_sequencing:
      text: >-
        Normative, as in the addendum's A1-8.
        (1) Phase A of TASK-20260923-0fa03f. It may run as soon as this act's
            archive TASK-20260923-2e741f is verified. It does not depend on
            Act 2.
        (2) Act 2 approval or disposition (DEC-20260923-8b2dbf), archived by
            TASK-20260923-58a958.
        (3) Stage 1b (TASK-20260923-4c64b5): implementation plus development
            checks, no run package.
        (4) Phase A of TASK-20260923-4ff597.
        (5) Stage 2 of TASK-20260923-cd932c, running the v2 plan unchanged.
        (6) Phase B of TASK-20260923-0fa03f.
        (7) Stage 2b (TASK-20260923-6c7f55), running the addendum packages.
        (8) Phase B of TASK-20260923-4ff597.
        (9) Review plan first, then independent review.
        Every archive runs alone. Steps (3), (5) and (7) never overlap each
        other, or any other solver on the host (EC-10; AC-6), and each runs
        under a claimed lane (R-7).
      why_stage_1b_first: >-
        - The whole v2-a1 run set is then fixed and archived before any v2
          measurement exists.
        - The stage-1b executor sees no v2 outcome.
        - Stage 1b's solver-running development check cannot overlap stage 2.
        COST, stated plainly: the v2 fixture gate is delayed by one
        implementation task. If the gate later fails, stage 1b's effort was
        spent for nothing. This is accepted, because a late addendum written
        after v2 outcomes exist would be weaker evidence.
      if_act_2_does_not_approve: >-
        Stage 2 waits for the Coordinator's disposition. That disposition
        either names a successor remedy, or records that v2 runs alone under
        R-4 with every primary-shape verdict not_applicable, and gives the
        reason. Stage 2 does not start by default.
      if_stage_1b_triggers_FB-1_or_stops: >-
        On FB-1, stage 1b writes the FB-1 plan (A1-9) and sequencing is
        unchanged. If stage 1b stops because the addendum cannot be built
        additively, stage 2 waits for a new Coordinator decision.

    R-6_addendum_aggregate_vs_v2_aggregate:
      text: >-
        As in the addendum's A1-5. The v2 aggregate RUN-GFPN-8f86cc runs as
        planned and is the as-planned record. aggregate_a1 is a separate
        package. It reads the phase-B-archived v2 packages and the addendum
        packages read-only, and it never edits or supersedes a v2 manifest.
        It emits:
        - the primary-shape reading over {4111, 262151, 1073741831};
        - the control reading over all eligible triples;
        - an off-shape descriptive section;
        - a reconciliation table that reproduces every v2 aggregate figure
          and marks the figures that use off-shape rows.
        The evidence review reads the primary-shape and control verdicts from
        aggregate_a1, and cites RUN-GFPN-8f86cc as the as-planned record.

    R-7_DP-3_and_AC-6_lane_claims:
      text: >-
        (1) Act 2 OPENS BATCH-6b1c29. It writes
            coordination/goals/GOAL-GFPN-380702/batches/BATCH-6b1c29/dispatch_queue.json
            (schema crypto.autoresearch.dispatch_queue.v1), plus a batch
            record if the validator needs one. The queue holds every
            remaining task of this run:
            - producers in state `queued`: TASK-20260923-4c64b5 (stage 1b);
              TASK-20260923-cd932c (stage 2 ONLY; a note records that stage 1
              ran without a claim, CORR-20260923-6d8879); and
              TASK-20260923-6c7f55 (stage 2b);
            - Coordinator archive tasks TASK-20260923-0fa03f and
              TASK-20260923-4ff597, with their phase structure, as far as the
              schema expresses it. The rest goes in notes. No committed card
              is edited to fit the queue.
            max_concurrent is 1. The basis is AC-6 and EC-10: a solver lane
            requires the machine otherwise quiet, and archives run alone.
        (2) The session that opens the batch runs
            `python3 tools/goal_lanes.py open-lane GOAL-GFPN-380702 BATCH-6b1c29
            --queue <queue path> ...`.
        (3) Before EACH producer launch, the dispatching session:
            - runs `git fetch`;
            - runs `python3 tools/goal_lanes.py lanes GOAL-GFPN-380702`;
            - runs `python3 tools/goal_lanes.py claim <queue> <TASK> --as
              executor --ttl-minutes N --publish`;
            - checks that no other solver process is on the host.
            N covers the stage's expected span. A claim that would expire
            before the stage ends is re-claimed at epoch+1 before expiry.
            Expiry is never a stop and never a result.
        (4) On return the session runs `release ... --outcome
            completed|failed|abandoned`. Each archive task is claimed as
            coordinator by the session that commits it.
        (5) Before committing the queue, the dispatching session runs
            tools/validate_dispatch_reference.py and
            tools/research_dispatch.py on it. A queue that fails is not
            committed.
        (6) FALLBACK, ONLY if no queue that passes can be written:
            DEC-20260923-f11b13 (reserved) records a substitute before any
            launch. Before each launch, the task receipt records:
            - the `goal_lanes.py lanes` output;
            - the bus inbox for the coordinator and executor addresses;
            - a host scan for solver processes;
            - an agent_bus message to `coordinator` naming the task and its
              expected span. The message is a pointer, never a permission.
            That decision discloses the substitute as a deviation from AC-6.
            It is never silent.
      stage_1_claimless_launch: >-
        Stage 1's claim-less launch is a DISCLOSED DEVIATION, recorded by
        CORR-20260923-6d8879. Its root cause is the Coordinator's:
        DEC-20260923-e788a1 AC-6 required a claim but supplied no queue. The
        deviation is not waived by the outcome. The stage-1 bytes are not
        invalidated by it. Their standing is decided by phase A's binding and
