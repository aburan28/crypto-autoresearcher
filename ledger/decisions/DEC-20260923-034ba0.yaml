  rationale:
    - >-
      DECIDED BEFORE ANY OUTCOME. No v2 run package exists, and no m = 5
      degree has been measured for any arm anywhere. The remedy is chosen on
      curve-membership facts that are checkable from frozen data. The added
      rung was fixed by v1 before any measurement. No measured value
      influenced this choice.
    - >-
      THE DEFECT IS BROADER THAN REPORTED, AND THE REMEDY MATCHES ITS
      BREADTH. Under the frozen primary-shape definition, v2's ladder has two
      conforming EcGFp5-shaped rungs, not three, for every arm. Adding one
      conforming rung with the full v2 cell set restores the 3-prime / 12-bit
      rule for every arm. It also leaves every v2 package, threshold and
      control as approved.
    - >-
      THE CONSTRUCTION WAS RIGHT; ITS STATED DOMAIN WAS WRONG. DC-3 requires
      b to be a non-square. The code refuses correctly on a b-square curve.
      The error was a propagated description of the ladder, which appeared in
      four records (CORR-20260923-52e096). Correcting the description and
      adding a conforming rung is proportionate. Changing the construction
      would not be.
    - >-
      THE BIAS IS TOWARD THE DECIDABLE QUESTION. The goal's measured side of
      C1, and KN-OPEN-9b4a2b, ask whether the quotient's D is flat across
      three or more primes spanning 12 or more bits on the primary shape.
      R-c would guarantee that this question stays unanswered. R-a makes it
      answerable, subject to the solver completing. A timeout or OOM remains
      not_measured and never a result.
    - >-
      PROCESS DEFECTS ARE RECORDED, NOT ABSORBED. The claim-less stage 1
      launch and the missing queue are the Coordinator's own defect. They are
      recorded as such, and the fix is structural: a queue now, before any
      further launch.

