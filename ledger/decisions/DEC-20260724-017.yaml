coordinator_decision:
  id: DEC-20260724-017
  context: >-
    GOAL-MLKEM-002 BATCH-002 execution, independent validation, and independent
    red team of EXP-MLKEM-005 (library-facing adequacy probe and
    preflight-or-widen second peer) under Cursor Grok after verified
    run-package snapshot 63e7467.
  decision: supported_scoped
  target_ids:
    - H-MLKEM-005
    - EXP-MLKEM-005
    - GOAL-MLKEM-002
  outcome_classification_adjudication:
    executor_reported: isolated_to_audited_commits
    official: isolated_to_audited_commits
    criterion_used: widened_optimized_compare
    authority: >-
      Validator accepted the package with qualifications and confirmed the
      class under frozen EXP-005 precedence; red team left the class standing
      while revising what it licenses (RT-20260724-004, verdict revise).
  rationale:
    - >-
      The run package is admissible (accept_with_qualifications, 76/76 hash
      match to snapshot 63e7467, exact argv commands, terminal four-run gate
      passed).
    - >-
      Under frozen EXP-MLKEM-005 precedence, isolated_to_audited_commits is the
      unique matching class when criterion_used=widened_optimized_compare is
      bound. Strict fixed-bound neighborhood remained empty; PQClean avx2 was
      measured as the widened peer; known defect retained; no new silent/accept
      outside known defects on measured targets.
    - >-
      Red-team scope limits are binding and are adopted as official
      interpretation: CTRL-LIBRARY-FACING-ADEQUACY remains a SO-local
      construction tautology off the audited-library compare path
      (OBJ-RT005-001); the class must not be paraphrased as H-MLKEM-004 support
      or as satisfying GOAL completion criterion 2 (OBJ-RT005-002); the PQClean
      peer asks a different mechanism question than fixed-bound tails
      (OBJ-RT005-004); claim_tier stays laboratory_implementation_conformance
      (OBJ-RT005-005).
    - >-
      H-MLKEM-005 is supported only within the laboratory /
      widened_optimized_compare boundary stated in EV-MLKEM-008. GOAL-MLKEM-002
      remains active: completion criteria are not met.
  evidence_refs:
    - EV-MLKEM-008
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-928/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/red_team_report.yaml
    - experiments/EXP-MLKEM-005/execution-report.yaml
  limitations:
    - No attack, oracle, exploitation path, or key recovery was built, and none is authorized.
    - Nothing here bears on MLWE hardness or passive ML-KEM security.
    - No release is approved and no library is characterized as systemically clean outside the measured laboratory scope.
    - Instrument adequacy against real library entry points was not demonstrated.
    - Isolation under the strict fixed-bound-tail mechanism class was not tested.
  hypothesis_status_record:
    H-MLKEM-005: supported_within_laboratory_boundary_widened_criterion
    prior_status: specified
    note: >-
      File ledger/hypotheses/H-MLKEM-005.yaml is not rewritten in this ledger
      archive because BATCH-002 design ownership remains with
      TASK-20260724-924; this decision is the official status binding.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Red team and Coordinator agree: objections are scoped licensing and
      instrument-adequacy qualifications that drive the next batch, not a new
      reusable corpus entry beyond KN-TECH-054 / KN-FIND-001.
  next_actions:
    - >-
      Open BATCH-003 to either (1) specify and run a protocol that interposes a
      defective comparator onto real wolfSSL/PQClean compare/decap entry points
      and re-asks isolation with a fixed-bound peer if one becomes reachable, or
      (2) explicitly rewrite GOAL-MLKEM-002 completion criterion 2 with recorded
      rationale retiring the fixed-bound neighborhood requirement after two
      empty-neighborhood batches — without paraphrasing EV-MLKEM-008 as
      H-MLKEM-004 support or crypto-scale evidence (EV-MLKEM-008,
      OBJ-RT005-001..005).
  decided_by: coordinator
  decided_at: '2026-07-24'
