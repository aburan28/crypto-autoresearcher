  # ==================================================================
  # (F) THE REMAINING REVIEW FINDINGS, EACH DISPOSED
  # ==================================================================
  adjudication_F_remaining_findings:
    - finding: V-B4-03 / RT4-C2 (A-4)
      disposition: >-
        SUSTAINED AND ADOPTED. See adjudication C. Clause (a) is one weak comparison;
        the null does not exercise Karatsuba on the new grid; alpha_null moved
        +0.0746 between grids and most of the gap shrinkage came from the null.
        A successor contract wanting an interpretable FC-4-NEW needs a null whose
        polynomial degrees track ell rather than being pinned at 2.
    - finding: V-B4-05
      disposition: >-
        SUSTAINED. NULL-B2 is identically -infinity (Validator replicated 40 of 40),
        so the union-span reading of S3's void criterion is VACUOUS - any finite
        observed LLR lies inside [-inf, ~16164]. The run's verdict matrix gives a
        reading that cannot fail to fire equal billing with one that carries
        information. A superseding contract must define "not separated from both"
        unambiguously and handle a degenerate null arm explicitly.
    - finding: V-B4-06
      disposition: >-
        SUSTAINED AND MADE BINDING. PH3 "MET - S3 prefers M1" MUST NOT BE READ AS
        SUPPORT FOR M1. The observed LLR 14508.90743042935 lies BELOW the M1-truth
        null range; by absolute fit M2 is about five times better and both models are
        rejected at MC p = 1/10001; NULL-A selects the same model on an object with
        no arithmetic content. S3 discriminates nothing and falsification criterion
        (b) correctly does not fire. Becomes SP-18.
    - finding: V-B4-07
      disposition: >-
        SUSTAINED, AND THE VALIDATOR'S EXTRA WORK IS CREDITED. The INVALID label on
        the two secondary signals was the contract's rule correctly applied - adding
        a null after seeing a number would itself have been a violation, and the
        Executor was right to decline. THE VALIDATOR THEN BUILT THE MISSING NULLS
        from the run's own committed NULL-A samples and showed the label is
        SUBSTANTIVELY right as well: prime-rate excess +0.118623 real against
        +0.115590 null (reproducing to within 3 per cent), chi-square 18713.0765 real
        against 14557.9785 null at ell = 11 on the same degrees of freedom. HAD A
        NULL BEEN PRE-REGISTERED, BOTH SIGNALS WOULD HAVE BEEN VOID. Becomes SP-17.
        The null figures are the Validator's own supplementary measurements and are
        NOT run evidence (SP-5).
    - finding: V-B4-08
      disposition: >-
        SUSTAINED AND CORRECTED. Blog extract V2 is characterised as "A SINGLE
        INSTANCE"; the sentence immediately preceding it in the source says
        "AVERAGING OVER 5000 pseudo-random supersingular j-invariants". The direction
        is CONSERVATIVE - the datum is stronger than the report allows - but the
        verbatim extract was truncated in a way that drops a meaning-changing
        qualifier. Recorded as EV-PEC-7d8de9 CORR-B4-4. No number moves.
    - finding: V-B4-09
      disposition: >-
        SUSTAINED. R-1's variance-aware repair is demonstrated only on the W-ALL and
        W-MID windows where the fixed 0.75-bit tolerance was already generous, not on
        the 8-point W-TOP arm whose verdict V-1 called uninterpretable. SL4 met 10/10
        is a true statement about ten points and is NOT evidence that the gate of
        record had resolving power where it was questioned. Any citation of
        NC2b-G1-VAR must name its windows.
    - finding: "V-B4-10 / SP-1"
      disposition: >-
        NO BREACH. The collision is between a charging correction Delta IN BITS
        (0.8676515815362557, this run's own Dickman comparator) and a dimensionless
        forbidden value of c; different quantity, different unit, different
        provenance. Two of the three literal occurrences are digit coincidences in
        unrelated synthetic quantities and the third cites RT3-C1's figure inside an
        explicitly labelled comparator block - AND THE FROZEN CONTRACT ITSELF QUOTES
        IT in relation_to_prior_work R-3. The Validator's independent occurrence
        recount reproduces the run's own table exactly. RESIDUAL HAZARD RECORDED, NOT
        A BREACH: any record quoting that column must carry its unit.
    - finding: "A-2 and A-3"
      disposition: >-
        CONFIRMED AS CONTRADICTING STATED EXPECTATIONS WITHOUT UNDERMINING THE
        INSTRUMENT, which is the distinction that matters. A-2: the variance-aware
        tolerance is NARROWER than 0.75 at all ten points (T in [0.250000,
        0.336667]), contradicting an expectation in the contract's non-claims because
        V-1's large half-widths belong to a window the contract's own scoping
        excludes. A-3: exact Delta exceeds Dickman Delta by 0.056870 to 0.217111 bits
        over 72 matched pairs, contradicting an anticipation that came from comparing
        a Dickman value at the OPERATING POINT with exact values at the small ANCHORS
        - a cross-parameter comparison read as a matched one. The comparator
        reproduces the committed implementation to 3.2e-14 bits and its own residual
        bias against the exact rho(2) is 2.51e-3 bits, two orders of magnitude below
        the effect. DIRECTION RECORDED: at operating points the Dickman column likely
        UNDERSTATES an attack-favourable correction. A-1 additionally refutes RT3-C1's
        claim that psi-weighting changes Delta by under 0.001 bits; the measured
        change reaches 0.0313 bits and the run was right to check rather than assume.
    - finding: L2-WEIGHT magnitude
      disposition: >-
        RECORDED WITH ITS BAND MISS. The correction is ATTACK-FAVOURABLE at all 80
        exact points (min 0.3582, max 0.7838 bits) with L2-ANCHOR independently
        re-derived by two different algorithms and both smooth counts EXACT. The
        contract predicted 0.60 to 1.00 bits and THE MEASURED MINIMUM IS BELOW THE
        BAND. No downstream record may quote "0.60-1.00 bits" as confirmed.
    - finding: D-1 (tier stop)
      disposition: >-
        ACCEPTED AS CONTRACT-LEGAL, WITH THE REASON CRITICISED. The SUFFICIENCY rule
        makes stopping at a complete tier terminal on naming the tier; MR-16 verifies
        ZERO TIER-2 LEAKAGE into any reported number. But a 170 MB vs 100 MB per-file
        hosting limit is not a property of the mathematics, and the remedy is layout
        rather than science. Recording a packaging limit in the slot where a scope
        decision belongs reintroduces, in a different currency, the budget mechanism
        AGENTS.md retired - and unlike a budget it was never declared in advance.
        MEASURED, NOT ASSUMED: TIER-2/3 would have bought u-range 3.1699 -> about
        4.46 (13 per cent of the remaining gap, ZERO tail resolution) and X_p reach
        9 -> 15 -> 22, which is the real gain; it would NOT have repaired S4.
    - finding: D-2 (V-B4-17)
      disposition: >-
        A GENUINE CONTRACT DEFECT, correctly handled. prime_range.sampled_arm fixes
        the prime rule and the licence but NO sample size, and the contract's only
        sample size requires n_types(p), which is not computable at p ~ 2^28 by any
        method the contract provides - precisely what the sampled arm exists to
        avoid. The UNDERSPECIFICATION stopping rule applies as written and an
        Executor-chosen size could not have carried a pre-registered threshold. Two
        independent contract routes reach the same outcome. A superseding contract
        must fix the sample size in a form not depending on n_types(p).
    - finding: D-4
      disposition: >-
        CORRECT UNDER RULE 4. RUN-PEC-d7979c-a is immutable once committed, so
        writing -b was the only rule-compliant option and the alternative would have
        overwritten a committed artifact. The Executor reported the card's internal
        inconsistency rather than silently resolving it. RECORDED CONSEQUENCE: the
        frozen contract's required_artifacts.queue_declared list is now unsatisfiable
        AS LITERALLY WRITTEN - a contract-text fact, not a defect in the run.
    - finding: "V-B4-11, V-B4-12, V-B4-13, V-B4-14, V-B4-15, V-B4-16, V-B4-19"
      disposition: >-
        ACCEPTED AS RECORDED, none changing a verdict. Clause (d)'s interval type and
        level are an undeclared Executor choice but the verdict survives at every
        level tested; PH5's Clopper-Pearson intervals treat total weight as sample
        size and remain disjoint after the design correction; the feasibility
        predictor understates by ~2.15x, which is conservative for the exclusions;
        the Dickman comparator's 2.51e-3-bit bias is documented by the contract; two
        immaterial rounding slips in the k derivation move nothing; a gitignored
        __pycache__ has no integrity impact; clause (b)'s 0.032 per cent miss is
        recorded in both directions.
    - finding: V-B4-18
      disposition: >-
        RECORDED AS A POSITIVE FINDING. Inventor-protocol Pareto honesty is
        satisfied by the bibliographic package: dominated_by names an actually
        retrieved row and is not null, eight frontier rows carry per-row
        "checked_how", one row is declared UNCHECKED rather than dismissed, and
        sota_delta is quantitative. An unchecked null would have been a rule-9
        fabrication and it is not one here.

  # ==================================================================
  # (G) THE RULING ON k
  # ==================================================================
  adjudication_G_baseline_constant_k:
    ruling: >-
      k IS ADOPTED AS A STRUCTURAL FACT AND A DIRECTION. IT IS NOT ADOPTED AS A
      NUMBER INTO ANY MARGIN ROW.
    what_is_adopted: >-
      (1) k EXISTS AND IS CITED. The retrieved law #(F_p muls.) = c * sqrt(p) *
      log_2 p with 0.75 <= c <= 1.05 is attributed to standard Delfs-Galbraith, not
      to SuperSolver - the load-bearing "Using Solver" attribution was confirmed
      verbatim by the Validator's own re-fetch on a dedicated pass. RT-S2's reason
      (iv) is HALF DISCHARGED: k is quantified from a stated law with a labelled
      interval and a named dominating row, while [15] and [3] full texts remain
      unfetched after four batches.
      (2) k IS p-DEPENDENT (CORR-B). log2 k(768) - log2 k(256) = log2(3) =
      1.584962500721156 bits EXACTLY. The campaign's repeated phrase "k shifts every
      margin row by the same amount" is FALSE for rows A and B and only
      approximately true for row C, which is itself ESTIMATED with rigorous_support
      NONE. THE ERROR WAS THIS ROLE'S, in the BATCH-004 queue objective and in
      session prose, and the Red Team concedes the same against its own RT-S2
      wording.
      (3) THE BASELINE TERM'S SIGN IS PRO-ATTACK, and this is conceded against
      expectation: charging a Delfs-Galbraith step one F_{p^2}-operation was an error
      in the BASELINE's favour worth log2 k in [6.0000, 6.4854] bits at
      log2 p = 256, which does not merely partially cancel RT-C1's anti-attack
      asymmetry but exceeds the SuperSolver correction it was expected to be
      cancelled by.
      (4) lambda = 4096/1897 = 2.1592 IS ADOPTED as retrieved from the report's own
      V2 extract, and with it the NC2f CROSS-CHECK CLOSES FAVOURABLY at zero
      compute: 2^4.432 to 2^4.918 per DG step at p ~ 2^40 by the c-law, or 2^5.047 by
      scaling V2's directly measured per-node cost, against a PRE-REGISTERED 2^5..2^7
      band. The band is if anything slightly HIGH. Caveat carried: Solver's walk is
      Phi_2 root-finding, not Velu, and RT3-C9 named that gap - indicative, not an
      identity.
    what_is_not_adopted_and_why: >-
      NO MARGIN ROW MAY INCORPORATE log2 k AS A NUMBER. Four independent reasons,
      each sufficient on its own:
      (i) IT WIDENS THE INTERVAL, AND WIDTH IS WHAT THE CRITERION TURNS ON. Applied
      only where HZ-2 permits, [8.3498, 22.2927] becomes [14.3498, 28.7781] (row A,
      width 14.4283) or [10.1019, 27.1932] (row B, width 17.0913) against a 2.2309-bit
      criterion - a WIDENING OF 0.49 TO 3.15 BITS. What improves is the SIGN, and the
      criterion does not turn on sign.
      (ii) HZ-1 IS UNRESOLVED AND THE DOUBLE-COUNTING IS PARTIAL. At lambda = 2.1592,
      RT2-C7's 5-7 bits per step converts to 3.89-5.89 bits against row A's
      6.00-6.49: OVERLAPPING, NOT SUBSUMED. "Adopt k and record RT2-C7 as SUBSUMED"
      is premature by 0.6 to 2.1 bits, and adding both would double-count.
      (iii) PROVENANCE IS INSUFFICIENT FOR ADOPTION. A non-peer-reviewed blog post is
      the sole source of a load-bearing constant for a CRYPTO 2022 paper. The
      producer flags this at every point of use, which is the right handling FOR A
      PROPOSAL and is not sufficient for adoption into a margin row. HZ-3 (mu = 3
      against 4, 0.415 bits) and HZ-4 (squarings, 0.14-0.38 bits) sit inside the
      bracket width and must be stated, not silent.
      (iv) k HAS NO ESTABLISHED LOWER BOUND. WayFinder (ePrint 2026/1219) dominates
      the baseline row and its constants were not retrieved, so k is an UPPER BOUND
      and the reported 1.75-bit floor is not a floor. The partial bound the Red Team
      supplies - a sign flip needs the best-known baseline to be more than 64 to 89.6
      times faster than plain DG at 256 bits, where SuperSolver reaches 7.62 to 9.33
      - is what makes the SIGN claim defensible and is not in the producer's report.
    the_adopted_citable_form: >-
      A CORRECTED MARGIN IS QUOTED ONLY AS A PAIR - (baseline term, attack term) -
      WITH BOTH CHARGED AT MEASURED COST, AND NEVER AS A SINGLE NUMBER, until HZ-1
      is resolved and the provenance is upgraded. This is the Red Team's own cheapest
      control and it is adopted verbatim as SP-16.
    pkg_bib_verdict_accepted: >-
      `incomplete`, as the Validator returned it. The PRIMARY deliverable - an
      instantiated, interval-valued, cited, p-dependent k - is sound and was
      recomputed exactly; the two content defects (V-B4-02, V-B4-08) are localised,
      correctable, named and acted on. Nothing was fabricated, no obstruction was
      reported as a result, every sha256 is null with a reason, and zero digests were
      invented on a tool surface that cannot hash.
    the_fetch_obstruction_is_not_evidence: >-
      k COULD NOT BE PROMOTED FROM BLOG-CITED TO PAPER-CITED. The Validator
      reproduced HTTP 403 Cloudflare interstitials on all three eprint PDFs WITH A
      SHELL AND A BROWSER USER-AGENT, and found the Springer page contains neither
      "0.75" nor "1.05". PER AGENTS.md RULE 5 THIS OBSTRUCTION IS NOT EVIDENCE about
      anything mathematical, in either direction, and it is not a mark against the
      producer, whose diagnosis is independently confirmed. What would work: a
      JavaScript-capable browser, an institutional mirror, or the CRYPTO 2022 slide
      deck that exceeded the WebFetch size limit.
    card_error_recorded: >-
      CORR-A of the BATCH-004 queue stands and is reaffirmed: the task card named
      [3] Adj et al. as a source for the Delfs-Galbraith baseline constant, and the
      retrieval established that [3]'s stated subject is CSSI at p^{1/4}, not the DG
      p^{1/2} baseline. THE ERROR IS THIS ROLE'S, IN THE CARD.

