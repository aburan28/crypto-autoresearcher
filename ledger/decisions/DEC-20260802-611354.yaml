  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
    - >-
      THE VOID IS UPHELD BECAUSE THE CONTRACT COMPELLED IT, AND THE MECHANISM IS
      CORRECTED BECAUSE TWO INDEPENDENT REVIEWERS PROVED IT WRONG BY DIFFERENT
      ARITHMETIC. Upholding a verdict while rejecting the reason given for it is the
      only reading both reviewers' evidence supports, and collapsing the two would
      have been the convenient error in either direction: crediting NULL-A with work
      it could not do, or reopening a statistic that had no power.
    - >-
      RT-H3 REOPENS BECAUSE A TEST WITH NO POWER NARROWS NOTHING. This is the
      inventor protocol's premature-closure rule applied against this programme's own
      convenience: it would have been cheaper to record the ell = 2 lane as probed
      and closed, and that record would have been false. The symmetric error is also
      refused - the shortfall below the artifact floor is NOT evidence of a parity
      deficit, because the comparison is uncontrolled in that direction too.
    - >-
      S1 IS RECLASSIFIED BECAUSE THE DATA DISCRIMINATE CLEANLY BETWEEN THE TWO
      EXPLANATIONS. Total variation decaying to a noise floor against one reference
      and converging to a non-zero limit against another is not ambiguous, and the
      288/299 coincidence with the Holm count ties the rejection to the reference
      rather than to the chain. Against that, the reported flatness is a censored
      measurement whose statistic is arithmetically pinned - so the recorded verdict
      rests on a quantity with no resolution.
    - >-
      FC-4 STANDS ON THE FROZEN CONJUNCTION AND ON MEASUREMENT, WHICH IS THE ONLY
      WAY IT COULD HAVE BEEN RETIRED. NC2d-PROPER tested above the Karatsuba
      threshold precisely so the ell in {3,5} artifact could not drive the result,
      and it still fails two clauses independently. The Red Team's objection to
      RG-CONTROL is sustained as to the REASON offered and rejected as to the
      verdict; both reviewers are right about different things and the record says so
      rather than picking a winner.
    - >-
      k IS ADOPTED AS A DIRECTION AND REFUSED AS A NUMBER BECAUSE THE ARITHMETIC RUNS
      AGAINST THE CONVENIENT READING. The dispatch framing had k resolving RT-S2's
      net sign in the attack's favour; the honest position is that only the BASELINE
      term's sign resolved, that adopting the number WIDENS the interval the
      completion criterion turns on, that RT2-C7 overlaps rather than is subsumed,
      and that a blog is the right provenance for a proposal and the wrong one for a
      margin row. Recording this as a partial acquisition rather than a resolution is
      the whole of the ruling.
    - >-
      TWO OF THE BATCH'S CORRECTIONS ARE AGAINST THIS ROLE AND ARE RECORDED AS SUCH.
      The quarantine marker asserting that a completed run produced nothing was
      written by the orchestrating session from a file listing rather than from the
      data; the "k shifts every margin row by the same amount" phrasing was this
      role's, in the batch's own queue objective. Carrying a Coordinator defect
      forward in the record that dispatches the next batch is the only mechanism that
      makes it binding, which is exactly why REM-1 and REM-2 were carried forward and
      why REM-1 is discharged here.
    - >-
      THE KNOWLEDGE PROMOTION SHIPS, AND IT SHIPS LARGER THAN SCHEDULED BECAUSE THE
      EVIDENCE FOR IT GREW. REM-1's content was fixed in advance to prevent drift,
      and it is honoured: the durable claim is the estimator lemma and the pairing
      rule, proof_status `derivation`, and NO c VALUE ENTERS THE CORPUS. What is
      added is a SECOND INSTANCE of the same family discovered by this batch - the
      self-conditioned null - plus its reference-measure companion. Two independent
      instrument defects of one family, each with a committed counterexample, is
      stronger and more useful content than one, and adding an instance is not the
      drift the fixing was meant to prevent.
    - >-
      THE CAMPAIGN CONTINUES ON RANKED MERIT AND NOT ON CAPACITY. G-2 is satisfied by
      two items this batch's own adverse findings created: a zero-compute re-decision
      that must precede any successor Heuristic 1 contract, and a reopened lane on
      the dominant residual. Four controls are declined in the same breath, one of
      them (NC2f) newly weakened by a free cross-check this batch closed - because if
      removing the cap simply enlarged every batch, the guard against unbounded drift
      would be decorative.
    - >-
      NOTHING MOVES FOR A FOURTH BATCH AND THAT IS STATED AS THE HEADLINE, NOT
      BURIED. It is not evidence the questions are unanswerable and it is not a
      reason to stop. The pattern is specific and diagnosable - three surfaces, three
      method ceilings, three instrument defects - and it names its own remedy. A
      programme that learns its measurements were miscentred has learned something
      real, and reporting that plainly is worth more than a fifth batch of confident
      numbers built on the same estimators.

