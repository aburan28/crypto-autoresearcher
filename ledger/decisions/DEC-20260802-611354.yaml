coordinator_decision:
  id: DEC-20260802-611354
  context: >-
    CLOSES GOAL-P13-001 BATCH-004, the first uncapped batch, on the two independent
    review reports VAL-20260803-cd08cd (TASK-20260802-cd08cd) and RT-20260802-44c6a2
    (TASK-20260802-44c6a2) against three producer packages snapshotted at 64238edc
    and 11b086d9 under contracts frozen at dfe285d4.
    THE BATCH DID WHAT IT WAS OPENED TO DO AND THE ANSWER IS NOT THE ONE THE BATCH
    WAS SHAPED FOR. NC-3/NC-6 - Heuristic 1's first direct confrontation with ground
    truth, carried unrun since BATCH-001 and ranked first by DEC-20260802-fa3b26 -
    executed in full. Three of its four pre-registered statistics measured THE
    INSTRUMENT rather than the object, and both reviewers converged independently,
    by different arithmetic, on the same root cause. The c-programme closeout
    executed in full and FC-4 STANDS by measurement on the pre-registered grid. The
    bibliographic subtask instantiated the baseline constant k and, in doing so,
    falsified one of its own stated absences - reopening the lane that carries the
    campaign's dominant residual.
    NOTHING MOVES, FOR A FOURTH CONSECUTIVE BATCH, and this decision says so in the
    first paragraph rather than at the end. concrete_threat_nist1 stays
    INCONCLUSIVE. H-P13-001 stays `analyzed` with no position changing state. What
    IS new is a diagnosis of this programme's measurement design, and it is worth
    more than the two headline statistics that dissolved.
    THIS DECISION ADJUDICATES EVIDENCE, SHIPS THE TWICE-DEFERRED KNOWLEDGE
    PROMOTION (REM-1), CORRECTS FIVE STATEMENTS IN THIS PROGRAMME'S OWN RECORD
    INCLUDING TWO OF THIS ROLE'S OWN, AND RULES ON CLOSURE UNDER THE SUSPENDED
    AGENTS.md RULE 13. It lifts no prohibition and promotes no claim.
  decision: revise
  decision_note: >-
    `revise` is the operative value: the CONTENT of two adjudicated positions in
    H-P13-001 is revised, one new position is added, six standing prohibitions are
    added, and the live goal checkpoint is corrected - with no status transition
    anywhere.
    WHY NOT `support`: nothing in this batch supports any position. SP-H binds
    symmetrically and both reviewers endorse it without reservation.
    WHY NOT `weaken` or `reject_scoped`: no position of H-P13-001 is weakened or
    scope-rejected. The adverse findings are about this programme's INSTRUMENTS and
    about its own prose, not about the hypothesis. Independently, `reject_scoped` is
    forbidden here on its own terms - EV-PEC-7d8de9 is strength `inconclusive`, and
    a scoped rejection on unreplicated evidence is prohibited by
    agents/coordinator.md regardless of how confident the adverse finding feels.
    WHY NOT `supersede`: no committed decision's clauses are superseded. Every
    clause of DEC-20260802-48c72c and DEC-20260802-fa3b26 stands; this decision adds
    to them.
    WHY NOT `pause`: END-2 is assessed below and NOT invoked, because a ranked next
    action of material value demonstrably remains (guard G-2). See
    campaign_end_assessment.
    WHY NOT `inconclusive` AS THE DECISION WORD: the EVIDENCE is inconclusive about
    H-P13-001 and is recorded as such in EV-PEC-7d8de9.strength. The DECISION is not
    inconclusive - it makes definite, checkable rulings on the S2 void, on FC-4, on
    k's adoption, and on two false statements in committed records.
  target_ids:
    - H-P13-001
    - EV-PEC-7d8de9
    - EXP-HEUR-d640d9
    - EXP-PEC-d7979c
    - GOAL-P13-001
    - DEC-20260802-48c72c
    - DEC-20260802-fa3b26
    - DEC-20260802-8227b9

  # ==================================================================
  # (0) VALIDITY GATE - CHECKED BEFORE ANYTHING WAS INTERPRETED
  # ==================================================================
  validity_gate:
    checked_before_interpretation: true
    expected_run_count: >-
      MET. Two producer runs were expected after the re-dispatch and two exist:
      RUN-HEUR-d640d9-a (TASK-20260803-4946a5) and RUN-PEC-d7979c-b
      (TASK-20260803-d164ba). RUN-PEC-d7979c-a is a QUARANTINED
      infrastructure-failure record, is not a receipt, and is not counted or cited
      as a result.
    schema_complete_manifests: >-
      MET for both. The Validator confirms 10 of 10 declared artifacts present in
      each package, manifest required fields present, stdout/stderr .txt and .log
      byte-identical pairs, code blocks carrying commit and enumerated dirty sets,
      and complete inference blocks recording requested_policy, an explicitly
      NOT-EXPOSED resolved identifier rather than an invented one, fallback_used
      true, model_verified false with reason, and INFAMEND-20260802-P13-002.
    seed_integrity: >-
      MET. All eleven seeds in RUN-HEUR-d640d9-a's raw-result.json match the frozen
      contract's section 7 replication block exactly. The paired
      Cantor-Zassenhaus non-independence of RUN-PEC-d7979c-b is labelled in all
      three of raw-result.json, manifest.yaml and execution_report.yaml as the
      contract requires after Validator V-4.
    raw_summary_agreement: >-
      MET, and verified by recomputation rather than by inspection. Every headline
      statistic in both packages was recomputed by independent Validator code from
      the committed raw per-sample records and agreed BIT-IDENTICALLY, including the
      three S2 z-values, the NULL-A z-value, the S3 log-likelihood ratios under
      three weightings, the S4 lambda_hat and D2* values at four B, all ten per-ell
      alpha values on the old grid, all four alpha arms on the new grid, both
      FC-4-NEW gaps, all three clause-(d) slopes with their standard errors, all ten
      variance-aware tolerances, and both L2-ANCHOR enumerations by two different
      algorithms. Deviation D-5 (manifest and execution report generated from
      raw-result.json by a session helper) is accepted: every sampled number traces
      back to raw-result.json and raw-result.json's internal consistency is what was
      verified.
    control_comparability: >-
      MET AS TO EXISTENCE AND VERDICT, AND DEFECTIVE AS TO POWER - the distinction
      that organises this whole decision. Every pre-registered control carries a
      recorded verdict backed by evidence actually present, and NULL-A is a genuine
      null object of the same shape under the contract's definition (same
      determinant p/4, same cardinality 13834, same prime stratification, same
      support, same short-vector code path, same statistic function - all verified
      in source). The defect is not that controls were skipped; it is that two
      frozen estimators were miscentred, which no amount of control execution
      repairs. See adjudications A and B.
    frozen_contract_integrity: >-
      MET. Both specifications are byte-unchanged since dfe285d4 (0 commits touching
      either since the freeze; the Validator re-hashed both). Every prediction,
      threshold, null object, void criterion and stopping rule was fixed before any
      datum existed.
    supersession_integrity: >-
      MET. experiments/EXP-PEC-49c773/ and experiments/EXP-PEC-6be870/ are
      BYTE-UNCHANGED (empty git diffs against the commits that last touched them,
      clean working tree, and the run's own C-IMMUT table of 24 hashes independently
      re-verified 24 of 24 by the Validator).
    verdict: >-
      THE RUN SETS ARE ADMISSIBLE EVIDENCE AND ARE INTERPRETED BELOW. PKG-BIB is
      `incomplete` and is interpreted only where its defects do not reach; its
      primary deliverable (the k derivation) was recomputed exactly and survives,
      and the two defects are named and acted on (adjudications D and G).

  # ==================================================================
  # (A) THE S2 VOID - THE BATCH'S REAL FINDING
  # ==================================================================
  adjudication_A_s2_void:
    ruling: >-
      THE VOID IS UPHELD, THE MECHANISM REPORTED FOR IT IS WRONG, AND RT-H3's
      ell = 2 LANE IS NOT CLOSED - IT HAS NOT YET BEEN MEASURED.
    the_finding_that_matters: >-
      TWO INDEPENDENT REVIEWERS CONVERGED ON THE SAME DEFECT BY DIFFERENT
      ARITHMETIC, IN SEPARATE SESSIONS, NEITHER USING THE OTHER'S REPORT AS AN
      INPUT. That convergence is the batch's real result and it is recorded as the
      headline rather than as a footnote to a voided statistic.
      THE DEFECT: the frozen S2 statistic conditions on n = s["delta"], the sample's
      OWN realised value, so the event {delta_E even} and the conditioning quantity
      are THE SAME RANDOM VARIABLE. The contract asserts this "removes the size
      effect exactly"; it does not. The estimator is self-conditioned and is not
      centred under the model it claims to test.
      VALIDATOR'S ROUTE (V-B4-01): data generated EXACTLY from the contract's own
      random-integer model M2 - arithmetic removed entirely - give z_2 = 13.5494,
      12.4753, 13.1528, LARGER than the arithmetic object's 8.645103378616307;
      analytically E[1{n even}] - E[floor(n/2)/n] is strictly positive on small
      integers, tabulated at +0.0437 for X = 9 and +0.2500 for X = 2.
      RED TEAM'S ROUTE (RT4-H1): exact decomposition in rational arithmetic into a
      parity term of -0.09679849 and a self-conditioning offset of +0.14831138,
      summing to +0.05151289 and matching the run's own difference to eight
      decimals, with 64.2 per cent of the offset carried by the delta_E = 1 spike.
    the_void_was_compelled_not_merely_permitted: >-
      RECORDED PRECISELY. The contract's per-statistic rule reads "S2: if |z_2| > 3
      with the same sign on NULL-A, the S2 signal is VOID". NULL-A returned
      8.735230131717895 with the same sign +1, so the rule fired, and
      heuristic_tail.py lines 2899-2903 implement exactly that rule and nothing else.
      No threshold was adjusted, no range restricted, no instrument repaired. Because
      the pre-registered condition C1 AND C2 AND C3 provably HAD NO POWER against
      the hypothesis it was written to test, voiding it was COMPELLED BY THE
      CONTRACT'S OWN RULE, not merely allowed by it.
    a_contract_design_defect_not_an_executor_error: >-
      STATED WITHOUT HEDGING AND RECORDED AGAINST THIS ROLE. The Executor
      implemented the frozen formula verbatim, ran the pre-registered null, reported
      the void, attempted no repair, and DISCLOSED the second reading (deviation
      D-3) that made the defect visible to both reviewers. The Validator verified in
      source that both arms call the identical functions. THE DEFECT IS IN THE
      ESTIMATOR THE COORDINATOR FROZE.
    the_sign_is_not_established_in_either_direction: >-
      The run's reported constant factor log2(p_obs/p_null) = +0.1972 bits and the
      exogenous-M2 reading z = -9.2100 with log2 ratio -0.1900 bits are OPPOSITE IN
      SIGN. Neither is a property of maximal orders. The correct statement is that
      S2 AS FROZEN MEASURES NOTHING ABOUT ell = 2 ARITHMETIC, and the shortfall of
      +8.645 below the artifact floor is likewise NOT evidence of a parity deficit -
      the arithmetic and synthetic arms have different size distributions, so that
      comparison is uncontrolled in the other direction too.
    consequence_for_rt_h3: >-
      RT-H3's ell = 2 LANE RETURNS TO FULLY OPEN AFTER APPEARING CLOSED. It was
      probed with a miscentred instrument and the measurement must be redone. NO
      RECORD MAY DESCRIBE THIS BATCH AS HAVING NARROWED RT-H3's REFUTATION CHANNEL:
      a test with no power narrows nothing. This is the single judgement in the
      batch's own reporting that the Red Team believes is wrong, and this
      Coordinator agrees with the Red Team.
    one_credit_correctly_reassigned: >-
      The batch's flagship sentence - "without that null object a |z| = 8.6 result
      would have been reported as a finding" - credits the wrong control. NULL-B's
      second reading already voids it and would have done so even had NULL-A come
      back clean. The escape from a false finding was luck in its mechanism and
      design only in its outcome, and the record should not claim otherwise.
    proof_basis: >-
      DERIVATION plus a committed instance, per docs/claims-and-verification.md. The
      derivation is the exact identity in two independently reached forms; the
      committed instance is the run's own NULL-B READING_NEW_SIZE arm returning
      z_2 in [16.818982749412662, 19.52013770787415] in 200 of 200 replications,
      present in raw-result.json at 11b086d9. This basis was sought and is archived
      BEFORE this decision relies on it - subject to the archival_order_caveat in
      EV-PEC-7d8de9, which is a real defect of this archive and is not minimised.

  # ==================================================================
  # (B) S1 IS A REFERENCE-MEASURE ERROR
  # ==================================================================
  adjudication_B_s1_reference_measure:
    ruling: >-
      S1's SAMPLER-REJECTED VERDICT IS A REFERENCE-MEASURE ERROR, NOT A MIXING
      FAILURE. RT-H2's EXPERIMENTAL ARM RETURNS TO UNRUN.
    the_walk_equilibrated_it_equilibrated_elsewhere: >-
      A non-backtracking walk in the ell-ideal graph equilibrates to uniform over
      IDEAL CLASSES - over supersingular j-invariants - whose pushforward to
      conjugacy-class types is W-CURVE. S1a compared it against W-TYPE. The frozen
      contract asserts W-TYPE is "the sampler's target measure"; that assertion is
      FALSE for the walk the contract itself constructs.
      MEASURED SIGNATURE: mean total variation to W-CURVE 0.03485 -> 0.01102 ->
      0.01055 across 1x/3x/10x, DECAYING to a sampling-noise floor of 0.00846, while
      mean total variation to W-TYPE converges to a NONZERO limit 0.13044 ->
      0.12782 -> 0.12752. W-CURVE is the closer reference at 288 of 299 primes at
      L = 10x - THE SAME 288 AS THE HOLM REJECTION COUNT, which is what ties the
      rejection to the reference rather than to the chain.
    the_flatness_claim_is_censored_not_informative: >-
      The committed S1a Fisher statistic is 5305.213651378483 at all three lengths,
      and 2 * 288 * ln(10001) = 5305.2136513784735. EVERY REJECTING PRIME IS PINNED
      AT THE MONTE-CARLO RESOLUTION FLOOR 1/10001 and the other 11 contribute zero,
      so the statistic is a re-encoding of the count 288 with no resolution left.
      "The rejection does not weaken as the walk lengthens" is therefore NOT
      MEASURED by the quantity quoted for it. The run records the underlying float
      underflow (AN-5) and not the saturation, and the saturation is the part that
      matters.
    the_correct_statement_is_stronger_and_the_run_half_held_it: >-
      "At the tested lengths" wrongly suggests a longer walk might pass. The correct
      scoped statement is that THIS WALK'S STATIONARY DISTRIBUTION IS NOT UNIFORM
      OVER CONJUGACY CLASSES AND NO WALK LENGTH REPAIRS THAT. The run already held
      half of the finding and did not connect it: PH5 records the W-CURVE and W-TYPE
      Clopper-Pearson intervals for the even-fraction as DISJOINT, which is the same
      measure gap measured a second way in the same run.
    the_red_teams_own_mechanism_is_refuted_by_its_author: >-
      RT-H2 predicted a tilt "toward orders with short ideals - exactly the regime
      that makes delta_E small". The observed tilt goes THE OTHER WAY (walk 0.1567
      against W-TYPE 0.2784 at delta_E = 1, p = 1999). Recorded because the Red Team
      stated it against its own objection.
    what_survives_and_on_what_basis: >-
      RT-H2's GAP CLAIM ABOUT THE FROZEN PAPER SURVIVES, and survives only because
      THE PAPER STILL DOES NOT STATE ITS SAMPLER. That is a documentary observation
      about the paper, not a measurement, and it must never be restated as an
      experimental result. The run's own MANDATORY_SCOPE clause forbidding exactly
      that conversion is honoured throughout the package, which the Red Team
      confirms.
    relevance_bounded_in_the_honest_direction: >-
      mean TV(W-TYPE, W-CURVE) * sqrt(p) = 4.185 over the 135 completed primes with
      p > 1000, so the rejected quantity decays as Theta(p^{-1/2}) and is of order
      1e-37 at NIST-I scale. THE DEFECT IS REAL IN THE INSTRUMENT AND HAS NO
      CRYPTOGRAPHIC-SCALE ANALOGUE. Recorded because it bounds the finding against
      this programme's own interest in having found something.

  # ==================================================================
  # (C) FC-4 STANDS
  # ==================================================================
  adjudication_C_fc4:
    ruling: >-
      FC-4 STANDS, BY MEASUREMENT ON THE PRE-REGISTERED GRID, AND DOUBLY. NC2d-PROPER
      did what it was designed to do: it retired nothing by post-hoc restriction and
      it tested the mechanism where the p-scaling is actually applied.
    two_independent_failures_either_alone_sufficient: >-
      CLAUSE (b) FAILS: PRIMARY-A's per-ell reading reaches 1.1503204217789973
      against a band ceiling of 1.15, so it is OVERLAPPING rather than CONTAINED and
      the contract's "under BOTH readings" requirement is unmet. The miss is 0.032
      per cent of the band edge and is recorded as narrow SO THAT NO READER MISTAKES
      IT FOR DECISIVE - and, symmetrically, it may not be softened to "essentially
      contained", which is exactly the post-hoc move the contract's "only three
      words are available" rule forbids.
      CLAUSE (d) FAILS ROBUSTLY: PRIMARY-A slope 0.026720478497382523 (interval
      [0.011974187885943632, 0.04146676910882141]) and PRIMARY-B slope
      0.022272686773240465 (interval [0.01997848459795617, 0.02456688894852476]),
      both excluding zero, against a null slope -0.007800828764005162 that contains
      it. PRIMARY-B's slope is 41.8 STANDARD ERRORS FROM ZERO, so the verdict
      survives at 99 and 99.9 per cent and is not an artifact of the interval level
      the contract left undeclared.
      EITHER ALONE FORCES STANDS. The disposition does not depend on the narrow
      clause.
    the_committed_firing_is_independently_confirmed: >-
      The Validator recomputed the BATCH-003 gap with its own OLS code from
      RUN-PEC-49c773-a's committed raw data and obtained 0.16618962442799579 against
      the committed 0.16618962442799545 - a 3.4e-16 difference that is
      floating-point summation order, far below the contract's 0.02 tolerance - and
      reproduced all ten per-ell alpha values EXACTLY.
    the_one_nuance_between_the_reviewers_adjudicated_not_chosen: >-
      BOTH REVIEWERS ARE RIGHT AND THEY ARE NOT IN CONFLICT. The Red Team is right
      that RG-CONTROL is a deterministic re-execution with the same seeds and the
      same code, reproducing twelve values at abs_difference 0.000000e+00, and that
      such a re-run HAS ZERO STATISTICAL POWER - it is a provenance and code-drift
      check and cannot corroborate a mechanism. The Validator is right that it is
      nevertheless a REAL RE-MEASUREMENT and not a copy: 216 fresh per-sample
      records with their own pid and wall clock (0.002819 s / pid 6611 against
      0.006714 s / pid 22654 at one checked cell) while cost, per_entry, inversions
      and roots_sha256 are identical - precisely what a deterministic
      counted-operation instrument with CZ seeded on (ell, j_index, p) MUST produce
      - and the Validator recomputed all four RG-CONTROL alpha arms from the NEW
      run's own samples and obtained the committed values to the last bit.
      THE JOINT RULING: RG-CONTROL genuinely re-executed and genuinely reproduced.
      That establishes provenance and determinism and NOTHING ABOUT THE MECHANISM.
      It is citable as clause (e) of the frozen conjunction and NEVER as a reason
      FC-4 stands. The Red Team's objection is to the REASON OFFERED, not to the
      verdict, and it is sustained on that point.
    clause_a_is_one_weak_comparison: >-
      SUSTAINED (V-B4-03, RT4-C2, A-4 confirmed and worse than the run draws out).
      NULL-A and NULL-B are bit-identical at all 108 null cells including on the new
      grid, so alpha_null is ONE measurement and both FC-4-NEW comparisons share it
      exactly. THE REASON is that the null performs only degree-2 steps, so no
      polynomial it multiplies exceeds four coefficients and Karatsuba always
      delegates to schoolbook: THE ENTIRE PURPOSE OF THE NEW GRID WAS TO ESCAPE THE
      REGIME WHERE THE TWO IMPLEMENTATIONS RUN THE IDENTICAL CODE PATH, and the
      primary object escapes it while THE NULL DOES NOT.
      Second symptom: alpha_null moved +0.0745723380 between grids (0.9935080487 ->
      1.0680803867) on an object whose per-entry cost is O(1) in ell BY
      CONSTRUCTION, and 71 per cent of the old-to-new change in the gap comes from
      the NULL arm against 29 per cent from the primary. MOST OF THE GAP SHRINKAGE
      CAME FROM THE NULL MOVING. The margins to threshold (0.0888, 0.0968) are about
      2.6 times smaller than the null term's own demonstrated ell-range (0.2466).
      RULING: clause (a) may never be cited alone as showing the mechanism holds.
      The disposition is unaffected.
    rerank_trigger_did_not_fire: >-
      DEC-20260802-fa3b26 pre-registered, before the measurement: if NC2d-PROPER
      fires FC-4 again on ell >= 47, L5 is contradicted where it is applied and the
      alpha-characterisation work is ADDED. FC-4-NEW does NOT fire on the new grid
      (gaps 0.06124411988374323 and 0.05323477492288187 against a 0.15 threshold).
      THE TRIGGER DID NOT FIRE AND THE ADDITION IS NOT MADE. Recorded because a
      pre-registered trigger that does not fire must be reported as explicitly as
      one that does.
    what_it_is_worth: >-
      NOT A RESULT ABOUT THE ATTACK. Per the contract's own non-claims the whole
      alpha question is worth 0.4277 bits at NIST-I and 0.6809 at log2 p = 768, and
      the alpha estimate carries a `toy` ceiling from its 20- and 30-bit arms.
      alpha = 1 remains DERIVED and MECHANISM-INCONSISTENT.

  # ==================================================================
  # (D) V-B4-02: A CLOSED LANE REOPENS ON THE DOMINANT RESIDUAL
  # ==================================================================
  adjudication_D_sutherland_batching:
    ruling: >-
      THE `STATED_ABSENCE` IS FALSE AND RT3-C8 / L4 IS REOPENED. THIS IS THE MOST
      CONSEQUENTIAL SINGLE CORRECTION IN THE BATCH.
    what_was_claimed_and_what_the_source_says: >-
      baseline_constant_report.yaml recorded for source SUTH: "Absent. Both
      retrieval passes report no statement in this paper about amortizing or
      batching the evaluation over many j-invariants. label: STATED_ABSENCE", and
      rt3_c8_disposition built on it - "the absence is itself the finding ... The
      batched-evaluation literature RT3-C8 needs is therefore NOT this paper" -
      closing the lane under honest_accounting.closures_enumerated.
      THE VALIDATOR RE-FETCHED THE SOURCE (https://ar5iv.labs.arxiv.org/html/1202.3985,
      HTTP 200, 2567101 bytes) AND IT CONTAINS SUCH A STATEMENT, quoted verbatim:
      "we can take advantage of BATCHING, whereby we extend Algorithm 1 to take
      multiple inputs j(E_1) in F_{q_1}, ..., j(E_k) in F_{q_k} and produce
      corresponding outputs for each (the F_{q_i} may coincide, but they need not).
      Provided k = O(log l), this does not change the time complexity ..., since the
      most time-consuming steps depend only on l, not j(E), and the space complexity
      is increased by at most a factor of k."
      RT3-C8's ASSERTION IN BATCH-003 THAT THERE IS "NO BATCHING STATEMENT IN THAT
      PAPER" WAS WRONG, and a lane marked CLOSED rested on it.
    why_this_is_not_a_bookkeeping_correction: >-
      (i) A STATED ABSENCE IS A POSITIVE CLAIM ABOUT A SOURCE. (ii) "the F_{q_i} may
      coincide" places the statement squarely in RT3-C8's own setting - many
      j-invariants in one field - and "the most time-consuming steps depend only on
      l, not j(E)" IS the amortization statement RT3-C8 hoped to find. (iii) It
      bears directly on the 11.50-to-13.25-bit term that is 48 to 59 per cent of the
      residual uncertainty and that sets the WIDTH of every margin statement this
      programme makes - the term on which completion criterion 1 turns.
    the_honest_corrected_reading_stated_before_anyone_gets_excited: >-
      Sutherland supplies a batching statement WITH A BATCH-SIZE CEILING OF
      k = O(log l), far below the N >> l regime RT3-C8's argument needs, and for
      algorithms that do not take Phi_l as input. THE LANE'S SUBSTANTIVE CONCLUSION
      MAY WELL SURVIVE RE-ARGUMENT. What is removed is a FALSE GROUND for closing
      it, not the estimate's direction and not its magnitude.
    disposition: >-
      Under docs/inventor-protocol.md section 4 a closure requires a named
      obstruction, an argument and forward guidance. The named obstruction here is
      factually wrong, so the closure fails its own standard and the lane REVERTS TO
      OPEN pending a corrected reading argued on the text. The ledger does not carry
      the closure as written. RT3-C8 / L4 REMAINS THE DOMINANT RESIDUAL and k does
      not displace it - the bibliographic producer says this itself and is right.
      Ranked as a successor item: see next_actions NA-1 rank 3.

  # ==================================================================
  # (E) V-B4-04: A DEFECT IN THE ORCHESTRATING SESSION'S OWN RECORD
  # ==================================================================
  adjudication_E_quarantine_marker:
    ruling: >-
      THE QUARANTINE MARKER STATES A FALSEHOOD ABOUT ITS OWN DIRECTORY. THE DEFECT
      IS THIS ROLE'S, NOT A PRODUCER'S, AND IT IS RECORDED AS SUCH.
    the_false_statement: >-
      experiments/EXP-PEC-d7979c/runs/RUN-PEC-d7979c-a/INCOMPLETE_INFRASTRUCTURE_FAILURE.md
      asserts that "no statistic reached a recorded verdict against its
      pre-registered threshold". THE VALIDATOR OPENED THE FILE AND IT IS FALSE:
      raw-result.json carries finished_utc 2026-08-03T00:45:42Z,
      total_wall_clock_seconds 2809.624, 216 primary and 216 null samples, all eight
      control verdicts pass, validity.status "completed_valid", SL1-SL4 all MET, all
      five FC-4 conjunction clauses, and fc4_disposition.verdict_word "STANDS". THE
      COMPUTATION FINISHED. Only the receipt bundle was never written. The BATCH-004
      dispatch queue's infrastructure_incident block repeats the
      mischaracterisation by calling the directory "PARTIAL".
    how_it_happened: >-
      The marker was written from the incomplete FILE SET without reading the raw
      result. That is a procedural failure of the orchestrating session, and naming
      it is the point of recording it.
    what_it_changes_and_what_it_does_not: >-
      IT CHANGES NO VERDICT. RUN-PEC-d7979c-a and RUN-PEC-d7979c-b are BIT-IDENTICAL
      at all 216 primary and all 216 null sample cells and at every headline verdict,
      so the two agree completely and no result depends on which is read.
      IT DOES MEAN THE CAMPAIGN TWICE DESCRIBED A COMPLETED RUN AS HAVING PRODUCED
      NOTHING - once in a committed artifact and once in a coordination record. The
      error UNDERSTATES the producer's position, so it is not self-serving; that
      makes it easier to correct and no less of a defect.
      TWO FACTS IT UNCOVERS, ONE EACH WAY. Favourable: a genuine second execution of
      the whole pipeline in a separate process and session - a determinism
      demonstration the batch does not currently claim. Unfavourable: THE RE-RUN WAS
      THEREFORE NOT BLIND, since a completed computation of the same quantities
      existed on disk before RUN-PEC-d7979c-b's receipt was written. The Validator
      finds no evidence of contamination and this Coordinator records the fact
      rather than leaving it implicit.
    correction_mechanism: >-
      Neither locus is edited. The marker is committed and immutable under AGENTS.md
      rule 4; the dispatch queue is outside this task's write scope. The correction
      is carried by this decision and by EV-PEC-7d8de9 CORR-B4-1, which is the
      mechanism the contract provides.
    rule_5_unchanged: >-
      INCIDENT-20260803-P13-05 remains an infrastructure outcome and is never
