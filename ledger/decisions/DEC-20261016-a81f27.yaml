  context: >-
    Goal-scoped Coordinator pass on the SafeCurves goals, at the user's
    request in this session. No scientific trial was run. IDEA-20260829-ff7823 derives an
    exact block-sharing identity for the X9.62 / SP 800-186 hash chain at
    l = 384 (v = 2): consecutive seeds s and s+1 share 223 of 383 bits of c.
    It proposes to measure whether that sharing makes acceptance events along a
    consecutive-seed scan dependent, which it calls "the assumption every
    manipulation cost model in this family silently makes". DEC-20260913-1fa1bc
    approved only Stage 0 of EXP-SCURVE-87c103, a closed-form check of three
    identity names. Stage 0 has no runs. Stage 1 was never authorized.
