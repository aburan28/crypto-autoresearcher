  ruling:
    - >-
      The identity (C1) and the constant-factor hash saving (C2) are
      properties of the procedure as written. Nothing reported here touches
      them, and this decision neither refutes nor endorses them.
    - >-
      The idea's bearing on the NIST curves is moot. The real P-384 seed (and
      every other X9.62 / FIPS 186-2 prime-curve seed) is one 20-byte block of
      (int)(drand48()*256) output after srand48(t). Successive candidates in a run
      are successive drand48 blocks, not the counter steps s, s+1. The P-384 run
      srand48(872952608) tried 2,688 such blocks. Theory A versus Theory B, about
      dependence along a consecutive-seed scan, describes no search that produced
      a NIST curve. It therefore cannot change any statement about how P-384 was
      chosen.
    - >-
      Pause, as a deprioritization of a lane: neither the Stage 0 calibrator nor
      a Stage 1 design is to be dispatched, because neither can be ranked ahead
      of doing nothing for this goal. The Stage 0 approval is not withdrawn. No
      hypothesis or experiment status changes. This pause does not rest on "no
      route remains", and it asserts nothing about the truth of H-SCURVE-684a10,
      so the closure gate's obstruction block is not engaged.
  rationale:
    - >-
      Research-direction integrity requires the evidence, the test boundary,
      the remaining uncertainty and a revisit condition. Evidence: KN-LIT-d2f917
      and research/nist_seed_provenance_20261016/README.md (forward regeneration
      of all ten prime seeds, per the native test listed there). Test boundary:
      the ten historical prime-curve seeds and their six runs. Remaining
      uncertainty: whether a consecutive-seed scan of the procedure as written
      has dependent acceptance events. That question is generic and is no longer
      about NIST provenance. Revisit condition: a ranked proposal about
      consecutive-seed generators (for example a BADA55-style scan of the
      standard as written) that needs C3/C4 as a premise.
  evidence_refs:
