coordinator_decision:
  id: DEC-20260804-998060
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-055
  recorded_by_task: TASK-20260804-032
  archived_by: TASK-20260804-032
  context: >-
    BATCH-055 ran two parallel tracks: (A) Semaev BKK mixed-volume computation for
    IDEA-b5462f; (B) OIFP MITM analysis for SG-ECDLP-003. Both produced concrete findings.

  decision: advance_two_directions

  decision_scope: >-
    Track A (BKK): S_3 degree = 2 per variable (not 4); BKK/Bezout ratio = 0.5
    (factor-2 improvement); actual root count = 2, far below BKK = 8 and Bezout = 16.
    The Semaev system is EMPIRICALLY sparser than its BKK bound at m=3. This is a
    concrete and quantified finding: the BKK improvement is real (factor 2) but the
    actual sparsity is even greater. Advance: design an experiment measuring actual
    relation-finding speedup at m=3 vs m=4 index calculus.

    Track B (OIFP): ordinary OIFP MITM is VALID (both endpoints given, no scalar
    issue). Complexity O(p^{1/4}) with O(log p) memory (distinguished-point variant).
    Likely known (CSIDH/CSI-FiSh 2018/2020) but explicit toy-scale confirmation is
    absent. Advance: H-OIFP-001 confirmatory experiment (MITM collision at bits=20/40).

  target_ids:
    - GOAL-ECDLP-001
    - SG-ECDLP-003
    - IDEA-20260804-b5462f
    - BATCH-055

  rationale:
    - >-
      BKK finding: S_3 has 13/27 monomials in the [0,2]^3 box. After specialization,
      Newton polytope fills [0,2]^2. MV = 8 (vs Bezout = 16). Empirical root count = 2
      (consistently). The gap between 2 and 8 (BKK not tight) suggests that a TIGHTER
      sparse resultant bound (using actual geometry of the zero set) could give further
      improvement. Scale-up: for S_m at index calculus scale, BKK gives factor-2 over
      Bezout at every m. Combined with the tight-empirical gap, the actual speedup may
      be larger.
    - >-
      OIFP finding: birthday MITM on h(D) ~ p^{1/2} nodes with L ~ p^{1/4} samples
      gives O(p^{1/4}) cost with O(log p) memory (distinguished points). This is
      faster than L[1/2] class group DLP at practical security levels (crossover ~p=2^280).
      The forward/backward walk starting points are both well-defined (E and E' given),
      resolving the BATCH-053 scalar-domain mismatch that blocked ECDLP MITM.

  exact_next_action: >-
    Open BATCH-056 with two parallel tasks:
    (A) Specify H-OIFP-001 and design EXP-OIFP-001 (confirmatory MITM collision at
        bits=20/40, measuring collision cost vs p^{1/4} prediction); dispatch pre-exec review.
    (B) Extend the Semaev BKK analysis to S_5 and S_7 (index calculus scale) and measure
        the empirical root count vs BKK bound; if the gap persists at larger m, this
        suggests a structural sparsity result worth pursuing formally.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Both findings are preliminary; neither is validated by independent review.
      The BKK factor-2 improvement is likely known (Semaev paper discusses degree).
      The OIFP MITM p^{1/4} is known (CSIDH/CSI-FiSh). Promote after validation.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 for ECDLP; L[1/2] for OIFP
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
  claim_ceiling: toy
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
