coordinator_decision:
  id: DEC-20260726-003
  context: >-
    EXP-FCP-002 (144 runs, 16-28 bits) and EXP-FCP-003 (72 runs, 32-36 bits)
    together provide 216 runs across 6 bit sizes testing H-FCP-001's prediction
    that fixed-curve preprocessing yields amortized cost ratio < 0.95 at bit
    sizes >= 20. All runs completed_valid, dirty: false, with verified
    certificates. The success criterion is not met at any bit size. The
    precomp/groebner ratio plateaus at ~1.6% at 32-36 bits, far below the ~6%
    needed for the predicted crossover.
  decision: weaken
  target_ids:
    - H-FCP-001
    - EXP-FCP-002
    - EXP-FCP-003
  rationale:
    - >-
      0/15 runs at bits >= 20 achieve amortized_cost_ratio < 0.95. The closest
      is seed 2 at 32-bit (0.996), still above the threshold.
    - >-
      The precomp/groebner ratio increases from 0.4% (16-bit) to 1.7% (32-bit)
      but then plateaus and slightly decreases at 36-bit (1.6%). The hypothesis
      mechanism predicted continued growth; the data show saturation.
    - >-
      weaken is chosen over reject_scoped because: (1) the evidence is
      empirical_only (no derivation showing why the ratio must plateau);
      (2) only B=14, m=2, K=5 were tested — larger B or different m might
      behave differently; (3) the plateau may be a sympy artifact (coefficient
      arithmetic in sympy may not scale the same way as optimized F4).
    - >-
      weaken is chosen over inconclusive (the prior decision) because the
      combined 216-run evidence across 6 bit sizes now shows a clear pattern:
      the ratio approaches 1.0 but does not cross below 0.95, and the driving
      mechanism (precomp/groeb growth) saturates. This is no longer "too little
      data to tell" — it is "the predicted effect does not materialize at the
      tested scale, and the mechanism shows signs of saturation."
  evidence_refs:
    - EV-FCP-003
    - EV-FCP-002
  limitations:
    - empirical_only: no derivation or counterexample certificate.
    - Toy scale only (max 36 bits); crypto-scale behavior unknown.
    - B=14, m=2, K=5 only; other parameters untested.
    - All Groebner solves return trivial ideals; non-trivial system cost may differ.
    - sympy Groebner may not represent optimized solver behavior.
  next_actions:
    - >-
      H-FCP-001 is weakened but not rejected. To reject_scoped, produce a
      derivation showing that the precomp/groebner ratio is bounded by O(1/B)
      or O(log(p)/poly(B,m)) for the S_3 system, or test with larger B where
      construction cost is higher.
    - >-
      Alternatively, test the multi-target IC amortization idea (IDEA-20260726-001)
      which is the natural successor: it measures T_desc vs sqrt(N) directly,
      which is the fundamental quantity the FCP experiments approximate.
    - >-
      If not pursuing further: H-FCP-001 remains weakened; the 216 runs
      contribute a preliminary finding that factor-base construction is
      negligible relative to Groebner solving for S_3 decomposition at
      16-36 bit toy primes with B=14.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-FCP-003 is preliminary empirical evidence (empirical_only proof
      status, toy scale, single parameterization). The weakening is not a
      proven negative — it is an observed pattern across 216 runs. No durable
      finding is established until a derivation bounds the ratio or a
      replicated experiment at different parameters confirms the plateau.
  decided_by: coordinator
  decided_at: "2026-07-26T23:45:00-07:00"
