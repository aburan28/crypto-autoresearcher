coordinator_decision:
  id: DEC-20260726-003
  context: >-
    Two rulings requested by TASK-20260726-001 alongside the experiment verdicts in
    DEC-20260726-001 and DEC-20260726-002. First: whether the Figure 1 scouting result in
    research/JMV2005_experiment_suite_20260726.md Section 2 - for NIST P-256, -d_pi = 3
    (mod 9), so 9 does not divide d_pi, so 3 cannot divide c_pi, contradicting Figure 1's
    reported c_pi = 3, while P-224 (absent from the table) does satisfy 9 | -d_pi - warrants
    a CORR- record path. It is currently SCOUTING, produced by experiments/EXP-JMV-001/
    cpi_audit.py, with no run record, no manifest, and no independent validation. Second:
    whether Jao-Miller-Venkatesan 2005 (arXiv:math/0411378v3) should be ingested as a KN-LIT
    entry. I rule on the PATH in both cases and promote nothing here.
  decision: approve
  target_ids:
    - "research/JMV2005_experiment_suite_20260726.md Section 2 (Figure 1 scouting result)"
    - EXP-JMV-001
    - "KN-LIT (next free id, currently KN-LIT-082) - Jao-Miller-Venkatesan 2005"
  rationale:
    - >-
      FIGURE 1 RULING, PART A: NO CORR- RECORD, AND NOT BY EXP-JMV-001 ALONE EITHER. CORR-
      records in this ledger correct THIS program's own artifacts and claims - see
      ledger/CORR-20260724-002.yaml, whose fields are record_type, invalidated_claims,
      unaffected_claims, and impact_on_decisions. The JMV Figure 1 discrepancy is a defect in
      an external publication that this program has never relied on: no ledger record, no
      decision, and no knowledge entry currently cites Figure 1, so there is nothing of ours
      to correct. Issuing a CORR- against another author's table would misuse the record type
      and would inject an unreviewed reading of an external paper into the ledger's correction
      stream, which exists to track our own retractions.
    - >-
      FIGURE 1 RULING, PART B: the correct destination is an erratum note inside the KN-LIT
      entry for JMV 2005, reached through a four-step gate, ALL steps required. Step 1:
      EXP-JMV-001 runs at specification version 2 under DEC-20260726-001, producing a run
      record whose [n]G = O control passes for every row used and whose conductor definition
      is the corrected one (condition D1). Step 2: the verbatim Figure 1 transcription
      (condition C1) is checked against arXiv:math/0411378v3 by a reviewer who did not produce
      it. If the paper's table does not say what the suite doc says it says, the claim has no
      subject, evaporates, and no later step is taken. Step 3: independent validation of run
      integrity (raw/summary agreement, control status, recomputation from the raw record;
      seed integrity is not applicable as the run is deterministic) plus a red-team pass
      against the alternative explanations - a different definition of c_pi in the source, a
      2005-era curve convention, a typo in the paper's q or n rather than a row swap, or a
      transcription error of ours. Step 4: only then a Coordinator evidence review and an
      EV-JMV-001 record, after which the erratum is recorded as a corrections section of the
      KN-LIT entry, and a KN-FIND is promoted if and only if the evidence reaches replicated
      or strong. A CORR- record is created only if by then some program record has come to
      depend on Figure 1.
    - >-
      FIGURE 1 RULING, PART C: the artifact discipline the erratum must satisfy. The strongest
      form available here is a counterexample certificate in the sense of
      docs/claims-and-verification.md - an explicit instance (P-256's published p and n) plus a
      one-line exact check (the residue of -(t^2 - 4p) modulo 9) that independent code
      re-verifies from scratch. EXP-JMV-001 must emit exactly that, and the erratum must rest
      on it. It must NOT rest on the trial-division search to 10^6, which is a censored
      negative and can never establish c_pi = 1. If the certificate is emitted and verified,
      the evidence record carries proof_status certificate; if for some reason it is not, the
      record falls back to derivation with the argument archived, and empirical_only is not an
      acceptable basis for asserting an error in a published table.
    - >-
      FIGURE 1 RULING, PART D: until all four gate steps complete, the Section 2 result stays
      labelled SCOUTING. It may not be cited as a finding by any agent, in any document,
      summary, knowledge entry, or reply - including as "verified" or "confirmed". The suite
      doc's own phrase "Scouting result (verified, un-reviewed)" is the kind of wording that
      erodes this line and should be tightened when that document is next revised: a
      calculation being exact is not the same as a result being reviewed. This reaffirms the
      handoff constraint as an official standing ruling.
    - >-
      KN-LIT RULING: INGESTION APPROVED, independently of every experiment verdict. The corpus
      holds several other Jao papers - I confirmed KN-LIT-062 (De Feo-Jao-Plut), KN-LIT-064
      (SIKE, Jao among the authors), KN-LIT-071 (Childs-Jao-Soukharev), and KN-LIT-079
      (Biasse-Jao-Sankar); the suite doc says five and I did not exhaustively verify that
      count - but not the one paper that is the standard justification for selecting curves by
      order alone and that sits directly upstream of KN-TECH-024, KN-TECH-029, and
      KN-OPEN-013/014. That is a genuine corpus gap and it exists whether or not a single
      experiment here ever runs. Ingest at the next free id, currently KN-LIT-082
      (KN-LIT-081 is the maximum in knowledge/INDEX.md), following the /curate-knowledge
      conventions, with knowledge/INDEX.md regenerated in the same ledger archive commit.
    - >-
      KN-LIT RULING, CONSTRAINTS ON THE ENTRY. (i) Set confidence honestly - reported unless
      the full text is actually read - and set citation_verified to what was actually done, not
      to what would look better. (ii) The entry must state that the result is GRH-conditional,
      asymptotic, with unspecified implied constants, that the polylog(q) count in Corollary
      1.2 is oracle queries rather than field operations, and that equivalence ACROSS levels is
      explicitly not proved by the paper. (iii) The entry must NOT contain the Figure 1 erratum
      at ingestion time. At most it may note that a conductor audit is open under RQ-JMV-001 /
      EXP-JMV-001, with no claim about the table's correctness. (iv) The entry must not
      characterise the paper as an attack, a barrier, or a security proof.
    - >-
      Standing note on corpus health, recorded because it bears on how this entry will be read:
      the knowledge corpus is known to be stale relative to the ledger (no KN-FIND entries
      exist, and several KN-OPEN entries contradict closed ledger results). Ingesting one
      accurate KN-LIT does not repair that, and this decision authorizes exactly one entry plus
      its index regeneration - not a broader corpus pass.
  evidence_refs:
    - "NONE. The Figure 1 observation is SCOUTING output from experiments/EXP-JMV-001/cpi_audit.py, which is explicitly not a run: it has no manifest, no run id, no environment capture, and no independent verification. It is cited here only as the subject of a ruling, never as evidence."
    - "Records consulted for the CORR- ruling: ledger/CORR-20260724-002.yaml (the only prior correction record, establishing that CORR- corrects this program's own artifacts), docs/claims-and-verification.md (refutation artifacts, certificate discipline)."
    - "Records consulted for the KN-LIT ruling: knowledge/INDEX.md, knowledge/literature/KN-LIT-062.md, -064, -071, -079, knowledge/techniques/KN-TECH-024.md, KN-TECH-029.md."
  limitations:
    - "This decision promotes nothing. It rules on paths only. No erratum, no correction, and no finding about JMV Figure 1 exists in this program as of this record."
    - "The scouting/evidence distinction is the whole point of the Figure 1 ruling and must be preserved verbatim in every downstream record: an exact computation that no one has reviewed is scouting, not evidence."
    - "Even after the full gate completes, a demonstrated error in a published table is an arithmetic result about named curves at crypto tier. It is not an ECDLP result, confers no attack advantage, says nothing about GRH or about Theorem 1.1, and must not be presented as undermining the paper's theorems."
    - "The load-bearing assumption throughout is that our transcription of Figure 1 is faithful. The paper is not in the corpus and I have not read it. If the transcription is wrong, the erratum claim is wrong, and condition C1 exists precisely to catch that before anything is recorded."
  next_actions:
    - "Do not create a CORR- record for the Figure 1 discrepancy. Revisit only if some program record comes to depend on Figure 1."
    - "Issue a /curate-knowledge handoff (write scope: knowledge/literature/KN-LIT-082.md and knowledge/INDEX.md ONLY) ingesting arXiv:math/0411378v3 under the four constraints above, and archive it in a ledger commit with the index regenerated in the same commit."
    - "Keep the Section 2 result labelled SCOUTING in every document until gate steps 1-4 complete. When research/JMV2005_experiment_suite_20260726.md is next revised, tighten the phrase 'Scouting result (verified, un-reviewed)'."
    - "On EXP-JMV-001 completion: run gate steps 2 and 3 as independent review-xhigh tasks by agents that did not originate the claim, then a Coordinator evidence review producing EV-JMV-001 with claim_tier crypto and proof_status certificate, and only then amend KN-LIT-082 with a corrections section."
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Nothing is promoted. The KN-LIT ingestion approved here is corpus coverage of an external
      paper, not promotion of an internal finding, and it is authorized as a separate curation
      task rather than executed in this record. No KN-FIND is warranted because no evidence
      record exists at any strength - the only observation in scope is unreviewed scouting
      output from a script that is explicitly not a run.
  decided_by: coordinator
  decided_at: "2026-07-26"
