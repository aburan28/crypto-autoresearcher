    schema_complete_manifest: PARTIAL. Required top-level keys are present. There is no inference block (DV-9).
    seed_integrity: >-
      The manifest lists the specification's five seeds, and instance file
      names carry seed and draw. Whether each instance is the contract's draw
      in the contract's order is a validator check against RUN-SEMBIN-9bb990/counts.
    raw_summary_agreement: >-
      NOT CHECKED HERE. summary.json per-cell aggregates have undocumented
