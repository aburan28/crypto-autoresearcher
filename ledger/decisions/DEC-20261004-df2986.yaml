        uncommitted pending the user's storage decision.
      what_is_blocked: >-
        The snapshot archive of RUN-SEMBIN-9bb990, and therefore the joint
        review round of NA-1. A reviewer may not read uncommitted inputs
        (AGENTS.md standing dispatch precondition 2). NOT blocked:
        TASK-20261004-342564, RUN-SEMBIN-5ed13e's own record, and every
        other lane of GOAL-SEMBIN-5078bc.
      clears_when: >-
        The user records a storage decision for the RUN-SEMBIN-9bb990
        package, AND the bytes that decision retains are committed and
        content-bound by a Coordinator snapshot archive of RUN-SEMBIN-9bb990
        under its own card. If the decision excludes any file from git, the
        package must still carry its sha256 and the means to recover or
        regenerate it, and the receipt says which. The choice among storage
        options is the user's. This decision does not make it.
      recheck: >-
        git fetch; compare `git ls-files
        experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-9bb990 | wc -l` with
        `find experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-9bb990 -type f |
        wc -l`; read `python3 tools/agent_bus.py inbox --as coordinator` and
        the user's messages for the storage decision.
      asserts_nothing_about: >-
        THE SCIENCE. A package's size or storage state is not evidence about
        the closure, the library defect, Assumption 1 or any curve.

  review_inputs_for_the_plan:
    note: >-
      Questions the NA-1 review_plan must assign, each to exactly one owner.
      These are questions, not findings, and the plan author may split or
      merge them. Listed so that none is unowned by omission.
    items:
      - DV-8 (stopping rule 4) and DV-7 (invalidation rules 1 and 2), for both runs.
      - DV-5. What controls exist, on which library, and whether any are comparable to RUN-SEMBIN-5ed13e.
      - DV-2 and DV-3. Per-record m4ri_library and elimination; M4RI build provenance; whether the closure.c changes across lanes left the rows produced unchanged.
      - >-
        The executor's own limits on the two cross-checks: both elimination
        routines share closure.c's product generation, so a missing-product
        defect is invisible to the comparison. The evaluation check is
        necessary, not sufficient. One instance pair was not cross-checked
        (NOTES.md).
      - DV-9, raw/summary agreement, and the disclosed record defects.
      - >-
        The scope of the re-measurement. It covers the m = 2 window closure
        only. RUN-SEMBIN-9bb990's off-diagonal sweeps, single-level blocks,
        controls and certificate-soundness comparisons, and
        RUN-SEMBIN-b6eb9f's closure verdicts (which its NOTES say used the
        same routine), are not re-measured by it. The 9bb990 NOTES also say
        that a correction record against RUN-SEMBIN-b6eb9f is a Coordinator
        act not yet written. Both are carried to the evidence decision, not
        actioned here.
      - Whether the run's in-flight procedure (container restarts, checkpoint resumes, operator pause and restart) could have altered any record.
    tier_note: >-
      The tier is set in the plan under AGENTS.md rule 12, before any reviewer
      runs. It is not pre-judged here.

  rationale:
    - >-
      WHY COVER RATHER THAN REJECT. The user directed the work, it targets
      the exact defect that makes RUN-SEMBIN-9bb990's window verdicts
      unusable, and its package discloses its own scope breach and record
      defects. Leaving it unowned makes it non-durable and unreviewable.
      Discarding it would violate the coordinator prohibition on discarding
      anomalous runs and the good-faith rule (CLAUDE.md rule 9). Covering it
      is additive and asserts nothing about its content.
    - >-
      WHY NOT INTERPRET NOW. The two runs are complementary and must be read
      together. RUN-SEMBIN-9bb990 carries the defect diagnosis and the only
      control measurements, and RUN-SEMBIN-5ed13e carries the re-measured
      window. The contractual admissibility questions (DV-5, DV-7, DV-8) are
      unreviewed. Reading either run alone, or before those joints are owned,
      is the failure mode the review architecture exists to prevent.
    - >-
      WHY ONE NEXT ACTION. Every other open item (re-measuring the remaining
      RUN-SEMBIN-9bb990 records, the RUN-SEMBIN-b6eb9f correction, the
      completion of TASK-20260917-b2bf32) depends on what the joint review
      finds. Dispatching any of them first would rank work ahead of the
      information that decides whether it is needed.
    - >-
      TARGET-PROFILE HONESTY. The window is toy tier (specification
      scale_relevance). Nothing here transfers to n = 409 or 571, and the
      review is sized to the Assumption 1 boundary question, not to any cost
      claim.

