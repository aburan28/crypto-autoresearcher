  form_chosen:
    form: >-
      This additive Coordinator decision, plus ONE new self-archiving
      Coordinator card (TASK-20261004-342564). The card declares the run's
      paths as its artifacts, binds them by content hash without re-committing
      them, and commits this decision, itself, one write-once goal checkpoint
      shard and its receipt.
    precedents:
      - >-
        TASK-20260916-1edd4c: work done outside any declared card, documented
        afterwards by a handoff carrying retroactive_record_note. No earlier
        record was edited.
      - >-
        DEC-20261003-e2a917 R2 / TASK-20261003-6d2f84: bytes already committed
        outside an isolated archive are bound by path_sha256 with a write-once
        history test. They are NOT re-committed. A receipt never claims an
        isolation that did not happen.
      - >-
        TASK-20260917-619c31: an immutable card whose execution departed from
        it is never edited. The departure is carried by a new record.
      - >-
        DEC-20260926-1adf4e: a validity precheck that admits a run to review
        but not to interpretation, with outcome hygiene in the deciding record.
    why_not_a_separate_executor_card: >-
      A to-executor cover card would need its own archival task (archived_by)
      under a second TASK id. Only one TASK id was minted for this act. A
      self-archiving executor card would be incoherent, because executors do
      not commit. The executor's authorship is recorded in this decision and
      in the unedited manifest instead. If a later reader wants a to-executor
      card as well, it can be added under a new id. That addition changes
      nothing here.
    why_not_a_protocol_amendment: >-
      Nothing in the frozen contract changes. The cells, family, subspace
      convention, B convention, seeds, draw-selection rule (the same declared
      rule as RUN-SEMBIN-9bb990 deviation 2), metrics, success criterion,
      falsification criterion and stopping rules are all as in v1. A
      protocol_amendment would assert a change that did not happen. If the
      review finds that stopping rule 4 fired (DV-8), the remedy is decided
      then. It may be an amendment or a successor contract, and in either
      case it is additive.

  contract_conformance_of_the_instrument_change:
    question: >-
      Is running the v1 closure on M4RI release-20240729 (instead of the apt
      0.0.20200125) within the EXP-SEMBIN-7e1371 v1 contract?
    finding: >-
      WITHIN THE SPECIFICATION'S LETTER, OUTSIDE THE DISPATCH CARD'S. Recorded
      as a deviation from the card, not as conformance. The specification names
      the certificate mathematically ("degree-4 Macaulay block over F_2 ...")
      and pins no engine, library or version. Its required_artifacts ask for
      "engine name and version", and each closure record carries
      m4ri_library (NOTES.md, "Instrument"). TASK-20260917-b2bf32's
      dispatch_preconditions, however, name "msolve 0.6.5 and libm4ri (apt,
      Ubuntu 24.04)". Building and linking a different M4RI from git departs
      from that precondition (DV-2). The elimination routine and closure.c
      also changed (DV-3). The specification is silent on both, so neither is
      a specification breach on its face. Both make RUN-SEMBIN-5ed13e and
      RUN-SEMBIN-9bb990 different instruments by construction, which is the
      purpose of the re-measurement and the first thing the review must
      account for.
    not_decided_here: >-
      Whether the re-measurement is ADMISSIBLE as v1 evidence at all. That
      turns on DV-8 (stopping rule 4) and DV-5 (controls). Both are owned by
      the review.

  deviations_recorded:
    - id: DV-1
      what: Authority and scope.
      fact: >-
        experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-5ed13e/** is outside
        TASK-20260917-b2bf32's write_scope (code/** and
        runs/RUN-SEMBIN-9bb990/** only). No archival task was bound before
        the run was written (AGENTS.md standing dispatch precondition 1). The
        manifest's task_id names TASK-20260917-b2bf32.
      disposition: >-
        Covered for authority by this decision and TASK-20261004-342564. The
        precondition violation is RECORDED, not cured: binding afterwards is a
        remedy, not compliance (AGENTS.md "Dispatch preconditions bind the
        DISPATCHER").
    - id: DV-2
      what: Instrument library.
      fact: >-
        M4RI release-20240729 built from git ("make check 15/15";
        --disable-openmp per RUN-SEMBIN-9bb990 NOTES), instead of the apt
        libm4ri 0.0.20200125 named in the dispatch precondition.
        manifest.yaml environment.libm4ri_dev still reads the apt package
        version, while groebner_engine names 20240729.
      disposition: >-
        Recorded. The per-record m4ri_library field, not the manifest
        environment line, is what the validator checks. Build provenance
        (M4RI commit, configure flags, build location) is checked for
        presence in the package. This decision did not check it.
    - id: DV-3
      what: Elimination routine and closure code.
      fact: >-
        mzd_echelonize_pluq with a structural output check on every
        elimination (RUN-SEMBIN-9bb990 used mzd_echelonize). closure.c changed
        between lanes (d6a21306ee, a6d3b37e17, 9096320e22; memory accounting,
        checkpoint naming), and manifest code_changed_during_run is true. Two
        record-logging fixes landed afterwards (1c042d5f80, 5e1aa460cb).
      disposition: Recorded. Whether "no change to the rows produced" holds across those commits is a review joint.
    - id: DV-4
      what: Departures carried from RUN-SEMBIN-9bb990's own declared deviations.
      fact: >-
        Closure on two draws per n (first solution-free, first
        solution-bearing, chosen from exact counts before any closure), not
        draws_per_cell 10. One convention only: low_degree_polynomial
        subspace and B_random. F4 trace skipped (unreached on this host,
        recorded as unreached_declared). Single-level block not run
        (--no-single).
      disposition: Recorded. Not new in kind relative to RUN-SEMBIN-9bb990 deviations 1, 2 and 5.
    - id: DV-5
      what: Controls.
      fact: >-
        Run with --controls none, and summary.json controls is {}. None of
        the contract's six controls was measured on the fixed library in this
        run. Whatever control measurements exist are in RUN-SEMBIN-9bb990.
        Where they used M4RI, they used 0.0.20200125, and its NOTES classify
        its closure and single-level records as UNVERIFIED until re-measured.
      disposition: >-
        CONTROL COMPARABILITY FOR RUN-SEMBIN-5ed13e IS NOT ESTABLISHED. Not
        ruled here. A review joint, and a likely input to the evidence
        decision's next action.
    - id: DV-6
      what: Memory and wall clock against the advisory budget.
      fact: >-
        Closure memory cap 11 GiB (cross-checks 10.5 GiB and 11.5 GiB, with
        one cross-check attempt at 7 GiB), against specification
        budget.maximum_memory_gb 8 and card budget memory_gb 8. Per-lane wall
        clock exceeds wall_clock_seconds_per_run 5400 (manifest timing). Both
        budgets are enforcement: advisory.
      disposition: >-
        Recorded. Advisory under docs/research-budget-policy.md. It is not a
        validity defect by itself. Machine protection was handled by
        sequencing the n = 45 draw 0 cross-check after the window
        (NOTES.md).
    - id: DV-7
      what: Contract-text conformance questions inherited by both runs, not introduced by this one.
      fact: >-
        (a) Invalidation rule 2 requires the field equations "as explicit
        generators". manifest inputs.field_equation_convention reads
        closure_and_single_level: engine_implicit_boolean_ring. (b)
        Invalidation rule 1 requires "degree 3" generators. summary.json
        reports max_generator_degree 2 for every m = t = 2 cell.
      disposition: >-
        Not ruled. Both are review joints. The question is whether the rule
        text was written for t >= 3 and whether the implicit Boolean ring is
        equivalent to explicit field equations for this certificate. It must
        be answered for BOTH runs, not only this one.
    - id: DV-8
      what: Status of stopping rule 4 on RUN-SEMBIN-9bb990.
      fact: >-
        RUN-SEMBIN-9bb990's NOTES invoke stopping rule 4 ("STOP: the degree-4
        closure is UNSOUND", "the contract anticipates it"). The rule's text
        names a disagreement between the certificate and an affordable
        Groebner completion, to be reported "as a refutation of the
        certificate method". The disagreement found was with exact
        enumeration, and the executor traced it to the library. Under core
        rule 5, an implementation failure is infrastructure signal.
      disposition: >-
        NOT DECIDED HERE: whether the rule fired in the contract's sense,
        whether a library defect is a refutation of the METHOD or a failure
        of an IMPLEMENTATION, and so whether continued measurement under v1
        is within contract. If the review finds that the rule fired,
        RUN-SEMBIN-5ed13e stays a valid record of observations and is read
        only under a successor contract or an additive amendment. It is never
        deleted or rewritten.
    - id: DV-9
      what: Manifest completeness and disclosed record defects.
      fact: >-
        manifest.yaml has the run schema's required top-level keys but no
        inference block (requested policy, resolved model; AGENTS.md
        "Artifact policy"). Whether environment.json or the lane records carry
        it was not checked here. NOTES.md "Record defects" discloses that
        per_D[*].solutions_source mislabels the source in every closure
        record, and that n = 45 draw 4 inherits a process-wide
        checkpoint_resumes count. Both are disclosed, not rewritten.
      disposition: >-
        Referred to the validator. If the inference block is confirmed
        missing, the remedy is an additive manifest supersession through
        tools/run_supersession_registry.yaml (RUN-CERTBIN-6ebb0e D-1
        precedent), never an edit.

  validity_precheck:
    summary: >-
      The Coordinator's gate before interpretation. It admits RUN-SEMBIN-5ed13e
      to the record and to review. It does NOT admit it to interpretation.
    expected_run_count: >-
      PRIMA FACIE CONSISTENT with the declared design: six lanes
