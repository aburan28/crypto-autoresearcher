    - coordination/goals/GOAL-SEMBIN-5078bc/lanes/BATCH-457504.closed.json (the goal's only lane, closed)
    - ledger/handoffs/TASK-20260916-1edd4c.yaml, ledger/decisions/DEC-20261003-e2a917.yaml (R2), ledger/handoffs/TASK-20260917-619c31.yaml, ledger/decisions/DEC-20260926-1adf4e.yaml (precedents)

