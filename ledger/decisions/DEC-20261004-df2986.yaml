  impediments_raised:
    - id: IMP-SEMBIN-9BB990-STORAGE
      raised: '2026-10-04'
      recorded_under: DEC-20261004-df2986
      condition: >-
        pause_conditions item 3 ("A frozen protocol, archive binding, or
        required independent review is unavailable"): no archive binding is
        possible for RUN-SEMBIN-9bb990. Its package (about 1.2 GB, about 1.1
