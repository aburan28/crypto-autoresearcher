      given_in: the executing (executor) session, to that session, by the user
      provenance: >-
        Quoted in experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-5ed13e/NOTES.md
        "Authority and scope" and relayed in the same words by the dispatching
        session's brief to this Coordinator. This Coordinator did not observe
