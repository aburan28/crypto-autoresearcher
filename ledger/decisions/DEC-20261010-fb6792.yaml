coordinator_decision:
  id: DEC-20261010-fb6792
  recorded_at: '2026-10-10'
  decided_at: '2026-10-10'
  decided_by: coordinator
  question_ids: [RQ-GFPN-c01af8]
  goal_id: GOAL-GFPN-380702
  archived_by: TASK-20261010-7e1601
  mode: archive_integrity_recovery
  decision: supersede
  target_ids:
    - CORR-20261010-db44b4
    - TASK-20260925-0ed1be
    - TASK-20260925-480d02
    - TASK-20261010-0fda2f
    - TASK-20261010-7e1601
  context: >-
    Current main already tracks the four R2-r5 run packages and the
    execution report in five producer commits, with 771 changed paths
    confined to those five artifact scopes. The original archive card
    TASK-20260925-0ed1be has a verified Phase-A snapshot receipt but no
    Phase-B receipt. Its Phase-B one-commit changed-path gate is now
    impossible without altering immutable producer provenance. The
    returned executor task released its claim with outcome completed;
    its report records an infrastructure stop at G3 and a separately
    disclosed G4 sequencing deviation.
  ruling:
    - >-
      Leave TASK-20260925-0ed1be Phase B incomplete. Its Phase-A result
      stands. Supersede only the impossible Phase-B archival method with
      TASK-20261010-0fda2f; do not mark the old Phase B complete.
    - >-
      Bind each of the 771 existing paths by SHA-256 and originating
      full commit SHA, verify the exact per-scope changed-path inventory
      and content at each originating commit and at HEAD, then commit a
      new content-first receipt under the successor task. No run file,
      report, frozen plan, old receipt, or old card is edited.
    - >-
      Archive tools/verify_content_first_custody.py with this decision
      packet before the successor starts. The successor records its
      source hash and uses that committed verifier for the final
      post-commit exact-content and scope gate.
    - >-
      Carry forward every original Phase-B check that is still
      applicable: Phase-A and earlier run hashes, reserved-id accounting,
      isolated r5 checker outputs on all four packages, REG-1 and
      solver-event presence, VA-7 forbidden-id byte sweep, gate and RB-4
      admission reading, per-clause SSF and callgrind counts. Report a
      failed check as a finding; never modify a package to pass it.
    - >-
      The new receipt commit is a custody record for pre-existing
      producer commits. It must state that its own changed paths consist
      of the new receipt only, while its bound paths live in the five
      earlier commits. It must not pretend to be the old Phase-B commit.
    - >-
      If exact inventory, content, commit reachability, or a required
      check cannot be verified, stop with an integrity finding. Do not
      advance R2b-r5 or review. A clean verifier result permits a
      separate Coordinator decision on the G3 infrastructure failure,
      G4 deviation, and next experiment action; it is not that decision.
  rationale:
    - >-
      The current AGENTS.md allows the run entry point to commit and push
      its own run records and requires content-first archive binding;
      this successor makes the producer commits and their exact bytes
      auditable while preserving the stronger scientific gates.
    - >-
      The old Phase-B verifier would reject a receipt-only commit, and
      an empty or cosmetic run-file change would misrepresent provenance.
    - >-
      An additive correction and successor task preserve the historical
      contract and show precisely why the archival method changed.
  evidence_refs:
    - CORR-20261010-db44b4
    - experiments/EXP-GFPN-05ff43/execution-report-v2-r5.yaml
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260925-0ed1be/snapshot-receipt.json
  limitations:
    - This decision launches no scientific trial and does not score the R2-r5 packages.
    - G3 is an infrastructure stop; G4 requires an explicit subsequent admissibility ruling.
    - >-
      Successor custody is conditional on a verifier accepting the
      exact content and provenance. It does not waive a failed check.
  next_actions:
    - >-
      Snapshot-archive this additive packet under TASK-20261010-7e1601,
      push it, then dispatch TASK-20261010-0fda2f alone under its
      declared preconditions.
    - >-
      After the successor receipt verifies, make a separate Coordinator
      ruling on G3, G4, and the stopped gate before any R2b-r5 or review.
  knowledge_promotion:
    promoted: []
    not_warranted: A process correction and archive decision are not scientific evidence.
