    - ref: DEC-20260913-74e208
      provenance: internal
      claim: >-
        Queued exactly these three corpus actions, with promoted deliberately empty and
        a not_warranted reason stating that a separate decision would carry them.
      verified_by: coordinator, 2026-09-13
    - ref: KN-OPEN-028
      provenance: internal
