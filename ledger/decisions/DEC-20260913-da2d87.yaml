      verified_by: >-
        coordinator, 2026-09-13; read its frontmatter and section headings to follow the
        established shape rather than inventing one

  limitations:
    - >-
      PROMOTING A FINDING DOES NOT STRENGTHEN IT. KN-FIND-9643e7 inherits every scope
      limit of EV-SEMBIN-1d36a3 exactly: heuristic estimate, no curve instantiated, no
      relation computed, no Groebner basis run, no certificate, and eq. (11) consumed
      as published and unmeasured.
    - >-
      NO STATEMENT ABOUT THE SECURITY OF ANY CURVE, IN EITHER DIRECTION, is made or
      implied by any of the three corpus records touched here.
    - >-
      NO DEGREE IS MEASURED OR ASSERTED. Assumption 1 is carried as an unvalidated
      premise in both records, and its failure mode at degree 5 (+19.4 bits at n = 409)
      is LARGER than every effect either record discusses. IMP-SEMBIN-ENGINE records why.
    - >-
      KN-FIND-9643e7's closure could be inverted by a single outstanding measurement
      (EXP-SEMBIN-354a75), which is running. If it inverts, the correction is a NEW
      superseding finding, never an edit to this one.
    - >-
      The KN-FIND identifier was minted as a random 6-hex token and checked free by
      repository search, because tools/allocate_id.py carries no pattern for KN-* ids.
      That is the same collision-avoidance property as the ledger types -- a random token
      scans no state and so cannot converge -- but it is NOT machine-verified by
      --check, and a concurrent worktree minting KN-FIND ids the same way relies on the
      token space rather than on a checker.

  next_actions:
    - >-
      Nothing is required of a downstream agent by this decision. The three ranked
      experiments continue: EXP-SEMBIN-92724f (TASK-20260913-80bae1) and
      EXP-SEMBIN-354a75 (TASK-20260913-4df669) are running, and EXP-SEMBIN-2c40bb
      (TASK-20260913-39f7a4) is approved and awaiting dispatch.
    - >-
      IF EXP-SEMBIN-354a75 SHOWS eq. (11) OVERSTATES YIELD MORE AT t = m THAN AT t < m,
      author a new finding superseding KN-FIND-9643e7 and reopen KN-OPEN-94f456's
      optimization side by reference. Do not edit either record.
    - >-
      When EXP-SEMBIN-2c40bb returns, KN-OPEN-86e7e1 becomes answerable in its sharpened
      form. It is not answerable before that, and a corrected slice must not be promoted
      as the answer.

