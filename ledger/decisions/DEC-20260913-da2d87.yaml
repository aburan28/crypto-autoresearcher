  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-SEMBIN-20260913-9d649f

  decision: perform_queued_knowledge_promotion
  decision_label: >-
    Perform the three corpus actions DEC-20260913-74e208 queued: promote the
    short-chain obstruction as KN-FIND-9643e7, close KN-OPEN-94f456 as an
    optimization question under eq. (11) only, and restate KN-OPEN-86e7e1 -- which
    stays open -- because the round showed its question was malformed.

  context: >-
    DEC-20260913-74e208 composed REVIEW-SEMBIN-20260913-9d649f and recorded
    knowledge_promotion.promoted as an EMPTY list with an explicit note that the
    entries were queued rather than performed, because a knowledge entry is authored
    under its own task and listing a corpus record that does not exist would be the
    same fabrication as recording an attestation one did not obtain. This decision
    performs them and is the record that carries the promotion.

  target_ids:
    - KN-FIND-9643e7
    - KN-OPEN-94f456
    - KN-OPEN-86e7e1
    - DEC-20260913-74e208
    - EV-SEMBIN-1d36a3
    - EV-SEMBIN-71e5cd

  official_transitions:
    KN-FIND-9643e7:
      from: null
      to: added
      basis: >-
        Promoted from EV-SEMBIN-1d36a3 under the knowledge-promotion gate. Carries the
        obstruction as a MEASUREMENT with units, error bars, the runs it is read from,
        and its scope -- not as prose -- so a later session can compare or re-scope it
        rather than re-open the lane by intuition. confidence: proved,
        evidence_level: derivation, proof_status: derivation: the yield law is derived
        analytically from eq. (11) and confirmed numerically to 0.346 bits worst case,
        and two implementations sharing no code agree on the optimum at every n. It is
        NOT a certificate and the record says so.
    KN-OPEN-94f456:
      from: open
      to: closed_scoped
      basis: >-
        Closed on the closure standard in AGENTS.md "Inventor protocol": a named
        obstruction, an argument, a measured quantity with units and scope, and forward
        guidance naming what remains open. The body of the record is UNCHANGED and the
        closure is APPENDED; the frontmatter gains the scope, the still_open_in list,
        and the pointer to KN-FIND-9643e7.
      what_stays_open: >-
        Three things, recorded in still_open_in rather than implied. (i) Any yield law
        other than eq. (11). (ii) The inverting confound -- if realized yield falls
        short of eq. (11) more at t = m than at t < m the closure flips, and
        EXP-SEMBIN-354a75 is measuring exactly that. (iii) THE HALF OF THE ORIGINAL
        QUESTION THAT WAS NEVER ADDRESSED: the record asked both whether t is a free
        cost parameter AND whether the trade-off becomes exponent-relevant where
        Assumption 1 fails. Only the first is answered. No degree was measured, because
        none can be on this host (IMP-SEMBIN-ENGINE), and KN-OPEN-d218ec stays the
        prerequisite. A closure that quietly dropped the second half would have
        overstated itself.
    KN-OPEN-86e7e1:
      from: open
      to: open
      basis: >-
        NOT CLOSED, AND DELIBERATELY SO. The round did not answer this question; it
        showed the question was malformed. "What is the memory-charged crossover"
        presumes a number, and the answer is a surface over (metric x store x
        processors x kappa) of which the first published answer was one undeclared
        slice. Closing it on the strength of a corrected slice would repeat the exact
        error the round found. The frontmatter gains the restatement, what the first
        attempt DID establish (retained as progress), the six sharpening findings, and
        four concrete resolution routes; the body is unchanged and the restatement is
        appended.

  rationale:
    - >-
      THE PROMOTED CONTENT IS THE MEASUREMENT, NOT THE VERDICT. A negative result is
      reusable only if a later reader can compare their own numbers against it, so
      KN-FIND-9643e7 leads with the table: 27.68 to 44.00 bits of yield lost per link
      at the FIPS labels against at most 2.59 bits of solving cost saved at t = m,
      increments that decrease rather than grow, a verified unsaturated-regime margin
      of exactly 1.0 bit with zero saturated cells, and the analytic law agreeing with
      exact eq. (11) to 0.346 bits worst case. A prose statement that "short chains do
      not pay" would have been a fatigue report.
    - >-
      THE RESOURCE READING IS RECORDED EVEN THOUGH IT IS UNFLATTERING, which is the
      point of requiring it. The blocking quantity is the t! symmetry factor -- the same
      object H-SEMBIN-c59e50 claims coset typing removes. Removing it RAISES the
      per-link charge from k - log2(t) to k, from 33.72 to 37.18 bits at n = 409,
      m = 11, so the typed construction closes this lane HARDER. Anyone reaching for
      typing to open an interior optimum in t should expect the opposite, and that is a
      cheap falsifiable consequence of the typing claim rather than an objection to it.
      The genuinely useful half of the reading is that the per-link charge is a
      calibrated ruler for whether the typing works at all, because the yield law fixes
      what arm D of EXP-SEMBIN-92724f must find if the symmetry factor is gone.
    - >-
      RESTATING AN OPEN PROBLEM IS PROGRESS AND IS RECORDED AS SUCH. KN-OPEN-86e7e1
      keeps five concrete gains from the first attempt -- that the paper states no memory
      model at all, the exact variable count from two sections, the textually grounded
      relation store, that charging memory moves the crossover UP by more than was
      reported, and that Semaev's cheapest memory at n = 409 is four exabytes -- and adds
      the sensitivity table that shows why the original question could not have had a
      single answer. An open problem that has been sharpened is more valuable than one
      that has been closed on a corrected slice.
    - >-
      NEITHER OPEN-PROBLEM BODY WAS REWRITTEN. Both closures and restatements are
      appended sections plus additive frontmatter, per core rule 4. The one thing that
      changed in place is KN-OPEN-94f456's status field, which is what a status field is
      for and which follows the single precedent in this corpus (KN-OPEN-028).

