coordinator_decision:
  id: DEC-20260810-6b4554
  context: >-
    DEC-20260809-de11f9 set RQ-ICINV-475b5e (lane L1, GOAL-ENDO-001's gating
    lane) to `pause` after EXP-ICINV-4d33aa terminated INVALID for the second
    time. Both terminations were admissibility failures in the SR3
    baseline-reproduction control, not results: version 1 compared Arm A0
    against a baseline measured at different parameters (CORR-20260807-14431d,
    repaired by v2's change A1), and version 2 failed even though A1 worked
    exactly as designed -- the re-measured p = 6007 baseline used the correct
    frozen grid (T = 400, thirteen factor-base sizes) and Arm A0 reproduced it
    at 13 of 13 rows with max_abs_delta_vs_reference 0.0 -- because the
    correctly re-measured baseline ITSELF crosses below the [1.3, 3.6] band
    floor at its two lowest-density rows (fb = 4: 1.2315292605941532; fb = 5:
    1.1125313273888915). That pause decision reserved the redesign question
    explicitly to the user: a third attempt "is a user decision, not dispatched
    automatically", and it named three candidate redesigns (a), (b), (c) in its
    next action N10-v3.
  decision: approve
  target_ids:
  - GOAL-ENDO-001
  - BATCH-de621d
  - RQ-ICINV-475b5e
  - EXP-ICINV-4d33aa
  - TASK-20260810-dca469
  rationale:
  - >-
    THE AUTHORITY FOR THIS DECISION IS THE USER'S ELECTION, NOT A COORDINATOR
    SELF-GRANT, AND THAT DISTINCTION IS THE FIRST THING THIS RECORD STATES. On
    2026-08-10 the user was presented with DEC-20260809-de11f9's three named
    candidates and ELECTED CANDIDATE (b): replace SR3's literal [1.3, 3.6] band
    membership with a statistical comparison against the reference run's own
    estimated sampling uncertainty. This Coordinator did not choose the
    direction of the redesign and had no power to lift a pause that
    DEC-20260809-de11f9 reserved to the user. What this Coordinator did is
    author that design and freeze it numerically before any execution. THE
    ELECTION CLEARS THE PAUSE FOR GATE DESIGN ONLY; it authorises no compute.
  - >-
    THE DEFECT BEING REPAIRED IS ADMISSIBILITY, AND IT IS WORSE THAN
    DEC-20260809-de11f9 STATED. That decision described a third attempt under
    the unchanged gate as having "a materially non-trivial chance" of crossing
    the floor again "on a fresh draw". Read from
    experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-99f722/baseline-reproduction.json:
    Arm A0 and the reference agree at `n_rows_exactly_reproduced: 13` of 13 with
    `max_abs_delta_vs_reference: 0.0` at BOTH primes, because Arm A0 calls the
    committed exp_icinv.targets_uniform at the same seed (20260807), on the same
    class, at the same T = 400, over the same thirteen factor-base sizes as the
    reference. The two measurements are identical by construction. A third run
    under the unchanged SR3 would therefore reproduce the fb = 4 and fb = 5
    crossings WITH CERTAINTY, not with probability. The gate as written is
    unsatisfiable.
  - >-
    THE DIAGNOSIS IS NOT POST-HOC AND IS NOT THIS COORDINATOR'S. Amendment v2's
    standing caution A5, filed 2026-08-07 BEFORE the run that exposed it
    existed, recorded that "[1.3, 3.6] IS THE OUTWARD-ROUNDED HULL OF THE
    COMMITTED ROWS THEMSELVES: floor slack 0.020397, ceiling slack 0.011900...
    any successor that keeps it must expect legitimate sampling variation to
    cross it." A hull fitted to one historical sample with under 2% floor margin
    encodes that sample's noise, not the estimator's; and in any case whether
    the reference's absolute level lies inside a hull is a fact about the
    reference, not about whether Arm A0 reproduced it.
  - >-
    THE REDESIGN IS FROZEN NUMERICALLY AND COMPLETELY, WITH NO FREE PARAMETER
    LEFT TO CHOOSE AFTER A RESULT. Filed at
    experiments/EXP-ICINV-4d33aa/amendments/v3.yaml, block
    `sr3_v3_frozen_specification`: per-row test statistics z_j on the mean rate
    and w_j on the variance ratio; an uncertainty estimator that is the sampling
    distribution of the per-row decomposition-rate estimate under
    Binomial(T, mu_c) target draws on a fixed curve set, fixed by n_targets, the
    curve count and the row's own rate, including the exact binomial excess
    kurtosis gamma2_j; THE FROZEN ACCEPTANCE THRESHOLD |z| <= 3.5 AND |w| <= 3.5,
    two-sided, with the multiple-comparison family declared as 13 rows x 2
    primes x 2 statistics = 52 tests, a family-wise false-rejection probability
    of 0.023908 at that threshold, and the note that 3.5 is STRICTER than the
    Sidak value 3.7276 that a 1% family-wise rate would license; an aggregate
    rule permitting at most 1 of 13 rows to fail per prime (>= 12 of 13, both
    primes independently); an operating-row rule requiring the row nearest
    density 1/3! to be among the passing rows and to satisfy the contract's own
    unchanged +-0.25 tolerance both against the reference's operating value and
    against the contract's prose values 1.918 (p = 4001) and 1.591 (p = 6007);
    a curve-set identity check; a degenerate-row rule; and the whole-gate
    false-failure probability, approximately 2.0e-3, computed from the frozen
    constants.
  - >-
    THE LOOSER GATE BUYS NO STRONGER CLAIM, AND IN THE RESPECT THAT MATTERS IT
    IS TIGHTER. The 1.3 threshold is untouched everywhere it does evidential
    work: state_2's persistence statistic still requires ARM B's VR_pooled > 1.3,
    PERSISTS still requires F_p >= 1/2, the three-prime majority, S1/S2/S3, the
    OUTCOME-A/B/C definitions and the falsification criteria F-i to F-v are all
    unchanged and listed as such. Only the ADMISSIBILITY use of the band is
    retired. Meanwhile the retired band would have accepted an Arm A0 reading
    3.6 against a reference of 1.5787641552269556 -- a 128% discrepancy -- as a
    successful reproduction, whereas the new per-row rule admits about 4.9% on
    the rate at that row. Passing SR3-v3 licenses nothing the prior gate would
    have denied.
  - >-
    THE POST-HOC RISK IS NAMED IN THE AMENDMENT'S OWN WORDS AND ITS INFORMED
    ELEMENTS ARE DECLARED RATHER THAN DRESSED AS DERIVATIONS. This is the third
    SR3 design after two failures, written by a Coordinator who knows which rows
    failed and by how much; a control redesigned until it stops firing is not a
    control. The mitigation is that the acceptance region at every row is a
    function of (T, n_j, m_j, VR_ref_j) and of nothing else, none of which is a
    function of which rows failed. The amendment nonetheless DECLARES five
    elements that were in fact informed by the observed outcome: the decision to
    redesign at all; the user's choice of direction, made with the failed rows
    in view; retiring the band knowing where the reference crosses; retaining
    G3b and G4 as gating knowing both passed; promoting G3c to gating knowing it
    passed; and the kurtosis correction, whose effect is largest at exactly the
    rows that failed (quantified at 3.4% at p = 6007 fb = 4, and therefore not
    doing the work of the repair). It also records the check that the aggregate
    tolerance was NOT reverse-engineered: two rows crossed, and the rule permits
    only one failure, so it would not have rescued the observed failure.
  - >-
    KNOWN LIMITS OF THE NEW GATE ARE DISCLOSED IN THE AMENDMENT, NOT BURIED.
    (i) Under the frozen seed the differences are identically zero, so on this
    configuration G2 is a deterministic implementation-identity check and not a
    statistical test -- it exercises the threshold 3.5 not at all, and a reader
    must weigh a version-3 SR3 pass accordingly. (ii) HEUR-SR3-2 (zero excess
    kurtosis of the mixing distribution of true per-curve rates) is an
    assumption, is labelled as one, is unvalidated, and if wrong makes the w
    test anti-conservative; the residual fresh-draw risk is quantified at order
    5e-2 in the adverse case and a non-gating reporting requirement is scheduled
    as its validation. (iii) The contract's +-0.25 operating-row tolerance is
    retained UNCHANGED and disclosed as thin against any future re-draw
    (approximately 1.08 and 1.25 estimated sampling standard deviations at the
    two operating rows); it is deliberately NOT widened, because widening a
    threshold after seeing it pass is the mirror image of the move these rules
    exist to prevent.
  evidence_refs:
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v2.yaml
  - experiments/EXP-ICINV-4d33aa/specification.yaml
  - experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-99f722/baseline-reproduction.json
  - experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-99f722/decision-rule-evaluation.json
  - ledger/decisions/DEC-20260809-de11f9.yaml
  - ledger/corrections/CORR-20260807-14431d.yaml
  - ledger/handoffs/TASK-20260810-dca469.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/task-cards/TASK-20260810-dca469.md
  limitations:
  - >-
    NEITHER PRIOR TERMINATION IS EVIDENCE, AND THIS DECISION CREATES NONE.
    Both version-1 and version-2 INVALID terminations are admissibility failures
    in the gate and bear on H-ICINV-6c7920 and on EV-ENDO-10109d in NEITHER
    direction (DEC-20260809-de11f9). No hypothesis status moves here, no evidence
    record is written, and EV-ENDO-10109d is untouched.
  - >-
    THIS DECISION APPROVES A PROTOCOL AMENDMENT, NOT A RUN. Under AGENTS.md rule
    1 a version-3 execution needs its own Coordinator approval and its own
    handoff. Nothing was executed and nothing was dispatched by this task
    (executed_runs 0); no command was run and no command output is stated
    anywhere in the amendment or in this record.
  - >-
    THE REDESIGN IS UNAVOIDABLY POST-HOC IN DIRECTION. It exists because two
    runs failed, and the user chose among candidates with the failed rows in
    view. The amendment's `post_hoc_risk_disclosure` block enumerates every
    element informed by the observed outcome. What is claimed is narrower than
    "the design is untainted": it is that the acceptance region's SIZE at each
    row is derived from the estimator and not fitted to the sample, and that
    every element which was informed by the outcome is named.
  - >-
    THE STATISTICAL CONTENT OF THE NEW GATE IS UNEXERCISED ON THE FROZEN
    CONFIGURATION. Arm A0 and the reference share seed 20260807 and the same
    sampler, so z_j = w_j = 0 by construction. SR3-v3 on this configuration is an
    implementation-identity check plus the operating-row and monotonic-decay
    anchors. Its statistical form matters only if a future amendment changes the
    seed, T, the curve set or the sampler.
  - >-
    HEUR-SR3-2 IS DECLARED AND UNVALIDATED. No claim in the amendment or in any
    version-3 run may be stated as if it were validated; a non-gating per-row
    kurtosis report is the scheduled validation, and it may not be used to adjust
    any threshold in the run that produces it.
  - >-
    NUMBERS COMPUTED BY HAND IN THE AMENDMENT'S ILLUSTRATIVE ANNEX (standard
    errors, the kurtosis inflation, the false-failure probability, the Sidak
    threshold 3.7276) ARE ARITHMETIC DERIVED IN THAT RECORD FROM COMMITTED
    INPUTS AND FROZEN FORMULAE. They are explicitly non-gating; if a run's
    computation disagrees, the run's computation governs and the discrepancy is
    a correction against the annex.
  - >-
    TOY SCALE THROUGHOUT. p in {2003, 4001, 6007}, `claim_tier: toy`,
    `sota_delta` zero. Nothing here asserts anything about ECDLP hardness in
    either direction, and no version-3 result could, since the
    `exploratory_only` status and the unconditional `preliminary` evidence cap
    are carried forward unchanged and strengthened.
  next_actions:
  - >-
    N10-v3 IS DISCHARGED AS TO GATE DESIGN. The frozen amendment is
    experiments/EXP-ICINV-4d33aa/amendments/v3.yaml. RQ-ICINV-475b5e's pause is
    cleared FOR GATE DESIGN ONLY and remains in force for execution.
  - >-
    N10-v3-EXEC, NOT DISPATCHED BY THIS DECISION. A version-3 execution of
    EXP-ICINV-4d33aa requires (i) a separate Coordinator approval decision and a
    separate Executor handoff under AGENTS.md rule 1, and (ii) satisfaction of
    v2's BLOCKING change A6 -- every run manifest pins the hash of every source
    file it executes, verified with tools/check_run_source_provenance.py
    --strict. It must also implement A9: read RUN-ICINV-p4001-fixed and
    RUN-ICINV-f09176 at run time, verify their SHA-256 digests, and NEVER
    re-measure or substitute a reference.
  - >-
    N10-v3-REVIEW, RECOMMENDED BEFORE EXECUTION. This is the third SR3 design
    authored by a Coordinator who has seen the failures. An independent review
    pass over v3.yaml -- specifically over `post_hoc_risk_disclosure` and over
    whether HEUR-SR3-2 is stated honestly enough for the weight the w test puts
    on it -- would be cheap and is the kind of check the previous two designs
    lacked. Not dispatched here.
  - >-
    N7 (carried, unchanged). Re-dispatch the RQ-CANL-63098f lane.
  - >-
    N11 (carried, unchanged). The two_torsion_x lead at POOL_C R4 (R = 0.647),
    flagged not claimed, needs a cheap control before any chase.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, AND NOT A CLOSE CALL. This is a control-design decision on a
      toy-scale instrument. It reviews no evidence, moves no hypothesis, and its
      decision is `approve` rather than `support` or `reject_scoped`, so the
      promotion trigger does not fire. There is no positive or negative finding
      about isogeny structure here in either direction. The one durable lesson --
      that an acceptance band fitted as a hull to the sample it gates will be
      crossed by ordinary sampling variation, and that such a band is an
      illegitimate admissibility criterion even where it is a legitimate
      description -- is already recorded in amendment v2's caution A5 and now in
      v3's reason block, and is a methodological note about this campaign's own
      gates rather than a corpus-worthy result. If a version-3 run reaches a
      valid OUTCOME state, the promotion question is reopened at that review.
  decided_by: coordinator
  decided_at: '2026-08-10'
  decision_authority: >-
    USER. The election of candidate (b) from DEC-20260809-de11f9's N10-v3 was
    made by the user on 2026-08-10. This Coordinator authored and froze the
    design under that election and records the decision; it did not grant itself
    the authority to resume a lane that DEC-20260809-de11f9 reserved to the user.
  inference:
    requested_policy: coordinator-orchestration
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one model
      the session runs on (CLAUDE.md model policy note). Recorded, never
      silently substituted (AGENTS.md rule 11). Requested policy
      `coordinator-orchestration`; the model that actually answered is
      claude-opus-5. This is the documented harness-wide fallback rather than a
      downgrade chosen by this task, and it is the same fallback recorded in
      EXP-ICINV-4d33aa's specification.yaml and amendments/v2.yaml.
    degraded_allowed: false
    degraded_requirements: []
