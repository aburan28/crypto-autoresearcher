  rationale:
    - >-
      THE KNOWN-BAD CONTROL RAN AND THE FROZEN PREDICATE WAS APPLIED
      LITERALLY. The disposition worksheet recomputed detect() from
      trials.json using loc(t)/planted(t)/true(t) taken from the frozen
      contract known-bad-control.json, not from the producer report, and
      scored the four instruments by the frozen formula. The predicate was
      not relaxed. The four verdicts are A partially_sensitive, B sensitive,
      C insensitive, D invalid.
    - >-
      A-T4 AND A-T5 ARE DETECT-FALSE UNDER THE FORMULA, WITH AN OTHERWISE
      CHANNEL RECORDED BESIDE THEM. detect(A,T4) is false because the
      declared_value conjunct fails (mapped declared_value is null; planted
      is 4c72c94c7b78a04fef16aadd455523aeede5bbbd). detect(A,T5) is false
      because the observed_value conjunct fails (mapped observed_value is
      'does not resolve to a commit'; true is
      26d93c7c857db115beea37ee862f046f6047058c). Both cells carry a handled
      DispatchError on stderr, returncode 2. The formula's answer stands;
      the otherwise channel is recorded beside it; re-scoring either cell as
      detect true would require a versioned protocol_amendment recorded
      before re-scoring. This decision does not re-score them.
    - >-
      THE VALIDATOR'S FOUR JOINTS HOLD IN A ONE-REVIEWER ROUND. TASK-20260907-6fbd6d
      returned J1 holds, J2 holds, J3 holds, J4 holds, and
      whole_claim_verdict null, as required. Mutual blindness between
      reviewers is vacuous and was declared as such in review_plan
      RR-BATCH-127c82-1. review_attestation.verdict 'holds' is the
      joints-owned attestation, not a verdict on the claim under review.
      This Coordinator composes; it does not treat the attestation as a
      whole-claim vote. The Validator did not refuse and did not degrade.
    - >-
      THE COORDINATOR PRIOR WAS CONFIRMED, NOT OVERTURNED. The prior on
      TASK-20260907-6fbd6d predicted A partially_sensitive on exactly the
      T4 declared_value / T5 observed_value shortfalls, B sensitive (weak
      by construction), C insensitive and D invalid. The worksheet records
      prior_overturned false. Concurrence with a recorded prior is a
      different finding from concurrence with an unrecorded one.
    - >-
      IMP-3'S FIRST RECHECK CONDITION IS SATISFIED AND ITS SECOND IS
      UNTOUCHED, SO IMP-3 DOES NOT CLEAR. The first condition — execution
      of BATCH-2cca27's known-bad control with planted-defect detection
      recorded, specialised as KBC-BATCH-127c82 under DEC-20260907-ca563a —
      was executed by TASK-20260907-39511d, snapshot-archived at bfd34aec,
      and independently reviewed. The second condition — a served xhigh
      binding from a credentialed backend, probe-verified, with the serving
      session independent of the producer — is untouched: this lane forbade
      network; producer, Validator, and this Coordinator all record
      model_verified false and did not run doctor --probe. Clearing IMP-3
      on the first alone is forbidden by DEC-20260907-ca563a and by this
      lane's own contract.
    - >-
      DEC-20260905-6e8621'S DISPOSITION STANDS EXACTLY AS GIVEN. Nested
      IMP-1 stays cleared (not reopened, not re-cleared). Top-level IMP-1
      stays partially_cleared (not moved). IMP-2 stays out of scope. This
      decision does not rewrite that disposition.
    - >-
      NEITHER COMPLETION CRITERION IS MET. Criterion 1 requires an
      independently reviewed standalone toy-polynomial benchmark package;
      no such package exists; this lane executed a control-plane
      sensitivity measurement with zero solver invocations. Criterion 2
      requires a committed Coordinator decision answering selected RQ
      attribution questions; this decision answers a control-plane
      sensitivity and impediment-recheck question; RQ-SATIC-1ae57a is
      untouched. An integrity-control disposition is further from an
      attribution answer than design intake is, not closer.
    - >-
      NO ATTESTATION THAT WAS NOT OBTAINED. model_verified is false on the
      producer, the Validator, and this Coordinator. The configured
      binding coordinator-orchestration-code -> anthropic:claude-opus-5
      (effort=high) is configuration, not a probe. This session
      self-identifies as cursor:grok-4.6. Both are recorded. The requested
      policy was not substituted. fallback_used false. degraded_allowed
      false. bedrock_used false.

