  recorded_at: '2026-08-05'
  amends: DEC-20260805-77a735  # adds case resolution from paper body

  decision: case_c_confirmed_from_paper_body
  decision_label: >-
    Full body text of iacr:2026/1318 provided by user (2026-08-05). Case C
    confirmed: algorithm samples bounded-norm β → bounded denominator O_F-ideals
    → density → 0 as bound grows → super-polynomial (no upper bound without
    further analysis). Our BATCH-56498f/d44912 derivation for the quaternion
    algebra was correct; the paper's Section 9 correction is about the number
    field O_F but rests on the same mathematical principle.

  context: >-
    User provided the complete text of iacr:2026/1318 in the research session.
    The paper body resolves the remaining uncertainty about which case (A/B/C)
    applies to the GuessingGame algorithm. Heuristic 4 (Section 9) gives the
    exact counting argument and its flaw.

  paper_body_key_findings:
    heuristic_4_exact_statement: >-
      "There are at most O(n^{1+o(1)}) ideals of O_F with relative norm q'O_K
      with overwhelming probability. Given that one of these ideals is principal,
      the probability that a itself is principal is Ω(n^{-1-o(1)})."
      — Section 9, Algorithm 2 context. O_F = ring of integers of F = K(√α).
    error_location: >-
      The count O(n^{1+o(1)}) used only INTEGRAL O_F-ideals: those with O_F-norm
      q'O_K and no denominator. Fractional O_F-ideals (fractional in the Dedekind
      domain sense: J = (1/r)·I with N_{F/K}(I) = r²·q'O_K for r ∈ O_K) were
      omitted. These are "many" per 30/06 correction.
    case_c_confirmed: >-
      Algorithm 2 Step 18 (Section 6.3): β is reduced with ‖β‖ < O(n^{13/2})
      using Babai rounding. This BOUNDS the denominator r of any fractional ideal
      accessible to the algorithm. The search is therefore over a BOUNDED subset
      of fractional O_F-ideals — exactly Case C. As the bound grows, density → 0.
    complexity_confirmation: >-
      "The main algorithm appears to run in super-polynomial time" (30/06 update).
      Case C: O(q'·R³) pool for denominator bound R, with at most h(O_F) principal
      ideals in the pool, giving probability O(h(O_F)/(q'·R³)) → 0 as R → ∞.
      Super-polynomial runtime with no derivable upper bound from available theory.
    heuristics_1_to_3_verified: >-
      "Heuristics 1-3 have been independently experimentally verified" (30/06).
      These are confirmed experimentally; Heuristic 4 alone is the failed one.

  ring_disambiguation:
    our_batch_56498f_ring: >-
      BATCH-56498f/d44912 derivation: fractional LEFT O-ideals in the quaternion
      algebra A = (-1,-1|K), maximal order O. Correctly showed these are infinite
      for indefinite quaternion algebras. This is the ring for the nrd-PIP stage
      (Step 12 of Algorithm 2, creating I = Φ(G') ≤ O).
    paper_section_9_ring: >-
      Section 9 counting: fractional O_F-ideals in the ring of integers O_F of
      the number field F = K(√α). This is the ring for the Lenstra-Silverberg
      stage (Steps 25-28 of Algorithm 2). The paper's 30/06 correction applies here.
    consistency: >-
      Both the quaternion algebra O and the number field O_F exhibit the same
      mathematical principle: the set of fractional ideals with a given norm is
      infinite when denominators are unbounded. Our derivation confirms this for O;
      the paper's correction establishes it for O_F. Both are relevant to the
      algorithm's complexity analysis at different stages.

  kn_open_028_status: >-
    KN-OPEN-028 Q1 is now CLOSED at derivation level with paper-body confirmation.
    Answer: Case C. Algorithm samples from bounded fractional O_F-ideals; density
    → 0 as bound grows; runtime is super-polynomial with no derivable upper bound.
    No sub-exponential advantage over the Straznickas-Weis 2^{n/2+1+o(n)} classical
    baseline is established from available theory.

  knowledge_promotion:
