coordinator_decision:
  id: DEC-20261017-3fa9e1
  recorded_at: '2026-10-17'
  question_ids:
  - RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  kind: protocol_approval
  context: >-
    IDEA-20261010-066c44 (proposed, open, ECC area SEMBIN, under GOAL-SEMBIN-5078bc) asks whether the minimal
    refuting mutant-closure degree D_W of enumeration-certified UNSAT chained-S_3 descended decompositions stays
    4 as the arity m grows from 3 to 5, which operationalises Semaev 2015 Assumption 1 (d_F4 <= 4) on the UNSAT
    arm. It is designed here as H-SEMBIN-106967 and the frozen contract EXP-SEMBIN-d9767f, a heuristic-validation
    experiment over nine toy cells (m in {3,4,5}; n in {9,11,13,15}; |V| >= 8; poly and random V) with
    support-matched and dense nulls, two GF(2) eliminators, two exhaustive enumerators, an independent checker
    and a runbook for the mechanical tier. The three exploratory pilots under
    analysis/ecdlp2m-iteration-20261009/ are provenance for the cell choice only, never evidence. No speedup is
    claimed and nothing is asserted about n = 131 or any deployed curve.
  decision: approve
  decision_scope: >-
    APPROVES EXP-SEMBIN-d9767f at version 1 (six trials: RUN-SEMBIN-07f442 m3-poly, RUN-SEMBIN-1ca24c m3-rand,
    RUN-SEMBIN-a7e245 m4-poly with the block-local secondary arm, RUN-SEMBIN-baa77d m4-rand, RUN-SEMBIN-bb9a72
    m5-poly-and-rand, RUN-SEMBIN-d8aaa8 nulls-and-controls; seeds 20261017..20261022) and moves H-SEMBIN-106967
    to approved (pre-run). Authorizes execution through experiments/EXP-SEMBIN-d9767f/runbook.yaml (session
    RBS-SEMBIN-d9767f) under TASK-20261017-4ad232 in lane BATCH-9fcdf6 of GOAL-SEMBIN-5078bc. Asserts nothing
    about any hypothesis; authorizes no attack, no cost extrapolation and no run outside the frozen trial plan.
  target_ids:
  - RQ-SEMBIN-fa2e3f
  - GOAL-SEMBIN-5078bc
  - IDEA-20261010-066c44
  - H-SEMBIN-106967
  - EXP-SEMBIN-d9767f
