  - TASK-20261017-c6574f
  authorization: >-
    Standing user authorization of 2026-09-06 in AGENTS.md ("All is approved. Ideas/experiments should be
    always approved"); no per-experiment user confirmation is requested. The Coordinator's completeness check
    is recorded under protocol_completeness and the runnable condition under readiness_requirement.
  protocol_completeness:
    EXP-SEMBIN-d9767f:
      controls: present (C1 pilot gate m=3 n=9 poly, C2 m=2 chained control at (9,3) and (11,4), C3 SAT
        controls, C4 support-matched and dense nulls, C5 eliminator cross-check, C6 determinism replicate
        against RUN-SEMBIN-07f442)
      metrics: present (primary r_4 per cell with Clopper-Pearson 95%, false_refutations, M_4 count, D_W
        distribution; secondary codim/nsol, eliminator agreement, per-job cost fields incl. ops_proxy, null
        r_4, m=2 control rate, block-local L2adj1 columns and rate; JSON pointers into raw-result.json with the
        sembin.closure_degree.result.v1 field names)
      budget: present (36000 s per run, 50400 s for RUN-SEMBIN-bb9a72, 6 GB, 6 runs, 1 worker; per-job
        censoring at 6 GB RSS / 1800 s; advisory)
      stopping_rules: present
      invalidation_rules: present (false refutation, eliminator disagreement, enumerator disagreement, evalcheck
        mismatch, checker exit 3, C1/C6 failure)
      required_artifacts: present (manifest.yaml, raw-result.json, results.jsonl, instances.json per run; the
        environment record is raw-result.json /environment)
      preregistered_prediction: present (P1-P4 from IDEA-20261010-066c44 unadjusted; success at r_4 >= 0.9,
        falsification at r_4 <= 0.8, inconclusive between, per the IDEA's pre-registered thresholds)
      heuristic_validation: present (A1 = Semaev 2015 Assumption 1 stated with quantifiers and source,
        operationalised as D_W = 4 via the sketched inequality D_W <= d_F4; scale access toy only; sample-size
        justification; comparison metric; tail checks; controls)
      decision_impact: present (on_positive and on_negative differ)
      launcher: trial-plan.json, run.py, check.py and build.sh bound; runbook
        experiments/EXP-SEMBIN-d9767f/runbook.yaml, session RBS-SEMBIN-d9767f
      open_at_record_time: implementation source sha256 values are to be bound by the trial plan and the
        runbook; specification_sha256, trial_plan_sha256 and runbook_sha256 below are filled at freeze, before
        the snapshot commit, never after.
  readiness_requirement: >-
    This record takes effect only when committed together with the specification, trial plan and runbook whose
    sha256 it names, after tools/runbook.py lint prints LINT OK, tools/experiment_preapproval.py reports
    approvable true for the packet, and tools/newest_experiments.py --experiment EXP-SEMBIN-d9767f reports
    execution_state ready on the committed tree (AGENTS.md "Approval is bounded by execution"). All checks are
    run by the session that commits this record.
  capacity_check: >-
    The approved-unrun cap was removed on 2026-10-11 (AGENTS.md "Approval is bounded by execution"); approval
    rests on the runnable condition only. GOAL-SEMBIN-5078bc is an active ECC goal with unlimited campaign
    budget; the lane is BATCH-9fcdf6 (queue
    coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9fcdf6/dispatch_queue.json, max_concurrent 1), to be
    claimed with tools/goal_lanes.py before dispatch of TASK-20261017-4ad232.
  status_transitions:
  - record: EXP-SEMBIN-d9767f
    to: approved
    approved_by: coordinator
  - record: H-SEMBIN-106967
    from: proposed
    to: approved
    note: Pre-run approval; not supported. The hypothesis file keeps the status it was written with at design
      (proposed); this decision is the transition record.
  rationale:
  - The m axis is the one Semaev's cost family extrapolates along (m = 8..12 at the FIPS sizes) and no record
    in the ledger measures the refuting degree along it; the pilots cover m = 3 and 4 at one curve and one V,
    with m = 5 unmeasured at |V| >= 8 (m45-closure-pilot README).
  - The contract is a measurement of a premise (sota_delta none), toy scale, with both nulls, two eliminators,
    two enumerators, a determinism replicate and an independent checker, so each outcome has a pre-registered
    reading (IDEA notes section 4) and none can be mistaken for a speedup.
  - A1 is stated as a numbered heuristic with its source; its validation is this experiment, and the only
    rigorous link (D_W <= d_F4, sketch) is recorded as such, so a flat result reads as not contradicted, never
    confirmed.
  - Predictions, controls, falsification thresholds and H1-H4 are copied from IDEA-20261010-066c44 without
    adjustment; the Coordinator's design resolutions (seeds, random-V rule, curve selection, C2 cell, C6 seed,
    ops_proxy definition, schema fields, dense-null scope) fill operational gaps only.
  evidence_refs: []
  limitations:
  - Toy scale (n <= 15, m <= 5); no transfer to any cryptographic size; nothing about n = 131 or any deployed
    curve.
  - Cells at >= 124,314 columns are probable censoring cells under the 6 GB cap; a censored cell is never
    negative and an all-censored m=5 makes the contract inconclusive.
  - The host libm4ri is the 2020 release with a documented defect; the independent eliminator is primary above
    50,000 columns and both must agree.
  - check.py is producer-written; independent review with a blind recount precedes any status move.
  - Serving model for the executor-mechanical tier is unverified until the adapter probe confirms it.
