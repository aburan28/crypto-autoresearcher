coordinator_decision:
  id: DEC-20260830-69fb4d
  recorded_at: '2026-08-30'

  target_ids:
    - GOAL-ECDLP-001
    - H-CREP-001
    - EXP-CREP-001

  decision: revise
  decision_label: compact_zr_meet_in_the_middle_partial_improvement_obj8_resolved_still_over_cap

  context: >-
    Closes TASK-20260830-539561's Coordinator archive/review of
    TASK-20260830-53a818 (idea-generator), which investigated OBJ-5
    (compact/implicit z_R = gcd(g_I, r_R) construction within H-CREP-001's
    exponent caps), per DEC-20260830-d7b846 and KN-OPEN-701adf. Full
    independent verification recorded in
    compact_zr_construction_close_terminal_note_20260830 on
    ledger/goals/GOAL-ECDLP-001/goal.yaml.

  decision_scope: >-
    ACCEPTS as genuinely derived and independently re-verified: the
    resultant root-product identity (a correct double application of
    Res_x(f,g) = lc(f)^deg(g) * prod_{f(a)=0} g(a)) letting r_R(t_a) be
    computed as a product over the pair-decks' roots without ever building
    r_R's coefficient vector; Semaev's S_3 relation having fixed degree 2
    in each variable (independently confirmed against
    knowledge/techniques/KN-TECH-002.md, matching the general 2^(n-2) rule
    at n=3); and the resulting meet-in-the-middle exponent bookkeeping
    (Theta(B^3) online for the two-pairs reading, down from naive
    Theta(B^4); Theta(B^2) online for the one-pair reading, matching naive
    exponent but coefficient-vector-free), re-derived independently via
    direct loop-counting and confirmed correct. RESOLVES OBJ-8 (the
    per-query-vs-whole-target-set cost-accounting ambiguity the producer
    flagged as open) in favor of whole-target-set accounting -- FORECLOSED,
    not merely favored, by two sources the producer did not cite:
    H-CREP-001.yaml's own falsification_conditions ("Total fresh-target
    work or peak workspace, including all replay calls, exceeds
    B^(5/4+o(1))" -- aggregate language) and EXP-CREP-001/specification.yaml's
    V6_cost_caps predicate, which states the cap "at most 5/4 in B including
    every O(log B) ... query per tuple" while recording
    replay_calls_per_tuple as a SEPARATE test_boundary parameter from the
    cap itself -- consistent only with the cap summing over potentially
    many tuples in one online phase. Both candidate constructions
    (Theta(B^3) and Theta(B^2)) THEREFORE STILL EXCEED the B^1.25 cap by
    1.75 and 0.75 in exponent respectively, arithmetic confirmed by direct
    computation. REVISES the producer's proves-too-much control: its
    two-pairs degraded case (B^2 * B * B = B^4) exactly matches the real
    naive baseline, but its parallel one-pair claim -- that the method
    "degrades exactly back to the naive materialization cost" -- is
    incorrect: the degraded one-pair computation actually gives Theta(B^3)
    ((B*B) loop times B solve cost), while the real one-pair naive baseline
    is Theta(B^2), so the degraded method is strictly WORSE than naive, not
    equal to it. The control's directional conclusion (dependence on S_3's
    fixed degree) survives; its precision claim for the one-pair case does
    not and should be corrected if the control is reused. ACCEPTS the
    disposition no_construction_found_inconclusive as correctly scoped: no
    impossibility is claimed, and the method-ceiling audit is correctly
    scoped to this specific plain two-list meet-in-the-middle construction,
    not to all possible constructions.

  what_this_decision_does_not_do:
    - It does not change H-CREP-001's status (remains approved).
    - It does not change EXP-CREP-001's specification (remains frozen, unmodified).
    - It does not admit any B71, batch, experiment, or implementation.
    - It does not claim any construction meets H-CREP-001's caps -- both derived bounds remain over cap.
    - It does not derive or claim a lower bound or impossibility result for the construction-cost question in general; the method ceiling applies only to this specific meet-in-the-middle approach.

  non_claims:
    - The Theta(B^4)-to-Theta(B^3) improvement is a construction-cost bookkeeping result on an internal academic representation obligation, not a cryptographic claim, speedup, or attack on ECDLP.
    - OBJ-8's resolution is a textual-interpretation determination of H-CREP-001's and EXP-CREP-001's own already-frozen wording, not a specification amendment; neither record's text is changed by this decision.
    - The control's one-pair arithmetic gap is not evidence of bad faith or carelessness beyond an ordinary, disclosed and correctable error; it does not affect the correctness of the primary Theta(B^3)/Theta(B^2) upper bounds, which this decision independently re-derived via direct loop-counting, a route different from the producer's own presentation.

  rationale:
    - "The resultant root-product identity and Semaev S_3's fixed degree-2 fact were independently re-verified against primary sources (general resultant theory; knowledge/techniques/KN-TECH-002.md), and the resulting exponent bookkeeping was independently re-derived by direct loop-counting rather than accepted from the producer's own presentation -- both confirmed correct."
    - "OBJ-8 is settled by H-CREP-001.yaml's own falsification_conditions and EXP-CREP-001's V6_cost_caps predicate text, both directly read by this Coordinator and both stronger, more authoritative sources than the calibration-fixture citation the producer itself relied on -- this forecloses the per-query reading rather than merely favoring the aggregate reading."
    - "The proves-too-much control's one-pair arithmetic was checked independently and found incorrect in its precision (claimed exact degradation to naive cost; actually strictly worse than naive), while its directional conclusion (the technique's speedup depends specifically on S_3's fixed degree) survives -- this distinction matters for how the control should be cited or reused in any follow-on work."

