coordinator_decision:
  id: DEC-20261001-9e675e
  recorded_at: '2026-10-01'
  decided_at: '2026-10-01'
  decided_by: coordinator
  recorded_by: coordinator
  goal_ids: [GOAL-ICEX-001]
  archived_by: TASK-20261001-befc87
  prior_decisions:
    - DEC-20260929-47a574 (execution admission of EXP-ICEX-aaccfc v4)
    - DEC-20261001-ba1026 (inference amendment for this review round)
  inference:
    policy: coordinator-orchestration-code
    resolved_model_id: unknown (Cursor runtime; top-level session on its inherited model)
    fallback_used: true
    fallback_reason: Cursor runtime does not expose the resolved model identifier.

  decision: inconclusive
  decision_label: >-
    RECORD EV-ICEX-16e3ec: RUN-ICEX-0ad4d8 is valid and its frozen verdict is
    inconclusive, reproduced independently. RULE that the frozen analysis had
    about 9% power at the run's noise level, so the verdict carries little
    information about the exponent. RECORD the B0 membership obstruction
    (50-306 rho solves per success) and that Pollard rho dominates the v4
    pipeline on all six fixtures. LEAVE H-ICEX-d8e858 at approved. STOP
    further enumerative B0 runs. DIRECT the successor: non-enumerative
    membership at matched L.

  target_ids:
    - EV-ICEX-16e3ec
    - H-ICEX-d8e858
    - EXP-ICEX-aaccfc
    - RUN-ICEX-0ad4d8
    - EXP-ICEX-fa2b37
    - TASK-20261001-bd25c1
    - TASK-20261001-d367dd
    - TASK-20261001-1894f8
    - TASK-20261001-befc87

  evidence_refs: [EV-ICEX-16e3ec]

  review_composition:
    review_plan: coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/review_plan_RUN-ICEX-0ad4d8.yaml
    plan_commit: 96421fe8df
    joints:
      J1: holds (TASK-20261001-bd25c1); the proves-too-much control breaks at the run's noise level
      J2: holds with scope correction (TASK-20261001-d367dd)
      J3: holds (RD-20261001-1894f8; the Coordinator made the comparison, recorded in EV-ICEX-16e3ec)
    coordinator_prior: >-
      Recorded in the plan before any result was seen: CI excludes 1/2 below
      0.10, scoped negative 0.70, inconclusive 0.20.
    prior_versus_outcome: >-
      OVERTURNED. I expected a scoped negative at 0.70. The outcome is
      inconclusive, and the review shows why that was the likely result from
      the start. The frozen bootstrap resamples six fixtures across two bit
      sizes; at the run's scatter it detects a planted 0.40 only about 9% of the
      time. The red team estimates the design had under a 10% chance of
      producing a scoped negative. I did not evaluate the analysis's power when
      writing the prior. The lesson: run the proves-too-much control at
      realistic noise before admitting a design, not after.

  rulings:
    - id: R-1
      topic: F-1 (TASK-20261001-bd25c1), low statistical power of the frozen analysis
      ruling: >-
        Accepted as a design-level finding that binds every interpretation of
        the verdict. The remedy goes into a future amendment or successor
        design and is never applied retroactively to this run: freeze an L
        series or condition the fit on ln L, use at least three field sizes, and
        bootstrap within each bit size.
    - id: R-2
      topic: Cost dominance and scope (TASK-20261001-d367dd)
      ruling: >-
        Accepted. The record states that the v4 pipeline with enumerative B0
        membership is dominated by Pollard rho on these six fixtures, and that
        this closes nothing beyond that exact pipeline at 16-20 bits.
    - id: R-3
      topic: F-2, spurious sub-1/2 exponent from fixed costs
      ruling: >-
        Recorded as a design warning for any successor that fits an exponent
        against measured costs at 16-20 bits. It does not affect this verdict,
        which divides by the fixed rho reference formula.

  procedure_deviations:
    - id: PDV-1
      what: >-
        The three reviewers filed their attestations under report-specific
        keys. The validator nested review_attestation inside attestation; the
        red team and re-deriver used files_read or declared_sources. As a
        result, tools/check_review_independence.py reports every joint as
        unattested. The checker also scanned four 2026-09-29 implementation-audit
        reports that are not part of this round. The Coordinator checked the
        substance from the declared blocks instead. Every report declares
        independent_session true and no sibling reports read. The only
        sibling-directory path cited is a Coordinator-written snapshot receipt.
        The blind re-deriver's declared sources do not intersect its blind_from
        (experiments/EXP-ICEX-aaccfc/implementation/ and runs/). The reports are
        not rewritten.
      remedy: Future reviewer cards name the canonical review_attestation schema in their deliverables, and the checker is run on the round's own task directories.
    - id: PDV-2
      what: >-
        The executor card TASK-20261001-f07ceb was written into the dispatch
        queue after RUN-ICEX-0ad4d8 had completed. The run was launched by the
        driver under admission decision DEC-20260929-47a574 when C-7 cleared.
        The card records the run rather than having dispatched it.
    - id: PDV-3
      what: >-
        The reviewer cards' top-level artifact_paths were extended to cover each
        reviewer's scripts and outputs in its task directory, so the ledger
        archive commits them in scope. Handoff blocks were not edited.
    - id: PDV-4
      what: >-
        Reviewer sessions ran under inference amendment DEC-20261001-ba1026:
        xhigh effort cannot be verified under the Cursor runtime, and resolved
        model identifiers are unknown.
    - id: PDV-5
      what: >-
        The re-deriver reported that the session's memory plugin attached
        short prior-session titles to file reads. They contained no measured
        values, and no observation was opened. Recorded as disclosed in
        RD-20261001-1894f8; not a blindness breach.

  transitions_not_made:
    - record: H-ICEX-d8e858
      note: >-
        Stays approved. The exponent is undetermined at this power, and the
        cost obstruction is specific to enumerative B0 membership, which the
        hypothesis does not require. Revisit when NA-1 reports.
    - record: EXP-ICEX-aaccfc
      note: >-
        Its status record is not edited in this archive (outside the declared
        write scope). The run is completed and reviewed; a later archive may
        move the experiment to analyzed.

  rationale: >-
    J1 and J3 hold, so the measurements are sound. The exponent verdict is
    uninformative by design. The cost data are not: every stage except B0
    membership behaves as modelled, and one successful membership costs more
    than many whole rho solves. The defensible reading is that enumerative B0
    is the bottleneck, not index calculus at this scale. That points directly at
    the non-enumerative membership lane, where the small-x structure B0 ignores
    could be exploited. Running more B0 cells would buy nothing.

  next_actions:
    - id: NA-1
      action: >-
        Rank EXP-ICEX-fa2b37 (Groebner or summation-polynomial m = 5 membership)
        against its current state. Measure its membership cost per success at
        matched L on these six fixtures, keeping every other v4 choice
        (fixtures, B rule, units, collector, linear algebra, descents, matched
        rho). Competitive only below about sqrt(q)/(L+27) units per success.
        Compare against this obstruction: 50-306 rho solves per success.
      owner: coordinator
    - id: NA-2
      action: >-
        Any successor exponent claim pre-registers a design without L variance
        in the slope (frozen L series or a fit conditioned on ln L), at least
        three field sizes and a within-size bootstrap. Before admission, run the
        proves-too-much planted-exponent control at the expected residual SD.
      owner: coordinator (design-experiment)
    - id: NA-3
      action: Update GOAL-ICEX-001's next_action to NA-1 in the next goal-head archive.
      owner: coordinator
    - id: not_recommended
      action: Further enumerative B0 runs at these or larger sizes.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Toy-tier, exponent verdict inconclusive, nothing proven. The reusable
      content is the B0 membership-cost obstruction, already in
      EV-ICEX-16e3ec's obstruction block where tools/obstruction_registry.py
      surfaces it. Revisit for a KN-FIND entry when NA-1 measures a
      non-enumerative backend against the same threshold.
