        a number. J1-B1: R-1 to R-4 not printed (DH-4); the cause is the
        round's wiring (the formulas sat only on the blind card, outside the
        producer's and J1's read scope), not a mathematical defect (CH-10).
        J1-B2: genus candidates are printed on the twelve collapsed cells c in
        {1, 2, 4, 8} of the three Tr(A) = 1 rows, where (7) fails and Lemma
        6's (9) is relied on but not computed; OB-2's stated reason (e not
        defined within the read extent) is contradicted by Definition 4 on page
        6, which 2214e9 read at source. 2214e9 computes (9) true on all fifty
        cells, so no printed value changes. J1-B3: CTRL-4 has no stated
        failure criterion. What holds: every census value in two lineages, MMT
        Tables 2 and 3 read at the retrieved bytes, Tr(A) per row (E368 = 0
        settled), (7) on all twenty open cells, matched rho within 0.000446
        bit, Remark 24 bounds, controls CTRL-1, -2, -3 and -5 able to fail.
    - id: R-J2
      text: >-
        J2 BREAKS. J2-B1: decision_rules.declared_grid omits the ten
        KOBLITZ-176 ARM-CELL triples the specification declares (no lane
        vocabulary for them). J2-B2: toy_admissibility selects the OPEN_N4
        lane by an expression in d and k prime rather than by role (no frozen
        figure changes; the pattern DEC-20261002-21a63d R-LESSONS (7) excludes).
        J2-B3 (also TH-3): ARM-COST's pre-registered substitution cannot be
        executed by the pinned cost_table block, and the ARM-CELL input
        builder and the IR-6 comparison exist only as prose. What holds: six
        pins and two extraction methods, import safety by two audits, C-1 to
        C-8 byte-identical, no design-time group coinciding with a declared toy
        cell (minimal polynomials differ), memory beside every time figure,
        every approval field, custody.
    - id: R-J3
      text: >-
        J3 BREAKS (order attestation read first, CH-5: own table frozen at
        10:13:47Z, producer C-5 opened at 10:18:16Z). O-1: ARM-C1-NEG cannot
        return REFUTED as coded, because SR-1 stops at the first non-zero image
        and c1_negative returns INVALID below 64 samples, so the only toy-scale
        falsification route of (C1') is unreachable. O-2: all ten declared
        negative lanes are degenerate by group order (eight by the Weil bound,
        the contract's own DG-3 applied to negative lanes; two by Hess 2003
        Theorem 8), so CONSISTENT there would measure group size, not the
        mechanism. O-3: on TC-E the ARM-H2 walk is confined to a group too
        small to supply the relations needed, so SR-3 fires and DR-H2 reads
        FALSIFIED in every run under the contract's own random model applied
        to the declared procedure. O-4: under that model kappa is not constant
        at the declared q and DR-H2 VALIDATED is unreachable; C-5's null for
        SR-3 and DR-H2 is the law under test. O-5: the H-DL-1 tail half cannot
        fail. What holds: L1 to L4 and L6 correct, L2 proved, MAIN-C1 a pure
        assembly, M1 to M6 and MAIN-C2 correct, the positive control argued and
        able to fail, DC-H1 handled by its second route, H-0e3641-1 validly
        retired by M5. b8360c reports (C1') is a special case of Hess 2004
        Theorem 7 read at retrieved provenance.
    - id: R-J4
      text: >-
        J4 BREAKS. BA-1: PTM-D(b), a synthetic row at rho's time carrying 2^40
        shared entries, reads a tie at P = 2^30 (a value the contract's own
