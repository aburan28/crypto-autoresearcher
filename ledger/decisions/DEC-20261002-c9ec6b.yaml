        15 of 15. Q4 R-1 to R-3 have no contract figure: the census prints a
        placeholder (PD-P1). Against MMT Table 3 as transcribed by
        TASK-20260929-0be49c, J5's m and g agree on 20 of 20 open cells,
        including the four m != n cells. No source discrepancy exists.
        K-indeterminate requires a disagreement beyond tolerance and does not
        fire; the missing R-1 to R-3 figures are a DH-4 defect, charged under
        K-revise-defect and not to J5. The estimator prior (Q2 agreement p
        about 0.9; Q3 p about 0.95) is borne out.
    - id: R-J1
      text: >-
