coordinator_decision:
  id: DEC-20260814-8ec2e5

  context: >-
    BATCH-d1a736 of GOAL-MLKEM-005 discharged DEC-20260814-4ac30a's own
    next_actions in full: TASK-20260814-534f80 fixed stage0_feasibility.py's own
    worker_main_cell construction (dropped GSO.ROW_EXPO; explicit mpfr GSO.Mat),
    determined the minimum adequate isolated-LLL-step precision by bisection at
    (d=256, beta=40) -- 65 bits, a genuinely determined minimum, not the disclosed
    212-bit fallback -- and re-ran PREREG-8's own 6 Stage-0 main-grid cells under
    that corrected construction and precision, each capped at a realistically-sized
    PER_BASIS_FEASIBILITY_CAP_V2=7200s (25200s overall task cap, never approached).
    RESULT: 0/6 cells completed a full BKZ tour. 5 cells ERROR (4 direct
    ReductionError('infinite loop in babai'), 1 a chained ValueError from the
    identical underlying condition surfacing in fpylll's own tracer path); 1 cell
    (d=256, beta=70) NOT_COMPUTED: exceeded its own 7200s cap. TWO INDEPENDENT
    REVIEWS RETURNED: Validator TASK-20260814-1ce70d (VAL-20260814-1ce70d), verdict
    `passed`, which independently re-verified the notarization chain, the
    construction's shape, the bisection, and 2 of 6 main-grid cells end to end
    (bit-identical reproduction), and surfaced ART-9 -- the bisected 65-bit
    precision is confirmed sufficient for the isolated LLL step but confirmed
    INSUFFICIENT for the full BKZ tour, even at the exact (d=256, beta=40) cell the
    bisection was performed on; and Red Team TASK-20260814-9cf080
    (RT-20260814-9cf080), which does not challenge the 0/6 outcome or the
    termination branch, but raises OBJ-1 (severity: critical) -- the bisected
    precision was calibrated ONLY at (d=256, beta=40) and applied unchanged to all 6
    cells including d=512, a dimension never tested at any level; a live,
    independently-executed control at (d=512, beta=40) isolated-step level directly
    falsifies "65 bits generalizes" (65 bits: ERROR; 100 bits: COMPLETED),
    confirmed by direct source inspection to be the SAME fpylll operation every
    d=512 main-grid cell's own traceback fails on. BOTH REVIEWS INDEPENDENTLY,
    RIGOROUSLY RE-VERIFIED THE PRODUCER'S RAW 0/6 RESULT AND FOUND IT GENUINE AND
    REPRODUCIBLE -- there is no factual conflict between the two reviews requiring
    adjudication against a live fpylll install; ART-9 and OBJ-1 are COMPLEMENTARY
    findings about two different axes (operation-level permissiveness;
    dimension/instance calibration-generality) of the SAME under-calibrated
    precision, and their conjunction is a genuine, well-evidenced narrowing of what
    the bare 0/6 figure licenses. This decision rests on that reconciled
    understanding; the full account is EV-MLKEM-098182.compound_finding_
    reconciliation. CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM
    security, any FIPS 203 parameter set, any attack cost, or any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION: the evidence record is committed with the reconciled
    compound-finding account, and the successor's single next action is a narrower,
    strictly cheaper, evidence-directed follow-up than either of DEC-20260814-4ac30a's
    own named escalation branches -- NOT a verdict on C1 or C2, and NOT a change to
    H-MLKEM-7d9bcc's or EXP-MLKEM-42ea04's status. PREREG-8 section 4.3 item 1's own
    FORBIDS clause bars any C1/C2 statement at the affected scope while
    T-PROJNOISE-NODATA fires (again), and this decision honours that bar in full.
    `approve` (of EXP-MLKEM-42ea04) is explicitly declined again, not deferred by
    accident: no cell cleared Stage 0 this batch either, so there is still no
    measured per-cell cost to size a Stage-1 budget from. `pause` is unavailable, for
    the identical reason DEC-20260814-4ac30a gave: GOAL-MLKEM-005's pause_conditions
    are infrastructure-only, and an infrastructure-limited result is explicitly
    listed in the goal's own non_terminal_conditions. THIS BATCH CLOSES, PAUSES, AND
    COMPLETES NOTHING.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-d1a736
  - TASK-20260814-534f80
  - TASK-20260814-cfa812
  - TASK-20260814-1ce70d
  - TASK-20260814-9cf080
  - EV-MLKEM-098182
  - H-MLKEM-7d9bcc
  - EXP-MLKEM-42ea04

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE for exactly what it reports: a
      corrected-construction Stage-0 re-measurement that reached ZERO completed
      main-grid reductions at the bisected 65-bit precision. It is NOT, and is not
      treated as, evidence for or against C1 or C2.
    expected_run_count: >-
      ONE producer task, one internally-declared run (RUN-MLKEM-STAGE0V2-1),
      completed within budget (9863.27s of a 25200s cap). Both independent reviews
      confirm no Stage-1 work, no NULL-1/2/3/SENS control, and no >=2^20 target
      generation occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (notarization chain checked in both directions
      with git plumbing; all 12 committed artifacts hash-verified) AND
      INDEPENDENTLY BY THE RED TEAM (its own chain-of-custody section, same git
      plumbing, same result).
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS INDEPENDENTLY. SEED_ROOT=715923 and the full
      default_rng formula reproduce bit-identical seed values across the producer,
      the Validator, and the Red Team, including a corroborated derivation of the
      one seed the producer's own SIGTERM-killed subprocess could not record.
    raw_summary_agreement: >-
      CONFIRMED, with one minor, non-load-bearing raw-JSON summary-field labeling
      defect the Validator found and disclosed (ART-8): stage0_v2_results.json's
      own top-level n_cells_not_computed field lumps 5 genuinely ERROR-status cells
      with 1 genuinely NOT_COMPUTED-status cell. This does NOT propagate to
      run_manifest.yaml's own correctly-disaggregated summary or to writeup.md's
      own correct per-cell table, and does not affect any figure this decision
      relies on.
    control_comparability: >-
      NOT APPLICABLE. PREREG-8 section 2.2-2.3 scopes Stage 0 to feasibility timing
      only; both reviews independently confirm this scope was honoured.
    infrastructure_separation: >-
      The 0/6 main-grid outcome (5 ERROR, 1 NOT_COMPUTED: cap-exceeded) is genuine
      infrastructure signal under AGENTS.md rule 5, never a negative mathematical
      result about C1 or C2.

  # ==================================================================
  # 2. THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-PROJNOISE-NODATA fires AGAIN, for the whole follow-up package.
    firing_confirmed_by: >-
      TASK-20260814-534f80's own writeup (section 4), the Validator (verdict
      `passed`, no challenge to the branch), the Red Team (narrowest_supported_
      statement, "does not challenge it"), and this Coordinator's own reading of
      PREREG-8 sections 2.3 and 4.3 item 1 -- four independent readings, all in
      agreement.
    licenses: >-
      Citing the corrected-construction Stage-0 cell-by-cell benchmark results (the
      5 ERROR outcomes and their exact tracebacks; the 1 NOT_COMPUTED outcome) as a
      standalone, reportable infrastructure-timing deliverable. Nothing else.
    forbids: >-
      Any statement about C1 or C2's truth, in either direction, at any of the 6
      cells. This decision makes none.

  # ==================================================================
  # 3. RECONCILIATION OF THE TWO REVIEWS' FINDINGS -- THE MOST
  # CONSEQUENTIAL ITEM IN THIS BATCH
  # ==================================================================
  review_reconciliation_ruling: >-
    WHERE BOTH REVIEWS AGREE, STATED AS AGREEMENT: the reported 0/6 outcome is
    genuine and reproducible (independently re-verified at the seed level by both,
    end to end for 2 of 6 cells by the Validator); the bisection is a genuine,
    correctly-executed 1-bit-resolution search, independently spot-checked exact by
    the Validator; the termination branch fires correctly, unchallenged by either
    review; the corrected construction's shape matches ADJUDICATION.md's own
    validated shape exactly, no drift; SEED_ROOT and its formula were genuinely
    used; and no scope violation occurred anywhere (no Stage 1, no status change, no
    edit to any frozen document). NEITHER REVIEW DISPUTES THE OTHER'S OWN FINDING.
    Read together, ART-9 (Validator) and OBJ-1 (Red Team) are NOT a factual
    conflict requiring adjudication against a live fpylll install -- both reviews'
    own executed controls are mutually consistent, and BATCH-3b9962's own
    adjudication precedent for genuine conflicts (ADJUDICATION.md) is therefore not
    invoked here; there is nothing to adjudicate between. They are complementary
    findings on two different axes of the SAME single-instance-calibrated
    precision, as EV-MLKEM-098182's own compound_finding_reconciliation states in
    full: ART-9 shows the bisected precision is inadequate for a full tour even at
    the exact cell it was calibrated on (an operation-level gap, and the third
    independently-observed recurrence of KN-FIND-f54a82's own already-promoted
    pattern); OBJ-1 shows the bisected precision does not generalize across
    dimension, even at the cheap isolated-step level the bisection itself tested (a
    calibration-instance-generality gap, confirmed by a live, executed counter-
    example, not merely argued). Together they explain the 5 ERROR cells as (at
    least) two distinguishable failure populations this single run cannot itself
    discriminate for every cell: the d=512 residuals (~5.1-5.7s past the outer LLL
    pass, per the Red Team's own OBJ-3 decomposition) match OBJ-1's own predicted
    signature for an under-provisioned isolated step; the d=256 cells' own much
    longer residuals (156.7s and 576.4s) match ART-9's own signature of a
    full-tour-level inadequacy at an isolated-step-adequate precision.

  # ==================================================================
  # 4. WHAT THE COMPOUND FINDING LICENSES AGAINST THIS TASK CARD'S OWN
  # NAMED BRANCHES
  # ==================================================================
  escalation_branch_ruling: >-
    THIS TASK CARD'S OWN "IF AT LEAST ONE CELL COMPLETED" BRANCH DOES NOT APPLY:
    0/6 completed. THE "IF NO CELL COMPLETED" BRANCH APPLIES IN PART, NOT IN FULL,
    AND THAT DISTINCTION IS THE SUBSTANTIVE CALL THIS RECORD MAKES. T-PROJNOISE-
    NODATA DOES fire again -- that is a correct, narrowly-scoped, mechanical
    reading of PREREG-8's own text against this batch's own real 0/6 outcome, and
    it is recorded as such above, as genuine infrastructure signal per AGENTS.md
    rule 5. WHAT DOES NOT FOLLOW, AND WHAT THIS DECISION DECLINES TO DO, is treating
    that firing as licensing DEC-20260814-4ac30a's own named "next escalation"
    (upstream fplll bug report, alternate build/version, or a scoped-down
    dimension) as the live question now. Those three options are all
    scope-broadening moves that presuppose the corrected (ROW_EXPO-free, mpfr)
    construction ITSELF is exhausted at the tested dimensions -- and the Red
    Team's own executed, reproducible, seed-identical control (OBJ-1) directly
    falsifies that presupposition for d=512: the same precision that fails the
    isolated step at d=512 succeeds at 100 bits, on this same host, this same
    fpylll build. Naming the escalation as ripe now would close a lane on an
    obstruction measured over a narrower scope (one single-instance-bisected
    precision value) than the escalation branches assert (the construction, or the
    fpylll/fplll build itself, cannot clear Stage 0) -- precisely the failure mode
    agents/coordinator.md's "Closure gate" identifies as the more common and more
    expensive one, because it would close this lane for every future attempt at
    this construction, not just this batch's own single, under-calibrated run.
    Per docs/inventor-protocol.md's closure standard, an obstruction claimed over a
    scope broader than what was actually measured is not admitted here. INSTEAD,
    per this task card's own instruction, ONE additional, cheap, bounded follow-up
    is named as this goal's own next_action (section 6 below), informed directly by
    the Red Team's own CTRL-2/CTRL-3 controls and next_concrete_action, BEFORE
    either of DEC-20260814-4ac30a's named escalation branches is treated as ripe.
    If THAT follow-up also fails to clear Stage 0 at every cell it attempts, at a
    dimension-appropriate, properly-bisected precision, the escalation branches
    become the live question in fact, not by default -- this decision does not
    pre-empt that outcome, only defers naming the escalation until the evidence
    that would actually support it either arrives or fails to.

  # ==================================================================
  # 5. STAGE 1 IS STILL NOT AUTHORIZED OR SIZED
  # ==================================================================
  stage_1_authorization_ruling: >-
    PREREG-8's own Stage 1 IS NOT AUTHORIZED, SIZED, OR IMPLICITLY LICENSED BY
    ANYTHING IN THIS DECISION. No cell cleared Stage 0 this batch either, so there
    is still no cleared cell, no measured per-cell cost, and no basis from which to
    size a Stage-1 dispatch. This remains true even though the compound finding
    above narrows what the 0/6 outcome means -- narrowing an interpretation is not
    the same as producing a completed measurement, and this decision does not
    conflate them.

  # ==================================================================
  # 6. HYPOTHESIS AND EXPERIMENT STATUS, RULED EXPLICITLY
  # ==================================================================
  hypothesis_status_ruling: >-
    H-MLKEM-7d9bcc STAYS `proposed`. Reasoned, not defaulted: EXP-MLKEM-42ea04's own
    success_criterion requires at least one (n, beta) cell to clear Stage 0 and
    produce >= 8 complete draws before this hypothesis may advance even to
    `analyzed`. Zero cells cleared Stage 0 this batch, exactly as before. A
    Stage-0-only, infrastructure-outcome result -- even one whose interpretation is
    now substantially narrower and better understood -- CANNOT license any
    movement of this hypothesis's status in either direction: T-PROJNOISE-NODATA's
    own FORBIDS clause bars exactly that. `proposed` is therefore not a default
    holdover but the ONLY status this record's evidence permits. H-MLKEM-7d9bcc.yaml
    itself is not touched by this decision, per this task's own constraints; it is
    frozen and unedited.

  experiment_approval_ruling: >-
    EXP-MLKEM-42ea04 STAYS `review_required`/`approved_by: null`. Approval is a
    distinct, explicit act (AGENTS.md rule 1) and I explicitly DECLINE to make it
    here, not merely defer it as a byproduct of archiving this batch's result.
    Grounds: (1) no cell cleared Stage 0 at any tested precision, so no responsible
    Stage-1 budget can be derived from this batch's own measurements; (2) even the
    narrower reading this decision reaches -- that the corrected construction's own
    d=512 failure is at least partly a precision-calibration artifact, not a proven
    exhaustion -- is itself unconfirmed by any completed cell; a plausible path to a
    cleared cell is not a cleared cell. EXP-MLKEM-42ea04/specification.yaml itself
    is not touched by this decision, per this task's own constraints; it is frozen
    and unedited.

  # ==================================================================
  # 7. RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE FOLLOW-UP DID EXACTLY WHAT IT WAS COMMISSIONED FOR: it fixed the
    diagnosed construction bug, bisected a real minimum precision instead of an
    arbitrary choice, and measured six real per-cell outcomes under a
    realistically-sized cap, replacing preliminary >100s-684s non-resolution
    figures with real, definite ERROR/NOT_COMPUTED outcomes at every cell.
  - >-
    THE HARD CALL IS THE ESCALATION-BRANCH RULING, AND IT IS MADE ON THE
    RECONCILED EVIDENCE RATHER THAN ON THE BARE 0/6 FIGURE READ ALONE. A
    naive reading of "0/6, same as before" would treat this batch as licensing
    the next-named escalation by default. The Red Team's own executed control
    directly falsifies the presupposition that escalation would rest on for
    d=512, and the Validator's own ART-9 shows the d=256 cells' own status is
    separately, and also, still open at higher precision. This decision states
    that distinction with its full precision rather than rounding it away.
  - >-
    THE ADVERSE ITEM IS CARRIED RATHER THAN SOFTENED: 0/6 cells completed, again.
    This is not reported as a disguised success. What is corrected is only which
    conclusion that bare figure licenses.
  - >-
    WHAT THIS BATCH IS NOT ALLOWED TO BUY, STATED SO NO LATER READER HAS TO INFER
    IT. It buys no C1/C2 finding, no ML-KEM statement, no Stage-1 authorization, no
    experiment approval, no hypothesis-status movement, and no escalation-branch
    determination. A genuinely useful narrowing of a negative interpretation is not
    the same thing as Stage 0 having cleared, and this decision does not conflate
    them.

  # ==================================================================
  # 8. WHAT DOES NOT CHANGE
  # ==================================================================
  binding_carries_restated_and_not_re_litigated:
  - CLAIM TIER STAYS TOY, UNCONDITIONALLY.
  - H-MLKEM-11aabf (analyzed), H-MLKEM-dc51f5, H-MLKEM-232843, H-MLKEM-34e22e (all
    proposed) are UNCHANGED by this decision.
  - PREREG-8's own frozen text, DEC-20260814-4ac30a, EV-MLKEM-ef0261, and
    KN-FIND-f54a82 are BINDING-CARRIED WITHOUT RE-LITIGATION.
  - NO HYPOTHESIS STATUS MOVES. THE GOAL IS NOT CLOSED, PAUSED, OR COMPLETED, and
    an infrastructure-limited result may not be cited in a decision that closes it
    (GOAL-MLKEM-005's own non_terminal_conditions).
  - THE SPLIT-PRODUCER NOTARIZATION AND SNAPSHOT-BEFORE-REVIEW PATTERNS ARE
    RETAINED UNCHANGED. knowledge/INDEX.md must NOT be written, regenerated, or
    staged.

  # ==================================================================
  # 9. EVIDENCE
  # ==================================================================
  evidence_refs:
  - ledger/evidence/EV-MLKEM-098182.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/reviews/TASK-20260814-1ce70d/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/reviews/TASK-20260814-9cf080/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/tasks/TASK-20260814-534f80/writeup.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/tasks/TASK-20260814-534f80/stage0_v2_results.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/tasks/TASK-20260814-534f80/bisection_results.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-d1a736/tasks/TASK-20260814-534f80/run_manifest.yaml
  - ledger/decisions/DEC-20260814-4ac30a.yaml
  - ledger/evidence/EV-MLKEM-ef0261.yaml
  - knowledge/findings/KN-FIND-f54a82.md
  evidence_refs_note: >-
    Every number and figure quoted in this decision is attributed to the
    producer's own writeup/manifest/results, or one of the two review reports. No
    measurement, timing, citation, or run is invented anywhere in this record.
    This drafting session ran no code and held no shell; every figure above is a
    citation of what the producer and the two reviews' own probes report, not a
    re-derivation.

  # ==================================================================
  # 10. LIMITATIONS
  # ==================================================================
  limitations:
  - CLAIM TIER TOY, UNCONDITIONALLY.
  - >-
    INDEPENDENCE IS PROCEDURAL, NEVER MODEL-LEVEL. AGENTS.md rule 12 is UNMET AND
    UNWAIVED. The Validator and Red Team ARE independent sessions; the
    reconciliation of ART-9 and OBJ-1 into one compound finding was performed by
    this Coordinator, not by a fourth, independent reviewer -- disclosed
    explicitly, not smoothed over. Unlike BATCH-3b9962's own root-cause
    reconciliation, this reconciliation required no adjudication against a live
    fpylll install: both reviews' own executed controls are already mutually
    consistent, and this decision's own contribution is reading them together, not
    resolving a factual conflict between them.
  - >-
    OF THE 6 MAIN-GRID CELLS, ONLY 2 (d=256/beta=40; d=512/beta=40) WERE
    INDEPENDENTLY RE-ATTEMPTED END TO END BY EITHER REVIEW. The remaining 4 were
    not independently re-run at the full-tour level by anyone in this batch;
    this decision's own compound-finding account for (256,55) and (256,70) rests
    on the producer's own reported figures and the Red Team's own OBJ-3
    residual-time decomposition of them, not on an independent re-execution of
    those two cells specifically.
  - >-
    THE d=512 CALIBRATION-GENERALITY FINDING (OBJ-1) IS SUPPORTED BY A SINGLE
    EXECUTED CONTROL AT ONE (d, beta) INSTANCE (d=512, beta=40), ISOLATED-STEP
    LEVEL ONLY. It has not been independently replicated at (d=512, beta=55) or
    (d=512, beta=70), nor at the full-tour level anywhere. This decision treats
    it as sufficient to withhold the named escalation, not as sufficient to claim
    the d=512 cells WILL clear at a higher precision -- that remains an open
    question the next_action below is designed to answer.
  - >-
    NOTHING IN THIS RECORD IS DURABLE OR OFFICIAL until the ledger archive
    carrying it commits, THE POST-COMMIT VERIFIER ACCEPTS IT -- RUN BEFORE THE
    PUSH, NOT AFTER -- and the branch is pushed with an open PR against main
    naming EV-MLKEM-098182, DEC-20260814-8ec2e5, and GOAL-MLKEM-005.

  # ==================================================================
  # 11. KNOWLEDGE PROMOTION
  # ==================================================================
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED AS A NEW STANDALONE KN-FIND ENTRY AT THIS TIME, for two
      distinguishable reasons that were considered explicitly and separately, per
      this task's own instruction. (1) ART-9 (the isolated-step-vs-full-tour
      permissiveness gap, observed a third time, at the exact bisected cell) is
      NOT a new finding -- it is a third, independently-confirmed instance of the
      pattern KN-FIND-f54a82 already promotes, and that entry's own text already
      anticipates exactly this recurrence as an open item ("whether this
      generalizes ... untested"). It is cited as corroborating evidence in
      EV-MLKEM-098182 rather than re-promoted or appended to the immutable
      KN-FIND-f54a82.md record. (2) OBJ-1 (the calibration-instance/dimension-
      generality hazard: a precision bisected at one (d, beta) instance is not
      evidence it holds at a different instance of the same operation) IS a
      genuinely distinct axis from KN-FIND-f54a82's own operation-level (isolated-
      step vs. full-tour) lesson, and is well-executed, reproducible, and
      independently confirmed by a live counterexample. But this goal's own
      established discretionary-promotion bar (set by KN-FIND-f54a82's own
      promotion_note in DEC-20260814-4ac30a) required TWO independent recurrences,
      from structurally different questions, before treating a reconciled
      disagreement as a generalizable lesson rather than a single anecdote. OBJ-1
      is, at present, ONE instance (one control, at one (d,beta) pair). Promoting
      it now, on a single occurrence, would not meet the bar this same goal set
      for itself one batch ago. The decisive test of whether this pattern recurs
      -- and therefore whether it clears that bar -- is exactly the follow-up
      named in next_actions below (a genuine bisection at d=512, plus a
      re-attempt of the ERRORing d=512 cells at the resulting precision): if that
      follow-up confirms the pattern at additional (d, beta) pairs, or the pattern
      recurs again from a structurally different question elsewhere in this
      goal's portfolio, promotion should be revisited then, not deferred
      indefinitely or dropped silently. This determination is recorded here so
      the deferral is explicit rather than an omission.

  decided_by: coordinator
  decided_at: '2026-08-14'

  # ==================================================================
  # 12. NEXT ACTIONS -- EXACTLY ONE
  # ==================================================================
  next_actions:
  - >-
    ONE ACTION, DIRECTLY INFORMED BY THE RED TEAM'S OWN CTRL-2/CTRL-3 CONTROLS AND
    next_concrete_action, NAMED IN PLACE OF, AND EXPLICITLY BEFORE, EITHER OF
    DEC-20260814-4ac30a's OWN NAMED ESCALATION BRANCHES. Commission a NEW,
    separately-scoped, bounded follow-up task -- NOT a resumption of
    TASK-20260814-534f80, which stays exactly as reported (run records are
    immutable) -- that:
    (a) DETERMINES d=512's OWN MINIMUM ADEQUATE ISOLATED-LLL-STEP PRECISION BY A
    GENUINE BISECTION (not a 2-point bracket), at (d=512, beta=40), between 65
    bits (known failing, per this batch's own OBJ-1 control) and 100 bits (known
    succeeding, per the same control) -- reusing the Red Team's own probe1
    harness directly, per its own CTRL-2. Cost: a handful of ~360-410s-per-trial
    subprocess runs, well under an hour total, each dominated by the same outer
    LLL.reduction(A) cost this batch's own main-grid cells already pay -- strictly
    cheaper than a new fplll build or an upstream bug report.
    (b) RE-ATTEMPTS AT LEAST THE THREE CURRENTLY-ERRORING d=512 MAIN-GRID CELLS'
    OWN FULL BKZ TOURS at that dimension-appropriate, newly-determined precision,
    under a realistically-sized per-cell cap (sized and disclosed explicitly by
    the dispatching Coordinator, per PREREG-8 section 6.3's own STOP RULE
    discipline, not copied uncritically from PER_BASIS_FEASIBILITY_CAP_V2=7200s
    without considering whether the higher-precision construction's own real cost
    differs) -- per the Red Team's own CTRL-3, this is the decisive control: it
    directly tests whether raising precision, at a dimension-appropriate value,
    lets Stage 0 clear at d=512, the exact question this batch's own single-
    instance-bisected run never tested.
    (c) REPORTS REAL PER-CELL WALL-CLOCK/TOURS/DELTA OR NOT_COMPUTED HONESTLY --
    no fabricated or estimated figure presented as measured.
    (d) DOES NOT ITSELF ADDRESS THE (d=256, beta=55)/(d=256, beta=70) OPEN
    QUESTION named in EV-MLKEM-098182's own unresolved_confounds (whether a
    higher-than-65-bit precision, untested anywhere in this goal's history at the
    full-tour level, would let those cells clear) -- that remains explicitly OPEN
    and UNSCOPED by this action, named here so it is not silently dropped, and
    left for a LATER, separately-scoped follow-up rather than folded into this
    one to keep this action singular and cheap.
    IF THAT FOLLOW-UP CLEARS AT LEAST ONE d=512 CELL, this licenses (i) a Stage-1
    sizing decision from the real measured cost at that cell, per
