  next_actions:
  - id: N1
    priority: 1
    is_the_single_next_action_for_the_goal_record: true
    action: >-
      RUN THE FAMILY-ENVELOPE GATE (red team RT-C-H) BEFORE ANY FURTHER SIEVING
      AND BEFORE ANY NEW FAMILY IS ADOPTED. Both reviewers converge on it
      independently and it is the only next action this decision sets: RANK
      CANDIDATE FAMILIES BY THE MEASURED LOWER ENVELOPE OF MINIMAL-MODEL NAIVE
      HEIGHT, NOT BY GENERIC RANK. For each candidate family of generic rank
      >= 9 -- Mestre's rank-11 and rank-12 loci, Fermigier, Kihara,
      Kulesz-Stahlke, with NAGAO-1994 as the now-measured control -- compute the
      lower envelope over the crossover band by the RT-C-A / RT-C-C procedure,
      about two seconds and 1e5 fibres per family on this machine.
      THE COMPARISON TARGET IS NOT THE BOARD CELL. It is MESTRE 1982's 79.329 AT
      RANK 12. A family whose envelope beats 79.329 at certified rank >= 12 is
      +9.99 from an actual cell and is worth a batch; a family that does not is
      a family-choice failure caught in seconds instead of in a batch. NAGAO'S
      ENVELOPE, 109.505, WOULD HAVE BEEN REJECTED BY THIS GATE BEFORE THIS BATCH
      WAS DISPATCHED.
    why_this_and_not_something_else: >-
      It is the cheapest measurement that discriminates between the two live
      readings of this round -- family-choice failure (supported by the board's
      own +9.99) versus structural closure of the axis (refuted by the same
      +9.99) -- and it converts the derived obstruction from a verdict into an
      instrument: the obstruction says the binding quantity is the family's O(1)
      constant at fixed d, and this action measures exactly that constant.
