  - id: R9
    label: THE RECORDED PRIORS, HELD TO ONE AT A TIME, INCLUDING THE ONE THAT SUITED ME.
    text: >-
      P1 -- "I EXPECT THE ADMISSIBLE BOX TO BE EMPTY AT ALL THREE TARGETS":
      CONFIRMED, AND STRESS-TESTED AT 248x. THE EPISTEMICS ARE RECORDED HONESTLY
      BECAUSE THE AGREEMENT ITSELF IS WEAK EVIDENCE. I wrote the prior, chose the
      family, chose the targets and specified the box; the producer measured what
      I specified and it agreed. A prior confirmed by a measurement its own
      predictor designed corroborates almost nothing. WHAT CARRIES WEIGHT IS THE
      INDEPENDENT WORK: the red team's 141221-fibre search of a region my box
      never covered, and the validator's own code path with its own
      minimalisation and no PARI. Both reviewers said the same thing unprompted
      and gave the convenient result the scrutiny an inconvenient one would have
      got; the validator states in terms that it did so. That, and not the
      agreement, is why P1 stands.
      P2 -- "I EXPECT MINIMALISATION TO STRIP A LOT": HOLDS, MEASURED, AND
      NOWHERE NEAR ENOUGH. Heights before minimalisation ~231.45 uniformly,
      after 111.2-174.0, i.e. 98.7 to 120.2 stripped; c4 34 -> 17-20 digits, c6
      51 -> 25-30. Reproduced independently. The red team adds the mechanism the
      batch reported without: the pre-minimalisation model is ~231.45 at small t
      and ~128.6 + 24 log|t| at large t, and the observed argmin at |t| = 62 is
      the CROSSOVER of those two arms, which is why the smallest fibres sit at
      moderate rather than small t. The prior was recorded as deliberately weak
      and is now a measurement.
      P3 -- "I EXPECT CERTIFIED RANK >= 12 AT SMALL t": CONTRADICTED ON ITS
      FACE, AND ITS if_contradicted ACTION IS DELIBERATELY NOT TAKEN. At small t
      the score is 1 for (t = 1, rank 14) and 2 against (t = 0 rank 6, t = 2
      rank 11); t = 62 is not small t. THE FAMILY IS NOT WITHDRAWN ON THAT
      BASIS, for two reasons neither of which is the producer's ("a shortfall is
      a search outcome"), which its own artifact contradicts -- PARI recorded
      r_low == r_high with timed_out false at all four parameters, so the ranks
      are DETERMINED at 6, 14, 11 and 12 and there was no timeout to blame (F3).
      FIRST: t = 0 WAS GUARANTEED IN ADVANCE TO DROP. a1 = a3 = 0 and a4, a6
      contain only even powers of t, so t -> -t is an involution and MW tensor Q
      splits into eigenspaces; a section in the anti-invariant part has y ODD in
      t, so at t = 0 its y-coordinate vanishes and it specialises into E_0[2],
      contributing nothing. The whole anti-invariant eigenspace dies at t = 0,
      and measured 6 against generic ~12 is exactly the 6 + 6 split that shape
      predicts. t = 0 IS THE ONE PARAMETER IN THE ENTIRE BOX THAT SHOULD NEVER
      HAVE BEEN USED TO TEST P3, and choosing it was mine. SECOND: the generic
      rank is independently corroborated near 12 by the null-controlled -A_p
      measurement. t = 2 short by one is an ordinary Silverman specialisation
      exception.
      IS DECLINING A DECLARED ACTION A CRITERION CHANGE? NO, AND THE REASONING
      IS RECORDED RATHER THAN ASSUMED. The action's SUBSTANCE is taken: the
      family is withdrawn from the A2 lane by this decision's scoped rejection,
      and source retrieval remains owed and blocking before the family is used
      again. What is replaced is the action's stated REASON -- "the coefficients
      are probably not Nagao's" -- which is unsound because the counterexample
      it rests on was structurally forced. NOTHING IS LOOSENED, no success
      criterion moves, and no protocol_amendment is required. The same treatment
      applies to H-ECQ-a609f8's falsification clause 2, whose trigger fired
      numerically and whose stated consequence is not taken on that basis.
      RECORDED AS A CRITERION DEFECT FOUND: a rank prior that does not exclude
      the parameters its own family guarantees to be exceptional is not a test.
      A successor hypothesis must exclude them in advance.

  - id: R10
    label: >-
      THE GAP NEITHER REVIEWER CLOSED, AND IT IS THE ONE THAT MATTERS MOST FOR
      THE PREMISE OF THIS WHOLE CAMPAIGN.
    text: >-
      NO LOW-GENERIC-RANK FAMILY OF THE SAME SHAPE HAS EVER BEEN RUN. The
      rank-versus-size tradeoff that axis A2 assumes -- that specialising a
      high-rank family buys rank and pays in size -- has therefore NEVER HAD ITS
      NULL. Both reviewers named it independently: the validator as the missing
      decisive control ("a LOW generic rank family of the same shape through the
      identical falsifier_height.py, and nobody has run it"), the red team as
      the unnamed selection confound. Both measured families were chosen BECAUSE
      their generic rank is published and exact, and a family somebody wrote
      down explicitly is large for reasons that may have nothing to do with any
      intrinsic tradeoff. On the only within-family data available the
      prediction runs BACKWARDS: certified ranks 6, 11, 12, 14 carry heights
      124.400, 111.217, 109.505, 119.534 -- the height is essentially flat in
      rank and the highest-rank fibres are not the largest. The control costs one
      falsifier_height invocation. IT IS NOT SET AS A COMPETING NEXT ACTION --
      exactly one is set -- but it is a declared component of that action, and
      the next action's gate produces it almost for free, because a
      low-generic-rank family run through the same envelope measurement IS the
      null.

  - id: R11
    label: >-
      ORCHESTRATION-LAYER ITEMS THIS ARCHIVE IS OBLIGED TO SETTLE OR CARRY,
      including one defect found while authoring this very record.
    text: >-
      (a) O-ORCH-DOCS-UNBOUND IS SETTLED FOR THE CAMPAIGN. The snapshot receipt
      asked whether batch-level Coordinator documents are content-bound by the
      snapshot archive, by a separate archive, or not at all. RULING: THEY ARE
      CONTENT-BOUND, AND THE BINDING ARCHIVE IS THE BATCH'S LEDGER ARCHIVE. They
      cannot go in a producer snapshot -- they are not the producer's artifacts
      and binding them there would be exactly the scope expansion an isolated
      archive forbids -- and leaving them bound only by commit reachability,
      which CLAUDE.md treats as advisory, means a later edit to a document a
      blind reviewer read would not fail any archive. This receipt binds
      review_plan.yaml, CORRECTION-predeclared-target-values.md,
      COORDINATOR-multimetric-check.md, COORDINATOR-open-items-settled.md and
      orchestrator_path_sha256.json. It does NOT bind dispatch_queue.json,
      because the dispatcher writes commit_sha and parent_sha into it AFTER this
      commit, so an archive that precedes those writes cannot content-bind it;
      and it does not bind dispatch_plan.json/.md, which are generated and
      gitignored.
      (b) O-MULTIMETRIC-EXPOSURE was settled BEFORE the round, by disclosure
      rather than concealment, in COORDINATOR-open-items-settled.md: both
      reviewers were told to read the document and to attack it. That was the
      right call and the round vindicates it -- the red team's J3 demolished it
      from a retrieved source, which is precisely what naming a Coordinator
      analysis as a target rather than leaving it ambient is for. The document's
      own line "the reviewers have not seen it" was FALSE and was corrected by a
      separate record rather than by editing it, so the mistake stays visible.
      RECORDING THIS IS NOT A FINDING THAT A COORDINATOR RUNNING ITS OWN POST-HOC
      ANALYSIS INTO A PRODUCER'S BATCH DIRECTORY IS GOOD PRACTICE. The
      alternative -- commissioning the check as a producer task with a handoff, a
      run record and review -- was available and was not taken.
      (c) THE PROOF-ARTIFACT ORDERING DEVIATION. Both derivation notes this
      decision's `reject_scoped` rests on live inside REVIEW reports, which are
      bound by this ledger archive, i.e. potentially by the same commit as the
      decision citing them. The red team's artifacts are known to have been
      committed during the round (the validator's blindness disclosure records
      the subject line of commit ac5f28d6d, "TASK-20260823-eaf799 artifacts
      land"), and this role has no shell to determine the rest. Where the
      artifact and the decision land together it is a residual ordering
      deviation of the kind EV-ECQ-d9ffe6 already recorded, it is charged to the
      orchestration layer and never to a reviewer, and the structural remedy is a
      SECOND SNAPSHOT ARCHIVE OF THE REVIEW ROUND before the ledger archive
      whenever the refutation artifact will come from a reviewer. The receipt
      must record which commit carries each of the four review artifacts.
      (d) A DEFECT FOUND WHILE AUTHORING THIS RECORD, and it is the same defect
      for the fourth time. This decision is `reject_scoped` on `replicated`
      evidence, which under agents/coordinator.md MANDATORILY requires promoting
