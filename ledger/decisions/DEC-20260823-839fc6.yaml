  - id: R7
    label: >-
      THE PRODUCER-SIDE FIGURE THE CAMPAIGN HAS BEEN CARRYING IS WRONG, AND THIS
      ONE IS A GENUINE MATHEMATICAL CORRECTION RATHER THAN A BOOKKEEPING ONE.
      The Shioda-Tate ceiling of THIS surface is 15, not 18 or 17.
    text: >-
      Validator F1, computed from the transcribed model and INDEPENDENTLY
      REPRODUCED BY THE ORCHESTRATING SESSION. deg Delta = 20 -- not 24, the
      degree-24 terms cancel exactly -- and Delta is SQUAREFREE, so there are 20
      finite fibres all of type I_1. v_inf(Delta) = 24 - 20 = 4 with
      v_inf(a4) = 0, so the fibre at t = infinity is multiplicative of type I_4.
      Euler number 20*1 + 4 = 24, exactly what a K3 requires. Shioda-Tate gives
      rho = 2 + sum_v (m_v - 1) + rank MW with sum_v (m_v - 1) = 3, so the
      trivial lattice has rank 5 and rho <= h^{1,1} = 20 forces
      rank MW(E/Qbar(t)) <= 15 and hence rank E(Q(t)) <= 15.
      18/17 IS THE GENERIC ELLIPTIC-K3 BOUND 10d - 2 WITH ALL FIBRES
      IRREDUCIBLE. It is not this surface's ceiling. It sits in BATCH-f2341e's
      candidate_families.json, was restated in DEC-20260823-51726e R4 and R5 --
      where I recorded it as a CORRECTION of a producer guard failing open by 20
      -- and I carried it into this batch's task card. The producer of this batch
      did not restate it; the defect is inherited and mine.
      TWO CONSEQUENCES AND ONLY THESE. No contradiction is created: Scholten's
      geometric rank 13 needs rho = 18 <= 20, so the computation is a
      non-trivial consistency check on the transcription that PASSES. And the
      headroom is much smaller than recorded -- AXIS A1's PREMISE IS "REPLACE THE
      RANK-8 BASE WITH SOMETHING BIGGER", AND THIS BASE'S HARD CAP IS 15
      GEOMETRIC AGAINST A CITED RANK OF 13. HEADROOM IS 2, NOT 4 OR 5. Any plan
      that budgets against 17 budgets against a number this object does not have.
      This decision states the correction for the NAGAO surface. It recomputes
      nothing for MESTRE-1991-QT11, which is a different surface; whether its
      18/17 is likewise the generic bound rather than its own is an open item.

  - id: R8
    label: >-
      WHAT SURVIVES AS POSITIVE, AND IT IS SUBSTANTIAL. Recorded with the same
      weight as the adverse findings, because an empty admissible box measured
      this well is a real, publishable result and not a failure.
    text: >-
      (a) THE EMPTINESS IS ROBUST FAR BEYOND WHAT WAS ASKED. The red team
      attacked the cheapest available route to overturning it -- the region
      60 < |t| at denominator > 1, exactly where the minimum sits and exactly
      what neither producer probe covered -- and searched 141221 fibres, 248
      times the producer's 569 distinct curves, on a code path that imports
      nothing from the producer's task. GLOBAL MINIMUM STILL EXACTLY 109.505165
      AT t = +-62; second lowest 109.531002; denominator monotonically hurts.
      The validator independently re-derived ALL 1137 producer fibres with its
      own Kraus minimalisation -- no PARI, no producer code -- with ZERO
      disagreements above 1e-9, then swept 7593 parameters of its own and found
      the envelope RISING beyond H(t) ~ 100 rather than merely flattening. The
      decay control passes: 109.531 at 569 fibres, 109.505 at 141221, no further
      descent. This is a controlled null, not a quantity failing to decay.
      (b) A DERIVED OBSTRUCTION REPLACES MY HAND-WAVING. The height law is
      PIECEWISE, not one line: small-|t| arm h = 119.42 + 0.062 log|t| with
      R^2 = 5e-5, large-|t| arm h = 11.32 + 24.14 log|t| with R^2 = 0.891,
      crossover |t| ~ 89, argmin |t| = 62. The producer fitted ONE line across a
      V whose vertex sat on its own box edge, and R^2 = 0.0004 is not "the
      parameter explains nothing", it is the signature of the wrong model. The
      asymptotic slope is FORCED: deg(a4, a6) = (8, 12) gives d = 2 and
      h(E_t) = 12d log|t| + O(1) = 24 log|t| + O(1) against a measured 24.14,
      and Shioda-Tate's cap rank <= 10d - 2 forces slope >= 1.2(r+2) for generic
      rank r. BUYING GENERIC RANK BUYS A STEEPER HEIGHT LAW, so the
      small-parameter lever exhausts in a bounded region and inside it the
      binding quantity is the family's own O(1) constant. That is a derived
      statement about the object with no free-text program attribution anywhere
      in it, and it is a correction that STRENGTHENS the program.
      (c) THE NAMED 011/012 CHECK CAME BACK DETERMINATE, READING (a), AND
      AGENTS.md RULE 2 IS NOT ENGAGED. The 1258 lived only in two prose strings
      inside cell_reachability.json; nagao_height_budget.json was never touched
      and 1137 is len(all_rows) in both scripts rather than a hard-coded value;
      RUN-011's own preserved stdout.log says "1258 fibres", so the defect is
      visible in the defective run's own record, which is the opposite of the
      pattern the suspicious reading describes; and the validator reproduced
      both runs from a clean export BYTE FOR BYTE. NO RUN RECORD WAS WRITTEN OR
      OVERWRITTEN AFTER THE FACT. Recorded loudly because the suspicion was
      raised in a committed Coordinator document and a cleared suspicion that is
      not recorded leaves the accusation standing.
      (d) BOTH REVIEWERS INDEPENDENTLY CORRECTED "1137 DISTINCT FIBRES" TO 569.
      a4 and a6 contain only even powers of t and a1 = a3 = 0, so E_t and E_{-t}
      are the same Weierstrass equation; the 1137 union parameters give exactly
      569 distinct minimal curves, every +-t pair agreeing to 12 decimals, one
      class of size 1 (t = 0). The union arithmetic itself is right
      (457 + 801 - 121 = 1137). Search volume was overstated 2x; no conclusion
      moves, and every citation of the producer's volume now says 569.
      (e) A NULL-OBJECT CONTROL, and the first INTERNAL evidence that the
      transcribed family's generic rank really is near 12. Under
      Rosen-Silverman with Tate's conjecture -- known for elliptic K3 surfaces
      over Q, which R7's own computation establishes this surface to be -- the
      diagnostic -A_p gives 11.50, 11.99 and 12.88 at p = 2003, 4001, 6007 for
      NAGAO, tightening onto ~12 as p grows, while five same-shape random
      quartics pushed through the identical pipeline give per-draw means 0.218,
      0.566, -0.150, -0.058, -0.213, mean 0.073, and stay pinned at 0 at the
      same primes. It supports a statement about the transcribed OBJECT'S rank
      and nothing whatever about its identity with Nagao's published equation.
      (f) ARTIFACT INTEGRITY IS CLEAN AND THE REPRODUCIBILITY POINTER WAS
      EXERCISED. 94 declared paths, 94 recomputed sha256, 94 match, 0 mismatch,
      0 missing. Both deliverables rebuilt from a git archive export reproduced
      their declared hashes byte-identically and both re-runs reproduced their
