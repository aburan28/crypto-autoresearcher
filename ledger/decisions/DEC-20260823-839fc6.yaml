coordinator_decision:
  id: DEC-20260823-839fc6
  context: >-
    Ledger archive and state-transition gate for BATCH-da59ec of GOAL-ECQ-002,
    the second batch of the campaign that set out to take a record cell on the
    ICARM rank leaderboard (axis A2 / criterion C1') and to close the base-rank
    gap left open by GOAL-ECQ-001 (axis A1 / criterion C2). BATCH-f2341e ended
    with DEC-20260823-51726e: no cell taken, the r >= 15 "soft cell" framing
    broken, C1 tightened to C1', and a single next action -- re-aim before
    another batch runs. This batch is that re-aim. The Coordinator superseded
    H-ECQ-d60d07 with H-ECQ-a609f8, moved the target from r >= 15 to three
    PRE-DECLARED cells at r >= 12/13/14, replaced the Mestre family with
    NAGAO-1994 (generic rank exactly 12 over Q(t) per Scholten Corollary 1), and
    -- paying the debt DEC-20260823-51726e R10(a) made binding -- committed a
    review_plan carrying its priors P1-P3 BEFORE any producer ran.
    One producer ran: TASK-20260823-f88f54 (executor), 12 runs, ~100 s of wall
    clock, measuring NAGAO's height budget and the reachability of the three
    pre-declared cells. Its output was frozen at snapshot commit by
    TASK-20260823-452f5f (94 declared paths, content-bound, derived from the
    producer's write_scope rather than hand-listed), then attacked by two
    independent sessions at review-adversarial / xhigh, blind to each other, on
    disjoint owned joints: the validator TASK-20260823-72505a (J1 the Nagao
    object, J2 the height measurement) and the red team TASK-20260823-eaf799
    (J3 the target choice, J4 provenance and C1').
    BOTH REVIEWS WENT AGAINST THE CAMPAIGN AGAIN. The validator returned verdict
    FAILED with J1 breaking and J2 holding; the red team returned J3 breaking
    and J4 holding with two corrections. This decision composes the round,
    judges C1' and C2 separately and explicitly, records FOUR COORDINATOR ERRORS
    and one genuine mathematical correction of a producer-side figure, addresses
    every red-team objection and every validator finding, supersedes a wrong
    claim this program committed in its own previous decision, and sets exactly
    one next action.

  decision: reject_scoped

  decision_scope: >-
    `reject_scoped`, NOT `weaken`, AND THE DISTINCTION IS ARGUED RATHER THAN
    ASSERTED -- because the standing rule runs the other way and must be shown
    to be satisfied, not assumed.
    WHAT IS REJECTED: H-ECQ-a609f8's central claim, that NAGAO-1994 specialised
    at small rational t produces curves whose minimal models are small enough to
    take at least one of its three pre-declared cells. Its OWN falsification
    clause 1 fires exactly as written: the admissible box is EMPTY at all three
    targets.
    WHY THE PROHIBITION DOES NOT BITE. agents/coordinator.md forbids
    `reject_scoped` on a SINGLE UNREPLICATED EMPIRICAL-ONLY run and requires
    `weaken` plus replication. This adverse result is none of those three
    things. It is not single: the envelope was computed by the producer, by the
    validator's own Kraus minimalisation written from the mathematical statement
    with no PARI and no producer code, and by the red team's PARI
    ellfromeqn path that imports nothing from the producer's task. It is not
    unreplicated: those three implementations agree to 1e-9 / 1e-10 on every
    shared parameter and the minimum is identical to 13 printed digits, with two
    of the three authored blind to each other. It is not empirical-only: a
    DERIVATION NOTE exists and is the second tier of
    docs/claims-and-verification.md's refutation ladder -- h(E_t) = 12d log|t| +
    O(1) with d >= ceil((r+2)/10) forced by Shioda-Tate, hence slope >=
    1.2(r+2), plus the validator's fibre-configuration computation of this
    surface's own ceiling. The top tier, a counterexample certificate, is NOT
    available and this decision says so rather than manufacturing one: the
    hypothesis's claim is existential, and no single exhibited fibre can refute
    an existential claim. proof_status is therefore `derivation`, recorded in
    EV-ECQ-cbc837 with the artifacts named.
    THE EXACT SCOPE OF THE REJECTION, which is the whole content of the word
    "scoped": the transcribed NAGAO-1994 quartic and its Jacobian Weierstrass
    model; the parameter regions actually enumerated (EV-ECQ-cbc837 B-10); the
    four board metrics as frozen or derived from the 2026-08-23T00:43Z snapshot;
    PARI 2.15.4 / cypari 2.5.6 / Python 3.11.15. IT DOES NOT EXTEND TO ALL
    RATIONAL t, to other Weierstrass models or fibrations of the same surface,
    to other families, or to the specialisation axis as a class. Two
    construction-class curves already on the frozen board sit +9.99 and +11.80
    from two of the three targets, so any reading of this decision as closing
    the axis is contradicted by the board's own data.

  target_ids:
  - H-ECQ-a609f8
  - GOAL-ECQ-002
  - RQ-ECQ-80f23c

  supersedes_claims:
    note: >-
      Records are immutable. These claims are SUPERSEDED BY THIS DECISION and
      the records carrying them are not edited. Any reader of the superseded
      records must read this block with them.
    items:
    - superseded_record: DEC-20260823-51726e
      field: rationale R1, and the C1/C2 narrative that rests on it
      prior_claim: >-
        "NAGAO-1994 ... WAS SET ASIDE ON A FALSE NEGATIVE ... the point
        ((t+703)/15, 1248*N(t)/75) LIES ON THE TRANSCRIBED QUARTIC ... NAGAO-1994
        IS REINSTATED AS A CANDIDATE ... The correction is recorded against two
        layers", together with the finding recorded against the producer of
        BATCH-f2341e for filing a false conclusion under verified_here.
      corrected_claim: >-
        BATCH-f2341e's "FAILS" WAS A TRUE NEGATIVE. The pair it tested -- the
        quartic and the section AS RETRIEVED, ((t+703)/15, N(t)/75) -- is
        genuinely inconsistent, and the validator confirms directly that the
        retrieved point does not lie on the transcribed quartic (F2). The red
        team, blind to the validator, shows why and inverts the diagnosis: every
        one of the thirteen distinct integer coefficients of the transcribed
        quartic is exactly divisible by 1557504 = 1248^2, so the transcription
        equals 1557504 * Q0 for an integral Q0 and the PUBLISHED section lies on
        y^2 = Q0 unmodified (RT-CORR-O2). The orchestrating session confirmed the
        divisibility over all 14 nonzero coefficients. THE REPAIR IS TO DIVIDE
        THE EQUATION BY 1248^2, NOT TO MULTIPLY THE POINT BY 1248, and the
        transcription is PROVABLY NOT the published equation -- a stronger and
        more useful statement than the one on file.
      who_was_wrong: >-
        THE COORDINATOR. R1's "false negative" was my correction of a producer,
        and my correction was itself the error. The BATCH-f2341e producer's
        verdict was right about the pair it tested. The finding R1 recorded
        against that producer is WITHDRAWN as to its substance: what remains
        true is only that its stated justification ("by factors that are not
        squares and so are not absorbed by any rescaling") was wrong about the
        RATIO, which is a perfect square; its VERDICT on the retrieved pair was
        correct. A producer that reports its own check failing, and is then
        overruled by a Coordinator who did not check carefully enough, is owed
        this correction on the record.
      what_does_not_change: >-
        Nothing numerical. 1248^2 is a perfect square, so y -> 1248y is a
        Q-isomorphism and every minimal model, height, rank, conductor and
        discriminant is identical -- the red team confirmed this by re-deriving
        ten heights from the scaled quartic to 1e-10. NAGAO-1994 was a legitimate
        object to measure and measuring it was not wasted; what was wrong was the
        provenance claim attached to it.
    - superseded_record: EV-ECQ-d9ffe6
      field: OBS-1, and assumption-level statements that depend on it
      prior_claim: same false-negative claim as above.
      corrected_claim: see the item above; EV-ECQ-cbc837 OBS-7 carries the detail.
    - superseded_record: H-ECQ-a609f8
      field: assumptions[0]
      prior_claim: >-
        "The Nagao transcription in candidate_families.json is SELF-CONSISTENT
        ... BATCH-f2341e recorded the opposite verdict; that was a false
        negative, corrected by the validator (J1-F1) and re-verified by the
        Coordinator."
      corrected_claim: >-
        The transcription is INCONSISTENT AS RECORDED, by a constant square
        factor 1248^2; consistency holds only after a substitution nobody has
        sourced. The seven-coefficient identity itself reproduces
        digit-for-digit with constant ratio 1557504 -- the validator re-typed the
        coefficients by hand and re-derived it with its own polynomial arithmetic
        -- and two further coherence facts point the same way
        (4*lead(a4)^3 + 27*lead(a6)^2 = 0 exactly, and the fibre bookkeeping
        closing at Euler number 24). Six independent polynomial constraints
        satisfied with one free scalar landing on a perfect square is strong
        evidence that quartic and section come from ONE object. It is not
        evidence about WHICH object.
    - superseded_record: BATCH-f2341e candidate_families.json (surface_degree_d) and its
        downstream use in DEC-20260823-51726e R4/R5 and in this batch's task card
      field: shioda_tate_ceiling / ceiling_over_Q
      prior_claim: "ceiling 18 over C-bar and 17 over Q(T)"
      corrected_claim: >-
        For the transcribed NAGAO surface the ceiling is 15, geometric and over
        Q. 18/17 is the GENERIC elliptic-K3 bound 10d - 2 with all fibres
        irreducible; it is not this surface's ceiling. See R7. This correction is
        stated for the NAGAO surface; MESTRE-1991-QT11 is a different surface and
        this decision recomputes nothing for it.

  headline:
    statement: >-
      NO RECORD CELL WAS TAKEN. C1' IS NOT MET. NAGAO-1994's measured minimum
      minimal-model naive height is 109.5051651866501, at t = +-62, against
      pre-declared targets 69.33878142645637, 75.75973380404125 and
      85.18925824647027 -- gaps of +40.166384, +33.745431 and +24.315907. NO
      CELL WAS TAKEN ON ANY OF THE BOARD'S FOUR METRICS at any rank threshold
      any certified curve qualifies for: the validator extended the check to
      every (curve, k <= certified rank, metric) triple and got zero, and the
      red team built the log|Delta| frontier that the frozen baseline had
      OMITTED and found no cell there either, gaps +27.83 to +87.21. The closest
      approach anywhere on any metric is +2.571, on Faltings height. NOTHING WAS
      SUBMITTED TO ICARM, no endpoint was contacted, and the live board was not
      re-read. A NEAR-MISS IS NOT A RECORD, AND +2.571 IS NOT A NEAR-MISS.
    no_record_may_soften_this: true

  rationale:

  - id: R1
    label: C1' IS NOT MET. Judged alone, on its own four conjunctive conditions.
    text: >-
      C1' requires a curve FIRST EXHIBITED BY THIS PROGRAM -- absent from the
      frozen ICARM snapshot, not in Cremona's tables, not obtainable by lookup --
      accepted by the ICARM verifier AND taking a cell PRE-DECLARED in the
      governing hypothesis before the curve existed, measured against BOTH the
      frozen frontier AND the live board re-read at submission. The red team
      checked all four independently against the frozen snapshot.
      NOT IN THE FROZEN SNAPSHOT: PASS. All nine available curve_key values
      intersected against the 289 frozen keys -- empty.
      NOT A CREMONA-TABLE CURVE: PASS. Conductors of 25, 43, 33 and 40 digits
      against Cremona's N <= 500000, six digits.
      TAKES A PRE-DECLARED CELL AGAINST THE FROZEN FRONTIER: FAIL, and not
      narrowly. Gaps +40.17 (t = 62, r >= 12), +34.35 (t = 1, r >= 14), +49.71
      (t = 2, r >= 11), +94.02 (t = 0, r >= 6) on naive height; no cell on
      Faltings, log conductor or log|Delta| at any threshold.
      AGAINST THE LIVE BOARD: N/A. Nothing was submitted and no live re-read was
      performed -- correctly, since nothing was eligible. This decision
      therefore makes NO statement about third-party movement since the freeze.
      NOTHING SATISFIES C1' AND NOTHING ACCIDENTALLY COULD. The red team
      extended the eligibility check to its own 141221-fibre search, whose
      minimum is the same 109.505165, so no fibre anywhere in that far larger
      volume is eligible either. The hypothesis's exclusions hold: nothing here
      touches r >= 15 or r >= 1, and a claim on either would be void on its
      face.

  - id: R2
    label: >-
      BOTH REVIEWS WENT AGAINST THE CAMPAIGN AGAIN. Recorded plainly, as the
      second consecutive round in which independent review broke the
      Coordinator's own framing.
    text: >-
      VALIDATOR TASK-20260823-72505a, verdict FAILED. J1 (the Nagao object)
      BREAKS on two recorded claims: the "self-consistency" wording and the
      overturning of BATCH-f2341e's verdict (F2), and the inherited Shioda-Tate
      ceiling of 18/17 (F1). J2 (the height measurement) HOLDS COMPLETELY and is
      stronger than the producer reported.
      RED TEAM TASK-20260823-eaf799. J3 (the target choice) BREAKS: the re-aim
      moved to three cells that are harder in absolute terms and held by a
      single live, advancing program, and the Coordinator's method-class
      explanation is refuted at its load-bearing premise by the primary source
      the board itself cites. J4 (provenance and C1') HOLDS WITH TWO
      CORRECTIONS: Nagao is represented on the board after all, as a curve and
      as a sieve, and the frozen baseline is missing a metric the board scores.
      WHAT THE FAILED VERDICT DOES AND DOES NOT MEAN, in the validator's own
      framing and this decision does not soften it in either direction: the
      MEASUREMENT is admissible and is confirmed more strongly than the producer
      claimed. What failed are four RECORDED STATEMENTS around it, two of them
      consequential for planning. The remedy is supersession, not repair, and
      that is what this decision does.
      THE ASYMMETRY IS THE COORDINATOR'S. Of the six load-bearing defects found
      this round, four are the Coordinator's (R3-R6) and one is a producer figure
      the Coordinator carried and used (R7). The producer's own work -- the
      measurement, the quarantine of its failed run, the refusal to reconcile two
      committed records silently, the separation of the wide probe from the
      declared fit -- came through review intact.

  - id: R3
    label: >-
      COORDINATOR ERROR E1. THE METHOD-CLASS HYPOTHESIS IS REFUTED BY A PRIMARY
      SOURCE, AND ITS SUPPORTING STATISTIC IS A CLASSIFIER ARTIFACT.
    text: >-
      I wrote in COORDINATOR-multimetric-check.md that "the small-curve cells
      appear to be held by DIRECT SEARCH over small curves, which buys size
      cheaply and cannot reach high rank", and that if so "NO amount of work on
      the specialisation axis takes those cells, and this campaign's entire A2
      premise ... is wrong at the root". I marked it unestablished and asked for
      it to be attacked. It was, and it is false.
      THE PREMISE IS REFUTED BY RETRIEVAL. The board's commentary cites ONE URL
      for all three incumbents and nobody in this program had opened it. The red
      team fetched and text-extracted it, and the author rules direct search out
      in his own words: "We could not approach r = 11 by searching all E up to
      height H: too many such (~ H^{4+6} = H^10)." The method is an algebraic
      parametrisation of the moduli space M_{1,k+1} of genus-1 curves with k+1
      marked points -- weighted projective models for k <= 4, the Grassmannian
      of lines in P^4 for k = 5 -- cutting the count from H^10 to H^{10-k},
      followed by an approximate MESTRE-NAGAO PRODUCT to select candidates and
      ellratpoints to certify. The identification is exact rather than inferred:
      the slides' r = 12 row (N = 26145292874820119408329144, a4 = -932733487)
      equals board #88 digit for digit and r = 13 equals #89; #157/#158/#244 are
      the improved version that beat them. BOTH SIDES OF MY DICHOTOMY ARE
      ALGEBRAIC CONSTRUCTION PLUS PARAMETER SEARCH. THE DICHOTOMY DOES NOT
      EXIST. And the incumbent that holds all three of my pre-declared cells
      RUNS ON the Mestre-Nagao heuristic H-ECQ-a609f8 demotes as unvalidated --
      gating on exact height first remains defensible internal discipline, but
      no record of this program may imply the incumbents avoid it.
      THE SUPPORTING STATISTIC WAS AN ARTIFACT OF A FREE-TEXT CLASSIFIER. The
      per-rank Mestre-class minima I quoted -- 206.81(12), 136.69(13),
      134.43(14) -- come from an unvalidated classifier over board commentary
      with no ground truth, and the classifier is underdetermined at exactly the
      two ranks where I drew the conclusion. Board #1 (r = 12, h = 79.329) reads
      "Found by Mestre (1982). A historical rank >= 12 record, via Dujella's ...
      tables"; a classifier keyed on SOURCING files it out of the construction
      class, one keyed on METHOD files it in. My hypothesis is about METHOD
      classes, so the second is the classifier that answers my question, and
      under it the construction-class minima become 79.329(12), 136.687(13),
      96.986(14) -- deltas of 127.48 and 37.44 -- putting the class +9.99 and
      +11.80 from two of the three cells rather than +137 and +49. BOARD #1 IS
      +9.99 FROM ITS CELL, NOT +137.
      WHAT SURVIVES OF IT, STATED SO THE CORRECTION IS NOT OVERSTATED EITHER.
      There IS a real structural difference and it is not the one I wrote:
      Elkies parametrises (E, P_1..P_k), a curve TOGETHER WITH k small
      independent points, so smallness is built in and rank emerges;
      Mestre/Nagao parametrise a Q(t) family of guaranteed generic rank and
      specialise, so rank is built in and size emerges. That version is
      supportable. It does not support "no amount of work on the specialisation
      axis takes those cells", and no record of this program may carry the claim
      in the form I wrote it. There is also a real DESCRIPTIVE program signal --
      P(the Elkies lineage holds the minimum at all three ranks under a
      within-rank label permutation, N = 200000) = 0.0031 -- but the MAGNITUDE,
      which is the only part my inference used, is not robust: summed gap 247.64
      under one classifier against 82.71 under the other.
      THE HONEST FINDING THIS BATCH CARRIES IS SMALLER AND MORE USEFUL:
      NAGAO-1994 WAS THE WRONG FAMILY, CHOSEN FOR THE WRONG REASON ("nobody used
      it"), AND AIMED AT THREE CELLS HARDER THAN THE ONE ABANDONED. It is 30.18
      worse than Mestre's own 1982 curve at the same rank. That is a
      family-choice failure, not a structural one.

  - id: R4
    label: >-
      COORDINATOR ERROR E2. THE RE-AIM WENT TO HARDER TARGETS, AND NO RECORD IN
      THIS BATCH NOTICED THE TRADE UNTIL THE RED TEAM.
    text: >-
      Frontier steps from the frozen file: r>=11 61.507; r>=12 69.339 (+7.832);
      r>=13 75.760 (+6.421); r>=14 85.189 (+9.429); r>=15 118.770 (+33.581);
      r>=16 125.334 (+6.563). r >= 15 IS THE SINGLE LARGEST STEP ANYWHERE BELOW
      RANK 17 -- the one outlier cell, the one whose incumbent is furthest above
      the frontier's own trend, and therefore THE SOFTEST CELL IN THE RANGE ON
      THE ANOMALY CRITERION THE GOAL RECORD ITSELF USES ("jumps 85.19 -> 118.77
      ... against steps of 9.4 and 6.6 on either side"; both figures verify
      exactly at 9.429 and 6.563). I abandoned the outlier and re-aimed at three
      ON-TREND cells 33.6 to 49.4 LOWER in absolute naive height, i.e. strictly
      harder for any method.
      I CONFLATED TWO SENSES OF "SOFT". BATCH-f2341e's red team showed r >= 15
      was hard FOR THE MESTRE METHOD CLASS specifically -- 118.77 is that class's
      global best across all ranks, so aiming there meant beating the best result
      the method had ever produced. That is a statement about ONE METHOD. "Soft"
      in the goal record is a statement about THE FRONTIER'S SHAPE. My re-aim
      fixed the first and destroyed the second, and H-ECQ-a609f8's
      target_cells_excluded block records the first reasoning while making no
      mention of the second.
      AND THE NEW TARGETS CARRY ELEVATED LIVE-BOARD RISK, which is the one risk
      C1' explicitly cares about. They are the current output frontier of a LIVE,
      ADVANCING program: the retrieved Jan-2023 slides list candidates for r = 12
      and r = 13 only, so #244 (r = 14, created 2026-07-06) is a rank the program
      gained INSIDE the two-month window the board covers; #157/#158 beat
      #88/#89 at the same ranks two weeks later; and the author's closing slide
      lists as still to be done "Massive runs, extensive statistics." The same
      lineage holds the minimum naive height at EVERY threshold from r >= 5 to
      r >= 14. THE CAMPAIGN HAS BEEN AIMING AT ONE RESEARCH PROGRAM'S HOME TURF
      SINCE THE GOAL WAS WRITTEN.
      BINDING ON THE SUCCESSOR: any hypothesis that pre-declares a target cell
      must STATE WHICH NOTION OF "SOFT" ITS SELECTION USES AND DEFEND THE CHOICE
      AGAINST THE OTHER. And "a program stops at rank k" needs an argument, not
      a snapshot count -- a count of what a program has published so far is a
      fatigue report about the board under docs/inventor-protocol.md section 4.

  - id: R5
    label: >-
      COORDINATOR ERROR E3. I WRONGLY DECLARED BATCH-f2341e'S NAGAO VERDICT A
      FALSE NEGATIVE, TOLD THE USER SO, AND BUILT A HYPOTHESIS AND A HANDOFF
      CONSTRAINT ON IT. It was a TRUE negative and my correction was the error.
    text: >-
      BOTH REVIEWERS, BLIND TO EACH OTHER, SAY OTHERWISE. The validator (F2)
      checked the retrieved section directly: the point AS RECORDED,
      ((t+703)/15, N(t)/75), does NOT lie on the transcribed quartic; only the
      rescaled point ((t+703)/15, 1248*N(t)/75) does, so BATCH-f2341e tested the
      retrieved pair, its FAILS verdict is CORRECT ABOUT THE PAIR IT TESTED, and
      nagao_height_budget.json's batch_f2341e_verdict_overturned: true is not
      supported. The red team (RT-CORR-O2) shows why and inverts the diagnosis:
      every one of the thirteen distinct integer coefficients of the transcribed
      quartic is EXACTLY divisible by 1557504 = 1248^2, so the transcription is
      1557504 * Q0 for an integral Q0 and the published section lies on y^2 = Q0
      exactly, unmodified. The orchestrating session confirmed the divisibility
      over all 14 nonzero coefficients. THE REPAIR IS TO DIVIDE THE EQUATION BY
      1248^2, NOT TO MULTIPLY THE POINT BY 1248, AND THE TRANSCRIPTION IS
      PROVABLY NOT THE PUBLISHED EQUATION.
      THE PROCEDURAL FAILURE IS WORSE THAN THE ARITHMETIC ONE. I did not merely
      get it wrong; I put the answer into the producer's handoff as a constraint
      ("The Nagao transcription IS self-consistent: the point ((t+703)/15,
      1248*N(t)/75) ... BATCH-f2341e recorded the opposite; that was a FALSE
      NEGATIVE"), so the producer's check was CONFIRMATORY, not an independent
      derivation of the 1248. The validator flags exactly this and it is right:
      the producer was told the answer and confirmed it, which is a legitimate
      check and must never be recorded as an independent derivation. I also
      recorded a finding against the BATCH-f2341e producer for filing a false
      conclusion under verified_here, and relayed the reversal to the user. That
      producer's VERDICT was right. What was wrong in its record was only its
      stated JUSTIFICATION, which asserted the ratio was not a square when it is.
      The finding against it is withdrawn as to substance in supersedes_claims.
      EV-ECQ-d9ffe6 AND DEC-20260823-51726e CARRY THE WRONG CLAIM AND ARE
      IMMUTABLE. This decision supersedes it explicitly and by field; neither
      record is edited.
      NUMERICALLY NOTHING MOVES -- 1248^2 is a perfect square, y -> 1248y is a
      Q-isomorphism, and the red team re-derived ten heights from the scaled
      quartic to 1e-10 to confirm it. That is exactly why the error is worth
      recording: an error that changes no number is the kind a program stops
      looking for.
      WHAT IS NOW OWED IS SHARPER THAN BEFORE: source retrieval against Q0
      rather than against the scaled quartic -- OCR of the Project Euclid scan
      of Nagao 1994 or a clean pdftotext extraction of arXiv:math/9709235
      equation (1) -- and the defect to retrieve against is "where does the 1248
      come from", not "does the equation match".

  - id: R6
    label: >-
      COORDINATOR ERROR E4. THE FROZEN BASELINE OMITTED A SCORED METRIC, MAKING
      A DISCRIMINANT-CELL CLAIM UNJUDGEABLE; PLUS THE ALREADY-RECORDED
      PRE-DECLARED TARGET-VALUE DEFECT.
    text: >-
      (a) THE MISSING METRIC. COORDINATOR-multimetric-check.md correctly says
      the board keeps a record per (rank threshold x metric) and names four --
      naive height, Faltings height, log conductor, DISCRIMINANT -- then
      tabulates three, because frontier_20260823.json carries only
      min_naive_height, min_faltings_height and min_log_conductor. The board
      plainly scores log|D|: curve #276's own commentary reads "Rank-15 records
      in naive height, log|D| and Faltings: ... log|D| = 108.6915 (beats
      110.5171)". So my title "NO cell on ANY metric" was a claim about three
      metrics, and until the red team built the fourth frontier a
      discriminant-cell claim was UNJUDGEABLE AGAINST THE FROZEN BASELINE --
      exactly the failure mode preregistered_baseline.why exists to prevent. The
      red team repaired it FROM THE AUTHORITATIVE SNAPSHOT rather than from a
      live re-read, which is the only honest repair available: the frozen
      icarm_database_20260823.json carries a discriminant field per curve, and
      the derivation validates against the board's own published figure to four
      decimals. Derived cells: r >= 12 -> 61.2909 (#157), r >= 13 -> 65.8371
      (#158), r >= 14 -> 77.1267 (#244), r >= 15 -> 108.6915 (#276). NAGAO takes
      none of them, gaps +27.83 to +87.21. My conclusion survives the metric I
      did not check; the preregistration defect stands regardless, because
      nothing hanging on it this round is luck rather than discipline.
      (b) THE PRE-DECLARED VALUES. Two of the three incumbent values in
      H-ECQ-a609f8 do not match the frozen baseline they were copied from
      (r >= 12 by 5.99e-05, r >= 13 by 5.29e-04; r >= 14 identical). Raised by
      the producer, confirmed by me before any archive, recorded in
      CORRECTION-predeclared-target-values.md, and verified again by both
      reviewers here. The boxes are empty under both value sets. The
      correction's DISPOSITION stands -- the baseline wins, H-ECQ-a609f8 is not
      edited, future targets are derived by computation with the source file's
      sha256 recorded -- but its REASONING is backwards and the red team is
