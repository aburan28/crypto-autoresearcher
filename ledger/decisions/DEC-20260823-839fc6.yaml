      PROMOTION IS THEREFORE CARRIED, NOT DECLINED, and its content is
      PRE-DECLARED IN FULL BELOW so that it cannot drift while it waits. It is
      component (f) of the single next action and is not optional.
      ROOT CAUSE: the declared artifact set of this archival task was assembled
      by hand instead of derived from what the task would be required to write --
      the fourth instance of the defect DEC-20260823-51726e R10(d) settled
      prospectively. Charged to the Coordinator.
    pre_declared_finding:
      proposed_id: to be minted with tools/allocate_id.py --next kn-find at authoring time; NOT minted here
      title: >-
        Rank candidate Q(t) families by measured height envelope, not by generic
        rank: buying generic rank buys a steeper height law
      statement: >-
        For an elliptic surface of degree d over P^1, a minimal Weierstrass model
        has deg a4 <= 4d and deg a6 <= 6d, so the fibre's naive height satisfies
        h(E_t) = 12d log|t| + O(1); Shioda-Tate caps generic Mordell-Weil rank at
        10d - 2, so a family of generic rank r has d >= ceil((r+2)/10) and hence
        an asymptotic height slope of at least 1.2(r+2). The small-parameter
        lever therefore exhausts inside a bounded region of small-Weil-height
        parameters, and inside that region the fibre height is set by the
        family's own O(1) constant rather than by the parameter. THE OPERATIONAL
        CONSEQUENCE IS A CHEAP GATE: candidate families are ranked by the
        MEASURED lower envelope of minimal-model naive height over the crossover
        band -- about two seconds and 1e5 fibres per family -- rather than by
        generic rank, because at fixed d the constant varies enormously between
        families.
      worked_instance: >-
        The transcribed NAGAO-1994 quartic: d = 2, predicted slope 24 against a
        measured 24.14, flat arm h = 119.42 + 0.062 log|t| below the crossover
        at |t| ~ 89, lower envelope 109.5051651866501 at t = +-62 over 141221
        fibres, against Mestre 1982's 79.329 at the same rank 12. The gate would
        have rejected the family before a batch was spent on it.
      proof_status: derivation
      proof_status_must_not_be_stronger_than: EV-ECQ-cbc837, whose proof_status is `derivation`.
      proof_refs: the two review reports named in EV-ECQ-cbc837 proof_refs.
      scope_line_that_must_appear_verbatim: >-
        The slope law and the 1.2(r+2) bound are claimed for minimal Weierstrass
        models of elliptic surfaces over P^1; the O(1) term is UNMEASURED outside
        the one family measured here; the 109.505 figure is claimed for the
        transcribed NAGAO-1994 surface and nowhere else; and nothing in this
        finding bears on rank >= 31 over Q, which remains an open world record.
    index_note: >-
      knowledge/INDEX.md is generated and gitignored (CLAUDE.md, "Generated
      artifacts are never committed"). Nothing was promoted in this commit, so
      nothing is regenerated or staged with it; the archive that lands the
      KN-FIND must regenerate and include it.

