  knowledge_promotion:
    promoted: []
    mandatory: true
    not_warranted: >-
      NOT "NOT WARRANTED" -- OWED AND BLOCKED, AND THE DISTINCTION IS THE POINT.
      This decision is `reject_scoped` on evidence of strength `replicated`,
      which under agents/coordinator.md MANDATORILY requires promoting a KN-FIND
