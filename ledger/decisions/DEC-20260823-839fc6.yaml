      (g) AND THE PRODUCER'S DISCIPLINE HELD WHERE IT MATTERED: the exact height
      gate ran FIRST and, because it left nothing, MESTRE-NAGAO ORDERING WAS
      NEVER RUN -- there was no admissible set to order, which is the reordering
      DEC-20260823-51726e OBJ-11 required and it was honoured. The failed run
      was preserved and marked. The wide probe was never merged into the
      declared fit. The target-value contradiction was flagged rather than
