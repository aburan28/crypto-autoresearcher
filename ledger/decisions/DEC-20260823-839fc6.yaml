      DEC-20260823-51726e R10(d) settled prospectively and I did not apply to my
      own task card: THE DECLARED SET WAS ASSEMBLED BY HAND INSTEAD OF DERIVED
      FROM WHAT THE TASK WOULD HAVE TO WRITE. Charged to the Coordinator.
      (e) NO EXP-* CONTRACT EXISTS FOR THIS BATCH EITHER. That was component (h)
