  hypothesis_disposition:
    target: H-ECQ-a609f8
    status_before: proposed
    status_after: rejected
    why_the_status_moves: >-
      BECAUSE THE HYPOTHESIS'S OWN DECLARED FALSIFICATION CONDITION FIRED,
      exactly as written and on evidence far exceeding what it asked for.
      Falsification clause 1: "FALSIFIED if the measured height budget of Nagao
      gives an EMPTY admissible parameter box at all three pre-declared
      targets." All three boxes are empty, under both the pre-declared and the
      frozen values, on three independent implementations, over 141221 fibres.
      There is no timeout, crash or infrastructure failure anywhere in this
      round to confuse with a mathematical result: 0 timeouts, 0 crashes, one
      implementation error quarantined and superseded, and the emptiness
      reproduced by two agents who wrote their own code. THE PRECEDING BATCH
      DELIBERATELY DID NOT MOVE H-ECQ-d60d07 BECAUSE NEITHER OF ITS CONDITIONS
      FIRED; the symmetry requires that this one move now that its condition has.
    what_the_rejection_does_NOT_adopt: >-
      CLAUSE 1'S OWN QUANTIFIER. It continues "Then this family cannot take those
      cells at any parameter". THE EVIDENCE DOES NOT SUPPORT THAT AND THIS
      DECISION DOES NOT ASSERT IT. No statement here is quantified over all t in
      Q; a universal claim would need a proof bounding the fibre height below
      over the whole parameter space, and nobody attempted one. The rejection is
      scoped to the enumerated regions, this Weierstrass model of this surface,
      and the four frozen or frozen-derived metrics. RECORDED AS A CRITERION
      DEFECT: a falsification clause that converts a bounded search into a
      universal statement is over-written, and the successor must state its
      quantifier honestly.
    falsification_clause_2: >-
      ITS TRIGGER FIRED NUMERICALLY AND ITS STATED CONSEQUENCE IS NOT TAKEN ON
      THAT BASIS. Certified rank is 6 at t = 0 and 11 at t = 2, both below 12
      and both PARI-determined rather than timed out. The clause reads that as
      evidence the coefficients are not Nagao's and withdraws the family. R9
      gives the reason that inference is unsound: t = 0's drop is structurally
      forced by the family's own t -> -t involution, so it was the one parameter
      in the box guaranteed in advance to be exceptional, and the generic rank
      is independently corroborated near 12 by a null-controlled measurement.
      THE ACTION'S SUBSTANCE HAPPENS ANYWAY -- the family leaves the A2 lane by
      this rejection, and source retrieval remains owed and blocking -- so
      nothing is loosened and no protocol_amendment is required. What is replaced
      is the clause's stated REASON.
    falsification_clause_3: >-
      HONOURED. "NOT falsified by failing to take a cell after a non-empty box is
      found and searched" did not arise: the box was empty, so no search ran and
      no cell was contested. The clause's reporting requirement -- a
      bounded-search negative reported WITH THE VOLUME COVERED -- is met with the
      corrected volumes: 569 distinct curves (producer), 7593 parameters
      (validator), 141221 fibres (red team).
    what_is_corrected_in_the_hypothesis_favour: >-
      Two things, and they are recorded because a rejection that suppresses what
      the object got right is not a measurement. Its assumption 2 -- "Silverman
      specialisation motivates and NEVER certifies" -- was correctly stated and
      correctly observed throughout, and the red team raises no objection to it.
      Its assumption 3 -- that Mestre-Nagao ordering is neither validated nor
      refuted and is used only after an exact height gate -- was honoured to the
      letter, and because the gate left nothing, the ordering step never ran.
    mechanism_of_record: >-
      H-ECQ-a609f8 IS IMMUTABLE AND IS NOT EDITED. The rejection, its scope, the
      replacement of the mechanism sentence by the piecewise law and the 12d
      slope bound, and the corrections to assumption 1 bind through this decision
      and EV-ECQ-cbc837. A SUPERSEDING HYPOTHESIS is a declared component of N1
      and must be committed before the next batch dispatches a producer.

  pareto_and_baselines:
    axis: ICARM minimum naive height at rank thresholds r >= 12, 13, 14 -- the campaign's own pre-declared axis
    incumbents:
    - "r >= 12: 69.33884136527462 (curve #157, Elkies JMM23 lineage, 2026-06-24)"
    - "r >= 13: 75.76026257010892 (curve #158, same lineage, 2026-06-24)"
    - "r >= 14: 85.18925824647027 (curve #244, same lineage, 2026-07-06)"
    incumbent_method: >-
      NOT direct search. Per the primary source the board itself cites: algebraic
      parametrisation of the moduli space M_{1,k+1} of genus-1 curves with k+1
      marked points -- weighted projective models for k <= 4, the Grassmannian of
      lines in P^4 for k = 5 -- reducing the search from H^10 to H^{10-k}, scored
      by an approximate Mestre-Nagao product, certified with ellratpoints. The
      author explicitly rules direct search out as infeasible.
    our_method: >-
      A published Q(t) family of generic rank exactly 12 (transcribed, and now
      known to be 1248^2 times the published equation), specialised at small
      rational t, gated on exact naive height before any ordering, certified by
      exact descent.
    our_best: 109.5051651866501 at t = +-62, certified rank >= 12.
    same_method_class: >-
      Yes in the sense that matters -- both are algebraic construction plus
      parameter search -- and NO in the sense the red team identifies: the
      incumbent parametrises a curve TOGETHER WITH its small points, so smallness
      is built in; we parametrise rank and let size emerge.
    dominated_by:
      value: {r>=12: ICARM #157, r>=13: ICARM #158, r>=14: ICARM #244, r>=11: ICARM #50, r>=6: ICARM #56}
      checked: >-
        EXHAUSTIVELY, and it is not null. 16 comparisons across all four board
        metrics -- naive height, Faltings height, log conductor, log|Delta| -- at
        each certified curve's own threshold: 16 LOSSES, minimum margin +2.57
        (t = 1, Faltings, r >= 14). The validator independently extended the
        three frozen metrics to every (curve, k <= certified rank) pair: 0 cells
        taken.
      within_method_class: >-
        ALSO DOMINATED. Mestre's own 1982 rank-12 curve sits at h = 79.329,
        30.18 BELOW Nagao's best fibre at the same rank.
    sota_delta: >-
      -40.166384 / -33.745431 / -24.315907 in naive height at the three
      pre-declared cells against the pre-declared values, and -40.166324 /
      -33.744903 / -24.315907 against the frozen baseline. Negative means worse
      than the incumbent. On the log|Delta| metric, -27.83 to -87.21. NOTHING
      MOVED on any axis of the frozen frontier.
    internal_baseline: >-
      BATCH-f2341e produced a best certified rank of 7 at h = 91.263 and a
      validator-certified Mestre rank-11 curve at h = 107.614. This batch's
      certified ranks are 6, 11, 12 and 14 at heights 124.400, 111.217, 109.505
      and 119.534. On CERTIFIED RANK this batch is this program's best to date
      (14, from a family whose generic rank is 12); on HEIGHT AT A GIVEN CELL it
      is as far away as before. Neither is progress toward a record and neither
      is presented as such.
    eliminated_dimension_check: >-
      Applied to the +-t symmetry: it halves the search space and costs nothing
      to compute, since it is visible in the committed polynomial. The saving is
      real and it is a saving in COST, not a step toward a cell.

