      deliverable in minutes, nothing missing from the container, and
      outcomes in either direction that change a table cell. 4b65e3's
      remaining zero-compute content is carried inside S1 rather than
      spending a lane on it, and its ladder waits only on the S1 note and an
      overlap check against two CERTBIN successor decisions this session
      could not read.
