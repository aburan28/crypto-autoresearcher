  selected:
    - id: S1
      idea_id: IDEA-20260926-20ba8f
      question_id: RQ-BINSTD-b6f698
      absorbs:
        - idea_id: IDEA-20260926-4b65e3
          as: |
            A Stage 0 section. The pinned D3 column of CORR-20260928-4cb669
            (11.01, 33.08, 37.39, 42.52 bits at m = 4, 5, 6, 8) is adopted as
            the single-target comparator, written beside 4b65e3's mu = 1
            values (11.0, 32.4, 36.7, 42.2) with the 1.58-attempt factor
            (0.66 bit) explained and the 0.34-bit residual at m = 8 resolved
            on paper or recorded as a definitional difference (report A4).
            4b65e3's own claim (A) mislabel of the D1 column as rho over T
            is noted in the section and not repeated. 4b65e3's Stages 1-2
            are not absorbed; see HOLD-X1.
      scope: |
        Stage 0 (zero compute): recompute claim (B) and claim (C) of the
        record in Python: the cap locus B_cap per m (report A5), the generic
        frontier column T_gen = sqrt(N_prime / S) and P_gen at m in 4, 5, 6,
        8, 16 with N_prime = r/262, the identity P_IC = P_gen at C = T_gen,
        the statement that the LA term sits below P_gen at every m >= 4, the
        m = 5 crossing window in g, and the m = 4 window the record leaves
        open, stated exactly. Stage 1 (instrument gate, the frozen fixture):
        the full-log-vector solve and the shared-table multi-target rho on a
        relabelled Z/NZ group of about 2^20 with a random base of 2^7
        elements; both exponents must read within 0.1 of -1 and -0.5 before
        any curve cell is read. Stage 2 (heuristic validation, binary cells
        only): the n = 19 CERTBIN cell and the Koblitz n = 19 sibling at
        m = 2 with oracle A, L in 1, 4, 16, 64, 256 fresh targets with
        certificates, 30 seeds for rho per L, shared and per-target
        operations counted separately, usable-decomposition fraction and
        retries per target, the pooling constant against IDEA-20260920-2e37b3's
        toy range. Stage 3 (zero compute): the preprocessing column filed
        into the table beside the single-target column, labelled conditional
        on H1, H2 and on C. Excluded: the prime-field engine cells of the
        record's Stage 2 (routed to GOAL-ICPERF-e6b6a4 by PTR-ICPERF as an
        amortisation instrument that goal may rank); any deployed-parameter
        run. Zero runs in the design batch.
      decision_it_changes: |
        Whether RQ-BINSTD-b6f698's reachability table carries a second budget
        row for ECC2K-130 (preprocessing and multi-target) beside the
        single-target row, so that the m = 4 row priced at D3 2^11.01 per
        attempt is recorded as a single-target verdict with the
        preprocessing budget (about 2^43.5 per the record, to be recomputed)
        beside it, and every m >= 4 oracle record, the CERTBIN theta(m)
        ladder included, is read against both lines. Positive next decision
        if the Z/NZ gate passes and the binary-cell exponents read within
        the record's thresholds: the column is filed and HOLD-X1's ladder
        contract states both lines. Negative next decision if the real-set
        exponent is materially shallower than -1 with the usable fraction
        below 0.8 of the control: the amortisation is recorded as
        coverage-limited on subspace bases and the column carries the
        measured law. If the Stage 0 identity fails on recomputation, the
        frontier statement is withdrawn and only the column stands. Artifact
        outcomes (gate fails, certificates fail, pooling constant outside
        0.5 to 2) read nothing.
      proof_search_map_status:
        bottleneck_decision_changing: present
        baseline_reproduction: |
          Present. Symbolic checks (L = 1 reproduces the product law term by
          term; C = T_gen reproduces the generic frontier point; m = 23 with
