      Focus. Two lanes is the default active count. The queued certificates
      are scheduling holds with revisit conditions, not deprioritisation.
    - |
      Tripwires. Both selections are tripwire items, so their design rounds
      run at review-breakthrough at max, as DEC-20260924-99ce20 DEP-5 set
