coordinator_decision:
  id: DEC-20260901-f41451

  context: >-
    GOAL-AES-003 batch-opening act by the dispatching Coordinator (session
    coordinator-aes003-1, 2026-09-01). DEC-20260901-3150f0's RANK 1 named a
    cheap hardening battery of five controls supplied by the BATCH-fe0bdc
    red team (TASK-20260901-31bac8 red_team_report.yaml), to seal the
    scope-narrowed CONFIRMED-MISMATCH-ALIVE verdict (EV-AES-ec53f1) before
    it is spent downstream. The controls are already specified with costs
    in the red-team report; this batch executes them under one producer
    with fresh preregistration of every arm's expectation.

  decision: open_batch

  decision_scope: >-
    THIS DECISION OPENS BATCH-99945e TO EXECUTE THE FIVE RED-TEAM
    HARDENING CONTROLS.

    It opens coordination/goals/GOAL-AES-003/batches/BATCH-99945e/dispatch_queue.json
    on branch aes003-batch99945e-20260901 with one producer (five arms:
    J4 random-bijection r=6 at 2^30; J3 second-seed rerun of the r=6
    affine arm; J2 keyed bridge at r in {3, 7}; J1 census extension
    r = 11..16 plus one r = 16 keyed cell; proves-too-much guard:
    identity-law bridge on the dead Feistel substitute), snapshot,
    validator, and ledger archive cards. The goal head moves to
    BATCH-99945e ONLY in the ledger archive commit after validation.
    It promotes NO knowledge and asserts NOTHING beyond what the
    preregistered arm expectations return.

  target_ids:
    - GOAL-AES-003
    - RQ-AES-003
    - BATCH-99945e
    - EV-AES-ec53f1
    - DEC-20260901-3150f0
    - TASK-20260901-31bac8
    - IDEA-20260901-04606c
    - EV-AES-64750e

  outcome: >-
    SELECTION: the five red-team controls are dispatched as one producer
    task of BATCH-99945e. They are the named cheapest falsification
    controls for the four overclaim joints of EV-AES-ec53f1 (J1-J5 minus
    J5, which is bcb117's first ramp point and stays under RANK 2). The
    load-bearing arm is J4: one r=6 random-bijection arm at 2^30, whose
    preregistered reading decides whether the single-factor-contrast
    reading 'the factor differing alive-vs-dead at r=6 is the S-box'
    generalizes from 'AES S-box' to 'nonlinearity' -- an ALIVE reading
    there kills the nonlinearity-driven wording and the batch's evidence
    record must say so (the verdict then narrows further or reverts to
    the factor-contrast statement with the AES S-box named specifically).

  rationale:
    - >-
      Every arm is a named control with a stated cost in the red-team
      report; the battery is the cheapest way to discharge the four
      confounds EV-AES-ec53f1 carries before downstream batches spend
      the verdict.
    - >-
      One producer keeps the arms under one preregistration and one
      budget clock; total expected cost is minutes (arm (a) 2-4 min,
      arm (b) ~49 s, arms (c)-(e) seconds), well inside a 2700 s
      budget.
    - >-
      J5 (per-trial wt(e) logging) is deliberately NOT in this batch:
      it is the first ramp point of IDEA-20260901-bcb117 (RANK 2), and
      folding it here would blur the battery's single purpose (sealing
      the current verdict, not opening the dilution ramp).

  next_action: >-
    EXECUTE BATCH-99945e per its queue: producer TASK-20260901-74271d,
    then snapshot, independent validator, and ledger archive
    (EV-AES-b2910a / DEC-20260901-079719). The ledger archive rewrites
    next_action on the battery's outcome: every control passing keeps
    the scope-narrowed verdict and promotes RANK 2 (bcb117 with its J5
    first ramp point); the J4 arm reading ALIVE narrows or reverts the
    nonlinearity wording before RANK 2 spends it; any other control
    failing routes to the matching repair. The remaining ladder from
    DEC-20260901-3150f0 (69912d, 02f7c4 B1-B3, decay design,
    BATCH-6fe3c2 debt) stays ranked behind this batch's outcome.

  evidence_refs:
    - ledger/evidence/EV-AES-ec53f1.yaml
    - ledger/decisions/DEC-20260901-3150f0.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-fe0bdc/tasks/TASK-20260901-31bac8/red_team_report.yaml

