  context: >-
    /design-experiment, one contract, for IDEA-20261005-497357. No
    hypothesis and no experiment on origin/main cites it. The branch
    design/drinf-497357-classes was created from origin/main at
    579e6944aa25fab8af7dcead777c9d3078e2e73d and git merge origin/main
    reported already up to date.

    The contract compares N_formula, the integer produced by the
    isogeny-class formula in arXiv:0412367 (Mohamed Ahmed Mohamed
    Saadbouh, Endomorphism Rings and Isogenies Classes for Drinfeld
    A-Modules of Rank 2 over Finite Fields, named by KN-LIT-174), with
    N_enum, the number of distinct monic Frobenius characteristic
    polynomials of the six modules Phi_T = g tau + Delta tau^2 over F_3.
    The pre-registered prediction is equality. A mismatch of at least 1,
    once both integers exist, is a negative. A missing formula withdraws
    the equality and does not substitute a remembered integer. No ECDLP
    exponent is claimed.

    This session opened knowledge/literature/KN-LIT-174.md. The note gives
    no integer. The local PDF paths it names are absent. The PDF was not
    opened. Provenance of the numerical count is recalled. That recalled
    integer is not evidence for this approval. The approval is of the
    protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is equality and fails when
    the two integers differ. No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The equality and the assignment of each observation to a reading are fixed before any run.
    - The Carlitz exclusion, the set size 6, and the bound-plus-one search give the count a way to come back invalid instead of an undercount.
    - A mismatch is a negative, so success can fail.
    - No module was enumerated while writing this decision, and no PDF integer was treated as verified.

  evidence_refs: []
  limitations:
    - Toy scope only: q = 3, six modules. No transfer.
    - The PDF integer was not opened. The frozen prediction is the equality, not a numeral.
    - This decision authorizes a later run. It does not start one.

