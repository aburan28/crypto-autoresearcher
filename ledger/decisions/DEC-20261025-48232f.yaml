# =============================================================================
# DEC-20261025-48232f -- Record the literature and derivation closures of the
# known-log / random factor-base family (Amadori-Pintore-Sala 2018 and its
# follow-ups) and of the lattice and product/norm decomposition routes over
# prime fields; promote nine literature entries and one open problem; add five
# known-result rows; authorize the additive correction CORR-20261025-ac5023 on
# H-ICEX-6ca21f. No hypothesis status changes; nothing was executed.
# =============================================================================
coordinator_decision:
  id: DEC-20261025-48232f
  context: >-
    The owner asked (2026-10-24) for an evaluation of Amadori-Pintore-Sala, "On the discrete
    logarithm problem for prime-field elliptic curves" (FFA 2018, ePrint 2017/609), under the
    suspicion that its techniques could improve this program's prime-field index calculus. Four
    delegated literature lanes read the paper (accepted manuscript), Petit-Kosters-Messeng 2016,
    McGuire-Mueller 2017/1262, Yokoyama-Yasuda-Takahashi-Kogure 2020, Wagner's long version,
    Jochemsz-May 2006, Galbraith's textbook chapters 13/15/19, Semaev 2004, Diem 2011 and the
    2019-2026 follow-ups (Kudo et al. 2018 abstract only), and the session ran four small
    computations in Sage/PARI. The owner then asked (2026-10-25) to record the resulting
    closures in the ledger and knowledge base.
  decision: revise
  target_ids:
  - H-ICEX-6ca21f
  rationale:
  - >-
    APS's two ideas (random known-log base R_j = u_j P + v_j Q; a single vanishing signed m-sum
    gives the logarithm) are the family behind H-ICEX-6ca21f's CRT argument. They are bounded
    below twice: generically, the relation search is the k-sum problem in E(F_p) and Wagner's
    Theorem 2 (W. Dai) turns any cyclic-group k-sum solver into a discrete-logarithm solver, so
    every generic solver needs Omega(sqrt p) (KN-LIT-7a7034); algebraically, Groebner bases on the
    split constraints need >= (m d^{m-1})^{1-eps} field operations per system with d = deg f_i
    (KN-LIT-8bf122, Lemma 8 / Proposition 9, under two statistical assumptions checked to 25
    bits), i.e. total > q^{m(1-eps)/(m-1)}. APS themselves write "We do not claim" to beat
    q^{1/2}; their own cost model is about m^m Groebner solves (KN-LIT-1e6270).
  - >-
    Of the ten techniques in APS, Kudo et al. 2018 and McGuire-Mueller 2017, four are already in
    the program's pipelines (chained S_3 systems; the (t1,t2) symmetrisation; the GCD step, which is
    the direct-subtraction root-finding oracle; McGuire-Mueller's Algorithm 4.1, which is the
    subtract/pair-table oracle of aburan28/crypto PR #1560), four are closed by the two bounds
    above, and two (disjoint partition; hybrid method) are constant-factor reorganisations whose
    linear-algebra or enumeration penalty is paid over F_p (KR-IC-52ad34, KR-IC-dbf1b0).
  - >-
    The multiplicative-subgroup and coset bases are Petit-Kosters-Messeng 2016 §3.3 (and the
    isogeny-kernel coset base is §3.4), not new leads; their compositional chains present the same
    quotient algebra F_p^{B^m} as the split polynomial, which is why PKM found the split system
    "intriguingly" easier and why Yokoyama et al.'s binomial, non-binomial and random families
    behave alike. A Lang-Weil/Bezout lemma recorded with this decision (report §3.2) extends the
    program's bounded-degree algebraic factor-base theorem (IDEA-20260801-021) from plane
    predicates to projections of varieties with auxiliary variables (KR-IC-585a96).
  - >-
    The Jochemsz-May reach for an arbitrary Newton polytope is delta_max = 1/((m+1) c_N); the
    fixed-target support of S_3, S_4, S_5 was computed to be the full box (9/9, 125/125,
    6561/6561 monomials), so the box bound 2/(m(m+1)2^{m-1}) = 1/6, 1/24, 1/80, 1/240 that
    aburan28/crypto RESEARCH_PRIME_FIELD_BREAKTHROUGH_PROGRAM.md §2.2 uses is exact for the basic
    strategy and cannot be improved by polytope-aware constructions (KR-IC-76aaed). Galbraith's
    textbook §15.8.1 and Diem 2011 §1 are the citable dismissals of Coppersmith for this task.
  - >-
    The product/norm formulation of the PDP is sublinear in one dimension (Bostan-Gaudry-Schost
    sqrt B for intervals; resultant with X^B - 1 for subgroups) and >= B from two dimensions on
    with every known tool; the double product Psi_2 is dense (computed), and the only collapse,
    for a linear polynomial through cyclotomic numbers (identity verified in PARI), costs >= p/B
    (KR-IC-3845fa). The two precise problems whose solution would move the exponent are recorded
    as KN-OPEN-1fa083.
