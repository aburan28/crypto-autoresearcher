  limitations:
  - >-
    No hypothesis status transition: H-ICEX-6ca21f stays approved and EXP-ICEX-153c34 stays an
    approved, unrun contract; this decision adds citations (CORR-20261025-ac5023) and ranking
    guidance only. The experiment's arm M now measures a literature-predicted floor (YYTK:
    m 2^{m-1} d^{m-1}; HEUR-ICEX-6ca21f-1: d^m); its arm X (frozen-L exponent) is unaffected.
  - >-
    The Lang-Weil/Bezout lemma, the general-polytope reach formula and the two-dimensional norm
    costs are derivations by this session, recorded in the report and not peer reviewed; the
    full-box support, the density of Psi_2, the free-relation counts and the cyclotomic identity
    are computations at toy sizes (p <= 2^28) with scripts and outputs committed.
  - >-
    Kudo et al. 2018 was read only through its abstract and two secondary restatements
    (Dzierzkowski-Wronski 2024 §3.2.4; Yokoyama et al. 2020 §1); KN-LIT-c1e815 says so. The
    Yokoyama et al. bound is heuristic under their Assumption 7 and Remark 8.
  - >-
    The literature was read by delegated lanes of the owner's session, not by an independent
    reviewer; the lane notes are committed verbatim so each quotation can be checked at source.
    No ECDLP claim on any deployed curve; nothing here is a cost measurement.
  next_actions:
  - >-
    Rank EXP-ICEX-153c34 below runnable work whose outcome the literature does not already
    predict; when it runs, read arm M against the YYTK floor and arm X as the only informative
    arm. Revisit if KN-OPEN-1fa083 (P1 or P2) is answered positively.
  - >-
    Any prime-field constant-factor work should go to the FHJRV 2-torsion symmetrised oracle on
    cofactor-8 curves (<= 8x on columns, nothing on the exponent; aburan28/crypto fghr_line.rs has
    the D_3 resultant machinery), charged against matched rho at the 0 / 0.1 / 1 GAE band;
    j = 0 orbit folds are already measured (E1-E18) and need no further run.
  - >-
    Exponent-seeking effort stays in the binary-field program (Galbraith-Gebregiyorgis Experiment
    2 and the Delta-sweep of the 2026-10-24 factor-base review), where the symmetry ideas of this
    literature have a Weil-restricted zero-dimensional system to act on.
  - >-
    Lead atlas: the new rows are attached to LEAD-ICP-algebraic-membership-factor-base,
