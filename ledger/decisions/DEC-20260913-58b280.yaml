coordinator_decision:
  id: DEC-20260913-58b280
  recorded_at: '2026-09-13'
  decided_at: '2026-09-13'
  decided_by: coordinator
  recorded_by_task: TASK-20260913-25c462
  archived_by: TASK-20260913-25c462
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  decision: accept_correction
  decision_label: >-
    Accept CORR-20260913-53739b as independently validated in its stated scope
    (TASK-20260913-25da8c, VAL-20260913-353848, passed), and record the four scope
    defects the validator found as CORR-20260913-91c6a5. No hypothesis status moves.

  context: >-
    CORR-20260913-53739b decided two numerical disagreements between duplicated copies
    of three SEMBIN proposals from the frozen paper's own formulas, and was committed
    by TASK-20260913-b03e25 (62bd331d4) before review. TASK-20260913-25da8c re-derived
    every authoritative figure BLIND -- from eq. (11)/(15)/(16), Section 4.5.2 and
    Table 3 of the paper plus the formula statements in the proposals, in code written
    from scratch, with independent-figures.json written (sha256 e63e898c...) before the
    blind_from directory was opened -- and then compared. Every cell matches to all
    displayed digits; re-running a copy of the producer's rederive.py reproduced its
    output byte-for-byte. The validator ran on a first-party model under the fallback
    recorded in DEC-20260913-c224bb (self-reported resolved_model_id, model_verified
    false).

  target_ids:
    - CORR-20260913-53739b
    - CORR-20260913-91c6a5
    - IDEA-20260913-9c54f9
    - TASK-20260913-25da8c

  official_transitions:
    CORR-20260913-53739b:
      from: recorded
      to: validated
      basis: >-
        VAL-20260913-353848 passed; verdicts correction_1 holds, correction_2 holds,
        no_conclusion_changes holds for every conclusion the correction names as safe.
        The record itself is immutable; this transition is recorded here and in
        CORR-20260913-91c6a5, which carries its scope defects.

  rationale:
    - >-
      WHAT WAS CONFIRMED. Stage-1 figures 181.7236/185.4718/212.8322/240.3043 at
      (571, 12, 48); re-optimised 175.1383 (15, 39), 176.8749 (15, 39), 192.8484
      (21, 28); crossovers 303/307/347/400 and 281/295/337/393; overcharge statistics;
      omega'-invariance; the un-ceiled coincidence; every correction_2 constant, floor
      and coefficient. All blind, all matching.
    - >-
      WHAT WAS NOT. Four scope defects, none arithmetic: two wording bounds that hold
      on a six-point grid and not over [100, 1000] (S1), a 22-for-18 bracket (S2), a
      proposal named but not listed in `corrects` whose k-threshold direction reverses
      under the faithful charge (S3), and a figure propagated unlabeled into four
      immutable records (S4). They are recorded in CORR-20260913-91c6a5 with the
      validator's numbers, un-re-derived by the Coordinator.
    - >-
      WHY NO STATUS MOVES. A validated correction sharpens what downstream records
      say about themselves; it is not evidence for or against any hypothesis, and
      none of S1-S4 changes an argmin, a crossover's existence, or a conclusion the
      correction named as safe.

  evidence_refs:
    - VAL-20260913-353848
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/review-25da8c/independent-figures.json
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/review-25da8c/report.md

  citations: []

  limitations:
    - No degree measured or asserted (IMP-SEMBIN-ENGINE); no statement about any curve's security.
    - The (C5) inequality's derivation and correction_3's git-history finding were out of the validator's scope and remain unreviewed.
    - Blind ordering rests on the attestation, timestamps and the embedded source hash; the filesystem cannot prove it.

  next_actions:
    - Readers of IDEA-20260913-191ed2, IDEA-20260913-8138a0, IDEA-20260913-9c54f9, DEC-20260913-cb5ee2, EXP-SEMBIN-92724f and H-SEMBIN-c59e50 take the m-label and the corrected figures from CORR-20260913-91c6a5.
    - No successor task; the correction chain is closed unless a later record reopens it.

