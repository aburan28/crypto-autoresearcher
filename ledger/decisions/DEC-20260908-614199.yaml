  rationale:
    - >
      N1 compliance: the amendment repairs the adjudicated control-design
      defects exactly as DEC-20260908-d361ab directs -- IV-1R asserts the
      n=6 conic rejection (degenerate_deg_s_2, certified total 0) per the
      Reading C adjudication and the red-team J1 exact derivation; IV-1C
      moves the certified-total n-1 assertion to n=8 with the F_l prime
      bound raised via a fixed non-adaptive three-rung ladder
      (1500/10000/100000) whose top rung must certify the closed-form
      total 7 on all 8 tuples, with a graded CERTIFIER_LIMITED outcome
      instead of an invented sufficiency claim; IV-3R ADDS the planted
      ELLIPTIC n=6 control from the R3-family shape (not the non-elliptic
      R7 family) that exercises the detection path, carrying the frozen
      SR-6 windows verbatim and governing the lower-bound-to-measured
      upgrade of the counts (red-team J4a).
    - >
      N2 compliance: the replication round uses a fresh declared seed set
      disjoint from v1, requires the actual machine/runtime disclosure
      where an independent machine is not achievable, and pre-registers
      the height-convention reconciliation -- N_6 per H under BOTH the
      recorded r_height convention and the solved-free-coordinate reading
      of HEUR-1's H, with verbatim source-predicate binding before any
      count, a full per-instance cross-tabulation, decade ratios as
      frozen DESCRIPTIVE tail_checks (no invented pass band), and three
      pre-registered interpretation branches.
    - >
      N3 compliance: the n=8 rescope selects the cap-raised branch
      (2.0e9, justified by the measured ~1.5e5 ops/tuple of R5 against the
      frozen 10^4-tuple sample), keeps the sample size unchanged for
      comparability, and takes the disclosure branch on the box
      convention (IC-732-3 integer box retained, declared as the
      enumerated scope, non-integer (a,b) not claimed empty, full
      rational lattice recorded as unmeasured).
    - >
      Additivity and immutability: specification.yaml v1 is untouched;
      runs R1-R8 are never re-scored; the amendment adds only new run
      slots, repaired expectations for those new runs, fresh seeds, and
      the reconciliation/rescope measurements. Recording-discipline
      repairs RD-1..RD-3 (PD-1, the R4 flag bug, the near-miss predicate)
      apply only to v2 runs.
    - >
      Protocol completeness verified before approval (v2_authorized.yaml
      protocol_completeness_check): enumerated runs, controls with
      invalidation clauses, pre-run declared seeds, budgets with binding
      counted-ops caps, stopping and invalidation rules, decidable
      success/falsification criteria with first-class negative outcomes,
      and required artifacts are all present. Under the standing user
      authorization of 2026-09-06 no user confirmation is requested;
      approval to perform work asserts neither that HEUR-1 is true nor
      that any v1 result is promoted.
    - >
      Scope guards carried: H-ECRANK-36d8d7 stays `analyzed` and moves
      toward `replicated` ONLY on the completed replication round plus
      its independent review round; C1 stays OPEN with the
      DEC-20260905-7adca0 candidate UNPROMOTED (IMP-2 stands; the
      review-breakthrough tier is never degraded); C2 remains NOT MET;
      N1 of DEC-20260822-7d356e is DONE and must not be re-dispatched;
      all v2 outcomes remain toy-tier with no transfer claim.
