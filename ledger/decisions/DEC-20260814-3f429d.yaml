  - EV-HQC-469c08
  - DEC-20260809-186c86
  context: 'This is the closing ledger archive for BATCH-0e126d''s single executor task,
    TASK-20260814-8bbdd2 (the discard-prefix repeat of the T=20,000 matched-pair extension on shards
    5000/6000 themselves, DEC-20260809-186c86''s pre-registered scaling-characterization task), reviewed
    by TASK-20260814-73d513 (Validator, verdict passed / ADMIT / MECHANICALLY_SOUND) and
    TASK-20260814-a49f1c (Red Team, contests no reported number, raises substantive coverage and
    heterogeneity objections). This decision applies DEC-20260809-186c86''s pre-registered
    shard-specific-vs-general-refutation framing to EV-HQC-469c08''s measurement exactly as frozen,
    records the outcome honestly when neither named branch fires, and checkpoints GOAL-HQC-001.'
  rationale:
  - 'THE PRE-REGISTERED FRAMING IS APPLIED EXACTLY AS WRITTEN, AND NEITHER NAMED OUTCOME FIRES.
    DEC-20260809-186c86''s next_actions named exactly two outcomes for the measured pooled SE at k=17 on
    shards 5000/6000: "lands near 0.068-0.070" (shard-specific to fresh shards 8001/8002) or "collapses
    the same way stage 2 did" (approximately 0.017905; general refutation). The measured value,
    0.032968496689324056, satisfies NEITHER literal condition -- independently reproduced to full
    double-precision exactness by the Validator and exactly by the Red Team (EV-HQC-469c08 O3-O5). It
    sits 0.03546 (linear distance) / 0.7385 (log-ratio) from the "near 0.068-0.070" reference and 0.01506
    / 0.6109 from the "collapses" reference -- roughly 2.4x closer in absolute distance and ~1.2x closer
    in log-distance to the collapse reference, but the frozen rule states no tolerance band around either
    number, so applying either label to this value requires an undisclosed judgment call the rule itself
    does not resolve. TASK-20260814-8bbdd2''s own handoff anticipated this exact contingency in its
    completion_gate ("the receipt shows the substitution... or states plainly that the measured value
    fell in neither named zone"), and this decision applies that instruction literally: NEITHER outcome
    fires, and this is recorded as such rather than forced into either bucket.'
  - 'THE VALIDITY GATES THAT WOULD FORBID ANY INTERPRETATION BOTH PASS, SO THIS IS AN ADMISSIBLE BUT
    AMBIGUOUS MEASUREMENT, NOT A BRANCH-D-STYLE NON-RESULT. The disjointness self-check (the load-bearing
    validity gate proving the retained tail is genuinely new, never-before-analyzed data) and the new
    F[:, 0:n_e-1] structural invariant (EV-HQC-3a0372 O11''s previously-untested check) both PASS,
    independently reconfirmed twice by the Validator from a separately-written driver and once by the Red
    Team. D2/D3 are clean on all 4 calls, no truncation, no crash, well inside budget. The measured value
    is therefore genuine, admissible evidence about this specific 3-point fit on shards 5000/6000 -- it is
    the frozen binary rule''s COVERAGE, not the measurement''s validity, that is at issue.'
  - 'THE INDEPENDENT RED TEAM''S NEWLY COMPUTED PER-SHARD EVIDENCE POINTS AWAY FROM, NOT MERELY FAILS TO
    CONFIRM, THE "SHARD-SPECIFIC TO 8001/8002" READING -- THIS IS THE SUBSTANTIVE FINDING OF THIS BATCH,
    RECORDED AS A DIRECTIONAL LEAN, NOT A CONCLUSION. Recomputing the single-shard-only (unpooled) local
    exponent between each shard''s own committed T=5,000 SE and its own new, disjoint T=10,000 tail: shard
    5000 ALONE gives local exponent 2.836 -- MORE extreme than the original pooled fresh-shard step''s
    exponent (2.434) this entire task was designed to disambiguate -- with its point-estimate sign
    flipping between the two disjoint draws (+0.1018 -> -0.0215); shard 6000 ALONE gives 1.402. Across all
    four shards this campaign has ever measured at T~10,000/shard (5000=0.0175, 6000=0.0567, 8001=0.0245,
    8002=0.0221), shard 5000 -- an ORIGINAL, non-fresh shard -- now shows the SINGLE LOWEST SE of all
    four, lower than either "anomalous" fresh shard (EV-HQC-469c08 O6-O7). If the phenomenon were
    genuinely specific to shards 8001/8002''s freshness, an original shard drawing a fresh disjoint sample
    should not itself produce the single most extreme collapse of any of the four shards measured. This is
    evidence consistent with general shard-to-shard estimator heterogeneity at this defect class/parameter
    set, not evidence that settles it: it rests on exactly two single-shard data points per shard, and the
    matching second trial count that would give shards 8001/8002 the same treatment has not been run.'
  - 'A SEPARATE, INDEPENDENTLY DISCOVERED CONFOUND -- THE POOLING-CONVENTION ASYMMETRY -- FURTHER MEANS
    THE POOLED SE CANNOT YET BE CLEANLY ATTRIBUTED TO TRIAL-COUNT SCALING ALONE. Both the original
    alpha=1.470 4-shard fit and this task''s alpha=1.030 2-shard fit construct their T=5,000 point as the
    ARITHMETIC MEAN of two independent, single-shard point-in-isolation SEs, while their T=10,000 and
    T=20,000 points are the SE of a single, jointly POOLED (concatenated-histogram) dataset -- two
    structurally different statistics on the same log-log line, present identically in both fits and never
    isolated from genuine trial-count scaling in either (EV-HQC-469c08 O8). The pooled SE (0.032968) sits
    much closer to shard 5000''s own SE (0.0175) than to shard 6000''s (0.0567) or their simple average
    (0.0371), consistent with -- though not proof of -- pooling compression given the newly measured
    heterogeneity. This confound is orthogonal to the shard-identity confound the task was designed to
    remove, and holding shard identity fixed does not remove it.'
  - 'AN ALTERNATIVE EXPLANATION WAS TESTED AND REFUTED AT THE CELLS CHECKED, NOT LEFT AS AN OPEN GUESS.
    The Red Team instrumented the NaN-jackknife-dropout mechanism (jack_se normalizes leave-one-batch-out
    replicates by the full batch count regardless of finiteness) directly on all 4 of this task''s arms
    plus TASK-20260809-a79e4f''s original stage-1/stage-2 arms, at k=17 and at the k=25/26 edge of the
    evaluable range: 0/200 non-finite replicates everywhere checked. This narrows the space of candidate
    artifacts without closing it (EV-HQC-469c08 O9).'
  - 'A DOCUMENTATION-ACCURACY FINDING WAS INDEPENDENTLY AND IDENTICALLY FOUND BY BOTH REVIEWERS WITHOUT
    CONFERRING, AND IS DISCLOSED HERE RATHER THAN QUIETLY DROPPED. design.md Section 1 claims four
    provenance/bookkeeping utility functions (sha256_file, core_seconds, git_state, load_module) are
    "reused directly, verbatim, not re-derived" from matched_pair.py, in the same bullet as the four
    genuinely-imported, statistically load-bearing functions. Both reviewers independently diffed the code
    and found the four utility functions are actually locally re-defined (byte-identical bodies, confirmed
    by both, structurally forced by a bootstrap chicken-and-egg problem, not a careless deviation) while
    the four load-bearing functions genuinely are imported as claimed. This has no effect on any reported
    number and is not treated as blocking by either reviewer, but is recorded rather than corrected here --
    correction is superseding-record territory, per the Validator''s own stated prohibition on repairing a
    producer artifact in place.'
  - 'VALIDATOR AND RED TEAM BOTH ADMIT THE MEASUREMENT. Validator verdict: passed / ADMIT / MECHANICALLY_SOUND,
    every declared artifact present and hash-bound to the snapshot, every derived statistic reproduced to
    full double-precision exactness from independently regenerated raw data. Red Team: contests no reported
    number; its objections concern the pre-registered framing''s coverage and the substantive per-shard
    findings above, not the run''s soundness or honesty.'
  - 'H-HQC-18d1b4 IS UNCHANGED AND REMAINS PROPOSED, PER THE HANDOFF''S EXPLICIT INSTRUCTION. Nothing in
    EV-HQC-469c08 bears on the hypothesis in either direction: the frozen rule''s own binary test fires no
    branch, and the newly surfaced per-shard/pooling evidence, while substantive, is a directional lean on
    an instrument-scaling question, not a detection or null finding about the V3 defect''s propagation to
    k=17. Claim tier stays TOY throughout.'
  - 'KN-TECH-00f082 STANDS UNMODIFIED, BY THE SAME REASONING THAT APPLIES TO DEC-20260809-186c86''S
    FRAMING. That entry''s own "Falsification / narrowing condition" section mirrors the binary rule
    applied here (if the repeat "tracks 1/sqrt(T)"... the entry stands as filed; if it "collapses the same
    way"... the entry must be superseded). The measured value neither cleanly tracks nor cleanly collapses
    the same way, so this specific falsification condition is not triggered either. KN-TECH-00f082 is
    therefore neither reconfirmed nor superseded by this batch; it stands exactly as filed, and any
    revision is deferred to the narrower follow-up named in next_actions.'
