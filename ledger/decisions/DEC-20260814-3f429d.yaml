    this Coordinator session''s reach, exactly as DEC-20260809-186c86''s own limitations recorded for
    itself; see next_actions). Neither H-HQC-18d1b4''s status nor KN-TECH-00f082''s filed content is
    changed by this decision.'
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
