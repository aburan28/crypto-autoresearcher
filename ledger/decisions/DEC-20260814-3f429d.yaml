  limitations:
  - 'THE POOLING-CONVENTION ASYMMETRY (rationale item 4) IS AN OPEN METHODOLOGICAL QUESTION THIS CAMPAIGN
    HAS NOT YET CONTROLLED FOR. It is present identically in every SE-vs-trial-count fit run so far in this
    task family (the original alpha=1.470 fit and this task''s alpha=1.030 fit) and is not resolved by this
    decision -- only named, with a concrete follow-up (next_actions) that would isolate it from genuine
    trial-count scaling.'
  - 'THE PER-SHARD, SINGLE-SHARD-ONLY LOCAL EXPONENTS (rationale item 3) REST ON EXACTLY TWO SHARDS WITH
    TWO DATA POINTS EACH. Shards 8001 and 8002 have only one trial-count point on record (T=10,000/shard
    from TASK-20260809-a79e4f stage 2); no single-shard exponent can be computed for them without a new,
    second trial-count sample. The directional lean toward general estimator heterogeneity is therefore
    not confound-free evidence and should not be read as settling the shard-specific-vs-general question.'
  - 'THE DOCUMENTATION-ACCURACY FINDING (rationale item 6) IS RECORDED BUT NOT CORRECTED HERE. A future
    superseding record for design.md''s Section 1 language, or a shared, separately-pinned bootstrap
    module factoring out sha256_file/core_seconds/git_state/load_module, should precede the next task in
    this family reusing matched_pair_repeat.py the same way.'
  - 'THE NAN-JACKKNIFE-DROPOUT REFUTATION (rationale item 5) IS SCOPED TO THE CELLS ACTUALLY CHECKED
    (k=17, 25, 26, on this task''s four arms plus TASK-20260809-a79e4f''s original arms). It is not shown
    to hold at every k, for other defect classes, or at other parameter sets.'
  - 'AN INVERSE-VARIANCE-WEIGHTED POOLING ALTERNATIVE WAS NAMED BY THE RED TEAM BUT NOT COMPUTED IN THIS
    BATCH -- out of TASK-20260814-8bbdd2''s and both reviews'' declared scope, named here as the cheapest
    remaining control and dispatched as part of next_actions rather than computed retroactively by this
    Coordinator.'
  - 'THIS COORDINATOR SESSION HAS NO SHELL. It cannot run tools/allocate_id.py to mint a KN-TECH-* id for
    the candidate methodological lesson named in knowledge_promotion below, or task/batch ids for the
    follow-up named in next_actions -- exactly the same constraint DEC-20260809-46e85c and DEC-20260809-186c86
    recorded for themselves. The driving session must allocate these before dispatch, as it did for
    EV-HQC-469c08 and this decision''s own id.'
  - 'BUDGET DEBIT CONVENTION IS STATED BUT NOT A FULL HISTORICAL RECONCILIATION, unchanged in status from
    every prior checkpoint in this campaign. See the goal-head checkpoint for the exact figure and the
    convention applied.'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED OR CLAIMED. This program advances no
    asymptotic-complexity claim of its own here.'
  - 'NO CLOSURE QUORUM AND NO ATTESTATIONS. GOAL-HQC-001 is not being closed, no completion criterion is
    met or approached, and no completion_quorum block is written or implied.'
  knowledge_promotion:
    promoted: []
    not_warranted: 'HELD, NOT FILED AT THIS ARCHIVE -- for two independent, compounding reasons, neither
      of which is "no durable claim exists." (1) SUBSTANTIVE: a genuine candidate KN-TECH lesson is
      visible here (a pre-registered binary decision rule without a stated tolerance/tie-break band can
      leave a measured value covered by neither branch; a single-shard-only local exponent on an ORIGINAL
      shard can exceed the fresh-shard anomaly it was meant to explain; a pooling-convention asymmetry --
      arithmetic mean of per-shard SEs at one point, SE of pooled data at the others -- is baked
      unnoticed into every SE-vs-T fit run in this family so far) but its consequence is not yet
      confirmed: the four-shard local-exponent table is only half complete (5000/6000 done, 8001/8002
      missing a second trial-count point) and the pooling-convention alternative has not been computed.
      Filing now would repeat this campaign''s own named failure mode (BATCH-2ecaa1''s knowledge_promotion
      note: "promoting before testing the lesson''s own consequence would be premature"). Promotion is
      deferred to the ledger archive that closes the follow-up task named in next_actions, which either
      confirms this lesson with confound-free four-shard evidence or narrows it. (2) MECHANICAL: this
      Coordinator session has no shell and cannot mint a compliant KN-TECH-* id via
      tools/allocate_id.py, and CLAUDE.md''s ID-minting discipline forbids inventing one. The driving
      session should pre-allocate a KN-TECH id the same way it pre-allocated EV-HQC-469c08 and
      DEC-20260814-3f429d for this archive if it wants promotion to be possible at the very next archive
      rather than re-evaluated then. Separately, unchanged and unpromoted: the four-instance
      control-blindness pattern (held since BATCH-4b8ad3) and the planted-arm plateau lesson (held since
      BATCH-f8050e). KN-TECH-00f082 itself is neither re-confirmed nor superseded by this decision (see
      rationale item 8); no correction record is filed for it.'
  next_actions:
  - 'THIS BATCH''S DISPOSITION UNDER DEC-20260809-186c86''S SPECIFIC PRE-REGISTERED BINARY TEST IS
    INCONCLUSIVE/AMBIGUOUS, RECORDED PLAINLY RATHER THAN FORCED: the measured pooled SE at k=17 on shards
    5000/6000 (0.032968) satisfies neither the "near 0.068-0.070" nor the "collapses the same way"
    condition. No A/B/C-style branch is applied, EV-HQC-dd85c1''s required-T figures are NOT revised by
    this batch, and KN-TECH-00f082 stands unmodified (see rationale item 8) -- none of these actions is
    licensed by an ambiguous result.'
  - 'EXACTLY ONE NEXT TASK, NOT YET DISPATCHED (IDs to be allocated by the driving session; this
    Coordinator session has no shell): complete the four-shard single-shard-only (unpooled) local-exponent
    table by running the SAME discard-prefix, disjoint-trial-range technique TASK-20260814-8bbdd2 used, on
    a SECOND, different trial count for shards 8001 and 8002 INDIVIDUALLY (no cross-shard pooling
    anywhere), matching the design pattern already validated in this family; additionally compute and
    report an inverse-variance-weighted combination of the two shards'' own point estimates at k=17 (and
    ideally k=2..26) alongside the existing concatenated-histogram pooled estimate, on the data already
    collected at T=10,000 and T=20,000-equivalent scale. This is the Red Team''s own named
    next_concrete_action and required_controls items 1 and 3 (TASK-20260814-a49f1c), adopted because it
    is the cheapest available design that could turn the current directional lean (toward general
    estimator/shard heterogeneity, away from "shard-specific to 8001/8002") into confound-free evidence,
    and because it directly tests the two NEW questions this batch surfaced (per-shard heterogeneity,
    pooling-convention asymmetry) rather than repeating the same pooled 3-point fit at a fifth trial
    count, which would not discriminate any better than this batch already has.'
  - 'V1''S POSITIVE-CONTROL PILOT REMAINS SEQUENCED, NOT SHELVED, BUT IS DEFERRED AGAIN, and now follows
    the four-shard/pooling-convention task named above rather than following this ledger archive directly.
    DEC-20260809-46e85c originally deferred V1 behind scaling characterization on the reasoning that "a
    positive-control pilot is pointless to prioritize ahead of first knowing whether THIS instrument''s own
    sizing arithmetic is trustworthy" -- that reasoning applies MORE strongly now, not less: this batch
    resolved the shard-identity confound the prior batch surfaced, but in doing so surfaced two NEW,
    unresolved sources of estimator-behavior uncertainty (per-shard heterogeneity, pooling-convention
    asymmetry) rather than closing the original question outright. Committing to V1 before either is
    addressed risks sizing or interpreting a positive control through the same untrusted sizing arithmetic
    this whole task family exists to check.'
  - 'design.md''s Section 1 mischaracterization (rationale item 6) should be corrected by a future
    superseding record, or the four bootstrap utility functions factored into a separately-pinned shared
    module, before the next task in this family reuses matched_pair_repeat.py the same way. Low priority,
    disclosed and non-blocking, carried forward rather than actioned in this archive.'
