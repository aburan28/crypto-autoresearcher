  explicitly_untouched:
    - goal_ids: [GOAL-AES-003, GOAL-DREG-001, GOAL-ENDO-001, GOAL-MLKEM-005,
                 GOAL-SSI-001, GOAL-SSIQ-001]
      reason: >-
        Both maximum_batches and total_wall_clock_seconds are null
        (unbounded). Nothing is written to either field. Per the user's
        explicit scope instruction, writing a number here would RESTRICT an
        unbounded budget -- the opposite of the authorization -- and doubling
        or incrementing null is not an operation. These six goals leave this
        decision in exactly the state they entered it.
    - goal_ids: [GOAL-HQC-001, GOAL-ICEX-001, GOAL-SDEG-001, GOAL-SIG-001]
      reason: >-
        PARTIAL, NOT UNTOUCHED. maximum_batches is null on each, so no batch
        amendment is written and the batch budget stays unbounded;
        total_wall_clock_seconds is finite on each and IS doubled. Listed here
        so a reader who counts 40 wall-clock amendments against 36 batch
        amendments finds the four-goal difference explained rather than
        inferred.
    - field: campaign_budget.max_concurrent
      reason: >-
        DELIBERATELY UNTOUCHED ON EVERY GOAL, AND FOR A REASON THAT MORE WALL
        CLOCK DOES NOT ADDRESS: max_concurrent is bounded by the MACHINE, not
        by policy. This box is 4 cores / 15 GB. GOAL-AES-003 BATCH-002
        degraded badly at 3 concurrent producers on exactly that shape --
        load average reached 13, one producer's entire first segment was
        destroyed with ZERO measured numbers, another lost five of eight
        trials to timeouts, and the repair re-runs cost an overrun recorded as
        a Coordinator defect (DEC-20260802-b226fb budget_accounting).
        GOAL-DIFFP-84d641's campaign_budget_note cites the same event as its
        reason for max_concurrent 2. MORE WALL CLOCK DOES NOT BUY MORE
        PARALLELISM; it buys the ability to run the same width for longer,
        which is the only thing this decision grants.
  in_flight_batch_ruling:
    goal: GOAL-DIFFP-84d641
    situation_as_reported: >-
      Reported by the driving session and attributed to it, not measured here.
      BATCH-145531 (batch 3) is OPEN; its producer TASK-20260824-68ba87 is
      terminal with 5/5 runs valid; the batch awaits its snapshot archive. The
      goal's budget was the binding constraint the driving session surfaced:
      approximately 2550 s remained for batches 4-6, about 850 s each against
      a 1080 s even share, with three consecutive agent-time overruns and no
      armed session deadline. Under this raise the goal moves to 21600 s and 8
      batches.
    ruling: >-
      THE RAISE APPLIES IMMEDIATELY, INCLUDING TO THE IN-FLIGHT BATCH-145531,
      effective when the amendment commit is verified. It is NOT deferred to
      the next batch.
    reason_1_one_counter: >-
      campaign_budget.total_wall_clock_seconds and maximum_batches are
      CAMPAIGN-LEVEL CEILINGS on cumulative counters, not per-batch
      allocations. There is exactly one of each per goal, and every
      consumption check -- the one performed at this batch's close included --
      reads the value then in force. A prospective-only raise would require
      the goal to carry two simultaneous ceilings and the closing task to
      decide which applies to which second; no goal schema supports that, and
      inventing it would be a larger and less reviewable change than the raise
      itself.
    reason_2_nothing_scientific_moves: >-
      A ceiling raise changes no success criterion, no invalidation rule, no
      control, and no claim ceiling. The prohibition it might superficially
      resemble -- changing success criteria after observing outcomes without a
      versioned protocol_amendment -- is not engaged, because nothing that
      decides whether BATCH-145531 passed or failed is touched. The producer
      is already terminal and its 5/5 runs are already fixed; the raise cannot
      reach back and alter what was measured or how it is judged.
    reason_3_the_alternative_is_worse: >-
      Deferring would force the close of a batch whose work is already DONE
      and VALID to be adjudicated against a ceiling the user has just replaced,
      producing an artificial budget pause on completed work. That is the
      failure mode the authorization was sought to avoid, not one it should
      create.
    three_limits_on_this_ruling:
      limit_1_no_reopening: >-
        The raise does NOT reopen, re-declare, extend or amend BATCH-145531's
        frozen contract. EXP-DIFFP-04082e's specification, its run count, its
        hard terms and its invalidation rules stand exactly as frozen at
        opening. EXTRA CAMPAIGN BUDGET IS NOT AUTHORIZATION FOR A SIXTH RUN,
        a re-run, or an added arm. Any such addition needs its own decision
        against the frozen contract.
      limit_2_no_retroactive_laundering: >-
        The raise does NOT excuse, erase or re-label any overrun already
        incurred. The three consecutive agent-time overruns happened under the
        10800 s ceiling and are recorded as having happened under it. The
        closing record states both figures -- what was consumed, and against
        which ceiling in force at the time -- and does not rewrite history
        into compliance.
      limit_3_no_renumbering: >-
        BATCH-145531 remains batch 3. The amended maximum_batches of 8 means
        batches 4 through 8 remain available after it closes, not that this
        batch is re-indexed or that any earlier batch is refunded.
    what_the_raise_does_not_fix: >-
      NAMED HERE SO IT IS NOT DISCOVERED AT THE CLOSE: this raise does not fix
      the OVERRUN MECHANISM. GOAL-DIFFP-84d641 still has no armed session
      deadline -- only per-run ceilings -- which is why three consecutive
      agent-time overruns were possible at all, and per-run ceilings do not
      bound the agent time that produced them. MORE BUDGET BUYS ROOM, NOT
      CONTROL. A goal that overran a 10800 s ceiling without a deadline will
      overrun a 21600 s ceiling without a deadline; the raise moves the wall,
      it does not install a brake.
  flag_forward:
    not_part_of_the_amendment: >-
      The following is a forward requirement on a FUTURE decision. It changes
      no goal record now, is not written by the mechanical pass, and does not
      widen decision_scope above.
    item: >-
      The next opening decision of GOAL-DIFFP-84d641 (batch 4) must state
      explicitly whether it arms a session deadline covering agent time, and
      if it does not, must record why and what bounds agent time instead.
      Recording "no deadline" as a conscious choice is acceptable; leaving the
      question unasked for a fourth consecutive batch is not.
  what_this_decision_does_not_assert:
    - >-
      IT IS NOT EVIDENCE THAT ANY CAMPAIGN DESERVES MORE BUDGET. No goal was
      assessed on its merits for this decision, and none was ranked against
      another. A goal's presence in expected_values means only that it was
      `active` with a finite cap when the driving session measured the ledger.
    - >-
      IT IS NOT A JUDGEMENT THAT ANY GOAL IS GOING WELL. Most of these 46
      campaigns have NOT demonstrated that they need more budget. The raise is
      uniform because THE USER CHOSE A UNIFORM SHAPE, not because 46
      individual assessments concluded 46 times that more was warranted.
    - >-
      IT IS NOT A LICENCE TO SPEND. A ceiling is an upper bound, never an
      allocation and never a target. No batch may be opened, widened or
      extended merely because headroom exists; every batch still needs its own
      opening decision, its own declared envelope, and its own justification
      under its goal's existing scope, completion criteria and review
      requirements. Idle headroom does not justify admitting a lane, exactly
      as idle parallel capacity does not.
    - >-
      IT ASSERTS NOTHING ABOUT ANY RESEARCH CLAIM. No hypothesis moves, no
      evidence is reviewed, no claim tier moves, and no lane opens or closes.
      Claim ceilings recorded on any goal or batch are untouched and remain
      binding at their recorded values.
    - >-
      IT MAKES NO PREDICTION THAT THE RAISED BUDGET WILL BE SUFFICIENT, or
      that any goal will reach a completion criterion within it. A goal that
      exhausts the amended ceiling without meeting a criterion is
      `closed_at_budget` on its own decision, exactly as before.
