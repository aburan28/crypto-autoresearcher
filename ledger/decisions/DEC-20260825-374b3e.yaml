coordinator_decision:
  id: DEC-20260825-374b3e
  id_minted_by: >-
    Minted and verified free by the driving session with
    tools/allocate_id.py (--next coordinator_decision --date 20260825, then
    --check) before this record was authored. This Coordinator subagent holds
    no shell and minted nothing; the id is used as supplied.
  id_date_token_note: >-
    The id carries the date token 20260825 because the driving session minted
    it under that date. This record was authored on 2026-08-26 and the
    mechanical amendment lands on or after that date. The discrepancy is
    recorded rather than smoothed: decided_at below is the authoring date, the
    amendment keys carry the decision's date token so that a reader who greps
    a goal record for `_20260825` lands on this decision, and in_force_until
    carries the calendar date the amendment is actually applied.
  recorded_at: '2026-08-26'
  recorded_by: >-
    Coordinator subagent (requested policy coordinator-orchestration-code) in
    the driving session's Claude Code harness. This subagent has no shell, ran
    no command, and measured nothing. Every count, range and per-goal value in
    this record is the DRIVING SESSION's measurement, relayed and attributed;
    see scope_measurement below.
  decision: approve
  decision_vocabulary_note: >-
    `approve` here means approve the PROGRAM-WIDE CAMPAIGN-BUDGET CEILING
    RAISE itself, as a bounded administrative act executed on explicit user
    authorization. It approves no experiment, opens no batch, authorizes no
    run, dispatches no task, changes no hypothesis status, changes no goal
    status, and reactivates nothing. It is the "separate, explicitly
    user-authorized decision" that the goal records themselves demand before
    any ceiling moves.
  decision_label: >-
    program_wide_budget_ceiling_raise_x2_wall_clock_plus_2_batches_on_active_
    finite_capped_goals_user_authorized_uncapped_goals_untouched
  why_this_record_exists: >-
    Because the harness FORBIDS the alternative. The controlling precedent is
    DEC-20260812-f30c6e, the program-wide +1 batch raise, whose own text
    states of a ceiling raise: "THE COORDINATOR DOES NOT SELF-GRANT ONE; this
    is that separate, authorized decision." The same sentence is written into
    the goal records this decision touches -- see GOAL-MD5-001
    campaign_budget.maximum_batches_amendment_20260812 and GOAL-DIFFP-84d641
    campaign_budget_note ("THESE ARE CEILINGS AND THE COORDINATOR DOES NOT
    SELF-GRANT ANY RAISE"). The per-goal wall-clock precedent is
    DEC-20260822-85784e (GOAL-MD5-001, 10800 -> 18000 s). A Coordinator that
    raised its own ceilings would be deciding how much of the user's compute
    to spend on its own campaigns; the rule exists to make that impossible,
    and this record is the authorized instrument, not an exception to it.
  authorization:
    obtained: >-
      The user was asked directly, by the driving session, and answered. The
      authorization has two parts, both binding as given.
    part_1_shape: >-
      "x2 wall clock, +2 batches." On every `status: active` goal carrying a
      FINITE cap, campaign_budget.total_wall_clock_seconds is MULTIPLIED BY 2
      and campaign_budget.maximum_batches is INCREASED BY EXACTLY 2.
    part_2_scope: >-
      "Leave uncapped goals untouched." A goal whose maximum_batches or
      total_wall_clock_seconds is absent or null gets NO VALUE WRITTEN for
      that field. Writing a number onto an unbounded field would RESTRICT it,
      which is the opposite of the instruction. The two fields are judged
      INDEPENDENTLY: a goal may be uncapped on one and finite on the other,
      and four goals in this program are exactly that.
    chosen_not_defaulted: >-
      The question put to the user named the alternatives this shape beat --
      the `+1 batch only` precedent form of DEC-20260812-f30c6e, `x2 wall
      clock only`, and `x3 both`. The recorded shape is therefore a CHOSEN
      one, and a later reader must not read it as the harness's default or as
      a Coordinator preference.
    what_was_not_authorized: >-
      Nothing beyond the two fields named above. No reactivation of a
      non-active goal, no change to max_concurrent, no claim-tier movement, no
      new batch, no new run, and no relaxation of any completion criterion or
      pause condition.
  transformation:
    statement: >-
      Stated so a third party can verify any goal record against it without
      re-deriving intent.
    rule_1: >-
      new_total_wall_clock_seconds = old_total_wall_clock_seconds x 2
    rule_2: >-
      new_maximum_batches = old_maximum_batches + 2
    rule_3: >-
      absent stays absent; null stays null. No key is created for a field that
      is absent or null, and no amendment or history key is written for it.
    rule_4: >-
      The two fields are transformed independently, per authorization part 2.
      A goal with finite wall clock and null batches receives the wall-clock
      trio of keys ONLY.
    rule_5: >-
      Integer arithmetic only. Every old value in this program is an integer;
      x2 and +2 preserve that. No rounding, no unit change, no re-basing of
      accounting_basis.
  scope_measurement:
    measured_by: >-
      The driving session, over ledger/goals/ as of 2026-08-25/26. Attributed,
      not re-derived: this subagent has no shell and verified none of it by
      execution.
    active_goals: 46
    goals_with_finite_maximum_batches: 36
    maximum_batches_range: >-
      4 to 128 (minimum on GOAL-AES-002 and GOAL-RELN-001; maximum on
      GOAL-ECDLP-001).
    goals_with_finite_total_wall_clock_seconds: 40
    total_wall_clock_seconds_range: >-
      10800 to 2592000 (minimum on several goals including GOAL-DIFFP-84d641;
      maximum on GOAL-ECQ-e72c0b).
    goals_receiving_any_write: 40
    goals_receiving_both_fields: 36
    goals_receiving_wall_clock_only: 4
    goals_receiving_nothing: 6
    arithmetic_reconciliation: >-
      36 both-field goals + 4 wall-clock-only goals + 6 untouched goals = 46
      active goals. The 4 wall-clock-only goals are exactly the goals with a
      null maximum_batches and a finite total_wall_clock_seconds
      (GOAL-HQC-001, GOAL-ICEX-001, GOAL-SDEG-001, GOAL-SIG-001); the 6
      untouched goals are null on BOTH fields. 36 + 4 = 40 wall-clock
      amendments and 36 batch amendments, matching the measured counts above.
    frozen_working_list: >-
      The per-goal list the driving session measured is frozen at
      /tmp/claude-0/-home-user-crypto-autoresearcher/74014664-c8be-5466-9b08-3527be9a0cb4/scratchpad/scope.json.
      THAT FILE IS A WORKING ARTIFACT, NOT A LEDGER RECORD: it is outside the
      repository, it is not committed, it will not survive, and nothing in
      this program may cite it as evidence. The counts above and the
      expected_values table below are the durable form.
  decision_scope:
    binding_limit_on_the_amendment: >-
      BUDGET-CEILING RAISE ONLY. On every goal touched, the ONLY fields that
      change are campaign_budget.total_wall_clock_seconds and
      campaign_budget.maximum_batches, plus the four purely additive
      amendment/history sibling keys defined in amendment_template below.
    explicitly_not_touched_on_any_goal: >-
      completion_criteria; pause_conditions; claim_tier_ceiling;
      objective_and_scope; max_concurrent; accounting_basis; next_action;
      current_batch_id; dispatch_queue_path; latest_verified_commit;
      batch_checkpoints; active_hypothesis_ids; goal `status`; and the
      official status of every hypothesis, experiment and evidence record in
      the program. No campaign_budget_note is edited or deleted -- notes such
      as GOAL-DIFFP-84d641's "the Coordinator does not self-grant any raise"
      remain true and remain in force after this decision, which is precisely
      the rule this decision obeyed.
    citation_limit: >-
      STATED SO A LATER READER CANNOT CITE THIS DECISION FOR ANYTHING ELSE.
      This record supports exactly one proposition: that the user, asked
      directly by the driving session, authorized a x2 wall-clock and +2 batch
      ceiling raise on active finite-capped goals, and that the Coordinator
      executed it uniformly.
      Any citation of this decision in support of a research claim, a status
      transition, a scope expansion, a concurrency increase, or a judgement
      about any campaign's merit is a MISCITATION.
  amendment_template:
    convention_followed: >-
      GOAL-MD5-001 exactly -- campaign_budget.maximum_batches_amendment_20260812
      / maximum_batches_history_20260812 (DEC-20260812-f30c6e) and
      campaign_budget.total_wall_clock_amendment_20260822 /
      total_wall_clock_history_20260822 (DEC-20260822-85784e).
    placement: >-
      Each amendment key goes IMMEDIATELY AFTER the field it amends, and its
      history key immediately after that, inside the goal's `campaign_budget`
      mapping. Every other key in campaign_budget keeps its existing value and
      position. Pre-existing amendment and history keys from earlier dates
      (for example GOAL-MD5-001's `_20260812` and `_20260822` keys) are
      IMMUTABLE and are neither edited nor removed.
    literal_block_to_apply: |-
      campaign_budget:
        maximum_batches: <NEW_MB>
        maximum_batches_amendment_20260825: >-
          RAISED FROM <OLD_MB> TO <NEW_MB> (+2) on EXPLICIT USER
          AUTHORIZATION obtained by the driving Coordinator session by direct
          question to the user, and recorded in DEC-20260825-374b3e: a
          program-wide
          instruction to multiply campaign_budget.total_wall_clock_seconds by
          2 and to increase campaign_budget.maximum_batches by exactly 2 on
          every currently active goal carrying a finite cap, leaving uncapped
          goals untouched. THE COORDINATOR DOES NOT SELF-GRANT ONE; this is
          that separate, authorized decision. BUDGET-CEILING RAISE ONLY, BY
          EXACTLY +2 BATCHES. No other campaign_budget field is touched
          (total_wall_clock_seconds is amended by its own sibling key under
          the same decision; max_concurrent is deliberately untouched), and
          no completion_criteria, pause_conditions, claim_tier_ceiling,
          objective_and_scope, next_action, goal status or hypothesis status
          is touched. A raised ceiling is ROOM, NOT A JUDGEMENT that this
          campaign is going well and NOT A LICENCE TO SPEND.
        maximum_batches_history_20260825:
          - value: <OLD_MB>
            in_force_until: '<APPLY_DATE>'
            note: >-
              Superseded by the user-authorized "+2 batches" raise
              (DEC-20260825-374b3e). Whether this value was consumed is not
              asserted here.
        total_wall_clock_seconds: <NEW_TW>
        total_wall_clock_amendment_20260825: >-
          RAISED FROM <OLD_TW> TO <NEW_TW> (x2) on EXPLICIT USER
          AUTHORIZATION obtained by the driving Coordinator session by direct
          question to the user, and recorded in DEC-20260825-374b3e: a
          program-wide
          instruction to multiply campaign_budget.total_wall_clock_seconds by
          2 and to increase campaign_budget.maximum_batches by exactly 2 on
          every currently active goal carrying a finite cap, leaving uncapped
          goals untouched. Per the precedents DEC-20260812-f30c6e
          (program-wide batch ceiling) and DEC-20260822-85784e (per-goal wall
          clock), a ceiling raise is a separate, user-authorized decision and
          is NEVER self-granted; this is that decision. BUDGET-CEILING RAISE
          ONLY, BY EXACTLY x2. No other campaign_budget field is touched
          (maximum_batches is amended by its own sibling key under the same
          decision where it is finite; max_concurrent is deliberately
          untouched), and no completion_criteria, pause_conditions,
          claim_tier_ceiling, objective_and_scope, next_action, goal status or
          hypothesis status is touched. A raised ceiling is ROOM, NOT A
          JUDGEMENT that this campaign is going well and NOT A LICENCE TO
          SPEND.
        total_wall_clock_history_20260825:
          - value: <OLD_TW>
            in_force_until: '<APPLY_DATE>'
            note: >-
              Superseded by the user-authorized "x2 wall clock" raise
              (DEC-20260825-374b3e). Whether this value was consumed is not
              asserted here.
    placeholders:
      OLD_MB: >-
        The maximum_batches integer PRESENT IN THE FILE at application time.
      NEW_MB: >-
        OLD_MB + 2.
      OLD_TW: >-
        The total_wall_clock_seconds integer PRESENT IN THE FILE at
        application time.
      NEW_TW: >-
        OLD_TW x 2.
      APPLY_DATE: >-
        The calendar date the amendment is actually written, uniform across
        all 40 files. Write '2026-08-26' if the pass lands that day; if it
        lands later, write that later date on every file and report the
        deviation. Do not mix dates across files.
    partial_application_rule: >-
      On a goal with finite total_wall_clock_seconds and null/absent
      maximum_batches, apply ONLY the three total_wall_clock lines
      (total_wall_clock_seconds, total_wall_clock_amendment_20260825,
      total_wall_clock_history_20260825) and leave `maximum_batches: null`
      exactly as it stands, with no amendment key and no history key. The
      symmetric case (finite batches, null wall clock) does not occur in the
      measured set; if one appears, apply the batch trio only and report it.
    sharded_goals: >-
      Where a goal is sharded, campaign_budget lives in
      ledger/goals/GOAL-X/goal.yaml and the amendment is written there. NO
      CHECKPOINT SHARD IS WRITTEN BY THIS AMENDMENT: shards are write-once
      per batch and this is not a batch event.
  application_rules:
    file_value_governs: >-
      The transformation is applied to the value PRESENT IN THE FILE at
      application time, never to the value recorded in expected_values below.
      If a file's current value differs from the expected_values entry -- a
      concurrent merge landed a different ceiling, a goal was sharded, a goal
      left `active` -- STOP ON THAT FILE, write nothing, and report it. Do not
      silently write the table value, and do not silently write the file
      value either: an unexplained divergence means the measured scope is
      stale and the Coordinator must see it.
    status_gate: >-
      Re-confirm `status: active` on each file before writing. A goal that is
      `paused`, `blocked`, `closed_at_budget` or `completed` at application
      time is OUT OF SCOPE and is skipped with a report, exactly as
      GOAL-MLKEM-003 was skipped under DEC-20260812-f30c6e. Raising a closed
      goal's ceiling would smuggle a status change in as a budget act.
    no_other_edit: >-
      Stage only the goal files amended. Any other change in the working tree
      is out of scope for this amendment's commit.
    verification_after: >-
      Report back to the Coordinator: the number of files written, the number
      skipped with reasons, and any goal where the template did not fit
      verbatim. The Coordinator verifies that report before this raise is
      treated as in force. An amendment that exists only in an uncommitted or
      unpushed working tree is not in force.
    publication: >-
      The amendment commit is pushed to a branch with an open PR against
      `main` naming DEC-20260825-374b3e and the amended goal ids, per the
      Coordinator's branch and PR discipline. Merge origin/main in first;
      merge, never rebase. A sync conflict inside a goal record is resolved by
      a superseding record, never by editing one side.
  expected_values:
