  target_ids_note: >-
    Exactly the 40 goals that receive at least one written field. The six
    goals that receive nothing are deliberately absent from target_ids and are
    named in explicitly_untouched, so that "targets" cannot be read as "goals
    the Coordinator considered raising and declined".
  rationale:
    - >-
      THE AUTHORIZATION IS THE BASIS, AND IT IS THE ONLY BASIS. The user was
      asked directly and answered with a specific shape, chosen over three
      named alternatives. The Coordinator's contribution here is faithful
      execution and honest recording, not a budget judgement.
    - >-
      THE HARNESS FORBIDS THE ALTERNATIVE. DEC-20260812-f30c6e states in its
      own text, and the goal records repeat, that the Coordinator DOES NOT
      SELF-GRANT a ceiling raise; DEC-20260822-85784e is the per-goal
      wall-clock instance of the same rule. This record is the authorized
      instrument those rules point at. Without it, the correct action would
      have been to leave every ceiling where it was and let campaigns close at
      budget.
    - >-
      A UNIFORM SHAPE IS THE HONEST SHAPE FOR AN UNASSESSED SET. 46 campaigns
      were not individually assessed for this decision and the record says so
      plainly rather than dressing a uniform administrative act as 46
      merit-based judgements. Uniformity also makes the amendment mechanically
      verifiable: a third party checks two arithmetic rules against 40 files,
      with no intent to re-derive.
    - >-
      SCOPING BY THE PRESENCE OF A CAP, NOT BY THE COORDINATOR'S PREFERENCE.
      The user's second instruction -- leave uncapped goals untouched -- is
      applied per FIELD rather than per GOAL, because four goals are uncapped
      on batches and capped on wall clock. Applying it per goal would have
      denied those four a raise the user authorized; applying it per field
      gives each field exactly the treatment its own state calls for and
      writes a number onto no unbounded field.
    - >-
      max_concurrent IS LEFT ALONE BECAUSE THE CONSTRAINT IS PHYSICAL. The
      recorded cost of exceeding it (DEC-20260802-b226fb) was destroyed
      measurements and a Coordinator-attributed overrun, not a slower batch.
      Nothing in a wall-clock raise changes the core count.
    - >-
      THE IN-FLIGHT RULING IS MADE NOW RATHER THAN AT THE CLOSE. An
      unaddressed question about whether a raise reaches an open batch becomes
      an argument at exactly the moment a closing decision is least free to
      have it. It is answered above, with three explicit limits, so the
      BATCH-145531 close inherits a rule instead of a dispute.
  evidence_refs: []
  evidence_refs_note: >-
    EMPTY, AND CORRECTLY SO. No experiment, run, or evidence record supports a
    budget-ceiling raise, and none is cited as if it did. The supporting
    material is procedural: the user's authorization recorded in
    `authorization` above, the precedents DEC-20260812-f30c6e and
    DEC-20260822-85784e, the concurrency cost recorded in DEC-20260802-b226fb,
    and the driving session's ledger measurement recorded in
    `scope_measurement`.
  limitations:
    - >-
      THIS SUBAGENT MEASURED NOTHING. It holds no shell, ran no command, read
      no goal file for the purpose of counting, and verified no arithmetic by
      execution. Every count, range and per-goal value here is the driving
      session's measurement, relayed under attribution. If that measurement is
      wrong, this record is wrong in the same way, and
      application_rules.file_value_governs is the mechanism that catches it
      per file.
    - >-
      THE AMENDMENT IS NOT APPLIED BY THIS RECORD. This decision authorizes
      and specifies it; the driving session writes it and reports back for
      Coordinator verification. Until that report is verified and the commit
      accepted by the post-commit verifier, NO GOAL'S CEILING HAS MOVED and no
      batch may be planned against a raised number.
    - >-
      THE MEASURED SCOPE IS A SNAPSHOT. Goals are worked concurrently in
      separate worktrees; a goal may change status or ceiling between the
      measurement and the application. The status gate and the file-value rule
      convert that risk into a per-file STOP AND REPORT rather than a silent
      wrong write, but they cannot make the snapshot current.
    - >-
      NO CLAIM IS MADE THAT ANY LISTED VALUE WAS CONSUMED. Consistent with the
      history-entry wording, recording a prior ceiling asserts nothing about
      how much of it was spent. Consumption figures live in each goal's own
      budget accounting and are unaffected here.
    - >-
      THE RAISE DOES NOT ADDRESS THE OVERRUN MECHANISM ON GOAL-DIFFP-84d641 OR
      ANYWHERE ELSE. See in_flight_batch_ruling.what_the_raise_does_not_fix.
      Budget headroom and agent-time control are different instruments, and
      only the first one moved.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Administrative budget-ceiling amendment on explicit user authorization.
      No empirical or theoretical evidence is produced, reviewed, or
