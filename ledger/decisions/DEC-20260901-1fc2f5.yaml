    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/archives/TASK-20260901-420f4b/snapshot-receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/archives/TASK-20260901-a5374b/snapshot-receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/archives/TASK-20260901-d10bc6/snapshot-receipt.json
    - ledger/decisions/DEC-20260810-6c00b4.yaml

  hypothesis_status_transition:
    hypothesis_id: null
    changed: false
    reason: >-
      GOAL-AES-002 has no active hypothesis and this decision creates none.
      A protocol amendment, an infrastructure edit attempt, an arithmetic
      correction, a budget reconciliation, and an unexecuted experiment
      design are not hypothesis-testing acts.

  goal_status_transition:
    from: active
    to: active
    changed: false
    reason: >-
      This decision closes BATCH-286bcd's evidence-review step, not
      GOAL-AES-002. `completed` remains unreachable for this goal under
      inference-amendment 0137a051 (GOAL-AES-002 completion_reachability);
      no completion_quorum block is created and no attestation is recorded.
      A scoped repair-and-follow-on next action, not a goal-status change,
      is the correct disposition of a batch whose independent reviews found
      concrete, repairable defects rather than either a closable success or
      a closable failure.

  batch_disposition: >-
    BATCH-286bcd's FIVE ITEMS ARE COMPLETE, REVIEWED, AND ARCHIVED FOR THE
    SCOPE THEY WERE OPENED TO EXECUTE. It is not re-opened and no further
    task is dispatched under its own dispatch_queue_path by this decision.
    The concrete repairs named in next_actions below belong to a FOLLOW-UP
    batch under GOAL-AES-002.

  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      No asymptotic or concrete cost claim exists under this goal. This
      decision moves none of the four promotion gates and creates no claim
      that could approach them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NO SUPPORT OR REJECT_SCOPED DECISION ON REPLICATED OR STRONG EVIDENCE
      IS AVAILABLE. This decision is `revise`, not `support` or
      `reject_scoped`, and EV-AES-3cb33c's own strength is `anecdotal`
      (single batch, unreplicated as a package): the CM-1 amendment leaves
      two open, unresolved reading gaps; BLK-1 remains an open
      infrastructure blocker after a confirmed STOP CONDITION on its only
      specified fix; and the C2 design carries a load-bearing internal
      contradiction plus a decay-check labelling gap that independent
      review surfaced and that were not repaired within this batch. Nothing
      in this batch's package rises to a supportable finding at the
      replicated/strong tier KN-FIND promotion requires; the F1 arithmetic
      correction and the F2 reconciliation are bookkeeping facts about
      campaign instruments, not research findings about AES.

  limitations:
    - >-
      THIS DECISION ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It creates
      no hypothesis, promotes no knowledge, satisfies no asymptotic
      promotion gate, records no attestation, and supports no claim at any
      tier.
    - >-
      THE AMENDMENT'S TWO NEW READING GAPS (element (a) Route 3's
      T-table/"independent" boundary; elements (c)/(f)'s guess-and-determine
      hybrid boundary) MEAN A MARGIN BUILT ON EITHER CASE IS NOT ADJUDICABLE
      under CM-1 as amended here, exactly as the two original gaps were
      inadmissible before this amendment.
    - >-
      BLK-1 REMAINS OPEN. No `key_recovery` certificate can be emitted by a
      conforming run until BLK-1 is resolved by a genuinely different fix
      approach than the one just confirmed to desynchronize baseline
      coverage.
    - >-
      THE C2 DESIGN IS NOT APPROVED FOR DISPATCH. Its `seed_policy` and
      `arms.ARM-NULL` blocks contradict each other on whether K, K' are
      shared across arms, and its decay-check invalidation rule does not
      clearly route a flat, non-jumping ARM-NULL-only excess to any of its
      three named falsification outcomes. Both must be repaired before a
      future Coordinator approval could rely on this design as specified.
    - >-
      TASK-20260901-d10bc6's archive scope under-hash-binds 20 of the 22
      genuinely committed batch-opening files (F-VAL4c225b-1). Content is
      independently confirmed correct against the true historical commit by
      both reviewers, but this is not a substitute for a repaired archive
      binding.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE campaign-wide under
      inference-amendment 0137a051; the validator and red-team verdicts
      supply session independence only and are one draw from a correlated
      pair. No attestation is recorded on their combined strength.

  next_actions:
    - >-
      (a) FILE A FURTHER AMENDMENT OR CLARIFYING NOTE resolving the T-table
      "independent" question for element (a) Route 3 (a numbered clause
      distinguishing an operation folded into the same table access already
      counted under Route 1 from a genuinely separate computational step) and
      the guess-and-determine ambiguity for elements (c)/(f) jointly (a
      clause binding "genuinely distinct computational acts" to whether the
      candidate-culling step's own cost is already charged elsewhere in
      AEU-k) — draft repair text for both is already worked in
      RT-20260901-1af5d9's `amendment_block_dispositions.repair_action`
      fields — OR, if deferred, an explicit scoping statement narrowing
      Route 3 and the (c)/(f) verification-bundling rule to exclude
      T-table-fused and hybrid-pipeline attacks until resolved.
    - >-
      (b) BLK-1 REQUIRES A GENUINELY DIFFERENT FIX APPROACH, not the one
      just specified, since two independent sessions (the executor and the
      validator's isolated-worktree reproduction) now confirm the specified
      edit breaks baseline coverage. This is named as requiring either a
      scoped, Coordinator-authorized baseline-regeneration act, or a
      differently-worded `check_run` edit that does not change the
      grandfathered error string the baseline text-matches on, as a
      Coordinator-authorized follow-on task.
    - >-
      (c) THE C2 DESIGN'S `seed_policy` MUST BE REVISED so ARM-NULL's key
      draws are NOT independent of ARM-REAL's — a single, arm-independent
      stream per (key_size, tier, sample index), with a separate
      arm-specific stream reserved only for ARM-NULL's additional round-key
      draws — or the "byte-identical, sample for sample" claim in
      `arms.ARM-NULL` must be corrected or removed to match what
      `seed_policy` as written actually does. `invalidation_rules` item 4
      must be reworded to trigger on ARM-NULL's own failure to converge by
      round 4 (the same test already applied to ARM-REAL), independent of
      whether that failure is a jump or a flat plateau. Neither repair is
      approved by this decision; both are required before this design could
      be approved for dispatch in a future batch.
    - >-
      (d) A SUPPLEMENTARY ARCHIVE TASK (or an accepted, disclosed
      integrity-debt note) resolving F-VAL4c225b-1's under-hash-bound files
      — extending TASK-20260901-a666e6's declared `artifact_paths` to cover
      dispatch_queue.json itself, the 9 task cards, and the 10 handoffs (or
      a scoped supplementary archive task hash-binding exactly those 20
      paths), mirroring the repair chain BATCH-2b0fd1's DEF-3 already
      established.
    - >-
      DISPATCH THE FOLLOW-UP BATCH scoped to items (a)-(d) above; it is not
      a re-run of BATCH-286bcd's own five items. This Coordinator decision
      preserves this as GOAL-AES-002's single next action, to be set on the
      goal-record checkpoint that follows this archive.

