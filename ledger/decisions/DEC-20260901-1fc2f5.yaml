coordinator_decision:
  id: DEC-20260901-1fc2f5
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-286bcd
  recorded_by_task: TASK-20260901-5a44cc

  context: >-
    BATCH-286bcd was opened to execute DEC-20260810-6c00b4's five named next
    actions and no more: (1) file a superseding CM-1 amendment resolving its
    four reading ambiguities; (2) apply protocol-amendment-GOAL-AES-002-001's
    already-specified BLK-1 edits; (3) repair envelope-receipt.json's F1
    arithmetic defect; (4) reconcile F2's stamp-duty overrun under the
    adopted C5 mechanism; (5) produce a fully specified, reviewed,
    NOT-executed C2 heuristic-validation design. All five items are now
    produced, committed, and independently reviewed twice
    (TASK-20260901-4c225b, validator; TASK-20260901-1af5d9, red team), both
    reports returning PASS_WITH_LIMITATIONS-equivalent dispositions. This
    decision disposes of that package. Evidence record EV-AES-3cb33c is
    committed alongside this decision in the same isolated ledger archive.

  decision_scope: >-
    DISPOSES OF BATCH-286bcd's FIVE ITEMS AND ITS TWO INDEPENDENT REVIEWS.
    NOTHING MORE. This decision creates no hypothesis, approves no
    cryptanalytic measurement, does NOT approve the C2 design for dispatch,
    changes no hypothesis status, changes no GOAL-AES-002 status (the goal
    stays `active`), records no attestation and no completion_quorum block,
    and asserts nothing about AES at any round count. It does not touch
    GOAL-AES-001, GOAL-AES-003, or any record produced under RQ-AES-001 or
    RQ-AES-003.

  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-286bcd
    - EV-AES-3cb33c
    - protocol-amendment-GOAL-AES-002-003
    - TASK-20260901-d08b9f
    - TASK-20260901-2166bd
    - TASK-20260901-354ef5
    - TASK-20260901-420f4b
    - TASK-20260901-a5374b
    - TASK-20260901-d10bc6
    - TASK-20260901-4c225b
    - TASK-20260901-1af5d9
    - CORR-20260901-d9b7bc
    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/c2-paired-validation-design.yaml

  decision: revise
  decision_note: >-
    `revise` because, taken together, the two independent reviews show this
    batch's package is NOT yet ready to authorize any cryptanalytic dispatch
    or the C2 measurement: BLK-1 remains genuinely open after a confirmed
    STOP CONDITION on the only specified fix; the amendment closes its four
    named ambiguities but leaves two new, narrower ones; and the C2 design's
    own machinery contains a load-bearing internal contradiction plus a
    decay-check labelling gap. None of this is a negative result about AES —
    every item is a specification, infrastructure, arithmetic, or
    design-integrity fact about this campaign's own instruments — but none
    of it clears the bar for a further dispatch either. `revise` is the
    single word closest to this disposition; the itemised rationale and
    next_actions below carry the actual content.

  rationale:
    - >-
      THE CM-1 SUPERSEDING AMENDMENT CLOSES WHAT IT WAS BUILT TO CLOSE, AND
      ALSO OPENS TWO NEW, NARROWER GAPS — BOTH TRUE, RECORDED TOGETHER. The
      validator independently byte-diffed all four resolving-text blocks
      against their task card (all four match byte-for-byte after
      normalising markdown formatting only) and confirmed each closes its
      cited RT-20260831-1166f2 finding on a supplementary read. The red
      team, owning the formal counterexample-reapplication joint,
      independently confirmed all four blocks close the ORIGINAL
      counterexamples when re-applied — but, constructing NEW
      counterexamples as its own joint required, found element (a) Route
      3's bar on "independent" auxiliary computation undefined for a
      T-table (fused table-driven) implementation, where SubBytes,
      ShiftRows, and part of MixColumns fold into one memory lookup, so two
      conforming readers classify such an attack oppositely; and found
      elements (c)/(f)'s "genuinely distinct computational acts" test
      under-determined for a guess-and-determine hybrid (an algebraic
      pre-filter followed by a final encrypt-and-compare on survivors),
      because a naive reading of "distinct" would also misclassify the
      definitional reference's own bundled loop, forcing an unstated
      narrower reading the amendment does not supply. Element (d) was
      attacked with two new constructions and held — no verdict-level
      split, only a narrower disclosure-format gap for mixed-kind attacks.
      Element (b)/(c)'s distinguisher bridge was attacked and held outright.
      Closing an original ambiguity and leaving a narrower new one are not
      contradictory findings; both are recorded, at MEDIUM severity each,
      with a concrete repair action drafted by the red team for both.
    - >-
      BLK-1 REMAINS OPEN, CONFIRMED BY A GENUINE, TWICE-INDEPENDENTLY-
      REPRODUCED STOP CONDITION. Applying protocol-amendment-GOAL-AES-002-001's
      specified edit desynchronizes 112 baseline-suppressed pre-existing
      tools/validate_ledger.py errors from tools/validate_ledger_baseline.txt's
      text-based grandfathering, because widening the certificate-kind
      vocabulary changes the literal error-message string every already-
      baselined non-conforming value matches on. The executor correctly
      treated this as a STOP CONDITION and reverted all three target files,
      confirmed byte-identical to pre-task HEAD by hash comparison and a
      live re-run. The validator independently reproduced the identical
      116-new-error result in an isolated, detached git worktree that never
      touched the shared tree, byte-for-byte matching the executor's
      report, and independently confirmed the revert by two further
      methods. Per AGENTS.md rule 5, this is INFRASTRUCTURE SIGNAL about the
      campaign's own baseline mechanism — never a negative mathematical
      result — but it means no `key_recovery` certificate can currently be
      emitted, and BLK-1 remains a live pre-dispatch gate on RQ-AES-002.
    - >-
      THE F1 ARITHMETIC CORRECTION IS NOW INDEPENDENTLY RE-VERIFIED THREE
      TIMES. CORR-20260901-d9b7bc.yaml corrects envelope-receipt.json's
      14-core decimal ceiling field (488,600,000,000 -> 247,770,709.76 =
      11061.1924 × 1600 × 14), matching the receipt's own log2 figure
      (27.884) to stated precision. This value was independently
      recomputed and confirmed by the correcting executor itself, by this
      batch's validator (a fresh python3 computation, though honestly
      disclosed as not achieving a genuinely blind re-derivation in the
      review_plan's strict sense — F-VAL4c225b-2), and by this batch's red
      team (an independent hand recomputation performed as part of its own
      proof-architecture check). All three obtain the identical figure. The
      original envelope-receipt.json remains unedited and byte-identical.
    - >-
      F2's STAMP-DUTY RECONCILIATION IS DISCHARGED CLEANLY. TASK-20260810-1a81be's
      742 s observed duration is now recorded as the charged figure under
      the adopted C5 `on_record_not_charged` mechanism, with the 200 s
      declaration and the 480 s intermediate figure preserved rather than
      discarded, per C5's no-silent-resolution rule. This has no effect on
      any campaign stop condition, since GOAL-AES-002's campaign_budget is
      unbounded.
    - >-
      THE C2 DESIGN MEETS THE HEURISTIC-VALIDATION-EXPERIMENT STANDARD ON
      EVERY AXIS THE VALIDATOR CHECKED, BUT THE RED TEAM'S ADVERSARIAL
      ATTACK FOUND TWO REAL DEFECTS THE VALIDATOR'S SCHEMA/PRESENCE CHECK
      DID NOT SURFACE. Both reviewers independently confirmed ZERO COMPUTE
      (directory listing plus full-text re-read of both artifacts by each).
      The validator confirmed full schema compliance, a genuine
      preregistered prediction (CH-1) at honestly reduced confidence citing
      an independently-verified, correctly-scoped prior finding
      (H-AES-77230c), real discriminating arms plus a concrete positive
      control (ARM-ANCHOR) and an implementation-correctness gate
      (GATE-ROUND0), a computable round-count decay invalidation rule, and
      an honest not-yet-approved declaration. The red team, attacking the
      SAME design adversarially, found: (i) a LOAD-BEARING INTERNAL
      CONTRADICTION (MEDIUM_HIGH) — the design's own `seed_policy` is
      arm-indexed and draws K, K' from DIFFERENT independent streams per
      arm, directly contradicting `arms.ARM-NULL`'s own claim that state_0
      is "byte-identical, sample for sample" across arms; a future executor
      following `seed_policy` literally would run a different experiment
      than the one described, undermining the design's central
      confound-control logic as literally specified; and (ii) a
      DECAY-CHECK LABELLING GAP (MEDIUM) — the named "round-count decay
      check" is, as literally worded, a jump/re-emergence detector rather
      than a convergence detector (a flat, persistently-elevated,
      non-increasing series passes it cleanly); the overall
      `falsification_criterion` mostly compensates for this, but one
      specific failure mode — a flat, non-jumping excess in ARM-NULL alone
      while ARM-REAL converges normally — is not clearly routed to any of
      the three named outcomes, though `invalidation_rules` item 4's own
      prose clearly intends to catch it. Both defects are named with a
      concrete, cheap, textual repair action that does not require
      re-deriving the design's budget or statistical machinery. THE C2
      DESIGN IS THEREFORE NOT READY FOR DISPATCH AS CURRENTLY SPECIFIED.
    - >-
      A GENUINE ARCHIVE-PROVENANCE GAP WAS FOUND AND IS NOT SCORED AS A
      CONTENT-INTEGRITY DEFECT. The validator independently verified all
      three named archive receipts of this batch. TASK-20260901-420f4b and
      TASK-20260901-a5374b are fully clean. TASK-20260901-d10bc6's archive
      scope, inherited from TASK-20260901-a666e6's own under-declared
      `artifact_paths`, machine-hash-binds only 3 of the 22 files
      genuinely committed together (the batch-opening commit) — NOT the 9
      task cards, 10 handoffs, or dispatch_queue.json itself. All 22 files'
      content was independently confirmed correct against the true
      historical commit by direct hash recomputation (a stronger, if less
      automated, check than the dispatcher's own narrower binding), so
      there is no live content-integrity problem for anything either
      reviewer relied on — but the dispatcher's own machine-checked archive
      scope for that task is narrower than what was committed and than the
      task card required (F-VAL4c225b-1, MEDIUM).
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE, so no attestation is
      recorded and none is claimed. Under standing inference-amendment/basis
      0137a051, both independent reports (self-reporting resolved_model_id
      claude-sonnet-5) supply SESSION independence only and are ONE DRAW
      FROM A CORRELATED PAIR.

