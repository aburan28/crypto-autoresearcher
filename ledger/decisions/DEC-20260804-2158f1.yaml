coordinator_decision:
  id: DEC-20260804-2158f1
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-089
  recorded_by_task: TASK-20260804-118
  archived_by: TASK-20260804-119
  context: >-
    BATCH-089: Survey of 28 deferred ideas from earlier campaign. All are
    deferred_theorem_required or deferred_experiment_required. Two most tractable:
    ECDLP-IDEA-073 (Algebraic Discrete-Morse, conservative risk) and ECDLP-IDEA-119
    (Bloch-polylog regulator, high risk).

  decision: advance_discrete_morse
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    The most tractable deferred idea is ECDLP-IDEA-073 (Algebraic Discrete-Morse
    source contraction). It proposes:
    - View partial factor-base decompositions as a chain complex C_R
    - Use discrete Morse theory to cancel non-witness cells
    - Preserve a critical subcomplex of size N^{gamma} for gamma < 1/2
    - Chain homotopy lifts critical cells to exact factor-base sources

    KEY QUESTION: Does the discrete Morse approach avoid the H-PSEUDO/DL circularity
    obstruction? The approach works entirely at the COMBINATORIAL level (chain complexes,
    matchings) without requiring algebraic character bounds — potentially escaping
    all known obstructions.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-090: Analyze ECDLP-IDEA-073 (Discrete Morse). Specifically:
    (1) State the chain complex C_R precisely — what are the cells and boundary maps?
    (2) Does a "target-independent acyclic matching" exist that reduces N^{beta*m}
        cells to N^{gamma} for gamma < beta*m/2?
    (3) If such a matching exists: what is the key theorem needed?
    (4) Does the approach avoid DL circularity? (It might — discrete Morse operates
        on combinatorial structure, not algebraic characters)

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
