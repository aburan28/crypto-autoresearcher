  context: >-
    BATCH-04272f is batch 4 of 7 of GOAL-MD5-001 (RQ-MDFIVE-6870c1): the
    method-ceiling audit, opening with the MD4 lower control and not MD5
    (DEC-20260821-6df1e9 F-6). The batch opened under DEC-20260821-ddaa33
    with claim ceiling frontier_ledger_and_md4_control_scoping_only, a
    re-declared budget of 6320 s (recorded budget-extension decision, with
    rationale, against the 10800 s original campaign plan), and a PRE-
    REGISTERED STOP CONDITION: a pause at 18000 s cumulative declared
    before a batch-5 opening. All eight tasks are terminal with verified
    commits; the frozen package passed the two-commit content_first
    snapshot (059a19209) and the sibling-blind review round (both HOLDS).
  findings:
    - id: F-1
      text: >-
        ROUND VERDICTS. Red team (TASK-20260821-02d397, review-adversarial,
        resolved model zai/glm-5.2, xhigh, independent session, sibling-
        blind, blind_from_respected true): HOLDS - joints L1 (frontier-
        ledger provenance), L2 (scope Pareto honesty), L3 (MD4 run identity
        + cost transfer), L4 (decision-table + cost honesty), L5 (scope
        honesty / no premature closure) all hold with file/line grounding;
        proves-too-much objects G (provenance mislabel), H (cost
        tampering), I (closure without obstruction) all rejected - the
        package's own discipline catches each; the blind re-derivation of
        the BCP-2 decision-table row predicate (from BCP-2's
        null_object_control section only, blind_from honored) agrees,
        including the synthetic R = 3.0 both-FAIL control landing on R6
        (the ratio does not move the row when both FAIL); NO coordinator
        prior overturned - the prior recorded in the plan before any
        report returned (R5/R6 expected, cost transfer within TOL, no
        premature closure) held exactly, which the plan names as a valid,
        less-informative outcome. Validator (TASK-20260821-6a36a4,
        review-adversarial, resolved model zai/glm-5.2, xhigh, independent
        session, sibling-blind): run-integrity HOLDS - all seven checks
        PASS on its own re-run output (archive binding 8/8 path hashes
        recomputed from the freeze tree plus parent and record_ids;
        standalone MD4 re-run against all 7 RFC 1320 test vectors with its
        own driver; T-prime 48/48; wrapper timing with start/finish
        timestamp-delta agreement and R = 0.9935513427 recomputed from the
        manifests; sealing + completeness with the only intersection the
        pre-registered answer-digest reference field; cost transfer
        recomputed from the four wrapper timings; 35-test suite green),
        0 defects. The determinations agree and are recorded as the round
        result (EV-MDFIVE-1a2952 O-4).
    - id: F-2
      text: >-
        NAMED GAPS AND DISPOSITIONS (the red team's three informational
        defects; none batch-halting, none touching the frozen bytes).
        DEF-RT1: the 'mod 64' / '64-entry' MD4 wording in
        DEC-20260821-ddaa33 and the acquisition report is carry-over of
        the same task-card instruction defect the batch disclosed (the
        sine table is MD5's formulation, not MD4's); the implementation is
        correctly mod 48. Disposition: the frozen records remain immutable;
        THIS DECISION states the correct 48-entry sequence (16x0,
        16x0x5A827999, 16x0x6ED9EBA1) and supersedes the wording for
        citation purposes. DEF-RT2: frontier-ledger entries 7-8 are marked
        retrieved with filed_text null - primary ABSTRACTS only, honestly
        disclosed in the entries. Disposition: accepted; provenance:
        retrieved correctly applies to the primary abstracts fetched and
        read in-session; the ledger granularity is recorded as a fact, and
        the entries' exponents are exactly as the abstracts state them.
        DEF-RT3: the c4a158 completed_note's 'confirmed' vs the producer's
        'named' obstruction status. Disposition: accepted as a wording
        concern - the completed_note's 'confirmed' refers to the MEASURED
        DATA (the random-collision floor held on both objects on both
        primitives at the declared budget); the method-ceiling STATEMENT
        itself is issued in F-4 carrying the producer's 'named' status and
        the run         data, not a closure claim. The F-7 check (DEC-20260810-
        1163ec F-7, "first practical preimage attack") remains UNSETTLED
        with reason (Sasaki-Aoki 2009 primary text unobtainable, source-
        preference order exhausted; reviewer pointer recorded) - carried,
        not closed. DEF-PROC1 (process deviation, disclosed): the two
        review reports were committed in the review-round bookkeeping
        commit (24ea10c05) rather than in the ledger archive commit (the
        batch-3 pattern); the dispatcher's commit-mode archive
        verification requires the archive commit to change EXACTLY its
        declared paths, so this ledger archive's binding is declared
        content_first (all five paths, bytes bound at the archive commit /
        HEAD - the documented purpose of that mode) instead of the task
        card's commit mode. The archive commit changes three of the five
        paths (EV, DEC, receipt); the two report paths were already
        committed at 24ea10c05, which is named here and in the archive
        receipt. The binding's intent - all five artifacts committed,
        hashed, and named in the commit message - is preserved in full.
    - id: F-3
      text: >-
        MD4 CONTROL RESULT AND WHAT A LATER BATCH OR DEPENDENT GOAL MAY
        CITE. The pair lands on BCP-2 decision-table row R6 (target FAIL,
        variant FAIL): the instrument found nothing on either object within
        budget; this does NOT show that no collision path exists for
        either (SC-4). R = 0.9935513427 (COMPARABLE, TOL = 2 fixed pre-
        acquisition); MD4/MD5 anchor ratios 0.7171 / 0.6999 (MD4 ~29%
        cheaper, consistent with the 48/64 step structure). A dependent
        goal (GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-
        001, GOAL-SIMSPK-001) or a later batch may cite: (a) the method-
        ceiling statement at its named scope (F-4); (b) the cost anchors -
        bounded 2^21-block enumeration at the declared encoding costs
        ~39 s (MD4) / ~54-55 s (MD5) wrapper on this hardware, ~0.74 GB
        peak, space-limited not deadline-limited; (c) the first
        discrimination data - the MSB-prefix signature (MD5 0/0, MD4
        0/1 best bits) showing no structural growth on the lower control;
        (d) the frontier ledger entries by their provenance-marked status
        (6 retrieved with filed texts; 2 recalled as pointers - a recalled
        entry may never be cited as support, only as a pointer to fetch).
        A dependent goal may NOT cite this batch as evidence that MD4 or
        MD5 is hard or easy, that a collision path does or does not exist,
        or that the ceiling transfers to other primitives: the statement's
        scope is MD4/MD5 at the declared scale, and any transfer to other
        primitives is an assumption that must be disclosed at the point of
        use. The claim ceiling frontier_ledger_and_md4_control_scoping_
        only binds the batch's records (EV-MDFIVE-1a2952).
    - id: F-4
      text: >-
        METHOD-CEILING STATEMENT - STATUS: ISSUED, supported at the named
        scope, under the inventor-protocol closure standard (named
        obstruction + argument + forward guidance + scope + does_not_show;
        the full statement with the measured obstruction (quantity, units,
        sample size as error bar), the argument, the forward guidance
        (CAND-1 differential-guided enumeration and CAND-2 state-level
        MITM, each with its falsification condition), the scope (MD4/MD5
        Merkle-Damgard at 2^21 blocks, 40-bit meet table, seed 0, hex 512-
        bit encoding, this hardware), and the does_not_show (no security
        claim, no path-existence claim, no lane closure, no un-disclosed
        transfer) is recorded in EV-MDFIVE-1a2952 O-5. This is a statement
        about the DECLARED INSTRUMENT CLASS at the declared budget - an
        instrument ceiling, not a problem ceiling: it bounds what this
        class delivers at this budget, and the named escape routes remain
        open and falsifiable. It does not close CAND-1, CAND-2, or CAND-3;
        their reduced-scale demonstrations were the designated batch-5
        content and remain unattempted. The obstruction's resource_check
        reading: the same indefiniteness that kills the unguided
        enumeration (the message space is unconstrained) is the hypothesis
        of CAND-1 (constrain it with the published differential) - that
        re-reading is the forward guidance, examined and named, not
        deferred.
    - id: F-5
      text: >-
        BUDGET ACCOUNT AND THE PRE-REGISTERED STOP CONDITION. Declared
        envelopes: batch 1 (BATCH-46254b) 3300 s as declared at opening
        (the two 2026-08-19 archive-repair tasks added 300 s post-
        declaration); batch 2 (BATCH-312472) 2880 s; batch 3 (BATCH-
        1f30fe) 4720 s as declared at opening (100 s of post-declaration
        repair tasks added); batch 4 (BATCH-04272f) 6320 s. CUMULATIVE
        DECLARED (current handoff totals): 17620 s vs the 10800 s original
        campaign plan (+62.9%); the batch-4 opening decision recorded
        17220 s, the difference being the post-declaration repair tasks
        above. The PRE-REGISTERED STOP CONDITION (DEC-20260821-ddaa33:
        pause at 18000 s cumulative declared before a batch-5 opening)
        has NOT tripped yet (17620 <= 18000), with 380 s of headroom. Any
        honest batch-5 envelope trips it: the minimum honest batch 5 (the
        reduced-scale CAND-1/CAND-2 demonstrations per the scope record -
        opening 160 s + 2x900 s run ceilings + 160 s snapshot + 2x450 s
        reviews + 300 s ledger) declares ~3320 s, bringing the cumulative
        to ~20940 s > 18000 s; even a no-run design batch (~1360 s) would
        reach ~18980 s. ACTUAL cost observation (admissible, SC-4): RANK 1
        ran ~5.4x its declared 900 s ceiling (accepted as a disclosed
        budget outcome, SC-7 violation recorded); RANK 2's seven-call
        subagent pattern is a session-cost observation recorded in its
        completed_note; RANK 3 was within budget (77.5 s charged against
        the 1368 s active window). The wrapper deadlines bound the RUNS;
        the exposure is in authoring/verification overhead around them.
    - id: F-6
      text: >-
        DECISION: the goal is PAUSED at the pre-registered budget stop,
        effective immediately upon this archive's verification - not
        because 18000 s has been exceeded, but because the stop condition
        is "before a batch-5 opening" and NO batch-5 envelope that is not
        make-work fits the remaining 380 s of headroom; opening one would
        breach the pre-registration that the campaign itself committed to.
        This is the stop condition doing its pre-registered job; the
        pressure to keep the harness running is not a reason to press
        through it. WHAT IS COMPLETE (and durable): completion criterion 1
        (blind calibration result - row R6, EV-MDFIVE-f3e1ca), criterion 3
        (the method-ceiling statement at its named scope - EV-MDFIVE-
        1a2952 O-5, the strongest certifiable claim with the named
        obstruction, argument, and what remains open), criterion 4
        (independent Validator + Red Team sessions admitted the run
        packages in both review rounds), and criterion 5 (this archive).
        Criterion 2's chosen-prefix component was never executed in any
        batch - the protocol of record (BCP-2) declared identical-prefix
        2-block messages only; the identical-prefix anchor is met, the
        chosen-prefix gap is NAMED here, not papered over. REMAINING
        PLANNED WORK (batches 5-7): the reduced-scale demonstrations
        (CAND-1 differential-guided enumeration on MD4 at 2^21, predicted
        non-random signature, falsifiable per its condition; CAND-2 state-
        level MITM at w = 20, same), the named-obstruction argument
        written up against the demonstration data, and the goal close with
        knowledge curation. RESUME ACTION (concrete, per the pre-
        registration): USER BUDGET AUTHORIZATION for a batch-5 envelope of
        ~3320 s (cumulative ~20940 s vs the 10800 s original plan), or a
        user-directed reduced scope that fits an honest envelope; on
        authorization the Coordinator opens batch 5 (BATCH-*) with the
        demonstrations, no other change. No batch 5 is named by this
        decision; the pause is recorded in the goal head with this
        action.
