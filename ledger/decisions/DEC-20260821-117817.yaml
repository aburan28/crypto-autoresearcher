  independence_note: >-
    Both reviewers of the batch-4 round (TASK-20260821-02d397 red team,
    TASK-20260821-6a36a4 validator) resolved to the same model identifier
    (zai/glm-5.2) under one usable backend, at xhigh reasoning in
