coordinator_decision:
  id: DEC-20260802-204
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-032
  context: >-
    TASK-20260802-206 is durable at snapshot
    dbd03c4b26e48a5a093e6740588044c4f666aa4a, parent
    d015ae4e7b663505de14c22b92d7a136535b4dee. Independent Red Team
    TASK-20260802-208 is durable at snapshot
    636f3975e3a66c4d76c5e2115ac0f835069a7459, parent
    dbd03c4b26e48a5a093e6740588044c4f666aa4a. The terminal dispatch plan
    validates all gates at SHA-256
    520ede87684a2ec0f12f6ffab59f92566e0d282a023d8e54e0abc5ff7f35097e.
    A subsequent primary-literature check identified APR-206 and its
    two-stage/low-memory augmented-input route as a rediscovery of Cheon's
    discrete logarithm with auxiliary input algorithm. No experiment or
    official state transition occurred.
  decision: revise
  decision_scope: >-
    Synthesize BATCH-032 while correcting its novelty interpretation. Retain
    the independently surviving bounded fixed-field and quotient/information-
    loss barriers. Classify APR-206, the two scalar-action stages, the balanced
    N^{1/4} augmented-input row, and the rho/distinguished-point low-memory
    variant as known Cheon DLP-with-auxiliary-input prior art, not a new
    conditional theorem. Reject any ordinary-ECDLP improvement claim because
    acquisition of the auxiliary point A=[x^d]P from ordinary input
    P,Q=[x]P remains unestablished below rho-scale work. This is neither
    closure nor an ordinary-ECDLP SOTA result.
  target_ids:
    - GOAL-ECDLP-001
    - H-IT-001
    - BATCH-032
    - TASK-20260802-206
    - TASK-20260802-208
    - APR-206
  evidence_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-206/barrier-and-escape-analysis.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-206/proof-obligations.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-206/pareto-frontier.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-206/successor-proposal.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-208/red-team-report.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-032/tasks/TASK-20260802-208/verdict.yaml
    - snapshot dbd03c4b26e48a5a093e6740588044c4f666aa4a
    - snapshot 636f3975e3a66c4d76c5e2115ac0f835069a7459
    - dispatch plan 520ede87684a2ec0f12f6ffab59f92566e0d282a023d8e54e0abc5ff7f35097e
    - https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
  primary_prior_art:
    source: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
    classification: primary_implementation_paper
    establishes:
      - >-
        DLP with auxiliary input is given G, alpha*G, and alpha^d*G, with
        d dividing r-1.
      - >-
        Its running time is
        O(sqrt((r-1)/d) + sqrt(d)), giving an N^{1/4}-scale time near the
        balanced choice of d.
      - >-
        Algorithm 1 uses the same primitive scalar generator and two-stage
        structure independently reconstructed in APR-206.
      - >-
        Section 2.2 gives a rho subalgorithm and distinguished-point
        low-memory implementation.
      - The paper cites Cheon's EUROCRYPT 2006 and Journal of Cryptology 2010 work.
    decision_effect: >-
      APR-206's augmented-input mechanism, balanced exponent, and low-memory
      route are known rediscoveries. They may be used only as a faithfully
      attributed baseline.
  component_dispositions:
    - id: B032-C1
      component: fixed_field_invariant_barrier
      disposition: retain_bounded
      finding: >-
        Within the declared fixed-F_p, fixed-N, prime-to-N isogeny boundary,
        trace/order, k=ord_N(p), and prime-field subfield structure prevent
        movement inside the isogeny class from manufacturing the named
        anomalous, lower-embedding-degree, or subfield weakness.
      scope_limit: >-
        This does not cover order-changing correspondences, field-changing
        reductions, non-generic structure, or independently supplied side
        information, and is not closure.
    - id: B032-C2
      component: quotient_and_information_loss_barrier
      disposition: retain_bounded
      finding: >-
        The reviewed quotient construction has cardinality N, not N/M.
        Restricting a search to N/M projected states leaves approximately M
        compatible lifts and success probability about 1/M unless independently
        recoverable information removes that loss. Inverse-success cost must be
        charged.
      scope_limit: >-
        This rejects the analyzed lossy construction, not every quotient,
        correspondence, or structured side-information mechanism.
    - id: B032-C3
      component: APR-206_type_and_cost_model
      disposition: revise_to_known_baseline
      finding: >-
        APR-206 is meaningful only after explicitly supplying and certifying
        the auxiliary scalar-generator relation A=[x^d]P, fixing scalar
        orientation, and separating auxiliary-input solve cost from ordinary-
        input acquisition cost.
      novelty: known_rediscovery
      prior_art_ref: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
      required_repairs:
        - Attribute the mechanism to Cheon's DLP-with-auxiliary-input algorithm.
        - State the auxiliary input and certificate as assumptions.
        - Type every action, scalar relation, and recovery step.
        - State costs in common soft-O-compatible units.
        - Make no new-theorem or novelty claim.
    - id: B032-C4
      component: two_scalar_action_stages
      disposition: retain_as_known_baseline
      finding: >-
        Given certified auxiliary input A=[x^d]P, the two-stage running time
        N^{tau+o(1)}, tau=max((1-delta)/2,delta/2), restates the known Cheon
        DLP-with-auxiliary-input tradeoff
        O(sqrt((r-1)/d)+sqrt(d)).
      novelty: known_rediscovery
      prior_art_ref: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
    - id: B032-C5
      component: balanced_augmented_input_row
      disposition: retain_as_known_baseline
      finding: >-
        Conditional on supplied and certified A=[x^d]P with
        d=N^{1/2+o(1)}, the N^{1/4+o(1)} augmented-input solve is known Cheon
        prior art.
      novelty: known_rediscovery
      ordinary_input_effect: none_established
    - id: B032-C6
      component: rho_and_distinguished_point_low_memory_route
      disposition: retain_as_known_baseline
      finding: >-
        The exponent-zero-memory rho/kangaroo and distinguished-point route is
        also prior art described by the primary implementation paper, including
        its Section 2.2 rho subalgorithm.
      novelty: known_rediscovery
      pareto_effect: >-
        It dominates the producer's table-memory row but creates no new
        augmented-input or ordinary-ECDLP frontier claim.
    - id: B032-C7
      component: ordinary_input_acquisition
      disposition: unresolved_blocking
      finding: >-
        No sub-rho construction of A=[x^d]P from ordinary input
        P,Q=[x]P is established. Under generic group operations, labels derived
        from P and Q remain affine a+bx until an informative collision, and no
        collision below rho scale was shown.
      novelty: not_assessed_for_new_acquisition_interfaces
      decision_effect: >-
        Acquisition remains the sole decision-changing uncertainty. It blocks
        any ordinary-ECDLP improvement and any Executor dispatch.
    - id: B032-C8
      component: ordinary_ECDLP_SOTA_claim
      disposition: reject
      finding: >-
        Cheon's N^{1/4} result assumes the extra auxiliary input alpha^d*G.
        Composing it with an unestablished or rho-scale ordinary-input
        acquisition step gives no reviewed improvement over Pollard rho for
        ordinary ECDLP.
    - id: B032-C9
      component: new_conditional_theorem_claim
      disposition: reject
      finding: >-
        APR-206 and the reviewed augmented-input variants are rediscoveries of
        known Cheon DLP-with-auxiliary-input algorithms and may not be promoted
        as a new conditional theorem.
  pareto_summary:
    ordinary_input:
      dominated_by: Pollard rho/kangaroo
      time_exponent_candidate: 0.5
      time_exponent_prior_best: 0.5
      sota_delta_time_exponent: 0.0
      memory_exponent_candidate: 0.0
      memory_exponent_prior_best: 0.0
      sota_delta_memory_exponent: 0.0
      data_or_assumption_delta: >-
        Worse: Cheon's conditional route requires the additional certified
        auxiliary input alpha^d*G, whose sub-rho acquisition from G,alpha*G is
        unproved.
      interpretation: No ordinary-ECDLP Pareto or SOTA improvement.
    auxiliary_input:
      baseline: Cheon DLP with auxiliary input
      prior_art_ref: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
      time: O(sqrt((r-1)/d)+sqrt(d))
      balanced_time_exponent: 0.25
      low_memory_route: known rho/distinguished-point implementation
      novelty: known_rediscovery
      ordinary_ECDLP_sota_delta: 0.0
  novelty_status:
    augmented_input_route:
      checked: true
      status: known_rediscovery
      primary_source: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf
      predecessor_attribution:
        - Cheon, EUROCRYPT 2006
        - Cheon, Journal of Cryptology 2010
      forbidden_claims:
        - novel
        - new_conditional_theorem
        - first
        - best_known
        - state_of_the_art
    ordinary_input_acquisition_interface:
      checked: false
      status: not_assessed
      permitted_claim: open research uncertainty only
      forbidden_claims:
        - novel
        - first
        - best_known
        - state_of_the_art
  rationale:
    - >-
      Primary prior art matches the producer's auxiliary input, two stages,
      balanced N^{1/4} complexity, and low-memory rho implementation, so those
      elements are known rediscoveries.
    - >-
      The only remaining route to an ordinary-ECDLP advance is a new,
      fully-costed way to acquire the auxiliary nonlinear scalar relation from
      ordinary input, or a scoped proof explaining why the declared model
      prevents it.
    - >-
      Further augmented-table or low-memory polishing would duplicate known
      Cheon work while leaving the decisive acquisition uncertainty untouched.
  limitations:
    - No experiment, implementation, or Executor result exists.
    - The Cheon route assumes auxiliary input unavailable in ordinary ECDLP.
    - The affine-label observation is not yet an archived general lower-bound theorem.
    - Novelty has not been assessed for any genuinely new acquisition interface.
    - No concrete-cost, crypto-scale, or deployed-system claim exists.
    - No universal impossibility, lane-death, support, closure, or breakthrough conclusion follows.
  hypothesis_status_transition:
    hypothesis_id: H-IT-001
    from: specified
    to: specified
    changed: false
    reason: >-
      BATCH-032 retained bounded analytical constraints and rediscovered known
      Cheon auxiliary-input algorithms, but produced no ordinary-input attack or
      experimental evidence.
  goal_status_transition:
    goal_id: GOAL-ECDLP-001
    changed: false
    reason: No completion criterion or closure quorum was reached.
  asymptotic_promotion_gates:
    proof_decomposition:
      status: OPEN
      reason: >-
        Ordinary-input acquisition is unresolved and the generic-label barrier
        is not yet a complete lower-bound theorem.
    numbered_heuristics_with_validation:
      status: OPEN
      reason: >-
        No validated heuristic or mechanism exists for new ordinary-input
        acquisition.
    concrete_cost_honesty:
      status: OPEN
      reason: >-
        The ordinary-input acquisition cost is missing; Cheon's known
        auxiliary-input costs do not fill that gap.
    independent_review:
      status: OPEN
      reason: >-
        BATCH-032 received review-adversarial scrutiny, but no new ordinary-
        ECDLP complexity claim exists and no review-breakthrough/max review was
        performed.
    status_all: OPEN
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The augmented-input components are known Cheon prior art, while the
      retained bounded barriers are neither replicated strong ordinary-ECDLP
      evidence nor a completed acquisition theorem.
    blocked_as_new:
      - APR-206
      - two_scalar_action_stages
      - balanced_N_quarter_auxiliary_input_row
      - rho_distinguished_point_low_memory_route
    reason: >-
      These augmented-input components are known Cheon DLP-with-auxiliary-input
      prior art and cannot be promoted as new internal findings. The bounded
      fixed-field and information-loss barriers may remain internal synthesis,
      but no replicated/strong ordinary-ECDLP evidence or completed acquisition
      theorem warrants knowledge promotion.
  next_actions:
    - >-
      If BATCH-033 is opened, focus its single proof-only lane exclusively on
      ordinary-input acquisition of alpha^d*G from G,alpha*G, or on a scoped
      generic-group barrier for that acquisition.
    - >-
      Treat Cheon's DLP-with-auxiliary-input algorithm, its
      O(sqrt((r-1)/d)+sqrt(d)) tradeoff, balanced N^{1/4} row, and
      rho/distinguished-point implementation as the known baseline.
    - >-
      Preserve only a faithful attributed baseline statement for the augmented
      problem. Do not assign novelty work, table polishing, implementation, or
      an Executor to the known Cheon route.
    - >-
      Any genuinely new acquisition interface must receive a primary-literature
      novelty check before a novelty or SOTA assertion.
  next_handoff_premise:
    batch_id: BATCH-033
    lane: ordinary_input_auxiliary_acquisition
    objective: >-
      Starting from ordinary input G,alpha*G, either derive a typed,
      certificate-bearing sub-rho method to obtain alpha^d*G or an equivalent
      nonlinear scalar generator, with every oracle and resource charged, or
      prove a scoped generic-group acquisition barrier with explicit escape
      interfaces.
    known_baseline: >-
      Cheon DLP with auxiliary input G,alpha*G,alpha^d*G and time
      O(sqrt((r-1)/d)+sqrt(d)), including the known rho/distinguished-point
      implementation.
    forbid:
      - claiming APR-206 or its augmented variants as new
      - augmented-table polishing
      - Executor dispatch before proof and independent review
      - ordinary-ECDLP SOTA claim without sub-rho acquisition
      - closure or status transition
  decided_by: coordinator
  decided_at: '2026-08-02'
