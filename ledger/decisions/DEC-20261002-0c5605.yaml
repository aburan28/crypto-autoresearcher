coordinator_decision:
  id: DEC-20261002-0c5605
  context: >-
    Design tick. IDEA-20260926-89886c is the first open ECC idea and is not
    designed. IDEA-20260915-3476de is next and is not designed.
    IDEA-20260922-cdca3a is the following open idea, and only the degree-7
    tensor census is frozen.
  decision: approve
  target_ids:
    - IDEA-20260922-cdca3a
    - H-NISTBIN-1803fe
    - EXP-NISTBIN-90a5c3
  rationale:
    - >-
      DEC-20260926-901ea1 NA-4 says not to design the m = 3 pricing contract
      until NA-2's review returns. This session did not find that review.
      IDEA-20260926-89886c stays proposed and uncited by the hypothesis and
      the experiment.
    - >-
      IDEA-20260915-3476de stays undesigned. Its decisive Boolean-native arm
      needs BRiAl, which this session did not install. The closure of
      BATCH-a33cda in DEC-20260915-927eaa does not supply that engine.
    - >-
      Standing user authorization of 2026-09-06 covers approval of the
      census. The contract names the 18 moduli, the incidence totals, two
      routes, and a falsification criterion. It does not run a solver.
    - >-
      The census was computed in this session. That computation is not a
      run. Each modulus keeps 49 bilinear monomials. The weight-3 total
      105 exceeds the weight-5 total 99 by 6. The exhaustive-core record
      named in the proposal was not used as support for this approval.
    - >-
      origin/main was already contained in this branch. origin/main was
      6a9d34f3b6f6ef0f502aa4b558ad2ff0cead20df. HEAD at the merge check
      was a4ca26a4b389e085bfa40373a34ee0aa52ed4365.
  evidence_refs:
    - ledger/proposals/IDEA-20260922-cdca3a.yaml
    - ledger/decisions/DEC-20260926-901ea1.yaml
  limitations:
    - Approval authorises the census. It does not measure a conflict count.
    - The two skipped ideas remain open. Neither is closed by this decision.
  next_actions:
    - Dispatch TASK-20261002-5286ee after the TASK-20261002-f6fa66 receipt verifies.
    - Re-check DEC-20260926-901ea1 NA-2 before designing IDEA-20260926-89886c.
  knowledge_promotion:
    promoted: []
    not_warranted: Unrun census contract. No finding to promote.
  decided_by: coordinator
  decided_at: '2026-10-02'
