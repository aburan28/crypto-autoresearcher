coordinator_decision:
  id: DEC-20260801-007
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_ids_closed:
  - BATCH-022
  batch_ids_opened:
  - BATCH-023
  decided_by: coordinator
  decided_at: '2026-08-01'
  decision: revise
  decision_note: >-
    ONE RECORD, TWO ACTS, AND THE SECOND DOES NOT SOFTEN THE FIRST. Act one closes
    BATCH-022 as an RC-22 NON-EXECUTION on the frozen contract EXP-SMTH-001. Act two
    opens BATCH-023 on a new frozen contract EXP-EQD-001 and a new hypothesis H-EQD-001
    at status `specified`. The decision verb is `revise` because that is what a REVISE
    verdict on a pre-execution contract review yields - the design is sent back, no
    hypothesis moves, and no evidence exists. It is NOT `weaken`, NOT `reject_scoped`,
    NOT `inconclusive` on any mathematical question, and NOT `pause`.
  target_ids:
  - EXP-SMTH-001
  - H-SMTH-001
  - EXP-EQD-001
  - H-EQD-001
  - HEUR-DS-1
  - GOAL-ECDLP-001
  - BATCH-022
  - BATCH-023

  context: >-
    BATCH-022 froze EXP-SMTH-001 to test HEUR-DS-1 by sampling half-arity Semaev
    intermediates, encoding them as integers in [1, p**2] under ENC-B, and comparing
    their B-smoothness statistics against the asymptotic Dickman law. The independent
    contract review REV-20260801-012 at TASK-20260801-012 returned REVISE with two fatal,
    arithmetically and empirically demonstrated defects, and TASK-20260801-013 recorded
    APPROVAL_DETERMINATION NOT APPROVED at commit e7ea44f38221ba7ab7ebca7b7fe6d811dd46fa0c.
    Under the RC-22 one-cycle amendment cap that ends the run for that batch. No run of
    EXP-SMTH-001 was ever executed, no run package exists, and no evidence record for it
    exists or may be filed.

  # ==================================================================
  act_one_close_batch_022:
    outcome: RC-22 NON-EXECUTION
    what_this_is: >-
      A CONTRACT-DESIGN FAILURE CAUGHT BEFORE COMPUTE. The review found that the frozen
      reading rule could not have classified any achievable measurement into a
      substantive branch. That is a defect in the instrument as designed, discovered at
      the only stage where discovering it is cheap.
    what_this_is_NOT:
    - >-
      NOT A MATHEMATICAL RESULT ABOUT HEUR-DS-1 IN EITHER DIRECTION. Nothing was measured
      about the smoothness of any Semaev intermediate. HEUR-DS-1 remains never validated
      and never refuted, at any scale, exactly as it stood at the BATCH-022 opening.
    - >-
      NOT AN INFRASTRUCTURE FAILURE. Nothing timed out, crashed, exhausted memory or was
      cancelled at budget. AGENTS.md rule 5 is not the applicable rule here, and invoking
      it would misfile a design defect as an environment defect.
    - >-
      NOT A JUDGEMENT THAT THE SMOOTHNESS QUESTION IS UNANSWERABLE OR THAT THE LANE IS
      DEAD. Premature closure is a failure mode symmetric with overclaiming
      (docs/inventor-protocol.md section 4). The measurement is owed, not abandoned.
    - >-
      NOT A REPAIR, AMENDMENT, VERSION OR SUPERSESSION-BY-EDIT OF
      experiments/EXP-SMTH-001/specification.yaml.
    hypothesis_disposition: >-
      H-SMTH-001 DOES NOT MOVE. It stays at status `specified` with its status_history
      unchanged and its mechanism_test_status.exercised still false. No status_scope block
      is written, because no scope was tested.
    evidence_disposition: >-
      NO EVIDENCE RECORD IS FILED, BECAUSE NO RUN EXISTS. The intended EV-SMTH-001 id is
      released unused. Filing an evidence record for a run that was never executed would
      be a fabrication under AGENTS.md rule 9.
    fatal_finding_1:
      id: RV012-A1
      title: TAIL-DS-1 fails on a CORRECT null, and the contract stated its pass probability inverted
      statement: >-
        The tail check TAIL-DS-1 uses p_ext = min_j rho(u_j), which makes n * p_ext
        asymptotically Exp(1), so the ANALYTIC pass probability of the rule is 1/e and not
        the 1 - 1/e the contract asserted. The reviewer then MEASURED the declared null
        arm and observed it passing 0 of 8 at bits 16 and 0 of 8 at bits 20, because
        asymptotic rho under-predicts deep-tail smoothness at X of order 2**32 to 2**40.
        The M-5 apparatus leg (a) therefore fired deterministically and the branches M-1,
        M-2, M-4 and M-6 were JOINTLY UNREACHABLE. The experiment could not have confirmed
        the hypothesis even had it been true, and could not have disconfirmed it either.
      severity: fatal, pre-execution
    fatal_finding_2:
      id: RV012-A2
      title: ENC-B is undefined on the 512 diagonal half-tuples, so the integrity guard M-0 fires on every outcome
      statement: >-
        The leading coefficient of S_3(x_1, x_2, Z) in Z is (x_1 - x_2)**2, which is zero
        over F_p exactly on the diagonal x_1 = x_2. The contract enumerated i <= j over a
        512-element factor base, that is 131328 half-tuples, so the fibre invariants were
        UNDEFINED on exactly 512 of them. Dropping those leaves 130816 rather than the
        declared 131328, and the integrity guard M-0, which fires on any sample set with
        other than the declared count, therefore fired on EVERY POSSIBLE OUTCOME.
      severity: fatal, pre-execution
    process_finding:
      id: PROC-BATCH022-1
      statement: >-
        THE ATTAINABILITY DUTY WORKED ON ITS FIRST USE. It was introduced at BATCH-022 in
        direct response to BATCH-021, which shipped a disposition map that was verified
        EXHAUSTIVE by an independent reviewer, was honestly applied, and whose favourable
        branch D-2 was nonetheless arithmetically unreachable. On its FIRST USE the duty
        caught BOTH fatal defects above BEFORE ANY COMPUTE WAS SPENT, and it caught them
        because the reviewer MEASURED the null rather than reasoning about it - about two
        minutes of CPU against a batch of wasted execution and a worthless evidence
        record. The reviewer's closing line is adopted as a standing rule: MEASURING THE
        NULL COSTS LESS THAN REVIEWING IT.
      retained_and_extended: >-
        The duty is RETAINED as a named duty of the independent reviewer at
        TASK-20260801-025, whose rejection remains a REVISE, and it is EXTENDED in two
        ways by EXP-EQD-001. First, AP-2 - no threshold may be frozen that has never been
        measured against its own null, so every threshold in the new contract is a stated
        order statistic of a MEASURED null distribution. Second, ATS-1 - the anti-tuning
        safeguard, which makes calibrating on the null a substitution of numbers into a
        form frozen beforehand rather than a selection among alternatives, with the
        reviewer charged as a named duty with checking against Git that the frozen
        threshold rule predates the calibration commit.
    rc22_cap_applied: >-
      RC-22 permits AT MOST ONE versioned contract review cycle and a REVISE at any
      severity is a non-execution for the run. No second cycle was opened on
      EXP-SMTH-001 and none may be.

  # ==================================================================
  relationship_between_EXP_SMTH_001_and_EXP_EQD_001:
    exp_smth_001_is_left_standing_unedited: >-
      experiments/EXP-SMTH-001/specification.yaml is hash-bound at commit
      d40bf3adde9cefd2b79fafdd56fde7bc61614894 and is NOT edited, amended, versioned or
      superseded-by-overwrite anywhere in BATCH-023. It stands as filed, at status
      review_required, NOT APPROVED, with its defects recorded in the review that found
      them. Records are immutable; corrections supersede, never overwrite (AGENTS.md
      rule 4).
    does_EXP_EQD_001_supersede_it:
      answer: >-
        NO. EXP-EQD-001 DOES NOT SUPERSEDE EXP-SMTH-001 AND IS NOT A VERSION OF IT. It is
        a DIFFERENT EXPERIMENT ON A DIFFERENT MEASURED QUANTITY, and EXP-SMTH-001 remains
        the standing unexecuted contract for the smoothness measurement.
      why_not_a_protocol_amendment_or_a_v2: >-
        A protocol_amendment answers "why the original protocol cannot proceed unchanged"
        while keeping the same experiment - the same measured quantity, the same
        objective, the same hypothesis binding. THE MEASURED QUANTITY CHANGES HERE.
        EXP-SMTH-001 measures B-smoothness functionals of an integer encoding of the
        fibre against an asymptotic analytic model. EXP-EQD-001 measures the joint law of
        the fibre invariants themselves against a measured matched-null distribution,
        factors nothing, invokes no Dickman model, has no smoothness ladder, and binds to
        a different hypothesis. A v2 under EXP-SMTH-001 would inherit a title, an
        objective, a hypothesis_id and a claim scope that would all be false of it, and
        would present a CHANGE OF QUESTION as a REPAIR OF PARAMETERS.
      what_is_carried_over: >-
        QUOTATION AND LESSON, NEVER INHERITANCE BY EDIT - the u = 6 handling discipline
        (declare an unattainable band in advance and confine it to a role its
        unattainability does not spoil, applied here as POW-EQD-1 at K = 256), the
        decision-variable variation check, the declaration and quarantine of derivably
        degenerate variables, the forbidden anti-pattern AP-1, and the manifest.yaml
        ruling.
    do_they_run_alongside_each_other: >-
      THEY RUN IN SEQUENCE, NOT CONCURRENTLY, AND ONLY ONE IS AUTHORIZED NOW. BATCH-023
      dispatches EXP-EQD-001 only. EXP-SMTH-001 is not re-dispatched in BATCH-023 and its
      run is not authorized by this decision. The smoothness measurement is ranked into
      the BATCH-024 opening as OPEN-BATCH023-A, and the route to it is a NEW contract
      carrying the two named repairs - calibrate the KS, rate-band and tail rules against
      a MEASURED null at the actual X instead of against the asymptotic rho, and enumerate
      i < j so the diagonal is excluded by construction.
    the_smoothness_measurement_remains_owed: >-
      YES, AND IT IS FILED RATHER THAN IMPLIED. The direct smoothness measurement of
      HEUR-DS-1 remains UNPERFORMED across twenty-three batches. NO OUTCOME OF BATCH-023
      DISCHARGES IT, no deliverable of BATCH-023 may say that it does, and BATCH-023's
      favourable branch would establish only that ONE ROUTE by which HEUR-DS-1 could fail
      is not present at these cells.

  # ==================================================================
  act_two_open_batch_023:
    batch_id: BATCH-023
    dispatch_queue_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/dispatch_queue.json
    experiment_id: EXP-EQD-001
    hypothesis_id: H-EQD-001
    hypothesis_status_set: specified
    contract_path: experiments/EXP-EQD-001/specification.yaml
    contract_frozen_by_task: TASK-20260801-019
    what_is_dispatched: >-
      Compute the half-arity Semaev fibre invariants (e_1, e_2) exhaustively over the
      frozen deterministic factor base at bits in {16, 20}; compute the identical quantity
      over uniformly random 512-point factor bases under the identical map and
      enumeration; and decide, at thresholds calibrated from a MEASURED null distribution
      under a rule frozen BEFORE that calibration ran, whether the two are
      distinguishable. Certify the rejection side of every substantive branch by a
      MEASURED power curve against pre-declared planted deviations.
    what_is_adopted_from_the_reviewers_forward_guidance: >-
      THE METHOD IS ADOPTED IN FULL - measure the fibre invariants directly, with no
      factorization, no Dickman model, no asymptotic analytic reference and therefore
      none of the finite-X bias that produced RV012-A1.
    what_is_declined_and_why: >-
      THE REFERENCE DISTRIBUTION IS DECLINED, ON THE MERITS. A chi-square or
      two-dimensional KS of (e_1, e_2) against the UNIFORM law on F_p x F_p is DERIVABLY
      REJECTED for a reason with no Semaev content: the roots of S_3(x_i, x_j, Z) are
      x-coordinates of points of E(F_p), the set X_E of such x-coordinates has size about
      p/2, and (e_1, e_2) determines the unordered root pair, so the admissible support
      has density about ONE EIGHTH in F_p x F_p. Freezing that comparison as the
      substantive decision variable would have been a fresh instance of the degeneracy
      class that ended BATCH-020 and BATCH-021. The reference is therefore a MATCHED NULL
      OF THE SAME SHAPE, and the uniform comparison is retained only as a declared
      derivation and an instrument characterization, never as evidence. The reviewer at
      TASK-20260801-025 is directed to attack the one-eighth derivation FIRST.
    two_separate_authorizations_and_neither_is_granted_here:
    - >-
      CALIBRATION_AUTHORIZATION for the NON-EVIDENTIAL calibration run RUN-EQD-001-calib,
      recorded in the TASK-20260801-020 snapshot receipt. NOT GRANTED BY THIS DECISION.
    - >-
      APPROVAL_DETERMINATION for the real arm RUN-EQD-001-real, recorded in the
      TASK-20260801-026 snapshot receipt after the independent review at
      TASK-20260801-025. NOT GRANTED BY THIS DECISION. Committing a review is not
      approving it.
    calibration_is_declared_non_evidential: >-
      RUN-EQD-001-calib is EXPRESSLY NON-EVIDENTIAL about H-EQD-001, about HEUR-DS-1 and
      about H-SMTH-001, in either direction. It touches no real object, enumerates no
      half-tuple of the deterministic factor base, and its package contains no OBJ-REAL
      sample. No evidence record may cite it as bearing on any hypothesis.
    manifest_filename_ruling_carried_forward: >-
      Both runs emit manifest.yaml with the companion filenames command.txt,
      environment.json, stdout.log, stderr.log and raw-result.json - NOTE THE .log RATHER
      THAN .txt. tools/validate_ledger.py indexes runs only by globbing
      experiments/*/runs/*/manifest.yaml, so a manifest.json run is invisible and any
      evidence record citing it is reported as referencing an unknown run. This carries
      DEC-20260801-006.manifest_filename_ruling forward and REPAIRS NOTHING UPSTREAM.
    budget_status: >-
      Authorized under BUDGET-AMEND-20260730-001 (campaign_budget.maximum_batches = 50).
      BATCH-023 is the TWENTY-THIRD batch, so NO PAUSE CONDITION FIRES and GOAL-ECDLP-001
      stays `active`. Stated explicitly rather than left implicit.

  # ==================================================================
  rationale:
  - >-
    A REVISE on a pre-execution contract review is a design verdict, not a measurement.
    The honest filing is a non-execution close that moves no hypothesis and files no
    evidence, plus a new contract that repairs the named defects structurally.
  - >-
    RV012-A1 is repaired STRUCTURALLY rather than by retuning: no analytic-model threshold
    exists anywhere in EXP-EQD-001, and every threshold is a measured quantile with an
    exact stated level, so a threshold set as a quantile of the measured null cannot fail
    on a correct null more often than its declared level whatever the finite-size
    behaviour of the statistic happens to be.
  - >-
    RV012-A2 is repaired BY CONSTRUCTION rather than by post-freeze reading: the diagonal
    is excluded by enumerating i < j, the sample count is declared at C(512, 2) = 130816
    accordingly, and any recorded c_2 = 0 draw is an integrity failure.
  - >-
    The symmetric defect to an unreachable favourable branch is an adverse branch no
    achievable deviation could reach. CAL-2 therefore measures the detection rate against
    a frozen ladder of pre-declared planted deviations, CERT-EQD-1 turns that into an
    in-run certificate, and CAL-STOP-1 stops the batch before the real arm if no delta on
    the ladder reaches the declared bar.
  - >-
    Calibrating thresholds on a null could itself become a tuning channel. ATS-1 closes it
    structurally - the rule precedes the measurement and is hash-bound by an ancestor
    commit, the calibration arm never sees the real data, the calibration is declared
    non-evidential, only SUBSTITUTION of numbers into the frozen form is admitted, the
    driver is frozen by the calibration snapshot and re-hash-checked at the real arm, and
    the reviewer owns the check as a named duty with its own deliverable file.
  - >-
    A new experiment id rather than a v2 is the honest filing when the measured quantity
    changes. Renaming a change of question as a repair of parameters is how a lane loses
    track of what it has actually tested.

  evidence_refs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-013/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-011/snapshot_commit_receipt.json
  - experiments/EXP-SMTH-001/specification.yaml
  - experiments/EXP-EQD-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  evidence_refs_note: >-
    NO RUN ARTIFACT IS CITED BECAUSE NO RUN EXISTS. Every reference above is a contract,
    a review, a receipt or a ledger record. No statistic, timing or measurement of any
    Semaev intermediate is cited anywhere in this decision, because none was produced.

  limitations:
  - >-
    NOTHING IN THIS DECISION IS A MATHEMATICAL RESULT. It closes a batch on a design
    verdict and opens another on a design. No object was measured.
  - >-
    HEUR-DS-1 remains never validated and never refuted at any scale, and BATCH-023 cannot
    change that under any branch, because EXP-EQD-001 measures no smoothness, factors no
    integer and computes no largest prime factor.
  - >-
    The BATCH-023 claim ceiling is TOY. Not claimable under any outcome - crypto-scale or
    medium-scale validity or invalidity of HEUR-DS-1; any statement that HEUR-DS-1 has
    been validated or refuted; any asymptotic exponent statement; any affected-scheme
    scope statement; any movement of the promotion gates G1-G4, which remain OPEN;
    S1_met, F1_met, F2_met or structure_gate_passed, none of which BATCH-023 can evaluate
    because it runs no search; `support` for H-EQD-001, H-SMTH-001 or H-DS-001;
    reject_scoped on a single unreplicated run, and in particular
    reject_scoped-as-impossibility; GOAL-ECDLP-001 completion; and dominated_by null.
  - >-
    Limb L1 - that (e_1, e_2) is not uniform on F_p x F_p and its admissible support has
    density about 1/8 - is a DERIVATION and is recorded as one. No branch of any reading
    rule may present it as an experimental finding of this batch.
  - >-
    Under this harness the authoring and reviewing sessions both resolve to
    claude-opus-5. Reviews in BATCH-023 are independent in the AGENTS.md sense but NOT in
    the model sense, and no review produced here is admissible toward the three-model
    closure quorum of AGENTS.md rule 13.

  declared_open_items:
  - id: OPEN-BATCH022-A
    title: validator run indexing misses manifest.json run packages
    statement: >-
      tools/validate_ledger.py indexes runs only from experiments/*/runs/*/manifest.yaml,
      but both EXP-DS-001 control runs emit manifest.json exactly as their frozen
      contracts specified, so EV-DS-003 and EV-DS-004 are both reported as "evidence
      references unknown run" for runs that exist and were certificate-verified 1200/1200
      by two independent sessions.
    status: FILED AND OPEN; NOT REPAIRED IN THIS DECISION
    batch023_consequence: >-
      EXP-EQD-001 specifies manifest.yaml for both runs so that it does not inherit the
      defect. The immutable EXP-DS-001 contracts and run packages are not touched.
    forbidden_repairs: >-
      Editing any frozen EXP-DS-001 contract, renaming or re-hashing any archived run
      artifact, or editing EV-DS-003 or EV-DS-004 to hide the reference.
  - id: OPEN-BATCH022-B
    title: recurring same-date DEC-id collision between this branch and origin/main
    statement: >-
      Four recorded occurrences to date. The id space is dated and flat while several
      branches allocate into it concurrently without a reservation mechanism, so two
      branches can both take the next free number and discover the collision only at
      merge.
    status: FILED AND OPEN; MITIGATED, NOT FIXED
    batch023_mitigation: >-
      DEC-20260801-007 was re-checked free against the current tree immediately before
      being written - ledger/decisions/ contained DEC-20260801-001 through -006 and no
      -007. The BATCH-023 close id DEC-20260801-008 and the evidence id EV-EQD-001 are
      DECLARED in the queue and carry a MANDATORY freshness re-check at TASK-20260801-031.
      If either is occupied at write time, OUR record is renumbered and never the other
      party's, by queue amendment binding the declared set, artifact_paths and write_scope
      together.
  - id: OPEN-BATCH023-A
    title: the direct smoothness measurement of HEUR-DS-1 is still owed
    statement: >-
      Unperformed across twenty-three batches. Its two named repairs are to calibrate the
      KS, rate-band and tail rules against a MEASURED null at the actual X instead of
      against the asymptotic rho, and to enumerate i < j so the diagonal is excluded by
      construction.
    status: FILED AND OPEN; RANKED INTO THE BATCH-024 OPENING
    not_discharged_by: >-
      Any outcome of EXP-EQD-001. No BATCH-023 deliverable may state or imply otherwise.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED, AND THE REASON IS CONCRETE. The knowledge-promotion gate fires on a
      `support` or `reject_scoped` decision backed by evidence of strength `replicated` or
      `strong`. This decision is `revise` on a pre-execution contract review; NO RUN
      EXISTS, no evidence record is filed, and there is therefore no evidence of any
      strength to promote. The process lesson PROC-BATCH022-1 - measure the null before
      freezing a threshold against it - is carried inside this decision and inside the
      EXP-EQD-001 contract as AP-2 and ATS-1, which is where a lesson with no measurement
      behind it belongs; promoting it to knowledge/findings/ would present a design
      convention as a research finding.

  next_actions:
  - >-
    EXACTLY ONE, AND IT IS THE BATCH-023 CHAIN. Complete the BATCH-023 EXP-EQD-001 chain
    under the frozen contract experiments/EXP-EQD-001/specification.yaml and the queue at
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/dispatch_queue.json, in this
    order and no other - TASK-20260801-020 snapshot hash-binding the contract, the
    hypothesis-bearing decision and the frozen threshold rule THR-EQD-1, CERT-EQD-1,
    CAL-STOP-1 and the statistic family BEFORE any calibration datum exists, recording
    CALIBRATION_AUTHORIZATION; TASK-20260801-021 Executor authoring the driver COMPLETE
    including the real-arm entry point that is NOT executed there, and running
    RUN-EQD-001-calib on NULL AND PLANTED OBJECTS ONLY; TASK-20260801-022 snapshot
    binding the driver sha256 and the calibration package; TASK-20260801-032 INDEPENDENT
    VALIDATION OF THE CALIBRATION PACKAGE before anything is frozen against it, checking
    structurally that the null arm never touched real data (ATS-1 clause 2), that the
    driver carries an unexecuted real-arm entry point, that the driver sha256 matches the
    receipt, and that the measured null numbers, the CAL-1 order statistics and the CAL-2
    detection rates are reproducible - because the calibration being NON-EVIDENTIAL about
    every hypothesis is not the same thing as its needing no integrity check, and every
    threshold in this experiment rests on it; TASK-20260801-023 freezing
    experiments/EXP-EQD-001/reading_rule.yaml with its attainability argument
    ATTAIN-RR-EQD-1 stated WITH MEASURED CALIBRATION NUMBERS, or recording CAL-STOP-1
    non-execution instead; TASK-20260801-024 snapshot hash-binding the reading rule before
    review; TASK-20260801-025 independent review with the NAMED attainability duty AND the
    NAMED ATS-1 anti-tuning duty, each with its own deliverable file; TASK-20260801-026
    approval snapshot recording APPROVAL_DETERMINATION; TASK-20260801-027 Executor
    RUN-EQD-001-real ONLY IF APPROVED; TASK-20260801-028 snapshot; TASK-20260801-029
    Validator and TASK-20260801-030 Red Team; TASK-20260801-031 ledger archive filing
    EV-EQD-001 and DEC-20260801-008 subject to the mandatory freshness re-check, applying
    the frozen rule in its declared precedence order N-0, N-5, N-1, then exactly one of
    N-2, N-4, N-6, and checkpointing this goal with exactly one next action.

  does_not_modify:
  - H-DS-001
  - H-IC-001
  - H-STR-002
  - H-SMTH-001
  - H-SEMAEV-001
  - H-SEMAEV-002
  - EV-DS-001
  - EV-DS-002
  - EV-DS-003
  - EV-DS-004
  - experiments/EXP-DS-001 (every file)
  - experiments/EXP-SMTH-001/specification.yaml
  - GOAL-FAEST-001 and every FAEST artifact
  - every XEDN artifact

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the GPT-5.6-family policy aliases in
      orchestration/model-policies.yaml; the session ran on the inherited Claude backend.
      Recorded, never silently substituted (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      `python3 -m orchestration.adapter doctor --probe` was not run by this session. The
      identifier is unverified runtime-reported configuration.
