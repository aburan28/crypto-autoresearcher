coordinator_decision:
  id: DEC-20260809-ac2f72
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-aa4c65
  context: >-
    Coordinator materialization of a new Arm-A successor after the fresh
    independent TASK-20260809-7761cf NO-GO. This decision records a design
    repair only; it authorizes neither implementation nor execution.
  decision: revise
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-aa4c65
    - H-ECDLP-63d136
    - EXP-ECDLP-e8ef62
    - EV-ECDLP-00ae97
    - TASK-20260809-7761cf
  rationale:
    - >-
      The fresh independent review found two blocking specification defects:
      the paired sign-permutation test was not a deterministic algorithm, and
      the baseline fixture did not freeze the certificate-equation and
      map-transform outputs demanded by its reproduction gate. It also noted a
      low-severity calibration attempt-index ambiguity.
    - >-
      This successor defines exact rational charged-work ratios, a lower
      Hodges-Lehmann geometric estimator from all 36 Walsh values, an exact
      signed-rank T2 statistic with explicit tie/zero rules, the full ordered
      256-vector permutation table, an inclusive tail, and the exact integer
      p-numerator threshold for both FULL/NEG and FULL/BASE.
    - >-
      The baseline proof fixture now freezes the coefficient-group acceptance
      equation R(a,b)=(a+37b) mod 101, every expected residue, every selector
      transition, and every expected negation transform. Calibration prose
      names the inclusive attempt index interval [0,255].
  official_state_changes: []
  official_state_change_note: >-
    H-ECDLP-63d136 remains specified, EXP-ECDLP-e8ef62 remains review_required,
    unfrozen, unauthorized, and evidence-ineligible. H-ECDLP-63eecd and
    EXP-ECDLP-1c12d3 are new design-only successor records. GOAL-ECDLP-001
    remains active. No mathematical conclusion or research status changes.
  evidence_refs:
    - EV-ECDLP-00ae97
    - ledger/decisions/DEC-20260809-f7c133.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-aa4c65/reviews/TASK-20260809-7761cf/review_report.yaml
  limitations:
    - >-
      The successor is a design package only. It has no implementation, run,
      empirical evidence, approval, or freeze decision.
    - >-
      The finite toy claim ceiling and generic 1/2 exponent ceiling are
      unchanged; no finite-size design supports a cryptographic-scale claim.
    - >-
      Independent review, snapshot archive, proof-audit execution, and a
      separate Coordinator approval/freeze gate remain outstanding.
  next_actions:
    - Snapshot-archive TASK-20260809-0b4f8b and all successor producer artifacts.
    - Obtain a fresh independent review-adversarial report against that exact snapshot.
    - If and only if that review passes, create a separate approval/freeze decision and Executor implementation task.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This record is a design repair after a NO-GO. It contains no empirical
      result, mathematical closure, or durable algorithmic claim.
  decided_by: coordinator
  decided_at: '2026-08-09'
