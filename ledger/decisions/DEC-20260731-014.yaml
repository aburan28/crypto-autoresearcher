  limitations:
    - >-
      This decision asserts NOTHING about AES. BATCH-003 produced no
      distinguisher, no key recovery, no speedup, no measured structural excess,
      and no barrier statement about the cipher, at any round count. Zero
      cryptanalytic compute was spent on AES itself.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security
      of any system that uses AES. Claim tier is toy / reduced-round.
    - >-
      A repaired instrument is a reproducibility fact and a computed diameter is
      a derivation fact. Neither is empirical cryptanalytic evidence, and a
      ledger archive makes work durable without upgrading the strength or scope
      of the evidence.
    - >-
      Proposition 801-1 is scoped to its four stated hypotheses; the constant 32
      is an upper bound that is not shown tight; the interface-to-round
      conversion is a modelling convention established by nothing in this batch;
      and both D-705-5 scope holes remain open and untouched.
    - >-
      The gate is a GF(2^4) analogue. Its discriminating reading is a statement
      about the instrument and about the analogue, not about GF(2^8) and not
      about AES, and the property it discriminates on is not the property the
      redesign names.
    - >-
      A green from mutation_control_v3.py certifies aes_reduced.py in NO cell. It
      does not cover (final_mix_columns=True AND r = Nr), where a demonstrably
      wrong module earns a full green; it does not cover decryption, r > Nr,
      r = 0, non-default Components, multi-block mode, or value-conditional
      faults; and it presupposes a non-evasive module, a presupposition that is
      false as a general property of the design.
    - >-
      The structural ruling is a reasoned judgement supported by five measured
      escapes, not a proof of impossibility. The ER-8-restore conjecture is
      unresolved rather than refuted, the strongest evasion channel was named and
      not run, and the BATCH-002 mutant-source audit is incomplete.
    - >-
      Every literature statement anywhere in this batch is
      UNVERIFIED-FROM-MEMORY; zero primary sources were read by any participant,
      and novelty against the external literature was not and in this environment
      cannot be settled. The ShiftRows super-box coordinate fact used by Lemma 1
      is standard but was not verified against a primary source.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE. Both producers, the validator and
      this Coordinator resolve to the same model under inference-amendment
      0137a051; independence in BATCH-003 is in SESSION ONLY, never in MODEL, and
      correlated agreement is the honest reading. model_verified is false in
      every inference block in this batch, and `doctor --probe` was run by
      TASK-20260801-801 (exit 0) and verified nothing.
    - >-
      GOAL-AES-001 is NOT completed and is not proposed for completion. No
      completion criterion is met and no attestation is recorded.
    - >-
      ARCHIVAL DEPENDENCY, stated as a condition on this record rather than
      assumed: the three TASK-20260801-804 validation artifacts are not in this
      ledger commit's declared path set (D-805-2 in EV-AES-003) and must be
      committed in an isolated predecessor commit, together with KN-FIND-018 and
      the regenerated knowledge/INDEX.md, immediately before this ledger commit.
      If that predecessor commit is not made, this decision's proof basis and its
      knowledge_promotion field are unsatisfied and must be corrected by a CORR
      record, never by editing this record.

  next_actions:
    - >-
      OPEN BATCH-004 AND STAND THE INSTRUMENT WORK DOWN. Generate, commit and
      dispatch the GOAL-AES-001 BATCH-004 dispatch queue on this committed
      checkpoint, with NO mutation-control repair task and NO further
      escape-enumeration task in it, and with its whole producer capacity
      directed at the only classes where PROP-701-I and Proposition 801-1 are
      both SILENT — the classes obtained by dropping their hypotheses rather than
      by extending their conclusion. Rank inside the batch, on the merits:
