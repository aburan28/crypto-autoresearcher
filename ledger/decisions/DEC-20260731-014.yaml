      produces a cost inequality, so all four asymptotic promotion gates apply to
      anything it proposes: any bound conditional on an unproven regularity must
      state that regularity as an explicit numbered heuristic and be paired with
      a heuristic-validation experiment in the same or the following batch.
      (2) SECOND, a cheap PRE-SCREEN derived from this batch and applied before
      any compute is spent on a candidate closure in this family: the
      (lambda,k)-graph machine's own geometry — diameter 30, G^2 diameter 16,
      covering number 15, all forced by vertex-transitivity — puts its cheapest
      possible constant at about 32 interfaces, an order of magnitude outside the
      3-7-round scope, so any proposed closure that spreads invariance through
      that graph must exhibit a constant of at most about 7 interfaces or be
      declared IN-SCOPE VACUOUS BY CONSTRUCTION and not run. Also in scope for
      this item: D-705-5 hole (i), word-position-dependent families, which breaks
      the index bookkeeping of Steps 1-2 and needs a replacement argument nobody
      has offered.
      (3) THIRD, and authored directly by the Coordinator rather than as a
      producer task because it has no research content and no uncertainty for a
      producer to reduce, exactly as amendment 002 was:
      protocol-amendment-GOAL-AES-001-004, PROSPECTIVE AND NEVER RETROACTIVE,
      restating DEC-20260731-011's certification condition in the three parts
      this decision rules on — H-1 met by inspection of a closed property;
      coverage closed BY CONSTRUCTION from the module's declared parameter domain
      rather than by an enumerated grid; and the evasion class DECLARED OUT of
      the certification threat model on the stated ground that the module under
      test is committed, readable and non-adversarial, with that declaration
      required to appear in any certificate that relies on it — and fixing the
      D-803-1 residual by stating the provenance requirement per artifact CLASS
