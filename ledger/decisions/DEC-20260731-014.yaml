  structural_ruling:
    question: >-
      Can DEC-20260731-011's certification condition — H-1 and H-3 closed before
      any cryptanalytic measurement is certified against the reduced-round path —
      be discharged at all by an instrument of this design, or must it be
      restated, or does the campaign not need it?
    ruling: >-
      NOT BY ENUMERATION, AND NOT NEEDED YET. The condition decomposes into a
      closed property that is met (H-1), a coverage family that is closable only
      BY CONSTRUCTION and not by enumeration (ER-6, V-804-4), and an evasion
      family that is not closable at all by an in-process instrument against an
      adversarial module (ER-5, ER-7, ER-8, V-804-5, and the un-run tasks-JSON
      channel that would defeat any finite task set). Continuing to enumerate
      escapes is refused as spending budget on a method the campaign's own
      measurements say cannot reach its own gate. Rebuilding on closed properties
      is the correct design and is HELD IN RESERVE until a candidate mechanism
      exists that requires certification, because the condition gates an event
      that has not occurred: three batches have produced zero admissible
      candidate mechanisms to measure.
    evidential_basis: >-
      Five demonstrated escapes across three repairs, from two independent
      sessions (ER-6; ER-7; ER-8; V-804-4; V-804-5), each an existence
      demonstration reproducible from recorded commands, the last two confirmed
      real by direct ciphertext comparison before the control was run; plus the
      structural argument that the mutant is an ordinary child process holding
      the harness's own inputs on its command line.
    what_this_ruling_is_not: >-
      NOT a proof of impossibility, NOT a statement about mutation testing in
      general beyond the instrument and threat model described, NOT a finding
      that aes_reduced.py is wrong — no fault in it was found by anyone in this
      batch and every fault discussed was deliberately injected — and NOT a
      silent restatement of a committed success criterion. The restatement
      requires protocol-amendment-GOAL-AES-001-004 and does not take effect until
      that amendment is committed.
    what_would_overturn_it: >-
      A closed-property mutation control that derives its task set from the
      module's declared parameter domain and runs comparisons under conditions
      indistinguishable from ordinary use, surviving an independent adversarial
      probe that fails to produce a false green; or a demonstration that the
      evasion family is bounded by some mechanism this Coordinator has not
      considered. Either would be a wanted outcome.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim was advanced in BATCH-003. Proposition 801-1
      is a qualitative structural statement with a finite interface constant and
      no cost content; the graph figures are exact combinatorics; the gate
      readings are GF(2)-closure dimensions in a toy analogue; and the instrument
      work is reproducibility. The four promotion gates in agents/coordinator.md
      and .claude/skills/coordinate-research-goal/SKILL.md are therefore NOT
      ENGAGED. They are named again here explicitly so a later batch cannot
      quietly bypass them: (1) an archived proof decomposition into
      single-responsibility lemmas with the main theorem assembling them under
      explicit per-attempt-cost x inverse-success-probability bookkeeping;
      (2) every conditional dependence stated as an explicit numbered heuristic,
      each with archived validation evidence or a scheduled validation
      experiment; (3) a concrete-cost table at standardized parameter sets with
      honest accounting of superpolynomial overhead hidden in o(1) terms, memory,
      time-memory tradeoffs and parallelization, optimistic assumptions flagged,
      and an explicit affected-vs-safe scope statement; and (4) independent
      review-xhigh review per AGENTS.md rule 12 plus a red-team pass on the cost
      model and heuristics. A claim missing any gate may reach `analyzed`, NEVER
      `supported`.
    they_become_live_next_batch_if_OD_4_delivers: >-
      This is not a formality here. The single next action ranks OD-4 first
      precisely because DEC-20260731-013 identified it as the one route from this
      campaign's material that produces a COST INEQUALITY — a lower bound on the
      branching factor B for a given entropy loss, converting PROP-701-I's
      qualitative group-growth argument into a quantitative one. The moment such
      a bound is proposed, all four gates apply in full, and gate (2) applies
      immediately: any bound conditional on an unproven regularity must number
      that heuristic and pair it with a validation experiment in the same or the
      following batch, sampling the relevant distribution and checking tail
      consistency. A conditional result dispatched without that pairing is
      inadmissible.
    proof_architecture_note: >-
      Proposition 801-1 is, incidentally, decomposed exactly as gate (1) asks —
      four single-responsibility lemmas (index bookkeeping, global upgrade,
      one-G^2-step advance, monotonicity) assembled by a counting Assembly with
      the constant 2 + 2n* measured rather than asserted. That is recorded as a
      structural precedent for how a future cost claim should be written, and NOT
      as a partial satisfaction of gate (1), which applies only to an asymptotic
      cost claim and none is made.

