  knowledge_promotion:
    promoted:
      - KN-FIND-018
    promotion_basis: >-
      KN-FIND-018 carries the false-green escape finding: the enumerated list of
      five demonstrated escapes across three repairs of one mutation-control
      instrument, the structural reason they recur (each repair closes one cell
      of an open-ended product of axes or one channel of an open-ended
      observation set, against an adversary model strictly stronger than the
      instrument), the three-part decomposition of what is closable, and the
      forward guidance naming the closed-property design that would change the
      answer. The promotion is warranted on four grounds, each checkable.
      (i) STRENGTH: the underlying evidence is `replicated` in EV-AES-003 for
      exactly these items — five existence demonstrations produced by two
      independent sessions, the last two confirmed real by direct ciphertext
      comparison before the control was run, all reproducible from recorded
      commands.
      (ii) DURABILITY AND REACH: the finding is not about AES and is not confined
      to this campaign. Any campaign in this program that builds a mutation
      control to certify a measurement faces the same design choice, and a reader
      who has not made this error would plausibly make it. That is the same test
      KN-FIND-017 was promoted on.
      (iii) ORDERING DISCIPLINE: the producer-side instances (ER-6, ER-7, ER-8)
      are committed in the e2f8facb snapshot, and the validator-side instances
      (V-804-4, V-804-5) are committed in the isolated predecessor commit that
      must precede this ledger commit — so the checkable artifacts precede the
      decision that relies on them, as docs/claims-and-verification.md requires.
      (iv) THIS DECISION'S CENTRAL RULING RESTS ON IT. A decision that reranks a
      campaign away from a whole class of work on the strength of a finding, and
      then leaves that finding recorded only inside the campaign's own batch
      records, is exactly what the promotion gate exists to prevent.
      The entry carries the SAME proof_status and the SAME honesty as EV-AES-003
      and never a stronger basis: the five instances are demonstrations, and the
      generalisation that H-3 is not meetable by enumeration is labelled a
      REASONED JUDGEMENT and explicitly NOT a proof of impossibility.
    deliberately_not_promoted: >-
      PROPOSITION 801-1 AND COROLLARY 801-2 ARE NOT PROMOTED, and the reason is
      structural rather than a matter of quality. They are an EXTENSION of
      PROP-701-I, which KN-FIND-017 deliberately declines to assert and instructs
      readers not to cite as established. Promoting the extension while the base
      result stays unpromoted would assert a strengthening of a result the corpus
      refuses to assert, and would smuggle PROP-701-I into the knowledge base
      through the back door — while its own falsification gate still fails to
      isolate the ingredient it negates (V-804-1). A second and independent
      reason: the extension is IN-SCOPE VACUOUS, so its durable content for a
      future session is a caution, and that caution is carried where it is
      actionable — in this decision's next action, as the pre-screen requiring a
      constant of at most about 7 interfaces. Promotion of Proposition 801-1
      becomes appropriate if and when PROP-701-I is itself made official, which
      requires a control that isolates its Step-3 ingredient.
      ALSO NOT PROMOTED: the graph facts themselves (diameter 30, G^2 diameter
      16, n* = 15, vertex-transitivity), which are exact and independently
      recomputed but are properties of one object serving one argument, and are
      cited by path from EV-AES-003 where anyone needing them will look; the
      null-isolation lesson from V-804-1, which is a sharper second instance of a
      lesson KN-FIND-017 already carries ("a null built by negating a sufficient
      hypothesis is not automatically discriminating") and which is folded into
      KN-FIND-018's forward guidance rather than given its own entry; and the
      instrument repair itself, which is a reproducibility fact about one file.
    index_regenerated: >-
      knowledge/INDEX.md is updated for KN-FIND-018 per the /curate-knowledge
      conventions and, because this ledger commit must change exactly its two
      declared artifact paths, is committed in a SEPARATE ISOLATED COMMIT
      IMMEDIATELY PRECEDING this ledger commit — the pattern BATCH-001 and
      BATCH-002 both used. The dispatching session MUST confirm
      `python3 tools/build_knowledge_index.py --check` exits zero against the
      committed index before that commit lands; the Coordinator session that
      wrote it has no shell tool and could not run the generator, so the index
      row and the entry count were written to match the generator's output
      exactly rather than asserted to have been generated. If the check fails,
      regenerate the index and do not commit a hand-edited one.

