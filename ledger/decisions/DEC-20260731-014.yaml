coordinator_decision:
  id: DEC-20260731-014
  context: >-
    Official close-out of GOAL-AES-001 BATCH-003, the batch reranked by
    DEC-20260731-013's next action and authorized for dispatch by
    DEC-20260731-015 under protocol-amendment-GOAL-AES-001-003, with
    protocol-amendment-GOAL-AES-001-002 in force prospectively for the first
    time. The batch's coordination package was committed alone at
    c114e51512e7033943f0a17bbacb1296932bc6a6 BEFORE any producer ran. Two
    producers ran concurrently (TASK-20260801-801 executor: the exact diameter of
    the 1020-node (lambda,k) graph, the OD-1 extension, and a redesigned
    GATE-701-C built and RUN; TASK-20260801-802 executor: the ER-6 close-out, the
    D-705-8 coverage boundary and the D-705-2 loader fix). Their exact seven
    artifacts were snapshot-archived alone in TASK-20260801-803 as commit
    e2f8facb040009e92e1000769efe9659ee60494b (parent c114e515), with the
    commit_sha/parent_sha binding write performed in the separate commit
    14022d40, closing D-705-6 rather than repeating it. An independent
    review-adversarial session, TASK-20260801-804, verified that snapshot against
    Git — reachable from HEAD, expected parent, exactly the 8 declared paths, all
    7 producer digests recomputed and matching — and returned TWO SEPARATE
    VERDICTS in two physically separate files with no combined verdict by design:
    (a) OD-1 and the gate PASSED with one MAJOR defect, (b) the ER-6 close-out
    PASSED with two MAJOR defects. This decision is the ledger transition that
    follows, resting on EV-AES-003. The prior verified ledger archive is
    d4f7a7e05f21d530fee01e7cb7a7e8278f5f5eb7. BATCH-003 produced NO cryptanalytic
    result and NO claim about AES of any kind, at any round count; nothing below
    should be read as one.
  decision: revise
  target_ids:
    - RQ-AES-001
    - GOAL-AES-001
    - EV-AES-003
    - KN-FIND-018
    - DEC-20260731-011
    - DEC-20260731-013
    - TASK-20260801-801
    - TASK-20260801-802
    - TASK-20260801-804

  id_provenance: >-
    DEC-20260731-014 was RESERVED for this archive by DEC-20260731-015's
    id_provenance and was verified free by directory listing of ledger/decisions
    at authoring time. EV-AES-003 and KN-FIND-018 were verified free the same
    way. If a concurrent branch has published any of the three by merge time, the
    collision is resolved by a CORR record — CORR-20260731-006 is the next free
    correction ID — and never by editing a committed record (the CORR-20260731-005
    precedent).

  rationale:
    - >-
      THE TWO VALIDATOR VERDICTS ARE KEPT DISTINGUISHABLE AND ARE NOT AVERAGED
      INTO A BATCH GRADE. A sound derivation does not validate an instrument
      repair, and a defect in the repair does not touch the mathematics. The
      validator issued no combined verdict by design and none is manufactured
      here. EV-AES-003 records them as separate observation groups with
      per-group scope statements.
    - >-
      WHAT THIS BATCH ACTUALLY PRODUCED, stated plainly: an exact graph
      computation and a correctly derived but IN-SCOPE VACUOUS extension of
      PROP-701-I; a falsification gate that discriminates but not for the
      property it names; an instrument on which one coverage escape was closed
      and two new false greens were demonstrated; and a structural finding about
      why the second keeps happening. It produced NO cryptanalytic result and NO
      claim about AES at any round count, and zero cryptanalytic compute was
      spent on AES itself. That is the honest headline and it is recorded as
      EV-AES-003's headline_non_result.
    - >-
      THE BATCH'S OPERATIVE OUTCOME IS THAT THE ONLY EXPONENT-RELEVANT LANE
      ADVANCED MATHEMATICALLY AND DID NOT MOVE OPERATIONALLY. Proposition 801-1
      is true and correctly derived — an independent session worked Lemmas 1-4
      and the Assembly and found no error, located the single point at which
      PROP-701-I consumed round-independence, and confirmed that Lemma 2 replaces
      it with (H2) at that interface rather than with a new assumption — and it
      constrains NOTHING the campaign is looking at. Corollary 801-2 permits a
      lossy layer-dependent family to survive up to 31 consecutive interfaces;
      in-scope round counts 3-7 admit at most 7, a margin of 24, and the
      interface-to-round conversion the producer used was independently ruled
      OPTIMISTIC rather than conservative, so the conclusion is robust to it. The
      bound also runs in the wrong DIRECTION: usefulness at 3-7 rounds requires
      "lossy families die quickly", and this says "eventually, at 4.5x the scope
      ceiling". The validator's phrase IN-SCOPE VACUOUS is adopted verbatim on
      its recommendation. THE PRODUCER DID NOT UNDERSTATE IT — residual R1 and
      the manifest field verdicts.od1_extension carry the limitation in the same
      sentence as the "FOLLOWS" — and it did not conflate a graph fact with a
      statement about projections: the small-diameter fact enters only through
      Lemma 3, which derives an implication between invariance statements and
      then counts steps. This is a real outcome recorded as one, not as a null,
      and it carries genuine forward guidance: any future closure attempt built
      on spreading invariance through the (lambda,k) graph must produce a
      constant of at most about 7 interfaces or it is in-scope vacuous BY
      CONSTRUCTION, because the graph's own geometry — diameter 30, G^2 diameter
      16, covering number 15, all forced by vertex-transitivity — puts the
      machine's cheapest possible constant an order of magnitude outside scope.
    - >-
      THE GATE DISCRIMINATES AND THE CLOSURE STAYS WITHHELD, AND THAT IS THE MOST
      CONSEQUENTIAL CALL IN THIS DECISION. GATE-701-C v2 returns three pairwise
      distinguishable readings — dimension 16 for the AES-shaped target, 1 for
      null_1, 8 for null_2, each uniform over all 65535 nonzero Delta — on the
      independent validator's own from-scratch re-run, with the stall proved by
      hand before measurement and matched exactly. Two of the three conditions
      this archive was given for an adverse transition are therefore met: the
      gate DISCRIMINATED on the validator's re-run, and the refutation artifact
      it would rest on is already committed in the e2f8facb snapshot at
      proof_status: derivation. THE THIRD IS NOT. V-804-1 (MAJOR): the validator
      built the null object nobody built — the producer's own deterministic
      selection rule applied to the OTHER proper subgroup of GF(2^4)*, of order 5
      — obtaining a matrix with all entries nonzero, invertible, entries in a
      PROPER subgroup, and a (lambda,k) graph that is NOT strongly connected (3
      SCCs of size 20), which reads 65535/65535 at dimension 16, IDENTICAL TO THE
      TARGET, and would have fired VOID-A. Failure of strong connectivity
      therefore does NOT move the gate reading; three non-strongly-connected
      matrices read 1, 8 and 16. The property doing the work is SUBFIELD
      CONFINEMENT — the producer's own hand argument names it correctly — and not
      the property the redesign advertises as the negated NECESSARY ingredient of
      Step 3. DEC-20260731-013's precondition is only PARTIALLY MET: the gate is
      a faithful instrument for the engine's OUTCOME, not for the engine's STATED
      HYPOTHESIS. This Coordinator independently corroborated the construction —
      the entries {1,8} generate a subgroup of order 5, proper of index 3 in the
      order-15 group, matching the 3 SCCs reported — and records that
      corroboration as coordinator-side, not as independent validation. A
      reject_scoped of the round-independent single-word deterministic class is
      therefore NOT taken, for the second consecutive batch. Controls before
      belief applies to closures, and it applies to a repaired control too.
    - >-
      NO OUTCOME SELECTION WAS FOUND, AND THE EXPOSURE IS RECORDED ANYWAY. The
      selection rule is deterministic; the validator re-executed it and it
      terminates at the first invertible circulant after examining exactly two
      first rows for invertibility only; nulls_run is 1 and
      nulls_discarded_on_a_reading is 0; and the predicted stall of dimension 8
      was proved a priori and matched with no slack, which is not the shape of a
      number fitted after the fact. But the two admissible instantiations of
      "proper subgroup" differ by THE ENTIRE VERDICT — one discriminates, the
      other voids the gate — and the choice between them rested on a criterion
      internal to the same session on a pre-registration timeline that is a file
      mtime and therefore not auditable from committed bytes (V-804-2, minor).
      The validator says both halves plainly: it believes the producer and cannot
      verify it mechanically. This decision records both halves too, and does not
      let the a-priori proof of the stall do work the timeline cannot.
    - >-
      ER-6 IS CLOSED ON ITS AXIS, ON A BASIS THAT WAS EXECUTED RATHER THAN READ.
      The validator wrote its own regime-confined fault, different in regime and
      in wrong value from the producer's, confirmed it real by direct ciphertext
      comparison over a full 12-cell grid with multiple random vectors, and ran
      the committed control against it: verdict FAIL through an EXECUTED
      COMPARISON THAT DIVERGED — 212 comparisons executed, 24 divergent, status
      "compared", infrastructure_outcome false, no exception path — while the
      same fault under the legacy width returns pass, reproducing the ER-6 false
      green and then removing it. The regression is non-vacuous: on the pristine
      module the no-op mutant scores detected: false AFTER 212 executed
      comparisons with zero divergences, all eight fault mutants are detected by
      comparison, and every H-1 injection shape still fails closed. The coverage
      boundary is now machine-readable and matches the code the validator ran
      byte-for-byte at 25 generated cells and six non-empty (key length x fmc)
      cells. D-705-2 is closed by exactly one sys.modules line plus additive
      text, and claim C0 now EXECUTES AND PASSES at 17 PASS / 0 FAIL / 0 SKIP
      from the validator's own run and from this Coordinator's own reading — a
      substantive outcome, because a FAILING cross-check against the BATCH-001
      harness would have been a finding this campaign needed. The "21 enumerated
      cells" figure in the producer's prose section 4 is wrong and the
      machine-readable 25 is right (D-805-1, coordinator-side, low); the
      committed record is not edited and the correction lives in EV-AES-003.
    - >-
      AND THE SAME SESSION PRODUCED TWO NEW FALSE GREENS ON THE REPAIRED
      INSTRUMENT. V-804-4 (MAJOR): a fault confined to (final_mix_columns=True
      AND r = Nr), independently proved wrong in three cells at 4/4 vectors each,
      returns verdict PASS — because build_tasks() sets final_mix_columns=False
      on EVERY full-round task and every reduced-round task has r < Nr, so the
      cell is not thinly covered but EMPTY BY CONSTRUCTION. This is exactly the
      gap the producer predicted, named as open, and correctly declined to run
      inside its own run budget; the producer's conduct is right and the
      instrument's coverage is not. V-804-5 (MAJOR): an under-test cloak keyed on
      sys.argv[0] rather than __name__, proved wrong in four cells, also returns
      verdict PASS — so ER-7 is a CLASS, not an instance. The validator
      enumerated at least four immediately exploitable under-test signals and
      names as strongest, explicitly NOT RUN, a mutant that reads the tasks JSON
      handed to it on sys.argv[2] and disables its fault on exactly the tuples
      that will be compared, which would defeat ANY finite task set including a
      corrected one. V-804-6 is recorded as UNRESOLVED and not as refuted: the
      ER-8-restore probe was confounded, and a matching post-run digest is
      consistent both with "the tamper never landed" and with "the tamper landed
      and was perfectly reverted". Distinguishing absence of evidence from
      evidence of absence is the correct handling and is adopted.
    - >-
      THE STRUCTURAL RULING, WHICH IS THIS DECISION'S LOAD-BEARING ACT. The count
      is FIVE ESCAPES ACROSS THREE REPAIRS — ER-6 inside the H-3 repair; ER-7 and
      ER-8 inside the ER-6 repair; V-804-4 and V-804-5 inside the ER-6 repair
      again, both found by an independent session within one sitting and two of
      the five live in the currently committed instrument. The validator's reason
      is structural rather than inductive and this Coordinator adopts it: each
      repair closes ONE CELL of an open-ended product of axes or ONE CHANNEL of
      an open-ended observation set, while the adversary model is strictly
      stronger than the instrument — the mutant is an ordinary child process
      holding the harness's own inputs on its command line, so any test run under
      a distinguishable condition can be evaded by an object that reads the
      condition, and each added check is itself observable. Enumeration against
      an open-ended set does not converge. THIS DECISION RULES ON
      DEC-20260731-011'S CERTIFICATION CONDITION IN THREE PARTS RATHER THAN ONE,
      because the condition names two defects that are not the same kind of
      object.
      (1) H-1 IS MET. It is a CLOSED property of one function — the only route to
      detected: true is comparisons_executed > 0 AND divergences > 0, every error
      path returning detected: false with infrastructure_outcome: true —
      verifiable by inspection over a finite code path, read and exercised by two
      independent sessions across two batches, and moved by none of the eleven
      injection shapes tried against it.
      (2) H-3 AS AN ENUMERATION IS NOT MEETABLE by an instrument of this design.
      Every repair so far has converted "no fault escapes" into "no fault escapes
      on the axes we enumerated", and the next probe has falsified the weakened
      form each time, at a cost of minutes. Continuing to enumerate would be
      spending the campaign's remaining budget on a method the campaign's own
      measurements say cannot reach its own gate. That is refused.
      (3) H-3 AS A CLOSED PROPERTY IS NOT SHOWN UNATTAINABLE AND HAS NOT BEEN
      ATTEMPTED. The validator's named route is concrete and this Coordinator
      judges it sound in principle: derive the task set from the module's own
      declared parameter domain so that "cell not generated" is impossible by
      construction, and run comparisons under conditions INDISTINGUISHABLE from
      ordinary use so that "hide when observed" has nothing to key on. The first
      closes the coverage family (ER-6, V-804-4) by construction rather than by
      enumeration. The second addresses the evasion family (ER-5, ER-7, ER-8,
      V-804-5) but does not close it: an object that can read anything about its
      environment can in principle be made evasive, and no in-process instrument
      bounds that. THE HONEST DECOMPOSITION IS THEREFORE THAT THE COVERAGE FAMILY
      IS CLOSABLE BY CONSTRUCTION AND THE EVASION FAMILY IS NOT CLOSABLE AT ALL
      BY AN INSTRUMENT OF THIS DESIGN AGAINST AN ADVERSARIAL MODULE. Neither the
      validator's ruling nor this one is a proof of impossibility, and both are
      recorded at that strength.
    - >-
      WHAT FOLLOWS FROM THE RULING, AND WHY IT IS NOT MORE INSTRUMENT WORK. Of
      the three options weighed — (a) redirect the instrument to closed
      properties, (b) re-scope what certification requires, (c) judge that the
      campaign's remaining questions do not need a certified reduced-round
      measurement at all — this decision takes (c) as the operative call for now,
      (b) as a required and separately-recorded protocol act, and (a) as a
      SPECIFICATION HELD IN RESERVE rather than as work dispatched now. The
      reason is that the certification condition is a gate on an event that has
      not occurred. DEC-20260731-011 made H-1 and H-3 preconditions for
      certifying a CRYPTANALYTIC MEASUREMENT against the reduced-round path.
      Three batches in, this campaign has produced ZERO admissible candidate
      mechanisms to measure: BATCH-002's ideation returned
      NO_ADMISSIBLE_NEXT_MECHANISM with 0 of 8 enumerated objects admitted, and
      BATCH-003 spent its exponent-relevant task on a theorem that is in-scope
      vacuous. Hardening a measuring instrument while there is nothing to measure
      is a misallocation, and it is the specific misallocation the five-escape
      finding predicts will be endless. No further mutation-control repair is
      dispatched until a candidate mechanism exists that requires certification;
      at that point the closed-property redesign of (a) is the FIRST thing built,
      before the measurement, and not an enumeration of the next escape.
      RE-SCOPING IS A PROTOCOL ACT AND IS NOT PERFORMED SILENTLY HERE.
      DEC-20260731-011's condition is a committed success criterion, and changing
      it after observing outcomes requires a versioned protocol_amendment
      (agents/coordinator.md). This decision RULES on what the restatement must
      say — H-1 met by inspection; coverage closed by construction from the
      module's declared parameter domain rather than by an enumerated grid; the
      evasion class DECLARED OUT of the certification threat model on the stated
      ground that the module under test is committed, readable and
      non-adversarial, with that declaration written into any certificate that
      relies on it — and defers ENACTING it to
      protocol-amendment-GOAL-AES-001-004, to be authored at BATCH-004's opening
      exactly as amendment 002 was, prospectively and never retroactively. Until
      that amendment exists, DEC-20260731-011's condition stands UNDISCHARGED as
      written, and this decision does not pretend otherwise.
    - >-
      THE CAMPAIGN IS NOT PAUSED, AND PAUSING WOULD BE THE PREMATURE-CLOSURE
      FAILURE. Three of six batches are spent and roughly 12,300 of 20,000
      measured seconds are consumed, so neither the batch count nor the budget
      ceiling is exhausted. None of GOAL-AES-001's four declared pause conditions
      is met: in particular, novelty screening has NOT found every candidate to
      be a rediscovery with no admissible next object — OD-2 (multi-word
      domains), OD-3 (set-valued objects), OD-4 (probabilistic / bounded-branching
      propagation), OD-5's three unexamined classes, OBJ-701-7, OBJ-701-8 and
      both D-705-5 scope holes stand open and unexamined, and Proposition 801-1
      touches none of them. Declining to continue on the ground that three
      batches produced nothing is exactly the failure docs/inventor-protocol.md
      names as symmetric with overclaiming. What IS warranted is a hard rerank
      away from instrument work and toward the classes where BOTH PROP-701-I and
      Proposition 801-1 are SILENT — which is precisely where their hypotheses
      (H1) and (H2) are dropped: word-position-dependent families, restricted
      state quantifiers, set-valued objects, and bounded-branching propagation.
      DEC-20260731-013 already identified OD-4 as the one route from this
      campaign's material that would engage all four asymptotic promotion gates,
      by converting PROP-701-I's qualitative group-growth argument into a LOWER
      BOUND on the branching factor B for a given entropy loss. That is a cost
      inequality, it is exponent-relevant under
      docs/target-result-profile.md, and it is ranked first for BATCH-004.
    - >-
      NOTHING IN THIS BATCH IS UPGRADED IN KIND. A repaired instrument is a
      REPRODUCIBILITY FACT and a computed diameter is a DERIVATION FACT; neither
      is empirical cryptanalytic evidence about AES, and neither supports any
      claim about AES at any round count. The gate is a GF(2^4) analogue and is
      not evidence about GF(2^8), let alone about the cipher. Claim tier is toy
      throughout, ceilinged by RQ-AES-001 and GOAL-AES-001. No literature
      comparison, recalled baseline, sota_delta, bit-margin or extrapolation
      enters this decision or EV-AES-003 in any form, and every literature
      recollection anywhere in this campaign remains unverified-from-memory.
    - >-
      THE REFERRED PROVENANCE DEFECT IS SETTLED ON THE VALIDATOR'S RULING.
      D-803-1 asked independently whether manifest-level, digest-bound coverage
      discharges the base filled-inference-block requirement for a NON-source
      artifact, and invited an overturn. The validator ACCEPTED the ruling on the
      amendment text it read directly — amendment 002 imposes the comment-block
      stanza on "every declared SOURCE-CODE artifact", a prose report is not
      source code, the covering manifest lists the report with a matching digest
      and an explicit coverage assertion, and the digest was recomputed from the
      COMMITTED blob — and named what would have overturned it, none of which
      obtains. It also confirmed the ruling is not a double standard: the source
      file carries BOTH mechanisms. The ruling stands. The residual per-artifact-
      class ambiguity in the archival card's base clause is a drafting item
      carried into the amendment-004 drafting, not a producer defect.
    - >-
      NO ADVERSE TRANSITION IS TAKEN THAT WOULD REQUIRE AN UNARCHIVED REFUTATION
      ARTIFACT. This decision does not weaken or reject_scoped any hypothesis —
      none exists — and closes no lane. The adverse-looking elements are (i) the
      continued WITHHOLDING of an official closure, which is a decision NOT to
      conclude and needs no artifact, and (ii) the refusal to continue
      enumerating coverage escapes, which rests on five demonstrated escape
      instances that are themselves the checkable artifacts: ER-6/ER-7/ER-8 in
      the producer package committed at e2f8facb, and V-804-4/V-804-5 in the
      validation package, each an existence demonstration reproducible from
      recorded commands and each confirmed real by direct ciphertext comparison
      BEFORE the control was run. Their basis is declared: proof_status
      `derivation` for group A and for the structural argument, with the escape
      instances themselves at the strength of reproducible existence
      demonstrations. The generalisation drawn from them is labelled a reasoned
      judgement and not a proof of impossibility, in this decision and in
      EV-AES-003 and in KN-FIND-018 alike.

