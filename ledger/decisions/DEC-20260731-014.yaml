      until then DEC-20260731-011's condition stands undischarged as written.
      GATE-601-A remains NOT dispatched, and no reject_scoped of the
      round-independent single-word deterministic class may be considered until a
      control exists that ISOLATES the ingredient it negates. The closed-property
      mutation-control redesign is SPECIFIED AND HELD IN RESERVE: it is built
      only when and if a candidate mechanism exists that requires certification,
