  dispositions:
    OD_1_and_PROPOSITION_801_1: >-
      RECORDED AS AN IN-SCOPE VACUOUS RESULT, at proof_status: derivation.
      Proposition 801-1 and Corollary 801-2 are true and correctly derived, an
      independent session worked every lemma and the Assembly and found no error,
      and the graph facts they rest on were recomputed from scratch by two
      independent methods with no discrepancy. They constrain NOTHING at the
      round counts RQ-AES-001 scopes: the untouched window of 31 interfaces
      contains all of 3-7 rounds with a margin of 24 interfaces, and the
      interface-to-round conversion is optimistic rather than conservative. The
      phrase "in-scope vacuous" is carried verbatim into every downstream record
      on the validator's recommendation. OD-1 is therefore MATHEMATICALLY
      ADVANCED AND OPERATIONALLY UNMOVED: it is neither closed nor promising, and
      anyone citing Proposition 801-1 in support of a statement about 3-7-round
      AES would be citing a vacuous instance.
    GATE_701_C_v2: >-
      ADMITTED as the superseding falsification gate for PROP-701-I, WITH ITS
      ISOLATION DEFECT ATTACHED. It discriminates (16 / 1 / 8, pre-registered,
      hand-proved before measurement, reproduced from scratch by an independent
      third implementation), which is a genuine repair of the BATCH-002 void, and
      it does NOT isolate the property the redesign names: an equally admissible
      sibling null under the producer's own rule, negating the same named
      ingredient, reads identically to the target and would have voided the gate
      (V-804-1). Any use of this gate must state that the discriminating property
      is SUBFIELD CONFINEMENT of the scalar orbit and not strong connectivity of
      the (lambda,k) graph. Whether a null isolating strong connectivity itself
      exists is UNTESTED and is recorded as an unresolved confound.
    PROP_701_I: >-
      STILL RECORDED, STILL NOT PROMOTED, STILL NOT OFFICIAL. Its proof remains
      complete and correct on two independent step-by-step checks, and its
      AES-shaped case is now confirmed by three independent implementations of
      the analogue. The reject_scoped of the round-independent, single-word,
      single-state, deterministic class is WITHHELD FOR THE SECOND CONSECUTIVE
      BATCH, because DEC-20260731-013's precondition is only PARTIALLY met: the
      redesigned gate discriminates, but not for the ingredient it names, so a
      closure resting on "failure of strong connectivity kills the propagation"
      would rest on a claim the validator's order-5 control falsifies. A closure
      resting instead on "confinement of the scalar orbit to a subfield line
      kills the propagation IN THE GF(2^4) ANALOGUE" is supported by the
      measurement — but that is a statement about the analogue and is not the
      class-level closure that was on the table, and it is not taken as one.
      KN-FIND-017's instruction not to cite PROP-701-I as established stands
      unchanged.
    super_box_lane: >-
      NOT CLOSED, and the honest reading of this batch is that the lane's
      DETERMINISTIC sub-lane is now well understood and operationally empty while
      its non-deterministic sub-lanes are untouched. OD-2 (multi-word domains),
      OD-3 (set-valued objects), OD-4 (probabilistic / bounded-branching
      propagation), OD-5's three unexamined classes, OBJ-701-7, OBJ-701-8 and
      both D-705-5 scope holes stand open. OD-4 is RANKED FIRST for BATCH-004 as
      the only route from this campaign's material that would engage the four
      asymptotic promotion gates.
    instrument_TASK_20260801_802: >-
      ADMITTED as the superseding mutation control for this campaign, as a
      REPRODUCIBILITY FACT only. ER-6 is CLOSED ON THE (key length x
      final_mix_columns) AXIS, demonstrated through an executed comparison that
      diverged. D-705-8 is CLOSED: the coverage boundary is machine-readable and
      matches the code. D-705-2 is CLOSED and claim C0 executes and passes. ER-7
      and ER-8 are OPEN and NEW. V-804-4 and V-804-5 are OPEN, MAJOR, and LIVE in
      the committed instrument. H-2, H-4 and ER-5 remain OPEN; H-4 remains an
      irreducible limitation of this environment, not a defect to repair. NO
      FURTHER REPAIR OF THIS INSTRUMENT IS DISPATCHED until a candidate mechanism
      exists that requires certification, at which point it is rebuilt on closed
