coordinator_decision:
  id: DEC-20260907-93a502
  recorded_at: '2026-09-07'
  context: >-
    RQ-RELN-61638a's third contract, EXP-RELN-141a86 (recovery-gated
    symbolic regression over decomposition-count statistics, hypothesis
    H-RELN-427bfd), was left review_required pending user confirmation. The
    user's instruction was to run all three RQ-RELN-61638a contracts "in
    dependency order"; EXP-RELN-f202be has completed (inconclusive,
    EV-RELN-335cd2 / DEC-20260907-843464) and EXP-RELN-82f487 is approved
    and executing (DEC-20260907-efe01a). This decision approves the third
    contract. Its sibling_predictor_tables input from EXP-RELN-82f487 is
    explicitly optional and its sibling_enumeration input has a
    self-contained Stage-0e fallback, so this contract does not need to
    wait on EXP-RELN-82f487's completion to begin.
  decision: approve
  target_ids:
    - EXP-RELN-141a86
    - H-RELN-427bfd
  rationale:
    - >-
      The contract is fully specified: a pinned, deterministic dual-engine
      pipeline (exhaustive grammar search plus version-pinned PySR with a
      bit-identity gate), five pre-registered Stage-0 recovery controls
      with per-target canonical node counts, two proves-too-much positive
      controls (Z/N interval, small-multiples decay ladder), a
      relabelled-Z/N structure-destruction null, a held-out 2^20 transfer
      anchor, an identifiability/collision-set check, a constants-absorb-N
      check, toy-scale scope, replication seeds, an advisory budget, stage
      budgets, stopping/invalidation rules, a decidable success/
      falsification criterion pair in which NULL is itself a valid,
      reportable confirmation of the hypothesis, decision paths, and
      required artifacts including the 19-entry scored candidate list and
      survivors.json.
    - >-
      Existing user authorization satisfies the confirmation gate
      (docs/research-budget-policy.md; the user's explicit "run all three,
      in dependency order"), consistent with EXP-RELN-f202be's and
      EXP-RELN-82f487's approval basis.
    - >-
      Toy scale only; no claim under any outcome beyond a candidate
      invariant's status (proved/recovered, confirmed-null, or a survivor
      requiring a proof attempt), all requiring independent review before
      use.
  evidence_refs:
    - ledger/proposals/IDEA-20260906-1f6bfe.yaml
    - ledger/hypotheses/H-RELN-427bfd.yaml
    - EV-RELN-335cd2
  limitations:
    - >-
      This decision authorizes Stage 0a first. Per the contract's own
      stopping_rules, Stage 0b (and later stages) may not read any measured
      table until a Coordinator snapshot archive of
      candidate-list-hash.txt and the frozen Stage-0a files is committed
      and verified; this is a two-phase execution, not a single dispatch.
    - >-
      This decision does not assert anything about the outcome (NULL,
      ALIVE, or instrument failure) and nothing about H-RELN-427bfd's
      eventual status.
    - >-
      Promotion of any candidate invariant, or of H-RELN-427bfd, is a
      separate Coordinator decision after independent review per the
      contract's later_review_requirements.
  next_actions:
    - Dispatch the executor per handoff TASK-20260907-4a304a for Stage 0a only.
    - >-
      On Stage 0a's return, the Coordinator snapshot-archives
      candidate-list.yaml, grammar.yaml, environment.lock.json, the control
      closed-form tables, and candidate-list-hash.txt, then dispatches a
      continuation handoff for Stage 0b onward citing that commit.
    - >-
      After execution, run an independent validator (blind Pareto-front
      re-derivation) and red-team pass per later_review_requirements before
      any claim-changing review or hypothesis-status change.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Approval of an experiment contract is not an evidence-review
      decision; no run has executed yet.
  decided_by: coordinator
  decided_at: '2026-09-07'
