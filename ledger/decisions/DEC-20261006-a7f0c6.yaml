    hashes to blob 6d02bf84d4668476886f9c12fc7a3b76f8139099 and parsed
    as YAML without a quote change.

    The contract freezes y^2 = x^3 + x + 1 over F_7, the extension
    F_7[z]/(z^3 + z + 1), and the lexicographic pair order. Success is
    the source idea's prediction that I_frob is at most floor(I_rand / 2).
    The concrete negative is that the instrument checks pass, the map
    is lossy, and I_frob is greater. No point of E(F_{7^3}) was
    enumerated in this session. The field inverses were checked against
    each other on the nonzero field elements. That check is not a value
    of either image.

    python3 tools/portfolio_kpis.py --capacity GOAL-FROB-6333a9 reported
    approved_unrun=1 (EXP-FROB-30006a) against a cap of 3, so headroom
    was 2. The question is one of that goal's question_ids, so the
    contract sets goal_id GOAL-FROB-6333a9.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, decision_impact, and required artifacts are all
    non-null. Success fails when the Frobenius image exceeds half the
    random image under the stated instrument conditions. The driver
    and the trial plan are in the experiment directory.
    python3 tools/newest_experiments.py --experiment EXP-FROB-ad6a6d
    reported execution_state ready. This decision does not launch the
    named future slot RUN-FROB-026551. The same pass files
    IDEA-20261006-d89840, IDEA-20261006-c9ce7d, and
    IDEA-20261006-6c4161 and does not design them.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A larger Frobenius image, with the instrument checks passed and the map lossy, is reachable as a recorded outcome, so success is not automatic.
    - The discriminant, the modulus, the 20 Frobenius identities, the dual inverse, the vertical-drop fraction, and the affine null count are the instrument controls.
    - An instrument failure is not relabeled as an inequality failure, and a mean fibre below 2 is a void rather than the negative.
    - I_tan and the reversed-pair image do not choose the reading row.
    - This session did not enumerate the curve and did not claim that an exponent moves.
    - GOAL-FROB-6333a9 had approval headroom. The contract names that goal.

  evidence_refs: []
  limitations:
    - The measurement covers one curve over a field of 343 elements. It does not transfer to a larger field.
    - A smaller Frobenius image does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - A short sample, a failed identity, a positive null count, and a mean fibre below 2 are not the negative.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - I_tan and the reversed-pair image are recorded beside the ratio and do not choose the reading row.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

