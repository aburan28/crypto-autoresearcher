coordinator_decision:
  id: DEC-20260805-4823db
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-a51f91
  recorded_by_task: TASK-20260805-d23bf0
  authorized_by: GOAL-MLKEM-005
  recorded_at: '2026-08-06'
  id_date_note: >-
    The token was minted on 2026-08-05 when the dispatch queue was authored and
    is bound in that queue's `record_ids`. The record is written on 2026-08-06.
    The ID is an identifier, not a timestamp claim; `recorded_at` is the
    authority on when.

  decision: continue
  decision_label: >-
    Batch 1 answers the question it was built to answer and answers it
    negatively in one lane, opens a normative gap in another, and fails its own
    instrument in the third. NONE of those closes the goal, and this decision
    records why on the goal record's own terms. The kill conditions K1/K2/K3
    are adjudicated: K1 did not fire and was the wrong question, K2 did not
    fire, K3's antecedent fired but its consequent was drafted in contradiction
    to the goal record and is void. C2 is met, with its distribution restated;
    C1 is untouched; C3 is unmet -- and is shown by an independent reviewer to
    be REACHABLE by this exact instrument after a specific repair. GOAL-
    MLKEM-005 REMAINS `active`.

  context: >-
    Batch 1 of GOAL-MLKEM-005, the first campaign in this program with a
    deliberately unbounded budget, created at the user's explicit instruction
    after two predecessor campaigns exited at `closed_at_budget` without
    answering their own questions. Four producers ran under a queue whose
    Coordinator-authored cards carried a defect the batch then had to correct
    (see `coordinator_error_corrections`).

  coordinator_validity_check: >-
    Both reviews ran in independent sessions after the snapshot commit and
    neither committed its own artifacts. The dispatcher's GitRepositoryVerifier
    was run this session over the bound queue and ACCEPTED snapshot commit
    7983a474be82684cca63ffd79495a3a50e582e62 against its declared parent
    0585d985, its 53 declared paths and their hashes -- which discharges DEF-10
    and makes the package official under CLAUDE.md rule 7. The snapshot
    receipt's own `verification.status` field remains "bound_pending_verifier";
    it is a committed artifact and is not edited, per the program's convention
    that a receipt records its state at binding time and a later archive
    records the acceptance. Reviewer independence is PROCEDURAL ONLY: every
    producer and both reviewers resolved to claude-opus-5, and the red team
    says so itself rather than letting it pass as independence.

  kill_condition_adjudication:
    note: >-
      The dispatch card for this task required K1/K2/K3 to be adjudicated
      explicitly BEFORE authorising batch 2, and stated that if any fired "the
      campaign closes as completed under the stop rule". That instruction is
      itself defective and is corrected below as CE-2. Each condition is
      adjudicated on its merits first.
    K1:
      as_written: >-
        "no standardised mode yields M > 2^20 -> the mechanism is capped at
        <= log2 M bits on session recovery, campaign closes with a measured
        cap"
      verdict: DID NOT FIRE, AND WAS THE WRONG QUESTION.
      adjudication_source: RT-20260806-d008e0 `k1_adjudication`, adopted in full.
      reasons:
        - >-
          ANTECEDENT/INSTRUMENT MISMATCH. K1 quantifies over what deployment
          modes YIELD. A census of specification text can only report what
          specifications STATE. For 8 of the 14 deployment-mode rows the
          specification states nothing, and for two of them the specification's
          own design intent argues the other way -- R15 (ECH) records that
          "anonymity sets will typically involve many connections even with
          fairly fast rotation intervals", and R18 (CMS) that the recipient key
          "is expected to be carried in a long-lived certificate and used over
          and over". In those modes M is a traffic fact, not a document fact.
        - >-
          THE BRANCHES DO NOT EXHAUST THE OUTCOMES. K1 admits "yields > 2^20"
          and "does not". The actual outcome -- 8 of 14 modes state nothing at
          all in either direction -- is in neither branch. This is
          KN-TECH-1a5b7e mode 4, the decision rule that cannot discriminate,
          transposed from a statistical lane to a documentary one. The batch
          produced that failure TWICE in one dispatch, once in T2's 4s gate and
          once in K1, from the same root: a rule that partitions the range of a
          quantity rather than the space of outcomes, with no NEITHER branch.
        - >-
          THE CONSEQUENT IS MALFORMED AND WOULD HAVE MANUFACTURED A BOUND.
          "capped at <= log2 M bits" leaves M unbound. Read as "M <= 2^20
          everywhere" it licenses a 20-bit cap. But where the census finds a
          number at all, that number is 1, giving G <= log2 1 = 0 -- exactly
          zero room, not 20 bits of room -- and where it finds no number, no
          cap follows at all. A rule that converts "no number found" into "the
          number is 2^20" manufactures a bound, in the UNSAFE direction, from
          an absence.
        - >-
          "CLOSES WITH A MEASURED CAP" IS A CATEGORY ERROR. A documentary
          census is not a measurement: no contrast, no comparator, no
          surrogate, no spread. T1 states this and refuses to invent a null in
          order to look rigorous. Calling its output "measured" would import an
          evidential status the artifact cannot carry.
      what_the_census_produced_instead: >-
        A LANE CLOSURE with a named obstruction (R20 SSH and R21 IKEv2 carry a
        normative per-key single-use REQUIREMENT for ML-KEM, so M = 1 and
        G <= log2 1 = 0), and a NORMATIVE DEAD END: draft-ietf-tls-hybrid-
        design-16 Sec. 2 -> FIPS 203 -> nothing, with SP 800-227 Sec. 4.1
        describing the static case as "many connections ... over a long period
        of time" and the CFRG draft endorsing reuse for "multiple incoming
        ciphertexts" without a count. The mechanism's one free parameter is
        bounded neither by mathematics nor by the standards stack. The red
        team's assessment, adopted: "This is the campaign's most transportable
        product so far and it is a DEFENSIVE one, which is this goal's remit."
      firm_count_correction: >-
        The count supporting a G <= 0 cap is 2 firm (R20, R21) plus 2 caveated
        (R09, R22), NOT 6. R12 and R14 state one ciphertext PER HANDSHAKE under
        a governing clause that permits key reuse. Recorded as CX-1 in
        EV-MLKEM-d146a5.
    K2:
      as_written: >-
        "the one-out-of-many reduction is concretely tight -> campaign closes
        on a citation"
      verdict: DID NOT FIRE.
      basis: >-
        T4 recorded kill (iii) as not firing, as a statement about the
        retrievable record rather than about DHKLS being wrong, and attached a
        precondition in bold: "A Reviewer should obtain 2021/1351 and check the
        quotes at page 3 and footnote 2 before this verdict is treated as
        settled." THE PRECONDITION IS NOW DISCHARGED. RT-20260806-d008e0
        obtained the CCS'21 published version (HTTP 200, 1,832,736 bytes, 17
        pages, sha256 2198eaf1...), checked Bernstein's Appendix A.4
        quotations against it at first hand, found them accurate, and reports
        that the kill verdict "survives and is STRENGTHENED". The scope caveat
        stands: this is the published version, not the ePrint PDF.
      remaining_state: >-
        Bernstein ePrint 2022/1580 remains the dominator for the mechanism and
        is undisturbed. Its footnote 19 names the concrete question as "not
        addressed by this paper's asymptotics", which leaves the concrete
        question OPEN -- but not wide: its Sec. 1.3 also declines to say the
        heuristics are right and flags "Perhaps Kyber-512 is too small for the
        heuristic multi-target speedups to be applicable".
    K3:
      as_written: >-
        "T2's sensitivity demonstration missed its 4s threshold -> instrument
        outcome, stop, record no mathematics"
      verdict: >-
        ANTECEDENT FIRED; CONSEQUENT IS VOID IN ITS "STOP" CLAUSE. The gate
        failed in all four cells, so "instrument outcome" and "record no
        mathematics" are both correct and both are honoured -- EV-MLKEM-d146a5
        adjudicates T2 to C3's `NEITHER` branch and asserts no distributional
        conclusion. The "stop" clause is void: it would close the goal on a
        failed measurement, which GOAL-MLKEM-005's own `non_terminal_conditions`
        forbid in two separate entries ("A measurement returns a negative
        result, or no effect"; "A task fails, times out, or hits a provider
        limit"). A kill condition may not override the goal record it was
        drafted under. Recorded as CE-2.
      and_the_stronger_reason: >-
        C3 IS NOT UNMEETABLE BY THIS DESIGN. The red team measured the missing
        arm at d = 100, beta = 30: haar null 1.00116 +- 0.00236, coordinate-
        aligned 1.09402 +- 0.00396 (a shift of 39.3 comparator sds against a
        gate that demanded 4), unreduced q-ary tail GSO 1.03719 +- 0.00236
        (15.3 sds), strictly monotone across a seven-point graded family with
        five interior points. Its words, adopted verbatim as this decision's
        reading: "The statistic is alive; one declared arm was wrong." Stopping
        on K3 would have retired a reachable criterion on the strength of a
        broken control.

  what_is_established_this_batch:
    - >-
      C2 IS MET, with its distribution restated. T1 delivered 24 sourced rows
      carrying specification, section, bounding mechanism and retrieval date;
      the validator re-fetched the load-bearing sources byte-identically and
      re-derived the FIPS 203 negative with seven terms the census had not
      declared, calling it "stronger than stated"; and the distribution
      sentence states the M = 1 share alongside the maximum (1) in the same
      sentence, which is what C2 asks in terms. It is met with CX-1's bucket
      split and CX-2's second delegation limb carried with it, and it is met in
      the direction the census's producer refused to overstate.
    - >-
      THE EPHEMERAL LANE IS RETIRED WITH A NAMED OBSTRUCTION. R20 and R21.
      G <= log2 1 = 0. Best-of-M selection has provably zero room there.
    - >-
      A NORMATIVE GAP IS DOCUMENTED AT ROW LEVEL, and it is a defensive finding
      -- which is this goal's remit and the user's stated reason for opening
      it.
    - >-
      C3's INSTRUMENT IS DIAGNOSED, NOT MERELY FAILED. Two independent causes
      are now named where the Coordinator's snapshot named one: the
      demonstration manipulated the wrong object, AND the threshold was
      calibrated on the wrong arm's spread.

  what_is_NOT_established:
    - C1 is untouched. No numeric dbeta with a core-SVP bit value under a named cost model exists.
    - C3 is unmet. The instrument failed its own gate; its real-arm numbers are uninterpretable until the missing arm runs.
    - No ML-KEM break, no security claim in either direction, no FIPS 203 parameter set affected or cleared.
    - No ceiling on M. Eight of fourteen deployment modes state no count in either direction.
    - No heuristic validated or refuted; no speedup; no exponent moved; no attack.
    - Nothing at beta = 606, d = 1420 -- including the red team's own probe.

  goal_disposition:
    record: GOAL-MLKEM-005
    from: active
    to: active
    status_unchanged: true
    why_not_completed: >-
      The stop rule requires C1-C3 to be MET. C1 is untouched and C3 is unmet.
      The red team states the position without hedging: "It cannot close (C1
      untouched, C3 unmet)."
    why_not_closed_at_budget: >-
      Structurally impossible for this goal and deliberately so. `closed_at_
      budget` asserts that the budget ran out WITHOUT a completion criterion
      being met; GOAL-MLKEM-005 has `maximum_batches: null` and
      `total_wall_clock_seconds: null`, so the status cannot fire. This was the
      design decision of the goal record, taken at the user's explicit
      instruction, precisely because both predecessor campaigns exited there
      without finishing their science.
    why_not_paused: >-
      All four pause conditions are infrastructure-only or user-initiated. The
      archive verifies, the branch pushes, no `degradable: false` review policy
      was needed, and the user has not asked. None applies.
    non_terminal_conditions_that_a_careless_reading_might_have_cited: >-
      Four of the eight are live this batch and NONE of them may close this
      goal: a lane was closed with a named obstruction; a measurement returned
      an instrument failure; a task's declared control failed; and the visible
      remaining space is narrow enough that a fatigued reading would call the
      problem saturated. The goal record anticipates exactly this and bars all
      four by name. Premature closure is a failure mode symmetric with
      overclaiming, and the honest position is that C3 is one repaired control
      away from being answerable.

  coordinator_error_corrections:
    - id: CE-1
      severity: material
      defect: >-
        A MANUFACTURED NUMBER. Snapshot commit 7983a474 states "P1 and P2
        passed by 30-100x". That figure appears in NO producer artifact and is
        FALSE for both predicates. Recomputed by me from
        TASK-20260805-708b70/results.json, real arm, pooled ratios against the
        frozen tolerances (P1: 0.05 at 2^-10, 0.10 at 2^-16; P2: 0.20):
        P1 @ 2^-10 margins 29.3x, 92.9x, 108.1x, 50.1x; P1 @ 2^-16 margins
        10.6x, 200.5x, 24.5x, 95.7x; P2 margins 290,246x, 268,923x, 359,398x,
        403,519x. The stated band is wrong at BOTH ends for P1 (true range
        10.6x-200.5x) and wrong by three to four orders of magnitude for P2.
        The commit's own preamble reads "Producer numbers stated as the
        producers', with their own qualifiers", so the sentence breaches the
        standard the same commit declares.
      raised_by: RT-20260806-d008e0 OBJ-1
      independently_verified_by_coordinator: >-
        Yes, from results.json, before adopting the objection. All twelve
        margins above reproduce to the digits shown.
      extent_worse_than_the_objection_states: >-
        OBJ-1's cheapest-check line says `grep -rn "30-100"` over the batch
        task tree "returns nothing". It returns nothing IN ANY PRODUCER
        ARTIFACT, which is the objection's substance and is correct. But the
        string is in three Coordinator-authored places: the commit message,
        archives/TASK-20260805-9f6345/snapshot_receipt.json, and
        dispatch_queue.json line 298 -- which means I FED THE FALSE NUMBER TO
        BOTH REVIEWERS IN THEIR OWN CARDS. The red team recomputed it anyway
        and convicted the card it was handed. That is the behaviour the
        contract exists to produce, and it is the only reason this defect is
        in the record.
      this_is_the_tenth: >-
        Ten Coordinator commit-message defects across this program, every one
        caught by a reviewer and none by me. The worst prior was fabricated
        ATTRIBUTION (82bcbbe4, seven strings quoted as a producer's under
        "verbatim" that appear in no producer artifact). This is the first
        fabricated NUMBER. The rule adopted after 82bcbbe4 -- quote only from
        declared paths -- was kept for quotations and did not cover figures.
        The extension is stated in `process_defects_carried_forward`.
      direction_of_the_error: >-
        Deflationary: it made an astronomically wide pass look marginal, and
        the clause following it was the correct deflationary point, so nothing
        downstream is inflated. That mitigates the consequence and not the
        defect.
      remedy: >-
        This correction. Commit 7983a474 is immutable and is not rewritten.
    - id: CE-2
      severity: material
      defect: >-
        THE KILL CONDITIONS WERE DRAFTED IN CONTRADICTION TO THE GOAL RECORD.
        The TASK-20260805-d23bf0 card states "if any fired, the campaign closes
        as completed under the stop rule". The stop rule says no such thing: it
        closes the goal when C1-C3 are MET. K3's antecedent is a failed
        control, and closing on a failed control is barred by two separate
        `non_terminal_conditions` entries. Had K3 been applied as written it
        would have retired a reachable criterion -- the criterion the red team
        then showed is reachable -- on the strength of a broken instrument.
        K1 has the same structural defect from the other side: OBJ-9 and the
        adjudication above show it would have manufactured a 20-bit cap out of
        an absence.
      raised_by: >-
        RT-20260806-d008e0 OBJ-9 for K1; the K3 half found by me while
        adjudicating, and stated here because a defect found late is still a
        defect.
      remedy: >-
        No kill condition in any successor batch of this campaign may name goal
        closure as its consequent. A kill condition retires a LANE or a
        CANDIDATE. Only C1-C3 close this goal, and only when met.
    - id: CE-3
      severity: minor
      defect: >-
        "unobtainable from four routes" (snapshot 7983a474) is Coordinator-
        authored in both its count and its framing. reads.md Sec. 3.2 lists
        eight route rows; the producers' own list has at least seven failed
        routes for the body; and the paper was retrievable in two commands.
      raised_by: RT-20260806-d008e0 OBJ-5
      remedy: CX-3 in EV-MLKEM-d146a5, plus the acquisition-path fix in `next_actions`.
    - id: CE-4
      severity: minor
      defect: >-
        "5,582 entries carry citation_verified: read with every identifier
        null" states no denominator, in a list whose two neighbours are
        properly fractioned ("1,938 of 1,939", "7,421 of 7,809"), under a
        heading that reads "is SYSTEMIC" -- so an unfractioned count reads as a
        proportion.
      raised_by: RT-20260806-d008e0 OBJ-6
      verified_by_coordinator: "`ls knowledge/literature | wc -l` returns 7809."
      remedy: >-
        Restated as "5,582 of 7,809 (71.5%)" in EV-MLKEM-d146a5 and wherever
        the figure is carried forward. The red team notes this is the third
        Coordinator commit message to breach the same KN-TECH-1a5b7e caution,
        not the second.
    - id: CE-5
      severity: minor
      defect: >-
        The snapshot commit's T4 paragraph carries "its body was NOT
        summarised" under a capitalised headline "KILL (iii) DOES NOT FIRE",
        dropping the producer's own bolded precondition that a Reviewer obtain
        2021/1351 and check the quotes before the verdict is treated as
        settled.
      raised_by: RT-20260806-d008e0 OBJ-7
      remedy: >-
        The precondition is recorded AND recorded as discharged, in
        EV-MLKEM-d146a5 and in the K2 adjudication above.
    - id: CE-6
      severity: minor
      defect: >-
        The snapshot commit gives ONE cause for the 4s gate failure ("BECAUSE
        the demonstration ... has expected contrast exactly zero"). Two
        independent causes are operating -- the forcing defect and the
        threshold-calibration defect (OBJ-4, DEF-3) -- and neither is
        established as sufficient alone. "Exactly zero" is also overstated for
        the declared statistic (CX-4).
      raised_by: RT-20260806-d008e0 OBJ-4 and OBJ-8; VAL-20260806-bb0559 DEF-1 and DEF-3
      remedy: Both causes recorded in EV-MLKEM-d146a5; the wording corrected as CX-4.

  design_findings_this_batch:
    - id: DF-1
      finding: >-
        A SENSITIVITY DEMONSTRATION MUST MANIPULATE THE OBJECT THE NULL
        REMOVES. T2's null removed the PROJECTOR's provenance; its
        demonstration manipulated the ERROR LAW. KN-TECH-1a5b7e obligation 3 is
        a property of an (object, statistic) PAIR, and the entry's own mode-2
        catch line reads "Obligation 3 applied per statistic, not per null" --
        this design satisfies it per statistic and violates it per OBJECT.
        The frozen file's justification compounds the error: it predicted the
        anisotropy would widen R's distribution by sqrt(1.36) and push the
        lower quantiles DOWN. Under a Haar projector the marginal law is
        exactly Beta for any Sigma, so the widening is exactly zero, and the
        second-order effect that does exist has the OPPOSITE sign. The frozen
        derivation was wrong in magnitude and in direction, and the two lines
        of algebra that show it were available on the day the card was frozen.
      raised_by: RT-20260806-d008e0 OBJ-3
      owed: >-
        `sensitivity_manipulates_the_removed_object` belongs on the
        KN-TECH-1a5b7e checklist at its next supersession. It cannot be added
        now: rule 12 is UNMET and UNWAIVED.
    - id: DF-2
      finding: >-
        A GATE THRESHOLD MUST BE DECLARED IN UNITS OF THE SE OF THE DIFFERENCE
        AT THE DECLARED DRAW COUNT, never in per-draw sds of one arm. T2's gate
        used the Haar arm's per-draw sd -- the arm whose between-draw location
        variance is structurally ~0, because E[R|P] = beta/d deterministically
        under an isotropic Sigma. The demonstration arm's per-draw sd is
        4.33x-5.79x the Haar arm's in the package's own results.json, so the
        correct SE of the difference is 1.57-2.08 s and "4 s" is a ~2.0-2.5
        sigma test. This defect would have degraded the gate even for a
        demonstration with a large true effect.
      raised_by: RT-20260806-d008e0 OBJ-4, corroborated independently by VAL-20260806-bb0559 DEF-3
    - id: DF-3
      finding: >-
        A DECISION RULE MUST PARTITION THE SPACE OF OUTCOMES, NOT THE RANGE OF
        A QUANTITY. Both K1 and T2's 4s gate failed this way in a single
        dispatch: neither had a NEITHER branch, and the actual outcome landed
        in the gap. This is KN-TECH-1a5b7e mode 4, and it now has a documentary
        instance as well as a statistical one.
      raised_by: RT-20260806-d008e0 OBJ-9 / k1_adjudication

  explicit_non_claims:
    - No ML-KEM break. Session recovery, not key recovery.
    - >-
      No number in this decision or in EV-MLKEM-d146a5 is subtracted from the
      in-repo primal_bdd margins of 2.80 / 6.04 / 1.28 bits.
    - >-
      The red team's 39.3-sd probe is not evidence about ML-KEM. It is evidence
      that an instrument has a dynamic range, at one toy cell, from a
      re-derivation its author explicitly declines to call a run record.
    - >-
      "C2 is met" is a statement about a documentary census satisfying a
      declared criterion. It is not a claim that M = 1 in deployment, which
      remains unmeasured, and the eight count-unstated modes are named so that
      no reader can mistake the one for the other.
    - >-
      A verified archive is not a result. This commit makes the batch durable;
      it does not upgrade the strength or scope of anything in it.

