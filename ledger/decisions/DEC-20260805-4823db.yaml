  ranking_rationale: >-
    Three lanes were live entering this batch. DEPLOYMENT is now split: its
    ephemeral half is closed with a named obstruction and its static half is
    the campaign's most transportable product, costing zero compute to write
    up. GEOMETRY was the batch's headline and its instrument failed -- but the
    failure is a control defect, not a ceiling, and an independent reviewer has
    already exhibited the repaired control's dynamic range at 39.3 sds with a
    monotone seven-point family and its expensive component (the BKZ
    reductions) already cached. That makes the repaired measurement both the
    highest-value and the cheapest remaining task, and it is the only one that
    can discharge a completion criterion. The C1 bound is second: it needs no
    new compute, T3's conversion instrument is verified, and the census now
    supplies the two lanes it must be stated separately for. The red team's
    stated condition for recommending a PAUSE instead -- "if the only proposal
    were another variation of the T2 measurement without the missing arm, or
    another census, or another literature sweep" -- is recorded here because it
    is the honest tripwire for the next batch after this one.

  limitations:
    - >-
      Reviewer independence is procedural, not model-level. Recorded in every
      batch of this campaign rather than left to pass as independence.
    - >-
      The Ducas-Pulles material in reads.md Sec. 4 is `unable_to_check` and
      must not be cited downstream as archived (DEF-9).
    - >-
      The `primal_bdd` optimize_d anomaly is reproduced but its downstream
      significance is unchecked.
    - >-
      This decision adopts the red team's C3-reachability measurement as a
      reason to REPAIR rather than retire. It does not adopt it as a result,
      and batch 2 must re-measure it inside an archive task before any record
      relies on it.

