coordinator_decision:
  id: DEC-20260804-b8d7be
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-090
  recorded_by_task: TASK-20260804-120
  archived_by: TASK-20260804-121
  context: >-
    BATCH-090: Discrete Morse analysis of ECDLP-IDEA-073. Two independent obstructions
    found. The approach avoids DL circularity but is blocked by topological/algebraic obstructions.

  decision: close_discrete_morse
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    ECDLP-IDEA-073 (Algebraic Discrete-Morse) CLOSED with two named obstructions:

    1. **Betti number floor** (topological, hard): For the "all m-tuples" chain complex,
       the first Betti number β_1 ≥ B ≥ N^{1/2} (lower bound from linear algebra on
       chain groups). Discrete Morse inequality forces ≥ B critical 1-cells. Since B ≥
       N^{1/2} is required for any 2-decompositions, the critical complex is NOT sub-rho.
       This is independent of H-PSEUDO and DL structure.

    2. **Chain homotopy lift cost**: For the "partial sums toward R" contractible complex,
       extracting a factor-base decomposition from the trivial critical cell requires
       traversing O(r_m(R)) chain-homotopy data — same cost as direct search.

    POSITIVE OBSERVATION: The discrete Morse approach is the FIRST mechanism studied
    that genuinely avoids the DL circularity obstruction (it operates purely combinatorially
    on the EC group law without algebraic characters). However, the topological obstruction
    (Betti number floor) closes it regardless.

    This suggests that future proposals should also target combinatorial/topological
    approaches (to avoid DL circularity) while addressing the Betti number obstruction
    differently.

  exact_next_action: >-
    Continue the loop: BATCH-091 will look for a combinatorial approach that BOTH
    avoids DL circularity AND circumvents the Betti number floor. Specifically:
    is there a complex structure for the ECDLP where the Betti number is sub-N^{1/2}?
    This would require a different chain complex structure (not "all m-tuples").
    Possible direction: use a FILTERED complex or a complex built from RELATIONS
    rather than decompositions.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Discrete Morse avoids DL circularity — worth a brief KN-FIND noting the positive
      observation (combinatorial approaches are the first to genuinely avoid circularity).
      But two independent obstructions close the specific IDEA-073 formulation.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
