coordinator_decision:
  id: DEC-20261022-a8c780
  id_provenance: >-
    Allocated by the top-level session with tools/allocate_id.py and confirmed free before this record was drafted,
    together with H-PFDR-727bfc, EXP-PFDR-bb0d26, BATCH-8d6d84, TASK-20261022-726d76, TASK-20261022-b6532d,
    TASK-20261022-32fe8b, TASK-20261022-207893, TASK-20261022-53a695 and DEC-20261022-f1efde. The Coordinator
    minted no id.
  recorded_at: '2026-10-22'
  decided_at: '2026-10-22'
  decided_by: coordinator
  goal_id: GOAL-PFDR-fd09e0
  question_ids: [RQ-PFDR-ae2fba]
  mode: design_experiment_specification
  kind: hypothesis_specification
  context: >-
    GOAL-PFDR-fd09e0 (active, max_concurrent 2, one open lane BATCH-286bd3 hosting EXP-PFDR-ca5e01) hosts
    RQ-PFDR-ae2fba. Four proposals of the latest ideation round are open for the question. IDEA-20261017-077f12 is
    already designed, approved and run (H-PFDR-011a4b, EXP-PFDR-ca5e01, DEC-20261017-6fb3ce); its evidence record does
    not yet exist and this design was written without reading any run, report, runbook-session or analysis of it.
    IDEA-20261017-bbc53e is folded into H-PFDR-011a4b. IDEA-20261017-078074 and IDEA-20261017-90d9c5 are cited by no
    hypothesis, experiment or decision. The engine write restriction (DEC-20261002-c3f49b NA-5, lifted only for the
    EC-A1 files) stays in force, so a selected design may add or edit no engine file. The goal scope is public toy
    curves only, no deployed target, no private key and no claim about the security of any deployed curve, and the user
    has not widened it.
  decision: revise
  decision_scope: >-
    Selects IDEA-20261017-078074, specifies H-PFDR-727bfc (status specified) and drafts EXP-PFDR-bb0d26 as
    review_required with frozen false, approved_by null and execution_authorized false, and issues the implementation
    task TASK-20261022-726d76. The approvable scope is the toy part only (45 toy cells, toy replication, toy headline).
    The idea's real-curve extension is held for a user decision and is in no bound artifact. This decision does not
    approve the experiment, open a lane, dispatch a task, authorize a trial, change the status of IDEA-20261017-078074
    or of any other record, or change the goal. Approval is a separate later act (DEC-20261022-f1efde is reserved) after
    the implementation, the preapproval probe and the runbook compile.
  scope_correction:
    recorded_before_commit: true
    ruling: >-
      The top-level session ruled that the real-curve arm (secp256k1 and NIST P-256) is not admitted: a scope the
      Coordinator widens by its own reading is not authorised, and the goal scope says public toy curves only. The
      Coordinator's first reading (admit it as a severable trial under four limits) is withdrawn. The arm is held for a
      user decision to be requested by the top-level session.
    removed_from_approved_scope:
    - the census-real trial and its run id (five trials remain)
    - the 36 real-curve cells and 96 draws, the real-curve rules R-ZERO, R-HIT, R-INCOMPLETE and R-INVALID and prediction P3
    - fixtures/realcurves.json, all standardized-curve constants, the 256-bit key path and the real-curve selftest checks
    - the real-curve parts of the analysis fields, the headline (TOY_ONLY_NULL removed) and the criteria
    retained_as_text_only: >-
      specification resolution R9 and the held_extension block, and the held_extension block of H-PFDR-727bfc; neither
      contains a constant, and nothing in the approved scope, trial plan, queue or headline depends on them
    how_it_could_be_added: >-
      Only if the user admits it: a versioned protocol_amendment of EXP-PFDR-bb0d26, a new approval decision and a new
      preapproval probe.
  target_ids:
  - GOAL-PFDR-fd09e0
  - RQ-PFDR-ae2fba
  - IDEA-20261017-078074
  - IDEA-20261017-90d9c5
  - IDEA-20261017-bbc53e
  - IDEA-20261017-077f12
  - H-PFDR-727bfc
  - EXP-PFDR-bb0d26
  - TASK-20261022-726d76
  ranking:
    basis: >-
      AGENTS.md "ECC comes first" (PFDR is an ECC area; open ideas are designed, not shelved), the Coordinator ranking
      rule (expected information gain, cost, dependency risk, scientific value, exponent-targeting bias), the pairing
      rule of agents/coordinator.md (a conditional result is paired with a heuristic-validation experiment), and the
      engine write restriction NA-5. Only the proposals of RQ-PFDR-ae2fba were ranked.
    candidates:
    - idea: IDEA-20261017-078074
      rank: 1
      outcome: selected
      information_gain: >-
        Decision-changing in both directions. It is the obstruction-type lead: a null at the tested toy sizes closes
        label-describable log-GAP bases at those sizes (the unknown-sharing base of IDEA-20261017-bbc53e with kappa_eff
        = 2 c_0 and a label-defined membership test, the implicit-membership route of KN-OPEN-020); a confirmed excess
        would be a structural finding that opens it. It is the dual of the premise EXP-PFDR-ca5e01 measures
        (label-structured sets against the group law), so together they cover both sides of the sum-product dichotomy
        that bbc53e's delta-to-exponent translation consumes.
      cost: >-
        Implementation low and compute low (idea record); the design-session estimate is a few CPU-hours for the toy
        census. Needs no engine change: the statistic is label additions plus scalar multiples and uses only the
        vendored curve.py.
      dependency_risk: >-
        Low. Runs in a second lane within max_concurrent 2 and the focus-plan limit of two critical experiments; uses
        a seed block disjoint from every earlier PFDR experiment; independent of the outcome of EXP-PFDR-ca5e01.
      exponent_bias: >-
        It prices an exponent-relevant family (bbc53e tau never below 1/2 unless kappa exceeds U) and tests the one
        property that would make that family usable, rather than a logarithmic or constant refinement. It asserts no
        exponent.
      pairing: >-
        It is itself the heuristic-validation experiment for H1 of its idea at toy scale and pairs with
        EXP-PFDR-ca5e01 for the conditional result of bbc53e. A proof-of-concept implementation task is the launcher of
        this very package.
    - idea: IDEA-20261017-90d9c5
      rank: 2
      outcome: deferred
      reason: >-
        A memory-for-time position on the table family's own frontier: memory exponent h/(2h-1) to 1/(2h-1) at the
        same time exponent, dominated by Pollard rho in both time and memory (the idea's own dominated_by), priority
        low, implementation medium. It needs the engine's collision harvester, and NA-5 forbids write scope over the
        engine, so it cannot be implemented without a lifted restriction. Its predictions are positioned against the
        random-mapping control and the table harvest, not against a handle that could cross rho. It is deferred, not
        closed.
      revisit_condition: >-
        The engine write restriction is lifted or a harvester interface becomes available without an engine edit, or
        a lane of this goal yields a surviving structured cell that makes a memory-lean harvest of a representation-
        dependent family relevant.
    - idea: IDEA-20261017-bbc53e
      rank: not_ranked
      outcome: already_consumed
      reason: >-
        Referenced by H-PFDR-011a4b and by the EXP-PFDR-ca5e01 specification; it is a pricing translation consumed by
        the validation experiments, not a separately designable measurement.
    - idea: IDEA-20261017-077f12
      rank: not_ranked
      outcome: already_designed_approved_and_run
      reason: >-
        H-PFDR-011a4b, EXP-PFDR-ca5e01 and DEC-20261017-6fb3ce exist and six runs and the runbook session RBS-PFDR-ca5e01
        exist. No evidence record exists. This decision reads none of its results.
  rationale:
  - >-
    Selected the next justified candidate under the standing authorization and the ECC-first rule. IDEA-20261017-078074
    ranks above IDEA-20261017-90d9c5 on information gain (a scoped closure or a structural opening of one named family,
    against a memory trade that rho dominates), cost (low against medium), and the engine restriction (none against
    blocked). The top-level mechanical read was confirmed, not merely adopted.
  - >-
    The contract is a heuristic validation in the sense of docs/target-result-profile.md. It states H1 exactly, with
    quantifiers; pre-registers three predictions with sources before any run; reaches the relevant distribution by
    direct sampling at toy scale; derives the sample size from the smallest count to resolve (expected null total at
    least 3750 per cell); fixes the comparison metric and tail checks; and carries the controls the skill requires (a
    matched random null, a planted positive, null-vs-null calibration, disjoint seed blocks with replication, an exact
    representation identity, three prime sizes).
  - >-
    The toy reading is decidable on its own fields (O-NULL, O-STRUCT, O-MIXED, O-INVALID and the headline
    SUPPORT_SCOPED, FALSIFY_SCOPED, NOT_EVIDENCE, INCONCLUSIVE), and every outcome has a distinct pre-registered
    consequence in decision_impact; a null result is decidable as such, and no outcome can be read as a speedup or as
    a statement about the security of any curve.
  - >-
    Scope is held to the goal. The idea's real-curve prediction is not admitted (see scope_correction); the null of
    this experiment would close label-describable log-GAPs at the toy sizes only and says nothing about standardized
    curves, which stay untested.
  - >-
    The sibling's outcome was not consulted. Prediction provenance for P1, P-detect and P2 is out_of_sample with
    data_seen empty; a search of the experiment specifications and the hypothesis, evidence and decision records for
    the terms log-GAP, label-sum and label sumset found only this design.
  curve_range:
    seed_block: 8,000,000 to 8,999,999 reserved for EXP-PFDR-bb0d26
    sub_blocks: 'main 8,100,000 + c (c < 2000), replication 8,200,000 + c (c < 2000), selftest 8,900,000 + c'
    toy_bits: [20, 24, 28]
    disjoint_from: >-
      EXP-PFDR-ca5e01 (7,000,000 to 7,299,999 and selftest 9,900,000 to 9,900,100, read from its specification),
      EXP-PFDR-011cd0 (c = 10 to 2009 and 20000 to 21999), EXP-PFDR-0b3699 (c = 2010 to 9999), Part B (10000 to 19999),
      Part C EXP-PFDR-969aae (c = 40000 to 79999, taken from the top-level facts; not verified from the tree), and
      the master seeds 20260904 to 20260906 of the older PFDR specifications. A search of the PFDR specifications for
      seven-digit 8,xxx,xxx values found none.
  design_summary:
    hypothesis: H-PFDR-727bfc (status specified)
    experiment: EXP-PFDR-bb0d26 (review_required, frozen false, approved_by null, execution_authorized false)
    toy_part: >-
      45 cells = bits {20, 24, 28} x rank r {1,2,3} x label-set size n {256, 512, 1024, 2048, 4096}; per curve one
      rank-r log-GAP label set, 20 uniform null label sets, one planted label AP, exact pair-sum coincidence count C;
      kappa = S/M with a curve-cluster bootstrap interval and z against the measured null variance; flag at
      |kappa - 1| >= 0.10 and |z| > 4, replication on fresh curves at the same sign, |z| > 3 and |kappa - 1| >= 0.05;
      null-vs-null calibration gate sd in [0.75, 1.25] and |mean| <= 0.35 (45 cells, resolution R1).
    real_part: held for a user decision; not in the approved scope (scope_correction)
    trials: selftest, census-toy-main, analyze-main, census-toy-rep, analyze-final (five runs; RUN ids to be minted)
    engine_files: none added, none edited (NA-5); all new scripts under experiments/EXP-PFDR-bb0d26/implementation/
    ca5e01_files_read: >-
      specification.yaml, trial-plan.json, runbook.yaml, H-PFDR-011a4b.yaml and DEC-20261017-6fb3ce.yaml for format and
      ranges; the dispatch queue and lane file of BATCH-286bd3 for lane format; a directory listing of
      experiments/EXP-PFDR-ca5e01/ was returned by a file-name search, so the names (not the contents) of files under
      runs/, reports/ and runbook-sessions/ were seen. No content of runs/, reports/, runbook-sessions/, analysis,
      evidence or review of EXP-PFDR-ca5e01 was read, and the implementation sources were not opened.
  approval_requirements:
    note: >-
      Approval is a separate Coordinator act under the standing authorization of 2026-09-06, taken only when every item
      below holds on the committed tree (AGENTS.md "Approval is bounded by execution"). Nothing here is satisfied by
      this record.
    items:
    - id: AR-1
      text: >-
        TASK-20261022-726d76 completed: launcher, kernel, checker, fixtures, unit tests UT-1 to UT-12 passing, check.py
        spec-consistency exit 0, and the five RUN ids minted and substituted. The unit-test report is a readiness
        record, not evidence.
    - id: AR-2
      text: >-
        The freeze fills of the specification made (run ids, sha256 values, upstream commit, approval fields) with no
        change to any threshold, rule, cell, seed block or criterion; trial-plan.json written against the final
        specification bytes (approved_by DEC-20261022-f1efde, task_id TASK-20261022-32fe8b, queue under BATCH-8d6d84,
        five trials, no census-real).
    - id: AR-3
      text: >-
        tools/experiment_preapproval.py --packet reports approvable true for the exact final specification, trial plan,
        queue and executor handoff. Its four substantive conditions: (a) committed source and input hashes - every
        path in source_sha256, input_sha256 and the specification input_bindings has the same bytes at the pushed
        source_ref, and the draft specification and goal record are committed there; (b) complete supervisor and trial
        archive coverage - the executor task's artifact_paths contain every supervisor-generated file and declared
        trial artifact of the five runs, and the Coordinator ledger-archive task binds them in its read_scope with the
        executor task in its source_task_ids; (c) an execution route - runbook with a committed LINT OK receipt (or an
        implementation-tier route with a stated reason); (d) a lawful goal lane - lane BATCH-8d6d84 open, its
        dispatch_queue_path equal to the queue path, committed at the source_ref, with at most max_concurrent 2 open
        lanes of the goal. The probe also needs a pushed origin source_ref, an approved/frozen/authorized preview
        specification bound to the reserved approval decision, distinct on_positive and on_negative decision impacts,
        and the exact trial-plan and approval binding embedded in the queue task and the handoff.
    - id: AR-4
      text: >-
        Runbook compiled by the experiment-director (docs/runbook-execution.md, docs/model-tiers.md) at
        experiments/EXP-PFDR-bb0d26/runbook.yaml with session RBS-PFDR-bb0d26, tools/runbook.py lint printing LINT OK and
        the receipt committed; the approval decision carries runbook_sha256.
    - id: AR-5
      text: >-
        Executor-mechanical task card written (TASK-20261022-32fe8b: inference.policy executor-mechanical, write_scope
        including experiments/EXP-PFDR-bb0d26/runs/, runbook-sessions/ and reports/, the exact execution binding, dispatch
        preconditions) and tools/task_card.py lint printing CARD OK; the snapshot archive card TASK-20261022-b6532d and the
        ledger archive card TASK-20261022-207893 written, each naming exactly one archival task.
    - id: AR-6
      text: >-
        After the approval decision and the snapshot archive are committed and pushed and the PR is open or refreshed,
        python3 tools/newest_experiments.py --experiment EXP-PFDR-bb0d26 --json reports execution_state ready before any
        dispatch; a mismatch stops dispatch and requires an additive correction.
  reserved_ids:
    approval_decision: DEC-20261022-f1efde
    batch: BATCH-8d6d84
    tasks:
      implementation: TASK-20261022-726d76
      snapshot_archive_of_package: TASK-20261022-b6532d
      executor_mechanical_runbook: TASK-20261022-32fe8b
      ledger_archive_of_run_package: TASK-20261022-207893
      spare: TASK-20261022-53a695
    runs_to_mint: >-
      five RUN-PFDR-<6hex> ids for the trials selftest, census-toy-main, analyze-main, census-toy-rep, analyze-final; the
      draft specification carries the tokens <RUN:trial_id> until they are minted
  official_transitions:
    hypothesis_id: H-PFDR-727bfc
    hypothesis_prior_record: none; specified directly from the selected idea
    hypothesis_initial_status: specified
    experiment_id: EXP-PFDR-bb0d26
    experiment_initial_status: review_required
    experiment_approved: false
    idea_status_changed: false
    goal_status_changed: false
    goal_record_edited: false
  evidence_refs: []
  citations:
  - {source: ledger/proposals/IDEA-20261017-078074.yaml, provenance: internal, verified_by: coordinator}
  - {source: ledger/proposals/IDEA-20261017-078074.notes.md, provenance: internal, verified_by: coordinator}
  - {source: ledger/proposals/IDEA-20261017-90d9c5.yaml, provenance: internal, verified_by: coordinator}
  - {source: ledger/decisions/DEC-20261017-6fb3ce.yaml, provenance: internal, verified_by: coordinator}
  - {source: experiments/EXP-PFDR-ca5e01/specification.yaml, provenance: internal, verified_by: coordinator}
  - {source: tools/experiment_preapproval.py, provenance: internal, verified_by: coordinator}
  limitations:
  - >-
    Toy scale only (generated curves of 20 to 28 bits, n up to 4096); no standardized or deployed curve is touched and
    nothing is said about any key, target or the security of any curve. The idea's real-curve prediction stays untested.
  - >-
    The sum-product background (Ahmadi-Shparlinski 2010) and the equidistribution results are recalled pointers; no
    tested cell has a proven kappa = 1 anchor, and a null never confirms the asymptotic random-set statement.
  - >-
    The calibration gate can fail a correctly calibrated run about 3% of the time at 45 powered cells (R1); such a
    failure is NOT_EVIDENCE, never a reading of H1.
  - >-
    Compute figures are design-session estimates, unmeasured; the implementation task may record one synthetic null-only
    resource probe on the selftest block only.
  - >-
    The ranking considered only the four open proposals of RQ-PFDR-ae2fba; proposals of other questions were not ranked.
    IDEA-20261017-90d9c5 is deferred behind the engine restriction, not rejected.
  next_actions:
  - id: NA-1
    owner: top-level session
    text: >-
      Run TASK-20261022-726d76 (implementation package) under its constraints, including zero census runs, no main or
      replication curve and no standardized-curve content; mint the five RUN ids with tools/allocate_id.py and
      substitute them for the tokens; return the unit-test report, the spec-consistency output and the sha256 values for
      the freeze fills.
  - id: NA-2
    owner: top-level session
    text: >-
      Before running the preapproval probe, push a plain staging commit (not an archive) of the draft specification, the
      hypothesis, this decision, the handoff, the implementation sources, the trial plan inputs, the lane file and any
      goal-record edit, so source_ref origin/<branch> carries the same bytes; leave ledger/goals/GOAL-PFDR-fd09e0/goal.yaml
      with no uncommitted edit.
  - id: NA-3
    owner: top-level session
    text: >-
      Open lane BATCH-8d6d84 with tools/goal_lanes.py open-lane (queue coordination/goals/GOAL-PFDR-fd09e0/batches/
      BATCH-8d6d84/dispatch_queue.json) alongside BATCH-286bd3 within max_concurrent 2; the additive goal-head entry and
      checkpoint shard belong to the snapshot archive, preserving exactly one next action.
  - id: NA-4
    owner: coordinator
    text: >-
      At approval write the cards TASK-20261022-b6532d (snapshot archive of the package), TASK-20261022-32fe8b
      (executor-mechanical runbook task) and TASK-20261022-207893 (ledger archive of the run package), the queue, and
      DEC-20261022-f1efde, after AR-1 to AR-5 hold; not before.
  - id: NA-5
    owner: coordinator
    text: >-
      After the run package is archived, open /review-evidence for EXP-PFDR-bb0d26 with a review_plan (blind recount of
      S, M and kappa from the job records, re-derivation of every class and the headline, a kernel spot-check); fill
      knowledge_promotion and the obstruction block with its resource_check on any closure.
  - id: NA-6
    owner: coordinator
    text: >-
      Revisit IDEA-20261017-90d9c5 when its revisit condition holds; until then no design for it.
  - id: NA-7
    owner: top-level session
    text: >-
      Request the user decision on admitting the held real-curve extension. Until the user admits it, no amendment, trial
      or fixture for it is written.
  knowledge_promotion:
    promoted: []
    not_warranted: Selection and specification only; no run, no evidence.
  official_effect_until_committed_pushed_reviewable: none
