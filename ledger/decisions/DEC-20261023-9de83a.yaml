  successor_weighing:
    redteam_proposal: >-
      Run only the exact clauses on class-number-one CM curves with
      33 <= bits(p) <= 96. Take the orders from the CM norm form. Add C1 (record
      r and d; residue tests) and C4 (a non-canonical lift on CM curves). Drop the
      exact-hit z-test.
    coordinator_reading: >-
      I accept C1, C2 and C4. As a priority I decline the medium-tier move of the
      exact clauses, for four reasons.
      (a) The exact clauses are consequences of stated derivations (Serre-Tate
      splitting, Hom(Z/n, Z_p) = 0, Smart's theorem), and the mechanism does not
      depend on p. A 33 to 96-bit run would relabel coverage, not test a new
      regime.
      (b) The only clause with open empirical content is the random-model rate,
      and partial leakage would be its attack-relevant failure. C1's residue
      tests have power about 1/sqrt(n) at any p, so they need no medium-tier
      field.
      (c) The roadmap is biased toward exponent-targeting mechanisms. A leak of
      bits of d through the tau-ratio is the one reading here that could feed a
      hidden-number or lattice attack. A medium-tier label on theorem-checking
      identities moves nothing.
      (d) The lane-1 drivers count points in O(p) (harness/toycurve.py
      EllipticCurve.order, lines 80-81). This answers the red team's open check:
      any run above toy needs a new driver version.
      A medium-tier arm on CM curves with orders from the CM norm form may ride
      along in the successor if the new driver supports it at negligible cost.
      It is not a reason to schedule work.
  next_actions:
    - >-
      (1) Ranked first; this is the goal's next action. Design, through
      /design-experiment from a refined hypothesis, a heuristic-validation
      contract for a NUMBERED heuristic. HEUR (draft): for the hensel_random,
      naive and Teichmuller sections on the tested lifts, the Smart (tau-)
      ratio r is uniform on F_p and independent of d. The contract should:
      - use a new driver version that records r and d per row (red team C1);
      - pre-register the residue tests ((r - d) mod p uniform; chi-square of r
        against d on residues mod small m; near-miss fraction
        |r - d|_p < p/100 against 2%), with tail checks;
      - add a structured-d stratum (d in [2, 64], d = 2^k, d = p - small;
        red team C2);
      - add a CM non-canonical-lift torsion arm (red team C4);
      - run the exhaustive census of the 84 anomalous primes in [10^4, 10^5]
        (red team C3);
      - state the (curve, draw) unit of analysis (red team C5).
      Toy tier suffices for power. Not approved here; approval waits for a
      runnable frozen contract.
    - >-
      (2) The separate review tasks for H-CZLIFT-889c9d and H-CZLIFT-6d4ed1
      should cite EV-CZLIFT-e9a7cf clause_readings:
      - no medium tier;
      - the 1/p clauses are inconclusive from this run;
      - the torsion replication is same-code;
      - the arm difference was not evaluated.
      The red team's coordinator_must_not_claim list applies to them.
    - >-
      (3) Optional, low priority: an independent implementation of the torsion
      section, to turn the same-code torsion replication into an independent
      one. Fold it into (1) if the new driver is written by a different hand.
    - >-
      (4) Deferred, not scheduled: the red team's medium-tier exact-clause
      successor (33 to 96-bit CM curves), for the reasons in successor_weighing.
    - >-
      (5) Session: run plot.py and compile report.typ in
      experiments/EXP-CZLIFT-f5e06c/reports/review-DEC-20261023-9de83a/. Write
      experiments/EXP-CZLIFT-f5e06c/analysis.md from the text the Coordinator
      returned (the subagent harness blocks it from writing .md files). Then
      run the ledger archive TASK-20261023-4d7449 alone with exact paths,
      verify it, push, open or refresh the PR naming EV-CZLIFT-e9a7cf and
      DEC-20261023-9de83a, and checkpoint GOAL-CZLIFT-1516d5 with next action
      (1).
