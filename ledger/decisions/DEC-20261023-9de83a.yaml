  limitations:
    - >-
      Toy tier only (fields of at most 17 bits). No transfer to 33 to 96-bit
      fields or to a deployed curve is argued.
    - >-
      The torsion-section identities are same-code only. Independent code
      reached the anomalous valuations and sampled attack outcomes, not the
      torsion section.
    - >-
      The anomalous arm is a sample (41 of 84 curves), not a census. For
      e = 3, lift-distance levels 4 and 5 cannot occur, so the 2e = 6 threshold
      is not discriminated.
    - >-
      Exact-hit counting cannot detect partial leakage of d. Rows record no d,
      ratio or point.
    - >-
      The "1/p rate" is an unnumbered random-model assumption in
      H-CZLIFT-889c9d, H-CZLIFT-6d4ed1 and H-CZLIFT-bd2017 (red team H1/H2).
    - >-
      The torsion arm contrast confounds lift type with curve type. The arm
      difference was not evaluated.
    - No memory figure; no pinned package versions.
