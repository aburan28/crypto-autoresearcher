# DEC-20261023-9de83a: evidence review of EXP-CZLIFT-f5e06c (RUN-CZLIFT-032a92,
# RUN-CZLIFT-6447f0) for H-CZLIFT-bd2017.
# Decision: refine. The exact clauses replicate at toy tier, the 1/p clauses are
# inconclusive, and the toy -> medium tier move is not met because p < 2^17 is
# toy. H-CZLIFT-bd2017 moves approved -> analyzed. No tier moves for
# H-CZLIFT-889c9d or H-CZLIFT-6d4ed1.
coordinator_decision:
  id: DEC-20261023-9de83a
  recorded_at: '2026-10-23'
  decided_at: '2026-10-23'
  decided_by: coordinator
  question_ids: [RQ-CZLIFT-b9f765]
  goal_id: GOAL-CZLIFT-1516d5
  archived_by: TASK-20261023-4d7449
  mode: evidence_review
  decision: refine
  decision_label: >-
    Refine H-CZLIFT-bd2017 (approved -> analyzed). The exact clauses replicate at
    toy tier. The 1/p clauses are inconclusive at this design's power. The tier
    clause is not met as posed. The surviving content is the toy-tier scoped
    claim below. The open empirical content (whether non-canonical sections leak
    d) moves to a numbered-heuristic validation successor.
  target_ids:
    - H-CZLIFT-bd2017
    - EXP-CZLIFT-f5e06c
    - EV-CZLIFT-e9a7cf
    - RUN-CZLIFT-032a92
    - RUN-CZLIFT-6447f0
    - RQ-CZLIFT-b9f765
    - IDEA-20261009-93b29f
  context: >-
    EXP-CZLIFT-f5e06c re-ran the lane-1 measurement drivers of EXP-CZLIFT-17b7eb
    and EXP-CZLIFT-ae0a13 on sampled curves with 10^4 <= p <= 10^5: 24 CM
    anomalous, 16 CM canonical and 8 random curves per seed, two seeds. Both
    runs were archived (TASK-20261009-4ac56e) and recorded as observations by
    DEC-20261009-44c288. Independent validation TASK-20261022-65e6c1
    (VAL-20261022-1d018a) passed on J1, J2, J3 and PTM-1. Red team
    TASK-20261023-e5df50 (RT-20261023-fbf42f) found that R1 breaks (tier move,
    same-code torsion replication), that R2 breaks (the 1/p tests have no power)
    and that PTM-1 holds.
  validity: >-
    Valid and complete: 2 of 2 planned runs, completed_valid, output_validated,
    seeds as frozen, 0 dropped rows, manifest metrics equal to raw-result (141/141
    per seed), byte-identical replay, blind re-derivation in agreement, all
    controls present and behaving (EV-CZLIFT-e9a7cf validity_check). The tier
    mislabel in the spec and manifests is a labeling defect. It does not
    invalidate any measurement.
  status_transitions:
    - {id: H-CZLIFT-bd2017, from: approved, to: analyzed}
  status_transitions_note: >-
    EXP-CZLIFT-f5e06c is analyzed by this review. Its specification is frozen and
    is not edited. H-CZLIFT-889c9d and H-CZLIFT-6d4ed1 are not moved here; their
    separate review tasks decide them.
  rationale:
    - >-
      The exact clauses held on every row of both seeds on new curves at a wider
      p range:
      - the j-distance rule (0 disagreements in 164 curve x lift-class cells);
      - Smart's recovery on pert_p lifts (1152/1152);
      - the five torsion rates and the tau-ratio identity (576/576 pairs).
      The valuations have independent-code corroboration, and the torsion
      identities have same-code evidence. That is a clean replication, so the
      strength for these clauses is replicated (EV-CZLIFT-e9a7cf
      clause_readings A1, A2, T1, T2, T5).
    - >-
      The 1/p clauses carry no evidence. P(all zero | 1/p) = 0.850 against
      P(all zero | 0) = 1, a likelihood ratio of 0.85. The recorded z equals the
      design-only -sqrt(sum 1/p_i) to within 1.2e-15. One chance success would
      have broken the bound on seed 20261010. The frozen criterion was met, and
      that observation is preserved, but it is not read as a finding that rates
      "stay at 1/p". The supportable content is the upper bounds: 8.66e-4 per
      row (anomalous, both seeds) and 5.19e-3 per row per torsion section (both
      seeds), at 95%. I adopt red team R2 here.
    - >-
      I correct one red-team figure. The common-rate bound over all three
      torsion sections (1.73e-3, n = 1728) assumes independent rows. The
      hash-bound torsion driver (experiments/EXP-CZLIFT-ae0a13/implementation/run.py,
      lines 80-118) reuses each (P, d) draw across the three sections, so only
      the per-section bounds stand. On the anomalous arm
      (experiments/EXP-CZLIFT-17b7eb/implementation/run.py, lines 79-86) each
      row draws its own (P, d), so the row bounds stand there. This settles red
      team control C5 for the recorded runs. It also means the anomalous bound
      excludes a p^-1/2 rate at every tested p, while the torsion per-section
      bound alone does not.
    - >-
      The tier clause cannot be met by this design. The largest field is
      p = 97813 < 2^17, which the mechanical rule in
      docs/claims-and-verification.md makes toy, and the spec's "medium" label
      is a mislabel. This is a defect of the hypothesis as posed, not a
      measurement against the mathematics, so it does not warrant weaken. No
      adverse transition is taken, so no refutation artifact is needed. I adopt
      red team R1.
    - >-
      Why refine rather than support or inconclusive:
      - support would endorse a statement whose headline is a tier move the
        data cannot carry, and whose 1/p clause is untested;
      - inconclusive would discard a clean exact replication.
      Refine records the surviving scoped claim and sends the one clause with
      empirical content, the random-model rate, to a design that can measure
      it.
    - >-
      This decision does not adopt two readings in DEC-20261009-44c288 (an
      observation record, which stays unchanged): that "success rates of the
      non-canonical sections stay at 1/p", and its claim_boundary "medium
      tier". Both are superseded by EV-CZLIFT-e9a7cf.
  scoped_claim: >-
    At toy tier, the largest field being F_p with p = 97813 < 2^17. The data are
    two clean runs (RUN-CZLIFT-032a92 and RUN-CZLIFT-6447f0) of the unmodified
    lane-1 drivers over a new sampler with 10^4 <= p <= 10^5.
    Anomalous arm: 41 distinct class-number-one CM anomalous curves (D in {-3,
    -11, -19, -43, -67, -163}) at precision p^8. The j-distance degeneracy rule
    agreed on all 4608 rows (164 curve x lift-class cells; lift distances {1, 2,
    >=8} at e = 1 and {3, 6, >=8} at e = 3). Smart's ratio equalled d on all
    1152 pert_p rows, and every canonical, isomorphic and pert_p2 row
    degenerated.
    Torsion arm: 48 distinct odd-order curves (n in [109, 93001]) at precision
    p^4. The five torsion-section rates and the tau-ratio identity held on all
    576 pairs (same-code evidence).
    Non-canonical recoveries succeeded 0 times in 3456 anomalous-degenerate rows
    and 0 times in 576 rows per torsion section. The 95% one-sided bounds are
    8.7e-4 and 5.2e-3 per row; these do not test the 1/p rate. No claim is made
    about 33 to 96-bit fields, a deployed curve, or any attack cost.
