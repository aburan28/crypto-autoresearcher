      H-PSEUDO as an oracle-augmented GGM separation — unifies the comparison-oracle with
      the ECCG security question. Dispatch mathematical analysis.
    - IDEA-20260805-58b638 (doubling oracle closure): LOW PRIORITY (expected closure).
      The y-sign drops out; ord_N(2) = Ω(sqrt(N)) generically. Quick closure.

