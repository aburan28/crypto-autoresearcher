coordinator_decision:
  id: DEC-20260905-29416d
  recorded_at: '2026-09-05'
  context: >-
    Disposition of BATCH-2cca27, the separately approved fresh independent
    integrity review of the committed GOAL-SATIC-c49b77 launch archives
    (approved by DEC-20260905-ed0e18 per the goal's recorded next_action).
    The Validator task TASK-20260905-5681fc ended as a durable policy
    refusal before any check, not as a review. This decision closes the
    attempt, records the refusal and its proven cause, keeps IMP-1 open,
    records IMP-3, and leaves the goal active with a concrete re-dispatch
    condition. It establishes no receipt-integrity verdict in either
    direction.
  decision: revise
  decision_label: review_refused_policy_unserviceable_revise_dispatch
  decided_by: coordinator
  target_ids:
    - GOAL-SATIC-c49b77
    - BATCH-2cca27
    - TASK-20260905-5681fc
    - TASK-20260905-46f38c
  rationale:
    - >-
      The review never ran. The serving session (vllm/qwen3.8-27b, local
      backend, the only serving backend in this OpenCode runtime) cannot
      honour review-adversarial at xhigh requested effort: the policy is
      unbound on the local backend (model null, provenance unbound; local
      ceiling high) and its only table resolution is
      anthropic:claude-opus-5 at xhigh, which is uncredentialed in this
      environment (ANTHROPIC_API_KEY unset; OPENAI_API_KEY unset), verified
      by adapter resolution in the lane worktree before disposition. No
      fallback or degradation was granted, so executing the checks would
      have been a silent downgrade; the reviewer correctly refused before
      check 1 per the contract's own mandated path. The refusal (start.json
      within the 120 s window, report.json with verdict incomplete, all
      required fields, known-bad control explicitly unperformed) is
      snapshot-archived and verified at fe5cc6a0e.
    - >-
      This failure is infrastructural, not mathematical (core rule 3) and
      not evidence about the launch-archive bindings: nothing about the
      five bindings is established in either direction by this batch. The
      known-bad control was not run; its pass/fail is not established.
      IMP-1 (missing durable independent review) therefore stays open, and
      IMP-3 is recorded against this review path: re-dispatch is approved
      only from a session whose backend serves review-adversarial at xhigh
      with no fallback or degradation. Repeat dispatch from a local-vllm
      session reproduces the recorded refusal for the proven reason above
      and is forbidden make-work, not persistence.
    - >-
      The opening scaffold (DEC-20260905-ed0e18, frozen contract, queue,
      handoffs, lane registration) was committed and verified at 214a82b49
      before the worker ran; the review artifacts were snapshot-archived
      and verified at fe5cc6a0e; the queue archive blocks for 84e7b4 and
      46f38c are bound. The approval, contract, and task design stand for
      re-use; what must be revised is the serving environment, not the
      review plan -- hence revise, not reject or inconclusive.
  evidence_refs:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-2cca27/tasks/TASK-20260905-5681fc/start.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-2cca27/tasks/TASK-20260905-5681fc/report.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-2cca27/archives/TASK-20260905-46f38c/snapshot.md
    - ledger/decisions/DEC-20260905-ed0e18.yaml
  limitations:
    - >-
      Provenance: internal. Adapter resolution and credential checks were
      run by this Coordinator in the lane worktree; the credential
      non-existence claims are about this environment only and may lapse
      if the environment changes (that is exactly IMP-3's recheck).
    - >-
      Whether the refusal generalizes beyond this runtime (other OpenCode
      sessions, other backends) is not established by this session; the
      Validator's own report records the same bound. The binding table
      resolution to anthropic:claude-opus-5 was not probe-verified
      (no credential to probe with).
    - >-
      This disposition promotes no research finding, satisfies no
      completion criterion, and moves no hypothesis status.
  next_actions:
    - >-
      Re-dispatch the frozen integrity review (same contract
      contracts/integrity-review.json, same frozen source head 8f80aec5d)
      only from a session whose backend serves review-adversarial at xhigh
      with no fallback or degradation. Recheck before dispatch:
      `python3 -m orchestration.adapter resolve --policy review-adversarial
      --independent-session` reports a served binding at xhigh from a
      credentialed backend, and the serving session is independent of the
      producer. Do not re-dispatch from a local-vllm session.
    - >-
      Resource handling (IMP-2) remains out of scope until the independent
      review disposition lands, per the goal's recorded ordering.
  knowledge_promotion:
    promoted: []
    not_warranted: A refused review establishes no scientific finding; the durable product is an infrastructure impediment, not knowledge.
