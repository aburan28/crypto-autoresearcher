      MOMENT AN IDENTIFIER ARRIVES: a mutation-testing (positive) control's own predicted-effect-
      size formula and its own detection/pass-fail threshold can be structurally, mathematically
      correlated -- literally two different functionals of the SAME small archived sample -- in a
      way that makes near-certain "detection" of the injected defect class UNINFORMATIVE about the
      instrument's genuine sensitivity, EVEN WHEN the injected defect is precisely described, the
      prediction is computed honestly in advance, the mechanical diff is confirmed exactly correct
      by two independent extractors, and the specific causal mechanism is confirmed by direct,
      from-scratch re-computation ruling out an artifact explanation. This is a GENERAL
      METHODOLOGICAL LESSON about designing positive/mutation-testing controls for ANY small-
      sample instrument-calibration design, not specific to this goal's lattice content, hkz, or
      ML-KEM -- the identical structural failure mode (a control's own construction correlating
      its predicted signal with its own pass/fail criterion) can arise in any instrument-
      calibration test built on a small, fixed reference sample.
      GROUNDS FOR PROMOTION, assessed against this goal's own established bar (DEC-20260813-894568
      section knowledge_promotion's grounds for KN-FIND-d29ece, extended here rather than merely
      copied): (1) REPLICATED WITHIN A SINGLE BATCH -- reached independently by both reviews,
