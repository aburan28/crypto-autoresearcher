  - EV-MLKEM-f65f00
  - KN-FIND-d29ece
  - KN-FIND-7ffdd0
  - H-MLKEM-11aabf
  - H-MLKEM-232843
  - H-MLKEM-34e22e
  - RQ-MLKEM-001

  # ==================================================================
  # 1. VALIDITY BEFORE INTERPRETATION
  # ==================================================================
  run_set_validity:
    ruling: >-
      THE RUN SET IS VALID AND ADMISSIBLE AS EVIDENCE FOR THE PARTS NAMED admissible_now IN
      EV-MLKEM-552c58. The Validator's own verdict is `passed`, checked before interpretation, not
      taken on that word alone; the Red Team independently confirms the mechanical arithmetic and
      states plainly it is not disputing the branch call.
    expected_run_count: >-
      ONE lead producer, ONE measurement invocation (measure_hkz_mutation6.py, 8.144 s of a
      3600 s hard cap). Both reviews independently confirm no invocation is omitted, no cell was
      NOT COMPUTED (2/2 covered), and no reduction above d=40 occurred anywhere.
    schema_complete_manifests: >-
      CONFIRMED BY THE VALIDATOR (reviewed_snapshot.change_set_equality) AND INDEPENDENTLY BY THE
      RED TEAM ("Commit verification" section). The snapshot commit
      (e2ad28b3ffe90b2b5390ca83f4e2ba1d431399fd, 9 declared paths) passes change-set equality at
      9/9, 0 extra, 0 missing, verified by BOTH reviews independently running git plumbing
      themselves, including recomputing all 8 producer-artifact path hashes from the git object
      database against the receipt's own path_sha256 map.
    seed_integrity: >-
      CONFIRMED BY BOTH REVIEWS. The mechanical diff (independently re-extracted from scratch by
      two structurally different extractors -- Validator: ast-based; Red Team: regex-based)
      confirms exactly one functional line differs between the mutant and the frozen reference,
      and no other source of divergence exists. fpylll's LLL/BKZ/Enumeration are deterministic
      given the input basis.
    raw_summary_agreement: >-
      CONFIRMED, AT BOTH COVERED CELLS. Both reviews independently re-derived D_route_mut/
      VERDICT_mut directly from results_hkz_mutation6.json's own raw route_p_values/
      route_mut_values arrays (Validator RECOMP-2/RECOMP-3; Red Team "Standard checks" item 1) and
      confirm exact agreement with the lead's own reported values. The write-up's summary table
      matches the raw JSON exactly at both cells.
    control_comparability: >-
      CONFIRMED, AND STRENGTHENED BY BOTH REVIEWS' OWN BUILT CONTROLS RULING OUT AN
      FPYLLL-CONVERGENCE-ARTIFACT EXPLANATION. The Validator performed a direct, independent
      fpylll re-run of one basis at one cell, matching the lead's reported value bit-for-bit
      (RECOMP-4-DIRECT-REPLICATION). The Red Team independently called the FROZEN, UNMUTATED route
      on the shifted index at EVERY matched basis at BOTH cells, matching bit-exact ("Target 4"),
      and separately re-ran the lead's own unmodified script fresh to confirm field-for-field
      reproducibility. Both controls converge independently on confirming the specific,
      mechanically predicted mechanism, not merely "some large deviation."
    infrastructure_separation: >-
      No infrastructure failure invalidates any part of THIS committed batch's evidence.
      fpylll/cysignals availability is confirmed live and independently by the lead, the
      Validator, and the Red Team, in three separate sessions. THE ONE INFRASTRUCTURE EVENT OF
      THIS BATCH -- the loss of the first review dispatch's output to an execution-environment
      reset before commit -- is recorded plainly per AGENTS.md rule 5 as infrastructure signal
      only; it destroyed no evidence that exists anywhere in the committed record (the lost
      reviews were never committed and carry no surviving content), and the redispatched reviews
      cited throughout this decision are genuine, complete, independently-produced reviews of the
      one committed snapshot, not degraded substitutes.

  # ==================================================================
  # ITEM 1 -- THE TERMINATION BRANCH AND THE CORRECTED CITABLE WORDING
  # ==================================================================
  ruling_1_termination_branch_and_corrected_wording: >-
    T-MUTCTRL-DETECTED FIRED CORRECTLY AND MECHANICALLY. Both independent reviews confirm this by
    re-deriving it from the raw route_p_values/route_mut_values arrays with no producer import:
    COVERED=2/2, both cells VERDICT_mut = "DOES NOT EXCEED" (D_route_mut 0.06658934890771118 at
    hkz/L7_b5, 0.00948000985335451 at hkz/L11_b30, against s_c^fib 0.023887966155964283 and
    0.003818306775026579), matching the frozen prediction bit-exact and no -PARTIAL suffix
    warranted. NEITHER REVIEW DISPUTES THE BRANCH CALL; the Red Team states this explicitly
    ("This is not a rejection of the branch call"). Both reviews additionally built controls
    (Validator: an independent from-scratch fpylll recomputation; Red Team: an independent call of
    the frozen, unmutated route on the shifted index at every matched basis) that DIRECTLY RULE
    OUT an fpylll-convergence-artifact explanation for the detection, confirming the specific
    predicted mechanism (route_mut[i] genuinely computes slot (i+1) mod 8's true HKZ profile) held
    to the same ~2^-49 floor this lineage established for genuine convergence, not merely "some
    large deviation." THE CORRECTED, NARROWED CITABLE WORDING -- required because both reviews
    independently found PREREG-6 2.6's own default license text overstates what the measurement
    establishes -- is frozen in EV-MLKEM-552c58.mutctrl_corrected_citable_wording and MUST travel
    with any future citation of this discharge. I adapted it directly from the Validator's own
    CTRL-2-NULL-OBJECT-FINDING and the Red Team's own narrowest_supported_statement, verified
    against both reports' cited probes, rather than inventing new phrasing -- matching this goal's
    own established convention (EV-MLKEM-f65f00.hkz_discharge_corrected_citable_wording used the
    identical method one batch back). This correction is NOT optional: BOTH REVIEWS INDEPENDENTLY
    REQUIRED IT, VIA GENUINELY DIFFERENT METHODS -- the Validator's exhaustive check of all 7
    possible cyclic shifts against already-archived data, and the Red Team's 200,000-trial-per-
    distribution Monte Carlo null-object control across 3 distributions with zero lattice content
    -- reached WITHIN THIS SINGLE BATCH, working blind to each other's write scope, and the
    convergence of two structurally unrelated methods is what makes this finding ACTIONABLE
    rather than merely suggestive.

  # ==================================================================
  # ITEM 2 -- PREREG-6 2.8'S FORWARD BOUNDARY
  # ==================================================================
  ruling_2_forward_boundary: >-
    PREREG-6 2.6's declared forward boundary, read literally, bars only (a) a further attempt at
    the SAME defect class (any basis-index swap/seed-shift) (b) at these SAME two cells, requiring
    a NEW, separately-commissioned Coordinator decision for a genuinely different defect class
    rather than treating it as an automatic successor. THE QUESTION POSED: given both reviews now
    show the ENTIRE seed-index/basis-swap defect class is structurally incapable of testing the
    mechanism's actual sensitivity boundary at ANY of the 6 archived cells -- independent of which
    cell is chosen, per the Red Team's own MODERATE objection and the null-object diagnostic --
    does this justify commissioning a genuinely different-in-kind mutation-testing design (the
    reviews' own proposed continuously-parameterized, sub-threshold-scale defect, e.g. a small,
    swept epsilon perturbation to one or more matrix entries, rather than a full basis
    substitution) as a different question not barred by PREREG-6 2.8? RULED YES, ON THE MERITS,
    REASONED THROUGH RATHER THAN ASSUMED: (i) the boundary's own text explicitly carves out a
    genuinely different defect class as a NEW question, not a forbidden one -- it requires a fresh
    Coordinator decision, which this record supplies; (ii) the proposed epsilon-sweep construction
    is genuinely different in kind, not merely in magnitude, from the tested defect: its predicted
    effect size is NOT, by construction, tied to s_c^fib the way a full basis substitution's is
    (a small perturbation to one matrix entry does not reduce to "pick a different one of the 8
    already-archived basis values," so its predicted magnitude is not automatically a functional
    of the same 8-element array the threshold is computed from); (iii) it is the only construction
    either review or this record can name that could actually locate the true detection/
    non-detection crossover empirically, which is the decisive, still-unmet need KN-FIND-d29ece
    named. THIS RULING LICENSES THE DESIGN IN PRINCIPLE. WHETHER IT IS THIS GOAL'S NEXT DISPATCHED
    BATCH IS A SEPARATE, PORTFOLIO-LEVEL QUESTION, RULED IN ITEM 7 BELOW -- licensing a design is
    not the same decision as prioritizing it above every other open lane in this goal, and I do
    not conflate the two. A same-class attempt at a different archived cell (e.g. hkz/L11_b10) IS
    NOT separately barred by the boundary's literal text, but is judged, on the same merits, NOT
    worth commissioning: it would very likely also read DETECTED (every archived cell's real ratio
    sits inside the same null-object band) and would teach nothing this batch has not already
    taught.

  # ==================================================================
  # ITEM 3 -- KN-FIND-d29ece'S OPEN QUESTION STATUS
  # ==================================================================
  ruling_3_open_question_status: >-
    RULED PRECISELY, NOT LET TO READ AS MORE INFORMATIVE THAN THE REVIEWS SHOW. KN-FIND-d29ece
    named as its own open question whether a defect shared at the fpylll-enumeration-kernel level,
    or in the routes' common definitional/basis-construction code, actually exists, and named a
    mutation-testing control as "the decisive further check" and "the cheapest available check
    that closes this gap." THIS BATCH DOES NOT CLOSE THAT QUESTION, AND DOES NOT MEANINGFULLY
    NARROW IT IN THE SENSE THAT MATTERS -- full reasoning in
    EV-MLKEM-552c58.mutctrl_open_question_ruling, restated here: the defect class this batch's own
    frozen design was restricted to (a full basis-index swap, chosen specifically because its
    predicted effect was computable exactly in advance) turns out, per both reviews' convergent
    finding, to have been computable exactly in advance PRECISELY BECAUSE it is a near-tautological
    function of the SAME statistic that defines the pass/fail threshold -- which is exactly why it
    cannot inform the sensitivity question near the boundary that matters. Genuine (unmutated)
    agreement sits ~13-14 orders of magnitude below s_c^fib; this batch's injected defect sits
    ~2.5-2.8x above it; nothing in this defect class, at any archived cell, can land in between.
    WHAT WAS GENUINELY LEARNED, STATED WITHOUT INFLATION: (i) the D_route mechanism is not
    fixed-by-construction to always report EXCEEDS -- it has now been POSITIVELY exercised against
    a known, injected defect for the first time in this campaign, and correctly flagged it; (ii)
    fpylll converges reliably on freshly-drawn matrices at this toy scale. WHAT REMAINS EXACTLY AS
    OPEN AS BEFORE THIS BATCH RAN: whether D_route has meaningful sensitivity to a SUBTLE
    shared-code defect -- the kind KN-FIND-d29ece was actually concerned about. THE HONEST READING:
    "the cheapest available check" turned out to be cheap because it was structurally guaranteed to
    succeed, not because it was informative about the mechanism's actual power -- itself a genuine,
    durable negative-methodological finding (see knowledge_promotion below), but not a discharge,
    partial or otherwise, of KN-FIND-d29ece's own named open question.

  # ==================================================================
  # ITEM 4 -- THE FALSE CELL-SELECTION RATIONALE
  # ==================================================================
  ruling_4_cell_selection_correction: >-
    STATED PLAINLY, AS A FACTUAL CORRECTION THE COMMITTED RECORD OWES, NOT A PREFERENCE, matching
    the convention DEC-20260813-894568 ruling_4 used for the "REUSED IDENTICALLY" correction one
    batch back. PREREG-6 2.1 states the two tested cells were chosen to "bracket ... the tightest
    and a looser predicted signal-to-s_c^fib ratio among the 6 [archived] cells, so the test is
    not accidentally calibrated to its easiest case alone." This is checkably false, independently
    confirmed by BOTH reviews via direct arithmetic on already-archived data: hkz/L7_b5 (tested) is
    the single LOOSEST of the archived 6 hkz cells (ratio 2.788x); hkz/L11_b10 (never tested) is
    the genuinely TIGHTEST (2.287x). Full per-cell table and adoption of the correction in
    EV-MLKEM-552c58.cell_selection_correction, which this record adopts as the committed
    correction. This changes no measured number, no VERDICT_mut, and not the fired termination
    branch -- per both reviews' own reasoning, testing hkz/L11_b10 instead would very likely also
    have read DETECTED, since it too sits inside the same null-object band as every other archived
    hkz cell. It is a correction to PREREG-6's own STATED JUSTIFICATION for its cell choice, not to
    any result.

  # ==================================================================
  # ITEM 5 -- KNOWLEDGE PROMOTION, RULED IN SECTION BELOW
  # ==================================================================
  ruling_5_knowledge_promotion_pointer: >-
    See knowledge_promotion below. Judged, ON THE MERITS, EXPLICITLY CONSIDERED RATHER THAN
    ASSUMED EITHER WAY, TO WARRANT PROMOTION as a NEW entry distinct from KN-FIND-7d098b,
    KN-FIND-9d44b4, KN-FIND-9b5df0, KN-FIND-7de6b6 and KN-FIND-d29ece (all of which concern
    two-route independence/fidelity-matching comparisons; this concerns a DIFFERENT instrument
    type -- a mutation/positive-control test -- and a DIFFERENT failure mode -- the control's own
    predicted-effect-size formula being structurally correlated with its own pass/fail threshold,
    a general methodological lesson about designing positive controls for any small-sample
    instrument-calibration design, not specific to this goal's lattice content). A KN-FIND-*
    identifier was requested from the Coordinator's principal per this goal's own established
    pattern (DEC-20260813-1aae44 section 10, DEC-20260813-894568's own ruling_5/knowledge_promotion
    field), since none was reserved at batch open.

  # ==================================================================
  # ITEM 6 -- WHY THIS IS NOT A FURTHER CONSECUTIVE GATE/CRITERION REPAIR
  # ==================================================================
  ruling_6_repair_bar_ruling: >-
    RE-DERIVED, NOT MERELY CITED, EXTENDING PREREG-6 2.7'S OWN THREE-PART TEST A SIXTH TIME TO
    THIS DECISION'S OWN ACTS (the corrected citable wording, the forward-boundary ruling, the
    open-question ruling, the cell-selection correction, and the commissioning judgment in
    next_actions). PREREG-3 3.6 (1st), PREREG-4 2.7 (2nd), PREREG-5 2.7 (3rd), DEC-20260813-894568
    ruling_7 (4th) and PREREG-6 2.7 (5th) each independently re-derived that their own measurement
    or acts were not such a repair, keeping the count at SEVEN. Applying the identical three-part
    test to THIS decision's own acts, for a sixth time, independently: (1) DOES THIS DECISION
    SPECIFY A NEW CRITERION, CLAUSE, GATE OR THRESHOLD? No. The corrected citable wording narrows
    what an ALREADY-FIRED branch's ALREADY-WRITTEN default license may be cited as establishing;
    the forward-boundary ruling decides whether an ALREADY-DECLARED boundary applies to a
    genuinely different construction; the open-question ruling decides whether an ALREADY-NAMED
    open question in KN-FIND-d29ece is discharged by ALREADY-COLLECTED evidence; the cell-
    selection correction fixes a factual claim in already-frozen prose. None of these creates a
    rule any future candidate would be scored against, and none touches A-1 or any admissibility
    gate. (2) DOES THIS DECISION RE-VERIFY A MEASUREMENT ALREADY MADE, OR MEASURE A GENUINELY
    DIFFERENT OBJECT? Neither -- it makes no new measurement of any kind; it reviews and rules on
    an ALREADY-COMPLETED, ALREADY-REVIEWED instrument-calibration measurement (this batch's own
    mutation-testing control), which itself measured a genuinely different object (instrument
    calibration via a known ground truth) from the three prior ROUTE-P-vs-ROUTE-I''-style
    comparisons (BATCH-fbb639, BATCH-6e08fe, BATCH-a6fab5). (3) IS ITS OUTCOME A VERIFICATION/
    CORRECTION RESULT ABOUT THE INSTRUMENT'S OWN PRIOR MEASUREMENT, OR A REPAIRED GATE'S PASS/
    FAIL? The former, exclusively: every ruling above characterizes the D_route mechanism's own
    demonstrated (and un-demonstrated) power, never any lattice's admissibility. THE
    SEVEN-CONSECUTIVE-INSTRUMENT-BATCH COUNT REMAINS SEVEN, unaffected by this batch's own
    measurement or by this decision, for the identical structural reason each of the five prior
    re-derivations gave. Neither review contests this.

  # ==================================================================
  # ITEM 7 -- EXACTLY ONE NEXT ACTION, AND THE PORTFOLIO-LEVEL CALL
  # ==================================================================
  ruling_7_portfolio_call: >-
    THIS IS THE MOST CONSEQUENTIAL RULING OF THIS DECISION, REASONED THROUGH RATHER THAN DEFAULTED
    IN EITHER DIRECTION. Ruling 2 above licenses, on the merits, a genuinely different
    epsilon-sweep mutation-testing design as NOT barred by PREREG-6 2.8. That licensing does NOT
    by itself answer whether commissioning it is the right next dispatched batch. COUNTING THE
    LINEAGE PLAINLY: BATCH-fbb639 (the original C3-lane comparison, found code-shared),
    BATCH-6e08fe (a fidelity fix, found reduction-quality-mismatched), BATCH-a6fab5 (a
    code-independence-plus-fidelity fix, found a NEW confound -- near-certain convergence
    regardless of independence), and BATCH-8d09f5 (this batch, a mutation-testing control on THAT
    finding, found the control's own construction near-tautologically guaranteed to detect) are
    FOUR consecutive batches, each one built specifically to fix the confound the PRIOR one
    revealed, and each one revealing a NEW confound of its own once built. A fifth, an
    epsilon-sweep mutation design, would extend that exact pattern to a fifth consecutive
    dedicated batch of TOY-tier instrument/independence calibration on the hkz admissibility
    question alone. AGAINST THIS: (a) PREREG-6 2.8 and DEC-20260813-894568's own reasoning (v)
    both state explicitly this line of work is NOT a blocking dependency for GOAL-MLKEM-005's
    actual mechanism-search objective (RQ-MLKEM-001, best-of-M ciphertext selection against a
    shared BKZ-reduced basis); (b) the goal's own `active_hypothesis_ids` field is currently
    EMPTY -- no hypothesis under RQ-MLKEM-001 is presently being advanced by any live batch,
    while the goal's own `ceiling_known_in_advance` field records that this campaign cannot move
    an exponent regardless, making the instrument-calibration detour's opportunity cost real and
    not merely theoretical; (c) I checked, directly, that RQ-MLKEM-001 already has PROPOSED,
    UNADVANCED hypotheses sitting idle -- H-MLKEM-11aabf, H-MLKEM-232843 and H-MLKEM-34e22e, all
    status `proposed`, none yet moved to `specified` or `approved` -- while this goal's last four
    consecutive batches went entirely into the C3-lane admissibility/independence-instrument
    detour; (d) AGENTS.md's own bias toward exponent-targeting mechanisms and
    docs/target-result-profile.md make the hkz-admissibility instrument line secondary work in
    service of RQ-MLKEM-001's actual mechanism search, not a substitute for it, and secondary work
    that has now produced four consecutive "fix reveals a new confound" iterations is a
    recognizable pattern worth naming plainly rather than continuing by default. THIS IS NOT A
    PREMATURE-CLOSURE CALL under docs/inventor-protocol.md: the epsilon-sweep design is NOT being
    declared dead, mined-out, or closed with an obstruction -- it remains a concretely specified,
    licensed, well-reasoned candidate with a stated forward path (ruling_2 above), and this
    decision names it explicitly as a deferred, not abandoned, candidate with its own revisit
    condition (below). This is a PRIORITIZATION call within an unbounded budget between two
    genuinely open, valuable lanes, made explicitly rather than by default momentum, exactly the
    kind of call AGENTS.md's research-direction-integrity rule requires be reasoned and recorded,
    not silently decided by whichever lane happens to have the freshest committed batch.
    RULING: the single next_action returns this goal to RQ-MLKEM-001's substantive
    mechanism-search portfolio rather than commissioning a fifth consecutive instrument-design
    batch. The epsilon-sweep mutation-testing design is preserved, named, and given a concrete
    revisit condition, not closed.

  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE BATCH DISCHARGED ITS PREDECESSOR'S SINGLE NEXT ACTION IN FULL. It built the ONE thing
    DEC-20260813-894568 named as decisive -- a mutation-testing (positive) control on the D_route
    mechanism itself, at exactly the scope specified -- and both reviews independently confirm it
    was built exactly to spec (mechanical diff, one functional line changed) and ran to completion
    within budget at both named cells.
  - >-
    THE HARD CALL IS THE SAME SHAPE AS THIS LINEAGE'S PRIOR HARD CALLS, ONE LEVEL FURTHER IN.
    DEC-20260813-1aae44 found a branch fired correctly but its default MEANS-text overstated what
    the evidence supported (reduction-quality mismatch); DEC-20260813-894568 found the SAME
    structure one level further (near-certain convergence regardless of code independence); this
    decision finds it a THIRD level in: T-MUTCTRL-DETECTED fired correctly, but its default
    LICENSES-text overstates what THIS batch's own convergent evidence supports (the control's own
    construction structurally guarantees detection, independent of genuine shared-code
    sensitivity). Recording the corrected wording, rather than letting the default license stand,
    is deliberate for the identical reason each prior correction was: the informal reading a
    future citation would reach for is not the one this batch's evidence supports.
  - >-
    THE CONVERGENCE WITHIN A SINGLE BATCH IS WHAT MAKES THE CENTRAL FINDING ACTIONABLE RATHER THAN
    SUGGESTIVE, AND IS A STRONGER BASIS THAN SEVERAL PRIOR PROMOTIONS IN THIS GOAL HAD. Two
    reviewers, working from the same frozen text without reading each other's write scope,
    independently reached the "detection is a near-tautological consequence of the threshold's own
    construction" finding by genuinely different, non-overlapping methods -- an exhaustive
    closed-form check of all 7 possible shifts on already-archived data; a 200,000-trial-per-
    distribution Monte Carlo simulation across 3 distributions with zero lattice content. Neither
    borrows the other's warrant, and neither shares a single computational primitive with the
    other.
  - >-
    THE PORTFOLIO CALL (ITEM 7) WAS REASONED THROUGH EXPLICITLY RATHER THAN LEFT TO DEFAULT
