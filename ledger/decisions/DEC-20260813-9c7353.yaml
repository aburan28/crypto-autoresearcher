      across 3 distributions with zero lattice/HKZ/fpylll content at all) -- a STRONGER basis than
      several of this goal's prior single-batch promotions, which relied on convergent but
      methodologically related built controls rather than two methods sharing no computational
      primitive whatsoever. (2) DURABLE -- the underlying mathematical/statistical argument (a
      max-of-n order statistic vs. that same n-sample's own standard deviation is a generic
      small-sample dispersion relationship) does not depend on how hkz's own still-open question
