coordinator_decision:
  id: DEC-20260813-9c7353

  context: >-
    BATCH-8d09f5 of GOAL-MLKEM-005 discharged DEC-20260813-894568's single next_action against
    PREREG-6, the frozen pre-registration notarized alone at commit
    dcaac725f65da93c0ab27eeed970d6d10b2bcde1 by TASK-20260813-4aec9a's own snapshot task (zero
    producer artifacts). PREREG-6 commissioned exactly one measurement: a MUTATION-TESTING
    (positive) control on the D_route/D_route'' comparison mechanism itself for hkz -- a COPY of
    the shared basis-construction code with a single, precisely-described, deliberately injected
    defect (a seed-index off-by-one in route_ii_make_A), checked at exactly 2 named cells
    (hkz/L7_b5, hkz/L11_b30) against a frozen, pre-computed prediction. The lead producer
    TASK-20260813-630414 found fpylll genuinely available in its own session, built the mutant
    exactly as specified, and reported VERDICT_mut = "DOES NOT EXCEED" at both cells (matching the
    frozen prediction bit-exact), firing T-MUTCTRL-DETECTED, unsuffixed -- snapshot-committed at
    e2ad28b3ffe90b2b5390ca83f4e2ba1d431399fd by TASK-20260813-cb8943 (9 declared paths). TWO
    INDEPENDENT REVIEWS RETURNED: Validator TASK-20260813-01f482 (VAL-20260813-01f482), verdict
    `passed`; Red Team TASK-20260813-0881f0 (RT-20260814-ee142c), two MAJOR objections plus one
    MODERATE and one MINOR, stating explicitly it is "not a rejection of the branch call." BOTH
    REVIEWS, INDEPENDENTLY, VIA GENUINELY DIFFERENT METHODS, CONVERGE ON A MAJOR STRUCTURAL
    FINDING: s_c^fib (the detection threshold) is literally the sample standard deviation of the
    SAME 8-element archived per-basis array PREREG-6's own frozen prediction is computed from, so
    that "detection" of this entire defect class was near-certain (>=99.998% under a null-object
    control) before any reduction ever ran.
    A GENUINE INFRASTRUCTURE FAILURE IS RECORDED PLAINLY, PER AGENTS.md RULE 5, AND CHANGES
    NOTHING SUBSTANTIVE: this batch's two reviews were dispatched once before this pair, completed,
    and were LOST to an execution-environment reset before either report could be committed.
    TASK-20260813-01f482 and TASK-20260813-0881f0 are the redispatched, freshly-completed reviews
    and are this batch's real, official reviews; both explicitly treat themselves as a genuine
    fresh start reviewing only the snapshot commit that actually exists, not a duplicate of
    anything.
    CLAIM TIER TOY, UNCONDITIONALLY: nothing here bears on ML-KEM security, on any FIPS 203
    parameter set, on any attack cost, or on any cost model.

  decision: revise

  decision_note: >-
    `revise` is the ACTION -- the evidence record is committed with the termination branch read
    exactly as fired, the discharge's default LICENSES-text corrected and narrowed per the
    convergent review finding, a factual correction to PREREG-6's own cell-selection rationale
    entered, PREREG-6 2.8's forward boundary and KN-FIND-d29ece's own open-question status both
    ruled on explicitly, and the successor's single next action specified -- and it is NOT a
    verdict on any proposition about a lattice. NOTHING IS `support`ed, `weaken`ed OR
    `reject_scoped` HERE; no hypothesis status moves and none is named
    (EV-MLKEM-552c58.hypothesis_id is null, by design), matching this goal's own established
    pattern for every prior instrument-calibration close (DEC-20260813-1aae44, DEC-20260813-894568).
    `approve` would understate the work this decision does: it would treat the Validator's
    `passed` verdict and PREREG-6's own default license text for T-MUTCTRL-DETECTED as sufficient
    on their own, when both reviews' own convergent central finding shows that default text
    substantially overstates what the data establishes. `reject_scoped` is unavailable and would
    be forbidden even if it applied: no hypothesis is being adjudicated, this batch's central
    finding is `replicated` (reached independently within this single batch by two genuinely
    different methods), not empirical_only or single-source, and in any case no negative verdict
    about any lattice is being reached here -- this decision corrects the SCOPE of an
    instrument-calibration finding, it does not falsify anything about hkz. `pause` is unavailable
    for the same reasons prior decisions in this goal gave: GOAL-MLKEM-005's pause_conditions are
    INFRASTRUCTURE-ONLY plus a user request, and the lost-review infrastructure event named above
    did not prevent this batch from producing valid, committed, official reviews, so it does not
    trigger a pause either. THIS BATCH CLOSES, PAUSES AND COMPLETES NOTHING. T-MUTCTRL-DETECTED
    closes no lane by itself -- PREREG-6 2.6 is explicit its FORBIDS list includes closing, pausing
    or completing GOAL-MLKEM-005. T-HKZINDEP-CONFIRMED, T-C3LANE-OPEN-PARTIAL and
    T-INDVERIFY-ARTIFACT-PARTIAL are EXPLICITLY NOT retroactively changed by anything in this
    decision.

  target_ids:
  - GOAL-MLKEM-005
  - BATCH-8d09f5
  - EV-MLKEM-552c58
  - TASK-20260813-4aec9a
  - TASK-20260813-630414
  - TASK-20260813-cb8943
  - TASK-20260813-01f482
  - TASK-20260813-0881f0
