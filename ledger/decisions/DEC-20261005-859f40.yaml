  rationale:
    - >-
      WHY refine AND NOT support. The instrument claim holds as scoped, but 'support' would
      read as support for H-SEMBIN-2d7708 or for the contract. The data say neither: the
      object differs from the contract's. A neutral direction with strength replicated is
      the honest pair: a replicated instrument fact, no hypothesis movement.
    - >-
      WHY NOT weaken OR reject_scoped. No composed finding supports an adverse transition
      here (R13), the plan forbids using this round for one, a single unreplicated
      empirical-only run cannot support reject_scoped, and the instrument that would have to
      carry it is the one whose certificate is not yet defined. Declining is not
      premature closure: R13 records the lead and its test.
    - >-
      WHY THE WEIGHT IS ON THE BLIND LANE. The producer's own checks are blind to missing
      products by construction (F-5) and weak against sparse corruption (F-6). The independent
      M4RI-free recomputation and the mutation-tested saturation check are what move the
      instrument from 'plausible' to 'replicated'.
    - >-
      WHY ONE NEXT ACTION. Every open item (the amendment, a successor, the 35bf67 read, the
      RUN-SEMBIN-b6eb9f correction, the manifest supersession) depends on whether the
      remaining window scope is carried by the approved EXP-SEMBIN-35bf67 and EXP-SEMBIN-79a02d.
      Reading them first ranks work behind the information that decides whether it is needed.

