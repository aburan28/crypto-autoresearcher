  # ---------------------------------------------------------------------------
  # RULINGS
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: What does the round change and what does it not?
      ruling: >-
        CHANGES: (i) RUN-SEMBIN-5ed13e's admission (R5). (ii) The reading of
        RUN-SEMBIN-9bb990's label (R6). (iii) DV-7 (c) is no longer an open question: the
        recorded object is the iterated closure (R3). (iv) DV-8 is decided (R7). (v) DV-5,
        DV-6 and DV-9 are confirmed, not overstated by the notes. (vi) One impediment is
        raised and one next action set. DOES NOT CHANGE: H-SEMBIN-2d7708, EXP-SEMBIN-7e1371,
        the goal, any other run or experiment, RUN-SEMBIN-b6eb9f. It asserts nothing about
        Semaev's Assumption 1, d_F4, Assumption 2, n = 409 or 571, Kosters' figures, or any
        curve. It is an INSTRUMENT-VALIDITY result: degree-capped closure on M4RI
        release-20240729, twelve m = t = 2 window systems.

    - id: R2
      question: How is the one quantity disagreement (n = 40 draw 0) read, and is any other a convention difference?
      ruling: >-
        READ AS A RECORD ARTIFACT, NOT AS A FAULT OF EITHER IMPLEMENTATION (EV F-1). The
        recorded rank 101931 and size-4 count 91230 are those of a closure stopped at the
        first batch that yields 1; the full closure has rank 102091 and size-4 count 91390.
        The blind lane's wave rank 101931 equals the recorded value. No other disagreement
        exists, and none is a difference of order or convention: the blind lane used the plan's
        degrevlex and budget, and the validator found closure.c's column order equal to the
        statement's comparator for N = 8..62. Two records (n = 42 draw 0, n = 44 draw 0) carry
        D = 2 values only and are compared on verdict, N_std, |V|, c and 1 in W, where they
        agree; their D = 4 rank is the column count by derivation (1 in W_2 implies W_4 is the
        whole space), and is not a recorded value. Disagreement is localised to a difference
        between the statement of the quantity and closure.c's stopping rule (a third kind,
        not named in the plan). It changes no verdict-bearing value. Disclosed as RD-5.

    - id: R3
      question: >-
        Contract conformance (W3 c). Which is the contract's certificate, and what does that
        mean for the labels sufficient and insufficient on the 7 of 12 systems?
      ruling: >-
        THE CONTRACT'S CERTIFICATE IS THE LITERAL SINGLE-LEVEL BLOCK. The specification,
        read in full by this Coordinator, names only 'the degree-4 Macaulay block ... all
        products of the generators and the field equations by monomials up to total degree 4
        ... rank and rank deficiency against the count of degree-<=4 monomials' (inputs.certificate),
        and states its baseline control, first stopping rule, success criterion and
        falsification criterion for that certificate. It names no iterated closure, no fixed
        point, no order and no verdict rule (red team F-W1-S1). The producer implemented and
        ran the iterated closure W_D (closure.c; 5ed13e ran --no-single). The two coincide on
        5 of 12 systems and give opposite labels on 7 (EV F-3).
        MEANING FOR THE LABELS. On the 7 (n40 d0, n40 d1, n41 d0, n41 d4, n42 d1, n43 d0,
        n43 d5) the recorded 'sufficient' means sufficient under the iterated closure and
        insufficient under the contract's literal block. On n42 d0 and n44 d0 it is
        sufficient under both (1 lies in the span of the generators). The three
        insufficient labels hold under both, by monotonicity. They are therefore not verdicts
        of the contract's certificate for the 7, and the run is read as exploratory against
        v1's criteria (R5; docs/task-lifecycle.md: an exploratory change cannot be evaluated
        against the original confirmatory criterion).
        THE CONTRACT TEXT COLLIDES WITH ITSELF AT ITS BASELINE. Stopping rule 1 says a
        certificate that does not return sufficient at both published baseline cells is a
        PROCEDURE DEFECT; falsification criterion 1 says an insufficient diagonal cell at
        n <= 40 REFUTES the second clause of H-SEMBIN-2d7708. Under the literal block both
        n = 40 draws are insufficient (rank 31673 of 102091). This ruling does not decide
        which clause governs for an adjudication; it records that the baseline control exists
        'so the certificate is known to measure what F4 measured', so that its failure is an
        instrument-definition finding and not a hypothesis result. Reading it as a
        refutation of the second clause is a separate adverse claim: it requires a refutation
        artifact, replication and a review-breakthrough round at max (plan escalation), and
        is not made. (b) 'degree 3' cannot be satisfied by the twelve and (per the 9bb990
        NOTES as relayed by the validator, not independently checked) at (m, t) = (2, 2) the
        eq. (4) nearby-object system is byte-identical to eq. (5), so the nearby-object
        control cannot be satisfied there by a different system. Both are contract-text
        defects for NA-1.

    - id: R4
      question: The order-dependence scope finding (W1).
      ruling: >-
        ACCEPTED AS A SCOPE FINDING, NOT A DEFECT OF THE TWELVE. The contract names no
        order. Every verdict label in this program, from this decision onward, is recorded as
        (closure, order, rule): here W_4, degrevlex with x_1 largest, N_std = |V|. A bare
        'sufficient' or 'insufficient' is not a property of the system. The twelve window
        labels were tested under six orders (nine sufficient: all sufficient; three
        insufficient: argued order-robust) and no flip was found; the untested orders are
        listed under limitations. 'Insufficient' is a statement about the capped closure
        and not about the ideal (the red team measured closures insufficient where the
        degree-<=4 part of the ideal certifies, 122 of 288 random small systems, N 10..17).
        It is not d_F4 > 4.

    - id: R5
      question: Admission of RUN-SEMBIN-5ed13e and its self-label completed_valid.
      ruling: >-
        ADMITTED TO INTERPRETATION AS OBSERVATIONS OF THE ITERATED CLOSURE ONLY.
        completed_valid is ratified in that scope and not as a run of the contract's
        certificate. Reading rules: (i) the rank, leading counts and digest of n = 40
        draw 0 are an intermediate early-stopped state (F-1); (ii) the nine sufficient
        records are soundness-sensitive, the three insufficient records soundness- and
        completeness-sensitive (F-2); (iii) the verdict rule used |V| on seven of twelve
        records and not on the five with 1 in W (RD-6); (iv) wall_s is last-launch only for
        two instances (RD-1); (v) no control of the contract was measured on this instrument
        (R9). The manifest is not edited.

    - id: R6
      question: Should completed_invalid for RUN-SEMBIN-9bb990 stand, narrow, or be superseded?
      ruling: >-
        NARROW, BY RECORD CLASS, NOW; DO NOT SUPERSEDE THE MANIFEST. The status word is
        broader than the evidence (one closure record contradicted, the rest unverified,
        counts and F4 traces and structural controls not affected), although the manifest's
        own validity.reason already scopes it to the closure and single-level measurements.
        The official reading is the table below. The word stays as the executor's label,
        unedited; a corrected manifest and a tools/run_supersession_registry.yaml entry are
        bundled with the DV-9 inference-block remedy into the archive of the NA-1 decision, so
        that one additive act corrects the machine-readable status and the missing blocks.
        Until then every consumer reads this table.
      classes:
        - {class: 'exhaustive_solution_count (291 records; count_chain.c, count_m2.c)', uses_m4ri: false, label: VALID, basis: 'recounted independently, 12 of 12 window instances and 60 of 60 draws'}
        - {class: 'f4_trace_msolve (415 records)', uses_m4ri: false, label: 'NOT AFFECTED BY THE LIBRARY DEFECT', basis: 'almost all unreached_declared or capped; the completed ones agree with the closure where both exist (validator)'}
        - {class: 'closure_certificate chained (27) and matched_null (2)', uses_m4ri: 'true (0.0.20200125, mzd_echelonize)', label: 'UNVERIFIED; the (43, 2, 2, 22) draw 0 record CONTRADICTED by exact enumeration', basis: 'five sufficient-by-1-in-W records on empty varieties and four std = |V| records agree with the truth but came through the unsound path; the window instances are re-measured by RUN-SEMBIN-5ed13e (validator table)'}
        - {class: 'macaulay_single_level (92 chained, 10 null, 48 eq. (4))', uses_m4ri: 'true, except the eq. (4) blocks, which are empty at D = 4', label: 'UNVERIFIED, no contradiction observed', basis: 'the product logic equals an independent Macaulay rank on 42 of 42 small runs; the elimination library is the defective one'}
        - {class: 'controls invalid_input and summation_polynomial_identity', uses_m4ri: false, label: VALID, basis: 'python only'}
        - {class: 'control known_false', uses_m4ri: 'true (closure at D = 2)', label: 'UNVERIFIED but trivial', basis: 'plus an F4 trace that agrees'}

    - id: R7
      question: Did stopping rule 4 fire, and is continued measurement under v1 within contract (DV-8)?
      ruling: >-
        STOPPING RULE 4 DID NOT FIRE IN THE CONTRACT'S SENSE. Its text names a
        disagreement with an AFFORDABLE Groebner completion. The disagreement found was with
        exact enumeration at a cell where no completion was affordable, and the executor
        traced it to the library (core rules 3 and 5: an implementation failure is
        infrastructure signal, not a refutation of the method). Where an affordable F4
        completion existed the closure agreed with it. The NOTES sentence 'the contract
        anticipates it: stopping rule 4' is an overstatement (RD-9); stopping was a
        reasonable machine-protection reaction and not a violation. CONTINUED MEASUREMENT on
        the fixed library is therefore not barred by rule 4. What bars reading it against v1
        is R3, not R7.

    - id: R8
      question: Record defects (RD-1 to RD-11, EV-SEMBIN-702d1d).
      ruling: >-
        DISCLOSED, NOT REPAIRED, NOT EDITED. This decision is the additive disclosure; the
        NOTES files and manifests stay byte-identical. The validator's corrected wording is
        adopted for readers: (1) the Q-A statement as in EV claim_scope_statement; (2) the
        evaluation check is 'a necessary condition for soundness at one zero, at 1 of 4
        (resp. 1 of 2) zeros; its power depends on how many rows are bad and how many columns
        are visible at the witness (5.0 and 8.5 percent at the two window witnesses); it
        flagged every scratch trial with at least half as many flips as output rows
        (168 of 168) and the real defect in the package logs, but isolated corruption passes
        in a fraction of trials and a row vanishing at the witness is never seen; it does not
        test completeness'; (3) 'D=4 wall s' and timing.workers are final-launch only for
        n = 40 draw 1, n = 45 draw 0, lanes closure_m2_n40 and closure_m2_n45, and 11 GiB is a
        configured cap, peak memory not recorded; (4) the 9bb990 NOTES quote at lines 224-241
        is not backed by a log and must not be cited, and 'the defect ... is fixed upstream'
        reads 'the unsound eliminations occur on 0.0.20200125 and not on release-20240729;
        the library is the cause traced; which upstream change is responsible is not isolated';
        'stopping rule 4 fired' reads 'an instrument-validity contradiction against exact
        enumeration was found; rule 4 was not triggered at any cell where a completion
        existed'. No CORR-* id is minted here (none was pre-minted); an optional correction
        record under a new id is bundled with the NA-1 archive.

    - id: R9
      question: The controls not run on the 5ed13e instrument. What is and is not established?
      ruling: >-
        ESTABLISHED: the instrument computes the defined quantity W_4 on twelve systems
        (R5), the verdict rule behaves on known-sufficient and known-insufficient small
        systems (PT-3, on the blind lane's implementation), and the producer-style
        argument cannot certify completeness (PT-1). NOT ESTABLISHED, and not claimed: the
        contract's baseline, nearby-object, matched-null, certificate-soundness, known_false
        and invalid_input controls on this instrument as controls. The n = 40 cell was
        measured (iterated: sufficient on both draws; literal: insufficient on both) and is
        not a control run. In particular whether a matched-shape random Boolean system at
        these sizes is insufficient under W_4 (so that 'sufficient' carries information
        here) was not measured. DV-5 is confirmed and not discharged.

    - id: R10
      question: The 92 hash-listed files and the digest-only package.
      ruling: >-
        NO QUESTION OF Q-A OR Q-B DEPENDS ON A FILE NOBODY CAN OPEN. All 92 regenerate
        byte-for-byte from the recorded generator blobs, and every record naming them
        carries a consistent hash (F-12). Digest-only storage costs nothing further here.
        The caveat is host-specific (the files were present on the validator's host).

    - id: R11
      question: Residual UNREACHED and unverified items.
      ruling: >-
        CARRIED AS NAMED, NOT HIDDEN. (1) RC-1, the leading-set SHA-256 comparison, is
        computed by gate C-DIGEST of the archive card and stops the archive on a mismatch.
        (2) The blind lane's second implementation did not finish the N = 40 leading sets.
        (3) The producer's final bases at scale were not saturation-checked and are not
        archived. (4) The three insufficient windows' order-robustness is argued. (5) The
        evaluation check's power at the window is a model. (6) The loaded M4RI binary's
        identity with a clean build. (7) RUN-SEMBIN-b6eb9f's correction record (9bb990 NOTES;
        DEC-20261004-df2986) is still owed and not covered by this round. Items (2) to (6)
        do not change a verdict-bearing value of either run on the evidence of this round;
        each would be a reason to downgrade the strength if a later check contradicted it.

    - id: R12
      question: Interaction with DEC-20261005-b7e3a9 and the other SEMBIN lanes.
      ruling: >-
        NO CONTRADICTION, ONE POINTER. DEC-20261005-b7e3a9 does not mention this lane. Its
        R1 ranks, R5 binding and R6 goal-level next_action stand unchanged, and the next action
        here takes no lane of max_concurrent 2 (a zero-compute Coordinator act, as
        DEC-20261005-b7e3a9 R3 reasoned for an approval decision). IMP-SEMBIN-ENGINE is not
        touched: DEC-20261005-b7e3a9 R1 says it clears only when a decision reads a passing
        Stage-1 engine gate from EXP-SEMBIN-35bf67 or EXP-SEMBIN-79a02d; this round is a fact
        that reading may cite (closure.c on a clean M4RI computes W_4 correctly on twelve
        systems; EV-SEMBIN-702d1d) and is not claimed to clear it. POINTER, A READ AND NOT
        A PRECONDITION: EXP-SEMBIN-35bf67 (rank 1) reports dim_R4, 'the dimension of the
        degree-4 capped closure fixed point' (specification primary_metrics, read in part),
        and gates Stage 2 on a (40, 2, 2, 20) baseline (SR-3). This round supplies three
        facts any reader of that Stage-1 gate needs: the baseline cell gives opposite labels
        for one-level and iterated closures (F-3), labels are relative to an order (F-4), and
        a sufficiency rule that compares with |V| differs from a rule that does not (RD-6).
        Whether its SOLV4 definition pins them is read at the run-snapshot binding of
        DEC-20261005-b7e3a9 R5 and is the first step of NA-1. It blocks nothing and
        approves nothing.

    - id: R13
      question: >-
        Is there a plausible high-value lead in the window pattern that this decision
        declines to read as a result? (CLAUDE.md rule 9: record it, with its test.)
      ruling: >-
        YES, NAMED, NOT READ. At face value the iterated-closure pattern is sufficient at
        n = 40..43 on 8 of 8 instances, at n = 44 sufficient on the draw whose generators
        already span 1 and insufficient on the solution-bearing draw, and insufficient on
        both n = 45 draws. That is not the 'diagonal survives n = 40..45' pattern the
        hypothesis predicts, and it lies at the n where the unreproduced Kosters pointer
        sits (KN-LIT-e77232, which supports nothing). It is NOT read as a diagonal failure
        because: (i) the object is not the contract's certificate (R3); (ii) a capped
        closure insufficient is not d_F4 > 4 (R4); (iii) the contract's falsification
        criterion is stated for n <= 40; (iv) one solution-free and one solution-bearing draw
        per n, one seed family, no matched-null on this instrument (R9); (v) a plan-level
        constraint: no decision may use this round to weaken or reject H-SEMBIN-2d7708.
        TEST BOUNDARY: twelve instances, D = 4, degrevlex. REMAINING UNCERTAINTY: whether
        insufficiency at n = 44 and 45 replicates on fresh draws under a defined certificate,
        and whether it separates from a matched null. REVISIT CONDITION: the NA-1 decision,
        and the Stage-2 Kosters probe of EXP-SEMBIN-35bf67 at (45, 2, 2, 23). This is a
        deprioritisation of nothing: it is the reason NA-1 asks for a certificate defined
        before any further draw is read.

