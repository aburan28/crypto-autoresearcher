          H-PSEUDO: new open problem in EC cryptography. Equivalent to:
          discrete logs of small-x EC points are pseudorandom in Z/N.
          Not addressed in ECCG literature, Weil bound, or L-function theory.
          Precise formulation in DEC-20260804-578f75.

