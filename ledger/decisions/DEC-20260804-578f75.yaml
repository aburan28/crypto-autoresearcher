coordinator_decision:
  id: DEC-20260804-578f75
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-072
  recorded_by_task: TASK-20260804-084
  archived_by: TASK-20260804-085
  context: >-
    BATCH-072 analyzed three approaches to proving H-PSEUDO. All three approaches
    are blocked by fundamental mathematical obstructions (structural incompatibility,
    circularity, or wrong Fourier direction).

  decision: record_hpseudo_as_new_open_problem
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    H-PSEUDO is a NEW OPEN PROBLEM in the literature (not named or addressed in any
    known work). It is the Fourier-dual of ECCG security in the DLP-INDEX direction,
    separated from ECCG by the DLP map. It cannot be proved by:
    (1) Michel-Venkatesh / Weil bound: structural incompatibility (DLP non-algebraic)
    (2) Mock character approximation: equivalent to breaking ECDLP (circular)
    (3) Average over primes via L-functions: gives average over k, not max over k;
        ECCG literature handles wrong Fourier direction

    The most tractable approaches identified:
    (A) Direct measurement: measure max_k |hat{1_F}(k)| vs sqrt(B) at small p to
        bound C empirically
    (B) Conditional proof: prove H-PSEUDO assuming ECDLP hardness or an algebraic
        analogue (e.g., DDH assumption on E(F_p))

    GOAL-ECDLP-001 stays active. The precise formulation of H-PSEUDO represents
    genuine mathematical progress: it is a necessary and sufficient condition for
    closing the arithmetic factor-base gap.

  hpseudo_formulation: >-
    H-PSEUDO (Discrete Logarithm Pseudorandomness Conjecture for Structured Points):
    For E/F_p ordinary with prime-order subgroup G of order N, and
    F = {P ∈ G : x(P) < threshold} with |F| = B, the Fourier transform
    hat{1_F}(k) = Σ_{P ∈ F} e^{2πi k·DL_G(P)/N}
    satisfies max_{k ≠ 0} |hat{1_F}(k)| = O(sqrt(B)).
    This is equivalent to: the discrete logs DL_G(P) for P ∈ F are
    B^{-1/2}-pseudorandom in Z/N.

  exact_next_action: >-
    BATCH-073: Measure max_k |hat{1_F}(k)| vs sqrt(B) at p=1009 empirically.
    This requires computing all discrete logs in E(F_p) (feasible at p=1009 by BSGS)
    and then computing the Fourier transform of the small-x indicator function.
    This would give empirical bounds on C and potentially identify whether
    H-PSEUDO is tight or has a larger constant.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
