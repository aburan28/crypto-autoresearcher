coordinator_decision:
  id: DEC-20260907-c9b61c
  context: >-
    Approval of the frozen successor contract EXP-PFDR-a76b91 (version 1) for
    the first-fall definition audit. The predecessor EXP-PFDR-845d33 was
    approved by DEC-20260906-126882 on the user's "yesapproved" instruction;
    its single launch attempt (TASK-20260906-9e922c) measured zero of eight
    fixtures: one launch failed because the host (macOS 26.6-arm64) rejects
    every RLIMIT_AS/RLIMIT_DATA setrlimit call, and three groups were never
    launched. DEC-20260906-280035 (administrative disposition after the
    independent instrument-integrity review TASK-20260906-46c863) closed that
    attempt as incomplete with rerun_authorized: false, requiring "a
    separately frozen and committed future contract and authorization before
    any rerun" and, before any future execution proposal, "a portable memory
    guard and failure-capture preflight that records launch failure before
    fixture work."
  decision: approve
  target_ids: [EXP-PFDR-a76b91, BATCH-ff2730]
  rationale: >-
    The user authorized execution of this audit with the protocol, eight
    fixtures, four bounded run groups, and budget unchanged (DEC-20260906-dd1676,
    re-filed as DEC-20260907-a39256 after the original uncommitted filing was
    destroyed by a concurrent checkout; see that record for the verbatim user
    quote). The frozen predecessor package cannot satisfy that instruction on
    any host: its four reserved run IDs are permanently consumed by their
    immutable failure receipts (the driver creates receipt directories with
    exist_ok=False and hard-codes the v1 IDs), and the platform limitation it
    hit is kernel-level, not environmental. EXP-PFDR-a76b91 is the separately
    frozen successor DEC-20260906-280035 requires: the scientific protocol is
    byte-identical to the predecessor (verified section-by-section against
    predecessor_specification_sha256 141498a66abf92f159cf0af72210ff30d96888506d7af8b38de98fe9900a81ca;
    checker.py, inputs.json, and source-audit.md are byte-identical copies
    pinned in the freeze), while the execution environment moves to a
    digest-pinned Linux container (sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de)
    launched by tools/audit_process.py's docker backend, where the driver's
    own 8 GiB hard RLIMIT_AS is verified to succeed and the cgroup enforces
    the same bound. This discharges the 280035 next_actions in order: the
    portable memory guard is the container cgroup plus the unchanged
    per-process limit; the failure-capture preflight is the supervisor's
    launch-before-resource-setup launch.json and its exclusive output
    directories; the native grading/zero-top-form interface remains explicitly
    unresolved and unassumed (groups 1 and 3 stay unmeasured-by-design); and
    the canonical ledger/schema interface is satisfied by the adapter, which
    constructs schema-conforming manifests against the repaired
    schemas/run-manifest.schema.json.
  evidence_refs:
    - source: experiments/EXP-PFDR-845d33/execution-report.yaml
      provenance: internal
      access_note: The producer's account of the zero-fixture predecessor attempt, cited as the reason the frozen predecessor is un-runnable; no new validation asserted here.
    - source: experiments/EXP-PFDR-845d33/runs/RUN-PFDR-20260906-eb1a30/stderr.log
      provenance: internal
      access_note: The exact ValueError that makes the predecessor driver's limit line fatal on this host.
    - source: docs/first-fall-audit-repair.md
      provenance: internal
      access_note: >-
        The committed repair boundary. The native backend refuses macOS; the Docker backend with a
        digest-pinned image is the prescribed macOS path; the adapter must construct canonical manifests.
    - source: experiments/EXP-PFDR-a76b91/specification.yaml
      provenance: internal
      access_note: The frozen successor contract; predecessor-equivalence statement and driver deltas D1-D6 are part of this decision's basis.
  limitations:
    - Approval is limited to this administrative successor and its exact frozen protocol; it authorizes no change to the scientific content.
    - No experiment is executed by this decision; execution proceeds only under TASK-20260907-808ec2 after the contract snapshot commit.
    - Groups 1 and 3 are expected to remain unmeasured-by-design (unresolved native interface); that outcome is a design property, not a failure of this successor.
    - No hypothesis status, scientific claim, or goal status changes; no mathematical closure, source bug, or disproof is claimed.
    - The pinned image is a locally built derivative of a pinned base digest; it must be re-verified by digest readback before every launch and is never pulled by tag.
    - EXP-PFDR-782085, EXP-PFDR-25057c, and the survival panel remain unapproved, as under the predecessor's disposition.
  next_actions:
    - Commit the contract snapshot (specification, freeze, handoff, both decisions, re-filed authorization) and verify the frozen hashes.
    - Execute TASK-20260907-808ec2 under the container backend.
    - Archive all declared execution artifacts before independent review.
    - Require a separate Coordinator disposition before authorizing the survival panel.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval and environment relocation provide no experimental or mathematical evidence.
  decided_by: coordinator
  decided_at: '2026-09-07'
  user_authorization:
    quote: a
    interpreted_scope: Execution of the audit with unchanged protocol, carried by the frozen successor EXP-PFDR-a76b91 (DEC-20260907-a39256).
