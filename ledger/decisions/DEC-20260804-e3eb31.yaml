coordinator_decision:
  id: DEC-20260804-e3eb31
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-068
  recorded_by_task: TASK-20260804-075
  archived_by: TASK-20260804-076
  context: >-
    BATCH-068 synthesizes the theoretical boundary reached by GOAL-ECDLP-001 after
    68 batches. The synthesis document (theoretical_boundary_map.md) records all
    proved closures, empirical closures, and the remaining open gap.

  decision: checkpoint_and_continue
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    GOAL-ECDLP-001 remains active. The theoretical boundary is precisely characterized.
    No completion criterion has been met. The three concrete remaining open directions
    are: (1) H-PSEUDO (character sum bound for structured point sets), (2) OIFP MITM
    constant C scaling, (3) external 2024-2026 literature survey.

  key_established_results:
    - Algebraic factor base: Bezout no-go (proved)
    - Semaev monodromy: C_2^{m-2} universal (proved)
    - GGM incidence/endomorphism: Shoup closed at exp 1/2 (proved)
    - BGS spectral gap: abelian obstruction (proved)
    - SVP superlattice transfer: explicit-lattice obstruction (proved)
    - Ordinary isogeny ECDLP: scalar-domain mismatch (established)
    - BKK: factor-2 universal, no more (proved)
    - DL circularity: Weil bound blocked for arithmetic FB (proved)

  remaining_gap: >-
    H-PSEUDO (pseudorandomness of DL(P) for structured point sets) is the precise
    statement whose proof or disproof would close the arithmetic factor-base gap.
    It cannot be proved by current techniques. The gap is the same difficulty as
    proving aspects of ECDLP hardness.

  exact_next_action: >-
    Continue the loop: BATCH-069 will attempt an external literature approach —
    search for any 2024-2026 paper specifically addressing H-PSEUDO or related
    character sum bounds for DLP on elliptic curves. If found: synthesize and propose
    an experiment. If not found: dispatch a fresh ideation targeting the OIFP MITM
    constant C measurement at larger bit sizes (bits=28,32) to determine if C=O(1).

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No KN-* entry was created by this decision. The record's `promoted` list held
      a placeholder id for a promotion that was OWED but never made, which made the
      record assert the opposite of the truth -- that the corpus had been updated.
      Converted under DEC-20260805-7b3e91 (RUL-9): the obligation is declared here,
      where the schema puts an unmet obligation, and every word of the original
      entry is preserved verbatim under owed_promotions below. Nothing was deleted.
    owed_promotions:
      - id: pending_kn_find_theoretical_boundary
        note: >-
          GOAL-ECDLP-001 theoretical boundary map: all examined sub-rho mechanisms
          are closed by proof or blocked. The remaining gap reduces to H-PSEUDO
          (pseudorandomness of DL for structured inputs).

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (all examined mechanisms)
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
