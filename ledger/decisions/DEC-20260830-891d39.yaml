  claim_tier: toy
  scope_statement: >-
    Scoped exactly to EXP-MONO-c819ba's tested regime: prime fields
    F_p, p in [100,3000] (archived panel) and [151,997] (Red Team's
    supplementary curves), E(F_p) as a finite abelian group, m in
    {1,2,3,4}, n=30 matched-null draws per cell (archived) and n=200
    (Red Team's sensitivity check). No ECDLP, relation-rate, exponent, or
    cryptographic-scale claim. Does not close KN-OPEN-009 -- if anything,
    it shows the toy-scale instrument used to approach its "relation-rate"
    half needs a documented recalibration before it can be trusted again.

  dominated_by:
    value: not_applicable
    reason: A relation-rate instrument-validation record, not a competing mechanism.
  sota_delta: 0

  rationale: >-
    Both reviewers were dispatched concurrently, mutually blind, after an
    isolated Coordinator snapshot commit of the Executor's artifacts
    (commit 11a799654, verified by exact-path receipt before dispatch --
    correcting this session's cycle-4/5 sequencing lapse). They converged
    on the same substantive conclusion via largely disjoint methods: the
    Validator via a bootstrap recalibration of the run's own null
    distribution plus an orbit-structure refutation of the mechanism the
    Executor had flagged as most likely; the Red Team via wholesale
    independent replication on 254 freshly constructed curves plus four
    further orthogonal falsification routes. Independent convergence via
    disjoint methods is itself strong evidence the conclusion (the
    instrument's calibration, not the underlying mathematics, is the
    story here) is robust rather than an artifact of either reviewer's
    own approach. The Coordinator did not need to adjudicate a
    disagreement between the reviews; the work here is to state their
    shared finding precisely, distinguish the parts of the run that DO
    survive review (identities, controls, Stage-1 corpus reading) from
    the one part that does not (the K3/K4 discriminating metrics and the
    escalated cell derived from them), and record the concrete
    replication design both reviewers converged on for whoever picks this
    up next.

    A genuine process finding is disclosed rather than absorbed: the
    Red Team's OBJ-6 shows the archived null arm itself violates the
    frozen contract's own literal ordering_control stopping rule (a null
    cell reads 3.4x the escalated treatment value), which the Executor
    did not catch. This is reported as a disclosed non-compliance with
    the contract, not as a new mathematical finding, and does not by
    itself invalidate the reviewers' independently-derived conclusions
    (which do not depend on the ordering control passing).

  next_action: >-
    Design and dispatch a replacement/replication experiment for
    H-MONO-663fb4's K3/K4 question under a corrected null-calibration
    design, per the Red Team's own explicitly named proposal: 200 draws
    per matched-null cell (not 30), exact permutation-based p-values with
    Holm/Bonferroni correction applied over all tested cells (not a fixed
    multiplicative band), one cell reported per curve across at least 100
    independently constructed curves (not a small fixed panel), and a
    mandatory panel-level null-object arm run and checked BEFORE any
    treatment cell is interpreted (closing the OBJ-6 gap directly). This
    is affordable well within the original 7200s budget, of which the
    archived run used 1.9s of compute. A new EXP-* contract must be
    drafted and independently approved before any run; this decision
    authorizes no new implementation or execution.

  knowledge_promotion:
    promoted: [KN-TECH-7745e6]
    promotion_note: >-
      New knowledge-technique entry, checked non-duplicative of
      KN-TECH-6785f2.md, KN-TECH-052.md, and KN-FIND-7d098b.md via a
      scoped grep of knowledge/techniques/ and knowledge/findings/ for
      null-calibration/heavy-tail/multiple-comparison content before
      drafting (applying the discipline established in cycle 6's
      DEC-20260830-0f8def after a near-duplicate promotion was caught
      and discarded there). Documents the calibration failure and its
      four-step remedy, generalized beyond this one hypothesis to any
      program instrument using a fixed-band matched-null ratio test on a
      heavy-tailed m>=3 statistic at small draw counts.
    not_promoted_reason: null

  procedure_deviations:
    - >-
      None from the review_plan itself: both reviews were dispatched
      concurrently, post-snapshot, with disjoint joints (Validator =
      J1-correctness, Red Team = J2-adversarial) and both attest
      read_sibling_reports: false.
    - >-
      Disclosed, not a deviation from THIS decision's own process: the
      archived run itself (produced by the Executor, prior to this
      decision) is found by the Red Team to have violated the frozen
      contract's own ordering_control stopping rule (OBJ-6). Recorded
      here rather than silently corrected, per AGENTS.md immutability and
      disclosure rules.
    - >-
      GOVERNANCE FINDING, DISCLOSED: a tenth out-of-band "Cursor Agent"
      commit (1457a0fd8) edited EXP-MONO-c819ba's already-archived,
      already-merged implementation source between this experiment's
      review round and this decision's own composition, touching exactly
      the null-population mechanics both reviewers scrutinized. Fully
      disclosed in CORR-20260830-2b6706; content-benign to the archived
      evidence this decision cites (checked directly against
      execution_report.yaml), not reverted, and not composed around --
      this decision is scored against the ORIGINAL frozen archive at
      commit 11a799654, the same artifacts both reviewers evaluated.

  limitations:
    - >-
      This decision does not itself run the named replication; it only
      authorizes and specifies the next action.
    - >-
      The "more uniform than random" secondary direction the Red Team
      surfaced in aggregate (median variance ratio below 1 across both
      the archived cells and the 254 new curves) is explicitly NOT
      claimed as established here, consistent with the Red Team's own
      declination to claim it; it is named as a measurement direction for
      the future replication, not a finding of this decision.
    - >-
      Model-correlation confound, disclosed and this round partially
      broken: H-MONO-663fb4's own record flags that its producer and
      EV-MONO-a0a89c's reviewers all resolved to claude-opus-5. This
      round's Validator resolved to claude-sonnet-5 (per
      experiments/EXP-MONO-c819ba/reviews/validator/runtime-session-receipt.json,
      matching the Coordinator and Executor) while the Red Team was
      explicitly dispatched with model: opus and resolved to
      claude-opus-5 -- so the two reviews this round are cross-model, not
      mono-model, which strengthens rather than weakens their
      convergence, though it does not fully clear the historical
      confound across the hypothesis's whole evidence chain.

