  decision_type: hypothesis_status_transition
  authority_basis: >-
    Coordinator authority per AGENTS.md rule 1 (only the coordinator changes
    hypothesis status). This experiment executes under GOAL-MONO-001's
    (paused) authority as a small standalone alternative-branch experiment,
    drawing on none of that goal's exhausted campaign budget, per the
    precedent established this session under DEC-20260810-2f86db's own
    text and reused without re-asking for every one of this session's
    seven MONO experiment cycles.

  summary: >-
    EXP-MONO-c819ba (H-MONO-663fb4's frozen contract) is COMPLETE, with
    both independent reviews received and converged. Stage 0's exact
    identities (I1)-(I3), the subgroup positive control, and the
    coset-union positive control all independently reconfirmed by both
    the Validator and Red Team, exactly as archived. The run's own
    escalated finding -- a reproducible above-band signal on the j=0
    curve at F=N/2, escalated per the frozen contract's own
    falsification_criterion(d) rather than adjudicated by the Executor --
    is RETRACTED by two independent, convergent lines of evidence: the
    Validator refutes the candidate automorphism mechanism by direct
    orbit-structure computation and independently discovers, via a
    20,000-trial bootstrap recalibration, that the run's own pre-
    registered bands have an empirical false-positive rate of
    approximately 65% at m=4; the Red Team independently constructs 254
    new curves (124 fresh j=0, 130 matched random-ordinary) and finds NO
    j=0 enrichment for the escalation pattern whatsoever (12.1% vs 20.0%,
    Fisher p=0.092, direction opposite to the escalated claim), plus a
    draw-count-sensitivity flip, a null-object control showing the
    pattern is near-certain (P=0.996) under the null alone, a Bonferroni
    correction under which no cell survives, an already-latent falsifier
    in the archived data (curve J1728), and a genuine, disclosed
    violation of the frozen contract's own ordering_control stopping
    rule.

    The consequence: H-MONO-663fb4's core unconditional identities and
    both mandatory positive controls hold and are genuine, valuable,
    confirmed findings. Its actual PRIMARY discriminating question --
    whether the real x-coordinate factor base's character bias (K3/K4) is
    statistically distinguishable from a matched random symmetric subset
    -- is NOT answered by this run in either pre-registered direction
    ("controlled null confirmed" nor "exceptional locus found"), because
    the instrument's own null calibration at n=30 draws is demonstrated,
    convergently, to be inadequate for the heavy-tailed m>=3 statistic.
    This is a genuinely informative methodological result about the
    program's own toy-scale instrument family, not merely a null result
    on H-MONO-663fb4.

  hypothesis_status_before: proposed
  hypothesis_status_after: partially_supported_instrument_uncalibrated
  hypothesis_status_after_note: >-
    "partially_supported_instrument_uncalibrated" is used deliberately in
    place of either "supported" or "refuted": the identities and positive
    controls that ARE decidable from this run support H-MONO-663fb4's
    structural claims (I1)-(I3) exactly as derived; the run's headline
    discriminating question (P2/P3's empirical test, K3/K4) remains
    genuinely open, not refuted, because the instrument that was
    supposed to decide it is shown miscalibrated rather than having
    produced a trustworthy negative reading. Neither "supported" nor
    "refuted" alone would be honest; "weakened" was considered and
    rejected because the core mechanism claims were NOT weakened, only
    the one run's capacity to test the sharpest empirical prediction.

  experiment_status_before: approved
  experiment_status_after: completed

