  rationale:
    - >-
      The frozen approval rule permits approval only after an unqualified fresh
      independent PASS without dissent. RT-20260813-694f6c returned REVISE with
      six unresolved blocking objections, and TASK-20260813-91a099 faithfully
      recorded not_approved_revise. The Coordinator does not overrule them.
    - >-
      Fresh content-first custody passed completely: the exact v4 and
      self-neutral receipt bytes are bound to a reachable two-path commit and
      its exact actual first parent. That PASS is preserved separately from the
      protocol-design REVISE and does not rewrite the immutable v3 false-parent
      receipt.
    - >-
      Under the frozen odd-prime p, odd-prime full-group-order N, odd q, and
      Delta_pi=q^2*D_K semantics, Delta_pi is 5 modulo 8. The three D_K=-7
      rows and both D_K=-8 rows are impossible, so seeds 301, 302, 304, 305,
      and 308 cannot satisfy the required equality. V4 records only the three
      -7 rows, and its exact eight-row success conjunction cannot pass.
    - >-
      The paired calibration does not freeze an exact PRNG algorithm,
      seed-to-state conversion, version, and transitive source binding. Its
      prescribed property order also conflicts with RFC 8785, so the expected
      same-subseed bytes are not implementation-independent.
    - >-
      Gate 2 omits unique field-element, affine/projective point, infinity,
      polynomial, and exact big-integer encodings. It leaves the admissible
      discriminant list and enumeration ambiguous and lacks complete per-code
      rejection schemas plus exact serialized rejection bytes and hashes for
      the required fixtures.
    - >-
      V4's claimed canonical object property orders conflict with RFC 8785 and
      its JSON-number representation does not preserve exact integers above
      2^53. The construction and retained-rejection bytes remain non-unique.
    - >-
      V4 forbids converting undefined KS to nonrejection, while the exact bound
      decision.py sets a null rejects value to false and continues through a
      data-bearing branch. One executable decision rule is not frozen.
    - >-
      V4 changes missing fixtures and ambiguous algorithms from the frozen
      resource_incomplete class to invalid_before_target and locally labels a
      Gate-1 timeout invalid despite the global failed_infrastructure rule.
      The classification boundaries drift and conflict internally.
    - >-
      Gate 3's exact [40,43,46,49,52,55,58,60] schedule, Gate 4's complete GLV
      replay, endpoint-local whole-conductor equality, every unchanged v2
      control, and the source-bound 60-bit all-controls plus matched-rho/BSGS
      feasibility and rebudget firewall remain mandatory. These static design
      facts do not cure the blockers and are not scientific evidence.

