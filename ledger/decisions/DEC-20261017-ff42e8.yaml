# specification's controls or primary metrics. Sheriff case SHF-20261017-e4d7f6
# carried the escalation forward. Zero runs. No status changes.
coordinator_decision:
  id: DEC-20261017-ff42e8
  id_provenance: >-
    python3 tools/allocate_id.py --next coordinator_decision --date 20261017,
    then --check DEC-20261017-ff42e8: well-formed and free across the union.
  recorded_at: '2026-10-17'
  decided_at: '2026-10-17'
  decided_by: coordinator
  recorded_by: coordinator
  mode: audit_escalation
  sheriff_case: SHF-20261017-e4d7f6
  audit: experiments/EXP-IC-b75e3a/audits/AUD-20261016T230329Z-e28d7a/audit-review.yaml
  audit_finding: F1
  runbook_session: RBS-IC-f59d5a
  runbook_session_dir: experiments/EXP-IC-b75e3a/runbook-sessions/RBS-IC-f59d5a
  journal_tip: de068cfed775bd50dd668f9e687f6702bde608c3092f1aa28191eaf77bc2b12a
  archived_by: null
  archive_note: Committed on branch claude/coordinator-m2-triage; no dispatcher archive task.
  decision: revise
  decision_label: >-
    The EXP-IC-b75e3a runbook must be revised, or amended, so that it records
    the specification's nine controls and five primary metrics before any rerun
    executes. RBS-IC-f59d5a is not citable as evidence.
  target_ids:
    - EXP-IC-b75e3a
    - H-IC-4fb1db
  context: >-
    The reader review of audit AUD-20261016T230329Z-e28d7a flagged one minor
    finding, F1, with escalate: true. The specification
    (experiments/EXP-IC-b75e3a/specification.yaml, sha256 9957356c...) lists nine
    controls: dense same-cap shifts; the same-box exact/DP oracle; a size-matched
    random point base; permuted coordinate labels; a generic relabeled cyclic
    group; planted versus uniform law; coefficient-independent but
    positive-dimensional multiples; nonrational/outside-G modular roots; and
    univariate finite-field root finding. It lists five primary metrics: subgroup
    admission and all-target m2/3/5 density; weighted integer-row-lattice
    preservation; zero-dimensional systems with independently checked roots;
    complete m2/3 reductions with m5 density and tree height; and per-phase cost
    vectors. The runbook (experiments/EXP-IC-b75e3a/runbook.yaml, sha256
    23a65769...) has controls: [] and one metric, scientific_cells_peak_rss. Its
    validity asserts only that /cases is an array and /checks an object. A
    completed session would therefore not attest that any control ran, or what
    any primary metric was.
    The session itself stopped before any trial ran. S01-trials attempt 1 exited
    2 because a sparse checkout left the run directories off disk; the runbook
    classes that as infrastructure_error. It has 0 valid units and a metric with
    n = 0. The deterministic audit is clean, and the journal records the stop
    faithfully.
  rulings:
    - id: R1
      ruling: >-
        Before any rerun of EXP-IC-b75e3a under the runbook path, under any new
        session id, the runbook must cover every control and every primary metric.
        This is done by a revised runbook version or a protocol amendment
        (experiments/EXP-IC-b75e3a/amendments/), approved before execution. For
        each of the nine controls, the runbook must record that the control ran,
        and its outcome, as a journaled metric or validity assertion read from
        raw-result.json. For each of the five primary metrics, it must record the
        value, or an explicit not-computed/inadmissible reason, as a runbook
        metric with a JSON pointer into raw-result.json. Delegating the controls
        and metrics wholesale to the trial's own checker does not satisfy this
        ruling.
    - id: R2
      ruling: >-
        RBS-IC-f59d5a is not citable as evidence, for or against H-IC-4fb1db or
        any other claim. It measured nothing. Its infrastructure stop is not
        evidence against the hypothesis (AGENTS.md core rule 5). Its journal may
        be cited only as a record of that stop.
    - id: R3
      ruling: >-
        Nothing in the session, the audit or the runbook is edited. The
        specification's scientific schedule is unchanged. This ruling adds a
        precondition for execution, not a new scientific requirement.
  rationale:
    - >-
      AGENTS.md core rule 3: an experiment defines controls and metrics before
      execution. A runbook that cannot attest them makes a completed session
      unauditable on exactly the points the specification froze.
    - >-
      The audit-runs contract (.claude/skills/audit-runs/SKILL.md) leaves
      escalated flags to the Coordinator. The flag concerns coverage, not
      integrity, so the session's own record stands as written.
  next_action: >-
    Write the runbook revision or amendment for EXP-IC-b75e3a (a design-experiment
    task under Coordinator authority) before /run EXP-IC-b75e3a under the runbook path.
  knowledge_promotion:
    promoted: []
    not_warranted: Audit-escalation ruling on a session that measured nothing.
  amazon_bedrock: NOT SELECTED
