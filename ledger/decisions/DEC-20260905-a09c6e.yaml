coordinator_decision:
  id: DEC-20260905-a09c6e
  context: >-
    Approve the bounded operational delivery diagnostic proposed after
    DEC-20260905-518d05 recorded two reportless integrity attempts. The parent
    reports the user's explicit authorization to continue this diagnostic.
    This Coordinator reviewed the supplied parent capsule and previously
    supplied role text, not the underlying local files. The predecessor is
    DEC-20260905-518d05; reserved DEC-20260905-293536 is a future disposition,
    not existing evidence or authority.
  decision: approve
  decided_by: coordinator
  target_ids:
    - GOAL-SATIC-c49b77
    - BATCH-cef2eb
    - TASK-20260905-1134be
  rationale:
    - >-
      Rank one bounded diagnostic of startup, early file creation, and durable
      report delivery ahead of another substantially identical integrity-review
      attempt. This follows the goal's recorded next action and can distinguish
      observed missing delivery events without inferring their cause. It is an
      operational diagnostic, not an independent evidence review, scientific
      experiment, or mathematical status transition.
    - >-
      Use one fresh native Validator binding with no inherited conversation,
      requested policy review-adversarial at xhigh, no fallback, and no
      degradation. The hard wall cap is 600 seconds from parent dispatch;
      start.json has an early target of at most 180 seconds, new work stops
      at 540 seconds, and report.json must be delivered by 600 seconds.
      Record a missed early target even if final delivery succeeds. This new
      budget does not amend either predecessor's expired cap. Memory_gb is
      null because native model memory is unmeasured and uncontrolled.
    - >-
      The first tool obtains actual UTC time and reads mandatory AGENTS.md and
      agents/validator.md. The worker then reads its short frozen handoff and
      contract and invokes only the precommitted standard-library probe's
      begin and finish operations. Begin creates a write-once, fsynced
      start.json. Finish reads and hashes that receipt and creates a
      write-once, fsynced report.json binding the exact frozen diagnostic
      nonce, start-file SHA-256, actual timestamps, and actual git HEAD.
      The final native reply names the two output paths. No report is
      transcribed or invented by the parent on the worker's behalf.
    - >-
      Bound each input and aggregate reads to 1 MiB and each output to 8 KiB.
      The probe may perform only local reads, SHA-256, JSON writes to the two
      declared output paths, and read-only git rev-parse. No solver or version
      calls, network, installation, resource-limit retry, research run, worker
      commit, or modification outside the worker's write scope is authorized.
      Bedrock is prohibited. Preserve every existing receipt unchanged.
    - >-
      Success requires both files to parse, exact nonce round-trip, a correct
      start-file hash binding, and parent observation bounding emission within
      600 seconds, with actual timing and deviations disclosed. Helper-reported
      timing alone cannot prove the parent's observation bound. Failure or
      incompleteness identifies the exact missing event or integrity mismatch;
      no inference about the model or infrastructure cause is authorized.
  evidence_refs:
    - ledger/decisions/DEC-20260905-518d05.yaml
    - ledger/goals/GOAL-SATIC-c49b77.yaml
  limitations:
    - >-
      Provenance: internal, parent-supplied capsule only. The parent reports
      clean branch codex/satic-campaign-20260905 at
      be61ec27dbc29243dd5b7304ec4101d72b054896 equal to remote,
      current-main synchronization, canonical Codex preflight READY, checked
      allocated identifiers, and PR 751 open, draft, and mergeable with KB
      passing and ledger CI pending. These are not independent checks by this
      Coordinator. The exact resolved model remains null or unverified;
      requested policy must not be represented as a verified model identity.
    - >-
      The original sparse app checkout is an explicit writable transport.
      Its actual HEAD must be recorded, not replaced with the full SSD
      checkout's revision. Parent observation occurs at that transport before
      byte-for-byte transfer into the full repository. Agent/helper-reported
      first-tool time remains labelled as such unless the parent has an
      exposed tool receipt; unavailable telemetry must remain unavailable.
    - >-
      Neither diagnostic outcome clears the missing independent-review or
      resource-handling impediment, establishes scientific evidence, completes
      the goal, or authorizes scientific expansion. The goal remains active.
      This administrative handoff has review_plan null; it authorizes no
      claim-changing review round or independent attestation. Zero scientific
      experiments are admitted, and no scientific focus-tool PASS is asserted.
  next_actions:
    - >-
      TASK-20260905-d22b76 must commit this decision, the exact bounded helper,
      frozen contract including its fixed nonce, four handoffs, and focus and
      preflight records. Before dispatch, the parent must validate the matching
      package, archive bindings, applicable ledger and hygiene gates, publish
      it, and establish an eligible queue and exclusive claim. A mismatch or
      inability to serve the requested policy prevents execution under this
      approval. This record alone asserts none of those gates has completed.
    - >-
      Dispatch TASK-20260905-1134be with exclusive outputs
      coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-cef2eb/tasks/TASK-20260905-1134be/start.json
      and
      coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-cef2eb/tasks/TASK-20260905-1134be/report.json.
      Parent separately records dispatch, spawn-return, available first-tool
      receipt, start-file availability, completion-file availability, finish,
      and deadline observations in
      coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-cef2eb/archives/TASK-20260905-5dd82d/observer.json.
      Enforce the hard cutoff and disclose any enforcement deviation; no
      same-task retry is authorized.
    - >-
      TASK-20260905-5dd82d must preserve actual worker outputs, or clearly
      parent-authored terminal records when missing, together with the observer
      and a subsequently authored DEC-20260905-293536 and justified goal
      next_action. Verify exact storage bindings and publication without
      defaulting to completion when files are absent. After demonstrated
      delivery, rank separately approved independent integrity review next;
      after failure, rank a narrow dispatch, tool, or path diagnostic based
      on collected telemetry. Neither successor is approved here.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an operational delivery diagnostic establishes no scientific finding or knowledge promotion.
