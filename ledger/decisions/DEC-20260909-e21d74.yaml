  rationale:
    - >-
      The selected ECC idea has a complete falsifiable draft with fixed selector,
      typed comparison, four controls, stopping rules, custody requirements,
      and an explicit no-cryptanalysis boundary.
    - >-
      Its duplicate boundary against EXP-JINV-606dce remains deliberately
      unresolved until source-bound corpus and comparison rows exist; a design
      review must challenge the mechanism rather than infer non-duplication.
    - >-
      Standing user authorization permits the review. It does not waive the
      remaining source, implementation, control, custody, and authority gates.
  coordinator_prior:
    expectation: >-
