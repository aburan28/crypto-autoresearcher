coordinator_decision:
  id: DEC-20260811-af68d1
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-74ebef

  context: >-
    Written while merging origin/main a second time (tip advanced
    44525b6f -> 9480acde since this branch's first 2026-08-10 merge,
    b8383fdb) before pushing this batch's EXP-ICINV-e0cd8f evidence review.
    Unlike the first merge, the merge-base overlap check found TWO
    colliding paths, not one: ledger/goals/GOAL-ENDO-001/goal.yaml (the
    same recurring shared-narrative-field collision DEC-20260810-d82c61
    already documents the mechanics of) and, this time,
    experiments/EXP-ICINV-4d33aa/amendments/v3.yaml itself -- an actual
    FILE-IDENTITY collision, not merely a narrative one. This decision
    documents it and states the resolution taken, following the same
    non-destructive, no-side-favored discipline as DEC-20260810-d82c61,
    which this record extends rather than edits.

  decision: pause

  target_ids:
  - GOAL-ENDO-001
  - BATCH-74ebef
  - BATCH-de621d
  - EXP-ICINV-4d33aa
  - RQ-ICINV-475b5e
  - DEC-20260810-d82c61
  - DEC-20260810-6b4554
  - DEC-20260810-3110d5
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v3-BATCH-de621d-unexecuted-alternate.yaml

  rationale:
  - >-
    A THIRD CONCURRENT DESIGN FOR THE SAME SR3 REDESIGN, DISCOVERED AT THIS
    MERGE. origin/main (already merged before this branch saw it) carries
    BATCH-de621d, a third session that ALSO authored a version-3
    protocol_amendment for EXP-ICINV-4d33aa, citing the SAME
    DEC-20260809-de11f9 candidate list and ALSO recording that "the user
    elected candidate (b)" (its own authority record: DEC-20260810-6b4554).
    Its concrete design is a THIRD, different mechanism from either already
    documented in DEC-20260810-d82c61: standardised per-row z/w statistics
    (|z|<=3.5, |w|<=3.5) with an explicit Sidak multiple-comparison
    correction over a 13-row x 2-prime x 2-statistic = 52-test family, PLUS
    a required per-curve exactness comparison against reference per-curve
    rates. That last requirement was found by BATCH-de621d's own dispatched
    review (VAL-20260810-48202a) to be unsatisfiable as written -- the
    referenced per-curve rates do not exist in any committed artifact and
    change A9 forbids re-measuring them (finding F-V1.4) -- so
    BATCH-de621d's own v3 is FROZEN but explicitly BLOCKED FROM EXECUTION
    ("NO EXECUTION UNTIL F-V1.4 IS RESOLVED"), and BATCH-de621d itself was
    already closed by its own originating session with disposition `refine`
    (DEC-20260810-3110d5) before this branch ever saw it. Zero runs were
    executed under it.
  - >-
    THIS IS NOW THREE INDEPENDENT SESSIONS CLAIMING "THE USER ELECTED
    CANDIDATE (b)" AND EACH BUILDING A DIFFERENT CONCRETE MECHANISM FOR IT.
    This branch's own v3.yaml (Wilson-Hilferty parametric CI, later refined
    to two one-sided tests in v4): executed, reviewed, adjudicated
    (DEC-20260810-cc6577). BATCH-d7e255's design (an empirical per-density-
    row sampling-distribution instrument, EXP-INSTR-36c8cf): approved, not
    yet dispatched. BATCH-de621d's design (standardised z/w statistics with
    Sidak correction): frozen, blocked, its own batch already closed. As
    DEC-20260810-d82c61 already states for the first two, this Coordinator
    still has no visibility into which (or how many) of these three
    correspond to an actual, distinct conversation with the user, and does
    not guess. The pattern repeating a third time is itself worth naming
    plainly: this goal has now produced three independently-designed
    answers to what was intended as one user decision, none aware of the
    other two while working.
  - >-
    THE FILE-PATH COLLISION IS RESOLVED NON-DESTRUCTIVELY, FAVOURING THE
    EXECUTED DESIGN, WITH BOTH SIDES' FULL CONTENT PRESERVED. This branch's
    v3.yaml is not merely a draft: it is the basis of an executed run
    (RUN-ICINV-849d1d), two independent reviews, an adjudicated decision
    (DEC-20260810-cc6577), a corrections record (CORR-20260810-a4c123), an
    evidence record (EV-ENDO-eb58c4), and a further amendment (v4.yaml)
    already built on top of it and already independently reasoned about by
    this Coordinator and, eventually, the user. Moving, renaming or
    editing it would break that whole chain's own path references and
    would violate AGENTS.md rule 4 far more seriously than resolving a
    file-add collision does. BATCH-de621d's own v3.yaml, by contrast, was
    never executed and its own originating batch is already closed pending
    a v4 that does not yet exist. This decision therefore keeps this
    branch's v3.yaml at its canonical path UNCHANGED, and preserves
    BATCH-de621d's full v3.yaml content, byte-for-byte, at
    experiments/EXP-ICINV-4d33aa/amendments/v3-BATCH-de621d-unexecuted-alternate.yaml
    -- a new path chosen to make its provenance and status legible without
    either deleting it or letting it silently masquerade as the
    experiment's canonical version 3.
  - >-
    THIS DOES NOT ADJUDICATE, ENDORSE, OR DISMISS BATCH-de621d's OWN WORK.
    Its z/w-statistic design, its Sidak correction, and its own review
    findings (F-V1.4 among others) are preserved in full at the new path
    and remain available for a future Coordinator to draw on -- possibly
    as an improvement over this branch's own v4 false-pass-rate fix, since
    neither design has been compared against the other on any shared
    standard. That comparison is not attempted here. BATCH-de621d's own
    CANL/L9-adjacent findings (N14 in its closing next_action text,
    concerning RQ-CANL-63098f) are noted but NOT investigated by this
    decision; they do not collide with this branch's own EXP-CANL-96b0ad
    at the file level (no shared path, no shared experiment ID -- BATCH-de621d's
    L9 material is an analytical/theoretical closure of a different sub-
    question, zero runs executed), but the same underlying pattern this
    decision names for the SR3 gate -- concurrent sessions independently
    working related material without visibility into each other -- may
    apply there too, and is flagged for the user's awareness rather than
    audited here.
  - >-
    WHY `pause` AND NOT A UNILATERAL RESOLUTION, SAME REASONING AS
    DEC-20260810-d82c61. This Coordinator already benefits from having
    executed first; ruling on which of three SR3 designs is best from
    inside the branch that already has one running would repeat the exact
    self-serving-outcome risk DEC-20260810-d82c61 already named. This
    decision resolves the MECHANICAL collision (one file cannot hold three
    designs) without resolving the SUBSTANTIVE one (which design, if any,
    should be the campaign's actual SR3-v3).

  evidence_refs:
  - DEC-20260810-d82c61
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  - experiments/EXP-ICINV-4d33aa/amendments/v3-BATCH-de621d-unexecuted-alternate.yaml
  - ledger/decisions/DEC-20260810-6b4554.yaml
  - ledger/decisions/DEC-20260810-3110d5.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/reviews/validator/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/reviews/red-team/red_team_report.md

  limitations:
  - >-
    This Coordinator read BATCH-de621d's own v3.yaml, its approval
    decision, and its validator report, but did not attempt to independently
    verify BATCH-de621d's own review findings (F-V1.4 and others) the way
    this Coordinator independently re-verified its own branch's work
    throughout this session. They are taken as reported, pending any future
    session that wants to build on that design.
  - >-
    BATCH-de621d's CANL/L9-adjacent material is explicitly NOT audited
    here; this is a named gap, not a completed check.
  - Toy scale throughout; no measurement is reported by this decision itself.

  next_actions:
  - >-
    Present to the user, alongside DEC-20260810-d82c61's own still-open
    question: three SR3-v3 designs now exist for EXP-ICINV-4d33aa. Decide
    whether to run more than one as independent cross-checks, retire some,
    or something else -- not decided here.
  - >-
    If BATCH-de621d's design is ever picked up again, its own next required
    step (per its closing next_action, carried in that batch's own record)
    is a v4 resolving finding F-V1.4 (the per-curve exactness requirement
    against non-existent reference data) before any execution. This is a
    DIFFERENT v4 from this branch's own experiments/EXP-ICINV-4d33aa/amendments/v4.yaml,
    which fixes a different defect (this branch's v3's false-pass-rate gap)
    in a different design; the two are not interchangeable and neither
    supersedes the other.
  - >-
    Investigate whether BATCH-de621d's CANL/L9 material and this branch's
    own H-CANL-e59a06/EXP-CANL-96b0ad thread are complementary,
    overlapping, or independent -- flagged, not performed, by this
    decision.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a process/coordination record about a third instance of
      concurrent authorship, not a research result.

  decided_by: coordinator
  decided_at: '2026-08-11'

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one
      model the session runs on. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: No adapter probe receipt exists for this session.
