  target_ids:
  - EXP-ECDLP-1b1b99
  - TASK-20260908-5e3d88
  - TASK-20260908-aeaf88
  context: Complete the full CM contract with closed serialized cost/allocation/manifest schemas while preserving
    the independently confirmed mathematics and reducers.
  rationale:
  - Accept the four exact serialized-definition findings from the archived independent review. Its127fixedchecks
    were within160 and all28declared hashes matched. The review confirms normalized selection,global/table lifetimes,integer
    allocation/Med7/Med6,all36gates andper-cellqstar; preserve those definitions.
  - A prose-only patch would leave the same source of ambiguity. The complete successor must include a self-contained
    machine-readable JSON Schema and explicit cross-field semantic predicates with fixed valid/invalid examples.
    This is definition work,not a scientific implementation or run.
  - Use the governing run manifest nesting and plural fields under run; preserve every minimum field. Define actual-only,selection-score
    andcold scenario/target unions,closed plane/phase/stratum identities,and exact unavailable-resource encodings.
  - Standing authorization is sufficient. Draft remains unapproved and needs independent definition review; no hypothesis
    or measurement transition.
  accepted_findings:
  - id: CM-DEFINITION-COST-SCENARIO-TARGET-001
    required_correction: Define a closed tagged scenario union, including exact cold(q,seed), selection-score(candidate/stratum
      as needed), and actual-only variants; define a canonical JSON target union and the exact uniqueness key for
      each variant. State which raw families require, forbid, or omit allocation edges and how actual-only edges
      reconcile without q/seed copies.
  - id: CM-DEFINITION-COST-AXES-002
    required_correction: Enumerate canonical plane tokens and their exact axis domains; enumerate phase tokens and
      allowed component/phase/scope triples; either derive and omit stratum or define its canonical identifier and
      consistency equation. Include these fields in typed duplicate detection after canonicalization.
  - id: CM-DEFINITION-MANIFEST-XREF-003
    required_correction: Bind one complete manifest schema with exact nesting and field names, or explicitly state
      and justify the experiment-specific override while preserving every governing minimum field and semantic requirement.
  - id: CM-DEFINITION-COST-UNAVAILABLE-004
    required_correction: Define exact tagged JSON unions or companion reason-code fields and their required/forbidden
      conditions for measured, unavailable, partial and infrastructure-stopped values.
  approved_correction_boundaries:
  - Keep every scientific sample,fixture,seed,arm,control,threshold,scope and exact scalar/public-trust binding
    unchanged.
  - Use canonical closed tagged JSON scenario and target objects; actual-only events get no fabricated q/seed; logical
    uniqueness operates on canonical semantic keys. Explicitly enumerate required/forbidden allocation edges for
    all raw families and charge kinds,including failed/partial and derived rollups.
  - Close every scientific axis and plane/phase domain. Derive redundant strata from interval/coordinate or encode
    them canonically with equality constraints. Controls on the source curve must not acquire fake endpoint or kernel
    axes; provide exact control-owner variants if required by existing control matrices.
  - Provide an exhaustive component/phase/scope table,integer/resource types,complete/partial/unavailable branches
    and reasons,with no catch-all aliases or invented zero cost. Preserve integer setup remainders and exact rational
    workload normalization.
  - Bind a complete manifest schema under run with code,inference,environment,inputs,timing,resources,result,artifacts
    and all governing minimum fields; preserve exact run/source/runtime/custody semantic requirements.
  - New schemas and check predicates are prospective definitions only. The static checker may use installed jsonschema4.26.0
    and record that version; this is not a replacement of the pinned future arithmetic runtime.
