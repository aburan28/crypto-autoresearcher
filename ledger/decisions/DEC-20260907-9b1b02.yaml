  decision: support
  decision_rationale_for_verb: >-
    `support` is recorded, SCOPED EXTREMELY NARROWLY, to exactly one claim:
    at N = 2^24, r = 2, T_sel = T/2 EXACTLY (clause (C1) as originally
    stated), a = 1/16 is CONFIRMED G3-FEASIBLE by TWO INDEPENDENT METHODS
    agreeing in sign on every one of 5 seeds each -- Stage A's sealed,
    from-scratch blind re-derivation (5/5, margins all positive) and Stage
    B/C's production reading (5/5, margins all positive, reusing the v1/v2
    instrument). This is S1 CONFIRMED FEASIBLE per specification.yaml's own
    `success_criterion`, and per its own `distinguishable_outcomes` (a):
    "Clause (C1) of H-ECDLP-37dc01 is REOPENED at the confirmed smaller a --
    a materially more interesting result than anything scored in
    EV-ECDLP-f6b3f5 or EV-ECDLP-60e266." This is a real, positive, cleanly
    discriminating finding and per the task's own explicit instruction it is
    not to be buried under a = 1/8's more complicated story. `support` is
    chosen over `inconclusive` for the RECORD AS A WHOLE because a = 1/16's
    result is not indeterminate -- it is clean, replicated by construction
    (two independent implementations), and reportable on its own -- and
    choosing `inconclusive` for the whole record would understate that
    finding exactly as CLAUDE.md's premature-closure-symmetric-with-
    overclaiming principle warns against doing in the other direction.
    HOWEVER this verb explicitly does NOT extend to: (i) a = 1/8, which
    remains S3 DISAGREEMENT at the literal sealed level (blind 1/5
    INFEASIBLE vs production 5/5 FEASIBLE) with a demonstrated, checkable,
    non-computational root cause (a units/definition underspecification in
    specification.yaml's own `definitions.STATIC(T)_r exact coverage` text)
    but NO re-sealed independent re-derivation under a corrected definition
    -- reported here as OPEN, not as CONFIRMED FEASIBLE, not as CONFIRMED
    INFEASIBLE, and not folded silently into either; (ii) the crossing
    bracket, which per specification.yaml's own escape clause is reported as
    "not cleanly confirmed at N = 2^24" at the literal sealed level (a
    root-cause-corrected, non-blind diagnostic does corroborate production's
    (1/8, 3/16) bracket, but that diagnostic is explicitly not a re-seal and
    is reported as diagnostic, not confirmatory); (iii) H-ECDLP-37dc01's
    `status`, which per specification.yaml's own `interpretation` a
    CONFIRMED-FEASIBLE ceiling result does not by itself support or promote
    (it reopens a QUESTION at a = 1/16, not a demonstrated online-mechanism
    RESULT); (iv) any statement that the online LOWER-bracket re-selection
    mechanism actually reaches the confirmed ceiling at any achievable batch
    size U (zero online arms are run by this contract at any a). NOT
    `weaken` or `reject_scoped`: nothing here contradicts H-ECDLP-37dc01 at a
    pre-registered effect size -- if anything the confirmed a = 1/16 result
    is the most positive finding this hypothesis's lane has produced.
    NOT `inconclusive` for the whole record: a = 1/16, a = 3/16, and the
    a = 1/4 control all resolve cleanly under both readings; only a = 1/8
    does not, and that single cell's disagreement is itself explicitly
    reported (via EV-ECDLP-2e9680's own `a_1_8_disagreement` block) rather
    than smoothed into a whole-record verdict that would erase the
    distinction between "confirmed feasible," "confirmed infeasible," and
    "genuinely disputed with a diagnosed cause."
