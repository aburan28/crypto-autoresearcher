  disposition_per_contract:
    EXP_ECDLP_6ac801:
      outcome: >-
        Per specification.yaml `success_criterion`: Stage A sealed (PASS);
        a = 1/4 replication control reproduced INFEASIBLE under both
        readings (PASS); a = 1/16 CONFIRMED FEASIBLE (S1, both readings
        agree); a = 3/16 CONFIRMED INFEASIBLE (S2, both readings agree);
        a = 1/8 DISAGREEMENT (S3, literal sealed level) with a demonstrated,
        checkable, non-computational root cause (a specification
        underspecification in the STATIC(T)_r selection-weight formula) that
        a controlled post-seal diagnostic corroborates but does not, by this
        contract's own text, resolve without a fresh re-seal. OVERALL
        crossing bracket: "not cleanly confirmed at N = 2^24" at the literal
        level, per the contract's own escape clause; the diagnosed root
        cause corroborates production's (1/8, 3/16) bracket as a diagnostic
        reading, not a confirmed one.
      what_is_established_toy_tier: >-
        At N = 2^24, r = 2, T_sel = T/2 exactly, on the generic instrument:
        clause (C1) of H-ECDLP-37dc01, ALREADY established infeasible at
        a = 1/4 (EV-ECDLP-60e266), is now independently, blindly CONFIRMED
        G3-feasible at a = 1/16 -- a genuine ceiling-feasibility finding,
        the first of its kind for this clause outside a = 1/4's own
        established infeasibility, backed by two structurally independent
        implementations agreeing in sign on every seed. a = 3/16 and a = 1/4
        are both confirmed to remain infeasible at this T_sel under both
        methods. The measurement apparatus itself (the sealed
        blind-re-derivation procedure, the proves-too-much control at
        a = 1/4, the exact-coverage non-exceedance control) is independently
        confirmed sound with no breaking finding on those specific checks.
      what_is_NOT_established: >-
        (1) a = 1/8's feasibility is genuinely OPEN: the sealed-level
        disagreement is diagnosed (a definitional gap in the frozen
        contract's own text) but not resolved by a properly re-sealed
        independent re-derivation under a corrected definition; this record
        does not report a = 1/8 as feasible OR infeasible. (2) The a = 1/16
        CONFIRMED-FEASIBLE result is a CEILING-FEASIBILITY finding only, per
        the contract's own `interpretation`: it does not demonstrate that
        the online LOWER-bracket re-selection mechanism (the algorithm
        H-ECDLP-37dc01's own `mechanism` field describes -- admitting solved
        walks round by round) actually reaches that ceiling at any
        achievable batch size U. Zero online RESEL-L arms are run by this
        contract at any a. (3) The crossing bracket between the confirmed
        feasible and confirmed infeasible region is not cleanly located at
        N = 2^24 pending a = 1/8's resolution. (4) None of EV-ECDLP-f6b3f5's
        own open items (the S2_v2 magnitude confound, the missing permanent
        null-collapse fixture, the G3 N=2^30 disclosure mismatch) are
        touched by this narrowly-scoped batch.

  rationale:
    - >-
      specification.yaml's own `success_criterion` and
      `distinguishable_outcomes` are the ONLY criteria applied, exactly as
      written, per-cell, with no criterion changed after observing outcomes:
      S1/S2/S3 are read directly off the blind-vs-production comparison at
      each a, not composited into one number that would erase the
      distinction between a clean confirmation and a genuine disagreement.
    - >-
      Per the task's own explicit instruction and per AGENTS.md's
      premature-closure-symmetric-with-overclaiming principle: a = 1/16's
      clean, independently-confirmed result is reported as its own headline
      finding and is not diluted by a = 1/8's more complicated story, nor is
      a = 1/8's genuine disagreement smoothed over to make the batch read as
      a cleaner win than it is. Both directions of dishonesty (burying a
      real positive result; papering over a real disagreement) are refused
      symmetrically.
    - >-
      The a = 1/8 root cause is treated as DIAGNOSED, not RESOLVED. The
      validator's own report explicitly declined to make the relabeling
      call ("that is the Coordinator's call"); this Coordinator declines it
      too, for a stated reason: the diagnostic that isolates the
      selection-rule variable is a controlled, single-pass, POST-SEAL
      computation, not an independently pre-registered, sealed blind
      re-derivation performed under a corrected definition. Treating a
      post-hoc diagnostic as equivalent to this program's own required
      blind-rederivation discipline would be exactly the kind of
      protocol-erosion AGENTS.md and this contract's own
      `blind_rederivation.non_negotiable_note` exist to prevent -- the
      discrepancy this contract investigates was ITSELF found by re-reading
      the same table twice by two arithmetic routes, and the entire point of
      requiring a sealed blind re-derivation was to move past exactly that
      failure mode. Accepting a second post-hoc reading in its place would
      undo the contract's own purpose even though, in this specific
      instance, the diagnosis looks correct on inspection.
    - >-
      The underlying finding -- that a re-selected T/2 table's ceiling at
      a = 1/16 genuinely exceeds STATIC(T)'s coverage on this instrument,
      confirmed by construction-independent methods -- is exactly the kind
      of plausible, higher-value lead AGENTS.md forbids steering away from.
      It is reported plainly, cited with exact run and sealed-artifact IDs,
      and carried into `next_actions` as a concrete, ranked follow-up rather
      than left to sit as a footnote next to a = 1/8's unresolved status.
    - >-
      Under the roadmap bias toward exponent-targeting mechanisms
      (CLAUDE.md), this experiment and its result remain a bounded,
      constant-factor, toy-scale ceiling measurement under KN-LIT-013: no
      exponent is claimed or approached, and per specification.yaml's own
      `interpretation` this contract cannot license any exponent statement
      regardless of outcome. The confirmed a = 1/16 finding is ranked as
      worth a follow-up specifically because it reopens a QUESTION about
      this mechanism at a previously untested operating point, not because
      it moves any exponent.
    - >-
      This experiment's own `review_note` recommended, but did not mandate,
      a second (red-team) reviewer given its narrow scope; the Coordinator's
      approval did not add one. No breaking finding on the measurement
      apparatus itself (the seal, the proves-too-much control, the
      exact-coverage control) surfaced without a second reviewer, but the
      absence of an independent red-team pass on the validator's own Stage A
      implementation (beyond its self-administered N=1024 brute-force check)
      is named here rather than left implicit.
