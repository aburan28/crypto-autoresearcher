  controls_and_limits:
    - Six separately planted positives at m=2 and m=8, with independently checked exact witnesses before interpreting unit-ideal results.
    - Twenty-one archived natural common-target cells, one target per m and three equal-size precomputed arms.
    - Per-cell 300-second, 8-GiB sampled RSS and 8-GiB scratch limits; one worker, 64-model guard, four-hour panel and exact raw tar custody.
    - The additive guard is check_argv; a positive certified_no_solution contradiction is invalid, while a bounded cap is censored.
