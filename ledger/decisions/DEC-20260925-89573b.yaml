        and EXP-NISTBIN-8d210c needs a new Coordinator decision and is never
        improvised. Lane B has no form (ii).
    - id: R-NA4
      subject: DEC-20260924-286589 NA-4, the bit-movement framing in DEC-20260924-99ce20 S2 decision_it_changes (red-team INC-3 as that decision reports it)
      ruling: >-
        YES, an additive correction is needed, and it is written as
        ledger/corrections/CORR-20260925-649e25.yaml. DEC-20260924-99ce20 is not
        edited. Its S2 decision_it_changes (lines 292-305) states that the
        per-orbit unit "moves each Koblitz and subfield index-calculus margin by
        log2 k bits against the attacker", with two proposal figures in
        parentheses. It says this without the conditions that
        DEC-20260924-286589 R-J4 found missing from the lane-B contract's own
        scope sentences (O-8, O-9). The movement is conditional on an approved,
        reviewed contract. It applies per row, not to "each" row. It applies only
        where a named record's column counts k relations per solve, and where
        k, r and k | r - 1 are primary-sourced; rows recorded NOT COMPUTED are
        excluded (the five c2pnb rows, IMP-X962; DEC-20260924-286589 R-J5 and
        RL-C5). Left uncorrected, the lane-B version-2 producer could cite an
        official decision as authority for the exact framing its J4 must
        re-attack. The correction also scopes two sentences of
        DEC-20260924-f0a9c7 that restate the framing (rank 1
        evidence_it_beats_doing_nothing; target_profile_note). It changes no
        selection, scope, design condition, gate ruling, next-decision mapping
        or rank. CORR-20260925-0d6981 stays reserved and unused.
    - id: R-ONE-BATCH
      subject: whether one two-lane batch satisfies both NA-1s
      ruling: >-
        IT DOES, and no binding reason was found against it.
        DEC-20260924-124667 NA-1 asks for "ONE lane-A REVISION DESIGN batch". The
        word counts lane-A batches. It does not require a batch with no other
        lane. DEC-20260924-286589 NA-1 asks for "a lane-B REVISION DESIGN
        BATCH". Each NA-1's specific requirements are met lane by lane: a plan
        frozen with its prior before the producer; a fresh producer; a snapshot;
        independent reviews at the lane's tier; a fresh composer; and the lane's
        own ledger archive. The lanes share exactly three things: the
        preconditions (merge of origin/main, fetch, lane claims), this opening
        decision, and its ledger archive TASK-20260925-d2efb5. After card 2 they
        are independent, as in BATCH-7d29e8. Every dependency is inside a lane;
        a failed, invalid or unservable card blocks only its own lane's
        successors. DEC-20260924-286589 NA-1's precondition that
        DEC-20260924-124667's archive verify first is met (TASK-20260924-499d57
        verified, as reported). DEC-20260924-124667 NA-1's "within the goal's
        max_concurrent 3" is met: this batch runs at 2, leaving the third slot
        for the separately ranked QSP custody successor. One batch is also
        better for custody than two. It writes one additive checkpoint on the
        goal head and names one current_batch_id. Two concurrent openings would
        each prepend to the same next_action field and each claim the head's
        single current batch.
      no_cross_lane_ordering: >-
        Unlike BATCH-7d29e8, where lane A carried DEC-20260924-99ce20 NA-7, no
        cross-lane carry exists here. Each lane's composing decision carries only
        the hold revisits that name its own lane. Lane B carries HOLD-B, HOLD-C
        and HOLD-M (DEC-20260924-286589 R-HOLDS). Lane A carries the HOLD-F and
        HOLD-G row-set condition, if its revised row set changes it
        (DEC-20260924-124667 R-NA7). Either may be written first. The two ledger
        archives serialise only because archives run alone.
    - id: R-INFERENCE
      subject: inference provenance and servability of every tier in this batch
      ruling: >-
        Runtime: Cursor Cloud Agent run bc-01a0d6a5-6645-761d-a950-5920c3983d1a.
        Every subagent is launched with model "inherit", which is the session
        model, Cursor slug claude-opus-5-5-max (Claude Opus 5.5 at max effort).
        Every card records fallback_used true for runtime inheritance (backend
        substitution only), model_verified false (no python3 -m
        orchestration.adapter doctor --probe was run), degraded_allowed false,
        degraded_requirements none, and amazon_bedrock not selected, not
        configured and not contacted. Served effort max is below no policy in
        this batch. It EXCEEDS coordinator-orchestration-code (high) and
        review-adversarial (xhigh), and it MEETS review-breakthrough (max). The
        exceedance is disclosed here and on each card, so it is not a silent
        alteration under AGENTS.md rule 11. It is unknown whether this runtime
        applies the effort frontmatter of .claude/agents/*.md. Either way the
        served effort is not below policy. THEREFORE review-breakthrough at max
        IS SERVABLE in this runtime, through validator-breakthrough and
        red-team-breakthrough at inherited max. Lane A's non-degradable tier can
        be honoured, and lane B's escalation, if its test fires, can be served
        without a downgrade. The lane-A reviews of BATCH-7d29e8 ran on the same
        basis (DEC-20260924-124667 context).
      limits: >-
        "Servable" rests on the runtime's own report of model and effort,
        unverified by probe (model_verified false). Every role in this batch is
        served by one model, so independence is independence of SESSION and
        read scope, not of model. That matters to how much the agreement of
        the lane reviewers can carry, and it is recorded, not waived. If a
        launch finds max effort unavailable, a lane-A review card is not
        dispatched, the impediment is recorded, and the claim stays un-promoted.
        It is never replaced by a review-adversarial card.
