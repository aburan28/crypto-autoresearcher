        This sub-session read neither CERTBIN contract.
    - id: R-PREREVIEW-GATE
      subject: >-
        who owns, writes and binds each lane's pre-review gate (lane-A plan
        blind_rederivation.forward_precondition; lane-B plan
        transfer_to_the_blind_card, amendment_custody and forward_precondition),
        ruled under NA-1(a) before TASK-20260925-d2efb5
      resolves: >-
        The lane-B plan's PD-R7 and amendment_custody open question: the owner
        of A1 is TASK-20260925-6e5a63, declared on that card directly because S4
        and S5 had not started, so no sub-session is relaunched. As executed, S5a
        wrote card 6 from the top-level session's card table (PD-1). Also the lane-A
        plan's forward_precondition step (4): the archival owner is
        TASK-20260925-792b02. A1 is always written, which is stricter than the
        plan's "if written".
      ruling: >-
        EACH LANE'S SNAPSHOT CARD OWNS ITS GATE. The gate is part of that card's
        own work, and its files are bound in the snapshot's single isolated
        content_at_commit commit, with the producer's four paths and the
        receipt. Lane A: TASK-20260925-792b02. Lane B: TASK-20260925-6e5a63.
        Every gate file is ALWAYS written, so each declared artifact exists
        whatever the grep finds. When nothing is found the file says "no hits,
        no change" and is still committed. Each lane's reviewers depend on its
        snapshot, so the gate is committed and pushed before any reviewer of
        that lane is dispatched. No new card or identifier is needed.
      gate_files:
        TASK-20260925-792b02:
          - path: coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml
            writer: top-level session (mechanical)
            content: >-
              The grep command, and every hit as file:line, per the lane-A plan's
              forward_precondition steps (1)-(2). It may print search terms, so
              it is in lane-A blind_from and never whitelisted.
          - path: coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml
            writer: the gate sub-session
            content: >-
              Value-free, per the lane-A plan's forward_precondition step (3).
              Each hit is removed by a redaction or an exclusion, or recorded as
              a disclosed leak. The Q3 m-set and omega-set are pinned as
              parameters. It states, never as a value, any contract-specific
              degree-extension reading under which v2 freezes a D*(m), or states
              that v2 freezes no D*(m) value.
        TASK-20260925-6e5a63:
          - path: coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml
            writer: the gate sub-session
            content: >-
              Value-free, per the lane-B plan's transfer_to_the_blind_card. It
              carries only the NF ids and their definition texts, copied
              verbatim from the producer's revision worksheet
              (newly_frozen_values), and records "definition not separable" for
              any definition it cannot separate from its answer, or that
              contains a value. It also carries every whitelist exclusion, and
              every disclosed leak by file:line, that the grep orders. It
              carries no grep command, no search term and no escalation
              reading.
          - path: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/gate-worksheet.yaml
            writer: >-
              Two append-only parts. The top-level session writes part 1. The
              gate sub-session then appends part 2 and never edits part 1.
            content: >-
              Part 1: the raw grep, as a command template, with each hit as
              file:line and a term identifier (NF id or quantity name plus the
              v2 field path it was read from), never a value. Part 2: each hit
              classified PRIMARY-DATUM, COINCIDENTAL or ANSWER per the lane-B
              plan's forward_precondition, the ESC-B reading, and the per-NF
              copy and "not separable" calls, each citing v2 locations by
              file:line, never quoting a value. It sits under the BATCH-b67954
              directory, which the lane-B plan puts in blind_from, so it is never
              whitelisted.
            why_added: >-
              The gate's judgments need a durable record written by the session
              that made them. A launch reply is a message, not a deliverable.
          - receipt_blocks: >-
              The TASK-20260925-6e5a63 receipt records escalation_test (verdict
              "fires" or "does not fire", with the gate-worksheet path and its
              sha256) and blind_whitelist_value_grep (hits by file:line and
              class, without values). Both are copied from gate-worksheet part
              2, and both are in lane-B blind_from under its plan. The lane-B
              plan's alternative, recording in A1 "if the snapshot has already
              committed", does not arise, because the gate precedes the
              snapshot's commit.
      order_inside_each_snapshot_card: >-
        (1) The top-level session hashes the producer's four paths (pre-gate
        digests) and runs the R-FORM snapshot_checks. (2) It runs the lane's
        whitelist value grep and writes the mechanical record: lane A
        whitelist-grep-v2.yaml; lane B gate-worksheet part 1. (3) ONE fresh
        Coordinator gate sub-session, under coordinator-orchestration-code,
        whose write scope is only its gate files, writes the amendment (and, for
        lane B, gate-worksheet part 2). (4) The top-level session greps each
        amendment for every search term, as both plans require; any hit is a
        stop, and the gate sub-session rewrites. For lane B, the top-level
        session also checks that each copied definition text is a byte-exact
        substring of the producer's worksheet. (5) It re-hashes the producer's
        four paths against the pre-gate digests and stops on any difference, a
        custody failure. (6) It makes one isolated commit and writes the
        receipt, verifies, pushes and refreshes the PR.
      gate_session_independence: >-
        The gate sub-session is never the lane's producer, never a reviewer of
        either lane, and never later that lane's composer. It reads the
        producer's v2 files, the grep record and the plan. Its judgments are
        Coordinator procedure, not review verdicts, and they move no key of the
        plan.
      where_the_plans_name_the_top_level_session: >-
        Both plans bind "the top-level session" to steps that include
        judgments: the lane-A dispositions, the Q3 m-set, omega-set and
        degree-extension statement; the lane-B ESC-B reading, the hit classes
        and the "definition not separable" calls. Under this ruling the
        top-level session discharges those steps by dispatching the gate
        sub-session, which makes the judgments. The top-level session itself
        runs only the greps, hashing, verbatim checks and git, and records the
        gate's outputs verbatim. Tier decisions thereby stay with a Coordinator
        session. No plan text is edited (PD-8).
      composer_check: >-
        Each lane's gate files and receipt blocks are declared inputs of that
        lane's composer (TASK-20260925-6e7e13 for lane A, TASK-20260925-3c9c56
        for lane B). The composer is not blind. It checks that the gate followed
        this ruling: every gate file present, every hit disposed of, and the
        lane-B tier consistent with escalation_test. A misclassified hit, or a
        tier that does not follow the recorded test, is a procedure finding of
        the composing decision. It is disclosed there and never repaired by
        silently re-running a review.
      escb_fired_prompt: >-
        ADDED IN THE SECOND IN-PLACE AMENDMENT (PD-10). It rules the open point
        S5 recorded for TASK-20260925-2e6b10. If ESC-B fires, the lane-B plan's
        instruction to cite ESC-B FIRED in every launch prompt applies to
        TASK-20260925-104f6d and TASK-20260925-2333ea. It does NOT apply to the
        blind card TASK-20260925-2e6b10. That card's launch prompt still names
        only its card, blind-inputs.yaml and A1 (NA-4), because the fired
        reading is drawn from v2 and sits in blind_from. The blind card gets
        the fired tier only through its card's conditional inference and the
        validator-breakthrough binding. The gate sub-session applies this
        ruling rather than making it, and records the application in
        gate-worksheet part 2. It also records the residual channel: a blind
        reviewer can infer from its tier that ESC-B fired. The lane-B composer
        discloses the departure from the plan's wording as a procedure
        deviation of that plan.
    - id: R-CONTINUATION
      subject: runtime kills (a subagent is killed after about 30 minutes of activity, and no agent id is returned to resume it)
      ruling: >-
        (1) INCREMENTAL DELIVERABLES. Every producer (3, 4), gate sub-session
        (inside 5, 6), reviewer (7-12) and composer (13, 14) writes its
        deliverable incrementally. It writes a complete skeleton first: header,
        card id, the bound object digests, a procedure section, an attestation
        stub listing its session, and every joint or section marked pending.
        It then fills joint by joint or section by section. A joint or section
        counts as complete only when its verdict or content and its supporting
        artifact are written. (2) SAME CARD, SAME ROLE AND TIER. If a session is
        killed before its card completes, a FRESH session of the same role,
        tier and policy continues the SAME card. It works only from that card's
        own partial artifacts plus the card's declared inputs, and never reads
        a sibling's report. A card's own artifacts are not in its blind_from.
        The continuing session must meet every independence condition of the
        card, for example R-CARRIED R6 for producers or the blind card's
        blind_from. Before continuing it re-hashes the bound object against the
        digests in the skeleton, redoes any joint left incomplete from scratch
        (it never resumes mid-joint), and re-checks, rather than trusts, the
        artifact behind each completed joint. A composer re-hashes its lane's
        six reports against the digests its worksheet recorded first and
        against the launch prompt; a mismatch is a custody failure. (3)
        DISCLOSURE, NOT A NEW REVIEW. The report's procedure section records
        which sessions wrote it, what was already there, what was re-checked
        and what was redone. The card keeps its number. A continuation is a
        disclosed procedure deviation, not a new review and not a new
        composition. Every reviewer attestation names every session that wrote
        the report. The lane claim is renewed for the continuing session, and
        the kill is recorded as infrastructure, never as evidence, a verdict or
        a partial verdict (AGENTS.md core rule 5). (4) TWICE KILLED. If one card
        is killed twice without a complete joint or section being added, the
        top-level session stops it. It records an impediment on the card (a
        tasks_state_revisions entry in the queue, plus a bus pointer). A later
        Coordinator decision splits the card, with new ids minted by the
        top-level session and any joint reassignment recorded as a
        procedure_deviation of the lane's plan. The card is never silently
        narrowed, and a joint is never dropped.
      limits: >-
        Untested in this program. If tools/check_review_independence.py cannot
        parse a multi-session attestation, that is a tooling impediment recorded
        by the top-level session, never a pass. A continued blind card's
        blindness rests on each session's attestation, and --blind-history
        remains UNCHECKABLE (R-CARRIED R8).

