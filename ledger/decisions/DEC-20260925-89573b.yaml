  rulings:
    - id: R-FORM
      subject: record form and exact producer write paths, both lanes (DEC-20260924-124667 NA-1; DEC-20260924-286589 NA-1)
      ruling: >-
        FORM (i), VERSION 2 UNDER THE SAME IDENTIFIERS, IN BOTH LANES, WITH ONE
        PHYSICAL LAYOUT (the EXP-ECDLP-6ac801 precedent). (1) The canonical path
        experiments/<EXP>/specification.yaml carries version 2: the complete
        revised contract, version 2, status review_required, approved_by null,
        an approval block stating that it is approved if and only if the lane's
        composing decision is official with decision approve naming
        "<EXP> version 2", and a prior_versions block naming the frozen v1 path,
        the v1 sha256 and the v1 binding task. (2) Version 1 is preserved byte
        for byte at experiments/<EXP>/specification.v1-frozen-<sha8>.yaml, where
        sha8 is the first eight hex digits of the digest the v1 snapshot receipt
        records. The copy is made MECHANICALLY by the top-level session before
        TASK-20260925-d2efb5 stages, from the v1 snapshot commit (git show
        <that commit>:experiments/<EXP>/specification.yaml), and its sha256 must
        equal the receipt digest; on any mismatch the session stops. It is an
        artifact of the opening card, staged and bound by TASK-20260925-d2efb5,
        so v1 is committed at its frozen path before any producer writes v2. No
        producer writes or reads-and-rewrites it. (3) Each hypothesis is revised
        by ONE append-only block, version_2, added at the end of the hypothesis
        mapping. The v1 bytes remain an exact prefix of the file, and status
        stays specified. The block names the v1 fields it supersedes for
        version 2 of the contract, and it names the revision worksheet. (4) The
        v1 audit sheets under BATCH-7d29e8/design/ are not touched. H-NISTBIN-e456ff
        and EXP-NISTBIN-8d210c are RESERVED AND UNUSED (reserved_record_ids).
      exact_paths:
        lane_a_producer_TASK-20260925-c38ac6_writes:
          - experiments/EXP-NISTBIN-451dfa/specification.yaml (version 2; full contract at the canonical path)
          - ledger/hypotheses/H-NISTBIN-dec5e1.yaml (append-only version_2 block; v1 prefix sha256 b83b2a358bea10a29b6fca0fea4184e19ff9b257ade3a27ab5608ab33caa0b23)
          - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/proof-search-map-audit.yaml (revised audit sheet, carrying the revised frozen C2 regression fixture and the D-7 numbered model-identification choice)
          - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/revision-worksheet.yaml (every D-1 to D-10 item mapped to the change that discharges it, by file and location, plus the carried-forward list of DEC-20260924-124667 rationale "What holds")
        lane_b_producer_TASK-20260925-46739d_writes:
          - experiments/EXP-BINSTD-178742/specification.yaml (version 2; full contract at the canonical path)
          - ledger/hypotheses/H-BINSTD-ce4f38.yaml (append-only version_2 block; v1 prefix sha256 3b2b0ff1c612d593e8682ec5db49eea7a84b6337520fbe083bd6d842a2807f96)
          - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/proof-search-map-audit.yaml (revised audit sheet)
          - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/revision-worksheet.yaml (every D1 to D8 item and each listed erratum of DEC-20260924-286589 mapped to its discharging change, plus the carried-forward list of its NA-1)
        opening_card_mechanical_copies_bound_by_TASK-20260925-d2efb5:
          - path: experiments/EXP-NISTBIN-451dfa/specification.v1-frozen-1088d03f.yaml
            must_hash_to: 1088d03f25e7cff8f581a0ed83c299301bba48013a4f26df560371b9e90b0d2d
            source: v1 bytes at the TASK-20260924-304b20 commit (receipt path_sha256; binding_mode content_at_commit)
          - path: experiments/EXP-BINSTD-178742/specification.v1-frozen-64e8b013.yaml
            must_hash_to: 64e8b013b17fb9d7aaab8be3bfe51fc148ec3011eca9e14b3bc21c28477acd3d
            source: v1 bytes at the TASK-20260924-77d46f commit (receipt path_sha256; binding_mode content_at_commit)
        snapshot_checks:
          - >-
            Each lane snapshot (TASK-20260925-792b02, TASK-20260925-6e5a63)
            binds exactly its producer's four paths above (amended additively
            by the next item: plus that lane's pre-review gate files) under
            content_at_commit. Before committing, it checks that the leading v1
            byte-length of the hypothesis file hashes to the v1 prefix digest
            above, and that the frozen v1 copy still hashes to its must_hash_to
            value. It stops on either mismatch, which is a custody failure and
            not a result.
          - >-
            ADDED 2026-09-25 IN THE SAME DRAFT, BEFORE ARCHIVE (R-PREREVIEW-GATE;
            PD-5). "Exactly its producer's four paths" means exactly those four
            PLUS that lane's pre-review gate files named in R-PREREVIEW-GATE,
            and nothing else. All of them are bound in ONE isolated
            content_at_commit commit, together with the snapshot receipt. The
            producer's four paths are hashed before the gate work starts and
            must be unchanged at commit.
      rationale: >-
        (a) validate_ledger. Only experiments/*/specification.yaml is
        schema-validated. A version 2 at specification.v2.yaml beside an
        untouched v1 would be the contract a composer approves while escaping
        schema validation, and the canonical path would go on presenting an
        unapproved v1 to every consumer that reads specification.yaml, including
        research_dispatch and /run. That layout is refused for BOTH lanes, and
        with it the first example of form (i). (b) Lane B has no choice of
        identity. DEC-20260924-286589 NA-1 fixes EXP-BINSTD-178742 version 2,
        additive, with the v1 bytes bound by TASK-20260924-77d46f never edited.
        Only the frozen-copy layout both keeps those bytes intact (in the v1
        commit and byte-identical in-tree) and puts version 2 where it is
        validated. (c) Consistency. Lane A takes the same layout, so the
        snapshot cards, the queue, both plans and both composers apply one rule
        and one precedent. (d) Same experiment, not a different one.
        DEC-20260924-124667 found protocol, disclosure and model-interface
        defects (D-1 to D-10) in a design whose question, Parts 1-2 scope,
        C1-C8 conditions and carried-forward core are unchanged. Its NA-1 reads
        first as "revises H-NISTBIN-dec5e1, EXP-NISTBIN-451dfa and the audit
        sheet". A superseding id would add a later status transition on two v1
        records and re-point every reference to EXP-NISTBIN-451dfa, including
        DEC-20260924-124667 NA-5's pointer and the HOLD-F condition. It would
        gain nothing in validation, because version 2 at specification.yaml is
        validated too. (e) Binding. Both v1 receipts record binding_mode
        content_at_commit (read by grep; PD-3), so TASK-20260924-304b20 and
        TASK-20260924-77d46f keep verifying after the canonical paths carry
        version 2. This is the life-after-archive that DEC-20260924-f0a9c7 R3
        chose content_at_commit for.
      cost_stated_plainly: >-
        (1) At HEAD, the canonical specification paths no longer hash to the v1
        digests cited in DEC-20260924-124667 (object_sha256_per_snapshot_receipt)
        and in the v1 reviews. An auditor uses the frozen copy, whose name
        carries the digest prefix, or the v1 commit. (2) The validator sees only
        the v1 fields of each hypothesis mapping. The version_2 block's
        superseding fields are not schema-validated as fields, so each lane's
        review plan must own the check that the block is complete and
        consistent with version 2 of the contract. (3) The copy step adds a
        shell act by the top-level session to the opening card (PD-4).
      stop_conditions: >-
        If tools/validate_ledger.py reports a NEW error on either version-2
        specification or on either hypothesis's version_2 block, or if
        tools/research_dispatch.py refuses the layout, the top-level session
