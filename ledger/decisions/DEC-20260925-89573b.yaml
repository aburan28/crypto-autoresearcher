        is not a ledger record and claims nothing, so it is a pointer only. If
        an APPROVED record anywhere claims lane B's per-orbit relation-yield
        unit or its ord_n(2) census before the lane-B composer runs, lane B is
        re-ranked at that point as a duplicate check under DEC-20260924-4f8a03
        R2, and the result is recorded before composition. X-CERTBIN. If
        EXP-CERTBIN-ddfe75 or EXP-CERTBIN-060020 freezes a Certicom-row
        parameter that lane A's D-1 also uses, both are read against the primary
