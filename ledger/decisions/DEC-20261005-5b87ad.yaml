coordinator_decision:
  id: DEC-20261005-5b87ad
  context: >-
    Design tick on 2026-10-05. origin/main was fetched at
    2ba5862fcf68cc9707fd321f8092e38e7256787c, which already
    contains H-MONO-9df9c0 and EXP-MONO-220932 for the
    symmetric-base signed-sum fibre of IDEA-20261005-ddbf31.
    That contract leaves the ordered base unclaimed.
    IDEA-20261005-70b25b is that ordered base and is uncited
    on this tip. The arithmetic statements declined by
    DEC-20261005-138b51 stay declined.
  decision: approve
  target_ids:
    - IDEA-20261005-70b25b
    - H-MONO-2f05e9
    - EXP-MONO-49ce45
  rationale:
    - >-
      MONO is an ECC area. This proposal is the ordered-base
      counterpart of the signed-sum census now on main. The
      predicted image has order 4, where the symmetric base
      predicts order 8.
    - >-
      A design-session count, not a run, gave order 4, zero
      4-cycles, and zero character disagreements on all four
      ordinary curves at p=101.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      H-MONO-9df9c0 and EXP-MONO-220932 are not edited.
  evidence_refs: []
  limitations:
    - The sample is one prime and 64 ordered pairs per curve.
    - Order 4 on this base does not decide the symmetric-base image.
    - The j=0 artifact is supersingular at this prime and is not an ordinary control.
    - Approval authorizes six deterministic runs. It does not assert the image.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-f5302c until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
