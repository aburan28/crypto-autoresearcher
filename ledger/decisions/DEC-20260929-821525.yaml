  portfolio_ranking:
    ranked_at: '2026-09-29'
    bar: >-
      Ahead of doing nothing, ECC first (AGENTS.md "ECC comes first"; all 15 are
      area ECDLP). Ranked on merit against docs/target-result-profile.md
