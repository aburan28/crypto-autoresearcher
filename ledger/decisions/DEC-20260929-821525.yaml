        only unresolved above-level candidate on 4 primes (0.5709 +- 0.0349).
      dd041a: >-
        DOWNGRADED, not shelved. Its title claim "exactly one corpus inhabitant"
        clears the lambda >= 1/6 and lambda > 1/4 bars "by the maximum possible
        margin" for the index-L coset indicator. The census shows the
        necessary-condition gate is vacuous at lambda = 1/2: a random set of matched
        density reads the same (C02A), so band membership carries no information
        about key structure, and the digit family that reproduces marginally
        (0.4191) is representation-unstable. Its decision reduces to one mixed
        character sum (its D4) whose expected answer, square-root cancellation
        uniformly in the character order, agrees with the census reading. Standing:
        a derivation task with predicted Outcome 1 (closure), no experiment
        authority under RQ-ECDLP-160d89, recommended_priority lowered from high to
        low in this ranking.
      a58be0_and_6f7416: >-
        UNCHANGED as derivations. The census measured lambda per statistic, which
        neither uses nor refutes the b6ad24 Fourier lemma they assume; it only
        reduces their practical reward, because no non-vacuous band inhabitant is
        currently known (R07 index-5 is the sole candidate). They stay
        derivation tasks under the static boundary of RQ-ECDLP-160d89.
      caveat: >-
        These readings rest on a self-reviewed single run. If the owed
        independent review overturns the census, this paragraph is superseded by a
        new decision, not edited.
    agreement_with_toplevel_recommendation: >-
      NOT ADOPTED, and stated plainly. IDEA-20260920-a92b0f is ranked THIRD, not
      first. Agreed: it is cheap, its model distinction (free advice makes P*T =
      Omega(n) false in the non-uniform GGM of Corrigan-Gibbs and Kogan, while
      query-bounded preprocessing gives Pr <= (PT + T^2 + 1)/n) is a correction to
      a merged design note, and its scope statement (C4) is useful to the whole
      bc7a54 lane. Disagreed: (i) the theorem is a four-line union bound in
      Shoup's lineage which the record itself expects to be folklore, so its
      decisive content is the Stage 0 DERIVATION, a validator or derivation task
      with a reviewable artifact, not an experiment; (ii) its Stage 1 toy
      simulation is a bug check on the implementation, it cannot decide a bound
      that is either proved or not on paper, and its non-uniform control is true
      by construction; (iii) it moves no exponent (sota_delta zero on every axis);
      (iv) I re-read the proof sketch (Phase 1 knowledge is a set C of at most
      P + 1 labelled residues, the advice a function of that transcript, union
      bound over the two win events) and found no defect, which strengthens the
      case for a paper derivation and weakens the case for compute. It is not
      dropped; see its row. The idea selected in first place is not among the
      eight authored by the top-level session.
    ranks:
      - rank: 1
        idea: IDEA-20260923-9e4b71
        question: RQ-ECDLP-78dbc5
        class: mechanism
        read_depth: read in full
        verdict: SELECTED
        merit: >-
          The only one of the 15 that states an S T^2 exponent below the
          generic-group line and names the non-generic structure it uses, which is
          exactly what RQ-ECDLP-78dbc5's decision_target demands of a
          super-constant claim. Decided by ONE computable quantity (the joint
          small-root capacity against 8/5) at seconds-to-minutes of exponent
          arithmetic, with calibration controls, a baseline slice, a
          nearby-object control and a possible negative outcome on either side.
          Its heuristics are numbered (H-A1, H-A2) with validation plans. A
          near-certain deliverable on either side: the closure extension, plus an
          audit of the root-block convention. Generator prior of alive 0.1.
        design_time_finding: >-
          Designing it exposed a probable defect in the instrument it builds on:
          tools/smallroot_reach.py states its success condition as
          prod X_i^{s_i} < p^{s_p} with s_p the p-exponent of det(L), whereas the
          Howgrave-Graham criterion det(L) < p^{tN} gives the comparison exponent
          tN - s_p. The two coincide as t goes to infinity for n = 1 (all that
          tests/test_smallroot_reach.py checks against a theorem) and differ for
          n >= 2 (the tool's full-box limit 2n/(d(n+1)) reads 4/3 at n = 2, d = 1,
          above the information bound). Hand instance n = 1, d = 2, t = 1: basis
          {p, pX, f}, det = p^2 X^3 < p^3 needs X < p^{1/3}; the tool's formula
          gives p^{2/3}. THIS IS A COORDINATOR HAND DERIVATION, NOT EVIDENCE.
          The frozen contract turns it into a pre-registered audit with exact
          integer controls and a rule for which convention decides.
        why_first: >-
          Highest value per cost against the target profile, and the design
          exercise itself converts a claimed exponent into a checkable audit of the
          measuring instrument that four earlier records lean on.
        disposition: designed and approved this pass (H-ECDLP-4b54a2, EXP-ECDLP-64fa3d).
      - rank: 2
        idea: IDEA-20260920-a5757d
        question: RQ-ECDLP-bc7a54
        class: mechanism
        read_depth: claim, mechanism and cost model read (lines 1-135)
        merit: >-
          Exponent-relevant (the branching window b < sqrt(M) prices a sub-rho
          four-list route at T = b^{1/3} n^{1/3}), rebuts a merged design note's
          Route-3 ceiling, and is scoped for toy compute. Its decisive content is
          a Freiman/rectification derivation for the constant-b end plus a toy
          branching-meter measurement whose asymptotic reading is weak at n
          between 2^16 and 2^32.
        why_not_higher: >-
          The measurable part is a toy transfer of an asymptotic window, and the
          derivation part is owned in spirit by RQ-ECDLP-160d89's static boundary
          via its dependents. Information per cost is below rank 1.
        disposition: next candidate for /design-experiment.
        revisit: The next /design-experiment pass, or earlier if the 9e4b71 experiment returns DEAD_IN_FAMILY and frees the slot.
