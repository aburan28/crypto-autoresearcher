coordinator_decision:
  id: DEC-20260905-f630e4

  context: >-
    THIS RECORD DISCHARGES CONDITION C-6 OF DEC-20260904-5216dd AND NOTHING
    ELSE. That decision approved EXP-SCURVE-3f87f6 with conditions for the four
    producer slots of GOAL-SCURVE-137bd9 / BATCH-a40709, and refused to ratify
    the four divergences it enumerated between the committed batch design at
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml and
    the rendered control plane (the dispatch queue and the frozen contract).
    C-6 requires ONE superseding record covering all four -- D-4 before S3
    (TASK-20260904-90ac09) runs, D-1 and D-2 before S5, S7, S9, S11 and S12
    run, D-3 recorded for the archive because S0 is complete. This is that
    record. It is the single item the queue's S3 gate_note names as gating that
    slot alongside C-5 and C-7, which are the driving session's to discharge in
    the queue and are NOT discharged here.
    batch.yaml GOVERNS. It is the committed design authorised by
    DEC-20260904-c42007, and a disagreement between it and any downstream
    artifact is a superseding record, NEVER an edit -- to either file. The
    queue is editable by design and the contract's bytes are hash-bound by the
    completed TASK-20260904-850ff6 snapshot archive, so on three of these four
    items the downstream text cannot be brought back into line with batch.yaml
    even in principle, and on the fourth it should not be. A record like this
    one is the only legitimate way a downstream text prevails over the design
    it was rendered from.

  decision: supersede

  target_ids:
  - GOAL-SCURVE-137bd9
  - RQ-SCURVE-960dbd
  - BATCH-a40709
  - EXP-SCURVE-3f87f6
  - DEC-20260904-c42007
  - DEC-20260904-5216dd
  - TASK-20260904-f0a889
  - TASK-20260904-850ff6
  - TASK-20260904-8e3d66
  - TASK-20260904-90ac09
  - TASK-20260904-fa10f7
  - TASK-20260904-7efb23
  - TASK-20260904-251f65
  - TASK-20260904-ad952c
  - TASK-20260904-f4b6ba
  - TASK-20260904-158442
  - TASK-20260904-cc8dfb
  - TASK-20260904-abf728
  - TASK-20260904-aa366e
  - TASK-20260904-f9dba7

  # ===================================================================
  # WHAT THIS RECORD DOES, AND WHAT IT REFUSES TO DO
  # ===================================================================
  what_this_record_does: >-
    It rules, on each of four enumerated divergences, WHICH TEXT GOVERNS GOING
    FORWARD, whether the divergence is in PLACEMENT/EXPRESSION or in FORCE, and
    what a slot must do differently because of it. It supersedes by BEING
    RECORDED. Nothing is edited: batch.yaml, experiments/EXP-SCURVE-3f87f6/specification.yaml,
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json,
    every archive receipt and ledger/goals/GOAL-SCURVE-137bd9/goal.yaml are
    untouched by this session and must stay untouched on account of it.

  what_this_record_does_NOT_do: >-
    IT APPROVES NOTHING. It does not approve an experiment, a run, a contract,
    a criterion verdict, an evidence record, a knowledge promotion, a hypothesis
    (this goal has none and this record creates none) or a goal status change.
    It adjudicates NO criterion cell and is EVIDENCE ABOUT NO CURVE. It does not
    discharge C-1, C-2, C-3, C-4, C-5, C-7 or C-8 of DEC-20260904-5216dd, each
    of which stands exactly as written. It admits no item from batch.yaml
    out_of_scope (OOS-1 through OOS-8), each of which stays OPEN AND
    UNATTEMPTED. It raises no claim ceiling, opens no batch, closes no lane and
    declares nothing impossible. It creates no new gate: because one record
    carries all four rulings and C-6 requires it committed before S3, every
    slot after S3 necessarily has it.

  supersession_mechanics: >-
    THE SUPERSESSION IS BY DECISION RECORD, NOT BY REGISTRY. No entry was made
    in tools/schema_supersession_registry.yaml or
    tools/run_supersession_registry.yaml and none is asserted to be required:
    those registries redirect SCHEMA validation of discovered ledger, experiment,
    knowledge and goal-checkpoint records that are hash-pinned, and batch.yaml is
    a coordination design file, not a discovered ledger record with a schema
    defect. If a later reader establishes that a registry entry is owed, that is
    a new record's work and not a licence to edit this one.

  # ===================================================================
  # THE GOVERNING ORDER, STATED ONCE
  # ===================================================================
  governing_order:
    rank_1: >-
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml --
      the committed batch design, authorised by DEC-20260904-c42007. It governs.
    rank_2: >-
      experiments/EXP-SCURVE-3f87f6/specification.yaml -- the frozen protocol,
      hash-bound by TASK-20260904-850ff6 and approved with conditions by
      DEC-20260904-5216dd. Immutable in fact as well as by rule.
    rank_3: >-
      the dispatch queue -- the rendering. Editable by design, deliberately not
      hash-bound, and the artifact a dispatched agent actually reads.
    and_this_record: >-
      A committed Coordinator decision is the ONLY instrument that can make a
      rank-2 or rank-3 text prevail over rank 1 on a specific, named point. It
      does so for exactly the four points below and for nothing else. Any FIFTH
      divergence is unruled and stays a live defect -- see
      unresolved_defects_and_residual_risk U-4.

  # ===================================================================
  # THE FOUR RULINGS
  # ===================================================================
  divergence_rulings:

  - id: D-1
    subject: WHERE THE PRE-READ SEALS ARE DECLARED
    batch_yaml_text: >-
      batch.yaml requires S5, S7, S9, S11 and S12 to declare their pre-read
      seals in artifact_paths (slot blocks' seal_declaration fields: S5 "MUST
      DECLARE IT IN artifact_paths"; S7 "PRE-READ SEALS DECLARED IN
      artifact_paths"; S9 "PRE-READ SEAL DECLARED IN artifact_paths"; S11 and
      S12 "PRE-READ SEALS DECLARED IN artifact_paths").
    queue_text: >-
      The queue declares each seal in the slot's read_scope and in a handoff
      constraint requiring the slot to verify each input's sha256 against the
      governing snapshot receipt BEFORE reading it and to record the
      verification.
    reported_by: S0 (report section 5 item 1) and S1 (snapshot receipt OI-1 divergence_a).
    why_batch_yaml_is_not_representable: >-
      READ FROM SOURCE BY ME, NOT RUN. tools/research_dispatch.py builds an
      artifact_owners map and raises DispatchError "artifact path {path} is
      owned by both {previous_owner} and {task_id}" (lines 630-636), so a path
      has exactly one owning task. The four receipts in question are owned by
      S4, S6, S8 and S10. Naming one in a reader's artifact_paths would collide
      with its owning archive, and would additionally enter that reader's
      archive's expected_paths (line 684, expected = archive artifact_paths
      union source artifact_paths), pulling one archive's receipt into a
      different archive's binding set.
    which_text_governs_going_forward: >-
      THE QUEUE'S PLACEMENT GOVERNS, for placement only. batch.yaml's
      seal_declaration clauses are superseded in WHERE the seal is written and
      in NOTHING ELSE.
    nature: PLACEMENT / EXPRESSION. NOT FORCE.
    force_explicitly_unchanged: >-
      THE SEAL OBLIGATION IS NOT WEAKENED BY MOVING WHERE IT IS DECLARED, AND I
      SAY SO IN TERMS. S5 still may not read an S2 or S3 output that is not
      bound by path_sha256 in the S4 receipt; S7 still may not read a threshold
      or measurement not bound by the S4 or S6 receipt; S9 still writes against
      the dossier bound by the S8 receipt and not a working-tree one; S11 and
      S12 still read the snapshot commits bound by the S8 and S10 receipts. A
      slot that reads outside its seal is void exactly as before.
    what_still_enforces_it:
    - >-
      The frozen contract's INV-9, which voids a producer that reads an input
      not bound by path_sha256 in the receipt that governs it. INV-9 is in the
      approved protocol and is unaffected by this ruling.
    - >-
      The queue's own per-slot constraint text, which requires the sha256
      comparison to be PERFORMED and RECORDED, not merely promised.
    - >-
      The per-slot completion_gate: S5 "every input's sha256 is verified
      against the S4 snapshot receipt and the verification is recorded"; S7 the
      same against S4 or S6; S9 the same against S8; S11 and S12 "the reading
      declaration lists every artifact read with its sha256 verified against
      the S8 or S10 receipt". Read by me in the queue.
    - >-
      The archives themselves: each snapshot receipt binds its declared paths by
      path_sha256, and a completed archive's hash set must equal its expected
      set (research_dispatch.py lines 692-701). The binding exists whether or
      not a reader also lists the receipt.
    what_a_slot_must_do_differently: >-
      NOTHING IS RELAXED AND ONE THING IS MADE EXPLICIT. Each of S5, S7, S9, S11
      and S12 performs the seal verification exactly as batch.yaml intends, and
      records the receipt path, the expected digest, the computed digest and the
      match per input in its own deliverable -- because the declaration no
      longer appears in artifact_paths, the RECORD OF THE VERIFICATION is the
      only place the seal becomes checkable after the fact. A slot that cannot
      verify a digest (no hashing tool in its session) does NOT proceed on a
      promise: it reports the missing capability as an impediment on a
      still-active goal, which is an operational observation and never negative
      mathematical evidence.
    slots_that_must_read_this_record_before_running: [S5, S7, S9, S11, S12]

  - id: D-2
    subject: THE REVIEWERS' DECLARED DEPENDENCIES
    batch_yaml_text: "S11 and S12 each carry depends_on: [S10]."
    queue_text: >-
      S11 (TASK-20260904-abf728) and S12 (TASK-20260904-aa366e) each carry
      depends_on [TASK-20260904-ad952c (S7), TASK-20260904-f4b6ba (S8),
      TASK-20260904-cc8dfb (S10)].
    reported_by: S0 (report section 5 item 2) and S1 (OI-1 divergence_b).
    why_batch_yaml_is_not_representable: >-
      STRONGER THAN "ORDER-PRESERVING", AND READ FROM SOURCE BY ME, NOT RUN.
      tools/research_dispatch.py _validate_review_chains (lines 519-548) finds a
      producer's reviewers by looking for successors whose depends_on CONTAINS
      THE PRODUCER'S OWN ID and whose role is an independent review role; with
      only [S10], S11 and S12 would not be recognised as reviewers of S7 at all
      and the queue would be rejected with "{producer} requires an independent
      reviewer, validator, or red-team successor". It then separately requires
      each such review's depends_on to contain the producer's SNAPSHOT ARCHIVE
      id, rejecting otherwise with "independent review {id} for {producer} must
      depend on snapshot archive {id}". Both S7 and S8 must therefore be named
      explicitly. batch.yaml's [S10] is not a shorter spelling of the same
      thing; it is unrenderable.
    which_text_governs_going_forward: >-
      THE QUEUE'S [S7, S8, S10] GOVERNS for both reviewers.
    nature: >-
      EXPRESSION. The SCHEDULE is identical -- S10 already requires S9, which
      requires S8, which requires S7 -- so no slot runs earlier or later than
      batch.yaml orders it, and nothing changes about what either reviewer may
      read (that is fixed by read_scope, the seals and the committed review
      plan, none of which this touches). The explicit superset makes the
      reviewers' relation to the producer and its archive MACHINE-CHECKABLE
      rather than inferable, which is a strengthening of the check and a
      weakening of nothing.
    what_a_slot_must_do_differently: >-
      NOTHING OPERATIONAL. S11 and S12 are still dispatched only after the S10
      snapshot commit is accepted by the post-commit verifier -- the queue's S10
      constraint says so and batch.yaml's why_separate explains why -- and they
      are still sibling-blind, still bound to the committed review plan as their
      authoritative instruction set, and still refuse rather than downgrade if
      review-adversarial at xhigh cannot be honoured in an independent session.
      The only difference is that a reader comparing the two files sees three
      names where the design wrote one, and now knows why.
    slots_that_must_read_this_record_before_running: [S11, S12]

  - id: D-3
    subject: THE DISPATCH QUEUE IN S0'S artifact_paths
    batch_yaml_text: >-
      batch.yaml slot S0 lists "the dispatch queue for this batch" among its
      deliverables, and the rendered queue accordingly carried
      dispatch_queue.json in S0's artifact_paths and handoff.artifact_paths.
    queue_text: >-
      The driving session removed dispatch_queue.json from S0's artifact_paths
      and handoff.artifact_paths after the S1 archive, kept it in S0's
      write_scope, preserved the pre-repair list verbatim in prior_artifact_paths,
      and disclosed the whole repair inline in artifact_paths_note.
    reported_by: >-
      The driving session, in the queue's own artifact_paths_note, with
      prior_artifact_paths retained. Reported by the party that made it, which
      is the behaviour this program wants.
    the_two_committed_rules_that_collide: >-
      READ FROM SOURCE BY ME, NOT RUN. tools/research_dispatch.py requires a
      COMPLETED archive's path_sha256 to EQUAL its expected set -- archive
      artifact_paths union source artifact_paths (line 684) -- raising
      "completed archive task {id} path_sha256 must cover every archive and
      source artifact" otherwise (lines 697-701). Leaving the queue in S0's
      artifact_paths therefore forces the queue's bytes into the completed S1
      archive's binding set. Against that, CLAUDE.md's concurrency contract
      excludes generated and transition-edited files from archive commits
      precisely because they change on every task transition; the queue had
      already advanced at 7a7c87866 (attributed to the driving session; I
      verified no sha). A bound digest would then fail a fresh content check on
      a queue that is working correctly, which converts correct operation into
      a fatal archive defect.
    which_text_governs_going_forward: >-
      THE REPAIRED QUEUE GOVERNS: dispatch_queue.json is NOT an artifact path of
      any task and is NOT bound by any archive in this batch. batch.yaml's S0
      deliverable STANDS UNCHANGED as a deliverable -- S0 did render the queue,
      and that deliverable was met; what is superseded is only its expression as
      a HASH-BOUND artifact path.
    nature: >-
      PLACEMENT, WITH ONE NARROW AND DISCLOSED CHANGE IN EVIDENTIARY FORCE, AND
      I WILL NOT SMOOTH THAT OVER. The queue moves from "bound by path_sha256,
      mismatch fatal" to "content-verified at a named commit and expected to
      change afterwards". A later reader can no longer prove from the S1
      receipt's binding set alone which queue bytes S0 produced; what preserves
      that is the receipt's content_verified_not_bound entry recording the
      digest 0327241331a3935a7d4cd0a964b8b7e40325febdabb209ef8924d362809e55ac at
      b012132b2 and the same value in the queue's own archive block (both
      attributed to the driving session; I computed and verified no digest).
      That is strictly less than a binding and strictly more than nothing, and
      it is the most that is available for a file whose whole function is to be
      edited.
    what_a_slot_must_do_differently: >-
      D-3 GATES NOTHING AND IS RECORDED FOR THE ARCHIVE. S0 is complete. But the
      rule it settles is FORWARD-BINDING ON EVERY ARCHIVE SLOT IN THIS BATCH: S4
      (TASK-20260904-fa10f7), S6 (TASK-20260904-251f65), S8 (TASK-20260904-f4b6ba),
      S10 (TASK-20260904-cc8dfb) and S13 (TASK-20260904-f9dba7) MUST NOT place
      dispatch_queue.json in any artifact_paths or any path_sha256 map. If an
      archive wants the queue's state on the record, it content-verifies it at
      its own commit and records the digest under a not_bound / content-verified
      heading, exactly as S1 did. Re-adding it would break that archive the
      moment the next task transition is written.
    slots_that_must_read_this_record_before_running: >-
      NONE, as a gate. The forward rule above binds S4, S6, S8, S10 and S13, and
      each of them reads this record in the ordinary course because it is
      committed before any of them runs.

  - id: D-4
    subject: >-
      THE PASS CONDITION OF CTRL-CONSTRUCTED-RANDOMPOINT, A HARD GATE WHOSE
      FAILURE VOIDS L-BASE. THIS IS THE ONE THAT MATTERS.
    the_two_texts:
      batch_yaml: >-
        "and a random point (the on-curve check must reject it)". The clause
        spans two lines in the working-tree copy as displayed by my
        line-numbered read (the words "and a random point (the on-curve" on one
        line, "check must reject it)" on the next); the driving session confirmed
        the citation as batch.yaml:404, and I record its citation as given and
        my own reading as agreeing.
      contract: >-
        CTRL-CONSTRUCTED-RANDOMPOINT must_do: "the on-curve check MUST ACCEPT it
        only if it is on the curve; a checker that accepts a random pair has no
        resolving power". The clause spans three lines in the working-tree copy;
        the driving session confirmed the citation as specification.yaml:289, the
        line carrying "MUST ACCEPT", and my reading agrees.
      queue: >-
        S3's handoff constraint carries the CONTRACT's wording ("a random point
        that the on-curve check MUST accept only if it is on the curve"), not
        batch.yaml's, and the S3 gate_note names the conflict outright.
    status_before_this_record: >-
      NOT REPORTED BY S0, BY S1 OR BY THE DRIVING SESSION. All three enumerated
      divergences and all three missed it; it was found by the approval review
      that produced DEC-20260904-5216dd. That is the reason this ruling is
      written at length rather than by reference.

    the_mathematics_worked_out: >-
      Let p be the field prime and let the curve be the nonsingular short
      Weierstrass model y^2 = x^3 + a*x + b over F_p, p > 3 -- which is the
      shape L-EQ certifies and whose nonsingularity CTRL-CONSTRUCTED-SINGULAR
      separately guards. The on-curve predicate is an exact congruence in
      integers: OnCurve(x, y) holds precisely when y^2 - (x^3 + a*x + b) is
      congruent to 0 modulo p. It is decidable exactly, with no probability in
      it, for any given pair.
      THE PROBABILITY LIVES IN THE DRAW, NOT IN THE PREDICATE. The number of
      pairs (x, y) in F_p x F_p satisfying the congruence is exactly the number
      of AFFINE points of the curve, which is the group order less the single
      point at infinity. By Hasse's theorem the group order is p + 1 - t with
      |t| <= 2*sqrt(p), so the affine count is p - t. For (x, y) drawn uniformly
      from F_p x F_p, the probability that the pair is on the curve is therefore
      (p - t)/p^2, which is 1/p - t/p^2 and so lies within 2/p^(3/2) of 1/p.
      THAT PROBABILITY IS SMALL AND IT IS NOT ZERO. I deliberately state no bit
      length and no numeric bound for this curve, because the field's bit length
      is itself a quantity L-FIELD must MEASURE and this record must not hand S3
      an expected value. Symbolically: about one draw in p lands on the curve.
      CONSEQUENCE ONE -- batch.yaml's "must reject" is not a theorem. It
      describes the overwhelmingly likely outcome of a random experiment. On the
      event of probability about 1/p, the drawn pair IS on the curve, a CORRECT
      checker MUST accept it, and batch.yaml's wording then records a hard-gate
      FAILURE and voids L-BASE -- on the strength of a correct instrument
      behaving correctly. A pass condition that a correct instrument can fail is
      a defect in the pass condition, however rarely it fires. Stated the other
      way: "must reject" makes the gate a property of the DRAW, when the control
      exists to establish a property of the CHECKER.
      CONSEQUENCE TWO, AND IT BITES FAR MORE OFTEN THAN 1/p -- "must reject" is
      passed trivially by a checker that rejects EVERYTHING. A constant-false
      predicate rejects the random pair with probability 1 and sails through the
      gate. That degenerate instrument has no resolving power whatsoever, and
      excluding degenerate instruments is the entire purpose of a null control.
      A pass condition satisfied perfectly by the instrument it is meant to
      exclude is not a weak gate; on that failure mode it is no gate at all.
      WHY THE CONTRACT'S WORDING IS THE CORRECT ONE. "The on-curve check MUST
      ACCEPT it only if it is on the curve" is a statement about the CHECKER's
      decision agreeing with the ground truth on the pair actually drawn. The
      ground truth is computable exactly and cheaply for any pair, so the
      condition is CHECKABLE ON EVERY DRAW and SATISFIABLE UNCONDITIONALLY by a
      correct implementation. No draw, however unlucky, can make a correct
      checker fail it. That is what a pass condition must look like.

    the_honest_limit_of_the_contract_wording_too: >-
      RECORDED BECAUSE IT IS TRUE, NOT BECAUSE IT CHANGES THE RULING. Read
      strictly, "accept ONLY IF it is on the curve" is a SOUNDNESS condition (no
      false accept) and is ALSO satisfied vacuously by the constant-reject
      checker. So this control, by itself and under either wording, does not
      exclude a checker that never accepts anything. The contract's second
      clause -- "a checker that accepts a random pair has no resolving power" --
      states the intent, and the COMPLETENESS half is carried elsewhere in the
      protocol: L-BASE's own deliverable requires the same code path to find the
      base point ON the curve, which a constant-reject checker cannot do. The
      pair (accepts the base point, rejects the random pair), exhibited on the
      IDENTICAL code path, is what excludes both constant instruments. Neither
      file says this in one place, which is why it is said here.

    which_text_governs_going_forward: >-
      THE CONTRACT'S WORDING GOVERNS: experiments/EXP-SCURVE-3f87f6/specification.yaml
      CTRL-CONSTRUCTED-RANDOMPOINT must_do, as carried into S3's queue
      constraint. batch.yaml's slot S3 clause "(the on-curve check must reject
      it)" IS THE TEXT BEING SUPERSEDED HERE.
    said_plainly_because_it_should_not_be_buried: >-
      batch.yaml GOVERNS this batch, and on this one clause it is WRONG, and I
      am overriding it. That override is legitimate only because it is recorded
      as a superseding decision under its own identifier, with its reasoning
      written out and its scope named, and committed BEFORE the slot it affects
      runs -- and it is legitimate for no other reason. It is not legitimised by
      the contract being downstream, by the queue already carrying the better
      wording, by three sessions having missed it, or by anyone saying
      "approved" in a message. If this record is not committed, batch.yaml:404
      still governs and S3 does not run.
    nature: >-
      FORCE. Narrowly but genuinely. The two wordings coincide exactly on every
      draw that is not on the curve, which is all but about one draw in p; they
      differ on that event, where batch.yaml demands a failure and the contract
      demands a pass. And on EVERY draw they differ in MEANING: one asks what
      happened, the other asks whether the instrument was right. D-1, D-2 and
      D-3 change where words sit; this one changes what must be true.

    what_S3_must_implement_and_record:
    - >-
      IMPLEMENT THE CONTRACT'S CONDITION. PASS iff the checker's decision on the
      drawn pair equals the exact arithmetic ground truth for that pair. FAIL
      only on disagreement. A disagreement is a real hard-gate failure, voids
      L-BASE, and is a complete and valuable outcome about the INSTRUMENT --
      never about any curve's security.
    - >-
      RECORD ENOUGH THAT THE CONDITION IS CHECKABLE BY SOMEONE ELSE: the drawn
      pair in full, how it was drawn (source of randomness and seed if any and
      the number of draws), both sides of the congruence as computed, the ground
      truth verdict, the checker's decision, and the fact that the control ran on
      the IDENTICAL code path, BEFORE any target output of L-BASE is interpreted
      (contract control_ordering_rule).
    - >-
      IF THE DRAWN PAIR HAPPENS TO LIE ON THE CURVE, THAT IS A PASS, NOT A
      FAILURE, NOT AN IMPEDIMENT AND NOT A FINDING. Record that draw and its
      outcome in full, state that the null's reject path was not exercised by it,
      and draw again -- recording EVERY draw. Never discard a draw. Under
      batch.yaml's superseded wording S3 would have been obliged to call this a
      failure and void L-BASE, which is exactly the harm this ruling removes.
    - >-
      EXHIBIT THE TWO-SIDED PAIR. Record this control's rejection outcome
      TOGETHER WITH L-BASE's acceptance of the base point on the same code path,
      so that a reader can see the instrument is neither constant-accept nor
      constant-reject. Neither half alone establishes that.
    - >-
      STATE WHAT THE CONTROL ESTABLISHES AND WHAT IT DOES NOT, in the control
      record, in these terms: it establishes that on the specific object drawn,
      the checker's decision agreed with the exact arithmetic; combined with the
      accepted base point it establishes that the checker is not a constant
      predicate in either direction. IT DOES NOT establish that the checker is
      correct on all inputs, and NO FALSE-ACCEPT RATE MAY BE REPORTED FROM IT. A
      checker that accepts an arbitrary pair with probability q is detected by a
      single null draw with probability q, so one draw has weak power against a
      partially broken instrument. Neither batch.yaml nor the contract fixes a
      sample count for this control; more draws are PERMITTED and are NOT
      REQUIRED by this record, because requiring them would change an approved
      frozen protocol after the fact, which a superseding record about a
      divergence has no business doing.
    - >-
      CITE THIS RECORD. controls-block-a.yaml and report.md name
      DEC-20260905-f630e4 as the pass condition's governing record, alongside
      approved_by_decision DEC-20260904-5216dd required by C-2.
    slots_that_must_read_this_record_before_running: >-
      S3 (TASK-20260904-90ac09) BINDINGLY -- it owns the control and C-6 gates it
      on this record. ALSO S7, S9, S11 and S12, each of which judges the
      control's conformance or writes the plan by which it is judged, and each of
      which would otherwise measure S3's outcome against batch.yaml:404 and be
      right to call a conforming control non-conforming. No new gate is created
      by naming them: this record is committed before S3 and therefore before all
      of them.

  # ===================================================================
  # WHAT IS STILL BROKEN -- named, with the exact repair, not papered over
  # ===================================================================
  unresolved_defects_and_residual_risk:
  - id: U-1
    what: >-
      THE COMPLETENESS HALF OF THE RANDOM-POINT CONTROL IS NOWHERE STATED AS
      PART OF ITS PASS CONDITION. Under either wording, this control alone does
      not exclude a checker that accepts nothing; the exclusion rests on
      L-BASE's acceptance of the base point, which is a different lane's
      deliverable.
