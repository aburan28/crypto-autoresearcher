      CONDITION MUST BE STATED AS WHAT A CORRECT CHECKER DOES ON THE OBJECT
      DRAWN, NOT AS THE OVERWHELMINGLY LIKELY OUTCOME OF THE DRAW." The argument
      generalises past this batch and past elliptic curves: every null control in
      this program draws its object from a distribution, so a pass condition
      phrased as the modal outcome is (a) failable by a CORRECT instrument on a
      rare draw, which converts correct behaviour into a voided lane, and (b)
      passed perfectly by the DEGENERATE constant instrument the control exists to
      exclude. The repair is the same everywhere: state the condition as agreement
      between the instrument's decision and the independently computable ground
      truth for the object actually drawn, and carry the completeness half on a
      paired positive exhibited on the identical code path. It bears directly on
      the same-shape null families this program uses throughout, including
      CTRL-NULL-SAME-SHAPE at S5.
