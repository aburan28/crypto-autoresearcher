  # ===================================================================
  rationale:
  - >-
    THREE OF THE FOUR DIVERGENCES ARE THE DESIGN MEETING A SCHEMA, AND THE
    HONEST ANSWER IS TO SAY SO ONCE AND MOVE ON. D-1 and D-2 describe
    obligations batch.yaml wrote in a form the dispatcher cannot represent --
    verified by reading the exact checks in tools/research_dispatch.py rather
    than by accepting three sessions' summary of them -- and D-3 describes two
    committed rules that genuinely pull opposite ways on a file whose function
    is to change. In each case the queue's form preserves the obligation and
    batch.yaml's form would prevent the batch from being dispatched at all.
    Ruling for the queue on placement costs the program nothing it wanted and
    buys it a batch that runs.
  - >-
    D-4 IS DIFFERENT IN KIND AND IS TREATED THAT WAY. It is a hard gate whose
    failure voids a lane, the two texts disagree about when it fires, and
    batch.yaml -- which governs -- states the condition in a form that a correct
    instrument can fail and a useless instrument can pass. Ruling for the
    contract here is not deference to the downstream artifact; it is the
    conclusion of an argument that fits in a paragraph and that anyone can check
    without running anything.
  - >-
    THE SUPERSEDING RECORD IS THE POINT, NOT A FORMALITY. Every one of these four
    could have been "fixed" by editing one line in one file, and every one of
    those edits would have destroyed something: batch.yaml's authority as the
    committed design, the contract's hash binding in a completed archive, or the
    queue's freedom to advance. Writing the disagreement down under its own
    identifier is the only repair that leaves every artifact intact and leaves a
    reader able to see that a disagreement existed and how it was settled.
  - >-
    I DECLINED TO USE THIS RECORD AS COVER FOR IMPROVING THE PROTOCOL. Three
    things I would have liked to require -- a sample count for the random-point
    null, an explicit two-sided pass condition, a tooling-level convention for
    transition-edited files -- are named as unresolved defects with their exact
    repairs and their owners, not smuggled in as rulings. A record that
    supersedes a divergence and quietly enlarges an approved protocol at the same
    time is exactly the kind of drift the program's immutability rules exist to
    stop.
  - >-
    NOTHING HERE MOVES AN EXPONENT AND NOTHING HERE CLAIMS TO. This batch is a
    retrieval and transcription-check protocol; the program's bias toward
    exponent-targeting mechanisms is honoured by saying so plainly rather than by
    dressing a control-plane ruling as a result.

