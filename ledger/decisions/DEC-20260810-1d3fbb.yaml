  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-ea56c5
  batch_id_note: >-
    Recorded because this decision leaves BATCH-ea56c5 as the head lane. This
    decision does NOT open, close, dispatch, pause or budget that batch, and it
    is not a BATCH-ea56c5 work product.
