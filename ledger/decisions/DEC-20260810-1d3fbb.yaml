  rationale:
    - >-
      Resolving a head conflict by choosing a side is forbidden, and both sides
      here were correct about what they could see. The branch head was correct
      that BATCH-ab1946 exists and was properly opened; origin/main was correct
      that BATCH-ea56c5 is live and that its own head was internally inconsistent.
      What neither could see is that the branch's batch duplicates a batch on
      main. The resolution therefore keeps every value and note from both sides
      and adds findings, changing no committed record.
    - >-
      The same error has now occurred three times in this goal in two days:
      TASK-20260810-55845c inferred "no successor exists" from one checkout;
      TASK-20260810-9b8038 corrected it from two checkouts and was itself
      incomplete; this resolution corrects it from three and makes no claim to be
      final either. The general form is worth stating once more because it is
      cheap to state and expensive to rediscover: at N concurrent worktrees,
      absence of a record in your tree is never evidence of its absence in the
      program, and the number of trees you did read is not a bound on the number
      that exist. Accordingly this decision scopes every negative claim to the
      merged working tree it read.
    - >-
      Two immutable successors to one immutable predecessor is not a recoverable
      state. Supersession is the program's mechanism for correcting immutable
      records, and it works only while the supersession relation is a function ---
      if both EXP-ECDLP-d4d43e and EXP-ECDLP-d7b3c3 were written against
      EXP-ECDLP-ffa5c3, no later record could establish which one supersedes it
      without editing one of them, which is forbidden. Preventing that costs
      nothing today and cannot be undone once either file is committed.
    - >-
      Rule 9 of CLAUDE.md is engaged: this deprioritizes a legitimately authorized
      lane, so it records the evidence, the budget, the test boundary, the
      remaining uncertainty, a named successor and a concrete revisit condition.
      It also records honestly that the ground is bookkeeping cost rather than
      research merit, and that BATCH-ab1946's opening record is in one respect the
      better of the two. Nothing is suppressed and nothing is mischaracterized:
      the withdrawn lane is being PUBLISHED by this act, not buried.
    - >-
      The head pointer is an attention record, not an evidential one --- the
      convention TASK-20260810-9b8038 took from this goal's own treatment of
      active_hypothesis_ids. Naming BATCH-ea56c5 ranks attention. It closes,
      pauses, weakens and judges nothing about BATCH-ae8019, and its effect on
      BATCH-ab1946 is stated separately and explicitly above rather than being
      smuggled into the pointer.

  limitations:
    - >-
      This decision produces no evidence about ECDLP. It is bookkeeping over a
      merge: no implementation, no execution, no run record, no empirical
      observation, no curve, no selector, no solver, no measurement.
    - >-
      No status of any kind moves. GOAL-ECDLP-001 remains active. RQ-ECDLP-002
      remains active. EXP-ECDLP-ffa5c3 remains review_required and is not edited.
      No hypothesis moves; H-SYC-b854f4 remains specified. No claim tier moves and
      no claim ceiling is raised in any lane.
    - >-
      No commit is verified. This session had no shell and no git, so every SHA in
      this record is a report by another session, attributed as such.
    - >-
      No batch is opened, closed, checkpointed, paused or budgeted. In particular
      no ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-ab1946.yaml is written,
      because no batch outcome exists to check point, and writing one would assert
      a disposition that was never reached.
    - >-
      No review, verdict, attestation or timing is asserted anywhere in this
      record. None was obtained. This decision was reached by a single Coordinator
      session and carries no attestation.
    - >-
      The duplication finding is scoped to the merged working tree this session
      read. It does not claim that BATCH-ae8019 and BATCH-ab1946 are the only
      successors of BATCH-c3c474 in the program, and it makes no finding either
      way on U5-FC86CA-SUCCESSOR, the open question of whether BATCH-fc86ca's
      restart also has a successor somewhere.
    - >-
      Whether the two design lanes BATCH-ea56c5 and BATCH-ae8019 should proceed
      concurrently or be sequenced for capacity --- U4-LANE-SEQUENCING of
      TASK-20260810-9b8038 --- is NOT decided here. Both remain zero-run design
      lanes, so focus discipline over active experiments is not engaged, and
      sequencing is a separate priority judgement.
    - >-
      This resolution makes one placement change with no content change: the
      preserved BATCH-c3c474 next_action text, which on origin/main sits inside the
      block scalar of next_action_correction_batchc3c474_restart_executed_20260810
      as an artifact of an earlier merge, is carried under
      next_action_batchc3c474_20260809_superseded. No byte of the preserved text
      differs and no key is deleted; it is disclosed at
      next_action_correction_batchc3c474_restart_executed_20260810_placement_note_20260810
      rather than done silently.

