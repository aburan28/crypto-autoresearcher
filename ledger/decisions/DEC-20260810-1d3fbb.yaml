  decision: reconcile_goal_head
  decision_label: >-
    goal_head_merge_resolution_by_supersession_and_duplicate_successor_lane_finding
  supersedes_by_correction:
    - record: ledger/goals/GOAL-ECDLP-001/goal.yaml
      key: current_batch_id_note_head_reconciliation_20260810
      what: >-
        Its finding "No committed record names any successor to BATCH-c3c474: no
        batch.yaml in this goal declares parent_batch BATCH-c3c474, and that lane
        therefore terminates closed." A second counterexample is now on record.
      how: >-
        By the new key current_batch_id_note_head_reconciliation_20260810_correction_two_20260810.
        The original note is preserved UNEDITED, including the falsified premise,
        as is the first correction that named BATCH-ae8019.
    - record: ledger/goals/GOAL-ECDLP-001/goal.yaml
      key: next_action_correction_batchc3c474_restart_executed_20260810
      what: >-
        Its statement that the BATCH-c3c474 restart "WAS executed, as BATCH-ae8019"
        is accurate but incomplete: it was executed twice.
      how: >-
        By the new key next_action_correction_batchc3c474_restart_executed_twice_20260810.
        The original is preserved UNEDITED.

  context: >-
    A merge of origin/main into branch coord/harness-20260809-524784 conflicted on
    four scalars of the GOAL-ECDLP-001 head --- current_batch_id,
    dispatch_queue_path, latest_verified_commit and next_action --- with their
    sibling note keys. The branch side (2026-08-09, DEC-20260809-8f8dd7) named
    BATCH-ab1946. The origin/main side (2026-08-10, TASK-20260810-55845c, campaign
    RECON-20260810-002, successor act SUCC-ECDLP-HEAD, declared bookkeeping-only)
    named BATCH-ea56c5, and was itself already carrying a further adjudication,
    TASK-20260810-9b8038 (campaign RECON-20260810-003), which ruled BOTH_LIVE
    between BATCH-ea56c5 and a third batch, BATCH-ae8019. Resolving such a conflict
    by picking a side is forbidden; it must be resolved by supersession. This
    session held Read/Grep/Glob/Write/Edit only --- no shell, no git --- and
    verified every load-bearing fact below by reading committed records in the
    merged working tree.
  what_the_reading_established: >-
    THE DECISIVE FACT, WHICH NO EARLIER ACT COULD SEE. BATCH-ab1946 and BATCH-ae8019
    are not two lanes; they are two openings of ONE obligation. Read directly from
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-ab1946/batch.yaml and
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-ae8019/batch.yaml, both declare
    parent_batch BATCH-c3c474, both declare parent_evidence EV-ECDLP-f32446, both
    declare predecessor_experiment EXP-ECDLP-ffa5c3, and both list the identical
    five blocking findings REV-GAP-REPRESENTATION-007, REV-CANONICAL-SCHEDULE-008,
    REV-RESOURCE-CONSUMER-009, REV-PACKAGE-FINALIZATION-010 and
    REV-MUTATION-LAYER-011. Both trace their authority to the single restart
    directive of DEC-20260809-d5ff80 and of the write-once checkpoint
    ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c3c474.yaml, whose next_action
    calls for "a fresh non-overlapping design-repair batch" --- singular. They
    differ in the identifier of the successor each would write
    (EXP-ECDLP-d4d43e versus EXP-ECDLP-d7b3c3), in task identifiers, and in budget.
    Running both would write TWO immutable successors to ONE immutable predecessor,
    permanently forking the design lineage of EXP-ECDLP-ffa5c3 with no record able
    to say which supersedes it. Neither successor exists yet: no
    experiments/EXP-ECDLP-d4d43e/ and no experiments/EXP-ECDLP-d7b3c3/ path is
    present in the merged tree, so the fork has not happened and preventing it
    discards no produced work.
  why_this_defeats_the_precedent_for_a_third_live_lane: >-
    TASK-20260810-9b8038 held BATCH-ea56c5 and BATCH-ae8019 BOTH_LIVE on an
    explicitly stated basis: "The lanes are disjoint in every respect a
    contradiction could live in --- different predecessor and successor
    experiments ... different hypothesis attachment, different blocking-finding
    sets, different budgets, different review gates". Every one of those
    disjointness conditions FAILS between BATCH-ab1946 and BATCH-ae8019. Applying
    that ruling's own reasoning, rather than departing from it, therefore yields
    two live lanes and one duplicate, not three live lanes.

  resolution:
    current_batch_id: BATCH-ea56c5
    dispatch_queue_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ea56c5/dispatch_queue.json
    latest_verified_commit: 80f2d3f2304ee090185705c8fd87007ec6e5d356
    next_action: >-
      The origin/main text, retained as the single operative next action: carry
      the committed BATCH-ea56c5 queue to its ledger disposition under the caps
      DEC-20260809-6bd04d left unchanged. Not restated here; the goal head is
      authoritative for its own bytes.
    exactly_one_next_action: true

  grounds_for_each_field:
    current_batch_id: >-
      BATCH-ea56c5 stands. The branch's own head value is NOT preferred, and the
      reason is not that origin/main is newer. Between BATCH-ea56c5 and the
      BATCH-c3c474 lane the substantive comparison was already made on research
      grounds by TASK-20260810-9b8038 --- expected information gain toward this
      goal's mandated rho/BSGS cost accounting --- and this decision does not
      reopen it, having no new evidence bearing on it. Between BATCH-ab1946 and
      BATCH-ae8019 no comparison of research value is possible, because the two
      are substantively interchangeable; this session searched for a
      discriminating difference and found none.
    latest_verified_commit: >-
      80f2d3f2304ee090185705c8fd87007ec6e5d356 binds, and it binds as a RETAINED
      value, not an advanced one. Three grounds, in increasing weight. (1) It is
      strictly later within the SAME lane: the BATCH-c3c474 checkpoint records
      46bb65ecff664175f31aeaacc2f1dae9dd97640b as both design_snapshot_commit and
      latest_verified_commit, but a checkpoint cannot name the commit that commits
      it, so the ledger-archive content commit that durably disposed the batch is
      the later of two stages of one batch rather than a competing account.
      (2) Under the repository's receipt-binds-to-content-first contract, a
      content-verified archive with an advisory commit is a valid binding, and
      committed decision DEC-20260809-57b240 reports all four TASK-20260809-20aead
      path_sha256 as matching. (3) DECISIVE FOR THIS ACT: this session verifies no
      commit at all. 80f2d3f23 is the value already published on origin/main;
      writing 46bb65ecf would be an unverifying session moving a verification
      pointer BACKWARDS, which TASK-20260810-9b8038 step M5 forbids in terms
      ("advance latest_verified_commit --- no commit is verified by this ruling").
      Retaining the published value is the only available option that changes
      nothing. 46bb65ecf is NOT retracted: it remains the checkpoint's own recorded
      value and the commit binding the EXP-ECDLP-ffa5c3 design bytes, preserved in
      the head at prior_latest_verified_commit_branch_coord_harness_20260809.
    dispatch_queue_path: >-
      Moved with current_batch_id and next_action and not separately, so the head
      does not acquire a fresh head-internal mismatch of the kind
      RECON-20260810-001 was convened to repair.
    next_action: >-
      The origin/main next_action is operative because the head names its lane.
      The branch next_action is preserved byte-exact at
      next_action_batchab1946_20260809_superseded and is withdrawn as a DIRECTION
      only.

  disposition_of_batch_ab1946:
    status: recorded_not_dispatched
    not_a_third_live_lane: true
    closed: false
    rejected: false
    invalidated: false
    records_retracted: none
    detail: >-
      BATCH-ab1946 does not vanish and is not closed. Its opening decision
      DEC-20260809-8f8dd7, its batch.yaml, its frozen six-task queue and its
      TASK-20260809-b53ffb opening snapshot receipt are committed, immutable and
      untouched, and this decision publishes them rather than leaving them on an
      abandoned branch --- an unpublished duplicate is a ghost that the next
      concurrent session will collide with again. What is withdrawn is a
      DIRECTION: the queue is not dispatched, and the reserved identifiers
      EXP-ECDLP-d4d43e, EV-ECDLP-04078b and DEC-20260809-0676a1 are left unwritten,
      so that EXP-ECDLP-ffa5c3 acquires exactly one successor lineage.
    evidence_for_the_deprioritization: >-
      The two batch.yaml records themselves, read directly, plus
      ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c3c474.yaml and
      ledger/decisions/DEC-20260809-d5ff80.yaml, which authorize one successor
      batch and not two.
    budget_at_deprioritization: >-
      BATCH-ab1946 declared wall_clock_seconds 18000, memory_gb 4, maximum_runs 6,
      max_concurrent 1, with six task budgets summing to 17400 seconds. NONE of it
      was consumed by tasks 3 to 6, which never started. Tasks 1 and 2 (control
      plane and opening snapshot) ran; this session cannot measure what they
      consumed, because no batch checkpoint in this goal reports consumed wall
      clock, and it asserts no figure.
    test_boundary: >-
      Nothing was tested. This lane produced no design, no review, no verdict, no
      run and no observation, so the deprioritization rests on record structure
      alone and carries no implication whatever about whether the five REV findings
      can be repaired or whether the apparatus design is sound.
    remaining_uncertainty: >-
      Whether the BATCH-ae8019 lane will in fact produce EXP-ECDLP-d7b3c3 and clear
      its independent review is unknown and untested. Separately,
      TASK-20260809-991a81 --- the task DEC-20260809-57b240 names as its recording
      task --- is recorded by the goal head as absent from origin/main; that is an
      incompleteness in the SURVIVING lane's opening paperwork. It is recorded as
      an open item, it is not settled here, and it is not treated as a reason to
      prefer BATCH-ab1946, because procedural incompleteness in an opening is
      repaired by a superseding opening act rather than by a merge resolution.
    successor: BATCH-ae8019
    revisit_condition: >-
      If BATCH-ae8019 is checkpointed without producing EXP-ECDLP-d7b3c3, or is
      closed, paused or abandoned before its independent design-readiness review,
      the BATCH-ab1946 queue and its reserved identifiers may be revived by a
      superseding Coordinator decision citing DEC-20260810-1d3fbb. Its cards and
      budgets remain valid and are not withdrawn.
    what_is_not_the_ground: >-
      NOT first-in-time: both were opened 2026-08-09 and neither session could see
      the other. NOT lineal continuity, which TASK-20260810-9b8038 already
      considered and rejected as reducing to who held the pointer last. NOT quality
      of the opening record --- in one respect BATCH-ab1946's is the better of the
      two, since its archival_coverage block assigns every produced artifact to
      exactly one archival task and it deleted a superseded opening_archive block
      for exactly that reason. THE ACTUAL GROUND IS COST OF CHURN: BATCH-ae8019 is
      already published on origin/main, already named a live lane by a committed
      adjudication, and already recorded in the goal head, so preferring
      BATCH-ab1946 would require superseding all of that to obtain identical work.
      That is a bookkeeping ground, stated as one, and it is available only because
      no research ground distinguishes the two.
    recommendation_without_authority: >-
      The BATCH-ab1946 archival_coverage discipline is a reusable input the
      BATCH-ae8019 lane may adopt. This is a recommendation only; it edits nothing
      in BATCH-ae8019 and confers no obligation.

