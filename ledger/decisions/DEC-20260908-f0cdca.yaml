      The extra-start RNG material and
      Random seed are unchanged. Official
      starts 0..9999 are the prefix of the
      longer draw and keep the Stage 14
      pins at 10, 11, 9999, 10000, and
      10031. New last spare is index
      14095. Cells, D, n_walks, partition,
      addends, cap, walk RNG, and KS
      definition are unchanged. Hard gate
      remains fixture_pass. KS is not a
      gate. An H3 miss is not
      failed_infrastructure and not H1
      closure.
    - >-
      Filing is not authorization. The
      4096-spare run is not authorized
      by this decision. Stage 15 stays
      unauthorized. RUN-ECDLP-420e73-S14
      is reserved for a later authorized
      execution and is not issued for the
      32-spare stop.

