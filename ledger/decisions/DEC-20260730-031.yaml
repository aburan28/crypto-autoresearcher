  # -------------------------------------------------------- branch determination
  branch_determination_recorded_as_the_pre_registered_rule_requires:
    rule: >-
      Pre-registered in the BATCH-015 opening commit and untouched by
      QUEUE-AMEND-20260730-002: WHICH BRANCH APPLIES IS DECIDED BY THE EXISTENCE
      AND ACCEPTANCE OF THE TASK-20260730-032 SNAPSHOT COMMIT, AND NEVER BY THE
      CONTENT OF THE MEASUREMENTS.
    determination: >-
      BRANCH 1. ledger/evidence/EV-STR-005.yaml IS WRITTEN. TASK-20260730-035
      declares eight paths and commits eight; NO DECLARE-THEN-DEVIATE SHORTFALL
      ARISES and none is recorded, because none occurred.
    basis: >-
      The snapshot exists at e3cf9fdd770cbab3ebf55691a60143ace2b75f4c with
      parent 085f5d485cc21b4c46e4c6fb4a1db788567f79b7 and was ACCEPTED: its
      committed receipt records declared_path_count 8 equal to
      committed_path_count 8, reachable_from_head true, parent_matches_expected
      true, changes_exactly_declared_artifacts true, scope_expansion none,
      harness_untouched true, and independent_hash_confirmation CONFIRMED with
      all eight sha256 values agreeing across TWO INDEPENDENT COMPUTATIONS. The
      validator independently re-derived all eight from git object content and
      reports 8 of 8 MATCH with no drift; the red team independently re-hashed
      the four substantive artifacts and reports all four identical.
    OBJ_7_answered_on_the_merits: >-
      The red team raised as OBJ-7 that QUEUE-AMEND-20260730-002 creates a
      TOOLING-DRIVEN PRESSURE to mint an evidence record for a batch whose own
      ceiling says it produces no result, because
      tools/research_dispatch.py._validate_ledger_archive requires a `ledger`
      archive to declare at least one ledger/evidence/ path unconditionally.
      THE HAZARD IS REAL AND IS RECORDED AS ANSWERED RATHER THAN DENIED:
      EV-STR-005 IS WRITTEN BECAUSE AN ACCEPTED SNAPSHOT EXISTS, AND IT WOULD
      HAVE BEEN WITHHELD HAD ONE NOT, WITH THE SHORTFALL RECORDED. NO RECORD WAS
      WRITTEN TO MAKE A DECLARED PATH COUNT COME TRUE.

  # ----------------------------------------------------------------- rationale
  rationale:
    - id: R-1
      statement: >-
        THE PROBE IS VALID AS A RUN SET AND IS ADMISSIBLE AS EVIDENCE, AND I
        CHECKED VALIDITY BEFORE INTERPRETING ANYTHING. Expected unit count 28,
        observed 28; every unit terminal_status `completed` and valid true; the
        manifest schema-complete but for two low-severity omissions (L-7);
        instance parameters and derived seeds computed rather than transcribed
        and independently re-derived; raw records and summary in agreement at 28
        of 28 on all four fields plus 2 of 2 Part A assertions; the control arm
        E-prime comparable by construction on curve, size, liftability,
        determinism and derived seed. No unit was invalid, no unit timed out, no
        unit was cancelled by budget, and units_not_completed_named is empty and
        independently found empty. THERE IS NOTHING HERE TO SEND BACK TO THE
        EXECUTOR.
    - id: R-2
      statement: >-
        THE PRE-REGISTRATION HOLDS AND WAS CHECKED AGAINST GIT RATHER THAN
        ACCEPTED. The falsification condition was frozen in the BATCH-015
        opening commit d0bdec84, NINETEEN MINUTES AND TWO COMMITS BEFORE the
        probe artifacts at e3cf9fdd; R_base and Q are frozen in the contract;
        the driver implements exactly the two pre-registered clauses with no
        third clause, no threshold substitution and no re-weighting; and the two
        queue amendments are PURE ADDITION, 274 insertions and zero deletions,
        with the condition text, the claim ceiling, the fourteen cells, the two
        arms and the Executor card BYTE-IDENTICAL across them. NOTHING WAS
        FITTED AFTER SEEING DATA AND NO SUCCESS CRITERION WAS CHANGED AFTER
        OBSERVING AN OUTCOME.
    - id: R-3
      statement: >-
        THE PRINCIPAL FINDING OF THIS BATCH IS THAT ITS PRINCIPAL ASSERTION WAS
        NON-INFORMATIVE, AND IT IS RECORDED AS THE HEADLINE RATHER THAN AS A
        CAVEAT. CTRL-4 CONDITION (ii) IS A TAUTOLOGY OF THE CONSTRUCTOR.
        _build_phi_invariant_factor_base builds its output by the single
        statement xs.extend(orbit) with
        orbit = [x, (zeta3 * x) % p, (zeta3 * zeta3 * x) % p], never permutes or
        otherwise mutates xs, and returns xs[:B], which preserves whole leading
        triples; condition (ii) re-evaluates that same expression against the
        values it produced. THE RED TEAM RAN THE MUTATION RATHER THAN ARGUING
        IT: calling the committed builder at B = 192 on CURVE-J12S1 with
        zeta3 = 5 (cube 125 mod 2293) and zeta3 = 1234 (cube 1799 mod 2293),
        NEITHER A CUBE ROOT OF UNITY, BOTH CTRL-4 CONDITIONS REPORT PASS.
        AN ASSERTION THAT PASSES ON A NON-CUBE-ROOT IS NOT AN ASSERTION ABOUT
        PHI-INVARIANCE. Only the LENGTH limb of D-3 was actually tested. The
        condition also checks only COMPLETE blocks and is therefore BLIND BY
        CONSTRUCTION to the truncated tail at B = 3q + 1, which is where the
        contract's own ladder lives; at B = 193 the probe records the tail index
        [192] and checks nothing about it.
    - id: R-4
      statement: >-
        THE ONE REAL TEST WAS PASSED, AND IT IS REPORTED WITH ITS MARGIN. The
        supply clause required max(0, R_base(B) - len(relations)) >= 2 at some
        unit. It was GENUINELY CAPABLE - at B = 12 with m = 2 the pair-coverage
        argument gives no a-priori guarantee - and it did not fire: shortfall 0
        at 28 of 28, maximum shortfall 0, tightest unit L12/arm_E_prime at
        len(relations) = 17 against R_base = 5 where firing required 3 or fewer,
        clear by a factor of 5.7. THE CORRECT WORDING IS "the supply limb was
        evaluated at all 28 units and did not fire; the tightest unit was
        L12/arm_E_prime at 17 against R_base 5", AND NEVER "the falsification
        condition passed".
    - id: R-5
      statement: >-
        THE OTHER TWO LIMBS CARRY LESS THAN THEY READ. The len(F) != B clause
        was CAPABLE IN PRINCIPLE AND DEAD IN PRACTICE - 139 of 10600 permitted
        draws consumed at B = 192 and 140 of 10650 at B = 193, a margin of about
        76x, with the first short return at B of about 1142, roughly six times
        the tested B. The block identity was NOT CAPABLE AT ALL, at any B, on
        any curve, with any zeta3. Note precisely what this does and does not
        impugn, as the red team is careful to: CONDITION (ii) IS NOT PART OF THE
        PRE-REGISTERED FALSIFICATION CONDITION, WHICH CITES ONLY len(F) != B, SO
        THE CONDITION ITSELF IS NOT IMPUGNED; what is impugned is the headline
        sentence "both CTRL-4 structure assertions PASS", where the information
        content is silently zero.
    - id: R-6
      statement: >-
        TWENTY-FOUR OF TWENTY-EIGHT SUPPLY UNITS MEASURE THE INSTRUMENT, AND THE
        MEMBERS ARE NAMED. len(relations) = 60 = Q at L24, L25, L48, L49, A12M3,
        A13M3 both arms (12 units); = 106 or 107 = Q at L96, L97, X96, X97 both
        arms (8 units); = 183 = the target-cycle ceiling at L192, L193 both arms
        (4 units). ONLY L12 AND L13 AT BOTH ARMS - FOUR UNITS - ARE UNCENSORED.
        THE TWO CELLS THE BATCH WAS BUILT AROUND ARE THE TWO MOST CONFOUNDED IN
        IT, AND ANY LADDER STATEMENT ACROSS B BUILT ON THE CENSORED CELLS IS
        CONFOUNDED ABOVE THE CEILING.
    - id: R-7
      statement: >-
        BOTH REVIEWS INDEPENDENTLY ESTABLISH THAT 183 IS A GENERATOR PROPERTY,
        AND THE VALIDATOR PINNED IT FURTHER. _collect_relations enumerates
        k = (t_idx + 1) * c mod (n - 1) + 1 with c = max(2, seed % max(2, n-3));
        on CURVE-J12S1 the derived seed is 100 and n = 733, so c = 100,
        gcd(100, 732) = 4, and the progression visits exactly 732 / 4 = 183
        distinct k values, verified by direct computation to yield exactly 183
        distinct target x-coordinates. IT IS GENUINE SATURATION OF THE
        GENERATOR'S IMAGE AND NOT A BREAK-CONDITION ARTIFACT - the count is
        invariant at 183 over simulated t ranges of 300, 1010 and 5000, so the
        range(num_targets * 5) break is not binding - AND IT IS NOT EXHAUSTION
        OF THE CURVE: the curve affords 366 distinct x-coordinates over all k,
        and the loop reaches EXACTLY 50.0 PER CENT of them because every k it
        generates satisfies k = 1 (mod 4). CALLING 183 AN EXHAUSTION OF THE
        TARGET RANGE ON A p = 2293 CURVE WOULD OVERSTATE IT BY A FACTOR OF TWO.
        No cell on CURVE-J12S1 can ever obtain more than 183 base rows
        regardless of B or Q, and a future execution at larger quota on this
        curve HITS THE SAME WALL SILENTLY.
    - id: R-8
      statement: >-
        A CORRECTION THAT MUST TRAVEL WITH THIS DECISION: THE E-PRIME ARM IS A
        CORRECTLY MATCHED NULL OBJECT AND THE ARTIFACT TELL IS ABSENT. Both
        reviewers traced it through harness.semaev.build_factor_base and report
        it matched to arm A-prime on curve, size, liftability, determinism and
        derived seed, differing only in the domain-separation tag and the
        absence of the orbit-completion step. THE VALIDATOR CHECKED DECAY:
        E-prime elements whose zeta3-image is also in E-prime run 0 of 12 at
        B = 12 and 26 of 192 at B = 192 - chance level at about 17 per cent
        coverage, expectation about 32 - against arm A-prime's 64 of 64 complete
        blocks. THE QUANTITY DECAYS TOWARD ZERO AS THE DESTROYING PARAMETER IS
        TAKEN TO ITS LIMIT, WHICH IS WHAT A NULL OBJECT MUST DO, SO THE
        CANONICAL ARTIFACT TELL IS ABSENT. THE IDENTICAL 60/60, 106/106, 107/107
        AND 183/183 PAIRS ARE FORCED BY CENSORING AND ARE NOT EVIDENCE THAT THE
        ARMS ARE INDISTINGUISHABLE; where the clamp does not bind the arms
        separate, 29 versus 17 at L12 and 31 versus 20 at L13. A SUCCESSOR WHO
        READS 183/183 AS A CONTROLLED NULL IS READING THE CLAMP.
    - id: R-9
      statement: >-
        THE TWO REVIEWS DIVERGE EXACTLY WHERE THE SHARED-MODEL FALLBACK PREDICTS
        THEY WOULD, AND THIS IS ADOPTED AS A LIVE METHODOLOGICAL FINDING OF THE
        BATCH RATHER THAN AS A FOOTNOTE. The validator PASSED CTRL-4 by
        re-deriving both conditions independently in a separate process; the red
        team showed the check is non-informative. THEY ARE NOT IN CONFLICT ON
        FACT - the identities do hold - BUT THE VALIDATOR'S INDEPENDENT
        RE-DERIVATION REPRODUCED THE SAME TAUTOLOGY AND DID NOT DETECT IT. The
        Executor, the Validator and the Red Team ALL resolve to claude-opus-5
        with model_verified false and fallback_used true; model independence is
        unavailable on this harness (INT-BATCH015-D) and is claimed nowhere. The
        hazard is CORRELATED BLIND SPOTS: a check implemented by transcribing
        the constructor's own expression, and a reviewer on the same model
        finding it faithful to the contract, agree correctly about fidelity and
        wrongly about informativeness. The red team found the defect not by
        reading but by RE-EXECUTING THE COMMITTED BUILDER WITH A BOGUS zeta3 AND
        WATCHING THE ASSERTION PASS.
      standing_mitigation_adopted: >-
        REQUIRE A MUTATION TEST FOR EVERY ASSERTION-STYLE CONTROL. A CONTROL
        THAT HAS NEVER BEEN SHOWN TO FAIL ON A DELIBERATELY BROKEN INPUT IS NOT
        KNOWN TO BE A CONTROL. Mutation evidence is model-independent in a way
        that cross-reading is not, and it costs no model diversity. THIS IS
        ADOPTED AS STANDING PRACTICE FOR THIS GOAL AND BINDS EVERY SUCCESSOR
        CONTRACT THAT CONTAINS AN ASSERTION-STYLE CONTROL.
    - id: R-10
      statement: >-
        NO CLAIM-CEILING BREACH WAS FOUND ANYWHERE, AND THAT IS SAID PLAINLY
        RATHER THAN HEDGED. The red team checked all nine prohibitions item by
        item by recursive grep plus manual read and found NO VIOLATION OF ANY;
        the validator independently found zero occurrences of the forbidden
        constructions in the four substantive artifacts and confirmed that the
        seven occurrences in the manifest are every one inside a negation. Wall
        clock and RSS are labelled budget accounting in three places; run_ids is
        empty with its reason; the certificate block states that no certifiable
        claim is made rather than emitting an empty certificate; the queue's
        cell table was recomputed rather than adopted, with table_disagreements
        empty and independently found empty. THE EXECUTOR EXERCISED REAL
        DISCIPLINE AND THIS DECISION RECORDS IT. THE EXPOSURE IS DOWNSTREAM, IN
        WHAT WILL BE READ, NOT UPSTREAM IN WHAT WAS WRITTEN.
    - id: R-11
      statement: >-
        THE BATCH IS NOT TARGET-CLASS AND ITS PARETO POSITION IS RECORDED
        HONESTLY RATHER THAN LEFT NULL. sota_delta = 0 ON TIME, ON MEMORY, ON
        DATA/QUERIES AND ON EXPONENT. dominated_by is non-null and was checked
        on every axis: Pollard rho WITH the order-3 automorphism
        (Wiener-Zuccherato; Duursma-Gaudry-Morain), the specialized baseline for
        j = 0 curves; plain Pollard rho; BSGS; and, within this campaign,
        EV-STR-001 and EV-STR-003. The only reproducible speedup anywhere in
        this lineage is the classical constant factor r = 3, WHICH IS ALREADY
        THE SPECIALIZED BASELINE RATHER THAN AN IMPROVEMENT ON IT AND IS ITSELF
        NOT TARGET-CLASS UNDER RULE A1. BATCH-015 is admitted under A1's
        building-block clause only.
    - id: R-12
      statement: >-
        THE CONDITIONAL-RESULT PAIRING RULE IS DECLARED INAPPLICABLE WITH ITS
        REASON RATHER THAN SKIPPED OR SATISFIED BY A FABRICATED PAIRING. This
        batch states NO conditional result and introduces NO numbered heuristic:
        it asserts deterministic properties of a deterministic builder and
        counts the output of a deterministic loop at fixed quotas. THERE IS NO
        DISTRIBUTION TO SAMPLE AND NOTHING TO VALIDATE AT SCALE. Both reviews
        concur. FORWARD WARNING ADOPTED FROM THE RED TEAM'S HC-2: the moment a
        successor writes "the phi-invariant factor base supplies more
        relations", that is a distributional claim over instances from ONE curve
        and ONE seed, the pairing obligation attaches to THAT record, and the
        four uncensored units cannot support it.
    - id: R-13
      statement: >-
        THE PRE-REGISTERED DISPOSITION IS NOT TRIGGERED AND I SAY SO WITHOUT
        MANUFACTURING AN OBJECTION. Reopening the execution question on the
        merits was made contingent on the falsification condition FIRING, and it
        did not fire. Nothing measured contradicts DEC-20260729-004's derivation
        on the two facts about committed code it assumes, so far as those facts
        were actually reached. THE STAND-DOWN'S BASIS IS NOT SHOWN DEFECTIVE BY
        THIS PROBE. EQUALLY, NOTHING HERE SUPPORTS APPROVING OR ENLARGING
        ANYTHING, AND NEITHER REVIEW RECOMMENDS THAT IT SHOULD.
    - id: R-14
      statement: >-
        WHAT THE PROBE CANNOT SETTLE REMAINS UNSETTLED AND IS NAMED SO IT IS NOT
        DISCOVERED LATER. DRIVER FIDELITY is unreachable by any probe because
        THE DRIVER HAS NEVER BEEN WRITTEN - neither arm's closure is committed
        code - and a derivation whose committed-code hypotheses hold is not
        thereby a correct prediction about an unwritten driver. A COUNTEREXAMPLE
        CERTIFICATE is unavailable without execution and remains the unpaid
        price of the stand-down. AND ANYTHING ABOUT H-STR-002 ITSELF.
    - id: R-15
      statement: >-
        RULE-BATCH015-SCOPE IS CARRIED INTO THE LEDGER BY THIS DECISION, AS
