  id: DEC-20260730-031
  batch_id: BATCH-015
  goal_id: GOAL-ECDLP-001
  archived_by: TASK-20260730-035
  decided_by: coordinator
  decided_at: '2026-07-30'
  decided_at_precision: >-
    DATE ONLY. The session recording this decision has NO SHELL, no interpreter,
    no git, no dispatcher, no allocator and no clock access. IT MAKES NO COMMIT
    AND WRITES NO RECEIPT. It fabricates no wall-clock time, no commit
    identifier, no hash, no verdict and no measurement. Every commit identifier
    and every hash appearing below is TRANSCRIBED from a committed receipt or
    from an independent review report that states it verified the value against
    Git object content, and is labelled as transcribed rather than verified
    here.

  # ---------------------------------------------------------------------- context
  context: >-
    BATCH-015 was authorized by BUDGET-AMEND-20260730-001, which raises
    campaign_budget.maximum_batches from 14 to 50 on the USER'S EXPLICIT
    DIRECTION of 2026-07-30. THE AUTHORIZATION IS THE USER'S AND IS NOT A
    COORDINATOR SELF-GRANT; the maximum_batches = 14 pause condition FIRED ON
    ITS OWN TERMS AT THE BATCH-014 CLOSE, THAT FIRING IS NOT RETRACTED, the
    closing Coordinator's refusal to self-grant a fifteenth batch WAS CORRECT
    AND STANDS UNRETRACTED, and the condition is discharged by that amendment
    and BY NOTHING BATCH-014 ACHIEVED.
    The batch dispatched ONE bounded supply-and-structure probe of the committed
    code and nothing else - RT35-CTRL-1 and RT35-CTRL-2 of the BATCH-014
    red-team report, dispatched together as a single Executor card - plus the
    standard chain of snapshot archive alone, two independent reviews, ledger
    archive alone. (a) STRUCTURE: generate CURVE-J12S1 by the committed path,
    call _build_phi_invariant_factor_base at B = 192 and B = 193, and assert
    both of CTRL-4's conditions. (b) SUPPLY: at every declared cell and both
    arms, call _collect_relations with the orbit closure DISABLED and report
    only len(relations) against R_base(B) and against the measured
    distinct-target count. NO CLOSURE, NO ALPHA, NO LADDER, NO DRIVER, NO RANK
    MEASUREMENT AND NO COST QUANTITY OF ANY KIND.
    The probe executed cleanly, its eight-artifact package was snapshot-archived
    at e3cf9fdd and that snapshot was accepted, and two independent
    non-originating sessions reviewed it: the TASK-20260730-033 validator
    returned `passed` with `blocks_ledger_record: false`, and the
    TASK-20260730-034 red team returned SOUND AS EXECUTED AND OVER-READ AS
    FRAMED, with a mutation-verified defect in the batch's principal structural
    assertion. This decision carries the pre-registered scope ruling into the
    ledger, records the branch determination, adopts both reviews in full
    including their dissents against themselves, and states what BATCH-015 does
    and does not establish.

  # ------------------------------------------------------------------- decision
  decision: refine

  decision_label_source: >-
    docs/task-lifecycle.md section 9, where `refine` means improve the mechanism
    or the experiment. The precedent in this lane is DEC-20260729-004, which
    closed BATCH-014 `refine` on a derivation obtained before any data. THE
    LABEL IS USED FOR THE SAME KIND OF OBJECT HERE: what this batch bought is a
    correction to the INSTRUMENT AND TO THE CONTRACT'S OWN CONTROL, not a
    property of the object the contract was built to study.

  decision_in_one_sentence: >-
    THE PROBE EXECUTED CLEANLY AND THE ONE GENUINELY CAPABLE LIMB OF ITS
    PRE-REGISTERED FALSIFICATION CONDITION WAS PASSED, BUT ITS PRINCIPAL
    STRUCTURAL ASSERTION WAS SHOWN BY EXECUTED MUTATION TO BE A TAUTOLOGY OF THE
    CONSTRUCTOR AND 24 OF ITS 28 SUPPLY UNITS REPORT A SATURATED INSTRUMENT
    CONSTANT, SO THE BATCH REFINES THE INSTRUMENT RATHER THAN ESTABLISHING A
    PROPERTY OF THE OBJECT.

  decision_label_justified_against_every_alternative:
    support: >-
      REJECTED, AND THIS IS THE REJECTION THAT MATTERS MOST. `support` would
      require evidence raising confidence in a hypothesis. EV-STR-005's
      direction is `neutral` and its strength is `preliminary`. Of the
      pre-registered condition's three checkable limbs, ONE was a real test.
      Reading "both structure assertions PASS, 28 units with maximum shortfall
      zero, condition did not fire" as a clean bill of health is EXACTLY the
      over-reading the red team was dispatched to catch, and it caught it. A
      NON-FIRING FALSIFICATION CONDITION IS NOT SUPPORT; IT IS THE ABSENCE OF
      ONE SPECIFIC DISQUALIFICATION AT FOURTEEN TOY CELLS.
    weaken: >-
      REJECTED. `weaken` would assert new evidence lowering confidence in
      H-STR-002. NOTHING HERE BEARS ON H-STR-002 IN EITHER DIRECTION - the probe
      measures no alpha, no rank, no yield and no cost, and invokes no closure -
      and H-STR-002 is ALREADY `weakened` on DEC-20260727-009's grounds, which
      are untouched. Re-weakening a hypothesis on a finding about a control's
      informativeness would misdescribe both the basis and the object. Queue
      rule N-1 forbids the movement independently.
    reject_scoped: >-
      UNAVAILABLE, ON TWO INDEPENDENT GROUNDS, EITHER OF WHICH SUFFICES.
      (1) agents/coordinator.md forbids `reject_scoped` on a single
      unreplicated empirical-only run set outright, and this is one probe on one
      host with one realisation per cell. (2) Queue rule N-6 forbids
      `reject_scoped` to this batch by name. Note what is NOT being rejected
      even informally: the CTRL-4 tautology is a defect in a CONTROL, not a
      refutation of any mathematical claim - phi is still an automorphism and
      the constructor still emits whole orbits.
    inconclusive: >-
      REJECTED AS UNDERSTATING, AND THE REASON IS RECORDED RATHER THAN ASSERTED.
      `inconclusive` is the required outcome where evidence CANNOT DISCRIMINATE
      BETWEEN EXPLANATIONS. That is not this situation. Three things ARE
      discriminated, and sharply: that CTRL-4 condition (ii) cannot fail for any
      B, any curve or any zeta3 (shown by running the mutation, not by
      argument); that 183 is 732 / gcd(100, 732) and therefore a property of the
      target generator rather than of the curve (shown by two independent
      derivations plus a simulation invariant over t ranges of 300, 1010 and
      5000); and that the supply limb was a real test cleared by a factor of
      5.7 at its tightest unit. NOTE THE ONE PLACE `inconclusive` DOES BIND AND
      IS RECORDED: THE ARM SEPARATION, at EV-STR-005 UC-B, where the evidence
      genuinely cannot discriminate an orbit-structure effect from a coverage
      effect and NOTHING IS ASSERTED IN EITHER DIRECTION.
    approve: >-
      REJECTED AND NOT AVAILABLE. Nothing is approved by this decision. Neither
      review recommends approving anything; the red team says in terms that
      NOTHING HERE SUPPORTS APPROVING ANYTHING AND IT RECOMMENDS NO APPROVAL AND
      NO ENLARGEMENT. EXP-STR-004 IS NOT APPROVED AND IS NOT EXECUTED, and the
      successor end-to-end structured-solve cost experiment IS NOT APPROVED, NOT
      FROZEN, NOT SCHEDULED AND NOT AUTHORIZED.
    revise: >-
      REJECTED AS MISNAMING THE OBJECT. `revise` in this ledger attaches to a
      deliverable returned for rework - a proposal, a contract, a report. NO
      DELIVERABLE OF BATCH-015 IS DEFECTIVE. The probe package is honest, in
      scope, byte-verified and reproducible; both reviews say so and the red
      team records that the Executor exercised real discipline. What needs
      changing is a CONTROL INSIDE A FROZEN CONTRACT and the METHOD by which
      assertion-style controls are accepted - which is refinement of the
      instrument, not rework of a submission.
    replicate: >-
      REJECTED AS THE WRONG NEXT MOVE, THOUGH IT IS THE CLOSEST RUNNER-UP.
      Replication is what a `weaken` on thin evidence would owe, and no `weaken`
      is made. More decisively: REPLICATING A DETERMINISTIC COMPUTATION BUYS
      NOTHING. The validator already re-executed all 28 units and both Part A
      assertions in a separate process with zero mismatches; a third execution
      of the same committed bytes on the same platform would reproduce the same
      numbers, INCLUDING THE TAUTOLOGY. The red team makes the same argument
      against its own CTRL-RT034-E and would not run it: breadth on a quantity
      that is saturated at 24 of 28 units multiplies censored numbers rather
      than producing information.
    expand: >-
      REJECTED. Expansion - more curves, more seeds, more cells - is precisely
      CTRL-RT034-E, which the red team names and REFUSES so that its own
      recommendation is falsifiable. Decensoring strictly dominates it, and
      expansion should be reconsidered only after the quantity is uncensored.
    pause: >-
      REJECTED. Nothing is exhausted. campaign_budget.maximum_batches stands at
      50 on the user's authorization with fifteen consumed; no pause condition
      fires on this record; there IS an auditable, bounded, milliseconds-scale
      next action within budget; and the expected information gain of that
      action is not low. THE GOAL STAYS `active`.
    supersede: >-
      REJECTED. This decision supersedes no committed record. It carries
      RULE-BATCH015-SCOPE from the coordination plane into the ledger, which is
      a first recording and not a supersession, and it edits nothing. Every
      prior firing, deviation and supersession stands unretracted.

