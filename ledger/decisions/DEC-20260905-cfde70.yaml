coordinator_decision:
  id: DEC-20260905-cfde70
  context: >-
    Opening BATCH-79a0cb on GOAL-SSI-001 under the single next action of the
    committed goal head and of DEC-20260905-5f5592. Three tasks: an independent
    red-team pass on the drafted superseding amendment for
    experiments/EXP-WESOVOW-001/specification.yaml:39-40, one isolated snapshot
    commit, one isolated ledger archive. Filed as a ledger record because this
    campaign files its opening decisions (DEC-20260904-9be0f2 opened BATCH-dc1424);
    the authoring task held no shell, could not mint an identifier, and correctly
    left the block UNPUBLISHED in batch.yaml rather than inventing one.
  decision: approve
  target_ids:
    - GOAL-SSI-001
    - BATCH-79a0cb
    - EXP-WESOVOW-001
    - TASK-20260905-6d5c9c
    - TASK-20260905-06907f
    - TASK-20260905-e1d527
  rationale:
    - >-
      THE RED-TEAM PASS IS THE NAMED PRECONDITION for approving the draft, recorded
      as such by DEC-20260905-5f5592, and is the campaign's only live enactment
      path. It needs no run, solver, network or second backend.
    - >-
      THE DEFECT REPRODUCTION IS GIVEN AS AN ATTACKABLE OBJECT, NOT A PREMISE.
      Three named dissolving readings are put to the red team, and the scope
      assumption -- which survived an independent enumeration of all 25 top-level
      blocks of the frozen file -- is handed over to be attacked rather than
      inherited.
    - >-
      F-1 IS CARRIED IN AS A CONFIRMED LIVE DEFECT AND GENERALIZED. AC-4's eighth
      pattern carries the uppercase literal C1 while scan_text lowercases the
      haystack, so it can never fire; verified three ways, including that the full
      AC-4 vocabulary returns zero hits on the sentence it exists to catch. Joint
      R2 asks the wider question the instance raises: what else in that package has
      the shape of a check that cannot fail. Every pattern of every scanning
      vocabulary is to be exercised on a constructed input and the count reported.
    - >-
      F-3 IS ATTACKED TOGETHER WITH THE COORDINATOR'S OWN ADOPTED CORRECTION. The
      package's "C3 forces the same set independently of C4" is overstated since
      C3's clause 2 entails C4; the monotonicity route DEC-20260905-5f5592 adopted
      in its place has itself never been checked by anyone, and R3 checks it.
    - >-
      A `holds` VERDICT IS CONTRACTED AS A FULL RESULT IN ADVANCE, in the review
      plan, the batch file and the card, with "manufactured objections are worse
      than none" stated in all three. Two independent sessions already reproduced
      the defect and two sources outside the file corroborate the missing term;
      straining to break it in order to justify the pass is this batch's named
      failure mode.
    - >-
      NO BLIND PHASE IS DECLARED, and the absence is declared rather than left
      silent. Nothing here re-derives a value the repository already holds, and the
      object under attack is exactly what the red team must read, so
      --blind-history is recorded not applicable and the snapshot card forbids
      running or recording it. An unnecessary hygiene block teaches readers to
      ignore the necessary ones -- the opposite failure to CORR-20260905-547849,
      and worth avoiding for the same reason.
    - >-
      THE ARCHIVE TOPOLOGY WAS CHOSEN TO RENDER, NOT ASSUMED TO. A three-task batch
      with one producer and two archive-block tasks CANNOT render through
      tools/research_dispatch.py: archive.source_task_ids must be non-empty, a
      non-archive task may be assigned to at most one archive, and every
      non-archive task must be assigned exactly once. BATCH-752ef2 only satisfied
      this because it had two producer groups. Here the snapshot task performs a
      real commit but carries no archive block, and the ledger task is the single
      kind: ledger archive owning both non-archive tasks under binding_mode
      content_first. Verified by the dispatching session: the queue renders 11/11
      gates with the red team Ready.
  evidence_refs:
    - ledger/goals/GOAL-SSI-001/goal.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml
    - ledger/evidence/EV-SSI-2aaf6f.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/amendment_controls.py
  limitations:
    - >-
      APPROVES A BATCH, NOT AN EXPERIMENT, AN AMENDMENT OR A RESULT.
      EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1; GOAL-SSI-001
      stays `active`; no completion criterion is met or approached. Nothing was
      measured and the recorded prior is a pre-commitment, not a finding.
    - >-
      SESSION-INDEPENDENT ONLY, NEVER MODEL-INDEPENDENT, and foreclosed in advance
      rather than claimed and withdrawn: only `local` resolves, the prior round's
      producer receipt recorded claude-sonnet-5 against a self-report of
      claude-opus-5 with model_verified false, and every agent is a subagent of one
      orchestrating session.
    - >-
      BLINDNESS IS DELIBERATELY LIFTED for the red team, so its agreement with F-1,
      F-3 or F-7 is NOT independent of the first report. The mitigations -- an
      attested reading order on R1 and a per-joint "what I did not accept" -- are
      declared weak rather than presented as a substitute.
    - >-
      ONE REVIEWER AGAIN. After this pass the amendment will have been examined by
      two independent sessions and no more.
    - >-
      CF-9 IS NOW HELD FOR A SECOND CONSECUTIVE BATCH; the ledger archive must
      dispatch it next or record a reason. CF-10, CF-13 (F-1's one-character fix),
      CF-14 and CF-19 remain live and nothing in the tree is repaired by this batch.
    - >-
      CF-16 IS DISCHARGED, and the records that call it OUTSTANDING are immutable.
      check_review_independence.py --batch was run on BATCH-752ef2 by the
      dispatching session and PASSED with exit 0. DEC-20260905-5f5592 and
      checkpoints/BATCH-752ef2.yaml are corrected by a successor record, never
      edited.
  next_actions:
    - >-
      Dispatch TASK-20260905-6d5c9c alone at review-adversarial/xhigh in an
      independent session, and record its launching prompt verbatim for the
      snapshot receipt (CF-15).
    - >-
      Then TASK-20260905-06907f alone: the three-path snapshot commit plus
      check_review_independence.py --batch on this batch, recorded verbatim.
    - >-
      Then TASK-20260905-e1d527 alone: the eight-path content_first ledger archive,
      re-verifying the snapshot's three hashes and its ancestry.
    - >-
      Hold the carried-forward list with origins. CF-9 is next or gets a recorded
      reason; CF-13 travels with the next writing task on amendment_controls.py;
      CF-19 belongs to the next Coordinator archive that declares it.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `approve` on a batch composition resting on no evidence record of this
      round. No task has run and there is no finding to promote; promoting a batch
      design would present a plan as a result.
  decided_by: coordinator
  decided_at: '2026-09-05'
