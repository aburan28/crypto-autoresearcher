  context: Freeze isolated Linux dependency preparation while source and supervisor reviews continue.
  rationale:
  - The approved shared-instance algorithm imports pinned harness/toycurve.py,which depends on SymPy. The existing
    official Python helper image has not been admitted as the arithmetic environment.
  - PyPI release metadata supplies exact pure-Python SymPy1.14.0 and mpmath1.3.0 wheel hashes; the versions
    match the source-check host observations. Freeze these versions prospectively rather than install an unbounded
    latest dependency.
  - This is a necessary runtime prerequisite,not a new experiment or a replacement for independent source/guard
    review. It remains queued behind existing live owners under unchanged max_concurrent2.
  - Standing authorization covers isolated reversible dependency preparation. No scientific generator,solver
    or live group-OOM control is authorized by this task.
  approved_protocol:
    purpose: Prepare and inspect an isolated Linux Python dependency image for future709063shared-instance/solver
      work. This does not execute a fixture generator or admit a scientific runtime.
    base_image: docker.io/library/python@sha256:c89921a0c7b42f27338ed8c279fb370e69e941c92460f91895d08304e844b0b4
    platform: linux/arm64
    endpoint: unix:///Users/adamburan/.docker/run/docker.sock
    packages:
    - name: sympy
      version: 1.14.0
      filename: sympy-1.14.0-py3-none-any.whl
      url: https://files.pythonhosted.org/packages/a2/09/77d55d46fd61b4a135c444fc97158ef34a095e5681d0a6c10b75bf356191/sympy-1.14.0-py3-none-any.whl
      sha256: e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
      size: 6299353
    - name: mpmath
      version: 1.3.0
      filename: mpmath-1.3.0-py3-none-any.whl
      url: https://files.pythonhosted.org/packages/43/e3/7d92a15f894aa0c9c4b49b8ee9ac9850d6e63b03c9c32c0367a13ae62209/mpmath-1.3.0-py3-none-any.whl
      sha256: a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
      size: 536198
    steps:
    - Read-only verify local Unix Docker endpoint and cached exact base image digest,OS/architecture,actual
      Python/pip identity and VM memory. No new base-image pull,remote backend or daemon setting change.
    - Download only the two exact HTTPS wheel URLs into a unique owned temporary directory with ordinary TLS
      verification. Verify complete byte sizes and SHA256 before any copy/install. No TLS bypass; retain the
      earlier urllib local-issuer failure separately from the successful curl metadata read.
    - Create one labelled installation container from the exact base,network none,no host mounts,root user,cap-drop
      ALL,no-new-privileges,pids64,cpu1,memory2GiB,swap0. Its root filesystem is writable solely for package
      installation. Copy only the two verified public wheels,exact requirements and task installer into this
      container before start.
    - Installer re-verifies wheel hashes,then runs python -m pip install --no-index --no-deps --no-compile
      --no-cache-dir --require-hashes --find-links with the exact requirements file. No extras,resolver downloads,unbound
      upgrades or host installation. Preserve commands,stdout/stderr,exits and actual resource observations.
    - Run pip check and import/version checks for sympy1.14.0,mpmath1.3.0 and actual Python. Retain the distribution
      file inventory and aggregate canonical file-hash map,including missing or changed files. No explicit
      symbolic calculation,curve/fixture generation,solver or benchmark.
    - Only after successful installation/inspection,commit that exact task-created stopped container to one
      local image with a task-specific tag; record the full immutable image ID,parent layer identities and
      configuration. Set default USER65534:65534,CMD python3,WORKDIR/tmp,PYTHONDONTWRITEBYTECODE=1,PYTHONHASHSEED=0,SYMPY_GROUND_TYPES=python.
      No registry push.
    - Create a fresh verification container from that exact image ID as UID65534:65534,networknone,readonlyroot,cap-drop
      ALL,no-new-privileges,pids32,cpu1,memory2GiB,swap0,tmpfs/tmp16MiB. Recheck imports,versions,ground-type
      setting and the complete installed distribution file hashes against the installer inventory. Retain exact
      terminal inspection before removing it.
    - Remove only exact task-created containers and owned temporary wheel/script files after retaining all
      receipts. Keep the prepared local image for subsequent separately authorized tasks. Do not prune caches/images
      or stop unrelated jobs.
    operational_case_accounting: Planned pair:one started installer and one fresh started verifier. At most4total
      start attempts including failures/reruns,with a full pair reserved before an intermediate attempt. Docker
      create/copy/inspect/commit and two downloads are separately retained administrative actions. No scientific
      runs.
    watchdogs:
      download_seconds: 60
      installation_container_seconds: 180
      verification_container_seconds: 60
      host_command_seconds: 240
    custody: Redirect stdout/stderr before each process. Retain exact argv,public stdin/source hashes,absoluteUTC,all
      created IDs,full outer tool responses and nested terminal receipts. Preserve all errors and unavailable
      CPU/RSS fields; CLI CPU is not container CPU. On watchdog terminate only the exact owned process/container
      and preserve partial state. No guessed outer status.
    limitations: The prepared image is dependency/import evidence only. The full group-OOM supervisor,source
      review,shared manifest,sibling binding and scientific launch protocol remain prerequisites. A2GiB Docker
      container ceiling is preparation protection,not proof of the experiments8GiB guard.
