    "context": "The first J1 review attempt produced five untracked files. A read-only replay regenerated three in place before any completed release or snapshot, leaving first-run stdout alongside second-run YAML/SVG/PDF. The original three first-run render bytes are unavailable. The old J1 and original snapshot, composition and ledger cards have no completed release. The corrected queue records old J1 as invalid because its coherent five-file completion gate cannot be met; no completed release is inferred.",
    "ruling": [
      "Record the exact five surviving files and their generations in CORR-20261011-e14e81; archive those bytes as an exact six-path commit-bound terminal-failure snapshot with an incident receipt. The incident archive does not complete the invalid old J1 card.",
      "Keep original plan, prior and controls immutable. Add a write-once plan addendum assigning only J1 to TASK-20261011-ab99ed. Its new independent session produces five versioned coherent outputs and an attestation, without reading sibling reports.",
      "Use a successor queue at the batch root, preserving the six sealed custody rows. Record old J1 as invalid on the corrected view and assign its surviving files only to the incident snapshot. Leave superseded original snapshot, composition, ledger and unrun J3 rows in the immutable prior queue, without completed outcomes. Keep max_concurrent one and pass the successor queue path explicitly.",
      "The successor snapshot binds exactly fifteen artifacts: fresh J1 five, unchanged J2 five and J3 five. Its receipt cites the incident and addendum. Only after verified snapshot and three releases may composition check review independence and draft bounded evidence.",
      "The successor ledger archive uses new EV-SCURVE-6f6545 and DEC-20261011-fcecb4 output paths. Old future output IDs remain uncreated. This is a procedural reroute, with no scientific or goal status transition.",
      "Opening archive TASK-20261011-3ef718 commits the exact thirteen-path protocol packet, then a separate one-path receipt, verifies both, pushes and refreshes a ready PR. No reviewer runs in this opening act.",
      "CORR-20261011-a9ab7d binds J2's real completed release at coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/claims/TASK-20261011-c126c2.1.release.json (SHA-256 825abedd3ad9d174d4553a8e0d9af7c60dfc189cc35d2acdd0d9cbcbfa1105ec) and changes its prospective archival owner from uncompleted TASK-20261011-35c1b4 to TASK-20261011-fb76d9, without rewriting the original handoff or release.",
      "Original J3 remains unrun in the immutable prior queue. New Red Team TASK-20261011-a69d6b owns J3 under the addendum and binds its five outputs to TASK-20261011-fb76d9."
    ],
    "rationale": [
      "A first-run stdout cannot attest three second-run outputs. The incident must remain visible and must not be silently normalized into a completed review.",
      "An append-only plan addendum and new tasks preserve the original review contract while giving the corrected J1 joint a checkable owner."
