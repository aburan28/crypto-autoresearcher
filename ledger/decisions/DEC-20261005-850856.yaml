coordinator_decision:
  id: DEC-20261005-850856
  context: >-
    Design tick on 2026-10-05. origin/main was fetched and this
    branch was created at d25816800a. IDEA-20261004-e4c461 already
    has a contract that counts unlabeled depth-two walks. That
    contract does not condition the endpoint on the middle
    j-invariant alone.
  decision: approve
  target_ids:
    - IDEA-20261004-e4c461
    - H-SSI-991d0e
    - EXP-SSI-474826
  rationale:
    - >-
      SSI is an ECC area. The contract groups depth-two Phi_2
      walks by the published middle at primes 7, 11, and 19.
    - >-
      A design-session count, not a run, gave ambiguous middles
      0, 2, 4 and separated middles 1, 1, 0. Both Phi_2 formulas
      must recompute them.
    - >-
      Standing user authorization of 2026-09-06 covers approval.
      The protocol fields required before dispatch are filled.
    - >-
      The unlabeled walk contract is not edited.
  evidence_refs: []
  limitations:
    - The graph has at most two vertices.
    - The middle label separates one pair at p=11 and none at p=19.
    - Approval authorizes six deterministic runs. It does not assert the fibers.
  next_actions:
    - >-
      Snapshot-archive this contract. Do not launch
      TASK-20261005-91fedc until the receipt verifies.
  knowledge_promotion:
    promoted: []
    not_warranted: Approval of an unrun contract. No finding is promoted.
  decided_by: coordinator
  decided_at: '2026-10-05'
