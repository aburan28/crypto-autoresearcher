coordinator_decision:
  id: DEC-20260908-f43f40
  context: >-
    The imported Stage 8 review plan and its three referring handoffs produce
    27 ledger schema errors because their historical field names do not expose
    the canonical review-plan fields. Approve a narrowly additive effective
    schema view while preserving every original assertion, including the
    explicit disclosure that the recorded review used the producer's session.
    This is administrative mapping review, not scientific evidence review.
  decision: approve
  target_ids:
    - TASK-20260908-27e76a
    - TASK-20260908-750bbe
    - TASK-20260908-fc3204
  task_id: TASK-20260908-5366ed
  batch_id: BATCH-55927f
  decided_by: coordinator
  decided_at: '2026-09-08'
  user_authorization: Standing AGENTS.md authorization covers this bounded administrative prerequisite; it does not waive immutable history, actual independence or scientific evidence gates.
  rationale:
    - The reported defects are missing canonical aliases for existing claim, prior, joint-owner and known-false-object content. An additive mapping can expose that content without inventing a new review, changing source assertions or relaxing validation.
    - The original plan and handoffs explicitly disclose same-session review. A declared blind_from boundary does not satisfy the independent-session requirement, and schema compliance cannot convert those historical records into independent evidence.
    - Preserve both the recorded independence requirement and the disclosed independent_session false values. Their discrepancy is an evidence-admission limitation, not a field to silently normalize away.
    - The unrelated recall-calibration design does not rely on the Stage 8 scientific assertions; its schema publication prerequisite can clear when the complete assembled ledger passes, without promoting those assertions.
  approval_scope:
    administrative_mapping_only: true
    scientific_execution_authorized: false
    stage_authorization: None. No Stage 8 or Stage 9 execution, claim, hypothesis, experiment, goal or authorization status changes.
    original_artifacts: Preserve all original plan, handoff, run, review, decision, archive and registry history. No identifier remapping, retrospective edits or validator relaxation.
    evidence_effect: No scientific confirmation, preregistration attestation, retrospective chronology attestation or independent-session attestation is supplied by this decision.
  source_bindings:
    provenance: Parent-transmitted full source reads, hashes and validator findings; this Coordinator did not personally run those checks or inspect scientific artifacts.
    source_packet: coordination/design/BATCH-55927f/source-packet.json
    plan:
      path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s8.yaml
      sha256: 1915722a58e5569bc0c43ccbc15f574444979b19609224f71afb6f1da0256eea
    handoffs:
      - id: TASK-20260908-27e76a
        path: ledger/handoffs/TASK-20260908-27e76a.yaml
        sha256: 519e8e0168683c6eb10e6c1006da76e1a9c77d2c5dac70c7b564252f46e3d88f
      - id: TASK-20260908-750bbe
        path: ledger/handoffs/TASK-20260908-750bbe.yaml
        sha256: a65e38d3cf55351b2d4463b14eb395f95e12ec4270f5ec39506f9e18e46af4be
      - id: TASK-20260908-fc3204
        path: ledger/handoffs/TASK-20260908-fc3204.yaml
        sha256: 887397e2387e1bb7793c8c3b6b63012da9ff36c84497c2cded6acbd422c5ca25
    historical_decision: ledger/decisions/DEC-20260908-3c7983.yaml
    claim_commit: 59dbc355d8
    archive_owner: TASK-20260908-0c7924
  approved_mapping:
    correction_root: ledger/corrections/schema-supersessions/20260908/s8-review-plan/
    plan_path: ledger/corrections/schema-supersessions/20260908/s8-review-plan/review-plan.v2.yaml
    preservation: Copy the complete original plan mapping, retaining all original fields and values; add only the canonical aliases and explicit later-schema-adoption metadata described here. Any conflicting preexisting canonical key is a defect requiring return to this Coordinator.
    plan_aliases:
      claim_under_review: Deep copy of original claim.
      coordinator_prior: Deep copy of original prior.
      joints: For every original joint retain every field and add joint as a deep copy of id and assigned_to as a deep copy of owner; do not change ownership or attack plans.
      proves_too_much_objects: Add proves_too_much.objects as a one-element list containing the original known_false_objects scalar, without rewriting that scalar.
      failure_signature: Add proves_too_much.failure_signature describing acceptance of any inference in the original proves_too_much.refuse list, retaining each listed inference exactly. This is a schema alias, not a newly executed control.
    schema_view_metadata:
      required_meaning: Later additive schema adoption, naming the exact original plan path/hash and this decision. It is not preregistration, does not verify source chronology or scientific assertions, and establishes no independent review.
      limitation: Do not overwrite recorded_before_reviewers, recorded_at, recorded_commit, blind_from, policy requirements, same-session disclosures or any original independence explanation. Preserve their status as historical assertions.
    effective_handoffs:
      - original_id: TASK-20260908-27e76a
        path: ledger/corrections/schema-supersessions/20260908/s8-review-plan/TASK-20260908-27e76a.v2.yaml
      - original_id: TASK-20260908-750bbe
        path: ledger/corrections/schema-supersessions/20260908/s8-review-plan/TASK-20260908-750bbe.v2.yaml
      - original_id: TASK-20260908-fc3204
        path: ledger/corrections/schema-supersessions/20260908/s8-review-plan/TASK-20260908-fc3204.v2.yaml
    handoff_delta: Each copy retains the same ID and every original field/value except review_plan, which points to the additive plan_path above. In particular, preserve independent_session false, independent_session_required, inference policy/effort, zero-run bounds and all original scientific-scope constraints.
    registry_delta: Append exactly three kind ledger bindings from each hash-pinned original handoff to its effective copy, pinning actual replacement hashes. Do not overwrite originals, remap IDs, alter unrelated routes or relax the validator.
  completion_gates:
    - Parent rechecks the four original source hashes and verifies recursive preservation plus only the allowed plan additions and handoff review_plan substitutions.
    - Parent verifies the three exact registry routes, replacement hashes, acyclic resolution and original-ID preservation against the mechanical copies.
    - All corrected bytes, this decision and note receive the declared exact Coordinator snapshot/archive and publication; no final hash or completion receipt is fabricated in advance.
    - The full assembled ledger must pass its no-new-violations gate. This conditional approval does not assert that the reported 27 errors have already been repaired or that unrelated defects are absent.
  evidence_refs:
    - coordination/design/BATCH-55927f/source-packet.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s8.yaml
    - ledger/handoffs/TASK-20260908-27e76a.yaml
    - ledger/handoffs/TASK-20260908-750bbe.yaml
    - ledger/handoffs/TASK-20260908-fc3204.yaml
    - ledger/decisions/DEC-20260908-3c7983.yaml
  citations:
    - reference: coordination/design/BATCH-55927f/source-packet.json
      provenance: internal
      verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
      scope: Parent actually read the shared plan, three original handoffs, historical decision and current validator/registry context and transmitted their contents and hashes. This is source provenance, not independent scientific review.
  limitations:
    - PD-S8R1 discloses that the same session produced the run and performed the review, with independent_session false. Plan-defined blindness alone does not meet the independent-session requirement.
    - The original recorded-before-reviewers, commit/timing and Stage 8 degree/nnz/fixture/gamma assertions are retained, not independently verified or endorsed here.
    - No experiments, proofs, scientific reviews, status transitions, source commands or validation tests were executed by this Coordinator in this task.
    - Exact native model identity is unverified here; no fallback, degradation or Bedrock is authorized.
    - Other-owner Stage 9 work, including PR 963, retains its own authorization and live state; this decision neither modifies nor characterizes that state.
  next_actions:
    - Parent applies only the approved mechanical mapping and completes TASK-20260908-0c7924 exact archival and full ledger validation to clear the administrative publication prerequisite.
    - Before any future reliance on Stage 8 scientific claims, the responsible original Stage 8 Coordinator must establish a genuinely prospective review plan and actual independent sessions under the required policy, with appropriate blindness and recorded access; this schema repair cannot substitute for that work.
    - Continue the unrelated recall publication and the ranked pending-design objective, with EXP-ECDLP-9cd134 as the parent-recorded next candidate after publication prerequisites clear; no new experiment authorization is made here.
  knowledge_promotion:
    promoted: []
    not_warranted: An additive canonical schema view establishes no new observation, validated Stage 8 result, independent evidence, preregistration, scientific disposition or goal completion.
