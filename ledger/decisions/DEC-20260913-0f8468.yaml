  context: >-
    IDEA-20260913-c5f90d (the height-box factor base) is an ECC proposal on
    RQ-ECDLP-002 whose entire lane turns on ONE symbolic quantity: gamma_m, the
    achievable small-root exponent for the homogenised arity-m box relation
    equation, against the requirement gamma_req = 1 that the density condition
    forces exactly. The requirement side is exact algebra; the achievable side has
    never been computed by this program. The proposal declares a staged design and
    its own Stage 0 is a hard gate of exact integer arithmetic reproducing five
    frozen fixture anchors and rejecting three known-false claims.
    This decision specifies the proposal as H-ECDLP-b97b72, freezes
    EXP-ECDLP-1bef8f at version 1, and approves STAGE 0 ONLY. Stage 1 (the
    gamma_2 / gamma_3 symbolic computation), Stage 2 (planted lattice instances)
    and Stage 3 (the p-ladder) are fully specified in the frozen contract and are
    explicitly NOT authorized; each requires its own later Coordinator decision.
    Protocol completeness was checked before approval: controls (matched
    negation-closed null with negation closure declared load-bearing and p as the
    decay parameter, three known-false controls, invalid-input refusals, identity
    and relabelled-Z/nZ controls where they apply, and the two positive controls
    and the random-support twin specified for the later stages), primary and
    secondary metrics, seeds, budget, stopping rules, invalidation rules, a success
    criterion decidable from the predefined metrics, a distinguishable negative
    outcome for every primary gate, required artifacts, dependencies, inference
    policy, and the proof_search_map required by docs/inventor-protocol.md section
    8 are all present.
    Approval is recorded under the standing user authorization and asks the user
    nothing. It authorizes work; it asserts nothing about whether H-ECDLP-b97b72 is
    true.

