  rationale:
    - >-
      RANKING. This is an ECC proposal and ECC is selected before all other areas
      at every selection point (AGENTS.md "ECC comes first"). It is ranked ahead of
      doing nothing on a concrete ground rather than on priority alone: the lane's
      deciding quantity is ONE symbolic computation needing no curve and no
      sampling, which makes it the cheapest available exponent-level discriminator
      in this campaign, and its Stage 0 gate costs seconds of exact integer
      arithmetic. Under docs/target-result-profile.md the record is
      exponent-targeting rather than cofactor-polishing: the conditional it states
      would move the prime-field ECDLP exponent from 1/2 to 2/m, beating rho from
      arity 5.
    - >-
      WHY STAGE 0 AND ONLY STAGE 0. Every later stage consumes Stage 0's outputs:
      Stage 1 computes gamma for the support that anchor (c) freezes, Stage 2 plants
      instances in the cell that anchors (b), (d) and (e) freeze. Authorizing the
      lattice work before the fixtures are independently reproduced would put a
      gamma on top of unverified anchors. Stage 1 additionally requires its
      shift-polynomial strategy and lattice implementation to be DECLARED and
      hash-bound before any gamma is reported, which the authorizing decision for
      Stage 1 must supply and which this decision does not.
    - >-
      ANCHORS ARE PRE-REGISTERED, NOT RECOMPUTED HERE. The five anchors (a)-(e) are
      taken VERBATIM from IDEA-20260913-c5f90d and frozen in the contract before
      execution: 6441 realisable ordered x-triples at (p, a, b) = (101, 3, 5) with
      zero false negatives and zero false positives; |F_H| = 23, 39, 47, 111, 127 at
      H = 4, 5, 6, 9, 10 with c_H = 1.438, 1.560, 1.306, 1.370, 1.270, and 69
      on-curve x-values carrying B = 138 base points at (10007, 1, 28) with n = 9851
      prime; exactly 9 monomials at total degree 4 with all nine bidegrees present
      and the frozen coefficient list; H^4/p = 0.99930; mean 1.9332, variance
      5.5822, dispersion index 2.8875, 3704 unreachable targets, c(O) = 138, plus
      the seeded matched null. This design task computed none of them and corrected
      none of them; they are a FIXTURE to be independently recomputed.
    - >-
      A DISAGREEMENT STOPS THE RECORD AND IS NOT NEGATIVE EVIDENCE. The stopping
      rules make any mismatch between a Stage 0 measurement and its pre-registered
      anchor a FIXTURE DEFECT, remedied by a superseding record and never by editing
      an anchor. Stopping is an observation about the anchors, not negative
      mathematical evidence about the ECDLP, the height box, the density condition,
      or gamma_m (AGENTS.md rule 5 and rule 6).
    - >-
      THE OBSERVATION COLLISION IS CARRIED FORWARD AS A BINDING LIMIT, NOT A
      FOOTNOTE. The proposal's own section-8 audit succeeded: the arity-2 density
      observable does NOT separate the height box from a matched negation-closed
      random base (dispersion 2.8875 against 2.9163 in range 2.7628-3.1316; 3704
      against 3712.3 unreachable targets). The frozen contract therefore states that
      no claim may be founded on the density observable and that any successor
      reporting a coverage advantage has collided with the null and must say so.
      This is recorded as the single most important limit in the design, and it is
      why the bottleneck is search rather than coverage.
    - >-
      STAGE 1 BRANCHES ARE FROZEN NOW, BEFORE THE COMPUTATION THAT WOULD DECIDE
      THEM. gamma_2 <= 0.9 is BR-CLOSURE and makes gamma_2 the named obstruction
      quantity, with a complete `obstruction` block including its `resource_check`
      required on any closing evidence record; gamma_2 >= 1.0 is BR-LEAD and
      triggers mandatory independent review-breakthrough at max effort before any
      interpretation (AGENTS.md rule 12); 0.9 < gamma_2 < 1 is declared INDECISIVE
      in advance. Freezing them while the number is unknown is the point: a
      tolerance chosen after the number exists is a tolerance chosen to fit.
    - >-
      HEURISTICS ARE CARRIED UNSOFTENED AND UNDISCHARGED. HEUR-1 (the height box
      behaves like a random negation-closed base on additive statistics), HEUR-2
      (gamma_m < 1 strictly and non-increasing) and HEUR-3 (c_H converges to a
      constant of order one) are carried with their rigorous support, random-model
      justification and validation routes intact. NONE is validated by Stage 0, and
      each undischarged heuristic independently caps the hypothesis below
      `supported`. Two external ingredients (Coppersmith / Jochemsz-May, and the
      Semaev form) are provenance `recalled` and are recorded as pointers, never as
      support; KN-FIND-007, KN-OPEN-001 and the full body of IDEA-20260905-ab4a6e
      are recorded as outstanding blocking reads rather than as citations.
    - >-
      NO PROMOTION GATE IS MET AND NONE IS CLAIMED. The four promotion gates of
      agents/coordinator.md — archived proof decomposition, validated heuristics,
      concrete-cost table, independent review plus red team — are unmet, so no
      transition of H-ECDLP-b97b72 toward `supported` is admissible. established
      time and memory exponent improvements are 0, dominated_by is `dominated` with
      Pollard rho at 0.886*sqrt(n) as the dominating row, and the conditional
      p^{2/m} branch stays marked conditional on gamma_m >= 1 — a hypothesis this
      record predicts is FALSE.
    - >-
      HEURISTIC-VALIDATION PAIRING, STATED HONESTLY. agents/coordinator.md requires
      a dispatched conditional result to be paired with heuristic validation in the
      same or the following batch. The pairing here is INTERNAL to this contract:
      Stages 2 and 3 are the validation of HEUR-1 and HEUR-3 at the declared
      p-ladder, and Stage 1 is the discriminator for HEUR-2. Because those stages
      are unauthorized, this batch dispatches NO conditional result — Stage 0's
      claim ceiling is fixture reproduction and it states no conditional at all. The
      obligation therefore attaches to the decision that authorizes Stage 1, which
      must schedule the validation with it.
    - >-
      Approval under the standing user authorization of 2026-09-06 does not ask the
      user to select or confirm this experiment, does not assert the hypothesis is
      true, and does not relabel any immutable record. IDEA-20260913-c5f90d is left
      exactly as committed.

  evidence_refs: []
  evidence_refs_note: >-
    NONE, and deliberately so. No run of EXP-ECDLP-1bef8f exists; this is a protocol
    approval, not an evidence review. The frozen anchors of
    IDEA-20260913-c5f90d were computed during ideation and are a fixture to be
    independently recomputed — citing them here as evidence would be exactly the
    inference the contract forbids. EV-ECDLP-1a7e58 is reserved for the later review
    stage and is not written by this task.

  limitations:
    - >-
      Stage 0 only. Stages 1, 2 and 3 are specified and NOT authorized; each needs
      its own later Coordinator decision, and Stage 1 additionally needs its
      shift-polynomial strategy and lattice implementation declared and hash-bound
      before any gamma is reported.
    - >-
      claim_ceiling is stage0_fixture_reproduction_only. The strongest supportable
      Stage 0 claim is that five declared fixtures reproduce and three known-false
      claims are rejected.
    - >-
      Toy scale: p = 101 and p = 10007 only. At p = 10007, H = 10 the box holds 1.27
      per cent of F_p, far larger than any cryptographic analogue, which biases every
      density measurement toward apparent structure. Disclosed, not controlled; the
      p-ladder is the only defence and it is unauthorized.
    - >-
      Certificate kind none. No ECDLP instance is solved and no scalar is recovered.
      maximum_runs is 1.
    - >-
      No claim may be founded on the density observable, in either direction, because
      the observable has already been shown to collide with a matched
      negation-closed random base.
    - >-
      Designing and approving is not evidence. H-ECDLP-b97b72 ends at `specified`,
      is not added to active_hypothesis_ids, and evidence_eligible is false on the
      contract.
    - >-
      novelty_status of the source proposal is `unverified`: no external literature
      was opened, and a reviewer should treat the possibility that a height-box ECDLP
      factor base appears in the published literature as OPEN rather than excluded.

