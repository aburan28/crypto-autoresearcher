coordinator_decision:
  id: DEC-20260804-13fd70
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-064
  recorded_by_task: TASK-20260804-065
  archived_by: TASK-20260804-067
  context: >-
    BATCH-064 synthesis. After 63 batches, the program has a comprehensive map of
    the prime-field ECDLP attack landscape. This decision records the current
    theoretical status and the exact gap between established results and a full closure.

  decision: advance_synthesis
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    No hypothesis status changes. GOAL-ECDLP-001 stays active. This is a synthesis
    record capturing the theoretical boundary reached by the program.

  established_results:
    - id: R-1
      claim: >-
        Bezout no-go for bounded-degree algebraic factor bases (IDEA-20260801-021):
        any algebraic predicate of degree d gives |F_p| ≤ 3d by Bezout. For fixed d,
        the factor base is O(1) points — too small for subexponential index calculus.
        For d growing with p: membership test costs ≥ d operations, trading the
        factor-base advantage for evaluation cost.
      status: proved (derivation-level receipt in IDEA-20260801-021)

    - id: R-2
      claim: >-
        Semaev heuristic accuracy: actual m=2,3 decomposition yield converges to
        the heuristic B^m/(m!N) from BELOW as p grows. No super-heuristic signal
        observed at any tested parameter (EV-YIELD-e1adbf, EV-YIELD-ca4b02).
      status: preliminary empirical (toy scale p=1009..9001)

    - id: R-3
      claim: >-
        Semaev monodromy universality: the Galois group of the m-th Semaev cover
        is C_2^{m-2} for ALL prime-field curves (no exceptional locus). No curve
        family gives systematically higher relation rate (BATCH-061, KN-OPEN-009 CLOSED).
      status: proved (mathematical derivation)

    - id: R-4
      claim: >-
        GGM closure of incidence and endomorphism oracle classes: oracles C+D are
        GGM-simulable; Shoup lower bound closes these at exponent 1/2 (EV-GGM-79e710).
      status: proved (GGM argument)

    - id: R-5
      claim: >-
        Ordinary isogeny ECDLP scalar-domain mismatch: ECDLP scalar in Z/N (order p)
        vs all ordinary isogeny structures of order sqrt(p). No reduction from ECDLP
        to any isogeny-class problem has been found. The MITM backward walk has no
        well-defined starting point for ECDLP (only for OIFP).
      status: established (systematic search of BATCH-047-054)

    - id: R-6
      claim: >-
        BKK mixed-volume universality: BKK/Bezout = 0.5 structurally for all m
        (Newton polytope = full square at every m). Factor-2 improvement is constant
        and universal; no curve-dependent exceptional sparsity.
      status: proved (structural argument, verified at m=3 empirically)

  gap_between_established_and_closure:
    - id: G-1
      description: >-
        Arithmetic (non-algebraic) factor bases: the Bezout no-go (R-1) covers
        algebraic predicates but NOT the standard Semaev "x < threshold" factor base,
        which is an ORDER condition on F_p (not algebraic). The gap is: proving
        that no arithmetic factor base (with non-algebraic membership) can give
        super-heuristic yield. R-2 shows the heuristic is an upper bound empirically,
        but no theorem closes this.
      current_best: >-
        The Semaev heuristic complexity exp(c*sqrt(log p * log log p)) is subexponential.
        No mechanism has been found giving sub-rho (polynomial) complexity from
        arithmetic factor bases. But no theorem proves the lower bound.

    - id: G-2
      description: >-
        Target-result-profile structural ingredient: what NEW external theorem
        (analogous to Wesolowski's minimal isogeny degree bound for supersingular curves)
        would give a genuine sub-rho prime-field ECDLP result?
      current_best: >-
        No such theorem is known. The program has not found a "new structural
        ingredient" that converts a bottleneck step into a tractable one for
        prime-field ECDLP. This is the core open problem.

  what_a_breakthrough_would_require: >-
    A sub-rho prime-field ECDLP algorithm would require one of:
    (A) A NEW STRUCTURAL THEOREM bounding some "minimal decomposition" related to
        the DLP to o(N^{1/2}) — analogous to Wesolowski's minimal isogeny degree bound
        of (p/2)^{1/3} for the supersingular isogeny problem.
    (B) A PUBLICLY COMPUTABLE NON-SIMULABLE ORACLE that encodes k-dependent
        information below the birthday bound — which the program has been unable to find.
    (C) A FACTOR BASE TYPE outside the scope of both the Bezout no-go and the
        Semaev heuristic framework.
    None of (A), (B), or (C) has been identified despite systematic search.

  exact_next_action: >-
    BATCH-065: Search the knowledge corpus for any recently added literature items
    or techniques that might provide the structural ingredient for (A). Specifically:
    check if the Gao-Feng-Hu SVP improvement technique (KN-LIT-b875db, superlattice
    sparsification) has any prime-field ECDLP implications, and whether any 2025-2026
    preprints in the knowledge corpus address this gap directly.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (all examined attack families)
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
