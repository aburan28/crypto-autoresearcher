  rationale:
    - >-
      Ranking and selection: IDEA-20260930-750de2 is an open ECC-area proposal
      (ECC comes first, AGENTS.md "ECC comes first"), the cheapest discriminator
      in RQ-LHW-1877bb, with zero group operations, and both outcomes are
      decision-changing: E1 closes the congruence-filter route for class F_M, E2
      would be an exponent-level lead (a sub-kangaroo polylog-memory route). The
      target-result-profile bias toward exponent-moving mechanisms is respected by
      carrying E2 as the favourable branch and claiming no exponent here; the
      idea's prior favours E1 and is recorded, not used to de-weight E2.
    - >-
      Protocol is complete under the design-experiment skill once AB-1 is repaired:
      hypothesis has statement, mechanism, heuristics with validation routes,
      predictions, test boundary, falsification, distinguishable outcomes and
      proof_search_map; the experiment has inputs, controls with pass/fail,
      variables, metrics, seeds, budget, stopping and invalidation rules, decidable
      success and falsification criteria, required artifacts, measured-versus-
      modeled separation, optimistic assumptions and memory accounting. Stages 0-1
      only; packaging_only false.
    - >-
      The repair of AB-1 does not move any threshold. It changes which object
      carries the blocking positive control so that the control is attainable, and
      it is made before any run so the gate cannot be tuned to outcomes. The
      original object is kept visible as a descriptive row, which also documents
      that positional clustering at k0 = 8 does not pay at the three m = 24 cells.
    - >-
      Additional Coordinator-noted design checks (not threshold changes) are in
      the specification design_notes_for_stage0: the corrected range of the
      L(kappa) >= 1/2 clause (DN-1), the modulus-specific scope of the P-FOLD-2
      split identity (DN-2), the P-FOLD-2 domain on the ladder being only k = w
      where the bound is trivial (DN-3), the real-versus-ceiling quotient interval
      (DN-4), the per-guess cost floor above M = 2^m (DN-5) and the worked-cell
      reproduction (DN-6). The Stage 0 note confirms or refutes each.
    - >-
      The Stage 1 verdict is on a MODELED cost law. The kangaroo-constant
      reproduction is a Stage 2 item; a closure at the Closure-gate standard
      (obstruction block with quantity G_M, value per cell, scope the ladder,
      resource_check) must say the law is modeled unless Stage 2 confirms it, and
      its scope is the worst case unless the average-case reading agrees.
    - >-
      Direction integrity (AGENTS.md "Research-direction integrity and
      auditability"): the lead is pursued, not parked. The interim withholding was
      one defect, found by arithmetic, resolved the same day; evidence is
      reproduced independently; no threshold was relaxed.

