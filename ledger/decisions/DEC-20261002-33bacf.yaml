  context: >-
    /design-experiment on IDEA-20260930-750de2 (status proposed, ECC-area open idea
    under RQ-LHW-1877bb; verified no hypothesis or experiment cites it; sibling
    proposal IDEA-20260930-79abd9 ranks itself below it). Selected by
    analysis/ecc-design-20260930/DESIGN-BRIEF.md as the cheapest discriminator in
    its lane: zero group operations, decides E1 versus E2, and a negative outcome
    closes the congruence-filter route at the closure standard. Pre-allocated ids
    H-LHW-371a91, EXP-LHW-9adf78, DEC-20261002-33bacf, TASK-20261002-530295
    (executor handoff), TASK-20261002-be3df0 (snapshot archive). Branch
    claude/elliptic-curve-goals-3bfz9x at origin/main bbaf753d0b.

    DESIGN FINDING AB-1 AND ITS RESOLUTION (history kept so the finding is not
    lost). The Coordinator's first draft found, by hand, that the idea's positive
    control M5 (C_M / B <= 0.25 at M = 2^{k0} - 1 on the positional class W_clu
    with k0 = 8, S0 = {0,1,2}) is arithmetically unattainable: a 0.25 gate at
    M = 255 needs at most 3 residues, while W_clu has 9, 10, 9, 12, 13, 12, 13, 12
    at (m, w) = (24,3), (24,4), (24,6), (28,4), (28,7), (32,4), (32,6), (32,8), so
    the worst-case ratio to kangaroo is 0.56 to 0.81 and even the average-case
    reading (0.215 to 0.258) misses at (32,6). The first draft therefore withheld
    approval (decision revise). The dispatching session then reproduced the counts
    INDEPENDENTLY by exact enumeration over (c0, c1, c2): the same residue counts,
    |W_clu| = 84, 126, 84, 495, 792, 495, 924, 495, worst-case ratios 0.564, 0.626,
    0.564, 0.751, 0.814, 0.751, 0.814, 0.751, average-case ratios 0.215, 0.215,
    0.215, 0.235, 0.245, 0.235, 0.258, 0.235, and D_255 / sqrt(255) = 0.58, 0.79,
    0.58, 2.58, 3.82, 2.58, 4.45, 2.58 (so at the three m = 24 cells D_M < sqrt(M)
    and Lemma 2 itself says guess-and-kangaroo cannot beat kangaroo there). The
    dispatching session authorised the design-time repair below, which this
    decision records as the Coordinator's decision, taken before any data exists.

    THE REPAIR (design finding AB-1 RESOLVED): (1) M5's threshold C_M / B <= 0.25
    at M = 2^{k0} - 1, k0 = 8, is UNCHANGED and carried verbatim. (2) The control
    OBJECT is repaired: the BLOCKING positive control is a residue-planted set P_c
    of n_c = max(C(m, w), 2^{m/2 + 1}) distinct integers below 2^m drawn uniformly
    (recorded seed) from those with x mod 255 in the frozen set {17, 18, 19} (the
    base residue 17 is arbitrary), so G_255 = 3 by construction and the ratio is
    3 / sqrt(255) = 0.188 at every cell. SIZING RULE (the idea never fixes the
    control's size and its B is a function of the set, B(m, n) = min(2 * 2^{m/2},
    n)): the control is sized to at least the kangaroo cost so that brute force
    cannot be the minimum and B(m, n_c) = 2 * 2^{m/2} at every cell; M5's 0.25 and
    the idea's B formula are therefore BOTH LITERAL, evaluated on the control's own
    set. (With exactly |W| planted elements and the cell's B the ratio would be
    about 0.76, 0.30 and 0.69 at (24,3), (28,4), (32,4), which the dispatching
    session confirmed; the sizing rule removes that obstruction without a
    non-verbatim comparator reading.) Feasibility: the three residue classes hold
    about 197 thousand, 3.2 million and 50 million integers below 2^24, 2^28, 2^32,
    all at least n_c. (3) The idea's positional W_clu is RETAINED as a second,
    NON-BLOCKING DESCRIPTIVE row (instrument agreement with the closed form is its
    only gate). (4) The decay ladder (blocking) runs on the residue-planted class P_c
    with a mixing fraction q of uniformly random elements, f(q) = floor(q * n_c +
    1/2). (5) No threshold, outcome-table row or falsification condition of the
    idea is altered.

    INPUT PINS: the specification carries a literal pin table (git blob and sha256
    per file, computed by the dispatching session; byte-identical at origin/main
    bbaf753d0b) for the ten files the design reads or cites. An Executor reading
    different bytes for any row voids the run as an infrastructure fault, never
    negative evidence, and a re-pin needs a versioned protocol_amendment. KN-LIT-2135
    and KN-FIND-ffe1df were not opened by this design and are cited only; H-LHW-8e8cff
    and EXP-LHW-22aefa were read only to state the difference and are not depended on.

