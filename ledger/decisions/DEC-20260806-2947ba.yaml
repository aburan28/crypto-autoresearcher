coordinator_decision:
  id: DEC-20260806-2947ba
  decided_by: coordinator
  decided_at: '2026-08-06'
  decision: pause
  target_ids:
  - GOAL-HQC-001
  - EXP-HQC-982268
  - H-HQC-18d1b4
  - EV-HQC-b71230
  context: 'BATCH-0a65c0 was the SIXTH AND FINAL batch under the declared campaign budget of maximum_batches:
    6. It fixed the two blocking defects, obtained ADMIT from both independent reviews, and executed the
    campaign''s only measurement: PS-R3 at T = 1e7 under the frozen v3 table. This decision closes the
    batch and sets the terminal status.'
  rationale:
  - THE CAMPAIGN PRODUCED A REAL, CONTROLLED MEASUREMENT, AND IT IS RECORDED AT FULL STRENGTH. All 17
    cells fall below their frozen lower bound, from -244.1 null SD at k=2 to -32.4 at k=18, with the pre-specified
    k = m = 17 cell at -42.7 SD. The matched null NULL-P fired 0 of 17 at the same T, interval and estimator.
    The validator recomputed every value in exact rational arithmetic to 3.7e-15 bits and regenerated
    the frozen table from prose to 34/34 bit-identical bounds.
  - THE DIRECTION IS CONSERVATIVE AND MUST BE READ THAT WAY. Negative log2 A_k means block failures are
    ANTI-correlated relative to independence, which makes a bound built on independence safer, not weaker.
    This is not an attack result and no record may present it as one.
  - 'STATUS IS PAUSED, NOT COMPLETED, AND THE REASON IS SPECIFIC RATHER THAN CAUTIOUS. Completion criterion
    1 requires a measured curve at reduced parameters "with the discrepancy reported AND its extrapolation
    to the selected parameters stated conditionally on numbered heuristics". The discrepancy is reported.
    THE EXTRAPOLATION IS NOT, and cannot be from this batch: the v3 amendment DROPPED PS-A precisely because
    it failed the q-robustness gate, so no cell at true HQC parameters is certified. Criterion 2 requires
    Validator AND Red Team to admit the run package; the measurement had ONE independent reviewer. Two
    of three criteria are unmet in identifiable ways.'
  - 'CLAIMING COMPLETED HERE WOULD BE THE PREMATURE-CLOSURE FAILURE IN ITS MOST TEMPTING FORM -- a striking
    number, on the last batch, with a real null behind it. The number is striking precisely because OPEN-6
    is open: no arm tests the (T) joint law against a known answer, and the validator states that its
    exact recomputation certifies arithmetic from the histogram FORWARD AND NOTHING BEHIND IT, so a sampler
    defect reproduces this result perfectly. A -244 SD departure is what a genuine effect looks like and
    also what a subtly wrong sampler looks like. Nothing in this campaign yet distinguishes them.'
  - THE BUDGET IS EXHAUSTED ON A COUNT, NOT ON THE SCIENCE. Six of six batches are used; roughly 7,000
    of 10,800 wall-clock seconds remain unspent. The Coordinator does NOT self-grant a seventh batch.
    Raising maximum_batches is the user's call, and this pause is a budget outcome about a campaign, never
    evidence about HQC (AGENTS.md rule 5).
  - 'PROCESS FINDING RECORDED AGAINST THIS HARNESS, NOT AGAINST THE RESULT: the measurement snapshot followed
    its validator''s read rather than preceding it, repeating the BATCH-6fddee deviation that DEC-20260806-9d8aab
    reported as corrected. The correction had been applied to the amendment path only. Additionally the
    executor disclosed a FAIL-OPEN in-run integrity check and a 453.4 core-second shakedown overrun that
    pushed NULL-M and two controls onto subsamples.'
  evidence_refs:
  - EV-HQC-b71230
  - EV-HQC-7e4b28
  - EV-HQC-75c05b
  - RUN-HQC-982268-STAGEA-a
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/reviews/TASK-20260806-f02eff/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/coordinator_ruling.yaml
  limitations:
  - NO statement about HQC-1/3/5 or any standardized parameter set. PS-A was dropped; no cell at true
    HQC parameters is certified. Claim tier TOY.
  - H-HQC-18d1b4 remains PROPOSED. One toy-scale run with one seed family and no replication does not
    move a hypothesis status, and the anti-promotion posture is deliberate.
  - The result weakens the INDEPENDENCE ASSUMPTION at the tested scope only. It bears on neither HQC's
    IND-CCA security nor its decoding-failure rate nor the published bound.
  - Familywise size of the 17-cell battery is 1.026 percent against 0.27 percent nominal; only k = m =
    17 is a 0.27 percent test (RULE-5).
  - Two declared controls were NOT RUN; CTRL-POSHOM is structurally blind to the shift-equivariant class;
    NULL-M was under-powered.
  - None of the four asymptotic-complexity promotion gates is engaged; none is claimed.
  knowledge_promotion:
    promoted: []
    not_warranted: 'Strength is preliminary and OPEN-6 is open, so the headline could be an effect or
      a sampler defect and this campaign cannot tell which. Promoting a -244 SD departure into the corpus
      before that is distinguished is exactly how an artifact becomes a citable finding. Two METHODOLOGICAL
      lessons are ready and belong to a successor to promote once seen on a second instrument: (i) an
      invariance strong enough to FORCE a control''s null also blinds it to every defect sharing that
      invariance -- CTRL-BS, CTRL-POSHOM and CTRL-IDXMAP are three instances of one pattern in one campaign;
      (ii) a calibrated decision rule can be defeated by the transcription precision of its own constants,
      and PyYAML silently resolving 1e-05 as a STRING is a concrete instance worth a KN-TECH on its own.'
  next_actions:
  - 'RESUME CONDITION, AND IT IS ONE THING: CLOSE OPEN-6. Build an arm that tests the (T) joint law against
    an answer known in advance -- a planted-correlation instance whose log2 A_k is derivable, run through
    the identical pipeline. Until that exists, the -244 SD departure cannot be distinguished from a sampler
    defect, and no extrapolation should be attempted.'
  - 'Then supply criterion 1''s missing half: state the extrapolation to the selected parameters conditionally
    on numbered heuristics, or record that PS-A''s removal makes it unreachable under this design and
    say what design would reach it.'
  - Give the measurement its second independent reviewer (Red Team on the run package, not on the amendment)
    as criterion 2 requires.
  - 'Repair the harness findings: apply the snapshot-before-review ordering to EVERY producer path, not
    one; fix the fail-open integrity check; size shakedowns against the budget they consume.'
  - Fix CTRL-IDXMAP's reference expression (L = N/n_e, not n_2*dup) before it is ever cited, and treat
    the three-instance control-blindness pattern as the design problem it is.
  - THE CAMPAIGN BUDGET CAP IS THE ONLY THING STOPPING THIS WORK. Roughly 7,000 of 10,800 wall-clock seconds
    remain; the batch count does not. Raising maximum_batches is a user decision and is not taken here.
