  context: >-
    tools/ecc_priority.py --open-ideas ranks IDEA-20261015-c6f017
    (CERTBIN, GOAL-ECDLP2M-001, priority high) first. It proposes a matched
    n=131 rho walk: three-limb signed-Frobenius, canonicalize-every-step vs
    Bailey canonicalize-at-DP, an n=83 collision-ratio check, and a
    conversion against KR-RHO-18cc42's 530 cycles/iteration. No 131-bit walk
    exists in the code base, so every n=131 row in the QSP, CERTBIN and FROB
    lanes lacks a matched-rho denominator.
  target_ids:
    - IDEA-20261015-c6f017
    - H-CERTBIN-7e3a51
    - EXP-CERTBIN-b4d29c
    - TASK-20261016-a1f7d3
    - TASK-20261016-5c92be
    - TASK-20261016-d06b48
  rationale:
    - >-
      Not a duplicate. Searches of ledger/.index/*.jsonl and of
      ledger/{hypotheses,decisions,handoffs} and experiments/*/specification.yaml
      for c6f017, Bailey, three-limb, canon-n131, lift_scan, n131,
      ns_per_step, WideGf2 and MAX_N returned no existing step-price or
      Bailey-vs-canonicalizing walk contract. Nearest hits answer different
      questions: H-BINSTD-d1f9a5/EXP-BINSTD-a3cfee is Semaev yield of a
      Bailey-style DP pool, H-CERTBIN-ec0945 is normal-basis factor-base
      cost, EXP-NISTBIN-451dfa only cross-checks Bailey's printed 2^60.9,
      and EXP-CERTBIN-ec9d83 is n=131 factor-base memory levels.
      IDEA-20261015-2d8e5a, a different selector, is kept out of scope.
    - >-
      Ranks ahead of doing nothing. The idea supplies the denominator that
      "Every improvement is a success" requires every row to report against
      (gap to matched rho), for all n=131 lanes. It also settles a
      decision-changing design question between two reference walks, and
      its compute is small once Stage 0 exists. It is a reference
      instrument, not an exponent mechanism. It is ranked for the
      measurement infrastructure it unblocks, and no advance is credited to
      it.
    - >-
      The contract is complete as science and frozen. It has five
      falsifiable predictions from claims (1)-(4), numbered heuristic HEUR-1
      with a Stage-2b validation in the same contract (pairing rule), a
      known-false B-poly control, A/A gates, paired public hash-to-curve
      targets with frozen seed strings, a sample-size justification (256
      solves per arm; the idea's 64 cannot separate 1.25 from 1.40), stopping
      and validity rules, declared artifacts, the environment, and frozen
      launcher paths.
    - >-
      Three design choices depart from the idea, each with a stated reason.
      (a) The DP predicate is the class-invariant HW_nb(x) <= c_n threshold,
      not a raw DP-bit predicate, because a raw-x predicate is not a class
      function for the non-canonicalizing walk. (b) Targets are 256 per arm
      rather than 64. (c) The DP-rate matching is checked by measurement
      (V6).
    - >-
      Not approvable now (AGENTS.md "Approval is bounded by execution"). No
      trial-plan.json, launcher or checker exists, so
      tools/newest_experiments.py reports needs_implementation_or_plan. The
      three-limb field type does not exist. The local /home/user/crypto
      checkout is behind the idea's anchors: it shows MAX_N = 63, with no
      research/n83_evaluation_20261012, WideGf2 or StrongRhoG. lift_scan has
      no local checkout. The specification's readiness.missing_for_ready
      lists M1-M6. The contract stays review_required with approved_by null.
  evidence_refs:
    - ledger/proposals/IDEA-20261015-c6f017.yaml
    - knowledge/frontiers/ecdlp/generic-rho/KR-RHO-18cc42.yaml
