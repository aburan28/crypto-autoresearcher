coordinator_decision:
  id: DEC-20260802-0c6eb4
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-007
  recorded_at: '2026-08-02'
  decision: expand
  decision_label: campaign_budget_cap_removed_by_user_authorization

  context: >-
    DEC-20260802-002 resumed GOAL-MLKEM-003 from its budget pause and extended
    the cap from 6 to 8 batches. The user has since directed that there are no
    budget limits going forward. This record replaces the numeric batch cap on
    this goal with an unbounded one and supersedes the batch-count element of
    DEC-20260802-002; it does not supersede that decision's scope or non-claims,
    which stand unchanged.

  budget_change:
    from_maximum_batches: 8
    to_maximum_batches: null
    from_total_wall_clock_seconds: 10800
    to_total_wall_clock_seconds: null
    max_concurrent: 3
    max_concurrent_note: >-
      UNCHANGED AND NOT NEGOTIABLE BY BUDGET. The three-task concurrency cap is
      a coordination-integrity limit from AGENTS.md "Dynamic dispatch", not a
      cost control. It exists so that concurrent workers cannot hold overlapping
      write scopes or race the Git index. Budget authorization does not touch it.
    authorization: >-
      Direct user instruction, 2026-08-02: "There are no budget limits going
      forward." Recorded verbatim as the authorizing basis. Applied to
      GOAL-MLKEM-003; other goals keep their own recorded budgets until a
      decision changes each of them.

  what_this_removes: >-
    The pause condition "The six-batch campaign budget is exhausted without an
    admissible next mechanism" can no longer fire on this goal, and the batch
    counter is no longer a reason to stop. The expensive branch that
    DEC-20260731-006 named as the standing next action -- a G6K-backed
    measurement of Pwrong near the aligned Pgood operating threshold, which
    failed to install in BATCH-003 and again in BATCH-005 -- becomes affordable
    to attempt properly rather than opportunistically.

  what_this_explicitly_does_not_change:
    - >-
      EVIDENCE STANDARDS ARE UNCHANGED. Budget was never what made a claim
      admissible. Claim tiers (docs/claims-and-verification.md), certificate
      discipline, and the rule that toy-scale evidence is never crypto-scale
      evidence apply exactly as before.
    - >-
      THE CLOSURE QUORUM IS UNCHANGED. AGENTS.md rule 13 still requires three
      CONCUR attestations on pairwise-distinct resolved_model_id values before
      any `status: completed`. Unlimited budget buys more batches; it does not
      buy a quorum, and under this harness the three-distinct-model requirement
      is expected to remain the binding constraint on closure.
    - >-
      INDEPENDENT REVIEW IS UNCHANGED. Every claim-relevant producer still
      requires a snapshot archive followed by independent validation and red
      team before a ledger archive.
    - >-
      THE OTHER PAUSE CONDITIONS SURVIVE. Unretrievable primary sources, an
      infrastructure or dependency blocker, and an unresolved required model
      policy with fallback_allowed:false each still pause this goal. Only the
      budget-exhaustion condition is retired.
    - >-
      A LONGER CAMPAIGN IS NOT A STRONGER RESULT. Removing the cap removes a
      reason to stop early; it supplies no reason to keep going. The
      inventor-protocol closure standard still governs: a lane declared dead
      needs a named obstruction and forward guidance, and a count of screened
      mechanisms remains a fatigue report whose honest status is `unverified`.
      Symmetrically, premature closure remains a failure mode, so an unbounded
      budget is not licence to grind a saturated lane either.

  non_claims:
    - ML-KEM is not broken, and no budget change bears on that.
    - >-
      This record establishes nothing about the subject matter. It is a
      coordination decision about how long the campaign may run.
    - KN-OPEN-016 remains open.

  next_actions:
    - >-
      Complete BATCH-007 as dispatched (TASK-20260802-101 adjudication, then
      snapshot, independent validation and red team, then the ledger archive
      carrying EV-MLKEM-017 and DEC-20260802-735e6a). The budget change does not
      alter the batch already in flight.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A budget authorization establishes no transferable finding. Nothing to
      promote.
    promote: false

  references:
    - DEC-20260802-002
    - DEC-20260731-006
    - GOAL-MLKEM-003
    - KN-OPEN-016

  supersedes_element_of: DEC-20260802-002
  supersession_scope: >-
    campaign_budget.maximum_batches and campaign_budget.total_wall_clock_seconds
    only. All other content of DEC-20260802-002 stands.

  target_ids:
    - GOAL-MLKEM-003

  decided_by: coordinator
  decided_at: '2026-08-02'
