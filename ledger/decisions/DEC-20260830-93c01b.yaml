        unrepaired limitation, as scoped.
      carried_forward_to: seventh static successor repair batch per bounded_successor_repair_condition
      does_not_block: nothing; this is a REVISE, not a PASS
    - id: PREDECESSOR-CUSTODY-INTEGRITY
      description: >-
        A "frozen, immutable, read-only" predecessor artifact (v1
        emit_host_binding.sh) was edited out-of-band by an actor outside
        this goal's coordinator/executor dispatch discipline (different git
        author identity, no task/decision reference, no coordinator archive
        receipt for the edit). Disclosed and corrected in
        CORR-20260830-778068; not attributable to any task in this
        lineage; does not change the substance of any prior review's
        conclusion (the edited file remains vulnerable to the same attack
        its unedited version was).
      carried_forward_to: >-
        recommended hash-verification of all "frozen" predecessor artifacts
        against their original archive receipts before opening the seventh
        successor batch, and consideration of a mechanical
        predecessor-hash-drift check in dispatch/merge-hygiene tooling
      does_not_block: >-
        nothing scientific; this is a shared-repository custody finding,
        not a defect in any task's work product
  procedure_deviations: []
  bounded_successor_repair_condition:
    required_before_any_future_scoped_pass:
      - >-
        RT-J2-O4 (material, open): Close the documented-invocation PATH
        resolution gap by pinning `sh` itself as an eighth verified absolute
        path in emit_procedure_v2.md Step 1's documented command (e.g.
        `/bin/sh coordination/.../emit_host_binding_v2.sh`), applying the
        same `command -v` verification-and-pin discipline already used for
        the other seven commands, OR by changing the documented invocation
        to the shebang route (`chmod +x` then `./emit_host_binding_v2.sh`),
        which the red team confirmed empirically bypasses this vector. A
        new stop-control case (PATH-PREPEND-SH or equivalent) must
        demonstrate the fixed invocation is unaffected when "sh" itself is
        hijacked.
      - >-
        RT-J3-O2 (minor_to_moderate, open): Extend
        missing_receipt_field_v2's normalization/emptiness definition to
        cover Unicode Default_Ignorable_Code_Point / zero-width characters
        (e.g. U+200B, U+FEFF, U+200C), or explicitly document this as a
        known, accepted residual gap if not repaired.
      - >-
        RT-J3-O3 (minor, open): Document the literal-"null" trade-off
        explicitly in the rule's own record (a real hostname/device string
        of exactly "null" will STOP), or narrow the literal-string clause's
        applicability so it no longer risks this false positive.
    not_repair_items:
