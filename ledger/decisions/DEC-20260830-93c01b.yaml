  disclosed_open_items:
    - id: HOST-BINDING-ENFORCEABILITY
      description: >-
        Narrower than after BATCH-820ee8 but NOT closed against the v5
        threat model. RT-J2-O1's originally-found vector is closed inside
        the script; the documented invocation command remains a
        caller-controlled-PATH vector (RT-J2-O4, undisclosed). RT-J3-O1's
        named shapes close; two new, narrower, undisclosed gaps remain
