  context: >-
    This Coordinator archive composes the two fresh independent reviews of
    the content-first BATCH-bde652 sixth-generation host-binding repair
    package. It is limited to the declared
    J1-repair-correctness-and-nondegression,
    J2-adversarial-re-attack-of-repaired-procedure, and
    J3-rule-extension-integrity review joints and does not adjudicate
    H-JINV-5a0b9e or any scientific issue. This decision records only the
    static instrumentation package's review disposition; it authorizes no
    implementation, experiment, Phase B, control, materialization, target or
    curve access, JINV, transport, N18, science, hypothesis/status
    transition, closure, breakthrough, or resource-disposition change.
  target_ids:
