        RT-J2-O2 (material, disclosed_in_package): The self-attestation gap
        stays a DISCLOSED limitation, not a repair item, unchanged from v1
        and v2. The v5 threat model does not cover a malicious runtime.
      - >-
        PREDECESSOR-CUSTODY-INTEGRITY: not a repair item for the seventh
        successor batch's producer -- it is a shared-repository custody
        finding outside this goal's dispatch discipline, disclosed and
        corrected by CORR-20260830-778068. The seventh batch should,
