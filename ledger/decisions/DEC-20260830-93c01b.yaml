      re-litigated: they hold for this package, and the successor's repair
      is scoped to RT-J2-O4, RT-J3-O2, and RT-J3-O3 only. The successor
      authorizes NO experiment run, NO implementation of EXP-JINV-bd141d,
      and NO scientific claim; the authorization boundary of
