  rationale:
    - >-
      DISPOSITION AND EXACT SCOPE. The disposition is scoped REVISE, applying
      to this package only (the BATCH-bde652 sixth-generation repair
      package: repair-package-v6.yaml, emit_host_binding_v2.sh,
      emit_procedure_v2.md, demo-receipt-v2.json, stop-control-report-v6.yaml,
      runtime-session-receipt.json, snapshot commit
      691684e68ae6b7c936a01ea29248d608d6b5d72d).
      J1-repair-correctness-and-nondegression BREAKS, scoped to
      nondegression only (validator TASK-20260830-3ebb0b): the three named
      repairs RT-J2-O1, RT-J2-O3, and RT-J3-O1 each independently HOLD.
      J2-adversarial-re-attack-of-repaired-procedure BREAKS on RT-J2-O4
      (documented-invocation PATH resolution, material, open, undisclosed)
      and J3-rule-extension-integrity BREAKS on RT-J3-O2 and RT-J3-O3
      (Unicode zero-width coverage gap and literal-"null" false-positive
      risk, both open) -- both red-team findings (TASK-20260830-4213a6).
      None of the three breaks is outvoted: each stands and jointly drives
      the REVISE disposition. No downstream implementation or experiment
      authorization follows from this decision.
    - >-
      J1 BREAKS, NARROWLY. The validator report (VAL-20260830-3ebb0b,
      coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/reviews/TASK-20260830-3ebb0b/validation-report.yaml)
      confirms RT-J2-O1 (absolute-path resolution, no PATH lookup), RT-J2-O3
      (paste-from-different-mount, reviewer-runnable verification), and
      RT-J3-O1 (missing_receipt_field_v2 hand-instantiation) each hold under
      live re-execution, a worked reviewer-run verification, and independent
      hand-tracing against the rule text respectively. The blind
      re-derivation AGREED on all three host_binding values (host_id:
      Mac.attlocal.net, filesystem_id: /dev/disk5s1, filesystem_mount:
      /Volumes/SSD990), recorded evidence the demo values are real. J1
      nevertheless BREAKS on its own nondegression requirement: see the
      predecessor-drift finding below, recorded in full in EV-JINV-a50d47
      and disclosed in CORR-20260830-778068. This break is not attributable
      to this task's producer and does not call the three repairs into
      question; it is a shared-repository custody finding.
    - >-
      PREDECESSOR-DRIFT FINDING, INDEPENDENTLY RE-VERIFIED BY THIS
      COORDINATOR. The v1 predecessor script
      (BATCH-820ee8/TASK-20260830-78b00f/emit_host_binding.sh), declared
      frozen/immutable/read-only throughout this repair chain, was
      byte-edited after its archival snapshot by an out-of-band commit
      (fe559e6a64d83060458a53756cd65e1e82e427ac, author "Cursor Agent", no
      task/goal/decision reference, landing directly on this goal lane's own
      branch). This Coordinator independently re-ran the validator's git
      forensics (log, show, hash comparison) rather than accepting the
      report on trust, and confirms: original archived hash
      f71fe9f2059428888394b0cb6cd031a397879a8519044db70a1776878d54599f,
      current on-disk hash
      8e2e9a1918f9051789d979b76c97ac8fccde7887af66d1bf074303b83cee8f1c, the
      diff is a plausible df-output-parsing robustness fix touching no
      PATH-resolution behavior, and both pre- and post-edit copies remain
      vulnerable to the identical PATH-prepend attack. This is disclosed as
      a correction (CORR-20260830-778068) to the unqualified
      "not edited, replaced, or reinterpreted" claim repeated in
      repair-package-v6.yaml, emit_host_binding_v2.sh, and
      emit_procedure_v2.md -- true of this task's own producer, untrue as an
      unqualified statement about the predecessor's repository history. The
      correction does not rewrite, re-freeze, or re-hash any predecessor
      file, and does not retroactively invalidate TASK-20260830-31b79c's own
      independently-verified pure-additive work product.
    - >-
      J2 BREAKS ON RT-J2-O4, NOT ON RT-J2-O1. The red-team report
      (RT-20260830-4213a6,
      coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/reviews/TASK-20260830-4213a6/red-team-report.yaml)
      confirms RT-J2-O1 is genuinely closed for every internal command the
      repaired script invokes: re-attempting the exact PATH-prepend attack
      against all seven pinned commands (hostname, df, date, sed, awk, tr,
      tail), the script emitted real host values unaffected in every case.
      The break is a NEW finding, RT-J2-O4: emit_procedure_v2.md Step 1's
      documented invocation command (`sh <script>`) uses a bare "sh" token
      resolved by the CALLER's own PATH, before the script's internal
      absolute-path pins ever execute. Confirmed by execution: a hostile
      `sh` binary prepended to PATH alongside the original attack's fake
      hostname/df fully hijacked the documented invocation, producing
      fabricated schema-conformant output while the real script file was
      never executed; the shebang route (`./emit_host_binding_v2.sh`) under
      the identical hostile PATH was unaffected, isolating the gap to the
      documented invocation method specifically. This is a variant of the
      exact attack that found RT-J2-O1 -- one more hostile binary name in
      the same attack directory -- against the narrowed provenance claim
      that names "the /bin/sh interpreter executing this script" only as a
      host-integrity trust boundary, never as a residual
      caller-controlled-PATH vector, which this finding shows it also is.
      Required repair: pin `sh` as an eighth absolute path in the documented
      invocation, or switch to the shebang route, plus a new stop-control
      case (PATH-PREPEND-SH) demonstrating the fix.
    - >-
      J3 BREAKS ON RT-J3-O2/RT-J3-O3, NOT ON RT-J3-O1. The red-team report
      independently re-derived all five of RT-J3-O1's named value shapes
      (absent, null, empty-string, whitespace-only, legitimate-unusual) and
      confirmed they resolve exactly as the producer's own battery states,
      with no regression in the three original v5 STOP cases. Extending the
      battery past the objection's literal wording, the red team found: (a)
      RT-J3-O2, a Unicode zero-width-character value (e.g. one U+200B) is
      not stripped by the ASCII-only trim, is non-empty and not literal
      "null" post-normalization, and PASSES despite being junk -- confirmed
      by direct computation, mitigated but not eliminated by
      binding_rule_v2's downstream equality check when evaluated; and (b)
      RT-J3-O3, the literal-"null"-string clause would wrongly STOP a real
      host whose hostname or device string genuinely is the word "null" --
      exactly the flip-side defect class the review plan's own battery
      named, low real-world probability, entirely undisclosed as a
      trade-off. Required repair: extend the trim/emptiness definition to
      Unicode zero-width characters or document the residual gap (RT-J3-O2);
      document the literal-"null" trade-off explicitly or narrow the
      clause's applicability (RT-J3-O3).
    - >-
      PROVES-TOO-MUCH CONTROL PASSED. The red team ran the required control
      against all three known-false objects declared in the review plan
      (absolute paths resolving into a caller-writable directory; a
      normalization rule accepting whitespace-only values; demo values not
      matching the host's identity surfaces) and correctly rejected each,
      by the same methods that found RT-J2-O4 and RT-J3-O2 against the
      actual package. The control validates the method, not the artifact,
      and gives no license to soften either real finding.
    - >-
      HOST-BINDING-ENFORCEABILITY is NARROWER than after BATCH-820ee8, but
      STILL NOT closed. Against the v5 threat model (caller-supplied
      bindings): RT-J2-O1's originally-found vector (hostname/df resolved
      via PATH inside the script) is now genuinely closed, confirmed by
      independent re-execution of the exact original attack. But the
      documented invocation command itself remains a caller-controlled-PATH
      vector (RT-J2-O4), which is within the same threat model and
      undisclosed, so the package's claim to close RT-J2-O1 "against the
      exact attack that found it" is true of the script's internals and
      false of the documented procedure as a whole. missing_receipt_field_v2
      closes RT-J3-O1 for every shape it named but carries two new, narrower
      undisclosed gaps (RT-J3-O2, RT-J3-O3). RT-J2-O2 (self-attestation)
      remains correctly disclosed and unrepaired, as scoped. The narrowing
      from BATCH-820ee8's state is real but incomplete; HOST-BINDING-
      ENFORCEABILITY is not closed and a bounded seventh successor repair is
      required before any future scoped PASS.
    - >-
      PRIOR-VS-OUTCOME COMPARISON. The review plan's coordinator_prior
      (recorded before any reviewer ran) predicted the RT-J2-O1 repair would
      close outright against the exact attack that found it (VINDICATED:
      the script's own seven internal commands are genuinely closed), and
      that the residual fight would be over declared host-runtime trust
      (largely vindicated: the narrowed provenance text does correctly
      declare host-binary and dyld/runtime trust) and a definitional fight
      over RT-J3-O1's empty-after-normalization extension (vindicated in
      general shape: RT-J3-O2/O3 are exactly such definitional edge cases,
      though more specific than the prior's language anticipated). The
      prior explicitly named "if both reviewers find the package fully
      clean with NO disclosed limitation" as the surprise to probe
      skeptically; the actual outcome is not that -- it is three preserved,
      narrower breaks (J1 nondegression via an external custody event, plus
      RT-J2-O4 and RT-J3-O2/O3, none of them predicted in their specific
      form) -- and per the plan's decision_if_overturned clause, all three
      are preserved without outvoting, which is why the disposition is
      REVISE.
    - >-
      INDEPENDENCE CHECKER RESULT. `python3 tools/check_review_independence.py
      --batch coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652` PASSES
      after this Coordinator added three review_attestation fields
      (task_id and blind_from_respected to the validator's report; a
      scalar verdict to the red-team's report) that restate, verbatim,
      values already present and disclosed elsewhere in each report's own
      document -- no finding, verdict, or scope was added, removed, or
      altered by these additions. See EV-JINV-a50d47's independence-checker
      observation for the exact fields and their source values. This is
      recorded as a procedure note per this task's constraint to record the
      checker's result honestly, not as a procedure_deviation (no
      substantive report content was edited).
    - >-
      Therefore the required composition is J1 BREAKS (nondegression only),
      J2 BREAKS (RT-J2-O4), J3 BREAKS (RT-J3-O2, RT-J3-O3), overall batch
      scoped REVISE. No downstream implementation or experiment
      authorization follows from this decision.
