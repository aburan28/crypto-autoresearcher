  # ---------------------------------------------------------------------------
  ruling_on_the_draft:
    complete_as_design: true
    approvable_as_written: false
    summary: >-
      The draft meets every completion-gate item and its load-bearing inputs
      check out at source (verified_claims below). Seven defects stand
      between it and a frozen contract. Two make a decision-bearing quantity
      or a stop rule undefined or fragile (D-1, D-2); three make the
      pre-registered rules internally inconsistent (D-3, D-5, D-6); two
      assert more than the protocol can deliver (D-4, D-7). None changes the
      cell, the arms, the statistic, alpha or the scope, and none requires
      new data: they are text corrections to be made before any data exists,
      which is exactly when they are free. An approval act that froze the
      draft as written would freeze them.
    route: >-
      A corrected draft is written as a NEW file under a NEW design task (NA-3),
      snapshot-archived alone, and only then read by a separate approval act
      (NA-4). The archived draft is never edited. The approval act may also
      return the corrected draft, approve it, or decline Part A.
    defects:
      - id: D-1
        severity: must_fix (decision-bearing bound undefined on half the null outcomes)
        location: experiment.analysis.upper_bound_U_A
        finding: >-
          U_A is defined by simulating "a Poisson-planted excess at kappa =
          kappa_hat" (DR-019). The draft states no rule for kappa_hat < 1
          (DR-020, DR-021), where a Poisson-planted excess does not exist.
          Under the pre-committed null (the expected outcome O-A3) kappa_hat <
          1 occurs in about half of outcomes, and the coverage simulation at
          kappa = 1.00 that the same clause requires produces such draws. The
          EXP-PFDR-011cd0 implementation thinned binomially below 1 (DR-022),
          but that rule lives in its code, not its specification, and the
          draft requires analyze_a.py to be written from the text and to
          share no code with the producer's tools.
        required_fix: >-
          State in the contract text the simulation rule for kappa_hat < 1
          (binomial thinning of the simulated count, as analyze_relcensus.py
          does, or simulation at max(kappa_hat, 1), named as such), apply the
          same rule in the U_A coverage simulation and the |dev| fallback, and
          state the label the bound carries in that case.
        refs: [DR-019, DR-020, DR-021, DR-022]
      - id: D-2
        severity: must_fix (a gate that is a design stop can fail on floating-point representation)
        location: experiment.gates P0X-A; experiment.power_analysis.P0_rule step (2); proof_search_map.baseline_embedding.reproduction_check
        finding: >-
          P0X-A requires an independent recount to reproduce calibration.json's
          known_null_sub|TT4|band C_R and sum_s2 "exactly" (DR-023 to DR-025).
          The archived values are floats carrying accumulated rounding
          (1035.0000000000095 and 1049.333333333356; DR-026). A recount that,
          as the draft requires, shares no code with the producer need not
          reproduce the last bits, and a correct recount would then hit a
          design stop.
        required_fix: >-
          Compare integer-valued quantities -- 3 x C_R (a third of an integer
          sum) and 6 x sum_s2 (each ddof-1 variance of three integers is a
          multiple of 1/6) -- after rounding to the nearest integer, or declare
          an absolute tolerance, before data. By hand from the archived values
          the integers are 3105 and 6296 (planning arithmetic, to be confirmed
          by the corrected draft's own reading).
        refs: [DR-023, DR-024, DR-025, DR-026]
      - id: D-3
        severity: must_fix (self-contradictory blinding and run order invite an invalidation dispute)
        location: experiment.stopping_rules [5] against stopping_rules [0], runs RA-04 and gates G-REL, G7-OFFSET, PC-R-iii
        finding: >-
          The draft forbids any "look at any structured-arm count before
          RA-06" (DR-027), yet its fixed order runs the cross-run checks after
          RA-04 and before RA-05 (DR-028), and RA-04 runs G-REL, G7-OFFSET and
          PC-R-iii (DR-029, DR-030), G-REL comparing relation counts "for
          every instance" (DR-031, DR-032), i.e. including small_x,
          small_x_offset, subgroup and planted_sub, before calibration.json is
          pinned. EXP-PFDR-011cd0 ran the same checks before calibration
          (DR-033) and its blinding rule constrained only what R15 parsed
          (I-7, DR-064). The draft's added sentence is stricter than its own
          order allows.
        required_fix: >-
          Choose one, before data: (i) narrow the sentence to the
          EXP-PFDR-011cd0 form -- RA-05 parses no structured-arm count (I-A7),
          and the RA-04 checks on structured and planted arms emit only
          per-instance PASS/FAIL and mismatch keys, never a count, total,
          kappa or z, to any log or file before RA-06; or (ii) move the
          structured-arm G-REL, G7-OFFSET and PC-R-iii checks to after the
          RA-05 pin and before the RA-06 statistic, adjusting I-A4 and I-A7.
        refs: [DR-027, DR-028, DR-029, DR-030, DR-031, DR-032, DR-033, DR-064]
      - id: D-4
        severity: must_fix (pre-registered power asserted that the protocol never computes)
        location: experiment.preregistered_prediction.formula; experiment.power_analysis
        finding: >-
          The prediction says the observed alternative kappa_rel about 1.097
          is detected "with probability >= 0.9 (P0-verified)" (DR-034), but
          the power target and the P0 rule size the test at kappa 1.10
          (DR-035) and never evaluate 1.097. The red team's Gaussian planning
          figures give 6801 pooled curves for power 0.9 at 1.10 and 7285 at
          1.097 (DR-036), against a declared 6800. The observed value is also
          the family maximum of 21 cells selected after the fact (DR-037,
          DR-073, DR-074), so it is an upward-biased estimate of any true
          effect, and power computed at it overstates power at the truth.
        required_fix: >-
          Either size for the observed value (power target at kappa 1.097,
          which on the planning figure means at least 7285 pooled curves,
          P0-verified) or keep 1.10 and replace the sentence with the
          P0-computed power at 1.097 recorded before data without asserting
          0.9; and add one sentence that power is computed at a
          post-selection estimate. The test, alpha and threshold rule are
          unchanged either way.
        refs: [DR-034, DR-035, DR-036, DR-037, DR-073, DR-074]
      - id: D-5
        severity: must_fix (outcome rows do not partition the outcome space)
        location: experiment.outcomes.rows O-A1, O-A1b, O-A2
        finding: >-
          O-A1b's parenthetical assigns "M excluded on more than 20% of
          curves" to O-A1b (DR-039), but neither O-A1 (DR-038) nor O-A2
          (DR-040) excludes that case. With z_A > t_dec, z_M <= t_dec,
          z_Delta > t_Delta and M excluded on more than 20% of curves, the
          text supports both O-A1 and O-A1b; with z_M > t_dec it assigns O-A2
          while the parenthetical says O-A1b. The success criterion requires
          exactly one outcome.
        required_fix: >-
          Add "M admitted on at least 80% of each rung's design curves" to the
          O-A1 and O-A2 conditions (or state an explicit evaluation order), so
          the seven rows partition the space; name what removes a curve from
          M (the height screen and CC-6).
        refs: [DR-038, DR-039, DR-040]
      - id: D-6
        severity: must_fix (minor; an outcome-bearing quantity can be undefined)
        location: experiment.analysis.X_rel
        finding: >-
          X_rel is the smallest kappa on the grid 1.00 .. 1.30 reaching
          simulated power 0.5 (DR-041); the draft states nothing for the case
          that no grid point does (DR-042), which an infrastructure loss of
          curves can produce. O-A3 and O-A4 depend on X_rel. EXP-PFDR-011cd0's
          grid ran to 5.
        required_fix: Report "X_rel > 1.30" and assign O-A4 in that case, or extend the grid; state it before data.
        refs: [DR-041, DR-042]
      - id: D-7
        severity: must_fix (pre-registers a replication status the evidence rules do not grant; shrinks Part B)
        location: experiment.outcomes.rows O-A3 meaning; part_B.order_and_whether_to_run_before_A
        finding: >-
          O-A3's meaning says Part A "also serves as the independent
          replication of this cell for a later reject_scoped" (DR-043), and
          Part B then drops small_x TT4 because A "is designed to be that
          cell's independent replication" (DR-044). But EXP-PFDR-011cd0 gave
          this cell no bounded reading: it is INCONCLUSIVE at target (DR-045;
          upper bound 1.1711 > 1.15, DR-046). An O-A3 result would be the
          cell's FIRST bounded null, discordant with the first run, not a
          replication of a bounded null. Whether any later reject_scoped may
          cite it is a composition-time question under
          docs/claims-and-verification.md, not something a protocol
          pre-registers.
        required_fix: >-
          O-A3's meaning becomes: small_x TT4 becomes eligible, by a new
          Coordinator decision after review, for the same weaken as the 20
          cells (one bounded reading, single run, discordant with
          EXP-PFDR-011cd0's non-excluding reading). Delete the replication
          sentence. Part B's covered set includes small_x TT4 by default (21
          cells after O-A3), unless the corrected draft pre-registers, before
          data, a rule naming the two concordant bounded readings a later
          reject_scoped would rest on.
        refs: [DR-043, DR-044, DR-045, DR-046]
    observations_not_defects:
      - id: OB-1
        text: >-
          PC-R-T (ii)'s tolerance of 4 SD_null is wide against K_plant at the
          declared n (planning, by hand: SD_null about 49 relations, so about
          195 against K_plant about 264 pooled). Exact plant recovery is
          carried by PC-R-iii and sensitivity by PC-R-T (i); the tolerance
          follows the EXP-PFDR-011cd0 PC-R (ii) precedent. No change required;
          the approval act may tighten it.
      - id: OB-2
        text: Only HEUR-2765d2-H1c's TT m = 4 dispersion clause is tested (declared in heuristic_under_test); the randomized-PIT KS clause of its falsification condition (DR-062) is not. Acceptable as declared; no H1c reading beyond that clause may be made from Part A.
      - id: OB-3
        text: The advisory CPU figure counts the first G-REPRO pass (2 jobs x 100 curves x 11 arms = 2200 instances; the arm list is DR-057) and not the second pass with 13 arms. Advisory only; no change required.
      - id: OB-4
        text: The draft records the design session's prior (O-A3 0.80). The review round's prior is written by the Coordinator at that round's dispatch (AGENTS.md "Review architecture") and does not inherit this one.
      - id: OB-5
        text: Part C-2's rungs above 32 bits fall outside the toy rule; their tier is assigned at C's design, as the draft says.
    verified_claims:
      note: >-
        Draft claims this Coordinator checked at the source the draft cites,
        so that the corrected draft can carry them unchanged.
      p0_inputs: >-
        calibration.json known_null_sub|TT4|band C_R, sum_s2, V, SD_null,
        curves_used (DR-026); the G-NB-R D values of SUB/TT/4/30 and
        SUB/TT/4/32 (DR-047, DR-048); the per-rung small_x random-arm C_R of
        smallx-tt4-localise.json (DR-049); A_INT small_x|TT4|band kappa_rel,
        SE, one-sided q and bound, X_rel (DR-037); replication-sizing.json
        (DR-036); the red team's small_x TT4 dispersion ratio 1.148 [0.998,
        1.307] (DR-050); design.json final and declared n (DR-051, DR-052).
      engine: >-
        FactorBase.planted's n_tt = max(1, round(s^4/(6N))) rule (DR-053) and
        its m-independent builder in the census CLI, with arm order fixed by
        MAIN_ARMS_ALL (DR-055, DR-056), so the "m = 3 only" restriction is
        specification text (DR-058) and inserting small_x_offset after
        planted_sub leaves earlier arms' order unchanged (G-REPRO tests it);
        small_x walks x from 0 (DR-054); the archived R12 job command and the
        three row files of each G-REPRO job exist (DR-057, DR-059); the numpy
        path requires p < 2^32 (DR-060).
      records: >-
        HEUR-2765d2-H1c's frozen falsification clause (DR-062); H-PFDR-2765d2
        status field "specified" (DR-061); TASK-20261001-7f7a33 is the
        EXP-PFDR-011cd0 executor card the draft's executor-independence clause
        names (DR-063).

  # ---------------------------------------------------------------------------
  order_ruling:
    order: Part A -> Part C -> Part B
    part_A: >-
      FIRST. Corrected draft (NA-3), its snapshot archive, then a separate
      approval act (NA-4), execution, snapshot archive, independent review,
      composition. It resolves the one open cell of the weakened branch, is
      cheap (advisory, single-digit CPU-hours), and builds the instruments
      Part C and Part B reuse (planted arm at target, permutation-null
      threshold, signed bound).
    part_C: >-
      SECOND. Its DESIGN task (C-1 in-band ladder of at least four rungs for
      TT3, SS3, SS5, with the C-2 pilot preconditions) may be opened once the
      Part A approval act is committed: design is zero-run and does not
      contend for the machine. Its EXECUTION waits until Part A's run package
      is snapshot-archived (nothing else runs during RA-04; C-1 should run on
      the build Part A's G-REPRO validated), and is re-ranked if Part A fires
      TW-ALIVE. Reason: growth with N is the only route on this line that can
      bear on an exponent (DEC-20261002-c3f49b NA-6 (3), DR-068;
      docs/target-result-profile.md); no growth statement rests on two rungs.
    part_B: >-
      THIRD, and only if a reject_scoped on the weakened cells is actually
      sought: designed after Part A composes, covering small_x TT4 too unless
      D-7's fix pre-registers otherwise. Part C's approval act may merge B's
      fresh 30-32-bit rungs into C-1's ladder, as the draft proposes. B is a
      constant-level census whose only product is a toy-scale reject_scoped,
      so it ranks below the growth read.

  part_A_approval:
    approved_by: null
    experiment_id_minted: false
    dispatched_for_execution: false
    note: >-
      Nothing here approves, freezes or dispatches Part A. DEC-20261002-1ebedd
      NA-7, continued by DEC-20261002-c3f49b NA-5 (DR-067), stays in force:
      no task takes write scope over src/crypto_autoresearcher/index_calculus/**,
      tests/test_index_calculus_*.py, tests/fixtures/** or
      experiments/EXP-PFDR-011cd0/** until a later decision approves or
      declines the design.

  target_result_profile_check:
    required: false
    reason: Design return; no claim, approval or transition. Answered briefly for the record.
    answers:
      exponent_bias: >-
        Part A is a constant-level test of one cell; it is ranked first
        because it is cheap, resolves the line's only open signal and builds
        Part C's instruments. Part C is the line's exponent-relevant route and
        is ranked above Part B. A constant kappa_rel cannot move this engine's
        exponent; nothing here asserts one.
      heuristics_explicit_numbered: HEUR-2765d2-H2, H4 and the H1c TT m 4 dispersion clause are the heuristics Part A tests (as declared in the draft).
      validation_scale_and_transfer: toy (30-32 bits); no transfer asserted (TW-SCOPE).
      affected_vs_safe_scope: none claimed; Pollard rho and BSGS unaffected.

  rationale:
    - >-
      Validity of the return first: the deliverable exists as one file at the
      declared path, the completion gate is met item by item, and its bytes
      are bound by the snapshot archive before any approval act reads them.
    - >-
      A design return is the cheapest point to fix a protocol. Each defect is
      a text correction with no data dependence; freezing them would cost an
      amendment, a dispute at review, or an undefined outcome later.
    - >-
      Symmetric skepticism: D-4 and D-7 remove claims the protocol cannot
      deliver (a power never computed; a replication status the evidence
      rules do not grant); nothing is removed that the design can deliver.
    - >-
      Research-direction integrity (AGENTS.md rule 9): the open small_x TT4
      signal keeps its dedicated, pre-registered test; the growth read keeps
      its rank above any further constant-level census; nothing is closed or
      deprioritised by this decision.
    - >-
