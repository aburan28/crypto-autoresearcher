coordinator_decision:
  id: DEC-20260907-90a00d
  context: >-
    EXP-PMA-001 tested H-PMA-001's frozen bidirectional exact-classifier
    reading of a divisor-parity obstruction predicate against independent
    brute-force 4x4 matrix existence, over F_3/F_5/F_7 and Q. The four-run
    package (RUN-PMA4-001-a/b/c/d, commit 2bb8839da) passed independent
    validation (VAL-20260907-ae3832: verdict passed, every reported
    statistic independently recomputed exactly, controls independently
    reproduced, frozen decision-logic files proven untouched via git
    history) and independent red-team review (RT-20260907-0df70c: the F_5
    disagreement is genuine, independently reproduced by two further
    from-scratch methods including an unconstrained Groebner basis over the
    algebraic closure of F_5(t) returning the trivial ideal -- a checkable
    refutation artifact, not merely an observation -- but the reported
    18/18, 10/10, and 34/52 instance counts materially overstate
    independent sample size, and the widening fallback is a dead no-op for
    small-box fields). Two corrections (CORR-20260907-ae8418,
    CORR-20260907-f41219) already supply the distinct-instance recount, the
    box-collision disclosure, the dead-widening disclosure, and the
    dirty-code-clause scope reconciliation, without editing any committed
    byte. EV-PMA-fbdd4c composes all of this into a single evidence record
    that keeps the two falsification directions distinct rather than
    collapsing them.
  decision: refine
  target_ids:
    - H-PMA-001
    - EXP-PMA-001
    - RQ-PMA-001
  rationale:
    - >-
      H-PMA-001's own frozen text already separates two logically distinct
      claims: its `mechanism` field distinguishes "the underlying mechanism
      claims the obstruction direction only" (direction 1: odd valuation is
      fatal to existence) from "the stronger frozen exact-classifier
      reading" that its `statement` field actually asserts (direction 2:
      bidirectional agreement with brute-force existence on every tested
      instance), and its `interpretation_limits` pre-registers "necessary,
      not sufficient" as the anticipated failure mode. The run's own
      falsification_criterion tests both directions separately and by
      design does not let a direction-2 failure refute direction 1. A
      single blanket status change to H-PMA-001 would either overstate
      direction 1 (dragging a supported, non-vacuously-confirmed claim down
      with a rejected one) or understate direction 2's genuine, replicated
      falsification -- either way erasing a distinction the frozen record
      itself insisted on keeping.
    - >-
      Direction 2 (the bidirectional exact-classifier reading, i.e.
      H-PMA-001 exactly as frozen) clears the evidentiary bar for
      `reject_scoped` as stated in the review-evidence skill: "reject_scoped
      requires a checkable refutation artifact (counterexample certificate
      or derivation note) or replicated empirical evidence -- never a
      single unreplicated empirical-only run." Both are present: a
      derivation-note-tier refutation artifact (the unconstrained Groebner
      basis over the algebraic closure of F_5(t), RT-20260907-0df70c
      independent_verification.method_4_groebner_no_normalization, basis =
      [1]) and independently replicated empirical evidence (the Validator's
      full from-scratch recomputation of all 52/14 instances, plus the Red
      Team's two additional from-scratch methods). This component of the
      finding is treated as a `reject_scoped`-strength result within
      EV-PMA-fbdd4c even though the overall hypothesis transition below is
      `refine`, not a bare `reject_scoped` label -- see the next point.
    - >-
      Direction 1 (the one-directional obstruction mechanism) is unrefuted
      and non-vacuously confirmed with zero counterexamples across every
      decided instance in this run (52 labeled / 14 distinct: F_3:1, F_5:5,
      F_7:3, Q:5). Treating H-PMA-001's transition as a wholesale
      `reject_scoped` or `weaken` would bury this surviving, arguably more
      valuable finding (the necessary-condition mechanism is exactly the
      kind of short-rejection-certificate machinery the source proposal
      wanted, and is the piece with future symbolic-derivation potential)
      under the label of the claim that actually failed. AGENTS.md's
      research-direction-integrity rule forbids deliberately steering away
      from a plausible high-value lead; silently discarding direction 1's
      standing result inside a blanket adverse transition would be exactly
      that failure in effect, even if unintended. `refine` is the
      transition that lets both readings be recorded honestly: the
      bidirectional statement retires (rejected, scoped, as literally
      written), and the surviving one-directional mechanism is named
      explicitly as the live claim worth carrying forward, pending a
      properly designed successor hypothesis (not minted in this decision
      -- see next_actions).
    - >-
      Sample-size correction (CORR-20260907-ae8418) does not change the
      falsification verdict on either direction -- false_obstruction_count
      is 0 under both bases, and false_compatibility_count is nonzero
      under both bases -- but it does change what evidentiary weight either
      finding can honestly claim, and both bases are now carried in
      EV-PMA-fbdd4c and the analysis.md addendum per that correction's
      immutability_note.
    - >-
      The dirty-code-revision clause tension VAL-20260907-ae3832 flagged as
      unreconciled is resolved by CORR-20260907-f41219: the three frozen
      required_artifacts decision-logic files were never touched by the
      archiving session (confirmed via git log by both the Validator and
      this Coordinator independently), so the run package is admissible and
      this decision proceeds on it.
  evidence_refs:
    - EV-PMA-fbdd4c
    - experiments/EXP-PMA-001/reviews/VAL-20260907-ae3832.yaml
    - experiments/EXP-PMA-001/reviews/RT-20260907-0df70c.yaml
    - CORR-20260907-ae8418
    - CORR-20260907-f41219
  limitations:
    - >-
      Toy scale throughout (claim_tier: toy); no ECDLP, relation,
      source-to-scalar, or standardized-curve claim is made or implied by
      any part of this decision.
    - >-
      Direction 2's falsification is scoped to the narrow, forced
      repeated-value F_5(t) table family (RT-20260907-0df70c OBJ-2), not to
      F_5 generically. Whether it generalizes to a non-repeating F_5(t)
      table, or to any other field, is untested.
    - >-
      Direction 1's non-vacuous support rests on 8 distinct instances
      (F_7:3, Q:5); F_3 and F_5 are structurally box-collision-limited and
      contribute little independent confirming weight beyond what is
      already counted.
    - >-
      The widening fallback is a dead no-op for F_3 and F_5 as implemented;
      no experiment in this lineage has yet tested a genuinely enlarged
      parameter box for a small finite field.
    - >-
      This decision does not mint a new hypothesis record for the surviving
      one-directional obstruction mechanism; it names the gap as a next
      action rather than fabricating a hypothesis record inline.
  next_actions:
    - >-
      Design (idea-generator/coordinator, not yet authorized to execute) a
      follow-up experiment testing a genuinely non-colliding parameter box
      (F_11 or F_13, q-2 >= 9) or a table built from >= 15 distinct
      rational functions, per CORR-20260907-ae8418's next_action and
      RT-20260907-0df70c's final required_controls item, to determine
      whether the direction-2 sufficiency failure is F_5-specific or
      general to the repeated-value table family at any field. If it does
      not reproduce outside the box-collision corner, the finding should be
      re-attributed to the repeated-value table family rather than to F_5.
    - >-
      Design a narrower successor hypothesis carrying forward direction 1
      (the one-directional necessary-condition obstruction mechanism) as
      its own tracked claim, distinct from the now-retired bidirectional
      exact-classifier reading, before any further symbolic-derivation
      track builds on the mechanism.
    - >-
      Fix or formally retire grid_data.py's widening_instance so it cannot
      silently no-op for a small-box field in any future experiment reusing
      this grid construction.
    - >-
      No ECDLP, relation, source-to-scalar, or standardized-curve work is
      authorized by this decision.
  knowledge_promotion:
    promoted:
      - KN-FIND-c2e9a7
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-09-07'
