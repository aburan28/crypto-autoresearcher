      DEC-20260731-011's condition on certifying any reduced-round measurement
      is not discharged while ER-6 stands.
      (3) THIRD, a versioned protocol_amendment adopting the TASK-20260731-705
      recommendation PROSPECTIVELY and never retroactively: every declared
      source-code artifact either carries a comment-block inference stanza or is
      bound by digest in an explicit artifact_provenance list inside the manifest
      whose inference block covers it, with the requirement stated ONCE in
      identical language across producing and archival dispatch cards (the
      D-704-1 drafting inconsistency).
      GATE-601-A remains NOT dispatched. An inference block in every producer
      artifact remains a dispatch-time completion gate at the snapshot archive.
      Independent validation plus a Coordinator ledger archive close the batch as
      in BATCH-001 and BATCH-002. The declared BATCH-003 budget must be
      calibrated toward measured rather than conservative time and must fit
      within the standing 20000 s campaign ceiling, which a further amendment
      alone may raise.

  knowledge_promotion:
    promoted:
