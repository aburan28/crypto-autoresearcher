  dispositions:
    derivation_note_TASK_20260731_701: >-
      PROMOTED to KN-FIND-017 at proof_status: derivation with the same
      proof_refs. Fit as a standalone artifact per the independent
      TASK-20260731-705 verdict; committed in ebac9ba8 before this decision, as
      the refutation-artifact ordering requires. The note is NOT edited: the
      unmet letter of D-701-1 is superseded by the validation report, never by
      an amendment to an immutable record.
    PROP_701_I: >-
      RECORDED, NOT PROMOTED, AND NOT MADE OFFICIAL. Proof complete and correct
      per independent step-by-step check; AES-shaped case confirmed exhaustively
      in the GF(2^4) analogue. Blocked from an official scoped closure by
      D-705-1: its own pre-declared falsification gate is VOID on its own terms,
      because null_2 negates a sufficient rather than a necessary hypothesis.
      A discriminating second null — one negating the NECESSARY ingredient of
      Step 3, that the entries of M generate GF(2^8)* and hence that the
      (lambda,k) graph is strongly connected — must be built and run before any
      reject_scoped of the round-independent single-word deterministic class.
      D-705-5's two unnamed scope holes must be named at the same time.
    super_box_lane: >-
      NOT CLOSED. Four open directions stand untouched (OD-1 layer-dependent,
      OD-2 multi-word, OD-3 set-valued, OD-4 bounded-branching), plus OD-5's
      three unexamined classes and OBJ-701-7 / OBJ-701-8. OD-1 is ranked first
      and is the exponent-relevant item: it is the largest hole in the closure
      and has a concrete first step costing seconds.
    harness_TASK_20260731_702: >-
      ADMITTED as the superseding mutation control for this campaign, as a
      REPRODUCIBILITY FACT only. H-1 and H-3 are CLOSED as claimed. ER-6 is OPEN
      and is a tracked repair item, together with D-705-8 (the coverage boundary
      is undocumented). DEC-20260731-011's condition that H-1 and H-3 close
      before any cryptanalytic measurement is certified against the reduced-round
      path is NOT yet discharged: ER-6 must be fixed and the (key length x
      final_mix_columns) coverage boundary written into the receipt first. H-2,
      H-4 and ER-5 remain open; H-4 remains an irreducible limitation, not a
      defect to repair. No BATCH-001 artifact was modified in place.
    CAND_601_B: >-
      Its three self-contained yields are DELIVERED and reproduce. The
      DEC-20260731-011 strikes remain in force in full and no comparison against
      any recalled baseline is reinstated. It remains a cofactor-class candidate
      ranked below the super-box residual under docs/target-result-profile.md,
      and it is NOT advanced. Four cost-accounting defects (D-705-9 through
      D-705-12) are recorded and must travel with the 0.0444 figure if anyone
      ever cites it, together with the untabulated 46x memory ratio.
    GATE_601_A: >-
      UNCHANGED. CAND-601-A remains premise-undermined and repair-before-run
      under DEC-20260731-011. It was not run, not partially run, and its
      statistic was not computed in BATCH-002.
    hypothesis_status_changes: >-
      NONE. No hypothesis record exists for GOAL-AES-001 and none is created by
      this decision.
    goal_status: >-
      GOAL-AES-001 remains `active`. No completion criterion is met: no
      certified reduced-round result exists, and the one scoped closure the
      campaign has produced is under-controlled and is deliberately not made
      official. Independently, under inference-amendment 0137a051 a
      three-distinct-model closure quorum is unobtainable in this harness, so
      `completed` is unreachable regardless of outcome. NO ATTESTATION IS
      RECORDED, and the TASK-20260731-705 validator states explicitly that its
      own session cannot supply one.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim was advanced in BATCH-002. Nothing in this
      batch claims a complexity exponent, a cofactor improvement, or a speedup:
      the GATE-601-B ratio is a counted-operation measurement under a stated
      convention on a toy cipher with no scaling law fitted and no extrapolation,
      and PROP-701-I is a qualitative structural closure with no cost content.
      The four promotion gates in agents/coordinator.md and
      .claude/skills/coordinate-research-goal/SKILL.md are therefore NOT
      ENGAGED. They are named here so a later batch cannot quietly bypass them:
      (1) an archived proof decomposition into single-responsibility lemmas with
      the main theorem assembling them under explicit per-attempt-cost x
      inverse-success-probability bookkeeping; (2) every conditional dependence
      stated as an explicit numbered heuristic, each with archived validation
      evidence or a scheduled validation experiment; (3) a concrete-cost table at
      standardized parameter sets with honest accounting of superpolynomial
      overhead hidden in o(1) terms, memory, time-memory tradeoffs and
      parallelization, optimistic assumptions flagged, and an explicit
      affected-vs-safe scope statement; and (4) independent review-xhigh review
      per AGENTS.md rule 12 plus a red-team pass on the cost model and
      heuristics. A claim missing any gate may reach `analyzed`, NEVER
      `supported`.
    what_would_engage_them: >-
      Two concrete routes exist from this batch's material. First, if OD-4 is
      pursued as the producer suggests — converting PROP-701-I's qualitative
      group-growth argument into a LOWER BOUND on the branching factor B for a
      given entropy loss — the result would be a cost inequality and would engage
      all four gates. Second, if anyone ever advances the GATE-601-B
      reorganization as a cost improvement rather than as a counted measurement
      on a toy cipher, gate (3) applies immediately and hard: D-705-9, D-705-10,
      D-705-11 and D-705-12 are exactly the concrete-cost honesty items — the
      uncounted division, the write-exclusion asymmetry, the order-of-magnitude
      convention sensitivity, and the 46x per-side memory ratio — and no such
      advance may be made without them tabulated. Neither route is taken here.

  limitations:
    - >-
      This decision asserts NOTHING about AES. BATCH-002 produced no
      distinguisher, no key recovery, no speedup, no measured structural excess,
      and no barrier statement about the cipher, at any round count.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security
      of any system that uses AES. Claim tier is toy / reduced-round.
    - >-
      A repaired instrument is a reproducibility fact and a passing derivation
      check is a derivation fact. Neither is empirical cryptanalytic evidence,
      and a ledger archive makes work durable without upgrading the strength or
      scope of the evidence.
    - >-
      The GATE-601-B measurements are scoped to a small-scale AES-shaped SPN at
      3-, 4- and 5-bit cells with declared definitional choices that are NOT an
      AES round structure, and to the two implementations written inside
      TASK-20260731-703. No independent third implementation of either
      aggregation was written; budget did not permit it.
    - >-
      A green from mutation_control_v2.py does not certify aes_reduced.py in
      regimes the task set never generates (ER-6), and its reduced-round
      comparison target establishes SENSITIVITY only, never convention
      correctness (H-4).
    - >-
      Every literature statement anywhere in this batch is
      UNVERIFIED-FROM-MEMORY; zero primary sources were read by any participant.
      Novelty against the external literature was not, and in this environment
      cannot be, settled. PROP-701-I's self-label as a probable re-derivation of
      known subspace-trail limits is itself unverified-from-memory at recall
      confidence LOW-MEDIUM and settles nothing in either direction.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE. All three producers, the
      validator and this Coordinator resolve to the same model under
      inference-amendment 0137a051; independence in BATCH-002 is in SESSION
      ONLY, never in MODEL, and correlated agreement is the honest reading.
      model_verified is false in every inference block in this batch:
      `python3 -m orchestration.adapter doctor --probe` was run by nobody, so
      every resolved_model_id here is unverified configuration.
    - >-
      GOAL-AES-001 is NOT completed and is not proposed for completion. No
      completion criterion is met and no attestation is recorded.

  next_actions:
    - >-
      Generate, commit and dispatch the GOAL-AES-001 BATCH-003 dispatch queue,
      reranked on this committed checkpoint in this order.
      (1) FIRST, and ranked first on the merits because it is the only
      exponent-relevant item and it repairs the control of the campaign's only
      closure in the same task: an idea-generator or executor task that
      (a) computes the DIAMETER d of the 1020-node (lambda,k) graph of
