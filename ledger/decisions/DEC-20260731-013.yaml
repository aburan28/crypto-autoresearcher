coordinator_decision:
  id: DEC-20260731-013
  context: >-
    Official close-out of GOAL-AES-001 BATCH-002, the batch dispatched under
    DEC-20260731-011's reranked next action and authorized under DEC-20260731-012.
    Three producers ran concurrently (TASK-20260731-701 idea-generator,
    TASK-20260731-702 executor, TASK-20260731-703 executor); their exact nine
    artifacts were snapshot-archived alone in TASK-20260731-704 as commit
    ebac9ba8a52b05bbd434edac715271e404d8e104 (parent
    98ae8539c9cbb8c3a261ceab83536069c9947253); an independent
    review-adversarial session, TASK-20260731-705, verified that snapshot
    against Git and returned THREE SEPARATE VERDICTS in three physically
    separate files, with no combined verdict by design — (a) derivation note and
    ideation PASSED with defects and the note FIT for standalone promotion,
    (b) harness repair PASSED with a NEW open escape route the validator found
    itself, (c) GATE-601-B run PASSED with four cost-accounting defects and no
    struck-claim violation. This decision is the ledger transition that follows,
    resting on EV-AES-002. BATCH-002 produced NO cryptanalytic result and NO
    claim about AES of any kind, at any round count; nothing below should be read
    as one.
  decision: revise
  target_ids:
    - RQ-AES-001
    - GOAL-AES-001
    - EV-AES-002
    - KN-FIND-017
    - TASK-20260731-701
    - TASK-20260731-702
    - TASK-20260731-703
    - TASK-20260731-705

  id_provenance: >-
    THIS DECISION'S ID WAS REALLOCATED. DEC-20260731-012 reserves
    "DEC-20260731-004" for the TASK-20260731-706 ledger archive and names
    "KN-FIND-012" as its knowledge target. Both reservations are STALE: merge
    commit 344d1012 brought main's already-published GOAL-MLKEM-003 records onto
    this tree, where DEC-20260731-004 is a GOAL-MLKEM-003 batch decision and
    KN-FIND-012 is the Carrier/Pwrong finding. Writing to either would have
    overwritten another campaign's record. CORR-20260731-005 records the
    reallocation — DEC-20260731-004 -> DEC-20260731-013 and KN-FIND-012 ->
    KN-FIND-017 — verifies both new IDs free by directory listing, and confirms
    EV-AES-002 was never in collision. DEC-20260731-012 was DELIBERATELY NOT
    EDITED: it is an immutable committed record under AGENTS.md core rule 4, and
    CORR-20260731-005 is the durable record of the supersession. This paragraph
    discharges the forward_obligation CORR-20260731-005 places on this decision,
    so a reader comparing the two does not see an unexplained mismatch. The
    reserved SLOTS are unchanged in meaning and ownership; only the identifiers
    moved.

  rationale:
    - >-
      THE THREE VALIDATOR VERDICTS ARE KEPT DISTINGUISHABLE AND ARE NOT
      AVERAGED INTO A BATCH GRADE. A sound derivation note does not validate the
      gate run; a coverage escape in the harness repair does not touch either of
      the others; a clean gate measurement validates nothing about the
      mathematics. The validator issued no combined verdict by design and none is
      manufactured here. EV-AES-002 records them as three separate observation
      groups with a per-group scope statement.
    - >-
      WHAT THIS BATCH ACTUALLY PRODUCED, stated plainly: two independently
      recomputed negative mathematical facts and one proved closure
      (PROP-701-I); a repaired-but-still-escapable instrument; and three
      self-contained measurements on a small-scale AES-shaped SPN. It produced
      NO cryptanalytic result and NO claim about AES at any round count. Zero
      cryptanalytic compute was spent on AES itself. That is the honest headline
      and it is recorded as EV-AES-002's headline_non_result.
    - >-
      THE PROMOTION IS WARRANTED AND THE ORDERING DISCIPLINE IS SATISFIED. The
      derivation note was committed in the TASK-20260731-704 snapshot ebac9ba8
      and independently reviewed in TASK-20260731-705 BEFORE this decision — the
      docs/claims-and-verification.md refutation-artifact ordering that
      DEC-20260731-011 deliberately deferred to this batch. The validator
      returned it FIT for promotion as a standalone artifact on a basis it
      executed rather than asserted: self-containment confirmed by reading the
      note with BATCH-001 treated as unavailable; verify_derivation.py re-executed
      from the committed blob (16 PASS, 0 FAIL, 1 SKIP of 17); and every fact in
      both propositions RECOMPUTED BY THE VALIDATOR'S OWN METHOD with no
      discrepancy anywhere, including ord(M)=4 by two independent routes and the
      scalar identity exhaustively over all 65280 (lambda, x) pairs. Both
      producer additions beyond BATCH-001 are correct, and Corollary 2.2 is
      materially load-bearing rather than decorative: without it Corollary 2.1
      would be false as a universal. KN-FIND-017 promotes exactly these two
      facts, at proof_status: derivation, with the same proof_refs.
    - >-
      PROP-701-I IS NOT PROMOTED AND THE SUPER-BOX LANE IS NOT OFFICIALLY
      CLOSED, AND THAT IS THE MOST CONSEQUENTIAL CALL IN THIS DECISION. The
      proof is complete and correct — an independent session worked all three
      steps, found round-independence consumed exactly once, and confirmed the
      AES-shaped case exhaustively in a GF(2^4) analogue at 65535/65535. The
      tempting transition is therefore reject_scoped on the class of
      round-independent, single-word, deterministic lossy projections. It is
      WITHHELD, for a reason the inventor protocol makes binding: the closure's
      OWN PRE-DECLARED FALSIFICATION GATE IS VOID ON ITS OWN TERMS. When the
      validator ran GATE-701-C — which the producer specified but could not run —
      null_2 returned 65535/65535 at dimension 16, the SAME reading as the
      AES-shaped target, firing the gate's declared VOID condition; and null_1's
      predicted stall dimension was 4 in the report and 1 in measurement. The
      cause is general and is the lesson worth carrying: null_2 negates "every
      entry of M is nonzero", which is a SUFFICIENT hypothesis of Step 2, not a
      necessary one, so negating it need not change the conclusion. Controls
      before belief applies to closures as much as to signals. Mitigating and
      recorded: null_1 discriminates sharply and structurally (dimension 1
      against 16) and the gate never touches the S-box, which is the direct
      repair of EV-AES-001 defect I-3, so the closure is not control-less — it
      is under-controlled. Two unnamed scope holes (D-705-5) narrow it further.
      PROP-701-I is named inside KN-FIND-017 as an adjacent, explicitly
      unpromoted result, so a future session can find it without the corpus
      asserting it.
    - >-
      THE IDEATION OUTCOME IS A CLOSURE, NOT A FATIGUE REPORT, and this is
      accepted on the validator's checkable grounds rather than on the producer's
      self-assessment. A fatigue report's content is a count of screened objects;
      this record's content is a proposition with a proof, a named obstruction
      (the interface Phi = ARK.MC.SR is not a byte permutation; every MixColumns
      entry is nonzero and the entries generate GF(2^8)*, so one collision of the
      projection grows into full translation invariance), and forward guidance
      naming four classes a future object must inhabit. All 8 enumerated objects
      name a concrete tracked object on a named byte set at a named round count,
      the byte set is a ShiftRows diagonal — genuinely super-box-level, not a
      relabelled column-local object — and the record explicitly declines to
      claim "the super-box lane is mined", which is the premature-closure failure
      the protocol forbids. NO candidate is a rediscovery presented as novel:
      the producer volunteers OBJ-701-3, -4 and -5 as rediscoveries itself and
      the validator's independent identification agreed on every object.
      dominated_by: n/a with written justification and sota_delta: 0 bits on
      every axis at every round count 3-7 are the honest values when nothing is
      claimed; an unchecked null would have been a fabrication.
    - >-
      THE HARNESS REPAIR IS ADMITTED AS A REPRODUCIBILITY FACT, WITH ER-6 OPEN
      AND TRACKED. H-1 is closed BY REMOVAL rather than by narrowing — the
      self-check detection path is deleted and the only route to detected: true
      requires positive comparison evidence — and it survived six independent
      injection shapes of the validator's own devising, every one failing closed
      with zero comparisons and a null mechanism. H-3 is closed with per-regime
      detection verified at r < Nr, RR4 diverging 128/128 at r < Nr and 0/36 at
      r = Nr (invisible at full rounds by construction, the exact BATCH-001 blind
      spot), and a no-op control scoring detected: false after 164 EXECUTED
      comparisons, so the green is falsifiable rather than automatic. AND YET:
      the validator injected a fault active only for final_mix_columns=True with
      24- or 32-byte keys, confirmed by direct ciphertext comparison that the
      fault is real, and the control returned VERDICT PASS WITH ALL FIVE
      COMPONENTS TRUE ON A DEMONSTRABLY BROKEN MODULE, because build_tasks()
      generates fmc=True only for 16-byte keys. ER-6 is the H-3 failure shape
      recurring on an uncovered axis INSIDE THE REPAIR FOR H-3. That is not a
      reason to withdraw the repair — it falsifies nothing the receipt claims —
      but it is decisive for what a green may be used to certify, and DEC-
      20260731-011's condition that H-1 and H-3 close "before any cryptanalytic
      measurement is certified against the reduced-round path" is NOT yet
      discharged: the bound on what a green certifies must be written down and
      the coverage hole closed first. H-2, H-4 and ER-5 correctly remain open and
      the validator confirmed no artifact claims otherwise.
    - >-
      THE GATE-601-B MEASUREMENTS STAND, SCOPED EXACTLY. All 54 runs reproduce
      bit-for-bit from committed source after an independent rebuild; correctness
      equivalence is confirmed by exact memcmp over the whole guess space in
      54/54 runs with the digest supplementary rather than substitutive; S-box
      independence is confirmed under a genuinely same-shape seeded
      random-bijection null at relative differences 1.48e-05 / 7.69e-08 /
      3.03e-08, below the within-S-box key-to-key spread at n=4 and n=5; and the
      measured ratio 68625045/1546650864 = 0.0443700945 at the 2^16 instance is
      confirmed by the validator's own recomputation. The counting convention is
      substantially symmetric — build_G() is literally the same function on both
      sides, contributing 128 counted ops to both — WITH TWO NAMED ASYMMETRIES
      that must travel with the number: an uncounted integer division on the
      reorganized side (ratio -> ~0.04522 if charged) and write-exclusion that is
      nominally symmetric but materially favours the reorganized side, whose
      uncounted Walsh-Hadamard writes are ~44% of its counted total against under
      1.4% for the direct side (ratio -> 0.06403 if charged). The "convention,
      not cost model" framing is honest and its sensitivity is now quantified:
      0.0444 unweighted, 0.3546 under byte-traffic weighting, reversal requiring
      an indefensible 48x weight on an int64 add — direction robust, magnitude
      convention-sensitive by about an order of magnitude. Memory is reported
      only as whole-process peak RSS; the reorganized side's ~3.21 MB against the
      direct side's ~69.9 KB, a 46x ratio, belongs beside the 0.044 figure under
      the target-result-profile cost-honesty requirement and is derivable but
      untabulated. NO struck-claim violation appears anywhere: the validator's
      substantive sweep found every hit to be a disclaimer stating the
      prohibition, checked for implicit extrapolation and found none, and
      independently confirms the dispatching session's keyword sweep.
      CAND-601-B remains a cofactor-class candidate under
      docs/target-result-profile.md and nothing here changes that ranking.
    - >-
      THE REFERRED DEFECT RULINGS ARE ACCEPTED AS THE VALIDATOR MADE THEM.
      D-701-1 (the producer did not transcribe the script's output, having no
      execution tool, and correctly refused to fabricate one under AGENTS.md rule
      9) is DISCHARGED BY SUBSTITUTION AT A HIGHER STANDARD: an independent
      session re-executed the script and independently recomputed every fact, and
      the ruling explicitly does not rest on the dispatching session's own run.
      The gate's letter stays unmet and is RECORDED rather than back-dated; the
      note is NOT edited, because records are immutable. D-704-1 (two source
      files carry no per-artifact inference block) is ACCEPTED FOR BATCH-002 on a
      verified rather than assumed basis — the validator recomputed both digests
      from the committed blobs and confirmed each matches the digest asserted
      inside the manifest carrying the covering inference block, so provenance is
      bound by CONTENT, not proximity — and retroactive enforcement is refused
      because it would fail two producers against gates they were never given,
      which is a post-hoc criterion change. The validator's recommendation of a
      PROSPECTIVE protocol_amendment is taken up and ranked in the next action.
    - >-
      NOTHING IN THIS BATCH IS UPGRADED IN KIND. A repaired instrument and a
      passing derivation check are REPRODUCIBILITY and DERIVATION facts; neither
      may become empirical cryptanalytic evidence about AES. The GATE-601-B
      numbers are properties of two implementations written inside
      TASK-20260731-703 on a toy cipher that is explicitly not AES. Claim tier is
      toy throughout, ceilinged by RQ-AES-001 and GOAL-AES-001. No literature
      comparison, recalled baseline, sota_delta, bit-margin or extrapolation from
      the struck CAND-601-B material enters this decision or EV-AES-002 in any
      form.
    - >-
      NO ADVERSE TRANSITION IS TAKEN THAT WOULD REQUIRE AN UNARCHIVED REFUTATION
      ARTIFACT. This decision does not weaken or reject_scoped any hypothesis —
      none exists — and does not close any lane. The one adverse-looking element,
      the withholding of an official closure of the super-box round-independent
      class, is a decision NOT to conclude and needs no artifact. The two facts
      this decision does rely on are archived as a standalone derivation note in
      the ebac9ba8 snapshot, at proof_status: derivation, independently
      re-executed and independently recomputed, and are cited by path.

