      (2) SECOND, an executor task closing ER-6 in a superseding package: the
      one-line build_tasks() change generating final_mix_columns in {False, True}
      for all three key lengths, a re-run demonstrating that the validator's
      regime-confined fault is now DETECTED, an explicit
      (key length x final_mix_columns) coverage-boundary statement written into
