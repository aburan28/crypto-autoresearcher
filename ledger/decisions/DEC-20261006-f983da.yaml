  context: >-
    /design-experiment, one contract, and three new proposals.
    IDEA-20261006-fc2714 is on origin/design/frob-1e54b5-theta and is
    not on origin/main. The question is RQ-JINV-8fc13a. No hypothesis
    or experiment on origin/main cites that full id. The branch
    design/jinv-fc2714 was created from origin/main at
    96d15ed85c00fbbdd6205beb2bdf02099c576fb5 and git merge origin/main
    reported already up to date. The copied proposal bytes have git
    blob 5bc9a97f98ec62096064a40b524fc7f33c17816e.

    The contract freezes p=29, lex-smallest short-Weierstrass models,
    the trace #E-(29+1), orbit means of the Legendre symbol of the
    doubling slope, and the exact threshold 1/10. Success is the
    source idea's prediction that the cross-j maximum is at least
    1/10 while the same-j maximum stays strictly below 1/10. The
    concrete negative is a finished cross-j maximum strictly below
    1/10. No point was enumerated in this session and no mean was
    recorded.

    This session opened KR-RHO-0528e7, KN-TECH-018, KR-RHO-755e35,
    KR-IC-f5c584, KR-RHO-13bf67, KR-RHO-fb88e6, KR-IC-955fd6,
    KR-IC-5a43e5, KR-RHO-53c89f, and KN-OPEN-020. Those rows are not a
    measurement of the character gap.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when a finished cross-j maximum is strictly below 1/10. No field
    required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished cross-j maximum strictly below 1/10 is reachable as a recorded outcome, so success is not automatic.
    - Same-j pairs, raw means, the automorphism equation check, and the Hasse bound are the instrument controls.
    - The same-j gate is a flag that blocks scoring. It does not rewrite a cross-j gap.
    - This session did not enumerate a point and did not claim that the exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers isomorphism representatives over F_29 only. It does not transfer.
    - A gap or its absence is not a change in rho cost.
    - An instrument failure is not a gap below 1/10.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

