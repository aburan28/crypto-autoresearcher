  decision_scope: >-
    EXTERNAL LITERATURE CONFIRMATION: H-PSEUDO is not addressed in any 2024-2026
    IACR ePrint paper. The program has independently identified a new open problem
    in elliptic curve cryptography.

    THE PROGRAM'S CONTRIBUTION after 94 batches:

    PROVED (theorem-backed):
    - Bezout no-go for algebraic factor bases
    - Semaev monodromy universality (C_2^{m-2})
    - GGM incidence/endomorphism closure (Shoup)
    - Betti-Yield duality: H-PSEUDO is exact condition for sub-rho combinatorial ECDLP
    - H-PSEUDO for k=2 MOV-vulnerable curves (Katz-Sarnak)
    - Rigorous O(p^{3/4}) bound on |hat{1_F}(k)| (non-circular, Shparlinski)
    - 8 proof approaches for H-PSEUDO closed for generic curves

    EMPIRICALLY ESTABLISHED:
    - Semaev yield ≤ heuristic at m=2..5 (BATCH-062..071)
    - H-PSEUDO constant C(p) ~ p^{0.079} (BATCH-073..079)
    - Semaev index calculus achievability at p=1009 (BATCH-083)

    NEW OPEN PROBLEM:
    - H-PSEUDO for generic prime-field curves (exact condition for sub-rho ECDLP)

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    BATCH-095: Fresh direction — examine whether the Elliptic Curve Discrete
    Logarithm over EXTENSION FIELDS (E over F_{p^n} with n small) might give
    insights for the prime-field case, or whether the Semaev heuristic for
    extension fields connects to H-PSEUDO for prime fields.

