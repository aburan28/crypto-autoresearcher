coordinator_decision:
  id: DEC-20260907-2a3727
  recorded_at: '2026-09-07'
  context: >-
    EXP-RELN-141a86 has failed Stage 0c's blind structural-recovery gate
    twice for INV-1, INV-7 (p_fail, p_exist), and INV-8 (EV-RELN-b3c6ef,
    EV-RELN-543f9b), both times as resource_exhaustion, with the second
    attempt re-diagnosing the bottleneck as CPU time over tens of millions
    of candidates AT the target complexity level, not memory (peak RSS was
    well under the 13GB cap and still climbing for three of four targets
    when killed at the 6000s wall-clock cap). Neither run reached a
    between-level checkpoint, so no partial progress survived termination.
    The user, asked how to proceed, chose to have a new approach designed
    before further execution rather than picking blindly among a compiled
    enumerator, a longer budget, or the contract's own named
    targeted-minimality-proof alternative.
  decision: revise
  target_ids:
    - EXP-RELN-141a86
    - H-RELN-427bfd
  rationale:
    - >-
      TARGETED-MINIMALITY IS ADOPTED as the next approach, not a longer
      blind budget or a compiled rewrite, for a specific reason read off
      the failure data: both prior runs got stuck WITHIN generation of the
      target complexity level itself (9, 10, or 11), which is the single
      most expensive level by construction (level sizes grow
      combinatorially), while every level BELOW it must have already
      generated successfully en route. Proving no expression at complexity
      strictly below the target matches (minimality), plus a direct,
      cheap construction-and-evaluation of the KNOWN closed form at its
      exact canonical complexity, is therefore a strictly smaller search
      than blind enumeration through the target level itself, and directly
      exploits the diagnostic data already paid for across two runs rather
      than re-running the same expensive step with more resources or a
      rewritten engine (either of which is a real, larger, unproven
      engineering bet).
    - >-
      This is explicitly authorized by the contract and by the prior
      handoff (TASK-20260907-f41930) as a legitimate structural-recovery
      method, methodologically distinct from blind enumeration and
      REPORTED AS SUCH per that handoff's own instruction -- it was simply
      not attempted in either prior run.
    - >-
      The one prerequisite missing from both prior runs is per-level
      CHECKPOINTING (saving each completed complexity level's results to
      disk before starting the next), disclosed as absent in
      EV-RELN-543f9b. This is a genuine, low-risk infrastructure gap, not
      a new scientific claim, and is required so that a future run -- if
      it too hits a wall-clock cap -- preserves whatever levels it did
      complete rather than losing everything, per AGENTS.md's evidence
      discipline.
    - >-
      One asymmetry is disclosed rather than smoothed over: INV-7 p_exist
      (canonical complexity 11, same 6-leaf pack as p_fail) would require
      exhausting complexity <= 10, which includes level 10 -- itself
      larger than the level-9 search that already failed twice on this
      pack. Minimality for p_exist is therefore NOT expected to be
      tractable by this method within one session; the other three targets
      (INV-1 <=8, INV-7 p_fail <=8, INV-8 <=9 on a smaller 4-leaf pack)
      are the ones this approach is expected to actually clear.
  evidence_refs:
    - EV-RELN-b3c6ef
    - EV-RELN-543f9b
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-repair/target-enumeration-raw-results.json
  limitations:
    - >-
      This decision does not authorize a compiled/vectorized enumerator or
      a substantially longer wall-clock budget; both remain named
      candidates if targeted-minimality also fails to clear the gate.
    - >-
      This decision does not resolve INV-7 p_exist's structural recovery;
      it is expected, and explicitly permitted, to remain open after this
      attempt.
    - >-
      A targeted-minimality PASS is a methodologically distinct claim from
      a blind-search PASS (it proves no lower-complexity match exists,
      which is arguably stronger for this specific purpose, but is not the
      literal act the contract's gate text describes); this must be
      reported and reviewed as such, never silently presented as
      equivalent to blind discovery.
  next_actions:
    - >-
      Dispatch the executor per handoff TASK-20260907-6333af: implement
      per-level checkpointing in the enumerator, then attempt targeted-
      minimality for INV-1, INV-7 p_fail, and INV-8; attempt INV-7
      p_exist's minimality only if time remains after the other three,
      and report it honestly as open if not.
    - >-
      If Stage 0c clears for at least the three expected targets, proceed
      to Stage 0d (already valid from RUN-RELN-141a86-stage0bcde) and
      Stage 1, exactly as the prior handoffs already authorized.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a methodological design decision, not an evidence-review
      decision; no new run has executed yet.
  decided_by: coordinator
  decided_at: '2026-09-07'
