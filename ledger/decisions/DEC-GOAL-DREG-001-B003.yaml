coordinator_decision:
  id: DEC-GOAL-DREG-001-B003
  goal_id: GOAL-DREG-001
  batch_id: BATCH-003
  question_id: RQ-DREG-001

  context: >-
    BATCH-002 measured a raw degree-6 deficit of 17947 at n=12 and quarantined it
    as ~89% support-confounded, leaving the genuine support-independent value
    bounded only in [1931, 17947]. BATCH-003 executed CTRL-B, the control the
    BATCH-002 red team itself specified, to pin the exact value.

  decision: weaken
  target_ids: [H-DREG-001, RQ-DREG-001, GOAL-DREG-001, BATCH-003]

  measured_this_batch: >-
    rank(null restricted to sem's 174035-column support) = 156520, exact GF(2),
    full-column over the restricted set (RUN-DREG-001-CTRLB-N12-D6). This equals
    the committed unrestricted null rank, so the 16016 deleted degree-6 columns
    contributed zero pivots and deficit_genuine = 156520 - 138573 = 17947.

  rationale: >-
    Two findings, in opposite directions on the bookkeeping and the same
    direction on the science.

    (1) The BATCH-002 quarantine is LIFTED on its stated ground. 0 of 17947 is a
    support gap, not >= ~89%. The predecessor's column-deletion inequality was
    sound as a worst-case bound but was collapsed to a point estimate at its
    unfavourable endpoint, and the ledger inherited the inverted quantifiers.

    (2) Lifting the quarantine STRENGTHENS the negative result rather than
    opening anything. deficit = sr_pred - rank, so a larger genuine deficit means
    a smaller Semaev ideal, a larger degree-6 quotient (35462 against 17515, a
    factor of 2.02 on the identical column space), and a LATER collapse:
    d_reg(sem) >= d_reg(null) = 7. Groebner solving sits further from rho, not
    closer. The number grew about ninefold and every unit of that growth is
    evidence against the WIN scenario.

    H-DREG-001 accordingly continues to trend reject_scoped for the
    polynomial-solve / sub-rho scenario on the degree axis. It is NOT rejected:
    the decisive completion criterion requires full-column d_reg or gap(n)
    measurements across n in {12,15,18} with >= 3 seeds, and BATCH-003 delivered
    one cell at one degree below d_reg with one seed.

  evidence_refs: [EV-GOAL-DREG-001-B003]
  review_refs:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/VAL-CTRLB.md
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md
  snapshot_commit: 8302c83a
  correction_refs: [CORR-B003-001]

  supersedes:
    - target: ledger/goals/GOAL-DREG-001.yaml checkpoints[BATCH-002].summary
      was: >-
        "The raw sem-null deficit 17947 is CONFOUNDED and quarantined ... >= ~89%
        of 17947 is a degree-6 support gap, not syzygies. Genuine
        support-independent deficit >= 1931 (exact value in [1931, 17947])."
      now: >-
        Measured by CTRL-B: 0% is support gap. deficit_genuine = 17947 exactly.
        The bound was correct as a bound; the ~89% figure was its unfavourable
        endpoint read as an estimate.
    - target: DEC-GOAL-DREG-001-B002 rationale
      was: 'the genuine signal is O(10^3)'
      now: 'the genuine signal is 17947, i.e. O(10^4) and equal to the raw headline'
    - target: commit 6a141ed4 subject line
      was: 'D6 deficit is ~89% support-confounded'
      now: >-
        Superseded in text only; the commit stands unrewritten per AGENTS.md
        rule 4. This decision is the correction of record.

  limitations: >-
    One cell (n=12, t=3, ti=0, seed=2026, D=6), one seed, one target, one degree,
    below d_reg. No confidence intervals. Not d_reg itself. Toy tier,
    certificate_kind none. No distinct-engine re-rank was performed, so Validator
    CAVEAT-2 is inherited by name: the integer is hash-bound, coverage-audited,
    carrier-audited and resume-verified, but NOT independently reproduced. Per
    RT-CAV-B3-2 the endpoint result was close to a theorem, so "landed in the
    pre-registered bracket" is weak corroboration, and the genuinely open window
    was [153863, 156520], not the pre-registered [140504, 156520]. Nothing here
    is a cryptanalytic result at any scale.

  process_notes:
    - >-
      CORR-B003-001 supersedes a factually wrong SCOPE NOTE in snapshot commit
      8302c83a: the Coordinator queried archive.commit_paths, received None, and
      asserted that the queue declared no commit paths. commit_paths is a
      task-level key carrying 9 entries. Caught by VAL-CTRLB CAVEAT-B003-V2.
    - >-
      The declared snapshot_commit_receipt.json was omitted from 8302c83a and
      added in ed07195b; chunk-coverage.log was committed without being declared
      and is retained with SNAP-DEV-2 recorded. Declared-vs-committed now
      reconciles with no gaps.
    - >-
      Model policy: every BATCH-003 artifact records requested_policy,
      resolved_model claude-opus-5, and fallback_used true. Claude Code cannot
      resolve the GPT-5.6 aliases; this is explicit, non-silent fallback per the
      CLAUDE.md model policy note. reasoning_effort is recorded as unavailable
      rather than guessed. BATCH-002's run manifests carry no inference block at
      all; that gap is not retroactively filled.

  knowledge_promotion:
    status: proposed_deferred
    reason: >-
      Two candidates are genuinely transferable, but per the GOAL-DREG-001
      ISOLATION note this campaign does not mint shared knowledge IDs on main;
      they are handed to the Coordinator-of-record at merge rather than recorded
      as not_warranted.
    candidates:
      - kind: KN-TECH
        title: "Worst-case bounds are not point estimates: the endpoint-collapse error in confound quantification"
        content: >-
          A column-deletion bound rank >= r - g correctly bounds a confound's
          maximum contribution. Reporting its unfavourable endpoint as the
          confound's size inverts the quantifier and can misstate the result by
          the full width of the interval. Here it converted a fully genuine
          17947 into "at most ~11% genuine", and the inversion propagated from a
          review verdict into a goal record, a decision rationale and a commit
          subject before the specified control refuted it in one run.
      - kind: KN-FIND
        title: "Support-matched nulls for boolean Semaev may not be constructible by randomization"
        content: >-
          A per-equation variable-support-matched null reaches 190049 of 190051
          degree-6 columns at n=12, so randomization does not produce a
          support-confined comparison system. Restricting the full-support null
          into the Semaev system's own column space is the available substitute,
          and it compares against a projection rather than a support-confined
          system (RT-CAV-B3-5).

  next_actions:
    - >-
      Execute TASK-20260727-DREG-CTRLB-D5-P1 (RUN-DREG-001-CTRLB-N12-D5): rank of
      the null D5 Macaulay matrix restricted to sem's 46717-column D5 support
      (8738 deleted). Pre-registered discriminating prediction: rank = 29418
      exactly, deficit_genuine(D5) = 1322. Any rank < 29418 falsifies
      "column deletion is rank-free here", makes the D6 endpoint an anomaly, and
      simultaneously quarantines the whole D5 series. At ~175 MiB dense it is
      also the first affordable distinct-engine check, which would close
      Validator CAVEAT-2. Budget 900 s / 4 GB / 2 runs.

  decided_by: coordinator
  decided_at: "2026-07-26"
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: claude-opus-5
    fallback_used: true
    reasoning_effort: "unavailable - not exposed by this runtime; recorded as unavailable rather than guessed"
