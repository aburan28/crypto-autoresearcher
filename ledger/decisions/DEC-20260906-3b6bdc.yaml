coordinator_decision:
  id: DEC-20260906-3b6bdc
  context: >-
    /review-evidence cycle for the completed run package at
    experiments/EXP-ARGON-2608c2/ (GOAL-ARGON-001 / BATCH-ba7b2f /
    TASK-20260812-300522 / H-ARGON-ef2f0b), snapshot-committed at
    1977b5ae83ebfe2a849c3ef6d9a6ccb7a2effecd (content_verified). The frozen
    contract's REQUIRED `bcf891_independent_known_family_calibration`
    exact-tier gate -- binding, per its own text, "at every exact_tier_size"
    for BOTH calibration families before any Argon2 G_real/G_unif graph may
    be constructed -- certified 5 of 6 required cells inside [1.0, 1.5] but
    did not certify family_A_doubling_graph at exact_tier_size=64 (CBC
    time-limit incumbent; true ratio bracketed [1.235, 4.20]). The Executor
    halted before any Argon2 construction, per the gate's binding, and no
    rho, KS, or seed-consistency data exists anywhere in this run set. Full
    independent re-verification in EV-ARGON-43acd9 and
    experiments/EXP-ARGON-2608c2/analysis.md.
  decision: pause
  decision_scope_note: >-
    Pauses the EXP-ARGON-2608c2 / H-ARGON-ef2f0b experiment LANE only.
    GOAL-ARGON-001.yaml's `status` field remains `active` throughout, per
    CLAUDE.md rule 10 ("Goals are never paused") -- the impediment is
    recorded on the still-active goal record (IMP-1) rather than encoded as
    a goal-status transition. This decision does not close a lane in the
    agents/coordinator.md "Closure gate" sense (a concrete unblock path
    exists; see next_actions), so no `obstruction` block is required on
    EV-ARGON-43acd9.
  target_ids:
    - GOAL-ARGON-001
    - BATCH-ba7b2f
    - EXP-ARGON-2608c2
    - H-ARGON-ef2f0b
    - TASK-20260812-300522
    - EV-ARGON-43acd9
  rationale:
    - >-
      VALIDITY INDEPENDENTLY RE-CHECKED, NOT ACCEPTED ON THE EXECUTOR'S
      REPORT ALONE. All 6 planned calibration_exact_tier runs are present
      and schema-complete; raw-result.json, manifest.yaml, and
      execution_report.md agree exactly cell-by-cell (see analysis.md
      Section 0's table); RNG-seed absence is correctly accounted for
      (both calibration families and the greedy heuristic are
      deterministic); a brute-force re-derivation at q=16, independent of
      both the greedy heuristic and the ILP solver, reproduces both
      families' exact minimum removal sizes exactly (family_A: 5,
      family_B: 1). Exhaustive search of every run artifact for any
      reference to argon2/G_real/G_unif/rho/KS found none: the
      calibration gate's procedural ordering was genuinely honored.
    - >-
      THE GATE'S OWN TEXT ADMITS NO PARTIAL-CREDIT READING. specification.
      yaml's stopping_rules (first entry) requires certification "for
      family_A_doubling_graph OR family_B_pure_chain at ANY exact_tier_
      size" failing to trigger a halt -- equivalently, ALL SIX cells must
      certify before any Argon2 construction. 5/6 certifying is not 6/6;
      the Executor's halt is the contractually correct response,
      independently confirmed here.
    - >-
      THE UNCERTIFIED CELL IS A GENUINE TOOLING-TRACTABILITY FINDING, NOT
      AN IMPLEMENTATION DEFECT. Three independently attempted ILP/B&B
      formulations (naive big-M, lazy cutting-plane, two from-scratch
      branch-and-bound variants) all converge on the same qualitative
      picture: family_A_doubling_graph's many-overlapping-path structure
      produces a weak LP relaxation that open-source CBC 2.10.3 cannot
      close within a 150s (or 300s diagnostic) budget at q=64, despite
      closing cleanly at q=16 and q=32. This is disclosed in full in
      implementation.md and independently re-read here, not taken on
      trust.
    - >-
      NONE OF THIS BEARS ON H-ARGON-ef2f0b IN EITHER DIRECTION. No
      G_real/G_unif Argon2 graph was ever constructed for any variant, at
      any (t, q); no rho value, KS statistic, or seed-consistency check
      exists anywhere in this run set. Per AGENTS.md rule 3, a
      resource-exhaustion/procedural halt is never negative evidence
      against a hypothesis -- and here that rule is not even the binding
      one, because there is no positive-direction reading either: the
      hypothesis's subject matter was simply never brought into contact
      with data. `direction: neutral`, `strength: inconclusive` on
      EV-ARGON-43acd9 is the schema-honest label
      (docs/evidence-and-reproducibility.md: "data do not distinguish the
      relevant explanations" -- true here because there is no discriminating
      data of any kind, not because the data are ambiguous).
    - >-
      NO CERTIFICATE OR REFUTATION-ARTIFACT DISCIPLINE IS ENGAGED. Every
      run manifest correctly carries `certificate: {kind: none}}` (pure
      measurement, docs/claims-and-verification.md); no solve or relation
      is claimed anywhere in this run set, so the certificate-discipline
      requirement is inapplicable. Likewise, docs/claims-and-verification.
      md's "Refutation artifacts" ladder (counterexample certificate ->
      derivation note -> declared empirical_only) governs an ADVERSE
      transition resting on a result that speaks to a hypothesis's
      prediction; nothing here speaks to H-ARGON-ef2f0b's prediction in
      either direction, so `proof_status: not_applicable` on EV-ARGON-43acd9
      is correct and this decision does not attempt to force a rung of that
      ladder onto a record that has nothing to refute.
    - >-
      `decision: pause` ON THIS LANE, NOT `refine` OR A SILENT RE-DISPATCH,
      BECAUSE THE SAME GATE DESIGN IS PLAUSIBLY GOING TO FAIL AGAIN FOR THE
      SAME REASON. family_A_doubling_graph's removal-set size and solve
      time both grow sharply from q=16 (5, 5.3s) to q=32 (8, 39.3s) to the
      q=64 wall; re-dispatching the identical calibration_exact_tier stage
      unchanged would very plausibly spend another full run set to
      rediscover the same tooling limit. This is a scheduling/tooling
      impediment (GOAL-ARGON-001 IMP-1), not a decision that "no route
      remains" -- three concrete unblock routes are named in next_actions,
      so no `obstruction` block is required per the closure gate's own
      scope (agents/coordinator.md).
  evidence_refs:
    - ledger/evidence/EV-ARGON-43acd9.yaml
    - experiments/EXP-ARGON-2608c2/analysis.md
    - experiments/EXP-ARGON-2608c2/execution_report.md
    - experiments/EXP-ARGON-2608c2/implementation.md
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-294e74/raw-result.json
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-868a32/raw-result.json
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-2ba6b8/raw-result.json
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-4da88e/raw-result.json
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-1a1711/raw-result.json
    - experiments/EXP-ARGON-2608c2/runs/RUN-ARGON-2608c2-e0b77a/raw-result.json
  limitations:
    - >-
      This decision asserts nothing about Argon2, RFC 9106,
      H-ARGON-ef2f0b's mechanism, HEUR-001, or HEUR-002. The hypothesis's
      status is left `specified` (unchanged): no data exists that could
      move it toward `supported`, `weakened`, or `rejected`, in either
      direction.
    - >-
      claim_tier: toy throughout (calibration graphs at q<=64). This
      decision makes no claim about any larger scale, any different solver,
      or any longer time budget than the ones actually used.
    - >-
      The true minimum removal size for family_A_doubling_graph at q=64 is
      known only to lie in [5, 17]; this decision does not narrow that
      bracket or assert which endpoint is more likely.
    - >-
      Whether a stronger ILP formulation or a commercial solver would in
      fact close the q=64 gap is untested by this run set (three
      formulations were tried and rejected, not exhausted). KN-OPEN-9c41af
      records this as an open question rather than asserting an answer.
  next_actions:
    - >-
      GOAL-ARGON-001.yaml IMP-1 recorded (impediments block, goal stays
      `active`): clears on (a) a structure-specific exact algorithm or a
      stronger ILP formulation for family_A_doubling_graph that exploits
      its log-degree, doubling-distance structure (the generic tight-M
      MILP used here does not); (b) a commercial ILP solver (Gurobi/CPLEX)
      becoming available in this environment; or (c) a Coordinator-
      approved, VERSIONED protocol_amendment to EXP-ARGON-2608c2 narrowing
      family_A_doubling_graph's exact_tier_sizes to a value that reliably
      certifies (e.g. 48), with q=64 demoted to the informational
      greedy_tier -- never a silent contract change, and never a bare
      re-dispatch of the unchanged gate (see rationale above).
    - >-
      KN-OPEN-9c41af filed: crystallizes the reusable tooling-gap question
      (no available exact/near-exact open-source solver for minimum
      depth-reducing vertex-deletion sets on sparse, log-degree,
      doubling-distance DAGs at n~64) so a future goal calibrating a
      similar depth-robust reference family does not rediscover this wall
      from scratch.
    - >-
      No experiment is re-dispatched by this decision. The next concrete
      step under GOAL-ARGON-001 is a Coordinator (or Idea Generator, for
      formulation ideas) choice among IMP-1's three unblock routes, not an
      automatic re-run.
  knowledge_promotion:
    promoted: [KN-OPEN-9c41af]
    not_warranted: null
  decided_by: coordinator
  decided_at: '2026-09-06'
  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    reasoning_effort: high
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one
      model the session runs on. Recorded, never silently substituted
      (AGENTS.md rule 11 / CLAUDE.md "Model policy note").
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: No adapter probe receipt exists for this session.
