coordinator_decision:
  id: DEC-20260821-b1a7b4
  context: >-
    GOAL-MD5-001, BATCH-af29f6 (batch 4 of 7, the method-ceiling audit).
    TASK-20260821-420070 (idea-generator) produced IDEA-20260821-e46061: a
    Round-1-restricted (16-step), two-free-word splice-and-cut MITM
    partial-preimage instrument against MD4 (control, split S=9, free words
    word8/word9, bounded scale k1=k2=10, m=12, k=20), with a paired H1
    heuristic-validation experiment in the same batch, and an explicit
    decision to NAME a concrete MD5-specific step: the identical bounded
    instrument applied to MD5's own Round-1 constants
    (md5_specific_step_decision.decision: NAMED). This is
    TASK-20260821-a288f8, the Coordinator's own dispatch-gate act
    (coordinator.md "Proof-oriented dispatch gate" / KN-TECH-080), applying
    the four mandatory audits plus GOAL-MD5-001's next_action MD5-scope
    restriction. Requested policy coordinator-orchestration-code, resolved
    model claude-sonnet-5, no fallback, no Bedrock (SC-8).
  decision: approve
  target_ids:
    - IDEA-20260821-e46061
    - H-MDFIVE-bf7767
    - EXP-MDFIVE-88f7d1
  rationale:
    - >-
      KN-TECH-080 audit 1 (bottleneck + baseline embedding): the named
      bottleneck (which interior split points keep a free word available)
      is decision-changing and genuinely established, not a placeholder --
      the idea reproduces the exact word-usage pattern by direct
      line-by-line reading of both RFC texts this session (RFC 1321 local
      full text, RFC 1320 via WebFetch), confirms the identical Round-1 F
      function textually, AND runs a negative control by hand (a full-round
      chunk leaves no free word at all), which is exactly the kind of check
      that catches a paper-thin baseline claim. Symbolic verification
      satisfies KN-TECH-080's "symbolically or with a frozen regression
      fixture" clause. The one honestly-flagged gap (RFC 1320's WebFetch
      transcript is not yet sha256-pinnable) is disclosed as an open
      acquisition item, not silently absorbed, and is carried into this
      contract's invalidation discipline for the Executor to close before
      citing it as a frozen input.
    - >-
      Audit 2 (observation-collision): the matching-window observable is
      named, and the idea does not merely assert identifiability -- it
      computes and states in advance the EXPECTED collision rate (birthday
      heuristic: ~256 matching-window hits per target, ~1 expected to also
      satisfy the full 20-bit target) and commits to reporting both counts
      independently rather than inferring the full-target result from the
      matching-window filter alone. This is a genuine collision search with
      a stated, falsifiable prediction, not a gap papered over.
    - >-
      Audit 3 (quantifier order): explicit EXISTS-per-fixed-target
      statement, explicitly contrasted with a forbidden universal
      ("for all targets") reading, and explicit acknowledgment that the
      witness (word8,word9) may depend on the target instance. Clean.
    - >-
      Audit 4 (method ceiling + nearby-object control): the
      strongest_certifiable_claim is tightly scoped (20-bit slice only,
      explicitly disclaiming full 48/64-step MD4/MD5 and the literature's
      2^96/2^102/2^116.9/2^123.4 figures). The MD5 nearby-object control
      names the IDENTICAL bounded instrument and the EXACT two RFC
      1321-named hardening changes (shift amounts, per-step constants) as
      the sole substitution, states the null-hypothesis prediction (R in
      [0.5,2.0]) BEFORE any run, and pre-commits that a surprising result
      needs a null-constant-control replication before being credited. This
      is a real method-ceiling audit with a pre-registered expectation, not
      a claim tuned after the fact.
    - >-
      Roadmap-bias pairing rule (CLAUDE.md / coordinator.md "Target result
      profile"): HEUR-H1 (the conditional dependence the whole matching-window
      argument rests on) is paired with a heuristic-validation experiment
      IN THE SAME BATCH (this contract's H1 sampling run, N targets,
      chi-square + tail check against the predicted Poisson distribution),
      not deferred, and is paired with a proof-of-concept implementation
      task (TASK-20260821-de817d builds the standalone MD4/MD5 Round-1
      module and runs it to a literal certificate) in the same batch. HEUR-H3
      (the untested extrapolation to larger k1,k2) is honestly left
      unvalidated and named as future work rather than smuggled in as
      confirmed.
    - >-
      Goal-scope compliance (GOAL-MD5-001.yaml next_action): the idea's
      md5_specific_step_decision NAMES a concrete MD5-specific step
      (decision: NAMED) and states its exact parameters as IDENTICAL to the
      MD4 run in every respect but the target primitive's shift/constant
      table -- exactly the form of MD5 run the next_action's escape clause
      permits, and exactly the form this gate is authorized to approve. The
      framing is explicitly a pre-declared null-hypothesis control (not an
      attack attempt), with the expected outcome stated in advance so a
      controlled null cannot later be spun as a positive finding.
    - >-
      Claim-ceiling honesty: the idea and the frozen contract both state,
      repeatedly and consistently with batch.yaml's own claim_ceiling, that
      this work cannot exceed `analyzed` -- none of CLAUDE.md's four
      `supported`-promotion gates (proof decomposition, validated numbered
      heuristics, concrete honest-cost table, independent review-xhigh +
      red-team pass) can be jointly satisfied by one bounded-scale batch,
      and the contract records this explicitly rather than rounding up.
    - >-
      Gate discipline: this decision freezes the idea's proof_search_map and
      md5_specific_step_decision essentially as proposed rather than
      rewriting them to force a pass (per the hard rule against authoring
      the science at the gate) -- the only Coordinator additions are the
      concrete, deterministic, pre-registered seed/generation procedure
      (fixed_before_acquisition discipline, matching this goal's BCP-2
      precedent) needed to make "fixed before any run" checkable, and an
      explicit statement that the declared bounded scale (k1=k2=10) is kept
      at the idea's proposed floor rather than scaled up, since scaling the
      design is a science decision this gate declines to make unilaterally.
  evidence_refs:
    - IDEA-20260821-e46061
    - KN-TECH-080
    - docs/inventor-protocol.md (section 8)
    - GOAL-MD5-001.yaml (next_action MD5-scope restriction)
    - coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/batch.yaml (de817d_sub_budget)
  limitations:
    - >-
      This is a 0-run design-and-gate decision: no run has executed yet. The
      approval licenses TASK-20260821-de817d to execute; it is not itself
      evidence about MD4, MD5, or HEUR-H1/H2.
    - >-
      RFC 1320's raw text remains un-sha256-pinned in this program's corpus
      (WebFetch acquisition only). The Executor must close this before the
      run manifest cites it as a frozen input; this decision does not treat
      it as closed.
    - >-
      The MD5-side run authorized here is a single, identically-bounded
      nearby-object control -- it is not, and must not be reported as,
      evidence about full MD5's preimage resistance in either direction. A
      surprising R outside [0.5,2.0] is a reportable finding requiring a
      null-constant-control replication that is explicitly NOT authorized or
      budgeted by this contract.
    - >-
      The declared bounded scale (k1=k2=10) is deliberately not scaled up by
      this gate, even though the idea itself flags it as likely
      under-using the 300 s ceiling by orders of magnitude; a larger-scale
      replication (HEUR-H3's validation route) is left as an explicit open
      direction for a future batch, not decided here.
  next_actions:
    - >-
      Driving session dispatches TASK-20260821-de817d (executor) against the
      frozen EXP-MDFIVE-88f7d1 contract: build the standalone MD4/MD5
      Round-1 module, run the MD4 primary certificate search, run the H1
      heuristic-validation sampling run, and execute the conditional MD5
      nearby-object run under this contract's md5_run_authorization, all
      within the declared 1800 s de817d sub-budget and per-run 300 s
      ceilings.
    - >-
      TASK-20260821-f2093f (isolated content_first snapshot) stages the
      idea, this gate decision, and the frozen H/EXP contract alongside the
      Executor's implementation, run, and cost-scaling artifacts once
      de817d completes.
    - >-
      TASK-20260821-67a1b6 (red team) and TASK-20260821-1601d6 (validator)
      run concurrently, sibling-blind, under
      review-plan/review-plan-67a1b6.yaml, checking (among other joints)
      whether this gate's approval actually enforced the four KN-TECH-080
      audits and the MD5-scope restriction.
    - >-
      A future batch, if warranted by a surprising R, should design and
      budget the null-constant-control replication named in this contract's
      md5_run_authorization.explicitly_out_of_scope_this_contract, and
      separately consider HEUR-H3's validation route (larger k1,k2
      checkpoints) as its own bounded task.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a dispatch-gate/approval decision on a design proposal, not an
      evidence-review decision closing an experiment: no run has executed,
      so there is no `replicated`/`strong` evidence strength to promote from
      yet. Knowledge promotion is deferred to the evidence-review decision
      that follows TASK-20260821-de817d's execution and independent review
      (rank 6/7 of this batch).
  decided_by: coordinator
  decided_at: '2026-08-21'
