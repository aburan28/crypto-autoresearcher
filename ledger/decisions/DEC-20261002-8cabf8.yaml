    - id: R-DECLARED-GROUPS
      subject: the excluded groups (RV-6), for the producer and for every reviewer
      ruling: >-
        EXCLUDED: every group isomorphic to the group of a declared cell of
        EXP-BINSTD-c9c8a2 or EXP-BINSTD-811a2e. The version-3 declared cells
        are CELL-K13 (order 8012 = 4 x 2003), CELL-K19 (4 x 130873), CELL-K23
        (4 x 2095853), CELL-K41 (4 x 549756390943), CELL-K17C (4 x 137 x 239),
        CELL-O19 (2 x 261823), CELL-RC1 (4 x 32603), CELL-Z-2003,
        CELL-Z-130873, CELL-Z-2095853, CELL-Z2 (Z/2^17), CELL-ZS16
        (Z/(16 x 2003)), CELL-ZS64 (Z/(64 x 2003)), and ISO-K13 to ISO-K41 and
        ISO-O19 (Z/(4 l) on the four Koblitz primes and Z/(2 x 261823)), as the
        version-3 specification's cells block states them. The ISO cells are
        isomorphic to the curve groups, which is how version 3's C-5 fired
        TB-4. OPERATIONAL RULE: no bucket gain, shuffle, null draw, estimator,
        rule rate, decision clause or dry call on a group whose order is
        divisible by 2003, 130873, 2095853, 549756390943, 261823, 32603, 137 or
        239; on Z/2^17; or on any elliptic curve over F_(2^n) with n in 13,
        17, 19, 23 or 41; and none on any further cell version 4 declares (the
        producer lists them and the rule extends). PERMITTED: groups of the
        declared shapes on other primes (Z/(4 l') or Z/(2 l') with l' an
        adjacent non-declared prime; Z/2^k with k other than 17), synthetic
        labels, non-declared toy curves over F_(2^n) with n outside that set.
        CARVE-OUTS: label-class enumeration on the declared curve cells (the
        exact-quotient and degeneracy audits, Stage 0, orders and
        factorisations) and the stage3 name-grid dry call with synthetic
        statistics. The rule is stricter than "not a declared cell" on
        purpose: a stream label or an isomorphic copy is not a different cell
        (DEC-20260929-585602 SD-2). ISO-K13 and CELL-ZS16 may stay declared
        cells (RV-6).

