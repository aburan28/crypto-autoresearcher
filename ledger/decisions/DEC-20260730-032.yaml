coordinator_decision:
  id: DEC-20260730-032
  batch_id: BATCH-016
  goal_id: GOAL-ECDLP-001
  archived_by: TASK-20260730-040
  decided_by: coordinator
  decided_at: '2026-07-30'
  decided_at_precision: >-
    DATE ONLY. The session recording this decision has NO SHELL, no interpreter,
    no git and no clock access. It ran no command, made no commit, staged
    nothing and verified nothing. Every commit identifier and every sha256 it
    cites is TRANSCRIBED from a committed receipt or from an independent review
    report that states it checked the value against Git object content, and is
    labelled as transcribed. NO FIGURE IS FABRICATED AND NO VERIFICATION IS
    CLAIMED THAT WAS NOT PERFORMED BY THE SESSION THAT PERFORMED IT.

  context: >-
    BATCH-016 dispatched CTRL-RT034-A ALONE - the mutation test of the CTRL-4
    assertion - as a single Executor card plus the standard archive-and-review
    chain, on the pre-registered ruling RULE-BATCH016-SCOPE and on the authority
    of BUDGET-AMEND-20260730-001. The card re-ran the CTRL-4 assertion, WITH THE
    CHECKER CODE COPIED BYTE-VERBATIM FROM THE COMMITTED BATCH-015 PROBE DRIVER
    AND NOT REIMPLEMENTED, against one unmutated baseline and four mutated
    inputs at B = 192 on CURVE-J12S1. The seven-artifact package was
    snapshot-archived alone at 1454d2bebe84d14b1c84a02ebe46598f064e497f and that
    snapshot was accepted. Two independent non-originating sessions then
    reviewed it: the TASK-20260730-038 validator returned `passed` with
    blocks_ledger_record false, and the TASK-20260730-039 red team returned the
    Executor card CLEAN on execution with HIGH-severity objections to the
    INFERENCE a successor would draw, together with an executed counterexample
    set. THIS DECISION CARRIES THE PRE-REGISTERED SCOPE RULING INTO THE LEDGER,
    RECORDS THE BRANCH DETERMINATION, ADOPTS BOTH REVIEWS IN FULL INCLUDING
    THEIR DISSENTS AGAINST THEMSELVES, RECORDS THE DISPOSITION OF CTRL-4 THAT
    THE PRE-REGISTERED CONSEQUENCE REQUIRES, AND STATES WHAT BATCH-016 DOES AND
    DOES NOT ESTABLISH.

  # ------------------------------------------------------------------- decision
  decision: refine

  decision_label_source: >-
    docs/task-lifecycle.md section 9, where `refine` means improve the mechanism
    or the experiment. The precedent in this lane is DEC-20260729-004 and
    DEC-20260730-031, the latter of which closed BATCH-015 `refine` on a finding
    about a control rather than about the object. THE LABEL IS USED FOR THE SAME
    KIND OF OBJECT HERE, one step further on: what this batch bought is a
    CHARACTERISATION of the contract's own control, a decided disposition for
    it, and an amendment to the method by which assertion-style controls are
    accepted - not a property of the object the contract was built to study.

  decision_in_one_sentence: >-
    THE MUTATION TEST EXECUTED CLEANLY AGAINST A BYTE-VERBATIM COPY OF THE
    COMMITTED CHECKER AND ITS TWO SCORED CASES FAILED AS REQUIRED, WHICH
    ESTABLISHES THE ONE BIT THAT THE CHECKER IS NOT VACUOUSLY ALWAYS-PASS; BUT
    TWO INDEPENDENT REVIEWERS, EACH WITH ITS OWN POSITIVE CONTROL, SHOWED BY
    EXECUTABLE PROBE THAT "CTRL-4 CATCHES LAYOUT BREAKS" IS FALSE AS STATED, SO
    THE BATCH REFINES THE INSTRUMENT AND THE METHOD - CTRL-4 IS REWRITTEN AND
    DEMOTED FOR SUCCESSOR CONTRACTS AND THE MUTATION-TEST PRACTICE IS AMENDED -
    RATHER THAN ESTABLISHING ANY PROPERTY OF THE OBJECT.

  decision_label_justified_against_every_alternative:
    support: >-
      REJECTED, AND THIS IS THE REJECTION THAT MATTERS MOST BECAUSE IT IS THE
      ONE A SUCCESSOR WILL BE TEMPTED INTO. `support` would require evidence
      raising confidence in a hypothesis. EV-STR-006's direction is `neutral`
      and its strength is `preliminary`; it bears on no hypothesis in this
      ledger. Reading "the baseline passed, cases 2 and 3 failed as required,
      the checker works" as a clean bill of health is EXACTLY the over-reading
      the red team was dispatched to catch, and it caught it: eight mutations
      the same checker misses, one of them a factor base that is 59 percent
      non-points. A TWO-CASE FAIL ON DEDUCIBLE MUTATIONS IS NOT SUPPORT FOR
      ANYTHING.
    weaken: >-
      REJECTED. `weaken` would assert new evidence lowering confidence in
      H-STR-002. NOTHING HERE BEARS ON H-STR-002 IN EITHER DIRECTION - the card
      measures no alpha, no rank, no yield, no supply and no cost, and invokes
      no closure - and H-STR-002 is ALREADY `weakened` on DEC-20260727-009's
      grounds, which are untouched. Queue rule N-1 forbids the movement
      independently. Note also what would be misdescribed: what this batch
      found is a defect in a CONTROL'S ADVERTISED POWER, not a refutation of any
      mathematical claim - phi is still an automorphism and the constructor
      still emits whole orbits.
    reject_scoped: >-
      UNAVAILABLE ON TWO INDEPENDENT GROUNDS, EITHER OF WHICH SUFFICES.
      (1) agents/coordinator.md forbids `reject_scoped` on a single
      unreplicated empirical-only run set outright, and this is one execution on
      one host with one realisation per case. (2) Queue rule N-6 forbids it to
      this batch by name. It is also not the right shape: the thing being
      rejected - the reading "CTRL-4 catches layout breaks" - is a statement
      about an instrument, and its refutation artifacts are archived in this
      same commit.
    inconclusive: >-
      REJECTED AS UNDERSTATING, AND THE REASON IS RECORDED RATHER THAN ASSERTED.
      `inconclusive` is the required outcome where the evidence CANNOT
      DISCRIMINATE BETWEEN EXPLANATIONS. That is not this situation. Three
      things are discriminated, and sharply. (a) The checker is NOT vacuously
      always-PASS: cases 2 and 3 failed via condition (ii) with condition (i)
      passing, the alternative that its inner loop never executed or its
      polarity was inverted is excluded, and D-6, D-7, D-9 and the validator's
      F[4] + 1 control fail it independently. (b) The checker IS blind to
      on-curve membership, distinctness, orbit disjointness, provenance,
      block-level ordering and the B = 1 (mod 3) tail - measured, by two
      sessions, with positive controls. (c) Condition (i) is live and
      discriminates, settled by D-7. NOTE THE PLACES WHERE `inconclusive` DOES
      BIND AND IS RECORDED AS SUCH: EV-STR-006 UC-B, whether the derivation
      actually requires the properties CTRL-4 does not check, and UC-C, whether
      a control must be justified against reachable states only. Nothing is
      asserted on either.
    approve: >-
      REJECTED AND NOT AVAILABLE. Nothing is approved by this decision. Neither
      review recommends approving anything; the red team names APPROVE AND RUN
      EXP-STR-004 as CTRL-RT039-E and REFUSES IT EXPLICITLY so that its refusal
      is on the record rather than inferred from silence. EXP-STR-004 IS NOT
      APPROVED AND IS NOT EXECUTED, and the successor end-to-end
      structured-solve cost experiment IS NOT APPROVED, NOT FROZEN, NOT
      SCHEDULED AND NOT AUTHORIZED.
    revise: >-
      REJECTED AS MISNAMING THE OBJECT, AND THE CALL IS CLOSER HERE THAN AT
      BATCH-015 SO THE REASONING IS GIVEN. `revise` in this ledger attaches to a
      DELIVERABLE returned for rework. NO DELIVERABLE OF BATCH-016 IS DEFECTIVE:
      the mutation package is honest, in scope, byte-verified, reproducible and
      free of claim-ceiling breach, and both reviews say so - the red team
      states in terms that the Executor card is clean and that its objections
      are to the inference and not to the execution. What is being changed is a
      CONTROL INSIDE A FROZEN, UNAPPROVED CONTRACT and the METHOD by which
      assertion-style controls are accepted. That is refinement of the
      instrument and of the protocol, not rework of a submission. THE ONE
      DEFECTIVE ARTIFACT DETAIL - command.txt's prose dirty count - IS
      SUPERSEDED AT EV-STR-006 O-12 AND IS TOO SMALL TO CARRY A LABEL.
    replicate: >-
      REJECTED AS THE WRONG NEXT MOVE. REPLICATING A DETERMINISTIC COMPUTATION
      BUYS NOTHING: the validator already re-executed all five cases in a
      separate process from a separately written script with zero mismatches on
      every verdict, every failing SET and every factor-base digest, and a third
      execution of the same committed bytes on the same platform would reproduce
      the same values INCLUDING THE VACUOUS THIRD OF THE COMPARISONS. What is
      missing is not repetition but a mutation set whose SELECTION is
      adversarial, which R-7 below adopts as practice rather than as a card.
    expand: >-
      REJECTED, AND THE RED TEAM REJECTS THE OBVIOUS EXPANSION AGAINST ITS OWN
      INTEREST. CTRL-RT039-D, an exhaustive sweep of 10^4 random single-element
      perturbations with a PASS-rate statistic, IS REFUSED BY THE REVIEWER THAT
      NAMED IT, on the ground that the answer is already a theorem - a
      single-element perturbation at index 3j + k is caught unless the new value
      equals zeta3^k * F[3j], so the catch rate is 1 - O(1/p) and the sweep
      would report the size of the field and nothing about the control. I ADOPT
      THAT REFUSAL. THE INFORMATIVE MUTATIONS ARE THE STRUCTURED ONES AND THEY
      MUST BE CONSTRUCTED, NOT SAMPLED.
    pause: >-
      REJECTED. Nothing is exhausted. campaign_budget.maximum_batches stands at
      50 on the user's authorization with sixteen consumed; no pause condition
      fires on this record; there IS an auditable, bounded, zero-compute next
      action within budget; and its expected information gain is not low - it is
      the cheapest thing that could overturn the disposition this decision
      takes. THE GOAL STAYS `active`.
    supersede: >-
      REJECTED AS A LABEL, THOUGH THIS DECISION DOES SUPERSEDE TWO THINGS IN
      SUBSTANCE AND SAYS SO. It supersedes the prose comment in the committed
      command.txt (EV-STR-006 O-12) and it supersedes the BATCH-016 opening
      checkpoint in ledger/goals/GOAL-ECDLP-001.yaml, both by recording a
      correction under a new record rather than by any in-place edit. It
      supersedes NO ledger decision and NO evidence record, retracts nothing,
      and reopens neither BATCH-014 nor BATCH-015. Every prior firing, deviation
      and supersession stands unretracted.

