    - id: R-7
      statement: >-
        R-9 IS AMENDED, NOT DISCHARGED. I ADOPT CTRL-RT039-A, THE
        MUTATION-COMPLETENESS RULE, AS BINDING PRACTICE FOR THIS GOAL,
        ALONGSIDE AND NOT IN PLACE OF DEC-20260730-031 R-9. It is a zero-compute
        practice change, it creates no card and consumes no budget, and it is
        recorded here rather than dispatched, exactly as R-9 itself was.
      the_rule_as_adopted: >-
        THE MUTATION SET FOR AN ASSERTION-STYLE CONTROL MUST CONTAIN: (a) AT
        LEAST ONE MUTATION PER PROPERTY THE CONTROL IS CLAIMED TO PROTECT,
        ENUMERATED FROM THE CONTROL'S OWN TEXT; (b) AT LEAST ONE MUTATION
        PRE-STATED TO PASS, SO THE BOUNDARY OF THE CONTROL'S POWER IS RECORDED
        RATHER THAN ASSUMED; AND (c) AT LEAST ONE MUTATION AUTHORED BY A SESSION
        THAT DID NOT AUTHOR THE QUEUE OR THE ASSERTION. Clause (c) is available
        on this harness TODAY AT ZERO MODEL DIVERSITY - it is exactly what the
        TASK-20260730-039 card just did - and it is the cheapest of the three.
      why_it_is_needed_and_the_argument_is_measured_not_asserted: >-
        A CONTROL'S POWER IS CHARACTERISED BY THE BOUNDARY BETWEEN THE MUTATIONS
        IT CATCHES AND THOSE IT MISSES. BATCH-016's pre-registered set reported
        only caught mutations, which is the same error as reporting a signal
        without its null-object control: THE QUANTITY THAT WOULD HAVE DESTROYED
        THE READING - A MUTATION THAT SHOULD BE CAUGHT AND IS NOT - WAS NEVER
        MEASURED BY THE CARD. It was measured by two reviewers within minutes
        once they were asked to look.
      R_9_ITSELF_IS_NOT_DISCHARGED: >-
        NO RECORD MAY STATE THAT R-9 HAS BEEN DISCHARGED, THAT THE MUTATION-TEST
        MITIGATION IS NOW IN FORCE AND SETTLED, OR THAT THE SHARED-MODEL
        INDEPENDENCE LIMITATION IS MITIGATED. BATCH-016 IS R-9's FIRST EXERCISE
        AND AN EXERCISE IS NOT A REPAIR. R-9 CONTINUES TO BIND CONTRACT FREEZING
        AND CONTRACT REVIEW, NOW AMENDED BY THE RULE ABOVE.
    - id: R-8
      statement: >-
        R-9's FIRST EXERCISE IS ASSESSED HONESTLY, AND THE ASSESSMENT IS A
        FINDING IN ITS OWN RIGHT: PARTIALLY SUCCESSFUL, AT THE EXECUTION LAYER
        ONLY. A REAL MITIGATION APPLIED TO THE WRONG HALF OF THE PROBLEM.
      the_half_that_worked: >-
