  # -------------------------------------------------------- branch determination
  branch_determination_recorded_as_the_pre_registered_rule_requires:
    rule: >-
      Pre-registered in the BATCH-016 opening commit, before any card ran: AN
      EVIDENCE RECORD IS WRITTEN IF AND ONLY IF THE TASK-20260730-037 SNAPSHOT
      COMMIT EXISTS AND ITS POST-COMMIT VERIFICATION IS ACCEPTED, AND THE CASE-0
      BASELINE REPORTED PASS. THE RULE IS NOT DECIDED BY THE CONTENT OF THE
      CASE (1), (2) OR (3) OUTCOMES.
    determination: >-
      BRANCH 1. ledger/evidence/EV-STR-006.yaml IS WRITTEN. TASK-20260730-040
      declares eight paths and commits eight; NO DECLARE-THEN-DEVIATE SHORTFALL
      ARISES AND NONE IS RECORDED, BECAUSE NONE OCCURRED.
    basis: >-
      The snapshot exists at 1454d2bebe84d14b1c84a02ebe46598f064e497f with
      parent 42ddd3b8249c921d85ae54e63f35ced7f468ad3e and was ACCEPTED: its
      committed receipt records committed_path_count 7 against the seven
      declared producer paths, reachable_from_head true,
      parent_matches_expected true, changes_exactly_declared_artifacts true,
      scope_expansion none, harness_untouched true, batch015_artifacts_untouched
      true, and independent_hash_confirmation CONFIRMED on all seven paths by
      two independent computations, together with a
      verbatim_checker_confirmation of CONFIRMED_INDEPENDENTLY on the copied
      region digest recomputed from git object content at e3cf9fdd. The
      TASK-20260730-038 validator independently re-derived all seven hashes from
      git object content and reports 7 of 7 MATCH, confirms the receipt lands
      one commit later at 5bc95c8c05e28de5145f959859b46364507a1b52 as
      INT-BATCH007-T predicts, and confirms the eight-path declaration is exact
      as 7 plus 1. The TASK-20260730-039 red team independently confirms the
      snapshot changed exactly the seven declared producer paths and adds that
      the four-batch pattern of committing review artifacts one commit early did
      NOT recur. AND THE CASE-0 BASELINE REPORTED JOINT PASS, ran first, and was
      reproduced cross-process with a byte-identical factor base.
    what_this_determination_is_NOT: >-
      IT IS NOT A JUDGEMENT ON THE MEASUREMENTS AND WAS NOT MADE FROM THEM. Had
      cases 2 and 3 both PASSED - the pre-registered blocking finding - BRANCH 1
      would still obtain and EV-STR-006 would still be written, with the
      blocking finding recorded. Had the card crashed, timed out or exhausted
      disk, BRANCH 2 would obtain, no evidence record would exist, the
      obligation would survive intact, and THAT WOULD BE INFRASTRUCTURE SIGNAL
      AND NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md core rule 5).
    the_tooling_pressure_hazard_answered_for_the_second_time: >-
      tools/research_dispatch.py._validate_ledger_archive requires every
      `ledger` archive to declare at least one ledger/evidence/ path, which
      creates a standing pressure to mint an evidence record to make a declared
      path count come true. EV-STR-006 IS WRITTEN BECAUSE AN ACCEPTED SNAPSHOT
      EXISTS AND THE BASELINE PASSED, AND IT WOULD HAVE BEEN WITHHELD HAD EITHER
      LIMB FAILED, WITH THE SHORTFALL RECORDED AS A DECLARED DEVIATION. NO
      RECORD WAS WRITTEN TO SATISFY A SCHEMA.

  # ----------------------------------------------------------------- rationale
  rationale:
    - id: R-1
      statement: >-
        THE OUTPUT IS VALID AND ADMISSIBLE, AND I CHECKED VALIDITY BEFORE
        INTERPRETING ANYTHING. Expected case count five - one baseline, case 1
        at two z values, case 2, case 3 - observed five, each named; every case
        terminal_status `completed` and valid true; cases_not_completed_named
        empty and independently found empty; the manifest schema-complete with
        the pre-flight disk figure, the copied-checker provenance, the harness
        code hashes, the computed instance parameters beside the prior-record
        figures, the computed cubes, the replacement rule with its
        candidates-scanned count, the permutation as applied, the determinism
        result, the mechanically computed consequence flag with its contributing
        cases named, the empty run_ids with its reason and the inference block;
        seed integrity intact, with every instance parameter COMPUTED by the
        committed generator and none transcribed, and the prior-record figures
        p = 2293, n = 733 and derived seed 100 agreeing exactly so no
        discrepancy arises; raw per-case records and the summary in agreement on
        every field, verified independently; and the control - case 0, the null
        object on the mutation harness - comparable by construction, being the
        same instrument on an unmutated input. THE VERBATIM-COPY PRECONDITION,
        WITHOUT WHICH NONE OF THIS WOULD MEAN ANYTHING, IS CONFIRMED THREE TIMES
        INDEPENDENTLY AT 1444 BYTES, 26 LINES AND ZERO CHARACTERS CHANGED, AND
        THE WRAPPING AROUND IT IS SEMANTICALLY INERT ON FOUR SEPARATELY CHECKED
        GROUNDS. THERE IS NOTHING HERE TO SEND BACK TO THE EXECUTOR.
    - id: R-2
      statement: >-
        THE PRE-REGISTRATION HOLDS AND THE BRANCH WAS DETERMINED BY THE RULE AND
        NOT BY THE CONTENT. The expectations, the consequence, the replacement
        rule, the permutation, the claim ceiling and the evidence rule were all
        frozen in the BATCH-016 opening commit before the card existed. The red
        team reproduced chosen_x = 1, candidates_scanned = 1, the forbidden
        orbit as the named set {1094, 1529, 1963} and the fixed permutation FROM
        THE QUEUE TEXT ALONE and obtained identical values, so no outcome could
        have been obtained by choosing an input after seeing a result. NO
        SUCCESS CRITERION WAS CHANGED AFTER OBSERVING AN OUTCOME AND NO
        protocol_amendment CYCLE IS OPENED BY THIS DECISION.
    - id: R-3
      statement: >-
        THE CENTRAL FINDING OF THIS BATCH IS RECORDED AS THE HEADLINE AND IS NOT
        SOFTENED. "CTRL-4 CATCHES LAYOUT BREAKS" IS FALSE AS STATED. Both
        reviewers reached it independently and each by executable probe against
        the same byte-verbatim checker, each carrying a positive control
        confirming its own scaffolding reports FAIL on a genuinely broken
        within-block ratio.
      the_root_cause_stated_exactly: >-
        ADOPTED FROM THE VALIDATOR, WHOSE STATEMENT IS THE SHARPEST AVAILABLE.
        Condition (ii) re-anchors on F[3j] within each block, so the pair (j, 0)
        CAN NEVER FAIL FOR ANY INPUT WHATSOEVER - ONE THIRD OF THE 192
        COMPARISONS IS VACUOUS BY CONSTRUCTION - and the predicate is PURELY
        RELATIVE. THE COMPLETE SEMANTIC CONTENT OF CTRL-4 IS: len(F) == B, AND F
        IS A CONCATENATION OF len(F) // 3 GEOMETRIC TRIPLES WHOSE COMMON RATIO
        EQUALS THE z YOU HAND THE CHECKER. It never tests curve membership,
        distinctness, orbit disjointness, provenance, block-level ordering, or
        the B = 1 (mod 3) tail.
      the_measured_evidence_carried: >-
        RED TEAM: of eleven numbered diagnostics, six are missed at B = 192 -
        the named set {D-1, D-2, D-3, D-4, D-5, D-8} - plus two more at B = 193,
        the named pair {D-10b, D-10c}, EIGHT MISSED MUTATIONS IN TOTAL; three
        caught, the named set {D-6, D-7, D-9}; one, D-11, not run and reported
        as not run. Strongest: D-2, all 64 blocks replaced by fabricated orbits
        with only 78 of 192 entries on the curve, JOINT PASS. Also missed: a
        block replaced by an off-curve orbit; block 1 overwritten with block 0
        leaving 189 of 192 distinct; block 0 set to [0, 0, 0], since
        0 == z^k * 0 identically; truncate-and-refill; and at B = 193, A CELL OF
        THE FROZEN CONTRACT, index 192 lies in no complete block and is checked
        by nothing, with F[192] set to 1 and separately to 0 both passing.
        VALIDATOR, INDEPENDENTLY: class 4a, the 64 blocks permuted AS UNITS with
        interiors intact, JOINT PASS - a layout break CTRL-4 does not see and
        THE EXACT COMPLEMENT OF CASE 3; class 4b, 192 elements with the ratio
        intact and every anchor chosen so lift_x is None, 192 of 192 off the
        curve with zero overlap with the real F, JOINT PASS; class 4c, block
        j = 0 repeated 64 times, and an all-zero list, both JOINT PASS; class
        4e, a bogus z with arbitrary integers, JOINT PASS. Positive control
        F[4] + 1 mod p, condition (ii) FAIL.
      the_demarcation_and_it_is_not_a_defect: >-
        D-4, BLOCKS 0 AND 1 SWAPPED WHOLE - a permutation of THE VERY SIX
        INDICES CASE 3 PERMUTES - PASSES. Same descriptive class, opposite
        outcome. THIS SINGLE PAIR IS WHAT REFUTES THE GENERALISATION, because it
        shows the descriptive class "reordering the first two blocks" is the
        wrong unit. AND IT IS A CORRECT NON-DETECTION: a whole-block swap does
        not break the block-circulant phi-shift, so the checker is right to pass
        it. RECORDED AS A DEMARCATION, NOT AS A DEFECT, AND ANY SUCCESSOR THAT
        CITES IT AS A BUG IS MISREADING IT.
      status_of_this_evidence: >-
        UNPRE-REGISTERED VALIDATOR AND RED-TEAM PROBES, NOT PRE-REGISTERED
        RESULTS OF BATCH-016, NOT SCORED AGAINST ANY EXPECTATION. They are
        adopted because the disposition turns on them and because both were run
        read-only against the committed checker with positive controls. A
        successor resting a decision on any single one owes a proper card.
    - id: R-4
      statement: >-
        WHAT THIS BATCH ACTUALLY BOUGHT IS EXACTLY TWO THINGS, AND THE
        PRE-REGISTERED FLAG IS NOT ONE OF THEM. ADOPTED FROM VALIDATOR FINDING
        F-3, WHICH IS LOAD-BEARING FOR HOW THIS BATCH IS SCORED.
        assertion_passed_a_mutated_case IS TRUE, was computed mechanically by
        the stated rule and no other, and was recomputed independently with
        identical contributing-case set membership {case_1_z5, case_1_z1234} -
        BUT ITS TRUTH VALUE WAS FIXED BEFORE THE BATCH RAN, carried entirely by
        pre-stated case 1, and the queue said so in advance. CASES 2 AND 3, THE
        ONLY CASES CARRYING NEW INFORMATION, BOTH CONTRIBUTED FALSE. THE FLAG IS
        NOT A RESULT OF THIS BATCH AND NO RECORD MAY READ IT AS ONE.
      the_genuinely_new_information: >-
        (a) CASES 2 AND 3 FAILED ON CONDITION (ii) WITH CONDITION (i) PASSING -
        ONE BIT, that the checker is not vacuously always-PASS. That bit is real
        and I do not argue it away: a checker whose inner loop never executed,
        or which returned early, or whose polarity was inverted, would have
        passed case 1 for a second and duller reason, and BATCH-015's finding
        would have had an alternative explanation, now excluded on this instance
        at this B. (b) THE PRECISE CHARACTERISATION AT R-3. NOTHING ELSE.
      and_the_bit_is_cheaper_than_it_looks: >-
        ADOPTED FROM RED-TEAM OBJ-2 AT HIGH SEVERITY. BOTH SCORED MUTATIONS WERE
        DEDUCIBLE TO FAIL FROM THE CHECKER SOURCE BEFORE THE CARD RAN. Case 2's
        replacement rule EXPLICITLY EXCLUDES every value in the forbidden orbit,
        so a condition-(ii) FAIL is a THEOREM ABOUT THE CONSTRUCTED INPUT; case
        3 is the same up to a roughly 1/2293 accident per position. THE
        REVIEWER'S DISSENT AGAINST ITS OWN OBJECTION IS CARRIED AND I ENDORSE
        IT: a tautological mutation is the CORRECT FIRST mutation for a control
        that has never been mutated at all - you check that the instrument moves
        before asking what it is sensitive to - and the objection is to the
        INFERENCE, not to the choice of running it.
    - id: R-5
      statement: >-
        CONDITION (i) IS NOT DEAD, AND "DEAD, FULL STOP" IS A FALSE STATEMENT
        THAT NO RECORD OF THIS PROGRAM MAY WRITE. The red team fired it on its
        first attempt: D-7 truncates F to 189 elements, condition (i) FAIL with
        condition (ii) PASS. THE CORRECT NARROW VERDICT: no reachable path of
        the as-committed builder can fail it at B = 192 on CURVE-J12S1, because
        the builder fills xs until len(xs) >= B and returns xs[:B] so the only
        failure mode is exhausting the 50B + 1000 seed budget, against which
        BATCH-015 measured a roughly 76x margin; and no mutation in this batch's
        pre-registered set was constructed to violate it. IT IS A CONSTRUCTOR
        IDENTITY IN PRACTICE AT THESE PARAMETERS, EXACTLY AS BATCH-015 FOUND,
        AND THAT FINDING IS CARRIED UNCHANGED AND NOT EXTENDED. It retains power
        against length-changing corruption and against supply exhaustion at
        larger B or on a poorer instance, it is trivially evaded by any
        corruption that restores length (D-8), and AT B = 193 IT HIDES THE TAIL
        HOLE RATHER THAN CATCHING IT.
    - id: R-6
      statement: >-
        THE DISPOSITION OF CTRL-4, WHICH IS MINE ALONE AND WHICH BOTH REVIEWERS
        CORRECTLY DEFERRED TO ME: REWRITE AND DEMOTE. IT IS NOT RETIRED AND IT
        IS NOT RETAINED IN ITS PRESENT FORM IN ANY SUCCESSOR CONTRACT. THIS
        BINDS SUCCESSOR CONTRACTS FROM THIS DECISION FORWARD.
      the_pre_registered_consequence_it_discharges: >-
        The consequence - if the assertion passes any of the three mutated
        cases, CTRL-4 is retired or rewritten - ALREADY FIRED ON THE BATCH-015
        RECORD ALONE, since case 1 is pre-stated to pass and is already
        committed as passing. The queue said so before the card ran. WHAT CASES
        2 AND 3 WERE OPENED TO DECIDE IS WHICH OF THE TWO DISPOSITIONS IS
        CORRECT, AND THIS RATIONALE DECIDES IT.
      justification_against_RETIRE: >-
        RETIRE IS WRONG BECAUSE THE CHECKER IS DEMONSTRABLY NOT INERT. Real
        discriminating power was measured, with positive controls, by three
        independent sessions: cases 2 and 3 of the batch itself, the red team's
        D-6 (within-block reversal, 128 failing pairs), D-7 (a length break,
        condition (i) firing) and D-9 (an in-orbit element at the wrong power),
        and the validator's F[4] + 1 control. An assertion with non-zero power
        against a future refactor is worth about ten lines to keep. AND
        docs/inventor-protocol.md section 4 REQUIRES A CLOSURE TO NAME AN
        OBSTRUCTION, AN ARGUMENT AND FORWARD GUIDANCE: "CTRL-4 detects nothing"
        is not an obstruction, it is a false statement, and I decline to write
        it. Premature retirement is a failure mode symmetric with overclaiming,
        and it is live here precisely because the batch is fatiguing.
      justification_against_RETAIN_AS_IS: >-
        RETAIN-AS-IS IS WRONG ON TWO INDEPENDENT GROUNDS. (1) The pre-registered
        consequence has already fired and it is not negotiable after the fact.
        (2) On the merits: condition (ii) is blind to on-curve membership, to
        distinctness, to orbit disjointness, to provenance, to block-level
        ordering and to the B = 1 (mod 3) tail, and one third of its
        comparisons is vacuous by construction. A control that passes a factor
        base with no element on the curve at all is not controlling a factor
        base.
      the_demotion_is_the_load_bearing_half_and_is_not_a_gloss: >-
        ADOPTED FROM THE RED TEAM AND ENDORSED ON THE MERITS. THE REWRITTEN
        ASSERTION IS LABELLED AN INPUT-INTEGRITY REGRESSION ASSERTION, NOT A
        CONTROL, AND NO RECORD MAY CITE IT AS EVIDENCE ABOUT PHI-INVARIANCE OR
        ABOUT ANY MATHEMATICAL PROPERTY. The reason is exact: its
        alignment clause REMAINS A CONSTRUCTOR IDENTITY HOWEVER MANY CLAUSES
        SURROUND IT, so surrounding it with better clauses changes what it
        catches and does not change what it means. The failure this program
        actually made was never that six lines were buggy - THEY ARE NOT BUGGY -
        but that the word "control" in a frozen contract promised a strictly
        larger job than the six lines do, and the gap is where a successor
        overclaims. Relabelling is therefore the operative repair and not
        cosmetic.
      my_ruling_on_the_red_teams_F_RT2_which_it_flagged_against_itself: >-
        THE REVIEWER STATES THAT IF I HOLD A CONTROL MUST BE JUSTIFIED AGAINST
        REACHABLE STATES ONLY, RETIRE FOLLOWS AND IT WOULD NOT CONTEST IT. I DO
        NOT SO HOLD, AND I GIVE THE REASON RATHER THAN ASSERTING THE
        CONCLUSION. The committed builder does already enforce distinctness and
        on-curve membership internally, so the added clauses may indeed be
        unfalsifiable on today's single call path. But a regression assertion's
        entire purpose is to catch a FUTURE change to the constructor; requiring
        it to be falsifiable against currently reachable states would make every
        regression assertion vacuous by construction - WHICH IS EXACTLY THE
        PATHOLOGY BATCH-015 CONDEMNED IN CONDITION (ii). I CONCEDE THE FORCE OF
        F-RT2 IN FULL AND IT IS PRECISELY WHY THE DEMOTION IS MANDATORY: what
        cannot fail on any reachable path is a REGRESSION ASSERTION AND NOT A
        CONTROL, and calling it one is the error being corrected.
      the_disposition_is_conditional_and_its_condition_is_named: >-
        F-RT1 IS UNDISCHARGED AND MY DISPOSITION IS EXPOSED TO IT. The red team
        DID NOT READ experiments/EXP-STR-004/derivation_note.md IN FULL and says
        so; its claim that the exactness argument requires on-curve membership,
        distinctness, orbit disjointness and provenance is asserted from the
        contract's CTRL-4 text and IS NOT VERIFIED AGAINST THE DERIVATION. IF
        THAT NOTE SHOWS THE EXACTNESS ARGUMENT NEEDS ONLY WITHIN-BLOCK
        ALIGNMENT, THE ADDED CLAUSES PROTECT NOTHING, REWRITE COLLAPSES TO
        RELABELLING, AND RETIRE BECOMES THE CORRECT DISPOSITION. BINDING
        CONSEQUENCE: CTRL-4-PRIME MAY NOT BE FROZEN IN ANY SUCCESSOR CONTRACT
        UNTIL F-RT1 IS DISCHARGED BY AN ARCHIVED READING OF THAT NOTE, AND IF
        THE READING GOES THE OTHER WAY THIS DISPOSITION IS REVISITED BY A
        SUCCESSOR DECISION RATHER THAN QUIETLY KEPT. That reading is this
        decision's single next action.
      the_rewritten_assertion_carried_verbatim_in_substance_for_successors:
        name: "CTRL-4-PRIME - FACTOR-BASE INPUT-INTEGRITY ASSERTION, NOT A CONTROL"
        precondition: >-
          B mod 3 == 0. If B mod 3 != 0 the assertion reports NOT_APPLICABLE for
          the alignment clause and clause (h) governs the tail.
        clauses:
          - "(a) pow(zeta3, 3, p) == 1 AND zeta3 != 1 AND zeta3 != 0. THE AXIS THE OLD ASSERTION MISSED ENTIRELY."
          - "(b) len(F) == B."
          - "(c) len(set(F)) == B. Distinctness."
          - "(d) E.lift_x(x) is not None for every x in F. On-curve membership."
          - "(e) For every 0 <= j < B // 3 and k in {1, 2}: F[3j + k] == pow(zeta3, k, p) * F[3j] % p, and F[3j] != 0. LABELLED IN THE CONTRACT TEXT AS A CONSTRUCTOR IDENTITY THAT VERIFIES THE BUILDER'S OWN ARITHMETIC AND NOTHING ABOUT THE MATHEMATICS."
          - "(f) The B // 3 orbit leaders are pairwise orbit-disjoint: for j != j', F[3j'] not in {F[3j], zeta3 * F[3j], zeta3^2 * F[3j]}. Computable in O(B) with one set."
          - "(g) PROVENANCE: record sha256 of (p, a, b, derived_seed, B, zeta3) beside factor_base_sha256, and assert that rebuilding F from the recorded instance reproduces F byte-identically."
          - "(h) TAIL: if B mod 3 != 0, every index in [3 * (B // 3), B) is asserted to satisfy (c), (d) and (g) even though (e) cannot apply, and the tail indices are recorded explicitly rather than silently skipped."
        reporting_rule: >-
          Every clause reports PASS/FAIL SEPARATELY with its own failing set
          reported as a NAMED SET and never as a count alone (PRED-ID-STR). The
          joint verdict is reported beside them.
        cost_placement: >-
          Clauses (d), (f) and (g) execute OUTSIDE every window whose
          wall_seconds the contract reports. ADOPTED FROM RED-TEAM OBJ-6 AT LOW
          SEVERITY: clause (d) costs B modular square roots per cell, the same
          order as building the factor base, and per KN-LIT-7593 an invariant's
          own cost must be charged before it is called free. At B = 192 on a
          12-bit prime it is microseconds and irrelevant; inside a timed window
          of a contract whose timings are the object of RT-CM-1 to RT-CM-6 it is
          not.
      the_pre_stated_mutation_test_the_rewrite_must_pass_before_it_is_frozen:
        must_FAIL_with_the_named_clause_firing:
          - "M1 zeta3 := 5, whose cube is 125 mod 2293 - clause (a) FAIL. THE OLD ASSERTION PASSED THIS."
          - "M2 G[1] := the first on-curve x not in F and not in the orbit of F[0] - clause (e) FAIL at (0,1). Reproduces case 2."
          - "M3 blocks 0 and 1 interleaved to [F0, F3, F1, F4, F2, F5] - clause (e) FAIL at (0,1),(0,2),(1,1),(1,2). Reproduces case 3."
          - "M4 block 0 := the orbit of off-curve y = 4 - clause (d) FAIL on 3 named entries. Red team D-1; THE OLD ASSERTION PASSES THIS."
          - "M5 block 1 := a copy of block 0 - clauses (c) and (f) FAIL. Red team D-3; THE OLD ASSERTION PASSES THIS."
          - "M6 block 0 := [0, 0, 0] - clause (c) and clause (e)'s F[3j] != 0 FAIL. Red team D-5; THE OLD ASSERTION PASSES THIS."
          - "M7 F := 64 orbits of a deterministic integer recurrence, length and alignment intact - clauses (d) and (g) FAIL. Red team D-2; THE OLD ASSERTION PASSES THIS ON A LIST WITH ONLY 78 OF 192 ENTRIES ON THE CURVE."
          - "M8 F truncated to 189 - clause (b) FAIL. Red team D-7."
          - "M9 at B = 193, F[192] := 0 - clauses (d) and (h) FAIL. Red team D-10c; THE OLD ASSERTION PASSES THIS."
        must_PASS_and_this_row_is_MANDATORY:
          - >-
            M10 BLOCKS 0 AND 1 SWAPPED WHOLE - ALL CLAUSES PASS, PRE-STATED,
            with the recorded reason that a whole-block permutation does not
            break the block-circulant phi-shift. Red team D-4. A MUTATION SET
            WITH NO PRE-STATED-PASS ROW DOCUMENTS NO BOUNDARY AND IS THE DEFECT
            OBJ-3 NAMES. THIS ROW IS NOT OPTIONAL AND ITS OMISSION INVALIDATES
            THE TEST.
        authorship_rule: >-
          AT LEAST M4 THROUGH M7 AND M10 MUST BE RE-DERIVED BY A SESSION THAT
          DID NOT AUTHOR THE SUCCESSOR CONTRACT.
      what_this_disposition_does_NOT_do: >-
        IT EDITS NO CONTRACT. experiments/EXP-STR-004/specification.yaml and
        derivation_note.md are NOT edited, NOT amended, NOT superseded and NOT
        staged by this batch, no file under experiments/EXP-STR-004/amendments/
