  what_the_note_is_and_is_not_under_this_ruling:
    is:
      - >-
        A pre-compute artifact of RQ-CERTBIN-836ce2: an exact baseline embedding
        of ECC2K-130 (field modulus, #E, r, the Frobenius eigenvalue mu with
        ord_r(mu) = 131) and a method ceiling for the orbit-union factor base at
        one parameter point, plus a single-session probe of per-solve cost.
      - >-
        A MEASUREMENT WITH ITS PROVENANCE that future CERTBIN contracts may quote,
        reproduce and supersede, exactly as DEC-20260922-e9d35a ITEM-1 permits for
        records of this provenance class.
    is_not:
      - >-
        Evidence. It has no RUN-*, none is created, and none may be invented
        (AGENTS.md rule 9 / CLAUDE.md rule 5). It moves no hypothesis, experiment,
        question or goal status.
      - >-
        A discharge of any completion criterion -- not GOAL-FROB-6333a9 C1 or C2
        (WDSat conflict ratios on LINEAR ker g(sigma) at n = 41 / 43 against
        2^{ml}/m!, a different object, cells and null), and not any
        GOAL-ECDLP2M-001 criterion (it has no size-matched random-V control and no
        certified solve).
      - >-
        A ruling on RQ-FROB-7d8dd4. The note's sentence that its combination
        "lands on RQ-FROB-7d8dd4's decision target (a)" is NOT adopted: target (a)
        requires a matched null object (a curve over F_{q^n} defined over no
        proper subfield) and a stage-by-stage measurement, neither of which the
        note has, and its decomposition-cost premise rests on EV-FROB-b6e1e9 /
        KN-FIND-47da4e, whose ratios DEC-20260922-e9d35a ITEM-1/ITEM-2 forbid
        citing as this program's result.
      - >-
        A validation of EXP-ICPERF-783e9e's forming-cost model. Part 2's 2^27.6
        build-cost row is a stagew-encoded CNF at m = 2 on one machine, converted
        under assumption C2; the ICPERF charge is one operation per ANF monomial
        of a Weil-descended system. Same direction, different object; it may be
        quoted to the ICPERF red team as a measurement, not as corroboration.
      - >-
        A statement about the security of ECC2K-130 or of any deployed curve.

  limitations:
    - id: L-1
      text: >-
        Scope of the ruling: ownership and classification only. It asserts
        nothing about the orbit-union mechanism, the cost table, the solve-cost
        numbers, or ECC2K-130 beyond what the note itself records, and it does not
        re-derive or re-run any of it. No sha256 of the note's artifacts was
        computed by this session.
    - id: L-2
      text: >-
        EXP-FROB-ec08b5 and EXP-ICPERF-783e9e are merged and unreviewed. If
        review overturns EV-FROB-d336b0 P5 at n = 131, Part 1 B loses its
        corroborating partner and must be re-read against the review; if review
        overturns EV-ICPERF-784b25's forming charge, the note's Part 1 framing of
        m >= 4 as a per-solve budget question becomes live again. Neither
        possibility changes the ownership ruling, which rests on scope.
    - id: L-3
      text: >-
        The note's m >= 4 dismissal ("S_5 ... S_7 ... not constructible at this
        size") is a literature judgement the note did not measure and no agent in
        this program has verified here; it is carried forward as a stated
        assumption, not a finding.
    - id: L-4
      text: >-
        The 2^60.9 rho figure is KN-LIT-096's authors' estimate and the 2^58.3
        public-effort figure is from KN-LIT-661e97, both as the note records them;
