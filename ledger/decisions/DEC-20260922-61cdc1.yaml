        status "ACCEPTED", commit_sha null "by convention", parent_sha
        f7374fcab773 and base_commit_checked 336b0301a2c9. The opening package
        reached main through PR #1361 (merge 83d8d0cfa7d4, 14:19Z) and the fix-up
        through PR #1366 from coordinate/portfolio-20260922 (merge f1f4a4fcc13e,
        15:13Z), whose digest records TASK-20260922-0e3b58 as modified. However,
