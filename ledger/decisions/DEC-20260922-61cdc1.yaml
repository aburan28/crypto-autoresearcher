  context: >-
    analysis/frobenius-orbit-ecc2k130/ merged to main on 2026-09-22 (PRs #1356 and
    #1363) as an analysis note that its author deliberately left unfiled, writing
    "Adoption is a Coordinator decision and is not taken here." Part 1 audits a
    Frobenius orbit-union factor base S = union_j sigma^j(V') on the ECC2K-130
    curve y^2 + xy = x^3 + 1 over F_{2^131}: exact order, the four sigma-stable
    linear subspaces {0, 1, 130, 131}, constructibility of the orbit union at
    |S| = 2^43.03, the orbit gain of exactly n = 131, and a charged floor table
    against the 2^60.9 rho estimate. Part 2 is a single-session instrument
    measurement of one decomposition solve: exact reproduction of the prior
    n = 23 control, an encoding confound at n = 19, a ladder that did not
    complete at n = 29 or n = 31, and a censored (non-terminating) n = 131 cell
    on the real challenge curve, with a field-operation conversion under two
    numbered assumptions C1/C2. It has no RUN-*, no frozen contract, no review,
    and states itself not evidence. Since it was written, two things landed on
    main that bear on its ownership: RQ-CERTBIN-836ce2 with the declared ECC area
    CERTBIN (orchestration/research-priority.yaml; "rolls up to
    GOAL-ECDLP2M-001"), and PR #1360's EXP-FROB-ec08b5 / EV-FROB-d336b0 /
    DEC-20260922-5796b8 and EXP-ICPERF-783e9e / EV-ICPERF-784b25 /
    DEC-20260922-925da8, both merged and neither yet independently reviewed.

  decision: >-
    DISPOSITION (a). Attach analysis/frobenius-orbit-ecc2k130/ to
    RQ-CERTBIN-836ce2 as a PRE-COMPUTE ARTIFACT -- a docs/inventor-protocol.md
    section-8 audit (baseline embedding and method ceiling at one parameter
    point) plus a single-session instrument probe -- that the question's future
    contracts must reuse by reference under its "Do not duplicate" constraint.
    NOT EVIDENCE, and not promoted to evidence by this decision. Record
    cross-references, without ownership, to GOAL-FROB-6333a9 / EXP-FROB-ec08b5
    (which covers Part 1 section B only) and to GOAL-ICPERF-e6b6a4 /
    EXP-ICPERF-783e9e (whose system-formation charge the Part 2 build-cost row
    is consistent with). Options (b) fold into EXP-FROB-ec08b5 and (c) leave
    unowned are declined, with reasons below. Attaching RQ-CERTBIN-836ce2 itself
    to GOAL-ECDLP2M-001 is NOT done here; it is named as NA-2.
  target_ids:
