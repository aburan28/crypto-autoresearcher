  identifier_provenance: >-
    DEC-20260922-61cdc1 was minted ON THIS SESSION'S BEHALF by the top-level
    session, which ran `python3 tools/allocate_id.py --next coordinator_decision
    --date 20260922` and `--check DEC-20260922-61cdc1` at 2026-09-22T22:34Z and
    reported "OK: well-formed and free across the union" (26149
    identifier-bearing paths scanned, 0 occurrences). The authoring Coordinator
