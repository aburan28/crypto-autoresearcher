  task_id_note: >-
    No TASK-* handoff was minted for this act. It is a single in-session
    /coordinate disposition ruling that launches nothing and dispatches nothing;
    the only artifacts are this record and one appended section of the note's
    README. See limitations L-6 on what that means for officiality under AGENTS.md
