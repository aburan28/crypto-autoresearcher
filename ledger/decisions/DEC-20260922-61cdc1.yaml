  rationale:
    - id: R1
      point: RQ-CERTBIN-836ce2 admits the note's target and its instance-level work; the FROB records do not.
      detail: >-
        RQ-CERTBIN-836ce2's scope.curve_families names "ECC2K-130 (Koblitz) and
        ECC2-131 (random) over F_{2^131}" as open Level I targets; its methods name
        "Frobenius-stable subspaces (on ECC2K)" as a V-choice and "orbit-aware
        factor bases ... measured against size-matched non-orbit controls"; its
        constraints say "The challenges exist to be attacked" and require every
        contract to name "the challenge or the prime-m sibling it measures". So it
        admits ECC2K-130 as an INSTANCE, not merely as a cost-table parameter --
        although its decision_target is scored "on prime-m scaled-down siblings
        with the Certicom challenges as declared endpoints", so an ECC2K-130 cell
        is an endpoint measurement, not the scoring panel. Part 2's n = 131 cell
        (a planted decomposition solve on the real challenge curve) is exactly
        instance-level work, and Part 2's own ladder cells n = 19, 23, 29, 31 (it
        also tabulates the prior n = 13, 17) are prime-degree siblings of the
        kind the question's field_types demand.
        By contrast GOAL-FROB-6333a9 scope_exclusions[0] excludes "Deployed
        Koblitz / ECC2K-130 as attack instances", RQ-FROB-7d8dd4 restricts
        instances to toy q^n up to about 2^40 and bars deployed Koblitz
        parameters, and EXP-FROB-ec08b5 lets "the real extension degrees appear
        only as parameters of a structural census". Filing the n = 131 probe under
        FROB would place instance-level work inside a scope that excludes it.
    - id: R2
      point: EXP-FROB-ec08b5 covers one of the note's five substantive parts; its frozen scope excludes the rest.
      detail: >-
        Overlap of SUBJECT, not reliance on verdicts (EXP-FROB-ec08b5 is merged but
        its named validator and red-team passes are outstanding). Part 1 section
        B -- exactly four sigma-stable subspaces of dimensions {0, 1, 130, 131} at
        n = 131 -- is squarely inside EXP-FROB-ec08b5 (EV-FROB-d336b0 P5 states
        the same four dimensions at n = 131, and the net loss of 57.0 to 96.0
        bits there, 72.7 to 121.7 at n = 163); the note itself calls its B an
        independent corroboration "not novelty". But EXP-FROB-ec08b5's
        constraints read "Claims are scoped to the enumerated (q, n) cells and to
        the Gaudry/Diem subspace factor-base family. No extrapolation to other
        factor-base shapes", and its objective "deliberately says nothing about
        solving degree or decomposition cost". Part 1 sections C and D (the
        NON-LINEAR orbit union of a random V', its constructibility and its
        verified factor-n gain on a real point of order r), the Part 1 charged
        floor table, and all of Part 2 (per-solve cost) are outside that frozen
        scope. Folding them in (option b) would either stretch a frozen contract
        past its declared family or leave four-fifths of the note owned by a
        record that disclaims it.
    - id: R3
      point: The question-level tensions that kept the note unfiled are resolved by attaching to CERTBIN, and no frozen record needs changing.
      detail: >-
        (i) GOAL-FROB-6333a9's exclusion and RQ-FROB-7d8dd4's instance bar are
        respected because nothing is filed under them. (ii) RQ-QSP-f9bbdb's
        ideation card TASK-20260916-a93a2a bars the Frobenius-orbit lens as "the
        idea" there; that bar is scoped to that card and that question, and this
        decision files nothing under RQ-QSP-f9bbdb. (iii) RQ-CERTBIN-836ce2's own
        "Do not duplicate" constraint names "the FROB dimension tables" as
        existing work to reuse by reference, which is precisely how Part 1 B is
        to be treated (R2). No question, goal, experiment, hypothesis or evidence
        record is edited; the only file changed besides this record is an
        APPENDED dated section of the note's README.
    - id: R4
      point: Leaving it unowned (option c) is the failure the note was written to flag.
      detail: >-
        The note names one open quantity -- the per-solve decomposition cost at
        n = 131, and the m >= 4 budget of about 2^30.6 field operations per
        solve -- and RQ-CERTBIN-836ce2's decision_target items (2), (4) and (5)
        ask for exactly the neighbouring quantities: whether Frobenius-stable V
        beats the sqrt(m) rho-side saving on ECC2K, the crossover against
        m-charged rho, and the extrapolation boundary toward m = 131. An owner
        now exists whose scope fits and whose contracts are required to reuse
        prior work by reference. Leaving the note unowned would keep its
        measured instrument ceilings (the n = 29 / n = 31 non-completion, the
        encoding confound, the C2 conversion) invisible at the one question
        whose next contracts will need them.
    - id: R5
      point: Target-profile ranking -- this is custodial, not a bet on the note's mechanism.
      detail: >-
        The note's own finding is that the orbit union buys exactly the constant
        factor n on relations and n^2 on linear algebra, "No exponent moves".
        Attaching it does not rank the orbit-union construction as an
        exponent-moving route; it places a measured method ceiling where the
        question that must weigh exponent-moving alternatives (e.g. the proposed
        IDEA-20260922-37e02e on subspace multiplicative closure) will find it.

