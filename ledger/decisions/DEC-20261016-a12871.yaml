  context: >-
    Goal-scoped Coordinator pass on the SafeCurves goals, at the user's
    request in this session. No scientific trial was run. IDEA-20260829-bba3a8 proposes to
    (C1) recompute P-224's c from its published seed (Route A) and compare it
    with the published c (Route B); (C2) settle the sign in the X9.62
    verification congruence (b^2 c = -27 versus +27 mod p); and (C3) measure how
    many of the seven published quantities (p, a, b, Gx, Gy, n, h) the seed check
    binds, predicting 1 of 7. DEC-20260913-b0b3cf approved only Stage 0 of
    EXP-SCURVE-0e4295, a closed-form check that one rule is declared. Stage 0 has
    no runs. Stages 1 and later were never authorized.
