  ruling:
    - >-
      Partly answered: the seed is explained and the base point is not. The P-224 seed
      BD71344799D5C7FCDC45B59FA3B9AB8F6A948BC5 is one drand48 block of the
      run srand48(891607927), dated 1998-04-03 12:52:07 UTC, and is the 4th of
      that run's four accepted candidates (block indices 777, 1485, 5736, 7026;
      the published seed is block 7026). Sources: KN-LIT-d2f917, bundle
      README and census/summary.json. The native test
      every_prime_seed_satisfies_x962_with_published_b, listed in the bundle
      README and kept in aburan28/crypto, checks r(seed) * b^2 = -27 (mod p) for
      all ten prime seeds, P-224 included. If validated, that answers C1 and
      settles C2 in favour of -27. It is cross-repository and not yet
      independently validated here, so C1 and C2 are answered provisionally.
    - >-
      C3, the coverage count, is still open and its prediction (1 of 7) is
      not overturned. The provenance explains where the seed came from. It
      binds no additional published P-224 quantity. P-224's G is unexplained:
      the external seed-agnostic scan found no drand48-family structure, and its
      FreeLIP test cannot see through the mod-p reduction for this curve (bundle
      README, "External analyses", labelled there as outside-repository
      observations). Why the 4th accepted candidate was published, rather than
      the 1st to 3rd, is also unexplained
      (problems/nist-seed-selection-rule-unexplained.md).
    - >-
      Any revised Stage 1 must: treat C1/C2 as an in-repository replication of
      the cross-repository native check, not as a discovery; restate the idea's
      premise "a 160-bit unexplained input" as "a seed explained as drand48
      output, chosen among accepted candidates by an unexplained rule"; and keep
      C3 as the deliverable, with G and the selection rule named as the unbound
      quantities. The Stage 0 approval stays as recorded. It should not be
      dispatched before such a revision exists.
  rationale:
    - >-
      Treating C1/C2 as replication keeps the cross-repository result from
      being counted as program evidence before validation. Keeping C3 keeps the
      question the facts leave open, which is what the seed check does and does
      not bind.
    - >-
      Revisit condition: the independent validation named in
      DEC-20261016-fb3a6f returns. If it passes, C1/C2 can be cited from its EV
      record, and a revised Stage 1 reduces to the C3 coverage count.
  evidence_refs:
    - KN-LIT-d2f917
    - research/nist_seed_provenance_20261016/README.md
