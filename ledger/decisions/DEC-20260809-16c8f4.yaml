    core, so the machine is HEAVILY OVERSUBSCRIBED by concurrent agents.
    THAT IS A MEASUREMENT AT DRAFTING TIME AND NOT A FORECAST. It does not
    predict the load at dispatch time and it predicts no task's duration; this
    decision states what was read and nothing about what will be read.
    THE OPERATIVE CONSEQUENCE, WRITTEN INTO EVERY CARD AS SC-10: max_concurrent
    3 is a cap ACROSS BOTH AES GOALS, not 3 each (GOAL-AES-002
    relationship_to_GOAL_AES_001; RQ-AES-002 constraints, final item).
    GOAL-AES-001 remains active with BATCH-005 pending and neither campaign's
    budget may be charged for the other's work. IF DISPATCHING A BATCH-001 TASK
    WOULD EXCEED THE CAP, THIS BATCH WAITS: the task is recorded
    WAITED_ON_CONCURRENCY_CAP with the time waited and is dispatched later at
    FULL budget, FULL deliverable set and FULL review chain. It is never
    dispatched degraded, and a wait is infrastructure signal, never a negative
    result. The dispatching session re-checks the cap immediately before each
    dispatch.
    A SECOND DISCREPANCY IS NAMED AND NOT RESOLVED HERE: RQ-AES-002 constraints
    declare 4 CPU cores and 15 GB RAM against the 14 cores and 48 GB observed.
    This Coordinator does not rule which describes the resource a dispatched
    task actually receives. It is handed to TASK-20260809-8ab82c to settle by
