coordinator_decision:
  id: DEC-20260809-16c8f4
  context: >-
    GOAL-AES-002 is `active` with NO batch, NO dispatch queue and NO producer
    task ever dispatched: current_batch_id and dispatch_queue_path were both
    null by fact, and its single committed next_action is "DRAFT, COMMIT AND
    DISPATCH THE GOAL-AES-002 BATCH-001 QUEUE ... IN THE RANKED SHAPE BELOW".
    This decision executes that instruction. It OPENS BATCH-001 as a control
    plane — batch record, dispatch queue, NINE task cards, NINE handoff
    records — in the ranked shape the goal fixes, against the 22500 s campaign
    ceiling, the 3-batch maximum, and the adopted
    protocol-amendment-GOAL-AES-001-005 Part B clock convention. It also
    records ONE CORRECTION to that committed instruction, on the identifier it
    names for the batch's evidence record, AND THREE ROUNDS OF REPAIR TO ITS OWN
    QUEUE, WHICH tools/research_dispatch.py REJECTED THREE TIMES. Round 1: incomplete
    archive coverage, recorded under
    the_first_queue_draft_was_rejected_by_the_dispatcher_and_this_is_the_repair
    below, together with its 500 s budget consequence. Round 2, AFTER that
    repair: an archive task that did not directly depend on one of its own
    declared sources, and a ledger archive that owned no artifact under
    ledger/evidence/ or ledger/decisions/ — recorded under
    the_second_dispatcher_rejection_and_its_two_repairs below, which is also
    what forced this batch's closing evidence and decision identifiers
    (EV-AES-790d63 and DEC-20260809-9d8e92) to be DECLARED AT QUEUE TIME.
    Round 3, after both of those: neither independent reviewer depended on any
    of the three review_required producers, recorded under
    the_third_dispatcher_rejection_and_its_repair below. FOUR DEFECTS ACROSS
    THREE ROUNDS, ALL OF THEM THIS COORDINATOR'S, none compressed away.
    NOTHING IN THIS DECISION IS A CLAIM ABOUT AES AT ANY ROUND COUNT, and
    naming those two identifiers is not a statement about what they will
    contain.
  decision: approve
  decision_note: >-
    `approve` in the narrow sense the record template allows: it approves the
    OPENING OF A CONTROL PLANE and the dispatch of NINE budgeted tasks. It
    approves no experiment result, no cost claim, no hypothesis, no promotion
    and no status transition, and it admits no evidence, because no evidence
    exists yet under this goal.
  amended_in_place_note: >-
    THIS RECORD WAS AMENDED IN PLACE THREE TIMES, AND THAT IS THE CORRECT ROUTE
    HERE ONLY BECAUSE IT WAS STILL UNCOMMITTED ON ALL THREE OCCASIONS. Ledger
    records are immutable once committed and are corrected by SUPERSESSION,
    never by overwriting. DEC-20260809-16c8f4 had not been committed when
    tools/research_dispatch.py rejected the first dispatch_queue.json draft, nor
    when it rejected the repaired draft a second time, nor a third, so each
    repair is an edit to a draft rather than a rewrite of official state. THE
    REJECTIONS THEMSELVES ARE NOT ERASED BY THAT: ALL THREE are recorded in full
    below, in the batch record, in the queue's batch_notes, in the
    TASK-20260809-7bab1e, TASK-20260809-9a49e4, TASK-20260809-9b0401 and
    TASK-20260809-33a159 cards and in the TASK-20260809-93d82c receipt, as THREE
    rounds and not as one clean pass. A draft that was rejected three times and
    repaired three times is a fact about how this control plane was produced,
    and it stays in the record. Had this decision been committed, the correct
    route would have been a superseding decision instead.
  target_ids:
    - GOAL-AES-002
    - RQ-AES-002
    - BATCH-001
    - TASK-20260809-23abf9
    - TASK-20260809-93d82c
    - TASK-20260809-7bab1e
    - TASK-20260809-9b78b2
    - TASK-20260809-8ab82c
    - TASK-20260809-877f6b
    - TASK-20260809-9b0401
    - TASK-20260809-33a159
    - TASK-20260809-9a49e4

  rationale:
    - >-
      THE RANKED SHAPE IS A GATE STRUCTURE, NOT A PREFERENCE, AND IT IS TAKEN
      FROM THE COMMITTED GOAL next_action RATHER THAN INVENTED HERE. RANK 1
      (TASK-20260809-23abf9, coordinator, 900 s) is the protocol act and is
      FIRST IN TIME because it gates everything else and costs no producer
      slot: (a) cost model CM-1 fixing all six elements (a)-(f) of RQ-AES-002
      claim_tier_ceiling R2 for AES-128/192/256; (b)
      protocol-amendment-GOAL-AES-002-001 resolving BLK-1 by adding a
      `key_recovery` certificate kind to docs/claims-and-verification.md with
      the corresponding `check_run` change in tools/validate_ledger.py; (c) the
      adoption record for the amendment-005 Part B clock convention and the
      amendment-004/005 provenance gate. RQ-AES-002's constraints make CM-1 a
      HARD PRE-DISPATCH GATE on every cryptanalytic measurement and every cost
      claim, and name BLK-1 as a blocker that must be resolved BEFORE any card
      that could produce a solve is dispatched (pause condition P3 fires on it
      remaining unresolved). Its artifacts are therefore committed and pushed
      BEFORE ranks 2 and 3 run: a gate uncommitted when the card it gates is
      issued is exactly the retroactive enforcement this program refuses. THE
      COMMIT THAT DOES THIS IS ITS OWN DECLARED TASK — TASK-20260809-7bab1e,
      the opening snapshot archive, priority 97, running ALONE between rank 1
      and the producers — and RANKS 2 AND 3 DEPEND ON THAT ARCHIVE RATHER THAN
      ON TASK-20260809-23abf9 DIRECTLY. That is a strictly stronger gate: an
      artifact that has been authored but not committed, digest-checked and
      pushed has not closed anything. In the first draft of this queue the
      commit was prose owned by no task; see
      the_first_queue_draft_was_rejected_by_the_dispatcher_and_this_is_the_repair.
    - >-
      RANK 2 (TASK-20260809-9b78b2, idea-generator, 1600 s) IS THE ITEM THE
      WHOLE GOAL EXISTS FOR and is the campaign's only research producer in
      BATCH-001: object-first generation on FULL-ROUND single-key
      AES-128/192/256 under docs/inventor-protocol.md section 1, with the
      established families declared off-limits as the primary lens, the
      lossy-projection test applied to every candidate BEFORE any compute is
      requested, and each candidate scored on the three axes with the FULL
      round count as the survival target. The enumeration it produces is a
      REQUIRED ARTIFACT and is EXPLICITLY NOT A COMPLETION (GOAL-AES-002
      non_completion_criteria (i)); the card says so and its completion gate
      enforces it.
    - >-
      RANK 3 (TASK-20260809-8ab82c, executor, 1600 s) RUNS CONCURRENTLY WITH
      RANK 2 BECAUSE THE TWO ARE GENUINELY INDEPENDENT — one is ideation on
      paper, the other is a measurement of the machine — and because
      RQ-AES-002's constraints make the measured envelope receipt a REQUIRED
      first-batch artifact: no card in any later batch may declare a budget
      that depends on throughput until it exists. It settles BY MEASUREMENT the
      named contradiction between two committed records about the C toolchain
      (RQ-AES-001 records gcc 13.3.0 with -maes as available; GOAL-AES-001's
      next_action records that neither numpy nor a C program is installed), and
      it now also settles a SECOND discrepancy this decision found and does not
      adjudicate: RQ-AES-002 declares 4 cores and 15 GB, while the host reading
      taken at drafting time is 14 cores and 48 GB.
    - >-
      THE REVIEW CHAIN IS THE STANDARD ONE AND IS NOT RELAXED: an isolated
      snapshot archive of the producer artifacts alone (TASK-20260809-877f6b,
      500 s, runs alone), independent validation (TASK-20260809-9b0401,
      1400 s), an independent RED TEAM PASS ON CM-1 ITSELF
      (TASK-20260809-33a159, 1000 s), and an isolated ledger archive
      (TASK-20260809-9a49e4, 900 s, runs alone). BOTH REVIEWERS DEPEND DIRECTLY
      ON ALL THREE REVIEWED PRODUCERS AND ON THE SNAPSHOT ARCHIVE OF EACH —
      TASK-20260809-23abf9, TASK-20260809-7bab1e, TASK-20260809-9b78b2,
      TASK-20260809-8ab82c, TASK-20260809-877f6b — which the third dispatcher
      rejection required and which changes no ordering, since every one of those
      was already a transitive ancestor. The red team attacks CM-1
      because the cost model is the object most worth attacking in this
      campaign — every future margin under RQ-AES-002 is charged through it —
      and because GOAL-AES-001's first red-team pass destroyed its only cost
      model. That card carries non-trivial work in BOTH branches so it is not
      wasted if CM-1 is sound: its third branch attacks the batch's own
      SCREENING judgements, which guards premature closure, the failure mode
      CLAUDE.md names as symmetric with overclaiming.
    - >-
      THE QUEUE-DRAFTING ACT IS ITSELF A CHARGED TASK (TASK-20260809-93d82c,
      700 s, recorded `completed` because it has been performed). This is the
      one place GOAL-AES-002 starts ahead of its predecessor: GOAL-AES-001
      discovered at its FIFTH batch that coordination acts performed outside
      the queue consume real session elapsed and had been charged at ZERO for
      four batches, an under-count it recorded as unquantified and
      unrecoverable. Here every coordination act is dispatched, budgeted and
      charged from BATCH-001.
    - >-
      THE BUDGET IS THE COMMITTED DECOMPOSITION, REPRODUCED LINE FOR LINE AND
      NOT RE-DERIVED: coordination-and-protocol act 900 + queue drafting 700 +
      two concurrent producers 3200 (1600 + 1600) + snapshot 500 + validation
      1400 + red team 1000 + ledger archive 900 = 8600, exactly as GOAL-AES-002
      campaign_budget.sizing_basis decomposes BATCH-001. THERE IS NO ROUNDING
      SLACK AND NO CONTINGENCY; the per-role maxima ARE the contingency. THE
      WEAKNESS IS NAMED RATHER THAN SMOOTHED: every per-role line is borrowed
      from GOAL-AES-001's measured actuals and this goal has no measured datum
      of its own, which GOAL-AES-002's own what_a_red_team_should_attack_here
      item (2) already records against itself.
      THE DISPATCHED TOTAL IS 9100, NOT 8600, AND THE 500 s DIFFERENCE IS A
      DECLARED OVERRUN. The added line is the opening snapshot archive
      TASK-20260809-7bab1e at 500 s, for which sizing_basis has NO line: its
      BATCH-001 decomposition names exactly one snapshot, and that one is
      TASK-20260809-877f6b. charged_to_date is 0, so a full-declaration batch
      now consumes 9100 of 22500, leaving 13400 against BATCH-002 (7700) and
      BATCH-003 (6200), which together require 13900 — A 500 s SHORTFALL,
      NAMED HERE RATHER THAN DISCOVERED AT BATCH-003. The full reasoning, and
      the three honest dispositions none of which is chosen, are in
      the_first_queue_draft_was_rejected_by_the_dispatcher_and_this_is_the_repair
      below and in batch.yaml
      budget.the_added_opening_archive_and_its_declared_overrun.
    - >-
      BATCH-001 AND BATCH-002 ARE THE ONLY BATCHES THAT MAY OPEN NEW RESEARCH
      LINES; BATCH-003 IS RESERVED FOR CONSOLIDATION, REVIEW AND THE TERMINAL
      RECORD. That is the overriding shape constraint in the committed
      next_action and it binds this queue and the next. Its direct consequence
      is recorded here rather than discovered later: any full-round object not
      attempted in BATCH-001 or BATCH-002 will, on this campaign, not be
      attempted at all — it is named OPEN AND UNATTEMPTED, which is a
      legitimate outcome, and it is NEVER recorded as tried, screened or
      negative (AGENTS.md rules 5 and 8).
    - >-
      STANDING CONSTRAINTS SC-1 THROUGH SC-10 APPEAR IN EVERY CARD IN IDENTICAL
      LANGUAGE, producing and archival alike, as the committed next_action
      requires: the C2 stamp duty with a binding_stop_utc computed at dispatch
      time and the stamps committed as a declared artifact; the C4
      authoring-inclusive declaration basis with compute reported separately;
      the covering-manifest clause and the closed case-insensitive class
      vocabulary; the R5 anti-laundering clause QUOTED VERBATIM as a completion
      gate on every deliverable; the same-sentence margin rule; no recalled
      literature figure as authority in either direction; no comparison against
      the published state of the art; no reduced-round finding asserted under
      this goal; anything unattempted named OPEN AND UNATTEMPTED; and the
      concurrency cap with its wait-rather-than-degrade clause.

  the_first_queue_draft_was_rejected_by_the_dispatcher_and_this_is_the_repair:
    the_rejection: >-
      RECORDED BECAUSE IT HAPPENED, NOT BECAUSE IT FLATTERS THIS ACT. The FIRST
      draft of coordination/goals/GOAL-AES-002/batches/BATCH-001/dispatch_queue.json
      was REJECTED by tools/research_dispatch.py with the verbatim error
      "dispatch error: non-archive task TASK-20260809-23abf9 must be assigned
      exactly once to an archive task". The dispatcher enforces that EVERY
      non-archive task appears exactly once in some archive task's
      archive.source_task_ids. TWO tasks were uncovered: TASK-20260809-23abf9
      (rank 1, the protocol act) and TASK-20260809-93d82c (the queue-drafting
      act, state `completed`). Coverage in that draft was: snapshot
      TASK-20260809-877f6b over [TASK-20260809-9b78b2, TASK-20260809-8ab82c],
      and ledger TASK-20260809-9a49e4 over [TASK-20260809-9b0401,
      TASK-20260809-33a159].
    the_defect_was_real_and_it_was_this_coordinators: >-
      NOT A TOOL QUIRK AND NOT WORKED AROUND. The rank-1 commit was described
      in PROSE in three places — the queue objective, the batch_notes
      ranked_shape_and_why, and the rank-1 card's own completion gate — and was
      OWNED BY NO TASK. The artifacts that gate every later card in this batch
      therefore had no declared archive, no budget, no receipt, no completion
      gate and no reviewer. A commit that everything depends on and that no
      task owns is exactly the unbudgeted coordination act GOAL-AES-002's
      charging regime was created to eliminate, and this decision's own
      rationale had already named that failure mode against GOAL-AES-001 while
      reproducing it one paragraph later.
    what_was_NOT_wrong_and_is_NOT_reversed: >-
      THE GATE ORDERING. Rank 1's artifacts belong in an ISOLATED COORDINATION
      COMMIT BEFORE ranks 2 and 3 dispatch. Folding them into the post-producer
      snapshot TASK-20260809-877f6b would commit the gate AFTER the cards it
      gates had already run, which is retroactive enforcement and is refused.
      The dispatcher does not contradict that ordering — it requires the
      earlier commit to be a DECLARED archive task rather than an implicit one.
    the_repair: >-
      ONE archive task was added: TASK-20260809-7bab1e, role coordinator, state
      queued, review_required false, archive kind `snapshot`, priority 97
      (between rank 1 at 100/99 and rank 2 at 95), depends_on
      [TASK-20260809-23abf9], RUNNING ALONE, inference policy
      coordinator-orchestration, write_scope its own archive directory
      coordination/goals/GOAL-AES-002/batches/BATCH-001/archives/TASK-20260809-7bab1e,
      carrying SC-1 through SC-10 in the same identical language as every other
      card, and covering source_task_ids [TASK-20260809-93d82c,
      TASK-20260809-23abf9]. TASK-20260809-9b78b2 and TASK-20260809-8ab82c were
      RE-POINTED from depends_on [TASK-20260809-23abf9] to depends_on
      [TASK-20260809-7bab1e], and TASK-20260809-877f6b's depends_on from
      [TASK-20260809-23abf9, TASK-20260809-9b78b2, TASK-20260809-8ab82c] to
      [TASK-20260809-7bab1e, TASK-20260809-9b78b2, TASK-20260809-8ab82c]. The
      source_task_ids of TASK-20260809-877f6b and TASK-20260809-9a49e4 are
      UNCHANGED. Every non-archive task is now covered exactly once, and the
      three archive tasks have DISJOINT path sets.
    the_repair_strengthens_the_gate_rather_than_weakening_it: >-
      Ranks 2 and 3 now wait on the VERIFIED ARCHIVE of the protocol act rather
      than on the producing task alone. An artifact that has been authored but
      not committed, digest-checked against its covering manifest and pushed
      has not closed a gate; under the first draft a producer could in
      principle have been dispatched on an authored-but-unarchived CM-1.
    how_the_drafting_act_is_covered_and_what_that_does_NOT_imply: >-
      SAID PLAINLY BECAUSE THE HONEST MAPPING IS SLIGHTLY AWKWARD AND THE
      AWKWARD VERSION IS THE TRUE ONE. TASK-20260809-93d82c is `completed` and
      its artifacts ARE this control plane — the batch record, the queue, the
      nine cards, the nine handoffs, this decision, the goal head update and
      the drafting receipt. They are committed BY THE DISPATCHING SESSION IN
      THE SAME COMMIT THAT LANDS THIS QUEUE, which necessarily happens BEFORE
      TASK-20260809-7bab1e runs. Covering 93d82c under 7bab1e therefore means
      7bab1e BINDS that already-made commit — recording its sha, its parent and
      a SHA-256 for every control-plane path, verified against the tree — and
      does NOT re-stage, re-author or re-commit any of it. THIS DOES NOT IMPLY
      A SEPARATE FUTURE COMMIT OF THE DRAFTING ACT'S ARTIFACTS AND MUST NOT BE
      READ AS PROMISING ONE. Leaving 93d82c uncovered is what the dispatcher
      rejected, and minting a third archive task to commit artifacts that are
      already committed would be a fictional act with a real budget line.
    the_budget_consequence:
      added_cost_seconds: 500
      added_task: TASK-20260809-7bab1e
      sizing_basis_has_no_line_for_it: >-
        STATED FLATLY. GOAL-AES-002 campaign_budget.sizing_basis decomposes
        BATCH-001 with exactly ONE snapshot line at 500 s, spent on
        TASK-20260809-877f6b. There is no second snapshot line, no
        coordination-archive line and no contingency line to draw from.
      disposition: DECLARED_OVERRUN_AGAINST_THE_8600_FIGURE
      batch_total_before: 8600
      batch_total_after: 9100
      why_an_overrun_and_not_a_reallocation: >-
        (1) THE COST IS NOT NEW, IT IS NEWLY VISIBLE. Rank 1's card always
        required its artifacts to be committed and PUSHED in an isolated
        coordination commit before the producers ran; the first draft left that
        commit as an implicit act of the dispatching session, CHARGED AT ZERO.
        That is the exact under-count GOAL-AES-001 discovered at its FIFTH
        batch. 8600 was an under-count from the moment rank 1's completion gate
        demanded a commit no line paid for, and declaring the task makes the
        true cost legible instead of free.
        (2) IT MAY NOT BE TAKEN OUT OF THE RANK-1 900 s LINE. A declared
        per-task budget is a BINDING STOP CONDITION, so shrinking rank 1 would
        silently shorten the authoring of CM-1 and the BLK-1 amendment — the
        two hard pre-dispatch gates of this question. It is also structurally
        impossible: an archive task must RUN ALONE and cannot share a stop
        condition with the task whose output it archives.
        (3) IT MAY NOT BE SIZED BELOW 500 s TO MAKE THE ARITHMETIC CLOSE. 500
        is the per-role snapshot reference. Sizing this task under its own
        role's reference so the batch total stayed at 8600 would be sizing the
        budget to the ambition — the exact failure
        protocol-amendment-GOAL-AES-001-005 Part A exists to stop making.
      campaign_level_consequence_named_not_pre_decided: >-
        8600 + 7700 + 6200 = 22500 EXACTLY, with no slack. A 9100 s BATCH-001
        puts the campaign at 23000 against a 22500 ceiling unless a later batch
        is re-sized. THIS DECISION DOES NEITHER. It does not re-size BATCH-002
        or BATCH-003 — moving another batch's line to absorb this batch's
        overrun is the same squeeze one level up, and would leave the campaign
        looking compliant while a later batch silently lost 500 s it was sized
        to need. It does not raise the 22500 ceiling, which this Coordinator
        has no basis to do on an accounting fact discovered while repairing a
        queue. THE 500 s EXCESS IS RECORDED AS AN OPEN CAMPAIGN-LEVEL
        ACCOUNTING FACT whose disposition is a later Coordinator budget act on
        the merits of what BATCH-001 actually produced. The honest options are
        exactly three — re-size BATCH-002 and/or BATCH-003 with their own
        recorded rationale; raise the ceiling by versioned protocol_amendment;
        or run BATCH-003 short and record what was dropped — and NONE is chosen
        here.
      what_this_is_not: >-
        NOT a rounding, NOT a correction of arithmetic, NOT a silent
        adjustment, and NOT evidence about AES. It is a Coordinator budget act
        with a recorded rationale, auditable against the 8600 decomposition
        preserved verbatim in batch.yaml under
        budget.decomposition_as_committed_in_sizing_basis.
    what_the_repair_did_not_change: >-
      No status transition, no completion criterion met, no evidence record, no
      hypothesis, no knowledge promotion, no claim about AES at any round
      count, no change to the ranked shape's meaning, no change to any
      per-task deliverable set or completion gate other than the added task's
      own, no change to the EV-AES-005 ruling below, and no change to
      GOAL-AES-001.

  the_second_dispatcher_rejection_and_its_two_repairs:
    why_this_block_exists: >-
      BECAUSE THE QUEUE WAS REJECTED TWICE AND THE RECORD MUST SHOW TWO ROUNDS,
      NOT ONE. The repair recorded in the block above produced a queue that
      tools/research_dispatch.py REJECTED AGAIN, for two further defects, both
      of them this Coordinator's. Compressing that into a single clean pass
      would misrepresent how this control plane was produced, and a control
      plane whose own receipts flatter it cannot be trusted about anything
      harder.
    rejection_2a:
      error_verbatim: >-
        dispatch error: archive task TASK-20260809-7bab1e must directly depend
        on source TASK-20260809-93d82c
      the_defect: >-
        The round-1 repair gave TASK-20260809-7bab1e source_task_ids
        [TASK-20260809-93d82c, TASK-20260809-23abf9] but depends_on
        [TASK-20260809-23abf9] alone. tools/research_dispatch.py requires an
        archive task to DIRECTLY DEPEND ON EVERY TASK IN ITS
        archive.source_task_ids: the coverage relation must be visible in the
        dependency graph, not merely asserted in the archive block.
      the_repair: >-
        TASK-20260809-7bab1e depends_on is now
        [TASK-20260809-93d82c, TASK-20260809-23abf9], reconciled across the
        queue, ledger/handoffs/TASK-20260809-7bab1e.yaml, that task's card and
        batch.yaml task_inventory and archive_coverage. TASK-20260809-93d82c is
        state `completed`, so the added edge is SATISFIED AT DISPATCH and
        delays nothing; it adds explicitness, not sequencing.
      what_it_does_not_change: >-
        NOTHING about the honest mapping recorded above: TASK-20260809-93d82c's
        artifacts are BOUND by that archive, not re-staged by it, and the added
        dependency is NOT a promise of a second commit of them. No ordering, no
        budget line, no deliverable and no completion gate moved.
    rejection_2b:
      error_verbatim: >-
        dispatch error: ledger archive TASK-20260809-9a49e4 must own exact
        artifacts under ledger/evidence/ and ledger/decisions/
      the_defect: >-
        TASK-20260809-9a49e4 declared only its two receipt paths and an EMPTY
        archive.record_ids, because this decision had ruled that both closing
        record ids be minted at write time. tools/research_dispatch.py
        `_validate_ledger_archive` requires a ledger-kind archive's
        artifact_paths to own at least one path under ledger/evidence/ and at
        least one under ledger/decisions/; `_ledger_record_matches_path`
        requires each record's id to be visible in its filename; and
        archive.record_ids must list them. A LEDGER ARCHIVE WHOSE RECORD IDS
        ARE UNKNOWN AT QUEUE TIME CANNOT BE QUEUED AT ALL. The rule is what
        forced these identifiers to be declared now.
      the_repair: >-
        Both ids were drawn with tools/allocate_id.py and `--check`ed free
        across the union of committed and in-flight state, and are DECLARED
        HERE AND IN THE QUEUE: evidence EV-AES-790d63 at
        ledger/evidence/EV-AES-790d63.yaml and closing decision
        DEC-20260809-9d8e92 at ledger/decisions/DEC-20260809-9d8e92.yaml, both
        listed in TASK-20260809-9a49e4's artifact_paths and
        archive.record_ids, with commit_sha, parent_sha and path_sha256 left
        null/empty for the committing session. knowledge/INDEX.md was REMOVED
        from that task's write scope in the same repair: it is generated,
        `.gitignore`d under CLAUDE.md's concurrency rules, and must never be
        committed.
      these_two_records_do_not_exist_and_are_not_created_here: >-
        SAID EXPLICITLY SO NO LATER SESSION MISREADS THE DECLARATION AS A
        PROMISE ABOUT THE RESULTS. Neither EV-AES-790d63 nor
        DEC-20260809-9d8e92 exists; neither is created by this decision or by
        the queue; and neither may be written before TASK-20260809-9a49e4 runs.
        NOTHING HAS BEEN MEASURED: no producer has run, CM-1 does not exist, no
        ideation has been performed and no envelope has been measured. What is
        fixed is WHICH TWO FILES the closing archive will write. What they SAY
        is authored then, on BATCH-001's real results and on nothing else —
        and `inconclusive`, an invalid or incomplete run set returned to its
        producer, or a rank-1 package returned INCOMPLETE are all outcomes
        these identifiers accommodate without alteration.
      relation_to_the_ev_aes_005_collision: >-
        THIS IS ALSO THE CLEAN RESOLUTION OF THAT COLLISION, AND IT REPLACES
        THE EARLIER REMEDY WITHOUT TOUCHING THE FINDING. The collision — that
        the committed goal next_action names EV-AES-005, which is already bound
        to GOAL-AES-003 — is the durable finding and stands unchanged below.
        Its first proposed remedy, an instruction telling a future session to
        mint fresh at write time, is SUPERSEDED: a verified-free identifier
        declared in a reviewable control-plane record is strictly better than a
        card instructing a future session to mint one, and the dispatcher
        leaves no alternative in any case.
    the_cost: >-
      NO TASK AND NO BUDGET LINE WERE ADDED BY EITHER ROUND-2 REPAIR. They
      corrected two fields of two already-declared tasks. The batch total stays
      at 9100 s and the 500 s campaign-level accounting fact recorded above is
      unchanged, neither worsened nor quietly improved.
    what_the_round_2_repairs_did_not_change: >-
