  the_ev_aes_005_collision_and_the_correction: >-
    STATED PLAINLY BECAUSE IT IS A CORRECTION TO A COMMITTED INSTRUCTION, NOT A
    DETAIL. The GOAL-AES-002 next_action instructs the BATCH-001 ledger archive
    to carry `EV-AES-005`. THAT IDENTIFIER IS ALREADY BOUND TO GOAL-AES-003:
    ledger/evidence/EV-AES-005.yaml carries hypothesis_id RQ-AES-003 and
    task_ids TASK-20260802-902 through TASK-20260802-908. It was read during
    this act to confirm the binding rather than to take it on trust. Reusing it
    would shadow a committed, immutable evidence record of another goal —
    exactly the identifier collision CLAUDE.md's ID-allocation rule exists to
    prevent, and exactly the mechanism that rule describes: every concurrent
    worktree asks the same committed state for "the next free number", gets the
    same answer, and mints the same identifier for different records,
    discovered only at merge time when both are immutable.
    THE RULING, UNCHANGED: EV-AES-005 IS NOT REUSED, NOT EDITED, NOT
    SUPERSEDED, NOT RENAMED AND NOT CITED AS THIS BATCH'S EVIDENCE.
    THE REMEDY, REPLACED: the BATCH-001 evidence record is EV-AES-790d63 at
    ledger/evidence/EV-AES-790d63.yaml and the BATCH-001 closing decision is
    DEC-20260809-9d8e92 at ledger/decisions/DEC-20260809-9d8e92.yaml. Both were
    drawn with tools/allocate_id.py and `--check`ed free across the union of
    committed and in-flight state, and both are declared in
    TASK-20260809-9a49e4's artifact_paths and archive.record_ids.
    TASK-20260809-9a49e4 uses exactly those two and draws no new id; if either
    is found bound to another record at write time the executing session STOPS
    and escalates and does NOT fall back to a scanned "next free" number, which
    is the bug the allocator exists to remove.
    NEITHER RECORD EXISTS YET AND NEITHER IS CREATED BY THIS DECISION. Nothing
    has been measured and nothing is implied about what they will say; only
    which two files the closing archive will write is fixed.
    WHY THE REMEDY CHANGED, STATED SO IT IS NOT MISTAKEN FOR A CHANGE OF MIND
    ABOUT THE COLLISION: tools/research_dispatch.py `_validate_ledger_archive`
    and `_ledger_record_matches_path` require a ledger archive to own exact
    artifacts under ledger/evidence/ and ledger/decisions/ with their record ids
    visible in the filenames and listed in archive.record_ids, so a ledger
    archive whose ids are unknown at queue time cannot be queued. The queue was
    rejected on exactly that — see
    the_second_dispatcher_rejection_and_its_two_repairs.rejection_2b.
    THE SUPERSEDED REMEDY, PRESERVED VERBATIM RATHER THAN DELETED: "The
    BATCH-001 evidence record AND the BATCH-001 closing decision are MINTED
    FRESH AT WRITE TIME inside TASK-20260809-9a49e4 with `python3
    tools/allocate_id.py --next evidence --area AES` and `python3
    tools/allocate_id.py --next coordinator_decision --date <the write date>`,
    each `--check`ed before use, and the drawn ids are written into the archive
    receipt, into archive.record_ids and into the record filenames at that
    point. NO identifier is pre-minted by this decision, and the queue's
    ledger-archive `record_ids` is EMPTY BY FACT rather than by omission." Its
    underlying caution — that naming an identifier which has not been DRAWN is
    how collisions are minted — remains correct and is honoured, because both
    declared ids were drawn and checked before being named.
    THE SUPERSEDED GOAL INSTRUCTION IS PRESERVED VERBATIM in the goal record
    under `next_action_superseded_20260809`. A committed instruction is not
    destroyed because one clause of it proved unexecutable; it is superseded in
    view.

