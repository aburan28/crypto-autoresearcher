coordinator_decision:
  id: DEC-20260810-334c34
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  recorded_by_task: TASK-20260810-915bd2
  decision: supersede

  supersedes:
    record: DEC-20260810-17d5e8
    scope: PARTIAL
    what_is_superseded: >-
      EXACTLY ONE ITEM: the `official_outcome` block of DEC-20260810-17d5e8, which
      assigned TASK-20260810-c1cfd5 the outcome `completed` and directed that
      `completed` be recorded as its queue state. That assignment is shown by
      direct test to be UNREPRESENTABLE in the queue the decision governs, and is
      withdrawn. DEC-20260810-17d5e8 is committed and immutable; it is not edited.
    what_still_stands: >-
      EVERYTHING ELSE IN DEC-20260810-17d5e8, unqualified except where the
      `scoped_operational_qualification` below says otherwise, and NOT re-litigated
      here: (1) the content verification — all twenty-two declared paths
      byte-identical at d0c6d7e130b670087c81493bd4b78ef0c34db867 and at HEAD, every
      digest well-formed and distinct, no scope expansion; (2) the acceptance of
      the BATCH-2b0fd1 opening archive as a TWO-COMMIT, CONTENT-VERIFIED archive on
      CLAUDE.md's content-first basis; (3) DEF-1 and DEF-2 with their remedies, DEF-2
      now discharged because both commit messages name all fourteen record_ids
      including RQ-AES-002; (4) the binding on TASK-20260810-f7bc82,
      TASK-20260810-1a81be and TASK-20260810-9f661a to write their receipt BEFORE
      staging and to name every archive.record_ids identifier in their commit
      message; (5) the recorded queue-backfill VALUES, which remain factually
      correct.
    what_is_not_disturbed: >-
      The archived artifacts themselves. NOTHING IN THIS DECISION CASTS ANY DOUBT
      ON THE TWENTY-TWO ARCHIVED BYTES. They are committed, published, merged to
      main in PR #308 and content-verified. What has failed is the QUEUE'S MODEL OF
      THAT ARCHIVE, not the archive.

  decision_scope: >-
    ADJUDICATES THE QUEUE STATE AND REPAIR PATH OF ONE ARCHIVE ACT. It reviews no
    evidence, creates no hypothesis, moves no hypothesis, research-question,
    experiment or goal status, approves no cryptanalytic measurement, records no
    attestation and no review verdict, claims no closure quorum, promotes no
    knowledge, and ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It states no
    margin, so RQ-AES-002's R5 anti-laundering clause has nothing to attach to
    (SC-4, SC-7); it makes no comparison against the published state of the art,
    which is unadjudicable in this environment in both directions (SC-6); it cites
    no recalled literature figure in either direction (SC-5); it asserts no
    reduced-round finding, which belongs to RQ-AES-001's ceiling (SC-8). It touches
    no GOAL-AES-001 and no GOAL-AES-003 record.

  context: >-
    DEC-20260810-17d5e8 and the TASK-20260810-c1cfd5 receipt were committed
    (b151eb318 carries the receipt alone; 0fd543fe9 carries DEC-20260810-17d5e8,
    TASK-20260810-e72d61 and the GOAL-AES-002 next_action edit). Both commit
    messages name all fourteen record_ids including RQ-AES-002, discharging DEF-2's
    remedy. tools/validate_ledger.py passes: 5592 records, no new violations. The
    dispatching session then attempted to advance the queue AND TESTED THAT
    ADVANCE RATHER THAN ASSUMING IT. The test failed, and its failure mode shows
    that `completed` is not merely irregular for TASK-20260810-c1cfd5 but
    unreachable, for a reason that is NOT the sequencing deviation and NOT the
    prior session's doing.

  the_test:
    performed_by: >-
      THE DISPATCHING SESSION. The session that authored this decision has no
      Bash, ran no command, and reproduced nothing independently. Every fact in
      this block is recorded on that attribution.
    it_was_run_not_reasoned_about: >-
      STATED EXPLICITLY because the distinction is the whole value of this record.
      The dispatching session did not predict this failure from reading the source;
      it copied the queue to a scratch file, mutated the copy, executed the
      dispatcher against it, and read the error. The scratch probe was then thrown
      away and dispatch_queue.json was NOT edited.
    method: >-
      Copy coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/dispatch_queue.json
      to a scratch file; in the copy set TASK-20260810-c1cfd5 `state: completed`
      and backfill `archive.commit_sha:
      d0c6d7e130b670087c81493bd4b78ef0c34db867`, `archive.parent_sha:
      3cc95d80ddec1c2fb401ef817e76045c6e1ace78` and `archive.path_sha256` over the
      dispatcher's own expected set.
    command_form: >-
      python3 tools/research_dispatch.py <scratch queue> --output <path> --report
      <path> --repo-root .
    verbatim_error: >-
      dispatch error: archive task TASK-20260810-c1cfd5 commit must change exactly
      declared archive and source artifacts (missing
      ['coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-c1cfd5/snapshot-receipt.json'];
      extra [the 9 task-cards/TASK-20260810-*.md and the 9
      ledger/handoffs/TASK-20260810-*.yaml])
    verbatim_error_fidelity_note: >-
      THE `missing` LIST IS VERBATIM. The `extra` list as transmitted to the
      authoring session was ABBREVIATED BY THE DISPATCHING SESSION into the
      bracketed description shown; the full literal eighteen-path list the tool
      printed was not transmitted and is NOT reconstructed here. The abbreviation
      is unambiguous — it names the nine task cards and the nine handoffs — but it
      is not quoted output and is not presented as such (SC-10).
    mechanism_reported: >-
      tools/research_dispatch.py, GitRepositoryVerifier.verify_archive (around line
      1023) with the state check at 572-581, computes `expected_paths` as the
      archive task's own `artifact_paths` UNION its source tasks' `artifact_paths`.
      For TASK-20260810-c1cfd5 that is exactly FIVE paths — the snapshot receipt,
      batch.yaml, dispatch_queue.json, DEC-20260810-ba50dc.yaml and
      GOAL-AES-002.yaml — because TASK-20260810-095c67's queue entry declares only
      four artifact_paths. The strict path check applies WHENEVER commit_sha
      resolves AND is an ancestor of HEAD; the content-only fallback fires ONLY
      when the commit does not resolve or is not an ancestor, so it does NOT apply
      here.

  named_defects:
    - id: DEF-3
      status: NEW — not recorded in DEC-20260810-17d5e8
      name: >-
        THE CARD'S STAGING LIST AND THE QUEUE'S artifact_paths DISAGREE, AND THE
        QUEUE IS WHAT THE VERIFIER READS
      statement: >-
        The TASK-20260810-c1cfd5 card instructs the archiver to stage TWENTY-TWO
        paths. The queue declares FIVE as the expected set, because
        TASK-20260810-095c67's entry lists only four artifact_paths — batch.yaml,
        dispatch_queue.json, DEC-20260810-ba50dc.yaml and GOAL-AES-002.yaml — while
        its own `write_scope` in the same entry covers all thirteen path entries
        that produced the nine task cards and nine handoffs. The queue entry
        therefore contradicts BOTH its own write_scope AND the committed card.
      root_cause: >-
        A DECLARATION DEFECT IN THE BATCH'S OWN CONSTRUCTION, present at
        TASK-20260810-095c67 before any commit was made. TASK-20260810-095c67
        under-declared its artifact_paths relative to what it actually produced and
        relative to what its own write_scope authorised.
      the_consequence_that_matters: >-
        EVEN A PERFECTLY SEQUENCED SINGLE COMMIT THAT FOLLOWED THE CARD EXACTLY
        WOULD ALSO HAVE FAILED VERIFICATION — with the same eighteen extra paths and
        without the missing receipt. THE SEQUENCING DEVIATION IS THEREFORE NOT THE
        ONLY BARRIER AND THE PRIOR SESSION'S COMMIT IS NOT THE SOLE CAUSE.
        DEC-20260810-17d5e8 attributed the whole irregularity to DEF-1. That
        attribution was incomplete, and this record corrects it: an archiver who had
        done everything the card asked would have hit the same wall.
      not_the_archived_content: >-
        DEF-3 is a defect in a coordination declaration, not in any archived byte.
        No digest changes and no record is mis-bound.
      status_of_095c67: >-
        NOT CHANGED. TASK-20260810-095c67 remains `completed`. Its work was done,
        is committed, and is content-verified; the defect is in what its queue entry
        DECLARED it would produce, and that defect bites the archive task, not the
        producing task. No status transition is made here.
    - id: DEF-4
      status: NEW AND PREDICTED, NOT ESTABLISHED
      name: >-
        THE SAME CLASS OF MISMATCH IS VISIBLE AT TASK-20260810-9f661a, IN MIRROR
        FORM
      statement: >-
        Read directly from the committed queue: TASK-20260810-9f661a's
        `write_scope` includes
        coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-9f661a,
        but its `artifact_paths` lists ONLY ledger/evidence/EV-AES-abf3dc.yaml and
        ledger/decisions/DEC-20260810-6c00b4.yaml. Its receipt path is therefore NOT
        in artifact_paths. With source tasks TASK-20260810-1166f2 and
        TASK-20260810-9fc65d contributing one report each, its expected_paths is
        FOUR, and a receipt written into its own archive directory would appear as a
        FIFTH, EXTRA path — the same failure in mirror form: c1cfd5 has sources
        under-declared, 9f661a has its own deliverable under-declared.
      why_it_is_only_predicted: >-
        This is an inference from reading the committed queue against the mechanism
        the dispatching session reported. IT HAS NOT BEEN TESTED. No probe was run
        against TASK-20260810-9f661a and the authoring session has no shell with
        which to run one. It is recorded as a PREDICTION TO CHECK, never as an
        established failure (SC-9).
      how_to_confirm: >-
        The same method that established DEF-3: scratch copy of the queue, set the
        chain to completed with a plausible archive block for 9f661a, run
        tools/research_dispatch.py against the copy, read the error, discard the
        copy. Cheap, and it costs nothing to run BEFORE 9f661a is dispatched rather
        than after its work is done.
      checked_and_clean: >-
        TASK-20260810-f7bc82 and TASK-20260810-1a81be were checked the same way by
        reading and DO NOT carry this defect: each lists its own receipt in
        artifact_paths, and each source task's artifact_paths are files that a
        single new commit will genuinely create. f7bc82 expects four paths and its
        card stages four; 1a81be expects six and its sources produce five plus its
        receipt. Their cards were not re-read line by line, so this is a queue-level
        check, not a card-level one.

  official_outcome:
    task_id: TASK-20260810-c1cfd5
    withdrawn_outcome: completed
    outcome: invalid
    queue_state_to_record: invalid
    archive_block_to_record: >-
      EMPTY. commit_sha null, parent_sha null, path_sha256 {} — left exactly as it
      stands today. THIS IS LOAD-BEARING, NOT COSMETIC: the probe shows the strict
      path check fires precisely WHEN commit_sha resolves and is an ancestor of
      HEAD. Installing the backfill values into this task's archive block is what
      TRIGGERS the hard dispatch error, so an empty archive block is what keeps the
      dispatcher runnable at all for this batch.
    justification: >-
      `completed` IS UNREACHABLE, not merely irregular. No commit that exists
      changes exactly the five declared paths, and none could now be made to:
      d0c6d7e13 is immutable and merged to main, the eighteen card-and-handoff
      paths are already at their final content so a new commit cannot change them
      again, and the receipt is in a different commit. `invalid` is the accurate
      terminal verdict ON THE ARCHIVE ACT AS DECLARED — the act cannot be verified
      against its own contract — and it says nothing against the archived bytes,
      which DEC-20260810-17d5e8 verified and which this record leaves untouched.
    why_not_queued: >-
      REJECTED ON THE MERITS, NOT BY DEFAULT. `queued` asserts something false —
      that the task is pending execution and could succeed if executed. It cannot
      succeed. AND IT CARRIES A LIVE COST THAT MUST BE NAMED: the dispatcher will
      go on offering TASK-20260810-c1cfd5 as the ONLY ready task to every future
      session that opens this batch. Each such session would re-read the card,
      redo the archival reasoning, hit the same unsatisfiable contract and burn its
      budget rediscovering this record — a live loop, and a worse one than a stall,
      because a session that tries to be helpful may commit something to make the
      task look done and add a third irregular commit to a batch that already has
      two. Leaving a known-unsatisfiable task in a ready state is an invitation to
      exactly that.
    why_not_blocked: >-
      CONSIDERED AND REJECTED AS A PERMANENT ANSWER. `blocked` would stop the loop
      without asserting a terminal verdict, but it UNDERSTATES the finding: it
      implies the task could still run once its blocker clears, and no blocker
      clearing makes this contract satisfiable. `blocked` is defensible ONLY as an
      interim if the repair act below cannot be performed promptly — it is
      strictly better than `queued` and strictly worse than the truth — and it must
      not be left standing.
    the_cost_of_invalid_named_honestly: >-
      `invalid` is TERMINAL. TASK-20260810-4a478d depends on TASK-20260810-c1cfd5,
      so recording `invalid` alone converts a live loop into a DEADLOCK: 4a478d can
      never become ready behind a dependency that can never complete, and the whole
      batch stops. Per AGENTS.md an invalid archive blocks successors until the
      Coordinator creates a scoped repair or successor task. THEREFORE `invalid`
      MUST NOT BE RECORDED ALONE. It is authorised here only as part of the single
      repair act specified below, which creates the successor and repoints the
      dependency in the same act. Recording `invalid` without the successor would
      be a worse outcome than leaving the task `queued`.

  the_repair:
    authorised_act: >-
      ONE in-scope task, whose declared write_scope covers
      coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/dispatch_queue.json,
      performing ALL THREE of the following IN THE SAME ACT. Any subset is worse
      than doing nothing.
    steps:
      - >-
        (i) Set TASK-20260810-c1cfd5 `state: invalid`, leave its `archive` block
        EMPTY (commit_sha null, parent_sha null, path_sha256 {}), and add a
        completion note citing DEC-20260810-17d5e8 for the content verification and
        DEC-20260810-334c34 for the outcome.
      - >-
        (ii) Add a successor task carrying NO `archive` BLOCK AT ALL, whose
        `artifact_paths` is exactly one new file — a re-attestation receipt under
        coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/<successor-id>/
        — which it commits alone. That receipt re-binds the twenty-two paths by the
        sha256 values already recorded in DEC-20260810-17d5e8 and in the committed
        TASK-20260810-c1cfd5 receipt, and cites both. Mint its id with
        `python3 tools/allocate_id.py --next handoff --date <YYYYMMDD>` and
        `--check` it; do not guess one.
      - >-
        (iii) Repoint TASK-20260810-4a478d's `depends_on` from
        TASK-20260810-c1cfd5 to the successor, so the RANK 1 protocol act becomes
        reachable again.
    why_no_archive_block_on_the_successor: >-
      STATED PLAINLY BECAUSE IT IS A REAL TRADE AND NOT A TRICK. An `archive` block
      is what invokes GitRepositoryVerifier's path-set check. A successor carrying
      one would inherit a version of the same problem, because the artifacts it
      would want to attest are already committed and a new commit cannot change
      them again. Omitting the block means THE DISPATCHER NO LONGER AUTOMATICALLY
      VERIFIES THIS ARCHIVE. That is a genuine reduction in automatic checking and
      is recorded as such rather than hidden. What replaces it is not nothing: under
      CLAUDE.md's content-first rule the binding is by sha256, and the twenty-two
      digests are committed in three independent places — the TASK-20260810-c1cfd5
      receipt at b151eb318, DEC-20260810-17d5e8 at 0fd543fe9, and the successor
      receipt — so any auditor can re-verify by hand against
      d0c6d7e130b670087c81493bd4b78ef0c34db867. The verification is manual, not
      absent.
    must_be_probed_before_commit: >-
      THE SUCCESSOR'S EXACT SHAPE MUST BE TESTED THE WAY DEF-3 WAS FOUND — scratch
      copy, run tools/research_dispatch.py, read the result, discard — BEFORE it is
      committed. The authoring session has no shell and has NOT verified that
      research_dispatch.py accepts a coordinator task with no archive block in this
      position, nor that repointing depends_on leaves the review chain valid. Those
      are OPEN AND UNCHECKED. Committing an untested repair for a defect that was
      itself found only by testing would be the same mistake twice.
  rejected_repairs:
    - option: >-
        (a) Amend TASK-20260810-095c67's `artifact_paths` in the committed queue
        from four paths to the full twenty-two, so expected_paths matches a real
        commit.
      verdict: REJECTED — IT DOES NOT WORK.
      why: >-
        expected_paths would become the twenty-two source paths UNION the c1cfd5
        receipt = TWENTY-THREE. Commit d0c6d7e13 changes twenty-two. The verifier
        would still fail, now reporting the receipt as missing. DEF-1 is
        unrepairable, so no amendment of the source declaration alone can succeed.
        This is a matter of arithmetic, not of judgement.
      on_permissibility_since_it_was_asked: >-
        ANSWERED EVEN THOUGH THE OPTION FAILS ANYWAY. dispatch_queue.json is a
        coordination record, not evidence and not a ledger record, and it is mutable
        by design — the dispatcher itself writes task states into it. AGENTS.md rule
        2's immutability binds run records, ledger records and knowledge entries, not
        the dispatch queue. So amending it is NOT categorically forbidden. But
        amending a COMPLETED task's artifact_paths after observing which commit was
        made is fitting the contract to the outcome, and it is admissible only as a
        correction to a demonstrable transcription defect — which DEF-3 is, since
        the entry contradicts its own write_scope and its own committed card — and
        only with the correction recorded. It is refused here because it fails, not
        because it is forbidden.
    - option: >-
        (a') The variant that WOULD pass: amend 095c67's artifact_paths to the
        twenty-two AND remove the receipt from TASK-20260810-c1cfd5's own
        artifact_paths, making expected_paths exactly the twenty-two of d0c6d7e13.
      verdict: REFUSED AS A FABRICATION.
      why: >-
        It would declare that the archive task produces no artifact, when the
        receipt is its sole declared deliverable in both its committed card and its
        committed handoff, and when that receipt exists and is committed at
        b151eb318. Editing a task's declared deliverable out of existence so that a
        check passes is falsifying the record to satisfy the checker. Named here
        rather than silently omitted, so that a later session does not rediscover it
        as a clever fix.
    - option: >-
        (b-variant) A successor snapshot task WITH an archive block whose
        source_task_ids point at TASK-20260810-095c67.
      verdict: REJECTED — IT DOES NOT WORK.
      why: >-
        It would reintroduce 095c67's artifact_paths into expected_paths, and those
        files are already at their final committed content, so a new commit cannot
        change them. The verifier would report every one of them missing from the
        new commit.

  scoped_operational_qualification:
    subject: DEC-20260810-17d5e8's queue-backfill instruction
    the_values_stand: >-
      The recorded values are FACTS and are NOT superseded: commit_sha
      d0c6d7e130b670087c81493bd4b78ef0c34db867, parent_sha
      3cc95d80ddec1c2fb401ef817e76045c6e1ace78, and the twenty-two path_sha256
      entries. Every one remains correct and remains the archive's content binding.
    what_is_qualified: >-
      THEIR INSTALLATION INTO THE QUEUE, which the probe shows is the trigger for
      the hard dispatch error: the scratch run that failed is precisely the run in
      which they were backfilled. While TASK-20260810-c1cfd5 stands `invalid`, its
      archive block MUST REMAIN EMPTY, and the backfill directed by
      DEC-20260810-17d5e8 MUST NOT BE PERFORMED. The values continue to live in
      DEC-20260810-17d5e8, in this decision by reference, and in the committed
      receipt — three durable places, none of which is the queue.
    honesty_note: >-
      This is a qualification of an INSTRUCTION, not of the VALUES, and it is
      declared rather than folded silently into "everything else stands", because a
      later session acting on DEC-20260810-17d5e8's next_actions list would
      otherwise perform a backfill this record knows breaks the dispatcher.

  rationale:
    - >-
      The dispatching session tested the advance instead of assuming it, and the
      test refuted a decision this Coordinator had already committed. That is the
      system working. The correct response is a superseding record on the merits,
      not an edit to an immutable one, and not a quiet re-reading of the original
      to make it survive.
    - >-
      DEF-3 changes the causal story materially and in a direction that reduces
      blame on the prior session: the archive was unverifiable by construction
      before any commit existed. DEC-20260810-17d5e8 attributed the irregularity
      entirely to DEF-1. Leaving that attribution standing would misdescribe both
      the incident and the fix.
    - >-
      `completed` cannot be recorded for a task whose contract no commit can
      satisfy. `queued` cannot be left standing for a task the dispatcher will keep
      offering and no session can finish. `invalid` is the only accurate state, and
      it is safe only when issued together with the successor that unblocks
      TASK-20260810-4a478d.
    - >-
      The batch's scientific content is untouched by all of this. No producer has
      run, no measurement exists, no claim about AES has been made or withdrawn.
      What is being repaired is bookkeeping, and it is worth repairing precisely
      because the bookkeeping is what future reviewers will trust.
    - >-
      DEF-4 was found by reading the queue against the mechanism the probe exposed,
      and costs nothing to check before TASK-20260810-9f661a is dispatched rather
      than after its evidence record is written. Finding the same defect twice, the
      second time after a producer has done the work, would be the avoidable
      failure.

  evidence_refs:
    - >-
      The dispatching session's execution of tools/research_dispatch.py against a
      scratch copy of the BATCH-2b0fd1 queue, and its verbatim error — recorded
      under `the_test`, with the `missing` list quoted and the `extra` list marked
      as abbreviated in transmission.
    - >-
      DEC-20260810-17d5e8 (committed at 0fd543fe9) — the decision this record
      partially supersedes, and the standing source of the content verification and
      the twenty-two digests.
    - >-
      coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/TASK-20260810-c1cfd5/snapshot-receipt.json
      (committed at b151eb318) — the covering manifest binding the twenty-two paths
      by sha256.
    - >-
      coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/dispatch_queue.json —
      read directly for the TASK-20260810-095c67, TASK-20260810-f7bc82,
      TASK-20260810-1a81be and TASK-20260810-9f661a entries underlying DEF-3 and
      DEF-4.
    - >-
      Commit d0c6d7e130b670087c81493bd4b78ef0c34db867, parent
      3cc95d80ddec1c2fb401ef817e76045c6e1ace78, merged to main in PR #308.
  evidence_refs_note: >-
    NO EV-* RECORD IS CITED because none exists and none is created. These are
    tooling, archival and coordination artifacts. This decision must not be read as
    an evidence review, and the dispatcher error is INFRASTRUCTURE SIGNAL, never a
    negative mathematical result (AGENTS.md rule 5).

  limitations:
    - >-
      THE AUTHORING SESSION RAN NOTHING. It has no Bash. The probe, its command,
      its error and the commit facts were performed and reported by the dispatching
      session and are recorded on that attribution. No independent reproduction was
      attempted; that is OPEN AND UNATTEMPTED, never tried and never found negative.
    - >-
      The `extra` path list in the recorded error was abbreviated by the dispatching
      session in transmission. The eighteen paths it names are unambiguous, but the
      literal tool output for that clause is not quoted here.
    - >-
      DEF-4 IS A PREDICTION, NOT A FINDING. It follows from reading the committed
      queue against the reported mechanism and has NOT been tested.
    - >-
      The clean readings for TASK-20260810-f7bc82 and TASK-20260810-1a81be are
      QUEUE-LEVEL checks. Their task cards were not re-read line by line against
      their queue entries, so a card-versus-queue mismatch of the DEF-3 kind is not
      excluded for them.
    - >-
      The recommended repair has NOT been tested. Whether research_dispatch.py
      accepts a coordinator task with no archive block in this position, and whether
      repointing depends_on leaves the review chain valid, are OPEN AND UNCHECKED
      and must be probed before the repair is committed.
    - >-
      This decision does not itself edit dispatch_queue.json, ledger/goals/, or any
      task card. TASK-20260810-c1cfd5 still reads `state: queued` in the committed
      queue until the repair act runs, so the live loop risk named above is ACTIVE
      RIGHT NOW. Any session that picks up TASK-20260810-c1cfd5 before the repair
      lands must read this record first.
    - >-
      No goal completion criterion is met, none is claimed, and no closure quorum is
      asserted or required.

  next_actions:
    - >-
      Commit this decision and ledger/handoffs/TASK-20260810-915bd2.yaml with the
      corrected GOAL-AES-002 next_action, naming GOAL-AES-002, RQ-AES-002,
      BATCH-2b0fd1, DEC-20260810-17d5e8, DEC-20260810-334c34, TASK-20260810-c1cfd5
      and TASK-20260810-915bd2 in the commit message; push and refresh the PR.
    - >-
      Dispatch ONE in-scope repair task performing all three steps of `the_repair`
      together: c1cfd5 to `invalid` with an empty archive block, the successor
      re-attestation task with no archive block, and TASK-20260810-4a478d's
      depends_on repointed to it. Probe the shape on a scratch queue copy BEFORE
      committing it.
