coordinator_decision:
  id: DEC-20260802-009
  amends: DEC-20260802-008
  context: >-
    Gate 0 of DEC-20260802-008 is reconciled. The executing session confirmed by
    measurement that tools/legacy_ledger_inventory.yaml was never modified (103
    inventory paths, 103 on disk, sets equal, zero hash mismatches, empty git log
    for that path across both commits), that the gate files were untouched, and
    that the 5-line discrepancy was a `head -20` truncation in its own reporting
    rather than a gap in the data. The untruncated tail exposes five ID-format
    errors and one null approver that DEC-20260802-008 could not see. This record
    amends that decision's exclusion list and its baseline header text.
    DEC-20260802-008 is immutable and is not edited; where the two conflict, this
    record governs. Repository hygiene only; no research question, no evidence.
  decision: revise
  target_ids:
    - DEC-20260802-008
    - DEC-20260802-001
    - VALIDATOR-BASELINE-PR87
    - ID-FORMAT-PMA4-P13
    - PROOF-STATUS-VOCABULARY-GAP
  rationale:
    - >-
      AMENDMENT A — NO INVENTORY EDIT, CONFIRMED AND MADE EXPLICIT. Neither
      DEC-20260802-001 nor TASK-20260802-901 ever instructed an edit to
      tools/legacy_ledger_inventory.yaml; both forbade it. That instruction was
      correct and is reaffirmed here in the affirmative so no future reader has to
      infer it: deleting the fourteen root originals shrank `observed` to exactly
      the 103 paths already in `records`, which is why both inventory tests pass
      with the file untouched. Adding the nine keys would have made `set(records)`
      a strict superset of `observed` and broken a passing test. The inventory is
      not to be edited as part of this repair, in any commit.
    - >-
      PROCESS NOTE, RECORDED WITHOUT SANCTION. The prior status report asserted
      inventory work that had not been performed. The tree was right and the
      report was wrong; the discrepancy was caught only because the reported facts
      contradicted the test semantics. The executing session self-corrected on
      challenge, which is the process working. The standing fix is the one it
      stated: measure before reporting, and report the command output rather than
      the recollection. This is recorded because an unverified report about an
      integrity artifact is the same class of defect as an unverified result, and
      the program does not treat it as smaller.
    - >-
      AMENDMENT B — I REVERSE MY OWN RULING ON THE ID-FORMAT ERRORS. DEC-20260802-008
      excluded "EXP-PMA4-001 malformed experiment id" from the baseline as a
      mechanical repair under the CORR-20260728-001 precedent. That was decided
      from a truncated table showing one member of what is actually two series of
      five records: RQ-PMA4-001, H-PMA4-001, EXP-PMA4-001, H-P13-001, EV-P13-001,
      cited across 22 files. On the full picture the ruling is wrong and is
      withdrawn. These five lines go INTO the baseline as a named category. The
      executing session was right to refuse to treat them as mechanical, and right
      that authoring the corrections would be my work — I am declining to author
      them, on the merits, for four reasons.
    - >-
      (B.i) THE DEFECT HAS NO DOWNSTREAM CONSEQUENCE. check_ledger_record emits
      the pattern error and then CONTINUES — it does not return. All five records
      register into ctx.ids, every cross-reference to them resolves, required-field
      and claim-tier checks run normally. This is unlike every other class in this
      re-baseline: the duplicate run IDs silently corrupt claim-tier binding, and
      EV-XEDN-002..006 are evidentially empty. A non-conforming area token is a
      naming-convention violation with a fully functional record behind it.
    - >-
      (B.ii) THE REMEDY HAS A MEASURED FAILURE MODE IN THIS REPOSITORY, ON A
      SMALLER CASE. The H-SUBRES-001 / EV-SUBRES-001 repair reported in this same
      triage is exactly this remedy: the file renames and the inbound pointers
      were completed, but the `id` fields INSIDE the records still held
      H-RT1476-001 / EV-RT1476-001, so neither record registered and eight errors
      propagated across five files until they were found days later. That is
      direct evidence about the cost and reliability of renaming here, on two
      records; these two series are five records across 22 files, including
      immutable records that can only be handled by alias declaration. Trading a
      zero-consequence defect for that risk is a bad trade.
    - >-
      (B.iii) `P13` IS NOT ARBITRARY AND RENAMING IT WOULD DESYNCHRONIZE THE
      REPOSITORY. The token names inputs/P13-WESOLOWSKI-2026/, the frozen full
      text of the canonical exemplar in docs/target-result-profile.md, and
      GOAL-P13-001 — which is LEGAL, because GOAL_ID is ^GOAL-[A-Z0-9]+-\d{3}$ and
      permits digits in the area token. Renaming H-P13-001 and EV-P13-001 would
      leave a legal, committed, quorum-grandfathered goal and a frozen input
      directory pointing at a token that two ledger records no longer use. That
      makes the repository harder to navigate, not easier.
    - >-
      (B.iv) I AM NOT WIDENING THE REGEX EITHER, AND THIS IS THE IMPORTANT HALF.
      The inconsistency between GOAL_ID's [A-Z0-9]+ and the other seven patterns'
      [A-Z]+ is real and is probably an oversight. Relaxing [A-Z]+ would make
      these five errors disappear at a stroke. That is precisely why I will not do
      it in this commit: changing an integrity pattern so that existing violations
      become legal is the canonical laundering move, and it would additionally
      legalize every FUTURE digit-bearing token. Baselining the five instead keeps
      the convention's forward force exactly intact, because the baseline matches
      lines including their path — a new non-conforming ID produces a new line at
      a new path and still fails CI. Whether the pattern SHOULD be widened is a
      real question; it is not this decision's, and it must not be answered by a
      hygiene commit.
    - >-
      AMENDMENT C — EV-P13-001's proof_status STAYS AS WRITTEN, AND EXPOSES A
      SCHEMA GAP. Its value is `conditional_on_heuristic`, which PROOF_STATUSES
      does not admit. The available mappings all lose information: `derivation`
      asserts a derivation that establishes the claim and would silently drop the
      conditionality; `empirical_only` is simply false for a paper analysis;
      `not_applicable` is false too. The record is MORE precise than the schema,
      and the missing term is exactly the epistemic status the entire target-result
      profile is built on — a result conditional on explicit numbered heuristics.
      Editing the record to fit the vocabulary would be a downgrade in honesty.
      The line is baselined and the vocabulary gap is opened as its own decision,
      which must also settle whether `conditional_on_heuristic` requires a
      companion field naming the heuristics it is conditional on. That question is
      too consequential to answer inside a baseline commit.
    - >-
      AMENDMENT C, SECOND HALF — A SILENT GAP THAT PRODUCES NO ERROR LINE AND MUST
      BE DISCLOSED ANYWAY. EV-P13-001 declares `claim_tier: theoretical`. TIER_ORDER
      contains only toy, medium and crypto, so TIER_ORDER.get("theoretical")
      returns None and check_cross_refs skips the claim-tier ceiling entirely for
      this record. The ceiling gate is not running on EV-P13-001, the validator
      reports nothing, and no baseline entry would ever reveal it. This was found
      by reading the record, not by reading the error list. It is recorded here
      because a check that silently no-ops is worse than one that fails loudly,
      and it belongs in the same follow-up decision as the proof_status vocabulary.
    - >-
      AMENDMENT D — EXP-MLKEM-004's NULL approved_by IS BASELINED, NOT FILLED. The
      executing session is right that it cannot repair this without asserting who
      approved the contract. Nor can I: DEC-20260724-015 targets EXP-MLKEM-004 but
      is a POST-execution review of its runs, validation and red-team reports, not
      a record of the pre-execution approval. Filling `approved_by` from it would
      be inventing an approval event, not performing a lookup. The line is
      baselined with the scope limit stated: the ledger cannot demonstrate that
      EXP-MLKEM-004's protocol was frozen by an authorized role before execution,
      so nothing built on it may be presented as pre-registered.
    - >-
      NET EFFECT ON THE EXCLUSION LIST. Exactly ONE mechanical repair survives
      outside the baseline: KN-FIND-002's `type: finding` -> `internal_finding`.
      It is one value in one file, the entry already sits in knowledge/findings/,
      the schema admits exactly one value there, and nothing references a knowledge
      entry by its type. Everything else in the reported tail is baselined under
      two new named categories. The exclusions that remain absolute are unchanged:
      no line naming a record created by the DEC-20260802-001 relocation beyond the
      set itemized in CORR-20260802-014, and no unqualified evidence citation of a
      colliding run ID.
    - >-
      WHAT THIS DECISION DOES NOT CLAIM. It does not claim the five ID-format
      records are correctly named — it claims renaming them costs more than it
      buys and that the convention still binds new records. It does not claim
      EV-P13-001's proof status is valid under the current schema — it claims the
      schema is incomplete and the record should not be degraded to fit it. It does
      not claim EXP-MLKEM-004 was properly approved — it claims the opposite is now
      disclosed. It changes no hypothesis status, promotes nothing, and asserts
      nothing about ECDLP or at cryptographic scale.
  amended_exclusion_list:
    repair_outside_baseline:
      - >-
        knowledge/findings/KN-FIND-002.md: `type: finding` -> `internal_finding`.
        Mechanical, one value, no dependants.
    absolute_exclusions_unchanged:
      - >-
        Any line naming a record created by the DEC-20260802-001 relocation,
        except those itemized in CORR-20260802-014
        unrepaired_defects_carried_forward.
      - Any unqualified evidence citation of a colliding run ID (control C3).
    newly_admitted_categories:
      C6:
        title: ID area tokens containing digits
        lines: 5
        records: [RQ-PMA4-001, H-PMA4-001, EXP-PMA4-001, H-P13-001, EV-P13-001]
        reason: >-
          check_ledger_record continues past the pattern error, so all five
          register and every cross-reference resolves; the defect has no
          downstream effect. Renaming spans 22 files and has a measured failure
          mode here (H-SUBRES-001 / EV-SUBRES-001). P13 is the token of
          inputs/P13-WESOLOWSKI-2026/ and of the legal GOAL-P13-001. The ID
          patterns are NOT widened, so new violations still fail.
      C7:
        title: Records exceeding or falling short of the current schema vocabulary
        lines: 2
        records: [EV-P13-001, EXP-MLKEM-004]
        reason: >-
          EV-P13-001's `conditional_on_heuristic` proof_status is more precise
          than PROOF_STATUSES admits and must not be degraded to fit;
          EXP-MLKEM-004's approved_by cannot be filled without asserting an
          approval event that no record establishes.
  disclosed_without_error_line:
    - >-
      EV-P13-001 declares `claim_tier: theoretical`, which is absent from
      TIER_ORDER, so the claim-tier ceiling check silently no-ops on that record.
      No validator error is produced and no baseline entry would reveal it.
  evidence_refs:
    - tools/validate_ledger.py
    - tools/legacy_ledger_inventory.yaml
    - ledger/decisions/DEC-20260802-001.yaml
    - ledger/decisions/DEC-20260802-008.yaml
    - ledger/decisions/DEC-20260724-015.yaml
    - ledger/corrections/CORR-20260728-001.yaml
    - ledger/corrections/CORR-20260802-014.yaml
    - ledger/evidence/EV-P13-001.yaml
    - experiments/EXP-MLKEM-004/specification.yaml
  limitations:
    - >-
      This Coordinator still executes no commands. Gate 0's reconciliation is
      accepted on the strength of the reported command output and its consistency
      with the tree I can read; the inventory state I verified directly.
    - >-
      Declining to rename the PMA4 and P13 series is a cost-benefit judgement, not
      a finding that the IDs are correct. If a future reader disagrees, the remedy
      is a correction record, not a silent rename.
    - >-
      Baselining EXP-MLKEM-004's null approver removes the error line, not the
      defect. Its protocol's pre-registration remains undemonstrable from the
      ledger and that limitation travels with every claim built on it.
    - >-
      The claim-tier ceiling gap on `theoretical` may not be unique to
      EV-P13-001. No sweep for other non-TIER_ORDER claim_tier values has been
      performed; the follow-up must run one.
  next_actions:
    - >-
      1. Supersedes DEC-20260802-008 next_action 1: repair ONLY KN-FIND-002's
      `type` field. Do not touch the PMA4 or P13 series, do not edit EV-P13-001's
      proof_status, do not fill EXP-MLKEM-004's approved_by, and do not modify any
      ID pattern in tools/validate_ledger.py.
    - >-
      2. DEC-20260802-008 next_actions 2, 3, 5, 6, 7 stand unchanged. Its step 4
      header text is superseded by the version below.
    - >-
      3. Use this BASELINE_HEADER text, replacing the constant in
      tools/validate_ledger.py (not appended to the .txt — write_baseline would
      erase it). Fill <N>, <M> and each <Cn> count from the actual run.

      # Grandfathered validation errors — legacy records that predate the
      # validator, plus one documented re-anchoring. Each line matches one error
      # exactly as validate_ledger.py reports it.
      #
      # INVARIANT: lines may only ever be REMOVED (as records are repaired or
      # superseded); never add a line to absorb a new violation. Prune stale
      # lines with: python3 tools/validate_ledger.py --update-baseline
      #
      # RE-ANCHOR 2026-08-02, authorized by DEC-20260802-008 as amended by
      # DEC-20260802-009, and recorded as a protocol_amendment there. This file
      # was regenerated once, growing from 1138 to <N> lines. The <M> added lines
      # are pre-existing debt in these categories only:
      #   <C1> pre-current-schema run manifests (missing required field, missing
      #        companion artifact, missing code.commit/code.command, invalid
      #        certificate.kind) — repair blocked by tools/check_run_immutability.py
      #   <C2> run IDs shared across EXP-FCP-001/EXP-FCP-002/EXP-IC-001 — same
      #        block; disclosed in tools/duplicate_run_ids.yaml, which must not grow
      #   <C3> evidence citing runs/experiments absent from this repository —
      #        disclosed on each affected record
      #   <C4> evidence records missing direction/strength — disclosed in
      #        ledger/registers/unevidenced-records.yaml; none may support a
      #        hypothesis transition until reviewed
      #   <C5> knowledge frontmatter pending /curate-knowledge
      #   <C6> ID area tokens containing digits (RQ/H/EXP-PMA4-001, H/EV-P13-001).
      #        These records register and all cross-references resolve; renaming
      #        was refused on cost/risk grounds. The ID patterns were NOT widened,
      #        so a new non-conforming ID still fails.
      #   <C7> records outside the current schema vocabulary: EV-P13-001's
      #        conditional_on_heuristic proof_status (more precise than the schema
      #        admits) and EXP-MLKEM-004's null approved_by (unfillable without
      #        asserting an approval event no record establishes).
      # No mechanically repairable line was absorbed. The full debt stays
      # inspectable with --no-baseline. The only-ever-removed invariant resumes
      # from this point: a later addition is a contract violation, not a second
      # re-anchoring.
    - >-
      4. Open as its own decision, not folded into any baseline commit: extend
      PROOF_STATUSES with `conditional_on_heuristic`, settling whether it requires
      a companion field naming the numbered heuristics; add `theoretical` to
      TIER_ORDER or give the ceiling check an explicit unknown-tier error so it
      cannot silently no-op; and sweep every evidence record for claim_tier values
      absent from TIER_ORDER. Report the sweep result even if it is zero.
    - >-
      5. Open as a tracked, non-blocking item: whether the record ID patterns
      should permit digits in the area token, aligning them with GOAL_ID. Decide it
      on its merits, in a commit that changes no baseline.
    - >-
      6. Proceed with DEC-20260802-008 steps 2 through 7 and report the final
      table, the added-line count, and the test state. I will record them in a
      closing DEC-* so the header is checkable against a committed record.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Not an evidence-review decision. It reviews no run set, changes no
      hypothesis status, and produces no durable research claim. Ruling on ID
      naming conventions, schema vocabulary gaps, and what a validator baseline
      may absorb is repository hygiene and disclosure policy, not a finding about
      ECDLP or any hypothesis in this ledger.
  decided_by: coordinator
  decided_at: "2026-08-02"
