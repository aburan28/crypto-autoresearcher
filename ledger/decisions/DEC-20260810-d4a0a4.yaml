coordinator_decision:
  id: DEC-20260810-d4a0a4
  context: >-
    GOAL-DREG-001 BATCH-005 closure. The batch's four dispatch-queue entries are
    all at state "completed" - TASK-20260731-016 (executor, chunked CTRL-B),
    TASK-20260731-025 (coordinator snapshot), TASK-20260731-026 (independent red
    team, RT-20260731-013), TASK-20260731-027 (coordinator ledger). Its evidence
    record EV-DREG-008 is committed and its independent red team returned
    verdict PASS. The decision that batch's own ledger receipt declared -
    DEC-20260731-014 - is an IDENTIFIER COLLISION: the committed
    ledger/decisions/DEC-20260731-014.yaml carries goal_id GOAL-ECDLP-001 and is
    a GOAL-ECDLP-001 / BATCH-021 approve decision belonging to another campaign.
    GOAL-DREG-001 therefore held BATCH-005 EVIDENCE and NO BATCH-005 DECISION.
    This record is that missing decision, minted fresh under a random-suffix id
    per CLAUDE.md's ID convention and AGENTS.md rule 14.
  decision: support
  target_ids:
    - GOAL-DREG-001
    - H-DREG-001
    - RQ-DREG-001
    - EV-DREG-008
    - TASK-20260731-016
    - TASK-20260731-025
    - TASK-20260731-026
    - TASK-20260731-027
  rationale:
    - >-
      WHAT THIS SUPPORT IS, IN THESE WORDS: this is support for the SCOPED CELL
      MEASUREMENT ONLY. It adopts the red-team PASS for the single admitted
      CTRL-B cell and for nothing else. It is NOT support for H-DREG-001, NOT a
      d_reg theorem, NOT an n-ladder law, and NOT crypto-scale ECDLP evidence.
      EV-DREG-008's own inference field sets exactly this boundary ("Adopt PASS
      for the single-cell admitted CTRL-B structural measurement ... Do not flip
      H-DREG-001 shared-ledger status to supported"), and this decision does not
      exceed it.
    - >-
      THE ADOPTED MEASUREMENT, SCOPED EXACTLY AS EV-DREG-008 SCOPES IT: single
      cell n=12, t=3, ti=0, seed=2026, D=6; strength preliminary; claim_tier toy;
      rank_null_restricted=156520; deficit_genuine=17947 (=156520-138573), which
      falls inside the preregistered bracket [1931, 17947] at its upper endpoint;
      validity=completed_valid. Admission metrics all pass, with
      restricted_support_hash=8a1bf796ccb340181af0c78920e9ebc9d527743d87d6053333ed3d4cbb7bae17,
      deleted_set_hash=a0203e81cd0947aea405bdb7c7ae98b2ddd60c970b96b1a7d2a5caf4b5d6809b,
      rebuild_match=true.
    - >-
      THE QUARANTINE IS CARRIED FORWARD UNWEAKENED. The raw 17947 headline - the
      support-independent formula sr_pred minus rank_sem - REMAINS
      quarantined_confounded. Its numerical equality with deficit_genuine is the
      upper-interval case rank(null | sem_support) = sr_pred, i.e. the deleted
      degree-6 columns contributed zero rank; it is a measured outcome, NOT a
      re-citation of the confounded label and NOT formula smuggling. Any later
      record citing 17947 for this cell must use structural_metric_id
      deficit_genuine and must retain raw_headline_status
      quarantined_confounded (red-team control CTRL-013-LABEL).
    - >-
      BASIS FOR ADOPTING THE PASS. RT-20260731-013 performed four independent
      checks that passed - GIT-SNAPSHOT-BIND, SET-HASH-REGENERATE-AND-MATCH,
      RESTRICTED-PICKLE-COLUMN-IDENTITY, CHUNK-COVERAGE-ARITHMETIC - and
      recorded FULL-RERANK as NOT_PERFORMED. The report states in its own text
      that the PASS grants no status change and that Coordinator ledger
      promotion remains a separate decision; this record is that separate
      decision and takes the narrower reading, not the broader one.
    - >-
      SUPERSESSION OF THE COLLIDED REFERENCE. This decision SUPERSEDES the
      reference to DEC-20260731-014 carried in record_ids of
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json.
      DEC-20260810-d4a0a4 is the GOAL-DREG-001 BATCH-005 decision of record.
      Neither that receipt nor the committed
      ledger/decisions/DEC-20260731-014.yaml is edited: both are immutable, and
      the latter is a valid record of ANOTHER campaign (GOAL-ECDLP-001 /
      BATCH-021) about which this decision asserts nothing whatever. Supersede
      by reference, never overwrite (AGENTS.md rule 4; rule 15 on remaps).
    - >-
      RECEIPT-INTEGRITY DEFECT, RECORDED NOT REPAIRED. Four of the five
      artifact_sha256 entries in that same BATCH-005 ledger receipt do not match
      the bytes at their own declared paths today, because merge commit
      b1dfd9865 remapped the BATCH-005 task ids (TASK-20260731-011 to -016, 012
      to 025, 013 to 026, 014 to 027) and rewrote the receipt's path KEYS while
      leaving the pre-remap content digests in place. The artifacts are
      authentic; the receipt's path-to-digest binding is what broke. Full
      analysis and proof are in CORR-20260810-6457d6. Consequence carried by
      this decision: the two red-team paths cited below are the POST-remap
      paths, and the digests the BATCH-005 receipt recorded for them are the
      PRE-remap ones, so those two evidence_refs are cited by path and content
      as they stand today, not by that receipt's digests.
    - >-
      INDEPENDENCE IS REAL BUT QUALIFIED. Per EV-DREG-008's own observation, the
      review runtime used the authorized AMEND-PATH-001-001 fallback
      (cursor-grok-4.5-high-fast) rather than review-xhigh, and equivalence to
      review-xhigh / executor-terra is NOT claimed. The red team ran in an
      independent session and re-derived the set hashes itself, so the
      independence is genuine; it is simply not the requested policy tier, and
      no mathematical claim here rests on the tier.
    - >-
      NARRATIVE DEBT DISCHARGED, AS THE RED TEAM REQUIRED (OBJ-013-1). BATCH-002's
      informal expectation that the genuine support-independent signal would be
      O(10^3), and that roughly 89 percent of 17947 would prove to be a degree-6
      support gap, was an upper-bound possibility envelope and not a hard
      prediction. For THIS cell it is superseded by the admitted measurement:
      the support-aligned deficit sits at the upper endpoint of the
      preregistered interval, not in the O(10^3) region. That supersession is
      cell-local and says nothing about any other n, seed, or degree.
  evidence_refs:
    - EV-DREG-008
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/falsification_review.md
    - coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-025/snapshot-receipt.json
    - CORR-20260810-6457d6
  evidence_refs_note: >-
    The two TASK-20260731-026 paths are POST-remap paths (pre-remap they were
    TASK-20260731-013). The BATCH-005 ledger receipt records their PRE-remap
    digests, so that receipt cannot content-verify them at these paths; see
    CORR-20260810-6457d6, which establishes from the parent commit e0838e844
    that the artifacts themselves are authentic. EV-DREG-008 is the one declared
    path in that receipt whose digest still matches
    (8b1a9985399a565d2635848a2cad8708f4ddcb22d1f4c4d9be3f3d2a852cc49f).
  limitations:
    - >-
      NO H-DREG-001 STATUS CHANGE. H-DREG-001's official status is untouched by
      this decision, in either direction.
    - >-
      This is not a d_reg theorem, not an n-ladder law, and not crypto-scale
      ECDLP evidence. deficit_genuine is a structural GF(2) Macaulay rank
      difference for one frozen cell; it is not the theoretical degree of
      regularity and no asymptotic or sub-rho statement follows from it.
    - >-
      It does NOT satisfy GOAL-DREG-001's completion criterion, which requires
      full-column-rank d_reg or gap(n) = d_reg - d_ff measurements across the
      on-lattice n-ladder n in {12, 15, 18} with at least three seeds and the
      semi-regular null control. One cell at n=12 is one rung of one ladder at
      one seed.
    - >-
      Strength is preliminary and claim_tier is toy, as recorded on EV-DREG-008.
      Nothing in this decision may be cited above that tier.
    - >-
      EV-DREG-008's recorded unresolved confounds stand: (a) sibling-worktree
      null adjacency pickle reuse - the rebuild matched and the red team verified
      full and restricted pickle hashes plus column-subset identity, but the
      pickle bytes are outside the producer snapshot commit; (b) the BATCH-002
      "O(10^3) genuine" narrative is superseded by this upper-interval pin for
      this cell only.
    - >-
      The rank was not independently re-executed (red-team check FULL-RERANK,
      NOT_PERFORMED). OBJ-013-4 is NOT FALSIFIED rather than discharged: no
      sr_pred ceiling was found in the rank loop and the chunk trail shows
      gradual saturation, but a second-engine re-rank remains the cheapest
      remaining discrimination and is not claimed here.
    - >-
      Review independence is qualified: authorized AMEND-PATH-001-001 fallback
      to cursor-grok-4.5-high-fast, with no claim of equivalence to review-xhigh
      or executor-terra.
    - >-
      The BATCH-005 ledger archive receipt cannot be content-verified at its
      declared paths and never will be (CORR-20260810-6457d6). This decision is
      therefore made on the CONTENT of the committed artifacts it cites, not on
      that receipt's verification status, and GOAL-DREG-001's
      latest_verified_commit is NOT advanced on its strength.
  next_actions:
    - >-
      CHAIN C2 REMAINS UNARCHIVED WORK AND IS CARRIED FORWARD. On the
      artifact-check basis (not a process check): BATCH-003 carries archives/
      for TASK-20260727-N21-SNAP-C1 and reviews/ for TASK-20260727-N21-VAL-C1
      ONLY. There is NO committed archive receipt, snapshot receipt, or review
      report for TASK-20260727-N21-SNAP-C2, TASK-20260727-N21-VAL-C2, or
      TASK-20260727-N21-LEDGER-C2 - the VAL-C2 handoff card exists at
      coordination/goals/GOAL-DREG-001/batches/BATCH-003/handoffs/TASK-20260727-N21-VAL-C2.yaml
      but stands unmatched by any receipt or report - and
      coordination/goals/GOAL-DREG-001/batches/BATCH-003/PREREG-20260727-N21-C2.md
      likewise stands unmatched. C2 is therefore UNARCHIVED, full stop.
      Re-dispatch it under fresh task ids, or supersede it with a recorded
      rationale. Its absence is NEVER evidence about d_reg, in either direction,
      and this action is NOT gated on the liveness of any external driver
      process - that gate was structurally unauditable from committed artifacts
      and is not reinstated.
    - >-
      DO NOT ADVANCE GOAL-DREG-001.latest_verified_commit on the BATCH-005
      ledger receipt. It is permanently unverifiable at its declared paths
      (CORR-20260810-6457d6) and its commit_sha is null. Any future advance must
      bind to a fresh archive whose declared path-to-digest map verifies against
      the tree.
    - >-
      Optional, not required by this decision: a Validator re-rank of the
      restricted adjacency, or the red team's suggested one-column-deletion
      mutation expecting rank_acc to drop by exactly 1, if stronger rank
      certainty is wanted before any further promotion of this number.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Promotion is not warranted. EV-DREG-008 is strength "preliminary" and
      claim_tier "toy", and it reports a single cell (n=12, t=3, ti=0, seed=2026,
      D=6) with no replication and no independent re-rank. The Coordinator
      promotion gate requires "replicated" or "strong" evidence for a KN-FIND on
      a support decision; this is neither. There is no durable, transferable
      finding here yet - only one structural number for one frozen cell whose
      generalisation is exactly what the on-lattice ladder is meant to test.
      Revisit promotion if and when the n-ladder rungs replicate the structure.
  decided_by: coordinator
  decided_at: '2026-08-10'
  inference:
