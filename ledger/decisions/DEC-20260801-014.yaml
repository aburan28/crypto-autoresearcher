        DEV_079_2:
          item: 'specification.yaml required_artifacts.reading_rule still names reading_rule.yaml (RR-LPF-1) while the run executed against RR-LPF-2.'
          ruling: 'DOES NOT SATISFY THE "UNTRACEABLE THRESHOLD" CLAUSE AND DOES NOT SATISFY ANY OTHER L-0 CLAUSE. L-0 NOT FIRED.'
          grounds: >-
            The clause is about THRESHOLDS, and every threshold this run read is
