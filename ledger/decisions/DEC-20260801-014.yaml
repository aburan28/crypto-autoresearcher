        seven statistic ids at both cells, 20 of 20 rejections each, retained-id
        shifts 251.07 to 1097.12 null sd - does not fire (CALIBRATION ARM,
        resolved). Leg 3, Dickman - THE ONE L-5 LEG THIS MEASUREMENT COULD MOVE
        AND IT WAS RE-SOLVED BY THIS RUN: worst relative discrepancy
        1.5441749690432644e-05 against a 0.01 threshold, and the Validator's
        independent solution by a different numerical scheme agrees with the
        driver's to 3e-7 relative at the worst tabulated point. Does not fire.
      honest_caveat_carried: >-
        TWO OF L-5's THREE LEGS WERE ALREADY RESOLVED FALSE ON ARCHIVED
        CALIBRATION DATA AND COULD NOT HAVE CHANGED. RR-LPF-2 discloses this
        itself as a property of a calibration-first design. Together with L-1's
        movement leg and the calibration-side L-0 tripwire, FOUR BRANCH LEGS WERE
        PRE-RESOLVED, and that narrows what this measurement could ever have
        decided.
    - branch: L-2
      condition_quoted: >-
        "CONSISTENT. Every certifying statistic lies INSIDE its archived measured
        band at BOTH cells, AND R(u) lies inside [1/8, 8] at EVERY POWERED rung at
        BOTH cells, AND the uniform arm's own R(u) also lies inside [1/8, 8] at
        those rungs so LIMB B is decidable there."
      fires: false
      why: >-
        THE FIRST CONJUNCT IS FALSE, AND IT IS FALSE BY EXACTLY ONE COMPARISON.
        STAT-RATE-u@u_target=2 at bits 16 lies OUTSIDE its archived band -
        observed p_hat 0.3562102495107632 (46598 of 130816) against a lower edge
        of 0.3562408268101761 (46602 of 130816), under the frozen STRICT
        inequality. "Every certifying statistic INSIDE at BOTH cells" therefore
        fails. The second and third conjuncts ARE satisfied - the real arm's R(u)
        lies inside [0.125, 8.0] at all four powered rungs at both cells and the
        uniform arm's does too at those rungs - but the condition is a
        CONJUNCTION and L-2 CANNOT BE REACHED WITH A SINGLE BAND EXIT ANYWHERE.
      what_this_costs_the_favourable_reading: >-
        STATED PLAINLY. L-2 was the most favourable branch available and it is
        NOT selected. Even had it been, `support` is forbidden under it, its
        licensed statement is bounded at "not distinguished ... at the measured
        detection floor, and nothing more", and its own text says HEUR-DS-1 IS
        NOT VALIDATED AT ANY TIER.
    - branch: L-3
      condition_quoted: >-
        "DEPARTURE. At least one certifying statistic lies OUTSIDE its archived
        band at BOTH cells in the SAME DIRECTION, or R(u) lies outside [1/8, 8] at
        a powered rung at BOTH cells while the uniform arm's R(u) at that rung lies
        inside."
      fires: false
      why: >-
        BOTH DISJUNCTS ARE FALSE. First disjunct: the ONE statistic outside its
        band is outside at ONE CELL ONLY. At bits 20 the same statistic,
        STAT-RATE-u@u_target=2, lies INSIDE its band at +1.7773144683163855
        measured null sd inside the nearer edge; no other certifying statistic is
        outside at either cell. There is therefore no statistic outside at BOTH
        cells, and a fortiori none outside at both cells in the SAME direction.
        Second disjunct: the real arm's R(u) is INSIDE [0.125, 8.0] at every
        POWERED rung at both cells, so no powered rung has the real arm outside.
        The two rungs where a band exit occurs at all - bits-16 u = 6 real 12.94
        and uniform 10.11, bits-20 u = 6 uniform 8.0434 at run time - are
        UNPOWERED by POW-LPF-1 arithmetic fixed before any datum (n*rho about
        2.47 and 2.61 against a bar of 30), carry a STRUCK LIMB A statistic, and
        read no branch.
      consequences_of_L_3_not_firing: >-
        The L-3 machinery therefore does not engage: no `weaken` is issued, the
        deviation certificate is NOT required as a refutation artifact and is not
        used as one, and the archived deviation_certificate.json - written
        unconditionally by the driver and byte-reproduced by the Validator - is
        cited in EV-LPF-001 as a RUN ARTIFACT with proof_status `empirical_only`,
        NOT as a `counterexample_certificate`.
    - branch: L-4
      condition_quoted: >-
        "MIXED. A departure at exactly one cell, or a departure whose direction
        differs between cells, or LIMB B undecidable at a rung where LIMB A
        rejects."
      fires: true
      which_clause: 'THE FIRST CLAUSE - A DEPARTURE AT EXACTLY ONE CELL.'
      why: >-
        Exactly one of the ten certifying comparisons lies outside its archived
        band; it lies outside at exactly ONE CELL (bits 16); its direction is
        BELOW_BAND, i.e. ROUGHER than the reference. That is the first clause of
        L-4 satisfied on its own terms, and L-2 and L-3 are both false, so L-4 is
        the unique remaining branch under the frozen precedence.
      the_third_clause_examined_and_NOT_relied_on: >-
        "LIMB B undecidable at a rung where LIMB A rejects" DOES NOT FIRE and is
        not the ground of this selection. The non-decidable rungs are the
        UNPOWERED u = 6 rungs whose LIMB A statistic STAT-RATE-u@u_target=6 is
        STRUCK, whose reject boolean is false in any case, and OPEN-RR052-B was
        RULED READING A at TASK-20260801-054, so a struck statistic cannot
        trigger this clause. Recorded because it must be checked, not assumed.
      the_stale_substitution_not_quoted: >-
        RR-LPF-2's L-4 substituted_numbers block names bits-16 u = 6 as the only
        non-decidable rung and this run produced two. THE FROZEN CONDITION TEXT IS
        UNCHANGED AND UNAFFECTED. The same file's
        run_time_variability_of_the_flag_declared anticipated exactly this,
        recording the bits-20 u = 6 200-replicate range as 1.53 to 8.81 -
        straddling 8 - and stating the flag may come out either way and that no
        branch reads it. THIS DECISION QUOTES THE DECLARATION, NOT THE STALE
        SUBSTITUTION (VAL OBS-081-2).
      disposition_quoted_verbatim_from_the_frozen_rule: >-
        "`inconclusive`, with the replication at a DIFFERENT curve instance per
        cell named as the single next action. H-LPF-001 stays `approved` and does
        not advance."
    branches_are_mutually_exclusive_and_exactly_one_fired: true
    no_branch_was_amended_added_removed_or_reworded_by_this_task: true

  # =====================================================================
  # 3. RATIONALE
  # =====================================================================
  rationale:
  - >-
    THE EVIDENCE CANNOT DISCRIMINATE BETWEEN THE TWO EXPLANATIONS ON OFFER, AND
    THAT IS SAID PLAINLY RATHER THAN SPLIT. The competing readings are (i) the
    intermediates behave for B-smoothness like matched uniform integers at these
    cells and the one band exit is sampling noise, and (ii) the intermediates are
    slightly rougher than matched uniform integers at bits 16 and the design saw
    the edge of it. NOTHING IN THIS PACKAGE SEPARATES THEM. The frozen rule
    anticipated exactly this and routed it to L-4 by design, not by post-hoc
    judgement - H-LPF-001's own family_wise_statement, declared in advance, says
    "a single-cell excursion lands in L-4 and is `inconclusive` by design".
  - >-
    ONE FIRE IS THE SECOND MOST LIKELY CORRECT-NULL OUTCOME OF THIS DESIGN. Ten
    certifying comparisons at a nominal per-comparison two-sided false-fire
    probability of 4/201 = 0.0199 give an expected 0.199 fires and
    P(at least one fire) = 0.1821 on a CORRECT null. Zero fires is modal; one
    fire follows it. THIS ARITHMETIC APPEARS NOWHERE IN THE EXECUTION REPORT, THE
    READING RULE OR ANY RESULTS FILE (OBJ-RT082-3) AND IT IS THE ARITHMETIC THAT
    DECIDES HOW THE REJECT READS, so it is written into EV-LPF-001 and here.
  - >-
    BOTH PRIOR FRAMINGS OF THE REJECT WERE WRONG AND BOTH FACTS TRAVEL. The
    minimising framing - "four samples out of 130816, 0.024 null sd outside the
    nearer edge" - UNDERSTATES, because it measures from a band edge that is
    itself the 2nd order statistic of 200 draws with its own noise of order half
    a null sd, and because it sets a MAGNITUDE beside a RATE. The scale-free
    quantity is the displacement from the NULL CENTRE, -2.244 measured null sd, a
    2.5 percent two-sided event at that comparison. The amplifying framing -
    "below all 200 replicates" - OVERSTATES, because family-wise
    P(some comparison below all its own 200 nulls) is at most
    1 - (1 - 1/201)**10 = 0.0487, and a five-percent family-wise event is not a
    finding.
  - >-
    THE TIE CUTS AGAINST THE MINIMISING FRAMING, NOT FOR IT, AND BOTH REVIEWERS
    FOUND THIS INDEPENDENTLY. Because the 1st and 2nd ascending order statistics
    at that site are TIED at 0.3562408268101761, the achieved low-side rejection
    region is {x < min of the 200}, STRICTLY SMALLER than the nominal
    {x < 2nd of the 200}. So 4/201 is an UPPER BOUND on the achieved two-sided
    rate at that edge, the band is CONSERVATIVE AGAINST REJECTING there, and THE
    FIRE IS RARER UNDER A CORRECT NULL THAN THE DECLARED LEVEL SUGGESTS. The two
    effects roughly cancel - a per-comparison one-sided event of about 0.005 in a
    family of ten is about 0.05 family-wise - and neither refinement may be
    quoted alone.
  - >-
    THE OBSERVED REJECT IS THE SIZE OF A CONTAMINATION THE DESIGN IS NOT
    CERTIFIED TO DETECT. The -2.244 null sd displacement interpolates on the
    archived OBJ-PLANT-ROUGH bits-16 STAT-RATE-u@u_target=2 shift ladder -
    (0.002, 0.005, 0.01, 0.02, 0.05) mapping to (-0.244, -0.882, -2.061, -4.366,
    -11.248) null sd - to gamma about 0.011, against a CERTIFIED
    ROUGH-DIRECTION BOTH-CELLS FLOOR OF gamma = 0.02. And the rough-direction
    blindness is MEASURED, not assumed: all seven inert plant rung-cell groups
    are OBJ-PLANT-ROUGH at small gamma, and a rough contamination of UP TO 2,616
    OF THE 130,816 SAMPLES sits below the certified both-cells floor. THE ONE
    REJECT FIRED IN THE DIRECTION WHERE THIS DESIGN IS WEAKEST.
  - >-
    NINE NON-REJECTIONS ARE NOT NINE CONFIRMATIONS. The Bsm ladders are NESTED,
    with adjacent-rung correlations of 0.37 to 0.40 on the uniform arm's own
    measured means, and STAT-KS-DICK is a function of the same empirical Z-CDF;
    ten comparisons are on the order of SIX TO SEVEN effectively independent
    ones, and the two cells - the only near-independent replication in the
    package - SHARE MASTER SEED 2301. What the non-rejections license is a
    DETECTION FLOOR and nothing else, and the floor is the finding.
  - >-
    THE ABSOLUTE LIMB IS ABSOLUTE IN CONSTRUCTION AND NOT IN CONTENT, AND NO
    SENTENCE OF THIS DECISION SAYS "CONSISTENT WITH THE DICKMAN PREDICTION". The
    construction survives attack - [0.125, 8.0] is inherited from EXP-DS-001,
    hash-bound pre-datum, and the denominator is the driver's own solved rho with
    no calibration number entering either threshold or reference; the Red Team
    records that it tried to break this and failed. But the AGREEMENT THAT WAS
    MEASURED IS WITH THE UNIFORM ARM: STAT-KS-DICK puts the real arm 4.9 and 3.8
    CDF percentage points from the Dickman CDF, EXACTLY AS FAR AS A MATCHED
    UNIFORM SAMPLE OF THE SAME SIZE AT THE SAME X, and the shared component has
    already consumed 4.43 of the 8.0 budget at bits-16 u = 5. The licensed
    sentence is that the intermediates are not distinguished from a
    matched-bitlength uniform sample by these statistics at these cells at the
    measured detection floor, AND THAT BOTH ARMS DEPART FROM ASYMPTOTIC DICKMAN
    BY UP TO A FACTOR OF ABOUT 4.4 - a statement about the REFERENCE at finite X.
  - >-
    THE LARGEST HOLE IN THE PACKAGE WAS PREVIOUSLY UNDECLARED AND IS DECLARED
    NOW. OBJ-RT082-1: the frozen band is an iid-sampling band calibrated on
    130,816 independent draws, while OBJ-REAL IS NOT A SAMPLE AT ALL - it is
    determined by 512 factor-base x-coordinates each appearing in 511 pairs, and
    the scale that actually fluctuates, across CURVE INSTANCES, is never measured
    because there is one instance per cell. IT CUTS BOTH WAYS AND THAT IS THE
    POINT: if the instance sd exceeds the iid sd, the reject is noise AND the
    nine non-rejections are nearly vacuous; if it is below, both are stronger
    than they look. Nobody knows which and the package cannot tell. It is filed
    as a NEW declared interpretation limit of the RTB-054-6 class and it is
    larger than that one.
  - >-
    THE RUN IS NOT VACUOUS AND DISMISSING IT WOULD BE THE PREMATURE-CLOSURE
    FAILURE MODE. It is the first measurement in twenty-seven batches of the
    object HEUR-DS-1 is about; its factorization is verified to an unusually high
    standard - 100 percent in-driver on 523,264 values AND 100 percent outside
    the driver on the full 261,632-value real arm by an independently
    reconstructed object and a second factorization path with a second primality
    test; and it produces a quantified detection-floor map that did not exist
    before. Under docs/inventor-protocol.md section 4 calling that worthless is a
    failure mode SYMMETRIC WITH OVERCLAIMING, and this decision refuses both.
  - >-
    AND IT IS NOT A RESULT. `support` is forbidden under every branch of
    RR-LPF-2; `reject_scoped`, and in particular reject_scoped-as-impossibility,
    is forbidden on a single unreplicated toy run and would in any case be
    unavailable on evidence of strength `inconclusive` with basis
