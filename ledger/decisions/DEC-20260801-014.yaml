    - branch: L-5
      condition_quoted: >-
        "APPARATUS FAILURE. The LPF-CAL-B identity count exceeds its frozen
        exact-binomial cut at either cell, OR OBJ-CTRL-PRODUCT is not detected by
        any certifying statistic at either cell, OR the driver's own Dickman
        solution differs from the frozen table by more than 1 percent at any
        tabulated point."
      fires: false
      why: >-
        Leg 1, identity: counts 4, 3, 3, 1 against a frozen exact-binomial cut of
        4 - does not fire (CALIBRATION ARM, resolved before this run and not
        re-evaluable by it, with ZERO margin at bits-16 uniform, recorded rather
