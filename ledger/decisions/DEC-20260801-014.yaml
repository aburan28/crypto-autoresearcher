            Recorded as OPEN-BATCH027-A.
    - branch: L-1
      condition_quoted: >-
        "THE ARTIFACT TELL. DECAY-LPF-1 fails - p_hat(u) is flat or non-monotone
        across the frozen u sweep on the real arm or on the uniform arm - or the
        PERTURB-MOVE-1 table records no movement at the top rung of a ladder the
