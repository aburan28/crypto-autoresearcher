        DEV_079_1:
          item: 'The handoff said the pilot budget gate runs first; the hash-bound driver reaches run_pilot() only from run_calibration(), so the measurement path ran without a pilot.'
          ruling: 'DOES NOT SATISFY ANY L-0 CLAUSE. L-0 NOT FIRED.'
          grounds: >-
            NO L-0 CLAUSE NAMES A MISSING PILOT. The nearest named item anywhere
