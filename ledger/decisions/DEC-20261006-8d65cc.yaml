  context: >-
    /design-experiment, one contract, for IDEA-20261005-1b41d9. No
    hypothesis and no experiment on origin/main cites that idea. The
    branch design/ectd-1b41d9-factors was created from origin/main at
    3575cc2705c200ffc0c0163c82548ab3335585ce and git merge origin/main
    reported already up to date.

    The named prime is 5. The source curve is y^2 = x^3 + x + 2 over
    F_5, with first rational order-2 point (4, 0). The Vélu codomain is
    y^2 = x^3 + x over F_5. A design-session point-count census found
    both orders equal to 4 and both traces equal to 2, with j-invariants
    1 and 3. At p = 3 every nonsingular short-Weierstrass model was
    supersingular. The contract predicts that the invariant-factor pairs
    differ in at least one coordinate. Equal pairs are a negative. No
    invariant factor was computed while writing this decision. No
    trapdoor and no exponent change are claimed.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, seeds, replication, budget, stopping rules,
    invalidation rules, success criterion, falsification criterion, and
    required artifacts are all non-null. Success is a coordinate gap of
    at least 1 and fails when the pairs are equal.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prime, both curves, the inequality, and the assignment of each observation to a reading are fixed before any group decomposition.
    - The minimality census, the equal-trace test, the kernel-to-identity test, the non-square-free check, and the scaling model y^2 = x^3 + x + 3 give the comparison a way to come back invalid.
    - Equal pairs can occur, so success can fail.
    - No invariant factor was computed while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: p = 5. No transfer to a larger prime.
    - The pairs were not computed in this design. The frozen prediction is the inequality, not a numeral.
    - This decision authorizes a later run. It does not start one.
    - The comparison is not a trapdoor and is not an ECDLP algorithm.

