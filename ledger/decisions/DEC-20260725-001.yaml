coordinator_decision:
  id: DEC-20260725-001
  context: >-
    Verified TASK-20260725-002 snapshot (b457111d) and independent
    TASK-20260725-003 review of the frozen toy validation protocol are complete.
    The review terminal verdict is REVISE. No experiment was authorized or
    executed. This is the third and final batch of the three-batch campaign
    budget.
  decision: revise
  target_ids:
    - GOAL-ECDLP-001
    - BATCH-003
    - TASK-20260725-001
    - TASK-20260725-002
    - TASK-20260725-003
  rationale:
    - >-
      The protocol's mathematical content is sound: the independent reviewer
      verified the toy fixture (E: y^2=x^3+x+6 over F_11, #E=13 prime, all
      factor-base points on-curve, discrete logs, point hashes) by independent
      reparse.
    - >-
      REVISE is required because four of six binding hashes (fixture_sha256,
      field_schema_sha256, schedule_sha256, verifier artifact_sha256) are not
      independently reproducible: the protocol does not enumerate the exact field
      sets and canonicalization for those hashes. The two hashes whose field sets
      were unambiguous (column_schema_sha256, canonical_rows_sha256) were
      reproduced, confirming the JCS method is sound.
    - >-
      The scoped repair is to enumerate the exact field set for each of the four
      non-reproducible hashes, following the reproducible column_schema_sha256
      computation pattern, so all six binding hashes become independently
      verifiable.
    - >-
      The three-batch campaign budget is exhausted without meeting a positive
      completion criterion. Per the goal's pause_conditions, the goal pauses with
      a concrete resume action.
  evidence_refs:
    - EV-ECDLP-005
  limitations:
    - No experiment or implementation was authorized or executed.
    - Review used an auditable glm-5p2 fallback after review-xhigh could not be resolved; equivalence is not claimed.
    - Passing mathematical review of the fixture is not validation of an executable campaign.
    - The protocol, even after repair, would govern a toy-tier campaign only.
  next_actions:
    - >-
      Scoped repair: re-run the producer to enumerate the exact field set and
      canonicalization for each of the four non-reproducible binding hashes
      (fixture_sha256, field_schema_sha256, schedule_sha256, verifier
      artifact_sha256), following the reproducible column_schema_sha256 pattern,
      so all six binding hashes are independently reproducible. Authorize no
      implementation or experiment until the repaired protocol passes independent
      re-review.
    - >-
      The three-batch campaign budget is exhausted. GOAL-ECDLP-001 pauses. Resume
      requires a budget extension (new campaign or amended maximum_batches) to
      fund the repair batch and any subsequent toy validation design.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      EV-ECDLP-005 is preliminary theoretical review evidence over a toy
      protocol-schema package: strength is below replicated/strong, no
      support/reject_scoped mathematical finding exists, the review verdict is
      REVISE (not a proven result), and the durable content remains a
      proposal-stage methodology protocol with a scoped repair outstanding.
  decided_by: coordinator
  decided_at: "2026-07-25T23:00:00-07:00"
