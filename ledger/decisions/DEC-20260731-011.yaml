coordinator_decision:
  id: DEC-20260731-011
  context: >-
    Official close-out of GOAL-AES-001 BATCH-001, the campaign-opening batch
    approved by DEC-20260731-010. Two producers ran concurrently
    (TASK-20260731-601 idea-generator, TASK-20260731-602 executor); their exact
    artifacts were snapshot-archived alone in TASK-20260731-603 as commit
    0185c0ff (parent 0137a051, the isolated inference-amendment commit); an
    independent review-adversarial session, TASK-20260731-604, verified that
    snapshot against Git and returned TWO SEPARATE VERDICTS — (a) harness
    integrity PASSED with four recorded defects, (b) ideation screening FAILED,
    scoped and repairable. This decision is the ledger transition that follows,
    resting on EV-AES-001. BATCH-001 produced NO cryptanalytic result and NO
    claim about AES of any kind, at any round count; nothing below should be
    read as one.
  decision: revise
  target_ids:
    - RQ-AES-001
    - GOAL-AES-001
    - EV-AES-001
    - TASK-20260731-601
    - TASK-20260731-602
    - TASK-20260731-604

  rationale:
    - >-
      The two validator verdicts are kept distinguishable and are NOT averaged
      into a single batch grade. A passing harness verification is a
      REPRODUCIBILITY FACT about an instrument; it supports no claim about AES
      and authorizes no promotion. The ideation failure is a
      mathematical-quality finding about a proposal package. Neither carries
      across to the other.
    - >-
      The TASK-20260731-602 harness is ADMITTED as this campaign's
      reproducibility floor and as campaign infrastructure. The basis is
      re-execution, not assertion: 9000 pycryptodome and 1440 openssl
      comparisons under the validator's own seed and driver with 0 mismatches;
      backend independence demonstrated with Crypto/subprocess/ctypes imports
      hard-blocked; the documented reduced-round convention checked against an
      independently authored implementation of that documentation at 468/468
      cases; bit-for-bit determinism; and a receipt structurally faithful to
      what the code computes. This is an infrastructure admission, not a
      `support` transition — there is no hypothesis, and admitting an instrument
      is not evidence about the cipher it measures.
    - >-
      Defect H-1 is tracked as a REPAIR ITEM rather than treated as
      contamination. The executor's false-green fix is genuine for the failure
      shape it addressed (import AttributeError now yields FAIL /
      detected: false), and all three mutants in the committed run took the
      applied path and were caught by real comparisons, so the archived green is
      uncontaminated. But the failure class is narrowed, not eliminated: an
      unrelated import-time AssertionError is still credited as a detection with
      no comparison run. That is a live path for future runs and must be closed
      before the harness is trusted on any cryptanalytic measurement.
    - >-
      Defect H-3 is the more consequential harness gap for what comes next: the
      mutation control has ZERO coverage of the reduced-round path, which is
      precisely the path this campaign will use. Combined with declared
      limitation H-4 — the reduced-round path has no external reference and
      cannot obtain one, so the convention is a definitional choice — the honest
      statement is that the instrument is externally verified precisely where
      the research is not happening. That framing was checked and confirmed by
      the independent session.
    - >-
      The ideation package needs REFINEMENT, not rejection. Its failure is
      recomputable mathematics inside a specific argument, not a dead research
      direction, and it is explicitly not a failure of honesty or of novelty
      presentation: the package presents neither candidate as novel, records
      depth_of_verified_structure: NONE truthfully, refuses its own saturation
      conclusion as `unverified` per docs/inventor-protocol.md section 4, and
      hands its hardest calls to the validator instead of resolving them in its
      own favour. Discarding it would also be the premature-closure failure mode
      the inventor protocol names as symmetric with overclaiming.
    - >-
      CAND-601-A's premise is UNDERMINED and GATE-601-A must not run as
      specified. Its justification rests on a closure argument whose premise AES
      does not satisfy (I-4: MixColumns supplies one element of order 4 in
      GL(4,GF(2^8)), not the group, so no transitivity and no 2-transitivity is
      available and ~1.07e9 orbits exist on nonzero vectors), one of whose steps
      is false and self-contradictory within the same report (I-2: byte-wise Inv
      PRESERVES GF(2^8)-collinearity, since Inv(lambda v) = lambda^-1 Inv(v);
      the GF(2)-affine layer L is the operative obstruction), and whose gate
      cannot demonstrate its own sensitivity (I-3: R_j = 1.0 at r=1 and r=2 for
      AES AND for the gate's own random-S-box null, so criterion (2) fires on a
      byte-activity pattern rather than on GF(2^8)-module structure, and the
      predicted decay is a cliff). With both legs of the producer's defence
      removed, the self-reported ~1/2-round survival depth does undermine the
      premise. The disposition is repair-before-run.
    - >-
      CAND-601-B's sota_delta is STRUCK, not deferred. A ~4-bit (possibly
      ~0-bit) margin against a recalled 2^44 baseline carrying +/-2 bits of
      recall uncertainty is unadjudicable in this environment REGARDLESS of how
      the gate resolves; carrying it as an open question would let an
      unverifiable comparison ride into a later record. What survives is the
      gate's self-contained yield — correctness equivalence, S-box independence
      of the counted ratio under its random-bijection null control, and a
      measured ratio against a re-implemented baseline on a fully enumerable
      2^16 guess space — which needs no literature at all.
    - >-
      Under docs/target-result-profile.md, CAND-601-B is explicitly a
      cofactor/constant-factor reorganization and ranks LOW; CAND-601-A under
      its own predicted outcome yields sota_delta zero. Neither is an
      exponent-mover. The batch's genuinely exponent-relevant output is the
      residual open question it names and does not touch: whether any
      cross-column, super-box-level object — where ShiftRows sits on the outside
      — admits a lossy projection surviving more than the one-and-a-half rounds
      column-local objects achieve. Reranking on this committed checkpoint puts
      that first.
    - >-
      No adverse transition is taken that would require a refutation artifact
      beyond what is archived. This decision does not `weaken` or
      `reject_scoped` any hypothesis — none exists — and it does not close the
      column-local lane. The I-4/I-2 corrections are recorded at
      proof_status: derivation, backed by recomputation in the independent
      TASK-20260731-604 session and corroborated in the dispatching session, and
      archived in this same ledger commit. The scoped closure they would license
      is deliberately NOT taken here: it awaits a standalone derivation note
      snapshot-archived on its own in BATCH-002, so that the artifact precedes
      the decision that relies on it.
    - >-
      The inference-block gap in TASK-20260731-601 (no requested policy, no
      resolved model, no fallback flag) is a bookkeeping defect that does not
      impair the admissibility of a zero-compute package whose every substantive
      claim was checked by recomputation. It is repaired prospectively rather
      than retroactively: BATCH-002 treats a missing inference block as a
      completion-gate failure at dispatch, not as a defect discovered at
      validation.

  evidence_refs:
    - EV-AES-001
    - DEC-20260731-010
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-604/validation_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-604/harness_verification.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-604/ideation_screening_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/aes_reduced.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/vector_check_receipt.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/run_record.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-601/candidate_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-601/baseline_map.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/archives/TASK-20260731-603/snapshot-receipt.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/inference-amendment-TASK-20260731-602.yaml
    - "producer snapshot commit 0185c0ff2d3878101d8f6cf5bdef48906ffb197b"
    - "inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c"

  dispositions:
    harness_TASK_20260731_602: >-
      ADMITTED as campaign infrastructure and as the certification target for
      every later reduced-round measurement, scoped exactly as EV-AES-001
      boundaries state. Repair items H-1 (medium, latent) and H-3 (medium,
      coverage) are tracked and must be closed before any cryptanalytic
      measurement is certified against the reduced-round path; H-2 (low) is
      recorded. H-4 is a declared, irreducible limitation, not a defect to
      repair.
    CAND_601_A: >-
      PREMISE UNDERMINED. GATE-601-A is NOT approved and must not run as
      specified. Repair required before any re-submission: correct I-1, I-2 and
      I-5; withdraw or reconstruct the I-4 closure without the transitivity
      step; and either replace the r=2 positive control with one that
      distinguishes AES from a random-S-box cipher, or concede in writing that
      no such control exists for this object at this depth. The AGL closure may
      NOT be relied on as a closure or promoted to knowledge in its current
      form.
    CAND_601_B: >-
      sota_delta STRUCK, together with every comparison against the recalled
      2^44 partial-sums baseline. GATE-601-B is otherwise sound and may be
      dispatched once the struck claims are removed, limited to its three
      self-contained yields. It remains a cofactor-class candidate under
      docs/target-result-profile.md and is ranked below the super-box residual.
    residual_open_question: >-
      RETAINED and ranked first: cross-column / super-box-level objects, where
      ShiftRows sits on the outside. Untouched by every defect found.
    enumerated_closures: >-
      Three (determinant, GF(2)-rank, GF(2^4) subfield) stand as verified
      derivations meeting the section-4 standard. The AES-128 key-schedule
      closure stands as a counting-level derivation whose phrasing exceeds its
      argument and must be re-scoped before reuse. The AGL closure does not
      stand.
    hypothesis_status_changes: >-
      NONE. No hypothesis record exists for GOAL-AES-001 and none is created by
      this decision.

  promotion_gates_status:
    engaged: false
    reason: >-
      NO asymptotic-complexity claim was advanced in BATCH-001. The four
      promotion gates in .claude/skills/coordinate-research-goal/SKILL.md and
      agents/coordinator.md are therefore NOT engaged. They are recorded here so
      that a later batch cannot quietly bypass them: if any candidate — most
      plausibly a repaired CAND-601-B, which is a cofactor reorganization and
      not an exponent-mover — were ever advanced toward `supported`, all four
      would apply, namely (1) an archived proof decomposition into
      single-responsibility lemmas with the main theorem assembling them under
      explicit per-attempt-cost x inverse-success-probability bookkeeping;
      (2) every conditional dependence stated as an explicit numbered heuristic
      with archived validation evidence or a scheduled validation experiment;
      (3) a concrete-cost table at standardized parameter sets with honest
      accounting of superpolynomial overhead hidden in o(1) terms, memory,
      time-memory tradeoffs and parallelization, optimistic assumptions flagged,
      and an explicit affected-vs-safe scope statement; and (4) independent
      review-xhigh review per AGENTS.md rule 12 plus a red-team pass on the cost
      model and heuristics. A claim missing any gate may reach `analyzed`, never
      `supported`.

  limitations:
    - >-
      This decision asserts NOTHING about AES. BATCH-001 produced no
      distinguisher, no key recovery, no speedup, no measured structural excess,
      and no barrier statement about the cipher, at any round count. Zero
      cryptanalytic compute was spent and neither falsification gate was run.
    - >-
      Nothing here concerns full-round AES, AES-NI-deployed AES, or the security
      of any system that uses AES. Claim tier is toy / reduced-round.
    - >-
      Admitting the harness is a reproducibility fact about an instrument, not
      empirical cryptanalytic evidence. A ledger archive makes work durable; it
      does not upgrade the strength or scope of the evidence.
    - >-
      Every literature comparison in this batch, on every side, is
      UNVERIFIED-FROM-MEMORY under the campaign network policy; zero primary
      sources were read. Novelty against the external literature was not, and in
      this environment cannot be, settled.
    - >-
      The reduced-round path is externally unreferenced and unreferenceable
      (H-4). The convention it pins is a definitional choice, and the mutation
      control has no coverage of it (H-3).
    - >-
      Cross-model independence is unavailable in BATCH-001: the validator is
      independent in session but resolves to the same inherited model
      (inference-amendment-TASK-20260731-602.yaml). The Coordinator's own
      recomputation of the MixColumns order and the Inv-collinearity identity is
      recorded as corroboration only, not as a second independent validation.
    - >-
      GOAL-AES-001 is NOT completed and is not proposed for completion. No
      completion criterion is met, and under the inference amendment a
      three-distinct-model closure quorum is unobtainable in this harness, so
      closure could not be recorded even if a criterion were met. No attestation
      is recorded.

  next_actions:
    - >-
      Generate, commit and dispatch the GOAL-AES-001 BATCH-002 dispatch queue,
      reranked on this checkpoint in this order: (1) an idea-generator task on
      the retained residual — cross-column / super-box-level objects at the
      2-round 32-bit super-box where ShiftRows sits on the outside — which is
      the only exponent-relevant lane BATCH-001 left open, delivered together
      with a standalone derivation note archiving the two durable negative facts
      recomputed this batch (MixColumns generates a cyclic group of order 4 in
      GL(4,GF(2^8)), so no AGL/GL transitivity argument is available for
      column-local invariants; byte-wise Inv preserves GF(2^8)-collinearity and
      the GF(2)-affine layer L is the operative obstruction), snapshot-archived
      alone so it precedes any decision relying on it and can be promoted to a
      KN-FIND in the BATCH-002 ledger archive; (2) an executor task repairing
      harness defects H-1 (require the AssertionError to match the module's own
      self-check, or drop the self-check detection path entirely and require
      every mutant to be caught by a comparison) and H-3 (add mutants that
      perturb reduced-round round-structure logic — _is_final_round,
      encrypt_partial level bounds, round-key indexing at r < Nr), with H-2
      recorded; (3) GATE-601-B only after CAND-601-B's sota_delta and every
      recalled-baseline comparison are struck, limited to correctness
      equivalence, S-box independence of the counted ratio under its null
      control, and the measured ratio on the enumerable 2^16 instance; with
      GATE-601-A NOT dispatched, an inference block required in every producer
      artifact as a dispatch-time completion gate, and independent validation
      plus a Coordinator ledger archive closing the batch as in BATCH-001.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      DEFERRED TO BATCH-002, NOT DECLINED — and the distinction is deliberate.
      Two durable negative mathematical facts established this batch DO merit a
      KN-FIND, because they would stop a future session repeating the same
      error: (i) AES supplies exactly ONE element of GL(4,GF(2^8)) on a column,
      of multiplicative order 4, so no transitivity or 2-transitivity argument
      over GL(4,q) or AGL(4,q) is available for column-local invariants, and
      such invariants exist in abundance (~1.07e9 orbits on nonzero vectors);
      and (ii) byte-wise inversion PRESERVES GF(2^8)-collinearity, since
      Inv(lambda v) = lambda^-1 Inv(v), so the obstruction at SubBytes is the
      GF(2)-affine layer L and not Inv. Promotion is withheld from THIS archive
      for two reasons. First, this decision is `revise`, not `support` or
      `reject_scoped`, so no promotion is mandated. Second and decisively, the
      refutation-artifact discipline in docs/claims-and-verification.md requires
      the checkable artifact to be archived BEFORE the decision that relies on
      it; these facts currently live inside a validation report riding in this
      same commit, not in a standalone derivation note. BATCH-002 authors that
      note, snapshot-archives it alone, and promotes the KN-FIND in its ledger
      archive at proof_status: derivation with the same proof_refs. Nothing else
      in BATCH-001 is promotable: the harness pass is a reproducibility fact
      about an instrument and no claim about AES, and no gate was run.

  decided_by: coordinator
  decided_at: '2026-07-31'
