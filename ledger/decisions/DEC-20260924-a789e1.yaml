  # --------------------------------------------------------------------------
  disposition:
    outcome: revise
    approve_considered: >-
      REJECTED. RLR-1 and RLR-4 (b) each state that a failure makes the draft
      "NOT approvable as written", and what_the_readings_cannot_do (lines
      522-526) forbids an approval "with a removed field, an added exclusion
      or tolerance, a waived checker item". Every condition that would make
      the draft sound is one of those or new normative recording text:
      raise-path recording (RLR-1), a different NOT A BAR list (P-7), a
      zero-launch verdict or a declared stop (RLR-4 (b)). Protocol text is
      changed only by a versioned amendment decided on archived bytes
      (AGENTS.md; precedents DEC-20260924-650068 and DEC-20260924-e6638d
      approve_considered).
    other_dispositions_considered: >-
      - Close or park the lane: REJECTED. Nothing measured D. The
        obstruction is recording and admission wording in a layer that does
        not exist yet. Closing C1's measured side (KN-OPEN-9b4a2b) on it
        would be premature closure. The goal stays active.
      - Rule P-7, P-14 and P-15 not a bar as improbable: REJECTED (R-RLR1
        P-14_P-15 (4)); P-15 discards the read-back of a completed solve.
      - Record raise paths by replacing os.fork, os.write or the perf callees
        in packages: REJECTED in the successor's options (RB): it widens
        HR-3's closed list to process primitives and is a per-site design.
      - Treat a zero-launch m = 5 package as a designed stop: REJECTED
        (successor option RE): it would change the frozen m = 4 conditional
        sequencing, a scientific rule.
    route: >-
      A SUCCESSOR DRAFT, written from the successor census's own tables:
      (1) on a raise, the recorder reads, and only reads, the frozen
      function's own `rec` object from the traceback, so the pair is recorded
      on every path on which the parent read it, and child_created is true
      for every created child (key presence or a positive `pid`); (2) every
      created child is classified by one static fact, whether line 227 ran,
      and the class "no pair read by the parent" is declared not a bar in
      advance, with its reason; (3) the admission verdict names every read,
      adds a pre-declared, closed zero-launch verdict PASS_ZL (never for gate
      packages; void on any launch record), declares the infrastructure stop,
      and keeps F-4 non-blocking; (4) DV-18's development world is stated,
      with further development checks on the frozen function's raise paths,
      on the r4 closure and on the verdict.
    new_census_ruling: >-
      A NARROW ZERO-RUN CLOSE CENSUS IS NEEDED. The successor relies on code
      facts no census has stated: that `rec` in the outermost frozen
      run_child frame is the record object on every raise path (including
      raises in run_child's finally); the exact set of checker items that
      fail on every zero-launch outcome; that F-4 is the only non-blocking
      package; and the preflight / launch split and the redirections DV-18's
      development world needs. This act read those facts only as a preview
      (v2_solver.py 95-324; v2_check_run.py; r3_run_wrapper.py 140-432); it
      is not the census and is not relied on. What the two earlier censuses
      established is carried by hash, not recomputed.
    successor_draft:
      id: AMD-EXP-GFPN-05ff43-20260924-readbackclose
      path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_readbackclose.yaml
      status: draft (approved_by null, approval_decision null)
      key_parameters: >-
        - Incorporates ALL of readbackfull (RL-1..RL-8), and through it
          readbackcover (RB-1..RB-8), valueclose and everything they
          incorporate.
        - RK-1: child_created by key presence on return; on raise, a
          read-only traceback inspection copies the pair and report from the
          frozen `rec` and sets child_created from the key or a positive
          `pid`; pair_read_by_parent on every record; no new replacement.
        - RK-2: per-launch accounting of raises, no-pair children and
          before-fork records.
        - RK-3: named reads; the r4 verdict PASS / PASS_ZL / FAIL with a
          closed zero-launch rule (never gate packages); the infrastructure
          designed stop; F-4 non-blocking.
        - RK-4: DV-18's development world (preflight recorded, launch path
          invoked, no bypass); DV-18 (e) at 1073741831; DV-18 (f) (vi)-(ix),
          (h) and (i).
        - RK-5: value classes; HR-3's list unchanged from RL-5.
        - RK-6: REG-1 and readers unchanged.
        - RK-7: TWELVE bound hashes; ids, forbidden ids, ceiling unchanged.
        - Readings RKR-5 (integrity), RKR-1 (every pair read is recorded on
          every path; every created child marked), RKR-2 (reach carried;
          frame identity), RKR-3 (zero-launch exactness), RKR-4 (admission
          coverage, outcomes, F-4), RKR-6 (development world), RKR-7
          informational.
    readbackfull_draft_status: >-
      It stays a draft forever: status draft, approved_by null, bytes
      unchanged. It never took effect. Its text has authority only as the
      successor incorporates it.

  named_defects:
    D-1_raise_paths_unrecorded: >-
      RL-1 records from the returned record only; a raise inside run_child
      after fork (P-14; P-15 at v2_driver.py:166) discards a record that
      already holds the pair, and RL-1 then records child_created false for a
      created child. Remedy: readbackclose RK-1 (b). Correction:
      CORR-20260924-217903.
    D-2_empty_report_unnamed: >-
      P-7 (empty report, no pair) is not named not a bar, and RL-1 (c)'s
      "carries" is not defined as a key-presence test. Remedy: RK-1 (a), (c)
      and RKR-1's NOT A BAR class.
    D-3_by_design_refusal_of_zero_launch: >-
      RL-4 admits on a checker verdict that exits non-zero by design on a
      zero-launch m = 5 cells package, and on a package whose every launch was
      refused before fork. Remedy: RK-3 (b) PASS_ZL and RK-3 (c) designed stop.
    D-4_F-4_made_blocking: >-
      RL-4's "every `requires` entry" conflicts with the draft's own
      "unchanged: fixtures F-1..F-4" and the frozen plan's "NOT blocking".
      Remedy: RK-3 (d).
    D-5_development_admission_unspecified: >-
      DV-18 (a), (b) (readbackcover RB-5) and (e) (RL-6) run "through the r4
      run wrapper", whose preflight refuses them in a world without gate
      packages. Remedy: RK-4 (a); checked by RKR-6.

