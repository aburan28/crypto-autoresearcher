      R-RLR1-P-7_empty_report: >-
        A CREATED CHILD WITH NO SOURCE, NOT NAMED NOT A BAR. RULED ON THE
        DRAFT'S OWN WORDS.
        (1) The child is forked (181) and fails at os.chdir, os.open or
            os.dup2 (186-191) before setrlimit; the handler at 206 swallows
            it; the child exits 99; the parent reads an EMPTY report and
            returns refused_to_start with child_rlimit_report '' and no pair
            (220-225). No source carries a pair for it.
        (2) The NOT A BAR list names "the ERR setrlimit branch". P-7 is a
            different branch: a different report ('' against "ERR setrlimit
            ..."), exit status (99 against 97) and failing call. Reading "the
            ERR setrlimit branch" as "any branch on which no pair is taken"
            would widen the list after the census, choosing the one reading
            that makes the draft pass. That is the post-hoc change the draft
            forbids (lines 522-526), and the same ruling DEC-20260924-650068
            made on I-10 (R-RB1-I-10 (3)).
        (3) RL-1 (c)'s child_created is "true if the returned record carries
            child_rlimit_report": with the value '' it is true under a
            key-presence test and false under a truthiness test. The draft
            does not say which (census L-7). A created child could be
            recorded as not created.
        (4) RESULT: fails. The successor names the class (a created child
            whose parent never read a pair) as not a bar in its own
            pre-declared words, with the reason, and fixes child_created as a
            key-presence test (readbackclose RK-1 (a), (c); RKR-1).
