      archived_values: >-
        md 389-434; receipt 277-286. Two gb_only sites (v2_driver.py 693, 4
        calls; 711, 1 call). solve() sets res["solver"] = _slim(rec) (167)
        and threads_executed (169) before every return; _slim copies the pair
        when the record carries it; the r3 pass-through returns the same
        object. `-g` appended when gb_only (v2_solver.py 333); SC-4 skips
        every `-g` argv (r3_check_run.py 136).
      application: >-
        (a) holds from code on every branch on which run_child's record
        carries the pair (P-8..P-13). On P-1..P-4, P-6 and P-7 the frozen
        record carries no pair, so result["solver"] carries none; RL-2's own
        text provides "or 'absent'" for that case. Read literally, (a) is not
        met on those branches; read by its stated basis (the census tables of
        the fields the pass-through returns), it holds. This act does NOT
        choose between the two: the draft is not approvable on RLR-1 and
        RLR-4 (b) independently, so the choice decides nothing, and choosing
