  rationale:
    - >-
      THE DRAFT'S OWN READINGS DECIDE. RLR-1 and RLR-4 (b) were written
      before the census and say what a created child without a source, and a
      planned outcome the checker fails by design, mean: not approvable as
      written. The census found both, from frozen code.
    - >-
      THE LOST READ-BACK IS REAL, NOT HYPOTHETICAL IN KIND. On P-15 an S-1
      solve has completed under the cap and its pair is in memory when the
      raise discards it. Recording from the returned record alone cannot see
      it. The frozen function's own record object is on the traceback, so a
      read-only inspection records it without a second replacement.
    - >-
      CLASSIFY BY A STATIC FACT, NOT BY AN ENUMERATION OF BRANCHES. Each
      census in this lane has found one more branch. The successor's reading
      asks one question of every path, whether line 227 ran, and requires the
      pair wherever it did; the class where it did not is named in advance
      with its reason (the frozen child execs only after its own cap check).
    - >-
      THE CHECKER IS FROZEN; THE VERDICT ON IT CAN BE EXACT. The frozen item
      at 65-67 is a non-empty test that, on a package that launches nothing,
      fails by design. A closed, pre-declared zero-launch verdict, void on a
      single launch record and never available to a gate package, keeps the
      frozen ladder's m = 4 rule working without waiving the item for any
      package that created a child. It is decided before any r4 package and
      before any m = 5 cell has ever run under v2.
    - >-
      A CHEAP CENSUS BEFORE AN EXPENSIVE STAGE. The successor rests on code
      facts (frame contents on every raise path; the full failing-item set on
      zero-launch packages; the preflight / launch split) that a zero-run
      census can state in hours; a stage that found them false would cost a
      stage.
    - >-
      THE LANE STAYS OPEN. Nothing measured D. The obstruction is recording
      and admission wording in a layer not yet written. Closing C1's measured
      side (KN-OPEN-9b4a2b) on it would be premature closure.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

  scope: >-
    This decision concerns the readbackfull draft's approvability only. Its
    readings rest on the archived successor census, a static reading of the
    frozen implementation-v2/ and implementation-v2-a1/ trees, the
    phase-A-bound r3 layer and both r3 plans at dd1034553 bytes, and the
    archived read-back census. No package ran. Nothing here is a measurement
    of D. Nothing transfers to 262151, 16777291, 1073741831 or
    p = 2^64 - 2^32 + 1 as a result.

  remaining_uncertainty:
    - >-
      Whether `rec` in the outermost frozen run_child frame is the record
      object on EVERY raise path, including raises in run_child's finally
      (172-174), and whether any frozen handler returns another object
