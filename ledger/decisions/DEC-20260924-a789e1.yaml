        (4) Which branch occurs is a run-time fact (L-3). As
            DEC-20260924-650068 ruled for the failure branches of the earlier
            census, "not expected is not impossible", and a branch the method
            determined from frozen code is a finding, not a limit. The
            reading has no method-limit exemption in its NOT A BAR list.
