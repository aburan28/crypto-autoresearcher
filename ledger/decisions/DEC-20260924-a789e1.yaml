        CREATED CHILDREN WITH NO SOURCE, NOT NAMED NOT A BAR, AND RECORDED
        FALSELY AS NOT CREATED.
        (1) The frozen parent can raise after fork: os.read (214), os.wait4
            (223, 230, 244), the go-byte os.write (236; BrokenPipeError when
            the child exits in the window) and, where count_instructions is
            true, _perf_read (141 via 281). v2_solver.py was read at 95-324
            and the raise points are as the census states them. The docstring
            "never raises for child failures" (151) concerns failures the
            child reports, not parent-side raises.
        (2) On 230, 236, 244 and 281 the pair has already been set at 227 in
            `rec`. The raise discards it. On P-15 the child has run its whole
            workload under the cap and been reaped: a completed S-1 solve
            whose read-back exists in memory and is lost.
        (3) RL-1 (c) copies only "from the returned record and the call's
