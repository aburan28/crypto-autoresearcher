      result: HOLDS on every branch on which a pair exists; the no-pair branches are left undecided and are not outcome-determinative.

    RLR-4_cross_package_admission:
      draft_text: >-
        "approvable as written ONLY IF (a) every read ... of the recorded
        result of another package of the r4 lineage ... is covered by RB-4 or
        RL-4 as worded; AND (b) for each kind of package so read, no
        correctly recorded outcome that a dependent package's frozen logic is
        designed to act on ... is one on which the frozen checker or an r4
        check as specified exits non-zero by design. ... A read not covered,
        or a planned basis outcome that the checker fails by design, makes
        the draft NOT approvable as written." (lines 480-500)
      a_archived_values: >-
        md 438-455, 527-538; receipt 288-301. RB-4 covers X-01, X-02; RL-4
        covers X-04, X-07, X-08, X-09, X-10 by name, and X-03 (G1 read by
        REG-1 at the admission of G3 and G4) and X-11 (contingency manifests)
        only through its clause "every further cross-package read of an
        r4-lineage package that the successor census lists"; X-05 and X-12
        (and the X-03 reference) are NOT A BAR as worded; X-06 reads no
        recorded result.
      a_ruling: >-
        HOLDS AS WORDED. The listing clause is the draft's own pre-declared
        text (RL-4, lines 297-299), and the census lists X-03 and X-11, so
        both are covered. Coverage by a listing clause is weaker than
        coverage by name; the successor names them (readbackclose RK-3 (a)).
      b_archived_values: >-
        md 469-550; receipt 302-392. v2_check_run.py 65-67 appends "no child
        RLIMIT_AS read-back recorded" for every non-aggregate package whose
        collected list is empty (read at v2_check_run.py 62-73 by this act).
        (i) An m = 5 cells package whose runnable cells are all not_attempted
        "polynomial unavailable" (v2_driver.py 1071-1075) launches no capped
        child, is recorded completed_valid (1101), and is acted on by the
        m = 4 package's _condition_met (1119-1126: a prior cell not
        "not_measured" or "measured" makes the condition NOT met) and by the
        aggregates; for random_no2torsion one failed S5 m = 5 build row
        suffices. (ii) A package whose every launch was refused before fork
        has no pair either; its cells are recorded not_measured /
        infrastructure_error and the m = 4 condition treats them as met. The
        draft's own example (not_measured with children created) fails no
        item.
      b_ruling: >-
        FAILS BY THE DRAFT'S OWN WORDS.
        (1) (i) is a correctly recorded outcome that the frozen dependants
            are designed to act on (the m = 4 conditional rule exists for an
            m = 5 cell that does not measure), and the frozen checker exits
            non-zero on it by design. Under RL-4 the m = 4 package would be
            refused and, through `requires`, the rest of the chain. m = 5
            build failure (memory exhaustion at the 10 GiB cap) is a planned
            possibility, so (i) is a planned basis outcome. It alone makes
            the draft not approvable as written.
        (2) (ii) also meets the reading's words. Its cause is an
            infrastructure refusal (another solver-like process, a held lock,
            driver RSS, an invalid cap); stopping there for a Coordinator
            decision (which may rule an R-12 contingency) is a defensible
            DESIGN, but the draft does not declare it, and declaring it now
            would be a post-census exemption. The successor declares it in
            advance (readbackclose RK-3 (c)).
        (3) No condition can repair this inside an approval: exempting (i)
            from the 65-67 item at admission is "a waived checker item" or
            "an added ... tolerance", which lines 522-526 forbid. It is new
            normative text for a new draft, decided before any r4 package
            runs; no m = 5 cell has ever run under v2.
      F-4_requires_ruling: >-
        A NAMED DEFECT, NOT A (b) FAILURE AS WORDED. The census observes that
        RL-4 through `requires` makes build 4111's admission depend on F-4's
        r4 checker verdict, although the frozen plan's gate rule says
        "package 5 runs after the gate and is NOT blocking"
        (trial-plan-v2.json 78; trial-plan-v2-r3.json 506), build reads none
        of F-4's content, and F-4's checker exits non-zero only on generic
        items (md 510; receipt 346-354). That is not a by-design exit on a
        planned outcome, so RLR-4 (b) as worded does not reach it. But the
        draft says both "every `requires` entry of either r4 plan" (RL-4,
        line 293) and "unchanged: ... fixtures F-1..F-4" (line 398), which
        conflict on F-4. An approval could only pick one after the census.
        Named defect D-4; the successor keeps F-4 non-blocking by name
        (RK-3 (d)) and asks the close census to confirm F-4 is the only such
        package (RKR-4 (c)).
      result: (a) HOLDS as worded; (b) FAILS. NOT APPROVABLE AS WRITTEN.

    RLR-7_controls_a1_in_development:
      draft_text: >-
        "approvable as written ONLY IF the successor census names at least
        one ladder prime at which the frozen controls-a1 command can run in a
        development world through the r4 a1 entry WITHOUT a frozen-byte edit,
        stating what the command reads there ... and where a development plan
        derived as RB-6 (a) derives plans supplies each, and the frozen plan's
        watchdogs that bound its cost." (lines 501-512)
      archived_values: >-
        md 552-634; receipt 393-405. The only ladder prime at which every
        plan-read input is supplied without changing a frozen plan value:
        1073741831 (the frozen a1 plan's own controls_a1 prime; only a
        development label replaces the run id). If the derived plan may also
        re-set p / driver_args and recompute rescaling_parameters (as the r3
        DV-7 toy copies did): 4111. Watchdogs at 1073741831: 2 builders x
        1800 s, 2 S-1 x 1800 s, up to 4 S-2 x 1800 s, 1 gp x 7200 s; MODELED
        single-attempt sum 21600 s, not a measurement; re-solve attempts and
        in-process work outside it. L-9: which derivation RB-6 (a) permits,
        and the wrapper-level admission of a development controls-a1 package,
        are not decided by the census.
      R-RLR7-derivation: >-
        RB-6 (a) says "Plans are derived from the FROZEN plans, as r3's were"
        (readbackcover 315). The census shows the r3 plans kept every
        plan-read value of the frozen plans (md 569-573). The r3 DV-7 toy
        copies, which re-set p, driver_args and watchdogs, were development
        copies inside the r3 stage's checks, not derived plans (md 577-582).
        So the derivation RB-6 (a) names is VALUE-PRESERVING, and a derived
        plan does not re-set p or rescaling_parameters; 4111 would also
        exercise a different package than the one the plan runs. The reading
        therefore names 1073741831. This ruling applies RB-6 (a)'s words; it
        does not add text. The successor states it as normative text
        (RK-4 (b)) so that the stage does not depend on this decision's
        reading.
      R-RLR7-cost: >-
        Bounded by the frozen watchdogs at 1073741831; the 21600 s figure is
        MODELED arithmetic of declared timeouts, not a measurement (census
        label). ECC budgets are unlimited; memory and concurrency stay machine
        protection (one memory-heavy process; the 10 GiB cap).
      R-RLR7-wrapper_admission: >-
        OUTSIDE RLR-7'S CONDITION, AND A NAMED DEFECT (D-5). RLR-7 asks about
        the command and "the r4 a1 entry"; RL-6 (e) and readbackcover RB-5
        (a)-(b) run DV-18 "through the delivered r4 entry and r4 run
        wrapper". This act's reading of r3_run_wrapper.py (NOT a census
        result): preflight refuses every v2-a1 package unless the gate
        packages passed (need_gate, 282; r7_gate_packages 173-181), requires
        REG-1 against G1 for every package other than G1 (285-287; reg1 157-158
        returns NOT_EVALUABLE when G1 has not run), requires each `requires`
        entry's manifest (290), and requires the run id to be reserved in the
        plan read (270-271). In a development world without G1..G4 the
        wrapper therefore refuses DV-18 (a) controls, (b) anchor-identity and
        (e) controls-a1. Neither draft says how DV-18 passes or avoids that
        preflight. The successor states it: preflight recorded, expected
        admission refusals listed, the separate launch path (423) invoked in
        the development process, no bypass flag (RK-4 (a)); the close census
        checks it (RKR-6).
      result: HOLDS (1073741831). The wrapper-level admission gap is recorded as defect D-5 and remedied in the successor.

    RLR-6_solver_events_readers:
      draft_text: >-
        "INFORMATIONAL, NOT A BAR. ... The approval act rules on each, as
        DEC-20260924-650068 ruled RBR-4 (b)." (lines 513-521)
      archived_values: md 636-654; receipt 406-420.
      rulings:
        r3_resolve_writer: Not a reader of the file (rewrites its in-memory document). No effect.
        r3_run_wrapper_solver_events_block: >-
          Reads named keys and the whole-file sha256. New top-level keys change
          only the recorded sha256, because the bytes change; no verdict
          reads a key it does not name. Accepted.
        r3_run_wrapper_consistency_flag: Reads the top-level flag only. No effect.
        r3_check_run_events_file_integrity: >-
          Compares the file's sha256 with the manifest's recorded sha256;
