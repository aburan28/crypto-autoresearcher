    obtained_at: '2026-09-06'
    obtained_via: >-
      interactive question tool of the orchestrating session, after PR #815
      (design commit c39430554) was pushed; the answer is also recorded
      verbatim in coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-252a44/tasks/TASK-20260906-a01da6/approval-note.md.
    question_presented: >-
      Approve the v2 protocol amendment to EXP-ECDLP-612fb1 (batch-reselected
      fixed-size distinguished-point table)? The v1 batch measured the
      pre-registered T/2 claim as infeasible (S1 failed with CI-separation;
      F1's literal threshold also not reached -- a cell v1's contract didn't
      name). DEC-20260906-1f5b71 requires eight changes before any further
      run: (a) a ceiling-feasibility gate G3 from exact basins, run before
      interpreting any re-selected arm; (b) a non-vacuity guard + relative
      tolerance on S1; (c) a one-sided S2; (d) the headline reported as a
      full frontier tuple charging working storage, never a bare ratio; (e)
      a corrected batch-pool heuristic using the measured admitted-walk
      count; (f) a pool cap enforced per admission; (g) a permanent
      negative-fixture regression test; (h) a cheap a-scan run first to
      locate any feasible operating point. New run grid: T_sel in
      {0.65T, 0.75T}, N in {2^24, 2^30}, a=1/4, r=2, k=4, 5 seeds (~17
      runs). v1's own 0.51 prediction is retracted and replaced by the
      measured oracle floor (~0.55), flagged unverified. Approval authorizes
      execution: a committed Coordinator decision marks v2 approved and
      writes the executor handoff -- nothing runs on this answer alone.
    options_offered:
      - "Approve as frozen (Recommended)"
      - "Approve, but skip the curve re-run"
      - "Revise before approving"
      - "Do not approve; stop here"
    answer_verbatim: "Approve as frozen (Recommended)"
    answer_meaning: >-
      Branch A (approve as drafted) for EXP-ECDLP-612fb1's v2 amendment:
      commit this approval decision, bind the gate-field updates already
      authored by TASK-20260906-a01da6 and the executor handoff
      TASK-20260906-5e78c7, and dispatch execution in a new batch opened
      after this decision is on main. Option 2 ("skip the curve re-run") was
      not chosen and, per approval-note.md, would have produced an identical
      outcome on this contract's own scope, since v2 does not re-run Stage 3
      regardless of the answer. No revision was requested and no decline was
      given, so no `revise` branch is recorded.

  gate_field_scope: >-
    Exactly FOUR fields of experiments/EXP-ECDLP-612fb1/specification.v2.yaml
    change, plus one field added: status (review_required -> approved),
    approved_by (null -> coordinator), frozen (false -> true),
    execution_authorized (false -> true), and approval_note (the pre-approval
    "NOT APPROVED" text superseded by the approval record, which preserves
    that original text verbatim inside itself under a "PRE-APPROVAL NOTE,
    PRESERVED VERBATIM" heading). These are the same four gate fields (plus
    the note) v1's own approval (DEC-20260906-2b1387) changed on
    specification.yaml, and they are the only fields the frozen design
    contract names as under Coordinator approval authority
    (`invalidation_rules`: "Execution while status is not approved or
    execution_authorized is false: no run under this contract is evidence").
    Every other field of the v2 contract -- field_provenance, all eight
    amendment items (a)-(h) in discharges/controls/definitions, instrument,
    inputs, controls, metrics, preregistered_prediction, budget,
    stopping_rules, invalidation_rules, success_criterion,
    falsification_criterion, required_artifacts, cost_model, interpretation
    -- is a substantive protocol term drafted and committed at c39430554
    under the design task's own authority and reviewed by the user in the
    question above; touching any of them here, after the question was
    answered, would silently change a frozen protocol post-hoc (forbidden:
    AGENTS.md / CLAUDE.md "Never change success criteria after observing
    outcomes without a versioned protocol_amendment record" -- and no run has
    even occurred yet to justify any such change). `version` stays `2`:
    approval does not mint a new contract version, only authorizes execution
    of the one already drafted. The orchestrating session verified this
    exact diff scope against the committed bytes before this decision was
    written; this coordinator role has no shell and computed no hash itself,
    exactly as DEC-20260906-2b1387 and DEC-20260906-1f5b71 disclose for their
    own hash claims -- the sha256 of the approved v2 bytes is recorded by the
    Git half in this task's ledger receipt.

  amendment_binding: >-
    This approval discharges the amendment triggered by DEC-20260906-1f5b71
    (the evidence-review decision on H-ECDLP-37dc01 / EXP-ECDLP-612fb1 that
    recorded `weaken` and required a versioned protocol_amendment before any
    further run under this experiment identifier) and drafted at
    experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml (id
    PA-ECDLP-612fb1-v1-to-v2), whose `discharges` block is the authoritative,
    item-by-item mapping from DEC-20260906-1f5b71's
    `disposition_per_contract.EXP_ECDLP_612fb1.amendment_required_before_any_further_run`
    to the concrete v2 contract change, cited in full in
    `decision_rationale_for_verb` above. Approving v2 sets that amendment
    record's own `approved_by`/`approved_at`/`status` fields to reflect this
    decision (a further, additive act on the amendment record, not a rewrite
    of its `discharges`/`judgment_calls`/`claim_boundaries` content, which
    stays exactly as drafted). v1 is preserved unchanged at
    experiments/EXP-ECDLP-612fb1/specification.yaml and additionally frozen
    byte-for-byte at specification.v1-frozen-df3238e2.yaml; its 37 executed
    runs (RUN-ECDLP-612fb1-001..037, less the recorded infrastructure
    failure RUN-011, superseded by RUN-012) STAND AS EXECUTED and REMAIN
    UNAFFECTED AND UN-RE-SCORED by this approval or by any future run under
    v2. Where v2 and v1 disagree, and v2 is now approved, v2 governs
    execution going forward; v1 is not reopened.

  rationale:
    - >-
      Item (a), G3 ceiling-feasibility gate: approved verbatim as drafted in
      `inputs.g3_gate_procedure` and the new "G3 CEILING-FEASIBILITY GATE"
      control. Fixes the load-bearing defect the red team found (F-J3-1):
      the pre-registered T_sel = T/2 claim was infeasible by disjointness
      before any re-selection ran, a ceiling failure of the claim's premise
      that v1's own success/falsification criteria did not name a cell for.
      G3 makes that premise testable and explicit, at zero extra compute at
      N = 2^24 and informationally at N = 2^30.
    - >-
      Item (b), S1 non-vacuity guard with relative tolerance: approved
      verbatim as drafted in `definitions.non-vacuity guard` and the
      restated `success_criterion`. Fixes F-J4-1: v1's absolute tolerance
      (point >= -0.03, CI upper >= 0) passed vacuously on a keyed bijection
      where every table sat at 3-5% success and RHO at 0 -- the tolerance
      was at the scale of the object's whole dynamic range. The guard now
      requires STATIC(T) itself to carry real dynamic range before an "S1
      met" verdict can be trusted.
    - >-
      Item (c), one-sided S2: approved verbatim as drafted in the restated
      `success_criterion` (S2_v2) and `falsification_criterion` (F2_v2).
      Fixes F-J4-2: v1's two-sided "NULL-A gain within CI of zero" is
      unsatisfiable by NULL-A's own relabelling design (uniform relabelling
      over a large pool must randomise the table toward the random-subset
      level, measured gain -0.11 to -0.22 in every real cell). S2_v2 now
      tests the null's own expected sign instead of an impossible symmetric
      band.
    - >-
      Item (d), frontier-tuple headline charging S_peak: approved verbatim
      as drafted in the new `definitions.rho_ORACLE`, the frontier-tuple and
      rho_ORACLE/rho_cum lines in `metrics.primary`, and the interpretation
      bullet forbidding a bare advice-ratio headline. Fixes F-J3-2 ("fewer
      stored DPs" survives on no cell once working storage at the online
      site counts -- the smallest re-selected cell held 2.6T against
      STATIC(T)'s 1T) and F-J3-3 (the RQ's own epsilon is cumulative, where
      the ratio and break-even point read differently than steady-state).
    - >-
      Item (e), HEUR-BLT-7 with the measured admitted-walk count: approved
      verbatim as drafted in `definitions.admitted-walk count` and
      `definitions.r_eff (corrected, item e)`. Fixes F-J3-4: v1's r_eff
      formula assumed k = 4 walks per solved target, but a target stops at
      its first hit (mean measured 1.7 walks), so v1's formula overcounted
      admitted evidence by about 1.7x; the v1 (superseded) reading is
      retained beside the corrected one for auditability, never dropped.
    - >-
      Item (f), per-admission pool cap: approved verbatim as drafted in
      `instrument.pool_admission_v2`. Fixes F-J3-2's cap-honesty finding:
      v1's CAP(c) applied the cap after a full round's admissions were
      merged, so CAP(2T)'s measured S_peak reached 2.6-2.8T, not the 2T its
      name implies; v2 truncates per admitted target so the pool's entry
      count never exceeds c within a round, not only at round boundaries.
    - >-
      Item (g), permanent negative fixture: approved verbatim as drafted in
      `definitions.permanent negative fixture` and
      `inputs.g1_permanent_fixture_procedure`. Fixes F-J4-4: the snapshot
      analysis.py raised TypeError instead of scoring G1 FAILED when
      fit_cutoff returned None (both red-team bijection seeds have
      unfittable cutoffs by construction); v2 requires STAGE 4v2 to score G1
      FAIL (never PASS, never crash) on both fixtures before any real-cell
      G1 verdict is trusted, as a standing regression object, not a one-time
      check.
    - >-
      Item (h), Stage 0 a-scan run first: approved verbatim as drafted in
      the new STAGE 0 of `inputs.stage_plan`, the new
      `independent_variables.a_scan_grid`, and the "A-SCAN ORDERING CONTROL"
      replacing v1's clause (C6). Fixes F-J3-1's own `required_successor`
      (locate any feasible (a, r) before interpreting a re-selected arm
      there) and F-J4-3 (the a = 1/2 differential does not discriminate the
      basin model, since the same disjointness inequality holds at a = 1/4
      too; the ordering prediction rho_ORACLE(1/4) < rho_ORACLE(1/2) does
      discriminate, and v1's own data already corroborates it: 0.55 vs about
      0.67 at r = 2, 2^24).
    - >-
      The gate condition (design-experiment step 4) is satisfied on a
      recorded, verbatim user answer obtained after the drafted v2 amendment
      was pushed, exactly as the precedent DEC-20260906-2b1387 required for
      v1; nothing here rests on an in-session word alone.
    - >-
      Reserved review chain: the executor handoff's own `review_reservation`
      names results under this handoff CLAIM-RELEVANT and requires a
      snapshot archive, an independent Validator and Red Team under a fresh
      review_plan, then a Coordinator ledger archive, before any run under
      v2 is evidence -- the same posture BATCH-289698 used for v1, carried
      forward rather than relaxed by this approval.
    - >-
      Under the roadmap bias toward exponent-targeting mechanisms this lane
      remains what DEC-20260906-2b1387 and DEC-20260906-1f5b71 said it was: a
      bounded constant-factor measurement under KN-LIT-013 that the v1 batch
      already narrowed (advice ratio 0.65-0.69 at S_peak 2.6-8.9T; oracle
      floor about 0.55). ECC priority keeps it ranked ahead of doing
      nothing; the v2 re-run is cheap (~17 runs, 4 CPU-h advisory ceiling
      against v1's actual 0.14 CPU-h for a comparable-size grid) and
      decision-changing for RQ-ECDLP-78dbc5's fewer_DP question.

