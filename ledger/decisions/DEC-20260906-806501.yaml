  decision: approve_experiment
  decision_rationale_for_verb: >-
    Marks the drafted v2 amendment of EXP-ECDLP-612fb1 APPROVED (status
    review_required -> approved; approved_by null -> coordinator; frozen
    false -> true; execution_authorized false -> true; version stays 2) and
    binds the executor handoff TASK-20260906-5e78c7, discharging the goal
    head's RANK 1 approval gate for the v2 replication that DEC-20260906-1f5b71's
    `weaken` verb on H-ECDLP-37dc01 requires. The user's answer maps to a
    single unambiguous branch (approve as frozen; option 2 -- "skip the curve
    re-run" -- coincides with option 1 on this contract's own scope, per
    approval-note.md, since v2 does not re-run Stage 3 in any case). Each of
    the eight items DEC-20260906-1f5b71 required is approved verbatim as
    drafted, with experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml's
    `discharges` block naming exactly what each item fixes and which review
    finding it answers:
    (a) G3 ceiling-feasibility gate from exact basins, evaluated per
    (a, r, T_sel) cell before any S1/F1 interpretation -- discharges F-J3-1
    (red team, load-bearing: the pre-registered T_sel = T/2 claim was
    infeasible by disjointness before any re-selection ran);
    (b) S1 non-vacuity guard with relative tolerance (STATIC(T) eps_ss >= 0.5,
    CI-separated above RHO by >= 0.30; tol = 5% of the STATIC(T)-RHO gap) --
    discharges F-J4-1 (red team, load-bearing: S1's absolute tolerance passed
    vacuously on a keyed bijection at the object's own noise floor);
    (c) S2 restated one-sided as the null's expected sign -- discharges F-J4-2
    (red team, load-bearing: S2's two-sided form is unsatisfiable by NULL-A's
    own relabelling design);
    (d) the headline restated as the frontier tuple charging S_peak, with
    rho_ORACLE beside rho_T and rho_cum beside rho_ss -- discharges F-J3-2
    ("fewer stored DPs" survives on no cell once working storage counts) and
    F-J3-3 (the RQ's own epsilon is cumulative, where the ratio and U* read
    differently than steady-state);
    (e) HEUR-BLT-7 restated with the measured admitted-walk count in place of
    U k p_s -- discharges F-J3-4 (red team, directed: v1's formula overcounts
    admitted evidence by about 1.7x);
    (f) the pool cap enforced per admission so CAP(2T)'s S_peak is honestly
    2T -- discharges F-J3-2's cap-honesty finding (CAP(2T,T/2) measured 2.6T
    under v1's round-end timing);
    (g) fit_cutoff None mapped to a G1 FAIL, with the red team's two bijection
    seed sets kept as a permanent negative regression fixture -- discharges
    F-J4-4 (red team: the snapshot analysis.py raised TypeError instead of
    scoring G1 FAILED on a no-tail object);
    (h) a 2^20 a-scan run FIRST to locate any feasible (a, r) before any
    re-selected arm runs, with (C6) replaced by the ordering prediction
    rho_ORACLE(a=1/4) < rho_ORACLE(a=1/2) -- discharges F-J3-1's own
    `required_successor` and F-J4-3 (red team, directed: the a=1/2
    differential does not discriminate the basin model; the ordering
    prediction does).
    No item was revised, narrowed, or substituted at approval time: the
    orchestrating session verified that v2.yaml differs from the drafted
    commit c39430554 ONLY in the four gate fields plus approval_note, and
    that every one of the eight discharges (a)-(h) in
    experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml is implemented,
    byte-identically, in the approved contract. This decision authorizes
    EXECUTION UNDER V2 ONLY and nothing else: it changes no hypothesis
    status (H-ECDLP-37dc01 stays `analyzed`), promotes no finding, and
    produces no evidence.
