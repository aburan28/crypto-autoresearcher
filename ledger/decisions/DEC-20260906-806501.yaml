    - >-
      The sha256 binding of the approved v2 specification's bytes is not
      asserted in this record; it is recorded by the Git half in the ledger
      receipt, where the dispatcher verifies it content-first
      (research_dispatch.py, AGENTS.md "Concurrency: many agents, many
