    - >-
      tools/validate_ledger.py reports no error on any record of this goal.
      The pre-existing errors on origin/main (DEC-20260905-eb1df9,
      TASK-20260905-20625b, TASK-20260905-47742c, TASK-20260905-54bcbf,
