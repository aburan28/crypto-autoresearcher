coordinator_decision:
  id: DEC-20260921-77e8bc
  decided_by: coordinator
  decided_at: '2026-09-21'

  context: >-
    Continuation of the EXP-FROB-d8aa37 stage0 launch lane, immediately
    following DEC-20260919-eb9f07's diagnosis of RUN-FROB-39714f's
    interruption (whole-environment/container restart mid-run, destroying
    tools/experiment_execution.py's own supervisor before it could write a
    receipt) and its authorization of trial-plan-stage0-v5.json under a
    fresh run_id, RUN-FROB-f3e2a3. The dispatching session claimed
    TASK-20260919-490018 and launched RUN-FROB-f3e2a3 correctly this time --
    correct PATH, genuinely backgrounded, no external tool-call-duration
    timeout wrapper. RUN-FROB-f3e2a3 was ALSO interrupted, by the exact same
    failure mode: a second, consecutive whole-environment restart,
    independently confirmed by the dispatching session via /proc/uptime
    showing the machine had been up only ~12.87 seconds when checked, this
    time only ~11 minutes after the first restart (versus ~20 minutes for
    the first one). Same signature as before: the entire process tree,
    including the Python supervisor itself, was destroyed mid-run, before
    any execution-receipt.json could be written. The dispatching session
    confirmed no OOM signal in dmesg (15GB RAM available, the trial only
    requests 8192MB) and no diagnosable cause visible from inside the VM --
    this appears to be platform-level session/container churn outside
    anyone's control from inside the sandbox. TASK-20260919-490018's claim
    (which held RUN-FROB-f3e2a3's write_scope) has already been released as
    failed with this same disclosure by the dispatching session.
    This coordinator has no shell and cannot independently recompute any
    hash, re-check process state, or re-read /proc/uptime; the four cited
    hashes, the uptime reading, and the process-tree death are accepted as
    reported_by_session (see verification block below). This coordinator DID
    independently verify, by listing experiments/EXP-FROB-d8aa37/runs/RUN-FROB-f3e2a3/
    directly with its own Glob tool in this engagement, that it contains
    exactly seven entries -- launch.json, command.txt, stdout.log,
    stderr.log, environment.json, tuples.jsonl.gz, roots.jsonl.gz -- and that
    NO execution-receipt.json, manifest.yaml, raw-result.json, fixtures.json,
    metrics.json, certificates.json, report.md, check.stdout.log, or
    check.stderr.log exists at that path. This is not trusted from the
    requesting account; it is this coordinator's own read of the actual
    committed working tree, identical in method to the equivalent check this
    coordinator ran on RUN-FROB-39714f's directory in DEC-20260919-eb9f07.
    This coordinator also independently re-read
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock-successor-20260914-c85f6a.json
    in full: it still shows scientific_launch_authorized: true, unedited,
    with runtime_identity.sys_executable_sha256/sage_path_sha256 fields
    distinct from the lock's own overall content hash (the lock file
    contains no self-hash field; the sha256 46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5
    cited throughout this lane is the lock FILE's own content hash, computed
    externally and cross-corroborated by this coordinator against
    trial-plan-stage0-v5.json's own already-committed runtime_lock_sha256
    field, which cites the identical value). This coordinator also re-read
    DEC-20260919-eb9f07, trial-plan-stage0-v5.json,
    run-binding-stage0-v5-retry-20260919.json, and TASK-20260919-490018.yaml
    in full as the immediate predecessor records and templates for this
    record's own amendment.
    Note on repository state: PR #1284 (carrying DEC-20260919-119999,
    DEC-20260919-eb9f07, and all prior lane artifacts) was merged into main
    by an external actor while still marked draft. The dispatching session's
    branch has since been fast-forwarded to current origin/main, which now
    also contains substantial unrelated work from other concurrent
    sessions/goals (GFPN, QSP, ECDLP-bc7a54, etc.) that does not touch
    EXP-FROB-d8aa37 or coordination/frobenius/. This decision's own commit
    will go out as a new pull request.

  decision: amend
  target_ids:
