  the_decision_stated_plainly: >-
    RUN-FROB-f3e2a3's interruption is diagnosed, honestly and without
    fabrication, as the SAME failure mode that destroyed RUN-FROB-39714f: a
    whole-environment/container restart external to any script's own
    control, external to any timeout wrapper (there was none this time
    either), and external to any code defect in driver-v2.py/checker-v2.py.
    This is now an OBSERVED RECURRING PATTERN -- two consecutive launch
    attempts under the corrected source (driver-v2.py/checker-v2.py),
    launched correctly by the dispatching session both times, have each been
    killed by an independent whole-environment restart before any
    execution-receipt.json could be written. Both instances remain
    non-scientific, non-protocol infrastructure signal; neither says
    anything about H-FROB-73df22. On that basis, this coordinator (1)
    preserves RUN-FROB-f3e2a3's directory exactly as it stands -- its real
    partial roots.jsonl.gz and the four hashed files, with no
    execution-receipt.json authored for it, because the absence of one IS
    the honest record of what happened, not a gap to be papered over -- and
    (2) authorizes a fresh retry under a fresh, pre-minted run_id,
    RUN-FROB-16ecb6, via a fresh trial-plan-stage0-v6.json, a fresh
    run-binding, and a fresh launch handoff to the Executor
    (TASK-20260921-c70552), per the user's standing instruction to keep
    retrying automatically through this exact failure mode.

  rationale:
    - >-
      SECOND, CONSECUTIVE INSTANCE OF THE SAME FAILURE MODE, STILL
      INFRASTRUCTURE/PROTOCOL SIGNAL, NEVER NEGATIVE MATHEMATICAL EVIDENCE,
      PER AGENTS.md CORE RULE 5 / CLAUDE.md RULE 3. RUN-FROB-f3e2a3 is not a
      new, fourth failure mode; it is a REPEAT of RUN-FROB-39714f's own
      whole-environment-restart mode -- entire process tree destroyed,
      including the Python supervisor that would have written
      execution-receipt.json, before that supervisor's own
      completion/receipt-writing logic could run at all. This is the fourth
      interruption overall in this lane's history and, unlike the first
      three (external-timeout signal, immediate application-level error,
      whole-environment restart), is the first case where the SAME
      infrastructure failure mode has now recurred twice under the same,
      already-corrected source and launch procedure. Two-for-two launch
      attempts under driver-v2.py/checker-v2.py have been killed by
      whole-environment restarts, both non-scientific, non-protocol
      infrastructure signal. Neither RUN-FROB-f3e2a3 nor RUN-FROB-39714f
      says anything about H-FROB-73df22, RQ-FROB-7d8dd4, or whether
      Frobenius structure moves the index-calculus exponent.
    - >-
      NO FABRICATED RECEIPT. This decision does NOT author an
      execution-receipt.json for RUN-FROB-f3e2a3, and does not construct,
      estimate, or infer one from the partial roots.jsonl.gz or from what a
      graceful interruption receipt would ordinarily contain. Per AGENTS.md
      core rule 5 ("Never fabricate commands, outputs, timings, statistics,
      citations, or runs. Missing data stays missing and is reported as
      such."), the honest record of RUN-FROB-f3e2a3 is exactly what is on
      disk: real partial output (roots.jsonl.gz), three further hashed
      adapter/launch files, two confirmed-empty log files, and a documented
      absence of every downstream adapter/checker artifact, because the
      process that would have produced them was destroyed before it could
      run. RUN-FROB-f3e2a3's directory, as it stands right now, is preserved
      as-is by this decision. No file within it is edited, completed, or
      backfilled by this record.
    - >-
      THE RUNTIME LOCK BEING CITED REMAINS THE SAME, STILL-CURRENT, STILL-
      UNEDITED, LAUNCH-AUTHORIZED LOCK. This coordinator independently
      re-read linux-runtime-lock-successor-20260914-c85f6a.json in full in
      this engagement and reconfirms scientific_launch_authorized: true and
      its sha256 46d918a1a4b9d358df39f09a87d5221128cc1ce19cb62672bc35204785952eb5,
      cross-checked against trial-plan-stage0-v5.json's own already-filled
      runtime_lock_sha256 field (both agree). Nothing about the runtime, its
      guards, or its authorization changes here; a second whole-machine
      restart is not evidence the runtime lock's own guards were inadequate
      -- the failure is again a whole-machine restart, a class of event no
      per-process guard in linux-runtime-lock-successor-20260914-c85f6a.json
      claims to protect against, and this record does not construct a new
      claim that it does.
    - >-
      WATCHDOG SIZING RATIONALE REMAINS VALID, UNCHANGED. No run in this
      lane has ever shown signs of hanging or needing a shorter or longer
      watchdog; all four interruptions observed to date have each been
      either an instant application-level error, an external interruption
      from this lane's own now-corrected tooling, or (twice now) an
      infrastructure restart external to any process's own control -- never
      a hang. 86400 seconds remains sized generously above the only real
      duration signal available and remains a ceiling meant never to bind in
      the normal case, machine protection only per CLAUDE.md "Research
      budgets: progress first."
    - >-
      DIRECTION CHECK, unchanged from the whole DEC-20260909-bf5b48 ..
      DEC-20260919-eb9f07 chain. Stage0 is not itself exponent-moving; it is
      the correctness gate for H-FROB-73df22's two arms. No scientific claim
      of any kind is advanced by this admission/retry-authorization record.
      FROB is a declared ECC area (orchestration/research-priority.yaml line
      79), ranked ahead of non-ECC candidates at every selection point, with
      unlimited batch/wall-clock budget per AGENTS.md "ECC comes first."
    - >-
      BUDGET. Per CLAUDE.md "Research budgets: progress first" (2026-09-06):
      research cost estimates are advisory and require no repeated user
      approval; the Coordinator continues justified work within the
      authorized research scope. No 90-day stagnation review is active or
      warranted -- this lane has shown continuous documented progress across
      DEC-20260909-bf5b48 through DEC-20260919-eb9f07 and now this record,
      all within roughly two weeks, including two genuine, correctly-
      executing partial runs each destroyed only by infrastructure external
      to this program's own control. Authorizing a further retry after a
      second, consecutive infrastructure-only interruption is exactly the
      kind of routine continuation CLAUDE.md's "progress first" instruction
      protects, not a new spending decision requiring fresh justification.
      This is additionally covered by the user's own explicit standing
      instruction, relayed by the dispatching session, to keep retrying
      automatically through this exact recurring failure mode; this
      coordinator's role is to execute that instruction faithfully via a
      proper decision record, not to second-guess it. A whole-machine
      restart mid-run is squarely within "watchdog expiry checkpoints a
      task; it does not exhaust the campaign."
    - >-
      OBSERVATION FOR THE DISPATCHING SESSION/USER, NOT A BASIS FOR WITHHOLDING
      AUTHORIZATION. Two consecutive launch attempts under the identical
      corrected source and identical launch procedure have now been killed by
      the identical infrastructure failure mode, at intervals of roughly 20
      and 11 minutes respectively -- a shortening interval on a sample of two,
      not itself statistically load-bearing, but worth this coordinator
      flagging plainly: if a third attempt fails the same way, that would be
      three-for-three under corrected tooling, and at that point an
      operational-reliability assessment of the underlying platform (rather
      than of this lane's own code or protocol, both of which remain
      unimplicated) may be the more useful next step than a fifth immediate
      retry. This observation does not block, weaken, condition, or delay
      this record's own authorization of RUN-FROB-16ecb6; per the user's
      explicit instruction for this exact situation, retrying automatically
      is exactly what this decision does.

