coordinator_decision:
  id: DEC-20260904-67feea
  context: >-
    IDEA-20260904-b3675f proposes a formal three-cell (CELL-M/CELL-B/
    CELL-T) plus null-cell (CELL-N) design to decide, on many curve
    pairs under a frozen contract, whether HYP-A ((t,Z) alone), HYP-B
    (#E(F_p)[4] alone), or HYP-C ((#E(F_p)[4], #E^d(F_p)[4]) jointly)
    governs the m=4 symmetric-base census. It was never converted to a
    hypothesis or experiment. In the time since it was filed, this
    session independently ran EXP-MONO-4e6faa and EXP-MONO-ee06e2, each
    reviewed by independent Validator + Red Team, discriminating the
    exact same HYP-B-vs-HYP-C question the idea's own CELL-T names as
    "THE CRUX -- the only cell that separates HYP-B from HYP-C." This
    decision assesses how much of the idea's own claim is now answered,
    without overclaiming the parts that are not.

  decision: revise
  decision_label: >-
    idea_b3675f_cell_t_crux_substantively_answered_by_independent_arc_cell_m_and_cell_b_remain_genuinely_untested_not_closed_not_commissioned_idea_status_updated_additively

  target_ids:
    - IDEA-20260904-b3675f
    - H-MONO-d4c511
    - H-MONO-fa4cb9
    - EV-MONO-91bca2
    - EV-MONO-fae201
    - KN-FIND-edd62c
    - RQ-MONO-001
    - GOAL-MONO-001

  claim_tier: toy
  scope_statement: >-
    This decision changes no run, no evidence record, and no experiment
    status. It assesses one filed idea's own claim against already-
    archived, already-reviewed evidence and records a status for the
    idea alone.

  rationale:
    - >-
      CELL-T'S OWN QUESTION IS ANSWERED, AND BY STRONGER EVIDENCE THAN
      CELL-T ITSELF WOULD HAVE PROVIDED. CELL-T asks: do two curves
      matched on (t,Z,#E(F_p)[4]) but differing in #E^d(F_p)[4] give
      DIFFERENT census counts, by the exact predicted magnitude
      (HYP-C), or IDENTICAL counts (HYP-B)? EXP-MONO-4e6faa (h_+=0,
      h_-=1) and EXP-MONO-ee06e2 (h_+=0, h_-=3) are two curves sharing
      #E(F_p)[4]=tau=4 (h_+=0 in both) with DIFFERENT #E^d(F_p)[4]
      (giving h_-=1 and h_-=3 respectively) -- exactly CELL-T's own
      declared comparison, assembled from two independently-designed,
      independently-reviewed single-curve experiments rather than one
      unified pair-contract, but mathematically identical in content.
      The census DIFFERED between them by exactly the amount HYP-C
      (not HYP-B) predicts, confirmed by independent Validator
      reconstruction from scratch in both cases (EV-MONO-91bca2,
      EV-MONO-fae201), and the underlying mechanism was independently
      re-derived and confirmed structurally sound (not a curve-fit) by
      Red Team, then promoted as KN-FIND-edd62c. This EXCEEDS what a
      bare CELL-T pass would establish (an exact-integer difference of
      the observed kind) by also certifying the MECHANISM that predicts
      it, which the idea's own `method_ceiling` explicitly says CELL-T
      alone cannot do ("It CANNOT certify a mechanism -- only the
      companion derivation proposal does that").
    - >-
      CELL-M IS GENUINELY UNTESTED AND IS NOT CLOSED BY THIS DECISION,
      PER THE IDEA'S OWN EXPLICIT WARNING. CELL-M asks whether TWO
      DIFFERENT, non-isomorphic curves sharing the FULL matched tuple
      (t, Z, #E(F_p)[4], #E^d(F_p)[4]) give BITWISE IDENTICAL census
      counts -- i.e. whether a still-finer invariant exists beyond
      (#E[4], #E^d[4]). No experiment this session ran two DIFFERENT
      curves with the same four-tuple; every curve tested was unique in
      its own experiment. The idea's own text names the exact error
      this decision must not repeat: "A CELL-M pass bounds finer
      structure only for THIS observable. Asserting 'no finer invariant
      exists' from it repeats, one refinement later, exactly the error
      (C4) made with (t,Z)." Since no CELL-M pass (or failure) exists
      at all, this decision asserts NOTHING about whether a finer
      invariant exists beyond (#E[4], #E^d[4]).
    - >-
      CELL-B IS PARTIALLY, NOT FULLY, ADDRESSED. The idea's own CELL-B
      wants >= 5 pairs sharing (t,Z) with different #E(F_p)[4],
      reproducing the archived single-pair probe at scale under a
      contract. This session's work did not run a bulk >=5-pair panel;
      it re-derived and independently confirmed the MECHANISM that
      explains why #E(F_p)[4] (and its twist) matter, which is stronger
      in kind but not the same as CELL-B's own bulk-reproduction
      exercise. CELL-B's own bulk-panel form remains undone.
    - >-
      THE DERIVATION (KN-FIND-edd62c) GIVES A STRONG PRIOR FOR CELL-M,
      NOT A SUBSTITUTE FOR IT. Since the independently-verified STEP 4/5
      mechanism shows the census is a deterministic function of exactly
      (n_+, n_-, h_+, h_-), it structurally predicts CELL-M should pass
      -- but this is a PREDICTION from the derivation, not an empirical
      confirmation of CELL-M itself, and the idea's own protocol
      correctly treats CELL-M as an independent check, not a corollary
      to skip. A future CELL-M-only run (much cheaper than the idea's
      own full four-cell design, since CELL-T and much of CELL-B are
      already covered) is named as a candidate, not commissioned here.
    - >-
      THE FULL FOUR-CELL, DUAL-CLASSIFICATION-PATH, MUTATION-TESTED
      DESIGN AS ORIGINALLY SPECIFIED IS NOT COMMISSIONED IN FULL: most of
      its decisive content (the CELL-T crux) is already answered by
      independently-reviewed evidence, so running the full original
      contract now would spend a CPU-hour re-confirming what is already
      established rather than closing the one part (CELL-M) that
      remains genuinely open. This is a proportionality judgment, not a
      quality judgment on the original design, which remains sound and
      well-specified for whenever CELL-M is picked up.

  next_action: >-
    LOW-MEDIUM PRIORITY (the crux is answered; CELL-M is a cheap,
    valuable but non-urgent confirmation of the derivation's own
    prediction): if picked up, design a NARROWLY SCOPED CELL-M-only
    experiment -- find two non-isomorphic curves at one prime sharing
    the full (t, Z, #E(F_p)[4], #E^d(F_p)[4]) tuple and confirm bitwise-
    identical census counts, using the already-verified construction and
    the already-independently-audited h_+/h_- computation from this
    session's own EXP-MONO-4e6faa/EXP-MONO-ee06e2/EXP-MONO-8ec0e5
    scripts. This is far cheaper than the idea's own full four-cell
    design and closes the one genuinely open piece.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No new finding is made by this decision; it assesses existing,
      already-promoted evidence (KN-FIND-edd62c) against a filed idea's
      own claim and finds partial overlap. Nothing new to promote.

  procedure_deviations: []

  limitations:
    - >-
      This decision does NOT close IDEA-20260904-b3675f as fully
      answered -- CELL-M and the bulk form of CELL-B remain open. Do not
      cite this decision as evidence that no finer invariant exists
      beyond (#E[4], #E^d[4]).
    - >-
      Does not re-scope H-MONO-93bc4d's own already-closed collision-rate
      formula or resolve whether it is itself a proxy for the fuller
      law (named but explicitly deferred in multiple prior records).

  reviewed_by: []
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
