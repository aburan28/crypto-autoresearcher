coordinator_decision:
  id: DEC-20261011-4b043f
  recorded_at: '2026-10-11'
  decided_at: '2026-10-11'
  decided_by: coordinator
  question_ids: [RQ-SCURVE-84a540]
  goal_id: GOAL-SCURVE-48e06c
  archived_by: TASK-20261011-3252e9
  mode: snapshot_integrity_recovery
  decision: revise
  target_ids:
    - CORR-20261011-f64cd8
    - TASK-20261011-071e47
    - TASK-20261011-3252e9
    - TASK-20261011-d6157e
  context: >-
    TASK-20261011-e1f957 has a committed verification report and genuine
    completed release. TASK-20261011-071e47 has a one-path content-first
    snapshot receipt at commit 39b8261c6ff9b2dd7bc8643cc937911f6127cd66,
    a passing SCURVE-specific verifier and a completed release. The generic
    dispatch verifier cannot mark the archive row complete using that receipt
    commit because its message omits required task, goal and batch IDs.
    The existing custody queue remains write-once and its archive row queued.
  ruling:
    - >-
      Record CORR-20261011-f64cd8 as an additive correction of the archive
      binding method. Preserve the earlier receipt commit, release, queue,
      report, old producer bytes and historical handoffs without amendment.
      The release is retained as an observation of its own completion gate;
      it does not itself satisfy generic queue archive verification.
    - >-
      TASK-20261011-3252e9 owns the exact four-path seal packet: this
      correction, this decision, its own handoff and the handoff for
      TASK-20261011-d6157e. Its commit message must name
      TASK-20261011-071e47, GOAL-SCURVE-48e06c, BATCH-aa389e and
      TASK-20261011-e1f957, as well as all four new record IDs. Verify the
      seal's first parent, exact changed paths, hashes and reachability.
    - >-
      After the seal SHA exists, TASK-20261011-d6157e writes a new six-row
      same-batch queue by
      copying dispatch_queue.custody-20261011.json and changing only the
      TASK-20261011-071e47 row to completed with archive.commit_sha set to
      the seal SHA, archive.parent_sha to its actual first parent, and
      archive.path_sha256 covering exactly the e1f957 report and 071e47
      receipt. Preserve source_task_ids, record_ids, task handoff and all
      other rows. A new lane addendum binds the prior queue/addendum hashes
      and new queue hash and points to the new operative queue. Commit only
      these two paths in its separate exact-path archival commit.
    - >-
      Complete the queue transition only if official research_dispatch.py
      --ready-only --claims refs on the new path passes the generic Git
      archive verifier and reports no Ready custody task. Re-run the
      committed SCURVE-specific receipt verifier; compare the report and
      receipt bytes at HEAD against the frozen hashes. Publish the two
      verified commits on the existing ready PR and stop without CI polling.
    - >-
      The old producer and old snapshot remain incomplete; their downstream
      validator and ledger archive remain blocked. A separate Coordinator
      ruling is required before scientific validation or claim review can
      be routed. No goal, hypothesis, experiment, safety or attack-cost
      status changes here.
  rationale:
    - >-
      The generic verifier's content-first mode binds a reachable commit
      and its first parent while checking declared artifact bytes at HEAD;
      it does not require that binding commit to rewrite those artifacts.
      A new seal packet can satisfy the missing message-ID gate without
      changing the original receipt or pretending its producer was released.
    - >-
      The successor queue records the official archive transition only
      after the seal exists, avoiding a self-referential commit SHA. Two
      archival tasks give each commit exactly one declared path set and owner.
  evidence_refs:
    - CORR-20261011-f64cd8
    - ledger/handoffs/TASK-20261011-071e47.yaml
    - coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/dispatch_queue.custody-20261011.json
    - coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/tasks/TASK-20261011-e1f957/verification-report.json
    - coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/archives/TASK-20261011-071e47/snapshot-receipt.json
    - coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/claims/TASK-20261011-071e47.1.release.json
    - tools/research_dispatch.py
    - 39b8261c6ff9b2dd7bc8643cc937911f6127cd66
  limitations:
    - >-
      A completed release is not the generic archive's completed queue row.
      That row remains unverified until the successor queue with the seal
      commit and both content hashes passes official dispatch validation.
    - >-
      Content equality and archival completion cannot establish the L5
      certificate or controls. No scientific outcome is inferred.
  next_actions:
    - >-
      Archive the four-path seal packet under TASK-20261011-3252e9,
      then let TASK-20261011-d6157e bind its checked SHA and first parent
      in the successor queue and publish its exact two-path queue/addendum
      commit after generic verification.
    - >-
      After this procedural repair is published, separately rank a lawful
      route for the blocked independent validation without changing the old
      producer's release or snapshot history.
  knowledge_promotion:
    promoted: []
    not_warranted: Procedural custody repair without scientific evidence review.
