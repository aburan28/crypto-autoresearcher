coordinator_decision:
  id: DEC-20260807-c8aa8b
  context: >-
    Close of BATCH-cb71b5, the opening batch of GOAL-ENDO-001 -- the
    resource-labelled subproblem decomposition of prime-field ECDLP centred on
    endomorphisms, isogenous curves, and j-invariant structure. The batch produced
    14 lane research questions, 121 proposals, 121 machine-derived draft experiment
    contracts, 21 run records across 9 experiment ids, and 4 corrections. An
    independent Red Team session reviewed snapshot 22eb74ba and found ten material
    defects; a Validator session was dispatched in parallel and terminated on a
    provider session limit having produced nothing.
  decision: revise
  target_ids:
  - GOAL-ENDO-001
  - BATCH-cb71b5
  - EV-ENDO-e8d3e5
  - RQ-ICINV-475b5e
  - RQ-EWALK-8fa147
  - RQ-MTGT-2cabee
  - RQ-VOLC-f6253b
  - RQ-JINV-8fc13a
  - RQ-INSTR-f8faa0
  rationale:
  - >-
    THE BATCH'S HEADLINE READINGS DID NOT SURVIVE REVIEW AND ARE WITHDRAWN. The
    central claim -- that the isogeny class carries no attack-relevant structure --
    rested on a label-permutation statistic that the Red Team showed is a
    BETWEEN-CLASS MEAN detector with power 1.00 at a 0.9% shift and no sensitivity
    to within-class structure at all. The instrument control that was run
    (EXP-INSTR-2d32ba) characterised a different null (NULL-B) and does not license
    it. A negative cannot rest on a statistic that cannot see the effect it denies.
  - >-
    THE ONE TESTABLE PRE-REGISTERED PREDICTION WAS REFUTED. DECOMPOSITION.md section
    5 prediction 1 predicted zero within-class variance in relation yield; under the
    corrected sampler it is over-dispersed at both m and both primes. Whether that
    is a saturation artifact or a real curve effect is undetermined, because the
    batch ran only the saturated row of the density sweep. Recording this as a
    refuted pre-registration rather than reinterpreting it is the whole point of
    pre-registering.
  - >-
    TWO COST CLAIMS WERE WRONG IN THE DIRECTION THAT FLATTERED THE BATCH. The
    preprocessing-transport advantage was measured against a rebuild baseline
    inflated by ~log2(N) (double-and-add per entry for consecutive multiples);
    corrected, transport LOSES at every odd ell tested. And the ell = 2 transport
    run measured the identity map, because velu_odd's loop is empty at ell = 2. I
    re-derived both before accepting them; the second did not reproduce on a first
    noise-dominated attempt and required proper timing to confirm.
  - >-
    THE EWALK CEILING RESULT IS A SINGLE DRAW. Over 8 seeds the mean speedup is
    1.7344 (sd 0.2046) against a ceiling of 1.7321 -- statistically ON it -- with 3
    of 8 seeds above and one tripping P3. The batch's attribution of the shortfall
    to fruitless cycles is contradicted by the run's own counter reading zero. The
    claim is withdrawn, not restated.
  - >-
    A PROCEDURAL VIOLATION BY THIS COORDINATOR IS RECORDED RATHER THAN REPAIRED.
    None of the seven executed experiments had a frozen contract before execution,
    which AGENTS.md requires. Backfilling contracts now would present post-hoc
    specifications as pre-registrations and would be a worse violation than the
    original one. The seven runs are exploratory measurements and the evidence
    record caps their strength accordingly.
  - >-
    THE BATCH IS NOT WORTHLESS AND IS NOT BEING DISCARDED. Four things survive
    unchallenged: the exact S_3 monomial-support counts (9 / 10 / 13), re-derived by
    hand in an independent session; the liftable-count identity and its Var(z)/4
    consequence, verified on every curve at three primes to 2.9e-14; a
    Hurwitz-Kronecker-certified complete class enumerator that already caught one
    wrong implementation of itself; and certified-correct isogeny transport at odd
    ell. Those are real and they are what the successor batch builds on.
  - >-
    PREMATURE CLOSURE IS FORBIDDEN HERE (docs/inventor-protocol.md). None of the 14
    lanes is closed by this decision. The corpus of 121 proposals stands, including
    17 filed as recorded closures with named obstructions, and several lanes
    produced derivations worth more than the batch's own measurements -- notably the
    RQ-GGMB lane closing RQ-PAIR's stated open question from H-ENDO-001's
    scalar-action fact, and the RQ-JINV lane deriving the sqrt(2) negation
    double-count independently of the EWALK measurement that forced the same
    correction empirically.
  evidence_refs:
  - EV-ENDO-e8d3e5
  - CORR-20260807-3ee25d
  - CORR-20260807-a05e1e
  - CORR-20260807-df0585
  - CORR-20260807-2c9ae4
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
  limitations:
  - >-
    THIS BATCH HAS NO INDEPENDENT RUN-INTEGRITY VALIDATION. The Validator session
    produced nothing. The census arithmetic, the Wilson-Hilferty chi-square
    approximation, the Velu normalisation, and the claimed independence of the
    transport certificates have not been checked by a non-originating party. That
    gap is the single largest limitation on everything above and is the first item
    of the next batch.
  - >-
    The Red Team's own report is working notes only; its structured report was not
    written before its session ended. The notes carry real commands and real output
    and were partly re-derived by the Coordinator, but they were not themselves
    reviewed.
  - >-
    Both review sessions resolved to the SAME MODEL as the originating session,
    because this harness resolves every policy alias to one backend. That is exactly
    the correlation the suspended closure quorum exists to prevent, and it means
    "independent session" here means independent context, not independent judgement.
  - >-
    Everything is toy scale and capped at claim_tier: toy. No standardized or
    deployed curve is affected by anything in this batch, and no speedup against any
    baseline was produced or is claimed. sota_delta: zero.
  next_actions:
  - >-
    N1. Re-dispatch the Validator against the current head, with the run-integrity
    checks it never performed, at reduced scope so it fits in one session: the
    Hurwitz census, the liftable identity, the Velu normalisation, and certificate
    independence. Nothing in this campaign advances until that exists.
  - >-
    N2. Replace or characterise NULL-C. A between-class mean detector cannot support
    a within-class negative. Either build a nested variance-component estimator that
    separates the two, or state every future between-class result as a statement
    about means only. IDEA-20260807-34754f proposes the stratified design; it is the
    first contract to approve.
  - >-
    N3. Run the saturation-decay sweep across factor-base density, not at the
    saturated row, and settle whether the relation-yield over-dispersion is an
    artifact or a curve effect at densities near 1/m!.
  - >-
    N4. Repair velu_odd to REFUSE even ell rather than silently returning the
    identity, and re-run the MTGT arm against a correct incremental rebuild
    baseline. The corrected question is not "does transport win" -- it does not --
    but "what is the crossover ell", which the Red Team's fit puts near 17.
  - >-
    N5. Re-run EWALK across seeds with a reported distribution rather than a point
    estimate, and include the j = 1728 arm at a prime = 1 mod 12 (the batch's
    p = 100003 refused it). The Red Team's p = 100057 run is the model.
  - >-
    N6. Fix git_state() to distinguish untracked SOURCE from untracked OUTPUT, or
    require a commit before execution. A manifest that names a commit its code does
    not exist at is not a reproduction package.
  - >-
    N7. RQ-CANL-63098f has 5 proposals against 8-9 elsewhere and no executed
    experiment; its lane session died on the session limit. It is unadjudicated and
    must be re-dispatched before any statement about the lifting lane is made.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING IS PROMOTED. Evidence strength is `inconclusive` and direction is
      `neutral`, which is below the `replicated` threshold that would oblige a
      promotion. Two findings are individually strong enough to be worth promoting
      later -- the S_3 monomial-support counts and the liftable-count identity, both
      exact and both independently re-derived -- but promoting them from a batch with
      NO independent run-integrity validation would launder an unvalidated batch into
      the corpus. They are held for the successor batch, after N1.
  decided_by: coordinator
  decided_at: '2026-08-07'
