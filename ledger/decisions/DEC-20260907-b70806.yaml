      The contract's own decision_paths.negative still applies unchanged:
      instrument failure, hypothesis stays untested, no null or alive
      verdict. `inconclusive` remains the decision that matches this
      outcome without asserting a verdict the run did not reach.
    - >-
      This is a genuine, well-instrumented negative engineering result,
      not a repeat of the same mistake: the leaner engine was
      independently validated for correctness, is measurably more
      memory-efficient (peak RSS well below the prior run's trajectory for
      three of four targets), and the diagnosis correctly identifies CPU
      time, not memory, as the actual bottleneck this time. This is useful
      information for any future attempt and is recorded as such.
    - >-
      H-RELN-427bfd's status remains proposed; no candidate invariant
      changes status. INV-A4 and INV-A6 remain the only two of the five
      recovery controls affirmatively passed.
  evidence_refs:
    - EV-RELN-543f9b
    - EV-RELN-b3c6ef
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-repair/recovery-controls.json
  limitations:
    - >-
      This decision does not attempt a third repair (a compiled/vectorized
      enumerator, a substantially longer wall-clock budget, or the
      targeted-minimality-proof method) -- each is a genuinely different
      engineering approach requiring its own design effort, not a quick
      retry, and is named as a candidate next step rather than pursued
      here.
    - >-
      This decision does not touch EXP-RELN-f202be or EXP-RELN-82f487.
  next_actions:
