coordinator_decision:
  id: DEC-20260805-ec12e0
  context: >-
    GOAL-AES-003 BATCH-011 close. RC-B, named by DEC-20260805-a9dade as the
    single cheapest control converting BATCH-008's and BATCH-009's mechanism
    claims from lineage-internal findings into lineage-independent ones, was
    run against rc8probe.c (BATCH-007, committed 1a0ad198), an already-durable
    independently-authored yoyo instrument located after the goal record's
    originally-named substrates (valprobe.c, deriv_check.py) were found never
    to have been committed. The package was bound by a dispatcher-verified
    snapshot archive at commit 3d474a8a and reviewed by one independent
    validator, verdict passed.
  decision: partial_corroboration
  target_ids: [RQ-AES-003, GOAL-AES-003, EV-AES-acddd0]

  rationale:
    - >-
      THE INSTRUMENT'S INDEPENDENCE IS NOW THE STRONGEST-EVIDENCED CLAIM OF
      ITS KIND IN THIS CAMPAIGN. Every prior "independent implementation"
      claim in this campaign rested on the codebase existing and being
      distinguishable by inspection; this one was checked by grepping every
      symbol of one codebase against the other in both directions (zero
      matches) and by the validator confirming the two extensions are
      SUBSTANTIVELY different constructions, not merely renamed -- rc8probe's
      prefix counter derives the statistic from BATCH-008's finding
      specification rather than copying v4's differently-shaped field, and its
      ideal-permutation mode uses a persistent hash table where v4 uses a
      probabilistic-bound stream, a different design whose memory-growth
      failure mode is itself evidence against transcription.
    - >-
      COMPARISON A REPLICATED, AND THE DECISION RECORDS PRECISELY HOW MUCH
      THAT SETTLES. At r=5, N=2^27, the byte-locality absence at k=1,2,3
      reproduces cleanly (|z|<1 for all three, independently recomputed twice
      and matching to four decimals both times). The validator's own
      qualification is adopted here rather than smoothed over: this comparison
      is close to a sanity check on correct RNG and counting implementation,
      and bears only glancingly on the specific shared-harness risk BATCH-010
      named, which concerns whether the cipher-substitution mechanism survives
      independent instrumentation -- not whether the byte-locality mechanism
      does.
    - >-
      COMPARISON B, THE MORE DIRECT TEST, CAME BACK GENUINELY UNINFORMATIVE,
      AND THAT IS STATED AS THE HEADLINE RATHER THAN BURIED BENEATH COMPARISON
      A'S SUCCESS. Zero hits in both the live and ideal-permutation arms at
      N=2^24 is not a null result in the interesting sense; it is a failure to
      reach an exposure where a result of either kind could occur. The
      residual risk BATCH-010 named for the cipher-substitution mechanism
      specifically is UNCHANGED by this batch, not closed, and this decision
      says so without qualification.
    - >-
      A MINOR UNDISCLOSED DESIGN CHOICE IS RECORDED WITHOUT INFLATING ITS
      IMPORTANCE. The producer's hash table used a 0.5 load factor without
      stating this was a choice; a denser table might have reached one more
      exposure doubling within budget. Both the Coordinator and the validator
      independently confirmed this would not have changed the substantive
      outcome (expected excess at 2^25 is still ~0.44 events against
      BATCH-009's original ~14-event signal), so it is recorded as a
      disclosure gap, not treated as though it invalidates the batch.

  evidence_refs:
    - EV-AES-acddd0
    - EV-AES-1d5136
    - EV-AES-8b8dcf
    - EV-AES-e4c091

  what_this_decision_does_not_do:
    - It does not claim the cipher-substitution mechanism has been corroborated or refuted on an independent instrument; it explicitly has not been, by either.
    - It does not treat comparison A's replication as bearing strongly on BATCH-010's residual risk, per the validator's qualification adopted above.
    - It does not advance any closure criterion; no model independence exists under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOT WARRANTED. The instrument-independence methodology demonstrated here
      -- symbol-overlap checking in both directions plus a substantive
      construction comparison, not merely "written by a different task" -- is
      a genuine candidate technique for this campaign's future lineage-risk
      checks, but it is premature to promote a technique demonstrated once, on
      one instrument, without a second application confirming it generalises.

  next_actions:
    - >-
      SINGLE NEXT ACTION: GOAL-AES-003 BATCH-012, rank 1 = re-run comparison B
      at a denser hash-table load factor (~1.0) targeting 2^25-2^26 exposure
      within the same 8 GB budget, per OBS-B11-5/D-B11-1. This is the cheapest
      remaining lever on the one comparison that did not resolve, before
      considering a structurally different (non-hash-table) ideal-permutation
      implementation. Rank 2: RC-C from DEC-20260805-a9dade, still unrun -- a
      five-minute recomputation of OBS-B8-7's S-box-specificity percentile
      using all five available AES data points rather than two. Rank 3: RC-D,
      still unrun -- a second, differently-constructed null object (a keyed
      PRP that is not an oracle) to test whether BATCH-009's OUTCOME-A depends
      on idealness specifically (residual limitation U4).

  budget_accounting:
    producer_declared_seconds: 5400
    producer_consumed_seconds: 3607
    note: >-
      Well inside budget (task completed by 17:28:32Z against a binding stop
      of 18:34:50Z). The memory ceiling on comparison B was a hardware/design
      constraint, not a time-budget constraint.

  limitations:
    - Nothing here is a statement about full-round or deployed AES, and no comparison to published cryptanalysis is made in either direction.
    - Toy tier; comparison A used a random S-box, not AES, at a different key/seed than BATCH-008's central arms.
    - Session and implementation independence only; NO model independence, so nothing counts toward a closure quorum.
    - No red team reviewed this batch.
    - Comparison B remains genuinely unresolved; do not cite this record as evidence for or against BATCH-009's finding.

  decided_by: coordinator
  decided_at: 2026-08-05

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-sonnet-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
