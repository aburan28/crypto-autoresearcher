coordinator_decision:
  id: DEC-20260903-9f1190
  recorded_at: '2026-09-03'

  target_ids:
    - GOAL-ECDLP-001
    - H-ECDLP-a40416
    - EXP-ECDLP-c373eb
    - KN-FIND-1ba0fe
    - EV-ECDLP-921b5d

  decision: revise
  decision_label: run2_accepted_as_sound_measurement_replicated_upgrade_refused_split_verdict

  context: >-
    Disposes of the BATCH-e8a3a7 review round on RUN-ECDLP-c373eb-2, the
    replication of RC-1 commissioned to move KN-FIND-1ba0fe from
    `preliminary` toward `replicated`. The review plan
    (coordination/experiments/EXP-ECDLP-c373eb/batches/BATCH-e8a3a7/review-plan.yaml)
    was committed at af8faf394 BEFORE either reviewer launched; that commit is
    the ordering evidence. Two conjunctive joints, one owner each, mutual
    blindness never lifted, both reviewers launched concurrently in a single
    message as fresh independent sessions at review-adversarial / xhigh.
    Composed evidence is EV-ECDLP-921b5d.

  disposition_one_line: >-
    SPLIT VERDICT -- J1 holds, J2 breaks. RUN-ECDLP-c373eb-2 is ACCEPTED as a
    sound second measurement; the `preliminary` -> `replicated` upgrade of
    KN-FIND-1ba0fe is REFUSED. The claim under review was conjunctive across
    both joints and does not carry.

  decision_scope: >-
    ACCEPTS RUN-ECDLP-c373eb-2 as sound and admissible. The validator
    re-derived the instance and full 780-pair tabulation with methods sharing
    nothing with the producer's (exhaustive digit search vs Newton/Hensel;
    affine sequential chain vs Jacobian double-and-add; division polynomials
    psi_41 as an independent order-n criterion, calibrated on F_p first;
    order-n identity verified at p^20 as well as p^8), reproducing roughly
    1560 per-pair values and both 23-digit coordinates exactly, with zero
    mismatches. Its sealed-before-open block is tamper-evident and THIS
    COORDINATOR INDEPENDENTLY RECOMPUTED the seal hash rather than trusting
    the reviewer's assertion. Its Object-B control discriminates correctly and
    was strengthened, beyond the brief, into a t=1..9 dose-response sweep
    yielding image exactly {0, min(t,8)} -- which independently rules out the
    precision-artifact explanation that the null-lift control alone could not
    reach. REFUSES the confidence upgrade. The red team established, and this
    Coordinator independently re-verified by direct line comparison rather
    than accepting the figure, that RUN-1 and RUN-2 share 266 of ~270
    executable lines with every function byte-identical and the entire
    executable difference confined to five lines (p, A/B, n, the triples
    literal, one added assert). The two runs are therefore ONE IMPLEMENTATION
    on two instances: P(agree | shared systematic error) = 1, and the
    agreement carries likelihood ratio 1 on the question at issue. The red
    team's Object-A control PROVES TOO MUCH -- the upgrade argument survives
    unchanged against two runs of the same systematically wrong script, where
    the conclusion is known false -- and locates the failure exactly at the
    step "they agree, therefore the agreement is evidence about the
    mathematics." The patched form that does discriminate ("reproduced by an
    implementation sharing no code with the producer") is the program's own
    operative standard, satisfied by 31 of 50 existing `replicated` records
    and stated outright in EV-DIFFP-1e08cc, and RUN-2 does not meet it.

  what_this_decision_does_not_do:
    - >-
      It does NOT impugn Proposition E or the underlying mathematics. J2's
      objections concern implementation independence, not the derivation,
      which is classical and was separately confirmed. Nothing here reopens
      DEC-20260901-34e038's finding on its own terms.
    - >-
      It does NOT invalidate, supersede, or retract RUN-ECDLP-c373eb-2. The
      run is sound, admissible, and stays exactly as archived; runs are
      immutable and this one is not in error.
    - >-
      It does NOT lower KN-FIND-1ba0fe's confidence. `preliminary` is
      retained, not downgraded; the finding is unchanged in substance.
    - >-
      It does NOT claim RUN-2 was wasted. It supplies a second instance, a
      correct measurement, and -- through the review it triggered -- a sharper
      account of what this experiment's internal controls can and cannot
      establish.
    - It does not change EXP-ECDLP-c373eb's frozen specification.
    - It does not admit any B71, batch, or new experiment beyond the FG-1 successor named below.

  non_claims:
    - >-
      Refusing the upgrade is not a finding that the D1 collapse is doubtful.
      Two independent lines now support it (the classical derivation, and the
      validator's genuinely independent re-derivation of the toy tabulation);
      what is missing is cross-implementation reproduction of the RUN package
      itself, which is a narrower and purely methodological gap.
    - >-
      The validator's t=1..9 dose-response sweep is a reviewer artifact, not
      a run under the frozen contract. It is recorded as strengthening the
      inference, not as experimental evidence in its own right, and no
      downstream record may cite it as a run.

  rationale:
    - "The composition rule was pre-committed in the review plan: J1 and J2 are conjunctive, and holds-plus-breaks is a SPLIT, not a pass. Applying it as written -- rather than treating the strong J1 verdict as carrying the round -- is the whole reason the rule was written before the verdicts were known."
    - "Both reviewers' central factual claims were independently re-verified by this Coordinator rather than accepted: the seal hash was recomputed from the stored block, and the 266-common-line figure was recomputed by direct comparison of the two scripts. A Coordinator composing two subagent verdicts on trust would reproduce exactly the correlated-confidence failure that J2's objection is about."
    - "Refusing an upgrade that the evidence does not support costs this program nothing, while recording it as `replicated` would have put a mislabelled confidence into an immutable knowledge entry and licensed downstream work to treat one script's output as two."
    - "My own recorded prior leaned against the upgrade. I record explicitly that J2's verdict agreeing with that prior is NOT the reason it is adopted: J2's argument is adopted because its Object-A control demonstrably discriminates and its line-count claim independently re-verified, and I would have been obliged to overrule my own prior had J2 returned `holds` on comparable evidence."

  procedure_deviations_recorded:
    - id: PD-1
      severity: material
      summary: >-
        MY OWN PLAN LEAKED THE EXPECTED ANSWER. The review plan's J1
        attack_plan states the expected canonical image {0,8} and the null
        image {0,1}, and the same plan instructs the reviewer to read it
        first. So J1's re-derivation was implementation-blind but NOT
        answer-blind. The validator caught this itself and disclosed it
        unprompted; the credit is the reviewer's, and the defect is the
        Coordinator's. Weight is only partly reduced: the roughly 1560
        per-pair values, the per-level lift digits, and the two 23-digit
        coordinates were disclosed NOWHERE and could not have been guessed,
        so the agreement retains real force -- but no downstream record may
        describe the IMAGE SETS themselves as blindly reproduced.
      correction_for_future_rounds: >-
        Expected values belong in `coordinator_prior`, never in the
        attack_plan of the joint whose owner also holds the blind
        re-derivation. Adopted as standing practice for this goal's future
        review plans.
    - id: PD-2
      severity: disclosed_tool_limitation
      summary: >-
        tools/check_review_independence.py reports FAIL on this round: it sees
        the re-deriver's declared sources_read intersecting blind_from (7 of
        8 paths) and concludes the re-derivation was not independent. This is
        a FALSE POSITIVE of exactly the class already recorded as PD-1 of
        DEC-20260831-a9716f: the checker has no notion of the two-phase
        seal-then-open protocol that THIS PLAN ITSELF MANDATED. The validator
        opened those paths in Phase 2, after sealing, precisely as instructed,
        and listed them honestly. Deleting them would have turned the check
        green by falsifying a source list and was not done. THE INDEPENDENCE
        CHECK IS RECORDED AS A PROCEDURE DEVIATION, NOT AS A PASSING CHECK,
        and no downstream record may state that it passed. What carries the
        blind-ordering property instead is the sealed block's sha256,
        independently recomputed by this Coordinator from the stored canonical
        JSON. The tooling gap is real and recurring and is now twice recorded.
    - id: PD-3
      severity: minor
      summary: >-
        The validator's directory listing incidentally revealed the sibling
        reviewer's path. It opened nothing there and declared
        read_sibling_reports: false. Disclosed by the reviewer; blindness
        holds.
    - id: PD-4
      severity: contract_deviation
      summary: >-
        EXP-ECDLP-c373eb's frozen specification declares budget.maximum_runs:
        1, and RUN-ECDLP-c373eb-2 is the second run against it. No amendment
        record was created before running, and no `amendments/` directory
        exists for this experiment. Flagged by the validator as a hygiene
        item and adopted here as a genuine contract deviation: a replication
        needed either a specification amendment raising maximum_runs or an
        explicitly recorded deviation, and it received neither at dispatch
        time. Recorded now rather than backfilled silently. This does not
        invalidate RUN-2, whose measurement is sound; it means the run was
        dispatched outside its contract's declared run budget.
    - id: PD-5
      severity: minor
      summary: >-
        docs/claims-and-verification.md states certificates are stored in the
        run's raw-result.json and summarized in the manifest. In both RUN-1
        and RUN-2 the certificate block is present and correct in manifest.yaml
        and the execution report but ABSENT from raw-result.json. Flagged by
        the validator. Recorded as a standing hygiene defect of this
        experiment's run packages, affecting both runs identically; not
        corrected here because runs are immutable.

  evidence_refs:
    - ledger/evidence/EV-ECDLP-921b5d.yaml
    - coordination/experiments/EXP-ECDLP-c373eb/batches/BATCH-e8a3a7/review-plan.yaml
    - coordination/experiments/EXP-ECDLP-c373eb/batches/BATCH-e8a3a7/reviews/TASK-20260903-6048dc/validation-report.yaml
    - coordination/experiments/EXP-ECDLP-c373eb/batches/BATCH-e8a3a7/reviews/TASK-20260903-d02517/red-team-report.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/manifest.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/raw-result.json
    - ledger/evidence/EV-ECDLP-f5c698.yaml
    - knowledge/findings/KN-FIND-1ba0fe.md
    - ledger/hypotheses/H-ECDLP-a40416.yaml
    - 'review plan commit af8faf394, committed before either reviewer launched'

  limitations:
    - "Zero new compute by this decision; it composes two reviewer artifacts and two Coordinator re-verifications."
    - "The independence checker did not pass (PD-2); the blind-ordering property rests on the recomputed seal hash and the reviewers' attestations, and is recorded as such rather than as a mechanical pass."
    - "J1's re-derivation was implementation-blind but not answer-blind (PD-1); the image sets specifically must not be cited as blindly reproduced."
    - "Both runs remain a single ~10-bit configuration family; nothing here supports any cryptographic-scale claim."

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No promotion, and no upgrade of the existing entry. KN-FIND-1ba0fe
      REMAINS at `confidence: preliminary`. The round was convened precisely
      to test whether it should move to `replicated` and returned a
      conjunctive split refusing that move, on two independent grounds: the
      two runs are one implementation (so their agreement is correlated, not
      corroborating), and the upgrade argument proves too much against a
      known-false object. Two further defects in the target label are
      recorded for the corpus rather than acted on here: the documented
      threshold in docs/evidence-and-reproducibility.md does not decide this
      case, and `replicated` is absent from the KN-FIND confidence vocabulary
      entirely (0 of 81 findings). A note recording the refusal and its reason
      is appended to KN-FIND-1ba0fe additively so a future reader does not
      re-attempt the same upgrade blind.

  next_actions:
    - >-
      Dispatch FG-1, the single item that would discharge J2: an independent
      cross-implementation reproduction of the D1 image, roughly 40 lines and
      under five seconds. Construct the order-n lift GROUP-THEORETICALLY with
      no Hensel iteration -- S_hat' = [p^(r-1) * ((p^(r-1))^-1 mod n)] L for
      any lift L, which reduces to S because the scalar is 1 mod n and
      satisfies [n]S_hat' = O because the scalar kills the formal group --
      using AFFINE Z/p^r arithmetic rather than Jacobian coordinates. This
      shares no line with either existing script and exercises a different
      lift construction AND a different group law. Because the order-n lift is
      unique, x_hat' == x_hat on all 8 digits is a hard binary check on the
      load-bearing object, against the five sampled pairs currently on record.
      It must be a NEW experiment or an amended contract, not a third run
      against a specification whose maximum_runs is already exceeded (PD-4).
    - >-
      Fold FG-2 into the same task if cheap: a three-line cross-check of the
      existing unused fp_add/fp_mul path against the Jacobian core, closing
      UC-1 directly.
    - >-
      Adopt PD-1's correction as standing practice for this goal: expected
      values go in coordinator_prior, never in the attack_plan of the joint
      whose owner holds the blind re-derivation.
    - >-
      Do NOT re-attempt the `replicated` upgrade until FG-1 returns. If it
      confirms, the honest label for H-ECDLP-a40416 becomes a widened scoped
      status; `replicated` on KN-FIND-1ba0fe additionally requires resolving
      that the term is absent from the KN-FIND confidence vocabulary.
    - >-
      Route the two corpus-level defects (undefined `replicated` threshold in
      docs/evidence-and-reproducibility.md; `replicated` absent from KN-FIND
      confidence vocabulary) to their own harness-level decision. They are not
      this goal's to settle unilaterally and block no research step here.

  decided_by: coordinator
  decided_at: '2026-09-03'
  decision_authority: >-
    Ordinary Coordinator authority over evidence composition, review
    disposition, and knowledge promotion per AGENTS.md's Core Rules. No user
    authorization is invoked or required. No goal closure, no completion
    quorum, and no cryptanalytic claim is asserted.

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_used: false
    fallback_reason: null
    degraded_requirements: []
