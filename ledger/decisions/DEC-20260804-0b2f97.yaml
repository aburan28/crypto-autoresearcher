coordinator_decision:
  id: DEC-20260804-0b2f97
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-108
  recorded_by_task: TASK-20260804-158
  archived_by: TASK-20260804-159
  context: >-
    BATCH-108: Two new proposals. IDEA-0f5339 (division polynomial recurrence):
    method ceiling O(sqrt(N)) — too weak. IDEA-c3577b (spectral gap): equivalent
    to H-PSEUDO in disguise.

  decision: close_two_proposals_advance
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    IDEA-0f5339 (division polynomial recurrence): ANALYSIS SHOWS closed.
    Division polynomial degree ~ sqrt(N), giving bound O(sqrt(N) * sqrt(B)) >>
    H-PSEUDO target O(sqrt(B)). Method ceiling too weak.

    IDEA-c3577b (EC multiplication graph spectral gap): equivalent to H-PSEUDO
    by definition (spectral gap = C²/N). No new approach.

    HONEST STATUS after 108 batches:
    The program has exhausted all tractable directions for:
    1. Proving H-PSEUDO (9+ approaches closed)
    2. Finding a counter-example (no C > 5.2 found at p=1009..50021)
    3. Using non-decomposition approaches (k-way MITM, hybrid, all closed)
    4. Finding a new structural ingredient (Wesolowski quaternion absent, MAGCS blocked,
       division polynomial too weak, spectral gap circular)

    H-PSEUDO remains the precise open mathematical question. The program has made
    significant theoretical progress (6 new KN-FINDs, 3 new evidence records,
    comprehensive barrier characterization) but has not found a sub-rho algorithm.

    GOAL-ECDLP-001 stays active.

  exact_next_action: >-
    Continue: BATCH-109 returns to the deferred idea ECDLP-IDEA-103 (Faithful Tropical
    Source Atlas) for a quick mathematical feasibility analysis. Tropical geometry
    has been used in algebraic combinatorics to bound polynomial systems; it might
    avoid the DL circularity by operating on the COMBINATORIAL structure of the
    summation polynomial rather than its algebraic character sum.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Shape repaired under DEC-20260805-7b3e91 (RUL-6). The record as committed
      wrote `knowledge_promotion: not_warranted` as a bare token with no stated
      reason. No KN-* entry was created by this decision. The reason was not
      recorded at the time and is NOT reconstructed here.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable}
  claim_ceiling: theoretical
  official_research_state_changed: false
  decided_by: coordinator
  decided_at: '2026-08-04'
