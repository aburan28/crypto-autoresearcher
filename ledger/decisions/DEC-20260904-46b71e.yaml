coordinator_decision:
  id: DEC-20260904-46b71e
  context: >-
    Composes independent Validator (J1/J2/blind-rederivation/proves-too-
    much all hold, full from-scratch reproduction, zero disagreement with
    the Executor) and Red Team (J3: new resultant cross-check is real but
    weak/redundant; J4: exact match confirmed but h_-=1 cannot discriminate
    linear vs. other functional forms of the h_- term, and a concrete,
    free h_-=3 follow-up candidate was found) review of EXP-MONO-4e6faa,
    per review-plan TASK-20260904-be7527. Both reviewers worked fully
    independently and neither found any defect in the executed computation
    itself; the substantive finding is a scope limitation on what a single
    h_-=1 point can support, named by Red Team and accepted here in full.
    See EV-MONO-91bca2 for the full evidentiary summary.
  decision: revise
  decision_label: >-
    d3_closed_form_h_minus_term_confirmed_exactly_on_first_evidence_eligible_test_but_linear_functional_form_only_partially_discriminated_concrete_h_minus_equals_3_followup_named
  target_ids:
    - H-MONO-d4c511
    - IDEA-20260904-4f614a
    - IDEA-20260904-b3675f
    - EXP-MONO-4e6faa
    - RQ-MONO-001
    - EV-MONO-91bca2

  hypothesis_status_before: proposed
  hypothesis_status_after: partially_supported
  hypothesis_status_after_note: >-
    H-MONO-d4c511's own two-sided prediction resolves toward (I): the
    closed form's #1^4 and #2+1+1 predictions match the exhaustive census
    EXACTLY (R1=R2=R3=0) on a curve with h_->0, independently reproduced
    from scratch by the Validator. This is real, decisive discriminating
    evidence against the specific named rival "the invariant is #E[4]
    alone" (off by 48 and -144 on this same curve) and is the FIRST
    evidence-eligible confirmation of the D3 formula under this program's
    own rules -- the two prior "witness curve" integer triples cited in
    IDEA-20260904-4f614a were always, by that record's own disclosure, a
    non-evidence-eligible probe. However, per Red Team's J4 finding, the
    found curve's h_-=1 is the minimal possible positive value, and
    1^k = 1 for every k -- so this ONE point cannot distinguish the
    CLAIMED LINEAR h_- dependence from any other functional form agreeing
    at h_-=1. H-MONO-d4c511's own outcome (I) as literally written ("the
    closed form's own predicted #1^4 and #2+1+1 counts... match the
    exhaustively censused values EXACTLY") is satisfied by the letter of
    this run; its own surrounding prose ("closes the retrodiction-bias
    gap... upgrades the formula from 'fits two curves' to 'genuinely
    predictive'") is only PARTIALLY earned, because "genuinely predictive"
    implicitly claimed more discriminating power over the FORM of the
    h_- term than a single minimal-value point can deliver. Status is
    therefore recorded as partially_supported rather than supported,
    pending the h_-=3 (or similarly non-minimal) follow-up.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: active
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-d4c511
        from: proposed
        to: partially_supported
    experiment_status_changes:
      - experiment_id: EXP-MONO-4e6faa
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    closure_authorized: false
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    Scoped to the m=4 symmetric-base distinct-split (Z=3) stratum, toy
    scale, one curve (p=101, A=1, B=0). Supports: the D-term genuinely
    depends on h_- (not on h_+ alone); the "#E[4]-alone" rival is refuted
    on this curve. Does not yet support: that the h_- dependence is
    specifically linear (as opposed to any other form agreeing at
    h_-=1); the non-split strata; any relation-rate, cost, exponent, or
    cryptographic-scale claim; any re-scoping of H-MONO-93bc4d.

  rationale:
    - >-
      A CLEAN COMPUTATIONAL RESULT AND A REAL SCOPE LIMIT ARE BOTH TRUE AT
      ONCE, AND BOTH ARE RECORDED: the exact match is genuine, independently
      reproduced evidence -- not a coincidence, not a bug, not a fit to
      this specific curve (it was found by search, not selected for
      agreement). But "matches exactly" and "fully tests the claimed form"
      are different claims, and H-MONO-d4c511's own prose blurred them.
      Recording partially_supported rather than supported keeps the ledger
      honest about exactly how much the retrodiction-bias gap has closed,
      per AGENTS.md rule 4 (claims scoped to what was tested) and rule 9
      (no premature closure dressed as a stronger result than it is).
    - >-
      RED TEAM TURNED A LIMITATION INTO A NAMED, ACTIONABLE NEXT STEP AT NO
      EXTRA COST: rather than merely flagging that h_-=1 under-tests the
      functional form, it exhaustively enumerated all 10,100 non-singular
      (A,B) pairs at p=101 using only already-verified filter functions and
      found 200 curves with h_-=3, h_+=0 (e.g. A=1, B=33) -- a candidate
      that, if it also gives an exact match, would discriminate a genuinely
      linear D-term (predicting a specific different D value) from a
      quadratic or step-function alternative. This is accepted and acted on
      directly (see next_action).
    - >-
      THE NEWLY-WRITTEN RESULTANT CROSS-CHECK CODE'S WEAKNESS IS ACCEPTED,
      NOT TREATED AS A DEFECT: J3 found it non-tautological but largely
      redundant with an already-passed, stronger check. It does not
      undermine the primary result, which rests entirely on
      already-independently-verified code (UC.classify_fibre,
      RC.qe_from_sym) reused unmodified. Future citations of this run
      should not lean on the new cross-check as if it were strong
      independent assurance; EV-MONO-91bca2 records this precisely.
    - >-
      THE PROVES-TOO-MUCH CONTROL'S OWN CAVEAT (the two "witness curve"
      triples are probe-level, not evidence-eligible) IS NOT A NEW DEFECT:
      IDEA-20260904-4f614a and H-MONO-d4c511 both already disclosed this
      plainly before this review round ran. The Validator's independent
      re-derivation confirms the disclosure was accurate, not overstated --
      a case of a prior self-disclosure being verified rather than a new
      correction being needed.

  next_action: >-
    HIGH PRIORITY: design and dispatch a follow-up experiment testing the
    SAME D3 closed form on a curve with h_->1 (candidate: p=101, A=1, B=33,
    per Red Team's own finding of h_-=3, h_+=0 -- to be independently
    re-verified by that experiment's own Stage 0, not assumed), comparing
    the observed D-term against the LINEAR prediction (D = h_+ n_- + 3 n_+)
    versus at least one plausible non-linear alternative (e.g. quadratic,
    D = h_+ n_- + 9 n_+) named explicitly before execution. A match with
    the linear prediction and a mismatch with the quadratic one would fully
    close the retrodiction-bias gap this decision leaves open; any other
    outcome is itself informative and must be reported plainly. This
    follow-up gets its own hypothesis ID (a distinct, sharper falsification
    condition than H-MONO-d4c511's own, which this decision has already
    resolved) rather than reopening H-MONO-d4c511's frozen text.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A genuinely new, independently-verified exact-match result exists,
      but promoting "the D3 closed form's h_- term is confirmed" to the
      knowledge corpus now would overstate what one minimal-value point
      supports (per Red Team's J4 finding, accepted above). Promotion is
      deferred until the h_-=3 follow-up named in next_action either
      corroborates the specifically linear form (strengthening promotion)
      or falsifies it (requiring a corrected closed form before any
      promotion).

  procedure_deviations:
    - >-
      NONE IN THIS ROUND'S OWN EXECUTION. The one procedural note is
      upstream: the Executor's first dispatch was interrupted by an
      infrastructure rate limit before any run was recorded (no
      mathematical evidence affected), and the redispatch corrected an
      earlier Coordinator mistake (an unwarranted opus model override
      contradicting the task's own declared resolved_model_id). Neither
      affects this decision's own evidentiary basis.

  limitations:
    - >-
      One curve, one prime (p=101). No claim about h_->1 in general, about
      other primes, or about the non-split strata.
    - >-
      Does not resolve whether the h_- dependence is linear; see
      next_action.
    - >-
      Does not re-scope H-MONO-93bc4d's own already-closed collision-rate
      formula, named but explicitly deferred per H-MONO-d4c511's own
      claim_boundary_and_test_boundary.

  reviewed_by: [validator, red-team]
  decided_by: coordinator
  decided_at: '2026-09-04'
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
