          restriction-transfer question is stated nowhere in the corpus and
          this is one of the two exponent-relevant routes of the lane
          (DEC-20261002-7a3f19 R10).
        OPEN-C: >-
          DECLINED. The corrected text is a generic-group time-memory question
          with a simulable oracle, carries no exponent stake, and depends on
          the Hhan pointer for its claim that the time half is settled. Prior
          art is plausible and unchecked (Ying-Kunihiro 2017 and
          Auerbach-Giacon-Kiltz 2020 are recalled pointers, unopened; Dinur
          2020 is abstract-read). REVISIT WHEN (i) SRC-HHAN-2024 is frozen and
          read by a decision, AND (ii) a literature check of generic
          time-memory bounds for multiple DL finds no settled answer; or
          earlier if a record needs the memory-limited branch of
          HEUR-HARVEST-FV-2 (M < K) to rest on a theorem. The K-of-L time
          half is carded as a short check only when a record needs it. This
          does not deprioritise the arity-1 membership question for F_V,
          which stays carried by HEUR-HARVEST-FV-2(b).
        OPEN-D: >-
          FILED as knowledge/open-problems/KN-OPEN-c2e86a.md with the
          validator's corrected text (the cost law c_can stated; orbit
          enumeration recorded as the zero-gain baseline; the ill-defined
          "computes DL-information" branch dropped), plus a Coordinator
          exponent-stake line stating the condition under which it could
          matter.
      priority_note: >-
        DEC-20261002-7a3f19 R10 is now triggered: KN-OPEN-91d4f6 is precise
        and not a duplicate, so its toy ladder ranks ahead of further
        generic-family bookkeeping. A zero-run design is carded
        (TASK-20261003-3c8ea2).

    - id: R6
      question: May EXP-SEMBIN-3d9a71 proceed to an approval decision, and what must change first?
      ruling: >-
        NOT YET. The heuristic it tests has changed (R3), so under
        DEC-20261002-7a3f19 R11 the contract is RE-DRAFTED before approval, as
        draft version 2 under the same identifier. It is not amended: a
        protocol_amendment applies to an approved contract, and this one never
        was. The re-draft is carded (TASK-20261003-e7058d) and snapshot-bound
        (TASK-20261003-7a4c19). The version-1 draft is still archived as is by
        TASK-20261002-5f0b2c, because it is the reviewed object. After the
        version-2 snapshot verifies, a separate Coordinator approval decision
        checks the items below one by one, together with protocol
        completeness. No separate review round is required before that
        decision; R3's residual_uncertainty is addressed by the contract's own
        gates.
      required_changes_before_approval:
        - id: X1
          what: >-
            Re-anchor heuristic_as_stated to HEUR-HARVEST-FV-1 version 2 as
            filed in ledger/hypotheses/H-SEMBIN-c7e1d4.yaml, quoted verbatim
            and bound by the file's sha256 at the ledger commit. Statement
            issues A1 to A11 are marked resolved by version 2 or carried
            forward explicitly.
        - id: X2
          what: >-
            Decision statistics are Z4 and Z3 (and R_2 = Z4 + Z3 as defined by
            version 2). N_2 is computed, gated by N_2 = 6 Z4 + 2 Z3, and
            reported, but no decision test is a Poisson fit of N_2.
        - id: X3
          what: >-
            S3 becomes a two-sample test of R_2 (or of Z4 and Z3) against the
            null's empirical distribution, not a goodness-of-fit to
            Poisson(lambda_hat); the Poisson fit is reported as secondary. The
            N-POI Poisson-heterogeneity check is replaced, as a validity
            condition, by a split-half null-versus-null calibration with its
            threshold frozen. The FALSIFIED condition "the cell's null passes
            its Poisson calibration" is replaced accordingly
            (VAL-20261003-17b1e4 JR3-B1).
        - id: X4
          what: >-
            Koblitz structural families. The version-1 gate G3-EXCL expects
            "one full <+-pi>-orbit at n >= 31 gives N_2 = 0". That expectation
            is wrong: each orbit carries the X^2 - tX + 2 and X^3 + X + 2t
            families, which are Z3-type coincidences between distinct
            2-subsets (for example lambda^{i+2}u + lambda^i u =
            t lambda^{i+1}u + (-lambda^i u)), counted 4n per orbit in
            VAL-20261003-17b1e4 JR3-B2 (toy scratch). DESIGN.md A2's argument
            covers only {a, a} pairs and does not exclude these. The re-draft
            derives the structural count from the definition, gates it by brute
            force on calibration curves, and applies version 2's exclusion,
            reporting the raw and excluded counts.
        - id: X5
          what: >-
            Koblitz admissibility and the sigma-stable sub-clause. On the
            n-grid {31, 37, 41, 43, 47}, toy scratch (VAL-20261003-17b1e4
            JR3-B7) finds a prime-order Koblitz curve only at n = 41 (a = 0,
            h = 4), whose sigma-stable dimensions {0, 1, 20, 21, 40, 41} give no
            sparse cell. The re-draft restricts this contract to ordinary
            curves and non-sigma-stable V on admissible Koblitz curves (arm KR),
            drops arm KS, records the sigma-stable sub-clause UNTESTED here,
            and recomputes the expected arm sizes and power. Admissibility is
            still decided at S0-3 by the contract's own procedure.
        - id: X6
          what: >-
            Multiplicity. m_max is recomputed from the re-drafted cell table and
            frozen in the draft, before any run. Carrying 345 after cells are
            removed by design is not required.
        - id: X7
          what: >-
            V distribution and |F_V|. Skipping V with |F_V| = 0 conditions the
            tested distribution on |F_V| > 0; the re-draft states the tested
            distribution as such, logs the skip rate, and records |F_V| against
            the trace-geometry classes of RT-20261003-24c995 O9 as a secondary
            measurement. The null stays matched to the realised size.
        - id: X8
          what: >-
            decision_it_changes. A FALSIFIED reading voids the generic layer's
            application to F_V for every harvester outside the conservation-law
            laws at the falsifying cell's scope (H-SEMBIN-c7e1d4 CH-2;
            VAL-20261003-17b1e4 JR1-B2). The version-1 text "the distributional
            premise of HEUR-HARVEST-FV-2's random-model justification" is
            replaced. hypothesis_link points at P3 of the FILED record.
        - id: X9
          what: >-
            Identifier and binding checks owed on the draft id
            (allocate_id.py --check EXP-SEMBIN-3d9a71; git grep 3d9a71), and
            the TASK-20261002-5f0b2c receipt of version 1.
      unchanged_and_endorsed: >-
        The closure-matched, size-matched null; the integer and point paths
        with G4 path equivalence; the AP, GAP, Sidon, planted and sensitivity
        controls; the no-shared-code gates and the mutation self-test with one
        mutant per defect class (the R3-by-analogy order of DEC-20261002-7a3f19);
        the INVALID / INCONCLUSIVE / FALSIFIED / PASS rules other than X3; TA-1
        transfer stated as an assumption; the V3 weak arm as disclosed; the
        advisory budget. The design's PD-4 (minutes, not seconds, for the
        largest cells) is accepted as forced by the resolution target.

    - id: R7
      question: How may Hhan 2024 (arXiv 2402.11269) be cited?
      ruling: >-
        ONLY AS A POINTER until it is FROZEN under inputs/ with a
        source_record, sha256 of the PDF and of the derived text, and a
        verbatim-quote table for every statement either reviewer relied on.
        No decision, hypothesis, evidence or knowledge record may rest on it
        before a later Coordinator decision reads the frozen bytes. The freeze
        is carded now (TASK-20261003-a19c53, snapshot TASK-20261003-f2b6e0).
        In this decision and the records it files, every Hhan-dependent
        statement is labelled pointer and backs nothing. That covers the
        explicit constants of Thm 3.3 and 3.4, the free equality gates, Thm
        C.1, the |F| >= 10 exclusion, the 0.943 and 0.471 sqrt(l) constants,
        Lemma 3.2, and the reviewer sketches built on them.
      why: >-
        Both reviewers read the source in session scratch: the red team from
        the HTML and a v1 PDF extracted in its scratchpad, the validator from
        the HTML (sha256 c76d7566...). No bytes are in the repository. The
        red team itself asked for the freeze (RC-4). Withdrawing this program's
        own false statements about the source (CORR-20261003-b35a0c E1, E2) is
        safe without the freeze; adopting the source's content is not.
      deferred: >-
        Yun 2015 full text, as an independent second source for the m >= 2
        constant (RT-20261003-24c995 RC-4, second half). Revisit when a record
        proposes to rest a constant-level K-relation statement on Hhan Thm 3.4.

    - id: R8
      question: Which errors are now established, and how are they recorded?
      ruling: >-
        CORR-20261003-b35a0c records E1 (the generic-constant premise of
        CORR-20261002-e58c3a K14 and DERIVATION.md section 3.4 item 1), E2
        (the inverted Shoup/Maurer attribution of DERIVATION.md section 3.3 and
        the draft's SD-2), E3 ("+7.17 is the generic minimum", including
        DEC-20261002-7a3f19's header and R8 reasons), E3b (claim (B)'s
        boundary) and E3c (the dense-regime limit and guard). No affected
        record is edited. K14's conclusion and R8's ruling stand.

