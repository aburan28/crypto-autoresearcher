      question: File H-SEMBIN-c7e1d4, and move H-SEMBIN-8e7ae3?
      ruling: >-
        FILED at ledger/hypotheses/H-SEMBIN-c7e1d4.yaml, status `proposed`,
        with the corrected generic layer (R3), HEUR-HARVEST-FV version 2 (R3),
