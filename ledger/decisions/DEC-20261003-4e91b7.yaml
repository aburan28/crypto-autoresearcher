        falsifiable statement with scheduled validation for its first
        heuristic clause (EXP-SEMBIN-3d9a71, re-draft carded). Leaving it
        unfiled would leave EXP-SEMBIN-3d9a71 unapprovable (DEC-20261002-7a3f19
        R11) for no epistemic gain.
      what_filing_does_not_do: >-
        It does not move H-SEMBIN-c7e1d4 past `proposed`. It discharges no
        completion criterion of GOAL-SEMBIN-5078bc. It adopts no Hhan content.
      question_attribution: >-
        question_id RQ-SEMBIN-fa2e3f, limb (d), PARTIAL (see the record's
        question_id_note). This departs from DEC-20261001-5c9e7a R9's reading
        that neither goal question covers IDEA-20260930-4b7d1e. That reading
        let an IDEA carry question_id null. A hypothesis must carry a
        resolvable question, and limb (d) is the time-and-memory comparison
