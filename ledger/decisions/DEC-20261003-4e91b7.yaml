    zero-run design. Both reviewers have returned. TASK-20261002-46ba70 (red
    team, RT-20261003-24c995) owns JR-2 and the proves-too-much control.
    TASK-20261002-9e27f4 (validator, VAL-20261003-17b1e4) owns JR-1, JR-3 and
    JR-4. TASK-20261002-a84e65 (idea-generator) returned DESIGN.md and a draft
    contract EXP-SEMBIN-3d9a71. This Coordinator read in full both reports,
    DESIGN.md, the draft specification, DERIVATION.md, heuristic-restatement.md,
    the H-SEMBIN-c7e1d4 draft, the round carrier with its prior,
    DEC-20261002-7a3f19, CORR-20261002-e58c3a, and the three cards. No
    reviewer script, JSON output or scratch output was opened or re-run. Their
    numbers are cited as the reports give them.

  # ---------------------------------------------------------------------------
  # Composition. Each reviewer owns its joint. No verdict is a vote.
  # ---------------------------------------------------------------------------
  composition:
    - joint: JR-1 -- the COR-GEN interface
      owner: TASK-20261002-9e27f4
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/validation_report.yaml
      verdict: breaks
      load_bearing_findings:
        - >-
          JR1-B1. On a [lambda]-closed list, the orbit-sum relation
          sum_{i<n} [lambda^i]F_1 = O and the characteristic-polynomial
          relation meet G1-G4 as worded, are non-trivial under the drafted
          exclusion, cost O(n log l) or O(log l), and give Dai's reduction
          nothing with probability 1 (toy scratch S1, n in {11, 13, 17, 19,
          23}). Corrected: non-triviality over Z/l on <+-lambda>-orbit
          representatives.
        - >-
          JR1-B2. G1-G4 bound a harvester's cost on RANDOM lists. The
          inference "COR-GEN binds F_V" runs the wrong way. It holds
          unconditionally (first moment) only for ENUM by lookup, MITM,
          MITM_CAPPED and per-target golden collision, by decomposition
          conservation; for every other generic harvester, including PCS
          batching and a pair-sum harvester that is fast on any additively
          structured list, it needs HEUR-HARVEST-FV-1(a).
        - >-
          JR1-B3 and JR1-B4. The Shoup/Maurer attribution is inverted, and
          K14's premise ("no source states the constant") is false at source.
          K14's conclusion holds. Recorded in CORR-20261003-b35a0c E1, E2.
        - >-
          JR1-B5 (minor). The reduction's list building costs O(log l) per
          element, so the reduction gives Omega(sqrt(l)/log l): still exponent
          level.
      failed_attacks_that_matter: >-
        The negation-closed adaptation of Dai's reduction HOLDS once
        coefficients are reduced mod l and merged over +-pairs. G4 is
        redundant. The Q-mixed list is a genuine and necessary modification of
        Wagner section 3 (read at source).
    - joint: JR-2 -- the (C-yes) residual and the hybrid dichotomy
      owner: TASK-20261002-46ba70
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-46ba70/red_team_report.yaml
      verdict: holds
      load_bearing_findings:
        - >-
          No breaking artifact. Over 39 generic configuration families per
          degree, both conventions, the minimum margin over the VOW column is
          +0.585 bits at EVERY listed degree, degree-independent, at the
          degenerate end (ideal birthday harvesting with a negation map,
          |F| = 2, K = 2). It tends to 0 from above as K -> 1, where the
          harvester is rho (baseline embedding +0.00037 bits). X-6 as written
          is reproduced at source (+7.1746 at n = 131, d = w = 10) and is not
          the frontier.
        - >-
          The sparse/dense dichotomy and the dense-limit = PCS identification
          HOLD, with two qualifiers: the dense per-relation formula needs a
          per-version-yield guard (without it, 115 to 905 spurious sub-VOW
          cells per degree appear), and the injectivity limit is n_h -> l_e/2.
        - >-
          Claim (B)'s premise survives into the shallow dense regime (boundary
          n_h w ~ 24.5 l); its conclusion holds in every regime.
        - >-
          Theorem-backed part (constant-level exclusion for |F| >= 10 with the
          conservative negation conversion; addition-only harvesters at every
          |F|) rests on Hhan 2024, read at source by the reviewer. POINTER ONLY
          in this decision (R7). Residual: free-negation harvesters with
          |F| < 10 are OPEN, as the generic DL constant question.
    - joint: proves-too-much control
      owner: TASK-20261002-46ba70
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-46ba70/red_team_report.yaml
      verdict: holds
      load_bearing_finding: >-
        As scoped, the signature fires on no object (F_q^* at n in {131, 256};
        genus-5, -6 and -8 Jacobians). The mutation "admit the object's native
        m-fold membership test at the arity-1 price" fires on every object by
        19 to 75 bits. The arity-1 restriction of clause 2's class is
        load-bearing and is the separator; priced at each oracle's true
        success probability the counting is consistent.
      independence_note: >-
        Same red-team session as JR-2, disclosed in the plan. The objects were
        reused hash-checked from TASK-20261001-b2c916 and TASK-20260928-3f90b8.
    - joint: JR-3 -- HEUR-HARVEST-FV-1 and -2 as formal statements
      owner: TASK-20261002-9e27f4
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/validation_report.yaml
      verdict: breaks
      load_bearing_findings:
        - >-
          JR3-B1. N_2 is compound Poisson (clumps of 6) on negation-closed
          lists, so the clause is falsified by its own null; the stated null
          calibration (Poisson) fails on the null itself in essentially every
          cell. Same finding as TASK-20261002-a84e65 DESIGN.md A1 (NOT
          independent: PD-3).
        - >-
          JR3-B2. Each <+-lambda>-orbit carries 4n non-excluded structural
          coincidences in two families (X^2 - tX + 2; X^3 + X + 2t), so a list
          of full orbits carries 2|F| deterministic coincidences, in F_V and F*
          alike (toy scratch S2, exact at n <= 23).
        - >-
          JR3-B3 (clause 1(b) counts inverse pairs), JR3-B4 (clause 2 is
          false in the dense regime |F|^2 > 2^8 l M via membership ENUM),
          JR3-B5 (K counts free formal identities: 4 bits, not 5), JR3-B6 (the
          Koblitz form is unit-dependent), JR3-B7 (no testable sigma-stable
          Koblitz cell on V1's grid; only n = 41 has a prime-order Koblitz
          curve there, toy scratch).
        - >-
          Justification (ii) of clause 2 conflates a rigorous random-list
          count with an assumption about adaptive membership on F_V.
    - joint: JR-4 -- the KN-OPEN candidates
      owner: TASK-20261002-9e27f4
      report: coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/validation_report.yaml
      verdict: breaks
      load_bearing_findings:
        - "OPEN-A: new, but used the retired bucket-averaged observable and mixed E(F_2^n) with <P>."
        - "OPEN-B: duplicate as worded (KN-LIT-f37b9a, KR-IC-889857; KN-OPEN-d218ec special case); first-fall half recorded as settled."
        - "OPEN-C: its random-F membership oracle is simulable by equality, so the model is generic; its time half appears to follow from Hhan (pointer); as a T^2 M bound it is already false."
        - "OPEN-D: trivially settled with zero gain by orbit enumeration (toy scratch S4); it omitted the cost law."
      search_limitation: >-
        Grep over knowledge/, not the kb index; absence of a hit is not
        evidence of absence.

  convergence: >-
    Two findings were reached by both reviewers through different routes. (1)
    Hhan 2024 states explicit constants and counts equality as free: the red
    team from the HTML and the v1 PDF (O2), the validator from the HTML
    (JR1-B3, JR1-B4). Both sessions were mutually blind. (2) The arity of the
    membership test is load-bearing: the red team by mutation on the
    proves-too-much objects (O8), the validator through JR3-B3 and the "(ii)
    is an assumption" finding. Their relation to each other is unknown to the
    validator (its PD-4). ONE apparent convergence is NOT independent: N_2's
    non-Poisson clumping (DESIGN A1 and JR3-B1), because the dispatch message
    relayed A1 to the validator before its JR-3 work (PD-3). The validator's
    scratch (var/mean 5.33 to 6.00) is its own computation and is recorded as a
    confirmation, not as a second discovery.
    INDEPENDENCE CAVEAT: all sessions report the same model family.

  comparison_with_coordinator_prior: >-
    The prior was recorded on TASK-20261002-c13d8e before any report, and
    neither reviewer read it (both attest). It said it was not independent of
    the drafts.
    JR-1: I expected "holds, with G3's conditional made explicit". The
    conditional is exactly JR1-B2, but the verdict BREAKS, and two things I
    expected to hold did not: overturning item (b) FIRED (JR1-B1, a cheap
    [lambda]-orbit harvester meeting G1-G4's letter that escapes Dai's
    reduction), and the "Shoup-not-Maurer" point I expected to hold is
    inverted (JR1-B3).
    JR-2: I expected no generic configuration below VOW, held. I expected the
    minimum "about +2 bits at degenerate d"; it is +0.585, in the w > K regime
    that X-6's "w <= d" excludes and that my prior did not consider. I
    expected claim (B) false outside the sparse regime; its premise survives
    into the shallow dense regime and its conclusion holds everywhere.
    JR-3: I expected clause 1 well-posed with a Koblitz exclusion defect.
    Overturning item (c), the one I called live, FIRED: clause 1 is
    contradicted as worded by a structural property of every negation-closed
    list. The Koblitz defect I expected is also there (JR3-B2). For clause 2 I
    expected justification (ii) to be the weak point, held; I did not expect
    the dense-regime break (JR3-B4) or the formal-identity count (JR3-B5).
    JR-4: I expected OPEN-B to duplicate KN-OPEN-d218ec, -002 and -7f0511; it
    duplicates KN-LIT-f37b9a and KR-IC-889857, with d218ec as a special case
    and the others adjacent. I expected OPEN-D to overlap KN-OPEN-5e3dd0; it
    is adjacent only, and its true relative is IDEA-20260901-863e36. I
    expected OPEN-A and OPEN-C to be new; OPEN-A is new but used an observable
    this program had already retired, and OPEN-C is generic and near-known.
    PROVES-TOO-MUCH: held as I expected, with the separator I named.
    Items (a) and (d) did not fire. Items (b) and (c) fired. As in the previous
    round, the defects sit in text the producer marked "mine, unreviewed" and
    in my own expectations, not in any number.

  # ---------------------------------------------------------------------------
  # Rulings.
  # ---------------------------------------------------------------------------
  rulings:
    - id: R1
      question: Are the round's reports admissible for composition, and is the round complete?
      ruling: >-
        ADMISSIBLE FOR COMPOSITION, CONDITIONAL ON THE SNAPSHOT. Both reports
        meet their cards' completion gates in content: one verdict per owned
        joint, no whole-claim verdict, breaking artifacts with corrected text,
        failed attacks named, and review_attestation blocks stating
        independent_session true, read_sibling_reports false, requested_policy
        review-adversarial, resolved model claude-opus-5-5 (session-reported,
        not probe-verified), fallback false, and that TASK-20261002-c13d8e was
        not read. Zero scientific runs in both. The round is COMPLETE as to
        reports. It is NOT yet complete as to archive: neither report is
        committed (both say committed false), and
        tools/check_review_independence.py has not been run (PD-2). This
        decision therefore takes effect only after TASK-20261002-c13d8e
        commits exactly the two report directories, its receipt verifies, and
        check_review_independence.py passes. A failure there returns to the
        Coordinator before TASK-20261003-6d2f84 may run, and voids nothing
        here except by a superseding decision.
      validity_checklist:
        expected_report_count: 2 present, 2 expected
        attestation_complete: yes, both (fields listed above)
        blindness: >-
          Mutual blindness held at the level of reports. Two disclosed
          exposures on the validator side: sibling CONTENT relayed in the
          dispatch message (PD-3) and sibling PATH NAMES (validator PD-5, no
          content). The red team saw one carrier path name in a grep listing
          and did not open it.
        content_binding_of_reviewed_bytes: >-
          The validator bound the three drafts by sha256 at f4f09fe36 =
          origin/main, identical at 4a0b13aec. The red team reviewed at
          655056eb0b and recorded no draft hashes (PD-4); a byte check at
          655056eb0b is owed.
        scientific_runs: 0 (both)

    - id: R2
      question: JR-2 holds. Does DEC-20261002-7a3f19 R8 stand, and what happens to the residual?
      ruling: >-
        R8 STANDS. review-breakthrough is NOT convened. No record proposes a
        harvester below the VOW column, which is R8's operative condition, and
        the round's adversarial search over 39 configuration families per
        degree constructed none (minimum +0.585 bits). R8's reasons are
        corrected where they quoted +7.17 as the best cell
        (CORR-20261003-b35a0c E3). The constant-level exclusion for |F| >= 10
        is a POINTER (R7) and does not carry R8; R8 never rested on it.
      residual: >-
        OPEN, AND NOT A RULE-12 EVENT: free-negation generic harvesters with
        |F| < 10 (at most 4 +-classes). It reduces to the generic DL constant
        with the negation map for one to five instances, which is not
        index-calculus content and not binary-curve content
        (RT-20261003-24c995 O3). It is recorded as open residual OR-1 on
        H-SEMBIN-c7e1d4. The literature retrieval RC-5 (best known generic
        expected constants with the negation map for few instances) is
        DEFERRED, not carded: revisit when any record proposes or relies on a
        harvester with |F| < 10, or when a decision needs the generic
        few-instance constant.
      binding_orders:
        - >-
          GUARD (RC-2 adopted). Every future dense-regime golden-collision
          figure in this lane carries the per-version-yield guard (harvest per
          target >= 1.1 w q, else the birthday floor), and any harness that
          computes such figures keeps the floor-deletion mutation as a STANDING
          positive control: it must manufacture sub-VOW cells, and a harness
          whose no-floor variant does not is blind.
        - >-
          TRIGGER WORDING (R8's rewording, reaffirmed). Rule-12 material is a
          PROPOSED harvester whose total for the relations it needs (fill
          charged, linear algebra included) is below the VOW column at a listed
          degree, or an exponent below the generic invariants for a harvester
          outside the generic class. The +0.585 minimum is not such a proposal.
      declined_with_revisit:
        - item: RC-3 (toy vOW golden-collision search on a keyed random function to test the red team's own C5 lower estimate)
          reason: >-
            C5 is at least +6.46 bits above VOW at every degree; its estimate's
            stated uncertainty is at most about 0.3 bit. No decision turns on it.
          revisit_when: a record relies on a C5 (dense-hybrid) figure within 1 bit of a decision threshold

    - id: R3
      question: JR-1 and JR-3 break, and proves-too-much makes the arity restriction load-bearing. What is adopted?
      ruling: >-
        ADOPTED, AS VERSION 2, INSIDE H-SEMBIN-c7e1d4 ONLY (DEC-20261002-7a3f19
        R9: the names enter the ledger only inside that record). (1) COR-GEN
        corrected per JR1-B1 to JR1-B3 and JR1-B5: orbit-representative
        non-triviality over Z/l; the random-list bound is exponent level
        (Shoup via Wagner Cor. 1); its transfer to F_V is unconditional at
        first moment only for the conservation-law laws, otherwise conditional
        on HEUR-HARVEST-FV-1(a). The validator's corrected constant
        (T + |F| + 3)^2/(2l) and its K-relation and K-of-L extensions are NOT
        adopted: they rest on the Hhan pointer and are single-session
        derivations (R7). (2) HEUR-HARVEST-FV-1 version 2: the clause is stated
        on Z4 and Z3 (Gamma-classes of zero-sum 4-sets with no inverse pair,
        and of zero-sum multisets {t, t, u, v}), with N_2 = 6 Z4 + 2 Z3 on
        negation-closed lists reported, not tested against Poisson; the two
        Koblitz structural families excluded and counted separately; null
        calibration by split-half null-versus-null; Poisson a reference only;
        V read as uniform (a-rand) with structured V as separate cells;
        clause (b) excludes sub-multisets summing to O; the sigma-stable
        sub-clause UNTESTED until a design supplies a testable cell. (3)
        HEUR-HARVEST-FV-2 version 2: A_FV's membership oracle is ARITY 1 ONLY,
        named explicitly, with every higher-arity oracle (m-fold sum-set
        membership, summation polynomials, norm, smoothness or Mumford
        factoring) excluded (RT-20261003-24c995 O8); K counted on Gamma-classes
        plus 2; the line is (1/8) min{K sqrt(l/min(M, K)), K l/|F|}; c_can and
        Frobenius declared and charged; the adaptive-membership premise stated
        as its own clause (b), not inferred from clause 1.
      what_changed_from_the_reviewers_text: >-
        Clause 1(a) is stated on (Z4, Z3) rather than the validator's single
        N_2', so that the design's exact identity and its Z3 term are carried.
        The validator's corrected clause-2 justification cites Hhan Lemma 3.2
        for the rigorous part; the filed text keeps that sentence but labels it
        a pointer. FV-2(b)'s constant is absorbed in (a)'s 1/8, not a new
        constant. Everything else is the reviewers' corrected wording, as
        attributed per change in H-SEMBIN-c7e1d4 changes_from_draft.
      residual_uncertainty: >-
        The version-2 text has not itself been reviewed. Its first test is the
        re-drafted EXP-SEMBIN-3d9a71, whose gates (brute-force counts, planted
        configurations) check the definitions on concrete lists before any
        reading. Promotion of H-SEMBIN-c7e1d4 past `proposed` requires a
        review of the version-2 text, which is not carded now.

