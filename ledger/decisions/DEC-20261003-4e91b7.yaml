        H-SEMBIN-8e7ae3 moves analyzed -> SUPERSEDED, by read-through (its
        file is not edited, the DEC-20261002-7a3f19 R7 / PD-12 pattern).
      why_filing_is_justified: >-
        DEC-20261002-7a3f19 R9 required a review round before filing; the
        round ran and is composed here. Every break came with corrected text,
        and each correction is either adopted with attribution or excluded for
        a stated reason. No break touches the model layer or the exponent-level
