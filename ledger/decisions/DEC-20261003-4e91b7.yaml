  rationale:
    - >-
      THE ADVERSARIAL SEARCH FOUND NO SUB-VOW GENERIC HARVESTER, AND THE
      MINIMUM IT FOUND IS AT THE BASELINE. The smallest margin is the
      degenerate harvester that becomes rho as K -> 1. A harvesting
      configuration that beats rho would have to beat it where it is rho. So
      R8's non-escalation is reaffirmed on a much wider search than the one it
      was made on, and the one region where the generic method cannot decide
      (|F| < 10 with free negation) is named and routed as open.
    - >-
      THE BREAKS ARE IN THE INTERFACE AND THE STATEMENTS, NOT IN ANY NUMBER.
      Every break came with corrected text. Filing the corrected hypothesis
      now is what makes its heuristic testable (R6 cannot approve a test of an
      unfiled heuristic), and `proposed` claims nothing the corrections do not
      support.
    - >-
      THE MOST CONSEQUENTIAL CORRECTION IS JR1-B2. It moves the generic
      layer's application to F_V from "unconditional" to "conditional on
      HEUR-HARVEST-FV-1(a)" for every harvester outside the conservation-law
      laws. That makes EXP-SEMBIN-3d9a71 a test of the generic layer's reach,
      not only of a pricing heuristic, which is why its re-draft is worth
      doing carefully rather than quickly.
    - >-
      A SOURCE IN SCRATCH IS NOT A SOURCE IN THE REPOSITORY. Two concordant
      readings are enough to withdraw what this program said about Hhan 2024.
      They are not enough to rest new constant-level content on it. Freezing
      first costs one short task.
    - >-
      THE LANE'S EXPONENT STAKES ARE OUTSIDE THE GENERIC CLASS. The two
      exponent-relevant open problems (KN-OPEN-91d4f6, KN-OPEN-8f3d27) are now
      in the corpus, and the cheaper one gets a design task ahead of further
      generic bookkeeping (docs/target-result-profile.md bias).

