    lane: BATCH-8d6d84
  status_transitions:
  - record: EXP-PFDR-bb0d26
    from: review_required
    to: approved
    approved_by: coordinator
  - record: H-PFDR-727bfc
    from: specified
    to: approved
    note: Pre-run approval; not supported. The hypothesis file keeps the status it was written with (specified); this decision is the transition record.
  rationale:
  - >-
    ECC comes first and open ECC ideas are designed, not shelved; the selection and design are in DEC-20261022-a8c780 and
    the contract is now complete and runnable by the probe, the lint and the card checks above.
  - >-
    Every outcome has a pre-registered, distinct consequence in decision_impact (O-NULL scoped closure of label-describable
    rank <= 3 log-GAP bases at the toy sizes; O-STRUCT a costed follow-up with the matched rho control; O-MIXED named-cell
    refinement; O-INVALID repair), and none can be read as a speedup or as a statement about the security of any curve.
  - >-
    The scope is held to the goal: toy curves only; the real-curve extension is held for the user and is not approved by
    this record in any form.
  - >-
    The readiness gates are mechanical and were run by the session holding the shell; this record rests on their reported
    results and on its own completeness check, not on an estimate.
  evidence_refs: []
  limitations:
  - >-
    Toy scale only (generated curves of 20 to 28 bits, n up to 4096); nothing about any standardized or deployed curve, any
    key or target, any cost, or the security of any curve. The idea's real-curve prediction stays untested.
  - >-
    The sum-product background and equidistribution results are recalled pointers; no tested cell has a proven kappa = 1
    anchor, and a null never confirms the asymptotic random-set statement.
  - >-
    The calibration gate can fail a correctly calibrated run about 3% of the time at 45 powered cells (resolution R1);
    such a failure is NOT_EVIDENCE, never a reading of H1.
  - >-
    check.py is producer-written and does not recompute the bootstrap interval or the replication statistics beyond the
    recorded interval (resolution R8); independent review with a blind recount precedes any status move.
  - >-
    The serving model for the executor-mechanical tier is unverified until the adapter probe confirms it; compute figures
    are design-session estimates, unmeasured.
