    reports a blocker, the specification stays review_required and this record is not committed.
  capacity_check: >-
    The approved-unrun cap was removed on 2026-10-11 (AGENTS.md "Approval is bounded by execution"); approval rests on
    the runnable condition only. GOAL-PFDR-fd09e0 is an active ECC goal with unlimited campaign budget and
    max_concurrent 2; its open lanes are BATCH-286bd3 and BATCH-8d6d84 (queue
    coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-8d6d84/dispatch_queue.json, max_concurrent 1), to be claimed with
    tools/goal_lanes.py before dispatch of TASK-20261022-32fe8b. The focus plan keeps two critical experiments active.
  runbook: experiments/EXP-PFDR-bb0d26/runbook.yaml
  runbook_sha256: a2d3e9e44fd47d51688a38c415be64744888714bf0d7d72c8522bcc75da5980f
  runbook_derived_values_ruling:
    note: >-
      The experiment-director chose five values the specification does not state. The Coordinator rules on each; all are
      accepted, so the runbook sha256 above stands and no recompile is needed.
    items:
    - id: a
      value: S01-trials.timeout_seconds 97200 and claim.ttl_minutes 1620
      ruling: >-
        accepted. 97200 s is the sum of the five plan watchdogs (3600 + 43200 + 3600 + 43200 + 3600) and equals the
        wall_clock_seconds of the executor handoff and the queue; 1620 minutes is 97200 s, so the claim outlives the step
        timeout exactly as the sibling's did. Machine protection only, never a research budget.
    - id: b
      value: replay mode fields, sample 4, compare /summary of raw-result.json
      ruling: >-
        accepted, not switched to exempt. The replay is an audit-time re-execution under the audit directory, never
        committed as a run, and the compared /summary fields are pure functions of the seeded records (job and failure
        counts, outcome, headline, flagged cells, calibration, fraction valid; the contract excludes the wall-time
        field seconds from every determinism comparison). A replayed census unit may take up to its 12 h watchdog; that cost belongs to the audit, which may
        sample as it decides, and exempting the step would remove the one check that catches a consistent forgery. A
        mismatch at audit is a flag for the reader screen, not a scientific result.
    - id: c
      value: environment.programs [python3, git, gcc] with no PYTHONHASHSEED and no python version
      ruling: >-
        accepted. Seeds are sha256-derived integers handed to random.Random, and a pattern scan of run.py found no hash()
        call, set-literal iteration, set() iteration or pop() (a narrow scan, not a proof); the determinism unit test
        UT-7 covers reruns and the contract treats every job record as a pure function of its key. The manifest records
        the interpreter and compiler versions actually used.
    - id: d
      value: metrics selftest cells; census jobs and failed_infrastructure; fraction_valid and calibration n, mean, sd at analyze-final
      ruling: >-
        accepted. The metrics are tool-computed run-level counts and gate values; the per-cell kappa, z, classes, outcome
        and headline are read from the hash-bound analysis.json, which the runbook validity assertions require to exist
        with 45 cells and an outcome in the declared set. Metrics are observations, not a verdict.
    - id: e
      value: artifact_schema of the runbook omits the degenerate field that run.py writes
      ruling: >-
        accepted. The degenerate-job count lives in raw-result.json /summary of the census runs and in the jobs files, which
        are hash-bound and archived; a degenerate or failed_infrastructure job invalidates its cell by the contract and is
        listed by analyze-main. The runbook's metrics need not name it, and no review reading is lost.
  ex7_ruling: >-
    EX-7 (the other lane BATCH-286bd3 must not run a census concurrently, because each census uses 4 worker processes)
    is recorded as a dispatch precondition, not an observable the card can check. The executor card cannot see the other
    lane, so the top-level session checks it before relaying the card, and TASK-20261022-32fe8b is depends_on the
    snapshot archive TASK-20261022-b6532d. A census never starts in this lane while the other lane's census is running.
