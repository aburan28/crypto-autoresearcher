        DEC-20261022-f1efde, task_id TASK-20261022-32fe8b, queue under BATCH-8d6d84, no census-real trial.
    AR-3:
      state: met
      evidence: >-
        tools/experiment_preapproval.py --packet returned approvable true with blockers empty for the exact final
