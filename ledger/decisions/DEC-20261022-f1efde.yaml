    specification: experiments/EXP-PFDR-bb0d26/specification.yaml
    specification_sha256: e294b040cbc805c33cd8a11ee9e3593be2c0eb16ac603f50b706b6dec4919820
    trial_plan: experiments/EXP-PFDR-bb0d26/trial-plan.json
    trial_plan_sha256: 9b25b15b44a23970c647ef4de94518111ea931f80b2766fa186be1a3b1629386
    queue: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-8d6d84/dispatch_queue.json
    queue_sha256: d6a0cc41618b4472d1d57f354eddc4d0fc45f16274bdc110098970a400bd6900
    executor_handoff: ledger/handoffs/TASK-20261022-32fe8b.yaml
    executor_handoff_sha256: 424c2f32d9447a3595d4b49e5c61ef85a8d9d0fa18d8924f24bbc2ccef2bfec8
    runbook: experiments/EXP-PFDR-bb0d26/runbook.yaml
    runbook_sha256: a2d3e9e44fd47d51688a38c415be64744888714bf0d7d72c8522bcc75da5980f
    task_card: experiments/EXP-PFDR-bb0d26/task-cards/CARD-EXP-PFDR-bb0d26-1.yaml
    task_card_sha256: 2ec6d8acc1ff33599545b6d2e719564cf28e85822929be63425410c4ca4b6f1f
    sources:
      experiments/EXP-PFDR-bb0d26/implementation/run.py: 1d889ad9486cb55bf0d12413dcdbb3f6508ec60df34c5b802a58a2ab675e7f92
      experiments/EXP-PFDR-bb0d26/implementation/check.py: c7efb467a3f2f1c6f6eb2e176cb92ad562d62c2a9420e62f7278a1d3952c6ca1
      experiments/EXP-PFDR-bb0d26/implementation/labelsum.c: 28a80d522ca157168a156e4b4eb6a02997fdc84cd51be472b4cd9c5ee7e200ef
