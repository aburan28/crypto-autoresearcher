coordinator_decision:
  id: DEC-20261022-f1efde
  id_provenance: >-
    Reserved and confirmed free by the top-level session (tools/allocate_id.py) and named in DEC-20261022-a8c780
    as the approval decision; the Coordinator minted no id.
  recorded_at: '2026-10-22'
  decided_at: '2026-10-22'
  decided_by: coordinator
  goal_id: GOAL-PFDR-fd09e0
  question_ids: [RQ-PFDR-ae2fba]
  kind: protocol_approval
  mode: goal
  context: >-
    DEC-20261022-a8c780 selected IDEA-20261017-078074, specified H-PFDR-727bfc and returned the draft contract
    EXP-PFDR-bb0d26 as review_required, approving nothing, and listed what approval needs (AR-1 to AR-6). The
    implementation task TASK-20261022-726d76 has since delivered the launcher, kernel, checker, fixtures and unit tests;
    the freeze fills were made; the final specification, the trial plan, the queue of lane BATCH-8d6d84 and the
    executor card TASK-20261022-32fe8b were produced; the experiment-director compiled the runbook and the task
    card; and tools/experiment_preapproval.py reported approvable true for the exact final bytes. The approved scope is
    the toy part only: 45 toy cells on generated curves of 20, 24 and 28 bits, five trials. The idea's real-curve
    extension is HELD for a user decision (request HU-5) and is in no bound artifact.
  decision: approve
  decision_scope: >-
    APPROVES EXP-PFDR-bb0d26 at version 1 (five trials: selftest RUN-PFDR-e44a19, census-toy-main RUN-PFDR-4d8c71,
    analyze-main RUN-PFDR-243425, census-toy-rep RUN-PFDR-cd03e2, analyze-final RUN-PFDR-089edc) and moves
    H-PFDR-727bfc from specified to approved (pre-run). Authorizes execution through
    experiments/EXP-PFDR-bb0d26/runbook.yaml (session RBS-PFDR-bb0d26) under TASK-20261022-32fe8b in lane BATCH-8d6d84
    of GOAL-PFDR-fd09e0. Asserts nothing about H-PFDR-727bfc or any hypothesis; authorizes no attack, no key or target
    operation, no standardized-curve work, no cost extrapolation and no run outside the frozen trial plan.
  target_ids:
  - RQ-PFDR-ae2fba
  - GOAL-PFDR-fd09e0
  - IDEA-20261017-078074
  - H-PFDR-727bfc
  - EXP-PFDR-bb0d26
  - DEC-20261022-a8c780
  - DEC-20261022-f1efde
  - TASK-20261022-726d76
  - TASK-20261022-b6532d
  - TASK-20261022-32fe8b
  - TASK-20261022-207893
  authorization: >-
    Standing user authorization of 2026-09-06 in AGENTS.md ("All is approved. Ideas/experiments should be always
    approved"); no per-experiment user confirmation is requested. The Coordinator's completeness check is recorded
    under protocol_completeness and approval_requirements_check, and the runnable condition under readiness_requirement
    and preapproval_probe.
  scope_ruling:
    ruling: >-
      Toy scope only. The real-curve arm (secp256k1 and NIST P-256; the census-real trial; the 36 real-curve cells; the
      rules R-ZERO, R-HIT, R-INCOMPLETE and R-INVALID; the realcurves.json fixture) is not admitted, because a scope
      the Coordinator widens by its own reading is not authorised and the goal scope reads public toy curves only. It is
      held for a user decision (HU-5, requested by the top-level session) and could be added only by a versioned
      protocol_amendment of EXP-PFDR-bb0d26 and a new approval. No bound artifact contains a standardized-curve
      constant; analyze-main and analyze-final read no real-curve datum.
    recorded_in: DEC-20261022-a8c780 scope_correction; specification resolution R3 and held_extension
  blinding: >-
    The design of EXP-PFDR-bb0d26 was written without reading any run, report, runbook-session, analysis, evidence or
    review of EXP-PFDR-ca5e01; only its specification, trial plan, runbook, task card, hypothesis and approval decision
    were read, for format and seed ranges, and the implementation task was told not to read its results. The sibling's
    outcome informs nothing here, and prediction provenance for P1, P-detect and P2 is out_of_sample with data_seen
    empty.
  protocol_completeness:
    EXP-PFDR-bb0d26:
      controls: >-
        present (C1 instrument selftest, C2 matched random null, C3 planted label AP, C4 null-vs-null calibration, C5
        disjoint seed blocks and replication on fresh curves, C6 checker replay and brute recount, C7 label scaling
        identity; C8 Pollard rho declared not run because no cost claim is made)
      metrics: >-
        present (primary kappa per cell with bootstrap interval and z, toy reading, calibration, planted recovery,
        replication of flagged cells, headline; secondary slope, D ratio, null mean against the formula, even-odd kappa,
        infrastructure failures, log-GAP geometry, wall time; JSON pointers into analysis.json, design.json, jobs files
        and raw-result.json)
      budget: >-
        present (per-trial watchdogs 3600/43200/3600/43200/3600 s, trial memory 2048/4096/2048/4096/2048 MB, 5 runs, 4
        workers, kernel timeout 3600 s; advisory machine protection)
      stopping_rules: present
      invalidation_rules: present
      required_artifacts: present (manifest.yaml and raw-result.json per run plus selftest.json, design.json, toy-main-jobs.jsonl, analysis-main.json, flags.json, toy-rep-jobs.jsonl, analysis.json)
      preregistered_prediction: present (P1, P-detect, P2; source IDEA-20261017-078074; never adjusted after a run)
      heuristic_validation: present (H1 stated with quantifiers and source; recalled support marked as a pointer; operationalization; uniform object; toy scale access; sample-size justification; comparison metric; tail checks; controls)
      decision_impact: present (on_positive, on_negative, on_inconclusive, on_invalid, each distinct)
      variable_ledger: present (independent variables, factors, comparisons C-struct-null, C-plant-null, C-aa-null, C-aa-curves, C-aa-scale with three A/A comparisons; crosses_map false with its reason)
      prediction_provenance: present (P1, P-detect, P2, out_of_sample, data_seen empty)
      coordinator_resolutions: R1 to R10, written before any run, each with its reason
      launcher: trial-plan.json, run.py, check.py, labelsum.c, vendor/curve.py and fixtures/kat.json bound by sha256; runbook experiments/EXP-PFDR-bb0d26/runbook.yaml, session RBS-PFDR-bb0d26
  approval_requirements_check:
    AR-1:
      state: met
      evidence: >-
        TASK-20261022-726d76 completed: run.py, check.py, labelsum.c, vendor/curve.py, fixtures/kat.json, test_unit.py and
        unit-test-report.txt delivered; the top-level session re-ran the suite (23 tests, 0 failures); check.py
        spec-consistency --mode pre-freeze passed on the draft and --mode post-freeze reported 0 differences on the
        freeze-filled specification; five run ids minted and substituted. No engine file was added or edited (NA-5 of
        DEC-20261002-c3f49b). The unit-test report is a readiness record, not evidence.
    AR-2:
      state: met
      evidence: >-
        Freeze fills made as listed (run ids, vendor and kat sha256, upstream commit dc61c5e1ec10c2e5aacffac9d46ca4b9bf8ba542)
        and the approval fields added, with no change to any threshold, rule, cell, seed block or criterion; the trial
