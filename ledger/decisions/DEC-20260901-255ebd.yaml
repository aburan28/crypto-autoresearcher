  rationale:
    - "Independent re-derivation of the two most load-bearing pieces of new mathematics in the erratum (the R-F1 counterexample algebra and the Proposition E derivation chain) from first principles, rather than re-reading the producer's or the prior red-team's presentation of them, is the appropriate response to this session's own earlier same-day shortfall on the same proposal lane -- a second inadequate pass would compound rather than correct the earlier error."
    - "The re-founded model-free ground (Proposition E) is independently confirmed to not merely patch the original strict-GGM argument but to strictly dominate it in generality: it needs no oracle-model convention, no primality hypothesis, and no query-interface convention, and applies to non-generic adversaries a GGM argument cannot by construction reach. This is recorded because a reader should understand this erratum makes the closure stronger, not merely repaired."
    - "Correctly scoping the disposition to disjunct D1 alone, rather than the record as a whole, prevents an erratum whose actual mathematical content is sound from being read as licensing a broader closure than its own findings support -- exactly the OBJ-8 defect the erratum itself was commissioned to fix."

