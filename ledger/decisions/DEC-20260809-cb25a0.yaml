    - >-
      THE FORWARD-POINTER REQUIREMENT IS ONLY PARTLY DISCHARGED. D-3 records
      the split and the reasons. A reader arriving at a superseded site directly
      still sees no pointer, and that gap is open until SUB-2 settles.
    - >-
      NO ARCHIVE IS VERIFIED FOR THIS BATCH. TASK-20260809-c30f26 has not run;
      no commit sha exists for it and none is invented.
      GOAL-MCE-001.latest_verified_commit is LEFT UNCHANGED at 04c41125a, with
      the strict binding gap that value already carries (DEC-20260808-a67816
      D-7) unchanged and not re-litigated here. Until that archive is made and
      the post-commit verifier accepts it, NOTHING IN THIS BATCH IS DURABLE
      EVIDENCE.
    - >-
      PROMOTION GATES G1-G4: NONE ADDRESSED, and none is engaged. This program
      advances no asymptotic-complexity claim of its own in this batch. Stated
      explicitly so it cannot be misread as gate progress.
    - >-
      BUDGET: 3 of 6 campaign batches used once this batch opens. runs_authorized
      is 0 and 0 runs have been executed across the campaign; no solver ran and
      no experiment record exists.
    - >-
      THIS DECISION CORRECTS A DESCRIPTION, NOT A RESULT. Its entire subject is
      how this program may describe someone else's paper. It produces no
      mathematical content and it is not progress toward any completion
      criterion of GOAL-MCE-001.

  inference_record: >-
    requested_policy coordinator-orchestration-code; per CLAUDE.md, per-role
    model selection is process-level under Claude Code and subagents keep
    `model: inherit`, so the policy alias did not resolve to a distinct backend.
    fallback_used: true, reason: policy aliases do not resolve under this
    harness. model_verified: false --
    `python3 -m orchestration.adapter doctor --probe` was NOT run by this
    session, which has no execute capability.

  next_actions:
    - >-
      EXACTLY ONE NEXT ACTION FOR THE GOAL: dispatch BATCH-73a1b7 scope item
      SUB-1 to an EXECUTOR session, followed by an INDEPENDENT reviewer -- mint
      both TASK ids with `python3 tools/allocate_id.py --next handoff --date
      YYYYMMDD` and write their cards into
      coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/dispatch_queue.json,
      moving them out of `unallocated_scope_items`. SUB-1 replaces the two regex
      claim-class audits with ONE script that parses each knowledge/**/*.md
      frontmatter and tests the tag LIST (print the path when
      {'distinguisher','key-recovery'} is a subset of set(tags)), and COMMITS
      THE FIVE VAL-20260808-71bdb1 C-4 EVASION FORMS AS A REGRESSION FIXTURE
      inside the repository. It supersedes knowledge/TAG-CLAIM-CLASS.md rather
      than editing it. It is scored by GATE-A: no claim that the constraint is
      enforced without a recorded attempt to break the new check AND a positive
      control showing it can fire. WHY THIS ONE: it is the only remaining item
      that converts a session-scratchpad artifact into committed evidence, and
      so the only one that discharges the KN-FIND promotion
      DEC-20260808-a67816 SCHEDULED rather than declined. It needs capabilities
      the 2026-08-09 Coordinator-only session did not have, which is exactly why
      it was not done there.
    - >-
      SUBORDINATE, IN THE SAME BATCH: SUB-2 -- settle the corpus-wide
      `superseded_by` policy (DEC-20260808-a67816 D-9) AND, with it, the
      forward-pointer mechanism this decision left open (D-3). One question, two
      consumers. It must state how a pointer is installed at a path that a
      COMPLETED ARCHIVE RECEIPT binds by path_sha256, since two of the three
      GOAL-MCE-001 sites are exactly that case and no edit to them is admissible
      until it does. Corpus-wide scope means an independent reviewer, not a
      single-goal batch acting alone.
    - >-
      SUBORDINATE, IN THE SAME BATCH: SUB-3 -- close the two provenance seams by
      SUPERSESSION, editing nothing. Record arXiv v3 (VAL-20260808-71bdb1 S-1a
      closes the gap; the artifacts that declare it open are immutable), and
      re-source or re-label the abstract block that quotes LaTeX absent from the
      PDF at the bound sha256 (S-1b).
    - >-
      DO NOT re-attempt iacr:2026/1232's PDF by another route. The 403 is
      path-scoped and reproducible, circumvention is forbidden, and AGENTS.md
      rule 5 makes a blocked route a recorded outcome. Unchanged from
      DEC-20260803-a5b9b1 and DEC-20260808-a67816. Note also that
      eprint.iacr.org ABSTRACT pages returning 200 is a DIFFERENT question from
      the PDF endpoint; do not repeat the retracted "the eprint blocker did not
      reproduce" claim.
    - >-
      GATES BIND EVERY TASK IN THIS BATCH, INCLUDING THE ONES NOT YET
      ALLOCATED: GATE-A (TRY TO BREAK YOUR OWN CHECK) and GATE-B (READ PAST THE
      END OF THE QUOTED SENTENCE), as written in
      BATCH-73a1b7-OPENING.md section 4. Do not score a completion gate by
      whether the expected thing printed.
    - >-
      BEFORE THE LEDGER ARCHIVE TASK-20260809-c30f26: fetch origin/main, MERGE
      it into this branch (never rebase -- pushed evidence), run
      tools/validate_ledger.py and compare against the pre-write baseline the
      dispatching session recorded, then stage ONLY the declared paths, commit,
      push, and open or refresh the PR naming RQ-MCE-f8fca0, DEC-20260809-cb25a0
      and BATCH-73a1b7. A record that exists only in a local commit is
