  knowledge_promotion:
    promoted: []
    not_warranted: >-
      NOTHING PROMOTED, and the mandatory-promotion rule is NOT triggered: it
      binds on `support` or `reject_scoped` over `replicated`/`strong` evidence,
      and this decision is `supersede`. Four concrete reasons, one per
      candidate.

      (1) NO KN-FIND FROM THIS BATCH'S OWN WORK. This program still has produced
      no internal mathematical result. What BATCH-73a1b7 has done so far is
      complete a correction to its own description of a third party's paper. A
      finding entry would be promoting someone else's text.

      (2) THE SCHEDULED PROMOTION REMAINS SCHEDULED AND IS **NOT** DISCHARGED
      HERE. DEC-20260808-a67816 recorded one genuine, reusable internal
      result -- "the two-grep claim-class audit enforces a SERIALISATION, not the
      semantic constraint, and five legal YAML encodings evade it" -- and bound
      its promotion to the parsing audit landing with those five forms committed
      as a regression fixture. THAT FIXTURE IS STILL NOT ARCHIVED: the five
      evasion files remain in a session scratchpad outside the repository, so
      EV-MCE-3d6e9a still records `proof_status: empirical_only` rather than
      `certificate`. Promoting the finding now would promote a claim whose
      refutation artifact is unarchived, which is the defect the schedule
      exists to prevent. It stays SCHEDULED, on SUB-1, and this decision moves
      it not at all.

      (3) NO NEW KN-LIT FROM THIS DECISION, DELIBERATELY. The natural candidate
      is a superseding literature entry carrying Q-1..Q-4 into the corpus so the
      completion is reachable by retrieval. It is named in
      RQ-MCE-f8fca0.downstream_actions_required and NOT filed, because filing a
      third entry in the KN-LIT-4c8135 -> KN-LIT-c41d8b chain before SUB-2
      settles the corpus-wide linking convention would create exactly the
      unreachable-supersession problem that is this batch's open item. Deferred
      by one item, not declined. This is the same reasoning
      DEC-20260803-a5b9b1 used to defer entries one batch, and DEC-20260808-a67816
      records that it was right.

      (4) STILL ZERO ISD KN-TECH ENTRIES, AND STILL CORRECTLY SO. A technique
      entry states applicability conditions, and this decision is the second
      consecutive demonstration that this program's statement of an
      applicability condition in this exact area was defective -- first
      rate-scoped, then unqualified. Filing a technique entry now would be
