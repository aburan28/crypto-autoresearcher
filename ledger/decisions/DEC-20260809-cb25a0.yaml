      COORDINATOR-ONLY RUN, ZERO REVIEWS. No validator, no red team, no
      reviewer and no executor session reviewed or ran anything in
      BATCH-73a1b7. The head deliverable was written by the same role and
      session that is now deciding it is adequate. THIS DECISION CARRIES NO
      INDEPENDENT REVIEW, and the checkpoint for this batch records
      `reviews: []` rather than implying one.
    - >-
      NO EXECUTION AND NO NETWORK. This session has no Bash. It ran no command,
      fetched nothing, opened no PDF, computed no hash, compared no git blob,
      and did not run tools/validate_ledger.py. The dispatching session reports
