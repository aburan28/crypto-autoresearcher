coordinator_decision:
  id: DEC-20260809-cb25a0
  goal_id: GOAL-MCE-001
  batch_id: BATCH-73a1b7
  context: >-
    GOAL-MCE-001 BATCH-73a1b7 open, and the discharge of the completion
    condition DEC-20260808-a67816 D-5 bound to the next batch's head
    deliverable. That decision recorded EXACTLY ONE next action for this goal:
    open the next batch whose head deliverable is a single Coordinator
    correction task that COMPLETES the boundary correction BY SUPERSESSION --
    new records, editing nothing -- carrying arXiv:2304.14757's own
    qualification of its Goppa exclusion, and installing forward pointers from
    the superseded sites.

    THIS IS A COORDINATOR-ONLY SESSION WITH NO EXECUTION AND NO NETWORK. No
    executor, validator, red-team or reviewer session was dispatched, ran, or
    reviewed anything in this batch. This session has no Bash: it ran no
    command, opened no PDF, computed no hash, made no network request, and made
    no commit. Every statement below that would require any of those is
    attributed to the record or session that carries it. THIS DECISION
    THEREFORE CARRIES NO INDEPENDENT REVIEW.
  decision: supersede
  decision_note: >-
    `supersede`, and CLAUSE-SCOPED. The operative act is that RQ-MCE-f8fca0
    supersedes FOUR NAMED CLAUSES of RQ-MCE-3f7c02 (C-1 replacement_constraint,
    C-2 the conjunct-1 "decisive one" gloss, C-3 what_changed's "settles
    applicability before any rate arithmetic is performed", C-4 the title's
    "STRUCTURAL") and completes the correction with the source's own
    qualification. It is NOT `revise`, because nothing is sent back for rework;
    it is NOT `reject_scoped` or `weaken`, because no mathematical claim of this
    program is being rejected or weakened -- this program has advanced none. It
    is NOT `approve`, because the batch it opens has barely started and its
    subordinate work is untouched. RQ-MCE-3f7c02 AS A RECORD IS NOT SUPERSEDED
    AND NOT RETIRED; neither is KN-LIT-c41d8b, and neither is RQ-MCE-e65b3c.
  target_ids: [GOAL-MCE-001, RQ-MCE-3f7c02, RQ-MCE-f8fca0]
  also_targets_by_path:
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/BATCH-73a1b7-OPENING.md
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/dispatch_queue.json
    - ledger/goals/GOAL-MCE-001/checkpoints/BATCH-73a1b7.yaml
  also_targets_note: >-
    Named by path, not in target_ids, because they are coordination artifacts
    and a goal checkpoint rather than ledger records with their own identifiers.

  rationale:

    - id: D-1
      what: >-
        THE COMPLETION CONDITION OF DEC-20260808-a67816 D-5 IS DISCHARGED BY
        RQ-MCE-f8fca0, AND BY SUPERSESSION ONLY -- NOTHING WAS EDITED.
      why: >-
        D-5 held that an incomplete correction of a citation may not be left
        standing for anything to cite, and bound the goal to a completion. That
        completion is ledger/questions/RQ-MCE-f8fca0.yaml, which mirrors
        RQ-MCE-3f7c02's clause-scoped design that D-4 praised and preserved. It
        carries all four omitted passages VERBATIM with their loci (PDF pages 7,
        32, 32 and 15 of arXiv:2304.14757v3 at sha256 ebbd94ac...), names the
        four superseded clauses individually with their superseded text quoted
        for string-match checking, and replaces the binding constraint with one
        that FORBIDS INVOKING THE EXCLUSION BARE: any deliverable of this goal
        citing it must also carry that it is phase-scoped to the FILTRATION
        step, present-tense ("right now"), explicitly not a proof, and
        conjectured to fall -- with Q-2 and Q-4 quoted rather than summarised.
      what_this_decision_does_not_claim_about_it: >-
        RQ-MCE-f8fca0 HAS HAD NO INDEPENDENT REVIEW. It was written by the same
        role, in the same session, as this decision. Its verbatim fidelity rests
        on VAL-20260808-71bdb1 S-1, not on any check performed here.
      evidence: >-
        DEC-20260808-a67816 D-4, D-5; EV-MCE-3d6e9a O-4; VAL-20260808-71bdb1 S-1
        material_omission_found.

    - id: D-2
      what: >-
        RQ-MCE-3f7c02 AND KN-LIT-c41d8b STAY IN FORCE. They are NOT withdrawn,
        NOT retired, NOT replaced and NOT edited. Recorded FIRST among the
        substantive findings so a completion is not read as a retraction.
      why: >-
        DEC-20260808-a67816 D-5 is explicit: withdrawing them would RESTORE A
        WORSE RECORD. D-4 upheld them on the merits -- the rate-scoped framing
        genuinely was wrong, the three-conjunct reading is right as far as it
        goes, every affirmative statement is verbatim correct against the
        source, and NO SUPERSEDING SITE RE-INSTALLS A RATE-SCOPED READING. The
        defect was an OMISSION, not a substituted mis-scoping. RQ-MCE-f8fca0
        therefore supersedes four clauses and lists, under
        clauses_deliberately_not_touched, six bodies of material it leaves
        exactly as they stand -- so it cannot be read as a full restatement, and
        so silence is not mistaken for "checked and sound".
      evidence: DEC-20260808-a67816 D-4, D-5 what_is_therefore_decided.

    - id: D-3
      what: >-
        THE FORWARD-POINTER QUESTION, DECIDED EXPLICITLY. NO IN-PLACE
        ANNOTATION WAS INSTALLED AT ANY SUPERSEDED SITE. The blocker is NOT the
        same at all three, and the difference is the decision.
      why_it_had_to_be_decided_here: >-
        DEC-20260808-a67816 next_actions item 1 requires "installing FORWARD
        POINTERS from the three superseded sites, above all BATCH-001-OPENING.md
        section 4, which has none at all." The same next action requires "new
        records; edit nothing." D-9 separately DEFERRED the corpus-wide
        superseded_by policy to this batch and did not settle it. Those pull
        against each other and a Coordinator must not resolve that silently.
      sites_1_and_2_refused_on_a_checkable_fact: >-
        coordination/goals/GOAL-MCE-001/batches/BATCH-001/BATCH-001-OPENING.md
        and ledger/questions/RQ-MCE-e65b3c.yaml are BOTH declared in
        path_sha256 of the completed archive receipt
        coordination/goals/GOAL-MCE-001/batches/BATCH-001/archives/OPENING/opening-receipt.json
        (lines 21 and 20). ANY edit -- including a purely additive annotation
        that changes no assertion -- changes the file's sha256 and invalidates
        that receipt's declared hash. CLAUDE.md states archive receipts bind to
        CONTENT first and "a content mismatch is still fatal". This is also
        exactly defect C-2, which THIS GOAL RECORDED AGAINST ITS OWN
        COORDINATOR eight days ago (DEC-20260808-a67816 D-6: the disclosure
        commit "EDITED THE RECEIPT IN PLACE, invalidating its declared hash").
        Committing that error again in order to advertise a correction would
        repeat the error while describing it -- the precise reasoning D-6 used
        when it declined to edit snapshot-receipt.json a second time.
        I READ THAT RECEIPT IN THE COMMITTED TREE; I RAN NO HASH AND VERIFIED NO
        BLOB, so the claim here is that the PATHS ARE DECLARED, not that the
        hashes currently match.
      site_3_deferred_because_it_would_pre_empt_D_9: >-
        knowledge/literature/KN-LIT-4c8135.md is NOT hash-bound anywhere in this
        repository -- a search for that path as a path_sha256 key returns
        nothing. Its blocker is different and it is D-9: the only field that
        would carry the pointer is `superseded_by`, which is the exact
        corpus-wide convention question D-9 deferred to this batch and did not
        settle. Filling it now would settle a corpus-wide question by fait
        accompli inside a single-goal batch -- the overreach pattern this goal's
        known_hazards already records. It is deferred to BATCH-73a1b7 scope item
        SUB-2, WHICH IS WHERE D-9 PUT IT.
      what_discharges_the_routing_function_instead: >-
        RQ-MCE-f8fca0.forward_pointer_index: an explicit site -> superseding
        record -> locus table covering all three sites plus RQ-MCE-3f7c02's own
        four superseded clauses, each with pointer_installed: false and its
        reason. GOAL-MCE-001.question_ids gains RQ-MCE-f8fca0, so the completed
        reading is reachable from the goal in one hop and from a grep of
        ledger/questions/.
      what_is_therefore_still_open_and_is_not_glossed: >-
        A READER WHO LANDS ON A SUPERSEDED SITE DIRECTLY STILL SEES NO POINTER.
        BATCH-001-OPENING.md section 4 still reads "The rate threshold is the
        whole question" with nothing pointing forward; RQ-MCE-e65b3c and
        KN-LIT-4c8135 likewise. THE ROUTING TABLE DOES NOT FIX THAT and this
        decision does not claim it does. It is BATCH-73a1b7's named open item.
        REVISIT CONDITION: SUB-2's settlement of the corpus-wide policy, which
        decides for every site at once whether superseded_by is filled (and how
        an edit is reconciled with an archive hash binding) or whether the
        corpus routes through a supersession index.
      the_option_considered_and_declined: >-
        A NEW sibling notice file inside BATCH-001's directory would break no
        hash, since a receipt binds declared paths and not a directory. It was
        declined for two stated reasons: it reaches directory-level readers but
        NOT the in-file reader the pointer exists for, and it creates a SECOND
        BINDING OBJECT for one correction -- the same hazard D-9 cited when
        declining to re-issue snapshot-receipt.json. Inventing a one-off routing
        mechanism one batch before SUB-2 decides the general one is the wrong
        order. Recorded as declined-with-reason, not omitted, and reversible on
        SUB-2's outcome.

    - id: D-4
      what: >-
        THE REFUTATION ARTIFACT FOR THE SUPERSEDED CLAUSES IS ARCHIVED IN THE
        SAME COMMIT AS THE DECISION THAT RELIES ON IT, AND ITS BASIS IS
        DECLARED.
      why: >-
        The coordinator contract requires the strongest checkable refutation
        artifact a result admits before a decision that a prior statement is
        wrong. The claim being refuted -- "the exclusion is STRUCTURAL and
        settles applicability" -- is a claim about what a TEXT says, so the
        strongest available artifact is the text itself. RQ-MCE-f8fca0 carries
        four verbatim passages with page loci, bound to sha256 ebbd94ac..., and
        each is directly checkable by string match against the PDF at that hash
        by anyone with fetch capability.
      declared_basis: >-
        DOCUMENTARY, NOT EMPIRICAL AND NOT PROVED. First-hand acquisition is
        VAL-20260808-71bdb1 (an INDEPENDENT session, verdict `failed` scoped to
        two named claims), which records re-fetching the PDF byte-identical to
        the bound hash and verifying one passage twice by two modalities. ONE OF
        THE FOUR IS INDEPENDENTLY CORROBORATED INSIDE THIS REPOSITORY: passage
        Q-4 is transcribed verbatim at
        coordination/goals/GOAL-MCE-001/batches/BATCH-001/tasks/TASK-20260803-292b99/heuristics_enumerated.md
        line 332, which the dispatching session reports re-verifying in the
        committed tree on 2026-08-09. THIS COORDINATOR READ NONE OF THE FOUR
        FROM THE SOURCE and states that rather than implying a check it did not
        make.

    - id: D-5
      what: >-
        THE COMPLETION IS GUARDED AGAINST ITS OWN MIRROR-IMAGE ERROR, IN THE
        RECORD ITSELF.
      why: >-
        BATCH-001-OPENING.md section 7 defines this campaign's failure condition
        SYMMETRICALLY: reporting the paper as a threat it may not be, and
        dismissing it as irrelevant, are the same error with opposite signs.
        DEC-20260808-a67816 D-5 corrected the dismissal-side instance. A record
        that now carries "Goppa codes should eventually be attacked in
        polynomial" invites the alarm-side instance. RQ-MCE-f8fca0's
        what_this_does_not_establish therefore states that Q-2 IS A CONJECTURE
        IN A CONCLUDING REMARK -- not a result, not a complexity claim, and not
        evidence that Classic McEliece is threatened -- and that the exclusion
        and its qualification alike transfer to NO other paper, iacr:2026/1232
        included. BATCH-73a1b7-OPENING.md section 7 item 1 repeats it as a
        failure condition of the batch.

    - id: D-6
      what: >-
        THE BATCH'S SUBORDINATE WORK IS NOT STARTED, HAS NO TASK IDENTIFIERS,
        AND IS NOT DISPATCHABLE. Stated so the queue cannot be misread as work
        in progress.
      why: >-
        DEC-20260808-a67816 next_actions items 2 and 3 are carried into
        BATCH-73a1b7 as three named scope items: SUB-1 (replace the two regex
        claim-class audits with one frontmatter-PARSING audit testing the tag
        LIST, and commit the five VAL-20260808-71bdb1 C-4 evasion forms as a
        regression fixture; supersede TAG-CLAIM-CLASS.md rather than editing
        it), SUB-2 (the corpus-wide superseded_by policy from D-9, which also
        governs the forward-pointer gap of D-3), and SUB-3 (the two provenance
        seams: record arXiv v3 for the artifacts that declare the gap open, and
        re-source or re-label the S-1b abstract block). NONE has a TASK
        identifier: this session was given exactly two and minted nothing. They
        appear in dispatch_queue.json under `unallocated_scope_items`, NOT under
        `tasks`, so the dispatcher cannot treat them as ready. SUB-1 needs
        EXECUTION capability, which this session did not have; SUB-1 and SUB-2
        each need an INDEPENDENT reviewer.
      gates_written_in_as_required: >-
        DEC-20260808-a67816 next_actions item 5 requires both omitted checks be
        written into this batch's gates explicitly. BATCH-73a1b7-OPENING.md
        section 4 carries them as GATE-A (TRY TO BREAK YOUR OWN CHECK -- a
        constraint may not be called enforced without a recorded attempt to
        construct an input defeating it AND a positive control showing the check
        can fire) and GATE-B (READ PAST THE END OF THE QUOTED SENTENCE -- a
        quotation is not admissible without reporting the surrounding text, and
        silence is not permitted). They bind every task in the batch, including
        the head deliverable, which exists because GATE-B was applied
        retroactively to BATCH-a68f79 by an independent session.

    - id: D-7
      what: NOTHING IS CONCLUDED ABOUT CLASSIC McELIECE, IN EITHER DIRECTION.
      why: >-
        Re-affirming DEC-20260808-a67816 D-8 without weakening it. Three batches
        in, the campaign's primary target is still unopened: iacr:2026/1232's
        body remains unobtained (403, path-scoped, reproducible, NOT
        re-attempted this batch and not to be -- AGENTS.md rule 5 makes it a
        recorded outcome and never negative evidence), its complexity claim is
        still only a conjecture in its abstract, and NO DISTANCE between any
        attack regime and Classic McEliece's parameters has been computed
        because the left-hand side does not exist. The Goppa exclusion of
        arXiv:2304.14757 DOES NOT TRANSFER to iacr:2026/1232, whose abstract
        names binary Goppa codes explicitly.
      status_flags_stated_plainly: >-
        NO HYPOTHESIS STATUS MOVES -- none exists to move.
        GOAL-MCE-001.active_hypothesis_ids STAYS EMPTY. claim_tier STAYS TOY.
        NO COMPLETION CRITERION of GOAL-MCE-001 is met or approached. NO CLOSURE
        QUORUM is claimed and NO ATTESTATION is recorded, obtained, or may be
        synthesised from this decision later. No experiment exists, no run was
        authorized, and no solver has run in this campaign.

    - id: D-8
      what: WHAT THIS DECISION DOES **NOT** DECIDE, stated as explicitly as what it does.
      items:
        - >-
          IT DOES NOT DECIDE the corpus-wide `superseded_by` policy. That is
          D-9's deferral and it remains deferred, now with a second question
          attached to it (the forward-pointer mechanism, D-3). SUB-2 owns both.
        - >-
          IT DOES NOT DECIDE whether the four reclassified claim-class entries
          are CORRECTLY classified. Nobody in this program has read any of the
          four papers; the classification rests on titles and relayed
          descriptions at `confidence: reported`. Unchanged from D-9 and not
          re-examined here.
        - >-
          IT DOES NOT RATIFY anything about the IEEE journal version of
          arXiv:2304.14757, which nobody here has read, nor the S-1b abstract
          block, which remains a declared provenance seam.
        - >-
          IT DOES NOT DECIDE that the four passages are the ONLY material the
          source states on this point. VAL-20260808-71bdb1 found four; that is
          what one independent session found reading around one sentence and two
          concluding paragraphs, not an exhaustive extraction of the paper's
          treatment of Goppa codes. A later reader may find more, and
          RQ-MCE-f8fca0 does not foreclose that.
        - >-
          IT CLAIMS NO REVIEW OF ANY KIND. Zero reviews ran in this batch. The
          reviews it CITES are BATCH-a68f79's single validator session, already
          recorded there and already recorded as NOT admissible toward any
          AGENTS.md rule 13 attestation.

  evidence_refs: [EV-MCE-3d6e9a]
  supporting_records:
