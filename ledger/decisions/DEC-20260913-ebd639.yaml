  limitations:
    - >
      Approving a protocol asserts that the protocol is complete. It asserts
      nothing about whether its hypothesis is true, and it is not evidence for
      anything. No hypothesis moves past `approved` on this decision.
    - >
      The two authorized contracts are DERIVATIONS. Their outputs are cost tables
      and optima under stated cost models, not measurements of a running
      algorithm. A cost model is a modelling choice, and every verdict they
      produce is scoped to its metric; an unfavourable row is a property of the
      model as much as of the algorithm.
    - >
      Nothing here bears on Semaev's Assumption 2 or on the asymptotic bound (17),
      which stands under it independently of anything Assumption 1 does. A result
      about Assumption 1 is not a result about the exponent.
    - >
      No claim in this batch has yet received independent review. Any output that
      would contradict a validated evidence record, or that would be presented as
      a breakthrough or a closure, requires review-breakthrough at max effort in
      an independent session, which may not be degraded. If that tier cannot be
      served, the claim stays un-promoted and the goals stay active with a
      recorded impediment.
  next_actions:
    - Execute EXP-SEMBIN-f4a17b and EXP-SEMBIN-81dc96; retain all raw outputs.
    - >
      Snapshot-archive the run artifacts before any independent review reads them,
      then review, then a separate ledger commit for any evidence record. Results
      remain observations until that sequence completes.
    - >
      Do not authorize EXP-SEMBIN-7e1371 until EXP-SEMBIN-c2c312 has reported the
      degree map, in either direction.
    - >
      Re-rank after the two derivations return. A crossover that moves
      substantially changes what the degree ladder is worth measuring.
