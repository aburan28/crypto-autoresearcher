  dispatch_ranking:
    - rank: 1
      experiment_ids: [EXP-SEMBIN-f4a17b, EXP-SEMBIN-81dc96]
      concurrent: true
      reason: >
        Both are pure derivation from formulas the paper publishes. Neither needs
        a Groebner engine, a curve, or machine headroom; neither can be blocked by
        the definitional question that gates the degree work; and both bear
        directly on the paper's own headline conclusion rather than on its
        machinery. f4a17b adds the memory axis the comparison never had. 81dc96
        re-solves the two-stage balance jointly over (m, t) instead of over m with
        t = m fixed, and charges the n^{4 omega} cofactor that Table 3 absorbs.
    - rank: 2
      experiment_ids: [EXP-SEMBIN-354a75]
      concurrent: false
      reason: >
        Enumerates realized decomposition yield against eq. (11) exhaustively.
        Inherits no degree assumption because it COUNTS rather than solves, so it
        is not gated by c2c312 either. Ranked below the derivations only because
        it needs an implementation and a window small enough to enumerate
        exhaustively, and an exhaustive count over too small a window answers a
        different question than the one asked.
    - rank: 3
      experiment_ids: [EXP-SEMBIN-c2c312]
      concurrent: false
      reason: >
        THE GATE for the degree work. Until Semaev's d_F4 and GOAL-DREG-001's
        Macaulay-rank D are instrumented on byte-identical systems and mapped
        onto each other, a boundary measurement cannot be compared against the
        paper's own cells, and that campaign's existing degree-5 and degree-6 data
        cannot be read as bearing on Assumption 1 in either direction. Running the
        boundary search first would produce numbers nobody could interpret.
    - rank: 4
      experiment_ids: [EXP-SEMBIN-7e1371]
      concurrent: false
      reason: >
        Blocked by c2c312 by construction. Also the only contract with a real
        machine-headroom risk: the cells it wants are the ones Kosters reported at
        111-126 GB, which is why it uses one-sided degree-4 Macaulay rank
        certificates instead of Groebner completions.
  rationale:
    - >
      PROTOCOL READINESS, checked per contract rather than assumed from the
      standing authorization. Each of the five carries: a matched null object of
      the same shape, a known-false object for the proves-too-much control, an
      invalid-input reject, declared metrics with directions and minimum effects,
      a stopping rule, a memory and wall-clock budget, and declared artifact
      paths. Each also carries a baseline cell that reproduces a value the paper
      itself publishes, so that a later disagreement is distinguishable from an
      engine difference rather than being argued about afterwards.
    - >
      EXECUTION AUTHORIZED FOR TWO, not five, and the asymmetry is the point.
      f4a17b and 81dc96 are derivations over published formulas: their inputs are
      the paper's own equations, their cost is arithmetic, and their failure mode
      is a modelling error that a reader can check line by line. The other three
      consume a Groebner or Macaulay engine, and two of them are gated by a
      definitional question that is still open. Authorizing all five at once would
      buy nothing and would put the boundary search in flight before the quantity
      it measures has been mapped to the quantity the paper's assumption is about.
    - >
      WHY THE MEMORY CONTRACT IS RANKED FIRST rather than the degree work, which
      is the more obvious target. Assumption 1 is a conditional: the paper states
      the bound conditionally on it and separately offers Assumption 2 in Section
      4.6, under which the asymptotic claim survives. So falsifying Assumption 1
      at some (n, k) does not by itself touch the exponent, and it would take a
      long ladder of expensive cells to say anything about the crossover. The
      missing memory column is different: it is unconditional, it is arithmetic,
      and it bears on the ONE claim in the paper that is about deployed parameter
      sizes -- the Section 4.5.2 statement about four FIPS binary curves. The
      cheapest contract is also the one aimed at the load-bearing claim, which is
      not usually true and is the reason for this ranking.
    - >
      SCOPE, recorded before any result exists. f4a17b produces a COST TABLE under
      stated metrics. A memory figure is not a refutation, an unfavourable
      crossover is not an error in the paper, and neither output says anything
      about the security of any curve in either direction. The n values are
      parameter labels. 81dc96 likewise re-solves an optimization the paper solved
      under a different constraint; if its optimum is interior at t < m that is a
      statement about the paper's own cost model, not a new algorithm, and it
      inherits whichever degree assumption its cost model names.
    - >
      IDENTIFIER BINDING, recorded because it is the kind of thing that is
      invisible six months later. inputs/SEMAEV-2015-310/tables.yaml and
      KN-OPEN-86e7e1 were committed naming EXP-SEMBIN-f4a17b for the
      memory-charged cost work. The design session had provisionally used that id
      for the joint (m, t) optimization. Honouring the committed binding, f4a17b
      keeps the memory work and the optimization took a freshly minted
      EXP-SEMBIN-81dc96. No committed archive named either id in a binding field,
      so this was a reassignment before first use rather than a remap of a bound
      record; core rule 15 was not engaged and no record was renamed.
    - >
      AMBIGUITY CARRIED FORWARD RATHER THAN RESOLVED BY ASSERTION. Recomputing
      Table 3 reproduces the paper's printed values only when k in the stage-1 and
      stage-2 formulas is read as the real number n/m, not as ceil(n/m) as
      Section 3 defines it. Both readings are defensible from the text and they
      differ materially at the concrete n that Section 4.5.2 is about. This is
      recorded as an ambiguity in H-SEMBIN-b1708c and assigned to EXP-SEMBIN-81dc96
      to settle under both readings. It is NOT recorded as an error in the paper,
      and this decision asserts neither reading.
