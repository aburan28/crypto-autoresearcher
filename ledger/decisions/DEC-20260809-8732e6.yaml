coordinator_decision:
  id: DEC-20260809-8732e6
  goal_id: GOAL-ARGON-001
  batch_id: BATCH-09d69e
  recorded_at: '2026-08-09'

  decision: refine
  decision_type_rationale: >-
    Not support/weaken/reject_scoped: nothing was tested (runs_authorized: 0
    throughout this batch), so there is no tested result to score in either
    direction. Not expand: expanding onto this proposal now, without
    reconciling it against the two substantively overlapping siblings both
    reviewers found, would create a third independent formalization of the
    same graph-first-measurement idea in this program's records. Not
    inconclusive: both reviews reached clear, specific, actionable verdicts.
    `refine` names exactly what both independent reviews converged on: the
    proposal's own content is sound and admissible, but it needs
    reconciliation with existing records before it is ready input to a
    /design-experiment step.

  context: >-
    GOAL-ARGON-001 BATCH-09d69e. Idea-generator TASK-20260809-4e04eb proposed
    a falsifiable Argon2 DAG-structure hypothesis. Independent Validator
    (TASK-20260809-28c68e) verdict: passed / pass_with_qualifications.
    Independent Red Team (TASK-20260809-a0f79c) verdict: conditional pass on
    content, fail on the DEDUP FIRST duty as performed. Full detail in
    EV-ARGON-209ece.

  evidence_refs:
    - EV-ARGON-209ece

  target_ids:
    - GOAL-ARGON-001
    - TASK-20260809-4e04eb
    - IDEA-20260809-a915ea
    - IDEA-20260809-ac5947
    - IDEA-20260809-bcf891

  findings_addressed:
    finding_1_dedup_incomplete: >-
      RULING: the producer's dedup search (grep for literal "Argon2" in
      ledger/proposals/) undercounted RQ-ARGON-141710's existing proposals by
      nearly half (5 found vs. 9 on record, all pre-dating this batch). The
      four missed are IDEA-20260809-ac5947, -bcf891, -bf5139, -c13b8b. Two are
      substantively important: ac5947 is the direct downstream tradeoff-attack
      proposal this graph work exists to feed (already built on a915ea's
      object -- so two independent, non-identical "measure the DAG first"
      formalizations, a915ea's original sketch and this task's more rigorous
      version, are now both on record with no reconciliation); bcf891 is a
      strictly stronger, already-designed calibration control (against
      independently-known depth-robust and known-shallow families) for
      exactly the weakest link in this proposal's own §7 (the self-referential
      small-q exact/ILP cross-check). This is a real, load-bearing gap, not a
      formality: TASK-20260809-4e04eb's own receipt.yaml marks the DEDUP FIRST
      completion-gate `satisfied: true`, which was not accurate as performed.
      The correct dedup method is to join on `question_id`, not to grep body
      text for a scheme name -- three of the four missed siblings never
      contain the literal string "Argon2" anywhere in their body.
    finding_2_batch_dedup_census_empty: >-
      RULING: coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/batch.yaml's
      own dedup_census field was left empty at batch-opening, which is this
      Coordinator's own omission (the batch was opened in this same session,
      before either review ran) -- the gap was not caught until independent
      review, which is exactly what independent review is for, but a future
      batch.yaml for this goal should populate dedup_census before dispatch,
      not leave it for the producer task alone to discover.
    finding_3_snapshot_write_scope: >-
      RULING: TASK-20260809-862322's snapshot commit (da073ca9d) touched
      dispatch_queue.json (two task-state flips) outside its own declared
      write_scope/artifact_paths, alongside the two properly-declared
      artifacts. Both independent reviews flagged this identically. The
      commit is immutable and the deviation was self-disclosed at commit time
      and is content-neutral (does not affect the hash-verified proposal.md/
      receipt.yaml), so no repair is warranted. Binding for future batches on
      this and other goals: a snapshot-archive task's write_scope should
      either explicitly include the queue-state-transition path it intends to
      touch, or state transitions should be left entirely to the downstream
      ledger-archive task that already owns dispatch_queue.json in its
      write_scope -- not silently mixed into the snapshot task as this batch
      did.
    finding_4_content_holds: >-
      RULING: every other duty the producer was charged with -- explicit
      falsifiable mechanism/prediction/two-tier falsification criterion, no
      real credential data, no smuggled security verdict or parameter
      recommendation, honest RFC-9106-access-failure disclosure with every
      RECALLED premise correctly hedged and none asserted as read -- is
      independently confirmed satisfied by both reviewers, including a strong
      positive corroboration neither review was required to attempt: the
      Validator independently obtained RFC 9106 via raw HTTP fetch (a route
      the producer's WebFetch/WebSearch tool could not reach) and confirmed
      all seven RECALLED claims (C1-C7) accurate against the primary text.
      This proposal's hypothesis is not rejected, weakened, or found wanting
      on its mathematical/methodological merits; it is held pending
      reconciliation with records that already existed when it was
      dispatched.

  rationale:
    - >-
      Promoting this proposal to /design-experiment now, unreconciled, would
      mean the program carries three independent, non-identical treatments of
      the same underlying idea (a915ea's original sketch, ac5947's downstream
      consumer built on a915ea, and this task's more rigorous but
      un-reconciled reformalization) with no record of which is authoritative
      -- exactly the kind of goal-record fragmentation this session already
      spent significant effort untangling elsewhere in this branch (see
      CORR-20260809-acfaf0 and the GOAL-MLDSA-001 goal-head reconciliation,
      both earlier in this branch's history) for reasons unrelated to
      GOAL-ARGON-001 but illustrating the same failure mode.
    - >-
      The proposal's content is not wasted by holding it: it is a real
      improvement over its nearest sibling (a915ea) in rigor (explicit
      quantitative metric, null-object control, tiered falsification), and its
      independently-corroborated RFC 9106 spot-check is itself a durable,
      reusable fact for whichever record eventually becomes the goal's
      surviving formalization.
    - >-
      GOAL-ARGON-001 was activated this session onto a portfolio the
      Coordinator believed was untouched (DEC-20260809-25e6ae's own stated
      selection criterion); this batch discovered that belief was wrong for
      this specific goal (nine sibling proposals already existed). That is
      itself useful information for future goal selection under this
      program's current extreme concurrency level, recorded here rather than
      only implicitly.

  limitations:
    - >-
      This decision does not reconcile a915ea, ac5947, bcf891, and this
      task's proposal against each other -- that reconciliation is named as
      the concrete next action, not performed here, because it requires
      reading all nine sibling proposals in full (this decision's context is
      the two reviews plus the specific siblings they named, not an
      independent full read of all nine).
    - >-
      RFC 9106 remains unfiled as a formal KN-LIT primary source under this
      goal despite being spot-check-confirmed accurate by the Validator; that
      filing is left to whoever performs the reconciliation, not done here.
    - No hypothesis or experiment status changes; none existed to change.

  next_actions:
    - >-
      Before any /design-experiment step on this goal: reconcile
      TASK-20260809-4e04eb's proposal against all nine existing
      RQ-ARGON-141710 proposals (a915ea, ac5947, ac98b5, b17238, b9e9cc,
      bcf891, bf5139, c059a7, c13b8b), joining on question_id rather than
      body-text search. Decide explicitly whether this task's content
      supersedes, merges with, or stands alongside a915ea and ac5947, and
      correct a915ea's factually-false dominated_by field (asserts "no
      memory-hard-function records exist in the corpus"; eight do,
      independently confirmed by both this batch's producer and its
      Validator) in the same pass.
    - >-
      If/when a frozen experiment is designed for the surviving
      formalization: adopt IDEA-20260809-bcf891's independent-known-family
      calibration design (known-depth-robust and known-shallow reference
      graphs) in place of, or in addition to, the self-referential small-q
      cross-check this task's proposal.md §6 step 6 sketched.
    - >-
      Retry RFC 9106 acquisition via a raw-HTTP-fetch-capable route (curl or
      equivalent), which this batch's Validator demonstrated works in this
      environment where WebFetch/WebSearch does not; file it as a KN-LIT
      primary source once obtained, since its content is now independently
      spot-check-confirmed.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      No experiment ran and no durable finding about Argon2 exists yet to
      promote. RFC 9106's spot-checked accuracy (validator's F-4) is a strong
      signal but not yet a formally filed KN-LIT citation (the RFC was
      fetched ad hoc via curl for verification, not read-and-filed by a
      literature-acquisition task) -- filing it is named above as part of the
      reconciliation next action, appropriately performed alongside the
      sibling-proposal consolidation rather than as a unilateral promotion
      from this decision.

  decided_by: coordinator
  decided_at: '2026-08-09'

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-sonnet-5
    fallback_used: true
    fallback_note: >-
      Policy aliases do not resolve to distinct models under this Claude Code
      harness; this session runs model: inherit (claude-sonnet-5, the
      resolved session model). Not Bedrock.
    model_verified: false
