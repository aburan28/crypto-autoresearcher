    The producer (TASK-20260901-f5d3a4, 738 s of 3600 s, 6/6 runs) returned
    CONFIRMED-MISMATCH-ALIVE under the record's decision rule: Gate 0 passed
    under fresh code; the census matched the preregistered flat table on
    100/100 cells with the digest committed pre-arm; the keyed bridge held
