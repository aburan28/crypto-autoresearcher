  outcome: >-
    CONFIRMED-MISMATCH-ALIVE, independently validated with zero
    discrepancies and scope-narrowed by red team:

    (i) The instrument's affine-limit pair-difference map is the identity
    (Gate 0 + keyed bridge 2500/2500 including known-false controls); the
    identity-map census over the frozen 100-cell set is flat BY
    CONSTRUCTION and is recorded as convention self-consistency, not as
    an AES property (red-team J2 adopted).

    (ii) At r = 6 -- AES's death round under the carried comparator --
    the census-predicted-alive affine cell (r=6, A={0}, S={0}) read hits
    = 2^30 (T = 0) at full exposure, W = 3 on 100% of nontrivial trials,
    excess ratio 1.0 exact. The single factor differing between the
    alive-at-r=6 and dead-at-r=6 measurements is the S-box. THE r=6
    DEATH ROUND IS NOT CARRIED BY THIS PAIR-DIFFERENCE MAP.

    (iii) Empirical law coverage is r in {2, 5, 6}; 'alive at all r'
    within r <= 10 rests on the r-free derivation conditioned on the
    KAT-anchored convention (red-team J1). The candidate carrier e =
    (q0^q1)^(p0^p1) is named but unmeasured (red-team J5).

    Composed with the five substitute/geometry exclusions (EV-AES-e4c091,
    EV-AES-dec938, EV-AES-4ba350, EV-AES-5478a0, EV-AES-048545): the
    mechanism question 'where does the r=5 excess live' now has its
    first positive discrimination -- the excess survives the affine
    skeleton at the death round and dies with the nonlinear S-box under
    the carried comparator -- scoped exactly as recorded, with seven
    named boundary falsifiers.

  rationale:
    - >-
      The record's preregistered decision rule returned
      CONFIRMED-MISMATCH-ALIVE; the validator independently reproduced
      every number from raw data; the close is the mechanical recording
      of committed results.
    - >-
      The red team's verdict-must-narrow is adopted in full: the
      evidence record's OBS-FE0-4 carries the scope-narrowed reading,
      and the three overclaims it named (census-as-AES-evidence,
      general-nonlinearity theorem, established carrier e) are
      explicitly disclaimed in decision_scope. The proves-too-much
      control passed.
    - >-
      Strength is recorded moderate (not strong) per
      EV-AES-ec53f1's strength_basis: one fixture arm at one seed,
      empirical coverage r in {2,5,6}, cross-lineage B3 not
      discharged.
    - >-
      A claim-changing result received both independent reviews before
      ledger recording (BATCH-713991 precedent); the red-team card was
      added after the snapshot with the coordinator prior recorded
      first, and blindness within the round was declared and attested.

