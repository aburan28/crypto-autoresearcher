  context: >-
    /design-experiment, one contract, for IDEA-20261005-903ce8. No
    hypothesis and no experiment on origin/main or on the checked design
    pull requests cites it. The branch design/frob-903ce8-f25 was created
    from origin/main at 3575cc2705c200ffc0c0163c82548ab3335585ce and
    git merge origin/main reported already up to date.

    The contract square-tests y^2 = x^3 + x + 1 over F_5 and over F_25.
    The prediction is exactly 27 points over F_25, including infinity.
    Any other count is a negative, so success can fail. The nearby
    equation y^2 = x^3 + x + 2 is a control, pre-registered at 4 and 32.
    No exponent improvement is claimed.

    This session opened ledger/questions/RQ-FROB-7d8dd4.yaml and the
    frontier rows KR-RHO-13bf67, KR-RHO-755e35, KR-RHO-0528e7, and
    KR-RHO-fbd7b1. It read IDEA-20261005-903ce8 from
    origin/design/pair-3a18d1-hcp via git show and did not copy that
    file. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, the lexicographic seed, replication,
    budget, stopping rules, invalidation rules, success criterion,
    falsification criterion, and required artifacts are all non-null.
    No field required for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A count of E(F_25) other than 27 is a negative.
    - Two square-test methods, the modulus identity, and the nearby equation give the count a way to come back invalid rather than as a false 27.
    - Success is only the first assignment row, so success can fail.
    - No field element was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: one curve, q = 5, n = 2. No transfer to a factor base or a larger extension.
    - The trace recurrence is the source of the integer 27. It is not the counter.
    - This decision authorizes a later run. It does not start one.

