  the_question_as_the_precondition_states_it: >-
    P-6, VERBATIM FROM DEC-20260906-f709b2 NA-1: "A STATED POSITION ON THE
    COMPANION RECORD: whether its EXISTENCE gates enactment, with the
    consequence accepted recorded if it does not (AF-5). The redraft's own
