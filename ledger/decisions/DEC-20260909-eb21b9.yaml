  # =======================================================================
  the_position: >-
    YES - THE COMPANION RECORD'S EXISTENCE GATES ENACTMENT. The amendment's
    clauses 3 and 4 are contract-level requirements on implementations, and the
    companion record - the separate record carrying the cost_model.py
    output-path repair, the clause_3 serialization change at the per-field
    emission site, and the clause_4 reachability status emission, with
    EXPLICITLY NO RUN AUTHORIZATION - is what makes a conforming implementation
    exist. Enacting without it produces exactly the state the redraft's own
    reviewer_notes disclose and the AF-4 interval analysis sharpened: a contract
    with NO CONFORMING IMPLEMENTATION, whose clause_4 licence predicate is not
    merely unmet but currently UNPRODUCIBLE, and whose clause_3
    `deviation_sign_note` is an unsubjected passive whose prohibition reaches
    any writer of any later report throughout the interval. A licence nothing
    can satisfy, binding everyone, for an indefinite interval, is the decoration
    this programme exists to avoid; the draft itself says the two should be
    enacted together; the red team attached the same condition; and the gate is
    SERVABLE, which is the hinge of the judgment - the companion's enactment is
    verified by INSPECTION of a diff and re-parse of the contract, never by
    EXECUTION of cost_model.py, so CF-10's containment is honoured and no limb
    of this gate depends on any prohibited or unservable operation.

  the_consequence_accepted_as_p_6_requires: >-
    RECORDED IN FULL, BECAUSE A GATE WITHOUT ITS COST IS A VERDICT, NOT A
    DECISION. (1) THE ENACTING BATCH'S FIRST PRODUCER IS THE COMPANION RECORD:
    the enacting act does not commit until the companion record exists -
    authored, committed, snapshotted, and independently reviewed like every
    other producer package of that batch. (2) BOTH ARE ENACTED BY ONE AND THE
    SAME ENACTING COORDINATOR DECISION - the red team's recorded condition and
    the redraft's own reviewer_notes are honoured in action and in decision;
    whether the companion travels in the SAME RECORD or a SEPARATE record -
    DEC-20260904-4c81b6 next_actions[4]'s `travels with` authority limb - is
    EXPRESSLY STILL RESERVED to the enacting decision (NA-2(i)) and this
    position does not resolve it: gating on EXISTENCE is compatible with either
    reading. (3) ZERO RUNS: the companion's verification is inspection-only; no
    invocation of cost_model.py, with or without WESOVOW_RAW_PATH set, and no
    write under inputs/ - the companion record itself carries explicitly NO run
    authorization, and a raw-output status would need an EXECUTION that remains
    a further, separate Coordinator decision. (4) THE ROUTING DETERMINATION IS
    UNTOUCHED: whether the enacting act needs `review-breakthrough` at `max`
    remains the enacting batch's own determination to make and record (P-5); if
    it concludes that tier is needed, the tier is unservable here (IMP-1) and
    the enactment does not proceed on a lower one - this gate neither forces nor
    prevents that outcome. THE COST ACCEPTED: enactment waits for one bounded,
    servable producer instead of proceeding immediately into a documented
    unproducible interval. That is the cheaper of the two recorded costs, and
    the choice is deliberate rather than inherited.

