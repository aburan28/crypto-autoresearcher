coordinator_decision:
  id: DEC-20260905-a0c497
  context: >-
    Composes independent Validator (Joints 1 and 3, both HOLD) and Red
    Team (Joint 2 and the proves-too-much control, both HOLD; plus a
    voluntary cross-cutting finding) review of EXP-MONO-7f39bf's
    completed measurements (RUN-MONO-7f39bf-3/-4, both `completed_valid`),
    per review-plan TASK-20260905-77a64b. This is the experiment testing
    IDEA-20260807-5126f4's actual, corrected partial-locus claim
    (H-MONO-6adf3c), designed specifically after an earlier draft
    (H-MONO-39b1f0) was found, by a prior independent review round
    (TASK-20260905-153d93), to have conflated the idea's own
    already-decided full-locus null control with its real, still-open
    claim. Both reviewers, working independently and blind to each
    other, converged via ENTIRELY DIFFERENT METHODS (the Validator via
    exhaustive per-cell set-equality across all 6 tested cells; the Red
    Team via a general symbolic discriminant identity, derived for
    generic curve parameters) on the same conclusion: this corrected
    construction is ALSO provably unable to test what the idea intended,
    for a precisely understood, general algebraic reason -- not an
    ambiguity of interpretation this time, but a mathematical fact about
    the construction itself.

  decision: revise
  decision_label: >-
    h_mono_6adf3c_character_tower_membership_filter_provably_and_generally_vacuous_reject_branch_mathematically_unreachable_for_any_genuine_candidate_idea_20260807_5126f4_closed_doubly_independently_confirmed_via_disjoint_methods_branch_count_formula_corrected_to_2_pow_m_minus_3

  target_ids:
    - H-MONO-6adf3c
    - H-MONO-39b1f0
    - IDEA-20260807-5126f4
    - EXP-MONO-7f39bf
    - EV-MONO-c32ca3
    - KN-FIND-14706d
    - TASK-20260905-77a64b
    - GOAL-MONO-001
    - RQ-MONO-001

  hypothesis_status_before: proposed
  hypothesis_status_after: >-
    refuted_reject_branch_mathematically_unreachable_for_any_genuine_candidate_doubly_independently_confirmed_via_disjoint_methods
  hypothesis_status_after_note: >-
    Not "search infeasible" and not "inconclusive": the discriminant
    identity chi(disc_branch(T)) = chi(f(T)), proven generically for any
    curve (A,B) by the Red Team's own from-scratch symbolic derivation
    and independently confirmed by the Validator's own exhaustive
    per-cell set-equality check, means the character-tower filter accepts
    (PASS) every genuine on-curve candidate target unconditionally, for
    every tested m (4 and 5) and, by the identity's own curve-generic
    derivation, for every curve. This is a PROVEN mechanism, not a
    measured tendency: IDEA-20260807-5126f4's own falsification condition
    (a) ("filter false-positive rate is ~1 on the partial locus too...
    the imprimitivity buys nothing") is met with certainty, not merely
    with high measured probability. The additive/enumerate-and-test
    baseline is entirely untouched by this result; nothing here concerns
    the relation-rate half of KN-OPEN-009 (IDEA-20260805-a9a95d's own,
    separately-resolved thread) or H-MONO-45183a's own imprimitivity
    finding.

  experiment_status_before: approved
  experiment_status_after: completed

  official_status_changes:
    goal_status_changed: false
    goal_status_after: active
    hypothesis_status_changes:
      - hypothesis_id: H-MONO-6adf3c
        from: proposed
        to: >-
          refuted_reject_branch_mathematically_unreachable_for_any_genuine_candidate_doubly_independently_confirmed_via_disjoint_methods
    experiment_status_changes:
      - experiment_id: EXP-MONO-7f39bf
        from: approved
        to: completed
    resource_disposition_changed: false
    completion_criteria_met: []
    implementation_authorized: false
    experiment_runs_authorized: 0
    scientific_interpretation_authorized: true
    scientific_interpretation_scope: >-
      Exactly the scoped refutation stated above: this specific
      character-tower construction (branch values obtained via EC point
      addition on already-on-curve fixed coordinates; discriminant taken
      in the free/target variable) cannot discriminate a genuine
      candidate from a spurious one, for any m, any curve. Does not
      re-open or re-close KN-OPEN-009 itself (a knowledge-curation act);
      does not touch H-MONO-45183a or H-MONO-663fb4.
    closure_authorized: true
    breakthrough_authorized: false

  claim_tier: toy
  scope_statement: >-
    The MEASUREMENT is toy-scale (p in {211,431,1009}, m in {4,5}, two
    replication seeds). The DISCRIMINANT IDENTITY itself
    (chi(disc_branch(T)) = chi(f(T))) is proven generically for any
    curve (A,B) by symbolic derivation, so its consequence -- REJECT is
    unreachable for any genuine candidate -- is not scale-limited for
    this exact construction at m in {4,5}. Extension to m>=6 (where the
    Red Team's own corrected branch-count formula, 2^(m-3), continues) is
    a well-grounded conjecture from the identical construction pattern,
    not independently verified at m>=6 by this decision.

  rationale:
    - >-
      TWO REVIEWERS, TWO DISJOINT METHODS, THE SAME CONCLUSION. The
      Validator worked purely empirically and combinatorially: it traced
      the actual PASS/REJECT code, found concrete T values that DO
      trigger REJECT (proving the branch is reachable, not disabled by a
      bug), then showed by exhaustive computation at all 6 tested cells
      that the REJECT-triggering T-set is EXACTLY the complement of the
      on-curve x-coordinate set -- a fact about the SAMPLE DOMAIN, not
      yet a proof for untested cells. The Red Team, working independently
      and blind to the Validator's own approach, derived a GENERAL
      symbolic identity (generic A, B, not tied to any specific tested
      prime) that explains WHY that set-equality must hold for every
      curve: chi(disc_branch(T)) = chi(f(T)) identically, because every
      branch value is itself an on-curve point's x-coordinate by
      construction. Agreement between an empirical, per-cell result and
      an independent, curve-generic symbolic derivation is exactly the
      kind of convergence this program's review architecture is designed
      to surface -- each method could have caught an error the other
      missed, and neither did.
    - >-
      A PROVEN MECHANISM SUPERSEDES A MEASURED ONE. This decision does
      not report "the filter measured a high false-positive rate at
      three primes"; it reports "the filter can never reject a genuine
      candidate, at any prime, because of an identity in the branch
      construction". This is the same upgrade in kind that
      KN-FIND-19f5ea (the bivariate D-term interaction closure) made
      earlier this session: converting what could have been read as
      three separate resource-exhaustion or high-false-positive-rate
      observations into one understood, permanent, curve-generic fact.
    - >-
      THE R1 NAMED RISK IS RESOLVED, NOT MERELY OBSERVED. The
      specification's own named_risks flagged the m=5 branch-count
      mismatch (4 measured vs. m-2=3 predicted) as unverified pending a
      run. The Red Team's own from-scratch re-derivation, independent of
      the Executor's implementation, establishes the CORRECT general
      formula is 2^(m-3) (exponential), not the idea's own linear m-2 --
      the two formulas coincide only by coincidence at m=4. This is
      recorded as a correction to IDEA-20260807-5126f4's own mechanism
      claim, not merely a run-specific anomaly.
    - >-
      THE PROVES-TOO-MUCH CONTROL HELD, SO THE MEASURED RATES ARE NOT
      DISCARDED, ONLY REINTERPRETED. The Red Team's independent
      hand-verification of the ground-truth root-finding path (a
      root-free T and a non-trivial-root T, both matched exactly) rules
      out the alternative explanation that the whole run's own
      measurement instrument is broken. The reported false-positive
      rates (0.128-0.798) are real, correctly-computed numbers -- they
      simply measure something different from what IDEA-20260807-5126f4
      intended (the base rate of a random on-curve target having a
      genuine root, not the filter's own discriminating power), per
      EV-MONO-c32ca3's own `inference` field.
    - >-
      GENUINE, NOT PREMATURE, CLOSURE PER AGENTS.MD RULE 9. This
      decision does not abandon IDEA-20260807-5126f4's line because it
      looked unpromising or expensive -- it closes it because BOTH the
      idea's own first falsification condition AND a rigorous general
      explanation for why it fires are now in hand, doubly independently
      confirmed. The idea's own second falsification condition (resolvent
      cost) is rendered moot by the same logic H-MONO-39b1f0's own
      full-locus confirmation used, not silently dropped: a filter that
      can never reject anything provides zero pruning value regardless
      of its own per-decision cost, so instrumenting that cost further
      would not change this disposition.
    - >-
      A REUSABLE NEGATIVE-RESULT LEMMA IS NAMED, NOT LEFT IMPLICIT.
      EV-MONO-c32ca3's own `obstruction.resource_check` reads this
      finding the other way: ANY future proposed membership filter in
      this lane built from Semaev-polynomial branch discriminants, where
      branch values are obtained by summing already-on-curve points, can
      be ruled out before implementation by checking this one algebraic
      fact -- a cheaper pre-compute audit than building and running the
      filter to rediscover the same vacuity empirically, which is exactly
      what happened twice in this exact sub-thread (H-MONO-39b1f0, then
      this record).

  next_action: >-
    IDEA-20260807-5126f4's own imprimitivity-branch membership-filter
    claim is CLOSED, both at the already-decided full locus
    (H-MONO-39b1f0) and at the corrected partial locus (this record) --
    no further experiment should be dispatched testing a character-tower
    filter of this exact construction shape at any m or curve. Per
    DEC-20260905-7c2ad9's own earlier framing, KN-OPEN-009's imprimitivity
    half remains addressed separately by H-MONO-45183a; this decision
    does not reopen or re-close that broader question. RQ-MONO-001's
    remaining ready backlog (per the most recent survey: IDEA-20260830-1a08f9,
    IDEA-20260830-8a767e, IDEA-20260830-d84f6a, IDEA-20260831-3fa5c9,
    IDEA-20260831-e91f3a, IDEA-20260831-6cd0b7, and IDEA-20260808-481e07)
    should be the next place effort goes on this question, per
    AGENTS.md rule 9's own "concrete successor" requirement -- a fresh
    survey re-check is warranted before picking one, since this decision
    itself and the earlier duplicate-adjudication (DEC-20260904-732cbe)
    both post-date the last full survey.

  knowledge_promotion:
    promoted:
