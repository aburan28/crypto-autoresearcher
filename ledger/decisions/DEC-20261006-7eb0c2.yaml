  context: >-
    /design-experiment, one contract. IDEA-20261006-df8024 is on
    origin/design/ssi-2f5c3f-cartier and is not on origin/main. The
    question is RQ-CSIDH-64343f. No hypothesis or experiment on
    origin/main cites that full id. The branch design/csidh-df8024
    was created from origin/main at
    7c15b48908ec601eb513f00c15c9d163cc00869c and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob 8316f86a1ab5277b5f301b9fc133e9b62fac36fd.

    The contract freezes the five primes 103, 107, 127, 131, and 139,
    two enumerations, and the score c(p) only on agreement. Success
    is the source idea's prediction that at least one certified
    c(p) is at least 2. The concrete negative is a finished census
    in which all five groups are certified and every c(p) equals 1.
    No form was enumerated in this session and no invariant factor
    was recorded.

    This session opened KN-LIT-508, KR-RHO-13bf67, KR-RHO-ea34b8, and
    KR-RHO-755e35. Those rows are not a measurement of these five
    lists. Genus theory and the Cohen-Lenstra Aut-weight are recalled
    and are not used as support.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when all five groups are certified and every c(p) equals 1.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - A finished census with all five groups certified and every c(p) equal to 1 is reachable as a recorded outcome, so success is not automatic.
    - The odd-order check, the discriminant -108 refusal, and the ignored class-number ranking are the instrument controls.
    - An unscored prime is not relabeled as cyclic, and an even order is not relabeled as a non-cyclic hit.
    - This session did not enumerate a form and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers five prime discriminants below 200 only. It does not transfer to CSIDH-512.
    - An empty set closes only these five discriminants.
    - The count is not a Cohen-Lenstra probability and is not a Kuperberg cost.
    - An instrument failure is not an empty set and is not a non-cyclic hit.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.

