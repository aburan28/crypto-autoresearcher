        queue is rendered with --claims refs. This was derived from reading
        the code, not from a dispatcher run (no shell). Nothing in the
        dispatcher stops a session claiming it.
      what_must_change_to_stop_the_offer: >-
        Not done here (the instruction is to edit no queue). It needs a queue
        edit by the dispatching session under its own Coordinator authority:
        set the `state` of the e8322f entry to `cancelled` with a
        `superseded_by: TASK-20261004-dc4823` note. A claim release cannot do
        it (a `failed` or `abandoned` release leaves the task queued, per
        apply_claims) and no queue-external supersession registry for tasks
        exists in the dispatcher. Until then the rule is procedural: nobody
        claims e8322f. The alternative route (complete e8322f in place) is
        stated under limitations.
    - task_id: TASK-20261003-5f223e
      queue: coordination/design/TASK-20261003-5b7958/dispatch_queue.json
