    observe that commit (no shell); the claim is the dispatching session's and
    is re-verified by TASK-20261004-dc4823 from git.

  form_chosen:
    form: >-
      This additive Coordinator decision plus ONE new self-archiving
      Coordinator card, TASK-20261004-dc4823, in the form of
      TASK-20261004-342564. The card declares the 26 run paths as its bound
      artifacts, verifies them by content against the release record's hashes
      WITHOUT re-committing them, and commits exactly this decision, itself and
      its receipt in one isolated commit.
    why_not_run_e8322f_as_written: >-
      Its constraint is "stage only the actual on-disk declared run/stage/
      RESULTS artifacts plus this task's own snapshot-receipt.json". The run
      artifacts are already in git, so there is nothing left to stage, and an
      empty or unrelated commit would only simulate the isolation that did not
      happen. A receipt never claims an isolation that did not happen.
    why_not_commit_binding_mode: >-
      In binding_mode commit the dispatcher requires the archive commit to
      change exactly the declared archive and source artifacts
      (tools/research_dispatch.py, verify_archive, "commit must change exactly
      declared archive and source artifacts"). That cannot hold for files
      already committed. The dispatcher's own comment (validate_archive_shape)
      reserves content_first for "source packages committed before their
      archive task ran", which is this case, and 342564 declares
      binding_mode content_first. The new card declares the same.
    placement: >-
      TASK-20261004-dc4823 is not in any dispatch queue (as 342564). It is
      therefore not claimable through tools/goal_lanes.py and not verified by
      research_dispatch.py. Its verification is the post-commit verifier plus
      the content comparisons it records. That is weaker than a
      dispatcher-verified in-queue archive and is disclosed here.

  old_snapshot_task_disposition:
