  limitations:
    - 'TOY SCALE, MECHANICALLY. Largest field 24 bits. Nothing in this decision is evidence about cryptographic-size curves or about prime-field ECDLP generally, in either direction.'
    - 'SINGLE UNREPLICATED RUN SET. Strength preliminary. Replication is an open obligation, not a discharged one, and no statement here may be upgraded without it.'
    - 'MODEL CORRELATION. Producer and validator resolved the SAME model (claude-opus-5), both with fallback_used true and model_verified false. Correlated blind spots would not have been caught. The validator wrote a paper-checkable test of both load-bearing facts precisely so a human or a different model family can settle them; that check has not yet been run by anyone else.'
    - 'PLATFORM. Reproducibility was demonstrated on the producer''s own machine, interpreter and sympy build. Platform independence is untested.'
    - 'NO PRE-EXECUTION DESIGN REVIEW EXISTED. The compensating control (TASK-20260728-003) worked, and it worked after the compute was spent. The four specification defects in R-6 would have been caught on paper.'
    - 'AGENTS.md RULE 12 IS UNDISCHARGED for the program-level closure reading of RT-1476-SUBRES-A1 (R-9), and separately remains undischarged across this campaign for EXP-GGM-001 and DEC-20260727-007 under TASK-20260727-010.'
    - 'THE deg_u SERIES AND THE beta_ops SERIES CARRY NO WEIGHT IN EITHER DIRECTION. Any future reader who cites 0.6009 or 0.7197 as a result is citing an artifact of the instrument, not a measurement.'
    - 'coefficient_profile WAS NEVER MEASURED, so the frozen contract''s coefficient-blow-up failure mode is UNTESTED, not absent. No inference is drawn from its absence.'
