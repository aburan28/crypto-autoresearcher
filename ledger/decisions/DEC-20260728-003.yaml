coordinator_decision:
  id: DEC-20260728-003
  id_allocation_note: >-
    PRE-ALLOCATED by DEC-20260728-001 reserved_identifiers and RECONFIRMED FREE AT HEAD 843b05f6 in
    phase 1 of TASK-20260728-004 across the UNION of both ledger namespaces: no
    ledger/DEC-20260728-003.yaml (root) and no ledger/decisions/DEC-20260728-003.yaml (typed) exist,
    and the only occurrences of the string DEC-20260728-003 anywhere under ledger/ are the
    reservation in DEC-20260728-001 and the handoff TASK-20260728-004. The reservation was spent at
    its reserved identifier, not shifted. A reserved identifier is not re-dated.
  title: >-
    Close BATCH-010: rule on the first measurement of the RT-1476-SUBRES-A1 exponents - weaken
    H-RT1476-001 on the tested scope, strike criterion S2 as unreachable, and apply the
    DEC-20260728-001 terminal condition to GOAL-ECDLP-001

  context: >-
    BATCH-010 executed EXP-RT1476-001 version 1 - 27 runs, three arms, three prime moduli of 10, 16
    and 24 bits, three seeds - to obtain, for the first time in this program, MEASURED values of the
    two exponents behind RT-1476-SUBRES-A1, the only live sub-rho gate on this goal. The run set was
    snapshot-archived at commit 777b1e43 (TASK-20260728-002) and independently validated by
    TASK-20260728-003, which returned VAL-20260728-001 with terminal verdict
    VALID_WITH_SCOPE_REDUCTION and which additionally supplied the design-adequacy finding that no
    pre-execution design review of this experiment had ever produced. The adverse prior was recorded
    in BATCH-010 batch.yaml BEFORE dispatch: the red team predicted beta_ops -> 3/2 from above and
    the generic count predicted beta_deg = 0.6, twice the gate. This decision rules on what the
    validated run set establishes, on the two pre-registered success criteria, on H-RT1476-001's
    status, and on the goal's position.

  decision: weaken
  decision_scope_note: >-
    ONE enum value is available on this record and `weaken` is the primary act: H-RT1476-001 moves
    specified -> weakened on the tested scope. The other rulings this record carries - S2 struck as
    unreachable, RT-1476-SUBRES-A1 closed on the tested scope only, HEUR-001 falsified as written,
    the replication obligation, and the GOAL-ECDLP-001 checkpoint - are recorded in rationale and
    next_actions rather than by inventing a second enum value.

  identifier_renumber_note: >-
    IDENTIFIER REPAIR APPLIED UNDER CORR-20260728-001, AFTER THIS DECISION WAS PUBLISHED AT
    8f408cdf. The three ids this batch created - EXP-RT1476-001, H-RT1476-001, EV-RT1476-001 -
    were malformed: tools/validate_ledger.py requires a letters-only area code and RT1476 has
    digits, so the experiment never registered and this decision's target_ids dangled. They are
    renumbered to EXP-SUBRES-001, H-SUBRES-001 and EV-SUBRES-001, and the retired ids are never
    reused. ONLY STRUCTURED POINTER FIELDS ARE EDITED - target_ids, hypothesis_transition.id,
    evidence_refs and related_records. THE RATIONALE, LIMITATIONS AND NEXT_ACTIONS PROSE IS LEFT
    VERBATIM and still names the retired ids: it is the historical record of what was decided and
    published, and rewriting narrative to match a later identifier would falsify it. NOTHING
    SUBSTANTIVE MOVES: the decision stays `weaken`, S1 stays not met, S2 stays struck as
    unreachable, the hypothesis stays `weakened` on the tested scope, and every claim boundary,
    ceiling and limitation is unchanged.
  target_ids:
    - H-SUBRES-001
    - EXP-SUBRES-001
    - EV-SUBRES-001
    - RT-1476-SUBRES-A1
    - BATCH-010
    - GOAL-ECDLP-001
  retired_target_ids: [H-RT1476-001, EXP-RT1476-001, EV-RT1476-001]

  hypothesis_transition:
    id: H-SUBRES-001
    id_as_published_at_8f408cdf: H-RT1476-001
    from: specified
    to: weakened
    fields_changed: 'exactly one: status.'
    authorized_by: DEC-20260728-003
    basis: >-
      Falsification conditions F1 and F2 of H-RT1476-001, and F1 of the frozen
      falsification_criterion of EXP-RT1476-001, are MET on the primary series with CTRL-POS having
      passed INVALID-4 on that series, which is the precondition the frozen criterion attaches. F4 is
      also met by a ratio test that uses no regression. The landing was PRE-REGISTERED before any
      data existed: BATCH-010 batch.yaml negative_branch reads "The landing is weakened plus a
      replication obligation, never rejected and never reject_scoped."
    rejected_alternatives_reasoned_by_name:
      supported: >-
        REJECTED AND FORBIDDEN. Forbidden outright by EXP-RT1476-001 interpretation_limits,
        H-RT1476-001 interpretation_limits, and BATCH-010 claim_ceilings. It is also contradicted by
        the data: the measurement is adverse, not favourable.
      rejected: >-
        REJECTED. `rejected` asserts the mechanism is wrong, not merely unsupported at these sizes.
        Nothing here licenses that: the tested scope is nine curves at at most 24 bits, on one
        implementation, in one session, with three fit points. A negative on a bounded toy scope is
        not a refutation of a mechanism.
      reject_scoped: >-
        REJECTED AND FORBIDDEN. Explicitly forbidden on a single unreplicated empirical_only run set
        by docs/claims-and-verification.md ("an empirical-only refutation on a single unreplicated
        run takes weaken + replication, not reject_scoped"), by EXP-RT1476-001
        interpretation_limits, by H-RT1476-001 interpretation_limits and by BATCH-010
        claim_ceilings.forbidden_transitions. Rejecting a theory deserves the same skepticism as
        confirming one.
      inconclusive: >-
        REJECTED, AND THIS WAS THE CLOSEST CALL. `inconclusive` would be correct if the meter were
        not demonstrated able to see a drop, or if the data could not discriminate between "the state
        collapses" and "the meter cannot see the collapse". Neither holds FOR THE SUPPORT SERIES:
        CTRL-POS returned 0.2034 on that series under instrumentation identical to the main arm's, so
        INVALID-4 does not fire and the bidirectional lock is released; the measured quantity is an
        exact cardinality computed by exhaustion rather than an estimate; and the answer is stable
        under every cut applied (leave-one-prime-out spread 0.033 against a 0.279 margin to the gate).
        `inconclusive` IS the correct landing for the beta_ops half and for the deg_u half, and this
        record says so in terms - but a hypothesis has one status, and its FIRST and primary
        prediction was tested by an admissible instrument and was not borne out.
      analyzed: >-
        REJECTED AS AN UNDERSTATEMENT. `analyzed` asserts only that a run set was examined and takes
        no position on direction. Taking no position would misrepresent a stable, exact,
        independently recomputed adverse measurement as though it carried no information, and would
        depart from the pre-registered negative branch after seeing the outcome - which is precisely
        the move a pre-registration exists to prevent. A negative result honestly obtained is a
        result.
      running: 'REJECTED. Execution is complete: 27 of 27 runs completed_valid, no stopping rule fired, and the run package is snapshot-archived and validated.'
      specified_unchanged: >-
        REJECTED. Leaving the status at `specified` would assert that the hypothesis remains untested
        - which is what DEC-20260727-007 correctly recorded for H-GGM-001, whose experiment never
        ran. That is not this case. EXP-RT1476-001 ran, its run set validated, and its primary
        prediction was measured.

  rationale:
    - id: R-1
      title: 'S1 IS NOT MET. beta_deg = 0.5985 against a gate of 0.3, and the margin dwarfs every instability.'
      text: >-
        Success criterion S1 requires beta_deg < 0.3 on backward_state_support_size across all three
        field sizes with a flat or decreasing slope trend. Measured, and independently recomputed
        from the 27 raw-result.json files by VAL-20260728-001 before that session opened
        results_summary.json: pooled 0.5985; pairwise 0.5790 / 0.5978 / 0.6119; per-seed 0.5940 /
        0.6053 / 0.5968; all-nine-cell OLS 0.5987; leave-one-prime-out 0.6119 / 0.5978 / 0.5790,
        spread 0.033; success-subset only 0.5982. Every cut clears the gate by at least 0.279,
        roughly eight times the largest instability. Agreement with results_summary.json is to
        4.88e-05 on all fifteen pooled slopes. S1 IS NOT MET, and it is not met by any reading of the
        data, at any size, on any subset, under any leave-one-out.
    - id: R-2
      title: 'S1''s corroboration clause is STRUCTURALLY UNAVAILABLE, and the second prediction of H-RT1476-001 is UNTESTABLE rather than tested.'
      text: >-
        S1 reads "measured on backward_state_support_size and, where available, corroborated by
        deg_u_backward_eliminant". The specification names beta_deg over two quantities and then
        writes INVALID-4 about "beta_deg" without saying which; the two disagree, so the ambiguity had
        to be ruled. It is ruled on the specification's own text and NOT on the outcome:
        backward_state_support_size is metrics.primary[0], is the quantity preregistered_prediction is
        written about, and is the quantity S1 names first; deg_u is corroborating "where available".
        deg_u is NOT available. It equals 8L^3 exactly on EVERY arm (512, 5832, 175616 at L = 4, 9,
        28) because the module computes it as the sum over L^3 triples of each triple's degree-8
        resultant - a function of L alone whose fitted 0.6 is arithmetic, not measurement. On the
        POSITIVE CONTROL, whose reachable set provably has 169 elements at L = 28, deg_u reports
        175616: an overstatement by 1039x. Read as a state-size meter it FAILS INVALID-4.
        CONSEQUENCES, APPLIED: the deg_u exponent 0.6009 is excluded from this decision's reasoning in
        both directions; H-RT1476-001's second prediction ("deg_u grows no faster than the support
        size, with fitted exponent below 0.3") is recorded UNTESTABLE BY THIS INSTRUMENT and is NOT
        counted against the hypothesis; and S1 is adjudicated on the support series alone.
    - id: R-3
      title: 'F1, F2 and F4 are met; the precondition the frozen criterion attaches is satisfied.'
      text: >-
        F1 (beta_deg >= 0.3 at any of the three sizes): MET at every size and on every slope, minimum
        pairwise 0.5790. F2 (pairwise slopes of beta_deg increasing with q): MET arithmetically -
        adjacent-pair slopes 0.5790 then 0.6119 - but recorded as EVIDENTIALLY WEAK, because with
        three points the same rise is what a finite-size effect at L = 4 would produce, and the L = 4
        cell is the most degenerate in the set (24% of its certificates contain a proper sub-multiset
        summing to the identity; all 43 certificates containing the target's own x-coordinate are
        there). F4 of H-RT1476-001 (the measured state agrees with the generic Theta(L^3) count):
        MET, by a ratio test that uses no regression at all - support/L^3 = 1.35729, 1.35073, 1.33530
        against 4/3 = 1.33333, within 2% at every size independently. THE ADVERSE READING RESTS ON F1
        AND F4. Both frozen criteria attach the precondition "with CTRL-POS having passed INVALID-4
        so that the meter is known to be able to see a drop"; on the primary support series CTRL-POS
        returned 0.2034 and INVALID-4 does not fire, so the precondition is satisfied FOR THAT SERIES
        and the falsification is admissible.
    - id: R-4
      title: 'THE PRE-REGISTERED THREE-WAY BAND, REPORTED AS ITS OWN OBSERVATION AND NOT ROUNDED.'
      text: >-
        The specification pre-registered (a) beta_deg < 0.3, (b) 0.3 <= beta_deg < 0.6, (c)
        beta_deg >= 0.6, and required band (b) to be reported as an observation rather than rounded to
        either end. THE HONEST REPORT IS THIS: the pooled point estimate 0.5985 falls inside band (b)
        BY 0.0015, a margin an order of magnitude smaller than the leave-one-prime-out spread of
        0.033, so THE POOLED FIT DOES NOT DISCRIMINATE BETWEEN (b) AND (c). Two things that do not
        depend on the fit point at (c): the largest pairwise slope is 0.6119, above 0.6; and
        support/L^3 converges on the generic constant 4/3 from above at every size. The determination
        recorded here is therefore "band (b) by the pooled number, band (c) in substance", stated as
        the observation it is. What is NOT in doubt under any reading, and is the only thing this
        decision relies on, is that beta_deg is far above 0.3.
    - id: R-5
      title: 'S2 IS STRUCK AS UNREACHABLE. It is NOT counted as met. This is the defect BATCH-009 condemned, in a new guise.'
      text: >-
        Success criterion S2 ("beta_ops < 3/2, fitted on ops_success only") COULD NOT HAVE FAILED, and
        the derivation is checkable on paper. membership_query performs L^3 iterations; each computes
        at most two resultants of polynomials whose degrees are bounded independently of q (4 in the
        eliminated variable, 2 in u) and then evaluates a degree-8 polynomial at every element of the
        forward state, so ops_per_query <= L^3 * (c1 + c2*|F|) with c1, c2 absolute constants. The
        forward state was MEASURED at |F| = L^2 EXACTLY at all three sizes - 16, 81, 784 - so
        ops_per_query = O(L^5) = O(q) for ANY curve, ANY factor base and ANY q, whence
        beta_ops <= 1 + o(1) < 3/2 WAS FORCED BEFORE ANY CURVE WAS SAMPLED. Fitting c1 and c2 from the
        two larger sizes alone predicts the HELD-OUT smallest cell to 1.5%. The measured pooled 0.7197
        is not an exponent at all: its pairwise slopes rise monotonically 0.6165 -> 0.7158 -> 0.7908
        with leave-one-prime-out spread 0.174, five times the beta_deg instability, and the asymptote
        is 1.0.
        THE RULING. S2 IS STRUCK AS UNREACHABLE AND IS NOT RECORDED AS MET. Counting it as satisfied
        would repeat precisely what REV-20260727-002 destroyed origin/main's EXP-GGM-001 for in
        BATCH-009: a gate that returns the same answer on every possible execution. There the operands
        were two string literals in one source file; here the threshold sits at 3/2 while the measured
        quantity is bounded above by 1 by the structure of a loop. The mechanism differs; THE
        EPISTEMIC CONTENT IS THE SAME - none. Symmetrically, F3 (beta_ops >= 1.5) is neither met nor
        unmet and contributes nothing to the adverse reading; the weaken rests on F1 and F4 alone.
        THE UNCOMFORTABLE FACT, RECORDED RATHER THAN SOFTENED: BATCH-010 was opened partly to avoid
        this exact defect, and it installed an anti-tautology rule that WORKED - the literals 0.3,
        0.6, 0.2 and 1.5 appear nowhere in the 1816-line module, the module emits no verdict, and
        every gate quantity is in raw-result.json. The rule policed the CODE. THE LOOP STRUCTURE
        FORCED THE ANSWER ANYWAY. Anti-tautology discipline at the source level is necessary and is
        not sufficient; the missing control is a pre-execution upper bound on the implemented query's
        cost, checked against the pre-registered threshold BEFORE execution.
    - id: R-6
      title: 'SPECIFICATION DEFECT OF EXP-RT1476-001 VERSION 1, RECORDED AGAINST THE PROTOCOL, NOT AGAINST THE EXECUTOR.'
      text: >-
        SPECDEF-RT1476-001-A: the frozen protocol names a success criterion (S2) and a falsification
        condition (F3) on beta_ops that no experiment in this family can reach, because the declared
        query's cost is bounded by O(q) by construction while the threshold sits at q^{3/2}. It also
        names deg_u as a primary metric that its own implementation cannot vary (SPECDEF-...-B), states
        |F| <= L(L+1)/2 where the truth is |F| = L^2 - wrong by about a factor of 2 in the quantity
        that is load-bearing in the cost model (SPECDEF-...-C) - and writes INVALID-4 about "beta_deg"
        without saying which of the two quantities it means (SPECDEF-...-D). NONE OF THESE IS AN
        EXECUTION FAULT. The Executor implemented the protocol as frozen, declared five deviations in
        advance, published its own three most attackable points, and stated in analysis.md caveat 1
        that beta_ops is a property of the declared query algorithm and named it "the single most
        important thing for the Validator to attack". The defect is the Coordinator's: BATCH-010
        approved this experiment with NO independent pre-execution design review, recorded that
        weakness in DEC-20260728-002 limitations, and named TASK-20260728-003 as the compensating
        control. The compensating control worked - and it worked AFTER the compute was spent.
        HANDLING: experiments/EXP-RT1476-001/specification.yaml is FROZEN and is NOT edited. Under
        AGENTS.md rule 4 the correction is a SUPERSEDING version 2, assigned as a successor task
        below. If beta_ops is ever to be measured, version 2 must implement a query whose cost is NOT
        bounded by O(q) by construction - an aborting variant, or one that materialises B_R by a
        product tree - and must state, BEFORE execution, an upper bound on the implemented query's
        cost so the reachability of its own threshold is checkable in advance. No new CORR-* identifier
        is allocated here: this decision is itself the new record, the superseding specification is
        the correction vehicle, and allocating an identifier would add a path this archive did not
        declare.
    - id: R-7
      title: 'THE POSITIVE CONTROL IS SOUND AND IS WEAKER THAN IT LOOKS. The weaken does not rest on it alone.'
      text: >-
        CTRL-POS is genuinely one-declared-respect different - verified mechanically across all nine
        cells, with the shared target stream agreeing on 95 of 95 comparisons - and the planted state
        really is 6L+1 (all 31 measured targets return exactly 169 at L = 28). BUT 0.2034 IS
        ARITHMETICALLY FORCED: V_pos = {x([i]P)} makes the reachable index set an interval of 6L+1
        integers, so ANY correct distinct-u counter must return 6L+1, and 6L+1 at L = round(q^(1/5))
        must fit to 0.2034. Since backward_state_support_size is DEFINED as an exact cardinality and
        COMPUTED by exhaustion, there is no sensitivity to calibrate: what CTRL-POS establishes is a
        CORRECTNESS CHECK excluding one real bug class - a routine returning |V|^3 or anything
        insensitive to the structure of V, which is exactly the bug that would have manufactured a
        false 0.6 on the main arm - and NOT a power calculation. This decision therefore does not rest
        the weaken on "the meter is calibrated". It rests on three things that do not need CTRL-POS:
        the primary quantity is an exact set cardinality computed by exhaustion with a group law
        verified 3191 times under three independent implementations; the ratio support/L^3 is within
        2% of 4/3 at EVERY size with no fit involved; and the elementary count 8L^3/3! = (4/3)L^3
        explains the result without any computation. CTRL-POS excludes the one bug class that would
        have faked exactly this answer, which is worth having and is all it is.
    - id: R-8
      title: 'THE REFUTATION-ARTIFACT LADDER WAS CLIMBED BEFORE THIS ADVERSE DECISION, AND THE STRONGEST AVAILABLE RUNG IS NAMED.'
      text: >-
        Required by agents/coordinator.md and docs/claims-and-verification.md before any weaken.
        RANK 1 counterexample certificate: NOT AVAILABLE and not constructible from this run set; the
        planted CTRL-POS factor base is not one, because it is built from the discrete logarithms of
        its own elements. RANK 2 derivation note: THE ARGUMENT EXISTS AND IS ARCHIVED - the count
        8L^3 signed triples, symmetric in three summands, collapsing by 3! to (4/3)L^3 and hence
        beta_deg = 3/5 exactly - written out in
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/adversarial_notes.md
        Part 4, in that batch's validation_report.yaml DA-1, and independently in
        experiments/EXP-RT1476-001/analysis.md section 6. ALL THREE WERE COMMITTED BEFORE THIS
        DECISION: analysis.md at 777b1e43, the validation artifacts at or before HEAD 843b05f6, which
        is this archive's declared parent. The status `derivation` is nevertheless NOT claimed on
        EV-RT1476-001, for three stated reasons: no standalone self-contained note is archived with
        the experiment as the doc describes; no session that resolved a different model has checked
        it; and BATCH-010's ceiling binds. RANK 3, declared empirical_only: THIS IS THE DECLARED
        BASIS. An undeclared basis is the failure; the absence of a proof is not.
    - id: R-9
      title: 'RT-1476-SUBRES-A1: CLOSED ON THE TESTED SCOPE, RECOMMENDED-NOT-DECLARED AS A PROGRAM-LEVEL CLOSURE. RULE 12 IS UNDISCHARGED.'
      text: >-
        DEC-20260728-001 attached a terminal condition BEFORE any data existed: a VALID run set with
        beta_deg >= 0.3 closes RT-1476-SUBRES-A1 on the tested scope and the goal does not proceed to
        BATCH-011 by default. That condition is met and IS APPLIED. The gate's status of record
        becomes: CLOSED ON THE TESTED SCOPE OF EXP-RT1476-001 VERSION 1 - these nine sampled
        prime-order curves, these three moduli of at most 24 bits, this x-line factor base at
        L = round(q^(1/5)), the serial-S3 2|3 split at m = 5, this sympy/GF(p) implementation, this
        budget - AND OPEN EVERYWHERE ELSE. It is closed for the first time by data rather than by a
        prior, which is what this batch was opened to do.
        WHAT IS DELIBERATELY NOT DECLARED: any program-level statement that RT-1476-SUBRES-A1 is
        closed, that the subresultant route is dead, or that the program's last sub-rho window has
        shut. That is a CLOSURE RESULT in AGENTS.md rule 12's class and requires an independent
        review-breakthrough review at max effort. TASK-20260728-003 ran at review-adversarial and
        resolved a fallback model with model_verified false; IT DISCHARGES RULE 12 FOR NOTHING, and
        says so of itself. RULE 12 IS RECORDED UNDISCHARGED for this closure claim, and the
        conforming re-review is named as a required successor. This is the same undischarged
        obligation the campaign already carries for EXP-GGM-001 and DEC-20260727-007 under
        TASK-20260727-010; it is carried, not cleared.
        SYMMETRY NOTE: DEC-20260728-001's rule_12_branch anticipated only the favourable direction -
        a beta_deg below 0.3 opening a window. The adverse direction closing a gate is the same class
        of claim and gets the same treatment. Recording that symmetry now, rather than only when it
        is convenient, is the point.
    - id: R-10
      title: 'HEUR-001 IS FALSIFIED AS WRITTEN, IN THE FAVOURABLE DIRECTION, AND IT DOES NOT RESCUE THE HYPOTHESIS.'
      text: >-
        HEUR-001 states that a uniformly random target decomposes over the factor base with
        probability tending to 1/5! = 1/120, i.e. success_rate ~ L^5/(120 q) = 0.0086, 0.0075, 0.0086
        at the three sizes. Measured on the main arm: 0.355, 0.246, 0.239 - ratios of 41.1, 32.7 and
        27.9, systematic across all three sizes and all three seeds. HEUR-001's own falsification
        condition ("differing by more than an order of magnitude, consistently across seeds and
        sizes") IS MET, and the heuristic is recorded FALSIFIED AS WRITTEN on the tested scope. The
        cause is identified and elementary: L^5 counts UNSIGNED 5-tuples, while a relation may take
        either sign on each of five summands, and the signed-multiset count C(2L+4, 5) is about
        2^5 = 32 times L^5/5! at these sizes. TWO THINGS THIS IS NOT. It is not adverse to index
        calculus: relations are about 30x MORE common than the heuristic claimed, which is the
        favourable direction for a relation-collection stage. And it does not rescue H-RT1476-001:
        success_rate bears on how many targets decompose, not on how large the backward state is, and
        the gate is entirely about the latter. The corrected statement of the heuristic belongs in a
        SUPERSEDING hypothesis record, not in an edit to the immutable one; exactly one field of
        H-RT1476-001 is changed by this decision and it is `status`.
    - id: R-11
      title: 'WHAT THIS BATCH COST AND WHAT IT BOUGHT, PRICED HONESTLY.'
      text: >-
        BOUGHT: the first measurement ever taken on this gate, on an exact quantity, with a
        one-variable-different positive control, a structureless negative control, a byte-distinct
        27-run set, 3191 certificates re-verified under three implementations, 5 cells re-executed
        byte-identically, and every reported slope independently recomputed to 4.88e-05. That is the
        cleanest run package this repository has produced, and the anti-tautology and control
        machinery BATCH-009 asked for demonstrably held at the source level.
        COST, AND WHAT IT BOUNDS: the main-arm answer was derivable in advance from one paragraph of
        arithmetic (8L^3/3! = (4/3)L^3), one of the two headline exponents was structurally
        determined by a loop, and the second primary metric was blind. 1797 seconds of compute and a
        batch of the campaign's extended budget confirmed an elementary count and diagnosed two dead
        instruments. That is a real result and a modest one; both halves are recorded.
        NOT BOUGHT: nothing about cryptographic-size curves, nothing about ECDLP hardness, no attack,
        no solved discrete logarithm, no cost comparison against rho or BSGS, and no statement about
        any other live record in this ledger.

