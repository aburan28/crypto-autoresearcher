      at most 24 bits - two grades below the threshold on strength alone.
      THE CANDIDATE WAS CONSIDERED AND IS NAMED RATHER THAN IGNORED. The durable content this batch
      produced is not the measurement but the two architecture-level identities it corroborates:
      that the serial-S3 2|3 backward leg reaches 8L^3 signed triples collapsing by 3! to (4/3)L^3,
      hence beta_deg = 3/5 at balanced sizing; and that the declared membership query costs
      L^3(c1 + c2|F|) with |F| = L^2, hence Theta(q), which makes a q^{3/2} threshold unreachable by
      any experiment in this family. Those are scale-free in a way the measurement is not, and they
      are exactly the sort of thing knowledge/findings/ exists for. THEY ARE NOT PROMOTED NOW because
      neither yet exists as a standalone archived derivation note (assigned as SUCC-3 below), neither
      has been checked by a session resolving a different model, and a KN-FIND may never claim a
      stronger basis than its evidence record - which is empirical_only. Promotion becomes available
      to a LATER decision once the derivation note is archived and independently checked; it is not
      back-filled here.
