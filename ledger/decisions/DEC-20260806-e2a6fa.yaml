coordinator_decision:
  id: DEC-20260806-e2a6fa
  goal_id: GOAL-SSI-001
  batch_id: BATCH-284f63
  recorded_by_task: TASK-20260806-e80052
  archived_by: TASK-20260806-e80052

  context: >-
    BATCH-284f63 repaired EXP-SSI-697354 as successor EXP-SSI-9b542d per
    DEC-20260806-a00a28's next_action. The independent red team
    (TASK-20260806-10980e, review-adversarial, independent session)
    confirmed all four required fixes, including the binding one --
    BOUNDARY-CONDITION-GATE is independently verified capable of returning
    a negative about the mathematical object, which the predecessor's
    fourteen assertions entirely lacked. One MODERATE, non-blocking
    documentation defect was found and is recorded as a required follow-up.

  decision: accept_with_required_amendment

  decision_scope: >-
    This decision authorizes execution of one repaired contract. IT DECIDES
    NOTHING ABOUT SSI, SQIsign, OR THE SUPERSINGULAR ISOGENY PROBLEM. No
    hypothesis status moves. No measurement has yet been taken.

  target_ids:
    - EXP-SSI-9b542d
    - EXP-SSI-697354
    - H-SSI-7fe2bf

  evidence_ids:
    - EV-SSI-a42460

  rationale:
    execution_authorization:
      granted: true
      basis: >-
        All four repairs DEC-20260806-a00a28 required are independently
        verified complete by two separate parties (the dispatcher at commit
        6add2958, and TASK-20260806-10980e in an independent session), each
        recomputing the boundary algebra and the BCG-2 negative-control
        residuals by hand rather than trusting the specification's own
        printed tables. The binding defect -- zero of fourteen prior
        assertions capable of failing -- is fixed: BOUNDARY-CONDITION-GATE's
        BCG-2 arm re-runs the check through EXP-SSI-697354's own literal
        rejected formula and both reviewers independently confirmed its
        residual (46.25 bits at NIST-I) is large, non-degenerate, and not a
        manufactured strawman.
      bounded_run_parameters:
        wall_clock_seconds: 600
        maximum_runs: 1
        memory_gb: 2
        note: >-
          Per EXP-SSI-9b542d.budget, unchanged by this decision. A single
          bounded run only. Any expansion requires a new Coordinator
          decision.
      required_amendment_before_citation:
        target: >-
          experiments/EXP-SSI-9b542d/specification.yaml, control
          RG-REPRODUCTION-GATE, field can_this_control_fail, lines 626-632.
        defect: >-
          Asserts "those bands were never actually sensitive to the memory
          term at log2_w=1000 in either formula version." This is factually
          wrong for the superseded formula: at log2_w=1000,
          min(1000, L_mem(P)) clamps to L_mem(P) (max 272.2 across all
          committed rows), so the superseded formula's penalty is exactly
          -0.5*L_mem(P) -- a 46-bit deviation at NIST-I, not zero and not
          insensitive. Independently confirmed by the dispatcher and by
          TASK-20260806-10980e.
        why_not_blocking: >-
          The defect is prose-only. RG-1..5 and BOUNDARY-CONDITION-GATE are
          both correctly specified and both independently verified as
          computed; the wrong claim describes WHY the second control exists,
          it does not weaken either control's actual behavior.
        requirement: >-
          A versioned protocol_amendment (never an in-flight edit to a
          frozen contract) correcting this passage must land and be
          snapshot-committed before any run's output under EXP-SSI-9b542d
          may be cited as evidence in a review-xhigh or review-breakthrough
          context. A bounded Executor run may proceed before the amendment
          lands; its output may not yet be cited as fully reviewed.

    qualification_on_the_fix: >-
      DEC-20260806-a00a28 required "at least one control capable of
      returning a negative." That bar is met. It does not certify the
      roughly dozen controls inherited unmodified from EXP-SSI-697354 as
      object-level-capable; the red team found they remain, as before,
      essentially unreachable-to-fail on the frozen committed data. Any
      future evidence record built on this contract must not cite the
      control set as a whole as fully falsifiable -- only
      BOUNDARY-CONDITION-GATE carries that property, and it is what carries
      it.

  next_actions:
    - >-
      SINGLE NEXT ACTION FOR GOAL-SSI-001: dispatch one bounded Executor run
      of EXP-SSI-9b542d (600s, 1 run, per its own declared budget), followed
      by independent Validator re-derivation of BCG-1/BCG-2 and RG-1..5 from
      the run's raw output -- not from the specification's tables -- per
      docs/task-lifecycle.md. IN THE SAME OR THE FOLLOWING BATCH, file the
      required protocol_amendment correcting RG-REPRODUCTION-GATE's
      can_this_control_fail passage; the amendment must be snapshot-committed
      before the run's output is cited in any review-xhigh or
      review-breakthrough context.
    - >-
      Corrections still owed from DEC-20260806-a00a28, unaffected by this
      decision: EV-WESO-001, EV-SSI-59f7a2 (qualitative only), the
      EXP-WESOVOW-001/cost_model.py defect at its own source, and the
      analysis/SSI-ECDLP-SYNTHESIS-20260803.md margin sentence.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This batch repaired and re-reviewed a contract specification. No
      experiment has yet run; there is no measurement to promote.

  claim_ceiling: >-
    Nothing in this batch or its predecessor may be cited as evidence about
    SSI, SQIsign, or any security margin. A contract is now authorized to
    run under bounded parameters; its output does not exist yet.

  official_research_state_changed: false
  hypothesis_status_transition: none
  experiment_status_transition:
    - id: EXP-SSI-9b542d
      from: approved
      to: approved_execution_authorized
      note: >-
        Bounded to the parameters named above. Supersedes EXP-SSI-697354,
        which stays approved_execution_withheld -- an immutable record, not
        rewritten.
    - id: EXP-SSI-697354
      from: approved_execution_withheld
      to: approved_execution_withheld
      note: >-
        Unchanged. Immutable. Its rejection stands as the documented history
        this repair's BCG-2 control is built to detect.

  asymptotic_promotion_gates:
    gate_1_proof_decomposition: not_applicable
    gate_2_numbered_heuristics: open
    gate_3_concrete_cost_table: open
    gate_4_independent_review_and_red_team: >-
      Passed for the repair itself (accept_with_required_amendment). Not yet
      applicable to any measured result, since none exists.
    note: >-
      No asymptotic-complexity claim is advanced by this batch.

  decided_by:
    task: TASK-20260806-e80052
    role: coordinator
    policy: coordinator-orchestration-code
  decided_at: '2026-08-06'
