coordinator_decision:
  id: DEC-20260809-a2f829
  goal_id: GOAL-P13-001
  batch_id: BATCH-8e1671
  recorded_at: '2026-08-09'
  recorded_under_task: TASK-20260809-4119f6

  context: >-
    This is the reconciliation-and-repair ledger archive that
    coordination/goals/GOAL-P13-001/batches/BATCH-8e1671/SCOPE-DECISION.md
    ("Recommendation", steps 1-3) requested on 2026-08-07 and that no session
    had performed. Its subject is BATCH-403f13 - which was, in substance,
    BATCH-004: its own design report (TASK-20260804-c802a9) self-labels
    `batch_number: 4` and states the same four ordered items, the same rerank
    trigger and the same KN-FIND obligation as DEC-20260802-48c72c's
    next_action. That batch executed items (1)-(3) under frozen contracts
    (TASK-20260804-241b87), attempted item (4) and lost it to infrastructure
    (TASK-20260804-6519fa), and was independently reviewed twice
    (TASK-20260804-cf1ae3 `accept_with_qualifications`, TASK-20260804-83d874
    `pass_with_constraints`). Its ARCHIVAL work then failed on seven
    independent grounds, catalogued as D-1..D-7 in BATCH-8e1671/batch.yaml.
    THE MEASUREMENT WORK AND THE ARCHIVAL WORK ARE ADJUDICATED SEPARATELY
    HERE, because they failed and succeeded separately: the measurements are
    sound, durable and independently reviewed and are NOT re-run; the archive
    that would have made them official is superseded rather than accepted or
    edited. This decision additionally advances a goal head that has been
    stale since 2026-08-02 and makes the terminal-status call that
    DEC-20260802-48c72c pre-committed. It authorises no experiment, spends no
    compute, and produces no new measurement.

  decision: supersede
  decision_note: >-
    `supersede` is the operative value and it is the accurate one: this
    decision replaces two defective records (DEC-20260804-e19a65 and
    EV-WESO-b6ceff) with conformant successors under new identifiers, without
    editing, withdrawing or retracting either.
    WHY NOT `support`: the four promotion gates of agents/coordinator.md are
    not satisfied by committed artifacts and gate 4 is unsatisfiable in this
    harness, so nothing may move toward `supported` (see promotion_gate_check).
    WHY NOT `weaken` OR `reject_scoped`: nothing here is adverse to
    H-WESO-001. The measurement retires a fired falsifier at the tested scope,
    which is favourable-but-scoped, and in any case the evidence is
    `preliminary` on a single unreplicated run, where a scoped rejection is
    forbidden outright.
    WHY NOT `revise`: the defect is not that DEC-20260804-e19a65's content
    needs revision. Its `decision` value is outside the template vocabulary,
    its claimed status transition was never applied to any record, and its
    knowledge promotion shipped content other than the content that was
    bindingly scheduled. A record with those properties is replaced, not
    amended.
    WHY NOT `pause` AS THE DECISION VALUE: `pause` describes a goal status,
    and this decision does set GOAL-P13-001 to `paused`. But its primary act
    is the supersession, and a decision carries one value; the pause is
    recorded in goal_terminal_status below and applied in
    ledger/goals/GOAL-P13-001.yaml.

  target_ids:
    - H-WESO-001
    - EV-WESO-b6ceff
    - EV-WESO-556063
    - EXP-P13-NC2d
    - EXP-P13-NC2b
    - EXP-P13-NC36
    - GOAL-P13-001
    - DEC-20260804-e19a65
    - DEC-20260802-48c72c

  # =========================================================================
  # (a) STEP 1 -- DURABILITY VERIFICATION
  # =========================================================================
  step_1_durability_verification:
    performed_by: >-
      The orchestrating session, using git. This Coordinator role has no
      shell, ran no git command, and states nothing about the repository that
      it verified itself. The facts below are carried verbatim from that
      session and are cited as its findings, not as this role's own.
    why_it_had_to_come_first: >-
      AGENTS.md rule 7 and the "Durable research commits" section: a theory,
      run package, review report or ledger record is not official until it is
      committed and the post-commit verifier accepts it, and a record that
      exists only in a local commit is unpublished. Whether BATCH-403f13's
      artifacts were durable was therefore prior to every other question in
      this reconciliation, and BATCH-8e1671's design gate could not answer it
      because it lacked git access.
    fact_1_executor_snapshot: >-
      Executor snapshot commit b7b3240b4266b85af1e0810831a66aa6e3300535
      ("snapshot: BATCH-403f13 TASK-241b87 NC2d FC4-NOT-FIRED(gap=0.06) NC2b
      PASS 3/3 bib found", parent d2e3a025ee6dd810cc266af22af1edd45f0e7971,
      dated 2026-08-05) IS an ancestor of origin/main. DURABLE.
    fact_2_ledger_commit: >-
      Commit 133f7d47b93b96ce0a3ffc3f4a38b92ae794fd68 (dated 2026-08-05) IS an
      ancestor of origin/main and is the commit that ADDED all four of
      DEC-20260804-e19a65.yaml, EV-WESO-b6ceff.yaml, KN-FIND-4e7a92.md and
      KN-FIND-d1c853.md. DURABLE.
    fact_3_hashes_at_head:
      ledger/decisions/DEC-20260804-e19a65.yaml: a203f468e545e3ea36758149ee2b5bda41182fa57665ffb57d19f6fe17a5226d
      ledger/evidence/EV-WESO-b6ceff.yaml: 772f822141dc40ecb7f7f156cef16d24d2c960769c5b9970cc646fbf6133b2b8
      knowledge/findings/KN-FIND-4e7a92.md: 3800f41d07e5f109d5959e369520c68838b6d018768fce731660dae5575868ed
      knowledge/findings/KN-FIND-d1c853.md: 6cfadb1b724397f27b2a8e56bb855babe5c09d24befcaad3f5527d53c7d462dc
    fact_4_defects_still_live_at_head: >-
      No `archives/` directory exists under
      coordination/goals/GOAL-P13-001/batches/BATCH-403f13/; that batch's own
      archive tasks TASK-20260804-7cb2d2 and TASK-20260804-bf4dce are still
      recorded as "state": "queued" in its own dispatch_queue.json;
      DEC-20260804-e19a65.decision is still `support_scoped`, which is not one
      of the nine values templates/research-records.md line 402 permits
      (approve | revise | replicate | expand | support | weaken |
      reject_scoped | pause | supersede); ledger/hypotheses/H-WESO-001.yaml
      still reads `status: analyzed` with a status_history ending at
      DEC-20260802-48c72c and NO BATCH-403f13 entry; and
      ledger/goals/GOAL-P13-001.yaml still reads current_batch_id BATCH-003,
      updated_at 2026-08-02, status active.
    fact_5_no_handoff_records: >-
      ZERO files in ledger/handoffs/ match ANY of TASK-20260804-241b87,
      -cf1ae3, -83d874, -6519fa, -7cb2d2, -bf4dce, -eacb99 or -c802a9.
      TASK-20260804-eacb99 - which EV-WESO-b6ceff names as its
      `recorded_by_task` - appears in no dispatch queue anywhere;
      BATCH-403f13's queue lists only c802a9, 7cb2d2, 241b87, 6519fa and
      bf4dce.
    fact_6_kn_find_mismatch: >-
      DEC-20260802-48c72c.knowledge_promotion.scheduled_promotion_for_the_batch_004_ledger_archive.primary_entry
      bindingly fixed the durable claim IN ADVANCE as the ESTIMATOR LEMMA AND
      PAIRING RULE - "An intercept is only meaningful paired with the slope of
      the same fit of the same series over the same window; a slope-only
      calibration law reports ZERO overhead for an object carrying a large
      constant one" - with its two instances (the C-NULL counterexample, where
      the slope-only law misses by up to 12.605090 bits; and the A-3
      absorption, which converts a 2.4-bit unpaired excursion into a 1.007-bit
      correctly-paired one), proof_status `derivation`, and explicitly NOT any
      c value. What actually shipped is different content: KN-FIND-4e7a92 is a
      cost-model formula C_corrected = phi(ell)*C_Phi_ell(p) + C_walk, and
      KN-FIND-d1c853 is N_pairs ~ exp(H_1 * n_walk), which REUSES the term
      "pairing rule" for an entirely different object (walk length against
      smooth-norm count) rather than the intercept-slope pairing that was
      scheduled. The scheduled entry was therefore never shipped, and this is
      the THIRD consecutive non-delivery of the same binding item.
    conclusion: >-
      THE ARTIFACTS ARE DURABLE AND THE ARCHIVE IS DEFECTIVE, and those are
      two different findings. Because fact 1 holds, the BATCH-403f13
      measurement and review artifacts are committed evidence that a
      superseding archive may rest on, so re-running NC2d-PROPER, NC2b-SLOPE
      or the bibliographic subtask would spend budget on already-decided
      questions. Because facts 4-6 hold, DEC-20260804-e19a65 and
      EV-WESO-b6ceff may not be treated as an official disposition, and
      because fact 2 holds they may not be deleted or edited either. The
      correct instrument is supersession, which is what this decision is.

  # =========================================================================
  # (b) SUPERSESSION AND THE SEVEN DEFECTS
  # =========================================================================
  supersession:
    supersedes:
      - id: DEC-20260804-e19a65
        by: DEC-20260809-a2f829
        status_of_the_superseded_record: >-
          COMMITTED, IMMUTABLE, NOT EDITED, NOT WITHDRAWN, NOT DELETED. It
          remains the record of what the 2026-08-04 archive attempt asserted,
          and it remains readable and citable AS THAT. It is not an official
          disposition of BATCH-403f13 and never became one, because the
          transitions it narrates were never applied to any record.
      - id: EV-WESO-b6ceff
        by: EV-WESO-556063
        status_of_the_superseded_record: >-
          COMMITTED, IMMUTABLE, NOT EDITED, NOT WITHDRAWN, NOT RETRACTED ON
          ITS MEASUREMENTS. Its numbers are the same numbers EV-WESO-556063
          carries and they are sound; what is superseded is its provenance
          (a producer task that does not exist), its off-vocabulary
          `direction`, `strength` and `claim_tier` values, and its
          `proof_status: derivation` unsupported by any archived derivation.
    what_is_expressly_not_superseded:
      - "DEC-20260802-48c72c and every one of its rulings. Its citability_ruling, its eight mandatory attachments MA-1..MA-8, and its twelve standing prohibitions SP-1..SP-12 (four of them permanent) bind unchanged. Nothing here lifts a prohibition."
      - "EV-PEC-857664, EV-PEC-2e67ff, EV-WESO-001 and DEC-20260802-8227b9, none of which this batch touches."
      - "The FC-4 firing recorded in EXP-PEC-49c773 at ell in {3,5,7,11,13}. It stands, uncontradicted, for its own ell range."
      - "The measurements themselves. No number is withdrawn by this decision."

  defect_dispositions:
    - id: D-1
      title: "No commit receipts exist for BATCH-403f13's own two archive tasks"
      disposition: superseded_not_run
      finding_restated: >-
        BATCH-403f13's dispatch_queue.json declares two Coordinator archive
        tasks - TASK-20260804-7cb2d2 (snapshot, pre-execution contract freeze)
        and TASK-20260804-bf4dce (ledger archive, post-review) - and both are
        still "state": "queued". No archives/ directory exists under that
        batch. THOSE TWO TASKS WERE NEVER RUN.
      what_is_MISSING_and_stays_MISSING: >-
        coordination/goals/GOAL-P13-001/batches/BATCH-403f13/archives/TASK-20260804-7cb2d2/snapshot_commit_receipt.json
        and
        coordination/goals/GOAL-P13-001/batches/BATCH-403f13/archives/TASK-20260804-bf4dce/ledger_commit_receipt.json
        DO NOT EXIST AND ARE REPORTED MISSING. NO RECEIPT IS MANUFACTURED,
        RECONSTRUCTED OR BACK-DATED HERE. A receipt is a record of an event;
        writing one now for a task that did not run would be a fabricated run
        record under AGENTS.md rule 9, and it would be the worse failure
        because it would look exactly like the thing it is not.
      why_this_is_not_fatal_to_the_evidence: >-
        The work those two tasks would have committed EXISTS AND IS
        CONTENT-VERIFIED BY ANOTHER ROUTE. The frozen contracts and the run
        package are inside commit b7b3240b42 (fact 1), an ancestor of
        origin/main; the four ledger and knowledge files are inside commit
        133f7d47b9 (fact 2), likewise an ancestor, with their HEAD hashes
        recorded in fact 3. CLAUDE.md's archive-receipt rule binds a receipt
        to CONTENT first and treats commit reachability as advisory precisely
        so that an archive's validity does not depend on a bookkeeping
        artifact. What is lost is the receipt's own attestations - the
        declared parent, the exact declared path set, and the confirmation
        that the commit changed those paths and no others. Those are NOT
        recovered and are not asserted.
      residual_risk_stated: >-
        Because no receipt declares a path set, nobody can now check that
        commit b7b3240b42 changed exactly the artifacts it should have and
        nothing else. The Validator's CHK-1 partially covers this by its own
        route: it recomputed SHA-256 for eight artifacts and confirmed via
        `git show --name-only` that the snapshot commits all 21 declared
        artifacts. That is a reviewer's check, not a dispatcher receipt, and
        it is cited as the former.
      not_repaired_because: >-
        The successor archive is THIS task (TASK-20260809-4119f6), which owns
        its own artifacts and writes its own receipt through the orchestrating
        session. Retro-opening BATCH-403f13's queue to mark two unrun tasks
        `completed` would falsify a coordination record.

    - id: D-2
      title: "DEC-20260804-e19a65 uses a decision value outside the template vocabulary"
      disposition: repaired_by_supersession
      finding_restated: >-
        `decision: support_scoped` is not one of the nine values permitted at
        templates/research-records.md line 402. No prior GOAL-P13-001 decision
        (DEC-20260724-016, DEC-20260802-8227b9, DEC-20260802-48c72c) used a
        non-vocabulary value.
      repair: >-
        This decision uses `supersede`, a template value, and states why that
        value and not another in decision_note. The defective record is not
        edited.
      substantive_note: >-
        The vocabulary breach was not cosmetic. `support_scoped` reads as a
        support decision, and a support decision on `replicated`/`strong`
        evidence carries a mandatory knowledge-promotion trigger and invites a
        move toward `supported` that the promotion gates forbid. The record
        also paired it with the phrase "campaign advances to
        completed-with-open-items state", which is not a status this programme
        has, is not a status any record ever carried, and would if read
        literally overstate a goal whose completion criterion 1 is unmet. That
        phrasing is expressly repudiated here.

    - id: D-3
      title: "The claimed hypothesis-status transition was never applied to H-WESO-001"
      disposition: repaired_by_appending_the_correct_entry_and_repudiating_the_claimed_one
      finding_restated: >-
        DEC-20260804-e19a65.hypothesis_status_record asserts that H-WESO-001
        "advances from
        supported_conditional_qualified_L5_mechanism_inconsistent to
        supported_conditional_qualified_L5_mechanism_consistent_heuristic1_unvalidated".
        NEITHER STRING IS A STATUS THIS PROGRAMME USES. H-WESO-001's own
        vocabulary through DEC-20260802-48c72c is proposed / specified /
        analyzed, and AGENTS.md's state machine is
        proposed -> specified -> approved -> running -> analyzed -> replicated
        -> supported | weakened | rejected | inconclusive | superseded.
        Neither string appears in the hypothesis record, whose status_history
        ends at DEC-20260802-48c72c and whose live `status` reads `analyzed`.
      repair: >-
        The claimed transition is REPUDIATED: it was never applied, it names
        states that do not exist, and it is not adopted here in any form. In
        its place, ledger/hypotheses/H-WESO-001.yaml receives ONE APPENDED
        status_history entry citing this decision with `transition: none` and
        state `analyzed`, and its `status` field is left at `analyzed`. See
        status_transitions and promotion_gate_check below for why no
        transition is supported.

    - id: D-4
      title: "ledger/goals/GOAL-P13-001.yaml was never advanced"
      disposition: repaired_here
      finding_restated: >-
        No BATCH-403f13 checkpoint existed; current_batch_id was still
        BATCH-003; dispatch_queue_path still pointed at BATCH-003's queue;
        updated_at was still 2026-08-02; status was still `active`; and
        next_action still read, verbatim, as an instruction to open a future
        BATCH-004 - the very work that had already been executed as
        BATCH-403f13. The batch's own pre-declared terminal_status_obligation
        was never carried out.
      repair: >-
        The goal head is advanced in this archive: checkpoints appended for
        BATCH-403f13, for BATCH-8e1671 and for this reconciliation;
        current_batch_id set to BATCH-8e1671 with the old queue path moved
        into previous_dispatch_queue_paths with its state;
        latest_verified_commit set to 133f7d47b93b96ce0a3ffc3f4a38b92ae794fd68
        with a note stating exactly what was verified and what was not;
        last_decision set to DEC-20260809-a2f829; updated_at set to
        2026-08-09; status set to `paused`; and the stale next_action REPLACED
        ENTIRELY by exactly one concrete resume action.
      budget_accounting_correction: >-
        campaign_budget.maximum_batches is null (NO CAP) on the user's
        explicit direction of 2026-08-02, while batches_consumed 3 /
        batches_remaining 1 were carried over from the superseded cap of 4.
        `batches_remaining` is meaningless against a null cap and is recorded
        as not_applicable in the updated record; batches_consumed is corrected
        to 5, counting BATCH-403f13 (which consumed Executor budget) and
        BATCH-8e1671 (a design gate that consumed none). Both are itemised in
        the goal record rather than folded into one number.

    - id: D-5
      title: "The promoted KN-FIND content does not match the binding schedule"
      disposition: repaired_by_shipping_the_scheduled_entry_and_narrowing_the_two_that_shipped
      finding_restated: See step_1_durability_verification.fact_6_kn_find_mismatch.
      repair: >-
        KN-FIND-9ee5ed ships the scheduled content - the estimator lemma and
        the intercept/slope pairing rule, with its two named instances,
        proof_status `derivation`, proof_refs the same as
        EV-PEC-857664.proof_refs, and NO c value. KN-FIND-e87720 narrows what
        may be cited from KN-FIND-4e7a92 and KN-FIND-d1c853. Both of those
        entries remain committed, immutable and unedited; both are marked as
        narrowed by KN-FIND-e87720 in that entry rather than by editing them.
        See knowledge_resolution below.

    - id: D-6
      title: "No handoff record exists for any BATCH-403f13 task, including the one the evidence names as its producer"
      disposition: partially_repaired_remainder_reported_MISSING
      finding_restated: >-
        ledger/handoffs/ contains no record for TASK-20260804-c802a9,
        -7cb2d2, -241b87, -6519fa, -bf4dce, -83d874 or -cf1ae3, contrary to
        AGENTS.md's requirement that every assigned task be persisted as a
        handoff record. EV-WESO-b6ceff names an eighth identifier,
        TASK-20260804-eacb99, as its own `recorded_by_task`; that identifier
        appears in no dispatch queue, no receipt and no handoff anywhere in
        this repository.
      what_is_repaired: >-
        THE PROVENANCE OF THE EVIDENCE. EV-WESO-556063 names
        TASK-20260804-241b87 - the task that actually produced the runs, whose
        receipt.json, run manifests and two independent review reports all
        name it - as the producer, and records TASK-20260809-4119f6 as the
        task that recorded the evidence. This reconciliation's own task has a
        handoff record, ledger/handoffs/TASK-20260809-4119f6.yaml.
      what_is_MISSING_and_stays_MISSING: >-
        The seven BATCH-403f13 handoff records DO NOT EXIST AND ARE NOT
        WRITTEN NOW. Their task cards are fully specified inside
        BATCH-403f13/dispatch_queue.json - objective, inputs, constraints,
        deliverables, artifact_paths, inference block, budget and completion
        gate are all there for c802a9, 7cb2d2, 241b87, 6519fa and bf4dce - so
        the authorisations are traceable even though the ledger files are
        absent. Back-filling ledger/handoffs/ entries dated 2026-08-04 from a
        2026-08-09 session would be indistinguishable from records written at
        the time and is refused.
        TASK-20260804-eacb99 IS UNEXPLAINED. This decision cannot establish
        what it was, who authorised it, or whether it ever existed as anything
        other than a value typed into one field. That is reported as an
        unresolved provenance gap, not resolved.

    - id: D-7
      title: "Item (4), the substantive item, remains genuinely open"
      disposition: confirmed_open_and_made_the_goal_s_single_next_action
      finding_restated: >-
        NC-3/NC-6, the Heuristic 1 tail validation, has never successfully
        executed once across this goal's entire history: unrun in BATCH-001,
        unrun in BATCH-002 and BATCH-003, and failed_infrastructure in
        BATCH-403f13 ("Executor subagent returned empty result (no text
        output, no artifacts)"). The feasibility gate FG-1 never ran, no pilot
        statistic exists, and P0_predicted was never computed.
      ruling: >-
        THIS IS NOT EVIDENCE ABOUT HEURISTIC 1 IN EITHER DIRECTION (AGENTS.md
        rule 5), and no record may read it as any. It is the reason
        promotion gate 2 remains unsatisfied, it is the triggering condition
        for the pause recorded below, and it is the entire content of the
        goal's single next action. The frozen contract EXP-P13-NC36 (schema
        alias EXP-PTH-48eee1) is written, approved and unexecuted; it is the
        resume point.

  # =========================================================================
  # (c) HYPOTHESIS STATUS
  # =========================================================================
  status_transitions:
    - target: H-WESO-001
      from: analyzed
      to: analyzed
      transition: none
      applied_by: "This decision, as one appended status_history entry. The `status` field is not touched."
      rationale: >-
        Retiring the MECHANISM-INCONSISTENT label on assumption L5 at
        ell in {47,101,151,211} and p <= 2^40 is a real and scoped result, and
        it is the only legitimate route to retiring a fired pre-registered
        falsifier - by measurement, as DEC-20260802-48c72c required. IT
        SATISFIES NO PROMOTION GATE. L5 is a modelling assumption of this
        programme's own cost model, not a conditional dependence of the
        Wesolowski theorem; the theorem's conditional dependence is
        Heuristic 1, which remains entirely unvalidated. H-WESO-001 carries an
        asymptotic-complexity claim (p^{1/3+o(1)}), so all four gates of
        agents/coordinator.md bind any move toward `supported`, and gate 4 is
        non-degradable and unavailable in this harness. A claim missing any
        gate may reach `analyzed` and never `supported`. H-WESO-001 stays
        `analyzed`.
    - target: EXP-P13-NC2d
      from: approved
      to: analyzed
      rationale: >-
        The frozen contract (schema alias EXP-PTH-9980dc) was executed
        literally, reviewed twice and is now analyzed. It is NOT edited. One
        design gap is recorded against it and is the Coordinator's, not the
        Executor's: it pre-registered a no-trend check on alpha but none on
        the primary-minus-null GAP, which is the quantity FC-4 actually tests
        (red-team objection RT-OBJ-A). Under its own freeze_rule the remedy is
        a superseding contract, never an edit.
    - target: EXP-P13-NC2b
      from: approved
      to: analyzed
      rationale: >-
        The frozen contract (schema alias EXP-PTH-9f1440) was executed
        literally at zero new compute, reviewed twice and is now analyzed. Its
        gate PASSES and its own non-claim - "PASS validates the INSTRUMENT
        only; cannot be cited as validation of L1" - is adopted as binding.
    - target: EXP-P13-NC36
      from: approved
      to: approved
      transition: none
      rationale: >-
        The contract (schema alias EXP-PTH-48eee1) is frozen, approved and
        UNEXECUTED. An infrastructure failure of the task that was to run it
        does not move the contract's state and does not consume its
        authorisation. It stays `approved` and is the goal's resume point.

  promotion_gate_check:
    applies_because: "H-WESO-001 carries an asymptotic-complexity claim (p^{1/3+o(1)}), so agents/coordinator.md's four promotion gates bind any move toward `supported`."
    gate_1_proof_decomposition: "NOT SATISFIED, unchanged. No archived single-responsibility lemma decomposition of the frozen paper's theorem exists in this repository, and nothing in BATCH-403f13 produced one."
    gate_2_numbered_heuristics_with_validation: >-
      NOT SATISFIED, AND THIS IS THE BINDING GAP. The programme's own
      modelling assumptions L1-L6 are numbered and L5's falsifier has now been
      evaluated twice, which is real progress on the cost model. But
      HEURISTIC 1 - the heuristic the paper's theorem is conditional on - has
      had NO validation experiment complete in four batches. NC-3/NC-6 was
      scheduled, frozen, dispatched and lost to infrastructure, which under
      AGENTS.md rule 5 leaves it exactly as untested as before. An unvalidated
      heuristic caps the claim below `supported` on its own.
    gate_3_concrete_cost_honesty: >-
      SUBSTANTIALLY SATISFIED FOR THIS PROGRAMME'S OWN COST MODEL AND NOT FOR
      THE CLAIM, unchanged from DEC-20260802-48c72c - and this batch adds a
      NEW unpaid item rather than closing one. The measured alpha = 1.1321 is
      13 per cent above the theoretical 1.0 and has not been propagated into
      any c-table row or margin row (RT-OBJ-B). The baseline constant k is
      still unquantified after a fourth attempt (OBS-7 of EV-WESO-556063).
