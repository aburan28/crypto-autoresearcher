  # =========================================================================
  # (d) THE KN-FIND QUESTION, RESOLVED
  # =========================================================================
  knowledge_resolution:
    the_question: >-
      DEC-20260802-48c72c bindingly scheduled one KN-FIND for the BATCH-004
      ledger archive and fixed its content in advance. Two KN-FIND entries
      shipped in that slot carrying different content. What is the disposition
      of all three?
    ruling_1_ship_the_scheduled_entry: >-
      KN-FIND-9ee5ed IS THE SCHEDULED ENTRY AND IT SHIPS HERE. Its content is
      not chosen by this decision: it was fixed on 2026-08-02 by
      DEC-20260802-48c72c.knowledge_promotion.scheduled_promotion_for_the_batch_004_ledger_archive.primary_entry,
      down to the durable claim, the two instances, proof_status `derivation`,
      the proof_refs (the same as EV-PEC-857664's), and the explicit
      exclusion of any c value. It is reproduced faithfully. NO NEW
      MATHEMATICS IS INVENTED FOR IT and no c value appears in it.
    ruling_2_narrow_the_two_that_shipped: >-
      KN-FIND-4e7a92 AND KN-FIND-d1c853 ARE NARROWED, NOT DELETED AND NOT
      EDITED. Both were added by commit 133f7d47b9 (fact 2) and are immutable.
      KN-FIND-e87720 records what may still be cited from them - the L5 alpha
      measurement at ell in {47,101,151,211} at p <= 2^40 with FC-4 not fired,
      which is real and independently reviewed - and what may not, and records
      that neither is the entry DEC-20260802-48c72c scheduled.
    ruling_3_the_reused_term: >-
      KN-FIND-d1c853's title and body call N_pairs ~ exp(H_1 * n_walk) "the
      pairing rule". THAT IS NOT THE PAIRING RULE THE SCHEDULE NAMED. The
      scheduled pairing rule is an ESTIMATOR discipline - an intercept is
      meaningful only paired with the slope of the same fit of the same series
      over the same window - and it is what converts A-3 from a 2.4-bit
      unpaired excursion outside the published bracket into a 1.007-bit
      correctly-paired one inside it. The two objects share a word and nothing
      else. A corpus in which one phrase denotes two unrelated objects is a
      corpus that will be miscited, so the collision is named explicitly in
      both KN-FIND-9ee5ed and KN-FIND-e87720.
    ruling_4_what_this_decision_does_not_decide: >-
      Whether the two shipped entries' mathematics is CORRECT is not
      adjudicated here. See open_items OI-1. This decision narrows their
      citable scope on provenance grounds - they are not the scheduled
      content and their formulas do not appear in the run artifacts, the
      validation report or the red-team report of the batch they cite - and
      stops there.
    index_note: >-
      knowledge/INDEX.md is NOT written or staged by this archive. It is
      `.gitignore`d and rebuilt on demand (CLAUDE.md, "Generated artifacts are
      never committed"; .gitignore line 134), so the /curate-knowledge
      convention that the entry and the regenerated index ship together is
      satisfied by the index being derived from the entries rather than by
      committing a copy of it. This is a deliberate departure from the literal
      wording of DEC-20260802-48c72c's binding_requirement_on_the_batch_004_task_card,
      which predates that gitignore rule, and it is flagged here rather than
      silently done.

