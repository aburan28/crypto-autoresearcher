    the_second_pause_condition_also_stands: >-
      DEC-20260802-48c72c already recorded that pause condition 2 ("the
      empirical calibration cannot be brought below the irreproducibility
      band within the campaign budget") is TRIGGERED FOR COMPLETION CRITERION
      1 SPECIFICALLY, on a method-ceiling argument. That finding is unchanged
      and BATCH-403f13 did not address it. It is not the trigger cited above
