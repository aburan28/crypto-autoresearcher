  # =========================================================================
  # (g) OPEN ITEM -- NOT ADJUDICATED HERE
  # =========================================================================
  open_items:
    - id: OI-1
      status: SUSPECTED_DEFECT_NOT_ADJUDICATED
      routed_to: "an independent reviewer (review-adversarial, independent session), NOT this Coordinator"
      title: "KN-FIND-4e7a92's gloss of phi(ell) may conflate Euler's totient with a root count"
      what_the_entry_says: >-
        KN-FIND-4e7a92 writes the corrected cost estimator as
        C_corrected = phi(ell)*C_Phi_ell(p) + C_walk and glosses
        "phi(ell) = ell - 1 (number of distinct roots of Phi_ell counted with
        multiplicity in the supersingular case)".
      why_it_is_suspected: >-
        The classical modular polynomial Phi_ell(j, Y) has degree ell + 1 in
        Y, and the ell-isogeny graph on supersingular j-invariants is
        (ell + 1)-regular, so the natural root count at a supersingular
        j-invariant is ell + 1 rather than ell - 1. The symbol phi and the
        value ell - 1 are together the standard notation for Euler's totient
        at a prime, which is a different object from a root count. The gloss
        also attaches "distinct" and "counted with multiplicity" to the same
        quantity, which are different counts. CORROBORATING BUT NOT
        DECIDING: the BATCH-403f13 red-team report's own OBJ-4 reads
        n_distinct_roots = ell+1 or ell+2 off raw-result.json and states that
        for supersingular curves with p = 3 mod 4 all ell-isogenies are
        defined over F_p and entries = ell + 1. That is a reviewer's reading
        of a different run's artifact, cited as such.
      what_this_coordinator_does_and_does_not_do: >-
        DOES: name the item, state it as SUSPECTED, and route it. DOES NOT:
        adjudicate it. Deciding whether a formula in the corpus is
        mathematically wrong is a review act on a mathematical claim, and this
        role neither originated nor reviewed that formula. Asserting the
        defect settled would be exactly the overreach this reconciliation
        exists to correct. Asserting the formula sound would be worse.
      why_it_does_not_change_the_disposition_of_D_5: >-
        KN-FIND-4e7a92's claim is narrowed by KN-FIND-e87720 on PROVENANCE
        grounds that stand whatever the answer to OI-1 turns out to be: it is
        not the content DEC-20260802-48c72c scheduled, and its formula does
        not appear in the run artifacts, the validation report or the
        red-team report of the batch it cites. OI-1 is a FURTHER and
        independent reason for that narrowing, and it is recorded in
        KN-FIND-e87720 as an open item rather than as a finding.
      what_would_resolve_it: >-
        An independent reviewer who did not originate the entry checks the
        degree of Phi_ell in Y and the regularity of the supersingular
        ell-isogeny graph against a cited source, states whether the gloss is
        wrong, and if it is, whether the error propagates into anything that
        was ever cited downstream. If it is wrong, the remedy is a superseding
        knowledge entry under a new id - never an edit to KN-FIND-4e7a92.
    - id: OI-2
      status: UNRESOLVED_PROVENANCE_GAP
      title: "TASK-20260804-eacb99 is unexplained"
      text: >-
        EV-WESO-b6ceff names TASK-20260804-eacb99 as its own recorded_by_task.
        That identifier appears in no dispatch queue, no receipt and no
        handoff in this repository. This decision repairs the evidence's
        provenance by superseding the record; it does NOT establish what
        eacb99 was or whether it existed. Reported as a gap.
    - id: OI-3
      status: MISSING_CONTROL
      title: "The primary-minus-null gap has no trend control"
      text: >-
        Carried from red-team objection RT-OBJ-A. The gaps at ell = 151 and
        211 are 0.0894 and 0.0877, about 59 per cent of the 0.15 threshold,
        against about 0.03 at ell <= 101. The pre-registered no-trend check
        constrains alpha_primary against log2(ell) and PASSES; it does not
        constrain the gap. Whether the gap crosses 0.15 above ell = 211 is
        UNMEASURED, and the scope statement of EV-WESO-556063 is bounded at
        ell = 211 for that reason. This is a live successor control, not a
        closed question.

  rationale:
    - >-
      The measurement work and the archival work failed and succeeded
      separately, so they are adjudicated separately. Redoing NC2d-PROPER,
      NC2b-SLOPE or the bibliographic subtask would duplicate work that was
      executed under contracts frozen before any datum, snapshot-archived into
      a commit that is an ancestor of origin/main, and independently reviewed
      by a Validator and a Red Team who between them recomputed every gating
      number and raised no execution defect. Spending budget to re-answer
      those questions is the failure mode the Coordinator's own decision
      checklist forbids at question 1.
    - >-
      Equally, an archive with a non-vocabulary decision value, a narrated
      status transition that was never applied to any record, a producer task
      that does not exist, and a knowledge promotion of content other than the
      content bindingly scheduled is not made official by the fact that it is
      committed. Rule 7 makes commitment necessary, not sufficient.
    - >-
      Supersession rather than repair-in-place is not a formality. AGENTS.md
      rule 4 makes records immutable, and CLAUDE.md forbids resolving a
      conflict inside a record by editing it. Both defective records are
      ancestors of origin/main; editing them would break every archive that
      binds their hashes, including the schema-supersession registry entry
      that pins EV-WESO-b6ceff at
      772f822141dc40ecb7f7f156cef16d24d2c960769c5b9970cc646fbf6133b2b8.
    - >-
      The two missing archive receipts are reported MISSING rather than
      written. This is the single most tempting repair in this task and the
      one that would do the most damage: a receipt is a record that an event
      occurred and was verified, so writing one for a task that never ran
      converts a visible gap into an invisible falsehood. The gap is instead
      covered as far as it honestly can be - by content verification of the
      commits that exist - and the residual is stated.
    - >-
      The hypothesis does not move because nothing in this batch bears on any
      promotion gate. Retiring MECHANISM-INCONSISTENT on L5 improves this
      programme's own cost model at a toy/medium scale; the theorem's
      conditional dependence is Heuristic 1, and Heuristic 1 has never been
      tested. Moving a status on the strength of a favourable result about a
      different quantity is how a conditional claim becomes an unconditional
      one by accident.
    - >-
      The KN-FIND obligation is discharged rather than deferred a fourth time.
      Its content was fixed in advance precisely so that it could not drift,
      and reproducing that fixed content is the whole of what discharging it
      requires. Shipping different content in the same slot did not discharge
      it; it created a second problem, which KN-FIND-e87720 addresses.
    - >-
      The terminal status is the one the goal pre-committed to, chosen on the
      evidence available and not on the evidence one would like. `paused` is
      claimed because a named infrastructure blocker stands in front of the
      next approved task; `closed_at_budget` is declined because neither
      budget axis can be shown exhausted; `completed` is forbidden because
      criterion 1 is unmet on the numbers. The suspension of the closure
      quorum makes `completed` reachable in general and changes nothing here,
      because the obstacle was never the quorum.
    - >-
      OI-1 is raised and not answered. An honest reconciliation reports what
      it noticed even when it has no authority to settle it, and this
      Coordinator has no standing to adjudicate the mathematics of an entry it
      neither wrote nor reviewed. Recording it as SUSPECTED and routing it is
      the whole of what is available; recording it as settled in either
      direction would be a fabrication.

