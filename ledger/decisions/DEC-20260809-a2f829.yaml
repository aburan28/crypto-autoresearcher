      IT IS NOT ESTABLISHED. The orchestrating session did not establish it,
      this role cannot compute it, and the per-run figures that are on record
      (791.751 s for RUN-PEC-49c773-a; 42.0 s for TASK-20260804-241b87, of
      which 39.142 s and 0.010 s are the two runs) are run times, not campaign
      wall clock, and summing them would understate a campaign by an unknown
      amount. IT IS REPORTED AS NOT ESTABLISHED RATHER THAN ASSERTED IN EITHER
      DIRECTION, and `closed_at_budget` is therefore unavailable on the
      evidence.
    the_triggering_pause_condition: >-
      THE THIRD ONE: "A definitive infrastructure or dependency blocker
      prevents the next approved task." The next approved task is NC-3/NC-6
      against the frozen contract EXP-P13-NC36. It failed at infrastructure in
