      slot. The lesson is not a wider write_scope; it is that a pre-registered
      content specification is only worth what the delivering task's
      completion gate checks. This task's completion gate checks it by name.
    second_promoted_entry: >-
      KN-FIND-e87720 is not part of the schedule and is created by this
      decision. It exists because two entries were promoted into the corpus
      whose content was neither scheduled nor visibly traceable to the run
      they cite. Leaving them in the corpus unqualified would let a fresh
      agent read them as this programme's promoted findings about the
      Wesolowski cost model, which they are not. It narrows what may be cited
      from them to what committed evidence actually supports, records that
      neither is the scheduled entry, records the reused-term collision on
