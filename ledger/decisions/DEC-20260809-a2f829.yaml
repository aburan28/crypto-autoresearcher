      `closed_at_budget` asserts that the campaign budget ran out. THIS
      DECISION CANNOT ASSERT THAT, on either axis.
      (i) BATCH COUNT: campaign_budget.maximum_batches is null - NO CAP - set
      that way on the user's EXPLICIT DIRECTION of 2026-08-02 ("remove this in
      the harness maximum_batches: 4"). A campaign with no batch cap cannot
      close at a batch budget, and the residual `batches_remaining: 1` is an
      artifact of the superseded cap of 4, not a live allowance.
      (ii) WALL CLOCK: campaign_budget.total_wall_clock_seconds is 21600 and
