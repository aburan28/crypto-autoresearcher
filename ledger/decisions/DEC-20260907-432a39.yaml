coordinator_decision:
  id: DEC-20260907-432a39
  recorded_at: '2026-09-07'
  context: >-
    RUN-RELN-f202be-N14 and RUN-RELN-f202be-N16 (executed under handoff
    TASK-20260906-16e62c against the approved contract EXP-RELN-f202be,
    per DEC-20260906-0b4030) both completed to their contractual terminal
    state but classified INSTRUMENT_FAILURE_NO_VERDICT: the frozen
    forced_negation_gap_trap_control's absolute 0.1 tolerance was exceeded
    on 23 of 72 object cells, concentrated at these two smallest rungs
    (B_1=48, 74). Rungs 18 and 20 (B_1=118, 186) passed every control
    cleanly. The measured deviation is small, of consistent sign, and
    shrinks monotonically in relative terms as B_1 grows, matching the
    finite-size correction of order m/B_1 that the hypothesis's own
    candidate_invariants (INV-2doubleprime / INV-A3) already name --
    INV-1 and INV-2 accounting passed with zero deviation and the
    spectral cross-check agreed exactly in every affected cell, so this
    reads as a miscalibrated tolerance rather than an implementation
    defect. The user was asked (AskUserQuestion) how to proceed among:
    amend and rerun the small rungs, accept a partial verdict from the two
    large rungs only, proceed to the other two RQ-RELN-61638a contracts
    regardless, or stop and file as inconclusive. The user chose "Amend
    tolerance, rerun small rungs (recommended)".
  decision: revise
  target_ids:
    - EXP-RELN-f202be
    - H-RELN-41562a
  rationale:
    - >-
      Approves protocol_amendment v1 (experiments/EXP-RELN-f202be/amendments/v1.yaml),
      version_from 1 to version_to 2: the forced_negation_gap_trap_control's
      tolerance changes from a fixed absolute 0.1 to
      max(0.1, 3*(m/B_1)*(B_1^3/(4M))), m=3. The amendment's validation
      table (computed from the already-recorded measured/expected values in
      every affected run's curve_results.json, not from new data) shows the
      amended formula clears the worst observed cell at every one of the
      four rungs with 40-50% margin, and is INERT at rungs 18/20 where the
      0.1 floor was already the binding, satisfied constraint.
    - >-
      This is a tolerance-formula repair, not a scientific finding: it
      changes what counts as a passing forced-gap CONTROL (an instrument
      calibration), not the frozen success_criterion or falsification_criterion
      that decide NULL vs ALIVE on the dispersion index Delta itself, and it
      does not touch any other control.
    - >-
      RUN-RELN-f202be-N14 and N16 are not edited and not re-scored; they
      stand exactly as recorded (instrument_failed, per AGENTS.md rules 2
      and 4). A re-analysis under new run identifiers is authorized, per the
      amendment's reanalysis_authorization clause, either by full
      re-execution (deterministic, expected to reproduce bit-for-bit) or by
      re-deriving the classification from the existing immutable records
      with the source run and its hash cited.
  evidence_refs:
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-N14/curve_results.json
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-N16/curve_results.json
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-N18/curve_results.json
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-N20/curve_results.json
    - experiments/EXP-RELN-f202be/runs/RUN-RELN-f202be-stage4/control-verdicts.json
    - ledger/hypotheses/H-RELN-41562a.yaml
  limitations:
    - >-
      This decision authorizes the tolerance amendment and a re-analysis
      run. It does not itself classify the run set NULL, ALIVE, or
      INCONCLUSIVE -- that classification is produced by the re-analysis and
      still requires the contract's later_review_requirements (independent
      validator blind re-derivation, red-team attack on the band and
      convention choices, review-adversarial at xhigh) before it backs any
      claim or promotes H-RELN-41562a.
    - >-
      The amended tolerance's specific safety margin (3x the named m/B_1
      scale) was chosen after the affected data was already visible, as the
      amendment itself discloses; it is a defensible engineering margin, not
      a first-principles derivation of the exact next-order correction term
      (which the amendment shows depends on a base-geometry-specific
      quantity with no available closed form).
    - >-
      This decision does not approve, alter, or bear on EXP-RELN-82f487 or
      EXP-RELN-141a86.
  next_actions:
    - >-
      Dispatch the executor to implement the amended tolerance formula and
      produce a re-analysis of rungs 14 and 16 under new run identifiers,
      then a combined stage4 re-analysis over all four rungs, per the
      amendment's reanalysis_authorization.
    - >-
      After the re-analysis returns a classification, run the contract's
      later_review_requirements before any claim-changing use, and only then
      proceed to approve and dispatch EXP-RELN-82f487 and EXP-RELN-141a86
      per the user's "in dependency order" instruction, since both consume
      this battery's outputs.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      This is a protocol-amendment approval, not an evidence-review
      decision; no scientific classification has been produced yet.
  decided_by: coordinator
  decided_at: '2026-09-07'
