coordinator_decision:
  id: DEC-20260905-7c2ad9
  context: >-
    A dispatched coordinator subagent drafted H-MONO-39b1f0 claiming
    IDEA-20260807-5126f4's own falsification condition (a) was already
    decided by EXP-MONO-805a02 Stage 5's existing evidence, at zero new
    compute, and drafted a companion KN-FIND (KN-FIND-9be274) promoting
    that claim. Neither had been archived. Because the claim rested on a
    novel inferential chain (an argument-count identity connecting an
    old measurement to a new idea's own locus) rather than a purely
    mechanical fact, the orchestrating Coordinator dispatched an
    independent review round (review_plan TASK-20260905-153d93,
    Validator + Red Team, fresh and blind) before treating either draft
    as final. This decision records that review's outcome and corrects
    the disposition BEFORE anything was archived -- this is a draft
    correction under normal iteration, not a CORR (AGENTS.md rule 4
    governs archived records; nothing here was ever committed).
  decision: revise
  decision_label: >-
    coordinator_draft_locus_conflation_caught_by_independent_review_before_archival_null_control_confirmed_main_claim_reopened_corrected_successor_construction_named
  target_ids:
    - IDEA-20260807-5126f4
    - H-MONO-39b1f0
    - RQ-MONO-001
    - GOAL-MONO-001
    - EXP-MONO-805a02
    - EV-MONO-08a31f
    - DEC-20260830-828289
    - KN-FIND-c41ea9
    - KN-FIND-a1f3c2
    - TASK-20260905-153d93

  rationale:
    - >-
      THE ORIGINAL DRAFT'S ERROR, EXACTLY LOCATED. Both reviewers,
      working independently and blind to each other, converged on the
      same root cause by different routes. The Validator showed
      (IDEA-20260807-5126f4.yaml's own `mirror_failure_check` and
      `null_object_control.primary_null`, lines 61-68, read against
      KN-FIND-c41ea9's unconditional complete-splitting theorem) that
      the draft's "reading (ii)" -- T pinned on-curve immediately,
      matching EXP-MONO-805a02 Stage 5's own construction -- is the
      idea's own FULL locus, i.e. its already-anticipated null control,
      not its partial-locus test. The Red Team showed, independently and
      by direct construction against a committed non-split cell
      (RUN-MONO-805a02-1, p=1009, m=4), that even taking reading (ii) at
      face value, the draft's specific numeric claim ("filter
      false-positive rate equals the measured split rate") was wrong:
      the filter is trivially vacuous (false-positive rate exactly 1) at
      that locus by direct inspection of its own Legendre-test
      construction on already-on-curve fixed coordinates, independent of
      Stage 5's own split-rate number. These findings are mutually
      reinforcing, not contradictory: of course the filter is exactly
      vacuous at reading (ii)'s locus -- because that locus IS the full
      locus, where the idea's own design already required exactly that
      behavior as a correctness sanity check, not a discovery.
    - >-
      A GENUINE, VALUABLE THIRD READING WAS FOUND. The Validator
      identified a previously unconsidered construction that is at least
      as textually defensible as either of the original draft's two
      readings: T held GENERIC/symbolic during the C_2^{m-2} tower's
      construction (consistent with DEC-20260804-4f37d5's own generic
      Galois computation over F_p(x_2,...,x_{m-1},c)), with the m-2
      factor-base coordinates specialized to concrete on-curve values,
      the tower built once and evaluated cheaply against many concrete
      candidate targets at use time. Under this reading only m-2, not
      m-1, of the tower's generators collapse to F_p, keeping the
      C_2^{m-2} structure genuinely nontrivial -- consistent with the
      idea's own "complete splitting... does NOT apply" language and
      with "where relation search actually operates" read as amortizing
      one tower construction over many targets. No record in this
      corpus has built or measured this construction; it is the actual,
      still-open object IDEA-20260807-5126f4 describes.
    - >-
      THE PROVES-TOO-MUCH CONTROL HELD. The Red Team independently
      recomputed (not reusing any single-reviewer prior claim) the split
      rate one argument short of KN-FIND-c41ea9's own m-1-of-m
      precondition, at both m=4 and m=5, both tested primes: 0/30, 0/30,
      0/20, 0/20, versus 90-100% at the precondition. The argument-count
      arithmetic, where it genuinely applies (the full-locus / null-
      control confirmation), is sharp and correctly scoped -- the
      defect was in identifying WHICH locus the idea's own text and the
      reused evidence actually describe, not in the arithmetic itself.
    - >-
      WHAT SURVIVES, SCOPED NARROWLY. IDEA-20260807-5126f4's own primary
      null control (full-locus vacuity) IS genuinely confirmed by
      EXP-MONO-805a02 Stage 5, reused at zero new compute, and this
      round's own independent re-derivation (Red Team) strengthens that
      confirmation (exact vacuity by construction, not merely a
      0.833-1.0 measurement). This is recorded as the one narrow,
      correct contribution of this thread -- a real but modest fact
      (the idea's own sanity check passes), not a disposition of the
      idea's actual claim.
    - >-
      NOTHING IS ARCHIVED FOR THE RETRACTED CLAIM. The original draft's
      KN-FIND-9be274 was never committed anywhere and has been deleted
      rather than superseded, since no other record cites it and its
      central numeric claim did not survive review. This decision and
      the corrected H-MONO-39b1f0 are the durable record of what
      happened, per this program's own transparency norm for self-caught
      and reviewer-caught defects.
    - >-
      PER AGENTS.MD RULE 9, THE LINE STAYS OPEN, NOT CLOSED.
      IDEA-20260807-5126f4 is NOT withdrawn, refuted, or deprioritized
      by this decision. It remains `proposed`, ready for a corrected
      `/design-experiment` pass targeting the third-reading construction
      specifically -- the null-control confirmation removes one already-
      expected item from that future contract's own control battery (it
      need not re-verify full-locus vacuity; EXP-MONO-805a02 already
      has), it does not remove any part of the idea's actual claim.

