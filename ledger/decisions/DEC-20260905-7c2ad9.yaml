      tightly coupled to one still-open idea's own internal bookkeeping
      to warrant a standalone corpus entry on its own.

  next_action: >-
    IDEA-20260807-5126f4 remains open and ready for `/design-experiment`,
    now with a corrected, more precise target: build the C_2^{m-2}
    character tower with T held GENERIC/symbolic during construction
    (the Validator's third reading, per `review_findings_2026_09_05` in
    H-MONO-39b1f0), specialize the m-2 factor-base coordinates to
    concrete on-curve values, and evaluate the resulting filter against
    concrete candidate targets at use time -- reusing
    `harness/semaev.py` and `harness/toycurve.py` per this lane's own
    convention, and matching EXP-MONO-805a02's own p=211 (curve A=37,
    B=57)/p=1009 primes for comparability. The full-locus vacuity control
    need not be re-run; cite EXP-MONO-805a02/EV-MONO-08a31f directly.
    This is genuine design work requiring its own careful pass (the
    generic-tower construction is technically nontrivial), not performed
    in this decision.

  procedure_deviations:
    - >-
      An earlier draft of this decision and of H-MONO-39b1f0 (declaring
      IDEA-20260807-5126f4's condition (a) decided, and promoting
      KN-FIND-9be274) was produced, then retracted before archival after
      independent review found it conflated the idea's own null control
      with its actual test. Recorded here rather than silently discarded,
      per this program's own disclosure norm, even though nothing
      reached the ledger.

  limitations:
    - >-
      This decision settles only IDEA-20260807-5126f4's own primary null
      control at EXP-MONO-805a02's tested scope (p in {211,1009}, m in
      {4,5}, curve A=37/B=57 at p=211). The idea's actual claim is
      untouched and remains open at any scale.
    - >-
      Does not close KN-OPEN-009 and does not change H-MONO-45183a's or
      H-MONO-663fb4's status.

