        the manifest passes the run schema and every original source hash is
        identical; (4) versioned plan, queue, executor handoff and a new lane
        that never mutates BATCH-769f82, with complete supervisor artifact
        coverage, the toolchain bound truthfully, and fresh run ids and task
        ids from tools/allocate_id.py; scientific parameters, seeds,
        controls, stopping rules and success and falsification criteria
        unchanged, any changed specification field recorded as a versioned
        amendment, never an edit. Then run tools/experiment_preapproval.py on
