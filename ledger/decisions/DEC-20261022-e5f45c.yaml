  rulings:
    - id: R-1
      subject: "identity reconciliation of RUN-ECDLP-18d26b (owner's request on PR #2388)"
      ruling: >-
        CORR-20261022-02292b is accepted as the explicit Coordinator identity
        reconciliation. From it onward: RUN-ECDLP-18d26b and
        TASK-20261017-2cc75e epoch 1 refer to attempt A only (owner
        executor-snfs-ledger-20261017, 2026-10-17T18:22:10Z,
        infrastructure_error), whose files on main stay byte-for-byte the
        canonical occupants of their paths. Attempt B (owner
        executor-snfs-g-1, 2026-10-17T21:02:04Z to 21:25:16Z, invalid_output)
        is referred to as RUN-ECDLP-d12308 and lives, with exact bytes and
        every hash listed, only in
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-769f82/custody/RUN-ECDLP-18d26b.executor-snfs-g-1/.
        No receipt byte of either attempt is edited and neither is silently
        re-identified: the alias is a reference label recorded here and in
        the correction, nowhere inside attempt B's files.
      merge_condition_for_PR_2388: >-
        PR #2388 may merge only with attempt B confined to the custody
        directory and with no attempt-B byte at any attempt-A path, after
        this decision and the correction are archived in one verified ledger
        commit. A merge is a git operation and changes no research state.
      cause_recorded_as_operational_fact: >-
        Attempt B's claim was taken with --local-only, which skips the scan of
        other git refs, so it re-claimed epoch 1 and reused the planned run
        id. Not a write-scope violation and not a scientific finding.
      operational_guard_going_forward: >-
        Executor claims for GOAL-ECDLP-001 tasks scan refs (no --local-only)
        unless the claiming session records why it cannot; a session that
        cannot scan refs does not claim a task another session may hold.
    - id: R-2
      subject: manifest-schema impediment on the four SNFS-G contracts
      ruling: >-
        Recorded as impediment IMP-SNFSG-MANIFEST-20261022 below. All four
        runners (EXP-ECDLP-84af7b and EXP-ECDLP-4c6a09 in Rust,
        EXP-ECDLP-8cc60d and EXP-ECDLP-ad27ad in Python) write a flat
        manifest.yaml with no top-level run mapping. The supervisor validates
        the manifest against the run schema after the checker and records
        invalid_output. This is observed, not predicted: all four have such a
        receipt (RUN-ECDLP-d12308, RUN-ECDLP-2ac930, RUN-ECDLP-e89532,
        RUN-ECDLP-a5281a). Every further invocation of the unchanged
        approved trial plans ends the same way, so none is dispatched.
      why_not_an_edit: >-
        The runner sources are hash-bound in the approved specifications and
        trial plans (DEC-20261017-0b1593 preapproval hashes). Changing the
        manifest writer changes those bytes. The fix is a new versioned
        transport that leaves the frozen producers, checkers and parameters
        unchanged, never an edit of a frozen file.
      defect_returned_to_executor_lane: >-
        Concrete defect: manifest.yaml lacks run.id, run.experiment_id,
        run.status, run.code.commit, run.code.command, run.environment,
        run.inputs.parameters, run.timing and run.result.certificate.kind
        (the manifest_shape of implementation-obligation.json). Concrete
        remedy: NA-1.
    - id: R-3
      subject: G1 retry proposal (G1-retry/retry-obligation.json; proposed ids CORR-20261017-a22ada, RUN-ECDLP-4a40c4, TASK-20261017-bbd357)
      ruling: >-
        NOT APPROVABLE AS WRITTEN. It addresses only the missing cargo of
        attempt A. It keeps the frozen g1 producer and its flat manifest, so
        a retry under it ends invalid_output exactly as attempt B did with
        cargo present. It also covers EXP-ECDLP-84af7b alone, while the
        defect is shared by all four contracts. The proposal stays
        review_required and unfiled; this decision neither files it nor
        consumes its ids. The successor packet allocates its own ids with
        tools/allocate_id.py --next and --check and does not adopt
        RUN-ECDLP-4a40c4 or TASK-20261017-bbd357.
      what_it_got_right: >-
        Its unblocking requirements (preserve prior bytes, verify old claims
        released, bind the toolchain truthfully, a new queue that never
        mutates BATCH-769f82, fresh claim, launch only via /run with a new
        run id and unchanged scientific identity) carry into NA-1. The top-level
        session reports cargo 1.97 and rustc 1.97 on this host; the toolchain
        is bound in the transport packet, not assumed.
    - id: R-4
      subject: run identity of the first valid runs
      ruling: >-
        Each of the four contracts gets a fresh run id, allocated for the
        versioned transport plan, and a fresh claim through /run. Never
        reused: RUN-ECDLP-18d26b, RUN-ECDLP-e89532, RUN-ECDLP-2ac930,
        RUN-ECDLP-a5281a, and the custody alias RUN-ECDLP-d12308. The
        existing receipts are preserved as they are and are not evidence.

  # ----------------------------------------------------------- impediment
  impediment:
    id: IMP-SNFSG-MANIFEST-20261022
    raised: '2026-10-22'
    recorded_by: DEC-20261022-e5f45c
    condition: >-
      The frozen SNFS-G runners of EXP-ECDLP-84af7b, EXP-ECDLP-8cc60d,
      EXP-ECDLP-4c6a09 and EXP-ECDLP-ad27ad emit a flat manifest.yaml with no
