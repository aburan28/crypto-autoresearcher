    - experiments/EXP-ECDLP-ad27ad/runs/RUN-ECDLP-a5281a/execution-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-769f82/claims/
    - coordination/design/SNFS-INSTRUMENT-REPAIR-20261017/implementation-obligation.json
    - coordination/design/SNFS-INSTRUMENT-REPAIR-20261017/G1-retry/retry-obligation.json
    - ledger/decisions/DEC-20261017-0b1593.yaml

  limitations:
    - This session holds no shell. It computed no hash, ran no tool and read no PR thread; the custody hashes, the owner's review content, the --local-only cause and the host toolchain are as the top-level session reported them. The archive task re-verifies the hashes at HEAD.
    - The checker replay counts in CORR-20261022-02292b are custody integrity facts, not observations of any hypothesis, and may not be quoted as results.
    - Why EXP-ECDLP-4c6a09 (also Rust) reached its checker on attempt A's host while EXP-ECDLP-84af7b failed for lack of cargo minutes earlier is not explained here; the transport packet binds the toolchain it actually uses.
    - The preapproval probe currently rejects already-approved canonical experiments and reads only canonical trial-plan.json (implementation-obligation.json routing_obligations). NA-1 cannot reach approvable true until a supported additive route exists; that gap is infrastructure, recorded, and not bypassed.
    - Nothing here bears on H-ECDLP-2f1033, H-ECDLP-281dd6, H-ECDLP-4da36f or H-ECDLP-986bab in either direction, or on any deployed prime or curve.

  next_actions:
    - id: NA-1
      role: executor (implementation), dispatched by a TASK handoff that a later Coordinator decision writes and approves; then the Coordinator (approval) and /run (execution)
      action: >-
        After this decision and CORR-20261022-02292b are archived in one
        verified ledger commit (pushed, named by an open PR, goal checkpoint
        written with IMP-SNFSG-MANIFEST-20261022 and this single next action),
        implement a versioned manifest transport for EXP-ECDLP-84af7b,
        EXP-ECDLP-8cc60d, EXP-ECDLP-4c6a09 and EXP-ECDLP-ad27ad following
        coordination/design/SNFS-INSTRUMENT-REPAIR-20261017/implementation-obligation.json:
        (1) create or extend the problems/ record for this obstruction;
        (2) in a new versioned directory per experiment, a driver that
        invokes the frozen producer unchanged (constants, loops, arithmetic,
        raw output and checker unchanged), keeps its manifest as
        producer-manifest.yaml, and writes a schema-complete run manifest
        (run.id, run.experiment_id, run.status, run.code.commit,
        run.code.command, run.environment, run.inputs.parameters, run.timing,
        run.result.certificate.kind none) from the actual launch.json and
