  context: >-
    BATCH-769f82 holds the four SNFS-G contracts approved by
    DEC-20261017-0b1593 (toy tier, one trial each). On 2026-10-17 session
    executor-snfs-ledger-20261017 claimed all four executor tasks at epoch 1.
    TASK-20261017-2cc75e failed at launch for lack of cargo (attempt A,
    RUN-ECDLP-18d26b). The other three computed, passed their checkers and
    ended invalid_output on the run schema. Later that day session
    executor-snfs-g-1 claimed TASK-20261017-2cc75e with --local-only, again
    at epoch 1, and ran RUN-ECDLP-18d26b to completion; it too ended
    invalid_output (attempt B, PR #2388, unmerged). The repository owner's
    review on PR #2388 (2026-10-20, as reported by the top-level session)
    re-verified attempt B's custody and checker replay and asked for both
    exact sets to be preserved additively with an explicit Coordinator
    identity reconciliation before merge. The top-level session copied
    attempt B's bytes unmodified into the BATCH-769f82 custody directory.
    Main also holds a review_required transport design for the same defect
    class on EXP-ECDLP-f34097 and EXP-ECDLP-903c48
    (implementation-obligation.json) and an unfiled G1 retry proposal.

  rationale:
    - Validity first (responsibility 6). No receipt is a valid run record, so nothing is interpreted; the only questions are custody, identity and the route to a valid run.
    - The owner asked for preservation without overwrite or silent re-identification. Keeping attempt A canonical (it was committed first and is on main) and giving attempt B a reference-only alias meets that without touching a receipt byte; records are immutable and corrections are new records (core rule 4).
    - Attempt B's checker pass does not make it evidence. The supervisor refused the record, and admitting a reviewer on a refused record would let a format failure become a reviewed result by procedure. The checker replay is kept as custody integrity, which is what the owner used it for.
    - The impediment is shared by all four contracts and is observed on all four, so a contract-by-contract retry that keeps the flat manifest spends runs to reproduce a known refusal. The G1 retry proposal is that case for one contract.
    - The implementation-obligation.json pattern already on main (versioned driver, frozen producer unchanged, producer-manifest.yaml retained, schema-complete run manifest, certificate.kind none) fixes exactly this defect without altering any scientific byte, so it is the cheapest valid route; reusing it keeps one design for one defect class.
    - Fresh run ids keep every receipt name meaning one attempt, which is the property the 18d26b collision broke.
    - ECC first (AGENTS.md). This is the ranked GOAL-ECDLP-001 work of the batch, and NA-1 can be ranked ahead of doing nothing because it unblocks four approved contracts at once.

  evidence_refs: []
  artifact_refs:
