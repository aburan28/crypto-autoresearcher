      TASK-20261017-94b6a7), which has no valid run record to read.
    clears_when: >-
      For each contract, a versioned manifest transport (NA-1) is committed
      and pushed, its fixture manifest passes the run schema, the frozen
      producer and checker hashes are unchanged, the preapproval probe
      reports approvable true on the exact final bytes, and a committed
      Coordinator decision approves the transport plan. Cleared per
      contract; the impediment closes when all four are cleared or each
