coordinator_decision:
  id: DEC-20260903-56c64d
  recorded_at: '2026-09-03'
  decision: approve
  decision_label: approve_zero_run_rl_isogeny_search_design_lane
  target_ids:
    - GOAL-ECTD-001
    - RQ-ECTD-001
    - BATCH-2b018c
    - TASK-20260903-18a803
  context: >-
    The user explicitly requested an ML/RL training solution that searches
    generic-prime-field elliptic curves and isogeny neighbours for
    presentations with cheaper summation-polynomial point decomposition and
    less explosive Groebner/root computation. GOAL-ECTD-001 already owns this
    scientific scope. IDEA-20260903-47f358 and
    analysis/isogeny-dreg-search/DESIGN.md provide a certified deterministic
    whole-class baseline and identify richer factor-base maps plus the
    cryptographic-scale smooth-isogeny ball as open directions. The prior
    BATCH-33b207 verifier-repair lane remains paused and is not modified.
  decision_summary: >-
    Open one disjoint, zero-experiment design lane. An Idea Generator will
    specify the Markov decision process, curve-and-presentation action space,
    actual-solver-cost reward, censored-failure semantics, matched controls,
    train/validation/held-out-prime split, baseline comparisons, budgets, and
    falsification criteria. No training implementation or experimental run is
    authorized by this decision. The design must reuse the certified class
    enumeration and F1/F2/F3 instrumentation rather than replacing their
    correctness checks with learned predictions.
  uncertainty_reduced: >-
    Whether the requested ML/RL direction can be converted into a bounded,
    falsifiable and implementation-ready research mechanism that searches
    beyond the presentation family already measured class-constant, while
    preventing reward hacking and prime-family overfitting.
  rationale:
    - >-
      The user supplied fresh explicit scope for the active ECTD goal, which
      satisfies the goal head's requirement for a separate user or Coordinator
      scope decision before new work.
    - >-
      The existing exhaustive tool makes a strong oracle and baseline at toy
      scale, but exhaustive enumeration is asymptotically unavailable at
      cryptographic p; an adaptive policy is potentially useful only if it
      generalizes across held-out primes and presentation families.
    - >-
      A zero-run design act is the cheapest valid next experiment because the
      reward, action legality, generalization split, and end-to-end cost
      boundary must be frozen before implementation can yield interpretable
      evidence.
  evidence_refs:
    - ledger/proposals/IDEA-20260903-47f358.yaml
    - analysis/isogeny-dreg-search/DESIGN.md
    - tools/isogeny_dreg_search.py
    - tools/isogeny_dreg_search_fast.py
    - experiments/EXP-ECTD-001/specification.yaml
    - ledger/evidence/EV-ISO-001.yaml
    - ledger/evidence/EV-ICINV-343679.yaml
  literature_pointers:
    - ref: arXiv:2602.02972v2
      title: Learning Fast Monomial Orders for Groebner Basis Computations
      provenance: retrieved
      verified_by: coordinator
      scope: >-
        Primary-source abstract and metadata read on 2026-09-03. Supports the
        feasibility of RL over algebra-system choices with cost-aware rewards;
        it does not establish effectiveness on elliptic curves or isogenies.
    - ref: IACR-ePrint-2017-609
      title: On the discrete logarithm problem for prime-field elliptic curves
      provenance: retrieved
      verified_by: coordinator
      scope: >-
        Primary-source abstract and metadata read on 2026-09-03. Supports the
        prime-field summation-polynomial/Groebner context and the importance of
        reducing the number of basis computations; it does not support this RL
        mechanism.
  claim_boundaries:
    - Zero experiments, zero training, and zero Groebner benchmark runs are authorized here.
    - No attack, speedup, novelty, curve weakness, ECDLP reduction, or breakthrough is claimed.
    - A lower surrogate score never counts as a lower measured solver cost.
    - Any later positive result remains toy-tier until independent held-out-prime replication and end-to-end attack accounting.
  knowledge_promotion:
