  context: >-
    BATCH-080 attempted a DDH conditional proof of H-PSEUDO. Result: DDH does not
    imply H-PSEUDO (categorical gap: computational vs information-theoretic).

  decision: close_ddh_route_advance_weil
  target_ids: [GOAL-ECDLP-001]
  target_ids_basis: >-
    Filled under DEC-20260805-7b3e91 (RUL-5) with the goal id this record's own
    goal_id field declares. Only that structurally-named id was added; ideas,
    hypotheses and findings discussed in the prose were not lifted in, because
    selecting among them would be a judgement about what the decision was about.

  decision_scope: >-
    DDH conditional proof route: CLOSED with named obstruction (DDH-HPSEUDO gap:
    DDH bounds computation, H-PSEUDO bounds a fixed real number — orthogonal concerns).

    New unconditional approach identified: Weil cohomological bounds on mixed
    exponential sums over E(F_p). The character sum hat{1_F}(k) = Σ_{P∈F} e^{2πi k*DL(P)/N}
    can be reformulated as a mixed sum involving both additive characters in j (DL space)
    and the EC group law relating j to x([j]G). Such sums might be bounded by O(sqrt(N))
    via étale cohomology / Weil's theorem.

    EMPIRICAL OBSERVATION (new): If |hat{1_F}(k)| = O(sqrt(N)), then
    C = max|hat|/sqrt(B) = O(sqrt(N/B)) = O(1/sqrt(B_frac)). For B_frac=0.05:
    C = O(sqrt(20)) ≈ 4.5, and empirically C ≈ 3-4 — CONSISTENT with O(sqrt(N)) bound.

    This suggests H-PSEUDO might follow from the Weil bound on a mixed exponential sum,
    with C = O(sqrt(N/B)) being the correct scaling (not O(1)).

  exact_next_action: >-
    BATCH-081: Attempt to write the character sum hat{1_F}(k) as a mixed exponential
    sum and apply Weil's bound (or Katz-Sarnak type L-function bound). Specifically:
    hat{1_F}(k) = Σ_{x=0}^{t-1} 2*cos(2πk*DL(x,y)/N) where (x,y) ∈ E(F_p).
    If this equals Σ_{x=0}^{t-1} f_k(x) for some "algebraic" function f_k, and if
    Weil gives Σ_{x<t} f_k(x) = O(sqrt(p)) = O(sqrt(N)), then H-PSEUDO follows
    with C = O(sqrt(N/B)).

