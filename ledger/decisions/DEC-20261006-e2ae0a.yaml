  context: >-
    /design-experiment, one contract, for IDEA-20261005-1e54b5. No
    hypothesis and no experiment on origin/main or on the listed design
    branches cites it. The branch design/frob-1e54b5-theta was created
    from origin/main at 868ae268ecb73447ff161d98207af77de4932640 and
    git merge origin/main reported already up to date.

    The contract measures kernel sizes of [2] on genus-2 models of
    P(T) = T^4 + 3T^3 + 5T^2 + 6T + 4 over F_2. The prediction is the
    triple (1, 1, 4) over F_2, F_4, and F_8. Any other triple on a hit
    is a negative, so success can fail. Zero hits leaves the degree
    unmeasured. No exponent improvement is claimed. No factor base at
    degree 131 is constructed.

    This session opened ledger/questions/RQ-FROB-7d8dd4.yaml,
    knowledge/open-problems/KN-OPEN-095df5.md,
    ledger/proposals/IDEA-20260926-80209d.yaml,
    knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml, and
    experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py. It read
    IDEA-20261005-1e54b5 from origin/design/cycle-20261005-domain via
    git show and did not copy that file. The Mumford level-structure
    sentence stays provenance recalled. It is not evidence for this
    approval. The approval is of the protocol.

    Protocol completeness: inputs, controls, independent variables, primary
    and secondary metrics, the lexicographic seed, replication, budget,
    stopping rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. No field required
    for approval was left null.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The assignment of each observation is fixed before any run. A triple other than (1, 1, 4) is a negative.
    - The polynomial identities, the even-order elliptic control, the odd-order elliptic control, and the Jacobian-order check give the count a way to come back invalid rather than as a false triple.
    - Success is only the first assignment row, so success can fail.
    - No pair was enumerated while writing this decision.

  evidence_refs: []
  limitations:
    - Toy scope only: one class over F_2 of order 19. No transfer to degree 131.
    - The infinity convention and the characteristic-polynomial formula are the ones in the opened helper. They are part of the instrument.
    - Zero hits does not falsify H1. It leaves the kernel triple unmeasured.
    - This decision authorizes a later run. It does not start one.
    - The recalled Mumford sentence is not support.

