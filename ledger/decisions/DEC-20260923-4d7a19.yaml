        decision. Amendments:
        (i) CORR-20260923-a86e3b C5 records the defect and the routing gap;
        (ii) this decision authorizes the supersession;
        (iii) TASK-20260923-e3b590's receipt binds manifest_v2.yaml and
            tools/run_supersession_registry.yaml by sha256, as previously
            committed at 5016669, without re-staging or editing them.
        The registry entry is left as written.
      limits:
        - >-
          If J2's diff finds any other changed field, the ratification lapses.
          The Coordinator then supersedes the supersession, never edits it.
    - id: R-6
      concerns: The executor's interpretations I-1..I-25 and the anomalies in run-report.md and implementation.md.
      ruling: >-
        Accepted as DISCLOSED, not as correct. The interpretations were fixed
        in trial-plan-v1.json before the first elimination (manifest
        timestamps). The spec left the relevant mechanics unstated, so none is
        a protocol amendment. The anomalies are preserved as recorded, and each
