  rulings:
    - id: R-1
      concerns: D-4, executor deviation (1). Inference fallback under fallback_allowed false.
      ruling: DOES NOT VOID THE RUN. It LIMITS it, and it is recorded as a procedural nonconformance (CORR-20260923-a86e3b C4).
      basis:
        - >-
          The card was unservable as written. Claude Code subagents inherit the
          session model, and per-role model selection is process-level
          (CLAUDE.md model policy note). DEC-20260923-b85c30 wrote
          fallback_allowed: false for a same-session subagent launch without
          checking that the runtime could honour it. That is the Coordinator's
          authoring defect. The executor did not cause it.
        - >-
          The executor did what AGENTS.md "Model policy" requires of the party
          that meets an unservable binding. It did not substitute silently. It
          recorded fallback_used true with its reason, degraded_requirements []
          and model_verified false.
        - >-
          There is no capability gap. claude-opus-5-5 meets every stated
          requirement of executor-implementation (effort floor medium, tool
          use, structured output, context and output size). A substitution
          that meets every requirement differs from the bound model in
          identity, not in any contract property.
        - >-
          No model is in the computational loop. Every number comes from
          archived, hash-bound deterministic code. The only thing a model
          substitution could have affected is whether that code faithfully
          implements the frozen specification. That is exactly what J1 (code
          audit against spec) and J6/J7 (blind re-derivation and comparison)
          test. Re-running the same code under another model would reproduce
          identical bytes and test nothing. Re-implementing it under
          claude-sonnet-5 would be a replication, not a remedy, and is weaker
          than the blind re-derivation already planned.
      limits:
        - >-
          The run carries fallback_used true and model_verified false
          permanently. Any evidence record citing it must say that the
          implementation was authored under an unpermitted model fallback and
          that its admissibility rests on REVIEW-CERTBIN-20260923-c51f07 J1 and
          J6/J7.
        - >-
          If J1 or J7 breaks against the producer, the run returns to the
          executor as an implementation failure (INV-8). It is never evidence.
        - >-
          This is NOT a retroactive inference_amendment. A permission cannot be
          granted after the fact. The nonconformance stays on the record.
      forward_rule: >-
        Every remaining card in this lane declares fallback_allowed: true with
        the runtime-native reason, as the FROB lane does. That is not a tier
        downgrade: the requested policy and effort are still requested and
        must be served. degraded_allowed stays false.
    - id: R-2
      concerns: D-3, executor deviation (2). numpy installed with pip --user.
      ruling: DOES NOT VOID OR LIMIT THE MEASUREMENTS. It LIMITS reproduction.
      basis: >-
        It is an environment change outside write_scope, made before any run
        and disclosed in environment.json and the manifest. It touches no
        research artifact.
      limits:
        - >-
          Reproduction from seeds is bound to numpy 2.4.6. That numpy's
          Generator does not promise stream stability across versions is
          recalled, not retrieved: it is a pointer, not support. Any
          replication either pins numpy 2.4.6 or uses the archived instance
          data. This is why the blind re-derivation takes extracted instance
          inputs (review-plan PD-R2).
    - id: R-3
      concerns: D-2, executor deviation (3). Development runs wrote to /home/user/certbin-dev/ outside write_scope.
      ruling: DOES NOT VOID THE RUN. It LIMITS it in one respect, which a joint addresses.
      basis: >-
        The development runs used non-declared seeds, and by the executor's
        account no frozen stream except S_selftest was drawn before the frozen
        run. Seeds, counts, thresholds and decision rules are fixed by the
        frozen specification, so a development run cannot move them.
      limits:
        - >-
          The executor saw outputs of its own implementation on non-frozen
          instances of the same family before it fixed the trial-plan
          interpretations I-1..I-25. The development directory is not archived,
          so that ordering cannot be audited from archived bytes. It is
          mitigated by J3's interpretation-sensitivity test: whether any
          verdict depends on a discretionary interpretation.
        - >-
          The development outputs are not evidence, are not archived and are
          not readable by any reviewer. Archiving them would expand a task's
          write scope after the fact.
      disposition: >-
        Leave /home/user/certbin-dev/ in place and untouched until the
        TASK-20260923-918a6d ledger archive verifies. If J3 finds a
        verdict-flipping interpretation, the Coordinator may commission a
        separate audit of that directory (listing and hashes) before the
        evidence decision.
    - id: R-4
      concerns: D-1, executor deviation (4). implementation.md missing from the manifest artifacts list.
      ruling: DOES NOT VOID OR LIMIT THE RUN. No executor action.
      basis: >-
        The file is bound by sha256 in the c2e57b receipt, which is the durable,
        content-first binding. A third manifest version to list one producer
        note would be churn with no integrity gain.
      limits:
        - >-
          implementation.md was written after phase 8. It is PRODUCER NARRATIVE
          and not a run output. Reviewers weigh it as such, and it is in the
          blind re-deriver's blind_from.
    - id: R-5
      concerns: D-5. The singular run.code.command key, and the 5016669 supersession routing.
      ruling: >-
        RATIFY THE CONTENT and AMEND THE ROUTING. The manifest_v2.yaml
