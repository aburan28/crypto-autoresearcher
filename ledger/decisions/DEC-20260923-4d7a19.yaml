        - interpretation sensitivity: J3;
        - hazard structure and the repeated sequences across references: J4;
        - identical instances across families: J5 O1 and J8;
        - "1 in R_4" and the overturned prior parts: J8;
        - ops_strict and saving ratios: J3 and J6/J7.

  rationale:
    - >-
      WHY A FULL ROUND, NOT A LIGHT ONE. Three parts of the pre-data prior
      were overturned. One of the overturned parts concerns a quantity that
      only the unsatisfiable arm's row content determines, and PS0 cannot
      guard that arm. The implementation was authored under an unpermitted
      model fallback (R-1). The blind re-derivation is the one check that can
      see a wrong-but-self-consistent implementation, and it is load-bearing
      here in a way it would not be if everything had matched the prior.
    - >-
      JOINT DESIGN. The admissibility joints are J1, J2 and J7, owned by
      validators. The verdict-recomputation joint J3 is also a validator's.
      The reading joints J4 and J8 and the proves-too-much control J5 belong
      to the red team. The blind re-derivation J6 is a separate validator
      session with the widest blind_from. The comparison J7 is split out so
      that the re-deriver never has to read a run output. Each joint has
      exactly one owner.
    - >-
      TIER. Review-adversarial, with a tripwire. No closure, break or
      contradiction is claimed. If the evidence decision would close a lane
      or record reject_scoped, a review-breakthrough round and replication
      come first. A single unreplicated empirical run supports at most
      `weaken`.
    - >-
      TARGET-PROFILE HONESTY, carried from DEC-20260923-b85c30. This is a
      constant-factor go/no-go with sota_delta zero, and parallel rho
      dominates. The round is sized to the decision it feeds, which is NA-5's
      Stage 2 vs Stage 3 rerank. It does not justify promoting the lane above
      exponent-targeting ECC work.

