    reported rough effect is about 0.5-0.7 bit (a constant factor). Ranked low.
    (2) IDEA-20260926-442b92. C1 (the draft mechanism is dominated) and C2
    (threshold p^{4/3}, not p^{2/3}) are recorded as filed. C3 AS FILED is
    recorded DEFECTIVE: the returned endomorphism carries the walk-conjugation
