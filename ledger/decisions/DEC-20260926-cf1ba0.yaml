    program-side derivation and is not pursued. C4 (the tabulation of oriented
    constructions against p^{4/3}) is deferred with a revisit condition.
    `pause` here impedes only these two proposals' next steps. It does NOT
    rest on "no route remains", closes no lane, and is not reject_scoped
    (agents/coordinator.md "Closure gate").

