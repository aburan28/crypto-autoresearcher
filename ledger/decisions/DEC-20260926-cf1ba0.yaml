  # --------------------------------------------------------------------------
  # PER-PROPOSAL DISPOSITIONS (status recorded in the decision only)
  # --------------------------------------------------------------------------
  proposal_dispositions:
    - id: IDEA-20260926-81ae2d
      proposal_status: proposed
      disposition: paused_live_step2_not_designed
      priority: low
      step1_outcome: >-
        (c) NOT DISCUSSED, as relayed from the literature subagent's full read
        of ePrint 2019/725. Peikert treats arbitrary cyclic N (reported
        section 1.3 p.4, section 3 p.8, section 3.3 p.12). The CSIDH-512
        factorisation N = 3 * 37 * 1407181 * q95 * q135 appears only in
        section 2.1 p.7. His cost (Eqs. 3.2-3.3) depends on N only through
        log(N/S0). CRT decomposition and sieving subgroup by subgroup are not
        discussed. So the proposal's falsification condition 1 ("outcome (a)
        or (b), close as known") does NOT fire, and the proposal's own rule
        ("Only (c) leaves this record live beyond the read") keeps it live.
        Kuperberg 2005 section 5, which the proposal's Step 1 also names, was
        NOT read in this round.
      ceiling_correction: >-
        REPORTED, NOT VERIFIED BY THIS PROGRAM. The literature subagent's own
        derivation says the proposal's ceiling is wrong. The proposal's framing
        was that cost "could be governed by the largest factor ~2^134.5", an
        exponent ratio of 0.723. Per the subagent, oracle labels are uniform in
        Z_N, so any sieve that isolates s mod q still needs collimation depth
        governed by log(N/S). The factorisation can enter only by restricting
        to a subgroup AFTER partial recovery. A rough estimate from Peikert's
        Figure 1 parameters gives about 2^18.1 against 2^18.7 queries, i.e.
        about 0.5-0.7 bit, a constant factor. The Coordinator's own reading is
        consistent in outline: a label in Z_N whose other CRT components are
        zero still has to be collimated down from N. But this reading is not
        a review of the derivation, and the 2^18.1 / 2^18.7 figures have not
        been reproduced.
      evidence:
        - ledger/proposals/IDEA-20260926-81ae2d.yaml (claim "PRE-REGISTERED EXPECTATION IS NO"; target_complexity "expected 1.0"; interpretation_limits "No exponent claim"; recommended_priority low)
        - Literature subagent report on ePrint 2019/725 (relayed 2026-09-26; not archived; see limitations L-1)
        - knowledge/literature/KN-LIT-127.md (abstract-level record of the same paper; no figures)
        - ledger/goals/GOAL-CSIDH-001.yaml (status draft; line 22 forbids a security verdict; next_action lines 107-113 builds the reversible group-action circuit first)
      budget: >-
        Spent: zero runs, zero compute; one literature read by the subagent.
        Step 2 would cost little (classical arithmetic on published formulas
        or on Peikert's simulator model; no quantum computation). CSIDH is a
        declared ECC area (orchestration/research-priority.yaml), so the
        campaign budget is unlimited. The pause is a RANKING decision, not a
        budget stop.
      test_boundary: >-
        Tested: whether Peikert 2019/725 uses N's factorisation (outcome (c),
        relayed). NOT tested: Kuperberg 2005 section 5; Regev's variant; the
        bodies of Bonnetain-Schrottenloher ePrint 2018/537 and Castryck et al.
        ePrint 2021/562 (reported read at abstract level only; neither is in
        the corpus; the 2021/562 abstract reportedly quotients out only
        small-order parts). Also not tested: any cost computation at the
        CSIDH-512 N, and the 257-bit prime-N control. Nothing here concerns
        other CSIDH parameter sets or other class-group orders.
      remaining_uncertainty: >-
        (i) The depth argument and the 0.5-0.7-bit estimate are one
        subagent's unreviewed derivation from a rough reading of Figure 1.
        (ii) A factorisation-aware variant in a paper not read (2018/537 body,
        2021/562 body, later c-sieve work) could exist. (iii) The effect under
        other switch settings of RQ-CSIDH-64343f's cost function (quantum
        memory, oracle cost model) is not estimated. (iv) Even at its best
        the question is a constant factor in the subexponent's concrete value.
        It never moves the 2^{O(sqrt(log N))} form.
      rationale_for_pause: >-
        The proposal itself pre-registers "no gain" and a ceiling of at most a
        constant in the exponent. The reported correction lowers even that
        ceiling to about one bit. docs/target-result-profile.md and the
        Coordinator contract bias the roadmap toward exponent-moving
        mechanisms. GOAL-CSIDH-001, whose cost function this would be one
        switch of, is in draft, and its next_action is the reversible circuit.
        A switch without the function it plugs into has no consumer yet. The
        record is not closed, because its falsification condition did not
        fire and Step 2 is cheap. Closing it would be premature closure.
      revisit_conditions:
        - id: RV-81-1
          condition: >-
            GOAL-CSIDH-001 (or RQ-CSIDH-64343f) reaches the stage where the
            parameterised cost function's switch list is being assembled. The
            factorisation switch is then added as a cheap Step 2 design, with
            the Peikert-figure reproduction gate and the 257-bit prime-N
            control from the proposal.
        - id: RV-81-2
          condition: >-
            A read at source of Kuperberg 2005 section 5, the body of ePrint
            2018/537 or ePrint 2021/562, or any later c-sieve paper finds a
            sieve variant that exploits N's factorisation beyond small-order
            quotients.
        - id: RV-81-3
          condition: >-
            An independent check contradicts the depth argument (labels
            uniform in Z_N, so depth is governed by log(N/S)), or finds the
            factorisation effect exceeds about 1 bit at any published setting.
        - id: RV-81-4
          condition: >-
            RQ-CSIDH-64343f's disagreement kernel shows an unexplained
            difference between published CSIDH-512 query counts of at least 1
            bit that subgroup handling could explain.
      successor: >-
        On any revisit condition: /design-experiment for Step 2 exactly as the
        proposal states it, plus an independent check of the depth argument.
        Before then: curation of the Peikert read (next action NA-3).

    - id: IDEA-20260926-442b92
      proposal_status: proposed
      disposition: paused_c1_c2_recorded_c3_defective_c3prime_dominated_c4_deferred
      priority: low
      component_rulings:
        - part: C1
          ruling: >-
            RECORDED AS FILED. The draft oriented Frobenius-twin MITM is
            dominated. Given a published orientation iota, OneEnd is immediate
            (iota of a generator of O is non-scalar). EndRing given one
            endomorphism alpha costs l^{O(1)}|disc Z[alpha]|^{1/4} classical
            time under GRH (2023/1448 Theorem 1, p.4, verbatim in KN-LIT-5d518f).
            That equals the draft's |D|^{1/4} exponent. This is a
            novelty/dominance disposition (Pareto), not a negative
            mathematical result and not an official lane closure. No
            obstruction block is claimed.
        - part: C2
          ruling: >-
            RECORDED. |D|^{1/4} < p^{1/3} iff |D| < p^{4/3}. This is
            elementary arithmetic, checked by the Coordinator. The draft's
            p^{2/3} threshold stays retracted, as the proposal states.
        - part: C3 (as filed)
          ruling: >-
            DEFECTIVE. The filed statement "deg alpha = p * delta(E)" does not
            hold for the endomorphism the frozen source returns. Coordinator's
            own reading of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:
            - Algorithm 3 line 7 (file line 206) returns
              omega-hat o phi o varphi o omega, where omega is a
              non-backtracking 2-walk of length n (line 202) with
              n = O(log p) (line 193).
            - For beta = phi o varphi and alpha = omega-hat beta omega:
              tr(alpha) = deg(omega) tr(beta) and
              deg(alpha) = deg(omega)^2 deg(beta), hence
              disc Z[alpha] = deg(omega)^2 disc Z[beta], with
              deg(omega) = 2^n = p^{Theta(1)}.
            So Theorem 1 of 2023/1448 applied to the RETURNED alpha does not
            give p^{1/3}. This matches KN-LIT-5d518f item 1, and Delgado Eq.
            (62) states the same degree growth for his construction
            (KN-LIT-6fb205).
        - part: C3' (corrected route)
          ruling: >-
            RECORDED AS A DOMINATED, UNREVIEWED PROGRAM-SIDE DERIVATION. NOT
            PURSUED. The route: apply 2023/1448 Theorem 1 at the walk endpoint
            E' to beta = phi o varphi. There deg varphi <= X^2 = B(p/2)^{1/3}
            (frozen text lines 177-181), so
            |disc Z[beta]| <= 4 p deg varphi = p^{4/3+o(1)}. Then pull
            End(E') back along the known walk. Result: p^{1/3+o(1)} time and
            memory under GRH. The derivation is in KN-LIT-5d518f items 2-3 and
            in no source. Novelty is at most "adaptation", since it is a
            direct instantiation. Pareto position: it matches the exponent of
            the PW24/HLMW25 cascade and is weakly dominated by it. The cascade
            claims polynomial overhead (Delgado Cor. 5.4; unverified) and is
            unconditional per Delgado section 2.2 and the HLMW25 abstract
            (unverified at full text). C3' needs GRH. Its only distinguishing
            property is independence from PW24's internal constants. It does
            not discharge SC-3, because its l^{O(1)} exponent is unstated
            (KN-LIT-5d518f).
        - part: C4
          ruling: >-
            DEFERRED. Tabulating log_p |D| against 4/3 for published oriented
            constructions (SCALLOP and others) is bookkeeping. The expected
            outcome is "all >= 4/3". Any value below 4/3 would be a
            known-algorithm observation, not a new attack (the proposal's own
            interpretation_limits).
      evidence:
        - ledger/proposals/IDEA-20260926-442b92.yaml (C1-C4; class control; novelty_status known; recommended_priority low)
        - knowledge/literature/KN-LIT-5d518f.md (Theorem 1 p.4, Corollary 2 p.24, Theorem 7 p.28, Remark 6 p.28, proof of Theorem 1 p.29; program-side derivation items 1-3)
        - knowledge/literature/KN-LIT-6fb205.md (Theorem 1.1 p.3, Eq. (62) p.21, Corollary 5.4 pp.22-23)
        - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (lines 167-181, 193, 195-206, 220; read by the Coordinator in this act)
        - ledger/goals/GOAL-SSIQ-001/goal.yaml (standing conditions SC-1, SC-2, SC-3 at lines 677-695)
      budget: >-
        Spent: zero runs, zero compute; the 2023/1448 full-text read (recorded
        in KN-LIT-5d518f). C4 would be a zero-compute read of parameter
        tables. SSI is a declared ECC area, so the campaign budget is
        unlimited. The pause is a ranking decision, not a budget stop.
      test_boundary: >-
        Read: 2023/1448 in full (2025-07-03 version), which settles the
        proposal's minimal-test read (1). NOT done: minimal-test read (2),
        i.e. the SCALLOP paper and the parameter tables of other oriented
        constructions. Also not done: the generic-curve control (confirming no
        published iota exists for the SQIsign/CGL curves in GOAL-SSI-001's
        scope). NOT reviewed: the proofs in 2023/1448 and in Delgado, and the
        C3' derivation. The disposition covers supersingular curves over
        F_{p^2} with a published orientation (C1), and the one routing note
        (C3/C3'). It says nothing about generic SQIsign/CGL/GPS/PRISM curves.
      remaining_uncertainty: >-
        (i) C3' is unreviewed. The pull-back step leans on [Wes22a, Lemma 12]
        as used in 2023/1448's proof of Theorem 10 (p.33), and the program has
        not read [Wes22a]. (ii) The dominance of C3' rests on Delgado Cor. 5.4
        and the HLMW25 abstract, both unverified, and on PW24, which the
        program has not read. If the cascade's overhead or unconditionality
        fails, C3' would become a non-dominated GRH alternative at the same
        exponent. (iii) C4's expected "all >= 4/3" is unconfirmed. (iv)
        GOAL-SSIQ-001 lever N5 for GENERIC curves ("find any alpha of small
        discriminant") is neither closed nor advanced by this record, as the
        proposal itself states.
      rationale_for_pause: >-
        Nothing in this proposal moves an exponent. C1 and C2 are already
        complete as filed. C3 as filed is wrong, and its correction is a
        dominated alternative with no consumer, because SC-2 is more directly
        addressed by Delgado's claimed log deg alpha = O(log p) (and see NA-6).
        C4 is bookkeeping whose expected outcome changes no ranking. Closing
        the proposal outright would drop C4's cheap scope check and the
        conditional value of C3', which becomes live if the cascade claims fail. So
        it is paused with conditions, not closed.
      revisit_conditions:
        - id: RV-442-1
          condition: >-
            The verification of Delgado / PW24 / HLMW25 (NA-2) finds that the
            OneEnd -> EndRing cascade does NOT have polynomial overhead, or is
            NOT unconditional, or does not accept the OneEnd output. C3'
            (GRH, p^{1/3+o(1)}, no lambda) then becomes a candidate route. It
            is dispatched as an independent review of the KN-LIT-5d518f
            derivation (items 1-3) plus a read of [Wes22a, Lemma 12].
        - id: RV-442-2
          condition: >-
            Any program goal or question names an oriented construction
            (SCALLOP, (qt-)Pegasis, CSI-FiSh-type or any published
            O-orientation) as a target or in its scope. C4 is then done as a
            zero-compute read before that goal's first design.
        - id: RV-442-3
          condition: >-
            A published oriented-construction parameter set with
            |disc O| < p^{4/3} comes to the program's attention by any route.
            C4 is then done for that set immediately, and the result is
            recorded as a known-algorithm scope observation.
      successor: >-
        None dispatched now. On RV-442-1: an independent review task on C3'.
        On RV-442-2 or RV-442-3: a zero-compute C4 read task.

  ranking:
    position: >-
      Both proposals rank below every exponent-targeting ECC task currently
      ranked (for example GOAL-SSIQ-001's work on EXP-SSIQ-6916e8 and
      EXP-WESO-9e2d6d, approved this session) and below the Delgado
      verification (NA-2). That verification bears on two goals' standing
      conditions and on RV-442-1.
    ecc_worklist_note: >-
      tools/ecc_priority.py --open-ideas (lines 192-237) decides whether an
      idea is open from the proposal's own `status` field and from citations
      by hypotheses and experiments. Because this decision follows the
      convention and leaves both files at `proposed`, both will continue to
      appear on the open-ECC-idea worklist (question areas CSIDH and SSI).
      This decision is their ranking under instruction 3 of
      orchestration/research-priority.yaml. It does not forbid a
      /design-experiment pass. Any such pass should check the revisit
      conditions above first.
    pareto:
      IDEA-20260926-81ae2d:
        dominated_by: >-
          Peikert 2019/725 c-sieve costing at the actual CSIDH-512 order (the
          proposal's own dominated_by).
        sota_delta: >-
          Zero established. Best case as reported: about 0.5-0.7 bit in query
          count at Figure 1 parameters (constant factor; unreviewed).
      IDEA-20260926-442b92:
        dominated_by: >-
          C1: reading iota (OneEnd) and 2023/1448 Theorem 1 (EndRing). C3':
          the PW24/HLMW25 cascade, conditionally on the unverified claims
          above.
        sota_delta: Zero on every axis checked.

  rationale:
    - >-
      WHY DISPOSE NOW. Both proposals made a read their first step and made
      their next step depend on its outcome. The reads are done. Leaving the
      proposals undisposed would keep them on the worklist with no ranking and
      no recorded reason.
    - >-
      WHY PAUSE AND NOT CLOSE. 81ae2d's own stop condition did not fire, and
      its Step 2 is cheap. 442b92 retains a conditional route (C3') and an
      unperformed scope check (C4). Neither has a checked obstruction, and
      the closure gate requires one for any closure resting on "no route
      remains". Both proposals are low value against the target profile. So
      the honest disposition is a ranked pause with concrete triggers.
    - >-
      WHY NOT DESIGN NOW. Neither proposal can move an exponent: 81ae2d by its
      own statement, 442b92 by its own statement. A design slot spent on
      either displaces exponent-targeting or verification work. That work
      (NA-2) can change what these proposals are worth (RV-442-1).
    - >-
      SCOPE. Every statement here concerns only the named papers, the frozen
      P13 text and CSIDH-512's N. No statement is made about CSIDH's security
      level (GOAL-CSIDH-001 forbids one) or about any generic supersingular
      curve.

