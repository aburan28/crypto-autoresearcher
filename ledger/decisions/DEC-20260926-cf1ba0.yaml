  decision_label: >-
    PAUSE BOTH PROPOSALS AT THE PROPOSAL STAGE, with each one's reason, test
    boundary, remaining uncertainty and revisit condition recorded below.
    (1) IDEA-20260926-81ae2d. Step 1 (the Peikert read) returned outcome (c),
