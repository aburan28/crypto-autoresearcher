coordinator_decision:
  id: DEC-20260807-41c173
  context: >-
    Close of BATCH-523510, a corrective follow-up to BATCH-cb71b5 executing
    next actions N3 (saturation-decay sweep), N4 (MTGT rebuild-baseline and
    even-ell fix), N5 (EWALK seed distribution), and N2 (NULL-B/NULL-C
    characterisation) from DEC-20260807-c8aa8b. An independent Validator
    session was re-dispatched at reduced scope (N1) after two prior full-scope
    review dispatches on this campaign (BATCH-cb71b5's Validator and Red Team)
    were each killed mid-task by a provider session limit. This dispatch
    completed all four of its named checks and returned `verdict: passed`.
  decision: replicate
  target_ids:
  - GOAL-ENDO-001
  - BATCH-523510
  - EV-ENDO-10109d
  - RQ-ICINV-475b5e
  - RQ-EWALK-8fa147
  - RQ-MTGT-2cabee
  - RQ-INSTR-f8faa0
  - CORR-20260807-9f83be
  rationale:
  - >-
    ALL THREE CORRECTIVE MEASUREMENTS CONFIRM AND SHARPEN, RATHER THAN REVERSE,
    BATCH-cb71b5'S POST-REVIEW FINDINGS. N4: preprocessing transport loses
    against a correctly-costed rebuild at every odd ell from 3 to 31, at two
    primes, with no crossover in range -- a cleaner negative than the prior
    "~17" figure, which turns out to have been an artifact of an inflated
    baseline. N5: the automorphism-quotient walk speedup sits statistically ON
    its ceiling across 20 seeds and both automorphism arms (j=0 and j=1728),
    with near-zero fruitless-cycle events throughout, so there is no systematic
    shortfall left to explain. Both are now independently validated with exact
    or near-exact numeric agreement, not just re-derived by this Coordinator.
  - >-
    A FOURTH INSTRUMENT DEFECT WAS FOUND, DIAGNOSED, FIXED, AND ITS SCOPE
    CHECKED BEFORE THIS DECISION WAS WRITTEN -- and it was found by an
    impossible number surfacing during honest construction of a new
    measurement, not by external review. `targets_uniform`'s unchecked base
    point could degenerate to a 2-torsion point, present in 4 of 8 already-
    committed classes. Its correction was independently validated (check 1) via
    reproduction of the ORIGINAL bug, the fix, and a birthday-collision
    sanity check -- not merely code review. Checked directly against the
    already-committed evidence: fixing it changes MAGNITUDES (a target-class
    ratio of 5.745 becomes 1.416) but flips NEITHER qualitative conclusion of
    BATCH-cb71b5 (between-class: still no signal, now more decisively;
    within-class: still real over-dispersion).
  - >-
    N3's clean result is the batch's most important finding and is explicitly
    NOT overclaimed. Independently validated via AST-level code-fidelity
    diffing and full-precision arithmetic recomputation: the within-class
    over-dispersion is DENSITY-INDEPENDENT (ratio 1.3-3.6x at every density
    from 0.024 to 0.97, replicated at two primes, no decay trend), refuting the
    saturation-artifact hypothesis this campaign and the Red Team both proposed.
    The Validator explicitly confirmed this against the AGENTS.md null-object-
    control requirement -- the effect does not decay under the parameter meant
    to destroy it, which is "exactly the canonical artifact tell the operating
    rules warn about" -- and confirmed the synthesis reports this honestly
    rather than hiding or escalating it. WHAT CAUSES IT REMAINS UNKNOWN. This
    decision does not resolve that question and does not characterise the
    effect as anything beyond an open anomaly in an exact-enumeration
    instrument; it licenses no attack-cost claim.
  - >-
    `decision: replicate` rather than `support` or `expand`, because this
    batch's function was to confirm and sharpen prior findings under
    independent review, not to advance any hypothesis (none is active) or open
    new experimental ground. The one genuinely new, unresolved observation --
    the density-independent over-dispersion -- is recorded as an open question
    for a successor batch, not folded into this decision's claim.
  - >-
    THE INDEPENDENT REVIEW'S OWN LIMITS ARE CARRIED FORWARD, NOT DROPPED. It
    covered four named numeric claims only: not the N1/N2 narrative, not a full
    artifact-hash or dirty-tree audit, not the correction records' own
    bookkeeping, and it ran in the harness's own environment rather than a
    from-scratch rebuild. In the Validator's own stated words, its PASS
    "does NOT support an ECDLP claim, does NOT demonstrate a speedup, and does
    NOT authorize promotion or closure of GOAL-ENDO-001 or any of its
    hypotheses." This decision does not authorize any of those things either.
  - >-
    A PROCEDURAL GAP FROM BATCH-cb71b5 WAS REPEATED, AND IS RECORDED HONESTLY
    RATHER THAN SILENTLY OMITTED A SECOND TIME. All three new experiments
    (EXP-MTGT-952db3, EXP-EWALK-5ca18c, EXP-ICINV-55c2d8) ran without a frozen
    contract, exactly as CORR-20260807-3ee25d defect D4 found in the prior
    batch. Retrospective specification.yaml files are filed for all three,
    explicitly labelled `retrospective: true` and never presented as
    pre-registrations. N6 (fixing this at the tooling level, or requiring
    contracts before execution) remains open.
  - >-
    THE INDEPENDENT REVIEWER CAUGHT A GENUINE OMISSION BEFORE THIS DECISION
    WAS WRITTEN. Three diagnostic run directories generated while diagnosing
    the targets_uniform defect (RUN-INSTR-p4001-degenfix,
    RUN-INSTR-p6007-degenfix, RUN-JINV-p1009-degenfix) were left uncommitted
    after the initial snapshot. The Validator's snapshot-diff note surfaced
    this; the Coordinator committed them in a follow-up snapshot before the
    review concluded, and the Validator separately confirmed they were
    correctly excluded from its own evidence base as postdating the reviewed
    commit. This is recorded as the review process working as intended, not
    as a defect in the reviewed science.
  evidence_refs:
  - EV-ENDO-10109d
  - CORR-20260807-9f83be
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-523510/reviews/validator/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-523510/SYNTHESIS.md
  limitations:
  - >-
    The independent review's scope is four named numeric claims, not a full
    validation of BATCH-523510; see EV-ENDO-10109d.review_provenance and the
    Validator's own `limitations` block for the complete list of what was and
    was not checked.
  - >-
    Both this batch's session and its Validator dispatch resolved to models on
    the same backend (this harness has only one), so "independent session"
    means independent context and a fresh, adversarial reading, not independent
    judgement from a genuinely different model. This is the same limitation
    recorded against every review in this campaign under the suspended closure
    quorum (AGENTS.md rule 13).
  - >-
    N6 (the git_state() untracked-source blind spot) and N7 (RQ-CANL-63098f's
    re-dispatch) remain open, exactly as BATCH-cb71b5 left them. Neither is
    attempted or reviewed by this decision.
  - >-
    Everything is toy scale (p <= 100057), claim_tier: toy. No lane is closed.
    sota_delta: zero -- no speedup against any baseline is produced or claimed
    anywhere in this batch or by this decision.
  next_actions:
  - >-
    N8. Investigate the density-independent within-class over-dispersion.
    Candidate next steps: check whether it correlates with any curve invariant
    not yet tested (group structure beyond 2-torsion, j-invariant proximity to
    special values, volcano level at odd ell once a modular-polynomial
    instrument exists); or whether it is itself a subtler sampler artifact
    (e.g. `targets_uniform`'s non-cyclic-subgroup limitation, honestly
    disclosed by check 1, restricting samples to a proper subgroup rather than
    the full group on non-cyclic curves) that a full-group sampler would
    remove. This is the campaign's highest-priority open question.
  - >-
    N6 (carried from DEC-20260807-c8aa8b, still open). Fix git_state() to
    distinguish untracked SOURCE from untracked OUTPUT, or require a commit
    before execution, so a run manifest never again names a commit its own
    code does not exist at.
  - >-
    N7 (carried from DEC-20260807-c8aa8b, still open). Re-dispatch the
    RQ-CANL-63098f lane, which has 5 proposals against 8-9 elsewhere and no
    executed experiment because its idea-generator session died on the same
    provider session limit that has now affected three separate dispatches on
    this campaign.
  - >-
    N9. Given N1 succeeded at reduced, tightly-bounded scope after two
    full-scope failures, apply the same pattern (name specific numeric checks,
    require incremental saves) to any future review dispatch on this campaign
    rather than repeating open-ended full-batch review requests that have
    twice failed to complete.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Evidence strength is `replicated` (two-prime replication plus a
      completed, if narrowly-scoped, independent validation), which is above
      the `preliminary` floor but the record's direction is `mixed` and its
      substantive open finding (the density-independent over-dispersion) is
      explicitly UNEXPLAINED. Promoting a finding whose cause is unknown would
      overstate it; N8 above is the path to a promotable finding once the
      cause is understood or ruled out. The negative findings (N4, N5) refine
      already-recorded technique notes (KN-TECH-001, KN-TECH-006,
      KN-TECH-018's baseline conventions) rather than warranting a new entry.
  decided_by: coordinator
  decided_at: '2026-08-07'
