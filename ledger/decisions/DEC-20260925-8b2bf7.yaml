      and KN-OPEN-9b4a2b need the v2 ladder and the 31-bit rung. A development
      stop is not a reason to abandon them (AGENTS.md "Research-direction
      integrity"); the successor route costs one zero-run review and one
      approval act before the next stage.
    - >-
      NO SECURITY READING. Toy EcGFp5-shaped arithmetic with known scalars;
      nothing transfers to p = 2^64 - 2^32 + 1.

