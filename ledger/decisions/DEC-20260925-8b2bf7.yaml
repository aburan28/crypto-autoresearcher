  # --------------------------------------------------------------------------
  # RULINGS
  # --------------------------------------------------------------------------
  rulings:
    R-1_the_STOP:
      ruling: >-
        A STOP UNDER RB-5, AS THE INCORPORATED TEXTS AND LKA-11 WORD IT, AND
        FINAL FOR THE r4 STAGE. RB-5 (d)'s words are not ambiguous: with the
        original copy "it admits". The wrapper refused (F3). "STOP ... on any
        failure of (c) or (d)" (readbackcover line 300) therefore applies, and
        LKA-11 and R4S-9 name RB-5 among the stops. The stop is an impediment
        for this decision and is never evidence.
      does_any_rule_supply_a_development_reading_of_d: >-
        NO.
        - failclosed RF-4 (c) (lines 463-471) and its reading_rule item (lines
          159-160), as replaced by childend RG-3 (d) (lines 391-403), read ONE
          phrase, "the r4 checks pass", and name exactly where it is read:
          RB-5 (c) and readbackfull RL-6 (c'), (e). The phrase does not occur
          in RB-5 (d), which turns on RB-4 (b)'s "exits 0" and on the outcome
          "admits". RG-3 (d) states its own reach; extending it to (d) would
          be a new reading.
        - readbackclose RK-4 (a) (lines 378-395) and failclosed RF-4 (b) (lines
          455-462) make RB-4 / RL-4 / RK-3 / RF-3 refusals EXPECTED in the
          preflight of the DV-18 (a), (b) and (e) packages themselves. They do
          not reach (d), which is the preflight of a LATER package on copies
          of the (a) world, and "expected refusal" is not "admits". RK-4 (a)'s
          last sentence ("The admission predicates are exercised by DV-6,
          DV-18 (d) and DV-18 (i)") names (d) without re-reading it.
        - No LKA condition reads RB-5 (d). LKA-4..LKA-10 read seven other
          clauses (DEC-20260924-daf670 lines 1172-1280); LKA-11 carries RB-5
          as a stop unchanged.
        - LKA-2's precedence rule ("Where two texts differ, the more specific
          governs", lines 1136-1142) was CONSIDERED AND DOES NOT APPLY. RG-3
          (d) and RB-5 (d) do not state different rules for one object: RG-3
          (d) fixes the checker items of a development package; RB-4 (b) fixes
          the admission predicate; RB-5 (d) is a check that asserts an outcome
          of that predicate. The three are jointly unsatisfiable, not
          divergent statements of one rule. Reading precedence as deleting
          RB-5 (d)'s second clause would leave a one-sided check that a wrapper
          refusing every package passes: a removed check, which LKA readings
          may not do (decision_label, lines 71-77) and which an act may not do
          after the outcome.
      may_an_act_choose_a_reading: >-
        Only before the outcome it governs, or prospectively by a versioned
        amendment:
        - an approving act may record a deterministic reading of an ambiguous
          approved text before the stage runs, removing no check, as
          DEC-20260924-daf670 did for LKA-4..LKA-10 under
          what_the_readings_cannot_do;
        - a rule in force (such as LKA-2) applies if its words reach the case;
        - otherwise a changed predicate is a protocol amendment: a versioned
          DRAFT decided by a separate act on archived bytes, binding the
          stages that run after it.
        After the outcome, adopting the note's development reading for THIS
        stage would change a success criterion after observing it
        (agents/coordinator.md, Prohibitions) and repair a stop inside the task
        (LKA-15 (b): "never repaired inside the task"). This act does neither.
      the_note_s_development_reading: >-
        RECORDED AS THE EXECUTOR'S ANALOGY, NOT A RULE. The Executor applied
        RG-3 (d)'s reading of "the r4 checks pass" to RB-4 (b)'s "exits 0"
        inside (d), found it met, and still recorded the literal STOP and
        returned the question. That is the conduct the contract requires. The
        analogy is the design input of the successor draft (AD-1), where it is
        written as normative text before any stage runs it.
      what_it_says_and_does_not: >-
        It says the approved protocol 2-r4 / 2-a1-r4 cannot complete its r4
        stage as written, on any code. It says nothing about the delivered r4
        layer's correctness, about D, the quotient, msolve's behaviour at any
        prime, or any gate outcome; no gate package ever ran under r4.
    R-2_the_defect:
      defect: >-
        RB-5 (d)'s clause "with the original, it admits" is UNSATISFIABLE BY
        CONSTRUCTION in every development world the incorporated texts permit:
        - RB-4 admits a later package only if, for each of G1..G4, the r4
          checker exits 0 AND REG-1 passed; the (a) world holds only the G4
          image, and REG-1 is NOT_EVALUABLE where G1 does not exist (RF-4 (c),
          RG-3 (d));
        - RG-3 (d) requires the r4 checker on every development package to
          FAIL the three REG-1 items (and makes their passing a STOP), so its
          exit is non-zero by rule.
        Admission is therefore impossible on any copy of a development
        package, whatever the delivered code does. The defect was certain
        from committed text at approval time.
      coverage_of_earlier_records: >-
        UNDER-COVERED:
        - readbackcover wrote (d) before the close census found REG-1
          NOT_EVALUABLE in development worlds (close census md 570-572, as
          RF-4 (c) cites it);
        - failclosed RF-4 (c) and childend RG-3 (d) supplied a development
          reading for the SAME root cause in RB-5 (c) and RL-6 (c'), (e), and
          did not sweep (d), which fails for the same reason;
        - the zero-run review TASK-20260924-d897a6 was designed to attack
          fail-open and planned-basis refusal (its card, LJ-0..LJ-6, lines
          320-448); by that design its LJ-4 checked RJ-5's and RJ-6's
          development checks for derivability and re-checked RG-3 (a)-(d)
          against the r3 code (card lines 405-425), and no joint asked whether
          every inherited development predicate, RB-5 (d) included, was
          satisfiable (this act read the card, not the report, on this
          point);
        - DEC-20260924-daf670 cites readbackcover RB-5 (275-304) and childend
          RG-3 (373-415) as read (citations, lines 2724-2735) and approved
          without recording it, while certifying protocol readiness
          (user_authorization, lines 122-128).
      correction: >-
        WARRANTED AND WRITTEN: CORR-20260925-ee6929 (item 1: RB-5 (d)'s
        satisfiability; item 2: the reach of RF-4 (c) / RG-3 (d); item 3:
        DEC-20260924-daf670's readiness statement read with items 1-2). No
        record is edited; no rule text changes.
    R-3_the_remedy:
      chosen: >-
        A targeted DRAFT additive amendment,
        AMD-EXP-GFPN-05ff43-20260925-admitdev, at
        experiments/EXP-GFPN-05ff43/amendments/v2_addendum_admitdev.yaml,
        status draft, approved_by null, archived by TASK-20260925-3bd499, and
        decided by a later, separate act (reserved TASK-20260925-019e4f,
        DEC-20260925-fc8dbb, ledger archive TASK-20260925-3d4054) on archived
        bytes, after the zero-run red-team review TASK-20260925-5842cf is
        archived by TASK-20260925-82235d.
      key_parameters: >-
        - AD-1 replaces RB-5 (d), for development worlds only, by a TWO-SIDED
          check: (d1) the refusal branch on copies of the DV-18 (a) world,
          stated DIFFERENTIALLY (with the original, the only failing checker
          items of the (a) package are the three RG-3 (d) items and the frozen
          checker exits 0; with the read-back list emptied, the frozen checker
          exits 1 on the read-back line and the wrapper refuses the later
          package on RB-4 (b) naming the (a) package); (d2) the admitting
          branch on the coherent development copy set of RK-4 (e) (5), where
          admission is possible (the wrapper admits; the same set with one
          gate image's read-back list emptied is refused on RB-4 (b)). A
          pre-declared alternative covers (d2) if the review finds it
          unsatisfiable. RB-4 itself, every production predicate and every
          verdict are unchanged.
        - AD-2: after any STOP condition, only DV-9, the note and the bundle.
        - AD-3: r5 paths, EIGHTEEN hashes, 42 fresh ids, 204 retired ids, ten
          forbidden task ids, 48 packages over twelve plans; r5 files may start
          from the preserved r4 files with provenance.
        - AD-4: the inference-block key of R-7 carried unchanged.
        - AD-5: disclosures (SC-4 printout labels; no undeclared outer guard).
        - Pre-approval readings ADR-5, ADR-0..ADR-4, with a satisfiability
          sweep (ADR-1) whose known answers are RB-5 (d) under launchkind and
          RF-4 (c) as failclosed first worded it.
      why_this_route: >-
        - It restores the check RB-5 (d) was written to be (RB-4's refusal on
          the checker verdict, exercised on a real development package) and
          adds the positive branch in the one development world where
          admission can hold; neither half can be passed by a wrapper that
          ignores the verdict or refuses everything.
        - It is chosen on text, before any r5 code exists. The r4 outcome
          informs the design; it cannot be the r5 pass (R-4).
        - The satisfiability sweep addresses the class, not only this
          instance: eight successive drafts each stopped or failed on one
          clause, and this one stopped a delivered stage after every other
          check passed.
      routes_not_taken: >-
        - A: adopt the development reading by decision and run phase A on the
          r4 outputs. REJECTED (R-1): a post-outcome criterion change; phase A
          requires a completed stage (R4A-6); items after 05:47:42Z did not
          conform to R4S-9 (R-8 D-13).
        - B: LKA-2 precedence deleting the clause. REJECTED (R-1).
        - C: re-launch d91a96 or a copy under the same texts. REJECTED: it
          would stop at the same clause on any code.
        - D: a DV-only amendment that reuses the r4 layer and plans unchanged,
          bound outside R-1. NOT ADOPTED: the r4 plans and wrapper bind
          seventeen hashes and name TASK-20260924-4a47e5, -b85e59 and -46a554
          (R4S-5, R4S-6); an amendment outside R-1 breaks the lineage's
          binding of every amendment into every manifest; DV-18 runs once and
          is "never a reason to re-run anything", so re-running (d) on the
          same code with its outcome known would be a ratification, not a
          check. Its saving is about one stage-time (the r4 stage took 2.6 h).
        - E: drop RB-5 (d). REJECTED: it removes the one DV-18 exercise of
          RB-4 on a real development package.
        - F: close or park the lane. REJECTED: nothing measured D; the
          obstruction is one unsatisfiable development clause in a layer whose
          other checks passed as recorded. Closing now would be premature
          closure (docs/inventor-protocol.md).
      why_not_rule_under_the_existing_approval: >-
        The texts in force make the r4 stage's completion impossible (R-2).
        Only a changed development predicate can complete a stage, and a
        changed predicate is a protocol amendment with a separate approval.
    R-4_what_a_successor_stage_must_rerun:
      ruling: >-
        EVERYTHING, ON ITS OWN DELIVERED CODE: DV-1..DV-17 and DV-18 as
        extended by RL-6, RK-4, RF-4, RF-6, RG-3, RG-7, RH-3, RH-5, RH-6,
        RI-3, RI-4, RJ-4 (c), RJ-5 and RJ-6, read with LKA-4..LKA-11
        re-pointed, with (d) as AD-1 replaces it; DV-18 (f) (xiv) and (xv)
        FIRST; the SE-5 probe once; DV-17 in full.
