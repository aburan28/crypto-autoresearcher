  rationale:
    - >-
      J1 is inconclusive: the algebraic R_CER saturation argument is
      conditional, but the primitive gate, dual, field, degree, total-size,
      and decoder algorithms are not a complete executable verifier.
    - >-
      J2 is inconclusive: the correctly directed same-external-instance
      attacker-to-witness reduction needs a uniform adaptive-auxiliary
      EI-DXWE extractor, exact distribution matching, sound R_CER decoding,
      and explicit loss, none of which is instantiated by ordinary XS-WE.
    - >-
      J3 is inconclusive: accepted-witness full-ring necessity is conditional,
      while universal non-factorization and representation lower bounds against
      smaller, cached, reconstructed, or opaque decoders are absent.
    - >-
      J4 breaks the proposed transform: one-known-witness oracle simulation
      need not reproduce real two-component rejection on adversarially chosen
      valid encryption coins under only honest average core correctness, and
      the displayed loss omits a robustness or q_D-scaled term.
    - >-
      J5 is inconclusive: assumptions are cleanly separated and the inspected
      nearby schemes differ in scoped mechanism, but K0, EI-DXWE/xO, NIZK,
      CRS, erasure, encodings, parameters, total costs, full LIT-SiGamal
      comparison, and universal novelty remain open.
    - >-
      Applying O1--O6 conjunctively gives O1/O2/O3/O4/O6 open and O5
      contradicted, with zero reviewed discharges. The construction gate fails.
    - >-
      J6 passed the release-bound Markdown, Mermaid, SVG, eleven-page PDF, and
      visual inspection with no requested corrections and preserved the exact
      verdicts, obligations, source limits, and zero-run boundary.
  evidence_refs:
