  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Three concrete reasons, any one of which suffices. (1) STRENGTH: the
      governing rule promotes a KN-FIND on a `support` or `reject_scoped`
      decision backed by evidence of strength `replicated` or `strong`. This
      decision is `revise`, and EV-PEC-2e67ff is `preliminary` - one authorized,
      unreplicated run, capped by the frozen contract's own replication clause
      and by the Validator's concurring recommendation. (2) THE DURABLE CLAIM IS
      NOT YET STABLE: the batch's most promotable content - that Section 4.1's
      one-operation-per-entry convention understates the true per-entry cost, and
      that a slope-only extrapolation law discards the level - is exactly what
      NC2b recomputes and NC2a re-fits. Promoting a finding whose headline numbers
      are under a citation prohibition (adjudication A) would put a number into
      the corpus that this same decision forbids citing. (3) WRITE SCOPE: this
      task's write scope is the four ledger records; knowledge/findings/ and
      knowledge/INDEX.md are outside it, and a promotion must ship its entry and
      the regenerated index in the SAME ledger archive, which this archive cannot
      do. REVISIT CONDITION, so this is a deferral and not a quiet drop: promote a
      KN-FIND in the BATCH-003 ledger archive once NC2b is on the record and NC2a
      has either confirmed or refuted the composition explanation - at that point
      the durable claim is "the per-entry cost of Algorithm 1's table construction
      is an implementation parameter with an irreducible ell-independent floor of
      order log p, and a slope-only calibration law systematically reports zero
      overhead for an object with a large constant one", carrying proof_status
      `derivation` and the same proof_refs as EV-PEC-2e67ff.

