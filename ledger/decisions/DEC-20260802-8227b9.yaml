        step) and the retry of the ell = 97 fetch as scoped, cheap successors.
        None of them is a batch on its own; several fit beside NC2a.
    - id: NA-4
      priority: medium
      action: >-
        Do not let the c-programme crowd out P0. Heuristic 1's tail at the
        operating point sets P0 and moves every margin row identically, and it
