  limitations:
    - >-
      Everything measured here is scoped to p = 1099511627563 (one 80-bit
      F_{p^2}), to 45 prime degrees in 2 <= ell <= 211, to one pure-Python
      implementation pair sharing all but its multiplication routine, and to one
      396-second run. AGENTS.md rule 7 applies in full.
    - >-
      Every NIST-level number in this decision is a MODEL SUBSTITUTION into
      RUN-WESOVOW-001's already-published scenario grid, conditional on assumptions
      L1-L4 and now on a law known to be defective. None of it is a measured
      cryptographic-scale margin, and none of it carries a claim tier.
    - >-
      The intercept's linear-in-log2(p) scaling, worth +2.678 bits at NIST-I, is
      DERIVED from the committed pipeline and not measured: p was held at a single
      value, so the p-axis has n = 1. Control NC2d discriminates it.
    - >-
      The dominant residual uncertainty is a subroutine that was never written:
      quasi-linear or batched Sutherland-type modular-polynomial evaluation, worth
      up to 13.25 bits at NIST-I - more than everything this batch measured. It is
      the frozen paper's own stated expectation about how the list would be
      populated (Lemma 3.3 footnote, credited to Damien Robert), so it is not a
      speculative escape hatch.
    - >-
      The comparison remains asymmetric in the attack's disfavour: measured
      overhead is charged to the attack while Delfs-Galbraith keeps the same
      nominal one-operation-per-step convention. Plausibly worth 5-7 bits back to
      the attack; unmeasured, of known sign, and deliberately applied to no number
      here. The end-to-end baseline constant k from the frozen bibliography's [15]
      and [3] is still unquantified in this repository.
    - >-
      Heuristic 1's tail at the operating point remains untested and sets P0,
      which moves every margin row identically. Nothing in this batch bears on it.
    - >-
      Half of the pre-registered primary window and all of W-TOP are
      un-null-controlled on the receipt (F-3); gamma_A and gamma_B are not
      independent estimates (F-4); W-TOP's bootstrap completed 1991 of 2000
      replicates and degenerates on 4-sample extension ell (F-7). None of these
      changes a sign; all are carried.
    - >-
      Inference ran under INFAMEND-20260802-P13-002 with fallback_used: true. The
      review-adversarial xhigh requirement is recorded as UNVERIFIED, not as met,
      because this harness cannot set or verify a subagent's effort tier; the
      manifest could not name a concrete resolved model identifier for the same
      reason (F-8). Independent-session requirements were genuinely satisfied. No
      review-breakthrough tier is claimed anywhere in this batch, and none could
      be, since that policy is non-degradable.
    - >-
      This decision changes no experiment file, no run artifact, and no review
      report. EXP-PEC-6be870 stays byte-unchanged; its defects are repaired by a
      superseding contract under a new id, never by an edit.

