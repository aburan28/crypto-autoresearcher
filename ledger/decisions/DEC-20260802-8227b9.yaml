      why_this_ordering: >-
        Both reviewers converge on it independently, and it is the cheapest thing
        that repairs the most: NC2b costs nothing, needs no new run, and fixes the
        number the whole batch exists to produce; NC2a costs a few hours and
        decides whether the headline was ever a measurement. Two batches remain of
        the four-batch campaign budget, so the zero-compute repair must not be
        spent as a whole batch on its own.
      superseding_contract_requirements: >-
        The new contract must (a) define the fitted response on a SINGLE
        implementation so it cannot change definition inside the fitted range,
        (b) place C-NULL after the optional extension or re-run it over the
        achieved grid, (c) fix a Cantor-Zassenhaus seed policy explicitly, and
        (d) state the extrapolation law with the intercept and its p-scaling
        included, with the C-NULL calibration as a pre-registered acceptance check
        on the estimator itself.
    - id: NA-2
      priority: high
      action: >-
        Queue NC2c (a Kronecker-substitution third implementation, pre-registering
        gamma_C < gamma_B < gamma_A) as the separator for the identifiability
