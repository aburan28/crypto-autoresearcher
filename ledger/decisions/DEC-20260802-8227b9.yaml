        addresses the largest residual term (up to 13.25 bits at NIST-I) and it is
        a one-routine change to the existing harness. If gamma_C lands near
        0.3-0.5, the honest headline of this line of work becomes "the per-entry
        exponent is an implementation parameter in [0, 0.93], not a constant of
