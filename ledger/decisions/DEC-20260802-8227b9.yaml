    - id: NA-3
      priority: medium
      action: >-
        Carry NC2d (three-point p sweep at a tiny ell grid, pre-registering
        alpha = 1 in log2 per_entry ~ alpha*log2(log2 p) + gamma*log2(ell)),
        NC2e (C-NULL over ell 103..211), NC2f (symmetric instrumentation of a
