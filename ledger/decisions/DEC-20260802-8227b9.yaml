coordinator_decision:
  id: DEC-20260802-8227b9
  context: >-
    GOAL-P13-001 BATCH-002 closes the NC-2 chain named as highest-priority next
    control by DEC-20260724-016: the deciding measurement of the true per-entry
    cost of Algorithm 1's table construction, against the frozen paper's Section
    4.1 assumption of one F_{p^2}-operation per entry. The chain is: a contract
    frozen before any datum (EXP-PEC-6be870, approved by TASK-20260802-1f3aeb,
    committed at 0e773e9a); one bounded Executor measurement at p ~ 2^40
    (RUN-PEC-6be870-a, TASK-20260802-b31c7f) snapshot-archived exactly as
    produced at 49166fa5 (TASK-20260802-ca5bdc); independent validation in a
    fresh session (VAL-20260802-d9e2c1, TASK-20260802-9ade2e); and an
    independent red team in a fresh session (RT-20260802-96d908,
    TASK-20260802-96d908). This decision adjudicates that record into official
    state through the ledger archive TASK-20260802-e804d1. Inference ran under
    INFAMEND-20260802-P13-002 with fallback and recorded degradations; no task
    in this batch may claim a review-breakthrough tier, which is non-degradable.
  decision: revise
  decision_note: >-
    `revise` is the operative value: the decision revises the adjudicated
    content of H-WESO-001 and the analysis that carries the measurement to a
    NIST-I statement, WITHOUT changing any hypothesis status, without promoting
    anything, and without a scoped rejection. Two adverse sub-calls are recorded
    explicitly below and are `weaken`-shaped rather than `reject_scoped`-shaped:
    the pre-registered extrapolation law is declared DEFECTIVE (adjudication A)
    and the paper's Section 4.1 per-entry cost convention is declared REFUTED AT
    THE TESTED SCALE (adjudication F). Neither is a rejection of a hypothesis,
    and `reject_scoped` is forbidden here in any case - the run is single and
    unreplicated, and the governing remedy is weaken plus replication
    (docs/claims-and-verification.md, "Refutation artifacts").
  target_ids:
    - H-WESO-001
    - EV-PEC-2e67ff
    - EXP-PEC-6be870
    - GOAL-P13-001
    - DEC-20260724-016

  outcome_classification_adjudication:
    executor_reported: "completed / valid_scoped, protocol_complete false (core-grid gate NOT MET)"
    validator_verdict: "VALID-WITH-OBSERVATIONS (admissible evidence at the scope declared)"
    red_team_verdict: >-
      "The run is a high-quality measurement and its headline is the wrong
      quantity" - defects located in the inference layer, not the data layer.
    official: "valid_scoped measurement; admissible; completion gate UNMET; headline statistic and extrapolation both defective as reported"
    validity_pre_checks_performed_by_the_coordinator:
      expected_run_count: >-
        1 authorized (maximum_runs 1), 1 executed, 1 terminal. The failed
        command invocation PD-1 (/usr/bin/time absent from the image) produced no
        datum, wrote no raw result, consumed no run id, and is correctly recorded
        as a failed invocation rather than a run.
      manifest_schema: >-
        Complete against the contract's manifest_schema: run.{id, experiment_id,
        status, code, environment, inputs, timing, result} present; code.commit
        and code.command present; inputs.parameters carries field_bits 80,
        p = 1099511627563, ell_grid_achieved (46 values) and
        samples_per_ell_achieved; result.certificate.kind = none with the stated
        reason. One literal gap: the resolved model identifier is described in
        prose rather than named (Validator F-8), which is the honest course under
        INFAMEND-20260802-P13-002 since the runtime does not expose it to the
        subagent.
      seed_integrity: >-
        All nine contract seeds used verbatim; every additional random stream
        (Cantor-Zassenhaus, null, pool, controls) derived deterministically from
        strings recorded in the manifest; the Validator re-executed eleven
        samples of its own choosing bit-for-bit, so the determinism claim holds
