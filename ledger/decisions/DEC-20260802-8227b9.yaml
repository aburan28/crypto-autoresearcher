      control_comparability: >-
        The null object is genuinely O(1) per entry in ell by construction and
        was measured with the identical harness, denominator, aggregation and
        fit; the Validator read this from source rather than taking it on trust
        and confirmed the only denominator divergence is confined to ell = 2 and
        changes no exponent. Two comparability limits are recorded and carried:
        C-NULL covers only 25 of the 46 fitted ell (F-3), and C-ALT.2's two
        implementations share a pipeline and a random stream (F-4).
      conclusion: >-
        The run set is valid and admissible. It is NOT sent back to the Executor:
        no defect found by either reviewer is an execution defect. The two
        material defects are contract-internal and inference-layer respectively,
        and both are fully recomputable from the archived data without a new run.

  status_transitions:
    - target: H-WESO-001
      from: analyzed
      to: analyzed
      transition: none
      rationale: >-
        No status change is supported. The conditional asymptotic theorem is
        untouched by this batch; nothing here bears on Heuristic 1; and the
        concrete NIST-I question is not decided. Promotion toward `supported`
        is independently barred: this is an asymptotic-complexity claim and the
        four promotion gates (archived proof decomposition; every conditional
        dependence stated as a numbered heuristic with validation evidence or a
        scheduled validation experiment; a concrete-cost table with honest
        accounting of what hides in o(1), memory, tradeoffs and parallelism; and
        independent breakthrough-tier review plus a red-team pass) are not
        satisfied by committed artifacts - and the breakthrough tier is
        non-degradable and unavailable in this harness. The record's content is
        revised; its status is not.
    - target: EXP-PEC-6be870
      from: approved
      to: analyzed
      rationale: >-
        The frozen contract was executed, reviewed, and is now analyzed. It is
        NOT edited: two defects were found in it (the response-definition
        interaction, and the extrapolation law) and the freeze_rule makes the
        remedy a SUPERSEDING contract under a new EXP id, never an edit to this
        one. This decision records the defects against the contract; the file
        stays byte-unchanged.

  adjudications:

    - id: A
      title: "The pre-registered extrapolation law is DEFECTIVE. No downstream record may cite c = 0.864."
      finding: >-
        UPHELD, on the merits, as a critical defect. The frozen law
        c = gamma * log2(B_opt) / sqrt(log2 p) maps the fit's SLOPE and discards
        its INTERCEPT, implicitly setting A = 1 in per_entry = A * ell^gamma
        while the run measured A = 2^8.924 directly
        (raw-result.json, fit.windows W-MID intercept = 8.924066290325673, i.e.
        ~486 F_{p^2} multiplications per entry at ell = 1). The correct overhead
        over Section 4.1's convention is the FULL per-entry cost at ell = B_opt,
        which in bits is log2(A) + gamma * log2(B_opt); the law retains only the
        second term and discards about nine measured, ell-independent bits.
      why_it_is_decisive: >-
        The refutation is INTERNAL to the run and does not require agreeing with
        any reviewer's judgement. Applied to the run's own C-NULL object - whose
        per-entry cost is O(1) in ell BY CONSTRUCTION and which was measured at
        5118.83 (ell = 2) and 4903.13 (ell = 101) counted multiplications per
        entry, i.e. 2^12.32 and 2^12.26 against Section 4.1's assumed 2^0 - the
        law returns c_null = gamma_null * 14.2 / 16 = -0.0132 * 0.8875 = -0.0118
        ~ 0. An estimator that reports "no overhead" for an object the same run
        has just measured at ~4900 operations per entry is measuring the SLOPE of
        the overhead, not the overhead. A control that passes its own
        pre-registered criterion while refuting the estimator built on top of it
        is the most informative object in the run, and this is the artifact tell
        of docs/inventor-protocol.md section 3 applied to the ESTIMATOR rather
        than to the signal.
      coordinator_verification: >-
        Both load-bearing numbers were re-read by this Coordinator directly from
        the committed raw-result.json at 49166fa5 - the W-MID intercept
        8.924066290325673 and the C-NULL per-entry values 5118.833333333334 /
        4903.127450980392 with gamma_null -0.013241522288809005 - independently
        of the Red Team's derivation and of the Validator's exact reproduction of
        the C-NULL statistics. The finding does not rest on one reviewer's word.
      corrected_magnitude: >-
        Intercept-corrected, and carrying the intercept's log-p scaling (the
        committed implementation computes roots as gcd(x^{p^2} - x, f) via
        poly_powmod at exponent Q = p*p, whose binary loop runs 2*log2(p)
        iterations, so A is linear in log2 p and A(2^256)/A(2^40) = 6.4, i.e.
        +2.678 bits), c at NIST-I is ~1.42 (measured intercept) to 1.589
        (p-scaled) under the linear reading, and 1.804 under the most pessimistic
        constructible quadratic reading - NOT the reported 0.864. The p-scaling
        is DERIVED from the committed pipeline, not measured: p was held at one
        value by design (RT2-C3), and control NC2d discriminates it.
      binding_prohibition: >-
        NO DOWNSTREAM RECORD MAY CITE c = 0.864 AT NIST-I - nor the reported
        c_low 0.771, c_high 0.868, the gamma_local_top sensitivity 1.0389, or the
        secondary c_kappa values - AS THIS RUN'S OVERHEAD ESTIMATE. Those values
        remain in the immutable run receipt as the law-as-frozen output and may
        be cited only as that, always with this adjudication attached. The
        prohibition binds every record derived from EV-PEC-2e67ff until NC2b is
        on the record.
      repair: >-
        NC2b, at ZERO new compute: recompute the extrapolation under
        c = [log2(A) + gamma * log2(B_opt)] / sqrt(log2 p) using the intercepts
        already committed in fit.windows.*.intercept, report it beside the
        law-as-frozen value, and validate the correction by confirming it returns
        c_null ~ 12.3 / 16 = 0.77 for C-NULL instead of ~0. It must be a
        SUPERSEDING analysis record under a new id; EXP-PEC-6be870 is frozen and
        is not edited.
      refutation_artifact: >-
        Level: derivation, backed by an explicit counterexample instance
        (the C-NULL series) archived at 49166fa5 BEFORE this decision. Recorded
        in EV-PEC-2e67ff.proof_status / proof_refs. Labelled `derivation` and
        never "proved": it is a checkable argument plus a committed instance, not
        a machine-verified proof and not a certificate in the sense of the
        certificate discipline, which governs claimed solves and relations.

    - id: B
      title: "The primary response changes definition inside the fitted range. The headline gamma is not an exponent."
      finding: >-
        UPHELD. Validator finding F-1 and red-team objection RT2-C2 reached this
        independently, in separate sessions, from the committed per-sample data.
        The contract's C-ALT carry_forward_rule takes the MINIMUM over
        implementations where both have data; execution_order step 8 runs the
        optional extension under IMPL-A only. The fitted response is therefore
        min(IMPL-A, IMPL-B) for 11 <= ell <= 101 and IMPL-A alone for
        103 <= ell <= 211, with a purely definitional step of +0.373 bits at the
        ell = 101/103 seam, located near the right end of the regressor range
        where a positive step maximally inflates a fitted slope.
      the_tell: >-
        The reported W-MID gamma 0.9739 EXCEEDS BOTH of its constituents
        (IMPL-A 0.9332, IMPL-B 0.7929). A pointwise minimum of two power laws
        cannot have a larger exponent than both. That is self-evident from the
        three numbers and requires no modelling to see. Fit quality is also
        materially worse for the mixed response than for the homogeneous one on
        the same window (R^2 0.9837 vs 0.99976; max |residual| 0.2915 vs 0.0597
        bits), with the largest W-MID residuals sitting exactly at the seam.
      attribution_officially_recorded: >-
        This is a CONTRACT-INTERNAL INCONSISTENCY EXECUTED LITERALLY, NOT AN
        EXECUTOR DEVIATION, exactly as the Validator determined.
        fit_protocol.response, C-ALT.carry_forward_rule and execution_order
        step 8 are jointly inconsistent once the optional extension is executed,
        and the frozen contract never resolved the interaction. The Executor
        followed all three literally, recorded the rule verbatim in the raw
        result, and reported gamma_A and gamma_B separately, so the defect is
        fully visible and fully recomputable from the archive without a new run.
        The Coordinator who froze the contract owns this defect.
      also_recorded: >-
        The defect is NOT among the four underspecifications the Executor
        declared (U-1..U-4). The Executor's own underspecification audit missed
        the one that actually moved a number. That is recorded as a gap in that
        audit - not as a deviation, and not as an excuse for the contract.
      direction: >-
        The artifact INFLATES gamma and therefore inflates c, i.e. it biases
        AGAINST the paper's Section 4.1 assumption and TOWARD red-team RT-C1. It
        is not a favourable-rounding artifact and must not be read as one.
      binding_requirement: >-
        No downstream record may quote gamma = 0.9739, gamma_local_top = 1.1706,
        or c = 0.8644 without stating that the response is heterogeneous across
        ell = 101/103 and giving the homogeneous readings: IMPL-A 0.9332 /
        1.0187 / 0.8283 and IMPL-B 0.7929 over 11..101.
      what_survives_unaffected: >-
        The mechanical prediction verdict ("confirmed" against the pre-registered
        band [0.75, 1.25]) and the band reading ("linear regime") are ROBUST to
        this defect: every homogeneous exponent either reviewer computed, 0.7929
        through 0.9735, lies inside the band. So for this implementation pair over
        this range, both anchors named in the contract before any datum - the
        paper's gamma_paper = 0 and RT-C1's gamma = 2 - fall outside the measured
        interval.
      repair: >-
        NC2a: run IMPL-B over the extension grid ell 103..211 at 4 samples with
        the committed seeds and harness, PRE-REGISTERING that if the composition
        explanation is right the min(A,B) slope over ell >= 11 must FALL to at or
        below gamma_A = 0.9332 and the W-ALL quadratic coefficient must move
        toward zero. Cheaper and to be done first at zero compute: report gamma_A
        and gamma_B as the primary homogeneous pair and demote min(A,B) to a
        diagnostic.

    - id: C
      title: "ADJUDICATION OF A GENUINE DISAGREEMENT BETWEEN THE TWO REVIEWERS: is the misspecification real?"
      the_disagreement: >-
        RED TEAM (RT2-C2): the curvature and the
        single_exponent_model_misspecified verdict "fired on a composition
        artifact"; gamma_local_top = 1.1706 "is not evidence that the exponent is
        rising"; and it explicitly declines to argue the exponent is still rising
        toward 2 at ell ~ 2^14. Its evidence: rolling 8-point local slopes in
        which the apparent acceleration is confined EXACTLY to the three windows
        straddling the ell = 101 seam, while the homogeneous IMPL-A local slope
        is flat at 0.93-0.97 from ell = 17 through ell = 197; plus a nested-window
        quadratic whose sign flips (+0.0488 on W-ALL, +0.0841 on W-MID, +0.1016
        on ell >= 23, +0.0443 on ell >= 43, -0.2951 on ell >= 101).
        VALIDATOR (F-1, "what survives"): the misspecification SURVIVES on a
        homogeneous IMPL-A response - curvature 0.0225, bootstrap CI
        [0.0194, 0.0366], still excluding zero, computed under the contract's own
        procedure and seed - with gamma_local_top 1.0187 rather than 1.1706. So
        it is real, at roughly half the reported magnitude, with the entire
        1.02 -> 1.17 gap attributable to the seam.
      ruling: >-
        THE EVIDENCE SUPPORTS THE VALIDATOR ON THE FACTUAL QUESTION, AND SUPPORTS
        THE RED TEAM'S OPERATIVE CONCLUSION. These are not the same question and
        the two reviewers were not answering the same one.
        (1) FACT: a residual curvature exists on a homogeneous series. Only the
        Validator ran that test - a homogeneous IMPL-A curvature with its
        bootstrap CI - and it re-derived the number from the committed data using
        the contract's own procedure and seed. The Red Team's sign-flip table was
        computed on the MIXED primary series and therefore cannot speak to the
        homogeneous residual, and its own homogeneous evidence is a rolling
        local-slope profile, not a curvature test. So "fired on a composition
        artifact" is upheld for the MAGNITUDE (0.0488 -> 0.0225 and 1.1706 ->
        1.0187) and is NOT upheld as a claim that the curvature vanishes on a
        homogeneous series. The `single_exponent_model_misspecified` declaration
        stands, at about half the reported size.
        (2) THE TWO REVIEWERS' NUMBERS ARE THE SAME OBSERVATION, NOT COMPETING
        ONES. Coordinator arithmetic on numbers both reviewers reported, labelled
        as arithmetic and not as a measurement: a quadratic y = a + bx + cx^2 has
        local slope b + 2cx, and an OLS slope fitted over a window equals
        b + 2c*xbar where xbar is that window's mean regressor value (exactly for
        symmetric spacing, to first order otherwise). The Red Team's bottom
        homogeneous window is ell in {2,3,5,7,11,13,17,19}, xbar = 2.901 in
        log2(ell); its top homogeneous window is ell in
        {163,167,173,179,181,191,193,197}, xbar = 7.493. With the Validator's
        homogeneous curvature c = 0.0225 that predicts a rise of
        2 * 0.0225 * (7.493 - 2.901) = 0.207 bits of slope between those two
        windows. The Red Team's own homogeneous IMPL-A table shows 0.7692 rising
        to 0.9718, a rise of 0.203. The Validator's residual curvature and the
        Red Team's homogeneous local-slope profile therefore agree to 0.004 -
        they are one observation reported two ways, not two findings in conflict.
        (3) THEREFORE THE OPERATIVE CONCLUSION IS THE RED TEAM'S, FOR A REASON ITS
        OWN NUMBERS SUPPLY: the residual homogeneous curvature is concentrated at
        the SMALL-ell end. On the Red Team's table the entire rise happens between
        the first window and the second (0.7692 -> 0.9411 by ell 29..59) and the
        profile is then flat at 0.933-0.972 out to ell 197. That is the regime the
        contract itself declared non-extrapolating when it fixed W-MID as primary
        before any datum ("the small-ell end is dominated by the fixed
        2*log2(p^2) exponentiation cost rather than by ell-dependent work, which
        is exactly the regime that does NOT extrapolate toward ell ~ B_opt"). A
        startup effect at ell < 29 is not an acceleration at the top of the range,
        and NEITHER gamma_local_top = 1.1706 NOR the homogeneous 1.0187 is
        evidence that the exponent is still rising toward 2 at ell ~ 2^14.2.
      what_the_official_record_carries: >-
        (i) Misspecification: REAL on a homogeneous series, curvature 0.0225 with
        CI [0.0194, 0.0366], roughly half the reported magnitude. (ii) The
        reported c_quad = 0.0488 and gamma_local_top = 1.1706 are inflated by the
        seam and may not be cited without the homogeneous values 0.0225 and
        1.0187 beside them. (iii) Neither value licenses a 6.5-octave
        extrapolation in either direction, and the run's own non-claim stands:
        this experiment cannot discriminate between per-entry cost laws that agree
        over ell <= 211 and diverge at ell ~ 2^14.
      residual_uncertainty_recorded_either_way: >-
        Neither reviewer isolated WHETHER the residual homogeneous curvature is a
        small-ell startup effect or a slow genuine rise. The Coordinator's
        consistency arithmetic above is suggestive of the former and is not a
        test. The Red Team's nested-window instability shows the diagnostic has
        little power at the top of the range, and its ell >= 101 window was
        computed on the mixed series, so no homogeneous top-of-range curvature
        with adequate power exists anywhere in the record. NC2a plus a homogeneous
        re-fit, including a homogeneous nested-window curvature with bootstrap
        CIs, is the discriminating control, and the Validator's 0.0225 should be
        re-derived under it. Until then the residual is recorded as REAL,
        SMALL-ell-CONCENTRATED, and NOT EXTRAPOLABLE.
      method_note: >-
        The two positions were adjudicated, not averaged and not chosen by
        preference. No number here was invented: every input is a figure one of
        the two reviewers computed from the committed archive, and the one piece
        of Coordinator arithmetic is labelled as such.

    - id: D
      title: "The Red Team retracts its own prior calibration RT-C1. The 'NIST-I margin might be ~zero' scenario is RETIRED."
      finding: >-
        ACCEPTED AS A CORRECTION TO THE PRIOR RECORD, and recorded as a RESULT OF
        THIS BATCH. RT-C1 (coordination/tasks/TASK-20260724-P13-RT/
        red_team_report.yaml), the calibration on which
        H-WESO-001.adjudicated_positions.concrete_threat_nist1 currently rests,
        contains an arithmetic error identified by its own author in an
        independent session: step (b) correctly divides by ell+1 and step (c)
        then charges ell^2 PER ENTRY anyway, so gamma = 2 is off by exactly one
        factor of ell. Lemma 3.3 of the frozen paper amortises explicitly over
        "each batch of (<=) ell + 1 new entries", and RUN-PEC-6be870-a's committed
        samples confirm entries(ell) = ell + 1 at all 484 samples (C-BASE.3,
        484/484 exactly ell+1 distinct roots; the non-backtracking convention
        subtracts one only at ell = 2). The correct naive schoolbook calibration
        is gamma = 1, which is what the contract pre-registered and approximately
        what the homogeneous IMPL-A series measured (0.9332). Separately, RT-C1
        headlined the c = 2.0 margin row (2.27 bits) while its own derivation
        supported only c >= 1.78 (5.87 bits), overstating the objection by 3.6
        bits.
      consequence_for_official_state: >-
        The "NIST-I margin might be ~zero / within a few bits of zero under
        defensible constant-factor calibrations" scenario is RETIRED from the
        programme's active scenario set. Under every reading constructible from
        RUN-PEC-6be870-a the modelled NIST-I margin at w = 2^30 lies between 5.40
        and 22.67 bits and clears both the 2.23-bit and the 3.51-bit
        irreproducibility band. The c = 2.0 row is not supported by this data:
        the homogeneous IMPL-A local slope is flat at 0.93-0.97 from ell = 17 to
        ell = 197.
      what_survives_of_rt_c1: >-
        Its load-bearing half, and it is now stronger than when it was written:
        c = 0 is not a neutral default and the omitted per-entry work is
        UNMEASURED rather than small. That is confirmed - but through the
        INTERCEPT (adjudication A), not through the exponent.
      coincidence_flag_carried_at_the_red_teams_own_insistence: >-
        Intercept-corrected c at NIST-I (1.42-1.80) lands numerically almost on
        RT-C1's original 1.78-1.88. This is a COINCIDENCE arrived at for an
        entirely different and better-supported reason, and it is NOT confirmation
        of the original argument. No record may read it as one. The Red Team
        flagged this itself; the flag is now official.
      related_prior_positions:
        - >-
          RT-C2 NARROWED: table access is not the binding constraint at w = 2^30
          with 256-bit field arithmetic (a random access into a 2^30-entry table
          and a handful of 256-bit modular multiplications are the same order of
          magnitude). What survives is narrower and sharper: the model's free
          +0.5 bits of margin per bit of memory is approximately cancelled by real
          latency growth beyond DRAM, so MARGINS ARE QUOTED AT w = 2^30 AND THE
          LARGER-w ROWS ARE NOT READ AS IMPROVEMENTS. The latency figures behind
          this are the Red Team's engineering estimate, not a retrieved citation,
          and no margin number depends on them.
        - >-
          RT-S1 PARTIALLY WEAKENED, NOT WITHDRAWN: the specific sub-claim about a
          near-zero NIST-I margin is retired as above; the general position - that
          no scope statement stronger than the frozen paper's own abstract hedge
          is supported - STANDS, now for reasons of MAGNITUDE rather than of SIGN.

    - id: E
      title: "Completion criteria, assessed strictly. Criterion 1 is NOT MET; the goal stays active."
      criterion_1: >-
        "An empirical per-entry cost calibration (NC-2) decides the NIST-I margin
        with error below the irreproducibility band, and the result survives
        independent Validator and Red Team review." NOT MET, on both halves.
        (a) ERROR: the defensible modelled margin span at w = 2^30 is 5.40 to
        22.67 bits, a width of about 17.3 bits, against irreproducibility bands of
        2.2309 bits (the tightest correct band for a NIST-I TIME statement) and
        3.5133 bits (the largest absolute deviation anywhere in RUN-WESOVOW-001's
        C1 control). 17.3 exceeds both by roughly a factor of five to eight. The
        calibration did not decide the margin to within the band; it narrowed the
        prior 32.00-bit span by 46%. (b) SURVIVAL: the calibration did not survive
        independent review intact - the extrapolation law was found defective
        (adjudication A) and the headline statistic heterogeneous (adjudication
        B). Both reviewers, independently, decline to move the NIST-I question.
      criterion_2: >-
        "A Coordinator evidence record, decision, and hypothesis-status update
        are committed through a verified ledger archive." MET ONLY ON VERIFICATION
        of the TASK-20260802-e804d1 archive by the dispatcher's post-commit
        verifier. It is not asserted as met by this record: a record in a working
        tree is not durable evidence, and an official transition may not rest on
        an unverified commit.
      contract_completion_gate: >-
        UNMET as a matter of record: 25 of the 26 required core ell were measured;
        ell = 97 was lost to a transient fetch obstruction (curl return code 35,
        connection reset). Per AGENTS.md rule 5 that is an INFRASTRUCTURE OUTCOME
        AND IS NEVER MATHEMATICAL EVIDENCE about the attack, and it is recorded as
        such here and in EV-PEC-2e67ff. The Validator verified the absence five
        independent ways, re-fetched the URL itself and obtained exactly the byte
        length and SHA-256 the Executor had recorded for an earlier copy it did
        not use (093fead98fcde6966e652ac2651552f8be050c4433f6d7f341baaf71dc3d16ab),
        which both authenticates the Executor's record and shows the obstruction
        was transient; and it measured ell = 97 supplementarily, finding the
        omission moves W-MID by 0.0013. The gap is immaterial to every reported
        number, the gate nevertheless remains UNMET, and only a
        Coordinator-authorised successor run can close it.
      goal_status: >-
        GOAL-P13-001 REMAINS `active` with exactly one next action. It may NOT be
        marked completed: criterion 1 is not met, and closure independently
        requires the three-model quorum of AGENTS.md rule 13 - three CONCUR
        attestations with pairwise-distinct RESOLVED model ids - which this
        harness cannot supply, since every subagent resolves to the same inherited
        model. GOAL-P13-001 appears in tools/validate_ledger.py's
        PRE_QUORUM_GOAL_IDS exemption; that exemption is a prospective-rule
        artifact for goals closed before the quorum existed and MUST NOT be used
        as a route to close this goal without a quorum. A fabricated attestation
        would be worse than an open goal.
      budget: >-
        Two of the four batches in the campaign budget are now spent (BATCH-001,
        BATCH-002). Two remain.

    - id: F
      title: "What the batch DID establish, recorded so it is not lost among the caveats."
      the_solid_positive_result: >-
        The frozen paper's Section 4.1 assumption that "constructing a table costs
        a single F_{p^2}-operation per entry" is REFUTED AT THE TESTED SCALE, IN
        THE ATTACK'S DISFAVOUR. In the paper's own unit, the measured per-entry
        cost is 1843.5 counted F_{p^2} multiplications at ell = 2 and 94023.4 at
        ell = 211 - 10.8 to 16.5 bits above the assumed 1. This result does not
        depend on the defective law, on the ell-exponent, or on the F-1 seam: the
        run's own null object, whose per-entry cost is O(1) in ell by
        construction, still costs ~4900-5100 multiplications per entry, and the
        ell-independent component is structural in the committed pipeline
        (root-finding requires x^{p^2} mod f, i.e. ~2*log2(p) polynomial squarings
        per batch of ell+1 entries), so no choice of multiplication routine removes
        it - only its polynomial-degree cofactor changes. Consequently the c = 0
        corner inherited from Section 4.1 is not supported by any reading
        constructible from this run: even the Red Team's most attack-favourable
        scenario (quasi-linear or batched multiplication, gamma -> 0, intercept
        only, p-scaled) carries 11.60 bits of NIST-I overhead. SCOPE: measured at
        p ~ 2^40 over ell <= 211 for this implementation pair, `medium` tier; the
        structural argument for the surviving intercept is DERIVED, not measured
        for a quasi-linear implementation.
      the_process_result: >-
        A frozen pre-registered contract, executed literally, produced a headline
        that two independent reviewers each falsified from the contract's own
        archived data at zero new compute - one through the run's own null
        control, the other through an arithmetic impossibility visible in three
        committed numbers. The pre-registration is what made both falsifications
        possible and cheap, and the null-object requirement of
        docs/inventor-protocol.md section 3 is what supplied the decisive object.
        That is the machinery working, and it is recorded as a positive outcome of
        the batch rather than as an embarrassment.
      independent_verification_quality: >-
        The Validator reproduced the fit to a difference of 0.0e+00, the bootstrap
        CIs to 1e-16, and eleven samples of its own choosing bit-for-bit; verified
        10/10 declared hashes and the full commit chain including that the frozen
        contract is byte-unchanged since 0e773e9a; re-verified the
        modular-polynomial provenance end to end by live re-fetch; and re-checked
        1480 algebraic relations with an evaluator it wrote itself from the
        integer bivariate coefficients. All ten pre-registered controls pass and
        the Validator concurs on all ten.
      what_the_narrowing_is_worth: >-
        The defensible NIST-I margin interval at w = 2^30 narrowed from
        [2.27, 34.27] bits (width 32.00, lower end INSIDE the irreproducibility
        band) to [5.40, 22.67] bits (width 17.27, lower end OUTSIDE both bands) -
        a 46% narrowing plus the qualitative gain that the lower end now clears
        the band. It is a real contribution. It is NOT a determination of c: the
        residual width is set almost entirely by quantities this experiment did
        not measure.

  official_positions_after_this_decision:
    concrete_threat_nist1: >-
      INCONCLUSIVE - unchanged as a verdict, materially revised in content. Both
      reviewers reach this independently and the Coordinator concurs. Two
      scenarios are retired: the "overhead swallows the NIST-I advantage" branch
      (which rested on RT-C1's arithmetic error) and the c = 0 corner inherited
      from Section 4.1 (refuted by the measurement itself). The surviving question
      is whether the modelled advantage over Delfs-Galbraith at w = 2^30 is
      roughly 5 bits or roughly 23 bits. That interval is 17.3 bits wide against
      irreproducibility bands of 2.23 and 3.51 bits, its width is dominated by an
      unwritten subroutine and an unmeasured p-scaling, and AGENTS.md rule 7
      forbids presenting an 80-bit-field measurement over ell <= 211 as validation
      at NIST-I. A 17.3-bit interval is not a concrete threat assessment.
    concrete_threat_nist3_nist5: >-
      UNCHANGED (not threatened under all tested overhead scenarios). This batch
      measured nothing that bears on it beyond the same law defect, which applies
      to those rows equally and is repaired by the same NC2b recomputation.
    mathematical_validity_conditional: "UNCHANGED. Untouched by this batch."
    heuristic_1_status: >-
      UNCHANGED. Nothing in this batch bears on Heuristic 1; the run says so
      itself. The prior red-team objections RT-H1..RT-H4 remain open and controls
      NC-3 and NC-6 remain unrun. Recorded here because P0 sits inside every
      margin number in this record: a constant-factor error in P0 at the operating
      point moves all margin rows by the same amount, so a programme that resolves
      c to +-2 bits while P0 carries an unbounded constant-factor uncertainty has
      optimised the wrong term. That is a live prioritisation concern for
      BATCH-003/004, entered here so it is not lost.

  rationale:
    - >-
      The run set passed every validity pre-check before any interpretation: one
      authorized run, one executed, one terminal; a schema-complete manifest;
      seed integrity confirmed by an independent bit-for-bit re-execution of
      eleven samples the producer did not select; raw and summary tables in exact
      agreement under the Validator's own recomputation; and a null control that
      is genuinely O(1) per entry, read from source rather than taken on trust.
      The record is therefore evidence, and the two material defects are
      interpreted rather than used to send the run back.
    - >-
      The extrapolation law is refuted from inside the run itself, by an object
      the contract required for an entirely different purpose. That is the
      strongest checkable refutation the result admits, it was archived before
      this decision, and it does not depend on any reviewer's judgement -
      the Coordinator re-read both load-bearing numbers from the committed raw
      result. The reported c values therefore cannot stand, and a prohibition on
      citing them is cheaper and more honest than a caveat.
    - >-
      The headline gamma exceeds both of its constituents, which is
      arithmetically impossible for a pointwise minimum of two power laws. That
      single fact, visible in three committed numbers, is enough to disqualify it
      as an exponent, and it is a defect of the contract this Coordinator froze,
      not of the execution.
    - >-
      Where the two independent reviewers genuinely disagreed, the disagreement
      was adjudicated on the merits rather than averaged: the only party that ran
      the homogeneous curvature test is the Validator, and its number is
      quantitatively consistent with the Red Team's own homogeneous local-slope
      profile, so the misspecification is real and small and concentrated where
      the contract itself said the data do not extrapolate.
    - >-
      A calibration whose defensible span is 17.3 bits against a 2.23-3.51 bit
      band has not decided the NIST-I margin, however much it narrowed it. The
      completion criterion is therefore assessed as NOT MET on the numbers, with
      no adjustment to the criterion after seeing the outcome.
    - >-
      A red team retracting its own prior objection, in an independent session,
      against committed data, is a first-class result and is recorded as one -
      including its own flag that the corrected number's proximity to its
      original number is a coincidence rather than a confirmation.

  prohibitions_binding_on_downstream_records:
    - >-
      No record may cite c = 0.864 (nor 0.771 / 0.868 / 1.0389 / the c_kappa
      values) at NIST-I as this run's overhead estimate, until NC2b is on the
      record. They may be cited only as the output of a law now known to be
      defective, with adjudication A attached.
    - >-
      No record may quote gamma = 0.9739, c_quad = 0.0488, or gamma_local_top =
      1.1706 without the heterogeneity statement and the homogeneous readings
      (0.9332 / 0.7929; 0.0225; 1.0187).
    - >-
      No record may present any figure in this batch as a cryptographic-scale
      measurement, or the extrapolated c as carrying a claim tier. The claim-tier
      ceiling of the measurement is `medium`; the extrapolation carries no tier.
    - >-
      No record may describe RUN-PEC-6be870-a as having met its completion gate,
      because it did not; and no record may treat the ell = 97 fetch obstruction,
      or the absent /usr/bin/time, as mathematical evidence about the attack.
    - >-
      No record may cite the Validator's supplementary measurements (the null over
      ell 103..211, or ell = 97) as run evidence: they were produced in the review
      session, are not part of the producer receipt, and repair neither the null
      coverage gap nor the completion gate.
    - >-
      Margin statements are quoted at w = 2^30; the larger-w rows are not read as
      improvements (RT-C2 as narrowed).

