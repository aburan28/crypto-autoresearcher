    scopes and no contact. This decision adjudicates those two reports and
    nothing else. IT IS A DISPOSITION ABOUT A PLAN, NOT ABOUT A RESULT.

  decision: revise
  decision_label: dual_revise_supersession_owed_not_softened
  disposition: dual_revise_supersession_owed_not_softened
  disposition_note: >-
    BOTH INDEPENDENT REVIEWS RETURNED REVISE and this decision records that
    faithfully. The Validator's role-contract terminal verdict is `incomplete`
    and its task-card disposition is REVISE; the Red Team's verdict is REVISE
    with 20 objections, 11 of them material. Neither verdict is softened,
    averaged, reinterpreted, or read as a pass, and NO MATERIAL OBJECTION FROM
    EITHER REVIEW IS OVERRULED. A REVISE approves nothing; it instructs the
    Coordinator to adjudicate by superseding record, which is the single next
    action below.

  target_ids:
    - TASK-20260815-f04b54
    - TASK-20260815-39fd27
    - TASK-20260815-fa8f06
    - TASK-20260815-3ec919
    - BATCH-25e27c
    - EXP-JINV-bd141d

  verdict_mirror:
    validator:
      task_id: TASK-20260815-fa8f06
      report_id: VAL-20260815-93b520
      role_contract_verdict: incomplete
      task_card_disposition: REVISE
      admissibility_as_recorded: >-
        ADMISSIBLE as to all eighteen preservation bindings, all recomputed hashes
        and sizes, the commit binding, and every arithmetic claim. NOT YET
        ADMISSIBLE as to its own material-findings count and its MF-2 statement,
        which require a superseding record. Nothing in the package needs to be
        re-authored.
      reason_for_revise_as_recorded: >-
        One reason only: MF-2, one of the package's own two declared material
        findings, does not survive independent recomputation and is REFUTED.
      blocking_items: 'numbered_actionable_items 1 and 2, both requiring the MF-2 supersession before any decision restates MF-2'
    red_team:
      task_id: TASK-20260815-3ec919
      report_id: RT-20260815-3ec919
      verdict: REVISE
      objections_total: 20
      objections_material: 11
      headline_as_recorded: >-
        The package's headline dispositions survive attack and could not be
        broken: gates_cleared 0, resource_incomplete fail-closed, all eighteen
        obligations carried verbatim with none dropped, reworded, split, merged or
        generalized, zero experiment runs, and no operative authorization field
        true. Every file hash, derived manifest hash, arithmetic check and
        exceedance factor independently recomputed AGREES. There is no hash
        mismatch to report.
    agreement_scope: >-
      The two reviews agree on the recomputation (zero mismatches), on the
      eighteen-obligation exhaustiveness, on the fail-closed disposition, on
      MF-2's refutation, and on the finding that binding all three manifests did
      not overstep. They differ in emphasis and in what they attacked, not in
      verdict.

  what_the_recomputation_established:
    - >-
      ZERO MISMATCHES ACROSS BOTH REVIEWS. Union: 24 or more sha256 values
      recomputed, 13 file sizes measured, 9 commits verified for existence,
      reachability and actual first parent, all five declared arithmetic checks
      (ARITH-1..ARITH-5) reproduced by each review separately, all five exceedance
      factors reproduced including every hand-worked intermediate remainder, and
      all four archive path hashes matching the committed blobs. Not one value
      disagreed. This is recorded FIRST because it is the largest fact in the
      batch and it must not be buried under the objections.
    - >-
      A full deterministic re-derivation from the committed public static verifier
      (bytes hash-verified before running; exit 0, stderr empty, status pass,
      working tree byte-identical before and after) reproduced the six positive
      hashes, the 441350-node recursive-type census, all three alias/legacy
      manifests, 45/45 alias rejections with coverage parity, 122/122 legacy
      rejections at their exact terminals, all three stored-object bindings, and
      M-104 as the sole lockstep counterfeit. Both bindings the producer ADDED
      without being able to check them (7415d195 and 20ab60e1) are correct.
    - >-
      The eighteen obligations are EXHAUSTIVE, not merely counted. The Validator
      concatenated the eighteen obligation_verbatim strings and reconstructed the
      goal head's "It must preserve ... ." clause BYTE-IDENTICALLY; the Red Team
      reached the same conclusion independently and recorded it as the thing it
      most expected to break.
    - >-
      resource_incomplete is FAIL-CLOSED AT BOTH ENDS, gates_cleared is 0, no
      prohibited credit was taken by any route the Red Team tried, no frozen cap
      was widened, and the eight retained-byte terms sum exactly to the declared
      total so no cell was omitted. PRODUCING AN ESTIMATE DID NOT CLEAR A GATE.
    - >-
      Custody is sound: reachable commit, declared parent equal to the actual
      first parent, exactly four added paths, the control-plane queue correctly
      excluded, the goal head absent from the commit, committed bytes equal to the
      working tree, zero v6-or-earlier bytes changed, and zero paths written
      outside the declared scope.

  mf2_withdrawal:
    finding: MF-2
    action: WITHDRAWN_BY_SUPERSESSION
    convergence: >-
      Validator V-1 and Red Team O-1 refuted MF-2 INDEPENDENTLY AND WITHOUT
      CONTACT. This is the batch's most important result and it is recorded as
      such rather than as a footnote to the objections.
    the_true_negative_and_the_false_conclusion: >-
      The producer's grep for the literal 441350 in the committed BATCH-d7e255
      dispatch_queue.json returned a TRUE NEGATIVE - the literal genuinely does
      not occur, and both reviews confirmed that. The tool did not lie and nothing
      was fabricated. The CONCLUSION drawn from the empty result is FALSE.
    the_refutation_by_file_and_line: >-
      That file writes the value with a thousands separator. "441,350" occurs
      exactly once, at line 624, inside
      tasks[TASK-20260813-5b8a62].completion_note in
      coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/dispatch_queue.json,
      which is EXACTLY the field the frozen contract names, reading "all six
      inherited positive hashes, 441,350 recursively typed nodes, and all three
      stored-object bindings". The same note contains "and both latent dict/list
      container probes" verbatim, and tasks[TASK-20260813-1851d0].completion_note
      contains "2/2 latent container probes". The obligation-8 provenance line
      reproduces IN FULL, for both halves, at the level of value and location.
    residual_true_statement: >-
      The frozen contract's obligation-8 provenance line is exact about location
      and value and imprecise only in that the cited queue renders the integer
      with a thousands separator.
    propagation_not_repaired: >-
      The false negative ALREADY PROPAGATED into committed artifacts - the
      preservation manifest (obligation 8, the material_findings block, and
      summary.material_findings 2), the producer runtime receipt, the
      TASK-20260815-39fd27 snapshot receipt, and the snapshot commit message of
      7ee825ff - and NONE OF THEM IS EDITED. They are immutable. The withdrawal is
      by supersession and by reference only, which is what both reviews required
      and what the package's own SR-5 demands.
    same_model_discount: >-
      Recorded honestly: both reviews resolve to claude-opus-5 on the same
      backend, so this convergence is independent by SESSION, not by MODEL, and
      two agreeing same-model reviews are one model's judgement rendered twice.
      The finding carries weight here because it is a one-command, mechanically
      reproducible fact about committed bytes - not because two sessions agreed.

  obd1_carried_forward_open:
    status: OPEN
    confirmed_by_both_reviews: true
    binding_three_manifests_did_not_overstep: >-
      CONFIRMED BY BOTH REVIEWS. The frozen contract's own both_manifests_reading
      clause instructed the producer, in terms, to bind a third distinct
      alias-suite manifest if it found one and to record the discrepancy as an
      open binding defect rather than silently picking a reading. The producer did
      exactly that. This is compliance with a written instruction, not an
      extension of it.
    validator_evidence: >-
      The third manifest 7415d195... was verified in EIGHT committed places (the
      producer named three), independently rederived from the committed public
      validator, and shown distinct from both bound manifests.
    reading_not_selected: >-
      The Validator judged Reading B better supported and DELIBERATELY DECLINED TO
      SELECT IT, because choosing a reading of the goal head's own next_action is
      a goal-head interpretation act. THIS DECISION SELECTS NO READING EITHER.
      Resolving OBD-1 requires a separately authorized superseding decision that
      this archive does not hold and does not take.
    preservation_consequence_today: >-
      ZERO. Obligation 1 already binds v6.yaml and v6-derivation-fixtures.json
      byte-for-byte at hashes both reviews recomputed, so under either reading the
      third manifest is already preserved transitively. OBD-1 is an INTERPRETIVE
      defect in the frozen contract, not an integrity defect in the tree, and must
      not be prioritized as though the tree were at risk.

  obd2_opened:
    status: OPENED
    raised_by: 'red team objection O-8'
    statement: >-
      Obligation 6's contract under-binding was disclosed as OBD-1 and left open,
      while obligation 8's IDENTICAL under-binding - an obligation whose own words
      name "the recursive type manifest" against a contract binding block that
      carries no manifest hash - was silently repaired with open_binding_defect
      false. The added binding 20ab60e1 is CORRECT and both reviews rederived it;
      only its classification as a non-defect is wrong. OBD-2 is opened here with
      the same bind-and-do-not-resolve treatment OBD-1 received, and is not
      adjudicated, repaired, or closed by this decision.

  material_objections_carried_forward_open:
    - id: O-2
      note: >-
        E1's stated ground is contradicted by
        experiments/EXP-JINV-bd141d/runs/RUN-JINV-matched-n19507-e0451f/manifest.yaml,
        which pins wall 289.189061 s, cpu 288.21171 s and peak_rss 113623040 B
        with all_pinned true and BOTH obligation-17 harness paths pinned by
        sha256, inside the producer's own read scope. Obligation 17 bears on the
        ARCHIVE SCOPE of those two paths, not on their source pinning. THE
        NARROWEST CONCLUSION IS PRESERVED UNCHANGED - E1, E2 and E3 stay UNDERIVED,
        because the committed run sits five to eight orders of magnitude below the
        Phase B cardinalities and is a single unreplicated observation on one host
        - and only the stated reason is wrong.
    - id: O-9
      note: >-
        EV-PRE-1 through EV-PRE-6 omit OBD-1 and MF-2 entirely, so a later
        decision could satisfy all six preconditions, grant PB-1 through PB-5, and
        leave OBD-1 unadjudicated with nothing in the authorization boundary
        refusing it.
    - id: O-10
      note: >-
        Authorization leak in wording: boundary item 1 presupposes the
        determination it asks a later decision to make ("stating explicitly THAT
        it materializes nothing"), where item 2 is correctly conditional ("stating
        explicitly WHETHER ... and refusing it if it is not"). No authorization is
        created by the leak and none is cured by naming it; every operative
        authorization field in all four artifacts is false or 0.
    - id: RC-1
      note: >-
        The Red Team's cheapest omitted control, the retained-byte attribution
        table, costs zero compute and zero runs because every number is already in
        a committed file, and it settles O-3, O-5 and O-6 at once by showing the
        resource question is one parameter deep (99.5658 pct of the retained total
        is one term) rather than five gates wide.
    - id: 'O-3 through O-8, O-11 through O-20, V-2, V-4 through V-8'
      note: >-
        All remain OPEN and none is overruled, resolved, or dismissed by this
        decision. They are carried in EV-JINV-79b41c and in the two committed
        reports, which remain the authority on their exact content.

  independence_honesty:
    independent_session: true
    independent_context: true
    from_scratch_reading: true
    independent_model_family: false
    resolved_model_id_of_both_reviews: claude-opus-5
    statement: >-
      Recorded without softening. Both reviews, and the reviewed producer work,
      resolve to claude-opus-5 on the same backend. INDEPENDENT HERE MEANS
      INDEPENDENT SESSION, CONTEXT AND FROM-SCRATCH READING - NOT INDEPENDENT
      JUDGEMENT FROM A DIFFERENT MODEL FAMILY. Two agreeing same-model reviews are
      one model's judgement rendered twice; correlated blind spots are possible and
      unmeasured. The substantive independence the reviews added is a SHELL: the
      producer and the snapshot combined computed 0 hashes, measured 0 sizes and
      verified 0 commits.
    quorum_claimed: false
    attestations_gathered: 0

  rationale:
    - >-
      Both independent reviews returned REVISE, so the disposition is REVISE. The
      Coordinator's job here is to record two verdicts faithfully and to route
      their material findings into a superseding record - not to pick the more
      convenient one, not to average them, and not to convert a REVISE into an
      approval because the recomputation was clean.
    - >-
      The recomputation WAS clean, and that is recorded first and in full: zero
      mismatches over 24 or more hashes, 13 sizes, 9 commits, five arithmetic
      checks, five exceedance factors, four archive path hashes and a complete
      deterministic re-derivation. Burying that under the objections would
      misrepresent a package whose bindings all held.
    - >-
      MF-2 is withdrawn because two independent sessions refuted it by
      recomputation and located the occurrence by file and line. The producer's
      search was honest and its tool returned a true negative; the inference was
      wrong. Correcting it by supersession, never by edit, is the only route the
      immutability rule and the package's own SR-5 permit.
    - >-
      OBD-1 is carried forward OPEN because selecting a reading of the goal head's
      next_action is a goal-head interpretation act that needs its own
      authorization. The Validator, holding the stronger evidence, declined to
      select; this decision declines for the same reason. Its preservation
      consequence today is zero, which keeps it in proportion without dismissing
      it.
    - >-
      OBD-2 is opened because the asymmetry O-8 identifies is real: two identical
      contract under-bindings received opposite treatments, and the one that was
      silently repaired is invisible to any later reader of the frozen contract
      alone.
    - >-
      O-2's narrowest valid conclusion is preserved deliberately. A committed run
      manifest contradicts E1's stated GROUND, not E1's DISPOSITION; the estimates
      stay underived, and correcting the reason while keeping the disposition is
      the honest repair rather than an occasion to produce a number.
    - >-
      RC-1 is folded into the successor because it costs nothing, uses only
      committed integers, and settles three separate cost-model objections at
      once. Omitting a zero-cost control that the reviewers already computed would
      be the cheapest possible failure of the null-object discipline.
    - >-
      Nothing in this batch is science. No hypothesis moved, no completion
      criterion advanced, no pause condition engaged, no gate cleared, no claim
      rose above toy tier, no exponent moved, and sota_delta is zero. Recording a
      planning-gate disposition as anything more would be the scope inflation the
      whole batch was built to prevent.

