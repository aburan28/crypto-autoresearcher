  limitations:
    - This is a disposition about a STATIC PLANNING DOCUMENT. It records no implementation, experiment, control, run, observation, metric, measurement, certificate, proof, mathematical evidence, scientific evidence, or research-status transition.
    - Both verdicts bind only the exact four-path snapshot 7ee825ff9849542d681e02781fcaaa21a36ca5fb and transfer to no altered or reconstructed bytes.
    - The reviews' independence is independence of SESSION, not of MODEL; both resolve to claude-opus-5 on the same backend, and their agreement must not be presented as stronger corroboration than that.
    - Neither review independently rederived any of the nine stage cardinalities, so the whole cost model still rests on a single committed source, as the producer disclosed and both reviewers repeated rather than resolved.
    - Obligation 4's order identity was read, not rederived; no committed tool reproduces it, and obligation 2's density half was read from v6.yaml.
    - The Validator's rederivation inherits the committed verifier's correctness; its bytes were hash-verified and it was previously red-teamed, but its internal logic was not audited line by line.
    - Hash recomputations bind this HEAD and the v6 approval snapshot only; neither reviewer fetched origin/main, and a divergent copy on an unmerged branch cannot be excluded by either report.
    - Failing to break the package is not evidence that the package is correct, and the Red Team recorded its unbroken items as things it could not break rather than as things that are true.
    - This decision resolves neither OBD-1 nor OBD-2, adjudicates none of the twenty red-team objections, and produces none of the six required controls; it routes them to one successor and leaves them open.

