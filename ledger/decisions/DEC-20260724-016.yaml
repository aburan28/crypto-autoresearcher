coordinator_decision:
  id: DEC-20260724-016
  context: 'GOAL-P13-001 assessment of the frozen external claim SRC-P13-WESOLOWSKI-2026 (Wesolowski
    2026, supersingular isogeny problem in time and memory p^{1/3+o(1)}): producer analysis
    of Heuristic 1 (TASK-20260724-P13-HEUR), executor cost model EXP-WESOVOW-001 (TASK-20260724-P13-COST),
    independent proof review (TASK-20260724-P13-REV) with scoped repair (TASK-20260724-P13-REV-R1),
    independent validation (TASK-20260724-P13-VAL), and independent red team (TASK-20260724-P13-RT),
    over verified snapshot archives, after infrastructure incident INCIDENT-20260724-P13-01.'
  decision: refine_and_expand
  target_ids:
  - H-WESO-001
  - EXP-WESOVOW-001
  - GOAL-P13-001
  - SRC-P13-WESOLOWSKI-2026
  rationale:
  - The proof review found no mathematical error in any verifiable part; the four recorded
    defects (Algorithm 1 seeding, Corollary 1.2 citation and silent GRH import, Section 4.1
    lower-bound mislabel, P0 sign slip) are non-fatal and repairable by the author; the load-bearing
    external bound arXiv:2607.14624 is verified.
  - 'Heuristic 1 survived a dedicated falsification attempt: the producer''s trace-formula
    first moment matches the heuristic exactly, no exponent-breaking bias exists among the
    channels checked, and the red team failed to break the exponent; but the heuristic''s
    tail at the operating point u ~ 13 has zero experimental resolution, so it remains an
    assumption, not evidence.'
  - The NIST-I concrete margin is smaller than the cost model's own irreproducibility band
    (2.3 bits vs 3.51 bits), so neither 'threatened' nor 'safe' is an honest official position;
    the deciding measurement is the per-entry table construction cost.
  - NIST-III and NIST-V margins (19.6-50 bits at overhead c = 2) exceed the irreproducibility
    band under every tested scenario; no parameter change is warranted from this record alone.
  evidence_refs:
  - EV-WESO-001
  - coordination/tasks/TASK-20260724-P13-REV/review_report.yaml
  - coordination/tasks/TASK-20260724-P13-REV-R1/review_tail_report.yaml
  - coordination/tasks/TASK-20260724-P13-RT/red_team_report.yaml
  - coordination/tasks/TASK-20260724-P13-VAL/validation_report.yaml
  - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/execution_report.yaml
  - research/P13-HEUR-001/heuristic_analysis.md
  status_transitions:
  - target: H-WESO-001
    from: specified
    to: analyzed
    rationale: Conditional mathematical validity supported at independent-review level; Heuristic
      1 unproven but not falsified; concrete NIST-I threat inconclusive; NIST-III/V not threatened
      under tested scenarios.
  outcome_classification_adjudication:
    executor_reported: valid_run_partial_control_failure
    official: valid_run_partial_control_failure
    authority: Validator confirmed the receipt VALID-WITH-OBSERVATIONS and confirmed the partial
      control failure (0.05-3.51 bit deviations from the paper's five concrete pairs) is disclosed
      consistently in spec, report, manifest, and receipt; red team adjudicated the deviation
      as most plausibly the paper's unstated conventions, cutting against over-confidence
      in both directions.
  limitations:
  - No cryptographic-size attack was executed or authorized; all cost figures are scenario-model
    observations.
  - The assessment binds to the frozen text SRC-P13-WESOLOWSKI-2026; later versions of the
    paper are out of scope.
  - Model-policy aliases were not resolvable in this harness; all inference ran with explicitly
    recorded fallback per AGENTS.md rule 11.
  next_controls:
  - id: NC-2
    priority: highest
    description: 'Empirical overhead calibration: instrument a proof-of-concept implementation
      (Panny''s p-one-third.py or equivalent) at p ~ 2^40 to measure the true per-entry cost
      of Algorithm 1 (modular polynomial evaluation + root finding) and hence the hidden c;
      decides between a ~34-bit and a ~2-bit NIST-I margin.'
  - id: NC-1
    priority: high
    description: Convention sweep for the Section 4.1 pairs (Psi evaluation, B grid, rounding)
      to close the 0.05-3.51 bit irreproducibility band.
  - id: NC-3
    priority: medium
    description: Sampler uniformity validation and the l = 2 parity statistic of the minimal
      degree on Aubry-Oyono-Vincent ground truth (the one prime the producer's nondegeneracy
      argument does not cover).
  knowledge_promotion:
    promoted: []
    not_warranted: 'The decision is refine_and_expand: it does not conclude the line, it commissions
      more work. The record''s own limitations and next_controls state what is still open,
      so there is no established result to promote yet. Recorded 2026-08-02 under CORR-20260802-010
      from the decision''s own content; no new judgement is introduced and nothing is withdrawn.'
  decided_by: coordinator
