coordinator_decision:
  id: DEC-20260911-53a435
  context: >-
    Approving EXP-ECDLP-e36df2 (resolution-matched, degeneracy-screened
    re-test of the Teichmuller non-homomorphic contrast, discharging the
    H-ECDLP-6a9479 claim-3 remediation named in EV-ECDLP-95ec68's
    unresolved_confounds and DEC-20260911-74c9dc's next_actions) for
    execution, per /design-experiment step 4's committed-approval-decision
    requirement, following the precedent of DEC-20260905-908616 for
    EXP-ECDLP-a26bde's own approval.
  decision: approve
  target_ids: [H-ECDLP-09125b, EXP-ECDLP-e36df2]
  rationale:
    - >-
      A. Decidable both ways: EXP-ECDLP-e36df2.success_criterion and
      falsification_criterion jointly define four disjoint, pre-registered
      outcomes -- supported (both rho_hat_x and rho_hat_y's 95% CIs contain
      1 and exclude any value >= 3, with the positive control and s_rand
      controls both passing), falsified (either CI's lower bound >= 3
      jointly with one-sided Poisson p < 0.01, with both controls passing),
      split/inconclusive (the two independently-realized sections disagree
      in verdict), and instrument invalidation (a Stage 0 mismatch, the
      positive control's screen failing to flag its known m=2 coincidence,
      or s_rand's CI excluding 1). No branch is silently unfalsifiable, and
      none of the four outcomes is guaranteed by the contract's own design.
    - >-
      B. The positive-control curve's dual role is actually wired into the
      criteria, not merely described: the engineered curve (A=5, B=10,
      x0=1, y0=4, lambda=1, 2S^=(-1,-2)) must be flagged 4/4 by the
      cross-prime screen at m=2 (an instrument-validity check, failure of
      which invalidates the whole run's claim-3 reading regardless of
      rho_hat_x/rho_hat_y), AND its own non-m=2 multiples are pooled into
      the main s_x/s_y/s_rand statistics alongside the 20 original
      instances (added statistical power), exactly as
      IDEA-20260911-2dd68d's minimal_test specified.
    - >-
      C. Stage 0 is a genuine blocking gate, not advisory language: the
      pmul-vs-exact-Fraction regression check against EXP-ECDLP-a26bde's
      already-committed m=1..256 raw data is required to show 0 mismatches
      in inputs.procedure, stopping_rules, invalidation_rules, and
      approval_gate simultaneously, and the executor handoff
      (TASK-20260911-9df234) instructs a halt-and-report rather than a
      silent patch-through on any mismatch, before any Stage 2/3 compute
      (the deeper ladder, N_i = ceil(20*p_i) up to ~3.3*10^5 per instance)
      is spent.
    - >-
      D. Schema completeness: EXP-ECDLP-e36df2's REQUIRED experiment
      fields (id, hypothesis_id, version, status, metrics, budget,
      success_criterion, falsification_criterion) are present and
      non-null; approved_by is set to coordinator. H-ECDLP-09125b's
      proof_search_map.not_applicable_reason is filled with a substantive
      justification (a measurement/control repair, not a proof-oriented
      claim) that was checked, not merely asserted, against the risk of
      smuggling a proof claim in via the word "decidable" -- confirmed to
      mean statistical resolving power (a joint alpha=0.01/effect>=3 bar
      against an exact-Poisson CI), not mathematical provability, and no
      theorem is claimed anywhere in either record.
    - >-
      E. Budget is advisory and does not gate this approval: total_cpu_hours
      (6) and maximum_runs (25) are drawn from IDEA-20260911-2dd68d's own
      ~3-6 CPU-hour estimate per docs/research-budget-policy.md /
      CLAUDE.md's "Research budgets: progress first" and require no
      repeated user approval; maximum_memory_gb was raised from
      EXP-ECDLP-a26bde's 4GB to 6GB as a real machine-protection figure,
      justified because the amended ladder is ~5000x longer per instance
      (up to ~19-20 binary doublings) even though per-operation integer
      sizes stay comparable (pmul's O(log m) modular arithmetic does not
      grow with m), and the contract requires the new driver to retain
      only aggregate counts and a bounded flagged-multiple census rather
      than a full per-m table, keeping memory use well inside the declared
      cap. N_i = ceil(20*p_i) itself is frozen as scientific protocol in
      the contract's approval_gate, explicitly not treated as a budget
      figure subject to reduction.
    - >-
      F. Scope and lineage discipline: this approval does not reopen or
      alter H-ECDLP-6a9479 (status stays `analyzed`, claim (3) stays
      `refine`, immutable) or EV-ECDLP-95ec68/DEC-20260911-74c9dc
      (unmodified); it approves a NEW hypothesis (H-ECDLP-09125b) and
      experiment (EXP-ECDLP-e36df2) built specifically to make the same
      underlying question decidable at a resolution the original design
      could not achieve. No attack or exponent claim is made anywhere in
      either new record, consistent with H-ECDLP-6a9479's own "NO ATTACK,
      NO EXPONENT MOVED" scope.
    - >-
      G. Independent-review requirement: this is a toy-scale measurement
      repair asserting neither an attack nor an exponent improvement, and
      it contradicts no existing validated evidence (claims (1),(2),(4) of
      H-ECDLP-6a9479 are untouched and remain `support`-ed strong); it does
      not meet AGENTS.md's review-breakthrough trigger. Ordinary
      Coordinator approval is sufficient; review_plan is null on the
      handoff.
  evidence_refs: [EV-ECDLP-95ec68]
  limitations:
    - "Toy tier throughout: 5 original curves plus 1 engineered curve, primes in [2^10,2^14), no transfer to cryptographic scale claimed or implied."
    - "This experiment can produce evidence for or against H-ECDLP-09125b only; it cannot change H-ECDLP-6a9479's immutable analyzed status or its claim-3 refine carve-out."
    - "A supported outcome would be toy-scale empirical evidence consistent with KN-TECH-73630e's uniqueness theorem, not a new proof of it."
    - "No attack; every multiple tested is generated from a global point whose scalar m is known to the generator."
  next_actions:
    - "Dispatch TASK-20260911-9df234 to the Executor for EXP-ECDLP-e36df2."
    - "On terminal outcomes, run the Coordinator snapshot archive before independent review, then /review-evidence to assign evidence strength and an official decision on H-ECDLP-09125b."
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Pre-execution approval decision; no evidence exists yet to promote or
      decline promoting. This gate applies at the evidence-review decision
      following EXP-ECDLP-e36df2's runs, not here.
  decided_by: coordinator
  decided_at: '2026-09-11'
