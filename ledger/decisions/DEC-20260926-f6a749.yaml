    - id: R-4
      concerns: D-1 and the manifest_v2 supersession.
      ruling: >-
        RATIFY THE CONTENT and BIND BY HASH. The supersession is additive and,
        per its registry note, adds a run block copied or pointed from the
        executor's own keys and carries the executor's manifest verbatim under
        executor_manifest. TASK-20260926-5d1557 binds manifest_v2.yaml and
