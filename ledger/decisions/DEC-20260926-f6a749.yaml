  rationale:
    - >-
      WHY A FULL ROUND. The primary verdicts are exact per-system facts and the
      primary counts sit at a floor or a ceiling of their ranges, so agreement
      between the run and its own aggregation says little. The engine and the
      executor's verifier are not author-independent of the producers, and the
      run's two in-run cross-checks of the engine (C-LIT, C-BACKEND) are
      executor- or engine-side. The two checks that can see a
      wrong-but-self-consistent implementation are the author-independent
      verifier and the blind re-derivation; both are load-bearing here.
    - >-
      JOINT DESIGN. Admissibility: J1 (verifier), J2, J3, J5 (validator), J7
      and J8 (comparator). Recomputation: J4 (validator). Reading: J9-J12 and
      J14, with the proves-too-much and nearby-object control J13 (red team).
      The blind re-derivation J6 is a separate session with the widest
      blind_from. Each joint has exactly one owner. The verifier and the
      re-deriver are separate sessions because the verifier must read the
      claimed refutations and the re-deriver must not. J8 sits with the
      comparator to balance load; it reads no sibling output.
    - >-
      TARGET-PROFILE HONESTY. Toy tier, sota_delta zero; oracle A (2^10
      root-findings per attempt) and parallel rho (about 450 group operations
      at q = 261823) dominate. Refutation degree along the diagonal is
      exponent-adjacent only. The round is sized to the decisions it feeds
      (the N19-DR-9 flag, KN-OPEN-3c8f51 item (B), the CERTBIN rerank), not to
      any cost claim, and the lane stays ranked within CERTBIN, not above
      exponent-targeting ECC work.
    - >-
      CONCURRENCY (machine protection). Reviewers are capped at 3 GB each. On
      the shared 4-core, 15 GB host, at most two of the compute-heavy cards
      (TASK-20260926-f0736e, -401771, -fee7a9) run at once, beside
      TASK-20260926-42be88. Idle capacity does not justify extra work.

