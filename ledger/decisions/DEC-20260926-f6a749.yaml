        prior_commit_bindings without re-staging them, and asserts that
        manifest_v2.yaml hashes to the registry's superseding_sha256
        (153f70c5d7ecf37fdc95f3646b258d08c709c118cba75846cc056a67020cc81f) and
        manifest.yaml to the superseded_sha256 and the d0f80c receipt
        (bb7b6c3992718cf09cac545922888cbc155aa1b834b2488bd37ba60e2dca27ce).
      limits:
        - >-
          run.result.certificate.kind none is the schema's value for "no DLP or
          decomposition certificate"; it does not deny the refutation and
          non-refutation certificates, verified separately (J1). An evidence
          record must not read it as "uncertified".
        - If J5's YAML-level comparison finds any changed value, the ratification lapses and a superseding supersession is written; no file is edited.
    - id: R-5
      concerns: >-
        The executor manifest's own file-hash block. By this Coordinator's
        reading, executor_manifest.files records sha256 and byte counts for
        command.txt and stdout.log that differ from the d0f80c receipt's
        path_sha256 and path_size_bytes for the same paths, both slightly
        smaller.
      ruling: >-
        DOES NOT VOID pending J5. The content-first binding is the receipt; a
        later stage (aggregate, run with --resume after the manifest was
        written) appending one line to each log is the likely explanation. J5
        compares every listed file, explains each mismatch, and confirms that
        no data file differs. A data-file mismatch is a STOP and a return to
        the executor.
    - id: R-6
      concerns: Engine authorship and author independence (DEC-20260924-f5c3f9 R-7).
      ruling: >-
        The author-independent verifier (J1, TASK-20260926-401771) and the
        blind re-deriver (J6, TASK-20260926-f0736e) read none of
        experiments/EXP-CERTBIN-060020/impl/, verifier/,
        src/crypto_autoresearcher/, tools/gf2_replay_rc1.py or
        tests/test_gf2_kernels.py, import no module of crypto_autoresearcher,
        and evaluate over GF(2) with their own code written from the format and
        object specifications. The dispatching session writes and edits no
        reviewer code. The comparator's checkers and third checks are its own
        code; it may READ the producers' code only to localise a disagreement.
    - id: R-7
      concerns: Protected literals and the blind-history check.
      ruling: >-
        No protected literal is supplied out of band: this Coordinator's reply
        may carry no measured value. The protected set is computed by the
        opening archive's script from archived files, by rule. H-1: the
        verdict vocabulary of N19-DR-1..9, all alternatives. H-2: every numeric
        token of decision-rules.json, cell-summary.json and run-report.md minus
        every token of the exclusion corpus (the frozen specification,
        trial-plan-v1.json, H-CERTBIN-e3ac93.yaml, and the text files of the
        experiment's impl/ and verifier/). H-3: opaque labels in digest order.
        Every blind-history check of the round runs over
        fe1080a84f640b3503c6cf5da140ff0c29686e89..HEAD (the executor's launch
        head; everything reachable from it predates every output) with
        --max-commits 5000.
      false_positive_rule: >-
        PRE-AUTHORIZED, mechanical. A hit is a FALSE POSITIVE iff the hit
        commit's message and changed paths contain none of the markers listed
        in blind-phase-hygiene.yaml (060020, a3fc60, e3ac93, 132822,
        certbin-n19, d7249d, f6a749, 901ea1, 091c56, n19, "n = 19", "n=19";
        case-insensitive). If every hit is a false positive, the items are
        removed and recorded under blind_phase_hygiene.removed as {label,
        commits, by: "DEC-20260926-f6a749 R-7"}, and the check is repeated. Any
        other hit is a STOP: no blind reviewer runs on that history until the
        Coordinator decides. The hygiene file is in the re-deriver's
        blind_from.
      cost: >-
        An outcome value equal to a design constant is not protected. The
        re-deriver's card forbids git log / git show beyond orientation, which
        is the primary guard.
    - id: R-8
      concerns: >-
        The contrast pattern described by the dispatching session, and a
        design gap in this Coordinator's contract found while writing the plan.
      finding: >-
        By review-plan D-2, the specification's secondary field ell_route
        (whether 1 is in rowspace(M_4) + ell * B_{<=3}) is equivalent to
        "1 in R'_4" (dims_by_deg(R'_4)[0] = 1): pi maps rowspace(M_4) onto
        rowspace(R'_4), and ker(pi) cap B_{<=4} = ell * B_{<=3}. The contract
        presented ell_route as "one extra elimination"; it adds no independent
        information. Unreviewed derivation; checked by J9.
      ruling: >-
        THE PATTERN IS A JOINT IN ITS OWN RIGHT (J9), not folded into scope
        (J14): a rate that the dimension count said should decay and did not is
        the structural tell of docs/inventor-protocol.md section 3, and it is
        where an engine over-computing W_4, an engine under-computing M_4, a
        construction error or a lenient checker would show. NO PROTOCOL
        AMENDMENT for the ell_route gap (none may be written after data); the
        review uses D-2 as a record-level consistency check (J7, J9).
      proof_status: derivation, written in review-plan derivations_to_check D-2; not yet reviewed.
    - id: R-9
      concerns: C-NONREF declared vacuous.
      ruling: >-
        ACCEPTED AS DECLARED under the frozen rule ("VACUOUS if W_4 refutes all
        of S3-U400"). Consequence, stated plainly: DEC-20260924-f5c3f9 R-8's
