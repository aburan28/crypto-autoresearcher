        code so that control non-refutations can rest on a checked derivation
        (D-3, T5) where one applies.
    - id: R-10
      concerns: Verification computations of the review.
      ruling: >-
        AUTHORIZED, with no RUN id and outputs only under each reviewer's write
        scope: J1's rebuilds, exhaustive satisfiability, certificate checks, M_4
        witnesses and negative controls; J6's re-derivation on the 90-system
