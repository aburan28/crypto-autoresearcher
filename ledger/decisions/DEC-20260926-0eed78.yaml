    - id: R5
      subject: blind hygiene
      ruling: >-
        Unlike BATCH-09aadd, this round has protected literals at opening: the
        control integers that the BATCH-09aadd validator and blind re-deriver
        computed for the d1d10 recipes. The revision keeps those recipes, so
        those integers are this round's answers.
        coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/batch.yaml
        names exactly which literals are protected. The top-level session
        computes their sha256 digests and writes them into
        blind_phase_hygiene.protected_sha256 before TASK-20260926-4d156e
        commits. Labels only, never a plaintext value. Until they are written,
        the blind-history check reports UNCHECKABLE and TASK-20260926-bd9417
        may not be dispatched.
        Before TASK-20260926-bd9417 is dispatched, the session also does two
        things. (a) It runs --blind-history against both this batch.yaml and
        coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/batch.yaml,
        on the exact ref the re-deriver will run on. (b) It hashes every token
        of the draft amendment and of the design report against both digest
        sets. A hit is a leak: the draft goes back for revision and is never
        edited in place, and TASK-20260926-bd9417 is not dispatched.
    - id: R6
      subject: route (amendment or successor experiment)
      ruling: >-
        The default route is a new additive amendment at
        experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml.
        DEC-20260923-a4c3d5 lets the design propose a successor experiment under
        H-AUXIN-6db354 instead, if the amendment route cannot carry it. If the
        producer so finds, it STOPS before writing any protocol file and writes
        only its design report, with route_ruling successor_experiment and its
        reasons. The top-level session then mints an EXP id and records a queue
        revision (BATCH-2fc87b-rev-N) BEFORE any successor file is written. The
        revision retargets the producer's write_scope and artifact_paths, the
        snapshot, and the reviewers' and re-deriver's read scopes. The producer
        then resumes. The plan's joints and keys apply unchanged to whichever
        file governs (plan key K-route).
      rationale: >-
        Paths are fixed on the cards before anything is written, as in
        BATCH-09aadd-rev-1. No undeclared file can exist.
    - id: R7
      subject: tool provisioning versus text defects
      ruling: >-
        Plan key K-provision. DEC-20260923-a4c3d5 itself classifies the absence
        of GMP-ECM and PARI/GP (F-J1-1) as a provisioning defect, not a text
        defect. The design card holds no shell and cannot install anything. The
        rule this round follows is below.
        - The reviewer installs the declared versions under scratch and runs
          the admission gate exactly as written. If the gate determines
          admission, the text holds on that point.
        - Absence from the base environment is carried forward as a dispatch
          precondition of any future executor card.
        - A gate the reviewer cannot execute as written, or that does not
          determine admission, is a text break.
        - A reviewer who cannot install at all reads K-infra.
      rationale: >-
        Without this key, the round could refuse a correct text for a condition
        no design act can change. With it, provisioning remains mandatory before
        execution. It is written before the draft exists, so it is not tuned to
        any outcome.
    - id: R8
      subject: who may read the BATCH-09aadd reports
      ruling: >-
        Who may read the BATCH-09aadd reports, which carry control integers:
        - The producer, the validator and the red team may read them, because
          discharging and checking the listed defects requires their findings.
        - The producer may not state any integer from them.
        - The validator builds every control with its own code from the new
          text, and transcribes no integer from any report. Only after
          building may it compare with the BATCH-09aadd values, and it reports
          that comparison as a separate cross-round regression item.
        - The blind re-deriver reads none of them.
      rationale: >-
        J4 is this round's independent signal. J3 reading prior findings weakens
        J3 as an independent implementation. That is disclosed as PD-R1b in the
        plan, and the J3/J4 comparison is read accordingly.

