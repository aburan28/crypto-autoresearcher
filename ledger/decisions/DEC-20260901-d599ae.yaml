    another round of analysis. Every subsequent piece of work on this
    thread (trigger-search rounds seven through fifteen, the compact z_R
    construction chain, DEC-20260831-054c31, DEC-20260831-169dc8) has
    correctly and consistently carried BOTH readings in parallel rather than
    picking one, and has exhausted its search under both: nine consecutive
    disjoint trigger-search literatures converged on a stable, small set of
    failure modes with no new class since round fourteen; the compact z_R
    construction avenue derived a method-class ceiling for recursive
    meet-in-the-middle and closed the Wagner-style generalized-birthday
