  rulings_on_relayed_items:
    S-1: >-
      The binding digest of the carried J9 computations.json is the
      64-character fb5bffe2f11e55a5fc6c0467c91faff7771702b36c7972c76ca7e9ff75f058c4
      of TASK-20260925-a9c531's path_sha256, equal to DEC-20260925-41f6dc line
