  rationale:
    - id: R-J2
      text: >-
        J2 BREAKS on the plan's breaking artifact "any time figure in force
        without its memory figure". Three groups are WITHOUT even under the
        producer's broader same-field rule: J2-D1, the carried 186.307 in
        spec inputs.fixture_target.source_status (lines 240-242, present since
        version 1); J2-D2, the restated target in hypothesis version_3
        proof_search_map.baseline_embedding.reproduction_check (lines
        1419-1425); J2-D3, the 89 A(571, m) figures of the C-4 log embedded in
        the audit sheet (lines 1056-1086), whose memory the producer supplies
        only by pointer (DF-A571), and which spec MI-1.direction cites. J2-D4
        (8 places) and J2-D5 (13 places) break under the plan's frozen literal
        WITH rule only. What holds: RD-2 and RD-3 are discharged; RD-9's SN-1
        memory at 409 is discharged; every stated memory figure is correct at
        its own point (77 distinct values, max difference 0.0049 bit; every
        variable count exact, N5 = 5139); the parallelization statement
        (UNOWNED-3) is present.
    - id: R-J4
      text: >-
        J4 BREAKS on RD-6 at one of the three places DEC-20260925-41f6dc
        names: the audit sheet's audits.A5 L-INT_version_3 multipliers.M7
        binomial example (lines 1747-1756) says the binomial reading "grows
        faster only up to some degree and places D* later for crossings above
        it". PTM-I refutes it at every m in 7..30 (it conflates the per-step
        crossover with the cumulative crossover) and at an actual crossing of
        the contract's own MI-1 table (K-571, m = 8), where the binomial
        reading places the crossing earlier (OBJ-J4-0). The worksheet's
        rd6_search.result ("No in-force sentence states a one-way direction
        for M7") is false on its face. RD-5 holds (lower edge removed from
        H1's statement, falsifier and H5; E2's "+ 1" routes a degree at D*_M
        correctly); O-J4-2 and O-J4-3 are answered.
    - id: R-J7
      text: >-
        J7 BREAKS under the reading ruled in S-3. The owner reports J7 holding
        under the contract's cross-referenced reading and breaking under the
        literal one. Literally, IR-1's runs/ whitelist forbids opening
        COST-SEMBIN-8d123b, which SN-1, row selector RS-2 and C-XDEG require,
        so a valid run breaches IR-1 or degrades SN-1 and reroutes P-A
        (O-RT-01); and protocol_success's "VALID iff" names no invalidation
        rule, so runs that V-6 or V-11 invalidate read VALID (O-RT-02). Each
        meets the plan's J7 breaking artifact. Otherwise J7 holds: 92 of 92
        hunks map to a declared item, no "What holds" item regressed, no
        stale rule id, C1 to C7 discharged in substance, O-J7-1 answered and
        true.
    - id: R-HOLDING-JOINTS
      text: >-
        J1 holds (coverage gate 67 of 67 cases as expected, including 15 of
        15 omissions and 15 of 15 removed primary curves, and PASS on the
        unmodified input with CR-1 to CR-3 in play; CB-1 pinned and
        import-safe; CO-1 changes no row; D-CARRY clean). J3 holds (MI-1's
        consequence disclosed at 571, 283 and 359 with direction LOWER; the
        fixture passes as frozen with 283 slack 2.16e-5 bit and fails under
        every wrong reading tested). J5 holds (scoring at omega 3 only with G4
        gated under MI-1; G4's degree re-derived by two rules; PTM-A to PTM-F
        met). J6 holds (K4 revisit (i) keyed to an external event that can
        occur and can fail; PTM-G met; every D-8 item discharged; RT-4 cannot
        read the ceiled column). J8 holds (custody, approval fields, R-FORM,
        pins, no new validate_ledger error). J11 holds (UNOWNED-4
        non-breaking).
    - id: R-J9
      text: >-
        J9 is APPLICABLE: D-CARRY finds no uncovered difference, the
        independence tool accepted the carried report, and TA-3's J9-read
        clause did not fire. J9 AGREES with version 3 on every Q1 value (eight
        rows, with k and bit length) and every Q2 value under MI-1 (571, 283,
        359, exact on m) within the frozen tolerances, and on the ceiled
        values and runner-up gaps version 3 also prints. K-fixture does not
        fire.
    - id: R-J10
      text: >-
        J10 AGREES with version 3 on every memory figure and integer
        variable count the composer compared (the distinct memory figures J2
        lists; the 30-entry rt4 list and the 8-entry DF-ILL list were not
        re-compared entry by entry, PD-C4), on NF-06 to NF-10, on the
        computable parts of NF-13, and on
        the one M7 range endpoint version 3 prints (QB at m = 12, exact).
        Version 3 freezes no Q3 value. J10 DIVERGES beyond tolerance on NF-11
        (A(571, m) at m = 2 to 6 and the ceiled-minus-MI-1 drop) and on parts
        of NF-05 (n = 79 ceiled C_I; n = 163 ceiled runner-up), entirely
        through its Q0-01: J10 adopted the Section 4.5.2 first-order P form
        that the blind inputs pinned, version 3 uses eq. (11). Adding J10's
        own reported Q0-01 shifts to its adopted values reproduces version
        3's printed values at every checked cell. NF-01 to NF-04 and NF-14
        are NOT BLIND-RE-DERIVED (inputs not whitelisted, or not separable);
        J1 re-derived NF-01 to NF-03 and NF-14 non-blind.
    - id: R-K-INDETERMINATE
      text: >-
        K-INDETERMINATE FIRES on Q0-01, condition C2. The published text
        admits both P forms (J10 Q0-01; J9 Q0-2). Version 3 pins eq. (11) in
        definitions.A (spec line 458) but declares no numbered
        model-identification choice for it and discloses no consequence, as
        MI-1 does for k. Implementations named: J10's j10_compute.py (P =
        2^(mk - n)/m!) and version 3's CB-2 design_figures.py with the frozen
        instrument joint_balance.py log2_yield (P = 1 - exp(-2^(mk - n)/m!)).
        This decision prefers neither. Consequence as J10 reports it: A(571,
        m) moves by up to 0.66 bit at m <= 6; C_I moves by 0.01 bit or more
        only at n = 79 ceiled; one ceiled runner-up changes on an exact tie;
        no integer threshold, argmin, sign or direction changes.
    - id: R-J9-J10
      text: >-
        J9 and J10 AGREE on the Q3 record under matching readings (both used
        the first-order P form): 216 of 216 integer thresholds equal at m = 4
        to 30 over both curves, both cost readings and both k readings; the
        16 lower-edge cells at m = 2 and 3 agree under the contract's rule as
        J9's S17 states it; J9's labelled max-over-m and min-over-m sets
        equal J10's tables. Overturn condition (4) is not met: the threshold
        definition is determined by the text.
    - id: R-GATE
      text: >-
        GATE CHECK passes with no defect. Both gate files are present and
        bound by TASK-20261002-2a3049. 426 of 426 hits disposed under one of
        D1 to D4 (D1 3, D2 0, D3 0, D4 423). Every D4 group basis was
        re-checked against the closed subclasses and eleven hits were opened
        at source; no misclassification found (PD-C3 discloses the method).
        GD-01's illustrative reading of D4b is accepted. NF definitions are
        transcribed or flagged (NF-04 not separable; NF-13 partial).
        Procedure finding: GD-04 (A(n, m) not transcribed, as the plan did
        not require for an unchanged definition) is the route by which J10
        evaluated A under the other P form; the next plan pins or transcribes
        the P form.
    - id: R-DISCHARGE
      text: >-
        DISCHARGE CHECK fails on RD-6 (its mapped clause includes the audit
        L-INT M7 sentence J4 refutes) and RD-9 (its mapped c8_sweep is
        incomplete per J2). RD-1 to RD-5, RD-7 and RD-8 map to clauses their
        owners do not contradict. Every non-breaking item and CO-1 is
        answered. Every "What holds" change is in constants_delta with its
        forcing item except O-J4-2's additions (O-RT-06, minor). The producer's
        OI-1 reading (non-breaking items may force additive, listed changes)
        is accepted.
    - id: R-KEYS
      text: >-
        Keys applied as written. K-approve not met. K-revise-defect fires (J2,
        J4, J7; RD-6, RD-9). K-indeterminate fires (Q0-01, C2). Not fired:
        K-fixture, K-carry-broken, K-leak (no BL-4 leak, no exposure, D3 0),
        K-duplicate, K-impediment, K-infra. No tripwire TA-1 to TA-5 fired.
        No relaxation and no protocol amendment.
    - id: R-STATUS
      text: >-
        NO STATUS CHANGES. EXP-NISTBIN-451dfa stays review_required with
        approved_by null; H-NISTBIN-dec5e1 stays specified. No record is
