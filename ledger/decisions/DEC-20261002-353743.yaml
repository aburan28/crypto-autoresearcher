      inserted ninth character; it is not a sha256 and its non-match is not a
      custody mismatch. TASK-20261002-b68b72 compares against the 64-character
      value.
    S-2: >-
      (a) Outcome-class reachability from the closed forms is ACCEPTED as a
      design finding for the revision, not a key: D-10 already says P-C's
      class is fixed once F1 passes but not which classes a valid run can
      reach. The revision states reachability per branch without presenting
      any class as a finding, removes or marks unreachable branches
      (including the K4 branch whose revisit RD-7 rekeyed), and states the
      decision value of execution now that the threshold table has been
      blind-derived twice with full agreement. No class is restated here.
      (b) P-S at (K-571, m = 3) is ACCEPTED as an unowned material defect,
      corroborated by J10's blind Q3 table: the carried prediction's
      "non-negative per m" is false at that entry; L-SPREAD is scoped to
      crossings at D >= 4 and P-S must be scoped the same way. Not a key (no
      owning joint reported it as breaking). (c) The plan's PTM-I known_truth
      wording conflates per-step and cumulative growth, as does the QB
      definition's "grows more slowly"; both reviewers computed both, so no
      verdict rests on it. The next plan words it as the cumulative crossover
      and names the per-step degree separately. The plan is not edited.
    S-3: >-
      The literal reading governs a frozen contract's operative validity and
      input rules: an Executor and a Validator apply them as written and may
      not supply a purposive reconstruction (no relaxation, CV3-7). J7
      therefore breaks on O-RT-01 and O-RT-02. O-RT-05 is a design-time
      provenance condition (C4's read-at-source limb) whose substance an
      independent reviewer verified at source; it is non-breaking and its
      repair is a provenance note. Disclosed: DEC-20260925-41f6dc composed J7
      as holding with O-RT-01 to O-RT-03 present in the same words; this
      ruling answers an explicitly raised reading question, and it is
      outcome-neutral here because revise follows from J2 and J4 alone.
    S-4: >-
      (a) PD-V3-1 (TASK-20261002-3de9d2 exported two whole git trees into its
      scratch and filled the shared disk for about 11 minutes) is
      infrastructure and procedure, never evidence. The copies may have
      included excluded or blind_from paths; the reviewer attests none was
      opened, listed, grepped, hashed or displayed and that all were deleted,
      and every check was re-run in place. J2 and J8 are admitted as served.
      J10's blindness is unaffected (whitelist-only sources attested; no
      computation reached it). Later cards on this goal prohibit whole-tree
      exports (machine protection). (b) PD-SNAP-1 (whole-file pre-gate
      digests recorded only after the gate) is a disclosed procedure
      deviation with adequate substitute evidence; TA-5 did not fire and four
      reviewers reproduced the receipt's digests.

