  rationale:
    - PRODUCER-POLICY-RESOLUTION-BINDING is structurally closed for the coordinator role's Bash-less tool surface; independently confirmed by both reviewers.
    - HA2-EXPECTATION-NOT-TAIL is closed by an independently-recomputed, airtight five-lemma proof that no non-vacuous familywise tail is derivable from HA-2/HA-3 as committed, explicitly not a closure of the underlying capacity-adequacy problem.
    - SYSTEM-PEAK-LIVE-CONCURRENCY now uses the correct time-aligned aggregate rule, with all six KATs independently recomputed as genuine discriminators.
    - >-
      A. Markov-bound serialization mislabel: 3 of 5 tuplewise-Markov rows
      match half-up rounding, not the stated truncation. Numbers correct,
      derivation label wrong.
    - >-
      B. Bit-width arithmetic error: "14-bit index" should read "13-bit"
      (2^13=8192 >= 8185); new to this successor, affects only a
      not-taken-route's forward guidance.
    - >-
      C. Peak-KAT suite coverage gap: all six KATs test only full-coincidence
      or full-disjointness topologies; a constructed partial-overlap
      counterexample (peak 4) would pass all six while a correct
      implementation is required to catch it.
    - >-
      D. Archive/communication residuals remain opaque scalars while output
      already has a 12-row itemized manifest; the same itemization is
      required for archive and communication.
    - >-
      E. The already-committed snapshot receipt itself carries two false
      provenance claims (its own resolved_model_id, and the repair-commit
      location); corrected directly via CORR-20260815-092c9f rather than by
      dispatching another producer successor task.
    - RT-OBJ3 and RT-OBJ4 remain open, non-blocking, and deferred, confirmed not narrowed.
    - Archive, communication, and output overages remain exactly 3256009664, 3285369792, and 7132160 bytes; a new PEAK-AGGREGATE-FIT-UNPROVED residual is honestly disclosed with no numeric figure.
    - RT-OBJ2's closure, the worst-case candidate_index bound [504,1016,2040,4088,8184] against capacity 32, the overflow-invalidation rule, and the DERIV-1 bits=27 literal 0.0000304579734802 all recompute unweakened.

  producer_provenance_note: >-
    The producer task's (TASK-20260815-3f7098, role coordinator) OWN
    resolved_model_id claim (anthropic:claude-opus-5) is NEITHER confirmed
