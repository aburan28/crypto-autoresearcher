  context: >-
    /design-experiment plus /propose-ideas, one cycle. IDEA-20261006-bf2f6a
    is on origin/design/ssi-2f5c3f-cartier and is not on origin/main.
    The question is RQ-PAIR-21313f. No hypothesis or experiment on
    origin/main cites that full id. The branch design/pair-bf2f6a was
    created from origin/main at
    7c15b48908ec601eb513f00c15c9d163cc00869c and the merge of
    origin/main was already up to date. The copied proposal bytes
    hash to blob efc12c8cab615784842c74a2b58b32267736919c.

    The contract freezes E0 as y^2 = x^3 + 1, E1 as y^2 = x^3 + x + 1,
    the least eligible prime below 256, one shared odd prime r, k as
    the order of p modulo r, and d as the splitting-field degree of
    the r-division polynomial. Success is the source idea's prediction
    that k(E0) = k(E1) and d(E0) < d(E1). The concrete negative is
    that the instance exists and d(E0) >= d(E1). No group order was
    computed in this session.

    This session opened KR-RHO-53c89f, KR-RHO-0528e7, KR-RHO-755e35,
    KR-RHO-13bf67, KR-RHO-fb88e6, KR-IC-f5c584, and KR-IC-5931ee.
    Those rows are not a measurement of these four integers. The
    Cartan image is recalled and is not used as support.

    Protocol completeness: inputs, controls, independent variables,
    primary and secondary metrics, replication, budget, stopping
    rules, invalidation rules, success criterion, falsification
    criterion, and required artifacts are all non-null. Success fails
    when the instance exists and d(E0) >= d(E1).

    The same pass files three proposals and does not design them:
    IDEA-20261006-fb040d, IDEA-20261006-783062, and IDEA-20261006-f6419e.

  rationale:
    - The standing authorization already covers a complete experiment protocol, so no per-idea user confirmation was requested.
    - The prediction and the assignment of each observation to a reading row are fixed before any executor run.
    - An instance with d(E0) >= d(E1) is reachable as a recorded outcome, so success is not automatic.
    - The self-check, the 2-torsion check, and the exclusion of r dividing p - 1 are the instrument controls.
    - An empty search is not relabeled as a degree gap.
    - This session did not point-count a curve and did not claim that an exponent moves.

  evidence_refs: []
  limitations:
    - The measurement covers one prime below 256 only. It does not transfer to a cryptographic pairing-friendly prime.
    - An empty search closes nothing about d.
    - Equal k and a smaller d do not yield a discrete logarithm.
    - An instrument failure is not a degree gap.
    - A timeout is failed_infrastructure and is not a mathematical negative.
    - This decision authorizes a later execution. It does not start one.
    - This decision does not edit a goal head.
    - The three new proposals are not hypotheses and are not approved experiments.

  next_actions:
